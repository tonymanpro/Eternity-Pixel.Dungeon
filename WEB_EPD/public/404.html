<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Eternity Pixel Dungeon</title>
  <link rel="icon" href="assets/images/favicon.png">
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    .not-found { min-height: 100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:24px; }
    .not-found-code { font-family:var(--font-pixel); font-size:clamp(48px,12vw,96px); color:var(--accent-ruby); opacity:0.6; margin-bottom:8px; }
    .not-found-title { font-family:var(--font-pixel); font-size:clamp(12px,3vw,20px); color:var(--accent-gold); margin-bottom:16px; letter-spacing:2px; }
    .not-found-desc { font-family:var(--font-mono); font-size:14px; color:var(--text-muted); margin-bottom:36px; }
  </style>
</head>
<body>
<div class="not-found">
  <div class="not-found-code">404</div>
  <h1 class="not-found-title">DUNGEON NOT FOUND</h1>
  <p class="not-found-desc">The page you're looking for has been lost to the depths of the dungeon...</p>
  <a href="index.html" class="btn btn-primary">← Back to Safety</a>
</div>
<script src="assets/js/i18n.js"></script>
</body>
</html>
