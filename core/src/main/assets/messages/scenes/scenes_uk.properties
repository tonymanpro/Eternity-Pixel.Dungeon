scenes.titlescene$changesbutton.title=Оновлення доступне!
scenes.titlescene$changesbutton.versioned_title=Доступне оновлення: %s
scenes.titlescene$changesbutton.desc=Shattered Pixel Dungeon регулярно оновлюється, змінюючи існуючий контент та додаючи новий!\n\nІгровий баланс також часто оновлюються задля того, щоб ніякі предмети/герої/вороги не були надто сильними.\n\nОновлення також включають виправлення багів та інші покращення стабільності гри.
scenes.titlescene$changesbutton.update=На сторінку оновлень
scenes.titlescene$changesbutton.changes=Екран останніх змін
scenes.titlescene.patreon_body=Shattered Pixel Dungeon - це повністю безкоштовна гра, що означає, що я залежатиму від підтримки щедрих гравців, які дозволять мені покращувати гру.\n\nЯкщо ви зацікавлені в підтримці, найкращий спосіб зробити це - через Patreon. Patreon дає мені помітне джерело доходу і дозволяє мені чимось віддячити тому, хто підтримує мене!\n\nСпонсори отримуватимуть ексклюзивні повідомлення в блогах щотижня, які дадуть їм знати, над чим я працюю, швидше за всіх!\n\nВи можете ознайомитися з моєю сторінкою Patreon для отримання найновішої інформації про переваги.\n\n(Нагороди Patreon доступні лише англійською мовою)
scenes.titlescene.patreon_button=Сторінка на Patreon

scenes.welcomescene.update_intro=Shattered Pixel Dungeon оновлено!
scenes.welcomescene.update_msg=Версія 3.3 включає тестову зону для майбутнього оновлення міських завдань, нові предмети та низку дрібних виправлень і поліпшень.
scenes.welcomescene.patch_intro=Shattered Pixel Dungeon пропатчено!
scenes.welcomescene.patch_bugfixes=Цей патч включає в себе виправлення помилок.
scenes.welcomescene.patch_translations=Цей патч включає в себе покращення перекладу.
scenes.welcomescene.patch_balance=Цей патч містить зміни ігрового балансу.
scenes.welcomescene.patch_msg=Цей патч також містить деякі невеликі зміни та покращення продуктивності.
scenes.welcomescene.what_msg=Схоже, що ваші файли збереження із майбутньої версії Shattered Pixel Dungeon!\n\nПопередження! Ваші збереження можуть містити речі,яких немає у цій версії Shattered Pixel Dungeon ,що може викликати дивні помилки та інші проблеми.
scenes.welcomescene.lang_warning_title=Незавершений переклад
scenes.welcomescene.lang_warning_msg=Деякий новий контент із цього оновлення ще не перекладено.\n\nДеякі фрази можуть бути написані англійською.\n\nКоманда перекладу працює над вирішенням цього, повний переклад буде готовий незабаром.\n\nДякуємо за ваше терпіння.
scenes.welcomescene.continue=Продовжити
scenes.welcomescene.changelist=Список змін
scenes.welcomescene.save_warning=Процес Shattered Pixel Dungeon було перервано під час нещодавньої спроби зберегти ваші дані гри. Shattered має вбудований захист від цього, тому ваші ігрові дані, ймовірно, в порядку.\n\nЗазвичай це трапляється, коли ваш пристрій раптово втрачає живлення або якщо він завершує роботу Shattered, не закриваючи його належним чином. Функції економії заряду акумулятора часто можуть викликати це на мобільних пристроях. Перезавантаження вашого пристрою також може допомогти, якщо ви часто зтикаєтеся з цією помилкою.
scenes.welcomescene.controller_title=Введення контролером
scenes.welcomescene.controller_body=Граєте на контролері? Використовуйте правий джойстик для керування екранним курсором.\n\nНатисніть RT/R2 або правий джойстик, щоб обрати курсором.
scenes.welcomescene.controller_okay=Добре

# Eternity PD Fallback Keys
scenes.heroselectscene.weekly=Weekly Run
scenes.heroselectscene.weekly_desc=Every week a new game is available that is the same for everyone! This 'weekly run' generates the same dungeon for every person who plays it (so long as they are also playing the same game version).\n\nYou can take as long as you like to complete a weekly run, but can only have one active at a time. _Weekly runs are not eligible for badges and have their own separate rankings page._\n\nWeekly runs includes stronger mobs with an additional 2.5x multiplier to your score regardless if you win or not.\n\nWould you like to start this week's run with your currently selected hero and challenges?
scenes.heroselectscene.weekly_yes=Yes
scenes.heroselectscene.weekly_no=No
scenes.heroselectscene.weekly_repeat=You have already played this week's run. You can replay it if you like, but only as an unranked practice run.\n\nAfter you complete the replay, you will be able to view it from the weekly rankings window for a short time before the record is deleted.\n\nWould you like to replay this week's run with your currently selected hero and challenges?
scenes.heroselectscene.weekly_unavailable_long=It seems you've started a weekly that's in the future! This can happen if you recently changed timezones, or if you changed your system clock. _Your next weekly run will be available in %d weeks._
scenes.heroselectscene.weekly_existing=You already have a weekly run in progress. You must end that run before starting another weekly.
scenes.heroselectscene.weekly_nowin=Every week a new game is available that is the same for everyone! This 'weekly run' generates the same dungeon for every person who plays it (so long as they are also playing the same game version).\n\n_You must win at least one game before you are able to play weekly runs._
scenes.heroselectscene.rename_hero_desc=You can rename your hero whatever you want, as long as it is not against something or someone.
