scenes.supporterscene.title=Stöd spelet
scenes.supporterscene.intro=Jag vill att Shattered Pixel Dungeon ska vara så fritt från reklam och invasiva mikrotransaktioner som förstör så många gratis spel. Istället frågar jag hellre spelare att stötta spelet direkt!
scenes.supporterscene.patreon_msg=Om du gillar Shattered och vill hjälpa mig att fortsätta utveckla spelet, överväg att stödja mig på _Patreon!_ Patreon erbjuder en rad exklusiva förmåner!\n_- Tidig tillgång_ till betaversioner av kommande uppdateringar.\n_- Veckovisa minibloggar_ med information om vad jag arbetar med.\n_- Månatliga omröstningar_ som direkt påverkar innehållet jag utvecklar.\n_- Fysiska belöningspins_ efter 1, 2 och 3 års stöd.\n_- En gemenskaps-Discord_ med en utvecklingslogg och chattkanaler.\n\n_Och mycket mer!_ Du kan besöka Patreon-sidan för mer information. Tack för din tid och lycka till med utforskandet av fängelsehålan!
scenes.supporterscene.patreon_english=(Observera att Patreon-belöningar endast är tillgängliga på engelska.)
scenes.supporterscene.supporter_link=Gå till Patreon-sidan

scenes.surfacescene.exit=Spelet är slut

