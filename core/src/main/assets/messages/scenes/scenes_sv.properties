scenes.heroselectscene.seedfinder_nowin=You can use Seedfinder to _search for a custom seed_ with certain items according to your input, _scout a custom seed_ for all items, or _scout today's Daily Run_. Note that the same seed and game version always generate the same dungeon!\n\n_You must win at least one game before you are able to use the Seedfinder._
