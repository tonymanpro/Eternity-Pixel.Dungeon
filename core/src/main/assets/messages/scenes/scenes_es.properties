scenes.titlescene$changesbutton.title=¡Hay una actualización disponible!
scenes.titlescene$changesbutton.versioned_title=Actualización disponible: %s
scenes.titlescene$changesbutton.desc=Eternity Pixel Dungeon se actualiza regularmente con revisiones al contenido del juego existente o contenido completamente nuevo.\n\nEl balance del juego también se mejora con frecuencia en las actualizaciones del juego, para que ningún ítem/héroe/enemigo sea demasiado fuerte o demasiado débil. \n\nLas actualizaciones también incluyen correcciones de errores y otras diversas mejoras de estabilidad.
scenes.titlescene$changesbutton.update=Ir a la página de actualización
scenes.titlescene$changesbutton.changes=Pantalla de cambios actuales
scenes.titlescene.patreon_body=Eternity Pixel Dungeon es un juego completamente gratuito, lo que significa que cuento con el apoyo de jugadores generosos para seguir haciéndolo.\n\nSi estás interesado en apoyarme, la mejor manera de hacerlo es a través de Patreon. ¡Patreon me da una fuente de ingresos constante y me permite devolver algo a quienes me apoyan!\n\n¡Los usuarios obtienen publicaciones de blog exclusivas cada semana que les permiten saber en qué estoy trabajando antes que nadie!\n\nPuede consultar mi página de Patreon para obtener la información más actualizada sobre los beneficios. ¡Gracias por su consideración!\n\n(Las recompensas de Patreon solo están disponibles en inglés)
scenes.titlescene.patreon_button=Pagina de Patreon

scenes.welcomescene.update_intro=¡Eternity Pixel Dungeon ha sido actualizado!
scenes.welcomescene.update_msg=v.2.5.0 incluye una remodelación total al diario, nuevos ornamentos y un montón de ajustes menores y cambios de balance.\n\nAdemás hay nuevo arte de portada para cada región de la mazmorra, ¡visibles durante las pantallas de carga! Asegúrate de consultar la pantalla de cambios para obtener todos los detalles.
scenes.welcomescene.patch_intro=¡Eternity Pixel Dungeon ha sido parcheado!
scenes.welcomescene.patch_bugfixes=Este parche contiene corrección de errores.
scenes.welcomescene.patch_translations=Este parche contiene actualizaciones de traducción.
scenes.welcomescene.patch_balance=Este parche contiene ajustes en el balance del juego.
scenes.welcomescene.patch_msg=Este parche también contiene pequeñas ajustes y mejoras de rendimiento.
scenes.welcomescene.what_msg=¡Parece ser que tus ficheros actuales son de una versión futura de Eternity Pixel Dungeon!\n\n¡Manéjese con cuidado! Tus ficheros podrían contener cosas que no existen en esta versión, esto podría ocasionar que ocurran errores muy raros.
scenes.welcomescene.lang_warning_title=Traducción Incompleta
scenes.welcomescene.lang_warning_msg=Algunas cosas de esta nueva actualización aún no se han traducido.\n\nAlgunas frases puede que estén escritas en inglés.\n\nEl equipo de traducción está trabajando en resolver esto y dentro de poco debería estar disponible de forma completa.\n\nGracias por tu paciencia.
scenes.welcomescene.continue=Continuar
scenes.welcomescene.changelist=Lista de cambios
scenes.welcomescene.save_warning=Eternity Pixel Dungeon ha sido interrumpido mientras intentaba guardar tus datos de juego recientemente. Shattered tiene protecciones integradas contra esto, por lo que tus datos de juego deberían de estar bien.\n\nEsto suele ocurrir cuando su dispositivo se apaga repentinamente, o si termina Shattered sin dejar que se cierre correctamente. Las funciones de ahorro de energía a menudo pueden causar esto en los dispositivos móviles. Reiniciar tu dispositivo puede ser de ayuda si este error ocurre frecuentemente.
scenes.welcomescene.controller_title=Entrada del joystick
scenes.welcomescene.controller_body=¿Jugando con joystick? Usa el analógico derecho para controlar un puntero en pantalla.\n\nPulsa RT/R2 o el analógico derecho para seleccionar con el puntero.
scenes.welcomescene.controller_okay=Ok

scenes.heroselectscene.weekly=Partida Semanal
scenes.heroselectscene.weekly_desc=¡Cada semana hay disponible una partida fija y compartida para todos los jugadores! Esta "partida semanal" genera la misma mazmorra para todos (con la misma versión del juego).\n\nLos enemigos tienen más salud y otorgan un multiplicador de puntuación de 2.5x.\n\n¿Te gustaría comenzar la partida semanal con el héroe y desafíos seleccionados?
