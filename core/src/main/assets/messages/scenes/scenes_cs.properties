scenes.titlescene$changesbutton.title=Je k dispozici aktualizace!
scenes.titlescene$changesbutton.versioned_title=Dostupná aktualizace: %s
scenes.titlescene$changesbutton.desc=Shattered Pixel Dungeon je pravidelně aktualizován o změny ve stávajícím obsahu nebo rozšiřován o obsah zcela nový!\n\nAktualizacemi je často vylepšována vyváženost hry, tak aby konkrétní předměty / hrdinové / nepřátelé nebyli příliš silní nebo příliš slabí.\n\nVětšinou také zahrnují opravy chyb a různě zlepšují stabilitu hry.
scenes.titlescene$changesbutton.update=Přejít na aktualizaci
scenes.titlescene$changesbutton.changes=Seznam aktuálních změn
scenes.titlescene.patreon_body=Shattered Pixel Dungeon je hra zcela zdarma, což znamená, že závisím na podpoře štědrých hráčů, abych mohl ve vývoji dál pokračovat.\n\nPokud máš zájem podpořit mě, nejlepší cesta k tomu je skrze Patreon. Patreon mi dává pravidelný zdroj příjmů a umožňuje mi dát i něco zpět těm, kteří mě podporují!\n\nPatreon podporovatelé získají přistup k týdenním exkluzivním článkům, díky kterým zjistí na čem pracuji, dříve než kdokoliv jiný!\n\nMůžeš se podívat na mou Patreon stránku, kde najdeš nejaktuálnější informace o výhodách. Děkuji ti za tvou trpělivost!\n\n(Patreon odměny jsou dostupné pouze v angličtině)
scenes.titlescene.patreon_button=Patreon stránka

scenes.welcomescene.update_intro=Shattered Pixel Dungeon byl aktualizován!
scenes.welcomescene.update_msg=v3.3 představuje testovací prostory pro nový úkol ve městě, nové předměty a několik menších úprav a zlepšení.
scenes.welcomescene.patch_intro=Shattered Pixel Dungeon byl opatchován!
scenes.welcomescene.patch_bugfixes=Tento patch obsahuje opravy drobných chyb.
scenes.welcomescene.patch_translations=Tento patch obsahuje aktualizace jazykových překladů.
scenes.welcomescene.patch_balance=Tento patch obsahuje změny zlepšující vyváženost hry.
scenes.welcomescene.patch_msg=Patch také obsahuje pár malých změn a zlepšuje výkon hry.
scenes.welcomescene.what_msg=Zdá se, že tvé současné uložené pozice jsou z budoucí verze Shattered Pixel Dungeon!\n\nPokračuj opatrně! Tvé uložené pozice mohou obsahovat věci, které v této verzi neexistují, což může způsobit výskyt velmi zvláštních chyb.
scenes.welcomescene.lang_warning_title=Nekompletní překlad
scenes.welcomescene.lang_warning_msg=Některý nový obsah z této aktualizace ještě nemusel být přeložen.\n\nNěkteré fráze mohou být napsány v angličtině.\n\nPřekladatelský tým se snaží tento problém vyřešit a brzy bude skrze patch poskytnut úplný překlad.\n\nDíky za tvou trpělivost.
scenes.welcomescene.continue=Pokračovat
scenes.welcomescene.changelist=Seznam změn
scenes.welcomescene.save_warning=Shattered Pixel Dungeon byl nedávno přerušen při pokusu o uložení herních dat.\n\nShattered má proti tomu zabudovanou ochranu, takže vaše herní data jsou pravděpodobně v pořádku. Pro jistotu si to ale můžete zkontrolovat.\n\nObvykle se to stává, když vaše zařízení náhle ztratí napájení nebo když ukončí hru Shattered, aniž by ji nechalo řádně zavřít. V mobilních zařízeních to často způsobují funkce pro úsporu baterie. Pokud tuto chybu vidíte často, mohl by pomoct restart zařízení.
scenes.welcomescene.controller_title=Ovládání ovladačem
scenes.welcomescene.controller_body=Hraješ pomocí ovladače? Použij pravou páčku jako kurzor na obrazovce.\n\nStiskni RT/R2 nebo pravou páčku pro vybrání kurzorem.
scenes.welcomescene.controller_okay=Dobře

# Eternity PD Fallback Keys
scenes.heroselectscene.weekly=Weekly Run
scenes.heroselectscene.weekly_desc=Every week a new game is available that is the same for everyone! This 'weekly run' generates the same dungeon for every person who plays it (so long as they are also playing the same game version).\n\nYou can take as long as you like to complete a weekly run, but can only have one active at a time. _Weekly runs are not eligible for badges and have their own separate rankings page._\n\nWeekly runs includes stronger mobs with an additional 2.5x multiplier to your score regardless if you win or not.\n\nWould you like to start this week's run with your currently selected hero and challenges?
scenes.heroselectscene.weekly_yes=Yes
scenes.heroselectscene.weekly_no=No
scenes.heroselectscene.weekly_repeat=You have already played this week's run. You can replay it if you like, but only as an unranked practice run.\n\nAfter you complete the replay, you will be able to view it from the weekly rankings window for a short time before the record is deleted.\n\nWould you like to replay this week's run with your currently selected hero and challenges?
scenes.heroselectscene.weekly_unavailable_long=It seems you've started a weekly that's in the future! This can happen if you recently changed timezones, or if you changed your system clock. _Your next weekly run will be available in %d weeks._
scenes.heroselectscene.weekly_existing=You already have a weekly run in progress. You must end that run before starting another weekly.
scenes.heroselectscene.weekly_nowin=Every week a new game is available that is the same for everyone! This 'weekly run' generates the same dungeon for every person who plays it (so long as they are also playing the same game version).\n\n_You must win at least one game before you are able to play weekly runs._
scenes.heroselectscene.rename_hero_desc=You can rename your hero whatever you want, as long as it is not against something or someone.
scenes.startscene.long_time_ago=Long time ago
scenes.supporterscene.issues_link=Issue Tracker
scenes.supporterscene$supportermessage.intro=Since the ExpPD's explosion in popularity in the last summer, I have gotten many dozens of messages asking for the same things. So I don't want more of them.
scenes.supporterscene$supportermessage.patreon_msg=Frequently suggested/reported things (do not send me emails or reviews about them):
scenes.supporterscene$supportermessage.patreon_english=- Spanish/Russian language support\n- Latest Shattered support\n- Making the game easier\n- Crashes in first 5 depths\n- Support for multiplayer\n- Features from my other mods\n- Asking about ring of haste speed reduction. It is intentional\n\nAlso check out the issue tracker before sending an issue, because you might send duplicates.
