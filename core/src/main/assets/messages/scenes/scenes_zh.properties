scenes.seedfindscene.info_title=查找器说明
scenes.seedfindscene.info_body=种子查找器有 3 种模式：\n\n_-_ _查找种子：_ 搜索包含你所输入物品的自定义种子。每个物品名称必须单独占一行，并可附带升级等级“+N”。支持部分名称匹配（例如输入“神射 +1”将匹配“神射戒指 +1”）。所有匹配的物品都会被_高亮显示_。\n\n_-_ _侦察种子：_ 侦察自定义种子中的所有物品。以下内容会被高亮显示：_升级卷轴_、_力量药水_、_入口/出口_房间。\n\n_-_ _侦察每日挑战_：侦察今日的每日挑战。\n\n请注意，相同的种子和游戏版本总会生成完全相同的地牢！\n搜索选项可在_种子查找器设置_中更改，并适用于全部 3 种模式。每个非Boss楼层的房间也会被列出，并可通过选项进行搜索。
