scenes.democinematicscene.act0_title=序幕：下水道（第 1-5 层）
scenes.democinematicscene.act0_desc=你勇敢地闯过潮湿的地牢，击败了粘咕！但下水道仅仅是这片广袤地下世界的入口……
scenes.democinematicscene.act1_title=第二幕：监狱（第 6-10 层）
scenes.democinematicscene.act1_boss=BOSS：天狗（暗杀大师）
scenes.democinematicscene.act1_mobs=狱警、死灵法师、骷髅、游荡盗贼
scenes.democinematicscene.act1_desc=受困于腐朽的钢铁与岩石走廊之中，致命的机关与受诅咒的亡魂横亘在你与天狗的致命手里剑弹幕之间。
scenes.democinematicscene.act2_title=第三幕：矿洞（第 11-15 层）
scenes.democinematicscene.act2_boss=BOSS：DM-300（全自动采矿巨兽）
scenes.democinematicscene.act2_mobs=豺狼暴徒、豺狼萨满、洞穴魔蛛、DM-100
scenes.democinematicscene.act2_desc=沿着幽暗水晶矿脉与毒气深入地下，古老的地下机械苏醒过来，以震耳欲聋的巨力碾碎一切入侵者。
scenes.democinematicscene.act3_title=第四幕：矮人都市（第 16-20 层）
scenes.democinematicscene.act3_boss=BOSS：矮人国王（不死君王）
scenes.democinematicscene.act3_mobs=魔像、矮人武僧、矮人术士、不死食尸鬼
scenes.democinematicscene.act3_desc=古老帝国宏伟的废墟殿堂，黄金与鲜血在不朽死灵君王的铁血敕令下交织。
scenes.democinematicscene.act4_title=第五幕：恶魔大厅（第 21-25 层）
scenes.democinematicscene.act4_boss=最终BOSS：YOG-DZEWA（远古邪神）
scenes.democinematicscene.act4_mobs=邪眼、魅魔、巨蝎、撕裂恶魔
scenes.democinematicscene.act4_desc=理智崩塌的灼热深渊。梦魇般的恶魔守卫着古神的沉眠，祂的苏醒将威胁整个现实世界。
scenes.democinematicscene.finale_title=冒险将在《永恒像素地牢》中全面扩展！
scenes.democinematicscene.finale_subtitle=完整版包含内容：
scenes.democinematicscene.finale_desc=• 26 层充满策略深度与随机危机的地牢\n• 拥有荒古狂怒技能的野蛮人英雄\n• 传奇宠物：完整的蝎尾狮三阶段进化\n• 全新隐藏房间、无尽模式、赛季通行证与每日挑战！
