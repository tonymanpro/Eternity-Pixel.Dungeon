scenes.heroselectscene.weekly=每周挑战
scenes.heroselectscene.weekly_desc=每周都会有一场对所有人完全相同的新游戏！这场“每周挑战”会为所有游玩的玩家生成相同的地牢（前提是使用相同的游戏版本）。\n\n你可以花任意长的时间来完成每周挑战，但同时只能进行一场。_每周挑战无法获得徽章，且拥有独立的排行榜页面。_\n\n每周挑战包含更强大的怪物，无论你是否获胜，最终得分都会获得额外的 2.5 倍加成。\n\n你想使用当前选择的英雄和挑战开始本周的每周挑战吗？
scenes.heroselectscene.weekly_yes=是
scenes.heroselectscene.weekly_no=No
scenes.heroselectscene.weekly_repeat=你已经游玩过本周的每周挑战了。如果你愿意，可以重新游玩，但只能作为不计入排名的练习局。\n\n完成重玩后，你可以在记录被删除前的一小段时间内，在每周排行榜窗口中查看该局记录。\n\n你想使用当前选择的英雄和挑战重玩本周的每周挑战吗？
scenes.heroselectscene.weekly_unavailable_long=看起来你开启了一场来自未来的每周挑战！如果你最近更改了时区或修改了系统时钟，就可能发生这种情况。_你的下一场每周挑战将在 %d 周后开放。_
scenes.heroselectscene.weekly_existing=你已经有一场正在进行中的每周挑战。你必须先结束该局游戏，才能开始另一场每周挑战。
scenes.heroselectscene.weekly_nowin=每周都会有一场对所有人完全相同的新游戏！这场“每周挑战”会为所有游玩的玩家生成相同的地牢（前提是使用相同的游戏版本）。\n\n_你必须至少赢得一场游戏，才能参与每周挑战。_
scenes.heroselectscene.rename_hero_desc=你可以随意为你的英雄命名，只要不冒犯他人或违背公序良俗。
