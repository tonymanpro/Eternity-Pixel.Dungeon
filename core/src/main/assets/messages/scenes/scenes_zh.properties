scenes.supporterscene$supportermessage.intro=自从去年夏天 ExpPD 热度暴增以来，我已经收到了几十条询问相同问题的消息。请不要再发重复的问题了。
scenes.supporterscene$supportermessage.patreon_msg=常见建议/反馈事项（请勿就此给我发邮件或在评论中刷屏）：
scenes.supporterscene$supportermessage.patreon_english=- 西班牙语/俄语语言支持\n- 最新破碎版移植支持\n- 降低游戏难度\n- 前5层的闪退问题\n- 多人联机支持\n- 我其他模组中的功能\n- 询问急速戒指的速度削弱（这是有意设计的）\n\n另外，在提交问题之前请先查看问题追踪器，以免提交重复的问题。
