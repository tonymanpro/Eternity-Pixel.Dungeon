scenes.seedfindscene.info_title=Seedfinder Info
scenes.seedfindscene.info_body=Seedfinder has 3 modes:\n\n_-_ _Find Seed:_ Search for a custom seed with items that you input. Each item name must be on its own line, and can have an upgrade number "+N". Partial item names are allowed (e.g. "sharpshooting +1" will match "Ring of Sharpshooting +1"). All matching items will be _highlighted_.\n\n_-_ _Scout Seed:_ Scout a custom seed for all items. The following are highlighted: _Scroll of Upgrade_, _Potion of Strength_, _Entrance/Exit_ rooms.\n\n_-_ _Scout Daily Run_: Scout today's Daily Run.\n\nNote that the same seed and game version always generate the same dungeon!\nSearch options can be changed in _Seedfinder Settings_ and applies to all 3 modes. The rooms on each non-boss floor are also listed and can be searched with an option.
