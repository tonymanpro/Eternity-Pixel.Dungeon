scenes.welcomescene.save_warning=ShatteredPD đã bị chặn khi đang cố lưu lại dữ liệu trò chơi của bạn. Trò chơi đã có biện pháp khác để ngăn chặn điều này, nên dữ liệu của bạn vẫn ổn.\n\nĐiều này thường xảy ra khi thiết bị của bạn đột ngột hết pin, hoặc nó tắt trò chơi mà không để trò chơi tắt đúng cách. Tính năng tiết kiệm pin cũng thường gây ra điều này ở thiết bị di động. Khởi động lại thiết bị của bạn có thể giúp nếu bạn thấy lỗi này thường xuyên xảy ra.
