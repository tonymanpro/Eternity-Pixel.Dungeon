scenes.supporterscene$supportermessage.intro=Since the ExpPD's explosion in popularity in the last summer, I have gotten many dozens of messages asking for the same things. So I don't want more of them.
scenes.supporterscene$supportermessage.patreon_msg=Frequently suggested/reported things (do not send me emails or reviews about them):
scenes.supporterscene$supportermessage.patreon_english=- Spanish/Russian language support\n- Latest Shattered support\n- Making the game easier\n- Crashes in first 5 depths\n- Support for multiplayer\n- Features from my other mods\n- Asking about ring of haste speed reduction. It is intentional\n\nAlso check out the issue tracker before sending an issue, because you might send duplicates.
