scenes.heroselectscene.weekly=每週挑戰
scenes.heroselectscene.weekly_desc=每週都會有一場對所有人完全相同的新遊戲！這場「每週挑戰」會為所有遊玩的玩家生成相同的地牢（前提是使用相同的遊戲版本）。\n\n你可以花任意長的時間來完成每週挑戰，但同時只能進行一場。_每週挑戰無法獲得徽章，且擁有獨立的排行榜頁面。_\n\n每週挑戰包含更強大的怪物，無論你是否獲勝，最終得分都會獲得額外的 2.5 倍加成。\n\n你想使用目前選擇的英雄和挑戰開始本週的每週挑戰嗎？
scenes.heroselectscene.weekly_yes=是
scenes.heroselectscene.weekly_no=No
scenes.heroselectscene.weekly_repeat=你已經遊玩過本週的每週挑戰了。如果你願意，可以重新遊玩，但只能作為不計入排名的練習局。\n\n完成重玩後，你可以在記錄被刪除前的一小段時間內，在每週排行榜視窗中查看該局記錄。\n\n你想使用目前選擇的英雄和挑戰重玩本週的每週挑戰嗎？
scenes.heroselectscene.weekly_unavailable_long=看起來你開啟了一場來自未來的每週挑戰！如果你最近更改了時區或修改了系統時鐘，就可能發生這種情況。_你的下一場每週挑戰將在 %d 週後開放。_
scenes.heroselectscene.weekly_existing=你已經有一場正在進行中的每週挑戰。你必須先結束該局遊戲，才能開始另一場每週挑戰。
scenes.heroselectscene.weekly_nowin=每週都會有一場對所有人完全相同的新遊戲！這場「每週挑戰」會為所有遊玩的玩家生成相同的地牢（前提是使用相同的遊戲版本）。\n\n_你必須至少贏得一場遊戲，才能參與每週挑戰。_
scenes.heroselectscene.rename_hero_desc=你可以隨意為你的英雄命名，只要不冒犯他人或違背公序良俗。
