scenes.seedfindscene.info_title=尋找器說明
scenes.seedfindscene.info_body=種子尋找器有 3 種模式：\n\n_-_ _尋找種子：_ 搜尋包含你所輸入物品的自訂種子。每個物品名稱必須單獨佔一行，並可附帶升級等級「+N」。支援部分名稱匹配（例如輸入「神射 +1」將匹配「神射戒指 +1」）。所有匹配的物品都會被_高亮顯示_。\n\n_-_ _偵察種子：_ 偵察自訂種子中的所有物品。以下內容會被高亮顯示：_升級卷軸_、_力量藥水_、_入口/出口_房間。\n\n_-_ _偵察每日挑戰_：偵察今日的每日挑戰。\n\n請注意，相同的種子和遊戲版本總會生成完全相同的地牢！\n搜尋選項可在_種子尋找器設定_中更改，並適用於全部 3 種模式。每個非Boss樓層的房間也會被列出，並可透過選項進行搜尋。
