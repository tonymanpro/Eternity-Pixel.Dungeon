scenes.democinematicscene.act0_title=序幕：下水道（第 1-5 層）
scenes.democinematicscene.act0_desc=你勇敢地闖過潮濕的地牢，擊敗了黏咕！但下水道僅僅是這片廣袤地下世界的入口……
scenes.democinematicscene.act1_title=第二幕：監獄（第 6-10 層）
scenes.democinematicscene.act1_boss=BOSS：天狗（暗殺大師）
scenes.democinematicscene.act1_mobs=獄警、死靈法師、骷髏、遊蕩盜賊
scenes.democinematicscene.act1_desc=受困於腐朽的鋼鐵與岩石走廊之中，致命的機關與受詛咒的亡魂橫亙在你與天狗的致命手裡劍彈幕之間。
scenes.democinematicscene.act2_title=第三幕：礦洞（第 11-15 層）
scenes.democinematicscene.act2_boss=BOSS：DM-300（全自動採礦巨獸）
scenes.democinematicscene.act2_mobs=豺狼暴徒、豺狼薩滿、洞穴魔蛛、DM-100
scenes.democinematicscene.act2_desc=沿著幽暗水晶礦脈與毒氣深入地下，古老的地下機械甦醒過來，以震耳欲聾的巨力碾碎一切入侵者。
scenes.democinematicscene.act3_title=第四幕：矮人都市（第 16-20 層）
scenes.democinematicscene.act3_boss=BOSS：矮人國王（不死君王）
scenes.democinematicscene.act3_mobs=魔像、矮人武僧、矮人術士、不死食屍鬼
scenes.democinematicscene.act3_desc=古老帝國宏偉的廢墟殿堂，黃金與鮮血在不朽死靈君王的鐵血敕令下交織。
scenes.democinematicscene.act4_title=第五幕：惡魔大廳（第 21-25 層）
scenes.democinematicscene.act4_boss=最終BOSS：YOG-DZEWA（遠古邪神）
scenes.democinematicscene.act4_mobs=邪眼、魅魔、巨蠍、撕裂惡魔
scenes.democinematicscene.act4_desc=理智崩塌的灼熱深淵。夢魘般的惡魔守衛著古神的沉眠，祂的甦醒將威脅整個現實世界。
scenes.democinematicscene.finale_title=冒險將在《永恆像素地牢》中全面擴展！
scenes.democinematicscene.finale_subtitle=完整版包含內容：
scenes.democinematicscene.finale_desc=• 26 層充滿策略深度與隨機危機的地牢\n• 擁有荒古狂怒技能的野蠻人英雄\n• 傳奇寵物：完整的蠍尾獅三階段進化\n• 全新隱藏房間、無盡模式、賽季通行證與每日挑戰！
