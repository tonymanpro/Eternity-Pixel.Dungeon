scenes.supporterscene$supportermessage.intro=自從去年夏天 ExpPD 熱度暴增以來，我已經收到了幾十條詢問相同問題的訊息。請不要再發重複的問題了。
scenes.supporterscene$supportermessage.patreon_msg=常見建議/回報事項（請勿就此給我發郵件或在評論中洗版）：
scenes.supporterscene$supportermessage.patreon_english=- 西班牙語/俄語語言支援\n- 最新破碎版移植支援\n- 降低遊戲難度\n- 前5層的閃退問題\n- 多人連線支援\n- 我其他模組中的功能\n- 詢問急速戒指的速度削弱（這是有意設計的）\n\n另外，在提交問題之前請先查看問題追蹤器，以免提交重複的問題。
