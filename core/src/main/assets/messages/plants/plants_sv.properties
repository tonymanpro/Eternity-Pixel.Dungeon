plants.blandfruitbush.name=faddfrukt
plants.blandfruitbush.desc=Avlägsen kusin till ruttenbäret, den päronformade produktern från faddfruktbusken smakar som gammalt damm. Frukten är grov och obetydlig men är inte giftig. Kanske går den att tillaga.
plants.blandfruitbush.discover_hint=Du kan hitta denna växt slumpmässigt i fängelsehålan.
plants.blandfruitbush$seed.name=frö från faddfrukt

plants.blindweed.name=blindogräs
plants.blindweed.desc=Vid beröring försvinner blindogräs i en stark ljusblixt. Blixten är tillräckligt stark för att desorientera i flera sekunder.
plants.blindweed.warden_desc=_The Warden_  kommer att kanalisera blindogräsets energi till ett tillfälligt hölje av osynlighet, istället för att desorientera.
plants.blindweed$seed.name=frö från blindogräs

plants.mageroyal.name=mageroyal
plants.mageroyal.refreshed=Du känner dig återhämtad.
plants.mageroyal.desc=Mageroyalens taggiga blommor innehåller en kemikalie som är känd för sina starka neutraliserande egenskaper. Allt som kommer i kontakt med denna växt renas från många negativa effekter.
plants.mageroyal.warden_desc=Förutom den neutraliserande effekten blir _Väktaren_ tillfälligt immun mot alla områdesbundna effekter när denne trampar på mageroyal.
plants.mageroyal$seed.name=frö från mageroyal

plants.earthroot.name=jordrot
plants.earthroot.desc=När en varelse vidrör en jordrot skapar dess rötter en slags orörlig naturlig rustning runt om den.
plants.earthroot.warden_desc=Rötterna från en jordrotsväxt kommer att röra sig med _Väktaren_ och tillhandahåller sin portabla barkrustning.
plants.earthroot$seed.name=frö från jordrot
plants.earthroot$armor.name=växtrustning
plants.earthroot$armor.desc=En sorts naturlig, orubblig rustning gjord av bark och bindgarn.\n\nDenna växtrustning blockerar %d skada från fysiska slag tills det så småningom får slut på varaktighet och kollapsar.\n\nDå rustningen är orubblig bryter den isär och försvinner vid förflyttning.\n\nKvarvarande rustning: %d.

plants.fadeleaf.name=flyktlöv
plants.fadeleaf.desc=Alla varelser som rör ett flyktlöv teleporteras till en slumpmässig plats på den aktuella nivån.
plants.fadeleaf.warden_desc=Teleporteringseffekten av ett flyktlöv är mer potent för _Väktaren_, genom att teleportera denne tillbaka till slutet av föregående nivå.
plants.fadeleaf$seed.name=frö från flyktlöv

plants.firebloom.name=eldblomma
plants.firebloom.desc=När något vidrör en eldblomma sätts det i lågor.
plants.firebloom.warden_desc=När denne trampar på en eldblomma kommer _Väktaren_ kortvarigt att genomsyras av lågor istället för att bli skadad.
plants.firebloom$seed.name=frö från eldblomma

plants.icecap.name=ishatt
plants.icecap.desc=Vid beröring släpper en ishatt ut ett bloss av frysande pollen. Fryseffekten är mycket starkare om miljön är blöt.
plants.icecap.warden_desc=När denne trampar på en ishatt kommer _Väktaren_ kortvarigt att genomsyras av frost istället för att skadas.
plants.icecap$seed.name=frö från ishatt

plants.plant.warden_desc=Denna växt har ingen särskilt effekt när Väktaren använder den.
plants.plant.discover_hint=Du kan hitta denna växt slumpmässigt i fängelsehålan eller odla den från dess frö.
plants.plant$seed.seed_of=frö från %s
plants.plant$seed.ac_plant=VÄXT
plants.plant$seed.info=Kasta detta frö på den plats där du vill odla en växt.\n%s
plants.plant$seed$placeholder.name=frö

plants.rotberry.name=rötbär
plants.rotberry.desc=Bären av en ung rötbärsplanta smakar som söt, ljuv död. På några få år kommer denna rötbärsplanta växa till ännu ett röthjärta. När den trampas bildar ett ungt rötbär en liten puff av giftig gas.
plants.rotberry.warden_desc=Normalt bildar en rötbärsbuske endast lite gas väl nedtrampad, men _Väktaren_ kan utvinna energi från det för att tillfälligt öka sin styrka.
plants.rotberry.discover_hint=Du kan odla denna växt från dess frön under ett specifikt uppdrag.
plants.rotberry$seed.name=frö från rötbär
plants.rotberry$seed.discover_hint=Du kan hitta detta föremål under ett specifikt uppdrag.

plants.sorrowmoss.name=vemossa
plants.sorrowmoss.desc=Vemossa är en blomma (inte en mossa) med knivskarpa kronblad, täckta med ett dödligt gift.
plants.sorrowmoss.warden_desc=När denne trampar på en vemossa, kommer _Väktaren_ att kortvarigt genomsyras av gift istället för att skadas.
plants.sorrowmoss$seed.name=frö från vemossa

plants.starflower.name=stjärnblomma
plants.starflower.desc=En sällsynt växt, stjärnblomma sägs ge helig kraft till den som rör vid den.
plants.starflower.warden_desc=Förutom att bli välsignad, kommer _Väktaren_ att få en stor mängd trollstavsladdning när denne trampar på en stjärnblomma.
plants.starflower$seed.name=frö från stjärnblomma

plants.stormvine.name=stormranka
plants.stormvine.desc=Gravitationen påverkar stormrankan konstigt, vilket gör att dess vispiga blå rankor "hänger" i luften. Allt som fångas i rankan påverkas av detta och blir desorienterat.
plants.stormvine.warden_desc=_Väktaren_ kan kontrollera stormrankans gravitationseffekt och kommer att sväva kort när denne trampar på en.
plants.stormvine$seed.name=frö från stormranka

plants.sungrass.name=solgräs
plants.sungrass.desc=Solgräs är känt för dess långsamma men effektiva läkande egenskaper.
plants.sungrass.warden_desc=_Väktaren_ kan bli helad från nedtrampat solgräs även om denne rör sig ifrån det.
plants.sungrass$seed.name=frö från solgräs
plants.sungrass$health.name=örtläkande
plants.sungrass$health.desc=Solgräs har fantastiska helande egenskaper men är mycket långsammare än en helande trolldryck.\n\nDen helande effekten avbryts vid förflyttning. \n\nÅterstående helande: %d.

plants.swiftthistle.name=kvicktistel
plants.swiftthistle.desc=När den trampas på, kommer kvicktisteln kort att accelerera tidsflödet runt sig, vilket gör att tramparen kan utföra flera handlingar omedelbart.
plants.swiftthistle.warden_desc=Förutom att få omedelbara handlingar, kommer _Väktaren_ också att få en kort hastighetshöjning när denne trampar på kvicktisteln.
plants.swiftthistle$seed.name=frö från kvicktistel
plants.swiftthistle$timebubble.name=tidsbubbla
plants.swiftthistle$timebubble.desc=En liten bubbla av accelererad tid som tillåter handlingar att utföras omedelbart. Attackerande eller användning av magi bryter dock denna effekten.\n\nÅterstående turer: %s.

# Eternity PD Fallback Keys
plants.blandfruitbush.name=blandfruit
plants.blandfruitbush.desc=Distant cousin of the rotberry, the pear-shaped produce of the blandfruit bush tastes like caked dust. The fruit is gross and unsubstantial but isn't poisonous. Perhaps it could be cooked.
plants.blandfruitbush$seed.name=seed of blandfruit
plants.blindweed.name=blindweed
plants.blindweed.desc=Upon being touched a blindweed perishes in a bright flash of light. The flash is strong enough to disorient for several seconds.
plants.blindweed.warden_desc=_The Warden_ will channel a blindweed's energy into a temporary shroud of invisibility, instead of being disoriented.
plants.blindweed$seed.name=seed of blindweed
plants.mageroyal.name=mageroyal
plants.mageroyal.refreshed=You feel refreshed.
plants.mageroyal.desc=The mageroyal's prickly flowers contain a chemical which is known for its properties as a strong neutralizing agent. Anything that steps in this plant will be cleansed of many negative effects.
plants.mageroyal.warden_desc=In addition to the neutralizing effect, _the Warden_ will become temporarily immune to all area-bound effects when stepping on mageroyal.
plants.mageroyal$seed.name=seed of mageroyal
plants.earthroot.name=earthroot
plants.earthroot.desc=When a creature touches an earthroot, its roots create a kind of immobile natural armor around it.
plants.earthroot.warden_desc=The roots of an earthroot plant will move with _the Warden_, providing her mobile barkskin armor.
plants.earthroot$seed.name=seed of earthroot
plants.earthroot$armor.name=herbal armor
plants.earthroot$armor.desc=A kind of natural, immobile armor made of bark and twine.\n\nThis herbal armor will block %d damage from any physical hit, until it eventually runs out of durability and collapses.\n\nAs the armor is immobile, moving will cause it to break apart and be lost.\n\nArmor remaining: %d.
plants.fadeleaf.name=fadeleaf
plants.fadeleaf.desc=Touching a fadeleaf will teleport any creature to a random place on the current level.
plants.fadeleaf.warden_desc=The teleportation effect of fadeleaf is more potent for _the Warden_, teleporting her back to the end of the previous dungeon level.
plants.fadeleaf$seed.name=seed of fadeleaf
plants.firebloom.name=firebloom
plants.firebloom.desc=When something touches a firebloom, it bursts into flames.
plants.firebloom.warden_desc=When she tramples a firebloom, _the Warden_ will be briefly imbued with flame instead of being harmed.
plants.firebloom$seed.name=seed of firebloom
plants.icecap.name=icecap
plants.icecap.desc=Upon being touched, an icecap lets out a puff of freezing pollen. The freezing effect is much stronger if the environment is wet.
plants.icecap.warden_desc=When she tramples an icecap, _the Warden_ will be briefly imbued with frost instead of being harmed.
plants.icecap$seed.name=seed of icecap
plants.plant.warden_desc=This plant has no special effect when used by the Warden.
plants.plant$seed.seed_of=seed of %s
plants.plant$seed.ac_plant=PLANT
plants.plant$seed.info=Throw this seed to the place where you want to grow a plant.\n\n%s
plants.plant$seed$placeholder.name=seed
plants.rotberry.name=rotberry
plants.rotberry.desc=The berries of a young rotberry shrub taste like sweet, sweet death. Over a few years, this rotberry shrub will grow into another rot heart. When trampled, a young rotberry will produce a small puff of toxic gas.
plants.rotberry.warden_desc=Normally a rotberry bush only produces a little gas when trampled, but _the Warden_ is able to harness energy from it to temporarily boost her strength!
plants.rotberry$seed.name=seed of rotberry
plants.sorrowmoss.name=sorrowmoss
plants.sorrowmoss.desc=A sorrowmoss is a flower (not a moss) with razor-sharp petals, coated with a deadly venom.
plants.sorrowmoss.warden_desc=When she tramples a sorrowmoss, _the Warden_ will be briefly imbued with toxin instead of being harmed.
plants.sorrowmoss$seed.name=seed of sorrowmoss
plants.starflower.name=starflower
plants.starflower.desc=A rare plant, starflower is said to grant holy power to whomever touches it.
plants.starflower.warden_desc=In addition to being blessed, _the Warden_ will gain a significant amount of wand recharging when she tramples a starflower.
plants.starflower$seed.name=seed of starflower
plants.stormvine.name=stormvine
plants.stormvine.desc=Gravity affects the stormvine plant strangely, allowing its whispy blue tendrils to 'hang' on the air. Anything caught in the vine is affected by this, and becomes disoriented.
plants.stormvine.warden_desc=_The Warden_ is able to control the gravitational effect of stormvine, and will briefly levitate when she tramples one.
plants.stormvine$seed.name=seed of stormvine
plants.sungrass.name=sungrass
plants.sungrass.desc=Sungrass is renowned for its sap's slow but effective healing properties.
plants.sungrass.warden_desc=_The Warden_ can receive healing from trampled sungrass even if she moves away from it.
plants.sungrass$seed.name=seed of sungrass
plants.sungrass$health.name=herbal healing
plants.sungrass$health.desc=Sungrass possesses excellent healing properties, though it is much slower than a potion of healing.\n\nMoving off the plant will break the healing effect.\n\nHealing remaining: %d.
plants.swiftthistle.name=swiftthistle
plants.swiftthistle.desc=When trampled, swiftthistle will briefly accelerate the flow of time around it, allowing the trampler to perform several actions instantly.
plants.swiftthistle.warden_desc=In addition to gaining instantaneous actions, _the Warden_ will also get a brief haste boost when trampling swiftthistle.
plants.swiftthistle$seed.name=seed of swiftthistle
plants.swiftthistle$timebubble.name=time bubble
plants.swiftthistle$timebubble.desc=A small bubble of accelerated time, allowing actions to be performed instantly. Attacking or using magic will break this effect however.\n\nTurns remaining: %s.
plants.blandfruitbush.discover_hint=You can find this plant randomly in the dungeon.
plants.plant.discover_hint=You can find this plant randomly in the dungeon, or grow it from its associated seed.
plants.rotberry.discover_hint=You can grow this plant from its associated seed during a specific quest.
