plants.blandfruitbush.name=frutainsípida
plants.blandfruitbush.desc=Prima lejana de la baya podrida, el producto en forma de pera del arbusto de fruta insípida sabe a polvo apelmazado. La fruta es desagradable y poco sustanciosa, pero no es venenosa. Quizás podría cocinarse.
plants.blandfruitbush$seed.name=semilla de frutainsípida

plants.blindweed.name=hierbacegadora
plants.blindweed.desc=Al tocarse, una hierbacegadora perece en un brillante destello de luz. El destello es lo suficientemente fuerte como para desorientar durante varios segundos.
plants.blindweed.warden_desc=_La Guardiana_ canalizará la energía de la hierbacegadora en un manto temporal de invisibilidad, en lugar de quedar desorientada.
plants.blindweed$seed.name=semilla de hierbacegadora

plants.mageroyal.name=magorreal
plants.mageroyal.refreshed=Te sientes renovado.
plants.mageroyal.desc=Las flores espinosas de la magorreal contienen una sustancia química conocida por sus propiedades como fuerte agente neutralizador. Cualquier criatura que pise esta planta será purificada de muchos efectos negativos.
plants.mageroyal.warden_desc=Además del efecto neutralizador, _la Guardiana_ se volverá temporalmente inmune a todos los efectos de área al pisar una magorreal.
plants.mageroyal$seed.name=semilla de magorreal

plants.earthroot.name=raízterrestre
plants.earthroot.desc=Cuando una criatura toca una raízterrestre, sus raíces crean una especie de armadura natural inmóvil a su alrededor.
plants.earthroot.warden_desc=Las raíces de una raízterrestre se moverán con _la Guardiana_, proporcionándole una armadura móvil de piel de corteza.
plants.earthroot$seed.name=semilla de raízterrestre
plants.earthroot$armor.name=armadura herbal
plants.earthroot$armor.desc=Una especie de armadura natural e inmóvil hecha de corteza y enredaderas.\n\nEsta armadura herbal bloqueará %d de daño de cualquier golpe físico, hasta que eventualmente agote su durabilidad y colapse.\n\nComo la armadura es inmóvil, moverse hará que se rompa y se pierda.\n\nArmadura restante: %d.

plants.fadeleaf.name=hojacaduca
plants.fadeleaf.desc=Tocar una hojacaduca teletransportará a cualquier criatura a un lugar aleatorio del nivel actual.
plants.fadeleaf.warden_desc=El efecto de teletransportación de la hojacaduca es más potente para _la Guardiana_, teletransportándola de regreso al final del nivel anterior de la mazmorra.
plants.fadeleaf$seed.name=semilla de hojacaduca

plants.firebloom.name=flogoflor
plants.firebloom.desc=Cuando algo toca una flogoflor, estalla en llamas.
plants.firebloom.warden_desc=Cuando pisa una flogoflor, _la Guardiana_ se imbuirá brevemente de llamas en lugar de sufrir daño.
plants.firebloom$seed.name=semilla de flogoflor

plants.icecap.name=casquetehelado
plants.icecap.desc=Al ser tocado, un casquetehelado suelta una nube de polen congelante. El efecto de congelación es mucho más fuerte si el entorno está mojado.
plants.icecap.warden_desc=Cuando pisa un casquetehelado, _la Guardiana_ se imbuirá brevemente de escarcha en lugar de sufrir daño.
plants.icecap$seed.name=semilla de casquetehelado

plants.plant.warden_desc=Esta planta no tiene ningún efecto especial cuando la usa la Guardiana.
plants.plant$seed.seed_of=semilla de %s
plants.plant$seed.ac_plant=PLANTAR
plants.plant$seed.info=Lanza esta semilla al lugar donde quieras que crezca una planta.\n\n%s
plants.plant$seed$placeholder.name=semilla

plants.rotberry.name=bayapodrida
plants.rotberry.desc=Las bayas de un arbusto joven de bayapodrida saben a dulce, dulce muerte. Con los años, este arbusto se convertirá en otro corazón podrido. Al ser pisoteada, una bayapodrida joven producirá una pequeña nube de gas tóxico.
plants.rotberry.warden_desc=Normalmente, un arbusto de bayapodrida solo produce un poco de gas al ser pisoteado, ¡pero _la Guardiana_ es capaz de aprovechar su energía para aumentar temporalmente su fuerza!
plants.rotberry$seed.name=semilla de bayapodrida

plants.sorrowmoss.name=musgodoloroso
plants.sorrowmoss.desc=Un musgodoloroso es una flor (no un musgo) con pétalos afilados como navajas, recubiertos de un veneno mortal.
plants.sorrowmoss.warden_desc=Cuando pisa un musgodoloroso, _la Guardiana_ se imbuirá brevemente de toxina en lugar de sufrir daño.
plants.sorrowmoss$seed.name=semilla de musgodoloroso

plants.starflower.name=astroflor
plants.starflower.desc=Una planta rara, se dice que la astroflor otorga poder sagrado a quien la toca.
plants.starflower.warden_desc=Además de ser bendecida, _la Guardiana_ obtendrá una cantidad significativa de recarga de varitas cuando pisa una astroflor.
plants.starflower$seed.name=semilla de astroflor

plants.stormvine.name=vidtormentosa
plants.stormvine.desc=La gravedad afecta extrañamente a la vidtormentosa, permitiendo que sus delgados zarcillos azules 'cuelguen' en el aire. Cualquier criatura atrapada en la enredadera se ve afectada por esto y queda desorientada.
plants.stormvine.warden_desc=_La Guardiana_ puede controlar el efecto gravitatorio de la vidtormentosa y levitará brevemente cuando pise una.
plants.stormvine$seed.name=semilla de vidtormentosa

plants.sungrass.name=hierbasolar
plants.sungrass.desc=La hierbasolar es famosa por las lentas pero efectivas propiedades curativas de su savia.
plants.sungrass.warden_desc=_La Guardiana_ puede recibir curación de la hierbasolar pisoteada incluso si se aleja de ella.
plants.sungrass$seed.name=semilla de hierbasolar
plants.sungrass$health.name=curación herbal
plants.sungrass$health.desc=La hierbasolar posee excelentes propiedades curativas, aunque es mucho más lenta que una poción de curación.\n\nMoverse fuera de la planta romperá el efecto de curación.\n\nCuración restante: %d.

plants.swiftthistle.name=cardoveloz
plants.swiftthistle.desc=Al ser pisoteado, el cardoveloz acelerará brevemente el flujo del tiempo a su alrededor, permitiendo que quien lo pise realice varias acciones de forma instantánea.
plants.swiftthistle.warden_desc=Además de ganar acciones instantáneas, _la Guardiana_ también obtendrá un breve impulso de celeridad al pisotear un cardoveloz.
plants.swiftthistle$seed.name=semilla de cardoveloz
plants.swiftthistle$timebubble.name=burbuja de tiempo
plants.swiftthistle$timebubble.desc=Una pequeña burbuja de tiempo acelerado que permite realizar acciones al instante. Sin embargo, atacar o usar magia romperá este efecto.\n\nTurnos restantes: %s.
