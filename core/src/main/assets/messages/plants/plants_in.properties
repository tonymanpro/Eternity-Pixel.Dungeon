plants.blandfruitbush.name=buah campur
plants.blandfruitbush.desc=Sepupu jauh dari rotberry, benih berbentuk buah pir hasil dari semak buah campur ini rasanya seperti buntalan debu. Buah itu menjijikan dan tidak memiliki khasiat apa-apa, tapi baiknya tidak beracun. Mungkin buah ini dapat dimasak.
plants.blandfruitbush.discover_hint=Kamu bisa menemukan tanaman ini secara acak di terungku.
plants.blandfruitbush$seed.name=benih buah campur

plants.blindweed.name=rumput buta
plants.blindweed.desc=Saat disentuh, rumput buta akan mengeluarkan cahaya menyilaukan. Cahaya itu cukup untuk membuat seseorang kehilangan arah sementara waktu.
plants.blindweed.warden_desc=_Penjaga_ akan menyalurkan energi rumput buta menjadi secercah kekuatan tembus pandang, alih-alih menjadi hilang arah.
plants.blindweed$seed.name=benih rumput buta

plants.mageroyal.name=mageroyal
plants.mageroyal.refreshed=Kamu merasa segar.
plants.mageroyal.desc=Bunga berduri mageroyal mengandung bahan kimia yang dikenal sebagai penetral yang kuat. Apapun yang menginjak tanaman ini akan dibersihkan dari beragam efek negatif.
plants.mageroyal.warden_desc=Selain efek penetral, _Penjaga_ akan menjadi kebal sementara terhadap semua efek area saat menginjak mageroyal.
plants.mageroyal$seed.name=benih bunga mageroyal

plants.earthroot.name=akar tanah
plants.earthroot.desc=Saat seseorang menyentuh akar tanah, akarnya menciptakan semacam armor alami yang rapuh di sekitarnya.
plants.earthroot.warden_desc=Akar dari tanaman akar tanah akan bergerak bersama _Penjaga _, memberikan armor kulit kayu di sekelilingnya.
plants.earthroot$seed.name=benih akar tanah
plants.earthroot$armor.name=armor herbal
plants.earthroot$armor.desc=Sejenis armor alami yang tidak bergerak yang terbuat dari kulit kayu dan benang.\n\nArmor herbal akan menahan %d damage dari setiap serangan fisik, sampai kegunaannya habis dan hancur.\n\nKarena armornya tidak dapat digerakkan, bergerak maka armornya akan langsung hancur.\n\nSisa armor: %d.

plants.fadeleaf.name=daun hilang
plants.fadeleaf.desc=Menyentuh daun hilang akan memindahkan apapun ke tempat acak di level yang sama.
plants.fadeleaf.warden_desc=Efek teleportasi dari daun hilang lebih kuat untuk _Penjaga_, yang mana dapat memindahkan ia kembali ke lantai terungku sebelumnya.
plants.fadeleaf$seed.name=benih daun hilang

plants.firebloom.name=bunga api
plants.firebloom.desc=Saat sesuatu menyentuh bunga api, tanaman itu akan terbakar.
plants.firebloom.warden_desc=Saat dia menginjak bunga api, _Penjaga_ akan dijiwai sementara dengan api alih-alih dilukai olehnya.
plants.firebloom$seed.name=benih bunga api

plants.icecap.name=kantong es
plants.icecap.desc=Setelah disentuh, kantung es mengeluarkan hembusan serbuk yang membekukan. Efek beku jauh lebih kuat jika di air.
plants.icecap.warden_desc=Ketika dia menginjak kantong es, _Penjaga_ akan dijiwai sementara dengan embun beku alih-alih dilukai olehnya.
plants.icecap$seed.name=benih kantung es

plants.plant.warden_desc=Tanaman ini tidak memiliki efek khusus saat digunakan oleh Penjaga.
plants.plant.discover_hint=Kamu bisa menemukan tanaman ini secara acak di terungku, atau menanamnya dari benih yang terkait.
plants.plant$seed.seed_of=benih %s
plants.plant$seed.ac_plant=TANAM
plants.plant$seed.info=Lempar benih ini di tempat di mana kau inginkan itu tumbuh.\n\n%s
plants.plant$seed$placeholder.name=benih

plants.rotberry.name=rotberry
plants.rotberry.desc=Buah beri muda rotberry rasanya manis, semanis kematian. Selama beberapa tahun, rotberry ini akan tumbuh menjadi jantung tanaman rotberry lainnya. Ketika diinjak, rotberry muda akan menghasilkan kepulan kecil gas beracun.
plants.rotberry.warden_desc=Biasanya semak rotberry hanya menghasilkan sedikit gas saat diinjak, tapi _Penjaga_ dapat memanfaatkan energi dari semak itu untuk sementara meningkatkan kekuatannya!
plants.rotberry.discover_hint=Kamu dapat menanam tanaman ini dari benih yang terkait selama pencarian tertentu.
plants.rotberry$seed.name=benih rotberry
plants.rotberry$seed.discover_hint=Kamu bisa menemukan item ini dalam misi tertentu.

plants.sorrowmoss.name=lumut kesedihan
plants.sorrowmoss.desc=Lumut kesedihan adalah bunga (bukan lumut) dengan kelopak setajam silet, dilapisi dengan racun mematikan.
plants.sorrowmoss.warden_desc=Saat dia menginjak lumut kesedihan, _Penjaga_ akan dijiwai sementara dengan racun alih-alih dilukai olehnya.
plants.sorrowmoss$seed.name=benih lumut kesedihan

plants.starflower.name=bunga bintang
plants.starflower.desc=Tanaman langka, bunga bintang konon dapat memberikan kekuatan suci bagi siapapun yang menyentuhnya.
plants.starflower.warden_desc=Selain diberkati, _Penjaga_ akan mendapatkan sejumlah besar pengisian ulang tongkat sihir saat dia menginjak bunga bintang.
plants.starflower$seed.name=benih bunga bintang

plants.stormvine.name=jalar badai
plants.stormvine.desc=Gravitasi memengaruhi tanaman jalar badai secara aneh, membuat sulur ringan birunya 'menggantung' di udara. Apapun yang menyentuh tanaman ini akan kehilangan arah.
plants.stormvine.warden_desc=_Penjaga_ mampu mengontrol efek gravitasi dari jalar badai, dan akan melayang sementara ketika dia menginjaknya.
plants.stormvine$seed.name=benih jalar badai

plants.sungrass.name=rumput matahari
plants.sungrass.desc=Rumput Matahari dikenal akan kemampuan penyembuhannya.
plants.sungrass.warden_desc=_Penjaga_ dapat menerima penyembuhan dari rumput matahari bahkan jika ia bergerak.
plants.sungrass$seed.name=benih rumput matahari
plants.sungrass$health.name=penyembuhan herbal
plants.sungrass$health.desc=Rumput matahari memiliki kekuatan penyembuhan yang luar biasa, tapi tetap lebih lambat dari ramuan penyembuhan.\n\nBergerak menjauhi tanaman akan menghilangkan efeknya.\n\nSisa penyembuhan: %d

plants.swiftthistle.name=bunga lincah
plants.swiftthistle.desc=Saat diinjak, bunga lincah akan mempercepat laju waktu di sekitarnya dalam waktu singkat, membuat yang menginjak dapat melakukan hal secara instan.
plants.swiftthistle.warden_desc=Selain bisa mendapatkan aksi instan, _Penjaga_ juga akan mendapatkan peningkatan kecepatan saat menginjak bunga lincah.
plants.swiftthistle$seed.name=benih bunga lincah
plants.swiftthistle$timebubble.name=gelembung waktu
plants.swiftthistle$timebubble.desc=Sebuah gelembung kecil yang mempercepat waktu, membuatmu bisa melakukan aksi secara langsung. Namun menyerang atau menggunakan sihir akan membatalkan efek ini.\n\nGiliran tersisa: %s.

# Eternity PD Fallback Keys
plants.blandfruitbush.name=blandfruit
plants.blandfruitbush.desc=Distant cousin of the rotberry, the pear-shaped produce of the blandfruit bush tastes like caked dust. The fruit is gross and unsubstantial but isn't poisonous. Perhaps it could be cooked.
plants.blandfruitbush$seed.name=seed of blandfruit
plants.blindweed.name=blindweed
plants.blindweed.desc=Upon being touched a blindweed perishes in a bright flash of light. The flash is strong enough to disorient for several seconds.
plants.blindweed.warden_desc=_The Warden_ will channel a blindweed's energy into a temporary shroud of invisibility, instead of being disoriented.
plants.blindweed$seed.name=seed of blindweed
plants.mageroyal.name=mageroyal
plants.mageroyal.refreshed=You feel refreshed.
plants.mageroyal.desc=The mageroyal's prickly flowers contain a chemical which is known for its properties as a strong neutralizing agent. Anything that steps in this plant will be cleansed of many negative effects.
plants.mageroyal.warden_desc=In addition to the neutralizing effect, _the Warden_ will become temporarily immune to all area-bound effects when stepping on mageroyal.
plants.mageroyal$seed.name=seed of mageroyal
plants.earthroot.name=earthroot
plants.earthroot.desc=When a creature touches an earthroot, its roots create a kind of immobile natural armor around it.
plants.earthroot.warden_desc=The roots of an earthroot plant will move with _the Warden_, providing her mobile barkskin armor.
plants.earthroot$seed.name=seed of earthroot
plants.earthroot$armor.name=herbal armor
plants.earthroot$armor.desc=A kind of natural, immobile armor made of bark and twine.\n\nThis herbal armor will block %d damage from any physical hit, until it eventually runs out of durability and collapses.\n\nAs the armor is immobile, moving will cause it to break apart and be lost.\n\nArmor remaining: %d.
plants.fadeleaf.name=fadeleaf
plants.fadeleaf.desc=Touching a fadeleaf will teleport any creature to a random place on the current level.
plants.fadeleaf.warden_desc=The teleportation effect of fadeleaf is more potent for _the Warden_, teleporting her back to the end of the previous dungeon level.
plants.fadeleaf$seed.name=seed of fadeleaf
plants.firebloom.name=firebloom
plants.firebloom.desc=When something touches a firebloom, it bursts into flames.
plants.firebloom.warden_desc=When she tramples a firebloom, _the Warden_ will be briefly imbued with flame instead of being harmed.
plants.firebloom$seed.name=seed of firebloom
plants.icecap.name=icecap
plants.icecap.desc=Upon being touched, an icecap lets out a puff of freezing pollen. The freezing effect is much stronger if the environment is wet.
plants.icecap.warden_desc=When she tramples an icecap, _the Warden_ will be briefly imbued with frost instead of being harmed.
plants.icecap$seed.name=seed of icecap
plants.plant.warden_desc=This plant has no special effect when used by the Warden.
plants.plant$seed.seed_of=seed of %s
plants.plant$seed.ac_plant=PLANT
plants.plant$seed.info=Throw this seed to the place where you want to grow a plant.\n\n%s
plants.plant$seed$placeholder.name=seed
plants.rotberry.name=rotberry
plants.rotberry.desc=The berries of a young rotberry shrub taste like sweet, sweet death. Over a few years, this rotberry shrub will grow into another rot heart. When trampled, a young rotberry will produce a small puff of toxic gas.
plants.rotberry.warden_desc=Normally a rotberry bush only produces a little gas when trampled, but _the Warden_ is able to harness energy from it to temporarily boost her strength!
plants.rotberry$seed.name=seed of rotberry
plants.sorrowmoss.name=sorrowmoss
plants.sorrowmoss.desc=A sorrowmoss is a flower (not a moss) with razor-sharp petals, coated with a deadly venom.
plants.sorrowmoss.warden_desc=When she tramples a sorrowmoss, _the Warden_ will be briefly imbued with toxin instead of being harmed.
plants.sorrowmoss$seed.name=seed of sorrowmoss
plants.starflower.name=starflower
plants.starflower.desc=A rare plant, starflower is said to grant holy power to whomever touches it.
plants.starflower.warden_desc=In addition to being blessed, _the Warden_ will gain a significant amount of wand recharging when she tramples a starflower.
plants.starflower$seed.name=seed of starflower
plants.stormvine.name=stormvine
plants.stormvine.desc=Gravity affects the stormvine plant strangely, allowing its whispy blue tendrils to 'hang' on the air. Anything caught in the vine is affected by this, and becomes disoriented.
plants.stormvine.warden_desc=_The Warden_ is able to control the gravitational effect of stormvine, and will briefly levitate when she tramples one.
plants.stormvine$seed.name=seed of stormvine
plants.sungrass.name=sungrass
plants.sungrass.desc=Sungrass is renowned for its sap's slow but effective healing properties.
plants.sungrass.warden_desc=_The Warden_ can receive healing from trampled sungrass even if she moves away from it.
plants.sungrass$seed.name=seed of sungrass
plants.sungrass$health.name=herbal healing
plants.sungrass$health.desc=Sungrass possesses excellent healing properties, though it is much slower than a potion of healing.\n\nMoving off the plant will break the healing effect.\n\nHealing remaining: %d.
plants.swiftthistle.name=swiftthistle
plants.swiftthistle.desc=When trampled, swiftthistle will briefly accelerate the flow of time around it, allowing the trampler to perform several actions instantly.
plants.swiftthistle.warden_desc=In addition to gaining instantaneous actions, _the Warden_ will also get a brief haste boost when trampling swiftthistle.
plants.swiftthistle$seed.name=seed of swiftthistle
plants.swiftthistle$timebubble.name=time bubble
plants.swiftthistle$timebubble.desc=A small bubble of accelerated time, allowing actions to be performed instantly. Attacking or using magic will break this effect however.\n\nTurns remaining: %s.
plants.blandfruitbush.discover_hint=You can find this plant randomly in the dungeon.
plants.plant.discover_hint=You can find this plant randomly in the dungeon, or grow it from its associated seed.
plants.rotberry.discover_hint=You can grow this plant from its associated seed during a specific quest.
