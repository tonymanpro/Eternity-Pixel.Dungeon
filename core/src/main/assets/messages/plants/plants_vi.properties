plants.blandfruitbush.name=quả vô vị
plants.blandfruitbush.desc=Họ hàng xa của quả mọng thối, sản vật có hình trái lê của bụi cây có vị như đống bụi. Quả ăn rất tởm và không thích hợp với dạ dày của bạn nhưng nó không có độc. Có lẽ nó có thể được nấu.
plants.blandfruitbush.discover_hint=Bạn có thể tìm thấy loài cây này một cách ngẫu nhiên trong hầm ngục.
plants.blandfruitbush$seed.name=hạt quả vô vị

plants.blindweed.name=cỏ dại mù
plants.blindweed.desc=Khi bị chạm cây cỏ dại mù tan biến với một tia ánh sáng chói. Tia sáng ấy đủ mạnh để làm mất phương hướng trong vài giây.
plants.blindweed.warden_desc=_Hộ vệ_ sẽ chuyển hóa năng lượng của một cây cỏ mù thành một lớp màn vô hình tạm thời, thay vì bị mất phương hướng.
plants.blindweed$seed.name=hạt cây cỏ mù

plants.mageroyal.name=hoa mageroyal
plants.mageroyal.refreshed=Bạn thấy sảng khoái.
plants.mageroyal.desc=Gai của hoa mageroyal được biết đến với việc chứa một chất trung hòa mạnh. Bất kì thứ gì dẫm lên cây này sẽ được thanh tẩy khỏi nhiều hiệu ứng tiêu cực.
plants.mageroyal.warden_desc=Ngoài hiệu ứng trung hòa, _Hộ vệ_ sẽ tạm thời miễn nhiễm với tất cả các hiệu ứng khi dẫm lên hoa mageroyal.
plants.mageroyal$seed.name=hạt cây mageroyal

plants.earthroot.name=rễ đất
plants.earthroot.desc=Khi một sinh vật chạm vào một cây rễ đất, rễ của nó tạo ra một dạng áo giáp tự nhiên bất động quanh sinh vật đó.
plants.earthroot.warden_desc=Rễ của một cây rễ đất sẽ di chuyển cùng với _Hộ vệ_, cung cấp cho cô ấy áo giáp da vỏ cây di động.
plants.earthroot$seed.name=Hạt cây rễ đất
plants.earthroot$armor.name=áo giáp thảo mộc
plants.earthroot$armor.desc=Một loại giáp tự nhiên, bất động làm từ vỏ cây và dây.\n\nBộ giáp thiên nhiên này sẽ chặn %d sát thương từ bất cứ đòn vật lí nào, cho đến khi nó hết độ bền và vỡ vụn.\n\nBởi bộ giáp bất động, di chuyển sẽ khiến nó vỡ ra và bị mất.\n\nGiáp còn lại: %d.

plants.fadeleaf.name=lá biến mất
plants.fadeleaf.desc=Chạm vào một cây lá biến mất sẽ dịch chuyển bất kì sinh vật nào tới một nơi ngẫu nhiên trên tầng hiện tại.
plants.fadeleaf.warden_desc=Hiệu ứng dịch chuyển của lá biến mất mạnh hơn đối với _Hộ vệ_, dịch chuyển cô trở lại điểm kết thúc của tầng ngục trước.
plants.fadeleaf$seed.name=hạt cây lá biến mất

plants.firebloom.name=hoa lửa
plants.firebloom.desc=Khi bất cứ thứ gì chạm vào nó, nó sẽ bốc cháy với đám lửa dữ dội.
plants.firebloom.warden_desc=Khi giẫm lên một cây hoa lửa, _Hộ vệ_ sẽ được hòa nhập với lửa trong một thời gian ngắn thay vì bị hại.
plants.firebloom$seed.name=hạt cây hoa lửa

plants.icecap.name=chỏm băng
plants.icecap.desc=Khi bị chạm vào, một cây chỏm băng phun ra một đám bụi phấn hoa đóng băng. Hiệu ứng đóng băng ấy mạnh hơn nhiều nếu môi trường ướt.
plants.icecap.warden_desc=Khi cô ấy giẫm lên một cây chỏm băng, _Hộ vệ_ sẽ được hòa nhập với băng trong một thời gian ngắn thay vì bị làm hại.
plants.icecap$seed.name=hạt cây chỏm băng

plants.plant.warden_desc=Loài cây này không có hiệu ứng đặc biệt khi được sử dụng bởi Hộ vệ.
plants.plant.discover_hint=Bạn có thể tìm thấy loài cây này một cách ngẫu nhiên trong hầm ngục, hoặc trồng nó từ hạt giống tương ứng của nó.
plants.plant$seed.seed_of=hạt cây %s
plants.plant$seed.ac_plant=TRỒNG
plants.plant$seed.info=Thả hạt giống này vào nơi bạn muốn nó mọc thành cây.\n\n%s
plants.plant$seed$placeholder.name=hạt

plants.rotberry.name=quả mọng thối
plants.rotberry.desc=Những quả mọng của một bụi quả mọng thối trẻ có vị như cái chết ngọt ngào. Qua một vài năm, bụi quả mọng thối này sẽ lớn lên thành một quả tim thối khác. Khi bị giẫm lên, một quả mọng thối trẻ sẽ tạo ra một đám khí độc nhỏ.
plants.rotberry.warden_desc=Thông thường một bụi cây quả mọng thối chỉ tạo ra một ít khí khi bị giẫm lên, nhưng _Hộ vệ_ có thể khai thác năng lượng từ nó để tạm thời tăng sức mạnh của cô ấy!
plants.rotberry.discover_hint=Bạn có thể trồng loài cây này từ hạt giống tương ứng của nó trong một nhiệm vụ nhất định.
plants.rotberry$seed.name=hạt cây quả mọng thối
plants.rotberry$seed.discover_hint=Bạn có thể tìm thấy vật phẩm này trong một nhiệm vụ nhất định.

plants.sorrowmoss.name=rêu đau buồn
plants.sorrowmoss.desc=Một cây rêu đau buồn là một cây hoa (không phải một cây rêu) với những cánh hoa sắc như dao, được phủ bằng một nọc độc chết người.
plants.sorrowmoss.warden_desc=Khi cô ấy giẫm lên một cây rêu đau buồn, _Hộ vệ_ sẽ được hòa nhập với độc tố trong một thời gian ngắn thay vì bị làm hại.
plants.sorrowmoss$seed.name=hạt cây rêu đau buồn

plants.starflower.name=hoa sao
plants.starflower.desc=Một loài cây hiếm, hoa sao được cho là sẽ trao sức mạnh thần thánh cho bất cứ ai chạm vào nó.
plants.starflower.warden_desc=Bên cạnh việc được ban phước, _Hộ vệ_ sẽ nhận được một lượng hồi năng đũa phép đáng kể khi cô ấy giẫm lên một cây hoa sao.
plants.starflower$seed.name=hạt cây hoa sao

plants.stormvine.name=cây nho bão
plants.stormvine.desc=Trọng lực ảnh hưởng tới cây nho bão một cách kì lạ, cho phép các dây leo nhẹ màu xanh của nó 'treo' trên không. Bất cứ thứ gì bị bám vào cây nho đều bị ảnh hưởng bởi điều này, và trở nên mất phương hướng.
plants.stormvine.warden_desc=_Hộ vệ_ có thể điều khiển hiệu ứng trọng lực của cây nho bão, và sẽ bay lên trong một thời gian ngắn khi cô ấy giẫm lên nó.
plants.stormvine$seed.name=hạt cây nho bão

plants.sungrass.name=cỏ mặt trời
plants.sungrass.desc=Cỏ mặt tời được biết đến nhờ công dụng trị thương chậm mà hiệu quả của sáp cây.
plants.sungrass.warden_desc=_Hộ vệ_ có thể nhận được hồi phục từ cỏ mặt trời bị giẫm lên kể cả nếu cô ấy di chuyển khỏi nó.
plants.sungrass$seed.name=hạt cây cỏ mặt trời
plants.sungrass$health.name=hồi phục thảo mộc
plants.sungrass$health.desc=Cỏ mặt trời sở hữu các đặc tính hồi phục xuất sắc, tuy nó chậm hơn nhiều một lọ thuốc hồi phục.\n\nDi chuyển khỏi cái cây sẽ ngừng hiệu ứng hồi phục.\n\nHồi phục còn lại: %d.

plants.swiftthistle.name=cúc gai nhanh
plants.swiftthistle.desc=Khi bị giẫm lên, cúc gai nhanh sẽ tăng tốc dòng chảy thời gian xung quanh nó trong thời gian ngắn, cho phép người giẫm thực hiện một vài hành động ngay lập tức.
plants.swiftthistle.warden_desc=Bên cạnh việc nhận được lượt hành động lập tức, _Hộ vệ_ sẽ nhận được nhanh nhẹn trong thời gian ngắn sau khi giẫm lên cây cúc gai nhanh.
plants.swiftthistle$seed.name=hạt cây cúc gai nhanh
plants.swiftthistle$timebubble.name=bong bóng thời gian
plants.swiftthistle$timebubble.desc=Một bong bóng thời gian được tăng tốc, cho phép hành động được thực hiện ngay lập tức. Tuy nhiên tấn công hoặc sử dụng phép thuật sẽ ngừng hiệu ứng này.\n\nLượt còn lại: %s.

# Eternity PD Fallback Keys
plants.blandfruitbush.name=blandfruit
plants.blandfruitbush.desc=Distant cousin of the rotberry, the pear-shaped produce of the blandfruit bush tastes like caked dust. The fruit is gross and unsubstantial but isn't poisonous. Perhaps it could be cooked.
plants.blandfruitbush$seed.name=seed of blandfruit
plants.blindweed.name=blindweed
plants.blindweed.desc=Upon being touched a blindweed perishes in a bright flash of light. The flash is strong enough to disorient for several seconds.
plants.blindweed.warden_desc=_The Warden_ will channel a blindweed's energy into a temporary shroud of invisibility, instead of being disoriented.
plants.blindweed$seed.name=seed of blindweed
plants.mageroyal.name=mageroyal
plants.mageroyal.refreshed=You feel refreshed.
plants.mageroyal.desc=The mageroyal's prickly flowers contain a chemical which is known for its properties as a strong neutralizing agent. Anything that steps in this plant will be cleansed of many negative effects.
plants.mageroyal.warden_desc=In addition to the neutralizing effect, _the Warden_ will become temporarily immune to all area-bound effects when stepping on mageroyal.
plants.mageroyal$seed.name=seed of mageroyal
plants.earthroot.name=earthroot
plants.earthroot.desc=When a creature touches an earthroot, its roots create a kind of immobile natural armor around it.
plants.earthroot.warden_desc=The roots of an earthroot plant will move with _the Warden_, providing her mobile barkskin armor.
plants.earthroot$seed.name=seed of earthroot
plants.earthroot$armor.name=herbal armor
plants.earthroot$armor.desc=A kind of natural, immobile armor made of bark and twine.\n\nThis herbal armor will block %d damage from any physical hit, until it eventually runs out of durability and collapses.\n\nAs the armor is immobile, moving will cause it to break apart and be lost.\n\nArmor remaining: %d.
plants.fadeleaf.name=fadeleaf
plants.fadeleaf.desc=Touching a fadeleaf will teleport any creature to a random place on the current level.
plants.fadeleaf.warden_desc=The teleportation effect of fadeleaf is more potent for _the Warden_, teleporting her back to the end of the previous dungeon level.
plants.fadeleaf$seed.name=seed of fadeleaf
plants.firebloom.name=firebloom
plants.firebloom.desc=When something touches a firebloom, it bursts into flames.
plants.firebloom.warden_desc=When she tramples a firebloom, _the Warden_ will be briefly imbued with flame instead of being harmed.
plants.firebloom$seed.name=seed of firebloom
plants.icecap.name=icecap
plants.icecap.desc=Upon being touched, an icecap lets out a puff of freezing pollen. The freezing effect is much stronger if the environment is wet.
plants.icecap.warden_desc=When she tramples an icecap, _the Warden_ will be briefly imbued with frost instead of being harmed.
plants.icecap$seed.name=seed of icecap
plants.plant.warden_desc=This plant has no special effect when used by the Warden.
plants.plant$seed.seed_of=seed of %s
plants.plant$seed.ac_plant=PLANT
plants.plant$seed.info=Throw this seed to the place where you want to grow a plant.\n\n%s
plants.plant$seed$placeholder.name=seed
plants.rotberry.name=rotberry
plants.rotberry.desc=The berries of a young rotberry shrub taste like sweet, sweet death. Over a few years, this rotberry shrub will grow into another rot heart. When trampled, a young rotberry will produce a small puff of toxic gas.
plants.rotberry.warden_desc=Normally a rotberry bush only produces a little gas when trampled, but _the Warden_ is able to harness energy from it to temporarily boost her strength!
plants.rotberry$seed.name=seed of rotberry
plants.sorrowmoss.name=sorrowmoss
plants.sorrowmoss.desc=A sorrowmoss is a flower (not a moss) with razor-sharp petals, coated with a deadly venom.
plants.sorrowmoss.warden_desc=When she tramples a sorrowmoss, _the Warden_ will be briefly imbued with toxin instead of being harmed.
plants.sorrowmoss$seed.name=seed of sorrowmoss
plants.starflower.name=starflower
plants.starflower.desc=A rare plant, starflower is said to grant holy power to whomever touches it.
plants.starflower.warden_desc=In addition to being blessed, _the Warden_ will gain a significant amount of wand recharging when she tramples a starflower.
plants.starflower$seed.name=seed of starflower
plants.stormvine.name=stormvine
plants.stormvine.desc=Gravity affects the stormvine plant strangely, allowing its whispy blue tendrils to 'hang' on the air. Anything caught in the vine is affected by this, and becomes disoriented.
plants.stormvine.warden_desc=_The Warden_ is able to control the gravitational effect of stormvine, and will briefly levitate when she tramples one.
plants.stormvine$seed.name=seed of stormvine
plants.sungrass.name=sungrass
plants.sungrass.desc=Sungrass is renowned for its sap's slow but effective healing properties.
plants.sungrass.warden_desc=_The Warden_ can receive healing from trampled sungrass even if she moves away from it.
plants.sungrass$seed.name=seed of sungrass
plants.sungrass$health.name=herbal healing
plants.sungrass$health.desc=Sungrass possesses excellent healing properties, though it is much slower than a potion of healing.\n\nMoving off the plant will break the healing effect.\n\nHealing remaining: %d.
plants.swiftthistle.name=swiftthistle
plants.swiftthistle.desc=When trampled, swiftthistle will briefly accelerate the flow of time around it, allowing the trampler to perform several actions instantly.
plants.swiftthistle.warden_desc=In addition to gaining instantaneous actions, _the Warden_ will also get a brief haste boost when trampling swiftthistle.
plants.swiftthistle$seed.name=seed of swiftthistle
plants.swiftthistle$timebubble.name=time bubble
plants.swiftthistle$timebubble.desc=A small bubble of accelerated time, allowing actions to be performed instantly. Attacking or using magic will break this effect however.\n\nTurns remaining: %s.
plants.blandfruitbush.discover_hint=You can find this plant randomly in the dungeon.
plants.plant.discover_hint=You can find this plant randomly in the dungeon, or grow it from its associated seed.
plants.rotberry.discover_hint=You can grow this plant from its associated seed during a specific quest.
