plants.blandfruitbush.name=пустафрукт
plants.blandfruitbush.desc=Далёкі сваяк гнілаягады, грушападобны плён куста пустафрукта на смак як зліплы пыл. Фрукт даволі гідкі і дрэнна здавальняе голад, аднак ён не атрутны. Магчыма, калі яго зварыць з чымсьці яшчэ, ён стане лепей?
plants.blandfruitbush.discover_hint=Вы можаце знайсці гэтую расліну выпадкова ў падзямеллі.
plants.blandfruitbush$seed.name=насенне пустафрукта

plants.blindweed.name=сляпняк
plants.blindweed.desc=Калі дакрануццы да сляпняка, ён выпусціць яскравы выбліск святла і загіне. Успышка досыць моцная, каб вывесці дарослага чалавека з ладу на некалькі секунд.
plants.blindweed.warden_desc=_Захавальніца_ накіруе энергію сляпняка ў часовую заслону нябачнасці замест таго, каб быць асляплёнай.
plants.blindweed$seed.name=насенне сляпняка

plants.mageroyal.name=магароза
plants.mageroyal.refreshed=Вы адчуваеце сабе адноўленным.
plants.mageroyal.desc=Калючая кветка магарозы змяшчае хімічнае рэчыва, якое вядома сваімі ўласцівасцямі моцнага нейтралізатара. Усё, што патрапіць на гэтую расліну, будзе ачышчана ад шматлікіх негатыўных уздзеянняў.
plants.mageroyal.warden_desc=У дадатак _Захавальніца_ атрымлівае часовы імунітэт ад усіх эфектаў, якія уплываюць на абшар.
plants.mageroyal$seed.name=насенне магарозы

plants.earthroot.name=зямлякорань
plants.earthroot.desc=Калі дакрануцца да зямлякораня, яго карані ахінуць вас і створаць нейкае падабенства на натуральныя даспехі.
plants.earthroot.warden_desc=Карані зямлякораня будуць рухацца разам з _Захавальніцай_, што дасць ёй пераносную даспех дубовай скуры.
plants.earthroot$seed.name=насенне зямлякорня
plants.earthroot$armor.name=даспех з берасты
plants.earthroot$armor.desc=Уцёкі раслін, кара, карэнне і розныя ліяны бароняць ваша цела.\n\nГэты даспех з раслін блакіруе %d страт ад любога фізічнага ўдара, пакуль яна не зламаецца.\n\nКалі вы паспрабуеце рухацца, жывы шчыт знікне.\n\nБрані засталося: %d.

plants.fadeleaf.name=ведзьміна кветка
plants.fadeleaf.desc=Істота, якая дакранецца да ведзьмінай кветкі, перамесціцца ў выпадковае месца бягучага ўзроўню.
plants.fadeleaf.warden_desc=Эфект тэлепартацыі ведзьмінай кветкі для _Захавальніцы_ перанясе яе ў канец папярэдняга ўзроўня падзямелля.
plants.fadeleaf$seed.name=насенне ведзімнай кветкі

plants.firebloom.name=вогненая лілея
plants.firebloom.desc=Дастаткова толькі дакрануцца да вогненай лілеі, як гэта кветка ўспыхне яскравым полымем.
plants.firebloom.warden_desc=Калі _Захавальніца_ наступае на вогненую лілею, яна на некаторы час авалодае сілай полымя і не будзе атрымліваць страты ад агня.
plants.firebloom$seed.name=насенне вогненай лілеі

plants.icecap.name=зюзін бэз
plants.icecap.desc=Пры дакрананні да зюзінага бэзу кветка лопаецца і стварае воблачка замярожваючага пылу. Эфект замарожвання нашмат мацней у вільготным асяроддзі.
plants.icecap.warden_desc=Калі _Захавальніца_ становіцца на зюзін бэз, яна атрымлівае сілу лёда замест таго, каб быть змарожанай.
plants.icecap$seed.name=насенне зюзінага бэза

plants.plant.warden_desc=Гэтая расліна не мае ніякага асабістага эфекту, калі яна выкарыстоўваецца Захавальніцай.
plants.plant.discover_hint=Вы можаце выпадкова знайсці гэтую расліну ў падзямеллі або вырасціць яе з адпаведнага насення.
plants.plant$seed.seed_of=насенне %s
plants.plant$seed.ac_plant=ПАСАДЗІЦЬ
plants.plant$seed.info=Кіньце насенне ў месца, дзе жадаеце вырасціць расліну.\n\n%s
plants.plant$seed$placeholder.name=насенне

plants.rotberry.name=гнілаягада
plants.rotberry.desc=Ягады маладой гнілаягады на смак як салодкая-салодкая смерць. Праз некалькі гадоў з такога куста  вырасце новае гнілое сэрца. Калі выпадкова наступіць на маладую гнілаягаду, яна пачне выдзяляць атрутны газ.
plants.rotberry.warden_desc=Звычайна куст гнілаягады выдзяляе трохі газу, калі яго топчуць, але _Захавальніца_ здольна выкарыстоўваць энергію ягады, каб часова павялічыць сваю сілу!
plants.rotberry.discover_hint=Вы можаце вырасціць гэтую расліну з адпаведнага насення пры выкананні пэўнага задання.
plants.rotberry$seed.name=насенне гнілаягады
plants.rotberry$seed.discover_hint=Вы можаце знайсці гэты прадмет пры выкананні пэўнага квэста.

plants.sorrowmoss.name=сумнамох
plants.sorrowmoss.desc=Сумнамох — гэта, насамрэч, кветка (а не мох) з вострымі, як брытва, пялёсткамі, якія пакрыты смяротнай атрутай.
plants.sorrowmoss.warden_desc=Калі _Захавальніца_ растопча Сумнамох, яна на кароткі час атрымае сілу атруты замест таго, каб самой быць атручанай.
plants.sorrowmoss$seed.name=насенне сумнамоху

plants.starflower.name=папараць-кветка
plants.starflower.desc=Папараць-кветка — рэдкая расліна, якую амаль ніхто не бачыў. Гавораць, той, то дакранецца да яе лісця, атрымае вялікую сілу.
plants.starflower.warden_desc=_Захавальніца_ дадаткова атрымае падзарадку палачак на вялікую колькасць часу, калі наступіць на папараць-кветку
plants.starflower$seed.name=насенне папараць-кветкі

plants.stormvine.name=грымотны дзмюхавец
plants.stormvine.desc=Гравітацыя дзіўна дзейнічае на грымотны дзмюхавец, дазваляючы яго тонкім вусікам "парыць" у паветры. Усё, што трапляе ў гэтыя вусікі, атрымлівае падобны эфект і страчвае арыентацыю ў прасторы.
plants.stormvine.warden_desc=_Захавальніца_ можа кантраліраваць эфект грымотнага дзмюхаўца, таму будзе лятаць пасля датыкнення да вусікаў расліны.
plants.stormvine$seed.name=насенне грымотнага дзмюхаўца

plants.sungrass.name=трыпутнік
plants.sungrass.desc=Трыпутнік вядомы за сваю здольнасць вылечваць любыя хваробы.
plants.sungrass.warden_desc=_Захавальніца_ будзе атрымліваць лячэнне ад трыпутніка нават тады, калі сышла з месца.
plants.sungrass$seed.name=насенне трыпутніка
plants.sungrass$health.name=травяное ацаленне
plants.sungrass$health.desc=Трыпутнік валодае выдатнымі гаючымі ўласцівасцямі, але ж яго лекавые здольнасці слабей за эфект зелля.\n\nПры спробе сысці з месца, лячэнне спыніцца.\n\nХадоў засталося: %d.

plants.swiftthistle.name=шпаркапалох
plants.swiftthistle.desc=Калі наступіць на шпаркапалох, ён ненадоўга паскорыць паток часу вакол сябе, даючы магчымасць рабіць некалькі дзеянняў за адзін момант.
plants.swiftthistle.warden_desc=Пасля таго, як _Захавальніца_ наступіць на шпаркапалох, яна атрымае паскарэнне ў дадатак да хуткасці дзеянняў.
plants.swiftthistle$seed.name=насенне шпаркапалоха
plants.swiftthistle$timebubble.name=бурбалка часу
plants.swiftthistle$timebubble.desc=Гэта лакалізаваная зона з паскораным часам, у якой усе дзеянні адбываюцца маментальна. Аднак атака або выкарыстанне магіі спыняць гэты эфект.\n\nРухаў засталося: %s.

# Eternity PD Fallback Keys
plants.blandfruitbush.name=blandfruit
plants.blandfruitbush.desc=Distant cousin of the rotberry, the pear-shaped produce of the blandfruit bush tastes like caked dust. The fruit is gross and unsubstantial but isn't poisonous. Perhaps it could be cooked.
plants.blandfruitbush$seed.name=seed of blandfruit
plants.blindweed.name=blindweed
plants.blindweed.desc=Upon being touched a blindweed perishes in a bright flash of light. The flash is strong enough to disorient for several seconds.
plants.blindweed.warden_desc=_The Warden_ will channel a blindweed's energy into a temporary shroud of invisibility, instead of being disoriented.
plants.blindweed$seed.name=seed of blindweed
plants.mageroyal.name=mageroyal
plants.mageroyal.refreshed=You feel refreshed.
plants.mageroyal.desc=The mageroyal's prickly flowers contain a chemical which is known for its properties as a strong neutralizing agent. Anything that steps in this plant will be cleansed of many negative effects.
plants.mageroyal.warden_desc=In addition to the neutralizing effect, _the Warden_ will become temporarily immune to all area-bound effects when stepping on mageroyal.
plants.mageroyal$seed.name=seed of mageroyal
plants.earthroot.name=earthroot
plants.earthroot.desc=When a creature touches an earthroot, its roots create a kind of immobile natural armor around it.
plants.earthroot.warden_desc=The roots of an earthroot plant will move with _the Warden_, providing her mobile barkskin armor.
plants.earthroot$seed.name=seed of earthroot
plants.earthroot$armor.name=herbal armor
plants.earthroot$armor.desc=A kind of natural, immobile armor made of bark and twine.\n\nThis herbal armor will block %d damage from any physical hit, until it eventually runs out of durability and collapses.\n\nAs the armor is immobile, moving will cause it to break apart and be lost.\n\nArmor remaining: %d.
plants.fadeleaf.name=fadeleaf
plants.fadeleaf.desc=Touching a fadeleaf will teleport any creature to a random place on the current level.
plants.fadeleaf.warden_desc=The teleportation effect of fadeleaf is more potent for _the Warden_, teleporting her back to the end of the previous dungeon level.
plants.fadeleaf$seed.name=seed of fadeleaf
plants.firebloom.name=firebloom
plants.firebloom.desc=When something touches a firebloom, it bursts into flames.
plants.firebloom.warden_desc=When she tramples a firebloom, _the Warden_ will be briefly imbued with flame instead of being harmed.
plants.firebloom$seed.name=seed of firebloom
plants.icecap.name=icecap
plants.icecap.desc=Upon being touched, an icecap lets out a puff of freezing pollen. The freezing effect is much stronger if the environment is wet.
plants.icecap.warden_desc=When she tramples an icecap, _the Warden_ will be briefly imbued with frost instead of being harmed.
plants.icecap$seed.name=seed of icecap
plants.plant.warden_desc=This plant has no special effect when used by the Warden.
plants.plant$seed.seed_of=seed of %s
plants.plant$seed.ac_plant=PLANT
plants.plant$seed.info=Throw this seed to the place where you want to grow a plant.\n\n%s
plants.plant$seed$placeholder.name=seed
plants.rotberry.name=rotberry
plants.rotberry.desc=The berries of a young rotberry shrub taste like sweet, sweet death. Over a few years, this rotberry shrub will grow into another rot heart. When trampled, a young rotberry will produce a small puff of toxic gas.
plants.rotberry.warden_desc=Normally a rotberry bush only produces a little gas when trampled, but _the Warden_ is able to harness energy from it to temporarily boost her strength!
plants.rotberry$seed.name=seed of rotberry
plants.sorrowmoss.name=sorrowmoss
plants.sorrowmoss.desc=A sorrowmoss is a flower (not a moss) with razor-sharp petals, coated with a deadly venom.
plants.sorrowmoss.warden_desc=When she tramples a sorrowmoss, _the Warden_ will be briefly imbued with toxin instead of being harmed.
plants.sorrowmoss$seed.name=seed of sorrowmoss
plants.starflower.name=starflower
plants.starflower.desc=A rare plant, starflower is said to grant holy power to whomever touches it.
plants.starflower.warden_desc=In addition to being blessed, _the Warden_ will gain a significant amount of wand recharging when she tramples a starflower.
plants.starflower$seed.name=seed of starflower
plants.stormvine.name=stormvine
plants.stormvine.desc=Gravity affects the stormvine plant strangely, allowing its whispy blue tendrils to 'hang' on the air. Anything caught in the vine is affected by this, and becomes disoriented.
plants.stormvine.warden_desc=_The Warden_ is able to control the gravitational effect of stormvine, and will briefly levitate when she tramples one.
plants.stormvine$seed.name=seed of stormvine
plants.sungrass.name=sungrass
plants.sungrass.desc=Sungrass is renowned for its sap's slow but effective healing properties.
plants.sungrass.warden_desc=_The Warden_ can receive healing from trampled sungrass even if she moves away from it.
plants.sungrass$seed.name=seed of sungrass
plants.sungrass$health.name=herbal healing
plants.sungrass$health.desc=Sungrass possesses excellent healing properties, though it is much slower than a potion of healing.\n\nMoving off the plant will break the healing effect.\n\nHealing remaining: %d.
plants.swiftthistle.name=swiftthistle
plants.swiftthistle.desc=When trampled, swiftthistle will briefly accelerate the flow of time around it, allowing the trampler to perform several actions instantly.
plants.swiftthistle.warden_desc=In addition to gaining instantaneous actions, _the Warden_ will also get a brief haste boost when trampling swiftthistle.
plants.swiftthistle$seed.name=seed of swiftthistle
plants.swiftthistle$timebubble.name=time bubble
plants.swiftthistle$timebubble.desc=A small bubble of accelerated time, allowing actions to be performed instantly. Attacking or using magic will break this effect however.\n\nTurns remaining: %s.
plants.blandfruitbush.discover_hint=You can find this plant randomly in the dungeon.
plants.plant.discover_hint=You can find this plant randomly in the dungeon, or grow it from its associated seed.
plants.rotberry.discover_hint=You can grow this plant from its associated seed during a specific quest.
