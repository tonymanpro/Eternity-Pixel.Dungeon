plants.blandfruitbush.name=Fadfrucht
plants.blandfruitbush.desc=Die birnenförmige Frucht des Fadfruchtbuschs, ein entfernter Verwandter der Faulbeere, schmeckt wie gebackener Staub. Diese Frucht ist recht widerwärtig und hat kaum Substanz, ist aber nicht giftig. Vielleicht sollte man sie kochen.
plants.blandfruitbush.discover_hint=Du findest diese Pflanze zufällig im Dungeon.
plants.blandfruitbush$seed.name=Fadfrucht-Samen

plants.blindweed.name=Blindkraut
plants.blindweed.desc=Bei Berührung zerplatzt das Blindkraut in einem grellen Lichtblitz. Das Licht ist hell genug, um dich für einige Sekunden zu desorientieren.
plants.blindweed.warden_desc=_Die Wächterin_ kanalisiert die Energie des Blindkrauts, um einen temporären Umhang der Unsichtbarkeit zu erschaffen, anstatt orientierungslos zu werden.
plants.blindweed$seed.name=Blindkraut-Samen

plants.mageroyal.name=Maguskönigskraut
plants.mageroyal.refreshed=Du fühlst dich erholt.
plants.mageroyal.desc=Die stacheligen Blüten des Maguskönigskrauts enthalten eine Chemikalie, die für ihre starken neutralisierenden Eigenschaften bekannt ist. Was auch immer in diese Pflanze gerät, wird von einer Vielzahl von negativen Effekten gereinigt.
plants.mageroyal.warden_desc=Zusätzlich zum neutralisierenden Effekt wird die _Wächterin_ zeitweilig immun gegen alle Flächeneffekte, wenn sie auf Maguskönigskraut tritt.
plants.mageroyal$seed.name=Maguskönigskraut-Samen

plants.earthroot.name=Erdwurzel
plants.earthroot.desc=Wenn eine Kreatur eine Erdwurzel berührt, formen die Wurzeln der Pflanze eine Art immobile natürliche Rüstung um sie.
plants.earthroot.warden_desc=Die Wurzeln einer Erdwurzelpflanze bewegen sich mit _der Wächterin_ und verleihen ihr eine mobile Rindenhautpanzerung.
plants.earthroot$seed.name=Erdwurzel-Samen
plants.earthroot$armor.name=pflanzliche Rüstung
plants.earthroot$armor.desc=Eine Art natürliche, aber unbewegliche Rüstung aus Rinde und Schlingen. \n\nDiese pflanzliche Rüstung absorbiert %d des Schadens von jedwedem Treffer, bis sie am Ende ihrer Lebensdauer in sich zusammenfällt.\n\nDie Rüstung darf nicht bewegt werden. Wenn du es versuchst, wird sie auseinanderbrechen und du verlierst sie.\n\nVerbleibende Rüstung: %d.

plants.fadeleaf.name=Blassblatt
plants.fadeleaf.desc=Wer ein Blassblatt berührt, wird zu einem zufälligen Ort innerhalb dieser Ebene teleportiert.
plants.fadeleaf.warden_desc=Der Teleportationseffekt von Blassblatt ist für _die Wächterin_ stärker und teleportiert sie an das Ende der vorherigen Ebene des Dungeons zurück.
plants.fadeleaf$seed.name=Blassblatt-Samen

plants.firebloom.name=Feuerblüte
plants.firebloom.desc=Wenn etwas eine Feuerblüte berührt, geht diese in Flammen auf.
plants.firebloom.warden_desc=Wenn sie eine Feuerblume zertrampelt, wird _die Wächterin_ kurzzeitig mit Flammen durchtränkt, anstatt Schaden zu nehmen.
plants.firebloom$seed.name=Feuerblüten-Samen

plants.icecap.name=Eiskappe
plants.icecap.desc=Sobald diese Pflanze berührt wird, stößt die Eiskappe einen Schwall von Gefrierpollen aus. Der Gefriereffekt ist wesentlich effektiver, wenn die Umgebung nass ist.
plants.icecap.warden_desc=Wenn sie eine Eiskappe zertrampelt, wird _die Wächterin_ kurzzeitig mit Frost durchtränkt, anstatt Schaden zu nehmen.
plants.icecap$seed.name=Eiskappen-Samen

plants.plant.warden_desc=Diese Pflanze hat keine besondere Wirkung, wenn sie von der Wächterin verwendet wird.
plants.plant.discover_hint=Du findest diese Pflanze zufällig im Dungeon, oder kannst sie mit dem dazugehörigen Samen anpflanzen.
plants.plant$seed.seed_of=%s/n-Samen
plants.plant$seed.ac_plant=PFLANZEN
plants.plant$seed.info=Wirf diesen Samen an die Stelle, wo du eine Pflanze wachsen lassen möchtest.\n\n%s
plants.plant$seed$placeholder.name=Samen

plants.rotberry.name=Faulbeere
plants.rotberry.desc=Die Beeren eines jungen Faulbeerenbusches schmecken nach süßem, süßem Tod. Im Verlauf einiger Jahre wird dieser Faulbeerenbusch zu einem Fäulnisherz heranwachsen. Wenn sie zertrampelt wird, setzt eine junge Faulbeere eine kleine Menge Giftgas frei.
plants.rotberry.warden_desc=Normalerweise bringt ein Fäulnisherzbusch nur wenig Gras hervor, wenn er zertrampelt wird, aber _die Wächterin_ kann sich die Energie des Strauches zunutze machen, um ihre Stärke vorübergehend zu erhöhen!
plants.rotberry.discover_hint=Du kannst diese Pflanze während einer bestimmten Aufgabe mit dem dazugehörigen Samen anpflanzen.
plants.rotberry$seed.name=Faulbeeren-Samen
plants.rotberry$seed.discover_hint=Du kannst diesen Gegenstand während einer bestimmten Aufgabe finden.

plants.sorrowmoss.name=Trauermoos
plants.sorrowmoss.desc=Das Trauermoos ist eine Blume (kein Moos), deren rasiermesserscharfe Blütenblätter mit einem tödlichen Gift beschichtet sind.
plants.sorrowmoss.warden_desc=Wenn sie ein Trauermoos zertrampelt, wird _die Wächterin_ kurzzeitig mit Gift durchtränkt, anstatt Schaden zu nehmen.
plants.sorrowmoss$seed.name=Trauermoos-Samen

plants.starflower.name=Sternblume
plants.starflower.desc=Die Sternblume ist eine extrem seltene Pflanze. Man sagt ihr nach, dass jeder, der sie berührt, heilige Kräfte erlangt.
plants.starflower.warden_desc=Zusätzlich zur Segnung erhält _die Wächterin_ eine erhebliche Menge an Zauberstabaufladung, wenn sie eine Sternblume zertrampelt.
plants.starflower$seed.name=Sternblüten-Samen

plants.stormvine.name=Sturmrebe
plants.stormvine.desc=Die Schwerkraft wirkt sich seltsam auf die Sturmrebe aus und lässt ihre blauen Ranken in der Luft "hängen". Alles, was sich in der Ranke verfängt, ist davon betroffen und wird desorientiert.
plants.stormvine.warden_desc=_Die Wächterin_ ist in der Lage, die Gravitationswirkung von Sturmreben zu kontrollieren und schwebt kurzzeitig, wenn sie eine zertrampelt.
plants.stormvine$seed.name=Sturmreben-Samen

plants.sungrass.name=Sonnengras
plants.sungrass.desc=Sonnengras ist für seine langsamen, aber effektiven Heilungskräfte bekannt.
plants.sungrass.warden_desc=_Die Wächterin_ kann Heilung von zertrampeltem Sonnengras erhalten, auch wenn sie sich davon wegbewegt.
plants.sungrass$seed.name=Sonnengras-Samen
plants.sungrass$health.name=Kräuterheilung
plants.sungrass$health.desc=Sonnengras hat ausgezeichnete Heilungseigenschaften, wobei diese aber viel langsamer als ein Heiltrank wirken.\n\nWenn du dich von der Pflanze fortbewegst, wird die Heilwirkung abbrechen.\n\nVerbleibende Heilung: %d.

plants.swiftthistle.name=Flinkdistel
plants.swiftthistle.desc=Wird die Flinkdistel zertrampelt, beschleunigt sie kurz den Fluss der Zeit und erlaubt demjenigen, der sie zertrampelt hat, augenblicklich mehrere Handlungen durchzuführen.
plants.swiftthistle.warden_desc=Zusätzlich zu den sofortigen Aktionen erhält _die Wächterin_ auch einen kurzen Eilschub, wenn sie eine Flinkdistel zertritt.
plants.swiftthistle$seed.name=Flinkdistel-Samen
plants.swiftthistle$timebubble.name=Zeitblase
plants.swiftthistle$timebubble.desc=Du befindest dich in einer kleinen Blase beschleunigter Zeit, welche es dir gestattet, mehrere Handlungen zeitgleich durchzuführen. Ein Angriff oder der Einsatz von Magie werden diesen Effekt jedoch beenden.\n\nVerbleibende Züge: %s.

# Eternity PD Fallback Keys
plants.blandfruitbush.name=blandfruit
plants.blandfruitbush.desc=Distant cousin of the rotberry, the pear-shaped produce of the blandfruit bush tastes like caked dust. The fruit is gross and unsubstantial but isn't poisonous. Perhaps it could be cooked.
plants.blandfruitbush$seed.name=seed of blandfruit
plants.blindweed.name=blindweed
plants.blindweed.desc=Upon being touched a blindweed perishes in a bright flash of light. The flash is strong enough to disorient for several seconds.
plants.blindweed.warden_desc=_The Warden_ will channel a blindweed's energy into a temporary shroud of invisibility, instead of being disoriented.
plants.blindweed$seed.name=seed of blindweed
plants.mageroyal.name=mageroyal
plants.mageroyal.refreshed=You feel refreshed.
plants.mageroyal.desc=The mageroyal's prickly flowers contain a chemical which is known for its properties as a strong neutralizing agent. Anything that steps in this plant will be cleansed of many negative effects.
plants.mageroyal.warden_desc=In addition to the neutralizing effect, _the Warden_ will become temporarily immune to all area-bound effects when stepping on mageroyal.
plants.mageroyal$seed.name=seed of mageroyal
plants.earthroot.name=earthroot
plants.earthroot.desc=When a creature touches an earthroot, its roots create a kind of immobile natural armor around it.
plants.earthroot.warden_desc=The roots of an earthroot plant will move with _the Warden_, providing her mobile barkskin armor.
plants.earthroot$seed.name=seed of earthroot
plants.earthroot$armor.name=herbal armor
plants.earthroot$armor.desc=A kind of natural, immobile armor made of bark and twine.\n\nThis herbal armor will block %d damage from any physical hit, until it eventually runs out of durability and collapses.\n\nAs the armor is immobile, moving will cause it to break apart and be lost.\n\nArmor remaining: %d.
plants.fadeleaf.name=fadeleaf
plants.fadeleaf.desc=Touching a fadeleaf will teleport any creature to a random place on the current level.
plants.fadeleaf.warden_desc=The teleportation effect of fadeleaf is more potent for _the Warden_, teleporting her back to the end of the previous dungeon level.
plants.fadeleaf$seed.name=seed of fadeleaf
plants.firebloom.name=firebloom
plants.firebloom.desc=When something touches a firebloom, it bursts into flames.
plants.firebloom.warden_desc=When she tramples a firebloom, _the Warden_ will be briefly imbued with flame instead of being harmed.
plants.firebloom$seed.name=seed of firebloom
plants.icecap.name=icecap
plants.icecap.desc=Upon being touched, an icecap lets out a puff of freezing pollen. The freezing effect is much stronger if the environment is wet.
plants.icecap.warden_desc=When she tramples an icecap, _the Warden_ will be briefly imbued with frost instead of being harmed.
plants.icecap$seed.name=seed of icecap
plants.plant.warden_desc=This plant has no special effect when used by the Warden.
plants.plant$seed.seed_of=seed of %s
plants.plant$seed.ac_plant=PLANT
plants.plant$seed.info=Throw this seed to the place where you want to grow a plant.\n\n%s
plants.plant$seed$placeholder.name=seed
plants.rotberry.name=rotberry
plants.rotberry.desc=The berries of a young rotberry shrub taste like sweet, sweet death. Over a few years, this rotberry shrub will grow into another rot heart. When trampled, a young rotberry will produce a small puff of toxic gas.
plants.rotberry.warden_desc=Normally a rotberry bush only produces a little gas when trampled, but _the Warden_ is able to harness energy from it to temporarily boost her strength!
plants.rotberry$seed.name=seed of rotberry
plants.sorrowmoss.name=sorrowmoss
plants.sorrowmoss.desc=A sorrowmoss is a flower (not a moss) with razor-sharp petals, coated with a deadly venom.
plants.sorrowmoss.warden_desc=When she tramples a sorrowmoss, _the Warden_ will be briefly imbued with toxin instead of being harmed.
plants.sorrowmoss$seed.name=seed of sorrowmoss
plants.starflower.name=starflower
plants.starflower.desc=A rare plant, starflower is said to grant holy power to whomever touches it.
plants.starflower.warden_desc=In addition to being blessed, _the Warden_ will gain a significant amount of wand recharging when she tramples a starflower.
plants.starflower$seed.name=seed of starflower
plants.stormvine.name=stormvine
plants.stormvine.desc=Gravity affects the stormvine plant strangely, allowing its whispy blue tendrils to 'hang' on the air. Anything caught in the vine is affected by this, and becomes disoriented.
plants.stormvine.warden_desc=_The Warden_ is able to control the gravitational effect of stormvine, and will briefly levitate when she tramples one.
plants.stormvine$seed.name=seed of stormvine
plants.sungrass.name=sungrass
plants.sungrass.desc=Sungrass is renowned for its sap's slow but effective healing properties.
plants.sungrass.warden_desc=_The Warden_ can receive healing from trampled sungrass even if she moves away from it.
plants.sungrass$seed.name=seed of sungrass
plants.sungrass$health.name=herbal healing
plants.sungrass$health.desc=Sungrass possesses excellent healing properties, though it is much slower than a potion of healing.\n\nMoving off the plant will break the healing effect.\n\nHealing remaining: %d.
plants.swiftthistle.name=swiftthistle
plants.swiftthistle.desc=When trampled, swiftthistle will briefly accelerate the flow of time around it, allowing the trampler to perform several actions instantly.
plants.swiftthistle.warden_desc=In addition to gaining instantaneous actions, _the Warden_ will also get a brief haste boost when trampling swiftthistle.
plants.swiftthistle$seed.name=seed of swiftthistle
plants.swiftthistle$timebubble.name=time bubble
plants.swiftthistle$timebubble.desc=A small bubble of accelerated time, allowing actions to be performed instantly. Attacking or using magic will break this effect however.\n\nTurns remaining: %s.
plants.blandfruitbush.discover_hint=You can find this plant randomly in the dungeon.
plants.plant.discover_hint=You can find this plant randomly in the dungeon, or grow it from its associated seed.
plants.rotberry.discover_hint=You can grow this plant from its associated seed during a specific quest.
