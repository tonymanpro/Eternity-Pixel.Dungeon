items.stones.stoneofdetectmagic.inv_title=Detect an item
items.stones.stoneofdetectmagic.detected_none=You don't detect any magic affecting this item.
items.stones.stoneofdetectmagic.detected_both=You detect both positive and malevolent magic affecting this item!
items.stones.stoneofdetectmagic.detected_good=You detect positive magic affecting this item!
items.stones.stoneofdetectmagic.detected_bad=You detect malevolent magic affecting this item!
items.stones.stoneofdetectmagic.desc=This runestone is able to detect magic affecting an item. Using this stone on an unidentified item will tell you if it is affected by a malevolent curse and whether it is affected by positive magic such as an enchantment or upgrades.
items.trinkets.chaoticcenser.spew=Your censer is about to spew: %s.
items.trinkets.crackedspyglass.name=cracked spyglass
items.trinkets.crackedspyglass.desc=This handheld telescope would be a demonstration of great and precise workmanship, if it weren't for the crack along its front lens. The spyglass seems to be helping you by revealing new items in the dungeon, but due to its flaw the revealed items are quite hard to see!
items.trinkets.crackedspyglass.typical_stats_desc=Typically this trinket has a _%1$s%% chance_ to create an extra hidden item on each non-boss floor.
items.trinkets.crackedspyglass.stats_desc=At its current level, this trinket has a _%1$s%% chance_ to create an extra hidden item on each non-boss floor.
items.trinkets.crackedspyglass.stats_desc_upgraded=At its current level, this trinket has a _100%% chance_ to create an extra hidden item on each non-boss floor, and a _%1$s%% chance_ to create a second extra hidden item.
items.trinkets.trinketcatalyst.window_title=create a trinket
items.trinkets.trinket.discover_hint=This item has a chance to be an option whenever you craft a trinket via alchemy.
