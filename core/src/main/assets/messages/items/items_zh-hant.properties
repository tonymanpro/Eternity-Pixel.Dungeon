###armor curses
items.armor.curses.antientropy.name=反熵%s
items.armor.curses.antientropy.desc=反熵詛咒與宇宙法則背道而馳，將環境中的熱能轉移到穿戴者身上。這會使穿戴者燃燒起來，並立刻使其周圍陷入冰凍。

items.armor.curses.bulk.name=臃腫%s
items.armor.curses.bulk.desc=臃腫詛咒會讓你的護甲看起來十分結實厚壯，但它並不會因此給你增加防御力。反之，如此龐大的體型還讓你在走進門框時更加困難。

items.armor.curses.corrosion.name=腐蝕%s
items.armor.curses.corrosion.desc=腐蝕護甲會噴濺出腐蝕性液體，為區域內所有東西蓋上一層黏糊糊的腐蝕淤泥。

items.armor.curses.displacement.name=位移%s
items.armor.curses.displacement.desc=位移詛咒會在穿戴者受到攻擊時試圖將其傳送到安全地帶。不過其效果有些過於強大了，導致使用者只會隨機傳送到同樓層各處。

items.armor.curses.metabolism.name=代謝%s
items.armor.curses.metabolism.desc=具代謝詛咒的裝甲，能在穿戴者受傷時，將飽食度直接轉化為生命值。這能提供額外的治療，但易使人陷入嚴重飢餓。

items.armor.curses.multiplicity.name=分身%s
items.armor.curses.multiplicity.desc=具有分身詛咒的護甲含有危險的複製魔法。在戰鬥中它有時會複製出穿戴者的鏡像，但也有同等機率複製攻擊者!

items.armor.curses.overgrowth.name=叢生%s
items.armor.curses.overgrowth.desc=叢生詛咒會使你的護甲被各式植物覆蓋。雖然這種效果看起來相當有趣，但並不能強化防禦能力，而且會在戰鬥中不斷觸發並干擾你!

items.armor.curses.stench.name=惡臭%s
items.armor.curses.stench.desc=具有惡臭詛咒的護甲會釋放出團團毒霧，對一切來不及逃離的對象造成傷害。


###glyphs
items.armor.glyphs.affection.name=魅惑%s
items.armor.glyphs.affection.desc=這種_強力_刻印能夠操控攻擊者的心智，暫時地魅惑他們。

items.armor.glyphs.antimagic.name=敵法%s
items.armor.glyphs.antimagic.desc=這種_強力_刻印使護甲能夠像防禦物理攻擊那樣防禦大部分的魔法攻擊。這種對魔法的防禦不受防具階數影響。

items.armor.glyphs.brimstone.name=禦火%s
items.armor.glyphs.brimstone.desc=這種刻印會保護穿戴者與其所有物免受火焰的傷害與不利影響。

items.armor.glyphs.camouflage.name=迷彩%s
items.armor.glyphs.camouflage.desc=這種刻印能讓穿戴者與高草融為一體，得到短暫的隱身效果。

items.armor.glyphs.entanglement.name=纏繞%s
items.armor.glyphs.entanglement.desc=這種刻印能在穿戴者周圍生出地縛根護甲。護甲能抵擋傷害，但會在穿戴者移動後散落失效。

items.armor.glyphs.flow.name=涌流%s
items.armor.glyphs.flow.desc=這種刻印能操控穿戴者周圍的水流，大幅加快穿戴者在水中移動的速度。

items.armor.glyphs.obfuscation.name=晦暗%s
items.armor.glyphs.obfuscation.desc=這種刻印能夠掩蓋穿戴者的氣息，使其更難以被發現。

items.armor.glyphs.potential.name=電勢%s
items.armor.glyphs.potential.desc=這種刻印會在受外力打擊時積蓄能量，並將其轉移至法杖上。

items.armor.glyphs.repulsion.name=反斥%s
items.armor.glyphs.repulsion.desc=這種刻印會將敵人攻擊的衝擊力反彈回去，使攻擊者飛至遠處。

items.armor.glyphs.stone.name=磐岩%s
items.armor.glyphs.stone.desc=這種刻印使用沉重的魔法石環繞整種護甲，令使用者無法閃避，但會根據自身原有的閃避率格擋更多傷害。

items.armor.glyphs.swiftness.name=迅捷%s
items.armor.glyphs.swiftness.desc=這種刻印會提高穿戴者的移動速度，但穿戴者附近有敵人時，刻印不會生效。

items.armor.glyphs.thorns.name=荊棘%s
items.armor.glyphs.thorns.desc=這種_強力_刻印會對攻擊者反擊，使其在攻擊穿戴者時緩慢失血。

items.armor.glyphs.viscosity.name=黏稠%s
items.armor.glyphs.viscosity.deferred=延緩%d點傷害
items.armor.glyphs.viscosity$defereddamage.name=遞延傷害
items.armor.glyphs.viscosity$defereddamage.ondeath=遞延的傷害還是殺掉了你……
items.armor.glyphs.viscosity$defereddamage.rankings_desc=死於遞延傷害
items.armor.glyphs.viscosity$defereddamage.desc=瞬時的傷害受到了延緩，隨時間緩慢釋放。\n\n剩餘的遞延傷害:%d。
items.armor.glyphs.viscosity.desc=這種刻印在裝甲抵擋傷害後，會儲存部分未能擋下的傷害，將其緩慢地對穿戴者釋放，能避免穿戴者一下子受到重擊。



###armor
items.armor.armor.ac_detach=拆卸
items.armor.armor.detach_seal=你將紋章從護甲上摘了下來。
items.armor.armor.equip_cursed=這件護甲緊緊地勒住了你，令你疼痛。
items.armor.armor.identify=你對身上的護甲了解充分，已完全鑑定其屬性。
items.armor.armor.hardening_gone=你護甲上的硬化效果被損耗掉了!
items.armor.armor.incompatible=不同種類的魔法互相衝突，消除了護甲上的刻印!
items.armor.armor.curr_absorb=這件_%1$d階_護甲能抵擋_%2$d~%3$d點傷害_並且需要_%4$d點力量_來正常使用。
items.armor.armor.avg_absorb=這件_%1$d階_護甲通常能抵擋_%2$d~%3$d點傷害_並且需要_%4$d點力量_來正常使用。
items.armor.armor.too_heavy=由於你的力量不足，使用這件護甲會降低你的移動、閃避以及防禦能力。
items.armor.armor.probably_too_heavy=這套護甲對你來說或許太重了。
items.armor.armor.excess_str=你的額外力量使你穿戴著這件護甲時_更容易閃避_。
items.armor.armor.evasion=這件護甲強化了_閃避_能力。
items.armor.armor.defense=這件護甲強化了_防禦_能力。
items.armor.armor.inscribed=這件護甲上面鐫刻著 _%s_。
items.armor.armor.glyph_hardened=它被_硬化_了。
items.armor.armor.hardened_no_glyph=這護甲已被_硬化_，但尚未受刻印影響。
items.armor.armor.cursed_worn=這件護甲帶有詛咒，所以你無法卸下它。
items.armor.armor.cursed=你能感覺到這套護甲裡潛伏著一股充滿惡意的魔力。
items.armor.armor.weak_cursed=儘管護甲上有詛咒，你仍能將它卸下。
items.armor.armor.not_cursed=這件護甲沒有被詛咒。
items.armor.armor.seal_attached=這件護甲上貼有戰士的紋章。當戰士受到攻擊，生命值要掉至半數以下前，會得到_%d點護盾_。
items.armor.armor.seal_transfer=戰士的紋章需要貼在身著的護甲上才能生效。你是否要拆下紋章，把它貼到正在裝備的護甲上?
items.armor.armor.seal_transfer_yes=是
items.armor.armor.seal_transfer_no=否
items.armor.armor$glyph.glyph=刻印
items.armor.armor$glyph.killed=%s害死了你……
items.armor.armor$glyph.rankings_desc=被刻印害死
items.armor.armor$glyph.discover_hint=此刻紋可能出現在地下城內的護甲上，也有可能出現在你所刻印的護甲上。

items.armor.classarmor.ac_ability=選擇技能
items.armor.classarmor.ac_transfer=轉移
items.armor.classarmor.no_ability=你的護甲目前沒有技能，你應該選擇一項!
items.armor.classarmor.not_equipped=你需要穿戴這套護甲才能使用它的力量!
items.armor.classarmor.low_charge=護甲尚未積蓄足夠的能量來釋放技能!
items.armor.classarmor.charge_use=使用此能力目前消耗的充能為_%s_。
items.armor.classarmor.transfer_title=轉移能力
items.armor.classarmor.transfer_desc=王冠上的魔力可以轉移至其他護甲中，但原本的護甲會被摧毀。
items.armor.classarmor.transfer_prompt=選擇一件護甲
items.armor.classarmor.transfer_cancel=取消
items.armor.classarmor.transfer_complete=你的英雄護甲的能力已被轉移!
items.armor.classarmor.discover_hint=此種護甲是擊敗第四區頭目的掉落物，與任一件護甲，融合成的產物。

items.armor.clericarmor.name=英雄祭服
items.armor.clericarmor.desc=穿著這件內鑲板甲的祭服時，牧師可以施展一項特殊技能。

items.armor.clotharmor.name=布甲
items.armor.clotharmor.desc=這件輕便的護甲能提供最基本的防禦。
items.armor.clotharmor.discover_hint=此物品是所有英雄的初始裝備。

items.armor.duelistarmor.name=英雄胸甲
items.armor.duelistarmor.desc=穿著這套護胸甲與披風時，決鬥者可以施展一項特殊技能。

items.armor.huntressarmor.name=英雄披風
items.armor.huntressarmor.no_enemies=可視範圍中未發現敵人
items.armor.huntressarmor.desc=披上這件斗篷時，獵人可以施展一項特殊技能。

items.armor.leatherarmor.name=皮甲
items.armor.leatherarmor.desc=用鞣製的獸皮製成的護甲。沒有布甲輕，但防禦力較佳。

items.armor.magearmor.name=英雄法袍
items.armor.magearmor.desc=穿著這件華貴的長袍時，法師可以施展一項特殊技能。

items.armor.mailarmor.name=鎖子甲
items.armor.mailarmor.desc=由金屬鏈環環相扣製成的護甲，既結實又靈活。

items.armor.platearmor.name=板甲
items.armor.platearmor.desc=厚重的金屬版拼接成的護甲。重量駭人，但對力量足夠的冒險家來說，其防禦力無與倫比。

items.armor.roguearmor.name=英雄風衣
items.armor.roguearmor.desc=穿著這套能融合於暗影的服裝時，盜賊可以施展一項特殊技能。

items.armor.scalearmor.name=鱗甲
items.armor.scalearmor.desc=在厚實的皮背心中縫入金屬鱗片，形成了靈活而高防禦的護甲。

items.armor.warriorarmor.name=英雄護甲
items.armor.warriorarmor.desc=穿著這件特重的板甲時，戰士可以施展一項特殊技能。



###artifacts
items.artifacts.alchemiststoolkit.name=煉金工具箱
items.artifacts.alchemiststoolkit.ac_brew=煉制
items.artifacts.alchemiststoolkit.ac_energize=供能
items.artifacts.alchemiststoolkit.not_ready=你的工具箱尚未完成預熱。
items.artifacts.alchemiststoolkit.cursed=受詛咒的工具箱正在阻止你煉金!
items.artifacts.alchemiststoolkit.need_energy=你需要至少六粒煉金能量才能強化它。
items.artifacts.alchemiststoolkit.energize_desc=每六粒能量晶體能使工具箱提升一級，每次升級能增加生產效率及預熱速度。\n\n你想提供你的工具箱多少能量?
items.artifacts.alchemiststoolkit.energize_1=6能量:+1級
items.artifacts.alchemiststoolkit.energize_all=%1$d能量:+%2$d級
items.artifacts.alchemiststoolkit.desc=工具箱內存放著各類試劑、草藥以及一瓶小混合瓶，讓使用者能在任何地方進行煉金實驗。混合瓶內似乎裝著液體形式的煉金能量晶體。
items.artifacts.alchemiststoolkit.desc_cursed=被詛咒的工具箱將自己緊緊固定在你的身側，抑制著你使用煉金工具的能力。
items.artifacts.alchemiststoolkit.desc_warming=工具箱正在預熱，等會就能使用了。
items.artifacts.alchemiststoolkit.desc_hint=你所裝備的工具箱正隨著你經驗值的增長緩慢製造能量晶體。試劑中的液體或許能透過能量晶體強化。

items.artifacts.artifact.cannot_wear_two=你不能裝備兩件相同的神器。
items.artifacts.artifact.equip_cursed=這件神器死死地附著在身上，令你疼痛。
items.artifacts.artifact.curse_known=你能感覺到在這個神器上潛伏著一股充滿惡意的魔力。
items.artifacts.artifact.not_cursed=這件神器沒有被詛咒。
items.artifacts.artifact.need_to_equip=你需要裝備神器才能進行該操作。

items.artifacts.capeofthorns.name=荊棘斗篷
items.artifacts.capeofthorns.desc=這些從DM-300上掉落的金屬片構成了一件堅硬的斗篷。它似乎能儲存很多能量，也許它還殘留有少量DM-300的能力?
items.artifacts.capeofthorns.desc_inactive=斗篷壓在你的肩上的感覺非常沉重，它似乎能從你受的傷裡獲得能量。
items.artifacts.capeofthorns.desc_active=斗篷似乎在釋放其存儲的能量，並將其輻射出一種防護力場。
items.artifacts.capeofthorns$thorns.inert=你的斗篷再次失效了。
items.artifacts.capeofthorns$thorns.radiating=你的斗篷正在釋放存儲的能量，你感到自己正在被保護著!
items.artifacts.capeofthorns$thorns.levelup=你的斗篷變得更強大了!
items.artifacts.capeofthorns$thorns.name=荆棘
items.artifacts.capeofthorns$thorns.desc=你的斗篷正在你的周圍輻射能量，使你受到一個偏斜力場的包圍!\n\n該效果下你受到的所有傷害都會減少。此外，如果攻擊者就在你旁邊，被減少的傷害會反彈給攻擊者。\n\n荊棘效果持續時間:%s。

items.artifacts.chaliceofblood.name=蓄血聖盃
items.artifacts.chaliceofblood.ac_prick=血祭
items.artifacts.chaliceofblood.yes=是的，我知道我在做什麼
items.artifacts.chaliceofblood.no=不，我改變主意了
items.artifacts.chaliceofblood.prick_warn=每次使用聖盃都會消耗你更多的生命能量，但加快你的被動生命恢復。\n\n目前，用聖盃割傷自己時，會造成_%1$d~%2$d點傷害_，但可由_任何減傷方法_減輕。無減傷時，聖杯有_%3$s%%_機率把你的生命吸乾。\n\n你確定要給它更多的生命能量嗎？
items.artifacts.chaliceofblood.onprick=你刺破了自己的手指，使你的生命精華流入了聖盃。
items.artifacts.chaliceofblood.ondeath=聖盃將你的生命精華吸噬殆盡了……
items.artifacts.chaliceofblood.desc=這個閃閃發光的銀質酒杯在邊沿突兀地裝飾著幾顆造型尖銳的寶石。
items.artifacts.chaliceofblood.desc_cursed=被詛咒的聖盃將自己固定在你手上，抑制著你恢復生命的能力。
items.artifacts.chaliceofblood.desc_1=握住聖盃的那一刻，你涌起一股想在那些尖銳寶石上刺傷自己的奇特衝動。
items.artifacts.chaliceofblood.desc_2=你的一些血液彙集到聖盃裡，你可以隱約感受到聖盃在為你送來生命能量，加快被動生命恢復。你還想用聖盃繼續割傷自己，即便你知道那很痛。
items.artifacts.chaliceofblood.desc_3=聖盃已經被你的生命精華填滿。你可以感覺到聖盃正將生命能量傾瀉般回饋給你。

items.artifacts.cloakofshadows.name=暗影斗篷
items.artifacts.cloakofshadows.ac_stealth=潛行
items.artifacts.cloakofshadows.cooldown=你的斗篷還需要%d回合來重新激活。
items.artifacts.cloakofshadows.cursed=詛咒封鎖了斗篷的魔力。
items.artifacts.cloakofshadows.no_charge=你的斗篷充能不足無法使用。
items.artifacts.cloakofshadows.desc=這件無價的魔法斗篷原屬皇家軍械庫，是盜賊多年前親手偷來的贓物。披上時，能夠使盜賊在短時間內完全隱身。\n\n斗篷越用越強大，能使盜賊更頻繁的隱身，持續時間也更長。
items.artifacts.cloakofshadows.discover_hint=此物品是某位英雄的初始裝備。
items.artifacts.cloakofshadows$cloakstealth.no_charge=你的斗篷耗盡了能量。
items.artifacts.cloakofshadows$cloakstealth.levelup=你的斗篷變得更強大了!
items.artifacts.cloakofshadows$cloakstealth.name=影遁
items.artifacts.cloakofshadows$cloakstealth.desc=你身上的暗影斗篷正給予你隱形效果。再次使用斗篷，或斗篷充能耗盡時，隱形效果即結束。\n\n當你在隱形時敵人無法追蹤或攻擊你。大部分物理攻擊與魔法(比如卷軸與法杖)會立即消除隱形效果。\n\n斗篷在%d回合後將消耗下一點充能。

items.artifacts.driedrose.name=乾枯玫瑰
items.artifacts.driedrose.ac_summon=召喚
items.artifacts.driedrose.ac_direct=指引
items.artifacts.driedrose.ac_outfit=配裝
items.artifacts.driedrose.spawned=你已經召喚出幽靈了。
items.artifacts.driedrose.no_charge=你的玫瑰尚未充能完畢。
items.artifacts.driedrose.cursed=你嘗試叫出幽靈，但玫瑰只傳回一些虛空中的迴響。
items.artifacts.driedrose.no_space=你附近沒有可用於召喚的空地。
items.artifacts.driedrose.charged=你的玫瑰已經充能完畢!
items.artifacts.driedrose.desc=這就是那朵在幽靈消失前提及的玫瑰嗎?它似乎擁有某種靈魂力量，也許能以此為媒介觸及這位隕落戰士的能量。
items.artifacts.driedrose.desc_no_quest=一株因歲月而乾枯但仍然沒有完全凋零的玫瑰。\n\n玫瑰上似乎殘留了一些靈魂力量，但你目前還不知道如何使用它。
items.artifacts.driedrose.desc_hint=它似乎缺少了一些花瓣。也許把花瓣拼回來可以增強玫瑰。
items.artifacts.driedrose.desc_cursed=受詛咒的玫瑰將自己綁在了你的手上，你感覺到它出奇的冷。
items.artifacts.driedrose.desc_weapon=幽靈的武器:%s
items.artifacts.driedrose.desc_armor=幽靈的護甲:%s
items.artifacts.driedrose.desc_strength=幽靈的力量:%s
items.artifacts.driedrose$petal.name=乾枯的花瓣
items.artifacts.driedrose$petal.no_rose=你沒有玫瑰來添加這片花瓣。
items.artifacts.driedrose$petal.no_room=你的玫瑰已經放不下這片花瓣了，所以你無視了它。
items.artifacts.driedrose$petal.maxlevel=玫瑰再一次完整了!
items.artifacts.driedrose$petal.levelup=你將花瓣放在了玫瑰上。
items.artifacts.driedrose$petal.desc=一片乾枯脆弱的花瓣，不知為何在這麼深的地下城中保存了下來。
items.artifacts.driedrose$wndghosthero.title=幽靈的裝備
items.artifacts.driedrose$wndghosthero.desc=幽靈本身很脆弱，但它的形體已完整到足以裝備一件武器與防具。它能像你一般將其裝備運用自如。\n\n幽靈目前可以裝備_力量需求為%d_的物品。
items.artifacts.driedrose$wndghosthero.weapon_prompt=選擇一件武器
items.artifacts.driedrose$wndghosthero.armor_prompt=選擇一件護甲
items.artifacts.driedrose$wndghosthero.cant_unique=幽靈無法使用特殊裝備。
items.artifacts.driedrose$wndghosthero.cant_cursed=幽靈只能使用你確定沒有詛咒的裝備。
items.artifacts.driedrose$wndghosthero.cant_strength_unknown=你無法確定此裝備對幽靈來說是不是太重。
items.artifacts.driedrose$wndghosthero.cant_strength=幽靈的形體還不夠強大，無法裝備此物品。

##ghost hero
items.artifacts.driedrose$ghosthero.name=悲傷幽靈
items.artifacts.driedrose$ghosthero.def_verb=閃避
items.artifacts.driedrose$ghosthero.discover_hint=此角色可被某神器召喚。

items.artifacts.driedrose$ghosthero.hello=你好，%s，我們又見面了。
items.artifacts.driedrose$ghosthero.introduce=我的靈魂與這朵玫瑰相連，對我來說它非常珍貴，是我愛人在我離開地面前送給我的禮物。\n\n我已無法回到他身邊了，但感謝你給我再一次完成旅程的機會。當我做好準備後，我將回應你的呼喚並與你並肩作戰。\n\n只要你還帶著那朵玫瑰，我就能聽到你的聲音，你就能可以在遠處指引我前進。\n\n希望你能在我倒下的地方繼續走下去……

items.artifacts.driedrose$ghosthero.dialogue_sewers_1=下水道曾經是安全的，人們甚至曾住在這裡過冬。
items.artifacts.driedrose$ghosthero.dialogue_sewers_2=我很好奇在這裡曾經的那些守衛身上發生了什麼，他們放棄巡邏了嗎?
items.artifacts.driedrose$ghosthero.dialogue_sewers_3=我在地面上也有過家人，只希望他們一切安好。
items.artifacts.driedrose$ghosthero.dialogue_sewers_4=守衛們沒能解決這些怪物，但也許我們可以。
items.artifacts.driedrose$ghosthero.dialogue_sewers_5=連下水道都如此危險，不知更深處又會有些什麼……
items.artifacts.driedrose$ghosthero.dialogue_sewers_6=是什麼讓這些老鼠和螃蟹長得如此龐大?
items.artifacts.driedrose$ghosthero.dialogue_prison_1=我聽說過不少有關此處的傳聞，無一不是噩耗。
items.artifacts.driedrose$ghosthero.dialogue_prison_2=這座監獄簡直跟地下城有得比。
items.artifacts.driedrose$ghosthero.dialogue_prison_3=我難以想象這裡被遺棄後發生了什麼。
items.artifacts.driedrose$ghosthero.dialogue_prison_4=似乎此處的囚犯與獄卒都已經轉變成怪物了。
items.artifacts.driedrose$ghosthero.dialogue_prison_5=這麼多骷髏都是從哪裡搞來的?
items.artifacts.driedrose$ghosthero.dialogue_prison_6=這些人本不必落得如此下場……
items.artifacts.driedrose$ghosthero.dialogue_caves_1=這裡似乎有很長一段時間沒有被人類或矮人們踏足過了。
items.artifacts.driedrose$ghosthero.dialogue_caves_2=究竟是什麼使矮人放棄了這樣一座金礦?
items.artifacts.driedrose$ghosthero.dialogue_caves_3=這裡的黃金在地表上一文不值，真是可惜。
items.artifacts.driedrose$ghosthero.dialogue_caves_4=這裡的生物與下水道的一樣，都被魔力扭曲了。
items.artifacts.driedrose$ghosthero.dialogue_caves_5=這裡連蝙蝠也如此狂暴嗜血。
items.artifacts.driedrose$ghosthero.dialogue_caves_6=這裡似乎沒有任何採礦設備存在的跡象，它們都被矮人們回收了嗎?
items.artifacts.driedrose$ghosthero.dialogue_city_1=矮人一族雖是勤奮，卻太過貪婪。
items.artifacts.driedrose$ghosthero.dialogue_city_2=看來矮人都城的確已經沒落了。
items.artifacts.driedrose$ghosthero.dialogue_city_3=我希望地表上永遠不會墮落成這樣。
items.artifacts.driedrose$ghosthero.dialogue_city_4=矮人們看起來本不應如此蒼白的。
items.artifacts.driedrose$ghosthero.dialogue_city_5=矮人和它們的造物，我說不出哪個更差勁。
items.artifacts.driedrose$ghosthero.dialogue_city_6=看來矮人們也變成了沒有思想的怪物。
items.artifacts.driedrose$ghosthero.dialogue_halls_1=這是什麼地方?
items.artifacts.driedrose$ghosthero.dialogue_halls_2=這地方真令人膽寒……
items.artifacts.driedrose$ghosthero.dialogue_halls_3=這些矮人居然試圖玩弄這股力量，他們到底在想什麼?
items.artifacts.driedrose$ghosthero.dialogue_halls_4=這些怪物是如此的詭異，它們來自何方?
items.artifacts.driedrose$ghosthero.dialogue_halls_5=你感覺到了嗎?似乎有什麼在注視著我們。
items.artifacts.driedrose$ghosthero.dialogue_halls_6=還好有火把，這裡太暗了!
items.artifacts.driedrose$ghosthero.dialogue_ascension_1=怎麼回事?我們不是成功了?
items.artifacts.driedrose$ghosthero.dialogue_ascension_2=那鬼東西怎麼還能影響這裡?
items.artifacts.driedrose$ghosthero.dialogue_ascension_3=我希望你知道該拿這護符做什麼。
items.artifacts.driedrose$ghosthero.dialogue_ascension_4=很明顯這事情還沒結束。
items.artifacts.driedrose$ghosthero.dialogue_ascension_5=都走這麼遠了，我們做得到的!
items.artifacts.driedrose$ghosthero.dialogue_ascension_6=再走一段路就能離開這恐怖的地方了!

items.artifacts.driedrose$ghosthero.seen_goo_1=小心黏咕!
items.artifacts.driedrose$ghosthero.seen_goo_2=被這東西殺死的朋友太多了，今日我必殺它!
items.artifacts.driedrose$ghosthero.seen_goo_3=我不允許如此骯髒之物留存於此世上!
items.artifacts.driedrose$ghosthero.seen_tengu_1=而最後一個囚犯則是位致命的刺客。果然在預料之內……
items.artifacts.driedrose$ghosthero.seen_tengu_2=我們被他困住了!
items.artifacts.driedrose$ghosthero.seen_tengu_3=有關那個面具的駭人傳說我聽的不少……
items.artifacts.driedrose$ghosthero.seen_dm300_1=只有矮人才幹得出讓掘礦機器追殺外來者這種事。
items.artifacts.driedrose$ghosthero.seen_dm300_2=真是個大塊頭……
items.artifacts.driedrose$ghosthero.seen_dm300_3=這機器怎麼能運作這麼久?
items.artifacts.driedrose$ghosthero.seen_king_1="權力導致腐敗"的說法指的就是這種情況。
items.artifacts.driedrose$ghosthero.seen_king_2=什麼國王，根本就是巫妖。
items.artifacts.driedrose$ghosthero.seen_king_3=甚至在死後這群矮人也聽命於他們的頭領。
items.artifacts.driedrose$ghosthero.seen_yog_1=呃，這看起來不太妙。
items.artifacts.driedrose$ghosthero.seen_yog_2=神的容貌就是如此嗎?
items.artifacts.driedrose$ghosthero.seen_yog_3=這下要吃點苦頭了……

items.artifacts.driedrose$ghosthero.defeated_by_enemy_1=祝你好運……
items.artifacts.driedrose$ghosthero.defeated_by_enemy_2=有點……累了……
items.artifacts.driedrose$ghosthero.defeated_by_enemy_3=記得召喚我……
items.artifacts.driedrose$ghosthero.defeated_by_boss_1=抱歉……祝你好運……
items.artifacts.driedrose$ghosthero.defeated_by_boss_2=別管我……解決它……
items.artifacts.driedrose$ghosthero.defeated_by_boss_3=不……我不能……
items.artifacts.driedrose$ghosthero.blessed_ankh_1=你是怎麼活下來的?
items.artifacts.driedrose$ghosthero.blessed_ankh_2=當初若我也有這個該多好……
items.artifacts.driedrose$ghosthero.blessed_ankh_3=天哪!你還活著!
items.artifacts.driedrose$ghosthero.player_killed_1=不!……
items.artifacts.driedrose$ghosthero.player_killed_2=我卻什麼也做不了……
items.artifacts.driedrose$ghosthero.player_killed_3=這一切本不該如此……

items.artifacts.driedrose$ghosthero.direct_prompt=我該怎麼做?
items.artifacts.driedrose$ghosthero.directed_follow_1=好的，我會跟緊你的。
items.artifacts.driedrose$ghosthero.directed_follow_2=我會跟在你身後。
items.artifacts.driedrose$ghosthero.directed_follow_3=跟著你……
items.artifacts.driedrose$ghosthero.directed_follow_4=好的，走吧!
items.artifacts.driedrose$ghosthero.directed_follow_5=我來掩護你背後。
items.artifacts.driedrose$ghosthero.directed_attack_1=好，我去解決那個。
items.artifacts.driedrose$ghosthero.directed_attack_2=我來對付它。
items.artifacts.driedrose$ghosthero.directed_attack_3=接近了……
items.artifacts.driedrose$ghosthero.directed_attack_4=一起解決它們!
items.artifacts.driedrose$ghosthero.directed_attack_5=那個交給我。
items.artifacts.driedrose$ghosthero.directed_position_1=好，我守住那裡。
items.artifacts.driedrose$ghosthero.directed_position_2=我會在那裡防住它們。
items.artifacts.driedrose$ghosthero.directed_position_3=這就去……
items.artifacts.driedrose$ghosthero.directed_position_4=在路上了!
items.artifacts.driedrose$ghosthero.directed_position_5=那我走那邊。

items.artifacts.driedrose$ghosthero.desc=這是一個擁有人類外形的脆弱幻影。它的力量似乎與你手上的玫瑰聯繫在了一起。\n\n這個幽靈雖無過人之處，但它似乎是你在這裡唯一可信任的摯友了。

##back to artifacts
items.artifacts.etherealchains.name=虛空鎖鏈
items.artifacts.etherealchains.ac_cast=施放
items.artifacts.etherealchains.rooted=你被纏繞了，鎖鏈無法拉動你。
items.artifacts.etherealchains.no_charge=你的鎖鏈充能不足。
items.artifacts.etherealchains.cursed=你甚至沒法將鎖鏈從你身上解開。
items.artifacts.etherealchains.does_nothing=這樣並沒有用。
items.artifacts.etherealchains.cant_pull=你的鎖鏈不能拉動那個目標。
items.artifacts.etherealchains.cant_reach=你的鎖鏈無法觸及那裡。
items.artifacts.etherealchains.inside_wall=你的鎖鏈只能使自己穿越牆壁，而不是進到牆壁裡面。
items.artifacts.etherealchains.nothing_to_grab=目標區域沒有可供抓取的物件。
items.artifacts.etherealchains.prompt=選擇要瞄準的地方
items.artifacts.etherealchains.desc=這些巨大但輕盈的鎖鏈散發著靈魂能量。它們可以用來把你拉向一些地形，或將敵人拉向你。因其虛無飄渺且具有靈力，使用者甚至可以與鎖鏈一同穿透牆壁!
items.artifacts.etherealchains.desc_cursed=受詛咒的鎖鏈將自己鎖在了你的身邊，不斷地在周圍晃動，試圖絆倒或綁住你。
items.artifacts.etherealchains.desc_equipped=鎖鏈圍繞在你的身邊，緩慢地收集被你擊敗者的精神能量。每一發充能都是鎖鏈中的一環，每一個環節都能正好延長一格。
items.artifacts.etherealchains$chainsrecharge.levelup=你的鎖鏈變得更強大了!

items.artifacts.holytome.name=神聖法典
items.artifacts.holytome.ac_cast=施法
items.artifacts.holytome.no_spell=聖典的充能不足以使用此法術。
items.artifacts.holytome.cursed=聖典在詛咒的荼毒下，失去了它應有的神聖能量。
items.artifacts.holytome.levelup=你的聖典變得更強大了!
items.artifacts.holytome.desc=聖典引導牧師內在魔力，讓牧師可以施出多種魔法。\n\n聖典越用越強大，可儲存的能量也越多，能量恢復的速度也會稍微加快。
items.artifacts.holytome.discover_hint=此物品是某位英雄的初始裝備。

items.artifacts.hornofplenty.name=豐饒之角
items.artifacts.hornofplenty.ac_snack=淺嚐
items.artifacts.hornofplenty.ac_eat=食用
items.artifacts.hornofplenty.ac_store=貯存
items.artifacts.hornofplenty.eat=你享用了號角中的食物。
items.artifacts.hornofplenty.prompt=選擇一個食物
items.artifacts.hornofplenty.no_food=你的號角裡沒有食物可供食用!
items.artifacts.hornofplenty.full=你的號角裝滿了食物!
items.artifacts.hornofplenty.reject=你的號角並不接受未經烹煮的無味果。
items.artifacts.hornofplenty.maxlevel=你的號角吞噬了食物，並充滿了豐饒之力!
items.artifacts.hornofplenty.levelup=號角吞噬了你提供的食物，變得更加強大了。
items.artifacts.hornofplenty.feed=號角吞噬了你提供的食物。
items.artifacts.hornofplenty.desc=這隻號角吹不出聲音，但裝備在身上時，似乎能隨經驗值增長，於腔內生成食物。你可以從裡面拿一小份吃掉，或者直接吃到飽。
items.artifacts.hornofplenty.desc_hint=也許可以通過給予它食物的能量來增加號角的力量。
items.artifacts.hornofplenty.desc_cursed=被詛咒的號角把自己綁在了你的身邊，它似乎在渴望得到食物而不是製造食物。

items.artifacts.lloydsbeacon.name=時空道標
items.artifacts.lloydsbeacon.ac_zap=釋放
items.artifacts.lloydsbeacon.ac_set=設置
items.artifacts.lloydsbeacon.ac_return=返回
items.artifacts.lloydsbeacon.no_charge=你的信標現在並沒有足夠的能量支撐發射傳送魔法。
items.artifacts.lloydsbeacon.tele_fail=傳送魔法失敗了。
items.artifacts.lloydsbeacon.prompt=選擇要釋放魔法的位置
items.artifacts.lloydsbeacon.levelup=你的信標變得更強大了!
items.artifacts.lloydsbeacon.preventing=這強大的魔力流使你無法使用時空道標!
items.artifacts.lloydsbeacon.creatures=鄰近生物的心靈信號正在干擾你的時空道標並使其無法被使用。
items.artifacts.lloydsbeacon.return=時空道標被成功設置在了你的當前位置，現在你可以隨時返回這裡。
items.artifacts.lloydsbeacon.desc=時空道標是一個賦予使用者控制傳送魔法能力的複雜魔法裝置。該信標可以用來返回一個預定地點，但其在裝備時的充能也可以用來對指定目標發射隨機傳送魔法。這個魔法可以針對某個目標或使用者自身。
items.artifacts.lloydsbeacon.desc_set=信標被設置在了像素地城第%d層的某處。

items.artifacts.masterthievesarmband.name=神偷袖章
items.artifacts.masterthievesarmband.ac_steal=偷竊
items.artifacts.masterthievesarmband.no_charge=你的臂章充能不足。
items.artifacts.masterthievesarmband.cursed=被詛咒的臂章使你畏懼偷竊。
items.artifacts.masterthievesarmband.full=你的臂章已經充能完畢!
items.artifacts.masterthievesarmband.prompt=選擇一個敵人作為目標
items.artifacts.masterthievesarmband.no_target=你必須選擇身旁的敵人為目標。
items.artifacts.masterthievesarmband.steal_shopkeeper=你不能直接從店主身上偷取物品。
items.artifacts.masterthievesarmband.no_steal=這種敵人身上什麼也沒有。
items.artifacts.masterthievesarmband.stole_item=你偷到了:%s。
items.artifacts.masterthievesarmband.failed_steal=你沒有偷到任何東西。
items.artifacts.masterthievesarmband.level_up=你的袖章變得更強大了!
items.artifacts.masterthievesarmband.desc=這個紫色的天鵝絨袖標是盜賊大師的標誌。它不屬於你，但它也不屬於你拿到這個袖標時擊敗的人。
items.artifacts.masterthievesarmband.desc_cursed=被詛咒的袖章緊緊地纏在你的手腕上，不知為何你感覺你的錢袋在慢慢變輕……
items.artifacts.masterthievesarmband.desc_worn=你的手有股力量，隨著你得到經驗而增強。你不僅能運用這股力量來在商店行竊，還能搶奪敵人身上的財物。\n\n搶奪敵人不耗時間，暫時使其失去方向感。首次搶奪每位敵人時，還可能奪得他們身上的財物! 這對不知情的敵人更有效。

items.artifacts.sandalsofnature.name=自然草履
items.artifacts.sandalsofnature.name_1=自然皮鞋
items.artifacts.sandalsofnature.name_2=自然長靴
items.artifacts.sandalsofnature.name_3=自然護腿
items.artifacts.sandalsofnature.ac_feed=餵食
items.artifacts.sandalsofnature.ac_root=紮根
items.artifacts.sandalsofnature.prompt=選擇一粒種子
items.artifacts.sandalsofnature.levelup=你的鞋子尺寸變大了!
items.artifacts.sandalsofnature.absorb_seed=鞋子吸收了種子，看起來更健康了。
items.artifacts.sandalsofnature.no_effect=你必須先給你的草履餵食一粒種子。
items.artifacts.sandalsofnature.low_charge=你的鞋子充能不足。
items.artifacts.sandalsofnature.prompt_target=選擇種植地點
items.artifacts.sandalsofnature.out_of_range=那位置在範圍外。
items.artifacts.sandalsofnature.desc_1=初看像是用麻繩編成的涼鞋實際上是兩株植物!它們看上去既虛弱又蒼白，也許它們需要一點營養?
items.artifacts.sandalsofnature.desc_2=這雙草履已經長大了，現在更像是一雙合腳的鞋。它們已經沒那麼蒼白了，也許還可以進一步成長?
items.artifacts.sandalsofnature.desc_3=這兩株植物又長大了。像是一雙樹皮製成的厚靴子。植物似乎已經恢復了它們的力量，但也許仍能進一步成長?
items.artifacts.sandalsofnature.desc_4=植物們似乎已長到最大，就像是一對裝甲護脛。這對深棕色護腿看上去仿如一棵非常堅毅的樹。
items.artifacts.sandalsofnature.desc_hint=穿上這件神器時你感到更加親近自然了。
items.artifacts.sandalsofnature.desc_cursed=被詛咒的鞋子切斷了一切你與自然的聯繫。
items.artifacts.sandalsofnature.desc_ability=在你給予這雙鞋種子之後，鞋子的表面擴出了該種子的顏色。這雙鞋可以暫時向下紮根，並在3格內，產生該植物的效果。\n目前種子:_%s_\n耗能_%d%%_。
items.artifacts.sandalsofnature.desc_seeds=自上次升級前，你已經給鞋子餵過了%d顆種子。

items.artifacts.skeletonkey.name=骷髏鑰匙
items.artifacts.skeletonkey.ac_insert=使用
items.artifacts.skeletonkey.cursed=詛咒的鑰匙毫無利用價值。
items.artifacts.skeletonkey.prompt=選擇一個目標
items.artifacts.skeletonkey.invalid_target=你無法在此處使用你的鑰匙。
items.artifacts.skeletonkey.lock_no_space=門被擋住了!
items.artifacts.skeletonkey.iron_charges=解開正常的鎖需要1點充能。
items.artifacts.skeletonkey.gold_charges=解開黃金製的鎖需要2點充能。
items.artifacts.skeletonkey.lock_charges=鎖門需要2點充能。
items.artifacts.skeletonkey.wall_charges=製造魔法牆需要2點充能。
items.artifacts.skeletonkey.crystal_charges=解開水晶製的鎖需要5點充能。
items.artifacts.skeletonkey.wont_open=某些原因致使鑰匙無法解開這個鎖。
items.artifacts.skeletonkey.locked_with_key=這道門已被被你的骷髏鑰匙鎖上。
items.artifacts.skeletonkey.force_lock=門鎖因骷髏鑰匙的遺失而被弱化，所以你直接把門撞開。
items.artifacts.skeletonkey.discard=你丟棄了多餘的鑰匙。
items.artifacts.skeletonkey.levelup=你的鑰匙變得更強大了!
items.artifacts.skeletonkey.desc=一把頭形像頭骨的鑰匙。每次看著它時，它的牙齒似乎都長得不太一樣。
items.artifacts.skeletonkey.desc_worn=這把魔法鑰匙似乎在你取代其它鑰匙使用時變得更強。他能插入地下城中幾乎所有的門以鎖上或解開它，即便有些門從來就沒鎖上過。\n\n這把鑰匙甚至能對八方"鎖"住那裡的空氣，創造3格寬的實心牆壁，持續10回合。如果後面有空間的話，這麼做也會將敵人推開。
items.artifacts.skeletonkey.desc_cursed=詛咒的鑰匙似乎在使其無法解開任何鎖，它甚至使你有機會在使用其他鑰匙時開鎖失敗。
items.artifacts.skeletonkey$keywall.desc=由骷髏鑰匙創造的臨時魔法牆。

items.artifacts.talismanofforesight.name=先見護符
items.artifacts.talismanofforesight.ac_scry=探查
items.artifacts.talismanofforesight.low_charge=護符需要至少5%的充能才可以使用探查。
items.artifacts.talismanofforesight.prompt=選擇要探查的位置
items.artifacts.talismanofforesight.levelup=你的護符變得更強大了!
items.artifacts.talismanofforesight.full_charge=你的護符充能已滿!
items.artifacts.talismanofforesight.desc=一塊雕著奇怪刻紋的光滑石頭。 它好像是在觀察著你周圍的一切，留意任何不尋常的東西。
items.artifacts.talismanofforesight.desc_worn=手裡拿著護符時，你感到五感都更敏銳了。 護符正隨著時間慢慢充能，當你發現被隱藏的門或陷阱時會獲得額外能量。 護符可以花費能量去"探查"一個扇形的區域，揭示範圍內所有的地格與秘密，並且暫時賦予你對範圍內敵人與道具的靈視。
items.artifacts.talismanofforesight.desc_cursed=被詛咒的護符刻意凝視著你，使你的感知鈍化。
items.artifacts.talismanofforesight$foresight.name=危險預知
items.artifacts.talismanofforesight$foresight.uneasy=你感到很不安。
items.artifacts.talismanofforesight$foresight.desc=你感到非常焦慮，彷彿周遭有未被發現的危險。

items.artifacts.timekeepershourglass.name=時光沙漏
items.artifacts.timekeepershourglass.ac_activate=使用
items.artifacts.timekeepershourglass.deactivate=你取消了時間凍結。
items.artifacts.timekeepershourglass.no_charge=你的沙漏充能還不足以供你運用。
items.artifacts.timekeepershourglass.cursed=你無法控制受詛咒的沙漏。
items.artifacts.timekeepershourglass.onstasis=你周遭的世界似乎就在這一瞬間變化了。
items.artifacts.timekeepershourglass.onfreeze=你周圍的一切突然都徹底靜止下來。
items.artifacts.timekeepershourglass.stasis=使我徹底靜止
items.artifacts.timekeepershourglass.freeze=凍結周圍時間
items.artifacts.timekeepershourglass.prompt=你要如何運用沙漏的魔力?\n\n停滯自己的時間:消耗沙漏2點充能使周遭的時間正常流動，而你身在原地動彈不得，但是什麼都無法傷害你。\n\n停滯周遭的時間:生效期間，你的所作所為皆瞬間完成。再使用一次沙漏，或攻擊敵人，都會結束此效果。
items.artifacts.timekeepershourglass.desc=這隻大型的華貴沙漏看起來卻並不怎麼起眼，但你仍覺得它精雕細刻的框架內蘊含著某種強大的力量。在翻轉沙漏、在看著沙子流下的同時，你能感受到一種魔法正在拉扯著你，使用這種魔法肯定能給你一些控制時間的方法。
items.artifacts.timekeepershourglass.desc_hint=沙漏似乎失去了一些沙子，如果你能再找到一些……
items.artifacts.timekeepershourglass.desc_cursed=被詛咒的沙漏把它自己鎖在了你的身邊，你可以感覺它試圖操縱你的時間流動。
items.artifacts.timekeepershourglass$timefreeze.name=時間凍結
items.artifacts.timekeepershourglass$timefreeze.desc=外界的時間已遭涷結，現在你的所作所為皆不耗時。攻擊其他角色，使用魔法，或者沙漏能量用盡時，此狀態終止。你也可以提早終止此狀態。\n\n離消耗能量還有%s回合。
items.artifacts.timekeepershourglass$sandbag.name=一包魔力流沙
items.artifacts.timekeepershourglass$sandbag.levelup=你將沙子填入到你的沙漏中。
items.artifacts.timekeepershourglass$sandbag.maxlevel=你的沙漏填滿了魔法沙子!
items.artifacts.timekeepershourglass$sandbag.no_hourglass=你沒有沙漏來存放這些沙子。
items.artifacts.timekeepershourglass$sandbag.desc=這一小袋細砂應該能夠在你的沙漏上完美使用。\n\n每當你需要這種東西時，店主都會擺出來一些，真是奇怪……

items.artifacts.unstablespellbook.name=無序魔典
items.artifacts.unstablespellbook.ac_read=閱讀
items.artifacts.unstablespellbook.ac_add=加入
items.artifacts.unstablespellbook.blinded=你不能在失明的時候閱讀書籍。
items.artifacts.unstablespellbook.no_charge=你的咒語書耗盡了能量。
items.artifacts.unstablespellbook.cursed=你才剛翻開書頁，魔典裡的字就消失了。
items.artifacts.unstablespellbook.prompt=選擇一張卷軸
items.artifacts.unstablespellbook.infuse_scroll=你將卷軸的能量注入了書中。
items.artifacts.unstablespellbook.unable_scroll=你無法將這張卷軸添加到書中。
items.artifacts.unstablespellbook.unknown_scroll=你還不清楚這張卷軸的類型。
items.artifacts.unstablespellbook.desc=這本魔典就其年歲而言被保養得異常好。當你翻動頁面時它不斷地噼啪作響併發出嘶嘶聲，涌動著不穩定的能量。一旦誦讀這本書，沒人能篤定你會釋放出什麼咒語。
items.artifacts.unstablespellbook.desc_cursed=被詛咒的魔典將自己綁在了你身上，並在抑制你使用大部分卷軸的能力。
items.artifacts.unstablespellbook.desc_index=這本魔典的目錄並不完整，目錄指向的白頁上寫著:
items.artifacts.unstablespellbook.desc_empowered=被你放進書中的卷軸閃耀著魔力的微光。你能夠利用魔典進一步激發卷軸能力，使用其秘卷效果，但這樣也會消耗你額外的充能。
items.artifacts.unstablespellbook.read_empowered=被你放入魔典的卷軸都充滿了魔法能量。你可以自主選擇引動該卷軸的正常或秘卷能力。\n\n如果選擇釋放秘卷能力，則會消耗2點魔典充能。



###bags
items.bags.bag.name=背包
items.bags.bag.discover_hint=此物品只在商店中出現。

items.bags.potionbandolier.name=藥瓶挎帶
items.bags.potionbandolier.desc=這副厚實的挎帶能像肩帶一樣掛在身上，上面有許多用來架上玻璃瓶和水袋的隔熱皮帶。 挎帶能為存放其中的藥瓶抵禦寒冷。

items.bags.scrollholder.name=卷軸筒
items.bags.scrollholder.desc=這個管狀容器好像能裝進一整套天文學家的工具和手書，但你的卷軸也同樣能放進去。它甚至還有一些小口袋，非常適合放入咒法水晶、奧術刻筆以及奧術樹脂。\n\n這個容器應該是防火的，所以你的卷軸在裡面時應該很安全。

items.bags.velvetpouch.name=絨布袋
items.bags.velvetpouch.desc=這個小袋子能裝下像是種子、符石、又或者是煉金材料之類的小東西。
items.bags.velvetpouch.discover_hint=此物品是所有英雄的初始裝備。

items.bags.magicalholster.name=魔法筒袋
items.bags.magicalholster.desc=這款細長的皮製筒袋由某種異域動物的毛皮製成。 強大的附魔使其擁有能收納大量遠端類武器道具的能力。\n\n只需伸手一探，想要的道具就會出現在你的手上。 \n\n筒袋中湧動的魔力流還能小幅強化其中法杖的充能及投擲武器的耐久度。



###bombs
items.bombs.arcanebomb.name=奧術炸彈
items.bombs.arcanebomb.desc=這顆炸彈融入了奧術能量，會產生類似於黏咕的蓄力攻擊的強力爆炸。爆炸會在兩格內造成_%1$d~%2$d_的魔法傷害。
items.bombs.arcanebomb.discover_hint=此物品為鍊金的產物。

items.bombs.bomb.name=炸彈
items.bombs.bomb.ac_lightthrow=點燃並扔出
items.bombs.bomb.snuff_fuse=你迅速掐滅了炸彈引線。
items.bombs.bomb.ondeath=爆炸殺死了你……
items.bombs.bomb.rankings_desc=被炸死
items.bombs.bomb.desc=一顆頗大的黑火藥炸彈。爆炸時會造成_%1$d~%2$d_點傷害，並破壞周遭的特定地形或物品。
items.bombs.bomb.desc_fuse=看起來引信在點燃後還能燒幾回合。
items.bombs.bomb.desc_burning=引信快燒完了，保持距離或者趕緊撲滅!
items.bombs.bomb$doublebomb.name=一對炸彈
items.bombs.bomb$doublebomb.desc=兩顆裝著黑火藥的重裝炸彈，看起來多出來的那顆是附贈的!

items.bombs.firebomb.name=燃燒彈
items.bombs.firebomb.desc=這條炸彈受到了改造，其爆炸範圍更大。爆炸將造成_%1$d~%2$d_點傷害，並在周圍兩格內釋放火焰。
items.bombs.firebomb.discover_hint=此物品為鍊金的產物。

items.bombs.flashbangbomb.name=閃光彈
items.bombs.flashbangbomb.desc=這顆炸彈受過改造，會在爆炸時造成一道大型電場。炸彈周遭兩格內的生物將受到_%1$d~%2$d_點爆炸傷害、25%%的額外電擊傷害，並被麻痺10回合。
items.bombs.flashbangbomb.discover_hint=此物品為鍊金的產物。

items.bombs.frostbomb.name=寒霜炸彈
items.bombs.frostbomb.desc=這條炸彈受到了改造，其爆炸範圍更大。爆炸將在周圍兩格造成_%1$d~%2$d_點傷害，並釋放一陣寒氣。
items.bombs.frostbomb.discover_hint=此物品為鍊金的產物。

items.bombs.holybomb.name=神聖炸彈
items.bombs.holybomb.desc=這顆炸彈被改造成爆炸時會釋放出大範圍的聖光。離炸彈兩格內的生物將受到_%1$d~%2$d_點爆炸傷害，而不死或惡魔類敵人將因聖光受到+50%%點的額外傷害。
items.bombs.holybomb.discover_hint=此物品為鍊金的產物。

items.bombs.noisemaker.name=噪音雷
items.bombs.noisemaker.desc=這顆炸彈受到了改造，會在引信燃盡時持續發出噪音。當有什麼碰到炸彈時，炸彈就會爆炸，對周遭兩格內造成_%1$d~%2$d_點傷害!
items.bombs.noisemaker.desc_burning=噪音雷引信已點燃，有東西接近時就會爆炸!
items.bombs.noisemaker.discover_hint=此物品為鍊金的產物。

items.bombs.smokebomb.name=煙幕炸彈
items.bombs.smokebomb.desc=這條炸彈被注入了一團厚到看不穿的煙霧。_它會對距離兩格的敵人_造成_%1$d~%2$d點傷害_並生成濃霧。
items.bombs.smokebomb.discover_hint=此物品為鍊金的產物。

items.bombs.regrowthbomb.name=再生炸彈
items.bombs.regrowthbomb.desc=這條受改造的炸彈會在三格內噴出再生液體。受濺灑的區域會迅速長出高草及植物。範圍內的你和盟友也會獲得類似治療藥劑的效果。
items.bombs.regrowthbomb.discover_hint=此物品為鍊金的產物。

items.bombs.shrapnelbomb.name=破片爆彈
items.bombs.shrapnelbomb.desc=這顆炸彈上被鍍上了DM-300的金屬碎片，在爆炸時這些金屬會從爆炸位置向四處射出，造成_%1$d~%2$d點傷害_。扔下後記得找掩護……
items.bombs.shrapnelbomb.discover_hint=此物品為鍊金的產物。

items.bombs.woollybomb.name=綿羊炸彈
items.bombs.woollybomb.desc=這顆炸彈在爆炸後會竄出一堆魔法羊。爆炸會對兩格內的生物造成_%1$d~%2$d點傷害_。這種方式產生的魔法羊會持續得更久!但在較強大的敵人身邊、或與牠們互動會使其提早消失。
items.bombs.woollybomb.discover_hint=此物品為鍊金的產物。

###food
items.food.berry.name=地城莓果
items.food.berry.eat_msg=酸甜可口，味道真不錯!
items.food.berry.desc=這顆小小的莓果是獵人在地下城中的草叢中摘下的，可以迅速的吃下以稍微果腹，其中還有可能包裹著有用的種子!
items.food.berry.discover_hint=此物品在啓用某項英雄天賦後才會出現。

items.food.blandfruit.name=無味果
items.food.blandfruit.cooked=煮熟的無味果
items.food.blandfruit.sunfruit=陽光果
items.food.blandfruit.rotfruit=腐味果
items.food.blandfruit.earthfruit=大地果
items.food.blandfruit.blindfruit=目盲果
items.food.blandfruit.firefruit=火焰果
items.food.blandfruit.icefruit=冰霜果
items.food.blandfruit.fadefruit=漸隱果
items.food.blandfruit.sorrowfruit=憂傷果
items.food.blandfruit.stormfruit=暴風果
items.food.blandfruit.dreamfruit=法皇果
items.food.blandfruit.starfruit=星隕果
items.food.blandfruit.swiftfruit=速行果
items.food.blandfruit.raw=你沒法忍受生吃這噁爛的東西。
items.food.blandfruit.desc=乾燥且脆弱，或許加點其他材料再煮能夠增強它的效果。
items.food.blandfruit.desc_cooked=這個果實已經因為吸收鍋中的湯而鼓脹，並且吸收了其中種子的屬性，使其具有吸收種子的對應藥劑效果。
items.food.blandfruit.desc_eat=看起來已經可以吃了!
items.food.blandfruit.desc_throw=它似乎性質很不穩定，最好作為武器丟出去。
items.food.blandfruit$chunks.name=無味果塊
items.food.blandfruit$chunks.desc=無味果觸地爆炸，碎成了一地的普通果塊。 儘管上面沾上了塵土，這些大塊的熟制無味果應該還可以安全食用。

items.food.chargrilledmeat.name=烤肉
items.food.chargrilledmeat.desc=看起來像塊好肉排。
items.food.chargrilledmeat.discover_hint=此食物是由另一種食物烹調而成。

items.food.food.name=口糧
items.food.food.ac_eat=食用
items.food.food.eat_msg=吃起來不錯!
items.food.food.desc=裡面沒什麼特別的東西:就些肉乾和一些餅乾之類的。

items.food.frozencarpaccio.name=冷凍生肉片
items.food.frozencarpaccio.invis=你看到自己的手隱形了!
items.food.frozencarpaccio.hard=你感到皮膚變硬了!
items.food.frozencarpaccio.refresh=神清氣爽!
items.food.frozencarpaccio.better=你感覺好多了!
items.food.frozencarpaccio.desc=這是一片冰凍生肉。只能切片取食，這調理方法也使其意外地好吃。
items.food.frozencarpaccio.discover_hint=此食物是由另一種食物烹調而成。

items.food.meatpie.name=肉派
items.food.meatpie.eat_msg=那食物實在超美味的!
items.food.meatpie.desc=一塊美味的餡餅，裡面裝滿了鹹肉。這將滿足你遠遠超過任何其他膳食。
items.food.meatpie.discover_hint=此物品為鍊金的產物。

items.food.mysterymeat.name=神祕的肉
items.food.mysterymeat.eat_msg=這東西吃起來很……奇怪。
items.food.mysterymeat.hot=哇喔!燙死!
items.food.mysterymeat.legs=你的腿沒有知覺了!
items.food.mysterymeat.not_well=你感覺……不太舒服……
items.food.mysterymeat.stuffed=你脹氣了。
items.food.mysterymeat.desc=非供即食，應充分調理。
items.food.mysterymeat.discover_hint=此食材為殺死某些敵人的掉落物。
items.food.mysterymeat$placeholder.name=肉

items.food.phantommeat.name=幻影肉
items.food.phantommeat.desc=一塊從幻影食人魚身上切下來的半透明肉排。這種神奇的肉能生食，吃下後除了讓你完全飽腹之外，還可以獲得隱身、暫時的防禦加成、一些治療，並淨化大部分的有害效果。
items.food.phantommeat.discover_hint=此食物為殺死某種敵人的掉落物。

items.food.pasty.name=肉餡餅
items.food.pasty.fish_name=清蒸鱸魚
items.food.pasty.amulet_name=Yendor護符
items.food.pasty.egg_name=復活節彩蛋
items.food.pasty.rainbow_name=霓虹果汁
items.food.pasty.shattered_name=綠色蛋糕
items.food.pasty.pie_name=南瓜派
items.food.pasty.vanilla_name=藍色蛋糕
items.food.pasty.cane_name=柺杖糖
items.food.pasty.sparkling_name=氣泡飲
items.food.pasty.desc=這是份正宗康瓦爾肉餡餅，內含馬鈴薯加牛肉的傳統餡料。 美味十足!
items.food.pasty.fish_desc=被荷葉包裹，以法術貯藏的清蒸鱸魚。逢此年月，有將魚剩下的習俗，以求年年有餘，於是你也決定不將這條蒸魚一次吃完。\n\n新春愉快!
items.food.pasty.amulet_desc=你終於找到了，神奇的護……等等，這只是一塊以鋁箔紙包裝的"護符巧克力"而已! 它根本沒有無盡能量，那些巧克力充其量只能當作你的一餐，頂多再提供短暫的神器充能效果而已。\n\n你被整了，愚人節快樂!
items.food.pasty.egg_desc=一顆巨大的，被鮮黃色的鋁箔紙包覆的巧克力蛋。這些巧克力的熱量足以使人感到飽足，裡面的糖分也會給你一小點神器充能。\n\n復活節快樂!
items.food.pasty.rainbow_desc=這瓶虹彩色的藥劑是一種液態食物。除了能讓人得到飽足感外，它蘊含的微量友情魔力在進食時還會侵入身旁一位非頭目敵人的思想，使他在攻擊和不攻擊之間兩難。\n\n向同志驕傲致敬!
items.food.pasty.shattered_desc=一大份的香草蛋糕，上面有著碎糖粒，並被綠色奶油裝飾著。這塊蛋糕是用來慶祝數年的經驗，你甚至能吃到一些。\n\n《破碎像素地城》於2014年8月5日問世。祝破碎像素地城生日快樂!
items.food.pasty.pie_desc=一大份的南瓜派。它辛甜的味道能填飽肚子，順便使你獲得微量治療。\n\n萬聖節快樂!
items.food.pasty.vanilla_desc=一大份的香草蛋糕，上面有著碎糖粒，並被藍色奶油裝飾著。這塊蛋糕是用來慶祝數年的經驗，你甚至能吃到一些。\n\n像素地城家族的始祖於2012年12月4日問世。祝《像素地牢》生日快樂!
items.food.pasty.cane_desc=一根巨大的枴杖糖。裡面的熱量能讓人完全飽足，內含的糖份還會給你的法杖一小點額外充能。\n\n佳節愉快!
items.food.pasty.sparkling_desc=這瓶充滿氣泡的藥劑是一種液態食物。喝起來就像氣泡酒一樣，但它其實是零酒精飲品。它能飽足飢餓，從腹部而來的暖流還能提供一小點防護。\n\n新年快樂!
items.food.pasty$fishleftover.name=剩魚
items.food.pasty$fishleftover.eat_msg=吃起來還行。
items.food.pasty$fishleftover.desc=一頓你之前沒吃完的剩菜。你能隨時吃完以再得到一點飽足感。

items.food.smallration.name=小包口糧
items.food.smallration.eat_msg=吃起來還行。
items.food.smallration.desc=它看起來和普通口糧一樣，就是小了點。
items.food.smallration.discover_hint=此物品只在商店中出現。

items.food.stewedmeat.name=燉肉
items.food.stewedmeat.eat_msg=吃起來還行。
items.food.stewedmeat.desc=烹煮的過程中殺死了肉上面可能攜帶的任何病菌或是寄生蟲。 現在應該可以安全的食用它了。
items.food.stewedmeat.discover_hint=此物品為鍊金的產物。

items.food.supplyration.name=備用儲糧
items.food.supplyration.desc=這包口糧是由盜賊公會的成員秘密存放於地下城暗處的。他被設計成能於行動同時食用食用的型態，並用於支援公會成員的各項行動。\n\n即便它提供的飽足感較普通口糧低，但它能迅速食用、提供微量治療、並予以暗影斗篷一點充能。
items.food.supplyration.discover_hint=此物品在啓用某項英雄天賦後才會出現。



##journal items
items.journal.documentpage.name=被撕下的書頁
items.journal.documentpage.desc=一張被遺棄的書頁，似乎是從一本書上撕下來的。你需要撿起它才能閱讀上面的內容。

items.journal.alchemypage.name=被撕下的煉金指南書頁
items.journal.alchemypage.desc=從一本煉金指南書上撕下來的一頁。 在遠處你只能看到一行行密密麻麻的小字，不過你仍然可以看清書頁上的標題:\n\n_"%s"_

items.journal.guidebook.name=地城探索指南
items.journal.guidebook.hint_mobile=你的指南有新的建議要告訴你! 點擊右上角閃爍的日誌按鈕進行閱讀。
items.journal.guidebook.hint_desktop=你的指南有新的建議要告訴你! 點擊右上角閃爍的日誌按鈕(%s)進行閱讀。
items.journal.guidebook.hint_status=指南書
items.journal.guidebook.desc=一本靜靜躺在地上的地城探索指南，不知被誰遺棄在此。 看來冒險不是很適合它的前使用者!這本精緻而獨特的書附有魔法，會在需要的時候主動提醒冒險家去翻閱它。 除了其強大的功能，這本書知名的原因還有一點:它的封面上用友好而親切的大字寫著"不要恐慌!"

items.journal.guidepage.name=被撕下的指南書頁
items.journal.guidepage.desc=從精通指南上撕下來的一頁。 在遠處你只能看到一行行密密麻麻的小字，不過你仍然可以看清書頁上的標題:\n\n_"%s"_

items.journal.regionlorepage$sewers.name=破舊的信紙
items.journal.regionlorepage$sewers.desc=這看起來像一張沾滿污垢的信。你需要撿起它才能看清上面寫的內容。

items.journal.regionlorepage$prison.name=磨損的日誌條目
items.journal.regionlorepage$prison.desc=這張泛黃的紙上寫著日誌或什麼的東西。雖然這比之前那些信紙的字更清晰，但你仍然得撿起來才能讀。

items.journal.regionlorepage$caves.name=老舊的紀錄頁
items.journal.regionlorepage$caves.desc=它看起來像是探險家日誌中的某條條目，它已經算是考古等級的紀錄，卻又保存得出奇地好。拾起以閱讀。

items.journal.regionlorepage$city.name=生鏽的金屬片
items.journal.regionlorepage$city.desc=一片被刻著某些訊息的鐵板。儘管年代久遠，但文字仍然清晰，但還是得拿起來讀才能理解它。

items.journal.regionlorepage$halls.name=發光的金屬片
items.journal.regionlorepage$halls.desc=一片上面附有發光的綠色文字的深黑鐵板。這些字發出的光照在遠處糊在了一起，你必須把它拿到手上才看得懂。


###keys
items.keys.goldenkey.name=金鑰匙
items.keys.goldenkey.desc=這把金色鑰匙的齒紋精密又複雜。 或許可以用它來打開某個上鎖的寶箱?

items.keys.crystalkey.name=水晶鑰匙
items.keys.crystalkey.desc=這把鑰匙經過精製，使其在黑暗中發出耀眼光芒。或許能用來打開某個水晶製品?

items.keys.ironkey.name=鐵鑰匙
items.keys.ironkey.desc=這個鐵鑰匙的匙齒已經嚴重磨損;皮製繫帶也久經年歲摧殘。它對應的是哪扇門呢?

items.keys.wornkey.name=破舊鑰匙
items.keys.wornkey.desc=這把鑰匙磨耗嚴重，但看起來不能等閒視之。或許附近有什麼大門，只有它打得開。



###potions
items.potions.potion.ac_drink=飲用
items.potions.potion.turquoise=青綠藥劑
items.potions.potion.crimson=猩紅藥劑
items.potions.potion.azure=湛藍藥劑
items.potions.potion.jade=碧綠藥劑
items.potions.potion.golden=金黃藥劑
items.potions.potion.magenta=品紅藥劑
items.potions.potion.charcoal=煤黑藥劑
items.potions.potion.ivory=乳白藥劑
items.potions.potion.amber=琥珀藥劑
items.potions.potion.bistre=深褐藥劑
items.potions.potion.indigo=靛紫藥劑
items.potions.potion.silver=銀灰藥劑
items.potions.potion.unknown_desc=瓶子裡裝著些不斷流動的彩色液體。誰知道飲用或投擲它時會有什麼效果呢?
items.potions.potion.harmful=有害藥劑!
items.potions.potion.beneficial=有益藥劑
items.potions.potion.yes=是的，我知道我在做什麼
items.potions.potion.no=不，我改變主意了
items.potions.potion.sure_drink=你確定要飲用它嗎? 大多數情況下你該把它扔向敵人的。
items.potions.potion.sure_throw=你確定要投擲它嗎? 大多數情況下把它喝下去會更有用。
items.potions.potion.shatter=藥瓶碎裂開，濺出了無害的液體。
items.potions.potion.discover_hint=此物品在地下城各處皆有可能出現。用鍊金釜也可製造出此物品。
items.potions.potion$placeholder.name=藥劑
items.potions.potion$seedtopotion.name=隨機藥劑

items.potions.potionofexperience.name=經驗藥劑
items.potions.potionofexperience.desc=多場戰鬥積累而來的經驗被濃縮為液態，這種藥劑能夠瞬間提升你的等級。

items.potions.potionoffrost.name=冰霜藥劑
items.potions.potionoffrost.desc=一旦暴露在空氣裡，這種化學藥劑會揮發成為一片寒氣。

items.potions.potionofhaste.name=極速藥劑
items.potions.potionofhaste.energetic=你感到精力充沛!
items.potions.potionofhaste.desc=喝這種詭異的甜味液體會在很短的時間給你帶來巨大的能量，讓你以高速奔跑。

items.potions.potionofhealing.name=治療藥劑
items.potions.potionofhealing.heal=你的傷口開始癒合。
items.potions.potionofhealing.desc=一種讓你快速回復生命值並清除大多數減益效果的萬能藥劑。

items.potions.potionofinvisibility.name=隱形藥劑
items.potions.potionofinvisibility.invisible=你看到你的手隱形了!
items.potions.potionofinvisibility.desc=飲用這種藥劑會使你暫時隱形。隱身期間，敵人將無法看見你。物理攻擊或法術效果(像是法杖和卷軸)，會使效果立即消失。

items.potions.potionoflevitation.name=浮空藥劑
items.potions.potionoflevitation.float=你漂浮到了空中!
items.potions.potionoflevitation.desc=飲用這種古怪的藥劑能讓你漂浮到空中，從而輕易地越過陷阱和裂隙。扔出它會產生一片未知氣體，讓其中的所有生物迷失方向。

items.potions.potionofliquidflame.name=液火藥劑
items.potions.potionofliquidflame.desc=這種藥瓶裡裝著一種不穩定的化合物，一旦暴露在空氣中就會猛烈的燃燒起來。

items.potions.potionofmindvision.name=靈視藥劑
items.potions.potionofmindvision.see_mobs=你可以感受到其他生物的存在!
items.potions.potionofmindvision.see_none=你能判定現在本層內就只有你一個人。
items.potions.potionofmindvision.desc=喝下這東西，你的心智將與大範圍內的生物精神同調，讓你能感受到圍牆背後的生體所在。該藥劑還能夠讓你的可視範圍無視身邊門牆的阻擋。

items.potions.potionofparalyticgas.name=麻痹藥劑
items.potions.potionofparalyticgas.desc=暴露於空氣時，這種藥瓶裡的液體會氣化成一片令人失去知覺的黃色雲霧。任何吸入氣霧的生物將會被麻痹，直到雲霧消散後一段時間才能行動。可以把該藥瓶扔到遠處的敵人群中，讓氣體覆蓋影響它們。

items.potions.potionofpurity.name=淨化藥劑
items.potions.potionofpurity.freshness=你聞到了空氣中不尋常的清新氣息。
items.potions.potionofpurity.protected=你被一層薄薄的魔法屏障包裹住保護著!
items.potions.potionofpurity.desc=這種魔法試劑能迅速中和掉大範圍內的各種有害效果。 飲用它將使你暫時免疫這些效果。

items.potions.potionofstrength.name=力量藥劑
items.potions.potionofstrength.msg=新生力量湧入你的體內，你現在擁有%d點力量!
items.potions.potionofstrength.desc=這種強力的液體會洗刷你的肌肉，永久性增加1點力量值。

items.potions.potionoftoxicgas.name=毒氣藥劑
items.potions.potionoftoxicgas.desc=打開或摔碎這種密封的藥瓶將導致內容物爆發成一團綠色的劇毒煙霧。你應該選擇從遠處將這瓶藥劑扔向敵人，而不是手動開封。



###brews
items.potions.brews.brew.discover_hint=此物品為鍊金的產物。

items.potions.brews.aquabrew.name=水爆魔藥
items.potions.brews.aquabrew.desc=瓶子裂開之後，內含的高壓水隨即噴出，傷害火屬性敵人，澆熄火焰，沖退單位，製造水坑，並破壞陷阱。

items.potions.brews.blizzardbrew.name=冰暴魔藥
items.potions.brews.blizzardbrew.desc=當藥瓶碎裂時，這種魔藥將釋放出氣體形式的暴風雪。

items.potions.brews.causticbrew.name=淤泥魔藥
items.potions.brews.causticbrew.desc=這種魔藥在打碎時會大範圍地濺出腐蝕淤泥。 被腐蝕淤泥影響的單位將會緩慢融化，除非他們能及時在水中沖洗掉淤泥。

items.potions.brews.infernalbrew.name=獄火魔藥
items.potions.brews.infernalbrew.desc=當藥瓶碎裂時，這種魔藥將釋放出氣體形式的獄火。

items.potions.brews.shockingbrew.name=雷鳴魔藥
items.potions.brews.shockingbrew.desc=當藥瓶碎裂時，這種魔藥將以其為中心大範圍的釋放一場雷電風暴。

items.potions.brews.unstablebrew.name=不定魔藥
items.potions.brews.unstablebrew.desc=這種魔藥散發出了不斷變化的虹彩色光芒。\n\n使用它會觸發隨機一種藥劑的效果。飲用時的效果永遠對你有利，投擲時絕對會有某種藥劑中的物質散發出來。

###elixirs
items.potions.elixirs.elixir.discover_hint=此物品為鍊金的產物。

items.potions.elixirs.elixirofarcanearmor.name=抗魔秘藥
items.potions.elixirs.elixirofarcanearmor.desc=這種秘藥會賦予飲用者持續時間很長的魔法抗性。

items.potions.elixirs.elixirofaquaticrejuvenation.name=水靈秘藥
items.potions.elixirs.elixirofaquaticrejuvenation.desc=這種秘藥中包含著被黏咕力量強化的治療液體。 它不會為你提供立即的治療效果，而會當你站在水中時逐漸為你恢復總量更大的生命值。
items.potions.elixirs.elixirofaquaticrejuvenation$aquahealing.name=水靈治療
items.potions.elixirs.elixirofaquaticrejuvenation$aquahealing.desc=你暫時獲得了如同黏咕一樣的恢復能力。 \n\n當站在水面上時，你每回合都能夠回復少量生命值。 生命值全滿或離開水面時會暫停該效果。\n\n水靈恢復持續時長:%d。

items.potions.elixirs.elixirofdragonsblood.name=龍血秘藥
items.potions.elixirs.elixirofdragonsblood.desc=飲用後，這種秘藥會使飲用者的血管裡充斥著烈焰的力量。 這種效果能讓引用者對火焰完全免疫，並且還能通過物理攻擊點燃敵人。

items.potions.elixirs.elixiroffeatherfall.name=羽落秘藥
items.potions.elixirs.elixiroffeatherfall.light=你覺得自己身輕如燕!
items.potions.elixirs.elixiroffeatherfall.desc=這種秘藥提供更可控的飄浮效果，可以使飲用者從極高處跳下去而毫髮無傷。
items.potions.elixirs.elixiroffeatherfall$featherbuff.name=羽落
items.potions.elixirs.elixiroffeatherfall$featherbuff.desc=在羽落秘藥的作用下，使你能跳進深淵且不必承受任何傷害!\n\n有效時長:%s。

items.potions.elixirs.elixirofhoneyedhealing.name=聖愈蜜藥
items.potions.elixirs.elixirofhoneyedhealing.desc=這種秘藥將治癒效果混進了蜂蜜的甜香內。飲用後會得到與治療藥劑一樣的治療效果，並回復一小部分饑餓，它也能被丟出去用來治療盟友。\n\n如果將這瓶秘藥丟向與蜂蜜有關的生物，也會使牠們平靜下來。

items.potions.elixirs.elixiroficytouch.name=晶觸秘藥
items.potions.elixirs.elixiroficytouch.desc=飲用後，這種秘藥會使飲用者獲得從敵人身上抽取熱量的能力。 這樣的效果讓使用者能夠在藥效持續期間免疫凍傷，同時他的物理攻擊也能對敵人造成凍傷效果。

items.potions.elixirs.elixirofmight.name=根骨秘藥
items.potions.elixirs.elixirofmight.msg=新生力量湧入你的體內，你現在擁有%d點力量!
items.potions.elixirs.elixirofmight.desc=這種強力的液體會沖刷你的根骨，永久性增加1點力量值並在一段時間內增加%d點生命上限。 增強的生命上限值取決於你當前的最大生命值，不過增強值會隨著等級提升而逐漸消失。
items.potions.elixirs.elixirofmight$htboost.name=最大生命值加成
items.potions.elixirs.elixirofmight$htboost.desc=你覺得自己不同尋常的強壯與健康。 \n\n你的最大生命在一段時間內會有所提升。 生命提升會隨著你的升級緩慢而穩定地消失。\n\n目前生命提升量:%d。 剩餘有效等級:%d。

items.potions.elixirs.elixiroftoxicessence.name=毒粹秘藥
items.potions.elixirs.elixiroftoxicessence.desc=這種秘藥能夠向飲用者注入強大的毒素之力，喝下它會在自己移動時不斷釋放出毒霧，並得到更長時間的毒氣和毒素免疫。



###exotic potions
items.potions.exotic.exoticpotion.turquoise=青綠合劑
items.potions.exotic.exoticpotion.crimson=猩紅合劑
items.potions.exotic.exoticpotion.azure=湛藍合劑
items.potions.exotic.exoticpotion.jade=碧綠合劑
items.potions.exotic.exoticpotion.golden=金黃合劑
items.potions.exotic.exoticpotion.magenta=品紅合劑
items.potions.exotic.exoticpotion.charcoal=煤黑合劑
items.potions.exotic.exoticpotion.ivory=乳白合劑
items.potions.exotic.exoticpotion.amber=琥珀合劑
items.potions.exotic.exoticpotion.bistre=深褐合劑
items.potions.exotic.exoticpotion.indigo=靛紫合劑
items.potions.exotic.exoticpotion.silver=銀灰合劑
items.potions.exotic.exoticpotion.unknown_desc=這圓底瓶裡裝著些有沉澱物的彩色液體。 它似乎並不屬於這個世界，誰知道飲用或投擲它時會有什麼效果呢?
items.potions.exotic.exoticpotion.warning=你真的想中止使用這瓶合劑? 它仍舊會被消耗掉。
items.potions.exotic.exoticpotion.yes=是的，我確定
items.potions.exotic.exoticpotion.no=不，我改變主意了
items.potions.exotic.exoticpotion.discover_hint=此物品為鍊金的產物。

items.potions.exotic.potionofcleansing.name=全面凈化合劑
items.potions.exotic.potionofcleansing.desc=這種合劑擊中某單位後會清除該單位所具有的負面效果。飲用它更可以免疫免面效果數回合。
items.potions.exotic.potionofcleansing$cleanse.name=完全淨化
items.potions.exotic.potionofcleansing$cleanse.desc=這個單位暫時免疫所有負面效果!\n\n免疫剩餘%s回合。

items.potions.exotic.potionofcorrosivegas.name=腐蝕酸霧合劑
items.potions.exotic.potionofcorrosivegas.desc=打開或摔碎這種密封的藥瓶將導致內容物爆發成一團高腐蝕性的致命鏽色酸霧。這片酸霧會比毒氣發散得更快，但也不會存在太久。

items.potions.exotic.potionofdragonsbreath.name=火龍吐息合劑
items.potions.exotic.potionofdragonsbreath.prompt=選擇要灼燒的位置
items.potions.exotic.potionofdragonsbreath.desc=瓶子內奇特的化合物會在接觸口腔後爆燃。 迅速吐出液體就能讓飲用者從口中噴射火焰!

items.potions.exotic.potionofearthenarmor.name=大地護甲合劑
items.potions.exotic.potionofearthenarmor.desc=與麻痹藥劑不同的是，飲用這種合劑能夠使飲用者的皮膚硬化，在一段時間內形成一道天然護甲。

items.potions.exotic.potionofdivineinspiration.name=神意啟發合劑
items.potions.exotic.potionofdivineinspiration.no_more_points=你無法再獲得更多天賦點了。
items.potions.exotic.potionofdivineinspiration.select_tier=選擇要提升額外天賦點的階層。你仍需解鎖該階層的天賦才能使用這些天賦點。
items.potions.exotic.potionofdivineinspiration.bonus=天賦點+2!
items.potions.exotic.potionofdivineinspiration.desc=神聖的能量會被濃縮成液態形式，這種合劑會為飲用者注入神聖能量，給予它們所指定的天賦階層兩點額外天賦點。\n\n這種藥水在每層只會作用一次。

items.potions.exotic.potionofmagicalsight.name=魔能透視合劑
items.potions.exotic.potionofmagicalsight.desc=喝下這東西，你的感知能力將提升到極度誇張的境界，使你能無視一切阻礙看見12格內的一切!

items.potions.exotic.potionofmastery.name=精通合劑
items.potions.exotic.potionofmastery.prompt=將能量制導於一件物品
items.potions.exotic.potionofmastery.weapon_easier=這件武器用起來更輕盈了!
items.potions.exotic.potionofmastery.armor_easier=這套護甲帶來的負擔變小了!
items.potions.exotic.potionofmastery.desc=這種藥水不會賦予飲用者純粹的力量，而是會讓他們的肌肉適應於特定物品。使它們更容易使用，就像使用它到完全適應了一樣。\n\n飲用後將這瓶藥水的力量導入一件武器和護甲上，即可使該物品的力量需求減少2點。這種合劑對每件物品只能生效一次。

items.potions.exotic.potionofshielding.name=奧術護盾合劑
items.potions.exotic.potionofshielding.desc=與治療藥劑不同的是，飲用這種合劑能夠使周身被護盾包覆，抵擋所受到的傷害。

items.potions.exotic.potionofshroudingfog.name=暗夜迷霧合劑
items.potions.exotic.potionofshroudingfog.desc=瓶中的合劑遇到空氣就會快速釋放出能完全阻擋敵人可視範圍的濃濃煙霧。

items.potions.exotic.potionofsnapfreeze.name=極速冰凍合劑
items.potions.exotic.potionofsnapfreeze.desc=一旦暴露在空氣裡，這種化學混合物會瞬間凍結並束縛住範圍內一切物件。

items.potions.exotic.potionofstamina.name=精力回復合劑
items.potions.exotic.potionofstamina.desc=喝這種奇怪的甜液體將給你帶來巨大的能量提升，讓你以更快的速度運行很長一段時間。

items.potions.exotic.potionofstormclouds.name=暴風驟雨合劑
items.potions.exotic.potionofstormclouds.desc=這種合劑被丟出後會快速形成一團濃厚的水氣，其凝結後會化為雨水降下。 大部分地形都會化為水灘、火屬性敵人會受到傷害、火焰會被熄滅、且陷阱會因浸透而損毀。



###quest items
items.quest.ceremonialcandle.name=儀祭蠟燭
items.quest.ceremonialcandle.desc=配套的蠟燭，在使用中融化在了一起。 單獨看來它們毫無價值，但與其它蠟燭按特定排布共用時卻能為召喚儀式聚集能量。
items.quest.ceremonialcandle.discover_hint=此物品會在某任務中出現。

items.quest.corpsedust.name=屍骨灰燼
items.quest.corpsedust.chill=一股寒意穿透了你的脊背。
items.quest.corpsedust.desc=在外觀上這團灰燼和普通的塵土差不多。 而你卻能夠感受到其中潛伏著一股充滿惡意的魔力。 盡快脫手為妙。
items.quest.corpsedust.discover_hint=此物品會在某任務中出現。

items.quest.darkgold.name=暗金礦
items.quest.darkgold.you_now_have=你現在擁有%d塊暗金礦。
items.quest.darkgold.desc=這種金屬名字中的暗並非源於其色澤(它看起來跟普通的黃金一樣)，而是因為它會在陽光下熔化，使其在地表上毫無用處。
items.quest.darkgold.discover_hint=此物品會在某任務中出現。

items.quest.dwarftoken.name=矮人徽記
items.quest.dwarftoken.desc=很多矮人和他們的造物都攜帶著這種小塊金屬，理由不詳。可能是裝飾品或什麼身份識別證。 矮人都挺奇怪的。
items.quest.dwarftoken.discover_hint=此物品會在某任務中出現。

items.quest.embers.name=元素餘燼
items.quest.embers.desc=只能從新生火元素身上採集到的特殊餘燼。它們散發著溫暖的能量。
items.quest.embers.discover_hint=此物品會在某任務中出現。

items.quest.escapecrystal.name=脫逃水晶
items.quest.escapecrystal.ac_use=使用
items.quest.escapecrystal.desc=一條似乎被注入傳送魔法的水晶，你能用它離開寶庫，但你拿不走其中的任何東西!
items.quest.escapecrystal.discover_hint=此物品會在某任務中出現。

items.quest.gooblob.name=蝕黑黏液
items.quest.gooblob.desc=一團從在黏咕裂開之後滾落出來，又晃又糊的球體。 看起來像是一塊大果凍球，但絕對不是果凍。 \n\n該物品自身並沒有什麼實際用途，不過它在與特定藥水或炸彈共煉時可能有用。 再不然也能換成大量的煉金能量。
items.quest.gooblob.discover_hint=此錬金原料為殺死某位敵人的掉落物。

items.quest.metalshard.name=邪能碎片
items.quest.metalshard.desc=一片從DM-300裝甲上掉下的生鏽邪能金屬。你能感受到其中潛藏的惡意魔法。\n\n該物品自身並沒有什麼實際用途，不過它在與特定藥水或炸彈共煉時可能有用。 再不然也能換成大量的煉金能量。
items.quest.metalshard.discover_hint=此錬金原料為殺死某位敵人的掉落物。

items.quest.pickaxe.name=礦鎬
items.quest.pickaxe.ability_name=穿刺
items.quest.pickaxe.ability_desc=決鬥者能用礦鎬_穿刺_敵人的外皮。這會對敵人施加易傷3回合，對有硬皮的生物再追加_%1$d~%2$d點傷害_。
items.quest.pickaxe.upgrade_ability_stat_name=武技傷害
items.quest.pickaxe.desc=耐用厚實的鑿岩工具。隨時都能用以挖掘，而在緊急狀態下也能裝備以作為武器用。
items.quest.pickaxe.discover_hint=此物品會在某任務中出現。

items.quest.ratskull.name=巨鼠頭骨
items.quest.ratskull.desc=一顆大得嚇人的老鼠頭骨。如果你能找到一面合適的牆來掛，它會是件不錯的狩獵紀念品。



###remains
items.remains.remainsitem.ac_use=使用
items.remains.remainsitem.discover_hint=此物品只出現在上一局殞落英雄的遺骸中。

items.remains.bowfragment.name=靈能木枝
items.remains.bowfragment.desc=這根斷折的樹枝是某位失蹤獵人所持有的靈能弓的一部分。你能感受到裡面些微流動的自然能量。將它插在地上會將它融入地面，使你的周遭生長出高草。

items.remains.brokenhilt.name=武器殘柄
items.remains.brokenhilt.desc=這把武器握柄是某位遇敗決鬥者的慣用武器。你能感受到裡面些微蘊含的武術知識，將它握於手中將使其化作能量流動全身，增加下兩次的近戰傷害。

items.remains.brokenstaff.name=斷折魔杖
items.remains.brokenstaff.desc=這支魔杖在擁有者死後斷成兩半。你能感受到裡面些微蘊含的魔法能量，你能把它拆了，並將剩餘的微弱能量轉移到你的法杖上。

items.remains.cloakscrap.name=暗影碎布
items.remains.cloakscrap.desc=這塊半透明的布料像是來自已故盜賊之前偷來的暗影斗篷。你能感受到裡面些微蘊含的秘術能量，你能將這種秘術能量轉化並注入你的神器中，但布料也會一起被轉化。

items.remains.sealshard.name=破碎紋章
items.remains.sealshard.desc=這幾塊紅蠟看起來是一位殞落戰士的紋章碎片。你能感受到些微的意念殘存於紋章上，將它貼於胸前將使其化作能量包覆自己，使自己獲得少量護盾。

items.remains.tornpage.name=神聖殘典
items.remains.tornpage.desc=這張撕下來的書頁上的內容像是來自於一位殉職牧師的神聖法典。看來這一頁的神聖能量還沒釋放出來，閱讀其上的法術會使你得到少量治療，但這張書頁也會因為法術的施放而消失。



###rings
items.rings.ring.diamond=鑽石戒指
items.rings.ring.opal=蛋白石戒指
items.rings.ring.garnet=石榴石戒指
items.rings.ring.ruby=紅寶石戒指
items.rings.ring.amethyst=紫水晶戒指
items.rings.ring.topaz=黃玉戒指
items.rings.ring.onyx=黑曜石戒指
items.rings.ring.tourmaline=碧璽戒指
items.rings.ring.emerald=綠寶石戒指
items.rings.ring.sapphire=藍寶石戒指
items.rings.ring.quartz=石英戒指
items.rings.ring.agate=瑪瑙戒指
items.rings.ring.equip_cursed=這枚戒指緊緊箍住了你的手指!
items.rings.ring.unknown_desc=這枚金屬環鑲嵌著一顆在黑暗中閃爍光芒的大塊寶石。誰知道戴上後會有什麼效果?
items.rings.ring.known=這是個%s。
items.rings.ring.identify=你對手中的戒指了解充分，已完全鑑定其屬性。
items.rings.ring.cursed_worn=由於這枚戒指被詛咒，你無力將其取下。
items.rings.ring.curse_known=你能感覺到這枚戒指裡潛伏著一股充滿惡意的魔力。
items.rings.ring.not_cursed=這枚戒指沒有被詛咒。

items.rings.ringofaccuracy.name=精準之戒
items.rings.ringofaccuracy.stats=佩戴這枚戒指時，你的精準屬性會增加_%s%%_。
items.rings.ringofaccuracy.typical_stats=佩戴這枚戒指時，你的精準屬性通常會增加_%s%%_。
items.rings.ringofaccuracy.combined_stats=你裝備的兩枚戒指的能力疊加後，共增加了_%s%%_的精準度。
items.rings.ringofaccuracy.upgrade_stat_name_1=精準度加成
items.rings.ringofaccuracy.desc=這枚戒指提高了你的專注力，使敵人難以躲閃你的攻擊。 詛咒的戒指則會讓你的攻擊更易於被閃避。

items.rings.ringofarcana.name=奧術之戒
items.rings.ringofarcana.stats=佩戴這枚戒指時，這枚戒指會提升武器或護甲_%s%%_的額外魔法特性。
items.rings.ringofarcana.typical_stats=佩戴這枚戒指時，你的武器或護甲通常會提升_%s%%_的額外魔法特性。
items.rings.ringofarcana.combined_stats=你裝備的兩枚戒指的能力疊加後，共增加了_%s%%_的額外魔法特性。
items.rings.ringofarcana.upgrade_stat_name_1=特性加成
items.rings.ringofarcana.desc=這枚戒指強化了武器上的附魔及護甲上的刻印，即便是詛咒類的，效果也會強化!戒指會先提升觸發機率，能使其保證觸發後再提升強度。詛咒的戒指則會讓這些效果的觸發機率或效果被削弱。

items.rings.ringofelements.name=元素之戒
items.rings.ringofelements.stats=當佩戴這枚戒指時，你會獲得_%s%%_的元素抗性。
items.rings.ringofelements.typical_stats=佩戴這枚戒指時，你通常會獲得_%s%%_的元素抗性。
items.rings.ringofelements.combined_stats=你裝備的兩枚戒指的能力疊加後，共增加了_%s%%_的元素抗性。
items.rings.ringofelements.upgrade_stat_name_1=元素抗性
items.rings.ringofelements.desc=這枚戒指能為佩戴者提供抗性，降低大部分有害物質和魔法效果的傷害和持續時間。 詛咒的戒指自然會加重這些效果。

items.rings.ringofenergy.name=能量之戒
items.rings.ringofenergy.stats=佩戴這枚戒指時，你的整體充能速度會提升_%s%%_。
items.rings.ringofenergy.typical_stats=佩戴這枚戒指時，你的整體充能速度通常會提升_%s%%_。
items.rings.ringofenergy.combined_stats=你裝備的兩枚戒指的能力疊加後，共增加了_%s%%_的充能速度。
items.rings.ringofenergy.upgrade_stat_name_1=充能速度
items.rings.ringofenergy.desc=在戒指的奧術領域籠罩下，你所有的魔法裝備充能速度都會得到提升。 詛咒的戒指反而會減慢充能速度。

items.rings.ringofevasion.name=閃避之戒
items.rings.ringofevasion.stats=佩戴這枚戒指時，你的閃避屬性會提升_%s%%_。
items.rings.ringofevasion.typical_stats=佩戴這枚戒指時，你的閃避屬性通常會提升_%s%%_。
items.rings.ringofevasion.combined_stats=你裝備的兩枚戒指的能力疊加後，共增加了_%s%%_的閃避倍率。
items.rings.ringofevasion.upgrade_stat_name_1=閃避加成
items.rings.ringofevasion.desc=這枚戒指會加快穿戴者的反應速度，令其更難被敵人擊中。 被詛咒的戒指反而會讓穿戴者更容易被擊中。

items.rings.ringofforce.name=武力之戒
items.rings.ringofforce.stats=赤手空拳時，以你目前的力量，佩戴這枚戒指能夠造成 _%1$d~%2$d點傷害_。 當裝備一件武器時，這枚戒指會為其增加_%3$d點傷害_。
items.rings.ringofforce.typical_stats=赤手空拳時，以你目前的力量，佩戴這枚戒指通常能夠造成 _%1$d~%2$d點傷害_。 當裝備一件武器時，這枚戒指通常會為其增加_%3$d點傷害_。
items.rings.ringofforce.combined_stats=你裝備的兩枚戒指的能力疊加後，你的拳擊傷害總共為_%1$d~%2$d點_，或在裝備武器時提升進戰傷害共_%3$d點_。
items.rings.ringofforce.upgrade_stat_name_1=拳擊傷害
items.rings.ringofforce.upgrade_stat_name_2=武器傷害加成
items.rings.ringofforce.upgrade_stat_name_3=武技傷害
items.rings.ringofforce.ability_name=拳擊架勢
items.rings.ringofforce.typical_ability_desc=決鬥者能在戒指加持下進入_拳擊架勢_，這種攻擊不需要消耗武技充能，基本上會將傷害設為_%1$d~%2$d點_且原先裝備的武器上所有特性仍會作用，但也會使武技充能速度減半。
items.rings.ringofforce.ability_desc=決鬥者能在戒指加持下進入_拳擊架勢_，這種攻擊不需要消耗武技充能，並將傷害設為_%1$d~%2$d點_且原先裝備的武器上所有特性仍會作用，但也會使武技充能速度減半。
items.rings.ringofforce.desc=這枚戒指能夠增強穿戴者的打擊力度。 這份額外的力量在揮舞武器時相當有限，而徒手攻擊則會被大幅增強。 詛咒的戒指會導致穿戴者的攻擊變得軟弱無力。
items.rings.ringofforce$brawlersstance.name=拳擊架勢
items.rings.ringofforce$brawlersstance.desc=這種架勢下，決鬥者的普通攻擊傷害會受武力之戒影響而提升，且原先裝備的武器上所有特性仍會作用。\n\n在這種架勢下需要額外的專注力，所以武技的充能速度會減半。\n\n這種架勢的啟用與否由武力之戒操控，但快速切換架勢也會降低武技充能一小段時間。

items.rings.ringoffuror.name=狂怒之戒
items.rings.ringoffuror.stats=佩戴這枚戒指時，你的攻擊速度會提升_%s%%_。
items.rings.ringoffuror.typical_stats=佩戴這枚戒指時，你的攻擊速度通常會提升_%s%%_。
items.rings.ringoffuror.combined_stats=你裝備的兩枚戒指的能力疊加後，共增加了_%s%%_的攻速。
items.rings.ringoffuror.upgrade_stat_name_1=攻速加成
items.rings.ringoffuror.desc=這枚戒指賦予穿戴者內心的憤怒，讓他們攻擊更快。被詛咒的戒指反而會降低穿戴者的攻擊速度。

items.rings.ringofhaste.name=疾速之戒
items.rings.ringofhaste.stats=佩戴這枚戒指時，你的移動速度會提升_%s%%_。
items.rings.ringofhaste.typical_stats=佩戴這枚戒指時，你的移動速度通常會提升_%s%%_。
items.rings.ringofhaste.combined_stats=你裝備的兩枚戒指的能力疊加後，共增加了_%s%%_的速度。
items.rings.ringofhaste.upgrade_stat_name_1=移速加成
items.rings.ringofhaste.desc=這枚戒指減輕了穿戴者在移動時的負擔，使其能夠飛速奔跑。受詛咒的戒指則會使穿戴者倍感沉重。

items.rings.ringofmight.name=根骨之戒
items.rings.ringofmight.stats=佩戴這枚戒指時，你的力量會增加_%1$d_，你的最大生命值會增加_%2$s%%_。
items.rings.ringofmight.typical_stats=佩戴這枚戒指時，你的力量通常會提升_%1$d_點，並且最大生命值通常會增加_%2$s%%_。
items.rings.ringofmight.combined_stats=你裝備的兩枚戒指的能力疊加後，共增加了_%1$d_點力量值及_%2$s%%_點最大生命值。
items.rings.ringofmight.upgrade_stat_name_1=附帶力量值
items.rings.ringofmight.upgrade_stat_name_2=最大生命加成
items.rings.ringofmight.desc=這枚戒指會增強穿戴者的體質，使其擁有更強的力量與體格。被詛咒的戒指則會使穿戴者虛弱。

items.rings.ringofsharpshooting.name=神射之戒
items.rings.ringofsharpshooting.stats=佩戴這枚戒指時，你的投擲武器威力等級會提升_%1$d_級，耐久度會提升_%2$s%%_。
items.rings.ringofsharpshooting.typical_stats=佩戴這枚戒指時，你的投擲武器威力等級通常會提升_%1$d_級，耐久度通常會提升_%2$s%%_。
items.rings.ringofsharpshooting.combined_stats=你裝備的兩枚戒指的能力疊加後，共提升了投擲武器的_%1$d_級的威力及_%2$s%%_的耐久度。
items.rings.ringofsharpshooting.upgrade_stat_name_1=附加投武等級
items.rings.ringofsharpshooting.upgrade_stat_name_2=耐久加成
items.rings.ringofsharpshooting.desc=這枚戒指會加強穿戴者的精準度和瞄準能力，使投擲武器變得更加致命且耐用。 被詛咒的戒指則會起反作用。

items.rings.ringoftenacity.name=韌性之戒
items.rings.ringoftenacity.stats=佩戴這枚戒指時，你受到的傷害至多減少_%s%%_。
items.rings.ringoftenacity.typical_stats=佩戴這枚戒指時，你受到的傷害通常至多減少_%s%%_。
items.rings.ringoftenacity.combined_stats=你裝備的兩枚戒指的能力疊加後，使你最多能抵抗_%s%%_的傷害。
items.rings.ringoftenacity.upgrade_stat_name_1=最高物理傷害抗性
items.rings.ringoftenacity.desc=這枚戒指使穿戴者能夠抵禦本應致命的打擊。穿戴者受傷越重，對物理傷害的抗性就越高。詛咒的戒指則會讓敵人更容易殺死穿戴者。

items.rings.ringofwealth.name=財富之戒
items.rings.ringofwealth.stats=佩戴時，此戒指將增加你的幸運程度_%s%%_。
items.rings.ringofwealth.typical_stats=佩戴時，此戒指通常將會增加你的幸運程度_%s%%_。
items.rings.ringofwealth.combined_stats=你裝備的兩枚戒指的能力疊加後，共增加了_%s%%_的幸運程度。
items.rings.ringofwealth.upgrade_stat_name_1=額外物品掉落率
items.rings.ringofwealth.desc=這枚戒指有如磁石般的招財功效，佩戴者有更大的機率從敵人身上或各類容器中取得較有價值的額外道具。 詛咒的戒指則會抑制這種效果。



###scrolls
items.scrolls.scroll.ac_read=閱讀
items.scrolls.scroll.kaunan=KAUNAN卷軸
items.scrolls.scroll.sowilo=SOWILO卷軸
items.scrolls.scroll.laguz=LAGUZ卷軸
items.scrolls.scroll.yngvi=YNGVI卷軸
items.scrolls.scroll.gyfu=GYFU卷軸
items.scrolls.scroll.raido=RAIDO卷軸
items.scrolls.scroll.isaz=ISAZ卷軸
items.scrolls.scroll.mannaz=MANNAZ卷軸
items.scrolls.scroll.naudiz=NAUDIZ卷軸
items.scrolls.scroll.berkanan=BERKANAN卷軸
items.scrolls.scroll.odal=ODAL卷軸
items.scrolls.scroll.tiwaz=TIWAZ卷軸
items.scrolls.scroll.unknown_desc=這張羊皮紙上寫滿了難以破譯的魔法文字。大聲念出來會發生什麼?
items.scrolls.scroll.blinded=你連卷軸的標題都看不到。
items.scrolls.scroll.no_magic=你不能在魔法免疫時閱讀卷軸。
items.scrolls.scroll.cursed=被詛咒的魔典抑制了卷軸中法術的啟動!也許祛邪卷軸對它免疫……
items.scrolls.scroll$placeholder.name=卷軸

items.scrolls.inventoryscroll.warning=你真的想中止施放這張卷軸的魔力? 由於卷軸在施放之前未鑑定，它仍舊會被消耗掉。
items.scrolls.inventoryscroll.yes=是的，我確定
items.scrolls.inventoryscroll.no=不，我改主意了

items.scrolls.scrollofidentify.name=鑑定卷軸
items.scrolls.scrollofidentify.inv_title=選擇一樣要鑑定的物品
items.scrolls.scrollofidentify.it_is=鑑定結果為:%s。
items.scrolls.scrollofidentify.desc=這種卷軸能永久揭示一件物品的所有祕密。

items.scrolls.scrolloflullaby.name=催眠卷軸
items.scrolls.scrolloflullaby.sooth=卷軸發出了某種舒緩的旋律。你覺得非常睏倦。
items.scrolls.scrolloflullaby.desc=閱讀這種卷軸會釋放出一段舒緩的旋律，讓所有聽到它的生物陷入魔法睡眠。 這種睡眠有益於閱讀者及友方單位的健康。

items.scrolls.scrollofmagicmapping.name=探地卷軸
items.scrolls.scrollofmagicmapping.layout=你熟悉了這層的地形。
items.scrolls.scrollofmagicmapping.desc=閱讀這種卷軸時，一副明晰的景象會刻入你的記憶中，告知你整個樓層的精確佈局並揭開所有隱藏的祕密。不過道具位置和生物分佈依舊是未知狀態。

items.scrolls.scrollofmirrorimage.name=鏡像卷軸
items.scrolls.scrollofmirrorimage.copies=卷軸產生了你的鏡像。
items.scrolls.scrollofmirrorimage.no_copies=卷軸試圖產生你的鏡像，但它們沒空間顯影。
items.scrolls.scrollofmirrorimage.desc=卷軸上的咒文會創造閱讀者的兩個鏡像。 這些像是閱讀者弱化版的鏡像會對敵人展開追殺。 不過它們非常脆弱，受到傷害就會瞬間消散。

items.scrolls.scrollofretribution.name=復仇卷軸
items.scrolls.scrollofretribution.blast=強大的魔法能量從卷軸中湧出!
items.scrolls.scrollofretribution.desc=這種卷軸可以將閱讀者的所受的傷痛轉化為能量釋放而出。 閱讀者的傷勢越重，所釋放的能量越大。 閱讀者處於低血量的情況下所釋放的這種能量足以殺死大部分敵人。\n\n即便如此，這張卷軸依然會影響使用者，使其短時間目盲並虛弱無比。

items.scrolls.scrollofrage.name=盛怒卷軸
items.scrolls.scrollofrage.roar=卷軸產生的激怒咆哮在地下城中迴盪!
items.scrolls.scrollofrage.desc=大聲誦讀內容時，卷軸將釋放出一聲轟響的咆哮，將所有敵人引向你並激怒附近的單位。

items.scrolls.scrollofrecharging.name=充能卷軸
items.scrolls.scrollofrecharging.surge=一股能量在體內奔騰而過，使你的法杖能量充沛!
items.scrolls.scrollofrecharging.desc=純粹的魔法能量被禁錮在羊皮紙內，當這股能量被釋放時會在短時間內持續為閱讀者的所有法杖補充能量。

items.scrolls.scrollofremovecurse.name=祛邪卷軸
items.scrolls.scrollofremovecurse.inv_title=選擇一件要淨化的物品
items.scrolls.scrollofremovecurse.cleansed=你的道具閃耀著淨化的光芒，一股惡毒的能量從中消散。
items.scrolls.scrollofremovecurse.not_cleansed=你的道具閃耀著淨化的光芒，不過沒什麼其他變化。
items.scrolls.scrollofremovecurse.spirit=厄咒之靈在淨化的光芒下從詛咒中釋放!
items.scrolls.scrollofremovecurse.desc=這種卷軸上的咒語能夠瞬間清除指定的一件武器、護甲、法杖、戒指或神器上的詛咒。

items.scrolls.scrollofteleportation.name=傳送卷軸
items.scrolls.scrollofteleportation.tele=眨眼之間你就被傳送到本層的另外一個位置。
items.scrolls.scrollofteleportation.no_tele=傳送魔法失敗了。
items.scrolls.scrollofteleportation.cant_reach=你不能傳送到那裡。
items.scrolls.scrollofteleportation.prompt=選擇想要傳送的地點
items.scrolls.scrollofteleportation.desc=羊皮紙上的咒語能立刻讓閱讀者傳送到本層的另一處。 這種卷軸會優先選擇閱讀者還未探索的地方，但無法將人傳送到門被鎖或被路障堵住入口的密室中。 不過，它能幫助發現通向未知區域的隱藏門。

items.scrolls.scrollofterror.name=恐懼卷軸
items.scrolls.scrollofterror.none=這張卷軸產生了一陣明亮的紅色閃光。
items.scrolls.scrollofterror.one=這張卷軸產生的明亮的紅色閃光使得%s逃跑了!
items.scrolls.scrollofterror.many=這張卷軸產生的明亮的紅色閃光使得怪物們全逃跑了!
items.scrolls.scrollofterror.desc=這種卷軸會發出紅色的閃光使可視範圍內所有的敵人嚇到落荒而逃。但攻擊它們會使其提早恢復理智。

items.scrolls.scrolloftransmutation.name=轉化卷軸
items.scrolls.scrolloftransmutation.inv_title=選擇一件要轉化的物品
items.scrolls.scrolloftransmutation.nothing=沒有什麼有趣的事情發生。
items.scrolls.scrolloftransmutation.morph=你的道具變成了另一樣東西!
items.scrolls.scrolloftransmutation.desc=卷軸內含強力的轉化魔法，用在可行的道具上會將其轉變成同類型的另一樣道具。 這種魔法還會保留原道具上的其它屬性。對於卷軸或藥劑將轉變成它們的變體型態，這種魔法也是將其轉換回來的唯一方法。

items.scrolls.scrollofupgrade.name=升級卷軸
items.scrolls.scrollofupgrade.inv_title=選擇一件要升級的物品
items.scrolls.scrollofupgrade.weaken_curse=升級卷軸減弱了物品上的詛咒。
items.scrolls.scrollofupgrade.remove_curse=升級卷軸淨化了物品上的詛咒!
items.scrolls.scrollofupgrade.desc=這種卷軸能將物品升級。升級會提升法杖的威力及充能數、戒指提供的效果、武器與投擲武器的傷害及耐久、以及護甲的防禦能力，並維修投擲武器至全新狀態。\n\n它也能削弱甚至於消除詛咒，但這種事不如利用祛邪卷軸做還比較好。而且這種升級有個缺陷:它可能會使附魔和刻印消除，裝備等級越高，消除的機率就會變高。



###exotic scrolls
items.scrolls.exotic.exoticscroll.kaunan=KAUNAN秘卷
items.scrolls.exotic.exoticscroll.sowilo=SOWILO秘卷
items.scrolls.exotic.exoticscroll.laguz=LAGUZ秘卷
items.scrolls.exotic.exoticscroll.yngvi=YNGVI秘卷
items.scrolls.exotic.exoticscroll.gyfu=GYFU秘卷
items.scrolls.exotic.exoticscroll.raido=RAIDO秘卷
items.scrolls.exotic.exoticscroll.isaz=ISAZ秘卷
items.scrolls.exotic.exoticscroll.mannaz=MANNAZ秘卷
items.scrolls.exotic.exoticscroll.naudiz=NAUDIZ秘卷
items.scrolls.exotic.exoticscroll.berkanan=BERKANAN秘卷
items.scrolls.exotic.exoticscroll.odal=ODAL秘卷
items.scrolls.exotic.exoticscroll.tiwaz=TIWAZ秘卷
items.scrolls.exotic.exoticscroll.unknown_desc=這張漆黑的羊皮紙上刻滿了閃耀著魔力光芒的晦澀符文。 它似乎並不屬於這個世界。 大聲念出來會發生什麼?
items.scrolls.exotic.exoticscroll.discover_hint=此物品為鍊金的產物。

items.scrolls.exotic.scrollofsirenssong.name=魅迷秘卷
items.scrolls.exotic.scrollofsirenssong.prompt=選擇一個目標
items.scrolls.exotic.scrollofsirenssong.no_target=這張秘卷在沒有主要目標的情況下激活了。
items.scrolls.exotic.scrollofsirenssong.cancel=你必須選擇一個目標。
items.scrolls.exotic.scrollofsirenssong.desc=閱讀這種卷軸會使其放出動人的旋律，使被選中的敵人沉淪，並永遠成為你的同伴! 其他聽到的敵人也會暫時被魅惑。\n\n特別強大的敵人能抵抗沉淪的效果，只會陷入魅惑狀態。
items.scrolls.exotic.scrollofsirenssong$enthralled.name=沉淪
items.scrolls.exotic.scrollofsirenssong$enthralled.desc=此生物已被魅迷秘卷所洗腦。\n\n沉淪的生物將會永久成為你的盟友，並與其遇見的敵人戰鬥。

items.scrolls.exotic.scrollofantimagic.name=驅魔秘卷
items.scrolls.exotic.scrollofantimagic.desc=使用這種秘卷會讓你被包裹在一個能夠阻擋其他所有法術的魔力結界中，無論它是有利或是有害。這些受阻擋的東西包括法杖、咒術類消耗品、戒指與神器、以及武器和護甲上的魔法效果。但英雄護甲的能力足夠強大，所以不受影響。

items.scrolls.exotic.scrollofchallenge.name=競技秘卷
items.scrolls.exotic.scrollofchallenge.desc=大聲閱讀這種秘卷會釋放吸引所有敵人注意的滔天巨響，並在閱讀者腳下產生一個小型競技場。\n\n閱讀者在競技場中擁有33%的所有傷害減免(這種減免會最先計算)，而且飢餓度不會增加或受到飢餓傷害。\n\n競技場的大小隨著閱讀者所在的房間而有所變化，且在一些頭目戰的場域會顯得特別小。
items.scrolls.exotic.scrollofchallenge$challengearena.name=競技主角
items.scrolls.exotic.scrollofchallenge$challengearena.desc=你的周遭出現了一個魔法所構成的競技場，裡面有一大片紅霧翻騰著。\n\n當站在霧中時，你的飢餓度將不會增加，且受到的所有傷害降低33%%。如果有其他的傷害減免效果(比如護甲)，則其效果會在這個33%%減傷之後計算。\n\n剩餘回合數:%d。

items.scrolls.exotic.scrollofdivination.name=預知秘卷
items.scrolls.exotic.scrollofdivination.nothing_left=沒有可以鑒定的道具了!
items.scrolls.exotic.scrollofdivination.desc=這種秘卷將會隨機鑑定四種你目前不知道的物品種類。可以是藥水的顏色、卷軸的符文或戒指上的寶石。鑑定的道具不一定會是目前所持有的道具。
items.scrolls.exotic.scrollofdivination$wnddivination.desc=你的預知秘卷鑒定了下列道具:

items.scrolls.exotic.scrollofdread.name=夢魘秘卷
items.scrolls.exotic.scrollofdread.desc=當你朗讀這種秘卷時，它將散發出一道能對可視範圍內的敵人注入不可言喻的恐懼的紅光。其恐懼之強會使受影響者快速逃出這座地下城，再也不會回來了!\n\n和普通的恐懼效果一樣，敵人會隨時間流逝或因受到傷害而冷靜下來。\n\n具有強大意志的敵人，比如頭目們，只會受到一般的恐懼效果。

items.scrolls.exotic.scrollofenchantment.name=附魔秘卷
items.scrolls.exotic.scrollofenchantment.inv_title=附魔一件物品
items.scrolls.exotic.scrollofenchantment.weapon=為你的武器選擇附魔。
items.scrolls.exotic.scrollofenchantment.armor=為你的護甲選擇刻印。
items.scrolls.exotic.scrollofenchantment.cancel=取消
items.scrolls.exotic.scrollofenchantment.cancel_warn=取消該行動仍然會消耗此秘卷。確定取消?
items.scrolls.exotic.scrollofenchantment.cancel_warn_yes=是的，我確定
items.scrolls.exotic.scrollofenchantment.cancel_warn_no=不，我改變主意了
items.scrolls.exotic.scrollofenchantment.desc=這種秘卷可以為武器或護甲注入強大的魔力。 閱讀者甚至可以選擇注入魔力的類型。

items.scrolls.exotic.scrollofforesight.name=先見秘卷
items.scrolls.exotic.scrollofforesight.desc=閱讀這種秘卷後，周遭地形的完整細節將會持續進入閱讀者的腦海中。此效果會持續相當長的時間，且能偵測到範圍內的所有隱藏門或陷阱，不再需要自己搜索。

items.scrolls.exotic.scrollofmetamorphosis.name=蛻變秘卷
items.scrolls.exotic.scrollofmetamorphosis.choose_desc=選擇欲替換的天賦。
items.scrolls.exotic.scrollofmetamorphosis.replace_desc=選擇用來替換的天賦。
items.scrolls.exotic.scrollofmetamorphosis.cancel_warn=取消還是會消耗掉這張卷軸。確定要繼續嗎?
items.scrolls.exotic.scrollofmetamorphosis.metamorphose_talent=蛻變天賦
items.scrolls.exotic.scrollofmetamorphosis.desc=這種秘卷含有強大的變化法術，但影響使用者而非道具。此秘卷可以讓你選擇一個天賦，並以其他英雄的同階天賦替換!\n\n此效果只能對主職業天賦生效，即不能選擇來自專精職業或護甲能力的天賦。不能使用的天賦不會出現在選項裡。

items.scrolls.exotic.scrollofmysticalenergy.name=秘能秘卷
items.scrolls.exotic.scrollofmysticalenergy.desc=奇異的魔法能量被禁錮在秘卷羊皮紙內，當這股能量被釋放時會在短時間內持續為閱讀者的所有神器充能。

items.scrolls.exotic.scrollofpassage.name=歸返秘卷
items.scrolls.exotic.scrollofpassage.desc=卷軸上的法術會閱讀者回到所在區域的第一層入口。很適合用以快速抵達商店。

items.scrolls.exotic.scrollofprismaticimage.name=幻衛秘卷
items.scrolls.exotic.scrollofprismaticimage.desc=這種秘卷上的咒文會創造閱讀者的一個幻影。 這個像使用者的弱化版複製體的幻影有著相同的防禦，但生命值和造成的傷害更低。\n\n幻影將吸引敵人的火力從而保護閱讀者。\n\n當幻影存在時閱讀這張秘卷將會為其恢復所有生命。

items.scrolls.exotic.scrollofpsionicblast.name=靈能震爆秘卷
items.scrolls.exotic.scrollofpsionicblast.ondeath=靈能震爆撕碎了你的意識……
items.scrolls.exotic.scrollofpsionicblast.desc=這種秘卷蘊含著毀滅性的能量，一旦引導出來將撕裂可視範圍內所有生物的心靈。 \n\n這股力量的釋放也會對閱讀者產生嚴重傷害，並導致暫時性的失明和眩暈。遭到靈爆的角色越多，閱讀者所受的傷害越小。



###spells
items.spells.alchemize.name=提煉菱晶
items.spells.alchemize.prompt=提煉一個物品
items.spells.alchemize.desc=這種菱晶具有類似於煉金鍋內的能量。每次施咒可以讓使用者將一個(或一組)道具轉化為金幣或煉金能量。轉化藥水或卷軸時也可以將其鑑定!\n\n此結晶可以在商店內買到少許幾個，也可以透過在煉金鍋內混合一粒種子、符石以及一點點煉金能量來獲得更多。
items.spells.alchemize$wndalchemizeitem.sell=轉換為%d枚金幣
items.spells.alchemize$wndalchemizeitem.sell_1=轉換其一為%d枚金幣
items.spells.alchemize$wndalchemizeitem.sell_all=全部轉換成%d枚金幣
items.spells.alchemize$wndalchemizeitem.energize=轉化成%d點能量
items.spells.alchemize$wndalchemizeitem.energize_1=把一個轉化成%d點能量
items.spells.alchemize$wndalchemizeitem.energize_all=把全部轉化成%d點能量

items.spells.beaconofreturning.name=歸返晶柱
items.spells.beaconofreturning.preventing=這裡強大的魔力流阻止了你的結晶效果!
items.spells.beaconofreturning.creatures=臨近生物的心靈信號干擾不允許你在此刻進行傳送。
items.spells.beaconofreturning.set=信標設置在了你現在的位置。
items.spells.beaconofreturning.wnd_body=新的設置會覆蓋原來的信標設置的位置。 \n\n返回將會讓你回到上一個設置的位置並且消耗一個菱晶。
items.spells.beaconofreturning.wnd_set=設置
items.spells.beaconofreturning.wnd_return=返回
items.spells.beaconofreturning.desc_set=信標已被設置在了第%d層的某處。
items.spells.beaconofreturning.desc=這種複雜的晶住給予了使用者無視距離返回到設定地點的能力。 該晶柱只會在返回時消耗。 你可以隨時改變它的設定位置，但該晶柱只能記憶最近一次設置的位置。

items.spells.curseinfusion.name=強力詛咒菱晶
items.spells.curseinfusion.inv_title=詛咒一件物品
items.spells.curseinfusion.desc=這種菱晶會為裝備賦予和在DM-300內找到的邪惡能量一樣的魔法。對任一裝備使用時，該裝備即受詛咒，且將失去其原本的附加魔法特性。\n\n對武器、護甲及法杖使用時，它們會在被詛咒的同時獲得升級。裝備原始等級愈高，升級愈多。然而，多次施於同一裝備上時，僅能更換詛咒類型，且詛咒帶來的負面效果解除時，菱晶帶來的升級效果也隨之消散。

items.spells.spell.ac_cast=施放
items.spells.spell.no_magic=你無法在魔法免疫的情況下使用法術結晶。
items.spells.spell.discover_hint=此物品為鍊金的產物。

items.spells.magicalinfusion.name=升級菱晶
items.spells.magicalinfusion.inv_title=灌注一件物品/道具
items.spells.magicalinfusion.infuse=你為你的物品注入了奧術能量!
items.spells.magicalinfusion.desc=這種透過升級卷軸提煉而出的菱晶有著更穩定的升級能量。\n\n利用這種菱晶升級時不會消除武器和護甲的附加效果。

items.spells.magicalporter.name=護送晶粒
items.spells.magicalporter.inv_title=傳送一個物品
items.spells.magicalporter.nowhere=沒有傳送物品的目標地點
items.spells.magicalporter.desc=這種晶粒能夠通過魔法傳送任何成為施法目標的物品。 但不同於商人信標，這些物品會被傳送到下一個頭目樓層的入口處。

items.spells.phaseshift.name=轉移晶粒
items.spells.phaseshift.no_target=那東西傳送不走。
items.spells.phaseshift.desc=這種混沌的晶粒會將其目標隨機傳送至本層的某個位置，且會將其麻痺很長一段時間。強大的敵人將能抵抗該麻痺效果。此咒語可以被導向一個目標或施法者本身。

items.spells.reclaimtrap.name=陷阱提取晶柱
items.spells.reclaimtrap.no_trap=那裡沒有陷阱。
items.spells.reclaimtrap.desc_trap=目前能用此晶柱以釋放_%s_。
items.spells.reclaimtrap.desc=這種晶柱含有DM-300殘留的能量。當對可觸發的陷阱使用時，該陷阱的力量會附到你的身上，使你能夠透過再次使用該咒語來在任意位置發動該陷阱的效果。\n\n但並不是所有陷阱都能在任何地方生效，且一次只能儲存一個陷阱。

items.spells.recycle.name=轉換菱晶
items.spells.recycle.inv_title=轉換一件物品
items.spells.recycle.recycled=你的物品被轉換為%s。
items.spells.recycle.desc=這種菱晶包含較弱的轉化魔法。雖然不能對裝備使用，但可以將卷軸、藥水、種子、符石或塗藥的飛鏢轉化成相同種類的隨機一樣物品。

items.spells.summonelemental.name=元素召喚晶柱
items.spells.summonelemental.ac_imbue=灌注
items.spells.summonelemental.imbue_prompt=灌注藥水或卷軸
items.spells.summonelemental.desc=這種晶柱能夠引導用來做它的元素餘燼的力量，召喚出一個友好的元素與你並肩作戰!一次只能召喚一隻，但可以透過重複使用來喚回已召喚的元素，且喚回時不會額外消耗咒語。
items.spells.summonelemental.desc_newborn=目前晶柱還沒有被灌注，將會召喚一個不會使用遠程攻擊的_新生元素_。你可以灌注已鑑定的液火藥劑、冰霜藥劑、充能卷軸或轉化卷軸來強化此咒語，使下次召喚出來的元素擁有完整的力量!
items.spells.summonelemental.desc_fire=目前晶柱感覺有些灼熱，會召喚出_火焰元素_。你可以灌注不一樣的道具，但咒語會失去其原本灌注的效果。
items.spells.summonelemental.desc_frost=目前晶柱散發出了寒氣，會召喚出_寒冰元素_。你可以灌注不一樣的道具，但咒語會失去其原本灌注的效果。
items.spells.summonelemental.desc_shock=目前晶柱周遭有靜電正在劈啪作響，會召喚出_電擊元素_。你可以灌注不一樣的道具，但咒語會失去其原本灌注的效果。
items.spells.summonelemental.desc_chaos=目前晶柱正在散發一股不穩定的能量，會召喚出_渾沌元素_。你可以灌注不一樣的道具，但咒語會失去其原本灌注的效果。

items.spells.targetedspell.prompt=選擇一個目標
items.spells.targetedspell.inv_title=灌注一件物品/道具

items.spells.telekineticgrab.name=念力晶粒
items.spells.telekineticgrab.cant_grab=沒辦法抓取那個道具。
items.spells.telekineticgrab.no_target=沒有可以抓取的東西。
items.spells.telekineticgrab.desc=這種晶粒可以讓使用者在任意位子抓取一格上的所有道具，或者卡在敵人身上的所有武器!\n\n但此晶粒不能抓取別人的東西或者容器等，比如寶箱。

items.spells.unstablespell.name=咒骰魔晶
items.spells.unstablespell.desc=這種小型黑色立方體的每個面上都有著不斷變化的符文。\n\n當它被擲動後，會觸發骰到的符文對應的卷軸效果。當可視範圍內有敵人時，符文的內容都會是用於戰鬥的符咒，反之亦然。

items.spells.wildenergy.name=狂亂能量晶粒
items.spells.wildenergy.desc=這種晶粒中含有部分驅動DM-300的詛咒之力。 當釋放時，它會為你的法杖與佩戴著的神器充能，但同時也會隨機觸發一種詛咒法杖的效果。 幸運的是你可以指定這種詛咒能量的施放方向。


###runestones
items.stones.inventorystone.ac_use=使用

items.stones.runestone$placeholder.name=符石
items.stones.runestone.discover_hint=此物品在地下城各處皆有可能出現。用鍊金釜也可製造出此物品。

items.stones.stoneofaggression.name=敵意符石
items.stones.stoneofaggression.desc=當這種符石被丟向敵人或友方時，短時間內附近的所有敵人都會優先攻擊該目標。\n\n但頭目可以抵抗該效果，大幅減少持續時間，受到來自其手下的攻擊的傷害也會減少。
items.stones.stoneofaggression$aggression.name=眾矢之的
items.stones.stoneofaggression$aggression.desc=帶有操控能力的魔法正在迫使周遭的敵人攻擊這個單位。\n\n剩餘時間:%s

items.stones.stoneofaugmentation.name=強化符石
items.stones.stoneofaugmentation.inv_title=強化一件物品
items.stones.stoneofaugmentation.desc=這種符石內的強力魔法可以用於強化裝備的一種屬性，但是會以減弱另一種屬性為代價。\n\n用於武器可以強化傷害或者速度。提升投擲武器的速度也會提升其耐久度。\n\n用於護甲可以強化防禦或者閃避。
items.stones.stoneofaugmentation.discover_hint=此物品為商店的商品，但用錬金釜也可以製造出此物品。
items.stones.stoneofaugmentation$wndaugment.choice=你想增強什麼?
items.stones.stoneofaugmentation$wndaugment.speed=速度
items.stones.stoneofaugmentation$wndaugment.damage=傷害
items.stones.stoneofaugmentation$wndaugment.evasion=閃避
items.stones.stoneofaugmentation$wndaugment.defense=防禦
items.stones.stoneofaugmentation$wndaugment.none=移除強化
items.stones.stoneofaugmentation$wndaugment.cancel=算了

items.stones.stoneofblast.name=震爆符石
items.stones.stoneofblast.desc=這種符石被扔出後會在目的地立即爆炸。 和炸彈一樣，爆炸會對範圍內的所有東西造成傷害。

items.stones.stoneofblink.name=閃現符石
items.stones.stoneofblink.desc=這種符石被扔出後會把投擲者傳送到目的地。

items.stones.stoneofclairvoyance.name=明示符石
items.stones.stoneofclairvoyance.desc=這種符石在墜地後會瞬間搜索以落點為中心的巨大範圍內的所有地格。 該搜索能力甚至不受牆壁的阻隔。

items.stones.stoneofdeepsleep.name=沉睡符石
items.stones.stoneofdeepsleep.desc=這種符石在擊中敵人時會使其陷入深深的魔法睡眠。陷入魔法睡眠的敵人到被打擾前都會一直沉睡下去。

items.stones.stoneofdetectmagic.name=探法符石
items.stones.stoneofdetectmagic.inv_title=探測一件物品
items.stones.stoneofdetectmagic.detected_none=沒有偵測到任何魔法影響著這件物品。
items.stones.stoneofdetectmagic.detected_both=同時偵測到了正面魔法及詛咒魔法!
items.stones.stoneofdetectmagic.detected_good=偵測到了正面的魔法!
items.stones.stoneofdetectmagic.detected_bad=偵測到了詛咒魔法!
items.stones.stoneofdetectmagic.desc=這種符石能夠偵測到道具上的魔法。對未鑑定的裝備使用時，這塊符石將告訴你上面是否有詛咒或者像是附魔或升級效果的正面魔法。

items.stones.stoneofdisarming.name=拆除符石
items.stones.stoneofdisarming.desc=這種符石具有破壞隱藏於地下城各處的有害陷阱的魔力。 它的魔力最多能拆除以投擲目的地為中心的一片區域內的9個陷阱。

items.stones.stoneofenchantment.name=附魔符石
items.stones.stoneofenchantment.inv_title=附魔一件物品
items.stones.stoneofenchantment.weapon=你的武器在黑暗中發光!
items.stones.stoneofenchantment.armor=你的護甲在黑暗中發光!
items.stones.stoneofenchantment.desc=這種符石擁有施加附魔的能力。 和升級卷軸不同，它不會直接加強一個道具的能力，但能給武器或者護甲擁有新的特性。

items.stones.stoneoffear.name=恐懼符石
items.stones.stoneoffear.desc=這種符石擊中單位時，會使其陷入恐懼及慌亂之中，並開始逃跑。陷入恐懼的單位受到傷害時會更快冷靜下來，減少效果的持續時間。

items.stones.stoneofflock.name=羊群符石
items.stones.stoneofflock.desc=這種符石墜地後會召喚一群魔法綿羊。

items.stones.stoneofintuition.name=感知符石
items.stones.stoneofintuition.inv_title=選擇一件物品
items.stones.stoneofintuition.desc=這種符石含有的魔法就像弱化版的鑒定卷軸。 和鑒定卷軸那種直接識別物品的魔法不一樣，它會利用你的直覺，讓你通過猜測來試圖鑒定一種藥水、卷軸或戒指。
items.stones.stoneofintuition.break_info=感知符石在作用兩次後就會有一顆粉碎，_你的下次使用將不消耗符石_。
items.stones.stoneofintuition.break_warn=感知符石的魔力已經施放了一次，所以_你的下次使用將會消耗符石_。
items.stones.stoneofintuition$wndguess.text=猜猜這件未鑒定的道具是什麼種類。 猜對了的話就會完成鑒定!
items.stones.stoneofintuition$wndguess.correct=猜對了。 已成功鑒定物品!
items.stones.stoneofintuition$wndguess.incorrect=你猜錯了。
items.stones.stoneofintuition$wndguess.break=感知符石就這樣粉碎消逝了……

items.stones.stoneofshock.name=電擊符石
items.stones.stoneofshock.desc=這種符石被扔出後會爆出一陣電能，短暫麻痹範圍內所有目標，並根據電到的目標數量，恢復擲出符石者的法杖充能。


###trinkets
items.trinkets.chaoticcenser.name=無序香爐
items.trinkets.chaoticcenser.spew=你的香爐即將噴出:%s
items.trinkets.chaoticcenser.desc=經過在煉金釜裡煮過一段時間後，這個本來是用來燒香的香爐似乎開始自行產生氣體了!氣體會隨時間累積並在有些隨機的時間點噴向敵人。看起來這個香爐可以噴出非常多種氣體，但在香爐啟動前你會先獲得一瞬間的警示。
items.trinkets.chaoticcenser.typical_stats_desc=此飾品通常會在大約每_%d_回合向敵人附近生出有害氣體。這些氣體只在有敵人時才會發射出去。飾品的等級越高，就越有可能噴出強力且稀有的氣體。
items.trinkets.chaoticcenser.stats_desc=以目前的等級，此飾品會在大約每_%d_回合向敵人附近生出有害氣體。這些氣體只在有敵人時才會發射出去。飾品的等級越高，就越有可能噴出強力且稀有的氣體。

items.trinkets.crackedspyglass.name=碎裂望遠鏡
items.trinkets.crackedspyglass.desc=要不是鏡頭上有裂痕，這台手持望遠鏡可說是精巧無瑕。它似乎能幫你從地下城中發現新物品。由於鏡頭缺陷，新物品雖非無從察覺，卻幾近與環境融為一體。
items.trinkets.crackedspyglass.typical_stats_desc=通常此飾品有_%1$s%%的機率_會在每個非頭目樓層生成一個隱藏的物品。
items.trinkets.crackedspyglass.stats_desc=以目前的等級，此飾品有_%1$s%%的機率_會在每個非頭目樓層生成一個隱藏的物品。
items.trinkets.crackedspyglass.stats_desc_upgraded=以目前的等級，此飾品會在每個非頭目樓層生成一個隱藏的物品，且有_%1$s%%的機率_生成另一個。

items.trinkets.dimensionalsundial.name=時空日晷
items.trinkets.dimensionalsundial.warning=你的日晷上沒有影子，你開始感到不安。
items.trinkets.dimensionalsundial.desc=這個小小的手持日晷不知為何可以在如此深的地下城中映出影子，就算你沒有把它拿在手上也是。更奇怪的是，上面的影子似乎和這個世界的太陽無關。當日晷上沒有影子時，這個日晷似乎會招來危險。
items.trinkets.dimensionalsundial.typical_stats_desc=通常此飾品會在現實時間的白天(早上8點-晚上8點)降低_%1$d%%_的敵人生成頻率，並在現實時間的夜晚(晚上8點-早上8點)提高_%2$d%%_的敵人生成頻率。
items.trinkets.dimensionalsundial.stats_desc=以目前的等級，此飾品會在現實時間的白天(早上8點-晚上8點)降低_%1$d%%_的敵人生成頻率，並在現實時間的夜晚(晚上8點-早上8點)提高_%2$d%%_的敵人生成頻率。

items.trinkets.exoticcrystals.name=變異晶粒
items.trinkets.exoticcrystals.desc=這些小小的粉紅色水晶的外型和能量晶體一模一樣。雖然不能直接作為能量使用，但它們似乎會影響你在這裡找到的藥水及卷軸。
items.trinkets.exoticcrystals.typical_stats_desc=此飾品通常會將你找到的_%s%%_藥水及卷軸轉化成同個道具的合劑或者秘卷。不會影響力量藥水、升級卷軸以及用來解決某些房間的謎題的道具。
items.trinkets.exoticcrystals.stats_desc=以目前的等級，此飾品會將你找到的_%s%%_藥水及卷軸轉化成同種類型的合劑或者秘卷。不會影響力量藥水、升級卷軸以及用來解決某些房間的謎題的道具。

items.trinkets.eyeofnewt.name=蠑螈眼
items.trinkets.eyeofnewt.desc=這顆黑底金珠的眼球是常見的煉金材料，現在被強化成飾品。這種事物會使你的視力降低以使你以另一種方式看見事物。
items.trinkets.eyeofnewt.typical_stats_desc=此飾品通常會將你的可視範圍減少_%1$s%%_，同時使你能以靈視看見_%2$d_格內的敵人。
items.trinkets.eyeofnewt.stats_desc=以目前的等級而言，此飾品會將你的可視範圍減少_%1$s%%_，同時使你能以靈視看見_%2$d_格內的敵人。

items.trinkets.ferrettuft.name=雪貂絨束
items.trinkets.ferrettuft.desc=一簇銀白色的雪貂絨毛，以黃綠色的蝴蝶結挷成一束。雪貂因其敏捷、狡猾而聞名。此種力量從此飾品散發而出，加強角色的閃避能力。
items.trinkets.ferrettuft.typical_stats_desc=此飾品通常會使所有單位的閃避能力提升_%1$s%%_。
items.trinkets.ferrettuft.stats_desc=以目前的等級，此飾品將使所有角色的閃避能力提升_%1$s%%_。

items.trinkets.mimictooth.name=寶箱怪牙齒
items.trinkets.mimictooth.desc=這個又大又尖的牙齒大概是從某隻很不高興的寶箱怪嘴上拔下來的。它看起來正在影響你遇到的寶箱怪，使它們更常出現，也更危險。
items.trinkets.mimictooth.typical_stats_desc=通常此飾品會使所有種類的寶箱怪出現率提高_%1$s倍_且更難從外型察覺異樣，但也會提高其掉落物數量。每層樓也有_%2$s%%_的機率出現特別難發現的黑檀寶箱怪。
items.trinkets.mimictooth.stats_desc=以目前的等級，此飾品會使所有種類的寶箱怪出現率提高_%1$s倍_且更難從外型察覺異樣，但也會提高其掉落物數量。每層樓也有_%2$s%%_的機率出現特別難發現的黑檀寶箱怪。

items.trinkets.mossyclump.name=青苔聚塊
items.trinkets.mossyclump.desc=無論你怎麼捏這團青苔球，它似乎都能保留裡面的水分。它似乎正在透過某種魔力影響這座地下城，使水流及長草更常出現。
items.trinkets.mossyclump.typical_stats_desc=通常此飾品會使非特殊樓層有_%d%%_的機率變成繁茂或者含水樓層。\n\n此飾品升級時所需的能量較多。
items.trinkets.mossyclump.stats_desc=以目前的等級，此飾品會使非特殊樓層有_%d%%_的機率變成繁茂或者含水樓層。\n\n此飾品升級時所需的能量較多。

items.trinkets.parchmentscrap.name=咒術殘頁
items.trinkets.parchmentscrap.desc=這張小羊皮紙似乎是某張卷軸的一部份。它還保留了一部份的魔力，且似乎正在影響這座地下城中找到的武器及護甲。
items.trinkets.parchmentscrap.typical_stats_desc=通常此飾品會使附魔及刻印的出現率提高_%d倍_，且增加_%s倍_詛咒的出現率。魔杖、戒指及神器不會受到影響。\n\n此飾品升級時所需的能量較多。
items.trinkets.parchmentscrap.stats_desc=以目前的等級，此飾品會使附魔及刻印的出現率提高_%d倍_，且增加_%s倍_詛咒的出現率。魔杖、戒指及神器不會受到影響。\n\n此飾品升級時所需的能量較多。

items.trinkets.petrifiedseed.name=石化種子
items.trinkets.petrifiedseed.desc=這粒種子石化了，大概是地質作用或者魔法導致的。它似乎影響著這座地下城中的植物，使其偶爾掉落符石而非種子。
items.trinkets.petrifiedseed.typical_stats_desc=通常此飾品會使高草有_%1$s%%_的機率掉落符石取代種子，並使高草掉落物品的機率增加_%2$s%%_。
items.trinkets.petrifiedseed.stats_desc=以目前的等級，此飾品會使高草有_%1$s%%_的機率掉落符石取代種子，並使高草掉落物品的機率增加_%2$s%%_。

items.trinkets.ratskull.name=巨鼠頭骨
items.trinkets.ratskull.desc=這個令人毛骨悚然的飾品比普通老鼠的頭骨大不了多少，在這個地下城中不知何故是罕見的。頭骨的魔力似乎吸引了住於地下城中更稀有的生物，使它們出現得更頻繁。
items.trinkets.ratskull.typical_stats_desc=通常此飾品會使稀有敵人的出現機率增加_%d倍_。但對於裝甲石像和水晶寶箱怪的效用會減半。
items.trinkets.ratskull.stats_desc=以目前的等級，此飾品會使稀有敵人的出現機率增加_%d倍_。但對於裝甲石像和水晶寶箱怪的效用會減半。

items.trinkets.saltcube.name=鹽塊
items.trinkets.saltcube.desc=從一塊鹽晶上切下的完美立方體，大概是催化物的作用使它吸收掉了煉金釜中大半的水而非溶解於其中。它似乎神奇的使你吃進的食物脫水以延緩你的保腹感，但也延緩了未受到飢餓時的生命回復。
items.trinkets.saltcube.typical_stats_desc=在非頭目戰的情況下，通常此飾品會使你的飢餓消耗延緩_%1$s%%_，但也使自然回血的頻率降低_%2$s%%_。
items.trinkets.saltcube.stats_desc=在非頭目戰的情況下，以目前的等級，此飾品會使你的飢餓消耗延緩_%1$s%%_，但也使自然回血的頻率降低_%2$s%%_。

items.trinkets.shardofoblivion.name=遺忘碎片
items.trinkets.shardofoblivion.desc=在煉金釜的作用下，這塊小小的詛咒鐵片變成了……呃……虛空?光線在它的周圍會被扭曲，在沒被外力作用下會懸停在原處。碎片似乎神奇地從你的無知中汲取力量，所以還是最好別對此想太多。
items.trinkets.shardofoblivion.typical_stats_desc=通常此飾品會根據你正在裝備或近期使用的每一件未完全鑑定裝備以增加敵人掉落它們的所有物的機率提升20%%，最多計算_%d件_。這個飾品也會阻止你以任何方式鑑定裝備，使你只能透過碎片來得知符合鑑定條件裝備的屬性。
items.trinkets.shardofoblivion.stats_desc=以目前的等級，此飾品會根據你正在裝備或近期使用的每一件未完全鑑定裝備以增加敵人掉落它們的所有物的機率提升20%%，最多計算_%d件_。這個飾品也會阻止你以任何方式鑑定裝備，使你只能透過碎片來得知符合鑑定條件裝備的屬性。
items.trinkets.shardofoblivion.ac_identify=鑑定
items.trinkets.shardofoblivion.identify_prompt=鑑定一件物品
items.trinkets.shardofoblivion.identify_ready=已符合鑒定條件的物品:%s。請使用遺忘碎片以將此裝備變為已鑑定狀態。
items.trinkets.shardofoblivion.identify_ready_worn=你正裝備的所有物品皆已符合鑑定條件。請使用遺忘碎片以將這些裝備變為已鑑定狀態。
items.trinkets.shardofoblivion.identify_not_yet=這件物品尚未符合鑑定條件。
items.trinkets.shardofoblivion.identify=你鑑定了這個物品!
items.trinkets.shardofoblivion$wandusetracker.name=感測到未鑑定法杖
items.trinkets.shardofoblivion$wandusetracker.desc=你剛使用了一根未鑑定的法杖，短期內遺忘碎片會將其算做另一件未鑑定的裝備。\n\n有效時長:%s。
items.trinkets.shardofoblivion$thrownusetracker.name=感測到未鑑定投擲武器
items.trinkets.shardofoblivion$thrownusetracker.desc=你剛使用了一套未鑑定的投擲武器，短期內遺忘碎片會將其算做另一件未鑑定的裝備。\n\n有效時長:%s。

items.trinkets.thirteenleafclover.name=十三葉草
items.trinkets.thirteenleafclover.desc=不知何故，經過煉金釜的烹煮使這株三葉草長出一大堆額外的葉子!這到底會使人變得幸運或不幸，還是會讓運氣變得格外混亂且極端?
items.trinkets.thirteenleafclover.typical_stats_desc=通常此飾品會使所有你所造成的傷害參數值有_%1$d%%_的機率為最大值，並有_%2$d%%_的機率為最小值。
items.trinkets.thirteenleafclover.stats_desc=以目前的等級此飾品會使所有你所造成的傷害參數值有_%1$d%%_的機率為最大值，並有_%2$d%%_的機率為最小值。

items.trinkets.trapmechanism.name=陷阱機件
items.trinkets.trapmechanism.desc=這是個從地下城中被某人從地上謹慎鑿下以便攜帶的陷阱本體。經魔力加持後與地下城以另一種方式重新連接，使得地下城中的險惡環境更常見，但也同時使你對它們的感知更強大。
items.trinkets.trapmechanism.typical_stats_desc=通常此飾品通常會使非特殊樓層有_%1$d%%_的機率變成空洞或陷阱樓層，並額外揭露新樓層中_%2$d%%_的隱藏陷阱。
items.trinkets.trapmechanism.stats_desc=以目前的等級，這個飾品會使非特殊樓層有_%1$d%%_的機率變成空洞或陷阱樓層，並額外揭露新樓層中_%2$d%%_的隱藏陷阱。

items.trinkets.vialofblood.name=凝血試管
items.trinkets.vialofblood.desc=這支細試管包含著某些居於此地的生物血液，它們在試管中緩慢的流動著。它在你身上使得你的治療量增幅並受到延緩。
items.trinkets.vialofblood.typical_stats_desc=通常此飾品會使治療藥水、露水或聖療之井的井水對於你的治療總量提升_%1$s%%_。但每回合的治療量最高為_%2$s點_(與英雄等級成正比)。
items.trinkets.vialofblood.stats_desc=以目前的等級，此飾品會使治療藥水、露水或聖癒之井的井水對於你的治療總量提升_%1$s%%_。但每回合的治療量最高為_%2$s點_(與英雄等級成正比)。

items.trinkets.wondrousresin.name=奇蹟樹脂
items.trinkets.wondrousresin.desc=這些發光的藍色的粉末似乎是一根詛咒法杖提煉出來的精華。即便經過煉金釜的烹煮使渾沌魔法穩定了下來，但現在它影響的是你的每一根法杖。
items.trinkets.wondrousresin.typical_stats_desc=通常此飾品會使詛咒法杖產生的射彈有_%1$s%%_的機率為中立或正面效果，並使未詛咒的法杖及魔杖有_%2$s%%_的機率額外射出一發中立或正面的詛咒射彈。\n\n此飾品升級時所需的能量較多。
items.trinkets.wondrousresin.stats_desc=以目前的等級，此飾品會使詛咒法杖產生的射彈有_%1$s%%_的機率為中立或正面效果，並使未詛咒的法杖及魔杖有_%2$s%%_的機率額外射出一發中立或正面的詛咒射彈。\n\n此飾品升級時所需的能較多。

items.trinkets.trinketcatalyst.name=魔法催化物
items.trinkets.trinketcatalyst.window_title=製造一件飾品
items.trinkets.trinketcatalyst.window_text=煉金釜中的水在催化作用下發光，你能在附近在找個東西投入釜中來製成一件魔法飾品。
items.trinkets.trinketcatalyst.desc=這坨神奇的金色塵土在地下城暗處微微發光。只要在煉金釜中放入這東西，再加上少量的煉金能量即可練出一件獨特的魔法飾品。\n\n飾品會提供各種不同的效果以稍微改變遊戲機制、地下城的環境或其居民。投入更多能量能使飾品升級以強化效果，或將它丟棄來將效果消除。
items.trinkets.trinketcatalyst$randomtrinket.name=隨機飾品
items.trinkets.trinketcatalyst$randomtrinket.desc=還有一個東西封在一個你打不開的容器內。\n\n煉金釜能溶解包裝，但這麼做會使你根本不知道是什麼的飾物同時煉成!

items.trinkets.trinket.discover_hint=這件物品是透過煉金術製造飾品的可能選項之一。
items.trinkets.trinket$placeholder.name=飾品

