items.weapon.melee.katana.ability_desc=決鬥者能用武士刀對距離1格的敵人使出_弓步刺_。這會將她移動到敵人面前並造成_%1$d~%2$d點傷害_。
items.weapon.melee.katana.desc=有著巨型金屬握柄的細長大刀。

items.weapon.melee.longsword.name=長劍
items.weapon.melee.longsword.ability_name=順勢猛擊
items.weapon.melee.longsword.typical_ability_desc=決鬥者能透過長劍優異的低阻力做出_順勢猛擊_。這次攻擊通常能造成_%1$d~%2$d點傷害_。以這個武技擊殺敵人會持續她的武技施放，在五回合內能再度施展且不消耗武器充能。
items.weapon.melee.longsword.ability_desc=決鬥者能透過長劍優異的低阻力做出_順勢猛擊_。這次攻擊將能造成_%1$d~%2$d點傷害_。以這個武技擊殺敵人會持續她的武技施放，在五回合內能再度施展且不消耗武器充能。
