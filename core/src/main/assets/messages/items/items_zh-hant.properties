items.weapon.melee.quarterstaff.ability_name=防禦架勢
items.weapon.melee.quarterstaff.typical_ability_desc=決鬥者能以鐵頭棍做出_防禦架式_。這種架式能立即啟用並使她在接下來至少_%d回合_內擁有三倍閃避。
items.weapon.melee.quarterstaff.ability_desc=決鬥者能以鐵頭棍做出_防禦架式_。這種架式能立即啟用並使她在接下來_%d回合_內擁有三倍閃避。
