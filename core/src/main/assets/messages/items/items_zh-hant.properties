items.weapon.melee.rapier.discover_hint=此物品是某位英雄的初始裝備。

items.weapon.melee.roundshield.name=圓盾
items.weapon.melee.roundshield.typical_stats_desc=這件武器通常能格擋0~%d點傷害。 格擋量會隨著武器的升級而提升。
items.weapon.melee.roundshield.stats_desc=這件武器通常能格擋0~%d點傷害。 格擋量會隨著武器的升級而提升。
items.weapon.melee.roundshield.ability_name=防護
items.weapon.melee.roundshield.typical_ability_desc=決鬥者舉起她的圓盾來對自己做_防護_，在這期間她能抵擋所有向她而來的物理擊魔法傷害至少_%d_回合。一旦抵擋超過一次，以魔法或物理方式還擊會將防護終止。
items.weapon.melee.roundshield.ability_desc=決鬥者舉起她的圓盾來對自己做_防護_，在這期間她能抵擋所有向她而來的物理擊魔法傷害_%d_回合。一旦抵擋超過一次，以魔法或物理方式還擊會將防護終止。
items.weapon.melee.roundshield.upgrade_ability_stat_name=防護時長
items.weapon.melee.roundshield.desc=這個大盾牌可以有效阻擋攻擊，在危機時刻也可以作為不錯的武器使用。
items.weapon.melee.roundshield$guardtracker.name=舉盾格擋
items.weapon.melee.roundshield$guardtracker.guarded=受防護
items.weapon.melee.roundshield$guardtracker.desc=決鬥家舉起了她的盾牌以應對即將到來的攻擊。在這期間針對於她的物理或魔法攻擊將被完全抵擋住。\n\n剩餘時長:%s回合。

items.weapon.melee.runicblade.name=符文之刃
items.weapon.melee.runicblade.stats_desc=這把武器從升級中獲得更多傷害。
items.weapon.melee.runicblade.ability_name=盧恩斬擊
items.weapon.melee.runicblade.typical_ability_desc=決鬥者能強化符文之刃的力量以使出_盧恩斬擊_，這次攻擊的_附魔強度至少會提升%d%%。_
items.weapon.melee.runicblade.ability_desc=決鬥者能強化符文之刃的力量以使出_盧恩斬擊_，這次攻擊的_附魔強度會提升%d%%。_
items.weapon.melee.runicblade.upgrade_ability_stat_name=武技附魔加成
items.weapon.melee.runicblade.desc=來自失落之地的神祕武器，有著明亮的藍色刀刃。

items.weapon.melee.sai.name=雙釵
items.weapon.melee.sai.stats_desc=這是一套非常快的武器。
items.weapon.melee.sai.ability_name=組合終結技
items.weapon.melee.sai.typical_ability_desc=透過雙釵的速度，決鬥者能結合近戰及投擲武器攻擊以累積連擊數，最後再消耗武技充能給敵人來一記_組合終結技_。這次攻擊會造成至少_連擊數x%d+武器基礎傷害_的傷害量。5回合內沒成功攻擊會重置連擊數。
items.weapon.melee.sai.ability_desc=透過雙釵的速度，決鬥者能結合近戰及投擲武器攻擊以累積連擊數，最後再消耗武技充能給敵人來一記_組合終結技_。這次攻擊會造成_連擊數x%d+武器基礎傷害_的傷害量。5回合內沒成功攻擊會重置連擊數。
items.weapon.melee.sai.desc=一對輕薄的鋼刃，剛好一手一把。 在快速斬擊方面十分出色。
items.weapon.melee.sai$combostriketracker.name=戰意正酣
items.weapon.melee.sai$combostriketracker.desc=決鬥者做出好幾套組合攻擊來提升終結技的傷害。每次命中的近戰及投擲武器傷害都會增加連擊數，但5回合沒成功做出將會重置。\n\n當前連擊數:%1$d。\n\n連擊於%2$s回合後丟失。

items.weapon.melee.scimitar.name=彎刀
items.weapon.melee.scimitar.stats_desc=這是一把比較快的武器。
items.weapon.melee.scimitar.ability_name=劍舞
items.weapon.melee.scimitar.typical_ability_desc=透過彎刀順暢的揮擊能使決鬥者開始她的_劍舞_。進入這種狀態不耗回合，在這種狀態下會提升決鬥者60%%的攻速及50%%的準確度至少_%d回合_。
items.weapon.melee.scimitar.ability_desc=透過彎刀順暢的揮擊能使決鬥者開始她的_劍舞_。進入這種狀態不耗回合，在這種狀態下會提升決鬥者60%%的攻速及50%%的準確度_%d回合_。
items.weapon.melee.scimitar.upgrade_ability_stat_name=武技時長
items.weapon.melee.scimitar.desc=一把厚重的彎刀。它的形狀能讓它進行更快但不甚強力的攻擊。
items.weapon.melee.scimitar$sworddance.name=劍舞
items.weapon.melee.scimitar$sworddance.desc=決鬥者正以某種舞蹈形式進行一連串速攻。這種狀態下她的攻速將提高60%%(相當於每回合以彎刀攻擊兩次)、準確度則提高50%%。\n\n有效時長:%s。

items.weapon.melee.sickle.name=短柄鐮
items.weapon.melee.sickle.stats_desc=這是一把不太精準的武器。
items.weapon.melee.sickle.ability_name=收割
items.weapon.melee.sickle.typical_ability_desc=決鬥者以短柄鐮做出_收割_來在敵人身上留下大片傷口。這種致命的攻擊正常來說能造成_%d點傷害_。對於不免疫流血的敵人則會改以流血形式受到傷害。
items.weapon.melee.sickle.ability_desc=決鬥者以短柄鐮做出_收割_來在敵人身上留下大片傷口。這種致命的攻擊能造成_%d點傷害_。對於不免疫流血的敵人則會改以流血形式受到傷害。
items.weapon.melee.sickle.desc=一種手持式農具，也能做為強大但笨重的武器。

items.weapon.melee.spear.name=長矛
items.weapon.melee.spear.stats_desc=這是一把相當緩慢的武器。\n這把武器有額外的攻擊距離。
items.weapon.melee.spear.ability_name=突刺
items.weapon.melee.spear.typical_ability_desc=決鬥者能用矛尖對不與其相鄰的敵人使出_突刺_，正常來說這能造成_%1$d~%2$d點傷害_並擊退敵人。
items.weapon.melee.spear.ability_desc=決鬥者能用矛尖對不與其相鄰的敵人使出_突刺_，這種攻擊能造成_%1$d~%2$d點傷害_並擊退敵人。
items.weapon.melee.spear.desc=這是一根裝著鋒銳鐵刺的細長木杆。

items.weapon.melee.sword.name=單手劍
items.weapon.melee.sword.ability_name=順勢猛擊
items.weapon.melee.sword.typical_ability_desc=決鬥者能透過單手劍優異的低阻力做出_順勢猛擊_。這次攻擊通常能造成_%1$d~%2$d點傷害_。以這個武技擊殺敵人會持續她的武技施放，在五回合內能再度施展且不消耗武器充能。
items.weapon.melee.sword.ability_desc=決鬥者能透過單手劍優異的低阻力做出_順勢猛擊_。這次攻擊將能造成_%1$d~%2$d點傷害_。以這個武技擊殺敵人會持續她的武技施放，在五回合內能再度施展且不消耗武器充能。
items.weapon.melee.sword.desc=平衡性良好的劍。不算太大，但是依然比短劍長上不少。
items.weapon.melee.sword$cleavetracker.name=順勢猛擊
items.weapon.melee.sword$cleavetracker.desc=決鬥者使出順勢猛擊的動能被保留在身上，在短時間內能在不消耗武器充能的情況下再度施展。\n\n有效時長:%s。

items.weapon.melee.warhammer.name=戰錘
items.weapon.melee.warhammer.stats_desc=這是一把比較精準的武器。
items.weapon.melee.warhammer.ability_name=重搗
items.weapon.melee.warhammer.typical_ability_desc=決鬥者透過戰錘使出_重搗_把敵人砸成腦震盪。雖然在正常情況下只有正常傷害，但伏擊時傷害正常來說會提升至_%1$d~%2$d點傷害_，且無論如何，還會使敵人在5回合內的精準和閃避皆降低50%%。
items.weapon.melee.warhammer.ability_desc=決鬥者透過戰錘使出_重搗_把敵人砸成腦震盪。雖然在正常情況下只有正常傷害，但伏擊時傷害會提升至_%1$d~%2$d點傷害_，且無論如何，還會使敵人在5回合內的精準和閃避皆降低50%%。
items.weapon.melee.warhammer.desc=很少有生物能抵擋這鉛鐵巨塊的輾壓，但也只有最強壯的冒險家才能有效使用它。

items.weapon.melee.warscythe.name=戰鐮
items.weapon.melee.warscythe.stats_desc=這是一把不太精準的武器。
items.weapon.melee.warscythe.ability_name=收割
items.weapon.melee.warscythe.typical_ability_desc=決鬥者以戰鐮做出_收割_來在敵人身上留下大片傷口。這種致命的攻擊正常來說能造成_%d點傷害_。對於不免疫流血的敵人則會改以流血形式受到傷害。
items.weapon.melee.warscythe.ability_desc=決鬥者以戰鐮做出_收割_來在敵人身上留下大片傷口。這種致命的攻擊能造成_%d點傷害_。對於不免疫流血的敵人則會改以流血形式受到傷害。
items.weapon.melee.warscythe.desc=這隻又大又重的農作工具經過強化，使其更適合用於割下別人的頭而非農作物。

items.weapon.melee.whip.name=長鞭
items.weapon.melee.whip.stats_desc=這件武器擁有驚人的攻擊距離。
items.weapon.melee.whip.ability_name=橫掃
items.weapon.melee.whip.typical_ability_desc=決鬥者能拿長鞭_橫掃_一切。以對所有範圍內的敵人造成基礎傷害。
items.weapon.melee.whip.ability_desc=決鬥者能拿長鞭_橫掃_一切。以對所有範圍內的敵人造成基礎傷害。
items.weapon.melee.whip.desc=雖然這把武器另一端帶倒刺的繩子傷害不高，但它的攻擊範圍是獨一無二的。

items.weapon.melee.wornshortsword.name=破損的短劍
items.weapon.melee.wornshortsword.ability_name=順勢猛擊
items.weapon.melee.wornshortsword.typical_ability_desc=決鬥者能透過短劍優異的低阻力做出_順勢猛擊_。這次攻擊通常能造成_%1$d~%2$d點傷害_。以這個武技擊殺敵人會持續她的武技施放，在五回合內能再度施展且不消耗武器充能。
items.weapon.melee.wornshortsword.ability_desc=決鬥者能透過破損的短劍優異的低阻力做出_順勢猛擊_。這次攻擊將能造成_%1$d~%2$d點傷害_。以這個武技擊殺敵人會持續她的武技施放，在五回合內能再度施展且不消耗武器充能。
items.weapon.melee.wornshortsword.desc=一把十分短的劍，在大量使用後有一定的磨損。它比正常情況的短劍更輕，也更弱。
items.weapon.melee.wornshortsword.discover_hint=此物品是某位英雄的初始裝備。


###missile weapons
items.weapon.missiles.darts.adrenalinedart.name=激素飛鏢
items.weapon.missiles.darts.adrenalinedart.desc=這種飛鏢塗著一種由速行薊製成的藥物，能使盟友的攻擊及移動速度，或者是把敵人給射到殘廢。這種飛鏢仍能對敵人造成傷害，但不會傷及盟友。

items.weapon.missiles.darts.blindingdart.name=致盲飛鏢
items.weapon.missiles.darts.blindingdart.desc=這種飛鏢上塗著一種由致盲草製成的藥物，能讓目標失明一小段時間。 只不過藥效比新鮮的致盲草弱，不會讓目標迷失方向，所以目標會記住你之前在的位置。

items.weapon.missiles.darts.chillingdart.name=寒霜飛鏢
items.weapon.missiles.darts.chillingdart.desc=這種飛鏢上塗著一種由霜冰冠製成的藥物，能顯著地凍傷目標。

items.weapon.missiles.darts.cleansingdart.name=淨空飛鏢
items.weapon.missiles.darts.cleansingdart.desc=這種飛鏢上塗著一種以魔皇草製成的藥物，能使盟友對負面效果免疫、清除敵人的正面效果並使其暫時忘記你的存在。這種飛鏢仍能對敵人造成傷害，但不會傷及盟友。

items.weapon.missiles.darts.dart.name=飛鏢
items.weapon.missiles.darts.dart.ac_tip=塗藥
items.weapon.missiles.darts.dart.prompt=選擇一粒種子
items.weapon.missiles.darts.dart.tip_title=為飛鏢塗藥
items.weapon.missiles.darts.dart.tip_desc=一粒種子可以1-2枚飛鏢塗藥。 每類種子都能產生對應的，具有獨特效果的一次性塗藥飛鏢。 \n\n將這些種子塗抹在飛鏢上能得到_%s_。
items.weapon.missiles.darts.dart.tip_all=用 %2$d 顆種子為%1$d枚飛鏢塗藥
items.weapon.missiles.darts.dart.tip_two=用 1 顆種子為 2 枚飛鏢塗藥
items.weapon.missiles.darts.dart.tip_one=用 1 顆種子為 1 枚飛鏢塗藥
items.weapon.missiles.darts.dart.tip_cancel=取消
items.weapon.missiles.darts.dart.desc=由短木杆和金屬尖頭簡易製成，手腕輕抖就會精準地飛向目標。 使用種子可以為飛鏢塗藥，使其對目標造成額外效果。
items.weapon.missiles.darts.dart.unlimited_uses=由於飛鏢及其簡易的構造，飛鏢本身可以永久使用而不損壞。

items.weapon.missiles.darts.displacingdart.name=傳送飛鏢
items.weapon.missiles.darts.displacingdart.desc=這種飛鏢上塗著一種由消逝草製成的藥物，能把目標傳送走一小段距離。

items.weapon.missiles.darts.healingdart.name=治療飛鏢
items.weapon.missiles.darts.healingdart.desc=這種飛鏢上塗著一種由陽春草製成的藥物，能強效治療目標的傷勢。 這種飛鏢仍能對敵人造成傷害，但不會傷及盟友。

items.weapon.missiles.darts.holydart.name=神聖飛鏢
items.weapon.missiles.darts.holydart.desc=這種飛鏢上塗著一種由星隕花製成的藥物，能夠為目標注入神聖能量。 對於大部分的單位會賜福它們，至於亡靈及惡魔類敵人會受重傷。這種飛鏢仍能對敵人造成傷害，但不會傷及盟友。

items.weapon.missiles.darts.incendiarydart.name=燃燒飛鏢
items.weapon.missiles.darts.incendiarydart.desc=這種飛鏢上塗著一種由綻焰花製成的藥物，能點燃射到的物體。

items.weapon.missiles.darts.paralyticdart.name=麻痹飛鏢
items.weapon.missiles.darts.paralyticdart.desc=這種飛鏢上塗著一種由地縛根製成的藥物，能讓目標麻痹一小段時間。

items.weapon.missiles.darts.poisondart.name=毒液飛鏢
items.weapon.missiles.darts.poisondart.desc=這種飛鏢上塗著一種由斷腸苔製成的藥物，能使目標中毒。

items.weapon.missiles.darts.rotdart.name=腐敗飛鏢
items.weapon.missiles.darts.rotdart.desc=這種飛鏢厚塗著由惡名昭彰的腐莓製成的強酸汁液，能夠腐蝕掉鏢端所接觸到的東西。除了一些比較強大的敵人外，這種強力腐蝕基本上能使被射中的敵人短時間內蝕化成虛無。這種塗藥的耐久度比其它飛鏢高很多，但可惜耐久度無法被提升。
items.weapon.missiles.darts.rotdart.discover_hint=這個物品能由任務中獲得的特殊物品製成。

items.weapon.missiles.darts.shockingdart.name=電擊飛鏢
items.weapon.missiles.darts.shockingdart.desc=這種飛鏢上塗著一種由風暴藤製成的藥物，能讓目標受到強烈的電擊。

items.weapon.missiles.darts.tippeddart.ac_clean=清洗
items.weapon.missiles.darts.tippeddart.clean_title=清洗飛鏢
items.weapon.missiles.darts.tippeddart.clean_desc=這項操作會去除飛鏢上的塗藥，將其變回普通飛鏢。
items.weapon.missiles.darts.tippeddart.clean_all=清洗全部
items.weapon.missiles.darts.tippeddart.clean_one=清洗一枚
items.weapon.missiles.darts.tippeddart.cancel=取消
items.weapon.missiles.darts.tippeddart.uses_left=這些塗藥飛鏢再使用_%d/%d_次就會有一枚失去藥效。
items.weapon.missiles.darts.tippeddart.unlimited_uses=_但是因為它們極高品質，可以永久使用而不損壞。 _
items.weapon.missiles.darts.tippeddart.about_to_break=你飛鏢上的塗藥快要失效了。
items.weapon.missiles.darts.tippeddart.has_broken=你飛鏢上的塗藥失效了。
items.weapon.missiles.darts.tippeddart.discover_hint=此物品為商店的商品，但也能透過種子與飛鏢製成。


items.weapon.missiles.bolas.name=流星錘
items.weapon.missiles.bolas.stats_desc=這種武器能使敵人殘廢。
items.weapon.missiles.bolas.desc=這種奇怪的投擲武器造成的傷害並不高，但是能效果很好的絆倒目標使其減速。

items.weapon.missiles.boomerang.name=迴力鏢
items.weapon.missiles.boomerang.desc=投向敵人後，這具扁平的曲狀木製投擲物能夠自動回到投擲者手中。
items.weapon.missiles.boomerang.durability=這支迴力鏢造得非常結實，使用後不會產生損耗。

items.weapon.missiles.fishingspear.name=捕魚矛
items.weapon.missiles.fishingspear.desc=小巧的投擲用短矛，本來是用來捕魚的，不過也能當個武器用。

items.weapon.missiles.forcecube.name=衝擊魔方
items.weapon.missiles.forcecube.ondeath=你被自己的衝擊魔方震成了碎片……
items.weapon.missiles.forcecube.stats_desc=這種武器會把衝擊力發散到一個小範圍內，對波及區域內的所有單位造成傷害。
items.weapon.missiles.forcecube.desc=這種奇形怪狀的武器小到可以握在掌心，但極其沉重。

items.weapon.missiles.heavyboomerang.name=重型迴力鏢
items.weapon.missiles.heavyboomerang.stats_desc=此投擲武器在擲出五回合後，會飛回到扔出的地點。
items.weapon.missiles.heavyboomerang.desc=這種大型迴力鏢使用起來更困難，但能造成可觀的傷害。

items.weapon.missiles.javelin.name=標槍
items.weapon.missiles.javelin.desc=這種大號投擲用長槍上的配重保證它們會以尖端為首飛向目標。

items.weapon.missiles.kunai.name=苦無
items.weapon.missiles.kunai.stats_desc=這把武器在對付未察覺你的敵人時更有效。
items.weapon.missiles.kunai.desc=技巧高深者能用這種小刀造成可觀的傷害。

items.weapon.missiles.missileweapon.stats_known=這組_%1$d階_投擲武器可以造成_%2$d~%3$d點傷害_，並且需要_%4$d點力量_來使用。
items.weapon.missiles.missileweapon.stats_unknown=一般情況下，這組_%1$d階_投擲武器可以造成_%2$d~%3$d點傷害_，並且需要_%4$d點力量_來使用。
items.weapon.missiles.missileweapon.stats_desc=
items.weapon.missiles.missileweapon.probably_too_heavy=這件武器對你來說或許太重了。
items.weapon.missiles.missileweapon.distance=投擲武器在遠程攻擊時有精準加成，但在目標極為靠近時，精準會大幅降低。
items.weapon.missiles.missileweapon.durability=投擲武器在使用過程中會磨損並最終損壞。
items.weapon.missiles.missileweapon.uses_left=這組投擲武器再用_%d/%d_次就會有一件被損耗掉。
items.weapon.missiles.missileweapon.unlimited_uses=因為這套武器品質極高，可以永久使用而不損壞。
items.weapon.missiles.missileweapon.unknown_uses=一般情況下，這組投擲武器每用_%d_次就會有一件被損耗掉。
items.weapon.missiles.missileweapon.curse_discover=這組投擲武器帶有詛咒!
items.weapon.missiles.missileweapon.about_to_break=你的投擲武器快要損壞了。
items.weapon.missiles.missileweapon.has_broken=這組投擲武器的其中一枚已經損壞了。
items.weapon.missiles.missileweapon.dust=這件武器拿上手之後就粉碎了。
items.weapon.missiles.missileweapon.break_upgraded_warn_desc=如果這件投擲武器擊中敵人，這整組加強過的武器就會永遠消失。你依然要擲出這件武器嗎?
items.weapon.missiles.missileweapon.break_upgraded_warn_yes=是
items.weapon.missiles.missileweapon.break_upgraded_warn_no=否
items.weapon.missiles.missileweapon$placeholder.name=投擲武器

items.weapon.missiles.shuriken.name=手裏劍
items.weapon.missiles.shuriken.stats_desc=擲出手裏劍不耗時間，此特性有有20回合冷卻。
items.weapon.missiles.shuriken.desc=鋒利的星形金屬刃片，非常輕便。在準備好後即可瞬間投出。
items.weapon.missiles.shuriken$shurikeninstanttracker.name=速擲手裏劍冷卻
items.weapon.missiles.shuriken$shurikeninstanttracker.desc=你已經瞬間丟出一發手裏劍了。在冷卻結束前，投擲手裏劍都會消耗時間。\n\n冷卻剩餘: %s回合。

items.weapon.missiles.throwingclub.name=飛槌
items.weapon.missiles.throwingclub.stats_desc=這種武器在命中後會落於地面而非卡在目標上。
items.weapon.missiles.throwingclub.desc=簡單粗暴的投擲武器，本質上是一塊綁著根木棍的大石頭。

items.weapon.missiles.throwinghammer.name=投擲錘
items.weapon.missiles.throwinghammer.stats_desc=這種武器在命中後會落於地面而非卡在目標上。
items.weapon.missiles.throwinghammer.desc=這種沉甸甸的鎚子是用來扔向敵人的。平滑的純金屬的製作工藝使它們非常結實。

items.weapon.missiles.throwingknife.name=飛刀
items.weapon.missiles.throwingknife.stats_desc=這把武器在對付未察覺你的敵人時更有效。
items.weapon.missiles.throwingknife.desc=這種輕便的小刀平衡得當，使其能在飛行後準確地刺穿目標。
items.weapon.missiles.throwingknife.discover_hint=此物品是某位英雄的初始裝備。

items.weapon.missiles.throwingspear.name=投矛
items.weapon.missiles.throwingspear.desc=這種輕便短矛的木杆非常纖細，適合當作投擲型武器，不適合用來近戰。

items.weapon.missiles.throwingspike.name=鐵刺
items.weapon.missiles.throwingspike.desc=被磨尖的鐵條，結構簡單，結實耐用，擲出後可刺進距離較遠敵人身上。
items.weapon.missiles.throwingspike.discover_hint=此物品是某位英雄的初始裝備。

items.weapon.missiles.throwingstone.name=石子
items.weapon.missiles.throwingstone.desc=這種石頭被打磨過，使它們在砸到東西時的傷害比普通石頭更大。
items.weapon.missiles.throwingstone.discover_hint=此物品是某位英雄的初始裝備。

items.weapon.missiles.tomahawk.name=投斧
items.weapon.missiles.tomahawk.stats_desc=此種武器能使目標得到_%1$d~%2$d點的流血狀態_。
items.weapon.missiles.tomahawk.typical_stats_desc=通常此武器會對目標造成_%1$d~%2$d點_流血傷害。
items.weapon.missiles.tomahawk.desc=這種手斧有鋸齒狀的刃。在擊中目標後能劃開血肉，並遺留在目標身上。

items.weapon.missiles.trident.name=三叉戟
items.weapon.missiles.trident.desc=尖端具有三根致命尖叉的特大號標槍。威力極大，但也很重。


items.weapon.spiritbow.name=靈能弓
items.weapon.spiritbow.ac_shoot=射擊
items.weapon.spiritbow.prompt=選擇一個目標
items.weapon.spiritbow.stats=這把弓不能直接升級，但是會隨著你等級提升而逐漸增強。 以你目前的等級，這把弓射出的每支箭可以造成_%1$d~%2$d點傷害_並且需要_%3$d點力量_來正常使用。
items.weapon.spiritbow.desc=一把由遠古靈木製成的弓，弓弦和弓身的刻紋散發著蒼藍色的幽光。 拉開弓弦時，一發魔法箭矢會生成在弓身一側向目標飛去。
items.weapon.spiritbow.discover_hint=此物品是某位英雄的初始裝備。

items.weapon.weapon.identify=你對手上的武器了解充分，已完全鑑定其屬性。
items.weapon.weapon.too_heavy=因為你的力量不足，該武器會降低你的攻速和準度，並讓你無法偷襲。
items.weapon.weapon.excess_str=你的額外力量讓你在使用這件武器時能夠造成_0~%d點額外傷害_。
items.weapon.weapon.hardening_gone=你武器上的硬化效果被損耗掉了!
items.weapon.weapon.incompatible=不同屬性的魔法相沖突，消除了武器上的附魔!
items.weapon.weapon.cursed_worn=由於這件武器被詛咒，你無法將其放下。
items.weapon.weapon.cursed=你能感覺到這件武器裡潛伏著一股充滿惡意的魔力。
items.weapon.weapon.weak_cursed=即便詛咒附魔依然還在，但現在拿得下來了。
items.weapon.weapon.not_cursed=這件武器沒有被詛咒。
items.weapon.weapon.faster=這件武器強化了_攻速_。
items.weapon.weapon.stronger=這件武器強化了_傷害_。
items.weapon.weapon.enchanted=這件武器附有_%s_。
items.weapon.weapon.enchant_hardened=它被_硬化_了。
items.weapon.weapon.hardened_no_enchant=這武器已被_硬化_，但尚未附魔。
items.weapon.weapon$enchantment.enchant=附魔
items.weapon.weapon$enchantment.rankings_desc=被附魔魔法弄死
items.weapon.weapon$enchantment.discover_hint=此種附魔可能出現在地下城內的武器上，也有可能出現在你所附魔的武器上。


###misc items
items.amulet.name=Yendor護符
items.amulet.ac_end=結束遊戲
items.amulet.desc=Yendor護符是人類與矮人所知的最強大的神器。 其上鑲嵌的閃閃發光的水晶蘊含著不可思議的神奇力量。
items.amulet.desc_origins=護符的來歷不詳。 根據歷史記載，矮人國王誇口說他在矮人文明與外界切斷一切聯繫之前不久就發現了這件神器。 那他是怎麼找到的? Yog-Dzewa又是怎麼從他那裡拿走的? 也許這些問題不需要現在解答，真正重要的是:護符是你的了!
items.amulet.desc_ascent=護符的來歷不詳，但很明顯的被Yog-Dzewa的力量嚴重影響了。 只要你還身處地下城中，整座地下城就會被牠所影響，使裡面的一切更強大且敵人更多! 護符也沒有任何效用且無法從身上拿開，此時它已與詛咒已毫無差別了。
items.amulet.ascent_title=歸返之路
items.amulet.ascent_desc=你在上樓時感受到Yog-Dzewa的強大而可怖的能量從護符中散發出來。當祂能確定你這個凡人妄想拿著護符離開，祂就會設法讓你在地下城在最後的時間好好折磨你!\n\n如果你想帶著護符離開，地下城會順應著你而變得更危險，跨樓層傳送將受到封鎖，你也不能在中途後悔，只有離開地下城才能獲勝!\n\n如果還需要回樓上準備，你能先把護符留在這裡自己先上去，或者如果不想接受挑戰，你也能考慮在這裡直接以護符結束遊戲。
items.amulet.ascent_yes=衝上去!
items.amulet.ascent_no=再準備一下
items.amulet.discover_hint=此物品位於城下城最底層……

items.ankh.name=重生十字架
items.ankh.ac_bless=祝福
items.ankh.bless=你用魔力露水祝福了這個重生十字架。
items.ankh.desc=這枚象徵不朽的古老飾品能夠讓人起死回生。大多物品在你死後都會留在死亡點，但你能回去撿起它們。透過裝滿露水的水袋能賦予重生十字架更強大的力量。
items.ankh.desc_blessed=這枚象徵不朽的古老飾品能夠讓人起死回生。這枚十字架已被祝福而變得更加強大。它會在危急關頭犧牲自己來救你一命。
items.ankh.discover_hint=此物品只在商店中出現。

items.arcaneresin.name=奧術樹脂
items.arcaneresin.prompt=選擇要強化的法杖
items.arcaneresin.ac_apply=使用
items.arcaneresin.level_too_high=奧術樹脂已經無法再強化這根過強的法杖了。
items.arcaneresin.not_enough=樹脂不夠用於升級這根法杖!
items.arcaneresin.apply=你以奧樹樹脂包覆於法杖上，使法杖的力量受到提升!
items.arcaneresin.desc=這些紫色的粉末發著白光。它可以作為魔能強化物，用於法杖上能提升等級!\n\n樹脂的消耗量等同於升級後的法杖等級，最高只能將法杖升至+3。\n\n其它升級方式(像是升級卷軸)會破壞樹脂的強化，而且強化的等級不會計入灌注於法師魔杖的升級依據。
items.arcaneresin.discover_hint=此物品為鍊金的產物。

items.brokenseal.name=破損紋章
items.brokenseal.ac_affix=貼附
items.brokenseal.prompt=選擇一件護甲。
items.brokenseal.unknown_armor=你需要先得知那件護甲是否具有詛咒。
items.brokenseal.cursed_armor=紋章無法貼上於受綁定性詛咒影響的護甲。
items.brokenseal.affix=你將紋章佩掛在了護甲上!
items.brokenseal.desc=一枚蠟製紋章，在護甲上作為英勇象徵。中央刻著受到磨損且從中間裂成兩半的護法符文。\n\n作為來自家鄉的紀念品，這枚紋章是戰士的意念源頭。配戴紋章使得戰士在生命值剩半數時獲得護盾。\n\n紋章能_貼在護甲上_，且能隨時換到另一件護甲，只要升級貼有紋章的護甲，它也能同時攜帶一級升級以作用至其他護甲。
items.brokenseal.inscribed=紋章同時也攜帶著_%s_的魔力。
items.brokenseal.choose_title=選擇一個刻印
items.brokenseal.choose_desc=這件護甲與破損紋章都攜帶著一個刻印。請選擇一個想保留的刻印。\n\n護甲上的刻印:%1$s\n紋章上的刻印:%2$s\n注意:如果選擇保留護甲的刻印，紋章將無法轉移此刻印。
items.brokenseal.discover_hint=此物品是某位英雄的初始裝備。
items.brokenseal$warriorshield.name=意念防護
items.brokenseal$warriorshield.desc_active=戰士的紋章堅定了他的意念，使他獲得了建於生命之上的護盾。這個效果在觸發後會受到冷卻。\n\n這種護盾不會被衰減，但會在附近沒有敵人的數回合後消失。消失的護盾能減少冷卻時間，至多50%%。\n\n剩餘護盾量:%1$d。\n\n目前冷卻時間:%2$d回合。
items.brokenseal$warriorshield.desc_cooldown=戰士的護盾效果剛被觸發，因此需等待一段時間後才能再次觸發防護效果。\n\n冷卻剩餘:%d回合。
items.brokenseal$warriorshield.desc_negative_cooldown=戰士紋章的冷卻時間目前為負數，代表它下次的觸發後的冷卻會低於150回合。此冷卻最多能降低至-150回合，代表著其下次觸發之後能再次就緒。\n\n冷卻剩餘:%d回合。

items.dewdrop.name=露珠
items.dewdrop.already_full=你的生命值已滿。
items.dewdrop.desc=一顆晶瑩剔透的露珠。 \n\n這裡的凈水受到這座地下城的魔力影響，使它們有著少量的治療效果。

items.equipableitem.curse_detected=你在裝備前察覺到了詛咒!
items.equipableitem.unequip_cursed=你無法移除受詛咒的物品!
items.equipableitem.ac_equip=裝備
items.equipableitem.ac_unequip=取下

items.energycrystal.name=能量晶體
items.energycrystal.desc=一些結晶粒，充滿著催化魔力。\n\n這些晶粒是最常見的煉金材料，最常見的取得方式就是透過煉金釜提煉消耗品。

items.gold.name=金幣
items.gold.desc=一堆金幣。收集金幣以在隨後的商店中消費。

items.heap.for_sale=%1$dg:%2$s
items.heap.chest=寶箱
items.heap.chest_desc=打開前你是看不見裡面有什麼的!
items.heap.locked_chest=上鎖的寶箱
items.heap.locked_chest_desc=打開前你是看不見裡面有什麼的! 你需要一枚金鑰匙才能打開它。
items.heap.crystal_chest=水晶寶箱
items.heap.crystal_chest_desc=你看得見裡面有_%s_，但你需要一枚水晶鑰匙才能打開它。
items.heap.artifact=一件神器
items.heap.wand=一根法杖
items.heap.ring=一枚戒指
items.heap.tomb=墳墓
items.heap.tomb_desc=這個墳墓裡或許埋葬著一些有用的東西，但墓主肯定是不會讓你拿走的。
items.heap.skeleton=遺骸
items.heap.skeleton_desc=某個不幸的冒險家存在過的唯一證明。或許可以找找裡面有沒有什麼值錢的東西。
items.heap.remains=英雄遺骸
items.heap.remains_desc=你的某個先輩存在過的唯一證明。或許能找到點什麼值錢的東西。

items.honeypot.name=蜂蜜罐
items.honeypot.ac_shatter=擊碎
items.honeypot.desc=這個巨型蜂蜜罐只是薄薄的塗了一圈蜂蜜，作為替代裡頭住著一隻巨型蜜蜂!這種大型蜜蜂平常只待在蜂巢裡，也許罐子本身就是某種特殊陷阱屋?蜜蜂看起來對罐子很滿意，當你看向它時它非常警惕地對你回以嗡鳴。
items.honeypot$shatteredpot.name=破碎的蜂蜜罐
items.honeypot$shatteredpot.desc=這個罐子已經被打碎，僅靠罐沿的粘稠蜂蜜勉強維持形狀，而且正在緩緩解體。\n\n儘管蜜罐碎了，看來蜜蜂依然想捍衛它的住所。

