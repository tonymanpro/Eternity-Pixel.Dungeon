items.weapon.melee.mace.ability_desc=決鬥者透過硬頭錘使出_重搗_把敵人砸到腦震盪。雖然在正常情況下只有正常傷害，但伏擊時傷害會提升至_%1$d~%2$d點傷害_，且無論如何，還會使敵人在5回合內的精準和閃避皆降低50%%。
