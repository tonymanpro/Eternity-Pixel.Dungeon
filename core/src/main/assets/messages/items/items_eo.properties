###armor curses
items.armor.curses.antientropy.name=%s de malentropio
items.armor.curses.antientropy.desc=Malbono de malentropio agas kontraŭ fortoj de la universo, puŝante energion al la portanto el lia ĉirkaŭaĵo. Tio por momente fajrigas la portanton kaj glacigas ĉion ĉirkaŭ li!

items.armor.curses.bulk.name=%s de dikeco
items.armor.curses.bulk.desc=Defendaĵoj de dikeco ŝajnas pli grande kaj masive, tamen ili ne karakterizas per pli bona defendo. Tio ĉi eĉ pli aĉas: la pliigita grando malfaciligas movadon trans pordoj.

items.armor.curses.corrosion.name=%s de acidrustado
items.armor.curses.corrosion.desc=Defendaĵo de acidrustado kapablas elŝpruci mordan likvon, kiu kovras ĉiun proksime per glueca morda acido.

items.armor.curses.displacement.name=%s de transmetiĝo
items.armor.curses.displacement.desc=La malbeno de transmetiĝo provas porti posedanton al sekurejo kiam li estas atakata. Tamen ĝi estas ete tro efika kaj hazarde teleportas la portanton ene la nuna keletaĝo.

items.armor.curses.metabolism.name=%s de metabolo
items.armor.curses.metabolism.desc=La malbeno de metabolo senpere transformas satecon al sano kiam portanto estas vundita, iomete sanigante, sed rapide kaŭzante malsaton.

items.armor.curses.multiplicity.name=%s de obligo
items.armor.curses.multiplicity.desc=Defendaĵo malbenita per obligo enhavas minacan obligan magion. Ĝi hazarde kreas spegulan figuron de la portanto, tamen ĝi same povas obligi atakanton!

items.armor.curses.overgrowth.name=%s de prikreskado
items.armor.curses.overgrowth.desc=Defendaĵoj de prikreskado estas kovritaj per diversaj florantaj vegetaĵoj. Kvankam tio ĉi aspektas interese, sed ne plimalmoligas la defendaĵon kaj tiuj vegetaĵoj hazarde aktiviĝas dum batalo!

items.armor.curses.stench.name=%s de odoraĉo
items.armor.curses.stench.desc=Defendaĵo malbenita per odoraĉo ellasos nubeton de venena gaso, kiu estos danĝera al ĉiuj kaptitaj per la nubeto.


###glyphs
items.armor.glyphs.affection.name=%s de afekcio
items.armor.glyphs.affection.desc=Tiu ĉi potenca skribaĵo manipulas mensojn de atakantoj, fiĉarmante ilin portempe.

items.armor.glyphs.antimagic.name=%s de malmagio
items.armor.glyphs.antimagic.desc=Tiu ĉi potenca skribaĵo ebligas al defendaĵo protekti ĝian portanton kontraŭ magiaj atakoj, aldone al korpaj. La magia protekto ne dependas de supernivelo de la defendaĵo.

items.armor.glyphs.brimstone.name=%s de sulfuro
items.armor.glyphs.brimstone.desc=Tiu ĉi skribaĵo protektas la portanton kaj liajn posedaĵojn kontraŭ fajro, tute nuligante brulvundojn kaj ĝiajn malbonajn efikojn.

items.armor.glyphs.camouflage.name=%s de kaŝmaskado
items.armor.glyphs.camouflage.desc=Tiu ĉi skribaĵo igas portanton kamufli per alta herbo, farante lin portempe nevidebla.

items.armor.glyphs.entanglement.name=%s de alligo
items.armor.glyphs.entanglement.desc=Tiu ĉi skribaĵo kreskigas terecan ŝirmon ĉirkaŭ la portanto por sorbi ricevatajn vundojn, sed tiu ŝirmo malaperos kiam la portanto moviĝos.

items.armor.glyphs.flow.name=%s de fluo
items.armor.glyphs.flow.desc=Tiu ĉi skribaĵo manipulas fluon de akvo ĉirkaŭ portanto, igante lin pli rapida dum movado tra ĝin.

items.armor.glyphs.obfuscation.name=%s de nigrumo
items.armor.glyphs.obfuscation.desc=Tiu ĉi skribaĵo nigrumas la portanton, igante lin malpli eltrovebla.

items.armor.glyphs.potential.name=%s de potencialo
items.armor.glyphs.potential.desc=Tiu ĉi skribaĵo gajnas energion de frapoj, ŝargante vergojn de la portanto je aktivigo.

items.armor.glyphs.repulsion.name=%s de repuŝo
items.armor.glyphs.repulsion.desc=Tiu ĉi skribaĵo kaŭzas forton kontraŭ atakantojn, repuŝante ilin for.

items.armor.glyphs.stone.name=%s de ŝtono
items.armor.glyphs.stone.desc=Tiu ĉi skribaĵo ĉirkaŭas defendaĵon per pezaj magiaj ŝtonoj, kiuj malebligas eviton, sed malpliigas ricevatajn vundojn proporcie de evito.

items.armor.glyphs.swiftness.name=%s de rapideco
items.armor.glyphs.swiftness.desc=Tiu ĉi skribaĵo pliigas rapidon de la portanto, se li ne troviĝas apud malamiko.

items.armor.glyphs.thorns.name=%s de dornoj
items.armor.glyphs.thorns.desc=Tiu ĉi potenca skribaĵo vundas atakantojn, igante ilin malrapide sangadi kiam ili atakas la portanton.

items.armor.glyphs.viscosity.name=%s de glueco
items.armor.glyphs.viscosity.deferred=prokrastata %d
items.armor.glyphs.viscosity$defereddamage.name=prokrastataj vundoj
items.armor.glyphs.viscosity$defereddamage.ondeath=Prokrastitaj vundoj mortigis vin…
items.armor.glyphs.viscosity$defereddamage.rankings_desc=Mortigita pro prokrastitaj vundoj
items.armor.glyphs.viscosity$defereddamage.desc=Vundpoentoj aplikiĝas malrapidete dum tempo anstataŭ tuje.\n\nPliaj prokrastataj vundpoentoj: %d.
items.armor.glyphs.viscosity.desc=Tiu ĉi skribaĵo povas prokrasti ricevon de vundoj, do ili efikos la portanton malrapide anstataŭ en unu fojo.



###armor
items.armor.armor.ac_detach=DISIGI
items.armor.armor.detach_seal=Vi disigis sigelon de via defendaĵo.
items.armor.armor.equip_cursed=La defendaĵo dolore ĉirkaŭprenas vin.
items.armor.armor.identify=Vi sufiĉe ekkonis kun via defendaĵo por identigi ĝin.
items.armor.armor.hardening_gone=Tiu ĉi defendaĵo eluziĝis, ĝi ne estas plu hardita!
items.armor.armor.incompatible=Reciproka kontraŭago de diversaj magioj vakigis la skribaĵon de tiu ĉi defendaĵo!
items.armor.armor.curr_absorb=Tiu ĉi _%1$d-supernivela_ defendaĵo blokas _%2$d-%3$d vundpoentojn_ kaj postulas _%4$d povpoentojn_ por uzi ĝin ĝuste.
items.armor.armor.avg_absorb=Kutime tiu ĉi _%1$d-supernivela_ defendaĵo blokas _%2$d-%3$d vundpoentojn_ kaj postulas _%4$d povpoentojn_ por uzi ĝin ĝuste.
items.armor.armor.too_heavy=Pro via nesufiĉa povo, surmetado de tiu ĉi defendaĵo malpliigos vian povon por movi, eviti kaj defendi.
items.armor.armor.probably_too_heavy=Probable tiu ĉi defendaĵo estas tro peza por vi.
items.armor.armor.excess_str=Pro via troa povo, vi estas _pli evitpova_ vestante tiun ĉi defendaĵon.
items.armor.armor.evasion=Ĝi estas plivastigita por pliigi _evitpovon._
items.armor.armor.defense=Ĝi estas plivastigita por pliigi _defendon._
items.armor.armor.inscribed=Ĝi estas surskribita per _%s._
items.armor.armor.glyph_hardened=Ĝi estas _hardita._
items.armor.armor.hardened_no_glyph=Tiu ĉi defendaĵo estas _hardita,_ sed ne estas nuntempe surskribita.
items.armor.armor.cursed_worn=Pro malbeno de tiu ĉi defendaĵo, vi ne povas ĝin demeti.
items.armor.armor.cursed=Vi sentas fian magion insidantan de tiu ĉi defendaĵo.
items.armor.armor.weak_cursed=Malgraŭ esti malbenita, vi povis demeti tiun ĉi defendaĵon.
items.armor.armor.not_cursed=Tiu ĉi defendaĵo estas libera de fia magio.
items.armor.armor.seal_attached=La rompita sigelo de Batalisto estas surmetita al tiu ĉi defendaĵo. Kiam li estos vundata havante malpli ol duono de sano, la sigelo liveros _%d ŝirm-poentojn_.
items.armor.armor.seal_transfer=La rompita sigelo de Batalisto devas esti surmetita al lia nune vestita defendaĵo por utili. Ĉu vi volas disigi la sigelon de la portata defendaĵo kaj surmeti ĝin al la portota?
items.armor.armor.seal_transfer_yes=jes
items.armor.armor.seal_transfer_no=ne
items.armor.armor$glyph.glyph=skribaĵo
items.armor.armor$glyph.killed=%s mortigis vin…
items.armor.armor$glyph.rankings_desc=Mortigita de skribaĵo
items.armor.armor$glyph.discover_hint=Vi povas trovi aĵon kun tia efiko ie hazarde en la labirinto, aŭ provi apliki ĝin al iu aĵo mem.

items.armor.classarmor.ac_ability=ELEKTI KAPABLON
items.armor.classarmor.ac_transfer=TRANSIGI
items.armor.classarmor.no_ability=Via dafendaĵo nuntempe havas neniun specialan kapablon, elektu iun!
items.armor.classarmor.not_equipped=Vi devas surmeti tiun ĉi defendaĵon por uzi ĝian specian povon!
items.armor.classarmor.low_charge=La defendaĵo ne ŝargiĝis sufiĉe por uzi ĝian specialan povon!
items.armor.classarmor.charge_use=Vi povas uzi tiun ĉi kapablon por _%s_ ŝargoj.
items.armor.classarmor.transfer_title=Transigi defendaĵon
items.armor.classarmor.transfer_desc=Magio de la krono de la Reĝo de Gnomoj povas esti transigita al alia defendaĵo. Estu konscia, ke la origina defendaĵo detruiĝos dum tiu ĉi procedo.
items.armor.classarmor.transfer_prompt=Elektu defendaĵon
items.armor.classarmor.transfer_cancel=Nuligi
items.armor.classarmor.transfer_complete=Transigis atributojn de via heroa defendaĵo!
items.armor.classarmor.discover_hint=Vi povas trovi tiun aĵon post venki la supermonstron en la 20-a keletaĝo per la specifa heroo.

items.armor.clericarmor.name=ornato de heroo
items.armor.clericarmor.desc=Portante tiun ĉi kunmetaĵon de ŝtofo kaj plateta kiraso, Kleriko povas uzi specialan kapablon.

items.armor.clotharmor.name=ŝtofa defendaĵo
items.armor.clotharmor.desc=Tiu ĉi malpeza defendaĵo garantias bazan protekton.
items.armor.clotharmor.discover_hint=Iu el la herooj komencas kun tiu aĵo.

items.armor.duelistarmor.name=brustkiraso de heroo
items.armor.duelistarmor.desc=Portante tiun ĉi platetan kirason kaj pelerinon, Duelistino povas uzi specialan kapablon.

items.armor.huntressarmor.name=pelerino de heroo
items.armor.huntressarmor.no_enemies=Neniu kontraŭulo en vidatingo
items.armor.huntressarmor.desc=Portante tiun ĉi pelerinon, Ĉasistino povas uzi specialan kapablon.

items.armor.leatherarmor.name=leda defendaĵo
items.armor.leatherarmor.desc=Defendaĵo farita el tanita ledo de monstroj. Ne tiel malpeza kiel ŝtofa defendaĵo, sed ĝi peras pli bonan protekton.

items.armor.magearmor.name=robo de heroo
items.armor.magearmor.desc=Portante tiun ĉi ŝikan robon, Magiisto povas uzi specialan kapablon.

items.armor.mailarmor.name=maŝkiraso
items.armor.mailarmor.desc=Interplektitaj metalaj ringetoj formas malmolan sed elastan defendan veston.

items.armor.platearmor.name=plateta kiraso
items.armor.platearmor.desc=Grandetaj metalaj platetoj kunligitaj formante kirason, kiu peras nekompareblan protekton por iu ajn aventuristo kiu estas sufiĉe forta por porti ĝian pezegon.

items.armor.roguearmor.name=kostumo de heroo
items.armor.roguearmor.desc=Portante tiun ĉi nigran kostumon, Fripono povas uzi specialan kapablon.

items.armor.scalearmor.name=skvamkiraso
items.armor.scalearmor.desc=Metalaj skvamoj alkudritaj al leda veŝto formas elastan tamen protektan defendaĵon.

items.armor.warriorarmor.name=plateta kiraso de heroo
items.armor.warriorarmor.desc=Portante tiun ĉi pezan platetan defendaĵon, Batalisto povas uzi specialan kapablon.



###artifacts
items.artifacts.alchemiststoolkit.name=alĥemia ilaro
items.artifacts.alchemiststoolkit.ac_brew=KUIRI
items.artifacts.alchemiststoolkit.ac_energize=ENERGIIZI
items.artifacts.alchemiststoolkit.not_ready=Via ilaro ankoraŭ ne varmiĝis.
items.artifacts.alchemiststoolkit.cursed=Malbenita ilaro malebligas al vi uzi alĥemion!
items.artifacts.alchemiststoolkit.need_energy=Necesas havi almenaŭ 6 poentojn da energio por energiizi la ilaron.
items.artifacts.alchemiststoolkit.energize_desc=Ĉiuj 6 kristaloj de energio ŝargas la alĥemian ilaron per sufiĉe da energio por pliigi ĝian nivelon. Ju pli alta nivelo de ilaro, des pli rapide ĝi generas energion kaj varmiĝas.\n\nKiom da energio vi volas uzi?
items.artifacts.alchemiststoolkit.energize_1=6 da energio: +1 nivelo
items.artifacts.alchemiststoolkit.energize_all=%1$d da energio: +%2$d niveloj
items.artifacts.alchemiststoolkit.desc=Tiu ĉi ilaro enhavas kelkajn reakciilojn kaj herbojn kune kun malgranda provtubo por prepari eliksirojn ie ajn vi estas. La provtubo ŝajnas enhavi kristalojn de alĥemio en likva formo.
items.artifacts.alchemiststoolkit.desc_cursed=La malbenita ilaro alteniiĝis al vi kaj melebligas al vi uzi alĥemion.
items.artifacts.alchemiststoolkit.desc_warming=La ilaro nuntempe varmiĝas kaj estos preta baldaŭ.
items.artifacts.alchemiststoolkit.desc_hint=La surmetita ilaro iom post iom liveras alĥemian energion dum kiam vi akiras sperton. Ŝajnas, ke la solvaĵo en la provtubo povas esti plipovigita per aldoni al ĝi kristalojn de energio.

items.artifacts.artifact.cannot_wear_two=Vi ne povas surmeti du samajn antikvaĵojn.
items.artifacts.artifact.equip_cursed=La antikvaĵo dolore ligas sin al vi.
items.artifacts.artifact.curse_known=Vi povas senti malican magion en la antikvaĵo.
items.artifacts.artifact.not_cursed=Tiu ĉi antikvaĵo estas libera de fia magio.
items.artifacts.artifact.need_to_equip=Vi devas surmeti vian antikvaĵon por fari tion.

items.artifacts.capeofthorns.name=pelerino de dornoj
items.artifacts.capeofthorns.desc=Tiuj ĉi disigitaj pecoj da metalo de DM-300 kuniĝis formante rigidan pelerinon. Ĝi ŝajne entenas profundan energion, eble ĝi havas kelkan povon de DM-300?
items.artifacts.capeofthorns.desc_inactive=La pelerino ŝajnas tre peza sur viaj ŝultroj, ĝi verŝajne gajnas energion de vundoj, kiujn vi ricevas.
items.artifacts.capeofthorns.desc_active=La pelerino ŝajnas ellasi konservitan energion, ĝi radias ŝirmantan povon.
items.artifacts.capeofthorns$thorns.inert=Via pelerino iĝis neaktiva denove.
items.artifacts.capeofthorns$thorns.radiating=Via pelerino komenciĝis radii energion, vi sentiĝas protektata!
items.artifacts.capeofthorns$thorns.levelup=Via pelerino iĝas pli forta!
items.artifacts.capeofthorns$thorns.name=dornado
items.artifacts.capeofthorns$thorns.desc=Via pelerino radias energion ĉirkaŭante vin en kampo de deviiganta forto!\nĈiuj ricevataj vundoj estas reduktataj kiam la efiko de dornoj agas. Krom tio, se atakanto estas fronte de vi, reduktitaj vundoj reiras al la atakanto.\n\nPliaj temperoj de dornado: %s.

items.artifacts.chaliceofblood.name=kaliko de sango
items.artifacts.chaliceofblood.ac_prick=PIKIĜI
items.artifacts.chaliceofblood.yes=Jes, mi certas pri tio
items.artifacts.chaliceofblood.no=Ne, mi ŝanĝis mian volon
items.artifacts.chaliceofblood.prick_warn=Ĉiufoje kiam vi uzas la kalikon, ĝi elsuĉos pli da via vivenergio, sed kompense pro tio ĝi estontece pliigos vian naturan replenadon de sano.\n\nLa sekva pikiĝo kaŭzos _%1$d-%2$d vundpoentojn_, sed tiu ĉi vundo povas esti etigita de _korpa kaj magia ŝirmo, kaj aliaj vund-etigantaj efikoj._ Sen konsideri vund-etigantaj efikoj, la sekva pikiĝo havas _%3$s%% ŝancon_ por plene elsuĉi vian vivenergion.\n\nĈu vi certe volas oferi al la kaliko pli da via vivenergio?
items.artifacts.chaliceofblood.onprick=Vi pikis vin kaj via esenco de vivo fluas en la kalikon.
items.artifacts.chaliceofblood.ondeath=La kaliko elsuĉis el vi ĉiun esencon de vivo…
items.artifacts.chaliceofblood.desc=Tiu ĉi brileta arĝenta kaliko estas kurioze ornamita per akraj juvelŝtonoj ĉe rando.
items.artifacts.chaliceofblood.desc_cursed=La malbenita kaliko alteniĝis al via mano kaj melebligas al vi resanigi.
items.artifacts.chaliceofblood.desc_1=Kiam vi tenas kalikon, vi sentas kuriozan emon por piki vin per akraj juvelŝtonoj.
items.artifacts.chaliceofblood.desc_2=Iom da via sango estas verŝita en la kalikon, vi subtile sentas, ke la kaliko nutras vin per vivenergio, pliigante vian naturan replenadon de sano.. Vi plue volas piki vin per la kaliko, malgraŭ konscio, ke tio ĉi vin doloros.
items.artifacts.chaliceofblood.desc_3=La kaliko estas plenigita ĝis la rando per via esenco de vivo. Vi sentas, ke la kaliko verŝas vivenergion en vin.

items.artifacts.cloakofshadows.name=mantelo de ombroj
items.artifacts.cloakofshadows.ac_stealth=KAŜIĜI
items.artifacts.cloakofshadows.cooldown=Via mantelo bezonas %d temperojn por reenergiĝi.
items.artifacts.cloakofshadows.cursed=Vi ne povas uzi malbenitan mantelon.
items.artifacts.cloakofshadows.no_charge=Via mantelo ankoraŭ ne ŝargiĝis sufiĉe por esti uzebla.
items.artifacts.cloakofshadows.desc=Altvalorega magia mantelo ŝtelita el reĝa armilejo antaŭ multaj jaroj de Fripono. Kiam vestita, ĝi povas esti uzebla por iĝi tute nevidebla por mallonga tempo.\n\nJu pli la mantelo estas uzata, des pli potenca ĝi iĝos, ebligante al Fripono esti nevidebla por pli ofte kaj pli longe.
items.artifacts.cloakofshadows.discover_hint=Iu el la herooj komencas kun tiu aĵo.
items.artifacts.cloakofshadows$cloakstealth.no_charge=Via mantelo eluzis ĉiun energion.
items.artifacts.cloakofshadows$cloakstealth.levelup=Via mantelo iĝas pli pova!
items.artifacts.cloakofshadows$cloakstealth.name=maskita
items.artifacts.cloakofshadows$cloakstealth.desc=Via mantelo de ombroj ebligas al vi esti nevidebla kiam vi vestas ĝin. Vi restos maskita ĝis vi ĉesigos la efikon aŭ ĝis mankos energio al la mantelo.\n\nKiam vi estas nevidebla, monstroj ne povas ataki kaj spuri vin. Korpaj atakoj kaj uzo de magio (kiel skribrulaĵoj kaj vergoj) tuje ĉesigos nevideblecon.\n\nEnergio sufiĉos por %d temperoj.

items.artifacts.driedrose.name=sekigita rozo
items.artifacts.driedrose.ac_summon=ALVOKI
items.artifacts.driedrose.ac_direct=DIREKTI
items.artifacts.driedrose.ac_outfit=ARMI
items.artifacts.driedrose.spawned=Vi jam alvokis la fantominon.
items.artifacts.driedrose.no_charge=Via rozo ankoraŭ ne ŝargiĝis.
items.artifacts.driedrose.cursed=Vi ne povas uzi malbenitan rozon.
items.artifacts.driedrose.no_space=Libera loko mankas apud vi.
items.artifacts.driedrose.charged=Via rozo ŝargiĝis!
items.artifacts.driedrose.desc=Ĉu ĝi estas la rozo menciita de la fantomino antaŭ ol ŝi malaperis? Ĝi ŝajnas enteni ian spiritan povon, eble oni povas uzi ĝin por alidirekti energion de tiu perdita heroino.
items.artifacts.driedrose.desc_no_quest=Sekigita rozo kiu iumaniere kunteniĝas malgraŭ ĝia aĝo.\n\nĜi verŝajne posedas iom da spirita povo, sed vi ne havas ideon pri kiel uzi ĝin nun.
items.artifacts.driedrose.desc_hint=Ŝajnas, ke ĝi perdis kelkajn florfolietojn. Eble realdono de ili plifortigos la rozon.
items.artifacts.driedrose.desc_cursed=La malbenita rozo alteniĝis al via mano, ĝi ŝajnas terure malvarma.
items.artifacts.driedrose.desc_weapon=Armilo de fantomino: %s
items.artifacts.driedrose.desc_armor=Defendaĵo de fantomino: %s
items.artifacts.driedrose.desc_strength=Povo de fantomino: %s
items.artifacts.driedrose$petal.name=sekigita florfolieto
items.artifacts.driedrose$petal.no_rose=Vi ne havas rozon por kiun aldoni tiun ĉi florfolieton.
items.artifacts.driedrose$petal.no_room=Mankas spaco por tiu ĉi florfolieto, do vi ĝin forĵetas.
items.artifacts.driedrose$petal.maxlevel=La rozo estas kompleta!
items.artifacts.driedrose$petal.levelup=Vi aldonis florfolieton al la rozo.
items.artifacts.driedrose$petal.desc=Delikata sekigita florfolieto, kiu iel transdaŭris ĝin nun en la labirinto.
items.artifacts.driedrose$wndghosthero.title=Fantomina armaĵo
items.artifacts.driedrose$wndghosthero.desc=La fantomino estas malforta mem, tamen ŝi estas sufiĉe korpa por surmeti armilon aŭ defendaĵon. Ŝi povas uzi tiujn ĉi armaĵojn same kiel vi.\n\nLa fantomino povas nune surmeti armaĵojn postulatajn maksimume _%d da povo._
items.artifacts.driedrose$wndghosthero.weapon_prompt=Elektu armilon
items.artifacts.driedrose$wndghosthero.armor_prompt=Elektu defendaĵon
items.artifacts.driedrose$wndghosthero.cant_unique=La fantomino ne povas uzi unikajn aĵojn.
items.artifacts.driedrose$wndghosthero.cant_cursed=La fantomino povas uzi nur aĵojn, pri kiuj vi certas, ke ili ne estas malbenitaj.
items.artifacts.driedrose$wndghosthero.cant_strength_unknown=La fantomino povas ne estas sufiĉe forta por uzi tion ĉi.
items.artifacts.driedrose$wndghosthero.cant_strength=La fantomino ne estas sufiĉe forta por uzi tion ĉi.

##ghost hero
items.artifacts.driedrose$ghosthero.name=trista fantomino
items.artifacts.driedrose$ghosthero.def_verb=evitite
items.artifacts.driedrose$ghosthero.discover_hint=Vi povas renkonti tiun ulon uzante la specifan antikvaĵon.

items.artifacts.driedrose$ghosthero.hello=Saluton ree %s.
items.artifacts.driedrose$ghosthero.introduce=Mia animo estas kunigita al tiu ĉi rozo, ĝi estas tre grava por mi, donaco de mia amato, kiun mi lasis en la supraĵo.\n\nMi ne povas reveni al li, tamen dank' al ci, mi havas alian ŝancon por plenumi mian vojaĝon. Kiam mi povos, mi respondos al cia alvoko kaj batalos kun ci.\n\nTiel longe, kiel ci havas la rozon, mi povas aŭdi cian voĉon, do ci povas uzi ĝin por direkti min.\n\nEspereble ci sukcesos tie, kie mi malvenkis…

items.artifacts.driedrose$ghosthero.dialogue_sewers_1=Tiu ĉi kloakaro kutimis esti tiel sekura, ke eĉ homoj loĝis tie ĉi vintre.
items.artifacts.driedrose$ghosthero.dialogue_sewers_2=Mi pripensas kio okazis al patroloj, ĉu ili kapitulacis?
items.artifacts.driedrose$ghosthero.dialogue_sewers_3=Mi havis familion en la supraĵo, mi esperas ke ili estas sekuraj.
items.artifacts.driedrose$ghosthero.dialogue_sewers_4=La gardistoj fiaskis venki tiujn monstrojn, sed eble ni povas.
items.artifacts.driedrose$ghosthero.dialogue_sewers_5=Se eĉ la kloakaro ne estas sekura, mi scivolas pri kio estas sube…
items.artifacts.driedrose$ghosthero.dialogue_sewers_6=Kio igis tiujn ĉi ratojn kaj krabojn kreski tiel grande?
items.artifacts.driedrose$ghosthero.dialogue_prison_1=Mi aŭskultis rakontojn pri tiu ĉi loko, terurajn rakontojn.
items.artifacts.driedrose$ghosthero.dialogue_prison_2=Tiu ĉi loko pli similas al kelaro ol al malliberejo.
items.artifacts.driedrose$ghosthero.dialogue_prison_3=Mi ne povas imagi kion okazis kiam tiu ĉi loko estis forlasita.
items.artifacts.driedrose$ghosthero.dialogue_prison_4=Ŝajnas, ke ambaŭ gardistoj kaj malliberuloj ŝanĝiĝis al monstroj.
items.artifacts.driedrose$ghosthero.dialogue_prison_5=Kio respondumas pri tiuj ĉi skeletoj?
items.artifacts.driedrose$ghosthero.dialogue_prison_6=Tiuj ĉi homoj ne devis fini tiel…
items.artifacts.driedrose$ghosthero.dialogue_caves_1=Neniu homo aŭ gnomo gastis tie ĉi de longa tempo.
items.artifacts.driedrose$ghosthero.dialogue_caves_2=Kio kaŭzis al la gnomoj forlasi la orminejon?
items.artifacts.driedrose$ghosthero.dialogue_caves_3=Domaĝe, ke ĉiu “oro” tie ĉi senvaloras en la supraĵo.
items.artifacts.driedrose$ghosthero.dialogue_caves_4=Kreaĵoj tie ĉi estas same degenerintaj kiel tiuj en la kloakaro.
items.artifacts.driedrose$ghosthero.dialogue_caves_5=Eĉ vespertoj estas sangavidaj tie ĉi.
items.artifacts.driedrose$ghosthero.dialogue_caves_6=Neniu postsigno de mina ekipaĵo, ĉu gnomoj reprenis ĉion?
items.artifacts.driedrose$ghosthero.dialogue_city_1=Gnomoj estis laboremaj, sed ankaŭ avidaj.
items.artifacts.driedrose$ghosthero.dialogue_city_2=Do la metropolo de gnomoj vere dekadencis.
items.artifacts.driedrose$ghosthero.dialogue_city_3=Mi esperas, ke en la supraĵo neniam estos kiel tie ĉi.
items.artifacts.driedrose$ghosthero.dialogue_city_4=Vizaĝoj de gnomoj kutime ne estas tiel palaj.
items.artifacts.driedrose$ghosthero.dialogue_city_5=Kio estas pli terura: ĉu gnomoj, ĉu liaj kreaĵoj?
items.artifacts.driedrose$ghosthero.dialogue_city_6=Ŝajnas, ke gnomoj ankaŭ estas senpripensaj monstroj.
items.artifacts.driedrose$ghosthero.dialogue_halls_1=Kio estas tiu ĉi loko?
items.artifacts.driedrose$ghosthero.dialogue_halls_2=Tiu ĉi loko estas terura…
items.artifacts.driedrose$ghosthero.dialogue_halls_3=Pri kio gnomoj pensis, kiam ili ludis kun tia potenco?
items.artifacts.driedrose$ghosthero.dialogue_halls_4=Monstroj tie ĉi estas tiel neteraj, de kie ili devenas?
items.artifacts.driedrose$ghosthero.dialogue_halls_5=Ĉu vi sentas ĝin? Ŝajnas, ke io observas nin.
items.artifacts.driedrose$ghosthero.dialogue_halls_6=Dank' al Dio por torĉoj – estas tiel mallume tie ĉi!
items.artifacts.driedrose$ghosthero.dialogue_ascension_1=Kial tio ĉi okazas? Mi pensis, ke ni sukcesis.
items.artifacts.driedrose$ghosthero.dialogue_ascension_2=Kiel tiu ĉi fiaĵo plue povas influi tiun ĉi mondon?
items.artifacts.driedrose$ghosthero.dialogue_ascension_3=Mi esperas, ke ci scias kion ci faras kun tiu ĉi amuleto.
items.artifacts.driedrose$ghosthero.dialogue_ascension_4=Mi supozas, ke tio ĉi ankoraŭ ne estas fino.
items.artifacts.driedrose$ghosthero.dialogue_ascension_5=Ni atingis tiel multe, ni povas sukcesi!
items.artifacts.driedrose$ghosthero.dialogue_ascension_6=Apenaŭ kelkaj paŝoj, ni devas eskapi tiun ĉi ejon!

items.artifacts.driedrose$ghosthero.seen_goo_1=Gardu cin kontraŭ la Ŝmiraĵego!
items.artifacts.driedrose$ghosthero.seen_goo_2=Multe da miaj amikoj mortis pro tiu ĉi aĉaĵo, jam temp' está por venĝo!
items.artifacts.driedrose$ghosthero.seen_goo_3=Tia fibesto ne estu viva!
items.artifacts.driedrose$ghosthero.seen_tengu_1=La ununura ŝlosita malliberulo estas minaca kaŝmortigisto…
items.artifacts.driedrose$ghosthero.seen_tengu_2=Li malliberigis nin!
items.artifacts.driedrose$ghosthero.seen_tengu_3=Mi aŭskultis timigajn rakontojn pri tiu masko…
items.artifacts.driedrose$ghosthero.seen_dm300_1=Nur gnomoj povis konstrui minan maŝinon, kiu mortigas entrudulojn.
items.artifacts.driedrose$ghosthero.seen_dm300_2=Tio ĉi estas giganta…
items.artifacts.driedrose$ghosthero.seen_dm300_3=Kiamaniere ĝi restis aktiva por tiom da tempo?
items.artifacts.driedrose$ghosthero.seen_king_1=Oni diras, ke “regado koruptas”, jen ekzemplo de tio.
items.artifacts.driedrose$ghosthero.seen_king_2=Li pli estas kadavro ol reĝo nun.
items.artifacts.driedrose$ghosthero.seen_king_3=Eĉ post morto gnomoj obeas sian estron.
items.artifacts.driedrose$ghosthero.seen_yog_1=Ho ve, tio ĉi ne aspektas bele.
items.artifacts.driedrose$ghosthero.seen_yog_2=Do tiel aspektas antikva dio?
items.artifacts.driedrose$ghosthero.seen_yog_3=Tio ĉi doloros…

items.artifacts.driedrose$ghosthero.defeated_by_enemy_1=Bonŝancon al ci…
items.artifacts.driedrose$ghosthero.defeated_by_enemy_2=Mi estas laca… portempe…
items.artifacts.driedrose$ghosthero.defeated_by_enemy_3=Mi revenos
items.artifacts.driedrose$ghosthero.defeated_by_boss_1=Mi pardonpetas… tenu vin forte…
items.artifacts.driedrose$ghosthero.defeated_by_boss_2=Venku ĝin… sen mia helpo…
items.artifacts.driedrose$ghosthero.defeated_by_boss_3=Ne… mi ne povas plu elteni…
items.artifacts.driedrose$ghosthero.blessed_ankh_1=Kiel ci travivis tion?
items.artifacts.driedrose$ghosthero.blessed_ankh_2=Mi ankaŭ volus ĝin…
items.artifacts.driedrose$ghosthero.blessed_ankh_3=Ho! Ci plue vivas!
items.artifacts.driedrose$ghosthero.player_killed_1=Ho ve!…
items.artifacts.driedrose$ghosthero.player_killed_2=Domaĝe mi ne povis helpi…
items.artifacts.driedrose$ghosthero.player_killed_3=Tio ne povas okazi!

items.artifacts.driedrose$ghosthero.direct_prompt=Kion mi faru?
items.artifacts.driedrose$ghosthero.directed_follow_1=Bone, mi sekvos cin.
items.artifacts.driedrose$ghosthero.directed_follow_2=Mi estos tuj malantaŭ ci.
items.artifacts.driedrose$ghosthero.directed_follow_3=Sekvante cin…
items.artifacts.driedrose$ghosthero.directed_follow_4=Ni iru!
items.artifacts.driedrose$ghosthero.directed_follow_5=Mi kovros cian malantaŭon.
items.artifacts.driedrose$ghosthero.directed_attack_1=En ordo, mi atakos ĝin.
items.artifacts.driedrose$ghosthero.directed_attack_2=Mi okupos ĝin.
items.artifacts.driedrose$ghosthero.directed_attack_3=Ĝi mortu!
items.artifacts.driedrose$ghosthero.directed_attack_4=Al la armiloj!
items.artifacts.driedrose$ghosthero.directed_attack_5=Ni ataku!
items.artifacts.driedrose$ghosthero.directed_position_1=En ordo, mi tenos la pozicion.
items.artifacts.driedrose$ghosthero.directed_position_2=Mi restos tie kaj defendos cin.
items.artifacts.driedrose$ghosthero.directed_position_3=Ŝanĝante pozicion…
items.artifacts.driedrose$ghosthero.directed_position_4=Mi alvenas!
items.artifacts.driedrose$ghosthero.directed_position_5=Mi iros tien.

items.artifacts.driedrose$ghosthero.desc=Delikate aspektanta spirita aperaĵo kun homeca formo. Ŝia povo ŝajnas kunligita al la rozo, kiun vi posedas.\n\nTiu ĉi fantomino ne grandsignifas, kvankam ŝi estas via ununura amiko tie ĉi subtere.

##back to artifacts
items.artifacts.etherealchains.name=ĉielaj katenoj
items.artifacts.etherealchains.ac_cast=SURĴETI
items.artifacts.etherealchains.rooted=Viaj katenoj ne povas altiri vin, kiam vi estas enradikigita.
items.artifacts.etherealchains.no_charge=Viaj katenoj ne havas sufiĉe da ŝargoj.
items.artifacts.etherealchains.cursed=Vi ne povas uzi malbenitajn katenojn.
items.artifacts.etherealchains.does_nothing=Tio ĉi faros nenion.
items.artifacts.etherealchains.cant_pull=Viaj katenoj ne povas altiri tiun ĉi celon.
items.artifacts.etherealchains.cant_reach=Viaj katenoj ne povas atingi tien.
items.artifacts.etherealchains.inside_wall=Viaj katenoj nur povas altiri vin tra muroj, ne ene ilin.
items.artifacts.etherealchains.nothing_to_grab=Tie ĉi estas nenio por altiri.
items.artifacts.etherealchains.prompt=Elektu kien surĵeti.
items.artifacts.etherealchains.desc=Tiuj ĉi grandaj tamen malpezaj katenoj ardas per ĉiela energio. Ili povas esti uzataj por altiri vin al muroj, aŭ por altiri monstrojn al vi. La ĉiela naturo de katenoj eĉ ebligas al ili etendi trans muroj!
items.artifacts.etherealchains.desc_cursed=La malbenitaj katenoj alkroĉiĝis al vi kaj senĉese ĵetiĝas ĉirkaŭe provante vin faligi aŭ ĉirkaŭligi.
items.artifacts.etherealchains.desc_equipped=Katenoj pendas ĉe vi, malrapide elŝutante spiritan energion de viaj mortigitoj. Ĉiu ŝargo estas ĉenero en katenoj, kiu etendiĝos por precize unu kahelo.
items.artifacts.etherealchains$chainsrecharge.levelup=Viaj katenoj iĝas pli povaj!

items.artifacts.holytome.name=sankta librego
items.artifacts.holytome.ac_cast=UZI
items.artifacts.holytome.no_spell=Vi nun ne povas ĵeti tiun ĉi sorĉon.
items.artifacts.holytome.cursed=Vi ne povas uzi malbenitan libregon.
items.artifacts.holytome.levelup=Via librego iĝas pli pova!
items.artifacts.holytome.desc=Sankta librego, kiu agas per enfokusigi diecan magion de Kleriko. Uzante la libregon Kleriko povas ĵeti diversajn magiajn sorĉojn.\n\nLa librego iĝos pli potenca kun uzi ĝin de Kleriko, akirante pliajn maksimumajn ŝargojn kaj ete pliigante reŝargan rapidon.
items.artifacts.holytome.discover_hint=Iu el la herooj komencas kun tiu aĵo.

items.artifacts.hornofplenty.name=korno de abundo
items.artifacts.hornofplenty.ac_snack=MANĜETI
items.artifacts.hornofplenty.ac_eat=MANĜI
items.artifacts.hornofplenty.ac_store=ENMETI
items.artifacts.hornofplenty.eat=Vi manĝis el la korno.
items.artifacts.hornofplenty.prompt=Elektu manĝaĵon
items.artifacts.hornofplenty.no_food=Via korno enhavas nenion por manĝi!
items.artifacts.hornofplenty.full=Via korno estas plena je manĝo!
items.artifacts.hornofplenty.reject=Via korno forĵetas nekuiritan naŭzfrukton.
items.artifacts.hornofplenty.maxlevel=Via korno estas plenigita per manĝaĵo!
items.artifacts.hornofplenty.levelup=La korno ensorbis manĝaĵon oferitan de vi kaj ĝia povo pliiĝas!
items.artifacts.hornofplenty.feed=La korno ensorbis manĝaĵon oferitan de vi.
items.artifacts.hornofplenty.desc=Oni ne povas blovi en tiun ĉi kornon, tamen ĝi ŝajnas pleniĝi per manĝaĵo dum kiam vi aventuras kaj gajnas sperton. Vi povas manĝeti malgrandan porcion aŭ manĝi tiom, por ke esti plene sata.
items.artifacts.hornofplenty.desc_hint=Eble oni povas pliigi povon de korno enigante al ĝi manĝan energion.
items.artifacts.hornofplenty.desc_cursed=La malbenita korno alteniĝis al vi kaj ĝi emas manĝaĵon preni ol doni.

items.artifacts.lloydsbeacon.name=markilo de Lloyd
items.artifacts.lloydsbeacon.ac_zap=PAFI
items.artifacts.lloydsbeacon.ac_set=LOKI
items.artifacts.lloydsbeacon.ac_return=REVENI
items.artifacts.lloydsbeacon.no_charge=Via markilo ne havas sufiĉe da energio nun.
items.artifacts.lloydsbeacon.tele_fail=Teleportanta magio malsukcesis.
items.artifacts.lloydsbeacon.prompt=Elektu kien pafi.
items.artifacts.lloydsbeacon.levelup=Via markilo iĝas pli pova!
items.artifacts.lloydsbeacon.preventing=Fortega magia etoso de tiu ĉi ejo malebligas al vi uzi markilon de Lloyd!
items.artifacts.lloydsbeacon.creatures=Magia etoso de proksimaj bestaĉoj malebligas al vi uzi markilon de Lloyd tiumomente.
items.artifacts.lloydsbeacon.return=La markilo de Lloyd estas sukcese agordita la tiu ĉi loko, de nun vi ĉiam povos reveni tien ĉi.
items.artifacts.lloydsbeacon.desc=Markilo de Lloyd estas komplika magia aparato kiu donas al posedanto povon de teleportanta magio. La markilo povas esti uzita por reveni al agordita loko, kaj ĝi ankaŭ pafas hazarde-teleportantajn magiaĵojn kiam ĝi estas surmetita. Tiu ĉi magio povas esti direktita al celo aŭ al uzanto mem.
items.artifacts.lloydsbeacon.desc_set=Markilo estas agordita ie en la %d-a keletaĝo de la labirinto.

items.artifacts.masterthievesarmband.name=brakbendo de ĉefŝtelisto
items.artifacts.masterthievesarmband.ac_steal=ŜTELI
items.artifacts.masterthievesarmband.no_charge=Via brakbendo ne ŝargiĝis sufiĉe.
items.artifacts.masterthievesarmband.cursed=Vi ne povas uzi malbenitan brakbendon.
items.artifacts.masterthievesarmband.full=Via brakbendo ŝargiĝis!
items.artifacts.masterthievesarmband.prompt=Elektu malamikon por priŝteli
items.artifacts.masterthievesarmband.no_target=Vi devas elekti malamikon apud vi.
items.artifacts.masterthievesarmband.steal_shopkeeper=Vi ne povas senpere priŝteli la komerciston.
items.artifacts.masterthievesarmband.no_steal=Tiu ĉi malamiko havas nenion ŝteleblan.
items.artifacts.masterthievesarmband.stole_item=Vi ŝtelis aĵon: %s.
items.artifacts.masterthievesarmband.failed_steal=Vi fiaskis ŝteli ion ajn.
items.artifacts.masterthievesarmband.level_up=Via brakbendo iĝas pli pova!
items.artifacts.masterthievesarmband.desc=Tiu ĉi purpura velura brakbendo posedas markon de la ĉefŝtelisto. Ĝi ne apartenas al vi, tamen ĝi ankaŭ probable ne apartenis al ĝia eksa uzanto.
items.artifacts.masterthievesarmband.desc_cursed=Malbenita brakbendo alteniĝis al via brako kaj iel via saketo kun oro iom post iom malpeziĝas…
items.artifacts.masterthievesarmband.desc_worn=Vi sentas, ke energio plenigas la brakbendon sur via manartiko dum kiam vi gajnas sperton. Tiu ĉi energio ebligas al vi ŝteli el vendejoj aŭ prirabi monstrojn!\n\nPrirabado de kontraŭuloj estas tuja, la viktimo iĝos konfuzita kaj ebligos al vi gajni rabaĵon! La brakbendo estas pli efika kontraŭ surprizitaj malamikoj. Prirabi la saman kontraŭulon plurfoje ne pliigas la ŝancon por akiri rabaĵon.

items.artifacts.sandalsofnature.name=sandaloj de naturo
items.artifacts.sandalsofnature.name_1=ŝuoj de naturo
items.artifacts.sandalsofnature.name_2=botetoj de naturo
items.artifacts.sandalsofnature.name_3=botoj de naturo
items.artifacts.sandalsofnature.ac_feed=NUTRI
items.artifacts.sandalsofnature.ac_root=RADIKI
items.artifacts.sandalsofnature.prompt=Elektu semon
items.artifacts.sandalsofnature.levelup=Via piedvestaĵo pligrandiĝas!
items.artifacts.sandalsofnature.absorb_seed=Via piedvestaĵo ensorbis semon, ĝi aspektas pli sane.
items.artifacts.sandalsofnature.no_effect=Vi unue devas nutri vian piedvestaĵon per semo.
items.artifacts.sandalsofnature.low_charge=Via piedvestaĵo ne ŝargiĝis sufiĉe.
items.artifacts.sandalsofnature.prompt_target=Elektu lokon
items.artifacts.sandalsofnature.out_of_range=Tiu loko estas ekster atingo.
items.artifacts.sandalsofnature.desc_1=Je unua rigardo ili aspektas kiel plektitaj sandaloj, sed ververe estas du vegetaĵoj! Ili aspektas tre malforte kaj pale, eble ili bezonas nutradon?
items.artifacts.sandalsofnature.desc_2=La piedvestaĵo kreskis kaj nun pli similas al du almezuritaj ŝuoj. Ili reakiris iomete da koloroj, eble ili povas kreski pli?
items.artifacts.sandalsofnature.desc_3=Vegetaĵoj kreskis pli kaj nun ili aspektas kiel paro da firmaj botoj faritaj el tanita felo. La vegetaĵoj reakiris sian malmolecon, tamen eble ili povas kreski pli?
items.artifacts.sandalsofnature.desc_4=Vegetaĵoj atingis sian maksimuman grandon, ili aspektas kiel paro da firmaj botoj. La botoj estas brunaj kaj similas tre fortikajn arbojn.
items.artifacts.sandalsofnature.desc_hint=Vi sentas vin pli interligita kun naturo, kiam vi portas tiun ĉi antikvaĵon.
items.artifacts.sandalsofnature.desc_cursed=La malbenitaj sandaloj malhelpas al vi ĉiun interligon kun naturo.
items.artifacts.sandalsofnature.desc_ability=La piedvestaĵo subtile briletas per koloro de la lasta absorbita semo. Ili povas por mallonga tempo enradikiĝi kaj krei vegetaĵan efikon ie ajn en la radiuso de 3 kaheloj.\nSemo: _%s_\nPostulataj ŝargoj: _%d%%_
items.artifacts.sandalsofnature.desc_seeds=Vi nutris la piedvestaĵon per %d semoj.

items.artifacts.skeletonkey.name=skeleta ŝlosilo
items.artifacts.skeletonkey.ac_insert=ENMETI
items.artifacts.skeletonkey.cursed=Vi ne povas uzi malbenitan skeletan ŝlosilon.
items.artifacts.skeletonkey.prompt=Elektu celon
items.artifacts.skeletonkey.invalid_target=Tie estas nenio por ŝlosi aŭ malŝlosi.
items.artifacts.skeletonkey.lock_no_space=Vi ne povas bloki ulon ene pordo!
items.artifacts.skeletonkey.iron_charges=1 ŝargo necesas por malŝlosi norman seruron.
items.artifacts.skeletonkey.gold_charges=2 ŝargoj necesas por malŝlosi oran seruron.
items.artifacts.skeletonkey.lock_charges=2 ŝargoj necesas por ŝlosi pordon.
items.artifacts.skeletonkey.wall_charges=2 ŝargoj necesas por krei portempan muron.
items.artifacts.skeletonkey.crystal_charges=5 ŝargoj necesas por malŝlosi kristalan seruron.
items.artifacts.skeletonkey.wont_open=La ŝlosilo iel rifuzas malŝlosi tiun ĉi seruron.
items.artifacts.skeletonkey.locked_with_key=Tiu pordo estas ŝlosita per via skeleta ŝlosilo.
items.artifacts.skeletonkey.force_lock=La seruro malfortiĝis sen uzi vian skeletan ŝlosilon. Vi sukcese malfermis ĝin.
items.artifacts.skeletonkey.discard=Vi forĵetis malnecesajn ŝlosilojn.
items.artifacts.skeletonkey.levelup=Via skeleta ŝlosilo iĝas pli pova!
items.artifacts.skeletonkey.desc=Impone aspektanta ŝlosilo kun kapo en la formo de kranio. Ĝiaj randodentoj ŝajnas ŝanĝiĝi ĉiufoje, kiam vi rigardas ilin.
items.artifacts.skeletonkey.desc_worn=Tiu ĉi magia ŝlosilo ŝajnas plipoviĝi dum uzado, malsame al kutimaj ŝlosiloj de la labirinto. Vi povas enigi ĝin al preskaŭ ĉiu seruro por ŝlosi aŭ malŝlosi ĝin, inkluzivante pordojn, kiuj ne estis ŝlositaj antaŭe.\n\nTiu ĉi ŝlosilo eĉ povas esti uzita sur malplena spaco vertikale, horizontale aŭ diagonale por “ŝlosi” aeron apud vi, formigante 3-kahelan muron, kiu daŭros por 10 temperoj. Dum ŝlosi, kontraŭuloj estos forpuŝitaj (se estos spaco).
items.artifacts.skeletonkey.desc_cursed=La malbenita skeleta ŝlosilo ŝajnas malkongrui kun ĉiu seruro, kaj eĉ malhelpas (sed ne malebligas) uzi viajn aliajn ŝlosilojn.
items.artifacts.skeletonkey$keywall.desc=Portempa magia muro estas starigita tie ĉi kun uzo de via skeleta ŝlosilo.

items.artifacts.talismanofforesight.name=talismano de prudento
items.artifacts.talismanofforesight.ac_scry=RIGARDI
items.artifacts.talismanofforesight.low_charge=La talismano estu ŝargita almenaŭ en 5% por rigardi.
items.artifacts.talismanofforesight.prompt=Elektu kien rigardi.
items.artifacts.talismanofforesight.levelup=Via talismano iĝas pli forta!
items.artifacts.talismanofforesight.full_charge=Via talismano estas plene ŝargita!
items.artifacts.talismanofforesight.desc=Glata ŝtono kun strangaj gravuraĵoj sur ĝi. Vi sentas, ke supozeble ĝi observas ĉion ĉirkaŭ vi kaj atentas pri ĉiuj kaŝaĵoj.
items.artifacts.talismanofforesight.desc_worn=Kiam vi tenas la talismanon, vi sentas. ke viaj sensoj iĝas pli akraj. La talismano malrapidete ŝargiĝas laŭ tempo kaj dum kiam vi malkovras kaŝitajn pordojn kaj kaptilojn.\n\nEblas uzi ŝargon de la talismano por “rigardi” en la konusformo por malkovri ĉiujn kahelojn kaj sekretojn en la rigardita areo; kaj la talismano ebligos al vi antaŭrigardi valoraĵojn kaj kontraŭulojn por mallonga tempo.
items.artifacts.talismanofforesight.desc_cursed=La malbenita talismano senĉese rigardaĉas vin, malakrigante viajn sensojn.
items.artifacts.talismanofforesight$foresight.name=prudento
items.artifacts.talismanofforesight$foresight.uneasy=Vi sentiĝas malcerte.
items.artifacts.talismanofforesight$foresight.desc=Vi sentiĝas tre maltrankvile, ĉar ie proksime troviĝas nevidebla danĝero.

items.artifacts.timekeepershourglass.name=sablohorloĝo de Tempestro
items.artifacts.timekeepershourglass.ac_activate=AKTIVIGI
items.artifacts.timekeepershourglass.deactivate=Vi malhaltigis la tempon.
items.artifacts.timekeepershourglass.no_charge=Via sablohorloĝo ankoraŭ ne ŝargiĝis sufiĉe por esti uzebla.
items.artifacts.timekeepershourglass.cursed=Vi ne povas uzi malbenitan sablohorloĝon.
items.artifacts.timekeepershourglass.onstasis=La mondo ĉirkaŭ vi ŝanĝiĝis dum unu momento.
items.artifacts.timekeepershourglass.onfreeze=Ĉio ĉirkaŭ vi haltis tuj.
items.artifacts.timekeepershourglass.stasis=Dormegiĝi
items.artifacts.timekeepershourglass.freeze=Haltigi tempon ĉirkaŭe
items.artifacts.timekeepershourglass.prompt=Kiel vi volas uzi magion de la sablohorloĝo?\n\nDum dormego, tempo pasos norme kaj vi estos senmova kaj tute neatakebla, tio ĉi uzas po 2 ŝargoj per unu fojo.\n\nKiam tempo estas haltigita, vi povos movi kaj viaj agoj ne daŭros tempon. Tio ĉi povas esti malaktivigita je ĉiu tempo per uzo de sablohorloĝo aŭ atako.
items.artifacts.timekeepershourglass.desc=Tiu ĉi granda ornamita sablohorloĝo aspektas nerimarkinde, sed vi sentas masivan energion en ĝia zorge skulptita kadro. Kiam vi turnas la sablohorloĝon kaj rigardas verŝadon de sablo, vi povas senti magion allogantan al vi, certe uzo de tiu ĉi magio ebligos al vi kvazaŭ-regi super tempo.
items.artifacts.timekeepershourglass.desc_hint=Aspektas, ke la sablohorloĝo perdis iom da sablo, se vi povus trovi iom…
items.artifacts.timekeepershourglass.desc_cursed=La malbenita sablohorloĝo alteniĝis al vi kaj vi sentas, ke ĝi provas manipuli vian pason de tempo.
items.artifacts.timekeepershourglass$timefreeze.name=Haltigita tempo
items.artifacts.timekeepershourglass$timefreeze.desc=Tempo ĉirkaŭ vi estas haltigita, ebligante al vi senprokraste plenumi agojn. La efiko daŭros ĝis ĝi estos nuligita aŭ ĝis via sablohorloĝo malŝargiĝos. Atako aŭ uzo de magio ankaŭ nuligos tiun ĉi efikon.\n\nTemperoj ĝis malŝargiĝo: %s.
items.artifacts.timekeepershourglass$sandbag.name=saketo da magia sablo
items.artifacts.timekeepershourglass$sandbag.levelup=Vi aldonis sablon al via sablohorloĝo.
items.artifacts.timekeepershourglass$sandbag.maxlevel=Via sablohorloĝo estas plenigita per magia sablo!
items.artifacts.timekeepershourglass$sandbag.no_hourglass=Vi ne havas sablohorloĝon por enmeti tiun ĉi sablon.
items.artifacts.timekeepershourglass$sandbag.desc=Tiu ĉi malgranda saketo da sablo perfekte enigos al via sablohorloĝo.\n\nEstas strange, ke la komercisto havas tiel nekutiman aĵon ja tiam, kiam vi bezonas ĝin…

items.artifacts.unstablespellbook.name=librego de hazardaj magiaĵoj
items.artifacts.unstablespellbook.ac_read=LEGI
items.artifacts.unstablespellbook.ac_add=ALDONI
items.artifacts.unstablespellbook.blinded=Vi ne povas legi la libregon dum blindumita.
items.artifacts.unstablespellbook.no_charge=Via librego estas nun malplena je energio.
items.artifacts.unstablespellbook.cursed=Vi ne povas legi malbenitan libregon.
items.artifacts.unstablespellbook.prompt=Elektu skribrulaĵon
items.artifacts.unstablespellbook.infuse_scroll=Vi enigis energion de skribrulaĵo en la libregon.
items.artifacts.unstablespellbook.unable_scroll=Vi ne povas aldoni tiun ĉi skribrulaĵon al la librego.
items.artifacts.unstablespellbook.unknown_scroll=Vi ankoraŭ ne scias pri kia skribrulaĵo tiu ĉi estas.
items.artifacts.unstablespellbook.desc=Tiu ĉi volumo estas en surprize bona stato malgraŭ ĝia aĝo. Ĝi kraketas kaj siblas dum foliumado, ĝia nestabila energio ondas. Oni ne povas scii pri kiun magiaĵon vi sorĉos kiam vi legos la libregon.
items.artifacts.unstablespellbook.desc_cursed=La malbenita librego alteniĝis al vi kaj malebligas al vi uzi plejparton de skribrulaĵoj.
items.artifacts.unstablespellbook.desc_index=Tiu ĉi librego estas nekompleta. Ĝia enhavtabelo nune indikas la jenajn malplenajn paĝojn:
items.artifacts.unstablespellbook.desc_empowered=La skribrulaĵoj, kiujn vi aldonis al la libro ardas je povo. Vi povas elekti ekzotajn versiojn de efikojn de tiuj ĉi skribrulaĵoj, sed tio ĉi kostos kroman ŝargon.
items.artifacts.unstablespellbook.read_empowered=La skribrulaĵo aldonita al la librego ekscitiĝas je energio. Vi povas uzi aŭ norman aŭ ekzotan version de tiu ĉi skribrulaĵo.\n\nElekto de ekzota versio kostos 2 ŝargojn anstataŭ 1.



###bags
items.bags.bag.name=dorsosako
items.bags.bag.discover_hint=Vi povas aĉeti tian aĵon en vendejo.

items.bags.potionbandolier.name=flakoningo
items.bags.potionbandolier.desc=Tiu ĉi ampleksa flakoningo ĉirkaŭvolvas vian bruston kiel skarpo, ĝi havas multajn izolitajn ingojn por teni vian felsakon kaj flakonoj de eliksiroj kaj de likva metalo.\n\nIngitaj en flakoningo, viaj eliksiroj estos protektataj kontraŭ frostiĝo.

items.bags.scrollholder.name=skribrulaĵujo
items.bags.scrollholder.desc=Tiu ĉi tuba enhavilo ŝajnas, ke ĝi povas enteni ĉielmapojn, sed viaj skribrulaĵoj ankaŭ enteneblos. Ĉe flankoj eĉ troviĝas kelkaj poŝoj, en kiuj vi povas konservi viajn sorĉkristalojn, misterajn gravurilojn kaj rezinojn.\n\nLa skribrulaĵujo ne estas facile brulebla, do viaj volvolibroj estos protektataj kontraŭ fajro ene ĝi.

items.bags.velvetpouch.name=velura sako
items.bags.velvetpouch.desc=Tiu ĉi eta velura sako povas konservi plurajn aĵetojn ene, kiel semojn,  runŝtonojn kaj iujn alĥemiajn konsistaĵojn.
items.bags.velvetpouch.discover_hint=Iu el la herooj komencas kun tiu ĉi aĵo.

items.bags.magicalholster.name=magia sagujo
items.bags.magicalholster.desc=Tiu ĉi maldika sagujo estas farita el ledo de iu ekzota besto kaj posedas potencan magion, kiu ebligas konservi multege da ĵetarmiloj.\n\nVi povas simple etendi manon en la sagujon kaj vi ĉiam eltiros ekzakte tion, kion vi volas.\n\nDanke al ĝia magio, vergoj reŝargiĝos ete pli rapide kaj ĵetarmiloj disrompiĝos ete malrapide ene ĝi.



###bombs
items.bombs.arcanebomb.name=mistera bombo
items.bombs.arcanebomb.desc=Tiu ĉi bombo estas plenigita per iu mistera energio. Ĝi eksplodos formante blovegon similan al pumpa atako de Ŝmiraĵego. kiu kaŭzos _%1$d-%2$d vundpoentojn per magio_ al ĉio ene la radiuso de 2 kaheloj.
items.bombs.arcanebomb.discover_hint=Vi povas kuiri tian aĵon per alĥemio.

items.bombs.bomb.name=bombo
items.bombs.bomb.ac_lightthrow=BRULIGI k ĴETI
items.bombs.bomb.snuff_fuse=Vi rapide bruligis meĉon de bombo.
items.bombs.bomb.ondeath=La eksplodo mortigis vin…
items.bombs.bomb.rankings_desc=Mortigita pro eksplodo
items.bombs.bomb.desc=Eĉ granda bombo de nigra pulvo. Ĝia eksplodo kaŭzos _%1$d-%2$d vundpoentojn_ al ĉio apud la eksplodejo kaj detruos apudan terenon kaj aĵojn.
items.bombs.bomb.desc_fuse=Ŝajnas, ke la meĉo brulos dum kelkaj temperoj antaŭ ol eksplodi.
items.bombs.bomb.desc_burning=La meĉo de bombo brulas, forkuru aŭ estingu ĝin!
items.bombs.bomb$doublebomb.name=du bomboj
items.bombs.bomb$doublebomb.desc=Stako de du grandaj bomboj de nigra pulvo, ŝajnas ke vi ricevis unu senpage!

items.bombs.firebomb.name=fajrobombo
items.bombs.firebomb.desc=Tiu ĉi bombo estas modifita por eksplodi en vasta areo, ĝia eksplodo kaŭzos _%1$d-%2$d vundpoentojn_ kaj disigos fajron ene la radiuso de 2 kaheloj.
items.bombs.firebomb.discover_hint=Vi povas kuiri tian aĵon per alĥemio.

items.bombs.flashbangbomb.name=fulmobombo
items.bombs.flashbangbomb.desc=Tiu ĉi modifita bombo eksplodos ellasante lumon, sonon kaj elektron. Ĉio ene la radiuso de 2 kaheloj ricevos _%1$d-%2$d vundpoentojn_ pro la eksplodo kaj 25%% kromajn vundpoentojn pro elektro, kaj estos surdigita por 10 temperoj.
items.bombs.flashbangbomb.discover_hint=Vi povas kuiri tian aĵon per alĥemio.

items.bombs.frostbomb.name=frostiga bombo
items.bombs.frostbomb.desc=Tiu ĉi bombo estas modifita por eksplodi en vasta areo, ĝia eksplodo kaŭzos _%1$d-%2$d vundpoentojn_ kaj disigos blovon de frostiga aero ene la radiuso de 2 kaheloj.
items.bombs.frostbomb.discover_hint=Vi povas kuiri tian aĵon per alĥemio.

items.bombs.holybomb.name=sankta bombo
items.bombs.holybomb.desc=Tiu ĉi bombo estas modifita por ellasi helan brilon de sankta lumo je eksplodo. Ĉio ene la radiuso de 2 kaheloj ricevos _%1$d-%2$d vundpoentojn_ pro la eksplodo, kaj nemortaj kaj demonaj bestaĉoj ricevos kroman 50%% vundon pro la sankta lumo.
items.bombs.holybomb.discover_hint=Vi povas kuiri tian aĵon per alĥemio.

items.bombs.noisemaker.name=bruilo
items.bombs.noisemaker.desc=Tiu ĉi bombo estas modifita por pluroble eligi bruan sonon kiam ĝia meĉo forbrulos. Kiam iu tuŝos la bombon, ĝi eksplodos kaj kaŭzos _%1$d-%2$d vundpoentojn_ al ĉio en la radiuso de 2 kaheloj!
items.bombs.noisemaker.desc_burning=Tiu ĉi brulilo eksplodos, kiam iu alproksimiĝos al ĝi!
items.bombs.noisemaker.discover_hint=Vi povas kuiri tian aĵon per alĥemio.

items.bombs.smokebomb.name=fumbombo
items.bombs.smokebomb.desc=Tiu ĉi bombo estas modifita por disigi densan nubon de gaso kune kun eksplodo. Ĝi kaŭzos _%1$d-%2$d vundpoentojn_ kaj disigos fuman vualon ene la radiuso de 2 kaheloj.
items.bombs.smokebomb.discover_hint=Vi povas kuiri tian aĵon per alĥemio.

items.bombs.regrowthbomb.name=vegetaĵa bombo
items.bombs.regrowthbomb.desc=Tiu ĉi modifita bombo ellasos vivigan likvon ene la radiuso de 3 kaheloj anstataŭ eksplodi. Areo proksime de eksplodejo rapide naskos herbon kaj vegetaĵojn. Vi kaj ĉiuj viaj amikoj ene la eksploda ondo estos sanigitaj en la sama maniero kiel trinki eliksiron de sano.
items.bombs.regrowthbomb.discover_hint=Vi povas kuiri tian aĵon per alĥemio.

items.bombs.shrapnelbomb.name=splitiĝa bombo
items.bombs.shrapnelbomb.desc=Tiu ĉi bombo estis modifita uzante metalajn restaĵojn de DM-300, ĝi splitiĝos en pluraj pecoj je eksplodo, kaŭzante _%1$d-%2$d vundpoentojn_ en la vasta areo ĉirkaŭ la bombo. Kaŝiĝu malantaŭ io antaŭ ol uzi tiun ĉi bombon…
items.bombs.shrapnelbomb.discover_hint=Vi povas kuiri tian aĵon per alĥemio.

items.bombs.woollybomb.name=ŝaflana bombo
items.bombs.woollybomb.desc=Tiu ĉi modifita bombo estigos vastan kampon de magiaj ŝafoj post eksplodi. La eksplodo kaŭzos _%1$d-%2$d vundpoentojn_ al ĉio ene la radiuso de 2 kaheloj. La estigotaj ŝafoj blokos movojn kaj daŭros por tre longa tempo! En ĉeesto de potencaj malamikoj la ŝafoj daŭros por malpli longe kaj vi povas eksigi ŝafon per interagi kun ĝi.
items.bombs.woollybomb.discover_hint=Vi povas kuiri tian aĵon per alĥemio.

###food
items.food.berry.name=bero de labirinto
items.food.berry.eat_msg=Tiu ĉi bero estis franda!
items.food.berry.desc=Ĉasistino trovis tiun ĉi beron en densejo de kreskaĵoj de la labirinto. Ĝi povas esti rapide manĝita, iomete satigos vin kaj ĝi povas enhavi utilan semon!
items.food.berry.discover_hint=Vi povas trovi tian aĵon uzante la specifan talenton de heroino.

items.food.blandfruit.name=naŭzfrukto
items.food.blandfruit.cooked=kuirita naŭzfrukto
items.food.blandfruit.sunfruit=sunfrukto
items.food.blandfruit.rotfruit=putrofrukto
items.food.blandfruit.earthfruit=terfrukto
items.food.blandfruit.blindfruit=blindfrukto
items.food.blandfruit.firefruit=fajrofrukto
items.food.blandfruit.icefruit=glacifrukto
items.food.blandfruit.fadefruit=perefrukto
items.food.blandfruit.sorrowfruit=ĉagrenfrukto
items.food.blandfruit.stormfruit=ŝtormfrukto
items.food.blandfruit.dreamfruit=reĝmag-frukto
items.food.blandfruit.starfruit=stelfrukto
items.food.blandfruit.swiftfruit=viglofrukto
items.food.blandfruit.raw=Vi ne povas manĝi ĝin nekurite.
items.food.blandfruit.desc=Tiel naŭza kaj sengusta, eble kuiro kun alia konsistaĵo plibongustigus ĝin.
items.food.blandfruit.desc_cooked=La frukto ŝvelis pro longtempa kuirado en la poto kaj eĉ ensorbis ecojn de la semo kun ĝi estis kuirita. Ĝi havos la efikon de eliksiro rilatanta al la semo.
items.food.blandfruit.desc_eat=Ĝi ŝajnas manĝinde!
items.food.blandfruit.desc_throw=Ĝi aspektas eĉ flugpova, eble estus bone ĵeti ĝin.
items.food.blandfruit$chunks.name=pecoj de naŭzfrukto
items.food.blandfruit$chunks.desc=Naŭzfrukto eksplodis je falo, disfalante al malagemaj pecoj.\n\nMalgraŭ esti iomete malpuraj, tiuj ĉi grandaj pecoj de kuirita naŭzfrukto ŝajnas esti manĝeblaj.

items.food.chargrilledmeat.name=rostita viando
items.food.chargrilledmeat.desc=Ĝi aspektas kiel bongusta viandotranĉaĵo.
items.food.chargrilledmeat.discover_hint=Vi povas akiri tian aĵon uzante alian manĝaĵon.

items.food.food.name=porcio de manĝaĵo
items.food.food.ac_eat=MANĜI
items.food.food.eat_msg=Tiu ĉi manĝaĵo estis bongusta!
items.food.food.desc=Nenio nekutima tie ĉi: sekigita viando, kelkaj biskvitoj – kaj simile.

items.food.frozencarpaccio.name=glaciigita karpaĉo
items.food.frozencarpaccio.invis=Vi rimarkis, ke viaj manoj iĝis nevideblaj!
items.food.frozencarpaccio.hard=Vi sentas, ke via haŭto plimalmoliĝis!
items.food.frozencarpaccio.refresh=Refreŝiĝo!
items.food.frozencarpaccio.better=Vi sentas vin pli bone!
items.food.frozencarpaccio.desc=Tiu ĉi itala manĝaĵo (ne aĉa karpo) estas peco da glaciigita nekuirita viando. Por manĝi ĝin, vi devas distranĉi ĝin al maldikaj rondpecoj. Kaj tial ĝi gustas apetitige.
items.food.frozencarpaccio.discover_hint=Vi povas akiri tian aĵon uzante alian manĝaĵon.

items.food.meatpie.name=vianda kuko
items.food.meatpie.eat_msg=Tiu ĉi manĝaĵo estis franda!
items.food.meatpie.desc=Bongusta kuko kun pika viando. Ĝi satigos vin por pli longe ol aliaj manĝaĵoj.
items.food.meatpie.discover_hint=Vi povas kuiri tian aĵon per alĥemio.

items.food.mysterymeat.name=mistera viando
items.food.mysterymeat.eat_msg=Tiu ĉi manĝaĵo gustis… kurioze.
items.food.mysterymeat.hot=Ho ve, ĝi varmegas!
items.food.mysterymeat.legs=Vi ne sentas viajn piedojn!
items.food.mysterymeat.not_well=Vi ne sentiĝas bone.
items.food.mysterymeat.stuffed=Vi sentiĝas pufe.
items.food.mysterymeat.desc=Manĝu ĝin nur sub via risko!
items.food.mysterymeat.discover_hint=Vi povas akiri tian aĵon mortigante iujn bestojn.
items.food.mysterymeat$placeholder.name=viando

items.food.phantommeat.name=fantoma viando
items.food.phantommeat.desc=Granda brilanta travidebla fiŝaĵo eltranĉita el fantoma piranjo. Tiun ĉi magian viandon oni ne devas kuiri kaj aldone al satigi vin, ĝi liveras kelkajn defendajn kapablojn. Post esti manĝita, ĝi donos al vi nevideblon, ŝelhaŭton kaj nuligos kelkajn minacajn efikojn.
items.food.phantommeat.discover_hint=Vi povas akiri tian aĵon mortigante iujn bestojn.

items.food.pasty.name=pastaĵo
items.food.pasty.fish_name=stufita fiŝaĵo
items.food.pasty.amulet_name=amuleto de Jendor’?
items.food.pasty.egg_name=paska ovo
items.food.pasty.rainbow_name=ĉielarka eliksiro
items.food.pasty.shattered_name=verda torto
items.food.pasty.pie_name=kukurba kuko
items.food.pasty.vanilla_name=blua torto
items.food.pasty.cane_name=dolĉa bastoneto
items.food.pasty.sparkling_name=ŝaŭm-eliksiro
items.food.pasty.desc=Aŭtenta kornvala pastaĵo kun tradicia farĉo el bovaĵo kaj terpomoj. Tre apetitveka!
items.food.pasty.fish_desc=Tuta longe kuirita fiŝviando magie konservita kun verdaj legomoj. Laŭ finjara tradicio hamstri iom da fiŝaĵo por poste, do vi tenos parton da stufaĵo anstataŭ manĝi ĉion unufoje.\n\nFeliĉan Lunan Novan Jaron!
items.food.pasty.amulet_desc=Vi finfine tenas ĝin en viaj manoj, la magian amuleton de… – momenton! – tio ĉi estas nur foliita ĉokolado kiu nur aspektas kiel la amuleto! Ĝi ne donos al vi senliman povon, tamen ĝi povas satigi vin kaj iomete ŝargi viajn antikvaĵojn.\n\nAprilŝerco!
items.food.pasty.egg_desc=Granda ĉokolada ovo ĉirkaŭvolvita per flava aluminfolio. Ĉokolado sufiĉas por satigi vin kaj sukero povas iomete ŝargi viajn antikvaĵojn!\n\nGajan Paskon!
items.food.pasty.rainbow_desc=Tiu ĉi kolorplena eliksiro ŝajnas esti kiel likva manĝo. Aldone al satigi vin, la botelo entenas magion, kiu trankviligos apudan (escepte de supermonstroj) malamikon igante ĝin portempe malema ataki vin.\n\nGajan Fieron!
items.food.pasty.shattered_desc=Tiu ĉi granda peco de torto estas ornamita per kolora kovraĵo kaj verda sukerglaceo. Ĝi estas bakita por festi jarojn da sperto kaj donos al vi etan kvanton da spert-poentoj post manĝi.\n\nLa ludo Shattered Pixel Dungeon estis eldonita je 5-a de Aŭgusto 2014. Feliĉan naskiĝtagon al Shattered Pixel Dungeon!
items.food.pasty.pie_desc=Pecego da kukurba kuko. Ĝia dolĉa kaj rafinita aromo plenigos vin kaj donos al vi iomete da sano.\n\nFeliĉan Halovenon!
items.food.pasty.vanilla_desc=Tiu ĉi granda peco de torto estas ornamita per kolora kovraĵo kaj blua sukerglaceo. Ĝi estas bakita por festi jarojn da sperto kaj donos al vi etan kvanton da spert-poentoj post manĝi.\n\nLa originala ludo Pixel Dungeon estis eldonita je 4-a de Decembro 2012. Feliĉan naskiĝtagon al Pixel Dungeon!
items.food.pasty.cane_desc=Grandega sukera dolĉa bastoneto. Ĝi estas sufiĉe granda por satigi vin kaj la sukero povas doni al viaj vergoj iomete da kroma ŝargo.\n\nGajan Kristnaskon!
items.food.pasty.sparkling_desc=Tiu ĉi ŝaŭmanta eliksiro ŝajnas esti kiel likva manĝo. Ĝi satigas kaj similas al ŝaŭmvino, tamen ne enhavas alkoholon. La varma sento en via ventro post trinki ĝin donos al vi iomete da ŝirmo.\n\nFeliĉan Novan Jaron!
items.food.pasty$fishleftover.name=restaĵo de stufita fiŝaĵo
items.food.pasty$fishleftover.eat_msg=Tiu ĉi manĝaĵo estis eĉ bongusta.
items.food.pasty$fishleftover.desc=Restaĵo de fiŝaĵo el la lasta manĝaĵo. Vi povas manĝi ĝin iam ajn por iomete satigi vin.

items.food.smallration.name=eta porcio de manĝaĵo
items.food.smallration.eat_msg=Tiu ĉi manĝaĵo estis eĉ bongusta.
items.food.smallration.desc=Ĝi aspektas ekzakte same kiel norma porcio de manĝaĵo, sed estas malpli granda.
items.food.smallration.discover_hint=Vi povas aĉeti tian aĵon en vendejo.

items.food.stewedmeat.name=kuirita viando
items.food.stewedmeat.eat_msg=Tiu ĉi manĝaĵo estis eĉ bongusta.
items.food.stewedmeat.desc=Kuirado purigis ĝin de ĉiuj malsanigoj kaj parazitoj. Ĝi povas esti sekure manĝita.
items.food.stewedmeat.discover_hint=Vi povas kuiri tian aĵon per alĥemio.

items.food.supplyration.name=manĝa provizo
items.food.supplyration.desc=Tiu ĉi manĝa provizo estis lasita de kaj por anoj de la gildo de ŝtelistoj. Ĝi estas preparita por manĝi dum irado kaj por helpi al ĝenerale al ŝtelagado.\n\nKvankam ĝi ne satigos vin tiel kiel la norma porcio, vi ĝin manĝos rapide, ĝi iomete sanigos vin kaj restarigos unu ŝargon de via mantelo de ombroj.
items.food.supplyration.discover_hint=Vi povas trovi tian aĵon uzante la specifan talenton de heroo.



##journal items
items.journal.documentpage.name=elŝirita paĝo
items.journal.documentpage.desc=Memstara paĝo, probable elŝirita el iu libro. Vi devas ĝin levi por legi ĝin.

items.journal.alchemypage.name=elŝirita paĝo de alĥemia manlibro
items.journal.alchemypage.desc=Paĝo elŝirita el la gvidlibro pri alĥemio.\n\nPlejparto de ĝia teksto estas tro eta por esti legebla de malproksime, sed vi povas rigardi titolon de la paĝo:\n\n_“%s”_

items.journal.guidebook.name=Gvidlibro pri labirintado
items.journal.guidebook.hint_mobile=Via gvidlibro havas konsilon por vi! Frapetu la lumpulsantan butonon de paperfolio ĉe dekstr-supre por legi ĝin.
items.journal.guidebook.hint_desktop=Via gvidlibro havas konsilon por vi! Elektu la lumpulsantan butonon de paperfolio (%s) ĉe la dekstra supro por legi ĝin.
items.journal.guidebook.hint_status=Gvidlibro
items.journal.guidebook.desc=Gvidlibro por aventuristoj, forlasita tie ĉe de persono, kiu decidiĝis pri fini aventurojn. Tiu ĉi libro estas iomete magia kaj ĝi povas informi la posedanton pri legi paĝon en taŭga momento.\n\nAldone al la menciitaj atributoj, la plej distingebla trajto de la libro estas la frazo “Ne paniku!” presita per grandaj literoj sur la kovrilo.

items.journal.guidepage.name=elŝirita paĝo de gvidlibro
items.journal.guidepage.desc=Paĝo elŝirita el aventura gvidlibro.\n\nPlejparto de ĝia teksto estas tro eta por esti legebla de malproksime, sed vi povas rigardi titolon de la paĝo:\n\n_“%s”_

items.journal.regionlorepage$sewers.name=ĉifita letero
items.journal.regionlorepage$sewers.desc=Io, kio ŝajnas esti letero skribita sur papero malpurigita de tero. Vi devos levi ĝin por legi ĝin.

items.journal.regionlorepage$prison.name=ĉifita folio de taglibro
items.journal.regionlorepage$prison.desc=Folio de taglibro skribita sur malnova paco de papero. Ĝi ŝajnas esti en pli bona stato ol lateroj trovitaj en la kloakaro, tamen vi plue devos levi ĝin por legi ĝin.

items.journal.regionlorepage$caves.name=malnova folio de taglibro
items.journal.regionlorepage$caves.desc=Paĝo de taglibro de iu aventuristo, konservite en surprize bona stato malgraŭ ĝia aĝo. Levu ĝin por legi ĝian enhavon.

items.journal.regionlorepage$city.name=rusta skribtabuleto
items.journal.regionlorepage$city.desc=Malgranda rusta metala skribtabuleto kun mesaĝo gravurita per magio. La literoj estas plue videblaj malgraŭ aĝo de la tabuleto, tamen vi devos levi la tabuleton por legi ĝian enhavon.

items.journal.regionlorepage$halls.name=radianta skribtabuleto
items.journal.regionlorepage$halls.desc=Malgranda nigra skribtabuleto sur kiu estas gravuritaj verdaj radiantaj literoj. De malproksime la literoj malklariĝas, do vi devos levi la tabuleton por legi ĝin.


###keys
items.keys.goldenkey.name=ora ŝlosilo
items.keys.goldenkey.desc=Randodentoj sur tiu ĉi ora ŝlosilo estas etaj kaj kompleksaj. Verŝajne ĝi povas malŝlosi iun kofron?

items.keys.crystalkey.name=Kristala ŝlosilo
items.keys.crystalkey.desc=La surfacoj de tajlo de tiu ĉi kristala ŝlosilo trembrilas en la malheleco. Ĉu eble ĝi povas malfermi ion faritan de kristalo?

items.keys.ironkey.name=fera ŝlosilo
items.keys.ironkey.desc=Randodentoj sur tiu ĉi antikva ŝlosilo estas eluzitaj, ĝia leda breloko detruiĝis pro aĝo. Kiun pordon ĝi povas malŝlosi?

items.keys.wornkey.name=eluzita ŝlosilo
items.keys.wornkey.desc=Tiu ĉi ŝlosilo ŝajnas esti eluzita kaj fendetita, sed aspektas grave. Probable ĝi povas malfermi iun seriozan pordon proksime.



###potions
items.potions.potion.ac_drink=TRINKI
items.potions.potion.turquoise=turkisa eliksiro
items.potions.potion.crimson=karmezina eliksiro
items.potions.potion.azure=lazura eliksiro
items.potions.potion.jade=jadkolora eliksiro
items.potions.potion.golden=orkolora eliksiro
items.potions.potion.magenta=magenta eliksiro
items.potions.potion.charcoal=karbkolora eliksiro
items.potions.potion.ivory=ebura eliksiro
items.potions.potion.amber=sukcenkolora eliksiro
items.potions.potion.bistre=maronkolora eliksiro
items.potions.potion.indigo=indiga eliksiro
items.potions.potion.silver=arĝentkolora eliksiro
items.potions.potion.unknown_desc=Tiu ĉi flakono enhavas rotaciantan koloran likvon. Kiu scias, kio okazos kiam ĝi estos trinkita aŭ ĵetita?
items.potions.potion.harmful=Danĝera eliksiro!
items.potions.potion.beneficial=Bonutila eliksiro
items.potions.potion.yes=Jes, mi certas pri tio
items.potions.potion.no=Ne, mi ŝanĝis mian volon
items.potions.potion.sure_drink=Ĉu vi certe volas trinki ĝin? Plejofte vi devas ĵeti tiajn eliksirojn al viaj kontraŭuloj.
items.potions.potion.sure_throw=Ĉu vi certe volas ĵeti ĝin? Plej ofte estas utile trinki ĝin.
items.potions.potion.shatter=La flakono dispeciĝis kaj likvo disverŝiĝis sendanĝere.
items.potions.potion.discover_hint=Vi povas trovi tian aĵon ie hazarde en la labirinto aŭ kuiri ĝin per alĥemio.
items.potions.potion$placeholder.name=eliksiro
items.potions.potion$seedtopotion.name=Hazarda eliksiro

items.potions.potionofexperience.name=eliksiro de sperto
items.potions.potionofexperience.desc=Spertoj de miloj da interesaj bataloj reduktitaj al likva formo, engluto de ĝi tuje pliigos vian spert-nivelon.

items.potions.potionoffrost.name=eliksiro de frosto
items.potions.potionoffrost.desc=La ĥemiaĵo entenata en tiu ĉi boteleto vaporiĝos formante frostigan nubeton en kontakto kun freŝa aero.

items.potions.potionofhaste.name=eliksiro de rapido
items.potions.potionofhaste.energetic=Vi sentas vin energiplena!
items.potions.potionofhaste.desc=Trinkado de tiu ĉi strange dolĉa likvo plenigos vin per multege da energio por mallonga tempo, ebligante al vi kuradi rapidege.

items.potions.potionofhealing.name=eliksiro de sano
items.potions.potionofhealing.heal=Viaj vundoj komenciĝas saniĝi.
items.potions.potionofhealing.desc=Tiu ĉi eliksiro rapide resanigos kaj nutros vin.

items.potions.potionofinvisibility.name=eliksiro de nevidebleco
items.potions.potionofinvisibility.invisible=Vi rimarkis, ke viaj manoj iĝis nevideblaj!
items.potions.potionofinvisibility.desc=Trinkado de tiu ĉi eliksiro igos vin nevidebla portempe. Dum esti nevidebla monstroj ne povos vidi vin. Permanaj atakoj kaj magiaj efikoj (kiel skribrulaĵoj kaj vergoj) tuj nuligos la nevideblecon.

items.potions.potionoflevitation.name=eliksiro de aerportiĝo
items.potions.potionoflevitation.float=Vi portiĝas en la aero!
items.potions.potionoflevitation.desc=Trinkado de tiu ĉi kurioza likvo kaŭzos vin flosi en la aero, ebligante vin drivi inerte super kaptiloj kaj abismoj. Ĵetado de tiu ĉi eliksiro ellasos nubeton de densa gaso, kiu konfuzos ĉiujn kaptitajn viktimojn.

items.potions.potionofliquidflame.name=eliksiro de likva fajro
items.potions.potionofliquidflame.desc=Tiu ĉi boteleto enhavas nestabilan kombinaĵon kiu ekflamos senprokraste en kontakto kun libera aero.

items.potions.potionofmindvision.name=eliksiro de mensvido
items.potions.potionofmindvision.see_mobs=Vi iel sentas la ĉeeston de mensoj de aliaj kreaĵoj!
items.potions.potionofmindvision.see_none=Vi iel sentas, ke vi estas sola en tiu ĉi keletaĝo nun.
items.potions.potionofmindvision.desc=Kiam vi trinkos tiun ĉi, via menso estos alĝustigita al spiritaj markoj de aliaj malproksimaj monstroj, ebligante al vi senti vivaĵojn trans muroj. Krom tio, tiu ĉi eliksiro ebligos vidi trans proksimaj muroj kaj pordoj.

items.potions.potionofparalyticgas.name=eliksiro de paraliza gaso
items.potions.potionofparalyticgas.desc=En kontakto kun libera aero, la likvo de tiu ĉi boteleto vaporiĝos formante flavetan nebulon. Iu ajn kiu enspiros la nubeton estos tuj paralizita kaj neebliganta movi ĝis la nubeto disiĝos. Tiu ĉi boteleto povas esti ĵetita al foraj kontraŭuloj por kapti ilin per efiko de la gaso.

items.potions.potionofpurity.name=eliksiro de purigo
items.potions.potionofpurity.freshness=Vi sentas nekutiman freŝecon en la aero.
items.potions.potionofpurity.protected=Protekta tavolo ĉirkaŭas vin!
items.potions.potionofpurity.desc=Tiu ĉi magia ĥemiaĵo subite neŭtrigos ĉiujn danĝerajn mediajn efikojn en vasta areo. Trinki ĝin igos vin portempe rezista al tiaj efikoj.

items.potions.potionofstrength.name=eliksiro de povo
items.potions.potionofstrength.msg=Ĵuse trovita povo plenigas vian korpon, nun vi havas %d poentojn da povo!
items.potions.potionofstrength.desc=Tiu ĉi potenca eliksiro trafluos tra viajn muskolojn kaj daŭre pliigos vian povon je unu poento.

items.potions.potionoftoxicgas.name=eliksiro de toksa gaso
items.potions.potionoftoxicgas.desc=Malkorkado aŭ dispecigado de tiu ĉi kunprema ujo kaŭzos, ke ĝia enhavo eksplodos formante nubeton de mortiga venena verdeta gaso. Vi eble devus disverŝi tiun ĉi eliksiron al foraj kontraŭuloj anstataŭ malkorki ĝin permane.



###brews
items.potions.brews.brew.discover_hint=Vi povas kuiri tian aĵon per alĥemio.

items.potions.brews.aquabrew.name=akva infuzaĵo
items.potions.brews.aquabrew.desc=Post dispecigo, tiu ĉi infuzaĵo elŝprucos preman akvon en la alcela loko. Ĝia forto povos vundi nur fajrajn monstrojn; tamen ĝi ankaŭ superverŝos proksiman terenon, malaktivigos kaptilojn, estingos fajron kaj forbatos ulojn apudantajn la fonton.

items.potions.brews.blizzardbrew.name=neĝŝtorma infuzaĵo
items.potions.brews.blizzardbrew.desc=Post dispecigo, tiu ĉi infuzaĵo eligos kirlantan neĝŝtormon, kiu rapide disvastiĝos kiel gaso.

items.potions.brews.causticbrew.name=acidmorda infuzaĵo
items.potions.brews.causticbrew.desc=Post dispecigo, tiu ĉi infuzaĵo kovros vastan areon per morda acido. Ĉio kaptita per tiu ĉi ĥemiaĵo estos malrapidete dismordata ĝis forlavi acidon per akvo.

items.potions.brews.infernalbrew.name=incendia infuzaĵo
items.potions.brews.infernalbrew.desc=Post dispecigo, tiu ĉi infuzaĵo ellasos ardan incendion, kiu rapide disvastiĝos kiel gaso.

items.potions.brews.shockingbrew.name=elektroŝoka infuzaĵo
items.potions.brews.shockingbrew.desc=Post dispecigo, tiu ĉi infuzaĵo ellasos elektran ŝtormon, kiu kovros vastan areon ĉirkaŭ la loko, kie ĝi estos ĵetita.

items.potions.brews.unstablebrew.name=nestabila infuzaĵo
items.potions.brews.unstablebrew.desc=Tiu ĉi magia infuzaĵo brilas per alternantaj koloroj de ĉielarko.\n\nJe trinko aŭ ĵeto ĝi aktivigos efikon de hazarda eliksiro. La okazonta efiko ĉiam estos utila je trinko kaj ĉiam estos minaca je ĵeto.

###elixirs
items.potions.elixirs.elixir.discover_hint=Vi povas kuiri tian aĵon per alĥemio.

items.potions.elixirs.elixirofarcanearmor.name=miksturo de mistera ŝirmo
items.potions.elixirs.elixirofarcanearmor.desc=Tiu ĉi miksturo donos al la trinkanto longe aktivan vund-reziston kontraŭ magio.

items.potions.elixirs.elixirofaquaticrejuvenation.name=miksturo de akva restarigo
items.potions.elixirs.elixirofaquaticrejuvenation.desc=Tiu ĉi miksturo enhavas restaĵojn de Ŝmiraĵego kuiritaj kun saniga eliksiro. Kvankam ĝi ne sanigos vin tuj, ĝi iom post iom restarigos signifan parton da via sano dum kiam vi staros en akvo.
items.potions.elixirs.elixirofaquaticrejuvenation$aquahealing.name=akva sanigado
items.potions.elixirs.elixirofaquaticrejuvenation$aquahealing.desc=Vi portempe havas resanigan povon, similan al tiu de Ŝmiraĵego.\n\nDum stari en la akvo, vi reakiros po kelkaj da sanpoentoj por luda tempero. La efiko paŭzos kiam vi estos plena je sano aŭ ekster la akvo.\n\nPlia sanigo: %d.

items.potions.elixirs.elixirofdragonsblood.name=miksturo de draka sango
items.potions.elixirs.elixirofdragonsblood.desc=Post esti trinkita, tiu ĉi miksturo plenigos vejnojn de trinkanto per arda povo. Tiu ĉi efiko igos la trinkanton rezista kontraŭ fajro kaj ebligos al li flamigi malamikojn per korpaj atakoj.

items.potions.elixirs.elixiroffeatherfall.name=miksturo de pluma falo
items.potions.elixirs.elixiroffeatherfall.light=Vi sentas vin malpeza kiel plumo!
items.potions.elixirs.elixiroffeatherfall.desc=Tiu ĉi miksturo liveras malpli fortan, sed pli regeblan efikon de aerportiĝo, ebligante al la trinkanto sendanĝere malsuprenfali por mallonga tempo.
items.potions.elixirs.elixiroffeatherfall$featherbuff.name=pluma falo
items.potions.elixirs.elixiroffeatherfall$featherbuff.desc=Vi estas sub la influo de miksturo de pluma falo, kiu ebligos al vi salti abismojn sen esti vundita!\n\nPliaj temperoj da plumfalo: %s.

items.potions.elixirs.elixirofhoneyedhealing.name=miksturo de miela sanigo
items.potions.elixirs.elixirofhoneyedhealing.desc=Tiu ĉi miksturo estas same saniga kiel dolĉa. Post esti trinkita, ĝi liveros la saman efikon kiel eliksiro de sano kaj ete kontentigos malsaton, krom tio oni povas ĵeti ĝin por sanigi amikon.\n\nBestaĉoj kun inklino al mielo povas esti trankviligitaj per uzi tiun ĉi likvon sur ili.

items.potions.elixirs.elixiroficytouch.name=miksturo de frosta tuŝo
items.potions.elixirs.elixiroficytouch.desc=Post esti trinkita, tiu ĉi miksturo ebligos al la trinkanto elsuĉi varmon el kontraŭuloj je atako. Tiu ĉi efiko igos la trinkanton rezista kontraŭ frostiĝo kaj ebligos al li frosti malamikojn per korpaj atakoj.

items.potions.elixirs.elixirofmight.name=miksturo de povego
items.potions.elixirs.elixirofmight.msg=Ĵuse trovita povo plenigas vian korpon, nun vi havas %d poentojn da povo!
items.potions.elixirs.elixirofmight.desc=Tiu ĉi potenca eliksiro trafluos viajn muskolojn kaj pordaŭre pliigos vian povon je unu poento kaj portempe pliigos vian maksimuman sanon je %d poentoj. Pliigo de sano dependas de via maksimuma sano, tamen ĝi iom post iom perdiĝos kiam vi pliniveliĝos.
items.potions.elixirs.elixirofmight$htboost.name=pliigo de san-enhaveco
items.potions.elixirs.elixirofmight$htboost.desc=Vi sentas vin nenature forta kaj sana.\n\nVia san-enhaveco estas pliigita por iom da tempo. Kiam vi pliniveliĝos, tiu ĉi pliigo perdiĝos.\n\nNuna pliigo da san-enhaveco: %d.\nPliaj niveloj: %d.

items.potions.elixirs.elixiroftoxicessence.name=miksturo de toksa esenco
items.potions.elixirs.elixiroftoxicessence.desc=Post esti trinkita, tiu ĉi eliksiro plenigos la trinkanton per toksa energio. La trinkanto senĉese disvastigos toksan gason dum moviĝi kaj estos rezista kontraŭ toksa gaso kaj veneno por iomete pli longe ol daŭro de la efiko.



###exotic potions
items.potions.exotic.exoticpotion.turquoise=ekzota turkisa eliksiro
items.potions.exotic.exoticpotion.crimson=ekzota karmezina eliksiro
items.potions.exotic.exoticpotion.azure=ekzota lazura eliksiro
items.potions.exotic.exoticpotion.jade=ekzota jadkolora eliksiro
items.potions.exotic.exoticpotion.golden=ekzota orkolora eliksiro
items.potions.exotic.exoticpotion.magenta=ekzota magenta eliksiro
items.potions.exotic.exoticpotion.charcoal=ekzota karbkolora eliksiro
items.potions.exotic.exoticpotion.ivory=ekzota ebura eliksiro
items.potions.exotic.exoticpotion.amber=ekzota sukcenkolora eliksiro
items.potions.exotic.exoticpotion.bistre=ekzota maronkolora eliksiro
items.potions.exotic.exoticpotion.indigo=ekzota indiga eliksiro
items.potions.exotic.exoticpotion.silver=ekzota arĝentkolora eliksiro
items.potions.exotic.exoticpotion.unknown_desc=Tiu ĉi ronda flakono enhavas malsamece koloran likvon. Ĝi ŝajnas deveni de malproksima lando, kiu scias, kio okazos kiam ĝi estos trinkita aŭ ĵetita?
items.potions.exotic.exoticpotion.warning=Ĉu vi certe volas nuligi uzon de tiu ĉi eliksiro? Tiel aŭ alie ĝi konsumiĝos.
items.potions.exotic.exoticpotion.yes=Jes, mi certas
items.potions.exotic.exoticpotion.no=Ne, mi ŝanĝis mian volon
items.potions.exotic.exoticpotion.discover_hint=Vi povas kuiri tian aĵon per alĥemio.

items.potions.exotic.potionofcleansing.name=eliksiro de purigego
items.potions.exotic.potionofcleansing.desc=Tiu ĉi potenca eliksiro igos la trinkanton rezista al ĉiuj minacaj efikoj por kelkaj temperoj. Ĝi ankaŭ povas esti ĵetita por purigi la celon.
items.potions.exotic.potionofcleansing$cleanse.name=purigita
items.potions.exotic.potionofcleansing$cleanse.desc=Tiu ĉi heroo estas portempe rezista al ĉiuj minacaj efikoj!\n\nPliaj temperoj de purigo: %s.

items.potions.exotic.potionofcorrosivegas.name=eliksiro de koroda gaso
items.potions.exotic.potionofcorrosivegas.desc=Malkorkado aŭ dispecigado de tiu ĉi kunprema ujo igos ĝian enhavon eksplodi formante rustkoloran korodan gason. La gaso disŝvebos pli rapide kaj estos pli mortiga ol la toksa gaso, tamen ĝi agos por malpli longe.

items.potions.exotic.potionofdragonsbreath.name=eliksiro de draka spiro
items.potions.exotic.potionofdragonsbreath.prompt=Elektu kion flamigi
items.potions.exotic.potionofdragonsbreath.desc=Tiu ĉi eliksiro enhavas nekutiman ĥemiaĵon, kiu formos flamon tuj post miksi kun salivo. Rapide kraĉu tiun ĉi likvon por fajrospiri per via buŝo!

items.potions.exotic.potionofearthenarmor.name=eliksiro de tereca kiraso
items.potions.exotic.potionofearthenarmor.desc=Anstataŭ paralizi, tiu ĉi likvo plimalmoligos haŭton formante sendaŭran naturan defendaĵon.

items.potions.exotic.potionofdivineinspiration.name=eliksiro de dia inspiro
items.potions.exotic.potionofdivineinspiration.no_more_points=Vi ne povas akiri iun plian talent-poenton.
items.potions.exotic.potionofdivineinspiration.select_tier=Elektu nivelon de talentoj, al kiu vi volas aldoni du ekstrajn poentojn. Vi devas malŝlosi la nivelon de talentoj por apliki la poentojn.
items.potions.exotic.potionofdivineinspiration.bonus=+2 talent-poentoj!
items.potions.exotic.potionofdivineinspiration.desc=Povo de sankta energio reduktita al likva formo, post engluti ĝin la trinkanto estos plenigita per dia povo, donante al li du ekstrajn talent-poentojn aplikeblajn al talentoj de unu elektita nivelo.\n\nTiun ĉi eliksiron oni povas uzi nur unufoje por ĉiu nivelo de talentoj.

items.potions.exotic.potionofmagicalsight.name=eliksiro de magia vido
items.potions.exotic.potionofmagicalsight.desc=Post trinki tion ĉi, viaj sensoj estos akrigitaj por mallonga tempo, ebligante al vi vidi trans muroj ene la radiuso de 12 kaheloj!

items.potions.exotic.potionofmastery.name=eliksiro de majstreco
items.potions.exotic.potionofmastery.prompt=Iĝi majstro de armaĵo
items.potions.exotic.potionofmastery.weapon_easier=Vi armilo estas pli facila por uzi!
items.potions.exotic.potionofmastery.armor_easier=Via defendaĵo estas pli facila por porti!
items.potions.exotic.potionofmastery.desc=Anstataŭ simple pliigi povon de la trinkanto, tiu ĉi eliksiro adaptas specifaj muskolojn por uzi la determinitan armaĵon. Tiel la determinita armilo aŭ defendaĵo iĝos pli facila por uzi, same kiel la trinkanto ekzercis siajn muskolojn en uzi tiun ĉi armaĵon.\n\nLa elektita armaĵo postulos je 2 poentoj da povo malpli por uzi. Oni povas uzi tiun ĉi eliksiron nur unufoje por ĉiu armaĵo.

items.potions.exotic.potionofshielding.name=eliksiro de ŝirmo
items.potions.exotic.potionofshielding.desc=Anstataŭ sanigi, tiu ĉi eliksiro formos fortan ŝirmon ĉirkaŭ via korpo, kiu blokos signifan kvanton da vundpoentoj.

items.potions.exotic.potionofshroudingfog.name=eliksiro de nebula kurteno
items.potions.exotic.potionofshroudingfog.desc=En kontakto kun la aero, la likvo en tiu ĉi flakono formos densan nebulon, kiu rapide disvastiĝos kaj blokos vidpovon de viaj kontraŭuloj.

items.potions.exotic.potionofsnapfreeze.name=eliksiro de subita frostigo
items.potions.exotic.potionofsnapfreeze.desc=La ĥemiaĵo entenata en tiu ĉi boteleto rapide reagos kun la aero, tuje frostigante kaj senmovigante ĉion en la proksimo.

items.potions.exotic.potionofstamina.name=eliksiro de vigleco
items.potions.exotic.potionofstamina.desc=Trinkado de tiu ĉi strange dolĉa likvo plenigos vin per longe daŭrantan pliigon de povo, ebligante al vi galopi por iom da tempo.

items.potions.exotic.potionofstormclouds.name=eliksiro de pluvegaj nuboj
items.potions.exotic.potionofstormclouds.desc=Ĵetu tiun ĉi eliksiron por krei nubon, kiu rapide disiĝos, kondensos kaj pluvos al la ĉirkaŭaĵo. Plejparto de tereno estos kovrita per akvo, fajraj monstroj vundiĝos, fajro estingiĝos kaj kaptiloj estos superakvitaj kaj ĉesos funkcii.



###quest items
items.quest.ceremonialcandle.name=ceremoniaj kandeloj
items.quest.ceremonialcandle.desc=Kelkaj kandeloj, fandetitaj kaj kunfanditaj dum uzado.\n\nAparte ili estas maltaŭgaj, sed kune kun aliaj kandeloj en skemo, ili povas amasigi energion por alvoka rito.
items.quest.ceremonialcandle.discover_hint=Vi povas trovi tian aĵon dum la specifa misio.

items.quest.corpsedust.name=pulvoro kadavra
items.quest.corpsedust.chill=Terurtremo trairas vian korpon.
items.quest.corpsedust.desc=La stako da pulvoro kadavra ne ŝajne diferencas de norma pulvoro. Tamen vi povas senti fian energion radiantan de ĝi.
items.quest.corpsedust.discover_hint=Vi povas trovi tiun aĵon dum la specifa misio.

items.quest.darkgold.name=ombra oro
items.quest.darkgold.you_now_have=Vi nun havas %d pecojn da ombra oro.
items.quest.darkgold.desc=Tiu ĉi metalo estas nomata ombra ne pro sia koloro (ĝi ne diferencas de norma oro), sed ĉar ĝi fandiĝas sub influo de la taglumo, tio faras ĝin senutila en la supraĵo.
items.quest.darkgold.discover_hint=Vi povas trovi tian aĵon dum la specifa misio.

items.quest.dwarftoken.name=gnoma ĵetono
items.quest.dwarftoken.desc=Multe da gnomoj kaj liaj pli grandaj kreaĵoj portas tiujn ĉi pecetojn da metalo pro nekonata kialo. Eble ili estas juveloj aŭ ia speco de identigilo. Gnomoj estas strangaj uloj.
items.quest.dwarftoken.discover_hint=Vi povas trovi tian aĵon dum la specifa misio.

items.quest.embers.name=ardaĵo
items.quest.embers.desc=Tiu ĉi ardaĵo povas esti ricevita nur el junaj fajridoj. Ĝi radias varmalan energion.
items.quest.embers.discover_hint=Vi povas trovi tian aĵon dum la specifa misio.

items.quest.escapecrystal.name=kristalo de eskapo
items.quest.escapecrystal.ac_use=UZI
items.quest.escapecrystal.desc=Maldika magia sorĉkristalo, kiu ŝajnas enhavi teleportantan magion.  Vi ĉiam povas uzi la kristalon por eliri la gnoman trezorejon, sed ne povos preni ion ajn kun vi!
items.quest.escapecrystal.discover_hint=Vi povas trovi tian aĵon dum la specifa misio.

items.quest.gooblob.name=restaĵo de ŝmiraĵo
items.quest.gooblob.desc=Glueca kaj glita substanco, kiu disiĝis de ŝmiraĵ(eg)o je ĝia morto. Ĝi ŝajnas kiel granda gelatenaĵo, sed vi certege ne manĝos ĝin.\n\nĜi estas senutila per si mem, sed eble oni povas kombini ĝin kun iuj eliksiroj aŭ bombo. En ekstrema okazo vi povas konverti ĝin al iom da energio.
items.quest.gooblob.discover_hint=Vi povas akiri tian aĵon mortigante iujn bestojn.

items.quest.metalshard.name=malbenita metala ŝelpeco
items.quest.metalshard.desc=Ŝelpeco de rusta kaj malbenita metalo, kiu disiĝis de DM-300 je ĝia detruiĝo. Vi povas senti malican – tamen malaktivan – magion insidantan de ĝi.\n\nĜi estas senutila per si mem, sed eble oni povas kombini ĝin kun iuj skribrulaĵoj aŭ bombo. En ekstrema okazo vi povas konverti ĝin al iom da energio.
items.quest.metalshard.discover_hint=Vi povas akiri tian aĵon mortigante iujn bestojn.

items.quest.pickaxe.name=pioĉo
items.quest.pickaxe.ability_name=trapiki
items.quest.pickaxe.ability_desc=Duelistino povas _trapiki_ malamikon per pioĉo. La frapo certe trafos, igos kontraŭulon vundebla por 3 temperoj kaj kaŭzos _%1$d-%2$d vundpoentojn_ al malamikoj kun rigida haŭto.
items.quest.pickaxe.upgrade_ability_stat_name=Special-ataka vundpovo
items.quest.pickaxe.desc=Tio ĉi estas solida kaj peza ilo por rompi rokojn. Vi ne devas surmeti ĝin por pioĉi, tamen en ekstrema okazo vi povas surmeti ĝin kiel armilon.
items.quest.pickaxe.discover_hint=Vi povas trovi tian aĵon dum la specifa misio.

items.quest.ratskull.name=giganta kranio de rato
items.quest.ratskull.desc=Surprizinde granda kranio de rato. Ĝi estus agrabla ĉastrofeo, se vi havus muron por alfiksi ĝin.



###remains
items.remains.remainsitem.ac_use=UZI
items.remains.remainsitem.discover_hint=Vi povas trovi tiun aĵon en restaĵoj de iu specifa heroo de la antaŭa malvenkita ludo.

items.remains.bowfragment.name=fragmento de pafarko
items.remains.bowfragment.desc=Tiu ĉi rompita ligna fragmento iam estis parto de la spirita pafarko de morta Ĉasistino. Vi plue sentas malfortan energio de naturo en la fragmento kaj povas uzi ĝin por kreskigi herbon ĉirkaŭ vi. La menciita ago tamen detruos la fragmenton.

items.remains.brokenhilt.name=rompita tenilo de armilo
items.remains.brokenhilt.desc=Tiu ĉi rompita tenilo aspektas esti restaĵo de armilo de morta Duelistino. Vi plue sentas batalemon en la tenilo kaj povas uzi ĝin por eligi kroman vundpovon dum la du sekvaj permanaj frapoj. La menciita ago tamen detruos la tenilon.

items.remains.brokenstaff.name=rompita bastonego
items.remains.brokenstaff.desc=Tiu ĉi bastonego rompiĝis al du partoj post morto de Magiisto. Vi plue sentas, ke iometa magia energio restas en la bastonego, vi povas uzi ĝin por ŝargi vian vergojn. La menciita ago tamen detruos la bastonegon.

items.remains.cloakscrap.name=peco de teksaĵo
items.remains.cloakscrap.desc=Tiu ĉi peco de travidebla teksaĵo ŝajnas deveni de la mantelo de ombroj de pereinta Fripono. Vi plue povas senti restaĵon de mistera energio ene ĝi kaj povas tion uzi por iomete ŝargi viajn antikvaĵojn. La menciita ago tamen detruos la teksaĵon.

items.remains.sealshard.name=eroj de sigelo
items.remains.sealshard.desc=Tiuj ĉi etaj fragmentoj de ruĝa vakso ŝajnas deveni de la rompita sigelo de morta Batalisto. Vi plue sentas ombron de forta volo ene la fragmentoj kaj povas uzi ilin por akiri iomete da ŝirmo. La menciita ago tamen detruos la erojn.

items.remains.tornpage.name=elŝirita paĝo
items.remains.tornpage.desc=Tiu ĉi paĝo ŝajnas esti elŝirita el sankta librego de mortinta Kleriko. Iom da dieca energio plue restas en la librego, vi povas uzi ĝin por regajni iom da sano. La menciita ago tamen tute detruos la paĝon.



###rings
items.rings.ring.diamond=diamanta ringo
items.rings.ring.opal=opala ringo
items.rings.ring.garnet=grenata ringo
items.rings.ring.ruby=rubena ringo
items.rings.ring.amethyst=ametista ringo
items.rings.ring.topaz=topaza ringo
items.rings.ring.onyx=oniksa ringo
items.rings.ring.tourmaline=turmalina ringo
items.rings.ring.emerald=smeralda ringo
items.rings.ring.sapphire=safira ringo
items.rings.ring.quartz=kvarca ringo
items.rings.ring.agate=agata ringo
items.rings.ring.equip_cursed=La ringo dolore ĉirkaŭpremas vian fingron!
items.rings.ring.unknown_desc=Tiu ĉi metala ringo estas ornamita per granda juvelŝtono kiu briletas en la mallumo. Kiu scias kian efikon ĝi havus je surmeto?
items.rings.ring.known=Tio ĉi estas %s
items.rings.ring.identify=Vi sufiĉe ekkonis kun via ringo por identigi ĝin.
items.rings.ring.cursed_worn=Pro malbeno de tiu ĉi ringo, vi ne povas ĝin demeti.
items.rings.ring.curse_known=Vi sentas fian magion insidantan de tiu ĉi ringo.
items.rings.ring.not_cursed=Tiu ĉi ringo estas libera de fia magio.

items.rings.ringofaccuracy.name=ringo de precizo
items.rings.ringofaccuracy.stats=Kiam surmetita, tiu ĉi ringo pliigos vian precizon je _%s%%._
items.rings.ringofaccuracy.typical_stats=Kiam surmetita, tiu ĉi ringo probable pliigos vian precizon je _%s%%._
items.rings.ringofaccuracy.combined_stats=Viaj ringoj kunigas siajn povojn, ambaŭ pliigante vian precizon je _%s%%._
items.rings.ringofaccuracy.upgrade_stat_name_1=Pliigo de precizo
items.rings.ringofaccuracy.desc=Tiu ĉi ringo pliigas vian sinkoncentron, plifaciligante trafon de viaj frapoj. Sed tamen malbenita ringo malhelpos al vi trafe frapi.

items.rings.ringofarcana.name=ringo de mistera energio
items.rings.ringofarcana.stats=Kiam surmetita, tiu ĉi ringo pliigos povon de ensorĉoj kaj skribaĵoj je _%s%%._
items.rings.ringofarcana.typical_stats=Kiam surmetita, tiu ĉi ringo probable pliigos povon de ensorĉoj kaj skribaĵoj je _%s%%._
items.rings.ringofarcana.combined_stats=Viaj ringoj kunigas siajn povojn, ambaŭ plipovigante viajn ensorĉojn kaj skribaĵojn je _%s%%._
items.rings.ringofarcana.upgrade_stat_name_1=Pliigo de mistera energio
items.rings.ringofarcana.desc=Tiu ĉi ringo plipovigas ensorĉojn sur armiloj kaj skribaĵojn sur defendaĵoj, inkluzivante malbenojn! Ĝi pliigas ŝancon por aktivigi ensorĉon/skribaĵon aŭ povon de efiko, se ĝia ŝanco por aktiviĝi estas 100%. Sed tamen malbenita ringo malplifortigos ensorĉojn, skribaĵojn kaj malbenojn.

items.rings.ringofelements.name=ringo de elementoj
items.rings.ringofelements.stats=Kiam surmetita, tiu ĉi ringo liveros _%s%%_ reziston kontraŭ naturpotencoj.
items.rings.ringofelements.typical_stats=Kiam surmetita, tiu ĉi ringo probable liveros _%s%%_ reziston kontraŭ naturpotencoj.
items.rings.ringofelements.combined_stats=Viaj ringoj kunigas siajn povojn, ambaŭ pliigante vian reziston kontraŭ naturpotencoj je _%s%%._
items.rings.ringofelements.upgrade_stat_name_1=Rezisto
items.rings.ringofelements.desc=Tiu ĉi ringo peras reziston kontraŭ plejparto de elementaj kaj magiaj efikoj, malpliigante ilian malicon kaj daŭron. Sendube malbenita ringo igos tiujn efikojn pli turmentaj.

items.rings.ringofenergy.name=ringo de energio
items.rings.ringofenergy.stats=Kiam surmetita, tiu ĉi ringo pliigos rapidon de ŝargado de vergoj, antikvaĵoj kaj heroa defendaĵo je _%s%%._
items.rings.ringofenergy.typical_stats=Kiam surmetita, tiu ĉi ringo probable pliigos rapidon de ŝargado de vergoj, antikvaĵoj kaj heroa defendaĵo je _%s%%._
items.rings.ringofenergy.combined_stats=Viaj ringoj kunigas siajn povojn, ambaŭ plirapidigante ŝargadon je _%s%%._
items.rings.ringofenergy.upgrade_stat_name_1=Plirapidigo de ŝargado
items.rings.ringofenergy.desc=Viaj magiaĵoj ŝargiĝos pli rapide en la sfinksa kampo, kiu radias de tiu ĉi ringo. Malbenita ringo tamen malrapidigos ŝargadon.

items.rings.ringofevasion.name=ringo de evito
items.rings.ringofevasion.stats=Kiam surmetita, tiu ĉi ringo pliigos vian evitpovon je _%s%%._
items.rings.ringofevasion.typical_stats=Kiam surmetita, tiu ĉi ringo probable pliigos vian evitpovon je _%s%%._
items.rings.ringofevasion.combined_stats=Viaj ringoj kunigas siajn povojn, ambaŭ pliigante vian evitpovon je _%s%%._
items.rings.ringofevasion.upgrade_stat_name_1=Pliigo de evitpovo
items.rings.ringofevasion.desc=Tiu ĉi ringo plirapidigas reagoj de la portanto, malfaciligante al aliaj frapi lin. Sed tamen malbenita ringo igos la portanton pli frapebla.

items.rings.ringofforce.name=ringo de forto
items.rings.ringofforce.stats=Kun via nuna povo, kiam senarmila, portante tiun ĉi ringon, viaj frapoj kaŭzos _%1$d-%2$d vundpoentojn._ Kun surmetita armilo tiu ĉi ringo pliigos vian vundpovon je _%3$d._
items.rings.ringofforce.typical_stats=Kun via nuna povo, kiam senarmila, portante tiun ĉi ringon, viaj frapoj kaŭzos probable _%1$d-%2$d vundpoentojn._ Kun surmetita armilo tiu ĉi ringo pliigos vian vundpovon probable je _%3$d._
items.rings.ringofforce.combined_stats=Viaj ringoj kunigas siajn povojn, senarmile viaj frapoj kaŭzos _%1$d-%2$d vundpoentojn_ aŭ tenante armilon ili pliigos vian vundpovon je _%3$d._
items.rings.ringofforce.upgrade_stat_name_1=Senarmila vundpovo
items.rings.ringofforce.upgrade_stat_name_2=Pliigo de armila vundpovo
items.rings.ringofforce.upgrade_stat_name_3=Special-ataka vundpovo
items.rings.ringofforce.ability_name=kverelema humoro
items.rings.ringofforce.typical_ability_desc=Kun tiu ĉi ringo Duelistino povas alpreni _kvereleman humoron_, igante siajn normajn atakojn ĉiam uzi tiun ĉi ringon eĉ kun surmetita armilo. Ŝiaj atakoj kaŭzos _%1$d-%2$d vundpoentojn_ kaj transprenos ensorĉon kaj plivastigon de la armilo. Ŝia kverelema humoro malrapidigos ŝargadon de speciala armila atako je 50%%.
items.rings.ringofforce.ability_desc=Kun tiu ĉi ringo Duelistino povas alpreni _kvereleman humoron_, igante siajn normajn atakojn ĉiam uzi tiun ĉi ringon eĉ kun surmetita armilo. Ŝiaj atakoj kaŭzos probable _%1$d-%2$d vundpoentojn_ kaj transprenos ensorĉon kaj plivastigon de la armilo. Ŝia kverelema humoro malrapidigos ŝargadon de speciala armila atako je 50%%.
items.rings.ringofforce.desc=Tiu ĉi ringo pliigas forton de batoj de la portanto. La kroma forto estas malgrava dum uzi armilojn, sed senarmilaj atakoj estos signife pli fortaj. Tamen malbenita ringo malfortigos batojn de la portanto.
items.rings.ringofforce$brawlersstance.name=kverelema humoro
items.rings.ringofforce$brawlersstance.desc=Dum alpreni kvereleman humoron normaj atakoj de Duelistino uzas ringon de forto eĉ kiam ŝi tenas armilon. Tiuj atakoj havas kroman vundpovon kaj plue uzas ensorĉon kaj plivastigon de la armilo.\n\nTamen por esti en kverelema humoro ŝi devas koncentriĝi, do ŝargado de speciala armila atako malpliiĝas je 50%.\n\nLa kvereleman humoron vi povas aktivigi/malaktivigi uzante ringon de forto, sed malpliigo de ŝargado de speciala armila atako daŭros por iomete pli longe je rapida aktivigo kaj malaktivigo.

items.rings.ringoffuror.name=ringo de furiozo
items.rings.ringoffuror.stats=Kiam surmetita, tiu ĉi ringo pliigos vian fraprapidon je _%s%%._
items.rings.ringoffuror.typical_stats=Kiam surmetita, tiu ĉi ringo probable pliigos vian fraprapidon je _%s%%._
items.rings.ringoffuror.combined_stats=Viaj ringoj kunigas siajn povojn, ambaŭ pliigante vian fraprapidon je _%s%%._
items.rings.ringoffuror.upgrade_stat_name_1=Pliigo de fraprapido
items.rings.ringoffuror.desc=Tiu ĉi ringo donas al la portanto enan furiozon, ebligante ataki pli rapide. Sed tamen malbenita ringo malrapidigos frapojn de la portanto.

items.rings.ringofhaste.name=ringo de rapido
items.rings.ringofhaste.stats=Kiam surmetita, tiu ĉi ringo pliigos vian movrapidon je _%s%%._
items.rings.ringofhaste.typical_stats=Kiam surmetita, tiu ĉi ringo probable pliigos vian movrapidon je _%s%%._
items.rings.ringofhaste.combined_stats=Viaj ringoj kunigas siajn povojn, ambaŭ pliigante vian movrapidon je _%s%%._
items.rings.ringofhaste.upgrade_stat_name_1=Pliigo de movrapido
items.rings.ringofhaste.desc=Tiu ĉi ringo malpliigas pezecon de paŝoj de la uzanto, ebligante kuri kun superhoma rapido. Sed tamen malbenita ringo aldonos pezon por malrapidigi la portanton.

items.rings.ringofmight.name=ringo de potenco
items.rings.ringofmight.stats=Kiam surmetita, tiu ĉi ringo pliigos vian povon je _%1$d_ kaj vian san-enhavecon je _%2$s%%._
items.rings.ringofmight.typical_stats=Kiam surmetita, tiu ĉi ringo probable pliigos vian povon je _%1$d_ kaj vian san-enhavecon je _%2$s%%._
items.rings.ringofmight.combined_stats=Viaj ringoj kunigas siajn povojn, ambaŭ pliigante vian povon je _%1$d_ kaj vian san-enhavecon je _%2$s%%._
items.rings.ringofmight.upgrade_stat_name_1=Pliigo de povo
items.rings.ringofmight.upgrade_stat_name_2=Pliigo de san-enhaveco
items.rings.ringofmight.desc=Tiu ĉi ringo plibonigas korpajn lertecojn de la portanto, donante al li fizikan forton kaj konscion. Malbenita ringo malfortigos la portanton.

items.rings.ringofsharpshooting.name=ringo de trafĵetado
items.rings.ringofsharpshooting.stats=Kiam surfingrita, tiu ĉi ringo pliigos vundpovon de viaj ĵetarmiloj samkiel ilia nivelo pliiĝus je _%1$d_ kaj pliigos ilian firmecon je _%2$s%%._
items.rings.ringofsharpshooting.typical_stats=Kiam surfingrita, tiu ĉi ringo probable pliigos vundpovon de viaj ĵetarmiloj samkiel ilia nivelo pliiĝus je _%1$d_ kaj pliigos ilian firmecon je _%2$s%%._
items.rings.ringofsharpshooting.combined_stats=Viaj ringoj kunigas siajn povojn, ambaŭ pliigante vundpovon de iaj ĵetarmiloj samkiel ilia nivelo pliiĝus je _%1$d_ kaj pliigante ilian firmecon je _%2$s%%._
items.rings.ringofsharpshooting.upgrade_stat_name_1=Pliigo de vundpova nivelo
items.rings.ringofsharpshooting.upgrade_stat_name_2=Pliigo de firmeco
items.rings.ringofsharpshooting.desc=Tiu ĉi ringo plibonigas precizon kaj celadon de la portanto, igante ĉiujn ĵetarmilojn pli precizaj kaj solidaj. Sed tamen malbenita ringo havos inversan efikon.

items.rings.ringoftenacity.name=ringo de persisto
items.rings.ringoftenacity.stats=Kiam surmetita, tiu ĉi ringo malplifortigos ricevatajn vundojn maksimume je _%s%%._
items.rings.ringoftenacity.typical_stats=Kiam surmetita, tiu ĉi ringo probable malplifortigos ricevatajn vundojn maksimume je _%s%%._
items.rings.ringoftenacity.combined_stats=Viaj ringoj kunigas siajn povojn, ambaŭ malplifortigante ricevatajn vundojn maksimume je _%s%%._
items.rings.ringoftenacity.upgrade_stat_name_1=Maksimuma vund-rezisto
items.rings.ringoftenacity.desc=Dum portado tiu ĉi ringo ebligos al uzanto rezisti kutime mortigajn frapojn. Ju pli vundita la portanto estas, des pli rezista kontraŭ vundoj li estas. Sed tamen malbenita ringo plifaciligos al kontraŭuloj mortigi la aventuriston.

items.rings.ringofwealth.name=ringo de prospero
items.rings.ringofwealth.stats=Kiam surmetita, tiu ĉi ringo pliigos vian bonŝancon je _%s%%._
items.rings.ringofwealth.typical_stats=Kiam surmetita, tiu ĉi ringo probable pliigos vian bonŝancon je _%s%%._
items.rings.ringofwealth.combined_stats=Viaj ringoj kunigas siajn povojn, ambaŭ pliigante vian bonŝancon je _%s%%._
items.rings.ringofwealth.upgrade_stat_name_1=Pliigo de bonŝanco
items.rings.ringofwealth.desc=Tiu ĉi ringo verŝajne altiras trezorojn, pliigante ŝancon, ke monstroj kaj kofroj portos/tenos valorajn aĵojn. Sed tamen malbenita ringo malpliigos vian ŝancon por trovi valoraĵojn.



