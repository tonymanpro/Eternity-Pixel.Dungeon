items.quest.dwarftoken.discover_hint=You can find this item during a specific quest.
items.quest.embers.discover_hint=You can find this item during a specific quest.
items.quest.escapecrystal.name=escape crystal
items.quest.escapecrystal.ac_use=USE
items.quest.escapecrystal.desc=A thin magical spell crystal that seems to contain teleportation magic. You can use the crystal at any time to leave the dwarven vault, but you won't be able to take anything out with you!
items.quest.escapecrystal.discover_hint=You can find this item during a specific quest.
items.quest.gooblob.discover_hint=You can get this item as a drop from certain enemies.
items.quest.metalshard.discover_hint=You can get this item as a drop from certain enemies.
items.quest.pickaxe.discover_hint=You can find this item during a specific quest.
items.remains.remainsitem.discover_hint=You can find this item in the remains of a specific hero from a previous lost run.
items.remains.tornpage.name=torn page
items.remains.tornpage.desc=This page looks like it was ripped out of an expired Cleric's holy tome. There's still a little divine energy clinging to it, you can use it to regain a little bit of health. Doing this will destroy the torn page however.
items.scrolls.exotic.exoticscroll.discover_hint=You can craft this item via alchemy.
items.scrolls.exotic.scrollofmetamorphosis.cancel_warn=Cancelling will still consume your scroll of metamorphosis, are you sure?
items.spells.spell.discover_hint=You can craft this item via alchemy.
items.stones.runestone.discover_hint=You can find this item randomly in the dungeon, or craft it via alchemy.
items.stones.stoneofaugmentation.discover_hint=You can buy this item in a shop, or craft it via alchemy.
items.stones.stoneofdetectmagic.name=stone of detect magic
items.stones.stoneofdetectmagic.inv_title=Detect an item
items.stones.stoneofdetectmagic.detected_none=You don't detect any magic affecting this item.
items.stones.stoneofdetectmagic.detected_both=You detect both positive and malevolent magic affecting this item!
items.stones.stoneofdetectmagic.detected_good=You detect positive magic affecting this item!
items.stones.stoneofdetectmagic.detected_bad=You detect malevolent magic affecting this item!
items.stones.stoneofdetectmagic.desc=This runestone is able to detect magic affecting an item. Using this stone on an unidentified item will tell you if it is affected by a malevolent curse and whether it is affected by positive magic such as an enchantment or upgrades.
items.trinkets.chaoticcenser.spew=Your censer is about to spew: %s.
items.trinkets.crackedspyglass.name=cracked spyglass
items.trinkets.crackedspyglass.desc=This handheld telescope would be a demonstration of great and precise workmanship, if it weren't for the crack along its front lens. The spyglass seems to be helping you by revealing new items in the dungeon, but due to its flaw the revealed items are quite hard to see!
items.trinkets.crackedspyglass.typical_stats_desc=Typically this trinket has a _%1$s%% chance_ to create an extra hidden item on each non-boss floor.
items.trinkets.crackedspyglass.stats_desc=At its current level, this trinket has a _%1$s%% chance_ to create an extra hidden item on each non-boss floor.
items.trinkets.crackedspyglass.stats_desc_upgraded=At its current level, this trinket has a _100%% chance_ to create an extra hidden item on each non-boss floor, and a _%1$s%% chance_ to create a second extra hidden item.
items.trinkets.trinketcatalyst.window_title=create a trinket
items.trinkets.trinket.discover_hint=This item has a chance to be an option whenever you craft a trinket via alchemy.
items.wands.wandofblastwave.knockback_ondeath=The collision killed you...
items.wands.wandofmagicmissile.discover_hint=One of the heroes starts with this item.
items.weapon.melee.crossbow.typical_stats_desc=Typically this weapon enhances thrown darts to deal _%1$d-%2$d damage_ when it is equipped, and will even grant its enchantment to them.
items.weapon.melee.cudgel.name=cudgel
items.weapon.melee.cudgel.stats_desc=This is a rather accurate weapon.
items.weapon.melee.cudgel.ability_name=heavy blow
items.weapon.melee.cudgel.typical_ability_desc=The Duelist can perform a _heavy blow_ with a cudgel. This concentrated attack typically deals _%1$d-%2$d damage_ if it surprised the enemy, and dazes them for 5 turns which reduces accuracy and evasion by 50%%. Heavy blow always hits but deals regular damage if it does not surprise the enemy.
items.weapon.melee.cudgel.ability_desc=The Duelist can perform a _heavy blow_ with a cudgel. This concentrated attack deals _%1$d-%2$d damage_ if it surprised the enemy, and dazes them for 5 turns which reduces accuracy and evasion by 50%%. Heavy blow always hits but deals regular damage if it does not surprise the enemy.
items.weapon.melee.cudgel.desc=A small brass mace, made more as a self-defense tool for nobles than as an adventuring weapon.
