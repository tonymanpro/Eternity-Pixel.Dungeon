items.weapon.melee.wornshortsword.discover_hint=Iu el la herooj komencas kun tiu ĉi aĵo.


###missile weapons
items.weapon.missiles.darts.adrenalinedart.name=adrenalina sageto
items.weapon.missiles.darts.adrenalinedart.desc=Tiuj ĉi sagetoj estas trempitaj en viglokard-devenan substancon, kiu por mallonga tempo pliigos movrapidon kaj atakrapidon de via amikoj kaj malpliigos movrapidon de viaj kontraŭuloj. La sageto mem povas vundi malamikojn, sed ne vundos amikojn.

items.weapon.missiles.darts.blindingdart.name=blindiga sageto
items.weapon.missiles.darts.blindingdart.desc=Tiuj ĉi sagetoj estas trempitaj en blindherb-devenan substancon, kiu blindigos la viktimon por mallonga tempo. Tamen ili ne senorientigos la viktimon, do li plue scios kiam li lastatempe vidis vin.

items.weapon.missiles.darts.chillingdart.name=trankviliga sageto
items.weapon.missiles.darts.chillingdart.desc=Tiuj ĉi sagetoj estas trempitaj en glacibobel-devenan substancon, kiu serioze malvarmigos la viktimon.

items.weapon.missiles.darts.cleansingdart.name=puriga sageto
items.weapon.missiles.darts.cleansingdart.desc=Tiuj ĉi sagetoj estas trempitaj en la substancon devenan de vegetaĵoj nomitaj reĝmagoj. La substanco portempe igos amikojn rezistaj al ĉiuj minacaj efikoj aŭ nuligos pozitivajn efikojn de viaj malamikoj. Monstroj eĉ povas provizore forgesi pri ataki aŭ ĉasi vin. La sageto mem povas vundi malamikojn, sed ne vundos amikojn.

items.weapon.missiles.darts.dart.name=sageto
items.weapon.missiles.darts.dart.ac_tip=TREMPI
items.weapon.missiles.darts.dart.prompt=Elektu semon
items.weapon.missiles.darts.dart.tip_title=Trempi sagetojn
items.weapon.missiles.darts.dart.tip_desc=Oni povas kombini semon kun unu aŭ du sagetoj por saturi ilin per substanco de la semo. Per ĉiu speco de semo oni povas krei malsaman trempitan sageton kun unika por-unu-uza efiko.\n\nLa _%s_ fariĝos el trempi sageton kun tiu ĉi semo.
items.weapon.missiles.darts.dart.tip_all=trempi %1$d sagetojn kun %2$d semoj
items.weapon.missiles.darts.dart.tip_two=trempi 2 sagetojn kun 1 semo
items.weapon.missiles.darts.dart.tip_one=trempi 1 sageton kun 1 semo
items.weapon.missiles.darts.dart.tip_cancel=rezigni
items.weapon.missiles.darts.dart.desc=Tiuj ĉi simplaj akrigitaj lignaj sagetoj estas ekvilibrigitaj por flugi rekte al la celo kaj piki ĝin dolore. Oni povas trempi ilin kun semoj por akiri ekstrajn efikojn je ĵeto.
items.weapon.missiles.darts.dart.unlimited_uses=Pro ilia simpla strukturo tiuj sagetoj neniam rompiĝos.

items.weapon.missiles.darts.displacingdart.name=teleportanta sageto
items.weapon.missiles.darts.displacingdart.desc=Tiuj ĉi sagetoj estas trempitaj en perefoli-devenan substancon, kiu teleportos la viktimon je proksima distanco.

items.weapon.missiles.darts.healingdart.name=saniga sageto
items.weapon.missiles.darts.healingdart.desc=Tiuj ĉi sagetoj estas trempitaj en sunherb-devenan substancon, kiu ellasos sanigan energion al la celo. La sageto mem povas vundi malamikojn, sed ne vundos amikojn.

items.weapon.missiles.darts.holydart.name=sankta sageto
items.weapon.missiles.darts.holydart.desc=Tiuj ĉi sagetoj estas trempitaj en stelflor-devenan substancon, kiu plenigos la celon per sankta povo. Amikoj kaj kutimaj kontraŭuloj estos benitaj, tamen nemortaj kaj demonaj monstroj ricevos signifajn vundojn. La sageto mem povas vundi malamikojn, sed ne vundos amikojn.

items.weapon.missiles.darts.incendiarydart.name=bruliga sageto
items.weapon.missiles.darts.incendiarydart.desc=Tiuj ĉi sagetoj estas trempitaj en fajroflor-devenan substancon, kiu ekflamos je frapo.

items.weapon.missiles.darts.paralyticdart.name=paraliza sageto
items.weapon.missiles.darts.paralyticdart.desc=Tiu ĉi sagetoj estas trempitaj en terradik-devenan substancon, kiu paralizos la celon por mallonga tempo.

items.weapon.missiles.darts.poisondart.name=venena sageto
items.weapon.missiles.darts.poisondart.desc=Tiuj ĉi sagetoj estas trempitaj en ĉagrenmusk-devenan substancon, kiu venenos la viktimon.

items.weapon.missiles.darts.rotdart.name=enradikigita sageto
items.weapon.missiles.darts.rotdart.desc=Tiuj ĉi fiaj sagetoj estas trempitaj en acidan putrober-devenan substancon, kiu agrese tramordos ĉion tuŝantan la sageton. Fortaj monstroj kontrŭstaros plejparton de la efiko, tamen la korodo estas sufiĉe forta por facile mortigi plejparton da ordinaraj monstroj. Enradikigitaj sagetoj estas pli firmaj ol aliaj trempitaj sagetoj, sed ne eblas pliigi ilian firmecon.
items.weapon.missiles.darts.rotdart.discover_hint=Vi povas krei tian aĵon uzante semon de la specifa misio.

items.weapon.missiles.darts.shockingdart.name=ŝoka sageto
items.weapon.missiles.darts.shockingdart.desc=Tiuj ĉi sagetoj estas trempitaj en ŝtormplant-devenan substancon, kiu ellasos fian ŝokon al la viktimo.

items.weapon.missiles.darts.tippeddart.ac_clean=PURIGI
items.weapon.missiles.darts.tippeddart.clean_title=Purigi sagetojn
items.weapon.missiles.darts.tippeddart.clean_desc=Tio ĉi purigos viajn sagetojn de substancoj de semoj, igante ilin reen normaj sagetoj.
items.weapon.missiles.darts.tippeddart.clean_all=puriĝi ĉiujn
items.weapon.missiles.darts.tippeddart.clean_one=purigi unu
items.weapon.missiles.darts.tippeddart.cancel=rezigni
items.weapon.missiles.darts.tippeddart.uses_left=De tiu ĉi amaso de trempitaj sagetoj unu el ili perdos sian substancon post _%d%d_ uzoj.
items.weapon.missiles.darts.tippeddart.unlimited_uses=_Tamen tiuj ĉi estas tiel altkvalitaj, ke ili neniam eluzos._
items.weapon.missiles.darts.tippeddart.about_to_break=Via trempita sageto baldaŭ perdos sian substancon.
items.weapon.missiles.darts.tippeddart.has_broken=Finaĵo de tiu ĉi trempita sageto perdis sian substancon.
items.weapon.missiles.darts.tippeddart.discover_hint=Vi povas aĉeti tian aĵon en vendejo aŭ krei ĝin uzante semon.


items.weapon.missiles.bolas.name=ĵetbulo
items.weapon.missiles.bolas.stats_desc=Tiu ĉi armilo kripligas la celon.
items.weapon.missiles.bolas.desc=Tiuj ĉi nekutimaj ĵetarmiloj ne sufiĉe forte vundas, sed ili perfekte malrapidigas la celon.

items.weapon.missiles.boomerang.name=bumerango
items.weapon.missiles.boomerang.desc=Ĵetita al kontraŭulo, tiu ĉi ebena kurba ligna ĵetarmilo revenos al manoj de sia ĵetinto.
items.weapon.missiles.boomerang.durability=Pro ĝia solida strukturo, tiu ĉi bumerango ne rompiĝos dum uzado.

items.weapon.missiles.fishingspear.name=harpuno
items.weapon.missiles.fishingspear.desc=Malgrandaj ĵetlancoj, kiuj funkcias kiel mem-preparitaj armiloj, malgraŭ la fakto esti destinitaj por kapti fiŝojn.

items.weapon.missiles.forcecube.name=kubo de forto
items.weapon.missiles.forcecube.ondeath=Vi mortigis vin mem per via kubo de forto…
items.weapon.missiles.forcecube.stats_desc=Tiu ĉi ĵetarmilo disigas forton de sia falo sur malgrandan areon, difektante ĉion proksime.
items.weapon.missiles.forcecube.desc=Tiuj ĉi strangformaj magiaj kuboj estas sufiĉe kompaktaj por via mano, tamen samtempe ili estas neimageble pezaj.

items.weapon.missiles.heavyboomerang.name=peza bumerango
items.weapon.missiles.heavyboomerang.stats_desc=Tiu ĉi ĵetarmilo revenas al la loko el kiu ĝi estis ĵetita post kvin temperoj.
items.weapon.missiles.heavyboomerang.desc=Estas malfacile efike teni tiun ĉi grandan bumerangon, tamen ĝi kaŭzos signifajn vundojn.

items.weapon.missiles.javelin.name=ĵetlancego
items.weapon.missiles.javelin.desc=Tiuj ĉi grandaj ĵetlancoj estas ekvilibrigitaj por ke iliaj pikaj finaĵoj ŝovu antaŭen tra la aero.

items.weapon.missiles.kunai.name=kunaj’
items.weapon.missiles.kunai.stats_desc=Tiu ĉi armilo estas pli efika kontraŭ surprizitaj malamikoj.
items.weapon.missiles.kunai.desc=Tiuj ĉi etaj tranĉiloj estas tre potencaj en manoj de sperta uzanto.

items.weapon.missiles.missileweapon.stats_known=Tiu ĉi aro da _%1$d-supernivelaj_ ĵetarmiloj kaŭzas _%2$d-%3$d vundpoentojn_ kaj postulas _%4$d povpoentojn_ por uzi ĝin ĝuste.
items.weapon.missiles.missileweapon.stats_unknown=Kutime tiu ĉi aro da _%1$d-supernivelaj_ ĵetarmiloj kaŭzas _%2$d-%3$d vundpoentojn_ kaj postulas _%4$d povpoentojn_ por uzi ĝin ĝuste.
items.weapon.missiles.missileweapon.stats_desc=
items.weapon.missiles.missileweapon.probably_too_heavy=Probable tiu ĉi armilo estas tro peza por vi.
items.weapon.missiles.missileweapon.distance=Ĵetarmiloj estas pli precizaj je distanco kaj malpli precizaj kontraŭ apudaj malamikoj.
items.weapon.missiles.missileweapon.durability=Ĵetarmiloj rompiĝas dum uzado.
items.weapon.missiles.missileweapon.uses_left=Tiu ĉi aro da ĵetarmiloj havas _%d/%d_ uzojn antaŭ ol unu el ili rompiĝos.
items.weapon.missiles.missileweapon.unlimited_uses=Tiu ĉi aro estas tiel altkvalita, ke ĝi neniam rompiĝos.
items.weapon.missiles.missileweapon.unknown_uses=Tiu ĉi aro da ĵetarmiloj probable havas _%d_ uzojn antaŭ ol unu el ili rompiĝos.
items.weapon.missiles.missileweapon.curse_discover=Tiu ĉi ĵetarmilo estas malbenita!
items.weapon.missiles.missileweapon.about_to_break=Via ĵetarmilo baldaŭ rompiĝos.
items.weapon.missiles.missileweapon.has_broken=Iu el viaj ĵetarmiloj rompiĝis.
items.weapon.missiles.missileweapon.dust=La ĵetarmilo dispolviĝis, kiam vi tuŝis ĝin.
items.weapon.missiles.missileweapon.break_upgraded_warn_desc=Se la lasta ĵetarmilo el via plibonigita aro da ĵetarmiloj disrompiĝos, la aro estos neinversigeble perdita. Ĉu vi certe volas ĵeti ĝin?
items.weapon.missiles.missileweapon.break_upgraded_warn_yes=Jes
items.weapon.missiles.missileweapon.break_upgraded_warn_no=Ne
items.weapon.missiles.missileweapon$placeholder.name=ĵetarmilo

items.weapon.missiles.shuriken.name=ĵetponardo
items.weapon.missiles.shuriken.stats_desc=Ĵetponardojn oni povas ĵeti senprokraste unufoje je 20 temperoj.
items.weapon.missiles.shuriken.desc=Tiuj ĉi stelformaj metalpecoj kun akraj klingoj povas esti ĵetitaj dum moviĝi.
items.weapon.missiles.shuriken$shurikeninstanttracker.name=Trankvil-tempo por ĵetponardoj
items.weapon.missiles.shuriken$shurikeninstanttracker.desc=Antaŭ nelonga tempo vi senprokraste ĵetis ĵetponardon kaj nun devas atendi ĝis la sekva senprokrasta ĵeto. Vi plue povas ĵeti ĵetponardojn, sed kun norma rapido.\n\nTemperoj por atendi: %s.

items.weapon.missiles.throwingclub.name=ĵetklabo
items.weapon.missiles.throwingclub.stats_desc=Tiu ĉi armilo ne alkroĉiĝas al viktimoj kaj povas esti kolektita senprokraste.
items.weapon.missiles.throwingclub.desc=Simpla, sed firma ĵetarmilo: granda ŝtono kunligita kun bastono.

items.weapon.missiles.throwinghammer.name=ĵetmartelo
items.weapon.missiles.throwinghammer.stats_desc=Tiu ĉi armilo ne alkroĉiĝas al viktimoj kaj povas esti kolektita senprokraste.
items.weapon.missiles.throwinghammer.desc=Tiuj ĉi grandetaj marteloj estas projektitaj por ĵeti al kontraŭulo. Danke al ilia glata tute metala formo, ili estas malfacile rompeblaj.

items.weapon.missiles.throwingknife.name=ĵettranĉilo
items.weapon.missiles.throwingknife.stats_desc=Tiu ĉi armilo estas pli efika kontraŭ surprizitaj malamikoj.
items.weapon.missiles.throwingknife.desc=Tiuj ĉi malpezaj tranĉiloj estas ekvilibrigitaj por arkmovi tra la aero al la celo.
items.weapon.missiles.throwingknife.discover_hint=Iu el la herooj komencas kun tiu ĉi aĵo.

items.weapon.missiles.throwingspear.name=ĵetlanco
items.weapon.missiles.throwingspear.desc=Tiuj ĉi malpezaj lancoj distingiĝas per maldikaj teniloj, kiuj estas projektitaj por ĵeti, ne por puŝi.

items.weapon.missiles.throwingspike.name=ĵetpikilo
items.weapon.missiles.throwingspike.desc=Tiuj ĉi firmaj akrigitaj metalpecoj estas projektitaj por ĵeti al malproksimaj kontraŭuloj.
items.weapon.missiles.throwingspike.discover_hint=Iu el la herooj komencas kun tiu ĉi aĵo.

items.weapon.missiles.throwingstone.name=ĵetŝtono
items.weapon.missiles.throwingstone.desc=Tiuj ĉi ŝtonoj estas glatigitaj por esti ĵeteblaj pli malproksime ol normaj ŝtonoj.
items.weapon.missiles.throwingstone.discover_hint=Iu el la herooj komencas kun tiu ĉi aĵo.

items.weapon.missiles.tomahawk.name=ĵethakilo
items.weapon.missiles.tomahawk.stats_desc=Tiu ĉi armilo igas viktimon _sangadi kun %1$d-%2$d vundpoentoj_.
items.weapon.missiles.tomahawk.typical_stats_desc=Tiu ĉi armilo igas viktimon _sangadi kutime kun %1$d-%2$d vundpoentoj_.
items.weapon.missiles.tomahawk.desc=Tiuj ĉi ĵethakiloj karakterizas per segformaj dentoj, kiuj eluziĝas je alkroĉiĝi al kontraŭulo.

items.weapon.missiles.trident.name=tridento
items.weapon.missiles.trident.desc=Masivaj ĵetlancoj kun tri mortigaj dentoj ĉe la fino. Ili estas potencaj, sed eĉ pezaj.


items.weapon.spiritbow.name=spirita pafarko
items.weapon.spiritbow.ac_shoot=PAFI
items.weapon.spiritbow.prompt=Elektu celon
items.weapon.spiritbow.stats=Tiu ĉi pafarko ne povas esti rekte plibonigita, sed ĝi iĝos pli forta dum kiam vi pliniveliĝos. Je via nuna nivelo, sagoj pafitaj per tiu pafarko kaŭzas _%1$d-%2$d vundpoentojn_ kaj postulas _%3$d povpoentojn_ por uzi ĝin ĝuste.
items.weapon.spiritbow.desc=Pafarko farita el antikva magia ligno. Ĝiaj arkoŝnuro kaj arkbrakoj briletas je blueta lumo. Kiam oni streĉas la arkoŝnuron, magia sago aperos kaj povas esti pafita al kontraŭulo.
items.weapon.spiritbow.discover_hint=Iu el la herooj komencas kun tiu ĉi aĵo.

items.weapon.weapon.identify=Vi sufiĉe ekkonis kun via armilo por identigi ĝin.
items.weapon.weapon.too_heavy=Pro via nesufiĉa povo, uzado de tiu ĉi armilo malpliigos vian frap-rapidon, precizon kaj povon por surpriza atako.
items.weapon.weapon.excess_str=Pro via troa povo, vi kaŭzos _0-%d kroma(j)n vundpoento(j)n_ per tiu ĉi armilo.
items.weapon.weapon.hardening_gone=Tiu ĉi armilo eluziĝis, ĝi ne estas plu hardita!
items.weapon.weapon.incompatible=Reciproka kontraŭago de diversaj magioj vakigis la ensorĉon de tiu ĉi armilo!
items.weapon.weapon.cursed_worn=Pro malbeno de tiu ĉi armilo, vi ne povas ĝin demeti.
items.weapon.weapon.cursed=Vi sentas fian magion insidantan de tiu ĉi armilo.
items.weapon.weapon.weak_cursed=Malgraŭ esti malbenita, vi povis demeti tiun ĉi armilon.
items.weapon.weapon.not_cursed=Tiu ĉi armilo estas libera de fia magio.
items.weapon.weapon.faster=Ĝi estas plivastigita por pliigi _rapidon._
items.weapon.weapon.stronger=Ĝi estas plivastigita por pliigi _vundpovon._
items.weapon.weapon.enchanted=Ĝi estas plenigita per _%s._
items.weapon.weapon.enchant_hardened=Ĝi estas _hardita._
items.weapon.weapon.hardened_no_enchant=Tiu ĉi armilo estas _hardita,_ sed ne estas nuntempe ensorĉita.
items.weapon.weapon$enchantment.enchant=ensorĉo
items.weapon.weapon$enchantment.rankings_desc=Mortigita pro ensorĉo
items.weapon.weapon$enchantment.discover_hint=Vi povas trovi aĵon kun tiu efiko ie hazarde en la labirinto, aŭ provi apliki ĝin al iu aĵo mem.


###misc items
items.amulet.name=amuleto de Jendor’
items.amulet.ac_end=FINI LA LUDON
items.amulet.desc=Amuleto de Jendor’ estas la plej potenca artefakto konata al homoj kaj gnomoj. Ĝiaj brilantaj kristaloj entenas neimageblan kaj fenomenan povon.
items.amulet.desc_origins=La deveno de la amuleto estas nekonata. Oni diras, ke la Reĝo de Gnomoj fanfaronis pri trovi tiun ĉi antikvaĵon tuj antaŭ ol la metropolo perdis konekton kun la mondo. Kie li trovis ĝin? Kiel Jog-Dzeva prenis la amuleton el li? Demandoj por alia tempo, la plej grava afero estas, ke la amuleto nun estas via!
items.amulet.desc_ascent=La deveno de la amuleto estas nekonata, sed certe Jog-Dzeva influas sur ĝi. Ŝajnas, ke la labirinto submetas sin al la volo de Jog-Dzeva plifortigante kaj plimultigante monstrojn! Krom tio, vi ne povas aktivigi aŭ faligi la amuleton, samkiel ĝi estus malbenita.
items.amulet.ascent_title=Ascendo
items.amulet.ascent_desc=Vi sentas teruran neimageblan potencon de Jog-Dzeva, kiu elradias el la amuleto. Reveno al la supraĵo tra la labirinto kiel karnulo povas esti pli malfacila ol vi komence pensis!\n\nSe vi pluigos iradon supren kun la amuleto, la labirinto estos pli danĝera, teleportado inter keletaĝoj ne eblos kaj ununura maniero por venki la ludon estos atingi la supraĵon irante tra la labirinto mortigante monstrojn survoje!\n\nVi povas faligi la amuleton tie ĉi, se vi volas supreniri sen akcepti tiun ĉi defion; aŭ aktivigi la amuleton antaŭ ol iri supren por norme fini la ludon.
items.amulet.ascent_yes=Pluigi!
items.amulet.ascent_no=Halti pormomente
items.amulet.discover_hint=Vi povas trovi tiun aĵon sur la fundo de la labirinto…

items.ankh.name=anĥo
items.ankh.ac_bless=BENI
items.ankh.bless=Vi benis la anĥon per magia akvo.
items.ankh.desc=Tiu ĉi antikva emblemo de senmorteco ebligas reviviĝi post morto. Post reviviĝo plejparto de havaĵoj faligos en la lokon de morto, sed povas esti rekolektitaj se vi revenos tien. Per felsako plena de magia akvo, la anĥo povas esti benita por pliigi ĝian povon.
items.ankh.desc_blessed=Tiu ĉi antikva emblemo de senmorteco ebligas reviviĝi post morto. La anĥo estas benita kaj nun estas pli pova. La anĥo oferos sin por savi vin je momento de via morto.
items.ankh.discover_hint=Vi povas aĉeti tian aĵon en vendejo.

items.arcaneresin.name=mistera rezino
items.arcaneresin.prompt=Elektu vergon
items.arcaneresin.ac_apply=APLIKI
items.arcaneresin.level_too_high=Tiu ĉi vergo estas tro potenca por plibonigi per rezino.
items.arcaneresin.not_enough=Mankas rezino por fari tion ĉi!
items.arcaneresin.apply=Vi tegis vian vergon per la rezino, pliigante ĝian povon!
items.arcaneresin.desc=Tiu ĉi pulvoro briletas per tonoj de purpuro kaj kaj blanko. Oni povas uzi ĝin kiel plifortigilon de magiaj energioj kaj apliki ĝin al vergoj pliigante iliajn energiojn!\n\nPlibonigo de vergo uzas 1, 2 aŭ 3 porciojn de la rezino depende de komenca nivelo de la vergo. Maksimuma nivelo de plibonigo de vergo per la rezino estas +3.\n\nPlibonigoj per rezino estas _anstataŭigataj per aliaj plibonigoj_ (ekzemple per skribrulaĵoj de plibonigo), kaj ne aplikiĝas je plenigi la magiistan bastonegon per la vergo.
items.arcaneresin.discover_hint=Vi povas kuiri tian aĵon per alĥemio.

items.brokenseal.name=rompita sigelo
items.brokenseal.ac_affix=SURMETI
items.brokenseal.prompt=Elektu defendaĵon
items.brokenseal.unknown_armor=Vi devas unue identigi, ĉu tiu defendaĵo ne estas malbenita.
items.brokenseal.cursed_armor=Vi ne povas surmeti sigelon al malbenita defendaĵo.
items.brokenseal.affix=Vi surmetis la sigelon al via defendaĵo!
items.brokenseal.desc=Vaksa sigelo surmetita al defendaĵo kiel emblemo de kuraĝo. Sur ĝia centro troviĝas paliĝinta runo de protekto, la sigelo estas rompita laŭ la mezo.\n\nMemoraĵo el lia hejmo, la sigelo helpas al Batalisto travivi. Kun surmetita sigelo Batalisto senprokraste akiros ŝirmon, kiam li estos vundita kaj havos malpli ol duono de sano.\n\nLa sigelo povas esti _surmetita al defendaĵo,_ kaj portita inter defendaĵoj. La sigelo povas transigi unu plibonigon, tiu ĉi plibonigo devas esti aplikita al defendaĵo kun surmetita sigelo.
items.brokenseal.inscribed=La sigelo estas surskribita per _%s._
items.brokenseal.choose_title=Elektu skribaĵon
items.brokenseal.choose_desc=Kaj tiu ĉi defendaĵo kaj la rompita sigelo portas skribaĵon. Elektu skribaĵon por konservi.\n\nSkribaĵo sur defendaĵo: %1$s\nSkribaĵo sur rompita sigelo: %2$s\n\nRimarku, ke se vi elektos skribaĵon, kiu estas sur la defendaĵo, la sigelo poste ne povos transigi ĝin.
items.brokenseal.discover_hint=Iu el la herooj komencas kun tiu ĉi aĵo.
items.brokenseal$warriorshield.name=Batalista ŝirmo
items.brokenseal$warriorshield.desc_active=La rompita sigelo helpas al Batalisto travivi, liverante al li ŝirmon super lia sano. Necesas atendi – post la unua aktivigo de ŝirmo – antaŭ ol povi reuzi ĝin.\n\nTiu ĉi ŝirmo ne etiĝas laŭtempe, sed finos, kiam neniu amiko ĉeestos Bataliston dum kelkaj temperoj. Kiam ĝi finos, ĉiu neuzita ŝirm-poento etigos la tempon necesan por atendi, sed maksimume je 50%%.\n\nPlia ŝirmo: %1$d.\n\nNecesa tempo por atendi: %2$d.
items.brokenseal$warriorshield.desc_cooldown=Batalisto lastatempe akiris ŝirmon de sia rompita sigelo kaj nun devas atendi antaŭ ol povi profiti de tiu ŝirma efiko.\n\nPliaj temperoj por atendi: %d.
items.brokenseal$warriorshield.desc_negative_cooldown=La trankvil-tempo de rompita sigelo estas nuntempe negative, tio signifas, ke kiam lia ŝirmo aktiviĝos, necesos atendi malpli ol 150 temperojn. La trankvil-tempo de rompita sigelo povas esti etigita maksimume al -150 temperoj, tio signifas, ke ĝi estos akireble tuj post aktiviĝo.\n\nPliaj temperoj por atendi: %d.

items.dewdrop.name=rosero
items.dewdrop.already_full=Vi jam estas sana.
items.dewdrop.desc=Guto da klara roso.\n\nPro la magio de tiu ĉi loko, pura akvo estas ete saniga.

items.equipableitem.curse_detected=Tuj antaŭ ol surmeti tiun ĉi aĵon, vi eksentis, ke ĝi estas malbenita!
items.equipableitem.unequip_cursed=Vi ne povas demeti malbenitan aĵon!
items.equipableitem.ac_equip=SURMETI
items.equipableitem.ac_unequip=DEMETI

items.energycrystal.name=kristalo de energio
items.energycrystal.desc=Kolekto de kelkaj etaj magiaj kristaloj plenigitaj per alĥemia energio.\n\nTiuj ĉi kristaloj estas la plej ordinaraj konsistaĵoj en alĥemiaj receptoj. Oni povas akiri ilin per detrui uzeblajn aĵojn en alĥemiaj kuirpotoj.

items.gold.name=oro
items.gold.desc=Stako de oraj moneroj. Kolektu monerojn por poste elspezi ilin en vendejo.

items.heap.for_sale=%2$s: %1$d ₷
items.heap.chest=Kofro
items.heap.chest_desc=Vi ne scios pri ĝia enhavo antaŭ ol vi ĝin malfermos!
items.heap.locked_chest=Ŝlosita kofro
items.heap.locked_chest_desc=Vi ne scios pri ĝia enhavo antaŭ ol vi ĝin malfermos! Tamen por malfermi ĝin, vi bezonas oran ŝlosilon.
items.heap.crystal_chest=Kristala kofro
items.heap.crystal_chest_desc=Vi povas rimarki _%s_ ene, sed por malfermi la kofron vi bezonas kristalan ŝlosilon.
items.heap.artifact=antikvaĵon
items.heap.wand=vergon
items.heap.ring=ringon
items.heap.tomb=Tombo
items.heap.tomb_desc=Tiu ĉi antikva tombo povas enhavi ion indan, sed ĝia posedanto certe ne kontentos pri tio.
items.heap.skeleton=Skeletaj restaĵoj
items.heap.skeleton_desc=Nur tio ĉi restas post iu malbonŝanca aventuristo. Eble estas inde kontroli ilin por iuj valoraĵoj.
items.heap.remains=Restaĵoj de heroo
items.heap.remains_desc=Nur tio ĉi restas post iu el viaj antaŭuloj. Eble estas inde kontroli ilin por iuj valoraĵoj.

items.honeypot.name=mielujo
items.honeypot.ac_shatter=AGITI
items.honeypot.desc=Tiu ĉi granda mielujo estas nur ŝmirita per mielo, kaj ĝi gastigas gigantan abelon! Tiu ĉi specio de grandaj abeloj kutime restas en siaj abelujoj, eble tiu ĉi ujo estas ia speciala kaptilo? La abelo estas kontenta ene sia mielujo kaj zumas minace kiam vi rigardas al ĝi.
items.honeypot$shatteredpot.name=agitita mielujo
items.honeypot$shatteredpot.desc=Tiu ĉi mielujo estas agitita, nur glueca mielo ŝmiranta ĝiajn murojn kunigas ĝin kaj ĝi iom post iom disiĝas.\n\nKvankam ĝi estas rompita, la abelo ankoraŭ volas protekti la ujon.

items.item.prompt=Elektu kien ĵeti
items.item.ac_drop=FALIGI
items.item.ac_throw=ĴETI
items.item.rankings_desc=Mortigita de %s
items.item.curse=malbeno
items.item.custom_note_type=Tiu ĉi speco de aĵo havas propran noton: “_%s_”
items.item.custom_note=Tiu ĉi aĵo havas propran noton: _“%s”_
items.item.discover_hint=Vi povas trovi tian aĵon ie hazarde en la labirinto.

items.kindofmisc.unequip_title=Demetu unu aĵon
items.kindofmisc.unequip_message=Unue vi devas demeti unu el tiuj ĉi aĵoj. Elektu aĵon por anstataŭigi.

items.kindofweapon.swift_equip=Vi rapide surmetis vian armilon.
items.kindofweapon.equip_cursed=Viaj manoj senvole ĉirkaŭpremas tenilon de la armilo.
items.kindofweapon.which_equip_msg=Al kiu armilingo vi volas surmeti tiun ĉi armilon?\n\nMajstrino senpere atakas per sia ĉefa armilo, tamen povas uzi specialan armilan atakon de ambaŭ armiloj. Ambaŭ armiloj havas la komunan nombron da ŝargoj.\n\nMajstrino ankaŭ povas senprokraste interŝanĝi ĉefan armilon por malĉefa.
items.kindofweapon.which_equip_primary=Ĉefa (%s)
items.kindofweapon.which_equip_secondary=Malĉefa (%s)
items.kindofweapon.empty=malĉefa

items.kingscrown.name=krono de la Reĝo de Gnomoj
items.kingscrown.ac_wear=SURKAPIGI
items.kingscrown.naked=Bedaŭrinde la krono ne povas transformi vian subveston.
items.kingscrown.upgraded=La krono hele ekbrilis kaj sekve dispeciĝis transformante vian defendaĵon!
items.kingscrown.ratgraded=Piedo de la Ratreĝo hele ekbrilis kaj via defendaĵo transformiĝis!
items.kingscrown.desc=Krono de la lasta Reĝo de Gnomoj, potenca magia energio elradias el ĝi.\n\nPost surkapigi ĝin, magio de la krono plenigos vian surmetitan defendaĵon por transformi ĝin al _unika eksterordinara defendaĵo kun specialaj kapabloj._ La nova defendaĵo konservos ĉiujn atributojn de la originala defendaĵo.
items.kingscrown.discover_hint=Vi povas akiri tian aĵon mortigante iujn bestojn.

items.liquidmetal.name=likva metalo
items.liquidmetal.ac_apply=APLIKI
items.liquidmetal.prompt=Elektu ĵetarmilon
items.liquidmetal.already_fixed=Tiu ĉi ĵetarmilo estas nune en perfekta stato!
items.liquidmetal.apply=Vi uzis %d gutojn da likva metalo por ripari vian ĵetarmilon.
items.liquidmetal.desc=Tiu ĉi magia likvo povas plenigi krevojn kaj skrap-difektojn de ĵetarmilo, restarigante ĝin al perfekta stato! Se unu ekzemplero mankas al ĵetarmilaro – sed la aliaj estas plene riparitaj – la likva metalo povas eĉ anstataŭigi la mankantan ĵetarmilon de la aro!\n\nPor plene ripari 1-supernivelan ĵetarmilon necesas uzi 10 gutojn da metalo, por ripari 5-supernivelan necesas uzi 30 gutojn. Ĉiu plibonigo pliigas necesan kvanton da metalo je 35%.\n\nOni ne povas uzi la likvan metalon por ripari finaĵojn de trempitaj sagetoj.
items.liquidmetal.discover_hint=Vi povas kuiri tian aĵon per alĥemio.

items.lostbackpack.name=perdita dorsosako
items.lostbackpack.desc=Jen via perdita dorsosako. Kolektu ĝin por reakiri ĉiujn viajn perditajn havaĵojn!

items.merchantsbeacon.name=markilo de komercisto
items.merchantsbeacon.ac_use=UZI
items.merchantsbeacon.desc=Tiu ĉi kurioza teĥnikaĵo ebligas al vi interkomunikiĝi trans granda distanco.\n\nJe aktivigo, tiu ĉi markilo ebligos al vi vendi aĵojn al Piksel-Mart de ie ajn en la labirinto.\n\nBedaŭrinde la magio de la markilo daŭros nur por unufoje, do uzu ĝin saĝe.

items.stylus.name=mistera gravurilo
items.stylus.ac_inscribe=ENSKRIBI
items.stylus.prompt=Elektu defendaĵon
items.stylus.identify=Vi devas unue identigi, ĉu tiu defendaĵo ne estas malbenita.
items.stylus.cursed=Magio de la gravurilo ne agos sur malbenita defendaĵo.
items.stylus.inscribed=Vi enskribis vian defendaĵon per la gravurilo.
items.stylus.desc=Tiu ĉi mistera gravurilo estas farita el ia malluma kaj tre malmola ŝtono. Per ĝi vi povas enskribi magian skribaĵon sur via defendaĵo, sed vi ne povas elekti kian skribaĵon ĝi estos, la gravurilo decidos tion por vi.

items.tengusmask.name=masko de Tenguo
items.tengusmask.ac_wear=SURMETI
items.tengusmask.used=La masko dispeciĝis kaj ĝia potenco plenigis vin!
items.tengusmask.desc=Tiu ĉi masko defalis de vizaĝo de Tenguo je lia morto, vi povas senti signifan potencon radiantan el ĝi. Ĉu eblas, ke la masko estis la fonto de potenco de Tenguo?\n\nKiam surmetita, la neimagebla potenco de la masko plenigos vin, ebligante al vi _elekti profesion de via heroo._\n\nNu, kiun profesion vi elektos?
items.tengusmask.discover_hint=Vi povas akiri tian aĵon mortigante iujn bestojn.

items.torch.name=torĉo
items.torch.ac_light=EKLUMIGI
items.torch.desc=Necesaĵo de aventuristo, kiam labirinto iĝas malluma, torĉo helpos al vi trovi direkton.

items.waterskin.name=felsako
items.waterskin.ac_drink=TRINKI
items.waterskin.collected=Vi kolektis roseron en vian felsakon.
items.waterskin.full=Via felsako estas plena!
items.waterskin.empty=Via felsako estas malplena!
items.waterskin.desc=Ujo farita el felo kaj ŝnuro, fermata per korka ŝtopilo.
items.waterskin.desc_water=Nuntempe la felsako entenas nur ordinaran akvon. Certege en la labirinto troviĝas alia likvo, kiun vi povas verŝi al via felsako.
items.waterskin.desc_heal=La felsako nun entenas la sanigan akvon. Ju pli plena la felsako estas, des pli  da sanpoentoj vi senprokraste akiros post trinki el ĝi. Vi trinkos nur tiom da akvo, kiom vi bezonos.
items.waterskin.desc_full=La plena felsako ŝajnas radii energion, eble vi povas uzi ĝin por beni iun aĵon, kiu povas helpi al vi travivi?
items.waterskin.discover_hint=Iu el la herooj komencas kun tiu aĵo.

