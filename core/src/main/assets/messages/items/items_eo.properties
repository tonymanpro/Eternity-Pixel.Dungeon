items.scrolls.scroll.mannaz=skribrulaĵo de MANNAZ
items.scrolls.scroll.naudiz=skribrulaĵo de NAŬDIZ
items.scrolls.scroll.berkanan=skribrulaĵo de BERKANAN
items.scrolls.scroll.odal=skribrulaĵo de ODAL
items.scrolls.scroll.tiwaz=skribrulaĵo de TIVAZ
items.scrolls.scroll.unknown_desc=Iaj nedeĉifreblaj magiaj runoj estas skribitaj sur tiu ĉi pergameno. Kiu scias, kio okazos kiam ĝi estos legita voĉe?
items.scrolls.scroll.blinded=Vi ne povas legi skribrulaĵon dum blindumita.
items.scrolls.scroll.no_magic=Vi ne povas legi skribrulaĵon dum esti rezista al magio.
items.scrolls.scroll.cursed=Via malbenita librego de magiaĵoj malebligas al vi elvoki magiaĵon de tiu ĉi skribrulaĵo! Eble skribrulaĵo de senmalbenigo estos sufiĉe forta por agi…
items.scrolls.scroll$placeholder.name=skribrulaĵo

items.scrolls.inventoryscroll.warning=Ĉu vi certe volas nuligi uzon de tiu ĉi skribrulaĵo? La skribrulaĵo ne estis antaŭe identigita, do tiel aŭ alie ĝi estos uzita.
items.scrolls.inventoryscroll.yes=Jes, mi certas
items.scrolls.inventoryscroll.no=Ne, mi ŝanĝis mian volon

items.scrolls.scrollofidentify.name=skribrulaĵo de identigo
items.scrolls.scrollofidentify.inv_title=Identigi aĵon
items.scrolls.scrollofidentify.it_is=Via aĵo estas identigita: %s.
items.scrolls.scrollofidentify.desc=Tiu ĉi skribrulaĵo porĉiam malkaŝos ĉiujn sekretojn de unu aĵo.

items.scrolls.scrolloflullaby.name=skribrulaĵo de dormkanto
items.scrolls.scrolloflullaby.sooth=La skribrulaĵo ludas lulan melodion. Vi sentiĝas tre dormema.
items.scrolls.scrolloflullaby.desc=Lego de tiu ĉi skribrulaĵo eligos dormigan melodion, kiu lulos ĉiujn, kiuj aŭdos ĝin al profunda magia dormo. Tiu dormo resanigos la leganton kaj liajn amikojn.

items.scrolls.scrollofmagicmapping.name=skribrulaĵo de magia mapado
items.scrolls.scrollofmagicmapping.layout=Vi ĵus ekkonis strukturon de keletaĝo.
items.scrolls.scrollofmagicmapping.desc=Kiam tiu ĉi skribrulaĵo estos legita, bildo de kristala klarigo estos enigita al via menso kaj vi estos scianta pri preciza strukturo de la keletaĝo kaj ĉiuj ĝiaj kaŝaĵoj. Pozicioj de aĵoj kaj kreaĵoj daŭros nekonataj.

items.scrolls.scrollofmirrorimage.name=skribrulaĵo de spegula figuro
items.scrolls.scrollofmirrorimage.copies=La skribrulaĵo kreas viajn spegulajn figurojn.
items.scrolls.scrollofmirrorimage.no_copies=La skribrulaĵo provas krei viajn spegulajn figurojn, sed mankas spaco por ili.
items.scrolls.scrollofmirrorimage.desc=La sorĉaĵo de tiu ĉi skribrulaĵo kreos du iluziajn ĝemelojn de la leganto. Tiuj ĉi spegulaj figuroj agos kiel malpli fortaj klonoj de la leganto kaj ĉasos siajn malamikojn. Tamen ili estas sendaŭraj kaj perdiĝos post esti vunditaj.

items.scrolls.scrollofretribution.name=skribrulaĵo de venĝo
items.scrolls.scrollofretribution.blast=Potenca magia energio eksplodas de la skribrulaĵo!
items.scrolls.scrollofretribution.desc=Tiu ĉi skribrulaĵo enhavas detruantan energion, kiu transiras suferon de la leganto eksteren eksplodante. Ju malpli sana la leganto estas, des pli granda la detruo estos. Je tre malmulte da sano, tiu volvolibro povas senprokraste mortigi plejparton de malamikoj.\n\nAliflanke uzo de tiu skribrulaĵo havas malavantaĝon: ĝi blindumas kaj malplifortigas la leganton.

items.scrolls.scrollofrage.name=skribrulaĵo de kolero
items.scrolls.scrollofrage.roar=Tiu ĉi skribrulaĵo aŭdigas kolerigan kriegon, kiu eĥiĝas tra la labirinto!
items.scrolls.scrollofrage.desc=Kiam legita voĉe, tiu ĉi skribrulaĵo eligos laŭtan kriegon, kiu allogos ĉiujn monstrojn al la leganto kaj koleros proksimajn.

items.scrolls.scrollofrecharging.name=skribrulaĵo de ŝargiĝo
items.scrolls.scrollofrecharging.surge=Ondo da energio trafluas vian korpon, ŝargante viajn vergojn!
items.scrolls.scrollofrecharging.desc=Post legi, la kruda magio energio ensorĉita en tiu ĉi pergameno komencos ŝargi ĉiujn vergojn de la leganto.

items.scrolls.scrollofremovecurse.name=skribrulaĵo de senmalbenigo
items.scrolls.scrollofremovecurse.inv_title=Senmalbenigi aĵon
items.scrolls.scrollofremovecurse.cleansed=Via aĵo brilas je puriga lumo kaj fia energio foriĝas!
items.scrolls.scrollofremovecurse.not_cleansed=Via aĵo brilas je puriga lumo, sed nenio okazas.
items.scrolls.scrollofremovecurse.spirit=Via skribrulaĵo savis la turmentitan spiriton!
items.scrolls.scrollofremovecurse.desc=La sorĉaĵo de tiu ĉi skribrulaĵo tuj forigos iujn ajn malbenojn de unu armilo, ringo, vergo, defendaĵo aŭ antikvaĵo.

items.scrolls.scrollofteleportation.name=skribrulaĵo de teleportiĝo
items.scrolls.scrollofteleportation.tele=En palpebruma daŭro vi estis teleportita al alia loko de la keletaĝo.
items.scrolls.scrollofteleportation.no_tele=Teleportanta magio malsukcesis.
items.scrolls.scrollofteleportation.cant_reach=Vi ne povas teleportiĝi tien.
items.scrolls.scrollofteleportation.prompt=Elektu kien teleportiĝi
items.scrolls.scrollofteleportation.desc=La sorĉaĵo de tiu ĉi pergameno senprokraste transportas la leganton al hazarda loko de labirinta keletaĝo. La skribrulaĵo emas transporti al nevizititaj areoj, sed ne ebligas teleporti tra ŝlositaj pordoj kaj barikadoj. Krom tio, ĝi povas malkaŝi kaŝitajn pordojn direktantajn al novaj ĉambroj.

items.scrolls.scrollofterror.name=skribrulaĵo de timo
items.scrolls.scrollofterror.none=La skribrulaĵo eligas helegan brilon de ruĝa lumo.
items.scrolls.scrollofterror.one=La skribrulaĵo eligas helegan brilon de ruĝa lumo kaj %s forkuras!
items.scrolls.scrollofterror.many=La skribrulaĵo eligas helegan brilon de ruĝa lumo kaj monstroj forkuras!
items.scrolls.scrollofterror.desc=Dum esti legata, tiu ĉi skribrulaĵo ellasos helegan brilon de ruĝa lumo, kiu ŝokos kaj timos ĉiujn monstrojn en via vidatingo tiel, ke ili forkuros. Atako al forkuranta kontraŭulo nuligos la efikon.

items.scrolls.scrolloftransmutation.name=skribrulaĵo de transformo
items.scrolls.scrolloftransmutation.inv_title=Transformi aĵon
items.scrolls.scrolloftransmutation.nothing=Nenio interesa okazis.
items.scrolls.scrolloftransmutation.morph=Via aĵo ŝanĝiĝis al alia aĵo!
items.scrolls.scrolloftransmutation.desc=Tiu ĉi skribrulaĵo enhavas potencan magion de transformo. Je uzo sur ĝusta aĵo, ĝi transformos ĝin al alia samspeca aĵo. La magio eĉ povas konservi plibonigojn, ensorĉojn kaj skribaĵojn. Skribrulaĵoj kaj eliksiroj transformiĝos al siaj ekzotaj ekvivalentoj kaj inverse.

items.scrolls.scrollofupgrade.name=skribrulaĵo de plibonigo
items.scrolls.scrollofupgrade.inv_title=Plibonigi aĵon
items.scrolls.scrollofupgrade.weaken_curse=Skribrulaĵo de plibonigo malplifortigas malbenon de via aĵo.
items.scrolls.scrollofupgrade.remove_curse=Skribrulaĵo de plibonigo senmalbenigas vian aĵon!
items.scrolls.scrollofupgrade.desc=Tiu ĉi pergameno plibonigos unu aĵon aŭ aron de ĵetarmiloj. Vergoj iĝos pli potencaj kaj nombraj en pafoj, armiloj pli forte vundos, ĵetarmilaroj estos plene riparitaj kaj pli firmaj, defendaĵoj blokos pliajn vundojn kaj efikoj de ringoj pliintensiĝos.\n\nĜi eĉ povas malplifortigi aŭ tute forigi malbenon, kvankam ĝi ne estas tiel pova kiel skribrulaĵo de senmalbenigo. Bedaŭrinde la pliboniga magio ankaŭ povas forigi ensorĉojn kaj skribaĵojn de alte plibonigitaj armaĵoj.



###exotic scrolls
items.scrolls.exotic.exoticscroll.kaunan=ekzota skribrulaĵo de KAŬNAN
items.scrolls.exotic.exoticscroll.sowilo=ekzota skribrulaĵo de SOVILO
items.scrolls.exotic.exoticscroll.laguz=ekzota skribrulaĵo de LAGUZ
items.scrolls.exotic.exoticscroll.yngvi=ekzota skribrulaĵo de INGVI
items.scrolls.exotic.exoticscroll.gyfu=ekzota skribrulaĵo de GIFU
items.scrolls.exotic.exoticscroll.raido=ekzota skribrulaĵo de RAIDO
items.scrolls.exotic.exoticscroll.isaz=ekzota skribrulaĵo de ISAZ
items.scrolls.exotic.exoticscroll.mannaz=ekzota skribrulaĵo de MANNAZ
items.scrolls.exotic.exoticscroll.naudiz=ekzota skribrulaĵo de NAŬDIZ
items.scrolls.exotic.exoticscroll.berkanan=ekzota skribrulaĵo de BERKANAN
items.scrolls.exotic.exoticscroll.odal=ekzota skribrulaĵo de ODAL
items.scrolls.exotic.exoticscroll.tiwaz=ekzota skribrulaĵo de TIVAZ
items.scrolls.exotic.exoticscroll.unknown_desc=Briletaj nedeĉifreblaj magiaj runoj estas skribitaj sur tiu ĉi nigra pergameno. Ĝi ŝajnas deveni de malproksima lando, kiu scias, kio okazos, kiam ĝi estos legita voĉe?
items.scrolls.exotic.exoticscroll.discover_hint=Vi povas kuiri tian aĵon per alĥemio.

items.scrolls.exotic.scrollofsirenssong.name=skribrulaĵo de marvirina kanto
items.scrolls.exotic.scrollofsirenssong.prompt=Elektu celon
items.scrolls.exotic.scrollofsirenssong.no_target=La skribrulaĵo aktiviĝis sen elekti celon.
items.scrolls.exotic.scrollofsirenssong.cancel=Vi devas elekti celon.
items.scrolls.exotic.scrollofsirenssong.desc=Legado de tiu ĉi skribrulaĵo ellasos allogan melodion, kiu ĉarmos elektitan kontraŭulon kaj neinversigeble konvertos ĝin al via amiko! Proksimaj kontraŭuloj, kiuj aŭdos la kanton estos portempe ĉarmitaj.\n\nCeteraj tre fortaj malamikoj povas rezisti la konvertadon kaj nur estos ĉarmitaj.
items.scrolls.exotic.scrollofsirenssong$enthralled.name=konvertita
items.scrolls.exotic.scrollofsirenssong$enthralled.desc=Tiu ĉi monstro estis konvertita per magio de la skribrulaĵo de marvirina kanto.\n\nKonvertita kontraŭulo porĉiame estos via amiko kaj atakos ĉiujn renkontitajn monstrojn.

items.scrolls.exotic.scrollofantimagic.name=skribrulaĵo de malmagio
items.scrolls.exotic.scrollofantimagic.desc=La sorĉvortoj de tiu ĉi volvolibro ĉirkaŭos vin per magia etoso, kiu portempe blokos ĉiujn magiajn efikojn, kaj helpajn kaj minacajn. Tio estas plejparto da magiaj efikoj de aĵoj kiel vergoj, skribrulaĵoj, ringoj, antikvaĵoj, ensorĉoj kaj malbenoj. Kapabloj de heroaj defendaĵoj estas sufiĉe fortaj por funkcii malgraŭ tiu efiko.

items.scrolls.exotic.scrollofchallenge.name=skribrulaĵo de defio
items.scrolls.exotic.scrollofchallenge.desc=Post esti legita voĉe, tiu ĉi skribrulaĵo ellasos laŭtan kriegon, kiu allogos malamikojn al la leganto kaj samtempe kreos malgrandan batalarenon ĉirkaŭ li.\n\nTiel longe, kiel la leganto restadas en la batalareno, li ricevos je 33% malpli da vundoj de ĉiuj fontoj (tiu ĉi redukto kalkuliĝas antaŭ ol aliaj manieroj de vund-redukto) kaj ne malsatiĝos.\n\nLa grando de la batalareno dependos de spaco en kiu estas la leganto; ĝi estas precipe malgranda en areoj de iuj ĉefmonstroj.
items.scrolls.exotic.scrollofchallenge$challengearena.name=batalareno
items.scrolls.exotic.scrollofchallenge$challengearena.desc=Magia batalareno kovrita per ruĝeta nebulo kreiĝis ĉirkaŭ vi, \n\nDum stari en la nebulo, via sateco ne malpliiĝos kaj vi ricevos je 33%% malpli da vundoj de ĉiuj fontoj. Se io alia reduktas viajn ricevatajn vundojn (ekzemple defendaĵo), ĝi aplikiĝos post la 33%% redukto.\n\nLa batalareno daŭros por %d temperoj.

items.scrolls.exotic.scrollofdivination.name=skribrulaĵo de aŭguro
items.scrolls.exotic.scrollofdivination.nothing_left=Estas nenio pli por identigi!
items.scrolls.exotic.scrollofdivination.desc=Tiu ĉi skribrulaĵo identigos kvar specojn de aĵoj, kiujn vi nun ne scias. Identigotaj aĵoj povas esti koloroj de eliksiroj, runoj sur skribrulaĵoj aŭ juvelŝtonoj de ringoj. Identigotaj aĵoj ne devas esti tiuj, kiujn vi jam posedas.
items.scrolls.exotic.scrollofdivination$wnddivination.desc=La skribrulaĵo de aŭguro identigis la jenajn aĵojn:

items.scrolls.exotic.scrollofdread.name=skribrulaĵo de teruro
items.scrolls.exotic.scrollofdread.desc=Post esti legita, tiu ĉi skribrulaĵo eligos brilon de ruĝa lumo, kiu kaŭzos al ĉiuj malamikoj en via vidatingo senti neimageblan timon. La efiko estos tiel forta, ke ili forkuros tra la tuta labirinto kaj vi neniom vidos ilin denove!\n\nSamkiel la timo, la efiko nuliĝos post iom da tempo aŭ kiam la malamiko estos atakita.\n\nMonstroj kun forta volo – kiel supermonstroj – estos influitaj per la norma efiko de timo.

items.scrolls.exotic.scrollofenchantment.name=skribrulaĵo de ensorĉo
items.scrolls.exotic.scrollofenchantment.inv_title=Enmagiigi aĵon
items.scrolls.exotic.scrollofenchantment.weapon=Elektu ensorĉon por apliki al via armilo.
items.scrolls.exotic.scrollofenchantment.armor=Elektu skribaĵon por apliki al via defendaĵo.
items.scrolls.exotic.scrollofenchantment.cancel=rezigni
items.scrolls.exotic.scrollofenchantment.cancel_warn=Per rezigni via skribrulaĵo de ensorĉo estos perdita, ĉu vi certas?
items.scrolls.exotic.scrollofenchantment.cancel_warn_yes=Jes, mi certas
items.scrolls.exotic.scrollofenchantment.cancel_warn_no=Ne, mi ŝanĝis mian volon
items.scrolls.exotic.scrollofenchantment.desc=Tiu ĉi skribrulaĵo ensorĉos vian armilon aŭ defendaĵon per potenca magia energio. La leganto eĉ povas parte elekti ensorĉon por apliki.

items.scrolls.exotic.scrollofforesight.name=skribrulaĵo de prudento
items.scrolls.exotic.scrollofforesight.desc=Post legi tiun ĉi skribrulaĵon, detaloj de proksima tereno – en la formo de kristala klarigo – konstante enigos menson de la leganto. Tiu ĉi efiko daŭros por signifa kvanto de tempo kaj malkovros ĉiujn kaŝitajn pordojn kaj kaptilojn, do serĉado estos malnepra.

items.scrolls.exotic.scrollofmetamorphosis.name=skribrulaĵo de metamorfozo
items.scrolls.exotic.scrollofmetamorphosis.choose_desc=Elektu talenton por metamorfozi.
items.scrolls.exotic.scrollofmetamorphosis.replace_desc=Elektu novan talenton, per kiu vi volas anstataŭigi la metamorfozitan talenton.
items.scrolls.exotic.scrollofmetamorphosis.cancel_warn=Per rezigni via skribrulaĵo de metamorfozo estos perdita, ĉu vi certas?
items.scrolls.exotic.scrollofmetamorphosis.metamorphose_talent=metamorfozi talenton
items.scrolls.exotic.scrollofmetamorphosis.desc=Tiu ĉi skribrulaĵo enhavas potencan magion de transformo, kiu influas al la leganto anstataŭ al objekto. Magio de tiu ĉi skribrulaĵo ebligos al vi elekti iun vian talenton kaj anstataŭigi ĝin per unu el kvin talentoj de la sama nivelo de alia speco de heroo!\n\nLa magio aplikiĝas nur al talentoj de herooj (niveloj 1-2), ne al talentoj de profesioj aŭ defendaĵoj. Nemetamorfozeblaj talentoj ne estos elekteblaj.

items.scrolls.exotic.scrollofmysticalenergy.name=skribrulaĵo de mistera energio
items.scrolls.exotic.scrollofmysticalenergy.desc=Kiam la kruda magia energio ensorĉita en tiu ĉi pergameno estos ellasita, ĝi ŝargados ĉiujn surmetitajn antikvaĵojn de la leganto dum tempo.

items.scrolls.exotic.scrollofpassage.name=skribrulaĵo de trairejo
items.scrolls.exotic.scrollofpassage.desc=La sorĉaĵo de tiu ĉi pergameno senprokraste transportos la leganton al la enirejo de nuna regiono de la labirinto. Tre oportuna maniero por transporti sin al vendejo.

items.scrolls.exotic.scrollofprismaticimage.name=skribrulaĵo de prisma figuro
items.scrolls.exotic.scrollofprismaticimage.desc=La sorĉaĵo de tiu ĉi skribrulaĵo kreos koloran iluzian ĝemelon de la leganto. Tiu ĉi prisma figuro agos kiel malpli forta klono de la leganto, kun simila defendo sed malpli da sano kaj atakpovo.\n\nLa prisma figuro montros sin al kontraŭuloj kaj provos defendi la leganton.\n\nSe prisma figuro jam ekzistas, uzo de tiu ĉi skribrulaĵo plene sanigos lin.

items.scrolls.exotic.scrollofpsionicblast.name=skribrulaĵo de spirita eksplodo
items.scrolls.exotic.scrollofpsionicblast.ondeath=La spirita eksplodo dispecigas vian menson…
items.scrolls.exotic.scrollofpsionicblast.desc=Tiu ĉi skribrulaĵo enhavas nekredeble detruantan energion, kiu povas esti transigita por dispecigi mensojn de ĉiuj videblaj monstroj.\n\nAliflanke tio ne estas senkosta: la leganto ankaŭ estos vundita, blindumita kaj malplifortigita. Ju pli da viktimoj la skribrulaĵo frapos, des malpli da vundpoentoj la leganto ricevos.



###spells
items.spells.alchemize.name=sorĉkristalo de alĥemio
items.spells.alchemize.prompt=Alĥemidetrui aĵon
items.spells.alchemize.desc=Tiu ĉi sorĉkristalo enhavas transforman magion similan al tiu, kiu troviĝas en alĥemiaj kuirpotoj. Ĉiu ĝia uzo ebligos al la heroo detrui objekton (aŭ stakon de objektoj) al oro aŭ al alĥemia energio. Detrui neidentigitajn eliksirojn aŭ skribrulaĵojn al alĥemia energio eĉ identigos ilin!\n\nKelkaj sorĉkristaloj de alĥemio estas aĉeteblaj en vendejoj kaj pliajn vi povas fari per alĥemio: miksu semon, runŝtonon kaj iomete da alĥemia energio.
items.spells.alchemize$wndalchemizeitem.sell=Detrui al %d ₷
items.spells.alchemize$wndalchemizeitem.sell_1=Detrui 1 al %d ₷
items.spells.alchemize$wndalchemizeitem.sell_all=Detrui ĉiujn al %d ₷
items.spells.alchemize$wndalchemizeitem.energize=Detrui al %d da energio
items.spells.alchemize$wndalchemizeitem.energize_1=Detrui 1 al %d da energio
items.spells.alchemize$wndalchemizeitem.energize_all=D-i ĉiujn al %d da energio

items.spells.beaconofreturning.name=sorĉkristalo de reveno
items.spells.beaconofreturning.preventing=Fortega magia etoso de tiu ĉi ejo malebligas al vi uzi la sorĉkristalon!
items.spells.beaconofreturning.creatures=Magia etoso de proksimaj bestaĉoj malebligas al vi teleportiĝi tiumomente.
items.spells.beaconofreturning.set=Vi agordis kristalon al tiu ĉi loko.
items.spells.beaconofreturning.wnd_body=Elektante “Loki,” la eksa agordita loko estos forgesita.\n\nElektante “Reveni”, vi estos teleportita al la agordita loko kaj unu uzo de sorĉkristalo konsumiĝos.
items.spells.beaconofreturning.wnd_set=Loki
items.spells.beaconofreturning.wnd_return=Reveni
items.spells.beaconofreturning.desc_set=Tiu ĉi sorĉkristalo estas agordita ie en la %d-a keletaĝo.
items.spells.beaconofreturning.desc=Tiu ĉi komplika sorĉaĵo ebligos al la uzanto reveni al agordita loko, sendepende de distanco. La sorĉaĵo estos uzita nur per reveni, ĝi povas esti agordita tiom da foje, kiom vi volas, tamen nur la plej lasta agordita loko estos memorigita.

items.spells.curseinfusion.name=sorĉkristalo de fia enmagiigo
items.spells.curseinfusion.inv_title=Malbenigi aĵon
items.spells.curseinfusion.desc=Tiu ĉi sorĉaĵo enmagiigos vian armaĵon per la sama potenca malica magio, kiu ĉeestis en DM-300. La pritraktota aĵo estos malbenita, kaj ĉiu ensorĉo aŭ skribaĵo perdiĝos.\n\nLa pritraktota armilo, defendaĵo aŭ vergo ricevos plibonigojn kaj ankaŭ malbenojn. Ne eblas uzi pli ol unu fia enmagiigo por aĵo kaj la plibonigoj pereos kiam la aĵo estos senmalbenita.\n\nPlurajn sorĉkristalojn de fia enmagiigo vi povas uzi por ŝanĝi malbenon de defendaĵo aŭ armilo.

items.spells.spell.ac_cast=UZI
items.spells.spell.no_magic=Vi ne povas sorĉi dum esti rezista al magio.
items.spells.spell.discover_hint=Vi povas kuiri tian aĵon per alĥemio.

items.spells.magicalinfusion.name=sorĉkristalo de enmagiigo
items.spells.magicalinfusion.inv_title=Enmagiigi aĵon
items.spells.magicalinfusion.infuse=Via aĵo estas enmagiigita per mistera energio!
items.spells.magicalinfusion.desc=Tiu ĉi sorĉkristalo posedas la saman magian povon kiel skribrulaĵo de plibonigo, sed en pli stabila formo.\n\nKrome kutime plibonigi la armaĵon, ĝi neniam forviŝos ensorĉon, skirbaĵon aŭ malbenon.

items.spells.magicalporter.name=sorĉkristalo de teleporto
items.spells.magicalporter.inv_title=Teleporti aĵon
items.spells.magicalporter.nowhere=Estas neniu sekva areo por teleporti aĵon.
items.spells.magicalporter.desc=Tiu ĉi sorĉaĵo magie transportos iun elektitan aĵon. Tamen male al markilo de komercisto, la aĵo estos transportita al la enirejo de la sekva keletaĝo kun supermonstro.

items.spells.phaseshift.name=sorĉkristalo de defaziĝo
items.spells.phaseshift.no_target=Tie estas nenio por teleporti.
items.spells.phaseshift.desc=Tiu ĉi ĥaosa sorĉaĵo povas teleporti iun ajn celitan ulon al hazarda loko en la sama keletaĝo kaj surdigi la viktimon por signifa kvanto da tempo. Potencaj malamikoj povos rezisti al la surdiga efiko. Tiun ĉi sorĉaĵon oni povas direkti al monstro aŭ al la uzanto mem.

items.spells.reclaimtrap.name=sorĉkristalo de kaptila transkonstruo
items.spells.reclaimtrap.no_trap=Estas neniu kaptilo tie ĉi.
items.spells.reclaimtrap.desc_trap=La sorĉkristalo nuntempe pretas ellasi povon de _%s._
items.spells.reclaimtrap.desc=Tiu ĉi sorĉaĵo enhavas restaĵojn de meĥanika energio de DM-300. Kiam uzita sur aktiva kaptilo, la povo de la kaptilo alligos vin, ebligante al vi reuzi la sorĉkristalon por ellasi ĝian povon kaj okazigi efikon de la kaptilo kie ajn vi volas.\n\nTamen iuj kaptiloj povas ne funkcii ĉie kaj la sorĉkristalo povas teni povon nur de unu kaptilo samtempe.

items.spells.recycle.name=sorĉkristalo de transformeto
items.spells.recycle.inv_title=Transformeti aĵon
items.spells.recycle.recycled=Via aĵo estis transformita al %s.
items.spells.recycle.desc=Tiu ĉi sorĉaĵo enhavas malpli fortan specon de transforma magio. Ĝi ne agas sur armaĵo, sed ĝi povas transformi skribrulaĵon, eliksiron, semon, runŝtonon aŭ trempitan sageton al alia hazarda aĵo de la sama speco.

items.spells.summonelemental.name=sorĉkristalo de elementido
items.spells.summonelemental.ac_imbue=PLENIGI
items.spells.summonelemental.imbue_prompt=Plenigi per aĵo
items.spells.summonelemental.desc=Tiu ĉi sorĉkristalo alidirektas energion uzatan por krei elementidoj kaj ebligas al vi alvoki amikan elementidon, kiu batalos ĉe via flanko! Nur unu elementido povas esti alvokita samtempe, tamen eblas senkoste revoki la elementidon reen al vi.
items.spells.summonelemental.desc_newborn=Tiu ĉi sorĉkristalo estas nuntempe en kruda “neplenigita” formo kaj oni povas uzi ĝin por alvoki _ĵusnaskitan elementidon_, kiu ne povas ataki fore. Vi povas plenigi ĝin per eliksiro de likva fajro, eliksiro de frosto, skribrulaĵo de ŝargiĝo aŭ skribrulaĵo de transformo por plipovigi la sorĉkristalon; do la sekvaj alvokotaj elementidoj estos plene formitaj!
items.spells.summonelemental.desc_fire=La kristalo estas varma je tuŝo, ĝi alvokos _fajridon_. Vi povas plenigi ĝin per alia aĵo, tamen la nuna plenigo de la sorĉkristalo perdiĝos.
items.spells.summonelemental.desc_frost=La kristalo estas malvarma je tuŝo, ĝi alvokos _frostidon_. Vi povas plenigi ĝin per alia aĵo, tamen la nuna plenigo de la sorĉkristalo perdiĝos.
items.spells.summonelemental.desc_shock=La kristalo delikate batas vin per elektro, ĝi alvokos _elektridon_. Vi povas plenigi ĝin per alia aĵo, tamen la nuna plenigo de la sorĉkristalo perdiĝos.
items.spells.summonelemental.desc_chaos=Ĥaosa energio radias de la kristalo, ĝi alvokos _ĥaosidon_. Vi povas plenigi ĝin per alia aĵo, tamen la nuna plenigo de la sorĉkristalo perdiĝos.

items.spells.targetedspell.prompt=Elektu aĵon
items.spells.targetedspell.inv_title=Enmagiigi aĵon

items.spells.telekineticgrab.name=sorĉkristalo de telekinezo
items.spells.telekineticgrab.cant_grab=Vi ne povas kapti tion ĉi.
items.spells.telekineticgrab.no_target=Estas nenio por kapti tie ĉi.
items.spells.telekineticgrab.desc=Tiu ĉi sorĉkristalo ebligas al la uzanto fore kapti ĉiujn aĵojn de elektita loko aŭ ĉiujn ĵetarmilojn alkroĉitajn al malamiko!\n\nVi ne povas uzi ĝin por kapti objektojn tenatajn de aliuloj aŭ por kapti ujojn kiel kofrojn.

items.spells.unstablespell.name=nestabila sorĉkristalo
items.spells.unstablespell.desc=Tiu ĉi malgranda nigra kvadrata kristalo havas alternantajn runojn sur ĉiuj ĝiaj flankoj.\n\nPost uzi ĝi aktivigos efikon de hazarda skribrulaĵo. Efiko de la skribrulaĵo ĉiam rilatos al batalo se malamikoj estos en via vidatingo, kaj ĉiam estos nebatala aliokaze.

items.spells.wildenergy.name=sorĉkristalo de sovaĝa energio
items.spells.wildenergy.desc=Tiu ĉi sorĉkristalo enhavas iom da malbena energio de DM-300. Kiam uzita, ĝi ŝargos viajn vergojn kaj surmetitajn antikvaĵojn, kaj ankaŭ aktivigos hazardan efikon de malbenita vergo. Tamen vi povas elekti kien direkti tiun malbenitan pafon.


###runestones
items.stones.inventorystone.ac_use=UZI

items.stones.runestone$placeholder.name=runŝtono
items.stones.runestone.discover_hint=Vi povas trovi tian aĵon ie hazarde en la labirinto aŭ kuiri ĝin per alĥemio.

items.stones.stoneofaggression.name=ŝtono de agreso
items.stones.stoneofaggression.desc=Kiam oni ĵetas tiun ĉi ŝtonon al malamiko aŭ amiko, ĉiuj proksimaj malamikoj preferos ataki lin por mallonga tempo.\n\nSupermonstroj estas parte rezistaj al tiu efiko: ĝi daŭros por signife malpli longe kaj ricevos malpli da vundoj de siaj servistoj.
items.stones.stoneofaggression$aggression.name=celata
items.stones.stoneofaggression$aggression.desc=Manipulanta magio instigas ĉiujn proksimajn malamikojn ataki tiun ĉi ulon.\n\nPliaj temperoj: %s.

items.stones.stoneofaugmentation.name=ŝtono de plivastigo
items.stones.stoneofaugmentation.inv_title=Plivastigi aĵon
items.stones.stoneofaugmentation.desc=Tiu ĉi runŝtono posedas potencan magion, kiu povas plivastigi armaĵon por pliigi ĝian econ kompense al la alia.\n\nUzo sur armilo ebligos al vi por pliigi aŭ ĝian rapidon aŭ vundpovon. Krom tio, ĵetarmiloj iĝos pli/malpli firmaj kompense al ilia rapido.\n\nUzo sur defendaĵo ebligos al vi pliigi aŭ ĝian defendon aŭ evitpovon.
items.stones.stoneofaugmentation.discover_hint=Vi povas aĉeti tian aĵon en vendejo aŭ kuiri ĝin per alĥemio.
items.stones.stoneofaugmentation$wndaugment.choice=Kion vi volas plivastigi?
items.stones.stoneofaugmentation$wndaugment.speed=Rapido
items.stones.stoneofaugmentation$wndaugment.damage=Vundpovo
items.stones.stoneofaugmentation$wndaugment.evasion=Evitpovo
items.stones.stoneofaugmentation$wndaugment.defense=Defendo
items.stones.stoneofaugmentation$wndaugment.none=Senplivastigi
items.stones.stoneofaugmentation$wndaugment.cancel=Rezigni

items.stones.stoneofblast.name=ŝtono de eksplodo
items.stones.stoneofblast.desc=Tiu ĉi runŝtono tuj eksplodos en ĵetita loko. Simie al bombo, la eksplodo difektos kaj vundos ĉion proksime.

items.stones.stoneofblink.name=ŝtono de ekapero
items.stones.stoneofblink.desc=Tiu ĉi runŝtono teleportos la uzanton tien, kien ĝi estos ĵetita.

items.stones.stoneofclairvoyance.name=ŝtono de antaŭvido
items.stones.stoneofclairvoyance.desc=Tiu ĉi runŝtono senprokraste malkaŝos ĉiujn kahelojn tre vaste ĉirkaŭ la ĵetita loko. Ĝia efiko eĉ agos tra muroj.

items.stones.stoneofdeepsleep.name=ŝtono de profunda dormo
items.stones.stoneofdeepsleep.desc=Kiam oni ĵetas tiun ĉi ŝtonon al kontraŭulo, la viktimo falos en profundan magian dormon. Kontraŭulo sub la influo de magia dormo ne vekiĝos ĝis esti atakita.

items.stones.stoneofdetectmagic.name=ŝtono de magia malkovro
items.stones.stoneofdetectmagic.inv_title=Malkaŝi magion
items.stones.stoneofdetectmagic.detected_none=Vi malkovris, ke tiu ĉi aĵo estas libera de magio.
items.stones.stoneofdetectmagic.detected_both=Vi malkovris ambaŭ utilan kaj fian magiojn en tiu ĉi aĵo!
items.stones.stoneofdetectmagic.detected_good=Vi malkovris utilan magion en tiu ĉi aĵo!
items.stones.stoneofdetectmagic.detected_bad=Vi malkovris fian magion en tiu ĉi aĵo!
items.stones.stoneofdetectmagic.desc=Tiu ĉi runŝtono povas malkovri magion kaŝitan en aĵo. Uzi tiun ĉi runŝtonon sur neidentigita aĵo rivelos, ĉu ĝi estas malbenita aŭ ĝi estas sub influo de utila magio kiel ensorĉo aŭ plibonigo.

items.stones.stoneofdisarming.name=ŝtono de senarmigo
items.stones.stoneofdisarming.desc=Tiu ĉi runŝtono enhavas magion, kiu povas malaktivigi minacajn kaptilojn kaŝitajn en la labirinto. Ĝi senarmigos maksimume 9 kaptilojn ĉirkaŭ la loko, kie ĝi estos ĵetita.

items.stones.stoneofenchantment.name=ŝtono de ensorĉo
items.stones.stoneofenchantment.inv_title=Enmagiigi aĵon
items.stones.stoneofenchantment.weapon=Via armilo brilas en la mallumo!
items.stones.stoneofenchantment.armor=Vi defendaĵo brilas en la mallumo!
items.stones.stoneofenchantment.desc=Tiu ĉi runŝtono enhavas ian magion. Kontraŭe al skribrulaĵo de plibonigo, ĝi ne rekte pliigos povon de aĵo, sed anstataŭ plenigos armilon aŭ defendaĵon per ensorĉo, donante al ĝi novan efikon.

items.stones.stoneoffear.name=ŝtono de timo
items.stones.stoneoffear.desc=Kiam oni ĵetas tiun ĉi ŝtonon al kontraŭulo, la viktimo iĝos terurita kaj forkuros. Ataki forkurantan ulon mallongigos la efikon.

items.stones.stoneofflock.name=ŝtono de ŝafo
items.stones.stoneofflock.desc=Tiu ĉi runŝtono alvokas por mallonga tempo magian ŝafon al la loko, kie ĝi estas ĵetita.

items.stones.stoneofintuition.name=ŝtono de intuicio
items.stones.stoneofintuition.inv_title=Elektu aĵon
items.stones.stoneofintuition.desc=Tiu ĉi runŝtono enhavas malpli fortan specon de magio trovatan en skribrulaĵoj de identigo. Tamen anstataŭ ordinare identigi aĵon, ĝi influos vian intuicion, ebligante al vi identigi specon de eliksiro, skribrulaĵo aŭ ringo per diveni.
items.stones.stoneofintuition.break_info=Vi povas uzi ŝtonon de intuicio dufoje antaŭ ol ĝi detruiĝos, _la sekva uzo ne detruos la ŝtonon._
items.stones.stoneofintuition.break_warn=Vi antaŭe uzis la ŝtonon de intuicio, do _via sekva uzo ĝin detruos._
items.stones.stoneofintuition$wndguess.text=Divenu specon de la neidentigita aĵo. Se vi divenos ĝuste, la speco de objekto estos identigita!
items.stones.stoneofintuition$wndguess.correct=Ĝuste. Vi identigis specon de la aĵo!
items.stones.stoneofintuition$wndguess.incorrect=Vi misdivenis.
items.stones.stoneofintuition$wndguess.break=Via ŝtono de intuicio dispolviĝis…

items.stones.stoneofshock.name=ŝtono de ŝoko
items.stones.stoneofshock.desc=Tiu ĉi runŝtono ellasos blovon da elektra energio, kiu por momente surdigos ĉiujn viktimojn proksime kaj donos al ĵetinto po unu sorĉbastona ŝargo por ĉiu trafita monstro.


###trinkets
items.trinkets.chaoticcenser.name=ĥaosa incensilo
items.trinkets.chaoticcenser.spew=Via incensilo baldaŭ elblovos: %s.
items.trinkets.chaoticcenser.desc=Post resti kelkan tempon en la alĥemia kuirpoto, tiu ĉi incensilo ŝajnas ellasi gasojn per si mem! Tiuj gasoj koncentriĝas ene kaj elŝprucas malamiken je preskaŭhazardaj temp-intervaloj. Ĝi ŝajnas ellasi diversajn gasojn kaj vi ricevos averton tuj antaŭ ol aktivigo de la incensilo.
items.trinkets.chaoticcenser.typical_stats_desc=Kutime tiu ĉi brilaĵo elŝprucigos minacajn gasojn proksime malamikoj je pli malpli _%d_ temperoj. Gasoj aperos nur en ĉeesto de malamikoj. Plibonigita incensilo elŝprucigos pli ekzotajn kaj pli danĝerajn gasojn.
items.trinkets.chaoticcenser.stats_desc=Je la nuna nivelo tiu ĉi brilaĵo elŝprucigos minacajn gasojn proksime malamikoj je pli malpli _%d_ temperoj. Gasoj aperos nur en ĉeesto de malamikoj. Plibonigita incensilo elŝprucigos pli ekzotajn kaj pli danĝerajn gasojn.

items.trinkets.crackedspyglass.name=rompita lorneto
items.trinkets.crackedspyglass.desc=Tiu ĉi mana lorneto estus ekzemplo de preciza kaj impona metiaĵo, se ĝia antaŭa lenso ne estus rompita. La lorneto ŝajnas helpi al vi malkaŝi novajn aĵojn en la labirinto, sed pro ĝia difekto la malkaŝitaj trezoroj estas tre malfacile videblaj!
items.trinkets.crackedspyglass.typical_stats_desc=Kutime tiu ĉi brilaĵo havas _%1$s%% ŝancon_ por krei aldonan kaŝitan aĵon en ĉiu keletaĝo (escepte de tiuj kun supermonstroj).
items.trinkets.crackedspyglass.stats_desc=Je la nuna nivelo tiu ĉi brilaĵo havas _%1$s%% ŝancon_ por krei aldonan kaŝitan aĵon en ĉiu keletaĝo (escepte de tiuj kun supermonstroj).
items.trinkets.crackedspyglass.stats_desc_upgraded=Je la nuna nivelo tiu ĉi brilaĵo havas _100%% ŝancon_ por krei aldonan kaŝitan aĵon en ĉiu keletaĝo (escepte de tiuj kun supermonstroj) kaj _%1$s%% ŝancon_ por krei alian kaŝitan aĵon.

items.trinkets.dimensionalsundial.name=dimensia sunhorloĝo
items.trinkets.dimensionalsundial.warning=Via sunhorloĝo ne ĵetas ombron, vi sentiĝas malcerte.
items.trinkets.dimensionalsundial.desc=Tiu ĉi malgranda poŝa sunhorloĝo iel povas ĵeti ombron en profundoj de la labirinto eĉ kiam vi ne tenas ĝin rekte. La plej kurioza fakto estas, ke direkto de la ombro ne rilatas al pozicio de la Suno en tiu ĉi mondo. Kiam neniu ombro estas ĵetata, la horloĝo allogas danĝeron.
items.trinkets.dimensionalsundial.typical_stats_desc=Kutime tiu ĉi brilaĵo malpliigos oftecon de aperi kontraŭulojn je _%1$d%%_ dum tago en la reala mondo (08:00 – 20:00) kaj pliigos oftecon de aperi kontraŭulojn je _%2$d%%_ dum nokto (20:00 – 08:00).
items.trinkets.dimensionalsundial.stats_desc=Je la nuna nivelo tiu ĉi brilaĵo malpliigos oftecon de aperi kontraŭulojn je _%1$d%%_ dum tago en la reala mondo (08:00 – 20:00) kaj pliigos oftecon de aperi kontraŭulojn je _%2$d%%_ dum nokto (20:00 – 08:00).

items.trinkets.exoticcrystals.name=ekzotaj kristaloj
items.trinkets.exoticcrystals.desc=Tiuj ĉi malgrandaj rozkoloraj kristaloj havas la saman formon kiel kristalojn de alĥemia energio. Kvankam vi ne povas senpere uzi ilin, la kristaloj iel influas al eliksiroj kaj skribrulaĵoj trovataj de vi.
items.trinkets.exoticcrystals.typical_stats_desc=Kutime tiu ĉi brilaĵo anstataŭigos _%s%%_ de trovataj eliksiroj kaj skribrulaĵoj per ekzotaj ekvivalentoj. La efiko ne influas al eliksiroj de povo, skribrulaĵoj de plibonigo kaj al aĵoj necesaj por solvi danĝerajn ĉambrojn.
items.trinkets.exoticcrystals.stats_desc=Je la nuna nivelo tiu ĉi brilaĵo anstataŭigos _%s%%_ de trovataj eliksiroj kaj skribrulaĵoj per ekzotaj ekvivalentoj. La efiko ne influas al eliksiroj de povo, skribrulaĵoj de plibonigo kaj al aĵoj necesaj por solvi danĝerajn ĉambrojn.

items.trinkets.eyeofnewt.name=okulo de salamandro
items.trinkets.eyeofnewt.desc=Tiu ĉi orkolor-nigra okulo de salamandro estas ordinara magia konsistaĵo, nun aranĝita al brilaĵo. La okulo ŝajnas malpliigi vian vidatingon kompense pro ebligi al vi vidi alimaniere.
items.trinkets.eyeofnewt.typical_stats_desc=Kutime tiu ĉi brilaĵo malpliigos vian vidatingon je _%1$s%%_ kaj ebligos al vi mensvidi malamikojn ene _%2$d_ kaheloj.
items.trinkets.eyeofnewt.stats_desc=Je la nuna nivelo tiu ĉi brilaĵo malpliigos vian vidatingon je _%1$s%%_ kaj ebligos al vi mensvidi malamikojn ene _%2$d_ kaheloj.

items.trinkets.ferrettuft.name=hartufo de ĉasputoro
items.trinkets.ferrettuft.desc=Tufo de glataj blankaj haroj de ĉasputoro, kunligitaj per verda rubando de lime-monstro kaj binditaj formante kokardon. Ĉasputoroj estas konataj pro sia lerteco, petolemo kaj manko de reguloj. Iom da tiuj ecoj ŝajnas radii el la brilaĵo, pliigante evitpovon de ĉiuj proksimuloj.
items.trinkets.ferrettuft.typical_stats_desc=Kutime tiu ĉi brilaĵo pliigos evitpovon de ĉiuj uloj je _%1$s%%_.
items.trinkets.ferrettuft.stats_desc=Je la nuna nivelo tiu ĉi brilaĵo pliigos evitpovon de ĉiuj uloj je _%1$s%%_.

items.trinkets.mimictooth.name=dento de imitulo
items.trinkets.mimictooth.desc=Tiu ĉi granda kaj akra dento estis elŝirita de iu tre malkontenta imitulo. Ĝi ŝajnas influi al imituloj en la labirinto, igante ilin pli oftaj kaj pli danĝeraj.
items.trinkets.mimictooth.typical_stats_desc=Kutime tiu ĉi brilaĵo igos ĉiujn imitulojn aperi _%1$s-oble_ pli ofte, ili estiĝos pli bone kamuflitaj kaj faligos pliajn trezorojn. Krom tio, ĉiu keletaĝo havos _%2$s%%_ ŝancon por enhavi mahagonan imitulon.
items.trinkets.mimictooth.stats_desc=Je la nuna nivelo tiu ĉi brilaĵo igos ĉiujn imitulojn aperi _%1$s-oble_ pli ofte, ili estiĝos pli bone kamuflitaj kaj faligos pliajn trezorojn. Krom tio, ĉiu keletaĝo havos _%2$s%%_ ŝancon por enhavi mahagonan imitulon.

items.trinkets.mossyclump.name=tufo de musko
items.trinkets.mossyclump.desc=Tiu ĉi tufo de malseka musko ŝajnas teni akvon sendepende de kiel forte vi kunpremas ĝin. Ĝi verŝajne estas magie ligita al la labirinto, igante herbon kaj akvon aperi pli ofte.
items.trinkets.mossyclump.typical_stats_desc=Kutime tiu ĉi brilaĵo igos ke, _%d%%_ de normaj keletaĝoj estos plenigitaj per akvo aŭ herbo.\n\nTiu ĉi brilaĵo bezonas multe da energio por pliboniĝi.
items.trinkets.mossyclump.stats_desc=Je la nuna nivelo tiu ĉi brilaĵo igos ke, _%d%%_ de normaj keletaĝoj estos plenigitaj per akvo aŭ herbo.\n\nTiu ĉi brilaĵo bezonas multe da energio por pliboniĝi.

items.trinkets.parchmentscrap.name=peco de pergameno
items.trinkets.parchmentscrap.desc=Tiu ĉi peceto de pergameno ŝajnas esti parto de skribrulaĵo. Ĝi tenas iom da sia praa magio kaj probable influas al armiloj kaj defendaĵoj trovataj en la labirinto.
items.trinkets.parchmentscrap.typical_stats_desc=Kutime tiu ĉi brilaĵo plioftigos aktivigon de ensorĉoj de skribaĵoj _%d-foje_ kaj malbenoj sur armiloj kaj defendaĵoj _%s-foje_. Ĝi ne influas al malbenoj sur vergoj, ringoj kaj antikvaĵoj.\n\nTiu ĉi brilaĵo bezonas multe da energio por pliboniĝi.
items.trinkets.parchmentscrap.stats_desc=Je la nuna nivelo tiu ĉi brilaĵo plioftigos aktivigon de ensorĉoj de skribaĵoj _%d-foje_ kaj malbenoj sur armiloj kaj defendaĵoj _%s-foje_. Ĝi ne influas al malbenoj sur vergoj, ringoj kaj antikvaĵoj.\n\nTiu ĉi brilaĵo bezonas multe da energio por pliboniĝi.

items.trinkets.petrifiedseed.name=ŝtonigita semo
items.trinkets.petrifiedseed.desc=Tiu ĉi semo fosiliiĝis aŭ per malrapidaj geologiaj sinsekvoj aŭ per magio. La semo ŝajnas magie influi al kreskaĵoj en la labirinto, iafoje anstataŭigante iliajn semojn per runŝtonoj.
items.trinkets.petrifiedseed.typical_stats_desc=Kutime tiu ĉi brilaĵo igos piedpremitan herbon faligi runŝtonojn anstataŭ semojn kun probablo _%1$s%%_ kaj igos altan herbon faligi aĵojn _%2$s%%_ pli ofte.
items.trinkets.petrifiedseed.stats_desc=Je la nuna nivelo tiu ĉi brilaĵo igos piedpremitan herbon faligi runŝtonojn anstataŭ semojn kun probablo _%1$s%%_ kaj igos altan herbon faligi aĵojn _%2$s%%_ pli ofte.

items.trinkets.ratskull.name=kranio de rato
items.trinkets.ratskull.desc=Tiu ĉi terura brilaĵo ne estas sufiĉe pli granda ol kranio de norma rato, kio estas stranga en tiu ĉi subtera labirinto. La magio de kranio ŝajnas allogi pli nekutimajn loĝantojn de la labirinto, igante ilin aperi pli ofte.
items.trinkets.ratskull.typical_stats_desc=Kutime tiu ĉi brilaĵo igos maloftajn ekzotajn monstrojn aperi _%d-oble_ pli ofte. Tamen ĝi estas nur duone efika en allogi kristalajn imitulojn kaj armitajn statuojn.
items.trinkets.ratskull.stats_desc=Je la nuna nivelo tiu ĉi brilaĵo igos maloftajn ekzotajn monstrojn aperi _%d-oble_ pli ofte. Tamen ĝi estas nur duone efika en allogi kristalajn imitulojn kaj armitajn statuojn.

items.trinkets.saltcube.name=salkubo
items.trinkets.saltcube.desc=Tiu ĉi granda kristalo de salo estas altranĉita al preskaŭ ideala kubo kaj anstataŭ dissolviĝi en la alĥemia kuirpoto, ĝi ensorbis duonon de akvo. Ĝi ŝajnas esti magie sekigi kaj konservi vian manĝaĵon, pliigante vian satecon, tamen malrapidigante sanigon dum esti sata.
items.trinkets.saltcube.typical_stats_desc=Kutime tiu ĉi brilaĵo pliigos vian daŭron de sateco je _%1$s%%_, sed ĝi ankaŭ malrapidigos replenadon de via sano je _%2$s%%_, escepte se la keletaĝo estos ŝlosita.
items.trinkets.saltcube.stats_desc=Je la nuna nivelo tiu ĉi brilaĵo pliigos vian daŭron de sateco je _%1$s%%_, sed ĝi ankaŭ malrapidigos replenadon de via sano je _%2$s%%_, escepte se la keletaĝo estos ŝlosita.

items.trinkets.shardofoblivion.name=rompaĵo de forgeso
items.trinkets.shardofoblivion.desc=Post kuiri en la alĥemia kuirpoto tiun ĉi etan fragmenton de malbenita metalo, ĝi ŝanĝiĝis al… neniaĵo? La fragmento kurbigas lumon kaj restas en la loko eĉ kiam vi ne tenas ĝin. Ĝi ŝajnas magie ĉerpi energion el via nescio, do eble estos bone ne pensi pri ĝi tro multe.
items.trinkets.shardofoblivion.typical_stats_desc=Kutime tiu ĉi brilaĵo pliigos ŝancon, ke malamikoj faligos trezoron je 20%% por ĉiu neidentigita surmetita aŭ antaŭnelonge uzita ekipaĵo, maksimume al _%d aĵo(j)_. La rompaĵo ankaŭ malebligos al vi identigi ekipaĵojn, sed vi povas permane identigi ilin, kiam ili estos pretaj por identigi.
items.trinkets.shardofoblivion.stats_desc=Je la nuna nivelo tiu ĉi brilaĵo pliigos ŝancon, ke malamikoj faligos trezoron je 20%% por ĉiu neidentigita surmetita aŭ antaŭnelonge uzita ekipaĵo, maksimume al _%d aĵo(j)_. La rompaĵo ankaŭ malebligos al vi identigi ekipaĵojn, sed vi povas permane identigi ilin, kiam ili estos pretaj por identigi.
items.trinkets.shardofoblivion.ac_identify=IDENTIGI
items.trinkets.shardofoblivion.identify_prompt=Identigi aĵon
items.trinkets.shardofoblivion.identify_ready=Aĵo estas preta por esti identigita: %s. Uzu vian rompaĵon de forgeso sur tiu ĉi aĵo por identigi ĝin.
items.trinkets.shardofoblivion.identify_ready_worn=Ĉiuj viaj surmetitaj armaĵoj estas pretaj por esti identigitaj. Uzu vian rompaĵon de forgeso sur ili por identigi ilin.
items.trinkets.shardofoblivion.identify_not_yet=Tiu ĉi aĵo jam ne estas preta por esti identigita.
items.trinkets.shardofoblivion.identify=Vi identigis aĵon!
items.trinkets.shardofoblivion$wandusetracker.name=Neidentigita uzita vergo
items.trinkets.shardofoblivion$wandusetracker.desc=Vi antaŭnelonge uzis neidentigitan vergon, kiu enkalkuliĝas al unu ekzemplero de uzita neidentiga aĵo por la rompaĵo de forgeso por mallonga tempo.\n\nPliaj temperoj: %s.
items.trinkets.shardofoblivion$thrownusetracker.name=Neidentigita uzita ĵetarmilo
items.trinkets.shardofoblivion$thrownusetracker.desc=Vi antaŭnelonge uzis neidentigitan ĵetarmilon, kiu enkalkuliĝas al unu ekzemplero de uzita neidentiga aĵo por la rompaĵo de forgeso por mallonga tempo.\n\nPliaj temperoj: %s.

items.trinkets.thirteenleafclover.name=dektrifolia trifolio
items.trinkets.thirteenleafclover.desc=Kuirado en la alĥemia kuirpoto igis tiun ĉi trifolion kreskigi multajn aldonajn foliojn! Oni ne scias, ĉu tiu ĉi brilaĵo liveras bonŝancon aŭ malbonŝancon, eble ĝi igos vian sorton pli ĥaosa?
items.trinkets.thirteenleafclover.typical_stats_desc=Kutime tiu ĉi brilaĵo rezultigos, ke viaj atakoj havos maksimuman vundpovon kun probablo _%1$d%%_ kaj minimuman vundpovon kun probablo _%2$d%%._
items.trinkets.thirteenleafclover.stats_desc=Je la nuna nivelo tiu ĉi brilaĵo rezultigos, ke viaj atakoj havos maksimuman vundpovon kun probablo _%1$d%%_ kaj minimuman vundpovon kun probablo _%2$d%%._

items.trinkets.trapmechanism.name=meĥanismo de kaptilo
items.trinkets.trapmechanism.desc=La kerna meĥanismo de iu abisma kaptilo, precize eltranĉita de la planko tiel, ke oni ĝin povas movi. Ĝi ŝajnas esti magie ligita al la labirinto, igante plankon de la labirinto pli danĝera kaj tamen pliigante vian intuicion pri ĝi.
items.trinkets.trapmechanism.typical_stats_desc=Kutime tiu ĉi brilaĵo kaŭzos, ke _%1$d%%_ de normaj keletaĝoj estos plenaj je kaptiloj aŭ abismoj. Krom tio, _%2$d%%_ de kaŝitaj kaptiloj estiĝos videblaj.
items.trinkets.trapmechanism.stats_desc=Je la nuna nivelo tiu ĉi brilaĵo kaŭzos, ke _%1$d%%_ de normaj keletaĝoj estos plenaj je kaptiloj aŭ abismoj. Krom tio, _%2$d%%_ de kaŝitaj kaptiloj estiĝos videblaj.

items.trinkets.vialofblood.name=provtubo de sango
items.trinkets.vialofblood.desc=Tiu ĉi maldika provtubo enhavas sangon de iu loĝanto de la labirinto, la sango malrapide fluas dum kiam vi turnas la provtubon. Ĝi ŝajnas magie plifortigi pli fortajn sanigajn efikojn, kompense pro prokrasti ilin.
items.trinkets.vialofblood.typical_stats_desc=Kutime tiu ĉi brilaĵo pliigos tutan sanon akiritan pro trinki eliksirojn de sano, akvon el via felsako kaj el putoj de sano je _%1$s%%._ Tamen la menciitaj efikoj agas malpli rapide, sanigante vin po _%2$s_ sanpoentoj per ĉiu tempero (tiu ĉi valoro pliiĝas kun nivelo de heroo).
items.trinkets.vialofblood.stats_desc=Je la nuna nivelo tiu ĉi brilaĵo pliigos tutan sanon akiritan pro trinki eliksirojn de sano, akvon el via felsako kaj el putoj de sano je _%1$s%%._ Tamen la menciitaj efikoj agas malpli rapide, sanigante vin po _%2$s_ sanpoentoj per ĉiu tempero (tiu ĉi valoro pliiĝas kun nivelo de heroo).

items.trinkets.wondrousresin.name=mirakla rezino
items.trinkets.wondrousresin.desc=Tiu ĉi glimanta blua rezino ŝajnas esti distilita magia esenco de malbenita vergo. La magio de alĥemia poto iel stabiligis la esencon, nun ĝi influas al viaj vergoj.
items.trinkets.wondrousresin.typical_stats_desc=Kutime tiu ĉi brilaĵo igos pafojn de malbenitaj vergoj utilaj aŭ neŭtraj kun _%1$s%%_ probablo kaj igos nemalbenitajn vergojn pafi malbenan kuglon kun utila aŭ neŭtra efiko kun _%2$s%%_ probablo.\n\nTiu ĉi brilaĵo bezonas multe da energio por pliboniĝi.
items.trinkets.wondrousresin.stats_desc=Je la nuna nivelo tiu ĉi brilaĵo igos pafojn de malbenitaj vergoj utilaj aŭ neŭtraj kun _%1$s%%_ probablo kaj igos nemalbenitajn vergojn pafi malbenan kuglon kun utila aŭ neŭtra efiko kun _%2$s%%_ probablo.\n\nTiu ĉi brilaĵo bezonas multe da energio por pliboniĝi.

items.trinkets.trinketcatalyst.name=magia katalizilo
items.trinkets.trinketcatalyst.window_title=krei brilaĵon
items.trinkets.trinketcatalyst.window_text=La akvo komenciĝis radii post aldoni katalizilon. Kelkajn proksimajn aĵojn vi povas plenigi per energio por krei magian brilaĵon.
items.trinkets.trinketcatalyst.desc=Tiu ĉi bulo de magia polvo briletas en mallumo de la labirinto. La katalizilon oni povas kuiri en la alĥemia kuirpoto kun iom da alĥemia energio por krei unikan brilaĵon.\n\nBrilaĵoj liveras diversajn efikojn, kiuj nesignife influas al la labirinto aŭ al ĝiaj loĝantoj. Trinkaĵojn oni povas plibonigi uzante pli da alĥemia energio por plifortigi efikojn, aŭ faligi por tute rezigni ilian efikon.
items.trinkets.trinketcatalyst$randomtrinket.name=hazarda brilaĵo
items.trinkets.trinketcatalyst$randomtrinket.desc=Iu proksima aĵo estas en fermita saketo, kiun vi ne povas malfermi.\n\nLa alĥemia reago dissolvos la saketon, sed ĝis la fino de reago vi ne scios pri la akirota brilaĵo!

items.trinkets.trinket.discover_hint=Estas ŝanco, ke tiu ĉi aĵo estos elektebla dum krei brilaĵon per alĥemio.
items.trinkets.trinket$placeholder.name=brilaĵo

###wands
items.wands.cursedwand.ondeath=Vi estis mortigita de via propra %s.
items.wands.cursedwand.nothing=Nenio okazas.
items.wands.cursedwand.mass_invuln=Blinduma lumo eliras el via sorĉbastono!
items.wands.cursedwand.petrify=En unu momento vi senmoviĝis!
items.wands.cursedwand.grass=Herbo kreskegas ĉirkaŭ vi!
items.wands.cursedwand.fire=Vi sentas fumon…
items.wands.cursedwand.transmogrify_wand=Via vergo ŝanĝiĝas al alia aĵo!
items.wands.cursedwand.transmogrify_other=Via aĵo transformiĝis al alia aĵo!
items.wands.cursedwand.disguise=Via apero komencas ŝanĝiĝi!
items.wands.cursedwand.supernova=Hela energi-globo komencas kreski. Jam estas tempo por forkuri!
items.wands.cursedwand.supernova_positive=Hela energi-globo komencas kreski, sed vi sentas vin malsekure.
items.wands.cursedwand.sinkhole=La planko ekigis forkuri!
items.wands.cursedwand.sinkhole_positive=La planko ekigis forkuri, sed grundo sub viaj piedoj ŝajnas esti firma.
items.wands.cursedwand.gravity=Gravito komencis altiri al hazardaj direktoj!
items.wands.cursedwand.gravity_positive=Gravito komencis altiri al hazardaj direktoj, sed tiu ĉi efiko ŝajnas ne influi al vi.
items.wands.cursedwand.gravity_end=Gravita ĥaoso finiĝis.

items.wands.damagewand.upgrade_stat_name_1=Magia vundpovo

items.wands.wand.ac_zap=PAFI
items.wands.wand.fizzles=Via vergo siblas, ĝi ne havas sufiĉe da ŝargoj.
items.wands.wand.no_magic=Via vergo siblas, vi ne povas uzi vergojn dum esti rezista al magio.
items.wands.wand.self_target=Vi ne povas alceli vin mem!
items.wands.wand.identify=Vi sufiĉe ekkonis kun via vergo por identigi ĝin.
items.wands.wand.resin_one=Tiu ĉi vergo gajnis _1 nivelon_ de mistera rezino.
items.wands.wand.resin_many=Tiu ĉi vergo gajnis _%d nivelojn_ de mistera rezino.
items.wands.wand.cursed=Tiu ĉi vergo estas malbenita, ĝia magio estas ĥaosa kaj hazarda.
items.wands.wand.not_cursed=Tiu ĉi vergo estas libera de fia magio.
items.wands.wand.curse_discover=Tiu ĉi %s estas malbenita!
items.wands.wand.prompt=Elektu kien pafi
items.wands.wand$placeholder.name=vergo

items.wands.wandofblastwave.name=vergo de eksploda ondo
items.wands.wandofblastwave.staff_name=bastonego de eksploda ondo
items.wands.wandofblastwave.ondeath=Vi mortigis vin mem per via vergo de eksploda ondo…
items.wands.wandofblastwave.knockback_ondeath=Vi disfrakasiĝis je muro…
items.wands.wandofblastwave.desc=Tiu ĉi vergo estas farita el ia marmora ŝtono kun ora ornamaĵo kaj cirkla nigra juvelŝtono sur la finaĵo. Ĝi ŝajnas tre peza en via mano.
items.wands.wandofblastwave.typical_stats_desc=Tiu ĉi vergo pafas kuglon, kiu brute eksplodas en la celo. La forto de eksplodo kutime kaŭzas _%1$d-%2$d vundpoentojn_ kaj estas sufiĉe potenca por ekflugigi plejparton de monstroj.
items.wands.wandofblastwave.stats_desc=Tiu ĉi vergo pafas kuglon, kiu brute eksplodas en la celo. La forto de eksplodo kaŭzas _%1$d-%2$d vundpoentojn_ kaj estas sufiĉe potenca por ekflugigi plejparton de monstroj.
items.wands.wandofblastwave.upgrade_stat_name_2=Forbato
items.wands.wandofblastwave.bmage_desc=Kiam _Batalmagiisto_ frapas paralizitan malamikon per la bastonego de eksploda ondo, la efiko “paralizita” finas kaŭzante kroman magian vundon. Necesas atendi iomete antaŭ ol malamiko estos denove vundebla al tiu ĉi efiko.
items.wands.wandofblastwave.eleblast_desc=Magia eksplodo ellasita per la bastonego de eksploda ondo vundas kun 67% forto kaj forbatas malamikojn eksteren de la eksplodejo.

items.wands.wandofcorrosion.name=vergo de korodo
items.wands.wandofcorrosion.staff_name=bastonego de korodo
items.wands.wandofcorrosion.desc=Tiu ĉi vergo havas palan trunkon, kiu tenas brilan oranĝan juvelŝtonon.
items.wands.wandofcorrosion.stats_desc=Tiu ĉi vergo pafas kuglon, kiu eksplodas formante nubeton de ege acid-morda gaso en alcela loko. Ĉiuj kaptitaj ene tiu ĉi nubeto ricevos vundon plifortiĝantan kun tempo, komencante de _%d_.
items.wands.wandofcorrosion.upgrade_stat_name_1=Koroda vundpovo
items.wands.wandofcorrosion.upgrade_stat_name_2=Volumeno de gaso
items.wands.wandofcorrosion.bmage_desc=Kiam _Batalmagiisto_ frapas malamikon per la bastonego de korodo, la malamiko povas ekesti acidmordata.
items.wands.wandofcorrosion.eleblast_desc=Magia eksplodo ellasita per la bastonego de korodo kaŭzas al malamikoj 4 temperojn de korodo komencanta kun 6 vundpoentojn.

items.wands.wandofcorruption.name=vergo de korupto
items.wands.wandofcorruption.staff_name=bastonego de korupto
items.wands.wandofcorruption.already_corrupted=Tiu ĉi monstro ne influeblas pli.
items.wands.wandofcorruption.desc=Tiu ĉi vergo radias malluman ĥaosan energion - se tio ne estas klara - el la eta ornamita kranio de ĝia finaĵo.
items.wands.wandofcorruption.stats_desc=Tiu ĉi vergo ellasos fulmon de koruptiga energio, kiu malfortigos malamikojn kaj eble eĉ persvadi ilin al via flanko. Malamikoj povas rezisti korupton, sed malfortigitaj malamikoj estas pli facile korupteblaj ol sanaj.
items.wands.wandofcorruption.upgrade_stat_name_1=Korupta povo
items.wands.wandofcorruption.upgrade_stat_name_2=Daŭro de fia efiko
items.wands.wandofcorruption.bmage_desc=Kiam _Batalmagiisto_ frapas malamikon per la bastonego de korupto, la malamiko povas ekesti influata de murdemo.
items.wands.wandofcorruption.eleblast_desc=Magia eksplodo ellasita per la bastonego de korupto kaŭzas al malamikoj 5 temperojn de murdemo.

items.wands.wandofdisintegration.name=vergo de dispecigo
items.wands.wandofdisintegration.staff_name=bastonego de dispecigo
items.wands.wandofdisintegration.desc=Tiu ĉi vergo estas farita el firma peco de obsidiano kun purpurega brilo. Ĝi lumas kun detruanta energio, atendante por pafi antaŭen.
items.wands.wandofdisintegration.stats_desc=Tiu ĉi vergo pafas faskon, kiu transiras ĉiujn barilojn, kaj ĝia atingo dependas de plibonigoj. La fasko kaŭzas _%1$d-%2$d vundpoentojn_ kaj kromajn vundpoentojn por ĉiu monstro kaj muro, kiun ĝi transiros.
items.wands.wandofdisintegration.upgrade_stat_name_2=Maksimuma pafatingo
items.wands.wandofdisintegration.bmage_desc=En la manoj de _Batalmagiisto_ la bastonego de dispecigo havas pliigitan atakatingon, samkiel ĝi havus plilongigitan ensorĉon.
items.wands.wandofdisintegration.eleblast_desc=Magia eksplodo ellasita per la bastonego de dispecigo vundas kun 100% forto kaj trairas murojn.

items.wands.wandoffireblast.name=vergo de fajroeksplodo
items.wands.wandoffireblast.staff_name=bastonego de fajroeksplodo
items.wands.wandoffireblast.desc=Tiu ĉi vergo estas farita el ruĝe lakita ligno kun orkolora folio por igi ĝin ordinare pli reĝeca. Ĝi kraketas kaj siblas ĉe finaĵo, dezirante ellasi sian potencan magion.
items.wands.wandoffireblast.stats_desc=Tiu ĉi vergo pafas konuson de fajro. Je la sekva pafo ĝi uzos _%1$d ŝargo(j)n_ kaj kaŭzos _%2$d-%3$d vundpoentojn._ Ju pli da ŝargoj la vergo uzos, des pli granda kaj forta ĝia efiko estos.
items.wands.wandoffireblast.upgrade_stat_name_1=Vundpovo de 1 ŝargo
items.wands.wandoffireblast.upgrade_stat_name_2=Vundpovo de 2 ŝargoj
items.wands.wandoffireblast.upgrade_stat_name_3=Vundpovo de 3 ŝargoj
items.wands.wandoffireblast.bmage_desc=Kiam _Batalmagiisto_ frapas malamikon per la bastonego de fajroeksplodo, estas ŝanco por kaŭzi eksplodon, kiu vundos malamikojn kaj nuligos ĉiun proksiman fajron! Ju pli da fajro apudas al malamiko, des pli granda probablo por tiu ĉi efiko.
items.wands.wandoffireblast.eleblast_desc=Magia eksplodo ellasita per la bastonego de fajroeksplodo vundas kun 100% forto, traigas malfermitajn pordojn kaj ekbruligas kontraŭulojn kaj teron.

items.wands.wandoffrost.name=vergo de frosto
items.wands.wandoffrost.staff_name=bastonego de frosto
items.wands.wandoffrost.desc=Tiu ĉi vergo verŝajne estas farita el ia magia glacio. Ĝi larĝiĝas kaj pliheliĝas ĝis sian rondigitan finaĵon. Ĝi ŝajnas tre malvarma, sed iel via mano pluas varma.
items.wands.wandoffrost.stats_desc=Tiu ĉi vergo pafas kuglojn de glacia energio direkte al viaj kontraŭuloj, kiuj ricevas _%1$d-%2$d vundpoentojn_ kaj malvarmigon. La efiko estas pli forta en akvo. Tamen jam frostigitaj aŭ malvarmigitaj malamikoj malpli vundiĝas rezulte de tiu vergo.
items.wands.wandoffrost.upgrade_stat_name_2=Daŭro de malvarmigo
items.wands.wandoffrost.bmage_desc=Kiam _Batalmagiisto_ frapas malvarmigitan malamikon per la bastonego de frosto, estas ŝanco ke ĝi senprokraste frostiĝos. Ju pli frostigita la malamiko estas, des pli alta la ŝanco estas.
items.wands.wandoffrost.eleblast_desc=Magia eksplodo ellasita per la bastonego de frosto vundas kun 100% forto, frostigas kontraŭulojn kaj estingas fajron.

items.wands.wandoflightning.name=vergo de fulmo
items.wands.wandoflightning.staff_name=bastonego de fulmo
items.wands.wandoflightning.ondeath=Vi mortigis vin mem per via vergo de fulmo…
items.wands.wandoflightning.desc=Tiu ĉi vergo estas farita el firma metalo, farante ĝin surprize peza. Du elektrodoj elstaras ĉe finaĵo, kaj elektra arko aperas inter ili.
items.wands.wandoflightning.stats_desc=Tiu ĉi vergo ellasas potencan fulmon, kiu elektros tra ĉiuj trafotaĵoj kaj kaŭzos _%1$d-%2$d vundpoentojn._ Ĝi elektros proksimajn monstrojn kaj pli facile disiĝas en akvo. La elektra arko povas vundi vin, sed ne vundos viajn amikojn.
items.wands.wandoflightning.bmage_desc=Kiam _Batalmagiisto_ frapas malamikon per la bastonego de fulmo, estas ŝanco por elektre ŝargi sin por 10 temperoj. Dum esti elektroŝargita Batalmagiisto estas rezista al elektro kaj konduktos elektran arkon plie.
items.wands.wandoflightning.eleblast_desc=Magia eksplodo ellasita per la bastonego de fulmo vundas kun 100% forto, surdigas kontraŭulojn por 5 temperoj kaj elektras akvon.
items.wands.wandoflightning$lightningcharge.name=Elektroŝargita
items.wands.wandoflightning$lightningcharge.desc=Batalmagiisto estas nuntempe ŝargita per elektro, igante lin rezista kontraŭ elektro de la bastonego de fulmo kaj pliigante atingon de elektra arko.\n\nPliaj temperoj: %s.

items.wands.wandoflivingearth.name=vergo de vivanta tero
items.wands.wandoflivingearth.staff_name=bastonego de vivanta tero
items.wands.wandoflivingearth.desc=Tiu ĉi vergo estas farita el nekutima roko, kun strioj de brileta flava energio. Ŝtonoj aspektas forŝovi kiam vi tenas la vergon, tiel kiel ili povas senti vian manon.
items.wands.wandoflivingearth.stats_desc=Tiu ĉi sorĉbastono pafas per kugloj de magiaj ŝtonegoj al malamikoj, kaŭzante _%1$d-%2$d vundpoentojn._ Tiuj ŝtonegoj formas defendaĵon ĉirkaŭ la uzanto, donante al li ŝirmon proporcian al kaŭzitaj vundoj. Se sufiĉe da defendaĵo formiĝas, tera gardisto aperos je la sekva uzo de vergo.
items.wands.wandoflivingearth.upgrade_stat_name_2=Maksimuma sano de gardisto
items.wands.wandoflivingearth.upgrade_stat_name_3=Defend-povo de gardisto
items.wands.wandoflivingearth.bmage_desc=Kiam _Batalmagiisto_ frapas malamikon per la bastonego de vivanta tero, iom da kaŭzitaj vundpoentoj revenas al li kiel ŝtona defendaĵo.
items.wands.wandoflivingearth.eleblast_desc=Magia eksplodo ellasita per la bastonego de vivanta tero vundas kun 50% forto kaj sanigas aktivan teran gardiston kun ĉiu frapita malamiko.
items.wands.wandoflivingearth$rockarmor.name=ŝtona defendaĵo
items.wands.wandoflivingearth$rockarmor.desc=Magiaj śtonegoj ĉirkaŭas vian korpon, kiam vi estas atakata, ili ŝirmas vin, malpliigante ricevatajn vundojn je 50%%. Tamen ĉiu blokita atako disfendas iom da ŝtonegoj.\n\nPlia defendaĵo: %1$d.\n\nSe sufiĉe da ŝtonoj kolektas ĉirkaŭ vi, la sekva uzo de vergo de vivanta tero kaŭzos ŝtonegoj kolektiĝi formante la teran gardiston, kiu batalos por vi.\n\nDefendaĵo necesa por formi gardiston: %2$d.
items.wands.wandoflivingearth$rockarmor.desc_many=Tiu tera gardisto ankaŭ profitas de la plurforto. Pliaj temperoj: %d.
items.wands.wandoflivingearth$earthguardian.name=tera gardisto
items.wands.wandoflivingearth$earthguardian.desc=Magiaj ŝtonoj el via vergo de vivanta tero formis protektantan teran gardiston! Tiu ĉi ŝtona protektanto atakos proksimajn malamikojn, do ili atakos la gardiston anstataŭ vin. Kiam ĉiuj proksimaj danĝeroj malaperos, la gardisto reformos defendaĵon ĉirkaŭ vi kaj revenos je la sekva uzo de vergo.
items.wands.wandoflivingearth$earthguardian.wand_info=Defenda povo de gardisto dependas de nivelo de via vergo. Ĝi nuntempe blokas _%1$d-%2$d vundpoentojn._
items.wands.wandoflivingearth$earthguardian.discover_hint=Vi povas renkonti tian ulon uzante la specifan vergon.

items.wands.wandofmagicmissile.name=vergo de magia kuglo
items.wands.wandofmagicmissile.staff_name=bastonego de magia kuglo
items.wands.wandofmagicmissile.desc=Tiu ĉi ordinara vergo pafas kuglojn de pura magia energio. Malgraŭ tio, ke la vergo ne distingiĝas per iu speciala efiko, ĝi havas pli da ŝargoj kaj povas portempe pliigi povon de aliaj vergoj, kiam ĝi estas plibonigita.
items.wands.wandofmagicmissile.stats_desc=Ĉiu kuglo de tiu ĉi vergo kaŭzas _%1$d-%2$d vundpoentojn_ kaj povas portempe pliigi povon de aliaj vergoj, kiam ĝi estas plibonigita.
items.wands.wandofmagicmissile.bmage_desc=Kiam _Batalmagiisto_ frapas malamikon per la bastonego de magia kuglo, ĉiuj liaj vergoj kaj la bastonego ricevos aldonan ŝargon.
items.wands.wandofmagicmissile.eleblast_desc=Magia eksplodo ellasita per la bastonego de magia kuglo vundas kun 50% forto kaj donas 15 temperojn de ŝargado.
items.wands.wandofmagicmissile.discover_hint=Iu el la herooj komencas kun tiu ĉi aĵo.
items.wands.wandofmagicmissile$magiccharge.name=magia ŝargado
items.wands.wandofmagicmissile$magiccharge.desc=Via vergo de magia kuglo plenigas aliajn vergojn per energio, pliigante ilian efikan nivelon je la sekva pafo.\n\nPovo de viaj vergoj estas pliigita je: +%d.\n\nPliaj temperoj de magia ŝargado: %s.

items.wands.wandofprismaticlight.name=vergo de prisma lumo
items.wands.wandofprismaticlight.staff_name=bastonego de prisma lumo
items.wands.wandofprismaticlight.desc=Tiu ĉi vergo estas farita el firma peco de diafana kristalo, kiel longa peco de glata vitro. Etaj pecoj de kolorplena lumo dancas ĉirkaŭ la finaĵo de la vergo, dezirante eliĝi antaŭen.
items.wands.wandofprismaticlight.stats_desc=Tiu ĉi vergo pafas lumradiojn, kiuj traigas mallumon de la labirinto kaj malkovras kaŝitajn lokojn kaj kaptilojn. La fasko povas blindumi malamikojn kaj kaŭzas _%1$d-%2$d vundpoentojn._ Demonaj kaj nemortaj bestaĉoj flamos en hela lumo de la vergo, ricevonte kromajn vundojn.
items.wands.wandofprismaticlight.upgrade_stat_name_2=Ŝanco por blindumi
items.wands.wandofprismaticlight.upgrade_stat_name_3=Daŭro de lumo
items.wands.wandofprismaticlight.bmage_desc=Kiam _Batalmagiisto_ frapas malamikon per la bastonego de prisma lumo, la malamiko estos kripligita por ioma tempo proporcia al nivelo de la bastonego.
items.wands.wandofprismaticlight.eleblast_desc=Magia eksplodo ellasita per la bastonego de prisma lumo vundas kun 67% forto, malkovras ĉiun terenon ene la eksplodejo kaj blindumas kontraŭulojn por 5 temperoj.

items.wands.wandofregrowth.name=vergo de kreskado
items.wands.wandofregrowth.staff_name=bastonego de kreskado
items.wands.wandofregrowth.desc=Tiu ĉi vergo estas farita el maldika bastono de zorge skulptita ligno. Iele ĝi estas plu viva kaj vibranta, kaj helverda kiel nova tigo. “Kiam vivo finiĝas, nova vivo ĉiam naskiĝas… La eterna ciklo senĉese daŭras!”
items.wands.wandofregrowth.stats_desc=Je uzo, tiu ĉi vergo ellasos magian kreskigan energion en la formo de konuso, kiu vivigos herbojn, radikojn kaj maloftajn vegetaĵojn. La sekva pafo uzos _%1$d ŝargo(j)n._ Ju pli da ŝargoj la vergo uzos, des pli granda kaj forta ĝia efiko estos.
items.wands.wandofregrowth.degradation=Post uzi _%d ŝargojn_ tiu ĉi vergo ĉesos kreskigi vegetaĵojn kaj freŝan herbon. Tiu ĉi limigo estos pliigita kiam vi pliniveliĝos aŭ plibonigos la vergon.
items.wands.wandofregrowth.upgrade_stat_name_1=Herboj je ŝargo
items.wands.wandofregrowth.upgrade_stat_name_2=Tuta limigo de herbo
items.wands.wandofregrowth.bmage_desc=Kiam _Batalmagiisto_ frapas malamikon per la bastonego de kreskado aŭ staras sur herbo, li akiros vegetaĵan sanigadon proporcie al kaŭzataj vundpoentoj.
items.wands.wandofregrowth.eleblast_desc=Magia eksplodo ellasita per la bastonego de kreskado elradikigas malamikojn kaj kreskigas herbon ekster la eksplodejo.
items.wands.wandofregrowth$dewcatcher.name=Roskaptanto
items.wands.wandofregrowth$dewcatcher.desc=Roskaptantoj estas miraklaj vegetaĵoj, kiuj pleniĝas per magia roso. Ili provas kaŝmaskiĝi kiel herbo por eviti atenton, sed iliaj bulboj de kolektita roso malkovras ilin.
items.wands.wandofregrowth$dewcatcher.discover_hint=Vi povas trovi tian kreskaĵon uzante la specifan vergon.
items.wands.wandofregrowth$seedpod.name=Semsilikvo
items.wands.wandofregrowth$seedpod.desc=Semsilikvoj estas magiaj vegetaĵoj, kiuj naskas semojn de aliaj specoj de vegetaĵoj, anstataŭ siajn. Ili iel reproduktiĝas malgraŭ tio, ke ili ne havas siajn semojn.
items.wands.wandofregrowth$seedpod.discover_hint=Vi povas trovi tian kreskaĵon uzante la specifan vergon.
items.wands.wandofregrowth$lotus.name=Ora lotuso
items.wands.wandofregrowth$lotus.desc=Ora lotuso estas mistera vegetaĵo, kiu povas aperi nur pro uzi potencan vergon de kreskado. Ĝia etoso plifortigas ĉiujn vegetaĵojn kaj iliajn efikojn, tamen la lotuso eluzas sian energion kaj mortas post nelonga tempo.
items.wands.wandofregrowth$lotus.wand_info=Tiu ĉi lotuso kreskis pro uzi _%1$d-nivelan_ vergon de kreskado. Ĉiuj vegetaĵoj sub ĝia influo _tuj ĝermos_ kiam ĵetitaj sur ulo. Vegetaĵoj ankaŭ havos _%2$d%% ŝancon_ por faligi sian semon kaj trempitaj sagetoj perdos _%3$d%% malpli da firmeco._
items.wands.wandofregrowth$lotus.discover_hint=Vi povas trovi tian kreskaĵon uzante la specifan vergon, post plibonigi ĝin plurfoje.

items.wands.wandoftransfusion.name=vergo de transfluigo
items.wands.wandoftransfusion.staff_name=bastonego de transfluigo
items.wands.wandoftransfusion.ondeath=Vi mortigis vin mem per via vergo de transfluigo…
items.wands.wandoftransfusion.charged=Via bastonego estas ŝargita per la vivenergio de via kontraŭulo!
items.wands.wandoftransfusion.desc=Kutime formita vergo, ĝi distingiĝas per sia fuksina nuanco kaj negrega juvelŝtono ĉe la finaĵo.
items.wands.wandoftransfusion.stats_desc=Kiam uzita sur amikoj aŭ ĉarmitaj malamikoj, tiu ĉi vergo elsuĉos _%1$d da sano de la uzanto_ por sanigi aŭ ŝirmi la (mal)amikon per _%2$d da sano._ Kiam uzita sur malamikoj, la vergo por nelonge ĉarmos ilin kaj samtempe donos _%3$d da ŝirmo_ al la uzanto. Minacaj nemortaj bestaĉoj ricevos _%4$d-%5$d vundpoentojn_ anstataŭ esti ĉarmitaj.
items.wands.wandoftransfusion.upgrade_stat_name_1=Amika sanigado
items.wands.wandoftransfusion.upgrade_stat_name_2=Memŝirmo
items.wands.wandoftransfusion.upgrade_stat_name_3=Vundpovo kontraŭ nemortaj
items.wands.wandoftransfusion.bmage_desc=Kiam _Batalmagiisto_ frapas ĉarmatan malamikon per la bastonego de transfluigo, li ricevos ŝirmon kaj lia sekva vergopafo per la bastonego ne konsumos sanon.
items.wands.wandoftransfusion.eleblast_desc=Magia eksplodo ellasita per la bastonego de transfluigo ĉarmas malamikojn, sanigas amikojn kaj vundas kun 100% forto nemortajn kontraŭulojn.

items.wands.wandofwarding.name=vergo de gardisto
items.wands.wandofwarding.staff_name=bastonego de gardisto
items.wands.wandofwarding.no_more_wards=Via vergo ne povas subteni pliajn gardistojn.
items.wands.wandofwarding.bad_location=Ve ne povas loki gardiston tie.
items.wands.wandofwarding.desc=Tiu ĉi mallonga metala vergo posedas helan violkoloran kristalon ĉe ĝia finaĵo.
items.wands.wandofwarding.stats_desc=Anstataŭ senpere ataki malamikon, tiu ĉi sorĉbastono alvokos senmovajn gardistojn kaj protektistojn. Eblas alvoki gardistojn ĉie en via vidatingo, eĉ trans muroj. Tiu ĉi vergos povas subteni gardistojn kun _%d da energio_ samtempe.
items.wands.wandofwarding.upgrade_stat_name_1=Vundpovo de gardisto
items.wands.wandofwarding.upgrade_stat_name_2=Energio de gardisto
items.wands.wandofwarding.bmage_desc=Kiam _Batalmagiisto_ frapas kontraŭulon per la bastonego de gardisto, estas ŝanco por sanigi ĉiujn aktivajn gardistojn kaj protektistojn.
items.wands.wandofwarding.eleblast_desc=Magia eksplodo ellasita per la bastonego de gardisto sanigas ĉiujn protektistojn kaj gardistojn ene la eksplodejo.
items.wands.wandofwarding$ward.desc_generic_ward=Tiu ĉi gardisto aŭtomate pafos ĉiujn malamikojn en ĝia vidatingo.\n\nPafu tiun gardiston per via vergo de gardisto por plibonigi ĝin.\n\nGardistoj havas limigitan nombron da pafoj antaŭ ol malaperi.
items.wands.wandofwarding$ward.desc_generic_sentry=Tiu ĉi protektisto povas pafi tiel forte kiel gardisto, sed ĝi havas sanon anstataŭ limigitan nombron da pafoj. Ĝi iomete similas al la juvelŝtono sur finaĵo de via vergo de gardisto.\n\nPafu tiun protektiston per via vergo de gardisto por plibonigi kaj sanigi ĝin.\n\nTiu protektisto uzos iom da sia sano je ĉiu pafo al malamiko, tamen vi povas sanigi ĝin per via vergo.
items.wands.wandofwarding$ward.name_1=gardisto malsupera
items.wands.wandofwarding$ward.desc_1=Tiu ĉi baznivela gardisto aŭtomate pafos ĉiujn malamikojn en ĝia vidatingo, kaŭzante _%1$d-%2$d vundpoentojn._\n\nPafu tiun gardiston per via vergo de gardisto por plibonigi ĝin.\n\nTiu gardisto pafos nur unufoje antaŭ ol malaperi.\n\nVia vergo uzas _%3$d da energio_ por subteni tiun gardiston.
items.wands.wandofwarding$ward.name_2=gardisto
items.wands.wandofwarding$ward.desc_2=Tiu ĉi plibonigita gardisto estas pli kompleksa kaj povas ataki plurfoje. Ĉiu pafo de tiu gardisto kaŭzos _%1$d-%2$d vundpoentojn._\n\nPafu tiun gardiston per via vergo de gardisto por plibonigi ǵin.\n\nTiu gardisto pafos trifoje antaŭ malaperi.\n\nVia vergo uzas _%3$d da energio_ por subteni tiun gardiston.
items.wands.wandofwarding$ward.name_3=gardisto supera
items.wands.wandofwarding$ward.desc_3=Tiu ĉi plene plibonigita gardisto povas ataki pli foje ol liaj prauloj. Ĉiu pafo de tiu gardisto kaŭzos _%1$d-%2$d vundpoentojn._\n\nPafu tiun gardiston per via vergo de gardisto por plibonigi ĝin.\n\nTiu gardisto pafos kvinfoje antaŭ ol malaperi.\n\nVia vergo uzas _%3$d da energio_ por subteni tiun gardiston.
items.wands.wandofwarding$ward.name_4=protektisto malsupera
items.wands.wandofwarding$ward.desc_4=Tiu ĉi malsupera protektisto povas pafi tiel forte kiel supera gardisto, sed ĝi havas sanon anstataŭ limigitan nombron da pafoj. Ĝi iomete similas al juvelŝtono sur la finaĵo de via vergo de gardisto. Ĉiu pafo de tiu protektisto kaŭzos _%1$d-%2$d vundpoentojn._\n\nPafu tiun protektiston per via vergo de gardisto por plibonigi kaj sanigi ĝin.\n\nTiu protektisto uzos iom da sia sano je ĉiu pafo al malamiko, tamen vi povas sanigi ĝin per via vergo.\n\nVia vergo uzas _%3$d da energio_ por subteni tiun protektiston.
items.wands.wandofwarding$ward.name_5=protektisto
items.wands.wandofwarding$ward.desc_5=Tiu ĉi plibonigita protektisto estas pli granda kaj pli rezista ol malsupera protektisto. Ĉiu pafo de tiu protektisto kaŭzos _%1$d-%2$d vundpoentojn._\n\nPafu tiun protektiston per via vergo de gardisto por plibonigi kaj sanigi ĝin.\n\nTiu protektisto uzos iom da sia sano je ĉiu pafo al malamiko, tamen vi povas sanigi ĝin per via vergo.\n\nVia vergo uzas _%3$d da energio_ por subteni tiun protektiston.
items.wands.wandofwarding$ward.name_6=protektisto supera
items.wands.wandofwarding$ward.desc_6=Tiu ĉi plene plibonigita protektisto estas signife pli rezista ol ĝiaj prauloj. Ĉiu pafo de tiu protektisto kaŭzos _%1$d-%2$d vundpoentojn._\n\nPafu tiun protektiston per via vergo de gardisto por sanigi ĝin.\n\nTiu protektisto uzos iom da sia sano je ĉiu pafo al malamiko, tamen vi povas sanigi ĝin per via vergo.\n\nVia vergo uzas _%3$d da energio_ por subteni tiun protektiston.
items.wands.wandofwarding$ward.discover_hint=Vi povas renkonti tian ulon uzante la specifan vergon.
items.wands.wandofwarding$ward.dismiss_title=Ĉu eksigi tiun ĉi gardiston?
items.wands.wandofwarding$ward.dismiss_body=Vi povas eksigi tiun ĉi gardiston, se vi ne plu volas subteni ĝin. Tio senprokraste forigos la gardiston.\n\nĈu eksigi tiun ĉi gardiston?
items.wands.wandofwarding$ward.dismiss_confirm=jes
items.wands.wandofwarding$ward.dismiss_cancel=ne

###weapon curses
items.weapon.curses.annoying.name=koleriga %s
items.weapon.curses.annoying.msg_1=HO, ĈU NI BATALOS KONTRAŬ IUN?
items.weapon.curses.annoying.msg_2=HURA, FRAPEGU ILIN!
items.weapon.curses.annoying.msg_3=HOLA!
items.weapon.curses.annoying.msg_4=ĈU NI JAM ESTAS ĈE LA SUPERMONSTRO?
items.weapon.curses.annoying.msg_5=HO VE, NE BALANCU MIN TIEL FORTE!
items.weapon.curses.annoying.msg_6=INSEKTO MORTU!
items.weapon.curses.annoying.msg_7=ŬAAAAAAAAAAAAAAAAAAA!
items.weapon.curses.annoying.msg_8=ĈU NI POVAS PAŬZI?
items.weapon.curses.annoying.msg_9=BUM, HA HA!
items.weapon.curses.annoying.msg_10=PERFEKTA FRAPO!
items.weapon.curses.annoying.msg_11=Mi ne volis esti armilo, mi volis esti hakilo de arbhakisto.
items.weapon.curses.annoying.msg_12=Troa memfido estas malrapida kaj ruza mortigisto.
items.weapon.curses.annoying.msg_13=ĈIUJ VIA BAZO ESTAS APARTENI AL NI!
items.weapon.curses.annoying.desc=Kolerigaj armiloj povas paroli, sed ili estas ete tro viglaj. Ili ofte absorbas atenton sur vi pretervole.
items.weapon.curses.annoying.elestrike_desc=Elementa frap-ondo per koleriga armilo havas 20% ŝancon por kaŭzi 6-temperan murdemon al ĉiu malamiko en la atakatingo.

items.weapon.curses.dazzling.name=blinduma %s
items.weapon.curses.dazzling.desc=Blindumaj armiloj de tempo al tempo ellasas brilegan lumon blindumantan ĉiun, kiu rigardas ĝin.
items.weapon.curses.dazzling.elestrike_desc=Elementa frap-ondo per blinduma armilo havas 50% ŝancon por blindumi ĉiun malamikon en la atakatingo por 6 temperoj.

items.weapon.curses.displacing.name=fitransporta %s
items.weapon.curses.displacing.desc=Fitransportaj armiloj estas ensorĉitaj per ĥaose teleportanta magio, kiu povas teleporti kontraŭuloj hazarde en la keletaĝo.
items.weapon.curses.displacing.elestrike_desc=Elementa frap-ondo per fitransporta armilo havas 50% ŝancon por teleportigi ĉiun malamikon en la atakatingo.

items.weapon.curses.explosive.name=eksploda %s
items.weapon.curses.explosive.warm=Varma…
items.weapon.curses.explosive.hot=Varmega!
items.weapon.curses.explosive.desc=Eksplodaj armiloj senĉese ŝargiĝas per energio kaj sekve eksplodas difektante ĉion proksime.
items.weapon.curses.explosive.desc_cool=Via armilo nuntempe estas malvarma.
items.weapon.curses.explosive.desc_warm=Via armilo ŝargiĝas per energio kaj varmiĝas…
items.weapon.curses.explosive.desc_hot=Via armilo estas varmega! Baldaŭ ĝi eksplodos!
items.weapon.curses.explosive.elestrike_desc=Elementa frap-ondo per eksploda armilo havas 50% ŝancon por kaŭzi eksplodon ĉe hazarda malamiko en la atakatingo.

items.weapon.curses.friendly.name=amikema %s
items.weapon.curses.friendly.desc=Amikemaj armiloj taŭgas por pacistoj, ili de tempo al tempo ellasas magion, kiu malebligas batali.
items.weapon.curses.friendly.elestrike_desc=Elementa frap-ondo per amikema armilo havas 50% ŝancon por ĉarmi ĉiun malamikon en la atakatingo por 6 temperoj.

items.weapon.curses.polarized.name=polarizita %s
items.weapon.curses.polarized.desc=Polarizita armilo estas regata de magio, kiu igos la armilon kaŭzi aŭ 50% pli da vundpoentoj aŭ neniun vundpoenton.
items.weapon.curses.polarized.elestrike_desc=Elementa frap-ondo per polarizita armilo havas 50% ŝancon por kaŭzi 24-36 vundpoentojn por ĉiu malamiko en la atakatingo.

items.weapon.curses.sacrificial.name=sangavida %s
items.weapon.curses.sacrificial.desc=Sangavidaj armiloj postulos sangon de portanto por ataki kontraŭuloj. Ju pli sana la portanto estas, des pli multe da sango la malbeno elverŝos.
items.weapon.curses.sacrificial.elestrike_desc=Elementa frap-ondo per sangavida armilo kaŭzos 12-sanpoentan sangadon al la heroino kaj al ĉiu malamiko en la atakatingo.

items.weapon.curses.wayward.name=arbitra %s
items.weapon.curses.wayward.desc=Arbitraj armiloj kelkfoje estas ekstreme malprecizaj. Tiu ĉi magiaĵo daŭras por momente post aktiviĝo kaj povas esti nuligita per fari frapon per la arbitra armilo.
items.weapon.curses.wayward.elestrike_desc=Elementa frap-ondo per arbitra armilo havas 50% ŝancon por fisorĉi ĉiun malamikon en la atakatingo por 6 temperoj.
items.weapon.curses.wayward$waywardbuff.name=arbitreco
items.weapon.curses.wayward$waywardbuff.desc=Arbitra malbeno de via armilo aktiviĝis igante vian armilon ekstreme malpreciza. Tio ĉi ne efikos sur garantiataj frapoj, ekzemple surprizitaj atakoj. Sukcesa frapo per arbitra armilo senprokraste nuligos la arbitrecon.\n\nPliaj temperoj de arbitreco: %s.

###enchantments
items.weapon.enchantments.blazing.name=bruliga %s
items.weapon.enchantments.blazing.desc=Tiu ĉi ensorĉo igas armilon disigi flamojn, ekbrulante kontraŭulojn kaj kaŭzante kromajn vundojn al malamikoj, kiuj jam brulas.
items.weapon.enchantments.blazing.elestrike_desc=Elementa frap-ondo per bruliga armilo flamigas ĉiun kahelon en la atakatingo por 8 temperoj.

items.weapon.enchantments.blocking.name=defenda %s
items.weapon.enchantments.blocking.desc=Defendaj armiloj havas ŝancon por provizore ŝirmi vin post plenumi frapon.
items.weapon.enchantments.blocking.elestrike_desc=Elementa frap-ondo per defenda armilo donas al Duelistino po 6 poentoj da ŝirmo por ĉiu kontraŭulo en la atakatingo.
items.weapon.enchantments.blocking$blockbuff.name=defendo
items.weapon.enchantments.blocking$blockbuff.desc=Defenda ensorĉo de via armilo provizore pliigas vian defendon!\n\nPlia ŝirmo: %d\n\nPliaj temperoj: %s.

items.weapon.enchantments.blooming.name=floriga %s
items.weapon.enchantments.blooming.desc=Florigaj armiloj enhavas magion, kiu kaŭzos kreskaĵoj vegeti sur aŭ apud la frapita ulo.
items.weapon.enchantments.blooming.elestrike_desc=Elementa frap-ondo per floriga armilo kreskigas herbon je maksimuma distanco de 8 kaheloj kaj enradikigos ĉiujn malamikojn en la atakatingo por 6 temperoj.

items.weapon.enchantments.chilling.name=trankviliga %s
items.weapon.enchantments.chilling.desc=Monstroj frapitaj per tiu ĉi ensorĉo estas trankviligitaj, kaj iliaj movoj kaj atakoj iĝas pli malrapidaj.
items.weapon.enchantments.chilling.elestrike_desc=Elementa frap-ondo per trankviliga armilo disigos malvarman aeron al ĉiu kahelo en la atakatingo por 8 temperoj.

items.weapon.enchantments.kinetic.name=kineta %s
items.weapon.enchantments.kinetic.desc=Kiam malamiko estas mortigita per uzo de kineta armilo, ĉiu troa forto konserviĝas en la armilo kaj ellasiĝos je la sekva sukcesa frapo.
items.weapon.enchantments.kinetic.elestrike_desc=Elementa frap-ondo per kineta armilo kaŭzas po 40% de konservita vundpovo al ĉiu malamiko en la atakatingo, escepte de la ĉefa celo.
items.weapon.enchantments.kinetic$conserveddamage.name=konservita vundpovo
items.weapon.enchantments.kinetic$conserveddamage.desc=Via armilo konservis troan forton de la antaŭa mortiga frapo kaj ellasos ĝin kiel kroman vundon je via sekva frapo. Tamen tiu ĉi energio malrapidete malaperos laŭtempe.\n\nKonservitaj vundpoentoj: %d.

items.weapon.enchantments.corrupting.name=korupta %s
items.weapon.enchantments.corrupting.desc=Tiu ĉi potenca ensorĉo povas persvadi malamikojn al via flanko. Kiam monstro estas mortigita per tiu ĉi armilo, estas ŝanco, ke ĝi estos koruptita anstataŭ morti.
items.weapon.enchantments.corrupting.elestrike_desc=Elementa frap-ondo per korupta armilo havas 5-25% ŝancon (dependan de mankanta sano) por korupti ĉiun malamikon en la atakatingo, escepte de la ĉefa celo.

items.weapon.enchantments.elastic.name=elasta %s
items.weapon.enchantments.elastic.desc=Elastaj armiloj havas ŝancon por forpuŝi malamikojn je eta distanco.
items.weapon.enchantments.elastic.elestrike_desc=Elementa frap-ondo per elasta armilo forbatas je 5 kaheloj ĉiujn malamikojn en la atakatingo.

items.weapon.enchantments.grim.name=finfrapa %s
items.weapon.enchantments.grim.desc=Tiu ĉi potenca ensorĉo kapablas tuj senvivigi kontraŭulon. Des pli ebla la efiko estas, ju malpli forta la kontraŭulo estas.
items.weapon.enchantments.grim.elestrike_desc=Elementa frap-ondo per finfrapa armilo havas 6-30% ŝancon (dependan de mankanta sano) por mortigi ĉiun malamikon en la atakatingo, escepte de la ĉefa celo.

items.weapon.enchantments.lucky.name=bonŝanca %s
items.weapon.enchantments.lucky.desc=Monstroj mortigitaj per bonŝanca armilo havos ŝancon faligi iun trezoron.
items.weapon.enchantments.lucky.elestrike_desc=Elementa frap-ondo per bonŝanca armilo havas 12,5% ŝancon por ke ĉiu malamiko en la atakatingo faligu trezoron. La menciita efiko povas aktiviĝi nur unuoble por ĉiu malamiko.

items.weapon.enchantments.projecting.name=plilongigita %s
items.weapon.enchantments.projecting.desc=Kun tiu ĉi ensorĉo permanaj armiloj akiros plian atingon. Ĵetarmiloj povos traigi murojn, kiam vi celos ulojn proksime.
items.weapon.enchantments.projecting.elestrike_desc=Elementa frap-ondo per plilongigita armilo kaŭzas 30% kroman vundon al ĉiu malamiko en la atakatingo, escepte de la ĉefa celo.

items.weapon.enchantments.shocking.name=ŝoka %s
items.weapon.enchantments.shocking.desc=Elektra arko el ŝoka armilo kaŭzos kromajn vundojn al ĉiuj proksimaj kontraŭuloj.
items.weapon.enchantments.shocking.elestrike_desc=Elementa frap-ondo per ŝoka armilo disigos elektron al ĉiu kahelo en la atakatingo por 8 temperoj.

items.weapon.enchantments.unstable.name=nestabila %s
items.weapon.enchantments.unstable.desc=Tiu ĉi ensorĉo radias ĥaosan energion, kiu agas diference je ĉiu frapo.
items.weapon.enchantments.unstable.elestrike_desc=Elementa frap-ondo per nestabila armilo aktivigos hazardan ensorĉan efikon la ĉiu malamiko en la atakatingo, escepte de la ĉefa celo.

items.weapon.enchantments.vampiric.name=vampira %s
items.weapon.enchantments.vampiric.desc=Tiu ĉi potenca ensorĉo elsuĉas vivenergion el kontraŭuloj je ĉiu frapo kaj transverŝas ĝin al la portanto. Ju malpli da sano la portanto havas, des pli forta la efiko estas.
items.weapon.enchantments.vampiric.elestrike_desc=Elementa frap-ondo per vampira armilo sanigos Duelistinon po 2,5 sanpoentoj por ĉiu malamiko en la atakatingo.


###melee weapons
items.weapon.melee.assassinsblade.name=mortiga klingo
items.weapon.melee.assassinsblade.stats_desc=Tiu ĉi armilo estas pli efika kontraŭ surprizitaj malamikoj.
items.weapon.melee.assassinsblade.ability_name=ŝteliri
items.weapon.melee.assassinsblade.typical_ability_desc=Duelistino tenanta mortigan klingon povas _ŝteliri_. Tiu ĉi armila kapablo ebligos al ŝi senprokraste ekaperi maksimume 3 kaheloj for kaj probable donos al ŝi _%d temperojn da nevidebleco._
items.weapon.melee.assassinsblade.ability_desc=Duelistino tenanta mortigan klingon povas _ŝteliri_. Tiu ĉi armila kapablo ebligos al ŝi senprokraste ekaperi maksimume 3 kaheloj for kaj donos al ŝi _%d temperojn da nevidebleco._
items.weapon.melee.assassinsblade.upgrade_ability_stat_name=Daŭro de special-atako
items.weapon.melee.assassinsblade.desc=Malgranda ondforma razilo farita el obsidiano, malfacile uzebla malgraŭ esti malpeza, sed mortiga se ĝi trafas celon.

items.weapon.melee.battleaxe.name=batalhakilo
items.weapon.melee.battleaxe.stats_desc=Ĝi estas ja preciza armilo.
items.weapon.melee.battleaxe.ability_name=frapegi
items.weapon.melee.battleaxe.typical_ability_desc=Duelistino povas plenumi _frapegon_ per batalhakilo. Tiu intensa atako probable kaŭzos _%1$d-%2$d vundpoentojn_ kontraŭ surprizita malamiko kaj konfuzos lin por 5 temperoj dum kiuj liaj precizo kaj evitpovo malpliiĝos je 50%%. Nesurprizita frapego ĉiam trafos, sed havos nur norman vundpovon.
items.weapon.melee.battleaxe.ability_desc=Duelistino povas plenumi _frapegon_ per batalhakilo. Tiu intensa atako kaŭzos _%1$d-%2$d vundpoentojn_ kontraŭ surprizita malamiko kaj konfuzos lin por 5 temperoj dum kiuj liaj precizo kaj evitpovo malpliiĝos je 50%%. Nesurprizita frapego ĉiam trafos, sed havos nur norman vundpovon.
items.weapon.melee.battleaxe.desc=Granda stala klingo de tiu ĉi batalhakilo kaŭzas seriozan inerton je ĉiu larĝa svingo.

items.weapon.melee.crossbow.name=pafarko
items.weapon.melee.crossbow.typical_stats_desc=Kutime tiu ĉi armilo – kiam surmetita – igas ĵetsagetojn kaŭzi _%1$d-%2$d vundpoentojn_ kaj eĉ transdonas sian ensorĉon al ili.
items.weapon.melee.crossbow.stats_desc=Tiu ĉi armilo – kiam surmetita – igas ĵetsagetojn kaŭzi _%1$d-%2$d vundpoentojn_ kaj eĉ transdonas sian ensorĉon al ili.
items.weapon.melee.crossbow.ability_name=plipovigita pafo
items.weapon.melee.crossbow.typical_ability_desc=Duelistino povas prepari _plipovigitan pafon_ per pafarko. Ŝia sekva norma atako per ĝi certe trafos kaj aktivigos unu el la tri efikoj: permanaj atakoj forbatos kontraŭulojn, netrempitaj sagetoj kaŭzos probable _+%1$d vundpoentojn_, trempitaj sagetoj kaŭzos frap-efikojn ene la areo 7×7 kaj havos probable _%2$d pliajn uzojn._
items.weapon.melee.crossbow.ability_desc=Duelistino povas prepari _plipovigitan pafon_ per pafarko. Ŝia sekva norma atako per ĝi certe trafos kaj aktivigos unu el la tri efikoj: permanaj atakoj forbatos kontraŭulojn, netrempitaj sagetoj kaŭzos +%1$d vundpoentojn_, trempitaj sagetoj kaŭzos frap-efikojn ene la areo 7×7 kaj havos _%2$d pliajn uzojn._
items.weapon.melee.crossbow.desc=Nesufiĉe komplika armilo pafanta sagojn kun deca rapido. Kvankam ĝi ne estas projektita por servi kiel permana armilo, pro ĝia solida strukturo ĝi taŭgos por batali permane.
items.weapon.melee.crossbow.upgrade_ability_stat_name=Plifortigo de special-atako
items.weapon.melee.crossbow$chargedshot.name=plipovigita pafo
items.weapon.melee.crossbow$chargedshot.desc=Duelistino koncentriĝas sur sia pafarko. Ŝia sekva atako certe trafos kaj aktivigos unu el la tri efikoj:\n– permanaj atakoj forbatos kontraŭulojn je kelkaj kaheloj;\n– netrempitaj sagetoj kaŭzos ekstran vundon;\n– trempitaj sagetoj havos kelkajn pliajn uzojn kaj kaŭzos siajn frap-efikojn ene la areo 7×7.\nUtilaj efikoj aplikiĝos nur al amikojn kaj minacaj efikoj aplikiĝos nur al malamikoj. Duelistino ne povas uzi tiun kapablon por apliki utilajn sagetajn efikojn al si mem.

items.weapon.melee.cudgel.name=madzo
items.weapon.melee.cudgel.stats_desc=Ĝi estas ja preciza armilo.
items.weapon.melee.cudgel.ability_name=frapegi
items.weapon.melee.cudgel.typical_ability_desc=Duelistino povas plenumi _frapegon_ per madzo. Tiu intensa atako probable kaŭzos _%1$d-%2$d vundpoentojn_ kontraŭ surprizita malamiko kaj konfuzos lin por 5 temperoj dum kiuj liaj precizo kaj evitpovo malpliiĝos je 50%%. Nesurprizita frapego ĉiam trafos, sed havos nur norman vundpovon.
items.weapon.melee.cudgel.ability_desc=Duelistino povas plenumi _frapegon_ per madzo. Tiu intensa atako kaŭzos _%1$d-%2$d vundpoentojn_ kontraŭ surprizita malamiko kaj konfuzos lin por 5 temperoj dum kiuj liaj precizo kaj evitpovo malpliiĝos je 50%%. Nesurprizita frapego ĉiam trafos, sed havos nur norman vundpovon.
items.weapon.melee.cudgel.desc=Malgranda latuna klabo, pli ĝuste destinita por nobluloj por defendi sin ol por aventuristoj.
items.weapon.melee.cudgel.discover_hint=Iu el la herooj komencas kun tiu ĉi aĵo.

items.weapon.melee.dagger.name=ponardo
items.weapon.melee.dagger.stats_desc=Tiu ĉi armilo estas pli efika kontraŭ surprizitaj malamikoj.
items.weapon.melee.dagger.ability_name=ŝteliri
items.weapon.melee.dagger.typical_ability_desc=Duelistino tenanta ponardon povas _ŝteliri_. Tiu ĉi armila kapablo ebligos al ŝi senprokraste ekaperi maksimume 5 kaheloj for kaj probable donos al ŝi _%d temperojn da nevidebleco._
items.weapon.melee.dagger.ability_desc=Duelistino tenanta ponardon povas _ŝteliri_. Tiu ĉi armila kapablo ebligos al ŝi senprokraste ekaperi maksimume 5 kaheloj for kaj donos al ŝi _%d temperojn da nevidebleco._
items.weapon.melee.dagger.upgrade_ability_stat_name=Daŭro de special-atako
items.weapon.melee.dagger.desc=Simpla fera ponardo kun eluzita ligna tenilo.
items.weapon.melee.dagger.discover_hint=Iu el la herooj komencas kun tiu ĉi aĵo.

items.weapon.melee.dirk.name=stileto
items.weapon.melee.dirk.stats_desc=Tiu ĉi armilo estas pli efika kontraŭ surprizitaj malamikoj.
items.weapon.melee.dirk.ability_name=ŝtelirado
items.weapon.melee.dirk.typical_ability_desc=Duelistino tenanta stileton povas _ŝteliri_. Tiu ĉi armila kapablo ebligos al ŝi senprokraste ekaperi maksimume 4 kaheloj for kaj probable donos al ŝi _%d temperojn da nevidebleco._
items.weapon.melee.dirk.ability_desc=Duelistino tenanta stileton povas _ŝteliri_. Tiu ĉi armila kapablo ebligos al ŝi senprokraste ekaperi maksimume 4 kaheloj for kaj donos al ŝi _%d temperojn da nevidebleco._
items.weapon.melee.dirk.upgrade_ability_stat_name=Daŭro de special-atako
items.weapon.melee.dirk.desc=Longeta puŝ-ponardo, peco da stalo por piki malamikojn.

items.weapon.melee.flail.name=draŝilo batala
items.weapon.melee.flail.stats_desc=Ĝi estas ja malakurata armilo.\nPer tiu ĉi armilo surpriza atako ne eblas.
items.weapon.melee.flail.ability_name=turni
items.weapon.melee.flail.spin_warn=La draŝilo ne povas turniĝi pli rapide.
items.weapon.melee.flail.typical_ability_desc=Duelistino povas _turni_ draŝilon batalan por plifortigi la sekvan frapon. Ĉiu turno (maksimume 3) de la draŝilo probable aldonos _+%d vundpoentojn_ al la sekva frapo. Turniĝanta draŝilo certe trafos la kontraŭulon. Nur la unua turno konsumos ŝargon de armila kapablo.
items.weapon.melee.flail.ability_desc=Duelistino povas _turni_ draŝilon batalan por plifortigi la sekvan frapon. Ĉiu turno (maksimume 3) de la draŝilo aldonos _+%d vundpoentojn_ al la sekva frapo. Turniĝanta draŝilo certe trafos la kontraŭulon. Nur la unua turno konsumos ŝargon de armila kapablo.
items.weapon.melee.flail.desc=Dorna globo fiksita por plilongigi al la ĉeno. Tre maloportuna, tamen ruinigema je forta frapo.
items.weapon.melee.flail$spinabilitytracker.name=turniĝo
items.weapon.melee.flail$spinabilitytracker.desc=Duelistino turnas sian draŝilon batalan, pliigante vundpovon de la sekva norma atako. Ĉiu turno daŭras unu temperon, pliigas vundpovon, maksimume al tri turnoj. Turniĝanta draŝilo batala ĉiam trafos la kontraŭulon.\n\nNunaj turniĝoj: %1$d%%.\nPliaj temperoj: %2$s.

items.weapon.melee.gauntlet.name=ŝton-ganto
items.weapon.melee.gauntlet.stats_desc=Ĝi estas tre rapida armilo.
items.weapon.melee.gauntlet.ability_name=kombina atako
items.weapon.melee.gauntlet.typical_ability_desc=Duelistino povas plenumi _kombinan atakon_ per ŝton-ganto. Tiu atako certe trafos kaj probable kaŭzos po _+%d vundpoentoj_ por ĉiu sukcesa frapo per permana aŭ ĵetarmilo. Neniu frapo dum 5 temperoj nuligas la fraparon.
items.weapon.melee.gauntlet.ability_desc=Duelistino povas plenumi _kombinan atakon_ per ŝton-ganto. Tiu atako certe trafos kaj kaŭzos po _+%d vundpoentoj_ por ĉiu sukcesa frapo per permana aŭ ĵetarmilo. Neniu frapo dum 5 temperoj nuligas la fraparon.
items.weapon.melee.gauntlet.desc=Tiu ĉi masiva ganto estas farita el karminruĝa teksaĵo kovrita supre per peza magia ŝtono. La teksaĵo kunpremas ĉirkaŭ vi, igante tiujn ĉi dikajn ŝtonajn platetojn kvazaŭ via dua haŭto. Manipuli tiel pezan armilon postulas forton, sed igas viajn frapojn tre potencaj.

items.weapon.melee.glaive.name=halebardo
items.weapon.melee.glaive.stats_desc=Ĝi estas ja malrapida armilo.\nTiu ĉi armilo havas egan atingon.
items.weapon.melee.glaive.ability_name=pikpuŝi
items.weapon.melee.glaive.typical_ability_desc=Duelistino povas uzi finaĵon de sia halebardo por _pikpuŝi_ malamikon en la atakatingo, sed ne apudan. Tiu atako probable kaŭzos _%1$d-%2$d vundpoentojn_, forpuŝos la malamikon kaj certe lin trafos.
items.weapon.melee.glaive.ability_desc=Duelistino povas uzi finaĵon de sia halebardo por _pikpuŝi_ malamikon en la atakatingo, sed ne apudan. Tiu atako kaŭzos _%1$d-%2$d vundpoentojn_, forpuŝos la malamikon kaj certe lin trafos.
items.weapon.melee.glaive.desc=Masiva batalilo konsistanta el glava klingo sur la fino de stango.

items.weapon.melee.gloves.name=pikilecaj gantoj
items.weapon.melee.gloves.stats_desc=Ĝi estas tre rapida armilo.
items.weapon.melee.gloves.ability_name=kombina atako
items.weapon.melee.gloves.typical_ability_desc=Duelistino povas plenumi _kombinan atakon_ per pikilecaj gantoj. Tiu atako certe trafos kaj probable kaŭzos po _+%d vundpoentoj_ por ĉiu sukcesa frapo per permana aŭ ĵetarmilo. Neniu frapo dum 5 temperoj nuligas la fraparon.
items.weapon.melee.gloves.ability_desc=Duelistino povas plenumi _kombinan atakon_ per pikilecaj gantoj. Tiu atako certe trafos kaj kaŭzos po _+%d vundpoentoj_ por ĉiu sukcesa frapo per permana aŭ ĵetarmilo. Neniu frapo dum 5 temperoj nuligas la fraparon.
items.weapon.melee.gloves.desc=Tiuj gantoj kun platkapaj najloj ne liveras veran protekton, sed funkcias kiel deca armilo samtempe ne okupante viajn manojn.
items.weapon.melee.gloves.discover_hint=Iu el la herooj komencas kun tiu ĉi aĵo.

items.weapon.melee.greataxe.name=hakilego
items.weapon.melee.greataxe.stats_desc=Tiu ĉi armilo estas pezega.
items.weapon.melee.greataxe.ability_name=revenĝi
items.weapon.melee.greataxe.typical_ability_desc=Duelistino povas plenumi _revenĝan_ atakon per hakilego, se ŝi havas malpli ol 50%% de sano. Tiu detruanta atako probable kaŭzos _%1$d-%2$d vundpoentojn_, certe trafos, kaj daŭros neniun temperon, se ĝi mortigos la kontraŭulon.
items.weapon.melee.greataxe.ability_desc=Duelistino povas plenumi _revenĝan_ atakon per hakilego, se ŝi havas malpli ol 50%% de sano. Tiu detruanta atako kaŭzos _%1$d-%2$d vundpoentojn_, certe trafos, kaj daŭros neniun temperon se ĝi mortigos la kontraŭulon.
items.weapon.melee.greataxe.desc=Destinita por svingi super ŝultro, tiu ĉi titana hakilo estas tiel potenca kiel peza.

items.weapon.melee.greatshield.name=ŝildego
items.weapon.melee.greatshield.typical_stats_desc=Tiu ĉi armilo kutime blokas 0-%d vundpoentojn, tiu bloko pliiĝas proporcie al plibonigoj.
items.weapon.melee.greatshield.stats_desc=Tiu ĉi armilo blokas 0-%d vundpoentojn, tiu bloko pliiĝas proporcie al plibonigoj.
items.weapon.melee.greatshield.ability_name=ŝirmiĝi
items.weapon.melee.greatshield.typical_ability_desc=Duelistino povas _ŝirmiĝi_ per ŝildego, plene blokante ĉiujn korpajn kaj magiajn atakojn kontraŭ ŝi probable dum la sekvaj _%d temperoj_. Kiam Duelistino atakos malamikon aŭ uzos magion, ŝirmado finiĝos.
items.weapon.melee.greatshield.ability_desc=Duelistino povas _ŝirmiĝi_ per ŝildego, plene blokante ĉiujn korpajn kaj magiajn atakojn kontraŭ ŝi dum la sekvaj _%d temperoj_. Kiam Duelistino atakos malamikon aŭ uzos magion, ŝirmado finiĝos.
items.weapon.melee.greatshield.upgrade_ability_stat_name=Daŭro de special-atako
items.weapon.melee.greatshield.desc=Pli simila al portebla muro ol ŝildo, tiu ĉi masiva pecego da metalo ebligas defendon, sed ne lasas multe da spaco por ataki.

items.weapon.melee.greatsword.name=glavego
items.weapon.melee.greatsword.ability_name=frakasi
items.weapon.melee.greatsword.typical_ability_desc=Duelistino povas _frakasi_ kontraŭulon per glavego. Tiu atako probable kaŭzos _%1$d-%2$d vundpoentojn_ kaj certe trafos. Se frakaso mortigos kontraŭulon, tiu atako daŭros neniun temperon kaj Duelistino povos plenumi frakason denove dum 5 temperoj sen uzi ŝargon.
items.weapon.melee.greatsword.ability_desc=Duelistino povas _frakasi_ kontraŭulon per glavego. Tiu atako kaŭzos _%1$d-%2$d vundpoentojn_ kaj certe trafos. Se frakaso mortigos kontraŭulon, tiu atako daŭros neniun temperon kaj Duelistino povos plenumi frakason denove dum 5 temperoj sen uzi ŝargon.
items.weapon.melee.greatsword.desc=Tiu ĉi masiva klingo kaŭzas seriozegan detruon je ĉiu fortplena svingo.

items.weapon.melee.handaxe.name=hakileto
items.weapon.melee.handaxe.stats_desc=Ĝi estas ja preciza armilo.
items.weapon.melee.handaxe.ability_name=frapegi
items.weapon.melee.handaxe.typical_ability_desc=Duelistino povas plenumi _frapegon_ per hakileto. Tiu intensa atako probable kaŭzos _%1$d-%2$d vundpoentojn_ kontraŭ surprizita malamiko kaj konfuzos lin por 5 temperoj dum kiuj liaj precizo kaj evitpovo malpliiĝos je 50%%. Nesurprizita frapego ĉiam trafos, sed havos nur norman vundpovon.
items.weapon.melee.handaxe.ability_desc=Duelistino povas plenumi _frapegon_ per hakileto. Tiu intensa atako kaŭzos _%1$d-%2$d vundpoentojn_ kontraŭ surprizita malamiko kaj konfuzos lin por 5 temperoj dum kiuj liaj precizo kaj evitpovo malpliiĝos je 50%%. Nesurprizita frapego ĉiam trafos, sed havos nur norman vundpovon.
items.weapon.melee.handaxe.desc=Malpeza hakilo, kutime uzata por faligi arbojn. Ĝia larĝa klingo ankaŭ bone taŭgas kontraŭ malamikoj.

items.weapon.melee.katana.name=katana’
items.weapon.melee.katana.stats_desc=Tiu armilo blokas 0-3 vundpoentojn.
items.weapon.melee.katana.ability_name=salti k tranĉi
items.weapon.melee.katana.typical_ability_desc=Uzante katana-glavon Duelistino povas _salti kaj tranĉi_ kontraŭulon, kiu estas 1 kahelo for. Dum la atako ŝi alsaltos la kontraŭulon, probable kaŭzos _%1$d-%2$d vundpoentojn_ kaj certe trafos.
