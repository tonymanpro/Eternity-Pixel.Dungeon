items.emblem.epicemblem.name=Epic Emblem
items.emblem.epicemblem.desc=A simple gem, usually giving your equipment a guaranteed _Epic_ rarity.
items.emblem.trihitemblem.name=Trihit Emblem
items.emblem.trihitemblem.desc=A simple gem, usually enchanting your weapon with _Trihit_ enchantment.
items.emblem.laserisedemblem.name=Laserised Emblem
items.emblem.laserisedemblem.desc=A simple gem, usually enchanting your weapon with _Laserised_ enchantment.
items.emblem.summoneremblem.name=Summoner Emblem
