items.artifacts.etherealchains.desc=Estas cadenas grandes pero livianas brillan con energía espiritual. Se pueden usar para arrastrarte hacia el terreno o para atraer enemigos hacia ti. ¡La naturaleza etérea de las cadenas incluso les permite extenderse a través de las paredes!
items.artifacts.etherealchains.desc_cursed=Las cadenas malditas están sujetas a tu lado, columpiándose constantemente, tratando de hacerte tropezar o atarte.
items.artifacts.etherealchains.desc_equipped=Las cadenas descansan a tu alrededor, desviando lentamente la energía espiritual de aquellos a quienes derrotas. Cada carga es un eslabón en la cadena, que se extenderá exactamente una casilla.
items.artifacts.etherealchains$chainsrecharge.levelup=¡Tus cadenas se fortalecen!

