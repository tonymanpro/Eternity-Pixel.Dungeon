items.weapon.melee.runicblade.no_equip=You need to equip your blade to use its magic.
items.weapon.melee.darkblade.ability_name=dark runic slash
items.weapon.melee.darkblade.typical_ability_desc=The Duelist can perform a _dark runic slash_ with a dark blade. This attack is guaranteed to hit, typically has _+%d%% enchantment power, and has a chance to corrupt enemies._
items.weapon.melee.darkblade.ability_desc=The Duelist can perform a _dark runic slash_ with a dark blade. This attack is guaranteed to hit, has _+%d%% enchantment power, and has a chance to corrupt enemies._
