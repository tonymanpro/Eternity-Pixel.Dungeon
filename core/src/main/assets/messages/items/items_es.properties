###armor curses
items.armor.curses.antientropy.name=%s de anti-entropía
items.armor.curses.antientropy.desc=La maldición de anti-entropía va en contra de las fuerzas del universo, extrayendo energía de su alrededor hacia el portador. Esto enciende brevemente en llamas al portador, ¡pero congela todo a su alrededor!

items.armor.curses.bulk.name=%s de grandeza
items.armor.curses.bulk.desc=La armadura de grandeza se ve más grande e imponente, pero en realidad no mejora la defensa. Peor aún, el tamaño añadido hace que el movimiento a través de las puertas sea muy difícil.

items.armor.curses.corrosion.name=%s de corrosión
items.armor.curses.corrosion.desc=La armadura de corrosión es capaz de estallar con líquido corrosivo, cubriendo todo en la zona con cieno ácido y pegajoso.

items.armor.curses.displacement.name=%s de desplazamiento
items.armor.curses.displacement.desc=La maldición de desplazamiento intenta mover al portador a un lugar seguro cuando es atacado. Sin embargo, es casi demasiado efectiva, al teletransportar al usuario de forma aleatoria alrededor del nivel.

items.armor.curses.metabolism.name=%s de metabolismo
items.armor.curses.metabolism.desc=Esta maldición convierte la saciedad directamente en salud cuando el portador está herido, proporcionando un impulso de curación, pero causando inanición rápidamente.

items.armor.curses.multiplicity.name=%s de multiplicidad
items.armor.curses.multiplicity.desc=Una armadura maldita con multiplicidad contiene magia de duplicación peligrosa. Algunas veces creará una réplica del usuario, ¡pero es igualmente probable que duplique al atacante!

items.armor.curses.overgrowth.name=%s de sobrecrecimiento
items.armor.curses.overgrowth.desc=La armadura de sobrecrecimiento está cubierta por varias plantas florecientes. Aunque este efecto luce ciertamente interesante, no ayuda a la defensa, ¡y estas plantas se activarán aleatoriamente durante el combate!

items.armor.curses.stench.name=%s de hedor
items.armor.curses.stench.desc=Una armadura maldita con hedor lanzará nubes de gas nocivo, siendo un peligro para todo lo que entre en la nube.


###glyphs
items.armor.glyphs.affection.name=%s de afecto
items.armor.glyphs.affection.desc=Este poderoso glifo manipula la mente de los atacantes, encantándolos temporalmente.

items.armor.glyphs.antimagic.name=%s de anti-magia
items.armor.glyphs.antimagic.desc=Este poderoso glifo permite a la armadura defender a su portador contra los ataques mágicos así como los físicos. Esta defensa mágica no es afectada por el nivel de la armadura.

items.armor.glyphs.brimstone.name=%s de azufre
items.armor.glyphs.brimstone.desc=Este glifo protege al portador y sus pertenencias del fuego, anulando completamente el daño y efectos negativos.

items.armor.glyphs.camouflage.name=%s de camuflaje
items.armor.glyphs.camouflage.desc=Este glifo permite al portador mezclarse en la hierba alta, otorgándole invisibilidad temporal.

items.armor.glyphs.entanglement.name=%s de enraizamiento
items.armor.glyphs.entanglement.desc=Este glifo hace crecer una armadura terránea alrededor del portador para absorber daño, pero esta armadura se romperá si el portador se mueve.

items.armor.glyphs.flow.name=%s de flujo
items.armor.glyphs.flow.desc=Este glifo manipula el flujo del agua alrededor del portador, haciéndolo mucho más rápido cuando se mueve a través de esta.

items.armor.glyphs.obfuscation.name=%s de ofuscación
items.armor.glyphs.obfuscation.desc=Este glifo oscurece al portador, haciéndolo más difícil de detectar.

items.armor.glyphs.potential.name=%s de potencial
items.armor.glyphs.potential.rankings_desc=Muerto por: glifo de potencial
items.armor.glyphs.potential.desc=Este glifo acumula energía cuando es golpeado, otorgando carga a la varita del portador cuando se activa.

items.armor.glyphs.repulsion.name=%s de repulsión
items.armor.glyphs.repulsion.desc=Este glifo repele la fuerza contra los atacantes, enviándolos volando hacia atrás.

items.armor.glyphs.stone.name=%s de piedra
items.armor.glyphs.stone.desc=Este glifo envuelve la armadura con una pesada piedra mágica que hace imposible esquivar, pero bloquea el daño en proporción con la evasión.

items.armor.glyphs.swiftness.name=%s de ligereza
items.armor.glyphs.swiftness.desc=Este glifo mejora la velocidad del portador, siempre que no esté cerca de un enemigo.

items.armor.glyphs.thorns.name=%s de espinas
items.armor.glyphs.thorns.desc=Este poderoso glifo daña a sus atacantes, causando que se desangren lentamente cuando atacan al portador.

items.armor.glyphs.viscosity.name=%s de viscosidad
items.armor.glyphs.viscosity.deferred=%d diferido
items.armor.glyphs.viscosity$defereddamage.name=daño diferido
items.armor.glyphs.viscosity$defereddamage.ondeath=El daño diferido te ha matado...
items.armor.glyphs.viscosity$defereddamage.rankings_desc=Muerto por daño diferido
items.armor.glyphs.viscosity$defereddamage.desc=El daño está siendo infligido lentamente en lugar de inmediatamente.\n\nDaño diferido restante: %d.
items.armor.glyphs.viscosity.desc=Este glifo es capaz de retener el daño infligido al portador, sufriéndolo poco a poco en lugar de todo a la vez.



###armor
items.armor.armor.ac_detach=QUITAR SELLO
items.armor.armor.detach_seal=Has quitado el sello de tu armadura.
items.armor.armor.equip_cursed=La armadura se ciñe dolorosamente a tu alrededor.
items.armor.armor.identify=Te has familiarizado lo suficiente con tu armadura para identificarla.
items.armor.armor.hardening_gone=¡El fortalecimiento en esta armadura se ha desvanecido!
items.armor.armor.incompatible=¡La interacción de diferentes tipos de magia ha borrado el glifo de esta armadura!
items.armor.armor.curr_absorb=Esta armadura de _tier-%1$d_ bloquea _%2$d-%3$d de daño_ y requiere _%4$d de fuerza_ para ser utilizada correctamente.
items.armor.armor.avg_absorb=Típicamente esta armadura de _tier-%1$d_ bloquea _%2$d-%3$d de daño_ y requiere _%4$d de fuerza_ para ser utilizada correctamente.
items.armor.armor.too_heavy=Debido a tu fuerza inadecuada, utilizar esta armadura disminuirá tu habilidad para moverte, evadir, y defenderte.
items.armor.armor.probably_too_heavy=Probablemente esta armadura es muy pesada para ti.
items.armor.armor.excess_str=Debido a tu exceso de fuerza, eres _más evasivo_ mientras llevas esta armadura.
items.armor.armor.evasion=Se ha aumentado para mejorar la _evasión._
items.armor.armor.defense=Se ha aumentado para mejorar la _defensa._
items.armor.armor.inscribed=esta inscrita con _%s._
items.armor.armor.glyph_hardened=Ha sido _fortalecida._
items.armor.armor.hardened_no_glyph=Esta armadura ha sido _fortalecida,_ pero de momento no está inscrita con un glifo.
items.armor.armor.cursed_worn=Debido a la maldición de esta armadura, eres incapaz de quitártela.
items.armor.armor.cursed=Puedes sentir una magia maligna acechando dentro de esta armadura.
items.armor.armor.weak_cursed=A pesar de la maldición, eres capaz de quitarte esta armadura.
items.armor.armor.not_cursed=Esta armadura está libre de energía maligna.
items.armor.armor.seal_attached=El sello roto del Guerrero está fijado a esta armadura, otorgándole hasta _%d de blindaje_.
items.armor.armor$glyph.glyph=un glifo
items.armor.armor$glyph.killed=%s te ha matado.

items.armor.classarmor.ac_ability=ESCOGER HABILIDAD
items.armor.classarmor.ac_transfer=TRANSFERIR
items.armor.classarmor.no_ability=¡Tu armadura aún no tiene habilidad, deberías escoger una!
items.armor.classarmor.not_equipped=¡Necesitas ponerte esta armadura para usar su poder especial!
items.armor.classarmor.low_charge=¡La armadura no está lo suficientemente cargada como para usar su poder especial!
items.armor.classarmor.charge_use=Usar la habilidad ahora consumirá _%s_ de carga.
items.armor.classarmor.transfer_title=Transferir Armadura
items.armor.classarmor.transfer_desc=La magia de la corona del rey enano puede ser transferida a otra armadura. Ten en cuenta que la armadura original será destruida en el proceso.
items.armor.classarmor.transfer_prompt=Selecciona un armadura
items.armor.classarmor.transfer_cancel=Cancelar
items.armor.classarmor.transfer_complete=¡Las propiedades de tu armadura heroica han sido transferidas!

items.armor.clotharmor.name=armadura de tela
items.armor.clotharmor.desc=Esta armadura liviana ofrece protección básica.

items.armor.duelistarmor.name=peto de duelista
items.armor.duelistarmor.desc=Mientras lleve esta armadura laminada y capa, la Duelista puede realizar una habilidad especial.

items.armor.huntressarmor.name=velo de cazadora
items.armor.huntressarmor.no_enemies=No hay enemigos a la vista
items.armor.huntressarmor.desc=Mientras lleve el velo, la Cazadora puede realizar una habilidad especial.

items.armor.leatherarmor.name=armadura de cuero
items.armor.leatherarmor.desc=Armadura hecha de piel curtida de monstruo. No es tan liviana como una armadura de tela, pero proporciona una mejor protección.

items.armor.magearmor.name=túnica de mago
items.armor.magearmor.desc=Mientras lleve esta espléndida túnica, el Mago puede realizar una habilidad especial.

items.armor.mailarmor.name=armadura de malla
items.armor.mailarmor.desc=Eslabones de metal entrelazados conforman una fuerte pero flexible armadura.

items.armor.platearmor.name=armadura laminada
items.armor.platearmor.desc=Enormes láminas de metal se unen formando un traje que brinda una protección incomparable a cualquier aventurero lo suficientemente fuerte como para soportar su asombroso peso.

items.armor.roguearmor.name=atuendo de pícaro
items.armor.roguearmor.desc=Mientras lleve este oscuro atuendo, el Pícaro puede realizar una habilidad especial.

items.armor.scalearmor.name=armadura de escamas
items.armor.scalearmor.desc=Las escamas metálicas cosidas en un chaleco de cuero crean una flexible, pero protectora armadura.

items.armor.warriorarmor.name=armadura de guerrero
items.armor.warriorarmor.desc=Mientras lleve esta pesada armadura laminada, el Guerrero puede realizar una habilidad especial.



###artifacts
items.artifacts.alchemiststoolkit.name=kit de alquimista
items.artifacts.alchemiststoolkit.ac_brew=FERMENTAR
items.artifacts.alchemiststoolkit.ac_energize=ENERGIZAR
items.artifacts.alchemiststoolkit.not_ready=Tu kit de herramientas no ha terminado de calentarse.
items.artifacts.alchemiststoolkit.cursed=¡Tu kit de herramientas maldito te impide usar la alquimia!
items.artifacts.alchemiststoolkit.need_energy=Necesitas al menos 6 de energía para eso.
items.artifacts.alchemiststoolkit.energize_desc=Cada 6 cristales de energía le darán al kit de herramientas suficiente energía para ganar un nivel, lo que aumenta la velocidad con la que este genera energía y la rapidez con la que se calienta.\n\n¿Cuánta energía deseas utilizar?
items.artifacts.alchemiststoolkit.energize_1=6 de energía: +1 nivel
items.artifacts.alchemiststoolkit.energize_all=%1$d de energía: +%2$d niveles
items.artifacts.alchemiststoolkit.desc=Este kit de herramientas contiene una serie de reactivos y hierbas junto a un pequeño frasco de mezcla, lo que permite utilizar la alquimia sobre la marcha. El frasco contiene lo que parece ser cristales de energía en forma liquida.
items.artifacts.alchemiststoolkit.desc_cursed=El kit de herramientas maldito se ha unido a tu lado y se niega a permitirte usar la alquimia.
items.artifacts.alchemiststoolkit.desc_warming=El kit de herramientas se está calentando actualmente y estará listo para usar después de un rato.
items.artifacts.alchemiststoolkit.desc_hint=El kit de herramientas equipado genera lentamente energía alquímica a medida que adquieres experiencia. Parece que la mezcla dentro del frasco podría mejorarse añadiéndole cristales de energía.

items.artifacts.artifact.cannot_wear_two=No puedes llevar dos artefactos del mismo tipo.
items.artifacts.artifact.equip_cursed=El artefacto se une dolorosamente a ti.
items.artifacts.artifact.curse_known= Puedes sentir una magia maligna acechando dentro del artefacto.
items.artifacts.artifact.not_cursed=Este artefacto está libre de energía maligna.
items.artifacts.artifact.need_to_equip=Necesitas equipar tu artefacto para hacer eso.

items.artifacts.capeofthorns.name=capa de espinas
items.artifacts.capeofthorns.desc=Estas láminas colapsadas de metal del DM-300 han formado una capa rígida. Parece que almacena una energía profunda, ¿quizás tiene algo del poder del DM-300?
items.artifacts.capeofthorns.desc_inactive=La capa se siente tranquilizadoramente pesada en tus hombros, parece estar ganando energía del daño que recibes.
items.artifacts.capeofthorns.desc_active=La capa parece estar liberando energía almacenada, está irradiando un poder protector.
items.artifacts.capeofthorns$thorns.inert=Tu Capa se vuelve inerte de nuevo.
items.artifacts.capeofthorns$thorns.radiating=Tu Capa empieza a irradiar energía, ¡te sientes protegido!
items.artifacts.capeofthorns$thorns.levelup=¡Tu Capa se vuelve más fuerte!
items.artifacts.capeofthorns$thorns.name=espinas
items.artifacts.capeofthorns$thorns.desc=¡Tu capa irradia energía y te rodea en un campo de fuerza deflector!\n\nTodo el daño que recibas se reduce mientras el efecto de espinas esté activo. Además, si el atacante está a tu lado, la cantidad reducida se desvía hacia el atacante.\n\nTurnos de espinas restantes: %s.

items.artifacts.chaliceofblood.name=cáliz de sangre
items.artifacts.chaliceofblood.ac_prick=PINCHAZO
items.artifacts.chaliceofblood.yes=Si, sé lo que hago
items.artifacts.chaliceofblood.no=No, he cambiado de idea
items.artifacts.chaliceofblood.prick_warn=Cada vez que uses el cáliz drenará más energía vital, si no eres cuidadoso podría matarte fácilmente.\n\n¿Estás seguro que quieres ofrecerle más energía vital?
items.artifacts.chaliceofblood.onprick=Te pinchas a ti mismo, y tu esencia vital se drena hacia el interior del cáliz.
items.artifacts.chaliceofblood.ondeath=El cáliz succiona tu esencia vital...
items.artifacts.chaliceofblood.desc=Este cáliz brillante de plata está extrañamente adornado con gemas afiladas en el borde.
items.artifacts.chaliceofblood.desc_cursed=El cáliz maldito se ha unido a tu mano y está inhibiendo tu habilidad para regenerar salud.
items.artifacts.chaliceofblood.desc_1=Mientras sostienes el cáliz, te sientes extrañamente obligado a pincharte con las gemas afiladas.
items.artifacts.chaliceofblood.desc_2=Algo de tu sangre cae en el cáliz, puedes sentir sutilmente al cáliz otorgándote energía vital. Todavía quieres cortarte con el cáliz, incluso cuando sabes que te lastimará.
items.artifacts.chaliceofblood.desc_3=El cáliz está lleno hasta el borde de tu esencia vital. Puedes sentir el cáliz vertiendo energía vital de nuevo en ti.

items.artifacts.cloakofshadows.name=manto de sombras
items.artifacts.cloakofshadows.ac_stealth=SIGILO
items.artifacts.cloakofshadows.cooldown=Tu manto necesita %d turnos más para recargarse.
items.artifacts.cloakofshadows.cursed=No puedes usar un manto maldito.
items.artifacts.cloakofshadows.no_charge=Tu manto aún no se ha recargado lo suficiente como para ser utilizado.
items.artifacts.cloakofshadows.desc=Un manto mágico invaluable, robado de la armería real hace muchos años por el Pícaro. Cuando es equipado, puede usarse para volverse completamente invisible por un corto tiempo.\n\nCuanto más se use el manto, más fuerte se volverá, permitiendo al Pícaro volverse invisible más frecuentemente y por más tiempo.
items.artifacts.cloakofshadows$cloakstealth.no_charge=Tu manto se quedó sin energía.
items.artifacts.cloakofshadows$cloakstealth.levelup=¡Tu manto se fortalece!
items.artifacts.cloakofshadows$cloakstealth.name=camuflado
items.artifacts.cloakofshadows$cloakstealth.desc=Tu manto de sombras te otorga invisibilidad mientras estés envuelto por él. Permanecerás camuflado hasta que se cancele o tu manto se quede sin cargas.\n\nMientras eres invisible, los enemigos no pueden atacarte o seguirte. Los ataques físicos y los efectos mágicos (como pergaminos y varitas) cancelarán inmediatamente la invisibilidad.\n\nTurnos hasta uso de carga: %d.

items.artifacts.driedrose.name=rosa marchita
items.artifacts.driedrose.ac_summon=INVOCAR
items.artifacts.driedrose.ac_direct=DIRIGIR
items.artifacts.driedrose.ac_outfit=ATUENDO
items.artifacts.driedrose.spawned=Ya has invocado al fantasma.
items.artifacts.driedrose.no_charge=Tu rosa no está totalmente cargada todavía.
items.artifacts.driedrose.cursed=No puedes utilizar una rosa maldita.
items.artifacts.driedrose.no_space=No hay espacio libre cerca de ti.
items.artifacts.driedrose.charged=¡Tu rosa está totalmente cargada!
items.artifacts.driedrose.desc=¿Es esta la rosa que mencionó el fantasma antes de desaparecer? Parece guardar algo de poder espiritual, tal vez pueda ser usada para canalizar la energía de ese guerrero perdido.
items.artifacts.driedrose.desc_no_quest=Una rosa envejecida y seca que de alguna manera todavía se mantiene unida a pesar de su edad.\n\nParece tener algo de poder espiritual, pero no tienes idea de cómo usarlo ahora mismo.
items.artifacts.driedrose.desc_hint=Parece haber perdido algunos pétalos. Quizás volver a colocarlos fortalecerá la rosa.
items.artifacts.driedrose.desc_cursed=La rosa maldita está ligada a tu mano, se siente inquietantemente fría.
items.artifacts.driedrose.desc_weapon=Arma del fantasma: %s
items.artifacts.driedrose.desc_armor=Armadura del fantasma: %s
items.artifacts.driedrose.desc_strength=Fuerza del fantasma: %s
items.artifacts.driedrose$petal.name=pétalo marchito
items.artifacts.driedrose$petal.no_rose=Necesitas una rosa para añadir el pétalo.
items.artifacts.driedrose$petal.no_room=No hay espacio para este pétalo, así que lo desechas.
items.artifacts.driedrose$petal.maxlevel=¡La rosa está completa!
items.artifacts.driedrose$petal.levelup=Añades el pétalo a la rosa.
items.artifacts.driedrose$petal.desc=Un frágil pétalo seco, que de alguna manera ha sobrevivido hasta el fondo de la mazmorra.
items.artifacts.driedrose$wndghosthero.title=Equipamiento del Fantasma
items.artifacts.driedrose$wndghosthero.desc=El fantasma es débil por sí mismo, pero su forma es lo suficientemente sólida como para estar equipado con un arma y una armadura. Podrá usar estos elementos como tú lo haces.\n\nEl fantasma puede equipar actualmente ítems que requieran hasta _%d fuerza._
items.artifacts.driedrose$wndghosthero.weapon_prompt=Selecciona un arma
items.artifacts.driedrose$wndghosthero.armor_prompt=Selecciona una armadura
items.artifacts.driedrose$wndghosthero.cant_unique=El fantasma no puede usar ítems únicos
items.artifacts.driedrose$wndghosthero.cant_unidentified=No sabes lo suficiente sobre ese ítem.
items.artifacts.driedrose$wndghosthero.cant_cursed=No puedes dar el equipamiento maldito al fantasma.
items.artifacts.driedrose$wndghosthero.cant_strength=El fantasma no es lo suficientemente fuerte para usar eso.

##ghost hero
items.artifacts.driedrose$ghosthero.name=fantasma triste
items.artifacts.driedrose$ghosthero.def_verb=evadido

items.artifacts.driedrose$ghosthero.hello=Hola de nuevo %s.
items.artifacts.driedrose$ghosthero.introduce=Mi espíritu está ligado a esta rosa, fue muy valiosa para mí, un regalo de mi amor que dejé en la superficie.\n\nNo puedo volver a él, pero gracias a ti tengo una segunda oportunidad de completar mi viaje. Cuando pueda, responderé a tu llamada y lucharé contigo.\n\nMientras tengas la rosa podré escuchar tu voz, de esta manera podrás guiarme desde lejos.\n\nEspero tú tengas éxito donde yo fallé...

items.artifacts.driedrose$ghosthero.dialogue_sewers_1=Estas alcantarillas solían ser seguras, incluso las personas vivían aquí en el invierno.
items.artifacts.driedrose$ghosthero.dialogue_sewers_2=Me pregunto qué pasó con las patrullas de guardia, ¿se dieron por vencidos?
items.artifacts.driedrose$ghosthero.dialogue_sewers_3=Tenía familia en la superficie, espero que estén a salvo.
items.artifacts.driedrose$ghosthero.dialogue_sewers_4=Los guardias no pudieron derrotar a estos monstruos, pero tal vez nosotros podamos.
items.artifacts.driedrose$ghosthero.dialogue_sewers_5=Si incluso las alcantarillas son tan peligrosas, me pregunto qué hay debajo...
items.artifacts.driedrose$ghosthero.dialogue_sewers_6=¿Qué podría haber causado que estas ratas y cangrejos crezcan tan grandes?
items.artifacts.driedrose$ghosthero.dialogue_prison_1=He escuchado historias sobre este lugar, nada bueno.
items.artifacts.driedrose$ghosthero.dialogue_prison_2=Este lugar siempre fue más una mazmorra que una prisión.
items.artifacts.driedrose$ghosthero.dialogue_prison_3=No puedo imaginar lo que sucedió cuando este lugar fue abandonado.
items.artifacts.driedrose$ghosthero.dialogue_prison_4=Parece que tanto los prisioneros como los guardias se han convertido en monstruos.
items.artifacts.driedrose$ghosthero.dialogue_prison_5=¿Qué podría ser responsable de todos estos esqueletos?
items.artifacts.driedrose$ghosthero.dialogue_prison_6=Estas personas no tenían que terminar así...
items.artifacts.driedrose$ghosthero.dialogue_caves_1=Ningún humano o enano ha estado aquí por mucho tiempo.
items.artifacts.driedrose$ghosthero.dialogue_caves_2=¿Qué haría que los enanos abandonaran una mina de oro?
items.artifacts.driedrose$ghosthero.dialogue_caves_3=Es una pena que todo el oro aquí sea inútil en la superficie.
items.artifacts.driedrose$ghosthero.dialogue_caves_4=Las criaturas aquí están retorcidas, al igual que en las alcantarillas.
items.artifacts.driedrose$ghosthero.dialogue_caves_5=Incluso los murciélagos están sedientos de sangre aquí.
items.artifacts.driedrose$ghosthero.dialogue_caves_6=No hay señales de ningún equipo de minería, ¿lo habrán reclamado todo los enanos?
items.artifacts.driedrose$ghosthero.dialogue_city_1=Los enanos eran laboriosos, pero codiciosos.
items.artifacts.driedrose$ghosthero.dialogue_city_2=Así que la Metrópolis Enana realmente ha caído.
items.artifacts.driedrose$ghosthero.dialogue_city_3=Espero que la superficie nunca termine como este lugar.
items.artifacts.driedrose$ghosthero.dialogue_city_4=Se supone que los enanos no se ven tan pálidos.
items.artifacts.driedrose$ghosthero.dialogue_city_5=No sé qué es peor, los enanos, o sus creaciones.
items.artifacts.driedrose$ghosthero.dialogue_city_6=Parece que los enanos son monstruos Imbéciles ahora también.
items.artifacts.driedrose$ghosthero.dialogue_halls_1=¿Qué es este lugar?
items.artifacts.driedrose$ghosthero.dialogue_halls_2=Este lugar es aterrador...
items.artifacts.driedrose$ghosthero.dialogue_halls_3=¿En qué estaban pensando los enanos, jugando con un poder como este?
items.artifacts.driedrose$ghosthero.dialogue_halls_4=Los monstruos aquí son de otro mundo, ¿de dónde vinieron?
items.artifacts.driedrose$ghosthero.dialogue_halls_5=¿Puedes sentirlo? Es como si algo nos estuviera observando.
items.artifacts.driedrose$ghosthero.dialogue_halls_6=¡Gracias a Dios que hay antorchas, aquí está tan oscuro!
items.artifacts.driedrose$ghosthero.dialogue_ascension_1=¿Por que esta pasando esto, pensé que habíamos tenido éxito?
items.artifacts.driedrose$ghosthero.dialogue_ascension_2=¿Cómo es que esa cosa aún es capaz de influenciar este mundo?
items.artifacts.driedrose$ghosthero.dialogue_ascension_3=Espero que sepas lo que estás haciendo con ese amuleto.
items.artifacts.driedrose$ghosthero.dialogue_ascension_4=Supongo que aún no hemos terminado.
items.artifacts.driedrose$ghosthero.dialogue_ascension_5=¡Hemos llegado tan lejos, podemos acabar con esto!
items.artifacts.driedrose$ghosthero.dialogue_ascension_6=¡Solo un poca mas, podemos salir de aquí!

items.artifacts.driedrose$ghosthero.seen_goo_1=¡Cuidado, Gú!
items.artifacts.driedrose$ghosthero.seen_goo_2=Muchos de mis amigos murieron por esta cosa, ¡hora de venganza!
items.artifacts.driedrose$ghosthero.seen_goo_3=¡No se puede permitir que tal abominación viva!
items.artifacts.driedrose$ghosthero.seen_tengu_1=El prisionero que queda es un asesino mortal. Por supuesto...
items.artifacts.driedrose$ghosthero.seen_tengu_2=¡Nos ha atrapado!
items.artifacts.driedrose$ghosthero.seen_tengu_3=He escuchado historias de terror sobre esa máscara...
items.artifacts.driedrose$ghosthero.seen_dm300_1=Solo los enanos construirían una máquina minera que matara a los intrusos.
items.artifacts.driedrose$ghosthero.seen_dm300_2=Esa cosa es enorme...
items.artifacts.driedrose$ghosthero.seen_dm300_3=¿Cómo ha estado esta cosa activa durante tanto tiempo?
items.artifacts.driedrose$ghosthero.seen_king_1=Cuando la gente dice que el poder corrompe, esto es lo que quieren decir.
items.artifacts.driedrose$ghosthero.seen_king_2=Ahora es más un lich que un rey.
items.artifacts.driedrose$ghosthero.seen_king_3=Incluso en la muerte los enanos obedecen a su amo.
items.artifacts.driedrose$ghosthero.seen_yog_1=Oh, esto no se ve bien.
items.artifacts.driedrose$ghosthero.seen_yog_2=¿Así es como se ve un dios?
items.artifacts.driedrose$ghosthero.seen_yog_3=Esto va a doler...

items.artifacts.driedrose$ghosthero.defeated_by_enemy_1=Buena suerte...
items.artifacts.driedrose$ghosthero.defeated_by_enemy_2=Cansado... por ahora...
items.artifacts.driedrose$ghosthero.defeated_by_enemy_3=Volveré...
items.artifacts.driedrose$ghosthero.defeated_by_boss_1=Lo siento... buena suerte...
items.artifacts.driedrose$ghosthero.defeated_by_boss_2=Termínalo... sin mí...
items.artifacts.driedrose$ghosthero.defeated_by_boss_3=No... no puedo...
items.artifacts.driedrose$ghosthero.blessed_ankh_1=¿Cómo sobreviviste a eso?
items.artifacts.driedrose$ghosthero.blessed_ankh_2=Ojalá tuviera uno de esos...
items.artifacts.driedrose$ghosthero.blessed_ankh_3=¡Oh Dios! ¡Aún sigues vivo!
items.artifacts.driedrose$ghosthero.player_killed_1=¡No!...
items.artifacts.driedrose$ghosthero.player_killed_2=No pude ayudarlos...
items.artifacts.driedrose$ghosthero.player_killed_3=Así no...

items.artifacts.driedrose$ghosthero.direct_prompt=¿Qué tengo que hacer?
items.artifacts.driedrose$ghosthero.directed_follow_1=De acuerdo, te seguiré.
items.artifacts.driedrose$ghosthero.directed_follow_2=Me quedaré detrás de ti.
items.artifacts.driedrose$ghosthero.directed_follow_3=Siguiéndote...
items.artifacts.driedrose$ghosthero.directed_follow_4=¡De acuerdo, vamos!
items.artifacts.driedrose$ghosthero.directed_follow_5=Yo te cubro.
items.artifacts.driedrose$ghosthero.directed_attack_1=Bien, atacaré a ese.
items.artifacts.driedrose$ghosthero.directed_attack_2=Yo me encargo de ese.
items.artifacts.driedrose$ghosthero.directed_attack_3=Atacando...
items.artifacts.driedrose$ghosthero.directed_attack_4=¡A por ellos!
items.artifacts.driedrose$ghosthero.directed_attack_5=De ese me encargo yo.
items.artifacts.driedrose$ghosthero.directed_position_1=Está bien, voy a mantener esa posición.
items.artifacts.driedrose$ghosthero.directed_position_2=Iré allí y defenderé.
items.artifacts.driedrose$ghosthero.directed_position_3=Reposicionando...
items.artifacts.driedrose$ghosthero.directed_position_4=¡En camino!
items.artifacts.driedrose$ghosthero.directed_position_5=Me dirigiré hacia allá.

items.artifacts.driedrose$ghosthero.desc=Una figura etérea de aspecto frágil con forma humanoide. Su poder parece estar ligado a la rosa que tienes.\n\nPuede que este fantasma no sea mucho, parece ser tu único amigo verdadero aquí abajo.

