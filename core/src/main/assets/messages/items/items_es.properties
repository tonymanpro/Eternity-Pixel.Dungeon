items.artifacts.lloydsbeacon.levelup=¡Tu baliza se hace más fuerte!
items.artifacts.lloydsbeacon.preventing=¡La fuerte aura mágica de este lugar evita que uses la baliza de lloyd!
items.artifacts.lloydsbeacon.creatures=El aura psíquica de las criaturas cercanas no te permite usar la baliza de lloyd en este momento.
items.artifacts.lloydsbeacon.return=La baliza de lloyd está correctamente fijada en tu ubicación actual, ahora puedes regresar aquí en cualquier momento.
items.artifacts.lloydsbeacon.desc=La baliza de lloyd es un dispositivo mágico complejo que otorga al usuario el control de las magias de teletransportación. La baliza puede usarse para regresar a una ubicación establecida, pero también puede expulsar ráfagas de magia de teletransportación aleatoria, una vez que se haya cargado luego de ser equipada. Esta magia puede dirigirse a un objetivo o al propio usuario.
items.artifacts.lloydsbeacon.desc_set=Esta baliza fue fijada en alguna parte del nivel %d de la mazmorra.

items.artifacts.masterthievesarmband.name=brazalete de maestro ladrón
items.artifacts.masterthievesarmband.ac_steal=ROBAR
items.artifacts.masterthievesarmband.no_charge=Tu brazalete no tiene carga suficiente.
items.artifacts.masterthievesarmband.cursed=No puedes usar un brazalete maldito.
items.artifacts.masterthievesarmband.full=¡Tu brazalete esta completamente cargado!
items.artifacts.masterthievesarmband.prompt=Elige un enemigo
items.artifacts.masterthievesarmband.no_target=Debes seleccionar un enemigo adyacente a ti
items.artifacts.masterthievesarmband.steal_shopkeeper=No puedes robar al tendero directamente.
items.artifacts.masterthievesarmband.no_steal=Ese enemigo no tiene nada para robar.
items.artifacts.masterthievesarmband.stole_item=Has robado un ítem: %s.
items.artifacts.masterthievesarmband.failed_steal=No has conseguido robar nada.
items.artifacts.masterthievesarmband.level_up=¡Tu brazalete se hace más fuerte!
items.artifacts.masterthievesarmband.desc=Este brazalete de terciopelo morado lleva la marca de un ladrón maestro. Esto no te pertenece, pero probablemente tampoco perteneció a su último usuario.
items.artifacts.masterthievesarmband.desc_cursed=El brazalete maldito está sujeto a tu muñeca, y de alguna manera tu bolsa de oro parece estar cada vez más ligera ...
items.artifacts.masterthievesarmband.desc_worn=Sientes que el poder se acumula en el brazalete de tu muñeca a medida que ganas experiencia. Puedes usar este poder para robar en las tiendas, ¡o para asaltar a tus enemigos!\n\nRobar a los enemigos ocurre instantáneamente, los desorienta brevemente y te da la oportunidad de conseguir cualquier botín que tengan. Este poder es más eficaz contra enemigos desprevenidos. Robar al mismo enemigo varias veces no aumenta las posibilidades de conseguir su botín.

items.artifacts.sandalsofnature.name=sandalias de la naturaleza
items.artifacts.sandalsofnature.name_1=zapatos de la naturaleza
items.artifacts.sandalsofnature.name_2=botas de la naturaleza
items.artifacts.sandalsofnature.name_3=grebas de la naturaleza
items.artifacts.sandalsofnature.ac_feed=NUTRIR
items.artifacts.sandalsofnature.ac_root=ENRAIZAR
items.artifacts.sandalsofnature.prompt=Selecciona una semilla
items.artifacts.sandalsofnature.levelup=¡Tu calzado aumenta en tamaño!
items.artifacts.sandalsofnature.absorb_seed=El calzado absorbe la semilla, parece más saludable.
items.artifacts.sandalsofnature.no_effect=Debes nutrir tu calzado con una semilla primero.
items.artifacts.sandalsofnature.low_charge=Tu calzado no tiene suficiente energía para eso.
items.artifacts.sandalsofnature.prompt_target=Seleccione una ubicación
items.artifacts.sandalsofnature.out_of_range=Esa ubicación esta fuera de rango.
items.artifacts.sandalsofnature.desc_1=¡Lo que originalmente parecían sandalias hechas de cordeles son realmente dos plantas! Parecen muy débiles y pálidas, ¿Quizás necesitan ser nutridas?
items.artifacts.sandalsofnature.desc_2=El calzado ha crecido y ahora se asemeja más a dos zapatos a medida. Algo de color regresó a ellos, ¿Quizás todavía pueden crecer más?
items.artifacts.sandalsofnature.desc_3=Las plantas han vuelto a crecer y ahora se parecen a un par de botas sólidas hechas de corteza. Las plantas parecen haber recuperado su fuerza, pero ¿quizás puedan crecer aún más?
items.artifacts.sandalsofnature.desc_4=Las plantas parecen haber alcanzado su máximo tamaño, se parecen a un par de rodilleras blindadas. Las rodilleras son de color marrón oscuro y se asemejan a un árbol muy resistente.
items.artifacts.sandalsofnature.desc_hint=Te sientes más en sintonía con la naturaleza mientras llevas puesto este artefacto.
items.artifacts.sandalsofnature.desc_cursed=Las sandalias malditas están bloqueando cualquier sintonía con la naturaleza.
items.artifacts.sandalsofnature.desc_ability=El calzado brilla con el color de la última semilla que le ofreciste. Estos puedes enraizarse brevemente en el suelo y producir el efecto de esa planta en cualquier lugar en un radio de 3 casillas.\nSemilla: _%s_\nCarga necesaria: _%d%%_
items.artifacts.sandalsofnature.desc_seeds=Has nutrido tu calzado con %d semillas.

items.artifacts.talismanofforesight.name=talismán de previsión
items.artifacts.talismanofforesight.ac_scry=ADIVINAR
items.artifacts.talismanofforesight.low_charge=El talismán requiere al menos un 5% de carga para adivinar.
items.artifacts.talismanofforesight.prompt= Escoge una ubicación para escanear.
items.artifacts.talismanofforesight.levelup=¡Tu Talismán se fortalece!
items.artifacts.talismanofforesight.full_charge=¡Tu Talismán está completamente cargado!
items.artifacts.talismanofforesight.desc=Una piedra lisa con grabados extraños. Sientes que está mirando todo lo que te rodea, vigilando cualquier cosa oculta.
items.artifacts.talismanofforesight.desc_worn=Cuando sostienes el talismán, sientes que tus sentidos se agudizan. El talismán está acumulando carga lentamente a medida que pasa el tiempo y cuando descubres puertas o trampas ocultas.\n\nEl talismán puede gastar su carga para 'adivinar' en el lugar, lo que revela todas las casillas y secretos en el área escaneada, y te otorgará visión de los ítems y enemigos por un corto tiempo.
items.artifacts.talismanofforesight.desc_cursed=El talismán maldito te está mirando fijamente, entorpeciendo tus sentidos.
items.artifacts.talismanofforesight$foresight.name=previsión
items.artifacts.talismanofforesight$foresight.uneasy=Te sientes inquieto.
items.artifacts.talismanofforesight$foresight.desc=Te sientes muy nervioso, como si hubiera un peligro invisible cercano.

items.artifacts.timekeepershourglass.name=reloj de arena del tiempo
items.artifacts.timekeepershourglass.ac_activate=ACTIVAR
items.artifacts.timekeepershourglass.deactivate=Desactivas la congelación del tiempo.
items.artifacts.timekeepershourglass.no_charge=Tu reloj de arena no se ha recargado lo suficiente para poder usarse.
items.artifacts.timekeepershourglass.cursed=No puedes usar un reloj de arena maldito.
items.artifacts.timekeepershourglass.onstasis=El mundo parece cambiar alrededor de ti en un instante.
items.artifacts.timekeepershourglass.onfreeze=Todo a tu alrededor se congela repentinamente.
items.artifacts.timekeepershourglass.stasis=Ponerme en éstasis
items.artifacts.timekeepershourglass.freeze=Congelar el tiempo
items.artifacts.timekeepershourglass.prompt=¿Cómo te gustaría utilizar la magia del reloj?\n\nEstando en estasis, el tiempo avanzará normalmente mientras estás congelado y completamente invulnerable, consume hasta 2 cargas a la vez.\n\nCuando el tiempo está congelado, puedes moverte como si tus acciones no tomaran tiempo alguno. Esto puede ser desactivado en cualquier momento usando el reloj o atacando.
items.artifacts.timekeepershourglass.desc=Este gran reloj de arena adornado parece bastante sencillo, pero sientes un gran poder en su marco finamente tallado. A medida que giras el reloj de arena y observas cómo fluye la arena, puedes sentir su magia tirando de ti, seguramente usar esta magia te dará cierto control sobre el tiempo.
items.artifacts.timekeepershourglass.desc_hint=El reloj de arena parece haber perdido algo de arena, si tan solo pudieras encontrar un poco...
items.artifacts.timekeepershourglass.desc_cursed=El reloj de arena maldito está encajado a tu lado, sientes que está intentando manipular tu flujo del tiempo.
items.artifacts.timekeepershourglass$timefreeze.name=Congelar el Tiempo
items.artifacts.timekeepershourglass$timefreeze.desc=El tiempo se congela a tu alrededor, permitiéndote realizar acciones instantáneamente. El efecto durará hasta que se cancele o el reloj se quede sin cargas. Atacar o utilizar magia también terminará el efecto.\n\nTurnos hasta uso de carga: %s.
items.artifacts.timekeepershourglass$sandbag.name=bolsa de arena mágica
items.artifacts.timekeepershourglass$sandbag.levelup=Añades la arena a tu reloj de arena.
items.artifacts.timekeepershourglass$sandbag.maxlevel=¡Tu reloj de arena está lleno de arena mágica!
items.artifacts.timekeepershourglass$sandbag.no_hourglass=No tienes una reloj de arena para colocar esta arena en su interior.
items.artifacts.timekeepershourglass$sandbag.desc=Esta pequeña bolsa de arena fina debería funcionar perfectamente con tu reloj de arena.\n\nEs curioso que el tendero tenga este ítem en concreto justo cuando lo necesitas...

items.artifacts.unstablespellbook.name=libro de hechizos inestable
items.artifacts.unstablespellbook.ac_read=LEER
items.artifacts.unstablespellbook.ac_add=AÑADIR
items.artifacts.unstablespellbook.blinded=No puedes leer el libro mientras estás cegado.
items.artifacts.unstablespellbook.no_charge=Tu libro de hechizos está sin energía por ahora.
items.artifacts.unstablespellbook.cursed=No puedes leer de un libro de hechizos maldito.
items.artifacts.unstablespellbook.prompt=Selecciona un pergamino
items.artifacts.unstablespellbook.infuse_scroll=Has infundido la energía del pergamino en el libro.
items.artifacts.unstablespellbook.unable_scroll=Eres incapaz de añadir este pergamino en el libro.
items.artifacts.unstablespellbook.unknown_scroll=No estás seguro de que tipo de pergamino es todavía.
items.artifacts.unstablespellbook.desc=Este tomo está en una condición sorprendentemente buena dada a su edad. Burbujea y cruje mientras pasas las páginas, agitándose con una energía inestable. Si lees de este libro, no se sabe qué hechizo podrás arrojar.
items.artifacts.unstablespellbook.desc_cursed=El libro maldito se ha ligado a ti, está inhibiendo tu capacidad de usar la mayoría de los pergaminos.
items.artifacts.unstablespellbook.desc_index=El libro está incompleto. El índice apunta en este momento a las siguientes páginas en blanco:
items.artifacts.unstablespellbook.desc_empowered=Los pergaminos que has agregado al libro brillan con poder. Podrás elegir la versión exótica de los efectos de estos pergaminos, pero a cambio de un coste adicional.
items.artifacts.unstablespellbook.read_empowered=El pergamino que agregaste al libro de hechizos surge con energía. Eres capaz de canalizar la versión regular o exótica del efecto de este pergamino.\n\nElegir la variante exótica costará 2 cargas en lugar de 1.



###bags
items.bags.bag.name=mochila

items.bags.potionbandolier.name=bandolera de pociones
items.bags.potionbandolier.desc=Esta bandolera gruesa se ajusta alrededor de tu pecho como una faja, tiene muchas correas aislantes para sostener los frascos de pociones, tu odre de agua o metal liquido.\n\nDentro de la bandolera, tus pociones deberían estar protegidas del frío.

items.bags.scrollholder.name=contenedor de pergaminos
items.bags.scrollholder.desc=Este contenedor tubular parece haber contenido las herramientas y los mapas de un astrónomo, pero tus pergaminos se ajustarán igual de bien. Incluso hay algunos compartimentos laterales en los que encajarían perfectamente cristales de hechizo, stillus arcano y resina arcana.\n\nEl contenedor no se ve muy inflamable, por lo que tus pergaminos deberían estar a salvo del fuego dentro de él.

items.bags.velvetpouch.name=bolsa de terciopelo
items.bags.velvetpouch.desc=Esta pequeña bolsa de terciopelo puede almacenar muchos objetos pequeños, como semillas, piedras rúnicas y algunos ingredientes de alquimia.

items.bags.magicalholster.name=contenedor mágico
items.bags.magicalholster.desc=Esta funda delgada esta hecha de piel de un animal exótico, y posee magia poderosa que permite que se almacene una cantidad masiva de armas a distancia.\n\nSimplemente puedes extender la mano dentro de la bolsa y siempre agarrarás el objeto que estabas buscando.\n\nDebido a la magia de la funda, las varitas se cargarán un poco más rápido, y las armas arrojadizas van a durar un poco más dentro de ella.



###bombs
items.bombs.arcanebomb.name=bomba arcana
items.bombs.arcanebomb.desc=Esta bomba ha sido impregnada con propiedades arcanas. Estallará en una explosión poderosa similar al ataque bombeado de Gú. Esta explosión penetra en la armadura y llega más lejos que la explosión de una bomba normal.

items.bombs.bomb.name=bomba
items.bombs.bomb.ac_lightthrow=ENCENDER Y LANZAR
items.bombs.bomb.snuff_fuse=Rápidamente apagas la mecha de la bomba.
items.bombs.bomb.ondeath=La explosión te mata...
items.bombs.bomb.rankings_desc=Muerto por una explosión
items.bombs.bomb.desc=Una bomba de pólvora bastante potente. Una explosión de esto ciertamente dañaría cualquier cosa cercana.
items.bombs.bomb.desc_fuse=Parece que la mecha tardará un par de turnos en quemarse una vez se encienda.
items.bombs.bomb.desc_burning=La mecha de la bomba está ardiendo, ¡mantén la distancia o apágala!
items.bombs.bomb$doublebomb.name=dos bombas
items.bombs.bomb$doublebomb.desc=Una pila de dos pesadas bombas de pólvora negras, ¡parece que obtienes una gratis!

items.bombs.firebomb.name=bomba de fuego
items.bombs.firebomb.desc=Esta bomba ha sido modificada para estallar en una llama sostenida en un área más grande cuando explota.

items.bombs.flashbang.name=flashbang
items.bombs.flashbang.desc=Esta bomba personalizada estalla con luz, sonido y electricidad. Las criaturas a menos de 2 casillas reciben daño eléctrico y quedan paralizadas durante 10 turnos.
items.bombs.flashbang.ondeath=¡Quedaste atrapado en tu propia flashbang!

items.bombs.frostbomb.name=bomba helada
items.bombs.frostbomb.desc=Esta bomba ha sido modificada para explotar en una ráfaga sostenida de aire helado en un gran área cuando explota.

items.bombs.holybomb.name=bomba sagrada
items.bombs.holybomb.desc=Esta bomba ha sido modificada para encender una luz sagrada en un gran área cuando explota, lo que inflige daño adicional a los enemigos no muertos y demoníacos.

items.bombs.noisemaker.name=bomba de ruido
items.bombs.noisemaker.desc=Esta bomba personalizada hará ruido repetidamente cuando se agote su fusible. Cuando algo toque la bomba, ¡explotará!
items.bombs.noisemaker.desc_burning=¡El generador de ruido no se detiene, explotará cuando algo se acerque!

items.bombs.shockbomb.name=bomba de choque
items.bombs.shockbomb.desc=Esta bomba ha sido modificada para liberar rayos de electricidad cuando explota. Todo lo que esté cerca se dañará y aturdirá según lo cerca que esté de la bomba.

items.bombs.regrowthbomb.name=bomba de rebrote
items.bombs.regrowthbomb.desc=Esta bomba personalizada salpicará un líquido que da vida a su alrededor en lugar de explotar. En el área atrapada por la explosión brotarán rápidamente hierba y plantas. Tú y cualquier aliado alcanzado por la explosión será curado como si hubiera bebido una poción de curación.

items.bombs.shrapnelbomb.name=bomba de metralla
items.bombs.shrapnelbomb.desc=Esta bomba ha sido modificada con restos de metal del DM-300, que se fragmentará y volará a todas partes cuando explote, dañando cualquier cosa en un gran rango alrededor de la bomba. Será mejor que te escondas detrás de algo cuando la uses...

items.bombs.woollybomb.name=bomba de lana
items.bombs.woollybomb.desc=Esta bomba personalizada creará un amplio campo de ovejas mágicas después de explotar. Estas ovejas bloquearán el movimiento y persistirán por un algún largo tiempo. Aunque no durarán tanto en la presencia de enemigos poderosos y pueden ser disipadas prematuramente interactuando con ellas.

###food
items.food.berry.name=baya de mazmorra
items.food.berry.eat_msg=¡Esa baya estaba sabrosa!
items.food.berry.desc=Esta pequeña baya fue encontrada por la Cazadora entre la vegetación de la mazmorra. Se puede comer rápidamente, restaura una pequeña cantidad de saciedad, y podría contener una semilla utilizable!

items.food.blandfruit.name=fruta insípida
items.food.blandfruit.cooked=fruta insípida cocida
items.food.blandfruit.sunfruit=bayasol
items.food.blandfruit.rotfruit=putrefruta
items.food.blandfruit.earthfruit=bayatierra
items.food.blandfruit.blindfruit=bayaciega
items.food.blandfruit.firefruit=bayafuego
items.food.blandfruit.icefruit=bayahielo
items.food.blandfruit.fadefruit=bayadesvanecer
items.food.blandfruit.sorrowfruit=bayatriste
items.food.blandfruit.stormfruit=bayatormenta
items.food.blandfruit.dreamfruit=magofruta
items.food.blandfruit.starfruit=frutaestrella
items.food.blandfruit.swiftfruit=bayaimpulso
items.food.blandfruit.raw=No eres capaz de comértela cruda.
items.food.blandfruit.desc=Muy seca e insustancial, tal vez mejoraría cocinándola con algún otro ingrediente.
items.food.blandfruit.desc_cooked=La fruta se ha rellenado por su tiempo dentro de la olla e incluso ha absorbido las propiedades de la semilla con que fue cocinada. Tendrá el efecto de cualquier poción a la que correspondiera la semilla.
items.food.blandfruit.desc_eat=¡Parece lista para comer!
items.food.blandfruit.desc_throw=Parece bastante volátil, podría ser mejor arrojarla.
items.food.blandfruit$chunks.name=trozos de fruta insípida
items.food.blandfruit$chunks.desc=La fruta insípida ha explotado en el impacto, dejando trozos inertes.\n\nA pesar de un poco de suciedad, estos grandes trozos de fruta cocida parecen perfectamente comestibles.

items.food.chargrilledmeat.name=carne tierna
items.food.chargrilledmeat.desc=Parece un filete decente comestible.

items.food.food.name=ración de comida
items.food.food.ac_eat=COMER
items.food.food.eat_msg=¡La comida estaba deliciosa!
items.food.food.desc=Nada lujoso aquí: carne seca, algunas galletas - cosas así.

items.food.frozencarpaccio.name=carpaccio congelado
items.food.frozencarpaccio.invis=¡Ves tus manos volverse invisibles!
items.food.frozencarpaccio.hard=¡Sientes que tu piel se endurece!
items.food.frozencarpaccio.refresh=¡Refrescante!
items.food.frozencarpaccio.better=¡Te sientes mejor!
items.food.frozencarpaccio.desc=Es un trozo de carne cruda congelada. La única forma de comerla es cortando rebanadas delgadas. Y así está sorprendentemente buena.

items.food.meatpie.name=pastel de carne
items.food.meatpie.eat_msg=¡Esa comida estaba increíble!
items.food.meatpie.desc=Un delicioso pastel relleno de sabrosa carne. Esto te saciará mucho más que cualquier otra comida.

items.food.mysterymeat.name=carne misteriosa
items.food.mysterymeat.eat_msg=La comida supo... extraña.
items.food.mysterymeat.hot=¡Oh, está caliente!
items.food.mysterymeat.legs=¡No puedes sentir tus piernas!
items.food.mysterymeat.not_well=No te sientes bien.
items.food.mysterymeat.stuffed=Estás lleno.
items.food.mysterymeat.desc=¡Come bajo tu propio riesgo!
items.food.mysterymeat$placeholder.name=carne

items.food.phantommeat.name=carne fantasma
items.food.phantommeat.desc=Un bistec translúcido grande y reluciente, cortado de una piraña fantasma. Esta carne mágica no necesita cocinarse y otorga una serie de beneficios defensivos además de saciarte por completo. Cuando se come, otorga invisibilidad, piel de roble, algo de curación y cura muchos efectos dañinos.

items.food.pasty.name=empanada
items.food.pasty.fish_name=pescado al vapor
items.food.pasty.amulet_name=¿amuleto de yendor?
items.food.pasty.egg_name=huevo de pascua
items.food.pasty.rainbow_name=poción arcoíris
items.food.pasty.shattered_name=pastel verde
items.food.pasty.pie_name=tarta de calabaza
items.food.pasty.vanilla_name=pastel azul
items.food.pasty.cane_name=bastón de caramelo
items.food.pasty.sparkling_name=poción espumosa
items.food.pasty.desc=Una auténtica Empanada de Maíz con un relleno tradicional de carne de res y papas. ¡Delicioso!
items.food.pasty.fish_desc=Un pescado entero al vapor, mágicamente conservado sobre un lecho de verduras. Es tradición guardar algo de pescado para más tarde en esta época del año, así que conservarás algunas sobras en lugar de comértelo todo de una vez.\n\n¡Feliz Año Nuevo Lunar!
items.food.pasty.amulet_desc=Finalmente lo has conseguido, el mágico amuleto de- un momento, ¡esto solo es un chocolate envuelto en papel de aluminio con la forma del amuleto! No te garantizará poder ilimitado, pero al menos te llenará y te dara algo de recarga de artefactos.\n\nApril Fools!
items.food.pasty.egg_desc=Un gran huevo de chocolate, envuelto en una colorida lámina amarilla. Aquí hay suficiente chocolate para saciarte, y el azúcar puede darle a tus artefactos un poquito de carga extra.\n\n¡Felices Pascuas!
items.food.pasty.rainbow_desc=Esta colorida poción es un tipo de comida liquida. Además de satisfacer tu hambre, contiene un poco de magia en ella la cuál calma a un enemigo adyacente que no sea jefe, haciéndolos dudar temporalmente de luchar contra ti.\n\n¡Feliz Mes del Orgullo!
items.food.pasty.shattered_desc=Esta gran rebanada de pastel de vainilla tiene coloridos confites y glaseado verde. Este pastel se hizo para celebrar años de experiencia, y te concederá una pequeña parte de esa experiencia cuando lo comas.\n\nEternity Pixel Dungeon fue publicado por primera vez el 5 de Agosto de 2014. ¡Feliz cumpleaños Eternity Pixel Dungeon!
items.food.pasty.pie_desc=Una gran rebanada de tarta de calabaza. Su sabor dulce y picante te llenará y te dará un poquito de curación.\n\n¡Feliz Halloween!
items.food.pasty.vanilla_desc=Esta gran rebanada de pastel de vainilla tiene coloridos confites y glaseado azul. Este pastel se hizo para celebrar años de experiencia, y te concederá una pequeña parte de esa experiencia cuando lo comas.\n\nPixel Dungeon fue publicado por primera vez el 4 de Diciembre de 2012. ¡Feliz cumpleaños Pixel Dungeon!
items.food.pasty.cane_desc=Un bastón de caramelo gigante. Es suficientemente grande para saciarte, y el azúcar puede que le dé a tus varitas un poco de carga extra.\n\n¡Felices Fiestas!
items.food.pasty.sparkling_desc=Esta poción espumosa es un tipo de comida liquida. Sacia el hambre e imita al vino espumoso, aunque en realidad no es alcohólica. La cálida sensación en tu estómago te otorgará un poco de blindaje.\n\n¡Feliz Año Nuevo!
items.food.pasty$fishleftover.name=sobras de pescado
items.food.pasty$fishleftover.eat_msg=Esa comida sabía bien.
items.food.pasty$fishleftover.desc=Algunos restos de pescado de tu anterior comida. Puedes comerlo cuando quieras para saciar un poco el hambre.

items.food.smallration.name=pequeña ración de comida
items.food.smallration.eat_msg=Esa comida supo bien.
items.food.smallration.desc=Parece idéntica a una ración estándar, pero más pequeña.

items.food.stewedmeat.name=estofado de carne
items.food.stewedmeat.eat_msg=Esa comida supo bien.
items.food.stewedmeat.desc=Guisar la carne la ha limpiado de cualquier enfermedad o parásito. Debería ser segura para comer.

items.food.supplyration.name=ración de suministro
items.food.supplyration.desc=Esta ración fue dejada en la mazmorra por y para los miembros del gremio de ladrones. Está diseñada específicamente para ser consumida sobre la marcha y facilitar artimañas en general.\n\nSi bien no llena tanto como una ración normal, se puede comer rápidamente, proporciona un poco de curación directa y recupera una carga del manto de sombras del Pícaro.



##journal items
items.journal.documentpage.name=página rota
items.journal.documentpage.desc=Una página solitaria, probablemente arrancada de un libro de algún tipo. Tendrás que recogerla para leerla.

items.journal.alchemypage.name=página de libro de alquimia desgarrada
items.journal.alchemypage.desc=Una página rasgada de una guía sobre alquimia.\n\nLa mayoría del texto es demasiado pequeño para leerse a distancia, pero puedes distinguir el título de la página:\n\n_"%s"_

items.journal.guidebook.name=tomo de la maestría de mazmorras
items.journal.guidebook.hint_mobile=¡Tu guía tiene un consejo para ti! Toca el botón parpadeante del diario para leerlo.
items.journal.guidebook.hint_desktop=¡Tu guía tiene un consejo para ti! Presiona el botón parpadeante del diario (%s) para leerlo.
items.journal.guidebook.hint_status=Guía
items.journal.guidebook.desc=¡Una guía de aventureros, abandonada por alguien que decidió que las aventuras no eran lo suyo! Este libro en particular es mágico y puede sugerir a los aventureros a leer una página en el momento adecuado.\n\nA pesar de esa funcionalidad, el libro es más popular debido al "¡No cunda el pánico!" escrito en grandes letras en su portada.

items.journal.guidepage.name=página de guía rota
items.journal.guidepage.desc=Una página desgarrada de una guía de aventuras.\n\nLa mayoría del texto es demasiado pequeño para leerlo a distancia, pero puedes distinguir el título de la página:\n\n_"%s"_

items.journal.regionlorepage$sewers.name=carta desgastada
items.journal.regionlorepage$sewers.desc=Lo que parece ser una carta, escrita en papel manchado con suciedad. Tendrás que recogerla para poder distinguir lo que está escrito en ella.

items.journal.regionlorepage$prison.name=entrada de diario desgastado
items.journal.regionlorepage$prison.desc=Una entrada de diario, o algún otro tipo de registro, escrito en un viejo trozo de papel. Parece que ha perdurado mejor que las cartas que encontraste en las alcantarillas, pero aún así tendrás que cogerlo para leerlo.

items.journal.regionlorepage$caves.name=entrada de registro antiguo
items.journal.regionlorepage$caves.desc=Lo que parece ser una entrada en el cuaderno de registro de un explorador, conservado sorprendentemente bien a pesar de lo viejo que debe ser. Recógelo para leerlo.

items.journal.regionlorepage$city.name=placa oxidada
items.journal.regionlorepage$city.desc=Una pequeña placa de metal oxidada con un mensaje grabado mágicamente en ella. Las letras siguen siendo claras a pesar de la edad de la placa, pero tendrás que recogerla para leerla.

items.journal.regionlorepage$halls.name=placa luminosa
items.journal.regionlorepage$halls.desc=Una pequeña placa negra con brillantes letras verdes grabadas en ella. Las brillantes letras se difuminan en una neblina desde lejos, tendrás que recogerla para leerla.


###keys
items.keys.goldenkey.name=llave dorada
items.keys.goldenkey.desc=Las muescas en esta llave de oro son minúsculas e intrincadas. ¿Quizás pueda abrir un cofre cerrado?

items.keys.crystalkey.name=Llave de Cristal
items.keys.crystalkey.desc=Las superficies de esta llave cristalina brillan en la oscuridad. ¿Quizás abra algo hecho de cristal?

items.keys.ironkey.name=llave de acero
items.keys.ironkey.desc=Las muescas en esta antigua llave de hierro están bien gastadas; Su cordón de cuero está maltratado por la edad. ¿Qué puerta podría abrir?

items.keys.skeletonkey.name=llave maestra
items.keys.skeletonkey.desc=Esta llave se ve particular: su cabeza tiene forma de una calavera. Probablemente puede abrir alguna puerta particular.



###bags
items.bags.bag.name=mochila

items.bags.potionbandolier.name=bandolera de pociones
items.bags.potionbandolier.desc=Esta bandolera gruesa se ajusta alrededor de tu pecho como una faja, tiene muchas correas aislantes para sostener los frascos de pociones, tu odre de agua o metal líquido.\n\nDentro de la bandolera, tus pociones deberían estar protegidas del frío.

items.bags.scrollholder.name=portapergaminos
items.bags.scrollholder.desc=Este contenedor tubular parece pensado para herramientas astronómicas, pero tus pergaminos encajan a la perfección. Incluso cuenta con compartimentos laterales para cristales de hechizos, estiletes y resina arcana.\n\nNo parece inflamable, por lo que tus pergaminos estarán a salvo del fuego en su interior.

items.bags.velvetpouch.name=bolsa de terciopelo
items.bags.velvetpouch.desc=Esta pequeña bolsa de terciopelo puede almacenar muchos objetos pequeños, como semillas, runapiedras e ingredientes de alquimia.

items.bags.magicalholster.name=funda mágica
items.bags.magicalholster.desc=Esta delgada funda está hecha de piel exótica y posee una magia poderosa que le permite almacenar una enorme cantidad de armas a distancia.\n\nSimplemente extiende la mano y siempre tomarás el objeto exacto que buscabas.\n\nDebido a su magia, las varitas se recargan ligeramente más rápido y las armas arrojadizas duran un poco más.

items.bags.cheesecheest.name=cofre increíblemente quesoso
items.bags.cheesecheest.desc=Este cofre portátil reluciente y apetitoso puede almacenar los objetos más valiosos que un aventurero puede llevar, como artefactos y anillos.\n\nEs increíblemente costoso.

items.bags.utilitybag.name=bolsa de utilidades
items.bags.utilitybag.desc=Esta mochila resuelve la mayoría de los problemas de gestión de espacio, almacenando equipos consumibles y herramientas útiles.\n\nEs costosa, pero ¿quién conoce su verdadero valor?

items.bags.equipmentbag.name=bolsa de equipamiento
items.bags.equipmentbag.desc=Esta bolsa reforzada de gran resistencia está diseñada a medida para almacenar una gran variedad de armas cuerpo a cuerpo, proyectiles y armaduras, manteniendo tu mochila principal despejada.

items.bags.jewelrybox.name=joyero
items.bags.jewelrybox.desc=Un cofre finamente elaborado y forrado en terciopelo, encantado para resguardar de forma segura anillos, poderosos artefactos y baratijas raras.

###potions
items.potions.potion.ac_drink=BEBER
items.potions.potion.turquoise=poción turquesa
items.potions.potion.crimson=poción escarlata
items.potions.potion.azure=poción azure
items.potions.potion.jade=poción jade
items.potions.potion.golden=poción dorada
items.potions.potion.magenta=poción magenta
items.potions.potion.charcoal=poción carbón
items.potions.potion.ivory=poción marfileña
items.potions.potion.amber=poción ámbar
items.potions.potion.bistre=poción bistre
items.potions.potion.indigo=poción índigo
items.potions.potion.silver=poción plateada
items.potions.potion.unknown_desc=Este frasco contiene un líquido colorido. ¿Quién sabe que hará al ser bebido o lanzado?
items.potions.potion.harmful=¡Poción perjudicial!
items.potions.potion.beneficial=Poción beneficiosa
items.potions.potion.yes=Si, sé lo que hago
items.potions.potion.no=No, he cambiado de idea
items.potions.potion.sure_drink=¿Estás seguro de que quieres beberla? En la mayoría de los casos lanzar estas pociones a los enemigos tiene más sentido.
items.potions.potion.sure_throw=¿Estás seguro de que quieres lanzarla? En la mayoría de los casos tiene sentido beberla.
items.potions.potion.shatter=El frasco se rompe y el líquido salpica sin causar daños.
items.potions.potion$placeholder.name=poción
items.potions.potion$seedtopotion.name=Poción Aleatoria

items.potions.potionofexperience.name=Poción de experiencia
items.potions.potionofexperience.desc=Las experiencias legendarias de multitudes de batallas reducidas a forma líquida, este brebaje aumentará instantáneamente tu nivel de experiencia.

items.potions.potionoffrost.name=Poción de escarcha
items.potions.potionoffrost.desc=El producto químico contenido en esta poción se evaporará en una nube de congelación al exponerse al aire libre.

items.potions.potionofhaste.name=Poción de velocidad
items.potions.potionofhaste.energetic=¡Te sientes con energia!
items.potions.potionofhaste.desc=Beber este líquido extrañamente dulce te impregnará de tremenda energía por un corto tiempo, permitiéndote correr a altas velocidades.

items.potions.potionofhealing.name=Poción de curación
items.potions.potionofhealing.heal=Tus heridas empiezan a cerrarse.
items.potions.potionofhealing.desc=Este elixir te devolverá la salud con rapidez y curará instantáneamente muchas dolencias.

items.potions.potionofinvisibility.name=Poción de invisibilidad
items.potions.potionofinvisibility.invisible=¡Ves tus manos volverse invisibles!
items.potions.potionofinvisibility.desc=Beber esta poción te hará temporalmente invisible. Mientras sea invisible, los enemigos no podrán verte. Ataques físicos y efectos mágicos (tales como pergaminos y varitas) cancelarán la invisibilidad inmediatamente.

items.potions.potionoflevitation.name=Poción de levitación
items.potions.potionoflevitation.float=¡Flotas en el aire!
items.potions.potionoflevitation.desc=Beber este curioso líquido te hará flotar en el aire, pudiendo sobrevolar sin esfuerzo sobre trampas y pozos. Al lanzar esta poción se creará una nube de gas sin refinar, desorientando cualquier cosa atrapada en ella.

items.potions.potionofliquidflame.name=Poción de llama líquida
items.potions.potionofliquidflame.desc=Este frasco contiene un compuesto inestable que estallará violentamente en llamas al exponerse al aire libre.

items.potions.potionofmindvision.name=Poción de visión mental
items.potions.potionofmindvision.see_mobs=¡De algún modo puedes sentir la presencia de las mentes de otras criaturas!
items.potions.potionofmindvision.see_none=De algún modo puedes decir que estás solo en este nivel por el momento.
items.potions.potionofmindvision.desc=Después de beber esto, tu mente estará en sintonía con el aura psíquica de las criaturas distantes, permitiéndote sentir presencias biológicas a través de las paredes. También esta poción te permitirá ver a través de las paredes y puertas cercanas.

items.potions.potionofparalyticgas.name=Poción de gas paralizante
items.potions.potionofparalyticgas.desc=Tras la exposición al aire libre, el líquido en este frasco se evaporará en una neblina amarilla entumecedora. Cualquiera que inhale la neblina será paralizado inmediatamente, incapaz de moverse por un tiempo después de que la nube se disipe. Este ítem puede ser lanzado a enemigos distantes para atraparlos dentro del efecto del gas.

items.potions.potionofpurity.name=Poción de pureza
items.potions.potionofpurity.freshness=Sientes una extraña frescura en el aire.
items.potions.potionofpurity.protected=¡Una capa protectora te envuelve!
items.potions.potionofpurity.desc=Este reactivo mágico neutralizará rápidamente todos los efectos dañinos en una gran área. Beberlo te dará inmunidad temporal a tales efectos.

items.potions.potionofstrength.name=Poción de fuerza
items.potions.potionofstrength.msg=Un nuevo poder fluye por tu cuerpo, ¡ahora tienes %d de fuerza!
items.potions.potionofstrength.desc=Este potente líquido recorrerá tus músculos, incrementando permanentemente tu fuerza en un punto.

items.potions.potionoftoxicgas.name=Poción de gas tóxico
items.potions.potionoftoxicgas.desc=Descorchar o romper este frasco presurizado causará que su contenido explote en una nube mortal de gas verde tóxico. Puedes elegir lanzar esta poción a enemigos distantes en lugar de descorcharla con la mano.



###brews
items.potions.brews.aquabrew.name=infusión acuática
items.potions.brews.aquabrew.desc=Cuando se rompa, esta infusión liberará una explosión de agua presurizada en su ubicación. Sólo tiene fuerza suficiente para dañar a los enemigos ardientes, pero también esparce agua por el terreno cercano, apaga incendios y empuja a los personajes cercanos a la explosión.

items.potions.brews.blizzardbrew.name=infusión de ventisca
items.potions.brews.blizzardbrew.desc=Cuando se rompa, esta infusión desatará una tormenta de nieve arremolinada que se propaga rápidamente como un gas.

items.potions.brews.causticbrew.name=infusión cáustica
items.potions.brews.causticbrew.desc=Este brebaje dispersará cieno corrosivo en un área extensa alrededor de la ubicación de donde se fragmenta. Cualquier cosa atrapada por el cieno, será lentamente derretida si no se lava en el agua.

items.potions.brews.infernalbrew.name=infusión infernal
items.potions.brews.infernalbrew.desc=Cuando se rompa, esta infusión desencadenará un infierno furioso que se propaga rápidamente como un gas.

items.potions.brews.shockingbrew.name=infusión impactante
items.potions.brews.shockingbrew.desc=Cuando se rompa, esta infusión desatará una tormenta eléctrica en un amplia área alrededor de la ubicación donde se rompe.

items.potions.brews.unstablebrew.name=infusión inestable
items.potions.brews.unstablebrew.desc=Esta infusión mágica brilla con los cambiantes colores del arco iris.\n\nCuando se bebe o lanza activa el efecto de una poción aleatoria. El efecto de la poción siempre será beneficioso si se bebe, y siempre será dañino si se lanza.

###elixirs
items.potions.elixirs.elixirofarcanearmor.name=elixir de armadura arcana
items.potions.elixirs.elixirofarcanearmor.desc=Este elixir otorgará al que lo beba una resistencia duradera al daño mágico.

items.potions.elixirs.elixirofaquaticrejuvenation.name=elixir de rejuvenecimiento acuático
items.potions.elixirs.elixirofaquaticrejuvenation.desc=Este elixir contiene los restos de Gú, fortalecidos con una poción de curación. A pesar de que no proveerá curación inmediata, restaurará constantemente una mayor cantidad de salud mientras estés parado en el agua.
items.potions.elixirs.elixirofaquaticrejuvenation$aquahealing.name=curación acuática
items.potions.elixirs.elixirofaquaticrejuvenation$aquahealing.desc=Has ganado temporalmente propiedades restauradoras similares a las de Goo. \n\nMientras estás parado en el agua, recuperarás una pequeña cantidad de salud por turno. El efecto se detiene cuando estés lleno de salud o  fuera del agua.\n\nCuración restante: %d.

items.potions.elixirs.elixirofdragonsblood.name=elixir de sangre de dragón
items.potions.elixirs.elixirofdragonsblood.desc=Cuando es consumido, este elixir enviará poder ardiente a través de las venas del bebedor. Este efecto hará que el bebedor sea inmune al fuego y le permitirá prender fuego a los enemigos con ataques físicos.

items.potions.elixirs.elixiroffeatherfall.name=elixir de caída de pluma
items.potions.elixirs.elixiroffeatherfall.light=¡Te sientes ligero como una pluma!
items.potions.elixirs.elixiroffeatherfall.desc=Este elixir ofrece un débil pero controlado efecto de levitación, permitiéndole al bebedor caer grandes distancias sin sufrir daño por un corto tiempo.
items.potions.elixirs.elixiroffeatherfall$featherbuff.name=caída de pluma
items.potions.elixirs.elixiroffeatherfall$featherbuff.desc=Estás bajo los efecto de un elixir de caída de pluma, ¡permitiéndote caer en abismos sin recibir daño! \n\nTurnos restantes: %s.

items.potions.elixirs.elixirofhoneyedhealing.name=elixir de curación melosa
items.potions.elixirs.elixirofhoneyedhealing.desc=Este elixir combina la curación con la dulzura de la miel. Cuando es bebida, aplica el mismo efecto que una poción de curación y satisface una pequeña cantidad de hambre, pero también puede ser lanzado para sanar a un aliado.\n\nLas criaturas con afinidad por la miel pueden ser pacificadas si este ítem se usa en ellas.

items.potions.elixirs.elixiroficytouch.name=elixir de toque helado
items.potions.elixirs.elixiroficytouch.desc=Cuando es consumido, este elixir permitirá al bebedor absorber el calor de los enemigos que ataca. Este efecto hará que el bebedor sea inmune al frío y le permitirá enfriar a los enemigos con ataques físicos.

items.potions.elixirs.elixirofmight.name=elixir de poderío
items.potions.elixirs.elixirofmight.msg=Un nuevo poder fluye por tu cuerpo, ¡ahora tienes %d de fuerza!
items.potions.elixirs.elixirofmight.desc=Este líquido poderoso recorrerá tus músculos, aumentando permanentemente tu fuerza en un punto y aumentando temporalmente la salud máxima en %d puntos. El aumento de salud depende de tu salud máxima, pero disminuirá lentamente a medida que subas de nivel.
items.potions.elixirs.elixirofmight$htboost.name=impulso de salud máxima
items.potions.elixirs.elixirofmight$htboost.desc=Tu cuerpo se siente anormalmente fuerte y saludable. \n\nTu salud máxima se incrementa durante un período prolongado de tiempo. A medida que ganes niveles, el aumento se desvanecerá constantemente.\n\nAumento actual: %d.\nNiveles restantes: %d.

items.potions.elixirs.elixiroftoxicessence.name=elixir de esencia tóxica
items.potions.elixirs.elixiroftoxicessence.desc=Cuando es consumido, este elixir imbuirá al bebedor con energía tóxica. El bebedor esparcirá gas tóxico continuamente mientras se mueva, y será inmune al gas tóxico y al veneno durante un tiempo ligeramente superior a la duración del efecto.



###exotic potions
items.potions.exotic.exoticpotion.turquoise=poción turquesa exótica
items.potions.exotic.exoticpotion.crimson=poción carmesí exótica
items.potions.exotic.exoticpotion.azure=poción azur exótica
items.potions.exotic.exoticpotion.jade=poción jade exótica
items.potions.exotic.exoticpotion.golden=poción dorada exótica
items.potions.exotic.exoticpotion.magenta=poción magenta exótica
items.potions.exotic.exoticpotion.charcoal=poción carbón exótica
items.potions.exotic.exoticpotion.ivory=poción marfileña exótica
items.potions.exotic.exoticpotion.amber=poción ámbar exótica
items.potions.exotic.exoticpotion.bistre=poción bistre exótica
items.potions.exotic.exoticpotion.indigo=poción índigo exótica
items.potions.exotic.exoticpotion.silver=poción plateada exótica
items.potions.exotic.exoticpotion.unknown_desc=Este frasco redondo contiene un líquido colorido granulado. Parece ser ajeno a esta tierra, ¿quién sabe lo que hará al ser bebido o lanzado?
items.potions.exotic.exoticpotion.warning=¿Realmente quieres dejar de usar esta poción? Se consumirá de todas formas.
items.potions.exotic.exoticpotion.yes=Sí, estoy seguro
items.potions.exotic.exoticpotion.no=No, he cambiado de idea

items.potions.exotic.potionofcleansing.name=Poción de purificación
items.potions.exotic.potionofcleansing.desc=Este poderoso reactivo hará que el bebedor sea inmune a todos los efectos dañinos durante unos turnos cuando lo beba. También puede ser lanzado a un objetivo para purificarlo.
items.potions.exotic.potionofcleansing$cleanse.name=purificado
items.potions.exotic.potionofcleansing$cleanse.desc=¡Este personaje es temporalmente inmune a todos los efectos dañinos!\n\nTurnos restantes: %s.

items.potions.exotic.potionofcorrosivegas.name=Poción de gas corrosivo
items.potions.exotic.potionofcorrosivegas.desc=Descorchar o romper este frasco presurizado hará que su contenido explote en una nube mortal de gas corrosivo de color óxido. Se propaga más rápidamente que el gas tóxico y es más mortal pero durará menos que este.

items.potions.exotic.potionofdragonsbreath.name=Poción de aliento de dragón
items.potions.exotic.potionofdragonsbreath.prompt=Escoge una ubicación para quemar
items.potions.exotic.potionofdragonsbreath.desc=Este frasco contiene un compuesto inusual que estalla en llamas poco después de mezclarse con la saliva. ¡Escupir rápidamente el líquido permitirá al usuario arrojar llamas de su boca!

items.potions.exotic.potionofearthenarmor.name=Poción de armadura de tierra
items.potions.exotic.potionofearthenarmor.desc=En lugar de paralizar, este líquido tiene un efecto de endurecimiento en la piel que la convertirá en una armadura natural temporal.

items.potions.exotic.potionofdivineinspiration.name=poción de inspiración divina
items.potions.exotic.potionofdivineinspiration.no_more_points=No puedes obtener más puntos de talento adicionales.
items.potions.exotic.potionofdivineinspiration.select_tier=Selecciona un nivel de talento para obtener dos puntos adicionales. Debes haber desbloqueado dicho nivel para poder gastar los puntos.
items.potions.exotic.potionofdivineinspiration.bonus=¡+2 Puntos de Talento!
items.potions.exotic.potionofdivineinspiration.desc=El poder de la energía sagrada reducido a forma líquida, este trago imbuirá al bebedor con poder divino, otorgándole dos puntos de talento adicionales en un nivel de su elección.\n\nEsta poción solo se puede usar una vez para cada nivel de talento.

items.potions.exotic.potionofmagicalsight.name=Poción de visión mágica
items.potions.exotic.potionofmagicalsight.desc=Después de beber esto, tus sentidos se agudizarán brevemente a niveles increíbles, ¡permitiéndote ver a través de las paredes en un radio de 12 casillas!

items.potions.exotic.potionofmastery.name=poción de maestría
items.potions.exotic.potionofmastery.prompt=Domina un ítem
items.potions.exotic.potionofmastery.weapon_easier=¡Tu arma se vuelve más fácil de manejar!
items.potions.exotic.potionofmastery.armor_easier=¡Tu armadura se vuelve más fácil de usar!
items.potions.exotic.potionofmastery.desc=En lugar de otorgar fuerza bruta, esta poción sintonizará los músculos del usuario con un ítem en particular. Esto hará que ese ítem sea más fácil de usar, como si el bebedor hubiera practicado con él y hubiera desarrollado memoria muscular.\n\nEl arma o armadura elegida requerirá 2 puntos de fuerza menos para ser utilizada. Esta poción solo puede ser usada una vez por ítem.

items.potions.exotic.potionofshielding.name=Poción de protección
items.potions.exotic.potionofshielding.desc=En lugar de sanar, esta poción proyectará un escudo duradero alrededor del cuerpo del usuario, bloqueando una cantidad considerable de daño.

items.potions.exotic.potionofshroudingfog.name=Poción de niebla envolvente
items.potions.exotic.potionofshroudingfog.desc=Cuando se expone al aire, el líquido de este frasco producirá una espesa niebla humeante que se propaga rápidamente y bloquea la visión de tus enemigos.

items.potions.exotic.potionofsnapfreeze.name=Poción de congelación rápida
items.potions.exotic.potionofsnapfreeze.desc=La sustancia química contenida en esta poción reaccionará rápidamente con el aire, congelando y enraizando instantáneamente todo dentro de su efecto.

items.potions.exotic.potionofstamina.name=Poción de resistencia
items.potions.exotic.potionofstamina.desc=Beber este líquido extrañamente dulce te infundirá un impulso de energía duradero, lo que te permitirá correr a un ritmo acelerado durante un período prolongado de tiempo.

items.potions.exotic.potionofstormclouds.name=Poción de nubes de tormenta
items.potions.exotic.potionofstormclouds.desc=Lanzar esta poción creará una nube de vapor concentrado de rápida propagación, que se condensará y se derramará sobre el entorno. La mayor parte del terreno se convertirá en agua, los enemigos ardientes sufrirán daños, el fuego se apagará y las trampas se desbordarán y se romperán.



###quest items
items.quest.ceremonialcandle.name=vela ceremonial
items.quest.ceremonialcandle.desc=Un juego de velas, derretidas y unidas entre sí por el uso.\nPor sí solas son inútiles, pero usadas con otras velas en patrón, pueden concentrar la energía para un ritual de invocación.

items.quest.corpsedust.name=polvo cadavérico
items.quest.corpsedust.chill=Un escalofrío corre por tu espalda.
items.quest.corpsedust.desc=La bola de polvo cadavérico no es muy diferente externamente a una bola de polvo normal. Pero puedes sentir una energía maligna acechando dentro de ella.\n\nDeshacerte de ella lo antes posible sería una buena idea.

items.quest.darkgold.name=mineral de oro oscuro
items.quest.darkgold.you_now_have=Ahora tienes %d mineral de oro oscuro.
items.quest.darkgold.desc=A este metal se le llama oscuro, no por su color (que es el mismo que el del oro normal), sino porque se funde al exponerlo a la luz del día, haciéndolo inútil en la superficie.

items.quest.dwarftoken.name=token de enano
items.quest.dwarftoken.desc=Muchos enanos y algunas de sus mayores creaciones llevan estas pequeñas piezas de metal de propósito desconocido. Tal vez son joyería o algún tipo de identificación. Los enanos son gente extraña.

items.quest.embers.name=ascuas elementales
items.quest.embers.desc=Ascuas especiales que sólo pueden obtenerse de elementales de fuego jóvenes. Irradian energía térmica.

items.quest.gooblob.name=gota de Gú
items.quest.gooblob.desc=Una masa pegajosa y gomosa, se separó del Gú cuando murió. Es casi como una gran bola de gelatina, aunque no te atreverías a comerla.\n\nNo hace nada por sí sola, pero podría ser útil cuando se combina con ciertas pociones o una bomba. Por lo menos debería convertirse en una cantidad decente de energía.

items.quest.metalshard.name=fragmento de metal maldito
items.quest.metalshard.desc=Un fragmento de metal maldito oxidado, que se desprendió del DM-300 cuando fue destruido. Puedes sentir una inactiva magia malévola dentro de este.\n\nNo hace nada por sí solo, pero puede ser útil cuando se combina con ciertos pergaminos o una bomba. Por lo menos debería convertirse en una cantidad decente de energía.

items.quest.pickaxe.name=pico
items.quest.pickaxe.ac_mine=MINAR
items.quest.pickaxe.no_vein=No hay ninguna veta de oro oscuro cerca que minar.
items.quest.pickaxe.ability_name=perforar
items.quest.pickaxe.ability_desc=La Duelista puede _perforar_ a un enemigo con un pico. Está garantizado a impactar, aplica vulnerable por 3 turnos y causa _%1$d-%2$d de daño_ contra enemigos de piel dura.
items.quest.pickaxe.upgrade_ability_stat_name=Daño de Habilidad
items.quest.pickaxe.desc=Se trata de una resistente y pesada herramienta para romper rocas. No necesitas equipar el pico para usarlo, pero probablemente puede ser equipado como arma en caso de apuros.

items.quest.ratskull.name=calavera de rata gigante
items.quest.ratskull.desc=Una calavera de rata sorprendentemente grande. Sería un trofeo de caza estupendo, si tuvieras un muro en el que colgarla.



###remains
items.remains.remainsitem.ac_use=USAR
items.remains.bowfragment.name=fragmento de arco
items.remains.bowfragment.desc=Este roto fragmento de madera fue una vez parte del arco espiritual de una Cazadora desaparecida. Puedes sentir que aún queda algo de energía natural en el fragmento. El mismo puede ser usado para hacer crecer hierba alta a tu alrededor. Sin embargo, al hacer esto se destruirá el fragmento.
items.remains.brokenhilt.name=empuñadura rota
items.remains.brokenhilt.desc=Esta empuñadura rota parece provenir del arma de una Duelista derrotada. Puedes sentir que aún queda algo de poder de batalla en la empuñadura. La misma puede ser usada para obtener daño adicional en tus próximos dos golpes cuerpo a cuerpo. Sin embargo, al hacer esto se destruirá la empuñadura.
items.remains.brokenstaff.name=bastón roto
items.remains.brokenstaff.desc=Este bastón del Mago ha sido partido por la mitad tras el deceso de su dueño. Puedes sentir que aún queda algo de energía mágica en el bastón. El mismo puede ser usado para darle a tus varitas un poco de carga. Sin embargo, al hacer esto se destruirá el bastón.
items.remains.cloakscrap.name=trozo de tela
items.remains.cloakscrap.desc=Este trozo de tela translúcida parece provenir del manto de sombras de un difunto Pícaro. Puedes sentir que aún queda algo de energía mística en el trozo de tela. El mismo puede ser usado para darle a tus artefactos un poco de carga. Sin embargo, al hacer esto se destruirá el trozo de tela.
items.remains.sealshard.name=fragmentos de sello
items.remains.sealshard.desc=Estos pequeños fragmentos de cera roja parecen provenir del sello de un Guerrero caído. Puedes sentir que aún queda algo de fuerza de voluntad en el sello. El mismo puede ser usado para obtener un poco de blindaje. Sin embargo, al hacer esto se destruirán los fragmentos de sello.



###rings
items.rings.ring.diamond=anillo de diamante
items.rings.ring.opal=anillo de ópalo
items.rings.ring.garnet=anillo de granate
items.rings.ring.ruby=anillo de rubí
items.rings.ring.amethyst=anillo de amatista
items.rings.ring.topaz=anillo de topacio
items.rings.ring.onyx=anillo de ónice
items.rings.ring.tourmaline=anillo de turmalina
items.rings.ring.emerald=anillo de esmeralda
items.rings.ring.sapphire=anillo de zafiro
items.rings.ring.quartz=anillo de cuarzo
items.rings.ring.agate=anillo de ágata
items.rings.ring.equip_cursed=¡El anillo se tensa alrededor de tu dedo dolorosamente!
items.rings.ring.unknown_desc=Esta cinta de metal está adornada con una gema que resplandece en la oscuridad. ¿Quién sabe que efecto tendrá al llevarla puesta?
items.rings.ring.known=Esto es un %s
items.rings.ring.identify=Te has familiarizado lo suficiente con tu anillo como para identificarlo.
items.rings.ring.cursed_worn=Debido a que este anillo está maldito, no tienes las fuerzas para quitártelo.
items.rings.ring.curse_known=Puedes sentir una magia maligna acechando dentro de este anillo.
items.rings.ring.not_cursed=Este anillo está libre de energía maligna.

items.rings.ringofaccuracy.name=anillo de precisión
items.rings.ringofaccuracy.stats=Cuando se usa, este anillo incrementa tu precisión en _%s%%._
items.rings.ringofaccuracy.typical_stats=Cuando se usa, este anillo normalmente incrementaría tu precisión en _%s%%._
items.rings.ringofaccuracy.combined_stats=Tus anillos equipados están combinando su poder, aumentando tu precisión un _%s%%_ en total.
items.rings.ringofaccuracy.upgrade_stat_name_1=Aumento de Precisión
items.rings.ringofaccuracy.desc=Este anillo aumenta tu concentración, facilitando que tus ataques encuentren su objetivo. Un anillo maldito hará más difícil que tus ataques conecten.

items.rings.ringofarcana.name=anillo de arcana
items.rings.ringofarcana.stats=Cuando se usa, este anillo incrementa el poder de encantamientos y glifos en _%s%%._
items.rings.ringofarcana.typical_stats=Cuando se usa, este anillo normalmente incrementaría el poder de los encantamientos y glifos en _%s%%._
items.rings.ringofarcana.combined_stats=Tus anillos equipados están combinando su poder, aumentando el poder de encantamientos y glifos en un _%s%%_ en total.
items.rings.ringofarcana.upgrade_stat_name_1=Aumento Arcano
items.rings.ringofarcana.desc=Este anillo mejora los encantamientos mágicos en armas y glifos en armaduras, ¡incluyendo maldiciones! Primero incrementando su probabilidad de activación y luego el poder de su efecto una vez la probabilidad de activación es del 100%. En cambio, un anillo maldito debilitará los encantamientos, glifos y maldiciones.

items.rings.ringofelements.name=anillo de los elementos
items.rings.ringofelements.stats=Cuando se usa, este anillo proporciona _%s%%_ de resistencia elemental.
items.rings.ringofelements.typical_stats=Cuando se usa, este anillo normalmente proporcionaría _%s%%_ de resistencia elemental.
items.rings.ringofelements.combined_stats=Tus anillos equipados están combinando su poder, otorgando un _%s%%_ de resistencia elemental en total.
items.rings.ringofelements.upgrade_stat_name_1=Resistencia
items.rings.ringofelements.desc=Este anillo proporciona resistencia a la mayoría de los efectos mágicos y elementales, disminuyendo el daño y la duración de los efectos negativos. Naturalmente, un anillo maldito empeorará estos efectos.

items.rings.ringofenergy.name=anillo de energía
items.rings.ringofenergy.stats=Cuando se usa, este anillo incrementa la velocidad de carga de varitas, artefactos y armaduras heroicas en _%s%%._
items.rings.ringofenergy.typical_stats=Cuando se usa, este anillo normalmente incrementaría la velocidad de carga de varitas, artefactos y armaduras heroicas en _%s%%._
items.rings.ringofenergy.combined_stats=Tus anillos equipados están combinando su poder, aumentando tu velocidad de recarga un _%s%%_ en total.
items.rings.ringofenergy.upgrade_stat_name_1=Velocidad de Carga
items.rings.ringofenergy.desc=Tu equipamiento mágico se recargará más rápidamente en el campo arcano que irradia de este anillo. Un anillo maldito ralentizará la recarga.

items.rings.ringofevasion.name=anillo de evasión
items.rings.ringofevasion.stats=Cuando se usa, este anillo aumenta tu evasión en _%s%%._
items.rings.ringofevasion.typical_stats=Cuando se usa, este anillo normalmente aumentaría tu evasión en _%s%%._
items.rings.ringofevasion.combined_stats=Tus anillos equipados están combinando su poder, aumentando tu evasión un _%s%%_ en total.
items.rings.ringofevasion.upgrade_stat_name_1=Aumento de Evasión
items.rings.ringofevasion.desc=Este anillo acelera las reacciones del portador, haciéndolo más difícil de golpear. Un anillo maldito hará que el usuario sea más fácil de golpear.

items.rings.ringofforce.name=anillo de fuerza
items.rings.ringofforce.stats=Cuando estés desarmado, con tu fuerza actual, este anillo infligirá _%1$d-%2$d de daño._ Con un arma equipada, ese anillo incrementa el daño en _%3$d._
items.rings.ringofforce.typical_stats=Cuando estés desarmado, con tu fuerza actual, normalmente este anillo infligiría _%1$d-%2$d de daño._ Con un arma equipada, este anillo incrementaría el daño en _%3$d._
items.rings.ringofforce.combined_stats=Tus anillos equipados están combinando su poder, causando un total de _%1$d-%2$d de daño_ sin arma, o aumentando el daño en _%3$d_ con un arma equipada.
items.rings.ringofforce.upgrade_stat_name_1=Daño sin Arma
items.rings.ringofforce.upgrade_stat_name_2=Aumento de Daño con Arma
items.rings.ringofforce.upgrade_stat_name_3=Daño de Habilidad
items.rings.ringofforce.ability_name=postura de lucha
items.rings.ringofforce.typical_ability_desc=La Duelista adopta una _postura de lucha_ con este anillo, causando que sus ataques normales siempre usen el anillo incluso cuando llevas un arma equipada. Estos ataques normalmente causarían _%1$d-%2$d de daño_ y heredan el encantamiento y aumento del arma. Esta postura reduce la velocidad de recarga del arma un 50%%.
items.rings.ringofforce.ability_desc=La Duelista adopta una _postura de lucha_ con este anillo, causando que sus ataques normales siempre usen el anillo incluso cuando llevas un arma equipada. Estos ataques causan _%1$d-%2$d de daño_ y heredan el encantamiento y aumento del arma. Esta postura reduce la velocidad de recarga del arma un 50%%.
items.rings.ringofforce.desc=Este anillo aumenta la fuerza de los golpes cuerpo a cuerpo del usuario. Este poder adicional es bastante débil cuando se empuñan armas, pero un ataque sin armas se hará mucho más fuerte. Un anillo maldito en cambio debilitará los golpes del portador.
items.rings.ringofforce$brawlersstance.name=postura de lucha
items.rings.ringofforce$brawlersstance.desc=Mientras esté en esta postura los ataques normales de la Duelista usarán el anillo de fuerza equipado incluso cuando tenga un arma equipada. Estos ataques ganan daño adicional y usan el aumento y encantamiento del arma.\n\nSin embargo, mantener esta postura requiere concentrarse, lo que reduce la velocidad de recarga de la habilidad de arma un 50%.\n\nEsta postura puede activarse o desactivarse usando un anillo de fuerza, pero la reducción de velocidad de recarga persistirá por un tiempo si dichas acciones se hacen rápidamente.

items.rings.ringoffuror.name=anillo de furia
items.rings.ringoffuror.stats=Cuando se usa, este anillo aumenta la velocidad de tus ataques en _%s%%._
items.rings.ringoffuror.typical_stats=Cuando se usa, este anillo normalmente aumentaría la velocidad de tus ataques en _%s%%._
items.rings.ringoffuror.combined_stats=Tus anillos equipados están combinando su poder, aumentando la velocidad de tus ataques un _%s%%_ en total.
items.rings.ringoffuror.upgrade_stat_name_1=Aumento de Velocidad de Ataque
items.rings.ringoffuror.desc=Este anillo le otorga al portador una furia interna, permitiéndole atacar más rápidamente. Un anillo maldito en cambio reducirá la velocidad de ataque del portador.

items.rings.ringofhaste.name=anillo de velocidad
items.rings.ringofhaste.stats=Cuando se usa, este anillo aumenta tu velocidad de movimiento en _%s%%._
items.rings.ringofhaste.typical_stats=Cuando se usa, este anillo normalmente aumentaría tu velocidad de movimiento en _%s%%._
items.rings.ringofhaste.combined_stats=Tus anillos equipados están combinando su poder, aumentando tu velocidad de movimiento un _%s%%_ en total.
items.rings.ringofhaste.upgrade_stat_name_1=Aumento de Velocidad de Movimiento
items.rings.ringofhaste.desc=Este anillo reduce el esfuerzo de movimiento del usuario, permitiéndole correr a velocidades sobrehumanas. Un anillo maldito en cambio hará pesado al portador.

items.rings.ringofmight.name=anillo de poderío
items.rings.ringofmight.stats=Cuando se usa, este anillo aumenta tu fuerza en _%1$d_ y tus PS máximos en _%2$s%%._
items.rings.ringofmight.typical_stats=Cuando se usa, este anillo normalmente aumentaría tu fuerza en _%1$d_ y tus PS máximos en _%2$s%%._
items.rings.ringofmight.combined_stats=Tus anillos equipados están combinando su poder, aumentando tu fuerza en _%1$d_ y tus PS máximos un _%2$s%%_ en total.
items.rings.ringofmight.upgrade_stat_name_1=Aumento de Fuerza
items.rings.ringofmight.upgrade_stat_name_2=Aumento de PS Máximos
items.rings.ringofmight.desc=Este anillo incrementa los rasgos físicos del portador, otorgándole una mayor fuerza física y constitución. Un anillo maldito debilitará al portador.

items.rings.ringofsharpshooting.name=anillo del tirador
items.rings.ringofsharpshooting.stats=Cuando se usa, este anillo aumenta el daño de tus armas arrojadizas como si su nivel hubiera incrementado en _%1$d_ e incrementa su durabilidad en _%2$s%%._
items.rings.ringofsharpshooting.typical_stats=Cuando se usa, este anillo normalmente aumentaría el daño de tus armas arrojadizas como si su nivel hubiese incrementado en _%1$d_ e incrementaría su durabilidad en _%2$s%%._
items.rings.ringofsharpshooting.combined_stats=Tus anillos equipados están combinando su poder, potenciando el nivel efectivo de armas arrojadizas en _%1$d_ e incrementando su durabilidad un _%2$s%%_ en total.
items.rings.ringofsharpshooting.upgrade_stat_name_1=Nivel de Daño
items.rings.ringofsharpshooting.upgrade_stat_name_2=Aumento de Durabilidad
items.rings.ringofsharpshooting.desc=Este anillo mejora la precisión y la puntería del usuario, lo que hará que todas las armas arrojadizas sean más dañinas y duraderas. Un anillo maldito tendrá el efecto contrario.

items.rings.ringoftenacity.name=anillo de tenacidad
items.rings.ringoftenacity.stats=Cuando se usa, este anillo reduce el daño que sufras hasta un _%s%%._
items.rings.ringoftenacity.typical_stats=Cuando se usa, este anillo normalmente reduciría el daño que sufras hasta un _%s%%._
items.rings.ringoftenacity.combined_stats=Tus anillos equipados están combinando su poder, reduciendo el daño recibido hasta un _%s%%_ en total.
items.rings.ringoftenacity.upgrade_stat_name_1=Reducción de Daño
items.rings.ringoftenacity.desc=Cuando se usa, este anillo permitirá al usuario resistir golpes normalmente mortales. Cuanto más lesionado esté el portador, más resistente será al daño. Un anillo maldito facilitará a los enemigos ejecutar al usuario.

items.rings.ringofwealth.name=anillo de riqueza
items.rings.ringofwealth.stats=Cuando se usa, este anillo incrementa tu suerte en _%s%%._
items.rings.ringofwealth.typical_stats=Cuando se usa, este anillo normalmente incrementaría tu suerte en _%s%%._
items.rings.ringofwealth.combined_stats=Tus anillos equipados están combinando su poder, aumentando tu suerte un _%s%%_ en total.
items.rings.ringofwealth.upgrade_stat_name_1=Aumento de Suerte
items.rings.ringofwealth.desc=Este anillo actúa como un imán para el tesoro, lo que aumenta la probabilidad de que los enemigos y los contenedores tengan objetos valiosos. Un anillo maldito en cambio reducirá tus posibilidades de recibir el botín.



###scrolls
items.scrolls.scroll.ac_read=LEER
items.scrolls.scroll.kaunan=pergamino de KAUNAN
items.scrolls.scroll.sowilo=pergamino de SOWILO
items.scrolls.scroll.laguz=pergamino de LAGUZ
items.scrolls.scroll.yngvi=pergamino de YNGVI
items.scrolls.scroll.gyfu=pergamino de GYFU
items.scrolls.scroll.raido=pergamino de RAIDO
items.scrolls.scroll.isaz=pergamino de ISAZ
items.scrolls.scroll.mannaz=pergamino de MANNAZ
items.scrolls.scroll.naudiz=pergamino de NAUDIZ
items.scrolls.scroll.berkanan=pergamino de BERKANAN
items.scrolls.scroll.odal=pergamino de ODAL
items.scrolls.scroll.tiwaz=pergamino de TIWAZ
items.scrolls.scroll.unknown_desc=Una runa mágica indescifrable está escrita en este pergamino. ¿Quién sabe qué hará cuando se lea en voz alta?
items.scrolls.scroll.blinded=No puedes leer un pergamino estando cegado.
items.scrolls.scroll.no_magic=No puedes leer un pergamino mientras dure la magia de inmunidad.
items.scrolls.scroll.cursed=¡Tu libro de hechizos maldito te impide invocar la magia de este pergamino! Un pergamino de eliminar maldición podría ser lo suficientemente fuerte como para funcionar.
items.scrolls.scroll$placeholder.name=pergamino

items.scrolls.inventoryscroll.warning=¿Realmente quieres dejar de usar este pergamino? El pergamino no estaba identificado anteriormente por lo que se consumirá de todas formas.
items.scrolls.inventoryscroll.yes=Sí, estoy seguro.
items.scrolls.inventoryscroll.no=No, he cambiado de idea

items.scrolls.scrollofidentify.name=pergamino de identificación
items.scrolls.scrollofidentify.inv_title=Identificar un ítem
items.scrolls.scrollofidentify.it_is=Tu pergamino lo identifica, es un %s.
items.scrolls.scrollofidentify.desc=Este pergamino revela permanentemente todos los secretos de un solo ítem.

items.scrolls.scrolloflullaby.name=pergamino de canción de cuna
items.scrolls.scrolloflullaby.sooth=El pergamino emite una melodía tranquilizadora. Te sientes con mucho sueño.
items.scrolls.scrolloflullaby.desc=La lectura de este pergamino emite una melodía relajante que calmará a todos los que lo escuchen en un profundo sueño mágico. Para el lector y sus aliados el sueño es reparador.

items.scrolls.scrollofmagicmapping.name=pergamino de mapeo mágico
items.scrolls.scrollofmagicmapping.layout=Ahora eres consciente del mapeado del nivel.
items.scrolls.scrollofmagicmapping.desc=Cuando se lea este pergamino, se grabará en tu memoria una imagen de claridad cristalina, alertándote sobre el mapeado del nivel y revelando todos los secretos ocultos. Las ubicaciones de los ítems y criaturas seguirán siendo desconocidas.

items.scrolls.scrollofmirrorimage.name=pergamino de reflejo
items.scrolls.scrollofmirrorimage.copies=El pergamino forma reflejos de ti.
items.scrolls.scrollofmirrorimage.no_copies=El pergamino intenta crear reflejos de ti, pero no tienen donde ir.
items.scrolls.scrollofmirrorimage.desc=El encantamiento en este pergamino creará dos gemelos ilusorios del lector. Estos espejismos actúan como clones más débiles del lector y perseguirán a sus enemigos. Sin embargo, no tienen durabilidad y se desvanecerán al recibir daño.

items.scrolls.scrollofretribution.name=pergamino de retribución
items.scrolls.scrollofretribution.blast=Poderosa energía mágica emerge del el pergamino.
items.scrolls.scrollofretribution.desc=Este pergamino contiene energía destructiva que canaliza el sufrimiento del lector en una explosión de poder. Cuanto más débil sea el lector, más daño causará. Con muy poca salud, este pergamino puede matar a la mayoría de los enemigos al instante.\n\nSin embargo, usar el pergamino afecta al usuario, cegándolo y debilitándolo.

items.scrolls.scrollofrage.name=pergamino de furia
items.scrolls.scrollofrage.roar=¡El pergamino emite un rugido furioso que hace eco a lo largo de la mazmorra!
items.scrolls.scrollofrage.desc=Cuando se lea en voz alta, este pergamino desatará un gran rugido que atrae a todos los enemigos hacia el lector y enfurece a los que están cerca.

items.scrolls.scrollofrecharging.name=pergamino de recarga
items.scrolls.scrollofrecharging.surge=¡Una oleada de energía recorre tu cuerpo, vigorizando tus varitas!
items.scrolls.scrollofrecharging.desc=El poder mágico en bruto que se encuentra en este pergamino recargará todas las varitas del usuario a lo largo del tiempo cuando es liberado.

items.scrolls.scrollofremovecurse.name=pergamino de eliminar maldición
items.scrolls.scrollofremovecurse.inv_title=Purificar un ítem
items.scrolls.scrollofremovecurse.cleansed=¡Tu ítem brilla con una luz purificadora y una energía malévola se dispersa!
items.scrolls.scrollofremovecurse.not_cleansed=Tu ítem brilla con una luz purificadora, pero nada sucede.
items.scrolls.scrollofremovecurse.spirit=¡Tu pergamino libera al espíritu atormentado!
items.scrolls.scrollofremovecurse.desc=El encantamiento en este pergamino despojará instantáneamente cualquier maldición de un arma, anillo, varita, armadura o artefacto.

items.scrolls.scrollofteleportation.name=pergamino de teletransporte
items.scrolls.scrollofteleportation.tele=En un abrir y cerrar de ojos, fuiste teletransportado a otra ubicación del nivel.
items.scrolls.scrollofteleportation.no_tele=La magía de teletrasportación falla.
items.scrolls.scrollofteleportation.cant_reach=No puedes teletransportarte allí.
items.scrolls.scrollofteleportation.prompt=Escoge un lugar para teletransportarse
items.scrolls.scrollofteleportation.desc=El hechizo de este pergamino transporta instantáneamente al lector a una ubicación diferente en el nivel de la mazmorra. El pergamino prioriza las áreas a las que el lector no ha estado antes, aunque no es capaz de teletransportarse más allá de puertas cerradas o barricadas. Sin embargo, puede revelar puertas ocultas que conducen a nuevas áreas.

items.scrolls.scrollofterror.name=pergamino de terror
items.scrolls.scrollofterror.none=El pergamino emite un brillante resplandor de luz roja.
items.scrolls.scrollofterror.one=¡El pergamino emite una brillante luz roja y el %s huye!
items.scrolls.scrollofterror.many=¡El pergamino emite un brillante resplandor de luz roja y los monstruos huyen!
items.scrolls.scrollofterror.desc=Al leerse, este pergamino emitirá un destello de luz roja que abrumará de terror a todos los enemigos en tu campo de visión, los cuales huirán. Atacar a un enemigo que huye acortará el efecto.

items.scrolls.scrolloftransmutation.name=pergamino de transmutación
items.scrolls.scrolloftransmutation.inv_title=Transmuta un ítem
items.scrolls.scrolloftransmutation.nothing=No pasa nada interesante.
items.scrolls.scrolloftransmutation.morph=¡Tu ítem se transforma en algo diferente!
items.scrolls.scrolloftransmutation.desc=Este pergamino contiene poderosa magia de transmutación. Cuando se usa en un ítem elegible, lo transformará en un ítem diferente del mismo tipo. La magia incluso conservará mejoras, encantamientos y glifos. Pergaminos y pociones serán transmutados a sus equivalentes exóticos y viceversa.

items.scrolls.scrollofupgrade.name=pergamino de mejora
items.scrolls.scrollofupgrade.inv_title=Mejorar un ítem
items.scrolls.scrollofupgrade.weaken_curse=El pergamino de mejora debilita la maldición de tu ítem.
items.scrolls.scrollofupgrade.remove_curse=El pergamino de mejora limpia la maldición de tu ítem.
items.scrolls.scrollofupgrade.desc=Este pergamino solo mejorará un ítem. Las varitas aumentarán en poder y número de cargas, las armas y armaduras harán y bloquearán más daño, y los efectos de los anillos se intensificarán.\n\nIncluso puede debilitar y a veces disipar totalmente las maldiciones, aunque no es tan potente como un pergamino de eliminar maldición. Desafortunadamente, la magia de mejora también puede eliminar encantamientos o glifos en equipamiento de alto nivel.



###exotic scrolls
items.scrolls.exotic.exoticscroll.kaunan=pergamino exótico de KAUNAN
items.scrolls.exotic.exoticscroll.sowilo=pergamino exótico de SOWILO
items.scrolls.exotic.exoticscroll.laguz=pergamino exótico de LAGUZ
items.scrolls.exotic.exoticscroll.yngvi=pergamino exótico de YNGVI
items.scrolls.exotic.exoticscroll.gyfu=pergamino exótico de GYFU
items.scrolls.exotic.exoticscroll.raido=pergamino exótico de RAIDO
items.scrolls.exotic.exoticscroll.isaz=pergamino exótico de ISAZ
items.scrolls.exotic.exoticscroll.mannaz=pergamino exótico de MANNAZ
items.scrolls.exotic.exoticscroll.naudiz=pergamino exótico de NAUDIZ
items.scrolls.exotic.exoticscroll.berkanan=pergamino exótico de BERKANAN
items.scrolls.exotic.exoticscroll.odal=pergamino exótico de ODAL
items.scrolls.exotic.exoticscroll.tiwaz=pergamino exótico de TIWAZ
items.scrolls.exotic.exoticscroll.unknown_desc=Una resplandeciente runa mágica indescifrable está escrita en este pergamino negro. Parece extraño a esta tierra, ¿quién sabe qué hará cuando se lea en voz alta?

items.scrolls.exotic.scrollofsirenssong.name=pergamino de canto de sirena
items.scrolls.exotic.scrollofsirenssong.prompt=Elige un objetivo
items.scrolls.exotic.scrollofsirenssong.no_target=El pergamino se activa sin un objetivo.
items.scrolls.exotic.scrollofsirenssong.cancel=Debes elegir un objetivo.
items.scrolls.exotic.scrollofsirenssong.desc=Leer este pergamino emite una melodía seductora que cautivará a un enemigo objetivo, ¡convirtiéndolo permanentemente en un aliado! Otros enemigos que la escuchen serán encantados temporalmente.\n\nEnemigos particularmente fuertes pueden resistir el efecto cautivador y en su lugar, serán encantados.
items.scrolls.exotic.scrollofsirenssong$enthralled.name=cautivado
items.scrolls.exotic.scrollofsirenssong$enthralled.desc=Esta criatura ha sido embrujada por la magia del pergamino de canto de sirena.\n\nUn personaje cautivado es permanentemente tu aliado y luchará contra cualquier enemigo que encuentre.

items.scrolls.exotic.scrollofantimagic.name=pergamino de anti-magia
items.scrolls.exotic.scrollofantimagic.desc=El encantamiento en este pergamino te envolverá con un aura mágica que bloquea temporalmente todos los efectos mágicos, dañinos o útiles. Las habilidades de armadura heróica son lo suficientemente fuertes como para funcionar de todas formas.

items.scrolls.exotic.scrollofchallenge.name=pergamino de desafío
items.scrolls.exotic.scrollofchallenge.desc=Cuando se lea en voz alta, este pergamino desatará un gran rugido que atrae a los enemigos hacia el usuario y al mismo tiempo crea una pequeña arena a su alrededor.\n\nMientras el lector permanezca en esta arena, recibirá un 33% menos de daño de todas las fuentes (esto se aplica antes que otras formas de reducción de daño) y no perderá saciedad.\n\nEl tamaño de la arena se ajustará al área en la que se encuentre el lector. Será particularmente pequeña en algunas áreas de jefe.
items.scrolls.exotic.scrollofchallenge$challengearena.name=arena de desafío
items.scrolls.exotic.scrollofchallenge$challengearena.desc=Una arena mágica ha aparecido a tú alrededor, denotado por una niebla roja ondulante.\n\nMientras estés en la niebla, tu hambre no aumentará y recibirás un 33%% menos de daño de todas las fuentes. Si tienes otros efectos de reducción de daño (tales como armadura), estos se aplicarán después de la reducción del 33%%.\n\nTurnos restantes: %d.

items.scrolls.exotic.scrollofdivination.name=pergamino de adivinación
items.scrolls.exotic.scrollofdivination.nothing_left=¡No queda nada por identificar!
items.scrolls.exotic.scrollofdivination.desc=Este pergamino identificará aleatoriamente cuatro tipos de ítems que aún desconoces. Los ítems identificados pueden ser el color de una poción, la runa de un pergamino o la gema de un anillo. Los ítems identificados no serán necesariamente los que llevas.
items.scrolls.exotic.scrollofdivination$wnddivination.desc=Tu pergamino de adivinación ha identificado los siguientes ítems:

items.scrolls.exotic.scrollofdread.name=pergamino de pavor
items.scrolls.exotic.scrollofdread.desc=Al leerse, este pergamino emitirá un destello de luz roja que infundirá un terror increíble en todos los enemigos en tu campo de visión. ¡Tan grande es este efecto que rápidamente intentarán huir de la mazmorra para no volver a ser vistos jamás!\n\nAl igual que el terror, este efecto puede expirar con el tiempo o si el enemigo es atacado.\n\nLos enemigos de voluntad fuerte, como los jefes, recibirán en su lugar terror regular.

items.scrolls.exotic.scrollofenchantment.name=pergamino de encantamiento
items.scrolls.exotic.scrollofenchantment.inv_title=Encantar un ítem
items.scrolls.exotic.scrollofenchantment.weapon=Selecciona un encantamiento para aplicarlo a tu arma.
items.scrolls.exotic.scrollofenchantment.armor=Selecciona un glifo para aplicarlo a tu armadura.
items.scrolls.exotic.scrollofenchantment.cancel=cancelar
items.scrolls.exotic.scrollofenchantment.cancel_warn=Si cancelas, aún se consumirá tu pergamino de encantamiento, ¿estás seguro?
items.scrolls.exotic.scrollofenchantment.cancel_warn_yes=Sí, estoy seguro
items.scrolls.exotic.scrollofenchantment.cancel_warn_no=No, he cambiado de idea
items.scrolls.exotic.scrollofenchantment.desc=Este pergamino infundirá un arma o armadura con poderosa energía mágica. El lector incluso tiene cierto grado de control sobre qué magia será imbuida.

items.scrolls.exotic.scrollofforesight.name=pergamino de previsión
items.scrolls.exotic.scrollofforesight.desc=Después de leer este pergamino, los detalles del terreno cercano se transmitirán constantemente a la mente del lector con una claridad cristalina. Este efecto dura una cantidad considerable de tiempo y revelará todas las puertas o trampas ocultas, haciendo que buscar sea innecesario.

items.scrolls.exotic.scrollofmetamorphosis.name=pergamino de metamorfosis
items.scrolls.exotic.scrollofmetamorphosis.choose_desc=Elige un talento a transmutar.
items.scrolls.exotic.scrollofmetamorphosis.replace_desc=Elige un nuevo talento para reemplazar el talento a transmutar.
items.scrolls.exotic.scrollofmetamorphosis.metamorphose_talent=transmutar talento
items.scrolls.exotic.scrollofmetamorphosis.desc=Este pergamino contiene poderosa magia de transmutación, que se aplicará al lector en lugar de a un ítem. ¡La magia de este pergamino te permitirá seleccionar un talento y reemplazarlo por uno de cuatro talentos del mismo nivel de diferentes clases de héroes!\n\nEste efecto solo puede aplicarse a talentos de clase, no a talentos obtenidos por subclases o habilidades de armadura. Los talentos que no puedas usar no se darán como opciones.

items.scrolls.exotic.scrollofmysticalenergy.name=pergamino de energía mística
items.scrolls.exotic.scrollofmysticalenergy.desc=El poder mágico en bruto que se encuentra en este pergamino recargará, al ser liberado, los artefactos equipados del usuario a lo largo del tiempo.

items.scrolls.exotic.scrollofpassage.name=pergamino de pasaje
items.scrolls.exotic.scrollofpassage.desc=El hechizo en este pergamino transporta instantáneamente al lector al primer nivel de la región superior a este. Muy útil para llegar rápidamente a una tienda.

items.scrolls.exotic.scrollofprismaticimage.name=pergamino de imagen prismática
items.scrolls.exotic.scrollofprismaticimage.desc=El encantamiento en este pergamino creará un colorido e ilusorio gemelo del lector. Esta imagen prismática actúa como un clon más débil del lector, con una defensa similar pero con menor ps y daño.\n\nLa imagen prismática se mostrará cuando los enemigos estén presentes e intentará defender al lector.\n\nSi ya existe una imagen prismática, usar este pergamino la curará por completo.

items.scrolls.exotic.scrollofpsionicblast.name=pergamino de explosión psiónica
items.scrolls.exotic.scrollofpsionicblast.ondeath=La Explosión Psiónica destroza tu mente...
items.scrolls.exotic.scrollofpsionicblast.desc=Este pergamino contiene una increíble energía destructiva que se puede canalizar para destruir las mentes de todas las criaturas visibles.\n\nSin embargo, hay una retroalimentación significativa, y el lector también será dañado, cegado y debilitado. Cuantos más objetivos alcance el pergamino, menos daño será recibido.



###spells
items.spells.alchemize.name=alchemize
items.spells.alchemize.prompt=Convertir un ítem
items.spells.alchemize.desc=Este hechizo contiene poderes transmutativos similares a los que se encuentran en un caldero de alquimia. Cada uso permite al usuario convertir un ítem (o pila de ítems) en oro o energía alquímica. ¡Convertir pociones o pergaminos también los identificará!\n\nUnos pocos usos de Alchemize es vendido en tiendas, pero puede crearse una mayor cantidad mediante alquimia combinando una semilla, una piedra rúnica y un poco de energía alquímica.
items.spells.alchemize$wndalchemizeitem.sell=Convertir a %dg
items.spells.alchemize$wndalchemizeitem.sell_1=Convertir 1 a %dg
items.spells.alchemize$wndalchemizeitem.sell_all=Convertir todo a %dg
items.spells.alchemize$wndalchemizeitem.energize=Convertir a %d energía
items.spells.alchemize$wndalchemizeitem.energize_1=Convertir 1 a %d energía
items.spells.alchemize$wndalchemizeitem.energize_all=Convertir todo a %d energía

items.spells.beaconofreturning.name=baliza de retorno
items.spells.beaconofreturning.preventing=¡El fuerte aura mágico de este lugar te impide usar el hechizo!
items.spells.beaconofreturning.creatures=El aura Psíquica de las criaturas cercanas no te permite teletransportarte en este momento.
items.spells.beaconofreturning.set=La baliza se estableció en tu ubicación actual.
items.spells.beaconofreturning.wnd_body=La configuración anulará la ubicación en la que la baliza fue establecida previamente.\n\nAl regresar, volverás a tu última ubicación establecida y consumirá un uso del hechizo.
items.spells.beaconofreturning.wnd_set=Colocar
items.spells.beaconofreturning.wnd_return=Regresar
items.spells.beaconofreturning.desc_set=Esta baliza fue colocada en algún lugar en el piso %d.
items.spells.beaconofreturning.desc=Este hechizo intrincado otorga al usuario la capacidad de regresar a una ubicación establecida, independientemente de la distancia. El hechizo solo se consumirá al regresar, se puede establecer tantas veces como quieras, pero solo recordará la ubicación más reciente en la que se estableció.

items.spells.curseinfusion.name=infusión de maldición
items.spells.curseinfusion.inv_title=Maldecir un ítem
items.spells.curseinfusion.desc=Este hechizo infunde una pieza de equipamiento con la misma poderosa magia maligna que se encuentra dentro de DM-300. El ítem en el que es usado será maldecido inmediatamente, y cualquier encantamiento o glifo que pueda tener será anulado.\n\nEn el caso de armas, armaduras, y varitas, el ítem ganará mejoras además de ser maldecido. Las mejoras de Infusión malignas no se acumulan, y la mejora se perderá si la maldición es removida del ítem.\n\nVarias infusiones de maldición pueden ser usadas para cambiar la maldición en un arma o armadura.

items.spells.spell.ac_cast=ARROJAR
items.spells.spell.no_magic=No puedes lanzar hechizos mientras dure la magia de inmunidad.

items.spells.magicalinfusion.name=infusión mágica
items.spells.magicalinfusion.inv_title=Infundir un ítem
items.spells.magicalinfusion.infuse=¡Tu ítem es infundido con energía arcana!
items.spells.magicalinfusion.desc=Este hechizo posee el mismo poder mágico que un pergamino de mejora, pero en una forma más estable.\n\nAdemás de mejorar un ítem de manera normal, jamás borrará un encantamiento, glifo o maldición.

items.spells.magicalporter.name=portador mágico
items.spells.magicalporter.inv_title=Portar un ítem
items.spells.magicalporter.nowhere=No hay ningún lugar para que portes un ítem.
items.spells.magicalporter.desc=Este hechizo transportará mágicamente cualquier ítem del usuario. Sin embargo, a diferencia de la baliza de comerciante, los ítems serán transportados a la entrada del próximo piso del jefe.

items.spells.phaseshift.name=cambio de fase
items.spells.phaseshift.no_target=No hay nada para teletransportar ahí.
items.spells.phaseshift.desc=Este hechizo caótico teletransportará a cualquier personaje al que esté dirigido a una ubicación aleatoria en el nivel actual, y lo aturdirá por un tiempo considerable. Enemigos poderosos podrán resistir el efecto aturdidor. Este hechizo puede ser dirigido a un objetivo o al propio usuario.

items.spells.reclaimtrap.name=reclamar trampa
items.spells.reclaimtrap.no_trap=No hay una trampa allí.
items.spells.reclaimtrap.desc_trap=El hechizo está actualmente imbuido con una _%s_.
items.spells.reclaimtrap.desc=Este hechizo contiene los restos de la energía mecánica de DM-300. Cuando es lanzado en una trampa activa, el poder de la trampa será absorbida dentro del hechizo, permitiéndote desencadenar el efecto de la trampa en cualquier ubicación que escojas.\n\nSin embargo, algunas trampas puede que no funcionen en todos los lugares, y el hechizo solo puede almacenar una carga a la vez.

items.spells.recycle.name=reciclar
items.spells.recycle.inv_title=Reciclar un ítem
items.spells.recycle.recycled=Tu ítem fue reciclado en: %s.
items.spells.recycle.desc=Este hechizo contiene una forma menor de magia de transmutación. Si bien no funcionará en el equipamiento, este hechizo transformará un pergamino, una poción, una semilla, una piedra rúnica o un dardo reforzado en un ítem aleatorio del mismo tipo.

items.spells.summonelemental.name=invocar elemental
items.spells.summonelemental.ac_imbue=IMBUIR
items.spells.summonelemental.imbue_prompt=imbuir un ítem
items.spells.summonelemental.desc=¡Este hechizo canaliza la energía de las ascuas elementales que se usaron para crearse y te permitirá invocar a un elemental amistoso para que luche contigo! Solo se puede invocar un elemental a la vez, aunque el hechizo puede reutilizarse para regresar el elemental a ti sin ningún costo.
items.spells.summonelemental.desc_newborn=El hechizo no está imbuido actualmente e invocará a una _cría elemental_ sin ningún ataque a distancia. Puedes imbuir una poción de llama liquida, poción de escarcha, pergamino de recarga o pergamino de transmutación identificado para potenciar el hechizo, ¡causando que las próximas invocaciones sean un elemental con todo su poder!
items.spells.summonelemental.desc_fire=El hechizo se siente caliente al tacto, invocará a un _elemental de fuego_. Puedes imbuir un ítem diferente pero el hechizo perderá el actualmente imbuido.
items.spells.summonelemental.desc_frost=El hechizo se siente frío al tacto, invocará a un _elemental de hielo_. Puedes imbuir un ítem diferente pero el hechizo perderá el actualmente imbuido.
items.spells.summonelemental.desc_shock=El hechizo irradia energía estática, invocará a un _elemental eléctrico_. Puedes imbuir un ítem diferente pero el hechizo perderá el actualmente imbuido.
items.spells.summonelemental.desc_chaos=El hechizo irradia energía caótica, invocará a un _elemental del caos_. Puedes imbuir un ítem diferente pero el hechizo perderá el actualmente imbuido.

items.spells.targetedspell.prompt=Elige un objetivo
items.spells.targetedspell.inv_title=Infundir un ítem

items.spells.telekineticgrab.name=agarre telequinético
items.spells.telekineticgrab.cant_grab=No puedes agarrar eso.
items.spells.telekineticgrab.no_target=No hay nada para recoger ahí.
items.spells.telekineticgrab.desc=¡Este hechizo permite al usuario agarrar de forma remota todos los ítems del suelo o todas las arma arrojadizas que estén clavadas a un enemigo!\n\nNo se puede usar para agarrar ítems que alguien posee o para agarrar contenedores como cofres.

items.spells.unstablespell.name=hechizo inestable
items.spells.unstablespell.desc=Este pequeño cristal cúbico negro tiene símbolos rúnicos movedizos en cada una de sus superficies.\n\nCuando se activa, provoca el efecto de un pergamino aleatorio. El efecto del pergamino siempre estará enfocado al combate si hay enemigos en tu campo de visión, y no estará enfocado al combate en caso contrario.

items.spells.wildenergy.name=energía salvaje
items.spells.wildenergy.desc=Este hechizo contiene algo de la energía maldita que impulsó a DM-300. Cuando se lance, recargará tus varitas y artefactos desgastados, a la vez que activará un efecto de varita maldita al azar. Sin embargo, puedes elegir una dirección para disparar esta magia maldita.


###runestones
items.stones.inventorystone.ac_use=USAR

items.stones.runestone$placeholder.name=piedra rúnica

items.stones.stoneofaggression.name=piedra de agresión
items.stones.stoneofaggression.desc=Cuando esta piedra es lanzada a un aliado o enemigo, todos los enemigos cercanos serán forzados a atacar a ese personaje durante un corto tiempo.\n\nCuando se usa en enemigos, la magia solo durará unos pocos turnos, pero cuando se usa en ti o en aliados durará significativamente más tiempo.
items.stones.stoneofaggression$aggression.name=agresión
items.stones.stoneofaggression$aggression.desc=Magia manipuladora está forzando a todos los enemigos cercanos a atacar a este personaje.\n\nTurnos restantes: %s.

items.stones.stoneofaugmentation.name=piedra de aumentación
items.stones.stoneofaugmentation.inv_title=Aumentar un ítem
items.stones.stoneofaugmentation.desc=Esta piedra rúnica posee magia potente que puede aumentar el equipamiento para mejorar una propiedad a costa de otra.\n\nUsarla en un arma te permitirá mejorar la velocidad o el daño.\n\nUsarla en una armadura te permitirá mejorar la defensa o la evasión.
items.stones.stoneofaugmentation$wndaugment.choice=¿Qué te gustaría mejorar?
items.stones.stoneofaugmentation$wndaugment.speed=Velocidad
items.stones.stoneofaugmentation$wndaugment.damage=Daño
items.stones.stoneofaugmentation$wndaugment.evasion=Evasión
items.stones.stoneofaugmentation$wndaugment.defense=Defensa
items.stones.stoneofaugmentation$wndaugment.none=Eliminar Aumentación
items.stones.stoneofaugmentation$wndaugment.cancel=Olvídalo

items.stones.stoneofblast.name=piedra explosiva
items.stones.stoneofblast.desc=Esta piedra rúnica explotará instantáneamente en el lugar al que es arrojada. Al igual que una bomba, la explosión dañará cualquier cosa cercana.

items.stones.stoneofblink.name=piedra de destello
items.stones.stoneofblink.desc=Esta piedra rúnica teletransportará al usuario a la ubicación arrojada.

items.stones.stoneofclairvoyance.name=piedra de clarividencia
items.stones.stoneofclairvoyance.desc=Esta piedra revelará instantáneamente todas las casillas en un área muy amplia alrededor de donde se arroja. Su efecto incluso llegará a través de las paredes.

items.stones.stoneofdeepsleep.name=piedra de sueño profundo
items.stones.stoneofdeepsleep.desc=Cuando esta piedra es arrojada a un enemigo, lo pondrá en un mágico sueño profundo. Enemigos dormidos mágicamente dormirán por siempre hasta que sean interrumpidos.

items.stones.stoneofdisarming.name=piedra de desarme
items.stones.stoneofdisarming.desc=Esta piedra rúnica contiene magia que puede deshabilitar las trampas maliciosas ocultas en la mazmorra. Desarmará hasta 9 trampas alrededor del área en la que se lanza.

items.stones.stoneofenchantment.name=piedra de encantamiento
items.stones.stoneofenchantment.inv_title=Encantar un ítem
items.stones.stoneofenchantment.weapon=¡Tu arma resplandece en la oscuridad!
items.stones.stoneofenchantment.armor=¡Tu armadura resplandece en la oscuridad!
items.stones.stoneofenchantment.desc=Esta piedra rúnica posee magia encantadora. A diferencia de un pergamino de mejora, no aumentará directamente la potencia de un ítem, sino que imbuirá un arma o armadura con un encantamiento, otorgándole un nuevo poder.

items.stones.stoneoffear.name=piedra de terror
items.stones.stoneoffear.desc=Cuando esta piedra es arrojada sobre un personaje, este será abrumado por el terror y huirá. Atacar a un personaje que huye acortará el efecto.

items.stones.stoneofflock.name=piedra de rebaño
items.stones.stoneofflock.desc=Esta piedra rúnica invoca ovejas mágicas por un corto tiempo alrededor de la ubicación a la que se arroja.

items.stones.stoneofintuition.name=piedra de intuición
items.stones.stoneofintuition.inv_title=Selecciona un ítem
items.stones.stoneofintuition.desc=Esta piedra rúnica contiene una versión más débil de la magia que se encuentra en los pergaminos de identificación. En lugar de identificar directamente un ítem, funcionará con tu intuición, lo que te permite intentar identificar el tipo de poción, pergamino o anillo adivinando.
items.stones.stoneofintuition.break_info=Puedes usar piedras de intuición dos veces antes de que una se rompa, _tu siguiente uso no consumirá esta piedra_.
items.stones.stoneofintuition.break_warn=Has utilizado una piedra de intuición anteriormente, por lo que _tu próximo uso consumirá una piedra_.
items.stones.stoneofintuition$wndguess.text=Adivina cuál es el tipo del ítem no identificado. Si adivinas correctamente, ¡el ítem será identificado!
items.stones.stoneofintuition$wndguess.correct=Correcto. ¡El tipo del ítem ha sido identificado!
items.stones.stoneofintuition$wndguess.incorrect=Tu respuesta fue incorrecta.
items.stones.stoneofintuition$wndguess.break=Tu piedra de la intuición se hace polvo...

items.stones.stoneofshock.name=piedra de electricidad
items.stones.stoneofshock.desc=Esta piedra rúnica libera una explosión de energía eléctrica que aturde brevemente a todos los objetivos cercanos y concede al arrojador recarga de varitas por cada objetivo golpeado.


###trinkets
items.trinkets.chaoticcenser.name=incensario caótico
items.trinkets.chaoticcenser.desc=¡Tras un tiempo en el caldero de alquimia, este incensario parece producir humo por sí solo! Estos gases se acumulan y salen del incensario en direcciones aleatorias y en intervalos semialeatorios. Parece capaz de producir todo tipo de gases, pero al menos parece más probable que la posición en la que salen disparados sea favorable para ti.
items.trinkets.chaoticcenser.typical_stats_desc=Típicamente este ornamento genera un gas dañino cercano aproximadamente cada _%d_ turnos. El gas es más propenso a aparecer cuando hay enemigos presentes y menos propenso a aparecer en espacios cerrados. A niveles más altos, estos gases tienen más probabilidades de ser exóticos y potentes.
items.trinkets.chaoticcenser.stats_desc=En su nivel actual este ornamento generará un gas dañino cercano aproximadamente cada _%d_ turnos. El gas es más propenso a aparecer cuando hay enemigos presentes y menos propenso a aparecer en espacios cerrados. A niveles más altos, estos gases tienen más probabilidades de ser exóticos y potentes.

items.trinkets.dimensionalsundial.name=reloj de sol dimensional
items.trinkets.dimensionalsundial.warning=Tu reloj de sol no proyecta ninguna sombra, te sientes inquieto.
items.trinkets.dimensionalsundial.desc=Este pequeño reloj de sol portátil es capaz de proyectar una sombra en las profundidades de la mazmorra, incluso cuando no lo sostienes derecho. Y lo que es aún más extraño, la posición de la sombra no parece tener relación con el sol en este mundo. Cuando no se proyecta ninguna sombra, el reloj de sol parece atraer al peligro.
items.trinkets.dimensionalsundial.typical_stats_desc=Típicamente este ornamento reduce la generación de enemigos en _%1$d%%_ durante el día en la vida real (8am-8pm), y aumenta la generación de enemigos en _%2$d%%_ cuando es de noche (8pm--8am).
items.trinkets.dimensionalsundial.stats_desc=En su nivel actual, este ornamento reducirá la generación de enemigos en _%1$d%%_ durante el día en la vida real (8am-8pm), y aumentará la generación de enemigos en _%2$d%%_ cuando es de noche (8pm--8am).

items.trinkets.exoticcrystals.name=cristales exóticos
items.trinkets.exoticcrystals.desc=Estos pequeños cristales rosa tienen la misma forma que los cristales de energía alquímica. Aunque no se pueden usar para obtener energía directamente, parece que influyen de algún modo en las pociones y pergaminos que encuentras.
items.trinkets.exoticcrystals.typical_stats_desc=Típicamente este ornamento sustituye el _%s%%_ de pociones y pergaminos con su equivalente exótico. Esto no afecta pociones de fuerza, pergaminos de mejora o ítems generados para solucionar habitaciones con peligros.
items.trinkets.exoticcrystals.stats_desc=En su nivel actual este ornamento sustituirá el _%s%%_ de pociones y pergaminos con su equivalente exótico. Esto no afecta pociones de fuerza, pergaminos de mejora o ítems generados para solucionar habitaciones con peligros.

items.trinkets.eyeofnewt.name=ojo de tritón
items.trinkets.eyeofnewt.desc=Este ojo de tritón dorado y negro es un ingrediente común, ahora potenciado en forma de ornamento. El ojo parece reducir tu visión a cambio de permitirte ver las cosas de otras maneras.
items.trinkets.eyeofnewt.typical_stats_desc=Típicamente este ornamento reduce tu rango de visión en _%1$s%%_, pero también te otorga visión mental sobre los enemigos dentro de un rango de _%2$d_ casillas.
items.trinkets.eyeofnewt.stats_desc=En su nivel actual este ornamento reducirá tu rango de visión en _%1$s%%_, pero también te otorgará visión mental sobre los enemigos dentro de un rango de _%2$d_ casillas.

items.trinkets.mimictooth.name=diente de mímico
items.trinkets.mimictooth.desc=Este gran diente afilado debe haber sido arrancado de un mímico poco contento. Parece estar influyendo a los mímicos de la mazmorra, haciéndolos más frecuentes y peligrosos.
items.trinkets.mimictooth.typical_stats_desc=Típicamente este ornamento hace que todos los tipos de mímico sean _%1$s veces_ más frecuentes y mucho más difíciles de detectar, pero aumenta la cantidad de botín que contienen. Cada nivel de la mazmorra también tiene un _%2$s%%_ de posibilidades de contener un sigiloso mímico de ébano.
items.trinkets.mimictooth.stats_desc=En su nivel actual este ornamento hará que todos los tipos de mímico sean _%1$s veces_ más frecuentes y mucho más difíciles de detectar, pero aumenta la cantidad de botín que contienen. Cada nivel de la mazmorra también tendrá un _%2$s%%_ de posibilidades de contener un sigiloso mímico de ébano.

items.trinkets.mossyclump.name=terrón musgoso
items.trinkets.mossyclump.desc=Este terrón de musgo empapado parece aferrarse a su humedad por más que lo exprimas. Parece estar ligado mágicamente a la propia mazmorra, haciendo que la hierba y el agua aparezcan con mayor frecuencia.
items.trinkets.mossyclump.typical_stats_desc=Típicamente este ornamento hace que el _%d%%_ de los niveles regulares de la mazmorra se llenen de agua o hierba.\n\nEste ornamento cuesta una enorme cantidad de energía para ser mejorado.
items.trinkets.mossyclump.stats_desc=En su nivel actual este ornamento hará que el _%d%%_ de los niveles regulares de la mazmorra se llenen de agua o hierba.\n\nEste ornamento cuesta una enorme cantidad de energía para ser mejorado.

items.trinkets.parchmentscrap.name=trozo de manuscrito
items.trinkets.parchmentscrap.desc=Este pequeño trozo de papel parece provenir de un manuscrito. Ha conservado parte de su magia y parece influir en las armas y armaduras que se encuentran en la mazmorra.
items.trinkets.parchmentscrap.typical_stats_desc=Típicamente este ornamento incrementa la frecuencia de encantamientos y glifos _x%d_, y maldiciones en armas y armaduras _x%s_. Las maldiciones en varitas, anillos o artefactos no se ven afectadas.\n\nEste ornamento cuesta una cantidad moderadamente grande de energía para ser mejorado.
items.trinkets.parchmentscrap.stats_desc=En su nivel actual este ornamento incrementará la frecuencia de encantamientos y glifos _x%d_, y maldiciones en armas y armaduras _x%s_. Las maldiciones en varitas, anillos o artefactos no se ven afectadas.\n\nEste ornamento cuesta una cantidad moderadamente grande de energía para ser mejorado.

items.trinkets.petrifiedseed.name=semilla petrificada
items.trinkets.petrifiedseed.desc=Esta semilla ha sido fosilizada, ya sea por lentos procesos geológicos o por arte de magia. La semilla parece influir mágicamente en la flora de la mazmorra, sustituyendo ocasionalmente las semillas de las plantas por piedras rúnicas.
items.trinkets.petrifiedseed.typical_stats_desc=Típicamente este ornamento hace que la hierba pisoteada deje caer piedras rúnicas en vez de semillas un _%1$s%%_ de las veces y también hace que la hierba alta genere ítems un _%2$s%%_ más a menudo.
items.trinkets.petrifiedseed.stats_desc=En su nivel actual este ornamento hará que la hierba pisoteada deje caer piedras rúnicas en vez de semillas un _%1$s%%_ de las veces y también hará que la hierba alta genere ítems un _%2$s%%_ más a menudo.

items.trinkets.ratskull.name=cráneo de rata
items.trinkets.ratskull.desc=Este macabro ornamento no es mucho más grande que el cráneo de una rata normal, lo que es una rareza en esta mazmorra. La influencia mágica del cráneo parece atraer a los habitantes más raros de la mazmorra, haciendo que aparezcan con más frecuencia.
items.trinkets.ratskull.typical_stats_desc=Típicamente este ornamento hace que los raros enemigos exóticos tengan _%d veces_ más probabilidades de aparecer. Sin embargo, el cráneo solo es la mitad de eficaz en atraer mímicos de cristal y estatuas blindadas.
items.trinkets.ratskull.stats_desc=En su nivel actual este ornamento hará que los raros enemigos exóticos tengan _%d veces_ más probabilidades de aparecer. Sin embargo, el cráneo solo es la mitad de eficaz en atraer mímicos de cristal y estatuas blindadas.

items.trinkets.saltcube.name=cubo de sal
items.trinkets.saltcube.desc=Este enorme cristal de sal fue cortado en forma de cubo casi perfecto, y de alguna forma consiguió drenar la mitad del agua del caldero de alquimia en lugar de disolverse. Parece que deshidrata y conserva mágicamente los alimentos que consumes, prolongando la saciedad que obtienes, pero también disminuye la velocidad de regeneración de salud cuando no estás famélico.
items.trinkets.saltcube.typical_stats_desc=Típicamente este ornamento incrementaría el tiempo que tardas en padecer hambre en un _%1$s%%_, pero también reduce tu velocidad de regeneración de salud en un _%2$s%%_.
items.trinkets.saltcube.stats_desc=En su nivel actual este ornamento incrementa el tiempo que tardas en padecer hambre en un _%1$s%%_, pero también reduce tu velocidad de regeneración de salud en un _%2$s%%_.

items.trinkets.shardofoblivion.name=fragmento del olvido
items.trinkets.shardofoblivion.desc=Tras cocerse en el caldero de alquimia, este pequeño fragmento de metal maldito ha cambiado y ahora está hecho de... ¿nada? La luz parece desviarse a su alrededor, y flota en el aire cuando no lo sostienes. El fragmento parece estar obteniendo poder de tu ignorancia, así que probablemente lo mejor sea no pensar demasiado en ello.
items.trinkets.shardofoblivion.typical_stats_desc=Típicamente este ornamento incrementaría la frecuencia con la que enemigos dejan botín en un 20%% por cada ítem no identificado que tengas equipado o hayas usado recientemente, hasta un máximo de _%d ítem(s)_. El fragmento también te impedirá identificar automáticamente el equipamiento, pero puede utilizarse para identificar manualmente los ítems que estén listos para ello.
items.trinkets.shardofoblivion.stats_desc=En su nivel actual este ornamento incrementa la frecuencia con la que enemigos dejan botín en un 20%% por cada ítem no identificado que tengas equipado o hayas usado recientemente, hasta un máximo de _%d ítem(s)_. El fragmento también te impedirá identificar automáticamente el equipamiento, pero puede utilizarse para identificar manualmente los ítems que estén listos para ello.
items.trinkets.shardofoblivion.ac_identify=IDENTIFICAR
items.trinkets.shardofoblivion.identify_prompt=Identifica un ítem
items.trinkets.shardofoblivion.identify_ready=Un ítem está listo para ser identificado: %s.
items.trinkets.shardofoblivion.identify_not_yet=Ese ítem aún no está listo para ser identificado.
items.trinkets.shardofoblivion.identify=¡Has identificado el ítem!
items.trinkets.shardofoblivion$wandusetracker.name=Varita sin Identificar Usada
items.trinkets.shardofoblivion$wandusetracker.desc=Has usado recientemente una varita no identificada, lo que cuenta como una pieza de equipamiento sin identificar usada para el fragmento del olvido por un corto tiempo.\n\nTurnos restantes: %s

items.trinkets.thirteenleafclover.name=trébol de trece hojas
items.trinkets.thirteenleafclover.desc=Por alguna razón, al cocerlo en el caldero de alquimia, ¡a este trébol le han crecido un montón de hojas de más! No está del todo claro si este ornamento da suerte o mala suerte, ¿quizás este ornamento haga que tu suerte sea más caótica?
items.trinkets.thirteenleafclover.typical_stats_desc=Normalmente, cuando el héroe causa daño, los números más cercanos a la media son más comunes. Típicamente este ornamento tiene un _%d%%_ de probabilidades de invertir esta tendencia, haciendo que tus ataques causen el daño máximo o mínimo más frecuentemente.. \n\nEste ornamento cuesta relativamente poca energía para ser mejorado.
items.trinkets.thirteenleafclover.stats_desc=Normalmente, cuando el héroe causa daño, los números más cercanos a la media son más comunes. En su nivel actual, este ornamento tendrá un _%d%%_ de probabilidades de invertir esta tendencia, haciendo que tus ataques causen el daño máximo o mínimo más frecuentemente.. \n\nEste ornamento cuesta relativamente poca energía para ser mejorado.

items.trinkets.trapmechanism.name=mecanismo de trampa
items.trinkets.trapmechanism.desc=El mecanismo principal de una de las trampas de caída de la mazmorra, extraído cuidadosamente del suelo para que pueda ser transportado. Parece estar ligado mágicamente a la mazmorra, haciendo que el terreno sea más peligroso para ti y para los habitantes de la mazmorra.
items.trinkets.trapmechanism.typical_stats_desc=Típicamente este ornamento hace que el _%d%%_ de los niveles regulares de la mazmorra se llenen de trampas o fosas.\n\nEste ornamento cuesta relativamente poca energía para ser mejorado.
items.trinkets.trapmechanism.stats_desc=En su nivel actual este ornamento hará que el _%d%%_ de los niveles regulares de la mazmorra se llenen de trampas o fosas.\n\nEste ornamento cuesta relativamente poca energía para ser mejorado.

items.trinkets.vialofblood.name=vial de sangre
items.trinkets.vialofblood.desc=Este delgado vial contiene la sangre de algún morador de la mazmorra, se mueve lentamente cuando giras el vial. Parece potenciar mágicamente los efectos curativos más fuertes, pero también los ralentiza.
items.trinkets.vialofblood.typical_stats_desc=Típicamente este ornamento incrementaría la cantidad general de curación que recibes al beber una poción de curación. del odre de agua o de un pozo de vitalidad en _%1$s%%_. Sin embargo, estos efectos curativos ocurren más lento, regenerando un máximo de _%2$s_ PS por turno (esto escala con el nivel del héroe).
items.trinkets.vialofblood.stats_desc=En su nivel actual este ornamento incrementa la cantidad general de curación que recibes al beber una poción de curación. del odre de agua o de un pozo de vitalidad en _%1$s%%_. Sin embargo, estos efectos curativos ocurren más lento, regenerando un máximo de _%2$s_ PS por turno (esto escala con el nivel del héroe).

items.trinkets.wondrousresin.name=resina prodigiosa
items.trinkets.wondrousresin.desc=Esta resina azul brillante parece tener la esencia destilada de la magia de una varita maldita. La magia del caldero de alquimia parece haberla estabilizado un poco y ahora afecta a tus varitas.
items.trinkets.wondrousresin.typical_stats_desc=Típicamente este ornamento hace que los efectos de las varitas malditas sean neutros o positivos un _%1$s%%_ de las veces, y hace que las varitas no malditas disparen una descarga maldita neutra o positiva adicional un _%2$s%%_ de las veces.\n\nEste ornamento cuesta una cantidad moderadamente grande de energía para ser mejorado.
items.trinkets.wondrousresin.stats_desc=En su nivel actual, este ornamento hará que los efectos de las varitas malditas sean neutros o positivos un _%1$s%%_ de las veces, y hará que las varitas no malditas disparen una descarga maldita neutra o positiva adicional un _%2$s%%_ de las veces.\n\nEste ornamento cuesta una cantidad moderadamente grande de energía para ser mejorado.

items.trinkets.trinketcatalyst.name=catalizador mágico
items.trinkets.trinketcatalyst.window_text=El agua empieza a brillar cuando añades el catalizador. Hay algunos ítems cercanos que puedes imbuir con energía para convertirlos en un ornamento mágico.
items.trinkets.trinketcatalyst.desc=Esta bola de polvo dorado mágico resplandece en la oscuridad de la mazmorra. Este catalizador se puede usar en un caldero de alquimia con un poco de energía alquímica para producir un ornamento único.\n\nLos ornamentos proporcionan distintos efectos que alteran ligeramente la mazmorra o a sus habitantes. Los ornamentos se pueden mejorar con energía para que su efecto sea más potente, o se pueden desechar para que no tengan efecto alguno.
items.trinkets.trinketcatalyst$randomtrinket.name=ornamento aleatorio
items.trinkets.trinketcatalyst$randomtrinket.desc=Un ítem está atascado dentro de una bolsa que no puedes abrir.\n\nEl proceso alquímico disolverá la bolsa, ¡pero no sabrás qué ornamento obtendrás hasta que lo hagas!

items.trinkets.trinket$placeholder.name=ornamento

###wands
items.wands.cursedwand.ondeath=Fuiste asesinado por tu propia %s.
items.wands.cursedwand.nothing=No ocurre nada.
items.wands.cursedwand.mass_invuln=¡Una luz brillante emerge de tu varita!
items.wands.cursedwand.petrify=¡De repente te congelas en el acto!
items.wands.cursedwand.grass=¡La hierba crece a tu alrededor!
items.wands.cursedwand.fire=Hueles a quemado...
items.wands.cursedwand.transmogrify_wand=¡Tu varita se transforma en un ítem diferente!
items.wands.cursedwand.transmogrify_other=¡Tu ítem se transforma en algo diferente!
items.wands.cursedwand.disguise=¡Tu aspecto cambia ante tus propios ojos!
items.wands.cursedwand.supernova=Una bola ardiente de energía empieza a crecer. ¡Será mejor que empieces a correr!
items.wands.cursedwand.supernova_positive=Una bola ardiente de energía comienza a crecer, pero de alguna manera no sientes peligro.
items.wands.cursedwand.sinkhole=¡El suelo comienza a ceder a tu alrededor!
items.wands.cursedwand.sinkhole_positive=El suelo comienza a ceder, pero se siente lo bastante sólido debajo de ti.
items.wands.cursedwand.gravity=¡De repente, la gravedad empieza a empujar en todas direcciones!
items.wands.cursedwand.gravity_positive=La gravedad empieza a empujar en todas direcciones, pero esto no parece afectarte.
items.wands.cursedwand.gravity_end=El caos gravitacional finaliza.

items.wands.damagewand.upgrade_stat_name_1=Daño Mágico

items.wands.wand.ac_zap=SACUDIR
items.wands.wand.fizzles=Tu varita chisporrotea; no debe tener energía suficiente.
items.wands.wand.no_magic=Tu varita chisporrotea; no puedes usar varitas a causa de la magia de inmunidad.
items.wands.wand.self_target=¡No puedes apuntarte a ti mismo!
items.wands.wand.identify=Te has familiarizado lo suficiente con tu varita como para identificarla.
items.wands.wand.resin_one=Esta varita ha ganado _1 nivel_ con resina arcana.
items.wands.wand.resin_many=Esta varita ha ganado _%d niveles_ con resina arcana.
items.wands.wand.cursed=Esta varita está maldita, haciendo su magia caótica y aleatoria.
items.wands.wand.not_cursed=Esta varita está libre de energía maligna.
items.wands.wand.curse_discover=¡Esta %s está maldita!
items.wands.wand.prompt=Elige una dirección para disparar.
items.wands.wand$placeholder.name=varita

items.wands.wandofblastwave.name=varita de onda expansiva
items.wands.wandofblastwave.staff_name=bastón de onda explosiva
items.wands.wandofblastwave.ondeath=Te has suicidado con tu propia Varita de Onda Expansiva...
items.wands.wandofblastwave.desc=Esta varita está hecha de una especie de piedra de mármol, con adornos dorados y una gema negra redonda en la punta. Se siente muy pesada en tu mano.
items.wands.wandofblastwave.typical_stats_desc=Esta varita dispara un rayo que detona violentamente en un lugar específico. La fuerza de esta explosión normalmente inflige _%1$d-%2$d de daño_ y es lo suficientemente fuerte para lanzar a la mayoría de los enemigos volando.
items.wands.wandofblastwave.stats_desc=Esta varita dispara un rayo que detona violentamente en un lugar específico. La fuerza de esta explosión inflige _%1$d-%2$d de daño_ y es lo suficientemente fuerte para lanzar a la mayoría de los enemigos volando.
items.wands.wandofblastwave.upgrade_stat_name_2=Empuje
items.wands.wandofblastwave.bmage_desc=Cuando el _Mago de batalla_ golpea a un enemigo con un bastón de onda explosiva, hay una probabilidad de que sea empujado hacia atrás, como si el bastón tuviera el encantamiento de elasticidad.
items.wands.wandofblastwave.eleblast_desc=Una explosión elemental con un bastón de onda expansiva inflige un 67% de daño y empuja a todos los enemigos fuera del área de la explosión.

items.wands.wandofcorrosion.name=varita de corrosión
items.wands.wandofcorrosion.staff_name=bastón de corrosión
items.wands.wandofcorrosion.desc=Esta varita tiene un cuerpo ceniciento que se abre en una gema naranja brillante.
items.wands.wandofcorrosion.stats_desc=Esta varita dispara un rayo que explota en una nube de gas altamente corrosivo en el lugar seleccionado. Todo lo que sea atrapado por esta nube recibirá daño incremental con el tiempo. Empezando por _%d de daño._
items.wands.wandofcorrosion.upgrade_stat_name_1=Daño de Corrosión
items.wands.wandofcorrosion.upgrade_stat_name_2=Volumen del Gas
items.wands.wandofcorrosion.bmage_desc=Cuando el _Mago de batalla_ golpea con un bastón de corrosión, el enemigo tiene una posibilidad de sufrir cieno cáustico.
items.wands.wandofcorrosion.eleblast_desc=Una explosión elemental con un bastón de corrosión inflige a los enemigos 4 turnos de corrosión, comenzando con 6 de daño.

items.wands.wandofcorruption.name=varita de corrupción
items.wands.wandofcorruption.staff_name=bastón de corrupción
items.wands.wandofcorruption.already_corrupted=Ese personaje no puede ser corrompido aún más.
items.wands.wandofcorruption.desc=Esta varita irradia energía oscura caótica, si no fuera suficientemente obvio por la pequeña calavera decorativa en su extremo.
items.wands.wandofcorruption.stats_desc=Esta varita lanzará una ráfaga de energía corrupta que debilitará a los enemigos y eventualmente los corromperá a tu voluntad. Los enemigos pueden resistir la corrupción, pero los enemigos debilitados son mucho más fáciles de corromper que los sanos.
items.wands.wandofcorruption.upgrade_stat_name_1=Poder de Corrupción
items.wands.wandofcorruption.upgrade_stat_name_2=Duración de Debilitación
items.wands.wandofcorruption.bmage_desc=Cuando el _Mago de batalla_ golpea con un bastón de corrupción, el enemigo tiene una probabilidad de sufrir locura.
items.wands.wandofcorruption.eleblast_desc=Una explosión elemental con un bastón de corrupción inflige a los enemigos 5 turnos de locura.

items.wands.wandofdisintegration.name=varita de desintegración
items.wands.wandofdisintegration.staff_name=bastón de desintegración
items.wands.wandofdisintegration.desc=Esta varita está hecha de un sólido y suave trozo de obsidiana, con una luz de color púrpura oscuro que corre por sus costados, terminando en la punta. Brilla con energía destructiva, esperando para disparar.
items.wands.wandofdisintegration.stats_desc=Esta varita dispara un láser que atraviesa cualquier obstáculo e irá más lejos cuanto más sea mejorada. El láser inflige _%1$d-%2$d de daño_ y también infligirá daño adicional por cada enemigo y pared que penetre.
items.wands.wandofdisintegration.upgrade_stat_name_2=Alcance Máximo
items.wands.wandofdisintegration.bmage_desc=Mientras el _Mago de batalla_ lo lleve equipado, el bastón de desintegración tiene un rango de ataque incrementado, como si tuviera el encantamiento de proyección.
items.wands.wandofdisintegration.eleblast_desc=Una explosión elemental con un bastón de desintegración inflige un 100% de daño y atraviesa las paredes.

items.wands.wandoffireblast.name=varita de explosión de fuego
items.wands.wandoffireblast.staff_name=bastón de explosión de fuego
items.wands.wandoffireblast.desc=Esta varita está hecha de madera roja laqueada con hojas doradas usadas deliberadamente para hacerla ver más regia. Crepita y sisea en el extremo, ansiosa de liberar su poderosa magia.
items.wands.wandoffireblast.stats_desc=Esta varita dispara un cono de fuego al usarse. Su siguiente disparo consumirá _%1$d cargas_ e infligirá _%2$d-%3$d de daño._ Cuantas más cargas use la varita, mayor y más fuerte será el efecto.
items.wands.wandoffireblast.upgrade_stat_name_1=Daño de 1 Carga
items.wands.wandoffireblast.upgrade_stat_name_2=Daño de 2 Cargas
items.wands.wandoffireblast.upgrade_stat_name_3=Daño de 3 Cargas
items.wands.wandoffireblast.bmage_desc=Cuando el _Mago de batalla_ golpea con un bastón de explosión de fuego, el enemigo tiene una probabilidad de estallar en llamas, como si el bastón tuviera el encantamiento flameante.
items.wands.wandoffireblast.eleblast_desc=Una explosión elemental con un bastón de explosión de fuego inflige un 100% de daño, revienta puertas y prende fuego a los enemigos y al terreno.

items.wands.wandoffrost.name=varita de hielo
items.wands.wandoffrost.staff_name=bastón de hielo
items.wands.wandoffrost.desc=Esta varita parece estar hecha de algún tipo de hielo mágico. Su brillo incrementa hacia el extremo. Se siente muy fría al sostenerse, pero de alguna manera tu mano mantiene la calidez.
items.wands.wandoffrost.stats_desc=Esta varita dispara ráfagas de energía helada hacia tus enemigos, infligiendo _%1$d-%2$d de daño_ y enfriándolos. El efecto parece ser más poderoso en el agua. Enemigos ya enfriados o congelados reciben menos daño de esta varita.
items.wands.wandoffrost.upgrade_stat_name_2=Duración de Enfriamiento
items.wands.wandoffrost.bmage_desc=Cuando el _Mago de batalla_ golpea a un enemigo enfriado con un bastón de hielo, tiene una probabilidad de congelarlo instantáneamente. Esta probabilidad aumenta cuanto más enfriados estén.
items.wands.wandoffrost.eleblast_desc=Una explosión elemental con un bastón de hielo inflige un 100% de daño, congela a los enemigos y apaga al fuego.

items.wands.wandoflightning.name=varita de relámpago
items.wands.wandoflightning.staff_name=bastón de relámpago
items.wands.wandoflightning.ondeath=Te has suicidado con tu propia Varita de Relámpago...
items.wands.wandoflightning.desc=Esta varita está hecha de metal sólido, lo que la hace sorprendentemente pesada. Dos puntas se curvan juntas en el extremo, y la electricidad arquea entre ellas.
items.wands.wandoflightning.stats_desc=Esta varita envía un poderoso relámpago arqueándose a través de cualquier cosa a la que se le dispare, infligiendo _%1$d-%2$d de daño._ La electricidad se propagará a personajes cercanos y lo hará mucho más fácilmente en el agua. El relámpago de esta varita puede causarte daño a tí, pero no a tus aliados.
items.wands.wandoflightning.bmage_desc=Cuando el _Mago de batalla_ golpea con un bastón de relámpago, el bastón tiene una probabilidad de arquear relámpagos a enemigos cercanos, como si tuviera el encantamiento electrizante.
items.wands.wandoflightning.eleblast_desc=Una explosión elemental con un bastón de relámpagos inflige un 100% de daño, aturde a los enemigos durante 5 turnos y electrifica el agua.

items.wands.wandoflivingearth.name=varita de tierra viva
items.wands.wandoflivingearth.staff_name=bastón de tierra viva
items.wands.wandoflivingearth.desc=Esta varita está hecha de una roca curiosa, con bandas de energía amarilla brillante. Las rocas parecen moverse ligeramente cuando agarras la varita, como si pudieran sentir tu mano.
items.wands.wandoflivingearth.stats_desc=Esta varita envía rayos de roca mágica a los enemigos, infligiendo _%1$d-%2$d de daño_. Las rocas se volverán a formar alrededor del usuario, otorgándole armadura en proporción al daño infligido. Si se construye suficiente armadura, se convertirá en un guardián de roca cuando se sacuda la varita.
items.wands.wandoflivingearth.upgrade_stat_name_2=PS Máximos del Guardián
items.wands.wandoflivingearth.upgrade_stat_name_3=Bloqueo del Guardián
items.wands.wandoflivingearth.bmage_desc=Cuando el _Mago de batalla_ golpea con un bastón de tierra viva, parte del daño infligido es regresado como armadura de roca.
items.wands.wandoflivingearth.eleblast_desc=Una explosión elemental con un bastón de tierra viva inflige un 50% de daño y cura a un guardián de tierra activo por cada enemigo alcanzado.
items.wands.wandoflivingearth$rockarmor.name=armadura de roca
items.wands.wandoflivingearth$rockarmor.desc=Rocas mágicas están rodeando tu cuerpo, cuando eres atacado intentarán bloquear por ti, reduciendo el daño que recibes en 50%%. Sin embargo, cada daño bloqueado raspa parte de la roca.\n\nArmadura restante: %1$d.\n\nSi se construye suficiente roca a tu alrededor, el próximo disparo de tu varita de tierra viva hará que las rocas se formen en un guardián que luchará contigo.\n\nArmadura necesaria para Guardián: %2$d.
items.wands.wandoflivingearth$earthguardian.name=guardián de tierra
items.wands.wandoflivingearth$earthguardian.desc=¡Las rocas de tu varita de tierra viva se han convertido en un guardián protector de tierra! Este protector rocoso atacará a enemigos cercanos, forzándolos a atacar al guardián en vez de a ti. Cuando todas las amenazas cercanas se hayan ido, el guardián se volverá a formar alrededor de ti, y regresará la próxima vez que uses tu varita.
items.wands.wandoflivingearth$earthguardian.wand_info=El poder defensivo del guardián depende del nivel de tu varita. Actualmente bloquea _%1$d-%2$d de daño._

items.wands.wandofmagicmissile.name=varita de proyectiles mágicos
items.wands.wandofmagicmissile.staff_name=bastón de proyectiles mágicos
items.wands.wandofmagicmissile.desc=Esta varita bastante simple lanza misiles de energía mágica pura. Si bien la varita en sí carece de efectos especiales, tiene más cargas disponibles y puede potenciar brevemente otras varitas cuando se mejora.
items.wands.wandofmagicmissile.stats_desc=Cada descarga de esta varita inflige _%1$d-%2$d de daño,_ y potenciará brevemente otras varitas si es mejorada.
items.wands.wandofmagicmissile.bmage_desc=Cuando el _Mago de batalla_ golpea con un bastón de proyectiles mágicos, todas sus varitas, además de su bastón, ganarán carga.
items.wands.wandofmagicmissile.eleblast_desc=Una explosión elemental con un bastón de misil mágico inflige un 50% de daño y le otorga al mago 15 turnos de recarga de varitas.
items.wands.wandofmagicmissile$magiccharge.name=carga mágica
items.wands.wandofmagicmissile$magiccharge.desc=Tu varita de misil mágico le otorga poder a tus varitas, aumentando el nivel efectivo del próximo disparo que efectúen.\n\nTus varitas son impulsadas a: +%d.\n\nTurnos de carga mágica restante: %s.

items.wands.wandofprismaticlight.name=varita de luz prismática
items.wands.wandofprismaticlight.staff_name=bastón de luz prismática
items.wands.wandofprismaticlight.desc=Esta varita está hecha de una pieza sólida de cristal translúcido, como un largo pedazo de vidrio refinado. Pequeños reflejos de luz colorida bailan alrededor de la punta de la varita, impacientes por salir disparadas.
items.wands.wandofprismaticlight.stats_desc=Esta varita dispara rayos de luz que cortan a través de la oscuridad de la mazmorra, revelando áreas secretas y trampas. El rayo puede cegar enemigos, e inflige _%1$d-%2$d de daño._ Demonios y no-muertos se quemarán en la luz brillante, recibiendo daño extra.
items.wands.wandofprismaticlight.upgrade_stat_name_2=Probabilidad de Cegar
items.wands.wandofprismaticlight.upgrade_stat_name_3=Duración de Iluminación
items.wands.wandofprismaticlight.bmage_desc=Cuando el _Mago de batalla_ golpea con un bastón de luz prismática, lisiará a los enemigos por una duración que escala con el nivel del bastón.
items.wands.wandofprismaticlight.eleblast_desc=Una explosión elemental con un bastón de luz prismática inflige un 67% de daño, revela todo el terreno dentro de la explosión y ciega a los enemigos durante 5 turnos.

items.wands.wandofregrowth.name=varita de recrecimiento
items.wands.wandofregrowth.staff_name=bastón de recrecimiento
items.wands.wandofregrowth.desc=Esta varita está hecha de un trozo delgado de madera hábilmente tallada. De alguna manera todavía está viva y vibrante, verde brillante como el núcleo de un joven árbol. "Cuando una vida perece, una nueva vida comienza a crecer...¡el eterno ciclo siempre prevalece!"
items.wands.wandofregrowth.stats_desc=Al usarse, esta varita dispara una energía mágica de recrecimiento en forma de cono, causando el rebrote de hierba, raíces y plantas. Su siguiente disparo consumirá _%1$d cargas._ Cuantas más cargas usa la varita, mayor y más fuerte será el efecto.
items.wands.wandofregrowth.degradation=Después de _%d cargas_ esta varita comenzará a fallar en producir plantas y hierba alta. Este límite puede incrementarse subiendo de nivel o mejorando la varita.
items.wands.wandofregrowth.upgrade_stat_name_1=Hierba por Carga
items.wands.wandofregrowth.upgrade_stat_name_2=Límite de Hierba Total
items.wands.wandofregrowth.bmage_desc=Cuando el _Mago de batalla_ golpea con un bastón de recrecimiento, y además está parado sobre hierba, ganará curación vegetal en proporción al daño infligido.
items.wands.wandofregrowth.eleblast_desc=Una explosión elemental con un bastón de recrecimiento enraíza a los enemigos y hace crecer hierba al azar sobre el área de la explosión.
items.wands.wandofregrowth$dewcatcher.name=Atraparocío
items.wands.wandofregrowth$dewcatcher.desc=Las Atraparocío son plantas maravillosas que se llenan de rocío mágico. Intentan camuflarse como hierba para evitar la atención, pero sus protuberancias de rocío recogido las delatan.
items.wands.wandofregrowth$seedpod.name=Vaina de Semilla
items.wands.wandofregrowth$seedpod.desc= Las Vainas de Semillas son plantas mágicas que producen semillas de otros tipos de plantas, en lugar de semillas propias. De alguna manera logran extenderse a pesar de no tener semilla propia.
items.wands.wandofregrowth$lotus.name=Loto Dorado
items.wands.wandofregrowth$lotus.desc=El loto dorado es una planta mística que solo puede ser conjurada por una poderosa varita de recrecimiento. Su aura mejora todas las plantas y los efectos de las plantas, pero agota su energía y muere después de un corto tiempo.
items.wands.wandofregrowth$lotus.wand_info=Este loto fue producido por una varita de recrecimiento _+%1$d_. Todas las plantas dentro de su área de efecto se _activarán instantáneamente_ si se plantan en un personaje. Las plantas también tendrán una _probabilidad del %2$d%%_ de dejar caer su semilla, y los dardos reforzados usarán un _%3$d%% menos de durabilidad_.

items.wands.wandoftransfusion.name=varita de transfusión
items.wands.wandoftransfusion.staff_name=bastón de transfusión
items.wands.wandoftransfusion.ondeath=Te has suicidado con tu propia Varita de Transfusión...
items.wands.wandoftransfusion.charged=¡Tu bastón está cargado con la energía vital de tu enemigo!
items.wands.wandoftransfusion.desc=Una varita con una forma no muy especial, se destaca por su color magenta y su gema completamente negra en la punta.
items.wands.wandoftransfusion.stats_desc=Cuando se usa en aliados o enemigos encantados, esta varita tomará _%1$d de la salud del usuario_ para sanar o blindar al aliado por _%2$d de salud._ Cuando se usa en enemigos, la varita los encantará brevemente mientras aplica _%3$d de blindaje_ al usuario. Los no-muertos hostiles recibirán _%4$d-%5$d de daño_ en lugar de ser encantados.
items.wands.wandoftransfusion.upgrade_stat_name_1=Blindaje Aliado
items.wands.wandoftransfusion.upgrade_stat_name_2=Blindaje Propio
items.wands.wandoftransfusion.upgrade_stat_name_3=Daño a No Muertos
items.wands.wandoftransfusion.bmage_desc=Cuando el _Mago de batalla_ golpea con un bastón de transfusión a un enemigo encantado, gana blindaje y el próximo disparo con su bastón no costará salud.
items.wands.wandoftransfusion.eleblast_desc=Una explosión elemental con un bastón de transfusión encanta a los enemigos, cura a los aliados e inflige un 100% de daño a los enemigos no muertos.

items.wands.wandofwarding.name=varita de protección
items.wands.wandofwarding.staff_name=bastón de protección
items.wands.wandofwarding.no_more_wards=Tu varita no puede sostener más guardas.
items.wands.wandofwarding.bad_location=No puedes colocar un guarda allí.
items.wands.wandofwarding.desc=Esta corta varita de metal tiene una gema púrpura brillante que flota sobre su punta.
items.wands.wandofwarding.stats_desc=En lugar de dañar directamente a un enemigo, esta varita invocará guardas y centinelas estacionarios. Los guardas se pueden invocar en cualquier lugar, incluso a través de las paredes si tienes visión. Esta varita puede mantener hasta _%d de energía_ en valor de guardas invocados a la vez.
items.wands.wandofwarding.upgrade_stat_name_1=Daño de Guarda
items.wands.wandofwarding.upgrade_stat_name_2=Energía
items.wands.wandofwarding.bmage_desc=Cuando el _Mago de batalla_ golpea con un bastón de protección, todos los centinelas activos tienen una probabilidad de ser curados.
items.wands.wandofwarding.eleblast_desc=Una explosión elemental con un bastón de protección cura a todos los centinelas en el área de la explosión.
items.wands.wandofwarding$ward.desc_generic_ward=Este guarda disparará automáticamente a cualquier enemigo que entre en su campo de visión.\n\nDisparar al guarda con tu varita de protección lo mejorara.\n\nLos guardas tienen un número limitado de disparos antes de disiparse.
items.wands.wandofwarding$ward.desc_generic_sentry=Este centinela tiene el mismo poder de ataque que un guarda, pero tiene salud en vez de un número fijo de disparos. Se asemeja a la gema en la punta de tu varita de protección.\n\nDisparar a este centinela con tu varita de protección lo mejorara y curara.\n\nEste centinela perderá un poco de salud cada vez que dispare a un enemigo, pero puede ser curado usando tu varita de protección sobre él.
items.wands.wandofwarding$ward.name_1=guarda menor
items.wands.wandofwarding$ward.desc_1=Este guarda básico disparará automáticamente a cualquier enemigo que entre en su rango de visión, infligiendo _%1$d- %2$d de daño._\n\nDisparar a este guarda con tu varita de protección lo mejorará.\n\nEste guarda disparará una sola vez antes de disiparse.\n\nTu varita de protección está usando _%3$d de energía_ para mantener a este guarda.
items.wands.wandofwarding$ward.name_2=guarda
items.wands.wandofwarding$ward.desc_2=Este guarda mejorado tiene un patrón más complejo y puede atacar varias veces. Cada disparo de este guarda infligirá _%1$d-%2$d de daño._\n\nDisparar a este guarda con tu varita de protección lo mejorará.\n\nEste guarda disparará tres veces antes de disiparse.\n\nTu varita de protección está usando _%3$d de energía_ para mantener a este guarda.
items.wands.wandofwarding$ward.name_3=guarda mayor
items.wands.wandofwarding$ward.desc_3=Este guarda completamente mejorado puede atacar más veces que sus predecesores. Cada disparo de este guarda infligirá _%1$d-%2$d de daño._\n\nDisparar a este guarda con tu varita de protección lo mejorará.\n\nEste guarda disparará cinco veces antes de disiparse.\n\nTu varita de protección está usando _%3$d de energía_ para mantener este guarda.
items.wands.wandofwarding$ward.name_4=centinela menor
items.wands.wandofwarding$ward.desc_4=Este pequeño centinela tiene la misma potencia de fuego que un guarda mayor, pero tiene salud en lugar de una cantidad determinada de cargas. Se asemeja a la gema en la punta de tu varita de protección. Cada disparo de este centinela causará _%1$d-%2$d de daño._\n\nDisparar a este centinela con tu varita de protección lo mejorará y sanará.\n\nEste centinela gastará algo de salud cada vez que dispare a un enemigo, pero puede curarse usando tu varita de protección.\n\nTu varita de protección está usando _%3$d de energía_ para mantener a este centinela.
items.wands.wandofwarding$ward.name_5=centinela
items.wands.wandofwarding$ward.desc_5=Este centinela mejorado es más grande y más duradero que un centinela menor. Cada disparo de este centinela infligirá _%1$d-%2$d de daño._\n\nDisparar a este centinela con tu varita de protección lo mejorará y sanará.\n\nEste centinela gastará algo de salud cada vez que dispare a un enemigo, pero puede curarse usando tu varita de protección.\n\nTu varita de protección está usando _%3$d de energía_ para mantener a este centinela.
items.wands.wandofwarding$ward.name_6=gran centinela
items.wands.wandofwarding$ward.desc_6=Este centinela completamente mejorado es significativamente más duradero que sus predecesores. Cada disparo de este centinela infligirá _%1$d-%2$d de daño._\n\nDisparar a este centinela con tu varita de protección lo curará.\n\nEste centinela gastará algo de salud cada vez que dispare a un enemigo, pero puede curarse usando tu varita de protección.\n\nTu varita de protección está usando _%3$d de energía_ para mantener a este centinela.
items.wands.wandofwarding$ward.dismiss_title=¿Descartar este guarda?
items.wands.wandofwarding$ward.dismiss_body=Puedes disipar este guarda si ya no quieres que tu varita lo mantenga. Hacerlo destruye al guarda inmediatamente.\n\n¿Descartar este guarda?
items.wands.wandofwarding$ward.dismiss_confirm=sí
items.wands.wandofwarding$ward.dismiss_cancel=no

###weapon curses
items.weapon.curses.annoying.name=%s exasperante
items.weapon.curses.annoying.msg_1=OOH, ¿¡ESTAMOS PELEANDO CONTRA ALGO!?
items.weapon.curses.annoying.msg_2=¡SÍ, A POR ELLOS!
items.weapon.curses.annoying.msg_3=¡HEY, ESCUCHA!
items.weapon.curses.annoying.msg_4=¿¡HEMOS LLEGADO AL JEFE YA!?
items.weapon.curses.annoying.msg_5=¡OUCH, NO ME ESGRIMAS TAN FUERTE!
items.weapon.curses.annoying.msg_6=¡MUERE, INSECTO!
items.weapon.curses.annoying.msg_7=WHEEEEEEEEEEEEEEE!
items.weapon.curses.annoying.msg_8=¿¡Podemos tomar un descanso!?
items.weapon.curses.annoying.msg_9=¡PUM, JAJA!
items.weapon.curses.annoying.msg_10=¡BUEN GOLPE!
items.weapon.curses.annoying.msg_11=No quería ser un arma, quería ser un hacha de leñador.
items.weapon.curses.annoying.msg_12=Recuerda, el exceso de confianza es un asesino lento e insidioso.
items.weapon.curses.annoying.msg_13=¡TODA TU BASE NOS PERTENECE!
items.weapon.curses.annoying.desc=Las armas molestas son capaces de hablar pero son quizás demasiado enérgicas. A menudo llamarán la atención sin querer.
items.weapon.curses.annoying.elestrike_desc=Un impacto elemental con una maldición exasperante tiene un 20% de probabilidad de enloquecer a cada enemigo a su alcance durante 6 turnos.

items.weapon.curses.dazzling.name=%s deslumbrante
items.weapon.curses.dazzling.desc=Las armas deslumbrantes parpadearán ocasionalmente con una luz resplandeciente, cegando a todo lo que la vea.
items.weapon.curses.dazzling.elestrike_desc=Un impacto elemental con una maldición deslumbrante tiene un 50% de probabilidad de cegar a todos los enemigos a su alcance durante 6 turnos.

items.weapon.curses.displacing.name=%s desplazante
items.weapon.curses.displacing.desc=Las armas de desplazamiento están impregnadas de magia de teletransportación caótica, teniendo la habilidad de mover enemigos alrededor del nivel aleatoriamente.
items.weapon.curses.displacing.elestrike_desc=Un impacto elemental con una maldición de desplazamiento tiene un 50% de probabilidad de teletransportar a cada enemigo a su alcance.

items.weapon.curses.explosive.name=%s detonante
items.weapon.curses.explosive.warm=Tibio...
items.weapon.curses.explosive.hot=¡Caliente!
items.weapon.curses.explosive.desc=Las armas detonantes acumulan energía de forma constante y luego explotan, dañando al portador y al enemigo.
items.weapon.curses.explosive.desc_cool=Tu arma se siente fría al tacto de momento.
items.weapon.curses.explosive.desc_warm=Tu arma está acumulando energía y empieza a calentarse...
items.weapon.curses.explosive.desc_hot=¡Tu arma esta caliente! ¡Esta apunto de explotar!
items.weapon.curses.explosive.elestrike_desc=Un impacto elemental con una maldición explosiva tiene un 50% de probabilidad de provocar que se produzca una explosión sobre un enemigo aleatorio a su alcance.

items.weapon.curses.friendly.name=%s de amistad
items.weapon.curses.friendly.desc=Las armas amistosas son más adecuadas para los pacifistas, ocasionalmente desencadenando magia que hace que sea imposible luchar.
items.weapon.curses.friendly.elestrike_desc=Un impacto elemental con una maldición de amistad tiene un 50% de probabilidad de encantar a cada enemigo a su alcance durante 6 turnos.

items.weapon.curses.polarized.name=%s de polaridad
items.weapon.curses.polarized.desc=Un arma polarizada se ve afectada por magia que hace que su ataque inflija un 50% más de daño, o que no cause ningún daño.
items.weapon.curses.polarized.elestrike_desc=Un impacto elemental con una maldición polarizada tiene un 50% de probabilidad de causar 24-36 de daño a cada enemigo a su alcance.

items.weapon.curses.sacrificial.name=%s de sacrificio
items.weapon.curses.sacrificial.desc=Las armas de sacrificio exigen la sangre de su portador a cambio de atacar enemigos. Cuanta más salud tenga su portador, más sangre tomará la maldición.
items.weapon.curses.sacrificial.elestrike_desc=Un impacto elemental con una maldición de sacrificio hace que el héroe y cada enemigo a su alcance sangren por 12 PS.

items.weapon.curses.wayward.name=%s rebelde
items.weapon.curses.wayward.desc=Las armas rebeldes se volverán extremadamente imprecisas en ocasiones. Esta magia dura por un corto tiempo cuando se activa aunque puede disiparse acertando un golpe con el arma rebelde.
items.weapon.curses.wayward.elestrike_desc=Un impacto elemental con una maldición rebelde tiene un 50% de probabilidad de hechizar a cada enemigo a su alcance durante 6 turnos.
items.weapon.curses.wayward$waywardbuff.name=rebeldía
items.weapon.curses.wayward$waywardbuff.desc=La magia de tu arma rebelde se ha activado, haciéndola extremadamente imprecisa por un corto tiempo. Ten en cuenta que esto no afecta ataques garantizados a impactar, como ataques sorpresa. Golpear exitosamente con un arma rebelde detendrá este efecto inmediatamente.\n\nTurnos restantes: %s.

###enchantments
items.weapon.enchantments.blazing.name=%s flameante
items.weapon.enchantments.blazing.desc=Este encantamiento hace que las llamas salgan de un arma, encendiendo a los enemigos e infligiendo daño adicional a los enemigos que ya están en llamas.
items.weapon.enchantments.blazing.elestrike_desc=Un impacto elemental con un encantamiento flameante esparce fuego a cada casilla a su alcance, que dura 8 turnos.

items.weapon.enchantments.blocking.name=%s de bloqueo
items.weapon.enchantments.blocking.desc=Las armas de bloqueo tienen una probabilidad de protegerte después de atacar con ellas.
items.weapon.enchantments.blocking.elestrike_desc=Un impacto elemental con un encantamiento de bloqueo le otorga a la Duelista 6 de blindaje adicional por cada enemigo a su alcance.
items.weapon.enchantments.blocking$blockbuff.name=bloqueo
items.weapon.enchantments.blocking$blockbuff.desc=¡El encantamiento de bloqueo de tu arma te ha garantizado una breve mejora a tu poder defensivo!\n\nBlindaje restante: %d\n\nTurnos restantes: %s.

items.weapon.enchantments.blooming.name=%s floreciente
items.weapon.enchantments.blooming.desc=Las armas florecientes contienen magia que hará que la vegetación brote sobre o alrededor de aquellos que golpean.
items.weapon.enchantments.blooming.elestrike_desc=Un impacto elemental con un encantamiento floreciente esparce hierba hasta 8 casillas y enraíza a todos los enemigos a su alcance durante 6 turnos.

items.weapon.enchantments.chilling.name=%s enfriante
items.weapon.enchantments.chilling.desc=Los enemigos golpeados con este encantamiento son enfriados, reduciendo su velocidad de movimiento y ataques.
items.weapon.enchantments.chilling.elestrike_desc=Un impacto elemental con un encantamiento enfriante esparce aire helado a cada casilla dentro de su alcance, que dura 8 turnos.

items.weapon.enchantments.kinetic.name=%s de energía cinética
items.weapon.enchantments.kinetic.desc=Cuando un enemigo es derrotado con un arma cinética, cualquier exceso de fuerza almacenada en el arma será aplicada al siguiente ataque exitoso.
items.weapon.enchantments.kinetic.elestrike_desc=Un impacto elemental con un encantamiento cinético aplica el 40% del daño almacenado a cada enemigo dentro de su alcance, excepto al objetivo principal.
items.weapon.enchantments.kinetic$conserveddamage.name=daño conservado
items.weapon.enchantments.kinetic$conserveddamage.desc=Tu arma ha almacenado el exceso de fuerza del anterior golpe mortal y se aplicará como daño adicional a tu siguiente ataque. Sin embargo, la energía se desvanecerá lentamente a través del tiempo.\n\nDaño Conservado: %d

items.weapon.enchantments.corrupting.name=%s de corrupción
items.weapon.enchantments.corrupting.desc=Este poderoso encantamiento posee la habilidad de convertir enemigos a tu voluntad. Cuando un enemigo muere con esta arma, existe la posibilidad de que se corrompa en lugar de morir.
items.weapon.enchantments.corrupting.elestrike_desc=Un impacto elemental con un encantamiento de corrupción tiene una probabilidad del 5-25% (basado en PS faltantes) de corromper a todos los enemigos dentro de su alcance, excepto al objetivo principal.

items.weapon.enchantments.elastic.name=%s de elasticidad
items.weapon.enchantments.elastic.desc=Las armas elásticas tienen una probabilidad de enviar enemigos volando a distancias cortas.
items.weapon.enchantments.elastic.elestrike_desc=Un impacto elemental con un encantamiento de elasticidad empuja 5 casillas a todos los enemigos a su alcance.

items.weapon.enchantments.grim.name=%s de sombras
items.weapon.enchantments.grim.desc=Este poderoso encantamiento posee el poder de ejecutar instantáneamente a un enemigo. El efecto es más probable que ocurra cuanto más débil sea el enemigo.
items.weapon.enchantments.grim.elestrike_desc=Un impacto elemental con un encantamiento de sombras tiene un 6-30% de probabilidad (basado en PS faltantes) de matar a todos los enemigos a su alcance, excepto al objetivo principal.

items.weapon.enchantments.lucky.name=%s de fortuna
items.weapon.enchantments.lucky.desc=Los enemigos que son derrotados por un arma afortunada tienen una probabilidad de dejar botín adicional.
items.weapon.enchantments.lucky.elestrike_desc=Un impacto elemental con un encantamiento de fortuna tiene un 12.5% de probabilidad de generar botín por cada enemigo a su alcance. Este efecto solo puede activarse una vez por enemigo.

items.weapon.enchantments.projecting.name=%s de proyección
items.weapon.enchantments.projecting.desc=Con este encantamiento, las armas cuerpo a cuerpo obtendrán un alcance adicional. Las armas a distancia podrán penetrar las paredes cercanas.
items.weapon.enchantments.projecting.elestrike_desc=Un impacto elemental con un encantamiento de proyección inflige un 30% de daño a cada enemigo a su alcance, excepto al objetivo principal.

items.weapon.enchantments.shocking.name=%s electrizante
items.weapon.enchantments.shocking.desc=La electricidad de un arma electrizante arquea infligiendo daño adicional a todos los enemigos cercanos.
items.weapon.enchantments.shocking.elestrike_desc=Un impacto elemental con un encantamiento electrizante propaga electricidad a cada casilla a su alcance, que dura 8 turnos.

items.weapon.enchantments.unstable.name=%s inestable
items.weapon.enchantments.unstable.desc=Este encantamiento irradia energía caótica, actuando como un encantamiento diferente con cada golpe.
items.weapon.enchantments.unstable.elestrike_desc=Un impacto elemental con un encantamiento inestable aplica un efecto de encantamiento aleatorio a cada enemigo a su alcance, excepto al objetivo principal.

items.weapon.enchantments.vampiric.name=%s chupa sangre
items.weapon.enchantments.vampiric.desc=Este poderoso encantamiento absorbe la energía vital de los enemigos con cada golpe, canalizándola de nuevo al usuario. El efecto es más fuerte cuanto menor sea la salud del usuario.
items.weapon.enchantments.vampiric.elestrike_desc=Un impacto elemental con un encantamiento chupasangre cura a la Duelista por 2.5 PS por cada enemigo a su alcance.


###melee weapons
items.weapon.melee.assassinsblade.name=cuchilla de asesino
items.weapon.melee.assassinsblade.stats_desc=Esta arma es más efectiva contra los enemigos desprevenidos.
items.weapon.melee.assassinsblade.ability_name=escabullirse
items.weapon.melee.assassinsblade.typical_ability_desc=La Duelista puede _escabullirse_ mientras lleve una cuchilla de asesino. Esta habilidad permite a la Duelista destellar instantáneamente hasta 3 casillas y normalmente le otorgaría _%d turnos de invisibilidad._
items.weapon.melee.assassinsblade.ability_desc=La Duelista puede _escabullirse_ mientras lleve una cuchilla de asesino. Esta habilidad permite a la Duelista destellar instantáneamente hasta 3 casillas y le otorga _%d turnos de invisibilidad._
items.weapon.melee.assassinsblade.upgrade_ability_stat_name=Duración de Habilidad
items.weapon.melee.assassinsblade.desc=Una pequeña cuchilla ondulada hecha de obsidiana, difícil de usar a pesar de ser liviana, pero mortal si es usada correctamente.

items.weapon.melee.battleaxe.name=hacha de combate
items.weapon.melee.battleaxe.stats_desc=Esta es un arma bastante precisa.
items.weapon.melee.battleaxe.ability_name=golpe fuerte
items.weapon.melee.battleaxe.typical_ability_desc=La Duelista puede realizar un _golpe fuerte_ con un hacha de combate. Este concentrado ataque normalmente infligiría _%1$d-%2$d de daño_ si sorprende al enemigo y lo marea por 5 turnos, lo que reduce la evasión en 50%%. Golpe fuerte siempre acierta pero causa daño regular si no sorprende al enemigo.
items.weapon.melee.battleaxe.ability_desc=La Duelista puede realizar un _golpe fuerte_ con un hacha de combate. Este concentrado ataque inflige _%1$d-%2$d de daño_ si sorprende al enemigo y lo marea por 5 turnos, lo que reduce la evasión en 50%%. Golpe fuerte siempre acierta pero causa daño regular si no sorprende al enemigo.
items.weapon.melee.battleaxe.desc=La enorme cabeza de acero de esta hacha de batalla pone un peso considerable detrás de cada golpe.

items.weapon.melee.crossbow.name=ballesta
items.weapon.melee.crossbow.stats_desc=Esta arma aumenta el daño de los dardos lanzados cuando está equipada, e incluso les otorgará su encantamiento.
items.weapon.melee.crossbow.ability_name=disparo cargado
items.weapon.melee.crossbow.typical_ability_desc=La Duelista _carga_ su ballesta, haciendo que su siguiente ataque con la misma siempre acierte y aplique uno de tres efectos: ataques cuerpo a cuerpo empujan enemigos, dardos sin reforzar normalmente causarían _+%1$d de daño_, y dardos reforzados aplican su efecto en un área de 7x7 y normalmente durarían _%2$d usos adicionales_.
items.weapon.melee.crossbow.ability_desc=La Duelista _carga_ su ballesta, haciendo que su siguiente ataque con la misma siempre acierte y aplique uno de tres efectos: ataques cuerpo a cuerpo empujan enemigos, dardos sin reforzar causan _+%1$d de daño_, y dardos reforzados aplican su efecto en un área de 7x7 y duran _%2$d usos adicionales_.
items.weapon.melee.crossbow.desc=Un arma bastante intrincada que dispara dardos a velocidades excepcionales. Aunque no esté diseñada para esto, el peso y la construcción robusta de esta ballesta también la convierten en un arma cuerpo a cuerpo decente.
items.weapon.melee.crossbow.upgrade_ability_stat_name=Aumento de Habilidad
items.weapon.melee.crossbow$chargedshot.name=cargada
items.weapon.melee.crossbow$chargedshot.desc=La Duelista enfoca el poder en su ballesta. El próximo ataque que haga con ella siempre acertará y aplicará uno de tres efectos:\n- Ataques cuerpo a cuerpo empujan enemigos unas pocas casillas.\n- Dardos sin reforzar causan daño adicional.\n- Dardos reforzados ganan usos adicionales y aplican su efecto en un área de 7x7. Efectos positivos de dardos solo afectan a aliados, mientras que efectos negativos solo se aplican a enemigos.\n\nLa Duelista no puede usar esta habilidad para aplicar efectos positivos de los dardos a sí misma.

items.weapon.melee.dagger.name=daga
items.weapon.melee.dagger.stats_desc=Esta arma es más efectiva contra los enemigos desprevenidos.
items.weapon.melee.dagger.ability_name=escabullirse
items.weapon.melee.dagger.typical_ability_desc=La Duelista puede _escabullirse_ mientras lleve una daga. Esta habilidad permite a la Duelista destellar instantáneamente hasta 5 casillas y normalmente le otorgaría _%d turnos de invisibilidad._
items.weapon.melee.dagger.ability_desc=La Duelista puede _escabullirse_ mientras lleve una daga. Esta habilidad permite a la Duelista destellar instantáneamente hasta 5 casillas y le otorga _%d turnos de invisibilidad._
items.weapon.melee.dagger.upgrade_ability_stat_name=Duración de Habilidad
items.weapon.melee.dagger.desc=Una simple daga de hierro con un mango de madera desgastada.

items.weapon.melee.dirk.name=dirk
items.weapon.melee.dirk.stats_desc=Esta arma es más efectiva contra enemigos desprevenidos.
items.weapon.melee.dirk.ability_name=escabullirse
items.weapon.melee.dirk.typical_ability_desc=La Duelista puede _escabullirse_ mientras lleve un dirk. Esta habilidad permite a la Duelista destellar hasta 4 casillas y normalmente le otorgaría _%d turnos de invisibilidad._
items.weapon.melee.dirk.ability_desc=La Duelista puede _escabullirse_ mientras lleve un dirk. Esta habilidad permite a la Duelista destellar hasta 4 casillas y le otorga _%d turnos de invisibilidad._
items.weapon.melee.dirk.upgrade_ability_stat_name=Duración de Habilidad
items.weapon.melee.dirk.desc=Una daga más larga, tiene un poco más de acero que clavar en los enemigos.

items.weapon.melee.flail.name=mangual
items.weapon.melee.flail.stats_desc=Esta es un arma bastante imprecisa.\nEsta arma no puede atacar por sorpresa.
items.weapon.melee.flail.ability_name=voltear
items.weapon.melee.flail.spin_warn=Ya no puedes voltear más el mangual.
items.weapon.melee.flail.typical_ability_desc=La Duelista puede _voltear_ un mangual para acumular poder por un corto tiempo. Cada turno que se voltea el mangual, normalmente infligiría _+%d de daño_ en su próximo ataque normal, hasta un máximo de 3 veces. Mientras se esté volteando está garantizado que el mangual acierte. Solamente comenzar a voltear el mangual cuesta una carga.
items.weapon.melee.flail.ability_desc=La Duelista puede _voltear_ un mangual para acumular poder por un corto tiempo. Cada turno que se voltea el mangual, inflige _+%d de daño_ en su próximo ataque normal, hasta un máximo de 3 veces. Mientras se esté volteando está garantizado que el mangual acierte. Solamente comenzar a voltear el mangual cuesta una carga.
items.weapon.melee.flail.desc=Una bola de pinchos sujeta a un mango por una larga cadena. Muy difícil de manejar, pero devastadora si consigue un golpe sólido.
items.weapon.melee.flail$spinabilitytracker.name=volteando
items.weapon.melee.flail$spinabilitytracker.desc=La Duelista está volteando su mangual, acumulando daño para su próximo ataque normal. Cada volteo toma un turno pero aumenta el daño, hasta un máximo de tres volteos. Además el mangual está garantizado a acertar mientras se esté volteando.\n\nVolteo actual: %1$d%%.\nTurnos restantes: %2$s.

items.weapon.melee.gauntlet.name=guantelete de piedra
items.weapon.melee.gauntlet.stats_desc=Esta es un arma muy rápida.
items.weapon.melee.gauntlet.ability_name=golpe de combo
items.weapon.melee.gauntlet.typical_ability_desc=La Duelista puede realizar un _golpe de combo_ con el guantelete de piedra. Este ataque está garantizado a acertar y normalmente causaría _%d de daño_ por cada vez que la Duelista haya golpeado cuerpo a cuerpo o con un arma arrojadiza en los últimos 5 turnos.
items.weapon.melee.gauntlet.ability_desc=La Duelista puede realizar un _golpe de combo_ con el guantelete de piedra. Este ataque está garantizado a acertar y causa _+%d de daño_ por cada vez que la Duelista haya golpeado cuerpo a cuerpo o con un arma arrojadiza en los últimos 5 turnos.
items.weapon.melee.gauntlet.desc=Este gran guantelete está hecho de tela carmesí con pesadas piedras mágicas puesta encima. La tela se tensa alrededor de ti, haciendo que las placas de piedra sean casi como una segunda piel. Balancear un arma tan pesada requiere fuerza, pero añade tremenda fuerza a tus golpes.

items.weapon.melee.glaive.name=guja
items.weapon.melee.glaive.stats_desc=Esta es un arma bastante lenta.\nEsta arma tiene alcance extra.
items.weapon.melee.glaive.ability_name=pinchar
items.weapon.melee.glaive.typical_ability_desc=La Duelista puede usar la punta de una guja para _pinchar_ a un enemigo que está a su alcance pero no adyacente a ella. Esto normalmente causaría _%1$d-%2$d_ de daño, empuja al enemigo y esta garantizado a acertar.
items.weapon.melee.glaive.ability_desc=La Duelista puede usar la punta de una guja para _pinchar_ a un enemigo que está a su alcance pero no adyacente a ella. Esto causa _%1$d-%2$d_ de daño, empuja al enemigo y esta garantizado a acertar.
items.weapon.melee.glaive.desc=Un arma de asta enorme que consiste en una hoja de espada en el extremo de una barra.

items.weapon.melee.gloves.name=guantes tachonados
items.weapon.melee.gloves.stats_desc=Esta es un arma muy rápida.
items.weapon.melee.gloves.ability_name=golpe de combo
items.weapon.melee.gloves.typical_ability_desc=La Duelista puede realizar un _golpe de combo_ con los guantes tachonados. Este ataque está garantizado a acertar y normalmente causaría _+%d de daño_ por cada vez que la Duelista haya golpeado cuerpo a cuerpo o con un arma arrojadiza en los últimos 5 turnos.
