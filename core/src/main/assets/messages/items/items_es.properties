items.infopage.battlepass_desc=\n\nEl _pase de batalla_ puede otorgarte objetos y oro aleatorios periódicamente cada mes y de forma indefinida por experiencia. _Ganarás experiencia del pase de batalla tras terminar tu partida actual y podrás reclamar los objetos en tus siguientes partidas._
items.psychechest.name=cofre psíquico
items.psychechest.ac_activate=ACTIVAR
items.psychechest.ac_deactivate=DESACTIVAR
items.psychechest.ac_reset=REINICIAR NIVEL
items.psychechest.desc=Un cofre misterioso que vibra con energía psíquica. Requiere fuerza mental para abrirlo.\n\nUna vez activado el destino, cada monstruo derrotado invocará un regalo aleatorio en el piso de la mazmorra, y cada _%d_ de experiencia ganada otorgará al usuario un Pergamino de Mejora (_esto escala con el ciclo de la mazmorra_).\n\nSi deseas obtener más monstruos y botín, puedes reiniciar el piso actual a cambio del 45%% de tu salud máxima y otras ventajas...
items.psychechest.desc2=\n\nNo olvides que solo aumentarás el ciclo de la mazmorra una vez alcances el nivel _%d_, y alcanzar ese nivel ya no te dará EXP en el ciclo actual.
items.psychechest.desc3=\n\nAdemás, cada _%d_ de experiencia otorgará al jugador un pergamino de transmutación.
items.psychechest.activated=El destino de la mazmorra ha sido sellado. Disfruta de los objetos aleatorios que el propio destino te conceda.
items.psychechest.deactivated=Quizá manipular el destino no sea tan bueno como parecía.
items.psychechest.no_reset=No tienes suficiente salud para reiniciar el piso.
items.blackpsychechest.name=cofre psíquico oscuro
items.blackpsychechest.ac_reset=REINICIAR MAZMORRA
items.blackpsychechest.ac_access=IR AL JEFE
items.blackpsychechest.desc=Si quieres farmear más y conseguir más botín, usa la opción REINICIAR. Si quieres terminar, puedes enfrentarte a tu propia avaricia.
items.blackpsychechest.desc0="Saludos, amigo mío. Tu sed de poder me asombra, pero tu fuerza puede llegar mucho más lejos. Si te sientes lo bastante fuerte para luchar contra mí, estaré esperando aquí."\n-Tu avaricia
items.blackpsychechest.desc1="Sobreviviste a esta nueva mazmorra potenciada, ¿eh? No esperaba que fueras tan fuerte. Pero sé que quieres más. Siéntete libre de intentar la mazmorra otra vez y satisfacer tu orgullo."\n-Tu avaricia
items.blackpsychechest.desc2="Vaya, sigues viniendo. ¿Realmente no te cansas de este ciclo interminable? Bueno, no te detendré. Veamos hasta dónde puedes llegar."\n-Tu avaricia
items.blackpsychechest.desc3="Estás más allá de la comprensión ordinaria. El ciclo de la realidad se pliega a tu voluntad. ¿Aceptas el desafío definitivo?"
-Tu avaricia
