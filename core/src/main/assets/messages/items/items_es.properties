items.quest.superpickaxe.name=throwing mining tool
items.quest.superpickaxe.desc=The ultimate form of pickaxe, it can be thrown like a boomerang at walls or at enemies to destroy them. Keep in mind that it cannot pierce through walls and suffers a huge accuracy penalty, but its weight is going to help to pierce through enemy skulls very well.
