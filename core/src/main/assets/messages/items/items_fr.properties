items.weapon.missiles.missileweapon.stats_unknown=En moyenne, cet ensemble d'armes de jet de _niveau %1$d_ inflige _%2$d-%3$d dégâts_ et nécessite _%4$d de force_ pour être correctement utilisé.
items.weapon.missiles.missileweapon.stats_desc=
items.weapon.missiles.missileweapon.probably_too_heavy=Cette arme est probablement trop lourde pour vous.
items.weapon.missiles.missileweapon.distance=Les armes de jet sont plus précises contre des ennemis distants, mais aussi bien moins précises au corps-à-corps.
items.weapon.missiles.missileweapon.durability=Les armes de jets vont s'abimer et se briser au fur et à mesure de leur utilisation.
