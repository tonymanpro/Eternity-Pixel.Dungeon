items.armor.armor.too_heavy=À cause de votre manque de force, porter cette armure diminuera votre capacité à vous déplacer, esquiver et absorber les dégâts.
items.armor.armor.probably_too_heavy=Cette armure est probablement trop lourde pour vous.
items.armor.armor.excess_str=Grâce à votre excès de force vous _esquivez mieux_ quand vous portez cette armure.
items.armor.armor.evasion=C'est augmenté pour améliorer _l'esquive._
items.armor.armor.defense=C'est augmenté pour améliorer la _défense._
items.armor.armor.inscribed=un _%s_ y est gravé.
items.armor.armor.glyph_hardened=Elle a été _durcie._
items.armor.armor.hardened_no_glyph=Cette armure a été _durcie,_ mais n’est actuellement pas inscrite d'un glyphe.
items.armor.armor.cursed_worn=Vous ne parvenez pas à retirer cette armure car elle est maudite.
items.armor.armor.cursed=Vous pouvez ressentir une magie malveillante émaner de cette armure.
items.armor.armor.weak_cursed=Malgré la malédiction, vous êtes capable de déséquiper cette armure.
items.armor.armor.not_cursed=Cette armure est dépourvue de toute aura malveillante.
items.armor.armor.seal_attached=Le sceau brisé du Guerrier est attaché à cette armure. Lorsqu'il va être blessé en dessous de la moitié de sa santé maximale, il lui accordera _%d de protection_.
items.armor.armor.seal_transfer=Le sceau brisé du Guerrier doit être attaché à l'armure que vous portez pour vous accorder ses bénéfices. Voulez-vous automatiquement détacher le sceau de l'armure que vous déséquipez pour l'attacher à l'armure que vous équipez ?
items.armor.armor.seal_transfer_yes=oui
