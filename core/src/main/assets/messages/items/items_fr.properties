items.weapon.melee.mace.ability_desc=La Duelliste peut effectuer un _coup lourd_ avec une masse. Cette attaque concentrée inflige _%1$d-%2$d dégâts_ si l'ennemi est surpris, et l'étourdit pendant 5 tours ce qui réduit sa précision et son esquive de 50 %%. Ce coup lourd touche à coup sûr mais sans bonus de dégâts si l'ennemi n'est pas surpris.
items.weapon.melee.mace.desc=La tête en fer massive de cette arme inflige des dégâts considérables.

