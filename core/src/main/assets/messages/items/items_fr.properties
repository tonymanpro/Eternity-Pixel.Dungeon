items.armor.classarmor.discover_hint=Vous pouvez trouver cet objet après avoir vaincu le boss de l'étage 20 avec un certain héros.

items.armor.clericarmor.name=veste de héros
items.armor.clericarmor.desc=Quand iel porte cet assemblage de tissus et de plaques, le Clerc peut utiliser une capacité spéciale.

items.armor.clotharmor.name=armure en lin
items.armor.clotharmor.desc=Cette armure légère offre une protection succincte.
items.armor.clotharmor.discover_hint=Un des héros commence avec cet objet.

items.armor.duelistarmor.name=plastron de héros
items.armor.duelistarmor.desc=En portant cette armure avec cape, la Duelliste peut utiliser une capacité spéciale.

items.armor.huntressarmor.name=cape de héros
items.armor.huntressarmor.no_enemies=Pas d'ennemis en vue
items.armor.huntressarmor.desc=En portant cette cape, la Chasseresse peut utiliser une capacité spéciale.

items.armor.leatherarmor.name=armure de cuir
items.armor.leatherarmor.desc=Armure faite de peaux de monstre tannées. Pas aussi légère qu'une tunique, mais elle offre une meilleure protection.

items.armor.magearmor.name=robe de héros
items.armor.magearmor.desc=En portant cette superbe robe, le Mage peut utiliser une capacité spéciale.

items.armor.mailarmor.name=armure de mailles
items.armor.mailarmor.desc=De fins anneaux de métal reliés entre eux pour en faire une armure solide mais flexible.

items.armor.platearmor.name=armure de plates
items.armor.platearmor.desc=D'énormes plaques de métal jointes formant une armure offrant une protection inégalée aux aventuriers assez forts pour supporter son poids éreintant.

items.armor.roguearmor.name=tunique de héros
items.armor.roguearmor.desc=En portant cette sombre tunique, le Voleur peut utiliser une capacité spéciale.

items.armor.scalearmor.name=armure d'écailles
items.armor.scalearmor.desc=Les écailles de métal fixées sur cette veste de cuir en font une armure souple offrant une protection efficace.

items.armor.warriorarmor.name=armure de plates du héros
items.armor.warriorarmor.desc=En portant cette lourde armure de plates, le Guerrier peut utiliser une capacité spéciale.



###artifacts
items.artifacts.alchemiststoolkit.name=Nécessaire d'alchimie
items.artifacts.alchemiststoolkit.ac_brew=BRASSER
items.artifacts.alchemiststoolkit.ac_energize=ÉNERGIE
items.artifacts.alchemiststoolkit.not_ready=Votre nécessaire n'a pas terminé de chauffer.
items.artifacts.alchemiststoolkit.cursed=Votre nécessaire maudit vous empêche d'utiliser l'alchimie !
items.artifacts.alchemiststoolkit.need_energy=Vous avez besoin d'au moins 6 points d'énergie pour cela.
items.artifacts.alchemiststoolkit.energize_desc=6 cristaux d'énergie permettent au nécessaire d'alchimie de gagner un niveau, ce qui augmente sa vitesse de génération d'énergie et la vitesse à laquelle il chauffe.\n\nCombien d'énergie souhaitez-vous utiliser ?
items.artifacts.alchemiststoolkit.energize_1=6 énergies : +1 niveau
items.artifacts.alchemiststoolkit.energize_all=%1$d énergies : +%2$d niveaux
items.artifacts.alchemiststoolkit.desc=Ce nécessaire d'alchimie contient un certain nombre de réactifs et d'herbes, ainsi qu'une petite fiole de mélange, permettant une alchimie instantanée. Le contenu de la fiole ressemble à des cristaux d'énergie sous forme liquide.
items.artifacts.alchemiststoolkit.desc_cursed=Le nécessaire maudit s'est lié à vous et refuse de vous laisser utiliser l'alchimie.
items.artifacts.alchemiststoolkit.desc_warming=Le nécessaire est en train de chauffer et sera prêt à être utilisé après avoir attendu un moment.
items.artifacts.alchemiststoolkit.desc_hint=Le nécessaire équipé génère lentement de l'énergie alchimique à mesure que vous gagnez de l'expérience. On dirait que le fluide dans la fiole peut être amélioré en y ajoutant des cristaux d'énergie.

items.artifacts.artifact.cannot_wear_two=Vous ne pouvez pas porter deux exemplaires du même artefact.
items.artifacts.artifact.equip_cursed=L'artefact se lie à vous douloureusement.
items.artifacts.artifact.curse_known=Vous pouvez sentir une aura malveillante émaner de l'artefact.
items.artifacts.artifact.not_cursed=Cet artefact est dépourvu de toute aura malveillante.
items.artifacts.artifact.need_to_equip=Vous devez équiper votre artéfact pour pouvoir faire cela.

items.artifacts.capeofthorns.name=cape d'épines
items.artifacts.capeofthorns.desc=Ces plaques de métal délabrées venant du DM-300 forment ensemble une cape rigide. Elle semble posséder une énergie inconnue, peut-être des réminiscences du pouvoir du DM-300 ?
items.artifacts.capeofthorns.desc_inactive=Le poids de la cape sur vos épaules vous rassure, il vous semble qu'elle gagne de l'énergie des dégâts que vous subissez.
items.artifacts.capeofthorns.desc_active=Il vous semble que la cape relâche de l'énergie qu'elle avait qu'elle avait emmagasiné, elle irradie d'un pouvoir protecteur.
items.artifacts.capeofthorns$thorns.inert=Votre cape est de nouveau inactive.
items.artifacts.capeofthorns$thorns.radiating=Votre cape commence à irradier de l'énergie, vous vous sentez protégé !
items.artifacts.capeofthorns$thorns.levelup=Votre cape se renforce !
items.artifacts.capeofthorns$thorns.name=épines
items.artifacts.capeofthorns$thorns.desc=Votre cape émet une énergie vous enveloppant dans un champ de force déflecteur !\n\nTous les dégâts reçus sont réduits tant que l'effet des épines est actif. De plus, si l'attaquant est proche de vous, les dégâts prévenus lui sont renvoyés.\n\nTours d'épines restants : %s.

items.artifacts.chaliceofblood.name=calice sanglant
items.artifacts.chaliceofblood.ac_prick=PIQUER
items.artifacts.chaliceofblood.yes=Oui, je sais ce que je fais
items.artifacts.chaliceofblood.no=Non, j'ai changé d'avis
items.artifacts.chaliceofblood.prick_warn=Chaque fois que vous utilisez le calice, celui-ci va aspirer de votre énergie en échange d'une amélioration de votre capacité de régénération naturelle.\n\nVous piquer vous infligera _%1$d-%2$d dégâts_, mais ils peuvent être réduits _par une armure physique ou magique et d'autres effets de réduction de dégâts._ Sans prendre en compte de réduction de dégâts, vous piquer maintenant a _%3$s%% de chances_ d'aspirer complètement votre énergie vitale.\n\nÊtes vous sûr de vouloir lui offrir plus d'énergie ?
items.artifacts.chaliceofblood.onprick=Vous vous êtes piqué, et votre essence de vie coule dans le calice.
items.artifacts.chaliceofblood.ondeath=Le Calice absorbe complètement votre essence vitale...
items.artifacts.chaliceofblood.desc=Ce calice d'argent brillant est étrangement paré de gemmes coupantes sur les bords.
items.artifacts.chaliceofblood.desc_cursed=Le calice maudit s'est lié à votre main et il entrave votre capacité à régénérer votre santé.
items.artifacts.chaliceofblood.desc_1=Alors que vous tenez le calice entre vos mains, vous vous sentez étrangement obligé de vous piquer sur les gemmes pointues.
items.artifacts.chaliceofblood.desc_2=Un peu de votre sang baigne dans le calice, vous sentez subtilement le calice alimenter votre énergie vitale et améliorer votre régénération naturelle. Vous voulez continuer à vous couper sur le calice, même si vous savez que cela va vous blesser.
items.artifacts.chaliceofblood.desc_3=Le calice est plein à ras bord de votre énergie vitale. Vous sentez qu'il vous en redonne.

items.artifacts.cloakofshadows.name=cape des ombres
items.artifacts.cloakofshadows.ac_stealth=FURTIF
items.artifacts.cloakofshadows.cooldown=Votre cape a besoin d'encore %d tours pour être ré-énergisée.
items.artifacts.cloakofshadows.cursed=Vous ne pouvez pas utiliser une cape maudite.
items.artifacts.cloakofshadows.no_charge=Votre cape n'est pas assez chargée pour être utilisée.
items.artifacts.cloakofshadows.desc=Une inestimable cape magique, dérobée à l'armurerie royale de nombreuses années auparavant par le Voleur. Lorsqu'elle est portée, elle peut être utilisée pour se rendre invisible pendant une courte durée.\n\nPlus la cape est utilisée, plus elle deviendra puissante, permettant au Voleur de devenir invisible plus fréquemment et pour des périodes plus longues.
items.artifacts.cloakofshadows.discover_hint=Un des héros commence avec cet objet.
items.artifacts.cloakofshadows$cloakstealth.no_charge=Votre cape a épuisé toute son énergie.
items.artifacts.cloakofshadows$cloakstealth.levelup=Votre cape gagne en puissance !
items.artifacts.cloakofshadows$cloakstealth.name=masqué
items.artifacts.cloakofshadows$cloakstealth.desc=Votre cape des ombres vous rend invisible tant que vous êtes enveloppé dedans. L'effet s'estompe si vous l'annulez ou si la cape n'a plus de charge.\n\nTant que vous êtes invisible, les ennemis sont incapables de vous attaquer ou de vous suivre. Les attaques physiques et les effets magiques (comme les parchemins ou les baguettes) vous font immédiatement sortir de l'invisibilité.\n\nTours avant utilisation d'une charge : %d.

items.artifacts.driedrose.name=rose séchée
items.artifacts.driedrose.ac_summon=INVOQUER
items.artifacts.driedrose.ac_direct=DIRIGER
items.artifacts.driedrose.ac_outfit=TENUE
items.artifacts.driedrose.spawned=Vous avez déjà invoqué le fantôme.
items.artifacts.driedrose.no_charge=Votre rose n'est pas encore entièrement chargée.
items.artifacts.driedrose.cursed=Vous ne pouvez pas utiliser une rose maudite.
items.artifacts.driedrose.no_space=Il n'y a pas d'espace libre près de vous.
items.artifacts.driedrose.charged=Votre rose est complètement chargée !
items.artifacts.driedrose.desc=Est-ce la rose dont le fantôme a parlé avant de disparaître ? Elle semble contenir un pouvoir spirituel, peut-être pourrait-elle être utilisée pour canaliser l'énergie de ce guerrier perdu.
items.artifacts.driedrose.desc_no_quest=Une vieille rose séchée qui tient malgré tout.\n\nElle semble avoir un certain pouvoir spirituel, mais vous n'avez aucune idée de comment l'utiliser en ce moment.
items.artifacts.driedrose.desc_hint=Il semblerait que certains pétales soient manquants. Peut-être que les rattacher renforcera la rose.
items.artifacts.driedrose.desc_cursed=La rose maudite est liée à votre main, qui semble étrangement froide.
items.artifacts.driedrose.desc_weapon=Arme du fantôme : %s
items.artifacts.driedrose.desc_armor=Armure du fantôme : %s
items.artifacts.driedrose.desc_strength=Force du fantôme : %s
items.artifacts.driedrose$petal.name=pétale séché
items.artifacts.driedrose$petal.no_rose=Vous n'avez pas de rose à laquelle ajouter ce pétale.
items.artifacts.driedrose$petal.no_room=Il n'y a plus de place restante pour ce pétale, vous le jetez donc.
items.artifacts.driedrose$petal.maxlevel=La rose est complète !
items.artifacts.driedrose$petal.levelup=Vous ajoutez ce pétale à la rose.
items.artifacts.driedrose$petal.desc=Un pétale fragile et sec, qui a d'une façon ou d'une autre survécu jusqu'à maintenant dans le donjon.
items.artifacts.driedrose$wndghosthero.title=Équipement du Fantôme
items.artifacts.driedrose$wndghosthero.desc=Le fantôme est faible en lui-même, mais sa forme est assez solide pour être équipée d'une arme et d'une armure. Il sera en mesure d'utiliser ces objets comme vous le faites.\n\nLe fantôme peut actuellement équiper des objets nécessitant jusqu'à _%d de force._
items.artifacts.driedrose$wndghosthero.weapon_prompt=Sélectionnez une arme
items.artifacts.driedrose$wndghosthero.armor_prompt=Choisissez une armure
items.artifacts.driedrose$wndghosthero.cant_unique=Le fantôme ne peut pas utiliser d'objet unique.
items.artifacts.driedrose$wndghosthero.cant_cursed=Le fantôme ne peut utiliser des équipements que si vous êtes certains qu'ils ne sont pas maudits.
items.artifacts.driedrose$wndghosthero.cant_strength_unknown=Le fantôme n'est peut-être pas suffisamment fort pour utiliser cela.
items.artifacts.driedrose$wndghosthero.cant_strength=Le fantôme n'est pas suffisamment fort pour utiliser cela.

##ghost hero
items.artifacts.driedrose$ghosthero.name=fantôme triste
items.artifacts.driedrose$ghosthero.def_verb=esquivé
items.artifacts.driedrose$ghosthero.discover_hint=Vous pouvez trouver ce personnage à l'aide d'un artéfact.

items.artifacts.driedrose$ghosthero.hello=Re-bonjour %s.
items.artifacts.driedrose$ghosthero.introduce=Mon âme est liée à cette rose, elle était très précieuse à mes yeux, un cadeau de mon amour que j'ai laissé à la surface.\n\nJe ne peux pas retourner le voir, mais grâce à vous j'ai une seconde chance de poursuivre mon voyage. Quand je le pourrai, je répondrai à votre appel pour me battre avec vous.\n\nAussi longtemps que vous aurez cette rose je vous entendrais donc utilisez-la autant que vous voulez.\n\nJ'espère que vous réussirez là où j'ai échoué...

items.artifacts.driedrose$ghosthero.dialogue_sewers_1=Ces égouts semblent sûrs, des gens ont vécu ici en hiver.
items.artifacts.driedrose$ghosthero.dialogue_sewers_2=Je me demande où sont passées les patrouilles, ont-ils abandonné les lieux ?
items.artifacts.driedrose$ghosthero.dialogue_sewers_3=J'ai encore de la famille à la surface, j'espère qu'ils vont bien.
items.artifacts.driedrose$ghosthero.dialogue_sewers_4=La garde n'a pas pu abattre ces monstres, mais peut-être que nous, si.
items.artifacts.driedrose$ghosthero.dialogue_sewers_5=Mais pourquoi dit-on que ces égouts sont dangereux ? Que peut-il s'y passer…
items.artifacts.driedrose$ghosthero.dialogue_sewers_6=Qu'est-ce qui pourrait avoir rendu ces rats et ces crabes si gros ?
items.artifacts.driedrose$ghosthero.dialogue_prison_1=J'ai entendu des histoires à propos de cet endroit : rien de bon.
items.artifacts.driedrose$ghosthero.dialogue_prison_2=Ce lieu a toujours été une oubliette plus qu'une prison.
items.artifacts.driedrose$ghosthero.dialogue_prison_3=Je ne peux pas imaginer ce qui est arrivé quand ce lieu a été abandonné.
items.artifacts.driedrose$ghosthero.dialogue_prison_4=On dirait qu'à la fois les prisonniers et les gardes se sont changés en monstres.
items.artifacts.driedrose$ghosthero.dialogue_prison_5=Qu'est-ce qui pourrait bien être responsable de tous ces squelettes ?
items.artifacts.driedrose$ghosthero.dialogue_prison_6=Ces gens n'avaient pas à finir comme ça...
items.artifacts.driedrose$ghosthero.dialogue_caves_1=Pas un humain ou un nain n'a mis les pieds ici depuis très longtemps.
items.artifacts.driedrose$ghosthero.dialogue_caves_2=Qu'est-ce qui pourrait faire que des nains abandonnent une mine d'or ?
items.artifacts.driedrose$ghosthero.dialogue_caves_3=C'est dommage que tout l'or ici soit inutile à la surface.
items.artifacts.driedrose$ghosthero.dialogue_caves_4=Les créatures ici sont torturées, comme dans les égouts.
items.artifacts.driedrose$ghosthero.dialogue_caves_5=Ici, même les chauves-souris sont assoiffées de sang.
items.artifacts.driedrose$ghosthero.dialogue_caves_6=Pas de trace d'un quelconque matériel de minage. Les nains ont-ils tout récupéré ?
items.artifacts.driedrose$ghosthero.dialogue_city_1=Les nains étaient travailleurs, mais cupides.
items.artifacts.driedrose$ghosthero.dialogue_city_2=Donc la métropole naine est vraiment tombée.
items.artifacts.driedrose$ghosthero.dialogue_city_3=J'espère que la surface ne finira jamais comme cet endroit.
items.artifacts.driedrose$ghosthero.dialogue_city_4=Les nains ne devraient pas sembler si pâles.
items.artifacts.driedrose$ghosthero.dialogue_city_5=Je ne sais pas ce qui est pire; les nains, ou leurs créations ?
items.artifacts.driedrose$ghosthero.dialogue_city_6=Ils semble que les nains soient désormais des monstres déraisonnés.
items.artifacts.driedrose$ghosthero.dialogue_halls_1=Quel est cet endroit ?
items.artifacts.driedrose$ghosthero.dialogue_halls_2=Ce lieu est terrifiant...
items.artifacts.driedrose$ghosthero.dialogue_halls_3=Que pensaient les nains, à jouer avec un pouvoir pareil ?
items.artifacts.driedrose$ghosthero.dialogue_halls_4=Ces monstres ne sont pas de ce monde, d'où sont-ils venus ?
items.artifacts.driedrose$ghosthero.dialogue_halls_5=Peux-tu le sentir ? C'est comme si quelque chose nous regardait.
items.artifacts.driedrose$ghosthero.dialogue_halls_6=Dieu merci il y a des torches, il fait si sombre ici !
items.artifacts.driedrose$ghosthero.dialogue_ascension_1=Qu'est-ce qui se passe, je pensais que nous avions réussi ?
items.artifacts.driedrose$ghosthero.dialogue_ascension_2=Comment cette chose peut-elle encore influencer ce monde ?
items.artifacts.driedrose$ghosthero.dialogue_ascension_3=J'espère que vous savez ce que vous faites avec cette amulette.
items.artifacts.driedrose$ghosthero.dialogue_ascension_4=Je suppose que nous n'en avons pas encore fini.
items.artifacts.driedrose$ghosthero.dialogue_ascension_5=Nous sommes déjà arrivés si loin, nous pouvons finir ceci !
items.artifacts.driedrose$ghosthero.dialogue_ascension_6=Encore un peu plus loin, nous pouvons réussir à sortir d'ici !

items.artifacts.driedrose$ghosthero.seen_goo_1=Prends garde au Goo !
items.artifacts.driedrose$ghosthero.seen_goo_2=Beaucoup de mes amis sont morts à cause de cette chose, c'est l'heure de la vengeance !
items.artifacts.driedrose$ghosthero.seen_goo_3=Une pareille abomination ne peut pas être autorisée à vivre !
items.artifacts.driedrose$ghosthero.seen_tengu_1=Le seul prisonnier restant est un assassin meurtrier. Bien sûr...
items.artifacts.driedrose$ghosthero.seen_tengu_2=Il nous a piégés !
items.artifacts.driedrose$ghosthero.seen_tengu_3=J'ai entendu des histoires d'horreur sur ce masque...
items.artifacts.driedrose$ghosthero.seen_dm300_1=Il n'y a que les nains pour construire une machine minière qui tue les intrus.
items.artifacts.driedrose$ghosthero.seen_dm300_2=Cette chose est énorme...
items.artifacts.driedrose$ghosthero.seen_dm300_3=Comment cette chose est-elle restée en activité si longtemps ?
items.artifacts.driedrose$ghosthero.seen_king_1=Quand les gens disent que le pouvoir corrompt, c'est cela qu'ils désignent.
items.artifacts.driedrose$ghosthero.seen_king_2=Il tient plus d'une liche que d'un roi désormais.
items.artifacts.driedrose$ghosthero.seen_king_3=Même dans la mort les nains obéissent à leur maître.
items.artifacts.driedrose$ghosthero.seen_yog_1=Oh… Je le sens mal.
items.artifacts.driedrose$ghosthero.seen_yog_2=C'est à ça que ressemble un Dieu ?
items.artifacts.driedrose$ghosthero.seen_yog_3=Ça va faire mal…

items.artifacts.driedrose$ghosthero.defeated_by_enemy_1=Bonne chance…
items.artifacts.driedrose$ghosthero.defeated_by_enemy_2=Je suis fatigué…
items.artifacts.driedrose$ghosthero.defeated_by_enemy_3=Je reviendrai…
items.artifacts.driedrose$ghosthero.defeated_by_boss_1=Désolé… Bonne chance...
items.artifacts.driedrose$ghosthero.defeated_by_boss_2=Finissez donc… Sans moi…
items.artifacts.driedrose$ghosthero.defeated_by_boss_3=Non… Je ne peux pas…
items.artifacts.driedrose$ghosthero.blessed_ankh_1=Comment avez vous survécu à ça ?
items.artifacts.driedrose$ghosthero.blessed_ankh_2=J'aimerais bien en avoir un…
items.artifacts.driedrose$ghosthero.blessed_ankh_3=Oh mon Dieu ! Tu es toujours en vie !
items.artifacts.driedrose$ghosthero.player_killed_1=Non ! ...
items.artifacts.driedrose$ghosthero.player_killed_2=Je n'ai pas pu les aider....
items.artifacts.driedrose$ghosthero.player_killed_3=Pas comme ça....

items.artifacts.driedrose$ghosthero.direct_prompt=Que dois-je faire ?
items.artifacts.driedrose$ghosthero.directed_follow_1=D'accord, je vous suis.
items.artifacts.driedrose$ghosthero.directed_follow_2=Je reste derrière vous.
items.artifacts.driedrose$ghosthero.directed_follow_3=Je vous suis...
items.artifacts.driedrose$ghosthero.directed_follow_4=D'accord, allons-y !
items.artifacts.driedrose$ghosthero.directed_follow_5=J'assure vos arrières.
items.artifacts.driedrose$ghosthero.directed_attack_1=D'accord, je vais attaquer celui-là.
items.artifacts.driedrose$ghosthero.directed_attack_2=Je vais l'avoir.
items.artifacts.driedrose$ghosthero.directed_attack_3=J'engage...
items.artifacts.driedrose$ghosthero.directed_attack_4=Allons les chercher !
items.artifacts.driedrose$ghosthero.directed_attack_5=Je l'ai eu.
items.artifacts.driedrose$ghosthero.directed_position_1=D'accord, je garde cette position.
items.artifacts.driedrose$ghosthero.directed_position_2=Je vais aller là et défendre.
items.artifacts.driedrose$ghosthero.directed_position_3=Repositionnement...
items.artifacts.driedrose$ghosthero.directed_position_4=En chemin !
items.artifacts.driedrose$ghosthero.directed_position_5=Je vais aller par là.

items.artifacts.driedrose$ghosthero.desc=Une figure frêle et éthérée avec une forme humanoïde. Son pouvoir semble lié à la rose que vous avez.\n\nCe fantôme n’est peut-être pas grand-chose, mais iel semble être votre seul vrai ami ici-bas.

##back to artifacts
items.artifacts.etherealchains.name=chaînes éthérées
items.artifacts.etherealchains.ac_cast=JETER
items.artifacts.etherealchains.rooted=Vos chaînes ne peuvent pas vous tirer lorsque vous êtes enraciné.
items.artifacts.etherealchains.no_charge=Vos chaînes n'ont pas assez de charge.
items.artifacts.etherealchains.cursed=Vous ne pouvez pas utiliser des chaînes maudites.
items.artifacts.etherealchains.does_nothing=Cela ne fera rien.
items.artifacts.etherealchains.cant_pull=Vos chaînes ne peuvent pas tirer votre cible.
items.artifacts.etherealchains.cant_reach=Vos chaînes ne peuvent pas atteindre cet endroit.
items.artifacts.etherealchains.inside_wall=Vos chaînes ne peuvent que vous tirer à travers les murs, pas vous y déposer.
items.artifacts.etherealchains.nothing_to_grab=Il n'y a rien à attraper.
items.artifacts.etherealchains.prompt=Choisissez un endroit à viser.
items.artifacts.etherealchains.desc=Ces grandes chaînes légères brillent d'une énergie spirituelle. Elles peuvent être utilisées afin de vous tirer vers un endroit ou de tirer vos ennemis vers vous. La nature éthérée de ces chaînes vous permet même de les étendre à travers les murs !
items.artifacts.etherealchains.desc_cursed=Les chaînes maudites sont bloquées à vos côtés, se balançant constamment, essayant de vous faire tomber ou de vous attacher.
items.artifacts.etherealchains.desc_equipped=La chaîne repose à vos côtés, siphonnant doucement l'énergie spirituelle de ceux que vous avez vaincu. Chaque charge est un maillon de la chaîne qui s'étendra d'exactement une case.
items.artifacts.etherealchains$chainsrecharge.levelup=Votre chaîne se renforce !

items.artifacts.holytome.name=tome sacré
items.artifacts.holytome.ac_cast=UTILISER
items.artifacts.holytome.no_spell=Vous ne pouvez pas lancer ce sort maintenant.
items.artifacts.holytome.cursed=Vous ne pouvez pas utiliser un tome maudit.
items.artifacts.holytome.levelup=Votre tome se renforce !
items.artifacts.holytome.desc=Un tome sacré utile comme catalyseur pour la magie divine du Clerc. Utiliser le tome permet au Clerc de lancer une grande variété de sorts.\n\nLe tome deviendra de plus en plus puissant en étant utilisé, ce qui augmente son nombre de charges maximum et améliore légèrement sa vitesse de recharge.
items.artifacts.holytome.discover_hint=Un des héros commence avec cet objet.

items.artifacts.hornofplenty.name=corne d'abondance
items.artifacts.hornofplenty.ac_snack=GRIGNOTER
items.artifacts.hornofplenty.ac_eat=MANGER
items.artifacts.hornofplenty.ac_store=STOCKER
items.artifacts.hornofplenty.eat=Vous mangez la nourriture de la corne.
items.artifacts.hornofplenty.prompt=Sélectionnez de la nourriture
items.artifacts.hornofplenty.no_food=Votre corne n'a pas encore produit de nourriture !
items.artifacts.hornofplenty.full=Votre corne est remplie de nourriture !
items.artifacts.hornofplenty.reject=La corne rejette le fruifade cru.
items.artifacts.hornofplenty.maxlevel=Votre corne ne peut plus contenir de nourriture supplémentaire !
items.artifacts.hornofplenty.levelup=La corne consomme votre offrande et devient plus puissante !
items.artifacts.hornofplenty.feed=La corne consomme votre offrande de nourriture.
items.artifacts.hornofplenty.desc=On ne peut pas souffler dans cette corne, mais en revanche elle semble se remplir de nourriture à mesure que vous explorez et gagnez de l'expérience. Vous pouvez consommer chaque charge individuellement en grignotant, ou manger jusqu'à satiété.
items.artifacts.hornofplenty.desc_hint=Peut-être y a-t-il un moyen d'augmenter le pouvoir de la corne en lui donnant l'énergie de votre nourriture.
items.artifacts.hornofplenty.desc_cursed=La corne maudite s'est attaché à votre flanc, elle semble plus avide de votre nourriture qu'elle ne peut en produire.

items.artifacts.lloydsbeacon.name=balise de Lloyd
items.artifacts.lloydsbeacon.ac_zap=UTILISER
items.artifacts.lloydsbeacon.ac_set=FIXER
items.artifacts.lloydsbeacon.ac_return=RETOURNER
items.artifacts.lloydsbeacon.no_charge=Votre balise manque d'énergie pour l'instant.
items.artifacts.lloydsbeacon.tele_fail=Votre sort de téléportation échoue.
items.artifacts.lloydsbeacon.prompt=Choisissez où jeter le sort.
items.artifacts.lloydsbeacon.levelup=Votre balise devient plus puissante !
items.artifacts.lloydsbeacon.preventing=La puissante magie imprégnant cet endroit vous empêche d'utiliser la balise de Lloyd !
items.artifacts.lloydsbeacon.creatures=L'aura psychique des créatures avoisinantes empêche la balise de Lloyd de fonctionner.
items.artifacts.lloydsbeacon.return=La balise de Lloyd s'est correctement réglée sur votre emplacement actuel, vous pouvez désormais revenir ici à tout moment.
items.artifacts.lloydsbeacon.desc=La balise de Lloyd est un instrument magique complexe qui confère à son porteur le pouvoir de la téléportation. La balise peut être utilisée pour revenir à un endroit défini, mais elle peut également lancer des éclats de magie téléportatrice une fois qu'elle s'est rechargée à force d'être équipée. Cette magie peut être utilisée sur une cible ou sur vous-même.
items.artifacts.lloydsbeacon.desc_set=Cette balise a été réglée quelque part dans le niveau %d de Pixel Dungeon.

items.artifacts.masterthievesarmband.name=brassard de maître voleur
items.artifacts.masterthievesarmband.ac_steal=VOLER
items.artifacts.masterthievesarmband.no_charge=Votre brassard n'a pas assez de charge.
items.artifacts.masterthievesarmband.cursed=Vous ne pouvez pas utiliser un brassard maudit.
items.artifacts.masterthievesarmband.full=Votre brassard est totalement chargé !
items.artifacts.masterthievesarmband.prompt=Choisissez un ennemi à cibler
items.artifacts.masterthievesarmband.no_target=Vous devez cibler un ennemi adjacent à vous.
items.artifacts.masterthievesarmband.steal_shopkeeper=Vous ne pouvez pas voler le marchant directement.
items.artifacts.masterthievesarmband.no_steal=Cet ennemi ne possède rien à voler.
items.artifacts.masterthievesarmband.stole_item=Vous volez un objet : %s.
items.artifacts.masterthievesarmband.failed_steal=Vous n'avez rien réussi à voler.
items.artifacts.masterthievesarmband.level_up=Votre brassard s'est renforcé !
items.artifacts.masterthievesarmband.desc=Ce brassard de velours violet porte la marque d'un maître voleur. Il ne vous appartient pas, mais il n'appartenait probablement pas à son précédent porteur.
items.artifacts.masterthievesarmband.desc_cursed=Le brassard maudit est attaché à votre poignet et, d'une manière ou d'une autre, votre bourse d'or semble lentement s'alléger ...
items.artifacts.masterthievesarmband.desc_worn=Vous sentez le pouvoir du brassard se former autour de votre poignet à mesure que vous gagnez de l'expérience. Vous pouvez utiliser ce pouvoir pour voler au marché, ou détrousser vos ennemis !\n\nDétrousser un ennemi se fait instantanément, les désorientant brièvement, et vous donnant une chance de leur voler un objet ! Ce pouvoir est plus efficace contre les ennemis inconscients de votre présence. Voler le même ennemi plusieurs fois ne vous donne pas plus de chances d'obtenir un butin.

items.artifacts.sandalsofnature.name=sandales de la nature
items.artifacts.sandalsofnature.name_1=chaussures de la nature
items.artifacts.sandalsofnature.name_2=bottes de la nature
items.artifacts.sandalsofnature.name_3=jambières de la nature
items.artifacts.sandalsofnature.ac_feed=NOURRIR
items.artifacts.sandalsofnature.ac_root=ENRACINER
items.artifacts.sandalsofnature.prompt=Sélectionnez une graine à jeter
items.artifacts.sandalsofnature.levelup=Vos chaussures grandissent brusquement !
items.artifacts.sandalsofnature.absorb_seed=Les chaussures absorbent la graine, elles semblent en meilleur état.
items.artifacts.sandalsofnature.no_effect=Vous devez d'abord donner une graine à votre chaussure.
items.artifacts.sandalsofnature.low_charge=Votre chaussure n'a pas assez d'énergie pour cela.
items.artifacts.sandalsofnature.prompt_target=Sélectionnez un endroit
items.artifacts.sandalsofnature.out_of_range=Cet endroit est hors de portée.
items.artifacts.sandalsofnature.desc_1=Ce qui semble de prime abord être des sandales faites de ficelles sont en fait deux plantes ! Elles semblent faibles et pâles, peut-être ont-elles besoin de nutriments ?
items.artifacts.sandalsofnature.desc_2=Les sandales ont grandi et ressemblent maintenant plus à des chaussures taillées sur mesure. Elles sont aussi plus colorées, peut-être peuvent-elles encore grandir ?
items.artifacts.sandalsofnature.desc_3=Les plantes ont encore grandi et ressemblent maintenant à une paire de bottes solides faites d'écorces. Les plantes semblent avoir récupéré leur puissance, mais peuvent-elles encore grandir ?
items.artifacts.sandalsofnature.desc_4=Les plantes semblent avoir atteint leur taille maximale, elles ressemblent à une paire de jambières blindées. Elles sont d'un marron profond comme le tronc d'un arbre robuste.
items.artifacts.sandalsofnature.desc_hint=Vous vous sentez plus proche de la nature en portant cet artefact.
items.artifacts.sandalsofnature.desc_cursed=Les sandales maudites empêchent toute harmonie avec la nature.
items.artifacts.sandalsofnature.desc_ability=Les chaussures brillent dans la couleur de la dernière graine que vous leur avez donnée. Elles peuvent brièvement s'enraciner et produire l'effet de cette plante dans un rayon de 3 cases.\nGraine : _%s_\nCharge nécessaire : _%d%%_
items.artifacts.sandalsofnature.desc_seeds=Vous avez nourri les chaussures avec %d graine(s).

items.artifacts.skeletonkey.name=clef squelette
items.artifacts.skeletonkey.ac_insert=INSERER
items.artifacts.skeletonkey.cursed=Vous ne pouvez pas utiliser une clef squelette maudite.
items.artifacts.skeletonkey.prompt=Choisissez une cible
items.artifacts.skeletonkey.invalid_target=Il n'y a rien à verrouiller ou déverrouiller ici.
items.artifacts.skeletonkey.lock_no_space=Vous ne pouvez pas bloquer un personnage à l'intérieur d'une porte !
items.artifacts.skeletonkey.iron_charges=Ouvrir une serrure normale demande 1 charge.
items.artifacts.skeletonkey.gold_charges=Ouvrir une serrure dorée demande 2 charges.
items.artifacts.skeletonkey.lock_charges=Verrouiller une porte demande 2 charges.
items.artifacts.skeletonkey.wall_charges=Créer un mur temporaire coûtera deux charges.
items.artifacts.skeletonkey.crystal_charges=Ouvrir une serrure en cristal demande 5 charges.
items.artifacts.skeletonkey.wont_open=Étrangement, la clé ne rentre pas dans ce verrou.
items.artifacts.skeletonkey.locked_with_key=Cette porte a été verrouillée par votre clé squelette.
items.artifacts.skeletonkey.force_lock=Le verrou est affaibli sans votre clef squelette. Vous parvenez à l'ouvrir.
items.artifacts.skeletonkey.discard=Vous jetez vos clés en trop.
items.artifacts.skeletonkey.levelup=Votre clef squelette se renforce !
items.artifacts.skeletonkey.desc=Une clef remarquable avec une tête en forme de crane. Ses dents semblent différentes à chaque fois que vous les regardez.
items.artifacts.skeletonkey.desc_worn=Cette clef magique semble gagner en puissance quand vous l'utilisez à la place des clés habituelles du donjon. Elle s'adapte à presque toutes les serrures du donjon et peut tout aussi bien les ouvrir que les fermer. Cela fonctionne même avec les portes qui n'ont jamais été verrouillées auparavant.\n\nCette clef peut aussi être utilisée sur un emplacement libre dans une direction cardinale ou diagonale pour "verrouiller" l'air devant vous, créant un mur de 3 cases de large pendant 10 tours. Le verrouillage repoussera les ennemis s'il y a de la place pour le faire.
items.artifacts.skeletonkey.desc_cursed=La clef maudite semble tout faire pour ne pas rentrer dans les serrures, et rend difficile (mais pas impossible) l'utilisation de vos autres clés.
items.artifacts.skeletonkey$keywall.desc=Un mur magique temporaire a été placé ici grâce à la clef squelette.

items.artifacts.talismanofforesight.name=talisman de prescience
items.artifacts.talismanofforesight.ac_scry=VOIR
items.artifacts.talismanofforesight.low_charge=Le talisman nécessite une charge d'au moins 5 % pour scruter.
items.artifacts.talismanofforesight.prompt=Choisissez un lieu à scruter.
items.artifacts.talismanofforesight.levelup=Votre talisman s'est renforcé !
items.artifacts.talismanofforesight.full_charge=Votre talisman est totalement chargé !
items.artifacts.talismanofforesight.desc=Une pierre lisse avec d'étranges gravures dessus. Vous avez l'impression qu'elle surveille tout ce qui vous entoure, qu'elle garde un œil sur tout ce qui est caché.
items.artifacts.talismanofforesight.desc_worn=Quand vous tenez le talisman, vous avez l'impression que vos sens sont intensifiés. Le talisman se charge lentement au fil du temps et lorsque vous découvrez des portes ou des pièges cachés.\n\nLe talisman peut déployer sa charge pour "scruter" une zone en forme de cône, qui révèle tous les tuiles et secrets de la zone scannée, et vous permet de voir les ennemis et les objets pendant un court instant.
items.artifacts.talismanofforesight.desc_cursed=Le talisman maudit vous regarde intensément, affaiblissant vos sens.
items.artifacts.talismanofforesight$foresight.name=prévoyance
items.artifacts.talismanofforesight$foresight.uneasy=Vous vous sentez mal à l'aise.
items.artifacts.talismanofforesight$foresight.desc=Vous êtes très nerveux, comme si un danger invisible était proche.

items.artifacts.timekeepershourglass.name=sablier de gardien du temps
items.artifacts.timekeepershourglass.ac_activate=ACTIVER
items.artifacts.timekeepershourglass.deactivate=Le temps reprend son cours.
items.artifacts.timekeepershourglass.no_charge=Votre sablier n'est pas suffisamment rechargé pour être utilisé maintenant.
items.artifacts.timekeepershourglass.cursed=Vous ne pouvez pas utiliser un sablier maudit.
items.artifacts.timekeepershourglass.onstasis=Le monde autour de vous semble changer en un instant.
items.artifacts.timekeepershourglass.onfreeze=Tout se fige subitement autour de vous.
items.artifacts.timekeepershourglass.stasis=Me mettre en stase
items.artifacts.timekeepershourglass.freeze=Geler le temps autour de moi
items.artifacts.timekeepershourglass.prompt=Comment aimeriez-vous utiliser la magie du sablier ? \n\nEn stase, le temps se déroule normalement mais vous êtes gelé et totalement invulnérable. Cela consomme 2 charges d'un coup.\n\nQuand le temps est figé, vous bougez comme si vos actions ne prenaient pas de temps. Pour stopper cet effet, attaquez ou utilisez le sablier.
items.artifacts.timekeepershourglass.desc=Ce grand sablier orné a l'air modeste, cependant vous sentez un grand pouvoir dans sa structure finement ciselée. Alors que vous observez le sable s'écouler vous sentez sa magie vous titiller, l'utilisation de cette magie va certainement vous donner un contrôle sur le temps.
items.artifacts.timekeepershourglass.desc_hint=Le sablier semble avoir perdu du sable, si seulement vous pouviez en trouver...
items.artifacts.timekeepershourglass.desc_cursed=Le sablier maudit est fixé à vos côtés, vous pouvez sentir qu'il tente de manipuler le temps qui passe.
items.artifacts.timekeepershourglass$timefreeze.name=Arrêt Temporel
items.artifacts.timekeepershourglass$timefreeze.desc=Le temps s'est arrêté autour de vous, vous permettant d'effectuer des actions instantanément. L'effet persiste jusqu'à son annulation ou que votre votre sablier manque de charge. Attaquer ou utiliser la magie annule aussi cet effet.\n\nTours avant utilisation d'une charge : %s.
items.artifacts.timekeepershourglass$sandbag.name=sachet de sable magique
items.artifacts.timekeepershourglass$sandbag.levelup=Vous ajoutez le sable à votre sablier.
items.artifacts.timekeepershourglass$sandbag.maxlevel=Votre sablier est rempli de sable magique !
items.artifacts.timekeepershourglass$sandbag.no_hourglass=Vous n'avez pas de sablier pour y mettre ce sable.
items.artifacts.timekeepershourglass$sandbag.desc=Ce petit sac de sable fin s'incorporera parfaitement dans votre sablier.\n\nC'est étrange que le marchand possède cet objet justement quand vous en avez besoin...

items.artifacts.unstablespellbook.name=livre de sorts instable
items.artifacts.unstablespellbook.ac_read=LIRE
items.artifacts.unstablespellbook.ac_add=AJOUTER
items.artifacts.unstablespellbook.blinded=Vous ne pouvez pas lire le livre tant que vous êtes aveugle.
items.artifacts.unstablespellbook.no_charge=Votre livre de sorts n'a plus d'énergie pour l'instant.
items.artifacts.unstablespellbook.cursed=Vous ne pouvez pas lire un livre de sort maudit.
items.artifacts.unstablespellbook.prompt=Sélectionnez un parchemin
items.artifacts.unstablespellbook.infuse_scroll=Vous insufflez l'énergie du parchemin dans le livre.
items.artifacts.unstablespellbook.unable_scroll=Vous ne pouvez pas ajouter ce parchemin au livre.
items.artifacts.unstablespellbook.unknown_scroll=Vous ne connaissez pas encore le pouvoir de ce parchemin.
items.artifacts.unstablespellbook.desc=Ce livre est en très bon état pour son âge. Il scintille et crépite quand vous bougez les pages, dégageant une énergie instable. Si vous lisez ce livre, vous ne savez pas quel sort vous pourriez lancer.
items.artifacts.unstablespellbook.desc_cursed=Le livre maudit s'est lié à vous, il vous empêche de lire la plupart des parchemins.
items.artifacts.unstablespellbook.desc_index=Le livre est incomplet. L'index pointe actuellement aux pages blanches suivantes :
items.artifacts.unstablespellbook.desc_empowered=Les parchemins que vous avez ajoutés au livre brillent de pouvoir. Vous pourrez choisir la version exotique de l'effet du parchemin, mais cela vous coûtera une charge supplémentaire.
items.artifacts.unstablespellbook.read_empowered=Le parchemin que vous avez ajouté au livre de sorts afflue d'energie. Vous pouvez canaliser soit la variante régulière de l'effet de ce parchemin, soit la variante exotique.\n\nChoisir la variante exotique va consommer 2 charges a la place de 1.



###bags
items.bags.bag.name=sac à dos
items.bags.bag.discover_hint=Vous pouvez acheter cet objet dans un magasin.

items.bags.potionbandolier.name=cartouchière pour potions
items.bags.potionbandolier.desc=Cette bandoulière épaisse s'ajuste autour de votre poitrine comme une ceinture. Elle comporte de nombreuses sangles isolées pour contenir bon nombre de vos potions, votre outre ou vos extraits de métal liquide.\n\nÀ l’intérieur de la bandoulière, vos potions devraient être protégées du froid.

items.bags.scrollholder.name=étui à parchemins
items.bags.scrollholder.desc=Ce conteneur tubulaire semble être conçu pour les outils et les cartes d'un astronome, mais vos parchemins y trouveront tout à fait leur place. Il y a même quelques compartiments latéraux qui conviendraient parfaitement aux cristaux de sorts, aux stylets arcaniques et à la résine arcanique.\n\nLe support ne semble pas être inflammable, vos parchemins seront donc à l'abri du feu à l'intérieur.

items.bags.velvetpouch.name=bourse de velours
items.bags.velvetpouch.desc=Cette petite pochette en velours peut stocker de nombreux petits objets, tels que des graines, des pierres runiques et certains ingrédients d'alchimie.
items.bags.velvetpouch.discover_hint=Un des héros commence avec cet objet.

items.bags.magicalholster.name=carquois magique
items.bags.magicalholster.desc=Ce carquois fin est fait à partir de la peau de quelque animal exotique et possède une magie puissante qui lui permet de stocker une énorme quantité d'armes à distance.\n\nVous pouvez simplement plonger la main dans ce sac et vous en sortirez toujours l'objet que vous cherchez.\n\nGrâce à la magie du carquois, les baguettes chargent légèrement plus vite et les projectiles durent légèrement plus longtemps.



###bombs
items.bombs.arcanebomb.name=bombe arcanique
items.bombs.arcanebomb.desc=Cette bombe a été imprégnée de propriétés magiques. Elle explosera en une puissante déflagration similaire à l'attaque du Goo, infligeant _%1$d-%2$d dégâts magiques_ dans un rayon de 2 cases.
items.bombs.arcanebomb.discover_hint=Vous pouvez fabriquer cet objet via l'alchimie.

items.bombs.bomb.name=bombe
items.bombs.bomb.ac_lightthrow=ALLUMER & JETER
items.bombs.bomb.snuff_fuse=Vous avez rapidement éteint la mèche de la bombe.
items.bombs.bomb.ondeath=L’explosion vous a tué...
items.bombs.bomb.rankings_desc=Tué par une explosion
items.bombs.bomb.desc=Une bombe de poudre noire plutôt lourde. Une explosion de cette bombe inflige _%1$d-%2$d dégâts_ à tout ce qui est à côté et détruit les terrains ou objets voisins.
items.bombs.bomb.desc_fuse=Il semble que la mèche va prendre quelques tours pour brûler une fois allumée.
items.bombs.bomb.desc_burning=La mèche de la bombe est entrain de brûler, gardez vos distances ou éteignez la !
items.bombs.bomb$doublebomb.name=deux bombes
items.bombs.bomb$doublebomb.desc=Une pile de deux grosses bombes à poudre noire. Deux pour le prix d'une !

items.bombs.firebomb.name=bombe incendiaire
items.bombs.firebomb.desc=Cette bombe a été modifiée pour exploser dans une large zone, infligeant _%1$d-%2$d dégâts_ et répandant une flamme persistante dans un rayon de 2 cases.
items.bombs.firebomb.discover_hint=Vous pouvez fabriquer cet objet via l'alchimie.

items.bombs.flashbangbomb.name=bombe aveuglante
items.bombs.flashbangbomb.desc=Cette bombe modifiée explosera en une rafale de lumière, de son et d’électricité. Tout ce qui se trouve dans un rayon de 2 cases recevra _%1$d-%2$d dégâts_ de l'explosion, des dégâts électriques supplémentaires de 25%%, et sera paralysé pendant 10 tours.
items.bombs.flashbangbomb.discover_hint=Vous pouvez fabriquer cet objet via l'alchimie.

items.bombs.frostbomb.name=bombe de glace
items.bombs.frostbomb.desc=Cette bombe a été modifiée pour exploser dans une zone plus large, infligeant _%1$d-%2$d dégâts_ et répandant une rafale persistante d'air glacial dans un rayon de 2 cases.
items.bombs.frostbomb.discover_hint=Vous pouvez fabriquer cet objet via l'alchimie.

items.bombs.holybomb.name=bombe sainte
items.bombs.holybomb.desc=Cette bombe a été modifiée pour émettre un éclair de lumière sacrée dans une large zone en explosant. Tout ce qui se trouve dans un rayon de 2 cases recevra _%1$d-%2$d dégâts_ de l'explosion, et les ennemis morts-vivants ou démoniaques recevront 50%% dégâts supplémentaires de la lumière sacrée.
items.bombs.holybomb.discover_hint=Vous pouvez fabriquer cet objet via l'alchimie.

items.bombs.noisemaker.name=leurre
items.bombs.noisemaker.desc=Cette bombe modifiée va faire sans cesse du bruit après avoir été amorcée. Quand quelque chose la touche, elle explose et inflige _%1$d-%2$d dégâts_ dans un rayon de 2 cases !
items.bombs.noisemaker.desc_burning=Le leurre retentit, il explosera lorsque quelque chose s'en rapprochera !
items.bombs.noisemaker.discover_hint=Vous pouvez fabriquer cet objet via l'alchimie.

items.bombs.smokebomb.name=bombe fumigène
items.bombs.smokebomb.desc=Cette bombe a été modifiée pour libérer un nuage de gaz pendant l'explosion. Elle inflige _%1$d-%2$d dégâts_ et libère un nuage opaque sur les 2 cases autour.
items.bombs.smokebomb.discover_hint=Vous pouvez fabriquer cet objet via l'alchimie.

items.bombs.regrowthbomb.name=bombe d'engrais
items.bombs.regrowthbomb.desc=Cette bombe modifiée répandra de l'engrais créateur de vie partout dans un rayon de 3 cases au lieu d'exploser. La zone prise dans la détonation germera rapidement en herbe et en plantes. Vous ainsi que vos alliés pris dans la détonation guériront comme s'ils avaient bu une potion de guérison.
items.bombs.regrowthbomb.discover_hint=Vous pouvez fabriquer cet objet via l'alchimie.

items.bombs.shrapnelbomb.name=bombe à fragmentation
items.bombs.shrapnelbomb.desc=Cette bombe a été modifiée avec des éclats de métal de DM-300, qui se fragmentera et s'envolera partout lors de l'explosion, infligeant _%1$d-%2$d dégâts_ à longue portée autour de la bombe. Vous feriez mieux de vous cacher derrière quelque chose lorsque vous l'utilisez...
items.bombs.shrapnelbomb.discover_hint=Vous pouvez fabriquer cet objet via l'alchimie.

items.bombs.woollybomb.name=bombe laineuse
items.bombs.woollybomb.desc=Cette bombe modifiée créera un troupeau de moutons magiques après l'explosion. L'explosion infligera _%1$d-%2$d dégâts_ dans un rayon de 2 cases. Les moutons bloqueront le mouvement et resteront longtemps ! Les moutons ne dureront cependant pas longtemps en présence d'ennemis puissants, et peuvent être révoqués manuellement plus tôt en interagissant avec eux.
items.bombs.woollybomb.discover_hint=Vous pouvez fabriquer cet objet via l'alchimie.

###food
items.food.berry.name=baie de donjon
items.food.berry.eat_msg=Cette baie était savoureuse !
items.food.berry.desc=Cette petite baie a été trouvée par la Chasseresse parmi la végétation du donjon. Elle peut être mangée rapidement, redonne un peu de satiété et peut contenir une graine utilisable !
items.food.berry.discover_hint=Vous pouvez trouver cet objet à l'aide d'un talent de héros.

items.food.blandfruit.name=fruifade
items.food.blandfruit.cooked=fruitfade cuisiné
items.food.blandfruit.sunfruit=fruit radieux
items.food.blandfruit.rotfruit=fruit pourri
items.food.blandfruit.earthfruit=fruit de terre
items.food.blandfruit.blindfruit=fruit aveuglant
items.food.blandfruit.firefruit=fruit brûlant
items.food.blandfruit.icefruit=fruit gelé
items.food.blandfruit.fadefruit=fruit volatil
items.food.blandfruit.sorrowfruit=fruit de chagrin
items.food.blandfruit.stormfruit=fruit orageux
items.food.blandfruit.dreamfruit=fruit de mage
items.food.blandfruit.starfruit=fruit des étoiles
items.food.blandfruit.swiftfruit=vivebaie
items.food.blandfruit.raw=Vous ne supportez pas de le manger cru.
items.food.blandfruit.desc=Bien trop sec et fade, peut être que le faire cuire avec un autre ingrédient l'améliorerait.
items.food.blandfruit.desc_cooked=Le fruit s'est imbibé depuis qu'il trempe dans le chaudron et a même absorbé les propriétés de la graine avec laquelle il a été cuit. Il aura les effets de la potion correspondant à la graine.
items.food.blandfruit.desc_eat=On dirait que c'est prêt !
items.food.blandfruit.desc_throw=Cela semble plutôt instable, il vaudrait peut-être mieux le jeter.
items.food.blandfruit$chunks.name=morceaux de fruifade
items.food.blandfruit$chunks.desc=Le fruifade a explosé à l'impact, ne laissant que des morceaux inertes.\n\nMalgré la poussière, ces gros morceaux de fruifade cuit semblent parfaitement comestibles.

items.food.chargrilledmeat.name=viande grillée
items.food.chargrilledmeat.desc=Ça ressemble à un steak correct.
items.food.chargrilledmeat.discover_hint=Vous pouvez le fabriquer à partir d'un autre objet de nourriture.

items.food.food.name=ration de nourriture
items.food.food.ac_eat=MANGER
items.food.food.eat_msg=Cette nourriture était excellente !
items.food.food.desc=Rien de magnifique : de la viande séchée, quelques biscuits... ce genre de choses.

items.food.frozencarpaccio.name=carpaccio gelé
items.food.frozencarpaccio.invis=Vous voyez vos mains devenir invisibles !
items.food.frozencarpaccio.hard=Vous sentez votre peau se durcir !
items.food.frozencarpaccio.refresh=Rafraîchissant !
items.food.frozencarpaccio.better=Vous vous sentez mieux !
items.food.frozencarpaccio.desc=C'est un morceau de viande crue congelée. La seule façon de le manger est de le couper en fines tranches. Et de cette manière c'est étonnamment bon.
items.food.frozencarpaccio.discover_hint=Vous pouvez le fabriquer à partir d'un autre objet de nourriture.

items.food.meatpie.name=tourte à la viande
items.food.meatpie.eat_msg=Cette nourriture était incroyable !
items.food.meatpie.desc=Une délicieuse tourte pleine de viande savoureuse. Votre satiété sera bien plus longue que d'ordinaire.
items.food.meatpie.discover_hint=Vous pouvez fabriquer cet objet via l'alchimie.

items.food.mysterymeat.name=viande mystérieuse
items.food.mysterymeat.eat_msg=Cette nourriture avait un goût... étrange.
items.food.mysterymeat.hot=Oh ! C'est chaud !
items.food.mysterymeat.legs=Vous ne sentez plus vos jambes !
items.food.mysterymeat.not_well=Vous ne vous sentez pas bien.
items.food.mysterymeat.stuffed=Vous êtes repu.
items.food.mysterymeat.desc=Mangez à vos risques et périls !
items.food.mysterymeat.discover_hint=Vous pouvez trouver cet objet en tuant certains ennemis.
items.food.mysterymeat$placeholder.name=viande

items.food.phantommeat.name=viande fantomatique
items.food.phantommeat.desc=Un gros steak chatoyant et translucide, taillé dans un piranha fantomatique. Cette viande magique n'a pas besoin d'être cuite et donne de nombreux avantages défensifs en plus de satisfaire entièrement votre faim. Une fois mangée elle vous donne une invisibilité, une peau d'écorce, un peu de soin, et guérit certains effets néfastes.
items.food.phantommeat.discover_hint=Vous pouvez trouver cet objet en tuant certains ennemis.

items.food.pasty.name=tourte
items.food.pasty.fish_name=poisson à la vapeur
items.food.pasty.amulet_name=amulette de Yendor ?
items.food.pasty.egg_name=œuf de Pâques
items.food.pasty.rainbow_name=potion arc-en-ciel
items.food.pasty.shattered_name=gâteau vert
items.food.pasty.pie_name=tarte à la citrouille
items.food.pasty.vanilla_name=gâteau bleu
items.food.pasty.cane_name=sucre d'orge
items.food.pasty.sparkling_name=potion pétillante
items.food.pasty.desc=Une authentique tourte des Cornouailles avec une garniture traditionnelle à base de bœuf et de pommes de terre. Délicieux !
items.food.pasty.fish_desc=Un poisson entier cuit à la vapeur sur lit de légumes, conservé grâce à la magie. La tradition voulant qu'à cette période de l'année on garde un peu de poisson pour plus tard, vous mettrez un morceau de côté au lieu de le manger entièrement.\n\nJoyeux Nouvel An Lunaire !
items.food.pasty.amulet_desc=Vous l'avez enfin trouvée, la fabuleuse amulette de - attendez une minute, ce n'est que du chocolat dans un emballage ressemblant à l'amulette ! Vous n'aurez pas le pouvoir illimité, mais au moins vous serez rassasié et gagnerez une petite recharge d'artéfact.\n\nPoisson d'avril !
items.food.pasty.egg_desc=Un gros œuf en chocolat dans un emballage d'un jaune éclatant. Il y a bien assez de chocolat ici pour vous rassasier et le sucre permettra même à vos artéfacts de se recharger légèrement.\n\nJoyeuses Pâques !
items.food.pasty.rainbow_desc=Cette potion colorée est une sorte de nourriture liquide. En plus de rassasier, elle contient un peu de magie en elle qui calmera un ennemi adjacent (hors boss), le rendant temporairement hésitant à vous attaquer.\n\nJoyeuse Pride !
items.food.pasty.shattered_desc=Cette grosse part de gâteau à la vanille est saupoudrée de vermicelles colorés et a un glaçage vert. Ce gâteau a été cuisiné pour célébrer des années d’expérience, et vous accordera un peu de cette expérience lorsqu'il est consommé.\n\nShattered Pixel Dungeon est sorti pour la première fois le 5 Août 2014. Bon anniversaire Shattered Pixel Dungeon !
items.food.pasty.pie_desc=Une belle et grosse part de tourte à la citrouille. Son goût sucré et épicé vous nourrira pleinement et vous soignera modérément.\n\nJoyeux Halloween !
items.food.pasty.vanilla_desc=Cette grosse part de gâteau à la vanille est saupoudrée de vermicelles colorés et a un glaçage bleu. Ce gâteau a été cuisiné pour célébrer des années d'expérience, et vous accordera un peu de cette expérience lorsqu'il est consommé.\n\nLe premier Pixel Dungeon est sorti le 4 Décembre 2012. Bon anniversaire Pixel Dungeon !
items.food.pasty.cane_desc=Un grand sucre d'orge bien sucré. Il est assez gros pour vous nourrir, et le sucre pourrait aussi donner à vos baguettes un petit peu plus de charge.\n\nJoyeuses fêtes !
items.food.pasty.sparkling_desc=Cette potion pétillante est une sorte de nourriture liquide. Elle rassasie et ressemble à du vin pétillant, mais elle n'est pas alcoolisée. La douce sensation dans votre ventre vous accordera un peu de protection.\n\nBonne année !
items.food.pasty$fishleftover.name=restes de poisson
items.food.pasty$fishleftover.eat_msg=Cette nourriture était mangeable.
items.food.pasty$fishleftover.desc=Quelques restes de votre dernier repas. Vous pouvez le manger quand vous voulez pour réduire un peu votre faim.

items.food.smallration.name=petite ration de nourriture
items.food.smallration.eat_msg=Cette nourriture était mangeable.
items.food.smallration.desc=Ça ressemble exactement à une ration standard, mais en plus petit.
items.food.smallration.discover_hint=Vous pouvez acheter cet objet dans un magasin.

items.food.stewedmeat.name=viande bouillie
items.food.stewedmeat.eat_msg=Cette nourriture était mangeable.
items.food.stewedmeat.desc=Bouillir la viande l'a débarrassé de ses maladies et microbes. Plus de problèmes pour la manger.
items.food.stewedmeat.discover_hint=Vous pouvez fabriquer cet objet via l'alchimie.

items.food.supplyration.name=ration de réserve
items.food.supplyration.desc=Cette ration a été dissimulée dans le donjon par et pour les membres de la guilde des voleurs. Elle est spécifiquement faite pour être mangée sur le pouce et aider à réaliser diverses manigances.\n\nMalgré le fait qu'elle ne rassasie pas autant qu'une ration normale, elle se mange rapidement, soigne légèrement, et accorde une charge à la cape des ombres du Voleur.
items.food.supplyration.discover_hint=Vous pouvez trouver cet objet à l'aide d'un talent de héros.



##journal items
items.journal.documentpage.name=page déchirée
items.journal.documentpage.desc=Une page isolée, probablement déchirée d'un livre. Vous devez la ramasser pour pouvoir la lire.

items.journal.alchemypage.name=page déchirée du livre d'alchimie
items.journal.alchemypage.desc=Une page déchirée d'un manuel d'alchimie.\n\nLa plupart du texte est trop petit pour être lu de loin, mais vous arrivez à lire le titre de la page :\n\n_"%s"_

items.journal.guidebook.name=livre de maîtrise de donjon
items.journal.guidebook.hint_mobile=Votre guide d'aventure a des conseils à vous donner ! Appuyez sur l'icône clignotante du journal en haut à droite pour le lire.
items.journal.guidebook.hint_desktop=Votre guide d'aventure a des conseils à vous donner ! Sélectionnez le bouton clignotant du journal (%s) en haut à droite pour le lire.
items.journal.guidebook.hint_status=Guide d'aventure
items.journal.guidebook.desc=Un manuel de l'aventurier, laissé ici par un quelqu'un qui a décidé que la vie d'aventurier n'était pas pour lui ou elle ! Ce livre est magique et peut signaler aux aventuriers de lire une page au bon moment.\n\nMalgré cette fonctionnalité, le livre est principalement populaire dû aux mots : "Ne paniquez pas!" écrit en grosses lettres sur la couverture.

items.journal.guidepage.name=page déchirée du guide
items.journal.guidepage.desc=Une page déchirée d'un guide d'aventure.\n\nLa plupart du texte est trop petit pour être lu de loin, mais vous pouvez distinguer le titre de la page :\n\n_"%s"_

items.journal.regionlorepage$sewers.name=lettre usée
items.journal.regionlorepage$sewers.desc=Ce qui semble être une lettre, écrite sur du papier taché de boue. Vous devez la ramasser pour pouvoir lire ce qui est écrit dessus.

items.journal.regionlorepage$prison.name=entrée de journal usée
items.journal.regionlorepage$prison.desc=Une entrée de journal, ou d'un autre type de registre, écrit sur un vieux morceau de papier. Elle semble avoir mieux vieilli que les lettres que vous avez trouvé dans les égouts, mais vous aurez toujours besoin de la ramasser pour la lire.

items.journal.regionlorepage$caves.name=vieille entrée de journal
items.journal.regionlorepage$caves.desc=Ce qui semble être une entrée du journal d'un explorateur, étonnement bien préservée malgré son ancienneté. Ramassez-la pour la lire.

items.journal.regionlorepage$city.name=tablette rouillée
items.journal.regionlorepage$city.desc=Une petite tablette de métal rouillée avec un message magiquement gravé dessus. Les lettres sont toujours nettes malgré l'âge de la tablette, mais vous devez la ramasser pour la lire.

items.journal.regionlorepage$halls.name=tablette brillante
items.journal.regionlorepage$halls.desc=Une petite tablette noire avec des lettres vertes brillantes gravées dessus. Leur lumières se fondent ensemble si vous êtes loin, vous devez la ramasser pour la lire.


###keys
items.keys.goldenkey.name=clef dorée
items.keys.goldenkey.desc=Les encoches de cette clé dorée sont minuscules et complexes. Peut-être qu'elle va ouvrir un coffre verrouillé ?

items.keys.crystalkey.name=Clé de cristal
items.keys.crystalkey.desc=Les surfaces taillées de cette clé cristalline scintillent dans l'obscurité. Peut-être qu'elle va ouvrir quelque chose fait de cristal ?

items.keys.ironkey.name=clef en fer
items.keys.ironkey.desc=Les rainures sur cette vieille clef en fer sont bien usées ; le cuir recouvrant sa tête se décompose avec l'âge. Quelle porte pourrait-elle bien ouvrir ?

items.keys.wornkey.name=clef usée
items.keys.wornkey.desc=Malgré son aspect usé et décoloré, cette clef semble importante. Elle ouvrira probablement une porte importante à proximité.



###potions
items.potions.potion.ac_drink=BOIRE
items.potions.potion.turquoise=potion turquoise
items.potions.potion.crimson=potion carmin
items.potions.potion.azure=potion azur
items.potions.potion.jade=potion vert jade
