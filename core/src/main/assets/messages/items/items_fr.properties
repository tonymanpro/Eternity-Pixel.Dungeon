items.weapon.missiles.missileweapon.dust=L'arme de jet tombe en poussière quand vous la touchez.
items.weapon.missiles.missileweapon.break_upgraded_warn_desc=Si la dernière des armes de jet d'un ensemble amélioré se brise, l'ensemble sera définitivement perdu. Êtes-vous sûr de vouloir la lancer ?
items.weapon.missiles.missileweapon.break_upgraded_warn_yes=Oui
items.weapon.missiles.missileweapon.break_upgraded_warn_no=Non
