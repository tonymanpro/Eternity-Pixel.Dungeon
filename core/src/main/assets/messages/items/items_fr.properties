items.potions.potion.ivory=potion ivoire
items.potions.potion.amber=potion ambrée
items.potions.potion.bistre=potion brune
items.potions.potion.indigo=potion indigo
items.potions.potion.silver=potion argentée
items.potions.potion.unknown_desc=Cette fiole contient un liquide coloré tourbillonnant. Qui sait quels seront ses effets une fois bue ou jetée.
items.potions.potion.harmful=Potion nocive !
items.potions.potion.beneficial=Potion bénéfique
items.potions.potion.yes=Oui, je sais ce que je fais
items.potions.potion.no=Non, j'ai changé d'avis
items.potions.potion.sure_drink=Êtes-vous sûr de vouloir la boire ? Vous devriez généralement lancer ce genre de potion sur vos ennemis.
items.potions.potion.sure_throw=Êtes-vous sûr de vouloir la lancer ? Il est généralement plus intéressant de la boire.
items.potions.potion.shatter=La fiole se brise et son liquide se répand sans conséquence.
items.potions.potion.discover_hint=Vous pouvez trouver cet objet au hasard dans le donjon, ou le fabriquer via l'alchimie.
items.potions.potion$placeholder.name=potion
items.potions.potion$seedtopotion.name=Potion inconnue.

items.potions.potionofexperience.name=potion d'expérience
items.potions.potionofexperience.desc=Concentré d'expériences de nombreuses batailles sous une forme liquide, ce breuvage augmentera instantanément votre niveau d'expérience.

items.potions.potionoffrost.name=potion de froid
items.potions.potionoffrost.desc=Cette fiole contient une substance qui s'évapore soudainement au contact de l'air créant un brouillard glaçant.

items.potions.potionofhaste.name=Potion de célérité
items.potions.potionofhaste.energetic=Vous vous sentez énergique !
items.potions.potionofhaste.desc=Boire ce breuvage étrangement sucré vous emplira d'une immense énergie sur une courte période, vous permettant de courir à grande vitesse.

items.potions.potionofhealing.name=potion de soins
items.potions.potionofhealing.heal=Vos blessures commencent à se refermer.
items.potions.potionofhealing.desc=Cet élixir va rapidement vous rendre la santé et guérir instantanément de nombreuses maladies.

items.potions.potionofinvisibility.name=potion d'invisibilité
items.potions.potionofinvisibility.invisible=Vous voyez vos mains devenir invisibles !
items.potions.potionofinvisibility.desc=Boire cette potion vous rendra invisible pendant quelque temps. Les ennemis ne vous voient pas quand vous êtes invisible. Les attaques physiques et les effets magiques (comme les parchemins et les baguettes) vont immédiatement dissiper l'invisibilité.

items.potions.potionoflevitation.name=potion de lévitation
items.potions.potionoflevitation.float=Vous flottez dans les airs !
items.potions.potionoflevitation.desc=Boire cet étrange liquide vous fera léviter, capable d'aisément survoler les pièges et autres trous. Lancer cette potion libère un nuage de gaz brut, désorientant toute créature à son contact.

items.potions.potionofliquidflame.name=potion de feu liquide
items.potions.potionofliquidflame.desc=Cette flasque contient un agent très instable qui prend violemment feu au contact de l'air.

items.potions.potionofmindvision.name=potion de vision spirituelle
items.potions.potionofmindvision.see_mobs=Vous arrivez à ressentir la présence des esprits des autres créatures !
items.potions.potionofmindvision.see_none=Vous semblez capable de deviner que vous êtes seul dans ce niveau pour le moment.
items.potions.potionofmindvision.desc=Après l'avoir bue, votre esprit deviendra en phase avec l'empreinte psychique des autres créatures, vous permettant de ressentir leur présence à travers les murs. Cette potion vous permet aussi de voir derrière les murs ou les portes.

items.potions.potionofparalyticgas.name=potion de gaz paralysant
items.potions.potionofparalyticgas.desc=Exposé à l'air libre, ce liquide se vaporise en un nuage jaune étourdissant. Quiconque inhale ce nuage sera paralysé instantanément, incapable de bouger pour quelques temps. Cette potion peut être lancée sur des ennemis à distance pour les soumettre aux effets du gaz.

items.potions.potionofpurity.name=potion de pureté
items.potions.potionofpurity.freshness=Vous ressentez une fraîcheur inhabituelle dans l'air.
items.potions.potionofpurity.protected=Un film protecteur vous enveloppe !
items.potions.potionofpurity.desc=Ce réactif magique neutralisera rapidement tous les effets nocifs liés à une zone sur une grande surface. Boire ce réactif vous protégera temporairement de tels effets.

items.potions.potionofstrength.name=potion de force
items.potions.potionofstrength.msg=Une force nouvelle parcourt votre corps, vous avez maintenant une force de %d !
items.potions.potionofstrength.desc=La puissance de ce breuvage pénètre jusque dans vos muscles, augmentant de façon permanente votre force d'un point.

items.potions.potionoftoxicgas.name=potion de gaz toxique
items.potions.potionoftoxicgas.desc=Déboucher ou briser cette fiole de gaz sous pression la fera exploser dans un nuage vert de gaz toxique. Il est certainement plus judicieux d'envoyer cette potion sur des ennemis au loin plutôt que de l'ouvrir à la main.



###brews
items.potions.brews.brew.discover_hint=Vous pouvez fabriquer cet objet via l'alchimie.

items.potions.brews.aquabrew.name=breuvage aquatique
items.potions.brews.aquabrew.desc=Ce breuvage libérera un jet d'eau sous pression à l'endroit où il est brisé. Il n'est assez puissant que pour blesser les ennemis ardents, mais peut tout de même propager de l'eau sur le terrain à proximité, désamorcer les pièges, éteindre les feux et repousser tous les personnages proches du centre de l'impact.

items.potions.brews.blizzardbrew.name=Breuvage de blizzard
items.potions.brews.blizzardbrew.desc=Lorsqu'il est utilisé, ce breuvage répand rapidement un blizzard tourbillonnant.

items.potions.brews.causticbrew.name=breuvage caustique
items.potions.brews.causticbrew.desc=Ce breuvage répandra une vase corrosive autour de l'endroit où il est déposé. Tout ce que touchera la vase fondra doucement s'il n'est pas rincé.

items.potions.brews.infernalbrew.name=breuvage infernal
items.potions.brews.infernalbrew.desc=Lorsqu'il est utilisé, ce breuvage répand rapidement un enfer de feu sous forme de gaz.

items.potions.brews.shockingbrew.name=breuvage foudroyant
items.potions.brews.shockingbrew.desc=Lorsqu'utilisé, ce breuvage répand un orage électrique dans une grande zone autour de l'emplacement où la fiole a été cassée.

items.potions.brews.unstablebrew.name=breuvage instable
items.potions.brews.unstablebrew.desc=Ce breuvage magique brille en passant par les couleurs de l'arc-en-ciel.\n\nLorsqu'il est bu ou lancé, il déclenchera l'effet d'une potion au hasard. L'effet sera toujours positif si le breuvage est bu et sera toujours négatif si lancé.

###elixirs
items.potions.elixirs.elixir.discover_hint=Vous pouvez fabriquer cet objet via l'alchimie.

items.potions.elixirs.elixirofarcanearmor.name=élixir d'armure arcanique
items.potions.elixirs.elixirofarcanearmor.desc=Cet élixir donnera à la personne qui le boit une résistance durable aux dégâts magiques.

items.potions.elixirs.elixirofaquaticrejuvenation.name=élixir de rajeunissement aquatique
items.potions.elixirs.elixirofaquaticrejuvenation.desc=Cet élixir contient les restes du Goo améliorés avec une potion de guérison. Bien que cela ne fournisse pas une guérison immédiate, il rétablira progressivement une bonne partie de votre santé tant que vous êtes dans l'eau.
items.potions.elixirs.elixirofaquaticrejuvenation$aquahealing.name=Aquaguérison
items.potions.elixirs.elixirofaquaticrejuvenation$aquahealing.desc=Vous avez temporairement acquis des propriétés régénérantes similaires à celles du Goo.\n\nEn restant dans l'eau, vous regagnerez une petite partie de votre santé par tour. Cet effet est interrompu lorsque vous êtes en pleine santé ou sortez de l'eau.\n\nSoin restant : %d.

items.potions.elixirs.elixirofdragonsblood.name=élixir de sang de dragon
items.potions.elixirs.elixirofdragonsblood.desc=Une fois consommé, cet élixir enverra une puissance ardente dans les veines du buveur. Cet effet vous immunisera au feu et vous permettra de mettre le feu à vos ennemis avec des attaques physiques.

items.potions.elixirs.elixiroffeatherfall.name=élixir de chute amortie
items.potions.elixirs.elixiroffeatherfall.light=Vous vous sentez léger comme une plume !
items.potions.elixirs.elixiroffeatherfall.desc=Cet élixir offre un moins puissant mais plus contrôlé effet de lévitation, permettant au buveur de tomber de grandes hauteurs sans se blesser pendant une petite période.
items.potions.elixirs.elixiroffeatherfall$featherbuff.name=chute amortie
items.potions.elixirs.elixiroffeatherfall$featherbuff.desc=Vous êtes sous l'effet d'un élixir de Chute de plume, cela vous permet de tomber dans des gouffres sans prendre aucun dégât !\n\nTours restants: %s.

items.potions.elixirs.elixirofhoneyedhealing.name=élixir de guérison mielleux
items.potions.elixirs.elixirofhoneyedhealing.desc=Cet élixir combine la guérison avec la douceur du miel. Une fois bu, il aura les mêmes effets qu'une potion de soins et satisfera une petite quantité de faim. Il peut aussi être lancé pour soigner un allié.\n\nLes créatures ayant une affinité pour le miel pourraient être pacifiées si cet objet est utilisé sur elles.

items.potions.elixirs.elixiroficytouch.name=élixir de toucher glacé
items.potions.elixirs.elixiroficytouch.desc=Une fois consommé, cet élixir vous permettra d'absorber la chaleur des ennemis que vous attaquez. Vous serez immunisé contre le froid et vous refroidirez vos ennemis avec vos attaques physiques.

items.potions.elixirs.elixirofmight.name=élixir de puissance
items.potions.elixirs.elixirofmight.msg=Une force nouvelle parcourt votre corps, vous avez maintenant une force de %d !
items.potions.elixirs.elixirofmight.desc=La puissance de ce breuvage pénètre jusque dans vos muscles, augmentant de façon permanente votre force d'un point et temporairement vos points de vie de %d points. Cette augmentation de santé varie suivant votre santé max, mais se dissipe au fur et à mesure que vous gagnez des niveaux.
items.potions.elixirs.elixirofmight$htboost.name=boost de santé max
items.potions.elixirs.elixirofmight$htboost.desc=Vous vous sentez anormalement fort et en bonne santé.\n\nVos points de vie max sont augmentés pendant une longue période de temps. Au fur et à mesure que vous gagnez des niveaux cette augmentation se dissipera.\n\nBonus actuel : %d.\nNiveaux restants : %d.

items.potions.elixirs.elixiroftoxicessence.name=élixir d'essence toxique
items.potions.elixirs.elixiroftoxicessence.desc=Une fois consommé, cet élixir imprègne le buveur d'énergie toxique. Le buveur répandra continuellement des gaz toxiques au fur et à mesure de ses déplacements. Il sera immunisé contre les gaz toxiques et le poison pendant une durée légèrement supérieure à celle de cet effet.



###exotic potions
items.potions.exotic.exoticpotion.turquoise=potion turquoise exotique
items.potions.exotic.exoticpotion.crimson=potion carmin exotique
items.potions.exotic.exoticpotion.azure=potion azur exotique
items.potions.exotic.exoticpotion.jade=potion vert jade exotique
items.potions.exotic.exoticpotion.golden=potion dorée exotique
items.potions.exotic.exoticpotion.magenta=potion magenta exotique
items.potions.exotic.exoticpotion.charcoal=potion anthracite exotique
items.potions.exotic.exoticpotion.ivory=potion ivoire exotique
items.potions.exotic.exoticpotion.amber=potion ambrée exotique
items.potions.exotic.exoticpotion.bistre=potion brune exotique
items.potions.exotic.exoticpotion.indigo=potion indigo exotique
items.potions.exotic.exoticpotion.silver=potion argentée exotique
items.potions.exotic.exoticpotion.unknown_desc=Cette fiole ronde contient un liquide granuleux coloré. Il semble étranger à cette contrée, qui sait ce qu'il pourrait faire une fois bu ou lancé ?
items.potions.exotic.exoticpotion.warning=Voulez-vous vraiment annuler l'utilisation de cette potion ? Elle sera tout de même consommée.
items.potions.exotic.exoticpotion.yes=Oui, je suis sûr
items.potions.exotic.exoticpotion.no=Non, j'ai changé d'avis
items.potions.exotic.exoticpotion.discover_hint=Vous pouvez fabriquer cet objet via l'alchimie.

items.potions.exotic.potionofcleansing.name=potion purificatrice
items.potions.exotic.potionofcleansing.desc=Ce réactif puissant immunisera le buveur à tous les effets de statut néfastes pendant quelques tours après avoir été bu. Il peut également être lancé sur une cible pour la purifier.
items.potions.exotic.potionofcleansing$cleanse.name=purifié
items.potions.exotic.potionofcleansing$cleanse.desc=Ce personnage est temporairement immunisé contre tous les effets de statut néfastes !\n\nTours restants : %s.

items.potions.exotic.potionofcorrosivegas.name=potion de gaz corrosif
items.potions.exotic.potionofcorrosivegas.desc=Déboucher ou briser ce flacon pressurisé fera exploser son contenu en un nuage mortel de gaz corrosif de couleur rouille. Ce gaz se propage plus rapidement que le gaz toxique, mais ne restera pas très longtemps.

items.potions.exotic.potionofdragonsbreath.name=potion de souffle de dragon
items.potions.exotic.potionofdragonsbreath.prompt=Choisissez un endroit à brûler
items.potions.exotic.potionofdragonsbreath.desc=Cette fiole contient un composé peu usuel qui explose en flammes peu après l'avoir mélangé avec de la salive. Rapidement recracher le liquide permet à l'utilisateur de projeter des flammes !

items.potions.exotic.potionofearthenarmor.name=potion d'armure terrestre
items.potions.exotic.potionofearthenarmor.desc=Au lieu de paralyser, ce liquide a un effet renforçant sur la peau qui se transforme temporairement en une armure naturelle.

items.potions.exotic.potionofdivineinspiration.name=potion d'inspiration divine
items.potions.exotic.potionofdivineinspiration.no_more_points=Vous ne pouvez plus gagner de points de talent bonus.
items.potions.exotic.potionofdivineinspiration.select_tier=Sélectionnez un rang de talent pour y gagner deux points bonus. Vous devez avoir débloqué le rang avant d'y dépenser les points.
items.potions.exotic.potionofdivineinspiration.bonus=+2 points de talent !
items.potions.exotic.potionofdivineinspiration.desc=Le pouvoir de l'énergie divine réduite sous forme liquide, ce breuvage imprègne le buveur d'un pouvoir divin, lui accordant deux points de talent bonus sur le rang de son choix.\n\nCette potion ne peut être utilisée qu'une fois par rang de talent.

items.potions.exotic.potionofmagicalsight.name=potion de vision magique
items.potions.exotic.potionofmagicalsight.desc=Après avoir bu ceci, vos sens vont être brièvement augmentés à des niveaux incroyables, vous permettant de voir à travers les murs dans un rayon de 12 cases !

items.potions.exotic.potionofmastery.name=potion de maîtrise
items.potions.exotic.potionofmastery.prompt=Maîtriser un objet
items.potions.exotic.potionofmastery.weapon_easier=Votre arme devient plus facile à manier !
items.potions.exotic.potionofmastery.armor_easier=Votre armure devient plus facile à porter !
items.potions.exotic.potionofmastery.desc=Plutôt que d'octroyer de la force brute, cette potion va à la place harmoniser les muscles de l'utilisateur à un objet en particulier. Cela rend l'objet plus facile d'utilisation, comme si le buveur s'était entrainé avec et avait forgé une mémoire musculaire.\n\nL'arme ou l'armure choisie demandera 2 points de force en moins pour être utilisée. Cette potion ne peut être utilisée qu'une seule fois pour chaque objet.

items.potions.exotic.potionofshielding.name=potion de blindage
items.potions.exotic.potionofshielding.desc=Au lieu de soigner, cette potion va projeter un bouclier durable autour du corps de l'utilisateur, bloquant un nombre considérable de dégâts.

items.potions.exotic.potionofshroudingfog.name=potion de brouillard enveloppant
items.potions.exotic.potionofshroudingfog.desc=S'il est exposé à l'air, le liquide de cette fiole va produire un épais brouillard de fumée qui va se propager rapidement et bloquer la vision des ennemis.

items.potions.exotic.potionofsnapfreeze.name=potion de gel sec
items.potions.exotic.potionofsnapfreeze.desc=Le produit chimique contenu dans cette potion va rapidement réagir avec l'air, glaçant instantanément et enracinant tout dans sa zone d'effet.

items.potions.exotic.potionofstamina.name=potion d'endurance
items.potions.exotic.potionofstamina.desc=Boire ce breuvage étrangement sucré vous emplira d'un boost d'énergie de longue durée en vous permettant de courir plus rapidement pour une période de temps prolongée.

items.potions.exotic.potionofstormclouds.name=potion de nuages d'orage
items.potions.exotic.potionofstormclouds.desc=Jeter cette potion va créer un nuage de vapeur concentrée se propageant rapidement, qui va se condenser et pleuvoir sur l'environnement. La plupart du terrain sera converti en eau, les ennemis ardents seront blessés, le feu s'éteindra et les pièges seront submergés et casseront.



###quest items
items.quest.ceremonialcandle.name=bougie de culte
items.quest.ceremonialcandle.desc=Un ensemble de bougies, refondues de nombreuses fois entre elles avec le temps.\n\nSeules elles ne servent pas à grand chose, mais combinées avec d'autres bougies pour former un cercle elles peuvent concentrer leur énergie pour un rituel d'invocation.
items.quest.ceremonialcandle.discover_hint=Vous pouvez trouver cet objet durant une quête.

items.quest.corpsedust.name=poussière d'os
items.quest.corpsedust.chill=Vous êtes pris de frissons dans la nuque.
items.quest.corpsedust.desc=Cet amas de poussière d'os semble relativement normal. Mais vous pouvez ressentir l'énergie malveillante qui en émane.\n\nS'en débarrasser aussi vite que possible serait certainement une bonne idée.
items.quest.corpsedust.discover_hint=Vous pouvez trouver cet objet durant une quête.

items.quest.darkgold.name=minerai d'or sombre
items.quest.darkgold.you_now_have=Vous avez maintenant %d minerai d’or noir.
items.quest.darkgold.desc=Ce métal est appelé or sombre non pas à cause de sa couleur (qui est la même que de l'or classique), mais parce qu'il fond à la lumière du soleil, le rendant inutile à la surface.
items.quest.darkgold.discover_hint=Vous pouvez trouver cet objet durant une quête.

items.quest.dwarftoken.name=jeton de nain
items.quest.dwarftoken.desc=De nombreux nains et beaucoup de leur grandes créations portent ces petites pièces de métal pour une raison inconnue. Peut-être est-ce un bijou ou une sorte de plaque d'identité. Les coutumes naines ont toujours été particulières.
items.quest.dwarftoken.discover_hint=Vous pouvez trouver cet objet durant une quête.

items.quest.embers.name=braises élémentales
items.quest.embers.desc=Des braises spéciales qui ne peuvent être collectées que sur de jeunes élémentaires de feu. Elles diffusent une énergie réchauffante.
items.quest.embers.discover_hint=Vous pouvez trouver cet objet durant une quête.

items.quest.escapecrystal.name=cristal de sortie
items.quest.escapecrystal.ac_use=UTILISER
items.quest.escapecrystal.desc=Un mince cristal de sort qui semble renfermer une magie de téléportation. Vous pouvez utiliser le cristal à tout moment pour quitter le coffre-fort nain, mais vous ne pourrez rien emporter avec vous !
items.quest.escapecrystal.discover_hint=Vous pouvez trouver cet objet durant une quête.

items.quest.gooblob.name=goutte de Goo
items.quest.gooblob.desc=Une goutte gélatineuse de Goo, issue de Goo à sa mort. C'est presque comme une grosse boule de gelée, bien que vous n'oseriez pas la manger.\n\nElle ne fait rien par elle-même, mais pourrait être utile lorsqu'elle est associée à certaines potions ou à une bombe. Au minimum, elle pourrait être convertie en une quantité d'énergie alchimique décente.
items.quest.gooblob.discover_hint=Vous pouvez trouver cet objet en tuant certains ennemis.

items.quest.metalshard.name=tesson de métal maudit
items.quest.metalshard.desc=Un tesson de métal maudit rouillé, qui se détacha de DM-300 lorsqu'il fut détruit. Vous pouvez sentir une magie malveillante inactive dans celui-ci.\n\nTout seul, il ne fait rien, mais il pourrait être utile s'il était combiné avec certains parchemins, ou avec une bombe. Au minimum, on devrait pouvoir le convertir en une quantité d'énergie alchimique convenable.
items.quest.metalshard.discover_hint=Vous pouvez trouver cet objet en tuant certains ennemis.

items.quest.pickaxe.name=pioche
items.quest.pickaxe.ability_name=percer
items.quest.pickaxe.ability_desc=La Duelliste peut _percer_ un ennemi avec une pioche. Cette attaque touche forcément, et applique l'effet vulnérable durant 3 tours, et inflige _%1$d-%2$d dégâts_ aux ennemis avec une peau rigide.
items.quest.pickaxe.upgrade_ability_stat_name=Dégâts de capacité
items.quest.pickaxe.desc=C'est un outil lourd et robuste pour casser la pierre. Vous n'avez pas besoin de vous équiper de la pioche pour miner avec, mais elle peut être utilisée comme une arme si besoin.
items.quest.pickaxe.discover_hint=Vous pouvez trouver cet objet durant une quête.

items.quest.ratskull.name=crâne de rat géant
items.quest.ratskull.desc=Un crâne de rat incroyablement grand. Cela ferait un trophée parfait si vous aviez un mur sur lequel le fixer.



###remains
items.remains.remainsitem.ac_use=UTILISER
items.remains.remainsitem.discover_hint=Vous pouvez trouver cet objet dans les restes d'un héros d'une précédente partie échouée.

items.remains.bowfragment.name=morceau d'arc
items.remains.bowfragment.desc=Ce morceau de bois brisé faisait autrefois partie de l'arc spirituel d'une Chasseresse disparue. Vous pouvez sentir un résidu d'énergie naturelle dans ce débris qui peut servir à faire pousser des herbes hautes autour de vous. Le faire détruira ce morceau d'arc.

items.remains.brokenhilt.name=garde brisée
items.remains.brokenhilt.desc=Cette garde brisée semble provenir de l'arme d'une Duelliste vaincue. Vous pouvez sentir un résidu d'énergie martiale dans cette garde qui peut servir à vous donner un bonus de dégâts pour vos deux prochaines attaques de mêlée réussies. Le faire détruira la garde.

items.remains.brokenstaff.name=bâton brisé
items.remains.brokenstaff.desc=Ce bâton de Mage a été brisé en deux après la triste fin de son propriétaire. Vous pouvez sentir un résidu d'énergie magique dans ce bâton qui peut servir à donner à vos baguettes un léger boost de recharge. Le faire détruira le bâton.

items.remains.cloakscrap.name=lambeau de tissu
items.remains.cloakscrap.desc=Ce lambeau de tissu translucide semble provenir de la cape des ombres d'un Voleur décédé. Vous pouvez sentir un résidu d'énergie mystique qui peut servir à donner à vos artéfacts un léger boost de recharge. Le faire détruira le tissu.

items.remains.sealshard.name=éclats de sceau
items.remains.sealshard.desc=Ces petits morceaux de cire rouge semblent provenir du sceau d'un Guerrier abattu. Vous pouvez ressentir un résidu de volonté dans ce sceau qui peut servir à vous accorder une légère protection. Le faire détruira les éclats de sceau.

items.remains.tornpage.name=page déchirée
items.remains.tornpage.desc=Cette page semble avoir été arrachée du tome sacré d'un Clerc décédé. Il y a encore un peu d'énergie divine à l'intérieur, vous pouvez l'utiliser pour vous soigner un peu de vie. La page sera détruite après utilisation.



###rings
items.rings.ring.diamond=Bague de diamant
items.rings.ring.opal=Bague d'opale
items.rings.ring.garnet=Bague de grenat
items.rings.ring.ruby=Bague de rubis
items.rings.ring.amethyst=Bague d'améthyste
items.rings.ring.topaz=Bague de topaze
items.rings.ring.onyx=Bague d'onyx
items.rings.ring.tourmaline=Bague de tourmaline
items.rings.ring.emerald=Bague d'émeraude
items.rings.ring.sapphire=Bague de saphir
items.rings.ring.quartz=Bague de quartz
items.rings.ring.agate=Bague d'agate
items.rings.ring.equip_cursed=La bague se resserre violemment autour de votre doigt !
items.rings.ring.unknown_desc=Cet anneau de métal est monté d'une grosse gemme qui brille dans le noir. Qui sait quel est son effet quand on le porte ?
items.rings.ring.known=C'est une %s
items.rings.ring.identify=Vous vous êtes suffisamment familiarisé avec votre bague pour l'identifier.
items.rings.ring.cursed_worn=Puisque cette bague est maudite, vous êtes dans l'impossibilité de vous en débarrasser.
items.rings.ring.curse_known=Vous sentez une aura malveillante provenant de cette bague.
items.rings.ring.not_cursed=Cette bague est dépourvue de toute aura malveillante.

items.rings.ringofaccuracy.name=bague de précision
items.rings.ringofaccuracy.stats=Si vous la portez, cette bague augmentera votre précision de _%s%%._
items.rings.ringofaccuracy.typical_stats=Si vous la portez, cette bague augmentera typiquement votre précision de _%s%%._
items.rings.ringofaccuracy.combined_stats=Vos anneaux équipés combinent leur puissance, augmentant votre précision de _%s%%_ au total.
items.rings.ringofaccuracy.upgrade_stat_name_1=Boost de précision
items.rings.ringofaccuracy.desc=Cette bague augmente votre concentration, rendant vos attaques plus précises. Une bague maudite, au contraire, rendra vos attaques moins précises.

items.rings.ringofarcana.name=bague d’arcanes
items.rings.ringofarcana.stats=Porté, cet anneau augmente le pouvoir des enchantements et glyphes de _%s%%._
items.rings.ringofarcana.typical_stats=Porté, cet anneau augmente habituellement le pouvoir des enchantements et glyphes de _%s%%._
items.rings.ringofarcana.combined_stats=Vos anneaux équipés combinent leur puissance, augmentant le pouvoir des enchantements et glyphes de _%s%%_ au total.
items.rings.ringofarcana.upgrade_stat_name_1=Boost d'arcane
items.rings.ringofarcana.desc=Cette bague renforce les enchantements magiques des armes et les glyphes des armures, y compris les malédictions ! Il augmente d'abord les chances d'activation, puis l'intensité des effets au-delà de 100% de chance d'activation. Un anneau maudit affaiblit les enchantements, les glyphes et les malédictions.

items.rings.ringofelements.name=bague des éléments
items.rings.ringofelements.stats=Si vous la portez, cette bague augmentera de _%s%%_ votre résistance élémentaire.
items.rings.ringofelements.typical_stats=Si vous la portez, cette bague augmentera typiquement de _%s%%_ votre résistance élémentaire.
items.rings.ringofelements.combined_stats=Vos anneaux équipés combinent leur puissance, augmentant votre résistance élémentaire de _%s%%_ au total.
items.rings.ringofelements.upgrade_stat_name_1=Résistance
items.rings.ringofelements.desc=Cette bague augmente la résistance à la plupart des effets magiques et élémentaires, réduisant les dégâts et la durée des effets. Naturellement, une bague maudite va au contraire accentuer les effets néfastes.

items.rings.ringofenergy.name=bague d'énergie
items.rings.ringofenergy.stats=Une fois équipée, cette bague augmente la vitesse de recharge des baguettes, des artefacts et des capacités d'armures de _%s%%._
items.rings.ringofenergy.typical_stats=Une fois équipée, cette bague augmente habituellement la vitesse de recharge des baguettes, des artefacts et des capacités d'armures de _%s%%._
items.rings.ringofenergy.combined_stats=Vos anneaux équipés combinent leur puissance, augmentant la vitesse de charge de _%s%%_ au total.
items.rings.ringofenergy.upgrade_stat_name_1=Boost de recharge
items.rings.ringofenergy.desc=Votre équipement magique se recharge plus rapidement dans le champ arcanique qui émane de cet anneau. Une bague maudite va au contraire ralentir la vitesse de rechargement.

items.rings.ringofevasion.name=bague d'évasion
items.rings.ringofevasion.stats=Si vous la portez, cette bague augmentera votre esquive de _%s%%._
items.rings.ringofevasion.typical_stats=Si vous la portez, cette bague augmentera typiquement votre esquive de _%s%%._
items.rings.ringofevasion.combined_stats=Vos anneaux équipés combinent leur puissance, augmentant votre esquive de _%s%%_ au total.
items.rings.ringofevasion.upgrade_stat_name_1=Boost d'esquive
items.rings.ringofevasion.desc=Cette bague accélère les réflexes du porteur, le rendant plus difficile à toucher. Une bague maudite va au contraire rendre le porteur plus facile à toucher.

items.rings.ringofforce.name=bague de force
items.rings.ringofforce.stats=Si vous êtes à mains nues, avec votre force actuelle, cette bague infligera _%1$d-%2$d dégâts._ Avec une arme équipée, cette bague augmentera les dégâts de _%3$d._
items.rings.ringofforce.typical_stats=Si vous êtes à mains nues, avec votre force actuelle, cette bague infligera typiquement _%1$d-%2$d dégâts._ Avec une arme équipée, cette bague augmentera typiquement les dégâts de _%3$d._
items.rings.ringofforce.combined_stats=Vos anneaux équipés combinent leur puissance, infligeant un total de _%1$d-%2$d dégâts_ sans arme, ou augmentant les dégâts de _%3$d_ avec une.
items.rings.ringofforce.upgrade_stat_name_1=Dégâts à mains nues
items.rings.ringofforce.upgrade_stat_name_2=Dégâts bonus avec arme
items.rings.ringofforce.upgrade_stat_name_3=Dégâts de capacité
items.rings.ringofforce.ability_name=posture de bagarreur
items.rings.ringofforce.typical_ability_desc=La Duelliste peut adopter une _posture de bagarreur_ avec cet anneau. Dans cette posture, les attaques de la Duelliste utilisent toujours cet anneau même si une arme est équipée. Ces attaques infligent généralement _%1$d-%2$d dégâts_ et bénéficient aussi de l’enchantement et de l'augmentation de l’arme. Cette posture ralentit la recharge de l'arme de 50%%.
items.rings.ringofforce.ability_desc=La Duelliste peut adopter une _posture de bagarreur_ avec cet anneau. Dans cette posture, les attaques de la Duelliste utilisent toujours cet anneau même si une arme est équipée. Ces attaques infligent %1$d-%2$d dégâts et bénéficient aussi de l’enchantement et de l'augmentation de l’arme. Cette posture ralentit la recharge de l'arme de 50%%.
items.rings.ringofforce.desc=Cette bague améliore la force des attaques au corps à corps de son porteur. Cette puissance supplémentaire est plutôt faible lorsque l'on manie une arme, mais elle rendra les attaques à mains nues beaucoup plus puissantes. Une bague maudite affaiblira au contraire les attaques de son porteur.
items.rings.ringofforce$brawlersstance.name=posture de bagarreur
items.rings.ringofforce$brawlersstance.desc=Dans cette posture, les attaques normales de la Duelliste utiliseront un anneau de force équipée même si elle a une arme équipée. Ces attaques bénéficient toujours de l'augmentation et de l'enchantement de l'arme.\n\nMaintenir cette posture demande de la concentration, ce qui ralentit la recharge des capacités d'arme de 50%.\n\nCette posture peut être activée et désactivée en utilisant un anneau de force, mais le ralentissement de la recharge des capacités persistera un petit moment si la posture est rapidement modifiée.

items.rings.ringoffuror.name=bague de furie
items.rings.ringoffuror.stats=Si vous la portez, cette bague augmentera la vitesse de vos attaques de _%s%%._
items.rings.ringoffuror.typical_stats=Si vous la portez, cette bague augmentera typiquement la vitesse de vos attaques de _%s%%._
items.rings.ringoffuror.combined_stats=Vos anneaux équipés combinent leur puissance, augmentant la vitesse de vos attaques de _%s%%_ au total.
items.rings.ringoffuror.upgrade_stat_name_1=Boost de vitesse d'attaque
items.rings.ringoffuror.desc=Cette bague procure à son porteur une rage intérieure, lui permettant d'attaquer plus rapidement. Une bague maudite va au contraire ralentir la vitesse d'attaque de son porteur.

items.rings.ringofhaste.name=bague de célérité
items.rings.ringofhaste.stats=Si vous la portez, cette bague augmentera votre vitesse de déplacement de _%s%%._
items.rings.ringofhaste.typical_stats=Si vous la portez, cette bague augmentera typiquement votre vitesse de déplacement de _%s%%._
items.rings.ringofhaste.combined_stats=Vos anneaux équipés combinent leur puissance, augmentant votre vitesse de déplacement de _%s%%_ au total.
items.rings.ringofhaste.upgrade_stat_name_1=Boost de vitesse de déplacement
items.rings.ringofhaste.desc=Cette bague réduit la difficulté de déplacement de son porteur, lui permettant de courir à des vitesses surhumaines. Une bague maudite va au contraire peser sur son porteur pour le ralentir.

items.rings.ringofmight.name=bague de puissance
items.rings.ringofmight.stats=Si vous la portez, cette bague augmentera votre force de _%1$d_ et vos points de vie de _%2$s%%._
items.rings.ringofmight.typical_stats=Si vous la portez, cette bague augmentera typiquement votre force de _%1$d_ et vos points de vie de _%2$s%%._
items.rings.ringofmight.combined_stats=Vos anneaux équipés combinent leur puissance, augmentant votre force de _%1$d_ et vos PV maximums de _%2$s%%_ au total.
items.rings.ringofmight.upgrade_stat_name_1=Augmentation de force
items.rings.ringofmight.upgrade_stat_name_2=Boost de santé maximale
items.rings.ringofmight.desc=Cette bague améliore la condition physique de son porteur, lui procurant une meilleure force et une meilleure constitution. Une bague maudite affaiblira son porteur.

items.rings.ringofsharpshooting.name=bague d'acuité
items.rings.ringofsharpshooting.stats=Si vous la portez, cette bague augmentera les dégâts de vos armes de lancer comme si leur niveau était amélioré de _%1$d_ et leur durabilité augmentera de _%2$s%%._
items.rings.ringofsharpshooting.typical_stats=Si vous la portez, cette bague augmentera typiquement les dégâts de vos armes de lancer comme si leur niveau était amélioré de _%1$d_ et leur durabilité augmentera de _%2$s%%._
items.rings.ringofsharpshooting.combined_stats=Vos anneaux équipés combinent leur puissance, augmentant le niveau effectif des armes de jet de _%1$d_ et leur durabilité de _%2$s%%_ au total.
items.rings.ringofsharpshooting.upgrade_stat_name_1=Boost de niveau des armes de jet
items.rings.ringofsharpshooting.upgrade_stat_name_2=Boost de durabilité
items.rings.ringofsharpshooting.desc=Cette bague accroît la précision et la visée du porteur, ce qui rendra toutes les armes de jets plus dangereuses et durables. Une bague maudite aura l'effet inverse.

items.rings.ringoftenacity.name=bague de ténacité
items.rings.ringoftenacity.stats=Si vous la portez, cette bague diminuera au mieux les dégâts reçus de _%s%%._
items.rings.ringoftenacity.typical_stats=Si vous la portez, cette bague diminuera typiquement les dégâts reçus de _%s%%_ au maximum.
items.rings.ringoftenacity.combined_stats=Vos anneaux équipés combinent leur puissance, ce qui réduit les dommages que vous prenez jusqu’à _%s%%_ au total.
items.rings.ringoftenacity.upgrade_stat_name_1=Résistance aux dégâts maximale
items.rings.ringoftenacity.desc=Le personnage portant cette bague résistera à des attaques qui autrement auraient été mortelles. Plus le porteur ou la porteuse est blessé(e), plus iel sera résistant(e) aux dommages. Une bague maudite va au contraire faciliter l'exécution de celle/celui-ci par les ennemis.

items.rings.ringofwealth.name=bague de fortune
items.rings.ringofwealth.stats=Si vous la portez, cette bague augmentera votre chance de _%s%%._
items.rings.ringofwealth.typical_stats=Si vous la portez, cette bague augmentera typiquement votre chance de _%s%%._
items.rings.ringofwealth.combined_stats=Vos anneaux équipés combinent leur puissance, augmentant votre chance de _%s%%_ au total.
items.rings.ringofwealth.upgrade_stat_name_1=Boost de chance
items.rings.ringofwealth.desc=Cette bague agit comme un aimant à trésor, augmentant la propension qu'ont les ennemis et les conteneurs à posséder des objets de valeur. Une bague maudite réduira au contraire vos chances de recevoir un butin.



###scrolls
items.scrolls.scroll.ac_read=LIRE
items.scrolls.scroll.kaunan=parchemin de KAUNAN
items.scrolls.scroll.sowilo=parchemin de SOWILO
items.scrolls.scroll.laguz=parchemin de LAGUZ
items.scrolls.scroll.yngvi=parchemin de YNGVI
items.scrolls.scroll.gyfu=parchemin de GYFU
items.scrolls.scroll.raido=parchemin de RAIDO
items.scrolls.scroll.isaz=parchemin de ISAZ
items.scrolls.scroll.mannaz=parchemin de MANNAZ
items.scrolls.scroll.naudiz=parchemin de NAUDIZ
items.scrolls.scroll.berkanan=parchemin de BERKANAN
items.scrolls.scroll.odal=parchemin de ODAL
items.scrolls.scroll.tiwaz=parchemin de TIWAZ
items.scrolls.scroll.unknown_desc=Une rune magique indéchiffrable est inscrite sur ce parchemin. Qui sait ce qui arrivera lorsque vous le lirez à haute voix.
items.scrolls.scroll.blinded=Vous ne pouvez pas lire de parchemin quand vous êtes aveugle.
items.scrolls.scroll.no_magic=Vous ne pouvez pas lire de parchemin quand vous êtes immunisé a la magie.
items.scrolls.scroll.cursed=Votre livre de sort maudit vous empêche d'utiliser la magie de ce parchemin ! Un parchemin de purification devrait être assez puissant pour lever la malédiction.
items.scrolls.scroll$placeholder.name=parchemin

items.scrolls.inventoryscroll.warning=Voulez-vous réellement annuler l'usage de ce parchemin ? Le parchemin n'étant pas identifié, il sera consommé dans tous les cas.
items.scrolls.inventoryscroll.yes=Oui, je suis sûr
items.scrolls.inventoryscroll.no=Non, j'ai changé d'avis

items.scrolls.scrollofidentify.name=parchemin d'identification
items.scrolls.scrollofidentify.inv_title=Identifier un objet
items.scrolls.scrollofidentify.it_is=Votre objet a été identifié : %s.
items.scrolls.scrollofidentify.desc=Ce sort va révéler de manière permanente les secrets d'un seul objet.

items.scrolls.scrolloflullaby.name=parchemin de berceuse
items.scrolls.scrolloflullaby.sooth=Le parchemin produit une douce mélodie. Vous avez vraiment envie de dormir.
items.scrolls.scrolloflullaby.desc=Lire ce parchemin va émettre une douce mélodie qui endormira tout ceux qui l'entendent dans un profond sommeil magique. Pour le héros et ses alliés ce repos est réparateur.

items.scrolls.scrollofmagicmapping.name=parchemin de cartographie magique
items.scrolls.scrollofmagicmapping.layout=Vous connaissez maintenant la disposition du niveau.
items.scrolls.scrollofmagicmapping.desc=Une fois lu, ce parchemin imprimera dans votre mémoire une image d'une clarté limpide révélant le plan du niveau ainsi que ses plus sombres secrets. L'emplacement des objets et des créatures demeurera inconnu.

items.scrolls.scrollofmirrorimage.name=parchemin d'image-miroir
items.scrolls.scrollofmirrorimage.copies=Le parchemin crée des images-miroir de vous.
items.scrolls.scrollofmirrorimage.no_copies=Le parchemin tente de créer des images-miroir de vous, mais elles n'ont nulle part où aller.
items.scrolls.scrollofmirrorimage.desc=L'incantation sur ce parchemin créera deux doublures illusoires. Ces images-miroir agissent comme de faibles clones, et traqueront leurs ennemis. Elles n'ont malheureusement aucune durée de vie et disparaîtront dès qu'elles subissent des dégâts.

items.scrolls.scrollofretribution.name=parchemin de rétribution
items.scrolls.scrollofretribution.blast=Une puissante énergie magique jaillit du parchemin !
items.scrolls.scrollofretribution.desc=Ce parchemin contient une énergie destructrice qui canalise la souffrance du lecteur ou de la lectrice pour la projeter en une rafale de puissance. Plus la personne qui lit est faible, plus elle infligera de dégâts. Avec une très faible santé ce parchemin peut instantanément tuer la plupart des ennemis.\n\nL'emploi de ce parchemin a cependant des conséquences néfastes sur la personne qui s'en sert, l'aveuglant et l'affaiblissant.

items.scrolls.scrollofrage.name=parchemin de colère
items.scrolls.scrollofrage.roar=Le sort émet un rugissement enrageant qui se réverbère dans le donjon !
items.scrolls.scrollofrage.desc=Quand il est lu à voix haute, ce parchemin libère un rugissement tonitruant qui guide les ennemis jusqu'à l'utilisateurice et enrage ceux qui sont proches.

items.scrolls.scrollofrecharging.name=parchemin de rechargement
items.scrolls.scrollofrecharging.surge=Une vague d'énergie déferle à travers votre corps, rechargeant vos baguettes magiques !
items.scrolls.scrollofrecharging.desc=Une fois relâché, le pouvoir énergétique brut lié à ce parchemin rechargera au fil du temps toutes les baguettes magiques de l'utilisateurice.

items.scrolls.scrollofremovecurse.name=parchemin de purification
items.scrolls.scrollofremovecurse.inv_title=Purifier un objet
items.scrolls.scrollofremovecurse.cleansed=Votre objet brille d'une lumière purificatrice, et une énergie malveillante se disperse !
items.scrolls.scrollofremovecurse.not_cleansed=Votre objet brille d'une lumière purificatrice, mais rien ne se passe.
items.scrolls.scrollofremovecurse.spirit=Votre parchemin libère l'esprit tourmenté !
items.scrolls.scrollofremovecurse.desc=L'incantation de ce parchemin enlèvera instantanément tout enchantement maléfique d'une unique arme, bague, baguette, armure ou artefact transporté.

items.scrolls.scrollofteleportation.name=parchemin de téléportation
items.scrolls.scrollofteleportation.tele=Vous avez été téléporté en un clin d'œil à un autre endroit de l'étage.
items.scrolls.scrollofteleportation.no_tele=Votre sort de téléportation échoue.
items.scrolls.scrollofteleportation.cant_reach=Vous ne pouvez pas vous téléporter ici
items.scrolls.scrollofteleportation.prompt=Choisissez un lieu où téléporter
items.scrolls.scrollofteleportation.desc=Le sort sur ce parchemin téléporte le lecteur à un autre endroit de ce niveau du donjon. Le parchemin privilégie les zones non visitées, mais ne peut pas passer à travers les portes fermées à clef ou les obstacles. Il peut, cependant, révéler des portes cachées qui mènent vers de nouveaux lieux.

items.scrolls.scrollofterror.name=parchemin de terreur
items.scrolls.scrollofterror.none=Le parchemin émet un brillant éclair de lumière rouge.
items.scrolls.scrollofterror.one=Le parchemin émet un brillant éclair de lumière rouge et le/la %s fuit !
items.scrolls.scrollofterror.many=Le parchemin émet un brillant éclair de lumière rouge et les monstres fuient !
items.scrolls.scrollofterror.desc=La lecture de ce parchemin produira un flash de lumière rouge accablant de terreur toutes les créatures dans votre champ de vision, qui s'enfuiront. Attaquer un ennemi en fuite va raccourcir cet effet.

items.scrolls.scrolloftransmutation.name=parchemin de transmutation
items.scrolls.scrolloftransmutation.inv_title=Transmuter un objet
items.scrolls.scrolloftransmutation.nothing=Il ne se passe rien d'intéressant.
items.scrolls.scrolloftransmutation.morph=Votre objet se métamorphose en quelque chose de différent !
items.scrolls.scrolloftransmutation.desc=Ce parchemin contient une puissante magie de transmutation. Lorsqu’il est utilisé sur un objet éligible, il le transformera en un objet différent du même type. La magie préservera même les améliorations, les enchantements et les glyphes. Les parchemins et les potions seront transmutés en leur équivalent exotique, et vice versa.

items.scrolls.scrollofupgrade.name=parchemin d'amélioration
items.scrolls.scrollofupgrade.inv_title=Améliorer un objet
items.scrolls.scrollofupgrade.weaken_curse=Le parchemin d'amélioration affaiblit la malédiction sur votre objet.
items.scrolls.scrollofupgrade.remove_curse=Le parchemin d'amélioration purifie la malédiction sur votre objet.
items.scrolls.scrollofupgrade.desc=Ce parchemin améliorera un seul objet ou un ensemble d'armes de jet. Les baguettes croîtront en pouvoir et nombre de charges, les armes et armures infligeront et bloqueront plus de dégâts, les armes de jet seront entièrement réparées et deviendront plus durables, et les effets des anneaux s'intensifieront.\n\nIl peut également affaiblir ou parfois entièrement lever les malédictions, mais n'est pas aussi puissant qu'un parchemin de purification. Malheureusement, la magie d'amélioration peut aussi effacer les glyphes et enchantements des équipements de haut niveau.



###exotic scrolls
items.scrolls.exotic.exoticscroll.kaunan=parchemin de KAUNAN exotique
items.scrolls.exotic.exoticscroll.sowilo=parchemin de SOWILO exotique
items.scrolls.exotic.exoticscroll.laguz=parchemin de LAGUZ exotique
items.scrolls.exotic.exoticscroll.yngvi=parchemin de YNGVI exotique
items.scrolls.exotic.exoticscroll.gyfu=parchemin de GYFU exotique
items.scrolls.exotic.exoticscroll.raido=parchemin de RAIDO exotique
items.scrolls.exotic.exoticscroll.isaz=parchemin de ISAZ exotique
items.scrolls.exotic.exoticscroll.mannaz=parchemin de MANNAZ exotique
items.scrolls.exotic.exoticscroll.naudiz=parchemin de NAUDIZ exotique
items.scrolls.exotic.exoticscroll.berkanan=parchemin de BERKANAN exotique
items.scrolls.exotic.exoticscroll.odal=parchemin de ODAL exotique
items.scrolls.exotic.exoticscroll.tiwaz=parchemin de TIWAZ exotique
items.scrolls.exotic.exoticscroll.unknown_desc=Une rune brillante de magie indéchiffrable est inscrite sur ce parchemin noir. Il semble étranger à cette terre, qui sait ce qui arrivera quand vous le lirez à haute voix ?
items.scrolls.exotic.exoticscroll.discover_hint=Vous pouvez fabriquer cet objet via l'alchimie.

items.scrolls.exotic.scrollofsirenssong.name=parchemin du chant des sirènes
items.scrolls.exotic.scrollofsirenssong.prompt=Choisissez une cible
items.scrolls.exotic.scrollofsirenssong.no_target=Le parchemin s'active sans cible.
items.scrolls.exotic.scrollofsirenssong.cancel=Vous devez choisir une cible.
items.scrolls.exotic.scrollofsirenssong.desc=Lire ce parchemin émettra une mélodie séduisante qui va envouter un ennemi, le faisant devenir un allié permanent ! Les autres ennemis entendant ce son seront temporairement charmés.\n\nLes ennemis particulièrement puissants pourront résister à l'envoutement, et seront charmés à la place.
items.scrolls.exotic.scrollofsirenssong$enthralled.name=envoûté
items.scrolls.exotic.scrollofsirenssong$enthralled.desc=Cette créature a été ensorcelée par la magie d'un parchemin du chant des sirènes.\n\nUn personnage envouté devient votre allié de manière permanente, et attaquera tous les ennemis qu'il rencontrera.

items.scrolls.exotic.scrollofantimagic.name=parchemin d'anti-magie
items.scrolls.exotic.scrollofantimagic.desc=L’incantation sur ce parchemin vous entourera d’une aura magique qui bloque temporairement tous les effets magiques, nuisibles ou utiles. Cela inclut la plupart des effets magiques comme les baguettes, parchemins, anneaux, artéfacts, enchantements et malédictions. Les capacités d’armure héroïque sont assez puissantes pour fonctionner malgré tout.

items.scrolls.exotic.scrollofchallenge.name=parchemin de défi
items.scrolls.exotic.scrollofchallenge.desc=Quand lu à haute voix, ce parchemin relâche un puissant rugissement qui attire tous les ennemis vers l'utilisateur, et crée simultanément une petite arène autour de lui.\n\nTant que le lecteur reste dans cette arène, il recevra 33% de dégâts en moins de toutes les sources (cela s'applique avant les autres formes de réduction de dégâts), et il ne perdra pas de satiété.\n\nLa taille de l'arène s'ajuste à la taille de la zone dans laquelle le lecteur se trouve. Elle peut être particulièrement petite dans certaines zones de boss.
items.scrolls.exotic.scrollofchallenge$challengearena.name=arène de défi
items.scrolls.exotic.scrollofchallenge$challengearena.desc=Une arène magique est apparue autour de vous, démarquée par un brouillard stagnant rouge.\n\nQuand vous vous tenez dans le brouillard, votre faim n'augmente pas et vous recevez 33%% de dégâts en moins de toutes les sources. Si vous possédez d'autres sources de réductions de dégâts (par exemple une armure), elles s'appliqueront après la réduction de 33%%.\n\nTours restants : %d.

items.scrolls.exotic.scrollofdivination.name=parchemin de divination
items.scrolls.exotic.scrollofdivination.nothing_left=Il ne reste rien à identifier !
items.scrolls.exotic.scrollofdivination.desc=Ce parchemin permet d'identifier aléatoirement 4 objets que vous ne connaissez pas encore. Cela peut être la couleur d'une potion, la rune d'un parchemin ou la gemme d'un anneau. Les objets identifiés ne sont pas forcément ceux que vous portez sur vous.
items.scrolls.exotic.scrollofdivination$wnddivination.desc=Votre parchemin de divination a identifié les objets suivants :

items.scrolls.exotic.scrollofdread.name=parchemin d'effroi
items.scrolls.exotic.scrollofdread.desc=Une fois lu, ce parchemin émettra un éclair de lumière rouge qui provoque une terreur incroyable chez tous les ennemis dans votre champ de vision. Cet effet est si grand qu'ils essaieront rapidement de s'enfuir du donjon, pour ne plus jamais être revus !\n\nComme pour la terreur, cet effet peut expirer avec le temps, ou si l'ennemi est attaqué.\n\nLes ennemis à forte volonté tels que les boss se verront infliger une terreur à la place.

items.scrolls.exotic.scrollofenchantment.name=parchemin d'enchantement
items.scrolls.exotic.scrollofenchantment.inv_title=Enchanter un objet
items.scrolls.exotic.scrollofenchantment.weapon=Choisissez un enchantement à appliquer à votre arme.
items.scrolls.exotic.scrollofenchantment.armor=Choisissez un glyphe à appliquer à votre armure.
items.scrolls.exotic.scrollofenchantment.cancel=annuler
items.scrolls.exotic.scrollofenchantment.cancel_warn=L'annulation consommera tout de même le parchemin d'enchantement, êtes-vous bien sûr de vouloir faire cela ?
items.scrolls.exotic.scrollofenchantment.cancel_warn_yes=Oui, je suis sûr.
items.scrolls.exotic.scrollofenchantment.cancel_warn_no=Non, j'ai changé d'avis
items.scrolls.exotic.scrollofenchantment.desc=Ce parchemin va infuser une arme ou une armure avec une puissante énergie magique. Le lecteur a un certain degré de contrôle sur quelle magie est imprégnée.

items.scrolls.exotic.scrollofforesight.name=parchemin de prévoyance
items.scrolls.exotic.scrollofforesight.desc=Après avoir lu ce parchemin, les détails du terrain proche seront transmis à l’esprit du lecteur dans une clarté cristalline. Cet effet dure un temps considérable et révélera toutes les portes et pièges cachés, rendant la recherche inutile.

items.scrolls.exotic.scrollofmetamorphosis.name=parchemin de métamorphose
items.scrolls.exotic.scrollofmetamorphosis.choose_desc=Choisissez un talent à métamorphoser.
items.scrolls.exotic.scrollofmetamorphosis.replace_desc=Choisissez un nouveau talent pour remplacer votre talent métamorphosé.
items.scrolls.exotic.scrollofmetamorphosis.cancel_warn=L'annulation consommera tout de même le parchemin de métamorphose, êtes-vous bien sûr de vouloir faire cela ?
items.scrolls.exotic.scrollofmetamorphosis.metamorphose_talent=métamorphoser le talent
items.scrolls.exotic.scrollofmetamorphosis.desc=Ce parchemin contient une puissante magie de transmutation, qui s'appliquera au lecteur plutôt qu'à un objet. La magie de ce parchemin vous permettra de sélectionner un talent et de le remplacer par un parmi cinq talents du même niveau de différentes classes de héros !\n\nCet effet ne peut s'appliquer qu'aux talents de classe, pas aux talents acquis des sous-classes ou des capacités d'armure. Les talents que vous ne pouvez pas utiliser ne seront pas proposés en option.

items.scrolls.exotic.scrollofmysticalenergy.name=parchemin d'énergie mystique
items.scrolls.exotic.scrollofmysticalenergy.desc=Une fois relâché, le pouvoir énergétique brut enfermé dans ce parchemin rechargera au fil du temps tous les artéfacts équipés de l'utilisateurice.

items.scrolls.exotic.scrollofpassage.name=parchemin de passage
items.scrolls.exotic.scrollofpassage.desc=Le sort sur ce parchemin téléporte instantanément le lecteur à l'entrée de région la plus proche au dessus de lui. Très utile pour rejoindre rapidement la boutique.

items.scrolls.exotic.scrollofprismaticimage.name=parchemin d'image prismatique
items.scrolls.exotic.scrollofprismaticimage.desc=L'incantation sur ce parchemin créera une doublure colorée du lecteur. Cette image prismatique agira comme un clone plus faible du lecteur avec les mêmes défenses mais moins de PV et de dégâts.\n\nCette image prismatique se montrera lorsque des ennemis seront présents et tentera de défendre le lecteur.\n\nSi une image prismatique existe déjà, l'utilisation de ce parchemin la guérira complètement.

items.scrolls.exotic.scrollofpsionicblast.name=parchemin de salve psionique
items.scrolls.exotic.scrollofpsionicblast.ondeath=La salve psionique déchire votre esprit...
items.scrolls.exotic.scrollofpsionicblast.desc=Ce parchemin contient une énergie destructrice incroyable qui peut être concentrée pour détruire les esprits de toutes les créatures visibles.\n\nIl y a cependant un violent contrecoup : la personne qui lit le parchemin sera aussi blessée, aveuglée et affaiblie. Plus le parchemin touche de cibles, moins vous prendrez de dégâts.



###spells
items.spells.alchemize.name=alchemiser
items.spells.alchemize.prompt=Transformer un objet
items.spells.alchemize.desc=Ce sort contient des pouvoirs de transmutation similaires à ceux que l'on trouve dans un chaudron d'alchimie. Chaque lancer permet à l'utilisateur de transformer un objet (ou une pile d'objets) en or ou en énergie alchimique. Changer les potions ou les parchemins en énergie les identifie par la même occasion !\n\nQuelques charges d'alchemiser sont vendues dans les magasins, mais on peut en fabriquer beaucoup plus via l'alchimie en combinant une graine, une pierre runique et un peu d'énergie alchimique.
items.spells.alchemize$wndalchemizeitem.sell=Transformer en %dg
items.spells.alchemize$wndalchemizeitem.sell_1=Transformer 1 en %dg
items.spells.alchemize$wndalchemizeitem.sell_all=Transformer tout en %dg
items.spells.alchemize$wndalchemizeitem.energize=Transformer en %d d'énergie
items.spells.alchemize$wndalchemizeitem.energize_1=Transformer 1 en %d d'énergie
items.spells.alchemize$wndalchemizeitem.energize_all=Transformer tout en %d d'énergie

items.spells.beaconofreturning.name=balise de retour
items.spells.beaconofreturning.preventing=La forte aura magique de ce lieu vous empêche d'utiliser le sort !
items.spells.beaconofreturning.creatures=L'aura psychique des créatures voisines ne vous permettent pas de vous téléporter en ce moment.
items.spells.beaconofreturning.set=La balise a été placée sur votre position actuelle.
items.spells.beaconofreturning.wnd_body=Le réglage annule la position de la balise précédemment définie.\n\nLe retour vous déplacera à votre précédente position définie et consommera une utilisation du sort.
items.spells.beaconofreturning.wnd_set=Réglage
items.spells.beaconofreturning.wnd_return=Retour
items.spells.beaconofreturning.desc_set=La balise a été réglée quelque part dans l'étage %d.
items.spells.beaconofreturning.desc=Ce sort donne à l'utilisateur la capacité de retourner à un endroit défini, peu importe la distance. Les charges ne seront consommées que quand vous vous téléportez. Il peut être placé autant de fois que vous le voulez, mais ne sera pris en compte que le dernier endroit sélectionné.

items.spells.curseinfusion.name=infusion maudite
items.spells.curseinfusion.inv_title=Maudire un objet
items.spells.curseinfusion.desc=Ce sort imprègne une pièce d'équipement avec la même magie maudite que celle présente dans le DM-300. L'objet sur lequel vous l'utilisez sera instantanément maudit, et n'importe quel enchantement ou glyphe qu'il pourrait posséder sera effacé.\n\nDans le cas d'armes, d'armures et de baguettes, l'objet gagnera des améliorations en plus d'être maudit. Les améliorations obtenues via les malédictions ne s'additionnent pas, et elles seront perdues si l'objet est purifié.\n\nVous pouvez réutiliser une infusion maudite sur une arme ou une armure pour changer sa malédiction.

items.spells.spell.ac_cast=UTILISER
items.spells.spell.no_magic=Vous ne pouvez pas jeter de sort quand vous êtes immunisé(e) à la magie.
items.spells.spell.discover_hint=Vous pouvez fabriquer cet objet via l'alchimie.

items.spells.magicalinfusion.name=infusion magique
items.spells.magicalinfusion.inv_title=Enchanter un objet
items.spells.magicalinfusion.infuse=Votre objet est imprégné d'énergie magique !
items.spells.magicalinfusion.desc=Ce sort possède le même pouvoir qu'un parchemin d'amélioration mais sous une forme plus stable.\n\nEn plus d'améliorer un objet, il n'effacera jamais un enchantement, glyphe ou malédiction.

items.spells.magicalporter.name=Téléporteur magique
items.spells.magicalporter.inv_title=Téléporter un objet
items.spells.magicalporter.nowhere=Il n'y a nulle part où téléporter un objet.
items.spells.magicalporter.desc=Ce sort téléporte les objets sur lesquels il est lancé. Contrairement à la balise du marchand, les objets seront transportés jusqu'à l'entrée du prochain étage de boss.

items.spells.phaseshift.name=déphasage
items.spells.phaseshift.no_target=Il n'y a rien à téléporter ici.
items.spells.phaseshift.desc=Ce sort chaotique téléportera n'importe quel personnage visé à un endroit aléatoire de l'étage actuel et l'étourdira de manière conséquente. Les ennemis puissants seront capables de résister à l'étourdissement. Le sort peut être lancé sur une cible ou sur vous-même.

items.spells.reclaimtrap.name=piège de récupération
items.spells.reclaimtrap.no_trap=Il n'y a pas de piège ici.
items.spells.reclaimtrap.desc_trap=Le sort est prêt à déclencher un _%s_.
items.spells.reclaimtrap.desc=Ce sort contient des restes de l'énergie mécanique de DM-300. Lancé sur un piège actif, la puissance du piège sera absorbée en vous, vous permettant réutiliser le sort pour déclencher l'effet du piège à n'importe quel emplacement choisi.\n\nNéanmoins, certains pièges ne fonctionnent pas partout, et un seul piège peut être stocké.

items.spells.recycle.name=recycleur
items.spells.recycle.inv_title=Recycler un objet
items.spells.recycle.recycled=Votre objet a été recyclé en : %s.
items.spells.recycle.desc=Ce sort possède une forme moins puissante de magie de transmutation. Il ne fonctionnera pas sur votre équipement, mais ce sort pourra transformer un parchemin, une potion, une graine ou une pierre runique en un objet aléatoire du même type.

items.spells.summonelemental.name=invoquer un élémentaire
items.spells.summonelemental.ac_imbue=IMPRÉGNER
items.spells.summonelemental.imbue_prompt=Imprégner un objet
items.spells.summonelemental.desc=Ce sort canalise l'énergie des braises élémentaires utilisées pour le fabriquer, et vous permettra d'invoquer un élémentaire amical pour combattre avec vous ! Un seul élémentaire peut être invoqué à la fois, mais le sort peut être réutilisé pour ramener l'élémentaire à vous sans aucun coût.
items.spells.summonelemental.desc_newborn=Le sort n'est actuellement pas imprégné et invoquera un _élémentaire nouveau-né _ sans attaque à distance. Vous pouvez imprégner une potion identifiée de feu liquide, une potion de froid, un parchemin de rechargement ou un parchemin de transmutation pour renforcer le sort, ce qui fera apparaitre lors des prochaines invocations un élémentaire de pleine puissance !
items.spells.summonelemental.desc_fire=Le sort est actuellement chaud au toucher, il va invoquer _élémentaire de feu_. Vous pouvez imprégner un objet différent, mais le sort perdra son imprégnation actuelle.
items.spells.summonelemental.desc_frost=Le sort est actuellement froid au toucher, il va invoquer _élémentaire de glace_. Vous pouvez imprégner un objet différent, mais le sort perdra son imprégnation actuelle.
items.spells.summonelemental.desc_shock=Le sort irradie actuellement d'énergie statique, il va invoquer un _élémentaire de foudre_. Vous pouvez imprégner un objet différent, mais le sort perdra son imprégnation actuelle.
items.spells.summonelemental.desc_chaos=Le sort irradie actuellement d'énergie chaotique, il va invoquer un _élémentaire du chaos_. Vous pouvez imprégner un objet différent, mais le sort perdra son imprégnation actuelle.

items.spells.targetedspell.prompt=Choisissez une cible
items.spells.targetedspell.inv_title=Enchanter un objet

items.spells.telekineticgrab.name=grappin télékinétique
items.spells.telekineticgrab.cant_grab=Vous ne pouvez pas prendre ça.
items.spells.telekineticgrab.no_target=Il n'y a rien à prendre ici.
items.spells.telekineticgrab.desc=Ce sort permet au lanceur de ramasser à distance tous les objets d'une case, ou toutes les armes à distance plantées dans un ennemi !\n\nIl ne peut être utilisé pour ramasser les objets de quelqu'un d'autre ou des conteneurs comme des coffres.

items.spells.unstablespell.name=sort instable
items.spells.unstablespell.desc=Ce petit cristal cubique noir présente des runes mouvantes sur chacune de ses faces.\n\nUne fois activé, l'effet d'un parchemin aléatoire sera déclenché. L'effet du parchemin sera utile pour le combat s'il y a des ennemis dans votre champ de vision, et non utile pour le combat dans le cas contraire.

items.spells.wildenergy.name=énergie sauvage
items.spells.wildenergy.desc=Ce sortilège contient des restes de l'énergie maudite qui alimentait le D.M.-300. Lancé, il rechargera vos baguettes et vos artéfacts équipés, tout en déclenchant un effet aléatoire d'une baguette maudite. Vous pouvez cependant choisir la direction où lancer cette magie maudite.


###runestones
items.stones.inventorystone.ac_use=UTILISER

items.stones.runestone$placeholder.name=pierre runique
items.stones.runestone.discover_hint=Vous pouvez trouver cet objet au hasard dans le donjon, ou le fabriquer via l'alchimie.

items.stones.stoneofaggression.name=pierre d'agressivité
items.stones.stoneofaggression.desc=Quand cette pierre est jetée sur un allié ou un ennemi, tous les ennemis à proximité préfèreront brièvement attaquer ce personnage.\n\nCependant les boss peuvent résister à cet effet, réduisant considérablement sa durée et recevant moins de dégâts de leurs sbires.
items.stones.stoneofaggression$aggression.name=ciblé
items.stones.stoneofaggression$aggression.desc=Une magie manipule tous les ennemis proches pour qu'ils préfèrent attaquer ce personnage.\n\nTours restants : %s.

items.stones.stoneofaugmentation.name=pierre d'augmentation
items.stones.stoneofaugmentation.inv_title=Augmenter un objet
items.stones.stoneofaugmentation.desc=Cette pierre runique possède une magie puissante qui peut augmenter un équipement pour améliorer une propriété au détriment d'une autre.\n\nL'utiliser sur une arme vous permet d'améliorer soit la vitesse, soit les dégâts. Les armes de jet verront leur durabilité adaptée en fonction de leur vitesse.\n\nL'utiliser sur une armure vous permet d'améliorer soit la défense, soit l'esquive.
items.stones.stoneofaugmentation.discover_hint=Vous pouvez acheter cet objet dans un magasin, ou le fabriquer via l'alchimie.
items.stones.stoneofaugmentation$wndaugment.choice=Que voudriez-vous améliorer ?
items.stones.stoneofaugmentation$wndaugment.speed=Vitesse
items.stones.stoneofaugmentation$wndaugment.damage=Dégâts
items.stones.stoneofaugmentation$wndaugment.evasion=Esquive
items.stones.stoneofaugmentation$wndaugment.defense=Défense
items.stones.stoneofaugmentation$wndaugment.none=Retirer l'Augmentation
items.stones.stoneofaugmentation$wndaugment.cancel=J'ai changé d'avis

items.stones.stoneofblast.name=pierre d'explosion
items.stones.stoneofblast.desc=Cette pierre runique va exploser instantanément à l'endroit où elle a été lancée. Tout comme une bombe, l'explosion endommagera tout ce qui se trouve à sa portée.

items.stones.stoneofblink.name=pierre de téléportation
items.stones.stoneofblink.desc=Cette pierre runique va téléporter l'utilisateur à l'endroit où elle est lancée.

items.stones.stoneofclairvoyance.name=pierre de clairvoyance
items.stones.stoneofclairvoyance.desc=Cette pierre va instantanément révéler toutes les cases dans une très grande zone autour de l'endroit où elle a été jetée. Son effet marche même à travers les murs.

items.stones.stoneofdeepsleep.name=pierre de sommeil profond
items.stones.stoneofdeepsleep.desc=Quand cette pierre est lancée sur un ennemi, elle le met dans un profond sommeil magique. Les ennemis endormis par magie ne se réveilleront que s'ils sont dérangés.

items.stones.stoneofdetectmagic.name=pierre de détection de la magie
items.stones.stoneofdetectmagic.inv_title=Détecter un objet
items.stones.stoneofdetectmagic.detected_none=Vous ne détectez aucune magie affectant cet objet.
items.stones.stoneofdetectmagic.detected_both=Vous détectez à la fois de la magie positive et malveillante sur cet objet !
items.stones.stoneofdetectmagic.detected_good=Vous détectez de la magie positive sur cet objet !
items.stones.stoneofdetectmagic.detected_bad=Vous détectez de la magie malveillante sur cet objet !
items.stones.stoneofdetectmagic.desc=Cette pierre runique est capable de détecter la magie affectant un objet. Utiliser cette pierre sur un objet non identifié vous indiquera s'il est affecté par une malédiction ou par de la magie positive comme un enchantement ou des améliorations.

items.stones.stoneofdisarming.name=pierre de désamorçage
items.stones.stoneofdisarming.desc=Cette pierre runique contient de la magie qui peut désarmer les pièges cachés à l'intérieur du donjon. Elle va désamorcer jusqu'à 9 pièges autour du lieu où elle a été jetée.

items.stones.stoneofenchantment.name=pierre d'enchantement
items.stones.stoneofenchantment.inv_title=Enchanter un objet
items.stones.stoneofenchantment.weapon=Votre arme brille dans l'obscurité !
items.stones.stoneofenchantment.armor=Votre armure brille dans l'obscurité !
items.stones.stoneofenchantment.desc=Cette pierre runique possède une magie d'enchantement. À la différence d'un parchemin d'amélioration, elle n'augmentera pas directement la puissance d'un objet, mais imprégnera plutôt une arme ou une armure d'un enchantement, lui conférant un nouveau pouvoir.

items.stones.stoneoffear.name=pierre de peur
items.stones.stoneoffear.desc=Quand cette pierre est lancée sur un ennemi, la terreur le submerge, le faisant s'enfuir. Attaquer un ennemi qui fuit réduira l'effet.

items.stones.stoneofflock.name=pierre de troupeau
items.stones.stoneofflock.desc=Cette pierre runique invoque des moutons magiques pour une courte durée autour de l'endroit où elle a été lancée.

items.stones.stoneofintuition.name=pierre d'intuition
items.stones.stoneofintuition.inv_title=Sélectionnez un objet
items.stones.stoneofintuition.desc=Cette pierre runique détient une version plus faible de la magie trouvée dans les parchemins d'identification. Au lieu d'identifier directement un objet, elle fera appel à votre intuition, vous permettant d'essayer d'identifier le type d'une potion, d'un parchemin ou d'un anneau en devinant.
items.stones.stoneofintuition.break_info=Une pierre d'intuition peut être utilisée deux fois avant de se briser, _la prochaine utilisation ne consommera pas la pierre_.
items.stones.stoneofintuition.break_warn=Vous avez déjà utilisé cette pierre d'intuition, _elle se brisera à la prochaine utilisation_.
items.stones.stoneofintuition$wndguess.text=Devinez quel est le type de l'objet non identifié. Si vous devinez correctement, le type sera identifié !
items.stones.stoneofintuition$wndguess.correct=Correct. Le type de l'objet a été identifié !
items.stones.stoneofintuition$wndguess.incorrect=Votre intuition était incorrecte.
items.stones.stoneofintuition$wndguess.break=Votre pierre d'intuition tombe en poussière...

items.stones.stoneofshock.name=pierre de décharge
items.stones.stoneofshock.desc=Cette pierre runique libère une explosion d'électricité qui étourdit brièvement les cibles alentour, et accorde au lanceur une charge de baguette pour chaque cible atteinte.


###trinkets
items.trinkets.chaoticcenser.name=encensoir chaotique
items.trinkets.chaoticcenser.spew=Votre encensoir va relâcher : %s.
items.trinkets.chaoticcenser.desc=Après quelques temps dans le chaudron d'alchimie cet encensoir est capable de produire de la fumée sans combustible ! Ces gaz s'accumulent puis s'échappent de l'encensoir vers les ennemis après un temps semi-aléatoire. Il semble capable de produire toutes sortes de gaz mais au moins vous serez avertis juste avant que l'encensoir ne s'active.
items.trinkets.chaoticcenser.typical_stats_desc=Cette babiole produit généralement des gaz nocifs en direction d'un ennemi tous les _%d_ tours en moyenne. Les gaz n'apparaissent que si des ennemis sont présents. Aux plus hauts niveaux ces gaz seront plus souvent exotiques et puissants.
items.trinkets.chaoticcenser.stats_desc=Cette babiole produit au niveau actuel des gaz nocifs en direction d'un ennemi tous les _%d_ tours en moyenne. Les gaz n'apparaissent que si des ennemis sont présents. Aux plus hauts niveaux ces gaz seront plus souvent exotiques et puissants.

items.trinkets.crackedspyglass.name=longue-vue ébréchée
items.trinkets.crackedspyglass.desc=Ce télescope portable serait un bel ouvrage de précision, si ce n'est la fissure qu'il a sur sa lentille frontale. La longue-vue semble vous aider à repérer de nouveaux objets dans le donjon, mais à cause de son défaut ces objets sont difficiles à distinguer !
items.trinkets.crackedspyglass.typical_stats_desc=Cette babiole a généralement _%1$s%% de chances_ de créer un objet caché supplémentaire dans chaque étage qui n'abrite pas un boss.
items.trinkets.crackedspyglass.stats_desc=Au niveau actuel, cette babiole a _%1$s%% de chances_ de créer un objet caché supplémentaire dans chaque étage qui n'abrite pas un boss.
items.trinkets.crackedspyglass.stats_desc_upgraded=Au niveau actuel, cette babiole a _100%% de chances_ de créer un objet caché supplémentaire dans chaque étage qui n'abrite pas un boss, et _%1$s%% de chances_ d'en créer un second.

items.trinkets.dimensionalsundial.name=cadran solaire dimensionnel
items.trinkets.dimensionalsundial.warning=Votre cadran solaire ne projette aucune ombre, vous vous sentez mal à l'aise.
items.trinkets.dimensionalsundial.desc=Ce petit cadran solaire portable est étrangement capable de projeter une ombre dans les profondeurs du donjon, même si vous ne le tenez pas droit. Plus étrange encore, la position de l'ombre n'a aucun rapport avec celle du soleil de ce monde. Quand il ne projette pas d'ombre, le cadran solaire semble attirer le danger.
items.trinkets.dimensionalsundial.typical_stats_desc=Cette babiole diminue généralement le taux d'apparition des ennemis de _%1$d%%_ quand il fait jour dans la vraie vie (de 8h à 20h) et augmente le taux d'apparition des ennemis de _%2$d%%_ pendant la nuit (de 20h à 8h).
items.trinkets.dimensionalsundial.stats_desc=Au niveau actuel, cette babiole diminue le taux d'apparition des ennemis de _%1$d%%_ quand il fait jour dans la vraie vie (de 8h à 20h) et augmente le taux d'apparition des ennemis de _%2$d%%_ pendant la nuit (de 20h à 8h).

items.trinkets.exoticcrystals.name=cristaux exotiques
items.trinkets.exoticcrystals.desc=Ces petits cristaux roses ont la même forme que ceux d'énergie alchimique. Si on ne peut pas les utiliser directement comme énergie, il semblent capables d'influencer les potions et les parchemins que vous trouvez.
items.trinkets.exoticcrystals.typical_stats_desc=Cette babiole remplace généralement _%s%%_ des potions et parchemins par leurs équivalents exotiques. Cela n'affecte pas les potions de force et les parchemins d'amélioration, ni les objets générés pour résoudre les salles spéciales.
items.trinkets.exoticcrystals.stats_desc=Au niveau actuel, cette babiole remplacera _%s%%_ des potions et parchemins par leurs équivalents exotiques. Cela n'affecte pas les potions de force et les parchemins d'amélioration, ni les objets générés pour résoudre les salles spéciales.

items.trinkets.eyeofnewt.name=œil de triton
items.trinkets.eyeofnewt.desc=Cet œil de triton jaune et noir est un ingrédient commun transformé en babiole. L’œil semble affaiblir votre vue en échange d'une vision moins conventionnelle.
items.trinkets.eyeofnewt.typical_stats_desc=Cette babiole réduit généralement votre champ de vision de _%1$s%%_, mais vous accordera une vision spirituelle des ennemis à _%2$d_ tuiles.
items.trinkets.eyeofnewt.stats_desc=Au niveau actuel, cette babiole réduira votre champ de vision de _%1$s%%_, mais vous accordera une vision spirituelle des ennemis à _%2$d_ tuiles.

items.trinkets.ferrettuft.name=touffe de poils de furet
items.trinkets.ferrettuft.desc=Une touffe de poils de furet blanche et soyeuse, attachée par un ruban vert clair avec un nœud. Les furets sont connus pour leur agilité, leur malice et leur capacité à pouvoir se déformer. Certains de ces pouvoirs semblent émaner de la babiole, améliorant l'esquive de quiconque à proximité.
items.trinkets.ferrettuft.typical_stats_desc=Cette babiole augmente généralement l'esquive de tous les personnages de _%1$s%%_.
items.trinkets.ferrettuft.stats_desc=Au niveau actuel, cette babiole augmente l'esquive de tous les personnages de _%1$s%%_.

items.trinkets.mimictooth.name=croc de mimique
items.trinkets.mimictooth.desc=Cette grande dent acérée doit avoir été arrachée d'une mimique très méchante. Elle semble influencer les mimiques du donjon, les rendant plus fréquentes et dangereuses.
items.trinkets.mimictooth.typical_stats_desc=Cette babiole rend généralement tous les types de mimiques _%1$sx_ plus communs, rendra les mimiques bien plus difficiles à détecter et augmentera leur butin. Chaque étage aura de plus _%2$s%%_ de chances de contenir une mimique d'ébène très discrète.
items.trinkets.mimictooth.stats_desc=Au niveau actuel, cette babiole rendra tous les types de mimiques _%1$sx_ plus communs, rendra les mimiques bien plus difficiles à détecter et augmentera leur butin. Chaque étage aura de plus _%2$s%%_ de chances de contenir une mimique d'ébène très discrète.

items.trinkets.mossyclump.name=touffe moussue
items.trinkets.mossyclump.desc=Cette touffe de mousse humide reste mouillée peu importe comment vous l'essorez. Elle semble liée magiquement au donjon lui-même, rendant les herbes et l'eau plus communes.
items.trinkets.mossyclump.typical_stats_desc=Cette babiole a généralement _%d%%_ de chances de remplir un niveau normal avec de l'eau ou de l'herbe.\n\nCette babiole demande une grande quantité d'énergie pour être améliorée.
items.trinkets.mossyclump.stats_desc=Au niveau actuel, cette babiole a _%d%%_ de chances de remplir un niveau normal avec de l'eau ou de l'herbe.\n\nCette babiole demande une grande quantité d'énergie pour être améliorée.

items.trinkets.parchmentscrap.name=fragment de parchemin
items.trinkets.parchmentscrap.desc=Ce petit morceau de papier à l'air de provenir d'un parchemin. Il a conservé un peu de sa magie et semble influencer les armes et armures trouvées dans le donjon.
items.trinkets.parchmentscrap.typical_stats_desc=Cette babiole rend généralement les enchantements et glyphes _%dx plus courants_ et les malédictions sur les armes et armures _%sx plus courantes_. Les malédictions sur les baguettes, anneaux et artéfacts ne sont pas affectées.\n\nCette babiole demande une grande quantité d'énergie pour être améliorée.
items.trinkets.parchmentscrap.stats_desc=Au niveau actuel, cette babiole rend les enchantements et glyphes _%dx plus courants_ et les malédictions sur les armes et armures _%sx plus courantes_. Les malédictions sur les baguettes, anneaux et artéfacts ne sont pas affectées.\n\nCette babiole demande une grande quantité d'énergie pour être améliorée.

items.trinkets.petrifiedseed.name=graine fossilisée
items.trinkets.petrifiedseed.desc=Cette graine a été fossilisée par un lent processus géologique ou par la magie. Elle semble influencer la flore du donjon, remplaçant occasionnellement les graines par des pierres runiques.
items.trinkets.petrifiedseed.typical_stats_desc=Cette babiole remplace généralement _%1$s%%_ des graines obtenues en piétinant des herbes hautes par des pierres runiques, et l'herbe haute fait apparaitre _%2$s%%_ plus souvent des objets.
items.trinkets.petrifiedseed.stats_desc=Au niveau actuel, cette babiole remplace _%1$s%%_ des graines obtenues en piétinant des herbes hautes par des pierres runiques, et l'herbe haute fait apparaitre _%2$s%%_ plus souvent des objets.

items.trinkets.ratskull.name=crane de rat
items.trinkets.ratskull.desc=Cette babiole macabre est à peine plus grosse que le crâne d'un rat de taille normale, ce qui en fait ironiquement un objet rare dans ce donjon. L'influence magique du crâne semble attirer les résidents les moins communs du donjon et les rends beaucoup plus faciles à rencontrer.
items.trinkets.ratskull.typical_stats_desc=Cette babiole rend généralement les ennemis exotiques _%dx_ plus courants. L'effet est cependant réduit de moitié pour les mimiques de cristal et les statues en armure.
items.trinkets.ratskull.stats_desc=Au niveau actuel, cette babiole rend les ennemis exotiques _%dx_ plus courants. L'effet est cependant réduit de moitié pour les mimiques de cristal et les statues en armure.

items.trinkets.saltcube.name=cube de sel
items.trinkets.saltcube.desc=Ce grand cristal de sel a été taillé en un cube parfait, et a étrangement absorbé l'eau du chaudron au lieu de se dissoudre. Il semble conserver par magie la nourriture que vous mangez, rallongeant votre satiété mais réduisant aussi votre guérison passive quand vous n'êtes pas affamé.
items.trinkets.saltcube.typical_stats_desc=Cette babiole augmente généralement de _%1$s%%_ votre temps avant d'avoir faim, mais ralentira aussi votre régénération de vie de _%2$s%%_, sauf quand l'étage est bloqué.
items.trinkets.saltcube.stats_desc=À son niveau actuel, cette babiole augmentera de _%1$s%%_ votre temps avant d'avoir faim, mais ralentira aussi votre régénération de vie de _%2$s%%_ sauf quand l'étage est bloqué.

items.trinkets.shardofoblivion.name=éclat du vide
items.trinkets.shardofoblivion.desc=Après avoir mijoté dans le chaudron, cet éclat de métal maudit est devenu un éclat de... rien ? Il semble courber la lumière autour de lui, et lévite sur place quand vous le lâchez. L'éclat semble tirer de l'énergie de votre ignorance, c'est sûrement une meilleure idée de ne pas trop y penser.
items.trinkets.shardofoblivion.typical_stats_desc=Cette babiole augmentera typiquement le taux de butin donné par les ennemis de 20%% pour chaque équipement non identifié que vous avez équipé ou utilisé récemment, pour un maximum de _%d objet(s)_. L'éclat empêche également d'identifier des équipements, mais peut être utilisé pour identifier manuellement les objets qui sont prêts à cela.
items.trinkets.shardofoblivion.stats_desc=À son niveau actuel, cette babiole augmentera le taux de butin donnés par les ennemis de 20%% pour chaque équipement non identifié que vous avez équipé ou utilisé récemment, pour un maximum de _%d objet(s)_. L'éclat empêche également d'identifier des équipements, mais peut aussi être utilisé pour identifier manuellement les objets qui sont prêts à cela.
items.trinkets.shardofoblivion.ac_identify=IDENTIFIER
items.trinkets.shardofoblivion.identify_prompt=Identifier un objet
items.trinkets.shardofoblivion.identify_ready=Un objet est prêt à être identifié : %s. Utilisez votre éclat du vide dessus pour l'identifier.
items.trinkets.shardofoblivion.identify_ready_worn=Vos objets portés sont maintenant tous prêts à être identifiés. Utilisez votre éclat du vide sur les objets pour les identifier.
items.trinkets.shardofoblivion.identify_not_yet=Cet objet n'est pas encore prêt à être identifié.
items.trinkets.shardofoblivion.identify=Vous identifiez l'objet !
items.trinkets.shardofoblivion$wandusetracker.name=Baguette Non Identifiée Utilisée
items.trinkets.shardofoblivion$wandusetracker.desc=Vous avez récemment utilisé une baguette non identifiée, ce qui compte comme un équipement non identifié pour l'éclat du vide pendant quelques temps.\n\nTours restants : %s.
items.trinkets.shardofoblivion$thrownusetracker.name=Arme de jet non identifiée utilisée
items.trinkets.shardofoblivion$thrownusetracker.desc=Vous avez récemment utilisé une arme de jet non identifiée, ce qui compte comme un équipement non identifié pour l'éclat du vide pendant quelques temps.\n\nTours restants : %s.

items.trinkets.thirteenleafclover.name=trèfle à treize feuilles
items.trinkets.thirteenleafclover.desc=Le bain dans le chaudron alchimique a rajouté plein de feuilles à ce trèfle ! Vous ne savez pas vraiment s'il va vous porter bonheur ou malheur, peut-être que votre chance sera plus chaotique ?
items.trinkets.thirteenleafclover.typical_stats_desc=Typiquement, cette babiole vous fait infliger le maximum de dégâts _%1$d%%_ du temps, et le minimum de dégâts _%2$d%%_ du temps.
items.trinkets.thirteenleafclover.stats_desc=Au niveau actuel, cette babiole vous fait infliger le maximum de dégâts _%1$d%%_ du temps, et le minimum de dégâts _%2$d%%_ du temps.

items.trinkets.trapmechanism.name=mécanisme de piège
items.trinkets.trapmechanism.desc=Le mécanisme interne d'un piège à trappe du donjon, délicatement retiré du sol pour pouvoir être transporté. Il semble magiquement lié au donjon, rendant les terrains dangereux plus communs mais augmentant aussi votre attention pour les pièges.
items.trinkets.trapmechanism.typical_stats_desc=Typiquement, cette babiole a _%1$d%%_ de chances de remplir un niveau normal avec des pièges ou des trous. De plus, _%2$d%%_ des pièges cachés du donjon seront rendus visibles.
items.trinkets.trapmechanism.stats_desc=Au niveau actuel, cette babiole a _%1$d%%_ de chances de remplir un niveau normal avec des pièges ou des trous. De plus, _%2$d%%_ des pièges cachés du donjon seront rendus visibles.

items.trinkets.vialofblood.name=fiole de sang
items.trinkets.vialofblood.desc=Cette fine fiole contient le sang d'un résident du donjon, qui bouge lentement quand vous tournez la fiole. Sa magie semble améliorer les effets de guérison, mais aussi les retarder.
items.trinkets.vialofblood.typical_stats_desc=En général, cette babiole augmente de _%1$s%%_ la quantité de santé gagnée en buvant des potions de soin, outres et puits de santé. Cependant, ces effets de soin sont diffusés plus lentement, régénérant au maximum _%2$s_ PV par tour (proportionnel au niveau du héros).
items.trinkets.vialofblood.stats_desc=À son niveau actuel, cette babiole augmente de _%1$s%%_ la quantité de santé gagnée en buvant des potions de soin, outres et puits de santé. Cependant, ces effets de soin sont diffusés plus lentement, régénérant au maximum _%2$s_ PV par tour (proportionnel au niveau du héros).

items.trinkets.wondrousresin.name=résine merveilleuse
items.trinkets.wondrousresin.desc=Cette résine bleue scintillante semble posséder l'essence magique distillée d'une baguette maudite. La magie de l'alchimie semble l'avoir stabilisée, et elle affecte maintenant vos baguettes.
items.trinkets.wondrousresin.typical_stats_desc=Généralement, cette babiole rend bénéfiques ou neutres _%1$s%%_ des effets de baguettes maudites. Les baguettes non maudites lanceront _%2$s%%_ du temps un effet supplémentaire neutre ou positif de baguette maudite.\n\nCette babiole demande une grande quantité d'énergie pour être améliorée.
items.trinkets.wondrousresin.stats_desc=Au niveau actuel, cette babiole rend bénéfiques ou neutres _%1$s%%_ des effets de baguettes maudites. Les baguettes non maudites lanceront _%2$s%%_ du temps un effet supplémentaire neutre ou positif de baguette maudite.\n\nCette babiole demande une grande quantité d'énergie pour être améliorée.

items.trinkets.trinketcatalyst.name=catalyseur magique
items.trinkets.trinketcatalyst.window_title=créer une babiole
items.trinkets.trinketcatalyst.window_text=L'eau commence à luire quand vous ajouter le catalyseur. Il y a quelques objets à proximité que vous pouvez imprégner d'énergie pour les transformer en babiole magique.
items.trinkets.trinketcatalyst.desc=Cette boule de poussière dorée magique scintille dans l'obscurité du donjon. Ce catalyseur peut être utilisé dans un chaudron alchimique avec un peu d'énergie alchimique pour fabriquer une babiole unique.\n\nLes babioles offrent une variété d'effets qui altèrent légèrement le donjon ou ses habitants. Les babioles peuvent être améliorées avec plus d'énergie alchimique pour renforcer leurs effets ou abandonnées pour annuler complètement leurs effets.
items.trinkets.trinketcatalyst$randomtrinket.name=babiole aléatoire
items.trinkets.trinketcatalyst$randomtrinket.desc=Un objet est coincé dans une bourse que vous n'arrivez pas à ouvrir.\n\nLe processus d'alchimie va dissoudre la bourse, mais vous ne savez pas quelle babiole vous obtiendrez !

items.trinkets.trinket.discover_hint=Cet objet peut être l'un des choix possibles lorsque vous créez une babiole via l'alchimie.
items.trinkets.trinket$placeholder.name=babiole

###wands
items.wands.cursedwand.ondeath=Vous avez été tué par votre propre %s.
items.wands.cursedwand.nothing=Rien ne se passe.
items.wands.cursedwand.mass_invuln=Une lumière éclatante jaillit de votre baguette !
items.wands.cursedwand.petrify=Vous vous figez sur place !
items.wands.cursedwand.grass=De l'herbe émerge autour de vous !
items.wands.cursedwand.fire=Vous sentez le brûlé...
items.wands.cursedwand.transmogrify_wand=Votre baguette se transforme en un autre objet !
items.wands.cursedwand.transmogrify_other=Votre objet se transmute en quelque chose de différent !
items.wands.cursedwand.disguise=Votre apparence change devant vos yeux !
items.wands.cursedwand.supernova=Une boule d'énergie flamboyante se met à grossir... Vous feriez mieux de courir !
items.wands.cursedwand.supernova_positive=Une boule d'énergie flamboyante se met à grossir, mais semble étrangement sans danger.
items.wands.cursedwand.sinkhole=Le sol commence à s'effondrer autour de vous !
items.wands.cursedwand.sinkhole_positive=Le sol commence à céder, mais semble rester solide sous vos pieds.
items.wands.cursedwand.gravity=La gravité se met à tirer dans des directions au hasard !
items.wands.cursedwand.gravity_positive=La gravité se met à tirer dans des directions au hasard, mais semble ne pas vous affecter.
items.wands.cursedwand.gravity_end=Le chaos gravitationnel s'arrête.

items.wands.damagewand.upgrade_stat_name_1=Dégâts magiques

items.wands.wand.ac_zap=UTILISER
items.wands.wand.fizzles=Votre baguette s'interrompt ; elle doit manquer de charges.
items.wands.wand.no_magic=Votre baguette grésille; vous ne pouvez pas l'utiliser en étant immunisé à la magie.
items.wands.wand.self_target=Vous ne pouvez pas vous cibler !
items.wands.wand.identify=Vous vous êtes suffisamment familiarisé avec votre baguette pour l'identifier.
items.wands.wand.resin_one=Cette baguette a gagné _1 niveau_ grâce à la résine arcanique.
items.wands.wand.resin_many=Cette baguette a gagné _%d niveaux_ grâce à la résine arcanique.
items.wands.wand.cursed=Cette baguette est maudite, rendant sa magie chaotique et aléatoire.
items.wands.wand.not_cursed=Cette baguette est dépourvue de toute aura malveillante.
items.wands.wand.curse_discover=Cet(te) %s est maudit(e) !
items.wands.wand.prompt=Choisissez un endroit pour tirer
items.wands.wand$placeholder.name=baguette

items.wands.wandofblastwave.name=Baguette d'onde de choc
items.wands.wandofblastwave.staff_name=Bâton d'onde de choc
items.wands.wandofblastwave.ondeath=Vous vous êtes suicidé avec votre propre baguette d'onde de choc...
items.wands.wandofblastwave.knockback_ondeath=Vous n'avez pas survécu à la collision...
items.wands.wandofblastwave.desc=Cette baguette magique est faite d'une sorte de pierre marbrée, avec des bordures dorées et une gemme noire et ronde à son bout. Elle paraît très lourde dans votre main.
items.wands.wandofblastwave.typical_stats_desc=Cette baguette envoie des boules d'énergie qui explosent sur leur cibles. La force du souffle cause généralement _%1$d-%2$d dégâts_ et envoie les ennemis voler au loin.
items.wands.wandofblastwave.stats_desc=Cette baguette envoie des boules d'énergie qui explosent sur leurs cibles. La force du souffle cause _%1$d-%2$d_ dégâts et envoie les ennemis voler au loin.
items.wands.wandofblastwave.upgrade_stat_name_2=Recul
items.wands.wandofblastwave.bmage_desc=Quand _le Mage de Guerre_ frappe un ennemi paralysé avec un bâton d'onde de choc, la paralysie sera consumée pour infliger des dégâts magiques bonus. Il y a un court temps de recharge pour chaque ennemi.
items.wands.wandofblastwave.eleblast_desc=Une explosion élémentaire avec un bâton d'onde de choc infligera 67% des dégâts et repoussera tous les ennemis en dehors de la zone d'explosion.

items.wands.wandofcorrosion.name=Baguette de corrosion
items.wands.wandofcorrosion.staff_name=Bâton de corrosion
items.wands.wandofcorrosion.desc=Cette baguette est formée d'un corps cendré qui s'ouvre sur une éclatante gemme orange.
items.wands.wandofcorrosion.stats_desc=Cette baguette tire un projectile qui explose au contact des ennemis en un nuage de gaz hautement corrosif. Tout ce qui est pris dans ce nuage subira des dégâts qui augmenteront avec le temps, commençant à _%d dégâts._
items.wands.wandofcorrosion.upgrade_stat_name_1=Dégâts corrosifs
items.wands.wandofcorrosion.upgrade_stat_name_2=Volume de gaz
items.wands.wandofcorrosion.bmage_desc=Quand _le Mage de Guerre_ frappe un ennemi avec un bâton de corrosion, l'ennemi a une chance de se faire recouvrir de vase caustique.
items.wands.wandofcorrosion.eleblast_desc=Une explosion élémentaire avec un bâton de corrosion infligera aux ennemis 4 tours de corrosion commençant à 6 dégâts.

items.wands.wandofcorruption.name=baguette de corruption
items.wands.wandofcorruption.staff_name=Bâton de corruption
items.wands.wandofcorruption.already_corrupted=Ce personnage ne peut plus être influencé.
items.wands.wandofcorruption.desc=Cette baguette rayonne d'une énergie sombre et chaotique, si cela n'était pas déjà évident du petit crâne décoratif formé sur son extrémité.
items.wands.wandofcorruption.stats_desc=Cette baguette libèrera une explosion d'énergie corrompue qui affaiblira les ennemis et finira par les soumettre à votre volonté. Les ennemis sont capables de résister à la corruption, mais les ennemis affaiblis sont beaucoup plus faciles à corrompre que ceux qui sont en bonne santé.
items.wands.wandofcorruption.upgrade_stat_name_1=Puissance de corruption
items.wands.wandofcorruption.upgrade_stat_name_2=Durée des effets
items.wands.wandofcorruption.bmage_desc=Quand _le Mage de Guerre_ frappe un ennemi avec un bâton de corruption, l'ennemi a une chance de s'enrager.
items.wands.wandofcorruption.eleblast_desc=Une explosion élémentaire avec un bâton de corruption infligera aux ennemis 5 tours de folie furieuse.

items.wands.wandofdisintegration.name=baguette de désintégration
items.wands.wandofdisintegration.staff_name=Bâton de désintégration
items.wands.wandofdisintegration.desc=Cette baguette magique est faite d'un morceau lisse d'obsidienne, une lumière d'un pourpre profond courant sur ses flancs et se concentrant à son bout. Elle brille d'une énergie destructrice, prête à jaillir.
items.wands.wandofdisintegration.stats_desc=Cette baguette lance un rayon qui perce tous les obstacles qu'il rencontre. La portée de ce rayon augmente avec le nombre d'améliorations. Le rayon inflige _%1$d-%2$d_ dégâts et inflige des dégâts supplémentaires pour chaque ennemi ou mur qu'il traverse.
items.wands.wandofdisintegration.upgrade_stat_name_2=Portée maximale
items.wands.wandofdisintegration.bmage_desc=Lorsqu'il est manié par _le mage de guerre_, un bâton de désintégration a une portée d'attaque plus importante, comme s'il avait un enchantement de projection.
items.wands.wandofdisintegration.eleblast_desc=Une explosion élémentaire avec un bâton de désintégration infligera 100% des dégâts et traversera les murs.

items.wands.wandoffireblast.name=baguette de souffle de feu
items.wands.wandoffireblast.staff_name=Bâton de souffle de feu
items.wands.wandoffireblast.desc=Cette baguette magique est faite de bois rouge laqué et d'une feuille dorée utilisée généreusement lui donnant un côté royal. Son sommet siffle et craque, impatient de libérer son pouvoir magique.
items.wands.wandoffireblast.stats_desc=Cette baguette fait jaillir un cône de feu lorsqu'elle est utilisée. Son attaque suivante consommera _%1$d charges_ et causera _%2$d-%3$d_ dégâts. Plus la baguette utilise de charges, plus grand et puissant sera le cône de feu.
items.wands.wandoffireblast.upgrade_stat_name_1=Dégâts, 1 charge
items.wands.wandoffireblast.upgrade_stat_name_2=Dégâts, 2 charges
items.wands.wandoffireblast.upgrade_stat_name_3=Dégâts, 3 charges
items.wands.wandoffireblast.bmage_desc=Quand _le Mage de Guerre_ frappe un ennemi avec un bâton de souffle de feu, il y a des chances de produire une explosion qui blesse les ennemis et éteint toute flamme à proximité ! Cette probabilité augmente avec la quantité de feu adjacente à l'ennemi.
items.wands.wandoffireblast.eleblast_desc=Une explosion élémentaire avec un bâton de souffle de feu infligera 100% des dégâts, le souffle ouvrira les portes et enflammera les ennemis et le terrain.

items.wands.wandoffrost.name=baguette de gel
items.wands.wandoffrost.staff_name=Bâton de gel
items.wands.wandoffrost.desc=Cette baguette semble être faite d'une sorte de glace magique. Elle devient plus brillante vers son bout arrondi. Elle semble très froide lorsqu'elle est tenue, mais d'une manière ou d'une autre votre main reste chaude.
items.wands.wandoffrost.stats_desc=Cette baguette magique envoie des souffles d'énergie glacée vers vos ennemis, leur infligeant _ %1$d-%2$d dégâts_. Ce souffle les refroidit, ce qui réduit leur vitesse. L'effet semble plus fort dans l'eau. Les ennemis déjà refroidis ou gelés prennent moins de dommages de cette baguette magique.
items.wands.wandoffrost.upgrade_stat_name_2=Durée du refroidissement
items.wands.wandoffrost.bmage_desc=Quand _le Mage de Guerre_ frappe un ennemi avec un bâton de gel, l'ennemi a une chance d'être immédiatement gelé. Plus un ennemi est refroidi, plus cette chance s’accroît.
items.wands.wandoffrost.eleblast_desc=Une explosion élémentaire avec un bâton de gel infligera 100% des dégâts, gèlera les ennemis et éteindra le feu.

items.wands.wandoflightning.name=baguette de foudre
items.wands.wandoflightning.staff_name=bâton d'éclair
items.wands.wandoflightning.ondeath=Vous vous êtes tué vous-même avec votre propre baguette de foudre....
items.wands.wandoflightning.desc=Cette baguette magique est en métal, la rendant étonnement lourde. Deux broches recourbées terminent la baguette et un arc électrique se forme entre elles.
items.wands.wandoflightning.stats_desc=Cette baguette envoie de puissantes décharges électriques à travers tout ce qui est ciblé, infligeant _%1$d-%2$d_ dégâts._ Cette électricité va se propager de proche en proche. Elle se propage plus facilement dans l'eau. Les arcs électriques de cette baguette peuvent vous blesser, mais ne feront pas de mal à vos alliés.
items.wands.wandoflightning.bmage_desc=Quand _le Mage de Guerre_ frappe un ennemi avec un bâton d'éclair, il a des chances de devenir électriquement chargé pendant 10 tours. Quand il est chargé, le Mage de Guerre est immunisé aux dégâts électriques et les éclairs se propageront plus loin.
items.wands.wandoflightning.eleblast_desc=Une explosion élémentaire avec un bâton de foudre infligera 100% des dégâts, étourdira les ennemis pendant 5 tours et l'eau sera électrifiée.
items.wands.wandoflightning$lightningcharge.name=Électriquement chargé
items.wands.wandoflightning$lightningcharge.desc=Le Mage de Guerre est chargé d'énergie, ce qui l'immunise aux effets de son bâton d'éclair et améliore la portée de propagation des éclairs qu'il lance avec.\n\nTours restants : %s.

items.wands.wandoflivingearth.name=baguette de terre vivante
items.wands.wandoflivingearth.staff_name=bâton de terre vivante
items.wands.wandoflivingearth.desc=Cette baguette est fabriquée à partir d'une roche étrange, avec d'éclatantes bandes d'énergie jaune. Les roches semblent se déplacer légèrement lorsque vous saisissez la baguette, comme si elles pouvaient sentir votre main.
items.wands.wandoflivingearth.stats_desc=Cette baguette envoie des décharges de roches magiques sur les ennemis, leur infligeant de _%1$d à %2$d dégâts._ Les pierres vont ensuite se reformer autour de l'utilisateur, le protégeant comme une armure en fonction des dégâts infligés. Si il y a assez de pierres, elles se rassembleront en un gardien de terre dès que la baguette sera utilisée.
items.wands.wandoflivingearth.upgrade_stat_name_2=PV max du gardien
items.wands.wandoflivingearth.upgrade_stat_name_3=Blocage du gardien
items.wands.wandoflivingearth.bmage_desc=Quand _le Mage de Guerre_ frappe un ennemi avec un bâton de terre vivante, une partie des dégâts infligés est retourné en tant qu'armure de pierre.
items.wands.wandoflivingearth.eleblast_desc=Une explosion élémentaire avec un bâton de terre vivante infligera 50% des dégâts et soignera un gardien de terre actif pour chaque ennemi touché.
items.wands.wandoflivingearth$rockarmor.name=armure de pierre
items.wands.wandoflivingearth$rockarmor.desc=Des pierres magiques entourent votre corps. Lorsque vous serez attaqué, elles tenteront de s'interposer et réduiront les dégâts reçus de 50%%. Cependant, chaque dommage bloqué enlève une partie de la roche.\n\nArmure restante : %1$d.\n\nSi suffisamment de roches sont construites autour de vous, la prochaine utilisation de votre baguette de terre vivante transformera une partie de celles-ci en un gardien qui se battra avec vous.\n\nArmure nécessaire pour le Gardien : %2$d.
items.wands.wandoflivingearth$rockarmor.desc_many=Ce gardien de terre bénéficie aussi du Pouvoir du Nombre. Tours restants : %d.
items.wands.wandoflivingearth$earthguardian.name=gardien de terre
items.wands.wandoflivingearth$earthguardian.desc=Les roches de votre baguette de terre vivante se sont formées en un gardien de terre protecteur ! Ce gardien rocheux attaquera les ennemis proches, ce qui les forcera à viser le gardien au lieu de vous. Lorsque toutes les menaces à proximité seront parties, le gardien se reformera autour de vous, et reviendra lorsque vous utiliserez votre baguette la prochaine fois.
items.wands.wandoflivingearth$earthguardian.wand_info=La puissance défensive du gardien est liée au niveau de votre baguette. Elle bloque actuellement _%1$d%2$d dégâts._
items.wands.wandoflivingearth$earthguardian.discover_hint=Vous pouvez trouver ce personnage à l'aide d'une baguette.

items.wands.wandofmagicmissile.name=baguette de projectile magique
items.wands.wandofmagicmissile.staff_name=bâton de projectile magique
items.wands.wandofmagicmissile.desc=Cette baguette assez simple lance des projectiles d'énergie magique pure. Bien que la baguette elle-même n'ait pas d'effets spéciaux, elle a plus de charges disponibles et peut brièvement renforcer d'autres baguettes lorsqu'elle est améliorée.
items.wands.wandofmagicmissile.stats_desc=Chaque tir de cette baguette fait _%1$d-%2$d dégâts, _ et surchargera brièvement les autres baguettes si elle est améliorée.
items.wands.wandofmagicmissile.bmage_desc=Quand _le Mage de Guerre_ frappe un ennemi avec un bâton de projectile magique, en plus de ce bâton, toutes les baguettes possédées gagneront des charges.
items.wands.wandofmagicmissile.eleblast_desc=Une explosion élémentaire avec un bâton de projectile magique infligera 50% des dégâts et donnera au Mage 15 tours de recharge.
items.wands.wandofmagicmissile.discover_hint=Un des héros commence avec cet objet.
items.wands.wandofmagicmissile$magiccharge.name=charge magique
items.wands.wandofmagicmissile$magiccharge.desc=Votre baguette de missile magique a redonné de la puissance à vos baguettes, augmentant ainsi le niveau effectif du prochain tir qu'elles effectueront.\n\nVos baguettes sont renforcées à : +%d.\n\nTours de charge magique restants : %s.

items.wands.wandofprismaticlight.name=baguette de lumière prismatique
items.wands.wandofprismaticlight.staff_name=bâton de lumière prismatique
items.wands.wandofprismaticlight.desc=Cette baguette magique est faite d'un cristal transparent, comme un long morceau de verre lisse. Des lumières colorées scintillent à son extrémité n'attendant que de jaillir vers leurs cible.
items.wands.wandofprismaticlight.stats_desc=Cette baguette envoie des rayons de lumière qui pénètrent l'obscurité du donjon, révélant les lieux cachés et les pièges. Ce rayon peut aveugler les ennemis et inflige _%1$d-%2$d_ dégâts. Les ennemis démoniaques et les morts-vivants brûleront dans cette lumière vive, subissant des dégâts supplémentaires.
items.wands.wandofprismaticlight.upgrade_stat_name_2=Chance d'aveugler
items.wands.wandofprismaticlight.upgrade_stat_name_3=Durée d'éclairement
items.wands.wandofprismaticlight.bmage_desc=Quand _le Mage de Guerre_ frappe un ennemi avec un bâton de lumière prismatique, il l'estropie pour une durée qui sera proportionnelle au niveau du bâton.
items.wands.wandofprismaticlight.eleblast_desc=Une explosion élémentaire avec un bâton de lumière prismatique infligera 67% des dégâts, révèlera le terrain dans la zone de l'explosion, et aveuglera les ennemis pendant 5 tours.

items.wands.wandofregrowth.name=baguette de repousse
items.wands.wandofregrowth.staff_name=bâton de repousse
items.wands.wandofregrowth.desc=Cette baguette est fabriquée à partir d'une fine tige de bois superbement sculptée. D'une certaine manière, il est toujours vivant, d'un vert vif comme le cœur d'un jeune arbre. « Quand une vie s'arrête, une nouvelle vie commence toujours à grandir... Le cycle éternel demeure toujours ! »
items.wands.wandofregrowth.stats_desc=Lorsqu'elle est utilisée, cette baguette fait jaillir de l'énergie de repousse magique vers l'extérieur du cône ciblé, ce qui permet à l'herbe, aux racines et aux plantes rares de prendre vie. Sa prochaine utilisation consommera _%1$d charges_. Plus la baguette utilise de charges, plus l'effet est important et fort.
items.wands.wandofregrowth.degradation=Après avoir utilisé _%d charges_, cette baguette commencera à ne plus produire de plantes et d'herbe fraîche. Cette limite est augmentée par les montées de niveau ou l'amélioration de la baguette.
items.wands.wandofregrowth.upgrade_stat_name_1=Herbes par charge
items.wands.wandofregrowth.upgrade_stat_name_2=Limite totale d'herbes
items.wands.wandofregrowth.bmage_desc=Lorsque _le Mage de Guerre_ frappe un ennemi avec un bâton de repousse et que l'un des deux se tient sur de l'herbe, le Mage obtient une phytoguérison en proportion des dégâts infligés.
items.wands.wandofregrowth.eleblast_desc=Une explosion élémentaire avec un bâton de repousse enracinera les ennemis et fera pousser aléatoirement de l'herbe dans la zone de l'explosion.
items.wands.wandofregrowth$dewcatcher.name=Piégeuse de rosée
items.wands.wandofregrowth$dewcatcher.desc=Les piégeuses de rosée sont des plantes merveilleuses qui se remplissent de rosée magique. Elles tentent de se camoufler en herbe pour éviter d'attirer l'attention, mais leurs perles de rosée les trahissent.
items.wands.wandofregrowth$dewcatcher.discover_hint=Vous pouvez trouver cette plante à l'aide d'une baguette.
items.wands.wandofregrowth$seedpod.name=Cosse de graines
items.wands.wandofregrowth$seedpod.desc=Les cosses de graines sont des plantes magiques qui produisent des graines d'autres types de plantes, plutôt que leurs propres graines. Elles parviennent à se propager malgré l'absence de leurs propres graines.
items.wands.wandofregrowth$seedpod.discover_hint=Vous pouvez trouver cette plante à l'aide d'une baguette.
items.wands.wandofregrowth$lotus.name=Lotus doré
items.wands.wandofregrowth$lotus.desc=Le lotus doré est une plante mystique qui peut apparaître seulement à l'aide d'une puissante baguette de repousse. Son aura améliore les plantes et les effets de plantes, mais cela consomme son énergie et elle meurt après un court instant.
items.wands.wandofregrowth$lotus.wand_info=Ce lotus a été produit par une baguette de repousse _+%1$d_. Toutes les plantes dans l'aura se _déclencheront immédiatement_ si elles sont plantées sous un personnage. Les plantes ont aussi _%2$d%% de chance_ de donner leur graine et les fléchettes enduites consomment _%3$d%% de durabilité en moins_.
items.wands.wandofregrowth$lotus.discover_hint=Vous pouvez trouver cette plante à l'aide d'une baguette, après que vous l'ayez améliorée plusieurs fois.

items.wands.wandoftransfusion.name=baguette de transfusion
items.wands.wandoftransfusion.staff_name=bâton de transfusion
items.wands.wandoftransfusion.ondeath=Vous vous êtes suicidé avec votre Baguette de Transfusion...
items.wands.wandoftransfusion.charged=Votre bâton s'est chargé d'énergie vitale de l'ennemi !
items.wands.wandoftransfusion.desc=Une baguette de belle forme, elle se remarque par sa teinte magenta et la gemme d'un noir profond à son bout.
items.wands.wandoftransfusion.stats_desc=Quand elle est utilisée sur un allié ou un ennemi charmé, cette baguette va puiser _%1$d points de vie de l'utilisateur_ pour soigner ou protéger la cible avec _%2$d points de vie_. Utilisée sur des ennemis, la baguette va brièvement les charmer et donner _%3$d points de bouclier à l'utilisateur_. Les morts-vivants hostiles subiront _%4$d-%5$d dégâts_ au lieu d'être charmés.
items.wands.wandoftransfusion.upgrade_stat_name_1=Soin des alliés
items.wands.wandoftransfusion.upgrade_stat_name_2=Bouclier obtenu
items.wands.wandoftransfusion.upgrade_stat_name_3=Dégâts sur morts-vivants
items.wands.wandoftransfusion.bmage_desc=Lorsque _le Mage de Guerre_ frappe un ennemi charmé avec un bâton de transfusion, il gagnera en protection et son prochain coup avec le bâton ne le blessera pas.
items.wands.wandoftransfusion.eleblast_desc=Une explosion élémentaire avec un bâton de transfusion charmera les ennemis, soignera les alliés et infligera 100% des dégâts aux morts-vivants ennemis.

items.wands.wandofwarding.name=baguette de balisage
items.wands.wandofwarding.staff_name=bâton de balisage
items.wands.wandofwarding.no_more_wards=Votre baguette ne peut pas produire plus de balises.
items.wands.wandofwarding.bad_location=Vous ne pouvez pas placer de balise ici.
items.wands.wandofwarding.desc=Cette courte baguette de métal possède une gemme lumineuse violette qui flotte en son bout.
items.wands.wandofwarding.stats_desc=Plutôt que d’endommager directement un ennemi, cette baguette invoquera des balises et des sentinelles stationnaires. Les balises peuvent être invoquées n'importe où, même à travers les murs tant que vous en avez la vision. Cette baguette peut fournir un total de _%d énergies_ aux balises.
items.wands.wandofwarding.upgrade_stat_name_1=Dégâts de la balise
items.wands.wandofwarding.upgrade_stat_name_2=Énergie de la balise
items.wands.wandofwarding.bmage_desc=Quand _le Mage de Guerre_ frappe un ennemi avec un bâton de balisage, toutes les balises et sentinelles actives ont une chance d'être guéries.
items.wands.wandofwarding.eleblast_desc=Une explosion élémentaire avec un bâton de balisage soignera toutes les balises et sentinelles dans la zone de l'explosion.
items.wands.wandofwarding$ward.desc_generic_ward=Cette balise va envoyer automatiquement une décharge à tout ennemi qui entre dans son champ de vision.\n\nUtiliser votre baguette de balisage sur la balise l'améliorera.\n\nLes balises ont un nombre limité de coups avant de se dissiper.
items.wands.wandofwarding$ward.desc_generic_sentry=Cette petite sentinelle a la même puissance de feu que les balises, mais elle a de la santé au lieu d'un nombre de charges défini. Elle ressemble à la gemme au bout de votre baguette de balisage.\n\nTirer sur la sentinelle avec votre baguette de balisage permet de la soigner et de l'améliorer.\n\nLa sentinelle perd de la vie à chaque tir, mais vous pouvez la soigner en lui tirant dessus avec votre baguette de balisage.
items.wands.wandofwarding$ward.name_1=Faible balise
items.wands.wandofwarding$ward.desc_1=Cette balise simple va envoyer une décharge aux ennemis qui entrent dans son champ de vision, infligeant _%1$d-%2$d dégâts._\n\nUtiliser votre baguette de balisage sur cette balise l'améliorera.\n\nCette balise enverra une seule décharge avant dissipation.\n\nVotre baguette de balisage utilise _%3$d énergie_ pour alimenter cette balise.
items.wands.wandofwarding$ward.name_2=Balise
items.wands.wandofwarding$ward.desc_2=Cette balise améliorée a un motif plus complexe, et peux attaquer plusieurs fois. Chaque décharge de cette balise infligera _%1$d-%2$d dégâts._\n\nUtiliser votre baguette de balisage sur cette balise l'améliorera.\n\nCette balise enverra trois décharges avant dissipation.\n\nVotre baguette de balisage utilise _%3$d énergie_ pour alimenter cette balise.
items.wands.wandofwarding$ward.name_3=Puissante balise
items.wands.wandofwarding$ward.desc_3=Cette balise entièrement améliorée est capable d’attaquer plus de fois que ses prédécesseurs. Chaque décharge depuis cette balise infligera _%1$d-%2$d dégâts._\n\nUtiliser votre baguette de balisage sur cette balise l'améliorera.\n\nCette balise enverra cinq décharges avant de se dissiper.\n\nVotre baguette de balisage use _%3$d énergies_ pour alimenter cette balise.
items.wands.wandofwarding$ward.name_4=sentinelle faible
items.wands.wandofwarding$ward.desc_4=Cette petite sentinelle a la même puissance de feu que les puissantes balises, mais elle a de la santé au lieu d'un nombre de charges défini. Elle ressemble à la gemme au bout de votre baguette de balisage. Chaque tir de la sentinelle infligera _%1$d-%2$d dégâts._\n\nTirer sur la sentinelle avec votre baguette de balisage permet de la soigner et de l'améliorer.\n\nLa sentinelle perd de la vie à chaque tir, mais vous pouvez la soigner en lui tirant dessus avec votre baguette de balisage.\n\nLa baguette utilise _%3$d points d'énergie_ pour soutenir cette sentinelle.
items.wands.wandofwarding$ward.name_5=sentinelle
items.wands.wandofwarding$ward.desc_5=Cette sentinelle améliorée est plus grande et plus durable qu’une sentinelle inférieure. Chaque coup de cette sentinelle infligera _%1$d-%2$d dégâts._\n\nTirer sur cette sentinelle avec votre baguette de balisage va l'améliorer et la soigner.\n\nCette sentinelle va utiliser un peu de points de vie chaque fois qu’elle attaque un ennemi, mais peut être guérie en utilisant votre baguette de balisage sur elle.\n\nVotre baguette de balisage utilise _%3$d énergies_ pour alimenter cette sentinelle.
items.wands.wandofwarding$ward.name_6=sentinelle puissante
items.wands.wandofwarding$ward.desc_6=Cette sentinelle entièrement améliorée est beaucoup plus durable que ses prédécesseurs. Chaque coup de cette sentinelle infligera _%1$d-%2$d dégâts._\n\nTirer sur cette sentinelle avec votre baguette de balisage va la guérir.\n\nCette sentinelle va utiliser des points de vie chaque fois qu’elle attaque un ennemi, mais elle peut être guérie en utilisant votre baguette de balisage sur elle.\n\nVotre baguette de balisage utilise _%3$d énergies_ pour alimenter cette sentinelle.
items.wands.wandofwarding$ward.discover_hint=Vous pouvez trouver ce personnage à l'aide d'une baguette.
items.wands.wandofwarding$ward.dismiss_title=Renvoyer cette balise ?
items.wands.wandofwarding$ward.dismiss_body=Vous pouvez dissiper cette balise magique si vous ne voulez plus que votre baguette la maintienne. Le faire détruira immédiatement la balise.\n\nDissiper la balise ?
items.wands.wandofwarding$ward.dismiss_confirm=oui
items.wands.wandofwarding$ward.dismiss_cancel=non

###weapon curses
items.weapon.curses.annoying.name=%s pénible
items.weapon.curses.annoying.msg_1=HOOO, NOUS BATTONS-NOUS CONTRE QUELQUE CHOSE ?
items.weapon.curses.annoying.msg_2=OUAIS, VAS-Y !
items.weapon.curses.annoying.msg_3=HÉ, ÉCOUTE !
items.weapon.curses.annoying.msg_4=EST CE QU'ON EST DÉJÀ EST AU BOSS ?
items.weapon.curses.annoying.msg_5=AÏE, NE ME SECOUE PAS COMME ÇA !
items.weapon.curses.annoying.msg_6=MEURS, INSECTE !
items.weapon.curses.annoying.msg_7=OUAIIIIIIIIIIIIIIIIIIIIIIS !
items.weapon.curses.annoying.msg_8=PEUT-ON FAIRE UNE PAUSE !?
items.weapon.curses.annoying.msg_9=PEUH, HAHA !
items.weapon.curses.annoying.msg_10=BIEN FRAPPÉ !
items.weapon.curses.annoying.msg_11=Je ne voulais pas être une arme, je voulais être une hache de bûcheron.
items.weapon.curses.annoying.msg_12=Rappelez-vous que l'excès de confiance est une mort lente et insidieuse.
items.weapon.curses.annoying.msg_13=TOUTE VOTRE BASE NOUS APPARTIENT !
items.weapon.curses.annoying.desc=Les armes pénibles sont douées de parole, cependant ce sont des vraies bavardes. Elles attireront souvent l'attention sur vous sans le vouloir.
items.weapon.curses.annoying.elestrike_desc=Une attaque élémentaire avec une malédiction pénible a 20% de chance d'enrager chaque ennemi à portée durant 6 tours.

items.weapon.curses.dazzling.name=%s éblouissant
items.weapon.curses.dazzling.desc=Les armes éblouissantes vont parfois émettre une puissante lumière, aveuglant tous ceux qui peuvent les voir.
items.weapon.curses.dazzling.elestrike_desc=Une attaque élémentaire avec une malédiction éblouissante a 50% de chance d'aveugler chaque ennemi à portée durant 6 tours.

items.weapon.curses.displacing.name=%s de déplacement
items.weapon.curses.displacing.desc=Les armes de déplacement sont empruntes d'une magie chaotique de téléportation. Elles ont la capacité de déplacer au hasard les ennemis dans le niveau.
items.weapon.curses.displacing.elestrike_desc=Une attaque élémentaire avec une malédiction de déplacement a 50% de chance de téléporter chaque ennemi à portée.

items.weapon.curses.explosive.name=%s d'explosion
items.weapon.curses.explosive.warm=Chaud...
items.weapon.curses.explosive.hot=Brulant !
items.weapon.curses.explosive.desc=Les armes explosives accumulent graduellement leur puissance puis explosent, infligeant des dégâts à tout ce qui se trouve à proximité.
items.weapon.curses.explosive.desc_cool=Votre arme est froide au toucher.
items.weapon.curses.explosive.desc_warm=Votre arme accumule de l'énergie et devient chaude...
items.weapon.curses.explosive.desc_hot=Votre arme est brûlante ! Elle est sur le point d'exploser !
items.weapon.curses.explosive.elestrike_desc=Une attaque élémentaire avec une malédiction d'explosion a 50% de chance de déclencher une explosion sur un ennemi aléatoire à portée.

items.weapon.curses.friendly.name=%s sympathique
items.weapon.curses.friendly.desc=Les armes sympathiques sont faites pour les pacifistes, déclenchant parfois de la magie rendant le combat impossible.
items.weapon.curses.friendly.elestrike_desc=Une attaque élémentaire avec une malédiction sympathique a 50% de chance de charmer chaque ennemi à portée durant 6 tours.

items.weapon.curses.polarized.name= %s de polarisation
items.weapon.curses.polarized.desc=Une arme polarisée est affectée par une magie qui fait que ses attaques font 50% de dégâts en plus… ou aucun.
items.weapon.curses.polarized.elestrike_desc=Une attaque élémentaire avec une arme polarisée a 50% de chance d'infliger 24-36 dégâts à chaque ennemi à portée.

items.weapon.curses.sacrificial.name=%s sacrificiel(le)
items.weapon.curses.sacrificial.desc=Les armes sacrificielles attaquent les ennemis mais exigent le sang de leur utilisateur en échange. Plus l'utilisateur est en bonne santé, plus grande sera la quantité de sang exigée.
items.weapon.curses.sacrificial.elestrike_desc=Une attaque élémentaire avec une malédiction sacrificielle inflige 12 points de saignement au héros et à chaque ennemi à portée.

items.weapon.curses.wayward.name=%s imprévisible
items.weapon.curses.wayward.desc=Les armes imprévisibles deviennent parfois extrêmement peu précises. Cette magie dure un petit moment après son activation, mais peut être dissipée en portant un coup avec l'arme imprévisible.
items.weapon.curses.wayward.elestrike_desc=Une attaque élémentaire avec une malédiction imprévisible a 50% de chance de maudire chaque ennemi à portée durant 6 tours.
items.weapon.curses.wayward$waywardbuff.name=imprévisible
items.weapon.curses.wayward$waywardbuff.desc=La magie de votre arme imprévisible s'est activée, la rendant extrêmement peu précise pendant un court moment. Cela n'affecte pas les attaques garanties de toucher, comme les attaques surprises. Toucher une cible avec l'arme imprévisible met immédiatement fin à cet effet.\n\nTours restants : %s.

###enchantments
items.weapon.enchantments.blazing.name=%s ardent(e)
items.weapon.enchantments.blazing.desc=Cet enchantement fait jaillir des flammes ardentes de l'arme qui enflamment les ennemis et infligent des dégâts supplémentaires à ceux qui sont déjà en feu.
items.weapon.enchantments.blazing.elestrike_desc=Une attaque élémentaire avec un enchantement ardent enflamme chaque case à portée durant 8 tours.

items.weapon.enchantments.blocking.name=%s bloquant(e)
items.weapon.enchantments.blocking.desc=Les armes bloquantes ont une chance de vous protéger brièvement après que vous ayez attaqué avec.
items.weapon.enchantments.blocking.elestrike_desc=Une attaque élémentaire avec un enchantement bloquant octroie 6 de bouclier à la duelliste pour chaque ennemi à portée.
items.weapon.enchantments.blocking$blockbuff.name=bloquant
items.weapon.enchantments.blocking$blockbuff.desc=L'enchantement bloquant de votre arme vous accorde un boost temporaire de votre pouvoir défensif !\n\nProtection restante : %d\n\nTours restants : %s.

items.weapon.enchantments.blooming.name=%s fleurissant(e)
items.weapon.enchantments.blooming.desc=Les armes fleurissantes contiennent de la magie qui fait pousser la végétation autour d'elles.
items.weapon.enchantments.blooming.elestrike_desc=Une attaque élémentaire avec un enchantement de pousse rapide répand de l'herbe jusqu'à 8 cases et enracine chaque ennemi à portée durant 6 tours.

items.weapon.enchantments.chilling.name=%s glaçant(e)
items.weapon.enchantments.chilling.desc=Les ennemis touchés par cet enchantement sont refroidis, ce qui ralentit leurs mouvements et leurs attaques.
items.weapon.enchantments.chilling.elestrike_desc=Une attaque élémentaire avec un enchantement glaçant répand du froid sur chaque case à portée durant 8 tours.

items.weapon.enchantments.kinetic.name=%s cinétique
items.weapon.enchantments.kinetic.desc=Quand un ennemi est tué avec une arme cinétique, l'excès de force est conservé dans l'arme et sera appliqué lors de la prochaine attaque.
items.weapon.enchantments.kinetic.elestrike_desc=Une attaque élémentaire avec un enchantement cinétique inflige 40% des dégâts conservés à chaque ennemi à portée, à l'exception de la cible principale.
items.weapon.enchantments.kinetic$conserveddamage.name=dégâts conservés
items.weapon.enchantments.kinetic$conserveddamage.desc=Votre arme a conservé l'excès de force d'un précédent coup de grâce, et l'appliquera comme un dégât bonus lors de votre prochaine attaque. Toutefois, l'énergie s'estompera avec le temps.\nDégâts Conservés : %d.

items.weapon.enchantments.corrupting.name=%s de corruption
items.weapon.enchantments.corrupting.desc=Ce puissant enchantement possède la capacité de plier les ennemis sous votre volonté. Lorsqu'un ennemi est tué avec cette arme, il y a une chance pour qu'il soit corrompu au lieu de mourir.
items.weapon.enchantments.corrupting.elestrike_desc=Une attaque élémentaire avec un enchantement de corruption a 5-25% de chance (en fonction des points de vie manquants) de corrompre chaque ennemi à portée, à l'exception de la cible principale.

items.weapon.enchantments.elastic.name=%s élastique
items.weapon.enchantments.elastic.desc=Les armes élastiques peuvent envoyer les ennemis voltiger vers l'arrière sur de courtes distances.
items.weapon.enchantments.elastic.elestrike_desc=Une attaque élémentaire avec un enchantement élastique repousse de 5 cases tous les ennemis à portée.

items.weapon.enchantments.grim.name=%s sinistre
items.weapon.enchantments.grim.desc=Ce puissant enchantement a le pouvoir de tuer instantanément un ennemi. Son effet a plus de chances de se produire si la cible est faible.
items.weapon.enchantments.grim.elestrike_desc=Une frappe élémentaire avec un enchantement sinistre a 6-30% de chance (basé sur les points de vie manquants) de tuer tous les ennemis à portée, à l'exception de la cible principale.

items.weapon.enchantments.lucky.name=%s de chance
items.weapon.enchantments.lucky.desc=Les ennemis tués avec une arme chanceuse ont des chances de lâcher un meilleur butin.
items.weapon.enchantments.lucky.elestrike_desc=Une attaque élémentaire avec un enchantement de chance a 12.5% de chance de donner une récompense sous chaque ennemi à portée. Cet effet peut être appliqué seulement une fois par ennemi.

items.weapon.enchantments.projecting.name=%s saillant(e)
items.weapon.enchantments.projecting.desc=Avec cet enchantement, les armes de corps-à-corps gagnent en portée. Les armes de jet sont capables de traverser les murs si elles visent des ennemis proches.
items.weapon.enchantments.projecting.elestrike_desc=Une attaque élémentaire avec un enchantement saillant inflige 30% des dégâts à chaque ennemi à portée, à l'exception de la cible principale.

items.weapon.enchantments.shocking.name=%s foudroyant(e)
items.weapon.enchantments.shocking.desc=Des arcs électriques jaillissent des armes foudroyantes, causant des dégâts à toutes les cibles alentour.
items.weapon.enchantments.shocking.elestrike_desc=Une attaque élémentaire avec un enchantement foudroyant répand de l'électricité sur chaque case à portée durant 8 tours.

items.weapon.enchantments.unstable.name=%s instable
items.weapon.enchantments.unstable.desc=Cet enchantement irradie d'une énergie chaotique, agissant comme un enchantement différent à chaque attaque.
items.weapon.enchantments.unstable.elestrike_desc=Une attaque élémentaire avec un enchantement instable applique un effet d'enchantement aléatoire à chaque ennemi à portée, à l'exception de la cible principale.

items.weapon.enchantments.vampiric.name=%s vampirique
items.weapon.enchantments.vampiric.desc=Ce puissant enchantement aspire la force vitale des ennemis à chaque coup et l'injecte dans son porteur. L'effet est plus puissant si le niveau de vie du porteur est faible.
items.weapon.enchantments.vampiric.elestrike_desc=Une attaque élémentaire avec un enchantement vampirique soigne la duelliste de 2.5 points de vie pour chaque ennemi à portée.


###melee weapons
items.weapon.melee.assassinsblade.name=lame de l'assassin
items.weapon.melee.assassinsblade.stats_desc=Cette arme est plus forte quand elle attaque par surprise.
items.weapon.melee.assassinsblade.ability_name=se camoufler
items.weapon.melee.assassinsblade.typical_ability_desc=La Duelliste peut _se camoufler_ quand elle utilise une lame d'assassin. Cette capacité permet à la Duelliste de se téléporter instantanément à 3 cases et lui octroie généralement _%d tours d'invisibilité._
items.weapon.melee.assassinsblade.ability_desc=La Duelliste peut _se camoufler_ quand elle utilise une lame d'assassin. Cette capacité permet à la Duelliste de se téléporter instantanément à 3 cases et lui octroie _%d tours d'invisibilité._
items.weapon.melee.assassinsblade.upgrade_ability_stat_name=Durée de capacité
items.weapon.melee.assassinsblade.desc=Une petite lame ondulée en obsidienne. Difficile d'emploi malgré son faible poids, elle est mortelle si elle trouve le bon endroit où frapper sa cible.

items.weapon.melee.battleaxe.name=hache de guerre
items.weapon.melee.battleaxe.stats_desc=C'est une arme plutôt précise.
items.weapon.melee.battleaxe.ability_name=coup lourd
items.weapon.melee.battleaxe.typical_ability_desc=La Duelliste peut effectuer un _coup lourd_ avec la hache de guerre. Cette attaque concentrée inflige généralement _%1$d-%2$d dégâts_ si l'ennemi est surpris, et l'étourdit pendant 5 tours en réduisant sa précision et son esquive de 50%%. Ce coup lourd touche à coup sûr mais sans bonus de dégâts si l'ennemi n'est pas surpris.
items.weapon.melee.battleaxe.ability_desc=La Duelliste peut effectuer un _coup lourd_ avec la hache de guerre. Cette attaque concentrée inflige _%1$d-%2$d dégâts_ si l'ennemi est surpris, et l'étourdit pendant 5 tours en réduisant sa précision et son esquive de 50%%. Ce coup lourd touche à coup sûr mais sans bonus de dégâts si l'ennemi n'est pas surpris.
items.weapon.melee.battleaxe.desc=L'énorme lame en acier de cette hache de guerre ajoute un élan considérable à chacun de vos coups.

items.weapon.melee.crossbow.name=arbalète
items.weapon.melee.crossbow.typical_stats_desc=Cette arme renforce les fléchettes lancées quand elle est équipée, leur faisant généralement infliger _%1$d-%2$d dégâts_ et leur accordant son enchantement.
items.weapon.melee.crossbow.stats_desc=Cette arme renforce les fléchettes lancées quand elle est équipée, leur faisant infliger _%1$d-%2$d dégâts_ et leur accordant son enchantement.
items.weapon.melee.crossbow.ability_name=tir chargé
items.weapon.melee.crossbow.typical_ability_desc=La Duelliste peut _charger_ son arbalète, ce qui garantit que sa prochaine attaque normale touchera et appliquera un de ces trois effets : les attaques de mêlée éjectent les ennemis, les fléchettes non-enduites infligent typiquement _+%1$d dégâts_, ou les fléchettes enduites appliquent leur effet dans une zone de 7x7 et ont typiquement _%2$d utilisations supplémentaires_.
items.weapon.melee.crossbow.ability_desc=La Duelliste peut _charger_ son arbalète, ce qui garantit que sa prochaine attaque normale touchera et appliquera un de ces trois effets : les attaques de mêlée éjectent les ennemis, les fléchettes non-enduites infligent _+%1$d dégâts_, ou les fléchettes enduites appliquent leur effet dans une zone de 7x7 et ont _%2$d utilisations supplémentaires_.
items.weapon.melee.crossbow.desc=Une arme assez complexe qui tire des carreaux avec une vitesse exceptionnelle. Bien qu'elle ne soit pas conçue pour, le poids et la construction robuste de cette arbalète en font aussi une arme de mêlée convenable.
items.weapon.melee.crossbow.upgrade_ability_stat_name=Boost de capacité
items.weapon.melee.crossbow$chargedshot.name=chargé
items.weapon.melee.crossbow$chargedshot.desc=La duelliste concentre sa puissance dans l'arbalète. Sa prochaine attaque avec elle touchera à coup sûr et appliquera l'un de ces effets :\n- Une attaque de mêlée repoussera l'ennemi de quelques cases ;\n- Une fléchette non enduite infligera plus de dégâts ;\n- Une fléchette enduite obtiendra des utilisations supplémentaires et appliquera son effet dans une zone de 7x7. Les effets positifs affecteront seulement les alliés, les négatifs seulement les ennemis. La duelliste ne peut pas utiliser cette capacité pour s'appliquer des effets positifs.

items.weapon.melee.cudgel.name=massue
items.weapon.melee.cudgel.stats_desc=C'est une arme plutôt précise.
items.weapon.melee.cudgel.ability_name=coup lourd
items.weapon.melee.cudgel.typical_ability_desc=La Duelliste peut réaliser un _coup lourd_ avec une massue. Cette attaque renforcée inflige généralement _%1$d-%2$d dégâts_ si elle surprend l'ennemi, et l'étourdit pendant 5 tours ce qui réduit sa précision et son évasion de 50%%. Ce coup lourd touche à coup sûr mais sans bonus de dégât si l'ennemi n'est pas surpris.
items.weapon.melee.cudgel.ability_desc=La Duelliste peut réaliser un _coup lourd_ avec une massue. Cette attaque renforcée inflige _%1$d-%2$d dégâts_ si elle surprend l'ennemi, et l'étourdit pendant 5 tours ce qui réduit sa précision et son évasion de 50%%. Ce coup lourd touche à coup sûr mais sans bonus de dégâts si l'ennemi n'est pas surpris.
items.weapon.melee.cudgel.desc=Une petite massue en laiton, prévue pour permettre à des nobles de se défendre plutôt que pour l'aventure.
items.weapon.melee.cudgel.discover_hint=Un des héros commence avec cet objet.

items.weapon.melee.dagger.name=dague
items.weapon.melee.dagger.stats_desc=Cette arme est plus forte quand elle attaque par surprise.
items.weapon.melee.dagger.ability_name=se camoufler
items.weapon.melee.dagger.typical_ability_desc=La Duelliste peut _se camoufler_ quand elle utilise une dague. Cette capacité permet à la Duelliste de se téléporter instantanément à 5 cases et lui octroie généralement _%d tours d'invisibilité._
items.weapon.melee.dagger.ability_desc=La Duelliste peut _se camoufler_ quand elle utilise une dague. Cette capacité permet à la Duelliste de se téléporter instantanément à 5 cases et lui octroie _%d tours d'invisibilité._
items.weapon.melee.dagger.upgrade_ability_stat_name=Durée de capacité
items.weapon.melee.dagger.desc=Une simple dague de fer avec un manche en bois usé.
items.weapon.melee.dagger.discover_hint=Un des héros commence avec cet objet.

items.weapon.melee.dirk.name=poignard
items.weapon.melee.dirk.stats_desc=Cette arme est plus forte quand elle attaque par surprise.
items.weapon.melee.dirk.ability_name=se camoufler
items.weapon.melee.dirk.typical_ability_desc=La Duelliste peut _se camoufler_ quand elle utilise un poignard. Cette capacité permet à la Duelliste de se téléporter instantanément à 4 cases et lui octroie généralement _%d tours d'invisibilité._
items.weapon.melee.dirk.ability_desc=La Duelliste peut se camoufler quand elle utilise un poignard. Cette capacité permet à la Duelliste de se téléporter instantanément à 4 cases et lui octroie _%d tours d'invisibilité._
items.weapon.melee.dirk.upgrade_ability_stat_name=Durée de capacité
items.weapon.melee.dirk.desc=Une grande dague offrant plus d'acier à plonger dans les ennemis.

items.weapon.melee.flail.name=fléau
items.weapon.melee.flail.stats_desc=C'est une arme assez peu précise.\nCette arme ne peut pas réaliser d'attaque surprise.
items.weapon.melee.flail.ability_name=tournoyer
items.weapon.melee.flail.spin_warn=Vous ne pouvez pas faire plus tourner le fléau.
items.weapon.melee.flail.typical_ability_desc=La Duelliste peut faire _tournoyer_ le fléau pour augmenter sa puissance durant un court instant. Chaque tour passé à faire tourner le fléau ajoute généralement _%d dégâts_ à la prochaine attaque normale, jusqu'à un maximum de 3 tours. Un fléau tournoyant touche la cible à coup sûr. Une charge est consommée uniquement lorsque vous commencez à faire tourner le fléau.
items.weapon.melee.flail.ability_desc=La Duelliste peut faire _tournoyer_ le fléau pour augmenter sa puissance durant un court instant. Chaque tour passé à faire tourner le fléau ajoute _%d dégâts_ à la prochaine attaque normale, jusqu'à un maximum de 3 tours. Un fléau tournoyant touche la cible à coup sûr. Une charge est consommée uniquement lorsque vous commencez à faire tourner le fléau.
items.weapon.melee.flail.desc=Une boule d'acier hérissée de pointes, attachée à la poignée par une longueur de chaîne. Très peu maniable, mais dévastatrice si le coup porté touche.
items.weapon.melee.flail$spinabilitytracker.name=en train de tourner
items.weapon.melee.flail$spinabilitytracker.desc=La Duelliste fait actuellement tournoyer son fléau, permettant à sa prochaine attaque normale de faire plus de dégâts. Chaque préparation prend un tour mais augmente les dégâts, jusqu'à 3 fois au maximum. La prochaine attaque touche à coup sûr.\n\nBonus de dégâts actuel : %1$d%%.\nTours restants : %2$s.

items.weapon.melee.gauntlet.name=gant de pierre
items.weapon.melee.gauntlet.stats_desc=C'est une arme très rapide.
items.weapon.melee.gauntlet.ability_name=combo
items.weapon.melee.gauntlet.typical_ability_desc=La Duelliste peut effectuer un _combo_ avec un gant de pierre. Cette attaque touche à coup sûr et inflige typiquement _+%d dégâts_ pour chaque coup réussi avec une arme de mêlée ou de jet. Ne pas réussir à toucher pendant 5 tours réinitialise le combo.
items.weapon.melee.gauntlet.ability_desc=La Duelliste peut effectuer un _combo_ avec un gant de pierre. Cette attaque touche à coup sûr et inflige _+%d dégâts_ pour chaque coup réussi avec une arme de mêlée ou de jet. Ne pas réussir à toucher pendant 5 tours réinitialise le combo.
items.weapon.melee.gauntlet.desc=Cet énorme gant est fait de tissu pourpre recouvert de lourdes pierres magiques sur le dessus. Le tissu se resserre sur vous, les plaques de pierres formant presque une seconde peau. Manier une arme si lourde exige de la force, mais ajoute une puissance considérable à vos coups.

items.weapon.melee.glaive.name=glaive
items.weapon.melee.glaive.stats_desc=C'est une arme plutôt lente. \nCette arme a une portée accrue.
items.weapon.melee.glaive.ability_name=piquer
items.weapon.melee.glaive.typical_ability_desc=La Duelliste peut utiliser la pointe d'un glaive pour _piquer_ un ennemi qui est à portée mais pas adjacent. Ce coup inflige généralement _%1$d-%2$d dégâts_, repousse l'ennemi et touche à coup sûr.
items.weapon.melee.glaive.ability_desc=La Duelliste peut utiliser la pointe d'un glaive pour _piquer_ un ennemi qui est à portée mais pas adjacent. Ce coup inflige _%1$d-%2$d dégâts_, repousse l'ennemi et touche à coup sûr.
items.weapon.melee.glaive.desc=Une arme d'hast composée d'une lame d'épée au bout d'un long manche.

items.weapon.melee.gloves.name=gants cloutés
items.weapon.melee.gloves.stats_desc=C'est une arme très rapide.
items.weapon.melee.gloves.ability_name=combo
items.weapon.melee.gloves.typical_ability_desc=La Duelliste peut effectuer un _combo_ avec les gants cloutés. Cette attaque touche à coup sûr et inflige typiquement _+%d dégâts_ pour chaque coup réussi avec une arme de mêlée ou de jet. Ne pas réussir à toucher pendant 5 tours réinitialise le combo.
items.weapon.melee.gloves.ability_desc=La Duelliste peut effectuer un _combo_ avec les gants cloutés. Cette attaque touche à coup sûr et inflige _+%d dégâts_ pour chaque coup réussi avec une arme de mêlée ou de jet. Ne pas réussir à toucher pendant 5 tours réinitialise le combo.
items.weapon.melee.gloves.desc=Ces gants cloutés n'offrent pas vraiment de protection, mais ils peuvent servir d'arme tout en libérant les mains.
items.weapon.melee.gloves.discover_hint=Un des héros commence avec cet objet.

items.weapon.melee.greataxe.name=grande hache
items.weapon.melee.greataxe.stats_desc=Cette arme est incroyablement lourde.
items.weapon.melee.greataxe.ability_name=rétribution
items.weapon.melee.greataxe.typical_ability_desc=La Duelliste peut effectuer une attaque de _rétribution_ avec sa grande hache si elle est en dessous de 50%% de sa santé. Cette attaque dévastatrice inflige généralement _%1$d-%2$d dégâts_, est garantie de réussir, et est instantanée si elle tue un ennemi.
items.weapon.melee.greataxe.ability_desc=La Duelliste peut effectuer une attaque de _rétribution_ avec sa grande hache si elle est en dessous de 50%% de sa santé. Cette attaque dévastatrice inflige _%1$d-%2$d dégâts_, est garantie de réussir, et est instantanée si elle tue un ennemi.
items.weapon.melee.greataxe.desc=Pensée pour être brandie par-dessus l'épaule, cette hache titanesque est aussi puissante que lourde.

items.weapon.melee.greatshield.name=grand bouclier
items.weapon.melee.greatshield.typical_stats_desc=Normalement cette arme bloque 0-%d dégâts, blocage qui augmente avec les améliorations.
items.weapon.melee.greatshield.stats_desc=Cette arme bloque 0-%d dégâts, blocage qui augmente avec les améliorations.
items.weapon.melee.greatshield.ability_name=se protéger
items.weapon.melee.greatshield.typical_ability_desc=La Duelliste peut _se protéger_ avec un grand bouclier, annulant complétement toute attaque physique ou magique la visant pendant _%d tours_ en général. Après que la Duelliste ait bloqué une attaque, riposter ou utiliser de la magie mettra fin à la protection.
items.weapon.melee.greatshield.ability_desc=La Duelliste peut _se protéger_ avec un grand bouclier, annulant complétement toute attaque physique ou magique la visant pendant _%d tours_. Après que la Duelliste ait bloqué une attaque, riposter ou utiliser de la magie mettra fin à la protection.
items.weapon.melee.greatshield.upgrade_ability_stat_name=Durée de capacité
items.weapon.melee.greatshield.desc=Plus un mur mobile qu'un bouclier, cet énorme masse de métal assiste la défense mais ne laisse que peu de possibilités pour les attaques.

items.weapon.melee.greatsword.name=grande épée
items.weapon.melee.greatsword.ability_name=fendre
items.weapon.melee.greatsword.typical_ability_desc=La Duelliste peut _se fendre_ vers un ennemi avec une épée courte. Cette attaque inflige typiquement _%1$d-%2$d dégâts_ et touche à coup sûr. Si la fente tue un ennemi, l'action est instantanée et la Duelliste peut se fendre à nouveau gratuitement dans les 5 tours.
items.weapon.melee.greatsword.ability_desc=La Duelliste peut _se fendre_ vers un ennemi avec une grande épée. Cette attaque inflige _%1$d-%2$d dégâts_ et touche à coup sûr. Si la fente tue un ennemi, l'action est instantanée et la Duelliste peut se fendre à nouveau gratuitement dans les 5 tours.
items.weapon.melee.greatsword.desc=Cette imposante lame inflige d'énormes dégâts.

items.weapon.melee.handaxe.name=hachette
items.weapon.melee.handaxe.stats_desc=C'est une arme plutôt précise.
items.weapon.melee.handaxe.ability_name=coup lourd
items.weapon.melee.handaxe.typical_ability_desc=La Duelliste peut effectuer un _coup lourd_ avec une hachette. Cette attaque concentrée inflige généralement _%1$d-%2$d dégâts_ si l'ennemi est surpris, et l'étourdit pendant 5 tours ce qui réduit sa précision et son esquive de 50 %%. Ce coup lourd touche à coup sûr mais sans bonus de dégâts si l'ennemi n'est pas surpris.
items.weapon.melee.handaxe.ability_desc=La Duelliste peut effectuer un _coup lourd_ avec une hachette. Cette attaque concentrée inflige _%1$d-%2$d dégâts_ si l'ennemi est surpris, et l'étourdit pendant 5 tours ce qui réduit sa précision et son esquive de 50 %%. Ce coup lourd touche à coup sûr mais sans bonus de dégâts si l'ennemi n'est pas surpris.
items.weapon.melee.handaxe.desc=Une hache légère, plus communément utilisée pour couper des branches. La large lame fonctionne également assez bien contre les ennemis.

items.weapon.melee.katana.name=katana
items.weapon.melee.katana.stats_desc=Cette arme bloque 0-3 dégâts.
items.weapon.melee.katana.ability_name=fente
items.weapon.melee.katana.typical_ability_desc=La Duelliste peut effectuer une _fente_ avec un katana vers un ennemi à 1 case de distance. Cela la déplace vers l'ennemi, inflige généralement _%1$d-%2$d dégâts_ et touche à coup sûr.
items.weapon.melee.katana.ability_desc=La Duelliste peut effectuer une _fente_ avec un katana vers un ennemi à 1 case de distance. Cela la déplace vers l'ennemi, inflige _%1$d-%2$d dégâts_ et touche à coup sûr.
items.weapon.melee.katana.desc=Une épée fine avec une grande garde au-dessus de la poignée.

items.weapon.melee.longsword.name=épée longue
items.weapon.melee.longsword.ability_name=fendre
items.weapon.melee.longsword.typical_ability_desc=La Duelliste peut _se fendre_ vers un ennemi avec une épée longue. Cette attaque inflige typiquement _%1$d-%2$d dégâts_ et touche à coup sûr. Si la fente tue un ennemi, l'action est instantanée et la Duelliste peut se fendre à nouveau gratuitement dans les 5 tours.
items.weapon.melee.longsword.ability_desc=La Duelliste peut _se fendre_ vers un ennemi avec une épée longue. Cette attaque inflige typiquement _%1$d-%2$d dégâts_ et touche à coup sûr. Si la fente tue un ennemi, l'action est instantanée et la Duelliste peut se fendre à nouveau gratuitement dans les 5 tours.
items.weapon.melee.longsword.desc=La longue lame d'acier effilée de cette épée brille de manière rassurante, cependant, sa taille la rend plutôt lourde.

items.weapon.melee.mace.name=masse
items.weapon.melee.mace.stats_desc=C'est une arme plutôt précise.
items.weapon.melee.mace.ability_name=coup lourd
