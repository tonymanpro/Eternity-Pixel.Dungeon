items.weapon.missiles.shuriken.name=shuriken
items.weapon.missiles.shuriken.stats_desc=Les shurikens peuvent être lancés instantanément avec un temps de rechargement de 20 tours.
items.weapon.missiles.shuriken.desc=Ces étoiles de métal aux lames très tranchantes peuvent être lancées rapidement lors d'un déplacement.
items.weapon.missiles.shuriken$shurikeninstanttracker.name=Rechargement des shurikens
items.weapon.missiles.shuriken$shurikeninstanttracker.desc=Vous avez récemment lancé instantanément un shuriken, et devez attendre avant de pouvoir recommencer. Vous pouvez toujours lancer des shurikens, mais à une vitesse normale.\n\nTours restants : %s.

items.weapon.missiles.throwingclub.name=bâton de lancer
items.weapon.missiles.throwingclub.stats_desc=Cette arme ne s'accroche pas aux ennemis et peut être ramassée instantanément.
items.weapon.missiles.throwingclub.desc=Une arme de jet assez simple mais robuste, grossièrement une pierre attachée à un bâton.

items.weapon.missiles.throwinghammer.name=marteau de lancer
items.weapon.missiles.throwinghammer.stats_desc=Cette arme ne s'accroche pas aux ennemis et peut être ramassée instantanément.
items.weapon.missiles.throwinghammer.desc=Ces lourds marteaux ont été créés pour être lancés sur les ennemis. Leur corps lisse entièrement métallique leur confère une grande durabilité.

items.weapon.missiles.throwingknife.name=couteau de lancer
items.weapon.missiles.throwingknife.stats_desc=Cette arme est plus forte quand elle attaque par surprise.
items.weapon.missiles.throwingknife.desc=Ces couteaux légers sont ont été équilibrés pour décrire une courbe dans les airs avant de toucher leur cibles.
items.weapon.missiles.throwingknife.discover_hint=Un des héros commence avec cet objet.

items.weapon.missiles.throwingspear.name=lance de jet
items.weapon.missiles.throwingspear.desc=Ces lances légères ont une structure fine, clairement conçue pour être lancée, et non frappée.

items.weapon.missiles.throwingspike.name=pointe à lancer
items.weapon.missiles.throwingspike.desc=Ces hampes pointues en métal sont faites pour être lancées sur des ennemis distants.
items.weapon.missiles.throwingspike.discover_hint=Un des héros commence avec cet objet.

items.weapon.missiles.throwingstone.name=pierres de jet
items.weapon.missiles.throwingstone.desc=Ces pierres sont lestées pour pouvoir être lancées avec plus de puissance que des pierres ordinaires.
items.weapon.missiles.throwingstone.discover_hint=Un des héros commence avec cet objet.

items.weapon.missiles.tomahawk.name=tomahawk
items.weapon.missiles.tomahawk.stats_desc=Cette arme cause à sa cible un saignement égal à _%1$d-%2$d._
items.weapon.missiles.tomahawk.typical_stats_desc=Cette arme cause à sa cible un saignement généralement égal à _%1$d-%2$d._
items.weapon.missiles.tomahawk.desc=Ces haches de jets ont une lame en dents de scie qui déchire les chairs en s’accrochant aux ennemis.

items.weapon.missiles.trident.name=trident
items.weapon.missiles.trident.desc=D'énormes lances de jets possédant trois dents mortelles à leurs extrémités. Elles sont puissantes, mais assez lourdes.


items.weapon.spiritbow.name=arc spirituel
items.weapon.spiritbow.ac_shoot=TIRER
items.weapon.spiritbow.prompt=Choisissez une cible
items.weapon.spiritbow.stats=L'arc ne peut être directement amélioré, mais se renforce quand vous passez au niveau supérieur. À votre niveau actuel, les flèches tirées infligent _%1$d-%2$d dégâts_ et l'arc nécessite _%3$d de force_ pour être correctement utilisé.
items.weapon.spiritbow.desc=Un très ancien arc en bois magique. La corde et les gravures de cet arc brillent d'une lumière bleu pâle. Lorsque la corde est tendue, cet arc fait apparaître une flèche magique qui peut être tirée sur un ennemi.
items.weapon.spiritbow.discover_hint=Un des héros commence avec cet objet.

items.weapon.weapon.identify=Vous vous êtes suffisamment familiarisé avec votre arme pour l'identifier.
items.weapon.weapon.too_heavy=Votre force inadaptée pour l'utilisation de cette arme réduit votre vitesse et la précision de vos attaques, elle influe de même sur vos attaques surprises.
items.weapon.weapon.excess_str=Grâce à votre excès de force, vous infligez _0-%d dégâts supplémentaires_ avec cette arme.
items.weapon.weapon.hardening_gone=Le durcissement sur cette arme s’est estompé !
items.weapon.weapon.incompatible=L'interaction entre différents types de magies a effacé l'enchantement de cette arme !
items.weapon.weapon.cursed_worn=Comme cette arme est maudite, vous n'arrivez pas à la lâcher.
items.weapon.weapon.cursed=Vous pouvez sentir la magie noire émanant de cette arme.
items.weapon.weapon.weak_cursed=Malgré la malédiction, vous pouvez retirer cette arme.
items.weapon.weapon.not_cursed=Cette arme est dépourvue de toute aura malveillante.
items.weapon.weapon.faster=C'est augmenté pour améliorer la _vitesse._
items.weapon.weapon.stronger=C'est augmenté pour améliorer les _dégâts._
