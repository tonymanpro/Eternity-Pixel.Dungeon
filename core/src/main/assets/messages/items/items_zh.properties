items.weapon.melee.scimitar.ability_desc=决斗家可用弯刀进入_剑舞_。进入这个姿态不消耗时间，并使决斗家在 _%d回合_内攻击速度+60%%且精准+50%%。
items.weapon.melee.scimitar.upgrade_ability_stat_name=武技持续时间
items.weapon.melee.scimitar.desc=一把厚重的弯刀。它的形状能让它进行更快但不甚强力的攻击。
items.weapon.melee.scimitar$sworddance.name=剑舞
items.weapon.melee.scimitar$sworddance.desc=决斗家正以一种舞蹈的形式展开疾风骤雨般的攻击。当这个架势激活时，她的攻击速度增加60%%(在使用弯刀的情况下刚好足以一回合攻击两次)，且具有+50%%的精准。\n\n剩余回合数：%s

items.weapon.melee.sickle.name=短柄镰
items.weapon.melee.sickle.stats_desc=这是一件不太精准的武器。
items.weapon.melee.sickle.ability_name=收割
items.weapon.melee.sickle.typical_ability_desc=决斗家可以用短柄镰来_收割_敌人，这破坏性的一击必定命中，一般会造成_%d点伤害_。若敌人不免疫流血，则造成的伤害会转化为等值流血效果。
items.weapon.melee.sickle.ability_desc=决斗家可以用短柄镰来_收割_敌人，这破坏性的一击必定命中，并会造成_%d点伤害_。若敌人不免疫流血，则造成的伤害会转化为等值流血效果。
items.weapon.melee.sickle.desc=一种手持农具，也可被用作一把强大但笨重的武器。

items.weapon.melee.spear.name=长矛
items.weapon.melee.spear.stats_desc=这是一件相当慢的武器。\n这件武器有额外的攻击距离。
items.weapon.melee.spear.ability_name=刺退
items.weapon.melee.spear.typical_ability_desc=决斗家用矛尖_刺退_在射程内但不与决斗家相邻的敌人，造成_%1$d~%2$d点伤害_，将敌人击退且必定命中。
items.weapon.melee.spear.ability_desc=决斗家用矛尖_刺退_在射程内但不与决斗家相邻的敌人，造成_%1$d~%2$d点伤害_，将敌人击退且必定命中。
items.weapon.melee.spear.desc=这是一根装着锋锐铁刺的细长木杆。

items.weapon.melee.sword.name=单手剑
items.weapon.melee.sword.ability_name=顺劈
items.weapon.melee.sword.typical_ability_desc=决斗家可以用单手剑_顺劈_敌人。这一般会造成_%1$d~%2$d点伤害_且必定命中。如果顺劈击杀了一名敌人，这一击将不消耗时间，并且决斗家可在5回合内额外使用一次不消耗充能数的顺劈。
items.weapon.melee.sword.ability_desc=决斗家可以用单手剑_顺劈_敌人，造成_%1$d~%2$d点伤害_且必定命中。如果顺劈击杀了一名敌人，这一击将不消耗时间，并且决斗家可在5回合内额外使用一次不消耗充能数的顺劈。
items.weapon.melee.sword.desc=平衡性良好的剑。不算太大，但是依然比短剑长上不少。
items.weapon.melee.sword$cleavetracker.name=顺劈
items.weapon.melee.sword$cleavetracker.desc=决斗家已经准备好进行连续的顺劈。这一次顺劈将不会消耗武技充能。\n\n剩余回合数：%s。

items.weapon.melee.warhammer.name=战锤
items.weapon.melee.warhammer.stats_desc=这是一件比较精准的武器。
items.weapon.melee.warhammer.ability_name=重击
items.weapon.melee.warhammer.typical_ability_desc=决斗家可以用战锤使出_重击_。这用尽全力的一击如果是在伏击敌人，则一般会造成_%1$d~%2$d点伤害_并施加5回合的恍惚，使其精准与闪避均降低50%%。重击必定命中，但若非伏击则只会造成普通的伤害。
items.weapon.melee.warhammer.ability_desc=决斗家可以用战锤使出_重击_。这用尽全力的一击如果是在伏击敌人，则会造成_%1$d~%2$d点伤害_并施加5回合的恍惚，使其精准与闪避均降低50%%。重击必定命中，但若非伏击则只会造成普通的伤害。
items.weapon.melee.warhammer.desc=很少有生物能抵挡这铅铁巨块的辗压，但也只有最强壮的冒险家才能有效使用它。

items.weapon.melee.warscythe.name=战镰
items.weapon.melee.warscythe.stats_desc=这是一件不太精准的武器。
items.weapon.melee.warscythe.ability_name=收割
items.weapon.melee.warscythe.typical_ability_desc=决斗家可以用战镰来_收割_敌人，这破坏性的一击必定命中，一般会造成_%d点伤害_。若敌人不免疫流血，则造成的伤害会转化为等值流血效果。
items.weapon.melee.warscythe.ability_desc=决斗家可以用战镰来_收割_敌人，这破坏性的一击必定命中，并会造成_%d点伤害_。若敌人不免疫流血，则造成的伤害会转化为等值流血效果。
items.weapon.melee.warscythe.desc=这件巨大又笨重的农具被加固了。现在比起收割庄稼，它更适宜于收割敌人。

items.weapon.melee.whip.name=长鞭
items.weapon.melee.whip.stats_desc=这件武器有惊人的攻击距离。
items.weapon.melee.whip.ability_name=狠抽
items.weapon.melee.whip.typical_ability_desc=决斗家可以用长鞭_狠抽_她周围的所有敌人。这一武技一般会对当前每个处于攻击距离内的敌人都造成_%1$d~%2$d点伤害_，并且必定命中。
items.weapon.melee.whip.ability_desc=决斗家可以用长鞭_狠抽_她周围的所有敌人。这一武技对当前每个处于攻击距离内的敌人都造成_%1$d~%2$d点伤害_，并且必定命中。
items.weapon.melee.whip.desc=虽然这把武器另一端带倒刺的绳子伤害不高，但它的攻击范围是数一数二的。

items.weapon.melee.wornshortsword.name=破旧的短剑
items.weapon.melee.wornshortsword.ability_name=顺劈
items.weapon.melee.wornshortsword.typical_ability_desc=决斗家可以用破旧的短剑_顺劈_敌人。这一般会造成_%1$d~%2$d点伤害_并且必定命中。如果顺劈击杀了一名敌人，决斗家可在5回合内额外使用一次无消耗顺劈。
items.weapon.melee.wornshortsword.ability_desc=决斗家可以用破旧的短剑_顺劈_敌人。造成_%1$d~%2$d点伤害_并且必定命中。如果顺劈击杀了一名敌人，决斗家可在5回合内额外使用一次无消耗顺劈。
items.weapon.melee.wornshortsword.desc=一把十分短的剑，在大量使用后有一定的磨损。它比正常情况的短剑更轻，也更弱。
items.weapon.melee.wornshortsword.discover_hint=某位英雄初始携带该物品。


###missile weapons
items.weapon.missiles.darts.adrenalinedart.name=激素飞镖
items.weapon.missiles.darts.adrenalinedart.desc=这些飞镖上涂着一种由速行蓟制成的药物。当目标为友方时，其移动速度和攻击速度都会有所提升，若为敌方则会短暂降低其移动速度。这只飞镖仍能对敌人造成伤害，但不会伤及盟友。

items.weapon.missiles.darts.blindingdart.name=致盲飞镖
items.weapon.missiles.darts.blindingdart.desc=这些飞镖上涂着一种由致盲草制成的药物，能让目标失明一小段时间。药效比新鲜的致盲草弱，不会让目标迷失方向，所以目标会记住你之前在的位置。

items.weapon.missiles.darts.chillingdart.name=寒霜飞镖
items.weapon.missiles.darts.chillingdart.desc=这些飞镖上涂着一种由冰冠花制成的药物，能显著地冻伤目标。

items.weapon.missiles.darts.cleansingdart.name=净化飞镖
items.weapon.missiles.darts.cleansingdart.desc=这些飞镖上涂着一种由魔皇草制成的药物，能使友军暂时对所有负面效果免疫，也可以清除敌人身上的增益效果。敌人甚至会暂时忘记它正在攻击或逃离你。这只飞镖仍能对敌人造成伤害，但不会伤及盟友。

items.weapon.missiles.darts.dart.name=飞镖
items.weapon.missiles.darts.dart.ac_tip=涂药
items.weapon.missiles.darts.dart.prompt=选择一粒种子
items.weapon.missiles.darts.dart.tip_title=为飞镖涂药
items.weapon.missiles.darts.dart.tip_desc=一粒种子可以为1~2枚飞镖涂药。每种种子都能产生对应的，具有独特效果的一次性涂药飞镖。\n\n将这些种子涂抹在飞镖上能得到_%s_。
items.weapon.missiles.darts.dart.tip_all=用%2$d粒种子为%1$d枚飞镖涂药
items.weapon.missiles.darts.dart.tip_two=用1粒种子为2枚飞镖涂药
items.weapon.missiles.darts.dart.tip_one=用1粒种子为1枚飞镖涂药
items.weapon.missiles.darts.dart.tip_cancel=取消
items.weapon.missiles.darts.dart.desc=由短木杆和金属尖头简易制成，手腕轻抖就会精准地飞向目标。使用种子可以为飞镖涂药，使其对目标造成额外效果。
items.weapon.missiles.darts.dart.unlimited_uses=由于其极简的构造，飞镖可永久使用而不损坏。

items.weapon.missiles.darts.displacingdart.name=传送飞镖
items.weapon.missiles.darts.displacingdart.desc=这些飞镖上涂着一种由消逝草制成的药物，能把目标传送走一小段距离。

items.weapon.missiles.darts.healingdart.name=治疗飞镖
items.weapon.missiles.darts.healingdart.desc=这些飞镖上涂着一种由阳春草制成的药物，能强效治疗目标的伤势。这只飞镖仍能对敌人造成伤害，但不会伤及盟友 。

items.weapon.missiles.darts.holydart.name=神圣飞镖
items.weapon.missiles.darts.holydart.desc=这些飞镖上涂着一种由星陨花制成的药物，能向目标体内注入神圣能量。友方或常规敌人将因此进入赐福状态，而亡灵或恶魔类敌人则会受到大量伤害。这只飞镖仍能对敌人造成伤害，但不会伤及盟友。

items.weapon.missiles.darts.incendiarydart.name=燃烧飞镖
items.weapon.missiles.darts.incendiarydart.desc=这些飞镖上涂着一种由烈焰花制成的药物，命中后会燃起烈焰。

items.weapon.missiles.darts.paralyticdart.name=麻痹飞镖
items.weapon.missiles.darts.paralyticdart.desc=这些飞镖上涂着一种由地缚根制成的药物，能让目标无助地麻痹一小段时间。

items.weapon.missiles.darts.poisondart.name=毒液飞镖
items.weapon.missiles.darts.poisondart.desc=这些飞镖上涂着一种由断肠苔制成的药物，能使目标中毒。

items.weapon.missiles.darts.rotdart.name=腐莓飞镖
items.weapon.missiles.darts.rotdart.desc=这种恶毒的飞镖上涂着一种由腐莓制成的酸蚀毒膏，能够蚀穿飞镖触及的任何事物。其上的蚀毒异常强大，寻常敌人触之即死，但强敌可消去其大半功效。相较于其他涂药飞镖，这类飞镖上的涂药药效更加耐用，但其耐用度无法被外力进一步提升。
items.weapon.missiles.darts.rotdart.discover_hint=你可使用某个任务中的种子制作该物品。

items.weapon.missiles.darts.shockingdart.name=电击飞镖
items.weapon.missiles.darts.shockingdart.desc=这些飞镖上涂着一种由风暴藤制成的药物，能让目标受到强烈的电击。

items.weapon.missiles.darts.tippeddart.ac_clean=清洗
items.weapon.missiles.darts.tippeddart.clean_title=清洗飞镖
items.weapon.missiles.darts.tippeddart.clean_desc=这项操作会去除飞镖上的涂药，将其变回普通飞镖。
items.weapon.missiles.darts.tippeddart.clean_all=清洗全部
items.weapon.missiles.darts.tippeddart.clean_one=清洗一枚
items.weapon.missiles.darts.tippeddart.cancel=取消
items.weapon.missiles.darts.tippeddart.uses_left=这些涂药飞镖再使用_%d/%d_次就会有一个失去药效。
items.weapon.missiles.darts.tippeddart.unlimited_uses=_但精良的做工令其经久耐用，不会因为使用过度而损坏。_
items.weapon.missiles.darts.tippeddart.about_to_break=你飞镖上的涂药快要失效了。
items.weapon.missiles.darts.tippeddart.has_broken=你飞镖上的涂药已经失效了。
items.weapon.missiles.darts.tippeddart.discover_hint=你可在商店中中购买或用种子制作该物品。


items.weapon.missiles.bolas.name=流星索
items.weapon.missiles.bolas.stats_desc=这件武器能使目标残废。
items.weapon.missiles.bolas.desc=这种造型特殊的远程武器造成的伤害不高，但能够有效迟滞目标的移动。

items.weapon.missiles.boomerang.name=回旋镖
items.weapon.missiles.boomerang.desc=被投向敌人后，这把扁平的曲状木制投掷武器能够自动回到投掷者手中。
items.weapon.missiles.boomerang.durability=这个回旋镖造得非常结实，使用后不会产生损耗。

items.weapon.missiles.fishingspear.name=捕鱼矛
items.weapon.missiles.fishingspear.desc=本用于捕鱼，但作为武器也相当趁手的短投矛。

items.weapon.missiles.forcecube.name=震爆方石
items.weapon.missiles.forcecube.ondeath=你用震爆方石害死了自己...
items.weapon.missiles.forcecube.stats_desc=这件武器释放出一阵小范围的能量，冲击邻近的所有单位。
items.weapon.missiles.forcecube.desc=这些奇形怪状的魔力方块小到可以握在你的手里，但出乎意料地非常重。

items.weapon.missiles.heavyboomerang.name=重型回旋镖
items.weapon.missiles.heavyboomerang.stats_desc=这件武器会在被掷出的五回合后旋回至原位置。
items.weapon.missiles.heavyboomerang.desc=这把大号回旋镖笨重难用，但能造成可观的伤害。

items.weapon.missiles.javelin.name=标枪
items.weapon.missiles.javelin.desc=这些大号投掷用长枪上的配重保证它们会以尖端为首飞向目标。

items.weapon.missiles.kunai.name=苦无
items.weapon.missiles.kunai.stats_desc=这件武器对未察觉你的敌人更有效。
items.weapon.missiles.kunai.desc=技巧高深者能用这种小刀造成可观的伤害。

items.weapon.missiles.missileweapon.stats_known=这组_%1$d阶_的投掷武器能造成_%2$d~%3$d点伤害_并且需要_%4$d点力量_来正常使用。
items.weapon.missiles.missileweapon.stats_unknown=通常，这组_%1$d阶_投掷武器能造成_%2$d~%3$d点伤害_并且需要_%4$d点力量_来正常使用。
items.weapon.missiles.missileweapon.stats_desc=
items.weapon.missiles.missileweapon.probably_too_heavy=这件武器对你来说或许太重了。
items.weapon.missiles.missileweapon.distance=远程使用投掷武器更为精准，而近距离使用则反之。
items.weapon.missiles.missileweapon.durability=投掷武器在使用过程中会磨损并最终损坏。
items.weapon.missiles.missileweapon.uses_left=这组投掷武器再使用_%d/%d_次就会损坏一件。
items.weapon.missiles.missileweapon.unlimited_uses=这组投掷武器品质极高，可以永久使用而不损坏。
items.weapon.missiles.missileweapon.unknown_uses=通常，这组投掷武器每使用_%d_次就会损坏一件。
items.weapon.missiles.missileweapon.curse_discover=这件投掷武器被诅咒了！
items.weapon.missiles.missileweapon.about_to_break=你的投掷武器快要损坏了。
items.weapon.missiles.missileweapon.has_broken=你的一件投掷武器已经损坏了。
items.weapon.missiles.missileweapon.dust=你一碰这件投掷武器就化为了尘土。
items.weapon.missiles.missileweapon.break_upgraded_warn_desc=如果一组投掷武器的最后一件损坏，这组投掷武器就会永远消失。你确定还要投掷这件武器吗？
items.weapon.missiles.missileweapon.break_upgraded_warn_yes=确定
items.weapon.missiles.missileweapon.break_upgraded_warn_no=算了
items.weapon.missiles.missileweapon$placeholder.name=投掷武器

items.weapon.missiles.shuriken.name=手里剑
items.weapon.missiles.shuriken.stats_desc=手里剑每经20回合可以不消耗回合地投掷一次。
items.weapon.missiles.shuriken.desc=一些轻便到可以在移动时快速掷出的锋利星形金属刃片。
items.weapon.missiles.shuriken$shurikeninstanttracker.name=手里剑冷却
items.weapon.missiles.shuriken$shurikeninstanttracker.desc=你近期不消耗回合地投掷了一个手里剑，必须等待冷却结束才能再次瞬间投掷手里剑。在此期间，手里剑仅能以武器攻速投掷。\n\n剩余回合数：%s

items.weapon.missiles.throwingclub.name=飞槌
items.weapon.missiles.throwingclub.stats_desc=这件武器不会卡在敌人身上并可被立即收回。
items.weapon.missiles.throwingclub.desc=简单粗暴但耐用的投掷武器，实际上就是一块插着根木棍的大石头。

items.weapon.missiles.throwinghammer.name=投掷锤
items.weapon.missiles.throwinghammer.stats_desc=这件武器不会卡在敌人身上并可被立即收回。
items.weapon.missiles.throwinghammer.desc=这些重锤是用来扔向敌人的。其光滑的全金属构造让它们非常耐用。

items.weapon.missiles.throwingknife.name=飞刀
items.weapon.missiles.throwingknife.stats_desc=这件武器对未察觉你的敌人更有效。
items.weapon.missiles.throwingknife.desc=这些轻便的小刀不同于普通的匕首，平衡的配重使其能在飞行后准确地刺穿目标。
items.weapon.missiles.throwingknife.discover_hint=某位英雄初始携带该物品。

items.weapon.missiles.throwingspear.name=投矛
items.weapon.missiles.throwingspear.desc=这些有着非常纤细的木杆的轻便短矛是一种投掷武器，不适合用于近战。

items.weapon.missiles.throwingspike.name=飞刺
items.weapon.missiles.throwingspike.desc=这些尖尖的金属箭是用来扔向远处的敌人的。
items.weapon.missiles.throwingspike.discover_hint=某位英雄初始携带该物品。

items.weapon.missiles.throwingstone.name=投石
items.weapon.missiles.throwingstone.desc=这些石头被人用砂纸打磨成趁手的形状，比普通石头更适合大力投向目标。
items.weapon.missiles.throwingstone.discover_hint=某位英雄初始携带该物品。

items.weapon.missiles.tomahawk.name=飞斧
items.weapon.missiles.tomahawk.stats_desc=这件武器对其目标施加_%1$d~%2$d点流血_。
items.weapon.missiles.tomahawk.typical_stats_desc=这件武器通常对其目标施加_%1$d~%2$d点流血_。
items.weapon.missiles.tomahawk.desc=这些飞斧的锯刃只要卡在敌人身上就能造成流血的撕裂伤口。

items.weapon.missiles.trident.name=三叉戟
items.weapon.missiles.trident.desc=一把尖端有着三根致命尖叉的特大号投掷用长枪。威力极大，但也很重。


items.weapon.spiritbow.name=灵能弓
items.weapon.spiritbow.ac_shoot=射击
items.weapon.spiritbow.prompt=选择一个目标
items.weapon.spiritbow.stats=这把弓不能直接升级，但是会随着你等级提升而逐渐增强。以你目前的等级，这把弓射出的每支箭可以造成_%1$d~%2$d点伤害_并且需要_%3$d点力量_来正常使用。
items.weapon.spiritbow.desc=一把由远古灵木制成的弓，弓弦和弓身的刻纹散发着苍蓝色的幽光。拉开弓弦时，一发魔法箭矢会生成在弓身一侧向目标飞去。
items.weapon.spiritbow.discover_hint=某位英雄初始携带该物品。

items.weapon.weapon.identify=你对手中的武器已经足够熟悉并将其完全鉴定。
items.weapon.weapon.too_heavy=因为你的力量不足，该武器会降低你的攻速和精准，并让你无法偷袭。
items.weapon.weapon.excess_str=你的额外力量会使你在使用这件武器时造成_0~%d点额外伤害_。
items.weapon.weapon.hardening_gone=你武器上的硬化效果被损耗掉了！
items.weapon.weapon.incompatible=不同属性的魔法相冲突，消除了武器上的附魔！
items.weapon.weapon.cursed_worn=由于这件武器被诅咒，你无法将其放下。
items.weapon.weapon.cursed=你能感觉到这件武器里潜伏着一股充满恶意的魔力。
items.weapon.weapon.weak_cursed=虽然这件武器有诅咒，但是你可以脱下它。
items.weapon.weapon.not_cursed=这件武器没有被诅咒。
items.weapon.weapon.faster=这件武器强化了_攻速_。
items.weapon.weapon.stronger=这件武器强化了_伤害_。
items.weapon.weapon.enchanted=这件武器附有_%s_。
items.weapon.weapon.enchant_hardened=它被_硬化_了。
items.weapon.weapon.hardened_no_enchant=这件武器已被_硬化_，但目前没有携带附魔。
items.weapon.weapon$enchantment.enchant=附魔
items.weapon.weapon$enchantment.rankings_desc=死于附魔
items.weapon.weapon$enchantment.discover_hint=你可在地牢中概率找到带有该效果的物品，或尝试自行使物品获得该效果。


###misc items
items.amulet.name=Yendor护符
items.amulet.ac_end=结束游戏
items.amulet.desc=Yendor护符是人类与矮人所知的最强大的神器。其上镶嵌的晶石奇光辉映、气象非常，蕴含着不可思议的神奇力量。
items.amulet.desc_origins=护符的起源与种种过去无人知晓。据历史记载，矮人国王曾夸口说他在矮人文明与外界切断一切联系之前不久就发现了这件神器。那么，他是如何找到的？古神又是怎样从他那里夺走了护符？也许这些问题不需要现在解答，真正重要的是：护符正属于你！
items.amulet.desc_ascent=护符的起源与种种过去无人知晓，但显然它已在古神的力量下受到了极大的侵蚀。你在地牢中踏经的每一寸土地似乎都已在古神意志的掌控之下，面前的敌人也变得众多强势、更甚以往！你也无力使用或抛下护符了——此时它与被诅咒已几无差别。
items.amulet.ascent_title=踏返登临
items.amulet.ascent_desc=你开始感受到古神强大可怖的力量自护符中泛溢而出。凭凡人的区区肉身自这地牢之底向上攀登至地面将远比你想象中的更难！\n\n如果你继续在持有护符的情况下向上返回，地牢将会变得更加险恶重重。跨层传送将会被抑制，而击杀沿途敌人返回地面则将成为你赢得这局游戏的唯一方式！\n\n如果你想要在不开始护符挑战的情况下返回上层，你可以把护符暂时留在这里，也可以选择在这里直接用护符以正常结束游戏。
items.amulet.ascent_yes=继续前进！
items.amulet.ascent_no=稍等片刻
items.amulet.discover_hint=你可在地牢底层找到该物品...

items.ankh.name=重生十字架
items.ankh.ac_bless=祝福
items.ankh.bless=你用散发着治愈魔力的清水祝福了这枚重生十字架。
items.ankh.desc=这枚象征不朽的古老饰物能使人起死回生。不过大部分物品将会被遗落在死亡的地点，等待你去拾回。装满的水袋可用于对重生十字架进行赐福，赋予它更强的力量。
items.ankh.desc_blessed=这枚象征不朽的古老饰品能够让人起死回生。这枚十字架已被祝福而变得更加强大。它会在危急关头牺牲自己来救你一命。
items.ankh.discover_hint=你可在商店中购买该物品。

items.arcaneresin.name=奥术树脂
items.arcaneresin.prompt=选择一根要强化的法杖
items.arcaneresin.ac_apply=强化
items.arcaneresin.level_too_high=这根法杖过于强大，树脂已经不足以对其进行进一步强化了。
items.arcaneresin.not_enough=你的树脂不够了！
items.arcaneresin.apply=你将树脂包被于法杖的表面。法杖的能量愈发凝练了！
items.arcaneresin.desc=这团细腻的粉末闪烁着紫与白的微光。奥术树脂可用于增强法杖魔能，提升法杖等级！\n\n基于法杖初始等级，升级一根法杖分别需要消耗1、2、3个树脂。树脂最多可以升级法杖至+3。\n\n然而，树脂的升级效果不但会_被其他升级来源覆盖_(例如升级卷轴)，而且无法通过灌注法杖转移到法师的魔杖。
items.arcaneresin.discover_hint=你可通过炼金合成该物品。

items.brokenseal.name=破损纹章
items.brokenseal.ac_affix=贴附
items.brokenseal.prompt=选择一件护甲。
items.brokenseal.unknown_armor=你需要先鉴定那件护甲有无诅咒。
items.brokenseal.cursed_armor=纹章不能贴附于被诅咒的盔甲。
items.brokenseal.affix=你将纹章佩挂在了护甲上！
items.brokenseal.desc=一枚蜡制纹章，作为勇气的象征而贴附在护甲之上。纹章上刻有磨损的防御符咒，并从中碎裂为两半。\n\n这是一件来自家乡的纪念物，在纹章的支持下战士会变得不屈不挠。佩戴着纹章，战士会在将要受伤至生命值半数以下时立即获得护盾。\n\n纹章可以被_贴附在护甲上_并能在护甲间转移。它能够携带一次升级，前提是升级时纹章需已贴附在护甲上。
items.brokenseal.inscribed=纹章刻有_%s_。
items.brokenseal.choose_title=选择一个刻印
items.brokenseal.choose_desc=这件护甲与破损纹章均刻有刻印。请选择一个想保留的刻印。\n\n护甲刻印：%1$s\n破损纹章刻印：%2$s\n\n注意，如果选择保留护甲的刻印，纹章将无法转移该刻印。
items.brokenseal.discover_hint=某位英雄初始携带该物品。
items.brokenseal$warriorshield.name=战士护盾
items.brokenseal$warriorshield.desc_active=战士的破损纹章正使他变得不屈不挠，使其获得在生命值之上的护盾。在护盾首次触发后其可被再次使用之前护盾需要进行冷却。\n\n这种护盾并不会随时间衰减，但如果附近持续几回合没有敌人则护盾会结束。当其结束时，任何未使用的护盾都会降低护盾冷却，最多降低50%%。\n\n剩余护盾：%1$d\n\n当前冷却：%2$d
items.brokenseal$warriorshield.desc_cooldown=战士近期已经从他的破碎纹章获得了护盾，而他必须等待直至他可从其护盾效果中再次获益。\n\n剩余回合数：%d
items.brokenseal$warriorshield.desc_negative_cooldown=战士护盾的冷却时间当前为负值，意味着当他的护盾生效时，冷却时间会比通常的150回合更低。护盾冷却可被减至最低-150回合，意味着护盾可在生效后立刻冷却完毕，以便再次激活护盾。\n\n当前冷却时间：%d

items.dewdrop.name=露珠
items.dewdrop.already_full=你的生命值已满。
items.dewdrop.desc=一颗晶莹剔透的露珠。\n\n受这片区域的魔力影响，净水有着少量的治疗效果。

items.equipableitem.curse_detected=在你装备上这件物品前，你感知到了物品的诅咒！
items.equipableitem.unequip_cursed=你无法移除一件被诅咒的物品！
items.equipableitem.ac_equip=装备
items.equipableitem.ac_unequip=取下

items.energycrystal.name=能量晶体
items.energycrystal.desc=一些小巧玲珑的能量晶体，充盈着炼金能量。\n\n这些晶体是炼金配方中最常见的原料，可借助炼金釜从消耗品中提炼获得。

items.gold.name=金币
items.gold.desc=一堆金币。收集金币以在随后的商店中消费。

items.heap.for_sale=%2$s：%1$d金币
items.heap.chest=宝箱
items.heap.chest_desc=打开前你是看不见里面有什么的！
items.heap.locked_chest=上锁的宝箱
items.heap.locked_chest_desc=打开前你是看不见里面有什么的！你需要一枚金钥匙才能打开它。
items.heap.crystal_chest=水晶宝箱
items.heap.crystal_chest_desc=你看得见里面的_%s_，但你需要一枚水晶钥匙才能打开它。
items.heap.artifact=一件神器
items.heap.wand=一根法杖
items.heap.ring=一枚戒指
items.heap.tomb=坟墓
items.heap.tomb_desc=这个坟墓里或许埋葬着一些有用的东西，但墓主肯定是不会让你拿走的。
items.heap.skeleton=遗骸
items.heap.skeleton_desc=某个不幸的冒险家存在过的唯一证明。或许可以找找里面有什么值钱的东西。
items.heap.remains=英雄遗骸
items.heap.remains_desc=你的某个先辈存在过的唯一证明。或许能找到点什么值钱的东西。

items.honeypot.name=蜂蜜罐
items.honeypot.ac_shatter=击碎
items.honeypot.desc=这个巨型蜜罐只是薄薄地涂了一圈蜂蜜，作为替代里头住着一只巨型蜜蜂！这种大型蜜蜂一般只待在蜂巢里，也许罐子本身就是某种特殊陷阱屋？蜜蜂看起来对罐子很满意，当你看向它时它非常警惕地对你回以嗡鸣。
items.honeypot$shatteredpot.name=破碎蜂蜜罐
items.honeypot$shatteredpot.desc=这个罐子已经被打碎，仅靠罐沿的粘稠蜂蜜勉强维持形状，而且正在缓缓解体。\n\n尽管蜜罐碎了，看来蜜蜂依然想捍卫它的住所。

items.item.prompt=选择丢出的方位
items.item.ac_drop=放下
items.item.ac_throw=扔出
items.item.rankings_desc=死于：%s
items.item.curse=诅咒
items.item.custom_note_type=你为这类物品写下了备注：“_%s_”
items.item.custom_note=你为这件物品写下了备注：“_%s_”
items.item.discover_hint=你可在地牢中概率找到该物品。

items.kindofmisc.unequip_title=卸下一件装备
items.kindofmisc.unequip_message=你必须先取下一件装备。请选择要替换的物品。

items.kindofweapon.swift_equip=你迅速地装备上了武器。
items.kindofweapon.equip_cursed=你的手不受控制地握紧了这件武器。
items.kindofweapon.which_equip_msg=你想将这把武器装备至哪个武器栏位？\n\n勇士仅会使用主武器进行攻击，但主、副武器都能发动武技，且共用同一个充能数。\n\n勇士还能瞬间切换主、副武器。
items.kindofweapon.which_equip_primary=主手(%s)
items.kindofweapon.which_equip_secondary=副手(%s)
items.kindofweapon.empty=空栏位

items.kingscrown.name=矮人国王的皇冠
items.kingscrown.ac_wear=加冕
items.kingscrown.naked=非常遗憾，皇冠的魔力无法强化你的内衣。
items.kingscrown.upgraded=皇冠熔为曜日般的金光，而你的护甲在照耀下开始逐渐变形！
items.kingscrown.ratgraded=鼠王挥爪便召出了万丈光芒，而你的护甲在照耀下开始逐渐变形！
items.kingscrown.desc=末代矮人国王的皇冠，至强的魔法能量以光芒的形式从中辐射而出。\n\n如果你有决心将其戴上，皇冠的魔力会涌入你正在装备的护甲，将其改造为_拥有特殊技能的独特英雄护甲_。新的护甲会保留原护甲的所有属性与刻印。
items.kingscrown.discover_hint=你可从某种敌人的掉落物中获得该物品。

items.liquidmetal.name=液金
items.liquidmetal.ac_apply=修复
items.liquidmetal.prompt=选择一个投掷武器
items.liquidmetal.already_fixed=这件投掷武器已经完好无损了！
items.liquidmetal.apply=你为修复该投掷武器消耗了%d滴液金。
items.liquidmetal.desc=这种神奇的液体可以修补投掷武器的破损之处，使之焕然一新！若有一组武器完好无损但缺失其一，液金甚至可用于替换那件缺失的武器！\n\n完全修复一件1阶武器需要10瓶液金，而一件5阶武器需要30瓶液金。武器的每级升级还会增加35%的液金需求量。\n\n液金无法用于修复涂药飞镖的耐久度。
items.liquidmetal.discover_hint=你可通过炼金合成该物品。

items.lostbackpack.name=遗物
items.lostbackpack.desc=你的遗物，包含你遗留在此的所有物品。快快重新拥有它们吧！

items.merchantsbeacon.name=商人信标
items.merchantsbeacon.ac_use=使用
items.merchantsbeacon.desc=这件矮人科技的奇特产物能够让你和遥远的地方通讯。\n\n激活时，这枚信标可以让你从地牢的任意角落向像素商店出售物品。\n\n不过信标内的魔法只够支撑一次会话，请酌情使用。

items.stylus.name=奥术刻笔
items.stylus.ac_inscribe=蚀刻
items.stylus.prompt=选择一件护甲
items.stylus.identify=你需要先鉴定那件护甲有无诅咒。
items.stylus.cursed=奥术刻笔的力量无法作用在被诅咒的护甲上。
items.stylus.inscribed=你用刻笔雕刻了盔甲。
items.stylus.desc=这支奥术刻笔由一种暗黑色的坚硬石料制成。你能用它在护甲上刻下魔法刻印，不过你无法自主选择，刻笔会替你做出决定。

items.tengusmask.name=天狗的面具
items.tengusmask.ac_wear=佩戴
items.tengusmask.used=面具瓦解了，它所蕴含的能量涌入了你的身体。
items.tengusmask.desc=天狗死时，这幅面具像褪皮般从他的脸上失落地滑下。你能感受它在波动着一股神妙的魔力，仿佛在极力劝你成为它的新主人。难道天狗戴上它时也是被其力量吸引？\n\n如果你有勇气将其戴上，面具的庞大力量会转嫁到你体内，供你为英雄_选择一种职业专精_。\n\n你会选择哪条道路？
items.tengusmask.discover_hint=你可从某种敌人的掉落物中获得该物品。

items.torch.name=火把
items.torch.ac_light=点燃
items.torch.desc=冒险必备物品，每当地牢陷入黑暗之时，火把能让你走上正确的道路。

items.waterskin.name=水袋
items.waterskin.ac_drink=饮用
items.waterskin.collected=你将一滴露珠收集到了水袋里。
items.waterskin.full=你的水袋装满了！
items.waterskin.empty=你的水袋一滴也不剩了！
items.waterskin.desc=牛皮缝制的液体容器，被软木塞牢牢密封着。在激烈的搏斗中也不会漏出一滴内容。
items.waterskin.desc_water=你的水袋里只有普普通通的饮用水，地牢中肯定会有更值得装的东西。
items.waterskin.desc_heal=水袋里现在装着有治愈魔力的露水。水袋越满，你在饮用时瞬间恢复的生命也会越多。你每次使用都只会喝掉你需要的量。
items.waterskin.desc_full=装满了的水袋散发着一股能量，也许能够用来祝福其他的生存道具？
items.waterskin.discover_hint=某位英雄初始携带该物品。

