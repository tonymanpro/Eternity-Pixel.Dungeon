items.armor.armor.avg_absorb=一般情况下这件_%1$d阶_护甲能抵挡_%2$d~%3$d点伤害_并且需要_%4$d点力量_来正常使用。
items.armor.armor.too_heavy=由于你的力量不足，使用这件护甲会降低你的移动、闪避以及防御能力。
items.armor.armor.probably_too_heavy=这套护甲对你来说或许太重了。
items.armor.armor.excess_str=你的额外力量使你穿戴着这件护甲时_更易闪避_。
items.armor.armor.evasion=这件护甲强化了_闪避_。
items.armor.armor.defense=这件护甲强化了_防御_。
items.armor.armor.inscribed=这件护甲刻有_%s_。
items.armor.armor.glyph_hardened=它被_硬化_了。
items.armor.armor.hardened_no_glyph=这件护甲已被_硬化_，但目前没有携带刻印。
items.armor.armor.cursed_worn=这套护甲被诅咒了，你无法卸下它。
items.armor.armor.cursed=你能感觉到这套护甲里潜伏着一股充满恶意的魔力。
items.armor.armor.weak_cursed=虽然这件护甲有诅咒，但是你可以脱下它。
items.armor.armor.not_cursed=这件护甲没有被诅咒。
items.armor.armor.seal_attached=战士的破损纹章被贴附于这件护甲上，当战士将要受伤至生命值半数以下时，纹章会为战士提供_%d点护盾_。
items.armor.armor.seal_transfer=战士的破损纹章必须贴附在他当前穿戴的护甲上方可生效。你是否愿意将破损纹章从卸下的护甲上自动剥离，并贴附到新装备的护甲上？
items.armor.armor.seal_transfer_yes=是
items.armor.armor.seal_transfer_no=否
items.armor.armor$glyph.glyph=刻印
