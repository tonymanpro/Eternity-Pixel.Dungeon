items.weapon.melee.greatshield.name=巨型方盾
items.weapon.melee.greatshield.typical_stats_desc=这件武器通常能格挡0~%d点伤害。格挡量随升级而增长。
items.weapon.melee.greatshield.stats_desc=这件武器能格挡0~%d点伤害。格挡量随升级而增长。
items.weapon.melee.greatshield.ability_name=护卫
items.weapon.melee.greatshield.typical_ability_desc=决斗家可以用巨型方盾_护卫_自己，一般会在_%d回合_内完全抵挡针对自己的物理或魔法攻击。一旦决斗家抵挡过攻击，再行还击或施法，都会终止护卫状态。
items.weapon.melee.greatshield.ability_desc=决斗家可以用巨型方盾_护卫_自己，在_%d回合_内完全抵挡针对自己的物理或魔法攻击。一旦决斗家抵挡过攻击，再行还击或施法，都会终止护卫状态。
items.weapon.melee.greatshield.upgrade_ability_stat_name=武技持续时间
items.weapon.melee.greatshield.desc=与其说它是一面盾，不如说它是一堵能移动的墙。这一大块金属对于防御十分有效，但没有在攻击方面留下多少余地。

items.weapon.melee.greatsword.name=巨剑
