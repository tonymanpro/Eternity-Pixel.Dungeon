items.weapon.melee.scimitar.desc=Een dik gebogen lemmet. De vorm zorgt voor snellere, maar minder krachtige aanvallen.
items.weapon.melee.scimitar$sworddance.name=zwaarddans
items.weapon.melee.scimitar$sworddance.desc=De Duellist maakt snelle, op momentum gebaseerde aanvallen met haar wapen, in een soort dans. Terwijl deze houding actief is, valt ze 60%% sneller aan (genoeg om precies twee keer per beurt met een kromzwaard aan te vallen), en heeft een nauwkeurigheid van +50%%.\n\nResterende beurten: %s.

items.weapon.melee.sickle.name=sikkel
items.weapon.melee.sickle.stats_desc=Dit is een vrij onnauwkeurig wapen.
items.weapon.melee.sickle.ability_name=oogsten
items.weapon.melee.sickle.typical_ability_desc=De Duellist kan een vijand _oogsten_ met een sikkel. Deze verwoestende aanval raakt gegarandeerd en veroorzaakt doorgaans _%d schade_. Deze schade wordt toegepast als bloeding als het doelwit niet immuun is.
items.weapon.melee.sickle.ability_desc=De Duellist kan een vijand _oogsten_ met een sikkel. Deze verwoestende aanval raakt gegarandeerd en veroorzaakt _%d schade_. Deze schade wordt toegepast als bloeding als het doelwit niet immuun is.
items.weapon.melee.sickle.desc=Een handzaam landbouwwerktuig dat kan dienen als een sterk maar log wapen.

items.weapon.melee.spear.name=speer
items.weapon.melee.spear.stats_desc=Dit is een vrij langzaam wapen.\nDit wapen heeft extra bereik.
items.weapon.melee.spear.ability_name=spies
items.weapon.melee.spear.typical_ability_desc=De Duellist kan de punt van een speer gebruiken om een vijand te _spiezen_ die binnen bereik is maar niet op een aangrenzende tegel staat. Dit richt doorgaans _%1$d-%2$d schade_ aan, duwt de vijand terug en is gegarandeerd raak.
items.weapon.melee.spear.ability_desc=De Duellist kan de punt van een speer gebruiken om een vijand te _spiezen_ die binnen bereik is maar niet op een aangrenzende tegel staat. Dit richt _ %1$d-%2$d schade_ aan, duwt de vijand terug en is gegarandeerd raak.
items.weapon.melee.spear.desc=Een slanke houten staaf met een punt van geslepen ijzer.

items.weapon.melee.sword.name=zwaard
items.weapon.melee.sword.ability_name=klieven
items.weapon.melee.sword.typical_ability_desc=De Duellist kan een vijand _doorklieven_ met een zwaard. Dit richt doorgaans _%1$d-%2$dschade_ aan en is gegarandeerd raak. Als klieven een vijand doodt, gebeurt dat onmiddellijk en kan de Duellist binnen 5 beurten gratis opnieuw klieven gebruiken.
items.weapon.melee.sword.ability_desc=De Duellist kan een vijand _doorklieven_ met een zwaard. Dit richt _%1$d-%2$d schade_ aan en is gegarandeerd raak. Als klieven een vijand doodt, gebeurt dat onmiddellijk en kan de Duellist binnen 5 beurten gratis opnieuw klieven gebruiken.
items.weapon.melee.sword.desc=Een mooi uitgebalanceerd zwaard. Niet te groot, maar toch opvallend langer dan een kortzwaard.
items.weapon.melee.sword$cleavetracker.name=klieven
items.weapon.melee.sword$cleavetracker.desc=De Duellist is klaar om haar vorige klieven op te volgen. Het volgende gebruik van klieven kost geen lading.\n\nResterende beurten: %s.

items.weapon.melee.warhammer.name=oorlogshamer
items.weapon.melee.warhammer.stats_desc=Dit is een vrij nauwkeurig wapen.
items.weapon.melee.warhammer.ability_name=zware klap
items.weapon.melee.warhammer.typical_ability_desc=De Duellist kan een _zware slag_ uitvoeren met een oorlogshamer. Deze geconcentreerde aanval richt doorgaans _ %1$d-%2$d schade_ aan als hij de vijand verrast, en verdooft hem gedurende 5 beurten, wat de nauwkeurigheid en ontwijking met 50%% vermindert. Zware slagen treffen altijd, maar richten normale schade aan als de vijand niet wordt verrast.
items.weapon.melee.warhammer.ability_desc=De Duellist kan een _zware slag_ uitvoeren met een oorlogshamer. Deze geconcentreerde aanval richt _ %1$d-%2$d schade_ aan als hij de vijand verrast, en verdooft hem gedurende 5 beurten, wat de nauwkeurigheid en ontwijking met 50%% vermindert. Zware slagen treffen altijd, maar richten normale schade aan als de vijand niet wordt verrast.
items.weapon.melee.warhammer.desc=Weinig wezens kunnen de verpletterende klap van deze torenhoge massa lood en staal weerstaan, maar er is veel kracht voor nodig om het effectief te gebruiken.

items.weapon.melee.warscythe.name=oorlogszeis
items.weapon.melee.warscythe.stats_desc=Dit is een vrij onnauwkeurig wapen.
items.weapon.melee.warscythe.ability_name=oogsten
items.weapon.melee.warscythe.typical_ability_desc=De Duellist kan een vijand _oogsten_ met een oorlogszeis. Deze verwoestende aanval raakt gegarandeerd en veroorzaakt doorgaans _%d schade._ Deze schade wordt toegepast als bloeding als het doelwit niet immuun is
items.weapon.melee.warscythe.ability_desc=De Duellist kan een vijand _oogsten_ met een oorlogszeis. Deze verwoestende aanval raakt gegarandeerd en veroorzaakt _%d schade_.  Deze schade wordt toegepast als bloeding als het doelwit niet immuun is.
items.weapon.melee.warscythe.desc=Dit grote en onhandige stuk gereedschap is versterkt, zodat het beter vijanden dan gewassen kan afsnijden.

items.weapon.melee.whip.name=zweep
items.weapon.melee.whip.stats_desc=Dit wapen heeft een enorm bereik.
items.weapon.melee.whip.ability_name=zweepslag
items.weapon.melee.whip.typical_ability_desc=De Duellist kan alle vijanden om haar heen met een _zweepslag_ van haar zweep slaan. Deze vaardigheid richt normaal_%1$d-%2$d schade_ aan, valt alle vijanden binnen aanvalsbereik aan en zal gegarandeerd raken.
items.weapon.melee.whip.ability_desc=De Duellist kan alle vijanden om haar heen met een _zweepslag_ van haar zweep slaan. Deze vaardigheid richt _%1$d-%2$d schade_ aan, valt alle vijanden binnen aanvalsbereik aan en zal gegarandeerd raken.
items.weapon.melee.whip.desc=Hoewel dit stuk touw met weerhaken aan het einde weinig schade aanricht, kan het bereik niet worden geëvenaard.

items.weapon.melee.wornshortsword.name=versleten kortzwaard
items.weapon.melee.wornshortsword.ability_name=klieven
items.weapon.melee.wornshortsword.typical_ability_desc=De Duellist kan een vijand _doorklieven_ met een versleten kortzwaard. Dit richt normaal _%1$d-%2$d schade_ aan en is gegarandeerd raak. Als klieven een vijand doodt, is dat onmiddellijk en kan de Duellist binnen 5 beurten gratis opnieuw klieven gebruiken.
items.weapon.melee.wornshortsword.ability_desc=De Duellist kan een vijand _doorklieven_ met een versleten kortzwaard. Dit richt _%1$d-%2$dschade_ aan en is gegarandeerd raak. Als klieven een vijand doodt, is dat onmiddellijk en kan de Duellist binnen 5 beurten gratis opnieuw klieven gebruiken.
items.weapon.melee.wornshortsword.desc=Een vrij kort zwaard, versleten door intensief gebruik. Het is zowel zwakker als een beetje lichter dan een kortzwaard in betere staat.
items.weapon.melee.wornshortsword.discover_hint=Een van de helden begint met dit voorwerp.


###missile weapons
items.weapon.missiles.darts.adrenalinedart.name=adrenalinepijltje
items.weapon.missiles.darts.adrenalinedart.desc=Deze pijltjes zijn getipt met een op fluksdistel gebaseerde samenstelling die de bewegings- en aanvalssnelheid van bondgenoten verhoogt, of de bewegingssnelheid van vijanden kort verlaagt. Het pijltje zelf is nog steeds schadelijk voor vijanden, maar schaadt bondgenoten niet.

items.weapon.missiles.darts.blindingdart.name=verblindend pijltje
items.weapon.missiles.darts.blindingdart.desc=Deze pijltjes zijn getipt met een op blindkruid gebaseerde verbinding die hun doelwit voor een korte tijd verblindt. Ze desoriënteren echter niet, dus een vijand weet nog steeds waar hij je voor het laatst heeft gezien.

items.weapon.missiles.darts.chillingdart.name=koelend pijltje
items.weapon.missiles.darts.chillingdart.desc=Deze pijltjes zijn getipt met een op het ijsklokje gebaseerde samenstelling die hun doelwit aanzienlijk afkoelt.

items.weapon.missiles.darts.cleansingdart.name=reinigingspijltje
items.weapon.missiles.darts.cleansingdart.desc=Deze pijltjes zijn voorzien van een op mageroyaal gebaseerde verbinding die bondgenoten tijdelijk immuun maakt voor alle negatieve effecten, of positieve effecten van vijanden zuivert. Vijanden kunnen zelfs even vergeten dat ze je aanvallen of van je wegvluchten. Het pijltje zelf is nog steeds schadelijk voor vijanden, maar schaadt bondgenoten niet.

items.weapon.missiles.darts.dart.name=pijltje
items.weapon.missiles.darts.dart.ac_tip=TIP
items.weapon.missiles.darts.dart.prompt=Kies een zaad
items.weapon.missiles.darts.dart.tip_title=Pijltjes Tippen
items.weapon.missiles.darts.dart.tip_desc=Een zaadje kan worden gecombineerd met een of twee pijltjes om ze te tippen. Elk type zaadje produceert zijn eigen type getipte pijltje, met een uniek effect voor eenmalig gebruik.\n\nAls je een pijltje met deze zaden tipt, krijg je een _%s._
items.weapon.missiles.darts.dart.tip_all=tip %1$d pijltjes met %2$d zaden
items.weapon.missiles.darts.dart.tip_two=tip 2 pijltjes met 1 zaadje
items.weapon.missiles.darts.dart.tip_one=tip 1 pijltje met 1 zaadje
items.weapon.missiles.darts.dart.tip_cancel=annuleren
items.weapon.missiles.darts.dart.desc=Deze eenvoudige staken van hout met spijkerpunt zijn verzwaard om uit de losse pols te werpen, strak te vliegen en hun doelwit te steken. Ze kunnen worden getipt met zaden om bonuseffecten te krijgen wanneer ze worden gegooid.
items.weapon.missiles.darts.dart.unlimited_uses=Dankzij hun eenvoudige constructie gaan de pijltjes vrijwel eeuwig mee.

items.weapon.missiles.darts.displacingdart.name=verplaatsende pijltje
items.weapon.missiles.darts.displacingdart.desc=Deze pijltjes zijn getipt met een op vaagblad gebaseerde verbinding die hun doelwit op korte afstand teleporteert.

items.weapon.missiles.darts.healingdart.name=genezend pijltje
items.weapon.missiles.darts.healingdart.desc=Deze pijltjes zijn getipt met een op zonnegras gebaseerde verbinding die een flinke hoeveelheid genezing aan hun doelwit geeft. De pijl zelf is nog steeds schadelijk voor vijanden, maar schaadt bondgenoten niet.

items.weapon.missiles.darts.holydart.name=heilig pijltje
items.weapon.missiles.darts.holydart.desc=Deze pijltjes zijn getipt met een op sterbloem gebaseerde samenstelling die heilige energie aan hun doelwit geeft. Bondgenoten en gewone vijanden worden gezegend, maar ondode of demonische vijanden lopen zware schade op. De pijl zelf is nog steeds schadelijk voor vijanden, maar schaadt bondgenoten niet.

items.weapon.missiles.darts.incendiarydart.name=brandend pijltje
items.weapon.missiles.darts.incendiarydart.desc=Deze pijltjes zijn getipt met een op vuurbloem gebaseerde samenstelling die bij impact in briljante vlammen uitbarst.

items.weapon.missiles.darts.paralyticdart.name=verlammend pijltje
items.weapon.missiles.darts.paralyticdart.desc=Deze pijltjes zijn getipt met een op aardwortel gebaseerde verbinding die hun doelwit voor een korte tijd verlamt.

items.weapon.missiles.darts.poisondart.name=giftig pijltje
items.weapon.missiles.darts.poisondart.desc=Deze pijltjes zijn getipt met een op treurmos gebaseerde verbinding die hun doelwit vergiftigt.

items.weapon.missiles.darts.rotdart.name=rot pijltje
items.weapon.missiles.darts.rotdart.desc=Deze gemene pijltjes zijn getipt met een bijtende verbinding op basis van de rotbes, die zich agressief door alles heen wegvreet waarmee de pijl in contact komt. Krachtige vijanden weerstaan het grootste deel van het effect, maar de corrosie is sterk genoeg om de meeste standaardvijanden gemakkelijk te doden. Deze pijltjes gaan langer mee dan andere getipte pijltjes, maar hun duurzaamheid kan niet worden verbeterd.
items.weapon.missiles.darts.rotdart.discover_hint=Je kunt dit voorwerp maken met behulp van een zaadje uit een specifieke missie.

items.weapon.missiles.darts.shockingdart.name=schokkende pijl
items.weapon.missiles.darts.shockingdart.desc=Deze pijltjes zijn getipt met een op stormrank gebaseerde verbinding die een vervelende schok aan hun doelwit geeft.

items.weapon.missiles.darts.tippeddart.ac_clean=SCHOONMAKEN
items.weapon.missiles.darts.tippeddart.clean_title=Pijltjes Schoonmaken
items.weapon.missiles.darts.tippeddart.clean_desc=Met deze actie wordt de zaadtip van je pijltjes verwijderd en veranderen ze in gewone pijltjes.
items.weapon.missiles.darts.tippeddart.clean_all=alles schoonmaken
items.weapon.missiles.darts.tippeddart.clean_one=één schoonmaken
items.weapon.missiles.darts.tippeddart.cancel=annuleer
items.weapon.missiles.darts.tippeddart.uses_left=Deze stapel pijltjes kan nog _%d/%d_ keer gebruikt worden voordat de tip opgebruikt is.
items.weapon.missiles.darts.tippeddart.unlimited_uses=_Maar deze zijn van zo'n hoge kwaliteit dat ze voor altijd meegaan._
items.weapon.missiles.darts.tippeddart.about_to_break=De tip van je pijltje is bijna verlopen.
items.weapon.missiles.darts.tippeddart.has_broken=De tip van je pijltje is verlopen.
items.weapon.missiles.darts.tippeddart.discover_hint=Je kunt dit voorwerp in een winkel kopen, of zelf maken met behulp van een zaadje.


items.weapon.missiles.bolas.name=bola's
items.weapon.missiles.bolas.stats_desc=Dit wapen veroorzaakt verlamming bij het doelwit.
items.weapon.missiles.bolas.desc=Deze ongebruikelijke afstandswapens zijn niet erg schadelijk, maar ze weten hun doelen uitstekend te vertragen.

items.weapon.missiles.boomerang.name=boemerang
items.weapon.missiles.boomerang.desc=Dit platte gebogen houten projectiel keert terug naar de handen van zijn werper nadat het naar de vijand is gegooid.
items.weapon.missiles.boomerang.durability=Door zijn stevige constructie gaat deze boemerang niet kapot door gebruik.

items.weapon.missiles.fishingspear.name=visspeer
items.weapon.missiles.fishingspear.desc=Kleine werpsperen die prima functioneren als geïmproviseerd wapen, ondanks dat ze ontworpen zijn om mee te vissen.

items.weapon.missiles.forcecube.name=krachtkubus
items.weapon.missiles.forcecube.ondeath=Je hebt zelfmoord gepleegd met je eigen krachtkubus...
items.weapon.missiles.forcecube.stats_desc=Dit wapen verspreidt de kracht van de inslag over een klein gebied, waardoor alles in de buurt wordt geraakt.
items.weapon.missiles.forcecube.desc=Deze wonderlijk gevormde magische kubussen zijn klein genoeg om in je hand te houden, maar ze zijn ontzettend zwaar.

items.weapon.missiles.heavyboomerang.name=zware boemerang
items.weapon.missiles.heavyboomerang.stats_desc=Dit wapen gaat na vijf beurten terug naar de locatie waar het vandaan werd gegooid.
items.weapon.missiles.heavyboomerang.desc=Deze grote boemerang is moeilijk om effectief te hanteren, maar richt aanzienlijke schade aan.

items.weapon.missiles.javelin.name=werpspies
items.weapon.missiles.javelin.desc=Deze grotere speren zijn verzwaard om de spies op hun punt vooraan te houden terwijl ze door de lucht glijden.

items.weapon.missiles.kunai.name=kunai
items.weapon.missiles.kunai.stats_desc=Dit wapen is sterker tegen onbewuste vijanden.
items.weapon.missiles.kunai.desc=Deze kleine messen zijn zeer krachtig in de handen van een ervaren gebruiker.

items.weapon.missiles.missileweapon.stats_known=Deze set van _klasse-%1$d_ werpwapens veroorzaakt _%2$d-%3$d schade_ en vereist _%4$d kracht_ om te gebruiken.
items.weapon.missiles.missileweapon.stats_unknown=Normaal gesproken veroorzaakt deze set van _klasse-%1$d_ werpwapens  _%2$d-%3$d schade_ en vereist _%4$d kracht_ om te gebruiken.
items.weapon.missiles.missileweapon.stats_desc=
items.weapon.missiles.missileweapon.probably_too_heavy=Waarschijnlijk is dit wapen te zwaar voor je.
items.weapon.missiles.missileweapon.distance=Werpwapens zijn nauwkeuriger op afstand, maar minder nauwkeurig van dichtbij.
items.weapon.missiles.missileweapon.durability=Werpwapens slijten en breken als ze worden gebruikt.
items.weapon.missiles.missileweapon.uses_left=Deze set van werpwapens kan nog _%d/%d_ keer worden gebruikt voordat er één breekt.
items.weapon.missiles.missileweapon.unlimited_uses=De kwaliteit van deze set is zo hoog dat hij vrijwel eeuwig meegaat.
items.weapon.missiles.missileweapon.unknown_uses=Normaal gesproken kun je deze set werpwapens _%d_ keer gebruiken voordat er één kapotgaat.
items.weapon.missiles.missileweapon.curse_discover=Dit werwapen is vervloekt!
items.weapon.missiles.missileweapon.about_to_break=Je werpwapen staat op het punt te breken.
items.weapon.missiles.missileweapon.has_broken=Eén van je werpwapens is kapot.
items.weapon.missiles.missileweapon.dust=Het werpwapen verpulvert tot stof zodra je het aanraakt.
items.weapon.missiles.missileweapon.break_upgraded_warn_desc=Als het laatst werpwapen in je verbeterde set werpwapens kapotgaat, dan gaat de set permanent verloren. Weet je zeker dat je het wilt gooien?
items.weapon.missiles.missileweapon.break_upgraded_warn_yes=Ja
items.weapon.missiles.missileweapon.break_upgraded_warn_no=Nee
items.weapon.missiles.missileweapon$placeholder.name=werpwapen

items.weapon.missiles.shuriken.name=werpster
items.weapon.missiles.shuriken.stats_desc=werpsterren kunnen direct worden gegooid en hebben een afkoeltijd van 20 beurten.
items.weapon.missiles.shuriken.desc=Deze stervormige stukjes metaal met vlijmscherpe messen kunnen snel worden gegooid terwijl je beweegt.
items.weapon.missiles.shuriken$shurikeninstanttracker.name=Werpster afkoelperiode
items.weapon.missiles.shuriken$shurikeninstanttracker.desc=Je hebt onlangs direct een werpster gegooid en moet wachten voordat je dit opnieuw doet. Werpsterren kunnen nog steeds worden gegooid, maar dan met normale wapensnelheid. \n\nResterende beurten: %s.

items.weapon.missiles.throwingclub.name=werpknuppel
items.weapon.missiles.throwingclub.stats_desc=Dit wapen blijft niet aan vijanden vastzitten en kan direct verzameld worden.
items.weapon.missiles.throwingclub.desc=Een vrij eenvoudig maar duurzaam werpwapen, in feite een grote steen bevestigd aan een stok.

items.weapon.missiles.throwinghammer.name=werphamer
items.weapon.missiles.throwinghammer.stats_desc=Dit wapen blijft niet aan vijanden vastzitten en kan direct verzameld worden.
items.weapon.missiles.throwinghammer.desc=Deze forse hamers zijn ontworpen om naar een vijand te gooien. Dankzij hun soepele, volledig metalen constructie zijn ze zeer duurzaam.

items.weapon.missiles.throwingknife.name=werpmes
items.weapon.missiles.throwingknife.stats_desc=Dit wapen is sterker tegen onbewuste vijanden.
items.weapon.missiles.throwingknife.desc=Deze lichtgewicht messen zijn zo uitgebalanceerd dat ze met een boog door de lucht schieten, recht op hun doel af.
items.weapon.missiles.throwingknife.discover_hint=Een van de helden begint met dit voorwerp.

items.weapon.missiles.throwingspear.name=werpspeer
items.weapon.missiles.throwingspear.desc=Deze lichtgewicht speren hebben een dun frame en zijn ontworpen om mee te werpen en niet om mee te steken.

items.weapon.missiles.throwingspike.name=werpspijker
items.weapon.missiles.throwingspike.desc=Deze duurzame, puntige metalen pijlen zijn bedoeld om naar vijanden op afstand te werpen.
items.weapon.missiles.throwingspike.discover_hint=Een van de helden begint met dit voorwerp.

items.weapon.missiles.throwingstone.name=werpsteen
items.weapon.missiles.throwingstone.desc=Deze stenen zijn geschuurd zodat ze met meer kracht kunnen worden gegooid dan een gewone steen.
items.weapon.missiles.throwingstone.discover_hint=Een van de helden begint met dit voorwerp.

items.weapon.missiles.tomahawk.name=tomahawk
items.weapon.missiles.tomahawk.stats_desc=Dit wapen veroorzaakt _%1$d-%2$d bloeding_ bij zijn doelwit.
items.weapon.missiles.tomahawk.typical_stats_desc=Dit wapen veroorzaakt normaal gesproken _%1$d-%2$d bloeding_ bij zijn doelwit.
items.weapon.missiles.tomahawk.desc=Deze werpbijlen hebben een gekartelde rand die voor scheuring zorgt als ze aan een vijand blijven plakken

items.weapon.missiles.trident.name=drietand
items.weapon.missiles.trident.desc=Enorme werpsperen met drie dodelijke tanden aan het uiteinde. Ze zijn krachtig, maar behoorlijk zwaar.


items.weapon.spiritbow.name=geestboog
items.weapon.spiritbow.ac_shoot=SCHIET
items.weapon.spiritbow.prompt=Kies een doel
items.weapon.spiritbow.stats=De boog kan niet direct worden opgewaardeerd, maar wordt in plaats daarvan gestaag sterker naarmate je niveau omhoog gaat. Op je huidige niveau richten pijlen die met de boog worden geschoten _%1$d-%2$d schade_ aan en heeft de boog _%3$d sterkte_ nodig om goed te kunnen gebruiken.
items.weapon.spiritbow.desc=Een boog gemaakt van oud magisch hout. De pees en het reliëf op de boog gloeit met een bleekblauw licht. Wanneer de pees wordt gespannen, roept deze boog een magische pijl op die op een vijand kan worden afgevuurd.
items.weapon.spiritbow.discover_hint=Een van de helden begint met dit voorwerp.

items.weapon.weapon.identify=Je hebt je wapen voldoende gebruikt om het te identificeren.
items.weapon.weapon.too_heavy=Vanwege je ontoereikende kracht belemmert dit wapen je aanvalssnelheid, nauwkeurigheid en je vermogen om verrassingsaanvallen uit te voeren.
items.weapon.weapon.excess_str=Vanwege je overmatige kracht breng je tot _0-%d bonusschade_ met dit wapen toe.
items.weapon.weapon.hardening_gone=De verharding van dit wapen is uitgewerkt!
items.weapon.weapon.incompatible=Interactie van verschillende soorten magie heeft de betovering van dit wapen ongedaan gemaakt!
items.weapon.weapon.cursed_worn=Omdat dit wapen vervloekt is, ben je machteloos om het terug te nemen.
items.weapon.weapon.cursed=Je voelt een kwaadaardige magie schuilen in dit wapen.
