items.weapon.melee.katana.ability_desc=De Duellist kan met een katana naar een vijand 1 tegel verderop _uitvallen_. Ze beweegt zich richting de vijand, richt _%1$d-%2$dschade_ aan en zal gegarandeerd raken.
