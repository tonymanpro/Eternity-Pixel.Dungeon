###armor curses
items.armor.curses.antientropy.name=%s van anti-entropie
items.armor.curses.antientropy.desc=De vloek van anti-entropie werkt tegen de krachten van het universum, en sluist energie uit de omgeving door naar de drager. Dit zet de drager even in brand, maar bevriest alles om de drager heen!

items.armor.curses.bulk.name=%s van bulk
items.armor.curses.bulk.desc=Een harnas van bulk lijkt groter en indrukwekkender, maar biedt geen daadwerkelijke verbeterde verdediging. Sterker nog, de extra omvang maakt het erg moeilijk om door deuropeningen te komen.

items.armor.curses.corrosion.name=%s van corrosie
items.armor.curses.corrosion.desc=Een harnas van corrosie kan uitbarsten met een bijtende vloeistof, dat alles in de omgeving bedekt met kleverig zuur.

items.armor.curses.displacement.name=%s van verplaatsing
items.armor.curses.displacement.desc=De vloek van verplaatsing probeert de drager in veiligheid te brengen als deze aangevallen wordt. De vloek is echter iets te effectief en teleporteert de gebruiker naar een willekeurig plek op de verdieping.

items.armor.curses.metabolism.name=%s van stofwisseling
items.armor.curses.metabolism.desc=De stofwisselingsvloek zet verzadiging direct om in gezondheid wanneer de drager gewond is. Dit zorgt voor extra genezing, maar veroorzaakt snel honger.

items.armor.curses.multiplicity.name=%s van vermenigvuldiging
items.armor.curses.multiplicity.desc=Een harnas vervloekt met vermenigvuldiging bevat gevaarlijke duplicatiemagie. Soms maakt het een spiegelbeeld van de drager, maar je hebt eenzelfde kans dat de aanvaller verdubbeld wordt!

items.armor.curses.overgrowth.name=%s van overgroeiing
items.armor.curses.overgrowth.desc=Een harnas van overgroeiing is bedekt met diverse bloeiende planten. Alhoewel dit er zeker interessant uit ziet, draagt het niet bij aan bescherming en deze planten worden lukraak actief tijdens gevechten.

items.armor.curses.stench.name=%s van stank
items.armor.curses.stench.desc=Een harnas met een stankvervloeking laat wolken met schadelijk gas vrijkomen, die gevaarlijk zijn voor alles wat in ze wordt gevangen.


###glyphs
items.armor.glyphs.affection.name=%s van liefde
items.armor.glyphs.affection.desc=Dit krachtige symbool beïnvloedt de geest van aanvallers en maakt hen tijdelijk gecharmeerd.

items.armor.glyphs.antimagic.name=%s van anti-magie
items.armor.glyphs.antimagic.desc=Dit krachtige symbool staat het harnas toe zowel magische als fysieke aanvallen te blokkeren. De magische verdediging wordt niet beïnvloed door de klasse van het harnas.

items.armor.glyphs.brimstone.name=%s van zwavel
items.armor.glyphs.brimstone.desc=Dit symbool beschermt de drager en zijn bezittingen tegen vuur, en heft alle schade en negatieve effecten ervan op.

items.armor.glyphs.camouflage.name=%s van camouflage
items.armor.glyphs.camouflage.desc=Dit symbool laat de drager ervan opgaan in het hoge gras, waardoor deze tijdelijk onzichtbaar wordt.

items.armor.glyphs.entanglement.name=%s van verstrikking
items.armor.glyphs.entanglement.desc=Dit symbool laat een aardachtige bepantsering rond de drager groeien, dat schade kan opvangen. Deze bepantsering breekt echter zodra de drager beweegt.

items.armor.glyphs.flow.name=%s van stroming
items.armor.glyphs.flow.desc=Dit symbool kan invloed uitoefenen op de stroming van het water rond de drager, hierdoor loopt de drager er veel sneller doorheen.

items.armor.glyphs.obfuscation.name=%s van verduistering
items.armor.glyphs.obfuscation.desc=Dit symbool verbergt de drager, waardoor deze moeilijker te detecteren is.

items.armor.glyphs.potential.name=%s van potentie
items.armor.glyphs.potential.desc=Dit symbool bouwt energie op als de drager geraakt wordt. Hierdoor laden de toverstokken van de drager op.

items.armor.glyphs.repulsion.name=%s van afstoting
items.armor.glyphs.repulsion.desc=Dit symbool kaatst de ontvangen kracht terug naar de aanvaller, waardoor ze achteruit worden geduwd.

items.armor.glyphs.stone.name=%s van steen
items.armor.glyphs.stone.desc=Dit symbool omringt het harnas met zware magische stenen waardoor ontwijken onmogelijk wordt, maar houdt daarentegen schade tegen in verhouding met ontwijking.

items.armor.glyphs.swiftness.name=%s van snelheid
items.armor.glyphs.swiftness.desc=Dit symbool maakt de drager sneller als deze niet in de buurt van een vijand is.

items.armor.glyphs.thorns.name=%s van doornen
items.armor.glyphs.thorns.desc=Dit krachtige symbool brengt schade toe aan aanvallers als ze de drager aanvallen, waardoor ze langzaam gaan bloeden.

items.armor.glyphs.viscosity.name=%s van taaiheid
items.armor.glyphs.viscosity.deferred=uitgesteld %d
items.armor.glyphs.viscosity$defereddamage.name=uitgestelde schade
items.armor.glyphs.viscosity$defereddamage.ondeath=De uitgestelde schade heeft je gedood...
items.armor.glyphs.viscosity$defereddamage.rankings_desc=Gedood door uitgestelde schade
items.armor.glyphs.viscosity$defereddamage.desc=Schade wordt langzaam over tijd uitgedeeld, in plaats van in een keer.\n\nResterende uitgestelde schade: %d.
items.armor.glyphs.viscosity.desc=Dit symbool maakt het mogelijk om schade aan de drager op te slaan en deze langzaam in plaats van in één keer toe te dienen.



###armor
items.armor.armor.ac_detach=MAAK LOS
items.armor.armor.detach_seal=Je hebt het zegel van je harnas gehaald.
items.armor.armor.equip_cursed=Het harnas trekt zich pijnlijk strak om je heen.
items.armor.armor.identify=Je draagt je harnas nu lang genoeg om het te identificeren.
items.armor.armor.hardening_gone=De verharding van dit harnas is uitgewerkt!
items.armor.armor.incompatible=Interactie van verschillende soorten magie heeft het symbool op dit harnas gewist!
items.armor.armor.curr_absorb=Dit _klasse-%1$d_ harnas blokkeert _%2$d-%3$d schade_ en vereist _%4$d kracht_ om goed gebruikt te worden.
items.armor.armor.avg_absorb=Normaal gesproken blokkeert dit _klasse-%1$d_ harnas _%2$d-%3$d schade_ en vereist _%4$d kracht_ om goed gebruikt te worden.
items.armor.armor.too_heavy=Omdat je niet genoeg kracht hebt om dit harnas te dragen, kun je minder makkelijk bewegen, ontwijken en verdedigen.
items.armor.armor.probably_too_heavy=Waarschijnlijk is dit harnas te zwaar voor je.
items.armor.armor.excess_str=Omdat je zo sterk bent, kun je aanvallen _beter ontwijken_ als je dit harnas draagt.
items.armor.armor.evasion=Het is aangepast om het _ontwijken_ te verbeteren.
items.armor.armor.defense=Het is aangepast om je _verdediging_ te verbeteren.
items.armor.armor.inscribed=het is beschreven met een _%s._
items.armor.armor.glyph_hardened=Het is _verhard._
items.armor.armor.hardened_no_glyph=Dit harnas is _verhard,_ maar is momenteel niet voorzien van een symbool.
items.armor.armor.cursed_worn=Omdat dit harnas vervloekt is ben je machteloos om het te uit te trekken.
items.armor.armor.cursed=Je voelt een kwaadaardige magie in dit harnas schuilen.
items.armor.armor.weak_cursed=Ondanks de vloek ben je in staat om dit harnas uit te trekken.
items.armor.armor.not_cursed=Dit harnas is vrij van kwaadaardige magie.
items.armor.armor.seal_attached=Het gebroken zegel van de Krijger is aan dit harnas vastgemaakt, Wanneer zijn gezondheid onder de helft dreigt te dalen, zal het hem _%d bescherming_ geven.
items.armor.armor.seal_transfer=Het gebroken zegel van de Krijger moet worden bevestigd aan zijn momenteel gedragen pantser om hem te helpen. Wil je het zegel automatisch losmaken van het pantser dat je verwijdert en bevestigen aan het pantser dat je aan het uitrusten bent?
items.armor.armor.seal_transfer_yes=ja
items.armor.armor.seal_transfer_no=nee
items.armor.armor$glyph.glyph=symbool
items.armor.armor$glyph.killed=%s doodde je...
items.armor.armor$glyph.rankings_desc=Gedood door een magisch symbool
items.armor.armor$glyph.discover_hint=Je kunt een item met dit effect zomaar in de kerker vinden, of probeer het zelf op een item toe te passen.

items.armor.classarmor.ac_ability=KIES SPECIALE KRACHT
items.armor.classarmor.ac_transfer=OVERDRAGEN
items.armor.classarmor.no_ability=Je harnas heeft momenteel geen speciale kracht, je moet er één kiezen!
items.armor.classarmor.not_equipped=Je moet dit harnas dragen om zijn speciale kracht te gebruiken!
items.armor.classarmor.low_charge=Dit harnas is niet genoeg opgeladen om zijn speciale kracht te gebruiken.
items.armor.classarmor.charge_use=Als je de speciale kracht nu gebruikt kost dit _%s_ lading.
items.armor.classarmor.transfer_title=Harnas Overdragen
items.armor.classarmor.transfer_desc=De magie van de kroon van de dwergenkoning kan worden overgebracht naar een ander harnas. Merk op dat het originele harnas tijdens het proces wordt vernietigd.
items.armor.classarmor.transfer_prompt=Kies een Harnas
items.armor.classarmor.transfer_cancel=Annuleren
items.armor.classarmor.transfer_complete=De eigenschappen van je heroïsche harnas zijn overgedragen!
items.armor.classarmor.discover_hint=Dit voorwerp vind je nadat je de baas op verdieping 20 met een specifieke held hebt verslagen.

items.armor.clericarmor.name=heldenparament
items.armor.clericarmor.desc=Terwijl de Geestelijke dit mengsel van stof en plaat draagt, kan hij een speciale vaardigheid uitoefenen.

items.armor.clotharmor.name=stoffen kleding
items.armor.clotharmor.desc=Dit lichte harnas biedt basisbescherming.
items.armor.clotharmor.discover_hint=Een van de helden begint met dit voorwerp.

items.armor.duelistarmor.name=heldenborstplaat
items.armor.duelistarmor.desc=Tijdens het dragen van dit plaatharnas en deze cape, kan de Duellist een speciale vaardigheid uitvoeren.

items.armor.huntressarmor.name=heldenmantel
items.armor.huntressarmor.no_enemies=Geen vijanden in zicht
items.armor.huntressarmor.desc=Tijdens het dragen van deze mantel kan de Jaagster een speciale vaardigheid uitvoeren.

items.armor.leatherarmor.name=leren harnas
items.armor.leatherarmor.desc=Harnas gemaakt van gelooide monsterhuid. Het is niet zo licht als stoffen kleding, maar het geeft meer bescherming.

items.armor.magearmor.name=heldengewaad
items.armor.magearmor.desc=Als hij dit prachtige gewaad draagt, kan de Magiër een speciale vaardigheid uitvoeren.

items.armor.mailarmor.name=maliënkolder
items.armor.mailarmor.desc=In elkaar grijpende metalen schakels zorgen voor een stevig maar flexibel harnas.

items.armor.platearmor.name=plaatharnas
items.armor.platearmor.desc=Enorme platen van metaal zijn vastgemaakt tot een harnas dat ongeëvenaarde bescherming biedt aan elke avonturier die sterk genoeg is om zijn duizelingwekkende gewicht te dragen.

items.armor.roguearmor.name=heldenkleding
items.armor.roguearmor.desc=Terwijl hij deze donkere kleding draagt, kan de Schurk een speciale vaardigheid uitvoeren.

items.armor.scalearmor.name=geschaald harnas
items.armor.scalearmor.desc=De metalen plaatjes die op een leren vest zijn genaaid, maken een flexibel, maar beschermend harnas.

items.armor.warriorarmor.name=heldenplaatpantser
items.armor.warriorarmor.desc=Terwijl hij dit zware platenharnas draagt, kan de Krijger een speciale vaardigheid uitvoeren.



###artifacts
items.artifacts.alchemiststoolkit.name=gereedschapsset van de alchemist
items.artifacts.alchemiststoolkit.ac_brew=BROUW
items.artifacts.alchemiststoolkit.ac_energize=BEKRACHTIG
items.artifacts.alchemiststoolkit.not_ready=Je gereedschapsset is nog niet klaar met opwarmen.
items.artifacts.alchemiststoolkit.cursed=Je vervloekte gereedschapsset houdt tegen dat je alchemie gebruikt!
items.artifacts.alchemiststoolkit.need_energy=Daar heb je minimaal 6 energie voor nodig.
items.artifacts.alchemiststoolkit.energize_desc=Elke 6 energiekristallen geven de gereedschapsset voldoende energie om een volgend niveau te bereiken, waardoor de snelheid van het genereren van energie en het opwarmen van de gereedsschapsset toeneemt.\n\nHoeveel energie wil je gebruiken?
items.artifacts.alchemiststoolkit.energize_1=6 energie: +1 niveau
items.artifacts.alchemiststoolkit.energize_all=%1$d energie: +%2$d niveaus
items.artifacts.alchemiststoolkit.desc=Deze gereedschapsset bevat een aantal reactiestoffen en kruiden samen met een kleine mengflacon, waardoor het toepassen van alchemie overal mogelijk is. Het flesje bevat iets wat lijkt op alchemistische energiekristallen in vloeibare vorm.
items.artifacts.alchemiststoolkit.desc_cursed=De vervloekte gereedschapsset heeft zich aan jou gebonden, en weerhoudt je ervan om alchemie toe te passen.
items.artifacts.alchemiststoolkit.desc_warming=De gereedschapsset is momenteel aan het opwarmen en is na een tijdje klaar voor gebruik.
items.artifacts.alchemiststoolkit.desc_hint=De gehanteerde gereedschapsset genereert langzaam alchemistische energie terwijl je ervaring opdoet. Het lijkt erop dat het mengsel in de mengflacon verbeterd kan worden door er energiekristallen aan toe te voegen.

items.artifacts.artifact.cannot_wear_two=Je kan niet twee dezelfde artefacten dragen.
items.artifacts.artifact.equip_cursed=Het artefact bindt zich pijnlijk aan je vast.
items.artifacts.artifact.curse_known=Je voelt dat er kwaadaardige magie in dit artefact schuilt.
items.artifacts.artifact.not_cursed=Dit artefact is vrij van kwaadaardige energie.
items.artifacts.artifact.need_to_equip=Je moet je artefact hanteren om dat te doen.

items.artifacts.capeofthorns.name=mantel van doornen
items.artifacts.capeofthorns.desc=Deze in elkaar geschoven metalen platen van de DM-300 hebben samen een stevige mantel gevormd. Het lijkt een diepe energie op te slaan, misschien heeft het iets van de kracht van de DM-300?
items.artifacts.capeofthorns.desc_inactive=De mantel voelt geruststellend zwaar op je schouders, hij lijkt energie te krijgen van de schade die je oploopt.
items.artifacts.capeofthorns.desc_active=De mantel lijkt opgeslagen energie vrij te geven, hij straalt een beschermende kracht uit.
items.artifacts.capeofthorns$thorns.inert=Je mantel wordt weer inactief.
items.artifacts.capeofthorns$thorns.radiating=Je mantel begint energie uit te stralen, je voelt je beschermd!
items.artifacts.capeofthorns$thorns.levelup=Je mantel wordt sterker!
items.artifacts.capeofthorns$thorns.name=doornen
items.artifacts.capeofthorns$thorns.desc=Je mantel straalt energie uit en omringt je in een veld van beschermende kracht!\n\nAlle schade die je ontvangt wordt verminderd terwijl het doorneneffect actief is. Bovendien, als de aanvaller naast je staat, wordt de verminderde schade teruggestuurd naar de aanvaller.\n\nResterende beurten doornenmantel: %s.

items.artifacts.chaliceofblood.name=kelk van bloed
items.artifacts.chaliceofblood.ac_prick=PRIK
items.artifacts.chaliceofblood.yes=Ja, ik weet wat ik doe
items.artifacts.chaliceofblood.no=Nee, ik heb me bedacht
items.artifacts.chaliceofblood.prick_warn=Elke keer dat je de kelk gebruikt, zal deze meer levensenergie verbruiken, maar in ruil daarvoor zal je natuurlijke gezondheidsregeneratie verder toenemen.\n\nJezelf prikken zal momenteel _%1$dü%2$dschade_ aanrichten, hoewel deze schade kan worden verminderd door _zowel fysieke als magische blokkering of schadevermindering._ Zonder rekening te houden met de effecten van schadevermindering, bestaat er een _%3$s%%kans_ dat je levensenergie volledig wordt verbruikt als je jezelf prikt.\n\nWeet je zeker dat je de kelk meer levensenergie wilt geven?
items.artifacts.chaliceofblood.onprick=Je prikt jezelf, en je levensessentie loopt weg in de kelk.
items.artifacts.chaliceofblood.ondeath=De Kelk zuigt je levensessentie compleet op...
items.artifacts.chaliceofblood.desc=Deze glanzende zilveren kelk is vreemd versierd met scherpe edelstenen aan de rand.
items.artifacts.chaliceofblood.desc_cursed=Deze vervloekte kelk is vergroeid met je hand en hindert je vermogen om vanzelf gezond te worden.
items.artifacts.chaliceofblood.desc_1=Terwijl je de kelk vasthoudt, voel je je vreemd genoeg gedwongen om jezelf aan de scherpe edelstenen te prikken.
items.artifacts.chaliceofblood.desc_2=Een deel van je bloed verzamelt zich in de kelk, je voelt subtiel hoe de kelk je voedt met levensenergie, wat je natuurlijke gezondheidsherstel bevordert. Je wilt jezelf nog steeds aan de kelk snijden, ook al weet je dat het pijn zal doen.
items.artifacts.chaliceofblood.desc_3=De kelk is tot de rand gevuld met je levensessentie. Je kunt voelen dat de kelk de levensenergie in je laat terugstromen.

items.artifacts.cloakofshadows.name=schaduwmantel
items.artifacts.cloakofshadows.ac_stealth=SLUIP
items.artifacts.cloakofshadows.cooldown=Je mantel heeft %d beurten nodig om nieuwe energie op te doen.
items.artifacts.cloakofshadows.cursed=Je kunt geen vervloekte mantel gebruiken.
items.artifacts.cloakofshadows.no_charge=Je mantel is nog niet voldoende opgeladen om bruikbaar te zijn.
items.artifacts.cloakofshadows.desc=Een onschatbare magische mantel, vele jaren geleden gestolen uit het koninklijk arsenaal door de Schurk. Tijdens het dragen wordt de drager voor een korte tijd volledig onzichtbaar.\n\nHoe meer de mantel wordt gebruikt, hoe sterker deze wordt, waardoor de Schurk vaker en voor langere tijd onzichtbaar wordt.
items.artifacts.cloakofshadows.discover_hint=Een van de helden begint met dit voorwerp.
items.artifacts.cloakofshadows$cloakstealth.no_charge=Je mantel heeft geen energie meer.
items.artifacts.cloakofshadows$cloakstealth.levelup=Je mantel wordt sterker!
items.artifacts.cloakofshadows$cloakstealth.name=verhuld
items.artifacts.cloakofshadows$cloakstealth.desc=Je schaduwmantel verleent je onzichtbaarheid terwijl je erdoor gehuld bent. Je blijft verhuld totdat je het zelf opheft of totdat je mantel geen lading meer heeft.\n\nTerwijl je onzichtbaar bent kunnen vijanden je niet aanvallen of volgen. Fysieke aanvallen en magische effecten (zoals rollen en toverstokken) zullen de onzichtbaarheid onmiddellijk opheffen.\n\nBeurten tot de lading van de mantel leeg is: %d

items.artifacts.driedrose.name=gedroogde roos
items.artifacts.driedrose.ac_summon=ROEP OP
items.artifacts.driedrose.ac_direct=STUUR AAN
items.artifacts.driedrose.ac_outfit=RUST UIT
items.artifacts.driedrose.spawned=Je hebt de geest al opgeroepen.
items.artifacts.driedrose.no_charge=Je roos is nog niet volledig opgeladen.
items.artifacts.driedrose.cursed=Je kunt geen vervloekte roos gebruiken.
items.artifacts.driedrose.no_space=Er is geen vrije plaats naast jou.
items.artifacts.driedrose.charged=Je roos is volledig opgeladen!
items.artifacts.driedrose.desc=Is dit de roos die de geest noemde voordat hij verdween? Het lijkt spirituele kracht te bevatten, misschien kan het worden gebruikt om de energie van die verloren krijger te kanaliseren.
items.artifacts.driedrose.desc_no_quest=Een gedroogde, verouderde roos die ondanks zijn leeftijd nog steeds bij elkaar blijft.\n\nHet lijkt een spirituele kracht te hebben, maar je hebt geen idee hoe je het nu moet gebruiken.
items.artifacts.driedrose.desc_hint=Het lijkt erop dat er enkele bloembladen ontbreken. Misschien versterkt het opnieuw bevestigen van de bladen de roos.
items.artifacts.driedrose.desc_cursed=De vervloekte roos is aan je hand gebonden, het voelt akelig koud aan.
items.artifacts.driedrose.desc_weapon=Geest's wapen: %s
items.artifacts.driedrose.desc_armor=Geest's harnas:  %s
items.artifacts.driedrose.desc_strength=Geest's kracht: %s
items.artifacts.driedrose$petal.name=gedroogd bloemblad
items.artifacts.driedrose$petal.no_rose=Je hebt geen roos om dit bloemblad aan toe te voegen.
items.artifacts.driedrose$petal.no_room=Er is geen ruimte meer voor dit bloemblad, dus je gooit het weg.
items.artifacts.driedrose$petal.maxlevel=De roos is compleet!
items.artifacts.driedrose$petal.levelup=Je voegt het bloemblad toe aan de roos.
items.artifacts.driedrose$petal.desc=Een zwak opgedroogd bloemblad, dat het op de een of andere manier zo diep in de kerker heeft overleefd.
items.artifacts.driedrose$wndghosthero.title=Uitrusting van de Geest
items.artifacts.driedrose$wndghosthero.desc=De geest is op zichzelf zwak, maar hun vorm is stevig genoeg om te worden uitgerust met een wapen en harnas. Zij kunnen deze voorwerpen net als jij gebruiken.\n\nDe geest kan momenteel voorwerpen hanteren die tot _%d sterkte nodig hebben._
items.artifacts.driedrose$wndghosthero.weapon_prompt=Kies een wapen
items.artifacts.driedrose$wndghosthero.armor_prompt=Kies een harnas
items.artifacts.driedrose$wndghosthero.cant_unique=De geest kan geen unieke voorwerpen gebruiken.
items.artifacts.driedrose$wndghosthero.cant_cursed=De geest kan alleen uitrusting gebruiken waarvan je zeker bent dat het niet vervloekt is.
items.artifacts.driedrose$wndghosthero.cant_strength_unknown=Het kan zijn dat de geest niet sterk genoeg is om dat te gebruiken.
items.artifacts.driedrose$wndghosthero.cant_strength=De geest is niet sterk genoeg om dat te gebruiken.

##ghost hero
items.artifacts.driedrose$ghosthero.name=droevige geest
items.artifacts.driedrose$ghosthero.def_verb=ontweken
items.artifacts.driedrose$ghosthero.discover_hint=Je kunt dit personage met een specifiek artefact vinden.

items.artifacts.driedrose$ghosthero.hello=Welkom terug %s.
items.artifacts.driedrose$ghosthero.introduce=Mijn geest is verbonden met deze roos, hij was erg kostbaar voor mij, een geschenk van mijn liefde die ik aan de oppervlakte heb achtergelaten.\n\nIk kan niet naar hem terugkeren, maar dankzij jou heb ik een tweede kans om mijn reis te voltooien. Als ik voldoende sterk ben reageer ik op je oproepen en met je vechten.\n\nZolang je de roos hebt, kan ik je stem horen, dus je kunt hem gebruiken om me van ver te sturen.\n\nHopelijk lukt het jou waar ik faalde...

items.artifacts.driedrose$ghosthero.dialogue_sewers_1=Vroeger waren deze riolen veilig, hier woonden zelfs 's winters mensen.
items.artifacts.driedrose$ghosthero.dialogue_sewers_2=Ik vraag me af wat er met de bewakingspatrouilles is gebeurd, hebben ze het opgegeven?
items.artifacts.driedrose$ghosthero.dialogue_sewers_3=Ik had familie aan de oppervlakte, ik hoop dat ze veilig zijn.
items.artifacts.driedrose$ghosthero.dialogue_sewers_4=De bewakers konden deze monsters niet verslaan, maar misschien kunnen wij dat wel.
items.artifacts.driedrose$ghosthero.dialogue_sewers_5=Als zelfs de riolen zo gevaarlijk zijn, vraag ik me af wat er beneden is...
items.artifacts.driedrose$ghosthero.dialogue_sewers_6=Wat kan ervoor gezorgd hebben dat deze ratten en krabben zo groot zijn geworden?
items.artifacts.driedrose$ghosthero.dialogue_prison_1=Ik heb verhalen gehoord over deze plek, geen goede verhalen.
items.artifacts.driedrose$ghosthero.dialogue_prison_2=Deze plaats was altijd meer een kerker dan een gevangenis.
items.artifacts.driedrose$ghosthero.dialogue_prison_3=Ik kan me niet voorstellen wat er gebeurde toen deze plek werd verlaten.
items.artifacts.driedrose$ghosthero.dialogue_prison_4=Het lijkt erop dat zowel de gevangenen als de bewakers in monsters zijn veranderd.
items.artifacts.driedrose$ghosthero.dialogue_prison_5=Wat zou verantwoordelijk zijn voor al deze skeletten?
items.artifacts.driedrose$ghosthero.dialogue_prison_6=Deze mensen hoefden niet zo te eindigen...
items.artifacts.driedrose$ghosthero.dialogue_caves_1=Er is hier al heel lang geen mens of dwerg meer geweest.
items.artifacts.driedrose$ghosthero.dialogue_caves_2=Wat zou de dwergen ertoe brengen een goudmijn te verlaten?
items.artifacts.driedrose$ghosthero.dialogue_caves_3=Het is jammer dat al het goud hier nutteloos is aan de oppervlakte.
items.artifacts.driedrose$ghosthero.dialogue_caves_4=De wezens hier zijn verdorven, net als in de riolen.
items.artifacts.driedrose$ghosthero.dialogue_caves_5=Zelfs de vleermuizen zijn hier bloeddorstig.
items.artifacts.driedrose$ghosthero.dialogue_caves_6=Geen spoor van mijnuitrusting, hebben de dwergen alles meegenomen?
items.artifacts.driedrose$ghosthero.dialogue_city_1=De dwergen waren ijverig, maar hebzuchtig.
items.artifacts.driedrose$ghosthero.dialogue_city_2=Dus, de dwergenmetropool is echt gevallen.
items.artifacts.driedrose$ghosthero.dialogue_city_3=Ik hoop dat de oppervlakte nooit zo eindigt als deze plek.
items.artifacts.driedrose$ghosthero.dialogue_city_4=Dwergen horen er niet zo bleek uit te zien.
items.artifacts.driedrose$ghosthero.dialogue_city_5=Ik weet niet wat erger is: de dwergen, of hun creaties.
items.artifacts.driedrose$ghosthero.dialogue_city_6=Het lijkt erop dat de dwergen nu ook hersenloze monsters zijn.
items.artifacts.driedrose$ghosthero.dialogue_halls_1=Wat is dit voor plek?
items.artifacts.driedrose$ghosthero.dialogue_halls_2=Deze plek is angstaanjagend...
items.artifacts.driedrose$ghosthero.dialogue_halls_3=Wat dachten de dwergen, toen ze met deze krachten speelden?
items.artifacts.driedrose$ghosthero.dialogue_halls_4=De monsters hier zijn niet van deze aarde, waar komen ze vandaan?
items.artifacts.driedrose$ghosthero.dialogue_halls_5=Voel je het? Het is alsof iets ons in de gaten houdt.
items.artifacts.driedrose$ghosthero.dialogue_halls_6=Gelukkig zijn er fakkels, het is hier zo donker!
items.artifacts.driedrose$ghosthero.dialogue_ascension_1=Waarom gebeurt dit, ik dacht dat het ons was gelukt?
items.artifacts.driedrose$ghosthero.dialogue_ascension_2=Hoe kan dat ding deze wereld nog beïnvloeden?
items.artifacts.driedrose$ghosthero.dialogue_ascension_3=Ik hoop dat je weet wat je aan het doen bent met dat amulet.
items.artifacts.driedrose$ghosthero.dialogue_ascension_4=Ik denk dat we nog niet helemaal klaar zijn.
items.artifacts.driedrose$ghosthero.dialogue_ascension_5=We zijn al zo ver, we kunnen dit afmaken!
items.artifacts.driedrose$ghosthero.dialogue_ascension_6=Nog even verder, we komen hier wel uit!

items.artifacts.driedrose$ghosthero.seen_goo_1=Pas op Smurrie!
items.artifacts.driedrose$ghosthero.seen_goo_2=Veel van mijn vrienden stierven aan dit ding, tijd voor wraak!
items.artifacts.driedrose$ghosthero.seen_goo_3=Zo'n gruwel mag niet blijven bestaan!
items.artifacts.driedrose$ghosthero.seen_tengu_1=De enige overgebleven gevangene is een dodelijke moordenaar. Natuurlijk...
items.artifacts.driedrose$ghosthero.seen_tengu_2=Hij heeft ons opgesloten!
items.artifacts.driedrose$ghosthero.seen_tengu_3=Ik heb horrorverhalen gehoord over dat masker...
items.artifacts.driedrose$ghosthero.seen_dm300_1=Alleen dwergen zouden een mijnbouwmachine bouwen die indringers doodt.
items.artifacts.driedrose$ghosthero.seen_dm300_2=Dat ding is enorm...
items.artifacts.driedrose$ghosthero.seen_dm300_3=Hoe is dit ding zo lang actief gebleven?
items.artifacts.driedrose$ghosthero.seen_king_1=Als mensen zeggen dat macht corrumpeert, bedoelen ze dit.
items.artifacts.driedrose$ghosthero.seen_king_2=Hij is nu meer een kadaver dan een koning.
items.artifacts.driedrose$ghosthero.seen_king_3=Zelfs in de dood gehoorzamen de dwergen hun meester.
items.artifacts.driedrose$ghosthero.seen_yog_1=Oh, dit ziet er niet goed uit.
items.artifacts.driedrose$ghosthero.seen_yog_2=Dus zo ziet een god eruit?
items.artifacts.driedrose$ghosthero.seen_yog_3=Dit gaat pijn doen...

items.artifacts.driedrose$ghosthero.defeated_by_enemy_1=Veel geluk...
items.artifacts.driedrose$ghosthero.defeated_by_enemy_2=Moe... voorlopig...
items.artifacts.driedrose$ghosthero.defeated_by_enemy_3=Ik keer terug...
items.artifacts.driedrose$ghosthero.defeated_by_boss_1=Het spijt me... veel succes...
items.artifacts.driedrose$ghosthero.defeated_by_boss_2=Maak het af... zonder mij...
items.artifacts.driedrose$ghosthero.defeated_by_boss_3=Nee... ik kan het niet...
items.artifacts.driedrose$ghosthero.blessed_ankh_1=Hoe heb je dat overleefd?
items.artifacts.driedrose$ghosthero.blessed_ankh_2=Ik wou dat ik er zo een had...
items.artifacts.driedrose$ghosthero.blessed_ankh_3=Wow! Je leeft nog!
items.artifacts.driedrose$ghosthero.player_killed_1=Nee!...
items.artifacts.driedrose$ghosthero.player_killed_2=Ik kon ze niet helpen...
items.artifacts.driedrose$ghosthero.player_killed_3=Niet zoals dit...

items.artifacts.driedrose$ghosthero.direct_prompt=Wat moet ik doen?
items.artifacts.driedrose$ghosthero.directed_follow_1=Oké, ik volg je.
items.artifacts.driedrose$ghosthero.directed_follow_2=Ik volg je.
items.artifacts.driedrose$ghosthero.directed_follow_3=Ik volg je...
items.artifacts.driedrose$ghosthero.directed_follow_4=Oke, laten we gaan!
items.artifacts.driedrose$ghosthero.directed_follow_5=Ik geef je rugdekking.
items.artifacts.driedrose$ghosthero.directed_attack_1=Oké, ik val die aan.
items.artifacts.driedrose$ghosthero.directed_attack_2=Ik pak die aan.
items.artifacts.driedrose$ghosthero.directed_attack_3=Aanvallen...
items.artifacts.driedrose$ghosthero.directed_attack_4=Laten we ze aanpakken!
items.artifacts.driedrose$ghosthero.directed_attack_5=Die is voor mij.
items.artifacts.driedrose$ghosthero.directed_position_1=Oké, ik verdedig die positie.
items.artifacts.driedrose$ghosthero.directed_position_2=Ik ga erheen om te verdedigen.
items.artifacts.driedrose$ghosthero.directed_position_3=Herpositioneren...
items.artifacts.driedrose$ghosthero.directed_position_4=Ik ben onderweg!
items.artifacts.driedrose$ghosthero.directed_position_5=Ik ga erheen.

items.artifacts.driedrose$ghosthero.desc=Een fragiel ogend etherische schim met een menselijke vorm. Zijn kracht lijkt verbonden met de roos die je hebt.\n\nDeze geest stelt misschien niet veel voor, toch lijkt het je enige echte vriend hier beneden te zijn.

##back to artifacts
items.artifacts.etherealchains.name=etherische kettingen
items.artifacts.etherealchains.ac_cast=WERP UIT
items.artifacts.etherealchains.rooted=Je kettingen kunnen je niet trekken terwijl je geworteld bent.
items.artifacts.etherealchains.no_charge=Je kettingen zijn niet genoeg opgeladen.
items.artifacts.etherealchains.cursed=Je kunt geen vervloekte kettingen gebruiken.
items.artifacts.etherealchains.does_nothing=Dat haalt niets uit.
items.artifacts.etherealchains.cant_pull=Je kettingen kunnen dat doel niet trekken.
items.artifacts.etherealchains.cant_reach=Je kettingen kunnen daar niet komen.
items.artifacts.etherealchains.inside_wall=Je kettingen kunnen je alleen door muren trekken, niet erin.
items.artifacts.etherealchains.nothing_to_grab=Er valt daar niets te pakken.
items.artifacts.etherealchains.prompt=Kies een plek als doelwit.
items.artifacts.etherealchains.desc=Deze grote maar lichtgewicht kettingen gloeien van spirituele energie. Ze kunnen worden gebruikt om je naar terrein te trekken, of om vijanden naar je toe te trekken. Door de etherische aard van de kettingen kunnen ze zelfs door muren heen gaan!
items.artifacts.etherealchains.desc_cursed=De vervloekte kettingen zijn aan je zijde vastgeklonken. Ze zwaaien constant rond, proberen je te laten struikelen of je vast te binden.
items.artifacts.etherealchains.desc_equipped=De ketting rust rond je heup, en hevelt langzaam de spirituele energie over van degene die je verslaat. Elke lading is één schakel in de ketting, die zich er precies één tegel mee uitstrekt.
items.artifacts.etherealchains$chainsrecharge.levelup=Je kettingen worden sterker!

items.artifacts.holytome.name=heilig boek
items.artifacts.holytome.ac_cast=SPREEK UIT
items.artifacts.holytome.no_spell=Je kunt die spreuk nu niet uitspreken.
items.artifacts.holytome.cursed=Je kunt geen vervloekt boek gebruiken.
items.artifacts.holytome.levelup=Je boek wordt sterker!
items.artifacts.holytome.desc=Een heilig boek dat fungeert als focus voor de goddelijke magie van de Geestelijke. Door het boek te gebruiken, kan de Geestelijke verschillende magische spreuken uitspreken.\n\nHet boek zal gestaag krachtiger worden naarmate de Geestelijke het gebruikt, waardoor de Geestelijke meer maximale ladingen krijgt en de oplaadsnelheid iets toeneemt.
items.artifacts.holytome.discover_hint=Een van de helden begint met dit voorwerp.

items.artifacts.hornofplenty.name=Hoorn van overvloed
items.artifacts.hornofplenty.ac_snack=SNACK
items.artifacts.hornofplenty.ac_eat=EET
items.artifacts.hornofplenty.ac_store=SLA OP
items.artifacts.hornofplenty.eat=Je eet uit de hoorn.
items.artifacts.hornofplenty.prompt=Kies wat eten
items.artifacts.hornofplenty.no_food=Je hoorn bevat geen voedsel om te eten!
items.artifacts.hornofplenty.full=Je hoorn zit vol met eten!
items.artifacts.hornofplenty.reject=Je hoorn wijst het ongekookte flauwfruit af.
items.artifacts.hornofplenty.maxlevel=Je hoorn kan niet meer voedsel verorberen!
items.artifacts.hornofplenty.levelup=De hoorn verorbert je voedseloffer en groeit in kracht!
items.artifacts.hornofplenty.feed=De hoorn verorbert je voedseloffer.
items.artifacts.hornofplenty.desc=In deze hoorn kan niet worden geblazen, maar in plaats daarvan lijkt het zich te vullen met voedsel terwijl je op avontuur gaat en ervaring opdoet. Je kunt een deel van de inhoud consumeren als snack, of eten tot je vol zit.
items.artifacts.hornofplenty.desc_hint=Misschien is er een manier om de kracht van de hoorn te vergroten door hem voedselenergie te geven.
items.artifacts.hornofplenty.desc_cursed=De vervloekte hoorn heeft zich aan je zijde gebonden, het lijkt liever voedsel op te nemen dan het te produceren.

items.artifacts.lloydsbeacon.name=lloyd's baken
items.artifacts.lloydsbeacon.ac_zap=SCHIET
items.artifacts.lloydsbeacon.ac_set=STEL IN
items.artifacts.lloydsbeacon.ac_return=KEER TERUG
items.artifacts.lloydsbeacon.no_charge=Je baken heeft momenteel niet genoeg energie.
items.artifacts.lloydsbeacon.tele_fail=De teleportatiemagie mislukt.
items.artifacts.lloydsbeacon.prompt=Kies een plek om op te schieten.
items.artifacts.lloydsbeacon.levelup=Je baken wordt sterker!
items.artifacts.lloydsbeacon.preventing=De sterke magische uitstraling van deze plek verhindert dat je het lloyd's baken gebruikt!
items.artifacts.lloydsbeacon.creatures=Het paranormale aura van naburige wezens verhindert je op dit moment om het lloyd's baken te gebruiken.
items.artifacts.lloydsbeacon.return=Het lloyd's baken is met succes ingesteld op je huidige plek, nu kun je hier op elk moment terugkeren.
items.artifacts.lloydsbeacon.desc=Lloyd's baken is een ingewikkeld magisch apparaat dat de gebruiker controle geeft over teleportatiemagie. Het baken kan worden gebruikt om terug te keren naar een ingestelde plek, maar kan ook schoten van willekeurige teleportatiemagie afvuren zodra het is opgeladen door het te hanteren. Deze magie kan gericht zijn op een doelwit of op de gebruiker zelf.
items.artifacts.lloydsbeacon.desc_set=Dit baken was ergens ingesteld op verdieping %d van de kerker.

items.artifacts.masterthievesarmband.name=armband van de meesterdief
items.artifacts.masterthievesarmband.ac_steal=STEEL
items.artifacts.masterthievesarmband.no_charge=Je armband is niet voldoende opgeladen.
items.artifacts.masterthievesarmband.cursed=Je kunt geen vervloekte armband gebruiken.
items.artifacts.masterthievesarmband.full=Je armband is volledig opgeladen!
items.artifacts.masterthievesarmband.prompt=Kies een vijand om op te richten
items.artifacts.masterthievesarmband.no_target=Je moet je richten op een vijand die naast je staat.
items.artifacts.masterthievesarmband.steal_shopkeeper=Je kunt niet rechtstreeks van winkeliers stelen.
items.artifacts.masterthievesarmband.no_steal=Die vijand heeft niets te stelen.
items.artifacts.masterthievesarmband.stole_item=Je hebt een voorwerp gestolen: %s.
items.artifacts.masterthievesarmband.failed_steal=Het is je niet gelukt om iets te stelen.
items.artifacts.masterthievesarmband.level_up=Je armband wordt sterker!
items.artifacts.masterthievesarmband.desc=Deze paarsfluwelen armband draagt het merkteken van een meesterdief. Dit is niet jouw bezit, maar het behoorde waarschijnlijk ook niet toe aan de laatste gebruiker.
items.artifacts.masterthievesarmband.desc_cursed=De vervloekte armband is aan je pols gebonden en op de een of andere manier lijkt je buidel met goud langzaam lichter te worden...
items.artifacts.masterthievesarmband.desc_worn=Je voelt kracht opbouwen in de armband om je pols terwijl je ervaring opdoet. Je kunt deze kracht gebruiken om uit winkels te stelen of om vijanden te beroven!\n\nHet beroven van vijanden gebeurt onmiddellijk, desoriënteert ze even en geeft je de kans om de buit te pakken die ze hebben! Deze kracht is effectiever tegen onbewuste vijanden. Het meerdere keren beroven van dezelfde vijand geeft niet meer kans op buit.

items.artifacts.sandalsofnature.name=sandalen van de natuur
items.artifacts.sandalsofnature.name_1=schoenen van de natuur
items.artifacts.sandalsofnature.name_2=laarzen van de natuur
items.artifacts.sandalsofnature.name_3=scheenplaten van de natuur
items.artifacts.sandalsofnature.ac_feed=VOED
items.artifacts.sandalsofnature.ac_root=VERWORTEL
items.artifacts.sandalsofnature.prompt=Kies een zaad
items.artifacts.sandalsofnature.levelup=Je schoenen worden groter!
items.artifacts.sandalsofnature.absorb_seed=Het schoeisel absorbeert het zaad, ze lijken er gezonder van te worden.
items.artifacts.sandalsofnature.no_effect=Je moet eerst een zaadje aan je schoeisel voeren.
items.artifacts.sandalsofnature.low_charge=Daar heeft je schoeisel niet genoeg energie voor.
items.artifacts.sandalsofnature.prompt_target=Kies een plek
items.artifacts.sandalsofnature.out_of_range=Die plek is buiten bereik.
items.artifacts.sandalsofnature.desc_1=Wat in eerste instantie leek op sandalen gemaakt van touw, zijn eigenlijk twee planten! Ze lijken erg zwak en bleek, misschien moeten ze voedingsstoffen krijgen?
items.artifacts.sandalsofnature.desc_2=Het schoeisel is gegroeid en lijkt nu meer op twee op maat gemaakte schoenen. Er is weer wat kleur in ze teruggekeerd, misschien kunnen ze nog verder groeien?
items.artifacts.sandalsofnature.desc_3=De planten zijn weer gegroeid en lijken nu op een paar stevige laarzen gemaakt van schors. De planten lijken weer op krachten te zijn gekomen, maar misschien kunnen ze nog verder groeien?
items.artifacts.sandalsofnature.desc_4=De planten lijken hun maximale grootte te hebben bereikt, ze lijken op een paar gepantserde scheenplaten. De scheenplaten zijn diepbruin en lijken op een zeer stevige boom.
items.artifacts.sandalsofnature.desc_hint=Je voelt je meer verbonden met de natuur tijdens het dragen van dit artefact.
items.artifacts.sandalsofnature.desc_cursed=De vervloekte sandalen blokkeren elke afstemming op de natuur.
items.artifacts.sandalsofnature.desc_ability=Het schoeisel heeft de kleur van het laatste zaadje dat je ze hebt gegeven. Ze kunnen kort in de grond wortelen en het effect van die plant in een straal van 3 tegels produceren.\nZaadje: _%s_\nLading nodig: _%d%%_
items.artifacts.sandalsofnature.desc_seeds=Je hebt het schoeisel %d zaden gevoed.

items.artifacts.skeletonkey.name=skelettensleutel
items.artifacts.skeletonkey.ac_insert=INVOEGEN
items.artifacts.skeletonkey.cursed=Je kunt geen vervloekte loper gebruiken.
items.artifacts.skeletonkey.prompt=Kies een doel
items.artifacts.skeletonkey.invalid_target=Er valt daar niets te vergrendelen of ontgrendelen.
items.artifacts.skeletonkey.lock_no_space=Je kunt een personage niet in een deur opsluiten!
items.artifacts.skeletonkey.iron_charges=Voor het openen van een normaal slot is 1 lading nodig.
items.artifacts.skeletonkey.gold_charges=Om een gouden slot te openen heb je 2 ladingen nodig.
items.artifacts.skeletonkey.lock_charges=Om een deur op slot te doen zijn 2 ladingen nodig.
items.artifacts.skeletonkey.wall_charges=Voor het maken van een tijdelijke muur zijn 2 ladingen nodig.
items.artifacts.skeletonkey.crystal_charges=Om een kristallen slot te openen heb je 5 ladingen nodig.
items.artifacts.skeletonkey.wont_open=Om één of andere reden past de sleutel niet in het slot.
items.artifacts.skeletonkey.locked_with_key=Die deur werd met jouw loper op slot gedaan.
items.artifacts.skeletonkey.force_lock=Het slot is zonder je loper kapot gegaan. Je krijgt het open met geweld.
items.artifacts.skeletonkey.discard=Je gooit je overtollige sleutels weg.
items.artifacts.skeletonkey.levelup=Je loper wordt sterker!
items.artifacts.skeletonkey.desc=Een belangrijke sleutel met een kop in de vorm van een schedel. De tanden lijken elke keer anders als je ernaar kijkt.
items.artifacts.skeletonkey.desc_worn=Deze magische sleutel lijkt aan kracht te winnen naarmate je hem gebruikt in plaats van de gewone sleutels van de kerker. Hij kan in bijna alle sloten van de kerker worden gestoken om ze te openen of te sluiten, inclusief deuren die voorheen nooit op slot zaten.\n\nDe sleutel kan zelfs op een lege ruimte in alle windrichtingen of diagonale richting worden gebruikt om de lucht voor je te 'vergrendelen', waardoor een massieve muur van 3 tegels breed ontstaat die 10 beurten meegaat. Door de sleutel te vergrendelen, worden vijanden weggeduwd als er ruimte is.
items.artifacts.skeletonkey.desc_cursed=Het lijkt erop dat de vervloekte sleutel er actief alles aan doet om niet in een slot te passen. Hij zorgt er zelfs voor dat het moeilijk (maar niet onmogelijk) is om je andere sleutels te gebruiken.
items.artifacts.skeletonkey$keywall.desc=Op deze plek is door de loper een tijdelijke magische muur geplaatst.

items.artifacts.talismanofforesight.name=talisman van vooruitziende blik
items.artifacts.talismanofforesight.ac_scry=Kristalkijken
items.artifacts.talismanofforesight.low_charge=De talisman heeft minimaal 5% lading nodig om kristal te kijken.
items.artifacts.talismanofforesight.prompt=Kies een plek om een blik te werpen.
items.artifacts.talismanofforesight.levelup=Je Talisman wordt sterker!
items.artifacts.talismanofforesight.full_charge=Je Talisman is volledig opgeladen!
items.artifacts.talismanofforesight.desc=Een gladde steen met vreemde gravures erop. Je hebt het gevoel dat het alles om je heen in de gaten houdt, met aandacht voor alles wat verborgen is.
items.artifacts.talismanofforesight.desc_worn=Als je de talisman vasthoudt, heb je het gevoel dat je zintuigen geprikkeld worden. De talisman bouwt langzaam lading op naarmate de tijd verstrijkt en wanneer je verborgen deuren of vallen ontdekt.\n\nDe talisman kan zijn lading gebruiken om 'kristal te kijken' in een kegelvorm, wat alle tegels en geheimen in het bekeken gebied onthult, en je voor een korte tijd geestzicht op vijanden en voorwerpen geeft.
items.artifacts.talismanofforesight.desc_cursed=De vervloekte talisman staart je aandachtig aan en verdooft je zintuigen.
items.artifacts.talismanofforesight$foresight.name=vooruitziendheid
items.artifacts.talismanofforesight$foresight.uneasy=Je voelt je ongemakkelijk.
items.artifacts.talismanofforesight$foresight.desc=Je voelt je erg nerveus, alsof er dichtbij ongezien gevaar is.

items.artifacts.timekeepershourglass.name=zandloper van de tijdwaarnemer
items.artifacts.timekeepershourglass.ac_activate=ACTIVEER
items.artifacts.timekeepershourglass.deactivate=Je deactiveert de tijdbevriezing.
items.artifacts.timekeepershourglass.no_charge=Je zandloper is nog niet voldoende opgeladen om te kunnen gebruiken.
items.artifacts.timekeepershourglass.cursed=Je kunt geen vervloekte zandloper gebruiken.
items.artifacts.timekeepershourglass.onstasis=De wereld lijkt in een oogwenk om je heen te verschuiven.
items.artifacts.timekeepershourglass.onfreeze=Alles om je heen bevriest ineens.
items.artifacts.timekeepershourglass.stasis=Breng mezelf tot stilstand
items.artifacts.timekeepershourglass.freeze=Bevries de tijd om mij heen
items.artifacts.timekeepershourglass.prompt=Hoe wil je de magie van de zandloper gebruiken?\n\nWanneer je tot stilstand komt, beweegt de tijd normaal terwijl je bevroren en volledig onkwetsbaar bent, dit verbruikt tot 2 ladingen tegelijk.\n\nWanneer de tijd is bevroren, kun je bewegen alsof je acties geen tijd kosten. Dit kan op elk moment worden gedeactiveerd door de zandloper te gebruiken of aan te vallen.
items.artifacts.timekeepershourglass.desc=Deze grote sierlijke zandloper ziet er vrij bescheiden uit, maar je voelt een grote kracht in zijn fijn gesneden houtwerk. Terwijl je de zandloper draait en het zand ziet weglopen, voel je de magie aan je trekken - het gebruik van deze magie geeft je zeker enige controle over de tijd.
items.artifacts.timekeepershourglass.desc_hint=De zandloper lijkt wat zand te hebben verloren, als je maar wat kon vinden...
items.artifacts.timekeepershourglass.desc_cursed=De vervloekte zandloper zit aan je zijde vast, je kunt voelen dat hij je stroom van tijd probeert te manipuleren.
items.artifacts.timekeepershourglass$timefreeze.name=Tijd Bevriezen
items.artifacts.timekeepershourglass$timefreeze.desc=De tijd is bevroren om je heen, waardoor je acties direct kunt uitvoeren. Het effect houdt aan totdat het wordt afgebroken of totdat je zandloper leeg raakt. Door aan te vallen of magie te gebruiken, wordt dit effect ook verbroken.\n\nBeurten tot de zandloper leeg is: %s
items.artifacts.timekeepershourglass$sandbag.name=zakje met magisch zand
items.artifacts.timekeepershourglass$sandbag.levelup=Je voegt het zand toe aan je zandloper.
items.artifacts.timekeepershourglass$sandbag.maxlevel=Je zandloper is gevuld met magisch zand!
items.artifacts.timekeepershourglass$sandbag.no_hourglass=Je hebt geen zandloper om dit zand in te plaatsen.
items.artifacts.timekeepershourglass$sandbag.desc=Dit kleine zakje fijn zand zou perfect moeten werken met je zandloper.\n\nHet lijkt vreemd dat de winkelier dit specifieke voorwerp precies heeft wanneer je het nodig hebt...

items.artifacts.unstablespellbook.name=onstabiel spreukenboek
items.artifacts.unstablespellbook.ac_read=LEES
items.artifacts.unstablespellbook.ac_add=VOEG TOE
items.artifacts.unstablespellbook.blinded=Je kunt niet uit het boek lezen als je blind bent.
items.artifacts.unstablespellbook.no_charge=Je spreukenboek heeft geen lading meer over.
items.artifacts.unstablespellbook.cursed=Je kunt niet lezen uit een vervloekt spreukenboek.
items.artifacts.unstablespellbook.prompt=Kies een rol
items.artifacts.unstablespellbook.infuse_scroll=Je brengt de energie van de rol over in het boek.
items.artifacts.unstablespellbook.unable_scroll=Je kunt deze rol niet aan het boek toevoegen.
items.artifacts.unstablespellbook.unknown_scroll=Je weet nog niet zeker wat voor rol dit is.
items.artifacts.unstablespellbook.desc=Dit spreukenboek verkeert in een verrassend goede staat gezien zijn leeftijd. Het bruist en knettert als je de pagina's omslaat, woelend van onstabiele energie. Als je uit dit boek leest, is het niet te zeggen welke spreuk je uitvoert.
items.artifacts.unstablespellbook.desc_cursed=Het vervloekte boek heeft zich aan jou gebonden, het belemmert je vermogen om de meeste rollen te gebruiken.
items.artifacts.unstablespellbook.desc_index=Het boek is incompleet. De inhoudsopgave wijst momenteel naar de volgende blanco pagina's:
items.artifacts.unstablespellbook.desc_empowered=De rollen die je aan het boek hebt toegevoegd, gloeien van kracht. Je kunt de exotische versie van de effecten van deze rol kiezen, tegen een meerprijs.
items.artifacts.unstablespellbook.read_empowered=De rol die je aan het spreukenboek hebt toegevoegd, bruist van energie. Je kunt de reguliere of exotische versie van het effect van deze rol kanaliseren.\n\nAls je de exotische variant kiest, kost dat 2 ladingen in plaats van 1.



###bags
items.bags.bag.name=rugzak
items.bags.bag.discover_hint=Je kunt dit voorwerp in een winkel kopen.

items.bags.potionbandolier.name=toverdrank patroontas
items.bags.potionbandolier.desc=Deze dikke patroontas past om je borst als een sjerp, hij heeft veel geïsoleerde banden om drankjesflesjes, je waterzak of flesjes vloeibaar metaal vast te houden.\n\nIn deze patroontas worden je drankjes beschermd tegen de kou.

items.bags.scrollholder.name=rolhouder
items.bags.scrollholder.desc=Deze buisvormige container ziet eruit alsof hij de gereedschappen en kaarten van een astronoom zou bevatten, maar je rollen passen er net zo goed in. Er zijn zelfs een paar zijvakken waar spreukkristallen, mysterieuze stiften en mysterieus hars mooi in passen.\n\nDe houder ziet er niet erg ontvlambaar uit, waardoor je rollen zijn beschermd tegen vuur.

items.bags.velvetpouch.name=fluwelen buidel
items.bags.velvetpouch.desc=In deze kleine fluwelen buidel kun je allerlei kleine voorwerpen bewaren, zoals zaden, runenstenen en een aantal alchemie-ingrediënten.
items.bags.velvetpouch.discover_hint=Een van de helden begint met dit voorwerp.

items.bags.magicalholster.name=magische holster
items.bags.magicalholster.desc=Deze slanke holster is gemaakt van een exotische dierenhuid en beschikt over krachtige magie waardoor er een enorme hoeveelheid afstandswapens in kan worden opgeborgen.\n\nJe grijpt eenvoudig in de tas en pakt altijd het voorwerp dat je zoekt.\n\nVanwege de magie van de holster laden toverstokken iets sneller op en gaan werpwapens er iets langer in mee.



###bombs
items.bombs.arcanebomb.name=mysterieuze bom
items.bombs.arcanebomb.desc=Deze bom is doordrenkt met mysterieuze eigenschappen. Hij zal ontploffen in een krachtige explosie die lijkt de opgepompte aanval van Smurrie, en _%1$d-%2$d magische schade_ toebrengen aan alles binnen 2 tegels.
items.bombs.arcanebomb.discover_hint=Je kunt dit voorwerp maken met behulp van alchemie.

items.bombs.bomb.name=bom
items.bombs.bomb.ac_lightthrow=STEEK AAN & GOOI
items.bombs.bomb.snuff_fuse=Je dooft snel de lont van de bom.
items.bombs.bomb.ondeath=De explosie doodt je...
items.bombs.bomb.rankings_desc=Gedood door een explosie
items.bombs.bomb.desc=Een vrij zware zwarte buskruitbom. Een explosie van deze bom veroorzaakt _%1$d-%2$d schade_ aan alles wat ernaast ligt, en zal wat aangrenzend terrein of items vernietigen.
items.bombs.bomb.desc_fuse=Het lijkt erop dat de lont een paar beurten nodig heeft om op te branden als hij eenmaal is aangestoken.
items.bombs.bomb.desc_burning=De lont van de bom brandt op, blijf op afstand of doof hem!
items.bombs.bomb$doublebomb.name=twee bommen
items.bombs.bomb$doublebomb.desc=Een stapel van twee flinke buskruitbommen, zo te zien krijg je er één gratis!

items.bombs.firebomb.name=vuurbom
items.bombs.firebomb.desc=Deze bom is aangepast zodat hij in een groter gebied ontploft, _%1$d-%2$d schade_ aanricht en aanhoudende vlammen binnen 2 tegels verspreidt.
items.bombs.firebomb.discover_hint=Je kunt dit voorwerp maken met behulp van alchemie.

items.bombs.flashbangbomb.name=flitsbom
items.bombs.flashbangbomb.desc=Deze op maat gemaakte bom zal ontploffen in een explosie van licht, geluid en elektriciteit wanneer hij ontploft. Alles binnen 2 tegels zal _%1$d-%2$d schade_ oplopen van de explosie, nog eens 25%% schade door elektriciteit en 10 beurten verdoofd worden.
items.bombs.flashbangbomb.discover_hint=Je kunt dit voorwerp maken met behulp van alchemie.

items.bombs.frostbomb.name=vorstbom
items.bombs.frostbomb.desc=Deze bom is aangepast om in een groter gebied te ontploffen, waardoor er _%1$d-%2$d schade_ ontstaat en er een aanhoudende windvlaag van ijskoude lucht binnen 2 tegels ontstaat.
items.bombs.frostbomb.discover_hint=Je kunt dit voorwerp maken met behulp van alchemie.

items.bombs.holybomb.name=heilige bom
items.bombs.holybomb.desc=Deze bom is aangepast om te ontploffen met een flits van heilig licht in een groter gebied. Alles binnen 2 tegels zal _%1$d-%2$d schade_ oplopen van de explosie, en ondode of demonische vijanden zullen 50%% extra schade oplopen van het heilige licht.
items.bombs.holybomb.discover_hint=Je kunt dit voorwerp maken met behulp van alchemie.

items.bombs.noisemaker.name=lawaaimaker
items.bombs.noisemaker.desc=Deze op maat gemaakte bom maakt herhaaldelijk geluid als de lont op is. Wanneer iets de bom aanraakt, zal deze ontploffen en _%1$d-%2$d schade_ toebrengen aan alles binnen 2 tegels!
items.bombs.noisemaker.desc_burning=De lawaaimaker tikt weg, hij ontploft als er iets in de buurt komt!
items.bombs.noisemaker.discover_hint=Je kunt dit voorwerp maken met behulp van alchemie.

items.bombs.smokebomb.name=rookbom
items.bombs.smokebomb.desc=Deze bom is aangepast om een dikke gaswolk uit te spuwen en tegelijkertijd te exploderen. Hij zal _%1$d-%2$d schade_ aanrichten en verhullende mist verspreiden binnen 2 tegels.
items.bombs.smokebomb.discover_hint=Je kunt dit voorwerp maken met behulp van alchemie.

items.bombs.regrowthbomb.name=hergroeibom
items.bombs.regrowthbomb.desc=Deze op maat gemaakte bom zal overal binnen 3 tegels levengevende vloeistof spetteren in plaats van te exploderen. Het gebied dat door de explosie wordt geraakt, zal snel gras en planten laten groeien. Jijzelf en alle bondgenoten die door de explosie worden geraakt, zullen worden genezen alsof ze een genezend drankje hebben gedronken.
items.bombs.regrowthbomb.discover_hint=Je kunt dit voorwerp maken met behulp van alchemie.

items.bombs.shrapnelbomb.name=schervenbom
items.bombs.shrapnelbomb.desc=Deze bom is aangepast met stukjes metaal van de DM-300, die zullen fragmenteren en overal heen vliegen als hij ontploft, en _%1$d-%2$d schade_ aanrichten in een groot bereik rond de bom. Je kunt je beter ergens achter verschuilen als je het gebruikt...
items.bombs.shrapnelbomb.discover_hint=Je kunt dit voorwerp maken met behulp van alchemie.

items.bombs.woollybomb.name=wollige bom
items.bombs.woollybomb.desc=Deze op maat gemaakte bom zal een groot veld van magische schapen creëren na het exploderen. De explosie zal _%1$d-%2$d schade_ toebrengen aan alles binnen 2 tegels. De schapen zullen beweging blokkeren en heel lang blijven bestaan! De schapen zullen echter niet zo lang in de aanwezigheid van krachtige vijanden blijven, en kunnen handmatig eerder worden verdreven door interactie met hen.
items.bombs.woollybomb.discover_hint=Je kunt dit voorwerp maken met behulp van alchemie.

###food
items.food.berry.name=kerkerbes
items.food.berry.eat_msg=Die bes was lekker!
items.food.berry.desc=Deze kleine bes werd gevonden door de Jaagster tussen de begroeiing van de kerker. Het kan snel worden gegeten, geeft een kleine hoeveelheid verzadiging en misschien bevat het een bruikbaar zaadje!
items.food.berry.discover_hint=Je kunt dit item vinden door een specifiek heldentalent te gebruiken.

items.food.blandfruit.name=flauwfruit
items.food.blandfruit.cooked=gekookt flauwfruit
items.food.blandfruit.sunfruit=zonnefruit
items.food.blandfruit.rotfruit=rotfruit
items.food.blandfruit.earthfruit=aardfruit
items.food.blandfruit.blindfruit=blindfruit
items.food.blandfruit.firefruit=vuurfruit
items.food.blandfruit.icefruit=ijsfruit
items.food.blandfruit.fadefruit=vaagfruit
items.food.blandfruit.sorrowfruit=treurfruit
items.food.blandfruit.stormfruit=stormfruit
items.food.blandfruit.dreamfruit=magefruit
items.food.blandfruit.starfruit=sterrenfruit
items.food.blandfruit.swiftfruit=fluksfruit
items.food.blandfruit.raw=Je durft het niet rauw te eten.
items.food.blandfruit.desc=Het is nu zo droog en onbeduidend, dat het misschien zou verbeteren door het te stoven met een ander ingrediënt.
items.food.blandfruit.desc_cooked=De vrucht is tijdens het koken in de ketel opgezwollen en heeft zelfs de eigenschappen van het zaad waarmee hij gekookt was geabsorbeerd. Het heeft het effect van de toverdrank waarmee het zaad overeenkwam.
items.food.blandfruit.desc_eat=Het lijkt klaar om gegeten te worden!
items.food.blandfruit.desc_throw=Het lijkt nogal vluchtig, misschien is het het beste om het te gooien.
items.food.blandfruit$chunks.name=stukjes flauwfruit
items.food.blandfruit$chunks.desc=Het flauwfruit is geëxplodeerd bij de impact en laat enkele brokken achter.\n\nOok al zijn ze een beetje vuil geworden, deze grote brokken gekookt flauwfruit lijken perfect eetbaar.

items.food.chargrilledmeat.name=geflambeerd vlees
items.food.chargrilledmeat.desc=Het ziet er uit als een fatsoenlijke steak.
items.food.chargrilledmeat.discover_hint=Je kunt dit maken met een ander voedselproduct.

items.food.food.name=voedselrantsoen
items.food.food.ac_eat=EET
items.food.food.eat_msg=Dat voedsel smaakte heerlijk!
items.food.food.desc=Niets bijzonders: gedroogd vlees, wat koekjes - dat soort dingen.

items.food.frozencarpaccio.name=bevroren carpaccio
items.food.frozencarpaccio.invis=Je ziet je handen voor je ogen verdwijnen!
items.food.frozencarpaccio.hard=Je voelt je huid harder worden!
items.food.frozencarpaccio.refresh=Verfrissend!
items.food.frozencarpaccio.better=Je voelt je beter!
items.food.frozencarpaccio.desc=Het is een stuk bevroren rauw vlees. De enige manier om het te eten is door er dunne plakjes van te snijden. En op deze manier is het verrassend goed.
items.food.frozencarpaccio.discover_hint=Je kunt dit maken met een ander voedselproduct.

items.food.meatpie.name=vleestaart
items.food.meatpie.eat_msg=Dat eten smaakte ongelooflijk!
items.food.meatpie.desc=Een heerlijke taart gevuld met hartig vlees. Dit verzadigt je veel meer dan welke andere maaltijd ook.
items.food.meatpie.discover_hint=Je kunt dit voorwerp maken met behulp van alchemie.

items.food.mysterymeat.name=mysterieus vlees
items.food.mysterymeat.eat_msg=Dat eten smaakte... vreemd.
items.food.mysterymeat.hot=Ah, het is heet!!
items.food.mysterymeat.legs=Je kan je benen niet meer voelen!
items.food.mysterymeat.not_well=Je voelt je niet zo goed.
items.food.mysterymeat.stuffed=Je zit vol.
items.food.mysterymeat.desc=Eet op eigen risico!
items.food.mysterymeat.discover_hint=Je kunt dit voorwerp krijgen doordat bepaalde vijanden het laten vallen.
items.food.mysterymeat$placeholder.name=vlees

items.food.phantommeat.name=spookvlees
items.food.phantommeat.desc=Een grote, glinsterende, doorschijnende biefstuk, gesneden uit een spookpiranha. Dit magische vlees hoeft niet gekookt te worden en biedt naast een volledig verzadigingsgevoel een aantal defensieve voordelen. Wanneer het wordt gegeten, zal het onzichtbaarheid, schorshuid, enige genezing schenken en vele schadelijke effecten genezen.
items.food.phantommeat.discover_hint=Je kunt dit voorwerp krijgen doordat bepaalde vijanden het laten vallen.

items.food.pasty.name=pastei
items.food.pasty.fish_name=gestoomde vis
items.food.pasty.amulet_name=amulet van yendor?
items.food.pasty.egg_name=Paasei
items.food.pasty.rainbow_name=regenboog drankje
items.food.pasty.shattered_name=groene cake
items.food.pasty.pie_name=pompoentaart
items.food.pasty.vanilla_name=blauwe cake
items.food.pasty.cane_name=zuurstok
items.food.pasty.sparkling_name=sprankelend drankje
items.food.pasty.desc=Een authentieke pastei uit Cornish met een traditionele vulling van rundvlees en aardappel. Heerlijk!
items.food.pasty.fish_desc=Een hele gestoomde vis, op magische wijze bewaard op een bedje van groen. Het is traditie om rond deze tijd van het jaar wat vis te bewaren voor later, zodat je wat restjes overhoudt in plaats van alles in één keer op te eten.\n\nGelukkig nieuw maanjaar!
items.food.pasty.amulet_desc=Je hebt het eindelijk gevonden, het magische amulet van - wacht even, dit is gewoon een in folie verpakte chocolade die zo is gemaakt dat hij op het amulet lijkt! Het geeft je geen onbeperkte kracht, maar het zal je in ieder geval vullen en je een beetje artefactlading geven.\n\n1 April!
items.food.pasty.egg_desc=Een geweldig groot chocolade-ei, verpakt in kleurrijke gele folie. Er is genoeg chocolade om je te vullen, en de suiker kan je artefacten een klein beetje extra lading geven.\n\nVrolijk Pasen!
items.food.pasty.rainbow_desc=Dit kleurrijke drankje is een soort vloeibaar voedsel. Naast het stillen van je honger, bevat het ook een beetje magie die een aangrenzende niet-baas vijand zal kalmeren, waardoor ze tijdelijk aarzelen om tegen je te vechten.\n\nHappy Pride!
items.food.pasty.shattered_desc=Dit grote stuk vanillecake heeft kleurrijke hagelslag en groen glazuur. De taart is gemaakt om jarenlange ervaring te vieren, en zal je een klein deel van die ervaring schenken als je hem eet.\n\nShattered Pixel Dungeon werd voor het eerst uitgebracht op 5 augustus 2014. Gefeliciteerd met je verjaardag Shattered Pixel Dungeon!
items.food.pasty.pie_desc=Een heel groot stuk pompoentaart. De zoete en kruidige smaak zal je vullen en je een klein beetje genezing geven.\n\nFijne Halloween!
items.food.pasty.vanilla_desc=Dit grote stuk vanillecake heeft kleurrijke hagelslag en blauw glazuur. De taart is gemaakt om jarenlange ervaring te vieren, en zal je een klein deel van die ervaring schenken als je hem eet.\n\nDe originele Pixel Dungeon werd voor het eerst uitgebracht op 4 december 2012. Gefeliciteerd Pixel Dungeon!
items.food.pasty.cane_desc=Een enorm suikerzoet snoepgoed. Het is groot genoeg om je te vullen, en de suiker kan je toverstokken ook een klein beetje extra lading geven.\n\nPrettige Feestdagen!
items.food.pasty.sparkling_desc=Dit sprankelende drankje is een soort vloeibaar voedsel. Het stilt de honger en simuleert mousserende wijn, maar is niet echt alcoholisch. Het warme gevoel in je buik zorgt voor een beetje bescherming.\n\nGelukkig nieuwjaar!
items.food.pasty$fishleftover.name=visresten
items.food.pasty$fishleftover.eat_msg=Dat eten smaakte oké.
items.food.pasty$fishleftover.desc=Wat overtollige vis van je vorige maaltijd. Je kunt het op elk gewenst moment eten om een beetje honger te stillen.

items.food.smallration.name=klein voedselrantsoen
items.food.smallration.eat_msg=Dat eten smaakte oké.
items.food.smallration.desc=Het ziet eruit als een standaard voedselrantsoen maar dan kleiner.
items.food.smallration.discover_hint=Je kunt dit voorwerp in een winkel kopen.

items.food.stewedmeat.name=gestoofd vlees
items.food.stewedmeat.eat_msg=Dat eten smaakte oké.
items.food.stewedmeat.desc=Door het vlees te stoven, is het gereinigd van alle ziekten of parasieten. Het is veilig om te eten.
items.food.stewedmeat.discover_hint=Je kunt dit voorwerp maken met behulp van alchemie.

items.food.supplyration.name=bevoorradingsrantsoen
items.food.supplyration.desc=Dit rantsoen werd door en voor leden van het dievengilde in de kerker achtergelaten. Het is speciaal ontworpen om onderweg te worden gegeten en helpt bij algemeen bedrog.\n\nHoewel het je niet zoveel verzadigt als een normaal rantsoen, kan het snel worden gegeten, zorgt het voor een beetje directe genezing en zal het de lading van de schaduwenmantel van de Schurk herstellen.
items.food.supplyration.discover_hint=Je kunt dit item vinden door een specifiek heldentalent te gebruiken.



##journal items
items.journal.documentpage.name=gescheurde pagina
items.journal.documentpage.desc=Een enkele pagina, waarschijnlijk gescheurd uit een of ander boek. Je moet het oppakken om het te lezen.

items.journal.alchemypage.name=gescheurde alchemie boekpagina
items.journal.alchemypage.desc=Een gescheurde pagina uit een alchemiegids.\n\nDe meeste tekst is te klein om op afstand te lezen, maar je kunt de titel van de pagina wel onderscheiden:\n\n_"%s"_

items.journal.guidebook.name=boek van kerkermeesterschap
items.journal.guidebook.hint_mobile=Je gids heeft advies voor je! Tik op de knipperende dagboekknop rechtsboven om het te lezen.
items.journal.guidebook.hint_desktop=Je reisgids heeft advies voor je! Tik op de knipperende dagboekknop (%s) rechtsboven om het te lezen.
items.journal.guidebook.hint_status=Gids
items.journal.guidebook.desc=Een gidsboek voor avonturiers, hier achtergelaten door iemand die besloot dat avontuur niets voor hen was! Dit specifieke boek is magisch en kan avonturiers ertoe aanzetten een pagina op het juiste moment te lezen.\n\nOndanks die functie is het boek erg populair vanwege de grote woorden "Geen Paniek!" die in grote vriendelijke letters op de omslag is geschreven.

items.journal.guidepage.name=gescheurde gidspagina
items.journal.guidepage.desc=Een gescheurde pagina uit een avonturengids.\n\nDe meeste tekst is te klein om op afstand te lezen, maar je kunt de titel van de pagina wel onderscheiden:\n\n_"%s"_

items.journal.regionlorepage$sewers.name=versleten brief
items.journal.regionlorepage$sewers.desc=Het lijkt op een brief, geschreven op een vuil stuk papier. Je moet het oppakken om te kunnen lezen wat erop staat.

items.journal.regionlorepage$prison.name=versleten dagboekpagina
items.journal.regionlorepage$prison.desc=Een dagboekpagina, of een ander soort verslag, geschreven op een oud stuk papier. Het is beter bewaard gebleven dan de brieven die je in de riolen vond, maar je moet het nog steeds oppakken om het te lezen.

items.journal.regionlorepage$caves.name=oude logboekvermelding
items.journal.regionlorepage$caves.desc=Het lijkt op een aantekening in het logboek van een ontdekkingsreiziger, verrassend goed bewaard gebleven ondanks hoe oud het moet zijn. Pak het op om het te lezen.

items.journal.regionlorepage$city.name=verroeste tablet
items.journal.regionlorepage$city.desc=Een kleine verroeste metalen tablet met een magische boodschap erin geëtst. De letters zijn nog steeds duidelijk ondanks de leeftijd van het tablet, maar je moet het oppakken om het te lezen.

items.journal.regionlorepage$halls.name=gloeiende tablet
items.journal.regionlorepage$halls.desc=Een kleine zwarte tablet met gloeiende groene letters erin geëtst. De gloeiende letters vervagen op afstand tot een waas, je moet het oppakken om het te lezen.


###keys
items.keys.goldenkey.name=gouden sleutel
items.keys.goldenkey.desc=De inkepingen van deze gouden sleutel zijn klein en ingewikkeld. Misschien opent het een kist die op slot zit?

items.keys.crystalkey.name=Kristallen sleutel
items.keys.crystalkey.desc=De snijvlakken van deze kristallijne sleutel glinsteren in de duisternis. Misschien opent het iets van kristal?

items.keys.ironkey.name=ijzeren sleutel
items.keys.ironkey.desc=De tanden van deze oude ijzeren sleutel zijn goed versleten; zijn leren koord is gehavend door de leeftijd. Welke deur zou het kunnen openen?

items.keys.wornkey.name=versleten sleutel
items.keys.wornkey.desc=Deze sleutel is versleten en verkleurd, maar ziet er ernstig uit. Waarschijnlijk kan hij een serieuze deur in de buurt openen.



###potions
items.potions.potion.ac_drink=DRINK
items.potions.potion.turquoise=lichtblauwe toverdrank
items.potions.potion.crimson=rode toverdrank
items.potions.potion.azure=donkerblauwe toverdrank
items.potions.potion.jade=groene toverdrank
items.potions.potion.golden=gouden toverdrank
items.potions.potion.magenta=roze toverdrank
items.potions.potion.charcoal=zwarte toverdrank
items.potions.potion.ivory=witte toverdrank
items.potions.potion.amber=oranje toverdrank
items.potions.potion.bistre=bruine toverdrank
items.potions.potion.indigo=paarse toverdrank
items.potions.potion.silver=zilveren toverdrank
items.potions.potion.unknown_desc=Deze fles bevat een wervelende kleurige vloeistof. Wie weet wat voor effect het heeft als het wordt gegooid of gedronken?
items.potions.potion.harmful=Schadelijke toverdrank!
items.potions.potion.beneficial=Heilzame toverdrank
items.potions.potion.yes=Ja, ik weet wat ik doe
items.potions.potion.no=Nee, ik heb me bedacht
items.potions.potion.sure_drink=Weet je zeker dat je het wilt opdrinken? In de meeste gevallen wil je zo'n toverdrank naar je vijanden gooien.
items.potions.potion.sure_throw=Weet je zeker dat je het wilt gooien? In de meeste gevallen wil je zo'n toverdrank opdrinken.
items.potions.potion.shatter=De fles breekt en de vloeistof spat ongevaarlijk op de grond.
items.potions.potion.discover_hint=Je kunt dit item zomaar in de kerker vinden, of maak het met alchemie.
items.potions.potion$placeholder.name=toverdrank
items.potions.potion$seedtopotion.name=Willekeurige Toverdrank

items.potions.potionofexperience.name=toverdrank van ervaring
items.potions.potionofexperience.desc=De legendarische ervaringen van vele veldslagen is teruggebracht tot vloeibare vorm. Deze toverdrank verhoogt onmiddellijk je ervaringsniveau.

items.potions.potionoffrost.name=toverdrank van vorst
items.potions.potionoffrost.desc=De chemische stof in dit drankje verdampt tot een ijskoude wolk bij blootstelling aan open lucht.

items.potions.potionofhaste.name=toverdrank van haast
items.potions.potionofhaste.energetic=Je voelt je energiek!
items.potions.potionofhaste.desc=Het drinken van deze vreemd zoete vloeistof geeft je voor een korte tijd enorme energie, waardoor je op hoge snelheden kunt rennen.

items.potions.potionofhealing.name=toverdrank van genezing
items.potions.potionofhealing.heal=Je wonden beginnen te sluiten.
items.potions.potionofhealing.desc=Dit elixer herstelt je gezondheid snel en geneest vele kwalen onmiddellijk.

items.potions.potionofinvisibility.name=toverdrank van onzichtbaarheid
items.potions.potionofinvisibility.invisible=Je ziet je handen voor je ogen verdwijnen!
items.potions.potionofinvisibility.desc=Als je dit drankje drinkt, word je tijdelijk onzichtbaar. Hoewel onzichtbaar, zullen vijanden je niet kunnen zien. Fysieke aanvallen en magische effecten (zoals rollen en toverstokken) zullen de onzichtbaarheid onmiddellijk opheffen.

items.potions.potionoflevitation.name=toverdrank van levitatie
items.potions.potionoflevitation.float=Je zweeft de lucht in!
items.potions.potionoflevitation.desc=Als je deze merkwaardige vloeistof drinkt, zweef je de lucht in en vlieg je moeiteloos over vallen en kuilen. Als je dit drankje gooit, ontstaat er een wolk van ongezuiverd gas waarin iedereen wordt gedesoriënteerd.

items.potions.potionofliquidflame.name=toverdrank van vloeibare vlam
items.potions.potionofliquidflame.desc=Deze fles bevat een onstabiel ingrediënt dat bij blootstelling aan open lucht met geweld vlam vat.

items.potions.potionofmindvision.name=toverdrank van geestvisie
items.potions.potionofmindvision.see_mobs=Je kunt op de een of andere manier de aanwezigheid van de geest van andere wezens voelen!
items.potions.potionofmindvision.see_none=Je kunt op de een of andere manier zien dat je op dit moment alleen bent op deze verdieping.
items.potions.potionofmindvision.desc=Nadat je dit hebt gedronken, wordt je geest afgestemd op de psychische signatuur van verre wezens, waardoor je biologische aanwezigheid door muren heen kunt voelen. Met dit drankje kun je ook door nabijgelegen muren en deuren kijken.

items.potions.potionofparalyticgas.name=toverdrank van verlammend gas
items.potions.potionofparalyticgas.desc=Bij blootstelling aan open lucht verdampt de vloeistof in deze fles tot een verdovende gele waas. Iedereen die de wolk inademt, is onmiddellijk verlamd en kan enige tijd niet bewegen totdat de wolk is verdwenen. Dit voorwerp kan naar verre vijanden worden gegooid om ze in het gas te vangen.

items.potions.potionofpurity.name=toverdrank van zuiverheid
items.potions.potionofpurity.freshness=Je voelt een ongewone frisheid in de lucht.
items.potions.potionofpurity.protected=Een beschermend vlies omhult je!
items.potions.potionofpurity.desc=Deze magische reactiestof neutraliseert snel alle schadelijke gebiedsgebonden effecten in een groot gebied. Als je het drinkt, krijgt je tijdelijke immuniteit tegen dergelijke effecten.

items.potions.potionofstrength.name=toverdrank van kracht
items.potions.potionofstrength.msg=Hernieuwde kracht stroomt door je lichaam, je krachtniveau is nu %d
items.potions.potionofstrength.desc=Deze krachtige vloeistof stroomt door je spieren en vergroot je kracht permanent met één punt.

items.potions.potionoftoxicgas.name=toverdrank van giftig gas
items.potions.potionoftoxicgas.desc=Als je dit glas onder druk ontkurkt of verbrijzelt, explodeert de inhoud in een dodelijke wolk van giftig groen gas. Je kunt ervoor kiezen om dit drankje naar verre vijanden te gooien in plaats van het met de hand te ontkurken.



###brews
items.potions.brews.brew.discover_hint=Je kunt dit voorwerp maken met behulp van alchemie.

items.potions.brews.aquabrew.name=waterbrouwsel
items.potions.brews.aquabrew.desc=Wanneer dit brouwsel wordt verbrijzeld, zal er op de locatie een uitbarsting van water onder druk vrijkomen. Het is alleen krachtig genoeg om vuurtype vijanden te beschadigen, maar het verspreidt ook water naar nabijgelegen terreinen, ontwapent vallen, blust branden en slaat personages terug in de buurt van de uitbarsting.

items.potions.brews.blizzardbrew.name=sneeuwstorm brouwsel
items.potions.brews.blizzardbrew.desc=Wanneer het wordt verbrijzeld, ontketent dit brouwsel een kolkende sneeuwstorm die zich snel als een gas verspreidt.

items.potions.brews.causticbrew.name=bijtend brouwsel
items.potions.brews.causticbrew.desc=Dit brouwsel verspreid bijtend slijk in een groot gebied rond de plaats waar het verbrijzelt. Alles waar het slijk mee in aanraking komt smelt langzaam weg als het niet in water wordt afgespoeld.

items.potions.brews.infernalbrew.name=hels brouwsel
items.potions.brews.infernalbrew.desc=Wanneer het wordt verbrijzeld, ontketent dit brouwsel een razende vuurzee die zich snel als een gas verspreidt.

items.potions.brews.shockingbrew.name=schokkend brouwsel
items.potions.brews.shockingbrew.desc=Wanneer het wordt verbrijzeld, veroorzaakt dit brouwsel een elektrische storm in een groot gebied rond de plek waar het is gebroken.

items.potions.brews.unstablebrew.name=onstabiel brouwsel
items.potions.brews.unstablebrew.desc=Dit magische brouwsel gloeit met de veranderende kleuren van de regenboog.\n\nWanneer het wordt gedronken of gegooid, activeert het het effect van een willekeurig drankje.Het effect van het drankje is altijd gunstig als het wordt gedronken, maar schadelijk als het wordt gegooid.

###elixirs
items.potions.elixirs.elixir.discover_hint=Je kunt dit voorwerp maken met behulp van alchemie.

items.potions.elixirs.elixirofarcanearmor.name=elixer van mysterieus pantser
items.potions.elixirs.elixirofarcanearmor.desc=Dit elixer geeft de drinker een langdurige weerstand tegen magische schade.

items.potions.elixirs.elixirofaquaticrejuvenation.name=elixer van aquatische verjonging
items.potions.elixirs.elixirofaquaticrejuvenation.desc=Dit elixer bevat de overblijfselen van Smurrie versterkt met een geneeskrachtig drankje. Hoewel het geen onmiddellijke genezing biedt, herstelt het gestaag een grotere hoeveelheid gezondheid terwijl je in het water staat.
items.potions.elixirs.elixirofaquaticrejuvenation$aquahealing.name=aquatische genezing
items.potions.elixirs.elixirofaquaticrejuvenation$aquahealing.desc=Je hebt tijdelijk herstellende eigenschappen gekregen die vergelijkbaar zijn met die van Smurrie.\n\nAls je in water staat, krijg je per beurt een kleine hoeveelheid gezondheid terug. Het effect wordt gepauzeerd wanneer je volledig gezond bent of niet meer in water staat.\n\nResterende genezing: %d.

items.potions.elixirs.elixirofdragonsblood.name=elixer van drakenbloed
items.potions.elixirs.elixirofdragonsblood.desc=Wanneer het wordt gedronken, laat dit elixer vurige kracht door de aderen van de drinker stromen. Dit effect maakt de drinker immuun voor vuur en stelt hem in staat vijanden in brand te steken met fysieke aanvallen.

items.potions.elixirs.elixiroffeatherfall.name=elixer van verenval
items.potions.elixirs.elixiroffeatherfall.light=Je voelt je zo licht als een veertje!
items.potions.elixirs.elixiroffeatherfall.desc=Dit elixer heeft een zwakker maar beter gecontroleerd zweefeffect, waardoor de drinker een tijdje ongedeerd grote afstanden kan vallen.
items.potions.elixirs.elixiroffeatherfall$featherbuff.name=vederlicht
items.potions.elixirs.elixiroffeatherfall$featherbuff.desc=Je bent onder de invloed van een elixer van verenval, waardoor je in afgronden kunt vallen zonder schade op te lopen!\n\nResterende beurten: %s.

items.potions.elixirs.elixirofhoneyedhealing.name=elixer van honingzoete genezing
items.potions.elixirs.elixirofhoneyedhealing.desc=Dit elixer combineert genezing met de zoetheid van honing. Wanneer het wordt gedronken stilt het een kleine hoeveelheid honger, maar het kan ook worden geworpen naar een bondgenoot om deze te genezen.\n\nWezens die houden van honing kunnen rustig worden gemaakt als dit voorwerp op hen wordt gebruikt.

items.potions.elixirs.elixiroficytouch.name=elixer van ijzige aanraking
items.potions.elixirs.elixiroficytouch.desc=Wanneer het wordt gedronken, stelt dit elixer de drinker in staat om de warmte van vijanden die ze aanvallen te stelen. Dit effect maakt de drinker immuun voor kou en laat vijanden afkoelen wanneer je ze fysiek aanvalt.

items.potions.elixirs.elixirofmight.name=elixer van macht
items.potions.elixirs.elixirofmight.msg=Hernieuwde kracht stroomt door je lichaam, je krachtniveau is nu %d
items.potions.elixirs.elixirofmight.desc=Deze krachtige vloeistof stroomt door je spieren en vergroot je kracht permanent met één punt en verhoogt tijdelijk je maximale gezondheid met %d punten. De gezondheidsverhoging schaalt mee met je maximale gezondheid, maar neemt langzaam af naarmate je meer niveaus bereikt.
items.potions.elixirs.elixirofmight$htboost.name=maximale gezondheidsverhoging
items.potions.elixirs.elixirofmight$htboost.desc=Je lichaam voelt onnatuurlijk sterk en gezond aan.\n\nJe maximale gezondheid wordt langdurig verhoogd. Naarmate je niveau stijgt, neemt de verhoging geleidelijk af.\n\nHuidige verhoging: %d.\nResterende niveaus: %d.

items.potions.elixirs.elixiroftoxicessence.name=elixer van giftige essentie
items.potions.elixirs.elixiroftoxicessence.desc=Wanneer het wordt geconsumeerd, zal dit elixer de drinker doordrenken met giftige energie. De drinker zal voortdurend giftig gas verspreiden terwijl hij beweegt, en zal iets langer immuun zijn voor giftig gas en gif dan de duur van het effect.



###exotic potions
items.potions.exotic.exoticpotion.turquoise=exotisch lichtblauwe toverdrank
items.potions.exotic.exoticpotion.crimson=exotisch rode toverdrank
items.potions.exotic.exoticpotion.azure=exotisch donkerblauwe toverdrank
items.potions.exotic.exoticpotion.jade=exotisch groene toverdrank
items.potions.exotic.exoticpotion.golden=exotisch gouden toverdrank
items.potions.exotic.exoticpotion.magenta=exotisch roze toverdrank
items.potions.exotic.exoticpotion.charcoal=exotisch zwarte toverdrank
items.potions.exotic.exoticpotion.ivory=exotisch witte toverdrank
items.potions.exotic.exoticpotion.amber=exotisch oranje toverdrank
items.potions.exotic.exoticpotion.bistre=exotisch bruine toverdrank
items.potions.exotic.exoticpotion.indigo=exotisch paarse toverdrank
items.potions.exotic.exoticpotion.silver=exotisch zilveren toverdrank
items.potions.exotic.exoticpotion.unknown_desc=Deze ronde fles bevat een korrelige kleurrijke vloeistof. Het lijkt uitheems, wie weet wat het doet als het wordt gedronken of gegooid?
items.potions.exotic.exoticpotion.warning=Wil je deze toverdrank echt niet toepassen? Het wordt hoe dan ook gebruikt.
items.potions.exotic.exoticpotion.yes=Ja, ik weet het zeker
items.potions.exotic.exoticpotion.no=Nee, ik heb me bedacht
items.potions.exotic.exoticpotion.discover_hint=Je kunt dit voorwerp maken met behulp van alchemie.

items.potions.exotic.potionofcleansing.name=toverdrank van reiniging
items.potions.exotic.potionofcleansing.desc=Deze krachtige reactiestof maakt de drinker gedurende een paar beurten immuun voor alle schadelijke statuseffecten wanneer het wordt gedronken. Het kan ook naar een doelwit worden gegooid om het te reinigen.
items.potions.exotic.potionofcleansing$cleanse.name=gereinigd
items.potions.exotic.potionofcleansing$cleanse.desc=Dit personage is tijdelijk immuun voor alle schadelijke statuseffecten!\n\nResterende beurten: %s.

items.potions.exotic.potionofcorrosivegas.name=toverdrank van bijtend gas
items.potions.exotic.potionofcorrosivegas.desc=Als je deze onder druk staande fles ontkurkt of verbrijzelt, explodeert de inhoud in een dodelijke wolk van bijtend roestkleurig gas. Het gas verspreidt zich sneller dan giftig gas en is dodelijker, maar het effect duurt ook minder lang.

items.potions.exotic.potionofdragonsbreath.name=toverdrank van drakenadem
items.potions.exotic.potionofdragonsbreath.prompt=Kies een plek om in brand te steken
items.potions.exotic.potionofdragonsbreath.desc=Deze fles bevat een ongebruikelijke verbinding die kort na vermenging met speeksel in brand vliegt. Door de vloeistof snel uit te spuwen, kan de gebruiker vlammen uit zijn mond spuwen!

items.potions.exotic.potionofearthenarmor.name=toverdrank van aarden bepantsering
items.potions.exotic.potionofearthenarmor.desc=In plaats van te verlammen, heeft deze vloeistof een verhardend effect op de huid waardoor deze in een tijdelijk natuurlijk pantser verandert.

items.potions.exotic.potionofdivineinspiration.name=toverdrank van goddelijke inspiratie
items.potions.exotic.potionofdivineinspiration.no_more_points=Je kunt geen bonus talentpunten meer verdienen.
items.potions.exotic.potionofdivineinspiration.select_tier=Kies een talentklasse waar je twee bonuspunten vooruit in wilt gaan. Je moet de klasse hebben ontgrendeld om de punten te kunnen besteden.
items.potions.exotic.potionofdivineinspiration.bonus=+2 Talentpunten!
items.potions.exotic.potionofdivineinspiration.desc=De kracht van heilige energie teruggebracht tot vloeibare vorm. Deze drank geeft de drinker goddelijke kracht, waardoor ze twee bonus talentpunten krijgen in een klasse naar keuze.\n\nDit drankje kan slechts één keer worden gebruikt voor elk talentklasse.

items.potions.exotic.potionofmagicalsight.name=toverdrank van magisch zicht
items.potions.exotic.potionofmagicalsight.desc=Nadat je dit hebt gedronken, worden je zintuigen kortstondig tot ongelooflijke niveaus verhoogd, waardoor je door muren heen kunt kijken in een straal van 12 tegels!

items.potions.exotic.potionofmastery.name=toverdrank van meesterschap
items.potions.exotic.potionofmastery.prompt=Beheers een Voorwerp
items.potions.exotic.potionofmastery.weapon_easier=Je wapen wordt gemakkelijker te hanteren!
items.potions.exotic.potionofmastery.armor_easier=Je harnas wordt gemakkelijker te dragen!
items.potions.exotic.potionofmastery.desc=In plaats van ruwe kracht te geven, stemt dit drankje in plaats daarvan de spieren van de gebruiker af op een bepaald voorwerp. Dit maakt dat voorwerp gemakkelijker te gebruiken, alsof de drinker ermee heeft geoefend en spiergeheugen heeft opgebouwd.\n\nHet gekozen wapen of harnas vereist daarna 2 minder kracht om te gebruiken. Dit drankje kan maar één keer op een voorwerp worden gebruikt.

items.potions.exotic.potionofshielding.name=toverdrank van bescherming
items.potions.exotic.potionofshielding.desc=In plaats van te genezen, projecteert dit drankje een duurzaam schild rond het lichaam van de gebruiker, waarmee een aanzienlijke hoeveelheid schade wordt geblokkeerd.

items.potions.exotic.potionofshroudingfog.name=toverdrank van verhullende mist
items.potions.exotic.potionofshroudingfog.desc=Bij blootstelling aan lucht produceert de vloeistof in deze fles een dikke rokerige mist die zich snel verspreidt en het zicht van je vijanden blokkeert.

items.potions.exotic.potionofsnapfreeze.name=toverdrank van instant bevriezen
items.potions.exotic.potionofsnapfreeze.desc=De chemische stof in dit drankje reageert snel met de lucht en laat alles onmiddellijk bevriezen en wortel schieten wat erin gevangen is.

items.potions.exotic.potionofstamina.name=toverdrank van uithoudingsvermogen
items.potions.exotic.potionofstamina.desc=Als je deze vreemd zoete vloeistof drinkt, krijg je een langdurige energieverhoging, waardoor je langere tijd in een versneld tempo kunt rennen.

items.potions.exotic.potionofstormclouds.name=toverdrank van onweerswolken
items.potions.exotic.potionofstormclouds.desc=Als je dit drankje gooit, ontstaat er een snel verspreidende wolk van geconcentreerde damp, die zal condenseren en naar de omgeving zal stromen. Het meeste terrein zal worden omgezet in water, vurige vijanden zullen schade oplopen, het vuur zal worden geblust en vallen zullen overweldigd worden en kapot gaan.



###quest items
items.quest.ceremonialcandle.name=ceremoniële kaars
items.quest.ceremonialcandle.desc=Een set kaarsen, samengesmolten door gebruik.\n\nAlleen zijn ze waardeloos, maar als ze samen met andere kaarsen in een patroon worden gebruikt, kunnen ze de energie opwekken voor een oproepingsritueel.
items.quest.ceremonialcandle.discover_hint=Je kunt dit item vinden tijdens een specifieke missie.

items.quest.corpsedust.name=lijkstof
items.quest.corpsedust.chill=Een koude rilling loopt over je rug.
items.quest.corpsedust.desc=Van de buitenkant verschilt de bal van lijkstof niet van een gewone stofbal. Maar je voelt dat er een kwaadaardige energie in schuilt.\n\nHet is een goed idee om er zo snel mogelijk vanaf te komen.
items.quest.corpsedust.discover_hint=Je kunt dit item vinden tijdens een specifieke missie.

items.quest.darkgold.name=donker gouderts
items.quest.darkgold.you_now_have=Je hebt nu %d donker gouderts.
items.quest.darkgold.desc=Dit metaal wordt niet donker genoemd vanwege zijn kleur (het verschilt niet van normaal goud), maar omdat het smelt in daglicht waardoor het onbruikbaar is aan de oppervlakte.
items.quest.darkgold.discover_hint=Je kunt dit item vinden tijdens een specifieke missie.

items.quest.dwarftoken.name=dwergfiche
items.quest.dwarftoken.desc=Veel dwergen en sommige van hun grotere bouwsels dragen deze kleine stukjes metaal met een onbekend doel. Misschien zijn het sieraden of misschien een soort identiteitsbewijs. Dwergen zijn vreemde wezens.
items.quest.dwarftoken.discover_hint=Je kunt dit item vinden tijdens een specifieke missie.

items.quest.embers.name=elementaire sintels
items.quest.embers.desc=Speciale sintels die alleen kunnen worden verkregen uit jonge vuurelementairen. Ze stralen warmte-energie uit.
items.quest.embers.discover_hint=Je kunt dit item vinden tijdens een specifieke missie.

items.quest.escapecrystal.name=ontsnappingskristal
items.quest.escapecrystal.ac_use=GEBRUIK
items.quest.escapecrystal.desc=Een dun magisch spreukkristal dat teleportatiemagie lijkt te bevatten. Je kunt het kristal op elk moment gebruiken om de dwergenkluis te verlaten, maar je kunt er niets uit meenemen!
items.quest.escapecrystal.discover_hint=Je kunt dit item vinden tijdens een specifieke missie.

items.quest.gooblob.name=klodder smurrie
items.quest.gooblob.desc=Een wiebelende klodder rotzooi die van Smurrie afviel toen het stierf. Het lijkt op een grote bal gelei, hoewel je het niet zou durven eten.\n\nHet doet niets op zichzelf, maar het kan handig zijn in combinatie met bepaalde drankjes of een bom. Het kan op zijn minst worden omgezet in een behoorlijke hoeveelheid energie.
items.quest.gooblob.discover_hint=Je kunt dit voorwerp krijgen doordat bepaalde vijanden het laten vallen.

items.quest.metalshard.name=vervloekte metalen scherf
items.quest.metalshard.desc=Een scherf van verroest vervloekt metaal, die van DM-300 afbrak toen het werd vernietigd. Je voelt er een kwaadaardige magie in schuilen.\n\nHet doet niets op zichzelf, maar het kan handig zijn in combinatie met bepaalde rollen of een bom. Het kan op zijn minst worden omgezet in een behoorlijke hoeveelheid energie.
items.quest.metalshard.discover_hint=Je kunt dit voorwerp krijgen doordat bepaalde vijanden het laten vallen.

items.quest.pickaxe.name=pikhouweel
items.quest.pickaxe.ability_name=doorboren
items.quest.pickaxe.ability_desc=De Duellist kan een vijand doorboren met een houweel. Dit zal gegarandeerd raken, is kwetsbaar gedurende 3 beurten en richt _%1$d-%2$dschade _ toe aan vijanden met een sterke huid.
items.quest.pickaxe.upgrade_ability_stat_name=Vaardigheid Schade
items.quest.pickaxe.desc=Dit is een stevig en zwaar stuk gereedschap voor het breken van stenen. Je hoeft de houweel er niet mee uit te rusten, maar in een mum van tijd kan hij waarschijnlijk als wapen worden uitgerust.
items.quest.pickaxe.discover_hint=Je kunt dit item vinden tijdens een specifieke missie.

items.quest.ratskull.name=gigantische rattenschedel
items.quest.ratskull.desc=Een verrassend grote rattenschedel. Het zou een geweldige jachttrofee zijn, als je een muur had om hem op te hangen.



###remains
items.remains.remainsitem.ac_use=GEBRUIK
items.remains.remainsitem.discover_hint=Je kunt dit item vinden in de overblijfselen van een specifieke held uit een eerdere verloren verkenning.

items.remains.bowfragment.name=fragment van een boog
items.remains.bowfragment.desc=Dit gebroken stuk hout maakte ooit deel uit van de geestenboog van een gevallen jaagster. Je voelt nog steeds een beetje natuurenergie in het fragment achterblijven, je kunt het fragment gebruiken om wat hoog gras om je heen te laten groeien. Als je dit doet, wordt het fragment echter vernietigd.

items.remains.brokenhilt.name=gebroken handgreep
items.remains.brokenhilt.desc=Deze gebroken handgreep ziet eruit alsof het afkomstig is van het wapen van een verslagen Duellist. Je kunt nog steeds een beetje krijgskracht in de handgreep voelen, je kunt het gebruiken om wat bonusschade te doen bij je volgende twee slagaanvallen. Als je dit doet, wordt het handgreep echter vernietigd.

items.remains.brokenstaff.name=gebroken staf
items.remains.brokenstaff.desc=Deze staf van de Magiër is in tweeën gebroken nadat de eigenaar overleed. Je voelt nog steeds wat magische energie in de staf, je kunt het gebruiken om je toverstokken een kleine oplaadboost te geven. Als je dit doet, wordt het staffragment echter vernietigd.

items.remains.cloakscrap.name=stukje stof
items.remains.cloakscrap.desc=Dit stukje doorschijnende stof ziet eruit alsof het afkomstig is van de schaduwmantel van een gevallen schurk. Je voelt nog steeds een beetje mystieke energie erin, je kunt het gebruiken om je artefacten een kleine oplaadboost te geven. Als je dit doet, wordt de stof echter vernietigd.

items.remains.sealshard.name=scherven van een zegel
items.remains.sealshard.desc=Deze kleine stukjes rode was zien eruit alsof ze afkomstig zijn van het zegel van een gevallen krijger. Je voelt nog steeds een beetje wilskracht aan het zegel kleven, je kunt het gebruiken om jezelf een beetje bescherming te geven. Als je dit doet, worden de zegel scherven echter vernietigd.

items.remains.tornpage.name=gescheurde pagina
items.remains.tornpage.desc=Deze pagina ziet eruit alsof hij uit een verlopen heilig boek van een Geestelijke is gescheurd. Er kleeft nog steeds een beetje goddelijke energie aan, je kunt het gebruiken om een beetje gezondheid terug te krijgen. Als je dit doet, wordt de uitgescheurde pagina echter vernietigd.



###rings
items.rings.ring.diamond=ring van diamant
items.rings.ring.opal=ring van opaal
items.rings.ring.garnet=ring van granaatsteen
items.rings.ring.ruby=ring van robijn
items.rings.ring.amethyst=ring van amethist
items.rings.ring.topaz=ring van topaas
items.rings.ring.onyx=ring van onyx
items.rings.ring.tourmaline=ring van toermalijn
items.rings.ring.emerald=ring van smaragd
items.rings.ring.sapphire=ring van saffier
items.rings.ring.quartz=ring van kwarts
items.rings.ring.agate=ring van agaat
items.rings.ring.equip_cursed=De ring versmalt pijnlijk strak om je vinger!
items.rings.ring.unknown_desc=Deze metalen band is versierd met een grote edelsteen die schittert in de duisternis. Wie weet welk effect het heeft als het wordt gedragen?
items.rings.ring.known=Dit is een %s
items.rings.ring.identify=Je bent nu voldoende bekend met je ring om hem te identificeren.
items.rings.ring.cursed_worn=Omdat deze ring vervloekt is, ben je machteloos om hem af te doen.
items.rings.ring.curse_known=Je voelt een kwaadaardige magie schuilen in deze ring.
items.rings.ring.not_cursed=Deze ring is vrij van kwaadaardige magie.

items.rings.ringofaccuracy.name=ring van nauwkeurigheid
items.rings.ringofaccuracy.stats=Wanneer deze ring wordt gedragen neemt je nauwkeurigheid toe met _%s%%._
items.rings.ringofaccuracy.typical_stats=Wanneer deze ring wordt gedragen neemt je nauwkeurigheid doorgaans toe met _%s%%._
items.rings.ringofaccuracy.combined_stats=Je uitgeruste ringen combineren hun kracht, waardoor je nauwkeurigheid in totaal met _%s%%_ toeneemt.
items.rings.ringofaccuracy.upgrade_stat_name_1=Nauwkeurigheidsverbetering
items.rings.ringofaccuracy.desc=Deze ring verhoogt je focus, waardoor je aanvallen gemakkelijker hun doel vinden. Een vervloekte ring maakt het in plaats daarvan moeilijker om een doel te raken bij een aanval.

items.rings.ringofarcana.name=ring van geheimzinnigheid
items.rings.ringofarcana.stats=Wanneer deze ring wordt gedragen, neemt de kracht van betoveringen en symbolen toe met _%s%%._
items.rings.ringofarcana.typical_stats=Wanneer deze ring wordt gedragen, neemt de kracht van betoveringen en symbolen doorgaans toe met _%s%%._
items.rings.ringofarcana.combined_stats=Je uitgeruste ringen combineren hun kracht, waardoor de kracht van betoveringen en symbolen in totaal met _%s%%_ toeneemt.
items.rings.ringofarcana.upgrade_stat_name_1=Arcana verbetering
items.rings.ringofarcana.desc=Deze ring verbetert magische betoveringen op wapens en symbolen op harnassen, inclusief vloeken! Het vergroot eerst de activeringskans en verhoogt vervolgens de kracht van het effect zodra de activeringskans 100% is. Een vervloekte ring verzwakt in plaats daarvan betoveringen, symbolen en vloeken.

items.rings.ringofelements.name=ring van elementen
items.rings.ringofelements.stats=Wanneer deze ring wordt gedragen biedt hij _%s%%_ elementaire weerstand.
items.rings.ringofelements.typical_stats=Wanneer deze ring wordt gedragen biedt hij doorgaans _%s%%_ elementaire weerstand.
items.rings.ringofelements.combined_stats=Je uitgeruste ringen combineren hun krachten en bieden in totaal _%s%%_ elementaire weerstand.
items.rings.ringofelements.upgrade_stat_name_1=Weerstand
items.rings.ringofelements.desc=Deze ring biedt weerstand tegen de meeste elementaire en magische effecten, waardoor schade en duur van het effect worden verminderd. Natuurlijk verergert een vervloekte ring juist deze effecten.

items.rings.ringofenergy.name=ring van energie
items.rings.ringofenergy.stats=Wanneer deze ring wordt gedragen, verhoogt deze de oplaadsnelheid van toverstokken, artefacten en het heldhaftige harnas met _%s%%._
items.rings.ringofenergy.typical_stats=Wanneer deze ring wordt gedragen, verhoogt deze doorgaans de oplaadsnelheid van toverstokken, artefacten en het heldhaftige harnas met _%s%%._
items.rings.ringofenergy.combined_stats=Je uitgeruste ringen combineren hun krachten, waardoor de oplaadsnelheid in totaal met _%s%%_ toeneemt.
items.rings.ringofenergy.upgrade_stat_name_1=Laadversterking
items.rings.ringofenergy.desc=Je magische uitrusting laadt sneller op in het geheimzinnige veld dat uit deze ring straalt. Een vervloekte ring vertraagt in plaats daarvan het opladen.

items.rings.ringofevasion.name=ring van ontwijking
items.rings.ringofevasion.stats=Wanneer deze ring wordt gedragen neemt je ontwijking toe met _%s%%._
items.rings.ringofevasion.typical_stats=Wanneer deze ring wordt gedragen neemt je ontwijking doorgaans toe met _%s%%._
items.rings.ringofevasion.combined_stats=Je uitgeruste ringen combineren hun kracht, waardoor je ontwijking in totaal met _%s%%_ toeneemt.
items.rings.ringofevasion.upgrade_stat_name_1=Ontwijkings verbetering
items.rings.ringofevasion.desc=Deze ring versnelt de reacties van de drager, waardoor het moeilijker wordt om de drager te raken. Een vervloekte ring maakt de gebruiker in plaats daarvan gemakkelijker te slaan.

items.rings.ringofforce.name=ring van kracht
items.rings.ringofforce.stats=Wanneer deze ring ongewapend wordt gedragen richten slagaanvallen met je huidige sterkte _%1$d-%2$d schade aan._ De schade van een gehanteerd wapen verhoogt deze ring met _%3$d._
items.rings.ringofforce.typical_stats=Wanneer deze ring ongewapend wordt gedragen richten slagaanvallen met je huidige sterkte doorgaans _%1$d-%2$d schade aan._ De schade van een gehanteerd wapen verhoogt deze ring doorgaans met _%3$d._
items.rings.ringofforce.combined_stats=Je uitgeruste ringen combineren hun krachten, richten in totaal _%1$d- %2$d schade_ aan zonder wapen, of verhogen de schade met _%3$d_ met een gehanteerd wapen.
items.rings.ringofforce.upgrade_stat_name_1=Ongewapende Schade
items.rings.ringofforce.upgrade_stat_name_2=Versterking van gewapende schade
items.rings.ringofforce.upgrade_stat_name_3=Vaardigheid Schade
items.rings.ringofforce.ability_name=vechtershouding
items.rings.ringofforce.typical_ability_desc=De Duellist kan met deze ring de houding van een vechter aannemen, waardoor haar reguliere aanvallen altijd deze ring gebruiken, zelfs als ze een wapen heeft. Deze aanvallen zullen doorgaans _%1$d-%2$d schade_ aanrichten en zullen ook de betovering en verbetering van het wapen overnemen. Deze houding vertraagt de oplaadsnelheid van het wapen met 50 %%.
items.rings.ringofforce.ability_desc=De Duellist kan met deze ring de houding van een vechter aannemen, waardoor haar reguliere aanvallen altijd deze ring gebruiken, zelfs als ze een wapen heeft. Deze aanvallen zullen _%1$d-%2$d schade_ aanrichten en zullen ook de betovering en verbetering van het wapen erven. Deze houding vertraagt de oplaadsnelheid van het wapen met 50%%.
items.rings.ringofforce.desc=Deze ring versterkt de kracht van slagaanvallen van de drager. Deze extra kracht is vrij zwak bij het hanteren van wapens, maar een ongewapende aanval wordt veel sterker gemaakt. Een vervloekte ring verzwakt in plaats daarvan de slagen van de drager.
items.rings.ringofforce$brawlersstance.name=vechtershouding
items.rings.ringofforce$brawlersstance.desc=In deze houding zullen de reguliere aanvallen van de Duellist gebruik maken van een uitgeruste ring van kracht, zelfs als ze een wapen heeft. Deze aanvallen leveren bonusschade op en maken nog steeds gebruik van de verbetering en betovering van het wapen.\n\nHet behouden van deze houding vergt echter focus, waardoor de oplaadsnelheid van het wapenvermogen met 50% wordt verminderd.\n\nDeze stand kan worden in- of uitgeschakeld door gebruik te maken van een  ring van kracht, maar de verlaging van de laadsnelheid zal een tijdje aanhouden als de stand snel wordt geactiveerd en gedeactiveerd.

items.rings.ringoffuror.name=ring van woede
items.rings.ringoffuror.stats=Wanneer deze ring wordt gedragen verhoogt hij de snelheid van je aanvallen met _%s%%._
items.rings.ringoffuror.typical_stats=Wanneer deze ring wordt gedragen verhoogt hij doorgaans de snelheid van je aanvallen met _%s%%._
items.rings.ringoffuror.combined_stats=Je uitgeruste ringen combineren hun krachten, waardoor de snelheid van je aanvallen in totaal met _%s%%_ toeneemt.
items.rings.ringoffuror.upgrade_stat_name_1=Verbetering van aanvalssnelheid
items.rings.ringoffuror.desc=Deze ring bezorgt de drager een innerlijke geestdrift, waardoor hij sneller kan aanvallen. Een vervloekte ring vertraagt in plaats daarvan de aanvalssnelheid van de drager.

items.rings.ringofhaste.name=ring van haast
items.rings.ringofhaste.stats=Wanneer deze ring wordt gedragen verhoogt hij je bewegingssnelheid met _%s%%._
items.rings.ringofhaste.typical_stats=Wanneer deze ring wordt gedragen verhoogt hij doorgaans je bewegingssnelheid met _%s%%._
items.rings.ringofhaste.combined_stats=Je uitgeruste ringen combineren hun kracht, waardoor je bewegingssnelheid in totaal met _%s%%_ toeneemt.
items.rings.ringofhaste.upgrade_stat_name_1=Verbetering van beweegsnelheid
items.rings.ringofhaste.desc=Deze ring vermindert de bewegingsdruk op de drager, waardoor deze met bovenmenselijke snelheden kan rennen. Een vervloekte ring vertraagt in plaats daarvan de drager.

items.rings.ringofmight.name=ring van macht
items.rings.ringofmight.stats=Wanneer je deze ring draagt, neemt je kracht met _%1$d_ en je maximale gezondheid met _%2$s%%_ toe.
items.rings.ringofmight.typical_stats=Wanneer je deze ring draagt, neemt je kracht doorgaans met _%1$d_ en je maximale gezondheid met _%2$s%%_ toe.
items.rings.ringofmight.combined_stats=Je uitgeruste ringen combineren hun kracht, waardoor je kracht in totaal met _%1$d_ en je maximale gezondheid met _%2$s%%_ toeneemt.
items.rings.ringofmight.upgrade_stat_name_1=Krachtversterking
items.rings.ringofmight.upgrade_stat_name_2=Maximale gezondheid-verbetering
items.rings.ringofmight.desc=Deze ring verbetert de fysieke eigenschappen van de drager en geeft hem meer fysieke kracht en lichaamsbouw. Een vervloekte ring verzwakt de drager.

items.rings.ringofsharpshooting.name=ring van scherpschieten
items.rings.ringofsharpshooting.stats=Wanneer deze ring wordt gedragen, verhoogt hij de schade van je werpwapens alsof hun niveau is verhoogd met _%1$d_, en verhoogt de duurzaamheid ervan met _%2$s%%._
items.rings.ringofsharpshooting.typical_stats=Wanneer deze ring wordt gedragen, verhoogt hij doorgaans de schade van je werpwapens alsof hun niveau is verhoogd met _%1$d_, en verhoogt doorgaans de duurzaamheid ervan met _%2$s%%._
items.rings.ringofsharpshooting.combined_stats=Je uitgeruste ringen combineren hun kracht, verhogen het effectieve werpwapen niveau met _%1$d_ en verhogen hun duurzaamheid met _%2$s%%_ in totaal.
items.rings.ringofsharpshooting.upgrade_stat_name_1=Niveau schadeversterking
items.rings.ringofsharpshooting.upgrade_stat_name_2=Duurzaamheidsverbetering
items.rings.ringofsharpshooting.desc=Deze ring verbetert de precisie en het richtvermogen van de drager, waardoor alle projectielwapens schadelijker en duurzamer worden. Een vervloekte ring heeft het tegenovergestelde effect.

items.rings.ringoftenacity.name=ring van vasthoudendheid
items.rings.ringoftenacity.stats=Wanneer je deze ring draagt vermindert hij de schade die je oploopt tot _%s%%._
items.rings.ringoftenacity.typical_stats=Wanneer je deze ring draagt vermindert hij doorgaans de schade die je oploopt tot _%s%%._
items.rings.ringoftenacity.combined_stats=Je uitgeruste ringen combineren hun krachten, waardoor de schade die je oploopt in totaal met maximaal _%s%%_ wordt verminderd.
items.rings.ringoftenacity.upgrade_stat_name_1=Max Schade Weerstand
items.rings.ringoftenacity.desc=Deze ring stelt de drager in staat om normaalgesproken dodelijke aanvallen te weerstaan. Hoe meer gewond de drager is, hoe meer deze bestand is tegen schade. Een vervloekte ring maakt het in plaats daarvan gemakkelijker voor vijanden om de drager te doden.

items.rings.ringofwealth.name=ring van rijkdom
items.rings.ringofwealth.stats=Wanneer je deze ring draagt, vergroot je je geluk met _%s%%._
items.rings.ringofwealth.typical_stats=Wanneer je deze ring draagt, vergroot je doorgaans je geluk met _%s%%._
items.rings.ringofwealth.combined_stats=Je uitgeruste ringen combineren hun kracht, waardoor je geluk in totaal met _%s%%_ toeneemt.
items.rings.ringofwealth.upgrade_stat_name_1=Meer Geluk
items.rings.ringofwealth.desc=Deze ring werkt als een magneet voor schatten, waardoor de kans groter wordt dat vijanden en schatkisten waardevolle voorwerpen bij zich hebben. Een vervloekte ring verkleint in plaats daarvan je kans op het ontvangen van buit.



###scrolls
items.scrolls.scroll.ac_read=LEES
items.scrolls.scroll.kaunan=rol van KAUNAN
items.scrolls.scroll.sowilo=rol van SOWILO
items.scrolls.scroll.laguz=rol van LAGUZ
items.scrolls.scroll.yngvi=rol van YNGVI
items.scrolls.scroll.gyfu=rol van GYFU
items.scrolls.scroll.raido=rol van RAIDO
items.scrolls.scroll.isaz=rol van ISAZ
items.scrolls.scroll.mannaz=rol van MANNAZ
items.scrolls.scroll.naudiz=rol van NAUDIZ
items.scrolls.scroll.berkanan=rol van BERKANAN
items.scrolls.scroll.odal=rol van ODAL
items.scrolls.scroll.tiwaz=rol van TIWAZ
items.scrolls.scroll.unknown_desc=Op dit perkament zijn niet te ontcijferen magische runen geschreven. Wie weet wat het doet als het hardop wordt voorgelezen?
items.scrolls.scroll.blinded=Je kunt geen rol lezen als je verblind bent.
items.scrolls.scroll.no_magic=Je kunt geen rol lezen terwijl je magisch immuum bent.
items.scrolls.scroll.cursed=Je vervloekte spreukenboek zorgt ervoor dat je de magie van deze rol niet kunt oproepen! Een rol van vloekverwijdering kan echter sterk genoeg zijn om nog steeds te werken...
items.scrolls.scroll$placeholder.name=rol

items.scrolls.inventoryscroll.warning=Wil je deze rol echt niet gebruiken? De rol is niet eerder geïdentificeerd, dus wordt deze toch verbruikt.
items.scrolls.inventoryscroll.yes=Ja, ik weet het zeker
items.scrolls.inventoryscroll.no=Nee, ik heb me bedacht

items.scrolls.scrollofidentify.name=rol van identificatie
items.scrolls.scrollofidentify.inv_title=Identificeer een voorwerp
items.scrolls.scrollofidentify.it_is=Je voorwerp is geïdentificeerd: %s.
items.scrolls.scrollofidentify.desc=Deze rol onthult voor altijd alle geheimen van een enkel voorwerp.

items.scrolls.scrolloflullaby.name=rol van slaaplied
items.scrolls.scrolloflullaby.sooth=De rol laat een rustgevende melodie horen. Je voelt je erg slaperig.
items.scrolls.scrolloflullaby.desc=Bij het lezen van deze rol komt een rustgevende melodie vrij die iedereen die het hoort in een diepe magische slaap sust. Voor de lezer en bondgenoten is de slaap herstellend.

items.scrolls.scrollofmagicmapping.name=rol van magische kaartkennis
items.scrolls.scrollofmagicmapping.layout=Je bent nu op de hoogte van de indeling op deze verdieping.
items.scrolls.scrollofmagicmapping.desc=Wanneer deze rol wordt gelezen, wordt een kristalhelder beeld in je geheugen gegrift, waardoor je de precieze indeling van de verdieping en alle verborgen geheimen weet. De plekken van voorwerpen en wezens blijven onbekend.

items.scrolls.scrollofmirrorimage.name=rol van spiegelbeeld
items.scrolls.scrollofmirrorimage.copies=De rol laat spiegelbeelden van jou ontstaan.
items.scrolls.scrollofmirrorimage.no_copies=De rol probeert spiegelbeelden van jou te laten ontstaan, maar ze kunnen nergens heen.
items.scrolls.scrollofmirrorimage.desc=De bezwering op deze rol maakt twee denkbeeldige tweelingen van de lezer. Deze spiegelbeelden fungeren als zwakkere klonen van de lezer en achtervolgen zijn vijanden. Ze hebben echter geen duurzaamheid en vervagen als ze schade worden toegebracht.

items.scrolls.scrollofretribution.name=rol van vergelding
items.scrolls.scrollofretribution.blast=Krachtige magische energie barst uit de rol!
items.scrolls.scrollofretribution.desc=Deze rol bevat destructieve energie die het lijden van de lezer naar buiten kanaliseert in een uitbarsting van kracht. Hoe zwakker de lezer is, hoe meer schade hij aanricht. Bij een zeer lage gezondheid kan deze rol de meeste vijanden onmiddellijk doden.\n\nHet gebruik van de rol eist echter zijn tol van de gebruiker, het verblindt en verzwakt hem.

items.scrolls.scrollofrage.name=rol van woede
items.scrolls.scrollofrage.roar=De rol laat een woedend gebrul horen dat door de kerker weergalmt!
items.scrolls.scrollofrage.desc=Wanneer hardop voorgelezen, ontketent deze rol een groot gebrul dat alle vijanden naar de lezer trekt en nabije vijanden woedend maakt.

items.scrolls.scrollofrecharging.name=rol van opladen
items.scrolls.scrollofrecharging.surge=Een golf van energie stroomt door je lichaam en geeft je toverstokken energie!
items.scrolls.scrollofrecharging.desc=De ruwe magische kracht die in dit perkament zit, zal na verloop van tijd alle toverstokken van de gebruiker opladen wanneer deze worden losgelaten.

items.scrolls.scrollofremovecurse.name=rol van vloekverwijdering
items.scrolls.scrollofremovecurse.inv_title=Een voorwerp opschonen
items.scrolls.scrollofremovecurse.cleansed=Je voorwerp gloeit van een reinigend licht en een kwaadaardige energie verdwijnt in de lucht!
items.scrolls.scrollofremovecurse.not_cleansed=Je voorwerp gloeit van een reinigend licht, maar er gebeurt niets.
items.scrolls.scrollofremovecurse.spirit=Jouw rol bevrijdt de gekwelde geest!
items.scrolls.scrollofremovecurse.desc=De bezwering op deze rol verwijdert onmiddellijk alle vloeken van een enkel wapen, ring, toverstok, harnas of artefact.

items.scrolls.scrollofteleportation.name=rol van teleportatie
items.scrolls.scrollofteleportation.tele=In een oogwenk werd je geteleporteerd naar een andere plek op de verdieping.
items.scrolls.scrollofteleportation.no_tele=De teleportatiemagie mislukt.
items.scrolls.scrollofteleportation.cant_reach=Je kunt daar niet naartoe teleporteren.
items.scrolls.scrollofteleportation.prompt=Kies een plek om naartoe te teleporteren
items.scrolls.scrollofteleportation.desc=De spreuk op dit perkament brengt de lezer onmiddellijk naar een andere plek op de kerkerverdieping. De rol geeft prioriteit aan gebieden waar de lezer nog niet eerder is geweest, hoewel hij niet langs gesloten deuren of barricades kan teleporteren. Het kan echter verborgen deuren onthullen die naar nieuwe gebieden leiden.

items.scrolls.scrollofterror.name=rol van terreur
items.scrolls.scrollofterror.none=De rol straalt een schitterende flits van rood licht uit.
items.scrolls.scrollofterror.one=De rol straalt een schitterende flits van rood licht uit en de %s vlucht!
items.scrolls.scrollofterror.many=De rol straalt een schitterende flits van rood licht uit en de monsters vluchten!
items.scrolls.scrollofterror.desc=Wanneer de rol wordt gelezen, straalt deze een flits van rood licht uit die alle vijanden in je gezichtsveld met angst overweldigt, waarna ze zich omdraaien en vluchten. Het aanvallen van een vluchtende vijand verkort het effect.

items.scrolls.scrolloftransmutation.name=rol van transmutatie
items.scrolls.scrolloftransmutation.inv_title=Een voorwerp transmuteren
items.scrolls.scrolloftransmutation.nothing=Er gebeurt niets interessants.
items.scrolls.scrolloftransmutation.morph=Je voorwerp verandert in iets anders!
items.scrolls.scrolloftransmutation.desc=Deze rol bevat krachtige transmutatiemagie. Bij gebruik op een in aanmerking komend voorwerp verandert het in een ander voorwerp van hetzelfde type. De magie behoudt zelfs opwaarderingen, betoveringen en symbolen. Rollen en drankjes zullen worden omgezet in hun exotische equivalent, en omgekeerd.

items.scrolls.scrollofupgrade.name=rol van opwaardering
items.scrolls.scrollofupgrade.inv_title=Een voorwerp opwaarderen
items.scrolls.scrollofupgrade.weaken_curse=De rol van opwaardering verzwakt de vloek op je voorwerp.
items.scrolls.scrollofupgrade.remove_curse=De rol van opwaardering reinigt de vloek op je voorwerp!
items.scrolls.scrollofupgrade.desc=Met deze rol wordt één item of een set van werpwapens opgewaardeerd. Toverstokken zullen in kracht en aantal ladingen toenemen, wapens en harnassen zullen meer schade aanrichten en blokkeren, en de effecten van ringen zullen toenemen.\n\nHet kan zelfs vloeken verzwakken of soms volledig verdrijven, hoewel het niet zo krachtig is als een rol van vloekverwijdering. Helaas kan de opwaardeermagie ook betoveringen of symbolen op uitrusting van een hoger niveau wissen.



###exotic scrolls
items.scrolls.exotic.exoticscroll.kaunan=exotische rol van KAUNAN
items.scrolls.exotic.exoticscroll.sowilo=exotische rol van SOWILO
items.scrolls.exotic.exoticscroll.laguz=exotische rol van LAGUZ
items.scrolls.exotic.exoticscroll.yngvi=exotische rol van YNGVI
items.scrolls.exotic.exoticscroll.gyfu=exotische rol van GYFU
items.scrolls.exotic.exoticscroll.raido=exotische rol van RAIDO
items.scrolls.exotic.exoticscroll.isaz=exotische rol van ISAZ
items.scrolls.exotic.exoticscroll.mannaz=exotische rol van MANNAZ
items.scrolls.exotic.exoticscroll.naudiz=exotische rol van NAUDIZ
items.scrolls.exotic.exoticscroll.berkanan=exotische rol van BERKANAN
items.scrolls.exotic.exoticscroll.odal=exotische rol van ODAL
items.scrolls.exotic.exoticscroll.tiwaz=exotische rol van TIWAZ
items.scrolls.exotic.exoticscroll.unknown_desc=Op dit zwarte perkament zijn glimmende, niet te ontcijferen magische runen geschreven. Het lijkt uitheems, wie weet wat het doet als het wordt voorgelezen?
items.scrolls.exotic.exoticscroll.discover_hint=Je kunt dit voorwerp maken met behulp van alchemie.

items.scrolls.exotic.scrollofsirenssong.name=rol van het lied van de sirenen
items.scrolls.exotic.scrollofsirenssong.prompt=Kies een doel
items.scrolls.exotic.scrollofsirenssong.no_target=De rol wordt geactiveerd zonder een doel.
items.scrolls.exotic.scrollofsirenssong.cancel=Je moet een doel kiezen.
items.scrolls.exotic.scrollofsirenssong.desc=Als je deze rol leest, klinkt er een verleidelijke melodie die een gerichte vijand boeit en hem permanent in een bondgenoot verandert! Andere vijanden die het horen, zijn tijdelijk gecharmeerd.\n\nBijzonder sterke vijanden kunnen het betoverende effect weerstaan en worden in plaats daarvan gecharmeerd.
items.scrolls.exotic.scrollofsirenssong$enthralled.name=geboeid
items.scrolls.exotic.scrollofsirenssong$enthralled.desc=Dit wezen is betoverd door de magie van een rol van het lied van de sirenen.\n\nEen betoverd personage is permanent je bondgenoot en vecht tegen alle vijanden die je tegenkomt.

items.scrolls.exotic.scrollofantimagic.name=rol van anti-magie
items.scrolls.exotic.scrollofantimagic.desc=De bezwering op deze rol zal je omringen met een magische aura die tijdelijk alle magische effecten blokkeert, schadelijk of nuttig. Dit omvat de meeste magische itemeffecten zoals toverstokken, rollen, ringen, artefacten, betoveringen en vloeken. Heroïsche harnasvaardigheden zijn echter sterk genoeg om hoe dan ook te werken.

items.scrolls.exotic.scrollofchallenge.name=rol van uitdaging
items.scrolls.exotic.scrollofchallenge.desc=Wanneer deze rol hardop wordt voorgelezen, ontketent er een geweldig gebrul dat vijanden naar de lezer trekt en tegelijkertijd een kleine arena om hen heen creëert.\n\nZolang de lezer in deze arena blijft, loopt hij 33% minder schade op van alle bronnen (dit wordt toegepast vóór andere vormen van schadebeperking), en hij verliest geen verzadiging.\n\nDe grootte van de arena groeit mee met de grootte van het gebied waarin de lezer zich bevindt. Het is bijzonder klein in sommige baas-gebieden.
items.scrolls.exotic.scrollofchallenge$challengearena.name=uitdagingsarena
items.scrolls.exotic.scrollofchallenge$challengearena.desc=Er is een magische arena om je heen ontstaan, gemarkeerd door een rode mist.\n\n.Terwijl je in de mist staat, neemt je honger niet toe en loop je 33%% minder schade op van alle bronnen. Als je andere bronnen van schadebeperking hebt (zoals harnassen), zijn deze van toepassing na de 33%% reductie.\n\nResterende beurten: %d.

items.scrolls.exotic.scrollofdivination.name=rol van waarzeggerij
items.scrolls.exotic.scrollofdivination.nothing_left=Er valt niets meer te identificeren!
items.scrolls.exotic.scrollofdivination.desc=Deze rol identificeert willekeurig vier soorten items die je momenteel niet kent. De geïdentificeerde typen kunnen de kleur van een toverdrank zijn, de runen van een rol of de edelsteen van een ring. De geïdentificeerde voorwerpen zijn niet noodzakelijk de voorwerpen die je bij je draagt.
items.scrolls.exotic.scrollofdivination$wnddivination.desc=Je rol van waarzeggerij heeft de volgende voorwerpen geïdentificeerd:

items.scrolls.exotic.scrollofdread.name=rol van angst
items.scrolls.exotic.scrollofdread.desc=Wanneer gelezen, straalt deze rol een flits van rood licht uit die ongelooflijke angst inboezemt bij alle vijanden in je gezichtsveld. Dit effect is zo groot dat de vijanden snel proberen de kerker te ontvluchten, om nooit meer terug gezien te worden!\n\nNet als bij de rol van terreur verdwijnt dit effect na verloop van tijd, of als de vijand wordt aangevallen.\n\nOp vijanden met een sterke wil, zoals eindbazen, werkt het als een rol van terreur.

items.scrolls.exotic.scrollofenchantment.name=rol van betovering
items.scrolls.exotic.scrollofenchantment.inv_title=Een voorwerp betoveren
items.scrolls.exotic.scrollofenchantment.weapon=Kies een betovering om op je wapen toe te passen.
items.scrolls.exotic.scrollofenchantment.armor=Kies een symbool om op je harnas toe te passen.
items.scrolls.exotic.scrollofenchantment.cancel=annuleer
items.scrolls.exotic.scrollofenchantment.cancel_warn=De rol wordt alsnog verbruikt als het effect niet wordt toegepast, weet je het zeker?
items.scrolls.exotic.scrollofenchantment.cancel_warn_yes=Ja, ik weet het zeker
items.scrolls.exotic.scrollofenchantment.cancel_warn_no=Nee, ik heb me bedacht
items.scrolls.exotic.scrollofenchantment.desc=Deze rol voorziet een wapen of harnas van krachtige magische energie. De lezer heeft zelfs een zekere mate van controle over welke magie wordt toegepast.

items.scrolls.exotic.scrollofforesight.name=rol van vooruitziende blik
items.scrolls.exotic.scrollofforesight.desc=Na het lezen van deze rol, worden de details van het nabijgelegen terrein kristalhelder aan de geest van de lezer gevoed. Dit effect houdt een aanzienlijke hoeveelheid tijd aan en onthult alle verborgen deuren of vallen, waardoor zoeken overbodig wordt.

items.scrolls.exotic.scrollofmetamorphosis.name=rol van metamorfose
items.scrolls.exotic.scrollofmetamorphosis.choose_desc=Kies een talent om te metamorfoseren.
items.scrolls.exotic.scrollofmetamorphosis.replace_desc=Kies een nieuw talent om je gemetamorfoseerde talent mee te vervangen.
items.scrolls.exotic.scrollofmetamorphosis.cancel_warn=De rol van metamorfose wordt alsnog verbruikt als het effect niet wordt toegepast, weet je het zeker?
items.scrolls.exotic.scrollofmetamorphosis.metamorphose_talent=metamorfoseer talent
items.scrolls.exotic.scrollofmetamorphosis.desc=Deze rol bevat krachtige transmutatiemagie, die van toepassing is op de lezer in plaats van op een voorwerp. Dankzij de magie van deze rol kun je één talent selecteren en vervangen door een van de vijf talenten van hetzelfde niveau uit verschillende heldenklassen!\n\nDit effect kan alleen van toepassing zijn op klassetalenten, niet op talenten die zijn verkregen uit subklassen of harnasvaardigheden. Talenten die je niet kunt gebruiken, worden niet als opties gegeven.

items.scrolls.exotic.scrollofmysticalenergy.name=rol van mystieke energie
items.scrolls.exotic.scrollofmysticalenergy.desc=De ruwe magische kracht die dit perkament bezit laadt, wanneer het wordt vrijgegeven, de gehanteerde artefacten van een gebruiker in de loop van de tijd op.

items.scrolls.exotic.scrollofpassage.name=rol van passage
items.scrolls.exotic.scrollofpassage.desc=De spreuk op dit perkament brengt de lezer onmiddellijk naar de dichtstbijzijnde regio van de verdieping erboven. Erg handig om snel naar een winkel te gaan.

items.scrolls.exotic.scrollofprismaticimage.name=rol van prismatisch beeld
items.scrolls.exotic.scrollofprismaticimage.desc=De bezwering op deze rol creëert een kleurrijke denkbeeldige tweeling van de lezer. Dit prismatische beeld fungeert als een zwakkere kloon van de lezer, met vergelijkbare verdediging maar lagere gezondheid en schade.\n\nHet prismatische beeld toont zichzelf wanneer er vijanden aanwezig zijn en probeert de lezer te verdedigen.\n\nAls er al een prismatisch beeld bestaat, wordt deze door het gebruik van de rol volledig genezen.

items.scrolls.exotic.scrollofpsionicblast.name=rol van paranormale ontploffing
items.scrolls.exotic.scrollofpsionicblast.ondeath=De paranormale ontploffing verscheurt je geest...
items.scrolls.exotic.scrollofpsionicblast.desc=Deze rol bevat ongelooflijke destructieve energie die kan worden gekanaliseerd om de geest van alle zichtbare wezens te vernietigen.\n\nEr is echter een flinke terugslag: de lezer raakt ook beschadigd, verblind en verzwakt. Hoe meer doelen de rol raakt, hoe minder zelfbeschadiging er wordt veroorzaakt.



###spells
items.spells.alchemize.name=alchemiseren
items.spells.alchemize.prompt=Alchemiseer een Voorwerp
items.spells.alchemize.desc=Deze spreuk bevat transmutatieve krachten die vergelijkbaar zijn met die in een alchemiepot. Met elke betovering kan de gebruiker een item (of een stapel items) in goud of alchemistische energie veranderen. Door drankjes of rollen in energie om te zetten, kun je ze zelfs identificeren!\n\nEen paar alchemistische toepassingen worden in winkels verkocht, maar er kunnen er nog veel meer worden gemaakt met behulp van alchemie door een zaadje, runensteen en een beetje alchemistische energie te combineren.
items.spells.alchemize$wndalchemizeitem.sell=Verander in %dg
items.spells.alchemize$wndalchemizeitem.sell_1=Verander 1 in %dg
items.spells.alchemize$wndalchemizeitem.sell_all=Zet alles om in %dg
items.spells.alchemize$wndalchemizeitem.energize=Verander in %d energie
items.spells.alchemize$wndalchemizeitem.energize_1=Verander 1 in %d energie
items.spells.alchemize$wndalchemizeitem.energize_all=Zet alles om in %d energie

items.spells.beaconofreturning.name=baken van terugkeer
items.spells.beaconofreturning.preventing=De sterke magische uitstraling van deze plek verhindert dat je de spreuk gebruikt!
items.spells.beaconofreturning.creatures=De psychische uitstraling van naburige wezens staat je op dit moment niet toe om te teleporteren.
items.spells.beaconofreturning.set=Het baken is ingesteld op je huidige plek.
items.spells.beaconofreturning.wnd_body=De instelling overschrijft de plek waarop het baken eerder was ingesteld.\n\nTerugkeren keert terug naar je laatst ingestelde plek en kost één keer gebruik van de spreuk.
items.spells.beaconofreturning.wnd_set=Instellen
items.spells.beaconofreturning.wnd_return=Terugkeren
items.spells.beaconofreturning.desc_set=Dit baken stond ergens op verdieping %d.
items.spells.beaconofreturning.desc=Deze ingewikkelde spreuk geeft de gebruiker de mogelijkheid om terug te keren naar een ingestelde plek, ongeacht de afstand. De spreuk wordt alleen gebruikt wanneer wordt teruggekeerd. Hij kan zo vaak worden ingesteld als je wilt, maar hij onthoudt alleen de meest recente plek waarop hij was ingesteld.

items.spells.curseinfusion.name=vloek-infusie
items.spells.curseinfusion.inv_title=Vervloek een voorwerp
items.spells.curseinfusion.desc=Deze spreuk voegt aan uitrusting dezelfde krachtige kwaadaardige magie toe die aanwezig is in DM-300. Het voorwerp waarop het wordt gebruikt, wordt onmiddellijk vervloekt en elke betovering of symbool die het heeft gehad, wordt opgeheven.\n\nIn het geval van wapens, harnassen en toverstokken, krijgt het voorwerp behalve vervloeking ook opwaarderingen. Vloek-infusie-opwaarderingen stapelen zich niet op en de opwaarderingen gaan verloren als het voorwerp niet meer vervloekt is.\n\nEr kunnen ook meerdere vloek-infusies worden gebruikt om de vloek op een wapen of harnas te veranderen.

items.spells.spell.ac_cast=SPREEK UIT
items.spells.spell.no_magic=Je kunt geen spreuken uitspreken terwijl je magisch immuun bent.
items.spells.spell.discover_hint=Je kunt dit voorwerp maken met behulp van alchemie.

items.spells.magicalinfusion.name=magische samenvoeging
items.spells.magicalinfusion.inv_title=Een voorwerp samenvoegen
items.spells.magicalinfusion.infuse=Je voorwerp is verrijkt met mysterieuze energie!
items.spells.magicalinfusion.desc=Deze spreuk heeft dezelfde magische kracht als een rol van opwaardering, maar in een stabielere vorm.\n\nNaast het normale effect van het opwaarderen van een voorwerp, wist het nooit een betovering, symbool of een vloek.

items.spells.magicalporter.name=magische drager
items.spells.magicalporter.inv_title=Een voorwerp laten dragen
items.spells.magicalporter.nowhere=Je kunt nergens een voorwerp naartoe laten dragen.
items.spells.magicalporter.desc=Deze spreuk vervoert op magische wijze elk voorwerp waar het op wordt uitgesproken. In tegenstelling tot het baken van de koopman worden de voorwerpen naar de ingang van de volgende baasverdieping getransporteerd.

items.spells.phaseshift.name=faseverschuiving
items.spells.phaseshift.no_target=Er valt daar niets te teleporteren.
items.spells.phaseshift.desc=Deze chaotische spreuk teleporteert elk personage waarop het is gericht naar een willekeurige plek op de huidige verdieping en verdooft ze voor een aanzienlijke tijd. Krachtige vijanden kunnen het verdovende effect weerstaan. Deze spreuk kan gericht zijn op een doelwit of op de gebruiker zelf.

items.spells.reclaimtrap.name=val-absorbering
items.spells.reclaimtrap.no_trap=Er is daar geen val.
items.spells.reclaimtrap.desc_trap=De spreuk is momenteel klaar om een _%s_ te activeren.
items.spells.reclaimtrap.desc=Deze spreuk bevat overblijfselen van de mechanische energie van DM-300. Als je het gebruikt op een actieve val, wordt de kracht van de val aan jou gehecht, zodat je het effect van de val op elke gewenste plek weer kunt activeren.\n\nSommige vallen werken echter niet overal en de spreuk kan slechts één val tegelijk absorberen.

items.spells.recycle.name=recyclen
items.spells.recycle.inv_title=Een voorwerp recyclen
items.spells.recycle.recycled=Je voorwerp is gerecycled tot: %s.
items.spells.recycle.desc=Deze spreuk bevat een mindere vorm van transmutatiemagie. Hoewel het niet werkt op uitrusting, transformeert deze spreuk een rol, toverdrank, zaadje, runensteen of getipt pijltje in een willekeurig voorwerp van hetzelfde type.

items.spells.summonelemental.name=elementair oproepen
items.spells.summonelemental.ac_imbue=VERRIJK
items.spells.summonelemental.imbue_prompt=Verrijken met een voorwerp
items.spells.summonelemental.desc=Deze spreuk kanaliseert de energie van de elementaire sintels die zijn gebruikt om het te maken, en stelt je in staat een vriendelijke elementair op te roepen om met je te vechten! Er kan slechts één elementair tegelijk worden opgeroepen, maar de spreuk kan opnieuw worden uitgesproken om het elementair zonder kosten naar je terug te laten keren.
items.spells.summonelemental.desc_newborn=De spreuk is momenteel niet verrijkt en roept een _pasgeboren elementair_ op zonder afstand aanval. Je kunt het met een geïdentificeerde toverdrank van vloeibare vlam, toverdrank van vorst, rol van opladen of rol van transmutatie verrijken om de spreuk te versterken, waardoor de volgende oproepen een elementair met volledige kracht wordt!
items.spells.summonelemental.desc_fire=De spreuk is momenteel heet om aan te raken en zal een _vuur elementair_ oproepen. Je kunt het met een ander voorwerp verrijken, maar de spreuk verliest dan zijn huidige invloed.
items.spells.summonelemental.desc_frost=De spreuk voelt momenteel koud aan en zal een _vorst elementair_ oproepen. Je kunt het met een ander voorwerp verrijken, maar de spreuk verliest dan zijn huidige invloed.
items.spells.summonelemental.desc_shock=De spreuk straalt momenteel statische energie uit en zal een _schok elementair_ oproepen. Je kunt het met een ander voorwerp verrijken, maar de spreuk verliest dan zijn huidige invloed.
items.spells.summonelemental.desc_chaos=De spreuk straalt momenteel chaotische energie uit en zal een _chaos elementair_ oproepen. Je kunt het met een ander voorwerp verrijken, maar de spreuk verliest dan zijn huidige invloed.

items.spells.targetedspell.prompt=Kies een doel
items.spells.targetedspell.inv_title=Een voorwerp samenvoegen

items.spells.telekineticgrab.name=telekinetische grijper
items.spells.telekineticgrab.cant_grab=Dat kun je niet pakken.
items.spells.telekineticgrab.no_target=Er valt daar niets te pakken.
items.spells.telekineticgrab.desc=Met deze spreuk kan de gebruiker op afstand elk voorwerp van de grond pakken, of elk werpwapen dat aan een vijand vastzit!\n\nHet kan niet worden gebruikt om voorwerpen te grijpen die iemand anders bezit, of om voorwerpen met inhoud zoals kisten te grijpen.

items.spells.unstablespell.name=onstabiele spreuk
items.spells.unstablespell.desc=Dit kleine zwarte vierkante kristal heeft bewegende runensymbolen op elk oppervlak.\n\nIndien geactiveerd, activeert het het effect van een willekeurige rol. Het rol-effect zal gevechtsgericht zijn als er vijanden in je gezichtsveld zijn, en zal anders altijd niet-gevechtsgericht zijn.

items.spells.wildenergy.name=wilde energie
items.spells.wildenergy.desc=Deze spreuk bevat een deel van de vervloekte energie die de DM-300 aandreef. Wanneer het wordt gebruikt, laadt het je toverstokken en versleten artefacten op, terwijl het ook een willekeurig vervloekt toverstokeffect activeert. Je kunt echter een richting kiezen waarin deze vervloekte magie moet schieten.


###runestones
items.stones.inventorystone.ac_use=GEBRUIK

items.stones.runestone$placeholder.name=runensteen
items.stones.runestone.discover_hint=Je kunt dit item zomaar in de kerker vinden, of maak het met alchemie.

items.stones.stoneofaggression.name=steen van agressie
items.stones.stoneofaggression.desc=Wanneer deze steen naar een bondgenoot of vijand wordt gegooid, worden alle vijanden in de buurt gedwongen om dat personage voor een korte tijd aan te vallen.\n\nBaasvijanden kunnen het effect echter weerstaan, waardoor de duur aanzienlijk wordt verkort en minder schade wordt aangericht door de aanvallen van hun volgelingen.
items.stones.stoneofaggression$aggression.name=doelwit
items.stones.stoneofaggression$aggression.desc=Manipulatieve magie zorgt ervoor dat alle vijanden in de buurt voorkeur geven om dit personage aan te vallen.\n\nResterende beurten: %s.

items.stones.stoneofaugmentation.name=steen van verbetering
items.stones.stoneofaugmentation.inv_title=Een voorwerp verbeteren
items.stones.stoneofaugmentation.desc=Deze runensteen bezit krachtige magie die uitrusting kan versterken om de ene eigenschap te versterken ten koste van de andere. \n\nGebruik op een wapen om de snelheid of schade te verhogen. Werpwapens zullen ook aan duurzaamheid winnen of verliezen in verhouding tot hun snelheid. \n\nGebruik op een harnas om de verdediging of ontwijking te verbeteren.
items.stones.stoneofaugmentation.discover_hint=Je kunt dit voorwerp in een winkel kopen of zelf maken met behulp van alchemie.
items.stones.stoneofaugmentation$wndaugment.choice=Wat zou je willen verbeteren?
items.stones.stoneofaugmentation$wndaugment.speed=Snelheid
items.stones.stoneofaugmentation$wndaugment.damage=Schade
items.stones.stoneofaugmentation$wndaugment.evasion=Ontduiking
items.stones.stoneofaugmentation$wndaugment.defense=Verdediging
items.stones.stoneofaugmentation$wndaugment.none=Verwijder verbetering
items.stones.stoneofaugmentation$wndaugment.cancel=Laat maar

items.stones.stoneofblast.name=steen van ontploffing
items.stones.stoneofblast.desc=Deze runensteen ontploft onmiddellijk op de plek waar hij naartoe wordt gegooid. Net als een bom brengt de explosie schade toe aan alles in de buurt.

items.stones.stoneofblink.name=steen van toesnellen
items.stones.stoneofblink.desc=Deze runensteen teleporteert de gebruiker naar de plek waar de steen naartoe wordt gegooid.

items.stones.stoneofclairvoyance.name=steen van helderziendheid
items.stones.stoneofclairvoyance.desc=Deze steen onthult onmiddellijk alle tegels in een zeer groot gebied rondom waar hij wordt gegooid. Het effect reikt zelfs door muren.

items.stones.stoneofdeepsleep.name=steen van diepe slaap
items.stones.stoneofdeepsleep.desc=Wanneer deze steen naar een vijand wordt gegooid, brengt hij het in een diepe magische slaap. Magisch slapende vijanden slapen voor altijd totdat ze gestoord worden.

items.stones.stoneofdetectmagic.name=steen van magie detectie
items.stones.stoneofdetectmagic.inv_title=Detecteer een voorwerp
items.stones.stoneofdetectmagic.detected_none=Er is geen magie waargenomen die dit voorwerp beïnvloedt.
items.stones.stoneofdetectmagic.detected_both=Je voelt beide goede en kwaadaardige magie invloed hebben op dit voorwerp!
items.stones.stoneofdetectmagic.detected_good=Je voelt dat positieve magie dit item beïnvloedt!
items.stones.stoneofdetectmagic.detected_bad=Je voelt dat een kwaadaardige magie invloed heeft op dit voorwerp!
items.stones.stoneofdetectmagic.desc=Deze runensteen kan magie detecteren die een item beïnvloedt. Als je deze steen gebruikt op een onbekend item, weet je of het item is beïnvloed door een kwaadaardige vloek en of het is beïnvloed door positieve magie zoals een betovering of opwaarderingen.

items.stones.stoneofdisarming.name=steen van ontwapening
items.stones.stoneofdisarming.desc=Deze runensteen bevat magie die kwaadaardige vallen kan uitschakelen die in de kerker verborgen zijn. Het ontwapent tot 9 vallen rond het gebied waarnaar het wordt gegooid.

items.stones.stoneofenchantment.name=steen van betovering
items.stones.stoneofenchantment.inv_title=Betover een voorwerp
items.stones.stoneofenchantment.weapon=Je wapen gloeit in de duisternis!
items.stones.stoneofenchantment.armor=Je harnas gloeit in de duisternis!
items.stones.stoneofenchantment.desc=Deze runensteen bezit betoverende magie. In tegenstelling tot een rol van opwaardering, vergroot het de directe kracht van een voorwerp niet. In plaats daarvan verrijkt het een wapen of harnas met een betovering, waardoor het een nieuwe kracht krijgt.

items.stones.stoneoffear.name=steen van angst
items.stones.stoneoffear.desc=Wanneer deze steen op een personage wordt gegooid, worden ze overweldigd door angst en zullen zich omdraaien en vluchten. Als je een vluchtend personage aanvalt, duurt het effect minder lang.

items.stones.stoneofflock.name=steen van kudde
items.stones.stoneofflock.desc=Deze runensteen roept magische schapen op voor een korte tijd rond de plek waar het naartoe wordt gegooid.

items.stones.stoneofintuition.name=steen van intuïtie
items.stones.stoneofintuition.inv_title=Kies een voorwerp
items.stones.stoneofintuition.desc=Deze runensteen bevat een zwakkere versie van de magie die te vinden is in rollen van identificatie. In plaats van een item direct te identificeren, werkt het op je intuïtie, waardoor je kunt proberen het type van een drankje, rol of ring te identificeren door te raden.
items.stones.stoneofintuition.break_info=Je kunt stenen van intuïtie twee keer gebruiken voordat er één kapot gaat. _Bij het volgende gebruik zul je geen steen verbruiken_.
items.stones.stoneofintuition.break_warn=Je hebt eerder een steen van intuïtie gebruikt, dus _je volgende gebruik zal een steen verbruiken_.
items.stones.stoneofintuition$wndguess.text=Raad wat het type van het niet-geïdentificeerde voorwerp is. Als je het goed raadt, wordt het type geïdentificeerd!
items.stones.stoneofintuition$wndguess.correct=Juist. Het type van het voorwerp is geïdentificeerd!
items.stones.stoneofintuition$wndguess.incorrect=Je gok was onjuist.
items.stones.stoneofintuition$wndguess.break=Jouw steen van intuïtie vergaat tot stof...

items.stones.stoneofshock.name=steen van schok
items.stones.stoneofshock.desc=Deze runensteen ontketent een explosie van elektrische energie die alle nabije doelen kort verdooft en de toverstok van de werper oplaadt voor elke treffer.


###trinkets
items.trinkets.chaoticcenser.name=chaotisch wierookvat
items.trinkets.chaoticcenser.spew=Je wierookvat staat op het punt om uit te spuwen: %s.
items.trinkets.chaoticcenser.desc=Na enige tijd in de alchemiepot lijkt het erop dat deze wierookbrandende wierookvat helemaal zelf rook produceert! Deze gassen hopen zich op en zullen in willekeurige richtingen en semi-willekeurige intervallen uit de wierookvat spuiten. Het lijkt in staat om allerlei soorten gassen te produceren, maar je krijgt een waarschuwing vlak voordat de wierookvat wordt geactiveerd.
items.trinkets.chaoticcenser.typical_stats_desc=Doorgaans zal deze snuisterij ongeveer elke _%d_ beurten een schadelijk gas in de buurt van een vijand voortbrengen. Het gas verschijnt alleen als er vijanden aanwezig zijn. Op hogere niveaus is de kans groter dat deze gassen exotisch en krachtig zijn.
items.trinkets.chaoticcenser.stats_desc=Op zijn huidig niveau zal deze snuisterij ongeveer elke _%d_ beurten een schadelijk gas in de buurt van een vijand voortbrengen. Het gas verschijnt alleen als er vijanden aanwezig zijn. Op hogere niveaus is de kans groter dat deze gassen exotisch en krachtig zijn.

items.trinkets.crackedspyglass.name=gebarsten verrekijker
items.trinkets.crackedspyglass.desc=Deze handtelescoop zou een toonbeeld van groot en nauwkeurig vakmanschap zijn, ware het niet dat er een barst in de lens zit. De verrekijker lijkt je te helpen door nieuwe voorwerpen in de kerker te onthullen, maar door de scheur in de lens zijn de onthulde voorwerpen vrij moeilijk te zien!
items.trinkets.crackedspyglass.typical_stats_desc=Normaal gesproken heeft deze snuisterij een _%1$s%% kans_ om een extra verborgen item te creëren op elke verdieping die geen eindbaas heeft.
items.trinkets.crackedspyglass.stats_desc=Op zijn huidig niveau heeft deze snuisterij een _%1$s%% kans_ om een extra verborgen item te creëren op elke verdieping die geen eindbaas heeft.
items.trinkets.crackedspyglass.stats_desc_upgraded=Op het huidige niveau heeft dit snuisterijtje een _kans van 100%%_ om op elke verdieping die geen eindbaas is een extra verborgen voorwerp te creëren, en een _%1$s%% kans_ om een tweede extra verborgen voorwerp te creëren.

items.trinkets.dimensionalsundial.name=dimensionale zonnewijzer
items.trinkets.dimensionalsundial.warning=Je zonnewijzer werpt geen schaduw, je voelt je ongemakkelijk.
items.trinkets.dimensionalsundial.desc=Deze kleine draagbare zonnewijzer kan op de een of andere manier een schaduw werpen in de diepten van de kerker, zelfs als je hem niet rechtop houdt. Nog vreemder is dat de positie van de schaduw geen relatie lijkt te hebben met de zon in deze wereld. Als er geen schaduw wordt geworpen, lijkt de zonnewijzer gevaar aan te trekken
items.trinkets.dimensionalsundial.typical_stats_desc=Doorgaans vermindert deze snuisterij de verschijnsnelheid van vijanden met _%1$d%%_ overdag in het echte leven (8.00 - 20.00 uur), en verhoogt de verschijnsnelheid van vijanden met _%2$d%%_ 's nachts (20.00 - 8.00 uur).
items.trinkets.dimensionalsundial.stats_desc=Op het huidige niveau vermindert deze snuisterij de verschijnsnelheid van vijanden met _%1$d%%_ overdag in het echte leven (8.00 - 20.00 uur), en verhoogt de verschijnsnelheid van vijanden met _%2$d%%_ 's nachts (20.00 - 8.00 uur).

items.trinkets.exoticcrystals.name=exotische kristallen
items.trinkets.exoticcrystals.desc=Deze kleine roze kristallen hebben dezelfde vorm als kristallen van alchemistische energie. Hoewel ze niet rechtstreeks voor energie kunnen worden gebruikt, lijken ze op de een of andere manier de drankjes en rollen die je tegenkomt te beïnvloeden
items.trinkets.exoticcrystals.typical_stats_desc=Doorgaans zal deze snuisterij _%s%%_ van drankjes of rollen die je tegenkomt vervangen door hun exotische equivalenten. Dit heeft geen invloed op toverdrank van kracht, rol van opwaardering of items die worden gegenereerd om gevarenkamers op te lossen.
items.trinkets.exoticcrystals.stats_desc=Op het huidige niveau zal deze snuisterij _%s%%_ van drankjes of rollen die je tegenkomt vervangen door hun exotische equivalenten. Dit heeft geen invloed op toverdrank van kracht, rol van opwaardering of items die worden gegenereerd om gevarenkamers op te lossen.

items.trinkets.eyeofnewt.name=oog van een salamander
items.trinkets.eyeofnewt.desc=Het oog van deze goud-zwarte salamander is een veelgebruikt ingrediënt, nu verbeterd tot een snuisterij. Het oog lijkt je gezichtsvermogen te verminderen in ruil voor het feit dat je de dingen op andere manieren kunt zien.
items.trinkets.eyeofnewt.typical_stats_desc=Doorgaans verkleint deze snuisterij je zichtbereik met _%1$s%%_, maar geeft je ook geestvisie op vijanden binnen _%2$d_ tegels.
items.trinkets.eyeofnewt.stats_desc=Op het huidige niveau verkleint deze snuisterij je zichtbereik met _%1$s%%_, maar geeft je ook geestvisie op vijanden binnen _%2$d_ tegels.

items.trinkets.ferrettuft.name=frettenplukje
items.trinkets.ferrettuft.desc=Een plukje zachte witte frettenvacht, bij elkaar gehouden door een limoenkleurig lintje vastgebonden in een strik. Fretten staan bekend om hun behendigheid, ondeugendheid en gebrek aan integriteit. Een deel van die kracht lijkt van de snuisterij af te stralen, waardoor ontwijking van alles in de buurt verbeterd.
items.trinkets.ferrettuft.typical_stats_desc=Doorgaans zal deze snuisterij de ontwijkingskans van alle personages met _%1$s%%_ verhogen.
items.trinkets.ferrettuft.stats_desc=Op het huidige niveau zal deze  snuisterij de ontwijkingskans van alle personages met _%1$s%%_ verhogen.

items.trinkets.mimictooth.name=tand van een nabootser
items.trinkets.mimictooth.desc=Deze grote scherpe tand moet getrokken zijn uit een zeer ongelukkige nabootser. Het lijkt de nabootsers van de kerker te beïnvloeden, waardoor ze frequenter en gevaarlijker worden.
items.trinkets.mimictooth.typical_stats_desc=Doorgaans zal deze snuisterij allerlei soorten nabootsers _%1$sx_ gebruikelijker maken, nabootsers veel moeilijker te detecteren maken en elke verdieping een _%2$s%%_ kans geven om een extra onopvallende ebbenhouten nabootser te bevatten.
items.trinkets.mimictooth.stats_desc=Op het huidige niveau zal deze snuisterij allerlei soorten nabootsers _%1$sx_ gebruikelijker maken, nabootsers veel moeilijker te detecteren maken en elke verdieping een _%2$s%%_ kans geven om een extra onopvallende ebbenhouten nabootser te bevatten.

items.trinkets.mossyclump.name=bemoste massa
items.trinkets.mossyclump.desc=Deze massa nat mos lijkt zijn vocht vast te houden, hoe hard je er ook in knijpt. Het lijkt op magische wijze verbonden te zijn met de kerker zelf, waardoor de kans groter is dat gras en water verschijnen
items.trinkets.mossyclump.typical_stats_desc=Doorgaans zal deze snuisterij ervoor zorgen dat _%d%%_ van themaloze vloeren gevuld worden met water of gras..\n\nDeze snuisterij kost een grotere hoeveelheid energie om op te waarderen.
items.trinkets.mossyclump.stats_desc=Op het huidige niveau zal deze snuisterij ervoor zorgen dat _%d%%_ van themaloze vloeren gevuld worden met water of gras..\n\nDeze snuisterij kost een grotere hoeveelheid energie om op te waarderen.

items.trinkets.parchmentscrap.name=perkament rest
items.trinkets.parchmentscrap.desc=Dit kleine stukje perkament ziet eruit alsof het uit een boekrol komt. Het heeft een deel van zijn magie behouden en lijkt de wapens en bepantsering in de kerker te beïnvloeden
items.trinkets.parchmentscrap.typical_stats_desc=Doorgaans zal deze snuisterij betoveringen en symbolen _%dx_ vaker laten voorkomen, en vloeken op wapens en bepantsering _%sx_ vaker laten voorkomen. Vervloekingen op toverstokken, ringen of artefacten worden niet beïnvloed.\n\nDeze snuisterij kost een grotere hoeveelheid energie om op te waarderen.
items.trinkets.parchmentscrap.stats_desc=Op het huidige niveau zal deze snuisterij betoveringen en symbolen _%dx_ vaker laten voorkomen, en vloeken op wapens en bepantsering _%sx_ vaker laten voorkomen. Vervloekingen op toverstokken, ringen of artefacten worden niet beïnvloed.\n\nDeze snuisterij kost een grotere hoeveelheid energie om op te waarderen.

items.trinkets.petrifiedseed.name=versteend zaad
items.trinkets.petrifiedseed.desc=Dit zaad is gefossiliseerd, hetzij door langzame geologische processen, hetzij door magie. Het zaad lijkt op magische wijze de flora van de kerker te beïnvloeden, waarbij af en toe plantenzaden worden vervangen door runenstenen.
items.trinkets.petrifiedseed.typical_stats_desc=Doorgaans zal deze snuisterij  ervoor zorgen dat vertrapt gras in _%1$s%%_ van de gevallen runenstenen laat vallen in plaats van zaden, en ook dat hoog gras in _%2$s%%_ van de gevallen voorwerpen laat vallen.
items.trinkets.petrifiedseed.stats_desc=Op zijn huidige niveau zal deze snuisterij ervoor zorgen dat vertrapt gras in _%1$s%%_ van de gevallen runenstenen laat vallen in plaats van zaden, en ook dat hoog gras in _%2$s%%_ van de gevallen voorwerpen laat vallen.

items.trinkets.ratskull.name=schedel van een rat
items.trinkets.ratskull.desc=Deze macabere snuisterij is niet veel groter dan de schedel van een normale rat, wat op de een of andere manier een zeldzaamheid is in deze kerker. De magische invloed van de schedel lijkt de zeldzamere bewoners van de kerker aan te trekken, waardoor ze veel vaker verschijnen.
items.trinkets.ratskull.typical_stats_desc=Doorgaans zal deze snuisterij ervoor zorgen dat zeldzame exotische vijanden _%dx_ zo waarschijnlijk kunnen verschijnen. De schedel is echter slechts half zo effectief in het aantrekken van kristallen nabootsers en gepantserde beelden.
items.trinkets.ratskull.stats_desc=Op het huidige niveau zal deze snuisterij ervoor zorgen dat zeldzame exotische vijanden _%dx_ zo waarschijnlijk kunnen verschijnen. De schedel is echter slechts half zo effectief in het aantrekken van kristallen nabootsers en gepantserde beelden.

items.trinkets.saltcube.name=zout blokje
items.trinkets.saltcube.desc=Deze grote zoutkristal werd in een bijna perfecte kubusvorm gesneden en slaagde er op de een of andere manier in om de helft van het water uit de alchemiepot te laten lopen in plaats van op te lossen. Het lijkt op magische wijze het voedsel dat je eet te dehydrateren en te conserveren, waardoor je langer een vol gevoel hebt, maar ook je herstel van je gezondheid wordt vertraagd als je niet verhongert.
items.trinkets.saltcube.typical_stats_desc=Doorgaans zal deze snuisterij de tijd voordat je honger krijgt met _%1$s%%_ verlengen, maar het zal ook de mate waarin je gezondheid herstelt met _%2$s%%_ verminderen. Tenzij de verdieping vergrendeld is.
items.trinkets.saltcube.stats_desc=Op het huidige niveau zal deze snuisterij de tijd voordat je honger krijgt met _%1$s%%_ verlengen, maar ook de snelheid waarmee je gezondheid herstelt met _%2$s%%_ verlagen. Tenzij de verdieping vergrendeld is.

items.trinkets.shardofoblivion.name=scherf van vergetelheid
items.trinkets.shardofoblivion.desc=Na het stoven in de alchemiepot is dit kleine scherfje vervloekt metaal veranderd in... niets? Licht lijkt eromheen te buigen en het blijft op zijn plaats zweven als je het niet vasthoudt. Het scherfje lijkt op magische wijze kracht te putten uit je onwetendheid, dus het is waarschijnlijk het beste om er niet te veel over na te denken.
items.trinkets.shardofoblivion.typical_stats_desc=Doorgaans verhoogt deze snuisterij de ratio waarmee vijanden buit laten vallen met 20%% voor elk ongeïdentificeerd item dat je hebt uitgerust of recent hebt gebruikt, tot een maximum van _%d voorwerp(en)_. De scherf voorkomt ook dat je automatisch uitrusting identificeert, maar kan worden gebruikt om handmatig items te identificeren die er klaar voor zijn.
items.trinkets.shardofoblivion.stats_desc=Op het huidige niveau verhoogt deze snuisterij de ratio waarmee vijanden buit laten vallen met 20%% voor elk ongeïdentificeerd item dat je hebt uitgerust of recent hebt gebruikt, tot een maximum van _%d voorwerp(en)_. De scherf voorkomt ook dat je automatisch uitrusting identificeert, maar kan worden gebruikt om handmatig items te identificeren die er klaar voor zijn.
items.trinkets.shardofoblivion.ac_identify=IDENTIFICEREN
items.trinkets.shardofoblivion.identify_prompt=Identificeer een Item
items.trinkets.shardofoblivion.identify_ready=Een item is klaar om te geïdentificeerd te worden: %s. Gebruik je scherf van vergetelheid erop om het te identificeren.
items.trinkets.shardofoblivion.identify_ready_worn=Je gedragen items zijn nu allemaal klaar om te geïdentificeerd te worden. Gebruik je scherf van vergetelheid op items om ze te identificeren.
items.trinkets.shardofoblivion.identify_not_yet=Dat item kan nog niet geïdentificeerd worden.
items.trinkets.shardofoblivion.identify=Je identificeert het item!
items.trinkets.shardofoblivion$wandusetracker.name=Ongeïdentificeerde Toverstaf Gebruikt
items.trinkets.shardofoblivion$wandusetracker.desc=Je hebt onlangs een ongeïdentificeerde toverstok gebruikt, die voor een tijdje geldt als een stuk gebruikte, ongeïdentificeerde uitrusting voor de scherf van de vergetelheid.\n\nResterende beurten: %s.
items.trinkets.shardofoblivion$thrownusetracker.name=Onbekend werpwapen gebruikt
items.trinkets.shardofoblivion$thrownusetracker.desc=Je hebt onlangs een ongeïdentificeerd werpwapen gebruikt, wat een tijdje telt als één stuk ongeïdentificeerde uitrusting voor de scherf van vergetelheid.\n\nResterende beurten: %s.

items.trinkets.thirteenleafclover.name=klavertje dertien
items.trinkets.thirteenleafclover.desc=Op de een of andere manier heeft het stomen in de alchemiepot ervoor gezorgd dat deze klaver een bosje extra bladeren heeft gekregen! Het is niet echt duidelijk of deze snuisterij geluk of pech brengt, misschien zal deze snuisterij je geluk chaotischer maken?
items.trinkets.thirteenleafclover.typical_stats_desc=Doorgaans zorgt deze snuisterij ervoor dat je _%1$d%%_ van de tijd maximale schade aanricht, en _%2$d%%_ van de tijd de minimale schade.
items.trinkets.thirteenleafclover.stats_desc=Op het huidige niveau zorgt deze snuisterij ervoor dat je _%1$d%%_ van de tijd maximale schade aanricht, en _%2$d%%_ van de tijd de minimale schade.

items.trinkets.trapmechanism.name=valmechanisme
items.trinkets.trapmechanism.desc=Het kernmechanisme van een van de valkuilen van de kerker, zorgvuldig uit de vloer gesneden zodat deze kan worden gedragen. Het lijkt op magische wijze verbonden te zijn met de kerker zelf, waardoor gevaarlijk terrein vaker voorkomt, maar ook je affiniteit ermee toeneemt.
items.trinkets.trapmechanism.typical_stats_desc=Dorgaans zal deze snuisterij ervoor zorgen dat _%1$d%%_ van de themaloze vloeren gevuld worden met vallen of afgronden. Bovendien zullen _%2$d%%_ van de verborgen vallen van de kerker zichtbaar zijn.
items.trinkets.trapmechanism.stats_desc=Op het huidige niveau zal deze snuisterij ervoor zorgen dat _%1$d%%_ van de themaloze vloeren gevuld worden met vallen of afgronden. Bovendien zullen _%2$d%%_ van de verborgen vallen van de kerker zichtbaar zijn.

items.trinkets.vialofblood.name=flesje met bloed
items.trinkets.vialofblood.desc=Dit dunne flesje bevat het bloed van een bewoner van de kerker, het beweegt langzaam als je het flesje draait. Het lijkt op magische wijze helende effecten te versterken, maar ze ook te vertragen.
items.trinkets.vialofblood.typical_stats_desc=Doorgaans verhoogt deze snuisterij de algehele gezondheid die je krijgt door het drinken van genezingsdrankjes, waterzakken of bronnen met _%1$s%%_. Deze helende effecten zullen echter ook langzamer optreden, en regenereren maximaal _%2$s_ gezondheid per beurt (dit schaalt met heldenniveau).
items.trinkets.vialofblood.stats_desc=Op het huidige niveau verhoogt deze snuisterij de algehele gezondheid die je krijgt door het drinken van genezingsdrankjes, waterzakken of bronnen met _%1$s%%_. Deze helende effecten zullen echter ook langzamer optreden, en regenereren maximaal _%2$s_ gezondheid per beurt (dit schaalt met heldenniveau).

items.trinkets.wondrousresin.name=wonderbaarlijk hars
items.trinkets.wondrousresin.desc=Deze glinsterende blauwe hars lijkt de gedistilleerde essentie van de magie van een vervloekte toverstok te hebben. De magie van de alchemiepot leek het enigszins te stabiliseren, en het heeft nu invloed op je toverstokken
items.trinkets.wondrousresin.typical_stats_desc=Doorgaans zal deze snuisterij ervoor zorgen dat de effecten van vervloekte toverstokken _%1$s%%_ van de tijd neutraal of positief worden, en zal ervoor zorgen dat onvervloekte toverstokken _%2$s%%_ van de tijd een neutrale of positief vervloekte schicht afvuren.\n\nDeze snuisterij kost een grotere hoeveelheid energie om op te waarderen.
items.trinkets.wondrousresin.stats_desc=Op het huidige niveau zal deze snuisterij ervoor zorgen dat de effecten van vervloekte toverstokken _%1$s%%_ van de tijd neutraal of positief worden, en zal ervoor zorgen dat onvervloekte toverstokken _%2$s%%_ van de tijd een neutrale of positief vervloekte schicht afvuren.\n\nDeze snuisterij kost een grotere hoeveelheid energie om op te waarderen.

items.trinkets.trinketcatalyst.name=magische katalysator
items.trinkets.trinketcatalyst.window_title=een snuisterij maken
items.trinkets.trinketcatalyst.window_text=Het water begint te gloeien terwijl je de katalysator toevoegt. Er zijn een paar items in de buurt die je van energie kunt voorzien om er een magische snuisterij van te maken.
items.trinkets.trinketcatalyst.desc=Deze bal van magisch goudkleurig stof glinstert in de duisternis van de kerker. Deze katalysator kan met een beetje alchemistische energie in een alchemiepot worden gebruikt om een unieke snuisterij te produceren.\n\nSnuisterijen bieden verschillende effecten die de kerker of zijn bewoners enigszins veranderen. Snuisterijen kunnen worden opgewaardeerd met meer energie om hun effect krachtiger te maken, of men kan het laten vallen om het effect volledig te laten verdwijnen.
items.trinkets.trinketcatalyst$randomtrinket.name=willekeurige snuisterij
items.trinkets.trinketcatalyst$randomtrinket.desc=Een item in de buurt zit vast in een zakje dat je niet open krijgt.\n\nHet alchemieproces zal het zakje oplossen, maar je weet niet welke snuisterij je krijgt totdat je het doet!

items.trinkets.trinket.discover_hint=Dit voorwerp kan een optie zijn wanneer je een snuisterij maakt via alchemie.
items.trinkets.trinket$placeholder.name=snuisterij

