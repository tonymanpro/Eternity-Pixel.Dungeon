items.artifacts.skeletonkey.iron_charges=Mở một ổ khoá bình thường cần 1 năng lượng.
items.artifacts.skeletonkey.gold_charges=Mở một ổ khoá vàng cần 2 năng lượng.
items.artifacts.skeletonkey.lock_charges=Khoá một cánh cửa cần 2 năng lượng.
items.artifacts.skeletonkey.wall_charges=Tạo ra một bức tường tạm thời cần 2 năng lượng.
items.artifacts.skeletonkey.crystal_charges=Mở một ổ khoá pha lê cần 5 năng lượng.
items.artifacts.skeletonkey.wont_open=Chiếc chìa không chịu vừa vào ổ khoá này vì lí do nào đó.
items.artifacts.skeletonkey.locked_with_key=Cánh cửa đó đã bị khoá bởi chìa khoá xương của bạn.
items.artifacts.skeletonkey.force_lock=Ổ khoá đã yếu đi khi không có chiếc chìa khoá xương của bạn. Bạn cố mở nó và thành công.
items.artifacts.skeletonkey.discard=Bạn vứt chìa khoá thừa của mình đi.
items.artifacts.skeletonkey.levelup=Chiếc chìa khoá xương của bạn trở nên mạnh hơn!
items.artifacts.skeletonkey.desc=Một chiếc chìa khoá trông có vẻ quan trọng với phần đầu được tạo hình giống một chiếc đầu lâu. Các răng của nó có vẻ khác đi mỗi lần bạn nhìn vào chúng.
items.artifacts.skeletonkey.desc_worn=Chiếc chìa khoá phép thuật này có vẻ mạnh hơn khi bạn dùng nó thay cho các chìa khoá thông thường của hầm ngục. Nó có thể được đút vào gần như bất cứ ổ khoá nào của hầm ngục để mở hoặc khoá chúng, bao gồm các cánh cửa chưa từng bị khoá trước đó.\n\nChiếc chìa còn có thể được sử dụng vào không gian trống theo một hướng chính hoặc hướng chéo để "khoá" không khí đằng trước bạn, tạo ra một bức tường rắn rộng 3 ô kéo dài trong 10 lượt. Việc khoá sẽ đẩy kẻ địch đi nếu có khoảng trống để làm vậy.
items.artifacts.skeletonkey.desc_cursed=Chiếc chìa khoá bị nguyền có vẻ đang chủ động không vừa vào bất cứ ổ khoá nào, và thậm chí còn đang khiến bạn khó dùng các chìa khoá khác của bạn (nhưng không phải bất khả thi).
items.artifacts.skeletonkey$keywall.desc=Một bức tường phép thuật tạm thời đã được đặt ở đây bởi chiếc chìa khoá xương.

items.artifacts.talismanofforesight.name=bùa tiên tri
items.artifacts.talismanofforesight.ac_scry=SOI
items.artifacts.talismanofforesight.low_charge=Tấm bùa cần ít nhất 5% năng lượng để soi.
items.artifacts.talismanofforesight.prompt=Chọn một vị trí để kiểm tra.
items.artifacts.talismanofforesight.levelup=Tấm bùa của bạn trở nên mạnh hơn!
items.artifacts.talismanofforesight.full_charge=Tấm bùa của bạn đã được sạc đầy!
items.artifacts.talismanofforesight.desc=Một tảng đá mượt với những vết chạm khắc kì lạ trên nó. Bạn cảm thấy như là nó đang quan sát mọi thứ xung quanh bạn, để mắt đến mọi thứ được ẩn giấu.
items.artifacts.talismanofforesight.desc_worn=Cầm tấm bùa trên tay, bạn có cảm giác như các giác quan của mình được cường hóa. Tấm bùa dần dần tích tụ năng lượng theo thời gian và khi bạn phát hiện ra những cánh cửa hoặc bẫy ẩn. \n\nTấm bùa có thể tiêu năng lượng của nó để 'soi' một vùng hình nón, tiết lộ tất cả các ô và bí mật trong vùng được soi và sẽ cho bạn nhìn thấy kẻ thù và vật phẩm trong một thời gian ngắn.
items.artifacts.talismanofforesight.desc_cursed=Tấm bùa bị nguyền nhìn chằm chằm vào bạn, làm mờ các giác quan của bạn.
items.artifacts.talismanofforesight$foresight.name=nhìn trước
items.artifacts.talismanofforesight$foresight.uneasy=Bạn cảm thấy không thoải mái.
items.artifacts.talismanofforesight$foresight.desc=Bạn cảm thấy rất lo ngại, như là có mối nguy hiểm ở gần.

items.artifacts.timekeepershourglass.name=đồng hồ cát của kẻ giữ thời gian
items.artifacts.timekeepershourglass.ac_activate=KÍCH HOẠT
items.artifacts.timekeepershourglass.deactivate=Bạn hủy kích hoạt "đóng băng thời gian".
items.artifacts.timekeepershourglass.no_charge=Đồng hồ cát của bạn chưa hồi đủ năng lượng để có thể sử dụng được.
items.artifacts.timekeepershourglass.cursed=Bạn không thể sử dụng một chiếc đồng hồ cát bị nguyền rủa.
items.artifacts.timekeepershourglass.onstasis=Thế giới dường như thay đổi xung quanh bạn ngay lập tức.
items.artifacts.timekeepershourglass.onfreeze=Mọi thứ xung bạn bỗng nhiên đóng băng.
items.artifacts.timekeepershourglass.stasis=Ngưng đọng bản thân
items.artifacts.timekeepershourglass.freeze=Đóng băng thời gian xung quanh tôi
items.artifacts.timekeepershourglass.prompt=Bạn muốn sử dụng phép thuật của chiếc đồng hồ cát như thế nào?\n\nKhi ngưng đọng, thời gian sẽ trôi bình thường trong khi bạn bất động và hoàn toàn bất khả xâm phạm, tiêu tốn lên đến 2 năng lượng một lúc.\n\nKhi thời gian bị đóng băng, bạn có thể di chuyển tựa như mọi hành động của bạn không tiêu tốn chút thời gian nào. Điều này có thể bị vô hiệu bằng cách sử dụng chiếc đồng hồ cát hoặc tấn công.
items.artifacts.timekeepershourglass.desc=Chiếc đồng hồ cát lớn được trang trí công phu này trông khá bình thường, nhưng bạn cảm nhận được một sức mạnh to lớn trong chiếc khung được chạm khắc tinh xảo của nó. Khi bạn quay chiếc đồng hồ cát và ngắm cát chảy, bạn có thể cảm thấy phép thuật của nó đang kéo lấy bạn, chắc hẳn sử dụng thứ phép thuật này sẽ trao cho bạn chút quyền kiểm soát thời gian.
items.artifacts.timekeepershourglass.desc_hint=Cái đòng hồ cát trông có vẻ bị mất một ít cát, giá mà bạn có thể tìm một ít...
items.artifacts.timekeepershourglass.desc_cursed=Cái đồng hồ cát bị nguyền rủa bị ràng buộc với bạn, bạn có thể cảm thấy nó đang cố thao túng dòng chảy thời gian của bạn.
items.artifacts.timekeepershourglass$timefreeze.name=Đóng băng thời gian
items.artifacts.timekeepershourglass$timefreeze.desc=Thời gian bị đóng băng xung quanh bạn, cho phép bạn thực hiện các hành động ngay lập tức. Hiệu ứng này sẽ kéo dài cho đến khi nó bị hủy hoặc đồng hồ cát của bạn hết năng lượng. Tấn công hoặc sử dụng phép thuật cũng sẽ ngừng hiệu ứng này.\n\nLượt còn lại trước khi hết một năng lượng: %s.
items.artifacts.timekeepershourglass$sandbag.name=túi chứa cát thần kì
items.artifacts.timekeepershourglass$sandbag.levelup=Bạn thêm cát vào đồng hồ cát của bạn.
items.artifacts.timekeepershourglass$sandbag.maxlevel=Đồng hồ cát của bạn được chứa đầy cát thần kì!
items.artifacts.timekeepershourglass$sandbag.no_hourglass=Bạn không có đồng hồ cát để cho cát vào.
items.artifacts.timekeepershourglass$sandbag.desc=Túi cát mịn nhỏ này sẽ rất thích hợp với chiếc đồng hồ cát của bạn.\n\nThật lạ khi người chủ cửa hàng lại có chính xác món đồ này đúng lúc bạn cần...

items.artifacts.unstablespellbook.name=sách phép hỗn loạn
items.artifacts.unstablespellbook.ac_read=ĐỌC
items.artifacts.unstablespellbook.ac_add=THÊM
items.artifacts.unstablespellbook.blinded=Bạn không thể đọc từ sách khi bị mù.
items.artifacts.unstablespellbook.no_charge=Sách phép của bạn hiện đã hết năng lượng.
items.artifacts.unstablespellbook.cursed=Bạn không thể đọc một cuốn sách phép bị nguyền rủa.
items.artifacts.unstablespellbook.prompt=Chọn một cuộn giấy
items.artifacts.unstablespellbook.infuse_scroll=Bạn truyền năng lượng của cuộn giấy vào trong cuốn sách.
items.artifacts.unstablespellbook.unable_scroll=Bạn không thể thêm cuộn giấy này vào cuốn sách.
items.artifacts.unstablespellbook.unknown_scroll=Bạn chưa chắc cuộn giấy này là loại gì.
items.artifacts.unstablespellbook.desc=Cuốn sách này đang ở trong tình trạng tốt đáng ngạc nhiên so với tuổi của nó. Nó nổ lách tách khi bạn di chuyển các trang giấy, tràn ngập năng lượng hỗn loạn. Nếu bạn đọc từ cuốn sách này, bạn sẽ không biết mình sẽ đọc ra câu thần chú nào.
items.artifacts.unstablespellbook.desc_cursed=Cuốn sách bị nguyền đã ràng buộc với bạn, nó vô hiệu khả năng sử dụng hầu hết các cuộn giấy của bạn.
items.artifacts.unstablespellbook.desc_index=Cuốn sách chưa hoàn chỉnh. Mục lục của nó hiện đang chỉ đến các trang trống sau:
items.artifacts.unstablespellbook.desc_empowered=Các cuộn giấy mà bạn đã thêm vào cuốn sách đang phát sáng với sức mạnh. Bạn sẽ có thể chọn dạng kỳ lạ của hiệu ứng của những cuộn giấy này, nhưng sẽ tốn thêm một năng lượng.
items.artifacts.unstablespellbook.read_empowered=Cuộn giấy bạn đã thêm vào cuốn sách phép tràn đầy năng lượng. Bạn có thể kích hoạt hiệu ứng của dạng thường hoặc dạng kỳ lạ của cuộn giấy này.\n\nChọn dạng kỳ lạ sẽ tốn 2 năng lượng thay vì 1.



###bags
items.bags.bag.name=ba lô
items.bags.bag.discover_hint=Bạn có thể mua vật phẩm này trong một cửa hàng.

items.bags.potionbandolier.name=băng thuốc
items.bags.potionbandolier.desc=Chiếc băng dày này vừa vặn quanh ngực bạn như một cái dây đai, nó có nhiều dây đeo cách nhiệt trên mình để giữ các lọ thuốc, túi nước của bạn, hay các lọ kim loại lỏng.\n\nKhi ở trong băng, các lọ thuốc của bạn có lẽ sẽ được bảo vệ khỏi cái lạnh.

items.bags.scrollholder.name=ống đựng cuộn giấy
items.bags.scrollholder.desc=Ống chứa này trông giống như nó sẽ chứa các công cụ và biểu đồ của một nhà thiên văn học, nhưng các cuộn giấy của bạn cũng sẽ vừa. Thậm chí còn có một vài ngăn ở bên, chúng sẽ vừa vặn với các tinh thể thần chú, bút phép, và nhựa cây ma thuật.\n\nCái ống đựng không có vẻ dễ cháy lắm, vì vậy các cuộn giấy của bạn có lẽ sẽ được bảo vệ khỏi lửa bên trong nó.

items.bags.velvetpouch.name=túi nhung
items.bags.velvetpouch.desc=Cái túi nhung nhỏ này có thể chứa nhiều vật nhỏ trong nó, như là hạt giống, đá phép, và một số nguyên liệu giả kim.
items.bags.velvetpouch.discover_hint=Một trong các người hùng bắt đầu với vật phẩm này.

items.bags.magicalholster.name=bao da thần kì
items.bags.magicalholster.desc=Cái bao da mảnh mai này được làm từ một loại da động vật lạ, nó sở hữu một phép thuật thần kì giúp nó chứa một lượng vũ khí tầm xa khổng lồ.\n\nBạn có thể dễ dàng thò tay vao trong bao và sẽ luôn lấy được vật phẩm mà bạn tìm.\n\nNhờ phép thuật của cái bao da, các cây đũa phép sẽ hồi năng lượng nhanh hơn một chút và các vũ khí ném sẽ dùng được lâu hơn một chút bên trong nó.



###bombs
items.bombs.arcanebomb.name=bom bí ẩn
items.bombs.arcanebomb.desc=Quả bom này đã được truyền cho các đặc tính huyền bí. Nó sẽ phát nổ thành một vụ nổ mạnh tương tự như đòn tấn công bơm mình của Goo, gây _%1$d-%2$d sát thương phép thuật_ cho bất cứ thứ gì trong phạm vi 2 ô.
items.bombs.arcanebomb.discover_hint=Bạn có thể chế tạo vật phẩm này bằng thuật giả kim.

items.bombs.bomb.name=bom
items.bombs.bomb.ac_lightthrow=ĐỐT & NÉM
items.bombs.bomb.snuff_fuse=Bạn nhanh chóng bóp ngòi nổ của quả bom.
items.bombs.bomb.ondeath=Vụ nổ giết chết bạn...
items.bombs.bomb.rankings_desc=Bị giết bởi một vụ nổ
items.bombs.bomb.desc=Một quả bom thuốc súng khá lớn. Một vụ nổ từ quả bom này gây _%1$d-%2$d sát thương_ lên bất cứ thứ gì gần kề nó, và sẽ phá hủy một phần địa hình hoặc vật phẩm gần kề.
items.bombs.bomb.desc_fuse=Có vẻ như ngòi sẽ mất vài lượt để cháy sau khi nó được đốt.
items.bombs.bomb.desc_burning=Ngòi của quả bom đang cháy, hãy giữ khoảng cách hoặc dập tắt nó!
items.bombs.bomb$doublebomb.name=hai quả bom
items.bombs.bomb$doublebomb.desc=Một đôi gồm hai quả bom thuốc nổ đen mạnh, có vẻ như bạn nhận được một quả miễn phí!

items.bombs.firebomb.name=bom lửa
items.bombs.firebomb.desc=Quả bom này đã được chế lại để phát nổ trong một khu vực lớn hơn, gây _%1$d-%2$d sát thương_ và sẽ làm lửa lan ra trong vòng 2 ô trong thời gian dài.
items.bombs.firebomb.discover_hint=Bạn có thể chế tạo vật phẩm này bằng thuật giả kim.

items.bombs.flashbangbomb.name=bom choáng
items.bombs.flashbangbomb.desc=Quả bom được chế lại này sẽ phóng ra ánh sáng, âm thanh, và điện khi nó phát nổ. Bất cứ thứ gì ở trong vòng 2 ô sẽ nhận _%1$d-%2$d sát thương_ từ vụ nổ, thêm 25%% sát thương từ điện, và bị choáng trong 10 lượt.
items.bombs.flashbangbomb.discover_hint=Bạn có thể chế tạo vật phẩm này bằng thuật giả kim.

items.bombs.frostbomb.name=bom băng
items.bombs.frostbomb.desc=Quả bom này đã được chế lại để phát nổ trong một phạm vi lớn hơn, gây _%1$d-%2$d sát thương_ và phát tán một luồng khí đóng băng trong phạm vi 2 ô trong thời gian dài.
items.bombs.frostbomb.discover_hint=Bạn có thể chế tạo vật phẩm này bằng thuật giả kim.

items.bombs.holybomb.name=bom thánh
items.bombs.holybomb.desc=Quả bom này đã được chế lại để phát ra ánh sáng thánh trong một khu vực lớn hơn khi nó phát nổ. Bất cứ thứ gì trong phạm vi 2 ô sẽ nhận _%1$d-%2$d sát thương_ từ vụ nổ, và kẻ địch xác sống hoặc ác quỷ sẽ nhận thêm 50%% sát thương từ ánh sáng thánh.
items.bombs.holybomb.discover_hint=Bạn có thể chế tạo vật phẩm này bằng thuật giả kim.

items.bombs.noisemaker.name=bom gây ồn
items.bombs.noisemaker.desc=Quả bom đặc chế này sẽ liên tục phát ra tiếng ồn khi ngòi cháy hết. Khi thứ gì đó chạm vào quả bom, nó sẽ phát nổ và gây _%1$d-%2$d sát thương_ cho mọi thứ trong phạm vi 2 ô!
items.bombs.noisemaker.desc_burning=Quả bom gây ồn đang kêu tích tắc, nó sẽ phát nổ khi có thứ gì đó đến gần!
items.bombs.noisemaker.discover_hint=Bạn có thể chế tạo vật phẩm này bằng thuật giả kim.

items.bombs.smokebomb.name=bom khói
items.bombs.smokebomb.desc=Quả bom này đã chỉnh sửa để phun ra một đám khí dày cùng lúc nó nổ. Nó sẽ gây _%1$d-%2$d sát thương_ và phát tán sương mù che phủ trong phạm vi 2 ô.
items.bombs.smokebomb.discover_hint=Bạn có thể chế tạo vật phẩm này bằng thuật giả kim.

items.bombs.regrowthbomb.name=bom tái sinh trưởng
items.bombs.regrowthbomb.desc=Quả bom đặc chế này sẽ bắn chất lỏng mang lại sự sống khắp nơi trong phạm vi 3 ô thay vì phát nổ. Khu vực nằm trong vụ nổ sẽ nhanh chóng mọc lên cỏ và cây. Bạn và bất kỳ đồng minh nào nằm trong vụ nổ sẽ được hồi phục như thể đã uống một lọ thuốc hồi phục.
items.bombs.regrowthbomb.discover_hint=Bạn có thể chế tạo vật phẩm này bằng thuật giả kim.

items.bombs.shrapnelbomb.name=bom mảnh
items.bombs.shrapnelbomb.desc=Quả bom này đã được chỉnh sửa cùng những mảnh kim loại của DM-300, và nó sẽ phân mảnh và bay khắp nơi khi nó phát nổ, gây _%1$d-%2$d sát thương_ trong một phạm vi rất lớn xung quanh quả bom. Tốt nhất là bạn nên trốn đằng sau thứ gì đó khi sử dụng nó...
items.bombs.shrapnelbomb.discover_hint=Bạn có thể chế tạo vật phẩm này bằng thuật giả kim.

items.bombs.woollybomb.name=bom len
items.bombs.woollybomb.desc=Quả bom đặc chế này sẽ tạo ra nhũng con cừu phép thuật trong một vùng rộng sau khi phát nổ. Vụ nổ sẽ gây _%1$d-%2$d sát thương_ lên bất cứ thứ gì trong phạm vi 2 ô. Những con cừu sẽ chắn đường đi và tồn tại trong một khoảng thời gian rất dài! Tuy nhiên, những con cừu sẽ không tồn tại lâu khi có sự hiện diện của những kẻ địch mạnh, và có thể được tự tay giải trừ sớm hơn bằng cách tương tác với chúng.
items.bombs.woollybomb.discover_hint=Bạn có thể chế tạo vật phẩm này bằng thuật giả kim.

###food
items.food.berry.name=quả mọng
items.food.berry.eat_msg=Cái quả mọng đó ngon thật!
items.food.berry.desc=Quả dâu nhỏ này được tìm bởi Nữ thợ săn trong thảm thực vật của hầm ngục. Nó có thể được ăn một cách nhanh chóng, phục hồi một lượng nhỏ độ no, và có thể chứa một hạt giống có thể sử dụng được!
items.food.berry.discover_hint=Bạn có thể tìm thấy vật phẩm này bằng cách sử dụng một tài năng người hùng nhất định.

items.food.blandfruit.name=quả vô vị
items.food.blandfruit.cooked=quả vô vị chín
items.food.blandfruit.sunfruit=quả mặt trời
items.food.blandfruit.rotfruit=quả thối
items.food.blandfruit.earthfruit=quả đất
items.food.blandfruit.blindfruit=quả mù
items.food.blandfruit.firefruit=quả lửa
items.food.blandfruit.icefruit=quả băng
items.food.blandfruit.fadefruit=quả biến mất
items.food.blandfruit.sorrowfruit=quả đau buồn
items.food.blandfruit.stormfruit=quả bão
items.food.blandfruit.dreamfruit=quả pháp sư
items.food.blandfruit.starfruit=quả sao
items.food.blandfruit.swiftfruit=quả nhanh nhẹn
items.food.blandfruit.raw=Bạn không đành lòng ăn nó sống.
items.food.blandfruit.desc=Thật khô và thiếu chất dinh dưỡng, có lẽ hầm nó cùng với một thành phần khác sẽ cải thiện nó.
items.food.blandfruit.desc_cooked=Quả đã nở ra sau thời gian ngâm trong chậu và thậm chí đã hấp thụ các đặc tính của hạt giống mà nó được nấu cùng. Nó sẽ có tác dụng của bất kỳ lọai thuốc nào mà hạt giống đó tương ứng với.
items.food.blandfruit.desc_eat=Nó trông có vẻ ăn được rồi!
items.food.blandfruit.desc_throw=Nó có vẻ khá dễ bay hơi, có lẽ tốt nhất là bạn nên ném nó.
items.food.blandfruit$chunks.name=vụn quả vô vị
items.food.blandfruit$chunks.desc=Quả vô vị đã phát nổ khi va chạm, để lại những mảnh vụn trơ trụi phía sau.\n\nMặc dù có một chút bụi bẩn, nhưng những mảnh vụn của quả vô vị chín này dường như hoàn toàn có thể ăn được.

items.food.chargrilledmeat.name=thịt nướng cháy
items.food.chargrilledmeat.desc=Nó trông như một lát thịt nướng không tệ.
items.food.chargrilledmeat.discover_hint=Bạn có thể chế tạo món này bằng cách sử dụng một vật phẩm thức ăn khác.

items.food.food.name=khẩu phần thức ăn
items.food.food.ac_eat=ĂN
items.food.food.eat_msg=Món đó ngon thật!
items.food.food.desc=Không có gì xa hoa ở đây: thịt khô, một ít bánh quy - vài thứ như thế.

items.food.frozencarpaccio.name=thịt đông lạnh
items.food.frozencarpaccio.invis=Bạn thấy tay mình trở nên vô hình!
items.food.frozencarpaccio.hard=Bạn thấy da của mình cứng lại!
items.food.frozencarpaccio.refresh=Sảng khoái!
items.food.frozencarpaccio.better=Bạn cảm thấy khá hơn!
items.food.frozencarpaccio.desc=Một miếng thịt sống đông lạnh. Cách duy nhất để ăn nó là cắt thành những lát mỏng. Và bằng cách này nó lại ngon đến bất ngờ.
items.food.frozencarpaccio.discover_hint=Bạn có thể chế tạo món này bằng cách sử dụng một vật phẩm thức ăn khác.

items.food.meatpie.name=bánh thịt
items.food.meatpie.eat_msg=Món đó thật tuyệt vời!
items.food.meatpie.desc=Một chiếc bánh thơm ngon với nhân thịt đậm đà. Nó sẽ làm bạn no hơn nhiều so với bất kỳ bữa ăn nào khác.
items.food.meatpie.discover_hint=Bạn có thể chế tạo vật phẩm này bằng thuật giả kim.

items.food.mysterymeat.name=thịt bí ẩn
items.food.mysterymeat.eat_msg=Món đó có vị... lạ thật.
items.food.mysterymeat.hot=Ối nó nóng quá!
items.food.mysterymeat.legs=Bạn không thể cảm nhận được đôi chân của mình!
items.food.mysterymeat.not_well=Bạn cảm thấy không ổn lắm.
items.food.mysterymeat.stuffed=Bạn đã ăn no.
items.food.mysterymeat.desc=Bạn tự chịu rủi ro khi ăn!
items.food.mysterymeat.discover_hint=Bạn có thể nhận được vật phẩm này do các kẻ địch nhất định rơi ra.
items.food.mysterymeat$placeholder.name=thịt

items.food.phantommeat.name=thịt bóng ma
items.food.phantommeat.desc=Miếng thịt lớn trong suốt và lấp lánh, cắt ra từ một con piranha bóng ma. Miếng thịt phép thuật thuật này không cần được nấu và mang lại nhiều hiệu ứng phòng thủ bên cạnh việc hoàn toàn thỏa mãn cơn đói cho bạn. Khi được ăn, nó sẽ trao hiệu ứng tàng hình, da vỏ cây, một chút hồi phục, và chữa lành nhiều hiệu ứng có hại.
items.food.phantommeat.discover_hint=Bạn có thể nhận được vật phẩm này do các kẻ địch nhất định rơi ra.

items.food.pasty.name=bánh pasty
items.food.pasty.fish_name=cá hấp
items.food.pasty.amulet_name=tấm bùa yendor?
items.food.pasty.egg_name=trứng phục sinh
items.food.pasty.rainbow_name=lọ thuốc cầu vồng
items.food.pasty.shattered_name=bánh kem màu xanh lục
items.food.pasty.pie_name=bánh bí ngô
items.food.pasty.vanilla_name=bánh màu xanh dương
items.food.pasty.cane_name=kẹo gậy
items.food.pasty.sparkling_name=lọ thuốc lấp lánh
items.food.pasty.desc=Một chiếc bánh pasty của Cornwall đúng chuẩn với nhân thịt bò và khoai tây truyền thống. Ngon tuyệt!
items.food.pasty.fish_desc=Một con cá hấp nguyên con, được bảo quản một cách thần kì trên một lớp rau. Để dành một ít cá vào khoảng thời gian này trong năm là truyền thống, nên bạn sẽ giữ một ít thức ăn thừa thay vì ăn hết ngay.\n\nMừng Tết Âm lịch!
items.food.pasty.amulet_desc=Cuối cùng bạn đã tìm thấy nó, tấm bùa phép thuật - chờ chút, đây chỉ là một miếng sô-cô-la bọc giấy được làm cho giống tấm bùa! Nó sẽ không trao bạn sức mạnh vô hạn, nhưng ít nhất nó sẽ làm bạn no và cho bạn một ít năng lượng cổ vật.\n\nCá tháng Tư!
items.food.pasty.egg_desc=Một quả trứng sô-cô-la to đùng, bọc trong giấy màu vàng sặc sỡ. Số sô-cô-la ở trong đây dư sức làm cho bạn no, và lượng đường có thể cho các cổ vật của bạn thêm một chút năng lượng.\n\nMừng lễ Phục sinh!
items.food.pasty.rainbow_desc=Lọ thuốc đầy màu sắc này là một dạng thức ăn lỏng. Ngoài việc thỏa mãn cơn đói của bạn, nó có một chút phép thuật ở trong đó, làm một kẻ địch không phải trùm cận kề bình tĩnh lại, khiến nó tạm thời do dự không tấn công bạn.\n\nMừng Tháng tự hào!
items.food.pasty.shattered_desc=Lát bánh vani lớn này có những vụn đường sặc sỡ và kem màu xanh lá. Chiếc bánh đã được làm ra để ăn mừng những trải nghiệm trong nhiều năm, và sẽ cho bạn một lượng nhỏ những kinh nghiệm đó khi ăn vào.\n\nShattered Pixel Dungeon được ra mắt lần đầu vào ngày 5 tháng 8 năm 2014. Chúc mừng sinh nhật Shattered Pixel Dungeon!
items.food.pasty.pie_desc=Một lát bánh bí ngô to đùng. Vị ngọt và cay của nó sẽ làm bạn no và cho bạn một chút sự hồi phục.\n\nHalloween vui vẻ!
items.food.pasty.vanilla_desc=Lát bánh vani lớn này có những vụn đường sặc sỡ và kem màu xanh dương. Chiếc bánh đã được làm ra để ăn mừng những trải nghiệm trong nhiều năm, và sẽ cho bạn một lượng nhỏ những kinh nghiệm đó khi ăn vào.\n\nTrò chơi Pixel Dungeon gốc được ra mắt lần đầu vào ngày 4 tháng 12 năm 2012. Chúc mừng sinh nhật Pixel Dungeon!
items.food.pasty.cane_desc=Một cây kẹo ngọt có đường khổng lồ! Nó đủ lớn để làm bạn no, và lượng đường cũng có thể cho các đũa phép của bạn thêm một chút năng lượng.\n\nNgày lễ vui vẻ!
items.food.pasty.sparkling_desc=Lọ thuốc lấp lánh này là một dạng thức ăn lỏng. Nó thỏa mãn cơn đói và giống với rượu vang sủi, nhưng thực ra không có cồn. Cảm giác ấm trong bụng của bạn sẽ cho bạn một ít khiên.\n\nChúc mừng năm mới!
items.food.pasty$fishleftover.name=cá thừa
items.food.pasty$fishleftover.eat_msg=Món đó ăn tạm ổn.
items.food.pasty$fishleftover.desc=Chút cá thừa từ bữa ăn trước của bạn. Bạn có thể ăn nó bất cứ lúc nào bạn muốn để hồi phục độ no một chút.

items.food.smallration.name=khẩu phần thức ăn nhỏ
items.food.smallration.eat_msg=Món đó ăn tạm ổn.
items.food.smallration.desc=Nó trông giống hệt khẩu phần thức ăn bình thường nhưng nhỏ hơn.
items.food.smallration.discover_hint=Bạn có thể mua vật phẩm này trong một cửa hàng.

items.food.stewedmeat.name=thịt hầm
items.food.stewedmeat.eat_msg=Món đó ăn tạm ổn.
items.food.stewedmeat.desc=Việc hầm miếng thịt này đã khử mầm bệnh hoặc ký sinh trùng khỏi nó. Nó có thể được ăn an toàn.
items.food.stewedmeat.discover_hint=Bạn có thể chế tạo vật phẩm này bằng thuật giả kim.

items.food.supplyration.name=khẩu phần lương thực
items.food.supplyration.desc=Khẩu phần này đã được bỏ lại bởi và dành cho những thành viên của hội kẻ cướp. Nó đã được thiết kế đặc biệt để được vừa ăn vừa đi, và hỗ trợ trong các hành vi gian dối nói chung.\n\nDù nó không làm bạn no bằng một khẩu phần thông thường, nó có thể được ăn nhanh chóng, cung cấp một ít sự hồi phục trực tiếp, và sẽ hồi lại một năng lượng cho chiếc áo choáng bóng tối của Kẻ cướp.
items.food.supplyration.discover_hint=Bạn có thể tìm thấy vật phẩm này bằng cách sử dụng một tài năng người hùng nhất định.



##journal items
items.journal.documentpage.name=trang bị rách
items.journal.documentpage.desc=Một trang giấy đơn, có lẽ đã được xé ra từ một cuốn sách nào đó. Bạn sẽ cần phải nhặt nó lên để đọc nó.

items.journal.alchemypage.name=trang sách giả kim thuật bị rách
items.journal.alchemypage.desc=Một trang bị rách từ một cuốn sách hướng dẫn về thuật giả kim.\n\nHầu hết văn bản là quá nhỏ để có thể đọc từ khoảng cách xa, nhưng bạn có thể nhìn ra tiêu đề của trang:\n\n_"%s"_

items.journal.guidebook.name=cuốn sách thành thạo hầm ngục
items.journal.guidebook.hint_mobile=Cuốn sách hướng dẫn của bạn có lời khuyên dành cho bạn! Nhấn vào nút sổ tay đang nhấp nháy ở phía trên bên phải để đọc nó.
items.journal.guidebook.hint_desktop=Cuốn sách hướng dẫn của bạn có lời khuyên dành cho bạn! Chọn nút sổ tay đang nhấp nháy (%s) ở phía trên bên phải để đọc nó.
items.journal.guidebook.hint_status=Sách hướng dẫn
items.journal.guidebook.desc=Cuốn sách hướng dẫn của một nhà thám hiểm, bị bỏ lại ở đây bởi một người đã quyết định rằng phiêu lưu không dành cho họ! Cuốn sách đặc biệt này rất kỳ diệu và có thể nhắc các nhà thám hiểm đọc vào đúng thời điểm.\n\nBỏ qua chức năng đó, cuốn sách vẫn được yêu thích nhất vì dòng chữ lớn "Đừng hoảng!" được viết bằng chữ thân thiện lớn trên bìa.

items.journal.guidepage.name=trang sách hướng dẫn bị rách
items.journal.guidepage.desc=Một trang bị rách từ một cuốn sách hướng dẫn phiêu lưu.\n\nHầu hết chữ đều quá nhỏ để có thể đọc ở khoảng cách xa, nhưng bạn có thể nhìn ra tiêu đề của trang:\n\n_ "%s"_

items.journal.regionlorepage$sewers.name=lá thư cũ nát
items.journal.regionlorepage$sewers.desc=Một vật trông có vẻ giống một lá thư, có chữ được viết trên tờ giấy nhám nhem đất này. Bạn sẽ cần phải nhặt nó lên để biết được nó viết gì trong đó.

items.journal.regionlorepage$prison.name=mục nhật kí cũ
items.journal.regionlorepage$prison.desc=Một mục nhật kí, hoặc một dạng ghi chép nào đó, được viết trên một mảnh giấy cũ. Nó trông có vẻ lành lặn hơn so với những lá thư bạn đã tìm được trong đường cống, nhưng bạn vẫn sẽ cần phải nhặt nó lên để đọc.

items.journal.regionlorepage$caves.name=trang ghi chú cũ kĩ
items.journal.regionlorepage$caves.desc=Một vật trông như một trang giấy từ cuốn sổ tay của nhà thám hiểm, vẫn còn đang trong tình trạng tốt đến mức đáng kinh ngạc dù nó có vẻ ở đây đã lâu rồi. Nhặt nó lên để đọc nó.

items.journal.regionlorepage$city.name=tấm thẻ gỉ sét
items.journal.regionlorepage$city.desc=Một tấm thẻ nhỏ bằng sắt bị gỉ với dòng chữ được ai đó khắc lên nó bằng phép thuật. Tuy tấm thẻ có vẻ đã ở đây rất lâu rồi nhưng dòng chữ ấy vẫn còn rõ ràng, bạn vẫn phải nhặt lên để đọc được nó.

items.journal.regionlorepage$halls.name=tấm thẻ phát sáng
items.journal.regionlorepage$halls.desc=Một tấm thẻ nhỏ màu đen với các dòng chữ được khắc trên nó đang rực lên ánh sáng màu xanh lá. Sắc xanh từ các dòng chữ hòa vào nhau tạo thành một tia sáng lờ mờ khi nhìn từ xa, bạn vẫn sẽ phải nhặt nó lên để đọc được nó.


###keys
items.keys.goldenkey.name=chìa khoá vàng
items.keys.goldenkey.desc=Các vết khía trên chiếc chìa vàng này rất nhỏ và phức tạp. Có lẽ nó sẽ mở một cái rương bị khóa?

items.keys.crystalkey.name=Chìa khoá pha lê
items.keys.crystalkey.desc=Các bề mặt cắt của chiếc chìa khóa pha lê này lấp lánh trong bóng tối. Có lẽ nó sẽ mở thứ gì đó được làm bằng pha lê?

items.keys.ironkey.name=chìa khoá sắt
items.keys.ironkey.desc=Các vết khía trên chiếc chìa khóa sắt cổ này đã bị mòn nhiều; dây móc da của nó đã mòn theo thời gian. Liệu nó sẽ mở cánh cửa nào?

items.keys.wornkey.name=chìa khoá mòn
items.keys.wornkey.desc=Chiếc chìa khoá này đã mòn và mất màu, nhưng trông có vẻ quan trọng. Chắc là nó có thể mở một cánh của quan trọng nào đó ở gần đây.



###potions
items.potions.potion.ac_drink=UỐNG
items.potions.potion.turquoise=lọ thuốc màu xanh ngọc
items.potions.potion.crimson=lọ thuốc màu đỏ thắm
items.potions.potion.azure=lọ thuốc màu xanh da trời
items.potions.potion.jade=lọ thuốc màu ngọc thạch
items.potions.potion.golden=lọ thuốc màu vàng kim
items.potions.potion.magenta=lọ thuốc màu cánh sen
items.potions.potion.charcoal=lọ thuốc màu đen than
items.potions.potion.ivory=lọ thuốc màu ngà
items.potions.potion.amber=lọ thuốc màu hổ phách
items.potions.potion.bistre=lọ thuốc màu nâu sẫm
items.potions.potion.indigo=lọ thuốc màu chàm
items.potions.potion.silver=lọ thuốc màu bạc
items.potions.potion.unknown_desc=Cái bình này chứa một chất lỏng nhiều màu sắc xoáy. Ai mà biết nó sẽ làm gì khi được uống hay ném?
items.potions.potion.harmful=Lọ thuốc có hại!
items.potions.potion.beneficial=Lọ thuốc có lợi
items.potions.potion.yes=Có, tôi biết mình đang làm gì
items.potions.potion.no=Không, tôi đổi ý rồi
items.potions.potion.sure_drink=Bạn có chắc bạn muốn uống nó không? Trong đa số trường hợp bạn nên ném các lọ thuốc như thế này vào kẻ thù.
items.potions.potion.sure_throw=Bạn có chắc bạn muốn ném nó không? Trong đa số trường hợp việc uống nó là hợp lý.
items.potions.potion.shatter=Cái bình vỡ tan và chất lỏng bắn tung tóe một cách vô hại.
items.potions.potion.discover_hint=Bạn có thể tìm thấy vật phẩm này một cách ngẫu nhiên trong hầm ngục, hoặc chế tạo nó bằng thuật giả kim.
items.potions.potion$placeholder.name=lọ thuốc
items.potions.potion$seedtopotion.name=Lọ thuốc Ngẫu nhiên

items.potions.potionofexperience.name=thuốc kinh nghiệm
items.potions.potionofexperience.desc=Kinh nghiệm được tích lũy từ vô số trận chiến được cô đọng thành dạng lỏng, thứ thuốc này sẽ ngay lập tức tăng cấp độ kinh nghiệm của bạn.

items.potions.potionoffrost.name=thuốc băng giá
items.potions.potionoffrost.desc=Hóa chất chứa trong lọ thuốc này sẽ bốc hơi thành đám mây đóng băng khi để hở ra không khí ở ngoài.

items.potions.potionofhaste.name=thuốc nhanh nhẹn
items.potions.potionofhaste.energetic=Bạn cảm thấy đầy năng lượng!
items.potions.potionofhaste.desc=Uống thứ chất lỏng ngọt ngào kỳ lạ này sẽ truyền cho bạn nguồn năng lượng to lớn trong một thời gian ngắn, cho phép bạn chạy với tốc độ cao.

items.potions.potionofhealing.name=thuốc hồi phục
items.potions.potionofhealing.heal=Những vết thương của bạn bắt đầu đóng lại.
items.potions.potionofhealing.desc=Elixir này sẽ nhanh chóng phục hồi sức khỏe của bạn và ngay lập tức chữa khỏi nhiều loại bệnh.

items.potions.potionofinvisibility.name=thuốc tàng hình
items.potions.potionofinvisibility.invisible=Bạn thấy tay mình trở nên vô hình!
items.potions.potionofinvisibility.desc=Uống lọ thuốc này sẽ khiến bạn tạm thời vô hình. Trong khi tàng hình, kẻ địch sẽ không thể nhìn thấy bạn. Các đòn tấn công vật lí và hiệu ứng phép thuật (như các cuộn giấy và đũa phép) sẽ ngay lập tức hủy sự tàng hình.

items.potions.potionoflevitation.name=thuốc bay
items.potions.potionoflevitation.float=Bạn bay lên không trung!
items.potions.potionoflevitation.desc=Uống chất lỏng này sẽ làm bạn lơ lửng trong không trung, cho phép dễ dàng bay qua bẫy và hố. Ném lọ thuốc này sẽ tạo một đám mây khí chưa tinh luyện, làm mất phương hướng mọi thứ trong đó.

items.potions.potionofliquidflame.name=thuốc lửa lỏng
items.potions.potionofliquidflame.desc=Bình này chứa một hợp chất không ổn định và sẽ bốc cháy dữ dội khi tiếp xúc với không khí bên ngoài.

items.potions.potionofmindvision.name=thuốc tâm nhãn
items.potions.potionofmindvision.see_mobs=Bằng một cách nào đó bạn cảm nhận được tâm trí của các sinh vật khác!
items.potions.potionofmindvision.see_none=Bằng một cách nào đó bạn có thể biết là ngay lúc này bạn đang ở một mình trong tầng này.
items.potions.potionofmindvision.desc=Sau khi uống thứ này, tâm trí của bạn sẽ trở nên hòa hợp với dấu hiệu tâm linh của những sinh vật ở xa, cho phép bạn cảm nhận được những sự hiện diện sinh học qua các bức tường. Ngoài ra lọ thuốc này sẽ cho phép bạn nhìn xuyên qua các bức tường và cửa ở gần.

items.potions.potionofparalyticgas.name=thuốc khí gây tê liệt
items.potions.potionofparalyticgas.desc=Khi tiếp xúc với không khí bên ngoài, chất lỏng trong bình này sẽ hóa thành một đám khói màu vàng gây tê. Bất cứ ai hít phải đám khí sẽ bị tê liệt ngay lập tức, không thể di chuyển trong một khoảng thời gian sau khi đám mây tan đi. Vật này có thể được ném vào kẻ thù ở xa để bắt chúng ở trong hiệu ứng của khí.

items.potions.potionofpurity.name=thuốc trong sạch
items.potions.potionofpurity.freshness=Bạn cảm nhận được sự trong lành kì lạ trong không khí.
items.potions.potionofpurity.protected=Một màng bảo vệ bao bọc bạn!
items.potions.potionofpurity.desc=Thứ thuốc thần kỳ này sẽ nhanh chóng vô hiệu mọi hiệu ứng khu vực có hại trong một khu vực lớn. Uống nó sẽ cho bạn khả năng tạm thời miễn nhiễm với những hiệu ứng như vậỵ

items.potions.potionofstrength.name=thuốc sức mạnh
items.potions.potionofstrength.msg=Nguồn sức mạnh mới trào dâng trong cơ thể bạn, giờ bạn có %d sức mạnh!
items.potions.potionofstrength.desc=Chất lỏng mạnh mẽ này sẽ đi qua các cơ bắp của bạn, vĩnh viễn tăng sức mạnh của bạn lên một điểm.

items.potions.potionoftoxicgas.name=thuốc khí độc
items.potions.potionoftoxicgas.desc=Tháo nút hoặc làm vỡ lọ thủy tinh nén này sẽ khiến chất chứa bên trong nó phát nổ thành một đám mây khí độc màu xanh lá chết người. Bạn có thể chọn ném lọ thuốc này vào các kẻ địch ở xa thay vì mở nó bằng tay.



###brews
items.potions.brews.brew.discover_hint=Bạn có thể chế tạo vật phẩm này bằng thuật giả kim.

items.potions.brews.aquabrew.name=dung dịch nước
items.potions.brews.aquabrew.desc=Khi vỡ ra, dung dịch này sẽ giải phóng một luồng nước cao áp tại vị trí của nó. Nó chỉ đủ mạnh để gây sát thương cho những kẻ địch hệ lửa, nhưng nó cũng khiến nước lan ra địa hình xung quanh, làm hỏng bẫy, dập lửa, và đẩy lùi các nhân vật ở gần vị trí bắn nước.

items.potions.brews.blizzardbrew.name=dung dịch bão tuyết
items.potions.brews.blizzardbrew.desc=Khi bị vỡ, dung dịch này sẽ giải phóng một cơn bão tuyết xoáy lan ra nhanh chóng như một loại khí.

items.potions.brews.causticbrew.name=dung dịch ăn da
items.potions.brews.causticbrew.desc=Dung dịch này sẽ phân tán chất nhầy ăn mòn trong một diện tích rộng xung quanh vị trí nó vỡ. Bất kì thứ gì dính phải chất nhầy sẽ từ từ tan chảy nếu nó không thể rửa nó ra trong nước.

items.potions.brews.infernalbrew.name=dung dịch hoả ngục
items.potions.brews.infernalbrew.desc=Khi bị vỡ, dung dịch này sẽ giải phóng một đám cháy dữ dội lan ra nhanh chóng như một loại khí.

items.potions.brews.shockingbrew.name=dung dịch điện giật
items.potions.brews.shockingbrew.desc=Khi bị vỡ, dung dịch này sẽ giải phóng một cơn bão điện trong một khu vực rộng xung quanh vị trí nó vỡ.

items.potions.brews.unstablebrew.name=dung dịch bất ổn
items.potions.brews.unstablebrew.desc=Dung dịch phép thuật này phát sáng với các màu sắc thay đổi của cầu vồng.\n\nKhi được uống hoặc ném, nó sẽ kích hoạt hiệu ứng của một loại thuốc ngẫu nhiên. Hiệu ứng thuốc đó sẽ luôn có lợi khi được uống, vè sẽ luôn có hại khi được ném.

###elixirs
items.potions.elixirs.elixir.discover_hint=Bạn có thể chế tạo vật phẩm này bằng thuật giả kim.

items.potions.elixirs.elixirofarcanearmor.name=thuốc giáp phép
items.potions.elixirs.elixirofarcanearmor.desc=Thứ thuốc này sẽ cho người uống sự kháng sát thương phép thuật dài hạn.

items.potions.elixirs.elixirofaquaticrejuvenation.name=elixir phục hồi trong nước
items.potions.elixirs.elixirofaquaticrejuvenation.desc=Elixir này chứa xác của Goo được tăng cường với một lọ thuốc hồi phục. Dù sẽ không cung cấp sự hồi phục ngay lập tức, nó sẽ từ từ hồi phục một lượng sức khỏe lớn hơn khi bạn đang đứng trong nước.
items.potions.elixirs.elixirofaquaticrejuvenation$aquahealing.name=phục hồi trong nước
items.potions.elixirs.elixirofaquaticrejuvenation$aquahealing.desc=Bạn đã tạm thời nhận được các đặc tính hồi phục tương tự như của Goo.\n\nKhi đang đứng trong nước, bạn sẽ hồi phục một lượng nhỏ sức khỏe mỗi lượt. Hiệu ứng này được dừng khi bạn ở mức sức khỏe tối đa hoặc ra khỏi nước.\n\nHồi phục còn lại: %d.

items.potions.elixirs.elixirofdragonsblood.name=elixir máu rồng
items.potions.elixirs.elixirofdragonsblood.desc=Khi được uống, elixir này sẽ truyền sức mạnh bốc lửa chảy qua các tĩnh mạch của người uống. Hiệu ứng này sẽ khiến người uống không bị ảnh hưởng bởi lửa, và cho phép họ khiến kẻ địch bốc cháy với các đòn tấn công vật lí.

items.potions.elixirs.elixiroffeatherfall.name=elixir rơi chậm
items.potions.elixirs.elixiroffeatherfall.light=Bạn cảm thấy nhẹ như một sợi lông chim!
items.potions.elixirs.elixiroffeatherfall.desc=Elixir này cung cấp một hiệu ứng bay yếu hơn nhưng được kiểm soát hơn, cho phép người uống rơi một khoảng cách lớn mà không bị tổn thương trong một thời gian ngắn.
items.potions.elixirs.elixiroffeatherfall$featherbuff.name=rơi chậm
items.potions.elixirs.elixiroffeatherfall$featherbuff.desc=Bạn đang mang hiệu ứng của một elixir rơi chậm, cho phép bạn rơi vào các hố sâu mà không nhận sát thương!\n\nLượt còn lại: %s.

items.potions.elixirs.elixirofhoneyedhealing.name=elixir hồi phục ngọt ngào
items.potions.elixirs.elixirofhoneyedhealing.desc=Thần dược này kết hợp tính hồi phục với vị ngọt của mật ong. Khi uống vào, nó sẽ trao tác dụng tương tự như một lọ thuốc hồi phục và thỏa mãn một phần nhỏ cơn đói, nhưng nó cũng có thể được ném để hồi phục cho một đồng minh.\n\nNhững sinh vật bị hấp dẫn bởi mật ong có thể được xoa dịu nếu vật phẩm này được sử dụng lên chúng.

items.potions.elixirs.elixiroficytouch.name=elixir của cái chạm băng giá
items.potions.elixirs.elixiroficytouch.desc=Khi được sử dụng, elixir này sẽ cho phép người uống lấy đi nhiệt từ những kẻ địch họ tấn công. Hiệu ứng này sẽ khiến người uống kháng lại cái lạnh, và cho phép họ làm lạnh kẻ địch với các đòn tấn công vật lí.

items.potions.elixirs.elixirofmight.name=elixir sức mạnh
items.potions.elixirs.elixirofmight.msg=Nguồn sức mạnh mới trào dâng trong cơ thể bạn, giờ bạn có %d sức mạnh!
items.potions.elixirs.elixirofmight.desc=Dung dịch mạnh mẽ này sẽ chảy qua các cơ bắp của bạn, vĩnh viễn tăng sức mạnh của bạn thêm một điểm và tạm thời tăng sinh lực tối đa thêm %d điểm. Mức tăng cường sinh lực tỉ lệ thuận với sinh lực tối đa của bạn, nhưng sẽ từ từ biến mất khi bạn lên cấp.
items.potions.elixirs.elixirofmight$htboost.name=tăng sinh lực tối đa
items.potions.elixirs.elixirofmight$htboost.desc=Cơ thể bạn cảm thấy mạnh và khoẻ một cách bất thường.\n\nSinh lực tối đa của bạn được tăng trong một khoảng thời gian dài. Khi bạn lên cấp, sự tăng cường sẽ dần dần mất đi.\n\nMức tăng cường hiện tại: %d.\nCấp còn lại: %d.

items.potions.elixirs.elixiroftoxicessence.name=elixir tinh chất độc
items.potions.elixirs.elixiroftoxicessence.desc=Khi được sử dụng, elixir này sẽ hòa lẫn người uống với năng lượng độc. Người uống sẽ liên tục tỏa ra khí độc khi họ di chuyển, và sẽ không bị ảnh hưởng bởi khí độc và độc trong thời gian dài hơn thời lượng của hiệu ứng một chút.



###exotic potions
items.potions.exotic.exoticpotion.turquoise=thuốc kì lạ màu xanh ngọc
items.potions.exotic.exoticpotion.crimson=thuốc kì lạ màu đỏ thẫm
items.potions.exotic.exoticpotion.azure=thuốc kì lạ màu xanh da trời
items.potions.exotic.exoticpotion.jade=thuốc kì lạ màu ngọc bích
items.potions.exotic.exoticpotion.golden=thuốc kì lạ màu vàng
items.potions.exotic.exoticpotion.magenta=thuốc kì lạ màu cánh sen
items.potions.exotic.exoticpotion.charcoal=thuốc kì lạ màu đen than
items.potions.exotic.exoticpotion.ivory=thuốc kì lạ màu ngà
items.potions.exotic.exoticpotion.amber=thuốc kì lạ màu hổ phách
items.potions.exotic.exoticpotion.bistre=thuốc kì lạ màu nâu sẫm
items.potions.exotic.exoticpotion.indigo=thuốc kì lạ màu xanh đậm
items.potions.exotic.exoticpotion.silver=thuốc kì lạ màu bạc
items.potions.exotic.exoticpotion.unknown_desc=Bình tròn này chứa một chất lỏng nhiều màu sắc lắng đọng. Nó có vẻ là xa lạ với vùng đất này, liệu nó sẽ có tác dụng gì khi được uống hoặc ném?
items.potions.exotic.exoticpotion.warning=Bạn có muốn hủy sử dụng thuốc này không? Nó vẫn sẽ bị tiêu thụ.
items.potions.exotic.exoticpotion.yes=Có, tôi chắc chắn
items.potions.exotic.exoticpotion.no=Không, tôi đổi ý rồi
items.potions.exotic.exoticpotion.discover_hint=Bạn có thể chế tạo vật phẩm này bằng thuật giả kim.

items.potions.exotic.potionofcleansing.name=thuốc thanh tẩy
items.potions.exotic.potionofcleansing.desc=Thứ thuốc phản ứng mạnh mẽ này sẽ khiến người uống không bị ảnh hưởng bởi tất cả các hiệu ứng trạng thái bất lợi trong một vài lượt khi được uống. Nó cũng có thể được ném vào một mục tiêu để thanh tẩy chúng.
items.potions.exotic.potionofcleansing$cleanse.name=đã thanh tẩy
items.potions.exotic.potionofcleansing$cleanse.desc=Nhân vật này tạm thời không bị ảnh hưởng bởi tất cả hiệu ứng trạng thái bất lợi!\n\nLượt còn lại: %s.

items.potions.exotic.potionofcorrosivegas.name=thuốc khí ăn mòn
items.potions.exotic.potionofcorrosivegas.desc=Tháo nút hoặc làm vỡ lọ thủy tinh nén này sẽ khiến chất chứa bên trong nó phát nổ thành một đám mây khí ăn mòn màu rỉ sét chết người. Khí này lan ra nhanh hơn và nguy hiểm hơn khí độc, nhưng sẽ không kéo dài bằng.

items.potions.exotic.potionofdragonsbreath.name=thuốc hơi thở của rồng
items.potions.exotic.potionofdragonsbreath.prompt=Chọn một vị trí để đốt cháy
items.potions.exotic.potionofdragonsbreath.desc=Bình này chứa một hợp chất kì lạ, nhanh chóng bùng cháy ngay sau khi trộn lẫn với nước bọt. Nhanh chóng phun chất lỏng ra sẽ cho phép người uống phun ra lửa từ miệng của họ!

items.potions.exotic.potionofearthenarmor.name=lọ thuốc áo giáp đất
items.potions.exotic.potionofearthenarmor.desc=Thay vì làm tê liệt, chất lỏng này có khả năng làm rắn làn da, biến nó thành một bộ giáp tự nhiên tạm thời.

items.potions.exotic.potionofdivineinspiration.name=thuốc cảm hứng thần thánh
items.potions.exotic.potionofdivineinspiration.no_more_points=Bạn không thể nhận thêm điểm tài năng nào nữa.
items.potions.exotic.potionofdivineinspiration.select_tier=Chọn hạng tài năng để nhận hai điểm thưởng. Bạn phải đã mở khóa hạng đó rồi để có thể tiêu điểm này.
items.potions.exotic.potionofdivineinspiration.bonus=+2 Điểm Tài năng!
items.potions.exotic.potionofdivineinspiration.desc=Sức mạnh của năng lượng thánh dưới dạng chất lỏng, lọ thuốc này sẽ truyền sức mạnh thần thánh cho người uống, cho họ thêm hai điểm tài năng trong một bậc do họ chọn.\n\nLọ thuốc này chỉ có thể dùng một lần cho mỗi bậc tài năng.

items.potions.exotic.potionofmagicalsight.name=thuốc tầm nhìn phép thuật
items.potions.exotic.potionofmagicalsight.desc=Sau khi uống thuốc này, các giác quan của bạn sẽ được nâng lên mức phi thường trong một thời gian ngắn, cho phép bạn nhìn xuyên qua tường trong bán kính 12 ô!

items.potions.exotic.potionofmastery.name=thuốc thành thạo
items.potions.exotic.potionofmastery.prompt=Thành thạo một vật phẩm
items.potions.exotic.potionofmastery.weapon_easier=Vũ khí của bạn trở nên dễ vung hơn!
items.potions.exotic.potionofmastery.armor_easier=Áo giáp của bạn trở nên dễ mặc hơn!
items.potions.exotic.potionofmastery.desc=Thay vì cung cấp sức mạnh, thứ thuốc này sẽ hòa hợp các cơ của người sử dụng với một vật phẩm cụ thể. Điều này sẽ khiến vật phẩm đó dễ sử dụng hơn, tựa như người uống đã luyện tập và quen với nó.\n\nVũ khí hoặc áo giáp được chọn sẽ yêu cầu ít đi 2 sức mạnh để sử dụng. Thuốc này chỉ có thể được sử dụng một lần lên mỗi vật phẩm.

items.potions.exotic.potionofshielding.name=thuốc che chắn
items.potions.exotic.potionofshielding.desc=Thay vì hồi phục, lọ thuốc này sẽ tạo ra một tấm khiên chắc chắn quanh cơ thể người dùng, chặn một lượng sát thương đáng kể.

items.potions.exotic.potionofshroudingfog.name=thuốc sương mù che phủ
items.potions.exotic.potionofshroudingfog.desc=Khi tiếp xúc với không khí, chất lỏng trong chai này sẽ tạo ra một màn sương dày mù mịt, nhanh chóng lan ra và chắn tầm nhìn của các kẻ địch của bạn.

items.potions.exotic.potionofsnapfreeze.name=thuốc đông cứng
items.potions.exotic.potionofsnapfreeze.desc=Chất hóa học được chứa trong thứ thuốc này sẽ nhanh chóng phản ứng với không khí, ngay lập tức đóng băng và bám rễ tất cả những gì nằm trong hiệu ứng của nó.

items.potions.exotic.potionofstamina.name=thuốc sức bền
items.potions.exotic.potionofstamina.desc=Uống chất lỏng ngọt lạ này sẽ cho bạn một sự tăng cường năng lượng lâu dài, cho phép bạn chạy với tốc độ nhanh trong một khoảng thời gian được kéo dài.

items.potions.exotic.potionofstormclouds.name=thuốc mây đen
items.potions.exotic.potionofstormclouds.desc=Ném lọ thuốc này sẽ tạo một đám khí cô đặc lan tỏa nhanh, nó sẽ ngưng tụ lại rồi trút xuống môi trường. Hầu hết các địa hình sẽ hóa thành nước, kẻ địch lửa sẽ bị nhận sát thương, lửa đang cháy sẽ được dập tắt, và bẫy sẽ bị ngập và hư hỏng.



###quest items
items.quest.ceremonialcandle.name=nến nghi lễ
items.quest.ceremonialcandle.desc=Một bộ nến, bị chảy và dính vào nhau qua việc sử dụng.\n\nMột mình thì chúng vô giá trị, nhưng nếu được sử dụng với những cây nến khác theo một mô hình, chúng có thể tập trung nguồn năng lượng cho một nghi thức triệu hồi.
items.quest.ceremonialcandle.discover_hint=Bạn có thể tìm thấy vật phẩm này trong một nhiệm vụ nhất định.

items.quest.corpsedust.name=bụi xác chết
items.quest.corpsedust.chill=Cái lạnh chạy dọc sống lưng của bạn.
items.quest.corpsedust.desc=Quả cầu bụi xác chết này không có vẻ gì khác so với một quả cầu bụi thường, Nhưng bạn có thể cảm thấy một năng lượng hắc ám ẩn nấp bên trong nó.\n\nXử lí nó sớm nhất có thể sẽ là một ý hay.
items.quest.corpsedust.discover_hint=Bạn có thể tìm thấy vật phẩm này trong một nhiệm vụ nhất định.

items.quest.darkgold.name=quặng vàng tối
items.quest.darkgold.you_now_have=Bạn hiện có %d quặng vàng tối.
items.quest.darkgold.desc=Thứ kim loại này được gọi là tối không phải vì màu của nó (màu nó không khác với thứ vàng thường), mà là vì nó tan chảy dưới ánh mặt trời, khiến cho nó vô dụng trên mặt đất.
items.quest.darkgold.discover_hint=Bạn có thể tìm thấy vật phẩm này trong một nhiệm vụ nhất định.

items.quest.dwarftoken.name=thẻ định danh người lùn
items.quest.dwarftoken.desc=Có nhiều người lùn và những phát minh của họ mang theo những mảnh kim loại nhỏ bí ẩn này. Có lẽ chúng là đồ trang sức hoặc có lẽ chúng là là một dạng ID. Người lùn thật là những kẻ kì lạ.
items.quest.dwarftoken.discover_hint=Bạn có thể tìm thấy vật phẩm này trong một nhiệm vụ nhất định.

items.quest.embers.name=than hồng nguyên tố
items.quest.embers.desc=Những mẩu than hồng đặc biệt chỉ có thể được thu hoạch từ những nguyên tố lửa nhỏ. Chúng tỏa ra năng lượng nhiệt.
items.quest.embers.discover_hint=Bạn có thể tìm thấy vật phẩm này trong một nhiệm vụ nhất định.

items.quest.escapecrystal.name=pha lê tẩu thoát
items.quest.escapecrystal.ac_use=DÙNG
items.quest.escapecrystal.desc=Một pha lê thần chú phép thuật mỏng, có vẻ chứa phép thuật dịch chuyển. Bạn có thể sử dụng pha lê này bất cứ lúc nào để rời khỏi kho người lùn, nhưng bạn sẽ không thể mang bất cứ thứ gì theo bạn ra ngoài!
items.quest.escapecrystal.discover_hint=Bạn có thể tìm thấy vật phẩm này trong một nhiệm vụ nhất định.

items.quest.gooblob.name=quả cầu goo
items.quest.gooblob.desc=Một quả cầu nhầy nhụa, tách ra từ Goo khi nó chết. Nó gần giống như một cục thạch to, dù bạn sẽ không dám ăn nó.\n\nBản thân nó chẳng làm được gì, nhưng nó có thể trở nên hữu dụng khi được kết hợp với những loại thuốc nhất định, hoặc một quả bom. Cùng lắm thì có lẽ nó có thể chuyển thành một lượng năng lượng đáng kể.
items.quest.gooblob.discover_hint=Bạn có thể nhận được vật phẩm này do các kẻ địch nhất định rơi ra.

items.quest.metalshard.name=mảnh kim loại bị nguyền
items.quest.metalshard.desc=Một mảnh kim loại gỉ bị nguyền, vỡ ra từ DM-300 khi nó bị phá hủy. Bạn có thể cảm thấy một phép thuật hắc ám không hoạt động nằm trong nó.\n\nBản thân nó không làm được gì, nhưng nó có thể trở nên hữu dụng khi được kết hợp với những cuộn giấy nhất định, hoặc một quả bom. Cùng lắm thì có lẽ nó có thể được chuyển thành một lượng năng lượng đáng kể.
items.quest.metalshard.discover_hint=Bạn có thể nhận được vật phẩm này do các kẻ địch nhất định rơi ra.

items.quest.pickaxe.name=cuốc chim
items.quest.pickaxe.ability_name=xuyên thủng
items.quest.pickaxe.ability_desc=Kiếm sĩ có thể _xuyên thủng_ một kẻ địch với một cây cuốc. Đòn tấn công này chắc chắn sẽ trúng, gây hiệu ứng dễ tổn thương trong 3 lượt, và gây _%1$d-%2$d sát thương_ cho kẻ địch có lớp da cứng.
items.quest.pickaxe.upgrade_ability_stat_name=Sát thương kĩ năng
items.quest.pickaxe.desc=Đây là một công cụ chắc và nặng dùng để phá đá. Bạn không cần phải trang bị cây cuốc để dùng nó khai thác, nhưng chắc nó cũng có thể được dùng làm một thứ vũ khí nếu cần.
items.quest.pickaxe.discover_hint=Bạn có thể tìm thấy vật phẩm này trong một nhiệm vụ nhất định.

items.quest.ratskull.name=hộp sọ chuột khổng lồ
items.quest.ratskull.desc=Một cái sọ chuột lớn đến bất ngờ. Nó sẽ là một chiến tích săn bắn tốt, nếu như bạn có một bức tường để treo nó lên.



###remains
items.remains.remainsitem.ac_use=DÙNG
items.remains.remainsitem.discover_hint=Bạn có thể tìm thấy vật phẩm này trong thi hài của một người hùng nhất định từ một lượt chơi đã thua trước đó.

items.remains.bowfragment.name=mảnh cung
items.remains.bowfragment.desc=Mảnh gỗ vỡ này từng là một phần của cây cung linh hồn của một Nữ thợ săn đã mất. Bạn vẫn có thể cảm thấy một ít năng lượng thiên nhiên còn lại trong mảnh vỡ, bạn có thể sử dụng mảnh vỡ để làm một ít cỏ cao mọc lên xung quanh bạn. Tuy nhiên làm vậy sẽ phá hủy mảnh vỡ.

items.remains.brokenhilt.name=chuôi kiếm vỡ
items.remains.brokenhilt.desc=Chuôi kiếm vỡ này trông có vẻ như nó là từ vũ khí của một Kiếm sĩ đã bại trận. Bạn vẫn có thể cảm thấy một ít năng lượng chiến binh còn lại trong chuôi kiếm, bạn có thể sử dụng nó để nhận thêm một ít sát thương vào hai đòn tấn công cận chiến kế tiếp của bạn. Tuy nhiên làm vậy sẽ phá hủy chuôi kiếm.

items.remains.brokenstaff.name=gậy phép gãy
items.remains.brokenstaff.desc=Cây gậy phép của Pháp sư này đã bị gãy làm đôi sau khi chủ nhân của nó ra đi. Bạn vẫn có thể cảm thấy một ít năng lượng phép thuật còn lại trong cây gậy, bạn có thể sử dụng nó để cho các đũa phép của bạn thêm một ít năng lượng. Tuy nhiên làm vậy sẽ phá hủy cây gậy.

items.remains.cloakscrap.name=mảnh vải
items.remains.cloakscrap.desc=Mảnh vải mờ này trông có vẻ như nó là từ một chiếc áo choàng bóng tối của một Kẻ cướp quá cố. Bạn vẫn có thể cảm thấy một ít năng lượng thần bí còn lại trong nó, bạn có thể sử dụng nó để cho các cổ vật của bạn thêm một ít năng lượng. Tuy nhiên làm vậy sẽ phá hủy mảnh vải.

items.remains.sealshard.name=vụn con dấu
items.remains.sealshard.desc=Những mảnh vụn sáp đỏ này trông có vẻ như chúng là từ con dấu của một Chiến binh đã gục ngã. Bạn vẫn có thể cảm thấy một ít sức mạnh ý chí bám víu vào con dấu, bạn có thể sử dụng nó để cho bản thân mình một chút khiên chắn. Tuy nhiên làm vậy sẽ phá hủy các mảnh vụn con dấu.

items.remains.tornpage.name=trang giấy rách
items.remains.tornpage.desc=Trang giấy này trông có vẻ như đã bị xé ra từ một quyển sách thánh cũ của Giáo sĩ. Vẫn còn một chút năng lượng thần thánh bám víu vào nó, bạn có thể sử dụng nó để hồi lại một chút sinh lực. Tuy nhiêu làm vậy sẽ phá hủy trang giấy bị rách.



###rings
items.rings.ring.diamond=nhẫn kim cương
items.rings.ring.opal=nhẫn mắt mèo
items.rings.ring.garnet=nhẫn thạch lựu
items.rings.ring.ruby=nhẫn hồng ngọc
items.rings.ring.amethyst=nhẫn thạch anh tím
items.rings.ring.topaz=nhẫn hoàng ngọc
items.rings.ring.onyx=nhẫn onyx
items.rings.ring.tourmaline=nhẵn tourmaline
items.rings.ring.emerald=nhẵn ngọc lục bảo
items.rings.ring.sapphire=nhẫn sapphire
items.rings.ring.quartz=nhẫn thạch anh
items.rings.ring.agate=nhẫn agate
items.rings.ring.equip_cursed=Chiếc nhẫn siết chặt lấy ngón tay của bạn một cách đầy đau đớn!
items.rings.ring.unknown_desc=Chiếc vòng kim loại này được tô điểm bằng một viên đá quý lớn lấp lánh trong bóng tối. Liệu nó sẽ có hiệu ứng gì khi được đeo?
items.rings.ring.known=Đây là một chiếc %s
items.rings.ring.identify=Giờ đây bạn đã đủ quen thuộc với chiếc nhẫn của bạn để thẩm định nó.
items.rings.ring.cursed_worn=Bởi vì cái nhẫn này bị nguyền, bạn bất lực trong việc tháo nó ra.
items.rings.ring.curse_known=Bạn có thể cảm thấy một phép thuật hắc ám ẩn nấp trong chiếc nhẫn này.
items.rings.ring.not_cursed=Chiếc nhẫn này không dính phép thuật hắc ám.

items.rings.ringofaccuracy.name=nhẫn của sự chính xác
items.rings.ringofaccuracy.stats=Khi đeo, chiếc nhẫn này sẽ tăng độ chính xác của bạn lên _%s%%._
items.rings.ringofaccuracy.typical_stats=Khi đeo, chiếc nhẫn này thông thường sẽ tăng độ chính xác của bạn lên _%s%%._
items.rings.ringofaccuracy.combined_stats=Những chiếc nhẫn được trang bị của bạn đang kết hợp sức mạnh của chúng, tăng độ chính xác của bạn thêm tổng cộng _%s%%_.
items.rings.ringofaccuracy.upgrade_stat_name_1=Tăng cường độ chính xác
items.rings.ringofaccuracy.desc=Chiếc nhẫn này tăng sự tập trung của bạn, giúp các đòn tấn công của bạn dễ dàng đánh trúng hơn. Thay vào đó, một chiếc nhẫn bị nguyền sẽ khiến các đòn tấn công của bạn khó liên kết với nhau hơn.

items.rings.ringofarcana.name=nhẫn bí thuật
items.rings.ringofarcana.stats=Khi đeo, chiếc nhẫn này sẽ tăng cường sức mạnh của các phù phép và kí tự thêm _%s%%._
items.rings.ringofarcana.typical_stats=Khi được đeo, chiếc nhẫn này thông thường sẽ tăng cường sức mạnh của các phù phép và kí tự thêm _%s%%._
items.rings.ringofarcana.combined_stats=Những chiếc nhẫn được trang bị của bạn đang kết hợp sức mạnh của chúng, tăng sức mạnh của các phù phép và ký tự thêm tổng cộng _%s%%_.
items.rings.ringofarcana.upgrade_stat_name_1=Tăng cường phù phép và kí tự
items.rings.ringofarcana.desc=Chiếc nhẫn này sẽ tăng cường các phù phép ma thuật trên các vũ khí và các kí tự trên áo giáp, bao gồm cả những lời nguyền! Đầu tiên nó sẽ tăng cơ hội kích hoạt, rồi sau đó tăng sức mạnh của hiệu ứng khi cơ hội kích hoạt đạt 100%. Một chiếc nhẫn bị nguyền ngược lại sẽ làm suy yếu các phù phép, kí tự và lời nguyền.

items.rings.ringofelements.name=nhẫn nguyên tố
items.rings.ringofelements.stats=Khi được đeo, chiếc nhẫn này sẽ trao sự kháng nguyên tố _%s%%_.
items.rings.ringofelements.typical_stats=Khi được đeo, chiếc nhẫn này thông thường sẽ trao sự kháng nguyên tố _%s%%._
items.rings.ringofelements.combined_stats=Những chiến nhẫn được trang bị của bạn đang kết hợp sức mạnh của chúng, trao tổng cộng _%s%%_ kháng nguyên tố.
items.rings.ringofelements.upgrade_stat_name_1=Mức độ kháng
items.rings.ringofelements.desc=Chiếc nhẫn này cung cấp sự kháng lại hầu hết các nguyên tố và hiệu ứng phép thuật, giảm sát thương và thời lượng của hiệu ứng xấu. Thông thường một chiếc nhẫn bị nguyền sẽ thay vào đó làm những hiệu ứng này tồi tệ hơn.

items.rings.ringofenergy.name=nhẫn năng lượng
items.rings.ringofenergy.stats=Khi được đeo, chiếc nhẫn này sẽ tăng tốc độ hồi đũa phép, cổ vật và áo giáp người hùng lên _%s%%._
items.rings.ringofenergy.typical_stats=Khi được đeo, chiếc nhẫn này thông thường sẽ tăng tốc độ hồi đũa phép, cổ vật và áo giáp người hùng lên _%s%%._
items.rings.ringofenergy.combined_stats=Những chiến nhẫn được trang bị của bạn đang kết hợp sức mạnh của chúng, tăng tốc độ hồi năng thêm tổng cộng _%s%%_.
items.rings.ringofenergy.upgrade_stat_name_1=Tăng cường hồi năng
items.rings.ringofenergy.desc=Trang bị ma thuật của bạn sẽ hồi năng lại nhanh hơn trong một trường phép thuật phát ra từ chiếc nhẫn này. Một chiếc nhẫn bị nguyền rủa sẽ thay vào đó làm chậm quá trình hồi năng lại.

items.rings.ringofevasion.name=nhẫn né tránh
items.rings.ringofevasion.stats=Khi được đeo, chiếc nhẫn này sẽ tăng khả năng né tránh của bạn thêm _%s%%._
items.rings.ringofevasion.typical_stats=Khi được đeo, chiếc nhẫn này thông thường sẽ tăng khả năng né tránh của bạn thêm _%s%%._
items.rings.ringofevasion.combined_stats=Những chiến nhẫn được trang bị của bạn đang kết hợp sức mạnh của chúng, tăng khả năng né tránh của bạn thêm tổng cộng _%s%%_.
items.rings.ringofevasion.upgrade_stat_name_1=Tăng cường né tránh
items.rings.ringofevasion.desc=Chiếc nhẫn này tăng tốc độ phản xạ của người đeo, khiến cho việc giáng đòn lên họ khó khăn hơn. Một chiếc nhẫn bị nguyền sẽ thay vào đó khiến người sử dụng dễ bị đánh hơn.

items.rings.ringofforce.name=nhẫn lực đánh
items.rings.ringofforce.stats=Khi không dùng vũ khí, ở mức sức mạnh hiện tại của bạn, chiếc nhẫn này sẽ gây _%1$d-%2$d sát thương._ Với một món vũ khí trên tay, chiếc nhẫn này sẽ tăng sát thương thêm _%3$d._
items.rings.ringofforce.typical_stats=Khi không dùng vũ khí, ở mức sức mạnh hiện tại của bạn, chiếc nhẫn này thường sẽ gây _%1$d-%2$d sát thương._ Với một món vũ khí trên tay, chiếc nhẫn này thường sẽ tăng sát thương thêm _%3$d._
items.rings.ringofforce.combined_stats=Những chiến nhẫn được trang bị của bạn đang kết hợp sức mạnh của chúng, gây tổng cộng _%1$d-%2$d sát thương_ nếu không có vũ khí, hoặc tăng thêm _%3$d_ sát thương nếu có.
items.rings.ringofforce.upgrade_stat_name_1=Sát thương không vũ khí
items.rings.ringofforce.upgrade_stat_name_2=Tăng cường sát thương vũ khí
items.rings.ringofforce.upgrade_stat_name_3=Sát thương kĩ năng
items.rings.ringofforce.ability_name=thế đứng chiến binh
items.rings.ringofforce.typical_ability_desc=Kiếm sĩ có thể vào một _thế đứng chiến binh_ với chiếc nhẫn này, khiến cho những đòn tấn công thông thường của cô luôn luôn sử dụng chiếc nhẫn này kể cả khi đang trang bị một vũ khí. Những đòn tấn công này thường sẽ gây _%1$d-%2$d sát thương_ và cũng sẽ thừa hưởng phù phép và cường hóa của vũ khí. Thế đứng này làm tốc độ hồi năng vũ khí chậm đi 50%%.
items.rings.ringofforce.ability_desc=Kiếm sĩ có thể vào một _thế đứng chiến binh_ với chiếc nhẫn này, khiến cho những đòn tấn công thông thường của cô luôn luôn sử dụng chiếc nhẫn này kể cả khi đang trang bị một vũ khí. Những đòn tấn công này sẽ gây _%1$d-%2$d sát thương_ và cũng sẽ thừa hưởng phù phép và cường hóa của vũ khí. Thế đứng này làm tốc độ hồi năng vũ khí chậm đi 50%%.
items.rings.ringofforce.desc=Chiếc nhẫn này nâng cao lực đánh trong các đòn cận chiến của người đeo. Lực đánh thêm này khá là yếu khi cầm vũ khí, nhưng một đòn tấn công không dùng vũ khí sẽ trở nên mạnh hơn nhiều. Một chiếc nhẫn bị nguyền sẽ thay vào đó làm yếu đi các đòn đánh của người đeo.
items.rings.ringofforce$brawlersstance.name=thế đứng chiến binh
items.rings.ringofforce$brawlersstance.desc=Khi đang ở trong thế đứng này, các đòn tấn công thông thường của Kiếm sĩ sẽ sử dụng một chiếc nhẫn lực đánh đã được trang bị kể cả khi cô ấy có trang bị một vũ khí. Những đòn tấn công này được tăng sát thương và sẽ vẫn sử dụng cường hóa và phù phép của món vũ khí.\n\nTuy vậy, duy trì thế đứng này cần sự tập trung, làm giảm tốc độ hồi năng vũ khí đi 50%.\n\nThế đứng này có thể được bật hoặc tắt bằng cách sử dụng một chiếc nhẫn lực đánh, nhưng sự giảm tốc độ hồi năng sẽ còn tồn tại trong một thời gian ngắn nếu thế đứng được kích hoạt và hủy nhanh chóng.

items.rings.ringoffuror.name=nhẫn căm giận
items.rings.ringoffuror.stats=Khi được đeo, chiếc nhẫn này sẽ tăng tốc độ của các đòn tấn công của bạn thêm _%s%%._
items.rings.ringoffuror.typical_stats=Khi được đeo, chiếc nhẫn này thông thường sẽ tăng tốc độ các đòn tấn công của bạn thêm _%s%%._
items.rings.ringoffuror.combined_stats=Những chiếc nhẫn được trang bị của bạn đang kết hợp sức mạnh của chúng, tăng tốc độ của các đòn tấn công của bạn thêm tổng cộng _%s%%_.
items.rings.ringoffuror.upgrade_stat_name_1=Tăng tốc độ tấn công
items.rings.ringoffuror.desc=Chiếc nhẫn tạo ra một cơn giận dữ bên trong người đeo, cho phép họ tấn công nhanh hơn. Một chiếc nhẫn bị nguyền sẽ thay vào đó làm chậm tốc độ tấn công của người đeo.

items.rings.ringofhaste.name=nhẫn nhanh nhẹn
items.rings.ringofhaste.stats=Khi được đeo, chiếc nhẫn này sẽ tăng tốc độ di chuyển của bạn thêm _%s%%._
items.rings.ringofhaste.typical_stats=Khi được đeo, chiếc nhẫn này thông thường sẽ tăng tốc độ di chuyển của bạn thêm _%s%%._
items.rings.ringofhaste.combined_stats=Những chiến nhẫn được trang bị của bạn đang kết hợp sức mạnh của chúng, tăng tốc độ di chuyển của bạn thêm tổng cộng _%s%%_.
items.rings.ringofhaste.upgrade_stat_name_1=Tăng tốc độ di chuyển
items.rings.ringofhaste.desc=Chiếc nhẫn này làm giảm sự căng thẳng của chuyển động lên người đeo, cho phép họ chạy với tốc độ phi thường. Một chiếc nhẫn bị nguyền sẽ thay vào đó gây áp lực lên người đeo.

items.rings.ringofmight.name=nhẫn sức mạnh
items.rings.ringofmight.stats=Khi được đeo, chiếc nhẫn này sẽ tăng sức mạnh của bạn thêm _%1$d_ và HP tối đa của bạn thêm _%2$s%%._
items.rings.ringofmight.typical_stats=Khi được đeo, chiếc nhẫn này thông thường sẽ tăng sức mạnh của bạn thêm _%1$d_ và HP tối đa của bạn thêm _%2$s%%._
items.rings.ringofmight.combined_stats=Những chiến nhẫn được trang bị của bạn đang kết hợp sức mạnh của chúng, tăng tổng cộng _%1$d_ sức mạnh và _%2$s%%_ sinh lực tối đa của bạn.
items.rings.ringofmight.upgrade_stat_name_1=Tăng sức mạnh
items.rings.ringofmight.upgrade_stat_name_2=Tăng cường sinh lực tối đa
items.rings.ringofmight.desc=Chiếc nhẫn này cải thiện các đặc tính vật lí của người đeo, cho họ sức mạnh vật lí và thể chất lớn hơn. Một chiếc nhẫn bị nguyền sẽ làm yếu người đeo.

items.rings.ringofsharpshooting.name=nhẫn thiện xạ
items.rings.ringofsharpshooting.stats=Khi được đeo, chiếc nhẫn này sẽ tăng sát thương của các vũ khí ném của bạn như thể cấp độ của chúng đã được tăng thêm _%1$d_. và sẽ tăng độ bền của chúng thêm _%2$s%%._
items.rings.ringofsharpshooting.typical_stats=Khi được đeo, chiếc nhẫn này thường sẽ tăng sát thương của các vũ khí ném của bạn như thể cấp độ của chúng đã được tăng thêm _%1$d_. và sẽ tăng độ bền của chúng thêm _%2$s%%._
items.rings.ringofsharpshooting.combined_stats=Những chiến nhẫn được trang bị của bạn đang kết hợp sức mạnh của chúng, nâng tổng cộng _%1$d_ cấp độ tạm thời của vũ khí ném và tăng _%2$s%%_ độ bền của chúng.
items.rings.ringofsharpshooting.upgrade_stat_name_1=Tăng cường cấp độ sát thương
items.rings.ringofsharpshooting.upgrade_stat_name_2=Tăng cường độ bền
items.rings.ringofsharpshooting.desc=Chiếc nhẫn này cải thiện độ chính xác và khả năng nhắm của người đeo, khiến mọi vũ khí dạng vật phóng có tính sát thương và độ bền cao hơn. Một chiếc nhẫn bị nguyền sẽ có tác dụng ngược lại.

items.rings.ringoftenacity.name=nhẫn bền bỉ
items.rings.ringoftenacity.stats=Khi được đeo, chiếc nhẫn này sẽ giảm sát thương bạn nhận lên đến _%s%%._
items.rings.ringoftenacity.typical_stats=Khi được đeo, chiếc nhẫn này thông thường sẽ giảm sát thương bạn nhận lên đến _%s%%._
items.rings.ringoftenacity.combined_stats=Những chiến nhẫn được trang bị của bạn đang kết hợp sức mạnh của chúng, giảm tổng cộng _%s%%_ lượng sát thương bạn nhận vào.
items.rings.ringoftenacity.upgrade_stat_name_1=Kháng sát thương tối đa
items.rings.ringoftenacity.desc=Khi được đeo, chiếc nhẫn này sẽ cho phép người đeo kháng lại những đòn chí tử thông thường. Người đeo bị thương càng nặng, họ sẽ càng kháng lại nhiều sát thương hơn. Một chiếc nhẫn bị nguyền sẽ thay vào đó khiến kẻ địch dễ dàng kết liễu người đeo hơn.

items.rings.ringofwealth.name=nhẫn giàu sang
items.rings.ringofwealth.stats=Khi được đeo, chiếc nhẫn này sẽ tăng vận may của bạn thêm _%s%%._
items.rings.ringofwealth.typical_stats=Khi được đeo, chiếc nhẫn này thông thường sẽ tăng vận may của bạn thêm _%s%%._
items.rings.ringofwealth.combined_stats=Những chiến nhẫn được trang bị của bạn đang kết hợp sức mạnh của chúng, tăng vận may của bạn thêm tổng cộng _%s%%_.
items.rings.ringofwealth.upgrade_stat_name_1=Tăng cường vận may
items.rings.ringofwealth.desc=Chiếc nhẫn này giống như một chiếc nam châm cho kho báu, nó tăng khả năng các kẻ địch và vật chứa mang theo những vật phẩm có giá trị. Một chiếc nhẫn bị nguyền sẽ thay vào đó giảm cơ hội nhận chiến lợi phẩm của bạn.



###scrolls
items.scrolls.scroll.ac_read=ĐỌC
items.scrolls.scroll.kaunan=cuộn giấy KAUNAN
items.scrolls.scroll.sowilo=cuộn giấy SOWILO
items.scrolls.scroll.laguz=cuộn giấy LAGUZ
items.scrolls.scroll.yngvi=cuộn giấy YNGVI
items.scrolls.scroll.gyfu=cuộn giấy GYFU
items.scrolls.scroll.raido=cuộn giấy RAIDO
items.scrolls.scroll.isaz=cuộn giấy ISAZ
items.scrolls.scroll.mannaz=cuộn giấy MANNAZ
items.scrolls.scroll.naudiz=cuộn giấy NAUDIZ
items.scrolls.scroll.berkanan=cuộn giấy BERKANAN
items.scrolls.scroll.odal=cuộn giấy ODAL
items.scrolls.scroll.tiwaz=cuộn giấy TIWAZ
items.scrolls.scroll.unknown_desc=Một chữ rune ma thuật không thể phiên dịch được viết trên tấm giấy da này. Liệu chuyện gì sẽ xảy ra khi nó được đọc to lên?
items.scrolls.scroll.blinded=Bạn không thể đọc một cuộn giấy khi bị mù.
items.scrolls.scroll.no_magic=Bạn không thể đọc một cuộn giấy khi miễn nhiễm phép thuật.
items.scrolls.scroll.cursed=Cuốn sách phép bị nguyền của bạn ngăn bạn sử dụng phép thuật của cuộn giấy này! Dù vậy một cuộn giấy xóa lời nguyền có thể vẫn đủ mạnh để hoạt động...
items.scrolls.scroll$placeholder.name=cuộn giấy

items.scrolls.inventoryscroll.warning=Bạn có thật sự muốn hủy việc sử dụng cuộn giấy này? Cuộn giấy chưa được thẩm định trước đó, vậy nên nó vẫn sẽ bị tiêu hủy.
items.scrolls.inventoryscroll.yes=Có, tôi chắc chắn
items.scrolls.inventoryscroll.no=Không, tôi đổi ý rồi

items.scrolls.scrollofidentify.name=cuộn giấy thẩm định
items.scrolls.scrollofidentify.inv_title=Thẩm định một vật phẩm
items.scrolls.scrollofidentify.it_is=Vật phẩm của bạn đã được thẩm định: %s.
items.scrolls.scrollofidentify.desc=Cuộn giấy này vĩnh viễn hé lộ tất cả bí mật của một vật phẩm duy nhất.

items.scrolls.scrolloflullaby.name=cuộn giấy khúc hát ru
items.scrolls.scrolloflullaby.sooth=Cuộn giấy phát ra một giai điệu êm dịu. Bạn cảm thấy rất buồn ngủ.
items.scrolls.scrolloflullaby.desc=Việc đọc cuộn giấy này sẽ phát ra một giai điệu êm dịu, đưa tất cả những ai nghe nó vào một giấc ngủ phép thuật sâu. Đối với người đọc và nhưng đồng minh của họ, giấc ngủ có tính hồi phục.

items.scrolls.scrollofmagicmapping.name=cuộn giấy lập bản đồ phép thuật
items.scrolls.scrollofmagicmapping.layout=Giờ bạn đã biết rõ về bố cục tầng.
items.scrolls.scrollofmagicmapping.desc=Khi cuộn giấy này được đọc, một hình ảnh rõ nét sẽ được khắc vào kí ức của bạn, báo cho bạn bố cục chính xác của tầng và hé lộ tất cả bị mật được ẩn. Vị trí của các vật phẩm và sinh vật sẽ vẫn không được biết.

items.scrolls.scrollofmirrorimage.name=cuộn giấy ảo ảnh
items.scrolls.scrollofmirrorimage.copies=Cuộn giấy tạo ra các ảo ảnh của bản thân bạn.
items.scrolls.scrollofmirrorimage.no_copies=Cuộn giấy cố thử tạo ra các ảo ảnh của bản thân bạn, nhưng chúng không biết đi đâu cả.
items.scrolls.scrollofmirrorimage.desc=Câu thần chú trên cuộn giấy này sẽ tạo ra hai ảo ảnh của người đọc. Những ảo ảnh này giống như những bản sao yếu hơn của người đọc, và sẽ truy đuổi kẻ thù của họ. Tuy nhiên, chúng không có độ bền và sẽ tan biến khi nhận sát thương.

items.scrolls.scrollofretribution.name=cuộn giấy báo thù
items.scrolls.scrollofretribution.blast=Luồng năng lượng mạnh mẽ tuôn trào ra từ cuộn giấy!
items.scrolls.scrollofretribution.desc=Cuộn giấy này chứa năng lượng hủy diệt, chuyển sự đau đớn của người đọc ra bên ngoài thành một luồng sức mạnh. Người đọc càng yếu, chúng sẽ càng gây nhiều sát thương. Khi sức khỏe rất thấp, cuộn giấy này có thể giết hầu hết kẻ thù ngay lập tức.\n\nTuy nhiên, việc sử dụng cuộn giấy sẽ gây thiệt hại cho người dùng, làm mù và suy yếu họ.

items.scrolls.scrollofrage.name=cuộn giấy thịnh nộ
items.scrolls.scrollofrage.roar=Cuộn giấy này phát ra tiếng gầm giận dữ vang vọng khắp hầm ngục!
items.scrolls.scrollofrage.desc=Khi được đọc thành tiếng, cuộn giấy này sẽ giải phóng một tiếng gầm lớn, kéo tất cả kẻ địch đến chỗ người đọc, và làm nổi giận những kẻ địch ở gần.

items.scrolls.scrollofrecharging.name=cuộn giấy hồi năng
items.scrolls.scrollofrecharging.surge=Một nguồn năng lượng chạy qua cơ thể bạn, tiếp thêm năng lượng cho các cây đũa phép của bạn!
items.scrolls.scrollofrecharging.desc=Sức mạnh phép thuật thô được lưu giữ trong tấm da này sẽ hồi năng lượng cho các cây đũa phép của người sử dụng theo thời gian khi được giải phóng.

items.scrolls.scrollofremovecurse.name=cuộn giấy xóa lời nguyền
items.scrolls.scrollofremovecurse.inv_title=Thanh tẩy một vật phẩm
items.scrolls.scrollofremovecurse.cleansed=Vật phẩm của bạn phát sáng với một ánh sáng thanh tẩy, và một nguồn năng lượng hắc ám phân tán!
items.scrolls.scrollofremovecurse.not_cleansed=Vật phẩm của bạn phát sáng với một ánh sáng thanh tẩy, nhưng chẳng có gì xảy ra.
items.scrolls.scrollofremovecurse.spirit=Cuộn ma thuật của bạn đã giải thoát cho linh hồn đau buồn!
items.scrolls.scrollofremovecurse.desc=Câu thần chú trên cuộn giấy này sẽ ngay lập tức loại bỏ bất kì lời nguyền nào khỏi một vũ khí, nhẫn, đũa phép, áo giáp hoặc cổ vật.

items.scrolls.scrollofteleportation.name=cuộn giấy dịch chuyển
items.scrolls.scrollofteleportation.tele=Trong một cái chớp mắt bạn đã được dịch chuyển đến một địa điểm khác của tầng.
items.scrolls.scrollofteleportation.no_tele=Phép thuật dịch chuyển thất bại.
items.scrolls.scrollofteleportation.cant_reach=Bạn không thể dịch chuyển đến đó.
items.scrolls.scrollofteleportation.prompt=Chọn một vị trí để dịch chuyển đến
items.scrolls.scrollofteleportation.desc=Câu thần chú trên tấm giấy da này ngay lập tức đưa người đọc đến một địa điểm khác trên tầng ngục. Cuộn giấy ưu tiên các khu vực người đọc chưa tới trước đó, tuy nhiên dịch chuyển qua các cánh cửa bị khóa hay rào chắn là không thể. Tuy nhiên, nó có thể hé lộ những cánh cửa ẩn dẫn tới những khu vực mới.

items.scrolls.scrollofterror.name=cuộn giấy khiếp sợ
items.scrolls.scrollofterror.none=Cuộn giấy phát ra một ánh sáng đỏ chớp nhoáng rực rỡ.
items.scrolls.scrollofterror.one=Cuộn giấy phát ra một ánh sáng đỏ chớp nhoáng rực rỡ và %s bỏ chạy!
items.scrolls.scrollofterror.many=Cuộn giấy phát ra một ánh sáng đỏ chớp nhoáng rực rỡ và những con quái vật bỏ chạy!
items.scrolls.scrollofterror.desc=Khi được đọc, cuộn giấy này sẽ phát ra một ánh sáng đỏ chớp nhoáng, nó sẽ nhấn chìm tất cả kẻ địch trong tầm nhìn của bạn với nỗi khiếp sợ, và chúng sẽ quay đầu và bỏ chạy. Tấn công một kẻ địch đang bỏ chạy sẽ rút ngắn hiệu ứng.

items.scrolls.scrolloftransmutation.name=cuộn giấy biến đổi
items.scrolls.scrolloftransmutation.inv_title=Biến đổi một vật phẩm
items.scrolls.scrolloftransmutation.nothing=Không có gì đáng chú ý xảy ra.
items.scrolls.scrolloftransmutation.morph=Vật phẩm của bạn từ từ biến đổi thành thứ gì đó khác!
items.scrolls.scrolloftransmutation.desc=Cuộn giấy này chứa phép thuật biến đổi mạnh mẽ. Khi được sử dụng lên một vật phẩm thích hợp nó sẽ biến đổi nó thành một vật phẩm khác cùng loại. Phép thuật này thậm chí sẽ giữ lại các nâng cấp, phù phép, và ký tự. Các cuộn giấy và lọ thuốc sẽ được biến đổi thành dạng kì lạ tương ứng của chúng, và ngược lại.

items.scrolls.scrollofupgrade.name=cuộn giấy nâng cấp
items.scrolls.scrollofupgrade.inv_title=Nâng cấp một món đồ
items.scrolls.scrollofupgrade.weaken_curse=Cuộn giấy nâng cấp làm yếu đi lời nguyền trên vật phẩm của bạn.
items.scrolls.scrollofupgrade.remove_curse=Cuộn giấy nâng cấp thanh tẩy lời nguyền trên vật phẩm của bạn.
items.scrolls.scrollofupgrade.desc=Cuộn giấy này sẽ nâng cấp một vật phẩm hoặc một bộ vũ khí ném. Đũa phép sẽ tăng sức mạnh và số năng lượng, vũ khí và áo giáp sẽ gây và chặn nhiều sát thương hơn, các bộ vũ khí ném sẽ được sửa lại hoàn toàn trở nên bền hơn, và hiệu ứng của những chiếc nhẫn sẽ được tăng cường.\n\nNó còn có thể làm suy yếu hoặc đôi khi hoàn toàn giải trừ các lời nguyền, mặc dù nó không mạnh bằng một cuộn giấy xóa lời nguyền. Đáng tiếc là, phép thuật nâng cấp cũng có thể xóa bỏ các phù phép hoặc ký tự trên trang bị cấp cao.



###exotic scrolls
items.scrolls.exotic.exoticscroll.kaunan=cuộn giấy KAUNAN kì lạ
items.scrolls.exotic.exoticscroll.sowilo=cuộn giấy SOWILO kì lạ
items.scrolls.exotic.exoticscroll.laguz=cuộn giấy LAGUZ kì lạ
items.scrolls.exotic.exoticscroll.yngvi=cuộn giấy YNGVI kì lạ
items.scrolls.exotic.exoticscroll.gyfu=cuộn giấy GYFU kì lạ
items.scrolls.exotic.exoticscroll.raido=cuộn giấy RAIDO kì lạ
items.scrolls.exotic.exoticscroll.isaz=cuộn giấy ISAZ kì lạ
items.scrolls.exotic.exoticscroll.mannaz=cuộn giấy MANNAZ kì lạ
items.scrolls.exotic.exoticscroll.naudiz=cuộn giấy NAUDIZ kì lạ
items.scrolls.exotic.exoticscroll.berkanan=cuộn giấy BERKANAN kì lạ
items.scrolls.exotic.exoticscroll.odal=cuộn giấy ODAL kì lạ
items.scrolls.exotic.exoticscroll.tiwaz=cuộn giấy TIWAZ kì lạ
items.scrolls.exotic.exoticscroll.unknown_desc=Một chữ rune ma thuật phát sáng, không thể dịch được viết trên tấm giấy da đen này. Nó có vẻ xa lạ với vùng đất này, ai biết nó sẽ làm gì khi được đọc to lên?
items.scrolls.exotic.exoticscroll.discover_hint=Bạn có thể chế tạo vật phẩm này bằng thuật giả kim.

items.scrolls.exotic.scrollofsirenssong.name=cuộn giấy tiếng hát của siren
items.scrolls.exotic.scrollofsirenssong.prompt=Chọn một mục tiêu
items.scrolls.exotic.scrollofsirenssong.no_target=Cuộn giấy kích hoạt mà không có mục tiêu.
items.scrolls.exotic.scrollofsirenssong.cancel=Bạn phải chọn một mục tiêu.
items.scrolls.exotic.scrollofsirenssong.desc=Việc đọc cuộn giấy này sẽ phát ra một giai điệu làm say mê, và sẽ hấp dẫn một kẻ địch được chọn, biến chúng thành một đồng minh vĩnh viễn! Những kẻ địch khác nghe thấy nó sẽ bị mê hoặc tạm thời.\n\nKẻ địch đặc biệt mạnh có thể chống lại hiệu ứng hấp dẫn và thay vào đó sẽ bị mê hoặc.
items.scrolls.exotic.scrollofsirenssong$enthralled.name=bị hấp dẫn
items.scrolls.exotic.scrollofsirenssong$enthralled.desc=Sinh vật này đã bị hút hồn bởi phép thuật từ cuộn giấy tiếng hát của siren.\n\nMột nhân vật bị hấp dẫn sẽ vĩnh viễn là đồng minh của bạn, và sẽ tấn công bất kì kẻ địch nào chúng bắt gặp.

items.scrolls.exotic.scrollofantimagic.name=cuộn giấy chống phép thuật
items.scrolls.exotic.scrollofantimagic.desc=Câu thần chú trên cuộn giấy này sẽ bao bọc bạn bằng một trường phép thuật, tạm thời chặn tất cả hiệu ứng phép thuật, bất kể có hại hay có lợi. Điều này bao gồm hầu hết hiệu ứng của các vật phẩm phép thuật như đũa phép, cuộn giấy, nhẫn, cổ vật, phù phép và lời nguyền. Tuy nhiên các kĩ năng của áo giáp người hùng vẫn đủ mạnh để hoạt động.

items.scrolls.exotic.scrollofchallenge.name=cuộn giấy thử thách
items.scrolls.exotic.scrollofchallenge.desc=Khi được đọc, cuộn giấy này sẽ giải phóng một tiếng gầm lớn gây chú ý của mọi kẻ thù đến người đọc đồng thời tạo ra một đấu trường nhỏ xung quanh.\n\nMiễn là người đọc ở trong đấu trường này họ sẽ được giảm 33% lượng sát thương nhận vào từ mọi nguồn (điều này sẽ được áp dụng trước các dạng giảm sát thương khác), đồng thời họ cũng sẽ không bị đói.\n\nKích thước của đấu trường này tỉ lệ với diện tích của căn phòng người đọc đang ở. Nó sẽ khá nhỏ ở một số phòng trùm.
items.scrolls.exotic.scrollofchallenge$challengearena.name=Đấu trường thử thách
items.scrolls.exotic.scrollofchallenge$challengearena.desc=Một đấu trường phép thuật đã xuất hiện xung quanh bạn, được biểu thị bởi một lớp sương mù đỏ cuồn cuộn.\n\nKhi đứng trong lớp sương mù, cơn đói của bạn sẽ không tăng và bạn sẽ được giảm 33%% sát thương phải nhận từ mọi nguồn. Nếu bạn có bất kì nguồn giảm sát thương khác (như là áo giáp), chúng sẽ được áp dụng sau khi đã giảm 33%%.\n\nLượt còn lại: %d.

items.scrolls.exotic.scrollofdivination.name=cuộn giấy tiên đoán
items.scrolls.exotic.scrollofdivination.nothing_left=Không còn gì để thẩm định cả!
items.scrolls.exotic.scrollofdivination.desc=Cuộn giấy này sẽ ngẫu nhiên thẩm định bốn vật phẩm mà hiện tại bạn chưa biết. Những thứ được thẩm định có thể là màu của một lọ thuốc, chữ rune của một cuộn giấy, hoặc viên đá của một chiếc nhẫn. Các vật phẩm được thẩm định không nhất thiết phải là những vật bạn đang mang theo.
items.scrolls.exotic.scrollofdivination$wnddivination.desc=Cuộn giấy tiên đoán của bạn đã nhận dạng các vật phẩm sau:

items.scrolls.exotic.scrollofdread.name=cuộn giấy kinh sợ
items.scrolls.exotic.scrollofdread.desc=Khi được đọc, cuộn giấy này phát ra một ánh sáng đỏ, truyền vào tâm trí tất cả kẻ địch trong tầm nhìn của bạn một nỗi khiếp sợ to lớn. Hiệu ứng này mạnh đến mức chúng sẽ nhanh chóng cố thoát khỏi toàn bộ hầm ngục, biệt tích!\n\nCũng như khiếp sợ, hiệu ứng này sẽ kết thúc sau một thời gian, hoặc nếu kẻ địch bị tấn công.\n\nKẻ địch với ý chí mạnh mẽ, như trùm, sẽ thay vào đó chịu hiệu ứng khiếp sợ bình thường.

items.scrolls.exotic.scrollofenchantment.name=cuộn giấy phù phép
items.scrolls.exotic.scrollofenchantment.inv_title=Phù phép một vật phẩm
items.scrolls.exotic.scrollofenchantment.weapon=Chọn phù phép để áp dụng vào vũ khí.
items.scrolls.exotic.scrollofenchantment.armor=Chọn ký tự để áp dụng vào áo giáp.
items.scrolls.exotic.scrollofenchantment.cancel=hủy
items.scrolls.exotic.scrollofenchantment.cancel_warn=Hủy bỏ sẽ vẫn tiêu tốn cuộn giấy phù phép của bạn, bạn chắc chứ?
items.scrolls.exotic.scrollofenchantment.cancel_warn_yes=Có, tôi chắc chắn.
items.scrolls.exotic.scrollofenchantment.cancel_warn_no=Không, tôi đổi ý rồi
items.scrolls.exotic.scrollofenchantment.desc=Cuộn giấy này sẽ hòa năng lượng phép thuật mạnh mẽ vào một vũ khí hoặc áo giáp. Người đọc thậm chí có một chút sự kiểm soát về việc phép thuật nào được hòa.

items.scrolls.exotic.scrollofforesight.name=cuộn giấy tiên tri
items.scrolls.exotic.scrollofforesight.desc=Sau khi đọc cuộn giấy này, chi tiết của địa hình xung quanh sẽ liên tục được gửi vào tâm trí của người đọc với độ rõ nét cao. Hiệu ứng này kéo dài trong một lượng thời gian đáng kể, và sẽ hé lộ tất cả cửa và bẫy ẩn, khiến cho việc tìm kiếm là không cần thiết.

items.scrolls.exotic.scrollofmetamorphosis.name=cuộn giấy biến hình
items.scrolls.exotic.scrollofmetamorphosis.choose_desc=Chọn một tài năng để biến hình.
items.scrolls.exotic.scrollofmetamorphosis.replace_desc=Chọn một tài năng mới để đổi với tài năng bị biến hình của bạn.
items.scrolls.exotic.scrollofmetamorphosis.cancel_warn=Hủy bỏ sẽ vẫn tiêu tốn cuộn giấy biến hình của bạn, bạn chắc chứ?
items.scrolls.exotic.scrollofmetamorphosis.metamorphose_talent=tài năng biến hình
items.scrolls.exotic.scrollofmetamorphosis.desc=Cuộn giấy này chứa phép thuật biến đổi mạnh mẽ, và sẽ áp dụng cho người sử dụng thay vì cho một vật phẩm. Phép thuật của cuộn giấy này sẽ cho bạn chọn một tài năng, và thay nó với một trong năm tài năng cùng bậc từ các lớp người hùng khác!\n\nHiệu ứng này chỉ áp dụng cho các tài năng lớp nhân vật, không phải tài năng nhận được từ lớp phụ hoặc các kĩ năng áo giáp. Những tài năng bạn không thể sử dụng sẽ không được đưa ra.

items.scrolls.exotic.scrollofmysticalenergy.name=cuộn giấy năng lượng thần bí
items.scrolls.exotic.scrollofmysticalenergy.desc=Năng lượng phép thuật thô được trói buộc trong tấm giấy da này khi được giải phóng sẽ sạc các cổ vật được trang bị của người dùng theo thời gian.

items.scrolls.exotic.scrollofpassage.name=cuộn giấy lối đi
items.scrolls.exotic.scrollofpassage.desc=Thần chú trên tấm giấy da này ngay lập tức đưa người đọc tới tầng đầu của khu vực gần nhất ở phía trên họ. Rất hữu ích để nhanh chóng tới một cửa hàng.

items.scrolls.exotic.scrollofprismaticimage.name=cuộn giấy ảnh đa sắc
items.scrolls.exotic.scrollofprismaticimage.desc=Câu thần chú trên cuộn giấy này sẽ tạo ra một bản sao ảo sắc màu của người đọc. Ảnh đa sắc này hoạt động như một bản sao yếu hơn của người đọc, với phòng thủ tương đương nhưng sinh lực và sát thương thấp hơn.\n\nẢnh đa sắc sẽ xuất hiện khi có kẻ địch, và sẽ cố bảo vệ người đọc.\n\nNếu một ảnh đa sắc đã tồn tại rồi, sử dụng cuộn giấy này sẽ phục hồi hoàn toàn cho nó.

items.scrolls.exotic.scrollofpsionicblast.name=cuộn giấy vụ nổ tâm lực
items.scrolls.exotic.scrollofpsionicblast.ondeath=Vụ nổ tâm lực xé rách tâm trí bạn...
items.scrolls.exotic.scrollofpsionicblast.desc=Cuộn giấy này chứa năng lượng có tính phá hủy không tưởng, có thể được điều hướng để phá hủy tâm trí tâm trí của mọi sinh vật có thể được nhìn thấy.\n\nTuy nhiên việc này cũng có hậu quả đáng kể, và người đọc cũng sẽ chịu sát thương, bị mù, và suy yếu. Cuộn giấy tấn công càng nhiều mục tiêu, sát thương bản thân phải nhận càng ít.



###spells
items.spells.alchemize.name=giả kim hóa
items.spells.alchemize.prompt=Giả kim hóa một vật phẩm
items.spells.alchemize.desc=Thần chú này chứa sức mạnh chuyển hóa tương tự như trong nồi giả kim. Mỗi lần sử dụng cho phép người sử dụng biến đổi một vật phẩm (hoặc chồng vật phẩm) thành vàng hoặc năng lượng giả kim. Biến các cuộn giấy hoặc thuốc thành năng lượng còn có thể thẩm định chúng!\n\nMột vài Giả kim hóa được bán trong cửa hàng, nhưng chúng có thể được tạo ra thêm bằng giả kim thuật bằng cách kết hợp một hạt giống, đá rune, và một ít năng lượng giả kim.
items.spells.alchemize$wndalchemizeitem.sell=Biến thành %dv
items.spells.alchemize$wndalchemizeitem.sell_1=Biến 1 thành %dv
items.spells.alchemize$wndalchemizeitem.sell_all=Biến tất cả thành %dv
items.spells.alchemize$wndalchemizeitem.energize=Chuyển hoá thành %d năng lượng
items.spells.alchemize$wndalchemizeitem.energize_1=Chuyển 1 thành%d năng lượng
items.spells.alchemize$wndalchemizeitem.energize_all=Chuyển hết thành %d năng lượng

items.spells.beaconofreturning.name=đèn hiệu trở về
items.spells.beaconofreturning.preventing=Trường phép thuật mạnh mẽ của nơi này ngăn bạn sử dụng thần chú này!
items.spells.beaconofreturning.creatures=Trường tâm linh của các sinh vật ở gần không cho phép bạn dịch chuyển tại thời điểm này.
items.spells.beaconofreturning.set=Chiếc đèn hiệu đã được đặt ở vị trí hiện tại của bạn.
items.spells.beaconofreturning.wnd_body=Việc đặt vị trí sẽ ghi đè lên vị trí chiếc đèn hiệu được đặt trước đó.\n\nViệc trở lại sẽ đưa bạn trở lại vị trí được đặt gần đây nhất và tiêu thụ một lần sử dụng của thần chú.
items.spells.beaconofreturning.wnd_set=Đặt
items.spells.beaconofreturning.wnd_return=Về
items.spells.beaconofreturning.desc_set=Chiếc đèn hiệu đã được đặt ở đâu đó trên tầng %d.
items.spells.beaconofreturning.desc=Thần chú tinh xảo này trao cho người dùng khả năng trở về một vị trí xác định, bất kể khoảng cách. Thần chú này sẽ chỉ bị tiêu thụ bởi việc trở về, nó có thể được đặt bao nhiêu lần tùy thích, nhưng nó sẽ chỉ nhớ vị trí gần đây nhất nó được đặt.

items.spells.curseinfusion.name=kết hợp lời nguyền
items.spells.curseinfusion.inv_title=Nguyền một vật phẩm
items.spells.curseinfusion.desc=Thần chú này kết hợp một món trang bị với thứ phép thuật hắc ám mạnh mẽ tượng tự như phép thuật tồn tại bên trong DM-300. Vật phẩm nó được sử dụng lên sẽ ngay lập tức bị nguyền, và bất cứ phù phép hay ký tự nào sẽ bị ghi đè nếu có.\n\nĐối với vũ khí, áo giáp và gậy phép, vật phẩm ấy sẽ được nâng cấp bên cạnh việc bị nguyền. Nâng cấp của kết hợp lời nguyền không cộng dồn, và nâng cấp sẽ bị mất nếu vật phẩm được xóa nguyền.\n\nKết hợp lời nguyền cũng có thể được sử dụng nhiều lần để thay đổi lời nguyền trên một món vũ khí hay bộ giáp.

items.spells.spell.ac_cast=THI TRIỂN
items.spells.spell.no_magic=Bạn không thể sử dụng các thần chú khi đang miễn nhiễm với phép thuật.
items.spells.spell.discover_hint=Bạn có thể chế tạo vật phẩm này bằng thuật giả kim.

items.spells.magicalinfusion.name=kết hợp phép thuật
items.spells.magicalinfusion.inv_title=kết hợp một vật phẩm
items.spells.magicalinfusion.infuse=Vật phẩm của bạn được kết hợp với năng lượng phép thuật!
items.spells.magicalinfusion.desc=Thần chú này sở hữu cùng sức mạnh phép thuật với một cuộn giấy nâng cấp, nhưng ở một dạng ổn định hơn.\n\nNgoài việc nâng cấp một vật phẩm như bình thường, nó sẽ không bao giờ xóa một phù phép, kí tự hoặc lời nguyền.

items.spells.magicalporter.name=vận chuyển phép thuật
items.spells.magicalporter.inv_title=Dịch chuyển một vật phẩm
items.spells.magicalporter.nowhere=Không có nơi nào để bạn chuyển một vật phẩm tới.
items.spells.magicalporter.desc=Thần chú này sẽ vận chuyển bất kì vật phẩm nào nó được dùng lên một cách thần kì. Tuy nhiên không như một chiếc đèn hiệu của thương gia, các vật phẩm sẽ được vận chuyển tới lối vào của tầng trùm kế tiếp.

items.spells.phaseshift.name=dịch chuyển pha
items.spells.phaseshift.no_target=Không có cái gì để dịch chuyển ở đó cả.
items.spells.phaseshift.desc=Thần chú hỗn loạn này sẽ dịch chuyển bất cứ nhân vật nào nó được nhắm vào tới một vị trí ngẫu nhiên trên tầng hiện tại và làm choáng họ trong một khoảng thời gian đáng kể. Các kẻ địch mạnh sẽ có thể kháng lại hiệu ứng choáng. Thần chú này có thể được nhắm vào một mục tiêu hoặc chính người sử dụng.

items.spells.reclaimtrap.name=lấy lại bẫy
items.spells.reclaimtrap.no_trap=Không có cái bẫy nào ở đó.
items.spells.reclaimtrap.desc_trap=Thần chú này hiện đã sẵn sàng để kích hoạt một _%s._
items.spells.reclaimtrap.desc=Thần chú này chứa tàn dư năng lượng máy móc của DM-300. Khi được sử dụng lên một cái bẫy đang hoạt động, sức mạnh của cái bẫy sẽ được gắn vào bạn, cho phép bạn sử dụng thần chú này một lần nữa để phóng xuất sức mạnh này và kích hoạt hiệu ứng của cái bẫy ở bất cứ vị trí nào bạn muốn.\n\nTuy nhiên, một số bẫy có thể sẽ không hoạt động ở mọi địa điểm, và chỉ một cái bẫy có thể được chứa tại một thời điểm.

items.spells.recycle.name=tái chế
items.spells.recycle.inv_title=Tái chế một vật phẩm
items.spells.recycle.recycled=Vật phẩm của bạn đã được tái chế thành: %s.
items.spells.recycle.desc=Thần chú này chứa một dạng nhỏ hơn của phép thuật chuyển đổi. Dù nó sẽ không hoạt động lên trang bị, thần chú này sẽ biến một cuộn giấy, thuốc, hạt giống, đá rune, hoặc phi tiêu được tẩm thành một vật phẩm ngẫu nhiên cùng loại.

items.spells.summonelemental.name=triệu hồi nguyên tố
items.spells.summonelemental.ac_imbue=GHÉP
items.spells.summonelemental.imbue_prompt=Kết hợp với một vật phẩm
items.spells.summonelemental.desc=Thần chú này truyền đi năng lượng của than hồng nguyên tố được sử dụng để làm ra nó, và cho phép bạn triệu hồi một nguyên tố thân thiện để chiến dấu với bạn! Chỉ một nguyên tố có thể được triệu hồi một lúc, nhưng thần chú này có thể được sử dụng lại để đưa nguyên tố trở về với bạn miễn phí.
items.spells.summonelemental.desc_newborn=Thần chú này hiện chưa được kết hợp, và sẽ triệu hồi một _nguyên tố sơ sinh_ mà không có một đòn tấn công tầm xa. Bạn có thể kết hợp nó với một lọ thuốc lửa lỏng, thuốc băng giá, cuộn giấy hồi năng, hoặc cuộn giấy biến đổi đã thẩm định để cường hóa thần chú này, khiến cho các lần triệu hồi sau đó tạo ra một nguyên tố đầy đủ sức mạnh!
items.spells.summonelemental.desc_fire=Thần chú này hiện đang rất nóng, nó sẽ triệu hồi một _nguyên tố lửa_. Bạn có thể kết hợp một vật phẩm khác vào, nhưng thần chú này sẽ mất vật được kết hợp hiện tại.
items.spells.summonelemental.desc_frost=Thần chú này hiện đang rất lạnh, nó sẽ triệu hồi một _nguyên tố băng_. Bạn có thể kết hợp một vật phẩm khác vào, nhưng thần chú này sẽ mất vật được kết hợp hiện tại.
items.spells.summonelemental.desc_shock=Thần chú này hiện đang phát ra năng lượng tĩnh điện, nó sẽ triệu hồi một _nguyên tố điện_. Bạn có thể kết hợp một vật phẩm khác vào, nhưng thần chú này sẽ mất vật được kết hợp hiện tại.
items.spells.summonelemental.desc_chaos=Thần chú này hiện đang phát ra năng lượng hỗn loạn, nó sẽ triệu hồi một _nguyên tố hỗn loạn_. Bạn có thể kết hợp một vật phẩm khác vào, nhưng thần chú này sẽ mất vật được kết hợp hiện tại.

items.spells.targetedspell.prompt=Chọn một mục tiêu
items.spells.targetedspell.inv_title=kết hợp một vật phẩm

items.spells.telekineticgrab.name=nắm từ xa
items.spells.telekineticgrab.cant_grab=Bạn không thể nhặt thứ đó.
items.spells.telekineticgrab.no_target=Không có gì để nhặt ở đó cả.
items.spells.telekineticgrab.desc=Thần chú này cho phép người sử dụng nhặt từ xa tất cả vật phẩm ở một vị trí, hoặc tất cả vũ khí ném bị dính vào một kẻ địch!\n\nNó không thể được dùng để lấy các vật phẩm một người khác sở hữu, hoặc để lấy các vật chứa đồ như rương.

items.spells.unstablespell.name=thần chú bất ổn
items.spells.unstablespell.desc=Tinh thể nhỏ màu đen hình vuông này có những biểu tượng rune biến đổi ở trên mỗi mặt của nó.\n\nKhi được sử dụng, nó sẽ kích hoạt hiệu ứng của một cuộn giấy ngẫu nhiên. Hiệu ứng cuộn giấy sẽ luôn là một hiệu ứng thiên về chiến đấu nếu có kẻ địch trong tầm nhìn của bạn, còn nếu không thì sẽ luôn thiên về không chiến đấu.

items.spells.wildenergy.name=năng lượng hỗn loạn
items.spells.wildenergy.desc=Thần chứ này chứa một phần năng lượng bị nguyền, thứ đã giúp DM-300 chạy. Khi sử dụng, nó sẽ hồi năng lượng cho các đũa phép và cổ vật đang được trang bị của bạn và đồng thời kích hoạt một hiệu ứng đũa phép bị nguyền ngẫu nhiên. Tuy nhiên, bạn sẽ được định hướng nơi mà phép thuật bị nguyền này bắn vào.


###runestones
items.stones.inventorystone.ac_use=DÙNG

items.stones.runestone$placeholder.name=đá phép
items.stones.runestone.discover_hint=Bạn có thể tìm thấy vật phẩm này một cách ngẫu nhiên trong hầm ngục, hoặc chế tạo nó bằng thuật giả kim.

items.stones.stoneofaggression.name=đá gây hấn
items.stones.stoneofaggression.desc=Khi hòn đá này được ném vào một đồng minh hoặc kẻ địch, tất cả kẻ địch gần đó sẽ ưu tiên tấn công nhân vật đó trong một thời gian ngắn. \n\nTuy nhiên, các kẻ địch là trùm có thể kháng lại hiệu ứng này, làm giảm đáng kể thời lượng của nó vâ nhận ít sát thương hơn từ các đòn tấn công của tay sai của chúng.
items.stones.stoneofaggression$aggression.name=bị nhắm vào
items.stones.stoneofaggression$aggression.desc=Phép thuật thao túng đang khiến tất cả kẻ địch ở gần ưu tiên tấn công nhân vật này. \n\nLượt còn lại: %s.

items.stones.stoneofaugmentation.name=hòn đá cường hóa
items.stones.stoneofaugmentation.inv_title=Cường hóa một vật phẩm
items.stones.stoneofaugmentation.desc=Viên đá rune này sở hữu phép thuật mạnh mẽ, thứ có thể cường hoá trang bị để cải thiện một đặc tính với cái giá là một đặc tính khác.\n\nSử dụng lên một vũ khí sẽ cho phép bạn cải thiện tốc độ hoặc sát thương. Các vũ khí ném cũng sẽ nhận thêm hoặc giảm bớt độ bền tỉ lệ thuận với tốc độ của chúng.\n\nSử dụng lên một bộ giáp sẽ cho phép bạn cải thiện phòng thủ hoặc né tránh.
items.stones.stoneofaugmentation.discover_hint=Bạn có thể mua vật phẩm này trong một cửa hàng, hoặc chế tạo nó bằng thuật giả kim.
items.stones.stoneofaugmentation$wndaugment.choice=Bạn muốn cường hóa kĩ năng gì?
items.stones.stoneofaugmentation$wndaugment.speed=Tốc độ
items.stones.stoneofaugmentation$wndaugment.damage=Sát thương
items.stones.stoneofaugmentation$wndaugment.evasion=Kĩ năng né tránh
items.stones.stoneofaugmentation$wndaugment.defense=Kĩ năng phòng thủ
items.stones.stoneofaugmentation$wndaugment.none=Xóa bỏ cường hóa
items.stones.stoneofaugmentation$wndaugment.cancel=Thôi bỏ đi

items.stones.stoneofblast.name=hòn đá nổ
items.stones.stoneofblast.desc=Viên đá rune này sẽ phát nổ ngay lập tức ở vị trí nó được ném tới. Tương tự như một quả bom, vụ nổ sẽ gây sát thương cho bất cứ thứ gì gần đó.

items.stones.stoneofblink.name=hòn đá dịch chuyển
items.stones.stoneofblink.desc=Hòn đá rune này sẽ dịch chuyển người sử dụng tới vị trí nó được ném tới.

items.stones.stoneofclairvoyance.name=hòn đá thấu thị
items.stones.stoneofclairvoyance.desc=Viên đá này sẽ ngay lập tức hé lộ tất cả ô trong một khu vực rất rộng xung quanh nơi nó được ném vào. Hiệu ứng của nó thậm chí sẽ vượt qua tường.

items.stones.stoneofdeepsleep.name=hòn đá ngủ sâu
items.stones.stoneofdeepsleep.desc=Khi hòn đá này được ném vào một kẻ địch, nó sẽ đưa chúng vào một giấc ngủ phép thuật sâu. Những kẻ địch ngủ bằng phép thuật sẽ ngủ vĩnh viễn cho đến khi bị quấy rầy.

items.stones.stoneofdetectmagic.name=hòn đá dò tìm phép thuật
items.stones.stoneofdetectmagic.inv_title=Dò xét một vật phẩm
items.stones.stoneofdetectmagic.detected_none=Bạn không phát hiện bất cứ phép thuật nào ảnh hưởng tới vật phẩm này.
items.stones.stoneofdetectmagic.detected_both=Bạn phát hiện cả phép thuật tích cực và hắc ám ảnh hưởng tới vật phẩm này!
items.stones.stoneofdetectmagic.detected_good=Bạn phát hiện phép thuật tích cực ảnh hưởng tới vật phẩm này!
items.stones.stoneofdetectmagic.detected_bad=Bạn phát hiện phép thuật hắc ám ảnh hưởng tới vật phẩm này!
items.stones.stoneofdetectmagic.desc=Hòn đá rune này có thể phát hiện phép thuật đang ảnh hưởng tới một vật phẩm. Sử dụng hòn đá này lên một vật phẩm chưa được thẩm định sẽ cho bạn biết nó có bị ảnh hưởng bởi một lời nguyền hắc ám và liệu nó có bị ảnh hưởng bởi phép thuật tích cực như một phù phép hay nâng cấp không.

items.stones.stoneofdisarming.name=hòn đá tháo rời
items.stones.stoneofdisarming.desc=Viên đá rune này nắm giữ phép thuật có khả năng vô hiệu các cạm bẫy nguy hiểm được giấu xuyên suốt hầm ngục. Nó sẽ vô hiệu hóa lên tới 9 cái bẫy xung quanh khu vực nó được ném tới.

items.stones.stoneofenchantment.name=hòn đá phù phép
items.stones.stoneofenchantment.inv_title=Phù phép một vật phẩm
items.stones.stoneofenchantment.weapon=Vũ khí của bạn phát sáng trong bóng tối!
items.stones.stoneofenchantment.armor=Áo giáp của bạn phát sáng trong bóng tối!
items.stones.stoneofenchantment.desc=Viên đá rune này sở hữu ma thuật phù phép. Không giống như một cuộn giấy nâng cấp, nó sẽ không tăng sức mạnh trực tiếp của một vật phẩm, thay vào đó sẽ phù phép một vũ khí hay áo giáp, ban cho nó một sức mạnh mới.

items.stones.stoneoffear.name=hòn đá sợ hãi
items.stones.stoneoffear.desc=Khi hòn đá này được ném vào một nhân vật, họ sẽ bị áp đảo bởi nỗi khiếp sợ, và sẽ quay đầu và bỏ chạy. Tấn công một nhân vật đang bỏ chạy sẽ làm giảm thời lượng hiệu ứng.

items.stones.stoneofflock.name=hòn đá bầy đàn
items.stones.stoneofflock.desc=Hòn đá rune này triệu hồi những chú cừu phép thuật xung quanh vị trí nó được ném tới trong một thời gian ngắn.

items.stones.stoneofintuition.name=hòn đá trực giác
items.stones.stoneofintuition.inv_title=Chọn một vật phẩm
items.stones.stoneofintuition.desc=Hòn đá rune này giữ một phiên bản yếu hơn của phép thuật trong các cuộn giấy thẩm định. Thay vì trực tiếp thẩm định một vật phẩm, nó sẽ dựa vào trực giác của bạn, cho phép bạn thử thẩm định loại của một lọ thuốc, cuộn giấy, hoặc nhẫn bằng cách đoán.
items.stones.stoneofintuition.break_info=Bạn có thể sử dụng các hòn đá trực giác hai lần trước khi một cái bị vỡ, _lần sử dụng tiếp theo của bạn sẽ không tốn một hòn đá_.
items.stones.stoneofintuition.break_warn=Bạn đã sử dụng một hòn đá trực giác trước đó, vậy nên _lần sử dụng tiếp theo của bạn sẽ tốn một hòn đá_.
items.stones.stoneofintuition$wndguess.text=Đoán xem loại của vật phẩm chưa thẩm định là gì. Nếu bạn đoán đúng, loại này sẽ được thẩm định!
items.stones.stoneofintuition$wndguess.correct=Chính xác. Loại vật phẩm này đã được thẩm định!
items.stones.stoneofintuition$wndguess.incorrect=Bạn đã đoán trượt
items.stones.stoneofintuition$wndguess.break=Hòn đá trực giác của bạn vỡ vụn thành bụi...

items.stones.stoneofshock.name=hòn đá sốc
items.stones.stoneofshock.desc=Hòn đá rune này giải phóng một vụ nổ năng lượng điện, thứ làm choáng tất cả kẻ địch ở gần trong thời gian ngắn, và trao cho người ném năng lượng đũa phép với mỗi mục tiêu đánh trúng.


###trinkets
items.trinkets.chaoticcenser.name=lư hương hỗn loạn
items.trinkets.chaoticcenser.spew=Lư hương của bạn chuẩn bị phun: %s.
items.trinkets.chaoticcenser.desc=Sau một thời gian ở trong nồi giả kim, chiếc lư đốt hương này có vẻ như đang tự tạo ra khói! Những khí này tích tụ lại và sẽ phun ra từ lu hương về phía kẻ địch giữa những khoảng thời gian ngẫu nhiên một phần. Có vẻ như nó có khả năng tạo ra đủ mọi loại khí, nhưng bạn sẽ nhận được cảnh báo ngay trước khi chiếc lư hương kích hoạt.
items.trinkets.chaoticcenser.typical_stats_desc=Thông thường phụ kiện này sẽ tạo ra một khí có hại ở gần một kẻ địch vào khoảng mỗi _%d_ lượt một lần. Khí sẽ chỉ xuất hiện khi có kẻ địch trong tầm nhìn. Ở các cấp độ cao hơn tỉ lệ các khí được phun ra là khí hiếm và mạnh sẽ cao hơn.
items.trinkets.chaoticcenser.stats_desc=Ở cấp độ hiện tại, phụ kiện này sẽ tạo ra một khí có hại ở gần một kẻ địch vào khoảng mỗi _%d_ lượt một lần. Khí sẽ chỉ xuất hiện khi có kẻ địch trong tầm nhìn. Ở các cấp độ cao hơn tỉ lệ các khí được phun ra là khí hiếm và mạnh sẽ cao hơn.

items.trinkets.crackedspyglass.name=kính viễn vọng nứt
items.trinkets.crackedspyglass.desc=Chiếc kính viễn vọng cầm tay này sẽ là một vật thể hiện tay nghề xuất sắc và chuẩn xác, nếu không có vết nứt trên ống kính trước của nó. Chiếc kính viễn vọng có vẻ đang giúp bạn bằng cách hé lộ các vật phẩm mới trong hầm ngục, nhưng do khiếm khuyết của nó, các vật phẩm được hé lộ khá khó để nhìn thấy!
items.trinkets.crackedspyglass.typical_stats_desc=Thông thường phụ kiện này có _%1$s%% khả năng_ tạo ra thêm một vật phẩm ẩn trên mỗi tầng không phải tầng trùm.
items.trinkets.crackedspyglass.stats_desc=Ở cấp độ hiện tại, phụ kiện này có _%1$s%% khả năng_ tạo ra thêm một vật phẩm ẩn trên mỗi tầng không phải tầng trùm.
items.trinkets.crackedspyglass.stats_desc_upgraded=Ở cấp độ hiện tại, phụ kiện này có _100%% khả năng_ tạo ra thêm một vật phẩm ẩn trên mỗi tầng không phải tầng trùm, và _%1$s%% khả năng_ tạo ra thêm một vật phẩm ẩn thứ hai.

items.trinkets.dimensionalsundial.name=đồng hồ mặt trời đa chiều
items.trinkets.dimensionalsundial.warning=Đồng hồ mặt trời của bạn không tạo bóng, bạn cảm thấy không thoải mái.
items.trinkets.dimensionalsundial.desc=Chiếc đồng hồ mặt trời cầm tay nhỏ này bằng cách nào đó có thể đổ bóng ở trong những tầng sâu của hầm ngục, kể cả nếu bạn không giơ nó thẳng lên. Còn kì lạ hơn, hướng của cái bóng có vẻ như không liên quan gì tới mặt trời trong thế giới này. Khi không có bóng, chiếc đồng hồ mặt trời có vẻ như thu hút nguy hiểm.
items.trinkets.dimensionalsundial.typical_stats_desc=Thông thường phụ kiện này sẽ giảm tỉ lệ xuất hiện của kẻ địch đi _%1$d%%_ vào ban ngày ngoài đời thực (8 giờ sáng - 8 giờ tối), và tăng tỉ lệ xuất hiện của kẻ địch thêm _%2$d%%_ vào ban đêm (8 giờ tối - 8 giờ sáng)
items.trinkets.dimensionalsundial.stats_desc=Ở cấp độ hiện tại, phụ kiện này sẽ giảm tỉ lệ xuất hiện của kẻ địch đi _%1$d%%_ vào ban ngày ở ngoài đời thực (8 giờ sáng - 8 giờ tối), và tăng tỉ lệ xuất hiện của kẻ địch thêm _%2$d%%_ vào ban đêm (8 giờ tối - 8 giờ sáng)

items.trinkets.exoticcrystals.name=tinh thể kì lạ
items.trinkets.exoticcrystals.desc=Những viên tinh thể nhỏ màu hồng này có hình dạng giống với những viên tinh thể năng lượng giả kim. Dù chúng không thể được trực tiếp sử dụng làm năng lượng, chúng có vẻ bằng cách nào đó gây ảnh hưởng đến những lọ thuốc và cuộn giấy bạn tìm được.
items.trinkets.exoticcrystals.typical_stats_desc=Thông thường phụ kiện này sẽ thay thế _%s%%_ lọ thuốc hoặc cuộn giấy bằng phiên bản kì lạ của chúng. Điều này không ảnh hưởng đến các lọ thuốc sức mạnh, cuộn giấy nâng cấp, hay các vật phẩm được tạo ra để giúp giải quyết các phòng cạm bẫy.
items.trinkets.exoticcrystals.stats_desc=Ở cấp độ hiện tại, phụ kiện này sẽ thay thế _%s%%_ các lọ thuốc hoặc cuộn giấy có thể được tìm thấy bằng phiên bản kì lạ của chúng. Điều này không ảnh hưởng đến các lọ thuốc sức mạnh, cuộn giấy nâng cấp, hoặc các vật phẩm được tạo ra để giúp giải quyết các phòng nguy hiểm.

items.trinkets.eyeofnewt.name=mắt sa giông
items.trinkets.eyeofnewt.desc=Con mắt sa giông vàng đen này là một nguyên liệu phổ biến, giờ đây được cải tiến thành một phụ kiện. Con mắt có vẻ như đang làm giảm tầm nhìn của bạn đổi lại cho việc cho phép bạn nhìn mọi vật theo một cách khác.
items.trinkets.eyeofnewt.typical_stats_desc=Thông thường phụ kiện này sẽ làm giảm tầm nhìn của bạn đi _%1$s%%_, nhưng cũng sẽ cho bạn tâm nhãn lên kẻ địch trong phạm vi _%2$d_ ô.
items.trinkets.eyeofnewt.stats_desc=Ở cấp độ hiện tại, phụ kiện này sẽ làm giảm tầm nhìn của bạn đi _%1$s%%_, nhưng cũng sẽ cho bạn tâm nhãn lên kẻ địch trong phạm vi _%2$d_ ô.

items.trinkets.ferrettuft.name=búi lông chồn sương
items.trinkets.ferrettuft.desc=Một búi lông chồn sương trắng mượt, được buộc vào nhau bằng một dải ruy băng màu Chanh thắt thành một chiếc nơ. Chồn sương được biết đến bởi sự nhanh nhẹn, tinh nghịch và thiếu chính trực. Một phần sức mạnh đó dường như tỏa ra từ món phụ kiện, tăng cường khả năng né tránh của bất cứ thứ gì ở gần.
items.trinkets.ferrettuft.typical_stats_desc=Thông thường phụ kiện này sẽ tăng khả năng né tránh của tất cả nhân vật thêm _%1$s%%_.
items.trinkets.ferrettuft.stats_desc=Ở cấp độ hiện tại, phụ kiện này sẽ tăng khả năng né tránh của tất cả nhân vật thêm _%1$s%%_.

items.trinkets.mimictooth.name=răng mimic
items.trinkets.mimictooth.desc=Chiếc răng lớn sắc nhọn này hẳn là đã bị rút ra từ một mimic rất không vui. Có vẻ như nó gây ảnh hưởng đến các mimic khác trong hầm ngục, khiến chúng xuất hiện thường xuyên và nguy hiểm hơn.
items.trinkets.mimictooth.typical_stats_desc=Thông thường phụ kiện này sẽ khiến mọi loại mimic xuất hiện nhiều hơn _%1$sx_ và cũng khó phát hiện hơn nhiều, nhưng cũng sẽ làm tăng lượng vật phẩm rơi ra từ chúng. Mỗi tầng hầm ngục cũng sẽ có _%2$s%%_ cơ hội chứa thêm một mimic gỗ mun cực kì khó phát hiện.
items.trinkets.mimictooth.stats_desc=Ở cấp độ hiện tại, phụ kiện này sẽ khiến mọi loại mimic xuất hiện nhiều hơn _%1$sx_ và cũng khó phát hiện hơn nhiều, nhưng cũng sẽ làm tăng lượng vật phẩm rơi ra từ chúng. Mỗi tầng hầm ngục cũng sẽ có _%2$s%%_ cơ hội chứa thêm một mimic gỗ mun cực kì khó phát hiện.

items.trinkets.mossyclump.name=cục rêu
items.trinkets.mossyclump.desc=Cục rêu ướt này có vẻ như giữ lấy độ ẩm của nó bất kể bạn bóp nó chặt đến đâu. Có vẻ nó được liên kết một cách thần kì với hầm ngục này, làm cho cỏ và nước có nhiều khả năng xuất hiện hơn.
items.trinkets.mossyclump.typical_stats_desc=Thông thường phụ kiện này sẽ biến _%d%%_ mặt sàn không có gì thành chứa đầy nước hoặc cỏ.\n\nPhụ kiện này cần một lượng năng lượng khá lớn để nâng cấp.
items.trinkets.mossyclump.stats_desc=Ở cấp độ hiện tại, phụ kiện này sẽ biến _%d%%_ mặt sàn không có gì thành chứa đầy nước hoặc cỏ.\n\nPhụ kiện này cần một lượng năng lượng khá lớn để nâng cấp.

items.trinkets.parchmentscrap.name=vụn giấy da
items.trinkets.parchmentscrap.desc=Mảnh vụn giấy da nhỏ này trông giống như nó là từ một cuộn giấy. Nó đã giữ lại một ít phép thuật từ đó, và có vẻ đang gây ảnh hưởng tới các vũ khí và áo giáp được tìm thấy trong hầm ngục.
items.trinkets.parchmentscrap.typical_stats_desc=Thông thường phụ kiện này sẽ khiến các phù phép và kí tự phổ biến hơn _%dx_, và các lời nguyền trên vũ khí và áo giáp phổ biến hơn _%sx_. Các lời nguyền trên đũa phép, nhẫn, hay cổ vật đều không bị ảnh hưởng.\n\nPhụ kiện này cần một lượng năng lượng khá lớn để nâng cấp.
items.trinkets.parchmentscrap.stats_desc=Ở cấp độ hiện tại, phụ kiện này sẽ khiến các phù phép và kí tự phổ biến hơn _%dx_, và các lời nguyền trên vũ khí và áo giáp phổ biến hơn _%sx_. Các lời nguyền trên đũa phép, nhẫn, hay cổ vật đều không bị ảnh hưởng.\n\nPhụ kiện này cần một lượng năng lượng khá lớn để nâng cấp.

items.trinkets.petrifiedseed.name=hạt hóa thạch
items.trinkets.petrifiedseed.desc=Hạt giống này đã trở thành hóa thạch, do những quá trình địa chất chậm hoặc do phép thuật. Hạt giống này có vẻ đang gây ảnh hưởng tới thực vật trong hầm ngục một cách thần kì, đôi khi thay thế hạt giống cây bằng đá rune.
items.trinkets.petrifiedseed.typical_stats_desc=Thông thường phụ kiện này sẽ khiến cỏ bị giẫm lên có _%1$s%%_ cơ hội rơi ra đá rune thay vì hạt giống, và cũng sẽ khiến cỏ cao rơi ra vật phẩm thường xuyên hơn _%2$s%%_.
items.trinkets.petrifiedseed.stats_desc=Ở cấp độ hiện tại, phụ kiện này sẽ khiến cỏ bị giẫm lên có _%1$s%%_ cơ hội rơi ra đá rune thay vì hạt giống, và cũng sẽ khiến cỏ cao rơi ra vật phẩm thường xuyên hơn _%2$s%%_.

items.trinkets.ratskull.name=sọ chuột
items.trinkets.ratskull.desc=Phụ kiện rùng rợn này không lớn hơn nhiều so với sọ của một con chuột thông thường, thứ lại là hiếm có ở dưới hầm ngục này. Sự ảnh hưởng phép thuật của chiếc sọ có vẻ như thu hút những cư dân hiếm có của hầm ngục, khiến chúng xuất hiện thường xuyên hơn nhiều.
items.trinkets.ratskull.typical_stats_desc=Thông thường phụ kiện này sẽ khiến các kẻ địch hiếm có tỉ lệ xuất hiện nhiều hơn _%d_ lần. Tuy nhiên, hộp sọ chỉ hiệu quả bằng một nửa trong việc thu hút mimic pha lê và tượng mặc giáp.
items.trinkets.ratskull.stats_desc=Ở cấp độ hiện tại, phụ kiện này sẽ khiến các kẻ địch hiếm có tỉ lệ xuất hiện nhiều hơn _%d_ lần. Tuy nhiên, hộp sọ chỉ hiệu quả bằng một nửa trong việc thu hút mimic pha lê và tượng mặc giáp.

items.trinkets.saltcube.name=khối muối vuông
items.trinkets.saltcube.desc=Tinh thể muối lớn này đã được cắt thành một khối vuông gần như hoàn hảo, và bằng cách nào đó nó đã hút mất một nửa lượng nước từ nồi giả kim thay vì tan ra. Nó dường như làm mất nước và bảo quản thức ăn bạn ăn một cách thần kỳ, kéo dài sự no bạn nhận được, nhưng cũng làm giảm khả năng phục hồi sinh lực của bạn khi không chết đói.
items.trinkets.saltcube.typical_stats_desc=Thông thường phụ kiện này sẽ kéo dài thời gian trước khi bạn trở nên đói thêm _%1$s%%_, nhưng cũng sẽ làm giảm tốc độ hồi phục sinh lực của bạn đi _%2$s%%_ trừ khi tầng hiện tại bị khoá.
items.trinkets.saltcube.stats_desc=Ở cấp độ hiện tại phụ kiện này sẽ kéo dài thời gian trước khi bạn trở nên đói thêm _%1$s%%_, nhưng cũng sẽ làm giảm tốc độ hồi phục sinh lực của bạn đi _%2$s%%_ trừ khi tầng hiện tại bị khoá.

items.trinkets.shardofoblivion.name=mảnh vỡ u minh
items.trinkets.shardofoblivion.desc=Sau khi được hầm trong nồi giả kim, mảnh kim loại bị nguyền rủa nhỏ này đã thay đổi và giờ được làm từ... không gì cả? Ánh sáng dường như bị bẻ cong xung quanh nó, và nó lơ lửng tại chỗ khi bạn không cầm nó. Mảnh vỡ này có vẻ như đang lấy sức mạnh từ sự thiếu hiểu biết của bạn một cách thần kì, vậy nên có lẽ tốt nhất là không nên nghĩ về nó quá nhiều.
items.trinkets.shardofoblivion.typical_stats_desc=Thông thường phụ kiện này sẽ tăng tỷ lệ kẻ địch rơi ra vật phẩm thêm 20%% với mỗi món trang bị chưa thẩm định mà bạn đã trang bị hoặc sử dụng gần đây, tối đa lên tới _%d vật phẩm_. Mảnh vỡ cũng sẽ ngăn bạn tự động thẩm định trang bị, nhưng có thể được sử dụng để thẩm định thủ công các vật phẩm đã sẵn sàng được thẩm định.
items.trinkets.shardofoblivion.stats_desc=Ở cấp độ hiện tại phụ kiện này sẽ tăng tỷ lệ kẻ địch rơi ra vật phẩm thêm 20%% với mỗi món trang bị chưa thẩm định mà bạn đã trang bị hoặc sử dụng gần đây, tối đa lên tới _%d vật phẩm_. Mảnh vỡ cũng sẽ ngăn bạn tự động thẩm định trang bị, nhưng có thể được sử dụng để thẩm định thủ công các vật phẩm đã sẵn sàng được thẩm định.
items.trinkets.shardofoblivion.ac_identify=THẨM ĐỊNH
items.trinkets.shardofoblivion.identify_prompt=Thẩm định một vật phẩm
items.trinkets.shardofoblivion.identify_ready=Một vật phẩm đã sẵn sàng được thẩm định: %s. Sử dụng Mảnh vỡ u minh của bạn lên nó để thẩm định nó.
items.trinkets.shardofoblivion.identify_ready_worn=Các vật phẩm được trang bị của bạn hiện đều đã sẵn sàng được thẩm định. Sử dụng Mảnh vỡ u minh của bạn lên các vật phẩm để thẩm định chúng.
items.trinkets.shardofoblivion.identify_not_yet=Vật phẩm đó vẫn chưa sẵn sàng để được thẩm định.
items.trinkets.shardofoblivion.identify=Bạn thẩm định món vật phẩm!
items.trinkets.shardofoblivion$wandusetracker.name=Đũa phép chưa thẩm định đã sử dụng
items.trinkets.shardofoblivion$wandusetracker.desc=Bạn mới sử dụng một cây đũa phép chưa thẩm định gần đây, và đó được tính là một món trang bị chưa thẩm định cho mảnh vỡ u minh trong một thời gian ngắn.\n\nLượt còn lại: %s.
items.trinkets.shardofoblivion$thrownusetracker.name=Đã sử dụng vũ khí ném chưa thẩm định
items.trinkets.shardofoblivion$thrownusetracker.desc=Bạn mới sử dụng một vũ khí ném chưa thẩm định gần đây, và đó được tính là một món trang bị chưa thẩm định cho mảnh vỡ u minh trong một thời gian ngắn.\n\nLượt còn lại: %s.

items.trinkets.thirteenleafclover.name=cỏ mười ba lá
items.trinkets.thirteenleafclover.desc=Bằng cách nào đó mà việc hầm ở trong nồi giả kim đã khiến cây cỏ ba lá này mọc thêm một đống lá! Vẫn chưa rõ rằng liệu món phụ kiện này mang đến may mắn hay xui xẻo, có lẽ nó sẽ làm vận may của bạn trở nên hỗn loạn hơn?
items.trinkets.thirteenleafclover.typical_stats_desc=Thông thường phụ kiện này sẽ khiến bạn có _%1$d%%_ tỉ lệ gây sát thương tối đa, và _%2$d%%_ tỉ lệ gây sát thương tối thiểu.
items.trinkets.thirteenleafclover.stats_desc=Ở cấp độ hiện tại phụ kiện này sẽ khiến bạn có _%1$d%%_ tỉ lệ gây sát thương tối đa, và _%2$d%%_ tỉ lệ gây sát thương tối thiểu.

items.trinkets.trapmechanism.name=cơ chế bẫy
items.trinkets.trapmechanism.desc=Cơ chế cốt lõi của một trong những cái bẫy rơi hố của hầm ngục, được đục ra khỏi sàn nhà một cách cẩn thận để nó có thể được mang theo. Có vẻ nó được liên kết một cách thần kì với hầm ngục này, khiến cho địa hình nguy hiểm phổ biến hơn, nhưng cũng sẽ tăng sự quen thuộc của bạn với nó.
items.trinkets.trapmechanism.typical_stats_desc=Thông thường phụ kiện này sẽ biến _%1$d%%_ mặt sàn không có gì thành chứa bẫy hoặc hố sâu. Thêm vào đó, _%2$d%%_ bẫy ẩn của hầm ngục sẽ thay vào đó được lộ diện.
items.trinkets.trapmechanism.stats_desc=Ở cấp độ hiện tại phụ kiện này sẽ biến _%1$d%%_ mặt sàn không có gì thành chứa bẫy hoặc hố sâu. Thêm vào đó, _%2$d%%_ bẫy ẩn của hầm ngục sẽ được lộ diện.

items.trinkets.vialofblood.name=ống máu
items.trinkets.vialofblood.desc=Chiếc ống mỏng này chứa máu của một số cư dân của hầm ngục, nó chuyển động chậm khi bạn xoay chiếc ống. Nó có vẻ đang bằng một cách thần kỳ cường hoá các hiệu ứng hồi phục mạnh, nhưng cũng làm chậm chúng.
items.trinkets.vialofblood.typical_stats_desc=Thông thường phụ kiện này sẽ tăng tổng sinh lực bạn nhận được từ việc uống thuốc hồi phục, túi nước, hoặc giếng sinh lực thêm _%1$s%%_. Tuy nhiên, các hiệu ứng hồi phục này cũng sẽ diễn ra chậm hơn, hồi phục tối đa _%2$s_ sinh lực mỗi lượt (số lượng này tỷ lệ thuận với cấp độ người hùng).
items.trinkets.vialofblood.stats_desc=Ở cấp độ hiện tại, phụ kiện này sẽ tăng tổng sinh lực bạn nhận được từ việc uống thuốc hồi phục, túi nước, hoặc giếng sinh lực thêm _%1$s%%_. Tuy nhiên, các hiệu ứng hồi phục này cũng sẽ diễn ra chậm hơn, hồi phục tối đa _%2$s_ sinh lực mỗi lượt (số lượng này tỷ lệ thuận với cấp độ người hùng).

items.trinkets.wondrousresin.name=nhựa kỳ diệu
items.trinkets.wondrousresin.desc=Nhựa cây màu xanh dương lấp lánh này dương như chứa tinh chất cô động của phép thuật từ một cây đũa phép bị nguyền. Phép thuật từ nồi giả kim dường như đã làm nó ổn định lại phần nào, và giờ nó đang tác động đến các đũa phép của bạn.
items.trinkets.wondrousresin.typical_stats_desc=Thông thường phụ kiện này sẽ biến các hiệu ứng đũa phép bị nguyền trở thành trung tính hoặc có lợi với tỉ lệ _%1$s%%_, và sẽ khiến các đũa phép không bị nguyền có tỉ lệ _%2$s%%_ bắn thêm một phát bắn bị nguyền trung tính hoặc tích cực.\n\nPhụ kiện này cần một lượng năng lượng khá lớn để nâng cấp.
items.trinkets.wondrousresin.stats_desc=Ở cấp độ hiện tại, phụ kiện này sẽ biến các hiệu ứng đũa phép bị nguyền trở thành trung tính hoặc có lợi với tỉ lệ _%1$s%%_, và sẽ khiến các đũa phép không bị nguyền bắn thêm một phát bắn bị nguyền trung tính hoặc tích cực với tỉ lệ _%2$s%%_.\n\nPhụ kiện này cần một lượng năng lượng khá lớn để nâng cấp.

items.trinkets.trinketcatalyst.name=chất xúc tác phép thuật
items.trinkets.trinketcatalyst.window_title=chế tạo một phụ kiện
items.trinkets.trinketcatalyst.window_text=Nước bắt đầu phát sáng khi bạn cho chất xúc tác vào. Có một vài vật phẩm ở gân mà bạn có thể kết hợp với năng lượng này để tạo thành một phụ kiện phép thuật.
items.trinkets.trinketcatalyst.desc=Quả cầu bụi vàng phép thuật này sáng lấp lánh trong bóng tối của hầm ngục. Chất xúc tác này có thể được sử dụng tại một nồi giả kim với một ít năng năng lượng giả kim để tạo ra một vật phẩm phụ kiện đặc biệt.\n\nCác phụ kiện cung cấp nhiều hiệu ứng khác nhau, làm cho hầm ngục hoặc các sinh vật cư trú trong đó thay đổi nhẹ. Các phụ kiện có thể được nâng cấp bằng nhiều năng lượng hơn để khiến hiệu ứng của chúng mạnh hơn, hoặc thả ra để loại bỏ hoàn toàn hiệu ứng.
items.trinkets.trinketcatalyst$randomtrinket.name=phụ kiện ngẫu nhiên
items.trinkets.trinketcatalyst$randomtrinket.desc=Một món đồ gần đó bị kẹt trong một chiếc túi nhỏ mà bạn không thể mở ra được.\n\nQuá trình giả kim thuật sẽ làm chiếc túi tan ra, nhưng bạn sẽ không biết mình sẽ nhận được món phụ kiện gì cho đến khi bạn thực hiện!

items.trinkets.trinket.discover_hint=Vật phẩm này có khả năng là một lựa chọn bất cứ khi nào bạn chế tạo một phụ kiện bằng thuật giả kim.
items.trinkets.trinket$placeholder.name=phụ kiện

###wands
items.wands.cursedwand.ondeath=Bạn đã bị giết bởi chính %s của bạn.
items.wands.cursedwand.nothing=Không có gì xảy ra.
items.wands.cursedwand.mass_invuln=Ánh sáng chói lọi phát ra từ đũa phép của bạn!
items.wands.cursedwand.petrify=Bạn đột nhiên đứng yên tại chỗ!
items.wands.cursedwand.grass=Cỏ mọc xung quanh bạn!
items.wands.cursedwand.fire=Bạn có mùi khét...
items.wands.cursedwand.transmogrify_wand=Đũa phép của bạn biến đổi thành một vật phẩm khác!
items.wands.cursedwand.transmogrify_other=Vật phẩm của bạn biến đổi thành thứ gì đó khác!
items.wands.cursedwand.disguise=Ngoại hình của bạn thay đổi ngay trước mắt bạn!
items.wands.cursedwand.supernova=Một quả cầu năng lượng rực cháy bắt đầu lớn dần. Bạn có lẽ sẽ muốn chạy đấy!
items.wands.cursedwand.supernova_positive=Một quả cầu năng lượng rực cháy bắt đầu lớn dần, nhưng vì lí do nào đó bạn vẫn cảm thấy an toàn.
items.wands.cursedwand.sinkhole=Mặt đất bắt đầu sụp xuống xung quanh bạn!
items.wands.cursedwand.sinkhole_positive=Mặt đất bắt đầu sụp xuống, nhưng có cảm giác vẫn đủ vững dưới chân bạn.
items.wands.cursedwand.gravity=Trọng lực đột nhiên bắt đầu kéo về các hướng ngẫu nhiên!
items.wands.cursedwand.gravity_positive=Trọng lực đột nhiên bắt đầu kéo về các hướng ngẫu nhiên, nhưng việc này có vẻ không ảnh hưởng tới bạn.
items.wands.cursedwand.gravity_end=Sự hỗn loạn trọng lực kết thúc.

items.wands.damagewand.upgrade_stat_name_1=Sát thương phép thuật

items.wands.wand.ac_zap=BẮN
items.wands.wand.fizzles=Đũa phép của bạn phát tiếng xì xì; nó chắc hẳn không có đủ năng lượng.
items.wands.wand.no_magic=Đũa phép của bạn kêu xì xì; bạn không thể sử dụng các đũa phép khi đang miễn nhiễm phép thuật.
items.wands.wand.self_target=Bạn không thể nhắm vào chính mình!
items.wands.wand.identify=Giờ đây bạn cảm thấy thân thuộc hơn với chiếc đũa phép đủ để thẩm định nó.
items.wands.wand.resin_one=Cây đũa phép này đã nhận _1 cấp_ từ nhựa cây ma thuật.
items.wands.wand.resin_many=Cây đũa phép này đã nhận _%d cấp_ từ nhựa cây ma thuật.
items.wands.wand.cursed=Cây đũa phép này bị nguyền, khiến cho phép thuật của nó hỗn loạn và ngẫu nhiên.
items.wands.wand.not_cursed=Cây đũa phép này không có phép thuật hắc ám.
items.wands.wand.curse_discover=Cây %s này bị nguyền rủa!
items.wands.wand.prompt=Chọn một vị trí để bắn
items.wands.wand$placeholder.name=đũa phép

items.wands.wandofblastwave.name=đũa phép sóng nổ
items.wands.wandofblastwave.staff_name=gậy phép sóng nổ
items.wands.wandofblastwave.ondeath=Bạn đã giết chính mình bằng cây Đũa phép sóng nổ của chính bạn...
items.wands.wandofblastwave.knockback_ondeath=Cú va chạm đã giết bạn...
items.wands.wandofblastwave.desc=Cây đũa phép này được làm từ một dạng đá cẩm thạch, với đường viền vàng và một viên ngọc tròn màu đen ở trên đỉnh. Nó cảm giác rất nặng trong tay bạn.
items.wands.wandofblastwave.typical_stats_desc=Cây đũa phép này bắn một tia có khả năng phát nổ mạnh tại vị trí chỉ định. Lực của vụ nổ này thường gây _%1$d-%2$d sát thương_  và đủ mạnh để hất văng hầu hết kẻ địch.
items.wands.wandofblastwave.stats_desc=Cây đũa phép này bắn một tia sáng phát nổ mạnh mẽ ở vị trí mục tiêu. Lực của vụ nổ này gây _%1$d-%2$d sát thương_  và đủ mạnh để hất văng hầu hết kẻ địch.
items.wands.wandofblastwave.upgrade_stat_name_2=Đẩy lùi
items.wands.wandofblastwave.bmage_desc=Khi _Chiến sư_ đánh một kẻ địch bị tê liệt bằng một cây gậy phép sóng nổ, nó sẽ tiêu thụ hiệu ứng tê liệt để gây một lượng sát thương phép thuật bổ sung ngay lập tức. Việc này có một thời gian hồi lại ngắn đối với mỗi kẻ địch.
items.wands.wandofblastwave.eleblast_desc=Một vụ nổ nguyên tố với gậy phép sóng nổ gây 67% sát thương và đẩy tất cả kẻ địch lùi ra khỏi khu vực vụ nổ.

items.wands.wandofcorrosion.name=đũa phép ăn mòn
items.wands.wandofcorrosion.staff_name=gậy phép ăn mòn
items.wands.wandofcorrosion.desc=Cây đũa phép này có thân xám màu với một viên ngọc màu cam rực rỡ.
items.wands.wandofcorrosion.stats_desc=Cây đũa phép này bắn một tia phát nổ thành một đám mây ăn mòn mạnh ở một vị trí được nhắm vào. Bất cứ thứ gì nằm trong đám mây này sẽ nhận sát thương tăng theo thời gian, bắt đầu từ _%d sát thương._
items.wands.wandofcorrosion.upgrade_stat_name_1=Sát thương ăn mòn
items.wands.wandofcorrosion.upgrade_stat_name_2=Thể tích khí
items.wands.wandofcorrosion.bmage_desc=Khi _ Chiến sư_ đánh một kẻ địch bằng một cây gậy phép ăn mòn, kẻ địch có khả năng bị dính chất nhầy.
items.wands.wandofcorrosion.eleblast_desc=Một vụ nổ nguyên tố với gậy phép ăn mòn gây lên kẻ địch 4 lượt ăn mòn, bắt đầu từ 6 sát thương.

items.wands.wandofcorruption.name=đũa phép tha hóa
items.wands.wandofcorruption.staff_name=gậy phép tha hóa
items.wands.wandofcorruption.already_corrupted=Nhân vật đó không thể bị ảnh hưởng hơn nữa.
items.wands.wandofcorruption.desc=Cây đũa phép này phát ra năng lượng hắc ám hỗn loạn, dù điều đó đã là hiển nhiên từ chiếc đầu lâu trang trí được đặt trên đỉnh của nó.
items.wands.wandofcorruption.stats_desc=Cây đũa phép này sẽ phóng ra một vụ nổ năng lượng tha hóa, gây hiệu ứng xấu cho kẻ địch và đến cuối cùng sẽ khiến chúng tuân lệnh bạn. Kẻ địch có thể chống lại sự tha hóa, nhưng những kẻ địch bị làm yếu đi sẽ dễ tha hóa hơn những kẻ khỏe mạnh.
items.wands.wandofcorruption.upgrade_stat_name_1=Sức tha hoá
items.wands.wandofcorruption.upgrade_stat_name_2=Thời lượng hiệu ứng xấu
items.wands.wandofcorruption.bmage_desc=Khi _Chiến sư_ đánh một kẻ địch bằng một cây gậy phép tha hóa, kẻ địch đó có khả năng trở nên điên cuồng.
items.wands.wandofcorruption.eleblast_desc=Một vụ nổ nguyên tố với cây gậy tha hóa gây lên kẻ thù 5 lượt điên cuồng.

items.wands.wandofdisintegration.name=đũa phép tan rã
items.wands.wandofdisintegration.staff_name=gậy phép tan rã
items.wands.wandofdisintegration.desc=Cây đũa phép này được làm từ một khối đá hắc diện thạch rắn, mịn, với một ánh sáng tím đậm chạy dọc cạnh của nó, kết thúc ở đỉnh. Nó phát sáng với năng lượng hủy diệt, chờ đợi được bắn ra.
items.wands.wandofdisintegration.stats_desc=Cây đũa phép này bắn một tia sáng xuyên qua bất cứ vật cản nào, và càng được nâng cấp nhiều thì sẽ đi càng xa. Tia sáng gây _%1$d-%2$d sát thương_ và cũng sẽ gây thêm sát thương với mỗi kẻ địch và tường nó xuyên qua.
items.wands.wandofdisintegration.upgrade_stat_name_2=Tầm xa tối đa
items.wands.wandofdisintegration.bmage_desc=Khi được cầm bởi _Chiến sư_, một cây gậy phép tan rã có tầm tấn công được tăng lên, như thể nó có phù phép tầm xa.
items.wands.wandofdisintegration.eleblast_desc=Một vụ nổ nguyên tố với cây gậy tan rã gây 100% sát thương và xuyên qua các bức tường.

items.wands.wandoffireblast.name=đũa phép phóng lửa
items.wands.wandoffireblast.staff_name=gậy phép phóng lửa
items.wands.wandoffireblast.desc=Cây đũa phép này được làm từ gỗ được sơn đỏ với lượng lớn lá bằng vàng được dùng để khiến nó trông khá vương giả. Nó nổ lách tách và kêu xì xì ở đỉnh, khao khát được giải phóng phép thuật mạnh mẽ của nó.
items.wands.wandoffireblast.stats_desc=Cây đũa phép này phóng ra một đám lửa hình nón khi được sử dụng. Đòn tấn công tiếp theo của nó sẽ tiêu _%1$d năng lượng_ và gây _%2$d-%3$d sát thương._ Cây đũa phép sử dụng càng nhiều năng lượng, hiệu ứng càng lớn và mạnh.
items.wands.wandoffireblast.upgrade_stat_name_1=Sát thương 1 năng lượng
items.wands.wandoffireblast.upgrade_stat_name_2=Sát thương 2 năng lượng
items.wands.wandoffireblast.upgrade_stat_name_3=Sát thương 3 năng lượng
items.wands.wandoffireblast.bmage_desc=Khi _Chiến sư_ đánh một kẻ địch bằng một cây gậy phép phóng lửa, nó có khả năng tạo ra một vụ nổ gây sát thương cho các kẻ địch và tiêu thụ tất cả lửa ở gần! Khả năng này tăng lên theo số lượng lửa cận kề với kẻ địch.
items.wands.wandoffireblast.eleblast_desc=Một vụ nổ nguyên tố với cây gậy phóng lửa gây 100% sát thương, nổ văng cửa, cũng như đốt cháy kẻ thù và địa hình.

items.wands.wandoffrost.name=đũa phép băng giá
items.wands.wandoffrost.staff_name=gậy phép băng giá
items.wands.wandoffrost.desc=Cây đũa phép này có vẻ được làm ra từ một loại băng phép thuật nào đó. Nó trở nên sáng hơn về phía đỉnh tròn của nó. Nó cảm giác rất lạnh khi được cầm, nhưng bằng cách nào đó tay của bạn vẫn ấm.
items.wands.wandoffrost.stats_desc=Cây đũa phép này bắn các vụ nổ năng lượng băng giá về phía kẻ địch của bạn, gây _%1$d-%2$d sát thương_ và làm lạnh. Hiệu ứng có vẻ mạnh hơn trong nước. Những kẻ địch đã bị lạnh hoặc đóng băng nhận ít sát thương hơn từ cây đũa phép này.
items.wands.wandoffrost.upgrade_stat_name_2=Thời lượng lạnh cóng
items.wands.wandoffrost.bmage_desc=Khi _Chiến sư_ đánh một kẻ địch bị lạnh bằng một cây gậy phép băng giá, nó có khả năng đóng băng ngay lập tức. Kẻ địch càng lạnh thì khả năng này càng lớn.
items.wands.wandoffrost.eleblast_desc=Một vụ nổ nguyên tố với gậy phép băng giá gây 100% sát thương, đóng băng kẻ địch, và dập tắt lửa.

items.wands.wandoflightning.name=đũa phép tia sét
items.wands.wandoflightning.staff_name=gậy phép tia sét
items.wands.wandoflightning.ondeath=Bạn đã giết chính bạn bằng cây Đũa phép tia sét của bạn...
items.wands.wandoflightning.desc=Cây đũa phép này được tạo ra từ kim loại rắn, khiến nó nặng đến bất ngờ. Hai mũi nhọn xoắn vào nhau ở trên đỉnh, và điện phóng ra giữa chúng.
items.wands.wandoflightning.stats_desc=Cây đũa phép này bắn tia sét mạnh mẽ phóng qua bất cứ thứ gì nó được bắn tới, gây _%1$d-%2$d sát thương._ Tia điện này sẽ phóng vào các nhân vật ở gần, và phát tán dễ dàng hơn trong nước. Những tia điện từ cây đũa phép này có thể gây sát thương cho bạn, nhưng sẽ không làm hại đồng minh của bạn.
items.wands.wandoflightning.bmage_desc=Khi _Chiến sư_ đánh một kẻ địch bằng một cây gậy phép tia sét, ông có khả năng sẽ nạp điện vào chính mình trong 10 lượt. Khi được nạp điện Chiến sư sẽ không chịu sát thương sét và phóng tia sét đi xa hơn.
items.wands.wandoflightning.eleblast_desc=Một vụ nổ nguyên tố với gậy phép tia sét gây 100% sát thương, làm choáng kẻ địch trong 5 lượt và bắt điện vào nước.
items.wands.wandoflightning$lightningcharge.name=Được nạp điện
items.wands.wandoflightning$lightningcharge.desc=Chiến sư hiện được nạp năng lượng, giúp ông không chịu ảnh hưởng từ cây gậy phép tia sét của ông và tăng khoảng cách tia sét có thể phóng từ nó.\n\nLượt còn lại: %s.

items.wands.wandoflivingearth.name=đũa phép đất sống
items.wands.wandoflivingearth.staff_name=gậy phép đất sống
items.wands.wandoflivingearth.desc=Cây đũa phép này được làm từ một tảng đá kì lạ, với các dải năng lượng vàng phát sáng. Những viên đá dường như chuyển động nhẹ khi bạn nắm cây đũa, như thể chúng có thể cảm thấy bàn tay của bạn.
items.wands.wandoflivingearth.stats_desc=Cây đũa phép này bắn ra những tia đá phép thuật vào kẻ thù, gây ra _%1$d-%2$d sát thương._ Sau đó những tảng đá sẽ hình thành lại xung quanh người dùng, cung cấp cho họ lượng giáp tương ứng với lượng sát thương gây ra. Nếu đủ lượng giáp được tạo ra, nó sẽ hình thành một hộ vệ đá vào phát bắn kế từ cây đũa phép.
items.wands.wandoflivingearth.upgrade_stat_name_2=Sinh lực tối đa của hộ vệ
items.wands.wandoflivingearth.upgrade_stat_name_3=Sức chặn của hộ vệ
items.wands.wandoflivingearth.bmage_desc=Khi _Chiến sư_ đánh một kẻ địch bằng một cây đũa phép đất sống, một lượng sát thương gây ra được hoàn lại thành giáp đá.
items.wands.wandoflivingearth.eleblast_desc=Một vụ nổ nguyên tố với gậy phép đất sống gây 50% sát thương và hồi phục một hộ vệ đất đang hoạt động với mỗi kẻ địch đánh trúng.
items.wands.wandoflivingearth$rockarmor.name=áo giáp đá
items.wands.wandoflivingearth$rockarmor.desc=Cơ thể bạn được bao bọc bởi một lớp đá ma thuật, khi bạn bị tấn công, lớp đá này sẽ cố chặn sát thương giúp bạn và giảm sát thương bạn nhận đi 50%%. Tuy nhiên, mỗi một ít sát thương được chặn sẽ làm mòn đi một chút lớp đá.\n\nLượng áo giáp còn lại: %1$d.\n\nNếu có đủ lượng đá bao quanh bạn, phát bắn kế từ cây đũa phép đất sống của bạn sẽ khiến lớp đá ấy tạo hình thành một người hộ vệ và nó sẽ chiến đấu cùng bạn.\n\nLượng áo giáp cần thiết cho Hộ vệ: %2$d.
items.wands.wandoflivingearth$rockarmor.desc_many=Hộ vệ đất này cũng đang hưởng hiệu ứng từ Sức mạnh số đông. Lượt còn lại: %d.
items.wands.wandoflivingearth$earthguardian.name=hộ vệ đất
items.wands.wandoflivingearth$earthguardian.desc=Đất đá từ cây đũa phép đất sống của bạn đã tạo thành một hộ vệ đất! Hộ vệ bằng đá này sẽ tấn công các kẻ địch ở gần, và sẽ buộc chúng phải tấn công người hộ vệ thay vì bạn. Khi tất cả mối đe dọa ở gần đã biến mất, hộ vệ sẽ tái hình thành xung quanh bạn, và sẽ trở lại khi bạn sử dụng đũa phép của mình lần tới.
items.wands.wandoflivingearth$earthguardian.wand_info=Sức phòng thủ của hộ vệ được liên kết với cấp độ của cây đũa phép của bạn. Hiện tại nó chặn _%1$d-%2$d sát thương._
items.wands.wandoflivingearth$earthguardian.discover_hint=Bạn có thể tìm thấy nhân vật này bằng một cây đũa phép nhất định.

items.wands.wandofmagicmissile.name=đũa phép đạn phép thuật
items.wands.wandofmagicmissile.staff_name=gậy phép đạn phép thuật
items.wands.wandofmagicmissile.desc=Cây đũa phép khá đơn giản này phóng ra đạn làm từ năng lượng phép thuật thuần túy. Dù bản thân cây đũa phép không có hiệu ứng đặc biệt nào, nó có nhiều năng lượng tối đa hơn và có thể cường hoá những cây đũa phép khác trong thời gian ngắn khi được nâng cấp.
items.wands.wandofmagicmissile.stats_desc=Mỗi tia từ cây đũa phép này gây _%1$d-%2$d sát thương,_ và sẽ tăng sức mạnh cho các đũa phép khác trong thời gian ngắn nếu nó được nâng cấp.
items.wands.wandofmagicmissile.bmage_desc=Khi _Chiến sư_ đánh một kẻ địch bằng một cây gậy phép đạn phép thuật, tất cả đũa phép của ông sẽ nhận được năng lượng cùng với gậy phép của ông.
items.wands.wandofmagicmissile.eleblast_desc=Một vụ nổ nguyên tố với gậy phép đạn phép thuật gây 50% sát thương và trao cho Pháp sư 15 lượt hồi năng.
items.wands.wandofmagicmissile.discover_hint=Một trong các người hùng bắt đầu với vật phẩm này.
items.wands.wandofmagicmissile$magiccharge.name=năng lượng phép thuật
items.wands.wandofmagicmissile$magiccharge.desc=Đũa phép đạn phép thuật của bạn đã truyền lại sức mạnh vào các đũa phép của bạn, tăng cấp độ tạm thời của phát bắn tiếp theo của chúng.\n\nCác đũa phép của bạn được tăng lên: +%d.\n\nLượt năng lượng phép thuật còn lại: %s.

items.wands.wandofprismaticlight.name=đũa phép ánh sáng đa sắc
items.wands.wandofprismaticlight.staff_name=gậy phép ánh sáng đa sắc
items.wands.wandofprismaticlight.desc=Cây đũa phép này được làm từ một mảnh pha lê gần trong suốt rắn, giống như một khúc thủy tinh dài, mượt. Những mẩu ánh sáng nhỏ sắc màu nhảy múa xung quanh đỉnh của cây đũa phép, khao khát được phóng ra.
items.wands.wandofprismaticlight.stats_desc=Cây đũa phép này phóng các tia ánh sáng xuyên qua bóng tối của hầm ngục, hé lộ các khu vực ẩn và bẫy. Tia sáng có thể làm mù kẻ địch, và gây _%1$d-%2$d sát thương._ Kẻ địch quỷ và xác sống sẽ cháy trong ánh sáng mạnh của cây đũa phép, nhận thêm sát thương.
items.wands.wandofprismaticlight.upgrade_stat_name_2=Cơ hội làm mù
items.wands.wandofprismaticlight.upgrade_stat_name_3=Thời lượng ánh sáng
items.wands.wandofprismaticlight.bmage_desc=Khi _ Chiến sư_ đánh một kẻ địch bằng một cây gậy phép ánh sáng đa sắc, chúng sẽ bị què trong một khoảng thời gian tỉ lệ thuận với cấp độ của gậy phép.
items.wands.wandofprismaticlight.eleblast_desc=Một vụ nổ nguyên tố với cây gậy ánh sánh gây 67% sát thương, tiết lộ địa hình ở nơi nổ, và gây mù lòa cho kẻ thù trong 5 lượt.

items.wands.wandofregrowth.name=đũa phép tái sinh trưởng
items.wands.wandofregrowth.staff_name=gậy phép tái sinh trưởng
items.wands.wandofregrowth.desc=Cây đũa phép này được làm từ một trục gỗ mỏng được khắc tinh xảo. Bằng cách nào đó nó vẫn còn sống và sáng, xanh tươi như lõi của một cái cây còn xanh. "Khi một sự sống kết thúc, một sự sống mới luôn bắt đầu nảy mầm... Vòng lặp vĩnh cửu mãi mãi trường tồn!"
items.wands.wandofregrowth.stats_desc=Khi được sử dụng, cây đũa phép này sẽ phóng ra năng lượng tái sinh trưởng phép thuật theo hình nón, khiến cỏ, rễ, và các loài thực vật hiếm sống dậy. Phát bắn tiếp theo của nó sẽ tiêu thụ _%1$d năng lượng_. Cây đũa phép sử dụng càng nhiều năng lượng, hiệu ứng càng lớn và mạnh hơn.
items.wands.wandofregrowth.degradation=Sau _%d năng lượng_ nữa, cây đũa phép này sẽ bắt đầu không thể tạo ra cây và cỏ xanh. Giới hạn này được tăng lên bằng cách lên cấp hoặc năng cấp đũa phép.
items.wands.wandofregrowth.upgrade_stat_name_1=Cỏ mỗi năng lượng
items.wands.wandofregrowth.upgrade_stat_name_2=Giới hạn tổng cỏ
items.wands.wandofregrowth.bmage_desc=Khi _Chiến sư_ đánh một kẻ địch bằng một cây gậy phép tái sinh trưởng, và một trong hai đang đứng trên cỏ, ông sẽ nhận hồi phục thảo mộc tỉ lệ với sát thương gây ra.
items.wands.wandofregrowth.eleblast_desc=Một vụ nổ nguyên tố với gậy phép tái sinh trường bám rễ vào kẻ địch và làm cỏ mọc ngẫu nhiên trong khu vực vụ nổ.
items.wands.wandofregrowth$dewcatcher.name=Cây hứng sương
items.wands.wandofregrowth$dewcatcher.desc=Cây hứng sương là những cái cây kì diệu, chúng lấp đầy bản thân với sương phép thuật. Chúng cố cải trang thành cỏ để tránh sự chú ý, nhưng những chỗ phồng ra với sương thu được của chúng khiến chúng bị lộ.
items.wands.wandofregrowth$dewcatcher.discover_hint=Bạn có thể tìm thấy loài cây này bằng một cây đũa phép nhất định.
items.wands.wandofregrowth$seedpod.name=Quả hạt
items.wands.wandofregrowth$seedpod.desc=Quả hạt là những cái cây phép thuật, chúng sinh ra hạt giống từ những loài cây khác, thay vì bất cứ hạt giống nào của chính chúng. Chúng bằng cách nào đó vẫn phát tán được dù không có hạt giống nào của chính chúng.
items.wands.wandofregrowth$seedpod.discover_hint=Bạn có thể tìm thấy loài cây này bằng một cây đũa phép nhất định.
items.wands.wandofregrowth$lotus.name=Sen Vàng
items.wands.wandofregrowth$lotus.desc=Cây sen vàng là một loài cây thần bí chỉ có thể được tạo ra bởi một cây đũa phép tái sinh trưởng mạnh. Trường năng lượng của nó tăng cường tất cả các cây và hiệu ứng từ cây, nhưng nó sẽ tiêu hết năng lượng của mình và chết sau một thời gian ngắn.
items.wands.wandofregrowth$lotus.wand_info=Cây sen này đã được tạo ra bởi một cây đũa phép tái sinh trưởng _+%1$d_. Tất cả các cây chịu hiệu ứng của nó sẽ _ngay lập tức kích hoạt_ nếu chúng được trồng lên một nhân vật. Các cây cũng sẽ có xác suất _%2$d%%_ rơi ra hạt giống của chúng, và phi tiêu được tẩm sẽ sử dụng _ít đi %3$d%% độ bền_.
items.wands.wandofregrowth$lotus.discover_hint=Bạn có thể tìm thấy loài cây này bằng một cây đũa phép nhất định, sau khi nâng cấp nó nhiều lần.

items.wands.wandoftransfusion.name=đũa phép chuyển đổi
items.wands.wandoftransfusion.staff_name=gậy phép biến đổi
items.wands.wandoftransfusion.ondeath=Bạn đã giết chính mình bằng cây Đũa phép chuyển đổi của chính bạn...
items.wands.wandoftransfusion.charged=Cây gậy phép của bạn đã được sạc với nang lượng sống của kẻ địch của bạn!
items.wands.wandoftransfusion.desc=Một cây đũa phép có hình dạng khá đơn giản, nó nổi bật bởi sắc hồng đậm và viên ngọc đen kịt ở trên đỉnh của nó.
items.wands.wandoftransfusion.stats_desc=Khi được sử dụng lên đồng minh hoặc kẻ địch bị mê hoặc, cây đũa phép này sẽ rút _%1$d sinh lực của người dùng_ để hồi phục hoặc bảo vệ _%2$d sinh lực_ cho đồng minh. Khi được dùng lên kẻ địch, cây đũa mê hoặc chúng trong thời gian ngắn và cho người sử dụng _%3$d khiên_. Quái xác sống sẽ nhận _%4$d-%5$d sát thương_ thay vì bị mê hoặc.
items.wands.wandoftransfusion.upgrade_stat_name_1=Hồi phục đồng minh
items.wands.wandoftransfusion.upgrade_stat_name_2=Tự trao khiên
items.wands.wandoftransfusion.upgrade_stat_name_3=Sát thương với xác sống
items.wands.wandoftransfusion.bmage_desc=Khi _Chiến sư_ đánh một kẻ địch bằng một cây gậy phép truyền máu, ông sẽ nhận khiên và phát bắn kế của ông bằng cây gậy phép sẽ không tốn chút sinh lực nào.
items.wands.wandoftransfusion.eleblast_desc=Một vụ nổ nguyên tố với cây gậy truyền máu gây mê hoặc kẻ thù,hồi phục đồng minh, và gây 100% sát thương lên kẻ thù loại xác sống.

items.wands.wandofwarding.name=đũa phép canh gác
items.wands.wandofwarding.staff_name=gậy phép canh gác
items.wands.wandofwarding.no_more_wards=Đũa phép của bạn không thể duy trì thêm giám hộ nào nữa.
items.wands.wandofwarding.bad_location=Bạn không thể đặt một giám hộ ở đó.
items.wands.wandofwarding.desc=Cây đũa phép kim loại ngắn này có một viên ngọc màu tím sáng lơ lửng trên đỉnh của nó.
items.wands.wandofwarding.stats_desc=Thay vì trực tiếp gây sát thương cho kẻ thù, cây đũa phép này sẽ triệu hồi các giám hộ và lính gác bất động. Các giám hộ có thể được triệu hồi ở bất cứ đâu, thậm chí xuyên qua các bức tường nếu bạn có tầm nhìn. Cây đũa phép này có thể duy trì _%d năng lượng_ tương ứng một giám hộ một lúc.
items.wands.wandofwarding.upgrade_stat_name_1=Sát thương giám hộ
items.wands.wandofwarding.upgrade_stat_name_2=Năng lượng cho giám hộ
items.wands.wandofwarding.bmage_desc=Khi _Chiến sư_ đánh một kẻ địch bằng một cây gậy phép canh gác, tất cả giám hộ lính gác đang hoạt động có khả năng được hồi phục.
items.wands.wandofwarding.eleblast_desc=Một vụ nổ nguyên tố với gậy phép canh gác hồi phục cho tất cả giám hộ và lính gác trong khu vực nổ.
items.wands.wandofwarding$ward.desc_generic_ward=Giám hộ này sẽ tự động bắn bất kỳ kẻ địch nào bước vào tầm nhìn của nó.\n\nBắn vào giám hộ này bằng cây đũa phép canh gác của bạn sẽ nâng cấp nó.\n\nCác giám hộ có số lần bắn giới hạn trước khi tan biến.
items.wands.wandofwarding$ward.desc_generic_sentry=Lính gác này có sức tấn công tương tự như một giám hộ, nhưng có sinh lực thay vì một lượng năng lượng cố định. Nó trông giống viên ngọc trên đầu cây đũa phép canh gác của bạn.\n\nBắn vào lính gác này bằng cây đũa phép canh gác của bạn sẽ nâng cấp và hồi phục nó.\n\nLính gác này sẽ tiêu một lượng sinh lực mỗi lần nó bắn một kẻ địch, nhưng có thể được hồi phục bằng cách sử dụng cây đũa phép canh gác của bạn lên nó.
items.wands.wandofwarding$ward.name_1=giám hộ nhỏ
items.wands.wandofwarding$ward.desc_1=Giám hộ cơ bản này sẽ tự động bắn bất kỳ kẻ địch nào bước vào tầm nhìn của nó, gây _%1$d-%2$d sát thương._\n\nBắn giám hộ này bằng đũa phép canh gác của bạn sẽ nâng cấp nó.\n\nGiám hộ này sẽ chỉ bắn một lần trước khi tan biến.\n\nĐũa phép canh gác của bạn đang sử dụng _%3$d năng lượng_ để duy trì giám hộ này.
items.wands.wandofwarding$ward.name_2=giám hộ
items.wands.wandofwarding$ward.desc_2=Giám hộ được nâng cấp này có họa tiết tỉ mỉ hơn, và có thể tấn công nhiều lần. Mỗi phát bắn từ giám hộ này sẽ gây _%1$d-%2$d sát thương._\n\nBắn vào giám hộ này bằng đũa phép canh gác của bạn sẽ nâng cấp nó.\n\nGiám hộ này sẽ bắn ba lần trước khi tan biến.\n\nĐũa phép canh gác của bạn đang sử dụng _%3$d năng lượng_ để duy trì giám hộ này.
items.wands.wandofwarding$ward.name_3=giám hộ lớn
items.wands.wandofwarding$ward.desc_3=Giám hộ được nâng cấp tối đa này có khả năng tấn công nhiều lần hơn so với những người tiền nhiệm của nó. Mỗi phát bắn từ giám hộ này sẽ gây _%1$d-%2$d sát thương._\n\nBắn vào giám hộ này bằng cây đũa phép canh gác của bạn sẽ nâng cấp nó.\n\nGiám hộ này sẽ bắn năm lần trước khi tan biến.\n\nĐũa phép canh gác của bạn đang sử dụng _%3$d năng lượng_ để duy trì giác này.
items.wands.wandofwarding$ward.name_4=lính gác nhỏ
items.wands.wandofwarding$ward.desc_4=Lính gác nhỏ này có sức tấn công tương tự như một giám hộ lớn, nhưng có sinh lực thay vì một lượng năng lượng cố định. Nó trông giống viên ngọc trên đỉnh cây đũa phép canh gác của bạn. Mỗi phát bắn từ lính gác này sẽ gây _%1$d-%2$d sát thương._\n\nBắn lính gác này bằng đũa phép canh gác của bạn sẽ nâng cấp và phục hồi nó.\n\nLính gác này sẽ tiêu hao một lượng sinh lực mỗi lần nó bắn một kẻ địch, nhưng có thể được hồi phục bằng cách sử dụng đũa phép canh gác của bạn lên nó.\n\nĐũa phép canh gác của bạn đang sử dụng _%3$d năng lượng_ để duy trì lính gác này.
items.wands.wandofwarding$ward.name_5=lính gác
items.wands.wandofwarding$ward.desc_5=Lính gác được nâng cấp này lớn hơn và bền hơn một lính gác nhỏ. Mỗi phát bắn từ lính gác này sẽ gây _%1$d-%2$d sát thương._\n\nBắn lính gác này bằng đũa phép canh gác của bạn sẽ phục hồi nó.\n\nLính gác này sẽ tiêu hao một lượng sinh lực mỗi lần nó bắn một kẻ địch, nhưng có thể được hồi phục bằng cách sử dụng đũa phép canh gác của bạn lên nó.\n\nĐũa phép canh gác của bạn đang sử dụng _%3$d năng lượng_ để duy trì lính gác này.
items.wands.wandofwarding$ward.name_6=lính gác lớn
items.wands.wandofwarding$ward.desc_6=Lính gác được nâng cấp đầy đủ này bền bỉ hơn đáng kể so với những người tiền nhiệm của nó. Mỗi phát bắn từ lính gác này sẽ gây _%1$d-%2$d sát thương._\n\nBắn lính gác này bằng đũa phép canh gác của bạn sẽ phục hồi nó.\n\nLính gác này sẽ tiêu hao một lượng sinh lực mỗi lần nó bắn một kẻ địch, nhưng có thể được hồi phục bằng cách sử dụng đũa phép canh gác của bạn lên nó.\n\nĐũa phép canh gác của bạn đang sử dụng _%3$d năng lượng_ để duy trì lính gác này.
items.wands.wandofwarding$ward.discover_hint=Bạn có thể tìm thấy nhân vật này bằng một cây đũa phép nhất định.
items.wands.wandofwarding$ward.dismiss_title=Loại bỏ giám hộ này?
items.wands.wandofwarding$ward.dismiss_body=Bạn có thể xoá bỏ giám hộ này nếu bạn không còn muốn đũa phép của bạn duy trì nó. Làm vậy sẽ ngay lập tức phá hủy giám hộ này.\n\nBỏ giám hộ này?
items.wands.wandofwarding$ward.dismiss_confirm=có
items.wands.wandofwarding$ward.dismiss_cancel=không

###weapon curses
items.weapon.curses.annoying.name=%s phiền phức
items.weapon.curses.annoying.msg_1=Ồ, CHÚNG TA ĐANG ĐÁNH NHAU VỚI THỨ GÌ SAO!?
items.weapon.curses.annoying.msg_2=ĐÚNG RỒI, XỬ CHÚNG!
items.weapon.curses.annoying.msg_3=Ê, NGHE NÀY!
items.weapon.curses.annoying.msg_4=CHÚNG TA ĐÃ ĐẾN CON TRÙM CHƯA!?
items.weapon.curses.annoying.msg_5=Á, ĐỪNG VUNG TÔI MẠNH THẾ!
items.weapon.curses.annoying.msg_6=CHẾT ĐI, LŨ CÔN TRÙNG!
items.weapon.curses.annoying.msg_7=WHEEEEEEEEE!
items.weapon.curses.annoying.msg_8=CHÚNG TA NGHỈ MỘT TÍ ĐƯỢC KHÔNG!?
items.weapon.curses.annoying.msg_9=POW,HAHA!
items.weapon.curses.annoying.msg_10=ĐÁNH ĐẸP LẮM!
items.weapon.curses.annoying.msg_11=Tôi đâu muốn làm một vũ khí, tôi muốn làm một cây rìu của một người tiều phu.
items.weapon.curses.annoying.msg_12=Hãy nhớ, Tự mãn là kẻ giết người từ từ và xảo quyệt.
items.weapon.curses.annoying.msg_13=TẤT CẢ TÀI SẢN CỦA NGƯỜI GIỜ CỦA BỌN TA!
items.weapon.curses.annoying.desc=Những vũ khí phiền phức có khả năng nói, nhưng chúng có chút nhiều năng lượng quá. Chúng sẽ thường thu hút sự chú ý về phía bạn mà không cố ý.
items.weapon.curses.annoying.elestrike_desc=Một cú đánh phép thuật với lời nguyền phiền phức có 20% khả năng gây điên cuồng cho mỗi kẻ địch trong tầm tần công trong vòng 6 lượt.

items.weapon.curses.dazzling.name=%s chói lòa
items.weapon.curses.dazzling.desc=Vũ khí chói lòa đôi lúc sẽ phát ra ánh sáng chói lòa, làm mù tất cả những gì có thể nhìn thấy nó.
items.weapon.curses.dazzling.elestrike_desc=Một cú đánh phép thuật với lời nguyền chói lòa có 50% khả năng làm mù mỗi kẻ địch trong tầm tấn công trong 6 lượt.

items.weapon.curses.displacing.name=%s dời chỗ
items.weapon.curses.displacing.desc=Những vũ khí dời chỗ mang trong mình phép thuật dịch chuyển hỗn loạn, sở hữu khả năng dịch chuyển kẻ địch quanh tầng một cách ngẫu nhiên.
items.weapon.curses.displacing.elestrike_desc=Một vụ nổ nguyên tố với lời nguyền dời chỗ có 50% sẽ dịch chuyển kẻ thù trong phạm vi tấn công.

items.weapon.curses.explosive.name=%s nổ
items.weapon.curses.explosive.warm=Ấm...
items.weapon.curses.explosive.hot=Nóng!
items.weapon.curses.explosive.desc=Vũ khí phát nổ tích năng lượng dần dần và phát nổ, gây tổn hại bất cứ thứ gì ở gần.
items.weapon.curses.explosive.desc_cool=Vũ khí hiện tại của bạn vẫn còn lạnh khi chạm vào.
items.weapon.curses.explosive.desc_warm=Vũ khí của bạn đang tích tụ năng lượng và đang ấm dần lên...
items.weapon.curses.explosive.desc_hot=Vũ khí của bạn nóng! Nó chuẩn bị phát nổ!
items.weapon.curses.explosive.elestrike_desc=Một cú đánh phép thuật với lời nguyền phát nổ có 50% sẽ kích hoạt một vụ nổ vào một kẻ thù ngẫu nhiên trong phạm vi tấn công.

items.weapon.curses.friendly.name=%s thân thiện
items.weapon.curses.friendly.desc=Vũ khí thân thiện phù hợp nhất với những người theo chủ nghĩa hòa bình, thỉnh thoảng kích hoạt phép thuật khiến bạn không thể chiến đấu.
items.weapon.curses.friendly.elestrike_desc=Một cú đánh phép thuật với lời nguyền thân thiện có 50% khẳ năng mê hoặc mỗi kẻ địch trong tầm tấn công trong 5 lượt.

items.weapon.curses.polarized.name=%s phân cực
items.weapon.curses.polarized.desc=Một vũ khí phân cực bị ảnh hưởng bởi phép thuật khiến đòn tấn công của nó hoặc là gây thêm 50% sát thương, hoặc là không gây chút sát thương nào.
items.weapon.curses.polarized.elestrike_desc=Một cú đánh phép thuật với lời nguyền phân cực có 50% khẳ năng gây 24-36 sát thương cho mỗi kẻ địch ở trong tầm tấn công.

items.weapon.curses.sacrificial.name=%s hiến tế
items.weapon.curses.sacrificial.desc=Những vũ khí hiến tế sẽ cần máu từ người mang để đổi lại cho việc tấn công kẻ địch. Người mang càng khỏe mạnh, lời nguyền sẽ lấy càng nhiều máu.
items.weapon.curses.sacrificial.elestrike_desc=Một cú đánh phép thuật với lời nguyền hiến tế sẽ khiến người hùng và mỗi kẻ địch trong tầm tấn công chảy máu 12 HP.

items.weapon.curses.wayward.name=%s chệch hướng
items.weapon.curses.wayward.desc=Các vũ khí chệch hướng sẽ thỉnh thoảng trở nên vô cùng thiếu chính xác. Phép thuật này kéo dài trong một lúc ngắn khi nó kích hoạt, nhưng có thể được loại bỏ bằng cách tung một đòn trúng địch với món vũ khí chệch hướng.
items.weapon.curses.wayward.elestrike_desc=Một cú đánh phép thuật với lời nguyền chệch hướng có 50% khẳ năng làm mỗi kẻ địch trong tầm tần công bị trúng phép trong 6 lượt.
items.weapon.curses.wayward$waywardbuff.name=Chệch hướng
items.weapon.curses.wayward$waywardbuff.desc=Vũ khí mang ma thuật chệch hướng của bạn đã kích hoạt, biến nó cực kì kém chính xác trong một khoảng thời gian ngắn. Nên nhớ rằng điều này không ảnh hưởng đến đòn tấn công chắc chắn trúng, như là đánh bất ngờ. Đòn tấn công thành công với vũ khí chệch hướng sẽ ngay lập tức xóa bỏ hiệu ứng.\n\nLượt còn lại: %s.

###enchantments
items.weapon.enchantments.blazing.name=%s rực cháy
items.weapon.enchantments.blazing.desc=Phù phép này khiến lửa bắn ra từ một vũ khí, đốt cháy kẻ địch và gây thêm sát thương cho những kẻ địch đã cháy sẵn.
items.weapon.enchantments.blazing.elestrike_desc=Một cú đánh phép thuật với phù phép rực cháy làm lửa lan tới mọi ô trong tầm tần công, kéo dài 8 lượt.

items.weapon.enchantments.blocking.name=%s chặn cản
items.weapon.enchantments.blocking.desc=Vũ khí có phù phép chặn cản có khả năng tạo ra một lớp khiên bảo vệ bạn trong thời gian ngắn sau khi sử dụng chúng để tấn công
items.weapon.enchantments.blocking.elestrike_desc=Một cú đánh phép thuật với phù phép chặn trao cho Kiếm sĩ thêm 6 khiên cho mỗi kẻ địch trong tầm tấn công.
items.weapon.enchantments.blocking$blockbuff.name=chặn cản
items.weapon.enchantments.blocking$blockbuff.desc=Phù phép chặn cản của vũ khí đã tăng sức phòng thủ của bạn trong thời gian ngắn!\n\nKhiên chắn còn lại: %d\n\nLượt còn lại: %s.

items.weapon.enchantments.blooming.name=%s nở hoa
items.weapon.enchantments.blooming.desc=Các vũ khí nở hoa chứa phép thuật làm cho thực vật nảy mầm trên hoặc xung quanh những kẻ bị chúng đánh.
items.weapon.enchantments.blooming.elestrike_desc=Một cú đánh phép thuật với phù phép nở hoa làm cỏ lan ra tối đa 8 ô trong tầm tấn công và bám rễ vào tất cả kẻ thù trong tầm tấn công trong 6 lượt.

items.weapon.enchantments.chilling.name=%s làm lạnh
items.weapon.enchantments.chilling.desc=Những kẻ địch bị đánh bằng vũ khí này bị làm lạnh, làm chậm sự di chuyển và các đòn tấn công của chúng.
items.weapon.enchantments.chilling.elestrike_desc=Một cú đánh phép thuật với phù phép làm lạnh làm khí lạnh lan ra mọi ô trong tầm tấn công, kéo dài 8 lượt.

items.weapon.enchantments.kinetic.name=%s động năng
items.weapon.enchantments.kinetic.desc=Khi một kẻ địch bị giết bằng một vũ khí động năng, mọi lực thừa sẽ được chứa trong vũ khí và được sử dụng vào đòn tấn công kế.
items.weapon.enchantments.kinetic.elestrike_desc=Một cú đánh phép thuật với phù phép động năng gây 40% lượng sát thương được trữ cho mỗi kẻ thù tầm tấn công, trừ mục tiêu chính.
items.weapon.enchantments.kinetic$conserveddamage.name=sát thương được giữ
items.weapon.enchantments.kinetic$conserveddamage.desc=Vũ khí của bạn đã chứa lực dư từ đòn kết liễu trước, và sẽ sử dụng nó làm sát thương cộng thêm vào đòn tấn công kế của bạn. Tuy nhiên, năng lượng này sẽ từ từ biến mất theo thời gian.\n\nSát thương giữ lại: %d.

items.weapon.enchantments.corrupting.name=%s tha hóa
items.weapon.enchantments.corrupting.desc=Phù phép mạnh mẽ này sở hữu khả năng thay đổi kẻ địch theo ý muốn của bạn. Khi một kẻ địch bị giết bằng vũ khí này, có khả năng nó sẽ trở nên tha hóa thay vì chết.
items.weapon.enchantments.corrupting.elestrike_desc=Một vụ cú đánh phép thuật với phù phép tha hóa có 5-25% khả năng (dựa vào sinh lực đã mất) tha hóa mỗi kẻ thù trong tầm tấn công, trừ mục tiêu chính.

items.weapon.enchantments.elastic.name=%s đàn hồi
items.weapon.enchantments.elastic.desc=Vũ khí đàn hồi có khả năng đẩy kẻ địch bay ngược lại một khoảng cách ngắn.
items.weapon.enchantments.elastic.elestrike_desc=Một cú đánh phép thuật với phù phép đàn hồi đẩy tất cả kẻ thù trong tầm tấn công lùi ra 4 ô.

items.weapon.enchantments.grim.name=%s tử thần
items.weapon.enchantments.grim.desc=Phù phép mạnh mẽ này sở hữu sức mạnh giết chết một kẻ địch ngay lập tức. Kẻ địch càng yếu, hiệu ứng này càng dễ xảy ra.
items.weapon.enchantments.grim.elestrike_desc=Một cú đánh phép thuật với phù phép tử thần có 6-30% (dựa vào lượng máu đã mất) để tiêu diệt kẻ thù trong phạm vi tấn công, trừ kẻ thù chính.

items.weapon.enchantments.lucky.name=%s may mắn
items.weapon.enchantments.lucky.desc=Những kẻ thù bị vũ khí may mắn giết có khả năng rớt thêm đồ.
items.weapon.enchantments.lucky.elestrike_desc=Một cú đánh phép thuật với phù phép may mắn có 12.5% khả năng tạo ra vật phẩm dưới mỗi kẻ địch trong tầm tấn công. Hiệu ứng này chỉ có thể kích hoạt một lần mỗi kẻ địch.

items.weapon.enchantments.projecting.name=%s tầm xa
items.weapon.enchantments.projecting.desc=Với phù phép này, các vũ khí cận chiến sẽ được tăng thêm tầm đánh. Các vũ khí tầm xa sẽ xuyên qua các bức tường khi nhắm vào các mục tiêu ở gần.
items.weapon.enchantments.projecting.elestrike_desc=Một cú đánh phép thuật với phù phép tầm xa gây 30% sát thương lên mỗi kẻ địch trong tầm tấn công, trừ mục tiêu chính.

items.weapon.enchantments.shocking.name=%s gây sốc
items.weapon.enchantments.shocking.desc=Điện phóng ra từ vũ khí gây sốc, gây thêm sát thương cho tất cả kẻ địch ở gần.
items.weapon.enchantments.shocking.elestrike_desc=Một cú đánh phép thuật với phù phép gây sốc làm điện lan ra mọi ô trong tầm tấn công, kéo dài 8 lượt.

items.weapon.enchantments.unstable.name=%s không ổn định
items.weapon.enchantments.unstable.desc=Phép thuật này phóng ra năng lượng hỗn loạn, nó hành động như một phép thuật khác với mỗi cú đánh.
items.weapon.enchantments.unstable.elestrike_desc=Một cú đánh phép thuật với phù phép không ổn định gây một hiệu ứng phù phép ngẫu nhiên cho từng kẻ thù trong phạm vi tấn công, trừ kẻ thù chính.

items.weapon.enchantments.vampiric.name=%s hút máu
items.weapon.enchantments.vampiric.desc=Phù phép mạnh mẽ này hút năng lượng sống của kẻ địch với mỗi đòn tấn công, truyền nó vào người cầm. Sinh lực của người cầm càng thấp thì hiệu ứng càng mạnh.
items.weapon.enchantments.vampiric.elestrike_desc=Một cú đánh phép thuật với phù phép hút máu hồi 2.5 HP cho Kiếm sĩ với mỗi kẻ địch trong tầm tấn công.


###melee weapons
items.weapon.melee.assassinsblade.name=gươm của sát thủ
items.weapon.melee.assassinsblade.stats_desc=Vũ khí này mạnh hơn với những kẻ địch không chú ý.
items.weapon.melee.assassinsblade.ability_name=lẩn trốn
items.weapon.melee.assassinsblade.typical_ability_desc=Kiếm sĩ có thể _đi lén lút_ khi đang cầm một thanh gươm của sát thủ. Kĩ năng này cho phép Kiếm sĩ ngay lập tức dịch chuyển với khoảng cách lên tới 3 ô và thường cho cô ấy _%d lượt tàng hình._
items.weapon.melee.assassinsblade.ability_desc=Kiếm sĩ có thể _đi lén lút_ khi đang cầm một thanh gươm của sát thủ. Kĩ năng này cho phép Kiếm sĩ ngay lập tức dịch chuyển với khoảng cách lên tới 3 ô và cho cô ấy _%d lượt tàng hình._
items.weapon.melee.assassinsblade.upgrade_ability_stat_name=Thời lượng kĩ năng
items.weapon.melee.assassinsblade.desc=Một lưỡi kiếm nhỏ gợn sóng được làm từ hắc diện thạch, khó sử dụng dù có trọng lượng nhẹ, nhưng chết người nếu nó đánh đúng chỗ.

items.weapon.melee.battleaxe.name=rìu chiến
items.weapon.melee.battleaxe.stats_desc=Đây là một vũ khí khá chính xác.
items.weapon.melee.battleaxe.ability_name=đòn đánh mạnh
items.weapon.melee.battleaxe.typical_ability_desc=Kiếm sĩ có thể thực hiện một _đòn đánh mạnh_ với một cây rìu chiến. Đòn tấn công dồn lực này thường gây _%1$d-%2$d sát thương_ nếu nó làm kẻ địch bất ngờ, và làm chúng choáng váng trong 5 lượt, làm giảm độ chính xác và khả năng né tránh đi 50%%. Đòn đánh mạnh luôn luôn trúng nhưng sẽ gây sát thương bình thường nếu nó không làm kẻ địch bất ngờ.
items.weapon.melee.battleaxe.ability_desc=Kiếm sĩ có thể thực hiện một _đòn đánh mạnh_ với một cây rìu chiến. Đòn tấn công dồn lực này gây _%1$d-%2$d sát thương_ nếu nó làm kẻ địch bất ngờ, và làm chúng choáng váng trong 5 lượt, làm giảm độ chính xác và khả năng né tránh đi 50%%. Đòn đánh mạnh luôn luôn trúng nhưng sẽ gây sát thương bình thường nếu nó không làm kẻ địch bất ngờ.
items.weapon.melee.battleaxe.desc=Đầu thép khổng lồ của cây rìu chiến đấu này gây nên sức nặng đáng kể đằng sau mỗi cú đánh rộng.

items.weapon.melee.crossbow.name=nỏ
items.weapon.melee.crossbow.typical_stats_desc=Thông thường vũ khí này cường hoá các phi tiêu ném, khiến chúng gây _%1$d-%2$d sát thương_ khi nó được trang bị, và thậm chí sẽ trao phù phép của nó cho chúng.
items.weapon.melee.crossbow.stats_desc=Vũ khí này cường hoá các phi tiêu ném, khiến chúng gây _%1$d-%2$d sát thương_ khi nó được trang bị, và thậm chí sẽ trao phù phép của nó cho chúng.
items.weapon.melee.crossbow.ability_name=sạc sẵn
items.weapon.melee.crossbow.typical_ability_desc=Kiếm sĩ có thể _nạp_ cây nỏ của cô ấy, khiến đòn tấn công thông thường tiếp theo của cô ấy bằng nó sẽ luôn luôn trúng và có một trong ba hiệu ứng: đòn tấn công cận chiến sẽ đẩy lùi kẻ địch, phi tiêu không tẩm sẽ thường gây _+%1$d sát thương_, và phi tiêu được tẩm sẽ gây hiệu ứng của chúng trong một vùng 7x7 và thường dùng được _thêm %2$d lần_.
items.weapon.melee.crossbow.ability_desc=Kiếm sĩ có thể _nạp_ cây nỏ của cô ấy, khiến đòn tấn công thông thường tiếp theo của cô ấy bằng nó sẽ luôn luôn trúng và có một trong ba hiệu ứng: đòn tấn công cận chiến sẽ đẩy lùi kẻ địch, phi tiêu không tẩm sẽ gây _+%1$d sát thương_, và phi tiêu được tẩm sẽ gây hiệu ứng của chúng trong một vùng 7x7 và dùng được _thêm %2$d lần_.
items.weapon.melee.crossbow.desc=Một vũ khí có cấu tạo khá tỉ mỉ và có thể bắn tên nỏ với tốc độ rất cao. Tuy nó không được thiết kế cho việc này, nhưng trọng lượng và kết cấu vững chắc khiến nó cũng có thể dùng như là một vũ khí cận chiến tạm bợ.
items.weapon.melee.crossbow.upgrade_ability_stat_name=Tăng cường kĩ năng
items.weapon.melee.crossbow$chargedshot.name=đã nạp
items.weapon.melee.crossbow$chargedshot.desc=Kiếm sĩ đang tập trung lực vào cây nỏ của cô. Đòn tấn công tiếp theo cô ấy thực hiện bằng nó sẽ luôn trúng và gây một trong ba hiệu ứng:\n- Đòn tấn công cận chiến sẽ đẩy lùi kẻ địch một vài ô.\n- Phi tiêu không tẩm sẽ gây thêm sát thương\n- Phi tiêu được tẩm sẽ có thêm số lần sử dụng và gây hiệu ứng của chúng trong một vùng 7x7. Các hiệu ứng phi tiêu có lợi sẽ chỉ ảnh hưởng tới đồng minh, và hiệu ứng có hại sẽ chỉ áp dụng lên kẻ địch. Kiếm sĩ không thể sử dụng kĩ năng này để trao các hiệu ứng phi tiêu có lợi cho bản thân.

items.weapon.melee.cudgel.name=gậy
items.weapon.melee.cudgel.stats_desc=Đây là một vũ khí khá chính xác.
items.weapon.melee.cudgel.ability_name=đòn đánh mạnh
items.weapon.melee.cudgel.typical_ability_desc=Kiếm sĩ có thể thực hiện một _đòn đánh mạnh_ với một cây gậy. Đòn tấn công dồn lực này thường gây _%1$d-%2$d sát thương_ nếu nó làm kẻ địch bất ngờ, và làm chúng choáng váng trong 5 lượt, giảm độ chính xác và khả năng né tránh đi 50%%. Đòn đánh mạnh luôn luôn trúng nhưng sẽ gây sát thương bình thường nếu nó không làm kẻ địch bất ngờ.
items.weapon.melee.cudgel.ability_desc=Kiếm sĩ có thể thực hiện một _đòn đánh mạnh_ với một cây gậy. Đòn tấn công dồn lực này gây _%1$d-%2$d sát thương_ nếu nó làm kẻ địch bất ngờ, và làm chúng choáng váng trong 5 lượt, làm giảm độ chính xác và khả năng né tránh đi 50%%. Đòn đánh mạnh luôn luôn trúng nhưng sẽ gây sát thương bình thường nếu nó không làm kẻ địch bất ngờ.
items.weapon.melee.cudgel.desc=Một cây chuỳ nhỏ bằng đồng thau, được tạo ra với mục địch làm một công cụ tự vệ cho các quý tộc hơn là một vũ khí thám hiểm.
items.weapon.melee.cudgel.discover_hint=Một trong các người hùng bắt đầu với vật phẩm này.

items.weapon.melee.dagger.name=dao găm
items.weapon.melee.dagger.stats_desc=Vũ khí này mạnh hơn khi tấn công các kẻ địch không chú ý.
items.weapon.melee.dagger.ability_name=lẩn trốn
items.weapon.melee.dagger.typical_ability_desc=Kiếm sĩ có thể _đi lén lút_ khi đang cầm một con dao găm. Kĩ năng này cho phép Kiếm sĩ ngay lập tức dịch chuyển với khoảng cách lên tới 5 ô và thường cho cô ấy _%d lượt tàng hình._
items.weapon.melee.dagger.ability_desc=Kiếm sĩ có thể _đi lén lút_ khi đang cầm một con dao găm. Kĩ năng này cho phép Kiếm sĩ ngay lập tức dịch chuyển với khoảng cách lên tới 5 ô và cho cô ấy _%d lượt tàng hình._
items.weapon.melee.dagger.upgrade_ability_stat_name=Thời lượng kĩ năng
items.weapon.melee.dagger.desc=Một con dao găm sắt đơn giản với một chiếc tay cầm cũ mòn.
items.weapon.melee.dagger.discover_hint=Một trong các người hùng bắt đầu với vật phẩm này.

items.weapon.melee.dirk.name=dao găm dài
items.weapon.melee.dirk.stats_desc=Vũ khí này mạnh hơn khi tấn công các kẻ địch không chú ý.
items.weapon.melee.dirk.ability_name=lẩn trốn
items.weapon.melee.dirk.typical_ability_desc=Kiếm sĩ có thể _đi lén lút_ khi đang cầm một con dao găm dài. Kĩ năng này cho phép Kiếm sĩ ngay lập tức dịch chuyển với khoảng cách lên tới 5 ô và thường cho cô ấy _%d lượt tàng hình._
items.weapon.melee.dirk.ability_desc=Kiếm sĩ có thể _đi lén lút_ khi đang cầm một con dao găm dài. Kĩ năng này cho phép Kiếm sĩ ngay lập tức dịch chuyển với khoảng cách lên tới 5 ô và cho cô ấy _%d lượt tàng hình._
items.weapon.melee.dirk.upgrade_ability_stat_name=Thời lượng kĩ năng
items.weapon.melee.dirk.desc=Một con dao găm đâm dài hơn, cho thêm một chút thép để đâm vào trong kẻ địch.

items.weapon.melee.flail.name=chùy xích
items.weapon.melee.flail.stats_desc=Đây là một vũ khí khá thiếu chính xác.\nVũ khí này không thể tấn công bất ngờ.
items.weapon.melee.flail.ability_name=quay
items.weapon.melee.flail.spin_warn=Bạn không thể quay cái chùy thêm nữa.
items.weapon.melee.flail.typical_ability_desc=Kiếm sĩ có thể _quay_ một cây chùy xích để tích sức mạnh trong một thời gian ngắn. Mỗi lượt cây chùy xích được quay, nó thường sẽ gây _+%d sát thương_ vào đòn tấn công thường tiếp theo của nó, lên tới tối đa 3 lần. Một cây chùy xích đang quay cũng chắc chắn sẽ trúng. Chỉ bắt đầu quay cây chùy xích mới tốn một năng lượng.
items.weapon.melee.flail.ability_desc=Kiếm sĩ có thể _quay_ một cây chùy xích để tích sức mạnh trong một thời gian ngắn. Mỗi lượt cây chùy xích được quay, nó sẽ gây _+%d sát thương_ vào đòn tấn công thường tiếp theo của nó, lên tới tối đa 3 lần. Một cây chùy xích đang quay cũng chắc chắn sẽ trúng. Chỉ bắt đầu quay cây chùy xích mới tốn một năng lượng.
items.weapon.melee.flail.desc=Một quả cầu gai được gắn với một tay cầm bằng một sợi xích. Rất khó nhấc, nhưng có sức hủy diệt nếu nó giáng một đòn chính xác.
items.weapon.melee.flail$spinabilitytracker.name=đang quay
items.weapon.melee.flail$spinabilitytracker.desc=Kiếm sĩ đang quay cây chùy xích của cô ấy, tích luỹ sát thương cho đòn tấn công thường tiếp theo của cô ấy bằng nó. Mỗi lần quay tốn một lượt nhưng gia tăng sát thương, lên tới tối đa ba lần quay. Cây chùy xích cũng chắc chắn sẽ đánh trúng khi đang quay.\n\nVòng quay hiện tại: %1$d%%.\nLượt còn lại: %2$s.

items.weapon.melee.gauntlet.name=găng tay đá
items.weapon.melee.gauntlet.stats_desc=Đây là một vũ khí rất nhanh
items.weapon.melee.gauntlet.ability_name=đòn đánh kết hợp
items.weapon.melee.gauntlet.typical_ability_desc=Kiếm sĩ có thể thực hiên một _đòn đánh liên hoàn_ với một chiếc găng tay đá. Đòn tấn công này chắc chắn sẽ trúng và thường gây _+%d sát thương_ với mỗi lần Kiếm sĩ đã tấn công bằng một vũ khí cận chiến hoặc ném thông thường. Không tấn công trong vòng 5 lượt sẽ làm mất chuỗi tấn công này.
items.weapon.melee.gauntlet.ability_desc=Kiếm sĩ có thể thực hiên một _đòn đánh liên hoàn_ với một chiếc găng tay đá. Đòn tấn công này chắc chắn sẽ trúng và gây _+%d sát thương_ với mỗi lần Kiếm sĩ đã tấn công bằng một vũ khí cận chiến hoặc ném thông thường. Không tấn công trong vòng 5 lượt sẽ làm mất chuỗi tấn công này.
items.weapon.melee.gauntlet.desc=Chiếc găng tay khổng lồ này được làm từ vải đỏ với đá phép thuật nặng chồng lên trên. Lớp vải bó chặt quanh bạn, khiến cho những tấm đá dày gần giống như một lớp da thứ hai. Vung một vũ khí nặng như vậy cần sức mạnh, nhưng thêm rất nhiều lực vào đòn đánh của bạn.

items.weapon.melee.glaive.name=glaive
items.weapon.melee.glaive.stats_desc=Đây là một vũ khí khá chậm.\nVũ khí này có thêm tầm với.
items.weapon.melee.glaive.ability_name=đâm
items.weapon.melee.glaive.typical_ability_desc=Kiếm sĩ có thể dùng mũi nhọn của một cây glaive để _đâm_ một kẻ địch ở trong tầm tấn công nhưng không được cận kề. Đòn tấn công này thường gây _%1$d-%2$d sát thương_, đẩy lùi kẻ địch, và chắc chắn sẽ trúng.
items.weapon.melee.glaive.ability_desc=Kiếm sĩ có thể dùng mũi nhọn của một cây glaive để _đâm_ một kẻ địch ở trong tầm tấn công nhưng không được cận kề. Đòn tấn công này gây _%1$d-%2$d sát thương_, đẩy lùi kẻ địch, và chắc chắn sẽ trúng.
items.weapon.melee.glaive.desc=Một món vũ khí dạng gậy to lớn bao gồm một lưỡi kiếm ở trên đầu của một cây gậy.

items.weapon.melee.gloves.name=găng tay nạm
items.weapon.melee.gloves.stats_desc=Đây là một vũ khí rất nhanh.
items.weapon.melee.gloves.ability_name=đòn đánh kết hợp
items.weapon.melee.gloves.typical_ability_desc=Kiếm sĩ có thể thực hiên một _đòn đánh liên hoàn_ với găng tay nạm. Đòn tấn công này chắc chắn sẽ trúng và thường gây _+%d sát thương_ với mỗi lần Kiếm sĩ đã tấn công bằng một vũ khí cận chiến hoặc ném thông thường. Không tấn công trong vòng 5 lượt sẽ làm mất chuỗi tấn công này.
items.weapon.melee.gloves.ability_desc=Kiếm sĩ có thể thực hiên một _đòn đánh liên hoàn_ với găng tay nạm. Đòn tấn công này chắc chắn sẽ trúng và gây _+%d sát thương_ với mỗi lần Kiếm sĩ đã tấn công bằng một vũ khí cận chiến hoặc ném thông thường. Không tấn công trong vòng 5 lượt sẽ làm mất chuỗi tấn công này.
items.weapon.melee.gloves.desc=Những chiếc găng tay nạm này không mang lại sự bảo vệ thật sự nào, mà chúng có tác dụng như một món vũ khí tạm dùng được, đồng thời giữ cho bàn tay rảnh.
items.weapon.melee.gloves.discover_hint=Một trong những người hùng bắt đầu với vật phẩm này.

items.weapon.melee.greataxe.name=rìu lớn
items.weapon.melee.greataxe.stats_desc=Vũ khí này nặng không tưởng.
items.weapon.melee.greataxe.ability_name=báo thù
items.weapon.melee.greataxe.typical_ability_desc=Kiếm sĩ có thể thực hiện một đòn _trả thù_ với một cây rìu lớn nếu sinh lực của cô dưới mức 50%%. Đòn tấn công hủy diệt này thường gây _%1$d-%2$d sát thương,_ chắc chắn sẽ trúng, và diễn ra tức thì nếu nó giết một kẻ địch.
items.weapon.melee.greataxe.ability_desc=Kiếm sĩ có thể thực hiện một đòn _trả thù_ với một cây rìu lớn nếu sinh lực của cô dưới mức 50%%. Đòn tấn công hủy diệt này gây _%1$d-%2$d sát thương,_ chắc chắn sẽ trúng, và diễn ra tức thì nếu nó giết một kẻ địch.
items.weapon.melee.greataxe.desc=Phải được vác lên vai, chiếc rìu khổng lồ này có sức mạnh ngang với sức nặng của nó.

items.weapon.melee.greatshield.name=khiên lớn
items.weapon.melee.greatshield.typical_stats_desc=Vũ khí này thông thường sẽ đỡ 0-%d sát thương. Mức độ đỡ đòn tỉ lệ thuận với số lượng nâng cấp.
items.weapon.melee.greatshield.stats_desc=Vũ khí này sẽ đỡ 0-%d sát thương. Mức độ đỡ đòn tỉ lệ thuận với số lượng nâng cấp.
items.weapon.melee.greatshield.ability_name=phòng thủ
items.weapon.melee.greatshield.typical_ability_desc=Kiếm sĩ có thể _bảo vệ_ chính mình bằng một chiếc khiên lớn, vô hiệu hoàn toàn tất cả sát thương vật lí hoặc phép thuật nhắm vào cô ấy, thường là trong _%d lượt_. Một khi Kiếm sĩ đã chặn một đòn tấn công, tấn công ngược lại hoặc sử dụng phép thuật sẽ kết thúc bảo vệ.
items.weapon.melee.greatshield.ability_desc=Kiếm sĩ có thể _bảo vệ_ chính mình bằng một chiếc khiên lớn, vô hiệu hoàn toàn tất cả sát thương vật lí hoặc phép thuật nhắm vào cô ấy trong _%d lượt_. Một khi Kiếm sĩ đã chặn một đòn tấn công, tấn công ngược lại hoặc sử dụng phép thuật sẽ kết thúc bảo vệ.
items.weapon.melee.greatshield.upgrade_ability_stat_name=Thời lượng kĩ năng
items.weapon.melee.greatshield.desc=Giống như một bức tường di động hơn là một chiếc khiên, đống kim loại khổng lồ này hỗ trợ phòng thủ, nhưng không để lại nhiều chỗ cho việc tấn công.

items.weapon.melee.greatsword.name=kiếm lớn
items.weapon.melee.greatsword.ability_name=chẻ đôi
items.weapon.melee.greatsword.typical_ability_desc=Kiếm sĩ có thể _chẻ đôi_ một kẻ địch với một thanh kiếm lớn. Đòn tấn công này thường gây _%1$d-%2$d sát thương_ và chắc chắn sẽ trúng. Nếu đòn chẻ đôi giết một kẻ địch, nó diễn ra ngay lập tức và Kiếm sĩ có thể dùng đòn chẻ đôi thêm một lần trong vòng 5 lượt miễn phí.
items.weapon.melee.greatsword.ability_desc=Kiếm sĩ có thể _chẻ đôi_ một kẻ địch với một thanh kiếm lớn. Đòn tấn công này gây _%1$d-%2$d sát thương_ và chắc chắn sẽ trúng. Nếu đòn chẻ đôi giết một kẻ địch, nó diễn ra ngay lập tức và Kiếm sĩ có thể dùng đòn chẻ đôi thêm một lần trong vòng 5 lượt miễn phí.
items.weapon.melee.greatsword.desc=Thanh kiếm cao ngất ngưởng này gây sát thương lớn bằng cách đặt sức nặng của nó vào mọi cú vung.

items.weapon.melee.handaxe.name=rìu cầm tay
items.weapon.melee.handaxe.stats_desc=Đây là một vũ khí khá chính xác.
items.weapon.melee.handaxe.ability_name=đòn đánh mạnh mẽ
items.weapon.melee.handaxe.typical_ability_desc=Kiếm sĩ có thể thực hiện một _đòn đánh mạnh_ với một cây rìu cầm tay. Đòn tấn công dồn lực này thường gây _%1$d-%2$d sát thương_ nếu nó làm kẻ địch bất ngờ, và làm chúng choáng váng trong 5 lượt, làm giảm độ chính xác và khả năng né tránh đi 50%%. Đòn đánh mạnh luôn luôn trúng nhưng sẽ gây sát thương bình thường nếu nó không làm kẻ địch bất ngờ.
items.weapon.melee.handaxe.ability_desc=Kiếm sĩ có thể thực hiện một _đòn đánh mạnh_ với một cây rìu cầm tay. Đòn tấn công dồn lực này gây _%1$d-%2$d sát thương_ nếu nó làm kẻ địch bất ngờ, và làm chúng choáng váng trong 5 lượt, làm giảm độ chính xác và khả năng né tránh đi 50%%. Đòn đánh mạnh luôn luôn trúng nhưng sẽ gây sát thương bình thường nếu nó không làm kẻ địch bất ngờ.
items.weapon.melee.handaxe.desc=Một chiếc rìu nhẹ, được dùng để chặt cây là phổ biến nhất. Lưỡi rìu rộng cũng hiệu quả với kẻ địch nữa.

items.weapon.melee.katana.name=katana
