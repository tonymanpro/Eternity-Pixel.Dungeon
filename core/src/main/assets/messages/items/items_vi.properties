items.weapon.melee.runicblade.desc=Một vũ khí bí ẩn từ một vùng đất xa xôi, với một lưỡi kiếm màu xanh sáng.

items.weapon.melee.sai.name=sai
items.weapon.melee.sai.stats_desc=Đây là một vũ khí rất nhanh
items.weapon.melee.sai.ability_name=đòn đánh kết hợp
items.weapon.melee.sai.typical_ability_desc=Kiếm sĩ có thể thực hiên một _đòn đánh liên hoàn_ với sai. Đòn tấn công này chắc chắn sẽ trúng và thường gây _+%d sát thương_ với mỗi lần Kiếm sĩ đã tấn công bằng một vũ khí cận chiến hoặc ném thông thường. Không tấn công trong vòng 5 lượt sẽ làm mất chuỗi tấn công này.
items.weapon.melee.sai.ability_desc=Kiếm sĩ có thể thực hiên một _đòn đánh liên hoàn_ với sai. Đòn tấn công này chắc chắn sẽ trúng và gây _+%d sát thương_ với mỗi lần Kiếm sĩ đã tấn công bằng một vũ khí cận chiến hoặc ném thông thường. Không tấn công trong vòng 5 lượt sẽ làm mất chuỗi tấn công này.
items.weapon.melee.sai.desc=Hai luỡi kiếm mỏng được tạo ra để cầm mỗi tay một chiếc. Rất tốt để tiêu diệt kẻ địch với một loạt nhát chém.
items.weapon.melee.sai$combostriketracker.name=đòn đánh kết hợp
items.weapon.melee.sai$combostriketracker.desc=Kiếm sĩ đang tích lũy combo, được dùng để tăng sát thương của kĩ năng đòn tổ hợp. Mỗi đòn tấn công trúng bằng vũ khí cận chiến hoặc ném thông thường sẽ được tính, nhưng không tấn công trúng trong vòng 5 lượt sẽ đặt lại combo này.\n\nSố đòn tấn công gần đây: %1$d.\n\nLượt còn lại cho đến khi số đòn tấn công bị mất: %2$s.

items.weapon.melee.scimitar.name=mã tấu
items.weapon.melee.scimitar.stats_desc=Đây là một vũ khí khá nhanh.
items.weapon.melee.scimitar.ability_name=Vũ điệu kiếm
items.weapon.melee.scimitar.typical_ability_desc=Kiếm sĩ có thể thực hiện một _vũ điệu kiếm_ với một cây mã tấu. Thế đứng này không mất thời gian để kích hoạt và trao cho Kiếm sĩ +60%% tốc độ tấn công và +50%% độ chính xác, thường là trong _%d lượt._
items.weapon.melee.scimitar.ability_desc=Kiếm sĩ có thể thực hiện một _vũ điệu kiếm_ với một cây mã tấu. Thế đứng này không mất thời gian để kích hoạt và trao cho Kiếm sĩ +60%% tốc độ tấn công và +50%% độ chính xác trong _%d lượt._
items.weapon.melee.scimitar.upgrade_ability_stat_name=Thời lượng kĩ năng
items.weapon.melee.scimitar.desc=Một luỡi kiếm dày, cong. Hình dạng của nó cho phép các đòn tấn công nhanh hơn, tuy rằng ít mạnh mẽ hơn.
items.weapon.melee.scimitar$sworddance.name=vũ điệu kiếm
items.weapon.melee.scimitar$sworddance.desc=Kiếm sĩ đang thực hiên các đòn đánh nhanh chóng dựa trên quán tính theo một dạng vũ điệu. Khi thế đứng này được kích hoạt, cô ấy tấn công nhanh hơn 60%% (đủ để tấn công đúng hai lần một lượt với một cây mã tấu) và có +50%% độ chính xác.\n\nLượt còn lại: %s.

items.weapon.melee.sickle.name=liềm
items.weapon.melee.sickle.stats_desc=Vũ khí này có độ chính xác thấp.
items.weapon.melee.sickle.ability_name=gặt
items.weapon.melee.sickle.typical_ability_desc=Kiếm sĩ có thể _gặt_ một kẻ địch với một cây liềm. Đòn tấn công mạnh mẽ này chắc chắn sẽ trúng và thường gây _%d sát thương_. Sát thương này được gây ra qua chảy máu nếu mục tiêu không miễn nhiễm với hiệu ứng này.
items.weapon.melee.sickle.ability_desc=Kiếm sĩ có thể _gặt_ một kẻ địch với một cây liềm. Đòn tấn công mạnh mẽ này chắc chắn sẽ trúng và gây _%d sát thương_. Sát thương này được gây ra qua chảy máu nếu mục tiêu không miễn nhiễm với hiệu ứng này.
items.weapon.melee.sickle.desc=Một dụng cụ thu hoạch cầm tay mà cũng có thể dùng làm một vũ khí mạnh nhưng sử dụng.

items.weapon.melee.spear.name=giáo
items.weapon.melee.spear.stats_desc=Đây là một vũ khí khá chậm.\nVũ khí này có thêm tầm với.
items.weapon.melee.spear.ability_name=đâm
items.weapon.melee.spear.typical_ability_desc=Kiếm sĩ có thể dùng mũi nhọn của một cây giáo để _đâm_ một kẻ địch ở trong tầm tấn công nhưng không được cận kề. Đòn tấn công này thường gây _%1$d- %2$dsát thương_, đẩy lùi kẻ địch, và chắc chắn sẽ trúng.
items.weapon.melee.spear.ability_desc=Kiếm sĩ có thể dùng mũi nhọn của một cây giáo để _đâm_ một kẻ địch ở trong tầm tấn công nhưng không được cận kề. Đòn tấn công này gây _%1$d-%2$d sát thương_, đẩy lùi kẻ địch, và chắc chắn sẽ trúng.
items.weapon.melee.spear.desc=Một cây gậy gỗ mỏng với sắt được mài gắn vào đỉnh.

items.weapon.melee.sword.name=thanh kiếm
items.weapon.melee.sword.ability_name=chẻ đôi
items.weapon.melee.sword.typical_ability_desc=Kiếm sĩ có thể _chẻ đôi_ một kẻ địch với một thanh kiếm. Đòn tấn công này thường gây _%1$d-%2$d sát thương_ và chắc chắn sẽ trúng. Nếu đòn chẻ đôi giết một kẻ địch, nó diễn ra ngay lập tức và Kiếm sĩ có thể dùng đòn chẻ đôi thêm một lần trong vòng 5 lượt miễn phí.
items.weapon.melee.sword.ability_desc=Kiếm sĩ có thể _chẻ đôi_ một kẻ địch với một thanh kiếm. Đòn tấn công này gây _%1$d-%2$d sát thương_ và chắc chắn sẽ trúng. Nếu đòn chẻ đôi giết một kẻ địch, nó diễn ra ngay lập tức và Kiếm sĩ có thể dùng đòn chẻ đôi thêm một lần trong vòng 5 lượt miễn phí.
items.weapon.melee.sword.desc=Một cây kiếm được cân bằng tốt. Không quá lớn, nhưng vẫn dài hơn đáng kể so với một thanh kiếm ngắn.
items.weapon.melee.sword$cleavetracker.name=chẻ đôi
items.weapon.melee.sword$cleavetracker.desc=Kiếm sĩ đã sẵn sàng để nối tiếp đòn chẻ đôi trước của cô. Lần sử dụng chẻ đôi tiếp theo sẽ không tốn chút năng lượng kĩ năng vũ khí nào.\n\nLượt còn lại: %s.

items.weapon.melee.warhammer.name=búa chiến
items.weapon.melee.warhammer.stats_desc=Đây là một vũ khí khá chính xác.
items.weapon.melee.warhammer.ability_name=đòn đánh mạnh mẽ
items.weapon.melee.warhammer.typical_ability_desc=Kiếm sĩ có thể thực hiện một _đòn đánh mạnh_ với một cây búa chiến. Đòn tấn công dồn lực này thường gây _%1$d-%2$d sát thương_ nếu nó làm kẻ địch bất ngờ, và làm chúng choáng váng trong 5 lượt, làm giảm độ chính xác và khả năng né tránh đi 50%%. Đòn đánh mạnh luôn luôn trúng nhưng sẽ gây sát thương bình thường nếu nó không làm kẻ địch bất ngờ.
items.weapon.melee.warhammer.ability_desc=Kiếm sĩ có thể thực hiện một _đòn đánh mạnh_ với một cây búa chiến. Đòn tấn công dồn lực này gây _%1$d-%2$d sát thương_ nếu nó làm kẻ địch bất ngờ, và làm chúng choáng váng trong 5 lượt, làm giảm độ chính xác và khả năng né tránh đi 50%%. Đòn đánh mạnh luôn luôn trúng nhưng sẽ gây sát thương bình thường nếu nó không làm kẻ địch bất ngờ.
items.weapon.melee.warhammer.desc=Ít sinh vật nào có thể chịu được đòn đánh hủy diệt của đống chì và thép khổng lồ này, nhưng cần có sức mạnh to lớn để sử dụng hiệu quả.

items.weapon.melee.warscythe.name=lưỡi hái chiến
items.weapon.melee.warscythe.stats_desc=Đây là một vũ khí khá thiếu chính xác.
items.weapon.melee.warscythe.ability_name=gặt
items.weapon.melee.warscythe.typical_ability_desc=Kiếm sĩ có thể _gặt_ một kẻ địch với một lưỡi hái chiến. Đòn tấn công mạnh mẽ này chắc chắn sẽ trúng và thường gây _%d sát thương_. Sát thương này được gây ra qua chảy máu nếu mục tiêu không miễn nhiễm với hiệu ứng này.
items.weapon.melee.warscythe.ability_desc=Kiếm sĩ có thể _gặt_ một kẻ địch với một lưỡi hái chiến. Đòn tấn công mạnh mẽ này chắc chắn sẽ trúng và gây _%d sát thương_. Sát thương này được gây ra qua chảy máu nếu mục tiêu không miễn nhiễm với hiệu ứng này.
items.weapon.melee.warscythe.desc=Vũ khí lớn và khó sử dụng này đã được chỉnh sửa để tiêu diệt kẻ thù hơn là cây trồng.

items.weapon.melee.whip.name=roi
items.weapon.melee.whip.stats_desc=Vũ khí này có tầm đánh rất xa.
items.weapon.melee.whip.ability_name=quất
items.weapon.melee.whip.typical_ability_desc=Kiếm sĩ có thể _quật_ tất cả kẻ địch xung quanh cô ấy với một chiếc roi. Kĩ năng này thường gây _%1$d-%2$d sát thương_, tấn công tất cả kẻ địch nằm trong tầm tấn công, và chắc chắn sẽ trúng.
items.weapon.melee.whip.ability_desc=Kiếm sĩ có thể _quật_ tất cả kẻ địch xung quanh cô ấy với một chiếc roi. Kĩ năng này gây _%1$d-%2$d sát thương_, tấn công tất cả kẻ địch nằm trong tầm tấn công, và chắc chắn sẽ trúng.
items.weapon.melee.whip.desc=Dù phần dây gai ở đuôi vũ khí này gây sát thương thấp, tầm với của nó không gì sánh bằng.

items.weapon.melee.wornshortsword.name=kiếm ngắn cùn
items.weapon.melee.wornshortsword.ability_name=chẻ đôi
items.weapon.melee.wornshortsword.typical_ability_desc=Kiếm sĩ có thể _chẻ đôi_ một kẻ địch với một cây kiếm ngắn cùn. Đòn tấn công này thường gây _%1$d-%2$d sát thương_ và chắc chắn sẽ trúng. Nếu đòn chẻ đôi giết một kẻ địch, nó diễn ra ngay lập tức và Kiếm sĩ có thể dùng đòn chẻ đôi thêm một lần trong vòng 5 lượt miễn phí.
items.weapon.melee.wornshortsword.ability_desc=Kiếm sĩ có thể _chẻ đôi_ một kẻ địch với một cây kiếm ngắn cùn. Đòn tấn công này gây _%1$d-%2$d sát thương_ và chắc chắn sẽ trúng. Nếu đòn chẻ đôi giết một kẻ địch, nó diễn ra ngay lập tức và Kiếm sĩ có thể dùng đòn chẻ đôi thêm một lần trong vòng 5 lượt miễn phí.
items.weapon.melee.wornshortsword.desc=Một thanh kiếm khá ngắn, cùn đi do sử dụng nhiều. Nó vừa yếu hơn và nhẹ hơn một chút so với một thanh kiếm ngắn trong điều kiện tốt hơn.
items.weapon.melee.wornshortsword.discover_hint=Một trong những người hùng bắt đầu với vật phẩm này.


###missile weapons
items.weapon.missiles.darts.adrenalinedart.name=phi tiêu adrenaline
items.weapon.missiles.darts.adrenalinedart.desc=Những chiếc phi tiêu này được tẩm một hợp chất dựa trên cây cúc gai nhanh, thứ sẽ tăng tốc độ di chuyển và tấn công của đồng minh, hoặc làm giảm tốc độ di chuyển của kẻ địch trong thời gian ngắn. Bản thân chiếc phi tiêu vẫn có hại với kẻ địch, nhưng sẽ không làm hại đồng minh.

items.weapon.missiles.darts.blindingdart.name=phi tiêu làm mù
items.weapon.missiles.darts.blindingdart.desc=Những chiếc phi tiêu này được tẩm một hợp chất dựa trên cỏ dại mù, thứ sẽ làm mù mục tiêu của chúng trong một thời gian ngắn. Tuy nhiên chúng không gây mất phương hướng, vậy nên một kẻ địch sẽ vẫn biết nơi nó đã nhìn thấy bạn trước đó.

items.weapon.missiles.darts.chillingdart.name=phi tiêu làm lạnh
items.weapon.missiles.darts.chillingdart.desc=Những chiếc phi tiêu này được tẩm một hợp chất dựa trên cây chỏm băng, thứ sẽ làm lạnh đáng kể mục tiêu của chúng.

items.weapon.missiles.darts.cleansingdart.name=phi tiêu thanh tẩy
items.weapon.missiles.darts.cleansingdart.desc=Những phi tiêu này được tẩm với một hợp chất trong hoa mageroyal mà nó sẽ tạm thời làm cho đồng minh miễn nhiễm với tất cả hiệu ứng bất lợi, hoặc xóa bỏ tất cả hiệu ứng có lợi của kẻ thù. Kẻ thù cũng có khả năng sẽ quên việc chúng đang tấn công hay bỏ chạy khỏi bạn. Phi tiêu vẫn sẽ có hại với dịch, nhưng sẽ không gây sát thương cho đồng minh.

items.weapon.missiles.darts.dart.name=phi tiêu
items.weapon.missiles.darts.dart.ac_tip=TẨM
items.weapon.missiles.darts.dart.prompt=Chọn một hạt giống
items.weapon.missiles.darts.dart.tip_title=Tẩm phi tiêu
items.weapon.missiles.darts.dart.tip_desc=Một hạt giống có thể được kết hợp với một hoặc hai phi tiêu để tẩm chúng. Mỗi loại hạt giống tạo ra một loại phi tiêu được tẩm riêng, với một hiệu ứng đặc biệt dùng một lần.\n\nTẩm một phi tiêu bằng những hạt giống này sẽ tạo ra một _%s_
items.weapon.missiles.darts.dart.tip_all=tẩm %1$d phi tiêu với %2$d hạt giống
items.weapon.missiles.darts.dart.tip_two=tẩm 2 phi tiêu với 1 hạt giống
items.weapon.missiles.darts.dart.tip_one=tẩm 1 phi tiêu với 1 hạt giống
items.weapon.missiles.darts.dart.tip_cancel=hủy
items.weapon.missiles.darts.dart.desc=Những trục gỗ nhọn đơn giản này có trọng lượng phù hợp để bay và chích con mồi chỉ bằng một cái lướt cổ tay. Chúng có thể được tẩm thêm hạt giống để có thêm hiệu ứng khi được ném.
items.weapon.missiles.darts.dart.unlimited_uses=Nhờ cấu tạo đơn giản của chúng, phi tiêu có thể coi là sẽ dùng được vĩnh viễn.

items.weapon.missiles.darts.displacingdart.name=phi tiêu dịch chuyển
items.weapon.missiles.darts.displacingdart.desc=Những chiếc phi tiêu này được tẩm bằng một hợp chất dựa trên lá biến mất và sẽ dịch chuyển mục tiêu của chúng đi một khoảng cách ngắn.

items.weapon.missiles.darts.healingdart.name=phi tiêu hồi phục
items.weapon.missiles.darts.healingdart.desc=Những chiếc phi tiêu này được tẩm một hợp chất dựa trên cỏ mặt trời giúp hồi phục mục tiêu của chúng. Bản thân phi tiêu vẫn có hại với kẻ địch, nhưng sẽ không làm hại đồng minh.

items.weapon.missiles.darts.holydart.name=phi tiêu thánh
items.weapon.missiles.darts.holydart.desc=Những chiếc phi tiêu này được tẩm một hợp chất dựa trên hoa sao, thứ sẽ đưa năng lượng thần thánh vào mục tiêu của chúng. Các đồng minh và kẻ địch thông thường sẽ được ban phước, nhưng những kẻ địch xác sống hay ma quỷ sẽ nhận sát thương lớn. Bản thân chiếc phi tiêu vẫn có hại với kẻ địch, nhưng sẽ không làm hại đồng minh.

items.weapon.missiles.darts.incendiarydart.name=phi tiêu gây cháy
items.weapon.missiles.darts.incendiarydart.desc=Những chiếc phi tiêu này được tẩm một hợp chất dựa trên hoa lửa sẽ bùng phát thành ngọn lửa rực rỡ khi va chạm.

items.weapon.missiles.darts.paralyticdart.name=phi tiêu tê liệt
items.weapon.missiles.darts.paralyticdart.desc=Những chiếc phi tiêu này được tẩm một hợp chất dựa trên cây rễ đất, thứ sẽ làm tê liệt mục tiêu của chúng trong một thời gian ngắn.

items.weapon.missiles.darts.poisondart.name=phi tiêu độc
items.weapon.missiles.darts.poisondart.desc=Những chiếc phi tiêu này được tẩm một hợp chất dựa trên cây rêu đau buồn, thứ sẽ gây độc cho mục tiêu của chúng.

items.weapon.missiles.darts.rotdart.name=phi tiêu thối
items.weapon.missiles.darts.rotdart.desc=Những chiếc phi tiêu ác độc này được tẩm một hợp chất có tính axit dựa trên quả mọng thối, thứ sẽ ăn xuyên qua bất cứ thứ gì chiếc phi tiêu tiếp xúc phải một cách hung dữ. Các kẻ địch mạnh mẽ sẽ kháng hầu hết hiệu ứng, nhưng sự ăn mòn đủ mạnh để dễ dàng giết hầu hết kẻ địch thông thường. Những chiếc này dùng được lâu hơn những phi tiêu được tẩm khác, nhưng độ bền của chúng không thể được tăng.
items.weapon.missiles.darts.rotdart.discover_hint=Bạn có thể tạo ra vật phẩm này bằng cách sử dụng một hạt giống từ một nhiệm vụ nhất định.

items.weapon.missiles.darts.shockingdart.name=phi tiêu sốc
items.weapon.missiles.darts.shockingdart.desc=Những chiếc phi tiêu này được tẩm một hợp chất dựa trên cây nho bão, thứ sẽ cho mục tiêu của chúng một cú sốc mạnh.

items.weapon.missiles.darts.tippeddart.ac_clean=LÀM SẠCH
items.weapon.missiles.darts.tippeddart.clean_title=Làm sạch phi tiêu
items.weapon.missiles.darts.tippeddart.clean_desc=Hành động này sẽ loại bỏ phần tẩm hạt giống trên phi tiêu của bạn, biến chúng trở lại phi tiêu thường.
items.weapon.missiles.darts.tippeddart.clean_all=làm sạch tất cả
items.weapon.missiles.darts.tippeddart.clean_one=làm sạch một
items.weapon.missiles.darts.tippeddart.cancel=hủy
items.weapon.missiles.darts.tippeddart.uses_left=Số phi tiêu này còn _%d/%d_ lần sử dụng trước khi một đầu tẩm hết tác dụng.
items.weapon.missiles.darts.tippeddart.unlimited_uses=_Nhưng những thứ này có chất lượng cao tới mức chúng sẽ dùng được vĩnh viễn._
items.weapon.missiles.darts.tippeddart.about_to_break=Lớp tẩm trên phi tiêu của bạn sắp hết.
items.weapon.missiles.darts.tippeddart.has_broken=Lớp tẩm trên phi tiêu của bạn đã hết.
items.weapon.missiles.darts.tippeddart.discover_hint=Bạn có thể mua vật phẩm này trong một cửa hàng, hoặc tạo ra nó bằng cách sử dụng một hạt giống.


items.weapon.missiles.bolas.name=bolas
items.weapon.missiles.bolas.stats_desc=Vũ khí này gây què cho mục tiêu của nó.
items.weapon.missiles.bolas.desc=Những vũ khí tầm xa kì lạ này không có tính sát thương cao, nhưng làm chậm mục tiêu của mình rất tốt.

items.weapon.missiles.boomerang.name=boomerang
items.weapon.missiles.boomerang.desc=Khi được ném vào kẻ địch, vật ném phẳng hình cong này sẽ quay về tay của người ném nó.
items.weapon.missiles.boomerang.durability=Bởi sự chế tạo rắn chắc của nó, chiếc boomerang này sẽ không hỏng do sử dụng.

items.weapon.missiles.fishingspear.name=giáo bắt cá
items.weapon.missiles.fishingspear.desc=Những cây giáo ném nhỏ xíu này cũng có thể được dùng tạm làm một vũ khí, dù được thiết kế để bắt cá.

items.weapon.missiles.forcecube.name=khối vuông lực
items.weapon.missiles.forcecube.ondeath=Bạn đã giết chính mình bằng Khối vuông lực của chính bạn.
items.weapon.missiles.forcecube.stats_desc=Vũ khí này phân tán lực của cú va chạm của nó ra một khu vực nhỏ, chạm tới tất cả mọi thứ ở gần.
items.weapon.missiles.forcecube.desc=Những khối vuông phép thuật có hình thù kì lạ này đủ nhỏ để nằm trong bàn tay bạn, nhưng vô cùng nặng

items.weapon.missiles.heavyboomerang.name=boomerang nặng
items.weapon.missiles.heavyboomerang.stats_desc=Vũ khí này vòng về vị trí nó được ném đi sau năm lượt.
items.weapon.missiles.heavyboomerang.desc=Chiếc boomerang lớn này khó để sử dụng hiệu quả, nhưng sẽ gây sát thương đáng kể.

items.weapon.missiles.javelin.name=lao
items.weapon.missiles.javelin.desc=Những cây giáo ném lớn hơn này được thiết kế để giữ mũi nhọn trên đỉnh nằm ở phía trước khi chúng lướt qua không khí.

items.weapon.missiles.kunai.name=kunai
items.weapon.missiles.kunai.stats_desc=Vũ khí này mạnh hơn với những kẻ địch không chú ý.
items.weapon.missiles.kunai.desc=Những con dao nhỏ này rất mạnh trong tay một người dùng giỏi.

items.weapon.missiles.missileweapon.stats_known=Bộ vũ khí ném _bậc %1$d_ này gây _%2$d-%3$d sát thương_ và cần _%4$d sức mạnh_ để sử dụng.
items.weapon.missiles.missileweapon.stats_unknown=Thông thường bộ vũ khí ném _bậc %1$d_ này gây _%2$d-%3$d sát thương_ và cần _%4$d sức mạnh_ để sử dụng.
items.weapon.missiles.missileweapon.stats_desc=
items.weapon.missiles.missileweapon.probably_too_heavy=Có lẽ vũ khí này quá nặng với bạn.
items.weapon.missiles.missileweapon.distance=Các vũ khí ném chính xác hơn từ xa, nhưng ít chính xác hơn ở gần.
items.weapon.missiles.missileweapon.durability=Vũ khí ném sẽ dần hao mòn và hỏng khi chúng được sử dụng.
items.weapon.missiles.missileweapon.uses_left=Bộ vũ khí ném này còn _%d/%d_ lần sử dụng trước khi một chiếc hỏng.
items.weapon.missiles.missileweapon.unlimited_uses=Bộ này có chất lượng cao tới mức có thể coi là sẽ dùng được vĩnh viễn.
items.weapon.missiles.missileweapon.unknown_uses=Thông thường bộ vũ khí ném này sẽ còn _%d_ lần sử dụng trước khi một chiếc hỏng.
items.weapon.missiles.missileweapon.curse_discover=Vũ khí ném này bị nguyền rủa!
items.weapon.missiles.missileweapon.about_to_break=Vũ khí ném của bạn sắp hỏng.
items.weapon.missiles.missileweapon.has_broken=Một trong các vũ khí ném của bạn đã hỏng.
items.weapon.missiles.missileweapon.dust=Món vũ khí ném của bạn tan thành cát bụi khi bạn chạm vào nó.
items.weapon.missiles.missileweapon.break_upgraded_warn_desc=Nếu món vũ khí ném cuối cùng trong bộ vũ khí ném được nâng cấp của bạn hỏng, bộ đó sẽ bị mất vĩnh viễn. Bạn có chắc chắn mình muốn ném nó?
items.weapon.missiles.missileweapon.break_upgraded_warn_yes=Có
items.weapon.missiles.missileweapon.break_upgraded_warn_no=Không
items.weapon.missiles.missileweapon$placeholder.name=vũ khí ném

items.weapon.missiles.shuriken.name=shuriken
items.weapon.missiles.shuriken.stats_desc=Shuriken có thể được ném tức thì với thời gian hồi là 20 lượt.
items.weapon.missiles.shuriken.desc=Những mảnh kim loại hình sao với các lưỡi sắc như dao này có thể được ném một cách nhanh chóng khi đang di chuyển.
items.weapon.missiles.shuriken$shurikeninstanttracker.name=Thời gian hồi shuriken
items.weapon.missiles.shuriken$shurikeninstanttracker.desc=Bạn đã ném một chiếc shuriken tức thì gần đây, và phải chờ trước khi làm vậy một lần nữa. Shuriken vẫn có thể được ném, nhưng ở tốc độ bình thường của vũ khí.\n\nLượt còn lại: %s.

items.weapon.missiles.throwingclub.name=côn ném
items.weapon.missiles.throwingclub.stats_desc=Vũ khí này không dính vào kẻ địch và có thể được thu thập ngay lập tức.
items.weapon.missiles.throwingclub.desc=Một vũ khí ném khá đơn giản nhưng bền, căn bản là một viên đá lớn buộc vào một cây gậy.

items.weapon.missiles.throwinghammer.name=búa ném
items.weapon.missiles.throwinghammer.stats_desc=Vũ khí này không dính vào kẻ địch và có thể được thu thập ngay lập tức.
items.weapon.missiles.throwinghammer.desc=Những chiếc búa nặng này được thiết kế để ném vào một kẻ địch. Cấu trúc nhẵn và hoàn toàn bằng kim loại của chúng có nghĩa là chúng khá bền.

items.weapon.missiles.throwingknife.name=dao ném
items.weapon.missiles.throwingknife.stats_desc=Vũ khí này mạnh hơn với những kẻ địch không chú ý.
items.weapon.missiles.throwingknife.desc=Những con dao nhẹ này được cân bằng để phóng xuyên qua không khí vào thẳng mục tiêu của chúng.
items.weapon.missiles.throwingknife.discover_hint=Một trong những người hùng bắt đầu với vật phẩm này.

items.weapon.missiles.throwingspear.name=giáo ném
items.weapon.missiles.throwingspear.desc=Những cây giáo nhẹ này có phần thân mỏng, được thiết kế để ném chứ không phải để đâm.

items.weapon.missiles.throwingspike.name=gai ném
items.weapon.missiles.throwingspike.desc=Những thanh kim loại nhọn bền bỉ này được dùng để ném vào các kẻ địch ở xa.
items.weapon.missiles.throwingspike.discover_hint=Một trong những người hùng bắt đầu với vật phẩm này.

items.weapon.missiles.throwingstone.name=đá ném
items.weapon.missiles.throwingstone.desc=Những hòn đá này đã được mài đi để khiến chúng có thể được ném với lực mạnh hơn một hòn đá thông thường.
items.weapon.missiles.throwingstone.discover_hint=Một trong những người hùng bắt đầu với vật phẩm này.

items.weapon.missiles.tomahawk.name=tomahawk
items.weapon.missiles.tomahawk.stats_desc=Vũ khí này gây _%1$d-%2$d chảy máu_ cho mục tiêu của nó.
items.weapon.missiles.tomahawk.typical_stats_desc=Vũ khí này thường gây _%1$d-%2$d chảy máu_ cho mục tiêu của nó.
items.weapon.missiles.tomahawk.desc=Những cây rìu ném này có một lưỡi răng cưa, tạo ra vết rạch khi chúng dính vào một kẻ địch.

items.weapon.missiles.trident.name=đinh ba
items.weapon.missiles.trident.desc=Những cây giáo ném khổng lồ với ba mũi nhọn chết người ở cuối. Chúng mạnh, nhưng khá nặng.


items.weapon.spiritbow.name=cung tâm linh
items.weapon.spiritbow.ac_shoot=BẮN
items.weapon.spiritbow.prompt=Chọn một mục tiêu
items.weapon.spiritbow.stats=Cây cung này không thể được nâng cấp trực tiếp, mà thay vào đó sẽ từ từ trở nên mạnh hơn khi bạn lên cấp. Ở cấp độ hiện tại của bạn, các mũi tên được bắn từ cây cung sẽ gây _%1$d-%2$d sát thương_ và cần _%3$d sức mạnh_ để sử dụng đúng cách.
items.weapon.spiritbow.desc=Một cây cung được làm từ gỗ phép thuật cổ. Dây của cây cung và các nét khắc phát sáng với một ánh sáng màu xanh dương nhạt. Khi sợi dây được kéo cây cung này sẽ tạo ra một mũi tên phép thuật có thể được bắn vào một kẻ địch.
items.weapon.spiritbow.discover_hint=Một trong những người hùng bắt đầu với vật phẩm này.

items.weapon.weapon.identify=Giờ đây bạn cảm thấy thân thuộc hơn với vũ khí đủ để thẩm định nó.
items.weapon.weapon.too_heavy=Bởi bạn không đủ sức mạnh, vũ khí này sẽ hạn chế tốc độ tấn công, độ chính xác và khả năng tấn công bất ngờ của bạn.
items.weapon.weapon.excess_str=Do lượng sức mạnh thừa của bạn, bạn sẽ gây thêm _0-%d sát thương_ với vũ khí này.
items.weapon.weapon.hardening_gone=Sự gia cố trên vũ khí này đã hết tác dụng!
items.weapon.weapon.incompatible=Sự tương tác của các loại phép thuật khác nhau đã vô hiệu phù phép trên vũ khí này!
items.weapon.weapon.cursed_worn=Bởi vũ khí này bị nguyền, bạn không thể tháo bỏ nó.
items.weapon.weapon.cursed=Bạn có thể cảm thấy một phép thuật hắc ám ẩn nấp trong vũ khí này.
items.weapon.weapon.weak_cursed=Dù bị nguyền, bạn vẫn có thể hủy trang bị vũ khí này.
items.weapon.weapon.not_cursed=Vũ khí này không dính phép thuật hắc ám.
items.weapon.weapon.faster=Nó được cường hoá để nâng cao _tốc độ._
items.weapon.weapon.stronger=Nó được cường hoá để nâng cao _sát thương._
items.weapon.weapon.enchanted=nó có một _%s._
items.weapon.weapon.enchant_hardened=Nó đã được _gia cố._
items.weapon.weapon.hardened_no_enchant=Vũ khí này đã được _gia cố,_ nhưng hiện tại nó chưa được phù phép.
items.weapon.weapon$enchantment.enchant=phù phép
items.weapon.weapon$enchantment.rankings_desc=Bị giết bởi một phù phép
items.weapon.weapon$enchantment.discover_hint=Bạn có thể tìm thấy một vật phẩm với hiệu ứng này một cách ngẫu nhiên trong hầm ngục, hoặc tự mình trao nó cho một vật phẩm.


###misc items
items.amulet.name=tấm bùa yendor
items.amulet.ac_end=KẾT THÚC MÀN CHƠI
items.amulet.desc=Tấm bùa Yendor là tạo vật quyền năng nhất được biết đến bởi loài người hay người lùn. Những viên pha lê lấp lánh của nó chứa đựng sức mạnh khó tin và kỳ diệu.
items.amulet.desc_origins=Nguồn gốc của tấm bùa này tới nay vẫn còn là ẩn số. Tuy nhiên trong quá khứ Vua của các người lùn đã từng khoác lác rằng ông ta đã khám phá ra cổ vật này trước khi tộc người lùn cắt đứt mọi liên lạc. Làm thế nào ông ta tìm ra nó? Làm sao mà Yog-Dzewa có thể lấy nó lại từ ông ta? Những khúc mắc này có lẽ không còn quan trọng trong lúc này nữa, quan trọng là chiếc bùa bây giờ đã là của bạn!
items.amulet.desc_ascent=Không ai biết được nguồn gốc của tấm bùa này, nhưng hiển nhiên rằng nó đã luôn bị chi phối nặng nề bởi sức mạnh của Yog-Dzewa. Hầm ngục này có lẽ cũng như vậy, Yog thao túng hầm ngục này theo ý hắn khi bạn di chuyển qua hầm ngục, khiến các kẻ địch đông hơn và mạnh mẽ hơn rất nhiều! Bạn cũng không còn có thể kích hoạt hay bỏ tấm bùa này đi, cứ như là nó đã bị nguyền vậy.
items.amulet.ascent_title=Đi lên
items.amulet.ascent_desc=Bạn bắt đầu cảm nhận được sức mạnh to lớn và kinh khủng của Yog-Dzewa tỏa ra từ tấm bùa. Đi qua hầm ngục để quay lại phía trên như một người thường có lẽ sẽ khó khăn hơn bạn tưởng!\n\nNếu bạn tiếp tục đi lên lại với tấm bùa, hầm ngục sẽ trở nên nguy hiểm hơn, bạn không thể dịch chuyển giữa các tầng, và cách duy nhất để chiến thắng màn chơi là đánh bại các kẻ địch trong khi bạn tiến lên trên qua hầm ngục!\n\nBạn có thể tạm thời để tấm bùa này lại đây nếu bạn muốn đi lên mà không kích hoạt thử thách này, hoặc kích hoạt tấm bùa trước khi đi lên để kết thúc màn chơi như bình thường.
items.amulet.ascent_yes=Tiếp tục!
items.amulet.ascent_no=Dừng lại đã
items.amulet.discover_hint=Bạn có thể tìm thấy vật phẩm này ở tận cùng của hầm ngục...

items.ankh.name=ankh
items.ankh.ac_bless=BAN PHƯỚC
items.ankh.bless=Bạn ban phước chiếc ankh với nước phép.
items.ankh.desc=Biểu tượng cổ của sự bất tử này trao khả năng quay trở lại sự sống sau cái chết. Hầu hết vật phẩm sẽ rơi ra nơi bạn đã chết, nhưng có thể được lấy lại nếu bạn quay lại đó. Bằng cách sử dụng một túi nước đầy, chiếc ankh có thể được ban phước với sức mạnh được thêm.
items.ankh.desc_blessed=Biểu tượng cổ của sự bất tử này trao khả năng quay trở lại sự sống sau cái chết. Chiếc ankh đã được ban phước và giờ thì mạnh hơn nhiều. Chiếc Ankh sẽ hi sinh chính nó để cứu bạn trong một khoảnh khắc hiểm họa chết người.
items.ankh.discover_hint=Bạn có thể mua vật phẩm này trong một cửa hàng.

items.arcaneresin.name=nhựa cây ma thuật
items.arcaneresin.prompt=Chọn một cây đũa phép
items.arcaneresin.ac_apply=DÙNG
items.arcaneresin.level_too_high=Cây gậy phép đó quá mạnh để nhựa cây có thể nâng cấp.
items.arcaneresin.not_enough=Bạn không có đủ nhựa cây ma thuật để sử dụng!
items.arcaneresin.apply=Bạn phủ đũa phép của mình bằng nhựa cây, tăng sức mạnh của nó!
items.arcaneresin.desc=Thứ bột mịn này sáng lấp lánh, thay đổi giữa các sắc độ của màu tím và trắng. Nó có thể được dùng làm vật khuếch đại cho các năng lượng phép thuật, giúp tăng cường cấp độ của các đũa phép khi được sử dụng lên chúng!\n\nNâng cấp một cây đũa phép sẽ tốn 1, 2 hoặc 3 nhựa cây tùy thuộc vào cấp độ gốc của nó. Nhựa cây có thể nâng cấp các đũa phép lên tối đa là +3.\n\nTuy nhiên, nâng cấp từ nhựa cây sẽ bị _ghi đè lên bởi các nguồn nâng cấp khác_ (ví dụ như cuộn giấy nâng cấp), và không được tính khi kết hợp một cây đũa phép vào gậy phép của Pháp sư.
items.arcaneresin.discover_hint=Bạn có thể chế tạo vật phẩm này bằng thuật giả kim.

items.brokenseal.name=con dấu vỡ
items.brokenseal.ac_affix=GẮN
items.brokenseal.prompt=Chọn một áo giáp
items.brokenseal.unknown_armor=Bạn phải thẩm định xem bộ giáp đó có bị nguyền hay không trước.
items.brokenseal.cursed_armor=Con dấu sẽ không có tác dụng với áo giáp bị nguyền.
items.brokenseal.affix=Bạn gắn con dấu vào áo giáp của mình!
items.brokenseal.desc=Một con dấu sáp, được gắn vào áo giáp như một biểu tượng của sự dũng cảm. Nó có một chữ rune bảo vệ đã mờ được khắc vào tâm, và đã nứt làm đôi ngang chính giữa.\n\nMột kỉ vật từ quê nhà của anh, con dấu này giúp chiến binh trở nên kiên trì hơn. Khi đeo con dấu chiến binh sẽ ngay lập tức nhận khiên chắn khi anh ấy sắp bị thương đến còn một nửa sinh lực tối đa trở xuống.\n\nCon dấu có thể được _gắn vào áo giáp_, và chuyển đổi giữa các bộ giáp. Nó có thể mang một nâng cấp theo nó, miễn là nâng cấp đó đã được dùng vào bộ giáp khi con dấu được gắn vào nó.
items.brokenseal.inscribed=Con dấu được khắc vào mình một _%s._
items.brokenseal.choose_title=Chọn một ký tự
items.brokenseal.choose_desc=Cả bộ giáp này và con dấu vỡ đều đang mang một ký tự. Hãy chọn ký tự nào được giữ lại.\n\n\nKý tự áo giáp: %1$s\nKý tự con dấu vỡ: %2$s\n\nLưu ý rằng nếu bạn chọn ký tự đang nằm trên bộ giáp, sau đó con dấu sẽ không thể chuyển nó theo.
items.brokenseal.discover_hint=Một trong những người hùng bắt đầu với vật phẩm này.
items.brokenseal$warriorshield.name=Khiên chắn của Chiến binh
items.brokenseal$warriorshield.desc_active=Con dấu vỡ của Chiến binh hiện đang giúp anh ấy thêm bền chí. cho anh khiên chắn nằm trên sinh lực của anh. Có một khoảng thời gian chờ sau khi khiên chắn được kích hoạt trước khi nó có thể được sử dụng lần nữa.\n\nKhiên chắn này không giảm dần theo thời gian, nhưng sẽ chấm dứt nếu không có kẻ địch nào ở gần sau một vài lượt. Khi nó chấm dứt, mọi khiên chắn chưa được sử dụng sẽ giúp giảm thời gian chờ,  tối đa là 50%%.\n\nKhiên chắn còn lại: %1$d.\n\nThời gian chờ hiện tại: %2$d.
items.brokenseal$warriorshield.desc_cooldown=Chiến binh đã nhận khiên chắn từ con dấu vỡ của anh ấy gần đây, và phải chờ trước khi anh ấy có thể nhận được hiệu ứng khiên chắn của nó lần nữa.\n\nLượt còn lại: %d.
items.brokenseal$warriorshield.desc_negative_cooldown=Thời gian hồi lại khiên của Chiến binh hiện đang âm, nghĩa là khi khiên của anh ấy kích hoạt, thời gian hồi sẽ thấp hơn so với bình thường là 150 lượt. Thời gian hồi của khiên có thể được giảm tới thấp nhất là -150 lượt, nghĩa là nó sẽ ngay lập tức sẵn sàng trở lại khi được kích hoạt.\n\nThời gian hồi hiện tại: %d.

items.dewdrop.name=giọt sương
items.dewdrop.already_full=Bạn đã có sinh lực tối đa.
items.dewdrop.desc=Một giọt sương trong suốt.\n\nNhờ vào phép thuật của nơi này, nước tinh khiết có các đặc tính hồi phục nhỏ.

items.equipableitem.curse_detected=Bạn cảm nhận được rằng vật phẩm này bị nguyền ngay trước khi bạn trang bị nó!
items.equipableitem.unequip_cursed=Bạn không thể tháo một vật phẩm bị nguyền rủa!
items.equipableitem.ac_equip=TRANG BỊ
items.equipableitem.ac_unequip=THÁO

items.energycrystal.name=tinh thể năng lượng
items.energycrystal.desc=Một đống tinh thể ma thuật nhỏ, được tinh luyện với năng lượng giả kim.\n\nNhững tinh thể này là nguyên liệu phổ biến nhất trong các công thức tinh chế giả kim và có thể được làm ra trong nồi tinh chế giả kim bằng cách phân rã các vật phẩm tiêu hao.

items.gold.name=vàng
items.gold.desc=Một đống đồng xu vàng. Thu thập các đồng xu vàng để sau đó dùng chúng trong một cửa hàng.

items.heap.for_sale=%1$dv: %2$s
items.heap.chest=Rương
items.heap.chest_desc=Bạn sẽ không biết cái gì ở trong cho đến khi bạn mở nó!
items.heap.locked_chest=Rương bị khoá
items.heap.locked_chest_desc=Bạn sẽ không biết cái gì ở trong cho đến khi bạn mở nó! Nhưng để mở nó bạn cần một chiếc chìa khoá vàng.
items.heap.crystal_chest=Rương pha lê
items.heap.crystal_chest_desc=Bạn có thể thấy _%s_ ở trong, nhưng để mở rương bạn cần một chiếc chìa khoá pha lê.
items.heap.artifact=một món cổ vật
items.heap.wand=một cây đũa phép
items.heap.ring=một chiếc nhẫn
items.heap.tomb=Mộ
items.heap.tomb_desc=Ngôi mộ cổ này có thể chứa thứ gì đó hữu ích, nhưng chủ nhân của nó chắc chắn sẽ phản đối việc kiểm tra.
items.heap.skeleton=Hài cốt
items.heap.skeleton_desc=Đó là tất cả những gì còn lại của một nhà thám hiểm xấu số. Có lẽ nó đáng để kiểm tra xem còn bất kỳ vật giá trị nào không.
items.heap.remains=Thi hài người hùng
items.heap.remains_desc=Đây là tất cả những gì còn lại từ một trong những người tiền nhiệm của bạn. Có lẽ nó đáng để kiểm tra xem có bất kỳ vật có giá trị nào không.

items.honeypot.name=tổ ong
items.honeypot.ac_shatter=LÀM VỠ
items.honeypot.desc=Cái bình mật ong này thực ra chỉ được phủ một lớp mật ong, thay vào đó, nó là ngôi nhà của một con ong khổng lồ! Những loại ong khổng lồ này thường ở trong tổ của chúng, có lẽ cái bình là một dạng lồng chuyên dụng của người đánh bẫy? Con ong có vẻ khá hạnh phúc trong chiếc bình với mật ong của nó, và kêu vù vù với bạn một cách đầy thận trọng khi bạn nhìn vào nó.
items.honeypot$shatteredpot.name=bình mật vỡ
items.honeypot$shatteredpot.desc=Cái bình đã vỡ tan, chỉ còn thứ mật ong dính được phủ lên vỏ của nó đang giữ nó lại, và nó đang từ từ tách ra.\n\nDù đã bị vỡ, con ong vẫn có vẻ muốn bảo vệ cái bình.

items.item.prompt=Chọn hướng ném
items.item.ac_drop=THẢ
items.item.ac_throw=NÉM
items.item.rankings_desc=Bị giết bởi: %s
items.item.curse=lời nguyền
items.item.custom_note_type=Loại vật phẩm này có một ghi chú cá nhân: "_%s_"
items.item.custom_note=Vật phẩm này có một ghi chú cá nhân: "_%s_"
items.item.discover_hint=Bạn có thể tìm thấy vật phẩm này một cách ngẫu nhiên trong hầm ngục.

items.kindofmisc.unequip_title=Tháo một vật phẩm
items.kindofmisc.unequip_message=Bạn phải tháo một trong những vật phẩm này trước. Chọn một vật phẩm để hoán đổi.

items.kindofweapon.swift_equip=Bạn trang bị nhanh chóng vũ khí của mình.
items.kindofweapon.equip_cursed=Nắm tay của bạn tự nắm chặt quanh món vũ khí.
items.kindofweapon.which_equip_msg=Bạn muốn đặt trang bị này vào ô vũ khí nào?\n\nNhà vô địch tấn công trực tiếp bằng vũ khí chính của cô ấy, nhưng có thể sử dụng kĩ năng của cả hai. Cả hai vũ khí có chung một lượng năng lượng.\n\nNhà vô địch có thể đổi giữa vũ khí chính và vũ khí phụ của cô tức thì.
items.kindofweapon.which_equip_primary=Vũ khí chính (%s)
items.kindofweapon.which_equip_secondary=Vũ khí phụ (%s)
items.kindofweapon.empty=trống

items.kingscrown.name=Vương miện của Vua người lùn
items.kingscrown.ac_wear=ĐEO
items.kingscrown.naked=Thật không may, chiếc vương miện không thể biến đổi đồ lót của bạn.
items.kingscrown.upgraded=Vương miện phát sáng rực rỡ và sau đó tan biến khi áo giáp của bạn biến đổi!
items.kingscrown.ratgraded=Chân của Vua Chuột sáng rực lên trong khi áo giáp của bạn biến đổi!
items.kingscrown.desc=Chiếc vương miện của vua người lùn cuối cùng, nó phát sáng với năng lượng phép thuật to lớn.\n\nKhi được đeo, phép thuật của chiếc vương miện sẽ chảy vào bộ áo giáp bạn đang mặc, biến đổi nó thành một bộ _áo giáp anh hùng độc nhất với các khả năng đặc biệt._ Bộ áo giáp mới sẽ giữ lại tất cả các đặc tính của bộ giáp gốc.
items.kingscrown.discover_hint=Bạn có thể nhận được vật phẩm này do các kẻ địch nhất định rơi ra.

items.liquidmetal.name=kim loại lỏng
items.liquidmetal.ac_apply=DÙNG
items.liquidmetal.prompt=Chọn một vũ khí ném
items.liquidmetal.already_fixed=Vũ khí ném đó đã ở trong trạng thái hoàn hảo!
items.liquidmetal.apply=Bạn sử dụng %d kim loại lỏng để sửa chữa vũ khí ném của bạn.
items.liquidmetal.desc=Chất lỏng phép thuật này có thể lấp đầy vào các vết nứt và rách trên một vũ khí ném, phục hồi nó về trạng thái hoàn hảo! Nếu một bộ vũ khí đang thiếu một vũ khí, còn lại đã sửa chữa đầy đủ, kim loại lỏng thậm chí có thể được sử dụng để thay thể một vũ khí bị thiếu trong bộ!\n\nMột vũ khí bậc 1 cần 10 dung dịch kim loại để sửa chữa hoàn toàn, một vũ khí bậc 5 cần 30. Mỗi cấp độ cũng sẽ tăng lượng kim loại lỏng cần thiết thêm 35%.\n\nKim loại lỏng không thể được dùng để sửa chữa đầu tẩm trên các phi tiêu.
items.liquidmetal.discover_hint=Bạn có thể chế tạo vật phẩm này bằng thuật giả kim.

items.lostbackpack.name=ba lô bị mất
items.lostbackpack.desc=Đây là kho đồ bị mất của bạn. Thu thập nó để lấy lại tất cả các vật phẩm bạn bị mất!

items.merchantsbeacon.name=đèn hiệu của thương gia
items.merchantsbeacon.ac_use=DÙNG
items.merchantsbeacon.desc=Món đồ công nghệ của người lùn kì lạ này cho phép bạn giao tiếp từ khoảng cách xa.\n\nSau khi được kích hoạt, đèn hiệu này sẽ cho bạn bán các vật phẩm của mình cho Chợ Pixel từ bất cứ đâu trong hầm ngục.\n\nTuy nhiên, phép thuật bên trong chiếc đèn hiệu sẽ chỉ kéo dài trong một lần, nên hãy dùng nó cẩn thận.

items.stylus.name=bút phép
items.stylus.ac_inscribe=VẼ
items.stylus.prompt=Chọn một áo giáp
items.stylus.identify=Bạn phải thẩm định xem bộ giáp đó có bị nguyền không trước.
items.stylus.cursed=Phép thuật của chiếc bút sẽ không hoạt động lên áo giáp bị nguyền.
items.stylus.inscribed=Bạn khắc vào áo giáp của mình bằng chiếc bút.
items.stylus.desc=Chiếc bút phép này được làm từ một loại đá đen, rất cứng nào đó. Bằng cách sử dụng nó bạn có thể khắc một ký tự phép thuật lên áo giáp của bạn, nhưng bạn không thể chọn được ký tự đó sẽ là gì, chiếc bút sẽ quyết định điều đó cho bạn.

items.tengusmask.name=Mặt nạ của Tengu
items.tengusmask.ac_wear=ĐEO
items.tengusmask.used=Chiếc mặt nạ tan biến và sức mạnh của nó chảy vào bạn!
items.tengusmask.desc=Chiếc mặt nạ này rơi ra khỏi khuôn mặt của Tengu khi hắn ta chết, bạn có thể cảm nhận được sức mạnh phép thuật lớn tỏa ra từ nó. Có phải chiếc mặt nạ là nguồn sức mạnh của Tengu?\n\nKhi đeo, sức mạnh to lớn của chiếc mặt nạ sẽ được chuyển vào bạn, cho phép bạn _chọn một lớp phụ cho người hùng của mình._\n\nBạn sẽ chọn nghiệp phụ nào?
items.tengusmask.discover_hint=Bạn có thể nhận được vật phẩm này do các kẻ địch nhất định rơi ra.

items.torch.name=đuốc
items.torch.ac_light=THẮP
items.torch.desc=Vật phẩm thiết yếu khi phiêu lưu, khi hầm ngục tối lại, cây đuốc có thể giúp dẫn đường.

items.waterskin.name=túi nước
items.waterskin.ac_drink=UỐNG
items.waterskin.collected=Bạn thu giọt sương vào trong túi nước của bạn.
items.waterskin.full=Túi nước của bạn đã đầy!
items.waterskin.empty=Túi nước của bạn trống trơn!
items.waterskin.desc=Một vật để chứa chất lỏng, làm từ da và dây, được đậy kín bằng một cái nút bần.
items.waterskin.desc_water=Hiện tại chiếc túi nước chỉ chứa một ít nước uống bình thường. Chắc hẳn có thứ gì đó trong hầm ngục mà chiếc túi nước có thể chứa thay vào đó.
items.waterskin.desc_heal=Chiếc túi nước hiện đang được sử dụng để chứa nước hồi phục. Túi nước càng đầy, bạn sẽ được hồi phục ngay lập tức càng nhiều khi uống từ nó. Bạn sẽ chỉ uống đủ số mình cần.
items.waterskin.desc_full=Chiếc túi nước đầy dường như phát ra năng lượng, có lẽ nó có thể được sử dụng để ban phước cho một vật phẩm sinh tồn khác?
items.waterskin.discover_hint=Một trong những người hùng bắt đầu với vật phẩm này.

