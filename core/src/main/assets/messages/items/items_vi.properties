items.weapon.melee.runicblade.typical_ability_desc=Kiếm sĩ có thể thực hiện một _nhát chém rune_ với một thanh kiếm rune. Đòn tấn công này chắc chắn sẽ trúng và thường có _+%d%% sức mạnh phù phép._
items.weapon.melee.runicblade.ability_desc=Kiếm sĩ có thể thực hiện một _nhát chém rune_ với một thanh kiếm rune. Đòn tấn công này chắc chắn sẽ trúng và có _+%d%% sức mạnh phù phép._
