###armor curses
items.armor.curses.antientropy.name=%s của sự hấp thụ nhiệt
items.armor.curses.antientropy.desc=Lời nguyền của sự hấp thụ nhiệt chống lại sức mạnh của vũ trụ, hút lấy năng lượng từ xung quanh và truyền vào người mặc. Điều này tạm thời khiến người mặc bốc cháy, nhưng đóng băng mọi thứ xung quanh họ!

items.armor.curses.bulk.name=%s của sự cồng kềnh
items.armor.curses.bulk.desc=Áo giáp cồng kềnh trông lớn hơn và oai nghiêm hơn, nhưng không thực sự tăng khả năng phòng thủ. Tệ hơn nữa, kích thước tăng thêm khiến việc di chuyển vào các ô cửa rất khó khăn.

items.armor.curses.corrosion.name=%s của sự ăn mòn
items.armor.curses.corrosion.desc=Áo giáp của sự ăn mòn có khả năng bắn ra chất lỏng có tính ăn mòn, bao phủ mọi thứ trong khu vực bằng chất nhầy dính có tính axit.

items.armor.curses.displacement.name=%s dời chỗ
items.armor.curses.displacement.desc=Lời nguyền dời chỗ cố gắng dịch chuyển người mặc nó đến một nơi an toàn khi bị tấn công. Tuy nhiên nó lại hơi quá hiệu quả, họ sẽ bị dịch chuyển ngẫu nhiên xung quanh tầng hiện tại.

items.armor.curses.metabolism.name=%s của sự trao đổi chất
items.armor.curses.metabolism.desc=Lời nguyền của sự trao đổi chất trực tiếp chuyển hóa sự no thành sinh lực khi người mặc bị thương, giúp tăng sự hồi phục, nhưng sẽ nhanh chóng gây chết đói.

items.armor.curses.multiplicity.name=%s của sự nhân bản
items.armor.curses.multiplicity.desc=Áo giáp bị dính lời nguyền nhân bản sẽ chứa đựng ma thuật nhân bản nguy hiểm. Nó sẽ thỉnh thoảng tạo ra một ảo ảnh của người mặc, nhưng cũng có khả năng cao tạo ra nhân bản của kẻ địch!

items.armor.curses.overgrowth.name=%s của sự sinh trưởng quá mức
items.armor.curses.overgrowth.desc=Áo giáp của sự sinh trưởng quá mức được bao phủ bởi nhiều loài cây đang nở hoa. Tuy hiệu ứng này trông thú vị, nhưng nó không giúp gì trong việc phòng thủ cả, và những cây này sẽ ngẫu nhiên kích hoạt trong giao chiến!

items.armor.curses.stench.name=%s của sự hôi thối
items.armor.curses.stench.desc=Áo giáp bị dính lời nguyền hôi thối sẽ tỏa ra đám mây khí độc, gây hại đến mọi thứ trong đám mây đó.


###glyphs
items.armor.glyphs.affection.name=%s của sự quyến rũ
items.armor.glyphs.affection.desc=Ký tự mạnh mẽ này sẽ chi phối tam trí của kẻ tấn công, tạm thời mê hoặc chúng.

items.armor.glyphs.antimagic.name=%s của kháng ma thuật
items.armor.glyphs.antimagic.desc=Ký tự mạnh mẽ này cho phép áo giáp bảo vệ người mặc khỏi các đòn tấn công phép thuật cũng như tấn công vật lý. Sự phòng thủ phép thuật này không bị ảnh hưởng bởi cấp của áo giáp.

items.armor.glyphs.brimstone.name=%s lưu huỳnh
items.armor.glyphs.brimstone.desc=Ký tự này bảo vệ người mặc và đồ đạc của họ khỏi lửa, vô hiệu hoá hoản toàn sát thương và hiệu ứng tiêu cực của nó.

items.armor.glyphs.camouflage.name=%s của khả năng nguỵ trang
items.armor.glyphs.camouflage.desc=Ký tự này cho phép người mặc hòa nhập vào các bụi cỏ cao, cung cấp cho họ hiệu ứng tàng hình tạm thời.

items.armor.glyphs.entanglement.name=%s của sự vướng víu
items.armor.glyphs.entanglement.desc=Ký tự này tạo lớp giáp đất quanh người mặc để hấp thụ sát thương, nhưng lớp giáp sẽ bị vỡ nếu người mặc di chuyển.

items.armor.glyphs.flow.name=%s của dòng chảy
items.armor.glyphs.flow.desc=Ký tự này điều khiển dòng chảy của nước xung quanh người mặc, làm họ nhanh hơn nhiều khi di chuyển qua nó.

items.armor.glyphs.obfuscation.name=%s của sự xáo trộn
items.armor.glyphs.obfuscation.desc=Ký tự này che khuất người mặc, khiến họ khó phát hiện hơn.

items.armor.glyphs.potential.name=%s của tiềm năng
items.armor.glyphs.potential.desc=Ký tự này tích lũy năng lượng khi bị tấn công, cung cấp năng lượng cho đũa phép của người mặc khi nó kích hoạt.

items.armor.glyphs.repulsion.name=%s của mối thù
items.armor.glyphs.repulsion.desc=Ký tự này dội lại lực lên những kẻ tấn công, đẩy chúng bay ngược lại.

items.armor.glyphs.stone.name=%s của đá
items.armor.glyphs.stone.desc=Ký tự này bao bọc bộ giáp với đá phép thuật nặng khiến việc né là bất khả thi, nhưng chặn sát thương tương ứng với khả năng né tránh.

items.armor.glyphs.swiftness.name=%s của sự nhanh nhẹn
items.armor.glyphs.swiftness.desc=Ký tự này tăng tốc độ của người mặc bất cứ khi nào họ không ở gần kẻ thù.

items.armor.glyphs.thorns.name=%s gai
items.armor.glyphs.thorns.desc=Ký tự mạnh mẽ này làm hại những kẻ tấn công, khiến chúng từ từ chảy máu khi chúng tấn công người mặc.

items.armor.glyphs.viscosity.name=%s của sự trì hoãn
items.armor.glyphs.viscosity.deferred=được hoãn lại %d
items.armor.glyphs.viscosity$defereddamage.name=sát thương được hoãn
items.armor.glyphs.viscosity$defereddamage.ondeath=Sát thương được hoãn lại đã giết bạn...
items.armor.glyphs.viscosity$defereddamage.rankings_desc=Bị giết bởi sát thương được hoãn lại
items.armor.glyphs.viscosity$defereddamage.desc=Sát thương đang được gây ra chậm rãi theo thời gian thay vì ngay lập tức.\n\nSát thương được hoãn lại còn lại: %d.
items.armor.glyphs.viscosity.desc=Kí tự này có thể hấp thụ lượng sát thương mà người mặc đã nhận, và trải đều lượng sát thương ấy một cách từ từ cho họ thay vì lãnh đủ tất cả cùng một lúc.



###armor
items.armor.armor.ac_detach=THÁO
items.armor.armor.detach_seal=Bạn tháo con dấu khỏi áo giáp của mình.
items.armor.armor.equip_cursed=Bộ giáp siết chặt quanh bạn một cách đau đớn
items.armor.armor.identify=Giờ đây bạn cảm thấy thân thuộc hơn với chiếc áo giáp đủ để thẩm định nó.
items.armor.armor.hardening_gone=Sự gia cố trên bộ giáp này đã hết tác dụng!
items.armor.armor.incompatible=Sự tương tác của các loại phép thuật khác nhau đã xoá ký tự trên áo giáp này!
items.armor.armor.curr_absorb=Bộ giáp _bậc %1$d_ này chặn _%2$d-%3$d sát thương_ và cần _%4$d sức mạnh_ để sử dụng đúng cách.
items.armor.armor.avg_absorb=Thông thường bộ giáp _bậc %1$d_ này chặn _%2$d-%3$d sát thương_ và cần _%4$d sức mạnh_ để sử dụng đúng cách.
items.armor.armor.too_heavy=Bởi sự thiếu hụt sức mạnh cần thiết của bạn, việc mặc áo giáp này sẽ làm giảm khả năng di chuyển, né tránh, và phòng thủ của bạn.
items.armor.armor.probably_too_heavy=Có lẽ áo giáp này quá nặng với bạn.
items.armor.armor.excess_str=Bởi sức mạnh thừa của bạn, bạn _né tránh tốt hơn_ khi mặc áo giáp này.
items.armor.armor.evasion=Nó được cường hoá để nâng cao _né tránh._
items.armor.armor.defense=Nó được cường hoá để nâng cao _phòng thủ._
items.armor.armor.inscribed=nó được khắc một _%s._
items.armor.armor.glyph_hardened=Nó đã được _gia cố._
items.armor.armor.hardened_no_glyph=Bộ giáp này đã được _gia cố,_ nhưng hiện tại nó chưa được khắc lên một ký tự.
items.armor.armor.cursed_worn=Bởi vì áo giáp này bị nguyền rủa, bạn bất lực trong việc cởi nó ra.
items.armor.armor.cursed=Bạn có thể cảm thấy một phép thuật hắc ám ẩn nấp trong bộ giáp này.
items.armor.armor.weak_cursed=Bất chấp lời nguyền, bạn vẫn có thể cởi chiếc áo giáp này ra.
items.armor.armor.not_cursed=Bộ giáp này không dính phép thuật hắc ám.
items.armor.armor.seal_attached=Con dấu vỡ của Chiến binh được gắn vào bộ giáp này. Khi anh ấy sắp bị thương xuống dưới mức một nửa sinh lực tối đa, nó sẽ cho anh ấy _%d khiên chắn_.
items.armor.armor.seal_transfer=Con dấu vỡ của Chiến binh phải được gắn vào bộ giáp anh hiện đang mặc để trao hiệu ứng cho anh ấy. Bạn có muốn tự động tháo con dấu khỏi bộ giáp bạn đang bỏ ra và gắn nó vào bộ giáp bạn muốn mặc?
items.armor.armor.seal_transfer_yes=có
items.armor.armor.seal_transfer_no=không
items.armor.armor$glyph.glyph=ký tự
items.armor.armor$glyph.killed=%s đã giết bạn...
items.armor.armor$glyph.rankings_desc=Bị giết bởi một ký tự
items.armor.armor$glyph.discover_hint=Bạn có thể tìm thấy một vật phẩm với hiệu ứng này một cách ngẫu nhiên trong hầm ngục, hoặc tự mình trao nó cho một vật phẩm.

items.armor.classarmor.ac_ability=CHỌN KHẢ NĂNG
items.armor.classarmor.ac_transfer=CHUYỂN
items.armor.classarmor.no_ability=Hiện tại áo giáp của bạn không có khả năng nào, bạn nên chọn một cái!
items.armor.classarmor.not_equipped=Bạn cần phải mặc bộ giáp này để sử dụng được sức mạnh đặc biệt của nó!
items.armor.classarmor.low_charge=Bộ giáp này không có đủ năng lượng để sử dụng sức mạnh đặc biệt của nó!
items.armor.classarmor.charge_use=Sử dụng khả năng này bây giờ sẽ tiêu tốn _%s_ năng lượng.
items.armor.classarmor.transfer_title=Chuyển Giáp
items.armor.classarmor.transfer_desc=Ma thuật từ vương miện của vua người lùn có thể được chuyển đến một bộ giáp khác. Lưu ý rằng bộ giáp cũ sẽ bị phá hủy trong quá trình đó.
items.armor.classarmor.transfer_prompt=Chọn áo giáp
items.armor.classarmor.transfer_cancel=Huỷ bỏ
items.armor.classarmor.transfer_complete=Đặc tính oai hùng của bộ giáp của bạn đã được chuyển!
items.armor.classarmor.discover_hint=Bạn có thể tìm thấy vật phẩm này sau khi đánh bại trùm tầng 20 bằng một người hùng nhất định.

items.armor.clericarmor.name=phẩm phục của người hùng
items.armor.clericarmor.desc=Khi mặc trang phục kết hợp giữa vải và kim loại tấm này, Giáo sĩ có thể thực hiện một kĩ năng đặc biệt.

items.armor.clotharmor.name=áo giáp vải
items.armor.clotharmor.desc=Bộ giáp nhẹ này cung cấp sự bảo vệ cơ bản.
items.armor.clotharmor.discover_hint=Một trong những người hùng bắt đầu với vật phẩm này.

items.armor.duelistarmor.name=giáp ngực của người hùng
items.armor.duelistarmor.desc=Khi đang mặc chiếc áo giáp tấm và áo choàng không tay này, Kiếm sĩ có thể thực hiện một kĩ năng đặc biệt.

items.armor.huntressarmor.name=áo trùm đầu của người hùng
items.armor.huntressarmor.no_enemies=Không có kẻ địch trong tầm nhìn
items.armor.huntressarmor.desc=Khi mặc áo choàng này, Thợ săn có thể thực hiện một kĩ năng đặc biệt.

items.armor.leatherarmor.name=áo giáp da
items.armor.leatherarmor.desc=Áo giáp được làm từ da quái vật phơi khô. Không nhẹ như áo giáp vải nhưng cung cấp sự bảo vệ tốt hơn.

items.armor.magearmor.name=áo choàng của người hùng
items.armor.magearmor.desc=Khi mặc chiếc áo choàng lộng lẫy này, Pháp sư có thể thực hiện một kĩ năng đặc biệt.

items.armor.mailarmor.name=áo giáp xích
items.armor.mailarmor.desc=Các dây xích bằng kim loại đan vào nhau, tạo nên một bộ áo giáp cứng cáp nhưng linh hoạt.

items.armor.platearmor.name=áo giáp tấm
items.armor.platearmor.desc=Những tấm kim loại to lớn được ghép lại với nhau thành một bộ giáp cung cấp sự bảo vệ vô đối cho bất cứ nhà thám hiểm nào đủ sức để trang bị sức nặng kinh khủng của nó.

items.armor.roguearmor.name=bộ đồ của người hùng
items.armor.roguearmor.desc=Khi đang mặc bộ đồ tối màu này, Kẻ cướp có thể kĩ năng một khả năng đặc biệt.

items.armor.scalearmor.name=áo giáp vảy
items.armor.scalearmor.desc=Những chiếc vảy kim loại được may lên một chiếc áo da, tạo ra một bộ giáp linh hoạt nhưng vẫn có tính bảo vệ.

items.armor.warriorarmor.name=giáp xích tấm của người hùng
items.armor.warriorarmor.desc=Khi mặc bộ áo giáp bọc tấm nặng này, Chiến binh có thể thực hiện một kĩ năng đặc biệt.



###artifacts
items.artifacts.alchemiststoolkit.name=bộ dụng cụ của nhà giả kim
items.artifacts.alchemiststoolkit.ac_brew=PHA CHẾ
items.artifacts.alchemiststoolkit.ac_energize=NĂNG LƯỢNG HÓA
items.artifacts.alchemiststoolkit.not_ready=Bộ dụng cụ của bạn chưa làm nóng xong.
items.artifacts.alchemiststoolkit.cursed=Bộ dụng cụ bị nguyền của bạn ngăn bạn sử dụng thuật giả kim!
items.artifacts.alchemiststoolkit.need_energy=Bạn cần ít nhất 6 năng lượng cho nó
items.artifacts.alchemiststoolkit.energize_desc=Cứ mỗi 6 viên tinh thể năng lượng sẽ cung cấp đủ năng lượng cho bộ công cụ lên được một cấp, điều này sẽ tăng tỉ lệ tái tạo lại năng lượng và tốc độ ấm lên của bộ công cụ theo thời gian.\n\nBạn muốn dùng bao nhiêu năng lượng?
items.artifacts.alchemiststoolkit.energize_1=6 năng lượng: +1 cấp độ
items.artifacts.alchemiststoolkit.energize_all=%1$d năng lượng: +%2$d cấp
items.artifacts.alchemiststoolkit.desc=Bộ dụng cụ này chứa một số các loại thuốc thử và các loại thảo mộc cùng với một cái lọ pha chế nhỏ, cho phép sử dụng thuật giả kim trên đường đi. Cái lọ chứa thứ trông như là tinh thể năng lượng giả kim ở dạng lỏng.
items.artifacts.alchemiststoolkit.desc_cursed=Bộ dụng cụ đã ràng buộc chính nó với bạn, ngăn bạn sử dụng thuật giả kim.
items.artifacts.alchemiststoolkit.desc_warming=Bộ dụng cụ hiện đang được làm nóng, và sẽ sẵn sàng để được sử dụng sau một lúc ngắn.
items.artifacts.alchemiststoolkit.desc_hint=Bộ công cụ được trang bị sẽ dần tái tạo năng lượng khi bạn nhận kinh nghiệm. Có vẻ như hỗn hợp trong lọ có thể được tăng cường bằng cách thêm các tinh thể năng lượng vào trong nó.

items.artifacts.artifact.cannot_wear_two=Bạn không thể đeo 2 cổ vật cùng loại.
items.artifacts.artifact.equip_cursed=Món cổ vật trói buộc chính nó vào bạn một cách đau đớn.
items.artifacts.artifact.curse_known=Bạn có thể cảm thấy một phép thuật hắc ám ẩn nấp trong món cổ vật.
items.artifacts.artifact.not_cursed=Món cổ vật này không dính phép thuật hắc ám.
items.artifacts.artifact.need_to_equip=Bạn cần phải trang bị món cổ vật của bạn vào để làm điều đó.

items.artifacts.capeofthorns.name=tấm áo choàng gai nhọn
items.artifacts.capeofthorns.desc=Những tấm kim loại vỡ vụn từ DM-300 này đã hợp lại thành một chiếc áo choàng cứng cáp. Có vẻ nó tích trữ một năng lượng bí ẩn, có lẽ nó có một phần sức mạnh của DM-300?
items.artifacts.capeofthorns.desc_inactive=Tấm áo choàng nằm nặng nề trên vai bạn, nó trông có vẻ dang  tích lũy năng lượng từ sát thương bạn nhận.
items.artifacts.capeofthorns.desc_active=Tấm áo choàng trông có vẻ đang giải phóng nguồn năng lượng được tích trữ, nó đang tỏa ra một sức mạnh có tính bảo vệ.
items.artifacts.capeofthorns$thorns.inert=Tấm áo choàng của bạn lại trở nên trơ ra.
items.artifacts.capeofthorns$thorns.radiating=Tấm áo choàng của bạn bắt đầu tỏa ra năng lượng, bạn cảm thấy được bảo vệ!
items.artifacts.capeofthorns$thorns.levelup=Tấm áo choàng của bạn trở nên mạnh hơn!
items.artifacts.capeofthorns$thorns.name=gai
items.artifacts.capeofthorns$thorns.desc=Tấm áo choàng của bạn đang tỏa ra năng lượng, bao bọc bạn trong một trường lực có tính phản lại!\n\nTất cả sát thương bạn nhận được giảm lại khi hiệu ứng gai đang kích hoạt. Ngoài ra, nếu kẻ tấn công ở cạnh bạn, số sát thương bị giảm sẽ được phản lại vào kẻ tấn công.\n\nLượt gai còn lại: %s.

items.artifacts.chaliceofblood.name=chén máu thánh
items.artifacts.chaliceofblood.ac_prick=ĐÂM
items.artifacts.chaliceofblood.yes=Có, tôi biết tôi đang làm gì
items.artifacts.chaliceofblood.no=Không, tôi đổi ý rồi
items.artifacts.chaliceofblood.prick_warn=Mỗi lần bạn dùng chiếc chén thánh nó sẽ hút nhiều năng lượng sống của bạn hơn, nhưng đổi lại sẽ tăng cường sự hồi phục sinh lực tự nhiên của bạn. \n\nHiện tại, tự đâm bản thân sẽ gây _%1$d-%2$d sát thương_, tuy nhiên sát thương này có thể được giảm bởi _cả hiệu ứng chặn sát thương vật lí và phép thuật hoặc giảm sát thương._ Nếu không tính các hiệu ứng giảm sát thương, tự đâm bản thân hiện tại có _%3$s%%_ khả năng sẽ hút cạn sức sống của bạn.\n\nBạn có chắc bạn muốn hiến cho chiếc chén thánh thêm năng lượng sống?
items.artifacts.chaliceofblood.onprick=Bạn đâm chính mình, và năng lượng sống của bạn bị hút vào chiếc chén thánh.
items.artifacts.chaliceofblood.ondeath=Chiếc chén thánh hút cạn năng lượng sống của bạn ...
items.artifacts.chaliceofblood.desc=Chiếc chén thánh bằng bạc sáng bóng này được trang trí một cách kì lạ với những viên đá quý sắc nhọn ở vành.
items.artifacts.chaliceofblood.desc_cursed=Chiếc chén thánh bị nguyền đã ràng buộc chính nó vào bàn tay bạn, và đang ức chế khả năng hồi phục sinh lực của bạn.
items.artifacts.chaliceofblood.desc_1=Khi bạn cầm chiếc chén thánh, bạn cảm thấy bị bắt buộc một cách kì lạ, rằng bạn phải đâm những viên đá quý sắc nhọn vào chính mình.
items.artifacts.chaliceofblood.desc_2=Một chút máu của bạn được thu vào trong chiếc chén thánh, bạn có thể nhẹ nhàng cảm nhận được chiếc chén thánh đang truyền năng lượng sống vào trong bạn, tăng cường sự hồi phục sinh lực tự nhiên của bạn. Bạn vẫn muốn cắt chính mình trên chiếc chén thánh, mặc dù bạn biết nó sẽ đau.
items.artifacts.chaliceofblood.desc_3=Chiếc chén thánh được làm đầy đến miệng bằng năng lượng sống của bạn. Bạn có thể cảm thấy chiếc chén thánh đổ ngược năng lượng sống lại vào trong bạn.

items.artifacts.cloakofshadows.name=áo choàng bóng tối
items.artifacts.cloakofshadows.ac_stealth=TÀNG HÌNH
items.artifacts.cloakofshadows.cooldown=Áo choàng của bạn cần %d lượt nữa để nạp lại năng lượng.
items.artifacts.cloakofshadows.cursed=Bạn không thể sử dụng một cái áo choàng bị nguyền rủa.
items.artifacts.cloakofshadows.no_charge=Áo choàng của bạn chưa hồi đủ năng lượng để có thể sử dụng được.
items.artifacts.cloakofshadows.desc=Một chiếc áo choàng thần kì vô giá, được lấy trộm từ kho vũ khí hoàng gia nhiều năm trước bởi Kẻ cướp. Khi được mặc, nó có thể được dùng để trở nên hoàn toàn vô hình trong một khoảng thời gian ngắn.\n\nCái áo choàng này càng được sử dụng nhiều, nó sẽ càng mạnh hơn, cho phép Kẻ cướp trở nên vô hình thường xuyên hơn và lâu hơn.
items.artifacts.cloakofshadows.discover_hint=Một trong các người hùng bắt đầu với vật phẩm này.
items.artifacts.cloakofshadows$cloakstealth.no_charge=Áo choàng của bạn đã hết năng lượng.
items.artifacts.cloakofshadows$cloakstealth.levelup=Áo choàng của bạn trở nên mạnh hơn!
items.artifacts.cloakofshadows$cloakstealth.name=Được bao phủ
items.artifacts.cloakofshadows$cloakstealth.desc=Áo choàng bóng tối của bạn đang cho bạn khả năng tàng hình trong khi đang khoác nó lên mình. Bạn vẫn sẽ tiếp tục được mặc nó cho đến khi hành động bị hủy hoặc áo choàng của bạn hết năng lượng.\n\nTrong khi tàng hình, kẻ địch sẽ không tấn công hay đi theo bạn. Việc tấn công vật lí và hiệu ứng phép thuật (như là từ các cuộn giấy và đũa phép) sẽ lập tức hủy khả năng tàng hình.\n\nLượt còn lại trước khi hết một năng lượng: %d.

items.artifacts.driedrose.name=hoa hồng khô
items.artifacts.driedrose.ac_summon=TRIỆU HỒI
items.artifacts.driedrose.ac_direct=CHỈ ĐỊNH
items.artifacts.driedrose.ac_outfit=TRANG BỊ
items.artifacts.driedrose.spawned=Bạn đã triệu hồi hồn ma rồi.
items.artifacts.driedrose.no_charge=Bông hoa của bạn chưa được sạc đầy.
items.artifacts.driedrose.cursed=Bạn không thể sử dụng một bông hoa hồng bị nguyền rủa.
items.artifacts.driedrose.no_space=Không có khoảng trống gần bạn.
items.artifacts.driedrose.charged=Bông hoa của bạn đã được sạc đầy!
items.artifacts.driedrose.desc=Đây có phải là bông hoa hồng mà hồn ma đã nhắc đến trước khi biến mất không? Nó dường như ẩn chứa một chút sức mạnh tâm linh, có lẽ nó có thể được sử dụng để truyền năng lượng của người chiến binh quá cố đó.
items.artifacts.driedrose.desc_no_quest=Một bông hoa hồng khô, già, bằng một cách nào đó vẫn giữ được hình dạng bất chấp tuổi của nó.\n\nNó trông có vẻ có một chút sức mạnh tâm linh, nhưng bây giờ bạn chưa biết làm cách nào để sử dụng nó.
items.artifacts.driedrose.desc_hint=Nó trông có vẻ bị mất một vài cánh hoa. Có lẽ việc gắn lại chúng vào sẽ tăng sức mạnh của bông hoa hồng.
items.artifacts.driedrose.desc_cursed=Bông hoa hồng bị nguyền bám vào tay bạn, nó lạnh một cánh kì lạ.
items.artifacts.driedrose.desc_weapon=Vũ khí của hồn ma: %s
items.artifacts.driedrose.desc_armor=Áo giáp của hồn ma: %s
items.artifacts.driedrose.desc_strength=Sức mạnh của hồn ma: %s
items.artifacts.driedrose$petal.name=cánh hoa khô
items.artifacts.driedrose$petal.no_rose=Bạn không có bông hoa hồng nào để gắn cái cánh hoa này vào.
items.artifacts.driedrose$petal.no_room=Không còn chỗ cho cánh hoa này, nên bạn bỏ nó đi.
items.artifacts.driedrose$petal.maxlevel=Bông hoa hồng đã hoàn chỉnh!
items.artifacts.driedrose$petal.levelup=Bạn gắn thêm cánh hoa vào bông hoa hồng.
items.artifacts.driedrose$petal.desc=Một cành hoa khô yếu ớt, bằng cách nào đó đã sống sót để đi xa thế này vào trong ngục tối.
items.artifacts.driedrose$wndghosthero.title=Trang bị của hồn ma
items.artifacts.driedrose$wndghosthero.desc=Bản thân hồn ma thì yếu, nhưng kết cấu của nó đủ vững chắc để được trang bị một món vũ khí và áo giáp. Nó sẽ có thể sử dụng những vật phẩm đó giống như bạn.\n\nHồn ma hiện tại có thể trang bị các vật phẩm cần tới _%d sức mạnh._
items.artifacts.driedrose$wndghosthero.weapon_prompt=Chọn một món vũ khí
items.artifacts.driedrose$wndghosthero.armor_prompt=Chọn một bộ giáp
items.artifacts.driedrose$wndghosthero.cant_unique=Hồn ma không thể sử dụng các vật phẩm đặc biệt.
items.artifacts.driedrose$wndghosthero.cant_cursed=Hồn ma chỉ có thể sử dụng trang bị mà bạn chắc chắn rằng là không bị nguyền.
items.artifacts.driedrose$wndghosthero.cant_strength_unknown=Có thể hồn ma không đủ mạnh để sử dụng cái đó.
items.artifacts.driedrose$wndghosthero.cant_strength=Hồn ma không đủ mạnh để sử dụng cái đó.

##ghost hero
items.artifacts.driedrose$ghosthero.name=hồn ma buồn
items.artifacts.driedrose$ghosthero.def_verb=né
items.artifacts.driedrose$ghosthero.discover_hint=Bạn có thể tìm thấy nhân vật này bằng một cổ vật nhất định.

items.artifacts.driedrose$ghosthero.hello=Xin chào lần nữa %s.
items.artifacts.driedrose$ghosthero.introduce=Linh hồn của tôi được gắn liền với bông hoa hồng này, nó rất quan trọng với tôi, món quà từ tình yêu của tôi - người mà tôi đã bỏ lại trên mặt đất.\n\nTôi không thể trở lại với anh ấy, nhưng nhờ có bạn mà tôi có một cơ hội thứ hai để hoàn thành hành trình của mình. Khi có thể, tôi sẽ đáp lại lời gọi của bạn và chiến đấu cùng bạn. \n\nMiễn là bạn còn có bông hoa hồng thì tôi có thể nghe thấy tiếng nói của bạn, vậy nên bạn có thể dùng nó để chỉ dẫn tôi từ xa. \n\nHi vọng bạn sẽ thành công nơi tôi đã thất bại...

items.artifacts.driedrose$ghosthero.dialogue_sewers_1=Những cái cống này đã từng an toàn, mọi người còn từng sống ở đây vào mùa đông.
items.artifacts.driedrose$ghosthero.dialogue_sewers_2=Tôi tự hỏi chuyện gì đã xảy ra với những người bảo vệ tuần tra, họ đã từ bỏ rồi ư?
items.artifacts.driedrose$ghosthero.dialogue_sewers_3=Tôi đã có gia đình ở trên mặt đất, tôi hy vọng họ an toàn.
items.artifacts.driedrose$ghosthero.dialogue_sewers_4=Những người bảo vệ đã không thể đánh bại những con quái vật này, nhưng có lẽ chúng ta có thể.
items.artifacts.driedrose$ghosthero.dialogue_sewers_5=Nếu chỉ những cái cống đã nguy hiểm thế này, tôi tự hỏi ở dưới có gì...
items.artifacts.driedrose$ghosthero.dialogue_sewers_6=Cái gì đã có thể làm cho những con chuột và cua này phát triển lớn đến vậy?
items.artifacts.driedrose$ghosthero.dialogue_prison_1=Tôi đã được nghe những câu chuyện về nơi này rồi, không có gì tốt đẹp cả.
items.artifacts.driedrose$ghosthero.dialogue_prison_2=Nơi này đã luôn giống như một hầm ngục hơn một nhà tù.
items.artifacts.driedrose$ghosthero.dialogue_prison_3=Tôi không thể tưởng tượng nổi chuyện gì đã xảy ra khi nơi này bị bỏ hoang.
items.artifacts.driedrose$ghosthero.dialogue_prison_4=Có vẻ cả các tù nhân và các cai ngục đã bị biến thành quái vật.
items.artifacts.driedrose$ghosthero.dialogue_prison_5=Cái gì có thể chịu trách nhiệm cho tất cả bộ xương này vậy?
items.artifacts.driedrose$ghosthero.dialogue_prison_6=Những người này đã không phải kết thúc như thế này...
items.artifacts.driedrose$ghosthero.dialogue_caves_1=Đã lâu lắm rồi không có con người hay người lùn nào đến đây.
items.artifacts.driedrose$ghosthero.dialogue_caves_2=Cái gì đã làm những người lùn bỏ hoang một mỏ vàng như vậy?
items.artifacts.driedrose$ghosthero.dialogue_caves_3=Thật đáng tiếc là tất cả số vàng này đều vô dụng trên mặt đất.
items.artifacts.driedrose$ghosthero.dialogue_caves_4=Các sinh vật ở đây đã bị biến dạng, giống như ở trong cống.
items.artifacts.driedrose$ghosthero.dialogue_caves_5=Kể cả những con dơi cũng khát máu ở đây.
items.artifacts.driedrose$ghosthero.dialogue_caves_6=Không có dấu hiệu của bất kỳ trang thiết bị đào mỏ nào, có phải là những người lùn đã lấy lại tất cả chúng không?
items.artifacts.driedrose$ghosthero.dialogue_city_1=Những người lùn đã rất siêng năng, nhưng tham lam.
items.artifacts.driedrose$ghosthero.dialogue_city_2=Vậy là đô thị của những người lùn thật sự đã sụp đổ.
items.artifacts.driedrose$ghosthero.dialogue_city_3=Tôi hi vọng trên mặt đất sẽ không bao giờ bị như thế này.
items.artifacts.driedrose$ghosthero.dialogue_city_4=Những người lùn đáng ra không trông nhợt nhạt như vậy.
items.artifacts.driedrose$ghosthero.dialogue_city_5=Tôi không biết cái gì tồi tệ hơn, những người lùn hay những thứ họ đã tạo ra.
items.artifacts.driedrose$ghosthero.dialogue_city_6=Trông có vẻ những người lùn giờ đây cũng là những con quái vật mất trí.
items.artifacts.driedrose$ghosthero.dialogue_halls_1=Nơi này là gì vậy?
items.artifacts.driedrose$ghosthero.dialogue_halls_2=Nơi này thật đáng sợ...
items.artifacts.driedrose$ghosthero.dialogue_halls_3=Những người lùn đã nghĩ gì vậy, chơi đùa với sức mạnh như thế này ư?
items.artifacts.driedrose$ghosthero.dialogue_halls_4=Những con quái vật ở đây không thuộc về nơi này, chúng đã đến từ đâu vậy?
items.artifacts.driedrose$ghosthero.dialogue_halls_5=Bạn có cảm thấy nó không? Giống như là có cái gì đó đang theo dõi chúng ta.
items.artifacts.driedrose$ghosthero.dialogue_halls_6=Ơn trời ở đây có những cây đuốc, dưới này tối quá!
items.artifacts.driedrose$ghosthero.dialogue_ascension_1=Tại sao điều này lại xảy ra, tôi tưởng chúng ta đã thành công?
items.artifacts.driedrose$ghosthero.dialogue_ascension_2=Làm sao thứ đó vẫn còn có thể thao túng thế giới này?
items.artifacts.driedrose$ghosthero.dialogue_ascension_3=Tôi hi vọng bạn biết bạn đang làm gì với chiếc bùa đó.
items.artifacts.driedrose$ghosthero.dialogue_ascension_4=Tôi nghĩ là chúng ta vẫn chưa xong đâu.
items.artifacts.driedrose$ghosthero.dialogue_ascension_5=Quá xa để quay đầu rồi, chúng ta phải kết thúc nó!
items.artifacts.driedrose$ghosthero.dialogue_ascension_6=Một chút nữa thôi, chúng ta sẽ có thể thoát khỏi đây!

items.artifacts.driedrose$ghosthero.seen_goo_1=Hãy coi chừng Goo!
items.artifacts.driedrose$ghosthero.seen_goo_2=Nhiều người bạn của tôi đã chết vì thứ này rồi, đã đến lúc báo thù!
items.artifacts.driedrose$ghosthero.seen_goo_3=Một thứ ghê tởm như vậy không thể được phép tồn tại!
items.artifacts.driedrose$ghosthero.seen_tengu_1=Tên tù nhân còn lại chính là một tên sát thủ chết người. Tất nhiên rồi...
items.artifacts.driedrose$ghosthero.seen_tengu_2=Hắn đã bẫy chúng ta!
items.artifacts.driedrose$ghosthero.seen_tengu_3=Tôi đã nghe những câu chuyện kinh dị về cái mặt nạ đó...
items.artifacts.driedrose$ghosthero.seen_dm300_1=Chỉ có những người lùn mới xây một cỗ máy khai thác mỏ mà giết tất cả kẻ xâm nhập.
items.artifacts.driedrose$ghosthero.seen_dm300_2=Thứ đó thật khổng lồ...
items.artifacts.driedrose$ghosthero.seen_dm300_3=Làm thế nào mà thứ này vẫn con hoạt động trong thời gian lâu như vậy?
items.artifacts.driedrose$ghosthero.seen_king_1=Khi mọi người nói đến sức mạnh tha hóa, ý họ là như thế này.
items.artifacts.driedrose$ghosthero.seen_king_2=Giờ thì hắn ta giống như một kẻ gọi hồn hơn là một vị vua.
items.artifacts.driedrose$ghosthero.seen_king_3=Kể cả khi đã chết, những người lùn vẫn tuân theo chủ nhân của chúng.
items.artifacts.driedrose$ghosthero.seen_yog_1=Ồ, cái này nhìn có vẻ không ổn.
items.artifacts.driedrose$ghosthero.seen_yog_2=Ra là một vị thần nhìn trông như thế kia sao?
items.artifacts.driedrose$ghosthero.seen_yog_3=Việc này sẽ đau đấy...

items.artifacts.driedrose$ghosthero.defeated_by_enemy_1=Chúc may mắn...
items.artifacts.driedrose$ghosthero.defeated_by_enemy_2=Mệt... bây giờ thôi...
items.artifacts.driedrose$ghosthero.defeated_by_enemy_3=Tôi sẽ trở lại...
items.artifacts.driedrose$ghosthero.defeated_by_boss_1=Tôi xin lỗi ... chúc may mắn ...
items.artifacts.driedrose$ghosthero.defeated_by_boss_2=Kết liễu nó đi... mà không có tôi...
items.artifacts.driedrose$ghosthero.defeated_by_boss_3=Không... Tôi không thể...
items.artifacts.driedrose$ghosthero.blessed_ankh_1=Làm thế nào mà bạn sống sót được sau cái đó vậy?
items.artifacts.driedrose$ghosthero.blessed_ankh_2=Ước gì lúc đó tôi có một cái như thế...
items.artifacts.driedrose$ghosthero.blessed_ankh_3=Ôi trời! Bạn vẫn còn sống!
items.artifacts.driedrose$ghosthero.player_killed_1=Không!...
items.artifacts.driedrose$ghosthero.player_killed_2=Tôi đã không thể giúp họ...
