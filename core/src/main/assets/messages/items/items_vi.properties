items.weapon.melee.quarterstaff$defensivestance.desc=Kiếm sĩ đang sử dụng trường côn của cô để làm chệch hướng các đòn tấn công và vật phóng lao tới.. Miễn là cô ấy ở trong thế đứng này, độ né tránh của cô đối với tất cả các đòn tấn công được tăng gấp ba lần.\n\nLượt còn lại: %s.

