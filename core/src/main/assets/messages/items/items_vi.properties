items.weapon.melee.magesstaff.name=gậy phép của pháp sư
items.weapon.melee.magesstaff.ac_imbue=GHÉP
items.weapon.melee.magesstaff.ac_zap=BẮN
items.weapon.melee.magesstaff.prompt=Chọn một cây đũa phép
items.weapon.melee.magesstaff.imbue=Bạn kết hợp cây gậy phép của bạn với cây %s.
items.weapon.melee.magesstaff.preserved=Cây đũa phép trước đã được giữ lại!
items.weapon.melee.magesstaff.imbue_desc=Bạn có chắc muốn kết hợp gậy phép của bạn với cây đũa phép này?\n\nNếu cây đũa phép đang được kết hợp có cấp độ bằng hoặc cao hơn gậy phép, cây gậy phép sẽ thừa hưởng cấp độ của cây đũa phép đó cộng thêm một trong tổng các nâng cấp của chính nó.
items.weapon.melee.magesstaff.imbue_level=Sự kết hợp này sẽ tạo ra một cây _gậy phép +%d._
items.weapon.melee.magesstaff.imbue_unknown=Bạn không biết cấp độ của cây đũa phép này, nhưng sự kết hợp này sẽ tối thiểu tạo ra một cây _gậy phép +%d._
items.weapon.melee.magesstaff.imbue_cursed=_Nếu bạn kết hợp một cây đũa phép bị nguyền rủa thì gậy phép của bạn cũng sẽ trở thành bị nguyền!_
items.weapon.melee.magesstaff.imbue_lost=Cây đũa phép hiện đang được kết hợp vào gậy phép của bạn _sẽ bị mất_.
items.weapon.melee.magesstaff.imbue_talent=Cây đũa phép hiện đang được kết hợp vào gậy phép của bạn _sẽ được hoàn trả ở +0_.
items.weapon.melee.magesstaff.yes=Vâng, tôi chắc chắn.
items.weapon.melee.magesstaff.no=Không, tôi đổi ý rồi
items.weapon.melee.magesstaff.desc=Được tạo ra bởi chính Pháp sư, cây gậy phép này là một vũ khí phép thuật đặc biệt, nó có thể được ghép với một cây đũa phép.
items.weapon.melee.magesstaff.no_wand=Cây gậy phép hiện tại không có chút phép thuật nào trong nó, nó phải được _lấp đầy với sức mạnh của một cây đũa phép_ trước khi nó có thể được dùng để sử dụng phép thuật.
items.weapon.melee.magesstaff.has_wand=Cây gậy phép hiện được kết hợp với một _%s._
items.weapon.melee.magesstaff.cursed_wand=Cây gậy phép này bị nguyền, khiến cho phép thuật của nó hỗn loạn và ngẫu nhiên.
items.weapon.melee.magesstaff.discover_hint=Một trong những người hùng bắt đầu với vật phẩm này.

