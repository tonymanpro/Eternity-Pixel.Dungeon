items.artifacts.driedrose$ghosthero.desc=Một thực thể yếu ớt, mờ nhạt với hình dạng giống người. Sức mạnh của nó có vẻ được gắn liền với bông hoa hồng mà bạn có.\n\nTuy hồn ma này có thể không giúp ích gì nhiều cho bạn, có vẻ nó là người bạn thực sự duy nhất của bạn ở dưới này.

