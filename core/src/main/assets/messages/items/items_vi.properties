items.weapon.melee.roundshield.name=khiên tròn
items.weapon.melee.roundshield.typical_stats_desc=Vũ khí này thông thường sẽ đỡ 0-%d sát thương. Mức độ đỡ đòn tỉ lệ thuận với số lượng nâng cấp.
items.weapon.melee.roundshield.stats_desc=Vũ khí này sẽ đỡ 0-%d sát thương. Mức độ đỡ đòn tỉ lệ thuận với số lượng nâng cấp.
items.weapon.melee.roundshield.ability_name=phòng thủ
items.weapon.melee.roundshield.typical_ability_desc=Kiếm sĩ có thể _bảo vệ_ chính mình bằng một chiếc khiên tròn, vô hiệu hoàn toàn tất cả sát thương vật lí hoặc phép thuật nhắm vào cô ấy, thường là trong _%d lượt_. Một khi Kiếm sĩ đã chặn một đòn tấn công, tấn công ngược lại hoặc sử dụng phép thuật sẽ kết thúc bảo vệ.
items.weapon.melee.roundshield.ability_desc=Kiếm sĩ có thể _bảo vệ_ chính mình bằng một chiếc khiên tròn, vô hiệu hoàn toàn tất cả sát thương vật lí hoặc phép thuật nhắm vào cô ấy trong _%d lượt_. Một khi Kiếm sĩ đã chặn một đòn tấn công, tấn công ngược lại hoặc sử dụng phép thuật sẽ kết thúc bảo vệ.
items.weapon.melee.roundshield.upgrade_ability_stat_name=Thời lượng kĩ năng
items.weapon.melee.roundshield.desc=Chiếc khiên lớn này chặn các đòn tấn công một cách hiệu quả và là một vũ khí tạm ổn nếu cần thiết.
items.weapon.melee.roundshield$guardtracker.name=phòng thủ
items.weapon.melee.roundshield$guardtracker.guarded=phòng thủ
items.weapon.melee.roundshield$guardtracker.desc=Kiếm sĩ đã chuẩn bị chiếc khiên của mình để sẵn sàng cho các đòn tấn công sắp tới. Các đòn tấn công vật lý hoặc phép thuật nhắm vào cô ấy sẽ bị vô hiệu hoàn toàn.\n\nLượt còn lại: %s.

items.weapon.melee.runicblade.name=kiếm rune
items.weapon.melee.runicblade.stats_desc=Vũ khí này được lợi nhiều hơn từ nâng cấp.
