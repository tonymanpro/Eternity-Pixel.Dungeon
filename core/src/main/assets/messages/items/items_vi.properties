items.weapon.melee.katana.ability_name=đột kích
items.weapon.melee.katana.typical_ability_desc=Kiếm sĩ có thể _đột kích_ một kẻ địch ở cách 1 ô với một thanh katana. Đòn tấn công này khiến cô ấy di chuyển về phía kẻ dịch, thường gây _%1$d-%2$d sát thương_, và chắc chắn sẽ trúng.
items.weapon.melee.katana.ability_desc=Kiếm sĩ có thể _đột kích_ một kẻ địch ở cách 1 ô với một thanh katana. Đòn tấn công này khiến cô ấy di chuyển về phía kẻ dịch, gây _%1$d-%2$d sát thương_, và chắc chắn sẽ trúng.
