items.potions.potion.bistre=pozione fuliggine
items.potions.potion.indigo=pozione indaco
items.potions.potion.silver=pozione argento
items.potions.potion.unknown_desc=Questa boccetta contiene un vorticoso liquido colorato. Chissà cosa farà una volta bevuta o lanciata?
items.potions.potion.harmful=Pozione dannosa!
items.potions.potion.beneficial=Pozione benefica
items.potions.potion.yes=Sì, so quel che sto facendo
items.potions.potion.no=No, ho cambiato idea
items.potions.potion.sure_drink=Sei sicuro di volerla bere? Nella maggior parte dei casi dovresti lanciare questa pozione ai tuoi nemici.
items.potions.potion.sure_throw=Sei sicuro di volerla lanciare? Nella maggior parte dei casi avrebbe più senso berla.
items.potions.potion.shatter=La boccetta si frantuma e il liquido si sparge senza fare danno.
items.potions.potion.discover_hint=Puoi trovare questo oggetto casualmente nel dungeon, o crearlo tramite l'alchimia.
items.potions.potion$placeholder.name=pozione
items.potions.potion$seedtopotion.name=Pozione Casuale

items.potions.potionofexperience.name=pozione dell'esperienza
items.potions.potionofexperience.desc=La leggendaria esperienza di una moltitudine di battaglie ridotta in forma liquida. Questo distillato incrementerà istantaneamente il tuo livello di esperienza.

items.potions.potionoffrost.name=pozione del congelamento
items.potions.potionoffrost.desc=La sostanza chimica contenuta in questa pozione evaporerà in una nube congelante non appena esposta all'aria aperta.

items.potions.potionofhaste.name=pozione di fretta
items.potions.potionofhaste.energetic=Sprizzi energia da tutti i pori!
items.potions.potionofhaste.desc=Bere questo liquido curiosamente dolce ti irradierà di una eccezionale energia per un breve periodo, permettendoti di correre ad alte velocità.

items.potions.potionofhealing.name=pozione della guarigione
items.potions.potionofhealing.heal=Le tue ferite cominciano a chiudersi.
items.potions.potionofhealing.desc=Questo elisir ripristinerà rapidamente la tua salute, curando istantaneamente molti disturbi.

items.potions.potionofinvisibility.name=pozione dell'invisibilità
items.potions.potionofinvisibility.invisible=Vedi le tue mani diventare invisibili!
items.potions.potionofinvisibility.desc=Bere questa pozione ti renderà temporaneamente invisibile. Mentre sei invisibile, i nemici non saranno in grado di vederti. Gli attacchi fisici e gli effetti magici (come le pergamene e le bacchette) annulleranno immediatamente l'invisibilità.

items.potions.potionoflevitation.name=pozione della levitazione
items.potions.potionoflevitation.float=Stai volando a mezz'aria!
items.potions.potionoflevitation.desc=Bere questo liquido curioso avrà l'effetto di farti librare in aria, capace di evitare senza pericoli trappole e buche. Lanciare questa pozione creerà una nube di gas grezzo, disorientando chiunque ne venga catturato.

items.potions.potionofliquidflame.name=pozione del fuoco liquido
items.potions.potionofliquidflame.desc=La boccetta contiene un componente instabile che arderà con vampate violente se esposta all'aria.

items.potions.potionofmindvision.name=pozione di visione mentale
items.potions.potionofmindvision.see_mobs=Riesci in un qualche modo a sentire la presenza delle menti delle altre creature!
items.potions.potionofmindvision.see_none=Puoi in qualche modo sentire che al momento su questo piano sei solo.
items.potions.potionofmindvision.desc=Dopo aver bevuto questa pozione, la tua mente si sintonizzerà sulla frequenza psichica di creature lontane, permettendoti di sentirne la presenza biologica attraverso le pareti. Ti permetterà anche di vedere attraverso muri e porte vicine.

items.potions.potionofparalyticgas.name=pozione del gas paralizzante
items.potions.potionofparalyticgas.desc=In seguito all'esposizione all'aria aperta, il liquido contenuto si vaporizzerà creando un'ipnotica foschia gialla. Chiunque la respiri sarà paralizzato all'istante, incapace di muoversi per un po' di tempo dopo che il gas si sarà diradato. Questo oggetto può essere lanciato verso nemici distanti per intrappolarli nell'effetto del gas.

items.potions.potionofpurity.name=pozione di purificazione
items.potions.potionofpurity.freshness=Avverti un'inconsueta freschezza nell'aria.
items.potions.potionofpurity.protected=Una membrana protettiva ti avvolge!
items.potions.potionofpurity.desc=Questo reagente magico neutralizzerà velocemente tutti gli effetti dannosi locali in una vasta area. Berlo invece garantirà un'immunità temporanea da questi effetti.

items.potions.potionofstrength.name=pozione di forza
items.potions.potionofstrength.msg=Nuova forza si sprigiona nel tuo corpo, ora hai %d di forza!
items.potions.potionofstrength.desc=Questo potente liquido scorrerà nei tuoi muscoli, aumentando permanentemente la tua forza di un punto.

items.potions.potionoftoxicgas.name=pozione di gas tossico
items.potions.potionoftoxicgas.desc=Stappare o frantumare questa ampolla pressurizzata provocherà un'esplosione, creando una nube letale di gas tossico verde. Potresti scegliere di scagliare questa pozione verso nemici distanti invece di stapparla a mano.



###brews
items.potions.brews.brew.discover_hint=Puoi creare questo oggetto tramite l'alchimia.

items.potions.brews.aquabrew.name=infuso d'acqua
items.potions.brews.aquabrew.desc=Una volta frantumata, questa miscela rilascerà un getto di acqua pressurizzata nella sua posizione. È abbastanza potente da danneggiare nemici infuocati, ma sparge anche acqua sul terreno vicino, disabilita trappole, spegne gli incendi e respinge i personaggi vicini all'esplosione.

items.potions.brews.blizzardbrew.name=miscela bufera
items.potions.brews.blizzardbrew.desc=Quando frantumata, questa miscela scatenerà una turbinante bufera che si espande come un gas.

items.potions.brews.causticbrew.name=miscela caustica
items.potions.brews.causticbrew.desc=Questa miscela spargerà della melma corrosiva in un'ampia area intorno al luogo in cui viene frantumata. Ogni cosa raggiunta dalla melma si scioglierà lentamente se non verrà lavata con l'acqua.

items.potions.brews.infernalbrew.name=miscela infernale
items.potions.brews.infernalbrew.desc=Quando frantumata, questa miscela scatenerà un roboante inferno di fiamme che si espande come un gas.

items.potions.brews.shockingbrew.name=miscela fulminante
items.potions.brews.shockingbrew.desc=Quando frantumata, questa miscela scatenerà una tempesta elettrica in un'ampia area circostante al luogo della sua rottura.

items.potions.brews.unstablebrew.name=pozione instabile
items.potions.brews.unstablebrew.desc=Questa miscela magica brilla dei colori cangianti dell'arcobaleno.\n\nQuando bevuto o lanciato attiverà l'effetto di una pozione casuale. L'effetto della pozione sarà sempre benefico se viene bevuta, e sarà sempre dannoso se viene lanciata.

###elixirs
items.potions.elixirs.elixir.discover_hint=Puoi creare questo oggetto tramite l'alchimia.

items.potions.elixirs.elixirofarcanearmor.name=elisir dell'armatura arcana
items.potions.elixirs.elixirofarcanearmor.desc=questo elisir donerà al suo bevitore una durevole resistenza agli attacchi magici.

items.potions.elixirs.elixirofaquaticrejuvenation.name=elisir del rinvigorimento acquatico
items.potions.elixirs.elixirofaquaticrejuvenation.desc=Questo elisir contiene le spoglie di Goo, potenziate con una pozione di guarigione. Sebbene non fornisca una guarigione immediata, ripristinerà costantemente una superiore quantità di salute mentre resti in acqua.
items.potions.elixirs.elixirofaquaticrejuvenation$aquahealing.name=guarigione acquatica
items.potions.elixirs.elixirofaquaticrejuvenation$aquahealing.desc=Hai temporaneamente ottenuto proprietà di ripristino simili a quelle di Goo.\n\nMentre sei in acqua, recupererai una piccola quantità di salute ogni turno. L'effetto verrà sospeso quando sei in piena salute o fuori dall'acqua.\n\nTurni rimanenti: %d.

items.potions.elixirs.elixirofdragonsblood.name=elisir del sangue di drago
items.potions.elixirs.elixirofdragonsblood.desc=Quando tracannato, questo elisir irradierà un impetuoso potere nelle vene del suo bevitore. Questo effetto renderà il bevitore immune al fuoco e gli consentirà di incendiare i nemici tramite l'uso degli attacchi fisici.

items.potions.elixirs.elixiroffeatherfall.name=elisir della caduta delle piume
items.potions.elixirs.elixiroffeatherfall.light=Ti senti leggero come una piuma!
items.potions.elixirs.elixiroffeatherfall.desc=Questo elisir offre un effetto di levitazione più debole ma più controllato, consentendo a chi lo beve di cadere da grandi distanze senza danni per un po'.
items.potions.elixirs.elixiroffeatherfall$featherbuff.name=caduta piumata
items.potions.elixirs.elixiroffeatherfall$featherbuff.desc=Sei sotto l'effetto di un elisir Caduta di piume, che ti permette di cadere negli abissi senza subire danni!\n\nTurni rimanenti: %s.

items.potions.elixirs.elixirofhoneyedhealing.name=elisir della guarigione melliflua
items.potions.elixirs.elixirofhoneyedhealing.desc=Questo elisir combina la guarigione con la dolcezza del miele. Una volta bevuta, applicherà lo stesso effetto di una pozione curativa e soddisferà una piccola quantità di fame, ma può anche essere lanciata per curare un alleato.\n\nLe creature con affinità per il miele potrebbero essere pacificate se questo oggetto viene utilizzato su di loro.

items.potions.elixirs.elixiroficytouch.name=elisir del tocco gelido
items.potions.elixirs.elixiroficytouch.desc=Quando tracannato, questo elisir permetterà al bevitore di sottrarre calore dai nemici bersagliati. Questo effetto renderà il bevitore immune al freddo e gli consentirà di raffreddare i nemici per mezzo degli attacchi fisici.

items.potions.elixirs.elixirofmight.name=elisir della potenza
items.potions.elixirs.elixirofmight.msg=Nuova forza si sprigiona nel tuo corpo, ora hai %d di forza!
items.potions.elixirs.elixirofmight.desc=Questo potente liquido scorrerà nei tuoi muscoli, aumentando in modo permanente la tua forza di un punto e la salute massima temporaneamente di %d punti. L'aumento di salute cresce gradualmente con l'aumentare della salute massima, ma svanisce lentamente con l'aumento di livello.
items.potions.elixirs.elixirofmight$htboost.name=incremento salute massima
items.potions.elixirs.elixirofmight$htboost.desc=Senti il tuo corpo innaturalmente forte e in salute.\n\nLa tua salute massima è incrementata per un periodo esteso. Al progresso dnei livelli d'esperienza, l'incremento si attenuerà di conseguenza.\n\nIncremento attuale: %d.\nLivelli rimanenti: %d.

items.potions.elixirs.elixiroftoxicessence.name=elisir dell'essenza tossica
items.potions.elixirs.elixiroftoxicessence.desc=Una volta consumato, questo elisir infonderà a chi lo beve energia tossica. Il bevitore diffonderà continuamente gas tossico mentre si muove e sarà immune al gas tossico e al veleno per un periodo leggermente più lungo della durata dell'effetto.



###exotic potions
items.potions.exotic.exoticpotion.turquoise=pozione turchese esotica
items.potions.exotic.exoticpotion.crimson=pozione cremisi esotica
items.potions.exotic.exoticpotion.azure=pozione azzurra esotica
items.potions.exotic.exoticpotion.jade=pozione giada esotica
items.potions.exotic.exoticpotion.golden=pozione dorata esotica
items.potions.exotic.exoticpotion.magenta=pozione magenta esotica
items.potions.exotic.exoticpotion.charcoal=pozione antracite esotica
items.potions.exotic.exoticpotion.ivory=pozione avorio esotica
items.potions.exotic.exoticpotion.amber=pozione ambrata esotica
items.potions.exotic.exoticpotion.bistre=pozione fuliggine esotica
items.potions.exotic.exoticpotion.indigo=pozione indaco esotica
items.potions.exotic.exoticpotion.silver=pozione argento esotica
items.potions.exotic.exoticpotion.unknown_desc=Questa boccetta tondeggiante contiene un granuloso liquido colorato. Pare provenga da una terra straniera, chissà che effetto potrebbe avere una volta bevuta o lanciata?
items.potions.exotic.exoticpotion.warning=Vuoi davvero annullare l'uso di questa pozione? Sarà comunque consumata.
items.potions.exotic.exoticpotion.yes=Si, sono sicuro.
items.potions.exotic.exoticpotion.no=No, ho cambiato idea
items.potions.exotic.exoticpotion.discover_hint=Puoi creare questo oggetto tramite l'alchimia.

items.potions.exotic.potionofcleansing.name=pozione detergente
items.potions.exotic.potionofcleansing.desc=Questo potente reagente rende chi lo beve immune a tutti gli effetti nocivi per alcuni turni quando tracannato. Puoi anche lanciarlo contro un bersaglio per ripulirlo.
items.potions.exotic.potionofcleansing$cleanse.name=purificato
items.potions.exotic.potionofcleansing$cleanse.desc=Questo personaggio è temporaneamente immune a tutti gli effetti dannosi!\n\nTurni rimanenti: %s.

items.potions.exotic.potionofcorrosivegas.name=pozione di gas corrosivo
items.potions.exotic.potionofcorrosivegas.desc=Stappare o rompere questa fiala pressurizzata causerà la fuoriuscita del contenuto, che formerà una nube di gas corrosivo color ruggine. Il gas si spande pù velocemente del gas tossico ed è più letale, ma non dura altrettanto a lungo.

items.potions.exotic.potionofdragonsbreath.name=pozione dell'alito di drago
items.potions.exotic.potionofdragonsbreath.prompt=Scegli un punto da incendiare
items.potions.exotic.potionofdragonsbreath.desc=Questa boccetta contiene un insolito composto che scoppierà in fiamme poco dopo essere stato mischiato con la saliva. Sputare rapidamente tale liquido permetterà al suo utilizzatore di emettere fiamme dalla sua bocca!

items.potions.exotic.potionofearthenarmor.name=pozione dell'armatura di terracotta
items.potions.exotic.potionofearthenarmor.desc=Piuttosto che paralizzare, questo liquido ha un effetto indurente sulla pelle, che si trasformerà così in un'autentica armatura temporanea.

items.potions.exotic.potionofdivineinspiration.name=pozione di ispirazione divina
items.potions.exotic.potionofdivineinspiration.no_more_points=Non puoi guadagnare altri punti Talento oltre a quelli che hai.
items.potions.exotic.potionofdivineinspiration.select_tier=Scegli un'area di talenti in cui guadagnare 2 punti. Devi aver sbloccato quell'area, per potervi spendere i punti.
items.potions.exotic.potionofdivineinspiration.bonus=+2 Punti Talento!
items.potions.exotic.potionofdivineinspiration.desc=Potere di energia sacra ridotto a forma liquida, questa bevanda infonde potere divino in chi la consuma, facendogli guadagnare 2 punti Talento bonus in un'area di sua scelta.\n\nQuesta pozione può essere usata una sola volta per ogni area di talenti.

items.potions.exotic.potionofmagicalsight.name=pozione di vista magica
items.potions.exotic.potionofmagicalsight.desc=Dopo aver bevuto questo, i tuoi sensi saranno brevemente intensificati a livelli incredibili, permettendoti di vedere attraverso i muri in un raggio di 12 tessere!

items.potions.exotic.potionofmastery.name=pozione di maestria
items.potions.exotic.potionofmastery.prompt=Padroneggia un oggetto
items.potions.exotic.potionofmastery.weapon_easier=La tua arma diventa più facile da maneggiare!
items.potions.exotic.potionofmastery.armor_easier=La tua armatura diventa più leggera da indossare!
items.potions.exotic.potionofmastery.desc=Invece di farti guadagnare forza bruta, questa pozione affina i muscoli all'uso di un particolare oggetto. Questo lo renderà più facile da usare, come se il bevitore avesse fatto pratica con esso e costruito memoria muscolare.\n\nL'uso dell'arma o dell'armatura scelta richiederà 2 punti forza in meno. Questa pozione può essere usata una sola volta per ogni oggetto.

items.potions.exotic.potionofshielding.name=pozione dello scudo
items.potions.exotic.potionofshielding.desc=Piuttosto che curare, questa pozione proietterà un robusto scudo attorno al corpo dell'utilizzatore, bloccando così un considerevole ammontare di danni.

items.potions.exotic.potionofshroudingfog.name=pozione di nebbia avvolgente
items.potions.exotic.potionofshroudingfog.desc=Quando esposto all'aria, il liquido in questa fiala produce una spessa nebbia fumosa che si espande velocemente e blocca la vista ai tuoi nemici.

items.potions.exotic.potionofsnapfreeze.name=pozione del surgelamento
items.potions.exotic.potionofsnapfreeze.desc=La sostanza chimica contenuta in questa pozione reagirà rapidamente con l'aria, congelando e bloccando istantaneamente qualunque cosa posta nel suo raggio di azione.

items.potions.exotic.potionofstamina.name=pozione di resistenza
items.potions.exotic.potionofstamina.desc=Bere questo liquido curiosamente dolce ti irradierà con un durevole sprint di energia, permettendoti di correre ritmo accelerato per un esteso periodo di tempo.

items.potions.exotic.potionofstormclouds.name=pozione delle nubi tempestose
items.potions.exotic.potionofstormclouds.desc=Gettare questa pozione creerà una nube di vapore che si espande velocemente, condensa e ricade a terra. La maggior parte del terreno sarà convertito in acqua, i nemici infuocati prenderanno danno, il fuoco verrà spento, e le trappole saranno sommerse e si romperanno.



###quest items
items.quest.ceremonialcandle.name=candela cerimoniale
items.quest.ceremonialcandle.desc=Un set di candele, sciolte e unite in seguito all'uso. \n\nSingolarmente non servono a nulla, ma usate con altre candele nel modo giusto, possono concentrare l'energia per un rituale di evocazione.
items.quest.ceremonialcandle.discover_hint=Puoi trovare questo oggetto durante una missione specifica.

items.quest.corpsedust.name=polvere di cadavere
items.quest.corpsedust.chill=Un brivido ti scorre giù per la schiena.
items.quest.corpsedust.desc=Questa palla di polvere di cadavere non è tanto diversa da una normale palla di polvere. Ma puoi avvertire un'energia maligna nascondersi in essa. \n\nLiberarsene al più presto sarebbe una buona idea.
items.quest.corpsedust.discover_hint=Puoi trovare questo oggetto durante una missione specifica.

items.quest.darkgold.name=minerale di oro oscuro
items.quest.darkgold.you_now_have=Ora hai %d minerali d'oro scuro.
items.quest.darkgold.desc=Questo metallo è chiamato oscuro non tanto per il suo colore (che non è diverso dal normale oro), ma perché si fonde alla luce del sole, rendendolo inutile in superficie.
items.quest.darkgold.discover_hint=Puoi trovare questo oggetto durante una missione specifica.

items.quest.dwarftoken.name=gettone nanico
items.quest.dwarftoken.desc=Molti nani e alcune delle loro creazioni più grandi recano con sé questi piccoli pezzi di metallo per chissà quale motivo. Forse sono gioielli o un qualche tipo di identificativo. I nani sono gente strana.
items.quest.dwarftoken.discover_hint=Puoi trovare questo oggetto durante una missione specifica.

items.quest.embers.name=braci elementali
items.quest.embers.desc=Braci speciali che possono essere raccolti da giovani elementali del fuoco. Irradiano energia termica.
items.quest.embers.discover_hint=Puoi trovare questo oggetto durante una missione specifica.

items.quest.escapecrystal.name=cristallo di fuga
items.quest.escapecrystal.ac_use=USA
items.quest.escapecrystal.desc=Un piccolo cristallo magico che sembra contenere magia di teletrasporto. Potrai usare il cristallo in ogni momento per uscire dalla cripta nanica, ma non potrai portare nulla con te!
items.quest.escapecrystal.discover_hint=Puoi trovare questo oggetto durante una missione specifica.

items.quest.gooblob.name=grumo di viscidume
items.quest.gooblob.desc=Un grumo di melma tremolante che si è staccato da Goo quand'è morto.\nE? come una grossa palla di gelatina, anche se non oseresti mai mangiarla.\n\nDi per sè non fa nulla ma forse potrebbe essere utile in combinazione con certe pozioni o una bomba; In fondo si dovrebbe convertire in una discreta quantità di energia.
items.quest.gooblob.discover_hint=Puoi trovare questo oggetto come bottino da certi nemici.

items.quest.metalshard.name=frammento di metallo maledetto
items.quest.metalshard.desc=Un frammento di metallo arrugginito e maledetto, che si è staccato da DM-300 quand'è stato distrutto. Puoi avvertire una forza malvagia inattiva al suo interno.
items.quest.metalshard.discover_hint=Puoi trovare questo oggetto come bottino da certi nemici.

items.quest.pickaxe.name=piccone
items.quest.pickaxe.ability_name=trafiggi
items.quest.pickaxe.ability_desc=La Duellante può _perforare_ un nemico con un piccone. Questo colpo è garantito, si applica vulnerabile per 3 turni e infligge _%1$d-%2$d danni_ ai nemici con la pelle rigida.
items.quest.pickaxe.upgrade_ability_stat_name=Danni alle abilità
items.quest.pickaxe.desc=Questo è uno strumento robusto e pesante per rompere le rocce. Non è necessario equipaggiare la piccozza per scavare con essa, ma probabilmente può essere equipaggiata come arma in caso di necessità.
items.quest.pickaxe.discover_hint=Puoi trovare questo oggetto durante una missione specifica.

items.quest.ratskull.name=teschio di ratto gigante
items.quest.ratskull.desc=Un teschio di ratto incredibilmente grande. Sarebbe un bel trofeo di caccia, se avessi una parete in cui appenderlo.



###remains
items.remains.remainsitem.ac_use=USA
items.remains.remainsitem.discover_hint=Puoi trovare questo oggetto nei resti di un eroe specifico di una precedente avventura.

items.remains.bowfragment.name=frammento di arco
items.remains.bowfragment.desc=Questo frammento rotto di legno faceva parte dell'arco spirituale di una Cacciatrice perduta. Puoi ancora sentire un po' di energia naturale rimasta nel frammento, puoi usare il frammento per far crescere dell'erba alta intorno a te. Farlo però distruggerà il frammento.

items.remains.brokenhilt.name=manico rotto
items.remains.brokenhilt.desc=Questa impugnatura rotta sembra provenire dall'arma di una Duellante sconfitta. Puoi ancora percepire un po' di potere marziale rimasto nell'impugnatura, puoi usarlo per ottenere un piccolo bonus di danni sui tuoi prossimi due attacchi corpo a corpo. Farlo però distruggerà l'impugnatura.

items.remains.brokenstaff.name=bastone rotto
items.remains.brokenstaff.desc=Questo bastone del Mago è stato spezzato a metà dopo che il suo proprietario ha incontrato la sua fine. Puoi ancora sentire un po' di energia magica rimasta nel bastone, puoi usarla per dare un piccolo impulso di carica alle tue bacchette. Farlo però distruggerà il bastone.

items.remains.cloakscrap.name=pezzo di stoffa
items.remains.cloakscrap.desc=Questo pezzo di tessuto traslucido sembra provenire dal mantello delle ombre di un ladro tardivo. Puoi ancora percepire un po' di energia mistica residua in esso, puoi usarlo per dare ai tuoi artefatti un piccolo impulso di carica. Tuttavia, facendo ciò, distruggerai il tessuto.

items.remains.sealshard.name=frammenti di sigillo
items.remains.sealshard.desc=Questi piccoli frammenti di cera rossa sembrano provenire dal sigillo di un Guerriero caduto. Puoi ancora percepire un po' di determinazione attaccata al sigillo, puoi usarla per proteggerti un po'. Farlo distruggerà però i frammenti del sigillo.

items.remains.tornpage.name=pagina strappata
items.remains.tornpage.desc=Sembra che questa pagina sia stata strappata dal tomo svanito di un Chierico. C'è ancora un po' di magia divina intrisa ad essa, puoi usarla per riguadagnare un po' di salute. Tuttavia, facendo ciò distruggerai la pagina strappata.



###rings
items.rings.ring.diamond=anello di diamante
items.rings.ring.opal=anello di opale
items.rings.ring.garnet=anello granato
items.rings.ring.ruby=anello di rubino
items.rings.ring.amethyst=anello di ametista
items.rings.ring.topaz=anello di topazio
items.rings.ring.onyx=anello d'onice
items.rings.ring.tourmaline=anello di tormalina
items.rings.ring.emerald=anello di smeraldo
items.rings.ring.sapphire=anello di zaffiro
items.rings.ring.quartz=anello di quarzo
items.rings.ring.agate=anello d'agata
items.rings.ring.equip_cursed=L'anello si stringe dolorosamente attorno al tuo dito!
items.rings.ring.unknown_desc=Questa fede di metallo è adornata con una grande gemma che brilla nel buio. Chissà che effetto avrà una volta indossato?
items.rings.ring.known=Questo è un %s
items.rings.ring.identify=Ormai hai abbastanza familiarità con il tuo anello da indentificarlo.
items.rings.ring.cursed_worn=Poiché l'anello è maledetto, non ti è possibile rimuoverlo.
items.rings.ring.curse_known=Puoi percepire una magia maligna nascondersi all'interno di questo anello.
items.rings.ring.not_cursed=Questo anello è libero da magia ostile.

items.rings.ringofaccuracy.name=anello della precisione
items.rings.ringofaccuracy.stats=Quando indossato, questo anello aumenterà la tua precisione del _%s%%._
items.rings.ringofaccuracy.typical_stats=Quando indossato, questo anello aumenterà la tua precisione tipicamente del _%s%%._
items.rings.ringofaccuracy.combined_stats=Gli anelli equipaggiati stanno combinando il loro potere, aumentando la tua precisione di _%s%%_ in totale.
items.rings.ringofaccuracy.upgrade_stat_name_1=Aumento della precisione
items.rings.ringofaccuracy.desc=Questo anello aumenta la tua concentrazione, rendendo più facile ai tuoi attacchi trovare il loro bersaglio. Un anello maledetto invece renderà più difficile ai tuoi attacchi andare a segno.

items.rings.ringofarcana.name=anello dell'arcano
items.rings.ringofarcana.stats=Quando indossato, questo anello aumenterà la potenza degli incantamenti e dei glifi del _%s%%._
items.rings.ringofarcana.typical_stats=Quando indossato, questo anello aumenterà la potenza degli incantamenti e dei glifi tipicamente del _%s%%._
items.rings.ringofarcana.combined_stats=I tuoi anelli equipaggiati stanno combinando il loro potere, aumentando il potere degli incantesimi e dei glifi di _%s%%_ in totale.
items.rings.ringofarcana.upgrade_stat_name_1=Potenziamento arcano
items.rings.ringofarcana.desc=Questo anello potenzia gli incantesimi magici sulle armi e i glifi sulle armature, incluse le maledizioni! Prima aumenta la possibilità di attivazione, quindi aumenta la forza dell'effetto una volta che la possibilità di attivazione è del 100%. Un anello maledetto invece indebolirà incantesimi, glifi e maledizioni.

items.rings.ringofelements.name=anello degli elementi
items.rings.ringofelements.stats=Quando indossato, questo anello ti fornirà _%s%%_ resistenza elementale.
items.rings.ringofelements.typical_stats=Quando indossato, questo anello ti fornirà tipicamente _%s%%_ resistenza elementale.
items.rings.ringofelements.combined_stats=I tuoi anelli equipaggiati stanno combinando il loro potere, fornendo _%s%%_ resistenza elementale in totale.
items.rings.ringofelements.upgrade_stat_name_1=Resistenza
items.rings.ringofelements.desc=Questo anello fornisce resistenza alla maggior parte degli effetti magici ed elementali, riducendone i danni e la durata. Naturalmente un anello maledetto peggiorerà invece tali effetti.

items.rings.ringofenergy.name=anello dell'energia
items.rings.ringofenergy.stats=Quando indossato, questo anello aumenterà la velocità di ricarica delle bacchette, degli artefatti e delle armature eroiche del _%s%%._
items.rings.ringofenergy.typical_stats=Quando indossato, di solito questo anello aumenterà la velocità di ricarica delle bacchette, degli artefatti e delle armature eroiche del _%s%%._
items.rings.ringofenergy.combined_stats=Gli anelli equipaggiati stanno combinando il loro potere, aumentando la velocità di carica di _%s%%_ in totale.
items.rings.ringofenergy.upgrade_stat_name_1=Potenziamento della carica
items.rings.ringofenergy.desc=Il tuo equipaggiamento magico si ricaricherà più velocemente dalla forza arcana sprigionata da questo anello. Un anello maledetto invece rallenterà la ricarica.

items.rings.ringofevasion.name=anello di evasione
items.rings.ringofevasion.stats=Quando indossato, questo anello aumenterà la tua evasione del _%s%%._
items.rings.ringofevasion.typical_stats=Quando indossato, questo anello aumenterà la tua evasione tipicamente del _%s%%._
items.rings.ringofevasion.combined_stats=I tuoi anelli equipaggiati stanno combinando il loro potere, aumentando la tua evasione di _%s%%_ in totale.
items.rings.ringofevasion.upgrade_stat_name_1=Potenziamento dell'evasione
items.rings.ringofevasion.desc=Questo anello accelera i riflessi del portatore, rendendolo più difficile da colpire. Un anello maledetto invece renderà l'utilizzatore più facile da attaccare.

items.rings.ringofforce.name=anello della forza
items.rings.ringofforce.stats=Quando sei disarmato, alla tua forza attuale, questo anello infliggerà _%1$d-%2$d punti danno._ Con un'arma equipaggiata, questo anello aumenterà i danni di _%3$d punti._
items.rings.ringofforce.typical_stats=Quando sei disarmato, alla tua forza attuale, di solito questo anello infliggerà _%1$d-%2$d punti danno._ Con un'arma equipaggiata, questo anello aumenterà i danni tipicamente di _%3$d punti._
items.rings.ringofforce.combined_stats=I tuoi anelli equipaggiati stanno combinando il loro potere, infliggendo un totale di _%1$d-%2$d danni_ senza un'arma, o aumentando i danni di _%3$d_ con una.
items.rings.ringofforce.upgrade_stat_name_1=Danno senza armi
items.rings.ringofforce.upgrade_stat_name_2=Aumento del danno armato
items.rings.ringofforce.upgrade_stat_name_3=Danni alle abilità
items.rings.ringofforce.ability_name=posizione dell'attaccabrighe
items.rings.ringofforce.typical_ability_desc=La Duellante può adottare una posizione da _attaccabrighe_ con questo anello, facendo sì che i suoi attacchi regolari utilizzino sempre questo anello anche con un'arma equipaggiata. Questi attacchi in genere infliggono _%1$d-%2$d danni_ ed erediteranno anche l'incantesimo e il potenziamento dell'arma. Questa posizione rallenta la velocità di ricarica dell'arma di 50%%.
items.rings.ringofforce.ability_desc=La Duellante può adottare una posizione da _attaccabrighe_ con questo anello, facendo sì che i suoi attacchi regolari utilizzino sempre questo anello anche con un'arma equipaggiata. Questi attacchi infliggeranno _%1$d-%2$d danni_ ed erediteranno anche l'incantesimo e il potenziamento dell'arma. Questa posizione rallenta la velocità di ricarica dell'arma di 50%%.
items.rings.ringofforce.desc=Questo anello incrementa la forza dei colpi del portatore nel corpo a corpo. Questo potere extra è piuttosto debole quando si brandiscono armi, ma renderà un attacco disarmato molto più forte. Un anello maledetto invece indebolirà i colpi del portatore.
items.rings.ringofforce$brawlersstance.name=posizione dell'attaccabrighe
items.rings.ringofforce$brawlersstance.desc=Mentre è in questa posizione, gli attacchi regolari della Duellante utilizzeranno un anello di forza equipaggiato anche quando ha un'arma equipaggiata. Questi attacchi ottengono danni bonus e utilizzeranno comunque il potenziamento e l'incantesimo dell'arma.\n\nMantenere questa posizione richiede tuttavia concentrazione, riducendo la velocità di ricarica dell'abilità dell'arma del 50%.\n\nQuesta posizione può essere attivata o disattivata utilizzando un anello della forza, ma la riduzione della velocità di carica persisterà per un po' se la posizione viene attivata e disattivata rapidamente.

items.rings.ringoffuror.name=anello del furore
items.rings.ringoffuror.stats=Quando indossato, questo anello aumenterà la velocità dei tuoi attacchi del _%s%%._
items.rings.ringoffuror.typical_stats=Quando indossato, questo anello aumenterà la velocità dei tuoi attacchi tipicamente del _%s%%._
items.rings.ringoffuror.combined_stats=Gli anelli equipaggiati stanno combinando il loro potere, aumentando la velocità dei tuoi attacchi di _%s%%_ in totale.
items.rings.ringoffuror.upgrade_stat_name_1=Aumento della velocità di attacco
items.rings.ringoffuror.desc=Questo anello dona al portatore una furia interiore, permettendogli di attaccare più rapidamente. Un anello maledetto invece rallenterà la velocità di attacco del portatore.

items.rings.ringofhaste.name=anello della fretta
items.rings.ringofhaste.stats=Quando indossato, questo anello aumenterà la velocità dei tuoi movimenti del _%s%%._
items.rings.ringofhaste.typical_stats=Quando indossato, questo anello aumenterà la velocità dei tuoi movimenti tipicamente del _%s%%._
items.rings.ringofhaste.combined_stats=Gli anelli equipaggiati stanno combinando il loro potere, aumentando la tua velocità di movimento di _%s%%_ in totale.
items.rings.ringofhaste.upgrade_stat_name_1=Aumenta la velocità di movimento
items.rings.ringofhaste.desc=Quest'anello riduce lo sforzo di movimento del portatore, permettendogli di correre a velocità sovraumane. Un anello maledetto al contrario appesantirà chi lo indossa.

items.rings.ringofmight.name=anello della potenza
items.rings.ringofmight.stats=Quando indossato, questo anello aumenterà la tua forza di _%1$d_ e la tua salute massima del _%2$s%%._
items.rings.ringofmight.typical_stats=Quando indossato, questo anello aumenterà la tua forza di _%1$d_ e la tua salute massima del _%2$s%%._
items.rings.ringofmight.combined_stats=I tuoi anelli equipaggiati stanno combinando il loro potere, aumentando la tua forza di _%1$d_ e i tuoi HP massimi di _%2$s%%_ in totale.
items.rings.ringofmight.upgrade_stat_name_1=Bonus di Forza
items.rings.ringofmight.upgrade_stat_name_2=Incremento HP massimo
items.rings.ringofmight.desc=Questo anello incrementa le caratteristiche fisiche del portatore, garantendogli maggiore forza fisica e costituzione. Un anello maledetto invece indebolirà chi lo indossa.

items.rings.ringofsharpshooting.name=anello del tiratore scelto
items.rings.ringofsharpshooting.stats=Quando indossato, questo anello aumenterà il danno delle tue armi da lancio come se il loro livello fosse incrementato di _%1$d_, e aumenterà la loro durabilità di _%2$s%%._
items.rings.ringofsharpshooting.typical_stats=Quando indossato, generalmente questo anello aumenterà il danno delle tue armi da lancio come se il loro livello fosse incrementato di _%1$d_, e aumenterà la loro durabilità di _%2$s%%._
items.rings.ringofsharpshooting.combined_stats=I tuoi anelli equipaggiati stanno combinando il loro potere, aumentando il livello effettivo dell'arma da lancio di _%1$d_ e aumentando la loro durabilità di _%2$s%%_ in totale.
items.rings.ringofsharpshooting.upgrade_stat_name_1=Aumento del danno di livello
items.rings.ringofsharpshooting.upgrade_stat_name_2=Aumento della durabilità
items.rings.ringofsharpshooting.desc=Questo anello incrementa la mira e la precisione del portatore, rendendo tutte le armi da lancio più dannose e durature. Un anello maledetto avrà l'effetto opposto.

items.rings.ringoftenacity.name=anello della tenacia
items.rings.ringoftenacity.stats=Quando indossato, questo anello ridurrà i danni subiti fino al _%s%%._
items.rings.ringoftenacity.typical_stats=Quando indossato, questo anello ridurrà i danni subiti tipicamente fino al _%s%%._
items.rings.ringoftenacity.combined_stats=Gli anelli equipaggiati stanno combinando il loro potere, riducendo i danni subiti fino a _%s%%_ in totale.
items.rings.ringoftenacity.upgrade_stat_name_1=Resistenza massima al danno
items.rings.ringoftenacity.desc=Quando indossato, questo anello permetterà al portatore di resistere a colpi solitamente mortali. Più l'utilizzatore è ferito, più sarà resistente ai danni. Un anello maledetto invece renderà più facile ai nemici uccidere chi lo indossa.

items.rings.ringofwealth.name=anello dell'opulenza
items.rings.ringofwealth.stats=Quando indossato, questo anello aumenterà la tua fortuna del _%s%%._
items.rings.ringofwealth.typical_stats=Quando indossato, questo anello aumenterà la tua fortuna tipicamente del _%s%%._
items.rings.ringofwealth.combined_stats=I tuoi anelli equipaggiati stanno combinando il loro potere, aumentando la tua fortuna di _%s%%_ in totale.
items.rings.ringofwealth.upgrade_stat_name_1=Incremento della fortuna
items.rings.ringofwealth.desc=Questo anello funziona come una calamita per tesori, aumentando le possibilità che i nemici e i forzieri contengano oggetti preziosi. Un anello maledetto ridurrà le tue probabilità di ottenere del bottino.



###scrolls
items.scrolls.scroll.ac_read=LEGGI
items.scrolls.scroll.kaunan=Pergamena "KAUNAN"
items.scrolls.scroll.sowilo=Pergamena "SOWILO"
items.scrolls.scroll.laguz=Pergamena "LAGUZ"
items.scrolls.scroll.yngvi=Pergamena "YNGVI"
