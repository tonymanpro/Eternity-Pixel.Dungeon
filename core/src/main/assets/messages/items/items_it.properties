items.weapon.melee.spear.ability_desc=La Duellante può usare la punta di una lancia per _puntare_ un nemico che si trova nel raggio d'azione ma non adiacente. Questo infligge _%1$d-%2$d danni_, respinge il nemico ed è garantito che colpisca.
