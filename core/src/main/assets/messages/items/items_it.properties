items.scrolls.exotic.exoticscroll.naudiz=Pergamena esotica "NAUDIZ"
items.scrolls.exotic.exoticscroll.berkanan=Pergamena esotica "BERKANAN"
items.scrolls.exotic.exoticscroll.odal=Pergamena esotica "ODAL"
