items.kindofweapon.swift_equip=Equipaggi rapidamente la tua arma.
items.kindofweapon.equip_cursed=La tua presa si stringe involontariamente attorno all'arma.
items.kindofweapon.which_equip_msg=A quale slot arma vuoi equipaggiare questo oggetto?\n\nLa Campionessa attacca direttamente con la sua arma principale, ma può usare l'abilità di entrambe le armi. Entrambe le armi condividono lo stesso numero di cariche.\n\nLa Campionessa può anche scambiare istantaneamente la sua arma primaria e secondaria.
items.kindofweapon.which_equip_primary=Primario (%s)
items.kindofweapon.which_equip_secondary=Secondario (%s)
