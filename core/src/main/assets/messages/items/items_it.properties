items.armor.armor$glyph.rankings_desc=Ucciso da un glifo
items.armor.armor$glyph.discover_hint=Puoi trovare un oggetto con questo effetto casualmente nel dungeon, oppure provare ad applicarlo ad un oggetto tu stesso.

items.armor.classarmor.ac_ability=SCEGLI ABILITÁ
items.armor.classarmor.ac_transfer=TRASFERIMENTO
items.armor.classarmor.no_ability=La tua armatura non ha abilità, puoi sceglierne una!
items.armor.classarmor.not_equipped=Devi indossare questa armatura per usare il suo potere speciale!
items.armor.classarmor.low_charge=L'armatura non ha abbastanza carica per usare il suo potere speciale!
items.armor.classarmor.charge_use=Usare l'abilità in questo momento consumerà _%s_ cariche.
items.armor.classarmor.transfer_title=Trasferisci Armatura
items.armor.classarmor.transfer_desc=La magia della corona del Re dei nani può essere trasferita ad un'altra armatura. Nota che l'armatura originaria verrà distrutta nel processo.
items.armor.classarmor.transfer_prompt=Seleziona un'Armatura
items.armor.classarmor.transfer_cancel=Annulla
items.armor.classarmor.transfer_complete=Le proprietà eroiche della tua armatura sono state trasferite!
items.armor.classarmor.discover_hint=Puoi trovare questo oggetto dopo aver sconfitto il boss del piano 20 con un eroe specifico.

items.armor.clericarmor.name=Paramenti dell'eroe
items.armor.clericarmor.desc=Mentre indossa questa combinazione di vesti e piastre, il Chierico può eseguire un'abilità speciale.

items.armor.clotharmor.name=armatura di stoffa
items.armor.clotharmor.desc=Questa armatura leggera offre una protezione base.
items.armor.clotharmor.discover_hint=Uno degli eroi inizia con questo oggetto.

items.armor.duelistarmor.name=corazza dell'eroe
items.armor.duelistarmor.desc=Mentre indossa questa armatura a piastre e mantello, la Duellante può eseguire un'abilità speciale.

items.armor.huntressarmor.name=manto dell'eroe
items.armor.huntressarmor.no_enemies=Nessun nemico in vista
items.armor.huntressarmor.desc=Quando indossa questo mantello, la Cacciatrice può usare un'abilità speciale.

items.armor.leatherarmor.name=armatura di cuoio
items.armor.leatherarmor.desc=Armatura ottenuta dalla pelle conciata di un mostro. Non leggera come quella di stoffa ma offre una protezione migliore.

items.armor.magearmor.name=veste dell'eroe
items.armor.magearmor.desc=Quando indossa questa magnifica tunica, il Mago può usare un'abilità speciale.

items.armor.mailarmor.name=armatura a maglie
items.armor.mailarmor.desc=L'intreccio degli anelli metallici crea un'armatura resistente e flessibile allo stesso tempo.

items.armor.platearmor.name=armatura a piastre
items.armor.platearmor.desc=Enormi piastre di metallo sono unite in un'armatura in grado di fornire una protezione impareggiabile ad ogni avventuriero forte abbastanza da sopportarne lo sconcertante peso.

items.armor.roguearmor.name=abito dell'eroe
items.armor.roguearmor.desc=Mentre indossa questa veste oscura, il Ladro può usare un'abilità speciale.

items.armor.scalearmor.name=armatura a scaglie
items.armor.scalearmor.desc=Le scaglie metalliche fissate su una maglia di cuoio creano un'armatura flessibile eppure protettiva.

items.armor.warriorarmor.name=armatura a piastre dell'eroe
items.armor.warriorarmor.desc=Mentre indossa questa pesante armatura a piastre, il Guerriero può eseguire un'abilità speciale.



###artifacts
items.artifacts.alchemiststoolkit.name=kit dell'alchimista
items.artifacts.alchemiststoolkit.ac_brew=PREPARA
items.artifacts.alchemiststoolkit.ac_energize=ENERGIZZA
items.artifacts.alchemiststoolkit.not_ready=Il tuo kit non è ancora pronto all'uso.
items.artifacts.alchemiststoolkit.cursed=Il tuo kit maledetto ti impedisce di usare l'alchimia!
items.artifacts.alchemiststoolkit.need_energy=Hai bisogno di almeno 6 energia per questo.
items.artifacts.alchemiststoolkit.energize_desc=Ogni 6 cristalli il kit avrà energia sufficiente per guadagnare un livello, il che aumenta la velocità con cui esso genera energia nel tempo e quanto velocemente si riscalda.\n\nQuanta energia vuoi usare?
items.artifacts.alchemiststoolkit.energize_1=6 energia: +1 livello
items.artifacts.alchemiststoolkit.energize_all=%1$d energia: + %2$d livelli
items.artifacts.alchemiststoolkit.desc=Il kit di strumenti contiene reagenti ed erbe, oltre ad una bottiglietta di miscelazione, che permettono di praticare l'alchimia in qualunque luogo. La bottiglietta contiene anche ciò che sembra un cristallo di energia alchemica in forma liquda.
items.artifacts.alchemiststoolkit.desc_cursed=Il kit maledetto si è fissato al tuo fianco e si rifiuta di lasciarti usare l'alchimia.
items.artifacts.alchemiststoolkit.desc_warming=Il kit di strumenti si sta riscaldando e sarà pronto all'uso tra breve.
items.artifacts.alchemiststoolkit.desc_hint=Il kit appena indossato genera lentamente energia alchemica, via via che tu accumuli esperienza. Sembra che la miscela nella fiala possa venire potenziata aggiungendovi dei cristalli d'energia.

items.artifacts.artifact.cannot_wear_two=Non puoi indossare due artefatti uguali.
items.artifacts.artifact.equip_cursed=L'artefatto si lega a te dolorosamente.
items.artifacts.artifact.curse_known=Puoi percepire una magia ostile nascondersi nell'artefatto.
items.artifacts.artifact.not_cursed=Questo artefatto è libero da magia ostile.
items.artifacts.artifact.need_to_equip=Dovrai equipaggiare l'artefatto per farlo.

items.artifacts.capeofthorns.name=cappa di spine
items.artifacts.capeofthorns.desc=Queste lamiere di metallo cadute da DM-300 si sono unite in un rigido mantello. Pare contenere una profonda energia, magari possiede un po' del potere del DM-300?
items.artifacts.capeofthorns.desc_inactive=Il mantello pesa in modo rassicurante sulle tue spalle, pare che acquisti energia dai danni che subisci.
items.artifacts.capeofthorns.desc_active=Il mantello pare rilasciare energia raccolta in precedenza, sta irradiando un potere protettivo.
items.artifacts.capeofthorns$thorns.inert=Il tuo mantello ritorna inerte.
items.artifacts.capeofthorns$thorns.radiating=Il tuo mantello comincia ad irradiare energia, ti senti protetto!
items.artifacts.capeofthorns$thorns.levelup=il tuo mantello diventa più forte!
items.artifacts.capeofthorns$thorns.name=spine
items.artifacts.capeofthorns$thorns.desc=Il tuo mantello irradia energia, circondandoti di un campo di forza deflettiva!\n\nTutto il danno ricevuto è ridotto mentre l'effetto delle spine è attivo. Inoltre se l'attaccante è vicino, l'ammontare ridotto è riflesso al nemico.\n\nTurni di spine rimanenti: %s.

items.artifacts.chaliceofblood.name=calice di sangue
items.artifacts.chaliceofblood.ac_prick=PUNGI
items.artifacts.chaliceofblood.yes=Sì, so quel che sto facendo
items.artifacts.chaliceofblood.no=No, ho cambiato idea
items.artifacts.chaliceofblood.prick_warn=Ogni volta che usi il calice, prosciugherà sempre più della t_ ua energia vitale, ma in cambio incrementerà la tua rigenerazione naturale.\n\nAttualmente pungerti infliggerà _%1$d-%2$d danni_, anche se questo danno può essere ridotto da _armature e riduzioni dal danno sia fisiche che magiche._ Senza considerare gli effetti di riduzione del danno, attualmente pungerti ha una _probabilità del %3$s%%_ di prosciugare completamente la tua forza vitale.\n\nSei sicuro di voler offrire al calice più energia vitale?
items.artifacts.chaliceofblood.onprick=Ti fai pungere e la tua essenza vitale scorre nel calice.
items.artifacts.chaliceofblood.ondeath=Il calice prosciuga interamente la tua vita...
items.artifacts.chaliceofblood.desc=Questo calice d'argento luccicante è stranamente decorato con gemme affilate attorno all'orlo.
items.artifacts.chaliceofblood.desc_cursed=Il calice maledetto si è legato alla tua mano, inibendo la tua capacità di rigenerare salute.
items.artifacts.chaliceofblood.desc_1=Come afferri il calice, ti senti stranamente costretto a pungerti con le gemme taglienti.
items.artifacts.chaliceofblood.desc_2=C'è un po' del tuo sangue accumulato nel calice, senti la sensazione del calice rifornirti di energia vitale, aumentando la tua rigenerazione naturale. Vuoi ancora tagliarti col calice, anche se sai che farà male.
items.artifacts.chaliceofblood.desc_3=Il calice è riempito fino all'orlo della tua essenza vitale. Puoi sentire il calice riversare energia vitale in te.

items.artifacts.cloakofshadows.name=manto delle ombre
items.artifacts.cloakofshadows.ac_stealth=FURTIVITÀ
items.artifacts.cloakofshadows.cooldown=Il tuo manto necessita di ancora %d turni per ri-energizzarsi.
items.artifacts.cloakofshadows.cursed=Non puoi usare un manto maledetto.
items.artifacts.cloakofshadows.no_charge=Il tuo manto non si è ancora ricaricato abbastanza da poter essere usato.
items.artifacts.cloakofshadows.desc=Un'inestimabile manto magico, rubato dall'armeria reale molti anni fa dal Ladro. Una volta indossato può essere usato per rendersi completamente invisibili per un limitato periodo.\n\nPiù il manto viene usato più forte diverrà, permettendo al ladro di rendersi invisibile più frequentemente e per periodi più prolungati.
items.artifacts.cloakofshadows.discover_hint=Uno degli eroi inizia con questo oggetto.
items.artifacts.cloakofshadows$cloakstealth.no_charge=Il tuo manto ha esaurito l'energia.
items.artifacts.cloakofshadows$cloakstealth.levelup=Il tuo manto diventa più forte!
items.artifacts.cloakofshadows$cloakstealth.name=ammantato
items.artifacts.cloakofshadows$cloakstealth.desc=Il tuo mantello d'ombra ti garantisce l'invisibilità mentre ne sei avvolto. Rimarrai occultato fino a quando non verrà annullato o il tuo occultamento si esaurirà.\n\nMentre sei invisibile, i nemici non possono attaccarti o seguirti. Gli attacchi fisici e gli effetti magici (come pergamene e bacchette) annulleranno immediatamente l'invisibilità.\n\nTurni fino all'utilizzo della carica: %d.

items.artifacts.driedrose.name=rosa essiccata
items.artifacts.driedrose.ac_summon=EVOCA
items.artifacts.driedrose.ac_direct=DIREZIONA
items.artifacts.driedrose.ac_outfit=EQUIPAGGIA
items.artifacts.driedrose.spawned=Hai già evocato il fantasma.
items.artifacts.driedrose.no_charge=La tua rosa non è ancora completamente carica.
items.artifacts.driedrose.cursed=Non puoi usare una rosa maledetta.
items.artifacts.driedrose.no_space=Non c'è alcuno spazio libero attorno a te.
items.artifacts.driedrose.charged=La tua rosa è completamente carica!
items.artifacts.driedrose.desc=È questa la rosa che il fantasma ha menzionato prima di scomparire? Pare contenere qualche potere spirituale, magari può essere usata per incanalare l'energia di quel guerriero smarrito.
items.artifacts.driedrose.desc_no_quest=Una rosa disseccata che in qualche modo si tiene ancora insieme a discapito della sua età.\n\nPare possedere del potere spirituale, ma non hai idea su come usarla per il momento.
items.artifacts.driedrose.desc_hint=Sembra che le manchi qualche petalo. Forse riattaccandoli la rosa si rafforzerà.
items.artifacts.driedrose.desc_cursed=La rosa maledetta si lega alla tua mano, è sinistramente fredda al tocco.
items.artifacts.driedrose.desc_weapon=Arma del Fantasma: %s.
items.artifacts.driedrose.desc_armor=Armatura del Fantasma: %s.
items.artifacts.driedrose.desc_strength=Forza del Fantasma: %s.
items.artifacts.driedrose$petal.name=petalo essiccato
items.artifacts.driedrose$petal.no_rose=Non hai una rosa a cui aggiungere questo petalo.
items.artifacts.driedrose$petal.no_room=Non c'è spazio rimanente per questo petalo, quindi lo butti via.
items.artifacts.driedrose$petal.maxlevel=La rosa è completa!
items.artifacts.driedrose$petal.levelup=Aggiungi il petalo alla rosa.
items.artifacts.driedrose$petal.desc=Un fragile petalo disseccato, che in qualche modo è sopravvissuto così a lungo nel dungeon.
items.artifacts.driedrose$wndghosthero.title=Equipaggiamento del Fantasma
items.artifacts.driedrose$wndghosthero.desc=Il fantasma è debole di per sé, ma la sua forma è solida abbastanza da poter essere equipaggiata con un'arma ed un'armatura. Saranno capaci di usare questi oggetti proprio come fai tu.\n\nIl fantasma può attualmente equipaggiare oggetti richiedenti fino a _%d punti forza._
items.artifacts.driedrose$wndghosthero.weapon_prompt=Seleziona un'arma
items.artifacts.driedrose$wndghosthero.armor_prompt=Seleziona un'armatura
items.artifacts.driedrose$wndghosthero.cant_unique=Il fantasma non può usare oggetti esclusivi.
items.artifacts.driedrose$wndghosthero.cant_cursed=Il fantasma può utilizzare solo equipaggiamento che sei sicuro non sia maledetto.
items.artifacts.driedrose$wndghosthero.cant_strength_unknown=Il fantasma potrebbe non essere abbastanza forte per usarlo.
items.artifacts.driedrose$wndghosthero.cant_strength=Il fantasma non è abbastanza forte per usarlo.

##ghost hero
items.artifacts.driedrose$ghosthero.name=fantasma triste
items.artifacts.driedrose$ghosthero.def_verb=schivato
items.artifacts.driedrose$ghosthero.discover_hint=Puoi trovare questo personaggio con un artefatto specifico.

items.artifacts.driedrose$ghosthero.hello=Salve di nuovo %s.
items.artifacts.driedrose$ghosthero.introduce=Il mio spirito è legato a questa rosa: mi era molto cara, un dono ricevuto dall'amato che ho lasciato in superficie.\n\nNon posso ritornare ad esso, ma grazie a te ho una seconda possibilità di completare il mio viaggio. Quando ne sarò in grado risponderò alla tua chiamata e combatterò al tuo fianco.\n\nFintantoché avrai la rosa io potrò udire la tua voce, così da potermi utilizzare da lontano.\n\nSperiamo tu possa avere successo dove io ho fallito...

items.artifacts.driedrose$ghosthero.dialogue_sewers_1=Queste fognature un tempo erano sicure, addirittura la gente viveva qui durante l'inverno.
items.artifacts.driedrose$ghosthero.dialogue_sewers_2=Mi chiedo cosa sia successo alle guardie di pattuglia, si sono arrese?
items.artifacts.driedrose$ghosthero.dialogue_sewers_3=Avevo famiglia lassù in superficie, spero stiano bene.
items.artifacts.driedrose$ghosthero.dialogue_sewers_4=Le guardie non hanno potuto sconfiggere questi mostri, ma forse noi possiamo.
items.artifacts.driedrose$ghosthero.dialogue_sewers_5=Se perfino le fogne sono così pericolose, mi chiedo cosa si annidi più sotto...
items.artifacts.driedrose$ghosthero.dialogue_sewers_6=Cosa avrà fatto crescere questi ratti e questi granchi così grossi?
items.artifacts.driedrose$ghosthero.dialogue_prison_1=Ho sentito storie su questo luogo, niente di buono.
items.artifacts.driedrose$ghosthero.dialogue_prison_2=Questo luogo è sempre stato più una segreta che una prigione.
items.artifacts.driedrose$ghosthero.dialogue_prison_3=Non posso immaginare cosa sia successo quando questo luogo fu abbandonato.
items.artifacts.driedrose$ghosthero.dialogue_prison_4=Parrebbe che sia le guardie che i prigionieri siano stati trasformati in mostri.
items.artifacts.driedrose$ghosthero.dialogue_prison_5=Quale potrebbe essere la causa di tutti questi scheletri?
items.artifacts.driedrose$ghosthero.dialogue_prison_6=Queste persone non sarebbero dovute finire così...
items.artifacts.driedrose$ghosthero.dialogue_caves_1=Nessun umano o nano è stato qui da molto tempo.
items.artifacts.driedrose$ghosthero.dialogue_caves_2=Cosa mai avrebbe spinto dei nani ad abbandonare una miniera d'oro?
items.artifacts.driedrose$ghosthero.dialogue_caves_3=È un peccato che tutto l'oro che è qui sia inutile in superficie.
items.artifacts.driedrose$ghosthero.dialogue_caves_4=Le creature presenti qui sono contorte, proprio come nelle fognature.
items.artifacts.driedrose$ghosthero.dialogue_caves_5=Perfino i pipistrelli sono assetati di sangue qui.
items.artifacts.driedrose$ghosthero.dialogue_caves_6=Nessuna traccia di macchinari estrattivi, che i nani li abbiano recuperati tutti?
items.artifacts.driedrose$ghosthero.dialogue_city_1=I nani erano operosi, ma avidi.
items.artifacts.driedrose$ghosthero.dialogue_city_2=Dunque le metropoli naniche sono davvero cadute.
items.artifacts.driedrose$ghosthero.dialogue_city_3=Spero che la superficie non diventi mai come questo posto.
items.artifacts.driedrose$ghosthero.dialogue_city_4=I nani non dovrebbero essere così pallidi.
items.artifacts.driedrose$ghosthero.dialogue_city_5=Non so cosa siano peggio, i nani o le loro creazioni.
items.artifacts.driedrose$ghosthero.dialogue_city_6=Parrebbe che i nani siano ora diventati mostri irrazionali essi stessi.
items.artifacts.driedrose$ghosthero.dialogue_halls_1=Cos'è questo posto?
items.artifacts.driedrose$ghosthero.dialogue_halls_2=Questo luogo è terrificante...
items.artifacts.driedrose$ghosthero.dialogue_halls_3=Cosa avevano per la testa i nani, gingillandosi con un tale potere?
items.artifacts.driedrose$ghosthero.dialogue_halls_4=I mostri qui sono spettrali, da dove sono spuntati fuori?
items.artifacts.driedrose$ghosthero.dialogue_halls_5=Puoi avvertirlo? È come se qualcosa ci stesse osservando.
items.artifacts.driedrose$ghosthero.dialogue_halls_6=Grazie al cielo ci sono le torce, è così buio qui!
items.artifacts.driedrose$ghosthero.dialogue_ascension_1=Cosa sta succedendo? Pensavo avessimo vinto?
items.artifacts.driedrose$ghosthero.dialogue_ascension_2=Come fa quella cosa ad influenzare ancora questo mondo?
items.artifacts.driedrose$ghosthero.dialogue_ascension_3=Spero tu sappia cosa stai facendo con quell'amuleto.
items.artifacts.driedrose$ghosthero.dialogue_ascension_4=Suppongo che non sia ancora finita.
items.artifacts.driedrose$ghosthero.dialogue_ascension_5=Siamo arrivati così lontano, possiamo farcela!
items.artifacts.driedrose$ghosthero.dialogue_ascension_6=Un ultimo sforzo, possiamo uscire da qui!

items.artifacts.driedrose$ghosthero.seen_goo_1=Attenzione a Goo!
items.artifacts.driedrose$ghosthero.seen_goo_2=Molti dei miei amici morirono a causa di questa cosa, è tempo di vendetta!
items.artifacts.driedrose$ghosthero.seen_goo_3=A un abominio del genere non può essere permesso vivere!
items.artifacts.driedrose$ghosthero.seen_tengu_1=L'unico prigioniero rimasto è un letale assassino. Ovviamente...
items.artifacts.driedrose$ghosthero.seen_tengu_2=Ci ha intrappolato!
items.artifacts.driedrose$ghosthero.seen_tengu_3=Ho sentito storie orrende su quella maschera...
items.artifacts.driedrose$ghosthero.seen_dm300_1=Solamente i nani avrebbero potuto costruire una macchina scavatrice che uccide gli intrusi.
items.artifacts.driedrose$ghosthero.seen_dm300_2=Questa cosa è enorme...
items.artifacts.driedrose$ghosthero.seen_dm300_3=Come è potuta rimanere attiva così a lungo?
items.artifacts.driedrose$ghosthero.seen_king_1=Quando la gente dice il potere corrompe, questo è quello che intendono.
items.artifacts.driedrose$ghosthero.seen_king_2=È più un cadavere che un Re, adesso.
items.artifacts.driedrose$ghosthero.seen_king_3=Anche nella morte i nani obbediscono al loro padrone.
items.artifacts.driedrose$ghosthero.seen_yog_1=Oh, questo non va bene.
items.artifacts.driedrose$ghosthero.seen_yog_2=Dunque è questo l'aspetto di una divinità?
items.artifacts.driedrose$ghosthero.seen_yog_3=Questo farà male...

items.artifacts.driedrose$ghosthero.defeated_by_enemy_1=Buona fortuna...
items.artifacts.driedrose$ghosthero.defeated_by_enemy_2=Stanco... per ora...
items.artifacts.driedrose$ghosthero.defeated_by_enemy_3=Ritornerò...
items.artifacts.driedrose$ghosthero.defeated_by_boss_1=Mi spiace... buona fortuna...
items.artifacts.driedrose$ghosthero.defeated_by_boss_2=Finiscilo... senza di me...
items.artifacts.driedrose$ghosthero.defeated_by_boss_3=No... Non posso...
items.artifacts.driedrose$ghosthero.blessed_ankh_1=Come sei sopravvissuto a quello?
items.artifacts.driedrose$ghosthero.blessed_ankh_2=Magari avessi avuto uno di quelli...
items.artifacts.driedrose$ghosthero.blessed_ankh_3=Santo cielo! Sei ancora vivo!
items.artifacts.driedrose$ghosthero.player_killed_1=No!...
items.artifacts.driedrose$ghosthero.player_killed_2=Non ho potuto aiutarli...
items.artifacts.driedrose$ghosthero.player_killed_3=Non così...

items.artifacts.driedrose$ghosthero.direct_prompt=Cosa dovrei fare?
items.artifacts.driedrose$ghosthero.directed_follow_1=Ok, ti seguirò.
items.artifacts.driedrose$ghosthero.directed_follow_2=Mi accoderò a te.
items.artifacts.driedrose$ghosthero.directed_follow_3=Ti seguo...
items.artifacts.driedrose$ghosthero.directed_follow_4=Ok, andiamo!
items.artifacts.driedrose$ghosthero.directed_follow_5=Ti copro.
items.artifacts.driedrose$ghosthero.directed_attack_1=Ok, attaccherò quello lì.
items.artifacts.driedrose$ghosthero.directed_attack_2=Lo prenderò.
items.artifacts.driedrose$ghosthero.directed_attack_3=Contatto...
items.artifacts.driedrose$ghosthero.directed_attack_4=Facciamoli fuori!
items.artifacts.driedrose$ghosthero.directed_attack_5=Ci penso io.
items.artifacts.driedrose$ghosthero.directed_position_1=Ok, manterrò la posizione.
items.artifacts.driedrose$ghosthero.directed_position_2=Andrò là e difenderò.
items.artifacts.driedrose$ghosthero.directed_position_3=Riposizionando...
items.artifacts.driedrose$ghosthero.directed_position_4=Arrivo!
items.artifacts.driedrose$ghosthero.directed_position_5=Andrò da quella parte.

items.artifacts.driedrose$ghosthero.desc=Una figura eterea dall'aspetto fragile con una forma umanoide. Il suo potere sembra legato alla rosa che possiedi.\n\nQuesto fantasma non sarà granché, ma pare essere il tuo unico vero amico quaggiù.

##back to artifacts
items.artifacts.etherealchains.name=catene eteree
items.artifacts.etherealchains.ac_cast=LANCIA
items.artifacts.etherealchains.rooted=Le tue catene non possono attrarre mentre sei immobilizzato.
items.artifacts.etherealchains.no_charge=Le tue catene non hanno abbastanza carica.
items.artifacts.etherealchains.cursed=Non puoi utilizzare catene maledette.
items.artifacts.etherealchains.does_nothing=Questo non farà nulla.
items.artifacts.etherealchains.cant_pull=Le tue catene non possono attrarre quel bersaglio.
items.artifacts.etherealchains.cant_reach=Le tue catene non possono arrivare là.
items.artifacts.etherealchains.inside_wall=Le tue catene possono solo attrarti attraverso i muri, non dentro di essi.
items.artifacts.etherealchains.nothing_to_grab=Non c'è nulla da afferrare qui.
items.artifacts.etherealchains.prompt=Scegli un punto da prendere di mira.
items.artifacts.etherealchains.desc=Queste ampie eppur leggere catene risplendono di energia spirituale. Possono essere usate per trasportarti verso un luogo, o attrarre nemici verso di te. La natura evanescente delle catene permette addirittura loro di estendersi attraverso i muri!
items.artifacts.etherealchains.desc_cursed=Le catene maledette sono serrate al tuo fianco, oscillando costantemente qua e là, tentando di ostacolarti o farti inciampare.
items.artifacts.etherealchains.desc_equipped=Le catene si appoggiano sul tuo fianco, spillando lentamente l'energia spirituale di quelli che sconfiggi. Ogni carica è un anello nella catena, che si estenderà di una casella esatta.
items.artifacts.etherealchains$chainsrecharge.levelup=Le tue catene diventano più forti!

items.artifacts.holytome.name=Tomo sacro
items.artifacts.holytome.ac_cast=LANCIA
items.artifacts.holytome.no_spell=Non sei in grado di lanciare quell'incantesimo al momento.
items.artifacts.holytome.cursed=Non puoi usare un tomo maledetto.
items.artifacts.holytome.levelup=Il tuo tomo diventa più forte!
items.artifacts.holytome.desc=Un tomo sacro che funziona da focus per la magia sacra del Chierico. Usare il tomo permette al Chierico di lanciare una varietà di incantesimi.\n\nIl tomo cresce in potere progressivamente con l'utilizzo da parte del Chierico, sbloccando più cariche massime e una maggiore velocità di ricarica di esse.
items.artifacts.holytome.discover_hint=Uno degli eroi inizia con questo oggetto.

items.artifacts.hornofplenty.name=cornucopia
items.artifacts.hornofplenty.ac_snack=SNACK
items.artifacts.hornofplenty.ac_eat=MANGIA
items.artifacts.hornofplenty.ac_store=DEPOSITA
items.artifacts.hornofplenty.eat=Ti alimenti dal corno.
items.artifacts.hornofplenty.prompt=Seleziona del cibo
items.artifacts.hornofplenty.no_food=Il corno non contiene cibo da mangiare!
items.artifacts.hornofplenty.full=Il corno è pieno di cibo!
items.artifacts.hornofplenty.reject=Il corno rigetta il blandofrutto crudo.
items.artifacts.hornofplenty.maxlevel=Il corno ha consumato tutto il cibo possibile!
items.artifacts.hornofplenty.levelup=Il corno consuma la tua offerta di cibo e cresce in forza!
items.artifacts.hornofplenty.feed=Il corno consuma la tua offerta di cibo.
items.artifacts.hornofplenty.desc=Non si può soffiare in questo corno, sembra però che si riempia di cibo via via che guadagni esperienza. Puoi consumare ogni carica da sola come se fosse un piccolo pasto oppure mangiare fino alla sazietà.
items.artifacts.hornofplenty.desc_hint=Magari è possibile aumentare il potere del corno fornendogli energia alimentare.
items.artifacts.hornofplenty.desc_cursed=Il corno maledetto si è legato al tuo fianco, sembra desideroso di sottrarre cibo piuttosto che produrne.

items.artifacts.lloydsbeacon.name=faro di lloyd
items.artifacts.lloydsbeacon.ac_zap=COLPISCI
items.artifacts.lloydsbeacon.ac_set=IMPOSTA
items.artifacts.lloydsbeacon.ac_return=RITORNA
items.artifacts.lloydsbeacon.no_charge=Il faro non ha abbastanza energia in questo momento.
items.artifacts.lloydsbeacon.tele_fail=La magia di teletrasporto fallisce.
items.artifacts.lloydsbeacon.prompt=Scegli un punto da colpire.
items.artifacts.lloydsbeacon.levelup=Il faro diventa più forte!
items.artifacts.lloydsbeacon.preventing=La forte aura magica di questo luogo ti impedisce di usare il faro di lloyd!
items.artifacts.lloydsbeacon.creatures=L'aura psichica delle creature circostanti non ti permette di usare il faro di lloyd in questo momento.
items.artifacts.lloydsbeacon.return=Il faro di lloyd è impostato con successo alla tua posizione attuale, ora puoi ritornare qui ogni volta che desideri.
items.artifacts.lloydsbeacon.desc=Il faro di lloyd è un complicato congegno magico che concede all'utilizzatore il controllo delle magie di teletrasporto. Il faro può essere usato per ritornare in una posizione definita, ma può anche espellere raffiche casuali di magia teletrasportante una volta ricaricato equipaggiandolo. Questa magia può essere diretta verso un bersaglio o verso gli utilizzatori stessi.
items.artifacts.lloydsbeacon.desc_set=Questo faro è stato posizionato da qualche parte nel piano %d di Pixel Dungeon.

items.artifacts.masterthievesarmband.name=bracciale del maestro dei ladri
items.artifacts.masterthievesarmband.ac_steal=RUBA
items.artifacts.masterthievesarmband.no_charge=Il tuo bracciale non ha abbastanza carica.
items.artifacts.masterthievesarmband.cursed=Non puoi usare un bracciale maledetto.
items.artifacts.masterthievesarmband.full=Il tuo bracciale è completamente carico!
items.artifacts.masterthievesarmband.prompt=Scegli un nemico da bersagliare
items.artifacts.masterthievesarmband.no_target=Devi bersagliare un nemico adiacente a te.
items.artifacts.masterthievesarmband.steal_shopkeeper=Non puoi rubare direttamente da un negoziante
items.artifacts.masterthievesarmband.no_steal=Quel nemico non ha niente da rubare.
items.artifacts.masterthievesarmband.stole_item=Hai rubato un oggetto: %s.
items.artifacts.masterthievesarmband.failed_steal=Non sei riuscito a rubare niente.
items.artifacts.masterthievesarmband.level_up=Il tuo bracciale diventa più forte!
items.artifacts.masterthievesarmband.desc=Questo bracciale di velluto porpora porta il marchio di un ladro mastro. Non ti appartiene, ma probabilmente non appartiene nemmeno al suo precedente utilizzatore.
items.artifacts.masterthievesarmband.desc_cursed=Il bracciale maledetto è legato al tuo polso e in qualche modo il tuo portamonete pare lentamente divenire più leggero...
items.artifacts.masterthievesarmband.desc_worn=Senti del potere che cresce nel bracciale al tuo polso mentre ottieni esperienza. Puoi usare questo potere per rubare dai negozi, o derubare nemici!\n\nDerubare un nemico è istantaneo, lo stordisce brevemente, e ti da la possibilità di ottenere il bottino che trasporta! Questo potere è più efficace contro nemici ignari. Derubare lo stesso nemico più volte non dà maggiori possibilità di ottenere bottino.

items.artifacts.sandalsofnature.name=sandali della natura
items.artifacts.sandalsofnature.name_1=scarpe della natura
items.artifacts.sandalsofnature.name_2=stivali della natura
items.artifacts.sandalsofnature.name_3=schinieri della natura
items.artifacts.sandalsofnature.ac_feed=CIBA
items.artifacts.sandalsofnature.ac_root=PIANTA
items.artifacts.sandalsofnature.prompt=Seleziona un seme
items.artifacts.sandalsofnature.levelup=Le tue calzature aumentano di dimensioni!
items.artifacts.sandalsofnature.absorb_seed=Le calzature assorbono il seme, sembrano più floride.
items.artifacts.sandalsofnature.no_effect=Devi prima dare un seme alle tue calzature.
items.artifacts.sandalsofnature.low_charge=Le tue calzature non hanno abbastanza energia per quello.
items.artifacts.sandalsofnature.prompt_target=Seleziona un posto
items.artifacts.sandalsofnature.out_of_range=Quel posto è troppo lontano.
items.artifacts.sandalsofnature.desc_1=Quelli che inizialmente sembravano sandali fatti di corda sono in realtà due piante! Sembrano molto deboli e pallidi, magari hanno bisogno di sostanze nutritive?
items.artifacts.sandalsofnature.desc_2=Le calzature sono cresciute ed ora assomigliano più a delle scarpe fatte su misura. Un po' di colore è ricomparso su di loro, magari potranno crescere ancora?
items.artifacts.sandalsofnature.desc_3=Le piante sono cresciute ancora e adesso assomigliano ad un paio di solidi stivali di corteccia. Paiono aver riacquistato la loro forza, ma magari potranno crescere ancora?
items.artifacts.sandalsofnature.desc_4=Le piante paiono aver raggiunto la loro taglia massima, assomigliano ad un paio di schinieri rinforzati. Gli schinieri sono di un marrone profondo e ricordano un albero robusto.
items.artifacts.sandalsofnature.desc_hint=Ti senti più in sintonia con la natura mentre indossi questo artefatto.
items.artifacts.sandalsofnature.desc_cursed=i sandali maledetti bloccano ogni sintonia con la natura.
items.artifacts.sandalsofnature.desc_ability=Le calzature brillano del colore dell'ultimo seme con cui le hai nutrito. Possono temporaneamente radicarsi nel terreno e produrre l'effetto di quella pianta dove vuoi in un raggio di 3 caselle.\nSeme: _%s_\nCarica necessaria: _%d%%_
items.artifacts.sandalsofnature.desc_seeds=Hai nutrito le calzature con i semi di %d.

items.artifacts.skeletonkey.name=chiave scheletrica
items.artifacts.skeletonkey.ac_insert=INSERISCI
items.artifacts.skeletonkey.cursed=Non puoi utilizzare una chiave scheletrica maledetta.
items.artifacts.skeletonkey.prompt=Scegli un bersaglio
items.artifacts.skeletonkey.invalid_target=Non c'è niente da bloccare o sbloccare qua.
items.artifacts.skeletonkey.lock_no_space=Non puoi bloccare un personaggio in una porta!
items.artifacts.skeletonkey.iron_charges=Aprire una serratura normale richiede 1 carica.
items.artifacts.skeletonkey.gold_charges=Aprire una serratura dorata richiede 2 cariche.
items.artifacts.skeletonkey.lock_charges=Bloccare una porta richiedere 2 cariche.
items.artifacts.skeletonkey.wall_charges=Creare un muro temporaneo richiede 2 cariche.
items.artifacts.skeletonkey.crystal_charges=Aprire una serratura di cristallo richiede 5 carche.
items.artifacts.skeletonkey.wont_open=Per qualche ragione la chiave si rifiuta di entrare in questa serratura.
items.artifacts.skeletonkey.locked_with_key=Quella porta è stata bloccata dalla tua chiave scheletrica.
items.artifacts.skeletonkey.force_lock=Il lucchetto si è indebolito senza la tua chiave scheletrica. Sei riuscito a sbloccarlo.
items.artifacts.skeletonkey.discard=Scarti le tue chiavi in eccesso.
items.artifacts.skeletonkey.levelup=La tua chiave scheletrica diventa più forte!
items.artifacts.skeletonkey.desc=Una chiave dall'aspetto importante con la testa a forma di teschio. I suoi denti sembrano diversi ogni volta che li guardi.
items.artifacts.skeletonkey.desc_worn=Sembra che questa chiave magica tragga potere quando la usi al posto delle regolari chiavi del dungeon. Può essere inserita in quasi ogni serratura del dungeon per aprirla o chiuderla, anche in quelle delle porte che non erano bloccate in precedenza.\n\nLa chiave può anche essere usata su uno spazio vuoto in una direzione cardinale o diagonale per 'bloccare' l'aria di fronte a te, creando un muro solido largo 3 caselle che dura per 10 turni. Bloccando spingerai via i nemici se c'è spazio per farlo.
items.artifacts.skeletonkey.desc_cursed=La chiave maledetta sembra star attivamente evitando di entrare in qualunque serratura, e ti sta anche rendendo difficile (ma non impossibile) usare le tue altre chiavi.
items.artifacts.skeletonkey$keywall.desc=Un muro magico temporaneo è stato posizionato qui dalla chiave scheletrica.

items.artifacts.talismanofforesight.name=talismano della preveggenza
items.artifacts.talismanofforesight.ac_scry=PROFETIZZA
items.artifacts.talismanofforesight.low_charge=Il talismano richiede almeno 5% di carica per scrutare i dintorni.
items.artifacts.talismanofforesight.prompt=Scegli un punto da esaminare.
items.artifacts.talismanofforesight.levelup=Il tuo talismano diventa più forte!
items.artifacts.talismanofforesight.full_charge=Il tuo talismano è completamente carico!
items.artifacts.talismanofforesight.desc=Una pietra liscia ricoperta di strane incisioni. Hai l'impressione che stia osservando ogni cosa attorno a te, alla ricerca di qualcosa di nascosto.
items.artifacts.talismanofforesight.desc_worn=Quando stringi il talismano avverti tuoi sensi amplificarsi. Il talismano sta acquisendo lentamente carica col passare del tempo e ogni qual volta che scopri porte nascoste o trappole.\n\nIl talismano può spendere la sua carica per 'profetizzare' una porzione a cono del livello, che rivelerà ogni casella e ogni segreto nell'area esaminata e ti permetterà di vedere nemici ed oggetti per un breve periodo di tempo.
items.artifacts.talismanofforesight.desc_cursed=Il talismano maledetto scruta intensamente dentro di te, attenuando i tuoi sensi.
items.artifacts.talismanofforesight$foresight.name=preveggenza
items.artifacts.talismanofforesight$foresight.uneasy=Ti senti a disagio.
items.artifacts.talismanofforesight$foresight.desc=Ti senti molto nervoso, come ci fosse un pericolo nascosto nelle vicinanze.

items.artifacts.timekeepershourglass.name=clessidra del padrone del tempo
items.artifacts.timekeepershourglass.ac_activate=ATTIVA
items.artifacts.timekeepershourglass.deactivate=Hai disattivato il congelamento del tempo.
items.artifacts.timekeepershourglass.no_charge=La tua clessidra non si è ancora caricata abbastanza da poter essere usata.
items.artifacts.timekeepershourglass.cursed=Non puoi utilizzare una clessidra maledetta.
items.artifacts.timekeepershourglass.onstasis=Il mondo pare mutare attorno a te in un istante.
items.artifacts.timekeepershourglass.onfreeze=Ogni cosa attorno a te diventa improvvisamente immobile.
items.artifacts.timekeepershourglass.stasis=Mettimi in stasi
items.artifacts.timekeepershourglass.freeze=Congela il tempo attorno a me
items.artifacts.timekeepershourglass.prompt=Come vuoi usare la magia della clessidra?\n\nDurante la stasi, il tempo scorrerà normalmente mentre tu sei congelato e completamente invulnerabile, consuma fino a 2 cariche alla volta.\n\nQuando il tempo è congelato, puoi muoverti come se le tue azioni non consumassero tempo. Questo può essere disattivato in qualsiasi momento usando la clessidra o attaccando.
items.artifacts.timekeepershourglass.desc=Questa grossa clessidra decorata pare senza pretese, ma avverti un grande potere all'interno della sua struttura intagliata. Come volti la clessidra e osservi la sabbia scorrere, puoi sentire la sua magia attrarti; di sicuro usare questa magia ti darà una qualche padronanza sul tempo.
items.artifacts.timekeepershourglass.desc_hint=La clessidra pare avere perso un po' di sabbia, se solo potessi trovarne un altro po'...
items.artifacts.timekeepershourglass.desc_cursed=La clessidra maledetta è bloccata al tuo fianco, puoi sentirla tentare di manipolare il tuo scorrere del tempo.
items.artifacts.timekeepershourglass$timefreeze.name=Blocco del Tempo
items.artifacts.timekeepershourglass$timefreeze.desc=Il tempo è fermo intorno a te, rendendoti capace di eseguire qualsiasi azione istantaneamente. L'effetto durerà finche non viene cancellato o la tua clessidra esaurirà le cariche. Anche attaccare o usare la magia terminerà questo effetto.\n\nTurni fino all'utilizzo della carica: %s.
items.artifacts.timekeepershourglass$sandbag.name=sacchetto di sabbia magica
items.artifacts.timekeepershourglass$sandbag.levelup=Aggiungi la sabbia alla tua clessidra.
items.artifacts.timekeepershourglass$sandbag.maxlevel=La tua clessidra è riempita con sabbia magica!
items.artifacts.timekeepershourglass$sandbag.no_hourglass=Non hai una clessidra in cui mettere questa sabbia.
items.artifacts.timekeepershourglass$sandbag.desc=Questa piccola borsa di sabbia minuta dovrebbe funzionare perfettamente con la tua clessidra.\n\nSembra strano che il negoziante abbia quest'oggetto specifico proprio quando ne hai bisogno...

items.artifacts.unstablespellbook.name=libro di magie instabile
items.artifacts.unstablespellbook.ac_read=LEGGI
items.artifacts.unstablespellbook.ac_add=AGGIUNGI
items.artifacts.unstablespellbook.blinded=Non puoi leggere dal libro mentre sei accecato.
items.artifacts.unstablespellbook.no_charge=Il tuo libro di magie ha terminato l'energia per ora.
items.artifacts.unstablespellbook.cursed=Non puoi leggere da un libro di magie maledetto.
items.artifacts.unstablespellbook.prompt=Seleziona una pergamena
items.artifacts.unstablespellbook.infuse_scroll=Hai instillato l'energia della pergamena nel libro.
items.artifacts.unstablespellbook.unable_scroll=Non sei in grado di aggiungere questa pergamena al libro.
items.artifacts.unstablespellbook.unknown_scroll=Non sei ancora sicuro che tipo di pergamena sia questa.
items.artifacts.unstablespellbook.desc=Questo Tomo è in condizioni sorprendentemente buone data la sua età. Crepita e scoppietta al movimento delle pagine, caricandosi di energia instabile. Se leggi questo libro, non c'è modo di sapere quale incantesimo potresti lanciare.
items.artifacts.unstablespellbook.desc_cursed=Il libro maledetto si è legato a te, inibendo la tua capacità di usare la maggior parte delle pergamene.
items.artifacts.unstablespellbook.desc_index=Il libro è incompleto. Il suo indice sta attualmente indicando le seguenti pagine vuote:
items.artifacts.unstablespellbook.desc_empowered=Le pergamene che hai aggiunto al libro brillano di potere. Sarai in grado di scegliere la versione esotica degli effetti di questa pergamena, al costo di una carica aggiuntiva.
items.artifacts.unstablespellbook.read_empowered=La pergamena che hai aggiunto al libro di magie si gonfia di energia. Sei in grado di scegliere la versione normale, oppure quella esotica dell'effetto di questa pergamena.\n\nScegliere la variante esotica costerà 2 cariche invece di una.



###bags
items.bags.bag.name=zaino
items.bags.bag.discover_hint=Puoi comprare questo oggetto in un negozio.

items.bags.potionbandolier.name=cintura per pozioni
items.bags.potionbandolier.desc=Questa spessa bandoliera si adatta al tuo petto come una fascia, ha molte cinghie isolanti per contenere fiale di pozioni, borraccia o fiale di metallo liquido.\n\nMentre sei all'interno della bandoliera, le tue pozioni dovrebbero essere protette dal freddo.

items.bags.scrollholder.name=tubo per pergamene
items.bags.scrollholder.desc=Questo contenitore tubolare sembra contenere gli strumenti e le carte di un astronomo, ma le tue pergamene si adatteranno altrettanto bene. Ci sono anche alcuni scomparti laterali che possono contenere perfettamente cristalli magici, stili arcani e resina arcana.\n\nIl supporto non sembra molto infiammabile, quindi le tue pergamene dovrebbero essere al sicuro dal fuoco al suo interno.

items.bags.velvetpouch.name=sacchetto di velluto
items.bags.velvetpouch.desc=Questo piccolo sacchetto di velluto può contenere molti piccoli oggetti, come semi, pietre runiche e alcuni ingredienti alchemici.
items.bags.velvetpouch.discover_hint=Uno degli eroi inizia con questo oggetto.

items.bags.magicalholster.name=fodero magico
items.bags.magicalholster.desc=Questa sottile fondina è fatta di pelliccia di un qualche animale esotico, e possiede una potente magia che permette di immagazzinare una enorme quantità di armi a distanza.\n\nTi basterà infilare la mano nella fondina per trovare sempre l'oggetto che cerchi.\n\nGrazie alla magia della fondina, le bacchette si caricheranno in modo leggermente più veloce e le armi da lancio conservate al suo interno dureranno un po' di più.



###bombs
items.bombs.arcanebomb.name=bomba arcana
items.bombs.arcanebomb.desc=Questa bomba è stata intrisa di proprietà arcane. Esploderà in una potente esplosione simile all'attacco potenziato di Goo, infliggendo _%1$d-%2$d danni magici_ a qualsiasi cosa entro 2 caselle.
items.bombs.arcanebomb.discover_hint=Puoi creare questo oggetto tramite l'alchimia.

items.bombs.bomb.name=bomba
items.bombs.bomb.ac_lightthrow=ACCENDI e LANCIA
items.bombs.bomb.snuff_fuse=Spegni rapidamente la miccia della bomba.
items.bombs.bomb.ondeath=L'esplosione ti uccide...
items.bombs.bomb.rankings_desc=Ucciso da un'esplosione
items.bombs.bomb.desc=Una bomba a polvere nera piuttosto pesante. Un'esplosione di questa bomba infligge _%1$d-%2$d danni_ a qualsiasi cosa adiacente ad essa e distruggerà alcuni terreni o oggetti adiacenti.
items.bombs.bomb.desc_fuse=A quanto pare la miccia impiegherà un paio di turni per consumarsi una volta accesa.
items.bombs.bomb.desc_burning=La miccia della bomba si sta consumando, mantieni le distanze o spegnila!
items.bombs.bomb$doublebomb.name=due bombe
items.bombs.bomb$doublebomb.desc=Due bombe di polvere da sparo impilate, pare che ne riceverai una gratis!

items.bombs.firebomb.name=bomba incendiaria
items.bombs.firebomb.desc=Questa bomba è stata modificata per esplodere in un'area più ampia, infliggendo _%1$d-%2$d danni_ e diffondendo fiamme prolungate entro 2 caselle.
items.bombs.firebomb.discover_hint=Puoi creare questo oggetto tramite l'alchimia.

items.bombs.flashbangbomb.name=granata stordente
items.bombs.flashbangbomb.desc=Questa bomba personalizzata esploderà in un'esplosione di luce, suono ed elettricità quando esplode. Qualunque cosa entro 2 caselle  subirà _%1$d-%2$d danni_ dall'esplosione, altri 25%% danni dall'elettricità e rimarrà stordito per 10 turni.
items.bombs.flashbangbomb.discover_hint=Puoi creare questo oggetto tramite l'alchimia.

items.bombs.frostbomb.name=bomba gelata
items.bombs.frostbomb.desc=Questa bomba è stata modificata per esplodere in un'area più ampia, infliggendo _%1$d-%2$d danni_ e diffondendo una folata prolungata di aria gelida entro 2 caselle.
items.bombs.frostbomb.discover_hint=Puoi creare questo oggetto tramite l'alchimia.

items.bombs.holybomb.name=bomba sacra
items.bombs.holybomb.desc=Questa bomba è stata modificata per emettere luce sacra in un'area più ampia quando esplode. Qualunque cosa entro 2 caselle subirà _%1$d-%2$d danni_ dall'esplosione, e i nemici non morti o demoniaci subiranno ulteriori 50%% danni dalla luce sacra.
items.bombs.holybomb.discover_hint=Puoi creare questo oggetto tramite l'alchimia.

items.bombs.noisemaker.name=tric-trac
items.bombs.noisemaker.desc=Questa bomba personalizzata emetterà ripetutamente rumore quando la sua miccia si esaurisce. Quando qualcosa tocca la bomba, questa esploderà e infliggerà _%1$d-%2$d danni_ a qualsiasi cosa entro 2 caselle!
items.bombs.noisemaker.desc_burning=Il tric-trac sta ticchettando, esploderà quando qualcosa gli andrà vicino!
items.bombs.noisemaker.discover_hint=Puoi creare questo oggetto tramite l'alchimia.

items.bombs.smokebomb.name=bomba fumogena
items.bombs.smokebomb.desc=Questa bomba è stata modificata per emettere una densa nube di gas nello stesso momento in cui esplode. Infliggerà _%1$d-%2$d danni_ e diffonderà la nebbia avvolgente entro 2 caselle.
items.bombs.smokebomb.discover_hint=Puoi creare questo oggetto tramite l'alchimia.

items.bombs.regrowthbomb.name=bomba ricrescita
items.bombs.regrowthbomb.desc=Questa bomba personalizzata schizzerà liquido vivificante ovunque entro 3 tessere invece di esplodere. Nell’area colpita dall’esplosione germoglieranno rapidamente erba e piante. Tu e tutti gli alleati coinvolti nell'esplosione verrete guariti come se avessero bevuto una pozione curativa.
items.bombs.regrowthbomb.discover_hint=Puoi creare questo oggetto tramite l'alchimia.

items.bombs.shrapnelbomb.name=bomba shrapnel
items.bombs.shrapnelbomb.desc=Questa bomba è stata modificata con frammenti del metallo del DM-300, che si frammenteranno e voleranno ovunque quando esplode, infliggendo _%1$d-%2$d danni_ in un vasto raggio attorno alla bomba. Faresti meglio a nasconderti dietro qualcosa quando lo usi...
items.bombs.shrapnelbomb.discover_hint=Puoi creare questo oggetto tramite l'alchimia.

items.bombs.woollybomb.name=bomba lanosa
items.bombs.woollybomb.desc=Questa bomba personalizzata creerà un ampio campo di pecore magiche dopo l'esplosione. L'esplosione infliggerà _%1$d-%2$d danni_ a qualsiasi cosa entro 2 caselle. Le pecore bloccheranno il movimento e persisteranno per molto tempo! Tuttavia, le pecore non resisteranno a lungo in presenza di nemici potenti e potranno essere disperse manualmente prima interagendo con loro.
items.bombs.woollybomb.discover_hint=Puoi creare questo oggetto tramite l'alchimia.

###food
items.food.berry.name=bacca del dungeon
items.food.berry.eat_msg=Quella bacca era gustosa!
items.food.berry.desc=Questa piccola bacca è stata trovata dalla Cacciatrice tra la vegetazione del dungeon. Può essere mangiata velocemente, ristabilisce un po di sazietà, e potrebbe contenere qualche seme utile!
items.food.berry.discover_hint=Puoi trovare questo oggetto usando un talento dell'eroe specifico.

items.food.blandfruit.name=blandofrutto
items.food.blandfruit.cooked=blandofrutto cotto
items.food.blandfruit.sunfruit=solefrutto
items.food.blandfruit.rotfruit=marciofrutto
items.food.blandfruit.earthfruit=frutto della terra
items.food.blandfruit.blindfruit=frutto accecante
items.food.blandfruit.firefruit=frutto del fuoco
items.food.blandfruit.icefruit=frutto del ghiaccio
items.food.blandfruit.fadefruit=fiocofrutto
items.food.blandfruit.sorrowfruit=frutto del dolore
items.food.blandfruit.stormfruit=frutto della tempesta
items.food.blandfruit.dreamfruit=frutto regale
items.food.blandfruit.starfruit=frutto delle stelle
items.food.blandfruit.swiftfruit=agilefrutto
items.food.blandfruit.raw=Non puoi mangiarlo crudo.
items.food.blandfruit.desc=Così secco e inutile... forse stufarlo con un altro ingrediente potrebbe migliorarlo.
items.food.blandfruit.desc_cooked=Il frutto sì è gonfiato a causa del tempo passato nella pentola ed ha assorbito le proprietà del seme con cui è stato cotto. Possiederà gli effetti della pozione corrispondente al seme usato.
items.food.blandfruit.desc_eat=Sembra pronto per essere mangiato!
items.food.blandfruit.desc_throw=Sembra piuttosto instabile, sarebbe meglio lanciarlo.
items.food.blandfruit$chunks.name=pezzi di blandofrutto
items.food.blandfruit$chunks.desc=Il blandofrutto è esploso all'impatto, lasciando dietro di sé dei pezzetti inerti.\n\nMalgrado siano un po' sporchi, questi grossi pezzi di blandofrutto cotto appaiono perfettamente commestibili.

items.food.chargrilledmeat.name=carne alla griglia
items.food.chargrilledmeat.desc=Sembra una bistecca niente male.
items.food.chargrilledmeat.discover_hint=Puoi creare questo oggetto usando un altro cibo.

items.food.food.name=razione di cibo
items.food.food.ac_eat=MANGIA
items.food.food.eat_msg=Il cibo era delizioso!
items.food.food.desc=Niente di particolare qui: carne essiccata, qualche biscotto... cose così.

items.food.frozencarpaccio.name=carpaccio congelato
items.food.frozencarpaccio.invis=Vedi le tue mani diventare invisibili!
items.food.frozencarpaccio.hard=Senti la tua pelle indurirsi!
items.food.frozencarpaccio.refresh=Rinfrescante!
items.food.frozencarpaccio.better=Ti senti meglio!
items.food.frozencarpaccio.desc=È un pezzo di carne cruda congelata. L'unico modo per mangiarla è tagliandola in fettine sottili. E mangiata così è incredibilmente buona.
items.food.frozencarpaccio.discover_hint=Puoi creare questo oggetto usando un altro cibo.

items.food.meatpie.name=pasticcio di carne
items.food.meatpie.eat_msg=Quel cibo era incredibile!
items.food.meatpie.desc=Un delizioso pasticcio ripieno di carne saporita. Ti sazierà molto più di ogni altro pasto.
items.food.meatpie.discover_hint=Puoi creare questo oggetto tramite l'alchimia.

items.food.mysterymeat.name=carne misteriosa
items.food.mysterymeat.eat_msg=Questo cibo ha un sapore... strano.
items.food.mysterymeat.hot=Oh, è caldo!
items.food.mysterymeat.legs=Non ti senti più le gambe!
items.food.mysterymeat.not_well=Non ti senti bene.
items.food.mysterymeat.stuffed=Sei troppo pieno.
items.food.mysterymeat.desc=Mangia a tuo rischio e pericolo!
items.food.mysterymeat.discover_hint=Puoi trovare questo oggetto come bottino da certi nemici.
items.food.mysterymeat$placeholder.name=carne

items.food.phantommeat.name=carne fantasma
items.food.phantommeat.desc=Una grande bistecca traslucida e luccicante, tagliata da un piranha fantasma. Questa carne magica non ha bisogno di essere cucinata e garantisce una serie di benefici difensivi oltre a saziarti completamente. Quando viene mangiato garantisce l'invisibilità, pelle coriacea, un po' di guarigione e cura molti effetti dannosi.
items.food.phantommeat.discover_hint=Puoi trovare questo oggetto come bottino da certi nemici.

items.food.pasty.name=pasticcio
items.food.pasty.fish_name=pesce al vapore
items.food.pasty.amulet_name=amuleto di yendor?
items.food.pasty.egg_name=uovo di Pasqua
items.food.pasty.rainbow_name=pozione arcobaleno
items.food.pasty.shattered_name=torta verde
items.food.pasty.pie_name=torta di zucca
items.food.pasty.vanilla_name=torta blu
items.food.pasty.cane_name=bastoncino di zucchero
items.food.pasty.sparkling_name=pozione scintillante
items.food.pasty.desc=Un autentico pasticcio della Cornovaglia con il suo tradizionale ripieno di manzo e patate. Delizioso!
items.food.pasty.fish_desc=Un pesce intero al vapore, magicamente conservato su un letto di verdure. È tradizione conservare un po' di pesce per dopo in questo periodo dell'anno, quindi conserverai degli avanzi invece di mangiarlo tutto in una volta.\n\nBuon Capodanno Lunare!
items.food.pasty.amulet_desc=Hai finalmente trovato, l'amuleto magico - aspetta un minuto, questo è solo un cioccolato avvolto in alluminio che sembra un amuleto! Non ti concederà un potere illimitato, ma almeno ti riempirà e ti darà una piccola carica di artefatto.\n\nPesce d'aprile!
items.food.pasty.egg_desc=Un grande uovo di cioccolato, avvolto in una colorata pellicola gialla. C'è abbastanza cioccolato qui per riempirti, e lo zucchero potrebbe dare ai tuoi artefatti una piccola carica  extra.\n\nBuona Pasqua!
items.food.pasty.rainbow_desc=Questa pozione colorata è una specie di cibo liquido. Oltre a soddisfare la tua fame, contiene un po' di magia che calmerà un nemico adiacente che non sia un boss, rendendolo temporaneamente riluttante a combatterti.\n\nBuon orgoglio!
items.food.pasty.shattered_desc=Questa grande fetta di torta alla vaniglia ha confettini colorati e glassa verde. La torta è stata creata per celebrare anni di esperienza e ti garantirà una piccola quantità di quell'esperienza quando la mangerai.\n\nShattered Pixel Dungeon è stato rilasciato per la prima volta il 5 agosto 2014. Buon compleanno Shattered Pixel Dungeon!
items.food.pasty.pie_desc=Una grande fetta di torta di zucca. Il suo sapore dolce e speziato ti riempirà e ti darà un piccolo po' di guarigione.\n\nBuon Halloween!
items.food.pasty.vanilla_desc=Questa grande fetta di torta alla vaniglia ha confettini colorati e glassa blu. La torta è stata creata per celebrare anni di esperienza e ti garantirà una piccola quantità di quell'esperienza quando la mangerai.\n\nIl Pixel Dungeon originale è stato rilasciato per la prima volta il 4 dicembre 2012. Buon compleanno Pixel Dungeon!
items.food.pasty.cane_desc=Una enorme caramella dolce e zuccherata a forma di bastoncino. È abbastanza grande da saziarti e lo zucchero potrebbe dare alle tue bacchette un po' di carica extra.\n\nBuone Feste!
items.food.pasty.sparkling_desc=Questa pozione frizzante è una specie di cibo liquido. Placa la fame e simula lo spumante, ma in realtà non è alcolico. La sensazione di calore nella pancia ti garantirà un po' di protezione.\n\nBuon Anno!
items.food.pasty$fishleftover.name=avanzi di pesce
items.food.pasty$fishleftover.eat_msg=Quel cibo era ok.
items.food.pasty$fishleftover.desc=Alcuni pesci in eccesso dal tuo pasto precedente. Puoi mangiarli quando vuoi per ripristinare un po' di fame.

items.food.smallration.name=razione di cibo piccola
items.food.smallration.eat_msg=Quel cibo era ok.
items.food.smallration.desc=Ha lo stesso aspetto di una razione di cibo regolare. Ma più piccola.
items.food.smallration.discover_hint=Puoi comprare questo oggetto in un negozio.

items.food.stewedmeat.name=carne stufata
items.food.stewedmeat.eat_msg=Quel cibo era ok.
items.food.stewedmeat.desc=Stufare la carne l'ha purificata da ogni agente nocivo o parassiti. Dovrebbe essere sicura da mangiare.
items.food.stewedmeat.discover_hint=Puoi creare questo oggetto tramite l'alchimia.

items.food.supplyration.name=razione di cibo
items.food.supplyration.desc=Questa razione veniva lasciata nella prigione da e per i membri della gilda dei ladri. È specificamente progettato per essere mangiato in movimento e aiuta con imbrogli generali.\n\nAnche se non ti sazia tanto quanto una razione normale, può essere consumata rapidamente, fornisce un po' di guarigione diretta e ripristina la carica del mantello delle ombre del Ladro.
items.food.supplyration.discover_hint=Puoi trovare questo oggetto usando un talento dell'eroe specifico.



##journal items
items.journal.documentpage.name=pagina strappata
items.journal.documentpage.desc=Una pagina solitaria, probabilmente strappata da un qualche libro. Dovrai raccoglierla per poterla leggere.

items.journal.alchemypage.name=pagina strappata del libro d'alchimia
items.journal.alchemypage.desc=Una pagina strappata da una guida sull'alchimia.\n\nLa maggior parte del testo è troppo piccola da leggere da lontano, ma puoi distinguere il titolo della pagina:\n\n_"%s"_

items.journal.guidebook.name=Tomo sulla Padronanza dei Dungeon
items.journal.guidebook.hint_mobile=La tua guida ha consigli per te! Premi il pulsante lampeggiante del diario in alto a destra per leggerlo.
items.journal.guidebook.hint_desktop=La tua guida ha consigli per te! Selezionare il pulsante lampeggiante del diario (%s) in alto a destra per leggerlo.
items.journal.guidebook.hint_status=Guida
items.journal.guidebook.desc=Una guida per avventurieri, abbandonata qui da qualcuno che ha deciso che l'esplorazione di dungeon non faceva per lui. Questo libro è magico e può avvisarti al momento giusto quando c'è una pagina da leggere.\n\nNonostante questa caratteristica, il libro è più famoso a causa delle parole "Niente Panico!" scritte a grandi lettere sulla copertina.

items.journal.guidepage.name=pagina strappata della guida
items.journal.guidepage.desc=Una pagina strappata da una guida sull'avventurarsi.\n\nLa maggior parte del testo è troppo piccola da leggere da lontano, ma puoi distinguere il titolo della pagina:\n\n_"%s"_

items.journal.regionlorepage$sewers.name=lettera logora
items.journal.regionlorepage$sewers.desc=Sembra una lettera, scritta su un pezzo di carta sporco di terra. Dovrai raccoglierla per decifrare cosa c'è scritto.

items.journal.regionlorepage$prison.name=pagina del diario logora
items.journal.regionlorepage$prison.desc=Una pagina di un diario, o qualche altro tipo di enciclopedia, scritta su un pezzo di carta. Sembra essere messa meglio delle lettere che hai trovato nelle fogne, ma dovrai raccoglierla per poterla leggere.

items.journal.regionlorepage$caves.name=voce di un vecchio registro
items.journal.regionlorepage$caves.desc=Sembra una voce del registro di un esploratore, preservata sorprendentemente bene nonostante quanto vecchia sia. Raccoglila per leggerla.

items.journal.regionlorepage$city.name=tavoletta arrugginita
items.journal.regionlorepage$city.desc=Una piccola tavola metallica piena di ruggine con un messaggio inciso su di essa con la magia. Le lettere sono ancora chiare nonostante la sua età, ma dovrai raccoglierla per leggerla.

items.journal.regionlorepage$halls.name=tavoletta luminosa
items.journal.regionlorepage$halls.desc=Una piccola tavola nera con delle lettere verdi incise su di essa. Le lettere luminose sono sfocate da lontano, dovrai raccoglierla per leggerla.


###keys
items.keys.goldenkey.name=chiave d'oro
items.keys.goldenkey.desc=Le incisioni su questa chiave dorata sono minuziose e complicate. Magari aprirà il lucchetto di uno scrigno?

items.keys.crystalkey.name=Chiave di cristallo
items.keys.crystalkey.desc=La superficie levigata di questa chiave cristallina brilla nell'oscurità. Forse può aprire qualcosa fatto di cristallo?

items.keys.ironkey.name=chiave di ferro
items.keys.ironkey.desc=Le incisioni su questa vecchia chiave di ferro sono molto consumate; il suo cordino di cuoio è rovinato dal tempo.\nQuale porta potrà aprire?

items.keys.wornkey.name=chiave logora
items.keys.wornkey.desc=Questa chiave è logora e scolorita, ma ha un'aspetto importante. Probabilmente è in grado di aprire qualche porta molto importante.



