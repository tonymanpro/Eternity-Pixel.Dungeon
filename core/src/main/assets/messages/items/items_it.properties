items.armor.armor.ac_detach=DISTACCA
items.armor.armor.detach_seal=Distacchi il sigillo dalla tua armatura.
items.armor.armor.equip_cursed=L'armatura ti si stringe addosso dolorosamente.
items.armor.armor.identify=Ora hai abbastanza familiarità con la tua armatura da poterla identificare.
items.armor.armor.hardening_gone=L'indurimento di questa armatura è svanito!
items.armor.armor.incompatible=L'interazione tra diversi tipi di magia ha cancellato il glifo su quest'armatura!
items.armor.armor.curr_absorb=Questa armatura di _livello %1$d_ blocca _%2$d-%3$d danni_ e richiede _%4$d forza_ per essere usata correttamente.
items.armor.armor.avg_absorb=Tipicamente questa armatura di _livello %1$d_ blocca _%2$d-%3$d danni_ e richiede _%4$d forza_ per essere usata correttamente.
items.armor.armor.too_heavy=A causa della tua forza inadeguata indossare quest'armatura diminuirà la tua abilità di muoversi, schivare e difendersi.
items.armor.armor.probably_too_heavy=Probabilmente questa armatura è troppo pesante per te.
items.armor.armor.excess_str=Per via della tua forza in eccesso, sei _più sfuggente_ mentre indossi quest'armatura.
items.armor.armor.evasion=È incrementata per migliorare _l'evasività._
items.armor.armor.defense=È incrementata per migliorare _la difesa._
items.armor.armor.inscribed=è inscritto con _%s._
items.armor.armor.glyph_hardened=È stata _rinforzata._
items.armor.armor.hardened_no_glyph=Questa armatura è stata _rinforzata_, ma attualmente non è incisa con un glifo.
items.armor.armor.cursed_worn=Poiché questa armatura è maledetta, non ti è possibile rimuoverla.
items.armor.armor.cursed=Puoi percepire un'energia maligna nascondersi in questa armatura.
items.armor.armor.weak_cursed=Nonostante la maledizione, puoi toglierti quest'armatura.
items.armor.armor.not_cursed=Questa armatura è libera da magia ostile.
items.armor.armor.seal_attached=Il sigillo rotto del Guerriero è attaccato a questa armatura. Quando sta per essere portato a meno della metà della vita, gli fornirà _%d di scudo.
items.armor.armor.seal_transfer=Il sigillo rotto del Guerriero deve essere fissato sulla sua armatura attualmente indossata per beneficiarne. Vuoi staccare automaticamente il sigillo dall'armatura che stai rimuovendo e fissarlo sull'armatura che stai equipaggiando?
items.armor.armor.seal_transfer_yes=sì
items.armor.armor.seal_transfer_no=no
items.armor.armor$glyph.glyph=glifo
