items.scrolls.exotic.exoticscroll.unknown_desc=Una brillante e indecifrabile runa magica è scritta su questa pergamena nera. Pare provenga da una terra straniera, chissà che effetto avrà quando letta ad alta voce?
items.scrolls.exotic.exoticscroll.discover_hint=Puoi creare questo oggetto tramite l'alchimia.

items.scrolls.exotic.scrollofsirenssong.name=pergamena del canto delle sirene
items.scrolls.exotic.scrollofsirenssong.prompt=Scegli un bersaglio
items.scrolls.exotic.scrollofsirenssong.no_target=La pergamena si attiva senza bersaglio.
items.scrolls.exotic.scrollofsirenssong.cancel=Devi scegliere un obiettivo.
items.scrolls.exotic.scrollofsirenssong.desc=Leggere questa pergamena produce una suadente melodia che incanta il nemico preso di mira facendolo diventare un allato in modo permanente! Gli altri nemici che la odono ne sono temporaneamente affascinati.
items.scrolls.exotic.scrollofsirenssong$enthralled.name=affascinato
items.scrolls.exotic.scrollofsirenssong$enthralled.desc=Questa creatura è sotto l'effetto della magia di una pergamena di Canto delle Sirene.\n\nI personaggi ammaliati sono alleati permanenti e combattono contro qualunque nemico essi incontrino.

items.scrolls.exotic.scrollofantimagic.name=pergamena dell'anti-magia
items.scrolls.exotic.scrollofantimagic.desc=L'incantesimo di questa pergamena ti circonderà di un'aura che blocca temporaneamente ogni effetto magico, sia benigno che dannoso. Questo include la maggior parte degli effetti magici come bacchette, pergamene, anelli, artefatti e maledizioni. Tuttavia, le abilità eroiche dell'armatura sono abbastanza forti da funzionare a prescindere.

items.scrolls.exotic.scrollofchallenge.name=pergamena di sfida
items.scrolls.exotic.scrollofchallenge.desc=Quando viene letta a voce alta, questa pergamena scatena un grande ruggito che attira dei nemici attorno a chi la usa ed allo stesso tempo crea una piccola arena attorno ad essi.\n\nDurante tutto il temp in cui il lettore rimane nell'arena, riceverà il 33% di danni in meno qualunque sia la loro origine (si applica prima di ogni altra forme di riduzione del danno)  e non perderanno sazietà.\n\nLe dimensioni dell'arena sono proporzionali a quelle dell'area in cui il lettore si trova: sarà particolarmente piccola in alcune aree nelle quali si trova un boss.
items.scrolls.exotic.scrollofchallenge$challengearena.name=arena di sfida
items.scrolls.exotic.scrollofchallenge$challengearena.desc=Intorno a te è apparsa un'arena magica, indicata da una fluttuante nebbia rossa.\n\nMentre sei nella nebbia, la tua fame non aumenterà e subirai 33%% danni in meno da tutte le fonti. Se disponi di altre fonti di riduzione del danno (come l'armatura), queste si applicheranno dopo la riduzione di 33%%.\n\nTurni rimanenti: %d.

items.scrolls.exotic.scrollofdivination.name=pergamena della divinazione
items.scrolls.exotic.scrollofdivination.nothing_left=Non c'è rimasto niente da identificare!
items.scrolls.exotic.scrollofdivination.desc=Questa pergamena identificherà casualmente quattro tipi di oggetti che al momento non conosci. I tipi identificati possono essere il colore di una pozione, la runa di una pergamena o la gemma di un anello. Gli oggetti identificati non saranno necessariamente quelli che stai trasportando.
items.scrolls.exotic.scrollofdivination$wnddivination.desc=La tua pergamena di divinazione ha identificato i seguenti oggetti:

items.scrolls.exotic.scrollofdread.name=pergamena del terrore
items.scrolls.exotic.scrollofdread.desc=Quando viene letta, questa pergamena emete un lampo di luce che instilla un incredibile terrore in tutti i nemici che si trovano nel tuo campo visivo. L'effetto è così grande che essi cercheranno di fuggire rapidamente ed abbandoneranno per sempre il dungeon!\n\nCome nel caso del normale Terrore, l'effetto può  svanire col passare del tempo o se il nemico viene attaccato.\n\nI nemici dalla grande forza di volontà, come i boss, saranno presi dal normale terrore

items.scrolls.exotic.scrollofenchantment.name=pergamena dell'incantamento
items.scrolls.exotic.scrollofenchantment.inv_title=Incanta un oggetto
items.scrolls.exotic.scrollofenchantment.weapon=Seleziona un incantamento da applicare alla tua arma.
items.scrolls.exotic.scrollofenchantment.armor=Seleziona un glifo da applicare alla tua armatura.
items.scrolls.exotic.scrollofenchantment.cancel=annulla
items.scrolls.exotic.scrollofenchantment.cancel_warn=L'annullamento consumerà comunque la tua pergamena dell'incantesimo, sei sicuro?
items.scrolls.exotic.scrollofenchantment.cancel_warn_yes=Sì, sono sicuro
items.scrolls.exotic.scrollofenchantment.cancel_warn_no=No, ho cambiato idea
items.scrolls.exotic.scrollofenchantment.desc=Questa pergamena infonderà un'arma o un'armatura con una potente energia magica. Il lettore ha persino qualche capacità di controllo sul tipo di magia infusa.

items.scrolls.exotic.scrollofforesight.name=pergamena della preveggenza
items.scrolls.exotic.scrollofforesight.desc=Dopo aver letto questa pergamena, i dettagli del terreno saranno percepiti in modo molto nitido dalla mente del lettore. L'effetto dura per un tempo considerevole e rivela tutte le trappole e le porte segrete, rendendo la ricerca non più necessaria.

items.scrolls.exotic.scrollofmetamorphosis.name=pergamena di metamorfosi
items.scrolls.exotic.scrollofmetamorphosis.choose_desc=Scegli un talento da trasformare
items.scrolls.exotic.scrollofmetamorphosis.replace_desc=Scegli un nuovo talento da sostituire a quello che hai trasformato.
items.scrolls.exotic.scrollofmetamorphosis.cancel_warn=L'annullamento consumerà comunque la tua pergamena della metamorfosi, sei sicuro?
items.scrolls.exotic.scrollofmetamorphosis.metamorphose_talent=Trasforma talento
items.scrolls.exotic.scrollofmetamorphosis.desc=Questa pergamena contiene una potente magia di trasmutazione, che si applica al lettore anziché ad un oggetto. La magia di questa pergamena ti permette di scegliere un talento e sostituirlo con uno di cinque dello stesso livello da diverse classi di Eroi!\n\nQuesto effetto si applica solo ai talenti della classe, non a quelli guadagnati dalle sottoclassi o dalle abilità dell'armatura. Non ti sarà proposta la scelta di talenti che non puoi utilizzare.

items.scrolls.exotic.scrollofmysticalenergy.name=pergamena di energia mistica
items.scrolls.exotic.scrollofmysticalenergy.desc=Il primordiale potere magico legato a questa pergamena ricaricherà, quando rilasciato, tutti gli artefatti nel corso del tempo.

items.scrolls.exotic.scrollofpassage.name=pergamena del varco
items.scrolls.exotic.scrollofpassage.desc=L'incantesimo su questa pergamena trasporta istantaneamente il lettore al primo piano della regione. Molto comoda per raggiungere rapidamente un negozio.

items.scrolls.exotic.scrollofprismaticimage.name=pergamena dell'immagine prismatica
items.scrolls.exotic.scrollofprismaticimage.desc=L'incantesimo di questa pergamena creerà una variopinta illusione-clone del lettore. Questa immagine prismatica si comporta come un clone più debole del lettore, con difesa simile ma minore salute e capacità offensiva.\n\nL'immagine prismatica si rivelerà quando i nemici saranno presenti e tenterà di difendere il lettore.\n\nSe un'immagine prismatica esiste già, usare questa pergamena la guarirà completamente.

items.scrolls.exotic.scrollofpsionicblast.name=pergamena di esplosione psionica
items.scrolls.exotic.scrollofpsionicblast.ondeath=L'esplosione psionica fa a pezzi la tua mente...
items.scrolls.exotic.scrollofpsionicblast.desc=Questa pergamena contiene un'incredibile energia distruttiva che può essere canalizzata in modo da fare a pezzi le menti di tutte le creature visibili.\n\nC'è un rilevante effetto collaterale comunque e il lettore verrà anch'esso danneggiato, accecato e indebolito. Più bersagli colpisce la pergamena, meno danni auto-inflitti verranno ricevuti.



###spells
items.spells.alchemize.name=alchimizzazione
items.spells.alchemize.prompt=Alchimizza un oggetto
items.spells.alchemize.desc=Questo incantesimo contiene poteri trasmutativi simili a quelli che si trovano in un vaso alchemico. Ogni lancio consente all'utente di trasformare un oggetto (o una pila di oggetti) in oro o energia alchemica. Trasformare pozioni o pergamene in energia li identificherà persino!\n\nAlcuni usi dell'Alchimizzazione vengono venduti nei negozi, ma molti altri possono essere realizzati utilizzando l'alchimia combinando un seme, una pietra runica e un po' di energia alchemica.
items.spells.alchemize$wndalchemizeitem.sell=Convertine 1 in %dg
items.spells.alchemize$wndalchemizeitem.sell_1=Convertine 1 in %dg
items.spells.alchemize$wndalchemizeitem.sell_all=Converti tutti in %dg
items.spells.alchemize$wndalchemizeitem.energize=Trasforma in %d di energia
items.spells.alchemize$wndalchemizeitem.energize_1=Trasforma 1 in %d di energia
items.spells.alchemize$wndalchemizeitem.energize_all=Trasforma tutto in %d energia

items.spells.beaconofreturning.name=faro del ritorno
items.spells.beaconofreturning.preventing=La forte aura magica di questo luogo ti impedisce di usare la formula magica!
items.spells.beaconofreturning.creatures=L'aura psichica delle creature circostanti non ti permette di teletrasportarti in questo momento.
items.spells.beaconofreturning.set=Il faro è impostato con successo alla tua posizione attuale.
items.spells.beaconofreturning.wnd_body=Impostarlo sovrascriverà la posizione precedentemente salvata dal faro.\n\nRitornare ti riporterà alla tua ultima posizione impostata e consumerà un uso della formula magica.
items.spells.beaconofreturning.wnd_set=Imposta
items.spells.beaconofreturning.wnd_return=Ritorna
items.spells.beaconofreturning.desc_set=Questo faro è stato impostato da qualche parte nel piano %d.
items.spells.beaconofreturning.desc=Questa complicata magia permette a chi la usa l'abilità di ritornare in un luogo impostato, a prescindere dalla distanza. La magia verrà consumata solo al ritorno e può essere impostata quante volte vorrai, ma ricorderà solamente l'ultima posizione assegnata.

items.spells.curseinfusion.name=infusione del maleficio
items.spells.curseinfusion.inv_title=Maledici un oggetto
items.spells.curseinfusion.desc=Questa magia infonde un pezzo di equipaggiamento con la stessa potente magia maligna presente all'interno di DM-300. L'oggetto su cui viene utilizzata sarà immediatamente maledetto e qualsiasi incantesimo o glifo che potesse avere verrà sovrascritto.\n\nNel caso di armi, armature e bacchette, l'oggetto otterrà potenziamenti oltre ad essere maledetto. I potenziamenti dell'infusione maledetta non si accumulano e vengono persi se l'oggetto diventa non maledetto.\n\nÈ anche possibile utilizzare più infusioni maledette per cambiare la maledizione su un'arma o un'armatura.

items.spells.spell.ac_cast=LANCIA
items.spells.spell.no_magic=Non puoi lanciare magie mentre sei immune alla magia.
items.spells.spell.discover_hint=Puoi creare questo oggetto tramite l'alchimia.

items.spells.magicalinfusion.name=infusione magica
items.spells.magicalinfusion.inv_title=Infondi un oggetto
items.spells.magicalinfusion.infuse=Il tuo oggetto viene infuso con magia arcana!
items.spells.magicalinfusion.desc=Questo incantesimo possiede lo stesso potere magico di una pergamena di potenziamento, ma in una forma più stabile.\n\nOltre a potenziare un oggetto, infatti, non cancellerà mai un incantesimo, un glifo o una maledizione.

items.spells.magicalporter.name=facchino magico
items.spells.magicalporter.inv_title=Trasporta un oggetto
items.spells.magicalporter.nowhere=Non c'è nessun posto in cui tu possa trasportare l'oggetto.
items.spells.magicalporter.desc=Questa formula magica trasporterà qualunque oggetto su di cui viene lanciata. Diversamente dal faro del mercante comunque, l'oggetto verrà trasportato all'entrata del successivo livello del boss.

items.spells.phaseshift.name=cambio di fase
items.spells.phaseshift.no_target=Non c'è niente da teletrasportare lì.
items.spells.phaseshift.desc=Questa caotica formula magica teletrasporterà qualunque personaggio bersagliato in un luogo casuale del piano attuale, stordendoli per un prolungato periodo di tempo. Nemici potenti saranno in grado di resistere l'effetto stordente. Questa magia può venire direzionata su di un bersaglio o sull'utilizzatore stesso.

items.spells.reclaimtrap.name=bonifica trappola
items.spells.reclaimtrap.no_trap=Non c'è nessuna trappola lì.
items.spells.reclaimtrap.desc_trap=l'incantesimo è attualmente pronto per utilizzare un _%s._
items.spells.reclaimtrap.desc=Questo incantesimo contiene i resti dell'energia meccanica di DM-300. Quando lanciato su una trappola attiva, il potere della trappola verrà immagazzinato in te, permettendoti di utilizzare di nuovo l'incantesimo per rilasciare questo potere e attivare l'effetto della trappola in un punto a tua scelta.\n\nComunque sia, alcune trappole potrebbero non funzionare in alcuni luoghi, e può essere immagazzinata solo una trappola per volta.

items.spells.recycle.name=riciclo
items.spells.recycle.inv_title=Ricicla un oggetto
items.spells.recycle.recycled=Il tuo oggetto è stato riciclato in: %s.
items.spells.recycle.desc=Quest'incantesimo possiede una forma più debole di trasmutazone magica. Non funziona sugli equipaggiamenti ma può trasformare una pergamena, una pozione, un seme, una pietra runica o un dardo imbevuto in un oggetto a caso dello stesso tipo.

items.spells.summonelemental.name=evocazione elementale
items.spells.summonelemental.ac_imbue=INSTILLA
items.spells.summonelemental.imbue_prompt=Impregna un oggetto
items.spells.summonelemental.desc=Quest'incantesimo incanala l'energia delle braci elementali usate per crearlo e ti consente di evocare un elementale amico che combatterà con te! Puoi evocare un solo elementale alla volta, ma l'incantesimo può essere ri-lanciato per far ritornare l'elementale da te senza costo.
items.spells.summonelemental.desc_newborn=L'incantesimo non è stato infuso ed evocherà un _elementale neonato_ senza un attacco a distanza. Puoi infondere l'incantesimo in una pozione del Fuoco Liquido o del Ghiaccio, oppure in una pergamena della Ricarica o della Trasmutazione per potenziarlo, in modo che la sua futura evocazione sarà un elementale dotato di tutti i poteri!
items.spells.summonelemental.desc_fire=L'incantesimo è attualmente caldo al tatto, evocherà un _elementale del fuoco_. Puoi infondere un oggetto diverso, ma l'incantesimo perderà l'infusione attuale.
items.spells.summonelemental.desc_frost=L'incantesimo è attualmente freddo al tatto e evocherà un _elementale del gelo_. Puoi infondere un oggetto diverso, ma l'incantesimo perderà l'infusione attuale.
items.spells.summonelemental.desc_shock=L'incantesimo attualmente irradia energia statica, evocherà un _elementale shock_. Puoi infondere un oggetto diverso, ma l'incantesimo perderà l'infusione attuale.
items.spells.summonelemental.desc_chaos=L'incantesimo attualmente irradia energia caotica, evocherà un _elementale del caos_. Puoi infondere un oggetto diverso, ma l'incantesimo perderà l'infusione attuale.

items.spells.targetedspell.prompt=Scegli un bersaglio
items.spells.targetedspell.inv_title=Infondi un oggetto

items.spells.telekineticgrab.name=presa telecinetica
items.spells.telekineticgrab.cant_grab=Non puoi afferrarlo.
items.spells.telekineticgrab.no_target=Non c'è niente da afferrare lì.
items.spells.telekineticgrab.desc=Quest'incantesimo consente a chi lo pronuncia di afferrare da lontano ogni oggetto in un certo punto oppure ogni arma da lancio conficcata in un nemico!\n\nNon si può usare per attrarre a sé oggetti che qualcun altro possiede né contenitori come le casse.

items.spells.unstablespell.name=incantesimo instabile
items.spells.unstablespell.desc=Questo piccolo cristallo quadrato nero presenta simboli runici mobili su ciascuna delle sue superfici.\n\nQuando attivato, attiverà l'effetto di una pergamena casuale. L'effetto della pergamena sarà sempre focalizzato sul combattimento se ci sono nemici nel tuo campo visivo, altrimenti sarà sempre non focalizzato sul combattimento.

items.spells.wildenergy.name=energia selvaggia
items.spells.wildenergy.desc=Questa formula magica contiene un po' dell'energia malefica che alimenta DM-300. Quando lanciata ricaricherà le tue bacchette e i tuoi artefatti consunti, scatenando inoltre un effetto di bacchetta maledetta casuale. Sei comunque in grado di scegliere una direzione di lancio del maleficio.


###runestones
items.stones.inventorystone.ac_use=USA

items.stones.runestone$placeholder.name=pietra runica
items.stones.runestone.discover_hint=Puoi trovare questo oggetto casualmente nel dungeon, o crearlo tramite l'alchimia.

items.stones.stoneofaggression.name=pietra dell'aggressività
items.stones.stoneofaggression.desc=Quando la pietra viene lanciata su un'alleato o un nemico, tutti i nemici nelle vicinanze preferiranno attaccare quel personaggio per un corto periodo di tempo.\n\nTuttavia, i boss nemici possono resistere all'effetto, riducendo significativamente la durata e subendo meno danni dagli attacchi dei loro minion.
items.stones.stoneofaggression$aggression.name=preso di mira
items.stones.stoneofaggression$aggression.desc=Della magia manipolativa sta inducendo tutti i nemici nelle vicinanze a preferire di colpire questo personaggio.\n\nTurni rimanenti: %s.

items.stones.stoneofaugmentation.name=pietra dell'incremento
items.stones.stoneofaugmentation.inv_title=Incrementa un oggetto
items.stones.stoneofaugmentation.desc=Questa pietra runica possiede una potente magia che può incrementare l'equipaggiamento per migliorare una proprietà al costo di un'altra.\n\nUsandola su di un'arma ti permetterà di migliorarne la velocità o il danno. Inoltre le armi da lancio otterranno o perderanno durabilità in proporzione alla loro velocità.\n\nUsandola su di un'armatura ti permetterà di migliorarne la difesa o l'evasività.
items.stones.stoneofaugmentation.discover_hint=Puoi comprare questo oggetto in un negozio, o crearlo tramite l'alchimia.
items.stones.stoneofaugmentation$wndaugment.choice=Cosa vorresti migliorare?
items.stones.stoneofaugmentation$wndaugment.speed=Velocità
items.stones.stoneofaugmentation$wndaugment.damage=Danno
items.stones.stoneofaugmentation$wndaugment.evasion=Evasività
items.stones.stoneofaugmentation$wndaugment.defense=Difesa
items.stones.stoneofaugmentation$wndaugment.none=Rimuovi Incremento
items.stones.stoneofaugmentation$wndaugment.cancel=Lascia perdere

items.stones.stoneofblast.name=pietra dell'esplosione
items.stones.stoneofblast.desc=Questa pietra runica esploderà immediatamente nel luogo in cui è lanciata. Proprio come una bomba, l'esplosione arrecherà danno a qualunque cosa vicina.

items.stones.stoneofblink.name=pietra del guizzo
items.stones.stoneofblink.desc=Questa pietra runica teletrasporterà l'utilizzatore nel posto in cui viene lanciata.

items.stones.stoneofclairvoyance.name=pietra della chiaroveggenza
items.stones.stoneofclairvoyance.desc=Questa pietra rivelerà istantaneamente ogni casella in un'ampia area attorno al luogo di lancio. I suoi effetti si estenderanno perfino attraverso i muri.

items.stones.stoneofdeepsleep.name=pietra del sonno profondo
items.stones.stoneofdeepsleep.desc=Quando questa pietra viene gettata contro un nemico, esso piomberà in un profondo sonno magico. I nemici addormentati magicamente dormiranno per sempre, finché non saranno disturbati.

items.stones.stoneofdetectmagic.name=pietra di individuazione della magia
items.stones.stoneofdetectmagic.inv_title=Rivela un oggetto
items.stones.stoneofdetectmagic.detected_none=Non rilevi alcuna magia che influisca su questo oggetto.
items.stones.stoneofdetectmagic.detected_both=Rilevi sia la magia positiva che quella malevola che influenzano questo oggetto!
items.stones.stoneofdetectmagic.detected_good=Rilevi la magia positiva che influenza questo oggetto!
items.stones.stoneofdetectmagic.detected_bad=Rilevi una magia malevola che colpisce questo oggetto!
items.stones.stoneofdetectmagic.desc=Questa pietra runica è in grado di rilevare la magia che influenza un oggetto. Usare questa pietra su un oggetto non identificato ti dirà se è affetto da una maledizione malevola e se è affetto da magia positiva come un incantesimo o potenziamenti.

items.stones.stoneofdisarming.name=pietra del disarmo
items.stones.stoneofdisarming.desc=Questa pietra runica contiene magia che può disinnescare le trappole dannose nascoste ovunque nel dungeon. Disarmerà fino a 9 trappole attorno all'area in cui viene lanciata.

items.stones.stoneofenchantment.name=pietra dell'incantamento
items.stones.stoneofenchantment.inv_title=Incanta un oggetto
items.stones.stoneofenchantment.weapon=La tua arma brilla nell'oscurità!
items.stones.stoneofenchantment.armor=La tua armatura brilla nell'oscurità!
items.stones.stoneofenchantment.desc=Questa pietra runica possiede una magia incantante. A differenza di una pergamena di miglioramento, non aumenterà la potenza diretta di un oggetto ma piuttosto instillerà un'arma o un'armatura con un incantamento, assegnandole un nuovo potere.

items.stones.stoneoffear.name=pietra della paura
items.stones.stoneoffear.desc=Quando questa pietra viene gettata contro un personaggio, esso sarà sopraffatto dal terrore e fuggirà. Attaccare un personaggio in fuga riduce la durata dell'effetto.

items.stones.stoneofflock.name=pietra del gregge
items.stones.stoneofflock.desc=Questa pietra runica evoca pecore magiche nella posizione di destinazione per un breve periodo.

items.stones.stoneofintuition.name=pietra dell'intuizione
items.stones.stoneofintuition.inv_title=Seleziona un oggetto
items.stones.stoneofintuition.desc=Questa pietra runica contiene una versione più debole della magia che si trova nelle pergamene di identificazione. Invece di identificare direttamente un oggetto, funzionerà sul tuo intuito permettendoti di provare a identificare una pozione, pergamena o anello tirando a indovinare.
items.stones.stoneofintuition.break_info=Puoi usare le pietre dell'intuizione due volte prima che una si rompa, _il tuo prossimo utilizzo non consumerà una pietra_.
items.stones.stoneofintuition.break_warn=Hai usato una pietra dell'intuizione in precedenza, quindi _il tuo prossimo utilizzo consumerà una pietra_.
items.stones.stoneofintuition$wndguess.text=Indovina la natura dell'oggetto sconosciuto. Se la supposizione è corretta, verrà identificato!
items.stones.stoneofintuition$wndguess.correct=Corretto. L'oggetto è stato identificato!
items.stones.stoneofintuition$wndguess.incorrect=La tua ipotesi era sbagliata.
items.stones.stoneofintuition$wndguess.break=La tua pietra dell'intuizione si sbriciola in polvere...

items.stones.stoneofshock.name=pietra della scossa
items.stones.stoneofshock.desc=Questa pietra runica scatena una tempesta elettrica che stordirà brevemente ogni bersaglio vicino e donerà al lanciatore carica per le bacchette per ogni bersaglio colpito.


###trinkets
items.trinkets.chaoticcenser.name=incensiere caotico
items.trinkets.chaoticcenser.spew=Il tuo incensiere sta per emettere: %s.
items.trinkets.chaoticcenser.desc=Dopo un po' di tempo nel vaso dell'alchimia, questo incensiere sembra produrre fumo da solo! Questi gas si accumulano e fuoriescono dall'incensiere in direzioni casuali e a intervalli semi-casuali. Sembra in grado di produrre tutti i tipi di gas, ma avrai un avvertimento poco prima che l'incensiere si attivi.
items.trinkets.chaoticcenser.typical_stats_desc=In genere questo gingillo genererà un gas nocivo vicino ad un nemico circa ogni _%d_ turni. I gas appariranno solo quando ci sono dei nemici presenti. A livelli più alti, questi gas hanno più probabilità di essere rari e potenti.
items.trinkets.chaoticcenser.stats_desc=Al livello attuale, questo gingillo genererà un gas nocivo vicino ad un nemico circa ogni _%d_ turni. I gas appariranno solo quando ci sono dei nemici presenti. A livelli più alti, questi gas hanno più probabilità di essere rari e potenti.

items.trinkets.crackedspyglass.name=cannocchiale crepato
items.trinkets.crackedspyglass.desc=Questo telescopio portatile sarebbe una dimostrazione di una grande e fina abilità professionale, se non fosse per la crepa lungo le lenti frontali. Sembra che il cannocchiale ti stia aiutando a rivelare nuovi oggetti nel dungeon, ma a causa dei suoi difetti gli oggetti rivelati sono abbastanza difficili da vedere!
items.trinkets.crackedspyglass.typical_stats_desc=Di solito questo gingillo ha una _probabilità del %1$s%%_ di creare un oggetto nascosto in ogni piano senza un boss.
items.trinkets.crackedspyglass.stats_desc=A questo livello, questo gingillo ha una _probabilità del %1$s%%_ di creare un oggetto nascosto in ogni piano senza un boss.
items.trinkets.crackedspyglass.stats_desc_upgraded=A questo livello, questo gingillo ha una _probabilità del 100%%_ di creare un oggetto nascosto in ogni piano senza un boss, e una _probabilità del %1$s%%_ di creare un secondo oggetto nascosto.

items.trinkets.dimensionalsundial.name=meridiana dimensionale
items.trinkets.dimensionalsundial.warning=La tua meridiana non proietta ombra, ti senti a disagio.
items.trinkets.dimensionalsundial.desc=Questa piccola meridiana portatile in qualche modo è in grado di proiettare un'ombra nelle profondità del dungeon, anche se non la stai tenendo in verticale. Persino più stranamente, la posizione dell'ombra sembra non avere relazione con il sole in questo mondo. Quando nessuna ombra viene proiettata, la meridiana sembra attirare il pericolo.
items.trinkets.dimensionalsundial.typical_stats_desc=In genere questo ninnolo ridurrà il tasso di generazione dei nemici di _%1$d%%_ durante il giorno nella vita reale (8:00-20:00) e aumenterà il tasso di generazione dei nemici di _%2$d%%_ durante la notte (20:00-8:00).
items.trinkets.dimensionalsundial.stats_desc=Al suo livello attuale, questo ninnolo ridurrà il tasso di generazione dei nemici di _%1$d%%_ durante il giorno nella vita reale (8:00-20:00) e aumenterà il tasso di generazione dei nemici di _%2$d%%_ durante la notte (20:00-8:00).

items.trinkets.exoticcrystals.name=cristalli esotici
items.trinkets.exoticcrystals.desc=Questi piccoli cristalli rosa hanno la stessa forma dei cristalli di energia alchemica. Sebbene non possano essere usati direttamente per ottenere energia, sembra che essi influenzino in qualche modo le pozioni e le pergamene che trovi.
items.trinkets.exoticcrystals.typical_stats_desc=In genere questo ninnolo sostituirà _%s%%_ di pozioni o gocce di pergamena con i loro equivalenti esotici. Ciò non influisce su pozioni di forza, pergamene di potenziamento o oggetti generati per aiutare a risolvere le stanze pericolose.
items.trinkets.exoticcrystals.stats_desc=Al suo livello attuale questo ninnolo sostituirà _%s%%_ di pozioni o gocce di pergamena con i loro equivalenti esotici. Ciò non influisce su pozioni di forza, pergamene di potenziamento o oggetti generati per aiutare a risolvere le stanze pericolose.

items.trinkets.eyeofnewt.name=occhio di tritone
items.trinkets.eyeofnewt.desc=Quest'occhio di tritone dorato e nero è un ingrediente comune, ora migliorato in gingillo. L'occhio sembra star riducendo la tua visione in cambio del concederti di vedere le cose in altri modi.
items.trinkets.eyeofnewt.typical_stats_desc=In genere questo ninnolo ridurrà il tuo raggio visivo di _%1$s%%_, ma ti garantirà anche la visione mentale sui nemici entro _%2$d_ tessere.
items.trinkets.eyeofnewt.stats_desc=Al suo livello attuale, questo monile ridurrà il tuo raggio visivo di _%1$s%%_, ma ti garantirà anche la visione mentale sui nemici entro _%2$d_ tessere.

items.trinkets.ferrettuft.name=ciocca di furetto
items.trinkets.ferrettuft.desc=Una ciocca di pelo bianco vellutato di furetto, tenuta assieme da un fiocco verde lime annodato in una curva. I furetti sono conosciuti per la loro agilità, birbanteria e mancanza di integrità. Un po' di quel potere sembra emanare dal gingillo, aumentando l'evasione di tutte le creature vicine.
items.trinkets.ferrettuft.typical_stats_desc=In generale questo gingillo aumenterà l'evasione di tutti i personaggi del _%1$s%%_.
items.trinkets.ferrettuft.stats_desc=Al suo attuale livello, questo gingillo aumenterà l'evasione di tutti i personaggi del _%1$s %%_.

items.trinkets.mimictooth.name=dente di imitatore
items.trinkets.mimictooth.desc=Questo grande dente affilato deve essere stato estratto da un imitatore molto infelice. Sembra che stia influenzando gli imitatori nel dungeon, rendendoli più frequenti e pericolosi.
items.trinkets.mimictooth.typical_stats_desc=In genere questo ninnolo renderà tutti i tipi di imitatori _%1$sx_ più comuni e molto più difficili da individuare, ma aumenterà anche la quantità di bottino che rilasciano. Ogni piano del dungeon avrà anche una _%2$s%%_ possibilità di contenere un imitatore d'ebano extra furtivo.
items.trinkets.mimictooth.stats_desc=Al livello attuale, questo ninnolo renderà tutti i tipi di mimic _%1$sx_ più comuni e molto più difficili da individuare, ma aumenterà anche la quantità di bottino che rilasciano. Ogni piano del dungeon avrà anche una _%2$s%%_ possibilità di contenere un mimic d'ebano extra furtivo.

items.trinkets.mossyclump.name=ciuffo muschioso
items.trinkets.mossyclump.desc=Questo ciuffo di muschio bagnato sembra trattenere la sua umidità, indipendentemente da quanto tu lo strizzi. Sembra essere magicamente legato al dungeon stesso, rendendo più probabile la comparsa di erba e acqua.
items.trinkets.mossyclump.typical_stats_desc=In genere questo gingillo farà sì che il _%d%%_ dei piani regolari si riempiano di acqua o erba.\n\nQuesto gingillo costa una quantità di energia più grande per essere migliorato.
items.trinkets.mossyclump.stats_desc=Al suo livello attuale, questo gingillo farà sì che il _%d%%_ dei piani regolari si riempiano di acqua o erba.\n\nQuesto gingillo costa una quantità di energia più grande per essere migliorato.

items.trinkets.parchmentscrap.name=pezzo di cartapecora
items.trinkets.parchmentscrap.desc=Questo piccolo pezzo di cartapecora sembra provenire da una pergamena. Ha conservato parte della sua magia e sembra influenzare armi e armature trovate nel dungeon.
items.trinkets.parchmentscrap.typical_stats_desc=In genere questo ninnolo renderà gli incantesimi e i glifi _%dx_ più comuni, e le maledizioni su armi e armature _%sx_ più comuni. Le maledizioni su bacchette, anelli o artefatti non vengono influenzate.\n\nQuesto ninnolo costa una quantità di energia più grande per essere migliorato.
items.trinkets.parchmentscrap.stats_desc=Al livello attuale, questo monile renderà comuni gli incantesimi e i glifi _%dx_ e comuni le maledizioni su armi e armature _%sx_. Le maledizioni su bacchette, anelli o artefatti non vengono influenzate.\n\nQuesto ninnolo costa una quantità di energia più grande per essere aggiornato.

items.trinkets.petrifiedseed.name=seme pietrificato
items.trinkets.petrifiedseed.desc=Questo seme è stato fossilizzato, da lenti processi geologici o dalla magia. Questo seme sembra influenzare magicamente la flora del dungeon, occasionalmente sostituendo i semi delle piante con pietre runiche.
items.trinkets.petrifiedseed.typical_stats_desc=In genere questo ninnolo farà sì che l'erba calpestata lasci cadere pietre runiche invece dei semi _%1$s%%_ del tempo, e farà anche sì che l'erba alta lasci cadere oggetti _%2$s%%_ più spesso.
items.trinkets.petrifiedseed.stats_desc=Al suo livello attuale, questo ninnolo farà sì che l'erba calpestata lasci cadere pietre runiche invece dei semi _%1$s%%_ del tempo, e farà anche sì che l'erba alta lasci cadere oggetti _%2$s%%_ più spesso.

items.trinkets.ratskull.name=teschio di ratto
items.trinkets.ratskull.desc=Questo macabro gingillo non è più grosso del teschio di un ratto normale, una rarità giù in questo dungeon. L'influenza magica del teschio sembra attrarre gli abitanti più rari del dungeon, facendoli apparire più spesso.
items.trinkets.ratskull.typical_stats_desc=In genere questo ninnolo farà apparire rari nemici esotici _%dx_. Tuttavia, il teschio è efficace solo la metà nell'attrarre imitatori di cristallo e statue corazzate.
items.trinkets.ratskull.stats_desc=Al suo livello attuale, questo monile renderà più probabile la comparsa di rari nemici esotici _%dx_. Tuttavia, il teschio è efficace solo la metà nell'attrarre imitatori di cristallo e statue corazzate.

items.trinkets.saltcube.name=cubetto di sale
items.trinkets.saltcube.desc=Questo grande cristallo di sale è stato tagliato in una forma cubica quasi perfetta e in qualche modo è riuscito a drenare metà dell'acqua dal vaso alchemico invece di dissolversi. Sembra che disidrati e preservi magicamente il cibo che mangi, prolungando il senso di sazietà che provi, ma anche diminuendo il ripristino della tua salute quando non sei affamato.
items.trinkets.saltcube.typical_stats_desc=In genere questo gingillo aumenterà la quantità di tempo prima che tu diventi affamato di _%1$s%%_, ma ridurrà anche il tuo tasso di rigenerazione della salute di _%2$s%%_ a meno che il livello non sia bloccato.
items.trinkets.saltcube.stats_desc=Al suo livello attuale, questo gingillo aumenterà la quantità di tempo prima che tu diventi affamato di _%1$s%%_, ma ridurrà anche il tuo tasso di rigenerazione della salute di _%2$s%%_ a meno che il livello non sia bloccato.

items.trinkets.shardofoblivion.name=frammento di oblio
items.trinkets.shardofoblivion.desc=Dopo essere stato stufato nel pentolone dell'alchimia, questo piccolo frammento di metallo maledetto è cambiato ed è fatto di... niente? La luce sembra piegarsi attorno ad esso e rimane sospeso sul posto quando non lo tieni. Sembra che il frammento tragga magicamente potere dalla tua ignoranza, quindi probabilmente è meglio non pensarci troppo.
items.trinkets.shardofoblivion.typical_stats_desc=In genere questo gingillo aumenterà la possibilità che i nemici rilascino bottino di 20%% per ogni pezzo di equipaggiamento non identificato equipaggiato o recentemente utilizzato, fino a un massimo di _%d oggetto(i)_. Il frammento inoltre ti impedirà di identificare l'equipaggiamento automaticamente, ma può anche essere usato per identificare manualmente gli oggetti che sono pronti per esserlo.
items.trinkets.shardofoblivion.stats_desc=Al livello attuale, questo gingillo aumenterà la possibilità che i nemici rilascino bottino di 20%% per ogni pezzo di equipaggiamento non identificato equipaggiato o recentemente utilizzato, fino a un massimo di _%d oggetto(i)_. Il frammento inoltre ti impedirà di identificare l'equipaggiamento automaticamente, ma può anche essere usato per identificare manualmente gli oggetti che sono pronti per esserlo.
items.trinkets.shardofoblivion.ac_identify=IDENTIFICA
items.trinkets.shardofoblivion.identify_prompt=Identificare un oggetto
items.trinkets.shardofoblivion.identify_ready=Un oggetto è pronto per essere identificato: %s. Utilizza il tuo Frammento di Oblio su di esso per identificarlo.
items.trinkets.shardofoblivion.identify_ready_worn=Gli oggetti che indossi sono tutti pronti per identificarli.. Utilizza il tuo Frammento di Oblio su oggetti per identificarli.
items.trinkets.shardofoblivion.identify_not_yet=L'elemento non è ancora pronto per essere identificato.
items.trinkets.shardofoblivion.identify=Identifichi l'oggetto!
items.trinkets.shardofoblivion$wandusetracker.name=Bacchetta usata non identificata
items.trinkets.shardofoblivion$wandusetracker.desc=Recentemente hai utilizzato una bacchetta non identificata, che conta come un pezzo di equipaggiamento usato non identificato per il frammento dell'oblio per un po'.\n\nTurni rimanenti: %s
items.trinkets.shardofoblivion$thrownusetracker.name=Arma da Lancio Usata non Identificata
items.trinkets.shardofoblivion$thrownusetracker.desc=Recentemente hai utilizzato un'arma da lancio non identificata, che conta come un pezzo di equipaggiamento usato non identificato per il frammento dell'oblio per un po'.\n\nTurni rimanenti: %s

items.trinkets.thirteenleafclover.name=trifoglio a tredici foglie
items.trinkets.thirteenleafclover.desc=In qualche modo, stufare nel pentolone dell'alchimia questo trifoglio gli ha fatto sviluppare un mucchio di foglie extra! Non è proprio chiaro se questo gingillo sia fortunato o sfortunato, forse questo gingillo renderà la tua fortuna più caotica?
items.trinkets.thirteenleafclover.typical_stats_desc=In genere questo gingillo ti causerà di applicare il massimo del danno il _%1$d%%_ delle volte, e il minimo del danno il _%2$d%%_ delle volte.
items.trinkets.thirteenleafclover.stats_desc=Al livello attuale, questo gingillo ti causerà di applicare il massimo del danno il _%1$d%%_ delle volte, e il minimo del danno il _%2$d%%_ delle volte.

items.trinkets.trapmechanism.name=meccanismo a trappola
items.trinkets.trapmechanism.desc=Il meccanismo principale di una delle trappole fossa del dungeon, accuratamente estratto dal pavimento in modo da poter essere trasportato. Sembra magicamente legato al dungeon stesso, rendendo più comune il terreno pericoloso ma anche incrementando la tua affinità ad esso.
items.trinkets.trapmechanism.typical_stats_desc=In genere questo gingillo farà si che il _%1$d%%_ dei piani regolari si riempiano invece di trappole o fossati. In più, il _%2$d%%_ delle trappole nascoste del dungeon saranno visibili.
items.trinkets.trapmechanism.stats_desc=Al suo livello attuale questo gingillo farà si che il _%1$d%%_ dei piani regolari si riempiano invece di trappole o fossati. In più, il _%2$d%%_ delle trappole nascoste del dungeon saranno visibili.

items.trinkets.vialofblood.name=fiala di sangue
items.trinkets.vialofblood.desc=Questa sottile fiala contiene il sangue di qualche abitante del dungeon e si muove lentamente mentre ruoti la fiala. Sembra che aumenti magicamente gli effetti curativi più forti, ma li ritarda anche.
items.trinkets.vialofblood.typical_stats_desc=In genere questo ninnolo aumenterà la salute generale che guadagni bevendo pozioni curative, otri o pozzi di salute di _%1$s%%_. Tuttavia, questi effetti curativi avverranno anche più lentamente, rigenerando un massimo di _%2$s_ HP per turno (questo scala con il livello dell'eroe).
items.trinkets.vialofblood.stats_desc=Al suo livello attuale, questo monile aumenterà la salute generale che ottieni bevendo pozioni curative, otri o pozzi di salute di _%1$s%%_. Tuttavia, questi effetti curativi avverranno anche più lentamente, rigenerando un massimo di _%2$s_ HP per turno (questo scala con il livello dell'eroe).

items.trinkets.wondrousresin.name=resina meravigliosa
items.trinkets.wondrousresin.desc=Questa resina blu scintillante sembra possedere l'essenza distillata della magia di una bacchetta maledetta. La magia del calderone alchemico sembra averla stabilizzata in qualche modo, e adesso sta influenzando le tue bacchette.
items.trinkets.wondrousresin.typical_stats_desc=In genere questo ninnolo forzerà gli effetti della bacchetta maledetta a diventare neutri o positivi _%1$s%%_ del tempo, e farà sì che le bacchette non maledette sparino un ulteriore colpo maledetto neutro o positivo _%2$s%%_ del tempo.\n\nQuesto gingillo costa una quantità di energia più grande per essere migliorato.
items.trinkets.wondrousresin.stats_desc=Al suo livello attuale, questo gingillo forzerà gli effetti della bacchetta maledetta a diventare neutri o positivi _%1$s%%_ del tempo, e farà sì che le bacchette non maledette sparino un ulteriore colpo maledetto neutro o positivo _%2$s%%_ del tempo.\n\nQuesto ninnolo costa una quantità di energia più grande per essere aggiornato.

items.trinkets.trinketcatalyst.name=catalizzatore magico
items.trinkets.trinketcatalyst.window_title=crea un gingillo
items.trinkets.trinketcatalyst.window_text=L'acqua comincia a brillare quando aggiungi il catalizzatore. Ci sono alcuni oggetti nelle vicinanze che potresti infondere di energia per trasformarli in gingilli magici.
items.trinkets.trinketcatalyst.desc=Questa palla di polvere dorata magica luccica nell'oscurità del dungeon. Questo catalizzatore può essere usato in un calderone alchemico con un po' di energia alchemica per produrre un gingillo unico.\n\nI gingilli forniscono diversi effetti che modificano leggermente il dungeon o i suoi abitanti. I gingilli possono essere potenziati con più energia per rendere i loro effetti più potenti, o lasciati per rinunciare del tutto al loro effetto.
items.trinkets.trinketcatalyst$randomtrinket.name=gingillo casuale
items.trinkets.trinketcatalyst$randomtrinket.desc=Un oggetto nelle vicinanze è bloccato in una custodia che non puoi aprire.\n\nIl processo alchemico dissolverà il sacchetto, ma non saprai quale ninnolo otterrai finché non lo farai!

items.trinkets.trinket.discover_hint=Questo oggetto ha la possibilità di essere un opzione tutte le volte che crei un oggetto attraverso l'alchimia.
items.trinkets.trinket$placeholder.name=gingillo

###wands
items.wands.cursedwand.ondeath=Sei stato ucciso dal tuo stesso %s.
items.wands.cursedwand.nothing=Non succede nulla.
items.wands.cursedwand.mass_invuln=Una luce brillante erutta dalla tua bacchetta!
items.wands.cursedwand.petrify=All'improvviso ti blocchi sul posto!
items.wands.cursedwand.grass=Dell'erba spunta tutto intorno a te!
items.wands.cursedwand.fire=Senti puzza di bruciato...
items.wands.cursedwand.transmogrify_wand=La tua bacchetta si trasmuta in un oggetto diverso!
items.wands.cursedwand.transmogrify_other=La tua bacchetta si trasmuta in qualcosa di diverso!
items.wands.cursedwand.disguise=Il tuo aspetto cambia davanti ai tuoi occhi!
items.wands.cursedwand.supernova=Una sfera ardente di energia inizia a crescere. Potresti voler scappare!
items.wands.cursedwand.supernova_positive=Una sfera ardente di energia inizia a crescere, ma in qualche modo ci si sente al sicuro.
items.wands.cursedwand.sinkhole=Il terreno comincia a sgretolarsi attorno a te!
items.wands.cursedwand.sinkhole_positive=Il terreno inizia a cedere, ma sembra abbastanza solido sotto di te.
items.wands.cursedwand.gravity=La gravità inizia improvvisamente a tirare in direzioni casuali!
items.wands.cursedwand.gravity_positive=La gravità inizia improvvisamente a tirare in direzioni casuali, ma questo non sembra influenzarti.
items.wands.cursedwand.gravity_end=Il caos gravitazionale finisce.

items.wands.damagewand.upgrade_stat_name_1=Danno Magico

items.wands.wand.ac_zap=COLPISCI
items.wands.wand.fizzles=La tua bacchetta emette fievoli scoppiettii; sarà scarica.
items.wands.wand.no_magic=La tua bacchetta emette fievoli scoppiettii; non puoi usare bacchette mentre sei immune alla magia.
items.wands.wand.self_target=Non puoi puntarlo su te stesso!
items.wands.wand.identify=Ora hai abbastanza familiarità con la tua bacchetta magica per poterla identificare.
items.wands.wand.resin_one=Questa bacchetta ha guadagnato _1 livello_ grazie alla resina arcana.
items.wands.wand.resin_many=Questa bacchetta ha guadagnato _%d livelli_ grazie alla resina arcana.
items.wands.wand.cursed=Questa bacchetta è maledetta, rendendo la sua magia disordinata e casuale.
items.wands.wand.not_cursed=Questa bacchetta è libera da magia ostile.
items.wands.wand.curse_discover=Questo %s è maledetto!
items.wands.wand.prompt=Scegli un punto da colpire
items.wands.wand$placeholder.name=bacchetta

items.wands.wandofblastwave.name=bacchetta dell'onda d'urto
items.wands.wandofblastwave.staff_name=bastone dell'onda d'urto
items.wands.wandofblastwave.ondeath=Ti sei ucciso con la tua stessa bacchetta dell'onda d'urto...
items.wands.wandofblastwave.knockback_ondeath=La collisione ti ha ucciso...
items.wands.wandofblastwave.desc=Questa bacchetta è composta da una sorta di pietra marmorea, rivestita d'oro e con una gemma nera tonda in cima. La senti molto pesante nella tua mano.
items.wands.wandofblastwave.typical_stats_desc=Questa bacchetta spara un dardo che esplode violentemente nel punto bersaglio. La forza di questa esplosione in genere infligge _%1$d-%2$d danni_ ed è abbastanza forte da far volare la maggior parte dei nemici.
items.wands.wandofblastwave.stats_desc=Questa bacchetta spara un dardo che esplode sul bersaglio. La forza d'urto infligge _%1$d-%2$d punti danno_ ed è forte abbastanza da far volare via la maggior parte dei nemici.
items.wands.wandofblastwave.upgrade_stat_name_2=Respinta
items.wands.wandofblastwave.bmage_desc=Quando _il Mago Guerriero_ colpisce un nemico paralizzato con una staffa dell'onda d'urto, consumerà la paralisi per infliggere uno scoppio di danni magici bonus. Questo ha un tempo di recupero per ciascun nemico.
items.wands.wandofblastwave.eleblast_desc=Un'esplosione elementale con un bastone dell'onda d'urto infligge il 67% di danno e butta fuori tutti i nemici dall'area dell'esplosione.

items.wands.wandofcorrosion.name=bacchetta della corrosione
items.wands.wandofcorrosion.staff_name=bastone della corrosione
items.wands.wandofcorrosion.desc=Questa bacchetta possiede un corpo cinereo che conduce ad una gemma arancione brillante.
items.wands.wandofcorrosion.stats_desc=Questa bacchetta spara un dardo che esplode in una nuvola di gas altamente corrosivo in una posizione mirata. Qualsiasi cosa all'interno di tale nuvola riceverà danno crescente nel tempo, a partire da _%d danni._
items.wands.wandofcorrosion.upgrade_stat_name_1=Danni da corrosione
items.wands.wandofcorrosion.upgrade_stat_name_2=Volume del gas
items.wands.wandofcorrosion.bmage_desc=Quando _il Mago Guerriero_ colpisce un nemico con un bastone della corrosione, c'è la possibilità che il nemico venga ricoperto di acido corrosivo.
items.wands.wandofcorrosion.eleblast_desc=Un'esplosione elementale con una bacchetta della corrosione infligge ai nemici 4 turni di corrosione, iniziando con 6 punti danno.

items.wands.wandofcorruption.name=bacchetta della corruzione
items.wands.wandofcorruption.staff_name=bastone della corruzione
items.wands.wandofcorruption.already_corrupted=Quel personaggio non può essere condizionato ulteriormente.
items.wands.wandofcorruption.desc=Questa bacchetta irradia un'energia oscura, come se non fosse già abbastanza ovvio, visto e considerato il piccolo teschio decorativo modellato sulla punta.
items.wands.wandofcorruption.stats_desc=Questa bacchetta rilascerà uno scoppio di energia corruttiva, cercando di piegare i nemici al tuo volere. Gli avversari sono in grado di resistere alla corruzione, ma i nemici indeboliti sono molto più facili da corrompere rispetto a quelli in salute.
items.wands.wandofcorruption.upgrade_stat_name_1=Potere corruttore
items.wands.wandofcorruption.upgrade_stat_name_2=Durata del depotenziamento
items.wands.wandofcorruption.bmage_desc=Quando _il Mago Guerriero_ colpisce un nemico con un bastone della corruzione, c'è la possibilità che il nemico diventi frenetico.
items.wands.wandofcorruption.eleblast_desc=Un'esplosione elementale con un bastone della corruzione infligge ai nemici 5 turni di frenesia.

items.wands.wandofdisintegration.name=bacchetta della disintegrazione
items.wands.wandofdisintegration.staff_name=bastone della disintegrazione
items.wands.wandofdisintegration.desc=Questa bacchetta è ottenuta da un solido pezzo di ossidiana e una profonda luce purpurea scorre dai suoi lati fino alla punta. Brilla con un'energia distruttiva, impaziente di sprigionarsi.
items.wands.wandofdisintegration.stats_desc=Questa bacchetta spara un raggio in grado di penetrare qualunque ostacolo e la sua portata aumenterà a ogni miglioramento. Il raggio infligge _%1$d-%2$d punti danno,_ più un bonus tanti più nemici e muri trapassa.
items.wands.wandofdisintegration.upgrade_stat_name_2=Portata massima
items.wands.wandofdisintegration.bmage_desc=Quando è impugnato dal _Mago Guerriero_, il bastone della disintegrazione ha un raggio di attacco maggiore, come se avesse incantesimo prominente.
items.wands.wandofdisintegration.eleblast_desc=Un'esplosione elementale con un bastone della disintegrazione infligge il 100% di danno e passa attraverso i muri.

items.wands.wandoffireblast.name=bacchetta dell'esplosione infuocata
items.wands.wandoffireblast.staff_name=bastone dell'esplosione infuocata
items.wands.wandoffireblast.desc=Questa bacchetta è fatta di legno laccato di rosso con foglie dorate generosamente disposte per farla apparire piuttosto maestosa. Scoppietta e sibila sulla punta, bramosa di scatenare la sua potente magia.
items.wands.wandoffireblast.stats_desc=Questa bacchetta emette un cono di fuoco quando viene usata. Il suo prossimo attacco utilizzerà _%1$d cariche_ ed infliggerà _%2$d-%3$d danni._ Più cariche vengono usate, più grande e più forte sarà l'effetto.
items.wands.wandoffireblast.upgrade_stat_name_1=1 Danno da carica
items.wands.wandoffireblast.upgrade_stat_name_2=2 Danno da carica
items.wands.wandoffireblast.upgrade_stat_name_3=3 Danno da carica
items.wands.wandoffireblast.bmage_desc=Quando _il Mago Guerriero_ colpisce un nemico con un bastone dell'esplosione infuocata, c'è la possibilità che il nemico produca un'esplosione che infligge danni ai nemici e consuma tutto il fuoco circostante! Questa possibilità aumenta maggiore è il fuoco attorno al nemico.
items.wands.wandoffireblast.eleblast_desc=Un'esplosione elementale con un bastone dell'esplosione infuocata infligge il 100% di danno e manda a fuoco nemici e terreno.

items.wands.wandoffrost.name=bacchetta del congelamento
items.wands.wandoffrost.staff_name=bastone del congelamento
items.wands.wandoffrost.desc=Questa bacchetta sembra essere ricavata da un qualche tipo di ghiaccio magico. Acquista luminosità alla volta della sua punta arrotondata. È molto fredda al tatto quando impugnata, ma in qualche modo la tua mano resta calda.
items.wands.wandoffrost.stats_desc=Questa bacchetta spara raffiche di energia ghiacciata verso i tuoi avversari, infliggendo _%1$d-%2$d punti danno_ e causando brividi. L'effetto pare più forte nell'acqua. I nemici già raffreddati e congelati riceveranno meno danni da questa bacchetta, poiché sono già freddi.
items.wands.wandoffrost.upgrade_stat_name_2=Durata del raffreddamento
items.wands.wandoffrost.bmage_desc=Quando _il Mago Guerriero_ colpisce un nemico raffreddato con un bastone del congelamento, c'è la possibilità che tale nemico venga congelato istantaneamente. Questa possibilità aumenta se il nemico è già raffreddato.
items.wands.wandoffrost.eleblast_desc=Un'esplosione elementale con un bastone del congelamento infligge il 100% di danno, congela i nemici e spegne gli incendi.

items.wands.wandoflightning.name=bacchetta del fulmine
items.wands.wandoflightning.staff_name=bastone del fulmine
items.wands.wandoflightning.ondeath=Ti sei ucciso con la tua stessa bacchetta del fulmine...
items.wands.wandoflightning.desc=Questa bacchetta è fatta di solido metallo, rendendola sorprendentemente pesante. Due rebbi si estendono curvi sulla punta, emettendo archi elettrici.
items.wands.wandoflightning.stats_desc=Questa bacchetta irradia potenti fulmini, creando archi attraverso ogni cosa bersagliata e infliggendo _%1$d-%2$d punti danno._ Quest'elettricità può rimbalzare tra molti nemici vicini. Il fulmine di questa bacchetta potrebbe ferirti, ma non ferirà i tuoi compagni.
items.wands.wandoflightning.bmage_desc=Quando _il Mago Combattente_ colpisce un nemico con un bastone di fulmini, ha la possibilità di caricarsi elettricamente per 10 turni. Una volta caricato, il Mago Combattente è immune ai danni causati dai fulmini e li spingerà oltre.
items.wands.wandoflightning.eleblast_desc=Un'esplosione elementale con un bastone del fulmine infligge il 100% di danno, paralizza i nemici per 5 turni ed elettrizza l'acqua.
items.wands.wandoflightning$lightningcharge.name=caricato elettricamente
items.wands.wandoflightning$lightningcharge.desc=Attualmente il Mago Combattente è carico di energia, il che gli garantisce l'immunità ai fulmini del suo bastone e aumenta la gittata dei fulmini che possono scaturire da esso.\n\nTurni rimanenti: %s.

items.wands.wandoflivingearth.name=bacchetta della viva terra
items.wands.wandoflivingearth.staff_name=bastone della viva terra
items.wands.wandoflivingearth.desc=Questa bacchetta è ottenuta da una pietra bizzarra, brillante di fasci d'energia color paglierino. La roccia pare muoversi leggermente al tuo tocco, come se potesse avvertire la tua presa.
items.wands.wandoflivingearth.stats_desc=Questa bacchetta scaglia lampi di roccia magica ai nemici, infliggendo _%1$d-%2$d punti danno._ La roccia quindi si riformerà attorno all'utilizzatore, concedendogli armatura in proporzione al danno arrecato. Se sufficiente armatura verrà costituita, essa formerà un guardiano di roccia al prossimo colpo della bacchetta.
items.wands.wandoflivingearth.upgrade_stat_name_2=HP massimi del guardiano
items.wands.wandoflivingearth.upgrade_stat_name_3=Blocco del guardiano
items.wands.wandoflivingearth.bmage_desc=Quando _il Mago Guerriero_ colpisce un nemico con un bastone della terra viva, parte del danno inflitto ritorna sotto forma di armatura di roccia.
items.wands.wandoflivingearth.eleblast_desc=Un'esplosione elementale con un bastone della viva terra infligge il 50% di danno e cura un guardiano terrestre per ogni colpo nemico subito.
items.wands.wandoflivingearth$rockarmor.name=armatura di roccia
items.wands.wandoflivingearth$rockarmor.desc=Rocce magiche circondano il tuo corpo: quando verrai attaccato bloccheranno per il colpo per te e ridurranno il danno ricevuto del 50%%. Ogni punto danno bloccato comunque sbriciolerà via un po' di roccia.\n\nArmatura rimanente: %1$d.\n\nSe sufficiente roccia si è costituita intorno a te, il prossimo colpo dalla tua bacchetta della viva terra spingerà le rocce a formarsi in un guardiano che combatterà al tuo fianco.\n\nArmatura necessaria per il Guardiano: %2$d.
items.wands.wandoflivingearth$rockarmor.desc_many=Anche questo guardiano terrestre beneficia del Potere dei Molti. Turni Rimanenti: %d.
items.wands.wandoflivingearth$earthguardian.name=guardiano terrestre
items.wands.wandoflivingearth$earthguardian.desc=Le rocce provenienti dalla tua bacchetta della viva terra si sono unite a formare un guardiano terrestre! Questo protettore roccioso attaccherà i nemici vicini, così da portarli a concentrare l'attenzione sul guardiano invece che su di te. Quando tutte le minacce saranno scomparse, il guardiano si ricostituirà attorno a te e ritornerà col prossimo uso della tua bacchetta.
items.wands.wandoflivingearth$earthguardian.wand_info=Il potere difensivo del guardiano è legato al livello della tua bacchetta. Attualmente blocca _%1$d-%2$d danni._
items.wands.wandoflivingearth$earthguardian.discover_hint=Puoi trovare questo personaggio con una bacchetta specifica.

items.wands.wandofmagicmissile.name=bacchetta del missile magico
items.wands.wandofmagicmissile.staff_name=bastone del missile magico
items.wands.wandofmagicmissile.desc=Questa bacchetta piuttosto semplice lancia missili di pura energia magica. Sebbene la bacchetta manchi di qualunque effetto speciale possiede più cariche disponibili e se migliorato, può rafforzare le altre bacchette.
items.wands.wandofmagicmissile.stats_desc=Ogni dardo da questa bacchetta infligge _%1$d-%2$d punti danno,_  e può rafforzare altre bacchette se migliorato.
items.wands.wandofmagicmissile.bmage_desc=Quando _il Mago Guerriero_ colpisce un nemico con un bastone del missile magico, tutte le sue bacchette si ricaricheranno oltre al suo bastone.
items.wands.wandofmagicmissile.eleblast_desc=Uno scoppio elementale con un bastone del missile magico causa 50% di danno e garantisce al mago 15 turni di ricarica.
items.wands.wandofmagicmissile.discover_hint=Uno degli eroi inizia con questo oggetto.
items.wands.wandofmagicmissile$magiccharge.name=carica magica
items.wands.wandofmagicmissile$magiccharge.desc=La tua bacchetta del missile magico ha instillato potere verso le tue altre bacchette, aumentando il livello effettivo della prossima scarica che emetteranno.\n\nLe tue bacchette sono incrementate a: +%d.\n\nTurni di carica magica rimanenti: %s.

items.wands.wandofprismaticlight.name=bacchetta della luce prismatica
items.wands.wandofprismaticlight.staff_name=bastone della luce prismatica
items.wands.wandofprismaticlight.desc=Questa bacchetta è composta di un solido pezzo di cristallo traslucido, come un lungo pezzo di vetro liscio. Piccoli corpuscoli di luce colorata danzano attorno alla punta della bacchetta, bramosi di sprigionarsi innanzi.
items.wands.wandofprismaticlight.stats_desc=Questa bacchetta emette raggi di luce che disperdono l'oscurità del dungeon, rivelando aree nascoste e trappole. Il raggio può accecare i nemici, ed infligge _%1$d-%2$d punti danno._ Avversari demoniaci e non-morti bruceranno alla luce luminosa della bacchetta, ricevendo danno bonus.
items.wands.wandofprismaticlight.upgrade_stat_name_2=Possibilità cieca
items.wands.wandofprismaticlight.upgrade_stat_name_3=Durata della luce
items.wands.wandofprismaticlight.bmage_desc=Quando _il Mago Guerriero_ colpisce un nemico con un bastone della luce prismatica, esso sarà stordito per una durata proporzionale al livello del bastone.
items.wands.wandofprismaticlight.eleblast_desc=Uno scoppio elementale con uno bastone della luce prismatica causa 67% di danno, rivela tutto il terreno colpito e acceca i nemici per 5 turni.

items.wands.wandofregrowth.name=bacchetta della ricrescita
items.wands.wandofregrowth.staff_name=bastone della ricrescita
items.wands.wandofregrowth.desc=Questa bacchetta è ricavata da una sottile asta di legno abilmente scolpito. In qualche modo è ancora viva e vibrante, di un verde brillante come il cuore di un giovane albero. "Quando la vita termina, nuova vita sempre inizia a crescere... L'eterno ciclo sempre perdura!"
items.wands.wandofregrowth.stats_desc=Quando usata, questa bacchetta sprigionerà magia di ricrescita magica a cono davanti a te, facendo nascere e spuntare erbe, radici e piante rare. Il suo prossimo uso consumerà _%1$d cariche_. Proseguendo nei miglioramenti questa bacchetta consumerà più cariche e l'effetto diverrà via via più potente di conseguenza.
items.wands.wandofregrowth.degradation=Dopo altre  _%d cariche_ questa bacchetta inizierà a non produrre piante ed erba fresca. Questo limite è incrementato aumentando di livello o migliorando la bacchetta.
items.wands.wandofregrowth.upgrade_stat_name_1=Erba per carica
items.wands.wandofregrowth.upgrade_stat_name_2=Limite totale dell'erba
items.wands.wandofregrowth.bmage_desc=Quando _il Mago Guerriero_ colpisce un nemico con un bastone della ricrescita, ed entrambi stanno sull'erba, egli riceverà guarigione erboristica proporzionale al danno inflitto.
items.wands.wandofregrowth.eleblast_desc=Uno scoppio elementale con un bastone della ricrescita intrappola i nemici con le radici e fa crescere erba casualmente nell'area dello scoppio.
items.wands.wandofregrowth$dewcatcher.name=Catturarugiada
items.wands.wandofregrowth$dewcatcher.desc=Le catturarugiada sono piante meravigliose ricolme di rugiada magica. Si mimetizzano da erba per sviare l'attenzione, ma le sue protuberanze ripiene di rugiada la rendono riconoscibile.
items.wands.wandofregrowth$dewcatcher.discover_hint=Puoi trovare questa pianta con una bacchetta specifica.
items.wands.wandofregrowth$seedpod.name=Baccello
items.wands.wandofregrowth$seedpod.desc=I Baccelli sono piante magiche che producono semi di altri tipi di piante, invece di semi propri. Riescono in qualche modo a riprodursi sebbene non possiedano un seme associato.
items.wands.wandofregrowth$seedpod.discover_hint=Puoi trovare questa pianta con una bacchetta specifica.
items.wands.wandofregrowth$lotus.name=Loto Dorato
items.wands.wandofregrowth$lotus.desc=Il loto dorato è una pianta mistica che può essere evocata solamente da una potente bacchetta della ricrescita. La sua aura migliora tutte le piante ed i loro effetti, ma la sua energia lo consuma, facendolo morire dopo breve tempo.
items.wands.wandofregrowth$lotus.wand_info=Questo loto è stato creato da una bacchetta della ricrescita _+%1$d_. Ogni pianta nel suo raggio si innescherà istantaneamente se è piantata su un personaggio. Le piante inoltre avranno il _%2$d%% di probabilità_ di generare un seme, e i dardi intinti useranno il _%3$d%% di durabilità in meno_.
items.wands.wandofregrowth$lotus.discover_hint=Puoi trovare questa pianta con una bacchetta specifica, dopo averla migliorata molte volte.

items.wands.wandoftransfusion.name=bacchetta della trasfusione
items.wands.wandoftransfusion.staff_name=bastone della trasfusione
items.wands.wandoftransfusion.ondeath=Ti sei ucciso con la tua stessa bacchetta della trasfusione...
items.wands.wandoftransfusion.charged=Il tuo bastone si è ricaricato con l'energia vitale del tuo nemico!
items.wands.wandoftransfusion.desc=Una bacchetta dalla forma piuttosto semplice, si distingue grazie alla sua tonalità magenta e alla gemma nerissima sulla punta.
items.wands.wandoftransfusion.stats_desc=Quando usata sugli alleati o sui nemici ammaliati, questa bacchetta indebolirà _%1$d punti vita del giocatore_ per curare o dare armatura all'alleato per _%2$d punti vita._ Quando usata su un nemico, la bacchetta lo ammalierà brevemente applicando _%3$d punti scudo_ al giocatore. I non-morti ostili prenderanno _%4$d-%5$d punti danno_ invece di essere ammaliati.
items.wands.wandoftransfusion.upgrade_stat_name_1=Alleato Guarigione
items.wands.wandoftransfusion.upgrade_stat_name_2=Autoprotezione
items.wands.wandoftransfusion.upgrade_stat_name_3=Danni non morti
items.wands.wandoftransfusion.bmage_desc=Quando _il Mago Guerriero_ colpisce un nemico ammaliato con un bastone della trasfusione, egli riceverà protezione ed il suo prossimo colpo con il bastone non gli costerà alcun punto salute.
items.wands.wandoftransfusion.eleblast_desc=Uno scoppio elementale con un bastone della trasfusione ammalia i nemici, cura gli alleati e causa il 100% di danno ai nemici non-morti.

items.wands.wandofwarding.name=bacchetta della guardia
items.wands.wandofwarding.staff_name=bastone della guardia
items.wands.wandofwarding.no_more_wards=La tua bacchetta non può sostenere ulteriori sentinelle.
items.wands.wandofwarding.bad_location=Non puoi piazzare una sentinella qui.
items.wands.wandofwarding.desc=Questa corta bacchetta metallica ha una brillante gemma purpurea fluttuante sulla sua punta.
items.wands.wandofwarding.stats_desc=Anziché danneggiare direttamente un nemico, questa bacchetta evocherà delle sentinelle stazionarie. Le sentinelle possono venire evocate ovunque, anche attraverso i muri se ne possiedi visione. Questa bacchetta può sostenere _%d punti energia_ in sentinelle al massimo.
items.wands.wandofwarding.upgrade_stat_name_1=Danno al reparto
items.wands.wandofwarding.upgrade_stat_name_2=Energia del reparto
items.wands.wandofwarding.bmage_desc=Quando _il Mago da Battaglia_ colpisce un nemico con uno staffa sentinella, tutti le difese e le sentinelle attive hanno la possibilità di guarire.
items.wands.wandofwarding.eleblast_desc=Uno scoppio elementale con un bastone della guardia cura tutte le sentinelle nell'area dello scoppio.
items.wands.wandofwarding$ward.desc_generic_ward=Questa barriera fulmina automaticamente qualsiasi nemico che entra nel suo raggio visivo.\n\nColpire questa barriera con la tua bacchetta magica la migliorerà.\n\nLe barriere hanno un numero limitato di zap prima di dissiparsi.
items.wands.wandofwarding$ward.desc_generic_sentry=Questa sentinella ha la stessa potenza di fuoco di una protezione, ma ha salute invece di un determinato numero di cariche. Assomiglia alla gemma sulla punta della tua bacchetta magica.\n\nColpire questa sentinella con la tua bacchetta di protezione la migliorerà e la curerà.\n\nQuesta sentinella spenderà un po' di salute ogni volta che colpisce un nemico, ma può essere curata usando la tua bacchetta di protezione su di essa.
items.wands.wandofwarding$ward.name_1=sentinella minore
items.wands.wandofwarding$ward.desc_1=Questa semplice sentinella colpirà automaticamente ogni nemico entri nel suo raggio di visione, infliggendo _%1$d-%2$d punti danno._\n\nColpire questa sentinella con la tua bacchetta da guardia la migliorerà.\n\nQuesta sentinella colpirà solamente una volta prima di dissiparsi.\n\nLa tua bacchetta della guardia sta usando _%3$d punti energia_ per sostenere questa sentinella.
items.wands.wandofwarding$ward.name_2=sentinella
items.wands.wandofwarding$ward.desc_2=Questa sentinella migliorata ha uno schema più complesso e può attaccare molteplici volte. Ogni colpo di questa sentinella infliggerà _%1$d-%2$d punti danno._\n\nColpire questa sentinella con la tua bacchetta da guardia la migliorerà.\n\nQuesta sentinella colpirà due volte prima di dissiparsi.\n\nLa tua bacchetta della guardia sta usando _%3$d punti energia_ per sostenere questa sentinella.
items.wands.wandofwarding$ward.name_3=sentinella maggiore
items.wands.wandofwarding$ward.desc_3=Questa sentinella pienamente migliorata è capace di attaccare più volte e più rapidamente dei suoi predecessori. Ogni colpo di questa sentinella infliggerà _%1$d-%2$d punti danno._\n\nColpire questa sentinella con la tua bacchetta da guardia la migliorerà.\n\nQuesta sentinella colpirà quattro volte prima di dissiparsi.\n\nLa tua bacchetta da guardia sta usando _%3$d punti energia_ per sostenere questa sentinella.
items.wands.wandofwarding$ward.name_4=sentinella minore
items.wands.wandofwarding$ward.desc_4=Questa piccola sentinella ha lo stesso potere di fuoco di una più grande, ma ha salute al posto di numero di cariche. Assomiglia alla gemma sulla punta della tua bacchetta da guardia. Ogni scarica da questa sentinella causa _%1$d-%2$d punti danno._\n\nColpire questa sentinella con la tua bacchetta da guardia la migliorerà e curerà.\n\nQuesta sentinella spenderà qualche punto salute ogni volta che colpisce un nemico, ma potrà essere curata usando la tua bacchetta da guardia su di essa.\n\nLa tua bacchetta da guardia sta usando _%3$d punti energia_ per sostenere questa sentinella.
items.wands.wandofwarding$ward.name_5=sentinella
items.wands.wandofwarding$ward.desc_5=Questa sentinella migliorata è più grossa e capace di attaccare più rapidamente di una sentinella minore. Ogni colpo di questa sentinella infliggerà _%1$d-%2$d punti danno._\n\nColpire questa sentinella con la tua bacchetta da guardia la migliorerà e curerà.\n\nQuesta sentinella spenderà qualche punto salute ogni volta che colpisce un nemico, ma potrà essere curata usando la tua bacchetta da guardia su di essa.\n\nLa tua bacchetta da guardia sta usando _%3$d punti energia_ per sostenere questa sentinella.
items.wands.wandofwarding$ward.name_6=sentinella maggiore
items.wands.wandofwarding$ward.desc_6=Questa sentinella pienamente migliorata è considerevolmente più resistente dei suoi predecessori. Ogni colpo di questa sentinella infliggerà _%1$d-%2$d punti danno._\n\nColpire questa sentinella con la tua bacchetta da guardia la curerà.\n\nQuesta sentinella spenderà qualche punto salute ogni volta che colpirà un nemico, ma potrà essere curata usando la tua bacchetta da guardia su di essa.\n\nLa tua bacchetta da guardia sta usando _%3$d punti energia_ per sostenere questa sentinella.
items.wands.wandofwarding$ward.discover_hint=Puoi trovare questo personaggio con una bacchetta specifica.
items.wands.wandofwarding$ward.dismiss_title=Congedare questa sentinella?
items.wands.wandofwarding$ward.dismiss_body=Puoi dissipare questa sentinella se non vuoi più che la tua bacchetta la sostenga. Così facendo distruggerai immediatamente la sentinella.\n\nCongedare la sentinella?
items.wands.wandofwarding$ward.dismiss_confirm=sì
items.wands.wandofwarding$ward.dismiss_cancel=no

###weapon curses
items.weapon.curses.annoying.name=%s irritante
items.weapon.curses.annoying.msg_1=OOH, STIAMO COMBATTENDO QUALCOSA!?
items.weapon.curses.annoying.msg_2=EVVAI, BECCALI!
items.weapon.curses.annoying.msg_3=EHI, ASCOLTA!
items.weapon.curses.annoying.msg_4=NON SIAMO ARRIVATI AL BOSS ANCORA!?
items.weapon.curses.annoying.msg_5=OUCH, NON ROTEARMI COSÌ FORTE!
items.weapon.curses.annoying.msg_6=MUORI, INSETTO!
items.weapon.curses.annoying.msg_7=WEEEEEEEEEEEEEEEE!
items.weapon.curses.annoying.msg_8=POSSIAMO FARE UNA PAUSA!?
items.weapon.curses.annoying.msg_9=POW, HAHA!
items.weapon.curses.annoying.msg_10=BEL COLPO!
items.weapon.curses.annoying.msg_11=Non volevo essere un arma, volevo essere l'ascia di un falegname.
items.weapon.curses.annoying.msg_12=Ricorda, la troppa confidenza porta lentamente alla morte.
items.weapon.curses.annoying.msg_13=TUTTA LA VOSTRA BASE SONO APPARTENGONO A NOI!
items.weapon.curses.annoying.desc=Le armi irritanti sono capaci di parlare, ma sono un po' troppo vivaci. Spesso attireranno l'attenzione su di te, inconsapevolmente.
items.weapon.curses.annoying.elestrike_desc=Un colpo elementale con una maledizione fastidiosa ha una probabilità del 20% di infuriare ogni nemico nel raggio d'azione per 6 turni.

items.weapon.curses.dazzling.name=%s abbacinante
items.weapon.curses.dazzling.desc=Le armi accecanti ogni tanto rilasceranno un flash di luce accecante che accecherà tutti coloro che stanno guardando.
items.weapon.curses.dazzling.elestrike_desc=Un colpo elementale con una maledizione accecante ha una probabilità del 50% di accecare ogni nemico nel raggio d'azione per 6 turni.

items.weapon.curses.displacing.name=%s dislocante
items.weapon.curses.displacing.desc=Le armi dislocanti sono infuse con magia caotica teletrasportante e possiedono la capacità di spostare casualmente i nemici nel livello.
items.weapon.curses.displacing.elestrike_desc=Un attacco elementale con una maledizione dislocante ha una probabilità del 50% di teletrasportare ogni nemico nel raggio d'azione.

items.weapon.curses.explosive.name=esplosivo %s
items.weapon.curses.explosive.warm=Tiepido...
items.weapon.curses.explosive.hot=Caldo!
items.weapon.curses.explosive.desc=Le armi esplosive accumulano costantemente potenza ed esplodono, danneggiando qualunque cosa gli sia vicino.
items.weapon.curses.explosive.desc_cool=La tua arma è fredda al tocco.
items.weapon.curses.explosive.desc_warm=La tua arma sta accumulando energia e si sta riscaldando...
items.weapon.curses.explosive.desc_hot=La tua arma è calda! Sta per esplodere!
items.weapon.curses.explosive.elestrike_desc=Un colpo elementale con una maledizione esplosiva ha una probabilità del 50% di far apparire un'esplosione su un nemico casuale nel raggio d'azione.

items.weapon.curses.friendly.name=%s amichevole
items.weapon.curses.friendly.desc=Le armi amichevoli sono le più appropriate per i pacifisti, scatenando talvolta una magia che rende impossibile combattere.
items.weapon.curses.friendly.elestrike_desc=Un colpo elementale con una maledizione amichevole ha una probabilità del 50% di ammaliare ogni nemico nel raggio d'azione per 6 turni.

items.weapon.curses.polarized.name=%s polarizzata
items.weapon.curses.polarized.desc=Un'arma polarizzata è affetta da una magia che rende i suoi attacchi infliggere il 50% dei danni in più, o nessun danno del tutto.
items.weapon.curses.polarized.elestrike_desc=Un attacco elementale con una maledizione polarizzata ha una probabilità del 50% di infliggere 24-36 danni a ciascun nemico nel raggio d'azione.

items.weapon.curses.sacrificial.name=%s sacrificale
items.weapon.curses.sacrificial.desc=Le armi sacrificali esigeranno il sangue del portatore come compenso per l'attacco degli avversari. Più in salute è il portatore, più sangue si prenderà la maledizione.
items.weapon.curses.sacrificial.elestrike_desc=Un colpo elementale con una maledizione sacrificale fa sanguinare l'eroe e ogni nemico nel raggio d'azione per 12 PS.

items.weapon.curses.wayward.name=%s ribelle
items.weapon.curses.wayward.desc=Le armi ribelli ogni tanto saranno estremamente inaccurate. La magia dura per un po' di tempo quando si attiva, ma può essere rimossa colpendo un nemico con l'arma ribelle.
items.weapon.curses.wayward.elestrike_desc=Un attacco elementale con una maledizione ribelle ha una probabilità del 50% di maledire ogni nemico nel raggio d'azione per 6 turni.
items.weapon.curses.wayward$waywardbuff.name=ribelle
items.weapon.curses.wayward$waywardbuff.desc=La magia della tua arma vagabonda si è attivata, rendendola estremamente inaccurata per un po'. Nota che ciò non influenza attacchi che colpiranno sicuramente il bersaglio, ad esempio gli attacchi a sorpresa. Colpire con successo con la tua arma vagabonda terminera immediatamente l'effetto.\n\nTurni rimanenti: %s.

###enchantments
items.weapon.enchantments.blazing.name=%s ardente
items.weapon.enchantments.blazing.desc=Questo incantamento provoca l'emissione di fiamme da un'arma, mandando a fuoco i nemici e arrecando danni bonus a quelli già incendiati.
items.weapon.enchantments.blazing.elestrike_desc=Un colpo elementale con un incantesimo ardente diffonde il fuoco su ogni casella nel raggio, che dura 8 turni.

items.weapon.enchantments.blocking.name=%s bloccante
items.weapon.enchantments.blocking.desc=Le armi bloccanti hanno una possibilità di darti un breve scudo dopo aver attaccato.
items.weapon.enchantments.blocking.elestrike_desc=Un colpo elementale con un incantesimo bloccante garantisce alla Duellante 6 scudi extra per ogni nemico nel raggio d'azione.
items.weapon.enchantments.blocking$blockbuff.name=bloccante
items.weapon.enchantments.blocking$blockbuff.desc=L'incantamento bloccante della tua arma ti ha donato un breve incremento di potere difensivo!\n\nScudo rimasto: %d\n\nTurni rimasti:%s.

items.weapon.enchantments.blooming.name=%s fiorente
items.weapon.enchantments.blooming.desc=Le armi fiorenti contengono una magia che farà spuntare vegetazione attorno a colui colpito da esse.
items.weapon.enchantments.blooming.elestrike_desc=Un colpo elementale con un incantesimo fiorente diffonde l'erba fino a un massimo di 8 caselle nel raggio d'azione e radica tutti i nemici nel raggio d'azione per 6 turni.

items.weapon.enchantments.chilling.name=%s ghiacciante
items.weapon.enchantments.chilling.desc=I nemici colpiti con questo incantamento vengono raffreddati, rallentando i loro movimenti ed attacchi.
items.weapon.enchantments.chilling.elestrike_desc=Un colpo elementale con un incantesimo ghiacciante diffonde aria gelida su ogni casella nel raggio d'azione, che dura 8 turni.

items.weapon.enchantments.kinetic.name=%s ad energia cinetica
items.weapon.enchantments.kinetic.desc=Quando un nemico viene ucciso da un'arma cinetica, ogni forza residua viene immagazzinata nell'arma e verrà applicata al prossimo attacco a segno.
items.weapon.enchantments.kinetic.elestrike_desc=Un colpo elementale con un incantesimo cinetico infligge il 40% dei danni immagazzinati a ogni nemico nel raggio d'azione, tranne il bersaglio principale.
items.weapon.enchantments.kinetic$conserveddamage.name=danno conservato
items.weapon.enchantments.kinetic$conserveddamage.desc=La tua arma ha immagazzinato la forza in eccesso da un precedente colpo mortale e verrà inflitta come danno bonus al tuo prossimo attacco. L'energia, comunque sia, svanirà lentamente nel tempo.\n\nDanno Conservato: %d.

items.weapon.enchantments.corrupting.name=%s corrompente
items.weapon.enchantments.corrupting.desc=Questo potente incantamento possiede l'abilità di piegare i nemici al tuo volere. Quando un nemico viene ucciso da quest'arma, c'è una probabilità che venga corrotto invece di morire.
items.weapon.enchantments.corrupting.elestrike_desc=Un colpo elementale con un incantesimo corrompente ha una probabilità del 5-25% (basata sugli HP mancanti) di corrompere ogni nemico nel raggio d'azione, tranne il bersaglio principale.

items.weapon.enchantments.elastic.name=%s dell'elasticità
items.weapon.enchantments.elastic.desc=Le armi elastiche hanno la possibilità di spedire i nemici all'indietro per brevi distanze.
items.weapon.enchantments.elastic.elestrike_desc=Un colpo elementale con un incantesimo elastico respinge tutti i nemici nel raggio d'azione di 5 caselle.

items.weapon.enchantments.grim.name=%s feroce
items.weapon.enchantments.grim.desc=Questo potente incantamento possiede il potere di uccidere instantaneamente un nemico. L'effetto è tanto più probabile quanto più debole è il nemico.
items.weapon.enchantments.grim.elestrike_desc=Un colpo elementale con un incantesimo feroce ha una possibilità del 6-30% (in base agli HP mancanti) di uccidere ogni nemico nel raggio d'azione, tranne il bersaglio principale.

items.weapon.enchantments.lucky.name=%s portafortuna
items.weapon.enchantments.lucky.desc=Nemici uccisi con un'arma fortunata hanno la possibilità di lasciare del bottino aggiuntivo.
items.weapon.enchantments.lucky.elestrike_desc=Un colpo elementale con un incantesimo fortunato ha una probabilità del 12.5% di generare bottino sotto ogni nemico nel raggio d'azione. Questo effetto può attivarsi solo una volta per nemico.

items.weapon.enchantments.projecting.name=%s prominente
items.weapon.enchantments.projecting.desc=Con questo incantamento le armi da mischia acquisiranno portata extra. Le armi a distanza saranno in grado di penetrare i muri quando mirate a nemici vicini.
items.weapon.enchantments.projecting.elestrike_desc=Un colpo elementale con un incantesimo proiettante infligge il 30% di danni a ogni nemico nel raggio d'azione, tranne il bersaglio principale.

items.weapon.enchantments.shocking.name=%s fulminante
items.weapon.enchantments.shocking.desc=L'elettricità scaturisce da un'arma fulminante, infliggendo danno extra a tutti i nemici vicini.
items.weapon.enchantments.shocking.elestrike_desc=Un colpo elementale con un incantesimo fulminante diffonde elettricità in ogni casella nel raggio d'azione, che dura 8 turni.

items.weapon.enchantments.unstable.name=%s instabile
items.weapon.enchantments.unstable.desc=Questo incantamento irradia energia caotica, assumendo la forma di un'incantamento diverso a ogni colpo.
items.weapon.enchantments.unstable.elestrike_desc=Un colpo elementale con un incantesimo instabile applica un effetto di incantesimo casuale a ogni nemico nel raggio d'azione, eccetto il bersaglio principale.

items.weapon.enchantments.vampiric.name=%s vampirica
items.weapon.enchantments.vampiric.desc=Questo potente incantamento sottrae forza vitale dai nemici ad ogni colpo, incanalandola verso il portatore. L'effetto è più forte tanto quanto più bassa è la salute del portatore.
items.weapon.enchantments.vampiric.elestrike_desc=Un colpo elementale con un incantesimo vampirico cura la Duellante di 2.5 HP per ogni nemico nel raggio d'azione.


###melee weapons
items.weapon.melee.assassinsblade.name=lama dell'assassino
items.weapon.melee.assassinsblade.stats_desc=Quest'arma è più forte contro nemici ignari.
items.weapon.melee.assassinsblade.ability_name=intrufolati
items.weapon.melee.assassinsblade.typical_ability_desc=La Duellante può _nascondersi_ mentre brandisce una lama dell'assassino. Questa abilità consente alla Duellante di scattare fino a 3 caselle di distanza e tipicamente le fornisce _%d turni di invisibilità_
items.weapon.melee.assassinsblade.ability_desc=La Duellante può _nascondersi_ mentre brandisce una lama dell'assassino. Questa abilità consente alla Duellante di scattare istantaneamente fino a 3 caselle di distanza e le fornisce _%d turni di invisibilità_
items.weapon.melee.assassinsblade.upgrade_ability_stat_name=Durata dell'abilità
items.weapon.melee.assassinsblade.desc=Una piccola lama ondulata di ossidiana, difficile da usare malgrado la sua leggerezza, ma mortale se trova il bersaglio giusto.

items.weapon.melee.battleaxe.name=Ascia da battaglia
items.weapon.melee.battleaxe.stats_desc=Questa è un'arma piuttosto accurata.
items.weapon.melee.battleaxe.ability_name=colpo pesante
items.weapon.melee.battleaxe.typical_ability_desc=La Duellante può compiere un _colpo pesante_ con un'ascia da battaglia. Questo attacco concentrato infligge tipicamente _%1$d-%2$d danni_ se sorprende il nemico, e lo confonde per 5 turni che riducono la precisione e l'evasione di 50 %%. Il colpo pesante colpisce sempre ma infligge danno normale se non sorprende il nemico.
items.weapon.melee.battleaxe.ability_desc=La Duellante può sferrare un _colpo pesante_ con un'ascia da battaglia. Questo attacco concentrato infligge _%1$d-%2$d danni_ se sorprende il nemico e lo stordisce per 5 turni, riducendo la precisione e l'evasione di 50%%. Il colpo pesante colpisce sempre ma infligge danni regolari se non sorprende il nemico.
items.weapon.melee.battleaxe.desc=L'enorme testa d'acciaio di questa ascia da battaglia porta un considerevole peso in coda a ogni ampio colpo.

items.weapon.melee.crossbow.name=balestra
items.weapon.melee.crossbow.typical_stats_desc=Di solito quest'arma porta i danni dei dardi lanciati a _%1$d-%2$d_ mentre è equipaggiata, e gli applica anche il suo incantamento.
items.weapon.melee.crossbow.stats_desc=Quest'arma porta i danni dei dardi lanciati a _%1$d-%2$d_ mentre è equipaggiata, e gli applica anche il suo incantamento.
items.weapon.melee.crossbow.ability_name=colpo caricato
items.weapon.melee.crossbow.typical_ability_desc=La Duellante può _caricare_ la sua balestra, facendo sì che il suo prossimo attacco regolare con essa colpisca sempre e applichi uno dei tre effetti: gli attacchi in mischia respingeranno i nemici, i dardi senza punta infliggeranno generalmente _+%1$d danni_ e i dardi con punta applicheranno il loro effetto in un 7x7 area e in genere durano per _%2$d più usi_.
items.weapon.melee.crossbow.ability_desc=La Duellante può _caricare_ la sua balestra, facendo sì che il suo prossimo attacco regolare con essa colpisca sempre e applichi uno dei tre effetti: gli attacchi in mischia respingeranno i nemici, i dardi senza punta infliggeranno _+%1$d danni_ e i dardi con punta applicheranno il loro effetto in un'area 7x7 e durano per _%2$d altri usi_.
items.weapon.melee.crossbow.desc=Un'arma piuttosto complessa che spara dardi ad una velocità straordinaria. Anche se non è progettata a tal fine, la pesante e robusta struttura della balestra la rende una rispettabile arma da mischia.
items.weapon.melee.crossbow.upgrade_ability_stat_name=Potenziamento abilità
items.weapon.melee.crossbow$chargedshot.name=caricato
items.weapon.melee.crossbow$chargedshot.desc=La Duellante sta concentrando il potere sulla sua balestra. Il prossimo attacco che effettuerà con esso colpirà sempre e applicherà uno dei tre effetti:\n- Gli attacchi in mischia faranno cadere i nemici a poche tessere di distanza.\n- I dardi senza punta infliggeranno danni bonus.\n- I dardi con punta acquisiranno usi extra e applicheranno il loro effetto in un'area 7x7. Gli effetti dei dardi positivi influenzeranno solo gli alleati e gli effetti dannosi si applicheranno solo ai nemici. La Duellante non può usare questa capacità per applicare effetti positivi sui dardi su se stesso.

items.weapon.melee.cudgel.name=randello
items.weapon.melee.cudgel.stats_desc=Questa è un'arma piuttosto accurata.
items.weapon.melee.cudgel.ability_name=colpo pesante
items.weapon.melee.cudgel.typical_ability_desc=La Duellante può eseguire un _colpo pesante_ con un randello. Questo attacco concentrato in genere infligge _%1$d-%2$d danni_ se sorprende il nemico e lo stordisce per 5 turni, riducendo la precisione e l'evasione di 50%%. Il colpo pesante colpisce sempre ma infligge danni regolari se non sorprende il nemico.
items.weapon.melee.cudgel.ability_desc=La Duellante può eseguire un _colpo pesante_ con un randello. Questo attacco concentrato infligge _%1$d-%2$d danni_ se sorprende il nemico e lo stordisce per 5 turni, riducendo la precisione e l'evasione di 50%%. Il colpo pesante colpisce sempre ma infligge danni regolari se non sorprende il nemico.
items.weapon.melee.cudgel.desc=Una piccola mazza in ottone, più adatta ad essere per difesa personale di un nobile piuttosto che per le avventure.
items.weapon.melee.cudgel.discover_hint=Uno degli eroi inizia con questo oggetto.

items.weapon.melee.dagger.name=pugnale
items.weapon.melee.dagger.stats_desc=Quest'arma è più forte contro nemici ignari.
items.weapon.melee.dagger.ability_name=intrufolati
items.weapon.melee.dagger.typical_ability_desc=La Duellante può nascondersi mentre brandisce un pugnale. Questa abilità consente alla Duellante di scattare istantaneamente fino a 5 caselle di distanza e tipicamente le dà _%d turni di invisibilità._
items.weapon.melee.dagger.ability_desc=La Duellante può _sgattaiolare_ mentre brandisce un pugnale. Questa abilità consente alla Duellante di teletrasportarsi istantaneamente fino a 5 tessere di distanza e le garantisce _%d turni di invisibilità._
items.weapon.melee.dagger.upgrade_ability_stat_name=Durata dell'abilità
items.weapon.melee.dagger.desc=Un semplice pugnale di ferro con un'impugnatura usurata in legno.
items.weapon.melee.dagger.discover_hint=Uno degli eroi inizia con questo oggetto.

items.weapon.melee.dirk.name=dirk
items.weapon.melee.dirk.stats_desc=Quest'arma è più forte contro nemici ignari.
items.weapon.melee.dirk.ability_name=intrufolati
items.weapon.melee.dirk.typical_ability_desc=La Duellante può _sgattaiolare_ mentre brandisce un pugnale. Questa abilità consente alla Duellante di teletrasportarsi istantaneamente fino a 4 tessere di distanza e in genere le garantisce _%d turni di invisibilità._
items.weapon.melee.dirk.ability_desc=La Duellante può _sgattaiolare_ mentre brandisce un pugnale. Questa abilità consente alla Duellante di teletrasportarsi istantaneamente fino a 4 tessere di distanza e le garantisce _%d turni di invisibilità._
items.weapon.melee.dirk.upgrade_ability_stat_name=Durata dell'abilità
items.weapon.melee.dirk.desc=Un lungo e penetrante pugnale, un po' di acciaio in più da conficcare negli avversari.

items.weapon.melee.flail.name=mazzafrusto
items.weapon.melee.flail.stats_desc=Questa è un'arma un po' lenta\nQuest'arma non può effettuare attacchi a sorpresa.
items.weapon.melee.flail.ability_name=roteare
items.weapon.melee.flail.spin_warn=Non puoi più far roteare il mazzafrusto.
items.weapon.melee.flail.typical_ability_desc=Il Duellante può far girare un mazzafrusto per aumentare la potenza per un breve periodo. Ad ogni turno in cui il mazzafrusto viene fatto girare, in genere infliggerà _+%d danni_ al suo successivo attacco regolare, fino a un massimo di 3 volte. Anche un mazzafrusto rotante colpirà sicuramente. Solo iniziare a far girare il mazzafrusto costa una carica.
items.weapon.melee.flail.ability_desc=La Duellante può far girare un mazzafrusto per aumentare la potenza per un breve periodo. Ad ogni turno in cui il mazzafrusto viene fatto girare, infliggerà _+%d danni_ al suo successivo attacco regolare, per un massimo di 3 volte. Anche un mazzafrusto rotante colpirà sicuramente. Solo iniziare a far girare il mazzafrusto costa una carica.
items.weapon.melee.flail.desc=Una palla chiodata collegata all'impugnatura da una catena. Molto scomoda da maneggiare, ma devastante se assesta un solido colpo.
items.weapon.melee.flail$spinabilitytracker.name=roteare
items.weapon.melee.flail$spinabilitytracker.desc=La Duellante sta facendo roteare il suo mazzafrusto, accumulando danni per il suo prossimo attacco regolare. Ogni giro dura un turno ma aumenta il danno, fino a un massimo di tre turni. È inoltre garantito che il flagello colpisca mentre gira.\n\nGiri attuali: %1$d%%.\nTurni rimanenti: %2$s.

items.weapon.melee.gauntlet.name=guanto di pietra
items.weapon.melee.gauntlet.stats_desc=Questa è un'arma molto veloce.
items.weapon.melee.gauntlet.ability_name=attacco combinato
items.weapon.melee.gauntlet.typical_ability_desc=La Duellante può eseguire un _colpo combo_ con un guanto di pietra. Questo attacco è sicuro di colpire e in genere infligge _+%d danni_ per ogni volta che la Duellante ha colpito con un normale attacco in mischia o con un'arma da lancio. Non colpire per 5 turni azzera questa combo.
items.weapon.melee.gauntlet.ability_desc=La Duellante può eseguire un _colpo combo_ con un guanto di pietra. Questo attacco è sicuro di colpire e infligge _+%d danni_ per ogni volta che la Duellante ha colpito con un normale attacco in mischia o con un'arma da lancio. Non colpire per 5 turni azzera questa combo.
items.weapon.melee.gauntlet.desc=Questo enorme guanto è fatto di un tessuto cremisi con al di sopra una pesante pietra magica. Il tessuto si stringe attorno a te, rendendo le spesse placche di pietra quasi una seconda pelle. Maneggiare un'arma così pesante richiede forza, ma aggiunge una potenza tremenda ai tuoi colpi.

items.weapon.melee.glaive.name=falcione
items.weapon.melee.glaive.stats_desc=Si tratta di un'arma piuttosto lenta.\nQuest'arma ha una portata extra.
items.weapon.melee.glaive.ability_name=arpione
items.weapon.melee.glaive.typical_ability_desc=La Duellante può usare la punta di un falcione per _infilzare_ un nemico che sia nel suo raggio d'azione ma non adiacente. Questo generalmente infligge _%1$d-%2$d danni_, respinge il nemico indietro ed è garantito che colpisca.
items.weapon.melee.glaive.ability_desc=La Duellante può usare la punta di un falcione per _infilzare_ un nemico che sia nel suo raggio d'azione ma non adiacente. Questo infligge _%1$d-%2$d danni_, respinge il nemico indietro ed è garantito che colpisca.
items.weapon.melee.glaive.desc=Una massiccia arma inastata consistente in una lama di spada posta alla fine di un palo.

items.weapon.melee.gloves.name=guanti borchiati
items.weapon.melee.gloves.stats_desc=Questa è un'arma molto veloce.
items.weapon.melee.gloves.ability_name=attacco combinato
items.weapon.melee.gloves.typical_ability_desc=La Duellante può eseguire un _colpo combo_ con i guanti di pietra. Questo attacco è sicuro di colpire e in genere infligge _+%d danni_ per ogni volta che la Duellante ha colpito con un normale attacco in mischia o con un'arma da lancio. Non colpire per 5 turni azzera questa combo.
items.weapon.melee.gloves.ability_desc=La Duellante può eseguire un _colpo combo_ con i guanti di pietra. Questo attacco è sicuro di colpire e infligge _+%d danni_ per ogni volta che la Duellante ha colpito con un normale attacco in mischia o con un'arma da lancio. Non colpire per 5 turni azzera questa combo.
items.weapon.melee.gloves.desc=Questi guanti borchiati non offrono una vera e propria protezione, agiscono piuttosto come armi efficaci mantenendo le mani libere.
items.weapon.melee.gloves.discover_hint=Uno degli eroi inizia con questo oggetto.

items.weapon.melee.greataxe.name=grandascia
items.weapon.melee.greataxe.stats_desc=Quest'arma è incredibilmente pesante.
items.weapon.melee.greataxe.ability_name=castigo
items.weapon.melee.greataxe.typical_ability_desc=La Duellante può eseguire un attacco di _punizione_ con un'ascia grande se ha meno di 50%% punti salute. Questo attacco devastante in genere infligge _%1$d-%2$d danni,_ colpisce sicuramente ed è istantaneo se uccide un nemico.
items.weapon.melee.greataxe.ability_desc=La Duellante può eseguire un attacco di _punizione_ con una grandascia se ha meno di 50%% punti salute. Questo attacco devastante infligge _%1$d-%2$d danni,_ colpisce sicuramente ed è istantaneo se uccide un nemico.
items.weapon.melee.greataxe.desc=Pensata per essere portata sopra la spalla, quest'ascia titanica è tanto potente quanto pesante.

items.weapon.melee.greatshield.name=granscudo
items.weapon.melee.greatshield.typical_stats_desc=Di solito quest'arma blocca 0-%d punti danno. Tale blocco aumenta con i miglioramenti.
items.weapon.melee.greatshield.stats_desc=Quest'arma blocca 0-%d punti danno. Tale blocco aumenta con i miglioramenti.
items.weapon.melee.greatshield.ability_name=protezione
items.weapon.melee.greatshield.typical_ability_desc=La Duellante può _proteggersi_ con un grande scudo, annullando completamente tutti gli attacchi fisici o magici effettuati contro di lui, generalmente per _%d turni_. Una volta che la Duellante ha bloccato un attacco, contrattaccare o usare la magia interromperà la protezione.
items.weapon.melee.greatshield.ability_desc=La Duellante può _proteggersi_ con un grande scudo, annullando completamente tutti gli attacchi fisici o magici effettuati contro di lui per _%d turni_. Una volta che la Duellante ha bloccato un attacco, contrattaccare o usare la magia interromperà la protezione.
items.weapon.melee.greatshield.upgrade_ability_stat_name=Durata dell'abilità
