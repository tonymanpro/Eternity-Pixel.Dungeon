items.scrolls.scroll.odal=Pergamena "ODAL"
items.scrolls.scroll.tiwaz=Pergamena "TIWAZ"
items.scrolls.scroll.unknown_desc=Un'indecifrabile runa magica è scritta su questa pergamena. Chissà che effetto avrà quando letta ad alta voce?
items.scrolls.scroll.blinded=Non puoi leggere una pergamena mentre sei accecato.
items.scrolls.scroll.no_magic=Non puoi leggere una pergamena mentre sei immune alla magia.
items.scrolls.scroll.cursed=Il tuo libro di magie maledetto ti impedisce di invocare la magia di questa pergamena! Tuttavia una pergamena di rimuovi maledizione potrebbe essere abbastanza forte da poter funzionare comunque...
items.scrolls.scroll$placeholder.name=pergamena

items.scrolls.inventoryscroll.warning=Vuoi davvero annullare questo utilizzo della pergamena? La pergamena non è stata identificata in precedenza, quindi verrà comunque consumata.
items.scrolls.inventoryscroll.yes=Si, sono sicuro.
items.scrolls.inventoryscroll.no=No, ho cambiato idea

items.scrolls.scrollofidentify.name=pergamena dell'identificazione
items.scrolls.scrollofidentify.inv_title=Identifica un oggetto
items.scrolls.scrollofidentify.it_is=Il tuo oggetto è stato identificato: %s.
items.scrolls.scrollofidentify.desc=Questa pergamena rivela in modo permanente tutti i segreti di un singolo oggetto.

items.scrolls.scrolloflullaby.name=pergamena della ninna nanna
items.scrolls.scrolloflullaby.sooth=La pergamena emette una rilassante melodia. Ti senti molto sonnolento.
items.scrolls.scrolloflullaby.desc=Leggere questa pergamena sprigionerà una rilassante melodia che cullerà ogni ascoltatore verso un profondo sonno magico. Per il lettore e i suoi alleati il sonno sarà ristorativo.

items.scrolls.scrollofmagicmapping.name=pergamena di mappatura magica
items.scrolls.scrollofmagicmapping.layout=Ora conosci la struttura del piano.
items.scrolls.scrollofmagicmapping.desc=Quando questa pergamena viene letta, un'immagine limpida si imprimerà nella tua memoria  rendendoti consapevole della struttura del piano, e rivelando tutti i segreti nascosti. La posizione di oggetti e creature rimarrà sconosciuta.

items.scrolls.scrollofmirrorimage.name=pergamena dell'immagine speculare
items.scrolls.scrollofmirrorimage.copies=La pergamena crea delle immagini speculari di te.
items.scrolls.scrollofmirrorimage.no_copies=La pergamena prova a creare delle immagini speculari, ma non hanno spazio.
items.scrolls.scrollofmirrorimage.desc=L'incantesimo di questa pergamena creerà due illusioni-clone del lettore. Queste immagini speculari si comportano come dei cloni più deboli del lettore e inseguiranno i loro nemici. Non possiedono robustezza tuttavia, e svaniranno subito dopo aver subito danno.

items.scrolls.scrollofretribution.name=pergamena del castigo
items.scrolls.scrollofretribution.blast=Una potente energia magica fuoriesce dalla pergamena!
items.scrolls.scrollofretribution.desc=Questa pergamena contiene energia distruttiva che proietta all'esterno le sofferenze del lettore, incanalandole in un'esplosione di potere. Più il lettore è debole, maggiore saranno i danni causati. Se la tua salute è molto bassa questa pergamena può uccidere all'istante la maggior parte dei nemici.\n\nUsare questa pergamena ha un prezzo per l'utilizzatore: l'accecamento e l'indebolimento.

items.scrolls.scrollofrage.name=pergamena della rabbia
items.scrolls.scrollofrage.roar=La pergamena emette un furioso ruggito che echeggia attraverso il dungeon!
items.scrolls.scrollofrage.desc=Quando letta ad alta voce, questa pergamena scatenerà un tremendo ruggito che attirerà tutti i nemici verso il lettore, rendendo furiosi quelli nelle immediate vicinanze.

items.scrolls.scrollofrecharging.name=pergamena della ricarica
items.scrolls.scrollofrecharging.surge=Un'ondata di energia scorre nel tuo corpo, energizzando le tue bacchette magiche!
items.scrolls.scrollofrecharging.desc=Il puro potere magico racchiuso in questa pergamena caricherà tutte le bacchette degli utenti nel tempo una volta rilasciato.

items.scrolls.scrollofremovecurse.name=pergamena di rimuovi maledizione
items.scrolls.scrollofremovecurse.inv_title=Purifica un oggetto
items.scrolls.scrollofremovecurse.cleansed=Il tuo oggetto brilla di una luce purificante e un'energia malevola si disperde!
items.scrolls.scrollofremovecurse.not_cleansed=Il tuo oggetto brilla di una luce purificante, ma non accade nulla.
items.scrolls.scrollofremovecurse.spirit=La tua pergamena libera lo spirito tormentato!
items.scrolls.scrollofremovecurse.desc=L'incantesimo in questa pergamena rimuoverà istantaneamente ogni maleficio da una singola arma, anello, bacchetta, armatura o artefatto.

items.scrolls.scrollofteleportation.name=pergamena del teletrasporto
items.scrolls.scrollofteleportation.tele=In un batter d'occhio sei stato teletrasportato in un'altra posizione del piano.
items.scrolls.scrollofteleportation.no_tele=La magia di teletrasporto fallisce.
items.scrolls.scrollofteleportation.cant_reach=Non puoi teletrasportarti là.
items.scrolls.scrollofteleportation.prompt=Scegli un punto in cui teletrasportarti
items.scrolls.scrollofteleportation.desc=L'incantesimo di questa pergamena trasporterà istantaneamente il lettore da qualche altra parte in questo piano. L'incantesimo privilegerà zone dove il lettore non è ancora stato ma non è capace di trasportarlo oltre porte chiuse o barricate. Può tuttavia rivelare porte nascoste che portano in nuove aree.

items.scrolls.scrollofterror.name=pergamena del terrore
items.scrolls.scrollofterror.none=La pergamena emette un brillante lampo di luce rossa.
items.scrolls.scrollofterror.one=La pergamena emette un brillante lampo di luce rossa e %s fugge!
items.scrolls.scrollofterror.many=La pergamena emette un brillante lampo di luce rossa e i mostri fuggono!
items.scrolls.scrollofterror.desc=Quando viene letta, questa pergamena emette un lampo di luce rossa che travolge tutti i nemici nel tuo campo visivo, terrorizzandoli e facendoli fuggire. Attaccare un nemico in fuga abbrevia l'effetto.

items.scrolls.scrolloftransmutation.name=pergamena della trasmutazione
items.scrolls.scrolloftransmutation.inv_title=Trasmuta un oggetto
items.scrolls.scrolloftransmutation.nothing=Non succede nulla di interessante.
items.scrolls.scrolloftransmutation.morph=Il tuo oggetto si trasforma in qualcosa di diverso!
items.scrolls.scrolloftransmutation.desc=Questa pergamena contiene una potente magia trasmutante. Quando usata su di un oggetto idoneo, esso verrà trasformato in un oggetto differente dello stesso tipo. La magia conserverà  miglioramenti, incantamenti e glifi. Pergamene e pozioni verranno trasmutate nel loro equivalente esotico e viceversa.

items.scrolls.scrollofupgrade.name=pergamena del miglioramento
items.scrolls.scrollofupgrade.inv_title=Migliora un oggetto
items.scrolls.scrollofupgrade.weaken_curse=La pergamena del miglioramento indebolisce la maledizione sul tuo oggetto.
items.scrolls.scrollofupgrade.remove_curse=La pergamena di miglioramento rimuove la maledizione dal tuo oggetto!
items.scrolls.scrollofupgrade.desc=Questa pergamena migliorerà un singolo oggetto o set di armi da lancio. Delle bacchette aumenterà il danno e il numero di cariche, armi e armature infliggeranno e bloccheranno più danno, i set di armi da lancio verranno completamente riparati e resi più duraturi, e l'effetto degli anelli verrà intensificato.\n\nPuò anche indebolire o alcune volte completamente dissipare le maledizioni, sebbene non sia potente quanto una pergamena di rimuovi maledizione. Sfortunatamente, la magia di miglioramento può anche cancellare gli incantamenti o i glifi sull'equipaggiamento di livello superiore.



###exotic scrolls
items.scrolls.exotic.exoticscroll.kaunan=Pergamena esotica "KAUNAN"
items.scrolls.exotic.exoticscroll.sowilo=Pergamena esotica "SOWILO"
items.scrolls.exotic.exoticscroll.laguz=Pergamena esotica "LAGUZ"
items.scrolls.exotic.exoticscroll.yngvi=Pergamena esotica "YNGVI"
items.scrolls.exotic.exoticscroll.gyfu=Pergamena esotica "GYFU"
