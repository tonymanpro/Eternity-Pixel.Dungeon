items.weapon.melee.shortsword.name=espada curta
items.weapon.melee.shortsword.ability_name=cortar
items.weapon.melee.shortsword.typical_ability_desc=A Duelista pode _cortar_ um inimigo com uma espada curta. Isso normalmente causa _%1$d-%2$d de dano_ e tem acerto garantido. Se a habilidade matar um inimigo, a ação é instantânea e a Duelista pode usar cortar novamente em 5 turnos sem custo.
items.weapon.melee.shortsword.ability_desc=A Duelista pode _cortar_ um inimigo com uma espada curta. Isso causa _%1$d-%2$d de dano_ e tem acerto garantido. Se a habilidade matar um inimigo, a ação é instantânea e a Duelista pode usar cortar novamente em 5 turnos sem custo.
items.weapon.melee.shortsword.desc=Uma espada levemente curta, apenas alguns centímetros maior que um punhal.

items.weapon.melee.quarterstaff.name=bastão
items.weapon.melee.quarterstaff.stats_desc=Esta arma bloqueia 0-2 de danos.
items.weapon.melee.quarterstaff.ability_name=Postura defensiva
items.weapon.melee.quarterstaff.typical_ability_desc=A Duelista pode assumir uma _postura defensiva_ com um bastão. Essa postura não leva tempo para ser ativada e normalmente triplica sua evasão por _%d turnos._
items.weapon.melee.quarterstaff.ability_desc=A Duelista pode assumir uma _postura defensiva_ com um bastão. Essa postura não leva tempo para ser ativada e triplica sua evasão por _%d turnos._
items.weapon.melee.quarterstaff.upgrade_ability_stat_name=Duração de habilidade
items.weapon.melee.quarterstaff.desc=Um bastão de madeira dura, suas pontas são revestidas de ferro.
items.weapon.melee.quarterstaff$defensivestance.name=postura defensiva
items.weapon.melee.quarterstaff$defensivestance.desc=A Duelista está usando seu bastão para desviar de golpes e projéteis. Enquanto ela estiver nessa postura, sua evasão contra todos os ataques é triplicada.\n\nTurnos restantes: %s.

items.weapon.melee.rapier.name=florete
items.weapon.melee.rapier.stats_desc=Esta arma bloqueia 0-1 de dano.
items.weapon.melee.rapier.ability_name=estocada
items.weapon.melee.rapier.typical_ability_desc=A Duelista pode realizar uma _estocada_ com o florete em um inimigo a 1 espaço de distância. Esse movimento a aproxima do inimigo, normalmente causa _%1$d-%2$d de dano_ e é um acerto garantido.
items.weapon.melee.rapier.ability_desc=A Duelista pode realizar uma _estocada_ com o florete em um inimigo a 1 espaço de distância. Esse movimento a aproxima do inimigo, causa _%1$d-%2$d de dano_ e é um acerto garantido.
items.weapon.melee.rapier.desc=Uma espada reta e fina que oferece certa proteção em detrimento de poder de corte.
items.weapon.melee.rapier.discover_hint=Um dos heróis inicia com este item.

items.weapon.melee.roundshield.name=Escudo redondo
items.weapon.melee.roundshield.typical_stats_desc=Normalmente, esta arma bloqueia 0-%d de dano. Este bloqueio aumenta com aprimoramentos.
items.weapon.melee.roundshield.stats_desc=Esta arma bloqueia 0-%d de dano. Este bloqueio aumenta com aprimoramentos.
items.weapon.melee.roundshield.ability_name=defender
items.weapon.melee.roundshield.typical_ability_desc=A Duelista pode se _defender_ com um escudo redondo, negando completamente todos os ataques físicos ou mágicos feitos contra ela normalmente por _%d turnos_. Depois que a Duelista bloquear um ataque, revidar ou usar magia encerrará a defesa.
items.weapon.melee.roundshield.ability_desc=A Duelista pode se _defender_ com um escudo redondo, negando completamente todos os ataques físicos ou mágicos feitos contra ela por _%d turnos_. Depois que a Duelista bloquear um ataque, revidar ou usar magia encerrará a defesa.
items.weapon.melee.roundshield.upgrade_ability_stat_name=Duração de habilidade
items.weapon.melee.roundshield.desc=Este grande escudo bloqueia ataques efetivamente e é uma arma decente em situações de perigo.
items.weapon.melee.roundshield$guardtracker.name=defendendo
items.weapon.melee.roundshield$guardtracker.guarded=defendido
items.weapon.melee.roundshield$guardtracker.desc=A Duelista preparou seu escudo em antecipação a ataques iminentes. Ataques físicos ou mágicos feitos contra ela serão completamente negados.\n\nTurnos restantes: %s.

items.weapon.melee.runicblade.name=lâmina Rúnica
items.weapon.melee.runicblade.stats_desc=Esta arma se beneficia mais dos aprimoramentos.
items.weapon.melee.runicblade.ability_name=corte rúnico
items.weapon.melee.runicblade.typical_ability_desc=A Duelista pode realizar um _corte rúnico_ com a lâmina rúnica. Esse ataque é garantido e normalmente causa  _+%d%% do poder de encantamento._
items.weapon.melee.runicblade.ability_desc=A Duelista pode realizar um _corte rúnico_ com a lâmina rúnica. Esse ataque é garantido e causa  _+%d%% do poder de encantamento._
items.weapon.melee.runicblade.upgrade_ability_stat_name=Poder da habilidade
items.weapon.melee.runicblade.desc=Uma arma misteriosa de uma terra distante, com uma lâmina de brilho azul.

items.weapon.melee.sai.name=sai
items.weapon.melee.sai.stats_desc=Esta é uma arma muito rápida.
items.weapon.melee.sai.ability_name=combinação de ataques
items.weapon.melee.sai.typical_ability_desc=A Duelista pode realizar uma _combinação de ataques_ com a sai. Este ataque tem garantia de acerto e normalmente causa _+%d de dano_ para cada vez que a Duelista tiver acertado com um ataque corpo a corpo regular ou com uma arma de arremesso. Não acertar nada em 5 turnos reinicia este combo.
items.weapon.melee.sai.ability_desc=A Duelista pode realizar uma _combinação de ataques_ com a sai. Este ataque tem garantia de acerto e causa _+%d de dano_ para cada vez que a Duelista tiver acertado com um ataque corpo a corpo regular ou com uma arma de arremesso. Não acertar nada em 5 turnos reinicia este combo.
items.weapon.melee.sai.desc=Duas lâminas finas destinadas a serem empunhadas cada uma em uma mão. Excelente para destruir os inimigos com uma série de cortes.
items.weapon.melee.sai$combostriketracker.name=combinação de ataques
items.weapon.melee.sai$combostriketracker.desc=A Duelista está acumulando combo que pode ser usado para aumentar o dano da habilidade combinação de ataques. Cada golpe regular bem-sucedido com uma arma corpo a corpo ou de arremesso contará, mas não acertar ataques por 5 turnos resetará esse combo.\n\nGolpes recentes: %1$d.\n\nTurnos até a perda dos golpes: %2$s.

items.weapon.melee.scimitar.name=cimitarra
items.weapon.melee.scimitar.stats_desc=Esta é uma arma rápida.
items.weapon.melee.scimitar.ability_name=dança da espada
items.weapon.melee.scimitar.typical_ability_desc=O Duelista pode realizar a _dança de espada_ com uma cimitarra.  Esta postura não leva tempo para ser ativada e concede a Duelista +60%% de velocidade de ataque e +50%% de precisão normalmente por _%d turnos._
items.weapon.melee.scimitar.ability_desc=O Duelista pode realizar a _dança de espada_ com uma cimitarra.  Esta postura não leva tempo para ser ativada e concede a Duelista +60%% de velocidade de ataque e +50%% de precisão por _%d turnos._
items.weapon.melee.scimitar.upgrade_ability_stat_name=Duração da habilidade
items.weapon.melee.scimitar.desc=Uma lâmina curvada e fina. Seu formato permite ataques rápidos, porém menos poderosos.
items.weapon.melee.scimitar$sworddance.name=dança da espada
items.weapon.melee.scimitar$sworddance.desc=A Duelista está realizando ataques rápidos baseados em impulso, como uma espécie de dança. Enquanto esta postura estiver ativa, ela ataca 60%% mais rápido (o suficiente para atacar exatamente duas vezes por turno com uma cimitarra), e tem +50%% de precisão.\n\nTurnos restantes: %s.

items.weapon.melee.sickle.name=foice
items.weapon.melee.sickle.stats_desc=Esta é uma arma pouco precisa.
items.weapon.melee.sickle.ability_name=ceifar
items.weapon.melee.sickle.typical_ability_desc=A Duelista pode _ceifar_ um inimigo com uma foice. Este ataque devastador tem garantia de acerto e normalmente causa _ %d de dano_. Esse dano é aplicado como sangramento se o alvo não for imune.
items.weapon.melee.sickle.ability_desc=A Duelista pode _ceifar_ um inimigo com uma foice. Este ataque devastador tem garantia de acerto e causa _ %d de dano_. Esse dano é aplicado como sangramento se o alvo não for imune.
items.weapon.melee.sickle.desc=Uma ferramenta agrícola manual que pode funcionar como uma arma forte, mas de difícil manejo.

items.weapon.melee.spear.name=lança
items.weapon.melee.spear.stats_desc=Esta arma é lenta.\nEsta arma tem alcance estendido.
items.weapon.melee.spear.ability_name=Espetar
items.weapon.melee.spear.typical_ability_desc=A Duelista pode usar a ponta de uma lança para _espetar_ um inimigo que esteja dentro do alcance, mas não adjacente. Isso normalmente causa _%1$d-%2$d de dano_, empurra o inimigo para trás e garante o acerto.
items.weapon.melee.spear.ability_desc=A Duelista pode usar a ponta de uma lança para _espetar_ um inimigo que esteja dentro do alcance, mas não adjacente. Isso causa _%1$d-%2$d de dano_, empurra o inimigo para trás e garante o acerto.
items.weapon.melee.spear.desc=Um bastão de madeira com aço afiado na ponta.

items.weapon.melee.sword.name=espada
items.weapon.melee.sword.ability_name=cortar
items.weapon.melee.sword.typical_ability_desc=A Duelista pode _cortar_ um inimigo com uma espada. Isso normalmente causa _%1$d-%2$d de dano_ e tem acerto garantido. Se a habilidade matar um inimigo, a ação é instantânea e a Duelista pode usar cortar novamente em 5 turnos sem custo.
items.weapon.melee.sword.ability_desc=A Duelista pode _cortar_ um inimigo com uma espada. Isso causa _%1$d-%2$d de dano_ e tem acerto garantido. Se a habilidade matar um inimigo, a ação é instantânea e a Duelista pode usar cortar novamente em 5 turnos sem custo.
items.weapon.melee.sword.desc=Uma espada bem balanceada. Não é muito grande, mas ainda é notavelmente maior do que uma espada curta.
items.weapon.melee.sword$cleavetracker.name=cortar
items.weapon.melee.sword$cleavetracker.desc=A Duelista está pronta para dar continuidade ao seu corte anterior. O próximo uso de cortar não custará nenhuma carga de habilidade de arma.\n\nTurnos restantes: %s.

items.weapon.melee.warhammer.name=martelo de guerra
items.weapon.melee.warhammer.stats_desc=Esta é uma arma precisa.
items.weapon.melee.warhammer.ability_name=Golpe pesado
items.weapon.melee.warhammer.typical_ability_desc=A Duelista pode realizar um _golpe pesado_ com um martelo de guerra. Esse ataque concentrado normalmente causa _%1$d-%2$d de dano_ se acertar o inimigo de surpresa e atordoa por 5 turnos, reduzindo a precisão e evasão em 50%%. Golpe pesado tem acerto garantido, mas causa dano regular se o inimigo não for pego de surpresa.
items.weapon.melee.warhammer.ability_desc=A Duelista pode realizar um _golpe pesado_ com um martelo de guerra. Esse ataque concentrado causa _%1$d-%2$d de dano_ se acertar o inimigo de surpresa e atordoa por 5 turnos, reduzindo a precisão e evasão em 50%%. Golpe pesado tem acerto garantido, mas causa dano regular se o inimigo não for pego de surpresa.
items.weapon.melee.warhammer.desc=Poucas criaturas conseguem suportar o golpe esmagador desta massa imponente de chumbo e aço, mas é preciso muita força para usá-la com eficiência.

items.weapon.melee.warscythe.name=foice de guerra
items.weapon.melee.warscythe.stats_desc=Esta é uma arma pouco precisa.
items.weapon.melee.warscythe.ability_name=ceifar
items.weapon.melee.warscythe.typical_ability_desc=A Duelista pode _ceifar_ um inimigo com uma foice de guerra. Este ataque devastador tem garantia de acerto e normalmente causa _ %d de dano_. Esse dano é aplicado como sangramento se o alvo não for imune.
items.weapon.melee.warscythe.ability_desc=A Duelista pode _ceifar_ um inimigo com uma foice de guerra. Este ataque devastador tem garantia de acerto e causa _ %d de dano_. Esse dano é aplicado como sangramento se o alvo não for imune.
items.weapon.melee.warscythe.desc=Esta ferramenta grande e pesada foi reforçada para torná-la melhor em cortar inimigos do que colheitas.

items.weapon.melee.whip.name=chicote
items.weapon.melee.whip.stats_desc=Esta arma possui um tremendo alcance.
items.weapon.melee.whip.ability_name=chicotear
items.weapon.melee.whip.typical_ability_desc=A Duelista pode _chicotear_ todos os inimigos envolta dela com o chicote. Essa habilidade normalmente causa _%1$d-%2$d de dano_, atinge todos os inimigos na área de alcance e tem acerto garantido.
items.weapon.melee.whip.ability_desc=A Duelista pode _chicotear_ todos os inimigos envolta dela com o chicote. Essa habilidade causa _%1$d-%2$d de dano_, atinge todos os inimigos na área de alcance e tem acerto garantido.
items.weapon.melee.whip.desc=Embora o comprimento de corda farpado no fim desta arma inflija pouco dano, nada se compara ao seu alcance.

items.weapon.melee.wornshortsword.name=espada curta desgastada
items.weapon.melee.wornshortsword.ability_name=cortar
items.weapon.melee.wornshortsword.typical_ability_desc=A Duelista pode _cortar_ um inimigo com uma espada curta desgastada. Isso normalmente causa _%1$d-%2$d de dano_ e tem acerto garantido. Se a habilidade matar um inimigo, a ação é instantânea e a Duelista pode usar cortar novamente em 5 turnos sem custo.
items.weapon.melee.wornshortsword.ability_desc=A Duelista pode _cortar_ um inimigo com uma espada curta desgastada. Isso causa _%1$d-%2$d de dano_ e tem acerto garantido. Se a habilidade matar um inimigo, a ação é instantânea e a Duelista pode usar cortar novamente em 5 turnos sem custo.
items.weapon.melee.wornshortsword.desc=Uma espada levemente curta, um pouco deteriorada por muito uso. É fraca e mais leve que uma espada curta em melhores condições.
items.weapon.melee.wornshortsword.discover_hint=Um dos heróis inicia com este item.


###missile weapons
items.weapon.missiles.darts.adrenalinedart.name=dardo de adrenalina
items.weapon.missiles.darts.adrenalinedart.desc=Estes dardos são embebidos num composto à base de cardo-ligeiro que aumentará a velocidade de movimento e ataque dos aliados ou diminuirá brevemente a velocidade de movimento dos inimigos. O dardo em si ainda é prejudicial aos inimigos, mas não prejudicará os aliados.

items.weapon.missiles.darts.blindingdart.name=dardo cegante
items.weapon.missiles.darts.blindingdart.desc=Estes dardos são embebidos em um composto à base de ceguerva que irá cegar seu alvo por um curto período de tempo. Eles não desorientam, portanto, um inimigo ainda saberá onde viu você pela última vez.

items.weapon.missiles.darts.chillingdart.name=dardo congelante
items.weapon.missiles.darts.chillingdart.desc=Estes dardos são embebidos em um composto à base de muda-de-gelo que irá esfriar significativamente o seu alvo.

items.weapon.missiles.darts.cleansingdart.name=Dardo da limpeza
items.weapon.missiles.darts.cleansingdart.desc=Estes dardos são embebidos num composto à base de magi-real que tornará temporariamente os aliados imunes a todos os efeitos negativos ou limpará os efeitos positivos dos inimigos. Os inimigos podem até esquecer brevemente que estão atacando ou fugindo de você. O dardo em si ainda é prejudicial aos inimigos, mas não prejudicará os aliados.

items.weapon.missiles.darts.dart.name=dardo
items.weapon.missiles.darts.dart.ac_tip=EMBEBER
items.weapon.missiles.darts.dart.prompt=selecione uma semente.
items.weapon.missiles.darts.dart.tip_title=Dardos Embebidos
items.weapon.missiles.darts.dart.tip_desc=Uma semente pode ser combinada com um ou dois dardos para embebê-los. Cada tipo de semente produz seu próprio tipo de dardo embebido, com um efeito especial de uso único.\n\nEmbeber dardos com este tipo de semente produzirá _%s._
items.weapon.missiles.darts.dart.tip_all=embeber %1$d dardos com %2$d sementes
items.weapon.missiles.darts.dart.tip_two=embeber 2 dardos com 1 semente
items.weapon.missiles.darts.dart.tip_one=embeber 1 dardo com 1 semente
items.weapon.missiles.darts.dart.tip_cancel=cancelar
items.weapon.missiles.darts.dart.desc=Estes pedaços simples de madeira pontiaguda são feitos para voar e ferir suas presas com um movimento do pulso. Eles podem ser embebidos com sementes para ganhar efeitos bônus quando lançados.
items.weapon.missiles.darts.dart.unlimited_uses=Devido a sua construção simples, os dardos duram para sempre.

items.weapon.missiles.darts.displacingdart.name=dardos de deslocamento
items.weapon.missiles.darts.displacingdart.desc=Estes dardos são embebidos em um composto à base de folha-fantasma que irá teletransportar seu alvo a uma curta distância.

items.weapon.missiles.darts.healingdart.name=dardo de cura
items.weapon.missiles.darts.healingdart.desc=Estes dardos são embebidos com um composto à base de grama-solar que concede uma explosão de cura ao seu alvo. O dardo em si ainda é prejudicial aos inimigos, mas não irá prejudicar aliados.

items.weapon.missiles.darts.holydart.name=dardo sagrado
items.weapon.missiles.darts.holydart.desc=Estes dardos são embebidos num composto à base de flor-estrela que infunde energia sagrada em seu alvo. Aliados e inimigos normais serão abençoados, mas inimigos mortos-vivos ou demoníacos sofrerão grandes danos. O dardo em si ainda é prejudicial aos inimigos, mas não prejudicará os aliados.

items.weapon.missiles.darts.incendiarydart.name=dardo incendiário
items.weapon.missiles.darts.incendiarydart.desc=Estes dardos são embebidos com um composto à base de flor-de-fogo que explodirá em chamas brilhantes no impacto.

items.weapon.missiles.darts.paralyticdart.name=dardo paralítico
items.weapon.missiles.darts.paralyticdart.desc=Estes dardos são embebidos com um composto à base de terraíz que paralisará seu alvo por um curto período de tempo.

items.weapon.missiles.darts.poisondart.name=dardo envenenado
items.weapon.missiles.darts.poisondart.desc=Estes dardos são embebidos com um composto à base de sofrimusgo que envenenará seu alvo.

items.weapon.missiles.darts.rotdart.name=dardo corrosivo
items.weapon.missiles.darts.rotdart.desc=Estes perversos dardos são embebidos com um composto ácido à base de putrifruta, que corroerá agressivamente qualquer coisa com que o dardo entre em contato. Inimigos poderosos resistirão à maior parte do efeito, mas a corrosão é forte o suficiente para matar facilmente a maioria dos inimigos padrão. Duram mais do que outros dardos embebidos, mas sua durabilidade não pode ser aumentada.
items.weapon.missiles.darts.rotdart.discover_hint=Você pode criar este item usando uma semente de uma missão específica.

items.weapon.missiles.darts.shockingdart.name=dardo chocante
items.weapon.missiles.darts.shockingdart.desc=Estes dardos são embebidos com um composto à base de vinha-tempestuosa que irá causar um choque desagradável ao seu alvo.

items.weapon.missiles.darts.tippeddart.ac_clean=LIMPAR
items.weapon.missiles.darts.tippeddart.clean_title=Dardos Limpos
items.weapon.missiles.darts.tippeddart.clean_desc=Esta ação removerá o efeito das sementes nos seus dardos, revertendo-os de volta a dardos normais.
items.weapon.missiles.darts.tippeddart.clean_all=limpar tudo
items.weapon.missiles.darts.tippeddart.clean_one=limpar um
items.weapon.missiles.darts.tippeddart.cancel=cancelar
items.weapon.missiles.darts.tippeddart.uses_left=Esta pilha de dardos tem _%d/%d_ usos antes de expirar.
items.weapon.missiles.darts.tippeddart.unlimited_uses=_Mas estes são de tal qualidade que duram para sempre._
items.weapon.missiles.darts.tippeddart.about_to_break=A ponta do seu dardo está prestes a expirar.
items.weapon.missiles.darts.tippeddart.has_broken=A ponta do seu dardo expirou.
items.weapon.missiles.darts.tippeddart.discover_hint=Você pode comprar este item em uma loja ou criá-lo usando uma semente.


items.weapon.missiles.bolas.name=boleadeiras
items.weapon.missiles.bolas.stats_desc=Esta arma causa aleijamento no alvo.
items.weapon.missiles.bolas.desc=Estas armas de arremesso incomuns não causam muito dano, mas fazem um excelente trabalho ao retardar seu alvo.

items.weapon.missiles.boomerang.name=bumerangue
items.weapon.missiles.boomerang.desc=Ao ser jogado no inimigo, este projétil de madeira curvada irá retornar às mãos do jogador.
items.weapon.missiles.boomerang.durability=Devido à sua construção sólida, este bumerangue não vai quebrar com o uso.

items.weapon.missiles.fishingspear.name=lança de pesca
items.weapon.missiles.fishingspear.desc=Pequenas lanças de arremesso que funcionam bem como armas improvisadas, apesar de terem sido projetadas para pesca.

items.weapon.missiles.forcecube.name=cubo de força
items.weapon.missiles.forcecube.ondeath=Você se matou com o seu próprio Cubo de Força...
items.weapon.missiles.forcecube.stats_desc=Esta arma espalha a força do seu impacto sobre uma pequena área, atingindo tudo o que estiver por perto.
items.weapon.missiles.forcecube.desc=Estes cubos mágicos de formato estranho são pequenos o suficiente para segurar na mão, mas são incrivelmente pesados.

items.weapon.missiles.heavyboomerang.name=bumerangue pesado
items.weapon.missiles.heavyboomerang.stats_desc=Esta arma retorna ao local de onde foi arremessada após cinco turnos.
items.weapon.missiles.heavyboomerang.desc=Este bumerangue grande é difícil de manejar efetivamente, mas causará danos consideráveis.

items.weapon.missiles.javelin.name=javelin
items.weapon.missiles.javelin.desc=Estas grandes lanças de arremesso têm seu peso balanceado para manterem a sua ponta de ferro à frente enquanto viajam pelo ar.

items.weapon.missiles.kunai.name=kunai
items.weapon.missiles.kunai.stats_desc=Esta arma é mais forte contra inimigos distraídos.
items.weapon.missiles.kunai.desc=Estas facas pequenas são muito poderosas nas mãos de um usuário habilidoso.

items.weapon.missiles.missileweapon.stats_known=Este conjunto de armas de arremesso de _tier-%1$d_ causa _%2$d-%3$d de dano_ e requer _ %4$d de força_ para serem usadas.
items.weapon.missiles.missileweapon.stats_unknown=Normalmente, este conjunto de armas de arremesso de _tier-%1$d_ causa _%2$d-%3$d de dano_ e requer _%4$d de força_ para serem usadas.
items.weapon.missiles.missileweapon.stats_desc=
items.weapon.missiles.missileweapon.probably_too_heavy=Esta arma provavelmente é muito pesada para você.
items.weapon.missiles.missileweapon.distance=Armas de arremesso são mais precisas a distância, mas menos precisas de perto.
items.weapon.missiles.missileweapon.durability=Armas arremessadas se desgastam e quebram quando são usadas.
