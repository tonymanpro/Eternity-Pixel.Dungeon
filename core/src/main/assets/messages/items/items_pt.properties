items.artifacts.lloydsbeacon.creatures=A aura psíquica de criaturas próximas impedem você de usar o Transmissor de Lloyd neste momento.
items.artifacts.lloydsbeacon.return=O Transmissor de Lloyd está marcado na sua localização atual, agora você pode retornar aqui a qualquer momento.
items.artifacts.lloydsbeacon.desc=O Transmissor de Lloyd é um complexo dispositivo mágico que dá ao usuário o controle da magia de transmitir sua matéria. O transmissor pode ser usado para retornar a um local marcado, mas também pode atirar rajadas mágicas de teletransporte aleatórias se for devidamente equipado e carregado. Essa magia pode ser direcionada para um alvo ou para o próprio usuário.
items.artifacts.lloydsbeacon.desc_set=Este transmissor foi marcado em algum lugar no %d andar da masmorra.

items.artifacts.masterthievesarmband.name=braçadeira do mestre dos ladrões
items.artifacts.masterthievesarmband.ac_steal=ROUBAR
items.artifacts.masterthievesarmband.no_charge=Sua braçadeira não tem carga o suficiente.
items.artifacts.masterthievesarmband.cursed=Você não pode usar uma braçadeira amaldiçoada.
items.artifacts.masterthievesarmband.full=Sua braçadeira está totalmente carregada!
items.artifacts.masterthievesarmband.prompt=Escolha um inimigo como alvo
items.artifacts.masterthievesarmband.no_target=Você deve escolher um inimigo que esteja adjacente a você.
items.artifacts.masterthievesarmband.steal_shopkeeper=Você não pode roubar diretamente dos lojistas.
items.artifacts.masterthievesarmband.no_steal=Não há nada para roubar deste inimigo.
items.artifacts.masterthievesarmband.stole_item=Você roubou um item: %s.
items.artifacts.masterthievesarmband.failed_steal=Você não conseguiu roubar nada.
items.artifacts.masterthievesarmband.level_up=Sua braçadeira ficou mais poderosa!
items.artifacts.masterthievesarmband.desc=Esta braçadeira de veludo roxo tem a marca de um ladrão mestre. Ela não pertence a você, mas provavelmente também não pertencia ao seu último usuário.
items.artifacts.masterthievesarmband.desc_cursed=A braçadeira amaldiçoada está presa ao seu braço e, de alguma forma, sua bolsa de ouro parece estar lentamente ficando mais leve...
items.artifacts.masterthievesarmband.desc_worn=Você sente o poder aumentando na braçadeira em seu braço à medida que ganha experiência. Você pode usar esse poder para roubar lojas ou roubar inimigos!\n\nRoubar inimigos acontece instantaneamente, desorienta-os brevemente e dá a você a chance de obter qualquer item que eles tenham! Este poder é mais efetivo contra inimigos que não tenham percebido sua presença. Roubar o mesmo inimigo várias vezes não dá mais chances de saque.

items.artifacts.sandalsofnature.name=sandálias da natureza
items.artifacts.sandalsofnature.name_1=sapatos da natureza
items.artifacts.sandalsofnature.name_2=botas da natureza
items.artifacts.sandalsofnature.name_3=grevas da natureza
items.artifacts.sandalsofnature.ac_feed=ALIMENTAR
items.artifacts.sandalsofnature.ac_root=ENRAIZAR
items.artifacts.sandalsofnature.prompt=Selecione uma semente.
items.artifacts.sandalsofnature.levelup=Seus calçados cresceram em tamanho!
items.artifacts.sandalsofnature.absorb_seed=Seus calçados absorveram a semente, parecem mais saudáveis agora.
items.artifacts.sandalsofnature.no_effect=Você deve primeiro alimentar seus calçados com uma semente.
items.artifacts.sandalsofnature.low_charge=Seus calçados não têm energia suficiente para isto.
items.artifacts.sandalsofnature.prompt_target=Escolha um local
items.artifacts.sandalsofnature.out_of_range=Esse local está fora de alcance.
items.artifacts.sandalsofnature.desc_1=O que inicialmente pareciam duas sandálias feitas de vinhas são na verdade duas plantas! Elas parecem muito fracas e pálidas, talvez você tenha que lhes dar nutrientes?
items.artifacts.sandalsofnature.desc_2=Os calçados cresceram e agora mais se assemelham a dois sapatos sob medida. Um pouco de cor voltou a eles, talvez ainda possam crescer mais?
items.artifacts.sandalsofnature.desc_3=As plantas cresceram novamente e agora se assemelham a um par de botas sólidas feitas de casca de árvore. As plantas parecem ter recuperado a sua força, mas talvez ainda possam crescer mais?
items.artifacts.sandalsofnature.desc_4=As plantas parecem ter atingido seu tamanho máximo, assemelhando-se agora a um par de grevas encouraçadas. As grevas são de um marrom profundo e se aparentam a uma árvore muito robusta.
items.artifacts.sandalsofnature.desc_hint=Você se sente mais conectado com a natureza ao usar este artefato.
items.artifacts.sandalsofnature.desc_cursed=As sandálias amaldiçoadas estão bloqueando qualquer sintonia com a natureza.
items.artifacts.sandalsofnature.desc_ability=Linhas onduladas surgem nos calçados com a cor da última semente que você os alimentou. Eles podem enraizar-se brevemente no solo e produzir o efeito dessa planta em qualquer lugar em um raio de 3 quadrados.\nSemente: _%s_\nCarga necessária: _%d%%_
items.artifacts.sandalsofnature.desc_seeds=Você já alimentou os calçados com %d sementes.

items.artifacts.skeletonkey.name=chave de crânio
items.artifacts.skeletonkey.ac_insert=INSERIR
items.artifacts.skeletonkey.cursed=Você não pode usar uma chave de crânio amaldiçoada.
items.artifacts.skeletonkey.prompt=Escolha um alvo
items.artifacts.skeletonkey.invalid_target=Não há nada para trancar ou destrancar aqui.
items.artifacts.skeletonkey.lock_no_space=Você não pode trancar um personagem dentro de uma porta!
items.artifacts.skeletonkey.iron_charges=Abrir uma fechadura comum requer 1 carga.
items.artifacts.skeletonkey.gold_charges=Abrir uma fechadura dourada requer 2 cargas.
items.artifacts.skeletonkey.lock_charges=Trancar uma porta requer 2 cargas.
items.artifacts.skeletonkey.wall_charges=Criar uma parede temporária requer 2 cargas.
items.artifacts.skeletonkey.crystal_charges=Abrir uma fechadura de cristal requer 5 cargas.
items.artifacts.skeletonkey.wont_open=A chave se recusa a entrar nesta fechadura por algum motivo.
items.artifacts.skeletonkey.locked_with_key=Esta porta foi trancada pela sua chave de crânio.
items.artifacts.skeletonkey.force_lock=A fechadura ficou mais frágil sem a sua chave de crânio. Você consegue forçá-la para abrir.
items.artifacts.skeletonkey.discard=Você descarta as chaves em excesso.
items.artifacts.skeletonkey.levelup=Sua chave de crânio cresce em força!
items.artifacts.skeletonkey.desc=Uma chave de aparência importante, com a cabeça em formato de crânio. Seus dentes parecem diferentes a cada vez que olha para ela.
items.artifacts.skeletonkey.desc_worn=Esta chave mágica parece ganhar poder conforme você a usa em vez de usar as chaves comuns da masmorra. Ela pode ser inserida em quase todas as fechaduras da masmorra para abri-las ou fechá-las, incluindo portas que nunca foram trancadas antes.\n\nA chave pode até ser usada em um espaço vazio em uma direção cardinal ou diagonal para "trancar" o ar à sua frente, criando uma parede sólida de 3 quadrados de largura que dura 10 turnos. Travar o ar repelirá os inimigos se houver espaço para isso.
items.artifacts.skeletonkey.desc_cursed=A chave amaldiçoada parece estar deliberadamente evitando entrar em qualquer fechadura, e até mesmo dificultando (mas não impossibilitando) o uso de suas outras chaves.
items.artifacts.skeletonkey$keywall.desc=Uma parede mágica temporária foi colocada aqui pela chave de crânio.

items.artifacts.talismanofforesight.name=talismã da vidência
items.artifacts.talismanofforesight.ac_scry=REVELAR
items.artifacts.talismanofforesight.low_charge=O talismã requer pelo menos 5% de carga para revelar.
items.artifacts.talismanofforesight.prompt=Escolha um local para escanear.
items.artifacts.talismanofforesight.levelup=Seu Talismã ficou mais forte!
items.artifacts.talismanofforesight.full_charge=Seu Talismã está totalmente carregado!
items.artifacts.talismanofforesight.desc=Uma pedra lisa com gravuras estranhas. Você sente como se estivesse observando tudo à sua volta, vigiando tudo o que está escondido.
items.artifacts.talismanofforesight.desc_worn=Quando segura o talismã, você sente como se seus sentidos estivessem mais aguçados. O talismã está lentamente acumulando cargas à medida que o tempo passa e quando você descobre portas ou armadilhas escondidas.\n\nO talismã pode gastar sua carga para 'revelar' em forma de cone, fazendo com que todos os azulejos e segredos na área analisada sejam expostos. Também lhe concederá visão dos inimigos e itens por um curto período de tempo.
items.artifacts.talismanofforesight.desc_cursed=O talismã amaldiçoado está olhando fixamente para você, enfraquecendo os seus sentidos.
items.artifacts.talismanofforesight$foresight.name=vidência
items.artifacts.talismanofforesight$foresight.uneasy=Você se sente apreensivo.
items.artifacts.talismanofforesight$foresight.desc=Você se sente muito apreensivo, como se tivesse algum perigo por perto.

items.artifacts.timekeepershourglass.name=ampulheta do guardião do tempo
items.artifacts.timekeepershourglass.ac_activate=ATIVAR
items.artifacts.timekeepershourglass.deactivate=Você desativou o congelamento do tempo.
items.artifacts.timekeepershourglass.no_charge=Sua ampulheta ainda não recarregou o suficiente para ser usada.
items.artifacts.timekeepershourglass.cursed=Você não pode usar uma ampulheta amaldiçoada.
items.artifacts.timekeepershourglass.onstasis=O mundo parece mudar ao seu redor em um instante.
items.artifacts.timekeepershourglass.onfreeze=Tudo ao seu redor subitamente congela.
items.artifacts.timekeepershourglass.stasis=Coloque-me em estase
items.artifacts.timekeepershourglass.freeze=Pare o tempo ao meu redor
items.artifacts.timekeepershourglass.prompt=Como você gostaria de usar a magia da ampulheta?\n\nDurante a estase, o tempo correrá normalmente enquanto você fica congelado e completamente invulnerável, consumindo até 2 cargas por vez.\n\nQuando o tempo está congelado, você pode se mover como se suas ações não tomassem tempo. Isso pode ser desativado a qualquer momento usando a ampulheta ou atacando.
items.artifacts.timekeepershourglass.desc=Esta grande e ornamentada ampulheta parece relativamente modesta, mas você sente um grande poder em sua moldura finamente esculpida. Ao girar a ampulheta e ver a areia derramar você pode sentir a sua magia puxando você. Certamente, usar essa magia daria a você algum controle sobre o tempo.
items.artifacts.timekeepershourglass.desc_hint=A ampulheta parece ter perdido muita areia. Se você pudesse encontrar mais...
items.artifacts.timekeepershourglass.desc_cursed=A ampulheta amaldiçoada está presa ao seu corpo, você pode senti-la tentando manipular o seu fluxo de tempo.
items.artifacts.timekeepershourglass$timefreeze.name=Congelamento de tempo
items.artifacts.timekeepershourglass$timefreeze.desc=O tempo está congelado ao seu redor, permitindo que você execute ações instantaneamente. O efeito durará até que seja cancelado ou sua ampulheta fique sem carga. Atacar ou usar magia também quebrará esse efeito.\n\nTurnos até o uso de carga: %s.
items.artifacts.timekeepershourglass$sandbag.name=saco de areia mágica
items.artifacts.timekeepershourglass$sandbag.levelup=Você adicionou a areia a sua ampulheta.
items.artifacts.timekeepershourglass$sandbag.maxlevel=Sua ampulheta está cheia de areia mágica!
items.artifacts.timekeepershourglass$sandbag.no_hourglass=Você não tem uma ampulheta para colocar esta areia.
items.artifacts.timekeepershourglass$sandbag.desc=Esta pequena bolsa de areia mágica parece funcionar perfeitamente com sua ampulheta.\n\nParece muito conveniente que o lojista tenha especificamente este item bem quando você precisa...

items.artifacts.unstablespellbook.name=livro de feitiços instável
items.artifacts.unstablespellbook.ac_read=LER
items.artifacts.unstablespellbook.ac_add=ADICIONAR
items.artifacts.unstablespellbook.blinded=Você não pode ler o livro enquanto está cegado.
items.artifacts.unstablespellbook.no_charge=Seu livro de feitiços está sem energia agora.
items.artifacts.unstablespellbook.cursed=Você não pode ler o livro de feitiços amaldiçoado.
items.artifacts.unstablespellbook.prompt=Selecione um pergaminho
items.artifacts.unstablespellbook.infuse_scroll=Você infundiu a energia do pergaminho no livro.
items.artifacts.unstablespellbook.unable_scroll=Você é incapaz de adicionar este pergaminho ao livro.
items.artifacts.unstablespellbook.unknown_scroll=Você ainda não tem certeza de que tipo de pergaminho é este para adicionar ao livro.
items.artifacts.unstablespellbook.desc=Este livro está em surpreendentes boas condições dada a sua idade. Ele chia e estala conforme você move as páginas, brilhando com energia instável. Se ler deste livro, não há como dizer que feitiço você irá lançar.
items.artifacts.unstablespellbook.desc_cursed=O livro amaldiçoado se prendeu a você e está inibindo a sua habilidade de usar pergaminhos.
items.artifacts.unstablespellbook.desc_index=Este livro está incompleto. Seu índice está atualmente apontando para as seguintes folhas em branco:
items.artifacts.unstablespellbook.desc_empowered=Os pergaminhos que você adicionou ao livro estão brilhando com poder. Você poderá escolher a versão exótica dos efeitos desses pergaminhos, mas ao custo de uma carga adicional.
items.artifacts.unstablespellbook.read_empowered=O pergaminho que você adicionou ao livro de feitiços surge com energia. Você pode canalizar a versão regular ou exótica do efeito desse pergaminho.\n\nA escolha da variante exótica custará 2 cargas ao invés de 1.



###bags
items.bags.bag.name=mochila
items.bags.bag.discover_hint=Você pode comprar este item em uma loja.

items.bags.potionbandolier.name=bandoleira de poções
items.bags.potionbandolier.desc=Esta bandoleira grossa se encaixa em torno de seu peito como um cinto, ela tem várias tiras isoladas para armazenar frascos de poção, seu odre de água ou frascos de metal líquido.\n\nEnquanto estiverem dentro da bandoleira, suas poções estarão protegidas do frio.

items.bags.scrollholder.name=canudo de pergaminhos
items.bags.scrollholder.desc=Este recipiente tubular parece poder armazenar ferramentas e gráficos de um astrônomo, mas parece servir muito bem para guardar seus pergaminhos. Há até alguns compartimentos laterais os quais os seus cristais, suas canetas arcanas e resinas arcanas também parecem poder se ajustar bem.\n\nO suporte não parece ser inflamável, portanto seus pergaminhos devem estar seguros do fogo dentro dele.

items.bags.velvetpouch.name=bolsa de veludo
items.bags.velvetpouch.desc=Esta pequena bolsa de veludo pode armazenar muitos itens pequenos, como sementes, pedras rúnicas e alguns ingredientes de alquimia.
items.bags.velvetpouch.discover_hint=Um dos heróis inicia com este item.

items.bags.magicalholster.name=coldre mágico
items.bags.magicalholster.desc=Este coldre fino é feito de alguma pele de animal exótico e possui uma magia poderosa que permite armazenar uma grande quantidade de armas de longo alcance.\n\nVocê pode simplesmente colocar a mão no coldre e sempre pegar o item que estava procurando.\n\nDevido à magia do coldre, as varinhas carregam um pouco mais rápido e as armas de longo alcance duram um pouco mais dentro dele.



###bombs
items.bombs.arcanebomb.name=bomba arcana
items.bombs.arcanebomb.desc=Esta bomba foi imbuída com propriedades arcanas. Ela irá detonar em uma explosão poderosa semelhante ao ataque carregado de Goo, causando _%1$d-%2$d de dano mágico_ a qualquer coisa dentro de 2 quadrados.
items.bombs.arcanebomb.discover_hint=Você pode fabricar este item através de alquimia.

items.bombs.bomb.name=bomba
items.bombs.bomb.ac_lightthrow=ACENDER & JOGAR
items.bombs.bomb.snuff_fuse=Você rapidamente apaga o pavio da bomba.
items.bombs.bomb.ondeath=A explosão mata você...
items.bombs.bomb.rankings_desc=Morto por uma explosão
items.bombs.bomb.desc=Uma bomba de pólvora preta bem pesada. Uma explosão desta bomba causa _%1$d-%2$d de dano_ a qualquer coisa adjacente a ela e irá destruir itens ou terrenos adjacentes.
items.bombs.bomb.desc_fuse=Parece que o fusível levará algumas rodadas para queimar quando estiver aceso.
items.bombs.bomb.desc_burning=O fusível da bomba está queimando, mantenha distância ou apague-o!
items.bombs.bomb$doublebomb.name=duas bombas
items.bombs.bomb$doublebomb.desc=Um par de bombas pretas e pesadas. Parece que você vai ganhar uma de graça!

items.bombs.firebomb.name=bomba de fogo
items.bombs.firebomb.desc=Esta bomba foi modificada para explodir em uma área extensa, causando _%1$d-%2$d de dano_ e espalhando chamas de longa duração em 2 blocos.
items.bombs.firebomb.discover_hint=Você pode fabricar este item através de alquimia.

items.bombs.flashbangbomb.name=bomba de luz
items.bombs.flashbangbomb.desc=Esta bomba personalizada irá irromper em um clarão de luz, som e eletricidade quando explodir. Qualquer coisa dentro de 2 quadrados receberá _%1$d-%2$d de dano_ da explosão, um dano adicional de 25%% da eletricidade e ficará atordoado por 10 turnos.
items.bombs.flashbangbomb.discover_hint=Você pode fabricar este item através de alquimia.

items.bombs.frostbomb.name=bomba de gelo
items.bombs.frostbomb.desc=Esta bomba foi modificada para explodir em uma área extensa, causando _%1$d-%2$d de dano_ e espalhando uma rajada de ar congelante de longa duração dentro de 2 quadrados ao seu redor.
items.bombs.frostbomb.discover_hint=Você pode fabricar este item através de alquimia.

items.bombs.holybomb.name=bomba sagrada
items.bombs.holybomb.desc=Esta bomba foi modificada para produzir um clarão de luz sagrada em uma extensa área quando explode. Qualquer coisa dentro de 2 quadrados receberá _%1$d-%2$d de dano_ da explosão, e inimigos mortos-vivos ou demoníacos receberão 50%% de dano adicional da luz sagrada.
items.bombs.holybomb.discover_hint=Você pode fabricar este item através de alquimia.

items.bombs.noisemaker.name=barulhenta
items.bombs.noisemaker.desc=Esta bomba personalizada emitirá ruídos repetidamente quando o fusível queimar. Quando algo tocar na bomba, ela explodirá e causará _%1$d-%2$d de dano_ a qualquer coisa dentro de 2 quadrados!
items.bombs.noisemaker.desc_burning=A barulhenta está fazendo tic-toc. Ela vai explodir quando algo se aproximar!
items.bombs.noisemaker.discover_hint=Você pode fabricar este item através de alquimia.

items.bombs.smokebomb.name=Bomba de fumaça
items.bombs.smokebomb.desc=Esta bomba foi modificada para expelir uma espessa nuvem de gás ao mesmo tempo em que explode. Ela causará _%1$d-%2$d de dano_ e espalhará névoa dentro de 2 quadrados.
items.bombs.smokebomb.discover_hint=Você pode fabricar este item através de alquimia.

items.bombs.regrowthbomb.name=bomba de maturação
items.bombs.regrowthbomb.desc=Esta bomba personalizada irá espalhar líquido que dá vida a tudo dentro de 3 quadrados ao invés de explodir. A área atingida pelo impacto rapidamente brotará grama e plantas. Você e quaisquer aliados pegos na zona de impacto serão curados, como se tivessem tomado uma poção de cura.
items.bombs.regrowthbomb.discover_hint=Você pode fabricar este item através de alquimia.

items.bombs.shrapnelbomb.name=bomba de estilhaços
items.bombs.shrapnelbomb.desc=Esta bomba foi modificada com restos de metal do DM-300, que se fragmentarão e voarão para todos os lados quando explodirem, causando _%1$d-%2$d de dano_ em uma área muito extensa ao redor da bomba. É melhor se abrigar atrás de algo ao usá-la...
items.bombs.shrapnelbomb.discover_hint=Você pode fabricar este item através de alquimia.

items.bombs.woollybomb.name=bomb-á-á
items.bombs.woollybomb.desc=Esta bomba personalizada criará um extenso rebanho de ovelhas mágicas após explodir. A explosão causará _%1$d-%2$d de dano_ a qualquer coisa dentro de 2 quadrados. As ovelhas bloquearão o movimento e persistirão por muito tempo! Porém, as ovelhas não durarão muito na presença de inimigos poderosos. Podem ser dissipadas manualmente mais cedo interagindo-se com elas.
items.bombs.woollybomb.discover_hint=Você pode fabricar este item através de alquimia.

###food
items.food.berry.name=baga da masmorra
items.food.berry.eat_msg=A baga estava saborosa!
items.food.berry.desc=Esta pequena baga foi encontrada pela Caçadora entre a vegetação da masmorra. Pode ser comida rapidamente, restaura uma pequena quantidade de saciedade e pode conter uma semente utilizável!
items.food.berry.discover_hint=Você pode encontrar este item usando um talento de herói específico.

items.food.blandfruit.name=frutinsossa
items.food.blandfruit.cooked=frutinsossa cozida
items.food.blandfruit.sunfruit=fruta-solar
items.food.blandfruit.rotfruit=podre-fruta
items.food.blandfruit.earthfruit=fruta-terra
items.food.blandfruit.blindfruit=fruta-cegante
items.food.blandfruit.firefruit=fruta-fogo
items.food.blandfruit.icefruit=fruta-gelo
items.food.blandfruit.fadefruit=fruta-fantasma
items.food.blandfruit.sorrowfruit=sofrifruta
items.food.blandfruit.stormfruit=fruta-tempestuosa
items.food.blandfruit.dreamfruit=fruta-magi
items.food.blandfruit.starfruit=fruta-estrela
items.food.blandfruit.swiftfruit=fruta-ligeira
items.food.blandfruit.raw=Você não suporta comer isto cru.
items.food.blandfruit.desc=Muito seca e sem gosto. Talvez cozinhá-la com outro ingrediente melhorasse o seu gosto.
items.food.blandfruit.desc_cooked=A fruta inchou no tempo em que ficou de molho no pote e até absorveu as propriedades da semente com a qual foi cozida. Terá o efeito de qualquer poção à qual a semente corresponda.
items.food.blandfruit.desc_eat=Parece pronto para comer!
items.food.blandfruit.desc_throw=Parece muito volátil, talvez seja melhor arremessar.
items.food.blandfruit$chunks.name=pedaços de frutinsossa
items.food.blandfruit$chunks.desc=A frutinsossa explodiu no impacto, deixando pedaços inertes para trás.\n\nApesar de um pouco sujos, estes grandes pedaços de frutinsossa cozida parecem perfeitamente comestíveis.

items.food.chargrilledmeat.name=carne grelhada
items.food.chargrilledmeat.desc=Tem a aparência de um bife decente.
items.food.chargrilledmeat.discover_hint=Você pode criar isto usando outro alimento.

items.food.food.name=ração
items.food.food.ac_eat=COMER
items.food.food.eat_msg=A comida estava deliciosa!
items.food.food.desc=Nada de mais aqui: carne seca, alguns biscoitos - coisas desse tipo.

items.food.frozencarpaccio.name=carpaccio congelado
items.food.frozencarpaccio.invis=Você vê suas mãos tornarem-se invisíveis!
items.food.frozencarpaccio.hard=Você sente sua pele endurecer!
items.food.frozencarpaccio.refresh=Revigorante!
items.food.frozencarpaccio.better=Você se sente melhor!
items.food.frozencarpaccio.desc=É um pedaço de carne crua congelada. A única maneira de comer é cortando em fatias bem finas. E desta forma, fica surpreendentemente bom.
items.food.frozencarpaccio.discover_hint=Você pode criar isto usando outro alimento.

items.food.meatpie.name=torta de carne
items.food.meatpie.eat_msg=A comida estava incrível!
items.food.meatpie.desc=Uma deliciosa torta recheada de carne saborosa. Isso vai saciá-lo muito mais do que qualquer outra refeição.
items.food.meatpie.discover_hint=Você pode fabricar este item através de alquimia.

items.food.mysterymeat.name=carne misteriosa
items.food.mysterymeat.eat_msg=A comida estava com um gosto... esquisito.
items.food.mysterymeat.hot=Ah! Está quente!
items.food.mysterymeat.legs=Você não sente suas pernas!
items.food.mysterymeat.not_well=Você não se sente bem.
items.food.mysterymeat.stuffed=Você está estufado.
items.food.mysterymeat.desc=Coma por sua própria conta e risco.
items.food.mysterymeat.discover_hint=Você pode obter este item como um saque de certos inimigos.
items.food.mysterymeat$placeholder.name=carne

items.food.phantommeat.name=carne fantasma
items.food.phantommeat.desc=Um grande e brilhante bife translúcido, cortado de uma piranha fantasma. Esta carne mágica não precisa ser cozida e concede uma série de benefícios defensivos, além de saciá-lo completamente. Quando comida, concede invisibilidade, pele arbórea, restaura certa quantidade de PV e cura muitos efeitos nocivos.
items.food.phantommeat.discover_hint=Você pode obter este item como um saque de certos inimigos.

items.food.pasty.name=salgado
items.food.pasty.fish_name=peixe ao vapor
items.food.pasty.amulet_name=amuleto de yendor?
items.food.pasty.egg_name=ovo de páscoa
items.food.pasty.rainbow_name=poção arco-íris
items.food.pasty.shattered_name=bolo verde
items.food.pasty.pie_name=torta de abóbora
items.food.pasty.vanilla_name=bolo azul
items.food.pasty.cane_name=bengala doce
items.food.pasty.sparkling_name=poção espumante
items.food.pasty.desc=Um autêntico salgado da Cornualha com um recheio tradicional de carne bovina e batata. Delicioso!
items.food.pasty.fish_desc=Um peixe inteiro cozido ao vapor, magicamente preservado em uma cama de verduras. É tradição guardar um pouco de peixe para mais tarde nesta época do ano, então você vai guardar algumas sobras em vez de comer tudo de uma vez.\n\nFeliz Ano Novo Lunar!
items.food.pasty.amulet_desc=Você finalmente o encontrou, o amuleto mágico de... espera um minuto, isto é apenas um chocolate embrulhado em papel alumínio feito para parecer o amuleto! Ele não irá dar a você poder ilimitado, mas pelo menos te deixará cheio e lhe dará uma pequena carga de artefato.\n\n1° de Abril!
items.food.pasty.egg_desc=Um ovo bem grande de chocolate, envolto em papel alumínio amarelo colorido. Há chocolate de sobra aqui para deixá-lo cheio e o açúcar pode dar aos seus artefatos um pouquinho de carga extra.\n\nFeliz Páscoa!
items.food.pasty.rainbow_desc=Esta poção colorida é uma espécie de alimento líquido. Além de satisfazer sua fome, contém um pouco de magia que acalmará um inimigo adjacente que não seja chefe, fazendo-o temporariamente hesitante em lutar contra você.\n\nFeliz Orgulho Gay!
items.food.pasty.shattered_desc=Esta fatia grande de bolo de baunilha tem granulados coloridos e cobertura verde. O bolo foi feito para comemorar anos de experiência e vai lhe conceder um pouco dessa experiência quando comido.\n\nShattered Pixel Dungeon foi lançado pela primeira vez em 5 de agosto de 2014. Feliz aniversário, Shattered Pixel Dungeon!
items.food.pasty.pie_desc=Um pedaço bem grande de torta de abóbora! Seu sabor doce e apimentado irá deixar você cheio e lhe dará um pouco de cura.\n\nFeliz Dia das Bruxas!
items.food.pasty.vanilla_desc=Esta fatia grande de bolo de baunilha tem granulados coloridos e cobertura azul. O bolo foi feito para comemorar anos de experiência e vai lhe conceder um pouco dessa experiência quando comido.\n\nO Pixel Dungeon original foi lançado em 4 de dezembro de 2012. Feliz aniversário, Pixel Dungeon!
items.food.pasty.cane_desc=Uma enorme e açucarada bengala doce! É grande o suficiente para matar sua fome, e o açúcar pode dar à suas varinhas um pouquinho de carga extra também.\n\nFeliz Natal!
items.food.pasty.sparkling_desc=Esta poção espumante é uma espécie de alimento líquido. Sacia a fome e simula vinho espumante, mas na verdade não é alcoólico.  A sensação de calor na barriga lhe dará um pouco de proteção.\n\nFeliz Ano Novo!
items.food.pasty$fishleftover.name=Sobras de peixe
items.food.pasty$fishleftover.eat_msg=A comida estava razoável.
items.food.pasty$fishleftover.desc=Algum peixe que sobrou da sua refeição anterior. Você pode comer a qualquer momento para saciar um pouco de fome.

items.food.smallration.name=ração pequena
items.food.smallration.eat_msg=A comida estava razoável.
items.food.smallration.desc=Parece exatamente como uma ração comum, mas um pouco menor.
items.food.smallration.discover_hint=Você pode comprar este item em uma loja.

items.food.stewedmeat.name=carne cozida
items.food.stewedmeat.eat_msg=A comida estava razoável.
items.food.stewedmeat.desc=Ensopar a carne limpou-a de qualquer doença ou parasita. Deve ser seguro comer.
items.food.stewedmeat.discover_hint=Você pode fabricar este item através de alquimia.

items.food.supplyration.name=ração de suprimento
items.food.supplyration.desc=Esta ração foi deixada na masmorra por membros e para membros da guilda dos ladrões. Ela foi projetada especificamente para ser consumida em viagem e para ajudar em trapaças em geral.\n\nEmbora não o sacie tanto quanto uma ração normal, pode ser comida rapidamente, fornece um pouco de cura direta e restaurará uma carga da capa das sombras do Ladino.
items.food.supplyration.discover_hint=Você pode encontrar este item usando um talento de herói específico.



##journal items
items.journal.documentpage.name=página rasgada
items.journal.documentpage.desc=Uma página sólitaria, provavelmente rasgada de algum livro. Voce precisa pegar para poder lê-la.

items.journal.alchemypage.name=página do livro de alquimia rasgada
items.journal.alchemypage.desc=Uma página rasgada de um guia sobre alquimia.\n\nA maior parte do texto é pequeno demais para ler a distância, mas você pode ver o título da página:\n\n_"%s"_

items.journal.guidebook.name=tomo de maestria da masmorra
items.journal.guidebook.hint_mobile=Seu guia tem conselhos para você! Toque no botão piscante do diário no canto superior direito para lê-lo.
items.journal.guidebook.hint_desktop=Seu guia tem conselhos para você! Selecione o botão de diário piscante (%s) no canto superior direito para lê-lo.
items.journal.guidebook.hint_status=Guia
items.journal.guidebook.desc=Um guia do aventureiro, deixado aqui por alguém que decidiu que se aventurar não era para ele! Este livro em particular é mágico e pode incitar aventureiros a ler uma página no momento certo.\n\nApesar dessa funcionalidade, o livro é popular por causa das grandes palavras "Não entre em Pânico" escritas em grandes letras amigáveis na capa.

items.journal.guidepage.name=página rasgada do guia
items.journal.guidepage.desc=Uma página rasgada de um guia de aventura.\n\nA maior parte do texto é muito pequena para ser lida a distância, mas você consegue ler o título da página:\n\n_"%s"_

items.journal.regionlorepage$sewers.name=carta deteriorada
items.journal.regionlorepage$sewers.desc=Parece ser uma carta, escrita em um pedaço de papel sujo de terra. Você precisa pegá-la para conseguir entender o que está escrito.

items.journal.regionlorepage$prison.name=página de diário desgastada
items.journal.regionlorepage$prison.desc=Uma nota, ou algum outro tipo de registro, escrita em um velho pedaço de papel. Parece ter sofrido menos do que as cartas que você encontrou nos esgotos, mas você ainda precisa pegá-la para ler o que está escrito.

items.journal.regionlorepage$caves.name=página de registro antiga
items.journal.regionlorepage$caves.desc=Parece ser uma página de um diário pertencente a algum explorador, incrivelmente bem preservada, apesar do quão antiga deva ser. Pegue-a para ler.

items.journal.regionlorepage$city.name=tabuleta enferrujada
items.journal.regionlorepage$city.desc=Uma pequena e enferrujada tabuleta de metal com uma mensagem magicamente entalhada nela. As letras ainda estão claras mesmo tendo sido escritas anos atrás, mas você precisa pegá-la para ler o que está escrito.

items.journal.regionlorepage$halls.name=tabuleta brilhante
items.journal.regionlorepage$halls.desc=Uma pequena tabuleta preta, com letras verdes brilhantes entalhadas nela. As brilhantes letras juntas formam um borrão quando vistas de longe. Você precisa pegar a tabuleta para lê-la.


###keys
items.keys.goldenkey.name=chave dourada
items.keys.goldenkey.desc=Os entalhes desta chave de ouro são pequenos e intrincados. Talvez ela abra um baú trancado?

items.keys.crystalkey.name=Chave de Cristal
items.keys.crystalkey.desc=As superfícies cortadas desta chave cristalina brilham na escuridão. Talvez abra algo feito de cristal?

items.keys.ironkey.name=chave de ferro
items.keys.ironkey.desc=Os entalhes nesta chave de ferro antiga estão bem desgastados; seu cordão de couro está desgastado pela idade. Que porta poderia abrir?

items.keys.wornkey.name=chave desgastada
items.keys.wornkey.desc=Esta chave está gasta e desbotada, mas parece importante. Provavelmente consegue abrir alguma porta importante por perto.



