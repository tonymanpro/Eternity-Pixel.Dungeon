items.weapon.weapon$enchantment.rankings_desc=Morto por um encantamento
items.weapon.weapon$enchantment.discover_hint=Você pode encontrar um item com este efeito aleatoriamente na masmorra ou tentar aplicá-lo a um item você mesmo.


###misc items
items.amulet.name=amuleto de yendor
items.amulet.ac_end=TERMINAR O JOGO
items.amulet.desc=O Amuleto de Yendor é o artefato mais poderoso conhecido por humanos ou anões. Seus cristais reluzentes contêm um incrível e assombroso poder.
items.amulet.desc_origins=As origens do amuleto são desconhecidas. A história diz que o Rei dos Anões se gabou de ter descoberto o artefato pouco antes de a civilização anã cortar todo o contato. Como ele encontrou? Como Yog-Dzewa tomou dele? Perguntas para outro momento talvez, tudo o que importa agora é que o amuleto é seu!
items.amulet.desc_ascent=As origens do amuleto são desconhecidas, mas claramente foi fortemente influenciada pelo poder de Yog-Dzewa. A masmorra parece estar se submetendo à vontade de Yog conforme você se move por ela, tornando os inimigos muito mais abundantes e poderosos! Você também não pode mais ativar ou descartar o amuleto, quase como se estivesse amaldiçoado.
items.amulet.ascent_title=Ascensão
items.amulet.ascent_desc=Você começa a sentir o grande e terrível poder de Yog-Dzewa irradiando do amuleto. Subir de volta pela masmorra como um mortal pode ser mais difícil do que você pensava!\n\nSe você continuar subindo com o amuleto, a masmorra se tornará mais perigosa, os teletransportes entre os andares serão desativados e você só poderá vencer o jogo derrotando os inimigos enquanto sobe pela masmorra!\n\nVocê pode deixar o amuleto aqui por enquanto se quiser subir sem iniciar este desafio, ou ativar o amuleto antes de subir para terminar o jogo normalmente.
items.amulet.ascent_yes=Continuar!
items.amulet.ascent_no=Parar por agora
items.amulet.discover_hint=Você pode encontrar este item no fundo da masmorra...

items.ankh.name=ankh
items.ankh.ac_bless=ABENÇOAR
items.ankh.bless=Você abençoa o ankh com água mágica.
items.ankh.desc=Este antigo símbolo de imortalidade concede a habilidade de retornar à vida após a morte. A maioria de seus itens serão deixados onde você morreu, mas poderão ser recuperados se você os pegar. Utilizando um odre cheio, o ankh pode ser abençoado com força adicional.
items.ankh.desc_blessed=Este antigo símbolo de imortalidade concede a habilidade de retornar da vida-após-a-morte. Este ankh foi abençoado com força extra e é agora muito mais forte. Agora o ankh irá se sacrificar para salvar você em um momento de perigo mortal.
items.ankh.discover_hint=Você pode comprar este item em uma loja.

items.arcaneresin.name=resina arcana
items.arcaneresin.prompt=Selecione uma varinha
items.arcaneresin.ac_apply=APLICAR
items.arcaneresin.level_too_high=Esta varinha é muito poderosa para ser melhorada pela resina.
items.arcaneresin.not_enough=Você não tem resina suficiente para isso!
items.arcaneresin.apply=Você reveste sua varinha com resina, aumentando seu poder!
items.arcaneresin.desc=Este fino pó reluz entre tons de branco e roxo. Ele pode agir como um amplificador de energia mágica, melhorando o nível de suas varinhas quando aplicado a elas!\n\nAprimorar uma varinha custa 1, 2 ou 3 de resina dependendo do nível inicial dela. Resina pode melhorar varinhas para um máximo de +3.\n\nEntretanto, os aprimoramentos através da resina são _sobrescritos por outras fontes de aprimoramento_ (como pergaminhos do aprimoramento) e não se aplicam quando a varinha é imbuída ao cajado do Mago.
items.arcaneresin.discover_hint=Você pode fabricar este item através de alquimia.

items.brokenseal.name=selo quebrado
items.brokenseal.ac_affix=AFIXAR
items.brokenseal.prompt=Escolha uma armadura
items.brokenseal.unknown_armor=Você deve primeiro identificar se a armadura está ou não amaldiçoada.
items.brokenseal.cursed_armor=O selo não se aplica a armaduras amaldiçoadas.
items.brokenseal.affix=Você equipa o selo na armadura!
items.brokenseal.desc=Um selo de cera, afixado à armadura como símbolo de valor. Possui uma runa desbotada de proteção gravada no centro e está rachado ao meio.\n\nUma lembrança de seu lar, o selo ajuda o guerreiro a seguir em frente. Enquanto estiver usando o selo, o guerreiro ganhará blindagem instantaneamente quando estiver prestes a sofrer dano para metade da sua vida ou menos..\n\nO selo pode ser _afixado à armadura_ e movido entre armaduras. Pode levar um único aprimoramento consigo, desde que o aprimoramento tenha sido aplicado à armadura enquanto o selo estava afixado nela.
items.brokenseal.inscribed=O selo está inscrito com _%s._
items.brokenseal.choose_title=Escolha um Glifo
items.brokenseal.choose_desc=Tanto esta armadura quanto o selo quebrado carregam um glifo. Escolha qual glifo deve ser mantido.\n\nGlifo da armadura: %1$s\nGlifo do Selo Quebrado: %2$s\n\nObserve que se você escolher o glifo que está atualmente na armadura, o selo não poderá transferi-lo depois.
items.brokenseal.discover_hint=Um dos heróis inicia com este item.
items.brokenseal$warriorshield.name=Blindagem do Guerreiro
items.brokenseal$warriorshield.desc_active=O selo quebrado do Guerreiro está atualmente ajudando-o a perseverar, concedendo-lhe escudo além de sua vida. Antes de poder ser usado novamente, há um tempo de recarga após a blindagem ter sido inicialmente ativada.\n\nEsta blindagem não se deteriora com o tempo, mas terminará se não houver inimigos por perto por alguns turnos. Quando acabar, qualquer unidade de blindagem não utilizada reduzirá o tempo de recarga, até um máximo de 50%%.\n\nBlindagem restante: %1$d.\n\nTempo de recarga atual: %2$d.
items.brokenseal$warriorshield.desc_cooldown=O Guerreiro ganhou recentemente blindagem de seu selo quebrado e deve esperar até que possa se beneficiar de seu efeito de proteção novamente.\n\nTurnos restantes: %d.
items.brokenseal$warriorshield.desc_negative_cooldown=O tempo de recarga de blindagem do Guerreiro está atualmente negativo, significando que, quando seu escudo é ativado, o tempo de recarga será menor que os 150 turnos usuais. O tempo de recarga de blindagem pode ser reduzido para até -150 turnos, o que significa que estará disponível imediatamente após ser ativada.\n\nTempo de recarga atual: %d.

items.dewdrop.name=gota de orvalho
items.dewdrop.already_full=Você já está com a vida cheia.
items.dewdrop.desc=Uma gota de orvalho clara como cristal.\n\nGraças à magia deste lugar, a água pura tem um pouco de propriedades curativas.

items.equipableitem.curse_detected=Você sentiu que o item estava amaldiçoado assim que ia equipá-lo!
items.equipableitem.unequip_cursed=Você não pode remover um item amaldiçoado!
items.equipableitem.ac_equip=EQUIPAR
items.equipableitem.ac_unequip=DESEQUIPAR

items.energycrystal.name=cristal de energia
items.energycrystal.desc=Uma coleção de pequenos cristais mágicos, cheios de energia alquímica.\n\nEstes cristais são os ingredientes mais comuns em receitas alquímicas e podem ser produzidos em um pote de alquimia reciclando itens consumíveis.

items.gold.name=ouro
items.gold.desc=Uma pilha de moedas de ouro. Colete moedas de ouro para gastá-las mais tarde em uma loja.

items.heap.for_sale=%1$dg: %2$s
items.heap.chest=Baú
items.heap.chest_desc=Você não conseguirá saber o que tem dentro até abri-lo!
items.heap.locked_chest=Baú trancado
items.heap.locked_chest_desc=Você não vai saber o que tem dentro enquanto não abrir! Mas para abrir é necessário uma chave dourada.
items.heap.crystal_chest=Baú de cristal
items.heap.crystal_chest_desc=Você pode ver _%s_ dentro, mas para abrir o baú você precisa de uma chave de cristal.
items.heap.artifact=um artefato
items.heap.wand=uma varinha
items.heap.ring=um anel
items.heap.tomb=Tumba
items.heap.tomb_desc=Esta tumba antiga pode conter algo útil, mas seu dono certamente irá se opor à sua perturbação.
items.heap.skeleton=Restos de esqueleto
items.heap.skeleton_desc=Isto é tudo o que resta de algum aventureiro desafortunado. Talvez valha a pena verificar se há alguma coisa de valor.
items.heap.remains=Restos de um herói
items.heap.remains_desc=Isto é tudo o que resta de algum de seus predecessores. Talvez valha a pena verificar se há algo de valor.

items.honeypot.name=pote de mel
items.honeypot.ac_shatter=QUEBRAR
items.honeypot.desc=Este grande pote de mel, na verdade, só é revestido com mel e abriga uma abelha gigante! Esse tipo de abelha enorme costuma ficar em sua colmeia. Será que esse pote é uma espécie de gaiola feita por um caçador especializado? A abelha parece bastante feliz dentro do pote com seu mel, mas zuni com desconfiança quando você olha dentro dele.
items.honeypot$shatteredpot.name=pote rachado
items.honeypot$shatteredpot.desc=Este pote está rachado, e apenas o mel grudento que o reveste está segurando sua estrutura. Ele está se despedaçando aos poucos\n\nApesar de suas rachaduras irreparáveis, a abelha ainda parece querer proteger o pote.

