items.weapon.melee.magesstaff.imbue_unknown=Você não sabe o nível desta varinha, mas esta imbuição resultará em pelo menos um cajado _+%d._
items.weapon.melee.magesstaff.imbue_cursed=_Se imbuir uma varinha amaldiçoada, então seu cajado também se tornará amaldiçoado!_
items.weapon.melee.magesstaff.imbue_lost=A varinha atualmente imbuída em seu cajado _será perdida_.
items.weapon.melee.magesstaff.imbue_talent=A varinha atualmente imbuída em seu cajado _será devolvida em +0_.
items.weapon.melee.magesstaff.yes=Sim, tenho certeza.
items.weapon.melee.magesstaff.no=Não, eu mudei de ideia.
items.weapon.melee.magesstaff.desc=Feito pelo próprio Mago, este cajado é uma arma mágica única que pode ser imbuída com uma varinha.
items.weapon.melee.magesstaff.no_wand=O cajado não possui magia no momento, deve ser _imbuído com o poder de uma varinha_ antes que possa ser usado para lançar feitiços.
