items.artifacts.driedrose$petal.no_rose=Você não tem uma rosa para reanexar esta pétala.
items.artifacts.driedrose$petal.no_room=Não há mais espaço para esta pétala, então você a descarta.
items.artifacts.driedrose$petal.maxlevel=A rosa está completa!
items.artifacts.driedrose$petal.levelup=Você reanexa a pétala à rosa.
items.artifacts.driedrose$petal.desc=Uma frágil pétala seca, que de alguma forma sobreviveu até agora nesta masmorra.
items.artifacts.driedrose$wndghosthero.title=Equipamento do fantasma
items.artifacts.driedrose$wndghosthero.desc=O fantasma é fraco sozinho, porém sua forma é sólida o suficiente para se equipar com arma e armadura. Ele será capaz de usar esses itens assim como você.\n\nO fantasma pode equipar itens que requeiram até _%d de força._
items.artifacts.driedrose$wndghosthero.weapon_prompt=Selecione uma arma
items.artifacts.driedrose$wndghosthero.armor_prompt=Escolha uma armadura
items.artifacts.driedrose$wndghosthero.cant_unique=O fantasma não pode usar itens únicos
items.artifacts.driedrose$wndghosthero.cant_cursed=O fantasma só pode usar equipamentos que você tem certeza de que não estão amaldiçoados.
items.artifacts.driedrose$wndghosthero.cant_strength_unknown=O fantasma pode não ser forte o suficiente para usar isto.
items.artifacts.driedrose$wndghosthero.cant_strength=O fantasma não é forte o suficiente para usar isto.

##ghost hero
items.artifacts.driedrose$ghosthero.name=fantasma triste
items.artifacts.driedrose$ghosthero.def_verb=desviou
items.artifacts.driedrose$ghosthero.discover_hint=Você pode encontrar este personagem com um artefato específico.

items.artifacts.driedrose$ghosthero.hello=Olá novamente %s.
items.artifacts.driedrose$ghosthero.introduce=Meu espírito está ligado a esta rosa, foi muito preciosa para mim, um presente do meu amor que deixei na superfície.\n\nEu não posso voltar para ele, mas graças a você eu tenho uma segunda chance para completar minha jornada. Quando eu puder, responderei ao seu chamado e lutarei junto a você.\n\nContanto que tenha a rosa, eu posso ouvir a sua voz, então você pode usá-la para me liderar de longe.\n\nEspero que você possa ter sucesso onde eu falhei...

items.artifacts.driedrose$ghosthero.dialogue_sewers_1=Estes esgotos costumavam ser seguros, as pessoas até moravam aqui no inverno.
items.artifacts.driedrose$ghosthero.dialogue_sewers_2=Eu fico imaginando o que aconteceu com os guardas que patrulhavam estes corredores... Será que desistiram?
items.artifacts.driedrose$ghosthero.dialogue_sewers_3=Eu tinha uma família na superfície, espero que estejam seguros.
items.artifacts.driedrose$ghosthero.dialogue_sewers_4=Os guardas não conseguiram derrotar esses monstros, mas talvez nós possamos.
items.artifacts.driedrose$ghosthero.dialogue_sewers_5=Se até os esgotos são perigosos, eu me pergunto o que há abaixo...
items.artifacts.driedrose$ghosthero.dialogue_sewers_6=O que poderia ter causado o crescimento assombroso desses ratos e caranguejos?
items.artifacts.driedrose$ghosthero.dialogue_prison_1=Eu já ouvi histórias sobre este lugar, nada bom.
items.artifacts.driedrose$ghosthero.dialogue_prison_2=Este lugar sempre foi mais uma masmorra do que uma prisão.
items.artifacts.driedrose$ghosthero.dialogue_prison_3=Eu não consigo imaginar o que aconteceu quando este lugar foi abandonado.
items.artifacts.driedrose$ghosthero.dialogue_prison_4=Parece que tanto os prisioneiros como os guardas foram transformados em monstros.
items.artifacts.driedrose$ghosthero.dialogue_prison_5=O que poderia ser responsável por todos esses esqueletos?
items.artifacts.driedrose$ghosthero.dialogue_prison_6=Essas pessoas não tinham que acabar assim...
items.artifacts.driedrose$ghosthero.dialogue_caves_1=Nenhum humano ou anão esteve aqui há muito tempo.
items.artifacts.driedrose$ghosthero.dialogue_caves_2=O que faria com que os anões abandonassem uma mina de ouro?
items.artifacts.driedrose$ghosthero.dialogue_caves_3=É uma pena que todo o ouro aqui seja inútil na superfície.
items.artifacts.driedrose$ghosthero.dialogue_caves_4=As criaturas aqui são distorcidas, assim como nos esgotos.
items.artifacts.driedrose$ghosthero.dialogue_caves_5=Até os morcegos são sanguinários aqui.
items.artifacts.driedrose$ghosthero.dialogue_caves_6=Nenhum sinal de qualquer equipamento de mineração, os anões recuperaram tudo?
items.artifacts.driedrose$ghosthero.dialogue_city_1=Os anões eram engenhosos, mas gananciosos.
items.artifacts.driedrose$ghosthero.dialogue_city_2=Então a metrópole dos anões realmente caiu.
items.artifacts.driedrose$ghosthero.dialogue_city_3=Espero que a superfície nunca acabe como este lugar.
items.artifacts.driedrose$ghosthero.dialogue_city_4=Anões não deveriam parecer tão pálidos.
items.artifacts.driedrose$ghosthero.dialogue_city_5=Eu não sei o que é pior, os anões ou suas criações.
items.artifacts.driedrose$ghosthero.dialogue_city_6=Parece que os anões também são monstros irracionais agora.
items.artifacts.driedrose$ghosthero.dialogue_halls_1=O que é este lugar?
items.artifacts.driedrose$ghosthero.dialogue_halls_2=Este lugar é aterrorizante...
items.artifacts.driedrose$ghosthero.dialogue_halls_3=O que os anões estavam pensando, brincando com um poder como esse?
items.artifacts.driedrose$ghosthero.dialogue_halls_4=Os monstros aqui são de outro mundo, de onde eles vieram?
items.artifacts.driedrose$ghosthero.dialogue_halls_5=Consegue sentir? É como se algo estivesse nos observando.
items.artifacts.driedrose$ghosthero.dialogue_halls_6=Graças aos céus há tochas, é muito escuro aqui!
items.artifacts.driedrose$ghosthero.dialogue_ascension_1=Por que isto está acontecendo, eu pensei que tínhamos conseguido?
items.artifacts.driedrose$ghosthero.dialogue_ascension_2=Como pode aquela coisa ainda ser capaz de ter influência sobre este mundo?
items.artifacts.driedrose$ghosthero.dialogue_ascension_3=Espero que você saiba o que está fazendo com esse amuleto.
items.artifacts.driedrose$ghosthero.dialogue_ascension_4=Suponho que ainda não terminamos.
items.artifacts.driedrose$ghosthero.dialogue_ascension_5=Já chegamos tão longe, nós podemos conseguir!
items.artifacts.driedrose$ghosthero.dialogue_ascension_6=Só mais um pouco. Nós vamos conseguir sair daqui!

items.artifacts.driedrose$ghosthero.seen_goo_1=Cuidado com o Goo!
items.artifacts.driedrose$ghosthero.seen_goo_2=Muitos dos meus amigos morreram para essa coisa, hora da vingança!
items.artifacts.driedrose$ghosthero.seen_goo_3=Tal abominação não pode viver!
items.artifacts.driedrose$ghosthero.seen_tengu_1=O prisioneiro que restou é um assassino mortal. Mas é claro...
items.artifacts.driedrose$ghosthero.seen_tengu_2=Ele nos prendeu!
items.artifacts.driedrose$ghosthero.seen_tengu_3=Eu ouvi histórias de horror sobre essa máscara...
items.artifacts.driedrose$ghosthero.seen_dm300_1=Somente anões constroem uma máquina de mineração que mata intrusos.
items.artifacts.driedrose$ghosthero.seen_dm300_2=Essa coisa é enorme...
items.artifacts.driedrose$ghosthero.seen_dm300_3=Como essa coisa permaneceu ativa por tanto tempo?
items.artifacts.driedrose$ghosthero.seen_king_1=Quando as pessoas dizem que o poder corrompe, é isso que querem dizer.
items.artifacts.driedrose$ghosthero.seen_king_2=Ele é mais um lich que um rei agora.
items.artifacts.driedrose$ghosthero.seen_king_3=Mesmo na morte, os anões obedecem ao seu mestre.
items.artifacts.driedrose$ghosthero.seen_yog_1=Ah, isso não parece bom.
items.artifacts.driedrose$ghosthero.seen_yog_2=Então é assim que um deus se parece?
items.artifacts.driedrose$ghosthero.seen_yog_3=Isto vai doer...

items.artifacts.driedrose$ghosthero.defeated_by_enemy_1=Boa sorte...
items.artifacts.driedrose$ghosthero.defeated_by_enemy_2=Cansado... por agora...
items.artifacts.driedrose$ghosthero.defeated_by_enemy_3=Eu retornarei...
items.artifacts.driedrose$ghosthero.defeated_by_boss_1=Desculpe-me... boa sorte...
items.artifacts.driedrose$ghosthero.defeated_by_boss_2=Termine... sem mim...
items.artifacts.driedrose$ghosthero.defeated_by_boss_3=Não... Eu não posso...
items.artifacts.driedrose$ghosthero.blessed_ankh_1=Como você sobreviveu a isso?
items.artifacts.driedrose$ghosthero.blessed_ankh_2=Eu queria ter tido um desses...
items.artifacts.driedrose$ghosthero.blessed_ankh_3=Abençoado seja! Você ainda vive!
items.artifacts.driedrose$ghosthero.player_killed_1=Não!...
items.artifacts.driedrose$ghosthero.player_killed_2=Eu não pude ajudar você...
items.artifacts.driedrose$ghosthero.player_killed_3=Não desse jeito...

items.artifacts.driedrose$ghosthero.direct_prompt=O que devo fazer?
items.artifacts.driedrose$ghosthero.directed_follow_1=Está bem, eu vou seguir você.
items.artifacts.driedrose$ghosthero.directed_follow_2=Eu ficarei na sua retaguarda.
items.artifacts.driedrose$ghosthero.directed_follow_3=Seguindo você...
items.artifacts.driedrose$ghosthero.directed_follow_4=Está bem, vamos lá!
items.artifacts.driedrose$ghosthero.directed_follow_5=Eu cubro a sua retaguarda.
items.artifacts.driedrose$ghosthero.directed_attack_1=Entendido, eu vou atacar esse.
items.artifacts.driedrose$ghosthero.directed_attack_2=Eu tomo conta desse.
items.artifacts.driedrose$ghosthero.directed_attack_3=Engajando...
items.artifacts.driedrose$ghosthero.directed_attack_4=Vamos pegá-los!
items.artifacts.driedrose$ghosthero.directed_attack_5=Eu fico com esse.
items.artifacts.driedrose$ghosthero.directed_position_1=Está bem, eu vou guardar essa posição.
items.artifacts.driedrose$ghosthero.directed_position_2=Eu irei até lá e defenderei.
items.artifacts.driedrose$ghosthero.directed_position_3=Reposicionando...
items.artifacts.driedrose$ghosthero.directed_position_4=A caminho!
items.artifacts.driedrose$ghosthero.directed_position_5=Eu irei para lá.

items.artifacts.driedrose$ghosthero.desc=Uma figura etérea frágil com uma forma humanoide. Seu poder parece atrelado à rosa que você tem.\n\nEste fantasma pode não ser muito, mas parece ser seu único amigo de verdade aqui embaixo.

##back to artifacts
