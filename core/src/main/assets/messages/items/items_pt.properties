###armor curses
items.armor.curses.antientropy.name=%s de antientropia
items.armor.curses.antientropy.desc=A maldição antientropia funciona contra as forças do universo, puxando energia para o usuário e de seus arredores. Isso incendeia brevemente o usuário, mas congela tudo ao seu redor!

items.armor.curses.bulk.name=%s volumosa
items.armor.curses.bulk.desc=Armaduras volumosas parecem maiores e mais imponentes, mas na verdade não oferecem defesa aprimorada. Pior ainda, o tamanho excessivo dificulta bastante a passagem por portas.

items.armor.curses.corrosion.name=%s de corrosão
items.armor.curses.corrosion.desc=Uma armadura de corrosão é capaz de expelir violentamente um líquido corrosivo, cobrindo tudo na área com um muco ácido pegajoso.

items.armor.curses.displacement.name=%s de deslocamento
items.armor.curses.displacement.desc=A maldição de deslocamento move o usuário para um lugar seguro quando o mesmo é atacado. É efetivo até demais, teletransportando aleatoriamente o usuário pelo andar.

items.armor.curses.metabolism.name=%s metabolizante
items.armor.curses.metabolism.desc=A maldição metabolizante converte diretamente saciedade em vida quando o usuário é atingido, provendo um bônus de regeneração, porém fazendo com que você fique faminto mais rápido.

items.armor.curses.multiplicity.name=%s da multiplicidade
items.armor.curses.multiplicity.desc=Armadura amaldiçoada com multiplicidade contém uma perigosa magia de duplicação. Ela irá, às vezes, criar uma imagem espelhada do usuário quando atacado, mas tem a mesma chance de duplicar o atacante!

items.armor.curses.overgrowth.name=%s de super crescimento
items.armor.curses.overgrowth.desc=Sua armadura de super crescimento é coberta com várias plantas florescendo. Embora este efeito certamente pareça interessante, elas não ajudam nada para defesa, e essas plantas serão ativadas aleatoriamente em combate!

items.armor.curses.stench.name=%s de fedor
items.armor.curses.stench.desc=Armadura amaldiçoada com fedor liberará nuvens de gás tóxico, que são perigosas para tudo que entra em contato.


###glyphs
items.armor.glyphs.affection.name=%s da afeição
items.armor.glyphs.affection.desc=Este poderoso glifo manipula a mente dos atacantes, encantando-os temporariamente.

items.armor.glyphs.antimagic.name=%s de antimagia
items.armor.glyphs.antimagic.desc=Este poderoso glifo permite que a armadura defenda seu usuário contra ataques mágicos e físicos. Esta defesa mágica não é afetada pelo tier da armadura.

items.armor.glyphs.brimstone.name=%s de enxofre
items.armor.glyphs.brimstone.desc=Este glifo protege o usuário e seus pertences do fogo, anulando completamente seus danos e efeitos negativos.

items.armor.glyphs.camouflage.name=%s de camuflagem
items.armor.glyphs.camouflage.desc=Este glifo permite que o usuário se camufle em grama alta, garantindo invisibilidade temporária.

items.armor.glyphs.entanglement.name=%s do emaranhamento
items.armor.glyphs.entanglement.desc=Este glifo cresce armadura de terra ao redor do usuário para absorver dano, mas esta armadura vai quebrar se o usuário se mover.

items.armor.glyphs.flow.name=%s de fluxo
items.armor.glyphs.flow.desc=Este glifo manipula o fluxo de água em volta do usuário, fazendo com que o mesmo se movimente mais rápido ao andar sobre ela.

items.armor.glyphs.obfuscation.name=%s de ofuscamento
items.armor.glyphs.obfuscation.desc=Esse glifo obscurece o usuário, dificultando sua detecção.

items.armor.glyphs.potential.name=%s do potencial
items.armor.glyphs.potential.desc=Este glifo gera energia quando atingido, concedendo carga à varinha do usuário quando ativado.

items.armor.glyphs.repulsion.name=%s de repulsão
items.armor.glyphs.repulsion.desc=Este glifo rebate com força contra atacantes, fazendo-os voarem para trás.

items.armor.glyphs.stone.name=%s de pedra
items.armor.glyphs.stone.desc=Este glifo cobre a armadura com uma pedra mágica pesada que faz com que esquivar seja impossível, mas bloqueia os danos em proporção à evasão.

items.armor.glyphs.swiftness.name=%s de rapidez
items.armor.glyphs.swiftness.desc=Este glifo aumenta a velocidade do usuário sempre que ele não está perto de um inimigo.

items.armor.glyphs.thorns.name=%s de espinhos
items.armor.glyphs.thorns.desc=Este poderoso glifo fere os atacantes, fazendo com que eles sangrem lentamente quando atacam o usuário.

items.armor.glyphs.viscosity.name=%s da viscosidade
items.armor.glyphs.viscosity.deferred=%d adiado
items.armor.glyphs.viscosity$defereddamage.name=dano adiado
items.armor.glyphs.viscosity$defereddamage.ondeath=O dano adiado matou você...
items.armor.glyphs.viscosity$defereddamage.rankings_desc=Morto por dano adiado
items.armor.glyphs.viscosity$defereddamage.desc=Os danos são causados lentamente ao longo do tempo, em vez de imediatamente.\n\nDano adiado restante: %d.
items.armor.glyphs.viscosity.desc=Este glifo é capaz de armazenar dano infligido ao usuário, distribuindo o dano lentamente em vez de uma única vez.



