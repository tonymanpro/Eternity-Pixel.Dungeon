items.weapon.missiles.missileweapon.dust=A arma de arremesso vira pó quando você a toca.
items.weapon.missiles.missileweapon.break_upgraded_warn_desc=Se a última arma de arremesso do seu conjunto de armas de arremesso aprimoradas quebrar, o conjunto será perdido permanentemente. Tem certeza de que deseja arremessá-la?
items.weapon.missiles.missileweapon.break_upgraded_warn_yes=Sim
items.weapon.missiles.missileweapon.break_upgraded_warn_no=Não
