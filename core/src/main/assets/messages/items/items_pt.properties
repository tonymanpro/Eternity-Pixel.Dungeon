items.kindofmisc.unequip_message=Você deve desequipar um desses itens primeiro. Selecione um item com o qual deseja trocar.

items.kindofweapon.swift_equip=Você rapidamente equipa sua arma.
items.kindofweapon.equip_cursed=Involuntariamente, você agarra a arma com mais força.
items.kindofweapon.which_equip_msg=Em qual slot de arma você gostaria de equipar este item?\n\nA Campeã ataca diretamente com sua arma primária, mas pode usar a habilidade de qualquer uma das armas. Ambas as armas compartilham a mesma contagem de carga.\n\nA Campeã também pode trocar sua arma primária e secundária instantaneamente.
items.kindofweapon.which_equip_primary=Primária (%s)
items.kindofweapon.which_equip_secondary=Secundária (%s)
