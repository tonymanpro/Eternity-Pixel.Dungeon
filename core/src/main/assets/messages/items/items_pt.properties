items.weapon.missiles.shuriken.name=shuriken
items.weapon.missiles.shuriken.stats_desc=Shurikens podem ser lançadas instantaneamente com um tempo de recarga de 20 turnos.
items.weapon.missiles.shuriken.desc=Estas peças de metal em formato de estrela com lâminas afiadas podem ser arremessadas rapidamente em movimento.
items.weapon.missiles.shuriken$shurikeninstanttracker.name=Tempo de recarga da Shuriken
items.weapon.missiles.shuriken$shurikeninstanttracker.desc=Você lançou uma shuriken instantaneamente recentemente e deve esperar antes de fazê-lo novamente. Shurikens ainda podem ser lançadas, mas na velocidade normal da arma.\n\nTurnos Restantes: %s.

items.weapon.missiles.throwingclub.name=bastão de arremesso
items.weapon.missiles.throwingclub.stats_desc=Esta arma não se prende aos inimigos e pode ser coletada instantaneamente.
items.weapon.missiles.throwingclub.desc=Uma arma de arremesso relativamente simples, mas durável, essencialmente uma grande rocha presa a um bastão.

items.weapon.missiles.throwinghammer.name=martelo de arremesso
items.weapon.missiles.throwinghammer.stats_desc=Esta arma não se prende aos inimigos e pode ser coletada instantaneamente.
items.weapon.missiles.throwinghammer.desc=Estes martelos pesados são projetados para serem jogados em um inimigo. Sua construção lisa toda em metal significa que são bastante duráveis.

items.weapon.missiles.throwingknife.name=faca de arremesso
items.weapon.missiles.throwingknife.stats_desc=Esta arma é mais forte contra inimigos distraídos.
items.weapon.missiles.throwingknife.desc=Estas facas leves são balanceadas para cortar o ar diretamente até o alvo.
items.weapon.missiles.throwingknife.discover_hint=Um dos heróis inicia com este item.

items.weapon.missiles.throwingspear.name=lança de arremesso
items.weapon.missiles.throwingspear.desc=Estas lanças leves têm armações finas que são projetadas para serem lançadas e não empunhadas.

items.weapon.missiles.throwingspike.name=agulha de arremesso
items.weapon.missiles.throwingspike.desc=Estas agulhas pontiagudas de metal duráveis são feitas para serem arremessadas em inimigos distantes.
items.weapon.missiles.throwingspike.discover_hint=Um dos heróis inicia com este item.

items.weapon.missiles.throwingstone.name=pedra de arremesso
items.weapon.missiles.throwingstone.desc=Estas pedras são lixadas para que possam ser jogadas com mais força do que uma pedra comum.
items.weapon.missiles.throwingstone.discover_hint=Um dos heróis inicia com este item.

items.weapon.missiles.tomahawk.name=tomahawk
items.weapon.missiles.tomahawk.stats_desc=Esta arma causa _%1$d-%2$d de sangramento_ ao seu alvo.
items.weapon.missiles.tomahawk.typical_stats_desc=Esta arma normalmente causa _%1$d-%2$d de sangramento_ ao seu alvo.
items.weapon.missiles.tomahawk.desc=Estes machados de arremesso têm lâminas serrilhadas que vão rasgando o inimigo quando se cravam nele.

items.weapon.missiles.trident.name=tridente
items.weapon.missiles.trident.desc=Lanças de arremesso maciças com três dentes mortais na ponta. Elas são poderosas, mas bem pesadas.


items.weapon.spiritbow.name=arco espiritual
items.weapon.spiritbow.ac_shoot=ATIRAR
items.weapon.spiritbow.prompt=Escolha um alvo
items.weapon.spiritbow.stats=O arco não pode ser aprimorado diretamente, ele ficará mais forte à medida que você sobe de nível. No seu nível atual, as flechas disparadas do arco causarão _%1$d-%2$d de dano_ e exige _%3$d de força_ para ser usado apropriadamente.
items.weapon.spiritbow.desc=Um arco feito de madeira mágica antiga. As cordas e gravuras do arco brilham com uma luz azul clara. Quando a corda é puxada, este arco irá conjurar uma flecha mágica que pode ser disparada contra um inimigo.
items.weapon.spiritbow.discover_hint=Um dos heróis inicia com este item.

items.weapon.weapon.identify=Você agora está suficientemente familiarizado com a sua arma para poder identificá-la.
items.weapon.weapon.too_heavy=Devido à sua força inadequada, a sua velocidade, precisão e habilidade de ataque surpresa serão menores enquanto usar esta arma.
items.weapon.weapon.excess_str=Por causa do seu excesso de força, você causará _0-%d de dano extra_ com esta arma.
items.weapon.weapon.hardening_gone=O endurecimento desta arma acabou!
items.weapon.weapon.incompatible=A interação de diferentes tipos de magia anulou o encantamento desta arma!
items.weapon.weapon.cursed_worn=Esta arma está amaldiçoada, você é incapaz de removê-la.
items.weapon.weapon.cursed=Você sente uma magia maligna à espreita dentro desta arma.
items.weapon.weapon.weak_cursed=Apesar da maldição, você consegue desequipar esta arma.
items.weapon.weapon.not_cursed=Esta arma está livre de magia malévola.
items.weapon.weapon.faster=Possui alteração para aumentar a _velocidade._
items.weapon.weapon.stronger=Possui alteração para aumentar o _dano._
items.weapon.weapon.enchanted=Está com _%s._
