###armor curses
items.armor.curses.antientropy.name=반 엔트로피의 %s
items.armor.curses.antientropy.desc=반 엔트로피의 저주는 우주의 법칙을 거스르며, 공격자와 그 주변으로부터 에너지를 빼앗아 착용자에게 전해줍니다. 공격자와 그 주변을 잠시 얼리고 착용자를 불태워 버립니다!

items.armor.curses.bulk.name=거추장스러운 %s
items.armor.curses.bulk.desc=거추장스러운 갑옷은 더 크고 위협적이지만, 실제로 방어력이 강화되거나 하진 않습니다. 오히려 갑옷의 더 커진 부피가 출입구에 들어서기 더욱 어렵게 만드는 문제가 있습니다.

items.armor.curses.corrosion.name=부식의 %s
items.armor.curses.corrosion.desc=부식의 갑옷은 부식성 액체로 파열되어 해당 지역을 끈적이는 산성 점액으로 뒤덮을 수 있습니다.

items.armor.curses.displacement.name=변위의 %s
items.armor.curses.displacement.desc=변위의 저주는 원래 착용자가 공격받을 때 안전한 곳으로 이동하도록 만들어졌습니다. 하지만 너무 과한 나머지 공격받을 때 현재 층의 무작위 장소로 이동하게 되어 버렸습니다.

items.armor.curses.metabolism.name=신진대사의 %s
items.armor.curses.metabolism.desc=신진대사의 저주는 착용자가 입은 피해를 치료해 주는 대신, 더 빨리 배고파지게 만들어 버립니다.

items.armor.curses.multiplicity.name=다중성의 %s
items.armor.curses.multiplicity.desc=다중성의 저주에 걸린 갑옷은 매우 위험한 복제 주문이 걸려 있습니다. 착용자의 거울상을 만들어 내기도 하지만, 이따금 공격자를 복제시켜 버립니다!

items.armor.curses.overgrowth.name=과다성장의 %s
items.armor.curses.overgrowth.desc=과다 성장의 갑옷은 다양한 꽃 피는 식물들로 덮여 있습니다. 이 효과는 흥미롭게 보이지만, 방어에는 어떤 도움도 되지 않을 것이며, 이러한 식물들은 전투에서 무작위로 활성화됩니다!

items.armor.curses.stench.name=악취의 %s
items.armor.curses.stench.desc=악취의 저주는 주변에 독성 구름을 방출합니다. 이 구름은 착용자를 포함한 모든 대상에게 위험합니다.


###glyphs
items.armor.glyphs.affection.name=애정의 %s
items.armor.glyphs.affection.desc=이 강력한 상형문자는 공격자의 마음을 조종하여, 잠시 동안 매혹에 빠트립니다.

items.armor.glyphs.antimagic.name=항마의 %s
items.armor.glyphs.antimagic.desc=이 강력한 상형문자가 부여된 갑옷은 착용자를 물리 공격뿐만 아니라 마법 공격으로부터도 보호합니다. 마법 방어력은 갑옷의 티어에 영향을 받지 않습니다.

items.armor.glyphs.brimstone.name=유황불의 %s
items.armor.glyphs.brimstone.desc=이 상형문자는 착용자와 그의 소지품을 불로부터 보호하여, 화상 피해와 부정적 효과를 완전히 막습니다.

items.armor.glyphs.camouflage.name=위장의 %s
items.armor.glyphs.camouflage.desc=이 상형문자는 착용자를 기다란 풀에 숨어들어, 일시적으로 투명화시킬 수 있습니다.

items.armor.glyphs.entanglement.name=속박의 %s
items.armor.glyphs.entanglement.desc=이 상형문자는 착용자를 자연의 갑옷으로 감싸 피해를 흡수하지만, 착용자가 움직이면 자연의 갑옷은 부서져 버립니다.

items.armor.glyphs.flow.name=흐름의 %s
items.armor.glyphs.flow.desc=이 상형문자는 물결의 흐름을 조종하여, 물 위를 이동하는 걸 훨씬 빠르게 합니다.

items.armor.glyphs.obfuscation.name=흐릿함의 %s
items.armor.glyphs.obfuscation.desc=이 상형문자는 착용자를 눈에 잘 띄지 않게 합니다.

items.armor.glyphs.potential.name=전위의 %s
items.armor.glyphs.potential.desc=이 상형문자는 공격받을 때 전기 에너지를 충전하며, 발동할 때 착용자의 마법 막대에 충전량을 제공합니다.

items.armor.glyphs.repulsion.name=반발의 %s
items.armor.glyphs.repulsion.desc=이 상형문자는 공격자를 튕겨내며, 뒤로 날려 보냅니다.

items.armor.glyphs.stone.name=육중함의 %s
items.armor.glyphs.stone.desc=이 상형문자는 갑옷을 무거운 마법의 돌로 둘러싸 회피를 불가능하게 만들지만, 회피에 비례하여 받는 피해를 감소시킵니다.

items.armor.glyphs.swiftness.name=신속함의 %s
items.armor.glyphs.swiftness.desc=이 상형문자는 착용자의 근처에 적이 없을 경우 착용자의 이동 속도를 늘려줍니다.

items.armor.glyphs.thorns.name=가시의 %s
items.armor.glyphs.thorns.desc=이 강력한 상형문자는 공격자를 상처 내며, 착용자를 공격한 대상에게 느린 출혈 효과를 줍니다.

items.armor.glyphs.viscosity.name=점성의 %s
items.armor.glyphs.viscosity.deferred=%d의 피해 지연
items.armor.glyphs.viscosity$defereddamage.name=지연된 피해
items.armor.glyphs.viscosity$defereddamage.ondeath=지연된 피해에 의해 사망했다...
items.armor.glyphs.viscosity$defereddamage.rankings_desc=지연된 피해로 사망
items.armor.glyphs.viscosity$defereddamage.desc=받은 피해가 즉시 발생하는 대신, 시간에 걸쳐 서서히 들어옵니다.\n\n%d의 지연된 피해가 남았습니다.
items.armor.glyphs.viscosity.desc=이 상형문자는 착용자에게 가해진 피해를 조금씩 천천히 입히도록 만듭니다.



###armor
items.armor.armor.ac_detach=인장을 떼어낸다
items.armor.armor.detach_seal=갑옷에서 인장을 떼어냈다.
items.armor.armor.equip_cursed=갑옷이 당신을 고통스럽게 옥죄입니다.
items.armor.armor.identify=당신은 현재 입고 있는 갑옷이 무엇인지 알 만큼 충분히 익숙해졌다.
items.armor.armor.hardening_gone=갑옷의 경화 효과가 사라졌다!
items.armor.armor.incompatible=서로 다른 마법의 상호 작용으로 인해 이 갑옷에 적힌 상형문자가 사라졌다!
items.armor.armor.curr_absorb=이 _%1$d티어_ 갑옷은 _피해를 %2$d-%3$d까지 흡수_할 수 있으며 제대로 다루기 위해  _%4$d 이상의 힘_이 필요합니다.
items.armor.armor.avg_absorb=이 _%1$d티어_ 갑옷은 _피해를 %2$d-%3$d까지 흡수_할 수 있으며 제대로 다루기 위해 _%4$d 이상의 힘_이 필요합니다.
items.armor.armor.too_heavy=이 갑옷을 입기 위한 힘이 부족하기 때문에 당신의 이동 속도, 회피 능력, 그리고 방어력이 저하됩니다.
items.armor.armor.probably_too_heavy=아마도 이 갑옷은 당신에게 너무 무거울 것입니다.
items.armor.armor.excess_str=힘이 더 강한 덕분에, 이 갑옷을 입었을 때 _추가 회피_를 얻습니다.
items.armor.armor.evasion=이 방어구의 _회피_를 증강했습니다.
items.armor.armor.defense=이 방어구의 _방어력_을 증강했습니다.
items.armor.armor.inscribed=_%s_ 가 새겨져 있습니다.
items.armor.armor.glyph_hardened=이 갑옷은 _경화_되었습니다.
items.armor.armor.hardened_no_glyph=이 갑옷은 _경화_된 상태지만, 현재 상형문자가 부여되어 있지는 않습니다.
items.armor.armor.cursed_worn=이 갑옷은 저주받았기 때문에, 당신은 이 갑옷을 벗을 수 없습니다.
items.armor.armor.cursed=당신은 악의로 가득 찬 마법이 이 갑옷에 깃든 것을 느낍니다.
items.armor.armor.weak_cursed=저주에도 불구하고, 당신은 방어구를 벗을 수 있었다.
items.armor.armor.not_cursed=이 갑옷에는 악의적인 마법이 없습니다.
items.armor.armor.seal_attached=전사의 부러진 인장이 이 갑옷에 붙어 있으며, 전사의 체력이 절반 이하로 떨어질 시 _%d의 방어막_을 제공합니다.
items.armor.armor.seal_transfer=전사의 부러진 인장은 현재 착용 중인 갑옷에 붙어 있어야만 효과를 발휘합니다. 갑옷을 교체할 때 자동으로 인장을 바꿔 다시겠습니까?
items.armor.armor.seal_transfer_yes=예
items.armor.armor.seal_transfer_no=아니오
items.armor.armor$glyph.glyph=상형문자
items.armor.armor$glyph.killed=%s에 의해 죽었습니다...
items.armor.armor$glyph.rankings_desc=상형문자로 인해 사망
items.armor.armor$glyph.discover_hint=이 아이템은 던전에서 무작위로 생성되거나, 아이템을 당신에게 직접 적용할 때 등장합니다.

items.armor.classarmor.ac_ability=능력 선택
items.armor.classarmor.ac_transfer=전승
items.armor.classarmor.no_ability=현재 당신의 갑옷에는 아무런 능력이 없습니다. 하나를 선택하세요!
items.armor.classarmor.not_equipped=이 갑옷의 능력을 발동하기 위해선 이걸 먼저 입어야만 합니다!
items.armor.classarmor.low_charge=갑옷의 특별한 능력을 발동할 충전량이 부족하다!
items.armor.classarmor.charge_use=지금 능력을 사용하면 _%s_ 만큼의 충전량을 사용합니다.
items.armor.classarmor.transfer_title=방어구 전승
items.armor.classarmor.transfer_desc=드워프 제왕의 왕관에 들린 마법을 다른 방어구에 전승할 수 있습니다. 그 과정에서 기존의 방어구는 파괴됩니다.
items.armor.classarmor.transfer_prompt=방어구 선택
items.armor.classarmor.transfer_cancel=취소
items.armor.classarmor.transfer_complete=영웅의 방어구가 전승되었다!
items.armor.classarmor.discover_hint=이 아이템은 20층의 보스를 특정한 영웅으로 처치 시 등장합니다.

items.armor.clericarmor.name=영웅의 의례복
items.armor.clericarmor.desc=이 천으로 덮인 판금 갑옷을 입은 성직자는 특별한 능력을 사용할 수 있습니다.

items.armor.clotharmor.name=천 갑옷
items.armor.clotharmor.desc=이 가벼운 갑옷은 기본적인 보호를 제공합니다.
items.armor.clotharmor.discover_hint=특정 영웅이 이 아이템을 가지고 시작합니다.

items.armor.duelistarmor.name=영웅의 흉갑
items.armor.duelistarmor.desc=이 판금 갑옷과 망토를 착용하고 있으면, 결투자는 특별한 능력을 발휘할 수 있습니다.

items.armor.huntressarmor.name=영웅의 망토
items.armor.huntressarmor.no_enemies=시야 내에 적이 없습니다.
items.armor.huntressarmor.desc=이 망토를 입은 사냥꾼은 특별한 능력을 사용할 수 있습니다.

items.armor.leatherarmor.name=가죽 갑옷
items.armor.leatherarmor.desc=그을려진 몬스터의 가죽으로 만든 갑옷입니다. 천 갑옷 만큼 가볍지는 않지만 훨씬 더 나은 보호 효과를 제공해 줍니다.

items.armor.magearmor.name=영웅의 로브
items.armor.magearmor.desc=이 진귀한 로브를 입은 마법사는 특별한 능력을 사용할 수 있습니다.

items.armor.mailarmor.name=사슬 갑옷
items.armor.mailarmor.desc=금속 고리를 서로 엮어 만든 갑옷으로 단단하지만 유연한 갑옷입니다.

items.armor.platearmor.name=판금 갑옷
items.armor.platearmor.desc=거대한 철판들이 이어져 갑옷으로 만들어졌습니다. 이 갑옷의 엄청난 무게를 견딜 수 있는 모험가들에게 다른 갑옷과는 비교할 수도 없는 방어력을 제공해 줍니다.

items.armor.roguearmor.name=영웅의 의복
items.armor.roguearmor.desc=이 어두운 의복을 입은 도적은 특별한 능력을 사용할 수 있습니다.

items.armor.scalearmor.name=미늘 갑옷
items.armor.scalearmor.desc=강철 미늘들이 가죽 조끼에 엮여져 유연하지만 견고한 갑옷을 만들었습니다.

items.armor.warriorarmor.name=영웅의 판금 갑옷
items.armor.warriorarmor.desc=이 무거운 갑옷을 입은 전사는 특별한 능력을 발휘할 수 있습니다.



###artifacts
items.artifacts.alchemiststoolkit.name=연금술사의 도구상자
items.artifacts.alchemiststoolkit.ac_brew=제조
items.artifacts.alchemiststoolkit.ac_energize=에너지 전환
items.artifacts.alchemiststoolkit.not_ready=당신의 도구 상자는 아직 준비되지 않았다.
items.artifacts.alchemiststoolkit.cursed=당신의 저주받은 도구 상자가 당신이 연금술을 하는 것을 막고 있다!
items.artifacts.alchemiststoolkit.need_energy=적어도 6의 에너지가 필요하다.
items.artifacts.alchemiststoolkit.energize_desc=에너지 결정 6개마다 도구 상자가 +1 씩 강화되며, 강화 수준에 따라 에너지 생성 속도와 사용 준비 속도가 빨라집니다.\n\n얼마나 많은 에너지를 사용하시겠습니까?
items.artifacts.alchemiststoolkit.energize_1=6에너지: +1레벨
items.artifacts.alchemiststoolkit.energize_all=%1$d에너지: +%2$d레벨
items.artifacts.alchemiststoolkit.desc=이 도구 상자는 이동 중에도 연금술을 할 수 있도록 작은 혼합 병과 함께 다양한 시약 병을 담고 있습니다. 옆에 달려 있는 유리병에는 연금술 에너지 수정이 액체의 형태로 담겨 있는 것처럼 보입니다.
items.artifacts.alchemiststoolkit.desc_cursed=저주받은 도구 상자는 스스로 당신의 옆에 묶여 있으며, 당신이 연금술을 사용하는 것을 거부한다.
items.artifacts.alchemiststoolkit.desc_warming=도구 상자는 현재 준비 상태에 있으며, 약간의 시간이 지나면 준비가 완료됩니다.
items.artifacts.alchemiststoolkit.desc_hint=당신이 장착한 도구상자는 당신이 경험치를 얻을 때마다 천천히 연금술 에너지를 만들어 냅니다. 유리병 안에 들어 있는 혼합물에 에너지 수정을 추가해 강화할 수 있을 것 같습니다.

items.artifacts.artifact.cannot_wear_two=같은 유물 아이템 두 개를 동시에 착용할 수 없습니다.
items.artifacts.artifact.equip_cursed=유물이 당신에게 고통스럽게 달라붙었다.
items.artifacts.artifact.curse_known=당신은 악의로 가득 찬 마법이 유물에 깃든 것을 느낍니다.
items.artifacts.artifact.not_cursed=이 유물에는 악의적인 마법이 없습니다.
items.artifacts.artifact.need_to_equip=먼저 유물을 착용해야 합니다.

items.artifacts.capeofthorns.name=가시 망토
items.artifacts.capeofthorns.desc=DM-300에서 떨어져 나온 뭉개진 철판이 망토의 모습으로 변하였습니다. 이것은 강력한 에너지를 담고 있는 것처럼 보입니다. 아마도 DM-300의 힘을 담고 있지 않을까요?
items.artifacts.capeofthorns.desc_inactive=이 망토는 당신의 어깨를 꽤 무겁게 누르고 있으며, 당신이 피해를 입을 때마다 에너지를 얻는 것 같습니다.
items.artifacts.capeofthorns.desc_active=이 망토가 저장한 에너지를 방출하는 것처럼 보이며, 보호의 힘을 발하고 있습니다.
items.artifacts.capeofthorns$thorns.inert=당신의 망토의 능력이 중단되었다.
items.artifacts.capeofthorns$thorns.radiating=당신의 망토가 에너지를 방출하기 시작했다. 당신은 보호받고 있다!
items.artifacts.capeofthorns$thorns.levelup=당신의 망토가 더욱 더 강해졌다!
items.artifacts.capeofthorns$thorns.name=가시
items.artifacts.capeofthorns$thorns.desc=당신의 망토는 에너지를 발하고 있으며, 반발 역장으로 감싸고 있습니다! \n\n당신이 입는 모든 피해는 가시 효과가 발동 된 동안 감소됩니다. 또한, 공격자가 바로 옆에 있으면, 줄인 피해만큼 공격자에게 반사됩니다. \n\n당신의 망토는 %s턴 까지 에너지를 방출할 수 있습니다.

items.artifacts.chaliceofblood.name=피의 성배
items.artifacts.chaliceofblood.ac_prick=찌르기
items.artifacts.chaliceofblood.yes=네. 그렇게 하겠습니다.
items.artifacts.chaliceofblood.no=아니오.  생각을 바꾸었습니다.
items.artifacts.chaliceofblood.prick_warn=당신이 성배를 사용할 때마다 성배는 당신의 생명 에너지를 더 많이 흡수하지만, 그 대가로 당신의 자연 체력 재생을 더 늘려 줍니다..\n\n현재 성배로 찌르기를 시도할 경우 당신은 _%1$d-%2$d 피해_를 입습니다. 이 피해는 _물리 및 마법 피해 방어력과 피해 감소 효과_의 영향을 모두 받습니다. 피해 감소 효과를 고려하지 않고, 지금 찌르기를 시도하면 _%3$s%%_ 확률로 남은 생명력을 모두 빼앗길 수도 있습니다.\n\n성배에 더 많은 생명 에너지를 제공하겠습니까?
items.artifacts.chaliceofblood.onprick=당신은 스스로를 찔렀고, 생명의 정수가 성배에 빨려 들어갔다.
items.artifacts.chaliceofblood.ondeath=성배는 당신의 생명의 정수를 모조리 빨아들였다...
items.artifacts.chaliceofblood.desc=이 빛나는 은색 성배의 테두리에는 뾰족한 보석들로 둘러져 있습니다.
items.artifacts.chaliceofblood.desc_cursed=저주받은 성배가 당신 손에 들러붙어 체력을 재생하는 것을 막았습니다.
items.artifacts.chaliceofblood.desc_1=성배를 잡는 순간, 이상하게도 뾰족한 보석으로 스스로를 찌르고 싶은 생각이 들었다.
items.artifacts.chaliceofblood.desc_2=당신의 피가 성배에 흘러 들어갔다. 그 보답으로 성배가 당신에게 생명력을 제공해 주어, 자연 체력 재생을 늘려 주는 것을 느꼈다. 당신은 해가 될 걸 알면서도 여전히 성배에 더 많은 피를 주고 싶었다.
items.artifacts.chaliceofblood.desc_3=성배가 끝부분까지 당신의 생명의 정수로 가득 찼습니다. 당신은 그 성배가 댓가로 생명력을 내어 주고 있는 것을 느낄 수 있습니다.

items.artifacts.cloakofshadows.name=그림자의 망토
items.artifacts.cloakofshadows.ac_stealth=은신
items.artifacts.cloakofshadows.cooldown=당신의 망토는 다시 충전될 때 까지 %d턴이 더 필요합니다.
items.artifacts.cloakofshadows.cursed=당신은 저주받은 망토를 사용할 수 없다.
items.artifacts.cloakofshadows.no_charge=당신의 망토는 아직 충전이 덜 되어 사용할 수 없다.
items.artifacts.cloakofshadows.desc=몇년 전 도적이 왕국의 무기고에서 훔쳐 낸 진귀한 마법 망토입니다. 이 망토를 입으면 일시적으로 완전히 투명해질 수 있습니다.\n\n망토를 사용하면 할 수록, 효과가 더욱 강해집니다. 그리하여 도적은 더 자주, 더 오래 투명화할 수 있습니다.
items.artifacts.cloakofshadows.discover_hint=특정 영웅이 이 아이템을 가지고 시작합니다.
items.artifacts.cloakofshadows$cloakstealth.no_charge=당신의 망토의 에너지가 떨어졌다.
items.artifacts.cloakofshadows$cloakstealth.levelup=당신의 망토가 더욱 강해졌다!
items.artifacts.cloakofshadows$cloakstealth.name=은신
items.artifacts.cloakofshadows$cloakstealth.desc=당신이 그림자의 망토를 두르면 투명화 상태에 접어들게 됩니다. 투명화 효과는 중단되거나 망토의 에너지가 떨어질 때 까지 지속됩니다.\n\n투명화 상태에서 적들은 당신을 따라오거나 공격할 수 없습니다. 대신 물리 공격이나 마법 효과(마법 막대나 주문서 등)은 투명화를 즉시 중단시킵니다.\n\n에너지가 떨어질 때 까지 남은 턴: %d

items.artifacts.driedrose.name=메마른 장미
items.artifacts.driedrose.ac_summon=소환
items.artifacts.driedrose.ac_direct=지시한다
items.artifacts.driedrose.ac_outfit=장비시킨다
items.artifacts.driedrose.spawned=이미 유령을 소환했다.
items.artifacts.driedrose.no_charge=장미가 아직 완전히 충전되지 않았다.
items.artifacts.driedrose.cursed=저주받은 장미를 사용할 수 없다.
items.artifacts.driedrose.no_space=당신 주변에 빈 공간이 없다.
items.artifacts.driedrose.charged=당신의 장미가 준비되었다!
items.artifacts.driedrose.desc=과연 이 장미가 슬픈 유령이 성불하기 직전에 이야기했던 물건일까요? 이 장미엔 영적인 힘을 붙드는 힘이 있어, 쓰러진 전사의 영혼을 모을 수 있을 것 같습니다.
items.artifacts.driedrose.desc_no_quest=세월이 오래 흘렀음에도 불구하고 그 형체를 유지하고 있는 메마른 장미입니다.\n\n영적인 힘을 담고 있는 것 같지만, 어떻게 그것을 사용해야 할지 도저히 알 수 없습니다.
items.artifacts.driedrose.desc_hint=아무래도 꽃잎 몇 개가 모자란 것 같습니다. 꽃잎을 다시 찾아 붙이면 장미도 강력해질 것입니다.
items.artifacts.driedrose.desc_cursed=장미가 당신의 손에 달라붙었으며, 매우 차가운 느낌입니다.
items.artifacts.driedrose.desc_weapon=유령의 무기: %s
items.artifacts.driedrose.desc_armor=유령의 방어구: %s
items.artifacts.driedrose.desc_strength=유령의 힘: %s
items.artifacts.driedrose$petal.name=메마른 꽃잎
items.artifacts.driedrose$petal.no_rose=꽃잎을 붙일 장미가 없다.
items.artifacts.driedrose$petal.no_room=꽃잎이 들어갈 공간이 없어서 버릴 수 밖에 없었다.
items.artifacts.driedrose$petal.maxlevel=장미가 완전해졌다!
items.artifacts.driedrose$petal.levelup=장미꽃에 꽃잎을 붙였다.
items.artifacts.driedrose$petal.desc=말라 비틀어진 꽃잎으로, 던전의 이 정도 깊이에서도 여전히 살아 있다.
items.artifacts.driedrose$wndghosthero.title=유령의 장비
items.artifacts.driedrose$wndghosthero.desc=유령 그 자체의 전투력은 약하지만, 그 형태는 당신이 쓸 수 있는 무기와 방어구를 들 수 있을 정도로 단단한 편입니다. 유령에게 들려준 장비들은 당신이 사용할 때와 같은 효과를 냅니다.\n\n이 유령은 현재 _%d의 힘 요구량_ 이하의 장비를 들 수 있습니다.
items.artifacts.driedrose$wndghosthero.weapon_prompt=조정할 무기를 선택하세요
items.artifacts.driedrose$wndghosthero.armor_prompt=붙일 갑옷을 선택하세요
items.artifacts.driedrose$wndghosthero.cant_unique=유령은 무기와 방어구 외의 장비를 들 수 없습니다.
items.artifacts.driedrose$wndghosthero.cant_cursed=유령에겐 저주받지 않은 것이 확인된 장비만 줄 수 있습니다.
items.artifacts.driedrose$wndghosthero.cant_strength_unknown=유령은 그 장비를 들기엔 힘이 부족하다.
items.artifacts.driedrose$wndghosthero.cant_strength=유령은 그 장비를 들 만큼 강하지 않습니다.

##ghost hero
items.artifacts.driedrose$ghosthero.name=슬픈 유령
items.artifacts.driedrose$ghosthero.def_verb=회피
items.artifacts.driedrose$ghosthero.discover_hint=이 캐릭터는 특정한 마법 유물의 효과로 등장합니다.

items.artifacts.driedrose$ghosthero.hello=안녕하신가, %s(이)여.
items.artifacts.driedrose$ghosthero.introduce=내 영혼은 이 장미에 묶여 있어. 지상에 있는 내 연인에게서 받은 아주 소중한 물건이었지.\n\n그이에겐 더 이상 돌아갈 순 없겠지만, 당신 덕에 내 여정을 완수할 두 번째 기회를 얻었어. 가능하다면 당신의 부름에 응해 같이 싸워줄 거야.\n\n당신이 장미를 가지고 있는 한 나는 당신의 목소리를 들을 수 있으니, 멀리서도 장미를 이용하여 내게 명령을 내릴 수 있어.\n\n부디 당신은 나처럼 되지 않기를...

items.artifacts.driedrose$ghosthero.dialogue_sewers_1=이 하수구는 꽤나 안전한 장소였고, 겨울에는 사람들이 여기서 살기도 했지.
items.artifacts.driedrose$ghosthero.dialogue_sewers_2=경비병들에게 무슨 일이 생겼는지 궁금한데, 그들이 포기한건가?
items.artifacts.driedrose$ghosthero.dialogue_sewers_3=지상에 내 가족들이 있는데, 그들이 무사했으면 좋겠어.
items.artifacts.driedrose$ghosthero.dialogue_sewers_4=경비병들은 이 괴물들을 물리치지 못했지만, 어쩌면 우리는 할 수 있을지도.
items.artifacts.driedrose$ghosthero.dialogue_sewers_5=하수구조차 이렇게나 위험하다면, 그 아래에는 무엇이 있을까...
items.artifacts.driedrose$ghosthero.dialogue_sewers_6=무엇이 이 쥐들과 게들을 이렇게 크게 자라나도록 한 것이지?
items.artifacts.driedrose$ghosthero.dialogue_prison_1=나는 이 곳에 대한 이야기를 들은 적이 있었지만, 좋은 건 하나도 없었어.
items.artifacts.driedrose$ghosthero.dialogue_prison_2=이곳은 항상 감옥보다는 던전에 가까웠지.
items.artifacts.driedrose$ghosthero.dialogue_prison_3=이 장소가 버려졌을 때 무슨 일이 일어났을지 상상조차 할 수 없군.
items.artifacts.driedrose$ghosthero.dialogue_prison_4=죄수와 간수 모두가 괴물로 변해버린 것 같아.
items.artifacts.driedrose$ghosthero.dialogue_prison_5=이 모든 해골들은 누구의 소행인걸까?
items.artifacts.driedrose$ghosthero.dialogue_prison_6=이 사람들은 이렇게 될 필요가 없었는데...
items.artifacts.driedrose$ghosthero.dialogue_caves_1=어떤 인간이나 드워프도 이 장소에 오랫동안 드나들지 않았지.
items.artifacts.driedrose$ghosthero.dialogue_caves_2=어떤 일이 드워프들로 하여금 금광을 버리게 한 걸까?
items.artifacts.driedrose$ghosthero.dialogue_caves_3=여기의 금이 지상에서는 쓸모없다는 점이 참 안타깝네.
items.artifacts.driedrose$ghosthero.dialogue_caves_4=이 생물들은 하수구에서 봤던 녀석들처럼 뒤틀렸어.
items.artifacts.driedrose$ghosthero.dialogue_caves_5=심지어 박쥐마저도 피에 굶주려 있군.
items.artifacts.driedrose$ghosthero.dialogue_caves_6=채굴 장비라곤 흔적조차 안 보이는데, 드워프들이 모두 가져간 건가?
items.artifacts.driedrose$ghosthero.dialogue_city_1=드워프들은 부지런하지만 탐욕적이었지.
items.artifacts.driedrose$ghosthero.dialogue_city_2=그래서 드워프들의 대도시는 정말로 몰락해버렸군.
items.artifacts.driedrose$ghosthero.dialogue_city_3=지상은 절대 이 장소와 같은 최후를 맞이하지 않기를.
items.artifacts.driedrose$ghosthero.dialogue_city_4=드워프들이 원래 저렇게 창백하진 않은데.
items.artifacts.driedrose$ghosthero.dialogue_city_5=나는 드워프 종족들과 그들이 만들어낸 것 중 무엇이 더 나쁜 건지 모르겠어.
items.artifacts.driedrose$ghosthero.dialogue_city_6=드워프들 또한 지성이 없는 괴물이 되어버렸구나.
items.artifacts.driedrose$ghosthero.dialogue_halls_1=이 장소는 도대체 뭐지?
items.artifacts.driedrose$ghosthero.dialogue_halls_2=여긴 무서운걸...
items.artifacts.driedrose$ghosthero.dialogue_halls_3=이런 힘을 가지고 놀 생각을 하다니, 드워프들은 도대체 무슨 생각이었던 것이지?
items.artifacts.driedrose$ghosthero.dialogue_halls_4=이 괴물들은 이 세상의 것이 아닌 것 같은데, 이들은 어디서 온 것일까?
items.artifacts.driedrose$ghosthero.dialogue_halls_5=느껴져? 누군가가 우리를 바라보고 있는 것 같아.
items.artifacts.driedrose$ghosthero.dialogue_halls_6=횃불이 있어서 천만다행이지, 여긴 너무나도 어두운걸!
items.artifacts.driedrose$ghosthero.dialogue_ascension_1=무슨 일이 일어나는 거지? 완전히 끝난 게 아니었나...
items.artifacts.driedrose$ghosthero.dialogue_ascension_2=어떻게 아직 이 세상에 영향을 끼칠 수 있는 거지?
items.artifacts.driedrose$ghosthero.dialogue_ascension_3=그 부적으로 뭘 할 속셈인지 너도 알고 있는 거지?
items.artifacts.driedrose$ghosthero.dialogue_ascension_4=아직 완전히 끝나지 않은 모양이군.
items.artifacts.driedrose$ghosthero.dialogue_ascension_5=지금까지 잘 해왔잖아, 우린 해낼 수 있어!
items.artifacts.driedrose$ghosthero.dialogue_ascension_6=조금만 더, 곧 여기서 나갈 수 있어!

items.artifacts.driedrose$ghosthero.seen_goo_1=구를 조심해!
items.artifacts.driedrose$ghosthero.seen_goo_2=수많은 내 친구들이 이 녀석에게 죽었어, 복수의 시간이다!
items.artifacts.driedrose$ghosthero.seen_goo_3=살아있어서는 안 되는 흉물이다!
items.artifacts.driedrose$ghosthero.seen_tengu_1=마지막 남은 죄수는 물론 치명적인 암살자로군...
items.artifacts.driedrose$ghosthero.seen_tengu_2=그가 우리를 가뒀어!
items.artifacts.driedrose$ghosthero.seen_tengu_3=난 저 가면에 대한 무서운 이야기를 들은 적이 있지...
items.artifacts.driedrose$ghosthero.seen_dm300_1=오직 드워프만이 침입자를 죽이는 채굴 기계를 만들었겠지.
items.artifacts.driedrose$ghosthero.seen_dm300_2=저 녀석은 거대한걸...
items.artifacts.driedrose$ghosthero.seen_dm300_3=어떻게 이 녀석이 이렇게나 오래 동력을 유지한 것일까?
items.artifacts.driedrose$ghosthero.seen_king_1=사람들이 '권력은 부패한다'라고 말하곤 하는데, 이게 바로 그들이 말하는 바 그대로지.
items.artifacts.driedrose$ghosthero.seen_king_2=그는 이제 왕이라기보다는 리치에 가까워.
items.artifacts.driedrose$ghosthero.seen_king_3=드워프들은 심지어 죽어서도 그들의 주인을 따르는군.
items.artifacts.driedrose$ghosthero.seen_yog_1=으, 이건 별로 안 좋아 보이는데.
items.artifacts.driedrose$ghosthero.seen_yog_2=그래서, 저게 신이 생겨먹은 모양새란 말이지?
items.artifacts.driedrose$ghosthero.seen_yog_3=이건 상당히 아픈걸...

items.artifacts.driedrose$ghosthero.defeated_by_enemy_1=행운을 빌어...
items.artifacts.driedrose$ghosthero.defeated_by_enemy_2=지쳤어...
items.artifacts.driedrose$ghosthero.defeated_by_enemy_3=난 돌아올 거야...
items.artifacts.driedrose$ghosthero.defeated_by_boss_1=미안해... 행운을 빌어...
items.artifacts.driedrose$ghosthero.defeated_by_boss_2=내가 없어도... 저 녀석을 끝장내줘...
items.artifacts.driedrose$ghosthero.defeated_by_boss_3=안 돼... 이럴수는...
items.artifacts.driedrose$ghosthero.blessed_ankh_1=어떻게 거기서 살아남은거야?
items.artifacts.driedrose$ghosthero.blessed_ankh_2=내게도 그런 것이 하나 있었으면 좋았으련만...
items.artifacts.driedrose$ghosthero.blessed_ankh_3=세상에! 아직 살아있구나!
items.artifacts.driedrose$ghosthero.player_killed_1=안돼...!
items.artifacts.driedrose$ghosthero.player_killed_2=난 그들을 도울 수 없었어...
items.artifacts.driedrose$ghosthero.player_killed_3=이게 아닌데...

items.artifacts.driedrose$ghosthero.direct_prompt=난 무엇을 해야 할까?
items.artifacts.driedrose$ghosthero.directed_follow_1=좋아, 당신을 따라가겠어.
items.artifacts.driedrose$ghosthero.directed_follow_2=내가 뒤따를게.
items.artifacts.driedrose$ghosthero.directed_follow_3=당신을 따라가고 있어...
items.artifacts.driedrose$ghosthero.directed_follow_4=좋아, 가자고!
items.artifacts.driedrose$ghosthero.directed_follow_5=내가 당신을 돕겠어.
items.artifacts.driedrose$ghosthero.directed_attack_1=알았어, 저 녀석을 공격할게.
items.artifacts.driedrose$ghosthero.directed_attack_2=내가 저걸 잡지.
items.artifacts.driedrose$ghosthero.directed_attack_3=참전한다...
items.artifacts.driedrose$ghosthero.directed_attack_4=녀석들을 해치우자!
items.artifacts.driedrose$ghosthero.directed_attack_5=저 녀석은 내 몫이야.
items.artifacts.driedrose$ghosthero.directed_position_1=좋아, 난 그 위치를 사수할게.
items.artifacts.driedrose$ghosthero.directed_position_2=난 저기로 가서 지키고 있겠어.
items.artifacts.driedrose$ghosthero.directed_position_3=이동중...
items.artifacts.driedrose$ghosthero.directed_position_4=가고 있어!
items.artifacts.driedrose$ghosthero.directed_position_5=그 쪽으로 갈게.

items.artifacts.driedrose$ghosthero.desc=허약해 보이는 인간 모양의 영체다. 당신이 가지고 있는 장미에 힘이 묶여 있는 듯 하다.\n\n그리 친근해 보이지 않는 유령이지만, 여기 던전에서 유일한 말동무가 될 것이다.

##back to artifacts
items.artifacts.etherealchains.name=에테르 사슬
items.artifacts.etherealchains.ac_cast=시전
items.artifacts.etherealchains.rooted=속박되어 있는 동안은 사슬로 움직일 수 없다.
items.artifacts.etherealchains.no_charge=사슬의 충전량이 부족하다.
items.artifacts.etherealchains.cursed=저주받은 사슬은 사용할 수 없다.
items.artifacts.etherealchains.does_nothing=아무것도 일어나지 않았다.
items.artifacts.etherealchains.cant_pull=그 대상은 당길 수 없다.
items.artifacts.etherealchains.cant_reach=사슬이 닿지 않는 곳입니다.
items.artifacts.etherealchains.inside_wall=사슬을 사용해서 벽 안으로 들어갈 수는 없습니다.
items.artifacts.etherealchains.nothing_to_grab=붙잡을 대상이 없다.
items.artifacts.etherealchains.prompt=목표 지점을 선택하세요
items.artifacts.etherealchains.desc=이 거대하지만 매우 가벼운 사슬은 영적인 에너지로 빛이 납니다. 멀리 있는 벽에 걸어 당신이 이동할 수도 있고, 적을 당신에게로 끌어올 수도 있습니다. 사슬의 영적인 힘은 벽을 넘어서도 사슬을 걸 수 있게 해 줍니다!
items.artifacts.etherealchains.desc_cursed=저주받은 사슬은 당신의 곁에 붙어 있으며, 이따금 제멋대로 움직여 당신을 넘어뜨리거나 속박시킵니다.
items.artifacts.etherealchains.desc_equipped=이 사슬은 당신의 곁에 느슨하게 매여 있으며, 당신이 무찌른 적의 영혼 에너지를 천천히 빨아들입니다. 각각의 충전량은 사슬의 한 마디에 해당하며, 충전량 하나당 정확히 한 칸의 길이를 차지합니다.
items.artifacts.etherealchains$chainsrecharge.levelup=당신의 사슬이 더욱 강해졌다!

items.artifacts.holytome.name=성서
items.artifacts.holytome.ac_cast=시전
items.artifacts.holytome.no_spell=지금은 주문을 시전할 수 없다.
items.artifacts.holytome.cursed=당신은 저주받은 성서를 사용할 수 없다.
items.artifacts.holytome.levelup=당신의 성서가 더욱 강해졌다!
items.artifacts.holytome.desc=성직자는 성서를 매개로 신성력을 발휘합니다. 성서를 사용하면 여러 가지 마법 주문을 시전할 수 있습니다.\n\n성직자가 성서를 사용할수록 더욱 강력해집니다. 최대 충전 수가 증가하며 충전 속도가 약간 더 빨라집니다.
items.artifacts.holytome.discover_hint=특정 영웅이 이 아이템을 가지고 시작합니다.

items.artifacts.hornofplenty.name=풍요의 뿔
items.artifacts.hornofplenty.ac_snack=간식
items.artifacts.hornofplenty.ac_eat=먹는다
items.artifacts.hornofplenty.ac_store=저장한다
items.artifacts.hornofplenty.eat=당신은 뿔에서 나온 음식을 먹었다.
items.artifacts.hornofplenty.prompt=넣을 음식을 선택하세요
items.artifacts.hornofplenty.no_food=당신의 뿔피리 안에 남은 음식이 없다!
items.artifacts.hornofplenty.full=당신의 뿔피리가 음식으로 가득 찼다!
items.artifacts.hornofplenty.reject=당신의 뿔피리는 안 익힌 담백과를 뱉어 냈다.
items.artifacts.hornofplenty.maxlevel=당신의 뿔피리는 먹을 수 있는 모든 음식을 흡수했다!
items.artifacts.hornofplenty.levelup=당신의 뿔피리는 음식을 흡수하고 더욱 강해졌다!
items.artifacts.hornofplenty.feed=풍요의 뿔은 당신이 준 음식을 흡수했다.
items.artifacts.hornofplenty.desc=이 뿔피리는 불 수는 없지만, 착용한 후 경험치를 얻음에 따라 음식을 만들어내는 것 같습니다. 당신은 각각의 충전량을 간식으로 사용해 먹거나 배부를 때까지 전부 먹을 수도 있습니다.
items.artifacts.hornofplenty.desc_hint=아마도 음식을 뿔피리에게 줌으로써 그 힘을 더 키울 수 있을 것 같습니다.
items.artifacts.hornofplenty.desc_cursed=저주받은 뿔피리는 당신의 옆에 붙어 버렸습니다. 음식을 생산하기 보다는 먹어치우려고 합니다.

items.artifacts.lloydsbeacon.name=로이드의 신호기
items.artifacts.lloydsbeacon.ac_zap=발사한다
items.artifacts.lloydsbeacon.ac_set=위치 지정
items.artifacts.lloydsbeacon.ac_return=귀환하기
items.artifacts.lloydsbeacon.no_charge=당신의 신호기는 지금 충분한 에너지가 없다.
items.artifacts.lloydsbeacon.tele_fail=공간이동 마법이 실패했다.
items.artifacts.lloydsbeacon.prompt=발사할 지점을 선택하세요
items.artifacts.lloydsbeacon.levelup=당신의 신호기가 더 강해졌다!
items.artifacts.lloydsbeacon.preventing=이 장소에 있는 강력한 마법 오라가 로이드의 신호기 사용을 방해했다!
items.artifacts.lloydsbeacon.creatures=근처의 생물체가 내는 정신적인 오라 때문에 일시적으로 로이드의 신호기를 사용할 수가 없다.
items.artifacts.lloydsbeacon.return=로이드의 신호기에 현재 위치를 등록시켰다. 언제라도 이 위치로 돌아갈 수 있다.
items.artifacts.lloydsbeacon.desc=로이드의 신호기는 사용자에게 공간이동 마법을 제어할 수 있는 정교한 마법 장치입니다. 신호기에 원하는 위치를 등록 시켜 돌아갈 수도 있지만, 장비한 상태에서 충전량을 소모하여 무작위 공간이동 마법을 발사할 수 있습니다. 이 마법은 대상에게 사용하거나 자신에게도 사용할 수 있습니다.
items.artifacts.lloydsbeacon.desc_set=이 신호기는 픽셀 던전의 %d층 어딘가에 등록되어 있습니다.

items.artifacts.masterthievesarmband.name=대도의 팔찌
items.artifacts.masterthievesarmband.ac_steal=훔친다
items.artifacts.masterthievesarmband.no_charge=팔찌가 충분한 충전량을 가지고 있지 않다.
items.artifacts.masterthievesarmband.cursed=저주받은 팔찌를 사용할 수 없다.
items.artifacts.masterthievesarmband.full=당신의 팔찌가 완전히 충전되었다!
items.artifacts.masterthievesarmband.prompt=목표 대상을 선택하세요
items.artifacts.masterthievesarmband.no_target=근접해 있는 대상을 지정해야 한다.
items.artifacts.masterthievesarmband.steal_shopkeeper=상점 주인에게 직접적으로 도둑질을 할 수는 없다.
items.artifacts.masterthievesarmband.no_steal=이 적은 훔칠 것이 없다.
items.artifacts.masterthievesarmband.stole_item=당신은 %s를 훔쳤다.
items.artifacts.masterthievesarmband.failed_steal=당신은 아무것도 훔치지 못했다.
items.artifacts.masterthievesarmband.level_up=팔찌가 더욱 강해졌다!
items.artifacts.masterthievesarmband.desc=이 보라색 벨벳 팔찌에는 대도의 표식이 새겨져 있습니다. 이것은 당신의 소유가 아니지만, 원래 주인도 또 다른 사람에게서 빼앗았을 것입니다.
items.artifacts.masterthievesarmband.desc_cursed=저주받은 팔찌는 당신의 손목에 묶여, 어떠한 방법으로든 당신의 골드 주머니를 천천히 가볍게 만들고 있는 것 같습니다...
items.artifacts.masterthievesarmband.desc_worn=당신은 경험치를 얻을 때마다 손목에 있는 팔찌가 힘을 축적하고 있는 것을 느낍니다. 당신은 이 힘을 상점에서 물건을 훔치거나, 혹은 적들에게서 물건을 도둑질할 때 사용할 수 있습니다!\n\n도둑질은 즉시 행해지며, 대상을 잠시 불구로 만들고, 적들이 가지고 있는 전리품을 얻을 수 있는 확률이 생깁니다! 이 힘은 당신을 눈치채지 못한 적들에게 더욱 효과적입니다. 같은 적에 대해서 여러 번 도둑질을 한다고 해서 전리품을 얻을 확률이 늘어나진 않습니다.

items.artifacts.sandalsofnature.name=자연의 샌들
items.artifacts.sandalsofnature.name_1=자연의 신발
items.artifacts.sandalsofnature.name_2=자연의 부츠
items.artifacts.sandalsofnature.name_3=자연의 경갑
items.artifacts.sandalsofnature.ac_feed=씨앗 주기
items.artifacts.sandalsofnature.ac_root=뿌리박기
items.artifacts.sandalsofnature.prompt=씨앗을 선택하세요
items.artifacts.sandalsofnature.levelup=당신의 신발은 더 자라나 커졌다!
items.artifacts.sandalsofnature.absorb_seed=당신의 신발은 씨앗을 흡수했다. 신발이 더 건강해졌다.
items.artifacts.sandalsofnature.no_effect=우선 신발에 씨앗을 주어야 합니다.
items.artifacts.sandalsofnature.low_charge=신발 효과를 발동하기엔 에너지가 부족하다.
items.artifacts.sandalsofnature.prompt_target=위치를 선택하세요
items.artifacts.sandalsofnature.out_of_range=효과범위를 벗어났습니다.
items.artifacts.sandalsofnature.desc_1=나무줄기로 만든 듯한 이 샌들은 사실 살아있는 두 개의 식물입니다! 아직은 매우 약하고 창백해 보이니, 영양을 공급하는 것이 어떨까요?
items.artifacts.sandalsofnature.desc_2=이 신발이 자라나서 두 개의 온전한 신발 모양이 되었습니다. 신발 일부는 본래의 색을 되찾았지만, 아직 더 영양을 흡수해야 할 것일지도요?
items.artifacts.sandalsofnature.desc_3=식물이 더 자라나 나무껍질로 만들어진 장화 모양이 되었습니다. 힘을 거의 되찾은 듯 보이지만, 그래도 더 자라날 수 있지 않을까요?
items.artifacts.sandalsofnature.desc_4=이제 식물이 완전히 자라나서 견고한 경갑 한 쌍의 모양이 되었습니다. 이 견갑은 매우 단단한 나무처럼 짙은 갈색을 띄고 있습니다.
items.artifacts.sandalsofnature.desc_hint=이 유물을 착용하는 동안 자연과 더 친화됨을 느낍니다.
items.artifacts.sandalsofnature.desc_cursed=저주받은 샌들은 자연과의 교감을 방해합니다.
items.artifacts.sandalsofnature.desc_ability=신발이 마지막으로 삼킨 씨앗의 빛깔을 띄며 요동칩니다. 일시적으로 신발이 뿌리를 내려 3칸 거리 이내의 원하는 지점에 해당 식물의 효과를 발동할 수 있습니다.\n발동할 식물 효과: _%s_\n필요 충전량: _%d%%_
items.artifacts.sandalsofnature.desc_seeds=당신은 지금까지 %d 씨앗을 먹였습니다.

items.artifacts.skeletonkey.name=해골 열쇠
items.artifacts.skeletonkey.ac_insert=삽입
items.artifacts.skeletonkey.cursed=당신은 저주받은 해골 열쇠를 사용할 수 없다.
items.artifacts.skeletonkey.prompt=대상을 선택하세요
items.artifacts.skeletonkey.invalid_target=잠그거나 열 만한 것이 없다.
items.artifacts.skeletonkey.lock_no_space=문 안에 있는 대상을 잠글 수는 없다!
items.artifacts.skeletonkey.iron_charges=일반적인 자물쇠를 여는 데에는 1의 충전량을 소모합니다.
items.artifacts.skeletonkey.gold_charges=황금 자물쇠를 여는 데에는 2의 충전량을 소모합니다.
items.artifacts.skeletonkey.lock_charges=문을 잠그는 데에는 2의 충전량을 소모합니다.
items.artifacts.skeletonkey.wall_charges=일시적인 벽을 만드는 데에는 2의 충전량을 소모합니다.
items.artifacts.skeletonkey.crystal_charges=수정 자물쇠를 여는 데에는 5의 충전량을 소모합니다.
items.artifacts.skeletonkey.wont_open=어째서인지 열쇠가 이 자물쇠에 들어가는 것을 거부했다.
items.artifacts.skeletonkey.locked_with_key=그 문은 당신의 해골 열쇠로 잠겼습니다.
items.artifacts.skeletonkey.force_lock=해골 열쇠가 없으니 자물쇠가 약해졌습니다. 어떻게든 강제로 열 수 있을 것입니다.
items.artifacts.skeletonkey.discard=필요 없는 열쇠를 버렸다.
items.artifacts.skeletonkey.levelup=당신의 해골 열쇠가 더욱 강해졌다!
items.artifacts.skeletonkey.desc=머리 부분이 해골처럼 생겨, 중요해 보이는 열쇠입니다. 당신이 열쇠 부분을 응시할 때마다 매번 모양이 바뀌는 것처럼 보입니다.
items.artifacts.skeletonkey.desc_worn=이 마법의 열쇠는 던전의 일반적인 열쇠 대신 사용할 수 있으며, 사용할 때마다 힘을 얻습니다. 던전에 있는 거의 모든 자물쇠에 삽입이 가능하며, 잠긴 문을 열거나 잠겨 있지 않은 문을 잠글 수 있습니다.\n\n열쇠는 심지어 빈 공간에 사용하여 당신 앞에 있는 직선 및 대각선 방향의 공기를 '잠글' 수 있으며, 3타일 길이의 단단한 벽을 10턴 동안 생성할 수 있습니다. 잠그기는 가능한 경우 적들을 밀쳐냅니다.
items.artifacts.skeletonkey.desc_cursed=저주받은 열쇠는 적극적으로 자물쇠에 들어가는 것을 회피하고 있으며, 심지어는 다른 열쇠를 사용하는 것도 어렵게(불가능하진 않습니다) 만들고 있습니다.
items.artifacts.skeletonkey$keywall.desc=해골 열쇠로 잠깐 동안 생성한 마법의 벽이다.

items.artifacts.talismanofforesight.name=예지의 부적
items.artifacts.talismanofforesight.ac_scry=예지하기
items.artifacts.talismanofforesight.low_charge=부적은 예지하기 위해 적어도 5%의 충전량이 필요하다.
items.artifacts.talismanofforesight.prompt=탐색할 위치를 선택하세요
items.artifacts.talismanofforesight.levelup=당신의 부적이 더욱 강해졌다!
items.artifacts.talismanofforesight.full_charge=당신의 부적은 완전히 충전되었다!
items.artifacts.talismanofforesight.desc=특이한 문양이 새겨진 매끈한 돌멩이입니다. 당신 주변의 모든 것을 감시하는 것 처럼 보이며, 숨겨진 모든 것에 주시하는 듯 합니다.
items.artifacts.talismanofforesight.desc_worn=부적을 집는 순간 당신의 감각이 날카로워짐을 느낍니다. 부적은 시간이 지나거나 당신이 숨겨진 문 또는 함정을 발견했을 때 천천히 충전됩니다.\n\n부적은 충전량을 소모하여 원뿔 모양의 지역에 있는 모든 비밀을 밝히며, 짧은 시간 동안 적과 아이템의 위치를 확인할 수 있게 되는 '예지'를 사용할 수 있습니다.
items.artifacts.talismanofforesight.desc_cursed=저주받은 부적은 계속 당신을 노려보아 당신의 감각을 둔하게 만듭니다.
items.artifacts.talismanofforesight$foresight.name=예지
items.artifacts.talismanofforesight$foresight.uneasy=뭔가 수상한것 같은데..?
items.artifacts.talismanofforesight$foresight.desc=당신은 매우 불안해졌다. 보이지 않는 위험이 있는 것 같다.

items.artifacts.timekeepershourglass.name=시간군주의 모래시계
items.artifacts.timekeepershourglass.ac_activate=발동한다
items.artifacts.timekeepershourglass.deactivate=당신은 시간 정지를 해제했다.
items.artifacts.timekeepershourglass.no_charge=당신의 모래시계는 아직 충전되지 않았다.
items.artifacts.timekeepershourglass.cursed=저주받은 모래시계를 사용할 수 없다.
items.artifacts.timekeepershourglass.onstasis=순식간에 당신 주변의 모든 것이 뒤바뀐 것 같다.
items.artifacts.timekeepershourglass.onfreeze=당신 주변의 모든것이 순간적으로 멈추었다.
items.artifacts.timekeepershourglass.stasis=자신의 시간을 멈춘다.
items.artifacts.timekeepershourglass.freeze=주변의 시간을 멈춘다.
items.artifacts.timekeepershourglass.prompt=모래시계의 마법을 어떻게 사용하시겠습니까? \n\n자신의 시간을 멈추면, 주변 모든 것의 시간은 정상적으로 흘러가며, 당신은 그 동안 무적이 됩니다. 충전량은 한 번에 최대 2까지 사용됩니다.\n\n주변의 시간을 멈추면, 당신은 그 동안 시간 소모 없이 마음대로 움직일 수 있지만, 모래시계를 다시 사용하거나 적을 공격하면 즉시 효과가 끝납니다.
items.artifacts.timekeepershourglass.desc=이 거대하고 화려한 모래시계는 그렇게 눈에 띄지는 않지만, 아름답게 조각된 몸체에서 엄청난 힘이 느껴집니다. 모래시계를 뒤집어 모래가 흐르는 것을 보면 시간을 다룰 수 있는 마법을 얻게 됩니다.
items.artifacts.timekeepershourglass.desc_hint=모래시계의 모래가 조금 부족한 것 같습니다. 잃어버린 모래를 찾을 수 있다면...
items.artifacts.timekeepershourglass.desc_cursed=저주받은 모래시계가 당신의 곁에 붙어 있으며, 당신이 느끼는 시간을 마음대로 조절하려는 것 같습니다.
items.artifacts.timekeepershourglass$timefreeze.name=시간 정지
items.artifacts.timekeepershourglass$timefreeze.desc=당신은 시간을 멈춰, 어떤 행동이든 즉시 행할 수 있게 되었습니다. 이 효과는 직접 취소하거나 모래시계의 충전이 바닥나면 종료됩니다. 또한 공격 또는 마법을 사용하면 효과가 즉시 종료됩니다.\n\n다음 충전량 소모까지 남은 턴: %s.
items.artifacts.timekeepershourglass$sandbag.name=마법 모래 주머니
items.artifacts.timekeepershourglass$sandbag.levelup=당신은 모래시계에 모래를 더 넣었다.
items.artifacts.timekeepershourglass$sandbag.maxlevel=당신의 모래시계는 마법의 모래로 가득 찼다!
items.artifacts.timekeepershourglass$sandbag.no_hourglass=이 모래를 담을 모래시계가 없다.
items.artifacts.timekeepershourglass$sandbag.desc=이 고운 모래가 든 작은 가방은 당신의 모래시계와 매우 잘 맞습니다.\n\n당신이 꼭 필요한 물건을 하필 상인이 가지고 있다는게 조금 미심쩍긴 합니다만...

items.artifacts.unstablespellbook.name=불안정한 마법책
items.artifacts.unstablespellbook.ac_read=읽는다
items.artifacts.unstablespellbook.ac_add=추가한다
items.artifacts.unstablespellbook.blinded=실명한 상태에선 책을 읽을 수 없다.
items.artifacts.unstablespellbook.no_charge=마법서의 에너지가 떨어진 것 같다.
items.artifacts.unstablespellbook.cursed=저주받은 마법서를 읽을 수 없다.
items.artifacts.unstablespellbook.prompt=주문서를 선택하세요
items.artifacts.unstablespellbook.infuse_scroll=주문서의 에너지를 마법서와 합쳤다.
items.artifacts.unstablespellbook.unable_scroll=이 주문서는 합칠 수 없다.
items.artifacts.unstablespellbook.unknown_scroll=당신은 아직 이 주문서가 어떤 종류인지 모른다.
items.artifacts.unstablespellbook.desc=이 마법책은 오래된 것임에도 불구하고 놀랍도록 새 것같이 느껴집니다. 페이지를 넘길 때마다 불안정한 에너지로 종이가 떨리고 있습니다. 당신이 이 책을 읽을 때, 어떤 주문이 시전될 것인지는 아무도 모릅니다.
items.artifacts.unstablespellbook.desc_cursed=저주받은 책은 당신과 꼭 붙어 있으며, 주문서의 사용을 막고 있습니다.
items.artifacts.unstablespellbook.desc_index=이 책의 몇몇 부분은 미완성입니다. 그리고 책에 없는 빈 부분은 다음과 같습니다:
items.artifacts.unstablespellbook.desc_empowered=책에 추가된 주문서가 강력한 힘을 발산하고 있습니다. 당신은 이 주문서의 신비로운 힘을 일깨워 사용할 수 있지만, 충전량이 추가로 소모됩니다.
items.artifacts.unstablespellbook.read_empowered=당신이 마법책에 넣은 주문서가 힘으로 요동칩니다. 해당 주문서의 기존 효과와 신비로운 효과를 선택해서 사용할 수 있게 되었습니다.\n\n신비로운 효과를 사용하면 주문서의 충전량을 2만큼 사용합니다.



###bags
items.bags.bag.name=배낭
items.bags.bag.discover_hint=이 아이템은 상점에서 살 수 있습니다.

items.bags.potionbandolier.name=물약 보관대
items.bags.potionbandolier.desc=이 두꺼운 보관대는 당신의 가슴팍을 가로지르도록 만들어졌습니다. 또한 물약과 가죽 물통, 액체 금속 병들을 보관할 수 있는 작은 물약통이 많이 달려 있습니다.\n\n이 물약통은 강화된 유리로 만들어져 있어 냉기에 강합니다.

items.bags.scrollholder.name=주문서 보관함
items.bags.scrollholder.desc=이 관 형태의 보관함은 천문학자가 쓸 법한 도구와 자료를 보관할 용도로 만들었습니다만, 당신의 주문서를 넣을 수 있습니다. 또한 주문 결정과 신비한 바늘, 신비한 송진들을 훌륭하게 보관할 수 있는 보조 주머니도 달려 있습니다.\n\n보관함은 방화 재질로 만들어져 있어, 보관한 주문서는 불에 타지 않습니다.

items.bags.velvetpouch.name=벨벳 주머니
items.bags.velvetpouch.desc=이 작은 벨벳 주머니에는 씨앗, 룬석, 몇몇 연금술 재료와 같은 작은 물건들을 많이 담아둘 수 있습니다.
items.bags.velvetpouch.discover_hint=특정 영웅이 이 아이템을 가지고 시작합니다.

items.bags.magicalholster.name=마법 보관집
items.bags.magicalholster.desc=이 얇은 보관집은 어떤 신비로운 동물의 가죽으로 만들어져 있으며, 거기에 깃든 마법의 힘으로 많은 투척 무기와 마법 막대를 담아둘 수 있습니다.\n\n여기에 단순히 손을 뻗기만 해도 당신이 쓰려는 물건을 곧바로 집을 수 있습니다.\n\n보관집에 걸린 마법으로 인해, 보관집 안에 있는 마법 막대의 충전 속도가 약간 빨라지며 투척 무기들을 조금 더 오래 사용할 수 있게 됩니다.



###bombs
items.bombs.arcanebomb.name=비전 폭탄
items.bombs.arcanebomb.desc=이 폭탄은 마법의 힘과 융합되었으며, 폭탄이 폭발하면 구의 몸집 불리기 공격과 비슷하게 주변 2타일 이내에 있는 모든 대상에게 _%1$d-%2$d_의 마법 피해를 입히는 강력한 폭발을 일으킵니다.
items.bombs.arcanebomb.discover_hint=이 아이템은 연금술로 만들 수 있습니다.

items.bombs.bomb.name=폭탄
items.bombs.bomb.ac_lightthrow=폭탄 투척!
items.bombs.bomb.snuff_fuse=당신은 폭탄의 도화선을 재빨리 껐다.
items.bombs.bomb.ondeath=당신은 폭발에 휘말려 죽었다...
items.bombs.bomb.rankings_desc=폭발로 사망
items.bombs.bomb.desc=검은 화약이 꽤 많이 든 폭탄입니다. 폭탄이 폭발하면 근처에 있는 모든 대상에게 _%1$d-%2$d_의 피해를 입히고, 동시에 근처에 있는 지형과 아이템을 파괴합니다.
items.bombs.bomb.desc_fuse=도화선에 불이 붙고 다 타들어갈 때까지 어느 정도의 시간이 걸릴 것 같습니다.
items.bombs.bomb.desc_burning=폭탄의 도화선이 타고 있습니다! 어서 도망치거나 불을 끄십시오!
items.bombs.bomb$doublebomb.name=폭탄 2개
items.bombs.bomb$doublebomb.desc=꽤 무거운 흑색 화약 폭탄입니다. 하나는 공짜인가봐요!

items.bombs.firebomb.name=화염 폭탄
items.bombs.firebomb.desc=폭발이 더 넓게 퍼지도록 개조된 폭탄입니다. 폭탄이 폭발하면 주변 2타일 내에 있는 모든 대상에게 _%1$d-%2$d_의 피해를 입히고, 동시에 범위 내의 모든 지역을 화염으로 뒤덮습니다.
items.bombs.firebomb.discover_hint=이 아이템은 연금술로 만들 수 있습니다.

items.bombs.flashbangbomb.name=섬광탄
items.bombs.flashbangbomb.desc=이 폭탄은 순간적으로 엄청난 빛과 소리를 뿜어냄과 동시에 전기를 방출하도록 개조되었습니다.  폭탄이 폭발하면 주변 2타일 내에 있는 모든 대상에게 _%1$d-%2$d_의 피해를 입히고, 동시에 전기로부터 25%%의 추가 피해를 받게 만들 것이며, 동시에 10턴 동안  기절시킵니다.
items.bombs.flashbangbomb.discover_hint=이 아이템은 연금술로 만들 수 있습니다.

items.bombs.frostbomb.name=서리 폭탄
items.bombs.frostbomb.desc=폭발이 더 넓게 퍼지도록 개조된 폭탄입니다. 폭탄이 폭발하면 주변 2타일 이내에 있는 모든 대상에게 _%1$d-%2$d_의 피해를 입히고, 동시에 범위 내의 모든 지역을 지속적으로 얼어붙게 하는 냉기 돌풍으로 뒤덮습니다.
items.bombs.frostbomb.discover_hint=이 아이템은 연금술로 만들 수 있습니다.

items.bombs.holybomb.name=신성 폭탄
items.bombs.holybomb.desc=이 폭탄은 넓은 지역에 신성한 빛의 섬광을 방출하도록 개조되었습니다. 폭탄이 폭발하면 주변 2타일 이내에 있는 모든 대상에게 _%1$d-%2$d_의 피해를 입히고, 언데드와 악마는 이 빛으로부터 50%%의 추가 피해를 받습니다.
items.bombs.holybomb.discover_hint=이 아이템은 연금술로 만들 수 있습니다.

items.bombs.noisemaker.name=소음 폭탄
items.bombs.noisemaker.desc=이 폭탄은 도화선에 불을 붙이면 반복적으로 시끄러운 소음을 내며 타 들어가도록 개조되었습니다. 누군가가 폭탄을 건드리면 폭발하며 주변 2타일 이내에 있는 모든 대상에게 _%1$d-%2$d_의 피해를 입힙니다!
items.bombs.noisemaker.desc_burning=소음 폭탄이 째깍거리고 있으며, 누군가가 접근하면 폭발합니다!
items.bombs.noisemaker.discover_hint=이 아이템은 연금술로 만들 수 있습니다.

items.bombs.smokebomb.name=연막탄
items.bombs.smokebomb.desc=폭발이 발생함과 동시에 두꺼운 가스 구름을 살포하도록 개조된 폭탄입니다. 폭탄이 폭발하면 주변 2타일 이내에 있는 모든 대상에게 _%1$d-%2$d_의 피해를 입히고, 동시에 범위 내의 모든 지역을 짙은 안개로 뒤덮습니다.
items.bombs.smokebomb.discover_hint=이 아이템은 연금술로 만들 수 있습니다.

items.bombs.regrowthbomb.name=재성장의 폭탄
items.bombs.regrowthbomb.desc=이 폭탄은 피해를 입히는 대신 주변 3타일 범위에 생명의 영약을 흩뿌리도록 개조되었습니다. 폭탄이 폭발하면 범위 내에 있는 모든 지역에 잔디와 식물이 빠르게 자라나게 되며, 당신 혹은 아군이 폭발 범위 내에 있을 경우 치유 물약을 마신 것처럼 치유됩니다.
items.bombs.regrowthbomb.discover_hint=이 아이템은 연금술로 만들 수 있습니다.

items.bombs.shrapnelbomb.name=파편 폭탄
items.bombs.shrapnelbomb.desc=폭발 시 DM-300의 금속 조각들을 사방으로 흩뿌리도록 개조된 폭탄입니다. 폭탄이 폭발하면 폭탄 주변의 굉장히 넓은 범위에 있는 모든 대상에게 _%1$d-%2$d_를 입힙니다. 폭탄이 터지기 전에 반드시 장애물 뒤에 숨어 있어야 할 것입니다...
items.bombs.shrapnelbomb.discover_hint=이 아이템은 연금술로 만들 수 있습니다.

items.bombs.woollybomb.name=양 폭탄
items.bombs.woollybomb.desc=이 폭탄은 주변에 마법 양떼를 소환하도록 개조되었습니다. 폭탄이 폭발하면 주변 2타일 이내에 있는 모든 대상에게 _%1$d-%2$d_의 피해를 입히고, 동시에 마법의 양이 아주 긴 시간 동안 이동을 막습니다! 그러나 강력한 적들이 있는 곳에서는 양이 오래 버틸 수 없으며, 또 당신은 양에게 접촉해 직접 마법을 해제하고 더 빨리 사라지게 만들 수 있습니다.
items.bombs.woollybomb.discover_hint=이 아이템은 연금술로 만들 수 있습니다.

###food
items.food.berry.name=작은 던전 열매
items.food.berry.eat_msg=이 열매는 맛있었다!
items.food.berry.desc=이 작은 열매는 던전의 수풀을 뒤지던 사냥꾼이 발견했습니다. 재빨리 먹을 수 있으며, 약간의 배고픔을 해소해줍니다. 어쩌면 쓸만한 씨앗이 들었을지도 모릅니다.
items.food.berry.discover_hint=이 아이템은 특정한 영웅의 특성 효과로 등장합니다.

items.food.blandfruit.name=단백과
items.food.blandfruit.cooked=조리된 단백과
items.food.blandfruit.sunfruit=태양과
items.food.blandfruit.rotfruit=부패과
items.food.blandfruit.earthfruit=뱀뿌리과
items.food.blandfruit.blindfruit=실명과
items.food.blandfruit.firefruit=화염과
items.food.blandfruit.icefruit=눈꽃과
items.food.blandfruit.fadefruit=미명과
items.food.blandfruit.sorrowfruit=슬픔과
items.food.blandfruit.stormfruit=폭풍과
items.food.blandfruit.dreamfruit=마법과일
items.food.blandfruit.starfruit=별과일
items.food.blandfruit.swiftfruit=신속과
items.food.blandfruit.raw=당신은 이걸 억지로도 먹을 수 없을 것 같다.
items.food.blandfruit.desc=이건 너무 건조하고 쓸모 없을 것 같습니다. 아마 다른 재료와 섞어 요리하면 더 좋아질 수 있을 것 같습니다.
items.food.blandfruit.desc_cooked=이 과일은 솥에 담그면서부터 부풀어 올랐고, 요리된 씨앗의 특성까지 흡수했습니다. 섭취 또는 사용 시 해당 씨앗에 대응하는 물약의 효과가 나타납니다.
items.food.blandfruit.desc_eat=먹을 수 있을 것 같습니다!
items.food.blandfruit.desc_throw=불안정해 보이며, 던져 버려야 할 것 같습니다.
items.food.blandfruit$chunks.name=단백과 조각
items.food.blandfruit$chunks.desc=이 단백과는 폭발하여 과육만 조금 남았습니다.\n\n이 요리된 단백과 과육은 흙이 조금 묻었긴 했지만 먹을 수 있을 것 같습니다.

items.food.chargrilledmeat.name=직화구이 고기
items.food.chargrilledmeat.desc=괜찮게 구워진 고기가 된 것 같다.
items.food.chargrilledmeat.discover_hint=이 아이템은 다른 음식 아이템을 사용해 만들 수 있습니다.

items.food.food.name=비상식량
items.food.food.ac_eat=먹는다
items.food.food.eat_msg=이 음식은 매우 맛있었다!
items.food.food.desc=이 비상식량은 평범해 보입니다. 말린 고기, 비스킷 조금 등이 들어 있습니다.

items.food.frozencarpaccio.name=얼린 생고기
items.food.frozencarpaccio.invis=당신은 손이 투명해지는 것을 보았다!
items.food.frozencarpaccio.hard=당신은 피부가 단단해지는 것을 느꼈다!
items.food.frozencarpaccio.refresh=상태 회복!
items.food.frozencarpaccio.better=당신의 기분이 나아졌다!
items.food.frozencarpaccio.desc=얼린 생고기 조각입니다. 얇게 썰어서 바로 먹을 수 있고 또 맛도 의외로 좋습니다.
items.food.frozencarpaccio.discover_hint=이 아이템은 다른 음식 아이템을 사용해 만들 수 있습니다.

items.food.meatpie.name=고기 파이
items.food.meatpie.eat_msg=이 음식은 엄청난 맛이 났다!
items.food.meatpie.desc=짭짤하게 간이 밴 고기를 채운 맛있는 파이입니다. 이 음식은 다른 어떤 것보다도 당신의 배를 많이 채워줍니다.
items.food.meatpie.discover_hint=이 아이템은 연금술로 만들 수 있습니다.

items.food.mysterymeat.name=수상한 고기
items.food.mysterymeat.eat_msg=이 음식은...수상한 맛이 났다.
items.food.mysterymeat.hot=앗 뜨거!
items.food.mysterymeat.legs=당신은 다리에 감각이 없다!
items.food.mysterymeat.not_well=당신은 몸이 아픈것 같다.
items.food.mysterymeat.stuffed=당신은 속이 막혔다.
items.food.mysterymeat.desc=위험을 감수하고 먹어 보십시오!
items.food.mysterymeat.discover_hint=이 아이템은 특정한 적이 떨어트립니다.
items.food.mysterymeat$placeholder.name=고기

items.food.phantommeat.name=유령 고기
items.food.phantommeat.desc=유령 피라냐에서 잘라낸 크고 반짝이는 반투명 고깃덩어리입니다. 이 고기는 조리가 필요 없으며 허기를 완전히 채우고 여러 가지 방어 능력을 한 번에 제공합니다. 이것을 먹으면 투명화, 나무껍질, 약간의 회복을 제공하고 해로운 효과를 치료합니다.
items.food.phantommeat.discover_hint=이 아이템은 특정한 적이 떨어트립니다.

items.food.pasty.name=패스티
items.food.pasty.fish_name=생선찜
items.food.pasty.amulet_name=옌더의 부적
items.food.pasty.egg_name=이스터 에그
items.food.pasty.rainbow_name=일곱 빛깔 물약
items.food.pasty.shattered_name=초록색 케이크
items.food.pasty.pie_name=호박 파이
items.food.pasty.vanilla_name=파란색 케이크
items.food.pasty.cane_name=사탕 막대
items.food.pasty.sparkling_name=반짝이는 물약
items.food.pasty.desc=속을 소고기와 감자로 채운 진짜배기 콘월 방식 전통 음식입니다. 맛있겠네요!
items.food.pasty.fish_desc=통째로 쪄낸 생선입니다, 야채 위에 얹어 마법으로 보존되어 있습니다. 올해의 이 시기에는 나중을 위해 생선을 조금 남겨두는 것이 전통이기 때문에, 한 번에 모두 먹는 대신 일부를 남겨둡니다.\n\n음력 설 새해 복 많이 받으세요!
items.food.pasty.amulet_desc=드디어 옌더의 부적을 찾았 - 잠깐만요, 이건 그 부적처럼 생긴 은박지포장 초콜릿이었네요! 그 부적처럼 무한한 힘을 얻지는 못할 테지만, 적어도 배를 채우고 약간의 유물 충전은 해줄 겁니다.\n\n만우절!
items.food.pasty.egg_desc=알록달록한 노란색 은박지에 싸인 커다란 초콜릿 달걀입니다. 초콜릿은 충분한 포만감을 제공하며, 안에 들어간 설탕 덕분에 당신의 유물이 약간 충전됩니다.\n\n즐거운 부활절 보내세요!
items.food.pasty.rainbow_desc=이 알록달록한 물약은 일종의 액체 음식입니다. 당신의 허기를 채워 줄 뿐만 아니라, 물약에 포함된 약간의 마법이 인접한 보스가 아닌 적을 진정시켜 일시적으로 당신과 싸우는 것을 주저하도록 만듭니다.\n\n행복한 프라이드 데이 보내세요!
items.food.pasty.shattered_desc=이 커다란 바닐라 케이크 한 조각은 알록달록한 반짝이 사탕과 녹색의 설탕 장식이 올려져 있습니다. 이 케이크는 수 년 간의 경험을 축하하기 위해 만들어졌으며, 먹으면 소량의 경험치를 얻을 수 있습니다.\n\n섀터드 픽셀 던전은 2014년 8월 5일에 처음 출시되었습니다. 녹픽던 생일 축하해!
items.food.pasty.pie_desc=커다란 호박 파이입니다. 달고 향긋한 맛에 배가 차고 약간 치유됩니다.\n\n행복한 할로윈 보내세요!
items.food.pasty.vanilla_desc=이 커다란 바닐라 케이크 한 조각은 알록달록한 반짝이 장식과 파란색 설탕 장식이 올려져 있습니다. 이 케이크는 수 년 간의 경험을 축하하기 위해 만들어졌으며, 먹으면 소량의 경험치를 얻을 수 있습니다.\n\n오리지널 픽셀 던전은 2012년 12월 4일에 처음 출시되었습니다. 픽던도 생일 축하해!
items.food.pasty.cane_desc=설탕으로 만들어진 거대한 사탕 막대입니다.  배를 채우기엔 충분한 양이고, 설탕으로 마법 막대의 충전량을 채울 수도 있습니다.\n\n즐거운 휴일 되세요!
items.food.pasty.sparkling_desc=이 반짝이는 물약은 일종의 액체 음식입니다. 허기를 채워 주는 스파클링 와인과 비슷하지만 실제로 알코올이 들어 있진 않습니다. 당신의 배 속에서 느껴지는 따뜻함이 약간의 방어막을 제공합니다.\n\n새해 복 많이 받으세요!
items.food.pasty$fishleftover.name=생선 조각
items.food.pasty$fishleftover.eat_msg=이 음식은 괜찮은 맛이 났다.
items.food.pasty$fishleftover.desc=이전에 식사를 마치고 남은 생선 조각입니다. 허기를 약간이나마 달래고 싶을 때 언제든지 먹을 수 있습니다.

items.food.smallration.name=소형 비상식량
items.food.smallration.eat_msg=이 음식은 괜찮은 맛이 났다.
items.food.smallration.desc=이 음식은 평범한 비상 식량에서 양만 줄인 제품입니다.
items.food.smallration.discover_hint=이 아이템은 상점에서 살 수 있습니다.

items.food.stewedmeat.name=고기 스튜
items.food.stewedmeat.eat_msg=이 음식은 괜찮은 맛이 났다.
items.food.stewedmeat.desc=고기를 끓여 스튜로 만들면서 병균과 기생충 등이 사멸된 것 같습니다. 안심하고 먹으세요!
items.food.stewedmeat.discover_hint=이 아이템은 연금술로 만들 수 있습니다.

items.food.supplyration.name=보급 식량
items.food.supplyration.desc=이 식량은 도적 길드의 일원이 또다른 일원을 위해 던전에 남겨 둔 것입니다. 특히 이동 중에도 먹기 쉽도록 설계되었으며, 또 은밀한 임무에 도움을 줄 것입니다.\n\n다른 일반적인 식량만큼 배를 채워 주진 못하지만, 대신 재빠르게 먹을 수 있고 약간의 체력을 즉시 회복시키며 또한 도적이 가진 그림자의 망토의 충전량을 회복시킵니다.
items.food.supplyration.discover_hint=이 아이템은 특정한 영웅의 특성 효과로 등장합니다.



##journal items
items.journal.documentpage.name=찢긴 쪽지
items.journal.documentpage.desc=책 같은 것에서 찢겨나간 페이지 한 장이다. 읽기 위해서는 먼저 주워야 할 것 같다.

items.journal.alchemypage.name=찢어진 연금술서 페이지
items.journal.alchemypage.desc=연금술과 관련된 도서에서 찢겨 나온 페이지입니다.\n\n글자가 거리를 두고서는 도저히 읽을 수 없을 정도로 작게 쓰여져 있으며, 제목만 겨우 읽을 수 있을 정도입니다.\n\n제목은 _"%s"_ 라고 쓰여 있습니다.

items.journal.guidebook.name=던전 숙련 지침서
items.journal.guidebook.hint_mobile=가이드북이 당신에게 조언할 게 있습니다! 오른쪽 위에 있는 빛나는 일지 버튼을 눌러 읽어 보세요.
items.journal.guidebook.hint_desktop=가이드북이 당신에게 조언할 게 있습니다! 오른쪽 위에 있는 빛나는 일지 버튼(%s)을 눌러 읽어 보세요.
items.journal.guidebook.hint_status=가이드북
items.journal.guidebook.desc=이것은 모험가를 위한 가이드북으로, 모험을 포기한 누군가가 두고 간 것 같습니다! 특이한 마법이 깃들어 있어, 모험가에게 적절한 순간에 적절한 페이지를 읽도록 유도합니다.\n\n유용함도 유용함이지만, 표지에 큼직하게 적힌 "당황하지 마라!"라는 커다란 안내 문구 덕에 인기가 많습니다.

items.journal.guidepage.name=찢긴 가이드북 쪽지
items.journal.guidepage.desc=모험가의 가이드에서 뜯겨져 나온 페이지입니다.\n\n대부분의 글자는 멀리서 알아볼 순 없지만, 해당 페이지의 제목은 겨우 읽을 수 있을 정도입니다.\n\n_"%s"_ 라고 쓰여 있습니다.

items.journal.regionlorepage$sewers.name=헤진 편지
items.journal.regionlorepage$sewers.desc=흙먼지가 묻은 종이에 쓰여진 편지인 것 같다. 내용을 읽어보려면 가까이 가서 주워야 할 것 같다.

items.journal.regionlorepage$prison.name=헤진 일지
items.journal.regionlorepage$prison.desc=오래된 종이에 쓰여진 일지인 것 같다. 하수구에 떨어진 것 보단 깔끔하게 쓰여졌지만 제대로 읽으려면 역시나 주워야 한다.

items.journal.regionlorepage$caves.name=오래된 탐험 일지
items.journal.regionlorepage$caves.desc=한 탐험가가 남긴 듯한 일지책이다. 엄청 오래 방치된 것 치곤 매우 깔끔한 상태지만, 내용을 읽어보려면 먼저 주워야 한다.

items.journal.regionlorepage$city.name=녹슨 동판
items.journal.regionlorepage$city.desc=금속판에 마법으로 글자를 새겨넣은 기록물인 것 같다. 아주 오래 전 제작된 것 치곤 글자는 매우 깨끗하지만, 내용을 읽으려면 주워야 한다.

items.journal.regionlorepage$halls.name=빛나는 흑판
items.journal.regionlorepage$halls.desc=빛나는 초록 글씌가 쓰여진 작은 흑판이다. 멀리서는 글자가 뒤섞여 보이지 않아, 내용을 읽으려면 주워야 할 것이다.


###keys
items.keys.goldenkey.name=황금 열쇠
items.keys.goldenkey.desc=이 황금 열쇠에 새겨진 눈금은 작고 정교합니다. 아마도 잠긴 상자를 열 수 있을 것 같습니다.

items.keys.crystalkey.name=수정 열쇠
items.keys.crystalkey.desc=이 수정 열쇠의 매끈한 표면은 어둠 속에서도 잘 보입니다. 수정으로 만들어진 잠금 장치를 열 수 있지 않을까요?

items.keys.ironkey.name=쇠 열쇠
items.keys.ironkey.desc=이 고대의 쇠 열쇠에 새겨진 눈금은 많이 닳았습니다. 열쇠를 묶어 둔 가죽끈도 세월이 흘러 닳았습니다. 어떤 문을 열 수 있을까요?

items.keys.wornkey.name=낡은 열쇠
items.keys.wornkey.desc=이 열쇠는 낡고 빛바랬지만, 꽤나 중요해 보입니다. 아마 근처의 어떤 중요한 문을 열 수 있을 것입니다.



###potions
items.potions.potion.ac_drink=마신다
items.potions.potion.turquoise=청록색 물약
items.potions.potion.crimson=선홍색 물약
items.potions.potion.azure=하늘색 물약
items.potions.potion.jade=옥색 물약
items.potions.potion.golden=황금색 물약
items.potions.potion.magenta=자주색 물약
items.potions.potion.charcoal=암회색 물약
items.potions.potion.ivory=상아색 물약
items.potions.potion.amber=호박색 물약
items.potions.potion.bistre=암갈색 물약
items.potions.potion.indigo=군청색 물약
items.potions.potion.silver=은색 물약
items.potions.potion.unknown_desc=이 물병은 소용돌이치는 알록달록한 액체를 담고 있습니다. 이걸 마시거나 던지면 무슨 일이 일어날까요?
items.potions.potion.harmful=위험한 물약입니다!
items.potions.potion.beneficial=이로운 물약입니다.
items.potions.potion.yes=네. 그렇게 하겠습니다.
items.potions.potion.no=아니오.  생각을 바꾸었습니다.
items.potions.potion.sure_drink=정말로 마시겠습니까? 대부분의 상황에서 당신의 적에게 이 물약을 던져야 합니다.
items.potions.potion.sure_throw=정말로 던지겠습니까? 대부분의 상황에서 그냥 마시는 것이 좋습니다.
items.potions.potion.shatter=물병이 깨지며 안에 든 액체가 무해하게 쏟아졌다.
items.potions.potion.discover_hint=이 아이템은 던전에서 무작위로 생성되거나, 연금술로 얻을 수 있습니다.
items.potions.potion$placeholder.name=물약
items.potions.potion$seedtopotion.name=무작위 물약

items.potions.potionofexperience.name=경험의 물약
items.potions.potionofexperience.desc=많은 사람들의 경험을 적은 이야기를 액체로 만든 것이며, 이 물약을 마시는 즉시 당신의 경험 레벨이 상승합니다.

items.potions.potionoffrost.name=서리의 물약
items.potions.potionoffrost.desc=이 화합물은 공기에 닿는 즉시 차가운 구름으로 기화합니다.

items.potions.potionofhaste.name=신속의 물약
items.potions.potionofhaste.energetic=당신은 에너지로 가득 찼다!
items.potions.potionofhaste.desc=매우 달콤한 이 물약은 당신에게 폭발적인 에너지를 부여해 짧은 시간 동안 매우 빠른 속도로 달릴 수 있게 합니다.

items.potions.potionofhealing.name=치유 물약
items.potions.potionofhealing.heal=당신의 상처가 낫기 시작했다.
items.potions.potionofhealing.desc=이 회복약은 체력을 급속도로 회복시키며 많은 상태 이상을 치료합니다.

items.potions.potionofinvisibility.name=투명화의 물약
items.potions.potionofinvisibility.invisible=당신은 손이 투명해지는 것을 보았다!
items.potions.potionofinvisibility.desc=이 물약을 마시면 일시적으로 투명해집니다. 투명해진 상태에서는 적들이 당신을 볼 수 없습니다. 물리적인 공격을 하거나 (주문서나 마법 막대와 같은) 마법 효과를 발동시킨다면 그 즉시 투명 효과가 사라집니다.

items.potions.potionoflevitation.name=부유의 물약
items.potions.potionoflevitation.float=당신은 공중으로 떠올랐다!
items.potions.potionoflevitation.desc=이 호기심을 자아내는 물약을 마시면 공중으로 떠오르게 됩니다. 당신은 공중을 별 어려움 없이 떠다닐 수 있으며 함정과 구덩이를 넘어다닐 수 있습니다. 물약을 던지면 정제되지 않은 가스를 내뿜어 가스를 들이마신 대상의 방향 감각을 상실시킵니다.

items.potions.potionofliquidflame.name=액체 화염 물약
items.potions.potionofliquidflame.desc=이 물병은 불안정한 화합물로 가득 차 있어 공기와 닿으면 급격한 폭발을 일으키며 주변을 불로 뒤덮습니다.

items.potions.potionofmindvision.name=심안의 물약
items.potions.potionofmindvision.see_mobs=당신은 어떻게든 다른 존재들의 생각을 느낄 수 있게 되었다!
items.potions.potionofmindvision.see_none=당신은 어떻게든 이 층에서 혼자 남았다는 사실을 알게 되었다.
items.potions.potionofmindvision.desc=이 용액을 마시면, 당신의 생각은 잠시 동안 근처의 생물체들의 정신적인 흔적과 동화됩니다. 그래서 벽 너머로 생명체를 탐지할 수 있고, 문이나 벽 너머로 무엇이 있는지 볼 수 있습니다.

items.potions.potionofparalyticgas.name=마비 가스의 물약
items.potions.potionofparalyticgas.desc=이 용액이 공기에 노출되면 감각을 마비시키는 노란 안개로 기화하게 됩니다. 이 안개를 들이마시면 즉시 온 몸에 마비가 오게 되며, 구름이 사라진 후에도 얼마 동안은 움직일 수가 없게 됩니다. 던져서 먼 거리에 있는 적들에게 이 구름을 씌워 줄 수 있습니다.

items.potions.potionofpurity.name=정화의 물약
items.potions.potionofpurity.freshness=당신은 흔치 않은 공기의 상쾌함을 느꼈다.
items.potions.potionofpurity.protected=방어막이 당신을 감싼다!
items.potions.potionofpurity.desc=이 마법 용액은 넓은 구역 내의 모든 해로운 범위효과를 빠르게 정화시킵니다. 마시면 해당 효과들에 대해 잠시동안 면역이 됩니다.

items.potions.potionofstrength.name=힘의 물약
items.potions.potionofstrength.msg=새로운 힘이 당신의 몸을 타고 흘러, 힘이 %d로 올랐다!
items.potions.potionofstrength.desc=이 강력한 용액은 당신의 근육을 타고 흘러, 당신의 힘을 1만큼 영구적으로 늘립니다.

items.potions.potionoftoxicgas.name=유독 가스의 물약
items.potions.potionoftoxicgas.desc=이 유리병을 열거나 깨는 순간 내용물이 폭발하여 녹색의 유독성 구름을 남깁니다. 손으로 개봉하는 대신 멀리 있는 적들에게 던질 수 있습니다.



###brews
items.potions.brews.brew.discover_hint=이 아이템은 연금술로 만들 수 있습니다.

items.potions.brews.aquabrew.name=물 혼합물
items.potions.brews.aquabrew.desc=이 혼합물이 깨지면 그 위치에 고압의 물을 폭발시킵니다. 이 물로 인해 직접적인 피해를 입게 되는 것은 불로 이루어진 적들 뿐이지만, 주변 지형에 물을 흩뿌리고, 함정을 무력화하며, 불을 끄고, 폭발의 중심 근처에 있는 모든 캐릭터를 밀쳐냅니다.

items.potions.brews.blizzardbrew.name=눈보라 혼합물
items.potions.brews.blizzardbrew.desc=이 혼합물은 깨지는 순간 가스처럼 빠르게 퍼져나가는 매서운 눈보라를 방출합니다.

items.potions.brews.causticbrew.name=산성 혼합물
items.potions.brews.causticbrew.desc=이 혼합물은 깨진 지점을 중심으로 산성 점액을 넓게 흩뿌립니다. 점액을 뒤집어 쓴 대상은 물에서 씻어내기 전까지 몸이 서서히 녹아내립니다.

items.potions.brews.infernalbrew.name=지옥불 혼합물
items.potions.brews.infernalbrew.desc=이 혼합물은 깨지는 순간 가스처럼 빠르게 퍼져나가는 뜨거운 용암을 방출합니다.

items.potions.brews.shockingbrew.name=전격 혼합물
items.potions.brews.shockingbrew.desc=이 혼합물은 깨지는 순간 주변 넓은 지역에 강력한 전기 폭풍을 방출합니다.

items.potions.brews.unstablebrew.name=불안정한 혼합물
items.potions.brews.unstablebrew.desc=이 마법의 혼합물은 일곱 빛깔로 변화하며 빛나고 있습니다.\n\n이것을 마시거나 던지면 무작위 물약의 효과를 발동합니다. 물약의 효과는 마시면 항상 이로운 효과가 되며, 던지면 항상 해로운 효과가 됩니다.

###elixirs
items.potions.elixirs.elixir.discover_hint=이 아이템은 연금술로 만들 수 있습니다.

items.potions.elixirs.elixirofarcanearmor.name=신비한 갑옷 영약
items.potions.elixirs.elixirofarcanearmor.desc=이 영약은 마신 사람에게 오랫동안 지속되는 마법 저항 효과를 부여합니다.

items.potions.elixirs.elixirofaquaticrejuvenation.name=수상 회복의 영약
items.potions.elixirs.elixirofaquaticrejuvenation.desc=이 영약은 치유 물약에 구의 조각을 섞어 향상시킨 것입니다. 이 영약은 즉각적인 치유 효과를 주진 않지만, 대신 물 위에 서 있을 때 지속적으로 더욱 많은 양의 치유 효과를 줍니다.
items.potions.elixirs.elixirofaquaticrejuvenation$aquahealing.name=수상 회복
items.potions.elixirs.elixirofaquaticrejuvenation$aquahealing.desc=당신은 일시적으로 구와 비슷한 재생 능력을 얻었습니다.\n\n물 위에 서 있는 동안, 당신은 매 턴마다 약간의 체력을 회복합니다. 이 효과는 당신의 체력이 꽉 차 있거나 물 위에 있지 않다면 일시적으로 멈춥니다.\n\n남은 치유량: %d.

items.potions.elixirs.elixirofdragonsblood.name=용의 피 영약
items.potions.elixirs.elixirofdragonsblood.desc=이 영약을 마시는 순간 음용자의 정맥에 맹렬한 힘을 흘려보냅니다. 이 효과는 음용자가 화염에 면역을 갖도록 하며, 물리적 공격에 적을 불태워버릴 수 있는 힘을 실어보냅니다.

items.potions.elixirs.elixiroffeatherfall.name=안전한 착지의 영약
items.potions.elixirs.elixiroffeatherfall.light=당신은 깃털과도 같이 가벼워짐을 느낀다!
items.potions.elixirs.elixiroffeatherfall.desc=이 영약은 사용자에게 약하지만 조금 더 조정된 부유 효과를 부여하여, 짧은 시간 동안 높은 곳에서 떨어질 때에 큰 피해를 받지 않도록 합니다.
items.potions.elixirs.elixiroffeatherfall$featherbuff.name=안전한 착지
items.potions.elixirs.elixiroffeatherfall$featherbuff.desc=당신은 안전한 착지의 영약의 영향으로, 낭떠러지에 떨어져도 안전하게 착지할 수 있습니다!\n\n안전한 착지 효과는 %s턴 동안 지속됩니다.

items.potions.elixirs.elixirofhoneyedhealing.name=달달한 치유 영약
items.potions.elixirs.elixirofhoneyedhealing.desc=이 영약은 치유 물약과 달콤한 꿀을 섞어 만들었으며, 마시면 치유 물약의 효과와 함께 약간의 허기를 회복하며, 동료를 치유하는 데에도 사용될 수 있습니다.\n\n만약 꿀과 친밀감이 있는 생물체에게 사용될 경우 그것을 진정시킵니다.

items.potions.elixirs.elixiroficytouch.name=차가운 숨결 영약
items.potions.elixirs.elixiroficytouch.desc=이 물약을 마시면 당신이 공격하는 적들로부터 열기를 빼앗아 올 수 있게 됩니다. 이 효과는 당신을 추위에 면역으로 만들어주며 물리적 공격으로 적들을 얼려버릴 수도 있습니다.

items.potions.elixirs.elixirofmight.name=용력의 영약
items.potions.elixirs.elixirofmight.msg=새로운 힘이 당신의 몸을 타고 흘러, 힘이 %d로 올랐다!
items.potions.elixirs.elixirofmight.desc=이 강력한 용액은 당신의 근육을 타고 흘러, 영구적으로 1만큼의 힘을, 일시적으로 %d 만큼의 최대 체력을 늘립니다. 이 체력 증가량은 당신의 최대 체력에 따라 결정되나, 이렇게 얻은 최대 체력은 레벨이 오를수록 천천히 감소합니다.
items.potions.elixirs.elixirofmight$htboost.name=최대 체력 증가
items.potions.elixirs.elixirofmight$htboost.desc=당신의 몸이 비자연적으로 강하고 건강해지는 것을 느낍니다.\n\n당신의 최대 체력이 상당히 오랫동안 증가합니다. 레벨을 올림에 따라 이 효과는 서서히 사라집니다.\n\n현재 남아있는 체력 증가량은 %d입니다.\n%d레벨을 올린 후에 효과가 완전히 사라집니다.

items.potions.elixirs.elixiroftoxicessence.name=독성 정수의 영약
items.potions.elixirs.elixiroftoxicessence.desc=이 영약은 사용자에게 독성 에너지와 동화할 수 있는 힘을 제공합니다. 영약을 마시게 되면 사용자는 이동할 때마다 지속적으로 주변에 유독성 가스를 내뿜으며, 동화 효과보다 조금 더 긴 시간 동안 유독성 가스와 중독에 면역이 됩니다.



###exotic potions
items.potions.exotic.exoticpotion.turquoise=신비로운 청록색 물약
items.potions.exotic.exoticpotion.crimson=신비로운 선홍색 물약
items.potions.exotic.exoticpotion.azure=신비로운 하늘색 물약
items.potions.exotic.exoticpotion.jade=신비로운 옥색 물약
items.potions.exotic.exoticpotion.golden=신비로운 황금색 물약
items.potions.exotic.exoticpotion.magenta=신비로운 자주색 물약
items.potions.exotic.exoticpotion.charcoal=신비로운 암회색 물약
items.potions.exotic.exoticpotion.ivory=신비로운 상아색 물약
items.potions.exotic.exoticpotion.amber=신비로운 호박색 물약
items.potions.exotic.exoticpotion.bistre=신비로운 암갈색 물약
items.potions.exotic.exoticpotion.indigo=신비로운 군청색 물약
items.potions.exotic.exoticpotion.silver=신비로운 은색 물약
items.potions.exotic.exoticpotion.unknown_desc=이 둥근 물병은 거칠고 알록달록한 액체를 담고 있습니다. 이 곳과는 어울리지 않는 것으로 보이는데, 마시거나 던졌을 때 무슨 일이 일어날까요?
items.potions.exotic.exoticpotion.warning=이 물약의 사용을 취소하시겠습니까? 사용하지 않더라도 물약은 사라집니다.
items.potions.exotic.exoticpotion.yes=네, 그렇게 하겠습니다.
items.potions.exotic.exoticpotion.no=아니오,  생각을 바꾸었습니다.
items.potions.exotic.exoticpotion.discover_hint=이 아이템은 연금술로 만들 수 있습니다.

items.potions.exotic.potionofcleansing.name=청정의 물약
items.potions.exotic.potionofcleansing.desc=이 강력한 용액을 마시면 몇 턴 간 모든 해로운 상태 효과에 면역이 됩니다. 혹은 목표물에게 던져 대상을 정화하는 데에도 사용할 수 있습니다.
items.potions.exotic.potionofcleansing$cleanse.name=정화
items.potions.exotic.potionofcleansing$cleanse.desc=모든 해로운 상태 효과에 잠시 면역이 되었습니다!\n\n남은 시간: %s턴

items.potions.exotic.potionofcorrosivegas.name=부식 가스의 물약
items.potions.exotic.potionofcorrosivegas.desc=이 물약을 열거나 깨는 순간 내용물이 폭발하여 치명적인 부식 가스가 방출됩니다. 부식 가스는 일반적인 유독 가스보다 더욱 치명적이며, 더 빠르게 퍼져나가지만, 그리 오래 지속되지는 않습니다.

items.potions.exotic.potionofdragonsbreath.name=용 숨결의 물약
items.potions.exotic.potionofdragonsbreath.prompt=불태울 지점을 선택하세요
items.potions.exotic.potionofdragonsbreath.desc=이 물병엔 입속의 침과 반응하여 불꽃을 일으키는 용액이 들어 있습니다. 빠르게 이 용액을 뱉어내면 마치 사용자가 불길을 내뿜는 것처럼 할 수 있습니다!

items.potions.exotic.potionofearthenarmor.name=돌 갑옷의 물약
items.potions.exotic.potionofearthenarmor.desc=더 이상 마비시키지는 않지만, 이 용액은 잠시 동안 신체를 돌로 감싸서 방어력을 증가시킵니다.

items.potions.exotic.potionofdivineinspiration.name=신성한 영감의 물약
items.potions.exotic.potionofdivineinspiration.no_more_points=더 이상 특성 포인트를 얻을 수 없다.
items.potions.exotic.potionofdivineinspiration.select_tier=2 특성 포인트를 얻을 특성 티어를 선택하세요. 포인트를 사용하기 위해서는 해당 티어가 열려 있어야 합니다.
items.potions.exotic.potionofdivineinspiration.bonus=+2 특성 포인트!
items.potions.exotic.potionofdivineinspiration.desc=신성한 힘을 액체 형태로 농축한 것으로, 이것을 마시면 신성한 힘이 깃들어 원하는 특성 티어에 2개의 추가 특성 포인트를 제공합니다.\n\n이 물약은 각 특성 티어 당 한 번씩만 사용할 수 있습니다.

items.potions.exotic.potionofmagicalsight.name=마법 시야의 물약
items.potions.exotic.potionofmagicalsight.desc=이 물약을 마시면 당신의 감각이 짧은 시간동안 무지막지한 정도로 상승하여 시야가 확장되며, 무려 벽 너머로 12타일까지 볼 수 있습니다!

items.potions.exotic.potionofmastery.name=숙련의 물약
items.potions.exotic.potionofmastery.prompt=숙련할 아이템을 선택하세요
items.potions.exotic.potionofmastery.weapon_easier=당신의 무기가 다루기 더 쉬워졌다!
items.potions.exotic.potionofmastery.armor_easier=당신의 갑옷이 착용하기 더 쉬워졌다!
items.potions.exotic.potionofmastery.desc=힘 그 자체를 얻는 대신, 이 물약은 사용자의 근육을 특정 장비 하나에 맞게 조율합니다. 이를 통해 사용자는 그 장비를 수없이 사용해 온 것처럼 손쉽게 다룰 수 있게 됩니다.\n\n선택한 무기 혹은 방어구의 힘 요구 수치가 2 감소합니다. 이 물약은 각 장비에 대해 한 번씩만 사용할 수 있습니다.

items.potions.exotic.potionofshielding.name=방어막의 물약
items.potions.exotic.potionofshielding.desc=사용자를 치유하지는 않는 대신, 이 물약은 지속되는 동안 사용자의 몸에 상당한 피해를 막아낼 수 있는 방어막을 두릅니다.

items.potions.exotic.potionofshroudingfog.name=연막 물약
items.potions.exotic.potionofshroudingfog.desc=이 플라스크에 든 용액은 짙은 연기로 된 안개를 빠르게 퍼뜨려 적들의 시야를 차단합니다.

items.potions.exotic.potionofsnapfreeze.name=순간 빙결 물약
items.potions.exotic.potionofsnapfreeze.desc=이 물약에 들은 화합물은 공기와 격렬하게 반응하여 주변을 빙결시키고 구속시킵니다.

items.potions.exotic.potionofstamina.name=지구력의 물약
items.potions.exotic.potionofstamina.desc=매우 달콤한 이 물약은 당신에게 폭발적인 에너지를 부여해 긴 시간 동안 매우 빠른 속도로 달릴 수 있게 합니다.

items.potions.exotic.potionofstormclouds.name=폭풍우 물약
items.potions.exotic.potionofstormclouds.desc=이 물약을 던지면 던진 지역에 빠르게 퍼져나가는 폭풍을 생성합니다. 폭우가 내려 대부분의 바닥은 물로 바뀌며, 불로 이루어진 적에게 큰 피해를 주며, 불이 꺼지고, 함정은 고장나 작동을 정지합니다.



###quest items
items.quest.ceremonialcandle.name=의식용 양초
items.quest.ceremonialcandle.desc=녹여져 한 덩어리로 굳어 버린 양초 더미입니다.\n\n각각의 양초는 쓸모가 없지만, 다른 양초와 함께 특정한 모양으로 설치하면 소환 의식에 사용할 힘을 모을 수 있습니다.
items.quest.ceremonialcandle.discover_hint=이 아이템은 특정한 퀘스트에서 등장합니다.

items.quest.corpsedust.name=시체 먼지
items.quest.corpsedust.chill=한기가 등골을 타고 흐릅니다.
items.quest.corpsedust.desc=이 시체 먼지 덩어리는 다른 먼지 덩어리랑 별 차이 없어 보입니다. 하지만 당신은 사악한 에너지가 이것을 감싸고 있는 것을 느낍니다.\n\n가능한 한 빨리 없애 버리는게 좋을 것입니다.
items.quest.corpsedust.discover_hint=이 아이템은 특정한 퀘스트에서 등장합니다.

items.quest.darkgold.name=어두운 금 원석
items.quest.darkgold.you_now_have=현재 %d개의 어두운 금 원석을 가지고 있다.
items.quest.darkgold.desc=이 금속이 이러한 이름이 붙은 이유는 사실 평범한 금과 별로 달라 보이지 않지만, 태양빛 아래에 두면 녹아버려 쓸모가 없어져 버리기 때문입니다.
items.quest.darkgold.discover_hint=이 아이템은 특정한 퀘스트에서 등장합니다.

items.quest.dwarftoken.name=드워프 주화
items.quest.dwarftoken.desc=많은 드워프들과 그들이 만든 커다란 피조물들은 알 수 없는 이유로 이 작은 금속 조각을 들고 다닙니다. 아마도 보석의 일종이거나 신원 확인용으로 사용한 것으로 보입니다. 좀 수상한 종족이네요.
items.quest.dwarftoken.discover_hint=이 아이템은 특정한 퀘스트에서 등장합니다.

items.quest.embers.name=정령의 잉걸불
items.quest.embers.desc=이 특이한 잉걸불은 어린 불정령에서만 채취할 수 있습니다. 뜨거운 에너지를 발산하고 있습니다.
items.quest.embers.discover_hint=이 아이템은 특정한 퀘스트에서 등장합니다.

items.quest.escapecrystal.name=탈출 수정
items.quest.escapecrystal.ac_use=사용한다
items.quest.escapecrystal.desc=모종의 공간이동 마법을 담은 것처럼 보이는, 얇은 마법의 주문 수정입니다. 이 수정을 사용해 드워프 금고에서 빠져나올 수 있지만, 아무것도 챙겨 나올 수 없을 것입니다!
items.quest.escapecrystal.discover_hint=이 아이템은 특정한 퀘스트에서 등장합니다.

items.quest.gooblob.name=구의 점액
items.quest.gooblob.desc=구가 죽을 때 떨어져 나온 점액 조각입니다. 커다란 젤리 방울처럼 생겼지만, 먹을 수 있을 것 같지는 않습니다.\n\n점액 그 자체로는 효과가 없지만, 특정한 물약 또는 폭탄에 섞을 때 유용하게 쓰일 수 있을 것 같습니다. 적어도 적당한 양의 에너지로 바꾸는 데 사용할 수 있습니다.
items.quest.gooblob.discover_hint=이 아이템은 특정한 적이 떨어트립니다.

items.quest.metalshard.name=저주받은 쇳조각
items.quest.metalshard.desc=DM-300이 파괴될 때 그것으로부터 떨어져 나온 녹슨 저주받은 금속 조각입니다. 당신은 그것으로부터 비활성화된 악의적인 마법을 느낄 수 있습니다.\n\n쇳조각은 그 자체로는 아무런 효과는 없지만, 특정한 주문서 또는 폭탄에 섞을 때 유용하게 쓰일 수 있을 것 같습니다. 적어도 적당한 양의 에너지로 바꾸는 데 사용할 수 있습니다.
items.quest.metalshard.discover_hint=이 아이템은 특정한 적이 떨어트립니다.

items.quest.pickaxe.name=곡괭이
items.quest.pickaxe.ability_name=꿰뚫기
items.quest.pickaxe.ability_desc=곡괭이를 든 결투자는 적을 _꿰뚫을_ 수 있습니다. 이 공격은 반드시 명중하고, 적에게 3턴의 취약을 부여하며, 단단한 피부를 가진 적에게는 _%1$d-%2$d_의 피해를 입힙니다.
items.quest.pickaxe.upgrade_ability_stat_name=능력 피해량
items.quest.pickaxe.desc=돌을 깨부수는 데 특화된, 무겁지만 튼튼한 도구입니다. 무언가를 채굴하기 위해서라면 딱히 이것을 착용할 필요는 없지만, 절실한 상황에서 사용하기에 적절한 무기 정도는 될 것 같습니다.
items.quest.pickaxe.discover_hint=이 아이템은 특정한 퀘스트에서 등장합니다.

items.quest.ratskull.name=거대한 생쥐 두개골
items.quest.ratskull.desc=놀랍도록 커다란 생쥐 두개골입니다. 벽에 걸어둘 수만 있다면 멋진 사냥 기념물이 될 것 같습니다.



###remains
items.remains.remainsitem.ac_use=사용한다
items.remains.remainsitem.discover_hint=이 아이템은 지난 게임에서 패배한 특정 영웅의 잔해에서 등장합니다.

items.remains.bowfragment.name=활 조각
items.remains.bowfragment.desc=이 부러진 나무 조각은 이전에 실종되었던 사냥꾼이 지니고 있던 영혼의 활의 일부였을 것입니다. 당신은 아직도 이 조각 안에 미약하게나마 남아 있는 자연의 에너지를 느낄 수 있으며, 이걸 사용한다면 주변에 길게 자란 풀 조금을 만들어낼 수 있을 것 같습니다. 다만, 실행에 옮길 경우 이 조각은 파괴될 겁니다.

items.remains.brokenhilt.name=부러진 힐트
items.remains.brokenhilt.desc=이 부러진 칼자루는 이전에 패배했던 결투자의 무기에서 비롯된 물건 같습니다. 당신은 아직도 이 칼자루 안에 미약하게나마 남아 있는 무력을 느낄 수 있으며, 이걸 사용한다면 다음 두 번의 공격 명중 시에 약간의 추가 피해를 더할 수 있을 것 같습니다. 다만, 실행에 옮길 경우 이 칼자루는 파괴될 겁니다.

items.remains.brokenstaff.name=부러진 지팡이
items.remains.brokenstaff.desc=이 마법사의 지팡이는 이전 주인이 최후를 맞이한 후 반으로 부러졌습니다. 당신은 아직도 이 지팡이 안에 미약하게나마 남아 있는 마력을 느낄 수 있으며, 이걸 사용한다면 가지고 있는 마법 막대를 약간 충전시킬 수 있을 것 같습니다. 다만, 실행에 옮길 경우 이 지팡이는 파괴될 겁니다.

items.remains.cloakscrap.name=천 조각
items.remains.cloakscrap.desc=이 반투명한 옷감 조각은 최근 도적이 두르고 있던 그림자의 망토에서 뜯겨 나온 것 같습니다. 당신은 아직도 이 옷감 안에 미약하게나마 남아 있는 신비로운 에너지를 느낄 수 있으며, 이걸 사용한다면 착용 중인 유물을 약간 충전시킬 수 있을 것 같습니다. 다만, 실행에 옮길 경우 이 옷감 조각은 파괴될 겁니다.

items.remains.sealshard.name=인장 파편
items.remains.sealshard.desc=이 작고 붉은 밀랍 조각은 쓰러진 전사의 인장에서 나온 것처럼 보입니다. 당신은 아직도 이 밀랍 조각 안에 미약하게나마 남아 있는 의지력과 집착을 느낄 수 있으며, 이걸 사용한다면 스스로에게 약간의 방어막을 두를 수 있을 것 같습니다. 다만, 실행에 옮길 경우 이 밀랍 조각은 파괴될 겁니다.

items.remains.tornpage.name=찢긴 쪽지
items.remains.tornpage.desc=이 종이는 성직자의 성서에서 찢겨져 나온 것 같습니다. 아직 약간의 신성력이 남아 있어, 사용하면 약간의 체력을 회복합니다. 하지만 사용 시 찢어진 종이는 파괴됩니다.



###rings
items.rings.ring.diamond=다이아몬드 반지
items.rings.ring.opal=오팔 반지
items.rings.ring.garnet=가넷 반지
items.rings.ring.ruby=루비 반지
items.rings.ring.amethyst=자수정 반지
items.rings.ring.topaz=토파즈 반지
items.rings.ring.onyx=흑요석 반지
items.rings.ring.tourmaline=토르말린 반지
items.rings.ring.emerald=에메랄드 반지
items.rings.ring.sapphire=사파이어 반지
items.rings.ring.quartz=수정 반지
items.rings.ring.agate=아게이트 반지
items.rings.ring.equip_cursed=반지가 당신의 손가락을 고통스럽게 옥죄였다!
items.rings.ring.unknown_desc=어둠 속에서 반짝이는 커다란 보석이 박힌 금속 고리입니다. 이걸 꼈을 때 어떤 일이 일어날까요?
items.rings.ring.known=이것은 %s 입니다.
items.rings.ring.identify=당신은 이 반지가 무엇인지 알 만큼 충분히 익숙해졌다.
items.rings.ring.cursed_worn=이 반지는 저주받았기 때문에, 이 반지를 뺄 수 없습니다.
items.rings.ring.curse_known=당신은 악의로 가득 찬 마법이 이 반지에 깃든 것을 느낍니다
items.rings.ring.not_cursed=이 반지에는 악의적인 마법이 없습니다.

items.rings.ringofaccuracy.name=정확성의 반지
items.rings.ringofaccuracy.stats=이 반지를 장착했을 때, 당신의 명중률이 _%s%%_ 만큼 증가합니다.
items.rings.ringofaccuracy.typical_stats=이 반지를 장착했을 때, 당신의 명중률은 일반적으로 _%s%%_ 만큼 증가합니다.
items.rings.ringofaccuracy.combined_stats=장착한 반지들의 효과가 섞여, 당신의 정확성을 총 _%s%%_만큼 증가시킵니다.
items.rings.ringofaccuracy.upgrade_stat_name_1=정확성 증가량
items.rings.ringofaccuracy.desc=이 반지는 착용자의 집중력을 향상시켜, 당신의 공격이 목표를 더 쉽게 노릴 수 있게 합니다. 저주받은 반지는 당신의 공격이 더 잘 빗나가게 만듭니다.

items.rings.ringofarcana.name=신비의 반지
items.rings.ringofarcana.stats=이 반지를 장착했을 때, 무기의 마법과 방어구 상형문자의 효과를 _%s%%_ 만큼 증폭시킵니다.
items.rings.ringofarcana.typical_stats=이 반지를 장착했을 때, 무기의 마법과 방어구 상형문자의 효과를 _%s%%_ 만큼 증폭시킵니다.
items.rings.ringofarcana.combined_stats=장착한 반지들의 효과가 섞여, 당신의 장비에 부여된 마법과 상형문자의 성능을 총 _%s%%_만큼 증가시킵니다.
items.rings.ringofarcana.upgrade_stat_name_1=마법 위력 증가량
items.rings.ringofarcana.desc=이 반지는 무기에 부여된 마법과 방어구의 상형문자, 그리고 저주의 마법 속성을 증폭시킵니다! 마법의 발동 확률이 우선적으로 증가하며, 반드시 발동하는 마법은 그 위력이 증가합니다. 저주받은 반지는 반대로 마법과 상형문자, 저주를 약화시킵니다.

items.rings.ringofelements.name=원소의 반지
items.rings.ringofelements.stats=이 반지를 장착했을 때, 이 반지는 원소에 대한 저항을 _%s%%_ 만큼 제공합니다.
items.rings.ringofelements.typical_stats=이 반지를 장착했을 때, 이 반지는 일반적으로 원소에 대한 저항을 _%s%%_ 만큼 제공합니다.
items.rings.ringofelements.combined_stats=장착한 반지들의 효과가 섞여, 당신의 원소 저항력을 총 _%s%%_만큼 증가시킵니다.
items.rings.ringofelements.upgrade_stat_name_1=원소 저항
items.rings.ringofelements.desc=이 반지는 착용자에게 대부분의 원소 및 마법 효과에 대한 저항을 제공하여, 그러한 효과의 피해와 디버프의 지속 시간을 감소시킵니다. 저주받은 반지는 반대의 효과를 줍니다.

items.rings.ringofenergy.name=충전의 반지
items.rings.ringofenergy.stats=이 반지를 착용하면 착용자의 마법 막대와 유물, 그리고 영웅의 갑옷 충전 속도가 _%s%%_만큼 늘어납니다.
items.rings.ringofenergy.typical_stats=보통 이 반지를 착용하면 마법 막대와 유물, 그리고 영웅의 갑옷 충전 속도가 _%s%%_만큼 늘어납니다.
items.rings.ringofenergy.combined_stats=장착한 반지들의 효과가 섞여, 당신의 충전 속도를 총 _%s%%_만큼 증가시킵니다.
items.rings.ringofenergy.upgrade_stat_name_1=충전 속도 증가량
items.rings.ringofenergy.desc=이 반지는 비전력을 발하여 당신이 가진 모든 마법 장비의 충전을 가속합니다. 저주받은 반지는 반대로 충전 속도를 늦춥니다.

items.rings.ringofevasion.name=회피의 반지
items.rings.ringofevasion.stats=이 반지를 장착했을 때, 당신의 회피가 _%s%%_ 만큼 증가합니다.
items.rings.ringofevasion.typical_stats=이 반지를 장착했을 때, 당신의 회피가 일반적으로 _%s%%_ 만큼 증가합니다.
items.rings.ringofevasion.combined_stats=장착한 반지들의 효과가 섞여, 당신의 회피를 총 _%s%%_만큼 증가시킵니다.
items.rings.ringofevasion.upgrade_stat_name_1=회피 증가량
items.rings.ringofevasion.desc=이 반지는 착용자의 반사신경을 강화시켜 공격을 더 잘 피하도록 만듭니다. 저주받은 반지는 대신 착용자를 공격에 더 쉽게 노출시킵니다.

items.rings.ringofforce.name=완력의 반지
items.rings.ringofforce.stats=현재 힘에 따라 맨손인 상태에서 이 반지는 _%1$d-%2$d 의 피해_를 입힙니다. 무기를 장착한 상태에서는 이 반지가 _%3$d_의 피해를 증가킵니다.
items.rings.ringofforce.typical_stats=이 반지는 맨손인 상태에서 현재 힘에 따라 일반적으로 _%1$d-%2$d 의 피해_를 입힙니다. 무기를 장착한 상태에서는 이 반지가 일반적으로 _%3$d_의 피해를 증가시킵니다.
items.rings.ringofforce.combined_stats=장착한 반지들의 효과가 섞여, 맨손으로 공격 시 총 _%1$d-%2$d_의 피해를 입히며, 무기 착용 시 _%3$d_만큼 피해량을 증가시킵니다.
items.rings.ringofforce.upgrade_stat_name_1=맨손 피해량
items.rings.ringofforce.upgrade_stat_name_2=무기 피해 증가량
items.rings.ringofforce.upgrade_stat_name_3=능력 피해량
items.rings.ringofforce.ability_name=싸움꾼의 자세
items.rings.ringofforce.typical_ability_desc=결투자는 이 반지를 통해 _싸움꾼의 자세_를 취할 수 있게 되며, 싸움꾼의 자세를 취하면 무기를 장착한 채로 공격해도 이 반지를 사용하는 것과 같은 피해를 입힐 수 있습니다. 이 공격은 일반적으로 _%1$d-%2$d_의 피해를 입히고 무기에 부여된 마법과 증강 효과 또한 포함하게 됩니다. 싸움꾼의 자세를 취하는 동안 무기의 충전 속도가 50%%만큼 감소합니다.
items.rings.ringofforce.ability_desc=결투자는 이 반지를 통해 _싸움꾼의 자세_를 취할 수 있게 되며, 싸움꾼의 자세를 취하면 무기를 장착한 채로 공격해도 이 반지를 사용하는 것과 같은 피해를 입힐 수 있습니다. 이 공격은 _%1$d-%2$d_의 피해를 입히고 무기에 부여된 마법과 증강 효과 또한 포함하게 됩니다. 싸움꾼의 자세를 취하는 동안 무기의 충전 속도가 50%%만큼 감소합니다.
items.rings.ringofforce.desc=이 반지는 착용자의 근접 공격을 강화시킵니다. 이 반지가 주는 완력은 무기를 들때 비교적 덜하지만, 무기를 들지 않고 공격하면 더 강한 피해를 줄 수 있습니다. 저주받은 반지는 착용자의 공격력을 약화시킵니다.
items.rings.ringofforce$brawlersstance.name=싸움꾼의 자세
items.rings.ringofforce$brawlersstance.desc=싸움꾼의 자세를 취하는 동안 결투자의 일반적인 공격은 무기를 착용 중이라도 완력의 반지의 공격 피해를 입힐 수 있게 됩니다. 이 공격은 추가적인 피해량을 얻으며, 또한 무기에 부여된 마법과 증강 효과도 적용됩니다.\n\n싸움꾼의 자세를 유지하는 것은 꽤 많은 집중력을 요구하기 때문에, 무기의 충전 속도가 50%만큼 감소합니다.\n\n싸움꾼의 자세는 완력의 반지를 사용함으로써 사용 여부를 바꿀 수 있지만, 싸움꾼의 자세 사용 여부를 빠르게 바꾸면 무기 충전 속도 감소 효과는 곧바로 사라지지 않고 약간 동안 남아 있게 됩니다.

items.rings.ringoffuror.name=분노의 반지
items.rings.ringoffuror.stats=이 반지를 장착했을 때, 당신의 공격 속도가 _%s%%_ 만큼 증가합니다.
items.rings.ringoffuror.typical_stats=이 반지를 장착했을 때, 일반적으로 당신의 공격 속도가 _%s%%_ 만큼 증가합니다.
items.rings.ringoffuror.combined_stats=장착한 반지들의 효과가 섞여, 당신의 공격 속도를 총 _%s%%_만큼 증가시킵니다.
items.rings.ringoffuror.upgrade_stat_name_1=공격 속도 증가량
items.rings.ringoffuror.desc=이 반지는 착용자에게 내면의 분노를 끌어내어, 더 빠르게 공격할 수 있게 합니다. 저주받은 반지는 착용자의 공격 속도를 감소시킵니다.

items.rings.ringofhaste.name=신속의 반지
items.rings.ringofhaste.stats=이 반지를 장착했을 때, 당신의 이동 속도는 _%s%%_ 만큼 증가합니다.
items.rings.ringofhaste.typical_stats=이 반지를 장착했을 때, 당신의 이동 속도가 _%s%%_ 만큼 증가합니다.
items.rings.ringofhaste.combined_stats=장착한 반지들의 효과가 섞여, 당신의 이동 속도를 총 _%s%%_만큼 증가시킵니다.
items.rings.ringofhaste.upgrade_stat_name_1=이동 속도 증가량
items.rings.ringofhaste.desc=이 반지는 착용자의 이동에 걸리는 제약을 감소시켜 초인적인 속도로 달릴 수 있게 합니다. 저주받은 반지는 착용자를 더 둔하게 만듭니다.

items.rings.ringofmight.name=힘의 반지
items.rings.ringofmight.stats=아 반지를 장착했을 때, 당신의 힘이 _%1$d_ 만큼 증가하며, 당신의 최대 체력이 _%2$s%%_ 만큼 증가합니다.
items.rings.ringofmight.typical_stats=이 반지를 장착했을 때, 일반적으로 당신의 힘이 _%1$d _만큼 증가하며, 당신의 최대 체력이 _%2$s%%_ 만큼 증가합니다.
items.rings.ringofmight.combined_stats=장착한 반지들의 효과가 섞여, 당신의 힘을 총 _%1$d_만큼, 최대 체력을 _%2$s%%_만큼 증가시킵니다.
items.rings.ringofmight.upgrade_stat_name_1=힘 증폭
items.rings.ringofmight.upgrade_stat_name_2=최대 체력 증가량
items.rings.ringofmight.desc=이 반지는 착용자의 물리적 특징을 강화하여, 더 강한 힘과 더 많은 최대 체력을 부여합니다. 저주받은 반지는 착용자의 힘을 약화시킵니다.

items.rings.ringofsharpshooting.name=저격의 반지
items.rings.ringofsharpshooting.stats=이 반지를 장착했을 때, 이 반지는 당신의 투척 무기들을 _%1$d_ 만큼 강화한 것 처럼 피해량을 증가시키며, 또한 내구성을 _%2$s%%_ 만큼 늘립니다.
items.rings.ringofsharpshooting.typical_stats=이 반지를 장착했을 때, 이 반지는 일반적으로 당신의 투척 무기들을 _%1$d_ 만큼 강화한 것 처럼 피해량을 증가시키며, 또한 내구성을 _%2$s%%_ 만큼 늘립니다.
items.rings.ringofsharpshooting.combined_stats=장착한 반지들의 효과가 섞여, 당신이 던지는 투척 무기의 성능을 총 _+%1$d_만큼, 내구도를 _%2$s%%_만큼 증가시킵니다.
items.rings.ringofsharpshooting.upgrade_stat_name_1=투척 무기 피해량 레벨 증가량
items.rings.ringofsharpshooting.upgrade_stat_name_2=내구성 증가량
items.rings.ringofsharpshooting.desc=이 반지는 착용자의 정확성과 조준을 향상시켜 모든 발사체 무기들을 더 강력하고 오래 사용할 수 있게 합니다. 저주받은 반지는 반대의 효과를 줍니다.

items.rings.ringoftenacity.name=인내의 반지
items.rings.ringoftenacity.stats=이 반지를 장착했을 때, 이 반지는 당신이 입는 피해를 _%s%%_ 까지 줄입니다.
items.rings.ringoftenacity.typical_stats=이 반지를 장착했을 때, 이 반지는 일반적으로 당신이 입는 피해를  _%s%%_ 만큼 줄입니다.
items.rings.ringoftenacity.combined_stats=장착한 반지들의 효과가 섞여, 당신이 입는 모든 피해를 최대 _%s%%_만큼 경감합니다.
items.rings.ringoftenacity.upgrade_stat_name_1=최대 피해 저항
items.rings.ringoftenacity.desc=이 반지는 착용자가 받은 치명적인 일격에 저항할 수 있게 합니다. 착용자가 더 많이 다칠수록, 피해에 저항하는 정도도 커집니다. 저주받은 반지는 착용자를 더 쉽게 죽게 만듭니다.

items.rings.ringofwealth.name=부유함의 반지
items.rings.ringofwealth.stats=이 반지를 장착했을 때, 이 반지는 당신의 운을 _%s%%_ 만큼 증가시킵니다.
items.rings.ringofwealth.typical_stats=이 반지를 장착했을 때, 이 반지는 일반적으로 당신의 운을 _%s%%_ 만큼 증가시킵니다.
items.rings.ringofwealth.combined_stats=장착한 반지들의 효과가 섞여, 당신의 운을 총 _%s%%_만큼 증가시킵니다.
items.rings.ringofwealth.upgrade_stat_name_1=행운 증가량
items.rings.ringofwealth.desc=이 반지는 보물을 끌어당기는 자석처럼 작용하며, 적들과 상자에서 더 좋은 아이템이 나올 가능성을 늘려 줍니다. 저주받은 반지는 당신이 전리품을 얻을 확률을 감소시킵니다.



###scrolls
items.scrolls.scroll.ac_read=읽는다
items.scrolls.scroll.kaunan=카우난 룬의 주문서
items.scrolls.scroll.sowilo=소윌로 룬의 주문서
items.scrolls.scroll.laguz=라구즈 룬의 주문서
items.scrolls.scroll.yngvi=잉그비 룬의 주문서
items.scrolls.scroll.gyfu=가이푸 룬의 주문서
items.scrolls.scroll.raido=라이도 룬의 주문서
items.scrolls.scroll.isaz=이사즈 룬의 주문서
items.scrolls.scroll.mannaz=만나즈 룬의 주문서
items.scrolls.scroll.naudiz=나우디즈 룬의 주문서
items.scrolls.scroll.berkanan=벨카난 룬의 주문서
items.scrolls.scroll.odal=오달 룬의 주문서
items.scrolls.scroll.tiwaz=티와즈 룬의 주문서
items.scrolls.scroll.unknown_desc=이 양피지에는 해독할 수 없는 글귀들이 가득 쓰여 있습니다. 이 글귀를 따라 읽었을 때 어떤 일이 일어날까요?
items.scrolls.scroll.blinded=눈이 먼 상태에선 주문서를 읽을 수 없다.
items.scrolls.scroll.no_magic=마법 면역 상태에선 주문서를 읽을 수 없습니다.
items.scrolls.scroll.cursed=당신의 저주받은 마법서가 주문서의 마법 발동을 막았다! 아마도 저주  해제의 주문서는 이 효과를 무시할 수 있을 정도로 강력한 것 같다...
items.scrolls.scroll$placeholder.name=마법 주문서

items.scrolls.inventoryscroll.warning=이 주문서의 사용을 취소하시겠습니까? 사용하기 전에 감정되어 있지 않았다면 사용하지 않아도 주문서는 사라집니다.
items.scrolls.inventoryscroll.yes=네, 그렇게 하겠습니다.
items.scrolls.inventoryscroll.no=아니오.  생각을 바꾸었습니다.

items.scrolls.scrollofidentify.name=감정의 주문서
items.scrolls.scrollofidentify.inv_title=감정할 아이템을 선택하세요
items.scrolls.scrollofidentify.it_is=아이템으로 %s을(를) 감정했다.
items.scrolls.scrollofidentify.desc=이 주문서는 하나의 아이템의 비밀을 영구적으로 드러냅니다.

items.scrolls.scrolloflullaby.name=자장가의 주문서
items.scrolls.scrolloflullaby.sooth=이 주문서에서 매우 부드러운 소리가 흘러나왔다. 당신은 매우 졸리다.
items.scrolls.scrolloflullaby.desc=이 주문서를 읽으면 부드러운 선율이 흘러나와 그것을 듣는 모두를 깊은 마법의 잠에 빠지게 합니다. 독자와 그 아군에 대해서는 잠에 회복 효과가 있습니다.

items.scrolls.scrollofmagicmapping.name=마법 지도의 주문서
items.scrolls.scrollofmagicmapping.layout=당신은 현재 층의 구조를 알게 되었다.
items.scrolls.scrollofmagicmapping.desc=이 주문서를 읽으면, 수정같이 맑은 형상이 기억에 각인되어, 현재 층의 모든 비밀을 포함한 지형을 드러나게 합니다. 아이템과 생물체들의 위치는 여전히 알 수 없습니다.

items.scrolls.scrollofmirrorimage.name=거울상의 주문서
items.scrolls.scrollofmirrorimage.copies=주문서가 당신의 거울상을 만들었다.
items.scrolls.scrollofmirrorimage.no_copies=주문서가 당신의 거울상을 만들려고 했으나, 생성할 공간이 없었다.
items.scrolls.scrollofmirrorimage.desc=이 주문서에 적힌 주문은 사용자의 분신을 두 개 소환합니다. 분신들은 원본처럼 적들을 쫓아다닙니다. 하지만 내구력이 약해 피해를 입으면 즉시 사라집니다.

items.scrolls.scrollofretribution.name=징벌의 주문서
items.scrolls.scrollofretribution.blast=강력한 마법 에너지가 주문서를 찢고 나왔다!
items.scrolls.scrollofretribution.desc=이 주문서는 사용자의 고통을 힘의 폭발로 바꾸어 줍니다. 사용자가 피해를 많이 입은 상태일수록 파괴력이 강해지며, 빈사 상태일 때 사용하면 거의 모든 적들을 죽일 수 있습니다.\n\n이 주문서를 읽으면 잠시 동안 눈이 멀고 약화됩니다.

items.scrolls.scrollofrage.name=분노의 주문서
items.scrolls.scrollofrage.roar=주문서가 내뱉은 분노에 찬 함성이 던전 전체에 울려퍼졌다!
items.scrolls.scrollofrage.desc=이 주문서를 읽으면, 모든 적들을 독자에게로 이끌게 되며, 가까운 적들을 격분시키는 엄청난 함성을 발사합니다.

items.scrolls.scrollofrecharging.name=충전의 주문서
items.scrolls.scrollofrecharging.surge=쇄도하는 에너지가 당신 몸을 타고 흘러 가,  당신의 마법 막대를 충전시켰다!
items.scrolls.scrollofrecharging.desc=이 주문서에 담겨 있는 그대로의 마력은 풀려날 때 사용자의 모든 마법 막대를 천천히 충전시킵니다.

items.scrolls.scrollofremovecurse.name=저주 해제의 주문서
items.scrolls.scrollofremovecurse.inv_title=정화할 아이템을 선택하세요
items.scrolls.scrollofremovecurse.cleansed=아이템이 깨끗한 빛으로 빛나면서 사악한 에너지가 사라졌다!
items.scrolls.scrollofremovecurse.not_cleansed=아이템이 깨끗한 빛으로 빛났지만, 아무런 일도 일어나지 않았다.
items.scrolls.scrollofremovecurse.spirit=당신의 주문서가 저주받은 영혼을 해방했다!
items.scrolls.scrollofremovecurse.desc=이 주문서에 담긴 마법은 사용자의 무기, 반지, 마법봉, 유물에 깃든 저주를 즉시 제거합니다.

items.scrolls.scrollofteleportation.name=공간이동의 주문서
items.scrolls.scrollofteleportation.tele=당신은 눈 깜짝할 사이에 이 층의 다른 지역으로 이동했다.
items.scrolls.scrollofteleportation.no_tele=공간이동 마법이 실패했다.
items.scrolls.scrollofteleportation.cant_reach=당신은 그곳으로 순간이동할 수 없다.
items.scrolls.scrollofteleportation.prompt=순간이동할 위치를 선택
items.scrolls.scrollofteleportation.desc=이 양피지에 적힌 마법은 즉시 독자를 현재 층의 다른 위치로 이동시킵니다. 이 주문서는 독자가 이전에 가보지 못한 장소를 우선하나, 잠긴 문이나 바리케이드를 통과하지 못합니다. 다만, 새로운 곳으로 향하는 숨겨진 문을 드러낼 수는 있습니다.

items.scrolls.scrollofterror.name=공포의 주문서
items.scrolls.scrollofterror.none=주문서에서 눈이 부시도록 시뻘건 빛이 뿜어져 나왔다.
items.scrolls.scrollofterror.one=주문서에서 눈이 부시도록 시뻘건 빛이 뿜어져 나오며 %s이(가) 도망쳤다!
items.scrolls.scrollofterror.many=주문서에서 눈이 부시도록 시뻘건 빛이 뿜어져 나오며 몬스터들이 도망쳤다!
items.scrolls.scrollofterror.desc=이 주문서를 사용하면 주문서로부터 방출되는 시뻘건 빛이 사용자의 시야 안에 있는 적들을 공포로 압도하여 도망치게 만듭니다. 도망치는 적들을 공격하면 공포 효과의 지속 시간이 줄어듭니다.

items.scrolls.scrolloftransmutation.name=변환의 주문서
items.scrolls.scrolloftransmutation.inv_title=변환할 아이템을 선택하세요
items.scrolls.scrolloftransmutation.nothing=뭔가 바뀐 건 없어 보인다.
items.scrolls.scrolloftransmutation.morph=당신의 아이템이 다른 것으로 변했다!
items.scrolls.scrolloftransmutation.desc=이 주문서는 강력한 변환 마법이 담겨있습니다. 특정한 아이템에 사용하면 같은 종류의 아이템 중 하나로 바꾸어 버립니다. 변환된 아이템의 강화 수치, 마법 상형문자는 보존됩니다. 마법 주문서나 물약에 사용할 시 신비로운 주문서 또는 물약이 나오며, 이미 변환된 아이템은 변환되기 전으로 돌아갑니다.

items.scrolls.scrollofupgrade.name=강화의 주문서
items.scrolls.scrollofupgrade.inv_title=강화할 아이템을 선택하세요
items.scrolls.scrollofupgrade.weaken_curse=강화의 주문서가 아이템의 저주를 약화했다.
items.scrolls.scrollofupgrade.remove_curse=강화의 주문서가 아이템의 저주를 없애버렸다!
items.scrolls.scrollofupgrade.desc=이 주문서는 아이템 하나 혹은 투척 무기 한 세트를 강화합니다. 마법 막대의 위력과 충전량이 증가하고, 무기와 방어구의 피해량과 방어력이 증가하며, 투척 무기는 완전히 수리됨과 동시에 더 오래 쓸 수 있게 되고, 반지의 효과는 더욱 강력해집니다.\n\n강화는 저주 해제의 주문서만큼 강력하지는 않지만, 저주를 약화하거나 때로는 완전히 해제할 수도 있습니다. 안타깝게도 강화 마법은 높은 강화 수치를 가진 장비에 부여된 마법이나 상형문자도 지울 수 있습니다.



###exotic scrolls
items.scrolls.exotic.exoticscroll.kaunan=신비로운 카우난 룬의 주문서
items.scrolls.exotic.exoticscroll.sowilo=신비로운 소윌로 룬의 주문서
items.scrolls.exotic.exoticscroll.laguz=신비로운 라구즈 룬의 주문서
items.scrolls.exotic.exoticscroll.yngvi=신비로운 잉그비 룬의 주문서
items.scrolls.exotic.exoticscroll.gyfu=신비로운 가이푸 룬의 주문서
items.scrolls.exotic.exoticscroll.raido=신비로운 라이도 룬의 주문서
items.scrolls.exotic.exoticscroll.isaz=신비로운 이사즈 룬의 주문서
items.scrolls.exotic.exoticscroll.mannaz=신비로운 만나즈 룬의 주문서
items.scrolls.exotic.exoticscroll.naudiz=신비로운 나우디즈 룬의 주문서
items.scrolls.exotic.exoticscroll.berkanan=신비로운 벨카난 룬의 주문서
items.scrolls.exotic.exoticscroll.odal=신비로운 오달 룬의 주문서
items.scrolls.exotic.exoticscroll.tiwaz=신비로운 티와즈 룬의 주문서
items.scrolls.exotic.exoticscroll.unknown_desc=이 양피지에는 해독할 수 없는 글귀들로 가득 쓰여 있습니다. 먼 땅에서 온 듯한 이 신비로운 주문서의 글귀를 따라 읽었을 때 어떤 일이 일어날까요?
items.scrolls.exotic.exoticscroll.discover_hint=이 아이템은 연금술로 만들 수 있습니다.

items.scrolls.exotic.scrollofsirenssong.name=사이렌의 노래의 주문서
items.scrolls.exotic.scrollofsirenssong.prompt=대상을 선택하세요
items.scrolls.exotic.scrollofsirenssong.no_target=주문서가 대상 없이 발동했다.
items.scrolls.exotic.scrollofsirenssong.cancel=반드시 대상을 선택해야 한다.
items.scrolls.exotic.scrollofsirenssong.desc=이 주문서를 읽으면 적 하나를 홀려 아군으로 만들어 버리는 매혹적인 선율이 흘러나옵니다! 이 멜로디를 들은 다른 적들은 잠시 동안 매혹됩니다.\n\n특출나게 강력한 적들은 이러한 매료 효과에 저항할 것이며, 대신 매혹됩니다.
items.scrolls.exotic.scrollofsirenssong$enthralled.name=매료
items.scrolls.exotic.scrollofsirenssong$enthralled.desc=이 대상은 사이렌의 노래의 주문서의 마법에 매료되었습니다.\n\n매료된 대상은 영원히 당신의 아군이 되며, 그들이 만나는 어떤 적이든 맞서 싸웁니다.

items.scrolls.exotic.scrollofantimagic.name=항마의 주문서
items.scrolls.exotic.scrollofantimagic.desc=이 주문서의 마법은 당신을 마법 오라로 둘러싸 잠시 동안 이롭거나 해로운 마법 효과 모두를 차단합니다. 마법 막대, 주문서, 반지, 유물, 무기 마법, 그리고 저주의 효과 발생을 막습니다. 하지만 영웅의 갑옷 능력은 이 효과를 무시할 정도로 강력하기 때문에, 여전히 사용이 가능합니다.

items.scrolls.exotic.scrollofchallenge.name=도전의 주문서
items.scrolls.exotic.scrollofchallenge.desc=크게 소리쳐 읽었을 때, 이 주문서는 포효하여 적의 주의를 끌고 그와 동시에 독자 중심의 작은 투기장을 만들어 냅니다.\n\n독자가 투기장 안에 있는 동안 (다른 피해 경감 효과보다 먼저 적용되는)33%의 피해 경감 효과를 얻으며 허기를 느끼지 않습니다.\n\n투기장의 크기는 독자가 있는 공간의 크기에 비례합니다. 보스가 있는 층에서는 투기장이 굉장히 작아집니다.
items.scrolls.exotic.scrollofchallenge$challengearena.name=도전의 투기장
items.scrolls.exotic.scrollofchallenge$challengearena.desc=당신 주변에 붉은 안개가 피어오르는 마법의 투기장이 생겨났습니다.\n\n안개 속에 서 있는 동안 더 이상 배고파지지 않으며 모든 피해를 33%% 적게 받습니다. (방어력 등의)다른 피해 경감 효과는 33%% 경감 이후에 적용됩니다.\n\n남은 턴: %d

items.scrolls.exotic.scrollofdivination.name=점성술의 주문서
items.scrolls.exotic.scrollofdivination.nothing_left=감정할 종류가 남아 있지 않다!
items.scrolls.exotic.scrollofdivination.desc=이 주문서는 당신이 현재 알고 있지 않은 네 가지 아이템을 무작위로 식별합니다. 물약의 색깔이나, 주문서의 룬 문자나, 반지에 박힌 보석이 감정될 수 있으며, 당신이 가지고 있지 않은 아이템도 감정될 수 있습니다.
items.scrolls.exotic.scrollofdivination$wnddivination.desc=점성술의 주문서가 다음의 아이템을 감정했습니다:

items.scrolls.exotic.scrollofdread.name=두려움의 주문서
items.scrolls.exotic.scrollofdread.desc=이 주문서를 읽으면 주문서가 시뻘겋게 빛나며 당신의 시야 안에 있는 모든 적에게 엄청난 공포를 심습니다. 이 효과에 걸린 적은 너무나 겁에 질린 나머지 던전에서 도망치려 할 것이며, 도망친 적은 다시는 돌아오지 않습니다!\n\n공포 효과와 비슷하게, 시간이 지나거나 공격을 받으면 두려움에서 벗어날 수 있습니다.\n\n보스와 같은 강력한 정신력을 가진 적들은 대신 일반 공포 효과를 받습니다.

items.scrolls.exotic.scrollofenchantment.name=마법 부여의 주문서
items.scrolls.exotic.scrollofenchantment.inv_title=마법 부여할 아이템 선택
items.scrolls.exotic.scrollofenchantment.weapon=무기에 부여할 마법 선택
items.scrolls.exotic.scrollofenchantment.armor=갑옷에 부여할 상형문자 선택
items.scrolls.exotic.scrollofenchantment.cancel=취소
items.scrolls.exotic.scrollofenchantment.cancel_warn=취소해도 마법 부여의 주문서는 소모됩니다. 확실합니까?
items.scrolls.exotic.scrollofenchantment.cancel_warn_yes=네, 그렇게 하겠습니다.
items.scrolls.exotic.scrollofenchantment.cancel_warn_no=아니오,  생각을 바꾸었습니다.
items.scrolls.exotic.scrollofenchantment.desc=이 주문서는 무기나 갑옷에 강력한 마법 에너지를 융합합니다. 또한 시전자가 부여할 마법을 어느정도 결정할 수도 있습니다.

items.scrolls.exotic.scrollofforesight.name=예지의 주문서
items.scrolls.exotic.scrollofforesight.desc=이 주문서를 읽고 나면 주변 지형지물의 정보가 수정처럼 명확하게  독자의 머릿속에 지속적으로 제공됩니다. 이 효과는 꽤나 오랜 시간 동안 지속되며, 또한 모든 숨겨진 문이나 함정을 밝혀 내기 때문에 탐색이 필요 없게 됩니다.

items.scrolls.exotic.scrollofmetamorphosis.name=탈바꿈의 주문서
items.scrolls.exotic.scrollofmetamorphosis.choose_desc=탈바꿈할 특성을 선택하세요.
items.scrolls.exotic.scrollofmetamorphosis.replace_desc=탈바꿈한 특성을 대체할 새로운 특성을 선택하세요
items.scrolls.exotic.scrollofmetamorphosis.cancel_warn=취소해도 탈바꿈의 주문서는 소모됩니다. 확실합니까?
items.scrolls.exotic.scrollofmetamorphosis.metamorphose_talent=특성을 변경한다
items.scrolls.exotic.scrollofmetamorphosis.desc=이 주문서는 아이템이 아닌 시전자에게 적용되는 강력한 변환 마법을 담고 있습니다. 이 주문서의 마법은 당신이 고른 특성 하나를 다른 직업의 동일 특성 티어에 있는 종류의 다섯 특성 중 하나로 바꿀 수 있게 해 줍니다!\n\n이 효과는 직업 특성을 바꾸는 데에만 사용할 수 있으며, 보조 직업 특성이나 갑옷 특성은 바꿀 수 없습니다. 또한 당신이 사용할 수 없는 특성은 제공되지 않습니다.

items.scrolls.exotic.scrollofmysticalenergy.name=신비한 에너지의 주문서
items.scrolls.exotic.scrollofmysticalenergy.desc=이 주문서에 담겨 있는 그대로의 마력은 풀려날 때 사용자의 유물을 서서히 충전시킵니다.

items.scrolls.exotic.scrollofpassage.name=통로의 주문서
items.scrolls.exotic.scrollofpassage.desc=이 주문서는 사용자를 해당 지역의 첫번째 층 입구로 순간이동시킵니다. 상점으로 빠르게 이동하는 데 안성맞춤입니다.

items.scrolls.exotic.scrollofprismaticimage.name=프리즈마 거울상의 주문서
items.scrolls.exotic.scrollofprismaticimage.desc=이 주문서에는 사용자를 닮은 다채로운 환영을 소환하는 마법이 담겨 있습니다. 프리즈마 거울상은 사용자와 비슷한 방어력, 그리고 낮은 체력과 공격력을 가지고 사용자의 약한 분신처럼 행동합니다.\n\n프리즈마 거울상은 적이 나타날 경우 스스로를 드러내, 사용자를 지키려 합니다.\n\n만약 프리즈마 거울상이 이미 존재한다면, 이 주문서는 그것의 체력을 완전히 회복시킵니다.

items.scrolls.exotic.scrollofpsionicblast.name=정신 폭발의 주문서
items.scrolls.exotic.scrollofpsionicblast.ondeath=정신 폭발이 당신의 정신을 갈갈이 찢었다...
items.scrolls.exotic.scrollofpsionicblast.desc=이 주문서에는 시야 내에 들어온 모든 대상의 정신을 찢어버릴 수 있는 파괴의 에너지가 들어 있습니다.\n\n이 주문서에서 나온 힘은 독자를 일시적으로 눈이 멀게 만들고, 기절시키며, 상당한 피해를 입힙니다. 피해를 입은 대상이 많을수록 자가 피해가 적어집니다.



###spells
items.spells.alchemize.name=연금화
items.spells.alchemize.prompt=연금화할 아이템 선택
items.spells.alchemize.desc=이 주문은 연금술 솥에서 볼 수 있는 것과 유사한 변형의 힘을 가지고 있습니다. 주문을 사용할 때마다 사용자는 하나의 아이템(혹은 같은 아이템 여러 개)를 골드나 연금술 에너지로 바꿀 수 있게 됩니다. 심지어 물약이나 주문서를 연금술 에너지로 바꾸게 되면 감정도 됩니다!\n\n연금화 주문은 상점에서 조금씩 팔고 있으며, 연금술 솥에서 씨앗과 룬석, 그리고 약간의 연금술 에너지를 섞어 많은 양을 만들어 낼 수 있습니다.
items.spells.alchemize$wndalchemizeitem.sell=%dg로 전환한다
items.spells.alchemize$wndalchemizeitem.sell_1=하나를 %dg로 전환한다
items.spells.alchemize$wndalchemizeitem.sell_all=전부를 %dg로 전환한다
items.spells.alchemize$wndalchemizeitem.energize=%d에너지로 전환한다
items.spells.alchemize$wndalchemizeitem.energize_1=하나를 %d에너지로 전환한다
items.spells.alchemize$wndalchemizeitem.energize_all=전부를 %d에너지로 전환한다

items.spells.beaconofreturning.name=귀환의 신호기
items.spells.beaconofreturning.preventing=이 지역의 강력한 마법 오라가 당신의 주문 사용을 방해한다!
items.spells.beaconofreturning.creatures=근처의 생물체가 내는 정신적인 오라가 당신의 순간이동을 방해한다.
items.spells.beaconofreturning.set=신호기가 당신의 현재 위치에 설정되었다.
items.spells.beaconofreturning.wnd_body=귀환 위치를 새로 설정하면 이전에 신호기에 설정되었던 위치를 갱신합니다.\n\n귀환은 이전에 당신이 지정한 마지막 위치로 되돌아갈 것이며 주문 하나를 소모합니다.
items.spells.beaconofreturning.wnd_set=위치 지정
items.spells.beaconofreturning.wnd_return=귀환
items.spells.beaconofreturning.desc_set=이 신호기는 %d층의 어딘가에 설정되어 있습니다.
items.spells.beaconofreturning.desc=이 복잡한 주문은 사용자에게 지정 위치로 되돌아갈 수 있는 능력을 부여합니다. 귀환 위치 설정은 주문 소모 없이 할 수 있지만, 오직 가장 최근에 설정한 위치만을 기억합니다. 주문은 귀환 시에만 소모됩니다.

items.spells.curseinfusion.name=저주 융합
items.spells.curseinfusion.inv_title=저주를 걸 아이템을 선택하세요
items.spells.curseinfusion.desc=이 주문은 장비 하나에 DM-300 내부에 존재하던 악의에 찬 강력한 마법을 주입합니다. 이 주문을 사용한 아이템은 즉시 저주받으며, 마법이나 상형문자가 있었다면 덮어씌워집니다.\n\n무기, 방어구, 마법 막대에 사용한 경우, 그 아이템은 저주받음과 동시에 강화 수치를 얻습니다. 이 주문으로 얻는 강화 수치는 중첩되지 않으며, 저주가 사라지면 강화 효과 역시 사라집니다.\n\n저주 융합은 여러 번 사용할 수 있으며, 무기나 방어구에 부여된 저주를 바꿉니다.

items.spells.spell.ac_cast=시전
items.spells.spell.no_magic=당신은 마법 면역 도중 마법을 시전할 수 없다.
items.spells.spell.discover_hint=이 아이템은 연금술로 만들 수 있습니다.

items.spells.magicalinfusion.name=마법 융합
items.spells.magicalinfusion.inv_title=융합할 아이템을 선택하세요
items.spells.magicalinfusion.infuse=당신의 아이템은 신비한 에너지와 합쳐졌다!
items.spells.magicalinfusion.desc=이 주문은 강화의 주문서와 동일한 마법 에너지가 깃들어 있지만, 더 안정된 형태를 띠고 있습니다.\n\n기본적으로 아이템을 강화할 뿐 아니라, 마법, 상형문자, 저주를 제거하지 않습니다.

items.spells.magicalporter.name=마법 전송기
items.spells.magicalporter.inv_title=전송할 아이템 선택
items.spells.magicalporter.nowhere=아이템을 옮길 곳이 없습니다.
items.spells.magicalporter.desc=이 마법은 시전된 아이템을 마법으로 전송합니다. 다만 상인의 신호기와는 다르게, 아이템들은 다음 보스 층의 입구로 전송합니다.

items.spells.phaseshift.name=위상 변화
items.spells.phaseshift.no_target=텔레포트할 대상이 없다.
items.spells.phaseshift.desc=이 혼돈 주문은 대상 캐릭터를 현재 층의 임의의 위치로 공간이동시키며, 대상을 긴 시간 동안 기절시킵니다. 강력한 적들은 이러한 기절 효과에 저항합니다. 이 주문은 대상 또는 사용자 자신에게 시전할 수 있습니다.

items.spells.reclaimtrap.name=함정 흡수기
items.spells.reclaimtrap.no_trap=그곳에는 함정이 없다.
items.spells.reclaimtrap.desc_trap=이 주문은 현재 _%s_를 발동할 준비가 되었습니다.
items.spells.reclaimtrap.desc=이 주문은 DM-300 내부에 존재하던 기계 에너지를 담고 있습니다. 주문을 발동 가능한 함정에 시전하면, 그 함정의 힘이 당신에게 스며듭니다. 주문을 재시전 시 흡수한 함정의 효과를 원하는 장소에 발휘할 수 있게 합니다.\n\n그러나, 일부 함정은 어떤 곳에서는 작동하지 않을 수 있으며 주문은 한 번에 단 하나의 함정만 저장할 수 있습니다.

items.spells.recycle.name=재활용
items.spells.recycle.inv_title=재활용할 아이템을 선택하세요
items.spells.recycle.recycled=당신의 아이템은 %s(으)로 재활용되었다.
items.spells.recycle.desc=이 주문은 약한 변형 마법을 담고 있습니다. 장비를 바꿀 수는 없지만, 이 주문은 주문서, 물약, 씨앗, 룬석, 혹은 끝을 붙인 다트를 같은 유형의 무작위 아이템으로 변환시킵니다.

items.spells.summonelemental.name=정령 소환
items.spells.summonelemental.ac_imbue=융합한다
items.spells.summonelemental.imbue_prompt=융합할 아이템을 선택하세요
items.spells.summonelemental.desc=이 주문은 주문을 만들기 위해 사용된 정령의 잉걸불의 에너지를 가지고 있으며, 아군 정령을 소환해 싸울 수 있게 합니다! 한 번에 하나의 정령만 소환할 수 있지만, 주문을 소모하지 않고 다시 사용해 정령을 당신에게 되돌아오도록 지시할 수 있습니다.
items.spells.summonelemental.desc_newborn=이 주문에는 지금 아무 것도 융합되어 있지 않으며, 원거리 공격이 불가능한 _갓 소환된 정령_이 소환됩니다. 감정된 액체 화염 물약, 서리의 물약, 충전의 주문서, 변환의 주문서 중 하나를 융합해 주문을 강화할 수 있으며, 이를 통해 다음부터는 소환 시 완전한 힘을 가진 정령을 소환할 수 있습니다!
items.spells.summonelemental.desc_fire=현재 이 주문은 매우 뜨거운 상태로, 소환 시 _화염 정령_이 소환됩니다. 이 주문에 다른 아이템을 융합할 수 있지만, 현재 융합된 것은 사라집니다.
items.spells.summonelemental.desc_frost=현재 이 주문은 매우 차가운 상태로, 소환 시 _서리 정령_이 소환됩니다. 이 주문에 다른 아이템을 융합할 수 있지만, 현재 융합된 것은 사라집니다.
items.spells.summonelemental.desc_shock=현재 이 주문은 정전기를 방출하고 있으며, 소환 시 _전기 정령_이 소환됩니다. 이 주문에 다른 아이템을 융합할 수 있지만, 현재 융합된 것은 사라집니다.
items.spells.summonelemental.desc_chaos=현재 이 주문은 혼돈의 에너지를 방출하고 있으며, 소환 시 _혼돈 정령_이 소환됩니다. 이 주문에 다른 아이템을 융합할 수 있지만, 현재 융합된 것은 사라집니다.

items.spells.targetedspell.prompt=대상을 선택하세요
items.spells.targetedspell.inv_title=융합할 아이템을 선택하세요

items.spells.telekineticgrab.name=원격 조종 집게
items.spells.telekineticgrab.cant_grab=그 물건은 집을 수 없다.
items.spells.telekineticgrab.no_target=집을만한 것이 없다.
items.spells.telekineticgrab.desc=이 주문은 시전자가 해당 지점에 놓인 모든 아이템 혹은 적에게 박혀 있는 투척 무기를 집을 수 있게 해 줍니다!\n\n다른 대상이 소유하고 있는 물건이나 상자 같은 보관함은 집을 수 없습니다.

items.spells.unstablespell.name=불안정한 주문
items.spells.unstablespell.desc=이 작고 검은 입방체는 각 면마다 변화하는 룬 표식이 새겨져 있습니다.\n\n이 주문을 시전하면 무작위 주문서의 효과가 발동됩니다. 주문서의 효과는 시야 내에 적이 있다면 항상 전투와 관련된 효과가 발동하며, 그렇지 않을 경우 전투와 관련되지 않은 효과가 발동됩니다.

items.spells.wildenergy.name=격렬한 에너지
items.spells.wildenergy.desc=이 주문은 DM-300의 동력이었던 저주받은 에너지의 일부를 담고 있습니다. 이 주문을 시전하면 주문이 당신의 마법 막대와 착용중인 유물을 충전해 주지만, 동시에 임의의 저주받은 마법 막대 효과 또한 발동합니다. 그러나 저주받은 마법을 발사할 위치 정도는 정할 수 있습니다.


###runestones
items.stones.inventorystone.ac_use=사용한다

items.stones.runestone$placeholder.name=룬석
items.stones.runestone.discover_hint=이 아이템은 던전에서 무작위로 생성되거나, 연금술로 얻을 수 있습니다.

items.stones.stoneofaggression.name=공격성의 돌
items.stones.stoneofaggression.desc=이 돌을 아군이나 적군에게 던지면 짧은 시간동안 주변의 모든 적들이 대상 캐릭터를 공격할 확률이 증가합니다\n\n\n그러나 보스들은 이 효과에 저항할 수 있으며, 그들이 소환한 하수인으로부터의 피해를 경감하고 지속 시간 또한 크게 줄입니다.
items.stones.stoneofaggression$aggression.name=목표 지정
items.stones.stoneofaggression$aggression.desc=정신 조작 마법이 주변 적들로 하여금 가급적 이 캐릭터를 공격하게 합니다.\n\n효과 종료까지 %s턴 남았습니다.

items.stones.stoneofaugmentation.name=증강의 돌
items.stones.stoneofaugmentation.inv_title=증강할 아이템을 선택하세요
items.stones.stoneofaugmentation.desc=이 룬석은 장비를 증강시켜 한 특성을 강화시키지만 다른 특성을 약화시킵니다.\n\n무기에 사용하여 속도와 공격력 중 하나를 강화할 수 있습니다. 또한 투척 무기의 경우 공격 속도에 비례해서 내구도를 얻거나 잃게 됩니다.\n\n갑옷에 사용하여 회피와 방어력 중 하나를 강화할 수 있습니다.
items.stones.stoneofaugmentation.discover_hint=이 아이템은 상점에서 구입하거나, 연금술로 만들 수 있습니다.
items.stones.stoneofaugmentation$wndaugment.choice=어떤 것을 강화하고 싶습니까?
items.stones.stoneofaugmentation$wndaugment.speed=속도
items.stones.stoneofaugmentation$wndaugment.damage=공격력
items.stones.stoneofaugmentation$wndaugment.evasion=회피
items.stones.stoneofaugmentation$wndaugment.defense=방어력
items.stones.stoneofaugmentation$wndaugment.none=증강 제거
items.stones.stoneofaugmentation$wndaugment.cancel=돌아가기

items.stones.stoneofblast.name=폭발의 돌
items.stones.stoneofblast.desc=이 돌은 던져진 지점에 즉시 폭발을 일으킵니다. 일반 폭탄처럼 주변의 모든 대상에게 피해를 줍니다.

items.stones.stoneofblink.name=점멸의 돌
items.stones.stoneofblink.desc=이 돌은 던져진 지점으로 사용자를 즉시 순간이동 시킵니다.

items.stones.stoneofclairvoyance.name=청명의 돌
items.stones.stoneofclairvoyance.desc=이 돌은 던져진 곳을 중심으로 매우 넓은 구역에 있는 모든 숨겨진 타일들을 드러냅니다. 이 효과는 심지어 벽 너머로도 적용됩니다.

items.stones.stoneofdeepsleep.name=깊은 수면의 돌
items.stones.stoneofdeepsleep.desc=적에게 이 돌을 던지면, 대상은 깊은 마법의 수면에 빠지게 되어 방해받기 전까지 영원히 잠을 자게 됩니다.

items.stones.stoneofdetectmagic.name=마법 탐지의 돌
items.stones.stoneofdetectmagic.inv_title=아이템을 선택하세요
items.stones.stoneofdetectmagic.detected_none=이 아이템에 부여된 어떠한 마법도 발견하지 못 했다.
items.stones.stoneofdetectmagic.detected_both=이 아이템에서 긍정적인 마법과 악의 담긴 마법이 동시에 확인되었다!
items.stones.stoneofdetectmagic.detected_good=이 아이템에서 긍정적인 마법이 확인되었다!
items.stones.stoneofdetectmagic.detected_bad=이 아이템에서 악의 담긴 마법이 확인되었다!
items.stones.stoneofdetectmagic.desc=이 룬석은 아이템에 부여된 마법을 탐지할 수 있습니다. 이 돌을 감정하지 않은 아이템에 사용하면 해당 아이템에 악의 담긴 마법이 부여되어 있는지, 혹은 강화나 인챈트와 같은 긍정적인 마법이 부여되어 있는지 확인할 수 있습니다.

items.stones.stoneofdisarming.name=해체의 돌
items.stones.stoneofdisarming.desc=이 룬석은 던전에 숨겨진 사악한 함정들을 무력화시킬 수 있는 마법이 담겨있습니다. 던져진 곳 주변의 함정을 최대 9개까지 무력화시킵니다.

items.stones.stoneofenchantment.name=마법 부여의 돌
items.stones.stoneofenchantment.inv_title=마법 부여할 아이템 선택
items.stones.stoneofenchantment.weapon=당신의 무기는 어둠 속에서 빛났다!
items.stones.stoneofenchantment.armor=당신의 갑옷은 어둠 속에서 빛났다!
items.stones.stoneofenchantment.desc=이 룬석은 마법 부여의 힘이 담겨 있습니다. 강화의 주문서처럼 장비 자체의 질을 향상시키지는 않지만, 대신 무기와 방어구와 융합하여 장비에 마법을 부여할 수 있습니다.

items.stones.stoneoffear.name=두려움의 돌
items.stones.stoneoffear.desc=다른 캐릭터에게 이 돌을 던지면, 그 대상은 공포로 압도되어 뒤돌아서 도망칩니다. 도망치는 적을 공격하면 공포의 지속시간이 줄어듭니다.

items.stones.stoneofflock.name=양떼의 돌
items.stones.stoneofflock.desc=이 돌은 던져진 지점 주변에 마법의 양을 소환합니다.

items.stones.stoneofintuition.name=직감의 돌
items.stones.stoneofintuition.inv_title=아이템을 선택하세요
items.stones.stoneofintuition.desc=이 룬석은 감정의 마법서와 같은 종류의 약한 마법을 품고 있습니다. 직접 아이템을 감정할 수는 없으나, 당신의 직감과 결합하여 지정한 물약이나 주문서, 혹은 반지의 종류를 추측해낼 수 있습니다.
items.stones.stoneofintuition.break_info=당신은 직감의 돌 하나를 2번까지 사용할 수 있으며, _다음 사용 시 직감의 돌을 소모하지 않습니다._
items.stones.stoneofintuition.break_warn=당신은 이전에 직감의 돌을 사용했습니다. 따라서 _다음 사용 시 직감의 돌을 소모합니다._
items.stones.stoneofintuition$wndguess.text=이 아이템이 어떤 것인지 맞혀 보세요. 정답을 고르면 아이템의 종류가 감정됩니다!
items.stones.stoneofintuition$wndguess.correct=정답입니다. 아이템의 종류가 감정되었습니다!
items.stones.stoneofintuition$wndguess.incorrect=당신의 추측은 틀렸습니다.
items.stones.stoneofintuition$wndguess.break=직감의 돌이 부서져 가루가 되었다...

items.stones.stoneofshock.name=충격의 돌
items.stones.stoneofshock.desc=이 돌은 던져진 지점에 짧은 시간 동안 번개 폭풍을 생성하여 주변의 적들을 마비시키고, 맞은 적의 수만큼 사용자의 마법 막대를 충전시킵니다.


###trinkets
items.trinkets.chaoticcenser.name=혼돈의 향로
items.trinkets.chaoticcenser.spew=향로가 %s을/를 분출하려는 것 같다.
items.trinkets.chaoticcenser.desc=연금술 솥에서 약간의 시간이 지난 후 스스로 향이 타오르며 연기를 피워 내는 향로가 나타났습니다! 이러한 가스는 축적되어 무작위한 주기에 따라 적이 있는 방향으로 분출됩니다. 향로는 모든 종류의 가스를 만들어낼 수 있는 것 같지만, 당신은 향로가 가스를 분출하기 직전에 경고를 받게 됩니다.
items.trinkets.chaoticcenser.typical_stats_desc=일반적으로 이 장신구는 대략 _%d_턴마다 적이 있는 위치에 해로운 가스를 분출합니다. 가스는 적들이 주변에 있을 때만 분출할 수 있습니다. 강화 수치가 올라가면 더 신비롭고 강력한 가스가 나올 가능성이 높아집니다.
items.trinkets.chaoticcenser.stats_desc=이 장신구는 현재 강화 수치에서 대략 _%d_턴마다 적이 있는 위치에 해로운 가스를 분출합니다. 가스는 적들이 주변에 있을 때만 분출할 수 있습니다. 강화 수치가 올라가면 더 신비롭고 강력한 가스가 나올 가능성이 높아집니다.

items.trinkets.crackedspyglass.name=깨진 망원경
items.trinkets.crackedspyglass.desc=이 휴대용 망원경은 훌륭하고 정밀한 제작 기술을 보여주는 좋은 예시가 됩니다. 앞 부분의 렌즈가 깨져 있지만 않았다면 말이죠. 이 망원경은 던전에서 새로운 물건을 찾아내는 것을 돕는 것 같지만, 렌즈에 간 금 때문에 물건들이 잘 안 보이게 됩니다!
items.trinkets.crackedspyglass.typical_stats_desc=일반적으로 이 장신구는 _%1$s%%_확률로 보스 층이 아닌 매 층마다 숨겨진 추가 아이템을 생성합니다.
items.trinkets.crackedspyglass.stats_desc=현재 강화 수치에서, 이 장신구는 _%1$s%%_확률로 보스 층이 아닌 매 층마다 숨겨진 추가 아이템을 생성합니다.
items.trinkets.crackedspyglass.stats_desc_upgraded=현재 강화 수치에서, 이 장신구는 _100%%_확률로 보스 층이 아닌 매 층마다 숨겨진 추가 아이템을 생성하고, _%1$s%%_ 확률로 두 번째 숨겨진 추가 아이템을 생성합니다.

items.trinkets.dimensionalsundial.name=차원의 해시계
items.trinkets.dimensionalsundial.warning=당신의 해시계에 그림자가 드리워져 있지 않으며, 불안함이 느껴집니다.
items.trinkets.dimensionalsundial.desc=이 작은 휴대용 해시계는 이 던전 깊숙한 곳에서도 어떻게든 그림자를 드리울 수 있습니다. 심지어 당신이 똑바로 들고 있지 않아도 말이죠. 그보다 더 이상한 것은 그림자가 드리우는 위치가 이 세계의 태양과는 전혀 관계가 없는 것처럼 보인다는 점입니다. 그림자가 드리워져 있지 않으면, 해시계는 위험을 계속해서 불러옵니다.
items.trinkets.dimensionalsundial.typical_stats_desc=일반적으로 이 장신구는 실제 시각이 낮(오전 8시-오후 8시)이면 적 생성 빈도를 _%1$d%%_만큼 낮추고 실제 시각이 밤(오후 8시-오전 8시)이면 적 생성 빈도를 _%2$d%%_만큼 높입니다.
items.trinkets.dimensionalsundial.stats_desc=이 장신구는 현재 강화 수치에서 실제 시각이 낮(오전 8시-오후 8시)이면 적 생성 빈도를 _%1$d%%_만큼 낮추고 실제 시각이 밤(오후 8시-오전 8시)이면 적 생성 빈도를 _%2$d%%_만큼 높입니다.

items.trinkets.exoticcrystals.name=신비로운 수정
items.trinkets.exoticcrystals.desc=이 작은 분홍 결정들은 연금술 에너지 결정과 똑같은 모양을 가지고 있습니다. 연금술 에너지로 직접 사용하는 것은 불가능하지만, 이 결정들은 어떠한 방식으로 당신이 발견하는 물약과 주문서에 영향을 주고 있는 것 같습니다.
items.trinkets.exoticcrystals.typical_stats_desc=일반적으로 이 장신구는 던전에 생성되는 물약과 주문서의 _%s%%_를 그에 대응하는 신비로운 물약과 주문서로 변경합니다. 이 효과는 힘의 물약, 강화의 주문서, 위험한 방을 공략하기 위한 물건들에 영향을 주지 않습니다.
items.trinkets.exoticcrystals.stats_desc=이 장신구는 현재 강화 수치에서 던전에 생성되는 물약과 주문서의 _%s%%_를 그에 대응하는 신비로운 물약과 주문서로 변경합니다. 이 효과는 힘의 물약, 강화의 주문서, 위험한 방을 공략하기 위한 물건들에 영향을 주지 않습니다.

items.trinkets.eyeofnewt.name=영원의 눈
items.trinkets.eyeofnewt.desc=이 금빛과 검은 빛이 감도는 영원의 눈은 흔한 재료지만, 강화되어 장신구가 되었습니다. 이 눈은 당신의 시야를 좁게 만드는 대신 사물을 다른 방식으로 볼 수 있게 해 줍니다.
items.trinkets.eyeofnewt.typical_stats_desc=일반적으로 이 장신구는 당신의 시야 범위를 _%1$s%%_만큼 줄이지만, 주변 _%2$d_타일 내에 있는 모든 적들에 대한 심안 효과를 제공합니다.
items.trinkets.eyeofnewt.stats_desc=이 장신구는 현재 강화 수치에서 당신의 시야 범위를 _%1$s%%_만큼 줄이지만, 주변 _%2$d_타일 내에 있는 모든 적들에 대한 심안 효과를 제공합니다.

items.trinkets.ferrettuft.name=족제비 터럭
items.trinkets.ferrettuft.desc=초록색 리본으로 묶은 부드럽고 흰 족제비의 터럭입니다. 족제비는 민첩함, 장난스러움, 그리고 낮은 집중력으로 알려져 있습니다. 이 장신구에도 그 속성이 남아 있어 주변의 모든 것의 회피를 증가시킵니다.
items.trinkets.ferrettuft.typical_stats_desc=보통 이 장신구는 모든 캐릭터의 회피를 _%1$s%%_ 만큼 증가시킵니다.
items.trinkets.ferrettuft.stats_desc=이 장신구는 현재 강화 수치에서 모든 캐릭터의 회피를 _%1$s%%_만큼 증가시킵니다.

items.trinkets.mimictooth.name=미믹 이빨
items.trinkets.mimictooth.desc=이 커다랗고 날카로운 이빨은 매우 불행한 미믹에게서 뽑혀져 나온 것일 겁니다. 이빨은 던전의 미믹들에게 영향을 주고 있는 것처럼 보이며, 미믹들이 더 자주 등장하게 함과 동시에 더욱 위험하게 만들고 있습니다.
items.trinkets.mimictooth.typical_stats_desc=일반적으로 이 장신구는 모든 종류의 미믹들이 _%1$s배_ 더 자주 등장하며 눈치채기 훨씬 힘들게 만들지만, 동시에 미믹이 떨어뜨리는 전리품의 양 또한 늘립니다. 또한 던전의 각 층마다 _%2$s%%_ 확률로 은신한 흑단 미믹이 등장합니다.
items.trinkets.mimictooth.stats_desc=이 장신구는 현재 강화 수치에서 모든 종류의 미믹들이 _%1$s배_ 더 자주 등장하며 눈치채기 훨씬 힘들게 만들지만, 동시에 미믹이 떨어뜨리는 전리품의 양 또한 늘립니다. 또한 던전의 각 층마다 _%2$s%%_ 확률로 은신한 흑단 미믹이 등장합니다.

items.trinkets.mossyclump.name=이끼 덩어리
items.trinkets.mossyclump.desc=이 젖은 이끼 덩어리는 당신이 아무리 쥐어짜도 수분을 머금고 있는 것 같습니다. 이 이끼 덩어리는 던전 자체에 귀속되어 있는 것처럼 보이며, 잔디와 물을 더 자주 나타나게 만듭니다.
items.trinkets.mossyclump.typical_stats_desc=일반적으로 이 장신구는 특수하지 않은 층을 _%d%%_ 확률로 물 또는 잔디로 가득 찬 층으로 변경합니다.\n\n이 장신구는 강화에 많은 양의 에너지를 사용합니다.
items.trinkets.mossyclump.stats_desc=이 장신구는 현재 강화 수치에서 특수하지 않은 층을 _%d%%_ 확률로 물 또는 잔디로 가득 찬 층으로 변경합니다.\n\n이 장신구는 강화에 많은 양의 에너지를 사용합니다.

items.trinkets.parchmentscrap.name=양피지 조각
items.trinkets.parchmentscrap.desc=이 작은 양피지 조각은 주문서에서 떨어져 나온 것 같습니다. 양피지 조각은 약간의 마력을 유지하고 있으며, 던전에서 등장하는 무기와 방어구에 영향을 주는 것으로 보입니다.
items.trinkets.parchmentscrap.typical_stats_desc=일반적으로 이 장신구는 마법과 상형문자를 _%d배_ 더 자주 등장하게 만들며, 무기와 방어구에 부여되는 저주를 _%s배_ 더 자주 등장하게 합니다. 마법 막대, 반지, 유물에 부여되는 저주는 해당하지 않습니다.\n\n이 장신구는 강화에 많은 에너지를 사용합니다.
items.trinkets.parchmentscrap.stats_desc=이 장신구는 현재 강화 수치에서 마법과 상형문자를 _%d배_ 더 자주 등장하게 만들며, 무기와 방어구에 부여되는 저주를 _%s배_ 더 자주 등장하게 합니다. 마법 막대, 반지, 유물에 부여되는 저주는 해당하지 않습니다.\n\n이 장신구는 강화에 많은 에너지를 사용합니다.

items.trinkets.petrifiedseed.name=씨앗 화석
items.trinkets.petrifiedseed.desc=이 씨앗은 느린 지질학적 과정이나 마법에 의해 화석화되었습니다. 이 씨앗은 던전의 식생에 마법으로 영향을 미치며, 때때로 씨앗을 룬석으로 바꾸는 것으로 보입니다.
items.trinkets.petrifiedseed.typical_stats_desc=일반적으로 이 장신구는 잔디를 밟을 때 떨어지는 씨앗을 _%1$s%%_ 확률로 룬석으로 변경하고, 동시에 길게 자란 풀이 아이템을 떨어뜨릴 확률을 _%2$s%%_만큼 늘립니다.
items.trinkets.petrifiedseed.stats_desc=이 장신구는 현재 강화 수치에서 잔디를 밟을 때 떨어지는 씨앗을 _%1$s%%_ 확률로 룬석으로 변경하고, 동시에 길게 자란 풀이 아이템을 떨어뜨릴 확률을 _%2$s%%_만큼 늘립니다.

items.trinkets.ratskull.name=쥐 두개골
items.trinkets.ratskull.desc=이 무시무시한 장신구는 일반적인 쥐의 두개골보다 특출나게 크진 않지만, 그래도 이 던전에서 꽤 보기 힘든 거긴 합니다. 두개골에 담긴 마법의 영향인지, 던전에 서식하는 생명체들이 더 많이 모여 들어 더 자주 마주치게 되는 것 같습니다.
items.trinkets.ratskull.typical_stats_desc=일반적으로 이 장신구는 희귀한 적들을 _%d배_ 더 많이 등장하게 하며, 수정 미믹과 갑옷 입은 석상이 등장하는 것에는 절반의 효과만 가집니다.
items.trinkets.ratskull.stats_desc=이 장신구는 현재 강화 수치에서 희귀한 적들을 _%d배_ 더 많이 등장하게 하며, 수정 미믹과 갑옷 입은 석상이 등장하는 것에는 절반의 효과만 가집니다.

items.trinkets.saltcube.name=소금 큐브
items.trinkets.saltcube.desc=이 커다란 소금 결정은 거의 완벽한 큐브 형태로 깎였으며, 연금술 솥에서 녹는 대신 오히려 그 물의 절반을 흡수했습니다. 소금 큐브는 당신이 먹는 음식의 수분을 마법으로 흡수하여 보존하고 있으며, 이에 따라 당신이 얻는 포만감이 증가한 대신 굶주리지 않을 때의 체력 재생량이 감소했습니다.
items.trinkets.saltcube.typical_stats_desc=일반적으로 이 장신구는 당신이 잠기지 않은 층에 있을 때 배고픔을 느끼기까지의 시간을 _%1$s%%_만큼 늘리지만, 체력 재생량을 _%2$s%%_만큼 줄입니다.
items.trinkets.saltcube.stats_desc=이 장신구는 현재 강화 수치에서 당신이 잠기지 않은 층에 있을 때 배고픔을 느끼기까지의 시간을 _%1$s%%_만큼 늘리지만, 체력 재생량을 _%2$s%%_만큼 줄입니다.

items.trinkets.shardofoblivion.name=망각의 파편
items.trinkets.shardofoblivion.desc=연금술 냄비에서 끓여낸 이후, 이 작은 저주받은 금속 파편은 아무것도... 아닌? 것으로 변했습니다. 빛이 그 주위로 휘어지는 것 같고, 들고 있지 않으면 제자리에서 맴돌고 있습니다. 이 파편은 당신의 무지에서 마법의 힘을 끌어내는 것 같으니 너무 생각하지 않는 게 좋을 것 같네요.
items.trinkets.shardofoblivion.typical_stats_desc=일반적으로 이 장신구는 당신이 착용 중인 미감정 아이템 하나 당 적들이 전리품을 떨어뜨릴 확률을 20%%만큼 늘립니다. 최대 _%d개_까지 적용됩니다. 이 조각은 당신이 장비를 감정할 수 없도록 만들지만, 수동으로 아이템을 감정하는 아이템은 여전히 사용 가능합니다.
items.trinkets.shardofoblivion.stats_desc=이 장신구는 현재 강화 수치에서 당신이 착용 중인 미감정 장비 하나 당 적들이 전리품을 떨어뜨릴 확률을 20%%만큼 늘립니다. 최대 _%d개_까지 적용됩니다. 이 조각은 당신이 장비를 감정할 수 없도록 만들지만, 수동으로 아이템을 감정하는 아이템은 여전히 사용 가능합니다.
items.trinkets.shardofoblivion.ac_identify=감정한다
items.trinkets.shardofoblivion.identify_prompt=감정할 아이템을 선택하세요
items.trinkets.shardofoblivion.identify_ready=이제 망각의 파편을 사용하여 다음 아이템을 감정할 수 있습니다: %s.
items.trinkets.shardofoblivion.identify_ready_worn=이제 망각의 파편을 사용하여 착용한 장비들을 감정할 수 있습니다.
items.trinkets.shardofoblivion.identify_not_yet=그 아이템은 아직 감정할 준비가 되지 않았다.
items.trinkets.shardofoblivion.identify=아이템을 감정했다!
items.trinkets.shardofoblivion$wandusetracker.name=감정되지 않은 마법 막대 사용
items.trinkets.shardofoblivion$wandusetracker.desc=당신은 최근에 감정되지 않은 마법 막대를 사용했으며, 망각의 조각 효과에 적용되는 감정되지 않은 장비의 일환으로서 적용되고 있습니다.\n\n남은 턴: %s.
items.trinkets.shardofoblivion$thrownusetracker.name=감정되지 않은 투척 무기 사용
items.trinkets.shardofoblivion$thrownusetracker.desc=당신은 최근에 감정되지 않은 투척 무기를 사용했으며, 망각의 조각 효과에 적용되는 감정되지 않은 장비의 일환으로서 적용되고 있습니다.\n\n남은 턴: %s.

items.trinkets.thirteenleafclover.name=열 세 잎 클로버
items.trinkets.thirteenleafclover.desc=연금술 냄비에서 끓이다 보니 이 클로버에 새로운 잎이 무럭무럭 자라났습니다! 이 장신구가 제공하는 것이 행운인지 불운인지 가늠하기 어렵습니다. 어쩌면 이 장신구가 당신의 운을 더 혼란스럽게 만드는 것일까요?
items.trinkets.thirteenleafclover.typical_stats_desc=일반적으로 이 장신구는 최대 피해를 _%1$d%%_ 확률로, 최소 피해를 _%2$d%%_ 확률로 입힙니다.
items.trinkets.thirteenleafclover.stats_desc=이 장신구는 현재 강화 수치에서 최대 피해를 _%1$d%%_ 확률로, 최소 피해를 _%2$d%%_ 확률로 입힙니다.

items.trinkets.trapmechanism.name=함정 작동 장치
items.trinkets.trapmechanism.desc=이 던전에 있는 낭떠러지 함정 하나의 핵심 부품으로, 바닥에서 매우 조심스럽게 떼어 내어 들고 다닐 수 있게 된 것입니다. 그럼에도 던전 자체에 마력으로 귀속되어 있는 것처럼 보이며, 위험한 지형이 더 자주 등장하지만, 위험한 지형에 대한 친숙도 또한 증가합니다.
items.trinkets.trapmechanism.typical_stats_desc=일반적으로 이 장신구는 특수하지 않은 층을 _%1$d%%_ 확률로 함정 또는 낭떠러지가 가득 찬 층으로 만듭니다. 또한 _%2$d%%_ 확률로 던전의 숨겨진 함정이 자동으로 드러납니다.
items.trinkets.trapmechanism.stats_desc=이 장신구는 현재 강화 수치에서 특수하지 않은 층을 _%1$d%%_ 확률로 함정과 낭떠러지로 가득 찬 층으로 만듭니다. 또한 _%2$d%%_ 확률로 던전의 숨겨진 함정이 자동으로 드러납니다.

items.trinkets.vialofblood.name=피의 유리병
items.trinkets.vialofblood.desc=이 얇은 유리 병에는 던전 주민의 피가 담겨 있으며, 약병을 회전시키면 천천히 움직입니다. 이것이 당신에게 적용되는 치유 효과를 마법으로 강화하지만, 그 효과를 지연시키는 것 같습니다.
items.trinkets.vialofblood.typical_stats_desc=일반적으로 이 장신구는 당신이 치유 물약, 가죽 물통, 회복의 우물을 마실 때 얻는 체력의 총량을 _%1$s%%_만큼 늘립니다. 하지만 이러한 회복 효과는 더 느리게 작용하여, 매 턴마다 최대 _%2$s_의 체력을 회복합니다. (턴당 체력 최대 회복량은 영웅의 레벨에 비례합니다)
items.trinkets.vialofblood.stats_desc=이 장신구는 현재 강화 수치에서 당신이 치유 물약, 가죽 물통, 회복의 우물을 마실 때 얻는 체력의 총량을 _%1$s%%_만큼 늘립니다. 하지만 이러한 회복 효과는 더 느리게 작용하여, 매 턴마다 최대 _%2$s_의 체력을 회복합니다. (턴당 체력 최대 회복량은 영웅의 레벨에 비례합니다)

items.trinkets.wondrousresin.name=경이로운 송진
items.trinkets.wondrousresin.desc=이 반짝이는 파란색 송진은 저주받은 마법 막대의 마법의 정수를 증류한 것 같습니다. 연금술 냄비의 마법이 이 송진을 어느 정도 안정화시킨 것 같으며, 이제 당신의 마법 막대에도 영향을 미치고 있습니다.
items.trinkets.wondrousresin.typical_stats_desc=일반적으로 이 장신구는 당신이 저주받은 마법 막대를 발사할 때 _%1$s%%_ 확률로 중립 혹은 긍정적인 효과가 발사되게 만들 것이며, 저주받지 않은 마법 막대를 발사할 때에는 _%2$s%%_ 확률로 중립 혹은 긍정적인 저주 마법이 추가로 발사됩니다.\n\n이 장신구는 강화하기 위해 많은 양의 에너지가 필요합니다.
items.trinkets.wondrousresin.stats_desc=이 장신구는 현재 강화 수치에서 당신이 저주받은 마법 막대를 발사할 때 _%1$s%%_ 확률로 중립 혹은 긍정적인 효과가 발사되게 만들 것이며, 저주받지 않은 마법 막대를 발사할 때에는 _%2$s%%_ 확률로 중립 혹은 긍정적인 저주 마법이 추가로 발사됩니다.\n\n이 장신구는 강화하기 위해 많은 양의 에너지가 필요합니다.

items.trinkets.trinketcatalyst.name=마법의 촉매제
items.trinkets.trinketcatalyst.window_title=장신구를 제작하세요
items.trinkets.trinketcatalyst.window_text=당신이 촉매제를 넣자, 물이 빛나기 시작합니다. 주변에 있는 아이템들 중 에너지를 불어넣어 마법의 장신구로 만들 수 있는 아이템이 몇 가지 보입니다.
items.trinkets.trinketcatalyst.desc=이 마법의 금색 가루 뭉치는 던전의 어둠 속에서 희미하게 빛나고 있습니다. 이 촉매제는 연금술 솥에서 소량의 연금술 에너지와 결합하여 특별한 장신구를 만드는 데에 사용할 수 있습니다.\n\n장신구는 던전이나 적들에게 약간의 변화를 발생시키는 다양하고 서로 다른 효과를 제공합니다. 장신구는 더 큰 효과를 얻기 위해 강화할수록 더 많은 에너지를 소모하며, 아니면 그냥 떨어뜨려 효과를 없앨 수 있습니다.
items.trinkets.trinketcatalyst$randomtrinket.name=무작위 장신구
items.trinkets.trinketcatalyst$randomtrinket.desc=근처에 있는 아이템 하나가 열 수 없는 주머니에 갇혀 있습니다.\n\n연금술 과정을 통해 주머니를 녹일 수 있지만, 어떤 장신구를 얻을 수 있을지는 연금술을 하기 전까지는 알 수 없습니다!

items.trinkets.trinket.discover_hint=이 아이템은 연금술을 통해 장신구를 만들 때 무작위 선택제로 제시됩니다.
items.trinkets.trinket$placeholder.name=장신구

###wands
items.wands.cursedwand.ondeath=당신은 당신의 %s에 의해 죽었다.
items.wands.cursedwand.nothing=아무일도 일어나지 않았다.
items.wands.cursedwand.mass_invuln=당신의 마법 막대에서 눈부신 빛이 뿜어져 나왔다!
items.wands.cursedwand.petrify=당신은 갑자기 그 자리에서 얼어붙었다!
items.wands.cursedwand.grass=당신 주변에서 풀이 마구 자라났다!
items.wands.cursedwand.fire=뭔가 타는 냄새가 나는데...
items.wands.cursedwand.transmogrify_wand=당신의 마법 막대가 다른 종류로 변했다!
items.wands.cursedwand.transmogrify_other=당신의 아이템이 다른 것으로 변했다!
items.wands.cursedwand.disguise=눈 앞에서 당신의 외형이 변화했다!
items.wands.cursedwand.supernova=불타는 구체가 커지기 시작했다. 도망치는 것이 좋을 것 같다!
items.wands.cursedwand.supernova_positive=불타는 구체가 커지기 시작했으나, 왜인지 모르게 안전한 느낌이 든다.
items.wands.cursedwand.sinkhole=당신 주변의 바닥이 무너지고 있다!
items.wands.cursedwand.sinkhole_positive=바닥이 무너지기 시작했으나, 당신 아래만큼은 충분히 단단한 것 같다.
items.wands.cursedwand.gravity=중력이 갑자기 무작위 방향으로 끌어당기기 시작했다!
items.wands.cursedwand.gravity_positive=중력이 갑자기 무작위 방향으로 끌어당기기 시작했으나, 당신에게는 영향을 주지 않는 것 같다.
items.wands.cursedwand.gravity_end=중력 혼돈이 끝났다.

items.wands.damagewand.upgrade_stat_name_1=마법 피해량

items.wands.wand.ac_zap=발사한다
items.wands.wand.fizzles=당신의 마법 막대는 움찔할 뿐이었다. 충전 횟수가 남아 있지 않은 것 같다.
items.wands.wand.no_magic=당신의 마법 막대는 움찔할 뿐이었다. 마법 면역 상태에선 사용할 수 없다.
items.wands.wand.self_target=당신은 스스로를 겨냥할 수 없다.
items.wands.wand.identify=당신은 이제 당신의 마법 막대를 식별할 만큼 충분히 익숙해졌다.
items.wands.wand.resin_one=이 마법 막대는 신비한 송진으로 _1_ 만큼의 강화 수치를 얻었습니다.
items.wands.wand.resin_many=이 마법 막대는 신비한 송진으로 _%d_ 만큼의 강화 수치를 얻었습니다.
items.wands.wand.cursed=이 마법 막대는 저주받았습니다. 사용하면 혼란스러운 무작위 주문이 발사됩니다.
items.wands.wand.not_cursed=이 마법 막대에는 악의적인 마법이 없습니다.
items.wands.wand.curse_discover=이 %s는 저주받았다!
items.wands.wand.prompt=발사할 지점을 선택하세요
items.wands.wand$placeholder.name=마법 막대

items.wands.wandofblastwave.name=충격파의 마법 막대
items.wands.wandofblastwave.staff_name=충격파의 지팡이
items.wands.wandofblastwave.ondeath=당신은 당신이 발사한 충격파에 맞아 죽었다...
items.wands.wandofblastwave.knockback_ondeath=당신은 충돌에 휘말려 죽었다...
items.wands.wandofblastwave.desc=이 막대는 대리석의 일종으로 만들어졌으며, 금색의 테두리와 끝 부분의 둥글고 검은 보석으로 장식되어 있습니다. 손에 쥐었을때 매우 무겁게 느껴집니다.
items.wands.wandofblastwave.typical_stats_desc=이 막대는 해당 지점에 착탄해 공간을 사납게 폭발시키는 화살을 발사합니다. 충격파는 일반적으로 _%1$d-%2$d의 피해_를 입히며 해당 지점에 있는 대부분의 적들을 날려보낼 만큼 강력합니다.
items.wands.wandofblastwave.stats_desc=이 막대는 해당 지점에 착탄해 공간을 사납게 폭발시키는 화살을 발사합니다. 충격파는 _%1$d-%2$d의 피해_를 입히며 해당 지점에 있는 대부분의 적들을 날려보낼 만큼 강력합니다.
items.wands.wandofblastwave.upgrade_stat_name_2=넉백 거리
items.wands.wandofblastwave.bmage_desc=_전투 마법사_가 마비된 적을 충격파의 지팡이로 공격하면, 대상의 마비 효과를 소모해 추가 마법 피해를 입힙니다. 적 하나 당 짧은 재사용 대기 시간이 있습니다.
items.wands.wandofblastwave.eleblast_desc=충격파의 마법 막대와 융합한 지팡이의 원소 폭발은 67%의 피해를 입히고 폭발 범위 내의 모든 적들을 바깥쪽으로 밀어냅니다.

items.wands.wandofcorrosion.name=부식의 마법 막대
items.wands.wandofcorrosion.staff_name=부식의 지팡이
items.wands.wandofcorrosion.desc=이 막대는 잿빛 몸체에 끝은 밝은 주황색 보석으로 장식되어 있습니다.
items.wands.wandofcorrosion.stats_desc=이 막대는 목표 지점에 강력한 부식 가스를 발생시키는 화살을 발사합니다. 부식 가스에 갇힌 적들은 _%d 피해_부터 시작하는 점차 강해지는 지속 피해를 입습니다.
items.wands.wandofcorrosion.upgrade_stat_name_1=부식 피해량
items.wands.wandofcorrosion.upgrade_stat_name_2=가스 생성량
items.wands.wandofcorrosion.bmage_desc=_전투 마법사_가 부식의 지팡이로 적을 공격하면, 대상에게 일정 확률로 산성 점액을 부여합니다.
items.wands.wandofcorrosion.eleblast_desc=부식의 마법 막대와 융합한 지팡이의 원소 폭발은 범위 내의 모든 적에게 6의 피해부터 시작하는 부식 효과를 4턴간 부여합니다.

items.wands.wandofcorruption.name=타락의 마법 막대
items.wands.wandofcorruption.staff_name=타락의 지팡이
items.wands.wandofcorruption.already_corrupted=그 대상에게 더 영향을 줄 수 없다.
items.wands.wandofcorruption.desc=이 막대는 끝 부분에 달린 해골 모양 장식에서 알 수 있듯이 혼란스럽고 어두운 에너지를 발하고 있습니다.
items.wands.wandofcorruption.stats_desc=이 막대는 타락의 에너지를 발사하여, 적을 약화시키다가 끝내는 정신을 조종할 수 있게 합니다. 적들은 타락에 저항할 수 있지만, 약화된 적들은 훨씬 더 쉽게 타락시킬 수 있습니다.
items.wands.wandofcorruption.upgrade_stat_name_1=타락 강도
items.wands.wandofcorruption.upgrade_stat_name_2=디버프 지속 시간
items.wands.wandofcorruption.bmage_desc=_전투 마법사_가 타락의 지팡이로 적을 공격하면, 대상이 일정 확률로 광란에 빠집니다.
items.wands.wandofcorruption.eleblast_desc=타락의 마법 막대와 융합한 지팡이의 원소 폭발은 범위 내의 모든 적을 5턴간 광란 상태로 만듭니다.

items.wands.wandofdisintegration.name=붕괴의 마법 막대
items.wands.wandofdisintegration.staff_name=붕괴의 지팡이
items.wands.wandofdisintegration.desc=이 막대는 매끈한 흑요석 덩어리로 만들어졌으며, 진보라색 빛이 옆 부분을 타고 끝부분까지 이어져 있습니다. 파괴적인 에너지를 내뿜으고 있으며 그 에너지가 발사되길 기다리고 있습니다.
items.wands.wandofdisintegration.stats_desc=이 막대는 모든 장애물을 관통하는 광선을 발사합니다. 막대가 강화될수록 광선이 더 멀리까지 나갑니다. 이 막대가 발사하는 광선은 _%1$d-%2$d의 피해_를 입히며, 적과 지형을 관통할수록 더 강력해집니다.
items.wands.wandofdisintegration.upgrade_stat_name_2=최대 거리
items.wands.wandofdisintegration.bmage_desc=_전투 마법사_가 붕괴의 지팡이를 휘두를 때, 도달의 마법 무기로 공격한 것처럼 공격 범위가 증가합니다.
items.wands.wandofdisintegration.eleblast_desc=붕괴의 마법 막대와 융합한 지팡이의 원소 폭발은 100%의 피해를 입히며 벽을 관통합니다.

items.wands.wandoffireblast.name=화염 폭발의 마법 막대
items.wands.wandoffireblast.staff_name=화염 폭발의 지팡이
items.wands.wandoffireblast.desc=이 막대는 붉은 색으로 옻칠한 나뭇가지를 금색 잎으로 대강 말아서 만들었습니다. 끝 부분이 떨리고 있어 강력한 마법을 발사하길 원하는 것 같습니다.
items.wands.wandoffireblast.stats_desc=이 막대를 사용하면 방사형으로 화염 폭발을 일으킵니다. 다음 공격은 _충전량을 %1$d_ 소모하고 _%2$d-%3$d 피해_를 입힙니다. 충전량을 더 소모할수록 효과가 강력해집니다.
items.wands.wandoffireblast.upgrade_stat_name_1=1 충전량 피해량
items.wands.wandoffireblast.upgrade_stat_name_2=2 충전량 피해량
items.wands.wandoffireblast.upgrade_stat_name_3=3 충전량 피해량
items.wands.wandoffireblast.bmage_desc=_전투 마법사_가 적을 화염 폭발의 지팡이로 공격하면, 공격한 적 주변에 있는 모든 불을 소모하고 적들에게 피해를 주는 폭발을 발생시킬 확률이 있습니다! 이 확률은 공격한 적의 근처에 있는 불의 양에 따라 증가합니다.
items.wands.wandoffireblast.eleblast_desc=화염 폭발의 마법 막대와 융합한 지팡이의 원소 폭발은 100%의 피해를 입히고 문을 열며, 적과 지형에 불을 붙입니다.

items.wands.wandoffrost.name=서리의 마법 막대
items.wands.wandoffrost.staff_name=서리의 지팡이
items.wands.wandoffrost.desc=이 막대는 일종의 마법 얼음으로 만들어진 것 같습니다. 둥근 끝 부분으로 갈수록 밝게 빛이 납니다. 잡고 있으면 매우 차갑지만, 손이 얼어버리지는 않습니다.
items.wands.wandoffrost.stats_desc=이 막대는 적에게 얼어붙은 에너지를 쏘아내어, _%1$d-%2$d의 피해_를 입히고 한기를 부여합니다. 이 효과는 물에서 더 강력해집니다. 이미 한기를 느끼거나 얼어붙은 적들은 이 막대의 피해를 적게 입습니다.
items.wands.wandoffrost.upgrade_stat_name_2=한기 지속 시간
items.wands.wandoffrost.bmage_desc=_전투 마법사_가 서리의 지팡이로 냉동된 적을 공격하면, 일정 확률로 대상을 빙결시킵니다. 대상이 많이 냉동되어 있을 수록 빙결시킬 확률이 높아집니다.
items.wands.wandoffrost.eleblast_desc=서리의 마법 막대와 융합한 지팡이의 원소 폭발은 100%의 피해를 입히고, 적을 빙결시키며, 불을 끕니다.

items.wands.wandoflightning.name=번개의 마법 막대
items.wands.wandoflightning.staff_name=번개의 지팡이
items.wands.wandoflightning.ondeath=당신은 당신이 발사한 번개에 맞아 죽었다...
items.wands.wandoflightning.desc=이 막대는 쇳덩어리로 만들어져 생각보다 엄청 무겁습니다. 두 개의 지침이 끝 부분에 함께 휘어져 있으며 전류가 둘 사이에 흐르고 있습니다.
items.wands.wandoflightning.stats_desc=이 막대는 대상에게 강력한 번개를 발사하여 _%1$d-%2$d의 피해_를 입힙니다.  번개는 주변의 적들에게 튕겨나가며, 물에 서 있는 대상에게 더 잘 튕겨나갑니다. 번개는 당신에게 피해를 줄 수 있지만, 아군에게 피해를 주지 않습니다.
items.wands.wandoflightning.bmage_desc=_전투 마법사_가 적을 번개의 지팡이로 공격하면, 확률적으로 10턴 동안 전기 충전 효과를 얻습니다. 전기 충전 효과가 있는 동안은 번개 피해에 면역이 되며 연쇄 효과가 더 멀리 퍼집니다.
items.wands.wandoflightning.eleblast_desc=번개의 마법 막대와 융합한 지팡이의 원소 폭발은 100%의 피해를 입히고, 5턴간 적을 기절시키며, 물에 전기를 흐르게 합니다.
items.wands.wandoflightning$lightningcharge.name=전기 충전
items.wands.wandoflightning$lightningcharge.desc=현재 전투 마법사는 에너지로 충전된 상태이며, 가지고 있는 번개의 지팡이에 면역이 되고 지팡이로부터 나오는 번개의 연쇄 효과가 더 멀리 퍼지게 되었습니다.\n\n남은 턴: %s.

items.wands.wandoflivingearth.name=대지의 마법 막대
items.wands.wandoflivingearth.staff_name=대지의 지팡이
items.wands.wandoflivingearth.desc=이 마법 막대는 기이한 암석과 그를 감싸며 에너지를 내뿜는 노란 띠로 이루어져 있습니다. 당신이 이 마법 막대를 쥐자 암석이 약간 움직인 것처럼 보입니다. 마치 당신의 손을 느낄 수 있는 것처럼 말이죠.
items.wands.wandoflivingearth.stats_desc=이 마법 막대는 적에게 마법의 돌을 날려 보내, _%1$d-%2$d의 피해_를 줍니다. 그 직후 암석이 사용자의 주변에서 다시 결합되어, 준 피해의 일부만큼 피해를 막아내는 장갑을 형성합니다. 만약 충분한 양의 장갑이 만들어졌다면, 다음 마법 막대를 사용할 때 장갑이 암석 수호자 형태로 변형됩니다.
items.wands.wandoflivingearth.upgrade_stat_name_2=수호자 최대 체력
items.wands.wandoflivingearth.upgrade_stat_name_3=수호자 방어력
items.wands.wandoflivingearth.bmage_desc=_전투 마법사_가 대지의 지팡이로 적을 공격하면, 입힌 피해량의 일부가 암석 장갑으로 전환되어 돌아옵니다.
items.wands.wandoflivingearth.eleblast_desc=대지의 마법 막대와 융합한 지팡이의 원소 폭발은 50%의 피해를 입히며, 적중한 적 수에 비례해 활성화 된 대지의 수호자를 회복시킵니다.
items.wands.wandoflivingearth$rockarmor.name=암석 장갑
items.wands.wandoflivingearth$rockarmor.desc=마법의 돌이 당신의 몸 주위를 떠돌고 있으며, 당신이 공격받을 때 이들은 당신을 보호하려 할 것이고 당신이 받는 피해의 50%%를 경감합니다. 그러나 피해를 막아낼 때마다 암석의 일부가 떨어져 나갑니다.\n\n남아 있는 장갑의 양: %1$d.\n\n만약 충분한 양의 장갑이 쌓였다면, 다음에 대지의 마법 막대를 사용할 때 암석이 수호자의 형상으로 재결합하여 당신과 함께 전투에 참여합니다.\n\n수호자를 소환하기 위해 필요한 장갑의 양: %2$d.
items.wands.wandoflivingearth$rockarmor.desc_many=대지 수호자 또한 집단의 힘의 효과를 받고 있습니다. 남은 턴: %d.
items.wands.wandoflivingearth$earthguardian.name=대지의 수호자
items.wands.wandoflivingearth$earthguardian.desc=당신의 대지의 마법 막대로부터 생성된 암석이 뭉쳐 대지의 수호자의 형태를 이루었습니다! 이 단단한 수호자는 주변의 적들을 공격할 것이며, 이는 적들이 당신 대신 이 수호자를 공격할 수밖에 없게 만듭니다. 주변의 위협 요소들이 사라지면, 수호자는 당신 주위에서 재결합하여 다음 번에 마법 막대를 사용할 때 다시 돌아옵니다.
items.wands.wandoflivingearth$earthguardian.wand_info=수호자의 방어력은 당신의 마법 막대의 강화 수치에 비례합니다. 수호자는 현재 _%1$d-%2$d까지의 피해_를 막아낼 수 있습니다.
items.wands.wandoflivingearth$earthguardian.discover_hint=이 캐릭터는 특정한 마법 막대의 효과로 등장합니다.

items.wands.wandofmagicmissile.name=마탄의 마법 막대
items.wands.wandofmagicmissile.staff_name=마탄의 지팡이
items.wands.wandofmagicmissile.desc=이 평범해 보이는 막대는 순수한 마법 에너지를 발사합니다. 이 막대 자체는 특별한 효과를 가지진 않지만, 다른 막대에 비해 더 많은 충전량을 가지며 강화되었을 때 다른 막대들의 위력을 잠시동안 증가시킬 수 있습니다.
items.wands.wandofmagicmissile.stats_desc=이 마법 막대가 발사하는 에너지는 _%1$d-%2$d의 피해_를 입히고, 강화되어 있을 경우 가지고 있는 다른 마법 막대의 위력을 잠시 동안 증가시킵니다.
items.wands.wandofmagicmissile.bmage_desc=_전투 마법사_가 마탄의 지팡이로 적을 공격하면, 가지고 있는 모든 마법 막대와 지팡이가 충전됩니다.
items.wands.wandofmagicmissile.eleblast_desc=마탄의 마법 막대와 융합한 지팡이의 원소 폭발은 50%의 피해를 입히며, 마법사는 15턴의 충전 효과를 얻습니다.
items.wands.wandofmagicmissile.discover_hint=특정 영웅이 이 아이템을 가지고 시작합니다.
items.wands.wandofmagicmissile$magiccharge.name=마력 충전
items.wands.wandofmagicmissile$magiccharge.desc=당신의 마탄의 마법 막대가 다른 막대들에게 힘을 주어, 다음 에 시전하는 주문의 강화 레벨을 증가시킵니다.\n\n마법 막대가 +%d만큼 강화되었습니다.\n\n남은 턴: %s.

items.wands.wandofprismaticlight.name=굴절광의 마법 막대
items.wands.wandofprismaticlight.staff_name=굴절광의 지팡이
items.wands.wandofprismaticlight.desc=이 막대는 투명한 수정 덩어리로 만들어져서 마치 기다랗고 매끈한 유리처럼 보입니다. 끝부분에는 형형색색의 빛이 춤추고 있으며, 발사되기를 원하는 것 같습니다.
items.wands.wandofprismaticlight.stats_desc=이 막대는 맞은 적들에게 _%1$d-%2$d의 피해_와 실명을 주며, 던전의 어둠을 밝히고 숨겨진 지역과 함정을 드러내 주는 광선을 발사합니다. 악마와 언데드는 막대에서 발사된 빛에 태워지며 추가 피해를 입습니다.
items.wands.wandofprismaticlight.upgrade_stat_name_2=실명 확률
items.wands.wandofprismaticlight.upgrade_stat_name_3=발광 지속 시간
items.wands.wandofprismaticlight.bmage_desc=_전투 마법사_가 굴절광의 지팡이로 적을 공격하면, 대상에게 지팡이 강화 수치에 비례한 양의 불구 효과를 부여합니다.
items.wands.wandofprismaticlight.eleblast_desc=굴절광의 마법 막대와 융합한 지팡이의 원소 폭발은 67%의 피해를 입히며, 폭발 범위 내의 모든 지형을 밝히고, 적들을 5턴간 실명시킵니다.

items.wands.wandofregrowth.name=재성장의 마법 막대
items.wands.wandofregrowth.staff_name=재성장의 지팡이
items.wands.wandofregrowth.desc=이 막대는 전문적인 솜씨로 조각된 얇은 나무 줄기로 만들어졌습니다. 어린 나무처럼 밝고 생기있는 초록색이 마치 진짜 살아있는 나무 같습니다. "한 생명이 죽으면 또 다른 생명이 태어나는 법... 그리고 영원한 순환은 언제나 계속될지니!"
items.wands.wandofregrowth.stats_desc=이 막대를 사용하면 방사형으로 마법의 재성장 에너지를 발사합니다. 에너지가 지나간 곳에 잔디, 뿌리, 그리고 희귀 식물이 자라납니다. 다음에 발사할 때 _충전량을 %1$d 소모_합니다. 충전량을 더 소모할수록 범위와 효과가 증가합니다.
items.wands.wandofregrowth.degradation=이 마법 막대는 충전량을 _%d_ 소모한 후에는 식물과 높게 자란 풀을 만드는 데 실패할 수 있습니다. 레벨을 올리거나 마법 막대를 강화해 상한을 늘릴 수 있습니다.
items.wands.wandofregrowth.upgrade_stat_name_1=충전량 당 풀 생성량
items.wands.wandofregrowth.upgrade_stat_name_2=총 풀 생성 제한
items.wands.wandofregrowth.bmage_desc=_전투 마법사_가 자신이나 적이 풀 위에 있을 때 재성장의 지팡이로 적을 공격하면, 피해량에 비례한 자연의 치유 효과를 얻습니다.
items.wands.wandofregrowth.eleblast_desc=재성장의 마법 막대와 융합한 지팡이의 원소 폭발은 적을 속박시키고 폭발 범위 내에 무작위로 풀이 자라게 합니다.
items.wands.wandofregrowth$dewcatcher.name=이슬잡이풀
items.wands.wandofregrowth$dewcatcher.desc=이슬잡이풀은 속이 마법의 이슬로 채워진 신비한 식물입니다. 이슬잡이풀은 잘 보이지 않게 하려고 주변의 잡초로 위장하지만, 이슬을 머금은 주머니로 구분이 가능합니다.
items.wands.wandofregrowth$dewcatcher.discover_hint=이 식물은 특정한 마법 막대의 효과로 등장합니다.
items.wands.wandofregrowth$seedpod.name=씨앗주머니풀
items.wands.wandofregrowth$seedpod.desc=씨앗주머니풀은 자신의 씨앗보다는 다른 종류의 식물들의 씨앗을 생성하는 마법의 식물입니다. 이들은 자신의 씨앗이 없음에도 불구하고 어떻게든 그럭저럭 번식해 나갑니다.
items.wands.wandofregrowth$seedpod.discover_hint=이 식물은 특정한 마법 막대의 효과로 등장합니다.
items.wands.wandofregrowth$lotus.name=금빛 연꽃
items.wands.wandofregrowth$lotus.desc=금빛 연꽃은 신비로운 식물이며 오직 강력한 재성장의 마법 막대로만 생겨날 수 있습니다. 금빛 연꽃은 그 기운으로 모든 식물을 강화하고 효과를 향상시키지만, 시간이 지나면 에너지를 모두 소모해 죽게 됩니다.
items.wands.wandofregrowth$lotus.wand_info=이 연꽃은 재성장의 마법 막대 _+%1$d_로 만들어졌습니다. 효과 범위 내에 있는 모든 식물은 캐릭터 밑에 자라날 경우 _즉시 발동_합니다. 또한 식물들은 _%2$d%%_ 확률로 다시 씨앗을 떨어뜨릴 것이며, 특수 다트는 _내구도 소모가 %3$d%%만큼 감소_합니다.
items.wands.wandofregrowth$lotus.discover_hint=이 식물은 특정한 일정 강화 수치 이상의 마법 막대 효과로 등장합니다.

items.wands.wandoftransfusion.name=이식의 마법 막대
items.wands.wandoftransfusion.staff_name=이식의 지팡이
items.wands.wandoftransfusion.ondeath=당신은 당신이 가진 이식의 마법 막대 때문에 죽었다...
items.wands.wandoftransfusion.charged=당신의 지팡이는 적들의 생명력으로 충전되었다!
items.wands.wandoftransfusion.desc=꽤나 평범하게 생긴 막대로써, 자주색 몸통 끝에 달린 칠흑색 보석이 돋보입니다.
items.wands.wandoftransfusion.stats_desc=아군이나 매혹된 적에게 사용할 경우, 이 마법 막대는 _사용자의 체력을 %1$d만큼_ 흡수하여 대상의 체력을  _%2$d만큼_ 회복하거나 방어막을 씌웁니다. 적에게 사용할 경우, 대상을 잠시 동안 매혹시키고 사용자에게  _%3$d만큼의 방어막_을 씌웁니다. 언데드 적은 매혹되는 대신 _%4$d-%5$d만큼의 피해_를 입습니다.
items.wands.wandoftransfusion.upgrade_stat_name_1=아군 회복량
items.wands.wandoftransfusion.upgrade_stat_name_2=방어막 생성량
items.wands.wandoftransfusion.upgrade_stat_name_3=언데드 피해량
items.wands.wandoftransfusion.bmage_desc=_전투 마법사_가 매혹된 적을 이식의 지팡이로 공격하면, 추가 방어막을 얻고 다음 지팡이의 마법을 발사할 때 체력을 소모하지 않습니다.
items.wands.wandoftransfusion.eleblast_desc=이식의 마법 막대와 융합한 지팡이의 원소 폭발은 적을 매혹시키고 아군은 치료하며, 언데드인 적에게는 100%의 피해를 입힙니다.

items.wands.wandofwarding.name=수호의 마법 막대
items.wands.wandofwarding.staff_name=수호의 지팡이
items.wands.wandofwarding.no_more_wards=당신의 마법 막대는 더 이상의 수호석을 유지할 수 없다.
items.wands.wandofwarding.bad_location=그곳에 수호석을 소환할 수 없다.
items.wands.wandofwarding.desc=이 짧은 금속질의 마법 막대의 끝 부분 위에는 밝은 보라색 보석이 떠 있습니다.
items.wands.wandofwarding.stats_desc=이 마법 막대는 적에게 직접 피해를 입히는 대신, 고정된 수호석과 감시탑을 소환합니다. 감시탑은 벽 너머를 포함한 시야가 닿는 모든 곳에 설치가 가능합니다. 이 마법 막대는 한 번에 _%d만큼의 수호석 에너지_를 유지할 수 있습니다.
items.wands.wandofwarding.upgrade_stat_name_1=수호석 피해량
items.wands.wandofwarding.upgrade_stat_name_2=수호석 에너지
items.wands.wandofwarding.bmage_desc=_전투 마법사_가 적을 수호의 지팡이로 공격하면, 활성화된 모든 수호석과 감시탑의 체력이 일정 확률로 회복됩니다.
items.wands.wandofwarding.eleblast_desc=수호의 마법 막대와 융합한 지팡이의 원소 폭발은 폭발 범위 내에 있는 모든 수호석과 감시탑의 체력을 회복시킵니다.
items.wands.wandofwarding$ward.desc_generic_ward=이 수호석은 시야 내에 들어온 적에게 자동으로 공격을 가합니다.\n\n이 수호석에 수호의 마법 막대를 발사할 경우 수호석이 강화됩니다.\n\n수호석은 사라지기 전까지 제한된 횟수의 공격이 가능합니다.
items.wands.wandofwarding$ward.desc_generic_sentry=이 감시탑은 수호석과 같은 화력을 가지고 있지만, 정해진 공격 횟수 제한이 없는 대신 공격에 체력을 사용합니다. 수호석 끝에 있는 보석과 비슷한 모양을 하고 있습니다.\n\n이 감시탑에 수호의 마법 막대를 발사할 경우 감시탑이 강화되며 체력을 회복합니다.\n\n이 감시탑은 적을 공격할 때 약간의 체력을 사용하지만, 수호의 마법 막대를 사용하는 것으로 체력을 회복시킬 수 있습니다.
items.wands.wandofwarding$ward.name_1=하급 수호석
items.wands.wandofwarding$ward.desc_1=이 기본적인 수호석은 시야 내에 들어온 적에게 자동으로 공격을 가하여, _%1$d-%2$d_의 피해를 줍니다.\n\n이 수호석을 대상으로 수호의 마법 막대를 사용하면 수호석을 강화합니다.\n\n이 수호석은 사라지기 전까지 적을 단 한 번만 공격할 수 있습니다.\n\n당신의 수호의 마법 막대가 이 수호석을 유지하기 위해 _%3$d 만큼의 수호석 에너지_를 사용하고 있습니다.
items.wands.wandofwarding$ward.name_2=수호석
items.wands.wandofwarding$ward.desc_2=이 강화된 수호석은 더 복잡한 무늬를 띄고 있으며, 여러 번 공격할 수 있습니다. 이 수호석으로부터 나가는 각 공격은 _%1$d-%2$d_의 피해를 줍니다.\n\n이 수호석을 대상으로 수호의 마법 막대를 사용하면 수호석을 강화합니다.\n\n이 수호석은 사라지기 전까지 적을 세 번 공격할 수 있습니다.\n\n당신의 수호의 마법 막대가 이 수호석을 유지하기 위해 _%3$d 만큼의 수호석 에너지_를 사용하고 있습니다.
items.wands.wandofwarding$ward.name_3=상급 수호석
items.wands.wandofwarding$ward.desc_3=완전히 강화된 수호석은 이전의 수호석들보다 더 많이 공격할 수 있습니다. 이 수호석으로부터 나가는 각 공격은 _%1$d-%2$d_의 피해를 줍니다.\n\n이 수호석을 대상으로 수호의 마법 막대를 사용하면 수호석을 강화합니다.\n\n이 수호석은 사라지기 전까지 적을 다섯 번 공격할 수 있습니다.\n\n당신의 수호의 마법 막대가 이 수호석을 유지하기 위해 _%3$d 만큼의 수호석 에너지_를 사용하고 있습니다.
items.wands.wandofwarding$ward.name_4=하급 감시탑
items.wands.wandofwarding$ward.desc_4=이 작은 감시탑은 수호의 마법 막대 끝에 달린 보석과 비슷하게 생겼습니다. 상급 수호석과 동일한 공격력을 갖지만, 공격 횟수의 제한이 없고 대신 체력을 가집니다. 감시탑의 공격은 _%1$d-%2$d_의 피해를 줍니다.\n\n감시탑을 대상으로 수호의 마법 막대를 사용하면 감시탑을 강화하고 동시에 체력을 회복합니다.\n\n감시탑은 적을 공격할 때마다 약간의 체력을 소비하지만, 감시탑에 수호의 마법 막대를 사용하는 것으로 체력을 회복시킬 수 있습니다.\n\n당신의 수호의 마법 막대가 이 감시탑을 유지하기 위해 _%3$d 만큼의 수호석 에너지_를 사용하고 있습니다.
items.wands.wandofwarding$ward.name_5=감시탑
items.wands.wandofwarding$ward.desc_5=이 강화된 감시탑은 하급 감시탑보다 크기가 더 크고 내구력이 높습니다. 감시탑의 각 공격은 _%1$d-%2$d_의 피해를 줍니다.\n\n이 감시탑을 대상으로 수호의 마법 막대를 사용하면 감시탑을 강화하고 동시에 체력을 회복합니다.\n\n감시탑은 적을 공격할 때마다 약간의 체력을 소비하지만, 감시탑에 수호의 마법 막대를 사용하는 것으로 체력을 회복할 수 있습니다.\n\n당신의 수호의 마법 막대가 이 감시탑을 유지하기 위해 _%3$d 만큼의 수호석 에너지_를 사용하고 있습니다.
items.wands.wandofwarding$ward.name_6=상급 감시탑
items.wands.wandofwarding$ward.desc_6=완전히 강화된 감시탑은 이전에 비해 훨씬 더 내구성이 좋습니다. 이 감시탑으로부터 나가는 각 공격은 _%1$d-%2$d_의 피해를 줍니다.\n\n이 감시탑을 대상으로 수호의 마법 막대를 사용하면 감시탑의 체력을 회복시킵니다.\n\n이 감시탑은 적을 공격할 때마다 약간의 체력을 소비하지만, 감시탑에 수호의 마법 막대를 사용하는 것으로 체력을 회복시킬 수 있습니다.\n\n당신의 수호의 마법 막대가 이 감시탑을 유지하기 위해 _%3$d 만큼의 수호석 에너지_를 사용하고 있습니다.
items.wands.wandofwarding$ward.discover_hint=이 캐릭터는 특정한 마법 막대의 효과로 등장합니다.
items.wands.wandofwarding$ward.dismiss_title=이 수호석을 해체하겠습니까?
items.wands.wandofwarding$ward.dismiss_body=당신은 수호석을 더 이상 유지할 필요가 없다고 생각할 경우 이 수호석을 해체할 수 있습니다. 이 행동을 하면 즉시 수호석을 파괴합니다.\n\n수호석을 해체하시겠습니까?
items.wands.wandofwarding$ward.dismiss_confirm=예
items.wands.wandofwarding$ward.dismiss_cancel=아니오

###weapon curses
items.weapon.curses.annoying.name=짜증나는 %s
items.weapon.curses.annoying.msg_1="우리 지금 싸우는거 맞지!?"
items.weapon.curses.annoying.msg_2="좋아, 박살내버려!"
items.weapon.curses.annoying.msg_3="이봐, 여기야!"
items.weapon.curses.annoying.msg_4="보스는 아직이야!?"
items.weapon.curses.annoying.msg_5="아야, 그렇게 세게 휘두르지 말라고!"
items.weapon.curses.annoying.msg_6="죽어라, 벌레야!"
items.weapon.curses.annoying.msg_7="이야호오!!!!!"
items.weapon.curses.annoying.msg_8="잠깐 쉬었다 해도 될까!?"
items.weapon.curses.annoying.msg_9="빵! 하하하!"
items.weapon.curses.annoying.msg_10="잘 후려쳤군!"
items.weapon.curses.annoying.msg_11="난 싸우고 싶지 않아, 원래 난 나무꾼의 도끼여야 했다고!"
items.weapon.curses.annoying.msg_12="자만심은 느리지만 교활한 암살자라는 것을 항상 명심하게나."
items.weapon.curses.annoying.msg_13="모든 너 기지 다 내꺼다요!"
items.weapon.curses.annoying.desc=짜증나는 무기는 말을 할 수 있습니다만 너무 시끄럽습니다. 이 소리는 원치 않게 적들의 주의를 끌 수 도 있습니다.
items.weapon.curses.annoying.elestrike_desc=짜증나는 저주가 부여된 원소 해방은 범위 내에 있는 적에게 6턴의 광란을 각각 20% 확률로 부여합니다.

items.weapon.curses.dazzling.name=눈부신 %s
items.weapon.curses.dazzling.desc=눈부신 무기는 가끔씩 눈부신 섬광을 발하여 무기를 바라본 모든 대상을 실명시킵니다.
items.weapon.curses.dazzling.elestrike_desc=눈부신 저주가 부여된 원소 해방은 범위 내에 있는 적에게 6턴의 실명을 각각 50% 확률로 부여합니다.

items.weapon.curses.displacing.name=변위의 %s
items.weapon.curses.displacing.desc=변위의 무기는 혼돈스러운 공간이동 마법이 깃들어 있습니다. 이따금 상대를 현재 층의 무작위 위치로 보내버립니다.
items.weapon.curses.displacing.elestrike_desc=변위의 저주가 부여된 원소 해방은 범위 내에 있는 적들을 각각 50% 확률로 공간이동시킵니다.

items.weapon.curses.explosive.name=폭발적인 %s
items.weapon.curses.explosive.warm=따뜻하군...
items.weapon.curses.explosive.hot=뜨겁다!
items.weapon.curses.explosive.desc=폭발적인 무기는 천천히 에너지를 모아 결국은 폭발하며, 주변에 있는 모든 것에 피해를 줍니다.
items.weapon.curses.explosive.desc_cool=이 무기는 아직 뜨겁지 않습니다.
items.weapon.curses.explosive.desc_warm=이 무기는 에너지를 모아 뜨거워지고 있습니다...
items.weapon.curses.explosive.desc_hot=무기가 뜨겁습니다! 머지않아 폭발할 겁니다!
items.weapon.curses.explosive.elestrike_desc=폭발적인 저주가 부여된 원소 해방은 50% 확률로 범위 내에 있는 적들 중 하나에게서 폭발을 일으킵니다.

items.weapon.curses.friendly.name=친화적인 %s
items.weapon.curses.friendly.desc=친화적인 무기는 평화 주의자들에게 가장 적합하며, 때로는 전투를 불가능하게 만드는 마법을 유발하기도 합니다.
items.weapon.curses.friendly.elestrike_desc=친화적인 저주가 부여된 원소 해방은 범위 내에 있는 적에게 6턴의 매혹을 각각 50% 확률로 부여합니다.

items.weapon.curses.polarized.name=양극화의 %s
items.weapon.curses.polarized.desc=양극화된 무기는 공격력이 마법의 영향을 받아, 50% 더 많은 피해를 입히거나, 아무런 피해도 입히지 않습니다.
items.weapon.curses.polarized.elestrike_desc=양극화의 저주가 부여된 원소 해방은 범위 내에 있는 적들에게 각각 50% 확률로 24-36의 피해를 입힙니다.

items.weapon.curses.sacrificial.name=희생의 %s
items.weapon.curses.sacrificial.desc=희생의 무기는 적을 공격하는 것을 댓가로 사용자에게 피를 갈구합니다. 더욱 건강한 사용자일수록 더 많은 피를 가져갑니다.
items.weapon.curses.sacrificial.elestrike_desc=희생의 저주가 부여된 원소 해방은 범위 내에 있는 모든 적과 영웅에게 12HP의 출혈을 부여합니다.

items.weapon.curses.wayward.name=혼잡한 %s
items.weapon.curses.wayward.desc=혼잡한 무기는 때때로 공격을 맞히기 매우 어려워집니다. 이 효과는 발동한 후 꽤 오래 지속되지만, 어떻게든 혼잡한 무기로 공격을 명중하면 효과가 해제됩니다.
items.weapon.curses.wayward.elestrike_desc=혼잡한 저주가 부여된 원소 해방은 범위 내에 있는 적에게 6턴의 주술에 걸림을 각각 50% 확률로 부여합니다.
items.weapon.curses.wayward$waywardbuff.name=혼잡함
items.weapon.curses.wayward$waywardbuff.desc=혼잡한 무기의 마법이 발동하여, 잠시 동안 공격을 명중하기 매우 어려워집니다. 하지만 기습 공격 등 반드시 적중하는 공격엔 영향을 주지 않습니다. 혼잡한 무기로 공격을 명중하면 효과가 즉시 종료됩니다.\n\n효과 종료까지 %s 턴 남았습니다.

###enchantments
items.weapon.enchantments.blazing.name=불타는 %s
items.weapon.enchantments.blazing.desc=이 마법은 무기에서 화염을 내뿜어 적을 불태우고, 이미 불타는 적에게 추가 피해를 줍니다.
items.weapon.enchantments.blazing.elestrike_desc=불타는 마법이 부여된 원소 해방은 범위 전체에 8턴 동안 지속되는 불을 흩뿌립니다.

items.weapon.enchantments.blocking.name=방어의 %s
items.weapon.enchantments.blocking.desc=방어의 무기는 공격할 때마다 간혹 당신에게 잠시 유지되는 방어막을 씌워줍니다.
items.weapon.enchantments.blocking.elestrike_desc=방어의 마법이 부여된 원소 해방은 범위 내에 있는 적 하나 당 6의 추가 방어막을 영웅에게 부여합니다.
items.weapon.enchantments.blocking$blockbuff.name=방어의
items.weapon.enchantments.blocking$blockbuff.desc=당신의 무기에 깃든 방어의 마법이 잠시동안 당신의 방어 능력을 증가시켰습니다!\n\n남은 방어막: %d\n\n효과가 끝나기까지 %s 턴 남았습니다.

items.weapon.enchantments.blooming.name=생장의 %s
items.weapon.enchantments.blooming.desc=생장의 무기는 맞은 대상이나 그 주변에 식물이 자라나게 하는 마법의 힘을 담고 있습니다.
items.weapon.enchantments.blooming.elestrike_desc=생장의 마법이 부여된 원소 해방은 최대 8타일까지 잔디를 흩뿌리며, 범위 내에 있는 모든 적들을 6턴 동안 속박시킵니다.

items.weapon.enchantments.chilling.name=차가운 %s
items.weapon.enchantments.chilling.desc=이 무기에 맞은 적은 냉동되어 움직임과 공격이 느려집니다.
items.weapon.enchantments.chilling.elestrike_desc=차가운 마법이 부여된 원소 해방은 범위 전체에 8턴 동안 지속되는 냉기를 흩뿌립니다.

items.weapon.enchantments.kinetic.name=관성의 %s
items.weapon.enchantments.kinetic.desc=관성의 무기로 적을 처치하면, 남은 힘이 무기에 보관되어 다음 공격이 명중할 때 추가 피해를 줍니다.
items.weapon.enchantments.kinetic.elestrike_desc=관성의 마법이 부여된 원소 해방은 직접 공격하는 대상을 제외하고 범위 전체에 있는 모든 적에게 저장된 피해의 40%만큼의 피해를 입힙니다.
items.weapon.enchantments.kinetic$conserveddamage.name=저장된 피해
items.weapon.enchantments.kinetic$conserveddamage.desc=당신의 무기가 결정타를 가하고 남은 피해를 보관했으며, 이 피해는 다음 공격에 추가 피해로 들어갑니다. 그러나 이 에너지는 시간이 지남에 따라 서서히 감소합니다.\n\n저장된 피해량: %d.

items.weapon.enchantments.corrupting.name=타락의 %s
items.weapon.enchantments.corrupting.desc=이 강력한 마법은 적들을 당신의 의지대로 부릴 수 있게 하는 능력을 담고 있습니다. 이 마법이 깃든 무기로 적을 처치하면, 대상이 죽는 대신 타락할 확률이 존재합니다.
items.weapon.enchantments.corrupting.elestrike_desc=타락의 마법이 부여된 원소 해방은 직접 공격하는 대상을 제외하고 범위 내에 있는 적들에게 각각 5-25%의 확률(적이 잃은 체력에 비례)로 타락을 부여합니다.

items.weapon.enchantments.elastic.name=탄성의 %s
items.weapon.enchantments.elastic.desc=탄성의 무기는 일정 확률로 적을 뒤쪽으로 짧게 밀쳐냅니다.
items.weapon.enchantments.elastic.elestrike_desc=탄성의 마법이 부여된 원소 해방은 범위 내에 있는 모든 적들을 5타일 밀쳐냅니다.

items.weapon.enchantments.grim.name=음침한 %s
items.weapon.enchantments.grim.desc=이 강력한 마법 무기는 적을 단번에 처치할 힘을 가지고 있습니다. 적이 약해질수록 단번에 처치할 확률이 증가합니다.
items.weapon.enchantments.grim.elestrike_desc=음침한 마법이 부여된 원소 해방은 직접 공격하는 대상을 제외하고 범위 내에 있는 적들을 각각 6-30%의 확률(적이 잃은 체력에 비례)로 처치합니다.

items.weapon.enchantments.lucky.name=행운의 %s
items.weapon.enchantments.lucky.desc=행운의 무기에 죽은 적은 일정 확률로 또 다른 전리품을 떨어뜨릴 수 있습니다.
items.weapon.enchantments.lucky.elestrike_desc=행운의 마법이 부여된 원소 해방은 범위 내에 있는 적들의 밑에 각각 12.5% 확률로 전리품을 떨어뜨리게 만듭니다. 이 효과는 적 하나 당 한 번밖에 발동하지 않습니다.

items.weapon.enchantments.projecting.name=도달의 %s
items.weapon.enchantments.projecting.desc=이 마법은 근접 무기에 추가 공격 범위를 부여합니다. 원거리 무기의 경우 근처 적을 목표로 할 때 벽을 관통하여 공격할 수 있습니다.
items.weapon.enchantments.projecting.elestrike_desc=도달의 마법이 부여된 원소 해방은 직접 공격하는 대상을 제외하고 범위 전체에 있는 모든 적에게 30%만큼의 피해를 입힙니다.

items.weapon.enchantments.shocking.name=짜릿한 %s
items.weapon.enchantments.shocking.desc=짜릿한 무기에서 나오는 연쇄 번개가 근처의 모든 적에게 추가 피해를 입힙니다.
items.weapon.enchantments.shocking.elestrike_desc=짜릿한 마법이 부여된 원소 해방은 범위 전체에 8턴 동안 지속되는 전류를 흩뿌립니다.

items.weapon.enchantments.unstable.name=불안정한 %s
items.weapon.enchantments.unstable.desc=이 무기는 혼돈의 마법이 걸려 있습니다. 공격을 맞힐 때마다 무작위의 효과를 입힙니다.
items.weapon.enchantments.unstable.elestrike_desc=불안정한 마법이 부여된 원소 해방은 직접 공격하는 대상을 제외하고 범위 전체에 있는 모든 적에게 무작위 마법 효과를 발동시킵니다.

items.weapon.enchantments.vampiric.name=흡혈의 %s
items.weapon.enchantments.vampiric.desc=이 강력한 마법부여는 맞은 대상의 생명력을 흡수하여 착용자에게로 전해 줍니다. 이 효과는 착용자의 체력이 적을수록 강력해집니다.
items.weapon.enchantments.vampiric.elestrike_desc=흡혈의 마법이 부여된 원소 해방은 범위 내에 있는 적 하나 당 영웅이 2.5의 체력을 회복합니다.


###melee weapons
items.weapon.melee.assassinsblade.name=암살자의 칼
items.weapon.melee.assassinsblade.stats_desc=이 무기는 무방비 상태의 적에게 더 강합니다.
items.weapon.melee.assassinsblade.ability_name=조용한 발걸음
items.weapon.melee.assassinsblade.typical_ability_desc=암살자의 칼을 가진 결투자는 _조용한 발걸음_을 사용할 수 있습니다. 이 능력을 사용하면 주변 3타일까지 즉시 점멸이 가능하며 일반적으로 _%d턴의 투명화_를 얻습니다.
items.weapon.melee.assassinsblade.ability_desc=암살자의 칼을 가진 결투자는 _조용한 발걸음_을 사용할 수 있습니다. 이 능력을 사용하면 주변 3타일까지 즉시 점멸이 가능하며 _%d턴의 투명화_를 얻습니다.
items.weapon.melee.assassinsblade.upgrade_ability_stat_name=능력 지속 시간
items.weapon.melee.assassinsblade.desc=흑요석으로 만들어진 작은 물결모양 칼입니다. 가볍지만 다루기 어려우며, 그만큼 제대로 적중하면 치명적입니다.

items.weapon.melee.battleaxe.name=전투 도끼
items.weapon.melee.battleaxe.stats_desc=이 무기는 다른 무기보다 정확합니다.
items.weapon.melee.battleaxe.ability_name=강타
items.weapon.melee.battleaxe.typical_ability_desc=전투 도끼를 가진 결투자는 _강타_를 사용할 수 있습니다. 이 집중적인 공격으로 적을 기습 공격했다면 일반적으로 _%1$d-%2$d_의 피해를 입히고, 또한 해당 적에게 5턴의 멍해짐 상태를 부여하여 정확성과 회피를 50%% 감소시킵니다. 강타는 항상 명중하지만, 기습 공격이 아닐 경우 일반적인 피해만 입힙니다.
items.weapon.melee.battleaxe.ability_desc=전투 도끼를 가진 결투자는 _강타_를 사용할 수 있습니다. 이 집중적인 공격으로 적을 기습 공격했다면 _%1$d-%2$d_의 피해를 입히고, 또한 해당 적에게 5턴의 멍해짐 상태를 부여하여 정확성과 회피를 50%% 감소시킵니다. 강타는 항상 명중하지만, 기습 공격이 아닐 경우 일반적인 피해만 입힙니다.
items.weapon.melee.battleaxe.desc=이 전투 도끼의 거대한 강철 도끼날은 매 공격마다 상당한 무게감을 줍니다.

items.weapon.melee.crossbow.name=쇠뇌
items.weapon.melee.crossbow.typical_stats_desc=이 무기는 일반적으로 장착 중에 투척용 다트의 피해량을 _%1$d-%2$d_로 늘리며, 부여된 마법을 투척용 다트에 적용시킵니다.
items.weapon.melee.crossbow.stats_desc=이 무기는 장착 중에 투척용 다트의 피해량을 _%1$d-%2$d_로 늘리며, 부여된 마법을 투척용 다트에 적용시킵니다.
items.weapon.melee.crossbow.ability_name=충전 사격
items.weapon.melee.crossbow.typical_ability_desc=쇠뇌를 지닌 결투자는 _충전_을 사용할 수 있으며, 이후 가하는 일반적인 공격을 항상 명중시키며 다음 세 효과 중 하나를 적용합니다. 근접 공격은 적을 밀쳐내고, 일반 다트는 일반적으로 _+%1$d_ 피해를 입히며, 특수 다트는 7x7 범위 내에 효과를 적용하며 일반적으로 _%2$d회_ 더 많이 사용할 수 있게 됩니다.
items.weapon.melee.crossbow.ability_desc=쇠뇌를 지닌 결투자는 _충전_을 사용할 수 있으며, 이후 가하는 일반적인 공격을 항상 명중시키며 다음 세 효과 중 하나를 적용합니다. 근접 공격은 적을 밀쳐내고, 일반 다트는 _+%1$d_ 피해를 입히며, 특수 다트는 7x7 범위 내에 효과를 적용하며 _%2$d회_ 더 많이 사용할 수 있게 됩니다.
items.weapon.melee.crossbow.desc=이 복잡한 구조의 무기는 화살을 매우 빠른 속도로 발사할 수 있습니다. 그리 권장되지는 않지만, 쇠뇌의 무겁고 단단한 부분 덕분에 근접 무기로도 그럭저럭 활용할 수 있습니다.
items.weapon.melee.crossbow.upgrade_ability_stat_name=능력 증가량
items.weapon.melee.crossbow$chargedshot.name=충전됨
items.weapon.melee.crossbow$chargedshot.desc=결투자는 쇠뇌에 온 힘을 집중시키고 있습니다. 다음에 가하는 공격이 반드시 명중하며 다음 세 효과 중 하나가 적용됩니다.\n- 근접 공격은 적을 몇 타일 밀쳐냅니다.\n- 일반 다트는 추가 피해를 입힙니다.\n- 특수 다트는 사용 횟수가 증가하며 7x7 범위 내에 효과를 적용합니다. 긍정적인 효과의 다트는 동료에게만 적용되며, 부정적인 효과의 다트는 적들에게만 적용됩니다. 결투자는 이 능력으로 다트의 효과를 자신에게 적용할 수 없습니다.

items.weapon.melee.cudgel.name=곤봉
items.weapon.melee.cudgel.stats_desc=이 무기는 다른 무기보다 정확합니다.
items.weapon.melee.cudgel.ability_name=강타
items.weapon.melee.cudgel.typical_ability_desc=곤봉을 가진 결투자는 _강타_를 사용할 수 있습니다. 이 집중적인 공격으로 적을 기습 공격했다면 일반적으로 _%1$d-%2$d_의 피해를 입히고, 또한 해당 적에게 5턴의 멍해짐 상태를 부여하여 정확성과 회피를 50%% 감소시킵니다. 강타는 항상 명중하지만, 기습 공격이 아닐 경우 일반적인 피해만 입힙니다.
items.weapon.melee.cudgel.ability_desc=곤봉을 가진 결투자는 _강타_를 사용할 수 있습니다. 이 집중적인 공격으로 적을 기습 공격했다면 일반적으로 _%1$d-%2$d_의 피해를 입히고, 또한 해당 적에게 5턴의 멍해짐 상태를 부여하여 정확성과 회피를 50%% 감소시킵니다. 강타는 항상 명중하지만, 기습 공격이 아닐 경우 일반적인 피해만 입힙니다.
items.weapon.melee.cudgel.desc=소형 황동 메이스입니다. 본격적인 여행용 무기보다는 귀족들의 호신용 물품에 가깝습니다.
items.weapon.melee.cudgel.discover_hint=특정 영웅이 이 아이템을 가지고 시작합니다.

items.weapon.melee.dagger.name=단검
items.weapon.melee.dagger.stats_desc=이 무기는 무방비 상태의 적에게 더 강합니다.
items.weapon.melee.dagger.ability_name=조용한 발걸음
items.weapon.melee.dagger.typical_ability_desc=대거를 가진 결투자는 _조용한 발걸음_을 사용할 수 있습니다. 이 능력을 사용하면 주변 5타일까지 즉시 점멸이 가능하며 일반적으로 _%d턴의 투명화_를 얻습니다.
items.weapon.melee.dagger.ability_desc=대거를 가진 결투자는 _조용한 발걸음_을 사용할 수 있습니다. 이 능력을 사용하면 주변 5타일까지 즉시 점멸이 가능하며 _%d턴의 투명화_를 얻습니다.
items.weapon.melee.dagger.upgrade_ability_stat_name=능력 지속 시간
items.weapon.melee.dagger.desc=적당히 닳은 나무 손잡이가 있는 간단한 무쇠 단검입니다.
items.weapon.melee.dagger.discover_hint=특정 영웅이 이 아이템을 가지고 시작합니다.

items.weapon.melee.dirk.name=더크
items.weapon.melee.dirk.stats_desc=이 무기는 무방비 상태의 적에게 더 강합니다.
items.weapon.melee.dirk.ability_name=조용한 발걸음
items.weapon.melee.dirk.typical_ability_desc=더크를 가진 결투자는 _조용한 발걸음_을 사용할 수 있습니다. 이 능력을 사용하면 주변 4타일까지 즉시 점멸이 가능하며 일반적으로 _%d턴의 투명화_를 얻습니다.
items.weapon.melee.dirk.ability_desc=더크를 가진 결투자는 _조용한 발걸음_을 사용할 수 있습니다. 이 능력을 사용하면 주변 4타일까지 즉시 점멸이 가능하며 _%d턴의 투명화_를 얻습니다.
items.weapon.melee.dirk.upgrade_ability_stat_name=능력 지속 시간
items.weapon.melee.dirk.desc=더 기다란 찌르기용 단검으로, 칼날을 적에게 더 깊숙이 박아 넣을 수 있도록 되어 있습니다.

items.weapon.melee.flail.name=철퇴
items.weapon.melee.flail.stats_desc=이 무기는 정확성이 조금 떨어집니다.\n기습 공격을 할 수 없습니다.
items.weapon.melee.flail.ability_name=돌리기
items.weapon.melee.flail.spin_warn=철퇴를 이 이상 돌릴 수는 없다.
items.weapon.melee.flail.typical_ability_desc=철퇴를 가진 결투자는 철퇴를 _회전_시켜 짧은 시간 동안 힘을 모을 수 있습니다. 철퇴를 1턴 회전할 때마다 일반적으로 다음 공격이 _+%d_의 추가 피해량을 얻으며, 최대 3회 회전시킬 수 있습니다. 회전 중인 철퇴 공격은 반드시 명중합니다. 철퇴를 회전시키기 시작할 때에만 충전량을 소모합니다.
items.weapon.melee.flail.ability_desc=철퇴를 가진 결투자는 철퇴를 _회전_시켜 짧은 시간 동안 힘을 모을 수 있습니다. 철퇴를 1턴 회전할 때마다 다음 공격이 _+%d_의 추가 피해량을 얻으며, 최대 3회 회전시킬 수 있습니다. 회전 중인 철퇴 공격은 반드시 명중합니다. 철퇴를 회전시키기 시작할 때에만 충전량을 소모합니다.
items.weapon.melee.flail.desc=가시 박힌 공이 손잡이에 달린 사슬 끝에 달려 있습니다. 다루기 까다롭지만, 제대로 맞으면 파괴적입니다.
items.weapon.melee.flail$spinabilitytracker.name=회전 중
items.weapon.melee.flail$spinabilitytracker.desc=결투자가 철퇴를 빙빙 돌리고 있으며, 다음 공격을 위해 힘을 모으고 있습니다. 매 턴 회전시킬 때마다 1턴을 소모하지만, 추가 피해량을 얻으며 세 번까지 돌릴 수 있습니다. 또한 회전하는 중에 가하는 일반적인 철퇴 공격은 반드시 명중합니다.\n\n현재 추가 피해량: %1$d%%.\n남은 턴: %2$s.

items.weapon.melee.gauntlet.name=돌 건틀릿
items.weapon.melee.gauntlet.stats_desc=이 무기는 매우 빠르게 공격할 수 있습니다.
items.weapon.melee.gauntlet.ability_name=연속 타격
items.weapon.melee.gauntlet.typical_ability_desc=돌 건틀릿을 가진 결투자는 _연속 타격_을 사용할 수 있습니다. 이 공격은 반드시 적중하며, 일반적인 투척 공격 혹은 근접 공격이 명중한 횟수 당 _+%d_의 추가 피해를 줍니다. 5턴 동안 공격을 하지 않으면 연속 타격이 초기화됩니다.
items.weapon.melee.gauntlet.ability_desc=돌 건틀릿을 가진 결투자는 _연속 타격_을 사용할 수 있습니다. 이 공격은 반드시 적중하며, 일반적인 투척 공격 혹은 근접 공격이 명중한 횟수 당 _+%d_의 추가 피해를 줍니다. 5턴 동안 공격을 하지 않으면 연속 타격이 초기화됩니다.
items.weapon.melee.gauntlet.desc=이 무거운 건틀릿은 무거운 마법석으로 덮인 붉은색 천으로 만들어졌습니다. 천이 손을 제대로 감싸며 무거운 마법석이 마치 몸의 일부인 것 처럼 느껴집니다. 이 무거운 무기를 휘두르는데는 큰 힘이 필요하지만, 그만큼의 큰 타격을 보장합니다.

items.weapon.melee.glaive.name=글레이브
items.weapon.melee.glaive.stats_desc=이 무기는 다른 무기들보다 느립니다.\n이 무기는 떨어진 적을 공격할 수 있습니다.
items.weapon.melee.glaive.ability_name=찌르기
items.weapon.melee.glaive.typical_ability_desc=결투자는 글레이브의 끝 부분을 사용해 공격 범위 내에 있는 근접해 있지 않은 적에게 _찌르기_를 사용할 수 있습니다. 이 공격은 일반적으로 _%1$d-%2$d 의 피해_를 입히고, 적을 뒤로 밀쳐내며, 반드시 명중합니다.
items.weapon.melee.glaive.ability_desc=결투자는 글레이브의 끝 부분을 사용해 공격 범위 내에 있는 근접해 있지 않은 적에게 _찌르기_를 사용할 수 있습니다. 이 공격은 _%1$d-%2$d 의 피해_를 입히고, 적을 뒤로 밀쳐내며, 반드시 명중합니다.
items.weapon.melee.glaive.desc=기다란 봉 끝에 달린 칼날로 이루어진 거대한 냉병기입니다.

items.weapon.melee.gloves.name=징 박힌 장갑
items.weapon.melee.gloves.stats_desc=이 무기는 매우 빠르게 공격할 수 있습니다.
items.weapon.melee.gloves.ability_name=연속 타격
items.weapon.melee.gloves.typical_ability_desc=징 박힌 장갑을 가진 결투자는 _연속 타격_을 사용할 수 있습니다. 이 공격은 반드시 적중하며, 일반적인 투척 공격 혹은 근접 공격이 명중한 횟수 당 _+%d_의 추가 피해를 줍니다. 5턴 동안 공격을 하지 않으면 연속 타격이 초기화됩니다.
items.weapon.melee.gloves.ability_desc=징 박힌 장갑을 가진 결투자는 _연속 타격_을 사용할 수 있습니다. 이 공격은 반드시 적중하며, 일반적인 투척 공격 혹은 근접 공격이 명중한 횟수 당 _+%d_의 추가 피해를 줍니다. 5턴 동안 공격을 하지 않으면 연속 타격이 초기화됩니다.
items.weapon.melee.gloves.desc=이 징 박힌 장갑은 실질적인 보호를 제공하지는 않지만, 손을 자유롭게 유지하면서 튼튼한 무기로 활용할 수 있습니다.
items.weapon.melee.gloves.discover_hint=특정 영웅이 이 아이템을 가지고 시작합니다.

items.weapon.melee.greataxe.name=특대 도끼
items.weapon.melee.greataxe.stats_desc=이 무기는 매우 무겁습니다.
items.weapon.melee.greataxe.ability_name=처형
items.weapon.melee.greataxe.typical_ability_desc=특대 도끼를 가진 결투자는 체력이 50%% 미만일 때 적을 _응징_할 수 있습니다. 이 파괴적인 공격은 반드시 명중하며 일반적으로 _%1$d-%2$d_의 피해를 입히고, 적을 처치했을 경우 턴을 소모하지 않습니다.
items.weapon.melee.greataxe.ability_desc=특대 도끼를 가진 결투자는 체력이 50%% 미만일 때 적을 _응징_할 수 있습니다. 이 파괴적인 공격은 반드시 명중하며 _%1$d-%2$d_의 피해를 입히고, 적을 처치했을 경우 턴을 소모하지 않습니다.
items.weapon.melee.greataxe.desc=어깨로 받쳐야 겨우 들 수 있는 이 거대한 도끼는, 그 무게에 걸맞는 강력한 파괴력을 가집니다.

items.weapon.melee.greatshield.name=특대 방패
items.weapon.melee.greatshield.typical_stats_desc=일반적으로 이 무기는 0-%d의 데미지를 감소시킵니다. 이 감소율은 강화를 하면 더 확장됩니다.
items.weapon.melee.greatshield.stats_desc=이 무기는 0-%d의 피해를 감소시킵니다. 이 감소율은 강화를 하면 더 확장됩니다.
items.weapon.melee.greatshield.ability_name=방어
items.weapon.melee.greatshield.typical_ability_desc=특대 방패를 가진 결투자는 스스로를 _방어_하여, 일반적으로 다음 _%d_턴 동안 받는 모든 물리 및 마법 피해를 무시할 수 있게 됩니다. 결투자가 1회의 공격을 막아낸 후, 마법을 쓰거나 다시 공격하는 경우 방어를 해제합니다.
items.weapon.melee.greatshield.ability_desc=특대 방패를 가진 결투자는 스스로를 _방어_하여, 다음 _%d_턴 동안 받는 모든 물리 및 마법 피해를 무시할 수 있게 됩니다. 결투자가 1회의 공격을 막아낸 후, 마법을 쓰거나 다시 공격하는 경우 방어를 해제합니다.
items.weapon.melee.greatshield.upgrade_ability_stat_name=능력 지속 시간
items.weapon.melee.greatshield.desc=방패보단 차라리 움직이는 장벽이란 말이 어울릴 것 같은 이 거대한 쇳덩어리는 방어를 돕지만, 공격 수단으로 쓰기에는 다소 거추장스럽습니다.

items.weapon.melee.greatsword.name=특대검
items.weapon.melee.greatsword.ability_name=가르기
items.weapon.melee.greatsword.typical_ability_desc=특대검을 가진 결투자는 _가르기_를 사용할 수 있습니다. 이 공격은 일반적으로 _%1$d-%2$d_의 피해를 입히며 반드시 명중합니다. 가르기로 적을 처치할 경우 턴을 소모하지 않고, 다음 5턴 이내에 충전량 소모 없이 가르기를 한 번 더 사용할 수 있게 됩니다.
items.weapon.melee.greatsword.ability_desc=특대검을 가진 결투자는 _가르기_를 사용할 수 있습니다. 이 공격은 _%1$d-%2$d_의 피해를 입히며 반드시 명중합니다. 가르기로 적을 처치할 경우 턴을 소모하지 않고, 다음 5턴 이내에 충전량 소모 없이 가르기를 한 번 더 사용할 수 있게 됩니다.
items.weapon.melee.greatsword.desc=이 거대한 칼날은 무게를 주어 휘둘러 적들에게 커다란 피해를 입힙니다.

items.weapon.melee.handaxe.name=손도끼
items.weapon.melee.handaxe.stats_desc=이 무기는 다른 무기보다 정확합니다.
items.weapon.melee.handaxe.ability_name=강타
items.weapon.melee.handaxe.typical_ability_desc=손도끼를 가진 결투자는 _강타_를 사용할 수 있습니다. 이 집중적인 공격으로 적을 기습 공격했다면 일반적으로 _%1$d-%2$d_의 피해를 입히고, 또한 해당 적에게 5턴의 멍해짐 상태를 부여하여 정확성과 회피를 50%% 감소시킵니다. 강타는 항상 명중하지만, 기습 공격이 아닐 경우 일반적인 피해만 입힙니다.
items.weapon.melee.handaxe.ability_desc=손도끼를 가진 결투자는 _강타_를 사용할 수 있습니다. 이 집중적인 공격으로 적을 기습 공격했다면 _%1$d-%2$d_의 피해를 입히고, 또한 해당 적에게 5턴의 멍해짐 상태를 부여하여 정확성과 회피를 50%% 감소시킵니다. 강타는 항상 명중하지만, 기습 공격이 아닐 경우 일반적인 피해만 입힙니다.
items.weapon.melee.handaxe.desc=가벼운 도끼로써, 보통은 나무를 벨 때 사용합니다. 적을 벨 때도 적당한 날을 가졌습니다.

items.weapon.melee.katana.name=도
items.weapon.melee.katana.stats_desc=이 무기는 0-3의 피해를 막을 수 있습니다.
items.weapon.melee.katana.ability_name=돌진
items.weapon.melee.katana.typical_ability_desc=도를 지닌 결투자는 1칸 거리의 적에게 _돌진_할 수 있습니다. 돌진하면 적에게 이동함과 동시에 일반적으로 _%1$d-%2$d_의 피해를 주며 반드시 명중합니다.
items.weapon.melee.katana.ability_desc=도를 지닌 결투자는 1칸 거리의 적에게 _돌진_할 수 있습니다. 돌진하면 적에게 이동함과 동시에 _%1$d-%2$d_의 피해를 주며 반드시 명중합니다.
items.weapon.melee.katana.desc=커다란 금속제 가드 위로 뻗어나간 가느다란 도신을 지닌 검입니다.

items.weapon.melee.longsword.name=장검
items.weapon.melee.longsword.ability_name=가르기
items.weapon.melee.longsword.typical_ability_desc=장검을 가진 결투자는 _가르기_를 사용할 수 있습니다. 이 공격은 일반적으로 _%1$d-%2$d_의 피해를 입히며 반드시 명중합니다. 가르기로 적을 처치할 경우 턴을 소모하지 않고, 다음 5턴 이내에 충전량 소모 없이 가르기를 한 번 더 사용할 수 있게 됩니다.
items.weapon.melee.longsword.ability_desc=장검을 가진 결투자는 _가르기_를 사용할 수 있습니다. 이 공격은 _%1$d-%2$d_의 피해를 입히며 반드시 명중합니다. 가르기로 적을 처치할 경우 턴을 소모하지 않고, 다음 5턴 이내에 충전량 소모 없이 가르기를 한 번 더 사용할 수 있게 됩니다.
items.weapon.melee.longsword.desc=이 검의 예리하고 날카로운 강철 칼날은 사용자를 안심시킬 정도입니다. 그러나 그 길이로 인해 많이 무겁습니다.

items.weapon.melee.mace.name=메이스
items.weapon.melee.mace.stats_desc=이 무기는 다른 무기보다 정확합니다.
items.weapon.melee.mace.ability_name=강타
items.weapon.melee.mace.typical_ability_desc=메이스를 가진 결투자는 _강타_를 사용할 수 있습니다. 이 집중적인 공격으로 적을 기습 공격했다면 일반적으로 _%1$d-%2$d_의 피해를 입히고, 또한 해당 적에게 5턴의 멍해짐 상태를 부여하여 정확성과 회피를 50%% 감소시킵니다. 강타는 항상 명중하지만, 기습 공격이 아닐 경우 일반적인 피해만 입힙니다.
items.weapon.melee.mace.ability_desc=메이스를 가진 결투자는 _강타_를 사용할 수 있습니다. 이 집중적인 공격으로 적을 기습 공격했다면 일반적으로 _%1$d-%2$d_의 피해를 입히고, 또한 해당 적에게 5턴의 멍해짐 상태를 부여하여 정확성과 회피를 50%% 감소시킵니다. 강타는 항상 명중하지만, 기습 공격이 아닐 경우 일반적인 피해만 입힙니다.
items.weapon.melee.mace.desc=이 무기 끝에 달린 철구는 적에게 적당한 뇌진탕을 안겨줍니다.

items.weapon.melee.magesstaff.name=마법사의 지팡이
items.weapon.melee.magesstaff.ac_imbue=융합한다
items.weapon.melee.magesstaff.ac_zap=발사한다
items.weapon.melee.magesstaff.prompt=마법 막대를 선택하세요
items.weapon.melee.magesstaff.imbue=당신은 지팡이에 %s를 융합했다.
items.weapon.melee.magesstaff.preserved=이전에 융합했던 마법 막대가 보존되었다!
items.weapon.melee.magesstaff.imbue_desc=정말로 이 마법 막대를 융합하시겠습니까?\n\n융합될 마법 막대의 강화 수치가 지팡이의 강화 수치와 같거나 높으면, 지팡이의 강화 수치는 융합될 마법 막대의 강화 수치로 변하며 지팡이가 강화되어 있었을 경우에 한해 1을 더한 값이 됩니다.
items.weapon.melee.magesstaff.imbue_level=이 융합으로 _+%d 강화된 지팡이_를 얻게 됩니다.
items.weapon.melee.magesstaff.imbue_unknown=마법 막대의 강화 수치는 알 수 없지만, 이 융합으로 최소 _+%d 강화된 지팡이_를 얻을 수 있습니다.
items.weapon.melee.magesstaff.imbue_cursed=_저주받은 마법 막대를 융합하면 지팡이 또한 저주받게 됩니다!_
items.weapon.melee.magesstaff.imbue_lost=현재 지팡이와 융합한 마법 막대가 _소멸합니다_.
items.weapon.melee.magesstaff.imbue_talent=현재 지팡이와 융합한 마법 막대가 _+0인 상태로 반환됩니다_.
items.weapon.melee.magesstaff.yes=네, 그렇게 하겠습니다.
items.weapon.melee.magesstaff.no=아니오,  생각을 바꾸었습니다.
items.weapon.melee.magesstaff.desc=마법사가 스스로 만든 지팡이는 다른 마법 막대를 융합할 수 있는 독특한 마법 무기입니다.
items.weapon.melee.magesstaff.no_wand=이 지팡이에는 현재 아무런 마법이 깃들어 있지 않습니다. _다른 마법 막대의 힘을 융합_해야 마법을 사용할 수 있습니다.
items.weapon.melee.magesstaff.has_wand=이 지팡이는 현재 _%s_와 융합했습니다.
items.weapon.melee.magesstaff.cursed_wand=이 마법 막대는 저주받았습니다. 혼란스러운 무작위 주문이 발동됩니다.
items.weapon.melee.magesstaff.discover_hint=특정 영웅이 이 아이템을 가지고 시작합니다.

items.weapon.melee.meleeweapon.ac_ability=능력 발동
items.weapon.melee.meleeweapon.stats_known=이 _%1$d티어_ 무기는 _%2$d-%3$d의 피해_를 입히며 _힘이 %4$d이상_이어야 제대로 다룰 수 있습니다.
items.weapon.melee.meleeweapon.stats_unknown=보통 이 _%1$d티어_ 무기는 _%2$d-%3$d의 피해_를 입히며 _힘이 %4$d이상_이어야 제대로 다룰 수 있습니다.
items.weapon.melee.meleeweapon.probably_too_heavy=아마도 이 무기는 당신에게 너무 무거울 것입니다.
items.weapon.melee.meleeweapon.stats_desc=
items.weapon.melee.meleeweapon.ability_need_equip=무기의 능력을 발동하기 위해서는 무기를 장착해야 한다.
items.weapon.melee.meleeweapon.ability_low_str=무기의 능력을 사용하기 위해 필요한 힘을 충분히 가지고 있지 않다.
items.weapon.melee.meleeweapon.ability_no_charge=능력을 발동하기 위한 충전량이 부족하다.
items.weapon.melee.meleeweapon.ability_cant_use=지금은 능력을 사용할 수 없다.
items.weapon.melee.meleeweapon.ability_no_target=대상이 없다.
items.weapon.melee.meleeweapon.ability_target_range=그 대상은 사정거리 내에 있지 않다.
items.weapon.melee.meleeweapon.ability_occupied=그 위치에는 이미 무언가가 있다.
items.weapon.melee.meleeweapon.upgrade_ability_stat_name=능력 피해량
items.weapon.melee.meleeweapon.prompt=대상을 선택하세요
items.weapon.melee.meleeweapon.swap=무기 교체
items.weapon.melee.meleeweapon.swap_full=가방이 가득 찬 상태에서 그것을 할 수는 없다.


items.weapon.melee.shortsword.name=소검
items.weapon.melee.shortsword.ability_name=가르기
items.weapon.melee.shortsword.typical_ability_desc=소검을 가진 결투자는 _가르기_를 사용할 수 있습니다. 이 공격은 일반적으로 _%1$d-%2$d_의 피해를 입히며 반드시 명중합니다. 가르기로 적을 처치할 경우 턴을 소모하지 않고, 다음 5턴 이내에 충전량 소모 없이 가르기를 한 번 더 사용할 수 있게 됩니다.
items.weapon.melee.shortsword.ability_desc=소검을 가진 결투자는 _가르기_를 사용할 수 있습니다. 이 공격은 _%1$d-%2$d_의 피해를 입히며 반드시 명중합니다. 가르기로 적을 처치할 경우 턴을 소모하지 않고, 다음 5턴 이내에 충전량 소모 없이 가르기를 한 번 더 사용할 수 있게 됩니다.
items.weapon.melee.shortsword.desc=이 무기는 단검보다 겨우 한두 뼘 정도 긴 무기에 불과합니다.

items.weapon.melee.quarterstaff.name=육척봉
items.weapon.melee.quarterstaff.stats_desc=이 무기는 0-2의 피해를 막을 수 있습니다.
items.weapon.melee.quarterstaff.ability_name=수비적인 자세
items.weapon.melee.quarterstaff.typical_ability_desc=육척봉을 가진 결투자는 _수비 자세_를 취할 수 있습니다. 이 능력은 턴을 소모하지 않으며 일반적으로 _%d턴_ 동안 회피를 3배 늘립니다.
items.weapon.melee.quarterstaff.ability_desc=육척봉을 가진 결투자는 _수비 자세_를 취할 수 있습니다. 이 능력은 턴을 소모하지 않으며 _%d턴_ 동안 회피를 3배 늘립니다.
items.weapon.melee.quarterstaff.upgrade_ability_stat_name=능력 지속 시간
items.weapon.melee.quarterstaff.desc=단단한 나무로 만들어진 지팡이이며, 끝 부분에 금속으로 된 테로 둘러져 있습니다.
items.weapon.melee.quarterstaff$defensivestance.name=수비적인 자세
items.weapon.melee.quarterstaff$defensivestance.desc=당신은 적들의 투사체와 공격을 튕겨내기 위해 육척봉을 사용하고 있습니다. 이 자세를 취하고 있는 동안 받는 모든 공격에 대한 회피가 3배 증가합니다.\n\n남은 턴: %s.

items.weapon.melee.rapier.name=레이피어
items.weapon.melee.rapier.stats_desc=이 무기는 0-1의 피해를 막습니다.
items.weapon.melee.rapier.ability_name=돌진
items.weapon.melee.rapier.typical_ability_desc=레이피어를 지닌 결투자는 1칸 거리의 적에게 _돌진_할 수 있습니다. 돌진하면 적에게 이동함과 동시에 일반적으로 _%1$d-%2$d_의 피해를 주며 반드시 명중합니다.
items.weapon.melee.rapier.ability_desc=레이피어를 지닌 결투자는 1칸 거리의 적에게 _돌진_할 수 있습니다. 돌진하면 적에게 이동함과 동시에 _%1$d-%2$d_의 피해를 주며 반드시 명중합니다.
items.weapon.melee.rapier.desc=이 곧은 세검은 베는 위력을 희생한 대가로 약간의 방어 능력을 가지고 있습니다.
items.weapon.melee.rapier.discover_hint=특정 영웅이 이 아이템을 가지고 시작합니다.

items.weapon.melee.roundshield.name=원형 방패
items.weapon.melee.roundshield.typical_stats_desc=일반적으로 이 무기는 0-%d의 데미지를 감소시킵니다. 이 감소율은 강화를 하면서 더 확장됩니다.
items.weapon.melee.roundshield.stats_desc=이 무기는 0-%d의 피해를 감소시킵니다. 이 감소율은 강화를 하면 더 확장됩니다.
items.weapon.melee.roundshield.ability_name=방어
items.weapon.melee.roundshield.typical_ability_desc=원형 방패를 가진 결투자는 스스로를 _방어_하여, 일반적으로 다음 _%d_턴 동안 받는 모든 물리 및 마법 피해를 무시할 수 있게 됩니다. 결투자가 1회의 공격을 막아낸 후, 마법을 쓰거나 다시 공격하는 경우 방어를 해제합니다.
items.weapon.melee.roundshield.ability_desc=원형 방패를 가진 결투자는 스스로를 _방어_하여, 다음 _%d_턴 동안 받는 모든 물리 및 마법 피해를 무시할 수 있게 됩니다. 결투자가 1회의 공격을 막아낸 후, 마법을 쓰거나 다시 공격하는 경우 방어를 해제합니다.
items.weapon.melee.roundshield.upgrade_ability_stat_name=능력 지속 시간
items.weapon.melee.roundshield.desc=이 커다란 방패는 공격을 효과적으로 방어하며, 위기에 몰렸을 때에는 그럭저럭 괜찮은 무기도 됩니다.
items.weapon.melee.roundshield$guardtracker.name=방어 중
items.weapon.melee.roundshield$guardtracker.guarded=방어함
items.weapon.melee.roundshield$guardtracker.desc=결투자는 다가오는 공격을 예상해, 방패를 준비하고 있으며, 앞으로 받는 물리 혹은 마법 공격들을 완벽하게 막아낼 수 있습니다.\n\n남은 턴: %s.

items.weapon.melee.runicblade.name=룬 검
items.weapon.melee.runicblade.stats_desc=이 무기는 강화의 효율이 더 높습니다.
items.weapon.melee.runicblade.ability_name=룬 베기
items.weapon.melee.runicblade.typical_ability_desc=룬 검을 가진 결투자는 _룬 베기_를 사용할 수 있습니다. 이 공격은 반드시 명중하며 무기에 부여된 마법의 성능을 일반적으로 _+%d%%_+만큼 증가시킵니다.
items.weapon.melee.runicblade.ability_desc=룬 검을 가진 결투자는 _룬 베기_를 사용할 수 있습니다. 이 공격은 반드시 명중하며 무기에 부여된 마법의 성능을 _+%d%%_만큼 증가시킵니다.
items.weapon.melee.runicblade.upgrade_ability_stat_name=능력 강도
items.weapon.melee.runicblade.desc=먼 곳에서 온 정체불명의 무기로, 밝은 푸른빛의 날을 가지고 있습니다.

items.weapon.melee.sai.name=쌍차도
items.weapon.melee.sai.stats_desc=이 무기는 매우 빠르게 공격할 수 있습니다.
items.weapon.melee.sai.ability_name=연속 타격
items.weapon.melee.sai.typical_ability_desc=쌍차도를 가진 결투자는 _연속 타격_을 사용할 수 있습니다. 이 공격은 반드시 적중하며, 일반적인 투척 공격 혹은 근접 공격이 명중한 횟수 당 _+%d_의 추가 피해를 줍니다. 5턴 동안 공격을 하지 않으면 연속 타격이 초기화됩니다.
items.weapon.melee.sai.ability_desc=쌍차도를 가진 결투자는 _연속 타격_을 사용할 수 있습니다. 이 공격은 반드시 적중하며, 일반적인 투척 공격 혹은 근접 공격이 명중한 횟수 당 _+%d_의 추가 피해를 줍니다. 5턴 동안 공격을 하지 않으면 연속 타격이 초기화됩니다.
items.weapon.melee.sai.desc=양 손에 하나씩 들 수 있는 두개의 얇은 검입니다. 빠르게 상처를 입혀 적을 쓰러뜨리기에 좋습니다.
items.weapon.melee.sai$combostriketracker.name=연속 타격
items.weapon.melee.sai$combostriketracker.desc=연속 타격을 모아 연속 타격 능력의 피해를 강화할 수 있습니다. 근접 혹은 투척 공격이 명중할 때마다 연속 타격이 쌓이며, 5턴 동안 공격을 명중시키지 못할 경우 연속 타격이 초기화됩니다.\n\n현재 연속 타격: %1$d.\n\n연속 타격이 사라지기까지 남은 턴: %2$s.

items.weapon.melee.scimitar.name=시미타
items.weapon.melee.scimitar.stats_desc=이 무기는 다른 무기보다 빠릅니다.
items.weapon.melee.scimitar.ability_name=칼춤
items.weapon.melee.scimitar.typical_ability_desc=시미타를 가진 결투자는 _칼춤_을 사용할 수 있습니다. 이 능력은 턴을 소모하지 않으며 일반적으로 _%d턴_ 동안 결투자의 공격 속도를 +60%% 증가시키고 정확성을 50%%만큼 증가시킵니다.
items.weapon.melee.scimitar.ability_desc=시미타를 가진 결투자는 _칼춤_을 사용할 수 있습니다. 이 능력은 턴을 소모하지 않으며 _%d턴_ 동안 결투자의 공격 속도를 +60%% 증가시키고 정확성을 50%%만큼 증가시킵니다.
items.weapon.melee.scimitar.upgrade_ability_stat_name=능력 지속 시간
items.weapon.melee.scimitar.desc=두꺼운 곡검입니다. 이 검은 빠르지만 그만큼 피해를 덜 입힙니다.
items.weapon.melee.scimitar$sworddance.name=칼춤
items.weapon.melee.scimitar$sworddance.desc=당신은 춤과 같은 동작으로 공격을 이어나갑니다. 이 자세가 지속되는 동안, 당신은 60%%의 추가 공격 속도(시미터로 1턴에 2번 공격 가능)를 얻고, 명중률이 +50%% 증가합니다.\n\n남은 턴: %s.

items.weapon.melee.sickle.name=손낫
items.weapon.melee.sickle.stats_desc=이 무기는 다소 부정확합니다.
items.weapon.melee.sickle.ability_name=수확
items.weapon.melee.sickle.typical_ability_desc=손낫을 가진 결투자는 적을 _수확_할 수 있습니다. 이 무시무시한 공격은 반드시 명중하며 일반적으로 _%d의 피해_를 입힙니다. 이 피해는 대상이 출혈에 면역이 아닐 경우 직접적인 피해 대신 같은 양의 출혈을 입히게 됩니다.
items.weapon.melee.sickle.ability_desc=손낫을 가진 결투자는 적을 _수확_할 수 있습니다. 이 무시무시한 공격은 반드시 명중하며 _%d의 피해_를 입힙니다. 이 피해는 대상이 출혈에 면역이 아닐 경우 직접적인 피해 대신 같은 양의 출혈을 입히게 됩니다.
items.weapon.melee.sickle.desc=한 손으로 사용하는 농사 기구로, 다루기 까다롭지만 강력한 무기도 될 수 있습니다.

items.weapon.melee.spear.name=창
items.weapon.melee.spear.stats_desc=이 무기는 다른 무기들보다 느립니다.\n이 무기는 떨어진 적을 공격할 수 있습니다.
items.weapon.melee.spear.ability_name=찌르기
items.weapon.melee.spear.typical_ability_desc=결투자는 창의 끝 부분을 사용해 공격 범위 내에 있는 근접해 있지 않은 적에게 _찌르기_를 사용할 수 있습니다. 이 공격은 일반적으로 _%1$d-%2$d 의 피해_를 입히고, 적을 뒤로 밀쳐내며, 반드시 명중합니다.
items.weapon.melee.spear.ability_desc=결투자는 창의 끝 부분을 사용해 공격 범위 내에 있는 근접해 있지 않은 적에게 _찌르기_를 사용할 수 있습니다. 이 공격은 _%1$d-%2$d 의 피해_를 입히고, 적을 뒤로 밀쳐내며, 반드시 명중합니다.
items.weapon.melee.spear.desc=길쭉한 나무봉 끝에 날카로운 쇠가 붙어있습니다.

items.weapon.melee.sword.name=검
items.weapon.melee.sword.ability_name=가르기
items.weapon.melee.sword.typical_ability_desc=검을 가진 결투자는 _가르기_를 사용할 수 있습니다. 이 공격은 일반적으로 _%1$d-%2$d_의 피해를 입히며 반드시 명중합니다. 가르기로 적을 처치할 경우 턴을 소모하지 않고, 다음 5턴 이내에 충전량 소모 없이 가르기를 한 번 더 사용할 수 있게 됩니다.
items.weapon.melee.sword.ability_desc=검을 가진 결투자는 _가르기_를 사용할 수 있습니다. 이 공격은 _%1$d-%2$d_의 피해를 입히며 반드시 명중합니다. 가르기로 적을 처치할 경우 턴을 소모하지 않고, 다음 5턴 이내에 충전량 소모 없이 가르기를 한 번 더 사용할 수 있게 됩니다.
items.weapon.melee.sword.desc=괜찮게 균형잡힌 검입니다. 너무 크지는 않지만, 확실히 소검보다는 큽니다.
items.weapon.melee.sword$cleavetracker.name=가르기
items.weapon.melee.sword$cleavetracker.desc=당신은 직전에 사용한 가르기 이후 무기에 남은 관성을 이용한 추가 타격을 입힐 준비가 되어 있습니다. 다음에 사용하는 가르기는 무기의 충전량을 사용하지 않습니다.\n\n남은 턴: %s.

items.weapon.melee.warhammer.name=전쟁 망치
items.weapon.melee.warhammer.stats_desc=이 무기는 다른 무기보다 정확합니다.
items.weapon.melee.warhammer.ability_name=강타
items.weapon.melee.warhammer.typical_ability_desc=전쟁 망치를 가진 결투자는 _강타_를 사용할 수 있습니다. 이 집중적인 공격으로 적을 기습 공격했다면 일반적으로 _%1$d-%2$d_의 피해를 입히고, 또한 해당 적에게 5턴의 멍해짐 상태를 부여하여 정확성과 회피를 50%% 감소시킵니다. 강타는 항상 명중하지만, 기습 공격이 아닐 경우 일반적인 피해만 입힙니다.
items.weapon.melee.warhammer.ability_desc=전쟁 망치를 가진 결투자는 _강타_를 사용할 수 있습니다. 이 집중적인 공격으로 적을 기습 공격했다면 _%1$d-%2$d_의 피해를 입히고, 또한 해당 적에게 5턴의 멍해짐 상태를 부여하여 정확성과 회피를 50%% 감소시킵니다. 강타는 항상 명중하지만, 기습 공격이 아닐 경우 일반적인 피해만 입힙니다.
items.weapon.melee.warhammer.desc=거대한 납과 강철 덩어리로 만들어진 이 망치의 파괴적인 공격을 막을 수 있는 생물체는 얼마 없습니다. 하지만 효율적으로 다루기 위해선 많은 힘을 필요로 합니다.

items.weapon.melee.warscythe.name=전쟁 낫
items.weapon.melee.warscythe.stats_desc=이 무기는 다소 부정확합니다.
items.weapon.melee.warscythe.ability_name=수확
items.weapon.melee.warscythe.typical_ability_desc=전쟁 낫을 가진 결투자는 적을 _수확_할 수 있습니다. 이 무시무시한 공격은 반드시 명중하며 일반적으로 _%d의 피해_를 입힙니다. 이 피해는 대상이 출혈에 면역이 아닐 경우 직접적인 피해 대신 같은 양의 출혈을 입히게 됩니다.
items.weapon.melee.warscythe.ability_desc=전쟁 낫을 가진 결투자는 적을 _수확_할 수 있습니다. 이 무시무시한 공격은 반드시 명중하며 _%d의 피해_를 입힙니다. 이 피해는 대상이 출혈에 면역이 아닐 경우 직접적인 피해 대신 같은 양의 출혈을 입히게 됩니다.
items.weapon.melee.warscythe.desc=거대하고 다루기 까다로운 이 농기구는 식물보다 적을 더 잘 벨 수 있도록 개조되었습니다.

items.weapon.melee.whip.name=채찍
items.weapon.melee.whip.stats_desc=이 무기는 매우 긴 공격범위를 가집니다.
items.weapon.melee.whip.ability_name=채찍질
items.weapon.melee.whip.typical_ability_desc=채찍을 가진 결투자는 주변에 있는 모든 적에게 _채찍질_을 할 수 있습니다. 이 능력은 일반적으로 _%1$d-%2$d_의 피해를 공격 범위 내에 있는 모든 적들에게 입히며, 반드시 명중합니다.
items.weapon.melee.whip.ability_desc=채찍을 가진 결투자는 주변에 있는 모든 적에게 _채찍질_을 할 수 있습니다. 이 능력은 _%1$d-%2$d_의 피해를 공격 범위 내에 있는 모든 적들에게 입히며, 반드시 명중합니다.
items.weapon.melee.whip.desc=이 무기의 끝에 달린 기다란 가시줄은 형편없는 피해를 입히지만, 사정거리만큼은 다른 무기와 비교할 수 없습니다.

items.weapon.melee.wornshortsword.name=낡은 소검
items.weapon.melee.wornshortsword.ability_name=가르기
items.weapon.melee.wornshortsword.typical_ability_desc=낡은 소검을 가진 결투자는 _가르기_를 사용할 수 있습니다. 이 공격은 일반적으로 _%1$d-%2$d_의 피해를 입히며 반드시 명중합니다. 가르기로 적을 처치할 경우 턴을 소모하지 않고, 다음 5턴 이내에 충전량 소모 없이 가르기를 한 번 더 사용할 수 있게 됩니다.
items.weapon.melee.wornshortsword.ability_desc=낡은 소검을 가진 결투자는 _가르기_를 사용할 수 있습니다. 이 공격은 _%1$d-%2$d_의 피해를 입히며 반드시 명중합니다. 가르기로 적을 처치할 경우 턴을 소모하지 않고, 다음 5턴 이내에 충전량 소모 없이 가르기를 한 번 더 사용할 수 있게 됩니다.
items.weapon.melee.wornshortsword.desc=오래 사용하여 낡아버린 소검입니다. 보통 소검보다 가볍고 피해를 덜 입힙니다.
items.weapon.melee.wornshortsword.discover_hint=특정 영웅이 이 아이템을 가지고 시작합니다.


###missile weapons
items.weapon.missiles.darts.adrenalinedart.name=아드레날린 다트
items.weapon.missiles.darts.adrenalinedart.desc=이 다트는 신속엉겅퀴 추출물이 발려 있으며, 대상 아군의 이동과 공격 속도를 대폭 늘리거나, 대상 적의 속도를 잠시 늦춥니다. 다트 자체의 피해는 적에게만 적용됩니다.

items.weapon.missiles.darts.blindingdart.name=실명 다트
items.weapon.missiles.darts.blindingdart.desc=이 다트의 끝부분은 실명초 추출물이 발려 있어 맞은 적을 잠시 동안 실명시킵니다. 하지만 적의 방향 감각을 상실시키지 않아서 여전히 당신이 있던 곳을 기억할 것입니다.

items.weapon.missiles.darts.chillingdart.name=냉동 다트
items.weapon.missiles.darts.chillingdart.desc=이 다트의 끝부분은 눈꽃송이 추출물이 발려 있어 맞은 적을 잠시 동안 냉동시킵니다.

items.weapon.missiles.darts.cleansingdart.name=정화 다트
items.weapon.missiles.darts.cleansingdart.desc=이 다트는 아군이 해로운 효과에 면역이 되게 하거나, 적이 가진 이로운 효과를 제거하는 마법풀 추출물이 발려 있습니다. 또한 맞은 적의 주의를 돌리거나 도망치게 만들 수도 있습니다. 다트 자체의 피해는 적에게만 적용됩니다.

items.weapon.missiles.darts.dart.name=다트
items.weapon.missiles.darts.dart.ac_tip=바른다
items.weapon.missiles.darts.dart.prompt=씨앗을 선택하세요
items.weapon.missiles.darts.dart.tip_title=다트에 씨앗 바르기
items.weapon.missiles.darts.dart.tip_desc=씨앗을 하나 또는 두 개의 다트에 바를 수 있습니다. 각 종류의 씨앗에 대응하는 고유 효과를 가진 일회용 특수 다트를 만들어냅니다.\n\n다트에 이 씨앗을 바르면 _%s_를 만들 수 있습니다.
items.weapon.missiles.darts.dart.tip_all=다트 %1$d개에 씨앗 %2$d개 바르기
items.weapon.missiles.darts.dart.tip_two=다트 2개에 씨앗 바르기
items.weapon.missiles.darts.dart.tip_one=다트 1개에 씨앗 바르기
items.weapon.missiles.darts.dart.tip_cancel=취소
items.weapon.missiles.darts.dart.desc=끝부분에 금속 가시가 달린 나무 막대로써 손목의 튕김으로 쉽게 날려보내  적들에게 꽂을 수 있도록 만들어졌습니다. 여기에 씨앗 추출물을 발라 던질 때 추가 효과를 얻을 수 있습니다.
items.weapon.missiles.darts.dart.unlimited_uses=단순한 구조 덕에 다트는 영구적으로 사용할 수 있습니다.

items.weapon.missiles.darts.displacingdart.name=변위 다트
items.weapon.missiles.darts.displacingdart.desc=이 다트의 끝부분은 미명초 추출물이 발려 있어 맞은 적을 짧은 거리로 순간이동시킵니다.

items.weapon.missiles.darts.healingdart.name=치유 다트
items.weapon.missiles.darts.healingdart.desc=이 다트는 대상을 급속도로 치유할 수 있는 태양초 추출물이 발려 있습니다. 다트 그 자체는 여전히 적들을 해치지만, 동료들은 해치지 않습니다.

items.weapon.missiles.darts.holydart.name=신성 다트
items.weapon.missiles.darts.holydart.desc=이 다트는 대상에게 신성한 에너지를 주입하는 별꽃 추출물이 발려 있습니다. 아군과 일반적인 적은 축복받으며, 언데드와 악마 적들은 큰 피해를 입습니다. 다트 자체의 피해는 적에게만 적용됩니다.

items.weapon.missiles.darts.incendiarydart.name=인화성 다트
items.weapon.missiles.darts.incendiarydart.desc=이 다트의 끝부분은 화염초 추출물이 발려 있어 충격을 주면 밝은 빛으로 타오릅니다.

items.weapon.missiles.darts.paralyticdart.name=마비 다트
items.weapon.missiles.darts.paralyticdart.desc=이 다트의 끝부분은 뱀뿌리 추출물이 발려 있어 맞은 적을 잠시 동안 기절시킵니다.

items.weapon.missiles.darts.poisondart.name=독 다트
items.weapon.missiles.darts.poisondart.desc=이 다트의 끝부분은 슬픔이끼 추출물이 발려 있어 맞은 적을 중독시킵니다.

items.weapon.missiles.darts.rotdart.name=부패 다트
items.weapon.missiles.darts.rotdart.desc=사악한 다트 끝에는 다트를 맞은 어떤 것이든 공격적으로 먹어치우는 썩은열매 기반의 산성 물질 혼합물이 발라져 있습니다. 강력한 적들은 효과의 대분에 저항을 가지지만, 부식은 대부분의 일반적인 적들을 손쉽게 죽이기에 충분합니다. 이 다트들은 다른 끝을 붙인 다트들보다 기본적으로 더 높은 내구도를 가지지만, 내구도를 더 늘릴 수는 없습니다.
items.weapon.missiles.darts.rotdart.discover_hint=이 아이템은 특정한 퀘스트에서 등장하는 아이템을 재료로 하여 만들 수 있습니다.

items.weapon.missiles.darts.shockingdart.name=전격 다트
items.weapon.missiles.darts.shockingdart.desc=이 다트의 끝부분은 폭풍덩굴 추출물이 발려 있어 맞은 적에게 전기 충격을 발생시킵니다.

items.weapon.missiles.darts.tippeddart.ac_clean=지운다
items.weapon.missiles.darts.tippeddart.clean_title=추출물 지우기
items.weapon.missiles.darts.tippeddart.clean_desc=이 행동은 당신의 다트에 발라진 씨앗 효과를 제거하여, 원래의 일반적인 다트로 되돌립니다.
items.weapon.missiles.darts.tippeddart.clean_all=모두 지우기
items.weapon.missiles.darts.tippeddart.clean_one=하나만 지우기
items.weapon.missiles.darts.tippeddart.cancel=취소
items.weapon.missiles.darts.tippeddart.uses_left=이 다트 더미는 하나의 효과가 사라지기까지 _%d/%d _번 사용할 수 있습니다.
items.weapon.missiles.darts.tippeddart.unlimited_uses=_그러나 이 물건은 매우 튼튼해 반영구적으로 사용할 수 있습니다._
items.weapon.missiles.darts.tippeddart.about_to_break=다트의 끝에 붙인 추출물이 거의 사라졌다.
items.weapon.missiles.darts.tippeddart.has_broken=다트의 끝에 붙인 추출물이 완전히 사라졌다.
items.weapon.missiles.darts.tippeddart.discover_hint=이 아이템은 상점에서 구입하거나, 씨앗을 사용해 만들 수 있습니다.


items.weapon.missiles.bolas.name=올가미
items.weapon.missiles.bolas.stats_desc=이 무기는 대상에게 불구를 부여합니다.
items.weapon.missiles.bolas.desc=이 특이한 투척 무기는 비교적 약한 피해를 입히지만 대상을 감속시키는 데는 제격입니다.

items.weapon.missiles.boomerang.name=부메랑
items.weapon.missiles.boomerang.desc=이 구부러진 나무 부메랑은 적에게 던지면 던진 사람의 손으로 되돌아옵니다.
items.weapon.missiles.boomerang.durability=부메랑은 단단한 구조로 인해 절대 부서지지 않습니다.

items.weapon.missiles.fishingspear.name=작살
items.weapon.missiles.fishingspear.desc=낚시용으로 설계되었지만, 급조 무기 치고는 쓸만한 작은 투척용 창입니다.

items.weapon.missiles.forcecube.name=힘의 큐브
items.weapon.missiles.forcecube.ondeath=당신은 당신의 힘의 큐브로 인해 죽었다...
items.weapon.missiles.forcecube.stats_desc=이 무기는 작은 지역에 힘을 방출해 주변에 있는 모든 대상을 공격합니다.
items.weapon.missiles.forcecube.desc=이 기이한 형상의 마법 큐브는 손에 들고 있기에 충분할 정도로 작지만, 정말로 무겁습니다.

items.weapon.missiles.heavyboomerang.name=무거운 부메랑
items.weapon.missiles.heavyboomerang.stats_desc=이 무기는 5 턴 후에 던져진 위치로 되돌아옵니다.
items.weapon.missiles.heavyboomerang.desc=이 커다란 부메랑은 제대로 다루기 어렵지만, 꽤 큰 피해를 줍니다.

items.weapon.missiles.javelin.name=투창
items.weapon.missiles.javelin.desc=이 기다란 투창의 무게 중심은 가시가 있는 앞 부분에 쏠려 있어 날아가는 동안 힘을 실을 수 있게 됩니다.

items.weapon.missiles.kunai.name=쿠나이
items.weapon.missiles.kunai.stats_desc=이 무기는 무방비 상태의 적에게 더 강합니다.
items.weapon.missiles.kunai.desc=이 조그마한 칼들은 노련한 사용자의 손에 쥐어 주면 매우 강력한 성능을 자랑합니다.

items.weapon.missiles.missileweapon.stats_known=이 _%1$d티어_ 투척 무기 세트는 _%2$d-%3$d의 피해_를 입히며 _힘이 %4$d이상_이어야 제대로 다룰 수 있습니다.
items.weapon.missiles.missileweapon.stats_unknown=일반적으로 이 _%1$d티어_ 투척 무기 세트는 _%2$d-%3$d의 피해_를 입히며 _힘이 %4$d이상_이어야 제대로 다룰 수 있습니다.
items.weapon.missiles.missileweapon.stats_desc=
items.weapon.missiles.missileweapon.probably_too_heavy=아마도 이 무기는 당신에게 너무 무거울 것입니다.
items.weapon.missiles.missileweapon.distance=투척 무기는 원거리에서 더욱 정확하지만, 근접한 거리에서는 부정확합니다.
items.weapon.missiles.missileweapon.durability=투척 무기는 사용할 수록 내구도가 닳다가 마침내 부서집니다.
items.weapon.missiles.missileweapon.uses_left=이 투척 무기 세트는 하나가 부서지기까지 _%d/%d_ 번 사용할 수 있습니다.
items.weapon.missiles.missileweapon.unlimited_uses=이 세트는 매우 품질이 좋아, 영구적으로 사용할 수 있습니다.
items.weapon.missiles.missileweapon.unknown_uses=일반적으로 이 투척 무기 세트는 하나가 부서지기까지 _%d_ 번 사용할 수 있습니다.
items.weapon.missiles.missileweapon.curse_discover=이 투척 무기는 저주받았다!
items.weapon.missiles.missileweapon.about_to_break=당신의 투척 무기가 거의 다 부서졌다.
items.weapon.missiles.missileweapon.has_broken=투척 무기 중 하나가 부러졌다.
items.weapon.missiles.missileweapon.dust=당신이 투척 무기를 만지자마자 가루로 변해버렸다.
items.weapon.missiles.missileweapon.break_upgraded_warn_desc=만약 세트의 마지막 투척 무기가 부서지면, 이 강화된 투척 무기 세트를 영원히 잃게 됩니다. 정말로 던질 건가요?
items.weapon.missiles.missileweapon.break_upgraded_warn_yes=네
items.weapon.missiles.missileweapon.break_upgraded_warn_no=아니오
items.weapon.missiles.missileweapon$placeholder.name=투척 무기

items.weapon.missiles.shuriken.name=수리검
items.weapon.missiles.shuriken.stats_desc=수리검을 턴 소모 없이 던지는 행위는 20턴의 재사용 대기 시간을 갖습니다.
items.weapon.missiles.shuriken.desc=날카로운 칼날이 달린 별 모양의 이 금속 조각은 움직인 후에 재빠르게 던질 수 있습니다.
items.weapon.missiles.shuriken$shurikeninstanttracker.name=재사용 대기 시간: 수리검
items.weapon.missiles.shuriken$shurikeninstanttracker.desc=당신은 최근에 수리검을 턴 소모 없이 던졌으며, 다시 그렇게 하기 위해서는 기다려야만 합니다. 수리검은 여전히 던질 수 있지만, 일반적인 공격 속도를 가집니다.\n\n남은 턴: %s.

items.weapon.missiles.throwingclub.name=투척용 몽둥이
items.weapon.missiles.throwingclub.stats_desc=이 무기는 적에게 고정되지 않아 적중 후 빠르게 다시 주워 사용할 수 있습니다.
items.weapon.missiles.throwingclub.desc=매우 단순하지만 내구성이 뛰어난 투척 무기로, 기본적으로 막대기에 큰 돌을 고정한 형태입니다.

items.weapon.missiles.throwinghammer.name=투척용 망치
items.weapon.missiles.throwinghammer.stats_desc=이 무기는 적에게 고정되지 않아 적중 후 빠르게 다시 주워 사용할 수 있습니다.
items.weapon.missiles.throwinghammer.desc=이 묵직한 망치는 적에게 던지기 위해 만들어졌습니다. 튼튼하고 매끈한 무쇠로 만들어져 내구성이 높습니다.

items.weapon.missiles.throwingknife.name=투척용 칼
items.weapon.missiles.throwingknife.stats_desc=이 무기는 무방비 상태의 적에게 더 강합니다.
items.weapon.missiles.throwingknife.desc=이 가벼운 칼들은 바람을 가르며 목표의 목을 가르기에도 적합합니다.
items.weapon.missiles.throwingknife.discover_hint=특정 영웅이 이 아이템을 가지고 시작합니다.

items.weapon.missiles.throwingspear.name=투척용 창
items.weapon.missiles.throwingspear.desc=이 가벼운 창들은 얇은 몸체를 가져 직접 찌르기엔 부적합하지만, 던져 날리기엔 적합합니다.

items.weapon.missiles.throwingspike.name=투척용 대못
items.weapon.missiles.throwingspike.desc=이 튼튼하고 뾰족한 금속 화살은 멀리 있는 적에게 던지기 위해 만들어졌습니다.
items.weapon.missiles.throwingspike.discover_hint=특정 영웅이 이 아이템을 가지고 시작합니다.

items.weapon.missiles.throwingstone.name=투척용 돌
items.weapon.missiles.throwingstone.desc=이 돌멩이들은 일반적인 돌보다 더 강하게 던질 수 있도록 가공되었습니다.
items.weapon.missiles.throwingstone.discover_hint=특정 영웅이 이 아이템을 가지고 시작합니다.

items.weapon.missiles.tomahawk.name=투척용 도끼
items.weapon.missiles.tomahawk.stats_desc=이 무기는 대상에게 _%1$d-%2$d_의 출혈을 발생시킵니다.
items.weapon.missiles.tomahawk.typical_stats_desc=이 무기는 일반적으로 대상에게 _%1$d-%2$d_의 출혈을 발생시킵니다.
items.weapon.missiles.tomahawk.desc=이 톱니 모양의 날이 달린 투척 도끼는 맞은 적을 찢어발깁니다.

items.weapon.missiles.trident.name=삼지창
items.weapon.missiles.trident.desc=거대한 투창으로 끝 부분에 무시무시한 3갈래의 갈퀴가 나 있습니다. 이 투척 무기는 강력하지만, 꽤나 무겁습니다.


items.weapon.spiritbow.name=영혼의 활
items.weapon.spiritbow.ac_shoot=발사한다
items.weapon.spiritbow.prompt=대상을 선택하세요
items.weapon.spiritbow.stats=이 활은 직접 강화할 수 없지만, 대신 당신의 레벨에 따라 점차 강해집니다. 현재 당신의 레벨에서, 영혼의 활로 발사하는 화살은 _%1$d-%2$d_의 피해를 입히며, 제대로 사용하기 위해서 _%3$d_의 힘이 필요합니다.
items.weapon.spiritbow.desc=고대의 마법 나무로 만들어진 활입니다. 이 활의 시위와 각인은 창백한 푸른색으로 빛납니다. 시위가 당겨지면, 이 활은 적에게 발사할 수 있는 마법 화살을 만들어냅니다.
items.weapon.spiritbow.discover_hint=특정 영웅이 이 아이템을 가지고 시작합니다.

items.weapon.weapon.identify=당신은 현재 사용하고 있는 무기가 무엇인지 알 만큼 충분히 익숙해졌다.
items.weapon.weapon.too_heavy=당신의 힘이 충분하지 않기 때문에, 이 무기를 들 때의 공격 속도와 정확성이 감소됩니다. 또한 기습 공격을 할 수 없게 됩니다.
items.weapon.weapon.excess_str=힘이 더 강한 덕분에, 이 무기로 공격할 때 _0-%d의 추가 피해_ 를 얻습니다.
items.weapon.weapon.hardening_gone=무기의 경화 효과가 사라졌다!
items.weapon.weapon.incompatible=서로 다른 마법의 상호 작용으로 인하여 이 무기에 깃든 마법이 사라졌다!
items.weapon.weapon.cursed_worn=이 무기는 저주받았기 때문에, 당신은 이 무기를 해제할 수 없습니다.
items.weapon.weapon.cursed=당신은 악의로 가득 찬 마법이 이 무기에 깃든 것을 느낍니다.
items.weapon.weapon.weak_cursed=저주에도 불구하고, 당신은 무기를 해제할 수 있었다.
items.weapon.weapon.not_cursed=이 무기에는 악의적인 마법이 없습니다.
items.weapon.weapon.faster=이 무기의 _공격 속도_를 증강했습니다.
items.weapon.weapon.stronger=이 무기의 _공격력_을 증강했습니다.
items.weapon.weapon.enchanted=_%s_이(가) 깃들어 있습니다.
items.weapon.weapon.enchant_hardened=이 무기는 _경화_되었습니다.
items.weapon.weapon.hardened_no_enchant=이 무기는 _경화_된 상태지만, 현재 마법이 부여되어 있지는 않습니다.
items.weapon.weapon$enchantment.enchant=마법
items.weapon.weapon$enchantment.rankings_desc=무기 마법에 의해 사망
items.weapon.weapon$enchantment.discover_hint=이 아이템은 던전에서 무작위로 생성되거나, 아이템을 당신에게 직접 적용할 때 등장합니다.


###misc items
items.amulet.name=옌더의 부적
items.amulet.ac_end=게임을 끝낸다
items.amulet.desc=옌더의 부적은 인간 또는 드워프 사회에서 알려진 가장 강력한 유물입니다. 부적에 박힌 반짝거리는 수정들은 불가사의하면서도 경이로운 힘을 가지고 있습니다.
items.amulet.desc_origins=옌더의 부적의 기원은 알 수가 없습니다. 역사서에 따르면 드워프의 왕국에서 모든 연락이 끊기기 직전 그들의 제왕이 부적을 찾아 온 세상에 자랑했던 것으로 알려져 있습니다. 제왕은 어떻게 이 부적을 찾았을까요? 요그제바는 어떻게 이 부적을 빼앗았을까요? 정답은 나중에 찾아도 괜찮습니다. 어쨌든 부적은 당신이 가지고 있으니까요!
items.amulet.desc_ascent=옌더의 부적의 기원은 알 수가 없습니다만, 확실히 요그제바의 힘과 연관이 있어 보입니다. 던전이 요그제바의 의지에 따라 뒤틀리고 있으며, 적들이 더욱 많이 나타나며 강력해집니다! 또한 부적이 저주라도 걸린 것 처럼 버리거나 발동할 수 없습니다.
items.amulet.ascent_title=역행
items.amulet.ascent_desc=당신은 요그제바의 끔찍하리만치 강력한 힘이 부적을 통해 표출됨을 느낍니다. 필멸자인 채로 던전을 역행하는 것은 쉽지만은 않을 겁니다!\n\n부적을 가진 채로 던전을 역행할수록 아뮬렛의 저주 또한 강력해집니다. 층을 뛰어넘는 효과는 차단되며, 게임에서 승리하려면 던전을 직접 역행하여 탈출해야만 합니다!\n\n지금 부적을 버려 역행 저주 효과를 방지하거나, 부적을 발동하여 게임을 바로 끝낼 수 있습니다.
items.amulet.ascent_yes=계속한다!
items.amulet.ascent_no=오늘은 여기까지
items.amulet.discover_hint=이 아이템은 던전의 가장 밑바닥에 있습니다...

items.ankh.name=앙크
items.ankh.ac_bless=축복한다
items.ankh.bless=당신은 앙크를 마력 깃든 물로 축복했다.
items.ankh.desc=영생을 상징하는 고대의 물건으로 소유자의 생명을 되살릴 수 있는 능력이 있습니다. 부활하면서 대부분의 아이템이 당신이 죽은 곳에 떨어지지만, 다시 돌아가서 획득할 수 있습니다. 가득 찬 물통을 사용해 앙크를 축복하여 강화할 수 있습니다.
items.ankh.desc_blessed=영생을 상징하는 고대의 물건으로 소유자가 죽으면 되살릴 수 있는 능력이 있습니다. 이 앙크는 축복을 받았으며 더 강력한 효과를 가집니다. 앙크는 당신이 죽을 위기에 처했을 때 스스로를 희생하여 소유자를 구원합니다.
items.ankh.discover_hint=이 아이템은 상점에서 살 수 있습니다.

items.arcaneresin.name=신비한 송진
items.arcaneresin.prompt=마법 막대를 선택하세요
items.arcaneresin.ac_apply=칠한다
items.arcaneresin.level_too_high=그 마법 막대는 송진으로 성능을 향상하기에는 너무 강력하다.
items.arcaneresin.not_enough=강화에 필요한 송진이 부족하다!
items.arcaneresin.apply=당신은 마법 막대에 송진을 칠해 성능을 강화했다!
items.arcaneresin.desc=이 고운 가루는 보라색과 하얀색으로 은은하게 빛나고 있습니다. 이 가루를 마법 막대에 바르면 막대의 마력을 증폭시켜 강화 수치가 증가합니다!\n\n마법 막대를 강화할 때 이전의 강화 수치에 따라 1,2,3개의 송진을 소모합니다. 마법 막대는 송진으로 최대 +3까지 강화할 수 있습니다.\n\n(강화의 주문서와 같은) 다른 강화 효과가 적용될 경우 송진 강화가 덮어씌워지며, 마법사의 지팡이에 마법 막대를 융합할 때 송진으로 얻은 강화 수치는 무시합니다.
items.arcaneresin.discover_hint=이 아이템은 연금술로 만들 수 있습니다.

items.brokenseal.name=부러진 인장
items.brokenseal.ac_affix=인장을 붙인다
items.brokenseal.prompt=붙일 갑옷을 선택하세요
items.brokenseal.unknown_armor=먼저 갑옷이 저주받았는지 확인해야 합니다.
items.brokenseal.cursed_armor=인장은 저주받은 방어구에 붙일 수 없다.
items.brokenseal.affix=갑옷에 인장을 붙였다!
items.brokenseal.desc=갑옷에 붙여 용맹함을 자랑할 수 있는 밀랍 인장입니다. 중앙에는 보호의 룬이 새겨져 있고, 한 가운데에 갈라진 틈이 있습니다.\n\n고향의 보물인 이 인장은 전사의 인내력을 강화합니다. 인장이 붙은 갑옷을 입은 전사는 체력이 절반 이하로 감소할 때 자동으로 대량의 방어막을 얻습니다.\n\n이 인장은 _갑옷에 붙일 수 있으며, 여러 갑옷에 옮겨 붙일 수 있습니다._ 인장이 붙은 채로 방어구를 강화하면 인장을 1회까지 강화할 수 있으며, 강화된 인장이 붙은 방어구는 1만큼의 추가 강화 수치를 얻습니다.
items.brokenseal.inscribed=인장에 _%s_ 가 새겨져 있습니다.
items.brokenseal.choose_title=상형문자를 선택하세요
items.brokenseal.choose_desc=해당 갑옷과 부러진 인장에 모두 상형문자가 부여되어 있습니다. 보존할 상형문자를 선택해주세요.\n\n갑옷 상형문자: %1$s\n부러진 인장 상형문자: %2$s\n\n갑옷에 부여된 상형문자를 보존할 경우, 이후 인장을 옮길 때 그 상형문자를 같이 옮기지 않습니다.
items.brokenseal.discover_hint=특정 영웅이 이 아이템을 가지고 시작합니다.
items.brokenseal$warriorshield.name=전사의 방어막
items.brokenseal$warriorshield.desc_active=전사의 부러진 인장이 인내력을 끌어올려 현재 체력에 더하여 추가 방어막을 제공하였습니다. 방어막 소진 후 재사용 대기 시간이 있습니다.\n\n이 방어막은 서서히 사라지지 않지만, 주변에 적이 없을 시 몇턴 후 사라집니다. 소모되지 않은 방어막은 재사용 대기 시간을 최대 50%%까지 줄입니다.\n\n남은 방어막: %1$d.\n\n현재 재사용 대기 시간: %2$d.
items.brokenseal$warriorshield.desc_cooldown=최근 부러진 인장으로부터 방어막을 제공받았으며, 다시 사용하기 전까지 기다려야 합니다.\n\n남은 턴 수: %d.
items.brokenseal$warriorshield.desc_negative_cooldown=현재 전사의 방어막 재사용 대기 시간이 음수가 되었으며, 방어막이 작동할 때 재사용 대기 시간이 그만큼 감소합니다. 방어막 재사용 대기 시간은 -150턴까지 줄일 수 있으며, 이 경우 방어막이 활성화되었을 때 다음 방어막이 즉시 준비됩니다.\n\n현재 재사용 대기 시간: %d.

items.dewdrop.name=이슬
items.dewdrop.already_full=당신은 이미 최대 체력입니다.
items.dewdrop.desc=수정같이 깨끗한 이슬입니다.\n\n이 장소의 마법의 영향으로 인해, 순수한 물은 약한 회복 효과를 가집니다.

items.equipableitem.curse_detected=당신은 이 아이템이 저주받은 것임을 가까스로 직감했다!
items.equipableitem.unequip_cursed=당신은 저주받은 장비를 벗을 수 없다!
items.equipableitem.ac_equip=착용한다
items.equipableitem.ac_unequip=해제한다

items.energycrystal.name=에너지 결정
items.energycrystal.desc=연금술 에너지로 채워진 작은 마법 수정의 집합입니다.\n\n이 수정들은 연금술 레시피에서 흔하게 사용되는 재료이며, 연금술 솥에서 소모품을 분해해 얻을 수도 있습니다.

items.gold.name=금화
items.gold.desc=금화가 쌓인 더미입니다. 나중에 상점에서 사용할 수 있도록 금화를 모으십시오.

items.heap.for_sale=%1$dg: %2$s
items.heap.chest=보물 상자
items.heap.chest_desc=열기 전까진 안에 무엇이 들어있는지 알 수 없다!
items.heap.locked_chest=잠긴 보물 상자
items.heap.locked_chest_desc=열기 전엔 안에 무엇이 들어있는지 알 수 없다! 여는 데 황금 열쇠가 필요하다.
items.heap.crystal_chest=수정 보물 상자
items.heap.crystal_chest_desc=안에 _%s_이(가) 들어있는 것이 보이지만, 상자를 여는 데 수정 열쇠가 필요하다.
items.heap.artifact=마법 깃든 유물
items.heap.wand=마법 막대
items.heap.ring=반지
items.heap.tomb=무덤
items.heap.tomb_desc=이 고대 무덤 속엔 왠지 쓸만한 물건이 들어 있을 것 같다. 하지만 대부분 무덤 주인은 파헤쳐지는걸 싫어할 것이다.
items.heap.skeleton=해골 잔해
items.heap.skeleton_desc=불행한 모험가가 남긴 모든 것이 이 잔해에 있다. 귀중품이 있는지 뒤져볼 만한 가치가 있어 보인다.
items.heap.remains=영웅의 유해
items.heap.remains_desc=당신의 전임자의 잔해. 귀중품이 있는지 뒤져 볼 만한 가치가 있어 보인다.

items.honeypot.name=꿀단지
items.honeypot.ac_shatter=깨트린다
items.honeypot.desc=이 커다란 꿀단지는 꿀만으로 채워진 대신, 거대한 벌을 담고 있습니다! 벌들은 보통 무리를 지어 벌집에서 살기 때문에, 이 단지는 벌을 가두기 위한 함정일 수도 있습니다. 벌은 단지 안의 꿀에 만족한 모습이지만, 당신이 쳐다보면 조심스럽게 윙윙거리는 소리를 들을 수 있습니다.
items.honeypot$shatteredpot.name=깨진 꿀단지
items.honeypot$shatteredpot.desc=이 단지는 이미 깨져 벼렸고, 벽을 타고 흐르는 끈적한 꿀들만 형태를 유지하도록 하며, 그마저도 천천히 분리되고 있습니다.\n\n단지는 이미 깨져 버렸지만, 벌은 여전히 단지를 지키려고 하고 있습니다.

items.item.prompt=던질 방향을 선택하세요
items.item.ac_drop=떨어트린다
items.item.ac_throw=던진다
items.item.rankings_desc=%s에 의해 사망
items.item.curse=저주
items.item.custom_note_type=이 아이템의 종류에 대해 "_%s_" 라고 메모하였습니다.
items.item.custom_note=이 아이템에 "_%s_" 라고 적어 놓았습니다.
items.item.discover_hint=이 아이템은 던전에서 무작위로 등장합니다.

items.kindofmisc.unequip_title=뺄 아이템을 선택하세요
items.kindofmisc.unequip_message=이 장비들 중 하나를 해제해야 합니다. 바꿀 장비를 선택하세요.

items.kindofweapon.swift_equip=당신은 재빠르게 무기를 장비했다.
items.kindofweapon.equip_cursed=손가락이 제멋대로 무기를 움켜쥐었다.
items.kindofweapon.which_equip_msg=어떤 슬롯에 무기를 장착할 건가요?\n\n챔피언은 주 무기로만 공격하지만, 무기의 능력은 두 무기 모두 사용이 가능합니다. 두 무기 모두 같은 무기 충전량을 공유합니다.\n\n챔피언은 또한 언제든지 주 무기와 보조 무기를 즉시 바꿀 수 있습니다.
items.kindofweapon.which_equip_primary=주 무기 (%s)
items.kindofweapon.which_equip_secondary=보조 무기 (%s)
items.kindofweapon.empty=없음

items.kingscrown.name=드워프 제왕의 왕관
items.kingscrown.ac_wear=착용한다
items.kingscrown.naked=불행히도, 왕관의 힘으로 속옷까지 변화시킬 수는 없습니다.
items.kingscrown.upgraded=당신의 방어구가 변화함에 따라, 왕관은 밝게 빛나다가 산산조각나 버렸다!
items.kingscrown.ratgraded=쥐 대왕의 앞발이 밝게 빛나며 당신의 갑옷이 변화했다!
items.kingscrown.desc=마지막 드워프 제왕의 왕관으로, 엄청난 마법 에너지로 빛나고 있습니다.\n\n이 왕관을 착용하면 입고 있는 방어구에 마법을 전달해 _고유한 능력을 가진 전설 방어구_로 변화시킵니다. 전설 방어구는 원본 방어구의 모든 특성을 유지합니다.
items.kingscrown.discover_hint=이 아이템은 특정한 적이 떨어트립니다.

items.liquidmetal.name=액체 금속
items.liquidmetal.ac_apply=수리한다
items.liquidmetal.prompt=투척 무기를 선택하세요
items.liquidmetal.already_fixed=그 투척 무기는 손상된 부분이 없다!
items.liquidmetal.apply=당신은 %d개의 액체 금속으로 투척 무기를 수리했다.
items.liquidmetal.desc=이 마법 액체는 투척 무기의 금이 가거나 찢어진 부분에 스며들어, 투척 무기를 완벽한 상태로 복원합니다! 투척 무기 세트에 무기가 하나 없지만 다른 부분은 완전히 수리된 경우, 액체 금속을 사용하여 세트에서 누락된 무기를 교체할 수도 있습니다!\n\n1 티어 무기는 완전히 수리하기 위해 10개의 액체 금속이 필요하며, 5 티어 무기는 30개의 액체 금속이 필요합니다. 투척 무기를 강화할 때마다 필요한 액체 금속의 양이 35%씩 증가합니다.\n\n액체 금속은 특수 다트의 내구도는 수리할 수 없습니다.
items.liquidmetal.discover_hint=이 아이템은 연금술로 만들 수 있습니다.

items.lostbackpack.name=잃어버린 배낭
items.lostbackpack.desc=당신이 잃어버린 배낭입니다. 배낭을 주워 당신이 잃어버린 것들을 되찾으세요!

items.merchantsbeacon.name=상인의 신호기
items.merchantsbeacon.ac_use=사용한다
items.merchantsbeacon.desc=드워프 종족의 기술로 만들어진 이 이상한 물건을 사용하여 매우 먼 거리에서 통신할 수 있습니다.\n\n이 신호기를 사용하면 던전 어디에서라도 아이템을 픽셀 상점에 팔 수 있습니다.\n\n하지만, 신호기에 깃든 마법은 한 번만 사용할 수 있으니, 현명하게 사용하십시오.

items.stylus.name=신비한 바늘
items.stylus.ac_inscribe=새긴다
items.stylus.prompt=붙일 갑옷을 선택하세요
items.stylus.identify=먼저 갑옷이 저주받았는지 확인해야 한다.
items.stylus.cursed=바늘의 마법은 저주받은 갑옷에는 무용지물이다.
items.stylus.inscribed=당신은 방어구를 바늘로 새겼다.
items.stylus.desc=이 신비한 바늘은 어두운 색의 단단한 돌로 만들어졌습니다. 이 바늘을 사용하여 방어구에 마법 상형문자를 새길 수 있습니다만, 어떠한 상형문자가 새겨지는지 알 수 없으며 오직 바늘이 새기는 대로 결정됩니다.

items.tengusmask.name=텐구의 가면
items.tengusmask.ac_wear=착용한다
items.tengusmask.used=당신에게 힘을 모두 전수한 가면은 산산조각났다!
items.tengusmask.desc=이 가면은 텐구 암살자가 죽으면서 그의 얼굴에서 떨어져 나왔습니다. 강력한 마법의 힘이 뿜어져 나오는 것이 느껴집니다. 텐구 암살자의 힘의 원천이었을까요?\n\n이 가면을 쓰면 엄청난 힘이 당신에게 전해져, _영웅의 세부 직업을 선택_할 수 있습니다.\n\n어떤 세부 직업을 선택하시겠습니까?
items.tengusmask.discover_hint=이 아이템은 특정한 적이 떨어트립니다.

items.torch.name=횃불
items.torch.ac_light=불을 붙인다
items.torch.desc=모험가의 필수 장비입니다. 던전이 어두워진다면, 횃불을 밝혀 길을 찾으십시오.

items.waterskin.name=가죽 물통
items.waterskin.ac_drink=마신다
items.waterskin.collected=당신은 이슬을 가죽 물통 안에 넣었다.
items.waterskin.full=당신의 가죽 물통이 가득 찼다!
items.waterskin.empty=당신의 가죽 물통이 텅 비었다!
items.waterskin.desc=코르크로 입구를 봉한 가죽 물통입니다.
items.waterskin.desc_water=이 가죽 물통에는 약간의 식수밖에 남아 있지 않습니다. 던전을 뒤지다 보면 물병에 대신 담을 만한 무언가가 분명 있을 것입니다.
items.waterskin.desc_heal=가죽 물통에 회복 효과가 있는 물을 담았습니다. 가죽 물통에 담긴 물의 양이 많을수록, 마실 때 즉시 회복하는 체력 역시 증가합니다. 항상 당신이 필요한 만큼의 물만 소모합니다.
items.waterskin.desc_full=가득 찬 가죽 물통이 에너지를 내뿜고 있는 것 같습니다. 아마 다른 생존 아이템을 축복하는 데 사용할 수 있지 않을까요?
items.waterskin.discover_hint=특정 영웅이 이 아이템을 가지고 시작합니다.

