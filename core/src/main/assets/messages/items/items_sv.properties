items.weapon.melee.roundshield.ability_name=vakt
items.weapon.melee.roundshield.typical_ability_desc=Duellanten kan _skydda_ sig själv med en rund sköld, som helt blockerar alla fysiska eller magiska attacker mot henne i _%d varv_. När duellanten har blockerat en attack, kommer en attack tillbaka eller användning av magi att avsluta bevakningen.
items.weapon.melee.roundshield.ability_desc=Duellanten kan _skydda_ sig själv med en rund sköld som helt neutraliserar alla fysiska eller magiska attacker mot henne i _%d varv_. När duellanten har blockerat en attack, kommer en attack tillbaka eller användning av magi att avsluta bevakningen.
items.weapon.melee.roundshield.upgrade_ability_stat_name=Förmågans varaktighet
