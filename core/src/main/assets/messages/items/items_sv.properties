items.weapon.melee.sai$combostriketracker.name=kombinationsattack
items.weapon.melee.sai$combostriketracker.desc=Duellisten bygger en kombo som kan användas för att öka skadan med förmågan kombinationsattack. Varje lyckad vanlig närstrids- eller kastvapenattack räknas, men om du inte lyckas attackera på 5 varv återställs den här kombinationen.\n\nRedan gjorda träffar: %1$d.\n\nTur tills träffarna förloras: %2$s.

items.weapon.melee.scimitar.name=krumsabel
