items.weapon.missiles.darts.dart.prompt=Välj ett frö
items.weapon.missiles.darts.dart.tip_title=Tippa pilar
items.weapon.missiles.darts.dart.tip_desc=Ett frö kan kombineras med en eller två dartpilar för att tippa dem. Varje typ av frö producerar sin egen typ av spetsad pil, med en unik engångseffekt.\n\nSpetsar du en pil med dessa frön får du en _%s._
items.weapon.missiles.darts.dart.tip_all=spetsa %1$d pilar med %2$d frön
items.weapon.missiles.darts.dart.tip_two=tip 2 dartpilar med 1 frö
items.weapon.missiles.darts.dart.tip_one=tips 1 pil med 1 frö
items.weapon.missiles.darts.dart.tip_cancel=avbryt
items.weapon.missiles.darts.dart.desc=Dessa enkla skaft av trä med spikspetsar är viktade för att flyga rätt och sticka sitt byte med en handledsrörelse. De kan toppas med frön för att få bonuseffekter när de kastas.
items.weapon.missiles.darts.dart.unlimited_uses=Tack vare sin enkla konstruktion håller dartpilarna i princip för evigt.

items.weapon.missiles.darts.displacingdart.name=förskjutande pil
items.weapon.missiles.darts.displacingdart.desc=Dessa pilar är spetsade med en fadeleaf-baserad förening som kommer att teleportera sitt mål ett kort avstånd bort.

items.weapon.missiles.darts.healingdart.name=läkande pil
items.weapon.missiles.darts.healingdart.desc=Dessa pilar är spetsade med en solgräs-baserad förening som ger en salva av läkning till sitt mål. Själva pilen är fortfarande skadlig för fiender, men skadar inte allierade.

items.weapon.missiles.darts.holydart.name=helig pil
items.weapon.missiles.darts.holydart.desc=Dessa pilar är spetsade med en stjärnblomsbaserad förening som tillför helig energi till sitt mål. Allierade och vanliga fiender kommer att bli välsignade, men odöda eller demoniska fiender kommer att ta stor skada. Själva pilen är fortfarande skadlig för fiender, men skadar inte allierade.

items.weapon.missiles.darts.incendiarydart.name=brännande pil
items.weapon.missiles.darts.incendiarydart.desc=Dessa pilar är spetsade med en eldblomsbaserad blandning som spricker i lysande lågor vid träff.

items.weapon.missiles.darts.paralyticdart.name=paralytisk pil
items.weapon.missiles.darts.paralyticdart.desc=Dessa pilar är spetsade med en jordrotsbaserad förening som förlamar målet under en kort tid.

items.weapon.missiles.darts.poisondart.name=Giftpil
items.weapon.missiles.darts.poisondart.desc=Dessa pilar är spetsade med en sorrowmoss-baserad förening som förgiftar målet.

items.weapon.missiles.darts.rotdart.name=rotpil
items.weapon.missiles.darts.rotdart.desc=De här elaka pilarna är spetsade med en syrlig rotbärsbaserad förening som aggressivt äter sig igenom allt som pilen kommer i kontakt med. Kraftfulla fiender kommer att motstå det mesta av effekten, men korrosionen är tillräckligt stark för att enkelt döda de flesta standardfiender. Dessa varar längre än andra pilar med spets, men deras hållbarhet kan inte ökas.
items.weapon.missiles.darts.rotdart.discover_hint=Du kan skapa det här föremålet med hjälp av ett frö från ett specifikt uppdrag.

items.weapon.missiles.darts.shockingdart.name=shockpil
items.weapon.missiles.darts.shockingdart.desc=De här pilarna är spetsade med en stormvinbaserad förening som ger en otäck chock till sitt mål.

items.weapon.missiles.darts.tippeddart.ac_clean=REN
items.weapon.missiles.darts.tippeddart.clean_title=Rena pilar
items.weapon.missiles.darts.tippeddart.clean_desc=Den här åtgärden tar bort frötippningen på dina dartpilar och återställer dem till vanliga dartpilar.
items.weapon.missiles.darts.tippeddart.clean_all=rengör alla
items.weapon.missiles.darts.tippeddart.clean_one=en ren
items.weapon.missiles.darts.tippeddart.cancel=avbryt
items.weapon.missiles.darts.tippeddart.uses_left=Den här stapeln med pilar har _%d/%d_ användningar kvar innan en spets slits av.
items.weapon.missiles.darts.tippeddart.unlimited_uses=_Men dessa är av så hög kvalitet att de i praktiken kommer att vara för evigt.
items.weapon.missiles.darts.tippeddart.about_to_break=Din darts spets är på väg att gå ut.
items.weapon.missiles.darts.tippeddart.has_broken=Din darts spets har gått ut.
items.weapon.missiles.darts.tippeddart.discover_hint=Du kan köpa det här föremålet i en butik, eller skapa det med ett frö.


items.weapon.missiles.bolas.name=bolas
items.weapon.missiles.bolas.stats_desc=Detta vapen förlamar sitt mål.
items.weapon.missiles.bolas.desc=Dessa ovanliga distansvapen är inte särskilt skadliga, men är utmärkta för att sakta ner målet.

items.weapon.missiles.boomerang.name=boomerang
items.weapon.missiles.boomerang.desc=Kastad mot fienden kommer denna platta böjda trämissil att återvända till sin kastares händer.
items.weapon.missiles.boomerang.durability=På grund av sin solida konstruktion kommer denna bumerang inte att gå sönder av användning.

items.weapon.missiles.fishingspear.name=fiskespjut
items.weapon.missiles.fishingspear.desc=Små kastspjut som fungerar bra som improviserade vapen trots att de är avsedda för fiske.

items.weapon.missiles.forcecube.name=kraftkub
items.weapon.missiles.forcecube.ondeath=Du dödade dig själv med din egen Force Cube...
items.weapon.missiles.forcecube.stats_desc=Detta vapen sprider kraften från sitt slag över ett litet område och träffar allt i närheten.
items.weapon.missiles.forcecube.desc=Dessa magiska kuber med udda form är tillräckligt små för att rymmas i handen, men otroligt tunga.

items.weapon.missiles.heavyboomerang.name=tung bumerang
items.weapon.missiles.heavyboomerang.stats_desc=Detta vapen återvänder till den plats det kastades från efter fem turer.
items.weapon.missiles.heavyboomerang.desc=Denna stora bumerang är svår att hantera effektivt, men orsakar betydande skada.

items.weapon.missiles.javelin.name=spjut
items.weapon.missiles.javelin.desc=Dessa större kastspjut är viktade för att hålla spetsen på spetsen i främsta rummet när de seglar genom luften.

items.weapon.missiles.kunai.name=kunai
items.weapon.missiles.kunai.stats_desc=Det här vapnet är starkare mot ovetande fiender.
items.weapon.missiles.kunai.desc=Dessa små knivar är mycket kraftfulla i händerna på en skicklig användare.

items.weapon.missiles.missileweapon.stats_known=Denna uppsättning kastvapen av typen _tier-%1$d_ orsakar _%2$d-%3$d skada_ och kräver _%4$d styrka_ för att användas.
items.weapon.missiles.missileweapon.stats_unknown=Vanligtvis orsakar denna uppsättning kastvapen av typen _tier-%1$d_%2$d -%3$d skada_ och kräver _%4$d styrka_ för att användas.
items.weapon.missiles.missileweapon.stats_desc=
items.weapon.missiles.missileweapon.probably_too_heavy=Det här vapnet är troligen för tungt för dig.
items.weapon.missiles.missileweapon.distance=Kastvapen är mer precisa på längre avstånd, men mindre precisa på nära håll.
items.weapon.missiles.missileweapon.durability=Kastade vapen kommer att slitas ut och gå sönder när de används.
items.weapon.missiles.missileweapon.uses_left=Denna uppsättning kastvapen har _%d/%d_ användningar kvar innan ett går sönder.
items.weapon.missiles.missileweapon.unlimited_uses=Denna uppsättning är av så hög kvalitet att den i praktiken kommer att hålla för evigt.
items.weapon.missiles.missileweapon.unknown_uses=Vanligtvis kan denna uppsättning kastvapen användas _%d_ gånger innan ett av dem går sönder.
items.weapon.missiles.missileweapon.curse_discover=Detta kastvapen är förhäxat!
items.weapon.missiles.missileweapon.about_to_break=Ditt kastvapen är på väg att gå sönder.
items.weapon.missiles.missileweapon.has_broken=Ett av dina kastade vapen har gått sönder.
items.weapon.missiles.missileweapon.dust=Det kastade vapnet smulas sönder till damm när du rör vid det.
items.weapon.missiles.missileweapon.break_upgraded_warn_desc=Om det sista kastvapnet i din förbättrade kastvapensats går sönder kommer satsen att gå förlorad permanent. Är du säker på att du vill kasta det?
items.weapon.missiles.missileweapon.break_upgraded_warn_yes=Ja
items.weapon.missiles.missileweapon.break_upgraded_warn_no=Nej
items.weapon.missiles.missileweapon$placeholder.name=Kastat vapen

items.weapon.missiles.shuriken.name=shuriken
items.weapon.missiles.shuriken.stats_desc=Shurikens kan kastas omedelbart med en nedkylningstid på 20 turer.
items.weapon.missiles.shuriken.desc=Dessa stjärnformade metallbitar med rakbladsvassa blad kan kastas snabbt medan man är i rörelse.
items.weapon.missiles.shuriken$shurikeninstanttracker.name=Nedkylningstid för shuriken
items.weapon.missiles.shuriken$shurikeninstanttracker.desc=Du har nyligen kastat en shuriken och måste vänta innan du kan göra det igen. Shuriken kan fortfarande kastas, men med normal vapens hastighet.\n\nÅterstående turer: %s.

items.weapon.missiles.throwingclub.name=Kastklubba
items.weapon.missiles.throwingclub.stats_desc=Detta vapen fastnar inte på fiender och kan samlas upp direkt.
items.weapon.missiles.throwingclub.desc=Ett ganska enkelt men hållbart kastvapen, i princip en stor sten fäst vid en pinne.

items.weapon.missiles.throwinghammer.name=kasthammare
items.weapon.missiles.throwinghammer.stats_desc=Detta vapen fastnar inte på fiender och kan samlas upp direkt.
items.weapon.missiles.throwinghammer.desc=Dessa tunga hammare är utformade för att kastas mot fienden. Deras släta konstruktion helt i metall gör dem mycket hållbara.

items.weapon.missiles.throwingknife.name=Kastkniv
items.weapon.missiles.throwingknife.stats_desc=Det här vapnet är starkare mot ovetande fiender.
items.weapon.missiles.throwingknife.desc=Dessa lätta knivar är balanserade så att de flyger genom luften och träffar sitt mål.
items.weapon.missiles.throwingknife.discover_hint=En av hjältarna börjar med detta föremål.

items.weapon.missiles.throwingspear.name=kastspjut
items.weapon.missiles.throwingspear.desc=Dessa lätta spjut har tunna ramar som är utformade för att kastas, inte för att stickas.

items.weapon.missiles.throwingspike.name=Kastspjut
items.weapon.missiles.throwingspike.desc=Dessa hållbara spetsiga metallspjut är avsedda att kastas mot fiender på avstånd.
items.weapon.missiles.throwingspike.discover_hint=En av hjältarna börjar med detta föremål.

items.weapon.missiles.throwingstone.name=kaststen
items.weapon.missiles.throwingstone.desc=Dessa stenar slipas ned så att de kan kastas med större kraft än vanliga stenar.
items.weapon.missiles.throwingstone.discover_hint=En av hjältarna börjar med det här föremålet.

items.weapon.missiles.tomahawk.name=tomahawk
items.weapon.missiles.tomahawk.stats_desc=Detta vapen orsakar _%1$d-%2$d blödning_ på sitt mål.
items.weapon.missiles.tomahawk.typical_stats_desc=Detta vapen orsakar vanligtvis _%1$d-%2$d blödning_ på sitt mål.
items.weapon.missiles.tomahawk.desc=Dessa kastyxor har en tandad egg som sliter sönder när de fastnar i fienden.

items.weapon.missiles.trident.name=trident
items.weapon.missiles.trident.desc=Massiva kastspjut med tre dödliga spetsar i änden. De är kraftfulla, men ganska tunga.


items.weapon.spiritbow.name=andebåge
items.weapon.spiritbow.ac_shoot=SHOOT
items.weapon.spiritbow.prompt=Välj ett mål
items.weapon.spiritbow.stats=Bågen kan inte direkt uppgraderas, utan blir istället stadigt starkare i takt med att du går upp i nivå. På din nuvarande nivå kommer pilar som skjuts från bågen att ge _%1$d-%2$d skada_ och kräva _%3$d styrka_ för att användas korrekt.
items.weapon.spiritbow.desc=En båge gjord av uråldrigt magiskt trä. Bågens sträng och etsningar lyser med ett blekt blått ljus. När man drar i strängen frammanar bågen en magisk pil som kan avfyras mot en fiende.
items.weapon.spiritbow.discover_hint=En av hjältarna börjar med det här föremålet.

items.weapon.weapon.identify=Du är nu tillräckligt bekant med ditt vapen för att identifiera det.
items.weapon.weapon.too_heavy=På grund av din otillräckliga styrka kommer det här vapnet att hindra din attackhastighet, precision och förmåga till överraskningsattack.
items.weapon.weapon.excess_str=På grund av din överlägsna styrka kommer du att åstadkomma _0-%d bonusskada_ med detta vapen.
items.weapon.weapon.hardening_gone=Härdningen på det här vapnet har försvunnit!
items.weapon.weapon.incompatible=Interaktion av olika typer av magi har upphävt förtrollningen på det här vapnet!
items.weapon.weapon.cursed_worn=Eftersom det här vapnet är förbannat kan du inte ta bort det.
items.weapon.weapon.cursed=Du kan känna en illvillig magi lura inom detta vapen.
items.weapon.weapon.weak_cursed=Trots förbannelsen kan du utrusta det här vapnet.
items.weapon.weapon.not_cursed=Detta vapen är fritt från illvillig magi.
items.weapon.weapon.faster=Det är förstärkt för att förbättra _hastigheten._
items.weapon.weapon.stronger=Det är förstärkt för att förbättra _damage._
items.weapon.weapon.enchanted=Det har en _%s._
items.weapon.weapon.enchant_hardened=Det har blivit _härdat._
items.weapon.weapon.hardened_no_enchant=Det här vapnet har blivit _härdat,_ men är för närvarande inte förtrollat.
items.weapon.weapon$enchantment.enchant=förtrollning
items.weapon.weapon$enchantment.rankings_desc=Dödades av en förtrollning
items.weapon.weapon$enchantment.discover_hint=Du kan hitta ett föremål med den här effekten slumpmässigt i fängelsehålan, eller försöka använda den på ett föremål själv.


###misc items
items.amulet.name=amulett av yendor
items.amulet.ac_end=Sluta spelet
items.amulet.desc=Yendors amulett är den mest kraftfulla artefakt som människor och dvärgar känner till. Dess skimrande kristaller innehåller otrolig och förunderlig kraft.
items.amulet.desc_origins=Amulettens ursprung är okänt. Historien säger att dvärgarnas kung skröt med att han hade upptäckt artefakten strax innan den dvärgiska civilisationen avbröt all kontakt. Hur hittade han den? Hur tog Yog-Dzewa den ifrån honom? Frågor för en annan gång kanske, allt som betyder något nu är att amuletten är din!
items.amulet.desc_ascent=Amulettens ursprung är okänt, men det är tydligt att den har påverkats starkt av Yog-Dzewas kraft. Fängelsehålan verkar böja sig efter Yogs vilja när du rör dig genom den, vilket gör fienderna mycket mer rikliga och kraftfulla! Du kan inte heller längre aktivera eller kasta amuletten, nästan som om den är förbannad.
items.amulet.ascent_title=Ascension
items.amulet.ascent_desc=Du börjar känna Yog-Dzewas stora och fruktansvärda kraft stråla ut från amuletten. Att ta sig tillbaka genom fängelsehålan som dödlig kan vara svårare än du trodde!\n\nOm du fortsätter att ta dig upp med amuletten kommer fängelsehålan att bli farligare, teleporter mellan våningarna kommer att inaktiveras och du kommer bara att kunna vinna spelet genom att besegra fiender när du tar dig upp genom fängelsehålan!\n\nDu kan lämna amuletten här tills vidare om du vill ta dig upp utan att starta den här utmaningen, eller aktivera amuletten innan du tar dig upp för att avsluta spelet normalt.
items.amulet.ascent_yes=Fortsätt!
items.amulet.ascent_no=Stoppa för tillfället
items.amulet.discover_hint=Du kan hitta det här föremålet längst ner i fängelsehålan...

items.ankh.name=ankh
items.ankh.ac_bless=BLESS
items.ankh.bless=Du välsignar ankh med magiskt vatten.
items.ankh.desc=Den här uråldriga odödlighetssymbolen ger dig förmågan att återvända till livet efter döden. De flesta föremål kommer att tappas där du dog, men kan återvinnas om du återvänder till det. Med hjälp av ett fullt vattenskinn kan ankh välsignas med extra styrka.
items.ankh.desc_blessed=Den här uråldriga symbolen för odödlighet ger förmågan att återvända till livet efter döden. Ankh har blivit välsignad och är nu mycket starkare. Ankh kommer att offra sig själv för att rädda dig i ett ögonblick av dödlig fara.
items.ankh.discover_hint=Du kan köpa det här föremålet i en butik.

items.arcaneresin.name=arcane harts
items.arcaneresin.prompt=Välj en trollstav
items.arcaneresin.ac_apply=TILLÄMPA
items.arcaneresin.level_too_high=Den här trollstaven är för kraftfull för att resin ska kunna förbättra den.
items.arcaneresin.not_enough=Du har inte tillräckligt med harts för det!
items.arcaneresin.apply=Du täcker din trollstav med resin, vilket ökar dess kraft!
items.arcaneresin.desc=Detta fina pulver skimrar mellan nyanser av lila och vitt. Det kan fungera som en förstärkare av magiska energier och ökar nivån på trollstavar när det appliceras på dem!\n\nAtt uppgradera en trollstav kostar 1, 2 eller 3 resin beroende på trollstavens ursprungliga nivå. Resin kan uppgradera trollstavar till maximalt +3.\n\nResinuppgraderingar _åsidosätts dock av andra uppgraderingskällor_ (såsom uppgraderingsrullar) och gäller inte när en trollstav impregneras i Magikerns stav.
items.arcaneresin.discover_hint=Du kan tillverka detta föremål via alkemi.

items.brokenseal.name=bruten försegling
items.brokenseal.ac_affix=AFFIX
items.brokenseal.prompt=Välj en rustning
items.brokenseal.unknown_armor=Du måste först identifiera om rustningen är förbannad eller inte.
items.brokenseal.cursed_armor=Seglet kommer inte att gälla för förbannad rustning.
items.brokenseal.affix=Du fäster sigillet på din rustning!
items.brokenseal.desc=En vaxsigill som fästs på rustningen som en symbol för tapperhet. Den har en bleknad skyddsruna ingraverad i mitten och är sprucken på mitten.\n\n\nSigillet är ett minne från hans hem och hjälper krigaren att hålla ut. Vid bärandet av sigillet kommer krigaren omedelbart att få sköld när han är på väg att skadas till halv hälsa eller lägre.\n\nSigillet kan _fästas på rustning,_ och flyttas mellan rustningar. Den kan bära med sig en enda uppgradering, så länge som uppgraderingen applicerades på rustningen vid tiden då sigillet satt på den.
items.brokenseal.inscribed=Sigillet är inskrivet med en _%s._
items.brokenseal.choose_title=Välj en glyf
items.brokenseal.choose_desc=Både den här rustningen och det trasiga sigillet bär på en glyf. Välj vilken glyf som ska behållas.\n\nArmor Glyph: %1$s\nBroken Seal Glyph: %2$s\n\nObservera att om du väljer den glyf som för närvarande finns på rustningen, kommer förseglingen inte att kunna överföra den senare.
items.brokenseal.discover_hint=En av hjältarna börjar med det här föremålet.
items.brokenseal$warriorshield.name=Krigarsköld
items.brokenseal$warriorshield.desc_active=Krigarens brutna sigill hjälper honom för närvarande att hålla ut och ger honom en sköld utöver hans hälsa. Det finns en nedkylningstid efter att skölden initialt utlösts innan den kan användas igen.\n\nDen här skölden förfaller inte över tid, men upphör om inga fiender är i närheten under några varv. När den slutar kommer oanvänd sköld att minska nedräkningen, upp till max 50%%.n\n\nResterande sköld: %1$d.\n\nAktuell nedräkning: %2$d.
items.brokenseal$warriorshield.desc_cooldown=Krigaren har nyligen fått sköld från sitt brutna sigill, och måste vänta tills han kan dra nytta av dess sköldeffekt igen.\n\nÅterstående turer: %d.
items.brokenseal$warriorshield.desc_negative_cooldown=Nedkylningstiden för Krigarens sköld är för närvarande negativ, vilket innebär att när hans sköld aktiveras kommer nedkylningstiden att vara lägre än de vanliga 150 turerna. Sköldens nedkylningstid kan reduceras till så lågt som -150 turer, vilket innebär att den omedelbart blir tillgänglig igen när den har aktiverats.\n\nNuvarande nedkylningstid: %d.

items.dewdrop.name=daggdroppe
items.dewdrop.already_full=Du har redan full hälsa.
items.dewdrop.desc=En kristallklar daggdroppe.\n\nPå grund av magin på denna plats har rent vatten mindre återställande egenskaper.

items.equipableitem.curse_detected=Du känner att det vilar en förbannelse över föremålet precis innan du utrustar det!
items.equipableitem.unequip_cursed=Du kan inte ta bort ett förbannat föremål!
items.equipableitem.ac_equip=ANVÄND
items.equipableitem.ac_unequip=ANVÄND INTE

items.energycrystal.name=energikristall
items.energycrystal.desc=En samling små magiska kristaller, fyllda med alkemisk energi.\n\nDessa kristaller är den vanligaste ingrediensen i alkemirecept och kan produceras i en alkemikruka genom att skrota förbrukningsvaror.

items.gold.name=guld
items.gold.desc=En hög med guldmynt. Samla guldmynt för att spendera dem senare i en butik.

items.heap.for_sale=%1$dg: %2$s
items.heap.chest=Kista
items.heap.chest_desc=Du vet inte vad som finns i den förrän du öppnar den!
items.heap.locked_chest=Låst kista
items.heap.locked_chest_desc=Du vet inte vad som finns i den förrän du har öppnat den! Men för att öppna den behöver du en gyllene nyckel.
items.heap.crystal_chest=Kristallkista
items.heap.crystal_chest_desc=Du kan se _%s_ inuti, men för att öppna kistan behöver du en kristallnyckel.
items.heap.artifact=En artefakt
items.heap.wand=en trollstav
items.heap.ring=en ring
items.heap.tomb=Tomb
items.heap.tomb_desc=Den här uråldriga graven kan innehålla något användbart, men dess ägare kommer med största sannolikhet att motsätta sig kontroll.
items.heap.skeleton=Skelettdelar
items.heap.skeleton_desc=Det här är allt som finns kvar av en olycklig äventyrare. Det kanske är värt att leta efter värdesaker.
items.heap.remains=Hjältens kvarlevor
items.heap.remains_desc=Det här är allt som finns kvar av en av dina föregångare. Det kanske är värt att leta efter värdesaker.

items.honeypot.name=honeypot
items.honeypot.ac_shatter=SHATTER
items.honeypot.desc=Den här stora honungskrukan är egentligen bara fylld med honung, istället rymmer den ett jättebi! Den här typen av massiva bin håller sig vanligtvis i sina bikupor, kanske är krukan någon form av specialiserad fångstbur? Biet verkar ganska tillfreds i krukan med sin honung, och surrar försiktigt när man tittar på det.
items.honeypot$shatteredpot.name=shattered honeypot
items.honeypot$shatteredpot.desc=Krukan har krossats, bara den klibbiga honungen på väggarna håller ihop den, och den faller långsamt isär.\n\nTrots sitt trasiga tillstånd verkar biet fortfarande vilja skydda krukan.

items.item.prompt=Välj riktning för kast
items.item.ac_drop=SLÄPP
items.item.ac_throw=KASTA
items.item.rankings_desc=Dödad av: %s
items.item.curse=förbanna
items.item.custom_note_type=Den här typen av föremål har en egen anteckning: "_%s_"
items.item.custom_note=Detta föremål har en egen anteckning: "_%s_"
items.item.discover_hint=Du kan hitta det här föremålet slumpmässigt i fängelsehålan.

items.kindofmisc.unequip_title=Avlägsna ett föremål från utrustningen
items.kindofmisc.unequip_message=Du måste först byta ut ett av de här föremålen. Välj ett föremål att byta med.

items.kindofweapon.swift_equip=Du utrustar snabbt ditt vapen.
items.kindofweapon.equip_cursed=Ditt grepp stramas ofrivilligt åt runt vapnet.
items.kindofweapon.which_equip_msg=Vilken vapenplats vill du utrusta det här föremålet till?\n\nKämpen attackerar direkt med sitt primära vapen, men kan använda förmågan hos vilket som helst av vapnen. Båda vapnen har samma laddningsantal.\n\nKämpen kan också byta sitt primära och sekundära vapen direkt.
items.kindofweapon.which_equip_primary=Primär (%s)
items.kindofweapon.which_equip_secondary=Sekundär (%s)
items.kindofweapon.empty=tom

items.kingscrown.name=Dvärgkungens krona
items.kingscrown.ac_wear=WEAR
items.kingscrown.naked=Olyckligtvis kan inte kronan förvandla dina underkläder.
items.kingscrown.upgraded=Kronan lyser starkt och sönderfaller sedan när din rustning förvandlas!
items.kingscrown.ratgraded=Råttkungens tassar lyser starkt när din rustning förvandlas!
items.kingscrown.desc=Den siste dvärgkungens krona, den lyser med enorm magisk energi.\n\nNär den bärs kommer kronans magi att flöda in i den rustning du för närvarande bär och förvandla den till en _unik episk rustning med speciella förmågor._ Den nya rustningen kommer att behålla alla egenskaper hos den ursprungliga rustningen.
items.kingscrown.discover_hint=Du kan få det här föremålet som en droppe från vissa fiender.

items.liquidmetal.name=flytande metall
items.liquidmetal.ac_apply=APPPLY
items.liquidmetal.prompt=Välj ett kastat vapen
items.liquidmetal.already_fixed=Det där kastvapnet är redan i perfekt skick!
items.liquidmetal.apply=Du använder %d flytande metall för att reparera ditt kastvapen.
items.liquidmetal.desc=Denna magiska vätska kan fylla sprickor och revor på ett kastvapen och återställa det till perfekt skick! Om en vapensats saknar ett vapen men i övrigt är helt reparerad, kan flytande metall till och med användas för att ersätta ett saknat vapen i satsen!\n\nEtt vapen av nivå 1 kräver 10 flytande metall för att repareras helt, ett vapen av nivå 5 kräver 30. Varje uppgradering ökar också mängden metall som behövs med 35%.\n\nFlytande metall kan inte användas för att reparera spetsarna på spetsiga pilar.
items.liquidmetal.discover_hint=Du kan tillverka detta föremål via alkemi.

items.lostbackpack.name=förlorad ryggsäck
items.lostbackpack.desc=Det här är din förlorade inventarie. Samla in den för att återfå alla föremål som du har förlorat!

items.merchantsbeacon.name=handlarens fyr
items.merchantsbeacon.ac_use=användning
items.merchantsbeacon.desc=Den här udda dvärgteknologin låter dig kommunicera på stora avstånd.\n\nEfter att ha aktiverats låter den här fyren dig sälja föremål till Pixel Mart från var som helst i fängelsehålan.\n\nMagin i fyren varar dock bara i en session, så använd den klokt.

items.stylus.name=arcane stylus
items.stylus.ac_inscribe=INSCRIBE
items.stylus.prompt=Välj en rustning
items.stylus.identify=Du måste först identifiera om rustningen är förbannad.
items.stylus.cursed=Pennans magi fungerar inte på fördömda rustningar.
items.stylus.inscribed=Du skrev in din rustning med pennan.
items.stylus.desc=Den här arkaiska pennan är gjord av en mörk, mycket hård sten. Med den kan du rista in en magisk glyf på din rustning, men du har ingen makt att välja vilken glyf det ska vara, det bestämmer pennan åt dig.

items.tengusmask.name=Tengus mask
items.tengusmask.ac_wear=WEAR
items.tengusmask.used=Masken upplöses när dess kraft flödar in i dig!
items.tengusmask.desc=Den här masken föll av Tengus ansikte när han dog, du kan känna stor magisk kraft strömma ut från den. Var masken Tengus källa till styrka?\n\nNär den bärs kommer maskens enorma kraft att överföras till dig, så att du kan _välja en underklass till din hjälte._\n\nVilken underklass väljer du?
items.tengusmask.discover_hint=Du kan få det här föremålet som en droppe från vissa fiender.

items.torch.name=fackla
items.torch.ac_light=LIGHT
items.torch.desc=En viktig del av äventyret, när en fängelsehåla blir mörk kan en fackla hjälpa till att visa vägen.

items.waterskin.name=vattenskinn
items.waterskin.ac_drink=DRICK
items.waterskin.collected=Du samlar in daggdroppen i ditt vattenskinn.
items.waterskin.full=Ditt vattenskinn är fullt!
items.waterskin.empty=Ditt vattenskinn är tomt!
items.waterskin.desc=En behållare för vätska, tillverkad av läder och snöre, förseglad med en korkpropp.
items.waterskin.desc_water=Just nu innehåller vattenskalet bara vanligt dricksvatten. Det finns säkert något i fängelsehålan som vattenskalet kan lagra istället.
items.waterskin.desc_heal=Vattenskinnet används för närvarande för att lagra läkande vatten. Ju mer vattenskalet är fullt, desto mer läker du omedelbart när du dricker ur det. Du kommer bara att dricka så mycket som du behöver.
items.waterskin.desc_full=Det fulla vattenskinnet verkar utstråla energi, kanske kan det användas för att välsigna ett annat överlevnadsobjekt?
items.waterskin.discover_hint=En av hjältarna börjar med det här föremålet.

