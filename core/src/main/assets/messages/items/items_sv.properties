items.weapon.melee.scimitar.ability_desc=Duellisten kan utföra en _svärddans_ med en scimitar. Denna stance tar ingen tid att aktivera och ger Duellisten +60%% attackhastighet och +50%% träffsäkerhet i _%d varv._
