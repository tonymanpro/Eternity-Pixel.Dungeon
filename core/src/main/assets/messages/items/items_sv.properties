###armor curses
items.armor.curses.antientropy.name=%s av anti-entropi
items.armor.curses.antientropy.desc=Antientropi-förbannelsen motverkar universums krafter och drar energi till bäraren och bort från omgivningen. Detta sätter kortvarigt bäraren i brand, men fryser allt runt omkring dem!

items.armor.curses.bulk.name=%s av bulk
items.armor.curses.bulk.desc=rustning of bulk ser större och mer imponerande ut, men har inte bättre rustning. Dessutom gör den extra storleken det mycket svårt att passera genom dörröppningar.

items.armor.curses.corrosion.name=%s av korrosion
items.armor.curses.corrosion.desc=Korrosionsrustning kan spricka och spruta ut frätande vätska som täcker allt i området med klibbig, sur sörja.

items.armor.curses.displacement.name=%s av förflyttning
items.armor.curses.displacement.desc=Förflyttningsförbannelsen försöker flytta bäraren till säkerhet när denne attackeras. Den är dock lite för effektiv och teleporterar användaren slumpmässigt runt i nivån.

items.armor.curses.metabolism.name=%s av metabolism
items.armor.curses.metabolism.desc=Metabolismförbannelsen omvandlar mättnad direkt till hälsa när bäraren skadas, vilket ger en boost av läkning, men snabbt leder till svält.

items.armor.curses.multiplicity.name=%s av multiplicitet
items.armor.curses.multiplicity.desc=Rustning som är förhäxad med mångfald innehåller farlig dupliceringsmagi. Den skapar ibland en spegelbild av bäraren, men duplicerar lika gärna angriparen!

items.armor.curses.overgrowth.name=%s av överväxt
items.armor.curses.overgrowth.desc=Rustningen av överväxt är täckt med olika blommande plantor. Medan denna effekten säkerligen ser intressant ut ger den inget mer skydd, utan aktiverar slumpmässigt växterna vid strid.

items.armor.curses.stench.name=%s av stank
items.armor.curses.stench.desc=Rustning som är fördömd med stank kommer att utgåva moln av giftig gas, som är farlig för allt som fastnar i molnet.


###glyphs
items.armor.glyphs.affection.name=%s av tillgivenhet
items.armor.glyphs.affection.desc=Denna kraftfulla glyfen manipulerar hjärnan hos attackerande, vilket tillfälligt förtjusar dem.

items.armor.glyphs.antimagic.name=%s av anti-magi
items.armor.glyphs.antimagic.desc=Den här kraftfulla glyfen gör att rustningen kan försvara sin bärare mot magiska attacker såväl som fysiska. Detta magiska försvar påverkas inte av rustningens nivå.

items.armor.glyphs.brimstone.name=%s av svavel
items.armor.glyphs.brimstone.desc=Denna glyf skyddar bäraren och deras ägodelar från eld, helt upphävande dess skada och negativa effekter.

items.armor.glyphs.camouflage.name=%s av kamouflage
items.armor.glyphs.camouflage.desc=Denna glyf låter bäraren smälta in i högt gräs, vilket ger dem tillfällig osynlighet.

items.armor.glyphs.entanglement.name=%s av intrassling
items.armor.glyphs.entanglement.desc=Denna glyf bildar en jordrustning runt bäraren för att absorbera skador, men rustningen går sönder om bäraren rör sig.

items.armor.glyphs.flow.name=%s av flöde
items.armor.glyphs.flow.desc=Denna glyf manipulerar vattnets flöde runt bäraren, vilket gör färd genom vatten mycket snabbare.

items.armor.glyphs.obfuscation.name=%s av förvillelse
items.armor.glyphs.obfuscation.desc=Denna glyf döljer bäraren, vilket gör dem svårare att upptäcka.

items.armor.glyphs.potential.name=%s av potential
items.armor.glyphs.potential.desc=Denna glyf bygger energi när den blir slagen, vilket ger laddning till bärarens stav när den aktiveras.

items.armor.glyphs.repulsion.name=%s av tillbakadrivande
items.armor.glyphs.repulsion.desc=Denna glyf studsar tillbaka kraft mot attackerare, vilket skickar iväg dem flygandes

items.armor.glyphs.stone.name=%s av sten
items.armor.glyphs.stone.desc=Denna glyf omringar rustningen med tung magisk sten som gör det omöjligt att undvika attacker, men som blockerar skada i proportion med ens undvikandeförmåga.

items.armor.glyphs.swiftness.name=%s av kvickhet
items.armor.glyphs.swiftness.desc=Denna glyf ökar bärarens hastighet närhelst de inte är nära en fiende.

items.armor.glyphs.thorns.name=%s av törne
items.armor.glyphs.thorns.desc=Denna kraftfulla glyf skadar attackerare så att de sakta blöder ut efter de attackerat bäraren.

items.armor.glyphs.viscosity.name=%s av viskositet
items.armor.glyphs.viscosity.deferred=uppskjutet %d
items.armor.glyphs.viscosity$defereddamage.name=uppskjuten skada
items.armor.glyphs.viscosity$defereddamage.ondeath=Den uppskjutna skadan dödade dig...
items.armor.glyphs.viscosity$defereddamage.rankings_desc=Dödad av uppskjuten skada
items.armor.glyphs.viscosity$defereddamage.desc=Skada är utdelad långsamt över tid istället för omedelbart.\n\nÅterstående uppskjuten skada: %d.
items.armor.glyphs.viscosity.desc=Denna glyf kan förvara skada som orsakats bäraren. Istället för direkt tas förvarad skada långsamt över tid.



###armor
items.armor.armor.ac_detach=TA LOSS
items.armor.armor.detach_seal=Du tar loss sigillet från din rustning.
items.armor.armor.equip_cursed=Rustningen drar smärtsamt ihop sig runt dig.
items.armor.armor.identify=Du är nu bekant nog med din rustning för att identifiera den.
items.armor.armor.hardening_gone=Härdningen på denna rustning har försvunnit!
items.armor.armor.incompatible=Interaktioner mellan olika slags magi har raderat glyfen på denna rustningen!
items.armor.armor.curr_absorb=Den här _tier-%1$d_ rustningen blockerar _%2$d-%3$d skada_ och kräver _%4$d styrka_ för att användas korrekt.
items.armor.armor.avg_absorb=Typiskt blockerar denna _tier-%1$d_ rustning _%2$d-%3$d skada_ och kräver _%4$d styrka_ för att användas korrekt.
items.armor.armor.too_heavy=På grund av din otillräckliga styrka kommer den här rustningen att minska din förmåga att röra dig, undvika och försvara dig.
items.armor.armor.probably_too_heavy=Den här rustningen är nog för tung för dig.
items.armor.armor.excess_str=På grund av din överflödiga styrka är du _mer undvikande_ vid bärandet av denna rustning.
items.armor.armor.evasion=Den är förstärkt för att förbättra _undvikande_.
items.armor.armor.defense=Den är förstärkt för att förbättra _defense._
items.armor.armor.inscribed=Det är inskrivet med en _%s._
items.armor.armor.glyph_hardened=Den har blivit _härdad._
items.armor.armor.hardened_no_glyph=Den här rustningen har blivit _härdad,_ men är för närvarande inte inskriven med en glyf.
items.armor.armor.cursed_worn=Den här rustningen är förbannad och du kan inte ta bort den.
items.armor.armor.cursed=Du kan känna en illvillig magi som lurar i denna rustning.
items.armor.armor.weak_cursed=Trots förbannelsen kan du ta av dig den här rustningen.
items.armor.armor.not_cursed=Den här rustningen är fri från illvillig magi.
items.armor.armor.seal_attached=Krigarens brutna sigill är fäst vid denna rustning. När denne är på väg att skadas under halv hälsa, kommer det att ge _%d sköld_.
items.armor.armor.seal_transfer=Krigarens brutna sigill måste fästas på dennes nuvarande rustning för att vara till nytta. Vill du automatiskt ta bort sigillet från den rustning du tar bort och fästa det på den rustning du utrustar?
items.armor.armor.seal_transfer_yes=ja
items.armor.armor.seal_transfer_no=nej
items.armor.armor$glyph.glyph=glyf
items.armor.armor$glyph.killed=%s dödade dig…
items.armor.armor$glyph.rankings_desc=Dödad av en glyf
items.armor.armor$glyph.discover_hint=Du kan hitta ett föremål med den här effekten slumpmässigt i fängelsehålan, eller försöka använda den på ett föremål själv.

items.armor.classarmor.ac_ability=Välj förmåga
items.armor.classarmor.ac_transfer=TRANSFER
items.armor.classarmor.no_ability=Din rustning har för närvarande ingen förmåga, du bör välja en!
items.armor.classarmor.not_equipped=Du måste bära den här rustningen för att kunna använda dess speciella kraft!
items.armor.classarmor.low_charge=Rustningen har inte tillräckligt med laddning för att använda sin speciella kraft!
items.armor.classarmor.charge_use=Att använda förmågan just nu kommer att förbruka _%s_ laddning.
items.armor.classarmor.transfer_title=Överför rustning
items.armor.classarmor.transfer_desc=Magin i dvärgkungens krona kan överföras till en annan rustning. Observera att den ursprungliga rustningen kommer att förstöras i processen.
items.armor.classarmor.transfer_prompt=Välj en rustning
items.armor.classarmor.transfer_cancel=Avbryt
items.armor.classarmor.transfer_complete=Din heroiska rustnings egenskaper har överförts!
items.armor.classarmor.discover_hint=Du kan hitta det här föremålet efter att ha besegrat bossen på våning 20 med en specifik hjälte.

items.armor.clericarmor.name=hjältens klädedräkt
items.armor.clericarmor.desc=Vid bärandet av denna blandning av tyg och plåt kan Cleric utföra en speciell förmåga.

items.armor.clotharmor.name=tygrustning
items.armor.clotharmor.desc=Den här lätta rustningen ger ett grundläggande skydd.
items.armor.clotharmor.discover_hint=En av hjältarna börjar med detta föremål.

items.armor.duelistarmor.name=hjältarnas bröstplåt
items.armor.duelistarmor.desc=Vid bärandet av denna plåtrustning och cape kan duellanten utföra en speciell förmåga.

items.armor.huntressarmor.name=hjältinnans mantel
items.armor.huntressarmor.no_enemies=Inga fiender i sikte
items.armor.huntressarmor.desc=Vid bärandet av denna mantel kan jägarinnan utföra en speciell förmåga.

items.armor.leatherarmor.name=läderrustning
items.armor.leatherarmor.desc=Pansar tillverkat av garvat monsterskinn. Inte lika lätt som tygpansar men ger bättre skydd.

items.armor.magearmor.name=hjältarnas mantel
items.armor.magearmor.desc=Vid bärandet av denna underbara mantel kan Magikern utföra en speciell förmåga.

items.armor.mailarmor.name=ringbrynja
items.armor.mailarmor.desc=Interlockerande metallänkar ger en tuff men flexibel rustning.

items.armor.platearmor.name=plåtrustning
items.armor.platearmor.desc=Enorma metallplattor sammanfogas till en dräkt som ger oöverträffat skydd åt alla äventyrare som är starka nog att bära dess svindlande vikt.

items.armor.roguearmor.name=hjältarnas dräkt
items.armor.roguearmor.desc=Vid bärandet av denna mörka dräkt kan Rogue utföra en speciell förmåga.

items.armor.scalearmor.name=fjällpansar
items.armor.scalearmor.desc=Skalorna av metall som är fastsydda på en läderväst skapar en flexibel men skyddande rustning.

items.armor.warriorarmor.name=hjältens riddarrustning
items.armor.warriorarmor.desc=Vid bärandet av denna tunga pläterade rustning kan krigaren utföra en speciell förmåga.



###artifacts
items.artifacts.alchemiststoolkit.name=alkemistens verktygslåda
items.artifacts.alchemiststoolkit.ac_brew=BRYGGD
items.artifacts.alchemiststoolkit.ac_energize=ENERGIZE
items.artifacts.alchemiststoolkit.not_ready=Din verktygslåda har inte värmts upp färdigt.
items.artifacts.alchemiststoolkit.cursed=Din förbannade verktygslåda hindrar dig från att använda alkemi!
items.artifacts.alchemiststoolkit.need_energy=Du behöver minst 6 energier för detta.
items.artifacts.alchemiststoolkit.energize_desc=Var 6:e energikristall ger verktygslådan tillräckligt med energi för att gå upp en nivå, vilket ökar hastigheten som verktygslådan genererar energi över tid, och hur snabbt den värms upp.\n\nHur mycket energi vill du använda?
items.artifacts.alchemiststoolkit.energize_1=6 energi: +1 nivå
items.artifacts.alchemiststoolkit.energize_all=%1$d energi: +%2$d nivåer
items.artifacts.alchemiststoolkit.desc=Den här verktygslådan innehåller ett antal reagenser och örter tillsammans med en liten blandningsflaska, vilket möjliggör alkemi på språng. Flaskan innehåller vad som ser ut som alkemiska energikristaller i flytande form.
items.artifacts.alchemiststoolkit.desc_cursed=Den förbannade verktygslådan har bundit sig till din sida och vägrar låta dig använda alkemi.
items.artifacts.alchemiststoolkit.desc_warming=Verktygslådan håller på att värmas upp och kommer att vara redo att användas vid ett senare tillfälle.
items.artifacts.alchemiststoolkit.desc_hint=Den utrustade verktygslådan genererar långsamt alkemisk energi i takt med att du får mer erfarenhet. Det ser ut som om blandningen i flaskan kan förbättras genom att lägga till energikristaller i den.

items.artifacts.artifact.cannot_wear_two=Du kan inte bära två av samma artefakt.
items.artifacts.artifact.equip_cursed=Artefakten binder sig smärtsamt till dig.
items.artifacts.artifact.curse_known=Du kan känna en illvillig magi som lurar i artefakten.
items.artifacts.artifact.not_cursed=Den här artefakten är fri från illvillig magi.
items.artifacts.artifact.need_to_equip=Du måste utrusta din artefakt för att göra det.

items.artifacts.capeofthorns.name=törnekåpa
items.artifacts.capeofthorns.desc=De här kollapsade metallplåtarna från DM-300 har formats till en styv cape. Den verkar lagra en djup energi, kanske har den en del av DM-300:s kraft?
items.artifacts.capeofthorns.desc_inactive=Manteln känns betryggande tung på dina axlar, den verkar få energi från skadorna du tar.
items.artifacts.capeofthorns.desc_active=Manteln verkar släppa lagrad energi, den utstrålar en skyddande kraft.
items.artifacts.capeofthorns$thorns.inert=Din Mantel blir inert igen.
items.artifacts.capeofthorns$thorns.radiating=Din Mantel börjar utstråla energi, du känner dig skyddad!
items.artifacts.capeofthorns$thorns.levelup=Din Cape växer sig starkare!
items.artifacts.capeofthorns$thorns.name=törnar
items.artifacts.capeofthorns$thorns.desc=Din Cape strålar ut energi och omger dig med ett fält av avledande kraft!\n\nAll skada du får reduceras vid aktiv törneffekt. Dessutom, om angriparen är bredvid dig, avböjs den reducerade mängden tillbaka mot angriparen.\n\nÅterstående turer av taggar: %s.

items.artifacts.chaliceofblood.name=blodskalk
items.artifacts.chaliceofblood.ac_prick=PRICK
items.artifacts.chaliceofblood.yes=Ja, jag vet vad jag gör
items.artifacts.chaliceofblood.no=Nej, jag ändrade mig
items.artifacts.chaliceofblood.prick_warn=Varje gång du använder kalken kommer den att tömma mer av din livsenergi, men i gengäld kommer den att ytterligare förbättra din naturliga hälsogenerering.\n\nFör närvarande kommer du att åsamkas _%1$d-%2$d skada_ när du sticker dig själv, men denna skada kan minskas genom _både fysisk och magisk blockering eller skadereduktion._ Utan att ta hänsyn till skadereduktionseffekter har du för närvarande _%3$s%% chans_ att tömma din livskraft helt när du sticker dig själv.\n\nÄr du säker på att du vill ge kalken mer livsenergi?
items.artifacts.chaliceofblood.onprick=Du sticker dig själv, och din livsenergi rinner ner i kalken.
items.artifacts.chaliceofblood.ondeath=Kalken suger ut din livsenergi...
items.artifacts.chaliceofblood.desc=Den här silverglänsande kalken är märkligt nog utsmyckad med vassa ädelstenar på kanten.
items.artifacts.chaliceofblood.desc_cursed=Den förbannade kalken har bundit sig till din hand och hämmar din förmåga att återskapa hälsa.
items.artifacts.chaliceofblood.desc_1=När du håller i kalken känner du dig märkligt tvingad att sticka dig på de vassa ädelstenarna.
items.artifacts.chaliceofblood.desc_2=En del av ditt blod samlas i kalken, och du kan känna hur kalken försörjer dig med livsenergi och ökar din naturliga hälsa och regenerering. Du vill fortfarande skära dig på kalken, även om du vet att det kommer att göra ont.
items.artifacts.chaliceofblood.desc_3=Kalken är fylld till brädden med din livsessens. Du kan känna hur kalken häller tillbaka livsenergi i dig.

items.artifacts.cloakofshadows.name=skuggornas mantel
items.artifacts.cloakofshadows.ac_stealth=SMYGANDE
items.artifacts.cloakofshadows.cooldown=Din mantel behöver %d fler turer för att återfå energi.
items.artifacts.cloakofshadows.cursed=Du kan inte använda en förbannad mantel.
items.artifacts.cloakofshadows.no_charge=Din mantel har inte laddats tillräckligt för att vara användbar än.
items.artifacts.cloakofshadows.desc=En ovärderlig magisk mantel, stulen från det kungliga vapenförrådet för många år sedan av Skurken. När den bärs kan den användas för att bli helt osynlig under en kort tid.\n\nJu mer manteln används, desto starkare blir den, vilket gör att Skruken kan bli osynlig oftare och under längre tid.
items.artifacts.cloakofshadows.discover_hint=En av hjältarna börjar med det här föremålet.
items.artifacts.cloakofshadows$cloakstealth.no_charge=Din mantel har slut på energi.
items.artifacts.cloakofshadows$cloakstealth.levelup=Din mantel blir starkare!
items.artifacts.cloakofshadows$cloakstealth.name=cloaked
items.artifacts.cloakofshadows$cloakstealth.desc=Din skuggmantel ger dig osynlighet vid sidan av den. Du förblir dold tills den avbryts eller laddningen tar slut.\n\nUnder tiden som du är osynlig kan fiender inte attackera eller följa efter dig. Fysiska attacker och magiska effekter (t.ex. skriftrullar och trollstavar) avbryter osynligheten omedelbart.\n\nTur tills laddningen är slut: %d.

items.artifacts.driedrose.name=torkad ros
items.artifacts.driedrose.ac_summon=FRAMKALLA
items.artifacts.driedrose.ac_direct=DIREKT
items.artifacts.driedrose.ac_outfit=KLÄDSEL
items.artifacts.driedrose.spawned=Du har redan kallat på spöket.
items.artifacts.driedrose.no_charge=Din ros är inte fulladdad än.
items.artifacts.driedrose.cursed=Du kan inte använda en fördömd ros.
items.artifacts.driedrose.no_space=Det finns inget fritt utrymme nära dig.
items.artifacts.driedrose.charged=Din ros är fulladdad!
items.artifacts.driedrose.desc=Är det här rosen som spöket nämnde innan han försvann? Den verkar ha en viss andlig kraft, kanske kan den användas för att kanalisera energin från den förlorade krigaren.
items.artifacts.driedrose.desc_no_quest=En torkad gammal ros som på något sätt fortfarande håller ihop trots sin ålder.\n\nDen verkar ha en viss andlig kraft, men du har ingen aning om hur du ska använda den just nu.
items.artifacts.driedrose.desc_hint=Det verkar saknas några kronblad. Kanske kan du stärka rosen genom att fästa dem igen.
items.artifacts.driedrose.desc_cursed=Den förbannade rosen är bunden till din hand, den känns kusligt kall.
items.artifacts.driedrose.desc_weapon=Spökets vapen: %s
items.artifacts.driedrose.desc_armor=Spökets rustning: %s
items.artifacts.driedrose.desc_strength=Spökets styrka: %s
items.artifacts.driedrose$petal.name=torkat kronblad
items.artifacts.driedrose$petal.no_rose=Du har ingen ros att lägga detta kronblad till.
items.artifacts.driedrose$petal.no_room=Det finns inget utrymme kvar för det här kronbladet, så du kasserar det.
items.artifacts.driedrose$petal.maxlevel=Rosen är färdig!
items.artifacts.driedrose$petal.levelup=Du lägger till kronbladet till rosen.
items.artifacts.driedrose$petal.desc=Ett bräckligt torkat kronblad, som på något sätt har överlevt så här långt in i fängelsehålan.
items.artifacts.driedrose$wndghosthero.title=Spökets utrustning
items.artifacts.driedrose$wndghosthero.desc=Spöket är svagt på egen hand, men deras form är tillräckligt solid för att utrustas med ett vapen och en rustning. De kommer att kunna använda dessa föremål precis som du gör.\n\nSpöket kan för närvarande utrusta föremål som kräver upp till _%d styrka._
items.artifacts.driedrose$wndghosthero.weapon_prompt=Välj ett vapen
items.artifacts.driedrose$wndghosthero.armor_prompt=Välj en rustning
items.artifacts.driedrose$wndghosthero.cant_unique=Spöket kan inte använda unika föremål.
items.artifacts.driedrose$wndghosthero.cant_cursed=Spöket kan bara använda utrustning som du är säker på inte är förbannad.
items.artifacts.driedrose$wndghosthero.cant_strength_unknown=Spöket kanske inte är tillräckligt starkt för att använda det.
items.artifacts.driedrose$wndghosthero.cant_strength=Spöket är inte tillräckligt starkt för att använda det.

##ghost hero
items.artifacts.driedrose$ghosthero.name=sorgset spöke
items.artifacts.driedrose$ghosthero.def_verb=undvek
items.artifacts.driedrose$ghosthero.discover_hint=Du kan hitta den här karaktären med en specifik artefakt.

items.artifacts.driedrose$ghosthero.hello=Hej igen %s.
items.artifacts.driedrose$ghosthero.introduce=Min ande är bunden till denna ros, den var mycket värdefull för mig, en gåva från min kärlek som jag lämnade på ytan.\n\nJag kan inte återvända till honom, men tack vare dig har jag en andra chans att slutföra min resa. Så länge du har rosen kan jag höra din röst, så du kan använda den för att leda mig på avstånd. Förhoppningsvis kan du lyckas där jag misslyckades...

items.artifacts.driedrose$ghosthero.dialogue_sewers_1=De här kloakerna brukade vara säkra, folk bodde till och med här på vintern.
items.artifacts.driedrose$ghosthero.dialogue_sewers_2=Jag undrar vad som hände med vaktpatrullerna, gav de upp?
items.artifacts.driedrose$ghosthero.dialogue_sewers_3=Jag hade familj på ytan, jag hoppas att de är i säkerhet.
items.artifacts.driedrose$ghosthero.dialogue_sewers_4=Vakterna kunde inte besegra de här monstren, men det kanske vi kan.
items.artifacts.driedrose$ghosthero.dialogue_sewers_5=Om till och med kloakerna är så här farliga, undrar jag vad som finns där nere...
items.artifacts.driedrose$ghosthero.dialogue_sewers_6=Vad kan ha fått dessa råttor och krabbor att växa sig så stora?
items.artifacts.driedrose$ghosthero.dialogue_prison_1=Jag har hört historier om det här stället, inget bra.
items.artifacts.driedrose$ghosthero.dialogue_prison_2=Det här stället har alltid varit mer av en fängelsehåla än ett fängelse.
items.artifacts.driedrose$ghosthero.dialogue_prison_3=Jag kan inte föreställa mig vad som hände när det här stället övergavs.
items.artifacts.driedrose$ghosthero.dialogue_prison_4=Det verkar som om både fångarna och vakterna har förvandlats till monster.
items.artifacts.driedrose$ghosthero.dialogue_prison_5=Vad kan vara orsaken till alla dessa skelett?
items.artifacts.driedrose$ghosthero.dialogue_prison_6=De här människorna hade inte behövt sluta så här...
items.artifacts.driedrose$ghosthero.dialogue_caves_1=Ingen människa eller dvärg har varit här på mycket länge.
items.artifacts.driedrose$ghosthero.dialogue_caves_2=Vad skulle få dvärgarna att överge en guldgruva?
items.artifacts.driedrose$ghosthero.dialogue_caves_3=Det är synd att allt guld här är värdelöst på ytan.
items.artifacts.driedrose$ghosthero.dialogue_caves_4=Varelserna här är skruvade, precis som i kloakerna.
items.artifacts.driedrose$ghosthero.dialogue_caves_5=Även fladdermössen är blodtörstiga här.
items.artifacts.driedrose$ghosthero.dialogue_caves_6=Inga tecken på någon gruvutrustning, har dvärgarna återtagit allt?
items.artifacts.driedrose$ghosthero.dialogue_city_1=Dvärgarna var flitiga, men giriga.
items.artifacts.driedrose$ghosthero.dialogue_city_2=Så dvärgarnas metropol har verkligen fallit.
items.artifacts.driedrose$ghosthero.dialogue_city_3=Jag hoppas att ytan aldrig slutar som den här platsen.
items.artifacts.driedrose$ghosthero.dialogue_city_4=Det är inte meningen att dvärgar ska se så bleka ut.
items.artifacts.driedrose$ghosthero.dialogue_city_5=Jag vet inte vad som är värst, dvärgarna eller deras skapelser.
items.artifacts.driedrose$ghosthero.dialogue_city_6=Det verkar som om dvärgarna är tanklösa monster nu också.
items.artifacts.driedrose$ghosthero.dialogue_halls_1=Vad är det här för ställe?
items.artifacts.driedrose$ghosthero.dialogue_halls_2=Den här platsen är skräckinjagande...
items.artifacts.driedrose$ghosthero.dialogue_halls_3=Vad tänkte dvärgarna på när de lekte med makt på det här viset?
items.artifacts.driedrose$ghosthero.dialogue_halls_4=Monstren här är utomjordiska, var kommer de ifrån?
items.artifacts.driedrose$ghosthero.dialogue_halls_5=Känner du det? Det är som om något iakttar oss.
items.artifacts.driedrose$ghosthero.dialogue_halls_6=Tack gode Gud att det finns facklor, det är så mörkt här!
items.artifacts.driedrose$ghosthero.dialogue_ascension_1=Varför händer det här, jag trodde vi lyckades?
items.artifacts.driedrose$ghosthero.dialogue_ascension_2=Hur kan den där saken fortfarande påverka den här världen?
items.artifacts.driedrose$ghosthero.dialogue_ascension_3=Jag hoppas att du vet vad du gör med den där amuletten.
items.artifacts.driedrose$ghosthero.dialogue_ascension_4=Jag antar att vi inte är klara än.
items.artifacts.driedrose$ghosthero.dialogue_ascension_5=Vi har redan kommit så långt, vi kan avsluta det här!
items.artifacts.driedrose$ghosthero.dialogue_ascension_6=Bara en liten bit till, så kan vi ta oss ut härifrån!

items.artifacts.driedrose$ghosthero.seen_goo_1=Varning Goo!
items.artifacts.driedrose$ghosthero.seen_goo_2=Många av mina vänner dog av den här saken, dags för hämnd!
items.artifacts.driedrose$ghosthero.seen_goo_3=En sådan styggelse kan inte tillåtas leva!
items.artifacts.driedrose$ghosthero.seen_tengu_1=Den enda fången som är kvar är en dödlig lönnmördare. Naturligtvis...
items.artifacts.driedrose$ghosthero.seen_tengu_2=Han har fångat oss i en fälla!
items.artifacts.driedrose$ghosthero.seen_tengu_3=Jag har hört skräckhistorier om den där masken...
items.artifacts.driedrose$ghosthero.seen_dm300_1=Det är bara dvärgar som skulle bygga en gruvmaskin som dödar inkräktare.
items.artifacts.driedrose$ghosthero.seen_dm300_2=Den där saken är enorm...
items.artifacts.driedrose$ghosthero.seen_dm300_3=Hur har den här saken hållit sig aktiv så länge?
items.artifacts.driedrose$ghosthero.seen_king_1=När folk säger att makt korrumperar, är det här vad de menar.
items.artifacts.driedrose$ghosthero.seen_king_2=Han är mer av en lich än en kung nu.
items.artifacts.driedrose$ghosthero.seen_king_3=Även i döden lyder dvärgarna sin herre.
items.artifacts.driedrose$ghosthero.seen_yog_1=Oh, det här ser inte bra ut.
items.artifacts.driedrose$ghosthero.seen_yog_2=Så det är så en gud ser ut?
items.artifacts.driedrose$ghosthero.seen_yog_3=Det här kommer att göra ont...

items.artifacts.driedrose$ghosthero.defeated_by_enemy_1=God lycka...
items.artifacts.driedrose$ghosthero.defeated_by_enemy_2=Trött... för tillfället...
items.artifacts.driedrose$ghosthero.defeated_by_enemy_3=Jag kommer tillbaka...
items.artifacts.driedrose$ghosthero.defeated_by_boss_1=Jag är ledsen ... lycka till ...
items.artifacts.driedrose$ghosthero.defeated_by_boss_2=Avsluta det... utan mig...
items.artifacts.driedrose$ghosthero.defeated_by_boss_3=Nej... jag kan inte...
items.artifacts.driedrose$ghosthero.blessed_ankh_1=Hur överlevde du det där?
items.artifacts.driedrose$ghosthero.blessed_ankh_2=Jag önskar att jag hade en sån...
items.artifacts.driedrose$ghosthero.blessed_ankh_3=Oh my! Du lever fortfarande!
items.artifacts.driedrose$ghosthero.player_killed_1=Nej!...
items.artifacts.driedrose$ghosthero.player_killed_2=Jag kunde inte hjälpa dem...
items.artifacts.driedrose$ghosthero.player_killed_3=Inte så här...

items.artifacts.driedrose$ghosthero.direct_prompt=Vad ska jag göra?
items.artifacts.driedrose$ghosthero.directed_follow_1=Okej, jag följer efter dig.
items.artifacts.driedrose$ghosthero.directed_follow_2=Jag faller in bakom dig.
items.artifacts.driedrose$ghosthero.directed_follow_3=Följer dig...
items.artifacts.driedrose$ghosthero.directed_follow_4=Okay, nu kör vi!
items.artifacts.driedrose$ghosthero.directed_follow_5=Jag har din rygg.
items.artifacts.driedrose$ghosthero.directed_attack_1=Okej, jag attackerar den där.
items.artifacts.driedrose$ghosthero.directed_attack_2=Jag tar den där.
items.artifacts.driedrose$ghosthero.directed_attack_3=Engagerar...
items.artifacts.driedrose$ghosthero.directed_attack_4=Låt oss ta dem!
items.artifacts.driedrose$ghosthero.directed_attack_5=Jag har den där.
items.artifacts.driedrose$ghosthero.directed_position_1=Okej, jag håller den positionen.
items.artifacts.driedrose$ghosthero.directed_position_2=Jag går dit och försvarar.
items.artifacts.driedrose$ghosthero.directed_position_3=Repositionering...
items.artifacts.driedrose$ghosthero.directed_position_4=På väg!
items.artifacts.driedrose$ghosthero.directed_position_5=Jag går dit bort.

items.artifacts.driedrose$ghosthero.desc=En skör eterisk figur med en humanoid form. Deras kraft verkar vara knuten till rosen du har. Det här spöket kanske inte är mycket, men de verkar vara din enda sanna vän här nere.

##back to artifacts
items.artifacts.etherealchains.name=etereala kedjor
items.artifacts.etherealchains.ac_cast=CAST
items.artifacts.etherealchains.rooted=Dina kedjor kan inte dra dig när du är rotad.
items.artifacts.etherealchains.no_charge=Dina kedjor har inte tillräckligt med laddning.
items.artifacts.etherealchains.cursed=Du kan inte använda förbannade kedjor.
items.artifacts.etherealchains.does_nothing=Det kommer inte att göra någonting.
items.artifacts.etherealchains.cant_pull=Dina kedjor kan inte dra det målet.
items.artifacts.etherealchains.cant_reach=Dina kedjor kan inte nå dit.
items.artifacts.etherealchains.inside_wall=Dina kedjor kan bara dra dig genom väggar, inte in i dem.
items.artifacts.etherealchains.nothing_to_grab=Det finns inget att ta tag i där.
items.artifacts.etherealchains.prompt=Välj en plats att rikta in dig på.
items.artifacts.etherealchains.desc=De här stora men lätta kedjorna glöder av andlig energi. De kan användas för att dra dig mot terrängen, eller dra fiender mot dig. Kedjornas eteriska natur gör att de till och med kan sträcka sig genom väggar!
items.artifacts.etherealchains.desc_cursed=De förbannade kedjorna är låsta vid din sida, svänger ständigt runt och försöker snubbla eller binda dig.
items.artifacts.etherealchains.desc_equipped=Kedjorna vilar runt din sida och suger långsamt upp den andliga energin från dem du besegrar. Varje laddning är en länk i kedjan, som kommer att sträcka sig ut exakt en kakelplatta.
items.artifacts.etherealchains$chainsrecharge.levelup=Dina kedjor blir starkare!

items.artifacts.holytome.name=helig tome
items.artifacts.holytome.ac_cast=KASTA
items.artifacts.holytome.no_spell=Du kan inte lägga den besvärjelsen just nu.
items.artifacts.holytome.cursed=Du kan inte använda en förbannad tome.
items.artifacts.holytome.levelup=Din tome blir starkare!
items.artifacts.holytome.desc=En helig tome som fungerar som ett fokus för prästerskapets gudomliga magi. Med hjälp av tomen kan prästerna lägga en mängd olika magiska besvärjelser.\n\nTomen blir stadigt mer kraftfull när prästerna använder den, vilket ger prästerna fler maximala laddningar och ökar laddningshastigheten något.
items.artifacts.holytome.discover_hint=En av hjältarna börjar med det här föremålet.

items.artifacts.hornofplenty.name=ymnighetshorn
items.artifacts.hornofplenty.ac_snack=SNACK
items.artifacts.hornofplenty.ac_eat=ÄTA
items.artifacts.hornofplenty.ac_store=STORE
items.artifacts.hornofplenty.eat=Du äter från hornet.
items.artifacts.hornofplenty.prompt=Välj lite mat
items.artifacts.hornofplenty.no_food=Ditt horn har ingen mat i sig som du kan äta!
items.artifacts.hornofplenty.full=Ditt horn är fullt av mat!
items.artifacts.hornofplenty.reject=Ditt horn avvisar den okokta blandfrukten.
items.artifacts.hornofplenty.maxlevel=Ditt horn har ätit upp all mat det kan!
items.artifacts.hornofplenty.levelup=Hornet konsumerar ditt matoffer och växer i styrka!
items.artifacts.hornofplenty.feed=Hornet konsumerar ditt matoffer.
items.artifacts.hornofplenty.desc=Det här hornet kan du inte blåsa i, utan det fylls på med mat allteftersom du ger dig ut på äventyr och får erfarenhet. Du kan konsumera varje laddning individuellt som ett mellanmål, eller äta tills du är mätt.
items.artifacts.hornofplenty.desc_hint=Det kanske finns ett sätt att öka hornets kraft genom att ge det matenergi.
items.artifacts.hornofplenty.desc_cursed=Det förbannade hornet har bundit sig till din sida, det verkar vara angeläget att ta mat snarare än att producera den.

items.artifacts.lloydsbeacon.name=lloyds fyr
items.artifacts.lloydsbeacon.ac_zap=ZAP
items.artifacts.lloydsbeacon.ac_set=SET
items.artifacts.lloydsbeacon.ac_return=RETURN
items.artifacts.lloydsbeacon.no_charge=Din fyr har inte tillräckligt med energi just nu.
items.artifacts.lloydsbeacon.tele_fail=Teleporteringsmagin misslyckades.
items.artifacts.lloydsbeacon.prompt=Välj en plats att zappa.
items.artifacts.lloydsbeacon.levelup=Din fyr blir starkare!
items.artifacts.lloydsbeacon.preventing=Stark magisk aura på denna plats hindrar dig från att använda lloydsbeacon!
items.artifacts.lloydsbeacon.creatures=Psykisk aura från närliggande varelser tillåter dig inte att använda lloyds fyr just nu.
items.artifacts.lloydsbeacon.return=Lloyds fyr är framgångsrikt placerad på din nuvarande plats, nu kan du återvända hit när som helst.
items.artifacts.lloydsbeacon.desc=Lloyds fyr är en invecklad magisk anordning som ger användaren kontroll över teleporteringsmagi. Beaconen kan användas för att återvända till en bestämd plats, men kan också avge slumpmässiga teleporteringsmagier när den har laddats upp efter att ha varit utrustad. Denna magi kan riktas mot ett mål eller mot användaren själv.
items.artifacts.lloydsbeacon.desc_set=Den här fyren sattes ut någonstans på nivån %d i Pixel Dungeon.

items.artifacts.masterthievesarmband.name=mästartjuvarnas armband
items.artifacts.masterthievesarmband.ac_steal=STJÄL
items.artifacts.masterthievesarmband.no_charge=Ditt armband har inte tillräckligt med laddning.
items.artifacts.masterthievesarmband.cursed=Du kan inte använda ett förbannat armband.
items.artifacts.masterthievesarmband.full=Ditt armband är fulladdat!
items.artifacts.masterthievesarmband.prompt=Välj en fiende att rikta in dig på
items.artifacts.masterthievesarmband.no_target=Du måste sikta på en fiende som befinner sig bredvid dig.
items.artifacts.masterthievesarmband.steal_shopkeeper=Du kan inte stjäla från butiksinnehavare direkt.
items.artifacts.masterthievesarmband.no_steal=Den fienden har inget att stjäla.
items.artifacts.masterthievesarmband.stole_item=Du stal ett föremål: %s.
items.artifacts.masterthievesarmband.failed_steal=Du lyckades inte stjäla något.
items.artifacts.masterthievesarmband.level_up=Ditt armband blir starkare!
items.artifacts.masterthievesarmband.desc=Det här armbandet i lila sammet bär en mästertjuvs märke. Det tillhör inte dig, men det tillhörde förmodligen inte den senaste användaren heller.
items.artifacts.masterthievesarmband.desc_cursed=Det förbannade armbandet är bundet till din handled, och på något sätt verkar din guldpåse långsamt bli lättare...
items.artifacts.masterthievesarmband.desc_worn=Du känner hur kraften byggs upp i armbandet på din handled i takt med att du får erfarenhet. Du kan använda den här kraften för att stjäla från butiker eller råna fiender! Att råna fiender sker omedelbart, gör dem kortvarigt desorienterade och ger dig en chans att få tag på allt byte de har! Denna kraft är mer effektiv mot ovetande fiender. Att råna samma fiende flera gånger ger inte fler chanser till byte.

items.artifacts.sandalsofnature.name=naturens sandaler
items.artifacts.sandalsofnature.name_1=naturens skor
items.artifacts.sandalsofnature.name_2=naturens stövlar
items.artifacts.sandalsofnature.name_3=grevar av naturen
items.artifacts.sandalsofnature.ac_feed=FEED
items.artifacts.sandalsofnature.ac_root=ROOT
items.artifacts.sandalsofnature.prompt=Välj ett frö
items.artifacts.sandalsofnature.levelup=Dina skor ökar i storlek!
items.artifacts.sandalsofnature.absorb_seed=Skorna absorberar fröet, de verkar friskare.
items.artifacts.sandalsofnature.no_effect=Du måste mata dina skor med ett frö först.
items.artifacts.sandalsofnature.low_charge=Dina skor har inte tillräckligt med energi för det.
items.artifacts.sandalsofnature.prompt_target=Välj en plats
items.artifacts.sandalsofnature.out_of_range=Den här platsen är utom räckhåll.
items.artifacts.sandalsofnature.desc_1=Det som först ser ut som sandaler gjorda av garn är i själva verket två växter! De verkar väldigt svaga och bleka, kanske behöver de få i sig näring?
items.artifacts.sandalsofnature.desc_2=Skorna har vuxit och liknar nu mer två skräddarsydda skor. De har fått tillbaka lite färg, men kanske kan de växa ytterligare?
items.artifacts.sandalsofnature.desc_3=Växterna har vuxit igen och liknar nu ett par rejäla stövlar gjorda av bark. Växterna verkar ha återfått sin styrka, men kanske kan de fortfarande växa vidare?
items.artifacts.sandalsofnature.desc_4=Växterna verkar ha nått sin maximala storlek, de liknar ett par bepansrade grevar. Grevarna är djupt bruna och liknar ett mycket robust träd.
items.artifacts.sandalsofnature.desc_hint=Du känner dig mer i samklang med naturen vid bärandet av denna artefakt.
items.artifacts.sandalsofnature.desc_cursed=De förbannade sandalerna blockerar all samklang med naturen.
items.artifacts.sandalsofnature.desc_ability=Skorna krusar sig med färgen på det senaste fröet du matade dem med. De kan kortvarigt rota sig i marken och producera den växtens effekt var som helst inom en radie av 3 plattor.\nFrö: _%s_\nLaddning behövs: _%d%%_
items.artifacts.sandalsofnature.desc_seeds=Du har matat skorna med %d frön.

items.artifacts.skeletonkey.name=skelettnyckel
items.artifacts.skeletonkey.ac_insert=SÄTT IN
items.artifacts.skeletonkey.cursed=Du kan inte använda en förbannad skelettnyckel.
items.artifacts.skeletonkey.prompt=Välj ett mål
items.artifacts.skeletonkey.invalid_target=Det finns ingenting att låsa eller låsa upp där.
items.artifacts.skeletonkey.lock_no_space=Du kan inte låsa in en karaktär på insidan av en dörr!
items.artifacts.skeletonkey.iron_charges=För att öppna ett vanligt lås krävs 1 laddning.
items.artifacts.skeletonkey.gold_charges=För att öppna ett gyllene lås krävs 2 laddningar.
items.artifacts.skeletonkey.lock_charges=För att låsa en dörr krävs 2 laddningar.
items.artifacts.skeletonkey.wall_charges=För att skapa en tillfällig vägg krävs 2 laddningar.
items.artifacts.skeletonkey.crystal_charges=För att öppna ett kristallås krävs 5 laddningar.
items.artifacts.skeletonkey.wont_open=Nyckeln passar av någon anledning inte i detta lås.
items.artifacts.skeletonkey.locked_with_key=Den dörren var låst med din skelettnyckel.
items.artifacts.skeletonkey.force_lock=Låset har försvagats utan din skelettnyckel. Du lyckas tvinga upp det.
items.artifacts.skeletonkey.discard=Du kastar bort dina överflödiga nycklar.
items.artifacts.skeletonkey.levelup=Din skelettnyckel växer sig starkare!
items.artifacts.skeletonkey.desc=En viktig nyckel formad som en skalle. Dess tänder verkar vara olika varje gång man tittar på dem.
items.artifacts.skeletonkey.desc_worn=Denna magiska nyckel verkar få mer kraft ju mer du använder den istället för fängelsehålans vanliga nycklar. Den kan sättas in i nästan alla lås i fängelsehålan för att öppna eller stänga dem, inklusive dörrar som aldrig tidigare varit låsta.\n\nNyckeln kan till och med användas på tomma ytor i kardinal- eller diagonalriktning för att ”låsa” luften framför dig och skapa en 3 rutor bred solid vägg som varar i 10 turer. Låsningen kommer att stöta bort fiender om det finns utrymme för det.
items.artifacts.skeletonkey.desc_cursed=Den fördömda nyckeln verkar aktivt undvika att passa i något lås och gör det till och med svårt (men inte omöjligt) för dig att använda dina andra nycklar.
items.artifacts.skeletonkey$keywall.desc=En tillfällig magisk vägg har placerats här av skelettnyckeln.

items.artifacts.talismanofforesight.name=förutseende talisman
items.artifacts.talismanofforesight.ac_scry=SCRY
items.artifacts.talismanofforesight.low_charge=Talismanen kräver minst 5% laddning för att scrya.
items.artifacts.talismanofforesight.prompt=Välj en plats att skanna.
items.artifacts.talismanofforesight.levelup=Din talisman blir starkare!
items.artifacts.talismanofforesight.full_charge=Din Talisman är fulladdad!
items.artifacts.talismanofforesight.desc=En slät sten med märkliga inristningar på. Det känns som om den bevakar allt omkring dig och håller utkik efter något dolt.
items.artifacts.talismanofforesight.desc_worn=När du håller i talismanen känns det som om dina sinnen skärps. Talismanen bygger långsamt upp laddning när tiden går och när du upptäcker dolda dörrar eller fällor.\n\nTalismanen kan använda sin laddning för att "scry" i en konform, vilket avslöjar alla plattor och hemligheter i det skannade området, och ger dig syn på fiender och föremål under en kort tid.
items.artifacts.talismanofforesight.desc_cursed=Den förbannade talismanen stirrar intensivt in i dig och dämpar dina sinnen.
items.artifacts.talismanofforesight$foresight.name=framsynthet
items.artifacts.talismanofforesight$foresight.uneasy=Du känner dig obehaglig till mods.
items.artifacts.talismanofforesight$foresight.desc=Du känner dig mycket nervös, som om det finns en osynlig fara i närheten.

items.artifacts.timekeepershourglass.name=tidtagarens timglas
items.artifacts.timekeepershourglass.ac_activate=AKTIVERA
items.artifacts.timekeepershourglass.deactivate=Du avaktiverar tidsfrysen.
items.artifacts.timekeepershourglass.no_charge=Ditt timglas har inte laddats upp tillräckligt för att vara användbart ännu.
items.artifacts.timekeepershourglass.cursed=Du kan inte använda ett fördömt timglas.
items.artifacts.timekeepershourglass.onstasis=Världen verkar skifta runt dig på ett ögonblick.
items.artifacts.timekeepershourglass.onfreeze=Allt omkring dig fryser plötsligt.
items.artifacts.timekeepershourglass.stasis=Sätta mig själv i stasis
items.artifacts.timekeepershourglass.freeze=Frysa tiden runt mig
items.artifacts.timekeepershourglass.prompt=Hur skulle du vilja använda timglasets magi?\n\nVid stasis kommer tiden att röra sig normalt vid du är frusen och helt osårbar, förbrukar upp till 2 laddningar åt gången.\n\nNär tiden är fryst kan du röra dig som om dina handlingar inte tar någon tid. Detta kan avaktiveras när som helst genom att använda timglaset eller attackera.
items.artifacts.timekeepershourglass.desc=Det här stora utsmyckade timglaset ser ganska anspråkslöst ut, men du känner en stor kraft i dess fint snidade bildrutor. När du roterar timglaset och ser sanden rinna ut känner du hur dess magi drar i dig, att använda denna magi skulle säkert ge dig lite kontroll över tiden.
items.artifacts.timekeepershourglass.desc_hint=Timglaset verkar ha tappat lite sand, om du bara kunde hitta lite...
items.artifacts.timekeepershourglass.desc_cursed=Det förbannade timglaset är låst vid din sida, du kan känna att det försöker manipulera ditt tidsflöde.
items.artifacts.timekeepershourglass$timefreeze.name=Tidsfrysning
items.artifacts.timekeepershourglass$timefreeze.desc=Tiden är fryst runt dig, vilket gör att du kan utföra handlingar direkt. Effekten varar tills den avbryts eller ditt timglas får slut på laddning. Att attackera eller använda magi kommer också att bryta denna effekt.\n\nTur tills laddningen är slut: %s.
items.artifacts.timekeepershourglass$sandbag.name=påse med magisk sand
items.artifacts.timekeepershourglass$sandbag.levelup=Du lägger till sanden i ditt timglas.
items.artifacts.timekeepershourglass$sandbag.maxlevel=Ditt timglas är fyllt med magisk sand!
items.artifacts.timekeepershourglass$sandbag.no_hourglass=Du har inget timglas att lägga sanden i.
items.artifacts.timekeepershourglass$sandbag.desc=Den här lilla påsen med fin sand borde fungera perfekt med ditt timglas.\n\nDet verkar konstigt att butiksinnehavaren skulle ha det här specifika föremålet just när du behöver det...

items.artifacts.unstablespellbook.name=obeständig trollformelbok
items.artifacts.unstablespellbook.ac_read=LÄSA
items.artifacts.unstablespellbook.ac_add=LÄGG TILL
items.artifacts.unstablespellbook.blinded=Du kan inte läsa från boken vid blindning.
items.artifacts.unstablespellbook.no_charge=Din trollformelbok har slut på energi för tillfället.
items.artifacts.unstablespellbook.cursed=Du kan inte läsa från en förbannad trollformelbok.
items.artifacts.unstablespellbook.prompt=Välj en skriftrulle
items.artifacts.unstablespellbook.infuse_scroll=Du tillför skriftrullens energi till boken.
items.artifacts.unstablespellbook.unable_scroll=Du kan inte lägga till denna skriftrulle i boken.
items.artifacts.unstablespellbook.unknown_scroll=Du är inte säker på vilken typ av skriftrulle det här är ännu.
items.artifacts.unstablespellbook.desc=Den här Tome är i förvånansvärt bra skick med tanke på dess ålder. Det fräser och sprakar när du flyttar sidorna, och den svämmar över av instabil energi. Om du läser ur den här boken vet du aldrig vilken trollformel du kan kasta.
items.artifacts.unstablespellbook.desc_cursed=Den förbannade boken har bundit sig till dig, den hämmar din förmåga att använda de flesta skriftrullar.
items.artifacts.unstablespellbook.desc_index=Boken är ofullständig. Dess index pekar för närvarande på följande tomma sidor:
items.artifacts.unstablespellbook.desc_empowered=De skriftrullar som du har lagt till i boken lyser av kraft. Du kommer att kunna välja den exotiska versionen av dessa scrolls effekter, men till priset av en extra avgift.
items.artifacts.unstablespellbook.read_empowered=Den skriftrulle som du har lagt till i trollformelboken svämmar över av energi. Du kan kanalisera antingen den vanliga eller den exotiska versionen av denna rullas effekt.\n\nVäljer du den exotiska varianten kostar det 2 laddningar istället för 1.



###bags
items.bags.bag.name=ryggsäck
items.bags.bag.discover_hint=Du kan köpa det här föremålet i en butik.

items.bags.potionbandolier.name=potionbandolier
items.bags.potionbandolier.desc=Den här tjocka bandolieren passar runt bröstet som ett skärp, den har många isolerade remmar för att hålla dryckesflaskor, ditt vattenskinn eller flaskor med flytande metall.\n\nNUnder tiden i bandolieren bör dina drycker skyddas från kylan.

items.bags.scrollholder.name=skriftrullehållare
items.bags.scrollholder.desc=Den här rörformade behållaren ser ut som om den skulle rymma en astronoms verktyg och diagram, men dina skriftrullar passar lika bra. Det finns även några sidofack som passar bra för trollformelkristaller, arkaiska styli och arkaiskt harts.n\nHållaren ser inte särskilt brandfarlig ut, så dina skriftrullar bör vara säkra från eld inuti den.

items.bags.velvetpouch.name=sammetspåse
items.bags.velvetpouch.desc=Den här lilla sammetspåsen kan förvara många små föremål i sig, till exempel frön, runstenar och några alkemiingredienser.
items.bags.velvetpouch.discover_hint=En av hjältarna börjar med det här föremålet.

items.bags.magicalholster.name=magiskt hölster
items.bags.magicalholster.desc=Det här smala hölstret är tillverkat av något exotiskt djurskinn och har kraftfull magi som gör att det kan lagra en enorm mängd distansvapen.\n\nDu kan helt enkelt sträcka dig in i väskan och kommer alltid att få tag i det föremål du letade efter.\n\nPå grund av hölstrets magi kommer trollstavar att laddas något snabbare och kastade vapen kommer att hålla något längre inuti det.



###bombs
items.bombs.arcanebomb.name=arcanebomb
items.bombs.arcanebomb.desc=Den här bomben har genomsyrats av arkanska egenskaper. Den kommer att explodera i en kraftfull explosion som liknar Goos uppumpade attack och orsakar _%1$d-%2$d magisk skada_ på allt inom 2 brickor.
items.bombs.arcanebomb.discover_hint=Du kan tillverka detta föremål via alkemi.

items.bombs.bomb.name=bomb
items.bombs.bomb.ac_lightthrow=Ljus & kasta
items.bombs.bomb.snuff_fuse=Du snuffar snabbt bombens stubin.
items.bombs.bomb.ondeath=Explosionen dödar dig...
items.bombs.bomb.rankings_desc=Dödad av en explosion
items.bombs.bomb.desc=En ganska rejäl svartkrutsbomb. En explosion från den här bomben ger _%1$d-%2$d skada_ på allt som ligger intill den, och kommer att förstöra viss intilliggande terräng eller föremål.
items.bombs.bomb.desc_fuse=Det ser ut som att stubinen kommer att ta ett par turer att brinna ner när den väl är tänd.
items.bombs.bomb.desc_burning=Bombens stubin brinner bort, håll avstånd eller släck den!
items.bombs.bomb$doublebomb.name=två bomber
items.bombs.bomb$doublebomb.desc=En hög med två rejäla svartkrutsbomber, det ser ut som om du får en gratis!

items.bombs.firebomb.name=brandbomb
items.bombs.firebomb.desc=Den här bomben har modifierats för att explodera i ett större område, vilket ger _%1$d-%2$d skada_ och sprider ihållande lågor inom 2 rutor.
items.bombs.firebomb.discover_hint=Du kan tillverka detta föremål via alkemi.

items.bombs.flashbangbomb.name=flashbang
items.bombs.flashbangbomb.desc=Den här anpassade bomben kommer att explodera i en explosion av ljus, ljud och elektricitet när den exploderar. Allt inom 2 brickor tar _%1$d-%2$d skada_ från explosionen, ytterligare 25%% skada från elektriciteten och blir bedövad i 10 varv.
items.bombs.flashbangbomb.discover_hint=Du kan tillverka detta föremål via alkemi.

items.bombs.frostbomb.name=frostbomb
items.bombs.frostbomb.desc=Den här bomben har modifierats för att explodera i ett större område, vilket ger _%1$d-%2$d skada_ och sprider en ihållande vindpust av iskall luft inom 2 brickor.
items.bombs.frostbomb.discover_hint=Du kan tillverka detta föremål via alkemi.

items.bombs.holybomb.name=helig bomb
items.bombs.holybomb.desc=Den här bomben har modifierats för att avge heligt ljus i ett större område när den exploderar. Allt inom 2 brickor tar _%1$d-%2$d skada_ från explosionen, och odöda eller demoniska fiender tar ytterligare 50%% skada från det heliga ljuset.
items.bombs.holybomb.discover_hint=Du kan tillverka detta föremål via alkemi.

items.bombs.noisemaker.name=bullermakare
items.bombs.noisemaker.desc=Den här anpassade bomben kommer att göra upprepade ljud när dess stubin tar slut. När något rör vid bomben kommer den att explodera och orsaka _%1$d-%2$d skada_ på allt inom 2 tiles!
items.bombs.noisemaker.desc_burning=Noisemakern tickar på, den kommer att explodera när något kommer i närheten!
items.bombs.noisemaker.discover_hint=Du kan tillverka detta föremål via alkemi.

items.bombs.smokebomb.name=rökbomb
items.bombs.smokebomb.desc=Den här bomben har modifierats för att spy ut ett tjockt gasmoln samtidigt som den exploderar. Den kommer att orsaka _%1$d-%2$d skada_ och sprida en höljande dimma inom 2 brickor.
items.bombs.smokebomb.discover_hint=Du kan tillverka detta föremål via alkemi.

items.bombs.regrowthbomb.name=återväxtbomb
items.bombs.regrowthbomb.desc=Den här specialanpassade bomben sprutar livgivande vätska överallt inom 3 brickor istället för att explodera. Området som fångas i explosionen kommer snabbt att gro gräs och växter. Du själv och alla allierade som fångas i explosionen kommer att läkas som om de hade druckit en läkande dryck.
items.bombs.regrowthbomb.discover_hint=Du kan tillverka detta föremål via alkemi.

items.bombs.shrapnelbomb.name=splitterbomb
items.bombs.shrapnelbomb.desc=Den här bomben har modifierats med metallbitar från DM-300, som kommer att splittras och flyga överallt när den exploderar och orsaka _%1$d-%2$d skada_ i ett stort område runt bomben. Det är bäst att gömma sig bakom något när man använder den...
items.bombs.shrapnelbomb.discover_hint=Du kan tillverka detta föremål via alkemi.

items.bombs.woollybomb.name=ullbomb
items.bombs.woollybomb.desc=Den här specialanpassade bomben skapar ett brett fält av magiska får när den exploderar. Explosionen kommer att ge _%1$d-%2$d skada_ till allt inom 2 brickor. Fåren kommer att blockera rörelse och kvarstå under en mycket lång tid! Fåren kommer dock inte att vara lika länge i närvaro av mäktiga fiender, och kan manuellt skingras tidigare genom att interagera med dem.
items.bombs.woollybomb.discover_hint=Du kan tillverka detta föremål via alkemi.

###food
items.food.berry.name=fängelsehålebär
items.food.berry.eat_msg=Det där bäret var gott!
items.food.berry.desc=Det här lilla bäret hittades av Jägarinnan bland fängelsehålans växtlighet. Det kan ätas snabbt, återställer en liten mättnadskänsla och kan innehålla ett användbart frö!
items.food.berry.discover_hint=Du kan hitta det här föremålet med hjälp av en specifik hjältetalang.

items.food.blandfruit.name=faddfrukt
items.food.blandfruit.cooked=kokt faddfrukt
items.food.blandfruit.sunfruit=solfrukt
items.food.blandfruit.rotfruit=rotfrukt
items.food.blandfruit.earthfruit=jordfrukt
items.food.blandfruit.blindfruit=blindfrukt
items.food.blandfruit.firefruit=firefruit
items.food.blandfruit.icefruit=isfrukt
items.food.blandfruit.fadefruit=fadefruit
items.food.blandfruit.sorrowfruit=sörjefrukt
items.food.blandfruit.stormfruit=stormfrukt
items.food.blandfruit.dreamfruit=magefruit
items.food.blandfruit.starfruit=stjärnfrukt
items.food.blandfruit.swiftfruit=swiftfruit
items.food.blandfruit.raw=Du står inte ut med att äta den rå.
items.food.blandfruit.desc=Så torr och oansenlig, kanske skulle den bli bättre om man stuvade den med någon annan ingrediens.
items.food.blandfruit.desc_cooked=Frukten har blivit tjockare av att ligga i blöt i grytan och har till och med absorberat egenskaperna hos fröet som den kokades med. Den kommer att ha effekten av den dryck som fröet motsvarade.
items.food.blandfruit.desc_eat=Den ser ut att vara redo att ätas!
items.food.blandfruit.desc_throw=Den verkar ganska flyktig, det kanske är bäst att kasta den.
items.food.blandfruit$chunks.name=blandfruktsbitar
items.food.blandfruit$chunks.desc=Blandfrukten har exploderat vid nedslaget och lämnat kvar inerta bitar.\n\nTrots lite smuts verkar dessa stora bitar av tillagad blandfrukt helt ätbara.

items.food.chargrilledmeat.name=charkgrillat kött
items.food.chargrilledmeat.desc=Det ser ut som en hyfsad biff.
items.food.chargrilledmeat.discover_hint=Du kan skapa detta med hjälp av ett annat livsmedel.

items.food.food.name=matransion
items.food.food.ac_eat=ÄTA
items.food.food.eat_msg=Den där maten smakade jättegott!
items.food.food.desc=Inget märkvärdigt här: torkat kött, några kex - såna saker.

items.food.frozencarpaccio.name=Fryst carpaccio
items.food.frozencarpaccio.invis=Du ser dina händer bli osynliga!
items.food.frozencarpaccio.hard=Du känner hur din hud hårdnar!
items.food.frozencarpaccio.refresh=Att fräscha upp!
items.food.frozencarpaccio.better=Du känner dig bättre!
items.food.frozencarpaccio.desc=Det är en bit fryst rått kött. Det enda sättet att äta det är genom att skära tunna skivor av det. Och på det här sättet är det förvånansvärt gott.
items.food.frozencarpaccio.discover_hint=Du kan skapa den här med hjälp av en annan matvara.

items.food.meatpie.name=köttpaj
items.food.meatpie.eat_msg=Den där maten var otrolig!
items.food.meatpie.desc=En utsökt paj fylld med smakrikt kött. Detta kommer att mätta dig mycket mer än någon annan måltid.
items.food.meatpie.discover_hint=Du kan tillverka detta föremål via alkemi.

items.food.mysterymeat.name=mysteriekött
items.food.mysterymeat.eat_msg=Den där maten smakade... konstigt.
items.food.mysterymeat.hot=Oh det är varmt!
items.food.mysterymeat.legs=Du kan inte känna dina ben!
items.food.mysterymeat.not_well=Du mår inte bra.
items.food.mysterymeat.stuffed=Du är proppmätt.
items.food.mysterymeat.desc=Ät på egen risk!
items.food.mysterymeat.discover_hint=Du kan få det här föremålet som en droppe från vissa fiender.
items.food.mysterymeat$placeholder.name=kött

items.food.phantommeat.name=fantomkött
items.food.phantommeat.desc=En stor glittrande genomskinlig biff, skuren från en fantompiranha. Detta magiska kött behöver inte tillagas och ger ett antal defensiva fördelar förutom att det gör dig mätt och belåten. När det äts ger det osynlighet, barkskinn, viss läkning och botar många skadliga effekter.
items.food.phantommeat.discover_hint=Du kan få det här föremålet som en droppe från vissa fiender.

items.food.pasty.name=pasty
items.food.pasty.fish_name=ångad fisk
items.food.pasty.amulet_name=Yendors amulett?
items.food.pasty.egg_name=påskägg
items.food.pasty.rainbow_name=regnbågsdryck
items.food.pasty.shattered_name=grön tårta
items.food.pasty.pie_name=pumpkin pie
items.food.pasty.vanilla_name=blå tårta
items.food.pasty.cane_name=polkagris
items.food.pasty.sparkling_name=gnistrande dryck
items.food.pasty.desc=En äkta Cornish pasty med traditionell fyllning av nötkött och potatis. Utsökt!
items.food.pasty.fish_desc=En hel ångkokt fisk, magiskt konserverad på en bädd av grönsaker. Det är tradition att spara lite fisk till senare vid den här tiden på året, så att du får lite rester istället för att äta allt på en gång.\n\nGlada Lunar New Year!
items.food.pasty.amulet_desc=Du har äntligen hittat den, den magiska amuletten av - vänta lite, det här är bara en folieförpackad choklad som ska se ut som amuletten! Den kommer inte att ge dig obegränsad kraft, men den kommer åtminstone att fylla dig och ge dig en liten artefaktladdning.\n\nApril Fools!
items.food.pasty.egg_desc=Ett stort chokladägg, inlindat i färgglad gul folie. Här finns tillräckligt med choklad för att du ska bli mätt, och sockret kan ge dina artefakter en liten extra laddning.\n\nGod påsk!
items.food.pasty.rainbow_desc=Den här färgglada drycken är ett slags flytande föda. Förutom att stilla din hunger innehåller den lite magi som lugnar en närliggande fiende som inte är boss, vilket gör att de tillfälligt tvekar att slåss mot dig.\n\nHappy Pride!
items.food.pasty.shattered_desc=Den här stora skivan vaniljtårta har färgglatt strössel och grön glasyr. Tårtan gjordes för att fira många års erfarenhet och kommer att ge dig en liten del av den erfarenheten när den äts.\n\nShattered Pixel Dungeon utgavs första gången den 5 augusti 2014. Grattis på födelsedagen Shattered Pixel Dungeon!
items.food.pasty.pie_desc=En stor bit pumpapaj. Dess söta och kryddiga smak kommer att fylla dig och ge dig en liten bit av läkning.\n\nHappy Halloween!
items.food.pasty.vanilla_desc=Den här stora skivan vaniljtårta har färgglatt strössel och blå glasyr. Tårtan gjordes för att fira många års erfarenhet och kommer att ge dig en liten del av den erfarenheten när den äts.\n\nDet ursprungliga Pixel Dungeon utgavs första gången den 4 december 2012. Grattis på födelsedagen Pixel Dungeon!
items.food.pasty.cane_desc=En enorm sockersöt polkagris. Den är tillräckligt stor för att fylla dig, och sockret kan ge dina trollstavar lite extra laddning också.\n\nGod jul!
items.food.pasty.sparkling_desc=Den här glittrande drycken är en sorts flytande föda. Den stillar hunger och simulerar mousserande vin, men är faktiskt inte alkoholhaltig. Den varma känslan i magen kommer att ge lite skydd.\n\nHappy New Year!
items.food.pasty$fishleftover.name=fiskrester
items.food.pasty$fishleftover.eat_msg=Den där maten smakade ok.
items.food.pasty$fishleftover.desc=Lite överbliven fisk från din förra måltid. Du kan äta den när du vill för att återställa lite hunger.

items.food.smallration.name=liten matranson
items.food.smallration.eat_msg=Den där maten smakade bra.
items.food.smallration.desc=Det ser ut precis som en vanlig matranson men är mindre.
items.food.smallration.discover_hint=Du kan köpa det här föremålet i en butik.

items.food.stewedmeat.name=stuvat kött
items.food.stewedmeat.eat_msg=Den här maten smakade bra.
items.food.stewedmeat.desc=Stuvningen av köttet har rensat det från sjukdomar och parasiter. Det bör vara säkert att äta.
items.food.stewedmeat.discover_hint=Du kan tillverka detta föremål med alkemi.

items.food.supplyration.name=försörjningsration
items.food.supplyration.desc=Den här ransonen lämnades i fängelsehålan av och för medlemmar i tjuvarnas gille. Den är särskilt utformad för att ätas när man är på språng och för att hjälpa till med allmänt skallebedrägeri. \n\nÄven om den inte mättar lika mycket som en vanlig ranson kan den ätas snabbt, ger lite direkt läkning och återställer en laddning till Rogue's skuggmantel.
items.food.supplyration.discover_hint=Du kan hitta det här föremålet med hjälp av en specifik hjältetalang.



##journal items
items.journal.documentpage.name=tornad sida
items.journal.documentpage.desc=En ensam sida, troligen utriven ur en bok av något slag. Du måste plocka upp den för att läsa den.

items.journal.alchemypage.name=tornad alkemibokssida
items.journal.alchemypage.desc=En sönderriven sida från en guidebok om alkemi.\n\nDet mesta av texten är för liten för att kunna läsas på avstånd, men du kan urskilja sidans titel:\n\n_"%s"_

items.journal.guidebook.name=tome of dungeon mastery
items.journal.guidebook.hint_mobile=Din guidebok har råd till dig! Tryck på den blinkande dagboksknappen längst upp till höger för att läsa den.
items.journal.guidebook.hint_desktop=Din guidebok har råd till dig! Välj den blinkande dagboksikonen (%s) uppe till höger för att läsa den.
items.journal.guidebook.hint_status=Guidebok
items.journal.guidebook.desc=En äventyrares guidebok, lämnad här av någon som bestämde sig för att äventyr inte var något för dem! Just den här boken är magisk och kan få äventyrare att läsa en sida vid rätt tillfälle.\n\nTrots den här funktionen är boken mest populär på grund av de stora orden "Don't Panic!" som står skrivna med stora vänliga bokstäver på omslaget.

items.journal.guidepage.name=torn guidebokssida
items.journal.guidepage.desc=En sönderriven sida från en äventyrsguide.\n\nDet mesta av texten är för liten för att kunna läsas på avstånd, men du kan urskilja sidans titel:\n\n_"%s"_

items.journal.regionlorepage$sewers.name=slitet brev
items.journal.regionlorepage$sewers.desc=Vad som ser ut att vara ett brev, skrivet på ett smutsfläckigt papper. Du måste plocka upp det för att kunna se vad som står på det.

items.journal.regionlorepage$prison.name=sliten dagbokspost
items.journal.regionlorepage$prison.desc=En dagboksanteckning, eller någon annan typ av anteckning, skriven på ett gammalt papper. Det verkar ha klarat sig bättre än de brev du hittade i kloakerna, men du måste ändå plocka upp det för att läsa det.

items.journal.regionlorepage$caves.name=gammal loggpost
items.journal.regionlorepage$caves.desc=Vad som ser ut att vara en post i en utforskares loggbok, bevarad förvånansvärt väl trots hur gammal den måste vara. Plocka upp den för att läsa den.

items.journal.regionlorepage$city.name=Rostad tablett
items.journal.regionlorepage$city.desc=En liten rostig metalltavla med ett meddelande magiskt etsat i den. Bokstäverna är fortfarande tydliga trots tavlans ålder, men du måste plocka upp den för att läsa det.

items.journal.regionlorepage$halls.name=glödande tablett
items.journal.regionlorepage$halls.desc=En liten svart tablett med glödande gröna bokstäver etsade i den. De lysande bokstäverna suddas ut till en dimma på avstånd, du måste plocka upp den för att läsa den.


###keys
items.keys.goldenkey.name=gyllene nyckel
items.keys.goldenkey.desc=Skårorna på den här gyllene nyckeln är små och invecklade. Kanske kan den öppna en låst kista?

items.keys.crystalkey.name=Kristallnyckel
items.keys.crystalkey.desc=De slipade ytorna på den här kristallnyckeln skimrar i mörkret. Kanske kan den öppna något som är gjort av kristall?

items.keys.ironkey.name=Järnnyckel
items.keys.ironkey.desc=Skårorna på den här urgamla järnnyckeln är väl slitna; dess läderband är slitet av ålder. Vilken dörr kan den öppna?

items.keys.wornkey.name=sliten nyckel
items.keys.wornkey.desc=Denna nyckel är sliten och missfärgad, men ser seriös ut. Förmodligen kan den öppna någon viktig dörr i närheten.



###potions
items.potions.potion.ac_drink=DRICK
items.potions.potion.turquoise=turkos trolldryck
items.potions.potion.crimson=crimson dryck
items.potions.potion.azure=azurblå dryck
items.potions.potion.jade=jade dryck
items.potions.potion.golden=gyllene trolldryck
items.potions.potion.magenta=magentadryck
items.potions.potion.charcoal=kolkolsdryck
items.potions.potion.ivory=elfenbenskulör
items.potions.potion.amber=bärnstensdryck
items.potions.potion.bistre=bistre dryck
items.potions.potion.indigo=indigo dryck
items.potions.potion.silver=silver dryck
items.potions.potion.unknown_desc=Den här flaskan innehåller en virvlande färgstark vätska. Vem vet vad den kommer att göra när den dricks eller kastas?
items.potions.potion.harmful=Skadlig trolldryck!
items.potions.potion.beneficial=Fördelaktig dryck
items.potions.potion.yes=Ja, jag vet vad jag gör
items.potions.potion.no=Nej, jag ändrade mig
items.potions.potion.sure_drink=Är du säker på att du vill dricka den? I de flesta fall bör du kasta sådana drycker på dina fiender.
items.potions.potion.sure_throw=Är du säker på att du vill kasta den? I de flesta fall är det vettigt att dricka den.
items.potions.potion.shatter=Kolven splittras och vätskan stänker ofarligt.
items.potions.potion.discover_hint=Du kan hitta det här föremålet slumpmässigt i fängelsehålan eller tillverka det via alkemi.
items.potions.potion$placeholder.name=dryck
items.potions.potion$seedtopotion.name=Slumpmässig dryck

items.potions.potionofexperience.name=erfarenhetsdryck
items.potions.potionofexperience.desc=De mytomspunna erfarenheterna från mängder av strider reducerade till flytande form, denna dryck kommer omedelbart att höja din erfarenhetsnivå.

items.potions.potionoffrost.name=Dryck av frost
items.potions.potionoffrost.desc=Kemikalien i denna dryck kommer att avdunsta till ett iskallt moln när den utsätts för utomhusluft.

items.potions.potionofhaste.name=dryck för brådska
items.potions.potionofhaste.energetic=Du känner dig energisk!
items.potions.potionofhaste.desc=Dricka denna märkligt söta vätska och du kommer att få enorm energi under en kort tid, vilket gör att du kan springa i höga hastigheter.

items.potions.potionofhealing.name=läkande dryck
items.potions.potionofhealing.heal=Dina sår börjar läka.
items.potions.potionofhealing.desc=Detta elixir återställer snabbt din hälsa och botar omedelbart många åkommor.

items.potions.potionofinvisibility.name=Dryck för osynlighet
items.potions.potionofinvisibility.invisible=Du ser dina händer bli osynliga!
items.potions.potionofinvisibility.desc=Drycker du denna dryck blir du tillfälligt osynlig. Vid osynlighet kommer fiender inte att kunna se dig. Fysiska attacker och magiska effekter (såsom skriftrullar och trollstavar) kommer omedelbart att avbryta osynligheten.

items.potions.potionoflevitation.name=trolldryck för levitation
items.potions.potionoflevitation.float=Du svävar upp i luften!
items.potions.potionoflevitation.desc=Drycker du denna märkliga vätska kommer du att sväva i luften och kan utan ansträngning glida över fällor och gropar. Om du kastar den här drycken skapas ett moln av oraffinerad gas som gör alla som fångas i det förvirrade.

items.potions.potionofliquidflame.name=dryck med flytande flamma
items.potions.potionofliquidflame.desc=Den här flaskan innehåller en instabil förening som kommer att brinna upp våldsamt vid exponering för öppen luft.

items.potions.potionofmindvision.name=Dryck för sinnesvision
items.potions.potionofmindvision.see_mobs=Du kan på något sätt känna närvaron av andra varelsers sinnen!
items.potions.potionofmindvision.see_none=Du kan på något sätt se att du är ensam på den här nivån just nu.
items.potions.potionofmindvision.desc=Efter att ha druckit detta kommer ditt sinne att bli anpassat till den psykiska signaturen hos avlägsna varelser, vilket gör att du kan känna biologisk närvaro genom väggar. Denna dryck kommer också att tillåta dig att se genom närliggande väggar och dörrar.

items.potions.potionofparalyticgas.name=dryck av paralytisk gas
items.potions.potionofparalyticgas.desc=Vid exponering för utomhusluft kommer vätskan i denna kolv att förångas till en bedövande gul dimma. Den som andas in molnet blir omedelbart förlamad och kan inte röra sig under en tid efter att molnet har skingrats. Detta föremål kan kastas mot avlägsna fiender för att fånga dem inom gasens effekt.

items.potions.potionofpurity.name=renhetsdryck
items.potions.potionofpurity.freshness=Du känner en ovanlig friskhet i luften.
items.potions.potionofpurity.protected=En skyddande film omsluter dig!
items.potions.potionofpurity.desc=Den här magiska reagensen neutraliserar snabbt alla skadliga områdesbundna effekter i ett stort område. Att dricka den ger dig tillfällig immunitet mot sådana effekter.

items.potions.potionofstrength.name=styrkans dryck
items.potions.potionofstrength.msg=Nyvunnen styrka strömmar genom din kropp, du har nu %d styrka!
items.potions.potionofstrength.desc=Den här kraftfulla vätskan rinner genom dina muskler och ökar din styrka permanent med en poäng.

items.potions.potionoftoxicgas.name=Dryck av giftig gas
items.potions.potionoftoxicgas.desc=Om du tömmer eller krossar detta trycksatta glas kommer innehållet att explodera i ett dödligt moln av giftig grön gas. Du kanske väljer att kasta den här drycken mot avlägsna fiender istället för att öppna den för hand.



###brews
items.potions.brews.brew.discover_hint=Du kan tillverka detta föremål via alkemi.

items.potions.brews.aquabrew.name=aqua-bryggning
items.potions.brews.aquabrew.desc=När den här brygden krossas kommer den att utgåva en skur av vatten under tryck på sin plats. Det är bara tillräckligt kraftfullt för att skada brinnande fiender, men det sprider också vatten till närliggande terräng, inaktiverar fällor, släcker bränder och slår tillbaka karaktärer nära utbrottet.

items.potions.brews.blizzardbrew.name=blizzardbrygd
items.potions.brews.blizzardbrew.desc=När den här brygden splittras släpper den lös en virvlande snöstorm som snabbt sprider sig som en gas.

items.potions.brews.causticbrew.name=kaustisk brygd
items.potions.brews.causticbrew.desc=Den här brygden sprider frätande slem i ett brett område runt platsen där den splittras. Allt som fångas av slemmet smälter långsamt om det inte kan tvättas bort med vatten.

items.potions.brews.infernalbrew.name=infernalbrygd
items.potions.brews.infernalbrew.desc=När den här brygden krossas släpper den lös ett rasande inferno som snabbt sprider sig som en gas.

items.potions.brews.shockingbrew.name=chockerande brygd
items.potions.brews.shockingbrew.desc=När den bryggs sönder släpper den här brygden lös en elektrisk storm i ett stort område runt platsen där den bryts sönder.

items.potions.brews.unstablebrew.name=obeständig brygd
items.potions.brews.unstablebrew.desc=Den här magiska brygden lyser i regnbågens skiftande färger.\n\nNär den dricks eller kastas utlöser den effekten av en slumpmässig dryck. Dryckens effekt kommer alltid att vara fördelaktig om den dricks och alltid skadlig om den kastas.

###elixirs
items.potions.elixirs.elixir.discover_hint=Du kan tillverka detta föremål via alkemi.

items.potions.elixirs.elixirofarcanearmor.name=elixir av arkans rustning
items.potions.elixirs.elixirofarcanearmor.desc=Det här elixiret ger den som dricker ett långvarigt motstånd mot magisk skada.

items.potions.elixirs.elixirofaquaticrejuvenation.name=elixir för akvatisk föryngring
items.potions.elixirs.elixirofaquaticrejuvenation.desc=Detta elixir innehåller resterna av Goo förstärkt med en läkande dryck. Även om det inte ger omedelbar läkning, kommer det stadigt att återställa en större mängd hälsa vid vatten.
items.potions.elixirs.elixirofaquaticrejuvenation$aquahealing.name=akvatisk läkning
items.potions.elixirs.elixirofaquaticrejuvenation$aquahealing.desc=Du har tillfälligt fått återuppbyggande egenskaper som liknar Goo.\n\nNär du står i vatten återhämtar du en liten mängd hälsa per tur. Effekten pausas när du är vid full hälsa eller är ute ur vattnet.\n\nHealing left: %d.

items.potions.elixirs.elixirofdragonsblood.name=elixir av drakens blod
items.potions.elixirs.elixirofdragonsblood.desc=När detta elixir konsumeras kommer det att skicka eldiga krafter genom drickarens ådror. Denna effekt gör drickaren immun mot eld och gör det möjligt för dem att sätta fiender i brand med fysiska attacker.

items.potions.elixirs.elixiroffeatherfall.name=elixir för fjäderfall
items.potions.elixirs.elixiroffeatherfall.light=Du känner dig lätt som en fjäder!
items.potions.elixirs.elixiroffeatherfall.desc=Detta elixir ger en svagare men mer kontrollerad levitationseffekt, vilket gör att drickaren kan falla långa sträckor utan att skadas vid ett litet tillfälle.
items.potions.elixirs.elixiroffeatherfall$featherbuff.name=fjäderfall
items.potions.elixirs.elixiroffeatherfall$featherbuff.desc=Du är under påverkan av en feather fall elixir, vilket gör att du kan falla ner i avgrunder utan att ta skada!\n\nResterande varv: %s.

items.potions.elixirs.elixirofhoneyedhealing.name=elixir av honungsläkning
items.potions.elixirs.elixirofhoneyedhealing.desc=Detta elixir kombinerar läkning med honungens sötma. När det dricks har det samma effekt som en läkande dryck och stillar en liten del av hungern, men det kan också kastas för att läka en allierad.\n\nVarelser som är förtjusta i honung kan bli lugnade om det här föremålet används på dem.

items.potions.elixirs.elixiroficytouch.name=elixir av isig beröring
items.potions.elixirs.elixiroficytouch.desc=När detta elixir konsumeras kan den som dricker det suga åt sig värmen från fiender som de attackerar. Denna effekt gör drickaren immun mot kyla och gör det möjligt för dem att kyla fiender med fysiska attacker.

items.potions.elixirs.elixirofmight.name=elixir av makt
items.potions.elixirs.elixirofmight.msg=Nyvunnen styrka strömmar genom din kropp, du har nu %d styrka!
items.potions.elixirs.elixirofmight.desc=Den här kraftfulla vätskan rinner genom dina muskler, ökar din styrka permanent med en poäng och ökar din maximala hälsa tillfälligt med %d poäng. Hälsoökningen skalas med din maximala hälsa, men kommer långsamt att avta när du går upp i nivå.
items.potions.elixirs.elixirofmight$htboost.name=max hälsoboost
items.potions.elixirs.elixirofmight$htboost.desc=Din kropp känns onaturligt stark och frisk.\n\nDin maximala hälsa boostas under en längre tid. När du går upp i nivå kommer boostet att avta stadigt.\n\nAktuellt boostbelopp: %d.\nResterande nivåer: %d.

items.potions.elixirs.elixiroftoxicessence.name=elixir av giftig essens
items.potions.elixirs.elixiroftoxicessence.desc=När detta elixir konsumeras kommer det att förse den som dricker det med giftig energi. Den som dricker kommer kontinuerligt att sprida giftig gas när de rör sig, och kommer att vara immun mot giftig gas och gift under något längre tid än effektens varaktighet.



###exotic potions
items.potions.exotic.exoticpotion.turquoise=exotisk turkos dryck
items.potions.exotic.exoticpotion.crimson=exotisk crimson-dryck
items.potions.exotic.exoticpotion.azure=exotisk azurblå dryck
items.potions.exotic.exoticpotion.jade=exotisk jade-dryck
items.potions.exotic.exoticpotion.golden=exotisk gyllene dryck
items.potions.exotic.exoticpotion.magenta=exotisk magenta-dryck
items.potions.exotic.exoticpotion.charcoal=exotisk träkolsdryck
items.potions.exotic.exoticpotion.ivory=exotisk elfenbensdryck
items.potions.exotic.exoticpotion.amber=exotisk bärnstensdryck
items.potions.exotic.exoticpotion.bistre=exotisk bistre dryck
items.potions.exotic.exoticpotion.indigo=exotisk indigo-dryck
items.potions.exotic.exoticpotion.silver=exotisk silverdryck
items.potions.exotic.exoticpotion.unknown_desc=Den här runda flaskan innehåller en kornig färgstark vätska. Den verkar vara främmande för det här landet, vem vet vad den kan göra när den dricks eller kastas?
items.potions.exotic.exoticpotion.warning=Vill du verkligen avbryta användningen av den här drycken? Den kommer att förbrukas i alla fall.
items.potions.exotic.exoticpotion.yes=Ja, jag är positiv
items.potions.exotic.exoticpotion.no=Nej, jag ändrade mig
items.potions.exotic.exoticpotion.discover_hint=Du kan tillverka detta föremål via alkemi.

items.potions.exotic.potionofcleansing.name=reningsdryck
items.potions.exotic.potionofcleansing.desc=Den här kraftfulla reagensen gör drickaren immun mot alla skadliga statuseffekter i några varv när den dricks. Den kan också kastas på ett mål för att rena dem.
items.potions.exotic.potionofcleansing$cleanse.name=renad
items.potions.exotic.potionofcleansing$cleanse.desc=Den här karaktären är tillfälligt immun mot alla skadliga statuseffekter!\n\nÅterstående turer: %s.

items.potions.exotic.potionofcorrosivegas.name=Dryck av frätande gas
items.potions.exotic.potionofcorrosivegas.desc=Om du tömmer eller krossar detta trycksatta glas kommer innehållet att explodera i ett dödligt moln av frätande rostfärgad gas. Gasen sprider sig snabbare än giftig gas och är mer dödlig, men varar inte lika länge.

items.potions.exotic.potionofdragonsbreath.name=dryck av drakens andedräkt
items.potions.exotic.potionofdragonsbreath.prompt=Välj en plats att bränna
items.potions.exotic.potionofdragonsbreath.desc=Den här flaskan innehåller en ovanlig förening som fattar eld strax efter att den blandats med saliv. Genom att snabbt spotta ut vätskan kan användaren spy ut lågor från munnen!

items.potions.exotic.potionofearthenarmor.name=Dryck för jordrustning
items.potions.exotic.potionofearthenarmor.desc=Istället för att förlama har denna vätska en härdande effekt på huden som gör den till en tillfällig naturlig rustning.

items.potions.exotic.potionofdivineinspiration.name=Dryck för gudomlig inspiration
items.potions.exotic.potionofdivineinspiration.no_more_points=Du kan inte få fler bonustalangpoäng.
items.potions.exotic.potionofdivineinspiration.select_tier=Välj en talangnivå för att få två bonuspoäng i. Du måste ha låst upp nivån för att kunna spendera poängen.
items.potions.exotic.potionofdivineinspiration.bonus=+2 talangpoäng!
items.potions.exotic.potionofdivineinspiration.desc=Kraften av helig energi reducerad till flytande form, denna dryck kommer att ge drickaren gudomlig kraft och ge dem två bonustalangpoäng i en nivå som de väljer.\n\nDen här drycken kan bara användas en gång för varje talangnivå.

items.potions.exotic.potionofmagicalsight.name=Dryck för magisk syn
items.potions.exotic.potionofmagicalsight.desc=Efter att ha druckit detta kommer dina sinnen att kortvarigt höjas till otroliga nivåer, så att du kan se genom väggar i en radie av 12 plattor!

items.potions.exotic.potionofmastery.name=Dryck för mästerskap
items.potions.exotic.potionofmastery.prompt=Mästra ett föremål
items.potions.exotic.potionofmastery.weapon_easier=Ditt vapen blir lättare att hantera!
items.potions.exotic.potionofmastery.armor_easier=Din rustning blir lättare att bära!
items.potions.exotic.potionofmastery.desc=Istället för att ge rå styrka, anpassar denna dryck användarens muskler till ett visst föremål. Detta gör föremålet lättare att använda, som om användaren hade övat med det och byggt upp muskelminne.\n\nDet valda vapnet eller rustningen kräver 2 mindre styrka att använda. Denna dryck kan endast användas en gång på varje föremål.

items.potions.exotic.potionofshielding.name=skyddande dryck
items.potions.exotic.potionofshielding.desc=Istället för att läka, projicerar denna dryck en hållbar sköld runt användarens kropp som blockerar en betydande mängd skada.

items.potions.exotic.potionofshroudingfog.name=dryck av höljande dimma
items.potions.exotic.potionofshroudingfog.desc=När vätskan i den här flaskan utsätts för luft kommer den att producera en tjock rökig dimma som snabbt sprider sig och blockerar dina fienders syn.

items.potions.exotic.potionofsnapfreeze.name=Snabbfrysningsdryck
items.potions.exotic.potionofsnapfreeze.desc=Kemikalien i den här drycken reagerar snabbt med luften och fryser och rotfäster omedelbart alla inom dess effekt.

items.potions.exotic.potionofstamina.name=Dryck för uthållighet
items.potions.exotic.potionofstamina.desc=Dricka denna märkligt söta vätska kommer att ge dig en långvarig energikick, så att du kan springa i snabbare takt under en längre tid.

items.potions.exotic.potionofstormclouds.name=Dryck av stormmoln
items.potions.exotic.potionofstormclouds.desc=Att kasta denna dryck skapar ett snabbt spridande moln av koncentrerad ånga, som kondenserar och vräker ner över omgivningen. Den mesta terrängen kommer att omvandlas till vatten, eldiga fiender kommer att ta skada, eld kommer att släckas och fällor kommer att överväldigas och gå sönder.



###quest items
items.quest.ceremonialcandle.name=ceremoniljus
items.quest.ceremonialcandle.desc=En uppsättning ljus som smälts ner och smälts samman genom användning.\n\nEnskilt är de värdelösa, men tillsammans med andra ljus i ett mönster kan de fokusera energin för en åkallningsritual.
items.quest.ceremonialcandle.discover_hint=Du kan hitta detta föremål under ett specifikt uppdrag.

items.quest.corpsedust.name=korpsdamm
items.quest.corpsedust.chill=En rysning går längs ryggraden.
items.quest.corpsedust.desc=Bollen av likstoft skiljer sig inte utåt från en vanlig stoftboll. Men du kan känna en illvillig energi som lurar inom den.\n\nAtt bli av med den så snart som möjligt vore en bra idé.
items.quest.corpsedust.discover_hint=Du kan hitta detta föremål under ett specifikt uppdrag.

items.quest.darkgold.name=mörk guldmalm
items.quest.darkgold.you_now_have=Du har nu %d mörkt guldmalm.
items.quest.darkgold.desc=Den här metallen kallas mörk, inte på grund av dess färg (den skiljer sig inte från vanligt guld), utan för att den smälter i dagsljus och blir oanvändbar på ytan.
items.quest.darkgold.discover_hint=Du kan hitta detta föremål under ett specifikt uppdrag.

items.quest.dwarftoken.name=dwarf token
items.quest.dwarftoken.desc=Många dvärgar och några av deras större skapelser bär på dessa små metallbitar med okänt syfte. Kanske är de smycken eller kanske någon form av ID. Dvärgar är ett märkligt folk.
items.quest.dwarftoken.discover_hint=Du kan hitta detta föremål under ett specifikt uppdrag.

items.quest.embers.name=elementär glöd
items.quest.embers.desc=Särskild glöd som bara kan skördas från unga eldelementaler. De utstrålar värmeenergi.
items.quest.embers.discover_hint=Du kan hitta detta föremål under ett specifikt uppdrag.

items.quest.escapecrystal.name=flyktkristall
items.quest.escapecrystal.ac_use=användning
items.quest.escapecrystal.desc=En tunn magisk kristall som verkar innehålla teleportationsmagi. Du kan använda kristallen när som helst för att lämna dvärgarnas valv, men du kan inte ta med dig något!
items.quest.escapecrystal.discover_hint=Du kan hitta detta föremål under ett specifikt uppdrag.

items.quest.gooblob.name=Glob av gegga
items.quest.gooblob.desc=En klumpig klump av gegga som delades av från Goo när den dog. Den är nästan som en stor geléboll, men du skulle inte våga äta den.\n\nDen gör ingenting på egen hand, men den kan vara användbar i kombination med vissa drycker eller en bomb. Åtminstone bör den omvandlas till en anständig mängd energi.
items.quest.gooblob.discover_hint=Du kan få det här föremålet som en droppe från vissa fiender.

items.quest.metalshard.name=förbannad metallskärva
items.quest.metalshard.desc=En skärva av rostig förbannad metall, som bröts av DM-300 när den förstördes. Du kan känna en inaktiv illvillig magi i den."\n\nDen gör ingenting på egen hand, men den kan vara användbar i kombination med vissa skriftrullar eller en bomb. Åtminstone borde den kunna omvandlas till en anständig mängd energi.
items.quest.metalshard.discover_hint=Du kan få det här föremålet som en droppe från vissa fiender.

items.quest.pickaxe.name=pickaxe
items.quest.pickaxe.ability_name=pierce
items.quest.pickaxe.ability_desc=Duellisten kan _pierce_ en fiende med en hacka. Detta är garanterat att träffa, gäller sårbart i 3 varv och ger _%1$d-%2$d skada_ på fiender med styv hud.
items.quest.pickaxe.upgrade_ability_stat_name=Förmågans skada
items.quest.pickaxe.desc=Detta är ett robust och tungt verktyg för att bryta stenar. Du behöver inte utrusta pickaxen för att bryta sten med den, men den kan förmodligen utrustas som ett vapen i nödfall.
items.quest.pickaxe.discover_hint=Du kan hitta detta föremål under ett specifikt uppdrag.

items.quest.ratskull.name=gigantisk råttskalle
items.quest.ratskull.desc=En förvånansvärt stor råttskalle. Den skulle bli en fin jakttrofé om du hade en vägg att hänga upp den på.



###remains
items.remains.remainsitem.ac_use=USE
items.remains.remainsitem.discover_hint=Du kan hitta det här föremålet i resterna av en specifik hjälte från en tidigare lost run.

items.remains.bowfragment.name=bågfragment
items.remains.bowfragment.desc=Det här trasiga träfragmentet var en gång en del av en förlorad jägarinnas andebåge. Du kan fortfarande känna lite naturenergi kvar i fragmentet, du kan använda fragmentet för att odla lite högt gräs runt dig. Om du gör detta kommer fragmentet dock att förstöras.

items.remains.brokenhilt.name=bruten hilt
items.remains.brokenhilt.desc=Det här trasiga fästet ser ut att komma från en besegrad duellants vapen. Du kan fortfarande känna lite kampkraft kvar i fästet, du kan använda det för att få lite bonusskada på dina nästa två närstridsträffar. Att göra detta kommer dock att förstöra fästet.

items.remains.brokenstaff.name=bruten stav
items.remains.brokenstaff.desc=Den här magikerstaven har brutits mitt itu efter att dess ägare mötte sin död. Du kan fortfarande känna lite magisk energi kvar i staven, du kan använda den för att ge dina trollstavar en liten laddningsökning. Om du gör detta kommer dock staven att förstöras.

items.remains.cloakscrap.name=skrot av tyg
items.remains.cloakscrap.desc=Den här skroten av genomskinligt tyg ser ut som om den kom från en sen Rogues skuggmantel. Du kan fortfarande känna att det finns lite mystisk energi kvar i det, du kan använda det för att ge dina artefakter en liten laddningsökning. Att göra detta kommer dock att förstöra tyget.

items.remains.sealshard.name=förseglingsskärvor
items.remains.sealshard.desc=De här små skärvorna av rött vax ser ut att komma från en fallen krigares sigill. Du kan fortfarande känna lite viljestyrka klamra sig fast vid sigillet, du kan använda det för att ge dig själv lite sköld. Att göra detta kommer dock att förstöra sigillskärvorna.

items.remains.tornpage.name=torn page
items.remains.tornpage.desc=Den här sidan ser ut att ha rivits ut ur en utgången Clerics heliga tome. Det finns fortfarande lite gudomlig energi kvar på den, du kan använda den för att återfå lite hälsa. Om du gör detta kommer dock den sönderrivna sidan att förstöras.



###rings
items.rings.ring.diamond=diamantring
items.rings.ring.opal=opalring
items.rings.ring.garnet=granatring
items.rings.ring.ruby=ruby ring
items.rings.ring.amethyst=ametistring
items.rings.ring.topaz=topasring
items.rings.ring.onyx=onyxring
items.rings.ring.tourmaline=turmalinring
items.rings.ring.emerald=smaragdring
items.rings.ring.sapphire=safirring
items.rings.ring.quartz=kvartsring
items.rings.ring.agate=agatring
items.rings.ring.equip_cursed=Ringen stramar åt runt ditt finger smärtsamt!
items.rings.ring.unknown_desc=Det här metallbandet är prytt med en stor ädelsten som glittrar i mörkret. Vem vet vilken effekt den har när den bärs?
items.rings.ring.known=Det här är en %s
items.rings.ring.identify=Du är nu tillräckligt bekant med din ring för att identifiera den.
items.rings.ring.cursed_worn=Den här ringen är förbannad och du kan inte ta bort den.
items.rings.ring.curse_known=Du kan känna en illvillig magi som lurar i den här ringen.
items.rings.ring.not_cursed=Den här ringen är fri från illvillig magi.

items.rings.ringofaccuracy.name=ring av noggrannhet
items.rings.ringofaccuracy.stats=När du bär den här ringen ökar din träffsäkerhet med _%s%%._
items.rings.ringofaccuracy.typical_stats=När du bär den här ringen kommer den vanligtvis att öka din precision med _%s%%._
items.rings.ringofaccuracy.combined_stats=Dina utrustade ringar kombinerar sin kraft och ökar din träffsäkerhet med _%s%%_ totalt.
items.rings.ringofaccuracy.upgrade_stat_name_1=Noggrannhetsboost
items.rings.ringofaccuracy.desc=Den här ringen ökar ditt fokus, vilket gör det lättare för dina attacker att hitta sitt mål. En förbannad ring kommer istället att göra det svårare för dina attacker att träffa.

items.rings.ringofarcana.name=arkanas ring
items.rings.ringofarcana.stats=När den bärs ökar den här ringen kraften i förtrollningar och glyfer med _%s%%._
items.rings.ringofarcana.typical_stats=När den bärs ökar den här ringen vanligtvis kraften hos förtrollningar och glyfer med _%s%%._
items.rings.ringofarcana.combined_stats=Dina utrustade ringar kombinerar sin kraft, vilket ökar kraften hos förtrollningar och glyfer med _%s%%_ totalt.
items.rings.ringofarcana.upgrade_stat_name_1=Arcana Boost
items.rings.ringofarcana.desc=Den här ringen förstärker magiska förtrollningar på vapen och glyfer på rustningar, inklusive förbannelser! Den ökar först aktiveringschansen och ökar sedan styrkan i effekten när aktiveringschansen är 100%. En förbannad ring kommer istället att försvaga förtrollningar, glyfer och förbannelser.

items.rings.ringofelements.name=ring av element
items.rings.ringofelements.stats=När den bärs ger den här ringen _%s%%_ elementarresistens.
items.rings.ringofelements.typical_stats=När den bärs ger den här ringen typiskt _%s%%_ elementärt motstånd.
items.rings.ringofelements.combined_stats=Dina utrustade ringar kombinerar sin kraft och ger totalt _%s%%_ elementärt motstånd.
items.rings.ringofelements.upgrade_stat_name_1=Motstånd
items.rings.ringofelements.desc=Den här ringen ger motstånd mot de flesta elementära och magiska effekter, vilket minskar skadans och debuffens varaktighet. Naturligtvis kommer en förbannad ring istället att förvärra dessa effekter.

items.rings.ringofenergy.name=ring av energi
items.rings.ringofenergy.stats=När den här ringen bärs ökar laddningshastigheten för trollstav, artefakt och heroisk rustning med _%s%%._
items.rings.ringofenergy.typical_stats=När den här ringen bärs ökar den vanligtvis laddningshastigheten för trollstavar, artefakter och heroiska rustningar med _%s%%._
items.rings.ringofenergy.combined_stats=Dina utrustade ringar kombinerar sin kraft och ökar laddningshastigheten med _%s%%_ totalt.
items.rings.ringofenergy.upgrade_stat_name_1=Laddningsboost
items.rings.ringofenergy.desc=Din magiska utrustning laddas upp snabbare i det arkaiska fält som strålar ut från den här ringen. En förbannad ring kommer istället att sakta ner uppladdningen.

items.rings.ringofevasion.name=ring för undvikande
items.rings.ringofevasion.stats=När den bärs ökar denna ring din undvikande förmåga med _%s%%._
items.rings.ringofevasion.typical_stats=När den här ringen bärs ökar den vanligtvis din evasion med _%s%%._
items.rings.ringofevasion.combined_stats=Dina utrustade ringar kombinerar sin kraft och ökar din undvikandeförmåga med _%s%%_ totalt.
items.rings.ringofevasion.upgrade_stat_name_1=Evasion Boost
items.rings.ringofevasion.desc=Den här ringen gör att bäraren reagerar snabbare, vilket gör det svårare att få in slag på dem. En förbannad ring kommer istället att göra användaren lättare att slå.

items.rings.ringofforce.name=ring av kraft
items.rings.ringofforce.stats=När du är obeväpnad, med din nuvarande styrka, kommer denna ring att ge _%1$d-%2$d skada._ Med ett vapen utrustat kommer denna ring att öka skadan med _%3$d._
items.rings.ringofforce.typical_stats=När du är obeväpnad, med din nuvarande styrka, kommer den här ringen vanligtvis att ge _%1$d-%2$d skada._ Med ett vapen utrustat kommer den här ringen vanligtvis att öka skadan med _%3$d._
items.rings.ringofforce.combined_stats=Dina utrustade ringar kombinerar sin kraft, vilket ger totalt _%1$d-%2$d skada_ utan vapen, eller ökar skadan med _%3$d_ med ett vapen.
items.rings.ringofforce.upgrade_stat_name_1=Obeväpnad skada
items.rings.ringofforce.upgrade_stat_name_2=Beväpnad skadeboost
items.rings.ringofforce.upgrade_stat_name_3=Förmåga Skada
items.rings.ringofforce.ability_name=brawler's stance
items.rings.ringofforce.typical_ability_desc=Duellisten kan anta en _brawler's stance_ med denna ring, vilket gör att hennes vanliga attacker alltid använder denna ring även med ett vapen utrustat. Dessa attacker kommer vanligtvis att ge _%1$d-%2$d skada_ och kommer också att ärva vapnets förtrollning och förstärkning. Denna hållning saktar ner vapnets laddningshastighet med 50%%.
items.rings.ringofforce.ability_desc=Duellisten kan anta en _brawler's stance_ med den här ringen, vilket gör att hennes vanliga attacker alltid använder den här ringen även med ett vapen utrustat. Dessa attacker kommer att ge _%1$d-%2$d skada_ och kommer också att ärva vapnets förtrollning och förstärkning. Denna hållning saktar ner vapnets laddningshastighet med 50%%.
items.rings.ringofforce.desc=Den här ringen förstärker kraften i bärarens närstridsslag. Denna extra kraft är ganska svag när man använder vapen, men en obeväpnad attack blir mycket starkare. En förbannad ring kommer istället att försvaga bärarens slag.
items.rings.ringofforce$brawlersstance.name=brawler's stance
items.rings.ringofforce$brawlersstance.desc=Vid denna hållning kommer duellantens vanliga attacker att använda en utrustad kraftring även när hon har ett vapen utrustat. Dessa attacker får bonusskada och kommer fortfarande att använda vapnets förstärkning och förtrollning.\n\nAtt upprätthålla denna ställning kräver dock fokus, vilket minskar vapenförmågans laddningshastighet med 50%.\n\nDenna ställning kan slås på eller av med hjälp av en ring av kraft, men minskningen av laddningshastigheten kommer att kvarstå vid en liten stund om ställningen snabbt aktiveras och avaktiveras.

items.rings.ringoffuror.name=ring av furor
items.rings.ringoffuror.stats=När den bärs ökar den här ringen hastigheten på dina attacker med _%s%%._
items.rings.ringoffuror.typical_stats=När den här ringen bärs ökar den vanligtvis hastigheten på dina attacker med _%s%%._
items.rings.ringoffuror.combined_stats=Dina utrustade ringar kombinerar sin kraft och ökar hastigheten på dina attacker med _%s%%_ totalt.
items.rings.ringoffuror.upgrade_stat_name_1=Attackhastighetsökning
items.rings.ringoffuror.desc=Den här ringen ger bäraren ett inre raseri, vilket gör att de kan attackera snabbare. En förbannad ring kommer istället att sakta ner bärarens attackhastighet.

items.rings.ringofhaste.name=ring av hast
items.rings.ringofhaste.stats=När den bärs ökar denna ring din rörelsehastighet med _%s%%._
items.rings.ringofhaste.typical_stats=När den här ringen bärs ökar den vanligtvis din rörelsehastighet med _%s%%._
items.rings.ringofhaste.combined_stats=Dina utrustade ringar kombinerar sin kraft och ökar din rörelsehastighet med _%s%%_ totalt.
items.rings.ringofhaste.upgrade_stat_name_1=Ökning av rörelsehastigheten
items.rings.ringofhaste.desc=Den här ringen minskar den stress som rörelse innebär för bäraren, vilket gör att de kan springa i övermänskliga hastigheter. En förbannad ring kommer istället att tynga ner bäraren.

items.rings.ringofmight.name=ring av makt
items.rings.ringofmight.stats=När du bär den här ringen ökar din styrka med _%1$d_ och din max HP med _%2$s%%._
items.rings.ringofmight.typical_stats=När den bärs ökar denna ring vanligtvis din styrka med _%1$d_ och din maximala HP med _%2$s%%._
items.rings.ringofmight.combined_stats=Dina utrustade ringar kombinerar sin kraft och ökar din styrka med _%1$d_ och max HP med _%2$s%%_ totalt.
items.rings.ringofmight.upgrade_stat_name_1=Styrkeökning
items.rings.ringofmight.upgrade_stat_name_2=Max HP Boost
items.rings.ringofmight.desc=Den här ringen förstärker bärarens fysiska egenskaper, vilket ger dem större fysisk styrka och konstitution. En förbannad ring kommer att försvaga bäraren.

items.rings.ringofsharpshooting.name=ring för skarpt skytte
items.rings.ringofsharpshooting.stats=När den bärs kommer denna ring att öka skadan på dina kastvapen som om deras nivå ökades med _%1$d_, och kommer att öka deras hållbarhet med _%2$s%%._.
items.rings.ringofsharpshooting.typical_stats=När den bärs kommer den här ringen vanligtvis att öka skadan på dina kastade vapen som om deras nivå ökades med _%1$d_ och kommer att öka deras hållbarhet med _%2$s%%._
items.rings.ringofsharpshooting.combined_stats=Dina utrustade ringar kombinerar sin kraft, vilket ökar den effektiva kastvapennivån med _%1$d_ och ökar deras hållbarhet med _%2$s%%_ totalt.
items.rings.ringofsharpshooting.upgrade_stat_name_1=Nivåskadeförstärkning
items.rings.ringofsharpshooting.upgrade_stat_name_2=Hållbarhetsförbättring
items.rings.ringofsharpshooting.desc=Den här ringen förbättrar bärarens precision och sikte, vilket gör att alla projektilvapen blir mer skadliga och hållbara. En förbannad ring kommer att ha motsatt effekt.

items.rings.ringoftenacity.name=ring av uthållighet
items.rings.ringoftenacity.stats=När den här ringen bärs kommer den att minska skadan du tar med upp till _%s%%._
items.rings.ringoftenacity.typical_stats=När den här ringen bärs kommer den vanligtvis att minska skadan du tar med upp till _%s%%._
items.rings.ringoftenacity.combined_stats=Dina utrustade ringar kombinerar sin kraft och minskar den skada du tar med upp till _%s%%_ totalt.
items.rings.ringoftenacity.upgrade_stat_name_1=Max skaderesistens
items.rings.ringoftenacity.desc=När den bärs gör den här ringen det möjligt för bäraren att motstå normalt dödliga slag. Ju mer skadad användaren är, desto mer motståndskraftig blir hen mot skador. En förbannad ring kommer istället att göra det lättare för fiender att avrätta bäraren.

items.rings.ringofwealth.name=ring av rikedom
items.rings.ringofwealth.stats=När den bärs ökar denna ring din tur med _%s%%._
items.rings.ringofwealth.typical_stats=När du bär den här ringen kommer den vanligtvis att öka din tur med _%s%%._
items.rings.ringofwealth.combined_stats=Dina utrustade ringar kombinerar sin kraft och ökar din tur med _%s%%_ totalt.
items.rings.ringofwealth.upgrade_stat_name_1=Luck Boost
items.rings.ringofwealth.desc=Den här ringen fungerar som en magnet för skatter, vilket ökar sannolikheten för att fiender och behållare bär på värdefulla föremål. En förbannad ring kommer istället att minska din chans att få byte.



###scrolls
items.scrolls.scroll.ac_read=LÄSA
items.scrolls.scroll.kaunan=skriftrulle av KAUNAN
items.scrolls.scroll.sowilo=skriftrullen av SOWILO
items.scrolls.scroll.laguz=skriftrullen av LAGUZ
items.scrolls.scroll.yngvi=skriftrulle av YNGVI
items.scrolls.scroll.gyfu=skriftrulle av GYFU
items.scrolls.scroll.raido=skriftrullen av RAIDO
items.scrolls.scroll.isaz=skriftrulle av ISAZ
items.scrolls.scroll.mannaz=skriftrulle av MANNAZ
items.scrolls.scroll.naudiz=skriftrulle av NAUDIZ
items.scrolls.scroll.berkanan=skriftrulle av BERKANAN
items.scrolls.scroll.odal=skriftrulle av ODAL
items.scrolls.scroll.tiwaz=skriftrulle av TIWAZ
items.scrolls.scroll.unknown_desc=En oläslig magisk runa är skriven på detta pergament. Vem vet vad den kommer att göra när den läses högt?
items.scrolls.scroll.blinded=Du kan inte läsa en skriftrulle vid blindhet.
items.scrolls.scroll.no_magic=Du kan inte läsa en skriftrulle vid magiimmunitet.
items.scrolls.scroll.cursed=Din förbannade besvärjelsebok hindrar dig från att använda den här skriftrullens magi! En skriftrulle för att ta bort förbannelsen kan vara tillräckligt stark för att ändå fungera...
items.scrolls.scroll$placeholder.name=skriftrulle

items.scrolls.inventoryscroll.warning=Vill du verkligen avbryta användningen av den här skriftrullen? Skriftrullen var inte identifierad tidigare, så den kommer att användas ändå.
items.scrolls.inventoryscroll.yes=Ja, jag är positiv
items.scrolls.inventoryscroll.no=Nej, jag ändrade mig

items.scrolls.scrollofidentify.name=skriftrulle för identifiering
items.scrolls.scrollofidentify.inv_title=Identifiera ett föremål
items.scrolls.scrollofidentify.it_is=Ditt föremål har identifierats: %s.
items.scrolls.scrollofidentify.desc=Den här skriftrullen avslöjar permanent alla hemligheter för ett enda föremål.

items.scrolls.scrolloflullaby.name=skriftrulle med vaggvisa
items.scrolls.scrolloflullaby.sooth=Skriftrullen framför en lugnande melodi. Du känner dig väldigt sömnig.
items.scrolls.scrolloflullaby.desc=Läsningen av denna skriftrulle avger en lugnande melodi som kommer att vagga alla som hör den in i en djup magisk sömn. För läsaren och deras allierade är sömnen stärkande.

items.scrolls.scrollofmagicmapping.name=Skriftrulle med magisk kartläggning
items.scrolls.scrollofmagicmapping.layout=Du är nu medveten om nivåns layout.
items.scrolls.scrollofmagicmapping.desc=När denna skriftrulle läses kommer en kristallklar bild att etsas in i ditt minne, varna dig för den exakta utformningen av nivån och avslöja alla dolda hemligheter. Platserna för föremål och varelser kommer att förbli okända.

items.scrolls.scrollofmirrorimage.name=spegelbildsrulle
items.scrolls.scrollofmirrorimage.copies=Skriftrullen skapar spegelbilder av dig.
items.scrolls.scrollofmirrorimage.no_copies=Skriftrullen försöker skapa spegelbilder av dig, men de har ingenstans att ta vägen.
items.scrolls.scrollofmirrorimage.desc=Besvärjelsen på denna skriftrulle kommer att skapa två illusoriska tvillingar av läsaren. Dessa spegelbilder fungerar som svagare kloner av läsaren, och kommer att jaga sina fiender. De har dock ingen hållbarhet och kommer att blekna när de tar skada.

items.scrolls.scrollofretribution.name=skriftrulle av vedergällning
items.scrolls.scrollofretribution.blast=Kraftfull magisk energi bryter ut från skriftrullen!
items.scrolls.scrollofretribution.desc=Den här rullen innehåller destruktiv energi som kanaliserar läsarens lidande utåt i en explosion av kraft. Ju svagare läsaren är, desto mer skada kommer den att utdela. Vid mycket låg hälsa kan denna skriftrulle döda de flesta fiender omedelbart.\n\nAtt använda skriftrullen tar dock en vägtull på användaren, förblindar och försvagar dem.

items.scrolls.scrollofrage.name=skriftrulle av raseri
items.scrolls.scrollofrage.roar=Skriftrullen avger ett rasande vrål som ekar genom hela fängelsehålan!
items.scrolls.scrollofrage.desc=När den här skriftrullen läses högt avger den ett stort vrål som drar alla fiender till läsaren och gör dem i närheten rasande.

items.scrolls.scrollofrecharging.name=Skriftrulle för uppladdning
items.scrolls.scrollofrecharging.surge=En våg av energi strömmar genom din kropp och stärker dina trollstavar!
items.scrolls.scrollofrecharging.desc=Den råa magiska kraften som finns bunden i detta pergament kommer att ladda upp alla användarens trollstavar över tid när den utgår.

items.scrolls.scrollofremovecurse.name=skriftrulle för att ta bort förbannelse
items.scrolls.scrollofremovecurse.inv_title=Rensa ett föremål
items.scrolls.scrollofremovecurse.cleansed=Ditt föremål lyser med ett renande ljus och en illvillig energi försvinner!
items.scrolls.scrollofremovecurse.not_cleansed=Ditt föremål lyser med ett renande ljus, men ingenting händer.
items.scrolls.scrollofremovecurse.spirit=Din skriftrulle befriar den plågade anden!
items.scrolls.scrollofremovecurse.desc=Besvärjelsen på denna skriftrulle tar omedelbart bort alla förbannelser från ett vapen, en ring, en trollstav, en rustning eller en artefakt.

items.scrolls.scrollofteleportation.name=skriftrulle för teleportation
items.scrolls.scrollofteleportation.tele=På ett ögonblick blev du teleporterad till en annan plats på nivån.
items.scrolls.scrollofteleportation.no_tele=Teleporteringsmagin misslyckades.
items.scrolls.scrollofteleportation.cant_reach=Du kan inte teleportera dig dit.
items.scrolls.scrollofteleportation.prompt=Välj en plats att teleportera till
items.scrolls.scrollofteleportation.desc=Förtrollningen på detta pergament transporterar omedelbart läsaren till en annan plats på fängelsehålans nivå. Skriftrullen prioriterar områden som läsaren inte har varit på tidigare, men den kan inte teleportera förbi låsta dörrar eller barrikader. Den kan dock avslöja dolda dörrar som leder till nya områden.

items.scrolls.scrollofterror.name=skriftrulle av skräck
items.scrolls.scrollofterror.none=Skriftrullen avger en lysande blixt av rött ljus.
items.scrolls.scrollofterror.one=Skriftrullen avger en lysande blixt av rött ljus och %s flyr!
items.scrolls.scrollofterror.many=Skriftrullen avger en lysande blixt av rött ljus och monstren flyr!
items.scrolls.scrollofterror.desc=När den här skriftrullen läses avges en blixt av rött ljus som överväldigar alla fiender i ditt synfält med skräck, och de kommer att vända sig om och fly. Att attackera en flyende fiende kommer att förkorta effekten.

items.scrolls.scrolloftransmutation.name=skriftrulle av transmutation
items.scrolls.scrolloftransmutation.inv_title=Transmutera ett föremål
items.scrolls.scrolloftransmutation.nothing=Inget intressant händer.
items.scrolls.scrolloftransmutation.morph=Ditt föremål förvandlas till något annat!
items.scrolls.scrolloftransmutation.desc=Den här rullen innehåller kraftfull transmutationsmagi. När den används på ett kvalificerat föremål kommer den att förvandla det till ett annat föremål av samma typ. Magin kommer även att bevara uppgraderingar, förtrollningar och glyfer. Skrifter och drycker kommer att omvandlas till deras exotiska motsvarighet och vice versa.

items.scrolls.scrollofupgrade.name=skriftrulle av uppgradering
items.scrolls.scrollofupgrade.inv_title=Uppgradera ett föremål
items.scrolls.scrollofupgrade.weaken_curse=Uppgraderingsrullen försvagar förbannelsen på ditt föremål.
items.scrolls.scrollofupgrade.remove_curse=Uppgraderingsrullen rensar förbannelsen på ditt föremål!
items.scrolls.scrollofupgrade.desc=Denna skriftrulle uppgraderar ett enskilt föremål eller en uppsättning kastvapen. Trollstavar får ökad kraft och fler laddningar, vapen och rustningar orsakar och blockerar mer skada, kastvapenset repareras helt och blir mer hållbara, och ringarnas effekter förstärks.\n\nDen kan till och med försvaga eller ibland helt upphäva förbannelser, även om den inte är lika kraftfull som en skriftrulle för att ta bort förbannelser. Tyvärr kan uppgraderingsmagin också radera förtrollningar eller glyfer på utrustning av högre nivå.



###exotic scrolls
items.scrolls.exotic.exoticscroll.kaunan=exotisk skriftrulle av KAUNAN
items.scrolls.exotic.exoticscroll.sowilo=exotisk skriftrulle av SOWILO
items.scrolls.exotic.exoticscroll.laguz=exotisk skriftrulle av LAGUZ
items.scrolls.exotic.exoticscroll.yngvi=exotisk skriftrulle av YNGVI
items.scrolls.exotic.exoticscroll.gyfu=exotisk skriftrulle av GYFU
items.scrolls.exotic.exoticscroll.raido=exotisk skriftrulle av RAIDO
items.scrolls.exotic.exoticscroll.isaz=exotisk skriftrulle av ISAZ
items.scrolls.exotic.exoticscroll.mannaz=exotisk skriftrulle av MANNAZ
items.scrolls.exotic.exoticscroll.naudiz=exotisk skriftrulle av NAUDIZ
items.scrolls.exotic.exoticscroll.berkanan=exotisk skriftrulle av BERKANAN
items.scrolls.exotic.exoticscroll.odal=exotisk skriftrulle av ODAL
items.scrolls.exotic.exoticscroll.tiwaz=exotisk skriftrulle av TIWAZ
items.scrolls.exotic.exoticscroll.unknown_desc=En glödande, oläslig magisk runa är skriven på detta svarta pergament. Den verkar vara främmande för det här landet, vem vet vad den kommer att göra när den läses högt?
items.scrolls.exotic.exoticscroll.discover_hint=Du kan tillverka detta föremål med alkemi.

items.scrolls.exotic.scrollofsirenssong.name=skriftrulle av sirenens sång
items.scrolls.exotic.scrollofsirenssong.prompt=Välj ett mål
items.scrolls.exotic.scrollofsirenssong.no_target=Skriftrullen aktiveras utan mål.
items.scrolls.exotic.scrollofsirenssong.cancel=Du måste välja ett mål.
items.scrolls.exotic.scrollofsirenssong.desc=Läsningen av denna skriftrulle avger en lockande melodi som kommer att förtrolla en utvald fiende och permanent förvandla dem till en allierad! Andra fiender som hör den kommer tillfälligt att charmas.\n\nSärskilt starka fiender kan motstå enthrall-effekten och kommer att charmas istället.
items.scrolls.exotic.scrollofsirenssong$enthralled.name=enthralled
items.scrolls.exotic.scrollofsirenssong$enthralled.desc=Den här varelsen har blivit förtrollad av magin i en skriftrulle med sirensång.\n\nEn förtrollad karaktär är permanent din allierade och kommer att slåss mot alla fiender de möter.

items.scrolls.exotic.scrollofantimagic.name=skriftrulle med antimagi
items.scrolls.exotic.scrollofantimagic.desc=Besvärjelsen på denna skriftrulle kommer att omge dig med en magisk aura som tillfälligt blockerar alla magiska effekter, skadliga eller hjälpsamma. Detta inkluderar de flesta magiska föremålseffekter som trollstavar, skriftrullar, ringar, artefakter, förtrollningar och förbannelser. Heroiska rustningsförmågor är dock tillräckligt starka för att fungera oavsett.

items.scrolls.exotic.scrollofchallenge.name=utmaningens skriftrulle
items.scrolls.exotic.scrollofchallenge.desc=När den läses högt kommer denna skriftrulle att avge ett stort vrål som drar fiender till användaren vid skapandet av en liten arena runt dem.\n\nSå länge läsaren stannar i denna arena kommer de att ta 33% mindre skada från alla källor (detta tillämpas före andra former av skadereduktion), och de kommer inte att förlora mättnad.\n\nStorleken på arenan kommer att skala med storleken på området läsaren befinner sig i. Den kommer att vara särskilt liten i vissa boss-områden.
items.scrolls.exotic.scrollofchallenge$challengearena.name=challenge arena
items.scrolls.exotic.scrollofchallenge$challengearena.desc=En magisk arena har dykt upp runt dig, markerad av en böljande röd dimma.\n\nNNNär du står i dimman kommer din hunger inte att öka och du kommer att ta 33%% mindre skada från alla källor. Om du har några andra källor till skadereduktion (t.ex. rustning), kommer de att gälla efter 33%% reduktion.\n\nÅterstående turer: %d.

items.scrolls.exotic.scrollofdivination.name=skriftrulle för spådom
items.scrolls.exotic.scrollofdivination.nothing_left=Det finns inget kvar att identifiera!
items.scrolls.exotic.scrollofdivination.desc=Den här rullen kommer slumpmässigt att identifiera fyra typer av föremål som du inte känner till för tillfället. De identifierade typerna kan vara en dryckes färg, en skriftrulles runa eller en rings ädelsten. Föremålen som identifieras är inte nödvändigtvis sådana som du bär på dig.
items.scrolls.exotic.scrollofdivination$wnddivination.desc=Din spådomsskriftrulle har identifierat följande föremål:

items.scrolls.exotic.scrollofdread.name=rädslans skriftrulle
items.scrolls.exotic.scrollofdread.desc=När denna skriftrulle läses kommer den att avge en blixt av rött ljus som kommer att injaga otrolig skräck i alla fiender i ditt synfält. Så stor är denna effekt att de snabbt kommer att försöka fly från hela fängelsehålan, för att aldrig ses igen!\n\nSom med terror kan denna effekt upphöra med tiden, eller om fienden attackeras.\n\nStarka fiender, som bossar, kommer att tillfogas vanlig terror istället.

items.scrolls.exotic.scrollofenchantment.name=skriftrulle av förtrollning
items.scrolls.exotic.scrollofenchantment.inv_title=Förtrolla ett föremål
items.scrolls.exotic.scrollofenchantment.weapon=Välj en förtrollning att applicera på ditt vapen.
items.scrolls.exotic.scrollofenchantment.armor=Välj en glyf för att applicera på din rustning.
items.scrolls.exotic.scrollofenchantment.cancel=avbryt
items.scrolls.exotic.scrollofenchantment.cancel_warn=Annullering kommer fortfarande att förbruka din förtrollningsrulle, är du säker?
items.scrolls.exotic.scrollofenchantment.cancel_warn_yes=Ja, jag är säker
items.scrolls.exotic.scrollofenchantment.cancel_warn_no=Nej, jag ändrade mig
items.scrolls.exotic.scrollofenchantment.desc=Den här skriftrullen ger ett vapen eller en rustning kraftfull magisk energi. Läsaren har till och med viss kontroll över vilken magi som tillförs.

items.scrolls.exotic.scrollofforesight.name=skriftrulle av framsynthet
items.scrolls.exotic.scrollofforesight.desc=Efter att ha läst denna skriftrulle kommer detaljerna i närliggande terräng ständigt att matas till läsarens sinne i kristallklarhet. Denna effekt varar under en avsevärd tid och avslöjar alla dolda dörrar eller fällor, vilket gör letande onödigt.

items.scrolls.exotic.scrollofmetamorphosis.name=skriftrulle av metamorfos
items.scrolls.exotic.scrollofmetamorphosis.choose_desc=Välj en talang för att metamorfosera.
items.scrolls.exotic.scrollofmetamorphosis.replace_desc=Välj en ny talang att ersätta din metamorfoserade talang med.
items.scrolls.exotic.scrollofmetamorphosis.cancel_warn=Avbrytande kommer fortfarande att förbruka din metamorfosskriftrulle, är du säker?
items.scrolls.exotic.scrollofmetamorphosis.metamorphose_talent=metamorfos-talang
items.scrolls.exotic.scrollofmetamorphosis.desc=Den här rullen innehåller kraftfull transmutationsmagi, som kommer att gälla för besvärjaren istället för för ett föremål. Magin i denna skriftrulle låter dig välja en talang och ersätta den med en av fem talanger av samma nivå från olika hjälteklasser!\n\nDenna effekt kan bara tillämpas på klasstalanger, inte talanger som erhålls från underklasser eller rustningsförmågor. Talanger som du inte kan använda kommer inte att ges som alternativ.

items.scrolls.exotic.scrollofmysticalenergy.name=skriftrulle av mystisk energi
items.scrolls.exotic.scrollofmysticalenergy.desc=Den råa magiska kraften som är bunden i detta pergament kommer, när den utgår, att ladda användarens utrustade artefakter över tid.

items.scrolls.exotic.scrollofpassage.name=skriftrulle av passage
items.scrolls.exotic.scrollofpassage.desc=Besvärjelsen på detta pergament transporterar omedelbart läsaren till närmaste region första våningen ovanför dem. Mycket praktiskt för att snabbt ta sig till en butik.

items.scrolls.exotic.scrollofprismaticimage.name=skriftrulle med prismatisk bild
items.scrolls.exotic.scrollofprismaticimage.desc=Besvärjelsen på denna skriftrulle kommer att skapa en färgstark illusorisk tvilling av läsaren. Denna prismatiska bild fungerar som en svagare klon av läsaren, med liknande försvar men lägre hp och skada.\n\nDen prismatiska bilden kommer att visa sig när fiender är närvarande, och kommer att försöka försvara läsaren.\n\nOm en prismatisk bild redan existerar, kommer den här rullen att läka den helt och hållet.

items.scrolls.exotic.scrollofpsionicblast.name=skriftrulle av psionisk blast
items.scrolls.exotic.scrollofpsionicblast.ondeath=Den Psioniska Blasten sliter sönder ditt sinne...
items.scrolls.exotic.scrollofpsionicblast.desc=Den här rullen innehåller otrolig destruktiv energi som kan kanaliseras för att förstöra sinnet hos alla synliga varelser.\n\nDet finns dock en betydande återkoppling och läsaren kommer också att skadas, förblindas och försvagas. Ju fler mål skriftrullen träffar, desto mindre självskada kommer att tas.



###spells
items.spells.alchemize.name=alchemize
items.spells.alchemize.prompt=Alkemisera ett föremål
items.spells.alchemize.desc=Den här besvärjelsen innehåller transmutativa krafter liknande dem som finns i en alkemikruka. Varje kast gör det möjligt för användaren att förvandla ett föremål (eller en stapel föremål) till guld eller alkemisk energi. Att förvandla drycker eller skriftrullar till energi kommer till och med att identifiera dem! \n\nEtt fåtal Alchemize-användningar säljs från butiker, men många fler kan tillverkas med alkemi genom att kombinera ett frö, en runsten och lite alkemisk energi.
items.spells.alchemize$wndalchemizeitem.sell=Turn into %dg
items.spells.alchemize$wndalchemizeitem.sell_1=Förvandla 1 till %dg
items.spells.alchemize$wndalchemizeitem.sell_all=Vänd alla till %dg
items.spells.alchemize$wndalchemizeitem.energize=Förvandla till %d energi
items.spells.alchemize$wndalchemizeitem.energize_1=Förvandla 1 till %d energi
items.spells.alchemize$wndalchemizeitem.energize_all=Förvandla alla till %d energi

items.spells.beaconofreturning.name=fyr för återkomst
items.spells.beaconofreturning.preventing=Den här platsens starka magiska aura hindrar dig från att använda besvärjelsen!
items.spells.beaconofreturning.creatures=Den psykiska auran hos närliggande varelser tillåter dig inte att teleportera just nu.
items.spells.beaconofreturning.set=Fyrtårnet sattes upp på din nuvarande plats.
items.spells.beaconofreturning.wnd_body=Inställningen åsidosätter den plats som fyren tidigare var inställd på.\n\nÅtervändning återgår till din senast inställda plats och förbrukar en användning av besvärjelsen.
items.spells.beaconofreturning.wnd_set=Ställ in
items.spells.beaconofreturning.wnd_return=Returnera
items.spells.beaconofreturning.desc_set=Den här fyren sattes någonstans på våning %d.
items.spells.beaconofreturning.desc=Den här intrikata besvärjelsen ger användaren möjlighet att återvända till en bestämd plats, oavsett avstånd. Besvärjelsen förbrukas endast vid återkomsten, den kan sättas hur många gånger som helst, men den kommer bara ihåg den senaste platsen den sattes på.

items.spells.curseinfusion.name=förbannelseinfusion
items.spells.curseinfusion.inv_title=Förbannar ett föremål
items.spells.curseinfusion.desc=Den här besvärjelsen infunderar en utrustning med samma kraftfulla maligna magi som finns i DM-300. Föremålet som den används på blir omedelbart förbannat och alla förtrollningar eller glyfer som det kan ha haft åsidosätts.\n\nFör vapen, rustningar och trollstavar kommer föremålet att få uppgraderingar utöver att det blir förbannat. Förbannelseinfusionsuppgraderingar staplas inte och uppgraderingarna går förlorade om föremålet blir oförbannat.\n\nFlera förbannelseinfusioner kan också användas för att ändra förbannelsen på ett vapen eller en rustning.

items.spells.spell.ac_cast=KASTA
items.spells.spell.no_magic=Du kan inte kasta trollformler vid magisk immunitet.
items.spells.spell.discover_hint=Du kan tillverka detta föremål via alkemi.

items.spells.magicalinfusion.name=magisk infusion
items.spells.magicalinfusion.inv_title=Infusera ett föremål
items.spells.magicalinfusion.infuse=Ditt föremål är infunderat med arkane energi!
items.spells.magicalinfusion.desc=Den här besvärjelsen har samma magiska kraft som en uppgraderingsrulle, men i en mer stabil form.\n\nUtöver att uppgradera ett föremål som normalt kommer den aldrig att radera en förtrollning, glyf eller förbannelse.

items.spells.magicalporter.name=magisk bärare
items.spells.magicalporter.inv_title=Portera ett föremål
items.spells.magicalporter.nowhere=Det finns ingenstans för dig att porta ett föremål till.
items.spells.magicalporter.desc=Den här besvärjelsen transporterar magiskt alla föremål som den kastas på. Till skillnad från en köpmans fyr kommer dock föremålen att transporteras till ingången till nästa bossvåning.

items.spells.phaseshift.name=fasförskjutning
items.spells.phaseshift.no_target=Det finns inget att teleportera dit.
items.spells.phaseshift.desc=Den här kaotiska besvärjelsen teleporterar alla karaktärer som den är riktad mot till en slumpmässig plats på den aktuella våningen och bedövar dem under en längre tid. Kraftiga fiender kommer att kunna motstå den bedövande effekten. Denna trollformel kan riktas mot ett mål eller mot användaren själv.

items.spells.reclaimtrap.name=återta fälla
items.spells.reclaimtrap.no_trap=Det finns ingen fälla där.
items.spells.reclaimtrap.desc_trap=Förtrollningen är för närvarande redo att utlösa en _%s._
items.spells.reclaimtrap.desc=Den här formeln innehåller rester av den mekaniska energin från DM-300. När den används på en aktiv fälla kommer kraften i fällan att fästas vid dig, så att du kan använda formeln igen för att driva ut denna kraft och utlösa fällans effekt på vilken plats du vill.\n\nVissa fällor kanske dock inte fungerar på alla platser, och endast en fälla kan lagras åt gången.

items.spells.recycle.name=recycle
items.spells.recycle.inv_title=Återvinn ett föremål
items.spells.recycle.recycled=Ditt föremål återvanns till: %s.
items.spells.recycle.desc=Den här besvärjelsen innehåller en mindre form av transmutationsmagi. Vid sidan av att den inte fungerar på utrustning, kommer den här besvärjelsen att omvandla en skriftrulle, dryck, frö, runsten eller pil till ett slumpmässigt föremål av samma typ.

items.spells.summonelemental.name=summon elemental
items.spells.summonelemental.ac_imbue=IMBUE
items.spells.summonelemental.imbue_prompt=Bläddra in ett föremål
items.spells.summonelemental.desc=Den här besvärjelsen kanaliserar energin från den elementära glöd som användes för att göra den, och låter dig åkalla en vänlig elementär för att strida med dig! Endast en elemental kan åkallas åt gången, men besvärjelsen kan återanvändas för att ge tillbaka elementalen till dig utan kostnad.
items.spells.summonelemental.desc_newborn=Besvärjelsen är för närvarande inte impregnerad och kommer att frammana en _nyfödd elemental_ utan en distansattack. Du kan impregnera en identifierad dryck av flytande låga, dryck av frost, laddningsrulle eller transmutationsrulle för att förstärka besvärjelsen, vilket gör att framtida besvärjelser blir en elemental med full kraft!
items.spells.summonelemental.desc_fire=Besvärjelsen är för närvarande varm att ta på, den kommer att kalla på en _fire elemental_. Du kan imbunera ett annat föremål, men besvärjelsen kommer att förlora sin nuvarande imbunering.
items.spells.summonelemental.desc_frost=Besvärjelsen är för närvarande kall att ta på, den kommer att kalla på en _frost elemental_. Du kan imbunera ett annat föremål, men besvärjelsen kommer att förlora sin nuvarande imbunering.
items.spells.summonelemental.desc_shock=Besvärjelsen utstrålar för närvarande statisk energi, den kommer att kalla på en _shock elemental_. Du kan imbunera ett annat föremål, men besvärjelsen kommer att förlora sin nuvarande imbunering.
items.spells.summonelemental.desc_chaos=Besvärjelsen utstrålar för närvarande kaotisk energi, den kommer att kalla på en _chaos elemental_. Du kan imbunera ett annat föremål, men besvärjelsen kommer att förlora sin nuvarande imbunering.

items.spells.targetedspell.prompt=Välj ett mål
items.spells.targetedspell.inv_title=Infusera ett föremål

items.spells.telekineticgrab.name=telekinetiskt grepp
items.spells.telekineticgrab.cant_grab=Du kan inte ta tag i det där.
items.spells.telekineticgrab.no_target=Det finns inget att ta tag i där.
items.spells.telekineticgrab.desc=Den här besvärjelsen låter besvärjaren fjärrgripa alla föremål på en plats, eller alla kastade vapen som sitter fast på en fiende!\n\nDen kan inte användas för att gripa föremål som någon annan äger, eller för att gripa behållare som kistor.

items.spells.unstablespell.name=obeständig trollformel
items.spells.unstablespell.desc=Den här lilla svarta fyrkantiga kristallen har skiftande runsymboler på var och en av sina ytor.\n\nNär den aktiveras kommer den att utlösa effekten av en slumpmässig skriftrulle. Skriftrulleffekten kommer alltid att vara stridsfokuserad om det finns fiender i ditt synfält, och kommer alltid att vara icke-stridsfokuserad annars.

items.spells.wildenergy.name=vild energi
items.spells.wildenergy.desc=Den här besvärjelsen innehåller en del av den förbannade energin som drev DM-300. När den används laddar den upp dina trollstavar och slitna artefakter, vid sidan av att den utlöser en slumpmässig förbannad trollstavseffekt. Du kan dock välja en riktning för den här förbannade magin att skjuta i.


###runestones
items.stones.inventorystone.ac_use=USE

items.stones.runestone$placeholder.name=runestone
items.stones.runestone.discover_hint=Du kan hitta det här föremålet slumpmässigt i fängelsehålan, eller tillverka det via alkemi.

items.stones.stoneofaggression.name=sten av aggression
items.stones.stoneofaggression.desc=När den här stenen kastas på en allierad eller fiende kommer alla fiender i närheten att föredra att attackera den karaktären under en kort stund. \Bossfiender kan dock motstå effekten, vilket minskar varaktigheten avsevärt och tar mindre skada av deras minions attacker.
items.stones.stoneofaggression$aggression.name=targeted
items.stones.stoneofaggression$aggression.desc=Manipulerande magi gör att alla fiender i närheten föredrar att attackera den här karaktären.\n\nÅterstående turer: %s.

items.stones.stoneofaugmentation.name=sten för förstärkning
items.stones.stoneofaugmentation.inv_title=Förstärk ett föremål
items.stones.stoneofaugmentation.desc=Denna runsten besitter kraftfull magi som kan förstärka utrustning för att förbättra en egenskap på bekostnad av en annan.\n\nOm du använder den på ett vapen kan du förbättra antingen hastigheten eller skadan. Kastvapen får också ökad eller minskad hållbarhet i proportion till deras hastighet.\n\nOm du använder den på rustning kan du förbättra antingen försvaret eller undvikandet.
items.stones.stoneofaugmentation.discover_hint=Du kan köpa det här föremålet i en butik eller tillverka det via alkemi.
items.stones.stoneofaugmentation$wndaugment.choice=Vad skulle du vilja förbättra?
items.stones.stoneofaugmentation$wndaugment.speed=Hastighet
items.stones.stoneofaugmentation$wndaugment.damage=Skada
items.stones.stoneofaugmentation$wndaugment.evasion=Evasion
items.stones.stoneofaugmentation$wndaugment.defense=Försvar
items.stones.stoneofaugmentation$wndaugment.none=Ta bort förstärkning
items.stones.stoneofaugmentation$wndaugment.cancel=Har aldrig brytt mig

items.stones.stoneofblast.name=sten av sprängning
items.stones.stoneofblast.desc=Den här runstenen kommer omedelbart att explodera på den plats den kastas till. Precis som en bomb kommer explosionen att skada allt i närheten.

items.stones.stoneofblink.name=sten för blinkning
items.stones.stoneofblink.desc=Den här runstenen teleporterar användaren till den plats den kastas till.

items.stones.stoneofclairvoyance.name=sten för klärvoajans
items.stones.stoneofclairvoyance.desc=Den här stenen avslöjar omedelbart alla plattor i ett mycket brett område runt där den kastas. Dess effekt kommer även att nå genom väggar.

items.stones.stoneofdeepsleep.name=sten för djup sömn
items.stones.stoneofdeepsleep.desc=När denna sten kastas på en fiende kommer den att försätta dem i en djup magisk sömn. Magiskt sovande fiender kommer att sova för evigt tills de störs.

items.stones.stoneofdetectmagic.name=sten för att upptäcka magi
items.stones.stoneofdetectmagic.inv_title=Detektera ett föremål
items.stones.stoneofdetectmagic.detected_none=Du upptäcker ingen magi som påverkar det här föremålet.
items.stones.stoneofdetectmagic.detected_both=Du upptäcker både positiv och illvillig magi som påverkar det här föremålet!
items.stones.stoneofdetectmagic.detected_good=Du upptäcker positiv magi som påverkar det här föremålet!
items.stones.stoneofdetectmagic.detected_bad=Du upptäcker att illvillig magi påverkar det här föremålet!
items.stones.stoneofdetectmagic.desc=Den här runstenen kan upptäcka magi som påverkar ett föremål. Om du använder denna sten på ett oidentifierat föremål kommer du att få veta om det är påverkat av en illvillig förbannelse och om det är påverkat av positiv magi såsom en förtrollning eller uppgraderingar.

items.stones.stoneofdisarming.name=sten för avväpning
items.stones.stoneofdisarming.desc=Den här runstenen innehåller magi som kan inaktivera illvilliga fällor som finns gömda i fängelsehålan. Den desarmerar upp till 9 fällor runt det område den kastas på.

items.stones.stoneofenchantment.name=sten av förtrollning
items.stones.stoneofenchantment.inv_title=Förtrolla ett föremål
items.stones.stoneofenchantment.weapon=Ditt vapen lyser i mörkret!
items.stones.stoneofenchantment.armor=Din rustning lyser i mörkret!
items.stones.stoneofenchantment.desc=Den här runstenen besitter förtrollningsmagi. Till skillnad från en uppgraderingsrulle kommer den inte att öka den direkta kraften hos ett föremål, utan kommer istället att förse ett vapen eller en rustning med en förtrollning och ge det en ny kraft.

items.stones.stoneoffear.name=sten av rädsla
items.stones.stoneoffear.desc=När denna sten kastas på en karaktär blir denne överväldigad av skräck och vänder sig om och flyr. Att attackera en flyende karaktär kommer att förkorta effekten.

items.stones.stoneofflock.name=sten av flock
items.stones.stoneofflock.desc=Den här runstenen kallar på magiska får under en kort tid runt den plats den kastas till.

items.stones.stoneofintuition.name=sten för intuition
items.stones.stoneofintuition.inv_title=Välj ett föremål
items.stones.stoneofintuition.desc=Den här runstenen innehåller en svagare version av den magi som finns i identifieringsrullar. Istället för att direkt identifiera ett föremål, kommer den att arbeta på din intuition, så att du kan försöka identifiera typen av en dryck, skriftrulle eller ring genom att gissa.
items.stones.stoneofintuition.break_info=Du kan använda stenar av intuition två gånger innan en går sönder, _din nästa användning kommer inte att förbruka en sten_.
items.stones.stoneofintuition.break_warn=Du har använt en sten av intuition tidigare, så _din nästa användning kommer att förbruka en sten_.
items.stones.stoneofintuition$wndguess.text=Gissa vad det oidentifierade föremålet är för typ. Om du gissar rätt kommer typen att identifieras!
items.stones.stoneofintuition$wndguess.correct=Rätt. Föremålets typ har identifierats!
items.stones.stoneofintuition$wndguess.incorrect=Din gissning var felaktig.
items.stones.stoneofintuition$wndguess.break=Din sten av intuition smulas sönder till damm...

items.stones.stoneofshock.name=sten av chock
items.stones.stoneofshock.desc=Den här runstenen släpper lös en explosion av elektrisk energi som kortvarigt bedövar alla mål i närheten och ger kastaren stavladdning för varje mål som träffas.


###trinkets
items.trinkets.chaoticcenser.name=kaotisk rökelsebrännare
items.trinkets.chaoticcenser.spew=Din rökelsebrännare kommer snart att spruta: %s.
items.trinkets.chaoticcenser.desc=Efter en tid i alkemigrytan verkar det här rökelsekaret producera rök helt på egen hand! Dessa gaser byggs upp och kommer att spy ut från rökelsekaret mot fiender med halvslumpmässiga intervall. Den verkar kunna producera alla möjliga gaser, men du får en liten varning strax innan rökelsekaret aktiveras.
items.trinkets.chaoticcenser.typical_stats_desc=Typiskt kommer denna prydnadssak att skapa en skadlig gas nära en fiende ungefär var _%d_ varv. Gaser kommer bara att visas när fiender är närvarande. På högre nivåer är det mer sannolikt att dessa gaser är exotiska och kraftfulla.
items.trinkets.chaoticcenser.stats_desc=På sin nuvarande nivå kommer denna prydnadssak att skapa en skadlig gas nära en fiende ungefär var _%d_ varv. Gaserna kommer bara att dyka upp när fiender är närvarande. På högre nivåer är det mer sannolikt att dessa gaser är exotiska och kraftfulla.

items.trinkets.crackedspyglass.name=spräckt kikare
items.trinkets.crackedspyglass.desc=Denna handhållna kikare skulle vara ett exempel på fantastiskt och precist hantverk, om det inte vore för sprickan längs dess främre lins. Kikaren verkar hjälpa dig genom att avslöja nya föremål i fängelsehålan, men på grund av dess brist är de avslöjade föremålen ganska svåra att se!
items.trinkets.crackedspyglass.typical_stats_desc=Vanligtvis har denna prydnadssak en _%1$s%% chans_ att skapa ett extra dolt föremål på varje våning som inte är en bossvåning.
items.trinkets.crackedspyglass.stats_desc=På sin nuvarande nivå har denna prydnadssak en _%1$s%% chans_ att skapa ett extra gömt föremål på varje våning som inte är en bossvåning.
items.trinkets.crackedspyglass.stats_desc_upgraded=På sin nuvarande nivå har denna prydnadssak en _100%% chans_ att skapa ett extra gömt föremål på varje våning som inte är en bossvåning, och en _%1$s%% chans_ att skapa ett andra extra gömt föremål.

items.trinkets.dimensionalsundial.name=dimensionellt solur
items.trinkets.dimensionalsundial.warning=Ditt solur kastar ingen skugga, du känner dig illa till mods.
items.trinkets.dimensionalsundial.desc=Det här lilla handhållna soluret kan på något sätt kasta en skugga i fängelsehålans djup, även om du inte håller det upprätt. Ännu märkligare är att skuggans position inte verkar ha någon relation till solen i den här världen. När ingen skugga kastas verkar soluret locka till sig faror.
items.trinkets.dimensionalsundial.typical_stats_desc=Typiskt sett kommer denna prydnadssak att minska antalet fiender som leker med _%1$d%%_ under dagtid i verkligheten (kl. 08.00-20.00), och öka antalet fiender som leker med _%2$d%%_ under nattetid (kl. 08.00-08.00).
items.trinkets.dimensionalsundial.stats_desc=På sin nuvarande nivå kommer denna prydnadssak att minska fiendernas spawnfrekvens med _%1$d%%_ under dagtid i verkliga livet (kl. 08.00-20.00) och öka fiendernas lekfrekvens med _%2$d%%_ nattetid (kl. 20.00-08.00).

items.trinkets.exoticcrystals.name=exotiska kristaller
items.trinkets.exoticcrystals.desc=De här små rosa kristallerna har samma form som kristaller av alkemisk energi. Vid sidan av att de inte kan användas för energi direkt, verkar de på något sätt påverka de drycker och skriftrullar som du hittar.
items.trinkets.exoticcrystals.typical_stats_desc=Typiskt kommer denna prydnadssak att ersätta _%s%%_ av dryckes- eller skriftrullsdropparna med deras exotiska motsvarigheter. Detta påverkar inte styrkedrycker, uppgraderingsrullar eller föremål som genereras för att hjälpa till att lösa farorum.
items.trinkets.exoticcrystals.stats_desc=På sin nuvarande nivå kommer detta prydnadssak att ersätta _%s%%_ av dryckesdropparna med deras exotiska motsvarigheter. Detta påverkar inte styrkedrycker, uppgraderingsrullar eller föremål som genereras för att hjälpa till att lösa farorum.

items.trinkets.eyeofnewt.name=ögon av vattensalamander
items.trinkets.eyeofnewt.desc=Detta gyllene och svarta newt-öga är en vanlig ingrediens, nu förädlad till en prydnadssak. Ögat verkar minska din syn i utbyte mot att låta dig se saker på andra sätt.
items.trinkets.eyeofnewt.typical_stats_desc=Typiskt minskar denna prydnadssak ditt synfält med _%1$s%%_, men ger dig också mind vision på fiender inom _%2$d_ tiles.
items.trinkets.eyeofnewt.stats_desc=På sin nuvarande nivå kommer denna prydnadssak att minska ditt synfält med _%1$s%%_, men kommer också att ge dig mind vision på fiender inom _%2$d_ rutor.

items.trinkets.ferrettuft.name=ferrett tuft
items.trinkets.ferrettuft.desc=En bit av silkeslen vit illerpäls, sammanhållen av ett limegrönt band knutet till en rosett. Illrar är kända för sin smidighet, busighet och brist på integritet. En del av den kraften verkar stråla ut från prydnadssaken och förstärker undvikandet av allt i närheten.
items.trinkets.ferrettuft.typical_stats_desc=Typiskt kommer denna prydnadssak att öka undvikandet av alla karaktärer med _%1$s%%_.
items.trinkets.ferrettuft.stats_desc=På sin nuvarande nivå kommer denna prydnadssak att öka undvikandet av alla karaktärer med _%1$s%%_.

items.trinkets.mimictooth.name=tandimitation
items.trinkets.mimictooth.desc=Den här stora vassa tanden måste ha dragits ut från en mycket olycklig mimiker. Den verkar påverka mimikerna i fängelsehålan och göra dem mer frekventa och farliga.
items.trinkets.mimictooth.typical_stats_desc=Typiskt sett kommer denna prydnadssak att göra alla typer av mimiker _%1$sx_ vanligare och mycket svårare att upptäcka, men det kommer också att öka mängden byte de släpper. Varje fängelsehålans golv kommer också att ha en _%2$s%%_ chans att innehålla en extra smygande ebenholtsmimik.
items.trinkets.mimictooth.stats_desc=På sin nuvarande nivå kommer denna prydnadssak att göra alla typer av mimic _%1$sx_ vanligare och mycket svårare att upptäcka, men kommer också att öka mängden byte de släpper. Varje fängelsehålans golv kommer också att ha en _%2$s%%_ chans att innehålla en extra smygande ebenholtsmimik.

items.trinkets.mossyclump.name=mossig klump
items.trinkets.mossyclump.desc=Den här klumpen av våt mossa verkar behålla sin fuktighet oavsett hur hårt du klämmer på den. Den verkar vara magiskt knuten till själva fängelsehålan, vilket gör det mer troligt att gräs och vatten dyker upp.
items.trinkets.mossyclump.typical_stats_desc=Typiskt kommer denna prydnadssak att göra att _%d%%_ av otematiserade golv fylls med antingen vatten eller gräs istället.\n\nDenna prydnadssak kostar en större mängd energi att uppgradera.
items.trinkets.mossyclump.stats_desc=På sin nuvarande nivå kommer denna prydnadssak att göra att _%d%%_ av otematiserade golv fylls med antingen vatten eller gräs istället.\n\nDenna prydnadssak kostar en större mängd energi att uppgradera.

items.trinkets.parchmentscrap.name=parchmentskrot
items.trinkets.parchmentscrap.desc=Den här lilla pergamentbiten ser ut att komma från en skriftrulle. Den har behållit en del av sin magi, och den verkar påverka vapen och rustningar som finns i fängelsehålan.
items.trinkets.parchmentscrap.typical_stats_desc=Typiskt sett kommer denna prydnadssak att göra förtrollningar och glyfer _%dx_ lika vanliga, och förbannelser på vapen och rustningar _%sx_ lika vanliga. Förbannelser på trollstavar, ringar eller artefakter påverkas inte.\n\nDenna prydnadssak kostar en större mängd energi att uppgradera.
items.trinkets.parchmentscrap.stats_desc=På sin nuvarande nivå kommer denna prydnadssak att göra förtrollningar och glyfer _%dx_ lika vanliga, och förbannelser på vapen och rustningar _%sx_ lika vanliga. Förbannelser på trollstavar, ringar eller artefakter påverkas inte.\n\nDenna prydnadssak kostar en större mängd energi att uppgradera.

items.trinkets.petrifiedseed.name=petrifierat frö
items.trinkets.petrifiedseed.desc=Det här fröet har fossiliserats, antingen genom långsamma geologiska processer eller genom magi. Fröet verkar på ett magiskt sätt påverka floran i fängelsehålan och ersätter ibland växtfrön med runstenar.
items.trinkets.petrifiedseed.typical_stats_desc=Typiskt för denna prydnadssak är att trampat gräs släpper runstenar istället för frön _%1$s%%_ av tiden, och att högt gräs släpper föremål _%2$s%%_ oftare.
items.trinkets.petrifiedseed.stats_desc=På sin nuvarande nivå kommer denna prydnadssak att få trampat gräs att släppa runstenar istället för frön _%1$s%%_ av tiden, och kommer också att få högt gräs att släppa föremål _%2$s%%_ oftare.

items.trinkets.ratskull.name=råttskalle
items.trinkets.ratskull.desc=Den här makabra prydnadssaken är inte mycket större än skallen från en vanlig råtta, som på något sätt är en sällsynthet nere i den här fängelsehålan. Skallens magiska inflytande verkar locka till sig de mer sällsynta invånarna i fängelsehålan, vilket gör att de dyker upp mycket oftare.
items.trinkets.ratskull.typical_stats_desc=Typiskt kommer denna prydnadssak att göra sällsynta exotiska fiender _%dx_ lika benägna att dyka upp. Skallen är dock bara hälften så effektiv när det gäller att locka till sig kristallmimik och bepansrade statyer.
items.trinkets.ratskull.stats_desc=På sin nuvarande nivå kommer denna prydnadssak att göra sällsynta exotiska fiender _%dx_ lika troliga att dyka upp. Skallen är dock bara hälften så effektiv när det gäller att locka till sig kristallmimik och bepansrade statyer.

items.trinkets.saltcube.name=saltkub
items.trinkets.saltcube.desc=Den här stora saltkristallen skars till en nästan perfekt kubform, och den lyckades på något sätt dränera halva vattnet från alkemikrukan istället för att lösas upp. Den verkar magiskt torka ut och konservera maten du äter, vilket förlänger mättnaden du får, men också minskar din hälsorestitution när du inte svälter.
items.trinkets.saltcube.typical_stats_desc=Typiskt kommer denna prydnadssak att öka tiden innan du blir hungrig med _%1$s%%_, men kommer också att minska din hälsoregenerering med _%2$s%%_ om inte golvet är låst.
items.trinkets.saltcube.stats_desc=På sin nuvarande nivå kommer denna prydnadssak att öka tiden innan du blir hungrig med _%1$s%%_, men kommer också att minska din hälsoregenerering med _%2$s%%_ om inte golvet är låst.

items.trinkets.shardofoblivion.name=shard of oblivion
items.trinkets.shardofoblivion.desc=Efter att ha puttrat i alkemigrytan har denna lilla skärva av förbannad metall förändrats till att vara gjord av... ingenting? Ljuset verkar böjas runt den och den svävar på plats när du inte håller i den. Skärvan verkar dra magisk kraft från din okunnighet, så det är nog bäst att inte tänka på den för mycket.
items.trinkets.shardofoblivion.typical_stats_desc=Typiskt kommer denna prydnadssaksdetalj att öka hastigheten som fiender droppar byte med 20%% för varje oidentifierad utrustning du har utrustat eller nyligen använt, till max _%d föremål_. Skärvan kommer också att hindra dig från att identifiera utrustning, men kan användas för att manuellt identifiera föremål som är redo för det.
items.trinkets.shardofoblivion.stats_desc=På sin nuvarande nivå ökar denna prydnadssak hastigheten som fiender droppar byte med 20%% för varje oidentifierad utrustning du har utrustat eller nyligen använt, till max _%d föremål. Skärvan kommer också att hindra dig från att identifiera utrustning, men kan användas för att manuellt identifiera föremål som är redo för det.
items.trinkets.shardofoblivion.ac_identify=IDENTIFY
items.trinkets.shardofoblivion.identify_prompt=Identifiera ett föremål
items.trinkets.shardofoblivion.identify_ready=Ett föremål är redo att identifieras: %s. Använd din Shard of Oblivion på det för att identifiera det.
items.trinkets.shardofoblivion.identify_ready_worn=Dina slitna föremål är nu alla redo att identifieras. Använd din Shard of Oblivion på föremålen för att identifiera dem.
items.trinkets.shardofoblivion.identify_not_yet=Detta föremål är inte redo att identifieras ännu.
items.trinkets.shardofoblivion.identify=Du identifierar föremålet!
items.trinkets.shardofoblivion$wandusetracker.name=Oidentifierad trollstav som använts
items.trinkets.shardofoblivion$wandusetracker.desc=Du har nyligen använt en oidentifierad trollstav, som räknas som en använd oidentifierad utrustning för glömskans skärva under en kort tid.\n\nÅterstående turer: %s.
items.trinkets.shardofoblivion$thrownusetracker.name=Oidentifierat kastvapen använt
items.trinkets.shardofoblivion$thrownusetracker.desc=Du har nyligen använt ett oidentifierat kastvapen, vilket räknas som ett stycke oidentifierad utrustning som använts för glömskans skärva under en kort tid.\n\nÅterstående turer: %s.

items.trinkets.thirteenleafclover.name=trettonklöver
items.trinkets.thirteenleafclover.desc=På något sätt har den här klövern fått en massa extra blad av att puttra i alkemigrytan! Det är inte riktigt klart om den här prydnadssaken ger tur eller otur, kanske den här prydnadssaken gör din tur mer kaotisk?
items.trinkets.thirteenleafclover.typical_stats_desc=Typiskt kommer denna prydnadssak att få dig att ge maximal skada _%1$d%%_ av tiden, och minimal skada _%2$d%%_ av tiden.
items.trinkets.thirteenleafclover.stats_desc=På sin nuvarande nivå kommer denna prydnadssak att få dig att göra maximal skada _%1$d%%_ av tiden och minimal skada _%2$d%%_ av tiden.

items.trinkets.trapmechanism.name=fällmekanism
items.trinkets.trapmechanism.desc=Kärnan i en av fängelsehålans fallgropsfällor, omsorgsfullt uthuggen ur golvet så att den kan bäras. Den verkar vara magiskt knuten till själva fängelsehålan, vilket gör farlig terräng vanligare men också ökar din affinitet mot den.
items.trinkets.trapmechanism.typical_stats_desc=Typiskt för denna prydnadssak är att _%1$d%%_ av otematiserade golv fylls med antingen fällor eller avgrunder istället. Dessutom kommer _%2$d%%_ av fängelsehålans dolda fällor istället att vara synliga.
items.trinkets.trapmechanism.stats_desc=På sin nuvarande nivå gör denna trinket att _%1$d%%_ av otematiserade golv istället fylls med antingen fällor eller chasms. Dessutom kommer _%2$d%%_ av fängelsehålans dolda fällor istället att vara synliga.

items.trinkets.vialofblood.name=vial med blod
items.trinkets.vialofblood.desc=Den här tunna flaskan innehåller blodet från någon av fängelsehålans invånare, det rör sig långsamt när du roterar flaskan. Det verkar magiskt förstärka starkare läkande effekter, men också fördröja dem.
items.trinkets.vialofblood.typical_stats_desc=Typiskt kommer denna prydnadssak att öka den totala hälsan du får från att dricka läkande drycker, vattenskinn eller hälsobrunnar med _%1$s%%_. Men dessa läkande effekter kommer också att ske långsammare och återskapa maximalt _%2$s_ HP per tur (detta skalas med hjältenivå).
items.trinkets.vialofblood.stats_desc=På sin nuvarande nivå kommer denna prydnadssak att öka den totala hälsan du får från att dricka läkande drycker, vattenskinn eller hälsobrunnar med _%1$s%%_. Dessa läkande effekter kommer dock också att ske långsammare och återskapa maximalt _%2$s_ HP per tur (detta skalas med hjältenivå).

items.trinkets.wondrousresin.name=wondrous harts
items.trinkets.wondrousresin.desc=Den här blåskimrande kådan verkar innehålla den destillerade essensen av magin från en förbannad trollstav. Magin från alkemikrukan verkar ha stabiliserat den något, och den påverkar nu era trollstavar.
items.trinkets.wondrousresin.typical_stats_desc=Typiskt kommer denna prydnadssak att tvinga förbannade trollstavseffekter att bli neutrala eller positiva _%1$s%%_ av tiden, och kommer att få oförbannade trollstavar att avfyra ytterligare en neutral eller positiv förbannad zap _%2$s%%_ av tiden.\n\nDenna prydnadssak kostar en större mängd energi att uppgradera.
items.trinkets.wondrousresin.stats_desc=På sin nuvarande nivå kommer denna prydnadssak att tvinga förbannade trollstavseffekter att bli neutrala eller positiva _%1$s%%_ av tiden, och kommer att få oförbannade trollstavar att avfyra ytterligare en neutral eller positiv förbannad zap _%2$s%%_ av tiden.\n\nDenna prydnadssak kostar en större mängd energi att uppgradera.

items.trinkets.trinketcatalyst.name=magisk katalysator
items.trinkets.trinketcatalyst.window_title=skapa en prydnadssak
items.trinkets.trinketcatalyst.window_text=Vattnet börjar glöda när du tillsätter katalysatorn. Det finns några föremål i närheten som du kan fylla med energi för att göra en magisk prydnadssak av.
items.trinkets.trinketcatalyst.desc=Den här kulan av magiskt gyllene stoft glimmar i fängelsehålans mörker. Den här katalysatorn kan användas i en alkemikruka med lite alkemisk energi för att producera en unik prydnadssak.\n\nPrydnadssaker ger olika effekter som förändrar fängelsehålan eller dess invånare en aning. Prydnadssaker kan uppgraderas med mer energi för att göra deras effekt kraftfullare, eller släppas för att avstå från effekten helt och hållet.
items.trinkets.trinketcatalyst$randomtrinket.name=randomtrinket
items.trinkets.trinketcatalyst$randomtrinket.desc=Ett föremål i närheten sitter fast i en påse som du inte kan få upp.\n\nAlkemiprocessen kommer att lösa upp påsen, men du vet inte vilken prydnadssak du får förrän du gör det!

items.trinkets.trinket.discover_hint=Det här föremålet har en chans att vara ett alternativ när du tillverkar en prydnadssak via alkemi.
items.trinkets.trinket$placeholder.name=prydnadssak

###wands
items.wands.cursedwand.ondeath=Du blev dödad av dina egna %s.
items.wands.cursedwand.nothing=Inget händer.
items.wands.cursedwand.mass_invuln=Briljant ljus bryter ut från din trollstav!
items.wands.cursedwand.petrify=Du fryser plötsligt på plats!
items.wands.cursedwand.grass=Gräs skjuter upp runt dig!
items.wands.cursedwand.fire=Du känner lukten av bränt...
items.wands.cursedwand.transmogrify_wand=Din trollstav transmogrifieras till ett annat föremål!
items.wands.cursedwand.transmogrify_other=Ditt föremål transmogrifieras till något annat!
items.wands.cursedwand.disguise=Ditt utseende förändras framför dina ögon!
items.wands.cursedwand.supernova=En blossande boll av energi börjar växa. Du kanske vill springa!
items.wands.cursedwand.supernova_positive=Ett blossande energiklot börjar växa, men det känns tryggt på något sätt.
items.wands.cursedwand.sinkhole=Marken börjar ge vika runt dig!
items.wands.cursedwand.sinkhole_positive=Marken börjar ge vika, men känns tillräckligt solid under dig.
items.wands.cursedwand.gravity=Gravitation börjar plötsligt dra i slumpmässiga riktningar!
items.wands.cursedwand.gravity_positive=Gravitation börjar plötsligt dra i slumpmässiga riktningar, men det verkar inte påverka dig.
items.wands.cursedwand.gravity_end=Gravitationskaoset tar slut.

items.wands.damagewand.upgrade_stat_name_1=Magisk skada

items.wands.wand.ac_zap=ZAP
items.wands.wand.fizzles=Din trollstav fizzlar; den har inte tillräckligt med laddning.
items.wands.wand.no_magic=Din trollstav fizzlar; du kan inte använda trollstavar vid magiimmunitet.
items.wands.wand.self_target=Du kan inte sikta på dig själv!
items.wands.wand.identify=Du är nu tillräckligt bekant med din trollstav för att kunna identifiera den.
items.wands.wand.resin_one=Den här trollstaven har fått _1 nivå_ från arcane resin.
items.wands.wand.resin_many=Den här trollstaven har fått _%d nivåer_ från arcane resin.
items.wands.wand.cursed=Den här trollstaven är förbannad, vilket gör dess magi kaotisk och slumpmässig.
items.wands.wand.not_cursed=Den här trollstaven är fri från illvillig magi.
items.wands.wand.curse_discover=Den här %s är förbannad!
items.wands.wand.prompt=Välj en plats att zappa
items.wands.wand$placeholder.name=trollstav

items.wands.wandofblastwave.name=trollstav för tryckvåg
items.wands.wandofblastwave.staff_name=staff av blastvåg
items.wands.wandofblastwave.ondeath=Du dödade dig själv med din egen blastvågstav...
items.wands.wandofblastwave.knockback_ondeath=Kollisionen dödade dig...
items.wands.wandofblastwave.desc=Den här trollstaven är gjord av en slags marmorerad sten, med guldkant och en rund svart ädelsten i spetsen. Den känns väldigt tung i handen.
items.wands.wandofblastwave.typical_stats_desc=Den här trollstaven skjuter en bult som detonerar våldsamt på en målplats. Kraften i denna explosion ger vanligtvis _%1$d-%2$d skada_ och är tillräckligt stark för att få de flesta fiender att flyga.
items.wands.wandofblastwave.stats_desc=Den här trollstaven skjuter en bult som detonerar våldsamt på en målplats. Kraften i denna explosion ger _%1$d-%2$d skada_ och är tillräckligt stark för att få de flesta fiender att flyga.
items.wands.wandofblastwave.upgrade_stat_name_2=Knockback
items.wands.wandofblastwave.bmage_desc=När _Stridsmagikern_ slår en förlamad fiende med en chockvågsstav, kommer den att konsumera förlamningen för att orsaka en explosion av bonusmagisk skada. Detta har en kort nedkylning per fiende.
items.wands.wandofblastwave.eleblast_desc=En elementarblast med en blastvågstav ger 67% skada och knockar alla fiender utanför blastområdet.

items.wands.wandofcorrosion.name=stav för korrosion
items.wands.wandofcorrosion.staff_name=staff av korrosion
items.wands.wandofcorrosion.desc=Den här staven har en askgrå kropp som öppnar sig till en lysande orange ädelsten.
items.wands.wandofcorrosion.stats_desc=Den här trollstaven skjuter en blixt som exploderar i ett moln av starkt frätande gas på en utvald plats. Allt som fångas inuti detta moln kommer att ta ökande skada över tid, med början vid _%d skada._
items.wands.wandofcorrosion.upgrade_stat_name_1=Korrosionsskada
items.wands.wandofcorrosion.upgrade_stat_name_2=Gasvolym
items.wands.wandofcorrosion.bmage_desc=När _stridsledaren_ slår en fiende med en stav av korrosion har fienden en chans att bli översköljd.
items.wands.wandofcorrosion.eleblast_desc=En elemental blast med en stav av korrosion tillfogar fiender 4 varv av korrosion, med början på 6 skador.

items.wands.wandofcorruption.name=stav av korruption
items.wands.wandofcorruption.staff_name=korruptionens stav
items.wands.wandofcorruption.already_corrupted=Den karaktären kan inte påverkas ytterligare.
items.wands.wandofcorruption.desc=Den här trollstaven utstrålar kaotisk mörk energi, om det inte redan var uppenbart från den lilla dekorativa dödskallen som är formad på dess spets.
items.wands.wandofcorruption.stats_desc=Den här trollstaven utgår en stråle av korrumperande energi som fördärvar fiender och till slut böjer dem till din vilja. Fiender kan motstå korruptionen, men försvagade fiender är mycket lättare att korrumpera än friska.
items.wands.wandofcorruption.upgrade_stat_name_1=Korrumperande kraft
items.wands.wandofcorruption.upgrade_stat_name_2=Varaktighet för debuff
items.wands.wandofcorruption.bmage_desc=När _stridsledaren_ slår en fiende med en stav av korruption har fienden en chans att bli amok.
items.wands.wandofcorruption.eleblast_desc=En elemental blast med en stav av korruption ger fiender 5 vändor av amok.

items.wands.wandofdisintegration.name=trollspö av sönderdelning
items.wands.wandofdisintegration.staff_name=stav av sönderdelning
items.wands.wandofdisintegration.desc=Den här staven är gjord av en solid slät bit obsidian, med ett djupt lila ljus som löper längs sidan och slutar vid spetsen. Den glöder av destruktiv energi och väntar på att få skjuta framåt.
items.wands.wandofdisintegration.stats_desc=Den här trollstaven skjuter iväg en stråle som tränger igenom alla hinder och når längre ju mer den uppgraderas. Strålen ger _%1$d-%2$d skada,_ och kommer även att ge bonusskada för varje fiende och vägg den penetrerar.
items.wands.wandofdisintegration.upgrade_stat_name_2=Max räckvidd
items.wands.wandofdisintegration.bmage_desc=När den används av _Stridsmagikern_ har en stav av sönderdelning ökad attackräckvidd, som om den hade en projicerande förtrollning.
items.wands.wandofdisintegration.eleblast_desc=En elementarblast med en upplösningsstav ger 100% skada och tränger igenom väggar.

items.wands.wandoffireblast.name=stav av eldblast
items.wands.wandoffireblast.staff_name=stav för eldstöt
items.wands.wandoffireblast.desc=Den här trollstaven är gjord av rödlackerat trä med gyllene blad som används flitigt för att få den att se ganska kunglig ut. Det sprakar och väser i spetsen, ivrig att släppa lös sin kraftfulla magi.
items.wands.wandoffireblast.stats_desc=Den här trollstaven sprutar ut en kon av eld när den används. Dess nästa attack kommer att förbruka _%1$d laddningar_ och ge _%2$d-%3$d skada._ Ju fler laddningar trollstaven förbrukar, desto större och starkare blir effekten.
items.wands.wandoffireblast.upgrade_stat_name_1=1 Laddningsskada
items.wands.wandoffireblast.upgrade_stat_name_2=2 Laddningsskada
items.wands.wandoffireblast.upgrade_stat_name_3=3 Laddningsskada
items.wands.wandoffireblast.bmage_desc=När _Stridsmagikern_ slår en fiende med en eldstav finns det en chans att det uppstår en explosion som skadar fiender och förbrukar all eld i närheten! Chansen ökar ju mer eld som finns i närheten av fienden.
items.wands.wandoffireblast.eleblast_desc=En elementarblast med en eldblåsarstav ger 100% skada, spränger upp dörrar och sätter eld på fiender och terräng.

items.wands.wandoffrost.name=froststav
items.wands.wandoffrost.staff_name=staff av frost
items.wands.wandoffrost.desc=Det här trollspöet verkar vara gjort av någon form av magisk is. Den blir ljusare mot sin rundade spets. Det känns väldigt kallt när man håller i det, men på något sätt förblir handen varm.
items.wands.wandoffrost.stats_desc=Den här trollstaven skjuter ut isiga energistrålar mot dina fiender, vilket ger _%1$d-%2$d skada_ och kyla. Effekten verkar starkare i vatten. Fiender som redan är nedkylda eller frysta tar mindre skada av den här trollstaven.
items.wands.wandoffrost.upgrade_stat_name_2=Kylning varaktighet
items.wands.wandoffrost.bmage_desc=När _stridsledaren_ slår en nedkyld fiende med en stav av frost, har de en chans att omedelbart frysa. Denna chans blir större ju mer nedkylda de är.
items.wands.wandoffrost.eleblast_desc=En elementarblast med en stav av frost ger 100% skada, fryser fiender och släcker bränder.

items.wands.wandoflightning.name=Blixtstav
items.wands.wandoflightning.staff_name=blixtens stav
items.wands.wandoflightning.ondeath=Du dödade dig själv med din egen blixtstav...
items.wands.wandoflightning.desc=Den här trollstaven är tillverkad av solid metall, vilket gör den förvånansvärt tung. Två tänder böjs ihop i spetsen och elektricitet bildas mellan dem.
items.wands.wandoflightning.stats_desc=Den här trollstaven skickar kraftfulla blixtar genom det som den skjuts mot och ger _%1$d-%2$d skada._ Elektriciteten går i bågar till karaktärer i närheten och sprider sig lättare i vatten. Bågarna från denna trollstav kan skada dig, men skadar inte dina allierade.
items.wands.wandoflightning.bmage_desc=När Stridsmagikern slår en fiende med en blixtstav har han en chans att ladda sig själv med elektricitet i 10 turer. Medan han är laddad är Stridsmagikern immun mot blixtskador och kan slunga blixtar längre.
items.wands.wandoflightning.eleblast_desc=En elementarblast med en blixtstav ger 100% skada, förlamar fiender i 5 varv och elektrifierar vatten.
items.wands.wandoflightning$lightningcharge.name=Elektriskt laddad
items.wands.wandoflightning$lightningcharge.desc=Stridsmagikern är för närvarande laddad med energi, vilket ger honom immunitet mot sin blixtstav och ökar räckvidden för blixtarna som slår ner från den.\n\nÅterstående turer: %s.

items.wands.wandoflivingearth.name=stav av levande jord
items.wands.wandoflivingearth.staff_name=stav av levande jord
items.wands.wandoflivingearth.desc=Detta trollspö är gjort av en märklig sten, med band av glödande gul energi. Stenen verkar röra sig en aning när du greppar trollspöet, som om den kan känna din hand.
items.wands.wandoflivingearth.stats_desc=Denna trollstav avfyrar magiska stenbollar mot fiender och orsakar _%1$d-%2$d skada._ Stenarna återbildas sedan runt användaren och ger denne rustning i proportion till den skada som orsakats. Om tillräckligt med rustning byggs upp bildas en stenvakt när trollstaven zappas nästa gång.
items.wands.wandoflivingearth.upgrade_stat_name_2=Guardian Max HP
items.wands.wandoflivingearth.upgrade_stat_name_3=Guardian Blocking
items.wands.wandoflivingearth.bmage_desc=När _stridsledaren_ slår en fiende med en stav av levande jord, återgår en del av skadan som stenpansar.
items.wands.wandoflivingearth.eleblast_desc=En elementarblast med en stav av levande jord ger 50% skada och läker en aktiv jordväktare för varje träffad fiende.
items.wands.wandoflivingearth$rockarmor.name=rock rustning
items.wands.wandoflivingearth$rockarmor.desc=Magiska stenar omger din kropp, när du blir attackerad kommer de att försöka blockera åt dig och minska skadan du tar med 50%%. Varje blockerad skada skrapar dock bort en del av stenen.\n\nResterande rustning: %1$d.\n\nOm tillräckligt med sten byggs runt dig kommer nästa zap från din trollstav av levande jord att få stenarna att bilda en väktare som kommer att slåss med dig.\n\nRustning som behövs för väktaren: %2$d.
items.wands.wandoflivingearth$rockarmor.desc_many=Den här jordväktaren drar också nytta av Power of Many. Återstående varv: %d.
items.wands.wandoflivingearth$earthguardian.name=earthen guardian
items.wands.wandoflivingearth$earthguardian.desc=Stenarna från din trollstav av levande jord har formats till en skyddande jordväktare! Detta steniga skydd kommer att attackera fiender i närheten, vilket tvingar dem att attackera skyddet istället för dig. När alla hot i närheten är borta återbildas skyddet runt dig och kommer tillbaka när du använder din trollstav nästa gång.
items.wands.wandoflivingearth$earthguardian.wand_info=Väktarens defensiva kraft är knuten till nivån på din trollstav. Den blockerar för närvarande _%1$d-%2$d skada._
items.wands.wandoflivingearth$earthguardian.discover_hint=Du kan hitta den här karaktären med en specifik trollstav.

items.wands.wandofmagicmissile.name=stav för magisk missil
items.wands.wandofmagicmissile.staff_name=staff av magisk missil
items.wands.wandofmagicmissile.desc=Den här ganska enkla trollstaven skjuter iväg missiler av ren magisk energi. Vid själva trollstaven saknas specialeffekter, men den har fler tillgängliga laddningar och kan kortvarigt ge kraft åt andra trollstavar när den uppgraderas.
items.wands.wandofmagicmissile.stats_desc=Varje skott från den här trollstaven ger _%1$d-%2$d skada,_ och kommer kortvarigt att ge kraft åt andra trollstavar om den uppgraderas.
items.wands.wandofmagicmissile.bmage_desc=När _stridsledaren_ träffar en fiende med en stav med magisk missil laddas alla hans trollstavar utöver staven.
items.wands.wandofmagicmissile.eleblast_desc=En elementarblast med en stav av magisk missil ger 50% skada och ger Magikern 15 turer av uppladdning.
items.wands.wandofmagicmissile.discover_hint=En av hjältarna börjar med det här föremålet.
items.wands.wandofmagicmissile$magiccharge.name=magisk laddning
items.wands.wandofmagicmissile$magiccharge.desc=Din trollstav med magisk missil har matat tillbaka kraft till dina trollstavar, vilket ökar den effektiva nivån för nästa zap de gör.\n\nDina trollstavar är boostade till: +%d.\n\nTur med magisk laddning kvar: %s.

items.wands.wandofprismaticlight.name=stav av prismatiskt ljus
items.wands.wandofprismaticlight.staff_name=staff av prismatiskt ljus
items.wands.wandofprismaticlight.desc=Den här staven är gjord av en solid bit genomskinlig kristall, som en lång bit slätt glas. Små bitar av färgglatt ljus dansar runt spetsen på trollstaven, ivriga att brista ut.
items.wands.wandofprismaticlight.stats_desc=Den här trollstaven skjuter ut ljusstrålar som skär genom mörkret i fängelsehålan och avslöjar dolda områden och fällor. Strålen kan göra fiender blinda och ger _%1$d-%2$d skada._ Demoniska och odöda fiender brinner i det starka ljuset från trollstaven och får bonusskada.
items.wands.wandofprismaticlight.upgrade_stat_name_2=Blind chans
items.wands.wandofprismaticlight.upgrade_stat_name_3=Ljusets varaktighet
items.wands.wandofprismaticlight.bmage_desc=När _stridsledaren_ träffar en fiende med en stav av prismatiskt ljus blir denne lamslagen under en tid som skalas med stavens nivå.
items.wands.wandofprismaticlight.eleblast_desc=En elementär explosion med en stav av prismatiskt ljus ger 67% skada, avslöjar all terräng i explosionen och förblindar fiender i 5 varv.

items.wands.wandofregrowth.name=stav för återväxt
items.wands.wandofregrowth.staff_name=staff av återväxt
items.wands.wandofregrowth.desc=Den här trollstaven är gjord av ett tunt skaft av skickligt utskuret trä. På något sätt är det fortfarande levande och vibrerande, ljusgrönt som kärnan i ett ungt träd. "När livet upphör börjar alltid nytt liv växa... Den eviga cykeln består alltid!"
items.wands.wandofregrowth.stats_desc=När den här trollstaven används sprutar den magisk återväxtenergi utåt i en kon, vilket får gräs, rötter och sällsynta växter att vakna till liv. Dess nästa zapp kommer att förbruka _%1$d laddningar_. Ju fler laddningar trollstaven använder, desto större och starkare blir effekten.
items.wands.wandofregrowth.degradation=Efter ytterligare _%d laddningar_ kommer denna trollstav att börja misslyckas med att producera växter och färskt gräs. Denna gräns ökas genom att gå upp i nivå eller uppgradera trollstaven.
items.wands.wandofregrowth.upgrade_stat_name_1=Gräs per laddning
items.wands.wandofregrowth.upgrade_stat_name_2=Total gräns för gräs
items.wands.wandofregrowth.bmage_desc=När _stridsledaren_ slår en fiende med en återväxtstav och båda står på gräs, kommer han att få örtläkning i proportion till skadan.
items.wands.wandofregrowth.eleblast_desc=En elementarblast med en återväxtens stav rotar fiender och får gräs att växa slumpmässigt över blastens område.
items.wands.wandofregrowth$dewcatcher.name=Dewcatcher
items.wands.wandofregrowth$dewcatcher.desc=Dewcatchers är förunderliga växter som fyller sig själva med magisk dagg. De försöker kamouflera sig som gräs för att undvika att bli observerade, men deras utbuktningar av uppsamlad dagg avslöjar dem.
items.wands.wandofregrowth$dewcatcher.discover_hint=Du kan hitta den här växten med en specifik trollstav.
items.wands.wandofregrowth$seedpod.name=Såddpod
items.wands.wandofregrowth$seedpod.desc=Seed Pods är magiska växter som producerar frön från andra växttyper, snarare än några egna frön. De lyckas på något sätt sprida sig trots att de inte har några egna frön.
items.wands.wandofregrowth$seedpod.discover_hint=Du kan hitta den här växten med en specifik trollstav.
items.wands.wandofregrowth$lotus.name=Gyllene lotus
items.wands.wandofregrowth$lotus.desc=Den gyllene lotusen är en mystisk växt som bara kan frammanas med en kraftfull återväxtstav. Dess aura förstärker alla växter och växteffekter, men den bränner upp sin energi och dör efter en kort tid.
items.wands.wandofregrowth$lotus.wand_info=Den här lotusen skapades av en _+%1$d_ trollstav för återväxt. Alla växter i dess effekt kommer _instantly trigger_ om de planteras på en karaktär. Växter kommer också att ha en _%2$d%% chans_ att släppa sitt frö, och spetsade pilar kommer att använda _%3$d%% mindre hållbarhet_.
items.wands.wandofregrowth$lotus.discover_hint=Du kan hitta den här växten med en specifik trollstav, efter att ha uppgraderat den flera gånger.

items.wands.wandoftransfusion.name=transfusionsstav
items.wands.wandoftransfusion.staff_name=transfusionens personal
items.wands.wandoftransfusion.ondeath=Du dödade dig själv med din egen transfusionsstav...
items.wands.wandoftransfusion.charged=Din stav är laddad med din fiendes livsenergi!
items.wands.wandoftransfusion.desc=En ganska enkelt formad stav, den sticker ut på grund av sin magentafärgade nyans och kolsvarta ädelsten i spetsen.
items.wands.wandoftransfusion.stats_desc=När den används på allierade eller charmiga fiender kommer denna trollstav att suga _%1$d av användarens hälsa_ för att läka eller skydda den allierade för _%2$d hälsa._ När den används på fiender charmar trollstaven dem kort vid applicering av _%3$d sköld_ till användaren. Fientliga odöda kommer att ta _%4$d-%5$d skada_ istället för att charmas.
items.wands.wandoftransfusion.upgrade_stat_name_1=Ally Healing
items.wands.wandoftransfusion.upgrade_stat_name_2=Självsköld
items.wands.wandoftransfusion.upgrade_stat_name_3=Odöd skada
items.wands.wandoftransfusion.bmage_desc=När _stridsledaren_ slår en förtrollad fiende med en transfusionsstav får han sköld och hans nästa zapp med staven kostar ingen hälsa.
items.wands.wandoftransfusion.eleblast_desc=En elementarblast med en transfusionsstav förtrollar fiender, helar allierade och ger 100% skada på odöda fiender.

items.wands.wandofwarding.name=trollstav av förmyndarskap
items.wands.wandofwarding.staff_name=staff av förvaring
items.wands.wandofwarding.no_more_wards=Din trollstav kan inte upprätthålla fler sköldar.
items.wands.wandofwarding.bad_location=Du kan inte placera en avdelning där.
items.wands.wandofwarding.desc=Den här korta metallstaven har en ljuslila ädelsten svävande ovanför spetsen.
items.wands.wandofwarding.stats_desc=Istället för att direkt skada en fiende, kommer den här trollstaven att frammana stationära skydd och vaktposter. Avdelningar kan frammanas var som helst, till och med genom väggar om du har vision. Den här trollstaven kan upprätthålla _%d energi_ i värde av wards åt gången.
items.wands.wandofwarding.upgrade_stat_name_1=Skada av bevakning
items.wands.wandofwarding.upgrade_stat_name_2=Skuggningsenergi
items.wands.wandofwarding.bmage_desc=När _Stridsmagikern_ slår en fiende med en skyddsstav har alla aktiva skydd och vakter en chans att bli helade.
items.wands.wandofwarding.eleblast_desc=En elementär explosion med en skyddsstav läker alla skydd och vakter i explosionsområdet.
items.wands.wandofwarding$ward.desc_generic_ward=Den här warden zappar automatiskt alla fiender som kommer inom dess synfält.\n\nZappar du den här warden med din wardingsstav uppgraderas den.\n\nWards har ett begränsat antal zappar innan de försvinner.
items.wands.wandofwarding$ward.desc_generic_sentry=Den här vakten har samma eldkraft som en ward, men har hälsa istället för ett bestämt antal laddningar. Det liknar ädelstenen på spetsen av din trollstav för bevakning.\n\nZappa detta vaktpostament med din trollstav för bevakning kommer att uppgradera och läka det.\n\nDetta vaktpostament kommer att spendera lite hälsa varje gång det zappar en fiende, men kan läkas genom att använda din
items.wands.wandofwarding$ward.name_1=lesser ward
items.wands.wandofwarding$ward.desc_1=Den här grundläggande warden zappar automatiskt alla fiender som kommer inom dess synfält och ger _%1$d-%2$d skada._\n\nZappa den här warden med din trollstav of warding för att uppgradera den.\n\nDen här warden zappar bara en gång innan den försvinner.\n\nDin trollstav of warding använder _%3$d energi_ för att upprätthålla den här warden.
items.wands.wandofwarding$ward.name_2=ward
items.wands.wandofwarding$ward.desc_2=Den här uppgraderade warden har ett mer invecklat mönster och kan attackera flera gånger. Varje zapp från den här avdelningen ger _%1$d-%2$d skada._\n\nZappa den här avdelningen med din trollstav för förvaring för att uppgradera den.\n\nDen här avdelningen zappar tre gånger innan den försvinner.\n\nDin trollstav för förvaring använder _%3$d energi_ för att upprätthålla den här avdelningen.
items.wands.wandofwarding$ward.name_3=större avdelning
items.wands.wandofwarding$ward.desc_3=Den här fullt uppgraderade avdelningen kan attackera fler gånger än sina föregångare. Varje zapp från den här avdelningen ger _%1$d-%2$d skada._\n\nZappa den här avdelningen med din trollstav för förvaring för att uppgradera den.\n\nDen här avdelningen zappar fem gånger innan den försvinner.\n\nDin trollstav för förvaring använder _%3$d energi_ för att upprätthålla den här avdelningen.
items.wands.wandofwarding$ward.name_4=lesser sentry
items.wands.wandofwarding$ward.desc_4=Den här mindre vaktposten har samma eldkraft som en större vaktpost, men har hälsa istället för ett visst antal laddningar. Det liknar ädelstenen på spetsen av din wardingstav. Varje zapp från det här vaktpostamentet ger _%1$d-%2$d skada._\n\nZappar du det här vaktpostamentet med din trollstav uppgraderas och läks det.\n\nDet här vaktpostamentet förbrukar lite hälsa varje gång det zappar en fiende, men kan läkas genom att du använder din trollstav på det.\n\nDin trollstav använder _%3$d energi_ för att upprätthålla det här vaktpostamentet.
items.wands.wandofwarding$ward.name_5=sentry
items.wands.wandofwarding$ward.desc_5=Detta uppgraderade vaktpostament är större och mer hållbart än ett mindre vaktpostament. Varje zapp från det här vaktpostamentet ger _%1$d-%2$d skada._\n\nZappa det här vaktpostamentet med din trollstav för förvaring uppgraderar och läker det.\n\nDet här vaktpostamentet gör av med lite hälsa varje gång det zappar en fiende, men kan läkas genom att använda din trollstav för förvaring på det.\n\nDin trollstav för förvaring använder _%3$d energi_ för att upprätthålla det här vaktpostamentet.
items.wands.wandofwarding$ward.name_6=större vaktpost
items.wands.wandofwarding$ward.desc_6=Den här fullt uppgraderade vaktposten är betydligt mer hållbar än sina föregångare. Varje zapp från denna vaktpost ger _%1$d-%2$d skada._\n\nZappa denna vaktpost med din trollstav för förvaring för att läka den.\n\nDenna vaktpost kommer att spendera lite hälsa varje gång den zappar en fiende, men kan läkas genom att använda din trollstav för förvaring på den.\n\nDin trollstav för förvaring använder _%3$d energi_ för att upprätthålla denna vaktpost.
items.wands.wandofwarding$ward.discover_hint=Du kan hitta den här karaktären med en specifik trollstav.
items.wands.wandofwarding$ward.dismiss_title=Avskeda den här vakten?
items.wands.wandofwarding$ward.dismiss_body=Du kan avfärda denna avdelning om du inte längre vill att din trollstav ska upprätthålla den. Om du gör det förstörs bevakningen omedelbart.\n\nAvveckla den här bevakningen?
items.wands.wandofwarding$ward.dismiss_confirm=yes
items.wands.wandofwarding$ward.dismiss_cancel=no

###weapon curses
items.weapon.curses.annoying.name=irriterande %s
items.weapon.curses.annoying.msg_1=OOH, KÄMPAR VI MOT NÅGOT!?
items.weapon.curses.annoying.msg_2=YEAH, FÅ DEM!
items.weapon.curses.annoying.msg_3=HEJ, LYSSNA!
items.weapon.curses.annoying.msg_4=Är vi framme vid bossen än?
items.weapon.curses.annoying.msg_5=Öh, svinga mig inte så hårt!
items.weapon.curses.annoying.msg_6=Dö, insekt!
items.weapon.curses.annoying.msg_7=WHEEEEEEEEEEEEEEEEE!
items.weapon.curses.annoying.msg_8=Kan vi ta en paus!?
items.weapon.curses.annoying.msg_9=POW, HAHA!
items.weapon.curses.annoying.msg_10=Väl STRUCKAT!
items.weapon.curses.annoying.msg_11=Jag ville inte bli ett vapen, jag ville bli en skogshuggares yxa.
items.weapon.curses.annoying.msg_12=Kom ihåg att övermod är en långsam och försåtlig mördare.
items.weapon.curses.annoying.msg_13=ALLA DINA BASER TILLHÖR OSS!
items.weapon.curses.annoying.desc=Annoying weapons kan tala, men de är lite för energiska. De kommer ofta att observera dig utan att mena det.
items.weapon.curses.annoying.elestrike_desc=Ett elementarslag med en irriterande förbannelse har 20% chans att göra varje fiende inom räckhåll till en amok i 6 varv.

items.weapon.curses.dazzling.name=bländande %s
items.weapon.curses.dazzling.desc=Bländande vapen blinkar ibland med bländande ljus och förblindar allt som kan se dem.
items.weapon.curses.dazzling.elestrike_desc=Ett elementarslag med en bländande förbannelse har 50% chans att göra alla fiender inom räckhåll blinda i 6 varv.

items.weapon.curses.displacing.name=förskjutning %s
items.weapon.curses.displacing.desc=Displacing-vapen är fyllda med kaotisk teleporteringsmagi och har förmågan att slumpmässigt förflytta fiender runt på golvet.
items.weapon.curses.displacing.elestrike_desc=Ett elementarslag med en displacing-förbannelse har 50% chans att teleportera alla fiender inom räckhåll.

items.weapon.curses.explosive.name=explosiv %s
items.weapon.curses.explosive.warm=Varm...
items.weapon.curses.explosive.hot=Het!
items.weapon.curses.explosive.desc=Explosiva vapen bygger stadigt upp kraft och exploderar, vilket skadar allt i närheten.
items.weapon.curses.explosive.desc_cool=Ditt vapen är för närvarande svalt vid beröring.
items.weapon.curses.explosive.desc_warm=Ditt vapen bygger upp energi och blir varmt...
items.weapon.curses.explosive.desc_hot=Ditt vapen är hett! Det är på väg att explodera!
items.weapon.curses.explosive.elestrike_desc=Ett elementarslag med en explosiv förbannelse har 50% chans att orsaka en explosion på en slumpmässig fiende inom räckhåll.

items.weapon.curses.friendly.name=vänlig %s
items.weapon.curses.friendly.desc=Vänliga vapen passar bäst för pacifister och utlöser ibland magi som gör det omöjligt att slåss.
items.weapon.curses.friendly.elestrike_desc=Ett elementarslag med en vänlig förbannelse har 50% chans att förtrolla varje fiende inom räckhåll i 6 varv.

items.weapon.curses.polarized.name=polariserad %s
items.weapon.curses.polarized.desc=Ett polariserat vapen påverkas av magi som gör att dess attack antingen ger 50% mer skada eller ingen skada alls.
items.weapon.curses.polarized.elestrike_desc=En elementarattack med en polariserad förbannelse har 50% chans att ge 24-36 skador på varje fiende inom räckhåll.

items.weapon.curses.sacrificial.name=sacrificial %s
items.weapon.curses.sacrificial.desc=Sacrificial-vapen kräver blod från bäraren i utbyte mot att attackera fiender. Ju friskare bäraren är, desto mer blod kommer förbannelsen att ta.
items.weapon.curses.sacrificial.elestrike_desc=Ett elementarslag med en offerförbannelse får hjälten och varje fiende inom räckhåll att blöda i 12 HP.

items.weapon.curses.wayward.name=wayward %s
items.weapon.curses.wayward.desc=Wayward-vapen kommer ibland att bli extremt inexakta. Denna magi varar vid en liten stund när den aktiveras, men kan skingras genom att slå ett slag med wayward-vapnet.
items.weapon.curses.wayward.elestrike_desc=Ett elementarslag med en wayward-förbannelse har 50% chans att förhäxa varje fiende inom räckhåll i 6 varv.
items.weapon.curses.wayward$waywardbuff.name=wayward
items.weapon.curses.wayward$waywardbuff.desc=Ditt wayward-vapens magi har aktiverats, vilket gör det extremt inexakt under en kort tid. Notera att detta inte påverkar attacker som garanterat kommer att träffa, som t.ex. överraskningsattacker. Lyckas du attackera med wayward-vapnet försvinner denna effekt omedelbart.\n\nResterande varv: %s.

###enchantments
items.weapon.enchantments.blazing.name=blossande %s
items.weapon.enchantments.blazing.desc=Den här förtrollningen får lågor att spruta ut från ett vapen, antända fiender och ge bonusskada på fiender som redan står i lågor.
items.weapon.enchantments.blazing.elestrike_desc=En elementarstrike med en blossande förtrollning sprider eld till alla plattor inom räckhåll, vilket varar i 8 varv.

items.weapon.enchantments.blocking.name=blockering %s
items.weapon.enchantments.blocking.desc=Blockerande vapen har en chans att skölda dig en kort stund efter att du attackerat med dem.
items.weapon.enchantments.blocking.elestrike_desc=Ett elementarslag med en blockerande förtrollning ger duellanten 6 extra sköldar för varje fiende inom räckhåll.
items.weapon.enchantments.blocking$blockbuff.name=blockering
items.weapon.enchantments.blocking$blockbuff.desc=Ditt vapens blockerande förtrollning har gett dig en kort boost till din defensiva kraft!\n\nSköld kvar: %d\n\nTur kvar: %s.

items.weapon.enchantments.blooming.name=blomning %s
items.weapon.enchantments.blooming.desc=Blooming-vapen innehåller magi som får vegetation att gro på eller runt dem som träffas av dem.
items.weapon.enchantments.blooming.elestrike_desc=Ett elementarslag med en blooming-förtrollning sprider gräs till upp till 8 plattor inom räckvidd och rötter på alla fiender inom räckvidd i 6 varv.

items.weapon.enchantments.chilling.name=kylande %s
items.weapon.enchantments.chilling.desc=Fiender som träffas av denna förtrollning blir nedkylda, vilket saktar ner deras rörelser och attacker.
items.weapon.enchantments.chilling.elestrike_desc=Ett elementarslag med en kylförtrollning sprider kylande luft till varje bricka inom räckhåll, vilket varar i 8 varv.

items.weapon.enchantments.kinetic.name=kinetisk %s
items.weapon.enchantments.kinetic.desc=När en fiende dödas med ett kinetiskt vapen lagras överskottskraften i vapnet och används vid nästa lyckade attack.
items.weapon.enchantments.kinetic.elestrike_desc=Ett elementarslag med en kinetisk förtrollning ger 40% av den lagrade skadan till varje fiende inom räckhåll, utom det primära målet.
items.weapon.enchantments.kinetic$conserveddamage.name=konserverad skada
items.weapon.enchantments.kinetic$conserveddamage.desc=Ditt vapen har lagrat överskottskraften från ett tidigare dödande slag, och kommer att applicera den som bonusskada på din nästa attack. Energin försvinner dock långsamt med tiden.\n\nKonserverad skada: %d.

items.weapon.enchantments.corrupting.name=korrumperande %s
items.weapon.enchantments.corrupting.desc=Den här kraftfulla förtrollningen har förmågan att vända fiender till din vilja. När en fiende dödas med det här vapnet finns det en chans att de blir korrumperade istället för att dö.
items.weapon.enchantments.corrupting.elestrike_desc=Ett elementarslag med en korrumperande förtrollning har 5-25% chans (baserat på saknade HP) att korrumpera alla fiender inom räckhåll, utom det primära målet.

items.weapon.enchantments.elastic.name=elastisk %s
items.weapon.enchantments.elastic.desc=Elastiska vapen har en chans att skicka tillbaka fiender flygande korta sträckor.
items.weapon.enchantments.elastic.elestrike_desc=Ett elementarslag med en elastisk förtrollning slår tillbaka alla fiender inom räckhåll 5 brickor.

items.weapon.enchantments.grim.name=grim %s
items.weapon.enchantments.grim.desc=Den här kraftfulla förtrollningen har förmågan att omedelbart avrätta en fiende. Effekten är mer sannolik att inträffa ju svagare fienden är.
items.weapon.enchantments.grim.elestrike_desc=Ett elementarslag med en grim-förtrollning har 6-30% chans (baserat på saknade HP) att döda alla fiender inom räckhåll, utom det primära målet.

items.weapon.enchantments.lucky.name=lucky %s
items.weapon.enchantments.lucky.desc=Fiender som dödas av ett lyckovapen har en chans att släppa extra byte.
items.weapon.enchantments.lucky.elestrike_desc=Ett elementarslag med en turförtrollning har 12,5% chans att ge upphov till byte under varje fiende inom räckhåll. Denna effekt kan bara utlösas en gång per fiende.

items.weapon.enchantments.projecting.name=projecting %s
items.weapon.enchantments.projecting.desc=Med denna förtrollning får närstridsvapen extra räckvidd. Distansvapen kommer att tränga igenom väggar när de riktas mot mål i närheten.
items.weapon.enchantments.projecting.elestrike_desc=Ett elementarslag med en projicerande förtrollning ger 30% skada på varje fiende inom räckhåll, utom det primära målet.

items.weapon.enchantments.shocking.name=chockerande %s
items.weapon.enchantments.shocking.desc=Elektriska bågar från ett chockerande vapen ger extra skada på alla fiender i närheten.
items.weapon.enchantments.shocking.elestrike_desc=Ett elementarslag med en chockerande förtrollning sprider elektricitet till alla plattor inom räckhåll, vilket varar i 8 varv.

items.weapon.enchantments.unstable.name=ostabil %s
items.weapon.enchantments.unstable.desc=Den här förtrollningen utstrålar kaotisk energi och fungerar som en annan förtrollning för varje träff.
items.weapon.enchantments.unstable.elestrike_desc=Ett elementarslag med en instabil förtrollning ger en slumpmässig förtrollningseffekt på varje fiende inom räckhåll, utom det primära målet.

items.weapon.enchantments.vampiric.name=vampiric %s
items.weapon.enchantments.vampiric.desc=Den här kraftfulla förtrollningen suger livskraft från fiender med varje slag och leder den tillbaka till bäraren. Effekten är starkare ju lägre bärarens hälsa är.
items.weapon.enchantments.vampiric.elestrike_desc=Ett elementarslag med en vampyrisk förtrollning läker duellanten med 2,5 HP för varje fiende inom räckhåll.


###melee weapons
items.weapon.melee.assassinsblade.name=assassinens klinga
items.weapon.melee.assassinsblade.stats_desc=Det här vapnet är starkare mot ovetande fiender.
items.weapon.melee.assassinsblade.ability_name=sneak
items.weapon.melee.assassinsblade.typical_ability_desc=Duellisten kan _sneaka_ vid användandet av en assassins klinga. Denna förmåga låter duellanten omedelbart blinka upp till 3 brickor bort och ger henne vanligtvis _%d varv av osynlighet._
items.weapon.melee.assassinsblade.ability_desc=Duellisten kan _snyfta_ vid användandet av en lönnmördarklinga. Denna förmåga låter duellanten omedelbart blinka upp till 3 brickor bort och ger henne _%d varv av osynlighet._
items.weapon.melee.assassinsblade.upgrade_ability_stat_name=Förmågans varaktighet
items.weapon.melee.assassinsblade.desc=Ett litet vågigt blad gjort av obsidian, svårt att använda trots sin låga vikt, men dödligt om det träffar rätt.

items.weapon.melee.battleaxe.name=stridsyxa
items.weapon.melee.battleaxe.stats_desc=Det här är ett ganska exakt vapen.
items.weapon.melee.battleaxe.ability_name=tungt slag
items.weapon.melee.battleaxe.typical_ability_desc=Duellisten kan utföra ett _hårt slag_ med en stridsyxa. Denna koncentrerade attack ger vanligtvis _%1$d-%2$d skada_ om den överraskade fienden, och gör dem omtöcknade i 5 varv vilket minskar precision och undvikande med 50%%. Heavy blow träffar alltid men ger vanlig skada om det inte överraskar fienden.
items.weapon.melee.battleaxe.ability_desc=Duellisten kan utföra ett _hårt slag_ med en stridsyxa. Denna koncentrerade attack ger _%1$d-%2$d skada_ om den överraskade fienden, och gör dem omtöcknade i 5 varv vilket minskar precision och undvikande med 50%%. Heavy blow träffar alltid men ger vanlig skada om det inte överraskar fienden.
items.weapon.melee.battleaxe.desc=Det enorma stålhuvudet på denna stridsyxa ger avsevärd tyngd bakom varje brett slag.

items.weapon.melee.crossbow.name=armborst
items.weapon.melee.crossbow.typical_stats_desc=Vanligtvis förstärker detta vapen kastade pilar så att de orsakar _%1$d-%2$d skada_ när det är utrustat, och ger dem till och med sin förtrollning.
items.weapon.melee.crossbow.stats_desc=Detta vapen förbättrar kastade pilar så att de orsakar _%1$d-%2$d skada_ när det är utrustat, och ger dem även dess förtrollning.
items.weapon.melee.crossbow.ability_name=laddade skott
items.weapon.melee.crossbow.typical_ability_desc=Duellisten kan _ladda_ sitt armborst, vilket gör att hennes nästa vanliga attack med det alltid träffar och ger en av tre effekter: närstridsattacker kommer att slå bort fiender, ospetsade pilar ger vanligtvis _+%1$d skada_, och spetsade pilar ger sin effekt i ett område på 7x7 och varar vanligtvis i _%2$d fler användningar_.
items.weapon.melee.crossbow.ability_desc=Duellisten kan _ladda_ sitt armborst, vilket gör att hennes nästa vanliga attack med det alltid träffar och tillämpar en av tre effekter: närstridsattacker slår bort fiender, ospetsade pilar ger _+%1$d skada_ och spetsade pilar tillämpar sin effekt i ett 7x7-område och varar i _%2$d fler användningar_.
items.weapon.melee.crossbow.desc=Ett ganska komplicerat vapen som skjuter bultar med exceptionell hastighet. Vid sidan av att det inte är utformat för det, gör armborstets tyngd och robusta konstruktion det till ett bra närstridsvapen.
items.weapon.melee.crossbow.upgrade_ability_stat_name=Förbättrad förmåga
items.weapon.melee.crossbow$chargedshot.name=laddat
items.weapon.melee.crossbow$chargedshot.desc=Duellisten fokuserar kraft i sitt armborst. Nästa attack hon gör med det kommer alltid att träffa och ge en av tre effekter:\n- Närstridsattacker kommer att slå fiender några brickor bort.\n- Ospetsade pilar kommer att ge bonusskada.\n- Spetsade pilar kommer att få extra användningsområden och ge sin effekt i ett område på 7x7. Positiva pileffekter påverkar bara allierade, och skadliga effekter gäller bara fiender. Duellanten kan inte använda denna förmåga för att applicera positiva dart-effekter på sig själv.

items.weapon.melee.cudgel.name=cudgel
items.weapon.melee.cudgel.stats_desc=Det här är ett ganska exakt vapen.
items.weapon.melee.cudgel.ability_name=tungt slag
items.weapon.melee.cudgel.typical_ability_desc=Duellisten kan utföra ett _hårt slag_ med en cudgel. Denna koncentrerade attack ger vanligtvis _%1$d-%2$d skada_ om den överraskade fienden, och gör dem omtöcknade i 5 varv vilket minskar precision och undvikande med 50%%. Heavy blow träffar alltid men ger vanlig skada om det inte överraskar fienden.
items.weapon.melee.cudgel.ability_desc=Duellisten kan utföra ett _hårt slag_ med en cudgel. Denna koncentrerade attack ger _%1$d-%2$d skada_ om den överraskade fienden, och gör dem omtöcknade i 5 varv vilket minskar precision och undvikande med 50%%. Heavy blow träffar alltid men ger vanlig skada om det inte överraskar fienden.
items.weapon.melee.cudgel.desc=En liten mässingsklubba, tillverkad mer som ett självförsvarsverktyg för adelsmän än som ett äventyrsvapen.
items.weapon.melee.cudgel.discover_hint=En av hjältarna börjar med det här föremålet.

items.weapon.melee.dagger.name=dagger
items.weapon.melee.dagger.stats_desc=Det här vapnet är starkare mot ovetande fiender.
items.weapon.melee.dagger.ability_name=sneak
items.weapon.melee.dagger.typical_ability_desc=Duellisten kan _sneaka_ vid användandet av en dolk. Denna förmåga låter duellanten omedelbart blinka upp till 5 brickor bort och ger henne vanligtvis _%d varv av osynlighet._
items.weapon.melee.dagger.ability_desc=Duellisten kan _sneaka_ vid användandet av en dolk. Denna förmåga låter Duellisten omedelbart blinka upp till 5 brickor bort och ger henne _%d varv av osynlighet._
items.weapon.melee.dagger.upgrade_ability_stat_name=Förmågans varaktighet
items.weapon.melee.dagger.desc=En enkel järndolk med ett slitet trähandtag.
items.weapon.melee.dagger.discover_hint=En av hjältarna börjar med detta föremål.

items.weapon.melee.dirk.name=dirk
items.weapon.melee.dirk.stats_desc=Det här vapnet är starkare mot ovetande fiender.
items.weapon.melee.dirk.ability_name=sneak
items.weapon.melee.dirk.typical_ability_desc=Duellisten kan _sneaka_ vid användandet av en dirk. Denna förmåga låter Duellisten omedelbart blinka upp till 4 brickor bort och ger henne vanligtvis _%d varv av osynlighet._
items.weapon.melee.dirk.ability_desc=Duellisten kan _sneaka_ vid användandet av en dirk. Denna förmåga låter Duellisten omedelbart blinka upp till 4 brickor bort och ger henne _%d varv av osynlighet._
items.weapon.melee.dirk.upgrade_ability_stat_name=Förmågans varaktighet
items.weapon.melee.dirk.desc=En längre dolk som ger lite mer stål att sticka in i fienden.

items.weapon.melee.flail.name=flail
items.weapon.melee.flail.stats_desc=Detta är ett ganska oprecist vapen.\nDetta vapen kan inte överraskningsattackera.
items.weapon.melee.flail.ability_name=spin
items.weapon.melee.flail.spin_warn=Du kan inte snurra flilen längre.
items.weapon.melee.flail.typical_ability_desc=Duellisten kan _snurra_ en slagruta för att bygga upp kraft under en kort tid. Varje varv som slagtrissan snurras kommer den vanligtvis att ge _+%d skada_ på nästa vanliga attack, upp till max 3 gånger. En snurrande flail är också garanterad att träffa. Att bara börja snurra kostar en laddning.
items.weapon.melee.flail.ability_desc=Duellisten kan _snurra_ en flail för att bygga upp kraft under en kort tid. Varje varv som slagtrissan snurras utdelar den _+%d skada_ på sin nästa vanliga attack, upp till max 3 gånger. En snurrande flail är också garanterad att träffa. Att bara börja snurra kostar en laddning.
items.weapon.melee.flail.desc=En spikförsedd boll som är fäst vid ett handtag med en kedja. Väldigt otymplig, men förödande om den träffar ordentligt.
items.weapon.melee.flail$spinabilitytracker.name=spinning
items.weapon.melee.flail$spinabilitytracker.desc=Duellisten snurrar sin flail och bygger upp skada för sin nästa vanliga attack med den. Varje snurr tar ett varv men ökar skadan, upp till max tre snurr. Släggan är också garanterad att träffa vid snurr.\n\nAktuella snurr: %1$d%%.\nResterande snurr: %2$s.

items.weapon.melee.gauntlet.name=stengauntlet
items.weapon.melee.gauntlet.stats_desc=Det här är ett mycket snabbt vapen.
items.weapon.melee.gauntlet.ability_name=kombo strike
items.weapon.melee.gauntlet.typical_ability_desc=Duellisten kan utföra en _kombinationsattack_ med en stenhandske. Denna attack är garanterad att träffa och ger vanligtvis _+%d skada_ för varje gång duellanten har träffat med en vanlig närstrids- eller kastvapenattack. Om du inte träffar på 5 varv återställs den här kombinationen.
items.weapon.melee.gauntlet.ability_desc=Duellisten kan utföra en _komboattack_ med en stenhandske. Denna attack är garanterad att träffa och ger _+%d skada_ för varje gång duellanten har träffat med en vanlig närstrids- eller kastvapenattack. Om du inte träffar på 5 varv återställs den här kombinationen.
items.weapon.melee.gauntlet.desc=Den här massiva handsken är gjord av karmosinrött tyg med tung magisk sten ovanpå. Tyget stramar åt runt dig och gör de tjocka stenplattorna nästan som en andra hud. Att svinga ett så tungt vapen kräver styrka, men ger en enorm kraft till dina slag.

items.weapon.melee.glaive.name=glaive
items.weapon.melee.glaive.stats_desc=Det här är ett ganska långsamt vapen. \nDet här vapnet har extra räckvidd.
items.weapon.melee.glaive.ability_name=spik
items.weapon.melee.glaive.typical_ability_desc=Duellisten kan använda spetsen på en glaive för att _spika_ en fiende som är inom räckhåll men inte intill. Detta ger vanligtvis _%1$d-%2$d skada_, slår tillbaka fienden och är garanterat att träffa.
items.weapon.melee.glaive.ability_desc=Duellisten kan använda spetsen på en glaive för att _spika_ en fiende som är inom räckhåll men inte intilliggande. Detta ger _%1$d-%2$d skada_, slår tillbaka fienden och är garanterat att träffa.
items.weapon.melee.glaive.desc=Ett massivt stavvapen som består av ett svärdblad i änden på en stav.

items.weapon.melee.gloves.name=Broddhandskar
items.weapon.melee.gloves.stats_desc=Det här är ett mycket snabbt vapen.
items.weapon.melee.gloves.ability_name=kombo-slag
items.weapon.melee.gloves.typical_ability_desc=Duellisten kan utföra en _kombinationsattack_ med dubbade handskar. Denna attack är garanterad att träffa och ger vanligtvis _+%d skada_ för varje gång duellanten har träffat med en vanlig närstrids- eller kastvapenattack. Om du inte träffar på 5 varv återställs den här kombinationen.
items.weapon.melee.gloves.ability_desc=Duellisten kan utföra en _komboattack_ med dubbade handskar. Denna attack är garanterad att träffa och ger _+%d skada_ för varje gång duellanten har träffat med en vanlig närstrids- eller kastvapenattack. Om du inte träffar på 5 varv återställs den här kombinationen.
items.weapon.melee.gloves.desc=De här dubbade handskarna ger inget riktigt skydd, men de fungerar som ett användbart vapen vid sidan av att hålla händerna fria.
items.weapon.melee.gloves.discover_hint=En av hjältarna börjar med det här föremålet.

items.weapon.melee.greataxe.name=storax
items.weapon.melee.greataxe.stats_desc=Det här vapnet är otroligt tungt.
items.weapon.melee.greataxe.ability_name=återgäldning
items.weapon.melee.greataxe.typical_ability_desc=Duellisten kan utföra en _retribution_-attack med en greataxe om hon är under 50%% hälsa. Denna förödande attack ger vanligtvis _%1$d-%2$d skada,_ är garanterad att träffa, och är omedelbar om den dödar en fiende.
items.weapon.melee.greataxe.ability_desc=Duellisten kan utföra en _retribution_-attack med en greataxe om hon är under 50%% hälsa. Denna förödande attack ger _%1$d-%2$d skada,_ är garanterad att träffa, och är omedelbar om den dödar en fiende.
items.weapon.melee.greataxe.desc=Den här titaniska yxan är avsedd att svingas över axeln och är lika kraftfull som den är tung.

items.weapon.melee.greatshield.name=greatshield
items.weapon.melee.greatshield.typical_stats_desc=Typiskt blockerar det här vapnet 0-%d skada. Denna blockering skalas med uppgraderingar.
items.weapon.melee.greatshield.stats_desc=Det här vapnet blockerar 0-%d skada. Denna blockering skalas med uppgraderingar.
items.weapon.melee.greatshield.ability_name=vakt
items.weapon.melee.greatshield.typical_ability_desc=Duellanten kan _skydda_ sig själv med en greatshield, som helt blockerar alla fysiska eller magiska attacker mot henne i _%d varv_. När duellanten har blockerat en attack, kommer en attack tillbaka eller användning av magi att avsluta skyddet.
items.weapon.melee.greatshield.ability_desc=Duellisten kan _skydda_ sig med en greatshield, som helt neutraliserar alla fysiska eller magiska attacker som görs mot henne i _%d varv_. När duellanten har blockerat en attack, kommer en attack tillbaka eller användning av magi att avsluta bevakningen.
items.weapon.melee.greatshield.upgrade_ability_stat_name=Förmågans varaktighet
items.weapon.melee.greatshield.desc=Mer som en mobil vägg än en sköld, denna gigantiska massa av metall hjälper till med försvaret, men lämnar inte mycket utrymme för attacker.

items.weapon.melee.greatsword.name=greatsword
items.weapon.melee.greatsword.ability_name=klyva
items.weapon.melee.greatsword.typical_ability_desc=Duellisten kan _klava_ en fiende med ett storsvärd. Detta ger vanligtvis _%1$d-%2$d skada_ och är garanterat att träffa. Om cleave dödar en fiende är det ögonblickligt och duellanten kan använda cleave igen inom 5 varv gratis.
items.weapon.melee.greatsword.ability_desc=Duellisten kan _klava_ en fiende med ett greatsword. Detta ger _%1$d-%2$d skada_ och är garanterat att träffa. Om cleave dödar en fiende är det ögonblickligt och duellanten kan använda cleave igen inom 5 varv gratis.
items.weapon.melee.greatsword.desc=Detta höga svärd tillfogar stor skada genom att investera sin tyngd i varje sving.

items.weapon.melee.handaxe.name=handyxa
items.weapon.melee.handaxe.stats_desc=Det här är ett ganska exakt vapen.
items.weapon.melee.handaxe.ability_name=tungt slag
items.weapon.melee.handaxe.typical_ability_desc=Duellisten kan utföra ett _hårt slag_ med en handyxa. Denna koncentrerade attack ger vanligtvis _%1$d-%2$d skada_ om den överraskade fienden, och gör dem omtöcknade i 5 varv vilket minskar precision och undvikande med 50%%. Heavy blow träffar alltid men ger vanlig skada om det inte överraskar fienden.
items.weapon.melee.handaxe.ability_desc=Duellisten kan utföra ett _hårt slag_ med en handyxa. Denna koncentrerade attack ger _%1$d-%2$d skada_ om den överraskade fienden, och gör dem omtöcknade i 5 varv vilket minskar precision och undvikande med 50%%. Heavy blow träffar alltid men ger vanlig skada om det inte överraskar fienden.
items.weapon.melee.handaxe.desc=En lätt yxa som oftast används för att fälla träd. Det breda bladet fungerar också bra mot fiender.

items.weapon.melee.katana.name=katana
items.weapon.melee.katana.stats_desc=Det här vapnet blockerar 0-3 skador.
items.weapon.melee.katana.ability_name=utfall
