items.weapon.melee.scimitar$sworddance.desc=Duellisten gör snabba momentumbaserade slag i en slags dans. Vid denna ställning attackerar hon 60%% snabbare (tillräckligt för att attackera exakt två gånger per tur med en scimitar) och har +50%% träffsäkerhet.\n\nÅterstående turer: %s.

