items.weapon.melee.sai.typical_ability_desc=Duellisten kan utföra en _kombinationsattack_ med sai. Denna attack är garanterad att träffa och ger vanligtvis _+%d skada_ för varje gång duellanten har träffat med en vanlig närstrids- eller kastvapenattack. Om du inte träffar på 5 varv återställs den här kombinationen.
items.weapon.melee.sai.ability_desc=Duellisten kan utföra en _komboattack_ med sai. Denna attack är garanterad att träffa och ger _+%d skada_ för varje gång duellanten har träffat med en vanlig närstrids- eller kastvapenattack. Om du inte träffar på 5 varv återställs den här kombinationen.
