items.test_tubes.tubeofexperience.name=Tube of Experience
items.test_tubes.tubeofexperience.desc=This tube has a blessing and it gives you a small amount of experience, and not useful in late game scenarios.
items.test_tubes.tubeofpureimmunity.name=Tube of Pure Immunity
items.test_tubes.tubeofpureimmunity.desc=This tube will give you a short time of immunity to some or all of the negative effects.
items.test_tubes.tubeofpureimmunity.freshness=You feel uncommon freshness in the air.
items.test_tubes.tubeofpureimmunity.protected=A protective film envelops you!
items.test_tubes.tubeofstrength.name=Tube of Strengthened Luck
items.test_tubes.tubeofstrength.desc=This tube is very sensitive to luck, and gives you some strength, use them wisely...
items.test_tubes.tubeofprismaticsensation.name=Tube of Prismatic Sensation
items.test_tubes.tubeofprismaticsensation.desc=This tube works as the tubified version of scroll of prismatic image, but it's health is equal to half of your health.
items.test_tubes.tubeofultimatepower.name=Tube of Ultimate Power
items.test_tubes.tubeofultimatepower.desc=This tube gives you power and additional experience, who knows what are the possible side effects?
items.test_tubes.tubeoftranscendingtime.name=Tube of Transcending Time
items.test_tubes.tubeoftranscendingtime.desc=Use this thing to make time travelling work for 10 turns, actually it stops time.
items.test_tubes.tubeofgodspeed.name=Tube of Godspeed
items.test_tubes.tubeofgodspeed.desc=This powerful tube will increase the speed of the drinker 5 times.
