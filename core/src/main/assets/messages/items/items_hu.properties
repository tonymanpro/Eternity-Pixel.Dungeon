items.weapon.melee.dagger.desc=Egyszerű vastőr, kopott fa markolattal.
items.weapon.melee.dagger.discover_hint=Az egyik hős ezzel a tárggyal indul.

items.weapon.melee.dirk.name=hosszú tőr
items.weapon.melee.dirk.stats_desc=Ez a fegyver erősebb azok ellen az ellenségek ellen, akik nem vettek észre.
items.weapon.melee.dirk.ability_name=lopakodás
items.weapon.melee.dirk.typical_ability_desc=A párbajhős képes _lopakodni_, ha egy hosszútőrt forgat. Ez a képesség lehetővé teszi a párbajhős számára, hogy legfeljebb 4 mező távolságot azonnal keresztülcikázzon, és jellemzően _%d körre láthatatlanná váljon._
items.weapon.melee.dirk.ability_desc=A párbajhős képes _lopakodni_, ha egy hosszútőrt forgat. Ez a képesség lehetővé teszi a párbajhős számára, hogy legfeljebb 4 mező távolságot azonnal keresztülcikázzon, és _%d körre láthatatlanná váljon._
items.weapon.melee.dirk.upgrade_ability_stat_name=Képesség időtartama
items.weapon.melee.dirk.desc=Egy hosszabb szúrótőr, amelyben egy picit több acél van, amit az ellenfélbe lehet döfni.

items.weapon.melee.flail.name=láncos buzogány
items.weapon.melee.flail.stats_desc=Ez egy elég pontantlan fegyver.\nEzzel a fegyverrel nem lehet az ellenséget meglepve támadni.
items.weapon.melee.flail.ability_name=pörgetés
items.weapon.melee.flail.spin_warn=Nem tudod tovább pörgetni a láncos buzogányt.
items.weapon.melee.flail.typical_ability_desc=A párbajhős képes _pörgetni_ a láncos buzogányt rövid ideig, hogy erőt gyűjtsön. Minden egyes körben, amikor a láncos buzogányt pörgeti, de maximum 3-szor, jellemzően _+%d sebzést_ okoz a következő közönséges támadása. A pörgő láncos buzogány garantáltan betalál. Csak a láncos buzogány pörgetésének megkezdése kerül egy töltésbe.
items.weapon.melee.flail.ability_desc=A párbajhős képes _pörgetni_ a láncos buzogányt rövid ideig, hogy erőt gyűjtsön. Minden egyes körben, amikor a láncos buzogányt pörgeti, de maximum 3-szor, _+%d sebzést_ okoz a következő közönséges támadása. A pörgő láncos buzogány garantáltan betalál. Csak a láncos buzogány pörgetésének megkezdése kerül egy töltésbe.
items.weapon.melee.flail.desc=Tüskés golyó, amelyet lánccal erősítettek a nyeléhez. Nehezen kezelhető, de ha egyszer rendesen betalál, pusztít.
items.weapon.melee.flail$spinabilitytracker.name=pörgetés
items.weapon.melee.flail$spinabilitytracker.desc=A párbajhős pörgeti a láncos buzogányát, amivel egyre fokozza a következő közönséges támadásának sebzését. Minden pörgetés egy kört vesz igénybe, cserébe növeli a sebzést, legfeljebb három pörgetésig. A láncos buzogány pörgés közben pedig garantáltan betalál.\n\nEddigi pörgetések: %1$d%%.\nHátralévő körök: %2$s.

items.weapon.melee.gauntlet.name=kő páncélkesztyű
items.weapon.melee.gauntlet.stats_desc=Nagyon gyors fegyver.
items.weapon.melee.gauntlet.ability_name=kombócsapás
items.weapon.melee.gauntlet.typical_ability_desc=A párbajhős egy kő kesztyűvel _kombócsapást_ képes végrehajtani. Ez a támadás garantáltan betalál, és jellemzően _+%d sebzést_ okoz minden találat után, amit a Párbajhős egy hagyományos közelharci vagy dobott fegyveres támadással indított. Ha 5 fordulón belül nem talál be, ez a kombó visszaáll.
items.weapon.melee.gauntlet.ability_desc=A párbajhős egy kő kesztyűvel _kombócsapást_ képes végrehajtani. Ez a támadás garantáltan betalál, és _+%d sebzést_ okoz minden találat után, amit a Párbajhős egy hagyományos közelharci vagy dobott fegyveres támadással indított. Ha 5 fordulón belül nem talál be, ez a kombó visszaáll.
items.weapon.melee.gauntlet.desc=Ez a súlyos páncélkesztyű bíbor szövetből készült, a külsején nehéz mágikus kőborítással. A szövet szorosan rád simul, így a kőlapok második bőrréteget képeznek rajtad. Egy ilyen nehéz fegyver lóbálásához erőre van szükség, de borzasztó energiát ad az ütéseidnek.

items.weapon.melee.glaive.name=szurony
items.weapon.melee.glaive.stats_desc=Elég lassú fegyver.\nNagy távolságba is elér.
items.weapon.melee.glaive.ability_name=megszúrás
items.weapon.melee.glaive.typical_ability_desc=A párbajhős a szurony hegyével _megszúrhat_ egy olyan ellenséget, aki hatótávolságon belül, de nem szomszédos mezőn van. Ez jellemzően _%1$d-%2$d sebzést_ okoz, hátralöki az ellenséget, és garantáltan betalál.
items.weapon.melee.glaive.ability_desc=A párbajhős a szurony hegyével _megszúrhat_ egy olyan ellenséget, aki hatótávolságon belül, de nem szomszédos mezőn van. Ez _%1$d-%2$d sebzést_ okoz, hátralöki az ellenséget, és garantáltan betalál.
items.weapon.melee.glaive.desc=Egy rúd végére erősített kardpengéből készült súlyos szúrófegyver.

items.weapon.melee.gloves.name=szegecses kesztyű
items.weapon.melee.gloves.stats_desc=Nagyon gyors fegyver.
items.weapon.melee.gloves.ability_name=kombócsapás
items.weapon.melee.gloves.typical_ability_desc=A párbajhős egy szegecses kesztyűvel _kombócsapást_ képes végrehajtani. Ez a támadás garantáltan betalál, és jellemzően _+%d sebzést_ okoz minden találat után, amit a Párbajhős egy hagyományos közelharci vagy dobott fegyveres támadással indított. Ha 5 fordulón belül nem talál be, ez a kombó visszaáll.
items.weapon.melee.gloves.ability_desc=A párbajhős egy szegecses kesztyűvel _kombócsapást_ képes végrehajtani. Ez a támadás garantáltan betalál, és _+%d sebzést_ okoz minden találat után, amit a Párbajhős egy hagyományos közelharci vagy dobott fegyveres támadással indított. Ha 5 fordulón belül nem talál be, ez a kombó visszaáll.
items.weapon.melee.gloves.desc=Ezek a szegecses kesztyűk nem nyújtanak valódi védelmet, viszont fegyvernek is alkalmasak, miközben szabadon hagyják a kezeidet.
items.weapon.melee.gloves.discover_hint=Az egyik hős ezzel a tárggyal indul.

items.weapon.melee.greataxe.name=nagy fejsze
items.weapon.melee.greataxe.stats_desc=Ez a fegyver hihetetlenül nehéz.
items.weapon.melee.greataxe.ability_name=megtorlás
items.weapon.melee.greataxe.typical_ability_desc=A párbajhős _megtorló_ támadást hajthat végre a nagy fejszével, ha életereje 50%% alatt van. Ez a pusztító támadás jellemzően _%1$d-%2$d sebzést_ okoz, garantáltan betalál, és időveszteség nélkül megtörténik, ha megöl egy ellenséget.
items.weapon.melee.greataxe.ability_desc=A párbajhős _megtorló_ támadást hajthat végre a nagy fejszével, ha életereje 50%% alatt van. Ez a pusztító támadás _%1$d-%2$d sebzést_ okoz, garantáltan betalál, és időveszteség nélkül megtörténik, ha megöl egy ellenséget.
items.weapon.melee.greataxe.desc=A váll fölött hordott óriási fejsze éppolyan nagy erejű, mint amilyen nehéz.

items.weapon.melee.greatshield.name=nagy pajzs
items.weapon.melee.greatshield.typical_stats_desc=Ez a fegyver jellemzően 0-%d sérülést véd ki. A kivédés mértéke a fejlesztésekkel növelhető.
items.weapon.melee.greatshield.stats_desc=Ez a fegyver 0-%d sérülést véd ki. A kivédés mértéke a fejlesztésekkel növelhető.
items.weapon.melee.greatshield.ability_name=védekezés
items.weapon.melee.greatshield.typical_ability_desc=A párbajhős _védekezhet_ a nagy pajzzsal, ami jellemzően _%d körig_ teljesen elhárítja az ellene irányuló fizikai vagy mágikus támadásokat. Amint a párbajhős elhárított egy támadást, a visszatámadás vagy a mágia használata megszünteti a védekezést.
items.weapon.melee.greatshield.ability_desc=A párbajhős _védekezhet_ a nagy pajzzsal, ami _%d körig_ teljesen elhárítja az ellene irányuló fizikai vagy mágikus támadásokat. Amint a párbajhős elhárított egy támadást, a visszatámadás vagy a mágia használata megszünteti a védekezést.
items.weapon.melee.greatshield.upgrade_ability_stat_name=Képesség időtartama
items.weapon.melee.greatshield.desc=Inkább mondhatni hordozható falnak, semmint pajzsnak. E hatalmas fémtömeg védelmet nyújt, de nem nagyon hagy teret a támadásra.

items.weapon.melee.greatsword.name=nagy kard
items.weapon.melee.greatsword.ability_name=hasítás
items.weapon.melee.greatsword.typical_ability_desc=A párbajhős fel tud _hasítani_ egy ellenséget a nagy karddal. Ez jellemzően _%1$d-%2$d sebzést_ okoz, és garantáltan betalál. Ha a hasítás megöli az ellenséget, akkor ez időveszteség nélkül megtörténik, és a párbajhős 5 körön belül ingyen újra hasíthat.
items.weapon.melee.greatsword.ability_desc=A párbajhős fel tud _hasítani_ egy ellenséget a nagy karddal. Ez _%1$d-%2$d sebzést_ okoz, és garantáltan betalál. Ha a hasítás megöli az ellenséget, akkor ez időveszteség nélkül megtörténik, és a párbajhős 5 körön belül ingyen újra hasíthat.
items.weapon.melee.greatsword.desc=A hatalmas penge a súlya miatt minden ütéssel súlyos sebet ejt.

items.weapon.melee.handaxe.name=kézi fejsze
items.weapon.melee.handaxe.stats_desc=Elég pontos fegyver.
items.weapon.melee.handaxe.ability_name=súlyos csapás
items.weapon.melee.handaxe.typical_ability_desc=A párbajhős képes _súlyos csapást_ mérni a kézi fejszével. Ez az összpontosított támadás jellemzően _%1$d-%2$d sebzést_ okoz, ha meglepi az ellenséget, akit 5 körig elkábít, ami miatt 50%%-kal csökken a pontossága és a kijátszása. A súlyos csapás mindig betalál, de csak normál sebzést okoz, ha nem lepte meg az ellenséget.
items.weapon.melee.handaxe.ability_desc=A párbajhős képes _súlyos csapást_ mérni a kézi fejszével. Ez az összpontosított támadás _%1$d-%2$d sebzést_ okoz, ha meglepi az ellenséget, akit 5 körig elkábít, ami miatt 50%%-kal csökken a pontossága és a kijátszása. A súlyos csapás mindig betalál, de csak normál sebzést okoz, ha nem lepte meg az ellenséget.
items.weapon.melee.handaxe.desc=Favágáshoz használt könnyű fejsze. A széles pengéje remek szolgálatot tesz az ellenségek ellen is.

items.weapon.melee.katana.name=katana
