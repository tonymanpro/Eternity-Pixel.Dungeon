items.weapon.melee.warscythe.typical_ability_desc=A párbajhős képes _learatni_ egy ellenséget a háborús kaszával. Ez a pusztító támadás garantáltan betalál, és jellemzően _%d sebzést_ okoz. Ez a sebzés vérzésként jelentkezik, ha a célpont nem ellenálló a vérzésre.
items.weapon.melee.warscythe.ability_desc=A párbajhős képes _learatni_ egy ellenséget a háborús kaszával. Ez a pusztító támadás garantáltan betalál, és _%d sebzést_ okoz. Ez a sebzés vérzésként jelentkezik, ha a célpont nem ellenálló a vérzésre.
items.weapon.melee.warscythe.desc=Ezt a nagy és ormótlan szerszámot megerősítették, hogy jobban vágja az ellenséget, mint a terményt.

items.weapon.melee.whip.name=ostor
items.weapon.melee.whip.stats_desc=Ez a fegyver elképesztően messzire elér.
items.weapon.melee.whip.ability_name=csapás
items.weapon.melee.whip.typical_ability_desc=A párbajhős meg tud _csapni_ minden körülötte lévő ellenséget az ostorral. Ez jellemzően _%1$d-%2$d sebzést_ okoz, megtámad minden ellenséget, aki a támadás hatósugarában van, és garantáltan betalál.
items.weapon.melee.whip.ability_desc=A párbajhős meg tud _csapni_ minden körülötte lévő ellenséget az ostorral. Ez _%1$d-%2$d sebzést_ okoz, megtámad minden ellenséget, aki a támadás hatósugarában van, és garantáltan betalál.
items.weapon.melee.whip.desc=Bár a fegyver végén lévő szegecses kötél szerény sebzést ejt, a hatótávolsága páratlan.

items.weapon.melee.wornshortsword.name=viseltes rövidkard
items.weapon.melee.wornshortsword.ability_name=hasítás
items.weapon.melee.wornshortsword.typical_ability_desc=A párbajhős fel tud _hasítani_ egy ellenséget a viseltes rövidkarddal. Ez jellemzően _%1$d-%2$d sebzést_ okoz, és garantáltan betalál. Ha a hasítás megöli az ellenséget, akkor ez időveszteség nélkül megtörténik, és a párbajhős 5 körön belül ingyen újra hasíthat.
items.weapon.melee.wornshortsword.ability_desc=A párbajhős fel tud _hasítani_ egy ellenséget a viseltes rövidkarddal. Ez _%1$d-%2$d sebzést_ okoz, és garantáltan betalál. Ha a hasítás megöli az ellenséget, akkor ez időveszteség nélkül megtörténik, és a párbajhős 5 körön belül ingyen újra hasíthat.
items.weapon.melee.wornshortsword.desc=Eléggé rövid, a sok használattól megviselt kard. Gyengébb, de kissé könnyebb is mint egy jobb állapotban lévő rövidkard.
items.weapon.melee.wornshortsword.discover_hint=Az egyik hős ezzel a tárggyal indul.


###missile weapons
items.weapon.missiles.darts.adrenalinedart.name=adrenalindárda
items.weapon.missiles.darts.adrenalinedart.desc=Ezek a dárdák gyorsbogáncsalapú vegyülettel vannak bevonva, amely növeli a szövetségesek mozgási és támadási sebességét, vagy rövid időre csökkenti az ellenség mozgási sebességét. Maga a dárda továbbra is sebzi az ellenségeket, a szövetségeseket azonban nem sebzi.

items.weapon.missiles.darts.blindingdart.name=vakítódárda
items.weapon.missiles.darts.blindingdart.desc=Ezek a dárdák vakgyomalapú vegyülettel vannak bevonva, amely megvakítja a célpontot rövid időre. Zavartságot nem okoz, tehát az ellenfeled nem felejti el, merre látott utoljára.

items.weapon.missiles.darts.chillingdart.name=dermesztődárda
items.weapon.missiles.darts.chillingdart.desc=Ezek a dárdák jégsüvegalapú vegyülettel vannak bevonva, amely erősen megdermeszti a célpontot.

items.weapon.missiles.darts.cleansingdart.name=tisztítódárda
items.weapon.missiles.darts.cleansingdart.desc=Ezek a dárdák mágusrózsaalapú vegyülettel vannak bevonva, amely átmenetileg ellenállóvá teszi a szövetségeseket minden negatív hatással szemben, vagy megtisztítja az ellenséget a pozitív hatásoktól. Az ellenségek rövid időre el is felejthetik, hogy támadnak vagy menekülnek előled. Maga a dárda továbbra is káros az ellenségre, a szövetségeseket azonban nem károsítja.

items.weapon.missiles.darts.dart.name=dárda
items.weapon.missiles.darts.dart.ac_tip=BEVON
items.weapon.missiles.darts.dart.prompt=Válassz egy magot!
items.weapon.missiles.darts.dart.tip_title=Bevonom a dárdákat
items.weapon.missiles.darts.dart.tip_desc=Egy magot hozzá lehet adni egy vagy két dárdához, hogy bevond a hegyüket. Minden egyes mag sajátos dárdahegyet hoz létre, melynek hatása egyszer használható.\n\nHa bevonsz egy dárdát ezzel a maggal, _ %s_ lesz a végeredmény.
items.weapon.missiles.darts.dart.tip_all= %1$d dárdát bevonok %2$d maggal
items.weapon.missiles.darts.dart.tip_two=2 dárdát bevonok 1 maggal
items.weapon.missiles.darts.dart.tip_one=1 dárdát bevonok 1 maggal
items.weapon.missiles.darts.dart.tip_cancel=mégse
items.weapon.missiles.darts.dart.desc=Ezek az egyszerű, kihegyezett végű fabotok jól ki vannak egyensúlyozva, hogy egy csuklómozdulattal pontosan eldobhatók legyenek, és belefúródjanak az áldozatukba. Magok kivonatával bevonhatók, ilyenkor találatuk további hatást okoz.
items.weapon.missiles.darts.dart.unlimited_uses=Az egyszerű kialakításuk miatt viszont ezek a dárdák lényegében a végtelenségig használhatóak.

items.weapon.missiles.darts.displacingdart.name=tovatevődárda
items.weapon.missiles.darts.displacingdart.desc=Ezek a dárdák illólevélalapú vegyülettel vannak bevonva, ami egy kis távolsággal arrébbteleportálja a célpontot.

items.weapon.missiles.darts.healingdart.name=gyógyítódárda
items.weapon.missiles.darts.healingdart.desc=Ezek a dárdák napfűalapú vegyülettel vannak bevonva, és hirtelen felgyógyítják a célpontot. Maga a dárda továbbra is sebzi az ellenségeket, a szövetségeseket azonban nem sebzi.

items.weapon.missiles.darts.holydart.name=szent dárda
items.weapon.missiles.darts.holydart.desc=Ezek a dárdák csillagvirágalapú vegyülettel vannak bevonva, amely szent energiát juttat a célpontba. A szövetségesek és a közönséges ellenségek áldottak lesznek, de az élőhalott vagy démoni ellenségek súlyos sérülést szenvednek. Maga a dárda továbbra is sebzi az ellenségeket, a szövetségeseket azonban nem sebzi.

items.weapon.missiles.darts.incendiarydart.name=gyújtódárda
items.weapon.missiles.darts.incendiarydart.desc=Ezek a dárdák tűzvirágalapú vegyülettel vannak bevonva, és csodálatos lánggal égnek becsapódáskor.

items.weapon.missiles.darts.paralyticdart.name=bénítódárda
items.weapon.missiles.darts.paralyticdart.desc=Ezek a dárdák földgyökéralapú vegyülettel vannak bevonva, amely megbénítja rövid időre a célpontot.

items.weapon.missiles.darts.poisondart.name=mérgezett dárda
items.weapon.missiles.darts.poisondart.desc=Ezek a dárdák szomorúmoha-alapú vegyülettel vannak bevonva, amely megmérgezi a célpontot.

items.weapon.missiles.darts.rotdart.name=mállódárda
items.weapon.missiles.darts.rotdart.desc=Ezek a brutális dárdák mállóbogyóalapú savas vegyülettel vannak bevonva, amely agresszívan keresztülrágja magát mindenen, amivel a dárda érintkezésbe kerül. Az erőteljes ellenfelekre kisebb hatással van, de a maró roncsolás elég erős ahhoz, hogy könnyedén megölje a legtöbb közönséges ellenséget. Tartósabbak, mint a más bevonatú dárdák, de a tartósságukat nem lehet növelni.
items.weapon.missiles.darts.rotdart.discover_hint=Ezt a tárgyat egy adott küldetésből származó mag felhasználásával hozhatod létre.

items.weapon.missiles.darts.shockingdart.name=sokkolódárda
items.weapon.missiles.darts.shockingdart.desc=Ezek a dárdák vihartőalapú vegyülettel vannak bevonva, amely csúnya áramütést okoz a célpontnak.

items.weapon.missiles.darts.tippeddart.ac_clean=LETÖRÖL
items.weapon.missiles.darts.tippeddart.clean_title=Dárdák letörlése
items.weapon.missiles.darts.tippeddart.clean_desc=Ez a művelet eltávolítja a magokból készült bevonatot a dárdáidról, és visszalakítja őket közönséges dárdákká.
items.weapon.missiles.darts.tippeddart.clean_all=letörlöm mindet
items.weapon.missiles.darts.tippeddart.clean_one=letörlök egyet
items.weapon.missiles.darts.tippeddart.cancel=mégse
items.weapon.missiles.darts.tippeddart.uses_left=Ezeket a dárdákat még _%d/%d_ alkalommal lehet használni, mielőtt lekopna egynek a hegye.
items.weapon.missiles.darts.tippeddart.unlimited_uses=_Ezek azonban olyan magas minőségűek, hogy gyakorlatilag örökké tartanak._
items.weapon.missiles.darts.tippeddart.about_to_break=A dárdahegyed nemsokára tönkremegy.
items.weapon.missiles.darts.tippeddart.has_broken=A dárdahegyed tönkrement.
items.weapon.missiles.darts.tippeddart.discover_hint=Ezt a tárgyat megvásárolhatod egy boltban, vagy elkészítheted mag használatával.


items.weapon.missiles.bolas.name=fogókötél
items.weapon.missiles.bolas.stats_desc=Ez a fegyver nyomorékká teszi az ellenfelet.
items.weapon.missiles.bolas.desc=Ezek a szokatlan távolsági fegyverek nem sebeznek sokat, de remekül lelassítják az ellenfelet.

items.weapon.missiles.boomerang.name=bumeráng
items.weapon.missiles.boomerang.desc=Miután megdobsz egy ellenséget ezzel a lapos, ívelt fa hajítószerszámmal, az visszatér a kezedbe.
items.weapon.missiles.boomerang.durability=A szilárd kialakítás miatt ez a bumeráng nem fog elhasználódni.

items.weapon.missiles.fishingspear.name=horgász lándzsa
items.weapon.missiles.fishingspear.desc=Apró dobódárdák, amelyek jól használhatóak rögtönzött fegyverként, annak ellenére, hogy halászatra tervezték őket.

items.weapon.missiles.forcecube.name=erőkocka
items.weapon.missiles.forcecube.ondeath=Megölted magad a saját erőkockáddal...
items.weapon.missiles.forcecube.stats_desc=Ez a fegyver a becsapódás erejét kis területen osztja el, és mindent eltalál, ami a közelben van.
items.weapon.missiles.forcecube.desc=Ez a furcsán kialakított mágikus kocka elég kicsi, hogy a kezedben tartsd, de hihetetlenül nehéz.

items.weapon.missiles.heavyboomerang.name=nehéz bumeráng
items.weapon.missiles.heavyboomerang.stats_desc=Ez a fegyver 5 kör múlva visszatér arra a helyre, ahonnan eldobták.
items.weapon.missiles.heavyboomerang.desc=Ezt a nagy bumerángot nehéz jól kezelni, de számottevő sebzést okoz.

items.weapon.missiles.javelin.name=gerely
items.weapon.missiles.javelin.desc=Ezek a nagyobb dobólándzsák jól ki vannak egyensúlyozva, hogy a levegőt átszelve a hegyükkel érkezzenek a célba.

items.weapon.missiles.kunai.name=kunai
items.weapon.missiles.kunai.stats_desc=Ez a fegyver erősebb azok ellen az ellenségek ellen, akik nem vettek észre.
items.weapon.missiles.kunai.desc=Ezek az apró kések nagyon hatékonyak egy képzett felhasználó kezében.

items.weapon.missiles.missileweapon.stats_known=Ez egy _%1$d. követelményszintű _dobófegyver-készlet, amely _%2$d-%3$d sebzést_ okoz és _%4$d erő_ szükséges a használatához.
items.weapon.missiles.missileweapon.stats_unknown=Jellemzően az a _%1$d. követelményszintű_ dobófegyver-készlet _%2$d-%3$d sebzést_ okoz, és _%4$d erő_ szükséges a használatához.
items.weapon.missiles.missileweapon.stats_desc=
items.weapon.missiles.missileweapon.probably_too_heavy=Valószínűleg ez a fegyver túl nehéz neked.
items.weapon.missiles.missileweapon.distance=A dobófegyverek a távoli célpontok ellen pontosabbak, mint a közeliek ellen.
items.weapon.missiles.missileweapon.durability=A dobófegyverek a használattól kopnak és tönkremennek.
items.weapon.missiles.missileweapon.uses_left=Ezeket a dobófegyvereket _%d/%d_ körön át használhatod még, mielőtt egy eltörnek.
items.weapon.missiles.missileweapon.unlimited_uses=Ezek azonban olyan magas minőségűek, hogy gyakorlatilag örökké tartanak.
items.weapon.missiles.missileweapon.unknown_uses=Általában ez a dobófegyver-készlet _%d_ használatot bír ki, mielőtt az egyik eltörik.
items.weapon.missiles.missileweapon.curse_discover=Ez a dobófegyver meg van átkozva!
items.weapon.missiles.missileweapon.about_to_break=A dobófegyvered hamarosan tönkremegy.
items.weapon.missiles.missileweapon.has_broken=Az egyik dobófegyvered eltört.
items.weapon.missiles.missileweapon.dust=A dobófegyver porrá hullik, amint megérinted.
items.weapon.missiles.missileweapon.break_upgraded_warn_desc=Ha a továbbfejlesztett dobófegyver-készleted utolsó darabja is eltörik, akkor a készlet véglegesen elvész. Biztosan el akarod dobni?
items.weapon.missiles.missileweapon.break_upgraded_warn_yes=Igen
items.weapon.missiles.missileweapon.break_upgraded_warn_no=Nem
items.weapon.missiles.missileweapon$placeholder.name=dobófegyver

items.weapon.missiles.shuriken.name=shuriken
items.weapon.missiles.shuriken.stats_desc=A shurikeneket azonnal el lehet dobni, 20 fordulós lehűlési idővel.
items.weapon.missiles.shuriken.desc=Ezeket a borotvaéles pengével ellátott, csillag alakú fémdarabokat gyorsan el lehet dobni mozgás közben.
items.weapon.missiles.shuriken$shurikeninstanttracker.name=Shuriken eldobásának várakozási ideje
items.weapon.missiles.shuriken$shurikeninstanttracker.desc=Nemrég mozgás közben eldobtál el egy shurikent, így most várnod kell, mielőtt újra megtennéd. A shurikeneket továbbra is el lehet dobni, de a normál fegyversebességgel.\n\nHátralévő körök: %s.

items.weapon.missiles.throwingclub.name=hajítófa
items.weapon.missiles.throwingclub.stats_desc=Ez a fegyver nem ragad bele az ellenségekbe, és azonnal felvehető.
items.weapon.missiles.throwingclub.desc=Egy meglehetősen egyszerű, de tartós fegyver, lényegében egy nagy kő egy botra erősítve.

items.weapon.missiles.throwinghammer.name=dobókalapács
items.weapon.missiles.throwinghammer.stats_desc=Ez a fegyver nem ragad bele az ellenségekbe, és azonnal felvehető.
items.weapon.missiles.throwinghammer.desc=Ezek a nehéz kalapácsok az ellenfelek megdobálására lettek tervezve. Teljesen sima felületű fémből vannak, így meglehetősen tartósak.

items.weapon.missiles.throwingknife.name=dobókés
items.weapon.missiles.throwingknife.stats_desc=Ez a fegyver erősebb azok ellen az ellenségek ellen, akik nem vettek észre.
items.weapon.missiles.throwingknife.desc=Ezek a pehelysúlyú kések úgy lettek kiegyensúlyozva, hogy a levegőt könnyedén szelve pontosan eltalálják az ellenfelet.
items.weapon.missiles.throwingknife.discover_hint=Az egyik hős ezzel a tárggyal indul.

items.weapon.missiles.throwingspear.name=dobólándzsa
items.weapon.missiles.throwingspear.desc=Ezek a pehelykönnyű lándzsák vékony nyéllel rendelkeznek, ami arra utal, hogy elhajításra lettek tervezve, és nem szúrásra.

items.weapon.missiles.throwingspike.name=dobótüske
items.weapon.missiles.throwingspike.desc=Ezeket a tartós, szúrós fémhegyeket arra szánták, hogy távoli ellenségekbe dobják.
items.weapon.missiles.throwingspike.discover_hint=Az egyik hős ezzel a tárggyal indul.

items.weapon.missiles.throwingstone.name=dobókő
items.weapon.missiles.throwingstone.desc=Ezeket a köveket lecsiszolták, hogy nagyobb erővel lehessen őket eldobni, mint egy hagyományos követ.
items.weapon.missiles.throwingstone.discover_hint=Az egyik hős ezzel a tárggyal indul.

items.weapon.missiles.tomahawk.name=tomahawk
items.weapon.missiles.tomahawk.stats_desc=Ez a fegyver _%1$d-%2$d vérzést_ okoz a célpontnak.
items.weapon.missiles.tomahawk.typical_stats_desc=Ez a fegyver általában _%1$d-%2$d vérzést_ okoz a célpontnak.
items.weapon.missiles.tomahawk.desc=Ezek a dobófejszék fogazott éllel rendelkeznek, így az ellenségbe tapadnak.

items.weapon.missiles.trident.name=háromágú szigony
items.weapon.missiles.trident.desc=Masszív dobólándzsák, három halálos vasfoggal a végükön. Erőteljesek, de meglehetősen nehezek.


items.weapon.spiritbow.name=lélekíj
items.weapon.spiritbow.ac_shoot=LŐ
items.weapon.spiritbow.prompt=Válassz célpontot
items.weapon.spiritbow.stats=Az íjat nem lehet közvetlenül fejleszteni, úgy erősödik folyamatosan, ahogyan szinteket lépsz. A jelenlegi szinteden az íjadból lőtt nyilak _%1$d-%2$d sebzést_ okoznak, és _%3$d erő_ szükséges a megfelelő használatukhoz.
items.weapon.spiritbow.desc=Egy íj, amely ősi, mágikus fából készült. Az íj húrja és a metszetei sápadt kék fénnyel világítanak. Ha a húrt megfeszítik, az íj egy mágikus nyilat varázsol, amely az ellenségre lőhető.
items.weapon.spiritbow.discover_hint=Az egyik hős ezzel a tárggyal indul.

items.weapon.weapon.identify=Már eléggé kiismerted a fegyvered, hogy teljesen azonosítsd.
items.weapon.weapon.too_heavy=Mivel nem vagy elég erős ehhez a fegyverhez, kisebb lesz vele a támadásod sebessége és pontossága, és rontja a képességed az ellenségek meglepésére.
items.weapon.weapon.excess_str=A magas erődnek köszönhetően legfeljebb akár _0-%d bónuszsebzést_ okozhatsz ezzel a fegyverrel.
items.weapon.weapon.hardening_gone=Ennek a fegyvernek a keményítése lekopott!
items.weapon.weapon.incompatible=A különböző mágiák kölcsönhatása miatt eltűnt ennek a fegyvernek a bűvölete!
items.weapon.weapon.cursed_worn=Mivel ezt a fegyvert megátkozták, nem bírod levenni.
items.weapon.weapon.cursed=Rosszindulatú mágiát érzel megbújni a fegyverben.
items.weapon.weapon.weak_cursed=Az átok ellenére képes vagy levenni ezt a fegyvert.
items.weapon.weapon.not_cursed=Ez a fegyver rosszindulatú mágiától mentes.
items.weapon.weapon.faster=A _sebesség_ fokozása irányába bővítve.
items.weapon.weapon.stronger=A _sebzés_ fokozása irányába bővítve.
items.weapon.weapon.enchanted=a fegyveren _%s_ van.
items.weapon.weapon.enchant_hardened=Ez már _keményített._
items.weapon.weapon.hardened_no_enchant=Ezt a fegyvert _keményítették_, de jelenleg nincs megbűvölve.
items.weapon.weapon$enchantment.enchant=bűvölet
items.weapon.weapon$enchantment.rankings_desc=Bűvölet végzett vele
items.weapon.weapon$enchantment.discover_hint=Véletlenszerűen találhatsz egy ilyen hatású tárgyat a kazamatában, vagy megpróbálhatod magad is alkalmazni egy tárgyra.


###misc items
items.amulet.name=yendor amulettje
items.amulet.ac_end=BEFEJEZEM A JÁTÉKOT
items.amulet.desc=A Yendor amulettje a legerősebb ereklye, amelyet az emberi vagy törpe faj ismer. Csillogó kristályai hihetetlen és csodálatos erőt rejtenek.
items.amulet.desc_origins=Az amulett eredete ismeretlen. A történelem szerint a törpék királya azzal dicsekedett, hogy felfedezte az ereklyét, nem sokkal azelőtt, hogy a törpecivilizáció megszakított minden kapcsolatot. Hogyan találta meg? Hogyan vette el tőle Yog-Dzewa? Talán máskorra való kérdések, most csak az számít, hogy az amulett a tiéd!
items.amulet.desc_ascent=Az amulett eredete ismeretlen, de nyilvánvaló, hogy Yog-Dzewa ereje nagymértékben befolyásolta. Úgy tűnik, hogy a kazamata Yog akaratához idomul, ahogy haladsz rajta keresztül, és az ellenségek sokkal bőségesebbek és erősebbek lesznek! Az amulettet többé nem tudod aktiválni vagy eldobni, szinte mintha el lenne átkozva.
items.amulet.ascent_title=Felfelé haladás
items.amulet.ascent_desc=Kezded érezni, hogy Yog-Dzewa nagy és rettenetes ereje sugárzik az amulettből. Halandóként felmenni a kazamatából nehezebb lehet, mint gondoltad!\n\nHa az amulettel folytatod a felfelé haladást, a kazamata egyre veszélyesebbé válik. Az emeletek közötti teleportok nem lesznek elérhetőek, és csak úgy nyerheted meg a játékot, ha felfelé haladva legyőzöd az ellenséget!\n\nAz amulettet egyelőre itt hagyhatod, ha a kihívás megkezdése nélkül szeretnél feljutni. Másrészt működésbe is hozhatod az amulettet a feljutás előtt, hogy a szokásos módon fejezd be a játékot.
items.amulet.ascent_yes=Folytatás!
items.amulet.ascent_no=Egyelőre ennyi
items.amulet.discover_hint=Ezt a tárgyat a kazamata alján találod…

items.ankh.name=ankh
items.ankh.ac_bless=MEGÁLD
items.ankh.bless=Megszenteled az ankhot mágikus vízzel.
items.ankh.desc=A halhatatlanságnak ez az ősi szimbóluma a halál utáni visszatérés képességét biztosítja. A legtöbb tárgyat ott veszíted el, ahol meghaltál, de visszaszerezhető, ha visszatérsz hozzá. Egy teli vizestömlő segítségével az ankh többleterővel áldható meg.
items.ankh.desc_blessed=A halhatatlanságnak ez az ősi szimbóluma képes visszaadni az elhunyt életét. Ez az ankh áldott, ettől sokkal erősebbé vált. A halálos vész pillanatában feláldozza magát, hogy megmentsen.
items.ankh.discover_hint=Ezt a tárgyat egy boltban vásárolhatod meg.

items.arcaneresin.name=misztikus gyanta
items.arcaneresin.prompt=Válassz egy pálcát
items.arcaneresin.ac_apply=BEVON
items.arcaneresin.level_too_high=Ez a pálca túl erős ahhoz, hogy a gyanta javítani tudjon rajta.
items.arcaneresin.not_enough=Nincs elég gyantád ehhez!
items.arcaneresin.apply=Bevonod a varázspálcád gyantával, és megnöveled az erejét!
items.arcaneresin.desc=Ez a finom por a lila és a fehér árnyalataiban csillog. Fel lehet vele erősíteni a mágikus energiákat, és megnövelheted egy pálca szintjét, ha bevonod vele!\n\nEgy pálca felfejlesztése 1, 2 vagy 3 gyantába kerül a pálca eredeti szintjétől függően. A gyantával legfeljebb +3 szintre lehet fejleszteni a pálcákat.\n\nA gyantafejlesztéseket azonban _más fejlesztések felülírják_ (például a fejlesztéstekercs), és nem érvényesülnek, amikor a pálcát a mágus botjába oltják.
items.arcaneresin.discover_hint=Ezt a tárgyat alkímia segítségével készítheted el.

items.brokenseal.name=törött pecsét
items.brokenseal.ac_affix=FELTŰZ
items.brokenseal.prompt=Válassz egy páncélt
items.brokenseal.unknown_armor=Először is meg kell állapítanod, hogy az a páncél elátkozott-e vagy sem.
items.brokenseal.cursed_armor=A pecsétet nem tűzheted elátkozott páncélra.
items.brokenseal.affix=Feltűzted a pecsétet a páncélodra!
items.brokenseal.desc=Egy viaszpecsét, amelyet a páncélra erősítettek a bátorság szimbólumaként. Közepére egy kifakult védelmező rúna van vésve, és középen ketté van törve.\n\nA pecsét a harcos otthonából származó emlék, amely segít a harcosnak kitartani. A pecsét viselése közben a harcos azonnal egy védőburkot kap, amikor az életereje a felére vagy az alá csökken.\n\nA pecsét _feltűzhető egy páncélra_, és páncélok között mozgatható. Egyetlen fejlesztést hordozhat magában, amennyiben azt a fejlesztést a páncélra alkalmazták, miközben a pecsét rajta volt.
items.brokenseal.inscribed=A pecsétre _%s_ van vésve.
items.brokenseal.choose_title=Válassz egy varázsjelet
items.brokenseal.choose_desc=Ez a páncél és a törött pecsét is hordoz egy-egy varázsjelet. Válaszd ki, melyik varázsjel maradjon meg!\n\nPáncél varázsjele: %1$s\nTörött pecsét varázsjele: %2$s\n\nVedd figyelembe, hogy ha azt a varázsjelet választod, mint ami jelenleg a páncélon van, akkor azt később a pecséttel együtt nem tudod áthelyezni.
items.brokenseal.discover_hint=Az egyik hős ezzel a tárggyal indul.
items.brokenseal$warriorshield.name=Harcos védőburok
items.brokenseal$warriorshield.desc_active=A harcos törött pecsétje jelenleg segít neki kitartani, az életereje mellett védőburkot is biztosít neki. A védőburok aktiválódása után van egy várakozási idő, mielőtt újra használható lenne.\n\nEz a védőburok nem gyengül idővel, de megszűnik, ha néhány körig nincsenek ellenségek a közelben. Amikor véget ér, a fel nem használt pajzs csökkenti a várakozási időt, maximum 50%%-ig.\n\nMegmaradt védőburok : %1$d.\n\nJelenlegi várakozási idő: %2$d.
items.brokenseal$warriorshield.desc_cooldown=A harcos nemrégiben védőburkot kapott a törött pecsétjétől, ezért várnia kell, amíg újra élvezheti annak védő hatását.\n\nHátralévő körök: %d.
items.brokenseal$warriorshield.desc_negative_cooldown=A harcos pajzsának várakozási ideje jelenleg negatív, ami azt jelenti, hogy amikor a pajzs aktiválódik, a várakozási idő a szokásos 150 fordulónál rövidebb lesz. A pajzs várakozási ideje akár -150 fordulóra is csökkenthető, ami azt jelenti, hogy aktiválása után azonnal ismét használhatóvá válik.\n\nJelenlegi várakozási idő: %d.

items.dewdrop.name=harmatcsepp
items.dewdrop.already_full=Teljesen egészséges vagy!
items.dewdrop.desc=Kristálytiszta harmatcsepp\n\nEzen az elvarázsolt helyen a tiszta víz kis gyógyhatással is bír.

items.equipableitem.curse_detected=Még mielőtt felvennéd a tárgyat, már érzed is, hogy az el van átkozva!
items.equipableitem.unequip_cursed=Nem veheted le a megátkozott holmit!
items.equipableitem.ac_equip=VISEL
items.equipableitem.ac_unequip=LEVESZ

items.energycrystal.name=energiakristály
items.energycrystal.desc=Kis mágikus kristályok gyűjteménye, tele alkímiai energiával.\n\nEzek a kristályok a leggyakoribb összetevői az alkímiai recepteknek. Egy alkimista üstben állíthatók elő fogyóeszközök bezúzásával.

items.gold.name=aranykupac
items.gold.desc=Egy halom aranypénz. Gyűjtsd az aranyat, hogy később vásárolhass vele.

items.heap.for_sale=%2$s: %1$d arany
items.heap.chest=Láda
items.heap.chest_desc=Nem tudhatod, mi van benne, amíg ki nem nyitod!
items.heap.locked_chest=Lezárt láda
items.heap.locked_chest_desc=Nem tudhatod, mi van benne, amíg ki nem nyitod! A kinyitásához viszont szükséged van egy aranykulcsra.
items.heap.crystal_chest=Kristályláda
items.heap.crystal_chest_desc=Látod, hogy _%s_ van benne, de hogy kinyisd a ládát, szükséged van egy kristálykulcsra.
items.heap.artifact=egy ereklye
items.heap.wand=egy pálca
items.heap.ring=egy gyűrű
items.heap.tomb=Sír
items.heap.tomb_desc=Ez a régi sír talán valami hasznosat rejt, de a gazdája minden bizonnyal tiltakozik ellene, hogy megnézd.
items.heap.skeleton=Csontmaradványok
items.heap.skeleton_desc=Ez minden, ami egy szerencsétlen kalandor után megmaradt. Érdemes lehet megnézni, hátha van közte valami értékes.
items.heap.remains=Egy hős maradványai
items.heap.remains_desc=Ez minden, ami valamelyik elődöd után megmaradt. Érdemes lehet megnézni, hátha van közte valami értékes.

items.honeypot.name=mézesbödön
items.honeypot.ac_shatter=ELTÖR
items.honeypot.desc=Alig van egy kis méz a hatalmas bödönben, viszont egy óriási méh lakik benne! Az ilyen nagytestű méhek általában nem hagyják el a kaptárukat. Lehet, hogy ezt a példányt egy csapdakészítő-mester fogta be? A méh jól elvan a bödönben a mézével, de visszafogottan zümmög, amikor csak ránézel.
items.honeypot$shatteredpot.name=törött mézesbödön
items.honeypot$shatteredpot.desc=A bödön eltört, csupán a falán lévő ragacsos méz tartja össze, de lassan szétesik.\n\nHiába tört el, a méh még mindig védeni szeretné a bödönt.

items.item.prompt=Válaszd ki, merre dobod
items.item.ac_drop=LERAK
items.item.ac_throw=ELDOB
items.item.rankings_desc=Megölte: %s.
items.item.curse=átok
items.item.custom_note_type=Ehhez a tárgytípushoz tartozik egy jegyzet: „_%s_”
items.item.custom_note=Ez a tárgy jegyzettel rendelkezik: „_%s_”
items.item.discover_hint=Ezt a tárgyat véletlenszerűen találhatod meg a kazamatában.

items.kindofmisc.unequip_title=Egy felszerelés levétele
items.kindofmisc.unequip_message=Először le kell venned egyet ezekből a felszerelésekből. Válassz ki valamit, amivel kicseréled.

items.kindofweapon.swift_equip=Gyorsan kézbe veszed a fegyvered.
items.kindofweapon.equip_cursed=A markod akaratlanul a fegyverre szorul.
items.kindofweapon.which_equip_msg=Melyik fegyverrekeszben szeretnéd viselni ezt a tárgyat?\n\nA bajnok közvetlenül az elsődleges fegyverével támad, de bármelyik fegyver képességét használhatja. Mindkét fegyver azonos töltésszámmal rendelkezik.\n\nA bajnok azonnal cserélheti elsődleges és másodlagos fegyverét is.
items.kindofweapon.which_equip_primary=Elsődleges (%s)
items.kindofweapon.which_equip_secondary=Másodlagos (%s)
items.kindofweapon.empty=üres

items.kingscrown.name=Törpekirály koronája
items.kingscrown.ac_wear=FELVESZ
items.kingscrown.naked=Sajnos a korona nem tudja átalakítani az alsóneműdet.
items.kingscrown.upgraded=A korona fényesen ragyog, majd szétporlad, ahogy a páncélod átalakul!
items.kingscrown.ratgraded=A patkánykirály mancsai fényesen világítanak, ahogy a páncélod átalakul!
items.kingscrown.desc=Az utolsó törpekirály koronája hatalmas mágikus energiával ragyog.\n\nAmikor felveszed, a korona mágiája átáramlik a páncélba, amelyet jelenleg viselsz, és _különleges képességekkel bíró egyedi, legendás páncéllá_ változtatja. Az új páncél megtartja az eredeti páncél összes tulajdonságát.
items.kingscrown.discover_hint=Ezt a tárgyat bizonyos ellenségektől kaphatod.

items.liquidmetal.name=folyékony fém
items.liquidmetal.ac_apply=BEVON
items.liquidmetal.prompt=Válassz egy dobófegyvert
items.liquidmetal.already_fixed=Ez a dobófegyver már tökéletes állapotban van!
items.liquidmetal.apply=%d folyékony fémet használsz a dobófegyvered javításához.
items.liquidmetal.desc=Ez a mágikus folyadék kitölti a használat során keletkezett repedéseket és kopásokat egy dobófegyveren, és tökéletes állapotba hozza a fegyvert! Ha egy fegyverkészletnek hiányzik egy darabja, de egyébként teljesen megjavított, akkor a folyékony fém akár a készletből hiányzó fegyver pótlására is használható!\n\nEgy 1-es követelményszintű fegyver teljes javításához 10 folyékony fémre van szükség, egy 5-ös szintű fegyverhez 30-ra. Minden egyes fejlesztés 35%-kal növeli a szükséges fém mennyiségét.\n\nA folyékony fém nem használható a bevonatos dárdák hegyeinek javítására.
items.liquidmetal.discover_hint=Ezt a tárgyat alkímia segítségével készítheted el.

items.lostbackpack.name=elveszett hátizsák
items.lostbackpack.desc=Ez az elveszett hátizsákod. Vedd fel, hogy visszakapd az összes elveszett tárgyadat!

items.merchantsbeacon.name=kereskedő jelzőfénye
items.merchantsbeacon.ac_use=HASZNÁL
items.merchantsbeacon.desc=A törpetechnológia eme ritka darabjának segítségével nagy távolságból is lehet kommunikálni.\n\nHa működésbe hozod a jelzőfényt, lehetővé teszi, hogy tárgyakat adj el a Pixelboltnak, bárhol is vagy a kazamatákban.\n\nA jelzőfény mágikus ereje viszont csak egy használatra elegendő, ezért használd bölcsen.

items.stylus.name=misztikus karctű
items.stylus.ac_inscribe=VÉS
items.stylus.prompt=Válassz egy páncélt
items.stylus.identify=Először azonosítanod kell, hogy a páncél el van-e átkozva.
items.stylus.cursed=A karctű mágiája nem működik átkozott páncélon.
items.stylus.inscribed=Varázsjelet véstél a páncélodra a karctűvel.
items.stylus.desc=A misztikus karctű nagyon kemény, sötét kőből készült. Varázsjelet véshetsz vele a páncélodra, de nincs hatalmad afölött, hogy milyen varázsjelet, ezt a tű dönti el helyetted.

items.tengusmask.name=Tengu maszkja
items.tengusmask.ac_wear=FELVESZ
items.tengusmask.used=A maszk szétporlad, ahogy az ereje átáramlik beléd!
items.tengusmask.desc=Ez a maszk esett le Tengu arcáról, amikor meghalt. Nagy mágikus erőt érzel sugározni belőle. Lehet, hogy a maszkban volt Tengu ereje?\n\nViselésekor a maszk hatalmas ereje átkerül beléd, és lehetővé teszi, hogy _válassz egy alosztályt a hősödnek._\n\nMelyik alosztályt választod?
items.tengusmask.discover_hint=Ezt a tárgyat bizonyos ellenségektől kaphatod.

items.torch.name=fáklya
items.torch.ac_light=MEGGYÚJT
items.torch.desc=Alapvető kalandozási tudnivaló, hogy ha a kazamata sötétbe borul, egy fáklya utat mutathat.

items.waterskin.name=vizestömlő
items.waterskin.ac_drink=ISZIK
items.waterskin.collected=Begyűjtöd a harmatcseppet a vizestömlődbe.
items.waterskin.full=A vizestömlőd tele van!
items.waterskin.empty=A vizestömlőd üres!
items.waterskin.desc=Bőrből és zsinegből készült folyadéktartály, amely parafa dugóval van lezárva.
items.waterskin.desc_water=Jelenleg a vizestömlő csak sima ivóvizet tartalmaz. Bizonyára van valami a kazamatában, amit a vizestömlő elraktározhatna helyette.
items.waterskin.desc_heal=A vizestömlőt jelenleg gyógyvíz tárolására használják. Minél több víz van benne, annál többet gyógyulsz, amikor iszol belőle. Csak annyit iszol, amennyire szükséged van.
items.waterskin.desc_full=Úgy tűnik, hogy a teli vizestömlő energiát sugároz, talán fel lehet használni egy másik túlélőtárgy megáldására?
items.waterskin.discover_hint=Az egyik hős ezzel a tárggyal indul.

