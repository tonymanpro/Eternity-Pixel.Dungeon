###armor curses
items.armor.curses.antientropy.name=Antientropikus %s
items.armor.curses.antientropy.desc=Az antientrópia-átok az univerzum erői ellen hat, energiát vonva el a környezetétől, amelyet átad a viselőjének. Ez rövid időre lángra lobbantja viselőjét, de mindent megfagyaszt körülötte!

items.armor.curses.bulk.name= Terebélyes %s
items.armor.curses.bulk.desc=A terebélyes páncél nagyobbnak és impozánsabbnak tűnik, de valójában nem nyújt erősebb védelmet. A legrosszabb viszont az, hogy a nagyobb méret megnehezíti az ajtókon való áthaladást.

items.armor.curses.corrosion.name=maró %s
items.armor.curses.corrosion.desc=A marópáncél időnként maró váladékot spriccel, és mindent ragacsos, savas lével terít be a területen.

items.armor.curses.displacement.name=tovatevő %s
items.armor.curses.displacement.desc=A tovatevő átok támadáskor megpróbálja a páncél viselőjét biztonságos helyre teleportálni. A benne lévő erő azonban túl vad, így a használóját a szint egy véletlenszerű pontjára teleportálja.

items.armor.curses.metabolism.name=Anyagcserés %s
items.armor.curses.metabolism.desc=Amikor a páncél viselőjét megsebzik, az anyagcsereátok a jóllakottságot közvetlenül átalakítja életerővé. Így gyorsabban gyógyul, de hamarabb megéhezik.

items.armor.curses.multiplicity.name=Tükröző %s
items.armor.curses.multiplicity.desc=A tükröző átokkal sújtott páncél veszélyes kettőző mágiát hordoz. Olykor a viselője tükörképét idézi meg, de éppúgy megtörténhet, hogy a támadót klónozza!

items.armor.curses.overgrowth.name=Burjánzó %s
items.armor.curses.overgrowth.desc=A burjánzó páncélt különféle virágzó növények borítják. Bár ez tényleg érdekesen néz ki, nem ad semmit a védelemhez, ráadásul időnként a növények csak úgy kifejtik a hatásukat harc közben!

items.armor.curses.stench.name=Fullasztó %s
items.armor.curses.stench.desc=A fullasztó átokkal rendelkező páncél ártalmas gázfelhőt bocsájt ki magából, ami minden benne rekedtre veszélyes.


###glyphs
items.armor.glyphs.affection.name=megnyerő %s
items.armor.glyphs.affection.desc=Ez az erőteljes varázsjel a támadók elméjét manipulálva egy időre elbűvöli őket.

items.armor.glyphs.antimagic.name=mágiaellenes %s
items.armor.glyphs.antimagic.desc=Ennek az erőteljes varázsjelnek köszönhetően a páncél éppúgy védi viselőjét a mágikus támadásokkal szemben, mint a fizikaiakkal szemben. Ezt a mágikus védelmet nem befolyásolja a páncél követelményszintje.

items.armor.glyphs.brimstone.name=kénköves %s
items.armor.glyphs.brimstone.desc=Ez a varázsjel megvédi a viselőt és a tárgyait a tűztől, teljesen kiküszöbölve a tűztől elszenvedett sérülést és negatív hatásokat.

items.armor.glyphs.camouflage.name=elrejtő %s
items.armor.glyphs.camouflage.desc=A varázsjelnek köszönhetően a viselője belesimul a magas fűbe, átmenetileg láthatatlanná téve őt.

items.armor.glyphs.entanglement.name=háncsosodó %s
items.armor.glyphs.entanglement.desc=Ez a varázsjel agyagpáncélt növeszt a viselője köré, hogy elnyelje a sérüléseket, de ez a páncél széthullik, amint a viselője megmozdul.

items.armor.glyphs.flow.name=áramló %s
items.armor.glyphs.flow.desc=Ez a varázsjel irányítja a víz folyását a páncél viselője körül, aki így a vízen át gyorsabban tud mozogni.

items.armor.glyphs.obfuscation.name=homály %s
items.armor.glyphs.obfuscation.desc=Ez a varázsjel homályba burkolja a viselőjét, akit így nehezebb észrevenni.

items.armor.glyphs.potential.name=elektromos %s
items.armor.glyphs.potential.desc=Ez a varázsjel energiát halmoz fel, ha ütés éri, ami tölti a varázspálcád.

items.armor.glyphs.repulsion.name=visszalökő %s
items.armor.glyphs.repulsion.desc=Ez a varázsjel visszafordítja a csapás erejét a támadóra, aki ettől hátraesik.

items.armor.glyphs.stone.name=köves %s
items.armor.glyphs.stone.desc=Ez a varázsjel nehéz mágikus kövekkel öleli körbe a páncélt, ami a kitérést lehetetlenné teszi, viszont a kijátszással arányosan blokkolja a sérülést.

items.armor.glyphs.swiftness.name=fürge %s
items.armor.glyphs.swiftness.desc=Ez a varázsjel megnöveli a viselője sebességét, amikor nincs ellenség közelében.

items.armor.glyphs.thorns.name=tüskés %s
items.armor.glyphs.thorns.desc=Ez az erőteljes varázsjel megsérti a támadókat, és lassú vérzést okoz, amikor megtámadják a viselőjét.

items.armor.glyphs.viscosity.name=viszkóz %s
items.armor.glyphs.viscosity.deferred=%d késleltetve
items.armor.glyphs.viscosity$defereddamage.name=késleltetett sebzés
items.armor.glyphs.viscosity$defereddamage.ondeath=Megölt a késleltetett sebzés...
items.armor.glyphs.viscosity$defereddamage.rankings_desc=Belehalt a késleltetett sebzésbe
items.armor.glyphs.viscosity$defereddamage.desc=A sérülés nem azonnal, hanem lassan, időben elnyújtva érvényesül.\n\n%d késleltetett sebzés maradt hátra.
items.armor.glyphs.viscosity.desc=Ez a varázsjel képes eltárolni a viselőjére mért sérülést, és azt apránként adja át, nem pedig egyszerre.



###armor
items.armor.armor.ac_detach=LETŰZÖM
items.armor.armor.detach_seal=Letűzted a pecsétet a páncélról.
items.armor.armor.equip_cursed=A páncél fájdalmasan rádszorul.
items.armor.armor.identify=Most már elég jól kiismerted a páncélod, hogy teljesen azonosítsd.
items.armor.armor.hardening_gone=Ennek a páncélnak a keményítése lekopott!
items.armor.armor.incompatible=A különböző mágiák kölcsönhatása letörölte a varázsjelet a páncélról!
items.armor.armor.curr_absorb=Ez egy _%1$d. követelményszintű_ páncél, amely _%2$d-%3$d sérülést_ blokkol, és _%4$d erő_ szükséges a megfelelő használatához.
items.armor.armor.avg_absorb=Ez egy _%1$d. követelményszintű_ páncél, amely jellemzően _%2$d-%3$d sérülést_ blokkol, és _%4$d erő_ szükséges a megfelelő használatához.
items.armor.armor.too_heavy=Mivel nem vagy elég erős ehhez a páncélhoz, romlik a mozgási, kijátszási és védekezőképességed.
items.armor.armor.probably_too_heavy=Ez a páncél valószínűleg túl nehéz neked.
items.armor.armor.excess_str=A nagyobb erődnek köszönhetően ebben a páncélban _könnyebben térsz ki_ a támadások elől.
items.armor.armor.evasion=Ennek a páncélnak _kijátszást_ megnövelő bővítése van.
items.armor.armor.defense=Ennek a páncélnak _védelmet_ megnövelő bővítése van.
items.armor.armor.inscribed=Erre a páncélra _%s_ van vésve.
items.armor.armor.glyph_hardened=Ez a páncél már _keményített._
items.armor.armor.hardened_no_glyph=Ez a páncél már _keményített,_ de még nincs rajta varázsjel.
items.armor.armor.cursed_worn=Nincs hatalmad levenni ezt a páncélt, mert meg van átkozva.
items.armor.armor.cursed=Rosszindulatú mágiát érzel megbújni a páncélban.
items.armor.armor.weak_cursed=Az átok ellenére képes vagy levenni ezt a páncélt.
items.armor.armor.not_cursed=Ez a páncél rosszindulatú mágiától mentes.
items.armor.armor.seal_attached=A harcos törött pecsétje ehhez a páncélhoz van rögzítve. Amikor a harcos életereje a felénél kevesebbre csökken, _%d védőburkot_ garantál neki.
items.armor.armor.seal_transfer=A harcos törött pecsétjét a jelenleg viselt páncéljára kell feltűzni ahhoz, hogy az a hasznára váljon. Szeretnéd automatikusan leválasztani a pecsétet a letűzendő páncélról, és feltűzni a kívánt páncélra?
items.armor.armor.seal_transfer_yes=igen
items.armor.armor.seal_transfer_no=nem
items.armor.armor$glyph.glyph=varázsjel
items.armor.armor$glyph.killed=%s végzett veled...
items.armor.armor$glyph.rankings_desc=Varázsjel ölte meg.
items.armor.armor$glyph.discover_hint=Véletlenszerűen találhatsz egy ilyen hatású tárgyat a kazamatában, vagy megpróbálhatod magad is alkalmazni egy tárgyra.

items.armor.classarmor.ac_ability=KÉPESSÉG KIVÁLASZTÁSA
items.armor.classarmor.ac_transfer=ÁTVITEL
items.armor.classarmor.no_ability=A páncélodnak még nincs semmilyen képessége, választanod kell egyet!
items.armor.classarmor.not_equipped=Fel kell venned a páncélt, hogy használhasd a különleges erejét!
items.armor.classarmor.low_charge=A páncélnak nincs elegendő töltése, hogy használhasd a különleges erejét!
items.armor.classarmor.charge_use=A képesség mostani használata _%s_ töltést fogyaszt.
items.armor.classarmor.transfer_title=Páncél Átvitele
items.armor.classarmor.transfer_desc=A törpekirály koronájának mágiája átvihető egy másik páncélra. Ne feledd, hogy az eredeti páncél megsemmisül a folyamat során.
items.armor.classarmor.transfer_prompt=Válassz egy Páncélt
items.armor.classarmor.transfer_cancel=Mégse
items.armor.classarmor.transfer_complete=A hősi páncélod tulajdonságai átkerültek!
items.armor.classarmor.discover_hint=Ezt a tárgyat a 20. emeleti főellenség legyőzése után találhatod meg egy adott hőssel.

items.armor.clericarmor.name=hősi miseruha
items.armor.clericarmor.desc=E ruhából és páncélból összeállított öltözetet viselve a térítő végre tud hajtani egy különleges képességet.

items.armor.clotharmor.name=szövetpáncél
items.armor.clotharmor.desc=Ez a könnyű páncél alapszintű védelmet nyújt.
items.armor.clotharmor.discover_hint=Az egyik hős ezzel a tárggyal indul.

items.armor.duelistarmor.name=hős mellvértje
items.armor.duelistarmor.desc=Amíg ezt a lemezpáncélt és köpenyt viseli, a párbajhős végre tud hajtani egy különleges képességet.

items.armor.huntressarmor.name=hősi köpeny
items.armor.huntressarmor.no_enemies=Nem látsz ellenséget
items.armor.huntressarmor.desc=Amíg ezt a köpenyt viseli, a vadásznő végre tud hajtani egy különleges képességet.

items.armor.leatherarmor.name=bőrvért
items.armor.leatherarmor.desc=Egy szörny cserzett bőréből készült páncél. Nem olyan könnyű, mint a szövetpáncél, de nagyobb védelmet nyújt.

items.armor.magearmor.name=hősi palást
items.armor.magearmor.desc=Amíg ezt a gyönyörű palástot viseli, a mágus végre tud hajtani egy különleges képességet.

items.armor.mailarmor.name=sodronying
items.armor.mailarmor.desc=Egymásba fonódó fémkapcsok alkotják ezt a kemény, de rugalmas páncélt.

items.armor.platearmor.name=lemezvért
items.armor.platearmor.desc=Roppant méretű fémlemezekből készült páncél. Páratlan védelmet nyújt bármely kalandornak, aki elbír ilyen elképesztő súlyt.

items.armor.roguearmor.name=hősi öltözék
items.armor.roguearmor.desc=Amíg ezt a sötét öltözéket viseli, a zsivány végre tud hajtani egy különleges képességet.

items.armor.scalearmor.name=pikkelyvért
items.armor.scalearmor.desc=A bőrvértre varrott fémpikkelyekből készült páncél jó védelmet nyújt, mégis rugalmas.

items.armor.warriorarmor.name=hősi vért
items.armor.warriorarmor.desc=Amíg ezt a vastagon páncélozott vértet viseli, a harcos végre tud hajtani egy különleges képességet.



###artifacts
items.artifacts.alchemiststoolkit.name=alkimista készlet
items.artifacts.alchemiststoolkit.ac_brew=FŐZ
items.artifacts.alchemiststoolkit.ac_energize=ENERGIZÁL
items.artifacts.alchemiststoolkit.not_ready=A készlet még nem melegedett fel teljesen.
items.artifacts.alchemiststoolkit.cursed=Az elátkozott készlet meggátol az alkímiában!
items.artifacts.alchemiststoolkit.need_energy=Ehhez legalább 6 energiára van szükséged.
items.artifacts.alchemiststoolkit.energize_desc=Hat-hat energiakristály elegendő energiát ad a készletnek ahhoz, hogy egy-egy szintet lépjen. Ekkor megnő a készlet energiatermelésének és a bemelegedésének a sebessége.\n\nMennyi energiát szeretnél felhasználni?
items.artifacts.alchemiststoolkit.energize_1=6 energia: +1 szint
items.artifacts.alchemiststoolkit.energize_all=%1$d energia: +%2$d szint
items.artifacts.alchemiststoolkit.desc=Ez a szerszámoskészlet számos vegyszert és gyógyfüvet tartalmaz, valamint egy kis vegyítőfiolát, amivel az alkímia útközben is elérhetővé válik. A fiola tartalmaz valamit, amely folyékony halmazállapotú alkimistaenergia-kristálynak tűnik.
items.artifacts.alchemiststoolkit.desc_cursed=A megátkozott készlet az oldaladhoz rögzült, és nem engedi, hogy alkímiát használj.
items.artifacts.alchemiststoolkit.desc_warming=A készlet jelenleg melegszik, és egy kis idő múlva készen áll a használatra.
items.artifacts.alchemiststoolkit.desc_hint=A készlet, amelyet viselsz, lassan alkímiai energiát termel, ahogy tapasztalatot szerzel. Úgy tűnik, hogy a fiolában lévő keveréket energiakristályok hozzáadásával lehet fokozni.

items.artifacts.artifact.cannot_wear_two=Nem viselhetsz két ugyanolyan ereklyét.
items.artifacts.artifact.equip_cursed=Az ereklye fájdalmasan hozzád tapad.
items.artifacts.artifact.curse_known=Rosszindulatú mágiát érzel megbújni ebben az ereklyében.
items.artifacts.artifact.not_cursed=Ez az ereklye rosszindulatú mágiától mentes.
items.artifacts.artifact.need_to_equip=Viselned kell az ereklyédet, hogy ezt megtehesd.

items.artifacts.capeofthorns.name=szilánkköpeny
items.artifacts.capeofthorns.desc=A DM-300 szétroncsolt fémlemezei merev köpenyt alkotnak. Sűrű energia lehet benne, talán van még benne a DM-300 erejéből?
items.artifacts.capeofthorns.desc_inactive=A köpeny biztatóan nehezedik a válladra, és úgy tűnik, az elszenvedett sérülésből energiát nyer.
items.artifacts.capeofthorns.desc_active=A köpeny oltalmazó erőt sugározva bocsátja ki a felgyülemlett energiáját.
items.artifacts.capeofthorns$thorns.inert=A köpenyed újra nyugvó állapotba kerül.
items.artifacts.capeofthorns$thorns.radiating=A köpenyed újra energiát sugároz, védve érzed magad!
items.artifacts.capeofthorns$thorns.levelup=A köpenyed erősebb lett!
items.artifacts.capeofthorns$thorns.name=szilánkok
items.artifacts.capeofthorns$thorns.desc=A köpenyed energiát sugároz, amely erőteret hajlít köréd!\n\nAmíg a szilánkok működésben vannak, az elszenvedett sérülésed egy részét felfogják. Továbbá, ha a támadód melletted áll, a felfogott sebzés visszaszáll rá.\n\nA szilánkok még %s körig működnek.

items.artifacts.chaliceofblood.name=vérkehely
items.artifacts.chaliceofblood.ac_prick=MEGSZÚRÁS
items.artifacts.chaliceofblood.yes=Igen, tudom, mit csinálok
items.artifacts.chaliceofblood.no=Nem, meggondoltam magam
items.artifacts.chaliceofblood.prick_warn=Minden alkalommal, amikor a kelyhet használod, az több életenergiádat vonja el, de cserébe tovább javítja természetes életregeneráló képességedet.\n\nJelenleg a szúrás _%1$d-%2$d sebzést_ okoz, bár ez a sebzés _fizikai és mágikus blokkolással vagy sebzéscsökkentéssel csökkenthető. A sebzéscsökkentő hatások figyelembevétele nélkül a szúrás jelenleg _%3$s%% eséllyel_ teljesen elszívja az életerőd.\n\nBiztosan több életenergiát akarsz felajánlani a kehelynek?
items.artifacts.chaliceofblood.onprick=Megszúrod magad, az életerőd a kehelybe vándorol.
items.artifacts.chaliceofblood.ondeath=A kehely minden életerődet elszívja...
items.artifacts.chaliceofblood.desc=A csillogó ezüstkehely szélét különleges, éles drágakövek díszítik.
items.artifacts.chaliceofblood.desc_cursed=A megátkozott kehely a kezedhez ragad, és meggátolja a természetes gyógyulást.
items.artifacts.chaliceofblood.desc_1=A kelyhet tartva különös kényszert érzel arra, hogy az éles drágakövekkel megszúrd magad.
items.artifacts.chaliceofblood.desc_2=A véred egy része a kehelybe gyűlik, és enyhén érzed, ahogyan a kehely életenergiát táplál beléd, fokozva a természetes regenerálódási képességedet. Még mindig meg akarod vágni magad a kehellyel, annak ellenére, hogy tudod, hogy fájni fog.
items.artifacts.chaliceofblood.desc_3=A kehely színültig megtelt az életesszenciáddal. Érzed, ahogy a kehely életerőt áraszt vissza beléd.

items.artifacts.cloakofshadows.name=árnyékköpeny
items.artifacts.cloakofshadows.ac_stealth=LOPAKODÁS
items.artifacts.cloakofshadows.cooldown=A köpenyed %d kör múlva nyeri vissza az energiáját.
items.artifacts.cloakofshadows.cursed=Megátkozott köpenyt nem tudsz használni.
items.artifacts.cloakofshadows.no_charge=A köpenyednek nincs elég energiája, így nem tudod még használni.
items.artifacts.cloakofshadows.desc=Felbecsülhetetlenül értékes varázsköpeny, amelyet a zsivány évekkel ezelőtt lopott el a királyi fegyvertárból. Aki magára ölti, az rövid időre teljesen láthatatlanná válik tőle.\n\nMinél többet használják, annál erősebbé válik a köpeny, és a zsivány egyre gyakrabban és egyre hosszabb időre válhat láthatatlanná.
items.artifacts.cloakofshadows.discover_hint=Az egyik hős ezzel a tárggyal indul.
items.artifacts.cloakofshadows$cloakstealth.no_charge=Elfogyott a köpenyed energiája.
items.artifacts.cloakofshadows$cloakstealth.levelup=A köpenyed erősebb lett!
items.artifacts.cloakofshadows$cloakstealth.name=álcázva
items.artifacts.cloakofshadows$cloakstealth.desc=Az árnyékköpenyed láthatatlanságot biztosít, amíg viseled. Addig maradsz álcázva, amíg el nem fogy a köpeny töltése, vagy abba nem hagyod a lopakodást.\n\nAmíg láthatatlan vagy, az ellenségek nem tudnak megtámadni vagy követni téged. Ha fizikai támadást intézel, vagy mágikus hatást idézel elő (például tekerccsel vagy varázspálcával), azonnal megszűnik a láthatatlanságod.\n\nHátralévő körök: %d.

items.artifacts.driedrose.name=elszáradt rózsa
items.artifacts.driedrose.ac_summon=MEGIDÉZEM
items.artifacts.driedrose.ac_direct=UTASÍT
items.artifacts.driedrose.ac_outfit=ÖLTÖZTET
items.artifacts.driedrose.spawned=Már megidézted a kísértetet.
items.artifacts.driedrose.no_charge=A rózsád még nem töltődött fel teljesen.
items.artifacts.driedrose.cursed=A megátkozott rózsát nem tudod használni.
items.artifacts.driedrose.no_space=Nincs szabad hely a közeledben.
items.artifacts.driedrose.charged=A rózsa teljesen feltöltődött!
items.artifacts.driedrose.desc=Ez lenne a rózsa, amelyet a kísértet említett, mielőtt eltűnt? Mintha valamiféle spirituális erő lenne benne, talán lehetne vele mozgósítani annak az elbukott harcosnak az energiáját.
items.artifacts.driedrose.desc_no_quest=Egy régi, elszáradt rózsa, amely kora ellenére mégis valahogy egyben maradt.\n\nVan benne valamiféle spirituális erő, de fogalmad sincs még, hogyan használhatnád.
items.artifacts.driedrose.desc_hint=Úgy tűnik, hiányzik néhány szirma. Ha vissza tudnád tűzni őket, a rózsa talán visszanyerné az erejét.
items.artifacts.driedrose.desc_cursed=A megátkozott rózsa a kezedhez tapad, hátborzongatóan hidegnek érzed.
items.artifacts.driedrose.desc_weapon=A kísértet fegyvere: %s.
items.artifacts.driedrose.desc_armor=A kísértet páncélja: %s.
items.artifacts.driedrose.desc_strength=A kísértet ereje: %s.
items.artifacts.driedrose$petal.name=elszáradt szirom
items.artifacts.driedrose$petal.no_rose=Nincs rózsád, amelyre ráilleszthetnéd a szirmot.
items.artifacts.driedrose$petal.no_room=Ez a szirom már nem fér el sehova, úgyhogy eldobod.
items.artifacts.driedrose$petal.maxlevel=A rózsa újra teljes!
items.artifacts.driedrose$petal.levelup=Ráilleszted a szirmot a rózsára.
items.artifacts.driedrose$petal.desc=Törékeny, elszáradt szirom, amely valahogy mindeddig átvészelte a kazamatákat.
items.artifacts.driedrose$wndghosthero.title=A kísértet felszerelése
items.artifacts.driedrose$wndghosthero.desc=A kísértet önmagában elég gyenge, de a teste elég szilárd ahhoz, hogy fegyvert és páncélt tudjon viselni. Éppúgy tudja viselni ezeket a felszereléseket, akárcsak te.\n\nA kísértet olyan tárgyakat tud felvenni, amelyek legfeljebb _%d erőt_ igényelnek.
items.artifacts.driedrose$wndghosthero.weapon_prompt=Válassz egy fegyvert
items.artifacts.driedrose$wndghosthero.armor_prompt=Válassz egy páncélt
items.artifacts.driedrose$wndghosthero.cant_unique=A kísértet nem tud különleges tárgyat használni.
items.artifacts.driedrose$wndghosthero.cant_cursed=A szellem csak olyan felszerelést használhat, amelyről biztosan tudod, hogy nem átkozott.
items.artifacts.driedrose$wndghosthero.cant_strength_unknown=A szellem nem biztos, hogy elég erős ahhoz, hogy tudja ezt használni.
items.artifacts.driedrose$wndghosthero.cant_strength=A kísértet nem elég erős ahhoz, hogy használni tudja ezt.

##ghost hero
items.artifacts.driedrose$ghosthero.name=bánatos kísértet
items.artifacts.driedrose$ghosthero.def_verb=elhajolt
items.artifacts.driedrose$ghosthero.discover_hint=Ezt a karaktert egy bizonyos ereklye segítségével találhatod meg.

items.artifacts.driedrose$ghosthero.hello=Üdv újra, %s.
items.artifacts.driedrose$ghosthero.introduce=A lelkem ehhez a rózsához van láncolva. Nagyon sokat jelentett nekem, a szerelmemtől kaptam, akit a felszínen hagytam.\n\nMár nem térhetek vissza hozzá, de hála neked, kaptam még egy esélyt, hogy bevégezzem az utam. Ha tudok, a hívásodra jönni fogok, és harcolok melletted.\n\nAmeddig nálad a rózsa, hallom a hangod, és általa távolról is parancsolhatsz nekem.\n\nRemélem, sikerrel jársz ott, ahol én elbuktam...

items.artifacts.driedrose$ghosthero.dialogue_sewers_1=A csatornák valaha biztonságosak voltak, még emberek is éltek itt télen.
items.artifacts.driedrose$ghosthero.dialogue_sewers_2=Vajon mi történt az őrjáratokkal, feladhatták?
items.artifacts.driedrose$ghosthero.dialogue_sewers_3=A családom a felszínen van, remélem biztonságban vannak.
items.artifacts.driedrose$ghosthero.dialogue_sewers_4=Az őrök nem bírták feltartóztatni ezeket a szörnyeket, de talán nekünk sikerül.
items.artifacts.driedrose$ghosthero.dialogue_sewers_5=Ha még a csatornák is ilyen veszélyesek, mi lehet alattunk...
items.artifacts.driedrose$ghosthero.dialogue_sewers_6=Mi lehet az oka, hogy ezek a patkányok és rákok ilyen nagyra nőttek?
items.artifacts.driedrose$ghosthero.dialogue_prison_1=Hallottam történeteket erről a helyről, egyik se volt jó kicsit se.
items.artifacts.driedrose$ghosthero.dialogue_prison_2=Ez a hely mindig is inkább kazamata volt, mint börtön.
items.artifacts.driedrose$ghosthero.dialogue_prison_3=Elképzelni sem tudom, milyen volt ez a hely, amikor még elhagyatott volt.
items.artifacts.driedrose$ghosthero.dialogue_prison_4=Úgy látszik, a rabok és a börtönőrök is szörnyekké változtak.
items.artifacts.driedrose$ghosthero.dialogue_prison_5=Vajon mi lehet az, ami miatt ilyen sok csontváz van itt?
items.artifacts.driedrose$ghosthero.dialogue_prison_6=Ezeknek az embereknek nem kellett volna így végezniük...
items.artifacts.driedrose$ghosthero.dialogue_caves_1=Sem ember, sem törpe nem járt erre hosszú ideje.
items.artifacts.driedrose$ghosthero.dialogue_caves_2=Mi kényszeríthette a törpéket, hogy elhagyjanak egy aranybányát?
items.artifacts.driedrose$ghosthero.dialogue_caves_3=Milyen kár, hogy ez a sok arany, amely idelent van, semmire sem használható odafent.
items.artifacts.driedrose$ghosthero.dialogue_caves_4=Az itteni a teremtmények éppoly eltorzultak, mint a csatornákban lévők.
items.artifacts.driedrose$ghosthero.dialogue_caves_5=Még a denevérek is vérszomjasak errefelé.
items.artifacts.driedrose$ghosthero.dialogue_caves_6=Sehol semmilyen bányászfelszerelés, vajon a törpék mindet elvihették?
items.artifacts.driedrose$ghosthero.dialogue_city_1=A törpék szorgalmasak voltak, de kapzsik is.
items.artifacts.driedrose$ghosthero.dialogue_city_2=Tehát a törpék metropolisza valóban elbukott.
items.artifacts.driedrose$ghosthero.dialogue_city_3=Remélem, a felszín sosem jár úgy, mint ez a hely.
items.artifacts.driedrose$ghosthero.dialogue_city_4=A törpék nem szoktak ilyen sápadtak lenni.
items.artifacts.driedrose$ghosthero.dialogue_city_5=Nem tudom, mi rosszabb, a törpék, vagy a teremtményeik.
items.artifacts.driedrose$ghosthero.dialogue_city_6=Úgy látszik, mostanra a törpék is lelketlen szörnyekké váltak.
items.artifacts.driedrose$ghosthero.dialogue_halls_1=Mi lehet ez a hely?
items.artifacts.driedrose$ghosthero.dialogue_halls_2=Ez a hely rémisztő...
items.artifacts.driedrose$ghosthero.dialogue_halls_3=Mégis hogyan gondolhatták a törpék, hogy egy ekkora erővel játszadozni lehet?
items.artifacts.driedrose$ghosthero.dialogue_halls_4=Az itteni szörnyek másvilágiak. Honnan érkezhettek?
items.artifacts.driedrose$ghosthero.dialogue_halls_5=Érzed? Olyan, mintha figyelne bennünket valami.
items.artifacts.driedrose$ghosthero.dialogue_halls_6=Hála égnek, hogy vannak fáklyák. Nagyon sötét van itt!
items.artifacts.driedrose$ghosthero.dialogue_ascension_1=Miért történik ez? Hát nem jártunk sikerrel?
items.artifacts.driedrose$ghosthero.dialogue_ascension_2=Hogyan képes az a dolog még mindig befolyásolni ezt a világot?
items.artifacts.driedrose$ghosthero.dialogue_ascension_3=Remélem tudod, mit csinálsz azzal az amulettel!
items.artifacts.driedrose$ghosthero.dialogue_ascension_4=Azt hiszem, még nem végeztünk teljesen!
items.artifacts.driedrose$ghosthero.dialogue_ascension_5=Ha már ilyen messzire eljutottunk, csak sikerül majd befejezni!
items.artifacts.driedrose$ghosthero.dialogue_ascension_6=Csak még egy kicsit, és kijutunk innen!

items.artifacts.driedrose$ghosthero.seen_goo_1=Óvakodj a Ragacstól!
items.artifacts.driedrose$ghosthero.seen_goo_2=Sok barátom halt meg emiatt a lény miatt, ideje bosszút állni!
items.artifacts.driedrose$ghosthero.seen_goo_3=Ilyen förtelmes dolog nem érdemel életet!
items.artifacts.driedrose$ghosthero.seen_tengu_1=Egyetlen rab maradt, aki egy halálos orgyilkos. Természetesen...
items.artifacts.driedrose$ghosthero.seen_tengu_2=Csapdába ejtett bennünket!
items.artifacts.driedrose$ghosthero.seen_tengu_3=Horrortörténeteket hallottam erről a maszkról...
items.artifacts.driedrose$ghosthero.seen_dm300_1=Csak a törpék építhettek olyan bányászgépeket, amelyek megölik a betolakodókat.
items.artifacts.driedrose$ghosthero.seen_dm300_2=Ez a dolog hatalmas...
items.artifacts.driedrose$ghosthero.seen_dm300_3=Ez hogyan maradhatott üzemképes ilyen hosszú időn keresztül?
items.artifacts.driedrose$ghosthero.seen_king_1=Amikor azt mondják, a hatalom lezülleszt, erre gondolhatnak.
items.artifacts.driedrose$ghosthero.seen_king_2=Már inkább hulla, mint király.
items.artifacts.driedrose$ghosthero.seen_king_3=A törpék akár a halálba is követik mesterüket.
items.artifacts.driedrose$ghosthero.seen_yog_1=Ú, ez nem néz ki túl jól.
items.artifacts.driedrose$ghosthero.seen_yog_2=Tehát így néz ki egy isten?
items.artifacts.driedrose$ghosthero.seen_yog_3=Ez fájni fog...

items.artifacts.driedrose$ghosthero.defeated_by_enemy_1=Sok sikert...
items.artifacts.driedrose$ghosthero.defeated_by_enemy_2=Most egy kicsit... elfáradtam...
items.artifacts.driedrose$ghosthero.defeated_by_enemy_3=Még visszatérek...
items.artifacts.driedrose$ghosthero.defeated_by_boss_1=Bocsáss meg... sok szerencsét...
items.artifacts.driedrose$ghosthero.defeated_by_boss_2=Fejezd be... nélkülem...
items.artifacts.driedrose$ghosthero.defeated_by_boss_3=Nem... nem tudok...
items.artifacts.driedrose$ghosthero.blessed_ankh_1=Hogyan élted túl ezt?
items.artifacts.driedrose$ghosthero.blessed_ankh_2=Bárcsak nekem is lett volna egy ilyenem...
items.artifacts.driedrose$ghosthero.blessed_ankh_3=Te jó ég! Hogyhogy életben maradtál?
items.artifacts.driedrose$ghosthero.player_killed_1=Ne!...
items.artifacts.driedrose$ghosthero.player_killed_2=Nem tudtam segíteni neki...
items.artifacts.driedrose$ghosthero.player_killed_3=Ne így...

items.artifacts.driedrose$ghosthero.direct_prompt=Mit kell tennem?
items.artifacts.driedrose$ghosthero.directed_follow_1=Rendben, követlek.
items.artifacts.driedrose$ghosthero.directed_follow_2=Mögötted leszek.
items.artifacts.driedrose$ghosthero.directed_follow_3=Követlek...
items.artifacts.driedrose$ghosthero.directed_follow_4=Rendben, menjünk!
items.artifacts.driedrose$ghosthero.directed_follow_5=Fedezlek.
items.artifacts.driedrose$ghosthero.directed_attack_1=Rendben, megtámadom.
items.artifacts.driedrose$ghosthero.directed_attack_2=Elkapom.
items.artifacts.driedrose$ghosthero.directed_attack_3=Támadom...
items.artifacts.driedrose$ghosthero.directed_attack_4=Kapjuk el!
items.artifacts.driedrose$ghosthero.directed_attack_5=Ez az enyém.
items.artifacts.driedrose$ghosthero.directed_position_1=Rendben, tartom ezt a pozíciót.
items.artifacts.driedrose$ghosthero.directed_position_2=Odamegyek, és védekezek.
items.artifacts.driedrose$ghosthero.directed_position_3=Helyváltoztatás...
items.artifacts.driedrose$ghosthero.directed_position_4=Úton vagyok!
items.artifacts.driedrose$ghosthero.directed_position_5=Indulok oda.

items.artifacts.driedrose$ghosthero.desc=Egy rozoga kinézetű túlvilági emberalak. Úgy tűnik, erejét a nálad lévő rózsából nyeri.\n\nÚgy fest, hogy ez a jelentéktelennek tűnő szellem az egyetlen igaz barátod idelent.

##back to artifacts
items.artifacts.etherealchains.name=szellemlánc
items.artifacts.etherealchains.ac_cast=HAJÍT
items.artifacts.etherealchains.rooted=Amíg meg vagy gyökerezve, a láncod nem tud áthúzni!
items.artifacts.etherealchains.no_charge=Nincs elég energia a tündérláncodban.
items.artifacts.etherealchains.cursed=A megátkozott tündérláncot nem tudod használni.
items.artifacts.etherealchains.does_nothing=Ez nem fog működni.
items.artifacts.etherealchains.cant_pull=A láncod ezt a célpontot nem tudja elhúzni.
items.artifacts.etherealchains.cant_reach=A láncod nem ér el oda.
items.artifacts.etherealchains.inside_wall=A láncod át tud húzni a falon, de nem bele a falba.
items.artifacts.etherealchains.nothing_to_grab=Nincs itt semmi, amihez fogódzkodhatnál.
items.artifacts.etherealchains.prompt=Célozz valahová.
items.artifacts.etherealchains.desc=Ebből a nagy, mégis könnyű láncból spirituális energia sugárzik. Segítségével közelhúzhatod magad különböző tereptárgyakhoz, vagy magadhoz húzhatod az ellenségeidet. A lánc a túlvilági eredetének köszönhetően akár a falon is át tud hatolni!
items.artifacts.etherealchains.desc_cursed=A megátkozott lánc az oldaladhoz rögzül, ide-oda lengedezve megpróbál elgáncsolni vagy megkötözni.
items.artifacts.etherealchains.desc_equipped=Az oldaladon lógó lánc lassan felszívja a legyőzött lények lelki energiáját. Minden töltöttségi szint egy újabb láncszemmel növeli a lánc hosszát, így eggyel távolabbi mezőre ér el.
items.artifacts.etherealchains$chainsrecharge.levelup=A láncod erősebb lett!

items.artifacts.holytome.name=szentkönyv
items.artifacts.holytome.ac_cast=SZAVAL
items.artifacts.holytome.no_spell=Jelenleg nem mondhatod el ezt a varázsigét.
items.artifacts.holytome.cursed=Megátkozott szentkönyvet nem tudsz használni.
items.artifacts.holytome.levelup=A szentkönyved erősebb lett!
items.artifacts.holytome.desc=Egy szent könyv, amely segít összpontosítani a térítő isteni mágiáját. A térítő változatos varázsigéket tud elmondani a szentkönyv segítségével.\n\nA szentkönyv folyamatosan egyre erősebb lesz, ahogy a térítő használja, és megnő a maximális töltése, illetve a feltöltődési sebessége.
items.artifacts.holytome.discover_hint=Az egyik hős ezzel a tárggyal indul.

items.artifacts.hornofplenty.name=bőségszaru
items.artifacts.hornofplenty.ac_snack=MAJSZOL
items.artifacts.hornofplenty.ac_eat=ESZIK
items.artifacts.hornofplenty.ac_store=RAKTÁROZ
items.artifacts.hornofplenty.eat=Ettél a szaruból.
items.artifacts.hornofplenty.prompt=Válassz egy ételt
items.artifacts.hornofplenty.no_food=Nincs ennivaló a szaruban!
items.artifacts.hornofplenty.full=A szaru tele van étellel!
items.artifacts.hornofplenty.reject=A szaru nem fogadja el a nyers szelídgyümölcsöt.
items.artifacts.hornofplenty.maxlevel=A szarud elnyelt mindent, amit bírt!
items.artifacts.hornofplenty.levelup=A szaru elnyeli a kapott ételt, és megnő az ereje!
items.artifacts.hornofplenty.feed=A szaru elnyeli a felajánlott ételed.
items.artifacts.hornofplenty.desc=Ebbe a tülökbe nem lehet belefújni, viszont úgy tűnik, hogy a kalandok és a tapasztalatszerzés során feltöltődik élelemmel. Egyesével is elmajszolhatod a tölteteket, vagy addig ehetsz, amíg jól nem laksz.
items.artifacts.hornofplenty.desc_hint=A szaru ereje valószínűleg növelhető, ha ételből energiát nyerhet.
items.artifacts.hornofplenty.desc_cursed=A megátkozott szaru az oldaladhoz rögzült, és úgy tűnik, hogy inkább fogyasztja az ételt, nem pedig előállítja.

items.artifacts.lloydsbeacon.name=lloydjeladó
items.artifacts.lloydsbeacon.ac_zap=LŐ
items.artifacts.lloydsbeacon.ac_set=JELÖL
items.artifacts.lloydsbeacon.ac_return=VISSZATÉR
items.artifacts.lloydsbeacon.no_charge=A jeladódnak most nincs elég energiája.
items.artifacts.lloydsbeacon.tele_fail=A teleportvarázslat nem sikerült.
items.artifacts.lloydsbeacon.prompt=Hova lősz?
items.artifacts.lloydsbeacon.levelup=A jeladód erősebb lett!
items.artifacts.lloydsbeacon.preventing=A hely erős mágikus aurája miatt nem tudod használni a lloydjeladót!
items.artifacts.lloydsbeacon.creatures=A közel álló lények pszichés aurája miatt most nem tudod használni a lloydjeladót.
items.artifacts.lloydsbeacon.return=Sikeresen megjelölted ezt a helyet a lloydjeladóval, most már bármikor visszatérhetsz ide.
items.artifacts.lloydsbeacon.desc=A lloydjeladó egy bonyolult mágikus készülék, amellyel a használója képes irányítani a teleportmágiát. A jeladó viseléskor feltöltődik, ami lehetővé teszi, hogy visszatérj egy előre megjelölt helyre, valamint hogy véletlenszerű teleportmágia-sugarakat lőjj ki belőle. Ez a mágia irányítható egy adott célpontra vagy magára a használójára is.
items.artifacts.lloydsbeacon.desc_set=A jeladóval a Pixel Dungeon %d. szintjének valamelyik pontját jelölted meg.

items.artifacts.masterthievesarmband.name=tolvajmester karszalagja
items.artifacts.masterthievesarmband.ac_steal=LOPOK
items.artifacts.masterthievesarmband.no_charge=A karszalagodnak nincs elég töltése.
items.artifacts.masterthievesarmband.cursed=Nem tudod használni az átkozott karszalagot.
items.artifacts.masterthievesarmband.full=A karszalagod teljesen fel van töltve!
items.artifacts.masterthievesarmband.prompt=Válassz célpontnak egy ellenséget
items.artifacts.masterthievesarmband.no_target=Egy olyan ellenséget kell megcéloznod, amelyik a közvetlen közeledben van.
items.artifacts.masterthievesarmband.steal_shopkeeper=Nem lophatsz közvetlenül a boltosoktól.
items.artifacts.masterthievesarmband.no_steal=Ettől az ellenségtől nincs mit ellopni.
items.artifacts.masterthievesarmband.stole_item=Elloptál valamit: %s.
items.artifacts.masterthievesarmband.failed_steal=Nem sikerült ellopnod semmit.
items.artifacts.masterthievesarmband.level_up=A karszalagod erősebb lett!
items.artifacts.masterthievesarmband.desc=Ez a lila bársony karszalag egy mestertolvaj jegyét viseli. Igaz, hogy nem téged illet, dehát valószínűleg azt sem, aki előzőleg használta.
items.artifacts.masterthievesarmband.desc_cursed=A megátkozott karszalag a csuklódra szorult, és mintha a pénzes zacskód egyre könnyebb lenne...
items.artifacts.masterthievesarmband.desc_worn=Érzed, hogy a csuklódon lévő karszalagban egyre több erő gyűlik össze a tapasztalatod gyarapodásával. Ezt az erőt arra használhatod, hogy lopj a boltokból, vagy kirabold az ellenséget!\n\nAz ellenség kirablása azonnal megtörténik, rövid időre elbizonytalanítja őket, és esélyt ad arra, hogy megszerezd a náluk lévő zsákmányt! Ez az erő hatékonyabb azok ellen az ellenségek ellen, akik nem vettek észre. Ha ugyanazt az ellenséget többször kirabolod, nem kapsz esélyt további zsákmányra.

items.artifacts.sandalsofnature.name=természet szandálja
items.artifacts.sandalsofnature.name_1=természet cipője
items.artifacts.sandalsofnature.name_2=természet csizmája
items.artifacts.sandalsofnature.name_3=természet lábvértje
items.artifacts.sandalsofnature.ac_feed=TÁPLÁLOM
items.artifacts.sandalsofnature.ac_root=MEGGYÖKEREZÉS
items.artifacts.sandalsofnature.prompt=Válassz egy magot
items.artifacts.sandalsofnature.levelup=A lábbelid rohamosan növekszik!
items.artifacts.sandalsofnature.absorb_seed=A lábbeli elnyeli a magot, egészségesebbnek tűnik tőle.
items.artifacts.sandalsofnature.no_effect=Először maggal kell táplálnod a lábbelidet.
items.artifacts.sandalsofnature.low_charge=A lábbelidnek nincs elég energiája ehhez.
items.artifacts.sandalsofnature.prompt_target=Válassz helyszínt!
items.artifacts.sandalsofnature.out_of_range=Ez a hely hatótávolságon kívül van.
items.artifacts.sandalsofnature.desc_1=Ami először egy pár, gallyakból készített szandálnak tűnt, valójában két növény! Nagyon gyengének és fakónak tűnnek, talán valamivel lehetne táplálni őket?
items.artifacts.sandalsofnature.desc_2=A lábbeli megnőtt és így már sokkal inkább hasonlít egy pár megmunkált cipőhöz. A színük is kicsit jobb lett. Lehet, hogy még tovább is tud nőni?
items.artifacts.sandalsofnature.desc_3=A növények ismét nőttek valamennyit, és már egy pár kemény, kéregből készített csizmára hasonlítanak. A növények visszanyerték erejüket, de lehet, hogy még ennél is tovább nőhetnének?
items.artifacts.sandalsofnature.desc_4=Úgy tűnik, a növények elérték a lehető legnagyobb méretüket, és egy pár lábvértre hasonlítanak. Sötétbarna színűek, és egy vaskos fára emlékeztetnek.
items.artifacts.sandalsofnature.desc_hint=Úgy érzed, mélyebb harmóniában vagy a természettel, mikor ezt az ereklyét hordod.
items.artifacts.sandalsofnature.desc_cursed=A megátkozott szandál akadályozza a természettel való bármiféle összhangot.
items.artifacts.sandalsofnature.desc_ability=A lábbelid színe az utoljára elfogyasztott mag színében lüktet. Képességük, hogy rövid időre a földbe gyökerezhetnek, és 3 mező sugarú körben bárhol előidézhetik az adott növény hatását. \nMag: _%s_\nSzükséges töltés: _%d%%_
items.artifacts.sandalsofnature.desc_seeds=A lábbelit egy %d magjával etetted meg.

items.artifacts.skeletonkey.name=csontvázkulcs
items.artifacts.skeletonkey.ac_insert=BEHELYEZÉS
items.artifacts.skeletonkey.cursed=Megátkozott csontvázkulcsot nem tudsz használni.
items.artifacts.skeletonkey.prompt=Válassz célpontot
items.artifacts.skeletonkey.invalid_target=Nem lehet semmit sem bezárni vagy kinyitni ott.
items.artifacts.skeletonkey.lock_no_space=Nem zárhatsz be egy karaktert egy ajtóba!
items.artifacts.skeletonkey.iron_charges=Egy hagyományos zár kinyitásához 1 töltés szükséges.
items.artifacts.skeletonkey.gold_charges=Egy aranyzár kinyitásához 2 töltés szükséges.
items.artifacts.skeletonkey.lock_charges=Egy ajtó bezárásához 2 töltés szükséges.
items.artifacts.skeletonkey.wall_charges=Egy ideiglenes fal létrehozásához 2 töltés szükséges.
items.artifacts.skeletonkey.crystal_charges=Egy kristályzár kinyitásához 5 töltés szükséges.
items.artifacts.skeletonkey.wont_open=A kulcs valamilyen okból nem illik ebbe a zárba.
items.artifacts.skeletonkey.locked_with_key=Az ajtót a csontvázkulccsoddal zártad be.
items.artifacts.skeletonkey.force_lock=A zár meggyengült a csontvázkulcsod nélkül. Sikerül egy kis erőszakkal kinyitnod.
items.artifacts.skeletonkey.discard=Eldobtad a felesleges kulcsokat.
items.artifacts.skeletonkey.levelup=A csontvázkulcsod erősebb lett!
items.artifacts.skeletonkey.desc=Egy fontosnak tűnő kulcs, amelynek a feje koponya alakú. A fogai minden alkalommal máshogy néznek ki, amikor ránézel.
items.artifacts.skeletonkey.desc_worn=Ez a mágikus kulcs úgy tűnik, hogy minél többet használod a kazamata szokásos kulcsai helyett, annál erősebb lesz. Szinte minden kazamatazárba behelyezhető, hogy kinyissa vagy bezárja azokat, beleértve azokat az ajtókat is, amelyek korábban soha nem voltak bezárva.\n\nA kulcs akár üres térben is használható, kardinális vagy átlós irányban, hogy „bezárja” az előtted lévő teret, és egy 3 mező széles, szilárd falat hozzon létre, amely 10 körig tart. A bezárás eltaszítja az ellenségeket, ha van elég hely.
items.artifacts.skeletonkey.desc_cursed=Az átkozott kulcs úgy tűnik, hogy aktívan kerüli, hogy bármelyik zárba is behelyezd, és még a többi kulcsod használatát is megnehezíti (de nem teszi lehetetlenné).
items.artifacts.skeletonkey$keywall.desc=Egy ideiglenes, mágikus fal lett téve ide a csontvázkulccsal.

items.artifacts.talismanofforesight.name=betekintés talizmánja
items.artifacts.talismanofforesight.ac_scry=FÜRKÉSZ
items.artifacts.talismanofforesight.low_charge=A talizmánnal való fürkészéshez legalább 5% töltöttség szükséges.
items.artifacts.talismanofforesight.prompt=Válassz helyszínt az átkutatáshoz.
items.artifacts.talismanofforesight.levelup=A talizmánod erősebb lett!
items.artifacts.talismanofforesight.full_charge=A talizmánod feltöltődött!
items.artifacts.talismanofforesight.desc=Furcsa vésetekkel teli, csiszolt kő. Úgy érzed, mintha mindent figyelne körülötted, szemmel tartva a rejtett dolgokat.
items.artifacts.talismanofforesight.desc_worn=Amikor a talizmánt tartod, úgy érzed, mintha az érzékeid kifinomultabbak lennének. A talizmán lassan feltöltődik, ahogy telik az idő, illetve amikor rejtett ajtókat és csapdákat fedezel fel.\n\nA talizmán töltését felhasználva kúp alakban fürkészhetsz, ami az átkutatott terület minden mezőjét és titkát felfedi, és megmutatja számodra az ellenségeket és a tárgyakat egy kis időre.
items.artifacts.talismanofforesight.desc_cursed=A megátkozott talizmán feszesen bámul beléd, és eltompítja az érzékeidet.
items.artifacts.talismanofforesight$foresight.name=betekintés
items.artifacts.talismanofforesight$foresight.uneasy=Rossz előérzeted támadt.
items.artifacts.talismanofforesight$foresight.desc=Ideges vagy, mintha láthatatlan veszély leselkedne rád a közelben.

items.artifacts.timekeepershourglass.name=Időt uraló homokóra
items.artifacts.timekeepershourglass.ac_activate=ÁTFORDÍTOM
items.artifacts.timekeepershourglass.deactivate=Véget vetsz az idő megállításának.
items.artifacts.timekeepershourglass.no_charge=A homokórád még nem töltődött fel annyira, hogy használhasd.
items.artifacts.timekeepershourglass.cursed=Az elátkozott homokóra nem használható.
items.artifacts.timekeepershourglass.onstasis=Mintha egy pillanat alatt mozdulna körülötted a világ.
items.artifacts.timekeepershourglass.onfreeze=Hirtelen minden megáll körülötted.
items.artifacts.timekeepershourglass.stasis=Sztázisba megyek
items.artifacts.timekeepershourglass.freeze=Megállítom az időt
items.artifacts.timekeepershourglass.prompt=Hogyan szeretnéd használni a homokórád varázserejét?\n\nHa sztázisba kerülsz, az idő a megszokott módon telik, de megdermedsz és sebezhetetlen leszel. Ez egyszerre akár 2 töltést használhat el.\n\nHa az időt állítod meg, akkor úgy mozoghatsz, mintha ezzel nem telne az idő. Ennek bármikor véget vethetsz a homokóra használatával vagy támadással.
items.artifacts.timekeepershourglass.desc=Ez a nagy, díszes homokóra elég jelentéktelennek tűnik, de hatalmas erőt érzel megbújni a kifinomultan kifaragott keretében. A homokórát forgatva a pergő homokszemeket figyeled, és érzed, ahogy a benne rejlő varázserő vonz magához. Ezzel a mágiával kétségtelenül beleszólhatnál bizonyos mértékig az idő menetébe.
items.artifacts.timekeepershourglass.desc_hint=Mintha hiányozna némi homok a homokórából. Bárcsak találnál valahol...
items.artifacts.timekeepershourglass.desc_cursed=Az elátkozott homokóra az oldaladhoz tapad, érzed, ahogy megpróbálja zavarni az időd folyását.
items.artifacts.timekeepershourglass$timefreeze.name=Időmegállítás
items.artifacts.timekeepershourglass$timefreeze.desc=Az idő megállt körülötted, lehetővé téve, hogy azonnal cselekedj. A hatás addig tart, amíg véget nem vetsz neki, vagy amíg a homokórádnak le nem merül a töltése. A hatást az is megtöri, ha támadsz vagy mágiát használsz.\n\nA töltés lemerüléséig %s kör van hátra.
items.artifacts.timekeepershourglass$sandbag.name=zsák varázshomok
items.artifacts.timekeepershourglass$sandbag.levelup=Beleöntöd a homokot a homokórádba.
items.artifacts.timekeepershourglass$sandbag.maxlevel=A homokórád tele van varázshomokkal!
items.artifacts.timekeepershourglass$sandbag.no_hourglass=Nincs homokórád, amelybe ezt a homokot beleönthetnéd.
items.artifacts.timekeepershourglass$sandbag.desc=A kis zsákban lévő finom homok tökéletes lenne a homokórádba.\n\nElég hihetetlen, hogy a boltosnál pont akkor volt ilyen, amikor szükséged volt rá...

items.artifacts.unstablespellbook.name=kiszámíthatatlan varázskönyv
items.artifacts.unstablespellbook.ac_read=OLVASOK
items.artifacts.unstablespellbook.ac_add=BELETESZ
items.artifacts.unstablespellbook.blinded=Megvakulva nem tudod a könyvet olvasni.
items.artifacts.unstablespellbook.no_charge=Nincs most több energia a varázskönyvedben.
items.artifacts.unstablespellbook.cursed=Megátkozott varázskönyvből nem tudsz olvasni.
items.artifacts.unstablespellbook.prompt=Válassz tekercset
items.artifacts.unstablespellbook.infuse_scroll=A tekercs energiáját belevezeted a könyvbe.
items.artifacts.unstablespellbook.unable_scroll=Ezt a tekercset nem tudod betenni a könyvbe.
items.artifacts.unstablespellbook.unknown_scroll=Még nem vagy biztos benne, hogy ez milyen tekercs.
items.artifacts.unstablespellbook.desc=Korához képest a kötet meglepően jó állapotban van. Ahogy lapozol, a papír serceg és ropog a kezed között, kiszámíthatatlan energia áramlik benne. Milyen varázslat születne, ha olvasnál belőle?
items.artifacts.unstablespellbook.desc_cursed=A megátkozott könyv hozzád rögzült, és nem engedi elolvasni a tekercsek többségét.
items.artifacts.unstablespellbook.desc_index=A könyv csonka. A tartalomjegyzék az alábbi hiányzó oldalakra mutat:
items.artifacts.unstablespellbook.desc_empowered=A tekercs, amelyet a könyvbe fűztél, energiától fénylik. Ezentúl választhatod ennek a tekercshatásnak az egzotikus változatát is, de az több töltésbe fog kerülni.
items.artifacts.unstablespellbook.read_empowered=A tekercs, amelyet a könyvbe fűztél, energiától hullámzik. Ezentúl választhatod ennek a tekercshatásnak a közönséges vagy az egzotikus változatát is.\n\nAz egzotikus változat 2 tötésbe kerül 1 helyett.



###bags
items.bags.bag.name=hátizsák
items.bags.bag.discover_hint=Ezt a tárgyat egy boltban vásárolhatod meg.

items.bags.potionbandolier.name=italos válltáska
items.bags.potionbandolier.desc=Ez a széles válltáska övként öleli körbe a mellkasod. Van rajta sok szigetelt zseb, amelyben italos fiolákat, a vizestömlődet vagy folyékony fémes fiolákat lehet tárolni.\n\nA válltáska védi a hidegtől is a benne lévő italokat.

items.bags.scrollholder.name=tekercstartó
items.bags.scrollholder.desc=Ebben a csőalakú tárolóban egy csillagász tarthatta az eszközeit és a térképeit, de a te tekercseidnek is tökéletes lesz. Van még pár oldalsó rekesze is, amelyben szépen elférnek a varázslat kristályaid, a misztikus karctűid és a misztikus gyantáid.\n\nA tároló nem tűnik gyúlékonynak, így a tekercseid biztonságban lesznek benne.

items.bags.velvetpouch.name=bársonyzacskó
items.bags.velvetpouch.desc=Ebbe a kis bársonyzsákba sok kis tárgy belefér, például a magok, a rúnakövek és bizonyos alkímiai összetevők.
items.bags.velvetpouch.discover_hint=Az egyik hős ezzel a tárggyal indul.

items.bags.magicalholster.name=mágikus tegez
items.bags.magicalholster.desc=Ez a vékony tegez valamilyen egzotikus állat bőréből készült, és erős varázserejének köszönhetően rengeteg távolsági fegyver elfér benne.\n\nCsak bele kell nyúlnod a puzdrába, és az a tárgy fog a kezedbe akadni, amelyet épp keresel.\n\nA tegez varázsereje miatt a varázspálcák némileg gyorsabban töltődnek, a dobófegyverek pedig valamivel tartósabbak lesznek benne.



###bombs
items.bombs.arcanebomb.name=misztikus bomba
items.bombs.arcanebomb.desc=Ezt a bombát misztikus tulajdonságokkal módosították. Erőteljes lökéssel robban, a Ragacs felpumpálós támadásához hasonlóan, ami _%1$d-%2$d mágikus sérülést_ okoz mindennek, ami 2 mezőn belül van.
items.bombs.arcanebomb.discover_hint=Ezt a tárgyat alkímia segítségével készítheted el.

items.bombs.bomb.name=bomba
items.bombs.bomb.ac_lightthrow=MEGGYÚJTOM ÉS ELDOBOM
items.bombs.bomb.snuff_fuse=Gyorsan kibiztosítod a bombát.
items.bombs.bomb.ondeath=A robbanás megölt...
items.bombs.bomb.rankings_desc=Robbanás ölte meg.
items.bombs.bomb.desc=Meglehetősen nehéz feketelőpor-bomba. Ennek a bombának a robbanása _%1$d-%2$d sebzést_ okoz mindennek, ami mellette van, és elpusztítja a közelben lévő térelemek és tárgyak egy részét.
items.bombs.bomb.desc_fuse=Úgy néz ki, eltart pár körig, míg leég a kanóc, miután meggyújtották.
items.bombs.bomb.desc_burning=A bomba kanóca ég, menj távol tőle, vagy oltsd el!
items.bombs.bomb$doublebomb.name=bombapár
items.bombs.bomb$doublebomb.desc=Két, meglehetősen nehéz feketelőpor-bomba. Úgy látszik, a második ajándékba jár!

items.bombs.firebomb.name=tűzbomba
items.bombs.firebomb.desc=Ezt a bombát úgy módosították, hogy nagyobb területen robbanjon, így 2 mezőn belül _%1$d-%2$d sebzést_ okoz, és tartósan lángokkal borítja be ezt a területet.
items.bombs.firebomb.discover_hint=Ezt a tárgyat alkímia segítségével készítheted el.

items.bombs.flashbangbomb.name=villanógránát
items.bombs.flashbangbomb.desc=Ezt a bombát úgy módosították, hogy fény, hang és elektromosság törjön ki belőle, amikor felrobban. Bármi, ami 2 mezőn belül van, _%1$d-%2$d sérülést_ szenved a robbanástól, és további 25%% sérülést az elektromosságtól, továbbá 10 körre elkábul.
items.bombs.flashbangbomb.discover_hint=Ezt a tárgyat alkímia segítségével készítheted el.

items.bombs.frostbomb.name=fagyasztóbomba
items.bombs.frostbomb.desc=Ezt a bombát úgy módosították, hogy nagyobb területen robbanjon, így 2 mezőn belül _%1$d-%2$d sebzést_ okoz, és tartósan fagyos légáramlatot idéz elő ezen a területen.
items.bombs.frostbomb.discover_hint=Ezt a tárgyat alkímia segítségével készítheted el.

items.bombs.holybomb.name=szent bomba
items.bombs.holybomb.desc=Ezt a bombát úgy módosították, hogy nagyobb területen villantson szent fényt, amikor felrobban. Bármi, ami 2 mezőn belül van, _%1$d-%2$d sérülést_ szenved a robbanástól, és az élőhalott vagy démoni ellenségek további 50%% sérülést szenvednek a szent fénytől.
items.bombs.holybomb.discover_hint=Ezt a tárgyat alkímia segítségével készítheted el.

items.bombs.noisemaker.name=zajkeltő
items.bombs.noisemaker.desc=Ezt a bombát úgy módosították, hogy folyamatos zajt csapjon, amikor a gyújtózsinór kialszik. Ha valami hozzáér a bombához, az felrobban, és 2 mezőn belül _%1$d-%2$d sebzést_ okoz mindennek!
items.bombs.noisemaker.desc_burning=A zajkeltő tovaketyeg, majd felrobban, ha valami a közelébe kerül!
items.bombs.noisemaker.discover_hint=Ezt a tárgyat alkímia segítségével készítheted el.

items.bombs.smokebomb.name=füstbomba
items.bombs.smokebomb.desc=Ezt a bombát úgy módosították, hogy a robbanással egyidejűleg sűrű gázfelhőt bocsásson ki. Ez a bomba 2 mezőn belül _%1$d-%2$d sebzést_ okoz, és homályos ködbe burkolja ezt a területet.
items.bombs.smokebomb.discover_hint=Ezt a tárgyat alkímia segítségével készítheted el.

items.bombs.regrowthbomb.name=kertész bomba
items.bombs.regrowthbomb.desc=Ezt a bombát úgy módosították, hogy robbanás helyett életet adó folyadékot loccsantson mindenhová 3 mezőn belül. A beborított környéken azonnal fű és növény serken. Magadat és minden szövetségest gyógyít, akit a kiloccsanó folyadék elér, mintha csak gyógyitalt ittatok volna.
items.bombs.regrowthbomb.discover_hint=Ezt a tárgyat alkímia segítségével készítheted el.

items.bombs.shrapnelbomb.name=repeszbomba
items.bombs.shrapnelbomb.desc=Ezt a bombát a DM-300-as fémdarabkáival módosították, melyek repeszként szállnak mindenfelé a robbanásakor, és így _%1$d-%2$d sebzést_ okoz a hatalmas hatósugarában. Jobban teszed, ha elbújsz valami mögé, ha használod...
items.bombs.shrapnelbomb.discover_hint=Ezt a tárgyat alkímia segítségével készítheted el.

items.bombs.woollybomb.name=gyapjas bomba
items.bombs.woollybomb.desc=Ezt a bombát úgy módosították, hogy a robbanás után mágikus birkákat hozzon létre egy széles területen. A robbanás 2 mezőn belül _%1$d-%2$d sebzést_ okoz mindennek. A birkák akadályozzák a mozgást, és nagyon sokáig nem tűnnek el! Erőteljes ellenfelek jelenlétében viszont a birkák nem tartanak ki olyan sokáig, és szándékosan hamarabb eloszlathatók, ha piszkálják őket.
items.bombs.woollybomb.discover_hint=Ezt a tárgyat alkímia segítségével készítheted el.

###food
items.food.berry.name=kazamatabogyó
items.food.berry.eat_msg=Ez a bogyó finom volt!
items.food.berry.desc=Ezt az apró bogyót a vadásznő találta a kazamata növényzete között. Gyorsan meg lehet enni, enyhén csökkenti az éhséget, sőt lehet, hogy van benne egy használható mag is!
items.food.berry.discover_hint=Ezt a tárgyat egy bizonyos hős egyik tehetségével találhatod meg.

items.food.blandfruit.name=szelídgyümölcs
items.food.blandfruit.cooked=főtt szelídgyümölcs
items.food.blandfruit.sunfruit=napgyümölcs
items.food.blandfruit.rotfruit=mállógyümölcs
items.food.blandfruit.earthfruit=földgyümölcs
items.food.blandfruit.blindfruit=vakgyümölcs
items.food.blandfruit.firefruit=tűzgyümölcs
items.food.blandfruit.icefruit=jéggyümölcs
items.food.blandfruit.fadefruit=illógyümölcs
items.food.blandfruit.sorrowfruit=szomorúgyümölcs
items.food.blandfruit.stormfruit=vihargyümölcs
items.food.blandfruit.dreamfruit=mágusgyümölcs
items.food.blandfruit.starfruit=csillaggyümölcs
items.food.blandfruit.swiftfruit=gyorsbogyó
items.food.blandfruit.raw=Nem bírod megenni nyersen.
items.food.blandfruit.desc=Nagyon száraz és jellegtelen. Talán, ha más hozzávalóval együtt megfőzöd, akkor jobb lesz.
items.food.blandfruit.desc_cooked=A gyümölcs a fazékban ázva megdagadt, és megszívta magát a mag tulajdonságaival, amellyel együtt főzték. Hatása megegyezik a magból készíthető varázsital hatásával.
items.food.blandfruit.desc_eat=Úgy tűnik, már ehető!
items.food.blandfruit.desc_throw=Meglehetősen labilisnak tűnik, ezt jobb lesz rádobni valamire.
items.food.blandfruit$chunks.name=pár falat szelídgyümölcs
items.food.blandfruit$chunks.desc=A szelídgyümölcs a földet éréskor szétfröccsent, és hatástalan darabkákra hullot.\n\nEgy kis por rájuk ragadt ugyan, de ezek a főtt szelídgyümölcsfalatok kiválóan fogyaszthatónak tűnnek.

items.food.chargrilledmeat.name=rostélyos hús
items.food.chargrilledmeat.desc=Rendes sült húsnak tűnik.
items.food.chargrilledmeat.discover_hint=Ezt egy másik élelmiszerrel is elkészítheted.

items.food.food.name=ételcsomag
items.food.food.ac_eat=ESZIK
items.food.food.eat_msg=Ez finom volt!
items.food.food.desc=Semmi különös nincs benne: szárított hús, egy kis keksz - ilyesmi.

items.food.frozencarpaccio.name=fagyott carpaccio
items.food.frozencarpaccio.invis=Látod, ahogy a kezeid láthatatlanná válnak!
items.food.frozencarpaccio.hard=Érzed, ahogy a bőröd megkeményedik!
items.food.frozencarpaccio.refresh=Frissítő!
items.food.frozencarpaccio.better=Jobban érzed magad!
items.food.frozencarpaccio.desc=Egy darab fagyott nyers hús. Megenni csak vékony szeletekre vágva lehet, így viszont meglepően jó.
items.food.frozencarpaccio.discover_hint=Ezt egy másik élelmiszerrel is elkészítheted.

items.food.meatpie.name=húsos pite
items.food.meatpie.eat_msg=Ez az étel hihetetlenül jó volt!
items.food.meatpie.desc=Ízletes hússal töltött finom pite. Sokkal jobban jóllaksz tőle, mint bármi más ételtől.
items.food.meatpie.discover_hint=Ezt a tárgyat alkímia segítségével készítheted el.

items.food.mysterymeat.name=ismeretlen hús
items.food.mysterymeat.eat_msg=Az étel... fura ízű volt.
items.food.mysterymeat.hot=Hűha, ez csípős!
items.food.mysterymeat.legs=Nem érzed a lábad!
items.food.mysterymeat.not_well=Nem érzed jól magad.
items.food.mysterymeat.stuffed=Tele vagy.
items.food.mysterymeat.desc=Saját felelősségedre fogyaszd!
items.food.mysterymeat.discover_hint=Ezt a tárgyat bizonyos ellenségektől kaphatod.
items.food.mysterymeat$placeholder.name=hús

items.food.phantommeat.name=fantomhús
items.food.phantommeat.desc=Egy nagy, csillogó, áttetsző hússzelet, amelyet egy fantompirájából vágtak ki. Ezt a varázslatos húst nem kell megfőzni, és számos jótékony védekezési hatást biztosít amellett, hogy teljesen jóllakat. Ha megeszed, láthatatlanságot, kéregbőrt és némi gyógyulást okoz, valamint számos káros hatást megszüntet.
items.food.phantommeat.discover_hint=Ezt a tárgyat bizonyos ellenségektől kaphatod.

items.food.pasty.name=pástétom
items.food.pasty.fish_name=párolt hal
items.food.pasty.amulet_name=yendor amulettje?
items.food.pasty.egg_name=húsvéti tojás
items.food.pasty.rainbow_name=szivárványos varázsital
items.food.pasty.shattered_name=zöld torta
items.food.pasty.pie_name=tökpite
items.food.pasty.vanilla_name=kék torta
items.food.pasty.cane_name=kandiscukor
items.food.pasty.sparkling_name=gyöngyöző varázsital
items.food.pasty.desc=Ez egy hagyományos kelta pástétom, tradicionális marha- és krumplitöltelékkel. Ízletes!
items.food.pasty.fish_desc=Egy egész párolt hal, varázslattal tartósítva, zöldágyon. Az évnek ebben az időszakában hagyomány, hogy egy kis halat félreteszünk későbbre, így ahelyett, hogy az egészet egyszerre fogyasztanánk el, hagyunk egy kis maradékot későbbre.\n\nBoldog Holdújévet!
items.food.pasty.amulet_desc=Végre megtaláltad, a varázslatos amulettet - vagyis hát mégsem, mert ez csak egy fóliába csomagolt csokoládé, amely úgy néz ki, mint az amulett! Nem ad határtalan erőt, de legalább táplál, és ad egy kis ereklyetöltést.\n\nÁprilis Bolondja!
items.food.pasty.egg_desc=Egy nagy csokoládétojás színes, sárga fóliába csomagolva. Van benne annyi csokoládé, hogy jóllakj, és a cukor adhat valamicske plusz töltést az ereklyéidnek.\n\nBoldog Húsvétot!
items.food.pasty.rainbow_desc=Ez a színes varázsital egyfajta folyékony étel. Amellett, hogy csillapítja az éhségedet, egy kis varázslatot is tartalmaz, amely megnyugtat egy szomszédos, nem főellenséget, így az átmenetileg tétovázni fog, hogy harcoljon-e ellened.\n\nKellemes Fesztiválozást!
items.food.pasty.shattered_desc=Ez a nagy szelet vaníliás torta színes cukordíszekkel és zöld mázzal van bevonva. A torta az évek során szerzett tapasztalatok megünneplésére készült, és fogyasztásakor ebből a tapasztalatból egy kis adagot ad neked.\n\nA Shattered Pixel Dungeon először 2014. augusztus 5-én jelent meg. Boldog születésnapot Shattered Pixel Dungeon!
items.food.pasty.pie_desc=Egy nagy szelet tökpite! Édes és fűszeres íze laktat, és egy kicsit gyógyít is.\n\nBoldog Halloweent!
items.food.pasty.vanilla_desc=Ez a nagy szelet vaníliás torta színes cukordíszekkel és zöld mázzal van bevonva. A torta az évek során szerzett tapasztalatok megünneplésére készült, és fogyasztásakor ebből a tapasztalatból egy kis adagot ad neked.\n\nAz eredeti Pixel Dungeon először 2012. december 4-én jelent meg. Boldog születésnapot Pixel Dungeon!
items.food.pasty.cane_desc=Hatalmas, cukros, édes kandiscukor! Laktató, és a benne lévő cukor valamicske plusz töltést még a varázspálcáidnak is ad.\n\nKellemes Ünnepeket!
items.food.pasty.sparkling_desc=Ez a gyöngyöző varázsital egyfajta folyékony étel. Csillapítja az éhségedet, és olyan, mintha pezsgő volna, de valójában nem alkoholos. A meleg érzés a gyomrodban egy kis védőburkot biztosít.\n\nBoldog Új Évet!
items.food.pasty$fishleftover.name=halmaradékok
items.food.pasty$fishleftover.eat_msg=Ez az étel rendben volt.
items.food.pasty$fishleftover.desc=Egy kis halmaradék az előző étkezésből. Bármikor megeheted, hogy egy kicsit csillapítsd az éhségedet.

items.food.smallration.name=kis ételcsomag
items.food.smallration.eat_msg=Ez az étel rendben volt.
items.food.smallration.desc=Épp úgy néz ki, mint a közönséges ételcsomag, csak kisebb.
items.food.smallration.discover_hint=Ezt a tárgyat egy boltban vásárolhatod meg.

items.food.stewedmeat.name=szaftos hús
items.food.stewedmeat.eat_msg=Ez az étel rendben volt.
items.food.stewedmeat.desc=A hús főzéskor megtisztult minden parazitától és kórokozótól. Biztonságosan megehető.
items.food.stewedmeat.discover_hint=Ezt a tárgyat alkímia segítségével készítheted el.

items.food.supplyration.name=ellátmányadag
items.food.supplyration.desc=Ezt a fejadagot a tolvajcéh tagjai hagyták a kazamatákban. Kifejezetten arra tervezték, hogy útközben fogyasztható legyen, és segítsen a zsiványkodásban.\n\nBár nem tölt fel annyira, mint egy hagyományos adag, gyorsan elfogyasztható, közvetlenül gyógyít egy kicsit, és a zsivány árnyékköpenyének egy töltést is ad.
items.food.supplyration.discover_hint=Ezt a tárgyat egy bizonyos hős egyik tehetségével találhatod meg.



##journal items
items.journal.documentpage.name=kitépett lap
items.journal.documentpage.desc=Egyetlen lap, valószínűleg valamilyen könyvből tépték ki. Fel kell venned, hogy el tudd olvasni.

items.journal.alchemypage.name=alkimista könyvből kitépett lap
items.journal.alchemypage.desc=Egy lap, amely egy alkímiai útmutatóból szakadt ki.\n\nA legtöbb szöveg túl kicsi, és messziről nem olvasható, de az oldal címe kivehető:\n\n_"%s"_

items.journal.guidebook.name=a kazamatamesterség kódexe
items.journal.guidebook.hint_mobile=Az útikönyvednek van egy jótanácsa számodra! Koppints a villogó napló gombra a jobb felső sarokban az elolvasásához!
items.journal.guidebook.hint_desktop=Az útikönyvednek van egy jótanácsa számodra! Kattints a villogó napló gombra (%s) a jobb felső sarokban az elolvasásához!
items.journal.guidebook.hint_status=Útikönyv
items.journal.guidebook.desc=Kalandorok útikönyve, amelyet valaki itt hagyott, aki úgy döntött, hogy a kalandozás nem neki való! Ez egy varázslatos példány, és a megfelelő pillanatban szól a kalandornak, ha érdemes elolvasni belőle egy oldalt.\n\nE képessége ellenére a könyv mégis leginkább a borítójára nagy, barátságos betűkkel írt "Ne ess pánikba!" felirat miatt népszerű.

items.journal.guidepage.name=útikönyvből kitépett lap
items.journal.guidepage.desc=Egy kalandozó útikönyvből kitépett lap.\n\nA szöveg nagy része túl kicsi, hogy messziről elolvasd, de az oldal címe kivehető:\n\n_"%s"_

items.journal.regionlorepage$sewers.name=kopott levél
items.journal.regionlorepage$sewers.desc=Levélnek látszik. Koszos, foltos papírlapra írták. Fel kell venned, hogy el tudd olvasni.

items.journal.regionlorepage$prison.name=kopott naplóbejegyzés
items.journal.regionlorepage$prison.desc=Egy régi papírra írt napló- vagy másfajta feljegyzés. Úgy tűnik, jobb állapotban maradt, mint a csatornában talált levelek, de még így is fel kell venned, hogy el tudd olvasni.

items.journal.regionlorepage$caves.name=régi naplóbejegyzés
items.journal.regionlorepage$caves.desc=Egy felfedező naplóbejegyzésének tűnik, amely meglepően jó állapotban maradt, annak ellenére, hogy milyen régi lehet. Vedd fel, hogy elolvashasd!

items.journal.regionlorepage$city.name=rozsdás tábla
items.journal.regionlorepage$city.desc=Egy kis rozsdás fémtábla, amelybe mágikusan üzenetet véstek. A betűk a tábla kora ellenére még mindig élesek, de fel kell venned, hogy el tudd olvasni.

items.journal.regionlorepage$halls.name=fénylő tábla
items.journal.regionlorepage$halls.desc=Egy kis fekete tábla, amelybe izzó zöld betűket véstek. Az izzó betűk távolról homályosan összefolynak. Fel kell emelned, hogy el tudd olvasni.


###keys
items.keys.goldenkey.name=aranykulcs
items.keys.goldenkey.desc=A kulcs fogazata aprólékos munkával készült. Talán egy lezárt ládát nyit?

items.keys.crystalkey.name=Kristálykulcs
items.keys.crystalkey.desc=E kristályos kulcs csiszolt felületei csillognak a sötétben. Talán valamilyen kristályból készült dolgot nyit?

items.keys.ironkey.name=vaskulcs
items.keys.ironkey.desc=Az ősrégi vaskulcs fogazata eléggé elhasználódott, a rajta csüngő bőrszíj is ütött-kopott. Milyen ajtót nyithat?

items.keys.wornkey.name=kopott kulcs
items.keys.wornkey.desc=Ez a kulcs kopott és elszíneződött, de fontasnak tűnik. Valószínűleg valami fontos ajtót nyithat a közelben.



###potions
items.potions.potion.ac_drink=ISZIK
items.potions.potion.turquoise=türkiz varázsital
items.potions.potion.crimson=karmazsin varázsital
items.potions.potion.azure=égszínkék varázsital
items.potions.potion.jade=jáde varázsital
items.potions.potion.golden=arany varázsital
items.potions.potion.magenta=bíborvörös varázsital
items.potions.potion.charcoal=sötétszürke varázsital
items.potions.potion.ivory=elefántcsont varázsital
items.potions.potion.amber=borostyán varázsital
items.potions.potion.bistre=sötétbarna varázsital
items.potions.potion.indigo=indigó varázsital
items.potions.potion.silver=ezüst varázsital
items.potions.potion.unknown_desc=Színes folyadék kavarog a flaskában. Mi történhet, ha megiszod vagy eldobod?
items.potions.potion.harmful=Ártalmas ital!
items.potions.potion.beneficial=Jótékony ital
items.potions.potion.yes=Igen, tudom, mit csinálok
items.potions.potion.no=Nem, meggondoltam magam
items.potions.potion.sure_drink=Biztos meg akarod inni? Általában az ilyen italokat az ellenségeidre érdemes dobnod.
items.potions.potion.sure_throw=Biztos el akarod dobni? Általában okosabb döntés meginni.
items.potions.potion.shatter=A flaska széttörik, a benne lévő folyadék ártalmatlanul loccsan szét.
items.potions.potion.discover_hint=Ezt a tárgyat véletlenszerűen találhatod meg a várbörtönben, vagy alkímia segítségével készítheted el.
items.potions.potion$placeholder.name=varázsital
items.potions.potion$seedtopotion.name=Véletlen Varázsital

items.potions.potionofexperience.name=tapasztalatital
items.potions.potionofexperience.desc=A számtalan megénekelt csata tapasztalatait folyékony formába sűrítették. Ez a nedű azonnal megemeli a tapasztalati szintedet.

items.potions.potionoffrost.name=fagyital
items.potions.potionoffrost.desc=Ebben a varázsitalban olyan vegyszer található, amely szabad levegővel érintkezve jéghideg felhővé válik.

items.potions.potionofhaste.name=sietségital
items.potions.potionofhaste.energetic=Energikusnak érzed magad!
items.potions.potionofhaste.desc=Ezt a különösen édes folyadékot elfogyasztva egy kis időre borzasztó energiával telsz meg, és iszonyatos sebességgel tudsz majd futni.

items.potions.potionofhealing.name=gyógyital
items.potions.potionofhealing.heal=A sebeid gyógyulni kezdenek.
items.potions.potionofhealing.desc=Az elixír gyorsan visszaadja az életerőd, és azonnal meggyógyít számos bajból.

items.potions.potionofinvisibility.name=láthatatlanság itala
items.potions.potionofinvisibility.invisible=Látod, ahogy a kezeid láthatatlanná válnak!
items.potions.potionofinvisibility.desc=Ha megiszod ezt az italt, átmenetileg láthatatlanná válsz. Amíg láthatatlan vagy, az ellenségek nem láthatnak téged. A fizikai támadások és mágikus hatások (például tekercsek és varázspálcák) azonnal megszüntetik a láthatatlanságot.

items.potions.potionoflevitation.name=lebegésital
items.potions.potionoflevitation.float=A levegőbe emelkedsz!
items.potions.potionoflevitation.desc=Ha megiszod ezt a különös folyadékot, a levegőbe emelkedve könnyedén repülsz át a csapdák és a szakadékok fölött. Ha elhajítod ezt a varázsitalt, nyers gázt bocsát ki, amely megzavarja azokat, akik belekerülnek.

items.potions.potionofliquidflame.name=folyékony tűz itala
items.potions.potionofliquidflame.desc=A flaskában zavaros kotyvalék kavarog, amely levegőre kerülve forró lángra lobban.

items.potions.potionofmindvision.name=belső látás itala
items.potions.potionofmindvision.see_mobs=Valami módon képes vagy érzékelni más lények elméjének jelenlétét!
items.potions.potionofmindvision.see_none=Valamiért biztos vagy benne, hogy most egyedül vagy a szinten.
items.potions.potionofmindvision.desc=Ha ezt megiszod, az elméd ráhangolódik a távolabbi lények pszichés hullámaira, így a falon át is érezheted fizikai jelenlétüket. Az italtól a közeli falakon és ajtókon it át tudsz látni.

items.potions.potionofparalyticgas.name=bénítógázital
items.potions.potionofparalyticgas.desc=Levegővel érintkezve a flaskában lévő folyadék zsibbasztó, sárga köddé alakul. Aki csak belélegzi, azonnal megbénul, és egy ideig a gáz elpárolgása után sem tud mozdulni. Az üveget rá lehet dobni a távol álló ellenségekre, hogy a gáz hatása alá kerüljenek.

items.potions.potionofpurity.name=tisztaság itala
items.potions.potionofpurity.freshness=Szokatlan frissességet érzel a levegőben.
items.potions.potionofpurity.protected=Egy védőréteg vesz körül!
items.potions.potionofpurity.desc=Ez a mágikus reagens nagy területen gyorsan semlegesít minden területhez kötött ártalmas hatást. Ha megiszod, egy ideig immunissá válsz a hasonló hatásokra.

items.potions.potionofstrength.name=erőital
items.potions.potionofstrength.msg=Újult erő járja át a testedet, most már %d erőd van!
items.potions.potionofstrength.desc=Ez az erőteljes folyadék szétáramlik az izmaidban, és tartósan megnöveli egy ponttal az erődet.

items.potions.potionoftoxicgas.name=mérgesgázital
items.potions.potionoftoxicgas.desc=Ha ezt a nyomás alatt lévő üvegcsét kinyitod vagy széttöröd, a tartalma mérgező zöld gázként robban ki belőle. Érdemes ezt az italt nem kézzel kinyitni, hanem inkább távoli ellenségekhez hajítani.



###brews
items.potions.brews.brew.discover_hint=Ezt a tárgyat alkímia segítségével készítheted el.

items.potions.brews.aquabrew.name=vizes főzet
items.potions.brews.aquabrew.desc=Amikor ez a főzet összetörik, a helyén egy nagynyomású vízsugár tör fel. Ez épp csak annyira erőteljes, hogy kárt tegyen a tüzes ellenségekben, de a víz szétterül a közeli területen is, hatástalanítja a csapdákat, eloltja a tüzet, és visszalöki a robbanás közelében lévő karaktereket.

items.potions.brews.blizzardbrew.name=hóviharfőzet
items.potions.brews.blizzardbrew.desc=Amint összetörik, ez a főzet örvénylő hóvihart szabadít ki, mely gyorsan szétterjed, akár egy gázfelhő.

items.potions.brews.causticbrew.name=maró főzet
items.potions.brews.causticbrew.desc=Ez a főzet maró váladékot terít szét a becsapódási helye körüli széles területen. Minden, amihez csak hozzáér a váladék, lassan szétmaródik, hacsak nem mossák le vízzel.

items.potions.brews.infernalbrew.name=pokoli főzet
items.potions.brews.infernalbrew.desc=Amint összetörik, ez a főzet dühöngő poklot szabadít fel, mely gyorsan szétterjed, akár egy gázfelhő.

items.potions.brews.shockingbrew.name=sokkoló főzet
items.potions.brews.shockingbrew.desc=Amint összetörik, ez a főzet nagy kiterjedésű elektromos vihart szabadít fel a széttörésének helye körül.

items.potions.brews.unstablebrew.name=kiszámíthatatlan főzet
items.potions.brews.unstablebrew.desc=Ez a mágikus főzet a szivárvány változó színeiben ragyog.\n\nHa megiszod vagy eldobod, egy véletlenszerű varázsital hatását váltja ki. Az ital hatása mindig jótékony lesz, ha megisszák, és mindig ártalmas, ha eldobják.

###elixirs
items.potions.elixirs.elixir.discover_hint=Ezt a tárgyat alkímia segítségével készítheted el.

items.potions.elixirs.elixirofarcanearmor.name=misztikus páncél elixírje
items.potions.elixirs.elixirofarcanearmor.desc=Ez az elixír hosszan tartó ellenállást garantál mágikus sebzések ellen.

items.potions.elixirs.elixirofaquaticrejuvenation.name=vizes megfiatalodás elixírje
items.potions.elixirs.elixirofaquaticrejuvenation.desc=Ez az elixír a Ragacs maradványait tartalmazza, gyógyitallal feljavítva. Ugyan nem ad azonnali gyógyulást, de amíg vízben állsz, fokozatosan visszaállít egy nagyobb mennyiségű egészséget.
items.potions.elixirs.elixirofaquaticrejuvenation$aquahealing.name=vizes gyógyulás
items.potions.elixirs.elixirofaquaticrejuvenation$aquahealing.desc=Átmenetileg a Ragacséhoz hasonló gyógyulási képességre tettél szert.\n\nVízben állva, körönként kis mennyiségben nő az egészséged. A hatás szünetel, ha teljesen egészséges vagy, vagy kimész a vízből.\n\nHátralévő gyógyulás: %d.

items.potions.elixirs.elixirofdragonsblood.name=sárkányvérelixír
items.potions.elixirs.elixirofdragonsblood.desc=Elfogyasztásakor ez az elixír tüzes energiát áraszt szét az ereiben annak, aki megissza. Ez a hatás immunissá tesz a tűzzel szemben, és képesé tesz arra, hogy fizikai támadásaid lángra lobbantsák az ellenfeleket.

items.potions.elixirs.elixiroffeatherfall.name=szállingózás elixírje
items.potions.elixirs.elixiroffeatherfall.light=Olyan könnyűnek érzed magad, mint egy madártoll!
items.potions.elixirs.elixiroffeatherfall.desc=Ez az elixír gyengébb, de jobban szabályozott lebegtető hatást biztosít, ami rövid időre lehetővé teszi, hogy aki megissza, nagyon magasról is sérülés nélkül zuhanjon le.
items.potions.elixirs.elixiroffeatherfall$featherbuff.name=szállingózás
items.potions.elixirs.elixiroffeatherfall$featherbuff.desc=A szállingózás elixírjének hatása alatt állsz, ami lehetővé teszi, hogy sérülés nélkül ess bele a szakadékba!\n\nHátralévő körök: %s.

items.potions.elixirs.elixirofhoneyedhealing.name=mézes gyógyulás elixírje
items.potions.elixirs.elixirofhoneyedhealing.desc=Ez az elixír egyesíti a méz édességét a gyógyítással. Mikor megisszák, a gyógyitallal azonos hatást fejt ki, és kissé csillapítja az éhséget, de el is lehet dobni, hogy egy szövetségest gyógyítsanak vele.\n\nA mézet kedvelő lényeket meg is lehet békíteni, ha ezt a tárgyat használják rajtuk.

items.potions.elixirs.elixiroficytouch.name=jeges érintés elixírje
items.potions.elixirs.elixiroficytouch.desc=Elfogyasztásakor ez az elixír képessé teszi az elfogyasztóját arra, hogy elvonja a hőt a megtámadott ellenfelektől. Aki a hatása alatt áll, immunis lesz a hidegre, és képes lesz fizikai támadással megdermeszteni az ellenfeleket.

items.potions.elixirs.elixirofmight.name=hatalom elixírje
items.potions.elixirs.elixirofmight.msg=Újult erő járja át a testedet, most már %d erőd van!
items.potions.elixirs.elixirofmight.desc=Ez az erőteljes folyadék szétáramlik az izmaidban, és tartósan megnöveli az erőd egy ponttal, és átmenetileg megnöveli a maximális egészséged %d ponttal. Az egészség túltöltése a maximális egészségeddel arányosan változik, de lassan elmosódik, ahogyan szinteteket lépsz.
items.potions.elixirs.elixirofmight$htboost.name=maximális egészség túltöltése
items.potions.elixirs.elixirofmight$htboost.desc=Természetellenesen erősnek és egészségesnek érzed a testedet.\n\nA maximális egészséged hosszabb időre túltöltődik. Ahogyan szinteket lépsz, a túltöltés lassacskán elenyészik.\n\nJelenlegi túltöltési érték: %d.\nHátralévő szintek: %d.

items.potions.elixirs.elixiroftoxicessence.name=mérgező esszencia elixírje
items.potions.elixirs.elixiroftoxicessence.desc=Elfogyasztásakor ez az elixír mérgező energiával ruházza fel, aki megissza. Az elfogyasztója folyamatosan mérges gázt fog terjeszteni, miközben mozog, és a hatás időtartamánál valamivel hosszabb ideig immunis lesz a mérges gázra és a méregre.



###exotic potions
items.potions.exotic.exoticpotion.turquoise=egzotikus türkiz ital
items.potions.exotic.exoticpotion.crimson=egzotikus karmazsin ital
items.potions.exotic.exoticpotion.azure=egzotikus égszínkék ital
items.potions.exotic.exoticpotion.jade=egzotikus jáde ital
items.potions.exotic.exoticpotion.golden=egzotikus arany ital
items.potions.exotic.exoticpotion.magenta=egzotikus bíborvörös ital
items.potions.exotic.exoticpotion.charcoal=egzotikus sötétszürke ital
items.potions.exotic.exoticpotion.ivory=egzotikus elefántcsont ital
items.potions.exotic.exoticpotion.amber=egzotikus borostyán ital
items.potions.exotic.exoticpotion.bistre=egzotikus sötétbarna ital
items.potions.exotic.exoticpotion.indigo=egzotikus indigó ital
items.potions.exotic.exoticpotion.silver=egzotikus ezüst ital
items.potions.exotic.exoticpotion.unknown_desc=Ez a kerek flaska szemcsés, színes folyadékot tartalmaz. Úgy látszik, mintha idegen világból származna, ki tudja, mi történik ha megiszod, vagy eldobod?
items.potions.exotic.exoticpotion.warning=Biztos, hogy nem akarod felhasználni az ital képességét? Már mindenképp elhasználódik.
items.potions.exotic.exoticpotion.yes=Igen, biztos
items.potions.exotic.exoticpotion.no=Nem, meggondoltam
items.potions.exotic.exoticpotion.discover_hint=Ezt a tárgyat alkímia segítségével készítheted el.

items.potions.exotic.potionofcleansing.name=tisztítóital
items.potions.exotic.potionofcleansing.desc=Ez az erős reagens néhány körre immunissá teszi minden káros állapothatásra azt, aki megissza. Egy célpontra is rá lehet dobni, hogy megtisztítsa azt.
items.potions.exotic.potionofcleansing$cleanse.name=megtisztítva
items.potions.exotic.potionofcleansing$cleanse.desc=Ez a karakter átmenetileg immunis minden káros állapothatásra!\n\nHátralévő körök: %s.

items.potions.exotic.potionofcorrosivegas.name=marógázital
items.potions.exotic.potionofcorrosivegas.desc=Ha ezt a nyomás alatt álló üveget kinyitod vagy összetöröd, a tartalma halálos, rozsdaszínű, maró hatású gázfelhővé robban. Ez a gáz gyorsabban terjed, mint a mérgező gáz, és halálosabb, de nem is tart olyan sokáig.

items.potions.exotic.potionofdragonsbreath.name=sárkánylehelet-ital
items.potions.exotic.potionofdragonsbreath.prompt=Válaszd ki a gyújtogatás helyét
items.potions.exotic.potionofdragonsbreath.desc=Ez a flaska egy szokatlan vegyületet tartalmaz, amely pillanatokon belül lángra lobban, miután nyállal keveredett. Ha gyorsan kiköpöd a folyadékot, képes leszel tüzet okádni a szádból!

items.potions.exotic.potionofearthenarmor.name=agyagpáncélital
items.potions.exotic.potionofearthenarmor.desc=Bénítás helyett ez a folyadék keményítő hatással bír a bőrre, amely ideiglenesen természetes páncéllá változik.

items.potions.exotic.potionofdivineinspiration.name=isteni ihlet itala
items.potions.exotic.potionofdivineinspiration.no_more_points=Nem kaphatsz már több bónusztehetségpontot.
items.potions.exotic.potionofdivineinspiration.select_tier=Válaszd ki a tehetségszintet, amelyhez két bónuszpontot szeretnél kapni. A pontokat csak akkor költheted el, ha már feloldottad az adott szintet.
items.potions.exotic.potionofdivineinspiration.bonus=+2 tehetségpont!
items.potions.exotic.potionofdivineinspiration.desc=A szent energia folyékony formába öntött erejével ez a nedű isteni erővel ruházza fel, aki megissza, és két bónusztehetségpontot ad neki egy általa választott tehetségszinthez.\n\nEz az ital minden tehetségszinthez csak egyszer használható.

items.potions.exotic.potionofmagicalsight.name=mágikus látás itala
items.potions.exotic.potionofmagicalsight.desc=Miután ezt megittad, az érzékeid rövid időre hihetetlenül magas szintűekké válnak, ami lehetővé teszi, hogy 12 mező sugarú körben átláss a falakon!

items.potions.exotic.potionofmastery.name=szakértelem itala
items.potions.exotic.potionofmastery.prompt=Légy szakértője valaminek
items.potions.exotic.potionofmastery.weapon_easier=A fegyvered könnyebben forgathatóvá válik!
items.potions.exotic.potionofmastery.armor_easier=A páncélodat könnyebb lett viselni!
items.potions.exotic.potionofmastery.desc=Ahelyett, hogy nyers erőt adna, ez a varázsital inkább az elfogyasztójának az izmait hangolja egy adott tárgyra. Ez megkönnyíti a tárgy használatát, mintha, aki megitta az italt, gyakorolt volna a tárggyal, és hozzászoktak volna az izmai.\n\nA kiválasztott fegyver vagy páncél használatához 2-vel kevesebb erőre lesz szükség. Ez a varázsital csak egyszer használható minden tárgyon.

items.potions.exotic.potionofshielding.name=védelmezőital
items.potions.exotic.potionofshielding.desc=Gyógyítás helyett ez a varázsital egy tartós burkot képez az elfogyasztója körül, amely tetemes mértékű sérüléstől megóvja.

items.potions.exotic.potionofshroudingfog.name=elfedő köd itala
items.potions.exotic.potionofshroudingfog.desc=Ha levegővel érintkezik, az üvegcsében lévő folyadék sűrű, füstös ködöt képez, amely gyorsan szétterjed, és korlátozza az ellenség látását.

items.potions.exotic.potionofsnapfreeze.name=hirtelen fagyás itala
items.potions.exotic.potionofsnapfreeze.desc=A vegyszer, amelyet ez a varázsital tartalmaz, azonnal reakcióba lép a levegővel, és rögtön megfagyaszt és meggyökereztet mindent a hatósugarában.

items.potions.exotic.potionofstamina.name=állóképesség itala
items.potions.exotic.potionofstamina.desc=Ezt a különösen édes folyadékot elfogyasztva hosszú időre túltöltődsz energiával, és sokáig iszonyatos sebességgel tudsz majd futni.

items.potions.exotic.potionofstormclouds.name=viharfelhők itala
items.potions.exotic.potionofstormclouds.desc=E varázsital elhajítása után gyorsan terjedő, sűrű gőzfelhő képződik, amely lecsapódik, majd lefolyik a környezetében. A terület nagy része vízzé válik, a tüzes ellenfelek megsérülnek, a csapdák túlterhelődnek és tönkremennek.



###quest items
items.quest.ceremonialcandle.name=szertartási gyertya
items.quest.ceremonialcandle.desc=A használattól leolvadt és egybefolyt gyertyák.\n\nEgyenként haszontalanok, de több gyertya a megfelelő elrendezésben használva összpontosítani tudja az energiát egy megidézési szertartáshoz.
items.quest.ceremonialcandle.discover_hint=Ezt a tárgyat egy bizonyos küldetés során találhatod meg.

items.quest.corpsedust.name=hullapor
items.quest.corpsedust.chill=Végigfut a hideg a hátadon.
items.quest.corpsedust.desc=A hullapor kívülről nem különbözik egy marék közönséges portól, de érzed, hogy gonosz energia lüktet benne.\n\nÉrdemes a lehető leghamarabb megszabadulni tőle.
items.quest.corpsedust.discover_hint=Ezt a tárgyat egy bizonyos küldetés során találhatod meg.

items.quest.darkgold.name=sötétarany-érc
items.quest.darkgold.you_now_have=Most már van %d sötétarany-érced.
items.quest.darkgold.desc=Ezt a fémet nem a színe miatt hívják sötétnek (színre olyan, mint a sima arany), hanem mert napfényben elolvad, így a felszínen használhatatlan.
items.quest.darkgold.discover_hint=Ezt a tárgyat egy bizonyos küldetés során találhatod meg.

items.quest.dwarftoken.name=törpe fémlap
items.quest.dwarftoken.desc=Ilyen ismeretlen rendeltetésű fémlapocskát hord magánál sok törpe és néhány nagyobb teremtményük is. Talán ékszer vagy valamiféle igazolvány lehet. A törpék furcsa népség.
items.quest.dwarftoken.discover_hint=Ezt a tárgyat egy bizonyos küldetés során találhatod meg.

items.quest.embers.name=elementálparázs
items.quest.embers.desc=Ezt a különleges parazsat csak fiatal tűzelementálokból lehet begyűjteni. Hőenergiát sugároz magából.
items.quest.embers.discover_hint=Ezt a tárgyat egy bizonyos küldetés során találhatod meg.

items.quest.escapecrystal.name=szabaduló kristály
items.quest.escapecrystal.ac_use=HASZNÁL
items.quest.escapecrystal.desc=Egy vékony, mágikus varázskristály, amelyben teleportációs varázslat rejlik. A kristályt bármikor használhatod, hogy elhagyd a törpék páncéltermét, de semmit sem vihetsz magaddal!
items.quest.escapecrystal.discover_hint=Ezt a tárgyat egy bizonyos küldetés során találhatod meg.

items.quest.gooblob.name=ragacspaca
items.quest.gooblob.desc=Kocsonyásan remegő paca, amely a Ragacsból szakadt ki, amikor elpusztult. Olyan, mint egy nagy zselégolyó, de azért megenni nem mernéd.\n\nSemmit sem lehet vele csinálni magában, de talán bizonyos varázsitalokkal vagy egy bombával összetéve hasznos lehet. Ha másra nem, arra jó lehet, hogy tisztességes mennyiségű energiává alakítsák.
items.quest.gooblob.discover_hint=Ezt a tárgyat bizonyos ellenségektől kaphatod.

items.quest.metalshard.name=megátkozott fémszilánk
items.quest.metalshard.desc=Egy szilánk rozsdás, megátkozott fémből, amely a DM-300-ról tört le, amikor megsemmisült. Lappangó rosszindulatú mágiát érzel benne.\n\nSemmire sem használható magában, de talán bizonyos tekercsekkel vagy bombával kombinálva hasznos lehet. Ha másra nem, arra jó lesz, hogy egy jó adag energiává átalakítsd.
items.quest.metalshard.discover_hint=Ezt a tárgyat bizonyos ellenségektől kaphatod.

items.quest.pickaxe.name=csákány
items.quest.pickaxe.ability_name=átdöf
items.quest.pickaxe.ability_desc=A párbajhős képes csákánnyal _átdöfni_ az ellenséget. Ez garantáltan betalál, 3 körre sebezhetővé teszi, és _%1$d-%2$d sérülést_ okoz a kemény bőrű ellenségeknek.
items.quest.pickaxe.upgrade_ability_stat_name=Képességsebzés
items.quest.pickaxe.desc=Ez egy erős és nehéz, szikla törésére való szerszám. A bányászathoz nem kell viselned a csákányt, de szükség esetén valószínűleg fegyverként is viselheted.
items.quest.pickaxe.discover_hint=Ezt a tárgyat egy bizonyos küldetés során találhatod meg.

items.quest.ratskull.name=óriás patkánykoponya
items.quest.ratskull.desc=Egy meglepően méretes patkánykoponya. Nagyszerű vadásztrófea lehetne, ha lenne falad, ahova kirakhatnád.



###remains
items.remains.remainsitem.ac_use=HASZNÁL
items.remains.remainsitem.discover_hint=Ezt a tárgyat egy bizonyos hős maradványaiban találhatod meg egy korábban elvesztett futamból.

items.remains.bowfragment.name=íjtöredék
items.remains.bowfragment.desc=Ez a törött fadarab egykor egy vadásznő elveszett lélekíjának része volt. A fadarabban még mindig érzel egy kis természeti energiát, így még használható arra, hogy magas füvet növessz magad köré. Ezzel azonban a fadarab is elpusztul.

items.remains.brokenhilt.name=törött markolat
items.remains.brokenhilt.desc=Ez a törött markolat úgy néz ki, mintha egy legyőzött párbajhős fegyveréből származna. A markolatban még érezhető egy kis harci erő, amelyet arra használhatsz, hogy a következő két sikeres közelharci támadásodhoz egy kis bónuszsebzést kapj. Ezzel azonban a markolat is elpusztul.

items.remains.brokenstaff.name=törött bot
items.remains.brokenstaff.desc=Ez a mágusbot kettétört, miután a tulajdonosa meghalt. Még mindig érezhető, hogy maradt némi mágikus energia a botban, amit arra használhatsz, hogy a pálcáidnak egy kis töltést adj. Ez azonban elpusztítja a bot maradványait.

items.remains.cloakscrap.name=ruhafecni
items.remains.cloakscrap.desc=Ez az áttetsző szövetdarab úgy néz ki, mintha egy néhai zsivány árnyékköpenyéből származna. Még mindig érezhető benne egy kis misztikus energia, amit arra használhatsz, hogy egy kis többlettöltést adj az ereklyéidnek. Ez azonban elpusztítja a szövetdarabkát.

items.remains.sealshard.name=pecséttöredékek
items.remains.sealshard.desc=Ezek az apró, vörös viasztöredékek úgy néznek ki, mintha egy elesett harcos pecsétjének darabjai lennének. Még mindig érezni, hogy egy kis akaraterő tapad a pecséthez, amit arra használhatsz, hogy adj magadnak egy kis védőburkot. Ez azonban elpusztítja a pecséttöredékeket.

items.remains.tornpage.name=kitépett lap
items.remains.tornpage.desc=Ez a papírlap úgy néz ki, mintha egy néhai térítő szentkönyvéből származna. Még mindig érezhető benne egy kis isteni erő, amit arra használhatsz, hogy visszanyerj egy kis életerőt. Ez azonban elpusztítja a kitépett lapot.



###rings
items.rings.ring.diamond=gyémántgyűrű
items.rings.ring.opal=opálgyűrű
items.rings.ring.garnet=gránátgyűrű
items.rings.ring.ruby=rubingyűrű
items.rings.ring.amethyst=ametisztgyűrű
items.rings.ring.topaz=topázgyűrű
items.rings.ring.onyx=ónixgyűrű
items.rings.ring.tourmaline=turmalingyűrű
items.rings.ring.emerald=smaragdgyűrű
items.rings.ring.sapphire=zafírgyűrű
items.rings.ring.quartz=kvarcgyűrű
items.rings.ring.agate=achátgyűrű
items.rings.ring.equip_cursed=A gyűrű fájdalmasan rászorul az ujjadra!
items.rings.ring.unknown_desc=A fémkarikát egy nagy ékkő díszíti, amely csillog a sötétben. Vajon milyen hatással lesz rád, amikor viseled?
items.rings.ring.known=Ez egy %s
items.rings.ring.identify=Most már eléggé kiismerted a gyűrűdet, hogy teljesen azonosítsd.
items.rings.ring.cursed_worn=Mivel a gyűrű átkozott, nincs hatalmad levenni.
items.rings.ring.curse_known=Rosszindulatú mágiát érzel megbújni a gyűrűben.
items.rings.ring.not_cursed=Ez a gyűrű rosszindulatú mágiától mentes.

items.rings.ringofaccuracy.name=pontossággyűrű
items.rings.ringofaccuracy.stats=A gyűrűt viselve _%s%%_-kal megnő a pontosságod.
items.rings.ringofaccuracy.typical_stats=A gyűrűt viselve jellemzően _%s%%_-kal megnő a pontosságod.
items.rings.ringofaccuracy.combined_stats=A gyűrűk, amelyeket viselsz, egyesítik erejüket, és összesen _%s%%_-kal megnövelik a pontosságod.
items.rings.ringofaccuracy.upgrade_stat_name_1=Pontosságnövelés
items.rings.ringofaccuracy.desc=E gyűrű növeli az összpontosító képességed, így támadásaid könnyebben célba érnek. Az elátkozott gyűrű azonban rontja a támadás eredményességét.

items.rings.ringofarcana.name=misztikumok gyűrűje
items.rings.ringofarcana.stats=A gyűrűt viselve a bűvöletek és varázsjelek ereje _%s%%-kal_ nő.
items.rings.ringofarcana.typical_stats=A gyűrűt viselve a bűvöletek és varázsjelek ereje jellemzően _%s%%-kal_ nő.
items.rings.ringofarcana.combined_stats=A gyűrűk, amelyeket viselsz, egyesítik erejüket, és összesen _%s%%_-kal megnövelik a bűvöletek és varázsjelek erejét.
items.rings.ringofarcana.upgrade_stat_name_1=Misztikumerősítés
items.rings.ringofarcana.desc=Ez a gyűrű felerősíti a mágikus bűvöleteket a fegyvereken és a varázsjeleket a páncélokon, beleértve az átkokat is! Először növeli annak az esélyét, hogy ezek kifejtsék hatásukat, majd ha már ez az esély elérte a 100%-ot, akkor növeli a hatás erősségét. Az átkozott gyűrű ehelyett gyengíti a bűvöleteket, varázsjeleket és átkokat.

items.rings.ringofelements.name=elemek gyűrűje
items.rings.ringofelements.stats=Ha viseled, ez a gyűrű _%s%%_ elemi ellenállást biztosít.
items.rings.ringofelements.typical_stats=Ha viseled, ez a gyűrű jellemzően _%s%%_ elemi ellenállást biztosít.
items.rings.ringofelements.combined_stats=A gyűrűk, amelyeket viselsz, egyesítik erejüket, és összesen _%s%%_ elemi ellenállást biztosítanak.
items.rings.ringofelements.upgrade_stat_name_1=Ellenállás
items.rings.ringofelements.desc=Ez a gyűrű ellenállást biztosít a legtöbb elemi és mágikus hatással szemben, csökkenti a sérülést és a negatív hatások idejét. Természetesen egy megátkozott gyűrű ehelyett súlyosbítja ezeket a hatásokat.

items.rings.ringofenergy.name=energiagyűrű
items.rings.ringofenergy.stats=Ha viseled, ez a gyűrű _%s%%_-kal növeli a pálcák, az ereklyék és a hősi páncél töltési sebességét.
items.rings.ringofenergy.typical_stats=Ha viseled, ez a gyűrű jellemzően _%s%%_-kal növeli a pálcák, az ereklyék és a hősi páncél töltési sebességét.
items.rings.ringofenergy.combined_stats=A gyűrűk, amelyeket viselsz, egyesítik erejüket, és összesen _%s%%_-kal megnövelik a töltési sebességet.
items.rings.ringofenergy.upgrade_stat_name_1=Töltésgyorsítás
items.rings.ringofenergy.desc=A mágikus felszereléseid gyorsabban töltődnek fel a gyűrűből sugárzó misztikus mezőben. Egy elátkozott gyűrű lassítja a feltöltődést.

items.rings.ringofevasion.name=kijátszás gyűrűje
items.rings.ringofevasion.stats=Ha viseled, ez a gyűrű _%s%%-kal_ növeli a kijátszásodat.
items.rings.ringofevasion.typical_stats=Ha viseled, ez a gyűrű jellemzően _%s%%-kal_ növeli meg a kijátszásodat.
items.rings.ringofevasion.combined_stats=A gyűrűk, amelyeket viselsz, egyesítik erejüket, és összesen _%s%%-kal_ növelik meg a kijátszásodat.
items.rings.ringofevasion.upgrade_stat_name_1=Kijátszásnövelés
items.rings.ringofevasion.desc=Ez a gyűrű felgyorsítja a viselője reakcióit, akit így nehezebben lehet megütni. Egy megátkozott gyűrű viselőjét viszont könnyebb megütni.

items.rings.ringofforce.name=nyerserő-gyűrű
items.rings.ringofforce.stats=A jelenlegi erőddel ez a gyűrű _%1$d-%2$d sebzést_ okoz, ha fegyvertelen vagy. Fegyvert viselve ez a gyűrű _%3$d_ egységgel növeli meg a sebzésed.
items.rings.ringofforce.typical_stats=A jelenlegi erőddel ez a gyűrű jellemzően _%1$d-%2$d sebzést_ okoz, ha fegyvertelen vagy. Fegyvert viselve ez a gyűrű jellemzően _%3$d_ egységgel növeli meg a sebzésed.
items.rings.ringofforce.combined_stats=A gyűrűk, amelyeket viselsz, egyesítik erejüket, és összesen _%1$d-%2$d sebzést_ okoznak, ha fegyvertelen vagy, vagy megnövelik a fegyver sebzését _%3$d_ egységgel.
items.rings.ringofforce.upgrade_stat_name_1=Fegyvertelen sebzés
items.rings.ringofforce.upgrade_stat_name_2=Fegyveres sebzés növelése
items.rings.ringofforce.upgrade_stat_name_3=Képességsebzés
items.rings.ringofforce.ability_name=ökölvívó alapállás
items.rings.ringofforce.typical_ability_desc=A párbajhős ezzel a gyűrűvel felveheti az _ökölvívó alapállást_, miáltal minden közönséges támadása használni fogja ezt a gyűrűt, még ha fegyvert is visel. Ezek a támadások jellemzően _%1$d-%2$d sebzést_ okoznak, és a fegyver bűvöletét és bővítéseit is kiváltják. Ez a beállás 50%%-kal lassítja a fegyverek újratöltési sebességét.
items.rings.ringofforce.ability_desc=A párbajhős ezzel a gyűrűvel felveheti az _ökölvívó alapállást_, miáltal minden közönséges támadása használni fogja ezt a gyűrűt, még ha fegyvert is visel. Ezek a támadások _%1$d-%2$d sebzést_ okoznak, és a fegyver bűvöletét és bővítéseit is kiváltják. Ez a beállás 50%%-kal lassítja a fegyverek újratöltési sebességét.
items.rings.ringofforce.desc=Ez a gyűrű fokozza a viselője közelharci ütéseinek erejét. Ez az erőtöbblet elég csekély, ha fegyvert viselsz, de a fegyvertelen támadásaid sokkal erősebbé válnak. Egy megátkozott gyűrű ehelyett gyengíti a közelharci ütéseid erejét.
items.rings.ringofforce$brawlersstance.name=ökölvívó alapállás
items.rings.ringofforce$brawlersstance.desc=Ebben a beállásban a párbajhős közönséges támadásai használják az ujjára húzott erőgyűrűt, még akkor is, ha fegyvert visel. Ezek a támadások bónuszsebzést okoznak, és továbbra is kiváltják a fegyver bővítéseit és bűvöletét.\n\nEnnek a beállásnak a fenntartása azonban összpontosítást igényel, és 50%-kal csökkenti a fegyverek képességének újratöltési sebességét.\n\nEz a beállás az erőgyűrű használatával ki- és bekapcsolható, de a töltési sebesség csökkenése egy kis ideig fennmarad, ha a beállást gyorsan be- és kikapcsolják.

items.rings.ringoffuror.name=tombolásgyűrű
items.rings.ringoffuror.stats=A gyűrűt viselve _%s%%_-kal megnő a támadásaid sebessége.
items.rings.ringoffuror.typical_stats=A gyűrűt viselve jellemzően _%s%%_-kal megnő a támadásaid sebessége.
items.rings.ringoffuror.combined_stats=A gyűrűk, amelyeket viselsz, egyesítik erejüket, és összesen _%s%%_-kal megnövelik a támadásaid sebességét.
items.rings.ringoffuror.upgrade_stat_name_1=Támadási sebesség növelése
items.rings.ringoffuror.desc=A gyűrű viselőjén tomboló düh lesz úrrá, amitől támadásai felgyorsulnak. Ha a gyűrű átkozott, akkor lelassítja a viselője támadásait.

items.rings.ringofhaste.name=sietséggyűrű
items.rings.ringofhaste.stats=A gyűrűt viselve _%s%%_-kal megnő a mozgási sebességed.
items.rings.ringofhaste.typical_stats=A gyűrűt viselve jellemzően _%s%%_-kal megnő a mozgási sebességed.
items.rings.ringofhaste.combined_stats=A gyűrűk, amelyeket viselsz, egyesítik erejüket, és összesen _%s%%_-kal megnövelik a mozgásod sebességét.
items.rings.ringofhaste.upgrade_stat_name_1=Mozgási sebesség növelése
items.rings.ringofhaste.desc=A gyűrű megkönnyíti a viselője mozgását, és ettől emberfeletti sebességgel tud futni. Ha a gyűrű átkozott, megnehezíti a viselője lépteit.

items.rings.ringofmight.name=erőnlétgyűrű
items.rings.ringofmight.stats=A gyűrűt viselve _%1$d_ egységgel megnő az erőd és _%2$s%%_-kal a maximális egészséged.
items.rings.ringofmight.typical_stats=A gyűrűt viselve jellemzően _%1$d_ egységgel megnő az erőd és _%2$s%%_-kal a maximális egészséged.
items.rings.ringofmight.combined_stats=A gyűrűk, amelyeket viselsz, egyesítik erejüket, és összesen _%1$d_ ponttal növelik az erődet és _%2$s%%_-kal a maximális életerődet.
items.rings.ringofmight.upgrade_stat_name_1=Erőnövelés
items.rings.ringofmight.upgrade_stat_name_2=Maximális életerő növelése
items.rings.ringofmight.desc=A gyűrű javítja a viselője fizikumát, és megnöveli a testi erejét és állóképességét. Ha a gyűrű átkozott, meggyengíti a viselőjét.

items.rings.ringofsharpshooting.name=mesterlövészgyűrű
items.rings.ringofsharpshooting.stats=A gyűrűt viselve dobófegyvereid sebzése olyan mértékben nő meg, mintha azok _%1$d_ szinttel fel lettek volna fejlesztve, tartósságuk pedig _%2$s%%_-kal lesz magasabb.
items.rings.ringofsharpshooting.typical_stats=A gyűrűt viselve dobófegyvereid sebzése jellemzően olyan mértékben nő meg, mintha azok _%1$d_ szinttel fel lettek volna fejlesztve, tartósságuk pedig _%2$s%%_-kal lesz magasabb.
items.rings.ringofsharpshooting.combined_stats=A gyűrűk, amelyeket viselsz, egyesítik erejüket, és a dobófegyvereid összesen _%1$d_ fejlesztési szinttel lesznek erősebbek, továbbá _%2$s%%_-kal megnő a tartósságuk.
items.rings.ringofsharpshooting.upgrade_stat_name_1=Szintsebzésnövelés
items.rings.ringofsharpshooting.upgrade_stat_name_2=Tartósságnövelés
items.rings.ringofsharpshooting.desc=A gyűrű javítja a viselője célzóképességét és pontosságát, amitől minden dobófegyvere erősebbé és tartósabbá válik. Ha a gyűrű átkozott, ellentétes hatást fejt ki.

items.rings.ringoftenacity.name=állhatatossággyűrű
items.rings.ringoftenacity.stats=A gyűrű akár _%s%%_-kal mérsékelheti a téged ért sérüléseket, amikor viseled.
items.rings.ringoftenacity.typical_stats=A gyűrű jellemzően akár _%s%%_-kal mérsékelheti a téged ért sérüléseket, amikor viseled.
items.rings.ringoftenacity.combined_stats=A gyűrűk, amelyeket viselsz, egyesítik erejüket, és összesen akár _%s%%_-kal csökkenthetik a sérülést, amit elszenvedsz.
items.rings.ringoftenacity.upgrade_stat_name_1=Maximális sérüléscsökkentés
items.rings.ringoftenacity.desc=A gyűrű viselője képes ellenállni olyan ütéseknek is, amelyek egyébként végzetesek volnának. Minél sérültebb, aki viseli, annál ellenállóbbá válik a további sérülésekkel szemben. Ha a gyűrű átkozott, az ellenségek könnyebben végeznek a viselőjével.

items.rings.ringofwealth.name=gazdagsággyűrű
items.rings.ringofwealth.stats=A gyűrűt viselve _%s%%-kal_ megnő a szerencséd.
items.rings.ringofwealth.typical_stats=A gyűrűt viselve jellemzően _%s%%-kal_ megnő a szerencséd.
items.rings.ringofwealth.combined_stats=A gyűrűk, amelyeket viselsz, egyesítik erejüket, és összesen _%s%%_-kal növelik meg a szerencsédet.
items.rings.ringofwealth.upgrade_stat_name_1=Szerencsenövelés
items.rings.ringofwealth.desc=Ez a gyűrű mágnesként vonzza a kincseket, és megnöveli az esélyét, hogy az ellenségeknél és a ládákban értékes dolgokat találj. Ha a gyűrű átkozott, kisebb a zsákmány esélye.



###scrolls
items.scrolls.scroll.ac_read=ELOLVAS
items.scrolls.scroll.kaunan=KAUNAN tekercs
items.scrolls.scroll.sowilo=SOWILO tekercs
items.scrolls.scroll.laguz=LAGUZ tekercs
items.scrolls.scroll.yngvi=YNGVI tekercs
items.scrolls.scroll.gyfu=GYFU tekercs
items.scrolls.scroll.raido=RAIDO tekercs
items.scrolls.scroll.isaz=ISAZ tekercs
items.scrolls.scroll.mannaz=MANNAZ tekercs
items.scrolls.scroll.naudiz=NAUDIZ tekercs
items.scrolls.scroll.berkanan=BERKANAN tekercs
items.scrolls.scroll.odal=ODAL tekercs
items.scrolls.scroll.tiwaz=TIWAZ tekercs
items.scrolls.scroll.unknown_desc=Kibetűzhetetlen varázsrúna van írva a pergamenre. Mi történhet, ha felolvassák?
items.scrolls.scroll.blinded=Megvakulva nem tudsz tekercset olvasni.
items.scrolls.scroll.no_magic=Nem tudsz tekercset olvasni, ameddig immunis vagy a mágiára.
items.scrolls.scroll.cursed=A megátkozott varázskönyved nem engedi, hogy megidézd a tekercs varázserejét! Talán az átoklevétel-tekercs elég erős hozzá, hogy ennek ellenére is működjön...
items.scrolls.scroll$placeholder.name=tekercs

items.scrolls.inventoryscroll.warning=Biztos vagy benne, hogy nem használod ki ennek a tekercsnek a hatását? A tekercs még nincs azonosítva, így mindenképpen elhasználódik.
items.scrolls.inventoryscroll.yes=Igen, biztos
items.scrolls.inventoryscroll.no=Nem, meggondoltam

items.scrolls.scrollofidentify.name=azonosítótekercs
items.scrolls.scrollofidentify.inv_title=Azonosíts valamit
items.scrolls.scrollofidentify.it_is=A tárgyad most már azonosítható, ami egy %s.
items.scrolls.scrollofidentify.desc=Ez a tekercs végleg feltárja egy tárgy minden titkát.

items.scrolls.scrolloflullaby.name=altatódaltekercs
items.scrolls.scrolloflullaby.sooth=A tekercsből nyugtató dallam hangja száll fel. Nagyon elálmosodtál.
items.scrolls.scrolloflullaby.desc=A tekercset olvasva andalító dallam száll fel, amely mély, mágikus álomba ringat mindenkit, aki csak meghallja. A felolvasó és csatlósai az alvástól jobban lesznek.

items.scrolls.scrollofmagicmapping.name=varázstérképtekercs
items.scrolls.scrollofmagicmapping.layout=Megismerted a szint alaprajzát.
items.scrolls.scrollofmagicmapping.desc=A tekercs felolvasásakor kristálytiszta kép vésődik az emlékezetedbe a szint pontos alaprajzáról, valamint a rejtett titkokról. A tárgyak és lények helye viszont ismeretlen marad számodra.

items.scrolls.scrollofmirrorimage.name=tükörképtekercs
items.scrolls.scrollofmirrorimage.copies=A tekercs tükörképeket alkot rólad.
items.scrolls.scrollofmirrorimage.no_copies=A tekercs megpróbál tükörképeket alkotni rólad, de nincs elég hely nekik.
items.scrolls.scrollofmirrorimage.desc=A tekercs varázsigéje két hamis ikerpárt alkot a felolvasójából. Ezek a tükörképek a felolvasó gyengített klónjai, amelyek az ellenségek nyomába erednek. Tartósnak viszont nem mondhatók, és eltűnnek, amint sérülést szenvednek.

items.scrolls.scrollofretribution.name=megtorlótekercs
items.scrolls.scrollofretribution.blast=Erőteljes mágikus energia tör elő a tekercsből!
items.scrolls.scrollofretribution.desc=A tekercs romboló energiát tartalmaz, amely a felolvasója fájdalmait egy energiarobbanásba vezeti. Minél gyengébb a felolvasó, annál nagyobb sebzést tud okozni. Nagyon alacsony egészségnél az ellenségek java részét a tekercs azonnal megöli.\n\nA tekercs használatának azonban az az ára, hogy elvakítja és legyengíti a felolvasót.

items.scrolls.scrollofrage.name=dühtekercs
items.scrolls.scrollofrage.roar=A tekercsből előtörő bőszítő üvöltés végigvisszhangzik a kazamatákon!
items.scrolls.scrollofrage.desc=Felolvasáskor a tekercs hatalmas üvöltést hallat, amely minden ellenséget a felolvasóhoz vonz, a közelieket pedig feldühíti.

items.scrolls.scrollofrecharging.name=energiatekercs
items.scrolls.scrollofrecharging.surge=Energia járja át a testedet, amely felpezsdíti a varázspálcáidat!
items.scrolls.scrollofrecharging.desc=Ahogy a pergamenben rejlő nyers varázserő kiszabadul, egy ideig tölti a használója minden varázspálcáját.

items.scrolls.scrollofremovecurse.name=átoklevétel-tekercs
items.scrolls.scrollofremovecurse.inv_title=Tisztíts meg valamit
items.scrolls.scrollofremovecurse.cleansed=Tisztító fény ragyogja át a tárgyadat, és elűzi a gonosz energiát!
items.scrolls.scrollofremovecurse.not_cleansed=Tisztító fény ragyogja át a tárgyadat, de nem történik semmi.
items.scrolls.scrollofremovecurse.spirit=Tekercsed felszabadítja a meggyötört lelket!
items.scrolls.scrollofremovecurse.desc=A tekercsen lévő varázsige azonnal eltávolít bármilyen átkot egy fegyverről, gyűrűről, varázspálcáról, páncélról vagy ereklyéről.

items.scrolls.scrollofteleportation.name=teleporttekercs
items.scrolls.scrollofteleportation.tele=Egy szempillantás alatt az emelet egy másik pontjára teleportáltál.
items.scrolls.scrollofteleportation.no_tele=A teleportmágia meghiúsult.
items.scrolls.scrollofteleportation.cant_reach=Nem tudsz ide teleportálni.
items.scrolls.scrollofteleportation.prompt=Hova teleportálsz?
items.scrolls.scrollofteleportation.desc=A pergamenen lévő varázsige az emelet egy másik pontjára juttatja a felolvasóját. A tekercs előnyben részesíti azokat a területeket, ahol a felolvasó még nem járt, viszont nem képes bezárt ajtók és torlaszok mögé teleportálni. Felfedhet viszont titkos ajtókat, melyek új területekre vezetnek.

items.scrolls.scrollofterror.name=rémülettekercs
items.scrolls.scrollofterror.none=A tekercsből ragyogó piros fény villan fel.
items.scrolls.scrollofterror.one=A tekercsből ragyogó piros fény villan fel, és egy %s elmenekül!
items.scrolls.scrollofterror.many=A tekercsből ragyogó piros fény villan fel, és a lények elmenekülnek!
items.scrolls.scrollofterror.desc=Amikor elolvasod, ez a tekercs vörös fényt bocsát ki, amely a látómeződben lévő összes ellenséget rémülettel tölti el, azok pedig megfordulnak és elmenekülnek. A menekülő ellenség megtámadása lerövidíti a hatást.

items.scrolls.scrolloftransmutation.name=átváltoztatótekercs
items.scrolls.scrolloftransmutation.inv_title=Változtass át valamit
items.scrolls.scrolloftransmutation.nothing=Semmi érdekes nem történik.
items.scrolls.scrolloftransmutation.morph=A tárgyad átváltozik valami mássá!
items.scrolls.scrolloftransmutation.desc=Ez a tekercs erős átváltoztatómágiát tartalmaz. Ha egy alkalmas tárgyon használod, akkor azt egy ugyanolyan típusú, de másik tárggyá alakítja át. A mágia még a fejlesztéseket, bűvöleteket és varázsjeleket is megőrzi. A tekercsek és varázsitalok átváltoznak egzotikus megfelelőjükké, és fordítva.

items.scrolls.scrollofupgrade.name=fejlesztéstekercs
items.scrolls.scrollofupgrade.inv_title=Fejlessz valamit
items.scrolls.scrollofupgrade.weaken_curse=A fejlesztéstekercs gyengítette az átkot a tárgyon.
items.scrolls.scrollofupgrade.remove_curse=A fejlesztéstekercs megtisztította a tárgyat az átoktól.
items.scrolls.scrollofupgrade.desc=Ezzel a tekerccsel egyetlen tárgy vagy dobófegyver-készlet fejleszthető fel. A varázspálcák ereje és töltésszáma nő, a fegyverek és páncélok több sebzést okoznak és védenek ki, a dobófegyver-készletek teljesen megjavulnak és tartósabbak lesznek, a gyűrűk hatása pedig fokozódik.\n\nMég az átkokat is gyengítheti, vagy akár teljesen leveheti, bár nem olyan hatásos, mint az átoklevétel-tekercs. Sajnos a fejlesztővarázslat a magasabb szintű felszerelésen lévő bűvöleteket vagy varázsjeleket is törölheti.



###exotic scrolls
items.scrolls.exotic.exoticscroll.kaunan=egzotikus KAUNAN tekercs
items.scrolls.exotic.exoticscroll.sowilo=egzotikus SOWILO tekercs
items.scrolls.exotic.exoticscroll.laguz=egzotikus LAGUZ tekercs
items.scrolls.exotic.exoticscroll.yngvi=egzotikus YNGVI tekercs
items.scrolls.exotic.exoticscroll.gyfu=egzotikus GYFU tekercs
items.scrolls.exotic.exoticscroll.raido=egzotikus RAIDO tekercs
items.scrolls.exotic.exoticscroll.isaz=egzotikus ISAZ tekercs
items.scrolls.exotic.exoticscroll.mannaz=egzotikus MANNAZ tekercs
items.scrolls.exotic.exoticscroll.naudiz=egzotikus NAUDIZ tekercs
items.scrolls.exotic.exoticscroll.berkanan=egzotikus BERKANAN tekercs
items.scrolls.exotic.exoticscroll.odal=egzotikus ODAL tekercs
items.scrolls.exotic.exoticscroll.tiwaz=egzotikus TIWAZ tekercs
items.scrolls.exotic.exoticscroll.unknown_desc=Egy fénylő, kibetűzhetetlen mágikus rúnát írtak erre a fekete pergamenre. Úgy látszik, mintha idegen világból származna. Ki tudja mi történik, ha felolvassák?
items.scrolls.exotic.exoticscroll.discover_hint=Ezt a tárgyat alkímia segítségével készítheted el.

items.scrolls.exotic.scrollofsirenssong.name=szirénénektekercs
items.scrolls.exotic.scrollofsirenssong.prompt=Válassz célpontot
items.scrolls.exotic.scrollofsirenssong.no_target=A tekercs célpont nélkül lép működésbe.
items.scrolls.exotic.scrollofsirenssong.cancel=Választanod kell egy célpontot.
items.scrolls.exotic.scrollofsirenssong.desc=Ennek a tekercsnek az olvasása egy csábító dallamot bocsát ki, amely lenyűgözi a kiszemelt ellenséget, és tartósan szövetségessé változtatja! A többi ellenséget, aki meghallja, átmenetileg elbájolja.\n\nA különösen erős ellenségek nem hagyják magukat lenyűgözni, de őket is elbájolja.
items.scrolls.exotic.scrollofsirenssong$enthralled.name=lenyűgözött
items.scrolls.exotic.scrollofsirenssong$enthralled.desc=Ezt a teremtményt lenyűgözte a szirének énekét tartalmazó tekercs mágiája.\n\nA lenyűgözött karakter tartós szövetségesed, és minden ellenséggel harcolni fog, akivel találkozik.

items.scrolls.exotic.scrollofantimagic.name=mágiaellenes tekercs
items.scrolls.exotic.scrollofantimagic.desc=A tekercsen található varázsige mágikus aurával vesz körül, amely ideiglenesen semlegesít minden mágikus hatást, legyen az káros vagy hasznos. Ez magában foglalja a legtöbb mágikus tárgy hatását, például pálcákét, tekercsekét, gyűrűkét, ereklyékét, varázslatokét és átkokét. A hősi páncél képességei azonban elég erősek ahhoz, hogy ettől függetlenül működjenek.

items.scrolls.exotic.scrollofchallenge.name=kihívástekercs
items.scrolls.exotic.scrollofchallenge.desc=Ebből a tekercsből hatalmas üvöltés tör elő, amikor felolvassák, amely az ellenségeket a felolvasóhoz vonzza, miközben egy kis küzdőteret hoz létre körülötte.\n\nAmíg a felolvasó ebben a küzdőtérben marad, addig 33%-kal kevesebb sérülést szenved el minden forrásból (ez a sérüléscsökkentés egyéb formái előtt érvényesül), és nem veszíti el a jóllakottságát.\n\nA küzdőtér mérete a felolvasó tartózkodási helyének méretével arányos. Egyes főellenségek területén különösen kicsi lesz.
items.scrolls.exotic.scrollofchallenge$challengearena.name=küzdőtér
items.scrolls.exotic.scrollofchallenge$challengearena.desc=Egy mágikus küzdőtér jelent meg körülötted, amelyet gomolygó vörös köd jelez.\n\nAmíg a ködben állsz, az éhséged nem nő, és 33%%-kal kevesebb sérülést szenvedsz minden forrásból. Ha más is csökkenti a sérülésed (például páncél), annak hatása a 33%%-os csökkentés után érvényesül.\n\nHátralévő körök: %d.

items.scrolls.exotic.scrollofdivination.name=jövendöléstekercs
items.scrolls.exotic.scrollofdivination.nothing_left=Nincs már mit azonosítani!
items.scrolls.exotic.scrollofdivination.desc=Ez a tekercs véletlenszerűen azonosít négy olyan tárgytípust, amelyet jelenleg nem ismersz. Az azonosított típusok lehetnek egy varázsital színe, egy tekercs rúnája vagy egy gyűrű drágaköve. Az azonosított tárgyak nem feltétlenül olyanok, amilyenek nálad vannak.
items.scrolls.exotic.scrollofdivination$wnddivination.desc=A jövendöléstekercsed a következőket azonosította:

items.scrolls.exotic.scrollofdread.name=rettegéstekercs
items.scrolls.exotic.scrollofdread.desc=Amikor elolvasod, ez a tekercs vörös fényt bocsát ki, amely hihetetlen rémületet kelt minden ellenségben, aki a látómeződben van. Olyan nagy ez a hatás, hogy azok gyorsan megpróbálnak majd elmenekülni az egész kazamatából, hogy soha többé ne lássák őket!\n\nA rémülethez hasonlóan ez a hatás is megszűnhet idővel, vagy ha az ellenséget megtámadják.\n\nAz erős akaratú ellenségeknek, például a főellenségeknek, ehelyett a szokásos rémületet fogja okozni.

items.scrolls.exotic.scrollofenchantment.name=bűvölettekercs
items.scrolls.exotic.scrollofenchantment.inv_title=Bűvölj meg valamit
items.scrolls.exotic.scrollofenchantment.weapon=Válassz egy bűvöletet a fegyveredhez!
items.scrolls.exotic.scrollofenchantment.armor=Válassz egy varázsjelet a páncélodhoz!
items.scrolls.exotic.scrollofenchantment.cancel=mégse
items.scrolls.exotic.scrollofenchantment.cancel_warn=Akkor is elhasználódik a bűvölettekercsed, ha nem használod ki a hatását. Biztos vagy benne?
items.scrolls.exotic.scrollofenchantment.cancel_warn_yes=Igen, biztos vagyok benne
items.scrolls.exotic.scrollofenchantment.cancel_warn_no=Nem, meggondoltam magam
items.scrolls.exotic.scrollofenchantment.desc=Ez a tekercs erős mágikus energiát vezet egy fegyverbe vagy páncélba. A felolvasónak van bizonyos fokú befolyása arra, hogy milyen mágia lesz bevezetve.

items.scrolls.exotic.scrollofforesight.name=betekintőtekercs
items.scrolls.exotic.scrollofforesight.desc=E tekercs elolvasása után a felolvasó elméje folyamatosan megtelik a környező terület kristálytiszta képével. Ez a hatás jelentős ideig tart, és minden rejtett ajtót vagy csapdát felfed, így szükségtelenné teszi a keresést.

items.scrolls.exotic.scrollofmetamorphosis.name=metamorfózistekercs
items.scrolls.exotic.scrollofmetamorphosis.choose_desc=Válassz egy tehetséget a metamorfózishoz.
items.scrolls.exotic.scrollofmetamorphosis.replace_desc=Válassz egy új tehetséget, amellyel kicseréled a metamorfózison keresztülmenő tehetséged.
items.scrolls.exotic.scrollofmetamorphosis.cancel_warn=Akkor is elhasználódik a metamorfózistekercsed, ha nem használod ki a hatását. Biztos vagy benne?
items.scrolls.exotic.scrollofmetamorphosis.metamorphose_talent=tehetség metamorfózisa
items.scrolls.exotic.scrollofmetamorphosis.desc=Ez a tekercs erős átváltoztató mágiát tartalmaz, amely a használójára hat, nem pedig egy tárgyra. A tekercs mágiája lehetővé teszi, hogy kiválassz egy tehetséget, és lecseréld öt azonos szintű, különböző hősosztályokból származó tehetség egyikére!\n\nEz a hatás csak az osztály tehetségeire érvényes, az alosztályokból vagy páncélképességekből szerzett tehetségekre nem. A nem használható tehetségek nem lesznek választhatók.

items.scrolls.exotic.scrollofmysticalenergy.name=misztikus energia tekercse
items.scrolls.exotic.scrollofmysticalenergy.desc=Ahogy a pergamenben rejlő nyers varázserő kiszabadul, egy ideig tölti a felolvasó által viselt ereklyéket.

items.scrolls.exotic.scrollofpassage.name=utazótekercs
items.scrolls.exotic.scrollofpassage.desc=Az ezen a pergamenen található varázslat azonnal felteleportálja a felolvasót a legközelebbi régió első emeletére. Nagyon praktikus, ha gyorsan el akarsz jutni egy boltba.

items.scrolls.exotic.scrollofprismaticimage.name=prizmaképtekercs
items.scrolls.exotic.scrollofprismaticimage.desc=A tekercs varázslata színes hamis ikerpárt hoz létre a felolvasóból. Ez a prizmakép a felolvasó gyengébb klónja, ugyanolyan védelemmel, de alacsonyabb életerővel és sebzéssel.\n\nA prizmakép akkor mutatja meg magát, ha ellenséget lát, és megpróbálja megvédeni a felolvasót.\n\nHa a prizmakép már létezik, a tekercs felolvasása teljesen felgyógyítja azt.

items.scrolls.exotic.scrollofpsionicblast.name=pszionikus robbanás tekercse
items.scrolls.exotic.scrollofpsionicblast.ondeath=A pszionikus robbanás széthasítja az elméd...
items.scrolls.exotic.scrollofpsionicblast.desc=Ebben a tekercsben hihetetlen romboló energia van, amivel minden látható teremtény elméjét tönkreteheted.\n\nJelentős mértékű visszacsatolás is fellép azonban, ami során a felolvasó is sérül, megvakul és le is gyengül. Minél több célpontot talál el a tekercs, annál kisebb a saját sérülés.



###spells
items.spells.alchemize.name=alkimizáló
items.spells.alchemize.prompt=Alkimizálj valamit
items.spells.alchemize.desc=Ez a varázslat az alkimista üstben találhatóhoz hasonló átváltoztató erőket tartalmaz. Minden egyes használat lehetővé teszi a használó számára, hogy egy tárgyat (vagy tárgyak halmazát) arannyá vagy alkímiai energiává változtasson. A tekercsek vagy varázsitalok energiává alakítása még azonosítja is őket.\n\nNéhány alkimizálót árulnak boltokban is, de sokkal több készíthető alkímia segítségével egy mag, egy rúnakő és egy kis alkímiai energia vegyítésével.
items.spells.alchemize$wndalchemizeitem.sell=%d arannyá alakít
items.spells.alchemize$wndalchemizeitem.sell_1=Egyet %d arannyá alakít
items.spells.alchemize$wndalchemizeitem.sell_all=Összeset %d arannyá alakít
items.spells.alchemize$wndalchemizeitem.energize=%d energiává alakít
items.spells.alchemize$wndalchemizeitem.energize_1=Egyet %d energiává alakít
items.spells.alchemize$wndalchemizeitem.energize_all=Összeset %d energiává alakít

items.spells.beaconofreturning.name=visszatérés jelzőfénye
items.spells.beaconofreturning.preventing=A hely erős mágikus aurája nem engedi használni a varázslatot!
items.spells.beaconofreturning.creatures=A közel álló lények pszichés aurája nem enged most teleportálni.
items.spells.beaconofreturning.set=A jelzőfény be lett állítva a jelenlegi helyzetedre.
items.spells.beaconofreturning.wnd_body=A beállítás felülírja a jelzőfény előzőleg beállított helyszínét.\n\nA visszatérés az utoljára beállított helyszínre juttat vissza, és a varázslatod egy használatába kerül.
items.spells.beaconofreturning.wnd_set=Beállít
items.spells.beaconofreturning.wnd_return=Visszatér
items.spells.beaconofreturning.desc_set=Ez a jelzőfény valahova a kazamata %d. emeletére van beállítva.
items.spells.beaconofreturning.desc=E bonyolult varázslat képessé tesz arra, hogy egy beállított helyszínre visszatérj, bármilyen messze is legyen az. A varázslat csak a visszatérés során használódik el, bármennyiszer be lehet állítani, de csak az utoljára beállított helyszínre emlékezik.

items.spells.curseinfusion.name=átokbevezetés
items.spells.curseinfusion.inv_title=Átkozz meg valamit
items.spells.curseinfusion.desc=Ez a varázslat belevezeti a DM-300-asban lévő erőteljes rosszindulatú mágiát egy felszerelésbe. A tárgy, amire használják, azonnal elátkozott lesz, és minden bűvölet vagy varázsjel, ami rajta volt, felülíródik.\n\nFegyverek, páncélok és varázspálcák esetében a tárgy az átkozódáson kívül fejlesztéseket is kap. Az átokbevezetéssel járó fejlesztések nem halmozódnak, és elvesznek, ha a tárgyról leveszik az átkot.\n\nAz átokbevezetés többször is használható ugyanarra a fegyverre vagy páncélra, ha a tárgyon lévő átkot másik átokra szeretnéd cserélni.

items.spells.spell.ac_cast=HASZNÁL
items.spells.spell.no_magic=Nem tudsz varázsolni, ameddig varázsimmunitásod van.
items.spells.spell.discover_hint=Ezt a tárgyat alkímia segítségével készítheted el.

items.spells.magicalinfusion.name=mágiabevezetés
items.spells.magicalinfusion.inv_title=Vezess mágiát valamibe
items.spells.magicalinfusion.infuse=A tárgyadba misztikus energiát vezettél!
items.spells.magicalinfusion.desc=Ez a varázslat ugyanolyan mágikus erővel rendelkezik, mint a fejlesztéstekercs, de stabilabb formában.\n\nAmellett, hogy egy tárgyat a szokásos módon felfejleszt, soha nem törli el a bűvöletet, varázsjelet, vagy az átkot.

items.spells.magicalporter.name=mágikus hordár
items.spells.magicalporter.inv_title=Küldj el valamit
items.spells.magicalporter.nowhere=Sehova nem tudod küldeni a tárgyat.
items.spells.magicalporter.desc=Ez a varázslat bármilyen tárgyat átteleportál, amelyen használják. A kereskedő jelzőfényével ellentétben ez a varázslat a tárgyakat a következő főellenség emletének bejáratához teleportálja.

items.spells.phaseshift.name=állapotáthelyezés
items.spells.phaseshift.no_target=Nincs mit teleportálni arról a helyről.
items.spells.phaseshift.desc=Ez a zavaros varázslat bármelyik karaktert, akire irányul, a jelenlegi emelet egy véletlenszerű helyére teleportálja, és jelentős ideig elkábítja. Az erőteljes ellenfelek képesek ellenállni a kábító hatásnak. Ez a varázslat irányulhat egy célpontra vagy magára a használóra.

items.spells.reclaimtrap.name=csapdaáthelyezés
items.spells.reclaimtrap.no_trap=Itt nincs csapda.
items.spells.reclaimtrap.desc_trap=Ez a varázslat jelenleg egy _%s_ hatását válthatja ki.
items.spells.reclaimtrap.desc=Ez a varázslat a DM-300 mechanikai energiájának egy részét tartalmazza. Ha éles csapdán használod, a csapda ereje hozzád vándorol, és lehetővé teszi számodra, hogy kiszabadítsd ezt az erőt, mikor ismét használod a varázslatot, és a csapda hatását bárhol használhasd.\n\nNéhány csapda viszont nem működik mindenhol, és csak egy csapdát lehet eltárolni egyszerre.

items.spells.recycle.name=újrahasznosítás
items.spells.recycle.inv_title=Hasznosíts újra valamit
items.spells.recycle.recycled=A tárgyad %s alakjában hasznosult újjá.
items.spells.recycle.desc=Ez a varázslat az átváltoztatómágia gyengébb formáját tartalmazza. Bár felszerelésen nem működik, ez a varázslat egy tekercset, varázsitalt, magot, rúnakövet vagy bevonatos dárdát egy ugyanolyan típusú, véletlenszerű tárggyá alakít át.

items.spells.summonelemental.name=elementál megidézése
items.spells.summonelemental.ac_imbue=BEOLTOM
items.spells.summonelemental.imbue_prompt=Olts be valamit
items.spells.summonelemental.desc=Ez a varázslat irányítása alatt tartja az elkészítéséhez használt elementálparázs energiáját, és lehetővé teszi, hogy megidézz egy barátságos elementált, hogy harcoljon az oldaladon! Egyszerre csak egy elementált lehet megidézni, de a varázslat költségmentesen újrahasználható, hogy az elementál visszatérjen hozzád.
items.spells.summonelemental.desc_newborn=A varázslat jelenleg még nincs beoltva, és egy távolsági támadásra képtelen _újszülött elementált_ idéz meg. Ha már azonosítottad a folyékony tűz italát, a fagyitalt, az energiatekercset vagy az átváltoztatótekercset, akkor be tudod velük oltani a varázslatot, hogy felerősítsd. Ezt követően már ereje teljében lévő elementálokat fog megidézni!
items.spells.summonelemental.desc_fire=A varázslat most forró érintésű, és egy _tűzelementál_ idézhető meg vele. Beleolthatsz egy másik tárgyat is a varázslatba, de akkor a jelenlegi oltás elvész.
items.spells.summonelemental.desc_frost=A varázslat most hideg érintésű, és egy _fagyelementál_ idézhető meg vele. Beleolthatsz egy másik tárgyat is a varázslatba, de akkor a jelenlegi oltás elvész.
items.spells.summonelemental.desc_shock=A varázslat most statikus töltést sugároz, és egy _sokkoló elementál_ idézhető meg vele. Beleolthatsz egy másik tárgyat is a varázslatba, de akkor a jelenlegi oltás elvész.
items.spells.summonelemental.desc_chaos=A varázslat most zavaros energiát sugároz, és egy _káoszelementál_ idézhető meg vele. Beleolthatsz egy másik tárgyat is a varázslatba, de akkor a jelenlegi oltás elvész.

items.spells.targetedspell.prompt=Válassz célpontot
items.spells.targetedspell.inv_title=Vezess mágiát valamibe

items.spells.telekineticgrab.name=telekinetikus fogás
items.spells.telekineticgrab.cant_grab=Ezt nem tudod megfogni.
items.spells.telekineticgrab.no_target=Nincs semmi itt, amit megfoghatsz.
items.spells.telekineticgrab.desc=Ez a varázslat lehetővé teszi a varázsló számára, hogy távolról magához ragadjon minden tárgyat egy adott helyről, vagy minden dobófegyvert, amely egy adott ellenségbe fúródott!\n\nNem használható olyan tárgyak megragadására, amelyek valaki más tulajdonában vannak, vagy ládák és egyéb tárolók megragadására.

items.spells.unstablespell.name=kiszámíthatatlan varázslat
items.spells.unstablespell.desc=Ennek a kis négyzetes fekete kristálynak minden egyes oldalán váltakozó rúnajelek láthatók.\n\nHa használod, egy véletlenszerű tekercs hatását váltja ki. A tekercs hatása mindig harci jellegű lesz, amennyiben ellenségek vannak a látómeződben, amennyiben pedig nincsenek, akkor viszont mindig nem harci jellegű.

items.spells.wildenergy.name=vad energia
items.spells.wildenergy.desc=A varázslat a DM-300-at működtető elátkozott energia egy részét tartalmazza. Használata tölti a varázspálcáidat és a felszerelésedben lévő ereklyéket, továbbá egy véletlenszerű átkozott pálcahatást vált ki. Azt viszont eldöntheted, hogy merre lőjön ki ez az átkozott mágia.


###runestones
items.stones.inventorystone.ac_use=HASZNÁL

items.stones.runestone$placeholder.name=rúnakő
items.stones.runestone.discover_hint=Ezt a tárgyat véletlenszerűen találhatod meg a várbörtönben, vagy alkímia segítségével készítheted el.

items.stones.stoneofaggression.name=agresszió köve
items.stones.stoneofaggression.desc=Amikor ezt a követ egy szövetségesre vagy ellenségre dobod, minden közeli ellenség rövid ideig inkább az adott karaktert akarja majd megtámadni.\n\n\nA főellenségek azonban ellenállóbbak lehetnek a hatásával szemben, amelynek jelentősen lerövidül az időtartama, továbbá kevesebb sérülést szenvednek el a csatlósaik támadásaitól.
items.stones.stoneofaggression$aggression.name=célba vett
items.stones.stoneofaggression$aggression.desc=A manipulatív mágia minden közeli ellenséget arra késztet, hogy megtámadja ezt a karaktert.\n\nHátralévő körök: %s.

items.stones.stoneofaugmentation.name=bővítés köve
items.stones.stoneofaugmentation.inv_title=Bővíts valamit
items.stones.stoneofaugmentation.desc=Ez a rúnakő hatásos varázslattal rendelkezik, amellyel felszerelést bővíthetsz, hogy egy tulajdonságát fokozd egy másik árán.\n\nFegyveren használva lehetőséged van a gyorsaság vagy a sebzés fokozására. A dobófegyverek a sebességükkel arányosan nyernek vagy veszítenek a tartósságukból. \n\nPáncélon használva a védelmet vagy a kijátszást fokozhatod.
items.stones.stoneofaugmentation.discover_hint=Ezt a tárgyat megvásárolhatod a boltban, vagy elkészítheted alkímiával.
items.stones.stoneofaugmentation$wndaugment.choice=Mit szeretnél fokozni?
items.stones.stoneofaugmentation$wndaugment.speed=Sebesség
items.stones.stoneofaugmentation$wndaugment.damage=Sebzés
items.stones.stoneofaugmentation$wndaugment.evasion=Kijátszás
items.stones.stoneofaugmentation$wndaugment.defense=Védelem
items.stones.stoneofaugmentation$wndaugment.none=Bővítés eltávolítása
items.stones.stoneofaugmentation$wndaugment.cancel=Hagyjuk

items.stones.stoneofblast.name=robbanókő
items.stones.stoneofblast.desc=Ez a rúnakő azonnal felrobban azon a helyen, ahova ledobják. A bombához hasonlóan a robbanás minden közelben lévőt sebez.

items.stones.stoneofblink.name=cikázás köve
items.stones.stoneofblink.desc=Ez a rúnakő oda teleportálja a használóját, ahova dobja.

items.stones.stoneofclairvoyance.name=látnoki képesség köve
items.stones.stoneofclairvoyance.desc=Ez a kő azonnal felfed minden mezőt nagyon széles területen belül, ahová esik. Hatása átér a falakon is.

items.stones.stoneofdeepsleep.name=mély alvás köve
items.stones.stoneofdeepsleep.desc=Amikor ezt a követ egy ellenfélre dobják, az mély, mágikus álomba zuhan. A mágiával altatott ellenségek örökre elalszanak, hacsak meg nem zavarják őket.

items.stones.stoneofdetectmagic.name=mágiaészlelő kő
items.stones.stoneofdetectmagic.inv_title=Vizsgálj meg valamit
items.stones.stoneofdetectmagic.detected_none=A kő nem észlel semmilyen mágiát, amely hatással lenne erre a tárgyra.
items.stones.stoneofdetectmagic.detected_both=A kő jó- és rosszindulatú mágiát is észlel, amely hatással van erre a tárgyra!
items.stones.stoneofdetectmagic.detected_good=A kő jóindulatú mágiát észlel, amely hatással van erre tárgyra!
items.stones.stoneofdetectmagic.detected_bad=A kő rosszindulatú mágiát észlel, amely hatással van erre tárgyra!
items.stones.stoneofdetectmagic.desc=Ez a rúnakő képes észlelni a tárgyakra hatással lévő mágiát. Ha ezt a követ egy azonosítatlan tárgyon használod, kiderítheted, hogy jó- vagy rosszindulatú mágia van-e rá hatással, például bűvölet vagy fejlesztés.

items.stones.stoneofdisarming.name=hatástalanítókő
items.stones.stoneofdisarming.desc=Ez a rúnakő olyan mágiát hordoz, amely hatástalanítja a gonosz rejtett csapdákat bárhol a kazamatában. A dobás helye körüli terület 9 csapdáját tudja semlegesíteni.

items.stones.stoneofenchantment.name=bűvölet köve
items.stones.stoneofenchantment.inv_title=Bűvölj meg valamit
items.stones.stoneofenchantment.weapon=A fegyvered világít a sötétben!
items.stones.stoneofenchantment.armor=A páncélod világít a sötétben!
items.stones.stoneofenchantment.desc=Ez a rúnakő bűvös mágiával rendelkezik. A fejlesztéstekerccsel ellentétben nem közvetlenül növeli egy tárgy erejét, hanem megbűvöli a fegyvert vagy a páncélt, és új képességet ad neki.

items.stones.stoneoffear.name=félelem köve
items.stones.stoneoffear.desc=Amikor ezt a követ egy karakterre dobják, az elborul a rémülettől, megfordul és elmenekül. A menekülő karakter megtámadása lerövidíti a hatást.

items.stones.stoneofflock.name=nyájkő
items.stones.stoneofflock.desc=Ez a rúnakő mágikus bárányokat idéz meg rövid időre a dobás helye körül.

items.stones.stoneofintuition.name=intuíció köve
items.stones.stoneofintuition.inv_title=Válassz egy tárgyat
items.stones.stoneofintuition.desc=Ez a rúnakő az azonosítótekercsben található mágia gyengébb formáját tartalmazza. Ahelyett, hogy közvetlenül azonosítana egy tárgyat, az intuíciódra bízva lehetővé teszi számodra, hogy találgatással azonosíts egy varázsitalt, tekercset vagy gyűrűt.
items.stones.stoneofintuition.break_info=Az intuíció kövét kétszer használhatod, mielőtt eltörne, így _a következő használatkor nem fog megsemmisülni egy köved sem_.
items.stones.stoneofintuition.break_warn=Az intuíció kövei közül használtál már egyet korábban, így _a következő használatkor meg fog semmisülni egy köved_.
items.stones.stoneofintuition$wndguess.text=Találd ki, mi az azonosítatlan tárgy típusa. Ha eltalálod, azonosítod a típust!
items.stones.stoneofintuition$wndguess.correct=Eltaláltad. Azonosítottad a tárgy típusát!
items.stones.stoneofintuition$wndguess.incorrect=Nem találtad el.
items.stones.stoneofintuition$wndguess.break=Az intuíció köve elporlad...

items.stones.stoneofshock.name=sokkolókő
items.stones.stoneofshock.desc=Ez a rúnakő elektromos energiarobbanást bocsájt ki, amely kis időre elkábít minden közelében lévő célpontot, és minden egyes találattal tölti a varázspálcáját annak, aki eldobta.


###trinkets
items.trinkets.chaoticcenser.name=kiszámíthatatlan füstölő
items.trinkets.chaoticcenser.spew=A füstölődből hamarosan %s pöfékelődik ki.
items.trinkets.chaoticcenser.desc=Az alkimista üstben eltöltött idő után ez a tömjénégető füstölő úgy tűnik, hogy magától füstöl! Ezek a gázok felgyülemlenek, és némileg véletlenszerű időközönként kilökődnek a füstölőből az ellenségek felé. Úgy tűnik, képes mindenféle gázt termelni, de kapni fogsz erről egy figyelmeztetést, mielőtt a füstölő működésbe lépne.
items.trinkets.chaoticcenser.typical_stats_desc=Ez a kabala jellemzően körülbelül _%d_ körönként ártalmas gázt bocsát ki egy ellenség közelében. A gáz csak ellenségek jelenlétében jön elő. Magasabb szinteken ezek a gázok nagyobb valószínűséggel lesznek egzotikusak és erősek.
items.trinkets.chaoticcenser.stats_desc=Jelenlegi szintjén ez a kabala körülbelül _%d_ körönként ártalmas gázt bocsát ki egy ellenség közelében. A gáz csak ellenségek jelenlétében jön elő. Magasabb szinteken ezek a gázok nagyobb valószínűséggel lesznek egzotikusak és erősek.

items.trinkets.crackedspyglass.name=repedt távcső
items.trinkets.crackedspyglass.desc=Ez a kézre álló távcső remek és precíz kivitelezésű lenne, ha nem lenne repedés az elülső lencséjén. A távcső úgy tűnik, hogy segít neked, mert új tárgyakat mutat meg a barlangban, de a hibája miatt a feltárt tárgyakat elég nehéz látni!
items.trinkets.crackedspyglass.typical_stats_desc=Általában ez a kabala _%1$s%% eséllyel_ hoz létre egy extra rejtett tárgyat minden nem-főellenséges szinten.
items.trinkets.crackedspyglass.stats_desc=Jelenlegi szintjén ez a kabala _%1$s%% eséllyel_ hoz létre egy extra rejtett tárgyat minden nem-főellenséges szinten.
items.trinkets.crackedspyglass.stats_desc_upgraded=Jelenlegi szintjén ez a kabala _100%% eséllyel_ hoz létre egy extra rejtett tárgyat minden nem-főellenséges szinten, és _%1$s%% eséllyel_ hoz létre egy második extra rejtett tárgyat.

items.trinkets.dimensionalsundial.name=dimenzionális napóra
items.trinkets.dimensionalsundial.warning=A napórád nem vet árnyékot, nyugtalannak érzed magad.
items.trinkets.dimensionalsundial.desc=Ez a kis kézi napóra valahogy képes árnyékot vetni a kazamaták mélyén, még akkor is, ha nem tartod függőlegesen. Még furcsább, hogy az árnyék helyzete, úgy tűnik, nincs összefüggésben a napállással ebben a világban. Ha nem vet árnyékot, a napóra mintha vonzaná a veszélyt.
items.trinkets.dimensionalsundial.typical_stats_desc=Ez a kabala jellemzően _%1$d%%-kal_ csökkenti az ellenségek felbukkanási ütemét, ha a valóságban nappal van (8-tól 20 óráig), és _%2$d%%-kal_ növeli az ellenségek felbukkanási ütemét éjszaka (20-tól 8 óráig).
items.trinkets.dimensionalsundial.stats_desc=Jelenlegi szintjén ez a kabala _%1$d%%-kal_ csökkenti az ellenségek felbukkanási ütemét, ha a valóságban nappal van (8-tól 20 óráig), és _%2$d%%-kal_ növeli az ellenségek felbukkanási ütemét éjszaka (20-tól 8 óráig).

items.trinkets.exoticcrystals.name=egzotikus kristályok
items.trinkets.exoticcrystals.desc=Ezek a kis rózsaszín kristályok ugyanolyan alakúak, mint az alkímiai energia kristályai. Bár közvetlenül nem hasznosíthatók energiaként, úgy tűnik, hogy valahogy befolyásolják a talált varázsitalokat és tekercseket.
items.trinkets.exoticcrystals.typical_stats_desc=Ez a kabala a található varázsitaloknak és tekercseknek jellemzően _%s%%-át_ kicseréli az egzotikus megfelelőikkel. Ez nem vonatkozik az erőitalokra, a fejlesztéstekercsekre vagy a veszélyforrásokat tartalmazó kamrák leküzdéséhez létrehozott tárgyakra.
items.trinkets.exoticcrystals.stats_desc=Jelenlegi szintjén ez a kabala a található varázsitalok és tekercsek _%s%%-át_ kicseréli az egzotikus megfelelőikkel. Ez nem vonatkozik az erőitalokra, a fejlesztéstekercsekre vagy a veszélyforrásokat tartalmazó kamrák leküzdéséhez létrehozott tárgyakra.

items.trinkets.eyeofnewt.name=gőteszem
items.trinkets.eyeofnewt.desc=Ez az arany és fekete gőteszem egy gyakori összetevő, amelyet kabalává léptettek elő. Úgy tűnik, a szem rontja a látásodat, cserébe viszont másképp láthatod a dolgokat.
items.trinkets.eyeofnewt.typical_stats_desc=Ez a kabala jellemzően _%1$s%%-kal_ csökkenti a látótávolságodat, viszont lehetővé teszi, hogy a belső szemeddel lásd az ellenségeket _%2$d_ mező távolságból.
items.trinkets.eyeofnewt.stats_desc=Jelenlegi szintjén ez a kabala _%1$s%%-kal_ csökkenti a látótávolságodat, viszont lehetővé teszi, hogy a belső szemeddel lásd az ellenségeket _%2$d_ mező távolságból.

items.trinkets.ferrettuft.name=vadászgörénybojt
items.trinkets.ferrettuft.desc=Selymes, fehér vadászgörénybojt, amelyet egy Lime zöld szalag tart össze, masnira kötve. A görények mozgékonyságukról, pajkosságukról és feddhetetlenségükről ismertek. Ennek az erőnek egy része mintha kisugárzana a kabalából, fokozva a közelükben tartózkodók kitérését.
items.trinkets.ferrettuft.typical_stats_desc=Jellemzően ez a kabala ennyivel növeli az összes karakter kijátszását: _%1$s%%_.
items.trinkets.ferrettuft.stats_desc=Jelenlegi szintjén ez a kabala ennyivel növeli az összes karakter kijátszását: _%1$s%%_.

items.trinkets.mimictooth.name=utánzófog
items.trinkets.mimictooth.desc=Ezt a nagy, éles fogat bizonyára egy nagyon morcos utánzóból húzták ki. Úgy tűnik, hogy hatással van a börtön utánzóira, és gyakoribbá és veszélyesebbé teszi őket.
items.trinkets.mimictooth.typical_stats_desc=Ez a kabala jellemzően _%1$sx_ gyakoribbá tesz mindenféle utánzót, és nagyon megnehezíti, hogy észrevedd őket, azonban több zsákmányt is lehet tőlük szerezni, mint egyébként. Ezen kívül a kazamata minden emeletén _%2$s%%_ eséllyel találhatsz egy különösen jól rejtőzködő ébenfekete utánzót.
items.trinkets.mimictooth.stats_desc=Jelenlegi szintjén ez a kabala _%1$sx_ gyakoribbá tesz mindenféle utánzót, és nagyon megnehezíti, hogy észrevedd őket, azonban több zsákmányt is lehet tőlük szerezni, mint egyébként. Ezen kívül a kazamata minden emeletén _%2$s%%_ eséllyel találhatsz egy különösen jól rejtőzködő ébenfekete utánzót.

items.trinkets.mossyclump.name=mohás rög
items.trinkets.mossyclump.desc=Úgy tűnik, ez a nedves moharög megtartja a nedvességet, akármilyen erősen is szorítod. Úgy tűnik, hogy magához a börtönhöz köti a varázslat, ami miatt a fű és a víz nagyobb valószínűséggel fordul elő.
items.trinkets.mossyclump.typical_stats_desc=Ez a kabala a közönséges emeletek jellemzően _%d%%-át_ vízzel vagy fűvel borítottá változtatja.\n\nEnnek a kabalának a fejlesztése sok energiába kerül.
items.trinkets.mossyclump.stats_desc=Jelenlegi szintjén ez a kabala a közönséges emeletek _%d%%-át_ vízzel vagy fűvel borítottá változtatja.\n\nEnnek a kabalának a fejlesztése sok energiába kerül.

items.trinkets.parchmentscrap.name=pergamentöredék
items.trinkets.parchmentscrap.desc=Ez a kis pergamendarab úgy néz ki, mintha egy tekercsből származna. Megtartott valamennyit a mágiájából, és úgy tűnik, hogy befolyásolja a kazamatában talált fegyvereket és páncélokat.
items.trinkets.parchmentscrap.typical_stats_desc=Ez a kabala jellemzően _%dx_ gyakoribbá teszi a fegyvereken és páncélokon lévő bűvöleteket és varázsjeleket, és _%sx_ gyakoribbá az átkokat. A pálcákon, gyűrűkön vagy ereklyéken lévő átkokat ez nem érinti.\n\nEnnek a kabalának a fejlesztése sok energiába kerül.
items.trinkets.parchmentscrap.stats_desc=Jelenlegi szintjén ez a kabala _%dx_ gyakoribbá teszi a fegyvereken és páncélokon lévő bűvöleteket és varázsjeleket, és _%sx_ gyakoribbá az átkokat. A pálcákon, gyűrűkön vagy ereklyéken lévő átkokat ez nem érinti.\n\nEnnek a kabalának a fejlesztése sok energiába kerül.

items.trinkets.petrifiedseed.name=megkövült mag
items.trinkets.petrifiedseed.desc=Ez a mag lassú geológiai folyamatok vagy varázslat révén megkövesedett. Úgy tűnik, hogy a mag mágikusan befolyásolja a kazamaták növényvilágát, és időnként rúnakövekkel helyettesíti a növényi magvakat.
items.trinkets.petrifiedseed.typical_stats_desc=Ennek a kabalának a hatására a letaposott fű az esetek jellemzően _%1$s%%-ában_ magok helyett rúnaköveket hullajt, és a magas fűből _%2$s%%-kal_ gyakrabban hullanak tárgyak.
items.trinkets.petrifiedseed.stats_desc=Jelenlegi szintjén ennek a kabalának a hatására a letaposott fű az esetek _%1$s%%-ában_ magok helyett rúnaköveket hullajt, és a magas fűből _%2$s%%-kal_ gyakrabban hullanak tárgyak.

items.trinkets.ratskull.name=patkánykoponya
items.trinkets.ratskull.desc=Ez a hátborzongató kabala nem sokkal nagyobb, mint egy átlagos patkány koponyája, ami valahogy ritkaságnak számít ebben a börtönben. Úgy tűnik, a koponya mágikus hatása vonzza a börtön ritkább lakóit, így azok sokkal gyakrabban jelennek meg.
items.trinkets.ratskull.typical_stats_desc=Ez a kabala jellemzően _%dx_ gyakoribbá teszi a ritka, egzotikus ellenségeket. A koponya viszont csak fele olyan hatásos a kristályláda-utánzók és páncélos szobrok vonzására.
items.trinkets.ratskull.stats_desc=Jelenlegi szintjén ez a kabala _%dx_ gyakoribbá teszi a ritka, egzotikus ellenségeket. A koponya viszont csak fele olyan hatásos a kristályláda-utánzók és páncélos szobrok vonzására.

items.trinkets.saltcube.name=sótömb
items.trinkets.saltcube.desc=Ezt a nagy sókristályt majdnem tökéletesen kocka alakúra vágták, és valahogy sikerült vele felitatni az alkimista üstben lévő víz felét, ahelyett, hogy feloldódott volna benne. Úgy tűnik, hogy mágikus módon kiszárítja és tartósítja az elfogyasztani kívánt ételt, meghosszabbítja a jóllakottságot, de lassítja is az egészség helyreállítását, amikor nem éhezel.
items.trinkets.saltcube.typical_stats_desc=Ez a kabala jellemzően _%1$s%%-kal_ meghosszabbítja az éhség kialakulásának időtartamát, azonban _%2$s%%-kal_ csökkenti az egészség regenerálódásának ütemét is, kivéve, ha az emelet le van zárva.
items.trinkets.saltcube.stats_desc=Jelenlegi szintjén ez a kabala _%1$s%%-kal_ meghosszabbítja az éhség kialakulásának időtartamát, azonban _%2$s%%-kal_ csökkenti az egészség regenerálódásának ütemét is, kivéve, ha az emelet le van zárva.

items.trinkets.shardofoblivion.name=feledés szilánkja
items.trinkets.shardofoblivion.desc=Az alkimista üstben fortyogva ennek a kis átkozott fémszilánknak az anyaga átalakult ... semmivé? A fény mintha meghajolna körülötte, és ha elengeded, egy helyben lebeg. Úgy tűnik, hogy a szilánk mágikus erőt merít a tudatlanságodból, ezért valószínűleg az a legjobb, ha nem gondolsz rá túl sokat.
items.trinkets.shardofoblivion.typical_stats_desc=Ennek a kabalának a hatására az ellenségek gyakrabban hagynak hátra zsákmányt, méghozzá minden egyes azonosítatlan felszerelés után, amelyet viselsz, vagy nemrégiben használtál, de legfeljebb _%d tárgy után_, jellemzően tárgyanként 20%%-kal nő meg a gyakoriság. A szilánk ugyanakkor megakadályozza azt, hogy önállóan azonosítsd a felszereléseket, viszont segítségével szándékosan azonosíthatod az arra készen álló tárgyakat.
items.trinkets.shardofoblivion.stats_desc=Ennek a kabalának a hatására az ellenségek gyakrabban hagynak hátra zsákmányt, méghozzá minden egyes azonosítatlan felszerelés után, amelyet viselsz, vagy nemrégiben használtál, de jelenlegi szintjén legfeljebb _%d tárgy után_, tárgyanként 20%%-kal nő meg a gyakoriság. A szilánk ugyanakkor megakadályozza azt, hogy önállóan azonosítsd a felszereléseket, viszont segítségével szándékosan azonosíthatod az arra készen álló tárgyakat.
items.trinkets.shardofoblivion.ac_identify=AZONOSÍT
items.trinkets.shardofoblivion.identify_prompt=Azonosíts valamit
items.trinkets.shardofoblivion.identify_ready=Egy tárgy készen áll az azonosításra: %s. Használd rajta a Feledés szilánkját az azonosításhoz.
items.trinkets.shardofoblivion.identify_ready_worn=Már az összes viselt tárgyad készen áll az azonosításra. Használd a Feledés szilánkját a tárgyakon, hogy azonosítsd őket.
items.trinkets.shardofoblivion.identify_not_yet=Ez a tárgy még nem áll készen az azonosításra.
items.trinkets.shardofoblivion.identify=Azonosítottad a tárgyat.
items.trinkets.shardofoblivion$wandusetracker.name=Azonosítatlan pálcát használtál
items.trinkets.shardofoblivion$wandusetracker.desc=Nemrégiben használtál egy azonosítatlan varázspálcát, ami egy kis ideig beleszámít a feledés szilánkja által számon tartott azonosítatlan felszerelések közé.\n\nHátralévő körök: %s.
items.trinkets.shardofoblivion$thrownusetracker.name=Azonosítatlan dobófegyvert használtál
items.trinkets.shardofoblivion$thrownusetracker.desc=Nemrég használtál egy azonosítatlan dobófegyvert, ami egy darab azonosítatlan felszereléshasználatnak számít a feledés szilánkjánál egy kis ideig.\n\nHátralévő körök: %s.

items.trinkets.thirteenleafclover.name=tizenhárom levelű lóhere
items.trinkets.thirteenleafclover.desc=Valahogy az alkimista üstben fortyogva ez a lóhere egy csomó plusz levelet növesztett! Nem igazán világos, hogy ez a kabala szerencsét vagy balszerencsét hoz, talán ez a kabala kiszámíthatatlanabbá teszi a szerencsédet?
items.trinkets.thirteenleafclover.typical_stats_desc=E kabala hatására az esetek jellemzően _%1$d%%-ában_ a lehető legnagyobb sebzést fogod okozni, és az esetek _%2$d%%-ában_ a lehető legkisebb sebzést.
items.trinkets.thirteenleafclover.stats_desc=Jelenlegi szintjén e kabala hatására az esetek _%1$d%%-ában_ a lehető legnagyobb sebzést fogod okozni, és az esetek _%2$d%%-ában_ a lehető legkisebb sebzést.

items.trinkets.trapmechanism.name=csapdamechanizmus
items.trinkets.trapmechanism.desc=A kazamata egyik veremcsapdáját működtető gépezet, amelyet óvatosan kivájtak a padlóból, hogy el lehessen vinni. Úgy tűnik, magához a börtönhöz köti a varázslat, így a veszélyforrásokat rejtő terep gyakoribbá válik, de jobban észre is fogod venni őket.
items.trinkets.trapmechanism.typical_stats_desc=Jelenlegi szintjén ez a kabala a közönséges emeletek jellemzően _%1$d%%-át_ csapdákkal vagy szakadékokkal borítottá változtatja. Ezen kívül a kazamata rejtett csapdáinak _%2$d%%-a_ látható is lesz.
items.trinkets.trapmechanism.stats_desc=Jelenlegi szintjén ez a kabala a közönséges emeletek _%1$d%%-át_ csapdákkal vagy szakadékokkal borítottá változtatja. Ezen kívül a kazamata rejtett csapdáinak _%2$d%%-a_ látható is lesz.

items.trinkets.vialofblood.name=vérfiola
items.trinkets.vialofblood.desc=Ez a vékony fiola a börtön valamelyik lakójának vérét tartalmazza, lassan mozog, ahogy forgatod a fiolát. Úgy tűnik, hogy mágikusan erősíti, ugyanakkor késlelteti is az erősebb gyógyító hatásokat.
items.trinkets.vialofblood.typical_stats_desc=Ez a kabala jellemzően _%1$s%%-kal_ növeli a gyógyitalok, a vizestömlő vagy a gyógykutak által visszaállított egészség mértékét. Ugyanakkor ezek a gyógyító hatások lassabban is érvényesülnek majd, és legfeljebb _%2$s_ HP-t állítanak vissza körönként (a hős szintjétől függően).
items.trinkets.vialofblood.stats_desc=Jelenlegi szintjén ez a kabala _%1$s%%-kal_ növeli a gyógyitalok, a vizestömlő vagy a gyógykutak által visszaállított egészség mértékét. Ugyanakkor ezek a gyógyító hatások lassabban is érvényesülnek majd, és legfeljebb _%2$s_ HP-t állítanak vissza körönként (a hős szintjétől függően).

items.trinkets.wondrousresin.name=csodagyanta
items.trinkets.wondrousresin.desc=Ez a kékesen csillogó gyanta úgy tűnik, mintha egy elátkozott pálca varázslatának desztillált esszenciája lenne. Az alkimista üstből származó mágia úgy tűnik, hogy némileg stabilizálta, és most hatással van a pálcáidra.
items.trinkets.wondrousresin.typical_stats_desc=Ez a kabala az esetek jellemzően _%1$s%%-ában_ az átkozott pálcákból semleges vagy kedvező hatást kényszerít ki, és a nem átkozott pálcákból az esetek _%2$s%%-ában_ kikényszerít még egy semleges vagy kedvező hatású átkozott lövést is.\n\nEnnek a kabalának a fejlesztése sok energiába kerül.
items.trinkets.wondrousresin.stats_desc=Jelenlegi szintjén ez a kabala az esetek _%1$s%%-ában_ az átkozott pálcákból semleges vagy kedvező hatást kényszerít ki, és a nem átkozott pálcákból az esetek _%2$s%%-ában_ kikényszerít még egy semleges vagy kedvező hatású átkozott lövést is.\n\nEnnek a kabalának a fejlesztése sok energiába kerül.

items.trinkets.trinketcatalyst.name=mágikus katalizátor
items.trinkets.trinketcatalyst.window_title=egy kabala készítése
items.trinkets.trinketcatalyst.window_text=A víz fortyogni kezd amint hozzáadod a katalizátort. A közelben van néhány tárgy, amit átitathatsz energiával, hogy mágikus kabalává változtasd őket.
items.trinkets.trinketcatalyst.desc=Ez a mágikus aranyporból álló gömb csillog a kazamata sötétjében. Egy alkimista üstnél ebből a katalizátorból saját kabalát készíthetsz egy kis alkímiai energia segítségével.\n\nA kabalák különböző hatásokat biztosítanak, amelyek kissé megváltoztatják a kazamatát vagy annak lakóit. A kabalát további energia felhasználásával fejleszteni lehet, hogy a hatása erősebb legyen, vagy el lehet dobni, hogy teljesen megszabadulj a hatásától.
items.trinkets.trinketcatalyst$randomtrinket.name=véletlenszerű kabala
items.trinkets.trinketcatalyst$randomtrinket.desc=Van egy tárgy a közelben, csak benne van egy zacskóban, amit nem tudsz kinyitni.\n\nAz alkímiai folyamat közben a zacskó szét fog főni, de addig nem tudod meg, hogy milyen kabalát kapsz, amíg meg nem csinálod!

items.trinkets.trinket.discover_hint=Ennek a tárgynak esélye van megjelenni lehetőségként, amikor alkímiával kabalát készítesz.
items.trinkets.trinket$placeholder.name=kabala

###wands
items.wands.cursedwand.ondeath=Az általad használt %s végzett veled.
items.wands.cursedwand.nothing=Nem történt semmi.
items.wands.cursedwand.mass_invuln=Ragyogó fény tör elő a pálcádból!
items.wands.cursedwand.petrify=Hirtelen helyben megdermedsz!
items.wands.cursedwand.grass=Fű nő körülötted!
items.wands.cursedwand.fire=Valami ég...
items.wands.cursedwand.transmogrify_wand=A pálcád valami más tárggyá torzul!
items.wands.cursedwand.transmogrify_other=A tárgyad valami mássá torzul!
items.wands.cursedwand.disguise=A megjelenésed a szemed láttára megváltozik!
items.wands.cursedwand.supernova=Egy lángoló energiagömb kezd növekedni. Talán jobb lesz, ha elfutsz!
items.wands.cursedwand.supernova_positive=Egy lángoló energiagömb kezd növekedni, de valahogy biztonságban érzed magad.
items.wands.cursedwand.sinkhole=Kezd kicsúszni a talaj a lábad alól!
items.wands.cursedwand.sinkhole_positive=Kezd kicsúszni a talaj a lábad alól, mégis sikerült megvetni a lábad.
items.wands.cursedwand.gravity=A gravitáció váratlanul összevissza kezdett hatni!
items.wands.cursedwand.gravity_positive=A gravitáció váratlanul összevissza kezdett hatni, de úgy tűnik, rád ez nem vonatkozik.
items.wands.cursedwand.gravity_end=Vége a gravitációs káosznak.

items.wands.damagewand.upgrade_stat_name_1=Mágikus sebzés

items.wands.wand.ac_zap=LŐ
items.wands.wand.fizzles=A varázspálcád csak sistereg. Talán nem töltődött még fel.
items.wands.wand.no_magic=A varázspálcád csak sistereg. Nem használhatsz pálcákat, amíg varázsimmunitásod van.
items.wands.wand.self_target=Magadat nem célozhatod!
items.wands.wand.identify=Mostanra eléggé kiismerted a varázspálcád, hogy teljesen azonosítsd.
items.wands.wand.resin_one=A misztikus gyanta _1 szinttel_ fokozta ennek a pálcának a fejlettségét.
items.wands.wand.resin_many=A misztikus gyanta _%d szinttel_ fokozta ennek a pálcának a fejlettségét.
items.wands.wand.cursed=Ez a pálca átkozott, ettől kiszámíthatatlanul és vaktában varázsol.
items.wands.wand.not_cursed=A varázspálca rosszindulatú mágiától mentes.
items.wands.wand.curse_discover=Ez egy megátkozott %s!
items.wands.wand.prompt=Hova lősz?
items.wands.wand$placeholder.name=varázspálca

items.wands.wandofblastwave.name=robbanáshullám-varázspálca
items.wands.wandofblastwave.staff_name=robbanáshullám-varázsbot
items.wands.wandofblastwave.ondeath=Megölted magad a saját robbanáshullám-varázspálcáddal...
items.wands.wandofblastwave.knockback_ondeath=Az ütközés végzett veled...
items.wands.wandofblastwave.desc=A pálca egyfajta márványkőből készült, arany díszítéssel és egy kerek, fekete kővel a végén. Kézbe fogva nagyon nehéznek érzed.
items.wands.wandofblastwave.typical_stats_desc=Ez a varázspálca olyan lövedéket lő ki, amely heves robbanást idéz elő a megcélzott területen. A robbanáshullám ereje jellemzően _%1$d-%2$d sebzést_ okoz, és elég erős ahhoz, hogy levegőbe repítse a legtöbb ellenséget.
items.wands.wandofblastwave.stats_desc=Ez a pálca olyan lövedéket lő ki, amelyik a célterületen hatalmasat robban. A robbanás ereje _%1$d-%2$d sebzést_ okoz és annyira erős, hogy a legtöbb ellenséget a levegőbe repíti.
items.wands.wandofblastwave.upgrade_stat_name_2=Hátralökés
items.wands.wandofblastwave.bmage_desc=Amikor a _harci mágus_ a robbanáshullám-varázsbotjával megüt egy bénult ellenségre, az felemészti a bénulást és egy bónusz mágikus sebzéssel járó robbanást okoz. Ennek ellenségenként rövid várakozási ideje van.
items.wands.wandofblastwave.eleblast_desc=A robbanáshullám-varázsbottal előidézett elemi robbanás 67%-os sebzést okoz, és minden ellenséget a robbanási területen kívülre lök.

items.wands.wandofcorrosion.name=maró varázspálca
items.wands.wandofcorrosion.staff_name=maró varázsbot
items.wands.wandofcorrosion.desc=A pálca kőrisfa nyele ragyogó narancssárga drágakőben végződik.
items.wands.wandofcorrosion.stats_desc=Ez a pálca olyan lövedéket lő, amely erősen maró gázfelhővé robban szét a célterületen. Minden, ami ebbe a felhőbe kerül, egyre nagyobb sérülést szenved, ahogy telik az idő, _%d sérülésről_ indulva.
items.wands.wandofcorrosion.upgrade_stat_name_1=Marási sebzés
items.wands.wandofcorrosion.upgrade_stat_name_2=Gáztérfogat
items.wands.wandofcorrosion.bmage_desc=Amikor a _harci mágus_ megüti az ellenséget a maró varázsbottal, előfordulhat, hogy maró váladék teríti be az ellenséget.
items.wands.wandofcorrosion.eleblast_desc=A maró varázsbottal előidézett elemi robbanás 4 körös maró hatásnak teszi ki az ellenségeket, 6 kezdeti sebzéssel.

items.wands.wandofcorruption.name=züllesztő varázspálca
items.wands.wandofcorruption.staff_name=züllesztő varázsbot
items.wands.wandofcorruption.already_corrupted=Ez a karakter már nem befolyásolható jobban.
items.wands.wandofcorruption.desc=A varázspálca kiszámíthatatlan sötét energiát sugároz – már ha nem lenne nyilvánvaló a végére erősített kis díszes koponyáról.
items.wands.wandofcorruption.stats_desc=Ez a varázspálca züllesztő energialövedéket bocsát ki, amely megrontja az ellenségeket, és az akaratod alá hajtja őket. Az ellenségek képesek ennek ellenállni, a legyengülteket viszont sokkal könnyebb lezülleszteni, mint a teljesen egészségeseket.
items.wands.wandofcorruption.upgrade_stat_name_1=Züllesztőerő
items.wands.wandofcorruption.upgrade_stat_name_2=Káros hatás időtartama
items.wands.wandofcorruption.bmage_desc=Amikor a _harci mágus_ a züllesztő varázsbottal megüt egy ellenséget, az ellenség lehet, hogy ámokfutásba kezd.
items.wands.wandofcorruption.eleblast_desc=A züllesztő varázsbottal előidézett elemi robbanás 5 körös ámokfutást vált ki az ellenségekben.

items.wands.wandofdisintegration.name=porlasztó varázspálca
items.wands.wandofdisintegration.staff_name=porlasztó varázsbot
items.wands.wandofdisintegration.desc=A kemény, csiszolt obszidiándarabból készült varázspálca oldalán sötétlila fény fut végig. A benne izzó pusztító energia csak a kilövésre vár.
items.wands.wandofdisintegration.stats_desc=A varázspálcából kilövő sugár áthatol bármilyen akadályon, és annál messzebb jut, minél nagyobb a fejlesztése. A sugár _%1$d-%2$d sebzést_ okoz, és minden ellenfél és fal, amelyen áthatol, növeli a sebzését.
items.wands.wandofdisintegration.upgrade_stat_name_2=Maximális hatótávolság
items.wands.wandofdisintegration.bmage_desc=A _harci mágus_ által kezelt porlasztó varázsbotnak emelt támadási hatótávolsága lesz, mintha kivetüléses bűvölete volna.
items.wands.wandofdisintegration.eleblast_desc=A porlasztó varázsbottal előidézett elemi robbanás 100% sebzést okoz, és áthatol a falakon is.

items.wands.wandoffireblast.name=tűzokádó varázspálca
items.wands.wandoffireblast.staff_name=tűzokádó varázsbot
items.wands.wandoffireblast.desc=A pálca vörösre lakkozott fából készült, gazdagon borítva aranylemezzel, hogy egészen királyi legyen a kinézete. Sistereg és ropog a vége, várja, hogy kiereszthesse erőteljes mágiáját.
items.wands.wandoffireblast.stats_desc=Ez a varázspálca tűzkúpot robbant magából a használata során. A következő támadása _%1$d töltésbe_ kerül, és _%2$d-%3$d sebzést_ okoz. Minél több töltést használ a pálca, annál nagyobb és erősebb lesz a hatása.
items.wands.wandoffireblast.upgrade_stat_name_1=1 töltéses sebzés
items.wands.wandoffireblast.upgrade_stat_name_2=2 töltéses sebzés
items.wands.wandoffireblast.upgrade_stat_name_3=3 töltéses sebzés
items.wands.wandoffireblast.bmage_desc=Amikor a _harci mágus_ a tűzokádó varázsbotjával megüt egy ellenségre, van rá esély, hogy robbanást produkál, ami kárt okoz az ellenségnek és felemészt minden közeli tüzet! Ez az esély annál nagyobb, minél több tűz van az ellenség mellett.
items.wands.wandoffireblast.eleblast_desc=A tűzokádó varázsbottal előidézett elemi robbanás 100% sebzést okoz, kirobbantja az ajtókat, és lángra lobbantja az ellenségeket és a területet is.

items.wands.wandoffrost.name=fagyasztó varázspálca
items.wands.wandoffrost.staff_name=fagyasztó varázsbot
items.wands.wandoffrost.desc=A pálca valamilyen mágikus jégből készülhetett. A kerekített végéhez érve a színe egyre világosabb. Kézben tartva nagyon hideg érzést kelt, de a kezed mégis meleg marad.
items.wands.wandoffrost.stats_desc=Ez a varázspálca jeges energiát robbant az ellenfeleidre, _%1$d-%2$d sebzést_ és dermedést is okozva. Hatása a vízben erősebbnek tűnik. A már dermedt, vagy megfagyott ellenfelek kisebb sérülést szenvednek ettől a pálcától.
items.wands.wandoffrost.upgrade_stat_name_2=Dermedtség időtartama
items.wands.wandoffrost.bmage_desc=Amikor a _harci mágus_ a fagyasztó varázsbottal megüt egy dermedt ellenfelet, lehetséges, hogy az azonnal megfagy. Az esély annál nagyobb, minél jobban le van dermedve az ellenfél.
items.wands.wandoffrost.eleblast_desc=A fagyasztó varázsbottal előidézett elemi csapás 100% sebzést okoz, megfagyasztja az ellenségeket, és eloltja a tüzet.

items.wands.wandoflightning.name=villámló varázspálca
items.wands.wandoflightning.staff_name=villámló varázsbot
items.wands.wandoflightning.ondeath=Megölted magad a saját villámló varázspálcáddal...
items.wands.wandoflightning.desc=A pálca kemény fémből készült, amitől meglepően nehéz. A végén két villafog görbül egymás felé, köztük elektromosság szikrázik.
items.wands.wandoflightning.stats_desc=A varázspálcából erős villám csap ki, amely átível a célpontján, és _%1$d-%2$d sebzést_ okoz. Az ív végigcikázik az egymáshoz közeli karakterek között, valamint sokkal jobban terjed a vízben. Te is megsérülhetsz a pálca kisüléseitől, de a szövetségeseidet nem bántják.
items.wands.wandoflightning.bmage_desc=Amikor a _harci mágus_ villámló varázsbottal megüt egy ellenséget, 10 fordulóra esélye van arra, hogy elektromosan feltöltse magát. Feltöltés közben a harci mágus ellenáll a villámsebzésnek, és a villámok átívelnek rajta.
items.wands.wandoflightning.eleblast_desc=A villámló varázsbottal előidézett elemi csapás 100% sebzést okoz, 5 körre elkábítja az ellenségeket, és elektromossággal tölti fel a vizet.
items.wands.wandoflightning$lightningcharge.name=Elektromossággal töltött
items.wands.wandoflightning$lightningcharge.desc=A harci mágus jelenleg energiával van feltöltve, ami védettséget biztosít neki a villámló varázsbotjával szemben, és növeli a villámok hatótávolságát.\n\nHátralévő körök: %s.

items.wands.wandoflivingearth.name=élő föld varázspálcája
items.wands.wandoflivingearth.staff_name=élő föld varázsbotja
items.wands.wandoflivingearth.desc=Ez a varázspálca furcsa kőből készült, és világító sárga energia szegélyezi. Amikor megmarkolod, olyan, mintha a kövek kissé elmozdulnának, mintha érezné a kezed.
items.wands.wandoflivingearth.stats_desc=Ez a pálca mágikus kőlövedékeket juttat az ellenfélre, és _%1$d-%2$d sebzést_ okoz. A kövek ezután a használó köré idomulnak, és páncélt képeznek az okozott sebzéssel arányban. Ha a páncél elég nagyra nő, kő őrkatonává változik a következő lövés alkalmával.
items.wands.wandoflivingearth.upgrade_stat_name_2=Őrkatona maximális életereje
items.wands.wandoflivingearth.upgrade_stat_name_3=Őrkatona sérülésblokkolása
items.wands.wandoflivingearth.bmage_desc=Amikor a _harci mágus_ az élő föld varázsbotjával megüt egy ellenséget, az okozott sebzés egy részét kőpáncélként visszakapja.
items.wands.wandoflivingearth.eleblast_desc=Az élő föld varázsbotjával előidézett elemi csapás 50% sebzést okoz, és minden egyes eltalált ellenség után gyógyít egy meglévő agyag őrkatonát is.
items.wands.wandoflivingearth$rockarmor.name=kőpáncél
items.wands.wandoflivingearth$rockarmor.desc=Varázslatos kövek veszik körül a tested, és amikor támadás ér, igyekeznek megvédeni, és 50%%-kal csökkentik az elszenvedett sérüléseid. Sajnos minden támadás letör a kövekből valamennyit.\n\nMaradék páncélod: %1$d.\n\nHa elegendő kő épült köréd, a következő lövés az élő föld varázspálcádból egy őrkatonát formál a kövekből, aki melletted harcol majd.\n\nAz őrkatonához szükséges páncél: %2$d.
items.wands.wandoflivingearth$rockarmor.desc_many=Ez az agyag őrkatona is részesül a közösség erejéből. Hátralévő körök: %d.
items.wands.wandoflivingearth$earthguardian.name=agyag őrkatona
items.wands.wandoflivingearth$earthguardian.desc=A kövek az élő föld varázspálcádból egy védelmező agyag őrkatonát formáztak! Ez a sziklaszilárd védő támadni fog a közeli ellenfelekre, arra kényszerítve őket, hogy helyetted inkább őt támadják. Ha minden veszély elhárult, az őrkatona visszaváltozik és körbevesz téged, de visszatér, amikor legközelebb használod a varázspálcát.
items.wands.wandoflivingearth$earthguardian.wand_info=Az őrkatona védekezőereje a pálcád szintjéhez van kötve. Jelenleg _%1$d-%2$d sérülést_ hárít.
items.wands.wandoflivingearth$earthguardian.discover_hint=Ezt a karaktert egy bizonyos pálca segítségével találhatod meg.

items.wands.wandofmagicmissile.name=varázslövedék-pálca
items.wands.wandofmagicmissile.staff_name=varázslövedékbot
items.wands.wandofmagicmissile.desc=Ez az elég egyszerű varázspálca tiszta mágikus energialövedékeket lő. Önmagában semmi különös hatása nincs, de nagyobb a töltési kapacitása, és ha felfejleszted, gyorsan feltölt más varázspálcákat.
items.wands.wandofmagicmissile.stats_desc=A pálca minden lövedéke _%1$d-%2$d sebzést_ okoz, és kis ideig tölt más pálcákat, ha fejlesztve van.
items.wands.wandofmagicmissile.bmage_desc=Amikor a _harci mágus_ a varázslövedékbottal megüt egy ellenséget, akkor nem csak a botja töltődik, hanem az összes pálcája is.
items.wands.wandofmagicmissile.eleblast_desc=A varázslövedékbottal előidézett elemi csapás 50% sebzést okoz, és 15 körig tartó feltöltődést biztosít a mágusnak.
items.wands.wandofmagicmissile.discover_hint=Az egyik hős ezzel a tárggyal indul.
items.wands.wandofmagicmissile$magiccharge.name=varázstöltés
items.wands.wandofmagicmissile$magiccharge.desc=A varázslövedék-pálcád feltöltötte a többi varázspálcát és felerősítette a következő lövésük erejét.\n\nA pálcáid ennyit erősödtek: +%d.\n\nA varázstöltődés még %s körig tart.

items.wands.wandofprismaticlight.name=prizmafény-varázspálca
items.wands.wandofprismaticlight.staff_name=prizmafényvarázsbot
items.wands.wandofprismaticlight.desc=Ez a varázspálca áttetsző, kemény kristályból készült, amely hosszúkás, csiszolt üvegdarabra hasonlít. Kis, színes fényvillanások táncolnak a pálca hegye körül, és csak arra várnak, hogy előtörhessenek.
items.wands.wandofprismaticlight.stats_desc=A varázspálcából kilövő fénysugarak áthatolnak a kazamata sötétjén, felfedve a rejtett területeket és csapdákat. A sugárnyaláb megvakíthatja az ellenfeleket, és _%1$d-%2$d sérülést_ okoz nekik. A démoni és élőhalott ellenségeket a pálca fénye megégeti, amitől bónuszsérülést szenvednek.
items.wands.wandofprismaticlight.upgrade_stat_name_2=Elvakítási esély
items.wands.wandofprismaticlight.upgrade_stat_name_3=Fényesség időtartama
items.wands.wandofprismaticlight.bmage_desc=Amikor a _harci mágus_ a prizmafényvarázsbottal megüti az ellenséget, a bot fejlettségi szintjével arányos időre lerokkan az ellenség.
items.wands.wandofprismaticlight.eleblast_desc=A prizmafényvarázsbottal előidézett elemi robbanás 67% sebzést okoz, felfedi a robbanás területét, és 5 körre megvakítja az ellenséget.

items.wands.wandofregrowth.name=kertész varázspálca
items.wands.wandofregrowth.staff_name=kertész varázsbot
items.wands.wandofregrowth.desc=Kiválóan faragott, vékony fából készült varázspálca. Mintha még mindig élet lüktetne benne. Világoszöld, akárcsak egy facsemete szára. "Amikor egy élet befejeződik, egy új élet születik... Az örök körforgás mindig megmarad!"
items.wands.wandofregrowth.stats_desc=Ez a varázsbot mágikus sarjasztó energiát lő, amitől füvek, gyökerek és ritka növények szökkennek szárba. A következő lövése _%1$d töltést_ fogyaszt. Minél több töltést használ a bot, annál nagyobb és erősebb a hatás.
items.wands.wandofregrowth.degradation=További _%d töltés_ után ez a varázsbot gyengébben kezd növényt termeszteni, és friss füvet előállítani. Ez a határ kitolható szintlépéssel, vagy a bot fejlesztésével.
items.wands.wandofregrowth.upgrade_stat_name_1=Töltésenkénti fűmennyiség
items.wands.wandofregrowth.upgrade_stat_name_2=Összes fűmennyiség
items.wands.wandofregrowth.bmage_desc=Amikor a _harci mágus_ a kertész varázsbottal megüt egy ellenséget, és valamelyikük füvön áll, akkor az okozott sebzés arányában növényi gyógyulásban részesül.
items.wands.wandofregrowth.eleblast_desc=A kertész varázsbottal előidézett elemi robbanás legyökerezteti az ellenséget, és véletlenszerűen füvet növeszt a robbanás területén.
items.wands.wandofregrowth$dewcatcher.name=Harmatgyűjtő
items.wands.wandofregrowth$dewcatcher.desc=A harmatgyűjtők varázslatos növények, melyek feltöltik magukat varázsharmattal. Próbálják magukat fűnek álcázni, hogy elkerüljék a figyelmet, de a duzzadó harmatcseppek elárulják őket.
items.wands.wandofregrowth$dewcatcher.discover_hint=Ezt a növényt egy bizonyos pálcával találhatod meg.
items.wands.wandofregrowth$seedpod.name=Maghüvely
items.wands.wandofregrowth$seedpod.desc=A maghüvelyek varázslatos növények, amelyek más növények magvait termik. Valahogyan mégis elterjednek annak ellenére, hogy nincs is saját magjuk.
items.wands.wandofregrowth$seedpod.discover_hint=Ezt a növényt egy bizonyos pálcával találhatod meg.
items.wands.wandofregrowth$lotus.name=Aranylótusz
items.wands.wandofregrowth$lotus.desc=Az aranylótusz egy misztikus növény, amelyet csak egy erőteljes kertész varázspálcával lehet elővarázsolni. Az aurája minden növényt és növényi hatást felerősít, de hamar kimerül az energiája, és rövid időn belül elpusztul.
items.wands.wandofregrowth$lotus.wand_info=Ezt a lótuszt egy _+%1$d_ szintű kertész pálca növesztette ki.  Minden olyan befolyása alatt álló növény hatását _azonnal kiváltja_, amelyekkel egy mezőn egy karakter található. A növények ezen túl _%2$d%% eséllyel_ magot is hullajtanak, valamint a bevonatos dárdák _kopása %3$d%%-kal kisebb_ lesz.
items.wands.wandofregrowth$lotus.discover_hint=Ezt a növényt egy bizonyos pálcával találhatod meg, miután többször felfejlesztetted.

items.wands.wandoftransfusion.name=átömlesztő varázspálca
items.wands.wandoftransfusion.staff_name=átömlesztő varázsbot
items.wands.wandoftransfusion.ondeath=Megölted magad a saját átömlesztő varázspálcáddal...
items.wands.wandoftransfusion.charged=A varázsbotod töltődött az ellenséged életerejétől!
items.wands.wandoftransfusion.desc=Elég egyszerűen formázott varázspálca, amely kitűnik a bíbor színárnyalata, valamint a hegyén lévő koromsötét ékkő miatt.
items.wands.wandoftransfusion.stats_desc=A szövetségeseiden vagy bájolt ellenfeleken használva ez a varázspálca _%1$d életerőt szív tőled,_ hogy gyógyítsa vagy védje őket _%2$d életerővel._ Az ellenségeket rövid időre elbájolja, és egyúttal _%3$d védőburkot_ ad neked. Az ellenséges élőholtak a báj helyett _%4$d-%5$d sérülést_ szenvednek.
items.wands.wandoftransfusion.upgrade_stat_name_1=Szövetségest gyógyítás
items.wands.wandoftransfusion.upgrade_stat_name_2=Saját védőburok
items.wands.wandoftransfusion.upgrade_stat_name_3=Élőhalottat sebzés
items.wands.wandoftransfusion.bmage_desc=Amikor a _harci mágus_ elbájolt ellenfelet üt meg az átömlesztő varázsbottal, védőburkot kap, és nem kerül életerőbe a következő lövése a bottal.
items.wands.wandoftransfusion.eleblast_desc=Az átömlesztő varázsbottal előidézett elemi robbanás elbűvöli az ellenséget, gyógyítja a szövetségeseket, és 100% sebzést okoz az élőhalott ellenségeknek.

items.wands.wandofwarding.name=oltalmazó varázspálca
items.wands.wandofwarding.staff_name=oltalmazó varázsbot
items.wands.wandofwarding.no_more_wards=Nem tudsz több oltalmazót életben tartani.
items.wands.wandofwarding.bad_location=Nem tudsz oltalmazót küldeni arra a helyre.
items.wands.wandofwarding.desc=Ennek a rövid fém varázspálcának a hegyénél fényes lila ékkő lebeg.
items.wands.wandofwarding.stats_desc=Ahelyett, hogy sérülést okozna az ellenfélnek, ez a pálca mozdulatlan oltalmazókat és őrszemeket idéz meg. Az oltalmazók bárhol megidézhetők, akár falakon keresztül is, ha átlátsz. Ez a pálca _%d energia_ értékű oltalmazót tud életben tartani egyszerre.
items.wands.wandofwarding.upgrade_stat_name_1=Oltalmazó sebzése
items.wands.wandofwarding.upgrade_stat_name_2=Oltalmazó energiája
items.wands.wandofwarding.bmage_desc=Amikor a _harci mágus_ az oltalmazó varázsbottal megüt egy ellenséget, az összes aktív védelmező és őrszem meggyógyulhat.
items.wands.wandofwarding.eleblast_desc=Az oltalmazó varázsbottal előidézett elemi robbanás meggyógyítja a robbanás területén lévő összes védelmezőt és őrszemet.
items.wands.wandofwarding$ward.desc_generic_ward=Ez az oltalmazó önállóan tüzel minden ellenfélre, amely a látóterébe kerül.\n\nAz oltalmazót fejlesztheted, ha rálősz az oltalmazó pálcáddal.\n\nAz oltalmazók csak néhányat képesek tüzelni, mielőtt szertefoszlanak.
items.wands.wandofwarding$ward.desc_generic_sentry=Ez az őrszem ugyanolyan tűzerővel rendelkezik, mint egy védelmező, de meghatározott töltésszám helyett életerővel rendelkezik. Hasonlít az oltalmazópálcád hegyén lévő drágakőre.\n\nHa ezt az őrszemet az oltalmazópálcáddal meglövöd, az felfejleszti és meggyógyítja.\n\nEz az őrszem minden egyes alkalommal, amikor egy ellenséget meglő, elhasznál némi életerőt, ugyanakkor gyógyítható, ha az oltalmazópálcádat használod rajta.
items.wands.wandofwarding$ward.name_1=kisebb oltalmazó
items.wands.wandofwarding$ward.desc_1=Ez az egyszerű oltalmazó önállóan tüzel minden ellenfélre, amely a látóterébe kerül, és _%1$d-%2$d sebzést_ okoz.\n\nAz oltalmazót fejlesztheted, ha rálősz az oltalmazó pálcáddal.\n\nEz az oltalmazó csak egyszer tüzel, mielőtt szertefoszlik.\n\nAz oltalmazó varázspálcád _%3$d energiát_ használ, hogy éltesse ezt az oltalmazót.
items.wands.wandofwarding$ward.name_2=oltalmazó
items.wands.wandofwarding$ward.desc_2=Ez a továbbfejlesztett oltalmazó díszesebb, és már többször is támadhat. Minden lövése _%1$d-%2$d sebzést_ okoz.\n\nAz oltalmazó erősödik, ha rálősz az oltalmazó pálcáddal.\n\nEz az oltalmazó háromszor tüzelhet, mielőtt szertefoszlik.\n\nAz oltalmazó varázspálcád _%3$d energiát_ használ, hogy éltesse ezt az oltalmazót.
items.wands.wandofwarding$ward.name_3=nagyobb oltalmazó
items.wands.wandofwarding$ward.desc_3=Ez a teljesen felfejlesztett oltalmazó képes az elődeinél is többször támadni. Minden lövése _%1$d-%2$d sebzést_ okoz.\n\nAz oltalmazó erősödik, ha rálősz az oltalmazó pálcáddal.\n\nEz az oltalmazó négyszer tüzelhet, mielőtt szertefoszlik.\n\nAz oltalmazó varázspálcád _%3$d energiát_ használ, hogy éltesse ezt az oltalmazót.
items.wands.wandofwarding$ward.name_4=kisebb őrszem
items.wands.wandofwarding$ward.desc_4=Ennek a kisebb őrszemnek hasonló tűzereje van, mint a nagyobb oltalmazónak, de ahelyett, hogy meghatározott számú lövésre marad életben, ennek meghatározott életereje van. Az oltalmazó varázspálca végén lévő drágakőre hasonlít. Az őrszem minden lövése _%1$d-%2$d sebzést_ okoz.\n\nAz oltalmazó varázspálcával meglőtt őrszem fejlődik és gyógyul.\n\nAz őrszem valamennyi életerőt elhasznál a támadásaival, de gyógyítható az oltalmazópálcával.\n\nAz oltalmazópálcád _%3$d  energiát_ használ, hogy éltesse ezt az őrszemet.
items.wands.wandofwarding$ward.name_5=őrszem
items.wands.wandofwarding$ward.desc_5=Ez a fejlettebb őrszem nagyobb és sokkal tartósabb, mint a kisebbik. Az őrszem minden lövése _%1$d-%2$d sebzést_ okoz.\n\nAz oltalmazó varázspálcával meglőtt őrszem fejlődik és gyógyul.\n\nAz őrszem valamennyi életerőt elhasznál a támadásaival, de gyógyítható az oltalmazópálcával.\n\nAz oltalmazópálcád _%3$d energiát_ használ, hogy éltesse ezt az őrszemet.
items.wands.wandofwarding$ward.name_6=nagyobb őrszem
items.wands.wandofwarding$ward.desc_6=Ez a teljesen felfejlesztett őrszem sokkal kitartóbb, mint az elődei. Az őrszem minden lövése _%1$d-%2$d sebzést_ okoz.\n\nAz oltalmazó varázspálcával meglőtt őrszem fejlődik és gyógyul.\n\nAz őrszem valamennyi életerőt elhasznál a támadásaival, de gyógyítható az oltalmazópálcával.\n\nAz oltalmazópálcád _%3$d energiát_ használ, hogy éltesse ezt az őrszemet.
items.wands.wandofwarding$ward.discover_hint=Ezt a karaktert egy bizonyos pálca segítségével találhatod meg.
items.wands.wandofwarding$ward.dismiss_title=Visszahívod ezt az oltalmazót?
items.wands.wandofwarding$ward.dismiss_body=Visszahívhatod az oltalmazót, ha nem szeretnéd, hogy a pálcád továbbra is éltesse őt. Ha megteszed, azonnal megsemmisül.\n\nVisszahívod ezt az oltalmazót?
items.wands.wandofwarding$ward.dismiss_confirm=igen
items.wands.wandofwarding$ward.dismiss_cancel=nem

###weapon curses
items.weapon.curses.annoying.name=bosszantó %s
items.weapon.curses.annoying.msg_1=Ó, MOST HARCOLUNK?!
items.weapon.curses.annoying.msg_2=EZ AZ, CSAPD LE!
items.weapon.curses.annoying.msg_3=HÉ, FIGYELJ!
items.weapon.curses.annoying.msg_4=A FŐELLENSÉGNÉL VAGYUNK MÁR?!
items.weapon.curses.annoying.msg_5=JUJ, NE SUHINTS VELEM EKKORÁT!
items.weapon.curses.annoying.msg_6=PUSZTULJ FÉREG!
items.weapon.curses.annoying.msg_7=JUHÚÚÚÚÚÚÚÚÚÚ!
items.weapon.curses.annoying.msg_8=TARTHATNÁNK EGY KIS SZÜNETET!?
items.weapon.curses.annoying.msg_9=PAFF, HAHA!
items.weapon.curses.annoying.msg_10=SZÉP ÜTÉS!
items.weapon.curses.annoying.msg_11=Nem fegyver akartam lenni, hanem favágó fejsze.
items.weapon.curses.annoying.msg_12=Ne feledd, a túlzott magabiztosság lassú és alattomos gyilkos!
items.weapon.curses.annoying.msg_13=MINDEN, AMI BÁZISAITOK, VANNAK HOZZÁNK TARTOZIK!
items.weapon.curses.annoying.desc=A bosszantó fegyverek képesek beszélni, csak éppen túl izgágák. Sokszor akaratlanul is fel fogják hívni rád az ellenfelek figyelmét.
items.weapon.curses.annoying.elestrike_desc=A bosszantó átokkal bűvölt elemi csapásnak 20% esélye van arra, hogy 6 körig minden ellenséget ámokfutásba taszítson a hatósugarában.

items.weapon.curses.dazzling.name=kápráztató %s
items.weapon.curses.dazzling.desc=A kápráztató fegyverek néha káprázatos fényben villannak fel, és elvakítanak mindent, ami látja őket.
items.weapon.curses.dazzling.elestrike_desc=A kápráztató átokkal bűvölt elemi csapásnak 50% esélye van arra, hogy 6 körre minden ellenséget megvakítson a hatósugarában.

items.weapon.curses.displacing.name=tovatevő %s
items.weapon.curses.displacing.desc=A tovatevő fegyvereket zavaros teleportmágia itatja át, amely képes az ellenfeleket az emelet véletlenszerű helyeire szippantani.
items.weapon.curses.displacing.elestrike_desc=A tovatevő átokkal bűvölt elemi csapásnak 50% esélye van arra, hogy elteleportáljon minden ellenséget a hatósugarából.

items.weapon.curses.explosive.name=robbanó %s
items.weapon.curses.explosive.warm=Meleg...
items.weapon.curses.explosive.hot=Forró!
items.weapon.curses.explosive.desc=A robbanófegyverek folyamatosan energiát gyűjtenek és felrobbannak, megrongálva mindent, ami a közelben van.
items.weapon.curses.explosive.desc_cool=A fegyvered jelenleg hűvös tapintású.
items.weapon.curses.explosive.desc_warm=A fegyveredben gyűlik az energia, és egyre melegszik...
items.weapon.curses.explosive.desc_hot=A fegyvered forró! Mindjárt felrobban!
items.weapon.curses.explosive.elestrike_desc=A robbanó átokkal bűvölt elemi csapásnak 50%-os esélye van arra, hogy robbanást okozzon a hatótávolságában egy véletlenszerűen kiválasztott ellenség helyén.

items.weapon.curses.friendly.name=barátságos %s
items.weapon.curses.friendly.desc=A barátságos fegyverek leginkább pacifistáknak valók, alkalmanként olyan mágiát váltanak ki, amely harcra képtelenné tesz.
items.weapon.curses.friendly.elestrike_desc=Egy barátságos átokkal bűvölt elemi csapásnak 50% esélye van arra, hogy a hatósugarában minden ellenséget elbűvöljön 6 körre.

items.weapon.curses.polarized.name=poláris %s
items.weapon.curses.polarized.desc=Egy poláris fegyver olyan varázslattal bír, amely vagy 50%-kal több sebzést okoz, vagy egyáltalán nem okoz sebzést.
items.weapon.curses.polarized.elestrike_desc=Egy poláris átokkal bűvölt elemi csapás 50%-os eséllyel 24-36 sebzést okoz minden egyes ellenségnek a hatósugarában.

items.weapon.curses.sacrificial.name=áldozati %s
items.weapon.curses.sacrificial.desc=Az áldozati fegyverek a támadásokért cserébe vért követelnek a használójuktól. Minél egészségesebb a fegyver használója, az átok annál több vért vesz el tőle.
items.weapon.curses.sacrificial.elestrike_desc=Az áldozati átokkal bűvölt elemi csapás a hősnél és minden hatósugarában lévő ellenségnél 12 életerőpontos vérzést vált ki.

items.weapon.curses.wayward.name=csökönyös %s
items.weapon.curses.wayward.desc=A csökönyös fegyverek néha rendkívül pontatlanok lesznek. Ez a mágia eltart egy kis ideig, miután hatni kezd, de a csökönyös fegyverrel bevitt csapás hatástalaníthatja.
items.weapon.curses.wayward.elestrike_desc=A csökönyös átokkal bűvölt elemi csapásnak 50% esélye van arra, hogy a hatósugarában lévő ellenségeket 6 körre megboszorkányozza.
items.weapon.curses.wayward$waywardbuff.name=csökönyös
items.weapon.curses.wayward$waywardbuff.desc=A csökönyös fegyvered varázslata hatni kezdett, ami rövid időre rendkívül pontatlanná teszi. Ne feledd, hogy ez nem érinti azokat a támadásokat, amelyek garantáltan betalálnak, például a meglepetésszerű támadásokat. Ha sikeresen támadsz a csökönyös fegyverrel, akkor ez a hatás azonnal megszűnik.\n\nHátralévő körök: %s.

###enchantments
items.weapon.enchantments.blazing.name=lángoló %s
items.weapon.enchantments.blazing.desc=Ennek a bűvöletnek köszönhetően a fegyver tüzet okád, lángra lobbantja az ellenségeket, és bónuszsebzést okoz azoknak, akik már lángoltak.
items.weapon.enchantments.blazing.elestrike_desc=Egy lángoló bűvölettel bűvölt elemi csapás tüzet szór a hatósugarában lévő minden mezőre, amely 8 körön keresztül tart.

items.weapon.enchantments.blocking.name=védekező %s
items.weapon.enchantments.blocking.desc=A védekező fegyverek rövid időre védelmet adhatnak, miután támadtál velük.
items.weapon.enchantments.blocking.elestrike_desc=Egy védekező bűvölettel bűvölt elemi csapás minden egyes hatótávolságban lévő ellenség után 6-tal növeli meg a párbajhős védőburkát.
items.weapon.enchantments.blocking$blockbuff.name=védekező
items.weapon.enchantments.blocking$blockbuff.desc=A fegyvered védekezőbűvölete rövid időre megnövelte a védekezőképességedet!\n\nMaradék védőburok: %d\n\nHátralévő körök: %s.

items.weapon.enchantments.blooming.name=kivirító %s
items.weapon.enchantments.blooming.desc=A kivirító fegyverek olyan varázslatot hordoznak, melytől növényzet serken a megsebzett körül.
items.weapon.enchantments.blooming.elestrike_desc=A kivirító bűvölettel bűvölt elemi csapás a hatótávolságán belül füvet sarjaszt legfeljebb 8 mezőn, és 6 körre földbe gyökereztet minden ellenséget a hatótávolságon belül.

items.weapon.enchantments.chilling.name=dermesztő %s
items.weapon.enchantments.chilling.desc=Az ilyen bűvölt fegyver csapásai megdermesztik az ellenfeleket, így csökken a mozgási és támadási sebességük.
items.weapon.enchantments.chilling.elestrike_desc=A dermesztő bűvölettel bűvölt elemi csapás dermesztő levegőt áraszt a hatósugarában lévő minden mezőre, amely 8 körig ott marad.

items.weapon.enchantments.kinetic.name=kinetikus %s
items.weapon.enchantments.kinetic.desc=Amikor egy ellenséget kinetikus fegyverrel megölnek, minden fel nem használt erő eltárolódik a fegyverben, és a következő sikeres támadáshoz adódik.
items.weapon.enchantments.kinetic.elestrike_desc=A kinetikus bűvölettel bűvölt elemi csapás a tárolt sérülés 40%-ával sebez minden ellenséget a hatósugarában, kivéve az elsődleges célpontot.
items.weapon.enchantments.kinetic$conserveddamage.name=eltárolt sebzés
items.weapon.enchantments.kinetic$conserveddamage.desc=A fegyvered eltárolta az előző halálos ütésből fel nem használt erőt, amely bónuszsebzésként a következő támadásodat erősíti majd. Ez az energia viszont idővel lassan elveszik.\n\nEltárolt sebzés: %d.

items.weapon.enchantments.corrupting.name=züllesztő %s
items.weapon.enchantments.corrupting.desc=Ezzel az erőteljes bűvölettel az ellenségeid az akaratod szerint fognak cselekedni. Miután megöltél egy ellenfelet ezzel a fegyverrel, lehetséges hogy züllötté válik ahelyett, hogy elpusztulna.
items.weapon.enchantments.corrupting.elestrike_desc=A züllesztő bűvölettel bűvölt elemi csapás (a hiányzó életerőtől függően) 5-25%-os eséllyel lezülleszt minden ellenséget a hatósugarában, kivéve az elsődleges célpontot.

items.weapon.enchantments.elastic.name=rugalmas %s
items.weapon.enchantments.elastic.desc=A rugalmas fegyverek néha visszalökik kis távolságokra az ellenfeleket.
items.weapon.enchantments.elastic.elestrike_desc=A rugalmas bűvölettel bűvölt elemi csapás minden ellenséget 5 mezővel hátrébb taszít a hatósugarában.

items.weapon.enchantments.grim.name=ádáz %s
items.weapon.enchantments.grim.desc=Ennek az erős bűvöletnek megvan az ereje ahhoz, hogy azonnal kivégezze az ellenséget. A hatás annál nagyobb valószínűséggel fordul elő, minél gyengébb az ellenfél.
items.weapon.enchantments.grim.elestrike_desc=Az ádáz bűvölettel bűvölt elemi csapás (a hiányzó életerőtől függően) 6-30%-os eséllyel megöli a hatótávolságában lévő ellenségeket, az elsődleges célpontot kivéve.

items.weapon.enchantments.lucky.name=szerencsés %s
items.weapon.enchantments.lucky.desc=Azok az ellenségek, akiket szerencsés fegyverrel öltek meg, több zsákmányt hagyhatnak maguk után.
items.weapon.enchantments.lucky.elestrike_desc=A szerencsés bűvölettel bűvölt elemi csapás hatósugarában lévő ellenségek alá 12,5% eséllyel zsákmány hullik. Ez a hatás ellenségenként csak egyszer váltható ki.

items.weapon.enchantments.projecting.name=kivetüléses %s
items.weapon.enchantments.projecting.desc=Ezzel a bűvölettel a közelharci fegyverek hatótávolsága megnő. A távolsági fegyverek áthatolnak a falakon, ha közeli célpontokra irányulnak.
items.weapon.enchantments.projecting.elestrike_desc=A kivetüléses bűvölettel bűvölt elemi csapás 30%-os sebzést okoz minden ellenségnek a hatósugarában, az elsődleges célpontot kivéve.

items.weapon.enchantments.shocking.name=sokkoló %s
items.weapon.enchantments.shocking.desc=Áram ível ki a sokkoló fegyverből, az egymáshoz közel álló ellenségeknek többletsebzést okozva.
items.weapon.enchantments.shocking.elestrike_desc=A sokkoló bűvölettel bűvölt elemi csapás áramot vezet a hatósugarában lévő minden mezőbe, amely 8 körön keresztül ott marad.

items.weapon.enchantments.unstable.name=kiszámíthatatlan %s
items.weapon.enchantments.unstable.desc=A bűvölet zavaros energiát sugároz, és minden ütésnél más és más bűvöletként viselkedik.
items.weapon.enchantments.unstable.elestrike_desc=A kiszámíthatatlan bűbájjal bűvölt elemi csapás véletlenszerű bűbájhatást idéz elő a hatósugarában minden ellenségre, kivéve az elsődleges célpontot.

items.weapon.enchantments.vampiric.name=vérszívó %s
items.weapon.enchantments.vampiric.desc=Ez az erőteljes bűvölet minden egyes ütéssel életerőt szív el az ellenféltől, amit visszaáramoltat a viselőjébe. Annál erősebb a hatás, minél kisebb a viselő életereje.
items.weapon.enchantments.vampiric.elestrike_desc=A vérszívó bűvölettel bűvölt elemi csapás minden hatótávolságában lévő ellenség után 2,5 életponttal gyógyítja a párbajhőst.


###melee weapons
items.weapon.melee.assassinsblade.name=orgyilkos pengéje
items.weapon.melee.assassinsblade.stats_desc=Ez a fegyver erősebb azok ellen az ellenségek ellen, akik nem vettek észre.
items.weapon.melee.assassinsblade.ability_name=lopakodás
items.weapon.melee.assassinsblade.typical_ability_desc=A párbajhős képes _lopakodni_, ha egy orgyilkos pengéjét forgatja. Ez a képesség lehetővé teszi a párbajhős számára, hogy legfeljebb 3 mező távolságot azonnal keresztülcikázzon, és jellemzően _%d körre láthatatlanná váljon._
items.weapon.melee.assassinsblade.ability_desc=A párbajhős képes _lopakodni_, ha egy orgyilkos pengéjét forgatja. Ez a képesség lehetővé teszi a párbajhős számára, hogy legfeljebb 3 mező távolságot azonnal keresztülcikázzon, és _%d körre láthatatlanná váljon._
items.weapon.melee.assassinsblade.upgrade_ability_stat_name=Képesség időtartama
items.weapon.melee.assassinsblade.desc=Obszidiánból készült kicsi, hullámos penge, és bár súlyra könnyű, mégis nehéz használni. Ha viszont célba talál, halálos sebet ejt.

items.weapon.melee.battleaxe.name=csatabárd
items.weapon.melee.battleaxe.stats_desc=Meglehetősen pontos fegyver.
items.weapon.melee.battleaxe.ability_name=súlyos csapás
items.weapon.melee.battleaxe.typical_ability_desc=A párbajhős képes _súlyos csapást_ mérni a csatabárddal. Ez az összpontosított támadás jellemzően _%1$d-%2$d sebzést_ okoz, ha meglepi az ellenséget, akit 5 körig elkábít, ami miatt 50%%-kal csökken a pontossága és a kijátszása. A súlyos csapás mindig betalál, de csak normál sebzést okoz, ha nem lepte meg az ellenséget.
items.weapon.melee.battleaxe.ability_desc=A párbajhős képes _súlyos csapást_ mérni a csatabárddal. Ez az összpontosított támadás _%1$d-%2$d sebzést_ okoz, ha meglepi az ellenséget, akit 5 körig elkábít, ami miatt 50%%-kal csökken a pontossága és a kijátszása. A súlyos csapás mindig betalál, de csak normál sebzést okoz, ha nem lepte meg az ellenséget.
items.weapon.melee.battleaxe.desc=A csatabárd roppant acélfeje minden suhintásnak tekintélyes súlyt ad.

items.weapon.melee.crossbow.name=íjpuska
items.weapon.melee.crossbow.typical_stats_desc=Általában ez a fegyver, ha fel van szerelve a dobott dárdákat _%1$d-%2$d sebzéssel_ erősíti, és még a bűvöletét is átadja nekik.
items.weapon.melee.crossbow.stats_desc=Ez a fegyver a felszerelésekor a dobott dárdákat _%1$d-%2$d sebzéssel_ erősíti, és még a bűvöletét is is átadja nekik.
items.weapon.melee.crossbow.ability_name=feltöltött lövés
items.weapon.melee.crossbow.typical_ability_desc=A párbajhős _feltöltheti_ az íjpuskáját, miáltal az íjpuskával végrehajtott következő közönséges támadása mindig betalál, és a következő három hatás közül kiváltja az egyiket: közelharci támadásoknál visszalöki az ellenségeket, a bevonat nélküli hegyű dárdák jellemzően _+%1$d sebzést_ okoznak, illetve a bevonatos dárdák 7x7 mezőnyi területen fejtik ki hatásukat, és jellemzően _%2$d használattal tovább_ bírják.
items.weapon.melee.crossbow.ability_desc=A párbajhős _feltöltheti_ az íjpuskáját, miáltal az íjpuskával végrehajtott következő közönséges támadása mindig betalál, és a következő három hatás közül kiváltja az egyiket: közelharci támadásoknál visszalöki az ellenségeket, a bevonat nélküli hegyű dárdák _+%1$d sebzést_ okoznak, illetve a bevonatos dárdák 7x7 mezőnyi területen fejtik ki hatásukat, és _%2$d használattal tovább_ bírják.
items.weapon.melee.crossbow.desc=Egészen bonyolult fegyver, ami rendkívüli sebességgel lövi ki vesszőit. Habár nem arra tervezték, az íjpuska súlyos és robusztus kialakítása kiváló közelharci fegyverré is teszi.
items.weapon.melee.crossbow.upgrade_ability_stat_name=Képességfokozás
items.weapon.melee.crossbow$chargedshot.name=feltöltve
items.weapon.melee.crossbow$chargedshot.desc=A párbajhős energiát összpontosít az íjpuskájába. Az íjpuskával végrehajtott következő támadása mindig betalál, és a következő három hatás közül kiváltja az egyiket:\n- A közelharci támadásoknál néhány mezőt visszalöki az ellenségeket.\n- A bevonat nélküli hegyű dárdák bónuszsebzést okoznak.\n- A bevonatos dárdák több használatot kibírnak, és 7x7 mezőnyi területen fejtik ki hatásukat. A pozitív dárdahatások csak a szövetségesekre, a káros hatások pedig csak az ellenségekre lesznek érvényesek. A párbajhős nem használhatja ezt a képességet arra, hogy saját magára pozitív dárdahatásokat érvényesítsen.

items.weapon.melee.cudgel.name=jogar
items.weapon.melee.cudgel.stats_desc=Elég pontos fegyver.
items.weapon.melee.cudgel.ability_name=súlyos csapás
items.weapon.melee.cudgel.typical_ability_desc=A párbajhős képes _súlyos csapást_ mérni a jogarral. Ez az összpontosított támadás jellemzően _%1$d-%2$d sebzést_ okoz, ha meglepi az ellenséget, akit 5 körig elkábít, ami miatt 50%%-kal csökken a pontossága és a kijátszása. A súlyos csapás mindig betalál, de csak normál sebzést okoz, ha nem lepte meg az ellenséget.
items.weapon.melee.cudgel.ability_desc=A párbajhős képes _súlyos csapást_ mérni a jogarral. Ez az összpontosított támadás _%1$d-%2$d sebzést_ okoz, ha meglepi az ellenséget, akit 5 körig elkábít, ami miatt 50%%-kal csökken a pontossága és a kijátszása. A súlyos csapás mindig betalál, de csak normál sebzést okoz, ha nem lepte meg az ellenséget.
items.weapon.melee.cudgel.desc=Kis rézbuzogány, amely inkább nemesek önvédelmi eszköze, semmint kalandorok fegyvere.
items.weapon.melee.cudgel.discover_hint=Az egyik hős ezzel a tárggyal indul.

items.weapon.melee.dagger.name=tőr
items.weapon.melee.dagger.stats_desc=Ez a fegyver erősebb azok ellen az ellenségek ellen, akik nem vettek észre.
items.weapon.melee.dagger.ability_name=lopakodás
items.weapon.melee.dagger.typical_ability_desc=A párbajhős képes _lopakodni_, ha egy tőrt forgat. Ez a képesség lehetővé teszi a párbajhős számára, hogy legfeljebb 5 mező távolságot azonnal keresztülcikázzon, és jellemzően _%d körre láthatatlanná váljon._
items.weapon.melee.dagger.ability_desc=A párbajhős képes _lopakodni_, ha egy tőrt forgat. Ez a képesség lehetővé teszi a párbajhős számára, hogy legfeljebb 5 mező távolságot azonnal keresztülcikázzon, és _%d körre láthatatlanná váljon._
