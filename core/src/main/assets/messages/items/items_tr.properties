items.artifacts.skeletonkey.levelup=İskelet anahtarınız güçleniyor!
items.artifacts.skeletonkey.desc=Kafatası şeklinde bir başı olan önemli görünümlü bir anahtar. Dişleri her baktığınızda farklı görünüyor.
items.artifacts.skeletonkey.desc_worn=Bu sihirli anahtar, zindanın normal anahtarları yerine kullandıkça güç kazanıyor gibi görünüyor. Zindandaki neredeyse tüm kilitlere takılarak, daha önce hiç kilitlenmemiş kapılar da dahil olmak üzere, kilitleri açabilir veya kapatabilir.\n\nAnahtar, önünüzdeki havayı “kilitlemek” için boş bir alanda dikey veya çapraz yönde bile kullanılabilir ve 10 tur boyunca 3 karo genişliğinde sağlam bir duvar oluşturur. Kilitleme, yeterli alan varsa düşmanları uzaklaştırır.
items.artifacts.skeletonkey.desc_cursed=Lanetli anahtar, herhangi bir kilide uymaktan aktif olarak kaçınıyor gibi görünüyor ve diğer anahtarlarınızı kullanmanızı zorlaştırıyor (ancak imkansız hale getirmiyor).
items.artifacts.skeletonkey$keywall.desc=Buraya iskelet anahtarı tarafından geçici bir sihirli duvar yerleştirilmiştir.

items.artifacts.talismanofforesight.name=öngörü tılsımı
items.artifacts.talismanofforesight.ac_scry=ÖNGÖRÜ
items.artifacts.talismanofforesight.low_charge=Bu tılsımın görmek için en az %5 enerjiye ihtiyacı var.
items.artifacts.talismanofforesight.prompt=Taramak için bir yer seç.
items.artifacts.talismanofforesight.levelup=Tılsımın güçlendi!
items.artifacts.talismanofforesight.full_charge=Tılsımın tamamen şarj oldu!
items.artifacts.talismanofforesight.desc=Üzerinde garip oymalar olan pürüzsüz bir taş. Etrafınızdaki her şeyi izlediğini, gizli bir şey olup olmadığına dikkat ettiğini hissediyorsunuz.
items.artifacts.talismanofforesight.desc_worn=Tılsımı tuttuğunuzda duyularınızın arttığını hissedersiniz. Zaman geçtikçe ve gizli kapılar ya da tuzaklar keşfettiğinizde tılsımın şarjı yavaş yavaş artar.\n\nTılsım şarjını koni şeklinde 'gözetleme' yapmak için harcayabilir, bu da taranan alandaki tüm karoları ve sırları ortaya çıkarır ve size kısa bir süre için düşman ve eşyaların görüşünü verir.
items.artifacts.talismanofforesight.desc_cursed=Lanetli tılsım dikkatle size bakıyor ve duyularınızı köreltiyor.
items.artifacts.talismanofforesight$foresight.name=öngörü
items.artifacts.talismanofforesight$foresight.uneasy=Tedirgin hissediyorsun.
items.artifacts.talismanofforesight$foresight.desc=Kendini sanki yakınlarda görünmez bir tehlike varmış gibi çok tedirgin hissediyorsun.

items.artifacts.timekeepershourglass.name=zaman korucusunun kum saati
items.artifacts.timekeepershourglass.ac_activate=AKTİFLEŞTİR
items.artifacts.timekeepershourglass.deactivate=Zaman dondurmasını devre dışı bıraktın.
items.artifacts.timekeepershourglass.no_charge=Kum saatin kullanılabilecek kadar şarj olmadı.
items.artifacts.timekeepershourglass.cursed=Lanetli bir kumsaati kullanamazsın.
items.artifacts.timekeepershourglass.onstasis=Dünya etrafında birdenbire değişmiş gibi duruyor.
items.artifacts.timekeepershourglass.onfreeze=Etrafındaki herşey birden bire donuklaşıyor.
items.artifacts.timekeepershourglass.stasis=Kendimi dondur
items.artifacts.timekeepershourglass.freeze=Çevremdeki zamanı dondur
items.artifacts.timekeepershourglass.prompt=Kum saatinin büyüsünü nasıl kullanmak istersiniz?\n\nDurağanlıktayken, siz donmuş ve tamamen zarar görmez haldeyken zaman normal şekilde hareket eder, bir seferde en fazla 2 şarj tüketir.\n\nZaman donduğunda, eylemleriniz hiç zaman almıyormuş gibi hareket edebilirsiniz. Bu, kum saati kullanılarak veya saldırarak herhangi bir zamanda devre dışı bırakılabilir.
items.artifacts.timekeepershourglass.desc=Bu büyük antika kum saati bayağı mütevazı duruyor, ancak harika biçimde oyulmuş çerçevesinde müthiş bir güç hissediyorsun. Kum saatini döndürdükçe ve kumun akışını izledikçe büyüsünün sana yöneldiğini hissediyorsun, bu büyüyü kullanmak sana kesinlikle zaman üzerinde biraz kontrol verecek
items.artifacts.timekeepershourglass.desc_hint=Kum saati biraz kum kaybetmiş gibi duruyor, keşke biraz bulabilseydin...
items.artifacts.timekeepershourglass.desc_cursed=Lanetli kum saati yanına kilitlendi, zaman akışını değiştirmeye çalıştığını hissedebiliyorsun.
items.artifacts.timekeepershourglass$timefreeze.name=Zamanı Dondur
items.artifacts.timekeepershourglass$timefreeze.desc=Etrafındaki zaman dondu ve hareketleri anında yapmana izin veriyor. Etki iptal edilene kadar yada kum saatinin şarjı bitene kadar devam eder. Saldırmak yada büyü kullanmak da etkisini bozar.\n\nŞarj kullanımına kadar turlar: %s.
items.artifacts.timekeepershourglass$sandbag.name=büyülü kum çantası
items.artifacts.timekeepershourglass$sandbag.levelup=Kumu kum saatine ekledin.
items.artifacts.timekeepershourglass$sandbag.maxlevel=Kum saatin büyülü kumla doldu!
items.artifacts.timekeepershourglass$sandbag.no_hourglass=Bu kumu ekleyecek kum saatin yok.
items.artifacts.timekeepershourglass$sandbag.desc=Bu küçük ince kumla dolu torba kumsaatinle mükemmel çalışmalı.\n\nMağaza sahibinin tam ihtiyacın olduğunda bu özel eşyaya sahip olması biraz ilginç...

items.artifacts.unstablespellbook.name=dengesiz büyü kitabı
items.artifacts.unstablespellbook.ac_read=OKU
items.artifacts.unstablespellbook.ac_add=EKLE
items.artifacts.unstablespellbook.blinded=Körken kitaptan okuyamazsın.
items.artifacts.unstablespellbook.no_charge=Büyü kitabının şimdilik enerjisi bitti.
items.artifacts.unstablespellbook.cursed=Lanetli bir büyü kitabından okuyamazsın.
items.artifacts.unstablespellbook.prompt=Bir parşömen seç
items.artifacts.unstablespellbook.infuse_scroll=Parşömenin enerjisini kitaba işledin.
items.artifacts.unstablespellbook.unable_scroll=Bu parşömeni kitaba ekleyemezsin.
items.artifacts.unstablespellbook.unknown_scroll=Bunun henüz ne tür bir parşömen olduğunu bilmiyorsun.
items.artifacts.unstablespellbook.desc=Bu büyü kitabı yaşına göre hayret verici biçimde iyi durumda. Sayfaları gezdikçe dengesiz bir güçle dolup taşıyor. Bu kitaptan okursan, hangi büyüyü kullanacağını bilmene imkan yok.
items.artifacts.unstablespellbook.desc_cursed=Lanetli kitap kendini sana kilitledi, çoğu parşömeni kullanma yeteneğini engelliyor.
items.artifacts.unstablespellbook.desc_index=Bu kitap yarım kalmış. Dizini şu anda belirtilen boş sayfaları gösteriyor:
items.artifacts.unstablespellbook.desc_empowered=Kitaba eklediğin parşömenler güç ile parlıyor. Bu parşömenlerin egzotik versiyonlarını fazladan şarj harcayarak kullanabileceksin.
items.artifacts.unstablespellbook.read_empowered=Büyü kitabına eklediğin parşömen enerji ile dolup taşıyor. Bu parşömenin etkisinin normal etkisinin yanında istersen egzotik versiyonunu da kullanabilirsin.\n\nEgzotik sürümü seçmek 1 şarj yerine 2 şarja mal olacaktır.



###bags
items.bags.bag.name=sırt çantası
items.bags.bag.discover_hint=Bu eşyayı bir mağazadan satın alabilirsin.

items.bags.potionbandolier.name=iksir palaskası
items.bags.potionbandolier.desc=Bu kalın palaska göğsünüzün etrafına bir kuşak gibi oturur, üzerinde iksir şişelerini, su tulumunuzu veya sıvı metal şişelerini tutmak için birçok yalıtımlı kayış vardır.\n\nPalaska içindeyken iksirleriniz soğuktan korunur.

items.bags.scrollholder.name=parşomen tutacağı
items.bags.scrollholder.desc=Bu boru şeklindeki kap, bir astronomun aletleri ve haritaları için tasarlanmış gibi görünüyor, ancak parşömenleriniz tam olarak sığacaktır. Büyü kristalleri, büyü kalemleri ve büyü reçineleri için mükemmel olabilecek birkaç yan bölme bile vardır.\n\nTaban yanıcı gibi görünmüyor, bu nedenle parşömenleriniz içeride ateşten korunacaktır.

items.bags.velvetpouch.name=kadife kese
items.bags.velvetpouch.desc=Bu küçük kadife kese içinde bir sürü eşya bulundurabilir, tohumlar, rün taşları, ve bazı simya maddeleri.
items.bags.velvetpouch.discover_hint=Kahramanlardan birisi bu eşyayla başlar.

items.bags.magicalholster.name=büyülü kılıf
items.bags.magicalholster.desc=Bu ince kılıf egzotik bir hayvanın derisinden yapılmış ve çok sayıda menzilli silah taşımanı sağlayan kuvvetli bir sihir taşıyor.\n\nKolayca çantaya elini sokup tam aradığın eşyayı tutabilirsin.\n\nBu kılıfın taşıdığı sihir sayesinde asalar biraz daha hızlı şarj olur ve fırlatılan silahların ömrü biraz daha artar.



###bombs
items.bombs.arcanebomb.name=gizemli bomba
items.bombs.arcanebomb.desc=Bu bombaya gizemli özellikler kazandırılmıştır. Goo'nun pompalı saldırısına benzer güçlü bir patlamayla patlayacak ve 2 karo içindeki her şeye _%1$d-%2$d büyü hasarı_ verecek.
items.bombs.arcanebomb.discover_hint=Bu eşyayı simya ile üretebilirsin.

items.bombs.bomb.name=bomba
items.bombs.bomb.ac_lightthrow=YAK & FIRLAT
items.bombs.bomb.snuff_fuse=Bombanın fitilini çabucak söndürdün.
items.bombs.bomb.ondeath=Patlama seni öldürdü...
items.bombs.bomb.rankings_desc=Bir patlama tarafından öldürüldü
items.bombs.bomb.desc=Oldukça ağır bir kara barut bombası. Bu bombanın patlaması, bitişiğindeki her şeye 1-2 hasar verir ve bazı bitişik arazileri veya eşyaları yok eder.Oldukça ağır bir kara barut bombası. Bu bombanın patlaması, bitişiğindeki her şeye _%1$d-%2$d hasar_ verir ve bazı bitişik arazileri veya eşyaları yok eder.
items.bombs.bomb.desc_fuse=Görünüşe göre fitilin ateşlendikten sonra tamamen yanması için birkaç sıra beklemek gerekiyor.
items.bombs.bomb.desc_burning=Bombanın fitili yanıp gidiyor, ya ondan uzaklaş ya da fitili söndür!
items.bombs.bomb$doublebomb.name=iki bomba
items.bombs.bomb$doublebomb.desc=Bayağı ağır bir kara barut bomba çifti, görünüşe bakılırsa birini bedavaya alıyorsun!

items.bombs.firebomb.name=ateş bombası
items.bombs.firebomb.desc=Bu bomba daha geniş bir alanda patlayacak, _%1$d-%2$d hasar_ verecek ve 2 karo içinde sürekli alev yayacak şekilde değiştirildi.
items.bombs.firebomb.discover_hint=Bu eşyayı simya ile üretebilirsin.

items.bombs.flashbangbomb.name=flaş bombası
items.bombs.flashbangbomb.desc=Bu özelleştirilmiş bomba patladığında bir ışık, ses ve elektrik patlamasına dönüşecek. 2 karo içindeki her şey patlamadan _%1$d-%2$d hasar_, elektrikten ek %%25 hasar alır ve 10 tur boyunca sersemler.
items.bombs.flashbangbomb.discover_hint=Bu eşyayı simya ile üretebilirsin.

items.bombs.frostbomb.name=buz bombası
items.bombs.frostbomb.desc=Bu bomba daha geniş bir alanda patlayacak, _%1$d-%2$d_ hasar verecek ve 2 karo içinde sürekli bir dondurucu hava dalgası yayacak şekilde değiştirildi.
items.bombs.frostbomb.discover_hint=Bu eşyayı simya ile üretebilirsin.

items.bombs.holybomb.name=kutsal bomba
items.bombs.holybomb.desc=Bu bomba, patladığında daha geniş bir alanda kutsal ışık saçacak şekilde değiştirildi. 2 karo içindeki her şey patlamadan _%1$d-%2$d hasar_ alır ve ölümsüz veya şeytani düşmanlar kutsal ışıktan ek %%50 hasar alır.
items.bombs.holybomb.discover_hint=Bu eşyayı simya ile üretebilirsin.

items.bombs.noisemaker.name=ses yapıcı
items.bombs.noisemaker.desc=Bu özelleştirilmiş bomba, fünyesi bittiğinde tekrar tekrar ses çıkaracak. Bombaya bir şey dokunduğunda patlayacak ve 2 karo içindeki her şeye _%1$d-%2$d hasar_ verecek!
items.bombs.noisemaker.desc_burning=Ses bombası bipliyor, yanına bir şey yaklaşırsa patlar!
items.bombs.noisemaker.discover_hint=Bu eşyayı simya ile üretebilirsin.

items.bombs.smokebomb.name=Sis bombası
items.bombs.smokebomb.desc=Bu bomba patladığı anda aynı zamanda yoğun bir gaz bulutu püskürtecek şekilde modifiye edilmiş. _%1$d-%2$d hasar_ verecek ve bu gaz iki karo yayılacak
items.bombs.smokebomb.discover_hint=Bu eşyayı simya ile üretebilirsin.

items.bombs.regrowthbomb.name=yeniden büyüme bombası
items.bombs.regrowthbomb.desc=Bu özelleştirilmiş bomba patlamak yerine 3 karo içinde her yere hayat veren sıvı sıçratır. Patlamaya maruz kalan bölgede hızla çim ve bitkiler filizlenir. Kendiniz ve patlamaya yakalanan tüm müttefikleriniz bir iyileştirme iksiri içmiş gibi iyileşir.
items.bombs.regrowthbomb.discover_hint=Bu eşyayı simya ile üretebilirsin.

items.bombs.shrapnelbomb.name=şarapnel bombası
items.bombs.shrapnelbomb.desc=Bu bomba DM-300'ün metal parçalarıyla geliştirilmiştir, patladığında parçalanarak etrafa saçılır ve bombanın etrafındaki geniş bir alanda _%1$d-%2$d hasar_ verir. Kullanırken bir şeyin arkasına saklansanız iyi olur...
items.bombs.shrapnelbomb.discover_hint=Bu eşyayı simya ile üretebilirsin.

items.bombs.woollybomb.name=yünlü bomba
items.bombs.woollybomb.desc=Bu özel yapım bombanın patlamasını takiben büyük bir alanı büyülü koyunlar kaplayacak. Patlama 2 karo içerisindeki her şeye _%1$d-%2$d hasar_ verecek. Koyunlar uzun süre duracak ve hareket etmene engel olacaklar! Güçlü düşmanlar mevcut iken koyunlar o kadar da uzun kalmayacak, ve istenirse koyunlarla karşılıklı etkileşim yoluyla bu süre kısaltılabilir.
items.bombs.woollybomb.discover_hint=Bu eşyayı simya ile üretebilirsin.

###food
items.food.berry.name=zindan dutu
items.food.berry.eat_msg=Bu dut lezzetliydi!
items.food.berry.desc=Bu küçük meyve, Avcı tarafından zindandaki çalıların arasında bulundu. Hızlı bir şekilde tüketilebilir, az miktarda tokluğu geri kazandırır ve bir tohum içerebilir!
items.food.berry.discover_hint=Bu karakteri belirli bir kahraman yeteneği kullanarak bulabilirsin.

items.food.blandfruit.name=tatsız meyve
items.food.blandfruit.cooked=pişmiş tatsızmeyve
items.food.blandfruit.sunfruit=güneş meyvesi
items.food.blandfruit.rotfruit=çürük meyve
items.food.blandfruit.earthfruit=dünya meyvesi
items.food.blandfruit.blindfruit=kör meyve
items.food.blandfruit.firefruit=ateş meyvesi
items.food.blandfruit.icefruit=buz meyvesi
items.food.blandfruit.fadefruit=soluk meyve
items.food.blandfruit.sorrowfruit=üzüntü meyvesi
items.food.blandfruit.stormfruit=fırtına meyvesi
items.food.blandfruit.dreamfruit=büyücü meyvesi
items.food.blandfruit.starfruit=yıldız meyvesi
items.food.blandfruit.swiftfruit=çevikmeyve
items.food.blandfruit.raw=Bunu çiğ yemeye için elvermiyor.
items.food.blandfruit.desc=Çok kuru ve temelsiz, belki başka bir malzeme ile pişirmek onu geliştirebilir.
items.food.blandfruit.desc_cooked=Meyve tencerede bekletildiği süre boyunca dolgunlaştı ve hatta pişirildiği tohumun özelliklerini emdi. Tohum hangi iksire karşılık geliyorsa onun etkisine sahip olacaktır.
items.food.blandfruit.desc_eat=Yenilmeye hazır görünüyor!
items.food.blandfruit.desc_throw=Baya uçucu görünüyor, onu fırlatmak yapılacak en iyi şey olabilir.
items.food.blandfruit$chunks.name=tatsızmeyve parçacıkları
items.food.blandfruit$chunks.desc=Tatsız meyve bir darbe nedeniyle parçalandı ve sonuç olarak arkasında parçalarını bıraktı.\n\nBirazcık tozlanmış olsalar da bu pişirilmiş tatsız meyve parçacıkları tamamen yenebilir gibi duruyor.

items.food.chargrilledmeat.name=kızartılmış et
items.food.chargrilledmeat.desc=Normal pişmiş bir et gibi görünüyor.
items.food.chargrilledmeat.discover_hint=Bunu başka bir yiyeceği kullanarak üretebilirsin.

items.food.food.name=yemek paketi
items.food.food.ac_eat=YE
items.food.food.eat_msg=Bu yemek lezzetliydi!
items.food.food.desc=Burada şık bir şey yok: kurumuş et, biraz bisküvi - bunun gibi şeyler.

items.food.frozencarpaccio.name=donmuş et
items.food.frozencarpaccio.invis=Ellerinin görünmez olduğunu görüyorsun!
items.food.frozencarpaccio.hard=Derinin sertleştiğini hissediyorsun!
items.food.frozencarpaccio.refresh=Tazeleyici!
items.food.frozencarpaccio.better=Daha iyi hissediyorsun!
items.food.frozencarpaccio.desc=Bu bir parça donmuş çiğ et. Bunu yemenin tek yolu küçük parçalara ayırmak. Bu yolla tadı şaşırtıcı derecede güzel.
items.food.frozencarpaccio.discover_hint=Bunu başka bir yiyeceği kullanarak üretebilirsin.

items.food.meatpie.name=etli börek
items.food.meatpie.eat_msg=Bu yemek harikaydı!
items.food.meatpie.desc=Tuzlu etle doldurulmuş enfes bir börek. Bu yemek seni diğer bütün yemeklerden daha tok tutacak.
items.food.meatpie.discover_hint=Bu eşyayı simya ile üretebilirsin.

items.food.mysterymeat.name=gizemli et
items.food.mysterymeat.eat_msg=Bu yemeğin tadı... garipti.
items.food.mysterymeat.hot=Oh, bu sıcak!
items.food.mysterymeat.legs=Bacaklarını hissedemiyorsun!
items.food.mysterymeat.not_well=İyi hissetmiyorsun.
items.food.mysterymeat.stuffed=Tıkandın.
items.food.mysterymeat.desc=Kendi riskine ye!
items.food.mysterymeat.discover_hint=Bu eşyayı belirli düşmanlardan düşünce edinebilirsin.
items.food.mysterymeat$placeholder.name=et

items.food.phantommeat.name=hayalet eti
items.food.phantommeat.desc=Büyük pırıl pırıl yarı saydam et, hayalet piranadan kesilip çıkartılmış. Bu büyülü etin pişirilmesine gerek yok ve seni tamamen doyurmanın yanı sıra birtakım yararlar sağlar. Yenildiğinde görünmezlik, kabukderi ve biraz iyileşme sağlayıp birçok zararlı etkiyi temizler.
items.food.phantommeat.discover_hint=Bu eşyayı belirli düşmanlardan düşünce edinebilirsin.

items.food.pasty.name=etli börek
items.food.pasty.fish_name=buğulama balık
items.food.pasty.amulet_name=Yendor'un tılsımı mı?
items.food.pasty.egg_name=paskalya yumurtası
items.food.pasty.rainbow_name=gökkuşağı iksiri
items.food.pasty.shattered_name=yeşil kek
items.food.pasty.pie_name=bal kabağı turtası
items.food.pasty.vanilla_name=mavi kek
items.food.pasty.cane_name=şeker kamışı
items.food.pasty.sparkling_name=köpüklü iksir
items.food.pasty.desc=Geleneksel et ve patates harcıyla yapılmış hakiki bir börek. Nefis!
items.food.pasty.fish_desc=Yeşillik yatağında sihirli bir şekilde korunmuş, buharda pişirilmiş bütün bir balık. Yılın bu zamanlarında bir miktar balığı daha sonrası için saklamak bir gelenektir, böylece hepsini bir kerede yemek yerine bir miktar artığı saklamış olursunuz.\n\nAy Yeni Yılınız Kutlu Olsun!
items.food.pasty.amulet_desc=Sonunda onu buldunuz, büyülü tılsımı - bir dakika, bu sadece tılsım gibi görünmesi için folyoya sarılmış bir çikolata! Size sınırsız güç vermeyecek ama en azından içinizi dolduracak ve size küçük bir eser şarjı sağlayacak.\n\n1 Nisan Şakası!
items.food.pasty.egg_desc=Renkli sarı folyoya sarılmış kocaman bir çikolatalı yumurta. Burada sizi doyurmaya yetecek kadar çikolata var ve şeker, eserlerinize biraz daha fazla enerji verebilir.\n\nMutlu Paskalyalar!
items.food.pasty.rainbow_desc=Bu renkli iksir bir tür sıvı gıdadır. Açlığınızı gidermenin yanı sıra, içindeki küçük bir sihir sayesinde patron olmayan bir düşmanı sakinleştirerek geçici olarak sizinle savaşmaktan çekinmesini sağlar.\n\nMutlu Onurlar!
items.food.pasty.shattered_desc=Bu büyük vanilyalı kek dilimi renkli süslere ve yeşil kremaya sahip. Pasta, yılların deneyimini kutlamak için yapıldı ve yenildiğinde size bu deneyimin küçük bir kısmını verecektir.\n\nShattered Pixel Dungeon ilk olarak 5 Ağustos 2014'te piyasaya sürüldü. Doğum günün kutlu olsun Shattered Pixel Dungeon!
items.food.pasty.pie_desc=Kocaman bir dilim balkabağı turtası. Tatlı ve baharatlı lezzeti sizi doyuracak ve bir parça şifa verecektir.\n\nMutlu Cadılar Bayramı!
items.food.pasty.vanilla_desc=Bu büyük dilim vanilyalı pastanın üzerinde renkli serpintiler ve mavi krema bulunmaktadır. Pasta, yılların deneyimini kutlamak için yapılmıştır ve yenildiğinde size bu deneyimin küçük bir miktarını verecektir.\n\nOrijinal Pixel Dungeon ilk olarak 4 Aralık 2012 tarihinde yayınlanmıştır. İyi ki doğdun Pixel Dungeon!
items.food.pasty.cane_desc=Kocaman şekerli bir şeker kamışı. Sizi doyuracak kadar büyüktür ve şekeri de asalarınıza biraz ekstra güç verebilir.\n\nİyi tatiller!
items.food.pasty.sparkling_desc=Bu köpüklü iksir bir tür sıvı gıdadır. Açlığı giderir ve köpüklü şarabı taklit eder, ancak aslında alkollü değildir. Karnınızdaki sıcaklık hissi biraz kalkan görevi görecektir.\n\nMutlu Yıllar!
items.food.pasty$fishleftover.name=balık artıkları
items.food.pasty$fishleftover.eat_msg=Bu yemeğin tadı fena değildi.
items.food.pasty$fishleftover.desc=Önceki öğününüzden kalan biraz balık. Biraz açlığı gidermek için istediğiniz zaman yiyebilirsiniz.

items.food.smallration.name=küçük yemek paketi
items.food.smallration.eat_msg=Bu yemeğin tadı fena değildi.
items.food.smallration.desc=Tam olarak standart bir yemek paketi gibi görünüyor ama daha küçük.
items.food.smallration.discover_hint=Bu eşyayı bir mağazadan satın alabilirsin.

items.food.stewedmeat.name=güveç et
items.food.stewedmeat.eat_msg=Bu yemeğin tadı fena değildi.
items.food.stewedmeat.desc=Eti güveç haline getirmek onu tüm hastalıklardan ve parazitlerden temizledi. Artık bunu yemek güvenli olmalı.
items.food.stewedmeat.discover_hint=Bu eşyayı simya ile üretebilirsin.

items.food.supplyration.name=tedarik oranı
items.food.supplyration.desc=Bu tayın zindana hırsızlar loncası üyeleri tarafından ve onlar için bırakılmıştır. Hareket halindeyken yenmek ve genel kurnazlıklara yardımcı olmak için özel olarak tasarlanmıştır.\n\nSizi normal bir tayın kadar doyurmasa da, hızlıca yenebilir, biraz doğrudan iyileşme sağlar ve Düzenbazın Gölgeler Pelerini'ne bir şarj geri yükler.
items.food.supplyration.discover_hint=Bu karakteri belirli bir kahraman yeteneği kullanarak bulabilirsin.



##journal items
items.journal.documentpage.name=aşınmış sayfa
items.journal.documentpage.desc=Yalnız bir sayfa, muhtemelen bir kitaptan veya benzeri bir şeyden düşmüş. Okumak için yerden alman gerekiyor.

items.journal.alchemypage.name=yırtık simya kitabı sayfası
items.journal.alchemypage.desc=Simya üzerine yazılmış bir rehber kitabından bir sayfa.\n\nYazının çoğu uzaktan okumak için çok küçük, fakat sayfanın başlığını çıkarabiliyorsun:\n\n_"%s"_

items.journal.guidebook.name= zindan ustalığı cildi
items.journal.guidebook.hint_mobile=Rehber kitabında senin için bazı tavsiyeler var! Okumak için sağ üst köşede yanıp sönen günlük düğmesine dokun.
items.journal.guidebook.hint_desktop=Rehberinde bazı tavsiyeler var! Okumak için sağ üst köşedeki yanıp sönen günlük simgesine (%s) tıkla.
items.journal.guidebook.hint_status=Rehber kitap
items.journal.guidebook.desc=Bir maceracının rehber kitabı, maceraya atılmanın ona göre olmadığına karar vermiş biri tarafından buraya bırakılmış! Bu özel kitap büyülü ve maceracıları doğru zamanda bir sayfayı okumaya sevk edebilir.\n\nBu işlevselliğe rağmen, kitap en çok kapakta büyük dostça harflerle yazılmış "Panik Yapmayın!" kelimeleri nedeniyle popülerdir.

items.journal.guidepage.name=aşınmış kılavuz sayfası
items.journal.guidepage.desc=Bir macera kılavuzundan yırtılmış bir sayfa.\n\nYazının çoğunluğu uzaktan okuyabilmek için çok küçük, ama sayfanın başlığını çıkarabiliyorsun:\n\n_"%s"_

items.journal.regionlorepage$sewers.name=eskimiş mektup
items.journal.regionlorepage$sewers.desc=Bir mektuba benzeyen bu şey, toprak lekeli bir kağıda yazılmış. Okumak için onu alman gerekecek.

items.journal.regionlorepage$prison.name=eskimiş günlük girdisi
items.journal.regionlorepage$prison.desc=Bir günlük girdisi, ya da bir çeşit kayıt, eski bir kağıt parçası üzerine yazılmış. Diğer bulduğun mektuplardan daha iyi halde kalmış olsa bile onu okumak için eline alman gerekecek.

items.journal.regionlorepage$caves.name=eskimiş kayıt girdisi
items.journal.regionlorepage$caves.desc=Bir kâşifin seyir defterindeki bir girdi gibi görünüyor, ne kadar eski olmasına rağmen şaşırtıcı derecede iyi korunmuş. Okumak için yerden al.

items.journal.regionlorepage$city.name=paslı tablet
items.journal.regionlorepage$city.desc=İçindeki mesaj sihirli bir şekilde kazınmış, küçük paslı metal bir tablet. Tabletin yaşına rağmen harfler hala net, ancak okumak için onu alman gerekecek.

items.journal.regionlorepage$halls.name=parlayan tablet
items.journal.regionlorepage$halls.desc=İçine parlak yeşil harfler kazınmış küçük siyah bir tablet. Parlayan harfler uzakta bulanıklaşıyor, okumak için onu alman gerekecek.


###keys
items.keys.goldenkey.name=altın anahtar
items.keys.goldenkey.desc=Bu anahtarın dişleri küçücük ve karmaşık. Acaba kilitli bir sandığı açabilir mi?

items.keys.crystalkey.name=Kristal anahtar
items.keys.crystalkey.desc=Bu kristal anahtarın kesik yüzeyleri karanlıkta parıldıyor. Belki kristalden yapılmış bir şeyi açar?

items.keys.ironkey.name=demir anahtar
items.keys.ironkey.desc=Bu anahtarın üzerindeki çentikler aşınmış; üzerindeki deri kordon yıllar geçtikçe çürümüş. Acaba bu anahtar ile hangi kapı açılabilir?

items.keys.wornkey.name=aşınmış anahtar
items.keys.wornkey.desc=Bu anahtar aşınmış ve rengi solmuş, ama ciddi görünüyor. Muhtemelen yakındaki önemli bir kapıyı açabilir.



###potions
items.potions.potion.ac_drink=İÇ
items.potions.potion.turquoise=turkuaz iksir
items.potions.potion.crimson=kızıl iksir
items.potions.potion.azure=gök mavisi iksir
items.potions.potion.jade=yeşim iksir
items.potions.potion.golden=altın iksir
items.potions.potion.magenta=eflatun iksir
items.potions.potion.charcoal=kömürsü iksir
items.potions.potion.ivory=fildişi iksir
items.potions.potion.amber=kehribar iksir
items.potions.potion.bistre=kahverengi iksir
items.potions.potion.indigo=çivit iksir
items.potions.potion.silver=gümüş iksir
items.potions.potion.unknown_desc=Bu şişe girdap halinde dönen renkli bir sıvı içeriyor. İçildiğinde veya fırlatıldığında ne yapacağını kim bilebilir?
items.potions.potion.harmful=Zararlı iksir!
items.potions.potion.beneficial=Yararlı iksir
items.potions.potion.yes=Evet, ne yaptığımı biliyorum
items.potions.potion.no=Hayır, fikrimi değiştirdim
items.potions.potion.sure_drink=İçmek istediğine emin misin? Genellikle bu türden iksirleri düşmanların üstüne atmalısın.
items.potions.potion.sure_throw=Fırlatmak istediğine emin misin? Genellikle bu gibi iksirleri içmek daha mantıklıdır.
items.potions.potion.shatter=Cam kırılıyor ve içindeki sıvı zararsızca etrafa sıçrıyor.
items.potions.potion.discover_hint=Bu etkiye sahip bir eşyayı zindanda rastgele bulabilirsin ya da simya ile üretebilirsin.
items.potions.potion$placeholder.name=iksir
items.potions.potion$seedtopotion.name=Rastgele İksir

items.potions.potionofexperience.name=deneyim iksiri
items.potions.potionofexperience.desc=Çok sayıda tarihi savaşın deneyimlerinin sıvı bir hale indirgenerek saklandığı bu sıvıyı içmek tecrübe seviyeni anında arttıracaktır.

items.potions.potionoffrost.name=dondurma iksiri
items.potions.potionoffrost.desc=Bu iksirin içindeki kimyasal, hava ile temas ettiğinde dondurucu bir bulut oluşturacaktır.

items.potions.potionofhaste.name=acele iksiri
items.potions.potionofhaste.energetic=Enerjik hissediyorsun!
items.potions.potionofhaste.desc=Bu ilginç biçimde tatlı sıvıyı içmek sana kısa süreyle muazzam bir enerji kazandırarak yüksek hızlarda koşmanı sağlayacaktır.

items.potions.potionofhealing.name=iyileştirme iksiri
items.potions.potionofhealing.heal=Yaraların kapanmaya başlıyor.
items.potions.potionofhealing.desc=Bu iksir canını hızla yenileyecek ve birçok rahatsızlığı iyileştirecektir.

items.potions.potionofinvisibility.name=görünmezlik iksiri
items.potions.potionofinvisibility.invisible=Ellerinin görünmez olduğunu görüyorsun!
items.potions.potionofinvisibility.desc=Bu iksiri içtiğinizde geçici olarak görünmez olursunuz. Görünmezken düşmanlar sizi göremez. Fiziksel saldırılar ve büyülü etkiler (parşömenler ve asalar gibi) görünmezliği derhal iptal eder.

items.potions.potionoflevitation.name=uçma iksiri
items.potions.potionoflevitation.float=Havada süzülüyorsun!
items.potions.potionoflevitation.desc=Bu ilginç sıvıyı içmek havada süzülmene neden olarak tuzak ve çukurlar üzerinden zahmetsizce uçmanı sağlar. Bu iksiri fırlatmak rafine edilmemiş bir gaz bulutu oluşturarak içinde kalan her şeyin kafasını karıştırır.

items.potions.potionofliquidflame.name=sıvı ateş iksiri
items.potions.potionofliquidflame.desc=Bu cam şişe içinde hava ile temas halinde şiddetli bir biçimde ateş alan dengesiz bir bileşik bulunuyor.

items.potions.potionofmindvision.name=akıl görüşü iksiri
items.potions.potionofmindvision.see_mobs=Bir şekilde diğer yaratıkların zihinlerinin varlığını hissediyorsun!
items.potions.potionofmindvision.see_none=Bir şekilde bu seviyede şu anda yalnız olduğunu hissediyorsun.
items.potions.potionofmindvision.desc=Bunu içtikten sonra zihnin yakınlardaki yaratıkların fiziksel imzası ile bağdaşacak, bu da biyolojik varlıkları duvarların ardından görebilmeni sağlayacak. Ayrıca bu iksir, yakındaki kapı ve duvarları da görmeni sağlar.

items.potions.potionofparalyticgas.name=felç edici gaz iksiri
items.potions.potionofparalyticgas.desc=Açık hava ile temas ettiğinde bu şişenin içindeki sıvı felç edici sarı bir duman oluşturur. Bu dumanı soluyan herkes anında felç olarak duman dağıldıktan sonra bir zamana kadar hareket edemez hale gelir. Bu eşyayı uzaktaki düşmanlara fırlatarak onları gazın etkisi içinde yakalamak mümkündür.

items.potions.potionofpurity.name=temizlik iksiri
items.potions.potionofpurity.freshness=Havada sıradışı bir tazelik hissediyorsun.
items.potions.potionofpurity.protected=Koruyucu bir tabaka seni örtüyor!
items.potions.potionofpurity.desc=Bu büyülü sıvı, geniş bir alandaki tüm zararlı alana bağlı etkileri hızla etkisiz hale getirecektir. Bunu içmek size bu tür etkilere karşı geçici bağışıklık kazandıracaktır.

items.potions.potionofstrength.name=güç iksiri
items.potions.potionofstrength.msg=Yeni keşfedilen güç vücudunuzda dalgalanıyor, artık gücün %d!
items.potions.potionofstrength.desc=Bu güçlü sıvı kasların boyunca ilerleyip kalıcı olarak gücünü bir puan arttıracaktır.

items.potions.potionoftoxicgas.name=zehirli gaz iksiri
items.potions.potionoftoxicgas.desc=Bu basınçlı şişeyi açmak ya da parçalamak içindekilerin ölümcül bir zehirli gaz bulutu oluşturmasına neden olur. Bu iksiri elle açmaktansa uzaktaki düşmanlarına fırlatmayı tercih edebilirsin.



###brews
items.potions.brews.brew.discover_hint=Bu eşyayı simya ile üretebilirsin.

items.potions.brews.aquabrew.name=su karışımı
items.potions.brews.aquabrew.desc=Bu iksir kırıldığında, o yerden basınçlı su püskürtecektir. Gücü sadece ateşli düşmanlara zarar verecek kadardır ama yakındaki zemini de suya çevirecek, buralardaki tuzakları zararsız hale getirecek, ateşi söndürecek ve yanındaki düşmanı iteleyecektir.

items.potions.brews.blizzardbrew.name=kar fırtınası iksiri
items.potions.brews.blizzardbrew.desc=Bu karışım kırıldığında gaz gibi hızlıca yayılan hortum gibi bir tipi açığa çıkarır

items.potions.brews.causticbrew.name=aşındırıcı karışım
items.potions.brews.causticbrew.desc=Bu karışım, aşındırıcı çamuru fırlatıldığı bölgenin etrafındaki geniş bir alana yayacaktır. Bu çamura yakalanan herhangi bir şey, suyla yıkanmaması durumunda yavaşça eriyecektir.

items.potions.brews.infernalbrew.name=cehennem karışımı
items.potions.brews.infernalbrew.desc=Parçalandığında, bu karışım gaz gibi hızla yayılan azgın bir cehennemi serbest bırakacaktır.

items.potions.brews.shockingbrew.name=şok edici karışım
items.potions.brews.shockingbrew.desc=Parçalandığında, bu karışım kırıldığı yerin çevresinde geniş bir alanda bir elektrik fırtınası salacak.

items.potions.brews.unstablebrew.name=dengesiz karışım
items.potions.brews.unstablebrew.desc=Bu büyülü karışım gökkuşağının değişen renkleriyle parlıyor.\n\nİçildiğinde veya fırlatıldığında rastgele bir iksirin etkisini tetikler. İksir etkisi içildiğinde her zaman faydalı, fırlatıldığında ise her zaman zararlı olacaktır.

###elixirs
items.potions.elixirs.elixir.discover_hint=Bu eşyayı simya ile üretebilirsin.

items.potions.elixirs.elixirofarcanearmor.name=sihirli zırh iksiri
items.potions.elixirs.elixirofarcanearmor.desc=Bu iksir onu içen kişiye uzun süreli bir büyü direnci verecektir.

items.potions.elixirs.elixirofaquaticrejuvenation.name=suda iyileşme iksiri
items.potions.elixirs.elixirofaquaticrejuvenation.desc=Bu iksir sağlık iksiri ve Goo'nun kalıntılarından oluşuyor. Bu iksir direk can kazanmanızı sağlamazken sudayken sürekli ve normalden daha fazla can verir
items.potions.elixirs.elixirofaquaticrejuvenation$aquahealing.name=suda iyileşme
items.potions.elixirs.elixirofaquaticrejuvenation$aquahealing.desc=Geçici bir süre için Goo'nunkine benzer yenileyici özellikler kazandın\nSudayken her sırada ufak bir miktar can yenilersin. Bu etki ya canının tamamı dolu ise ya da sudan çıktığında sona erer\nKalan iyileştirme%d

items.potions.elixirs.elixirofdragonsblood.name=ejderha kanı özütü
items.potions.elixirs.elixirofdragonsblood.desc=Bu özüt tüketildiği zaman içen kişinin damarlarına ateşli bir güç akışı gönderir. Bu etki içen kişiyi ateşe bağışıklı yapar ve düşmanlarını, onlara fiziksel saldırılar yaparak yakma olanağı sağlar.

items.potions.elixirs.elixiroffeatherfall.name=tüy düşüşü iksiri
items.potions.elixirs.elixiroffeatherfall.light=Bir tüy gibi hafif hissediyorsun!
items.potions.elixirs.elixiroffeatherfall.desc=Bu iksir daha güçsüz ama daha kontrollü. Bunu içen kişi bir süreliğine hasar almadan uzun mesafelerden düşebilir.
items.potions.elixirs.elixiroffeatherfall$featherbuff.name=tüy düşüşü
items.potions.elixirs.elixiroffeatherfall$featherbuff.desc=Yavaş düşüş iksirinin etkisi altındasın, uçurumlardan hasar almadan düşebilirsin!\n\nKalan tur: %s.

items.potions.elixirs.elixirofhoneyedhealing.name=ballı iyileşme özütü
items.potions.elixirs.elixirofhoneyedhealing.desc=Bu iksir şifa ile balın tatlılığını birleştirir. İçildiğinde, bir şifa iksiriyle aynı etkiyi gösterir ve az miktarda açlığı giderir, ancak aynı zamanda bir müttefiki iyileştirmek için de atılabilir.\n\nBala yakınlığı olan yaratıklar, bu eşya üzerlerinde kullanıldığında sakinleşebilir.

items.potions.elixirs.elixiroficytouch.name=buz dokunuşu özütü
items.potions.elixirs.elixiroficytouch.desc=Kullanıldığında, bu özüt içen kişinin saldırdığı düşmanlardan ısı çekmesini sağlar. Bu etki, içen kişiye soğuğa karşı bağışıklılık kazandırır, ve içen kişinin fiziksel saldırılarla saldırdığı düşmanları üşütür.

items.potions.elixirs.elixirofmight.name=güç özütü
items.potions.elixirs.elixirofmight.msg=Yeni keşfedilen güç vücudunuzda dalgalanıyor, artık gücün %d!
items.potions.elixirs.elixirofmight.desc=Bu güçlü sıvı kaslarınızdan geçerek gücünüzü kalıcı olarak bir puan artırır ve en yüksek canınızı geçici olarak %d puan artırır. Sağlık artışı en yüksek sağlığınızla ölçeklenir, ancak seviye kazandıkça yavaş yavaş azalır.
items.potions.elixirs.elixirofmight$htboost.name=maks. sağlık artışı
items.potions.elixirs.elixirofmight$htboost.desc=Vücudunuz doğal olmayan bir şekilde güçlü ve sağlıklı hissediyor.\n\nEn yüksek sağlığınız uzun bir süre boyunca artar. Seviye kazandıkça, destek giderek azalır.\n\nŞu anki artış miktarı: %d.\nKalan seviye: %d.

items.potions.elixirs.elixiroftoxicessence.name=zehir özü iksiri
items.potions.elixirs.elixiroftoxicessence.desc=Bu iksir tüketildiğinde, içen kişiye zehirli enerji kazandırır. İçen kişi hareket ettikçe sürekli olarak zehirli gaz yayacak ve etki süresinden biraz daha uzun bir süre boyunca zehirli gaz ve zehre karşı bağışıklık kazanacaktır.



###exotic potions
items.potions.exotic.exoticpotion.turquoise=egzotik turkuaz rengi iksir
items.potions.exotic.exoticpotion.crimson=egzotik kızıl iksir
items.potions.exotic.exoticpotion.azure=egzotik gök mavisi rengi iksir
items.potions.exotic.exoticpotion.jade=egzotik yeşim iksir
items.potions.exotic.exoticpotion.golden=egzotik altın rengi iksir
items.potions.exotic.exoticpotion.magenta=egzotik eflatun rengi iksir
items.potions.exotic.exoticpotion.charcoal=egzotik kömür rengi iksir
items.potions.exotic.exoticpotion.ivory=egzotik fildişi iksiri
items.potions.exotic.exoticpotion.amber=egzotik kehribar iksir
items.potions.exotic.exoticpotion.bistre=egzotik barut rengi iksir
items.potions.exotic.exoticpotion.indigo=egzotik çivit rengi iksir
items.potions.exotic.exoticpotion.silver=egzotik gümüş rengi iksir
items.potions.exotic.exoticpotion.unknown_desc=Bu yuvarlak camın içerisinde tanecikli ve renkli bir sıvı var. Buralara yabancı gibi duruyor, içildiğinde veya fırlatıldığında ne olacağını kim bilir?
items.potions.exotic.exoticpotion.warning=Bu iksiri kullanmaktan vazgeçmek istediğine emin misin? Yine de tükenecek.
items.potions.exotic.exoticpotion.yes=Evet, eminim
items.potions.exotic.exoticpotion.no=Hayır, fikrimi değiştirdim
items.potions.exotic.exoticpotion.discover_hint=Bu eşyayı simya ile üretebilirsin.

items.potions.exotic.potionofcleansing.name=lanet kaldırma iksiri
items.potions.exotic.potionofcleansing.desc=Bu güçlü reaktif iksir içeni tüm zararlı durum etkilerine karşı birkaç tur koruyacaktır. Ayrıca, bir hedefe arındırma maksadıyla atılabilir.
items.potions.exotic.potionofcleansing$cleanse.name=arınmış
items.potions.exotic.potionofcleansing$cleanse.desc=Bu karakter tüm zararlı durum etkilerine karşı birkaç tur bağışıktır!\n\nKalan tur: %s.

items.potions.exotic.potionofcorrosivegas.name=aşındırıcı gaz iksiri
items.potions.exotic.potionofcorrosivegas.desc=Bu basınçlı şişeyi açmak ya da kırmak içindekilerin patlayıp pas rengi zehirli bir gaz bulutu çıkarmasına neden olur. Bu gaz zehirli gazdan daha hızlı yayılır ve daha ölümcüldür, fakat onun kadar uzun süre dayanmaz.

items.potions.exotic.potionofdragonsbreath.name=ejderha nefesi iksiri
items.potions.exotic.potionofdragonsbreath.prompt=Yakmak için bir bölge seç
items.potions.exotic.potionofdragonsbreath.desc=Bu şişede tükürük ile karıştıktan kısa bir süre sonra alev alan normalin dışı bir kimsasal bulunuyor. Bu sıvıyı çabucak tükürmek, kullanıcının ağzından ateş püskürmesini sağlayacaktır!

items.potions.exotic.potionofearthenarmor.name=dünyasal zırh iksiri
items.potions.exotic.potionofearthenarmor.desc=Bu sıvı, deriyi felç etmek yerine sertleştirerek onu geçici bir doğal zırh haline getirir.

items.potions.exotic.potionofdivineinspiration.name=ilâhi ilham iksiri
items.potions.exotic.potionofdivineinspiration.no_more_points=Daha fazla ekstra yetenek puanı kazanamazsın.
items.potions.exotic.potionofdivineinspiration.select_tier=İçinde iki ekstra puan kazanacağın bir yetenek sınıfı seç. Puanları harcayabilmen için o sınıfın kilidini açmış olman gerek.
items.potions.exotic.potionofdivineinspiration.bonus=+2 Yetenek Puanı!
items.potions.exotic.potionofdivineinspiration.desc=Kutsal enerjinin sıvı formuna indirgenmiş gücü olan bu iksir, içen kişiye ilahi bir güç vererek kendi seçtiği bir kademede iki ekstra yetenek puanı kazandırır.\n\nBu iksir her yetenek kademesi için yalnızca bir kez kullanılabilir.

items.potions.exotic.potionofmagicalsight.name=büyüsel görüş iksiri
items.potions.exotic.potionofmagicalsight.desc=Bunu içtikten sonra, duyularınız kısa bir süreliğine inanılmaz seviyelere yükselecek ve 12 karo yarıçapındaki duvarların arkasını görmenizi sağlayacaktır!

items.potions.exotic.potionofmastery.name=ustalık iksiri
items.potions.exotic.potionofmastery.prompt=Bir Eşyada Ustalaş
items.potions.exotic.potionofmastery.weapon_easier=Silahını tutmak kolaylaştı!
items.potions.exotic.potionofmastery.armor_easier=Zırhını giymek kolaylaştı!
items.potions.exotic.potionofmastery.desc=Bu iksir kaba kuvvet vermek yerine onu içenin kaslarını belirli bir eşyaya alıştırır. Sanki iksiri içen o eşyayla antrenman yapıp kas hafızası elde etmişçesine o eşyayı kullanmayı kolaylaştırır.\n\nSeçtiğin bir silah ya da zırh 2 puan daha az güç ister. Bu iksir her eşya üzerinde sadece bir kere kullanılabilir.

items.potions.exotic.potionofshielding.name=korunma iksiri
items.potions.exotic.potionofshielding.desc=Kullanıcısını iyileştirmek yerine bu iksir onun etrafında dayanıklı bir kalkan oluşturarak onu hatrı sayılır bir miktar hasardan koruyacaktır.

items.potions.exotic.potionofshroudingfog.name=gizleyici sis iksiri
items.potions.exotic.potionofshroudingfog.desc=Bu şişedeki sıvı havayla temas ettiğinde çabucak yayılan ve düşmanların görüşünü engelleyen yoğun, dumanlı bir sis üretir.

items.potions.exotic.potionofsnapfreeze.name=anında donma iksiri
items.potions.exotic.potionofsnapfreeze.desc=Bu iksirde saklanan kimyasal, hava ile sürekli olarak tepkimeye girerek etkisi altındaki her şeyi donduracak ve yerine kökleyecektir.

items.potions.exotic.potionofstamina.name=kondisyon iksiri
items.potions.exotic.potionofstamina.desc=Bu garip derecedeki tatlı sıvıyı içmek seni uzun süreli bir enerji artışı ile sarar, bu da uzun bir süreliğine daha da hızlı bir şekilde koşmanı sağlar.

items.potions.exotic.potionofstormclouds.name=fırtına bulutları iksiri
items.potions.exotic.potionofstormclouds.desc=Bu iksir fırlatıldığında hızla yayılan konsantre bir buhar bulutu oluşur ve bu buhar yoğunlaşarak çevreye yayılır. Çoğu arazi suya dönüşecek, ateşli düşmanlar hasar alacak, ateş sönecek ve tuzaklar alt edilip kırılacaktır.



###quest items
items.quest.ceremonialcandle.name=seromonik mum
items.quest.ceremonialcandle.desc=Bir dizi mum, kullanım sonucu erimiş ve aşınmış. \n\nYalnızken değersizdirler, fakat diğer mumlarla bir şekil üzerinde kullanılırsa bir rituel oluşturmak üzerinde yoğunlaşabilirler.
items.quest.ceremonialcandle.discover_hint=Bu eşyayı belirli bir görev esnasında bulabilirsin.

items.quest.corpsedust.name=ceset tozu
items.quest.corpsedust.chill=Sırtından bir ürperti iniyor.
items.quest.corpsedust.desc=Bu ceset tozu normal bir toz yığınından pek de fark etmiyor. Ama etrafında kötü bir enerjinin süzüldüğünü hissedebiliyorsun. \n\nBundan bir an önce kurtulmak iyi bir fikir olabilir.
items.quest.corpsedust.discover_hint=Bu eşyayı belirli bir görev esnasında bulabilirsin.

items.quest.darkgold.name=kara altın cevheri
items.quest.darkgold.you_now_have=Artık %d kara altının var.
items.quest.darkgold.desc=Bu metalin adı kara, ama rengi yüzünden değil (normal altından farksız), daha çok güneş ışığı altında eriyip yeryüzünde işe yaramaz olması yüzünden.
items.quest.darkgold.discover_hint=Bu eşyayı belirli bir görev esnasında bulabilirsin.

items.quest.dwarftoken.name=cüce jetonu
items.quest.dwarftoken.desc=Çoğu cüce ve onların bazı büyük yapıtları bu küçük metal parçalarını bilinmeyen bir nedenden dolayı taşıyordu. Belki de bir çeşit mücevher veya kimlik görevi görüyorlardı. Cüceler garip bir halk.
items.quest.dwarftoken.discover_hint=Bu eşyayı belirli bir görev esnasında bulabilirsin.

items.quest.embers.name=elementer köz
items.quest.embers.desc=Sadece genç ateş elementallerinden elde edilebilen özel közler. Termal enerji yayıyorlar.
items.quest.embers.discover_hint=Bu eşyayı belirli bir görev esnasında bulabilirsin.

items.quest.escapecrystal.name=kaçış kristali
items.quest.escapecrystal.ac_use=KULLAN
items.quest.escapecrystal.desc=Işınlanma büyüsü içeren ince bir sihirli büyü kristali. Kristali istediğiniz zaman cüce mahzeninden çıkmak için kullanabilirsiniz, ancak yanınızda hiçbir şey götüremezsiniz!
items.quest.escapecrystal.discover_hint=Bu eşyayı belirli bir görev esnasında bulabilirsin.

items.quest.gooblob.name=yapışkan çamur damlası
items.quest.gooblob.desc=Ölürken Goo'dan ayrılmış, sallantılı bir yapışkan madde. Neredeyse büyük bir jöle topu gibidir, ancak onu yemeye cesaret edemezsiniz.\n\nTek başına hiçbir işe yaramaz, ancak bazı iksirlerle veya bir bombayla birleştirildiğinde faydalı olabilir. En azından makul miktarda enerjiye dönüşmesi gerekir.
items.quest.gooblob.discover_hint=Bu eşyayı belirli düşmanlardan düşünce edinebilirsin.

items.quest.metalshard.name=lanetli metal parçası
items.quest.metalshard.desc=DM-300 yok edilirken ondan kopan paslanmış lanetli metal parçası. İçinde aktif olmayan kötü niyetli bir büyü hissedebilirsiniz.\n\nTek başına hiçbir işe yaramıyor ama bazı parşömenlerle ya da bir bombayla birleştirildiğinde faydalı olabilir. En azından makul miktarda enerjiye dönüşmesi gerekir.
items.quest.metalshard.discover_hint=Bu eşyayı belirli düşmanlardan düşünce edinebilirsin.

items.quest.pickaxe.name=kazma
items.quest.pickaxe.ability_name=delmek
items.quest.pickaxe.ability_desc=Düellocu bir düşmanı kazmayla _delebilir_. Bu vuruş garantilidir, 3 tur boyunca savunmasız kalır ve sert derili düşmanlara _%1$d-%2$d hasar_ verir.
items.quest.pickaxe.upgrade_ability_stat_name=Yetenek hasarı
items.quest.pickaxe.desc=Bu, kayaları kırmak için sağlam ve ağır bir alettir. Bununla madencilik yapmak için kazmayı kuşanmanıza gerek yoktur, ancak muhtemelen bir silah olarak kuşanılabilir.
items.quest.pickaxe.discover_hint=Bu eşyayı belirli bir görev esnasında bulabilirsin.

items.quest.ratskull.name=geniş fare kafatası
items.quest.ratskull.desc=Şaşırtıcı derecede geniş bir fare kafatası. Eğer asacak bir duvarın olsaydı harika bir zafer hatırası olabilirdi.



###remains
items.remains.remainsitem.ac_use=KULLAN
items.remains.remainsitem.discover_hint=Bu eşyayı, daha önce zindanda yitip gitmiş belirli bir kahramanın kalıntıları içinde bulabilirsin.

items.remains.bowfragment.name=yay parçası
items.remains.bowfragment.desc=Bu kırık tahta parçası bir zamanlar kayıp bir Avcı'nın ruh yayının bir parçasıydı. Parçada hâlâ biraz doğa enerjisi kaldığını hissedebilirsiniz, parçayı etrafınızda biraz yüksek ot yetiştirmek için kullanabilirsiniz. Ancak bunu yapmak parçayı yok edecektir.

items.remains.brokenhilt.name=kırık kabza
items.remains.brokenhilt.desc=Bu kırık kabza, yenilmiş bir Düellocunun silahından gelmiş gibi görünüyor. Kabzada hala biraz dövüş gücü kaldığını hissedebilirsiniz, bunu sonraki iki yakın dövüş vuruşunuzda biraz ilave hasar almak için kullanabilirsiniz. Ancak bunu yapmak kabzayı yok edecektir.

items.remains.brokenstaff.name=kırık asa
items.remains.brokenstaff.desc=Bu büyücü asası, sahibi öldükten sonra ikiye bölünmüş. Asada hâlâ biraz sihirli enerji kaldığını hissedebilirsiniz, bunu asalarınıza biraz şarj desteği vermek için kullanabilirsiniz. Ancak bunu yapmak asayı yok edecektir.

items.remains.cloakscrap.name=kumaş artığı
items.remains.cloakscrap.desc=Bu yarı saydam kumaş parçası, geç dönem bir Düzenbazın gölgeler pelerininden kalmış gibi görünüyor. İçinde hala biraz mistik enerji kaldığını hissedebilirsiniz, bunu eserlerinize biraz şarj desteği vermek için kullanabilirsiniz. Ancak bunu yapmak kumaşı yok edecektir.

items.remains.sealshard.name=mühür kırıkları
items.remains.sealshard.desc=Bu küçük kırmızı balmumu parçaları, kaybetmiş bir Savaşçının mühründen gelmiş gibi görünüyor. Mühürde hala biraz irade gücü kaldığını hissedebiliyorsun, bunu kendine biraz kalkan sağlamak için kullanabilirsin. Ancak bunu yapman mühür parçalarını yok edecektir.

items.remains.tornpage.name=aşınmış sayfa
items.remains.tornpage.desc=Bu sayfa son nefesini vermiş bir Ruhban'ın kutsal kitabından kopmuş gibi görünüyor. Üstünde hâla biraz ilahi enerji tutunuyor. Bunu biraz sağlık kazanmak için kullanabilirsin. Bunu yapmak yırtık sayfayı yok edecektir.



