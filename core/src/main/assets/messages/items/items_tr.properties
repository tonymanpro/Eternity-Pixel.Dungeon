items.armor.leatherarmor.name=deri zırh
items.armor.leatherarmor.desc=İşlenmiş canavar derisinden yapılma zırh. Kumaş zırh kadar hafif olmasa da daha iyi koruma sağlar.

items.armor.magearmor.name=kahramanın kaftanı
items.armor.magearmor.desc=Büyücü bu göz alıcı cübbeyi giyerken özel bir güç kullanabilir.

items.armor.mailarmor.name=zincir zırh
items.armor.mailarmor.desc=Birbirine kilitlenmiş metal halkalar sert fakat rahat bir zırh oluşturmuş.

items.armor.platearmor.name=levha zırh
items.armor.platearmor.desc=Büyük metal parçalar, ağırlığını kaldırabilecek her maceracı için büyük bir koruma sağlamak için bir araya getirilmiş.

items.armor.roguearmor.name=kahramanın kıyafeti
items.armor.roguearmor.desc=Haydut, bu karanlık kıyafeti giyerken özel bir yetenek sergileyebilir.

items.armor.scalearmor.name=pul zırh
items.armor.scalearmor.desc=Metal pullar deri bir zırhın etrafını rahat ve iyi korunma sağlayacak bir zırh oluşturacak şekilde sarmış.

items.armor.warriorarmor.name=kahramanın zincirli plaka zırhı
items.armor.warriorarmor.desc=Savaşçı, bu ağır kaplama zırhı giyerken özel bir yetenek sergileyebilir.



###artifacts
items.artifacts.alchemiststoolkit.name=simyagerin alet kiti
items.artifacts.alchemiststoolkit.ac_brew=KARIŞTIR
items.artifacts.alchemiststoolkit.ac_energize=ENERJİ VER
items.artifacts.alchemiststoolkit.not_ready=Alet çantan ısınmayı bitirmedi.
items.artifacts.alchemiststoolkit.cursed=Lanetli alet çantan seni kimya yapmaktan alıkoyuyor!
items.artifacts.alchemiststoolkit.need_energy=Bunun için en az 6 enerji gerekli.
items.artifacts.alchemiststoolkit.energize_desc=Her 6 enerji kristali alet çantasına bir seviye atlatacak kadar enerji verir. Bu alet çantasının daha hızlı enerji üretmesini ve ısınmasını sağlar.\n\nNe kadar enerji kullanmak istersin?
items.artifacts.alchemiststoolkit.energize_1=6 enerji: +1 seviye
items.artifacts.alchemiststoolkit.energize_all=%1$d enerji: +%2$d seviye
items.artifacts.alchemiststoolkit.desc=Bu alet çantasında envai çeşit ayıraç ve otla birlikte küçük bir karıştırma şişesi var. Bu çanta sayesinde ayak üstü simya yapabilirsin. Şişenin içinde erimiş enerji kristalleri gibi görünen şeyler var.
items.artifacts.alchemiststoolkit.desc_cursed=Lanetli alet çantası seni kendine bağladı ve simya kullanmana izin vermeyi reddediyor.
items.artifacts.alchemiststoolkit.desc_warming=Alet çantası şu anda ısınıyor, bir süre sonra kullanıma hazır olacak.
items.artifacts.alchemiststoolkit.desc_hint=Üzerindeki alet çantası sen tecrübe kazandıkça yavaşça simyasal enerji üretiyor. Şişedeki karışıma enerji kristalleri ekleyerek onu geliştirebilirsin.

items.artifacts.artifact.cannot_wear_two=Aynı eserden iki tane giyemezsin.
