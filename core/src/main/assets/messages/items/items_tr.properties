items.wands.cursedwand.supernova=Alev alev yanan bir enerji topu büyümeye başlıyor. Koşmak isteyebilirsin!
items.wands.cursedwand.supernova_positive=Alev alev yanan bir enerji topu büyümeye başladı ama bir şekilde kendini güvende hissettiriyor.
