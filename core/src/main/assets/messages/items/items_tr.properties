items.weapon.melee.roundshield$guardtracker.desc=Düellocu, gelecek saldırılara karşı kalkanını hazırladı. Ona karşı yapılan fiziksel veya büyüsel saldırılar tamamen etkisiz hale getirilecek.\n\nKalan turlar: %s.

items.weapon.melee.runicblade.name=rünik kılıç
items.weapon.melee.runicblade.stats_desc=Bu silah yükseltmelerden daha fazla yararlanır.
items.weapon.melee.runicblade.ability_name=rünik kesik
items.weapon.melee.runicblade.typical_ability_desc=Düellocu, bir rünik kılıç ile _rünik kesik_ gerçekleştirebilir. Bu saldırı kesin isabet eder ve genellikle _+%d%% büyü gücüne_ sahiptir.
items.weapon.melee.runicblade.ability_desc=Düellocu, bir rünik kılıç ile _rünik kesik_ gerçekleştirebilir. Bu saldırı kesin isabet eder ve genellikle _+%d%% büyü gücüne_ sahiptir.
items.weapon.melee.runicblade.upgrade_ability_stat_name=Yetenek gücü
items.weapon.melee.runicblade.desc=Uzak diyarlardan gelen mavi bıçaklı gizemli bir silah.

items.weapon.melee.sai.name=sai
items.weapon.melee.sai.stats_desc=Bu çok hızlı bir silah.
items.weapon.melee.sai.ability_name=kombo vuruşu
items.weapon.melee.sai.typical_ability_desc=Düellocu, sai ile bir _kombo vuruşu_ yapabilir. Bu saldırının isabet etmesi garantidir ve Düellocu normal bir yakın dövüş veya fırlatılan silah saldırısıyla her vurduğunda genellikle _+%d hasar_ verir. 5 tur boyunca vurmamak bu komboyu sıfırlar.
items.weapon.melee.sai.ability_desc=Düellocu, sai ile bir _kombo vuruşu_ yapabilir. Bu saldırının isabet etmesi garantidir ve Düellocu normal bir yakın dövüş veya fırlatılmış silah saldırısıyla her vurduğunda _+%d hasar_ verir. 5 tur boyunca vurmamak bu komboyu sıfırlar.
items.weapon.melee.sai.desc=Her biri tek elde kullanılmak üzere tasarlanmış iki ince bıçak. Düşmanları bir dizi kesikle parçalamak için mükemmeldir.
items.weapon.melee.sai$combostriketracker.name=kombo vuruşu
items.weapon.melee.sai$combostriketracker.desc=Duelist, kombo vuruş yeteneğinin hasarını artırmak için kullanılabilecek bir kombo inşa ediyor. Her başarılı normal yakın dövüş veya fırlatılan silah saldırısı sayılacak, ancak 5 tur boyunca başarılı bir şekilde saldırmamak bu komboyu sıfırlar.Son vuruşlar: %1$d.Vuruşların kaybedilmesine kadar geçen turlar: %2$s.

items.weapon.melee.scimitar.name=pala
items.weapon.melee.scimitar.stats_desc=Bu gayet hızlı bir silah.
items.weapon.melee.scimitar.ability_name=kılıç dansı
items.weapon.melee.scimitar.typical_ability_desc=Düellocu eğri kılıç ile bir _kılıç dansı_ yapar. Bu hareketi yapmak zaman almaz ve genellikle _%d tur için_ Düellocu'ya +60%% saldırı hızı ile +50%% doğruluk sağlar.
items.weapon.melee.scimitar.ability_desc=Düellocu bir pala ile _kılıç dansı_ yapabilir. Bu duruşun aktifleşmesi zaman almaz ve Düellocuya _%dtur_  boyunca +60%% saldırı hızı ve +50%% isabet sağlar.
items.weapon.melee.scimitar.upgrade_ability_stat_name=Yetenek süresi
items.weapon.melee.scimitar.desc=Kalın, kıvrık bir bıçak. Şekli, hızlı fakat daha zayıf saldırıların yapılmasını sağlar.
items.weapon.melee.scimitar$sworddance.name=kılıç dansı
items.weapon.melee.scimitar$sworddance.desc=Düellocu bir tür dans eşliğinde hızlı momentum tabanlı vuruşlar yapar. Bu duruş aktifken, 60%% daha hızlı saldırır (bir pala ile tam olarak iki kez saldırmaya yetecek kadar) ve +50%% isabet oranına sahiptir.\n\nKalan tur: %s.

items.weapon.melee.sickle.name=orak
items.weapon.melee.sickle.stats_desc=Bu silah gayet isabetsiz.
items.weapon.melee.sickle.ability_name=biç
items.weapon.melee.sickle.typical_ability_desc=Düellocu bir düşmanı orakla _hasat edebilir_. Bu yıkıcı saldırının isabet etmesi kesindir ve genellikle _%dhasar_ verir. Bu hasar, hedef bağışıklı değilse kanama olarak uygulanır.
items.weapon.melee.sickle.ability_desc=Düellocu bir düşmanı orakla _hasat edebilir_. Bu yıkıcı saldırının isabet etmesi kesindir ve _%dhasar_ verir. Bu hasar, hedef bağışıklı değilse kanama olarak uygulanır.
items.weapon.melee.sickle.desc=Gücünü ikiye katlayabilen el tipi bir çiftçilik aleti fakat oldukça hantal.

items.weapon.melee.spear.name=mızrak
items.weapon.melee.spear.stats_desc=Bu bayağı yavaş bir silah.\nBu silah fazladan erişime sahiptir.
items.weapon.melee.spear.ability_name=sapla
items.weapon.melee.spear.typical_ability_desc=Düellocu, menzil içinde olan ancak bitişik olmayan bir düşmanı _şişlemek_ için mızrağın ucunu kullanır. Bu _%1$d-%2$d hasar_ verir, düşmanı geriye ittirir ve isabet etmesi garantidir.
items.weapon.melee.spear.ability_desc=Düellocu, menzil içinde olan ancak bitişik olmayan bir düşmanı _şişlemek_ için mızrağın ucunu kullanır. Bu _%1$d-%2$d hasar_ verir, düşmanı geriye ittirir ve isabet etmesi garantidir.
items.weapon.melee.spear.desc=Ucuna sivriltilmiş demir takılı uzun ince bir tahta çubuk.

items.weapon.melee.sword.name=Kılıç
items.weapon.melee.sword.ability_name=yarmak
items.weapon.melee.sword.typical_ability_desc=Düellocu, bir düşmanı kılıçla _yarabilir_. Bu, tipik olarak _%1$d - %2$d hasar_ verir ve isabet etmesi garantilidir. Yarma bir düşmanı öldürürse bu anında gerçekleşir ve Düellocu 5 tur içinde ücretsiz olarak tekrar yarmayı kullanabilir.
items.weapon.melee.sword.ability_desc=Düellocu, bir düşmanı kılıçla _yarabilir_. Bu, _%1$d - %2$d hasar_ verir ve isabet etmesi garantilidir. Yarma bir düşmanı öldürürse bu anında gerçekleşir ve Düellocu 5 tur içinde ücretsiz olarak tekrar yarmayı kullanabilir.
items.weapon.melee.sword.desc=Güzelce dengelenmiş bir kılıç. Çok büyük değil, ama hala bir kısa kılıçtan fark edilebilir derecede büyük.
items.weapon.melee.sword$cleavetracker.name=yarmak
items.weapon.melee.sword$cleavetracker.desc=Düellocu önceki yarığını takip etmeye hazır. Yarmanın bir sonraki kullanımı herhangi bir silah yeteneği ücretine mal olmayacak.\n\nKalan Tur: %s.

items.weapon.melee.warhammer.name=savaş çekici
items.weapon.melee.warhammer.stats_desc=Bu silah gayet isabetli.
items.weapon.melee.warhammer.ability_name=ağır darbe
items.weapon.melee.warhammer.typical_ability_desc=Düellocu bir savaş çekiciyle _ağır darbe_ vurabilir. Bu yoğun saldırı düşmanı şaşırtırsa _%1$d-%2$d hasar_ verir ve düşmanı 5 tur sersemletir, bu da isabetliliği ve kaçınmayı 50%%azaltır. Ağır darbe her zaman isabetlidir ancak düşmanı şaşırtmazsa normal hasar verir.
items.weapon.melee.warhammer.ability_desc=Düellocu bir savaş çekiciyle _ağır darbe_ vurabilir. Bu yoğun saldırı düşmanı şaşırtırsa _%1$d-%2$d hasar_ verir ve düşmanı 5 tur sersemletir, bu da isabetliliği ve kaçınmayı 50%% azaltır. Ağır darbe her zaman isabetlidir ancak düşmanı şaşırtmazsa normal hasar verir.
items.weapon.melee.warhammer.desc=Sadece birkaç yaratık bu devasa kurşun ve çelik yığınının ezici darbesine dayanabilir, ancak onu verimli kullanabilmek için büyük kuvvet gerekir.

items.weapon.melee.warscythe.name=savaş tırpanı
items.weapon.melee.warscythe.stats_desc=Bu silah gayet isabetsiz.
items.weapon.melee.warscythe.ability_name=biç
items.weapon.melee.warscythe.typical_ability_desc=Düellocu, bir düşmanı savaş tırpanıyla _hasat edebilir_. Bu yıkıcı saldırının isabet etmesi kesindir ve çoğunlukla _%dhasar_ verir. Bu hasar, hedef bağışıklı değilse kanama olarak uygulanır.
items.weapon.melee.warscythe.ability_desc=Düellocu bir düşmanı savaş tırpanıyla _hasat edebilir_. Bu yıkıcı saldırının isabet etmesi garantidir ve _%dhasar_ verir. Hedef bağışıklı değilse bu hasar kanama olarak uygulanır.
items.weapon.melee.warscythe.desc=Bu büyük ve hantal alet ekinler yerine düşmanları daha iyi kesmek için güçlendirildi.

items.weapon.melee.whip.name=kamçı
items.weapon.melee.whip.stats_desc=Bu silah inanılmaz uzaklıklara erişebilir.
items.weapon.melee.whip.ability_name=döv
items.weapon.melee.whip.typical_ability_desc=Düellocu, etrafındaki tüm düşmanları bir kırbaçla _kırbaçlayabilir_. Bu yetenek genellikle _%1$d-%2$d hasar_ verir, saldırı menzilindeki tüm düşmanlara saldırır ve isabet etmesi kesindir.
items.weapon.melee.whip.ability_desc=Düellocu, çevresindeki tüm rakipleri kırbacıyla _kamçılayabilir_. Bu yetenek, saldırı menzilindeki bütün düşmanlara _%1$d-%2$dhasar_ verir ve vuruşu garantidir.
items.weapon.melee.whip.desc=Bu silahın ucundaki dikenli ip çok az hasar verirken, onun erişim gücüne kimse su dökemez.

items.weapon.melee.wornshortsword.name=yıpranmış kısa kılıç
items.weapon.melee.wornshortsword.ability_name=yarmak
items.weapon.melee.wornshortsword.typical_ability_desc=Düellocu, bir yıpranmış kısa kılıçla bir düşmanı _yarabilir_. Bu, tipik olarak _%1$d-%2$dhasar_ verir ve isabeti garantidir. Yarma bir düşmanı öldürürse bu anında gerçekleşir ve Düellocu 5 tur içinde tekrar yarmayı ücretsiz kullanabilir.
items.weapon.melee.wornshortsword.ability_desc=Düellocu, bir yıpranmış kısa kılıçla bir düşmanı _yarabilir_. Bu, _%1$d-%2$dhasar_ verir ve isabeti garantidir. Yarma bir düşmanı öldürürse bu anında gerçekleşir ve Düellocu 5 tur içinde tekrar yarmayı ücretsiz kullanabilir.
items.weapon.melee.wornshortsword.desc=Bayağı kısa bir kılıç, ağır kullanımdan dolayı epey yıpranmış. Daha iyi koşullardaki bir kısa kılıçtan daha zayıf ve biraz daha hafiftir.
items.weapon.melee.wornshortsword.discover_hint=Kahramanlardan birisi bu eşyayla başlar.


###missile weapons
items.weapon.missiles.darts.adrenalinedart.name=adrenalin dartı
items.weapon.missiles.darts.adrenalinedart.desc=Bu dartların ucu, müttefiklerin hareketini ve saldırı hızını artıracak veya düşmanların hareket hızını kısaca azaltacak olan hızlı devedikeni tabanlı bir bileşikle donatılmıştır. Dartın kendisi hala düşmanlara zararlıdır, ancak müttefiklere zarar vermez.

items.weapon.missiles.darts.blindingdart.name=köredici dart
items.weapon.missiles.darts.blindingdart.desc=Bu dartların ucunda köredici ot tabanlı kimyasal bir içerik bulunuyor ve bunun sayesinde bu dartlar hedeflerini kısa bir süreliğine kör etme yeteneğine sahipler. Düşmanların kör olsalar bile kafaları karışmayacaktır ama, yani bir düşman seni en son nerede gördüğünü hala biliyor olacaktır.

items.weapon.missiles.darts.chillingdart.name=üşütücü dart
items.weapon.missiles.darts.chillingdart.desc=Bu dartların ucundaki buzbaşı tabanlı kimyasal hedeflerini elde tutulur derecede üşütecektir.

items.weapon.missiles.darts.cleansingdart.name=arındırıcı dart
items.weapon.missiles.darts.cleansingdart.desc=Bu dartlar mageroyal bazlı bileşenle geçici olarak dostları tüm olumsuz etkilere karşı bağışık hale getirir veya düşmanları olumlu etkilerden temizler. Hatta düşmanlar size saldırdıklarını veya sizden kaçtıklarını kısa süre için unutabilirler. Dartın kendisi hâlâ düşmanlara zararlı ama dostlara zarar vermez.

items.weapon.missiles.darts.dart.name=dart
items.weapon.missiles.darts.dart.ac_tip=UÇ
items.weapon.missiles.darts.dart.prompt=Bir tohum seç
items.weapon.missiles.darts.dart.tip_title=Uçlu Dartlar
items.weapon.missiles.darts.dart.tip_desc=Bir tohum bir veya iki dart ile birleştirilerek uçlandırılabilir. Her tohum türü, benzersiz bir tek kullanımlık etkiye sahip kendi uçlu dart türünü üretir.\n\nBu tohumlarla bir darta vurulduğunda _%s_ üretilir.
items.weapon.missiles.darts.dart.tip_all=%1$d dartı %2$d tohumla uçla
items.weapon.missiles.darts.dart.tip_two=İki dartı bir tohum ile birleştirin.
items.weapon.missiles.darts.dart.tip_one=Bir dartı bir tohum ile birleştirin.
items.weapon.missiles.darts.dart.tip_cancel=iptal et
items.weapon.missiles.darts.dart.desc=Sivri uçlu bu basit ahşap miller doğru uçacak ve avlarını bir bilek hareketiyle sokacak şekilde tasarlanmıştır. Fırlatıldıklarında bonus etkiler kazanmak için tohumlarla uçlandırılabilirler.
items.weapon.missiles.darts.dart.unlimited_uses=Basit yapıları nedeniyle dartlar etkili bir şekilde sonsuza kadar dayanacaktır.

items.weapon.missiles.darts.displacingdart.name=yer değiştirici dart
items.weapon.missiles.darts.displacingdart.desc=Bu dartların ucunda kaybolma yaprağı tabanlı bir kimyasal bulunuyor, bu kimyasal hedeflerini kısa bir mesafeliğine ışınlar.

items.weapon.missiles.darts.healingdart.name=iyileştirici dart
items.weapon.missiles.darts.healingdart.desc=Bu dartların ucundaki güneşçimi tabanlı kimyasal hedeflerine bir iyileşme patlaması yaşatır. Fakat bu dart rakiplere hâlâ zarar verir. Dostlar zarar görmez

items.weapon.missiles.darts.holydart.name=kutsal dart
items.weapon.missiles.darts.holydart.desc=Bu dartların ucu, kutsal enerjiyi hedeflerine akıtan, yıldız çiçeği bazlı bir bileşikle donatılmıştır. Müttefikler ve normal düşmanlar kutsanacak, ancak hortlak veya şeytani düşmanlar ağır hasar alacak. Dartın kendisi hala düşmanlara zararlıdır, ancak müttefiklere zarar vermez.

items.weapon.missiles.darts.incendiarydart.name=yanıcı dart
items.weapon.missiles.darts.incendiarydart.desc=Bu dartların ucuna ateşçiçeği temelli bir kimyasal konulmuş, bu kimyasallar bir hedefle temasa geçtiklerinde o hedefi parlak ateşlere boğacak.

items.weapon.missiles.darts.paralyticdart.name=felç edici dart
items.weapon.missiles.darts.paralyticdart.desc=Bu dartların ucunda dünyatohumu ele alınarak yapılmış bir kimyasal bulunuyor, bu kimyasal hedefini kısa bir süreliğine felç edebilir.

items.weapon.missiles.darts.poisondart.name=zehirli dart
items.weapon.missiles.darts.poisondart.desc=Bu dartların ucundaki üzüntüyosunu tabanlı kimyasal hedeflerini zehirleyecektir.

items.weapon.missiles.darts.rotdart.name=çürük dart
items.weapon.missiles.darts.rotdart.desc=Bu kötü dartlar, dartın temas ettiği her şeyi agresif bir şekilde yiyebilecek asidik, çürük böğürtlen bazlı bir bileşikle kaplıdır. Güçlü düşmanlar, etkilerin çoğuna direnir, ancak korozyon, çoğu standart düşmanı kolayca öldürecek kadar güçlüdür. Bunlar diğer uçlu dartlardan daha uzun süre dayanır, ancak dayanıklılıkları artırılamaz.
items.weapon.missiles.darts.rotdart.discover_hint=Bu öğeyi belirli bir görevdeki tohumu kullanarak oluşturabilirsiniz.

items.weapon.missiles.darts.shockingdart.name=şok edici dart
items.weapon.missiles.darts.shockingdart.desc=Bu dartların ucundaki fırtınaasması tabanlı kimyasal hedeflerine berbat bir şok verecektir.

items.weapon.missiles.darts.tippeddart.ac_clean=TEMİZLE
items.weapon.missiles.darts.tippeddart.clean_title=Dartları Temizle
items.weapon.missiles.darts.tippeddart.clean_desc=Bu hareketiniz dartınız ve tohumunuzu ayırır ve dartınızı yine normal bir dart yapar.
items.weapon.missiles.darts.tippeddart.clean_all=hepsini temizle
items.weapon.missiles.darts.tippeddart.clean_one=birini temizle
items.weapon.missiles.darts.tippeddart.cancel=iptal et
items.weapon.missiles.darts.tippeddart.uses_left=Bu dart demetinde _%d/%d_  dart kaldı.
items.weapon.missiles.darts.tippeddart.unlimited_uses=_Ama bunlar o kadar kaliteli ki, etkilerini hiç bir zaman yitirmeyeceklerdir._
items.weapon.missiles.darts.tippeddart.about_to_break=Dartının ucu etkisini kaybetmek üzere.
items.weapon.missiles.darts.tippeddart.has_broken=Dartının ucu etkisini kaybetti.
items.weapon.missiles.darts.tippeddart.discover_hint=Bu öğeyi bir dükkandan satın alabilir veya bir tohum kullanarak oluşturabilirsiniz.


items.weapon.missiles.bolas.name=bolalar
items.weapon.missiles.bolas.stats_desc=Bu silah hedefini sakat bırakır.
items.weapon.missiles.bolas.desc=Bu alışılmadık menzilli silahlar çok hasar vermez, ancak hedeflerini yavaşlatmak için mükemmel bir iş çıkarır.

items.weapon.missiles.boomerang.name=bumerang
items.weapon.missiles.boomerang.desc=Düşmana fırlatılan bu düz, tahta, kıvrık menzilli silah fırlatıcısının eline geri döner.
items.weapon.missiles.boomerang.durability=Sağlam yapısı sayesinde bu bumerang kullanım sonucu kırılmayacaktır.

items.weapon.missiles.fishingspear.name=balık tutma mızrağı
items.weapon.missiles.fishingspear.desc=Balık tutmak için tasarlanmış olmasına rağmen doğaçlama bir silah olarak iyi çalışan küçük fırlatma mızrakları.

items.weapon.missiles.forcecube.name=güç küpü
items.weapon.missiles.forcecube.ondeath=Güç Küpü'n ile kendi kendini öldürdün...
items.weapon.missiles.forcecube.stats_desc=Bu silah darbesinin gücünü küçük bir alana yayarak yakındaki her şeyi vurur.
items.weapon.missiles.forcecube.desc=Bu tuhaf şekilli büyülü küpler elinizde tutabileceğiniz kadar küçüktür, ancak inanılmaz derecede ağırdır.

items.weapon.missiles.heavyboomerang.name=ağır bumerang
items.weapon.missiles.heavyboomerang.stats_desc=Bu silah, beş tur sonra atıldığı yere geri döner.
items.weapon.missiles.heavyboomerang.desc=Bu silah birkaç tur sonra fırlatıldığı yere geri döner.

items.weapon.missiles.javelin.name=cirit
items.weapon.missiles.javelin.desc=Bu büyük fırlatma mızrakları havada uçarken uçlarındaki dikeni önde tutmak için dengelenmiş.

items.weapon.missiles.kunai.name=kunai
items.weapon.missiles.kunai.stats_desc=Bu silah farkında olmayan düşmanlara karşı daha güçlü.
items.weapon.missiles.kunai.desc=Bu küçük bıçaklar yetenekli bir kullanıcının elinde çok güçlüdür.

items.weapon.missiles.missileweapon.stats_known=Bu _%1$d. kademe_ fırlatılabilir silah seti _%2$d-%3$d hasar verir_ ve kullanmak için _%4$d güç_ gerektirir.
items.weapon.missiles.missileweapon.stats_unknown=Tipik olarak bu _%1$d. kademe_ fırlatılabilir silah seti _%2$d-%3$d hasar verir_ ve kullanmak için _%4$d güç_ gerektirir.
items.weapon.missiles.missileweapon.stats_desc=
items.weapon.missiles.missileweapon.probably_too_heavy=Bu silah senin için fazla ağır olabilir.
items.weapon.missiles.missileweapon.distance=Fırlatılabilir silahlar uzaktan daha isabetlidir, ancak yakından daha az isabetlidir.
items.weapon.missiles.missileweapon.durability=Fırlatma silahları kullanıldıkça aşınır ve kırılırlar.
items.weapon.missiles.missileweapon.uses_left=Bu fırlatılan silah setinin biri kırılmadan önce _%d/%d_ kullanımı kaldı.
items.weapon.missiles.missileweapon.unlimited_uses=Bu set o kadar yüksek kalitededir ki, sonsuza kadar etkili bir şekilde dayanacaktır.
items.weapon.missiles.missileweapon.unknown_uses=Tipik olarak bu fırlatılan silah seti, biri kırılmadan önce _%d_ kullanıma sahip olacaktır.
items.weapon.missiles.missileweapon.curse_discover=Bu fırlatılan silah lanetli!
