items.waterskin.ac_drink=İÇ
items.waterskin.collected=Çiy damlasını kırbana topladın.
items.waterskin.full=Kırban doldu!
items.waterskin.empty=Kırban boş!
items.waterskin.desc=Deri ve sicimden yapılmış mantar tıpayla tıkanan sıvılar için bir kap.
items.waterskin.desc_water=Şu anda kırbada sadece normal içme suyu var. Eminim ki zindanda kırbanın depolayabileceği başka bir şey vardır.
items.waterskin.desc_heal=Kırba şu anda şifalı su depolamak için kullanılıyor. Kırba ne kadar dolu olursa, ondan içerken o kadar fazla anında iyileşirsin. Sadece ihtiyacın kadar içeceksin.
items.waterskin.desc_full=Dolu kırba enerji saçıyor gibi görünüyor, belki de başka bir hayatta kalma eşyasını kutsamak için kullanılabilir?
items.waterskin.discover_hint=Kahramanlardan birisi bu eşyayla başlar.

