items.artifacts.artifact.need_to_equip=Bunu yapabilmen için eserini kuşanman gerekiyor.

items.artifacts.capeofthorns.name=dikenlerin pelerini
items.artifacts.capeofthorns.desc=DM-300'den çıkan bu çökük metal parçaları birleşerek dayanıklı bir pelerin oluşturmuş. Derin bir enerji depoluyor gibi duruyor, belki DM-300'ün gücünden biraz vardır?
items.artifacts.capeofthorns.desc_inactive=Bu pelerin omuzlarında güven verici bir biçimde ağır hissettiriyor, görünüşe göre aldığın hasarla birlikte enerji kazanıyor.
items.artifacts.capeofthorns.desc_active=Bu pelerin depolanan enerjiyi salıyor gibi görünüyor, koruyucu bir enerji yayıyor.
items.artifacts.capeofthorns$thorns.inert=Pelerinin tekrar durağanlaştı.
items.artifacts.capeofthorns$thorns.radiating=Pelerinin enerji yaymaya başladı, korunmuş hissediyorsun!
items.artifacts.capeofthorns$thorns.levelup=Pelerinin güçlendi!
items.artifacts.capeofthorns$thorns.name=diken
items.artifacts.capeofthorns$thorns.desc=Pelerinin enerji yayarak seni yansıtıcı bir güç alanı ile sarıyor!\n\nAldığın tüm hasar diken etkisi aktifken azalır. Aynı zamanda, eğer saldıran senin hemen yakınındaysa, azaltılan miktar saldırgana geri yansıtılır.\n\nDikenlerin kaybolmasına kalan sıra: %s

items.artifacts.chaliceofblood.name=kan kadehi
items.artifacts.chaliceofblood.ac_prick=BATIR
items.artifacts.chaliceofblood.yes=Evet, ne yaptığımı biliyorum
items.artifacts.chaliceofblood.no=Hayır, fikrimi değiştirdim
items.artifacts.chaliceofblood.prick_warn=Kadehi her kullandığınızda, yaşam enerjiniz daha fazla azalacak, ancak bunun karşılığında doğal sağlık yenilenme yeteneğiniz daha da artacaktır.\n\nŞu anda kendinizi iğnelediğinizde _%1$d-%2$d hasar_ alırsınız, ancak bu hasar _fiziksel ve büyülü engelleme veya hasar azaltma ile azaltılabilir._ Hasar azaltma etkilerini dikkate almadan, kendinizi iğnelediğinizde şu anda yaşam gücünüzün tamamen tükenme -%%%3$s olasılığı_ vardır.\n\nKadehe daha fazla yaşam enerjisi sunmak istediğinizden emin misiniz?
items.artifacts.chaliceofblood.onprick=Elini kestin ve yaşam özün kadehin içine doğru emildi.
items.artifacts.chaliceofblood.ondeath=Kadeh tüm yaşam enerjini emdi...
items.artifacts.chaliceofblood.desc=Bu parlak gümüş kadeh ilginç bir şekilde kenarında keskin mücevherlerle donatılmış.
items.artifacts.chaliceofblood.desc_cursed=Lanetli kadeh kendini sıkıca eline tutturdu ve sağlığını yenileme yeteneğini baskılıyor.
items.artifacts.chaliceofblood.desc_1=Kadehi elinde tutarken içinde garip bir şekilde kendini o keskin mücevherlerle kesme isteği duyuyorsun.
items.artifacts.chaliceofblood.desc_2=Kanınızın bir kısmı kadehe akıyor, kadehin size yaşam enerjisi verdiğini ve doğal sağlık yenilenmenizi artırdığını hafifçe hissedebiliyorsunuz. Acı vereceğini bilseniz de yine de kadehle kendinizi kesmek istiyorsunuz.
items.artifacts.chaliceofblood.desc_3=Kadeh yaşam özünle ağzına kadar doldu. Kadehin sana yaşam enerjisini geri verdiğini hissediyorsun.

items.artifacts.cloakofshadows.name=gölgelerin pelerini
items.artifacts.cloakofshadows.ac_stealth=GİZLİLİK
items.artifacts.cloakofshadows.cooldown=Pelerininin yeniden şarj olması için %d sıraya ihtiyacı var.
items.artifacts.cloakofshadows.cursed=Lanetli bir pelerini kullanamazsın.
items.artifacts.cloakofshadows.no_charge=Pelerinin henüz kullanmaya yetecek kadar şarj olmadı.
items.artifacts.cloakofshadows.desc=Paha biçilemez büyülü bir pelerin, Haydut tarafından kraliyet cephaneliğinden çok uzun yıllar önce çalınmış. Giyildiğinde, kısa bir süreliğine tamamen görünmez olmak için kullanılabilir.\n\nPelerin ne kadar çok kullanılırsa gücü o kadar artar, bu da Haydut'un daha sık ve daha uzun süreliğine görünmez olmasını sağlar.
items.artifacts.cloakofshadows.discover_hint=Kahramanlardan birisi bu eşyayla başlar.
items.artifacts.cloakofshadows$cloakstealth.no_charge=Pelerininin enerjisi bitti.
items.artifacts.cloakofshadows$cloakstealth.levelup=Pelerinin güçlendi!
items.artifacts.cloakofshadows$cloakstealth.name=gizli
items.artifacts.cloakofshadows$cloakstealth.desc=Gölgelerin pelerini, sen onunla örtünmüşken sana görünmezlik sağlıyor. İptal edilene veya görünmezliğinin şarjı bitene kadar görünmez kalacaksın.\n\nSen görünmezken düşmanlar sana saldıramaz veya seni takip edemez. Fiziksel saldırılar ve büyülü etkiler (parşömenler ve asalar gibi) görünmezliği hemen iptal eder.\n\nŞarj harcanmasına kalan sıra: %d.

