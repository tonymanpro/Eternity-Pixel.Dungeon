###armor curses
items.armor.curses.antientropy.name=Anti entropi %s
items.armor.curses.antientropy.desc=Anti-entropi laneti, evrenin güçlerine karşı çalışır, enerjiyi kullanıcıya çeker ve çevresinden uzaklaştırır. Bu, kullanıcıyı kısaca ateşe verir, ancak etrafındaki her şeyi dondurur!

items.armor.curses.bulk.name=Yığın %s
items.armor.curses.bulk.desc=Büyük zırhlar daha büyük ve daha heybetli görünür, ancak aslında savunma gücünü artırmaz. Daha da kötüsü, ek boyut kapı aralıklarından geçmeyi çok zorlaştırır.

items.armor.curses.corrosion.name=Korozif %s
items.armor.curses.corrosion.desc=Korozif zırhlar etrafa aşındırıcı bir sıvı saçarak bölgedeki her şeyi yapışkan, asidik bir çamurla kaplayabilir.

items.armor.curses.displacement.name=Boşluk dolduran %s
items.armor.curses.displacement.desc=Yerdeğiştirme laneti giyen kişiyi saldırıdan korumak için güvenliğe hareket ettirmeye çalışır. Ama biraz fazla etkili olduğu için kullanıcıyı seviyenin içinde rastgele ışınlar.

items.armor.curses.metabolism.name=Metabolistik %s
items.armor.curses.metabolism.desc=Metabolizma laneti giyen kişi yaralandığında tokluğu doğrudan sağlığa çevirerek iyileştirme katkısı yapar, ancak çabucak açlığa yol açar.

items.armor.curses.multiplicity.name=Çoğaltan %s
items.armor.curses.multiplicity.desc=Çokluk laneti barındıran zırhlar tehlikeli kopyalama büyüsü içerir. Bazen giyen kişinin bir ayna görüntüsünü oluşturur, ama düşmanları da kopyalama şansı vardır!

items.armor.curses.overgrowth.name=Aşırı büyümüş %s
items.armor.curses.overgrowth.desc=Aşırı büyüme zırhı çeşitli yeşimlenmiş bitkilerle kaplı. Bu etki kesinlikle ilginç görünse de defans adına hiçbir şey sağlamıyor, ve bu bitkiler dövüş esnasında rastgele aktifleşecek!

items.armor.curses.stench.name=pis kokulu %s
items.armor.curses.stench.desc=Kokuşma ile lanetlenmiş zırh, içinde yakalanan her şey için zararlı iğrenç gaz bulutları salar.


###glyphs
items.armor.glyphs.affection.name=Hayranlık veren %s
items.armor.glyphs.affection.desc=Bu güçlü rün saldıranların zihinlerini kontrol ederek onların geçici olarak tutulmasına yol açar.

items.armor.glyphs.antimagic.name=büyükıran %s
items.armor.glyphs.antimagic.desc=Bu güçlü rün, zırhı giyen kişinin fiziksel saldırıların yanı sıra büyülü saldırılara karşı da korur. Büyü koruması zırh seviyesinden etkilenmez.

items.armor.glyphs.brimstone.name=kükürtlü %s
items.armor.glyphs.brimstone.desc=Bu rün, zırhı giyen kişiyi ve eşyalarını ateşten korur, ateşin hasarı ve olumsuz etkilerini tamamen geçersiz kılar.

items.armor.glyphs.camouflage.name=kamuflajlı %s
items.armor.glyphs.camouflage.desc=Bu rün zırhı giyen kişinin uzun çimlerin içine karışmasını sağlayarak onlara geçici görünmezlik verir.

items.armor.glyphs.entanglement.name=Dolaştıran %s
items.armor.glyphs.entanglement.desc=Bu rün, hasarı emmek için zırhın etrafında topraktan bir kabuk yetiştirir, ancak zırhı giyen kişi hareket ederse koruma devre dışı kalır.

items.armor.glyphs.flow.name=akışkan %s
items.armor.glyphs.flow.desc=Bu rün suyun akışını zırhı giyen kişinin etrafında kontrol ederek o kişinin suyun içinde daha hızlı hareket etmesini sağlar.

items.armor.glyphs.obfuscation.name=kafa karıştırıcı %s
items.armor.glyphs.obfuscation.desc=Bu rün, giyen kişiye belirsiz bir görüntü vererek onu farkedilmesi daha zor bir hale getirir.

items.armor.glyphs.potential.name=Potansiyel veren %s
items.armor.glyphs.potential.desc=Bu rün, hasar aldıkça enerji üretir ve aktif edildiğinde zırhı giyen kişinin asalarını şarj eder.

items.armor.glyphs.repulsion.name=geri tepici %s
items.armor.glyphs.repulsion.desc=Bu rün saldırganların güçünü onlara çevirerek onları geriye doğru savurur.

items.armor.glyphs.stone.name=taşlı %s
items.armor.glyphs.stone.desc=Bu rün, zırhı, kaçınmayı imkansız hale getiren ağır bir büyülü taşla kaplar, fakat aldığı kaçınmanın üstünü kapatmak için fazladan hasar bloklar.

items.armor.glyphs.swiftness.name=çevik %s
items.armor.glyphs.swiftness.desc=Bu rün, yakınlarda bir düşman yoksa zırhı giyen kişinin hızını artırır

items.armor.glyphs.thorns.name=dikenli %s
items.armor.glyphs.thorns.desc=Bu güçlü rün sahibine saldıranları yavaşça kanatarak saldırganlara zarar verir.

items.armor.glyphs.viscosity.name=Yumuşak %s
items.armor.glyphs.viscosity.deferred=ertelenmiş %d
items.armor.glyphs.viscosity$defereddamage.name=ertelenmiş hasar
items.armor.glyphs.viscosity$defereddamage.ondeath=Geciktirilmiş hasar seni öldürdü...
items.armor.glyphs.viscosity$defereddamage.rankings_desc=Geciktirilmiş hasar tarafından öldürüldü
items.armor.glyphs.viscosity$defereddamage.desc=Hasar anında verilmek yerine zamanla veriliyor.\n\nKalan geciktirilmiş hasar: %d.
items.armor.glyphs.viscosity.desc=Bu rün giyen kişinin aldığı hasarı depolayarak onlara bunu birden vermenin tersine yavaşça verir.



