items.armor.clotharmor.desc=Bu hafif ağırlıktaki zırh, basit koruma sağlar.
items.armor.clotharmor.discover_hint=Kahramanlardan birisi bu eşyayla başlar.

items.armor.duelistarmor.name=kahramanın zırhı
items.armor.duelistarmor.desc=Düellocu bu plaka zırhı ve pelerini giyerken özel bir yetenek sergileyebilir.

items.armor.huntressarmor.name=kahramanın pelerini
items.armor.huntressarmor.no_enemies=Görüşünde düşman yok
