items.rings.ring.equip_cursed=Yüzük parmağının etrafında acı verici bir şekilde sıkılaşıyor!
items.rings.ring.unknown_desc=Bu metal halka karanlıkta ışıldayan büyük bir mücevherle donatılmış. Giyildiğinde hangi etkisi olacağını kim bilir?
items.rings.ring.known=Bu bir %s
items.rings.ring.identify=Artık yüzüğünü tanımlayabilecek kadar iyi biliyorsun
items.rings.ring.cursed_worn=Bu yüzük lanetli olduğu için onu çıkartacak güce sahip değilsin.
items.rings.ring.curse_known=Bu yüzüğün etrafında kötücül bir büyünün varlığını hissediyorsun.
items.rings.ring.not_cursed=Bu yüzükte kötücül bir büyü yok.

items.rings.ringofaccuracy.name=isabet yüzüğü
items.rings.ringofaccuracy.stats=Takıldığında bu yüzük isabet oranını _%s%%_ artırır.
items.rings.ringofaccuracy.typical_stats=Takıldığında bu yüzük genelde isabet oranını _%s%%._ artırır.
items.rings.ringofaccuracy.combined_stats=Takılı yüzüklerin güçlerini birleştirerek isabet oranını toplam _%%%s_ arttırıyor.
items.rings.ringofaccuracy.upgrade_stat_name_1=Hedefleme bonusu
items.rings.ringofaccuracy.desc=Bu yüzük odağınızı artırarak saldırılarınızın hedefini bulmasını kolaylaştırır.Lanetli bir yüzük ise saldırılarınızın hedefi bulmasını zorlaştıracak

items.rings.ringofarcana.name=sırlar yüzüğü
items.rings.ringofarcana.stats=Takıldığında bu yüzük efsun ve rünlerin gücünü _%s%%_ arttırır.
items.rings.ringofarcana.typical_stats=Takıldığında bu yüzük genellikle efsun ve rünlerin gücünü _%s%%_ arttırır.
items.rings.ringofarcana.combined_stats=Takılı yüzüklerin güçlerini birleştirerek efsun ve rünlerin gücünü toplam _%%%s_ arttırıyor.
items.rings.ringofarcana.upgrade_stat_name_1=Gizemli bonus
items.rings.ringofarcana.desc=Bu yüzük, lanetler de dahil olmak üzere silahlardaki büyülü büyüleri ve zırhlardaki glifleri geliştirir! Önce aktivasyon şansını arttırır, ardından aktivasyon şansı %100 olduğunda etkinin gücünü arttırır. Bunun yerine lanetli bir yüzük büyüleri, glifleri ve lanetleri zayıflatır.

items.rings.ringofelements.name=elementlerin yüzüğü
items.rings.ringofelements.stats=Bu yüzük takıldığında _%%%s_ element direnci sağlar.
items.rings.ringofelements.typical_stats=Bu yüzük takıldığında tipik olarak _%%%s_ element direnci sağlar.
items.rings.ringofelements.combined_stats=Takılı yüzüklerin güçlerini birleştirerek toplam _%%%s_ element direnci sağlıyor.
items.rings.ringofelements.upgrade_stat_name_1=Direniş
items.rings.ringofelements.desc=Bu yüzük çoğu elemental ve büyülü etkiye karşı onların verdiği hasarları ve zararlı etkilerinin sürelerini azaltarak direnç sağlar. Doğal olarak lanetli bir yüzük bu etkileri daha kötü bir hale getirir.

items.rings.ringofenergy.name=Enerji yüzüğü
items.rings.ringofenergy.stats=Takıldığında bu yüzük asa, eser, ve kahraman zırhı şarj olma hızını  _%s%%_ arttırır.
items.rings.ringofenergy.typical_stats=Takıldığında bu yüzük tipik olarak asa, eser, ve kahraman zırhı şarj olma hızını _%s%%_ arttırır.
items.rings.ringofenergy.combined_stats=Takılı yüzüklerin güçlerini birleştirerek şarj olma hızını toplam _%%%s_ arttırıyor.
items.rings.ringofenergy.upgrade_stat_name_1=Şarj bonusu
items.rings.ringofenergy.desc=Bu yüzükten yayılan gizemli enerji alanında sihirli ekipmanın daha hızlı yenilenir. Ancak lanetli bir yüzük, yenilenmeyi yavaşlatır.

items.rings.ringofevasion.name=sakınma yüzüğü
items.rings.ringofevasion.stats=Bu yüzük takıldığında, kaçınma yeteneğini _%%%s_ arttırır.
items.rings.ringofevasion.typical_stats=Bu yüzük takıldığında, genellikle kaçınma yeteneğinizi _%%%s_ artırır.
items.rings.ringofevasion.combined_stats=Takılı yüzüklerin güçlerini birleştirerek kaçınma oranını toplam _%%%s_ arttırıyor.
items.rings.ringofevasion.upgrade_stat_name_1=Kaçınma bonusu
items.rings.ringofevasion.desc=Bu yüzük giyen kişinin reaksiyonlarını hızlandırarak ona vurmayı zorlaştırır. Lanetli bir yüzük onu giyen kişiye vurulmasını kolaylaştıracaktır.

items.rings.ringofforce.name=güç yüzüğü
items.rings.ringofforce.stats=Mevcut gücünüz ile yumruk atarken bu yüzük _%1$d-%2$d_ hasar verir. Bir silah kullanıyorsanız bu yüzük hasarınızı _%3$d_ artırır.
items.rings.ringofforce.typical_stats=Yumruklarınız ve mevcut gücünüz ile bu yüzük normalde _%1$d-%2$d_ hasar  verir. Bir silah kullanıyorsanız normalde hasarınızı _%3$d_ artırır.
items.rings.ringofforce.combined_stats=Takılı yüzükleriniz güçlerini birleştirerek silahsız olarak toplam _%1$d-%2$d hasar_ verir veya bir tanesiyle hasarı _%3$d_ artırır.
items.rings.ringofforce.upgrade_stat_name_1=Silahsız hasar
items.rings.ringofforce.upgrade_stat_name_2=Silahlı hasar bonusu
items.rings.ringofforce.upgrade_stat_name_3=Yetenek hasarı
items.rings.ringofforce.ability_name=kavgacı duruşu
items.rings.ringofforce.typical_ability_desc=Düellocu bu yüzükle bir _kavgacı duruşu_ benimseyebilir, bu da normal saldırılarının bir silah takılı olsa bile her zaman bu yüzüğü kullanmasına neden olur. Bu saldırılar tipik olarak _%1$d-%2$d hasar_ verir ve ayrıca silahın büyüsünü ve güçlendirmesini de devralır.  Bu duruş silahın şarj olma hızını 50%% yavaşlatır.
items.rings.ringofforce.ability_desc=Düellocu bu yüzükle bir _kavgacı duruşu_ benimseyebilir, bu da normal saldırılarının bir silah takılı olsa bile her zaman bu yüzüğü kullanmasına neden olur. Bu saldırılar _%1$d-%2$d hasar_ ve ayrıca silahın büyüsünü ve güçlendirmesini de devralır. Bu duruş silahın şarj olma hızını 50%% yavaşlatır.
items.rings.ringofforce.desc=Bu yüzük kuşananın yakın dövüş saldırılarını geliştirecektir. Bu fazladan güç silah kullanırken çok daha azdır ama yumruklarınızı çok daha fazla güçlendirir. Lanetli bir yüzük ise kuşananın darbelerinin etkisini düşürecektir
items.rings.ringofforce$brawlersstance.name=kavgacı duruşu
items.rings.ringofforce$brawlersstance.desc=Bu duruştayken Düellocu'nun normal saldırıları, bir silah kuşanmış olsa bile, kuşanılmış bir güç yüzüğünü kullanacaktır. Bu saldırılar ilave hasar kazanır ve silahın güçlendirme ve büyüsünü kullanmaya devam eder.\n\nAncak bu duruşu sürdürmek odaklanmayı gerektirir ve silah yeteneği şarj hızını %50 azaltır.\n\nBu duruş bir güç yüzüğü kullanılarak açılıp kapatılabilir, ancak duruş hızla etkinleştirilip devre dışı bırakılırsa şarj hızındaki azalma bir süre daha devam eder.

items.rings.ringoffuror.name=öfke yüzüğü
items.rings.ringoffuror.stats=Bu yüzük takıldığında, saldırılarınızın hızını _%%%s_ artırır.
items.rings.ringoffuror.typical_stats=Bu yüzük takıldığında, saldırılarınızın hızını genellikle _%%%s_ artırır.
items.rings.ringoffuror.combined_stats=Takılı yüzükleriniz güçlerini birleştirerek saldırılarınızın hızını toplamda _%s-%%_ artırıyor.
items.rings.ringoffuror.upgrade_stat_name_1=Saldırı hızı bonusu
items.rings.ringoffuror.desc=Bu yüzük giyenine bir iç hiddet verip daha hızlı saldırmasını sağlayacaktır. Lanetli bir yüzük ise giyeninin saldırı hızını düşürecektir.

items.rings.ringofhaste.name=acele yüzüğü
items.rings.ringofhaste.stats=Takıldığında bu yüzük hareket hızını _%s%%_ artırır
items.rings.ringofhaste.typical_stats=Takıldığında bu yüzük tipik olarak hareket hızını _%s%%_ artırır
items.rings.ringofhaste.combined_stats=Takılı yüzükleriniz güçlerini birleştirerek hareket hızınızı toplamda _%s-%%_ oranında artırıyor.
items.rings.ringofhaste.upgrade_stat_name_1=Hareket hızı bonusu
items.rings.ringofhaste.desc=Bu yüzük, giyicisinin hareket stresini azaltarak insanüstü hızlarda koşmasını sağlayacaktır. Lanetli bir yüzük ise giyicisinin hareketini ağırlaştıracaktır.

items.rings.ringofmight.name=yücelik yüzüğü
items.rings.ringofmight.stats=Takıldığında bu yüzük gücünü _%1$d_ ve azami canını _%2$s%%_ artırır.
items.rings.ringofmight.typical_stats=Kuşanıldığında bu yüzük normalde kuşananın gücünü _%1$d_ ve azami canınını _%2$s%%_ artırır
items.rings.ringofmight.combined_stats=Takılı yüzükleriniz güçlerini birleştirerek gücünüzü toplamda _%1$d_ ve maksimum HP'nizi _%2$s%%_ artırıyor.
items.rings.ringofmight.upgrade_stat_name_1=Güç Artışı
items.rings.ringofmight.upgrade_stat_name_2=Maksimum can bonusu
items.rings.ringofmight.desc=Bu yüzük giyen kişinin fiziksel kabiliyetlerini arttırarak onlara daha yüksek fiziksel güç ve dayanıklılık verir. Lanetli bir yüzük giyen kişiyi zayıflatır.

items.rings.ringofsharpshooting.name=keskin nişancılık yüzüğü
items.rings.ringofsharpshooting.stats=Bu yüzük giyildiği zaman, sanki fırlatma silahlarının seviyesi _%1$d_ artmış gibi hasar verir, ve dayanıklılıklarını _%2$s%%_ arttırır.
items.rings.ringofsharpshooting.typical_stats=Takıldığında, bu yüzük tipik olarak, fırlatmalı silahlarınızın hasarını, sanki seviyeleri _%1$d_ artırılmış gibi ve dayanıklılıklarını _%2$s%%_ oranında artıracaktır.
items.rings.ringofsharpshooting.combined_stats=Takılı yüzükleriniz güçlerini birleştirerek etkili fırlatılan silah seviyesini _%1$d_ ve dayanıklılıklarını toplamda _%2$s%%_ artırıyor.
items.rings.ringofsharpshooting.upgrade_stat_name_1=Seviye hasarı bonusu
items.rings.ringofsharpshooting.upgrade_stat_name_2=Dayanıklılık bonusu
items.rings.ringofsharpshooting.desc=Bu yüzük, giyen kişinin nişan alımını ve kesinliğini attırarak tüm mesafeli silahları daha hasar verici ve sağlam hale getirir. Lanetli bir yüzük zıt efekte sahip olacaktır.

items.rings.ringoftenacity.name=inat yüzüğü
items.rings.ringoftenacity.stats=Kuşanıldığında bu yüzük kuşanannın aldığı hasarı _%s%%_ azaltır.
items.rings.ringoftenacity.typical_stats=Kuşanıldığında bu yüzük genelde kuşananın aldığı hasarı _%s%%_ azaltır.
items.rings.ringoftenacity.combined_stats=Takılı yüzükleriniz güçlerini birleştirerek aldığınız hasarı toplamda _%s%%_ kadar azaltır.
items.rings.ringoftenacity.upgrade_stat_name_1=Maximum hasar dayanıklılığı
items.rings.ringoftenacity.desc=Giyildiğinde bu yüzük kuşananın normalde ölümcül olan saldırılara direncini arttırır. Kullanıcı ne kadar yaralı ise, hasara karşı o kadar dirençli olur. Lanetli bir yüzük düşmanların giyen kişiyi öldürmelerini kolaylaştırır.

items.rings.ringofwealth.name=zenginlik yüzüğü
items.rings.ringofwealth.stats=Kuşanıldığında bu yüzük şansınızı _%s%%_ artırır.
items.rings.ringofwealth.typical_stats=Kuşanıldığında bu yüzük normalde şansınızı _%s%%_ artırır.
items.rings.ringofwealth.combined_stats=Takılı yüzükleriniz güçlerini birleştirerek şansınızı toplamda _%s%%_ artırıyor.
items.rings.ringofwealth.upgrade_stat_name_1=Şans bonusu
items.rings.ringofwealth.desc=Bu yüzük hazineler için bir mıknatıs gibi, düşmanların ve konteynırların değerli eşyalar taşıması şansını artırır. Lanetli bir yüzük ise ganimet kazanma şansını azaltır.



###scrolls
items.scrolls.scroll.ac_read=OKU
items.scrolls.scroll.kaunan=KAUNAN parşömeni
items.scrolls.scroll.sowilo=SOWILO parşömeni
items.scrolls.scroll.laguz=LAGUZ parşömeni
items.scrolls.scroll.yngvi=YNGVI parşömeni
items.scrolls.scroll.gyfu=GYFU parşömeni
items.scrolls.scroll.raido=RAIDO parşömeni
items.scrolls.scroll.isaz=ISAZ parşömeni
items.scrolls.scroll.mannaz=MANNAZ parşömeni
items.scrolls.scroll.naudiz=NAUDIZ parşömeni
items.scrolls.scroll.berkanan=BERKANAN parşömeni
items.scrolls.scroll.odal=ODAL parşömeni
items.scrolls.scroll.tiwaz=TIWAZ parşömeni
items.scrolls.scroll.unknown_desc=Bu parşömenin üzerine yorumlanamayan sihirli bir rün yazılmış. Seslice okunduğunda ne olacağını kim bilir?
items.scrolls.scroll.blinded=Kör iken bir parşömen okuyamazsın.
items.scrolls.scroll.no_magic=Büyü bağışıklılığındayken bir parşömen okuyamazsın.
items.scrolls.scroll.cursed=Lanetli büyü kitabın bu parşömendeki büyüyü kullanmanı engelliyor! Ama bir lanet kaldırma parşömeni işe yaramak için yeterince güçlü olabilir...
items.scrolls.scroll$placeholder.name=parşömen

items.scrolls.inventoryscroll.warning=Bu parşomen kullanımından vazgeçmek istediğinize emin misiniz? Parşomen yinede tüketilecek.
items.scrolls.inventoryscroll.yes=Evet, eminim
items.scrolls.inventoryscroll.no=Hayır, fikrimi değiştirdim

items.scrolls.scrollofidentify.name=tanımlama parşömeni
items.scrolls.scrollofidentify.inv_title=Bir eşyayı tanımla
items.scrolls.scrollofidentify.it_is=Eşyanız tanımlandı: %s.
items.scrolls.scrollofidentify.desc=Bu parşömen tek bir eşyanın tüm sırlarını açığa çıkarır.

items.scrolls.scrolloflullaby.name=ninni parşömeni
items.scrolls.scrolloflullaby.sooth=Bu parşömen rahatlatıcı bir melodi söylüyor. Çok uykulu hissediyorsun.
items.scrolls.scrolloflullaby.desc=Bu parşömen okunduğunda, onu duyan herkesi derin bir büyülü uykuya daldıracak rahatlatıcı bir melodi yayılır. Okuyan kişi ve müttefikleri için bu uyku onarıcıdır.

items.scrolls.scrollofmagicmapping.name=büyülü haritalama parşömeni
items.scrolls.scrollofmagicmapping.layout=Artık bölümün düzeninden haberdarsın.
items.scrolls.scrollofmagicmapping.desc=Bu parşömen okunduğunda, kristal berraklığında bir resim hafızana kazınarak katın tüm sırlarını açığa çıkartır ve isabetli bir haritasını çıkartır. Eşya ve yaratıkların yerleri belirlenmemiş olarak kalacaktır.

items.scrolls.scrollofmirrorimage.name=ayna görüntü parşömeni
items.scrolls.scrollofmirrorimage.copies=Parşömen senin ayna görüntülerini oluşturuyor.
items.scrolls.scrollofmirrorimage.no_copies=Parşömen, senin ayna görüntülerini oluşturmaya çalışıyor, ancak gidecek hiçbir yerleri yok.
items.scrolls.scrollofmirrorimage.desc=Bu parşomenin üzerindeki büyü, okuyucunun iki ilüzyonik kopyasını oluşturacaktır. Bu ayna kopyalar okuyucunun zayıf klonları olarak görev yapar ve düşmanları kovalar. Fakat onların bir dayanıklılığı yoktur ve hasar aldıkları an kaybolurlar.

items.scrolls.scrollofretribution.name=intikam parşömeni
items.scrolls.scrollofretribution.blast=Parşömenden güçlü bir sihirli enerji fışkırıyor!
items.scrolls.scrollofretribution.desc=Bu parşömen, okuyan kişinin çektiği acıyı dışa bir güç patlaması olarak yönlendiren yıkıcı bir enerjiye sahiptir. Okuyan kişi ne kadar zayıflamışsa bu parşömen o kadar fazla hasar verecektir. Çok az sağlıkta iken bu parşömen çoğu düşmanı anında öldürebilir.\n\nFakat bu parşömeni okumanın okuyan kişi için bir bedeli vardır, bu da onun kör olması ve zayıflamasıdır.

items.scrolls.scrollofrage.name=öfke parşömeni
items.scrolls.scrollofrage.roar=Parşömen bütün zindanda yankılanan öfkelendirici bir kükreme çıkardı!
items.scrolls.scrollofrage.desc=Okunduğunda, bu parşömen tüm düşmanları okuyucuya çeken ve yakındakileri de öfkelendiren büyük bir kükreme salar.

items.scrolls.scrollofrecharging.name=reşarj parşömeni
items.scrolls.scrollofrecharging.surge=Bir enerji dalgası vücudundan geçerek asalarını canlandırıyor!
items.scrolls.scrollofrecharging.desc=Saf büyülü güç larşomenden çıkar ve zamanla kullanıcının bütün asalarını şarj eder.

items.scrolls.scrollofremovecurse.name=Lanet kaldırma parşömeni
items.scrolls.scrollofremovecurse.inv_title=Bir eşyayı arındır
items.scrolls.scrollofremovecurse.cleansed=Eşyan temizleyici bir ışıkla parlıyor ve kötücül bir güç dağılıyor!
items.scrolls.scrollofremovecurse.not_cleansed=Eşyan temizleyici bir ışıkla parlıyor, ama hiç bir şey olmuyor.
items.scrolls.scrollofremovecurse.spirit=Parşömenin eziyet görmüş ruhu serbest bırakıyor!
items.scrolls.scrollofremovecurse.desc=Bu parşömenin üzerindeki büyülü sözler bir zırh, silah, asa, yüzük veya eserden tüm lanetleri kaldırır.

items.scrolls.scrollofteleportation.name=ışınlama parşömeni
items.scrolls.scrollofteleportation.tele=Göz açıp kapayıncaya kadar bu katta başka bir yere ışınlandın.
items.scrolls.scrollofteleportation.no_tele=Işınlama büyüsü başarısız oldu.
items.scrolls.scrollofteleportation.cant_reach=Oraya ışınlanamazsın.
items.scrolls.scrollofteleportation.prompt=Işınlanmak istediğin yeri seç
items.scrolls.scrollofteleportation.desc=Bu parşömenin üstündeki büyü okuyucuyu anında başka bir yere ışınlar. Parşömen okuyanın daha önce gitmediği yerlere öncelik gösterir ama kilitli kapıları veya barikatların ardına geçemez. Bununla birlikte, yeni alanlara açılan gizli kapıları ortaya çıkarabilir.

items.scrolls.scrollofterror.name=terör parşömeni
items.scrolls.scrollofterror.none=Parşömen muazzam bir kırmızı ışık parlaması yayıyor.
items.scrolls.scrollofterror.one=Parşöen muazzam bir kırmızı ışık parlaması yaydı ve %s kaçmaya başladı!
items.scrolls.scrollofterror.many=Parşömen muazzam bir kırmızı ışık parlaması yaydı ve yaratıklar kaçmaya başladı!
items.scrolls.scrollofterror.desc=Okunduğunda, bu parşömen görüş alanındaki tüm düşmanları korkuyla kaçıran kırmızı bir ışık yayar. Kaçan bir düşmana saldırmak etkinin süresini azaltır.

items.scrolls.scrolloftransmutation.name=transmutasyon parşomeni
items.scrolls.scrolloftransmutation.inv_title=Bir eşyayı transmüle et
items.scrolls.scrolloftransmutation.nothing=Kayda değer bir şey olmadı.
items.scrolls.scrolloftransmutation.morph=Eşyan başka bir şeye dönüştü!
items.scrolls.scrolloftransmutation.desc=Bu parşömen güçlü dönüşüm büyüsü içerir. Uygun bir eşya üzerinde kullanıldığında, onu aynı türden farklı bir eşyaya dönüştürecektir. Büyü, yükseltmeleri, büyüleri ve kabartmaları bile koruyacaktır. Parşömenler ve iksirler egzotik eşdeğerlerine dönüştürülecek ve bunun tersi de geçerli olacaktı

items.scrolls.scrollofupgrade.name=yükseltme parşömeni
items.scrolls.scrollofupgrade.inv_title=Bir eşyayı yükselt
items.scrolls.scrollofupgrade.weaken_curse=Yükseltme parşömeni eşyandaki laneti zayıflattı.
items.scrolls.scrollofupgrade.remove_curse=Yükseltme parşömeni eşyandaki laneti temizledi!
items.scrolls.scrollofupgrade.desc=Bu parşömen, tek bir eşyayı ya da bir set fırlatılabilir silahı geliştirir. Asalar daha güçlü hale gelir ve şarj sayıları artar; silahlar ve zırhlar daha fazla hasar verir ya da daha iyi koruma sağlar; fırlatılabilir silah setleri tamamen onarılır ve daha dayanıklı olur; yüzüklerin etkileri ise güçlenir.\n\nAyrıca lanetleri zayıflatabilir, hatta bazen tamamen ortadan kaldırabilir, ancak bir lanet kaldırma parşömeni kadar güçlü değildir. Ne yazık ki, bu yükseltme büyüsü yüksek seviyeli eşyalar üzerindeki büyüleri veya glifleri silebilir.



###exotic scrolls
items.scrolls.exotic.exoticscroll.kaunan=egzotik KAUNAN parşömeni
items.scrolls.exotic.exoticscroll.sowilo=egzotik SOWILO parşömeni
items.scrolls.exotic.exoticscroll.laguz=egzotik LAGUZ parşömeni
items.scrolls.exotic.exoticscroll.yngvi=egzotik YNGVI parşömeni
items.scrolls.exotic.exoticscroll.gyfu=egtozik GYFU parşömeni
items.scrolls.exotic.exoticscroll.raido=egzotik RAIDO parşömeni
items.scrolls.exotic.exoticscroll.isaz=egzotik ISAZ parşömeni
items.scrolls.exotic.exoticscroll.mannaz=egzotik MANNAZ parşömeni
items.scrolls.exotic.exoticscroll.naudiz=egzotik NAUDIZ parşömeni
items.scrolls.exotic.exoticscroll.berkanan=egzotik BERKANAN iksiri
items.scrolls.exotic.exoticscroll.odal=egzotik ODAL parşömeni
items.scrolls.exotic.exoticscroll.tiwaz=egzotik TIWAZ parşömeni
items.scrolls.exotic.exoticscroll.unknown_desc=Bu siyah parşömenin üzerine anlaşılamaz, parıldayan bir büyüsel rün yazılmış. Bu parşömen buralara yabancı gibi duruyor, sesli bir şekilde okunduğunda ne olacağını kim bilir?
items.scrolls.exotic.exoticscroll.discover_hint=Bu eşyayı simya ile üretebilirsin.

items.scrolls.exotic.scrollofsirenssong.name=deniz kızı şarkısı parşömeni
items.scrolls.exotic.scrollofsirenssong.prompt=Hedef seçin
items.scrolls.exotic.scrollofsirenssong.no_target=Parşomen bir hedef olmadan aktive oldu.
items.scrolls.exotic.scrollofsirenssong.cancel=Bir hedef seçmek zorundasın.
items.scrolls.exotic.scrollofsirenssong.desc=Bu parşömeni okumak hedef aldığın düşmanı köleleştirip sonsuza kadar müttefikin yapan baştan çıkarıcı bir melodi çıkarır! Melodiyi duyan diğer düşmanlar geçici süreliğine baştan çıkar.\n\nBazı güçlü düşmanlar köleleşmeye direnirler, bunun yerine baştan çıkarlar.
items.scrolls.exotic.scrollofsirenssong$enthralled.name=büyülenmiş
items.scrolls.exotic.scrollofsirenssong$enthralled.desc=Bu yaratık bir deniz kızı şarkısı parşömeninin büyüsüyle büyülenmiştir.\n\nBüyülenmiş bir karakter kalıcı olarak müttefikinizdir ve karşılaştığı tüm düşmanlarla savaşır.

items.scrolls.exotic.scrollofantimagic.name=anti-büyü parşömeni
items.scrolls.exotic.scrollofantimagic.desc=Bu parşömen üzerindeki büyü sizi, zararlı veya yararlı tüm büyü etkilerini geçici olarak engelleyen büyülü bir aura ile çevreleyecektir. Buna asalar, parşömenler, yüzükler, eserler, büyüler ve lanetler gibi çoğu büyülü eşya etkisi dahildir. Ancak kahramanca zırh yetenekleri her şeye rağmen işe yarayacak kadar güçlüdür.

items.scrolls.exotic.scrollofchallenge.name=meydan okuma parşömeni
items.scrolls.exotic.scrollofchallenge.desc=Bu parşömen okunduğunda düşmanları okuyana çeken büyük bir kükreme çıkarır ve okuyanın etrafında küçük bir arena oluşturur.\n\nOkuyan arenanın içinde kaldığı sürece bütün kaynaklardan %33 daha az zarar alır(bu diğer bütün hasar azaltma şekillerinden önce uygulanır) ve acıkmaz.\n\nArenanın boyutu okuyanın bulunduğu alanın boyutuna bağlıdır. Bazı patron alanlarında epey küçük olabilir.
items.scrolls.exotic.scrollofchallenge$challengearena.name=meydan okuma arenası
items.scrolls.exotic.scrollofchallenge$challengearena.desc=Etrafınızda kırmızı bir sisle gösterilen büyülü bir arena belirdi.\n\nSisin içinde dururken açlığınız artmaz ve tüm kaynaklardan %%33 daha az hasar alırsınız. Başka hasar azaltma kaynaklarınız varsa (zırh gibi), bunlar %%33'lük azaltmadan sonra uygulanır.\n\nKalan turlar: %d.

items.scrolls.exotic.scrollofdivination.name=sezgi parşömeni
items.scrolls.exotic.scrollofdivination.nothing_left=Tanınacak hiçbir şey kalmadı!
items.scrolls.exotic.scrollofdivination.desc=Bu parşömen, şu anda bilmediğiniz dört tür eşyayı rastgele belirleyecektir. Belirlenen türler bir iksirin rengi, bir parşömenin rünü veya bir yüzüğün taşı olabilir. Belirlenen eşyaların taşıdığınız eşyalar olması gerekmez.
items.scrolls.exotic.scrollofdivination$wnddivination.desc=Sezgi parşömeni şu eşyaları tanıdı:

items.scrolls.exotic.scrollofdread.name=dehşet parşömeni
items.scrolls.exotic.scrollofdread.desc=Bu parşömen okunduğunda görüş alanındaki bütün düşmanları inanılmaz bir dehşete sokan kırmızı bir ışık yayar. Bu etki o kadar kuvvetlidir ki düşmanların çabucak, bir daha dönmemek üzere zindanı terkeder!\n\nTıpkı korku gibi, bu etki zamanla ya da düşman saldırıya uğradığında kaybolabilir.\n\nPatronlar gibi iradesi güçlü düşmanlar bunun yerine sıradan korkuya kapılır.

items.scrolls.exotic.scrollofenchantment.name=efsunlama parşömeni
items.scrolls.exotic.scrollofenchantment.inv_title=Bir eşyayı efsunla
items.scrolls.exotic.scrollofenchantment.weapon=Silahına işlemek için bir efsun seç.
items.scrolls.exotic.scrollofenchantment.armor=Zırhına işlemek için bir kabartma seç.
items.scrolls.exotic.scrollofenchantment.cancel=iptal et
items.scrolls.exotic.scrollofenchantment.cancel_warn=İptal etmek yine de büyü parşömeninizi tüketecektir, emin misiniz?
items.scrolls.exotic.scrollofenchantment.cancel_warn_yes=Evet, eminim.
items.scrolls.exotic.scrollofenchantment.cancel_warn_no=Hayır, fikrimi değiştirdim
items.scrolls.exotic.scrollofenchantment.desc=Bu parşömen bir silahı veya zırhı güçlü bir büyülü enerji ile işleyecektir. Okuyucu hangi büyünün işlendiği üzerine bile biraz kontrol sahibidir.

items.scrolls.exotic.scrollofforesight.name=öngörü parşömeni
items.scrolls.exotic.scrollofforesight.desc=Bu parşömeni okuduktan sonra etraftaki arazinin detayları okuyanın zihnine tam netlikte sürekli olarak verilir. Bu etki kayda değer bir süre devam eder, bütün gizli kapı ve tuzakları gösterir, bu esnada durup arama yapmak gereksizdir.

items.scrolls.exotic.scrollofmetamorphosis.name=başkalaşım parşömeni
items.scrolls.exotic.scrollofmetamorphosis.choose_desc=Başkalaşmak için bir yetenek seçin.
items.scrolls.exotic.scrollofmetamorphosis.replace_desc=Başkalaşım geçirmiş yeteneğinizi değiştirmek için yeni bir yetenek seçin.
items.scrolls.exotic.scrollofmetamorphosis.cancel_warn=İptal etmek yine de transmutasyon parşömeninizi tüketecektir, emin misiniz?
items.scrolls.exotic.scrollofmetamorphosis.metamorphose_talent=başkalaşım yeteneği
items.scrolls.exotic.scrollofmetamorphosis.desc=Bu parşömen, bir eşyayı değil büyüyü yapanı etkileyen güçlü bir dönüşüm büyüsü içermektedir. Bu büyü, kendine ait bir yeteneğini, başka sınıf bir kahramanın aynı düzeydeki 5 yeteneğinden biri ile değiştirebilmeni sağlar!\n\nBu etki yalnızca sınıf yeteneklerini kapsar, altsınıf ve zırhtan gelen yetenekleri değil. Kullanmana imkan olmayan yetenekler seçenek olarak sunulmayacaktır.

items.scrolls.exotic.scrollofmysticalenergy.name=mistik enerji parşömeni
items.scrolls.exotic.scrollofmysticalenergy.desc=Bu parşömenin içindeki çiğ büyüsel güç yayıldığı zaman bir kullanıcının kuşandığı eserleri zamanla şarj eder.

items.scrolls.exotic.scrollofpassage.name=geçiş parşömeni
items.scrolls.exotic.scrollofpassage.desc=Bu parşömenin üzerindeki büyü, okuyucuyu anında üstlerindeki en yakın birinci kat bölgesine taşıyor. Bir mağazaya hızlı bir şekilde ulaşmak için çok kullanışlı.

items.scrolls.exotic.scrollofprismaticimage.name=prizmatik görüntü parşömeni
items.scrolls.exotic.scrollofprismaticimage.desc=Bu parşömenin üzerindeki yazıt, okuyucunun ilüzyonik bir ikizini yaratacaktır. Bu prizmatik görüntü, okuyucu ile benzer defansa fakat daha az hp ve hasara sahip zayıf bir kopya olacak davranacaktır.\n\nBu prizmatik görüntü görünürde düşmanlar varken kendisini gösterecek ve okuyucuyu korumaya çalışacaktır.\n\nEğer bir prizmatik görüntü zaten yanında ise bu parşömeni okumak onu tamamen iyileştirecektir.

items.scrolls.exotic.scrollofpsionicblast.name=psiyonik patlama parşömeni
items.scrolls.exotic.scrollofpsionicblast.ondeath=Psionik Patlama zihnini paramparça etti...
items.scrolls.exotic.scrollofpsionicblast.desc=Bu parşömende görünürdeki tüm yaratıkların zihinlerini paramparça edecek inanılmaz derecede yıkıcı bir enerji var.\n\nFakat bu parşömeni okumanın okuyucu için de bir karşılığı var,  okuyucu da hasar alacak, kör olacak ve zayıflayacak. Parşömen ne kadar fazla hedefe vurursa okuyucunun aldığı hasar o kadar azalacaktır.



###spells
items.spells.alchemize.name=simyalaştır
items.spells.alchemize.prompt=Bir Eşyayı Simyalaştır
items.spells.alchemize.desc=Bu büyü bir simya kabında bulunanlara benzer dönüştürücü güçler içerir. Her kullanım, kullanıcının bir eşyayı (veya eşya yığınını) altına veya simya enerjisine dönüştürmesini sağlar. İksirleri veya parşömenleri enerjiye dönüştürmek onları tanımlayacaktır bile!\n\nDükkanlarda birkaç Simya kullanımı satılır, ancak bir tohum, rün taşı ve biraz simya enerjisi birleştirilerek simya kullanılarak çok daha fazlası yapılabilir.
items.spells.alchemize$wndalchemizeitem.sell=%d altına çevir
items.spells.alchemize$wndalchemizeitem.sell_1=1 tanesini %d altına çevir
items.spells.alchemize$wndalchemizeitem.sell_all=Hepsini %d altına çevir
items.spells.alchemize$wndalchemizeitem.energize=%d enerjiye çevir
items.spells.alchemize$wndalchemizeitem.energize_1=1 tanesini %d enerjiye çevir
items.spells.alchemize$wndalchemizeitem.energize_all=Hepsini %d enerjiye çevir

items.spells.beaconofreturning.name=geri dönüş feneri
items.spells.beaconofreturning.preventing=Bu mekanın güçlü büyüsel aurası seni büyüyü kullanmaktan alıkoyuyor.
items.spells.beaconofreturning.creatures=Komşu yaratıkların ruhsal varlığı şu anda ışınlanmana izin vermiyor.
items.spells.beaconofreturning.set=Lamba mevcut konuma koyuldu.
items.spells.beaconofreturning.wnd_body=Bu yeri seçmek daha önce seçilen yerin yerini alır\n\nDönmeyi seçmek sizi son seçilen yere gönderir ve büyünün bir şarjını kullanır
items.spells.beaconofreturning.wnd_set=Kur
items.spells.beaconofreturning.wnd_return=Dön
items.spells.beaconofreturning.desc_set=Bu fener Zindanın %d katında.
items.spells.beaconofreturning.desc=Bu karışık büyü kullanana seçilen bir yere aradaki mesafe farketmeksizin geri dönme yeteneği bahşeder. Bu büyü sadece geri dönmekle tükenir, istenildiği kadar yer seçilebilir ama unutmayın sadece son seçilen yere dönersiniz.

items.spells.curseinfusion.name=Lanet füzyonu
items.spells.curseinfusion.inv_title=Bir eşyayı lanetle
items.spells.curseinfusion.desc=Bu büyü, bir ekipman parçasına DM-300'de bulunan aynı güçlü kötücül büyüyü aşılar. Üzerinde kullanıldığı eşya derhal lanetlenir ve sahip olabileceği her türlü büyü veya glif geçersiz kılınır.\n\nSilahlar, zırhlar ve asalar söz konusu olduğunda, eşya lanetlenmenin yanı sıra yükseltmeler de kazanacaktır. Lanet infüzyonu yükseltmeleri birikmez ve eşya lanetsiz hale gelirse yükseltmeler kaybolur.\n\nBir silah veya zırhın üzerindeki laneti değiştirmek için birden fazla lanet infüzyonu da kullanılabilir.

items.spells.spell.ac_cast=YAP
items.spells.spell.no_magic=Büyü bağışıklılığındayken büyü yapamazsın.
items.spells.spell.discover_hint=Bu eşyayı simya ile üretebilirsin.

items.spells.magicalinfusion.name=büyü füzyonu
items.spells.magicalinfusion.inv_title=İşlemek için bir eşya seç
items.spells.magicalinfusion.infuse=Eşyan, sırlı enerjiyle aşılandı!
items.spells.magicalinfusion.desc=Bu büyü, bir yükseltme parşömeni ile aynı büyülü güce sahiptir, ancak daha kararlı bir biçimdedir.\n\nBir eşyayı normal şekilde yükseltmenin yanı sıra, bir büyüyü, glifi veya laneti asla silmeyecektir.

items.spells.magicalporter.name=Sihirli Işınlayıcı
items.spells.magicalporter.inv_title=Eşya ışınla
items.spells.magicalporter.nowhere=Eşya ışınlayabileceğin bir yer yok
items.spells.magicalporter.desc=Bu büyü üzerinde kullanıldığı her eşyayı ışınlar. Ama "Tüccarın Feneri"nin aksine eşyalar bir sonraki boss katının girişine ışınlanır.

items.spells.phaseshift.name=Faz geçişi
items.spells.phaseshift.no_target=Burada ışınlanacak bir yer yok.
items.spells.phaseshift.desc=Bu kaotik büyü, hedef aldığı herhangi bir karakteri mevcut katta rastgele bir yere ışınlayacak ve onları önemli bir süre sersemletecek. Güçlü düşmanlar, çarpıcı etkiye direnebilecek. Bu büyü, bir hedefe veya kullanıcının kendisine yönlendirilebilir.

items.spells.reclaimtrap.name=Tuzak Tutucu
items.spells.reclaimtrap.no_trap=Orada tuzak yok.
items.spells.reclaimtrap.desc_trap=Büyü şu anda bir _%s_ yi tetiklemeye hazır.
items.spells.reclaimtrap.desc=Bu büyü DM-300'ün mekanik enerjisinin kalıntılarını içerir. Aktif bir tuzak üzerinde kullanıldığında, tuzağın gücü size bağlanır ve bu gücü dışarı atmak ve tuzağın etkisini istediğiniz herhangi bir yerde tetiklemek için büyüyü tekrar kullanmanıza izin verir.\n\nAncak, bazı tuzaklar her yerde çalışmayabilir ve aynı anda yalnızca bir tuzak saklanabilir.

items.spells.recycle.name=Geri Dönüştürücü
items.spells.recycle.inv_title=Bir eşyayı geri dönüştür
items.spells.recycle.recycled=Bu eşya %s'e geri dönüştürüldü
items.spells.recycle.desc=Bu büyü daha küçük bir değiştirici güce sahiptir. Ekipmanlarda çalışmaz. Parşömen, iksir, tohum, rüntaşı ya da uçlu dartları aynı tipte farklı bir eşyaya dönüştürür.

items.spells.summonelemental.name=elemental çağır
items.spells.summonelemental.ac_imbue=AŞILA
items.spells.summonelemental.imbue_prompt=Bir eşya aşıla
items.spells.summonelemental.desc=Bu büyü onu yapmak için kullanılan elementer közlerin enerjisini kanalize eder ve senine birlikte savaşması için dost bir elemental çağırmana izin verir! Tek seferde yalnızca bir elemental çağrılabilir, ancak elementali sana ücretsiz olarak geri vermek için büyü yeniden yapılabilir.
items.spells.summonelemental.desc_newborn=Bu büyü şu anda yüksüzdür ve uzak mesafeli saldırısı olmayan bir _yeni doğan elemental_ çağırır. Büyüyü güçlendirmek için tanımlanmış bir sıvı alev iksiri, don iksiri, yeniden şarj etme parşömeni veya dönüşüm parşömeni aşılayabilir ve gelecekteki çağrıların tam güçlü bir elemental olmasına neden olabilirsiniz!
items.spells.summonelemental.desc_fire=Büyü şu anda dokunulamayacak kadar sıcaktır, bir _ateş elementali_ çağıracaktır. Farklı bir eşyayı büyüye dahil edebilirsiniz, ancak büyü mevcut büyüsünü kaybedecektir.
items.spells.summonelemental.desc_frost=Büyü şu anda dokunulamayacak kadar soğuktur, bir _don elementali_ çağıracaktır. Farklı bir eşyayı büyüye dahil edebilirsiniz, ancak büyü mevcut büyüsünü kaybedecektir.
items.spells.summonelemental.desc_shock=Büyü şu anda statik enerji yayıyor, bir _şok elementali_ çağıracak. Farklı bir eşyayı büyüye dahil edebilirsiniz, ancak büyü mevcut büyüsünü kaybedecektir.
items.spells.summonelemental.desc_chaos=Büyü şu anda kaotik enerji yayıyor, bir _kaos elementali_ çağıracak. Farklı bir eşyayı büyüye dahil edebilirsiniz, ancak büyü mevcut büyüsünü kaybedecektir.

items.spells.targetedspell.prompt=Hedef seçin
items.spells.targetedspell.inv_title=İşlemek için bir eşya seç

items.spells.telekineticgrab.name=uzaktan tutuş
items.spells.telekineticgrab.cant_grab=Onu tutamazsın.
items.spells.telekineticgrab.no_target=Orada tutacak bir şey yok.
items.spells.telekineticgrab.desc=Bu büyü, kullanıcının bir konumdaki tüm eşyaları veya bir düşmana saplanmış tüm fırlatma silahlarını uzaktan almasını sağlar!\n\nBaşkasının sahip olduğu eşyaları veya sandık gibi kapları almak için kullanılamaz.

items.spells.unstablespell.name=dengesiz füzyon
items.spells.unstablespell.desc=Bu küçük siyah kare kristalin her bir yüzeyinde değişen rünik semboller vardır.\n\nEtkinleştirildiğinde, rastgele bir parşömen etkisini tetikler. Parşömen etkisi, görüş alanınızda düşmanlar varsa her zaman savaş odaklı olacak, aksi takdirde her zaman savaş odaklı olmayacaktır.

items.spells.wildenergy.name=Vahşi enerji
items.spells.wildenergy.desc=Bu büyü DM-300'e güç vermiş lanetli enerjinin bir kısmını içeriyor. Kullanıldığında kahramanın üzerindeki asaları ve kuşanılmış büyülü eşyaları şarj eder ama rastgele bir lanetli asa efekti devreye girer, bu etkiyi yönlendirebilirsiniz.


###runestones
items.stones.inventorystone.ac_use=KULLAN

items.stones.runestone$placeholder.name=Rüntaşı
items.stones.runestone.discover_hint=Bu eşyayı zindanda rastgele bulabilirsin veya simya ile üretebilirsin.

items.stones.stoneofaggression.name=saldırganlık taşı
items.stones.stoneofaggression.desc=Bu taş bir dost veya düşmana fırlatıldığında, yakındaki tüm düşmanlar kısa bir süre için o karaktere saldırmayı tercih eder. \n\nAncak patron düşmanlar bu etkiye direnebilir, süreyi önemli ölçüde kısaltır ve kölelerinin saldırılarından daha az hasar alır.
items.stones.stoneofaggression$aggression.name=hedeflenmiş
items.stones.stoneofaggression$aggression.desc=Manipülatif büyü, yakındaki tüm düşmanların bu karaktere saldırmayı tercih etmesini sağlıyor.\n\nKalan hamle sayısı: %s.

items.stones.stoneofaugmentation.name=büyüme taşı
items.stones.stoneofaugmentation.inv_title=Bir eşyayı yükselt
items.stones.stoneofaugmentation.desc=Bu rün taşı, bir özelliği güçlendirirken başka birinden ödün vererek ekipmanı geliştirebilen güçlü bir sihir barındırır.\n\nBir silah üzerinde kullanıldığında, hız ya da hasar özelliklerinden birini geliştirmene olanak tanır.\nFırlatılabilir silahlar ayrıca hızlarına bağlı olarak dayanıklılık kazanabilir ya da kaybedebilir.\n\nBir zırh üzerinde kullanıldığında ise, savunma ya da kaçınma özelliklerinden biri geliştirilebilir.
items.stones.stoneofaugmentation.discover_hint=Bu eşyayı mağazadan satın alabilir veya simya ile üretebilirsin.
items.stones.stoneofaugmentation$wndaugment.choice=Neyi yükseltmek istersin?
items.stones.stoneofaugmentation$wndaugment.speed=Hız
items.stones.stoneofaugmentation$wndaugment.damage=Hasar
items.stones.stoneofaugmentation$wndaugment.evasion=Kaçınma
items.stones.stoneofaugmentation$wndaugment.defense=Korunma
items.stones.stoneofaugmentation$wndaugment.none=Yükseltmeyi Kaldır
items.stones.stoneofaugmentation$wndaugment.cancel=Boşver

items.stones.stoneofblast.name=patlama taşı
items.stones.stoneofblast.desc=Bu rüntaşı atıldığı yere değdiği an patlayacaktır. Aynı bir bomba gibi patlama çevresindekilere zarar verecektir.

items.stones.stoneofblink.name=ışınlanma taşı
items.stones.stoneofblink.desc=Bu rüntaşı kullanıcısını fırlatıldığı yere ışınlayacaktır.

items.stones.stoneofclairvoyance.name=sağgörü taşı
items.stones.stoneofclairvoyance.desc=Bu taş atıldığı anda geniş bir alandaki tüm zemini açığa çıkarır, bu etki duvarların ötesine de geçer.

items.stones.stoneofdeepsleep.name=Derin Uyku Taşı
items.stones.stoneofdeepsleep.desc=Bu taş bir düşmana atıldığında, onları tavuk gibi büyülü uykuya sokar. Sihirli bir şekilde uyuyan düşmanlar, dürtülene dek sonsuza kadar uyur.

items.stones.stoneofdetectmagic.name=Büyü Saptama Taşı
items.stones.stoneofdetectmagic.inv_title=Bir eşyanın lanetli olup olmadığını tespit et
items.stones.stoneofdetectmagic.detected_none=Bu eşyaya etki eden bir büyü fark etmedin.
items.stones.stoneofdetectmagic.detected_both=Bu eşyaya hem kötücül hem de pozitif büyünün etki ettiğini fark ediyorsun!
items.stones.stoneofdetectmagic.detected_good=Bu eşyaya pozitif büyünün etki ettiğini fark ettin!
items.stones.stoneofdetectmagic.detected_bad=Bu eşyaya kötücül büyünün etki ettiğini fark ettin!
items.stones.stoneofdetectmagic.desc=Bu rün taşı bir eşyayı etkileyen büyüyü tespit edebilir. Bu taşı tanımlanamayan bir eşya üzerinde kullandığınızda, eşyanın kötü niyetli bir lanetten etkilenip etkilenmediğini ve bir büyü veya yükseltme gibi olumlu bir büyüden etkilenip etkilenmediğini anlarsınız.

items.stones.stoneofdisarming.name=Etkisiz hale getirme taşı
items.stones.stoneofdisarming.desc=Bu rün taşı içinde zindanda gizlenmiş kötü niyetli tuzakları imha eden bir büyüyü barındırmaktadır. Atıldığı alanda 9 birime kadar tuzak imha eder.

items.stones.stoneofenchantment.name=efsunlama taşı
items.stones.stoneofenchantment.inv_title=Bir eşyayı efsunla
items.stones.stoneofenchantment.weapon=Silahın karanlıkta parlıyor!
items.stones.stoneofenchantment.armor=Zırhın karanlıkta parlıyor!
items.stones.stoneofenchantment.desc=Bu taş efsunlama sihrine sahip. Bir Yükseltme Tomarının aksine bir eşyanın gücünü direkt olarak yükseltmez, fakat bunun yerine bir zırha veya silahı bir büyüyle kaplayarak ona yeni bir güç kazandırır.

items.stones.stoneoffear.name=korku taşı
items.stones.stoneoffear.desc=Bu taş bir karakterin üzerine atıldığında dehşete kapılırlar ve dönüp kaçarlar. Kaçan bir karaktere saldırmak etkiyi kısaltır.

items.stones.stoneofflock.name=sürü taşı
items.stones.stoneofflock.desc=Bu rüntaşı fırlatıldığı bölgede kısa bir süreliğine büyülü bir koyun oluşturur.

items.stones.stoneofintuition.name=sezgi taşı
items.stones.stoneofintuition.inv_title=Bir eşya seç
items.stones.stoneofintuition.desc=Bu rüntaşı tanımlama parşömeninin büyüsünün daha zayıf bir versiyonuna sahip. Kullanıldığı eşyayı direk tanımlamak yerine sezgilerinizle çalışır ve bir iksiri, parşömeni veya yüzüğü tahmin ederek tanımlamanızı sağlar.
items.stones.stoneofintuition.break_info=Sezgi taşlarını biri kırılmadan önce iki kez kullanabilirsiniz, _sonraki kullanımınız bir taşı tüketmez_.
items.stones.stoneofintuition.break_warn=Daha önce bir sezgi taşı kullandınız, _bu nedenle bundan sonraki kullanımınız bir taş tüketecektir_.
items.stones.stoneofintuition$wndguess.text=Tanımlanmamış eşyanın tipini tahmin edin. Tahmininiz doğruysa, tip tanımlanır!
items.stones.stoneofintuition$wndguess.correct=Doğru. Bu eşya tipi tanımlandı!
items.stones.stoneofintuition$wndguess.incorrect=Tahminin yanlıştı.
items.stones.stoneofintuition$wndguess.break=Sezgi taşı toz haline gelir.

items.stones.stoneofshock.name=şok taşı
items.stones.stoneofshock.desc=Bu rüntaşı yakındaki tüm düşmanları kısa süreliğine sersemleten bir elektriksel enerji salar ve fırlatan kişinin asasını vurduğu her hedef için şarj artan bir şekilde şarj eder.


###trinkets
items.trinkets.chaoticcenser.name=kaotik rün
items.trinkets.chaoticcenser.spew=Buhurdanlığın boşalmak üzere: %s.
items.trinkets.chaoticcenser.desc=Simya kazanında biraz zaman geçirdikten sonra bu tütsü yakan buhurdan kendi kendine duman üretiyor gibi görünür! Bu gazlar birikir ve yarı rastgele aralıklarla buhurdanlıktan düşmanlara doğru püskürür. Her türlü gazı üretebilir gibi görünüyor, ancak buhurdan harekete geçmeden hemen önce bir anlık uyarı alacaksınız.
items.trinkets.chaoticcenser.typical_stats_desc=Genellikle bu tılsım, her _%d_ turda bir düşmanın yakınında zararlı bir gaz oluşturur. Gazlar yalnızca düşmanlar bulunduğunda görünür. Yüksek seviyelerde bu gazlar daha egzotik ve güçlü olma olasılığına sahiptir.
items.trinkets.chaoticcenser.stats_desc=Mevcut seviyesinde, bu tılsım yaklaşık her _%d_ turda bir düşmanın yakınında zararlı bir gaz ortaya çıkarır. Gazlar yalnızca düşmanlar mevcut olduğunda ortaya çıkar. Yüksek seviyelerde bu gazlar daha egzotik ve güçlü olma olasılığına sahiptir.

items.trinkets.crackedspyglass.name=çatlak dürbün
items.trinkets.crackedspyglass.desc=Bu el dürbünü, ön merceğindeki çatlak olmasaydı, mükemmel ve hassas işçiliğin bir örneği olurdu. Dürbün, zindandaki yeni öğeleri ortaya çıkararak size yardımcı oluyor gibi görünüyor, ancak kusuru nedeniyle ortaya çıkan öğeleri görmek oldukça zor!
items.trinkets.crackedspyglass.typical_stats_desc=Genellikle bu tılsım, patron olmayan her katta _%%%1$s şansla_ ekstra bir gizli öğe yaratır.
items.trinkets.crackedspyglass.stats_desc=Mevcut seviyesinde, bu tılsım her patron olmayan katta _%%%1$s şansla_ ekstra bir gizli öğe yaratır.
items.trinkets.crackedspyglass.stats_desc_upgraded=Mevcut seviyesinde, bu tılsım her patron olmayan katta _%%100 şansla_ ekstra bir gizli öğe ve _%%%1$s şansla_ ikinci bir ekstra gizli öğe yaratır.

items.trinkets.dimensionalsundial.name=boyutlu güneş saati
items.trinkets.dimensionalsundial.warning=Güneş saatin bir gölge düşürmüyor, tedirgin hissediyorsun.
items.trinkets.dimensionalsundial.desc=Bu küçük el güneş saati, siz onu dik tutmasanız bile bir şekilde zindanın derinliklerinde bir gölge oluşturabiliyor. Daha da tuhafı, gölgenin konumunun bu dünyadaki güneşle hiçbir ilişkisi yok gibi görünüyor. Gölge oluşmadığında, güneş saati tehlikeyi çekiyor gibi görünüyor.
items.trinkets.dimensionalsundial.typical_stats_desc=Tipik olarak bu tılsım, gerçek hayatta gündüz vakti (öö8-ös8) düşmanların ortaya çıkma oranını _%%%1$d_ azaltır ve gece vakti (ös8-öö8) düşmanların ortaya çıkma oranını _%%%2$d_ artırır.
items.trinkets.dimensionalsundial.stats_desc=Mevcut seviyesinde, bu tılsım gerçek hayatta gündüz vakti (öö8-ös8) düşmanların ortaya çıkma oranını _%%%1$d_ azaltacak ve gece vakti (ös8- öö8) düşmanların ortaya çıkma oranını _%%%2$d_ artıracaktır.

items.trinkets.exoticcrystals.name=egzotik kristaller
items.trinkets.exoticcrystals.desc=Bu küçük pembe kristaller simya enerjisi kristalleri ile aynı şekle sahiptir. Doğrudan enerji için kullanılamasalar da, bulduğunuz iksirleri ve parşömenleri bir şekilde etkiliyor gibi görünüyorlar.
items.trinkets.exoticcrystals.typical_stats_desc=Tipik olarak bu tılsım, iksir veya parşömen düşüşlerinin _%%%s_  egzotik eşdeğerleriyle değiştirecektir. Bu durum güç iksirlerini, yükseltme parşömenlerini veya tehlike odalarını çözmeye yardımcı olmak için üretilen eşyaları etkilemez.
items.trinkets.exoticcrystals.stats_desc=Mevcut seviyesinde bu tılsım, düşen iksir veya parşömenleri _%%%s_ oranında egzotik eşlenikleriyle değiştirecektir. Bu durum güç iksirlerini, yükseltme parşömenlerini veya tehlike odalarını çözmeye yardımcı olmak için üretilen eşyaları etkilemez.

items.trinkets.eyeofnewt.name=semender gözü
items.trinkets.eyeofnewt.desc=Bu altın ve siyah semender gözü, artık bir tılsım haline getirilmiş yaygın bir malzemedir. Göz, bir şeyleri başka şekillerde görmenize izin vermek karşılığında görüşünüzü azaltıyor gibi görünüyor.
items.trinkets.eyeofnewt.typical_stats_desc=Tipik olarak bu tılsım, görüş mesafeni _%1$s%%_ kadar düşürecek, fakat diğer yandan _%2$d_ karo yakınındaki düşmanlar için sana zihin görüşü sağlayacak.
items.trinkets.eyeofnewt.stats_desc=Bu seviyede iken bu tılsım senin görüş seviyeni _%1$s%%_ arttırır, ama ayrıca senin düşmanlar üzerindeki akıl okuma genişliğini _%2$d_ yapar.

items.trinkets.ferrettuft.name=Gelincik püskülü
items.trinkets.ferrettuft.desc=Limon yeşili bir kurdeleyle bağlanmış, ipeksi beyaz gelincik kürkünden yapılmış bir tutam. Gelincikler çeviklikleri, yaramazlıkları ve dürüstlükten yoksun olmalarıyla bilinirler. Bu gücün bir kısmı, bu tılsımdan yayılıyor gibi görünüyor ve yakınındaki her şeyden kaçmayı kolaylaştırıyor.
items.trinkets.ferrettuft.typical_stats_desc=Tipik olarak bu tılsım tüm karakterlerin kaçışını _%%%1$s_ artırır.
items.trinkets.ferrettuft.stats_desc=Mevcut seviyesinde bu tılsım tüm karakterlerin kaçışını _%%%1$s_ artırır.

items.trinkets.mimictooth.name=mimik dişi
items.trinkets.mimictooth.desc=Bu büyük ve keskin diş çok mutsuz bir taklitçiden alınmış olmalı. Görünüşe göre zindandaki taklitçileri daha yaygın ve daha tehlikeli yapıyor.
items.trinkets.mimictooth.typical_stats_desc=Tipik olarak bu tılsım bütün taklitçi çeşitlerini _%1$sx_ daha yaygın ve görmesini daha zor yapar, ama ayrıca düşürdükleri eşyalarıda arttırır. Her zindan katı _%2$s%%_ ihtimalle daha gizli bir abanoz taklitçi bulundurur.
items.trinkets.mimictooth.stats_desc=Tipik olarak bu tılsım bütün mimik çeşitlerini _%1$sx_ daha yaygın ve görmesini daha zor yapar, ama ayrıca düşürdükleri eşyalarıda arttırır. Her zindan katı _%2$s%%_ ihtimalle  extra gizli bir mimik bulundurur.

items.trinkets.mossyclump.name=yosun yığını
items.trinkets.mossyclump.desc=Bu ıslak yosun kümesi, ne kadar sıkarsanız sıkın nemini koruyor gibi görünüyor. Zindanın kendisine sihirli bir şekilde bağlı gibi görünüyor, bu da çim ve suyun ortaya çıkmasını daha olası hale getiriyor.
items.trinkets.mossyclump.typical_stats_desc=Bu tılsım genellikle temasız zeminlerin _%%%d_ oranındaki kısmının su ya da çimenle dolmasına neden olur.\n\nBu tılsımın yükseltilmesi daha fazla enerjiye mal olur.
items.trinkets.mossyclump.stats_desc=Mevcut seviyesinde bu tılsım, temasız zeminlerin _%%%d_ oranında su ya da çimenle dolmasını sağlayacaktır.\n\nBu tılsımın yükseltilmesi daha fazla enerjiye mal olur.

items.trinkets.parchmentscrap.name=parşömen parçası
items.trinkets.parchmentscrap.desc=Bu küçük parşömen parçası bir parşömene aitmiş gibi görünüyor. Büyüsünün bir kısmını korumuş ve zindanda bulunan silah ve zırhları etkiliyor gibi görünüyor.
items.trinkets.parchmentscrap.typical_stats_desc=Tipik olarak bu tılsım, büyüleri ve glifleri _%d kat_ daha yaygın hale getirirken, silahlar ve zırhlar üzerindeki lanetleri _%s kat_ daha yaygın hale getirir. Asalar, yüzükler veya eserler üzerindeki lanetler bundan etkilenmez.\n\nBu tılsımın yükseltilmesi daha fazla enerjiye mal olur.
items.trinkets.parchmentscrap.stats_desc=Mevcut seviyesinde bu tılsım, büyüleri ve glifleri _%d kat_ daha yaygın hale getirecek ve silahlar ve zırhlar üzerindeki lanetleri _%s kat_ daha yaygın hale getirecektir. Asalar, yüzükler veya eserler üzerindeki lanetler bundan etkilenmez.\n\nBu tılsımın yükseltilmesi daha fazla enerjiye mal olur.

items.trinkets.petrifiedseed.name=taşlaşmış tohum
items.trinkets.petrifiedseed.desc=Bu tohum ya yavaş jeolojik süreçler ya da büyü yoluyla fosilleşmiştir. Tohum, zindanın bitki örtüsünü sihirli bir şekilde etkiliyor gibi görünüyor ve zaman zaman bitki tohumlarını rün taşlarıyla değiştiriyor.
items.trinkets.petrifiedseed.typical_stats_desc=Normal koşullarda bu tılsım, _%1$s%%_ ihtimalle çiğnediğin otların tohum yerine rün taşı düşürmesini sağlar, ayrıca yüksek çalıların eşya düşürme ihtimalini _%2$s%%_  artırır.
items.trinkets.petrifiedseed.stats_desc=Bu tılsım mevcut seviyesinde, _%1$s%%_ ihtimalle çiğnenmiş otların tohumlar yerine rün taşlarını düşürmesine ve aynı zamanda _%2$s%%_ ihtimalle yüksek çimlerin daha sık eşya düşürmesine neden olacak.

items.trinkets.ratskull.name=fare kafatası
items.trinkets.ratskull.desc=Bu ürkütücü tılsım, bu zindanda bir şekilde nadir bulunan normal bir farenin kafatasından çok daha büyük değildir. Kafatasının büyülü etkisi, zindanın daha nadir sakinlerini kendine çekiyor ve onların çok daha sık görünmesini sağlıyor gibi görünüyor.
items.trinkets.ratskull.typical_stats_desc=Normal koşullarda bu tılsım, nadir egzotik düşmanların _%dx_ daha fazla ortaya çıkmasını sağlar. Ancak bu kafatası, çekici kristal mimiklerin ve zırhlı heykellerin ortaya çıkmasında sadece yarı yarıya daha az etkilidir.
items.trinkets.ratskull.stats_desc=Mevcut seviyesinde bu tılsım, nadir egzotik düşmanların ortaya çıkma olasılığını _%dx_ artıracaktır. Ancak kafatası kristal taklitçileri ve zırhlı heykelleri cezbetmede yarı yarıya etkilidir.

items.trinkets.saltcube.name=Tuz Küpü
items.trinkets.saltcube.desc=Bu büyük tuz kristali neredeyse mükemmel bir küp şeklinde kesilmiş ve bir şekilde simya kabındaki suyun yarısını eritmek yerine boşaltmayı başarmış. Görünüşe göre yediğiniz yiyecekleri sihirli bir şekilde kurutuyor ve koruyor, aldığınız tokluğu uzatıyor, ancak aynı zamanda açlıktan kıvranmadığınız da sağlığınızın yenilenmesini de azaltıyor.
items.trinkets.saltcube.typical_stats_desc=Genellikle bu tılsım acıkmadan önceki süreyi _%%%1$s_ oranında artırır, ancak zemin kilitli olmadığı sürece sağlık yenileme oranınızı da _%%%2$s_ oranında azaltır.
items.trinkets.saltcube.stats_desc=Mevcut seviyesinde bu tılsım, acıkmadan önceki süreyi _%%%1$s_ oranında artırır, ancak zemin kilitli değilse sağlık yenileme oranınızı da _%%%2$s_ oranında azaltır.

items.trinkets.shardofoblivion.name=unutuluş parçası
items.trinkets.shardofoblivion.desc=Bu küçük lanetli metal parçası simya kazanında kaynadıktan sonra değişerek... hiçbir şeyden yapılmaz hale geldi. Işık onun etrafında bükülüyor gibi görünüyor ve siz onu tutmadığınızda olduğu yerde asılı kalıyor. Parça cehaletinizden sihirli bir şekilde güç çekiyor gibi görünüyor, bu yüzden muhtemelen en iyisi bunun hakkında çok fazla düşünmemek.
items.trinkets.shardofoblivion.typical_stats_desc=Tipik olarak bu takı, taktığınız veya yakın zamanda kullandığınız tanımlanamayan her ekipman parçası için düşmanların ganimet düşürme oranını maksimum _%d eşya(lar)_'a kadar %%20 artıracaktır. Parça aynı zamanda ekipmanı tanımlamanızı da engeller, ancak hazır olan eşyaları el ile tanımak için kullanılabilir.
items.trinkets.shardofoblivion.stats_desc=Mevcut seviyesinde bu tılsım, kuşandığınız veya yakın zamanda kullandığınız tanımlanamayan her ekipman parçası için düşmanların ganimet düşürme oranını maksimum _%d eşya(lar)_'a kadar %%20 artıracaktır. Parça aynı zamanda ekipman tanımlamanızı engeller, ancak hazır olan eşyaları el ile tanımlamak için kullanılabilir.
items.trinkets.shardofoblivion.ac_identify=TANIMLA
items.trinkets.shardofoblivion.identify_prompt=Bir eşyayı tanımla
items.trinkets.shardofoblivion.identify_ready=Bir öğe tanımlanmaya hazırdır: %s. Tanımlamak için Unutuluş Parçası'nı üzerinde kullan.
items.trinkets.shardofoblivion.identify_ready_worn=Yıpranmış eşyalarınız artık tanımlanmaya hazır. Tanımlamak için eşyalar üzerinde Unutuluş Parçanızı kullanın.
items.trinkets.shardofoblivion.identify_not_yet=Bu eşya henüz tanımlamaya hazır değil.
items.trinkets.shardofoblivion.identify=Eşyayı tanımladın!
items.trinkets.shardofoblivion$wandusetracker.name=Tanımlanmamış asa kullanıldı.
items.trinkets.shardofoblivion$wandusetracker.desc=Kısa bir süre önce tanımlanamayan bir asa kullandınız, bu da bir süreliğine unutuluş parçası için bir parça kullanılmış tanımlanamayan ekipman olarak sayılır.\n\nKalan hamle sayısı: %s.
items.trinkets.shardofoblivion$thrownusetracker.name=Tanımlanamayan Fırlatılabilir Silah Kullanıldı
items.trinkets.shardofoblivion$thrownusetracker.desc=Son zamanlarda tanımlanmamış bir fırlatılabilir silah kullandın. Bu, bir süreliğine unutuluş parçası için kullanılan tanımlanmamış ekipmandan biri sayılır.\n\nKalan hamle sayısı: %s.

items.trinkets.thirteenleafclover.name=on üç yapraklı yonca
items.trinkets.thirteenleafclover.desc=Her nasılsa simya kabında demlenmek bu yoncanın fazladan yapraklar çıkarmasına neden oldu! Bu tılsımı  şanslı mı yoksa şanssız mı olduğu pek belli değil, belki de bu tılsım şansınızı daha kaotik hale getirecektir?
items.trinkets.thirteenleafclover.typical_stats_desc=Tipik olarak bu tılsım, maksimum hasarı _%%%1$d_ oranında, minimum hasarı ise _%%%2$d_ oranında vermenize neden olur.
items.trinkets.thirteenleafclover.stats_desc=Mevcut seviyesinde bu tılsım, maksimum hasarı _%%%1$d_ oranında ve minimum hasarı _%%%2$d_ oranında vermenize neden olur.

items.trinkets.trapmechanism.name=tuzak mekanizması
items.trinkets.trapmechanism.desc=Zindanın tuzaklarından birinin çekirdek mekanizması, taşınabilmesi için zeminden dikkatlice oyulmuş. Zindanın kendisine sihirli bir şekilde bağlı gibi görünüyor, tehlikeli araziyi daha yaygın hale getiriyor ama aynı zamanda ona olan yakınlığınızı da artırıyor.
items.trinkets.trapmechanism.typical_stats_desc=Tipik olarak bu tılsım, temasız zeminlerin _%%%1$d_ oranının tuzaklarla ya da uçurumlarla dolmasına neden olur. Ek olarak, zindanın gizli tuzaklarının _%%%2$d_ oranındaki kısmı görünür hale gelir.
items.trinkets.trapmechanism.stats_desc=Mevcut seviyesinde bu tılsım, temasız zeminlerin _%%%1$d_ oranında tuzaklarla ya da uçurumlarla dolmasına neden olur. Ayrıca zindandaki gizli tuzakların _%%%2$d_ oranındaki kısmı görünür hale gelir.

items.trinkets.vialofblood.name=Kan şişesi
items.trinkets.vialofblood.desc=Bu ince şişe zindanda yaşayan birinin kanını içeriyor, şişeyi döndürdüğünüzde yavaşça hareket ediyor. Sihirli bir şekilde daha güçlü iyileştirme etkilerini artırıyor gibi görünüyor, ama aynı zamanda bu iyileşmenin gecikmesine de neden oluyor.
items.trinkets.vialofblood.typical_stats_desc=Bu tılsım genellikle iyileşme iksirleri, su tulumları veya sağlık kuyuları içerek kazandığınız toplam sağlığı _%%%1$s_ oranında artırır. Ancak bu iyileştirme etkileri daha yavaş gerçekleşir ve tur başına en fazla _%2$s_ HP yeniler (bu kahraman seviyesiyle ölçeklenir).
items.trinkets.vialofblood.stats_desc=Mevcut seviyesinde bu tılsım, iyileşme iksirleri, su tulumları veya sağlık kuyuları içerek kazandığınız toplam sağlığı _%%%1$s_ oranında artıracaktır. Bununla birlikte, bu iyileştirme etkileri daha yavaş gerçekleşecek ve tur başına en fazla _%2$s_ HP yenileyecektir (bu kahraman seviyesiyle ölçeklenir).

items.trinkets.wondrousresin.name=harikulade reçine
items.trinkets.wondrousresin.desc=Bu parıldayan mavi reçine, lanetli bir asanın büyüsünün damıtılmış özüne sahip gibi görünüyor. Simya kabından gelen büyü onu biraz dengelemiş gibi görünüyor ve şimdi asalarınızı etkiliyor.
items.trinkets.wondrousresin.typical_stats_desc=Tipik olarak bu tılsım, lanetli asa etkilerini zamanın _%%%1$s_ oranında nötr veya pozitif olmaya zorlayacak ve lanetsiz asaların zamanın _%%%2$s_ oranında ek bir nötr veya pozitif lanetli zap atmasına neden olacaktır.\n\nBu tılsımın yükseltilmesi daha büyük miktarda enerjiye mal olur.
items.trinkets.wondrousresin.stats_desc=Mevcut seviyesinde bu tılsım, lanetli asa etkilerini zamanın _%%%1$s_ oranında nötr veya pozitif olmaya zorlayacak ve lanetsiz asaların zamanın _%%%2$s_ oranında ek bir nötr veya pozitif lanetli zap atmasına neden olacaktır.\n\nBu tılsımın yükseltilmesi daha büyük miktarda enerjiye mal olur.

items.trinkets.trinketcatalyst.name=büyülü katalizör
items.trinkets.trinketcatalyst.window_title=tılsım oluştur
items.trinkets.trinketcatalyst.window_text=Katalizörü eklediğinde su parlamaya başlar. Yakında bulunan bazı eşyalar, enerjiyle aşılanarak sihirli bir tılsıma dönüştürülebilir.
items.trinkets.trinketcatalyst.desc=Bu büyülü altın tozu topu, zindanın karanlığında ışıltıyla parıldar. Bu katalizör, az miktarda simyasal enerjiyle birlikte simya kazanında kullanılarak benzersiz bir tılsım üretmek için kullanılabilir.\n\nTılsımlar, zindanı ya da içindekileri az da olsa değiştiren çeşitli etkiler sağlar. Daha fazla enerji kullanılarak güçlendirilebilir ya da etkisinden tamamen vazgeçmek için yere bırakılabilir.
items.trinkets.trinketcatalyst$randomtrinket.name=rastgele tılsım
items.trinkets.trinketcatalyst$randomtrinket.desc=Yakındaki bir eşya, açamadığınız bir kesenin içinde sıkışmış durumda.\n\nSimya işlemi keseyi çözecek, ancak bunu yapana kadar hangi tılsımı alacağınızı bilemeyeceksiniz!

items.trinkets.trinket.discover_hint=Simya yoluyla bir tılsım ürettiğinizde bu eşyanın bir seçenek olma şansı vardır.
items.trinkets.trinket$placeholder.name=tılsım

