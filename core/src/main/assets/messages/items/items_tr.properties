items.armor.armor.seal_attached=Savaşçının kırık mührü bu zırha bağlıdır. Sağlığı yarı seviyenin altına düşmek üzereyken ona _%d kalkan_ sağlar.
items.armor.armor.seal_transfer=Savaşçının kırık mührünün fayda sağlaması için giymekte olduğu zırha takılı olması gerekir. Çıkardığın zırhtan otomatik olarak ayrılıp yerine giyiyor olduğun zırha takılmasını ister misin?
