###misc items
items.amulet.name=yendor'un muskası
items.amulet.ac_end=OYUNU BİTİR
items.amulet.desc=Yendor'un Muskası insan ve cüce türünün bildiği en güçlü eserdir. Parıldayan kristalleri inanılmaz ve harikulade bir güç içerir.
items.amulet.desc_origins=Muskanın kökeni bilinmiyor. Tarih, Cüce uygarlığı tüm teması kesmeden kısa bir süre önce Cücelerin Kralı'nın, eseri keşfettiği için övündüğünü söylüyor. Nasıl buldu? Yog-Dzewa bunu ondan nasıl aldı? Belki de bu sorular başka bir zaman içindir, şimdi önemli olan tek şey ise muska senin!
items.amulet.desc_ascent=Muskanın kökeni bilinmiyor, ama açıkça Yog-Dzewa'nın gücünden büyük ölçüde etkilenmiş. Zindan, sen ilerledikçe Yog'un iradesine boyun eğiyor gibi görünüyor, düşmanları çok daha bol ve güçlü hale getiriyor! Ayrıca muskayı artık etkinleştiremez veya atamazsın, neredeyse lanetliymiş gibi.
items.amulet.ascent_title=Yükseliş
items.amulet.ascent_desc=Muskadan, Yog-Dzewa'nın yayılan büyük ve korkunç gücünü hissetmeye başlıyorsun. Bir ölümlü olarak zindandan geri yükselmek düşündüğünden daha zor olabilir!\n\nMuska ile yükselmeye devam edersen zindan daha tehlikeli hale gelecek, katlar arası ışınlanmalar devre dışı kalacak ve oyunu ancak zindanda yükselirken düşmanları alt ederek kazanabileceksiniz!\n\nBu mücadeleyi başlatmadan yükselmek istiyorsan muskayı şimdilik burada bırakabilir, veya oyunu normal bir şekilde bitirmek için muskayı, yükselmeden önce etkinleştirebilirsin.
items.amulet.ascent_yes=Devam Et!
items.amulet.ascent_no=Şimdilik Dur
items.amulet.discover_hint=Bu eşyayı zindanın en altında bulabilirsin...

items.ankh.name=ankh
items.ankh.ac_bless=KUTSA
items.ankh.bless=Ankh'ı sihirli suyla kutsuyorsun.
items.ankh.desc=Bu kadim ölümsüzlük sembolü, öldükten sonra hayata dönme yeteneği verir. Çoğu eşya öldüğünüz yerde düşer, ancak oraya geri dönerseniz geri alınabilir. Dolu bir su tulumu kullanarak ankh ekstra güçle kutsanabilir.
items.ankh.desc_blessed=Bu antik ölümsüzlük sembolü ölümden sonra yaşama dönüş yeteneğini bahşeder. Ankh kutsanmış ve artık çok daha güçlü. Ankh kendini feda ederek seni ölümcül bir durumdan kurtaracaktır.
items.ankh.discover_hint=Bu eşyayı bir mağazadan satın alabilirsin.

items.arcaneresin.name=gizemli reçine
items.arcaneresin.prompt=Bir asa seç
items.arcaneresin.ac_apply=ÜZERİNDE KULLAN
items.arcaneresin.level_too_high=O asa reçinenin geliştiremeyeceği kadar güçlü.
items.arcaneresin.not_enough=Bunun için yeterli reçineniz yok!
items.arcaneresin.apply=Asanızı reçineyle kaplayarak gücünü artırıyorsunuz!
items.arcaneresin.desc=Bu ince toz mor ve beyaz tonları arasında parıldar. Büyülü enerjiler için bir yükseltici görevi görebilir ve asalara uygulandığında seviyelerini artırabilir!\n\nBir asayı yükseltmek, asanın başlangıç seviyesine bağlı olarak 1, 2 veya 3 reçineye mal olur. Reçine asaları en fazla +3'e kadar yükseltebilir.\n\nAncak reçine yükseltmeleri diğer yükseltme kaynakları (yükseltme parşömenleri gibi) tarafından geçersiz kılınır ve bir asa Büyücünün asasına aşılanırken geçerli değildir.
items.arcaneresin.discover_hint=Bu eşyayı simya ile üretebilirsin.

items.brokenseal.name=kırık mühür
items.brokenseal.ac_affix=İLİŞTİR
items.brokenseal.prompt=Bir zırh seç
items.brokenseal.unknown_armor=Önce o zırhın lanetli olup olmadığını belirlemelisiniz.
items.brokenseal.cursed_armor=Mühür lanetli bir zırha takılamaz.
items.brokenseal.affix=Mührü zırhına taktın!
items.brokenseal.desc=Zırha cesaretin simgesi olarak iliştirilmiş bir mum mührü.\nOrtasında silikleşmiş bir koruma rünü oyuludur ve mührün ortasından geçen bir çatlakla ikiye ayrılmıştır.\n\nSavaşçının memleketinden bir hatıra olan bu mühür, ona direnç kazandırır. Mührü taktığı sürece, savaşçının sağlığı yarıya ya da daha altına düşmek üzereyken anında kalkan kazanır.\n\nMühür _zırha iliştirilebilir_ ve zırhlar arasında taşınabilir. Mühür ilişik durumdayken zırha uygulanmış tek bir yükseltmeyi de yanında taşıyabilir.
items.brokenseal.inscribed=Fok bir _%s_ ile yazıldı.
items.brokenseal.choose_title=Bir Rün Seçin
items.brokenseal.choose_desc=Hem bu zırh hem de kırık mühür bir kabartma taşıyor. Hangi kabartmanın saklanması gerektiğini seçin.\n\nZırh Kabartması: %1$s\nKırık Mühür Kabartması: %2$s\n\nŞu anda zırhın üzerinde bulunan kabartmayı seçerseniz, mührün bunu daha sonra aktaramayacağını unutmayın.
items.brokenseal.discover_hint=Kahramanlardan birisi bu eşyayla başlar.
items.brokenseal$warriorshield.name=Savaşçı Kalkanı
items.brokenseal$warriorshield.desc_active=Savaşçının kırık mührü şu anda ona direnç kazandırıyor ve sağlığına ek olarak kalkan sağlıyor. Kalkan devreye girdikten sonra, yeniden kullanılmadan önce bir bekleme süresi başlar.\n\nBu kalkan zamanla azalmaz, ancak birkaç tur boyunca yakında düşman yoksa sona erer. Kalkan sona erdiğinde, kullanılmamış kalkan miktarı bekleme süresini azaltır, en fazla %%50 oranında.\n\nKalan kalkan: %1$d.\n\nMevcut bekleme süresi: %2$d.
items.brokenseal$warriorshield.desc_cooldown=Savaşçı kısa süre önce kırılan mühründen kalkan kazanmıştır ve kalkan etkisinden tekrar yararlanana kadar beklemelidir.\n\nKalan hamle sayısı: %d.
items.brokenseal$warriorshield.desc_negative_cooldown=Savaşçının kalkanının bekleme süresi şu anda negatiftir, yani kalkanı etkinleştiğinde bekleme süresi normalde 150 turdan daha az olacaktır. Kalkanın bekleme süresi -150 tura kadar düşürülebilir, bu da kalkan etkinleştirildiğinde hemen tekrar kullanılabilir hale geleceği anlamına gelir.\n\nMevcut bekleme süresi: %d.

