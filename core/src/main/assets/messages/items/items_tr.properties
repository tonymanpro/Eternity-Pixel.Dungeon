items.kindofweapon.equip_cursed=Elin silahın etrafında istemsizce sıkılaşıyor.
items.kindofweapon.which_equip_msg=Bu silahı hangi silah yuvasına takmak istersiniz?\n\nŞampiyon doğrudan birincil silahı ile saldırır, ancak her iki silahın da yeteneğini kullanabilir. Her iki silah da aynı şarj sayısını paylaşır.\n\nŞampiyon ayrıca, birincil ve ikincil silahını anında değiştirebilir.
