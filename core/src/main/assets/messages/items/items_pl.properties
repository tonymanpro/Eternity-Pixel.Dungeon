###armor curses
items.armor.curses.antientropy.name=%s anty-entropii
items.armor.curses.antientropy.desc=Klątwa anty-entropii działa przeciw siłom wszechświata, wyciągając energię z atakującego i przesyłając ją na noszącego zbroję. Na krótko podpala użytkownika, zamrażając wszytko wokół!

items.armor.curses.bulk.name=%s objętości
items.armor.curses.bulk.desc=Zbroje objętości wydają się większe i bardziej okazałe, ale nie oferują lepszej ochrony. Co gorsza, ich większy rozmiar sprawia, że zmieszczenie się w drzwiach jest znacznie utrudnione.

items.armor.curses.corrosion.name=%s korozji
items.armor.curses.corrosion.desc=Zbroja korozji jest zdolna do wyrzucania żrącego płynu, pokrywając wszystko w otoczeniu lepką, kwaśną mazią.

items.armor.curses.displacement.name=%s przemieszczenia
items.armor.curses.displacement.desc=Klątwa przemieszczenia próbuje przemieścić noszącego ją w bezpieczne miejsce, gdy jest atakowany. Niestety, jest ona nieco zbyt skuteczna i losowo przemieszcza użytkownika po piętrze lochu.

items.armor.curses.metabolism.name=%s metabolizmu
items.armor.curses.metabolism.desc=Klątwa metabolizmu bezpośrednio przeistacza sytość w punkty życia, gdy bohater zostanie zraniony. Powoduje szybszą regenerację życia w zamian za częstsze odczuwanie głodu.

items.armor.curses.multiplicity.name=%s zwielokrotnienia
items.armor.curses.multiplicity.desc=Zbroja przeklęta zwielokrotnieniem zawiera niebezpieczną magię duplikacji. Czasami stworzy lustrzany obraz ubierającego, lecz równie dobrze może powielić atakującego!

items.armor.curses.overgrowth.name=%s zarośnięcia
items.armor.curses.overgrowth.desc=Zbroje zarośnięcia są pokryte różnoraką roślinnością. Wygląda to ciekawie, ale nie czyni to zbroi lepszą, a magiczne rośliny aktywują swoje efekty w nieprzewidywalny sposób podczas walki!

items.armor.curses.stench.name=%s smrodu
items.armor.curses.stench.desc=Zbroja przeklęta smrodem uwolni opary mdlącego gazu, który zagraża wszystkiemu, co tylko zostanie schwytane wewnątrz obłoku.


###glyphs
items.armor.glyphs.affection.name=%s zauroczenia
items.armor.glyphs.affection.desc=Ten potężny glif manipuluje umysłem atakujących, chwilowo ich zauroczając.

items.armor.glyphs.antimagic.name=%s antymagii
items.armor.glyphs.antimagic.desc=Ten potężny glif pozwala zbroi chronić swojego właściciela przed atakami magicznymi jak i fizycznymi. Rodzaj i krąg zbroi nie ma wpływu na magiczną ochronę.

items.armor.glyphs.brimstone.name=%s siarki
items.armor.glyphs.brimstone.desc=Ten glif chroni nosiciela i jego przedmioty przed ogniem, kompletnie niwelując obrażenia i negatywne efekty.

items.armor.glyphs.camouflage.name=%s kamuflażu
items.armor.glyphs.camouflage.desc=Ten glif umożliwia ubierającemu wtopienie się w wysoką trawę, dając mu czasową niewidzialność.

items.armor.glyphs.entanglement.name=%s splątania
items.armor.glyphs.entanglement.desc=Ten glif wytworzy barierę z ziemi wchłaniającą obrażenia, która ulegnie zniszczeniu w momencie poruszenia.

items.armor.glyphs.flow.name=%s przepływu
items.armor.glyphs.flow.desc=Ten glif manipuluje przepływem wody wokół ubierającego, sprawiając że porusza się w niej znacznie szybciej.

items.armor.glyphs.obfuscation.name=%s zaciemniania
items.armor.glyphs.obfuscation.desc=Ten glif zlewa noszącego z otoczeniem, czyniąc go znacznie trudniejszym do wykrycia.

items.armor.glyphs.potential.name=%s potencjału
items.armor.glyphs.potential.desc=Ten glif zbiera energię z uderzeń przeciwników, która jest przekazywana do różdżek noszącego.

items.armor.glyphs.repulsion.name=%s odpychania
items.armor.glyphs.repulsion.desc=Ten glif wykorzystuje siłę uderzeń napastników przeciwko nim samym, odpychając ich.

items.armor.glyphs.stone.name=%s kamienia
items.armor.glyphs.stone.desc=Ten glif otacza zbroję ciężkimi magicznymi kamieniami które uniemożliwiają uniki, ale blokują obrażenia proporcjonalnie do uników.

items.armor.glyphs.swiftness.name=%s szybkości
items.armor.glyphs.swiftness.desc=Ten glif zwiększa prędkość noszącego, gdy nie ma wrogów w jego pobliżu.

items.armor.glyphs.thorns.name=%s cierni
items.armor.glyphs.thorns.desc=Ten potężny glif rani atakujących, wywołując ich powolne wykrwawianie po zaatakowaniu nosiciela.

items.armor.glyphs.viscosity.name=%s opóźnienia
items.armor.glyphs.viscosity.deferred=opóźnione %d
items.armor.glyphs.viscosity$defereddamage.name=opóźnione obrażenia
items.armor.glyphs.viscosity$defereddamage.ondeath=Zabiły cię opóźnione obrażenia...
items.armor.glyphs.viscosity$defereddamage.rankings_desc=Zabity przez opóźnione obrażenia
items.armor.glyphs.viscosity$defereddamage.desc=Obrażenia są zadawane powoli wraz z upływem czasu, a nie natychmiast.\n\nPozostałe opóźnione obrażenia: %d.
items.armor.glyphs.viscosity.desc=Ten glif jest zdolny przetrzymać obrażenia zadawane noszącemu i oddać je powoli zamiast wszystko na raz.



###armor
items.armor.armor.ac_detach=ODŁĄCZ
items.armor.armor.detach_seal=Zdejmujesz pieczęć ze swojej zbroi.
items.armor.armor.equip_cursed=Zbroja boleśnie obkurcza się na tobie.
items.armor.armor.identify=Nosisz swoją zbroję wystarczająco długo, by ją zidentyfikować.
items.armor.armor.hardening_gone=Ta zbroja się zużyła, nie jest już zahartowana!
items.armor.armor.incompatible=Oddziaływanie różnych typów magii wymazało glif na tej zbroi!
items.armor.armor.curr_absorb=Ta zbroja _%1$d. kręgu_ blokuje _%2$d-%3$d obrażeń_ i wymaga _%4$d siły_, by należycie jej używać.
items.armor.armor.avg_absorb=Zazwyczaj podobne zbroje _%1$d. kręgu_ blokują _%2$d-%3$d obrażeń_ i wymagają _%4$d siły_, by należycie ich używać.
items.armor.armor.too_heavy=Z powodu twojej niewystarczającej siły, założenie tej zbroi zmniejszy twoją zdolność do ruchu, uniku oraz obrony.
items.armor.armor.probably_too_heavy=Ta zbroja prawdopodobnie jest dla ciebie za ciężka.
items.armor.armor.excess_str=Dzięki twojej nadmiarowej sile jesteś _bardziej skłonny do uników_ nosząc tę zbroję.
items.armor.armor.evasion=Jest rozszerzony by wzmocnić _uniki._
items.armor.armor.defense=Jest rozszerzony by wzmocnić _obronę._
items.armor.armor.inscribed=na tej zbroi jest _%s_.
items.armor.armor.glyph_hardened=Ten przedmiot został _zahartowany_.
items.armor.armor.hardened_no_glyph=Ta zbroja została _zahartowana_, ale obecnie nie jest zarysowana glifem.
items.armor.armor.cursed_worn=Ta zbroja jest przeklęta, nie jesteś w stanie jej ściągnąć.
items.armor.armor.cursed=Czujesz złowrogą magię promieniującą z tej zbroi.
items.armor.armor.weak_cursed=Pomimo klątwy jesteś w stanie zdjąć tę zbroję.
items.armor.armor.not_cursed=Ta zbroja jest wolna od czarnej magii.
items.armor.armor.seal_attached=Złamana pieczęć Wojownika jest umieszczona na tym pancerzu. Gdy będzie miał zostać zraniony poniżej połowy zdrowia, otrzyma on _%d osłony_.
items.armor.armor.seal_transfer=Złamana pieczęć wojownika musi być przypięta do noszonej przez niego zbroi, aby z niej korzystać. Czy chcesz automatycznie odpiąć pieczęć ze zbroi, którą zdejmujesz i przypiąć ją do zbroi, którą zakładasz?
items.armor.armor.seal_transfer_yes=Tak
items.armor.armor.seal_transfer_no=Nie
items.armor.armor$glyph.glyph=glif
items.armor.armor$glyph.killed=Zabił cię %s...
items.armor.armor$glyph.rankings_desc=Zabity przez magię glifu
items.armor.armor$glyph.discover_hint=Ten efekt może być znaleziony losowo w lochu na przedmiocie lub nałożony samodzielnie na przedmiot.

items.armor.classarmor.ac_ability=WYBIERZ UMIEJĘTNOŚĆ
items.armor.classarmor.ac_transfer=PRZENIEŚ
items.armor.classarmor.no_ability=Twoja zbroja obecnie nie ma zdolności, powinieneś jedną wybrać!
items.armor.classarmor.not_equipped=Musisz nosić tę zbroję by używać jej specjalnych mocy!
items.armor.classarmor.low_charge=Pancerz nie ma wystarczająco dużo ładunku, aby wykorzystać jego specjalną moc!
items.armor.classarmor.charge_use=Użycie tej umiejętności zużyje _%s_ ładunku.
items.armor.classarmor.transfer_title=Przenieś Zbroję
items.armor.classarmor.transfer_desc=Magia pochodząca z korony króla krasnoludów może być przeniesiona na inny pancerz. Zbroja poprzednio związana z mocą korony zostanie utracona.
items.armor.classarmor.transfer_prompt=Wybierz zbroję
items.armor.classarmor.transfer_cancel=Anuluj
items.armor.classarmor.transfer_complete=Właściwości bohaterskiej zbroi zostały przeniesione!
items.armor.classarmor.discover_hint=Ten przedmiot możesz znaleźć po pokonaniu bossa na piętrze 20 za pomocą pewnego bohatera.

items.armor.clericarmor.name=święte szaty bohatera
items.armor.clericarmor.desc=Nosząc to połączenie zbroi płytowej i tkaniny, Kleryk może użyć specjalnej umiejętności.

items.armor.clotharmor.name=płócienna zbroja
items.armor.clotharmor.desc=Ta lekka zbroja zapewnia podstawową ochronę.
items.armor.clotharmor.discover_hint=Z tym przedmiotem zaczyna jeden z bohaterów.

items.armor.duelistarmor.name=napierśnik Fechmistrzyni
items.armor.duelistarmor.desc=Nosząc ten napierśnik i pelerynę, Fechmistrzyni może użyć specjalnej umiejętności.

items.armor.huntressarmor.name=opończa Łowczyni
items.armor.huntressarmor.no_enemies=Nie widać przeciwników
items.armor.huntressarmor.desc=Nosząc tę pelerynę, Łowczyni może użyć specjalnej umiejętności.

items.armor.leatherarmor.name=skórzana zbroja
items.armor.leatherarmor.desc=Pancerz zrobiony z wyprawionej zwierzęcej skóry. Co prawda nie jest tak lekki, jak płócienna kamizelka, ale zapewnia lepszą ochronę.

items.armor.magearmor.name=szata Maga
items.armor.magearmor.desc=Nosząc tę cudowną szatę, Mag może użyć specjalnej umiejętności.

items.armor.mailarmor.name=kolczuga
items.armor.mailarmor.desc=Połączone metalowe kółka tworzą mocną, ale elastyczną zbroję.

items.armor.platearmor.name=zbroja płytowa
items.armor.platearmor.desc=Olbrzymie płyty stali zostały połączone w zbroję, zapewniającą niezrównaną ochronę każdemu bohaterowi zdolnemu do dźwigania jej ciężaru.

items.armor.roguearmor.name=strój Łotrzyka
items.armor.roguearmor.desc=Nosząc ten ciemny strój, Łotrzyk może użyć specjalnej umiejętności.

items.armor.scalearmor.name=zbroja łuskowa
items.armor.scalearmor.desc=Metalowe łuski wszyte w skórzaną kamizelkę tworzą skuteczny, elastyczny pancerz.

items.armor.warriorarmor.name=pancerz płytowy Wojownika
items.armor.warriorarmor.desc=Nosząc ten ciężki pancerz płytowy, Wojownik może użyć specjalnej umiejętności.



###artifacts
items.artifacts.alchemiststoolkit.name=zestaw alchemika
items.artifacts.alchemiststoolkit.ac_brew=UWARZ
items.artifacts.alchemiststoolkit.ac_energize=WZMOCNIJ
items.artifacts.alchemiststoolkit.not_ready=Zestaw alchemiczny jeszcze nie załadował się.
items.artifacts.alchemiststoolkit.cursed=Przeklęty zestaw alchemiczny nie pozwala ci na używanie alchemii!
items.artifacts.alchemiststoolkit.need_energy=Potrzebujesz co najmniej 6 kryształów energii, by to zrobić.
items.artifacts.alchemiststoolkit.energize_desc=Każde 6 kryształów energii zapewnia zestawowi poziom, który zwiększa szybkość wytwarzania energii oraz tempo ponownego przygotowania go po odłożeniu.\n\nJak dużo energii chciałbyś użyć?
items.artifacts.alchemiststoolkit.energize_1=6 energii: +1 poziom
items.artifacts.alchemiststoolkit.energize_all=%1$d energii: +%2$d poziomy
items.artifacts.alchemiststoolkit.desc=Ten zestaw zawiera wiele odczynników, ziół, a także małą fiolkę do mieszania. Dzięki nim możesz dowolnym momencie zostać alchemikiem. Fiolka zawiera coś, co wygląda jak upłynnione kryształy alchemicznej energii.
items.artifacts.alchemiststoolkit.desc_cursed=Przeklęty zestaw alchemiczny przyczepił się do twego boku, i nie pozwala używać alchemii.
items.artifacts.alchemiststoolkit.desc_warming=Zestaw alchemiczny rozgrzewa się i wkrótce będzie gotowy do użycia.
items.artifacts.alchemiststoolkit.desc_hint=Założony zestaw alchemiczny powoli wytwarza alchemiczną energię w miarę, jak zyskujesz doświadczenie. Wygląda na to, że mieszanka w fiolce może być ulepszona poprzez dodawanie do niej kryształów energii.

items.artifacts.artifact.cannot_wear_two=Nie możesz nosić dwóch takich samych artefaktów.
items.artifacts.artifact.equip_cursed=Artefakt boleśnie wiąże się z tobą.
items.artifacts.artifact.curse_known=Czujesz złowrogą magię promieniującą z tego artefaktu.
items.artifacts.artifact.not_cursed=Ten artefakt jest wolny od czarnej magii.
items.artifacts.artifact.need_to_equip=Musisz założyć twój artefakt aby to uczynić.

items.artifacts.capeofthorns.name=płaszcz cierni
items.artifacts.capeofthorns.desc=Blachy po zniszczonym DM-300 ułożyły się tworząc sztywny płaszcz. Wydaje się, że zawiera on jakąś głęboką energię, może ma on jakieś moce DM-300?
items.artifacts.capeofthorns.desc_inactive=Płaszcz spoczywając na twoich ramionach dodaje ci otuchy, zdaje się, że zyskuje on energię z obrażeń, które otrzymujesz.
items.artifacts.capeofthorns.desc_active=Płaszcz wyzwala zmagazynowaną energię promieniując ochronną mocą.
items.artifacts.capeofthorns$thorns.inert=Twój płaszcz znów staje się obojętny.
items.artifacts.capeofthorns$thorns.radiating=Twój płaszcz zaczyna promieniować energią, czujesz się chroniony!
items.artifacts.capeofthorns$thorns.levelup=Twój płaszcz nabiera mocy!
items.artifacts.capeofthorns$thorns.name=ciernie
items.artifacts.capeofthorns$thorns.desc=Twoja peleryna promieniuje energią, która otacza cię polem obronnym!\n\nCałe zadawane ci obrażenia są niwelowane podczas działania efektu cierni. Dodatkowo, gdy napastnik jest obok ciebie, niwelowane obrażenia są odbijane w jego stronę.\n\nPozostałe rundy efektu cierni: %s.

items.artifacts.chaliceofblood.name=czara krwi
items.artifacts.chaliceofblood.ac_prick=UKŁUJ SIĘ
items.artifacts.chaliceofblood.yes=Tak, wiem co robię.
items.artifacts.chaliceofblood.no=Nie, zmieniłem zdanie.
items.artifacts.chaliceofblood.prick_warn=Czara odbiera coraz więcej życiodajnej energii z każdym użyciem, lecz w zamian zwiększa twoją naturalną regenerację zdrowia.\n\nUkłucie się zada _%1$d-%2$d obrażeń_, choć wartość ta może zostać zmniejszona przez _fizyczną i magiczną obronę lub redukcję obrażeń_. Bez uwzględnienia efektów redukujących obrażenia, ukłucie się ma _%3$s%% szans_ na odebranie całej twojej energii życiowej.\n\nJesteś pewien, że chcesz ofiarować jej więcej życiodajnej energii?
items.artifacts.chaliceofblood.onprick=Dźgnąłeś się i twoja esencja życia spłynęła do czary.
items.artifacts.chaliceofblood.ondeath=Czara wyssała z ciebie całą esencję życia...
items.artifacts.chaliceofblood.desc=Ta błyszcząca srebrna czara jest nietypowo przyozdobiona ostrymi brylantami u brzegu.
items.artifacts.chaliceofblood.desc_cursed=Przeklęta czara przyczepiła się do ciebie i wstrzymuje twoją umiejętność regeneracji zdrowia.
items.artifacts.chaliceofblood.desc_1=Kiedy trzymasz czarę czujesz dziwny pociąg, aby pociąć się na jej ostrych brylantach.
items.artifacts.chaliceofblood.desc_2=Trochę twojej krwi zostało przelane do czary, czujesz, jak karmi cię ona powoli energią życia, przyśpieszając twoją naturalną regenerację. Wciąż pragniesz pociąć się za pomocą jej brzegu, mimo wiedzy, że będzie to bolesne.
items.artifacts.chaliceofblood.desc_3=Czara jest wypełniona po brzegi twoją esencją życia. Czujesz jak oddaje ci ją z powrotem.

items.artifacts.cloakofshadows.name=opończa cieni
items.artifacts.cloakofshadows.ac_stealth=SKRADAJ SIĘ
items.artifacts.cloakofshadows.cooldown=Pozostałe tury do naładowania magii opończy: %d.
items.artifacts.cloakofshadows.cursed=Nie możesz użyć przeklętej opończy.
items.artifacts.cloakofshadows.no_charge=Twoja opończa nie odnowiła się wystarczająco, by była zdolna do użytku.
items.artifacts.cloakofshadows.desc=Bezcenna magiczna opończa, która została sprzed laty skradziona z królewskiej zbrojowni przez łotrzyka. Jest w stanie skutecznie ukryć właściciela na krótki okres czasu, przez co staje się niewidzialny.\n\nIm częściej jest używana, tym bardziej rośnie w siłę, pozwalając łotrzykowi stawać się niewidzialnym częściej i na dłuższe okresy czasu.
items.artifacts.cloakofshadows.discover_hint=Z tym przedmiotem zaczyna jeden z bohaterów.
items.artifacts.cloakofshadows$cloakstealth.no_charge=Twoja opończa się wyładowała.
items.artifacts.cloakofshadows$cloakstealth.levelup=Twoja opończa nabiera mocy!
items.artifacts.cloakofshadows$cloakstealth.name=zamaskowany
items.artifacts.cloakofshadows$cloakstealth.desc=Okrycie się opończą cieni zapewnia ci niewidzialność. Pozostaniesz zamaskowany dopóki nie anulujesz użycia lub twoja opończa się nie wyładuje.\n\nPodczas twej niewidzialności przeciwnicy nie mogą za tobą podążać ani atakować. Ataki fizyczne oraz magiczne efekty (takie jak różdżki i zwoje) natychmiastowo anulują ten efekt.\n\nPozostałe tury do zużycia ładunku: %d.

items.artifacts.driedrose.name=uschnięta róża
items.artifacts.driedrose.ac_summon=PRZYWOŁAJ
items.artifacts.driedrose.ac_direct=KOMENDA
items.artifacts.driedrose.ac_outfit=STRÓJ
items.artifacts.driedrose.spawned=Już przywołałeś ducha.
items.artifacts.driedrose.no_charge=Róża nie jest jeszcze w pełni naładowana.
items.artifacts.driedrose.cursed=Nie możesz użyć przeklętej róży.
items.artifacts.driedrose.no_space=W pobliżu nie ma wolnego miejsca.
items.artifacts.driedrose.charged=Róża jest w pełni naładowana!
items.artifacts.driedrose.desc=Czy to ta róża, o której wspomniał duch zanim zniknął? Wygląda na to, że ma w sobie jakieś duchowe moce. Możliwe, że da się nią przywołać tego zmarłego wojownika.
items.artifacts.driedrose.desc_no_quest=Zeschła róża, która w jakiś sposób wciąż się trzyma pomimo jej wieku.\n\nWygląda na to, że ma jakąś duchową moc, lecz w tej chwili nie masz pojęcia, jak jej użyć.
items.artifacts.driedrose.desc_hint=Wygląda na to, że brakuje jej kilku płatków. Może ponowne ich doczepienie wzmocni różę?
items.artifacts.driedrose.desc_cursed=Przeklęta róża jest przywiązana do twojej ręki, czujesz od niej niepokojący chłód.
items.artifacts.driedrose.desc_weapon=Broń ducha: %s
items.artifacts.driedrose.desc_armor=Zbroja ducha: %s
items.artifacts.driedrose.desc_strength=Siła ducha: %s
items.artifacts.driedrose$petal.name=wysuszony płatek
items.artifacts.driedrose$petal.no_rose=Nie masz róży, do której mógłbyś doczepić płatek.
items.artifacts.driedrose$petal.no_room=Nie ma już miejsca dla tego płatka, więc go wyrzucasz.
items.artifacts.driedrose$petal.maxlevel=Róża jest pełna!
items.artifacts.driedrose$petal.levelup=Dodałeś płatek do róży.
items.artifacts.driedrose$petal.desc=Delikatny, wysuszony płatek, który jakoś przetrwał aż tak daleko wgłąb lochu.
items.artifacts.driedrose$wndghosthero.title=Wyposażenie ducha
items.artifacts.driedrose$wndghosthero.desc=Duch sam w sobie jest słaby, lecz jest on wystarczająco materialny, aby dzierżyć broń i zbroję. Może używać tych przedmiotów tak jak ty.\n\nDuch aktualnie może być wyposażony w przedmioty wymagające do _%d siły_.
items.artifacts.driedrose$wndghosthero.weapon_prompt=Wybierz broń
items.artifacts.driedrose$wndghosthero.armor_prompt=Wybierz zbroję
items.artifacts.driedrose$wndghosthero.cant_unique=Duch nie może używać unikatów.
items.artifacts.driedrose$wndghosthero.cant_cursed=Duch może używać tylko ekwipunku, co do którego masz pewność, że nie jest przeklęty.
items.artifacts.driedrose$wndghosthero.cant_strength_unknown=Duch może nie być wystarczająco silny, by tego użyć.
items.artifacts.driedrose$wndghosthero.cant_strength=Duch nie jest wystarczająco silny, by tego użyć.

##ghost hero
items.artifacts.driedrose$ghosthero.name=smutny duch
items.artifacts.driedrose$ghosthero.def_verb=unik
items.artifacts.driedrose$ghosthero.discover_hint=Tę postać możesz spotkać za pomocą pewnego artefaktu.

items.artifacts.driedrose$ghosthero.hello=%s! Witaj ponownie.
items.artifacts.driedrose$ghosthero.introduce=Moja dusza jest przywiązana do tej róży, to był mój skarb, prezent od mojego ukochanego, osamotnionego na powierzchni.\n\nNie mogę do niego wrócić, ale dzięki tobie mam drugą szansę by skończyć moją podróż. Kiedy będę w stanie, odpowiem na twoje wezwanie i będę walczyć u twojego boku.\n\nTak długo, jak będziesz mieć tę różę, usłyszę twój głos, więc możesz jej użyć by kierować moimi działaniami z oddali.\n\nByć może uda ci się tam, gdzie ja zawiodłem...

items.artifacts.driedrose$ghosthero.dialogue_sewers_1=Te kanały były kiedyś bezpieczne, ludzie bez problemów żyli tutaj w zimę.
items.artifacts.driedrose$ghosthero.dialogue_sewers_2=Ciekawe, co się stało z patrolami strażników, czyżby się poddali?
items.artifacts.driedrose$ghosthero.dialogue_sewers_3=Mam nadzieję, że moja rodzina na powierzchni jest cała i zdrowa.
items.artifacts.driedrose$ghosthero.dialogue_sewers_4=Strażnicy nie mogli pokonać tych potworów, ale może my możemy.
items.artifacts.driedrose$ghosthero.dialogue_sewers_5=Jeśli kanały są takie niebezpiecznie, ciekawi mnie co może być niżej...
items.artifacts.driedrose$ghosthero.dialogue_sewers_6=Co spowodowało że te szczury i kraby urosły do takich dużych rozmiarów?
items.artifacts.driedrose$ghosthero.dialogue_prison_1=Słyszałem opowieści o tym miejscu, nic dobrego.
items.artifacts.driedrose$ghosthero.dialogue_prison_2=To zawsze był bardziej jakiś loch, a nie więzienie.
items.artifacts.driedrose$ghosthero.dialogue_prison_3=Nie mogę sobie wyobrazić, co stało się po tym, jak to miejsce zostało opuszczone.
items.artifacts.driedrose$ghosthero.dialogue_prison_4=Wygląda na to, że i więźniowie, i strażnicy zostali zmienieni w potwory.
items.artifacts.driedrose$ghosthero.dialogue_prison_5=Co może być odpowiedzialne za te wszystkie szkielety?
items.artifacts.driedrose$ghosthero.dialogue_prison_6=Ci ludzie nie musieli tak skończyć...
items.artifacts.driedrose$ghosthero.dialogue_caves_1=Żadnego człowieka czy krasnoluda nie było tutaj już od bardzo dawna.
items.artifacts.driedrose$ghosthero.dialogue_caves_2=Co by spowodowało, że krasnoludy porzuciły kopalnię złota?
items.artifacts.driedrose$ghosthero.dialogue_caves_3=Szkoda, że całe to złoto jest bezużyteczne na powierzchni.
items.artifacts.driedrose$ghosthero.dialogue_caves_4=Kreatury w tym miejscu są wynaturzone, zupełnie jak w kanałach.
items.artifacts.driedrose$ghosthero.dialogue_caves_5=Nawet nietoperze są żądne krwi.
items.artifacts.driedrose$ghosthero.dialogue_caves_6=Nie ma śladu żadnego sprzętu górniczego, czy Krasnoludy wszystko zabrały?
items.artifacts.driedrose$ghosthero.dialogue_city_1=Krasnoludy były pracowite, ale i zachłanne.
items.artifacts.driedrose$ghosthero.dialogue_city_2=A więc metropolia krasnoludzka naprawdę upadła.
items.artifacts.driedrose$ghosthero.dialogue_city_3=Mam nadzieję że na powierzchni nigdy nie będzie tak, jak tu.
items.artifacts.driedrose$ghosthero.dialogue_city_4=Krasnoludy normalnie nie są takie blade.
items.artifacts.driedrose$ghosthero.dialogue_city_5=Nie wiem co gorsze, Krasnoludy czy ich kreacje.
items.artifacts.driedrose$ghosthero.dialogue_city_6=Wygląda na to, że Krasnoludzi też stali się bezmyślnymi stworzeniami.
items.artifacts.driedrose$ghosthero.dialogue_halls_1=Co to za miejsce?
items.artifacts.driedrose$ghosthero.dialogue_halls_2=To miejsce mnie przeraża...
items.artifacts.driedrose$ghosthero.dialogue_halls_3=Co Krasnoludzi sobie myśleli, eksperymentując z taką mocą jak ta?
items.artifacts.driedrose$ghosthero.dialogue_halls_4=Tutejsze potwory są jakby nie z tego świata, skąd one pochodzą?
items.artifacts.driedrose$ghosthero.dialogue_halls_5=Czujesz to? Jakby ktoś na nas patrzył.
items.artifacts.driedrose$ghosthero.dialogue_halls_6=Dzięki Bogu że mamy tu pochodnie, jest tu tak ciemno!
items.artifacts.driedrose$ghosthero.dialogue_ascension_1=Dlaczego to się dzieje, myślałem, że nam się udało?
items.artifacts.driedrose$ghosthero.dialogue_ascension_2=Jakim cudem to coś wciąż wpływa na ten świat?
items.artifacts.driedrose$ghosthero.dialogue_ascension_3=Mam nadzieję, że wiesz, co robisz z tym amuletem.
items.artifacts.driedrose$ghosthero.dialogue_ascension_4=Wygląda na to, że to jeszcze nie koniec.
items.artifacts.driedrose$ghosthero.dialogue_ascension_5=Zaszliśmy już tak daleko, możemy to zakończyć!
items.artifacts.driedrose$ghosthero.dialogue_ascension_6=Jeszcze tylko trochę, możemy się stąd wydostać!

items.artifacts.driedrose$ghosthero.seen_goo_1=Uważaj na Wielki Szlam!
items.artifacts.driedrose$ghosthero.seen_goo_2=Wiele moich przyjaciół zmarło przez to, czas na zemstę!
items.artifacts.driedrose$ghosthero.seen_goo_3=Taka abominacja nie może żyć!
items.artifacts.driedrose$ghosthero.seen_tengu_1=Jedyny pozostały więzień to bardzo groźny skrytobójca. Ależ oczywiście...
items.artifacts.driedrose$ghosthero.seen_tengu_2=Uwięził nas!
items.artifacts.driedrose$ghosthero.seen_tengu_3=Słyszałem historie o tej masce...
items.artifacts.driedrose$ghosthero.seen_dm300_1=Tylko krasnoludy mogłyby zbudować machinę górniczą, która mordowałaby intruzów.
items.artifacts.driedrose$ghosthero.seen_dm300_2=To coś jest ogromne...
items.artifacts.driedrose$ghosthero.seen_dm300_3=W jaki sposób to działa po takim długim czasie?
items.artifacts.driedrose$ghosthero.seen_king_1=Gdy ludzie mówią, że władza deprawuje, to jest to, co mają na myśli.
items.artifacts.driedrose$ghosthero.seen_king_2=Teraz bardziej przypomina licza niż króla.
items.artifacts.driedrose$ghosthero.seen_king_3=Nawet po śmierci, krasnale słuchają się ich pana.
items.artifacts.driedrose$ghosthero.seen_yog_1=Nie wygląda za dobrze.
items.artifacts.driedrose$ghosthero.seen_yog_2=Więc tak wygląda bożek?
items.artifacts.driedrose$ghosthero.seen_yog_3=To zaboli...

items.artifacts.driedrose$ghosthero.defeated_by_enemy_1=Powodzenia...
items.artifacts.driedrose$ghosthero.defeated_by_enemy_2=Zmęczony... na razie...
items.artifacts.driedrose$ghosthero.defeated_by_enemy_3=Powrócę...
items.artifacts.driedrose$ghosthero.defeated_by_boss_1=Przepraszam... powodzenia...
items.artifacts.driedrose$ghosthero.defeated_by_boss_2=Wykończ go... beze mnie...
items.artifacts.driedrose$ghosthero.defeated_by_boss_3=Nie... nie mogę...
items.artifacts.driedrose$ghosthero.blessed_ankh_1=Jak to przeżyłeś?
items.artifacts.driedrose$ghosthero.blessed_ankh_2=Chciałbym też mieć takie...
items.artifacts.driedrose$ghosthero.blessed_ankh_3=O mój..! Nadal żyjesz!
items.artifacts.driedrose$ghosthero.player_killed_1=Nie!...
items.artifacts.driedrose$ghosthero.player_killed_2=Nie mogłem im pomóc...
items.artifacts.driedrose$ghosthero.player_killed_3=Nie w ten sposób...

items.artifacts.driedrose$ghosthero.direct_prompt=Co zrobić?
items.artifacts.driedrose$ghosthero.directed_follow_1=Dobrze, będę za tobą podążać.
items.artifacts.driedrose$ghosthero.directed_follow_2=Będę iść tuż za tobą.
items.artifacts.driedrose$ghosthero.directed_follow_3=Podążam za tobą...
items.artifacts.driedrose$ghosthero.directed_follow_4=Okej, chodźmy!
items.artifacts.driedrose$ghosthero.directed_follow_5=Mam twoje tyły.
items.artifacts.driedrose$ghosthero.directed_attack_1=Okej, zaatakuję to.
items.artifacts.driedrose$ghosthero.directed_attack_2=Zajmę się tym.
items.artifacts.driedrose$ghosthero.directed_attack_3=Atakuję...
items.artifacts.driedrose$ghosthero.directed_attack_4=Zniszczmy ich!
items.artifacts.driedrose$ghosthero.directed_attack_5=Mam go.
items.artifacts.driedrose$ghosthero.directed_position_1=Postaram się utrzymać pozycję.
items.artifacts.driedrose$ghosthero.directed_position_2=Pójdę tam się bronić.
items.artifacts.driedrose$ghosthero.directed_position_3=Zmiana pozycji...
items.artifacts.driedrose$ghosthero.directed_position_4=W drodze!
items.artifacts.driedrose$ghosthero.directed_position_5=Zmierzam w tamtym kierunku.

items.artifacts.driedrose$ghosthero.desc=Słabo wyglądająca duchowa postać o ludzkim wyglądzie. Wydaje się, że jej moc jest związana z różą, którą posiadasz.\n\nDuch to może i nie jest wiele, ale prawdopodobnie to twój jedyny prawdziwy przyjaciel w tych podziemiach.

##back to artifacts
items.artifacts.etherealchains.name=nieziemskie łańcuchy
items.artifacts.etherealchains.ac_cast=RZUĆ ZAKLĘCIE
items.artifacts.etherealchains.rooted=Twoje łańcuchy nie mogą cię pociągnąć kiedy jesteś zakorzeniony.
items.artifacts.etherealchains.no_charge=Twoje łańcuchy nie mają dość ładunków.
items.artifacts.etherealchains.cursed=Nie możesz użyć przeklętych łańcuchów.
items.artifacts.etherealchains.does_nothing=Nic nie zrobisz.
items.artifacts.etherealchains.cant_pull=Twoje łańcuchy nie mogą przyciągnąć celu.
items.artifacts.etherealchains.cant_reach=Twoje łańcuchy nie mogą tam dosięgnąć.
items.artifacts.etherealchains.inside_wall=Twoje łańcuchy mogą cię ciągnąć przez ściany, a nie do nich.
items.artifacts.etherealchains.nothing_to_grab=Nie ma tu niczego do chwycenia.
items.artifacts.etherealchains.prompt=Wybierz cel.
items.artifacts.etherealchains.desc=Te długie, ale lekkie łańcuchy promieniują nieziemską energią. Można ich użyć do podciągnięcia się do ściany lub do przyciągnięcia przeciwników do ciebie. Nieziemska natura łańcuchów pozwala im nawet przechodzić przez ściany!
items.artifacts.etherealchains.desc_cursed=Przeklęte łańcuchy przyczepiły się do twojego boku, nieprzerwanie miotają się i próbują cię przewrócić lub związać.
items.artifacts.etherealchains.desc_equipped=Łańcuchy spoczywają u twojego boku i powoli posilają się duchową energią tych, których pokonujesz. Każdy ładunek jest ogniwem w łańcuchu, który rozciąga się o dokładnie jedną kaflę.
items.artifacts.etherealchains$chainsrecharge.levelup=Twoje łańcuchy nabierają mocy!

items.artifacts.holytome.name=święta księga
items.artifacts.holytome.ac_cast=RZUĆ ZAKLĘCIE
items.artifacts.holytome.no_spell=Nie można teraz rzucić tego zaklęcia.
items.artifacts.holytome.cursed=Nie można używać przeklętej księgi.
items.artifacts.holytome.levelup=Twoja księga nabiera mocy!
items.artifacts.holytome.desc=Święta księga, która działa jako centrum boskiej magii Kleryka. Korzystanie z niej pozwala Klerykowi rzucać różne zaklęcia magiczne.\n\nKsięga, w miarę używania jej przez Kleryka, staje się coraz potężniejsza. Zwiększa to jej maksymalną ilość ładunków i nieznacznie zwiększa szybkość ładowania.
items.artifacts.holytome.discover_hint=Z tym przedmiotem zaczyna jeden z bohaterów.

items.artifacts.hornofplenty.name=róg obfitości
items.artifacts.hornofplenty.ac_snack=PRZEKĄŚ
items.artifacts.hornofplenty.ac_eat=JEDZ
items.artifacts.hornofplenty.ac_store=PRZECHOWAJ
items.artifacts.hornofplenty.eat=Pożywiasz się z rogu.
items.artifacts.hornofplenty.prompt=Wybierz pokarm
items.artifacts.hornofplenty.no_food=Twój róg nie ma w sobie nic do zjedzenia!
items.artifacts.hornofplenty.full=Twój róg jest pełen jedzenia!
items.artifacts.hornofplenty.reject=Twój Róg odrzuca nieprzyrządzony Mdły Owoc.
items.artifacts.hornofplenty.maxlevel=Twój róg zużył całą żywność jaką mógł!
items.artifacts.hornofplenty.levelup=Twój róg pochłania oferowaną przez Ciebie żywność i wzrasta w siłę!
items.artifacts.hornofplenty.feed=Twój róg pochłania oferowaną przez Ciebie żywność.
items.artifacts.hornofplenty.desc=W ten róg nie można zadąć, jednakże samoczynnie napełnia się jedzeniem podczas twoich przygód i zdobywania doświadczenia. Możesz zjeść każdy ładunek osobno jako przekąskę albo najeść się do pełna.
items.artifacts.hornofplenty.desc_hint=Czyżby istniał sposób na zwiększenie mocy rogu? Może przez zapewnienie mu energii żywnością?
items.artifacts.hornofplenty.desc_cursed=Przeklęty róg przypiął się sam do Twego boku, i wygląda na to, że zabiera żywność zamiast ją dawać.

items.artifacts.lloydsbeacon.name=latarnia Lloyda
items.artifacts.lloydsbeacon.ac_zap=STRZEL
items.artifacts.lloydsbeacon.ac_set=USTAW
items.artifacts.lloydsbeacon.ac_return=WROĆ
items.artifacts.lloydsbeacon.no_charge=Twoja latarnia nie ma wystarczająco energii.
items.artifacts.lloydsbeacon.tele_fail=Magia teleportacji zawodzi.
items.artifacts.lloydsbeacon.prompt=Wybierz miejsce do strzelenia.
items.artifacts.lloydsbeacon.levelup=Twoja latarnia nabiera mocy!
items.artifacts.lloydsbeacon.preventing=Silna magiczna aura tego miejsca nie pozwala ci użyć latarni lloyda!
items.artifacts.lloydsbeacon.creatures=Psychiczna aura sąsiadujących stworzeń nie pozwala ci użyć latarnii lloyda.
items.artifacts.lloydsbeacon.return=Latarnia Lloyda pomyślnie naznaczyła to miejsce, teraz możesz tu wrócić w każdej chwili.
items.artifacts.lloydsbeacon.desc=Latarnia Lloyda jest zawiłym urządzeniem magicznym, które zapewnia użytkownikowi kontrolę nad magią teleportacyjną. Latarnia może zostać użyta do powrotu na naznaczone wcześniej miejsce, a gdy jest naładowana, może ona również słać teleportacyjne pociski, które teleportują cel w losowe miejsce. Magia ta może zostać nakierowana na użytkownika oraz inne istoty.
items.artifacts.lloydsbeacon.desc_set=Latarnia została ustawiona gdzieś na %d poziomie.

items.artifacts.masterthievesarmband.name=opaska mistrza złodziei
items.artifacts.masterthievesarmband.ac_steal=OKRADNIJ
items.artifacts.masterthievesarmband.no_charge=Twoja opaska nie ma wystarczająco dużo ładunków.
items.artifacts.masterthievesarmband.cursed=Nie możesz użyć przeklętej opaski.
items.artifacts.masterthievesarmband.full=Twoja opaska jest w pełni naładowana!
items.artifacts.masterthievesarmband.prompt=Wybierz cel
items.artifacts.masterthievesarmband.no_target=Musisz wybrać przeciwnika, który jest obok ciebie.
items.artifacts.masterthievesarmband.steal_shopkeeper=Nie możesz bezpośrednio okradać sklepikarzy.
items.artifacts.masterthievesarmband.no_steal=Ten przeciwnik nie ma nic, co można by ukraść.
items.artifacts.masterthievesarmband.stole_item=Ukradziony przedmiot: %s.
items.artifacts.masterthievesarmband.failed_steal=Nie udało ci się nic ukraść.
items.artifacts.masterthievesarmband.level_up=Twoja opaska nabiera mocy!
items.artifacts.masterthievesarmband.desc=Ta purpurowa aksamitna opaska nosi znak mistrza złodziei. Nie należy ona do ciebie, ale prawdopodobnie nie należała też do poprzedniego posiadacza.
items.artifacts.masterthievesarmband.desc_cursed=Przeklęta opaska jest zawiązana wokół twojego nadgarstka, a twoja sakiewka ze złotem w jakiś tajemniczy sposób staje się coraz lżejsza...
items.artifacts.masterthievesarmband.desc_worn=Czujesz, jak moc zbiera się w twojej opasce, gdy zdobywasz doświadczenie. Możesz użyć tej mocy, by obrabować sklep lub okraść przeciwników!\n\nOkradanie przeciwników następuje natychmiast, chwilowo ich dezorientuje i daje ci szansę zabrać ich przedmioty. Ta umiejętność działa lepiej przeciwko nieświadomym twojej obecności przeciwnikom. Wielokrotne okradanie tego samego celu nie pozwala zdobywać kolejnych przedmiotów.

items.artifacts.sandalsofnature.name=sandały natury
items.artifacts.sandalsofnature.name_1=pantofle natury
items.artifacts.sandalsofnature.name_2=buty natury
items.artifacts.sandalsofnature.name_3=kozaki natury
items.artifacts.sandalsofnature.ac_feed=NAKARM
items.artifacts.sandalsofnature.ac_root=ZAKORZENIAJ
items.artifacts.sandalsofnature.prompt=Wybierz nasiono
items.artifacts.sandalsofnature.levelup=Obuwie się powiększyło!
items.artifacts.sandalsofnature.absorb_seed=Obuwie absorbuje nasiono i wygląda zdrowiej.
items.artifacts.sandalsofnature.no_effect=Najpierw musisz nakarmić swoje obuwie nasionem.
items.artifacts.sandalsofnature.low_charge=Twoje obuwie nie ma na to wystarczająco dużo energii.
items.artifacts.sandalsofnature.prompt_target=Wybierz pole
items.artifacts.sandalsofnature.out_of_range=To pole jest poza zasięgiem.
items.artifacts.sandalsofnature.desc_1=Coś co z pozoru wygląda jak sandały zrobione z gałązek jest w rzeczywistości dwiema roślinami! Wyglądają na słabe i wyblakłe, być może muszą być nakarmione?
items.artifacts.sandalsofnature.desc_2=Obuwie urosło i teraz wyglądem przypomina bardziej parę ręcznie szytych pantofli. Trochę kolorów do nich powróciło i być może mogą jeszcze trochę urosnąć.
items.artifacts.sandalsofnature.desc_3=Rośliny urosły ponownie i teraz wyglądają jak para solidnych butów zrobionych z kory. Wygląda na to, że rośliny odzyskały siłę, ale może mogą jeszcze urosnąć.
items.artifacts.sandalsofnature.desc_4=Wygląda na to, że rośliny nie mogą już bardziej urosnąć. Przypominają teraz parę opancerzonych kozaków. Są one ciemnobrązowe i sprawiają wrażenie wykonanych z bardzo twardego drzewa.
items.artifacts.sandalsofnature.desc_hint=Czujesz się bardziej związany z naturą, gdy nosisz ten artefakt.
items.artifacts.sandalsofnature.desc_cursed=Te przeklęte sandały hamują jakikolwiek kontakt z naturą.
items.artifacts.sandalsofnature.desc_ability=Obuwie delikatnie połyskuje kolorem ostatniego nasiona, jakim zostało nakarmione. Może na krótko zakorzenić się w podłożu i wytworzyć efekt tej rośliny gdziekolwiek w promieniu 3 pól.\nNasiono: _%s_\nPotrzebny ładunek: _%d%%_
items.artifacts.sandalsofnature.desc_seeds=Obuwie zostało nakarmione %d nasionami.

