items.artifacts.skeletonkey.iron_charges=Otwarcie zwykłego zamka wymaga 1 ładunku.
items.artifacts.skeletonkey.gold_charges=Otwarcie złotego zamka wymaga 2 ładunków.
items.artifacts.skeletonkey.lock_charges=Zamknięcie drzwi wymaga 2 ładunków.
items.artifacts.skeletonkey.wall_charges=Stworzenie tymczasowej ściany wymaga 2 ładunków.
items.artifacts.skeletonkey.crystal_charges=Otwarcie kryształowej skrzyni wymaga 5 ładunków.
items.artifacts.skeletonkey.wont_open=Klucz z jakiegoś powodu nie chce wejść w zamek.
items.artifacts.skeletonkey.locked_with_key=Te drzwi zostały zamknięte twoim kościanym kluczem.
items.artifacts.skeletonkey.force_lock=Zamek osłabł bez mocy kościanego klucza. Udaje ci się go wyłamać.
items.artifacts.skeletonkey.discard=Wyrzucasz nadmiarowe klucze.
items.artifacts.skeletonkey.levelup=Twój kościany klucz nabiera mocy!
items.artifacts.skeletonkey.desc=Ważnie wyglądający klucz z główką w kształcie czaszki. Jego ząbki zdają się za każdym razem wyglądać inaczej, kiedy na nie patrzysz.
items.artifacts.skeletonkey.desc_worn=Magiczny klucz zdaje się rosnąć w siłę wraz z używaniem go zamiast zwykłych kluczy znalezionych w lochu. Może on być włożony w prawie każdy zamek aby go otworzyć, lub zamknąć, co uwzględnia również drzwi, które nie były wcześniej zamknięte.Klucz może nawet być użyty na pustym polu w linii lub na skos aby 'zamknąć' powietrze przed tobą, tworząc ścianę na 3 pola, która utrzymuje się przez 10 tur. Zamykanie odepchnie wrogów jeśli jest na to przestrzeń.
items.artifacts.skeletonkey.desc_cursed=Klucz zdaje się aktywnie unikać wpasowywania się w zamki, jak również utrudniać (choć nie uniemożliwiać) używanie twoich pozostałych kluczy.
items.artifacts.skeletonkey$keywall.desc=Tymczasowa magiczna ściana została tu postawiona przez kościany klucz.

items.artifacts.talismanofforesight.name=talizman przezorności
items.artifacts.talismanofforesight.ac_scry=SKANUJ
items.artifacts.talismanofforesight.low_charge=Talizman wymaga minimum 5% ładunku, by nim skanować.
items.artifacts.talismanofforesight.prompt=Wybierz miejsce do przeskanowania.
items.artifacts.talismanofforesight.levelup=Twój talizman nabiera mocy!
items.artifacts.talismanofforesight.full_charge=Twój talizman jest w pełni naładowany!
items.artifacts.talismanofforesight.desc=Gładki kamień pokryty dziwnym grawerunkiem. Czujesz, jakby obserwował on wszystko wokół ciebie, wypatrując wszystkiego, co ukryte.
items.artifacts.talismanofforesight.desc_worn=Trzymając talizman, czujesz, jakby Twoje zmysły były wyostrzone. Artefakt powoli rośnie w siłę wraz z upływem czasu i odkrywaniem ukrytych drzwi czy pułapek.\n\nTalizman może zużyć swą energię by "skanować" obszar w kształcie stożka. Użycie jego mocy odkrywa wszystkie pola i sekrety na skanowanym obszarze, a także chwilowo ukazuje użytkownikowi położenie przedmiotów i przeciwników.
items.artifacts.talismanofforesight.desc_cursed=Przeklęty talizman wpatruje się w ciebie uważnie, otępiając twoje zmysły.
items.artifacts.talismanofforesight$foresight.name=przezorność
items.artifacts.talismanofforesight$foresight.uneasy=Czujesz się niepewnie.
items.artifacts.talismanofforesight$foresight.desc=Jesteś bardzo zdenerwowany, tak jakbyś wyczuwał niewidzialne, bliskie niebezpieczeństwo.

items.artifacts.timekeepershourglass.name=klepsydra strażnika czasu
items.artifacts.timekeepershourglass.ac_activate=URUCHOM
items.artifacts.timekeepershourglass.deactivate=Wyłączasz zatrzymanie czasu.
items.artifacts.timekeepershourglass.no_charge=Twoja klepsydra nie naładowała się wystarczająco by jej użyć.
items.artifacts.timekeepershourglass.cursed=Nie możesz użyć przeklętej klepsydry.
items.artifacts.timekeepershourglass.onstasis=Świat wokoło ciebie wydaje się zmieniać prawie błyskawiczne.
items.artifacts.timekeepershourglass.onfreeze=Wszystko wokoło ciebie nagle się zatrzymało.
items.artifacts.timekeepershourglass.stasis=Zatrzymaj mnie w czasie
items.artifacts.timekeepershourglass.freeze=Zatrzymaj czas wokoło mnie.
items.artifacts.timekeepershourglass.prompt=W jaki sposób chcesz wykorzystać magię klepsydry?\n\nKiedy zatrzymasz się w czasie, czas będzie biegł normalnie podczas gdy ty będziesz zamrożony i całkowicie nietykalny. Wykorzystane zostanie do 2 ładunków na jeden raz.\n\nKiedy zamrozisz czas dookoła, będziesz mógł się poruszać i wykonywać czynności bez upływu czasu. Efekt ten będzie mógł zostać przerwany poprzez użycie klepsydry lub atakowanie.
items.artifacts.timekeepershourglass.desc=Ta wielka zdobiona klepsydra wygląda niepozornie, ale czujesz potężną moc uwięzioną w jej zdobionej obudowie. Kiedy obracasz klepsydrę i spoglądasz na przesypujący się piasek, czujesz, jak jej magia cię przyciąga, z pewnością użycie jej da ci trochę władzy nad czasem.
items.artifacts.timekeepershourglass.desc_hint=Wygląda na to, że klepsydra straciła trochę piasku, gdybyś tylko mógł go trochę znaleźć...
items.artifacts.timekeepershourglass.desc_cursed=Przeklęta klepsydra jest przyczepiona do twojego boku, czujesz jak próbuje manipulować czasem.
items.artifacts.timekeepershourglass$timefreeze.name=Zamrożenie czasu
items.artifacts.timekeepershourglass$timefreeze.desc=Czas zamarzł wokół ciebie, pozwalając na natychmiastowe wykonanie akcji. Efekt trwa dopóki nie zostanie anulowany lub do rozładowania się klepsydry. Atak bądź użycie magii również przerwie ten efekt.\n\nPozostałe tury do zużycia ładunku: %s.
items.artifacts.timekeepershourglass$sandbag.name=woreczek magicznego piasku
items.artifacts.timekeepershourglass$sandbag.levelup=Wsypałeś piasek do klepsydry.
items.artifacts.timekeepershourglass$sandbag.maxlevel=Twoja klepsydra jest napełniona do pełna magicznym piaskiem!
items.artifacts.timekeepershourglass$sandbag.no_hourglass=Nie masz klepsydry, do której mógłbyś wsypać piasek.
items.artifacts.timekeepershourglass$sandbag.desc=Ten mały woreczek piasku powinien świetnie pasować do twojej klepsydry.\n\nTo trochę dziwne, że sklepikarz ma tak specyficzny przedmiot, właśnie wtedy kiedy go potrzebujesz...

items.artifacts.unstablespellbook.name=niestabilna księga zaklęć
items.artifacts.unstablespellbook.ac_read=CZYTAJ
items.artifacts.unstablespellbook.ac_add=DODAJ
items.artifacts.unstablespellbook.blinded=Nie możesz przeczytać z księgi gdy jesteś oślepiony.
items.artifacts.unstablespellbook.no_charge=Twoja księga zaklęć nie ma teraz energii.
items.artifacts.unstablespellbook.cursed=Nie możesz przeczytać przeklętej księgi.
items.artifacts.unstablespellbook.prompt=Wybierz zwój
items.artifacts.unstablespellbook.infuse_scroll=Przesączasz energię zwoju wprost do księgi.
items.artifacts.unstablespellbook.unable_scroll=Nie jesteś w stanie dodać tego zwoju do księgi.
items.artifacts.unstablespellbook.unknown_scroll=Nie jesteś pewien, jakiego typu jest ten zwój.
items.artifacts.unstablespellbook.desc=Ten Tom jest w wyjątkowo dobrym stanie po tak wielu latach. Syczy i trzeszczy, kiedy przesuwasz strony, wzbierając niestabilną magią. Jeżeli zaczniesz czytać tę księgę, nie wiadomo jakiego zaklęcia użyjesz.
items.artifacts.unstablespellbook.desc_cursed=Przeklęta książka przyczepiła się do ciebie, powstrzymuje ciebie przed użyciem większości zwojów,
items.artifacts.unstablespellbook.desc_index=Indeks książki jest niekompletny i aktualnie wskazuje na nastepujące, puste strony:
items.artifacts.unstablespellbook.desc_empowered=Zwój dodany do księgi zaklęć buzuje energią. Jesteś w stanie przelać tę energię w zwykły lub egzotyczny wariant efektu tego zwoju, ale będzie to kosztować dodatkowe użycie.
items.artifacts.unstablespellbook.read_empowered=Zwój dodany do księgi zaklęć buzuje energią. Jesteś w stanie przelać tę energię w zwykły lub egzotyczny wariant efektu tego zwoju.\n\nWybranie egzotycznej wersji zwoju będzie kosztowało 2 ładunki zamiast 1.



###bags
items.bags.bag.name=plecak
items.bags.bag.discover_hint=Ten przedmiot możesz kupić w sklepie.

items.bags.potionbandolier.name=bandolier na mikstury
items.bags.potionbandolier.desc=Ten gruby bandolier zakłada się wokół piersi jak szarfę. Ma wiele zaizolowanych kieszonek, w których można bezpiecznie trzymać szklane fiolki, bukłak z wodą czy fiolki płynnego metalu.\n\nTwoje mikstury znajdujące się w bandolierze będą chronione przed zimnem.

items.bags.scrollholder.name=tuba na zwoje
items.bags.scrollholder.desc=Ten pojemnik w kształcie rury wygląda na taki, w którym astronomowie przetrzymują swoje wykresy. Zwoje pasują do niego jak ulał. Jest też kilka bocznych kieszonek, które pasują całkiem nieźle na kryształy czarów, magiczne rylce czy magiczną żywicę. \n\nPojemnik nie wygląda na łatwopalny. Zwoje w nim schowane powinny być zabezpieczone przed ogniem.

items.bags.velvetpouch.name=aksamitna sakiewka
items.bags.velvetpouch.desc=Ta mała aksamitna sakiewka pozwala ci na przechowywanie małych przedmiotów, takich jak nasiona, kamienie runiczne i niektóre składniki alchemiczne.
items.bags.velvetpouch.discover_hint=Z tym przedmiotem zaczyna jeden z bohaterów.

items.bags.magicalholster.name=magiczny pokrowiec
items.bags.magicalholster.desc=Ten cienki pokrowiec jest stworzony ze skóry egzotycznego zwierzęcia i ma w sobie potężną magię pozwalającą mu przechowywać duże ilości broni dystansowych.\n\nKiedy sięgniesz do niego, zawsze znajdziesz przedmiot którego szukasz.\n\nDzięki magii zawartej w pokrowcu, różdżki będą ładować się nieco szybciej, a bronie miotane będą nieco bardziej wytrzymałe.



###bombs
items.bombs.arcanebomb.name=tajemnicza bomba
items.bombs.arcanebomb.desc=Ta bomba przejęła magiczne właściwości kawałka szlamu. Jej wybuch przypomina ładowany atak Wielkiego Szlamu, który zadaje _%1$d-%2$d obrażeń magicznych_ wszystkiemu, co znajdzie się w zasięgu dwóch pól.
items.bombs.arcanebomb.discover_hint=Ten przedmiot możesz stworzyć poprzez alchemię.

items.bombs.bomb.name=bomba
items.bombs.bomb.ac_lightthrow=PODPAL I RZUĆ
items.bombs.bomb.snuff_fuse=Szybko gasisz lont bomby.
items.bombs.bomb.ondeath=Zabił cię wybuch...
items.bombs.bomb.rankings_desc=Zabity przez wybuch
items.bombs.bomb.desc=Dość solidna bomba czarnoprochowa. Eksplozja tej bomby zada _%1$d-%2$d obrażeń_ istotom na przyległych polach oraz zniszczy niektóre przedmioty i elementy terenu.
items.bombs.bomb.desc_fuse=Wygląda na to, że lont będzie się spalał przez kilka tur po zapaleniu.
items.bombs.bomb.desc_burning=Lont tej bomby spala się, lepiej się oddal lub go zgaś!
items.bombs.bomb$doublebomb.name=dwie bomby
items.bombs.bomb$doublebomb.desc=Para ogromnych bomb z czarnym prochem - wygląda na to, że dostałeś jedną za darmo!

items.bombs.firebomb.name=bomba zapalająca
items.bombs.firebomb.desc=Ta bomba została zmodyfikowana, by wybuchnąć na większym obszarze, zadając _%1$d-%2$d obrażeń_ oraz rozpętując ognistą burzę na obszarze 2 pól.
items.bombs.firebomb.discover_hint=Ten przedmiot możesz stworzyć poprzez alchemię.

items.bombs.flashbangbomb.name=bomba błyskowa
items.bombs.flashbangbomb.desc=Ta zmodyfikowana bomba głośno wybuchnie, oślepiając i rażąc prądem. Wszystko w zasięgu dwóch pól zostanie ogłuszone na 10 tur, otrzyma _%1$d-%2$d obrażeń_ od eksplozji oraz dodatkowe 25%% obrażeń od elektryczności.
items.bombs.flashbangbomb.discover_hint=Ten przedmiot możesz stworzyć poprzez alchemię.

items.bombs.frostbomb.name=bomba mrożąca
items.bombs.frostbomb.desc=Ta bomba została zmodyfikowana, by zwiększyć jej zasięg eksplozji do dwóch pól. Wybuch tej bomby zadaje _%1$d-%2$d obrażeń_ oraz wypełnia obszar eksplozji podmuchami mrożącego powietrza.
items.bombs.frostbomb.discover_hint=Ten przedmiot możesz stworzyć poprzez alchemię.

items.bombs.holybomb.name=święta bomba
items.bombs.holybomb.desc=Ta bomba została zmodyfikowana, by przy wybuchu rozbłysnąć świętym światłem. Wszystko w zasięgu dwóch pól otrzyma _%1$d-%2$d obrażeń_ od eksplozji. Nieumarli i demoniczni przeciwnicy otrzymają dodatkowe 50%% obrażeń od świętego światła.
items.bombs.holybomb.discover_hint=Ten przedmiot możesz stworzyć poprzez alchemię.

items.bombs.noisemaker.name=bomba gwiżdżąca
items.bombs.noisemaker.desc=Ta zmodyfikowana bomba będzie wielokrotnie wydawać hałaśliwe dźwięki po wypaleniu lontu. Bomba wybuchnie przy dotknięciu, zadając _%1$d-%2$d obrażeń_ wszystkiemu w obszarze 2 pól!
items.bombs.noisemaker.desc_burning=Czas na bombie gwiżdżącej upływa; wybuchnie ona, gdy coś znajdzie się w pobliżu!
items.bombs.noisemaker.discover_hint=Ten przedmiot możesz stworzyć poprzez alchemię.

items.bombs.smokebomb.name=bomba dymna
items.bombs.smokebomb.desc=Ta bomba została zmodyfikowana, by w momencie wybuchu wyrzucić z siebie gęstą chmurę gazu. Bomba zada _%1$d-%2$d obrażeń_ i pokryje okrywającą mgłą obszar w zasięgu dwóch pól.
items.bombs.smokebomb.discover_hint=Ten przedmiot możesz stworzyć poprzez alchemię.

items.bombs.regrowthbomb.name=bomba odrodzenia
items.bombs.regrowthbomb.desc=Ta zmodyfikowana bomba, zamiast wybuchnąć, rozleje leczący płyn na obszarze 3 pól. Ziemia na całym obszarze wokół eksplozji obrośnie trawą i roślinami. Ty oraz wszyscy sojusznicy w zasięgu zostaną uleczeni, jakby wypili miksturę leczenia.
items.bombs.regrowthbomb.discover_hint=Ten przedmiot możesz stworzyć poprzez alchemię.

items.bombs.shrapnelbomb.name=bomba rozpryskowa
items.bombs.shrapnelbomb.desc=Ta bomba została zmodyfikowana za pomocą odłamków metalu z kadłuba DM-300, które w momencie wybuchu zostaną wyrzucone na wszystkie strony, zadając _%1$d-%2$d obrażeń_ na ogromnym obszarze wokół bomby. Schowaj się za czymś, gdy zdecydujesz się jej użyć...
items.bombs.shrapnelbomb.discover_hint=Ten przedmiot możesz stworzyć poprzez alchemię.

items.bombs.woollybomb.name=bomba wełniasta
items.bombs.woollybomb.desc=Ta zmodyfikowana bomba wytworzy całe stado magicznych owiec przy eksplozji. Eksplozja zada _%1$d-%2$d obrażeń_ wszystkiemu w obszarze 2 pól. Owce te będą blokować poruszanie się przez bardzo długi czas, choć mogą być ręcznie rozproszone przez interakcję z nimi! Owce znikną szybciej w obecności potężnych przeciwników.
items.bombs.woollybomb.discover_hint=Ten przedmiot możesz stworzyć poprzez alchemię.

###food
items.food.berry.name=dzika jagoda
items.food.berry.eat_msg=Ta jagoda była przepyszna!
items.food.berry.desc=Ta mała jagoda została znaleziona przez Łowczynię wśród roślinności lochu. Je się ją szybciej niż inne rodzaje pożywienia, jednak ciężko jest się nią najeść, ale może zawierać przydatne nasiono!
items.food.berry.discover_hint=Ten przedmiot możesz znaleźć za pomocą pewnego talentu bohatera.

items.food.blandfruit.name=mdły owoc
items.food.blandfruit.cooked=ugotowany mdły owoc
items.food.blandfruit.sunfruit=owoc słońca
items.food.blandfruit.rotfruit=owoc zgnilizny
items.food.blandfruit.earthfruit=owoc ziemi
items.food.blandfruit.blindfruit=owoc oślepienia
items.food.blandfruit.firefruit=owoc ognia
items.food.blandfruit.icefruit=owoc lodu
items.food.blandfruit.fadefruit=zwiędły owoc
items.food.blandfruit.sorrowfruit=owoc żalu
items.food.blandfruit.stormfruit=owoc burzy
items.food.blandfruit.dreamfruit=owoc maga
items.food.blandfruit.starfruit=owoc gwiazd
items.food.blandfruit.swiftfruit=szybki owoc
items.food.blandfruit.raw=Nie możesz zmusić się do zjedzenia tego na surowo.
items.food.blandfruit.desc=Bardzo suchy i nietreściwy, być może ugotowanie go z innym składnikiem poprawi sprawę.
items.food.blandfruit.desc_cooked=Owoc napuchnął od wody i możliwe, że przejął właściwości nasiona, z którym go warzono. Będzie miał cechy mikstury odpowiadającej użytemu nasionku.
items.food.blandfruit.desc_eat=Wygląda na gotowy do spożycia!
items.food.blandfruit.desc_throw=Wygląda na niestabilny, najlepiej będzie nim rzucić.
items.food.blandfruit$chunks.name=kawałki mdłego owocu
items.food.blandfruit$chunks.desc=Mdły owoc eksplodował od uderzenia, rozpadając się na niegroźne kawałki.\n\nMimo piachu, te duże kawałki ugotowanego mdłego owocu wyglądają na jadalne.

items.food.chargrilledmeat.name=grillowane mięso
items.food.chargrilledmeat.desc=Wygląda jak dobrze przyrządzony stek.
items.food.chargrilledmeat.discover_hint=Ten przedmiot możesz stworzyć, korzystając z innego jedzenia.

items.food.food.name=racja żywnościowa
items.food.food.ac_eat=JEDZ
items.food.food.eat_msg=To jedzenie smakowało wyśmienicie!
items.food.food.desc=Nic szczególnego: suszone mięso, trochę sucharów - takie tam.

items.food.frozencarpaccio.name=mrożone carpaccio
items.food.frozencarpaccio.invis=Twoje ręce stały się niewidzialne!
items.food.frozencarpaccio.hard=Czujesz, że twoja skóra twardnieje!
items.food.frozencarpaccio.refresh=Odświeżające!
items.food.frozencarpaccio.better=Czujesz się znacznie lepiej!
items.food.frozencarpaccio.desc=Jest to kawał zamrożonego, surowego mięsa. Jedyny sposób, by je zjeść, to pociąć je w cienkie kawałki. Wbrew pozorom jest bardzo pyszne.
items.food.frozencarpaccio.discover_hint=Ten przedmiot możesz stworzyć, korzystając z innego jedzenia.

items.food.meatpie.name=mięsny placek
items.food.meatpie.eat_msg=To jedzenie było przepyszne!
items.food.meatpie.desc=Przepyszny placek pełen aromatycznego mięsa. Najesz się tym bardziej niż czymkolwiek innym.
items.food.meatpie.discover_hint=Ten przedmiot możesz stworzyć poprzez alchemię.

items.food.mysterymeat.name=tajemnicze mięso
items.food.mysterymeat.eat_msg=To jedzenie smakowało... dziwnie.
items.food.mysterymeat.hot=Aj, to jest gorące!
items.food.mysterymeat.legs=Nie czujesz swoich nóg!
items.food.mysterymeat.not_well=Nie czujesz się dobrze.
items.food.mysterymeat.stuffed=Jesteś najedzony.
items.food.mysterymeat.desc=Jesz na własną odpowiedzialność!
items.food.mysterymeat.discover_hint=Ten przedmiot możesz dostać jako łup z pewnych przeciwników.
items.food.mysterymeat$placeholder.name=mięso

items.food.phantommeat.name=widmowe mięso
items.food.phantommeat.desc=Duży, lśniący i przezroczysty filet, wycięty z ciała widmowej piranii. To magiczne mięso nie wymaga gotowania i, poza całkowitym zaspokojeniem głodu, daje wiele korzyści obronnych. Po zjedzeniu zapewnia niewidzialność, dębową skórę, częściowe uzdrowienie i niweluje wiele szkodliwych efektów.
items.food.phantommeat.discover_hint=Ten przedmiot możesz dostać jako łup z pewnych przeciwników.

items.food.pasty.name=pasztecik
items.food.pasty.fish_name=duszona ryba
items.food.pasty.amulet_name=amulet yendoru?
items.food.pasty.egg_name=jajko wielkanocne
items.food.pasty.rainbow_name=tęczowa mikstura
items.food.pasty.shattered_name=zielony tort
items.food.pasty.pie_name=dyniowe ciasto
items.food.pasty.vanilla_name=niebieski tort
items.food.pasty.cane_name=cukrowa laska
items.food.pasty.sparkling_name=musująca mikstura
items.food.pasty.desc=To prawdziwy kornwalijski pasztecik, nadziewany tradycyjnym farszem z wołowiny i ziemniaków. Przepyszny!
items.food.pasty.fish_desc=Cała ryba gotowana na parze, magicznie zakonserwowana na zieleninie. Zgodnie z tradycją o tej porze roku należy zachować trochę ryby na później, tak więc zostawisz resztki, zamiast jeść wszystko na raz.\n\nSzczęśliwego Księżycowego Nowego Roku!
items.food.pasty.amulet_desc=W końcu go znalazłeś, magiczny amulet - chwileczkę, to tylko owinięta folią czekolada, która wygląda jak amulet! Nie da ci nieograniczonej mocy, ale przynajmniej nasyci cię i naładuje nieco twoje artefakty.\n\nPrima aprilis!
items.food.pasty.egg_desc=Wielkie czekoladowe jajko zapakowane w kolorową żółtą folię. Czekolady jest tu wystarczająco dużo, by się najeść, a cukier nieco naładuje twoje artefakty.\n\nWesołych Świąt Wielkanocnych!
items.food.pasty.rainbow_desc=Ta kolorowa mikstura jest przykładem płynnego jedzenia. Nie dość, że zaspokoi twój głód, to odrobina magii w niej zawarta uspokoi przyległego przeciwnika nie będącego bossem, sprawiając, że ten chwilowo nie będzie chętny do walki z tobą.\n\nSzczęśliwego Pride!
items.food.pasty.shattered_desc=Ten duży kawałek waniliowego tortu ma kolorową posypkę i zielony lukier. Został stworzony, by świętować lata doświadczenia i zapewni ci niewielką ilość punktów doświadczenia, gdy go zjesz.\n\nShattered Pixel Dungeon zostało wydane po raz pierwszy 5 sierpnia 2014. Wszystkiego najlepszego Shattered Pixel Dungeon!
items.food.pasty.pie_desc=Duży kawałek ciasta dyniowego. Jego słodki i korzenny smak z pewnością cię napełni i trochę uleczy.\n\nWesołego Halloween!
items.food.pasty.vanilla_desc=Ten duży kawałek waniliowego tortu ma kolorową posypkę i niebieski lukier. Został stworzony, by świętować lata doświadczenia i zapewni ci niewielką ilość tego doświadczenia, gdy go zjesz. \n\nOryginalne Pixel Dungeon zostało wydane po raz pierwszy 4 grudnia 2012. Wszystkiego najlepszego Pixel Dungeon!
items.food.pasty.cane_desc=Ogromna, słodka laska cukrowa. Jest wystarczająco duża, aby cię nasycić, a cukier może również dać różdżkom odrobinę dodatkowego ładunku.\n\nWesołych Świąt!
items.food.pasty.sparkling_desc=Ta musująca mikstura jest przykładem płynnego jedzenia. Zaspokaja głód, przypominając przy tym wino musujące, ale nie zawiera alkoholu. Ciepłe uczucie w twoim brzuchu zapewni ci odrobinę punktów osłony.\n\nSzczęśliwego nowego roku!
items.food.pasty$fishleftover.name=resztki ryby
items.food.pasty$fishleftover.eat_msg=To jedzenie smakowało normalnie.
items.food.pasty$fishleftover.desc=Resztka ryby z poprzedniej porcji. Możesz ją zjeść w dowolnym momencie, aby zaspokoić głód.

items.food.smallration.name=mała racja żywnościowa
items.food.smallration.eat_msg=To jedzenie smakowało normalnie.
items.food.smallration.desc=Wygląda dokładnie tak samo, jak standardowa racja żywnościowa, tyle że jest mniejsza.
items.food.smallration.discover_hint=Ten przedmiot możesz kupić w sklepie.

items.food.stewedmeat.name=ugotowane mięso
items.food.stewedmeat.eat_msg=To jedzenie smakowało normalnie.
items.food.stewedmeat.desc=Gotowanie mięsa usuwa chorobę i pasożyty. Teraz powinno być bezpieczne do zjedzenia
items.food.stewedmeat.discover_hint=Ten przedmiot możesz stworzyć poprzez alchemię.

items.food.supplyration.name=zapasowa racja żywnościowa
items.food.supplyration.desc=Ta racja żywnościowa została tu ukryta przez i dla członków gildii złodziei. Została przygotowana do tego, by zjeść ją w drodze i pomóc w szeroko rozumianej nielegalnej działalności.\n\nMimo że nie nasyci cię tak bardzo, jak zwyczajna racja żywnościowa, można ją szybko zjeść, co nieco cię uleczy i przywróci ładunek opończy cieni należącej do Łotrzyka.
items.food.supplyration.discover_hint=Ten przedmiot możesz znaleźć za pomocą pewnego talentu bohatera.



##journal items
items.journal.documentpage.name=podarta strona
items.journal.documentpage.desc=Pojedyncza karta, zapewne wyrwana z jakiegoś rodzaju książki. Musisz ją podnieść, aby przeczytać.

items.journal.alchemypage.name=podarta strona poradnika alchemicznego
items.journal.alchemypage.desc=Podarta strona poradnika alchemicznego.\n\nNapisy są za małe żeby dało się je przeczytać na odległość, ale tytuł jest widoczny:\n\n_"%s"_

items.journal.guidebook.name=Księga "Jak przezwyciężyć lochy"
items.journal.guidebook.hint_mobile=Twój przewodnik ma dla ciebie radę! Wciśnij migający przycisk dziennika w prawym górnym rogu, aby ją przeczytać.
items.journal.guidebook.hint_desktop=Twój przewodnik ma dla ciebie radę! Wciśnij migający przycisk dziennika (%s), w prawym górnym rogu, aby ją przeczytać.
items.journal.guidebook.hint_status=Przewodnik
items.journal.guidebook.desc=Poradnik poszukiwacza przygód - zostawiony przez kogoś, kto uznał, że chodzenie po lochach nie jest dla niego! Czujesz, że ta książka jest magiczna; jest w stanie podpowiedzieć podróżnikom, by przeczytali odpowiednią stronę w odpowiednim momencie.\n\nMimo tej funkcji, ta książka jest szerzej znana dzięki słowom "Nie panikuj!", napisanymi dużymi, przyjaznymi literami na okładce.

items.journal.guidepage.name=wyrwana strona poradnika
items.journal.guidepage.desc=Wyrwana strona z poradnika poszukiwacza przygód.\n\nTekst jest trudny do przeczytania z tej odległości, ale możesz przeczytać tytuł:\n\n_"%s"_

items.journal.regionlorepage$sewers.name=potargany list
items.journal.regionlorepage$sewers.desc=Coś, co przypomina list, jest napisane na zabrudzonym ziemią kawałku papieru. Musisz go podnieść, jeśli chcesz go przeczytać.

items.journal.regionlorepage$prison.name=potargana kartka z dziennika
items.journal.regionlorepage$prison.desc=Kartka z dziennika lub pamiętnika. Papier wygląda na stary i mimo że jest w lepszym stanie od listów znalezionych w kanałach, musisz go podnieść, żeby go przeczytać.

items.journal.regionlorepage$caves.name=stary wpis z pamiętnika
items.journal.regionlorepage$caves.desc=Coś, co przypomina wpis z dziennika badacza jest zaskakująco dobrze zachowane jak na swój wiek. Podnieś go, aby go przeczytać.

items.journal.regionlorepage$city.name=zardzewiała tabliczka
items.journal.regionlorepage$city.desc=Mała, zardzewiała tabliczka z magicznie wyrytą wiadomością. Litery są dobrze widoczne mimo wieku tabliczki, ale będziesz musiał ją podnieść, aby ją przeczytać.

items.journal.regionlorepage$halls.name=jaskrawa tabliczka
items.journal.regionlorepage$halls.desc=Mała, czarna tabliczka z świecącymi zielonymi literami, wyrytymi za pomocą magii. Z tej odległości litery zlewają się w niekształtną całość, musisz ją podnieść, żeby ją przeczytać.


###keys
items.keys.goldenkey.name=złoty klucz
items.keys.goldenkey.desc=Nacięcia na tym złotym kluczu są niewielkie i skomplikowane. Może otworzy zamkniętą skrzynię?

items.keys.crystalkey.name=Kryształowy klucz
items.keys.crystalkey.desc=Szlifowane krawędzie kryształowego klucza pobłyskują w ciemnościach. Czyżby służył do otwierania czegoś zrobionego z kryształu?

items.keys.ironkey.name=stalowy klucz
items.keys.ironkey.desc=Nacięcia na tym starożytnym kluczu są zużyte, skórzana smycz sponiewierana przez czas. Jakie drzwi może otworzyć?

items.keys.wornkey.name=zużyty klucz
items.keys.wornkey.desc=Ten klucz jest zużyty i przerdzewiały, ale wygląda na ważny. Najpewniej otwiera jakieś kluczowe drzwi.



###potions
items.potions.potion.ac_drink=PIJ
items.potions.potion.turquoise=turkusowa mikstura
items.potions.potion.crimson=szkarłatna mikstura
items.potions.potion.azure=lazurowa mikstura
items.potions.potion.jade=jadeitowa mikstura
items.potions.potion.golden=złota mikstura
items.potions.potion.magenta=malinowa mikstura
items.potions.potion.charcoal=węglowoczarna mikstura
items.potions.potion.ivory=kremowobiała mikstura
items.potions.potion.amber=bursztynowa mikstura
items.potions.potion.bistre=ciemnobrunatna mikstura
items.potions.potion.indigo=indygowa mikstura
items.potions.potion.silver=srebrna mikstura
items.potions.potion.unknown_desc=Ta fiolka zawiera wirujący, kolorowy płyn. Kto wie, co się stanie, gdy zostanie on wypity lub rzucony?
items.potions.potion.harmful=Szkodliwa mikstura!
items.potions.potion.beneficial=Dobra mikstura
items.potions.potion.yes=Tak, wiem co robię.
items.potions.potion.no=Nie, zmieniłem zdanie.
items.potions.potion.sure_drink=Jesteś pewien, że chcesz wypić tę miksturę? Zazwyczaj powinieneś rzucać takie mikstury w swoich przeciwników.
items.potions.potion.sure_throw=Jesteś pewien, że chcesz rzucić tą miksturą? Zazwyczaj najlepszym rozwiązaniem jest jej wypicie.
items.potions.potion.shatter=Fiolka pęka i płyn rozpryskuje się nieszkodliwie.
items.potions.potion.discover_hint=Ten przedmiot możesz znaleźć losowo w lochu lub stworzyć go za pomocą alchemii.
items.potions.potion$placeholder.name=mikstura
items.potions.potion$seedtopotion.name=Losowa mikstura

items.potions.potionofexperience.name=mikstura doświadczenia
items.potions.potionofexperience.desc=Zmagazynowane doświadczenia wielu bitew ograniczone do formy płynu, ten trunek zapewni ci automatyczne podniesienie poziomu.

items.potions.potionoffrost.name=mikstura mrozu
items.potions.potionoffrost.desc=Chemikalia w miksturze wyparują, a następnie zamarzną w powietrzu tworząc mroźną chmurę.

items.potions.potionofhaste.name=mikstura przyspieszenia
items.potions.potionofhaste.energetic=Czujesz pęd w nogach!
items.potions.potionofhaste.desc=Wypicie tej dziwnie słodkiej mikstury napełni cię sporą energią na krótki czas, pozwalając ci biegać szybciej.

items.potions.potionofhealing.name=mikstura uzdrawiająca
items.potions.potionofhealing.heal=Twoje rany zaczynają się zasklepiać.
items.potions.potionofhealing.desc=Mikstura, która w szybko odnowi twoje zdrowie i wyleczy wiele przypadłości.

items.potions.potionofinvisibility.name=mikstura niewidzialności
items.potions.potionofinvisibility.invisible=Twoje ręce stały się niewidzialne!
items.potions.potionofinvisibility.desc=Wypicie tego eliksiru sprawi, że staniesz się tymczasowo niewidzialny. Gdy jesteś niewidzialny, wrogowie nie będą w stanie cię dostrzec. Ataki fizyczne i efekty magiczne (takie jak zwoje i różdżki) natychmiast anulują niewidzialność.

items.potions.potionoflevitation.name=mikstura lewitacji
items.potions.potionoflevitation.float=Unosisz się w powietrze!
items.potions.potionoflevitation.desc=Wypicie tego osobliwego płynu sprawi, że zaczniesz unosić się w powietrzu, by bez wysiłku ominąć pułapki i otchłanie. Rzucenie tą miksturą stworzy chmurę gazu dezorientującego wszystko, co go wdycha.

items.potions.potionofliquidflame.name=mikstura ciekłych płomieni
items.potions.potionofliquidflame.desc=Ta fiolka zawiera niestabilną substancję, która po zetknięciu się z powietrzem stanie w płomieniach.

items.potions.potionofmindvision.name=mikstura wizji umysłów
items.potions.potionofmindvision.see_mobs=W jakiś sposób czujesz obecność umysłów okolicznych organizmów!
items.potions.potionofmindvision.see_none=Jakimś sposobem możesz powiedzieć, że jesteś w tym momencie sam na tej głębokości.
items.potions.potionofmindvision.desc=Po wypiciu tej mikstury twój umysł stanie się wrażliwy na psychiczną sygnaturę odległych istot, pozwalając tobie wyczuć biologiczną obecność przez ściany. Mikstura również pozwoli ci widzieć przez sąsiadujące ściany i drzwi.

items.potions.potionofparalyticgas.name=mikstura paraliżującego gazu
items.potions.potionofparalyticgas.desc=Po otwarciu ciecz w fiolce wyparuje, tworząc żółtą mgiełkę. Każdy, kto się nią zaciągnie, zostanie natychmiastowo sparaliżowany i nie będzie się mógł ruszyć przez pewien czas po tym, jak mgiełka rozrzedzi się. Ten przedmiot można rzucić na odległych wrogów, aby objąć ich efektem gazu.

items.potions.potionofpurity.name=mikstura czystości
items.potions.potionofpurity.freshness=Czujesz nadzwyczajną świeżość w powietrzu.
items.potions.potionofpurity.protected=Cienka błona z powietrza chroni cię!
items.potions.potionofpurity.desc=Ten magiczny odczynnik natychmiastowo neutralizuje wszystkie szkodliwe efekty obszarowe na dużym obszarze. Jego wypicie z kolei da ci tymczasową odporność przeciw tym efektom.

items.potions.potionofstrength.name=mikstura siły
items.potions.potionofstrength.msg=Nowo odkryta siła przepływa przez twoje ciało, masz teraz %d siły!
items.potions.potionofstrength.desc=Ten potężny eliksir popłynie prosto do twoich muskuł, permanentnie zwiększając twoją siłę o jeden punkt.

items.potions.potionoftoxicgas.name=mikstura toksycznego gazu
items.potions.potionoftoxicgas.desc=Odkorkowanie lub rozbicie tej fiolki pod ciśnieniem spowoduje, że jej zawartość wybuchnie w formie chmury zielonego, toksycznego gazu. Możesz zdecydować się rzucić tą miksturą zamiast odkorkowywać ją własnoręcznie.



###brews
items.potions.brews.brew.discover_hint=Ten przedmiot możesz stworzyć poprzez alchemię.

items.potions.brews.aquabrew.name=wodna mieszanina
items.potions.brews.aquabrew.desc=Gdy fiolka z mieszaniną zostanie rozbita, uwolni ona strumień wody pod ciśnieniem. Powstała w ten sposób eksplozja zaleje pobliski teren, rozbroi pułapki, zgasi płomienie i odrzuci postacie w pobliżu wybuchu. Dodatkowo, woda zada obrażenia wrogom, ale tylko tym związanym z ogniem.

items.potions.brews.blizzardbrew.name=burzowa mieszanina
items.potions.brews.blizzardbrew.desc=Rzucenie tej butelki spowoduje uwolnienie potężnej burzy śnieżnej, która rozprzestrzenia się jak gaz.

items.potions.brews.causticbrew.name=żrąca mieszanina
items.potions.brews.causticbrew.desc=Ta mieszanina rozbryzguje żrący szlam na dużym obszarze wokół miejsca, w którym upadnie. Wszystko w zasięgu działania będzie powoli się rozpadać, o ile szlam nie zostanie zmyty wodą.

items.potions.brews.infernalbrew.name=piekielna mieszanina
items.potions.brews.infernalbrew.desc=Rzucenie tej butelki spowoduje uwolnienie piekielnego ognia, który rozprzestrzenia się jak gaz.

items.potions.brews.shockingbrew.name=szokująca mieszanina
items.potions.brews.shockingbrew.desc=Rzucenie tej butelki spowoduje uwolnienie sztormu elektrycznego na szerokim obszarze od miejsca jej rozbicia.

items.potions.brews.unstablebrew.name=niestabilna mieszanina
items.potions.brews.unstablebrew.desc=Ta magiczna mieszanina świeci mieniącymi się kolorami tęczy.\n\nPo wypiciu lub rzuceniu aktywuje efekt losowej mikstury. Wywołany efekt będzie pozytywny, jeżeli ją wypijesz, a negatywny, jeżeli nią rzucisz.

###elixirs
items.potions.elixirs.elixir.discover_hint=Ten przedmiot możesz stworzyć poprzez alchemię.

items.potions.elixirs.elixirofarcanearmor.name=eliksir magicznej zbroi
items.potions.elixirs.elixirofarcanearmor.desc=Ten eliksir przyznaje pijącemu długotrwałą ochronę przeciwko magicznym obrażeniom.

items.potions.elixirs.elixirofaquaticrejuvenation.name=eliksir wodnego odnowienia
items.potions.elixirs.elixirofaquaticrejuvenation.desc=Ten eliksir posiada w sobie pozostałości Wielkiego Szlamu, napełnione leczniczą mocą. Nie zapewni natychmiastowego leczenia, lecz podczas stania w wodzie będzie powoli regenerował większą ilość życia niż mikstury uzdrawiające.
items.potions.elixirs.elixirofaquaticrejuvenation$aquahealing.name=wodne leczenie
items.potions.elixirs.elixirofaquaticrejuvenation$aquahealing.desc=Tymczasowo pozyskałeś lecznicze własności podobne do tych posiadanych przez Wielki Szlam.\n\nGdy stoisz w wodzie, będziesz regenerował małą ilość życia na turę. Efekt ten jest wstrzymany dopóki jesteś w pełni zdrowia lub poza wodą.\n\nPozostałe leczenie: %d.

items.potions.elixirs.elixirofdragonsblood.name=eliksir smoczej krwi
items.potions.elixirs.elixirofdragonsblood.desc=Po wypiciu ten eliksir da pijącemu ognistą moc płynącą w jego krwi. Ten efekt powoduje, że pijący jest odporny na ogień i może podpalać przeciwników fizycznymi ciosami.

items.potions.elixirs.elixiroffeatherfall.name=eliksir powolnego opadania
items.potions.elixirs.elixiroffeatherfall.light=Czujesz się lekki jak piórko!
items.potions.elixirs.elixiroffeatherfall.desc=Ten eliksir oferuje słabszy, ale bardziej kontrolowany efekt lewitacji, dzięki czemu pijący może przez krótki czas spadać na duże odległości bez szkody dla siebie.
items.potions.elixirs.elixiroffeatherfall$featherbuff.name=powolne opadanie
items.potions.elixirs.elixiroffeatherfall$featherbuff.desc=Jesteś pod wpływem eliksiru powolnego opadania, pozwalającego ci spadać w otchłań bez otrzymywania obrażeń!\n\nPozostałe tury efektu: %s.

items.potions.elixirs.elixirofhoneyedhealing.name=eliksir miodowego leczenia
items.potions.elixirs.elixirofhoneyedhealing.desc=Ten eliksir słodzi miksturę leczenia, dzięki czemu jest nawet smaczna. Po wypiciu uleczy w identyczny sposób, co mikstura leczenia, dodatkowo sycąc nieco bohatera. Eliksirem można też rzucić w przyjaciela, by go uleczyć.\n\nStworzenia kojarzące się z miodem mogą być uspokojone przez użycie na nich tego eliksiru.

items.potions.elixirs.elixiroficytouch.name=eliksir mroźnego dotyku
items.potions.elixirs.elixiroficytouch.desc=Po spożyciu eliksir pozwoli wykradać ciepło z wrogów podczas ataku. Ten efekt powoduje, że pijący jest odporny na mróz i może wychładzać przeciwników fizycznymi ciosami.

items.potions.elixirs.elixirofmight.name=eliksir mocy
items.potions.elixirs.elixirofmight.msg=Nowo odkryta siła przepływa przez twoje ciało, masz teraz %d siły!
items.potions.elixirs.elixirofmight.desc=Ten potężny eliksir popłynie prosto do twoich muskuł, permanentnie zwiększając twoją siłę o jeden punkt i wytrzymałość o %d punktów. Zwiększenie wytrzymałości zwiększa się wraz z poziomem twojego maksymalnego zdrowia, ale powoli się wyczerpie w trakcie zdobywania poziomów doświadczenia.
items.potions.elixirs.elixirofmight$htboost.name=zwiększenie maksymalnego zdrowia
items.potions.elixirs.elixirofmight$htboost.desc=Czujesz w sobie nadnaturalną siłę i witalność.\n\nTwoje maksymalne zdrowie jest podniesione na dłuższy okres czasu. Wzmocnienie to zacznie zanikać wraz ze zdobywaniem kolejnych poziomów doświadczenia.\n\nAktualne wzmocnienie: %d.\nLiczba pozostałych poziomów: %d.

items.potions.elixirs.elixiroftoxicessence.name=eliksir toksycznej esencji
items.potions.elixirs.elixiroftoxicessence.desc=Po wypiciu ten eliksir przepełni pijącego toksyczną energią. Pijący zacznie wydzielać z siebie toksyczny gaz podczas poruszania się oraz zyska odporność na toksyny i truciznę na czas nieco dłuższy niż czas trwania efektu.



###exotic potions
items.potions.exotic.exoticpotion.turquoise=egzotyczny turkusowy eliksir
items.potions.exotic.exoticpotion.crimson=egzotyczny szkarłatny eliksir
items.potions.exotic.exoticpotion.azure=egzotyczny lazurowy eliksir
items.potions.exotic.exoticpotion.jade=egzotyczny jadeitowy eliksir
items.potions.exotic.exoticpotion.golden=egzotyczny złoty eliksir
items.potions.exotic.exoticpotion.magenta=egzotyczny malinowy eliksir
items.potions.exotic.exoticpotion.charcoal=egzotyczny węglowoczarny eliksir
items.potions.exotic.exoticpotion.ivory=egzotyczny kremowobiały eliksir
items.potions.exotic.exoticpotion.amber=egzotyczny bursztynowy eliksir
items.potions.exotic.exoticpotion.bistre=egzotyczny ciemnobrunatny eliksir
items.potions.exotic.exoticpotion.indigo=egzotyczny indygowy eliksir
items.potions.exotic.exoticpotion.silver=egzotyczny srebrny eliksir
items.potions.exotic.exoticpotion.unknown_desc=Ta okrągła fiolka zawiera kolorową zawiesinę. Wydaje się być obcym dla tych ziem. Kto wie, co się stanie, gdy zostanie rzucona lub wypita?
items.potions.exotic.exoticpotion.warning=Czy jesteś pewien, że chcesz porzucić użycie tej mikstury? Zostanie ona zużyta tak czy inaczej.
items.potions.exotic.exoticpotion.yes=Tak, jestem pewny.
items.potions.exotic.exoticpotion.no=Nie, zmieniłem zdanie.
items.potions.exotic.exoticpotion.discover_hint=Ten przedmiot możesz stworzyć poprzez alchemię.

items.potions.exotic.potionofcleansing.name=eliksir oczyszczenia
items.potions.exotic.potionofcleansing.desc=Ten silny odczynnik na kilka tur zablokuje działanie wszystkich szkodliwych efektów u osoby, która go wypije. Może także zostać rzucony w dowolny cel, by go z nich oczyścić.
items.potions.exotic.potionofcleansing$cleanse.name=oczyszczenie
items.potions.exotic.potionofcleansing$cleanse.desc=Ta postać jest tymczasowo odporna na wszystkie szkodliwe efekty!\n\nPozostałe tury efektu: %s.

items.potions.exotic.potionofcorrosivegas.name=eliksir żrącego gazu
items.potions.exotic.potionofcorrosivegas.desc=Odkorkowanie lub rozbicie tej fiolki pod ciśnieniem spowoduje, że jej zawartość wybuchnie w formie śmiercionośnej chmury rdzawego, żrącego gazu. Gaz szybciej się rozprzestrzenia i jest bardziej zabójczy od toksycznego gazu, ale szybciej się ulatnia.

items.potions.exotic.potionofdragonsbreath.name=eliksir smoczego oddechu
items.potions.exotic.potionofdragonsbreath.prompt=Wybierz miejsce do spalenia
items.potions.exotic.potionofdragonsbreath.desc=Ta fiolka zawiera niecodzienną mieszaninę, która gwałtownie stanie w płomieniach po krótkiej chwili od zmieszania ze śliną. Szybkie wyplucie płynu pozwoli użytkownikowi miotać ogniem z ust!

items.potions.exotic.potionofearthenarmor.name=eliksir kamiennej skóry
items.potions.exotic.potionofearthenarmor.desc=Zamiast paraliżować, ten płyn powoduje stwardnienie skóry użytkownika, tymczasowo zmieniając ją w naturalną zbroję.

items.potions.exotic.potionofdivineinspiration.name=eliksir boskiej inspiracji
items.potions.exotic.potionofdivineinspiration.no_more_points=Nie możesz uzyskać więcej dodatkowych punktów talentu.
items.potions.exotic.potionofdivineinspiration.select_tier=Wybierz krąg talentów, który ma uzyskać dwa dodatkowe punkty. Musisz mieć dostęp do kręgu, by wydać punkty.
items.potions.exotic.potionofdivineinspiration.bonus=+2 punkty talentu!
items.potions.exotic.potionofdivineinspiration.desc=Potęga boskiej energii zamknięta w eliksirze, która wypełni pijącego boską mocą, dając mu dwa dodatkowe punkty talentu w wybranym przez niego kręgu.\n\nTen eliksir może być użyty tylko raz na każdy krąg talentów.

items.potions.exotic.potionofmagicalsight.name=eliksir magicznego wzroku
items.potions.exotic.potionofmagicalsight.desc=Po wypiciu tego eliksiru, twoje zmysły na krótko zostaną wyostrzone do niewiarygodnych poziomów, co pozwoli Ci widzieć przez ściany w promieniu 12 kafelków!

items.potions.exotic.potionofmastery.name=eliksir mistrzostwa
items.potions.exotic.potionofmastery.prompt=Opanuj Przedmiot
items.potions.exotic.potionofmastery.weapon_easier=Twoja broń staje się łatwiejsza w użyciu!
items.potions.exotic.potionofmastery.armor_easier=Twój pancerz staje się łatwiejszy w użyciu!
items.potions.exotic.potionofmastery.desc=Zamiast zwiększać siłę, ten eliksir przystosowuje mięśnie pijącego do danego przedmiotu. Sprawia to, że przedmiot jest łatwiejszy w użyciu, jak gdyby bohater był zaznajomiony z przedmiotem i miał związaną z nim pamięć mięśniową.\n\nWybrana broń lub pancerz będzie wymagać 2 mniej siły do użycia. Ten eliksir może być użyty tylko raz na każdy przedmiot.

items.potions.exotic.potionofshielding.name=eliksir tarczy
items.potions.exotic.potionofshielding.desc=Zamiast leczyć, ten eliksir utworzy wytrzymałą tarczę wokół ciała użytkownika, blokując sporą ilość obrażeń.

items.potions.exotic.potionofshroudingfog.name=eliksir okrywającej mgły
items.potions.exotic.potionofshroudingfog.desc=W kontakcie z powietrzem płyn w tej fiolce zmieni się w gęstą chmurę szybko rozprzestrzeniających się oparów, które całkowicie blokują pole widzenia przeciwników.

items.potions.exotic.potionofsnapfreeze.name=eliksir błyskawicznego mrozu
items.potions.exotic.potionofsnapfreeze.desc=Składniki zawarte w tej miksturze gwałtownie reagują z powietrzem, natychmiastowo zamrażając i unieruchamiając wszystko w jej zasięgu.

items.potions.exotic.potionofstamina.name=eliksir kondycji
items.potions.exotic.potionofstamina.desc=Wypicie tego dziwnie słodkiego płynu da ci długotrwały zastrzyk energii, który pozwala na szybszy chód przez dłuższy okres czasu.

items.potions.exotic.potionofstormclouds.name=eliksir burzowych chmur
items.potions.exotic.potionofstormclouds.desc=Rzucenie tej butelki uwolni szybko rozprzestrzeniający się obłok skoncentrowanej pary, która skondensuje się i zaleje otoczenie deszczem. Woda zaleje większość typów terenu, zada obrażenia ognistym stworzeniom, zgasi ogień i unieszkodliwi pułapki.



###quest items
items.quest.ceremonialcandle.name=uroczysta świeca
items.quest.ceremonialcandle.desc=Zestaw świec, stopionych i połączonych razem przez ich użytkowanie.\n\nOddzielnie są bezużyteczne, ale ustawione w odpowiedni wzór, mogą ukierunkować energię potrzebną do rytuału przywołania.
items.quest.ceremonialcandle.discover_hint=Ten przedmiot możesz znaleźć podczas pewnego zadania.

items.quest.corpsedust.name=pył cmentarny
items.quest.corpsedust.chill=Pewien dreszcz przeszywa ci ciało...
items.quest.corpsedust.desc=Ta kula pyłu cmentarnego na pierwszy rzut oka nie różni się zwykłych kulek pyłu, ale czujesz dochodzącą z niej złowieszczą magię.\n\nPozbycie się jej tak szybko, jak to możliwe, byłoby dobrym pomysłem.
items.quest.corpsedust.discover_hint=Ten przedmiot możesz znaleźć podczas pewnego zadania.

items.quest.darkgold.name=ruda ciemnego złota
items.quest.darkgold.you_now_have=Teraz masz %d ciemnego złota.
items.quest.darkgold.desc=Ten metal nie nazywa się ciemnym z powodu jego koloru (nie różni się nim od zwykłego złota), ale dlatego, że topi się pod światłem dziennym, co czyni go bezużytecznym na powierzchni.
items.quest.darkgold.discover_hint=Ten przedmiot możesz znaleźć podczas pewnego zadania.

items.quest.dwarftoken.name=krasnoludzki żeton
items.quest.dwarftoken.desc=Wielu Krasnoludów i niektóre z ich większych wytworów noszą te małe kawałki metalu. Być może to jakaś biżuteria albo identyfikator. Krasnoludy są dziwne.
items.quest.dwarftoken.discover_hint=Ten przedmiot możesz znaleźć podczas pewnego zadania.

items.quest.embers.name=niedopałki żywiołów
items.quest.embers.desc=Specjalne niedopałki, które mogą zostać uzyskane tylko z młodych żywiołaków ognia. Promieniują ciepłem.
items.quest.embers.discover_hint=Ten przedmiot możesz znaleźć podczas pewnego zadania.

items.quest.escapecrystal.name=kryształ powrotu
items.quest.escapecrystal.ac_use=UŻYJ
items.quest.escapecrystal.desc=Ten cienki magiczny kryształ zawiera w sobie zaklęcie teleportacji. Możesz go użyć w dowolnym momencie, by opuścić krasnoludzki skarbiec, ale nie będziesz w stanie nic ze sobą wziąć!
items.quest.escapecrystal.discover_hint=Ten przedmiot możesz znaleźć podczas pewnego zadania.

items.quest.gooblob.name=kawał Wielkiego Szlamu
items.quest.gooblob.desc=Kawał trzęsącego się szlamu, który oderwał się od Wielkiego Szlamu przy jego śmierci. Przypomina nieco kulę galaretki, ale nie odważyłbyś się go zjeść.\n\nSam w sobie jest bezużyteczny, ale może się przydać do tworzenia niektórych mikstur i bomb. W najgorszym wypadku będzie dobrym źródłem energii alchemicznej.
items.quest.gooblob.discover_hint=Ten przedmiot możesz dostać jako łup z pewnych przeciwników.

items.quest.metalshard.name=przeklęty kawał złomu
items.quest.metalshard.desc=Kawał zardzewiałego złomu, który oderwał się od DM-300 po jego zniszczeniu. Wyczuwasz złą, lecz nieaktywną magię w środku.\n\nSam z siebie jest bezużyteczny, ale może się przydać do tworzenia niektórych zwojów lub pewnej bomby. W najgorszym wypadku będzie dobrym źródłem energii alchemicznej.
items.quest.metalshard.discover_hint=Ten przedmiot możesz dostać jako łup z pewnych przeciwników.

items.quest.pickaxe.name=kilof
items.quest.pickaxe.ability_name=przebicie
items.quest.pickaxe.ability_desc=Fechmistrzyni może _przebić_ przeciwnika kilofem. Ten atak zawsze trafia, zadając normalne obrażenia i odsłaniając cel na 3 tury. Zadaje _%1$d-%2$d obrażeń_ przeciwnikom z twardą skórą.
items.quest.pickaxe.upgrade_ability_stat_name=Obrażenia Umiejętności
items.quest.pickaxe.desc=Solidne i ciężkie narzędzie przeznaczone do kruszenia skał. Nie musisz go wyposażać jako broń, aby nim kopać, ale prawdopodobnie możesz to zrobić w razie nagłej potrzeby.
items.quest.pickaxe.discover_hint=Ten przedmiot możesz znaleźć podczas pewnego zadania.

items.quest.ratskull.name=czaszka wielkiego szczura
items.quest.ratskull.desc=Ogromna czaszka szczura. Mogłaby posłużyć za wspaniałe trofeum myśliwskie, gdybyś tylko miał jakąś ścianę, by na niej ją powiesić.



###remains
items.remains.remainsitem.ac_use=UŻYJ
items.remains.remainsitem.discover_hint=Ten przedmiot możesz znaleźć w szczątkach pewnego bohatera z poprzedniego przegranego podejścia.

items.remains.bowfragment.name=fragment łuku
items.remains.bowfragment.desc=Ten połamany fragment drewna był kiedyś częścią łuku dusz poległej Łowczyni. We fragmencie wciąż wyczuwasz odrobinę energii natury, z której możesz skorzystać, by spowodować wzrost wysokiej trawy wokół ciebie. Spowoduje to jednak zniszczenie fragmentu łuku.

items.remains.brokenhilt.name=złamana rękojeść
items.remains.brokenhilt.desc=Ta złamana rękojeść wygląda, jakby pochodziła z broni pokonanej Fechmistrzyni. W rękojeści wciąż można wyczuć odrobinę mocy bojowej, którą można wykorzystać, aby uzyskać dodatkowe obrażenia przy kolejnych dwóch atakach w walce wręcz. Spowoduje to jednak zniszczenie rękojeści.

items.remains.brokenstaff.name=złamany kostur
items.remains.brokenstaff.desc=Ten kostur Maga został złamany wpół po śmierci jej właściciela. Wciąż wyczuwalna jest w nim energia magiczna, której możesz użyć, aby nieco naładować swoje różdżki. Spowoduje to jednak zniszczenie kostura.

items.remains.cloakscrap.name=skrawek tkaniny
items.remains.cloakscrap.desc=Ten skrawek półprzezroczystej tkaniny wygląda, jakby pochodził z opończy cieni zmarłego już Łotrzyka. Wciąż wyczuwalna jest w nim odrobina mistycznej energii, którą można wykorzystać do doładowania artefaktów. Spowoduje to jednak zniszczenie tkaniny.

items.remains.sealshard.name=odłamki pieczęci
items.remains.sealshard.desc=Te małe odłamki czerwonego wosku wyglądają, jakby pochodziły z pieczęci poległego Wojownika. Czujesz odrobinę siły woli bijącą z wnętrza pieczęci. Możesz ich użyć, aby zapewnić sobie odrobinę osłony, ale zniszczy to jednak odłamki pieczęci.

items.remains.tornpage.name=podarta strona
items.remains.tornpage.desc=Ta strona wygląda, jakby została wyrwana z niegdyś świętej księgi Kleryka. Wciąż jest w niej trochę boskiej energii, której możesz użyć, aby odzyskać trochę zdrowia. Spowoduje to jednak zniszczenie podartej strony.



###rings
items.rings.ring.diamond=pierścień z diamentem
items.rings.ring.opal=pierścień z opalem
items.rings.ring.garnet=pierścień z granatem
items.rings.ring.ruby=pierścień z rubinem
items.rings.ring.amethyst=pierścień z ametystem
items.rings.ring.topaz=pierścień z topazem
items.rings.ring.onyx=pierścień z onyksem
items.rings.ring.tourmaline=pierścień z turmalinem
items.rings.ring.emerald=pierścień ze szmaragdem
items.rings.ring.sapphire=pierścień z szafirem
items.rings.ring.quartz=pierścień z kwarcem
items.rings.ring.agate=pierścień z agatem
items.rings.ring.equip_cursed=Pierścień boleśnie zaciska się wokół twojego palca!
items.rings.ring.unknown_desc=Ten metalowy pierścień jest przystrojony wielkim klejnotem, który lśni w ciemnościach. Kto wie, jaki efekt da założenie go?
items.rings.ring.known=To %s.
items.rings.ring.identify=Jesteś wystarczająco zaznajomiony ze swoim pierścieniem, by go zidentyfikować.
items.rings.ring.cursed_worn=Ten pierścień jest przeklęty, nie jesteś w stanie go zdjąć.
items.rings.ring.curse_known=Wyczuwasz czarną magię czającą się w tym pierścieniu.
items.rings.ring.not_cursed=Ten pierścień jest wolny od czarnej magii.

items.rings.ringofaccuracy.name=pierścień celności
items.rings.ringofaccuracy.stats=Gdy założony, ten pierścień zwiększy twoją celność o _%s%%_.
items.rings.ringofaccuracy.typical_stats=Podobne pierścienie zwykle zwiększają celność ataków o _%s%%_.
items.rings.ringofaccuracy.combined_stats=Twoje pierścienie łączą swoją moc, zwiększając razem twoją celność o _%s%%_.
items.rings.ringofaccuracy.upgrade_stat_name_1=Zwiększenie Celności
items.rings.ringofaccuracy.desc=Ten pierścień zwiększa twoją koncentrację, ułatwiając ci trafienie w cel. Przeklęty pierścień utrudni ci zranienie przeciwnika.

items.rings.ringofarcana.name=pierścień tajemnych mocy
items.rings.ringofarcana.stats=Gdy założony, ten pierścień zwiększy moc zaklęć i glifów o _%s%%_.
items.rings.ringofarcana.typical_stats=Podobne pierścienie zwykle zwiększają moc zaklęć i glifów o _%s%%_.
items.rings.ringofarcana.combined_stats=Twoje pierścienie łączą swoją moc, zwiększając razem moc twoich glifów i zaklęć o _%s%%_.
items.rings.ringofarcana.upgrade_stat_name_1=Wzmocnienie Magii
items.rings.ringofarcana.desc=Ten pierścień wzmacnia zaklęcia znajdujące się na broni i glify na pancerzu, ale działa też w przypadku klątw! Zwiększa on zarówno ich szanse na aktywację, jak i siłę ich efektów, gdy szansa na aktywację wynosi 100%. Przeklęty pierścień osłabi zaś działanie zaklęć, glifów i klątw.

items.rings.ringofelements.name=pierścień żywiołów
items.rings.ringofelements.stats=Gdy założony, ten pierścień zwiększy twoją odporność na żywioły o _%s%%_.
items.rings.ringofelements.typical_stats=Podobne pierścienie zwykle zwiększają odporność na żywioły o _%s%%_.
items.rings.ringofelements.combined_stats=Twoje pierścienie łączą swoją moc, zapewniając razem _%s%%_ odporności na żywioły.
items.rings.ringofelements.upgrade_stat_name_1=Odporność na Żywioły
items.rings.ringofelements.desc=Ten pierścień zwiększa odporność noszącego na większość efektów magicznych i tych związanych z żywiołami, zmniejszając obrażenia i czas trwania negatywnych efektów. Przeklęty pierścień zwiększy szkodliwość tych efektów.

items.rings.ringofenergy.name=pierścień energii
items.rings.ringofenergy.stats=Gdy założony, ten pierścień zwiększy prędkość ładowania różdżek, artefaktów i umiejętności zbroi o _%s%%_.
items.rings.ringofenergy.typical_stats=Podobne pierścienie zwykle zwiększają prędkość ładowania różdżek, artefaktów i umiejętności zbroi o _%s%%_.
items.rings.ringofenergy.combined_stats=Twoje pierścienie łączą swoją moc, zwiększając razem prędkość ładowania o _%s%%_.
items.rings.ringofenergy.upgrade_stat_name_1=Zwiększenie Szybkości Ładowania
items.rings.ringofenergy.desc=Twój magiczny ekwipunek będzie się szybciej ładować w magicznym polu promieniującym z tego pierścienia. Przeklęty pierścień spowolni jego ładowanie.

items.rings.ringofevasion.name=pierścień uników
items.rings.ringofevasion.stats=Gdy założony, ten pierścień zwiększy twoją umiejętność unikania o _%s%%_.
items.rings.ringofevasion.typical_stats=Podobne pierścienie zwykle zwiększają umiejętność unikania o _%s%%_.
items.rings.ringofevasion.combined_stats=Twoje pierścienie łączą swoją moc, zwiększając razem twoją zdolność unikania o _%s%%_.
items.rings.ringofevasion.upgrade_stat_name_1=Zwiększenie Uniku
items.rings.ringofevasion.desc=Ten pierścień przyspiesza reakcję noszącego, ułatwiając mu unik przed wrogimi ciosami. Przeklęty pierścień ułatwi wrogom trafienie nosiciela.

items.rings.ringofforce.name=pierścień siły
items.rings.ringofforce.stats=Przy braku broni wręcz i przy twojej aktualnej sile, ten pierścień zadaje _%1$d-%2$d obrażeń_. Z założoną bronią pierścień ten zwiększy obrażenia o _%3$d_.
items.rings.ringofforce.typical_stats=Przy braku broni wręcz i przy twojej aktualnej sile podobne pierścienie zwykle zadają _%1$d-%2$d obrażeń_. Z założoną bronią podobne pierścienie zwykle zwiększają obrażenia o _%3$d_.
items.rings.ringofforce.combined_stats=Twoje pierścienie łączą swoją moc, zadając razem _%1$d-%2$d obrażeń_ bez broni lub zwiększając obrażenia wyposażonej broni o _%3$d_.
items.rings.ringofforce.upgrade_stat_name_1=Obrażenia Pięściami
items.rings.ringofforce.upgrade_stat_name_2=Zwiększenie Obrażeń Broni Białej
items.rings.ringofforce.upgrade_stat_name_3=Obrażenia Umiejętności
items.rings.ringofforce.ability_name=postawa awanturnika
items.rings.ringofforce.typical_ability_desc=Korzystając z tego pierścienia, Fechmistrzyni może przyjąć _postawę awanturniczki_, powodującą, że jej zwykłe ataki zawsze będą używać tego pierścienia, nawet gdy ma wyposażoną broń. Te ataki zazwyczaj zadają _%1$d-%2$d obrażeń_, dziedziczą zaklęcie oraz wzmocnienie broni. Ta postawa spowalnia prędkość odzyskiwania ładunków broni o 50%%.
items.rings.ringofforce.ability_desc=Korzystając z tego pierścienia, Fechmistrzyni może przyjąć _postawę awanturniczki_, powodującą, że jej zwykłe ataki zawsze będą używać tego pierścienia, nawet gdy ma wyposażoną broń. Te ataki zadają _%1$d-%2$d_ obrażeń_, dziedziczą zaklęcie oraz wzmocnienie broni. Ta postawa spowalnia prędkość ładowania broni o 50%%.
items.rings.ringofforce.desc=Ten pierścień wzmacnia siłę ataków bohatera. Nie daje wiele, gdy ten dzierży bronie, lecz atak bez broni będzie dużo silniejszy. Przeklęty pierścień zmniejszy siłę ataku.
items.rings.ringofforce$brawlersstance.name=postawa awanturnika
items.rings.ringofforce$brawlersstance.desc=Podczas przyjmowania tej postawy, regularne ataki Fechmistrzyni będą używać wyposażonego pierścienia siły, nawet gdy ma ona wyposażoną broń. Ataki te zyskują dodatkowe obrażenia i nadal wykorzystują rozszerzenie oraz zaklęcie broni.\n\nUtrzymanie tej postawy wymaga skupienia, co redukuje prędkość ładowania zdolności broni o 50%.\n\nTę postawę można włączać i wyłączać, używając pierścienia siły, jednak redukcja prędkości ładowania będzie utrzymywać się przez pewien czas, jeśli postawa zostanie szybko włączona i wyłączona.

items.rings.ringoffuror.name=pierścień furii
items.rings.ringoffuror.stats=Gdy założony, ten pierścień zwiększy twoją prędkość ataku o _%s%%._
items.rings.ringoffuror.typical_stats=Podobne pierścienie zwykle zwiększają prędkość ataku o _%s%%._
items.rings.ringoffuror.combined_stats=Twoje pierścienie łączą swoją moc, zwiększając razem prędkość twoich ataków o _%s%%_.
items.rings.ringoffuror.upgrade_stat_name_1=Zwiększenie Prędkości Ataku
items.rings.ringoffuror.desc=Ten pierścień wprowadza bohatera w stan furii, umożliwiając mu szybsze wyprowadzanie ataków. Przeklęty pierścień spowalnia ataki bohatera.

items.rings.ringofhaste.name=pierścień szybkości
items.rings.ringofhaste.stats=Gdy założony, ten pierścień zwiększy twoją prędkość poruszania się o _%s%%._
items.rings.ringofhaste.typical_stats=Podobne pierścienie zwykle zwiększają prędkość poruszania się o _%s%%._
items.rings.ringofhaste.combined_stats=Twoje pierścienie łączą swoją moc, zwiększając razem prędkość twojego ruchu o _%s%%_.
items.rings.ringofhaste.upgrade_stat_name_1=Zwiększenie Szybkości Chodzenia
items.rings.ringofhaste.desc=Ten pierścień sprawia, że bohater czuje się lżejszy, co pozwala mu na poruszanie się z nadludzką prędkością. Przeklęty pierścień zaś spowolni bohatera.

items.rings.ringofmight.name=pierścień mocy
items.rings.ringofmight.stats=Gdy założony, ten pierścień zwiększy twoją siłę o _%1$d_ i twoje maksymalne zdrowie o _%2$s%%._
items.rings.ringofmight.typical_stats=Podobne pierścienie zwykle zwiększają siłę o _%1$d_ i maksymalne zdrowie o _%2$s%%._
items.rings.ringofmight.combined_stats=Twoje pierścienie łączą swoją moc, podwyższając razem twoją siłę o _%1$d_ i maksymalne zdrowie o _%2$s%%_.
items.rings.ringofmight.upgrade_stat_name_1=Zwiększenie Siły
items.rings.ringofmight.upgrade_stat_name_2=Zwiększenie Maks. PŻ
items.rings.ringofmight.desc=Ten pierścień zwiększa fizyczne cechy bohatera, dając mu większą siłę i wytrzymałość. Przeklęty pierścień osłabi bohatera.

items.rings.ringofsharpshooting.name=pierścień precyzji
items.rings.ringofsharpshooting.stats=Gdy założony, ten pierścień zwiększy obrażenia broni miotanych, jak gdyby ich poziom był zwiększony o _%1$d_ i polepszy ich wytrzymałość o _%2$s%%_.
items.rings.ringofsharpshooting.typical_stats=Podobne pierścienie zwykle zwiększają obrażenia broni miotanych, jak gdyby ich poziom był zwiększony o _%1$d_ i polepszają ich wytrzymałość o _%2$s%%_.
items.rings.ringofsharpshooting.combined_stats=Twoje pierścienie łączą swoją moc, zwiększając razem efektywny poziom broni miotanej o _%1$d_ i zwiększając jej wytrzymałość o _%2$s%%_.
items.rings.ringofsharpshooting.upgrade_stat_name_1=Zwiększenie Obrażeń od Poziomu
items.rings.ringofsharpshooting.upgrade_stat_name_2=Zwiększenie Trwałości
items.rings.ringofsharpshooting.desc=Ten pierścień zwiększa precyzję bohatera, co sprawia, że wszystkie bronie dystansowe są bardziej celne i wytrzymałe. Przeklęty pierścień ma odwrotny efekt.

items.rings.ringoftenacity.name=pierścień wytrwałości
items.rings.ringoftenacity.stats=Gdy założony, ten pierścień zmniejszy otrzymywane obrażenia o maksymalnie _%s%%_.
items.rings.ringoftenacity.typical_stats=Podobne pierścienie zwykle zmniejszają otrzymywane obrażenia o maksymalnie _%s%%_.
items.rings.ringoftenacity.combined_stats=Twoje pierścienie łączą swoją moc, razem zmniejszając otrzymywane obrażenia o maksymalnie _%s%%_.
items.rings.ringoftenacity.upgrade_stat_name_1=Maks. Redukcja Obrażeń
items.rings.ringoftenacity.desc=Ten pierścień pozwala noszącemu przeżyć normalnie zabójcze dla niego ataki. Im bardziej ranny jest nosiciel, tym bardziej będzie odporny na obrażenia. Przeklęty pierścień ułatwi natomiast uśmiercenie noszącego.

items.rings.ringofwealth.name=pierścień dostatku
items.rings.ringofwealth.stats=Gdy założony, ten pierścień zwiększy twoje szczęście o _%s%%._
items.rings.ringofwealth.typical_stats=Podobne pierścienie zwykle zwiększają szczęście o _%s%%._
items.rings.ringofwealth.combined_stats=Twoje pierścienie łączą swoją moc, zwiększając razem twoje szczęście o _%s%%_.
items.rings.ringofwealth.upgrade_stat_name_1=Zwiększenie Szczęścia
items.rings.ringofwealth.desc=Ten pierścień działa jak magnes na skarby, zwiększając szansę na to, że znajdziesz wartościowe przedmioty w różnego rodzaju skrzyniach lub przy ciałach wrogów. Przeklęty pierścień zmniejszy szansę na otrzymanie przedmiotów.



###scrolls
items.scrolls.scroll.ac_read=CZYTAJ
items.scrolls.scroll.kaunan=zwój KAUNAN
items.scrolls.scroll.sowilo=zwój SOWILO
items.scrolls.scroll.laguz=zwój LAGUZ
items.scrolls.scroll.yngvi=zwój YNGVI
items.scrolls.scroll.gyfu=zwój GYFU
items.scrolls.scroll.raido=zwój RAIDO
items.scrolls.scroll.isaz=zwój ISAZ
items.scrolls.scroll.mannaz=zwój MANNAZ
items.scrolls.scroll.naudiz=zwój NAUDIZ
items.scrolls.scroll.berkanan=zwój BERKANAN
items.scrolls.scroll.odal=zwój ODAL
items.scrolls.scroll.tiwaz=zwój TIWAZ
items.scrolls.scroll.unknown_desc=Na tym pergaminie została zapisana nieznana, magiczna runa. Kto wie, co się stanie, gdy zostanie przeczytana na głos?
items.scrolls.scroll.blinded=Nie możesz odczytać zwoju gdy jesteś oślepiony.
items.scrolls.scroll.no_magic=Nie możesz czytać zwoju kiedy jesteś odporny na magię.
items.scrolls.scroll.cursed=Twoja przeklęta księga zaklęć uniemożliwia ci wywołanie mocy tego zwoju! Zwój zdjęcia klątwy może być wystarczająco silny, by dalej działać...
items.scrolls.scroll$placeholder.name=zwój

items.scrolls.inventoryscroll.warning=Czy jesteś pewien, że chcesz porzucić użycie tego zwoju? Zwój nie był zidentyfikowany, więc zostanie on zużyty tak czy inaczej.
items.scrolls.inventoryscroll.yes=Tak, jestem pewny.
items.scrolls.inventoryscroll.no=Nie, zmieniłem zdanie.

items.scrolls.scrollofidentify.name=zwój identyfikacji
items.scrolls.scrollofidentify.inv_title=Zidentyfikuj przedmiot
items.scrolls.scrollofidentify.it_is=Twój przedmiot został zidentyfikowany: %s.
items.scrolls.scrollofidentify.desc=Ten zwój na stałe zdradza wszystkie sekrety jednego wybranego przedmiotu.

items.scrolls.scrolloflullaby.name=zwój kołysanki
items.scrolls.scrolloflullaby.sooth=Zwój wydaje z siebie kojącą muzykę. Czujesz się bardzo śpiący.
items.scrolls.scrolloflullaby.desc=Przeczytanie tego zwoju wyemituje kojącą melodię, która uśpi magicznym snem każdego, kto wsłucha się w jej dźwięk. Dla czytającego i jego sojuszników sen ma właściwości uzdrawiające.

items.scrolls.scrollofmagicmapping.name=zwój magicznej mapy
items.scrolls.scrollofmagicmapping.layout=Poznano układ bieżącego piętra lochu.
items.scrolls.scrollofmagicmapping.desc=Po przeczytaniu zwoju klarowny obraz zostanie wpojony do twojego umysłu. Dzięki niemu poznasz dokładny rozkład poziomu i wszystkie jego sekrety. Lokalizacja przedmiotów i potworów pozostanie nieznana.

items.scrolls.scrollofmirrorimage.name=zwój lustrzanego odbicia
items.scrolls.scrollofmirrorimage.copies=Zwój tworzy lustrzane odbicia ciebie.
items.scrolls.scrollofmirrorimage.no_copies=Zwój próbuje utworzyć twoje lustrzane odbicia, ale nie mają one gdzie się pojawić.
items.scrolls.scrollofmirrorimage.desc=Inkantacja zapisana na tym zwoju stworzy dwa iluzoryczne bliźniaki odczytującego. Będą one słabsze od czytelnika i będą ścigać swoich wrogów. Niestety, nie są wytrzymałe i znikają natychmiast po otrzymaniu jakichkolwiek obrażeń.

items.scrolls.scrollofretribution.name=zwój zemsty
items.scrolls.scrollofretribution.blast=Zwój wybucha potężną energią magiczną!
items.scrolls.scrollofretribution.desc=Ten zwój zawiera niszczącą energię, która łączy się z bólem czytelnika, który zasili wielki wybuch mocy. Im słabszy czytelnik jest, tym więcej obrażeń zada. Bycie na bardzo niskim zdrowiu może nawet zabić większość wrogów.\n\nZwój jednak ma zły skutek na czytelniku, oślepiając i osłabiając go.

items.scrolls.scrollofrage.name=zwój szału
items.scrolls.scrollofrage.roar=Ten zwój wydaje rozsierdzający ryk, który rozbrzmiewa w całym lochu!
items.scrolls.scrollofrage.desc=Przeczytany na głos, ten zwój uwolni głośny ryk, który przyciągnie wszystkich przeciwników do czytającego i rozwścieczy tych pobliskich.

items.scrolls.scrollofrecharging.name=zwój ładowania
items.scrolls.scrollofrecharging.surge=Przypływ pola energetycznego przebiega przez twoje ciało, wzmacniając twoje różdżki!
items.scrolls.scrollofrecharging.desc=W tym pergaminie zawarta jest surowa magiczna moc. Gdy zostanie uwolniona, z czasem naładuje wszystkie różdżki użytkownika.

items.scrolls.scrollofremovecurse.name=zwój zdjęcia klątwy
items.scrolls.scrollofremovecurse.inv_title=Zdejmij klątwę z przedmiotu
items.scrolls.scrollofremovecurse.cleansed=Twój przedmiot świeci się oczyszczającym światłem. Złowroga magia zanika!
items.scrolls.scrollofremovecurse.not_cleansed=Twój przedmiot świeci się oczyszczającym światłem. Nic się nie dzieje.
items.scrolls.scrollofremovecurse.spirit=Twój zwój ratuje udręczoną duszę!
items.scrolls.scrollofremovecurse.desc=Inkantacja zapisana na tym zwoju natychmiastowo zdejmie klątwę z pojedynczej broni, pierścienia, różdżki, zbroi lub artefaktu.

items.scrolls.scrollofteleportation.name=zwój teleportacji
items.scrolls.scrollofteleportation.tele=W okamgnieniu zostałeś teleportowany do innego miejsca w lochu.
items.scrolls.scrollofteleportation.no_tele=Magia teleportacji nie zadziałała.
items.scrolls.scrollofteleportation.cant_reach=Nie możesz się tutaj teleportować.
items.scrolls.scrollofteleportation.prompt=Wybierz miejsce do teleportacji
items.scrolls.scrollofteleportation.desc=Zaklęcie na tym pergaminie natychmiastowo przenosi czytelnika do innego miejsca na obecnym piętrze lochu. Zwój przyznaje pierwszeństwo miejscom, których użytkownik jeszcze nie odwiedził. Choć nie jest w stanie teleportować użytkownika za zamknięte drzwi i barykady, może odsłaniać ukryte przejścia wiodące do nowych obszarów.

items.scrolls.scrollofterror.name=zwój terroru
items.scrolls.scrollofterror.none=Zwój emituje jasny blask czerwonego światła.
items.scrolls.scrollofterror.one=Zwój emituje jasny blask czerwonego światła, a %s ucieka!
items.scrolls.scrollofterror.many=Zwój emituje jasny blask czerwonego światła i wszystkie potwory uciekają!
items.scrolls.scrollofterror.desc=Po przeczytaniu, błysk czerwonego światła przytłoczy terrorem wszystkich wrogów w zasięgu wzroku, nakłaniając ich do ucieczki. Atakowanie uciekających wrogów skróci czas działania efektu.

items.scrolls.scrolloftransmutation.name=zwój przemiany
items.scrolls.scrolloftransmutation.inv_title=Przemień przedmiot
items.scrolls.scrolloftransmutation.nothing=Nic ciekawego się wydarza.
items.scrolls.scrolloftransmutation.morph=Twój przedmiot zmienia się w inny!
items.scrolls.scrolloftransmutation.desc=Ten zwój zawiera potężną magię transmutacji. Kiedy użyjesz go na odpowiednim przedmiocie, przekształci go w inny przedmiot tego samego typu. Magia zachowa nawet ulepszenia, zaklęcia i glify. Zwoje i mikstury zostaną przemienione w ich egzotyczne odpowiedniki i odwrotnie.

items.scrolls.scrollofupgrade.name=zwój ulepszenia
items.scrolls.scrollofupgrade.inv_title=Ulepsz przedmiot
items.scrolls.scrollofupgrade.weaken_curse=Zwój Ulepszenia osłabia klątwę rzuconą na przedmiot.
items.scrolls.scrollofupgrade.remove_curse=Zwój Ulepszenia zdejmuje klątwę z przedmiotu!
items.scrolls.scrollofupgrade.desc=Ten zwój ulepszy jeden przedmiot lub zestaw broni miotanej. Ulepszone różdżki staną się mocniejsze i zwiększy się ich liczba ładunków, bronie i zbroje będą odpowiednio zadawać bądź blokować więcej obrażeń, zestawy broni miotanej zostaną naprawione i będą bardziej wytrzymałe, a efekty pierścieni zostaną wzmocnione.\n\nZwój może nawet osłabić lub czasami całkowicie rozproszyć klątwę, choć nie jest tak potężny, jak zwój zdjęcia klątwy. Niestety, magia ulepszania może również usunąć zaklęcia lub glify na wyższym poziomie sprzętu.



###exotic scrolls
items.scrolls.exotic.exoticscroll.kaunan=egzotyczny zwój KAUNAN
items.scrolls.exotic.exoticscroll.sowilo=egzotyczny zwój SOWILO
items.scrolls.exotic.exoticscroll.laguz=egzotyczny zwój LAGUZ
items.scrolls.exotic.exoticscroll.yngvi=egzotyczny zwój YNGVI
items.scrolls.exotic.exoticscroll.gyfu=egzotyczny zwój GYFU
items.scrolls.exotic.exoticscroll.raido=egzotyczny zwój RAIDO
items.scrolls.exotic.exoticscroll.isaz=egzotyczny zwój ISAZ
items.scrolls.exotic.exoticscroll.mannaz=egzotyczny zwój MANNAZ
items.scrolls.exotic.exoticscroll.naudiz=egzotyczny zwój NAUDIZ
items.scrolls.exotic.exoticscroll.berkanan=egzotyczny zwój BERKANAN
items.scrolls.exotic.exoticscroll.odal=egzotyczny zwój ODAL
items.scrolls.exotic.exoticscroll.tiwaz=egzotyczny zwój TIWAZ
items.scrolls.exotic.exoticscroll.unknown_desc=Na tym czarnym pergaminie została zapisana nieznana, magiczna i świecąca runa. Wygląda, jakby nie była stąd, kto wie, co się stanie, gdy zostanie przeczytana na głos?
items.scrolls.exotic.exoticscroll.discover_hint=Ten przedmiot możesz stworzyć poprzez alchemię.

items.scrolls.exotic.scrollofsirenssong.name=zwój syreniej pieśni
items.scrolls.exotic.scrollofsirenssong.prompt=Wybierz cel
items.scrolls.exotic.scrollofsirenssong.no_target=Zwój aktywuje się bez celu.
items.scrolls.exotic.scrollofsirenssong.cancel=Musisz wybrać cel.
items.scrolls.exotic.scrollofsirenssong.desc=Przeczytanie tego zwoju wydaje nęcącą melodię, która ujarzmia wybranego wroga, permanentnie zmieniając go w sojusznika! Inni wrogowie zostaną tymczasowo zauroczeni.\n\nSzczególnie silni wrogowie mogą oprzeć się efektowi ujarzmiania i zostaną zauroczeni.
items.scrolls.exotic.scrollofsirenssong$enthralled.name=ujarzmienie
items.scrolls.exotic.scrollofsirenssong$enthralled.desc=To stworzenie zostało urzeczone magią pochodzącą ze zwoju syreniej pieśni.\n\nUjarzmiona postać permanentnie została Twoim sojusznikiem i będzie walczyła z wrogami, których napotkacie.

items.scrolls.exotic.scrollofantimagic.name=zwój anty-magii
items.scrolls.exotic.scrollofantimagic.desc=Inkantacja zapisana na tym zwoju otoczy cię magiczną aurą, która tymczasowo blokuje wszystkie magiczne efekty, zarówno szkodliwe, jak i korzystne. Obejmuje to większość efektów magicznych przedmiotów takich jak różdżki, zwoje, pierścienie, artefakty oraz zaklęcia i klątwy wyposażenia. Umiejętności zbroi bohatera są jednak na tyle silne, że mimo to działają.

items.scrolls.exotic.scrollofchallenge.name=zwój wyzwania
items.scrolls.exotic.scrollofchallenge.desc=Zwój, po przeczytaniu na głos, wyzwala głośny ryk, który wabi przeciwników do gracza oraz wytwarza wokół niego małą arenę.\n\nStojąc w obrębie tej areny, gracz będzie otrzymywał o 33% mniej obrażeń, niezależnie od źródła (efekt nakłada się przed wszystkimi innymi formami redukcji obrażeń), a głód nie będzie postępował.\n\nRozmiar areny zależy od rozmiaru miejsca, w którym przeczytano zwój. Na piętrach z bossami będzie ona szczególnie mała.
items.scrolls.exotic.scrollofchallenge$challengearena.name=arena wyzwania
items.scrolls.exotic.scrollofchallenge$challengearena.desc=Magiczna arena pojawiła się wokół ciebie, wyznaczona przez czerwoną, falującą mgłę.\n\nGdy stoisz w mgle, twój głód nie narasta, a wszelkiego rodzaju otrzymane obrażenia są zmniejszane o 33%%. Wszystkie inne bonusy do redukcji obrażeń (takie jak pancerz) są nakładane po tym efekcie.\n\nPozostałe tury efektu: %d.

items.scrolls.exotic.scrollofdivination.name=Zwój oświecenia
items.scrolls.exotic.scrollofdivination.nothing_left=Zidentyfikowałeś już wszystkie przedmioty.
items.scrolls.exotic.scrollofdivination.desc=Ten zwój losowo zidentyfikuje cztery rodzaje przedmiotów, których obecnie nie znasz. Zidentyfikowanymi typami mogą być: kolor mikstury, runa zwoju lub klejnot pierścienia. Zidentyfikowane przedmioty niekoniecznie będą tymi, które masz przy sobie.
items.scrolls.exotic.scrollofdivination$wnddivination.desc=Zwój oświecenia zidentyfikował poniższe rzeczy:

items.scrolls.exotic.scrollofdread.name=zwój grozy
items.scrolls.exotic.scrollofdread.desc=Po przeczytaniu ten zwój wywoła błysk czerwonego światła, który wzbudzi nieopisany terror u wszystkich przeciwników w twoim polu widzenia. Ten efekt jest tak potężny, że wrogowie natychmiast będą usiłowali uciec z lochu, a słuch o nich zaginie!\n\nTak jak w przypadku terroru, ten efekt może przestać działać wraz z upływem czasu lub jeśli przeciwnik zostanie zaatakowany. \n\nWrogowie o wysokiej sile woli, np. bossowie, zostaną zamiast tego naznaczeni zwykłym terrorem.

items.scrolls.exotic.scrollofenchantment.name=zwój zaklęcia
items.scrolls.exotic.scrollofenchantment.inv_title=Zaczaruj przedmiot
items.scrolls.exotic.scrollofenchantment.weapon=Wybierz zaklęcie do nałożenia na twoją broń.
items.scrolls.exotic.scrollofenchantment.armor=Wybierz glif do nałożenia na twoją zbroję.
items.scrolls.exotic.scrollofenchantment.cancel=Anuluj
items.scrolls.exotic.scrollofenchantment.cancel_warn=Anulowanie zużyje zwój zaklęcia, czy mimo tego chcesz to zrobić?
items.scrolls.exotic.scrollofenchantment.cancel_warn_yes=Tak, jestem pewny.
items.scrolls.exotic.scrollofenchantment.cancel_warn_no=Nie, zmieniłem zdanie.
items.scrolls.exotic.scrollofenchantment.desc=Ten zwój zaklnie broń lub zbroję potężnym, magicznym glifem. Czytelnik ma nawet w pewnym stopniu kontrolę nad używanym typem magii.

items.scrolls.exotic.scrollofforesight.name=zwój przezorności
items.scrolls.exotic.scrollofforesight.desc=Po przeczytaniu zwoju wszystkie detale pobliskiego terenu będą przekazywane do umysłu czytelnika, klarowne jak czysta woda. Moc zwoju utrzymuje się przez długi czas, natychmiast ujawniając wszystkie ukryte drzwi i pułapki, dzięki czemu przeszukiwanie jest zbędne.

items.scrolls.exotic.scrollofmetamorphosis.name=zwój metamorfozy
items.scrolls.exotic.scrollofmetamorphosis.choose_desc=Wybierz talent do przeistoczenia.
items.scrolls.exotic.scrollofmetamorphosis.replace_desc=Wybierz nowy talent w miejsce poprzedniego.
items.scrolls.exotic.scrollofmetamorphosis.cancel_warn=Anulowanie zużyje zwój metamorfozy, czy mimo tego chcesz to zrobić?
items.scrolls.exotic.scrollofmetamorphosis.metamorphose_talent=przeistocz talent
items.scrolls.exotic.scrollofmetamorphosis.desc=Ten zwój posiada potężną moc przemiany użytkownika. Magia zwoju pozwoli ci wybrać jeden ze swoich talentów, aby zamienić go na talent innego bohatera. Do wyboru będziesz mieć jeden z pięciu talentów tego samego kręgu.\n\nMożesz wykorzystać ten zwój do zamiany talentów dla klas. Nie liczą się talenty dla specjalizacji ani umiejętności zbroi. Talenty, których nie możesz wykorzystać, nie pojawią się jako wybór.

items.scrolls.exotic.scrollofmysticalenergy.name=zwój mistycznej energii
items.scrolls.exotic.scrollofmysticalenergy.desc=Czysta, magiczna moc wpojona w ten skrawek papieru po uwolnieniu naładuje po pewnym czasie założone artefakty.

items.scrolls.exotic.scrollofpassage.name=zwój teleportacji do sklepu
items.scrolls.exotic.scrollofpassage.desc=Zaklęcie na tym papierze natychmiast teleportuje czytelnika do pierwszego piętra regionu, w który ten się znajduje. Dość przydatne w szybkim dostaniu się do sklepu.

items.scrolls.exotic.scrollofprismaticimage.name=zwój pryzmatycznego obrazu
items.scrolls.exotic.scrollofprismaticimage.desc=Inkantacja zapisana na tym zwoju stworzy iluzorycznego bliźniaka odczytującego. Będzie on słabszy od czytelnika, z podobną obroną, ale niższym zdrowiem i obrażeniami. \n\nPryzmatyczny obraz ukazuje się, gdy zostaną zauważeni wrogowie i będzie bronił czytelnika.\n\nJeśli pryzmatyczny obraz już istnieje, to ten zwój go uleczy.

items.scrolls.exotic.scrollofpsionicblast.name=zwój psionicznego wybuchu
items.scrolls.exotic.scrollofpsionicblast.ondeath=Psioniczny Wybuch rozrywa twój mózg na kawałki...
items.scrolls.exotic.scrollofpsionicblast.desc=Ten zwój zawiera niesamowicie wyniszczającą energię, która może zostać skupiona w celu unicestwienia umysłów wszystkich stworzeń w zasięgu wzroku.\n\nSprzężenie zwrotne tego efektu jest dość znaczące. Użytkownik zwoju dostanie poważne obrażenia, zostanie także tymczasowo oślepiony i osłabiony. Im więcej celów zostanie trafionych tą magią, tym słabsze będą skutki uboczne dla użytkownika.



###spells
items.spells.alchemize.name=kryształ Midasa
items.spells.alchemize.prompt=Przekształć przedmiot
items.spells.alchemize.desc=To zaklęcie zawiera moce transmutacyjne podobne do tych, które można znaleźć w tyglu alchemicznym. Każde rzucenie zaklęcia pozwala użytkownikowi zamienić przedmiot (lub stos przedmiotów) na złoto lub energię alchemiczną. Przekształcenie mikstur lub zwojów w energię spowoduje ich zidentyfikowanie!\n\nKilka kryształów Midasa można kupić w sklepach, ale znacznie więcej można wykonać, łącząc nasiono, kamień runiczny i odrobinę energii alchemicznej.
items.spells.alchemize$wndalchemizeitem.sell=Zamień w %d złota
items.spells.alchemize$wndalchemizeitem.sell_1=Zamień 1 w %d złota
items.spells.alchemize$wndalchemizeitem.sell_all=Zamień stos w %d złota
items.spells.alchemize$wndalchemizeitem.energize=Zamień w %d energii
items.spells.alchemize$wndalchemizeitem.energize_1=Zamień 1 w %d energii
items.spells.alchemize$wndalchemizeitem.energize_all=Zamień stos w %d energii

items.spells.beaconofreturning.name=latarnia powrotu
items.spells.beaconofreturning.preventing=Silna magiczna aura tego miejsca nie pozwala ci użyć tego zaklęcia!
items.spells.beaconofreturning.creatures=Psychiczna aura sąsiadujących stworzeń nie pozwala ci teleportować się w tym momencie.
items.spells.beaconofreturning.set=Latarnia została ustawione w miejscu w którym stoisz.
items.spells.beaconofreturning.wnd_body=Ustawienie zapamięta miejsce w którym to zrobisz.\n\nPowrót teleportuje cię do ostatniego ustawionego miejsca i zużyje jedno użycie zaklęcia.
items.spells.beaconofreturning.wnd_set=Ustaw
items.spells.beaconofreturning.wnd_return=Powróć
items.spells.beaconofreturning.desc_set=Znacznik został ustawiony gdzieś na %d. poziomie.
items.spells.beaconofreturning.desc=Ten skomplikowany czar pozwala użytkownikowi na powrót do ustawionego miejsca, niezależnie od dystansu. Czar będzie zużyty przez powrócenie, ale można go ustawić dowolną ilość razy, z tym, że będzie pamiętał jedynie ostatnie ustawione miejsce.

items.spells.curseinfusion.name=nasycenie klątwą
items.spells.curseinfusion.inv_title=Przeklnij przedmiot
items.spells.curseinfusion.desc=To zaklęcie tchnie tą samą potężną i złowrogą magią, która jest obecna w DM-300. Przedmiot, na którym zostanie użyte, zostanie przeklęty, a wszelkie zaklęcia lub glify, które mógł posiadać, zostaną nadpisane.\n\nW przypadku broni, zbroi i różdżek przedmiot, poza zostaniem przeklętym, zostanie też ulepszony. Ulepszenia uzyskane w ten sposób nie kumulują się i są tracone, gdy klątwa zostanie zdjęta.\n\nKolejne użycia nasycenia klątwą pozwalają na zmianę klątwy znajdującej się na broni lub zbroi.

items.spells.spell.ac_cast=RZUĆ ZAKLĘCIE
items.spells.spell.no_magic=Nie możesz rzucać zaklęć kiedy jesteś odporny na magię.
items.spells.spell.discover_hint=Ten przedmiot możesz stworzyć poprzez alchemię.

items.spells.magicalinfusion.name=nasycenie zaklęciem
items.spells.magicalinfusion.inv_title=Nasyć przedmiot
items.spells.magicalinfusion.infuse=Twój przedmiot zostaje nasycony tajemną mocą!
items.spells.magicalinfusion.desc=To zaklęcie posiada taką samą moc magiczną jak zwój ulepszenia, lecz w stabilniejszej formie. \n\nDzięki temu, przy ulepszaniu przedmiotu zaklęcie nigdy nie usunie zaklęć, glifów ani klątw.

items.spells.magicalporter.name=magiczny przenosiciel
items.spells.magicalporter.inv_title=Przenieś przedmiot
items.spells.magicalporter.nowhere=Nigdzie nie możesz przenieść przedmiotu
items.spells.magicalporter.desc=To zaklęcie magicznie przeniesie dowolny przedmiot, na który zostanie rzucone. Przeniesie ono przedmioty blisko wejścia na poziom następnego bossa.

items.spells.phaseshift.name=przesunięcie fazowe
items.spells.phaseshift.no_target=Nie ma tu nic do teleportacji.
items.spells.phaseshift.desc=To chaotyczne zaklęcie przeteleportuje dowolne stworzenie, które zostanie wybrane, na losowe miejsce na tym samym piętrze. Po teleportacji cel zostanie ogłuszony na znaczną ilość czasu. Potężni przeciwnicy mogą oprzeć się ogłuszeniu. Zaklęcie może być skierowane w cel, jak i w użytkownika.

items.spells.reclaimtrap.name=ładowanie z pułapki
items.spells.reclaimtrap.no_trap=Nie ma tu żadnej pułapki.
items.spells.reclaimtrap.desc_trap=Zaklęcie jest gotowe wywołać: _%s._
items.spells.reclaimtrap.desc=To zaklęcie posiada pozostałości mechanicznej energii DM-300. Gdy zostanie rzucone na aktywną pułapkę, jej moc przywiąże się do ciebie, pozwalając ci ponownie użyć zaklęcia, by uwolnić moc pułapki i wywołać jej efekt w wybranym miejscu.\n\nNiemniej jednak, niektóre pułapki mogą nie działać we wszystkich miejscach, a sam czar może przechować tylko jedną pułapkę na raz.

items.spells.recycle.name=przemiana
items.spells.recycle.inv_title=Przemień przedmiot
items.spells.recycle.recycled=Twój przedmiot został przemieniony w: %s.
items.spells.recycle.desc=To zaklęcie korzysta ze słabszej magii transmutacyjnej. Nie jest dość potężne, by działało na ekwipunek, ale można go użyć na zwoju, miksturze, nasieniu, kamieniu runicznym lub strzałce, aby zamienić ten przedmiot w inny tego samego typu.

items.spells.summonelemental.name=przyzwanie żywiołaka
items.spells.summonelemental.ac_imbue=WZMOCNIJ
items.spells.summonelemental.imbue_prompt=Wybierz przedmiot wzmacniający
items.spells.summonelemental.desc=Zaklęcie wykorzystuje energię świeżych niedopałków żywiołaków, użytych przy jego wytworzeniu, w celu przywołania przyjaznego żywiołaka, który pomoże ci w walce! Możesz przywołać tylko jednego na raz, ale możesz ponownie użyć zaklęcia, by żywiołak do ciebie wrócił.
items.spells.summonelemental.desc_newborn=Zaklęcie jest obecnie niedopełnione i przywoła _nowo narodzonego żywiołaka_, który nie posiada ataku dystansowego. Możesz wzmocnić zaklęcie, nasycając je zidentyfikowaną miksturą ciekłych płomieni, miksturą mrozu, zwojem ładowania lub zwojem przemiany, co sprawi, że następne żywiołaki zostaną przyzwane w pełni swojej mocy.
items.spells.summonelemental.desc_fire=To zaklęcie jest gorące w dotyku i przywoła _żywiołaka ognia_. Możesz ponownie wzmocnić zaklęcie, ale wtedy straci ono obecny dodatek.
items.spells.summonelemental.desc_frost=To zaklęcie jest zimne w dotyku i przywoła _żywiołaka mrozu_. Możesz ponownie wzmocnić zaklęcie, ale wtedy straci ono obecny dodatek.
items.spells.summonelemental.desc_shock=To zaklęcie, promieniujące energią statyczną, przywoła _żywiołaka iskier_. Możesz ponownie wzmocnić zaklęcie, ale wtedy straci ono obecny dodatek.
items.spells.summonelemental.desc_chaos=To zaklęcie, promieniujące chaotyczną energią, przywoła _żywiołaka chaosu_. Możesz ponownie wzmocnić zaklęcie, ale wtedy straci ono obecny dodatek.

items.spells.targetedspell.prompt=Wybierz cel
items.spells.targetedspell.inv_title=Nasyć przedmiot

items.spells.telekineticgrab.name=telekinetyczny chwyt
items.spells.telekineticgrab.cant_grab=Nie możesz tego chwycić.
items.spells.telekineticgrab.no_target=Tutaj nie ma nic do chwycenia.
items.spells.telekineticgrab.desc=To zaklęcie pozwala rzucającemu na zdalne podniesienie wszystkich przedmiotów na danym polu lub wszystkich broni miotanych, które utknęły we wrogu!\n\nTo zaklęcie nie może zebrać przedmiotów należących do kogoś lub pojemników takich jak skrzynia.

items.spells.unstablespell.name=niestabilne zaklęcie
items.spells.unstablespell.desc=Ten mały, czarny kryształ w kształcie kwadratu ma zmieniające się runiczne symbole na każdej ze swoich powierzchni.\n\nPo aktywacji wywoła efekt losowego zwoju. Będzie on związany z walką jeżeli widzisz jakiegoś wroga, w przeciwnym wypadku nie będzie on związany z walką.

items.spells.wildenergy.name=nieoswojona energia
items.spells.wildenergy.desc=To zaklęcie posiada trochę energii, która niegdyś zasilała DM-300. Przy użyciu załaduje twoje różdżki oraz używane artefakty, aktywując także losowy efekt przeklętej różdżki. Możesz jednak wybrać, gdzie ta przeklęta magia zostanie uwolniona.


###runestones
items.stones.inventorystone.ac_use=UŻYJ

items.stones.runestone$placeholder.name=kamień runiczny
items.stones.runestone.discover_hint=Ten przedmiot możesz znaleźć losowo w lochu lub stworzyć go za pomocą alchemii.

items.stones.stoneofaggression.name=kamień agresji
items.stones.stoneofaggression.desc=Kiedy ten kamień zostanie rzucony w wybraną postać, wszyscy pobliscy wrogowie będą woleli ją atakować przez krótki czas.\n\nBossowie mogą oprzeć się temu efektowi, co znacząco zmniejszy jego czas trwania oraz obrażenia otrzymywane od ich stronników.
items.stones.stoneofaggression$aggression.name=prowokacja
items.stones.stoneofaggression$aggression.desc=Magia manipulacji powoduje, że pobliskie stworzenia wolą atakować tę postać. \n\nPozostałe tury efektu: %s.

items.stones.stoneofaugmentation.name=kamień rozszerzania
items.stones.stoneofaugmentation.inv_title=Rozszerz przedmiot
items.stones.stoneofaugmentation.desc=Ten kamień runiczny posiada potężną magię, która może rozszerzać przedmioty o jedną właściwość kosztem innej.\n\nUżycie na broni pozwoli rozszerzyć prędkość lub obrażenia. Broń miotana traci lub zyskuje wytrzymałość proporcjonalnie do jej prędkości.\n\nUżycie na zbroi pozwoli rozszerzyć obronę lub uniki.
items.stones.stoneofaugmentation.discover_hint=Ten przedmiot możesz kupić w sklepie lub stworzyć go za pomocą alchemii.
items.stones.stoneofaugmentation$wndaugment.choice=Co chciałbyś rozszerzyć?
items.stones.stoneofaugmentation$wndaugment.speed=Prędkość
items.stones.stoneofaugmentation$wndaugment.damage=Obrażenia
items.stones.stoneofaugmentation$wndaugment.evasion=Unik
items.stones.stoneofaugmentation$wndaugment.defense=Obrona
items.stones.stoneofaugmentation$wndaugment.none=Usuń Rozszerzenie
items.stones.stoneofaugmentation$wndaugment.cancel=Nieważne

items.stones.stoneofblast.name=kamień fali wybuchu
items.stones.stoneofblast.desc=Ten kamień runiczny natychmiastowo wybuchnie w miejscu rzucenia. Tak jak w przypadku bomb, eksplozja zada obrażenia wszystkiemu dookoła.

items.stones.stoneofblink.name=kamień teleportacji
items.stones.stoneofblink.desc=Ten kamień runiczny przeteleportuje użytkownika do miejsca, gdzie zostanie rzucony.

items.stones.stoneofclairvoyance.name=kamień widzenia
items.stones.stoneofclairvoyance.desc=Ten kamień runiczny natychmiastowo ujawni wszystkie sekrety na niezwykle dużym obszarze wokół miejsca jego rzucenia. Jego efekt działa nawet przez ściany.

items.stones.stoneofdeepsleep.name=kamień głębokiego snu
items.stones.stoneofdeepsleep.desc=Gdy ten kamień runiczny zostanie rzucony w przeciwnika, zostanie on uśpiony w głęboki, magiczny sen. Przeciwnicy w magicznym śnie będą spać wiecznie, dopóki nie zostaną z niego wyrwani siłą.

items.stones.stoneofdetectmagic.name=kamień wykrycia magii
items.stones.stoneofdetectmagic.inv_title=Wykryj magię przedmiotu
items.stones.stoneofdetectmagic.detected_none=Nie wykrywasz żadnej magicznej aury w tym przedmiocie.
items.stones.stoneofdetectmagic.detected_both=Wykrywasz zarówno dobrą, jak i negatywną aurę magiczną tego przedmiotu!
items.stones.stoneofdetectmagic.detected_good=Wykrywasz pozytywną aurę magiczną tego przedmiotu!
items.stones.stoneofdetectmagic.detected_bad=Wykrywasz złowieszcza aurę magiczną tego przedmiotu!
items.stones.stoneofdetectmagic.desc=Ten kamień runiczny jest w stanie wykryć magię w ekwipunku. Użycie go na niezidentyfikowanym przedmiocie pozwoli ci określić, czy jest on przeklęty, a także wykryć pozytywną magię w postaci ulepszenia lub wzmocnienia zaklęciem.

items.stones.stoneofdisarming.name=kamień rozbrajania
items.stones.stoneofdisarming.desc=Ten kamień posiada magię, która może rozbroić nikczemne pułapki ukryte przez loch. Rozbroi do 9 pułapek w pobliżu miejsca, w które zostanie rzucony.

items.stones.stoneofenchantment.name=kamień zaklęcia
items.stones.stoneofenchantment.inv_title=Zaczaruj przedmiot
items.stones.stoneofenchantment.weapon=Twoja broń jarzy się w ciemności!
items.stones.stoneofenchantment.armor=Twoja zbroja jarzy się w ciemności!
items.stones.stoneofenchantment.desc=Kamień runiczny posiadający magię zaklinającą. W przeciwieństwie do zwoju ulepszenia, nie będzie zwiększał mocy przedmiotu, lecz da broni lub zbroi czar, dając temu przedmiotowi nową moc.

items.stones.stoneoffear.name=kamień strachu
items.stones.stoneoffear.desc=Kiedy ten kamień zostanie rzucony w przeciwnika, przeszyje go niewyobrażalny terror i zacznie on uciekać. Atakowanie uciekającego przeciwnika skróci czas trwania efektu.

items.stones.stoneofflock.name=kamień stada owiec
items.stones.stoneofflock.desc=Ten kamień runiczny przywołuje magiczne owce na krótki czas dookoła miejsca, gdzie został rzucony.

items.stones.stoneofintuition.name=kamień intuicji
items.stones.stoneofintuition.inv_title=Wybierz przedmiot
items.stones.stoneofintuition.desc=W tym kamieniu runicznym zaklęta jest słabsza odmiana magii zawartej w zwoju identyfikacji. Zamiast bezpośrednio ukazać właściwości przedmiotu, runa zadziała na twoją intuicję, dając możliwość zgadnięcia typu mikstury, zwoju lub pierścienia, na którym zostanie użyta.
items.stones.stoneofintuition.break_info=Kamieni intuicji można użyć dwukrotnie, zanim ulegną zniszczeniu, więc _następne użycie go nie zużyje_.
items.stones.stoneofintuition.break_warn=Już raz użyto kamienia intuicji, więc _następne użycie go zniszczy_.
items.stones.stoneofintuition$wndguess.text=Zgadnij typ niezidentyfikowanego przedmiotu. Jeżeli twój wybór okaże się prawidłowy, zostanie on zidentyfikowany!
items.stones.stoneofintuition$wndguess.correct=Prawda. Typ przedmiotu został zidentyfikowany!
items.stones.stoneofintuition$wndguess.incorrect=Twoje przypuszczenia były błędne.
items.stones.stoneofintuition$wndguess.break=Twój kamień intuicji obraca się w pył...

items.stones.stoneofshock.name=kamień porażenia
items.stones.stoneofshock.desc=Ten kamień runiczny wyzwala krótkotrwałą burzę elektryczną w miejscu rzucenia, która tymczasowo ogłusza pobliskie cele i regeneruje jedno użycie różdżki za każde wywołane ogłuszenie.


###trinkets
items.trinkets.chaoticcenser.name=chaotyczny trybularz
items.trinkets.chaoticcenser.spew=Twój trybularz zaraz wypuści: %s.
items.trinkets.chaoticcenser.desc=Po pewnym czasie w tyglu alchemicznym, ten trybularz zaczyna buchać dymem sam z siebie! Te gazy zbierają się w środku trybularza i buchają w stronę przeciwników i w częściowo przewidywalnych odstępach czasu. Wydaje się, że jest w stanie tworzyć gazy wszelkiej maści. Dostaniesz ostrzeżenie chwilę przed aktywacją trybularza.
items.trinkets.chaoticcenser.typical_stats_desc=Zazwyczaj ten relikt sprawi, że w pobliżu przeciwnika, co około _%d_ tur pojawi się szkodliwy gaz. Pojawia się on tylko, gdy w pobliżu są wrogowie. Na wyższych poziomach te gazy częściej są egzotyczne i potężne.
items.trinkets.chaoticcenser.stats_desc=Na obecnym poziomie ten relikt sprawi, że w pobliżu przeciwnika, co około _%d_ tur pojawi się szkodliwy gaz. Pojawia się on tylko, gdy w pobliżu są wrogowie. Na wyższych poziomach te gazy częściej są egzotyczne i potężne.

items.trinkets.crackedspyglass.name=spękana luneta
items.trinkets.crackedspyglass.desc=Ta luneta byłaby przykładem umiejętnego i precyzyjnego rzemiosła, gdyby nie pęknięcia na przedniej soczewce. Luneta zdaje się ci pomagać poprzez odkrywanie nowych przedmiotów w lochu, ale ze względu na usterkę, ujawnione przedmioty są trudne do zauważenia!
items.trinkets.crackedspyglass.typical_stats_desc=Zazwyczaj ten relikt ma _%1$s%% szans_ na stworzenie dodatkowego ukrytego przedmiotu na każdym piętrze niezawierającym bossa.
items.trinkets.crackedspyglass.stats_desc=Na obecnym poziomie ten relikt ma _%1$s%% szans_ na stworzenie dodatkowego ukrytego przedmiotu na każdym piętrze niezawierającym bossa.
items.trinkets.crackedspyglass.stats_desc_upgraded=Na obecnym poziomie ten relikt ma _100%% szans_ na stworzenie dodatkowego ukrytego przedmiotu na każdym piętrze niezawierającym bossa. Dodatkowo, ma _%1$s%% szans_ na stworzenie drugiego ukrytego przedmiotu.

items.trinkets.dimensionalsundial.name=międzywymiarowy zegar słoneczny
items.trinkets.dimensionalsundial.warning=Twój zegar słoneczny nie rzuca cienia, czujesz się niepewnie.
items.trinkets.dimensionalsundial.desc=Ten podręczny zegar słoneczny z jakiegoś powodu może rzucać cień w głębinach lochu, nawet jeśli nie trzymasz go poziomo. Co jeszcze dziwniejsze, ułożenie cienia wydaje się być niezależne od pozycji słońca w tym świecie. Gdy na zegarze nie ma cienia, wydaje się on przyciągać niebezpieczeństwo.
items.trinkets.dimensionalsundial.typical_stats_desc=Zazwyczaj ten relikt zmniejsza częstotliwość pojawiania się nowych wrogów o _%1$d%%_ w trakcie dnia w prawdziwym życiu (8-20) oraz zwiększy częstotliwość pojawiania się nowych wrogów o _%2$d%%_ w nocy (20-8).
items.trinkets.dimensionalsundial.stats_desc=Na tym poziomie, relikt zmniejsza częstotliwość pojawiania się nowych wrogów o _%1$d%%_ w trakcie dnia w prawdziwym życiu (8-20) oraz zwiększa częstotliwość pojawiania się nowych wrogów o _%2$d%%_ w nocy (20-8).

items.trinkets.exoticcrystals.name=egzotyczne kryształy
items.trinkets.exoticcrystals.desc=Te małe, różowe kryształy są w tym samym kształcie, co te do przechowywania energii alchemicznej. Chociaż nie można bezpośrednio użyć ich energii, z jakiegoś powodu wpływają one na mikstury i zwoje, które znajdujesz.
items.trinkets.exoticcrystals.typical_stats_desc=Zazwyczaj ten relikt zamienia _%s%%_ mikstur i zwojów na ich egzotyczne warianty. Efekt ten nie dotyczy mikstur siły, zwojów ulepszenia ani przedmiotów, które są niezbędne do rozwiązania pokojów z zagrożeniem.
items.trinkets.exoticcrystals.stats_desc=Na obecnym poziomie ten relikt zamieni _%s%%_ mikstur i zwojów na ich egzotyczne warianty. Efekt ten nie dotyczy mikstur siły, zwojów ulepszenia ani przedmiotów, które są niezbędne do rozwiązania pokojów z zagrożeniem.

items.trinkets.eyeofnewt.name=oko traszki
items.trinkets.eyeofnewt.desc=To czarno-złote oko traszki jest popularnym składnikiem, ten tutaj okaz został ulepszony do reliktu. Wygląda na to, że zmniejsza ono zasięg widzenia, zamiast tego pozwalając ci widzieć na inne sposoby.
items.trinkets.eyeofnewt.typical_stats_desc=Zazwyczaj ten relikt zmniejsza twój zasięg widzenia o _%1$s%%_, w zamian za to zapewniając wizję umysłów w zasięgu _%2$d_ pól.
items.trinkets.eyeofnewt.stats_desc=Na obecnym poziomie ten relikt zmniejszy twój zasięg widzenia o _%1$s%%_, w zamian za to zapewniając wizję umysłów w zasięgu _%2$d_ pól.

items.trinkets.ferrettuft.name=futro fretki
items.trinkets.ferrettuft.desc=Jedwabnie biały pęczek futra fretki trzymany razem przez limonkową wstążkę związaną w kokardkę. Fretki są znane ze swojej zwinności, psotności i nieuczciwości. Część tej mocy zdaje się promieniować z reliktu, zwiększając szansę na unik wszystkiego w pobliżu.
items.trinkets.ferrettuft.typical_stats_desc=Zazwyczaj ten relikt zwiększa szansę na unik wszystkich postaci o _%1$s%%_.
items.trinkets.ferrettuft.stats_desc=Na obecnym poziomie ten relikt zwiększy szansę na unik wszystkich postaci o _%1$s%%_.

items.trinkets.mimictooth.name=ząb mimika
items.trinkets.mimictooth.desc=Ten duży i ostry ząb musiał zostać wyrwany jakiemuś bardzo niezadowolonemu z tego faktu mimikowi. Wygląda na to, że ząb wpływa na mimiki znajdujące się w lochu, sprawiając, że są one częstsze i bardziej niebezpieczne.
items.trinkets.mimictooth.typical_stats_desc=Zazwyczaj ten relikt sprawia, że wszystkie rodzaje mimików będą się pojawiać _%1$sx_ częściej i będą znacznie trudniejsze do wykrycia, zwiększając w zamian ilość skarbów otrzymanych z mimików. Każde piętro będzie miało _%2$s%%_ szans na pojawienie się bardzo skrytego hebanowego mimika.
items.trinkets.mimictooth.stats_desc=Na obecnym poziomie ten relikt sprawi, że wszystkie rodzaje mimików będą się pojawiać _%1$sx_ częściej i będą znacznie trudniejsze do wykrycia, zwiększając w zamian ilość skarbów otrzymanych z mimików. Każde piętro będzie miało _%2$s%%_ szans na pojawienie się bardzo skrytego hebanowego mimika.

items.trinkets.mossyclump.name=omszała kępa
items.trinkets.mossyclump.desc=Ta kępka mokrego mchu zdaje się zatrzymywać wilgoć, niezależnie od tego, jak mocno ją ściśniesz. Wydaje się, że jest magicznie związana z samymi lochami, sprawiając, że trawa i woda pojawiają się częściej.
items.trinkets.mossyclump.typical_stats_desc=Zazwyczaj ten relikt sprawi, że _%d%%_ niezmienionych pięter zostanie zalanych lub zarośniętych trawą.\n\nUlepszenie tego reliktu kosztuje większą ilość energii.
items.trinkets.mossyclump.stats_desc=Na obecnym poziomie ten relikt sprawia, że _%d%%_ niezmienionych pięter zostanie zalanych lub zarośniętych trawą.\n\nUlepszenie tego reliktu kosztuje większą ilość energii.

items.trinkets.parchmentscrap.name=skrawek pergaminu
items.trinkets.parchmentscrap.desc=Ten mały skrawek pergaminu wygląda, jakby pochodził ze zwoju. Zachował część swojej magii oraz wydaje się wpływać na broń i zbroje znalezione w lochach.
items.trinkets.parchmentscrap.typical_stats_desc=Zazwyczaj ten relikt sprawia, że zaklęcia i glify będą _%dx_ razy częstsze, a klątwy na broniach i zbrojach _%sx_ razy częstsze. Klątwy na różdżkach, pierścieniach lub artefaktach nie są objęte tym działaniem.\n\nUlepszenie tego reliktu kosztuje większą ilość energii.
items.trinkets.parchmentscrap.stats_desc=Na obecnym poziomie ten relikt sprawi, że zaklęcia i glify będą _%dx_ razy częstsze, a klątwy na broniach i zbrojach _%sx_ razy częstsze. Klątwy na różdżkach, pierścieniach lub artefaktach nie są objęte tym działaniem.\n\nUlepszenie tego reliktu kosztuje większą ilość energii.

items.trinkets.petrifiedseed.name=skamieniałe nasiono
items.trinkets.petrifiedseed.desc=To nasiono zostało skamieniałe albo w wyniku powolnych procesów geologicznych, albo za sprawą magii. Wydaje się, że nasiono to magicznie wpływa na florę lochów, czasami zastępując nasiona roślin kamieniami runicznymi.
items.trinkets.petrifiedseed.typical_stats_desc=Zazwyczaj ten relikt sprawia, że w _%1$s%%_ przypadków w zdeptanej trawie znajdzie się kamienie runiczne zamiast nasion oraz zazwyczaj zwiększa szansę na znalezienie czegoś w wysokiej trawie o _%2$s%%_.
items.trinkets.petrifiedseed.stats_desc=Na obecnym poziomie ten relikt sprawia, że w _%1$s%%_ przypadków w zdeptanej trawie znajdzie się kamienie runiczne zamiast nasion oraz zwiększa szansę na znalezienie czegoś w wysokiej trawie o _%2$s%%_.

items.trinkets.ratskull.name=szczurza czaszka
items.trinkets.ratskull.desc=Ten makabryczny relikt nie jest dużo większy od czaszki normalnego szczura, co jest rzadkością w tych lochach. Magiczny wpływ czaszki zdaje się przyciągać rzadszych mieszkańców lochów, sprawiając, że pojawiają się znacznie częściej.
items.trinkets.ratskull.typical_stats_desc=Zazwyczaj ten relikt sprawia, że rzadcy egzotyczni wrogowie pojawią się _%dx_ częściej. Czaszka jest tylko w połowie skuteczna w przyciąganiu kryształowych mimików i opancerzonych posągów.
items.trinkets.ratskull.stats_desc=Na obecnym poziomie ten relikt sprawi, że rzadcy egzotyczni wrogowie pojawią się _%dx_ częściej. Czaszka jest tylko w połowie skuteczna w przyciąganiu kryształowych mimików i opancerzonych posągów.

items.trinkets.saltcube.name=kostka soli
items.trinkets.saltcube.desc=Ten duży kryształ solny został wycięty w niemal idealny sześcian i zamiast rozpuścić się wodzie tygla alchemicznego, osuszył go do połowy. Ma magiczne właściwości osuszające i konserwujące jedzenie, zwiększając ilość nasycenia z jedzenia, ale zmniejszając ilość regenerowanego zdrowia, gdy nie głodujesz.
items.trinkets.saltcube.typical_stats_desc=Zazwyczaj ten relikt zwiększa czas, zanim zgłodniejesz o _%1$s%%_, ale też spowalnia regenerację zdrowia o _%2$s%%_, chyba że piętro jest zamknięte.
items.trinkets.saltcube.stats_desc=Na obecnym poziomie ten relikt zwiększy czas, zanim zgłodniejesz o _%1$s%%_, ale też spowalnia regenerację zdrowia o _%2$s%%_, chyba że piętro jest zamknięte.

items.trinkets.shardofoblivion.name=złoto głupców
items.trinkets.shardofoblivion.desc=Po zagotowaniu go w tyglu alchemicznym, ten mały kawałek przeklętego metalu zamienił się... w nic? Fragment zagina światło i lewituje, gdy go nie trzymasz. Wygląda na to, że czerpie on moc magiczną z twojej głupoty, więc lepiej się nad nim za dużo nie rozmyślać.
items.trinkets.shardofoblivion.typical_stats_desc=Zazwyczaj ten relikt zwiększy częstotliwość upuszczania łupów przez wrogów o 20%% za każdy niezidentyfikowany element wyposażenia, który jest założony lub został niedawno użyty, do maksymalnie _%d przedmiotu(ów)_. Relikt uniemożliwi również identyfikację ekwipunku, ale można go użyć do ręcznej identyfikacji przedmiotów, z którymi jest się wystarczająco zaznajomionym.
items.trinkets.shardofoblivion.stats_desc=Na obecnym poziomie ten relikt zwiększy częstotliwość upuszczania łupów przez wrogów o 20%% za każdy niezidentyfikowany element wyposażenia, który jest założony lub został niedawno użyty, do maksymalnie _%d przedmiotu(ów)_. Relikt uniemożliwi również identyfikację ekwipunku, ale można go użyć do ręcznej identyfikacji przedmiotów, z którymi jest się wystarczająco zaznajomionym.
items.trinkets.shardofoblivion.ac_identify=IDENTYFIKUJ
items.trinkets.shardofoblivion.identify_prompt=Zidentyfikuj Przedmiot
items.trinkets.shardofoblivion.identify_ready=Przedmiot gotowy do identyfikacji: %s. Użyj złota głupców, aby zidentyfikować.
items.trinkets.shardofoblivion.identify_ready_worn=Wszystkie noszone przez ciebie przedmioty są gotowe do identyfikacji. Użyj złota głupców, aby je zidentyfikować.
items.trinkets.shardofoblivion.identify_not_yet=Ten przedmiot nie jest jeszcze gotowy do zidentyfikowania.
items.trinkets.shardofoblivion.identify=Zidentyfikowano przedmiot!
items.trinkets.shardofoblivion$wandusetracker.name=Użycie Niezidentyfikowanej Różdżki
items.trinkets.shardofoblivion$wandusetracker.desc=Niedawno została użyta niezidentyfikowana różdżka, która na potrzeby złota głupców tymczasowo liczy się jako niezidentyfikowany element ekwipunku.\n\nPozostałe tury efektu: %s.
items.trinkets.shardofoblivion$thrownusetracker.name=użycie niezidentyfikowanej broni miotanej
items.trinkets.shardofoblivion$thrownusetracker.desc=Niedawno została użyta niezidentyfikowana broń miotana, która na potrzeby złota głupców tymczasowo liczy się jako niezidentyfikowany element ekwipunku.\n\nPozostałe tury efektu: %s.

items.trinkets.thirteenleafclover.name=trzynastolistna koniczyna
items.trinkets.thirteenleafclover.desc=Gotowanie w tyglu alchemicznym sprawiło, że ta koniczyna wyrosła z mnóstwem dodatkowych liści! Nie jest do końca jasne czy ten relikt przynosi szczęście, czy pecha. Może sprawi, że twoje szczęście stanie się bardziej chaotyczne?
items.trinkets.thirteenleafclover.typical_stats_desc=Ten relikt zwykle sprawi, że postać zada maksymalne obrażenia w _%1$d%%_ przypadków, a minimalne obrażenia w _%2$d%%_ przypadków.
items.trinkets.thirteenleafclover.stats_desc=Na obecnym poziomie ten relikt sprawi, że postać zada maksymalne obrażenia w _%1$d%%_ przypadków, a minimalne obrażenia w _%2$d%%_ przypadków.

items.trinkets.trapmechanism.name=mechanizm pułapki
items.trinkets.trapmechanism.desc=Kluczowy mechanizm jednej z tutejszych zapadni, starannie wycięty z podłogi, aby można go było przenosić. Wydaje się, że jest magicznie związany z samymi lochami, sprawiając, że niebezpieczny teren staje się bardziej powszechny, zwiększając przy tym twoją wiedzę o nim.
items.trinkets.trapmechanism.typical_stats_desc=Zazwyczaj ten relikt sprawi, że _%1$d%%_ zwyczajnych pięter zostanie wypełnionych pułapkami lub przepaściami. Dodatkowo, _%2$d%%_ ukrytych pułapek w lochu będzie widocznych.
items.trinkets.trapmechanism.stats_desc=Na obecnym poziomie ten relikt sprawi, że _%1$d%%_ zwyczajnych pięter zostanie wypełnionych pułapkami lub przepaściami. Dodatkowo, _%2$d%%_ ukrytych pułapek w lochu będzie widocznych.

items.trinkets.vialofblood.name=fiolka krwi
items.trinkets.vialofblood.desc=Ta cienka fiolka ma w sobie krew jakiegoś potwora z tego lochu. Krew powoli przelewa się, gdy obracasz fiolkę. Wydaje się, że magicznie wzmacnia niektóre efekty leczenia, ale także je opóźnia.
items.trinkets.vialofblood.typical_stats_desc=Zazwyczaj ten relikt sprawia, że ilość zdrowia, którą otrzymujesz z wypitych mikstur leczenia, bukłaka z wodą czy studni życia jest zwiększona o _%1$s%%_. Jednakże, te efekty są spowolnione, lecząc maksymalnie _%2$s_ PŻ na turę (ta wartość rośnie wraz z poziomem postaci).
items.trinkets.vialofblood.stats_desc=Na obecnym poziomie ten relikt sprawi, że ilość zdrowia, którą otrzymujesz z wypitych mikstur leczenia, bukłaka z wodą czy studni życia jest zwiększona o _%1$s%%_. Jednakże, te efekty są spowolnione, lecząc maksymalnie _%2$s_ PŻ na turę (ta wartość rośnie wraz z poziomem postaci).

items.trinkets.wondrousresin.name=cudowna żywica
items.trinkets.wondrousresin.desc=Ta migocząca niebieska żywica wydaje się zawierać destylowaną esencję magii przeklętej różdżki. Magia tygla alchemicznego nieco ją ustabilizowała, co pozwala jej teraz wpływać na twoje różdżki.
items.trinkets.wondrousresin.typical_stats_desc=Zazwyczaj ten relikt sprawia, że efekty przeklętych różdżek będą neutralne lub pozytywne w _%1$s%%_ przypadków, a nieprzeklęte różdżki wystrzelą dodatkowy pocisk przeklętej różdżki o neutralnym lub pozytywnym efekcie w _%2$s%%_ przypadków.\n\nUlepszenie tego reliktu kosztuje większą ilość energii.
items.trinkets.wondrousresin.stats_desc=Na obecnym poziomie ten relikt sprawi, że efekty przeklętych różdżek będą neutralne lub pozytywne w _%1$s%%_ przypadków, a nieprzeklęte różdżki wystrzelą dodatkowy pocisk przeklętej różdżki o neutralnym lub pozytywnym efekcie w _%2$s%%_ przypadków.\n\nUlepszenie tego reliktu kosztuje większą ilość energii.

items.trinkets.trinketcatalyst.name=magiczny katalizator
items.trinkets.trinketcatalyst.window_title=stwórz relikt
items.trinkets.trinketcatalyst.window_text=Woda zaczyna świecić po dodaniu katalizatora. W pobliżu widzisz kilka przedmiotów, które możesz nasycić energią, by przemienić któryś z nich w magiczny relikt.
items.trinkets.trinketcatalyst.desc=Ta kula magicznego złotego pyłu lśni w ciemnościach lochów. Ten katalizator można użyć w tyglu alchemicznym z odrobiną energii alchemicznej, aby stworzyć unikalny relikt.\n\nRelikty zapewniają różne efekty, które nieznacznie zmieniają lochy lub ich mieszkańców. Relikty można ulepszać, dodając więcej energii, aby zwiększyć ich moc, lub porzucać, aby całkowicie zrezygnować z efektu.
items.trinkets.trinketcatalyst$randomtrinket.name=losowy relikt
items.trinkets.trinketcatalyst$randomtrinket.desc=Jeden z pobliskich przedmiotów jest zamknięty w sakiewce, której nie potrafisz otworzyć.\n\nMagia alchemii rozpuści sakiewkę, uwalniając przedmiot w jej wnętrzu, ale nie wiadomo, jaki otrzymasz relikt, dopóki tego nie zrobisz!

items.trinkets.trinket.discover_hint=Ten przedmiot może być opcją do wyboru, gdy tworzysz relikt za pomocą alchemii.
items.trinkets.trinket$placeholder.name=relikt

###wands
items.wands.cursedwand.ondeath=Zabiła cię twoja własna %s.
items.wands.cursedwand.nothing=Nic się nie dzieje.
items.wands.cursedwand.mass_invuln=Olśniewające światło błyszczy z twojej różdżki!
items.wands.cursedwand.petrify=Nagle zamarzłeś w miejscu!
items.wands.cursedwand.grass=Trawa wyrasta wokoło ciebie!
items.wands.cursedwand.fire=Czujesz spaleniznę...
items.wands.cursedwand.transmogrify_wand=Twoja różdżka przeobraziła się w inny przedmiot!
items.wands.cursedwand.transmogrify_other=Twój przedmiot przeobraża się w coś innego!
items.wands.cursedwand.disguise=Twój wygląd zmienia się na twoich oczach!
items.wands.cursedwand.supernova=Rozjarzona kula energii zaczyna rosnąć. Chyba lepiej stąd znikać!
items.wands.cursedwand.supernova_positive=Rozjarzona kula energii zaczyna rosnąć, ale nie czujesz się nią zagrożony.
items.wands.cursedwand.sinkhole=Grunt pod nogami zaczyna ci się obsuwać!
items.wands.cursedwand.sinkhole_positive=Grunt zaczyna się zapadać, ale pod tobą wydaje się wystarczająco twardy.
items.wands.cursedwand.gravity=Grawitacja nagle zaczyna ciągnąć w losowe kierunki!
items.wands.cursedwand.gravity_positive=Grawitacja nagle zaczyna ciągnąć w losowe kierunki, ale wygląda na to, że ciebie to nie dotyczy.
items.wands.cursedwand.gravity_end=Chaos grawitacyjny kończy się.

items.wands.damagewand.upgrade_stat_name_1=Magiczne Obrażenia

items.wands.wand.ac_zap=STRZEL
items.wands.wand.fizzles=Twoja różdżka iskrzy; nie ma wystarczająco dużego ładunku.
items.wands.wand.no_magic=Twoja różdżka iskrzy; nie możesz używać różdżek podczas bycia magicznie odpornym.
items.wands.wand.self_target=Nie możesz celować w samego siebie!
items.wands.wand.identify=Jesteś już wystarczająco dobrze zaznajomiony z tą różdżką, by ją zidentyfikować.
items.wands.wand.resin_one=Ta różdżka jest ulepszona o _1 poziom_ za pomocą magicznej żywicy.
items.wands.wand.resin_many=Ta różdżka jest ulepszona o _%d poziomy_ za pomocą magicznej żywicy.
items.wands.wand.cursed=Ta różdżka jest przeklęta, jej magia jest chaotyczna i przypadkowa.
items.wands.wand.not_cursed=Ta różdżka jest wolna od wrogiej magii.
items.wands.wand.curse_discover=Ta %s jest przeklęta!
items.wands.wand.prompt=Wybierz miejsce do strzelenia
items.wands.wand$placeholder.name=różdżka

items.wands.wandofblastwave.name=różdżka fali wybuchu
items.wands.wandofblastwave.staff_name=kostur fali wybuchu
items.wands.wandofblastwave.ondeath=Zabiła cię twoja własna różdżka fali wybuchu...
items.wands.wandofblastwave.knockback_ondeath=Zostałeś wbity w ścianę...
items.wands.wandofblastwave.desc=Ta różdżka jest wykonana z pewnego rodzaju marmuru, ma złote wykończenie i okrągły, czarny klejnot na końcu. Czujesz jej ciężar w dłoni.
items.wands.wandofblastwave.typical_stats_desc=Ta różdżka wystrzeliwuje pocisk, który gwałtownie eksploduje w wybranym miejscu. Fala uderzeniowa zazwyczaj zadaje _%1$d-%2$d obrażeń_ i jest na tyle silna, że jest w stanie odrzucić przeciwników na znaczne odległości.
items.wands.wandofblastwave.stats_desc=Ta różdżka wystrzeliwuje pocisk, który gwałtownie eksploduje w wybranym miejscu. Fala uderzeniowa zadaje _%1$d-%2$d obrażeń_ i jest na tyle silna, że jest w stanie odrzucić przeciwników na znaczne odległości.
items.wands.wandofblastwave.upgrade_stat_name_2=Siła Odepchnięcia
items.wands.wandofblastwave.bmage_desc=Gdy _Mag bojowy_ uderza sparaliżowanego przeciwnika kosturem fali wybuchu, paraliż zostanie przerwany aby wywołać wybuch dodatkowych magicznych obrażeń. Nie można tego wykorzystać w krótkim odstępie czasu na tym samym wrogu.
items.wands.wandofblastwave.eleblast_desc=Wybuch żywiołów z użyciem kostura fali wybuchu zadaje 67% obrażeń i odrzuca wszystkich wrogów poza obszar wybuchu.

items.wands.wandofcorrosion.name=różdżka korozji
items.wands.wandofcorrosion.staff_name=kostur korozji
items.wands.wandofcorrosion.desc=Ta różdżka jest zrobiona z jesionu i ma świetnie wykonany pomarańczowy klejnot.
items.wands.wandofcorrosion.stats_desc=Ta różdżka strzela pociskiem, który eksploduje w wybranym miejscu, tworząc chmurę silnie żrącego gazu. Wszystko, co znajdzie się w chmurze, będzie otrzymywać zwiększające się z czasem obrażenia, zaczynając od _%d_.
items.wands.wandofcorrosion.upgrade_stat_name_1=Obrażenia od Korozji
items.wands.wandofcorrosion.upgrade_stat_name_2=Objętość Gazu
items.wands.wandofcorrosion.bmage_desc=Gdy _Mag bojowy_ uderza przeciwnika kosturem korozji, ma szansę na pokrycie go żrącym szlamem.
items.wands.wandofcorrosion.eleblast_desc=Wybuch żywiołów z użyciem kostura korozji nakłada na wrogów efekt korozji na 4 tury, rozpoczynając od 6 punktów obrażeń.

items.wands.wandofcorruption.name=różdżka korupcji
items.wands.wandofcorruption.staff_name=kostur korupcji
items.wands.wandofcorruption.already_corrupted=Nie można bardziej wpłynąć na tą postać.
items.wands.wandofcorruption.desc=Ta różdżka promieniuje chaotyczną, mroczną energią, tak jakby nie było to dość oczywiste, z małej ozdobnej czaszki na jej czubku.
items.wands.wandofcorruption.stats_desc=Ta różdżka wystrzeliwuje pocisk korupcyjnej energii, osłabiając przeciwników i ewentualnie konwertując ich na twoją stronę. Wrogowie mogą się oprzeć korupcji, ale wrogowie z pełnym zdrowiem będą trudniejsi do skorumpowania niż ci osłabieni.
items.wands.wandofcorruption.upgrade_stat_name_1=Moc Wypaczenia
items.wands.wandofcorruption.upgrade_stat_name_2=Czas Trwania Złych Efektów
items.wands.wandofcorruption.bmage_desc=Gdy _Mag bojowy_ uderza przeciwnika kosturem korupcji, istnieje szansa, że przeciwnik wpadnie w amok.
items.wands.wandofcorruption.eleblast_desc=Wybuch żywiołów z użyciem kostura korupcji nakłada na wrogów efekt amoku na 5 tur.

items.wands.wandofdisintegration.name=różdżka dezintegracji
items.wands.wandofdisintegration.staff_name=kostur dezintegracji
items.wands.wandofdisintegration.desc=Ta różdżka wykonana jest z solidnego, gładkiego kawałka obsydianu z głębokim, fioletowym światłem emitowanym z jej czubka i biegnącym wzdłuż boku. Promieniuje destrukcyjną energią, gotowa wkrótce wystrzelić.
items.wands.wandofdisintegration.stats_desc=Ta różdżka wystrzeliwuje promień, który jest w stanie przebić każdą przeszkodę i będzie sięgał dalej wraz z ulepszeniami. Promień zadaje _%1$d-%2$d obrażeń_ i dodatkowe obrażenia wraz z każdym kolejnym przebitym wrogiem czy ścianą.
items.wands.wandofdisintegration.upgrade_stat_name_2=Maksymalny Zasięg
items.wands.wandofdisintegration.bmage_desc=Gdy _Mag bojowy_ używa kostura dezintegracji, jego zasięg ataku jest zwiększony, tak, jakby posiadał na sobie zaklęcie dalekosiężności.
items.wands.wandofdisintegration.eleblast_desc=Wybuch żywiołów z użyciem kostura dezintegracji zadaje 100% obrażeń i przebija się przez ściany.

items.wands.wandoffireblast.name=różdżka ognistego podmuchu
items.wands.wandoffireblast.staff_name=kostur ognistego podmuchu
items.wands.wandoffireblast.desc=Ta różdżka została wykonana z czerwonego, polakierowanego drewna, a złoty liść ma jej nadać bardziej królewskiego wyglądu. Jej końcówka trzeszczy i syczy, żądna uwolnić swoją potężną magię.
items.wands.wandoffireblast.stats_desc=Ta różdżka po użyciu wystrzeliwuje stożek ognia. Jej następny atak _zużyje %1$d ładunków_ i zada _%2$d-%3$d obrażeń._ Im więcej ładunków ten atak wykorzystuje, tym większy i potężniejszy ten efekt.
items.wands.wandoffireblast.upgrade_stat_name_1=Obrażenia 1. Ładunku
items.wands.wandoffireblast.upgrade_stat_name_2=Obrażenia 2. Ładunków
items.wands.wandoffireblast.upgrade_stat_name_3=Obrażenia 3. Ładunków
items.wands.wandoffireblast.bmage_desc=Gdy _Mag bojowy_ uderza przeciwnika kosturem ognistego podmuchu, istnieje szansa na wywołanie eksplozji, która zada obrażenia wrogom i pochłonie pobliski ogień! Ta szansa się zwiększa im więcej jest ognia obok wroga.
items.wands.wandoffireblast.eleblast_desc=Wybuch żywiołów z użyciem kostura ognistego podmuchu zadaje 100% obrażeń, otwiera drzwi oraz podpala otoczenie i przeciwników.

items.wands.wandoffrost.name=różdżka mrozu
items.wands.wandoffrost.staff_name=kostur lodu
items.wands.wandoffrost.desc=Ta różdżka została najwyraźniej zrobiona z jakiegoś magicznego lodu. Jest jaśniejsza przy swoim zaokrąglonym wykończeniu. Czujesz, że jest bardzo zimna w dotyku, ale mimo to twoje ręce pozostają ciepłe.
items.wands.wandoffrost.stats_desc=Ta różdżka wydmuchuje pociski lodowatej energii w stronę przeciwników, zadając _%1$d-%2$d obrażeń_ i wychładzając ich. Efekt wydaje się być mocniejszy w wodzie. Wychłodzeni i zamarznięci przeciwnicy będą otrzymywali zmniejszone obrażenia od tej różdżki.
items.wands.wandoffrost.upgrade_stat_name_2=Czas Wychłodzenia
items.wands.wandoffrost.bmage_desc=Gdy _Mag bojowy_ uderza wychłodzonego przeciwnika kosturem mrozu, istnieje szansa, że ten przeciwnik natychmiast zamarznie. Ta szansa jest tym większa, im chłodniejszy jest przeciwnik.
items.wands.wandoffrost.eleblast_desc=Wybuch żywiołów z użyciem kostura mrozu zadaje 100% obrażeń, zamraża przeciwników i gasi płomienie.

items.wands.wandoflightning.name=różdżka burzy
items.wands.wandoflightning.staff_name=kostur burzy
items.wands.wandoflightning.ondeath=Zabiła cię twoja własna różdżką burzy...
items.wands.wandoflightning.desc=Ta różdżka jest wykonana z solidnego metalu, co sprawia, że jest zaskakująco ciężka. Dwa kolce są skrzywione razem na końcówce, a elektryczność iskrzy między nimi.
items.wands.wandoflightning.stats_desc=Ta różdżka wysyła potężną błyskawicę, która leci do celu, zadając _%1$d-%2$d obrażeń._ Elektryczność potrafi przeskakiwać między przeciwnikami, rozpościerając między nimi obrażenia. Błyskawica i obrażenia rozprzestrzeniają się o wiele efektywniej w wodzie. Łuk elektryczny tej różdżki może zranić ciebie, ale nie zada obrażeń sojusznikom.
items.wands.wandoflightning.bmage_desc=Gdy _Mag bojowy_ uderza przeciwnika kosturem burzy, istnieje szansa, że naelektryzuje on sam siebie na 10 tur. Dzięki temu jest on odporny na obrażenia od błyskawic, a błyskawice mogą przeskakiwać dalej.
items.wands.wandoflightning.eleblast_desc=Wybuch żywiołów z użyciem kostura burzy zadaje 100% obrażeń, ogłusza przeciwników na 5 tur i elektryzuje wodę.
items.wands.wandoflightning$lightningcharge.name=Naelektryzowany
items.wands.wandoflightning$lightningcharge.desc=_Mag bojowy_ jest naelektryzowany energią, dzięki czemu jest odporny na błyskawice i ma zwiększony zasięg przeskakiwania jego błyskawic.\n\nPozostało tur: %s.

items.wands.wandoflivingearth.name=różdżka żywej ziemi
items.wands.wandoflivingearth.staff_name=kostur żywej ziemi
items.wands.wandoflivingearth.desc=Ta różdżka jest wykonana z dość ciekawej skały z pasami błyszczącej, żółtej energii. Kamienie wydają się przesuwać i uginać pod twoim uchwytem, zupełnie jakby wyczuwały twoją dłoń.
items.wands.wandoflivingearth.stats_desc=Ta różdżka wysyła pociski magicznych skał w kierunku wrogów, zadając _%1$d-%2$d punktów obrażeń._ Kamienie te potem zbudują zbroję wokół użytkownika, przyznając zbroję proporcjonalną do zadanych obrażeń. Jeśli wystarczająco dużo zbroi zostanie utworzone, przekształci się ona w skalnego strażnika przy następnym użyciu różdżki.
items.wands.wandoflivingearth.upgrade_stat_name_2=Maks. PŻ Strażnika
items.wands.wandoflivingearth.upgrade_stat_name_3=Obrona Strażnika
items.wands.wandoflivingearth.bmage_desc=Gdy _Mag bojowy_ uderza przeciwnika kosturem żywej ziemi, część zadanych obrażeń jest zwracana jako skalna zbroja.
items.wands.wandoflivingearth.eleblast_desc=Wybuch żywiołów z użyciem kostura żywej ziemi zadaje 50% obrażeń i naprawia aktywowanego ziemnego strażnika za każdego trafionego przeciwnika.
items.wands.wandoflivingearth$rockarmor.name=skalna zbroja
items.wands.wandoflivingearth$rockarmor.desc=Magiczne skały otaczają twoje ciało. Przy otrzymaniu ataków spróbują cię obronić i zredukują obrażenia o 50%%. Jednakże wszelkie otrzymane obrażenia odłupują części skalnej zbroi.\n\nPozostała zbroja: %1$d.\n\nJeśli znajduje się na tobie wystarczająco dużo skał, następny strzał z twojej różdżki żywej ziemi sprawi, że kamienie uformują się w strażnika, który będzie dla ciebie walczyć.\n\nZbroja wymagana, by przyzwać Strażnika: %2$d.
items.wands.wandoflivingearth$rockarmor.desc_many=Ten ziemny strażnik korzysta z Mocy Wielu. Pozostałe tury: %d.
items.wands.wandoflivingearth$earthguardian.name=ziemny strażnik
items.wands.wandoflivingearth$earthguardian.desc=Skały z twojej różdżki żywej ziemi uformowały się w obronnego ziemnego strażnika! Ten posąg z ziemi i żwiru będzie atakować pobliskich wrogów, co sprawi, że zaatakują oni strażnika zamiast ciebie. Gdy zagrożenie zostanie zażegnane, strażnik ponownie zbuduje zbroję wokół ciebie i powróci przy następnym użyciu różdżki.
items.wands.wandoflivingearth$earthguardian.wand_info=Właściwości obronne strażnika są związane z poziomem twojej różdżki. Aktualnie blokuje on _%1$d-%2$d punktów obrażeń_.
items.wands.wandoflivingearth$earthguardian.discover_hint=Tę postać możesz spotkać za pomocą pewnej różdżki.

items.wands.wandofmagicmissile.name=różdżka magicznego pocisku
items.wands.wandofmagicmissile.staff_name=kostur magicznego pocisku
items.wands.wandofmagicmissile.desc=Ta dosyć prosta różdżka miota pociskami czystej magicznej energii. Sama w sobie nie oferuje żadnych efektów specjalnych, ale ma więcej ładunków, a po ulepszeniu może też chwilowo wzmacniać inne różdżki.
items.wands.wandofmagicmissile.stats_desc=Każdy pocisk z tej różdżki zadaje _%1$d-%2$d obrażeń_ i na chwilę wzmacnia inne różdżki, jeżeli jest ulepszona.
items.wands.wandofmagicmissile.bmage_desc=Gdy _Mag bojowy_ uderza przeciwnika kosturem magicznego pocisku, wszystkie jego różdżki zostaną dodatkowo naładowane.
items.wands.wandofmagicmissile.eleblast_desc=Wybuch żywiołu z użyciem kostura magicznego pocisku zadaje 50% obrażeń i zapewnia 15 tur ładowania różdżek.
items.wands.wandofmagicmissile.discover_hint=Z tym przedmiotem zaczyna jeden z bohaterów.
items.wands.wandofmagicmissile$magiccharge.name=magiczny ładunek
items.wands.wandofmagicmissile$magiccharge.desc=Twoja różdżka magicznego pocisku napełniła mocą twoje pozostałe różdżki, wzmacniając ich efektywny poziom przy następnym strzale.\n\nTwoje różdżki są wzmocnione do +%d.\n\nPozostałe tury magicznego wzmocnienia: %s.

items.wands.wandofprismaticlight.name=różdżka pryzmatycznego światła
items.wands.wandofprismaticlight.staff_name=kostur pryzmatycznego światła
items.wands.wandofprismaticlight.desc=Ta różdżka została wykonana z dużego fragmentu prześwitującego kryształu, wyglądającego jak długi kawałek gładkiego szkła. Małe błyski kolorowego światła tańczą na koniuszku różdżki, chcąc wystrzelić przed siebie.
items.wands.wandofprismaticlight.stats_desc=Ta różdżka strzela promieniami światła, które rozjaśniają mrok labiryntu i odsłaniają ukryte miejsca i pułapki. Wiązka potrafi oślepić wrogów i zadaje _%1$d-%2$d obrażeń._ Demoniczne i nieumarłe stwory spłoną w błysku światła różdżki i odniosą dodatkowe obrażenia.
items.wands.wandofprismaticlight.upgrade_stat_name_2=Szansa Oślepienia
items.wands.wandofprismaticlight.upgrade_stat_name_3=Czas Rozświetlenia
items.wands.wandofprismaticlight.bmage_desc=Gdy _Mag bojowy_ uderza przeciwnika kosturem pryzmatycznego światła, zostanie on okaleczony na czas zależny od poziomu kostura.
items.wands.wandofprismaticlight.eleblast_desc=Wybuch żywiołów z użyciem kostura pryzmatycznego światła zadaje 67% obrażeń, ujawnia otoczenie w miejscu wybuchu i oślepia wrogów na 5 tur.

items.wands.wandofregrowth.name=różdżka odrodzenia
items.wands.wandofregrowth.staff_name=kostur odrośnięcia
items.wands.wandofregrowth.desc=Ta różdżka jest wykonana z cienkiego kawałka starannie wyrzeźbionego drewna. Jakimś cudem wciąż tętni życiem, jasnozielona jak młode drzewo. "Gdy jedno życie się kończy, drugie się zaczyna... Ten odwieczny cykl nigdy się nie kończy!"
items.wands.wandofregrowth.stats_desc=Przy użyciu ta różdżka wystrzeli magiczną energię odrodzenia o kształcie stożka, powodując wzrost trawy, korzeni i rzadkich roślin. Następne użycie zużyje następującą _liczbę ładunków: %1$d_. Im więcej ładunków różdżka użyje, tym większy i silniejszy będzie efekt.
items.wands.wandofregrowth.degradation=_Pozostałe ładunki: %d_. Po ich wykorzystaniu różdżka nie będzie powodować wzrostu roślin i świeżej trawy. Ten limit jest zwiększany przez zdobywanie poziomów lub ulepszanie różdżki.
items.wands.wandofregrowth.upgrade_stat_name_1=Trawa na Ładunek
items.wands.wandofregrowth.upgrade_stat_name_2=Limit trawy
items.wands.wandofregrowth.bmage_desc=Gdy _Mag bojowy_ uderza przeciwnika kosturem odrodzenia, a jego cel lub on sam stoją na trawie, Mag zyskuje roślinne leczenie proporcjonalne do zadanych obrażeń.
items.wands.wandofregrowth.eleblast_desc=Wybuch żywiołów z użyciem kostura odrodzenia zakorzenia wrogów w miejscu i sprawia, że wokół wyrasta trawa.
items.wands.wandofregrowth$dewcatcher.name=Rosołap
items.wands.wandofregrowth$dewcatcher.desc=Rosołapy są wspaniałymi roślinami, które wypełniają się magiczną rosą. Kamuflują się one jako trawa, by uniknąć zainteresowania, ale pęcherze zebranej rosy wyróżniają je na tle innych.
items.wands.wandofregrowth$dewcatcher.discover_hint=Tę roślinę możesz spotkać za pomocą pewnej różdżki.
items.wands.wandofregrowth$seedpod.name=Wielogroch
items.wands.wandofregrowth$seedpod.desc=Wielogroch jest magiczną rośliną, która produkuje nasiona innych roślin zamiast swoich własnych. Pomimo nieposiadania własnych nasion, jakimś cudem udaje im się rozprzestrzeniać.
items.wands.wandofregrowth$seedpod.discover_hint=Tę roślinę możesz spotkać za pomocą pewnej różdżki.
items.wands.wandofregrowth$lotus.name=Złoty lotos
items.wands.wandofregrowth$lotus.desc=Złoty lotos jest mistyczną rośliną, która może być wezwana tylko przez potężną różdżkę odrodzenia. Jego aura wzmacnia wszystkie rośliny oraz ich efekty, ale z powodu jego ogromnej mocy po chwili się wypala.
items.wands.wandofregrowth$lotus.wand_info=Ten lotos został stworzony przez różdżkę odrodzenia _+%1$d_. Wszystkie rośliny natychmiastowo _wywołają swoje efekty_, jeżeli są posadzone na stworzeniu. Rośliny mają dodatkowo _%2$d%% szans_, by upuścić swoje nasiono, a strzałki z nasączonym grotem zużyją _%3$d%% mniej wytrzymałości_.
items.wands.wandofregrowth$lotus.discover_hint=Tę roślinę możesz spotkać za pomocą pewnej różdżki po ulepszeniu jej kilkukrotnie.

items.wands.wandoftransfusion.name=różdżka transfuzji
items.wands.wandoftransfusion.staff_name=kostur transfuzji
items.wands.wandoftransfusion.ondeath=Zabiła cię twoja własna różdżką transfuzji...
items.wands.wandoftransfusion.charged=Twoja różdżka jest naładowana energią życiową twojego przeciwnika!
items.wands.wandoftransfusion.desc=Dość prosta w swojej konstrukcji różdżka, wyróżnia się ciemnoróżowym odcieniem i intensywnie czarnym kryształem na końcu.
items.wands.wandoftransfusion.stats_desc=Jeśli zostanie użyta na sojusznikach lub zauroczonych przeciwnikach, różdżka ta zabierze _użytkownikowi %1$d PŻ_, ale cele zostaną uleczone lub osłonięte o _%2$d PŻ_. Jeżeli użyta będzie na przeciwnikach, zostaną oni tymczasowo zauroczeni, a użytkownik dostanie _%3$d punktów osłony_. Nieumarli, zamiast zostać zauroczeni, stracą _%4$d-%5$d punktów życia_.
items.wands.wandoftransfusion.upgrade_stat_name_1=Leczenie Sojusznika
items.wands.wandoftransfusion.upgrade_stat_name_2=Samo-Osłona
items.wands.wandoftransfusion.upgrade_stat_name_3=Obrażenia Nieumarłym
items.wands.wandoftransfusion.bmage_desc=Gdy _Mag bojowy_ uderza zauroczonego przeciwnika kosturem transfuzji, otrzyma on osłonę, a jego następny strzał kosturem nie będzie go kosztował zdrowia.
items.wands.wandoftransfusion.eleblast_desc=Wybuch żywiołów z użyciem kostura transfuzji zauroczy przeciwników, uzdrowi sojuszników i zada 100% obrażeń nieumarłym wrogom.

items.wands.wandofwarding.name=różdżka wartownika
items.wands.wandofwarding.staff_name=kostur wartownika
items.wands.wandofwarding.no_more_wards=Twoja różdżka nie podtrzyma więcej wartowników.
items.wands.wandofwarding.bad_location=Nie możesz postawić tam wartownika.
items.wands.wandofwarding.desc=Ta krótka, metalowa różdżka ma jasny, fioletowy kryształ unoszący się tuż nad jej końcem.
items.wands.wandofwarding.stats_desc=Zamiast bezpośrednio krzywdzić wrogów, ta różdżka przywoła stacjonarnych wartowników i protektorów. Wartownicy mogą być postawieni w każdym wolnym miejscu – nawet przez ściany, jeśli teren za nimi jest w zasięgu wzroku. Ta różdżka jest w stanie utrzymać wartowników do wartości _%d jednostek energii_ naraz.
items.wands.wandofwarding.upgrade_stat_name_1=Obrażenia Wartownika
items.wands.wandofwarding.upgrade_stat_name_2=Energia Wartownika
items.wands.wandofwarding.bmage_desc=Gdy _Mag bojowy_ uderza przeciwnika kosturem wartownika, wszyscy aktywni wartownicy i protektorzy mają szansę na bycie uleczonymi.
items.wands.wandofwarding.eleblast_desc=Wybuch żywiołów z użyciem kostura wartownika leczy wszystkich wartowników i protektorów w strefie wybuchu.
items.wands.wandofwarding$ward.desc_generic_ward=Ten wartownik będzie automatycznie ostrzeliwać przeciwników w zasięgu wzroku.\n\nMożesz ulepszyć tego wartownika, używając na nim swojej różdżki.\n\nWartownicy mają określoną liczbę strzałów, którą mogą oddać, zanim się rozproszą.
items.wands.wandofwarding$ward.desc_generic_sentry=Ten pomniejszy strażnik ma tę samą siłę ognia co większy wartownik, ale ma zdrowie zamiast określonej liczby ładunków. Przypomina kryształ będący na czubku różdżki, która go stworzyła.\n\nUżycie różdżki wartownika na tym strażniku uleczy go i ulepszy jednocześnie.\n\nStrażnik będzie używać części swojego zdrowia przy każdym wyprowadzonym ataku, ale może zostać uleczony przy użyciu różdżki wartownika.
items.wands.wandofwarding$ward.name_1=pomniejszy wartownik
items.wands.wandofwarding$ward.desc_1=Ten podstawowy wartownik będzie automatycznie ostrzeliwać przeciwników w zasięgu, zadając _%1$d-%2$d punktów obrażeń._\n\nMożesz ulepszyć tego wartownika używając na nim swojej różdżki.\n\nTen wartownik może oddać tylko 1 strzał przed rozproszeniem.\n\nTwoja różdżka wartownika używa _%3$d jednostki energii_ aby utrzymać tego wartownika.
items.wands.wandofwarding$ward.name_2=wartownik
items.wands.wandofwarding$ward.desc_2=Ten ulepszony wartownik ma bardziej skomplikowany wzór i może atakować kilkukrotnie. Każdy strzał tego wartownika zada _%1$d-%2$d obrażeń._\n\nMożesz ulepszyć tego wartownika używając na nim swojej różdżki.\n\nTen wartownik może oddać 3 strzały przed rozproszeniem.\n\nTwoja różdżka wartownika używa _%3$d jednostki energii_ aby utrzymać tego wartownika.
items.wands.wandofwarding$ward.name_3=większy wartownik
items.wands.wandofwarding$ward.desc_3=Ten w pełni ulepszony wartownik atakuje szybciej i oddaje więcej strzałów niż jego poprzednicy. Każdy atak tego wartownika zada _%1$d-%2$d obrażeń._\n\nMożesz ulepszyć tego wartownika używając na nim swojej różdżki.\n\nTen wartownik może oddać 4 strzały przed rozproszeniem.\n\nTwoja różdżka wartownika używa _%3$d jednostki energii_ aby utrzymać tego wartownika.
items.wands.wandofwarding$ward.name_4=pomniejszy strażnik
items.wands.wandofwarding$ward.desc_4=Ten pomniejszy strażnik ma tę samą siłę ognia co większy wartownik, ale ma zdrowie zamiast określonej liczby ładunków. Przypomina kryształ będący na czubku różdżki, która go stworzyła. Każdy atak tego strażnika zada _%1$d-%2$dobrażeń_.\n\nUżycie różdżki wartownika na tym strażniku uleczy go i ulepszy jednocześnie.\n\nStrażnik będzie używać części swojego zdrowia przy każdym wyprowadzonym ataku, ale może zostać uleczony dzięki różdżce wartownika.\n\nTwoja różdżka używa _%3$djednostek energii_, by utrzymać tego strażnika.
items.wands.wandofwarding$ward.name_5=strażnik
items.wands.wandofwarding$ward.desc_5=Ten ulepszony strażnik jest większy i bardziej wytrzymały niż jego pomniejsza wersja. Każdy atak tego strażnika zada _%1$d-%2$d obrażeń_.\n\nUżycie różdżki wartownika na tym strażniku sprawi, że zostanie on uleczony oraz wzmocniony.\n\nStrażnik będzie używać części swojego zdrowia przy każdym wyprowadzonym ataku, ale może zostać uleczony dzięki różdżce wartownika.\n\nTwoja różdżka używa _%3$d jednostek energii_ aby utrzymać tego strażnika.
items.wands.wandofwarding$ward.name_6=większy strażnik
items.wands.wandofwarding$ward.desc_6=Ten w pełni ulepszony strażnik jest znacznie bardziej wytrzymały niż wszyscy jego poprzednicy. Każdy atak tego protektora zada _%1$d-%2$d obrażeń._\n\nUżycie różdżki wartownika na tym strażniku sprawi, że zostanie on uleczony.\n\nStrażnik będzie używać części swojego zdrowia przy każdym wyprowadzonym ataku, ale może zostać uleczony dzięki różdżce wartownika.\n\nTwoja różdżka używa _%3$d jednostek energii_ aby utrzymać tego strażnika.
items.wands.wandofwarding$ward.discover_hint=Tę postać możesz spotkać za pomocą pewnej różdżki.
items.wands.wandofwarding$ward.dismiss_title=Odwołać tego wartownika?
items.wands.wandofwarding$ward.dismiss_body=Możesz rozproszyć tego wartownika, jeśli nie chcesz, by twoja różdżka go dalej podtrzymywała.\nZostanie on wtedy natychmiastowo zniszczony.\n\nOdwołać tego wartownika?
items.wands.wandofwarding$ward.dismiss_confirm=Tak
items.wands.wandofwarding$ward.dismiss_cancel=Nie

###weapon curses
items.weapon.curses.annoying.name=%s drwiny
items.weapon.curses.annoying.msg_1=OHO, WALCZYMY Z CZYMŚ!?
items.weapon.curses.annoying.msg_2=TAK, BIERZ ICH!
items.weapon.curses.annoying.msg_3=HEJ, SŁUCHAJ!
items.weapon.curses.annoying.msg_4=DOSZLIŚMY JUŻ DO BOSSA!?
items.weapon.curses.annoying.msg_5=AUĆ, NIE MACHAJ MNĄ TAK MOCNO!
items.weapon.curses.annoying.msg_6=GIŃ, OWADZIE!
items.weapon.curses.annoying.msg_7=ŁIIIIIIIIIIIIIII!
items.weapon.curses.annoying.msg_8=MOŻEMY ZROBIĆ PRZERWĘ!?
items.weapon.curses.annoying.msg_9=BUM, HAHA!
items.weapon.curses.annoying.msg_10=ŚWIETNE UDERZENIE!
items.weapon.curses.annoying.msg_11=Nie chciałam być bronią, chciałam być siekierą drwala.
items.weapon.curses.annoying.msg_12=Pamiętaj, nadmierna pewność siebie jest powolnym i podstępnym mordercą.
items.weapon.curses.annoying.msg_13=WSZYSTKIE WASZE BAZY NALEŻĄ DO NAS!
items.weapon.curses.annoying.desc=Bronie z klątwą drwiny są zdolne do mowy, lecz są trochę zbyt rozgadane. Będą często zwracać uwagę przeciwników na ciebie, nawet jeśli tego nie chcesz.
items.weapon.curses.annoying.elestrike_desc=Używając broni z klątwą drwiny, cios żywiołów ma 20% szans na nałożenie amoku na 6 tur na każdego z przeciwników w zasięgu.

items.weapon.curses.dazzling.name=%s oślepienia
items.weapon.curses.dazzling.desc=Bronie z klątwą oślepienia czasami wybuchają błyskiem światła, które oślepia wszystkie cele w zasięgu widzenia.
items.weapon.curses.dazzling.elestrike_desc=Używając broni z klątwą oślepienia, cios żywiołów ma 50% szans na oślepienie na 6 tur każdego z przeciwników w zasięgu.

items.weapon.curses.displacing.name=%s przenoszenia
items.weapon.curses.displacing.desc=Bronie z klątwą przenoszenia są przepełnione chaotyczną magią teleportacji, mogą przez to teleportować przeciwników w losowe miejsce na mapie.
items.weapon.curses.displacing.elestrike_desc=Używając broni z klątwą przenoszenia, cios żywiołów ma 50% szans na teleportację każdego z przeciwników w zasięgu.

items.weapon.curses.explosive.name=%s wybuchu
items.weapon.curses.explosive.warm=Ciepłe...
items.weapon.curses.explosive.hot=Gorące!
items.weapon.curses.explosive.desc=Wybuchowe bronie zbierają energię podczas walki i wybuchają, raniąc wszystkich w pobliżu.
items.weapon.curses.explosive.desc_cool=Twoja broń jest obecnie chłodna w dotyku.
items.weapon.curses.explosive.desc_warm=Twoja broń zbiera energię, stając się coraz cieplejsza...
items.weapon.curses.explosive.desc_hot=Twoja broń jest gorąca! Zaraz wybuchnie!
items.weapon.curses.explosive.elestrike_desc=Używając broni z klątwą wybuchu, cios żywiołów ma 50% szans na spowodowanie wybuchu na losowym przeciwniku w zasięgu.

items.weapon.curses.friendly.name=%s przyjaźni
items.weapon.curses.friendly.desc=Bronie z klątwą przyjaźni najbardziej przydadzą się pacyfistom. Czasami rzucają one zaklęcie czyniące niezdolnym do walki.
items.weapon.curses.friendly.elestrike_desc=Używając broni z klątwą przyjaźni, cios żywiołów ma 50% szans na zauroczenie na 6 tur każdego z przeciwników w zasięgu.

items.weapon.curses.polarized.name=%s polaryzacji
items.weapon.curses.polarized.desc=Broń z klątwą polaryzacji jest nasyconą magią powodującą, że jej atak zadaje 50% więcej obrażeń albo wcale.
items.weapon.curses.polarized.elestrike_desc=Używając broni z klątwą polaryzacji, cios żywiołów ma 50% szans na zadanie 24-36 obrażeń każdemu z przeciwników w zasięgu.

items.weapon.curses.sacrificial.name=%s ofiary
items.weapon.curses.sacrificial.desc=Bronie z klątwą ofiary żądają krwi tych, którzy ich używają, w zamian za atakowanie przeciwników. Im bardziej zdrowy jest użytkownik, tym więcej zostanie zabrane przez klątwę.
items.weapon.curses.sacrificial.elestrike_desc=Używając broni z klątwą ofiary, cios żywiołów sprawia, że bohaterce, jak i wszystkim przeciwnikom w zasięgu, zostaje nałożone krwawienie na 12 PŻ.

items.weapon.curses.wayward.name=%s nieobliczalności
items.weapon.curses.wayward.desc=Bronie z klątwą nieobliczalności czasami stają się bardzo niecelne po wyprowadzeniu ataku. Magia to powodująca utrzymuje się przez chwilę po aktywacji, ale może być rozproszona, trafiając cel bronią z tą samą klątwą.
items.weapon.curses.wayward.elestrike_desc=Używając broni z klątwą nieobliczalności, cios żywiołów ma 50% szans na przeklęcie na 6 tur każdego z przeciwników w zasięgu.
items.weapon.curses.wayward$waywardbuff.name=nieobliczalność
items.weapon.curses.wayward$waywardbuff.desc=Magia klątwy wpłynęła na twoją broń, sprawiając, że jest bardzo niecelna. Nie dotyczy to ataków, które zawsze trafiają, takich jak ataki z zaskoczenia. Trafienie przeciwnika bronią z tą klątwą natychmiastowo usunie ten efekt.\n\nPozostałe tury działania klątwy: %s.

###enchantments
items.weapon.enchantments.blazing.name=%s płomieni
items.weapon.enchantments.blazing.desc=Zaklęcie to sprawia, że broń buzuje ogniem, podpalając wrogów i zadając dodatkowe obrażenia tym, którzy już stoją w płomieniach.
items.weapon.enchantments.blazing.elestrike_desc=Używając broni z czarem płomieni, cios żywiołów podpala na 8 tur wszystkie pola w zasięgu.

items.weapon.enchantments.blocking.name=%s niezłomności
items.weapon.enchantments.blocking.desc=Bronie z zaklęciem niezłomności mają szansę na danie tarczy użytkownikowi po wyprowadzeniu ataku.
items.weapon.enchantments.blocking.elestrike_desc=Używając broni z czarem niezłomności, cios żywiołów zapewnia Fechmistrzyni 6 punktów osłony za każdego przeciwnika w zasięgu.
items.weapon.enchantments.blocking$blockbuff.name=niezłomność
items.weapon.enchantments.blocking$blockbuff.desc=Zaklęcie niezłomności znajdujące się na twojej broni daje ci krótkotrwały bonus do obrony!\n\nPozostało osłony: %d\n\nPozostałe tury: %s.

items.weapon.enchantments.blooming.name=%s rozkwitu
items.weapon.enchantments.blooming.desc=Bronie z zaklęciem rozkwitu zawierają magię powodującą kiełkowanie roślinności pod lub nieopodal uderzonych nimi celów.
items.weapon.enchantments.blooming.elestrike_desc=Używając broni z czarem rozkwitu, cios żywiołów rozprzestrzenia trawę do 8 pól w zasięgu oraz zakorzenia wszystkich przeciwników w zasięgu na 6 tur.

items.weapon.enchantments.chilling.name=%s mrozu
items.weapon.enchantments.chilling.desc=Wrogowie uderzeni bronią z tym czarem mają szansę na zostanie wychłodzonymi, co zmniejsza szybkość poruszania się i ataku.
items.weapon.enchantments.chilling.elestrike_desc=Używając broni z czarem mrozu, cios żywiołów ochładza powietrze w zasięgu na 8 tur.

items.weapon.enchantments.kinetic.name=%s kinetyki
items.weapon.enchantments.kinetic.desc=Kiedy wróg zostanie zabity kinetyczną bronią, nadmiar obrażeń zostanie w niej przechowany i uwolniony przy następnym celnym ataku.
items.weapon.enchantments.kinetic.elestrike_desc=Używając broni z czarem kinetyki, cios żywiołów zadaje 40% przechowanych obrażeń każdemu przeciwnikowi w zasięgu, poza głównym celem.
items.weapon.enchantments.kinetic$conserveddamage.name=zachowane obrażenia
items.weapon.enchantments.kinetic$conserveddamage.desc=Twoja broń ma w sobie pozostałą energię z poprzedniego śmiertelnego ataku i zaaplikuje ją jako bonusowe obrażenia przy następnym uderzeniu. Ta energia z czasem będzie powoli gasnąć.\n\nZachowane obrażenia: %d.

items.weapon.enchantments.corrupting.name=%s wypaczenia
items.weapon.enchantments.corrupting.desc=Ten potężny czar posiada zdolność konwertowania wrogów na twoją stronę. Kiedy wróg zostanie zabity przez tą broń, jest szansa na to, że zamiast umrzeć, stanie się on twoim sojusznikiem.
items.weapon.enchantments.corrupting.elestrike_desc=Używając broni z czarem wypaczenia, cios żywiołów ma 5-25% szans (zależnie od straconych punktów życia) na wypaczenie każdego z przeciwników w zasięgu, poza głównym celem.

items.weapon.enchantments.elastic.name=%s wypchnięcia
items.weapon.enchantments.elastic.desc=Broń z zaklęciem wypchnięcia ma szansę odepchnąć wrogów na krótki dystans.
items.weapon.enchantments.elastic.elestrike_desc=Używając broni z czarem wypchnięcia, cios żywiołów odpycha wszystkich przeciwników w zasięgu o 5 pól.

items.weapon.enchantments.grim.name=%s kostuchy
items.weapon.enchantments.grim.desc=Ten potężny czar niesie moc natychmiastowego uśmiercenia wroga. Im słabszy jest przeciwnik, tym bardziej prawdopodobny jest efekt.
items.weapon.enchantments.grim.elestrike_desc=Używając broni z czarem kostuchy, cios żywiołów ma 6-30% szans (zależnie od brakujących PŻ) na zabicie każdego z przeciwników w zasięgu, poza głównym celem.

items.weapon.enchantments.lucky.name=%s szczęściarza
items.weapon.enchantments.lucky.desc=Przeciwnicy pokonani z użyciem broni z zaklęciem szczęściarza mają szansę upuścić dodatkowy łup.
items.weapon.enchantments.lucky.elestrike_desc=Używając broni z czarem szczęściarza, cios żywiołów ma 12,5% szans na stworzenie przedmiotu pod każdym przeciwnikiem w zasięgu. Ten efekt można wykorzystać tylko raz na danym przeciwniku.

items.weapon.enchantments.projecting.name=%s dalekosiężności
items.weapon.enchantments.projecting.desc=Dzięki temu zaklęciu, broń biała będzie miała dodatkowy zasięg, a bronie miotane będą przebijać się przez pobliskie ściany, gdy rzucane w pobliskiego wroga.
items.weapon.enchantments.projecting.elestrike_desc=Używając broni z czarem dalekosiężności, cios żywiołów zadaje 30% dodatkowych obrażeń każdemu przeciwnikowi w zasięgu, poza głównym celem.

items.weapon.enchantments.shocking.name=%s piorunów
items.weapon.enchantments.shocking.desc=Broń z zaklęciem piorunów ma szansę na wytworzenie łuku elektrycznego, który zadaje dodatkowe obrażenia wszystkim pobliskim przeciwnikom.
items.weapon.enchantments.shocking.elestrike_desc=Używając broni z czarem piorunów, cios żywiołów wzbudza elektryczność na każdym polu w zasięgu na 8 tur.

items.weapon.enchantments.unstable.name=%s chaosu
items.weapon.enchantments.unstable.desc=Ten czar promieniuje chaotyczną energią, która przy ataku ma szansę na wyzwolenie losowego czaru.
items.weapon.enchantments.unstable.elestrike_desc=Używając broni z czarem chaosu, cios żywiołów rzuci losowy efekt zaklęcia na każdego przeciwnika w zasięgu, poza głównym celem.

items.weapon.enchantments.vampiric.name=%s wampira
items.weapon.enchantments.vampiric.desc=To potężne zaklęcie ma szansę na wyssanie siły życiowej z wrogów przy każdym ciosie, wprowadzając ją do noszącego. Efekt jest tym silniejszy, im niższe jest zdrowie użytkownika.
items.weapon.enchantments.vampiric.elestrike_desc=Używając broni z czarem wampira, cios żywiołów leczy Fechmistrzynię o 2,5 PŻ za każdego przeciwnika w zasięgu.


###melee weapons
items.weapon.melee.assassinsblade.name=skrytobójcze ostrze
items.weapon.melee.assassinsblade.stats_desc=Ta broń jest mocniejsza wobec nieobawiających się niczego wrogów.
items.weapon.melee.assassinsblade.ability_name=przyczajenie się
items.weapon.melee.assassinsblade.typical_ability_desc=Używając skrytobójczego ostrza, Fechmistrzyni może się _przyczaić_. Ta zdolność pozwala jej natychmiastowo odskoczyć na odległość do 3 pól, zazwyczaj zapewniając jej przy tym _niewidzialność na następującą liczbę tur: %d._
items.weapon.melee.assassinsblade.ability_desc=Używając skrytobójczego ostrza, Fechmistrzyni może się _przyczaić_. Ta zdolność pozwala jej natychmiastowo odskoczyć na odległość do 3 pól, zapewniając jej przy tym _niewidzialność na następującą liczbę tur: %d._
items.weapon.melee.assassinsblade.upgrade_ability_stat_name=Czas Trwania Umiejętności
items.weapon.melee.assassinsblade.desc=Małe, faliste ostrze wykonane z obsydianu, trudne w użyciu pomimo bycia lekkim, ale zabójcze, jeżeli celnie ugodzi ofiarę.

items.weapon.melee.battleaxe.name=topór bojowy
items.weapon.melee.battleaxe.stats_desc=To raczej celna broń.
items.weapon.melee.battleaxe.ability_name=powalający cios
items.weapon.melee.battleaxe.typical_ability_desc=Fechmistrzyni może wykonać _powalający cios_ przy użyciu topora bojowego. Ten skoncentrowany atak zazwyczaj zadaje _%1$d-%2$d obrażeń_, jeśli jest wykonany znienacka. Oszałamia on przy tym przeciwnika na 5 tur, zmniejszając jego celność i szansę na unik o 50%%. Powalające uderzenia zawsze sięgają celu, ale zadają standardowe obrażenia, jeśli atak nie jest wykonany z zaskoczenia.
items.weapon.melee.battleaxe.ability_desc=Fechmistrzyni może wykonać _powalający cios_ przy użyciu topora bojowego. Ten skoncentrowany atak zadaje _%1$d-%2$d obrażeń_, jeśli jest wykonany znienacka. Oszałamia on przy tym przeciwnika na 5 tur, zmniejszając jego celność i szansę na unik o 50%%. Powalające uderzenia zawsze sięgają celu, ale zadają standardowe obrażenia, jeśli atak nie jest wykonany z zaskoczenia.
items.weapon.melee.battleaxe.desc=Ogromne, stalowe ostrze tego topora bojowego wymaga sporego nakładu siły, by się nim zamachnąć.

items.weapon.melee.crossbow.name=kusza
items.weapon.melee.crossbow.typical_stats_desc=Ta broń, gdy jest założona, zazwyczaj zwiększa obrażenia zadawane przez miotane strzałki do _%1$d-%2$d_, a do tego przekazuje im swoje zaklęcie.
items.weapon.melee.crossbow.stats_desc=Ta broń, gdy jest założona, zwiększa obrażenia zadawane przez miotane strzałki do _%1$d-%2$d_, a do tego przekazuje im swoje zaklęcie.
items.weapon.melee.crossbow.ability_name=wzmocniony strzał
items.weapon.melee.crossbow.typical_ability_desc=Używając kuszy, Fechmistrzyni może przygotować _wzmocniony strzał_, dzięki czemu następny zwykły atak zawsze trafi. Dodatkowo, zostanie nałożony jeden z trzech efektów: ataki wręcz odepchną wrogów do tyłu, nienasączone strzałki zazwyczaj zadadzą _+%1$d obrażeń_, a nasączone strzałki zadziałają na obszarze 7x7 pól i zazwyczaj będą mogły być użyte _dodatkowe %2$d razy_.
items.weapon.melee.crossbow.ability_desc=Używając kuszy, Fechmistrzyni może przygotować _wzmocniony strzał_, dzięki czemu następny zwykły atak zawsze trafi. Dodatkowo, zostanie nałożony jeden z trzech efektów: ataki wręcz odepchną wrogów do tyłu, nienasączone strzałki zadadzą _+%1$d obrażeń_, a nasączone strzałki zadziałają na obszarze 7x7 pól i będą mogły być użyte _dodatkowe %2$d razy_.
items.weapon.melee.crossbow.desc=Dość skomplikowana broń, która strzela bełtami o bardzo wysokiej prędkości. Nie jest zaprojektowana do walki wręcz, ale porządna konstrukcja kuszy ją umożliwia.
items.weapon.melee.crossbow.upgrade_ability_stat_name=Wzmocnienie Umiejętności
items.weapon.melee.crossbow$chargedshot.name=naładowany
items.weapon.melee.crossbow$chargedshot.desc=Fechmistrzyni skupia moc w swojej kuszy. Następny wyprowadzony za jej pomocą atak zawsze trafi oraz nałoży jeden z trzech efektów:\n- Ataki bronią białą odepchną wrogów na kilka pól do tyłu.\n- Nienasączone strzałki zadadzą dodatkowe obrażenia.\n- Nasączone strzałki otrzymają dodatkowe użycia i zadziałają na obszarze o rozmiarze 7x7 pól. Pozytywne efekty strzałek zadziałają jedynie na sojuszników, a negatywne na przeciwników. Fechmistrzyni nie może użyć tej umiejętności, aby nałożyć na siebie pozytywny efekt strzałki.

items.weapon.melee.cudgel.name=buzdygan
items.weapon.melee.cudgel.stats_desc=To raczej celna broń.
items.weapon.melee.cudgel.ability_name=powalający cios
items.weapon.melee.cudgel.typical_ability_desc=Fechmistrzyni może wykonać _powalający cios_ przy użyciu buzdyganu. Ten skoncentrowany atak zadaje _%1$d-%2$d obrażeń_ gdy jest wykonany znienacka. Oszałamia on przy tym przeciwnika na 5 tur, zmniejszając jego celność i szansę na unik o 50%%. Powalający cios zawsze sięgnie celu, ale zada standardowe obrażenia, jeśli atak nie jest wykonany z zaskoczenia.
items.weapon.melee.cudgel.ability_desc=Fechmistrzyni może wykonać _powalający cios_ przy użyciu buzdyganu. Ten skoncentrowany atak zadaje _%1$d-%2$d obrażeń_ gdy jest wykonany znienacka. Oszałamia on przy tym przeciwnika na 5 tur, zmniejszając jego celność i szansę na unik o 50%%. Powalający cios zawsze sięgnie celu, ale zada standardowe obrażenia, jeśli atak nie jest wykonany z zaskoczenia.
items.weapon.melee.cudgel.desc=Mała, mosiężna buława, która raczej służyła szlachicom do samoobrony niż jako broń dla poszukiwaczy przygód.
items.weapon.melee.cudgel.discover_hint=Z tym przedmiotem zaczyna jeden z bohaterów.

items.weapon.melee.dagger.name=sztylet
items.weapon.melee.dagger.stats_desc=Ta broń jest mocniejsza wobec nieobawiających się niczego wrogów.
items.weapon.melee.dagger.ability_name=przyczajenie się
items.weapon.melee.dagger.typical_ability_desc=Używając sztyletu, Fechmistrzyni może się _przyczaić_. Ta zdolność pozwala jej natychmiastowo odskoczyć na odległość do 5 pól, zazwyczaj zapewniając jej przy tym _niewidzialność na następującą liczbę tur: %d._
items.weapon.melee.dagger.ability_desc=Używając sztyletu, Fechmistrzyni może się _przyczaić_. Ta zdolność pozwala jej natychmiastowo odskoczyć na odległość do 5 pól, zapewniając jej przy tym _niewidzialność na następującą liczbę tur: %d._
items.weapon.melee.dagger.upgrade_ability_stat_name=Czas Trwania Umiejętności
items.weapon.melee.dagger.desc=Prosty, żelazny nożyk z przetartą, drewnianą rękojeścią.
items.weapon.melee.dagger.discover_hint=Z tym przedmiotem zaczyna jeden z bohaterów.

items.weapon.melee.dirk.name=kindżał
items.weapon.melee.dirk.stats_desc=Ta broń jest mocniejsza wobec nieświadomych niczego wrogów.
items.weapon.melee.dirk.ability_name=przyczajenie się
items.weapon.melee.dirk.typical_ability_desc=Używając kindżału, Fechmistrzyni może się _przyczaić_. Ta zdolność pozwala jej natychmiastowo odskoczyć na odległość do 4 pól, zazwyczaj zapewniając jej przy tym _niewidzialność na następującą liczbę tur: %d._
items.weapon.melee.dirk.ability_desc=Używając kindżału, Fechmistrzyni może się _przyczaić_. Ta zdolność pozwala jej natychmiastowo odskoczyć na odległość do 4 pól, zapewniając jej przy tym _niewidzialność na następującą liczbę tur: %d._
items.weapon.melee.dirk.upgrade_ability_stat_name=Czas Trwania Umiejętności
items.weapon.melee.dirk.desc=Dłuższy sztylet pozwalający wepchnąć więcej stali w przeciwników.

items.weapon.melee.flail.name=kiścień
items.weapon.melee.flail.stats_desc=Jest to nieco powolna broń.\nNie można nią dokonać ataku znienacka.
items.weapon.melee.flail.ability_name=rozkręć
items.weapon.melee.flail.spin_warn=Nie możesz bardziej rozkręcić kiścienia.
items.weapon.melee.flail.typical_ability_desc=Fechmistrzyni może _rozkręcić_ kiścień, by zwiększyć moc jej następnego uderzenia, a także zagwarantować trafienie celu. Każda tura rozkręcania zazwyczaj kiścienia doda _+%d obrażeń_ do następnego zwykłym ataku, maksymalnie do 3 razy. Ładunek broni jest zużywany tylko na początku rozkręcania kiścienia.
items.weapon.melee.flail.ability_desc=Fechmistrzyni może _rozkręcić_ kiścień, by zwiększyć moc jej następnego uderzenia, a także zagwarantować trafienie celu. Każda tura rozkręcania kiścienia doda _+%d obrażeń_ do następnego zwykłym ataku, maksymalnie do 3 razy. Ładunek broni jest zużywany tylko na początku rozkręcania kiścienia.
items.weapon.melee.flail.desc=Kolczasta kula przymocowana do uchwytu za pomocą łańcucha. Bardzo nieporęczna, lecz niszczycielska, jeśli trafi w cel.
items.weapon.melee.flail$spinabilitytracker.name=wirowanie
items.weapon.melee.flail$spinabilitytracker.desc=Fechmistrzyni kręci swym kiścieniem, szykując się do wyprowadzenia mocniejszego uderzenia. Każdy obrót zajmuje jedną turę aczkolwiek zwiększa obrażenia, maksymalnie do trzech obrotów. Rozkręcony kiścień zawsze sięgnie celu.\n\nAktualne obroty: %1$d%%.\nPozostałe tury: %2$s.

items.weapon.melee.gauntlet.name=kamienna rękawica
items.weapon.melee.gauntlet.stats_desc=To bardzo szybka broń.
items.weapon.melee.gauntlet.ability_name=atak kombinacyjny
items.weapon.melee.gauntlet.typical_ability_desc=Fechmistrzyni może wykonać _atak kombinacyjny_ przy użyciu kamiennej rękawicy. Ten atak zawsze trafia i zazwyczaj zadaje _+%d punktów obrażeń_ za każde trafienie bronią białą lub miotaną. Brak trafienia w ciągu 5 tur resetuje ciąg.
items.weapon.melee.gauntlet.ability_desc=Fechmistrzyni może wykonać _atak kombinacyjny_ przy użyciu kamiennej rękawicy. Ten atak zawsze trafia i zadaje _+%d punktów obrażeń_ za każde trafienie bronią białą lub miotaną. Brak trafienia w ciągu 5 tur resetuje ciąg.
items.weapon.melee.gauntlet.desc=Ta masywna rękawica jest wykonana z karmazynowego materiału z warstwą ciężkich magicznych kamieni na wierzchu. Materiał zacieśnia się wokół twojej pięści, czyniąc grube kamienne płyty niemal drugą skórą. Wymachiwanie tak ciężką bronią wymaga siły, ale daje uderzeniom ogromną siłę.

items.weapon.melee.glaive.name=glewia
items.weapon.melee.glaive.stats_desc=To raczej powolna broń.\nTa broń posiada dodatkowy zasięg.
items.weapon.melee.glaive.ability_name=dźgnij
items.weapon.melee.glaive.typical_ability_desc=Fechmistrzyni może użyć czubka glewii, aby _dźgnąć_ przeciwnika, który jest w zasięgu, lecz nie obok niej. Atak ten zawsze trafia, odrzuca przeciwnika do tyłu i zazwyczaj zadaje mu _%1$d-%2$d obrażeń_.
items.weapon.melee.glaive.ability_desc=Fechmistrzyni może użyć czubka glewii, aby _dźgnąć_ przeciwnika, który jest w zasięgu, lecz nie obok niej. Atak ten zawsze trafia, odrzuca przeciwnika do tyłu i zazwyczaj zadaje mu _%1$d-%2$d obrażeń_.
items.weapon.melee.glaive.desc=Masywna broń drzewcowa składająca się z ostrza miecza na końcu drągu.

items.weapon.melee.gloves.name=ćwiekowane rękawice
items.weapon.melee.gloves.stats_desc=To bardzo szybka broń.
items.weapon.melee.gloves.ability_name=atak kombinacyjny
items.weapon.melee.gloves.typical_ability_desc=Fechmistrzyni może wykonać _atak kombinacyjny_ przy użyciu ćwiekowanych rękawic. Ten atak zawsze trafia i zazwyczaj zadaje _+%d punktów obrażeń_ za każde trafienie bronią białą lub miotaną. Brak trafienia w ciągu 5 tur resetuje ciąg.
items.weapon.melee.gloves.ability_desc=Fechmistrzyni może wykonać _atak kombinacyjny_ przy użyciu ćwiekowanych rękawic. Ten atak zawsze trafia i zadaje _+%d punktów obrażeń_ za każde trafienie bronią białą lub miotaną. Brak trafienia w ciągu 5 tur resetuje ciąg.
items.weapon.melee.gloves.desc=Te ćwiekowane rękawice tak naprawdę nie oferują żadnej ochrony, lecz służą jako użyteczna broń, jednocześnie pozostawiając wolne ręce.
items.weapon.melee.gloves.discover_hint=Z tym przedmiotem zaczyna jeden z bohaterów.

items.weapon.melee.greataxe.name=wielki topór
items.weapon.melee.greataxe.stats_desc=Ta broń jest niezwykle ciężka.
items.weapon.melee.greataxe.ability_name=odwet
items.weapon.melee.greataxe.typical_ability_desc=Fechmistrzyni może dokonać _odwetu_ przy użyciu wielkiego topora, jeśli ma mniej niż 50%% zdrowia. Ten dewastujący atak zazwyczaj zadaje _%1$d-%2$d obrażeń_, zawsze trafia i jest wykonywany natychmiastowo, jeśli zabije przeciwnika.
items.weapon.melee.greataxe.ability_desc=Fechmistrzyni może dokonać _odwetu_ przy użyciu wielkiego topora, jeśli ma mniej niż 50%% zdrowia. Ten dewastujący atak zadaje _%1$d-%2$d obrażeń_, zawsze trafia i jest wykonywany natychmiastowo, jeśli zabije przeciwnika.
items.weapon.melee.greataxe.desc=Przeznaczony do dzierżenia na ramieniu, ten gigantyczny topór jest równie potężny, jak i ciężki.

items.weapon.melee.greatshield.name=wielka tarcza
items.weapon.melee.greatshield.typical_stats_desc=Zazwyczaj podobne tarcze blokują 0-%d obrażeń. Wartość ta wzrasta wraz z ulepszeniami.
items.weapon.melee.greatshield.stats_desc=Ta broń blokuje 0-%d obrażeń, a jej skuteczność wzrasta wraz z ulepszeniami.
items.weapon.melee.greatshield.ability_name=zabezpiecz się
items.weapon.melee.greatshield.typical_ability_desc=Fechmistrzyni może _zabezpieczyć się_ przy użyciu wielkiej tarczy, całkowicie blokując wszystkie ataki fizyczne lub magiczne wyprowadzone przeciwko niej, zazwyczaj w czasie następnych _%d. tur_. Po zablokowaniu ataku wroga przez Fechmistrzynię atakowanie przeciwnika lub używanie magii zakończy zabezpieczanie się.
items.weapon.melee.greatshield.ability_desc=Fechmistrzyni może _zabezpieczyć się_ przy użyciu wielkiej tarczy, całkowicie blokując wszystkie ataki fizyczne lub magiczne wyprowadzone przeciwko niej w czasie następnych _%d. tur_. Po zablokowaniu ataku wroga przez Fechmistrzynię atakowanie przeciwnika lub używanie magii zakończy zabezpieczanie się.
items.weapon.melee.greatshield.upgrade_ability_stat_name=Czas Trwania Umiejętności
items.weapon.melee.greatshield.desc=Bardziej przenośna ściana aniżeli tarcza, ta gigantyczna masa metalu wspiera obronę, ale nie daje zbyt dużo miejsca na atak.

items.weapon.melee.greatsword.name=miecz dwuręczny
items.weapon.melee.greatsword.ability_name=rozszczep
items.weapon.melee.greatsword.typical_ability_desc=Fechmistrzyni może _rozpłatać_ przeciwnika przy użyciu miecza dwuręcznego. Ten atak zazwyczaj zadaje _%1$d-%2$d obrażeń_ i zawsze trafia. Jeśli Fechmistrzyni zabije przeciwnika tą umiejętnością, jest ona natychmiastowa, a poza tym w przeciągu 5 tur można jej użyć ponownie bez zużycia ładunku.
items.weapon.melee.greatsword.ability_desc=Fechmistrzyni może _rozpłatać_ przeciwnika przy użyciu miecza dwuręcznego. Ten atak zadaje _%1$d-%2$d obrażeń_ i zawsze trafia. Jeśli Fechmistrzyni zabije przeciwnika tą umiejętnością, jest ona natychmiastowa, a poza tym w przeciągu 5 tur można jej użyć ponownie bez zużycia ładunku.
items.weapon.melee.greatsword.desc=To niebosiężne ostrze jest w stanie zadać ciężkie obrażenia, jeśli tylko użytkownik będzie w stanie wprowadzić taką masę stali w rozmach.

items.weapon.melee.handaxe.name=siekiera
items.weapon.melee.handaxe.stats_desc=To raczej celna broń.
items.weapon.melee.handaxe.ability_name=powalający cios
items.weapon.melee.handaxe.typical_ability_desc=Fechmistrzyni może wykonać _powalający cios_ przy użyciu siekiery. Ten skoncentrowany atak zazwyczaj zadaje _%1$d-%2$d obrażeń_ gdy jest wykonany znienacka. Oszałamia on przy tym przeciwnika na 5 tur, zmniejszając jego celność i szansę na unik o 50%%. Powalający cios zawsze sięgnie celu, ale zada standardowe obrażenia, jeśli atak nie jest wykonany z zaskoczenia.
items.weapon.melee.handaxe.ability_desc=Fechmistrzyni może wykonać _powalający cios_ przy użyciu siekiery. Ten skoncentrowany atak zadaje _%1$d-%2$d obrażeń_ gdy jest wykonany znienacka. Oszałamia on przy tym przeciwnika na 5 tur, zmniejszając jego celność i szansę na unik o 50%%. Powalający cios zawsze sięgnie celu, ale zada standardowe obrażenia, jeśli atak nie jest wykonany z zaskoczenia.
items.weapon.melee.handaxe.desc=Lekka siekierka, najczęściej używana do ścinania drzew. Szerokie ostrze świetnie się sprawdza również w wycinaniu wrogów w pień.

items.weapon.melee.katana.name=katana
items.weapon.melee.katana.stats_desc=Ta broń blokuje 0-3 obrażeń.
items.weapon.melee.katana.ability_name=wykonaj wypad
items.weapon.melee.katana.typical_ability_desc=Używając katany, Fechmistrzyni może _wykonać wypad_, by zaatakować przeciwnika oddalonego o jedną kratkę. Ta zdolność przemieszcza ją w kierunku celu, zazwyczaj zadaje mu _%1$d-%2$d obrażeń_ i zawsze trafia.
items.weapon.melee.katana.ability_desc=Używając katany, Fechmistrzyni może _wykonać wypad_, by zaatakować przeciwnika oddalonego o jedną kratkę. Ta zdolność przemieszcza ją w kierunku celu, zadaje mu _%1$d-%2$d obrażeń_ i zawsze trafia.
items.weapon.melee.katana.desc=Smukły miecz z dużą metalową osłoną powyżej rękojeści.

items.weapon.melee.longsword.name=miecz półtoraręczny
items.weapon.melee.longsword.ability_name=rozszczep
items.weapon.melee.longsword.typical_ability_desc=Fechmistrzyni może _rozpłatać_ przeciwnika przy użyciu miecza półtoraręcznego. Ten atak zazwyczaj zadaje _%1$d-%2$d obrażeń_ i zawsze trafia. Jeśli Fechmistrzyni zabije przeciwnika tą umiejętnością, jest ona natychmiastowa, a poza tym w przeciągu 5 tur można jej użyć ponownie bez zużycia ładunku.
items.weapon.melee.longsword.ability_desc=Fechmistrzyni może _rozpłatać_ przeciwnika przy użyciu miecza półtoraręcznego. Ten atak zadaje _%1$d-%2$d obrażeń_ i zawsze trafia. Jeśli Fechmistrzyni zabije przeciwnika tą umiejętnością, jest ona natychmiastowa, a poza tym w przeciągu 5 tur można jej użyć ponownie bez zużycia ładunku.
items.weapon.melee.longsword.desc=Długie i ostre jak brzytwa stalowe ostrze tego miecza błyszczy dodając ci otuchy. Niestety jego wielkość sprawia, że jest dość ciężki.

items.weapon.melee.mace.name=buława
items.weapon.melee.mace.stats_desc=To raczej celna broń.
items.weapon.melee.mace.ability_name=powalający cios
items.weapon.melee.mace.typical_ability_desc=Fechmistrzyni może wykonać _powalający cios_ przy użyciu buławy. Ten skoncentrowany atak zazwyczaj zadaje _%1$d-%2$d obrażeń_ gdy jest wykonany znienacka. Oszałamia on przy tym przeciwnika na 5 tur, zmniejszając jego celność i szansę na unik o 50%%. Powalający cios zawsze sięgnie celu, ale zada standardowe obrażenia, jeśli atak nie jest wykonany z zaskoczenia.
items.weapon.melee.mace.ability_desc=Fechmistrzyni może wykonać _powalający cios_ przy użyciu buławy. Ten skoncentrowany atak zadaje _%1$d-%2$d obrażeń_ gdy jest wykonany znienacka. Oszałamia on przy tym przeciwnika na 5 tur, zmniejszając jego celność i szansę na unik o 50%%. Powalający cios zawsze sięgnie celu, ale zada standardowe obrażenia, jeśli atak nie jest wykonany z zaskoczenia.
items.weapon.melee.mace.desc=Wielka, żelazna głowica tej broni zadaje znaczne obrażenia.

items.weapon.melee.magesstaff.name=kostur maga
items.weapon.melee.magesstaff.ac_imbue=POŁĄCZ
items.weapon.melee.magesstaff.ac_zap=STRZEL
items.weapon.melee.magesstaff.prompt=Wybierz różdżkę
items.weapon.melee.magesstaff.imbue=%s została połączona z kosturem.
items.weapon.melee.magesstaff.preserved=Poprzednia różdżka została zachowana!
items.weapon.melee.magesstaff.imbue_desc=Jesteś pewien, że chcesz połączyć swój kostur z tą różdżką?\n\nJeżeli różdżka, której użyjesz, ma ten sam lub wyższy poziom niż kostur, to przejmie on poziom różdżki i dodatkowo jeden punkt ze swoich ulepszeń.
items.weapon.melee.magesstaff.imbue_level=To połączenie pozwoli uzyskać kostur o poziomie _+%d_.
items.weapon.melee.magesstaff.imbue_unknown=Nie znasz poziomu tej różdżki, ale jej połączenie pozwoli uzyskać kostur o poziomie co najmniej _+%d_.
items.weapon.melee.magesstaff.imbue_cursed=_Jeżeli połączysz przeklętą różdżkę z kosturem, klątwa na niego przejdzie!_
items.weapon.melee.magesstaff.imbue_lost=Różdżka, z którą połączony jest twój kostur, _zostanie stracona_.
items.weapon.melee.magesstaff.imbue_talent=Różdżka, z którą połączony jest twój kostur, _zostanie zwrócona na poziomie +0_.
items.weapon.melee.magesstaff.yes=Tak, jestem pewny.
items.weapon.melee.magesstaff.no=Nie, zmieniłem zdanie.
items.weapon.melee.magesstaff.desc=Własnoręcznie wykonany przez Maga kostur to unikatowa, magiczna broń, która może być nasycona mocą różdżek.
items.weapon.melee.magesstaff.no_wand=Kostur obecnie nie ma w sobie magii, musi zostać _połączony z inną różdżką_, zanim będzie mógł być użyty do rzucania zaklęć.
items.weapon.melee.magesstaff.has_wand=Z kosturem połączona jest _%s_.
items.weapon.melee.magesstaff.cursed_wand=Ten kostur jest przeklęty, jego magia jest chaotyczna i nieprzewidywalna.
items.weapon.melee.magesstaff.discover_hint=Z tym przedmiotem zaczyna jeden z bohaterów.

items.weapon.melee.meleeweapon.ac_ability=UMIEJĘTNOŚĆ
items.weapon.melee.meleeweapon.stats_known=Ta broń biała _%1$d. kręgu_ zadaje _%2$d-%3$d obrażeń_ i wymaga _%4$d siły_, by należycie jej używać.
items.weapon.melee.meleeweapon.stats_unknown=Zazwyczaj podobne bronie białe _%1$d. kręgu_ zadają _%2$d-%3$d obrażeń_ i wymagają _%4$d siły_, by należycie ich używać.
items.weapon.melee.meleeweapon.probably_too_heavy=Ta broń prawdopodobnie jest dla ciebie za ciężka.
items.weapon.melee.meleeweapon.stats_desc=
items.weapon.melee.meleeweapon.ability_need_equip=Musisz wyposażyć tę broń, żeby użyć jej umiejętności.
items.weapon.melee.meleeweapon.ability_low_str=Nie jesteś wystarczająco silny, aby użyć tej umiejętności.
items.weapon.melee.meleeweapon.ability_no_charge=Nie masz wystarczająco dużo energii, aby użyć tej umiejętności.
items.weapon.melee.meleeweapon.ability_cant_use=Nie możesz teraz użyć tej umiejętności.
items.weapon.melee.meleeweapon.ability_no_target=Nie ma tu żadnego celu.
items.weapon.melee.meleeweapon.ability_target_range=Ten cel nie jest w zasięgu.
items.weapon.melee.meleeweapon.ability_occupied=To pole jest zajęte.
items.weapon.melee.meleeweapon.upgrade_ability_stat_name=Obrażenia Umiejętności
items.weapon.melee.meleeweapon.prompt=Wybierz cel
items.weapon.melee.meleeweapon.swap=Zamień Bronie
items.weapon.melee.meleeweapon.swap_full=Nie możesz tego zrobić, mając pełny ekwipunek.


items.weapon.melee.shortsword.name=krótki miecz
items.weapon.melee.shortsword.ability_name=rozszczep
items.weapon.melee.shortsword.typical_ability_desc=Fechmistrzyni może _rozpłatać_ przeciwnika przy użyciu miecza krótkiego. Ten atak zazwyczaj zadaje _%1$d-%2$d obrażeń_ i zawsze trafia. Jeśli Fechmistrzyni zabije przeciwnika tą umiejętnością, jest ona natychmiastowa, a poza tym w przeciągu 5 tur można jej użyć ponownie bez zużycia ładunku.
items.weapon.melee.shortsword.ability_desc=Fechmistrzyni może _rozpłatać_ przeciwnika przy użyciu miecza krótkiego. Ten atak zadaje _%1$d-%2$d obrażeń_ i zawsze trafia. Jeśli Fechmistrzyni zabije przeciwnika tą umiejętnością, jest ona natychmiastowa, a poza tym w przeciągu 5 tur można jej użyć ponownie bez zużycia ładunku.
items.weapon.melee.shortsword.desc=Dość krótki miecz, jedynie kilka cali dłuższy niż kindżał.

items.weapon.melee.quarterstaff.name=pałka
items.weapon.melee.quarterstaff.stats_desc=Ta broń blokuje 0-2 obrażeń.
items.weapon.melee.quarterstaff.ability_name=postawa obronna
items.weapon.melee.quarterstaff.typical_ability_desc=Używając pałki, Fechmistrzyni może przyjąć _postawę obronną_. Aktywacja tej postawy nie wymaga czasu i trzykrotnie zwiększa wartość uniku Fechmistrzyni _na liczbę tur zazwyczaj wynoszącą: %d_.
items.weapon.melee.quarterstaff.ability_desc=Używając pałki, Fechmistrzyni może przyjąć _postawę obronną_. Aktywacja tej postawy nie wymaga czasu i trzykrotnie zwiększa wartość uniku Fechmistrzyni _na następującą liczbę tur: %d_.
items.weapon.melee.quarterstaff.upgrade_ability_stat_name=Czas Trwania Umiejętności
items.weapon.melee.quarterstaff.desc=Pałka wykonana z twardego drewna, jej końce pokryte są żelazem.
items.weapon.melee.quarterstaff$defensivestance.name=postawa obronna
items.weapon.melee.quarterstaff$defensivestance.desc=Fechmistrzyni używa swojej pałki, aby odbić nadchodzące ataki i nadlatujące pociski. Póki przyjmuje ona tę postawę, jej umiejętność unikania ataków jest trzykrotnie większa.\n\nPozostałe tury: %s.

items.weapon.melee.rapier.name=rapier
items.weapon.melee.rapier.stats_desc=Ta broń blokuje 0-1 obrażeń.
items.weapon.melee.rapier.ability_name=wykonaj wypad
items.weapon.melee.rapier.typical_ability_desc=Używając rapieru, Fechmistrzyni może _wykonać wypad_, by zaatakować przeciwnika oddalonego o jedną kratkę. Ta zdolność przemieszcza ją w kierunku celu, zazwyczaj zadaje mu _%1$d-%2$d obrażeń_ i zawsze trafia.
items.weapon.melee.rapier.ability_desc=Używając rapieru, Fechmistrzyni może _wykonać wypad_, by zaatakować przeciwnika oddalonego o jedną kratkę. Ta zdolność przemieszcza ją w kierunku celu, zadaje mu _%1$d-%2$d obrażeń_ i zawsze trafia.
items.weapon.melee.rapier.desc=Cienkie, proste ostrze, oferujące trochę obrony kosztem mniejszej siły.
items.weapon.melee.rapier.discover_hint=Z tym przedmiotem zaczyna jeden z bohaterów.

items.weapon.melee.roundshield.name=okrągła tarcza
items.weapon.melee.roundshield.typical_stats_desc=Zazwyczaj podobne tarcze blokują 0-%d obrażeń. Wartość ta wzrasta wraz z ulepszeniami.
items.weapon.melee.roundshield.stats_desc=Ta broń blokuje 0-%d obrażeń. Blokowanie zwiększa się wraz z ulepszeniami.
items.weapon.melee.roundshield.ability_name=zabezpiecz się
items.weapon.melee.roundshield.typical_ability_desc=Fechmistrzyni może _zabezpieczyć się_ przy użyciu okrągłej tarczy, całkowicie blokując wszystkie ataki fizyczne lub magiczne wyprowadzone przeciwko niej, zazwyczaj w czasie następnych _%d. tur_. Po zablokowaniu ataku wroga przez Fechmistrzynię atakowanie przeciwnika lub używanie magii zakończy zabezpieczanie się.
items.weapon.melee.roundshield.ability_desc=Fechmistrzyni może _zabezpieczyć się_ przy użyciu okrągłej tarczy, całkowicie blokując wszystkie ataki fizyczne lub magiczne wyprowadzone przeciwko niej w czasie następnych _%d. tur_. Po zablokowaniu ataku wroga przez Fechmistrzynię atakowanie przeciwnika lub używanie magii zakończy zabezpieczanie się.
items.weapon.melee.roundshield.upgrade_ability_stat_name=Czas Trwania Umiejętności
items.weapon.melee.roundshield.desc=Ta wielka tarcza skutecznie blokuje ataki i jest przyzwoitą bronią w razie kłopotów.
items.weapon.melee.roundshield$guardtracker.name=zabezpieczenie
items.weapon.melee.roundshield$guardtracker.guarded=sparowano
items.weapon.melee.roundshield$guardtracker.desc=Fechmistrzyni przygotowała swoją tarczę w oczekiwaniu na nadchodzące ataki. Fizyczne lub magiczne ataki wymierzone w nią zostaną całkowicie zablokowane.\n\nPozostałe tury: %s.

items.weapon.melee.runicblade.name=ostrze runiczne
items.weapon.melee.runicblade.stats_desc=Ta broń odnosi większą korzyść z ulepszeń.
items.weapon.melee.runicblade.ability_name=runiczne cięcie
items.weapon.melee.runicblade.typical_ability_desc=Fechmistrzyni może wykonać _runiczne cięcie_ za pomocą runicznego ostrza. Ten atak zawsze trafia, a _czar broni jest_ zazwyczaj _ mocniejszy o +%d%%_.
items.weapon.melee.runicblade.ability_desc=Fechmistrzyni może wykonać _runiczne cięcie_ za pomocą runicznego ostrza. Ten atak zawsze trafia, a _czar broni jest mocniejszy o +%d%%_.
items.weapon.melee.runicblade.upgrade_ability_stat_name=Moc Umiejętności
items.weapon.melee.runicblade.desc=Tajemnicza broń z odległych krain z jasnoniebieskim ostrzem.

items.weapon.melee.sai.name=sai
items.weapon.melee.sai.stats_desc=To bardzo szybka broń.
items.weapon.melee.sai.ability_name=atak kombinacyjny
items.weapon.melee.sai.typical_ability_desc=Fechmistrzyni może wykonać _atak kombinacyjny_ przy użyciu sai. Ten atak zawsze trafia i zazwyczaj zadaje _+%d punktów obrażeń_ za każde trafienie bronią białą lub miotaną. Brak trafienia w ciągu 5 tur resetuje ciąg.
items.weapon.melee.sai.ability_desc=Fechmistrzyni może wykonać _atak kombinacyjny_ przy użyciu sai. Ten atak zawsze trafia i zadaje _+%d punktów obrażeń_ za każde trafienie bronią białą lub miotaną. Brak trafienia w ciągu 5 tur resetuje ciąg.
items.weapon.melee.sai.desc=Dwa cienkie ostrza przeznaczone do trzymania po jednym w każdej ręce. Wyśmienite do szatkowania przeciwników istną burzą cięć.
items.weapon.melee.sai$combostriketracker.name=atak kombinacyjny
items.weapon.melee.sai$combostriketracker.desc=Fechmistrzyni buduje ciąg uderzeń, który może być wykorzystany do zwiększenia obrażeń umiejętności uderzenia kombinacyjnego. Każdy celny atak bronią wręcz bądź miotaną wlicza się do ciągu, ale jego brak w przeciągu 5 tur resetuje ten ciąg uderzeń.\n\nDługość ciągu uderzeń: _%1$d_.\n\nLiczba tur do utraty ciągu uderzeń: _%2$s_.

items.weapon.melee.scimitar.name=sejmitar
items.weapon.melee.scimitar.stats_desc=To dość szybka broń.
items.weapon.melee.scimitar.ability_name=taniec miecza
items.weapon.melee.scimitar.typical_ability_desc=Używając sejmitaru, Fechmistrzyni może wykonać _taniec miecza_. Wejście w tę postawę jest natychmiastowe i zapewnia Fechmistrzyni +60%% szybkości ataku i +50%% celności na zazwyczaj _%d tury_.
items.weapon.melee.scimitar.ability_desc=Używając sejmitaru, Fechmistrzyni może wykonać _taniec miecza_. Wejście w tę postawę jest natychmiastowe i zapewnia Fechmistrzyni +60%% szybkości ataku i +50%% celności na _%d tury_.
items.weapon.melee.scimitar.upgrade_ability_stat_name=Czas Trwania Umiejętności
items.weapon.melee.scimitar.desc=Cienkie, zaokrąglone ostrze. Jego kształt pozwala na szybsze, ale za to słabsze ataki.
items.weapon.melee.scimitar$sworddance.name=taniec miecza
items.weapon.melee.scimitar$sworddance.desc=Fechmistrzyni wykonuje szybkie, oparte na impetach ciosy, przypominające taniec. Gdy ta postawa jest aktywna, jej ataki są o 60%% szybsze (wystarczająco szybkie, aby wykonać dokładnie dwa ciosy na turę sejmitarem) i ma +50%% celności.\n\nPozostałe tury efektu: %s.

items.weapon.melee.sickle.name=sierp
items.weapon.melee.sickle.stats_desc=To dość niecelna broń.
items.weapon.melee.sickle.ability_name=ścięcie
items.weapon.melee.sickle.typical_ability_desc=Używając sierpa, Fechmistrzyni może _ściąć_ wroga. Ten niszczycielski atak zawsze trafia i zazwyczaj zadaje _%d obrażeń_. Obrażenia są zadane jako krwawienie, o ile wróg nie jest na nie odporny.
items.weapon.melee.sickle.ability_desc=Używając sierpa, Fechmistrzyni może _ściąć_ wroga. Ten niszczycielski atak zawsze trafia i zadaje _%d obrażeń_. Obrażenia są zadane jako krwawienie, o ile wróg nie jest na nie odporny.
items.weapon.melee.sickle.desc=Niewielkie narzędzie rolnicze, które może także służyć jako silna, ale nieporęczna broń.

items.weapon.melee.spear.name=włócznia
items.weapon.melee.spear.stats_desc=To raczej powolna broń.\nTa broń posiada dodatkowy zasięg.
items.weapon.melee.spear.ability_name=dźgnij
items.weapon.melee.spear.typical_ability_desc=Fechmistrzyni może użyć czubka włóczni, aby _dźgnąć_ przeciwnika, który jest w zasięgu, lecz nie obok niej. Atak ten zawsze trafia, odrzuca przeciwnika do tyłu i zazwyczaj zadaje mu _%1$d-%2$d obrażeń_.
items.weapon.melee.spear.ability_desc=Fechmistrzyni może użyć czubka włóczni, aby _dźgnąć_ przeciwnika, który jest w zasięgu, lecz nie obok niej. Atak ten zawsze trafia, odrzuca przeciwnika do tyłu i zazwyczaj zadaje mu _%1$d-%2$d obrażeń_.
items.weapon.melee.spear.desc=Smukły, drewniany drąg zakończony ostrym, stalowym grotem.

items.weapon.melee.sword.name=miecz
items.weapon.melee.sword.ability_name=rozszczep
items.weapon.melee.sword.typical_ability_desc=Fechmistrzyni może _rozpłatać_ przeciwnika przy użyciu miecza. Ten atak zazwyczaj zadaje _%1$d-%2$d obrażeń_ i zawsze trafia. Jeśli Fechmistrzyni zabije przeciwnika tą umiejętnością, jest ona natychmiastowa, a poza tym w przeciągu 5 tur można jej użyć ponownie bez zużycia ładunku.
items.weapon.melee.sword.ability_desc=Fechmistrzyni może _rozpłatać_ przeciwnika przy użyciu miecza. Ten atak zadaje _%1$d-%2$d obrażeń_ i zawsze trafia. Jeśli Fechmistrzyni zabije przeciwnika tą umiejętnością, jest ona natychmiastowa, a poza tym w przeciągu 5 tur można jej użyć ponownie bez zużycia ładunku.
items.weapon.melee.sword.desc=Dobrze zbalansowany miecz. Nie za duży, ale na pewno większy niż krótki miecz.
items.weapon.melee.sword$cleavetracker.name=rozszczepienie
items.weapon.melee.sword$cleavetracker.desc=Fechmistrzyni jest gotowa, by ponownie rozszczepić przeciwnika. Następne użycie tej umiejętności nie zużyje ładunku.\n\nPozostałe tury: %s.

items.weapon.melee.warhammer.name=młot bitewny
items.weapon.melee.warhammer.stats_desc=To raczej celna broń.
items.weapon.melee.warhammer.ability_name=powalający cios
items.weapon.melee.warhammer.typical_ability_desc=Fechmistrzyni może wykonać _powalający cios_ przy użyciu młota bitewnego. Ten skoncentrowany atak zazwyczaj zadaje _%1$d-%2$d obrażeń_ gdy jest wykonany znienacka. Oszałamia on przy tym przeciwnika na 5 tur, zmniejszając jego celność i szansę na unik o 50%%. Powalający cios zawsze sięgnie celu, ale zada standardowe obrażenia, jeśli atak nie jest wykonany z zaskoczenia.
items.weapon.melee.warhammer.ability_desc=Fechmistrzyni może wykonać _powalający cios_ przy użyciu młota bitewnego. Ten skoncentrowany atak zadaje _%1$d-%2$d obrażeń_ gdy jest wykonany znienacka. Oszałamia on przy tym przeciwnika na 5 tur, zmniejszając jego celność i szansę na unik o 50%%. Powalający cios zawsze sięgnie celu, ale zada standardowe obrażenia, jeśli atak nie jest wykonany z zaskoczenia.
items.weapon.melee.warhammer.desc=Mało która istota potrafi się obronić przed miażdżącą siłą tego ogromu ołowiu i stali, która niestety wymaga znacznej siły, by jej sprawnie używać.

items.weapon.melee.warscythe.name=kosa bojowa
items.weapon.melee.warscythe.stats_desc=To dość niecelna broń.
items.weapon.melee.warscythe.ability_name=ścięcie
items.weapon.melee.warscythe.typical_ability_desc=Używając kosy bojowej, Fechmistrzyni może _ściąć_ wroga. Ten niszczycielski atak zawsze trafia i zazwyczaj zadaje _%d obrażeń_. Obrażenia są zadane jako krwawienie, o ile wróg nie jest na nie odporny.
items.weapon.melee.warscythe.ability_desc=Używając kosy bojowej, Fechmistrzyni może _ściąć_ wroga. Ten niszczycielski atak zawsze trafia i zadaje _%d obrażeń_. Obrażenia są zadane jako krwawienie, o ile wróg nie jest na nie odporny.
items.weapon.melee.warscythe.desc=To duże i nieporęczne narzędzie zostało wzmocnione do cięcia wrogów, aniżeli plonów.

items.weapon.melee.whip.name=bicz
items.weapon.melee.whip.stats_desc=Ta broń na ogromny zasięg.
items.weapon.melee.whip.ability_name=chlaśnij
items.weapon.melee.whip.typical_ability_desc=Używając bicza, Fechmistrzyni może _chlasnąć_ przeciwników w zasięgu ataku. Ta umiejętność zazwyczaj zadaje _%1$d-%2$d obrażeń_ wszystkim przeciwnikom w zasięgu i zawsze trafia.
items.weapon.melee.whip.ability_desc=Używając bicza, Fechmistrzyni może _chlasnąć_ przeciwników w zasięgu ataku. Ta umiejętność zadaje _%1$d-%2$d obrażeń_ wszystkim przeciwnikom w zasięgu i zawsze trafia.
items.weapon.melee.whip.desc=Mimo że kolczasta końcówka liny w tej broni zadaje błahe obrażenia, jej zasięg jest niezrównany.

items.weapon.melee.wornshortsword.name=znoszony krótki miecz
items.weapon.melee.wornshortsword.ability_name=rozszczep
items.weapon.melee.wornshortsword.typical_ability_desc=Fechmistrzyni może _rozpłatać_ przeciwnika przy użyciu wysłużonego miecza krótkiego. Ten atak zazwyczaj zadaje _%1$d-%2$d obrażeń_ i zawsze trafia. Jeśli Fechmistrzyni zabije przeciwnika tą umiejętnością, jest ona natychmiastowa, a poza tym w przeciągu 5 tur można jej użyć ponownie bez zużycia ładunku.
items.weapon.melee.wornshortsword.ability_desc=Fechmistrzyni może _rozpłatać_ przeciwnika przy użyciu wysłużonego miecza krótkiego. Ten atak zadaje _%1$d-%2$d obrażeń_ i zawsze trafia. Jeśli Fechmistrzyni zabije przeciwnika tą umiejętnością, jest ona natychmiastowa, a poza tym w przeciągu 5 tur można jej użyć ponownie bez zużycia ładunku.
items.weapon.melee.wornshortsword.desc=Dosyć mały miecz, znoszony przez duże użytkowanie. Jest on słabszy i lżejszy niż krótki miecz w lepszym stanie.
items.weapon.melee.wornshortsword.discover_hint=Z tym przedmiotem zaczyna jeden z bohaterów.


###missile weapons
items.weapon.missiles.darts.adrenalinedart.name=strzałka adrenalinowa
items.weapon.missiles.darts.adrenalinedart.desc=Groty tych strzałek nasączone są substancją z nasion świstoostu, co pozwala na zwiększenie szybkości poruszania się i ataku w przypadku sojuszników lub chwilowego zmniejszenia szybkości ruchu przeciwników. Strzałka sama w sobie wciąż zadaje obrażenia wrogom, ale nie rani sojuszników.

items.weapon.missiles.darts.blindingdart.name=strzałka oślepienia
items.weapon.missiles.darts.blindingdart.desc=Groty tych strzałek są nasiąknięte substancją z nasion ślepoziela, które oślepią cel na krótki czas. Nie dezorientują, więc przeciwnik nadal będzie pamiętał, gdzie ostatnio cię widział.

items.weapon.missiles.darts.chillingdart.name=strzałka wychłodzenia
items.weapon.missiles.darts.chillingdart.desc=Groty tych strzałek są nasiąknięte substancją z nasion lodowego bąbla, które wywołają zmrożenie u celu.

items.weapon.missiles.darts.cleansingdart.name=strzałka oczyszczenia
items.weapon.missiles.darts.cleansingdart.desc=Groty tych strzałek nasączone są substancją z nasion monarszka, co sprawia że trafieni sojusznicy stają się tymczasowo odporne na wszystkie negatywne efekty, zaś wrogowie zostaną oczyszczeni z efektów pozytywnych. Przeciwnicy mogą nawet nagle zapomnieć, że cię atakują lub od ciebie uciekają. Strzałka sama w sobie wciąż zadaje obrażenia wrogom, ale nie rani sojuszników.

items.weapon.missiles.darts.dart.name=strzałka
items.weapon.missiles.darts.dart.ac_tip=NASĄCZ
items.weapon.missiles.darts.dart.prompt=Wybierz nasiono
items.weapon.missiles.darts.dart.tip_title=Nasącz Grot Strzałki
items.weapon.missiles.darts.dart.tip_desc=Nasionko może być połączone z jedną czy dwiema strzałkami, by nasączyć ich końce. Każdy rodzaj nasion tworzy inny typ strzałek, z unikalnymi jednorazowymi efektami.\n\nEfekt wybranej kombinacji: _%s._
items.weapon.missiles.darts.dart.tip_all=%1$d strzałki/ek z %2$d nasion
items.weapon.missiles.darts.dart.tip_two=2 strzałki z 1 nasiona
items.weapon.missiles.darts.dart.tip_one=1 strzałka z 1 nasiona
items.weapon.missiles.darts.dart.tip_cancel=Anuluj
items.weapon.missiles.darts.dart.desc=Te proste patyki z ostrymi grotami są wyważone tak, by lecieć prosto i uderzyć ofiarę dzięki szybkiemu ruchowi nadgarstka. Mogą być nasączone nasionami, aby dać im różne efekty przy trafieniu.
items.weapon.missiles.darts.dart.unlimited_uses=Strzałki nie niszczą się dzięki ich prostej konstrukcji.

items.weapon.missiles.darts.displacingdart.name=strzałka przeniesienia
items.weapon.missiles.darts.displacingdart.desc=Groty tych strzałek są nasiąknięte substancją z nasion gasnącego liścia, które teleportują cel na krótki dystans.

items.weapon.missiles.darts.healingdart.name=strzałka leczenia
items.weapon.missiles.darts.healingdart.desc=Groty tych strzałek są nasiąknięte substancją z nasion brzaskoziela, które leczą cel. Strzałka sama w sobie wciąż zadaje obrażenia wrogom, ale nie sojusznikom.

items.weapon.missiles.darts.holydart.name=strzałka błogosławieństwa
items.weapon.missiles.darts.holydart.desc=Groty tych strzałek nasączone są substancją z nasion kwiatu paproci, co pozwala przelać świętą moc na ich cel. Sojusznicy i zwykli przeciwnicy zostaną pobłogosławieni, lecz nieumarłe lub demoniczne cele otrzymają poważne obrażenia. Strzałka sama w sobie wciąż zadaje obrażenia wrogom, ale nie zrani sojuszników.

items.weapon.missiles.darts.incendiarydart.name=strzałka podpalenia
items.weapon.missiles.darts.incendiarydart.desc=Groty tych strzałek są nasiąknięte substancją z nasion płomiennego kwiatu, które wytworzą płomień przy trafieniu w cel.

items.weapon.missiles.darts.paralyticdart.name=strzałka paraliżu
items.weapon.missiles.darts.paralyticdart.desc=Groty tych strzałek są nasiąknięte substancją z nasion kamiennego korzenia, które wywołają u celu krótkotrwały paraliż.

items.weapon.missiles.darts.poisondart.name=strzałka trucizny
items.weapon.missiles.darts.poisondart.desc=Groty tych strzałek są nasiąknięte substancją z nasion bolesnego mchu, które zatrują cel.

items.weapon.missiles.darts.rotdart.name=strzałka zgnilizny
items.weapon.missiles.darts.rotdart.desc=Groty tych strzałek są nasiąknięte substancją z nasion próchnojagody, która agresywnie przeżre wszystko, czego dotknie. Potężni przeciwnicy uchronią się przed większością obrażeń, ale korozja jest wystarczająco silna, aby zabić większość zwykłych przeciwników. Substancja utrzymuje się dłużej niż na innych strzałkach, ale w przeciwieństwie do nich nie da się zwiększyć ilości użyć.
items.weapon.missiles.darts.rotdart.discover_hint=Ten przedmiot możesz stworzyć korzystając z nasiona z pewnego zadania.

items.weapon.missiles.darts.shockingdart.name=strzałka porażenia
items.weapon.missiles.darts.shockingdart.desc=Groty tych strzałek są nasiąknięte substancją z nasion sztormobluszczu, które wywołają u celu bolesny szok elektryczny.

items.weapon.missiles.darts.tippeddart.ac_clean=OCZYŚĆ
items.weapon.missiles.darts.tippeddart.clean_title=Oczyść Strzałki
items.weapon.missiles.darts.tippeddart.clean_desc=Ta czynność usunie specjalny efekt z grotu strzałek, zmieniając je znów w zwykłe strzałki.
items.weapon.missiles.darts.tippeddart.clean_all=Oczyść wszystko
items.weapon.missiles.darts.tippeddart.clean_one=Oczyść jedną
items.weapon.missiles.darts.tippeddart.cancel=Anuluj
items.weapon.missiles.darts.tippeddart.uses_left=Te rzutki mają _%d/%d_ użyć, zanim jedna z nich się uszkodzi.
items.weapon.missiles.darts.tippeddart.unlimited_uses=_Są tak wysokiej jakości, że nigdy się nie zepsują._
items.weapon.missiles.darts.tippeddart.about_to_break=Nasączenie grotu twojej strzałki zaraz się wyczerpie.
items.weapon.missiles.darts.tippeddart.has_broken=Nasączenie grotu twojej strzałki wyczerpało się.
items.weapon.missiles.darts.tippeddart.discover_hint=Ten przedmiot możesz kupić w sklepie lub stworzyć go za pomocą nasiona.


items.weapon.missiles.bolas.name=bolas
items.weapon.missiles.bolas.stats_desc=Ta broń okaleczy wroga.
items.weapon.missiles.bolas.desc=Te nietypowe bronie miotane nie zadają znacznych obrażeń, ale skutecznie spowalniają przeciwnika.

items.weapon.missiles.boomerang.name=bumerang
items.weapon.missiles.boomerang.desc=Rzucony do przeciwnika, ten płaski drewniany pocisk powróci do rąk rzucającego.
items.weapon.missiles.boomerang.durability=Z powodu jego solidnej konstrukcji, ten bumerang nie uszkodzi się podczas użytkowania.

items.weapon.missiles.fishingspear.name=włócznia wędkarska
items.weapon.missiles.fishingspear.desc=Te małe miotane włócznie, mimo że zaprojektowane do łowienia ryb, nadają się jako improwizowana broń.

items.weapon.missiles.forcecube.name=kostka energii
items.weapon.missiles.forcecube.ondeath=Zabiłeś się swoją własną kostką energii...
items.weapon.missiles.forcecube.stats_desc=Ta broń zadaje obrażenia obszarowe po rzuceniu, zadając obrażenia wszystkiemu w niewielkim polu rażenia.
items.weapon.missiles.forcecube.desc=Te magiczne kostki o osobliwym kształcie są dość małe, by trzymać je w dłoni, ale mimo tego są bardzo ciężkie.

items.weapon.missiles.heavyboomerang.name=ciężki bumerang
items.weapon.missiles.heavyboomerang.stats_desc=Ta broń wraca w miejsce rzutu po pięciu turach.
items.weapon.missiles.heavyboomerang.desc=Ten wielki bumerang wymaga wprawy, ale zadaje znaczne obrażenia.

items.weapon.missiles.javelin.name=oszczep
items.weapon.missiles.javelin.desc=Te większe włócznie do rzucania wyważone zostały tak, aby ich zaostrzone końcówki znajdowała się z przodu podczas lotu w powietrzu.

items.weapon.missiles.kunai.name=kunai
items.weapon.missiles.kunai.stats_desc=Ta broń jest mocniejsza wobec nieświadomych niczego wrogów.
items.weapon.missiles.kunai.desc=Te krótkie noże są niezwykle zabójcze w rękach wprawnego użytkownika.

items.weapon.missiles.missileweapon.stats_known=Ten zestaw broni miotanej _%1$d. kręgu_ zadaje _%2$d-%3$d obrażeń_ i wymaga _%4$d siły_, by należycie go używać.
items.weapon.missiles.missileweapon.stats_unknown=Zazwyczaj ten zestaw broni miotanej _%1$d. kręgu_ zadaje _%2$d-%3$d obrażeń_ i wymaga _%4$d siły_, by należycie go używać.
items.weapon.missiles.missileweapon.stats_desc=
items.weapon.missiles.missileweapon.probably_too_heavy=Ta broń prawdopodobnie jest dla ciebie za ciężka.
items.weapon.missiles.missileweapon.distance=Bronią miotaną łatwiej trafić oddalonych przeciwników, ale o wiele trudniej tych będących w zwarciu.
items.weapon.missiles.missileweapon.durability=Broń na odległość będzie się zużywać i zepsuje się w miarę używania jej.
items.weapon.missiles.missileweapon.uses_left=Ten zestaw broni miotanej ma _%d/%d_ użyć zanim jedna z nich się uszkodzi.
items.weapon.missiles.missileweapon.unlimited_uses=Ten zestaw jest tak wysokiej jakości, że nigdy się nie zepsuje.
items.weapon.missiles.missileweapon.unknown_uses=Zazwyczaj ten zestaw broni miotanej ma _%d_ użyć zanim jedna z nich się uszkodzi.
items.weapon.missiles.missileweapon.curse_discover=Ta broń miotana jest przeklęta!
items.weapon.missiles.missileweapon.about_to_break=Twoja broń miotana zaraz się zepsuje.
items.weapon.missiles.missileweapon.has_broken=Jedna z twoich broni miotanych się zepsuła.
items.weapon.missiles.missileweapon.dust=Broń miotana rozpada się w drobny mak zaraz po dotknięciu.
items.weapon.missiles.missileweapon.break_upgraded_warn_desc=Jeżeli ostatnia broń miotana w twoim ulepszonym zestawie broni miotanej się zepsuje, utracisz go na zawsze. Czy na pewno chcesz nią rzucić?
items.weapon.missiles.missileweapon.break_upgraded_warn_yes=Tak
items.weapon.missiles.missileweapon.break_upgraded_warn_no=Nie
items.weapon.missiles.missileweapon$placeholder.name=broń miotana

items.weapon.missiles.shuriken.name=shuriken
items.weapon.missiles.shuriken.stats_desc=Shurikeny można rzucać natychmiastowo raz na 20 tur.
items.weapon.missiles.shuriken.desc=Tymi gwiaździstymi kawałkami metalu z ostrymi jak brzytwa krawędziami łatwo rzucić podczas poruszania się.
items.weapon.missiles.shuriken$shurikeninstanttracker.name=odnowienie shurikena
items.weapon.missiles.shuriken$shurikeninstanttracker.desc=Niedawno wykonany rzut shurikenem był natychmiastowy, musisz poczekać, zanim zrobisz to ponownie. Shurikenami wciąż można rzucać z normalną prędkością ataku.\n\nPozostałe tury: %s.

items.weapon.missiles.throwingclub.name=maczuga do rzucania
items.weapon.missiles.throwingclub.stats_desc=Ta broń nie wbija się w przeciwników i można ją natychmiastowo podnieść.
items.weapon.missiles.throwingclub.desc=Całkiem prosta broń miotana; w zasadzie jest to wielki kamień przywiązany do patyka.

items.weapon.missiles.throwinghammer.name=młot do rzucania
items.weapon.missiles.throwinghammer.stats_desc=Ta broń nie wbija się w przeciwników i można ją natychmiastowo podnieść.
items.weapon.missiles.throwinghammer.desc=Te ciężkie młoty zostały zaprojektowane do rzucania we wrogów. Są odlane w całości z metalu, co czyni je wytrzymałymi.

items.weapon.missiles.throwingknife.name=nóż do rzucania
items.weapon.missiles.throwingknife.stats_desc=Ta broń jest mocniejsza wobec nieświadomych niczego wrogów.
items.weapon.missiles.throwingknife.desc=Te lekkie noże są wyważone tak, aby leciały po łuku, trafiając prosto w cel.
items.weapon.missiles.throwingknife.discover_hint=Z tym przedmiotem zaczyna jeden z bohaterów.

items.weapon.missiles.throwingspear.name=włócznia do rzucania
items.weapon.missiles.throwingspear.desc=Te lekkie włócznie mają cienką konstrukcję, zaprojektowaną z myślą o rzucaniu, nie o walce wręcz.

items.weapon.missiles.throwingspike.name=kolec do rzucania
items.weapon.missiles.throwingspike.desc=Te wytrzymałe, spiczaste kawałki metalu służą do rzucania nimi w oddalonych przeciwników.
items.weapon.missiles.throwingspike.discover_hint=Z tym przedmiotem zaczyna jeden z bohaterów.

items.weapon.missiles.throwingstone.name=kamień do rzucania
items.weapon.missiles.throwingstone.desc=Te kamienie są piaskowane, aby można było je rzucić z większą siłą niż zwykłe kamienie.
items.weapon.missiles.throwingstone.discover_hint=Z tym przedmiotem zaczyna jeden z bohaterów.

items.weapon.missiles.tomahawk.name=tomahawk
items.weapon.missiles.tomahawk.stats_desc=Ta broń powoduje _%1$d - %2$d krwawienia_ u jej celu.
items.weapon.missiles.tomahawk.typical_stats_desc=Ta broń zazwyczaj powoduje _%1$d - %2$d krwawienia_ u jej celu.
items.weapon.missiles.tomahawk.desc=Te siekiery do rzucania posiadają ząbkowane ostrza, rozrywające skórę po wbiciu się w przeciwnika.

items.weapon.missiles.trident.name=trójząb
items.weapon.missiles.trident.desc=Masywny trójząb do rzucania. Bardzo potężny, ale zarazem ciężki.


items.weapon.spiritbow.name=łuk dusz
items.weapon.spiritbow.ac_shoot=STRZEL
items.weapon.spiritbow.prompt=Wybierz cel
items.weapon.spiritbow.stats=Ten łuk nie może być ulepszony w normalny sposób, ale zamiast tego będzie stawał się silniejszy w miarę zdobywania przez postać kolejnych poziomów. Na obecnym poziomie strzały z łuku będą zadawać _%1$d-%2$d punktów obrażeń_ i wymagać _%3$d punktów siły_ do poprawnego użycia.
items.weapon.spiritbow.desc=Łuk wykonany z pradawnego magicznego drewna. Jego cięciwa i wyżłobienia świecą bladym, niebieskim światłem. Gdy cięciwa zostanie pociągnięta, łuk wytworzy magiczną strzałę, którą można strzelić w przeciwnika.
items.weapon.spiritbow.discover_hint=Z tym przedmiotem zaczyna jeden z bohaterów.

items.weapon.weapon.identify=Jesteś już wystarczająco dobrze zaznajomiony z tą bronią, by ją zidentyfikować.
items.weapon.weapon.too_heavy=Z powodu twojej niewystarczającej siły, atakowanie tą bronią będzie wolniejsze i trudno ci będzie wykonać atak z zaskoczenia.
items.weapon.weapon.excess_str=Dzięki twojej nadmiernej sile będziesz zadawać _0-%d dodatkowych obrażeń_ tą bronią.
items.weapon.weapon.hardening_gone=Ta broń się zużyła, nie jest już zahartowana!
items.weapon.weapon.incompatible=Oddziaływanie różnych typów magii wymazało zaklęcie na tej broni!
items.weapon.weapon.cursed_worn=Ta broń jest przeklęta, nie jesteś w stanie jej odłożyć.
items.weapon.weapon.cursed=Czujesz złowrogą magię czającą się w tej broni.
items.weapon.weapon.weak_cursed=Pomimo klątwy jesteś w stanie odłożyć tę broń.
items.weapon.weapon.not_cursed=Ta broń jest wolna od wrogiej magii.
items.weapon.weapon.faster=Jest wzmocniona by maksymalizować _prędkość_.
items.weapon.weapon.stronger=Jest wzmocniona by maksymalizować _obrażenia_.
items.weapon.weapon.enchanted=na tej broni jest _%s_.
items.weapon.weapon.enchant_hardened=Ten przedmiot został _zahartowany_.
items.weapon.weapon.hardened_no_enchant=Ta broń została _zahartowana_, ale obecnie nie jest zaklęta.
items.weapon.weapon$enchantment.enchant=czar
items.weapon.weapon$enchantment.rankings_desc=Zabity przez magię zaklętej broni
items.weapon.weapon$enchantment.discover_hint=Ten efekt może być znaleziony losowo w lochu na przedmiocie lub nałożony samodzielnie na przedmiot.


###misc items
items.amulet.name=amulet yendoru
items.amulet.ac_end=ZAKOŃCZ GRĘ
items.amulet.desc=Amulet Yendoru jest najpotężniejszym artefaktem znanym ludziom i krasnoludom. Jego połyskujące kryształy wiążą niewiarygodną, niezwykłą moc.
items.amulet.desc_origins=Pochodzenie amuletu jest nieznane. Historia mówi, że Król Krasnoludów chełpił się odnalezieniem artefaktu na krótko przed tym, jak cywilizacja krasnoludów zerwała wszelkie kontakty z powierzchnią. Jak go odnalazł? W jaki sposób Yog-Dzewa mu go odebrał? To raczej pytania na inną okazję; jedyne, co się teraz liczy to to, że amulet należy do ciebie!
items.amulet.desc_ascent=Pochodzenie amuletu jest nieznane, ale wyraźnie czuć wpływ mocy Yog-Dzewy na niego. Loch zdaje się uginać pod wolą mocy Yog-Dzewy, kiedy przez niego przechodzisz, czyniąc przeciwników znacznie liczniejszymi i potężniejszymi! Nie jesteś też już w stanie aktywować lub wyrzucić amuletu, tak jakby ten był przeklęty.
items.amulet.ascent_title=Powrót
items.amulet.ascent_desc=Zaczynasz odczuwać potężną i przeraźliwą moc Yog-Dzewy emitowaną przez amulet. Powrót na powierzchnię jako śmiertelnik może okazać się trudniejszy, niż myślałeś!\n\nJeśli będziesz kontynuował powrót z amuletem, loch stanie się niebezpieczniejszy, teleportacja pomiędzy piętrami będzie zablokowana, a ty będziesz mógł zwyciężyć jedynie pokonując przeciwników podczas powrotu na powierzchnię przez loch!\n\nMożesz zostawić tutaj amulet, jeśli chcesz powrócić bez rozpoczynania tego wyzwania bądź aktywować amulet zanim rozpoczniesz powrót, aby zakończyć grę normalnie.
items.amulet.ascent_yes=Kontynuuj!
items.amulet.ascent_no=Na razie przestań
items.amulet.discover_hint=Ten przedmiot możesz znaleźć na samym dnie lochu...

items.ankh.name=ankh
items.ankh.ac_bless=BŁOGOSŁAW
items.ankh.bless=Poświęciłeś ankh magiczną wodą.
items.ankh.desc=Ten starożytny symbol nieśmiertelności zapewnia możliwość wskrzeszenia w razie porażki. Większość przedmiotów pozostanie w miejscu twojej śmierci, ale mogą one być odzyskane przez odnalezienie ich. Używając pełnego bukłaka, ankh może zostać pobłogosławiony dodatkową mocą.
items.ankh.desc_blessed=Będący starożytnym symbolem nieśmiertelności, Ankh zapewnia możliwość powrotu do życia w razie śmierci. Ankh został poświęcony i jest stał się potężniejszy. Poświęci on się, aby ratować twoje życie, kiedy znajdziesz się na skraju śmierci.
items.ankh.discover_hint=Ten przedmiot możesz kupić w sklepie.

items.arcaneresin.name=magiczna żywica
items.arcaneresin.prompt=Wybierz różdżkę
items.arcaneresin.ac_apply=UŻYJ
items.arcaneresin.level_too_high=Ta różdżka jest zbyt potężna, by ulepszyć ją magiczną żywicą.
items.arcaneresin.not_enough=Nie masz na to wystarczająco dużo żywicy!
items.arcaneresin.apply=Magiczna żywica pokrywa twoją różdżkę, zwiększając jej moc!
items.arcaneresin.desc=Ten drobny proszek mieni się w odcieniu purpury i bieli. Działa on jak katalizator magicznych energii, zwiększając poziom różdżek, które zostaną nim pokryte!\n\nUlepszanie różdżki kosztuje 1, 2 lub 3 szczypty żywicy w zależności od początkowego poziomu różdżki. Żywica pozwala na ulepszanie różdżki do poziomu +3.\n\nUlepszenia za pomocą magicznej żywicy _są nadpisywane przez te uzyskane z innych źródeł_ (takich jak zwoje ulepszenia) i nie są liczone przy łączeniu różdżki z kosturem Maga.
items.arcaneresin.discover_hint=Ten przedmiot możesz stworzyć poprzez alchemię.

items.brokenseal.name=złamana pieczęć
items.brokenseal.ac_affix=PRZYMOCUJ
items.brokenseal.prompt=Wybierz zbroję
items.brokenseal.unknown_armor=Musisz najpierw określić, czy zbroja jest przeklęta, czy nie.
items.brokenseal.cursed_armor=Nie możesz przymocować pieczęci do przeklętej zbroi.
items.brokenseal.affix=Zakładasz pieczęć na swoją zbroję!
items.brokenseal.desc=Woskowa pieczęć, przymocowana do zbroi jako symbol męstwa. Pieczęć jest złamana na pół, a na jej środku odciśnięta jest stara runa ochronna.\n\nTa pieczęć, pamiątka z domu Wojownika, pomaga mu wytrwać. Gdy ją nosi, natychmiastowo otrzyma osłonę w momencie ataku, który zmniejszyłby jego zdrowie do połowy lub poniżej tej wartości.\n\nPieczęć można _przymocować do zbroi_ i przenosić między nimi. Przenosi ona jedno ulepszenie, pod warunkiem, że zostało ono dodane do zbroi, gdy pieczęć była do niej przymocowana.
items.brokenseal.inscribed=Na pieczęci wyryto _%s._
items.brokenseal.choose_title=Wybierz glif
items.brokenseal.choose_desc=Zarówno zbroja, której używasz oraz złamana pieczęć posiadają glif. Musisz wybrać, który glif chcesz zachować.\n\nGlif zbroi: %1$s\nGlif złamanej pieczęci: %2$s\n\nUwaga! Jeżeli wybierzesz glif, który aktualnie jest na zbroi, pieczęć nie będzie w stanie go później przenieść.
items.brokenseal.discover_hint=Z tym przedmiotem zaczyna jeden z bohaterów.
items.brokenseal$warriorshield.name=Osłona Wojownika
items.brokenseal$warriorshield.desc_active=Złamana pieczęć Wojownika pomaga mu wytrwać, zapewniając mu osłonę. Osłona ma czas odnowienia, po którym można ją użyć ponownie.\n\nTa osłona nie zanika z czasem, ale skończy się, jeśli przez kilka tur nie będzie żadnych wrogów w pobliżu. Pozostała niewykorzystana osłona po jej zakończeniu skróci czas odnowienia o maksymalnie 50%%.\n\nPozostała osłona: %1$d.\n\nBieżący czas odnowienia: %2$d.
items.brokenseal$warriorshield.desc_cooldown=Wojownik niedawno otrzymał osłonę ze swojej złamanej pieczęci i musi zaczekać zanim będzie mógł z niej ponownie skorzystać. \n\nPozostałe tury: %d.
items.brokenseal$warriorshield.desc_negative_cooldown=Czas odnowienia osłony Wojownika jest obecnie ujemny, co oznacza, że po tej aktywacji osłony jej czas odnowienia będzie mniejszy od normalnych 150 tur. Ten czas może być zredukowany aż do -150 tur, co oznacza, że osłona będzie natychmiastowo odnowiona po jej aktywacji.\n\nObecny czas odnowienia: %d.

items.dewdrop.name=kropla rosy
items.dewdrop.already_full=Jesteś już w pełni sił.
items.dewdrop.desc=Kryształowo czysta kropla rosy.\n\nDzięki magii tego miejsca czysta woda ma pewne właściwości lecznicze.

items.equipableitem.curse_detected=Tuż przed założeniem przedmiotu wyczuwasz, że jest on przeklęty!
items.equipableitem.unequip_cursed=Nie możesz zdjąć przeklętego przedmiotu!
items.equipableitem.ac_equip=ZAŁÓŻ
items.equipableitem.ac_unequip=ZDEJMIJ

items.energycrystal.name=kryształy energii
items.energycrystal.desc=Kilka małych, magicznych kryształów, wypełnionych alchemiczną energią.\n\nTe kryształy są podstawowym składnikiem alchemicznych receptur. Można je stworzyć w tyglu alchemicznym przez rozłożenie przedmiotów jednorazowego użytku.

items.gold.name=złoto
items.gold.desc=Stos złotych monet. Zebrane monety możesz później wydać w sklepie.

items.heap.for_sale=%1$dz: %2$s
items.heap.chest=Skrzynia
items.heap.chest_desc=Nie będziesz wiedział co jest w środku, dopóki jej nie otworzysz!
items.heap.locked_chest=Zamknięta skrzynia
items.heap.locked_chest_desc=Nie wiesz co jest w środku dopóki jej nie otworzysz! Ale żeby ją otworzyć potrzebujesz złotego klucza.
items.heap.crystal_chest=Kryształowa skrzynia
items.heap.crystal_chest_desc=Widzisz, że w środku jest _%s_, ale potrzebujesz kryształowego klucza, by ją otworzyć.
items.heap.artifact=artefakt
items.heap.wand=różdżka
items.heap.ring=pierścień
items.heap.tomb=Grób
items.heap.tomb_desc=Ten antyczny grób może zawierać coś użytecznego, ale jego właściciel z pewnością jest przeciwny sprawdzaniu go.
items.heap.skeleton=Szczątki szkieletu
items.heap.skeleton_desc=To jest wszystko co pozostało po jakimś nieszczęśliwym poszukiwaczu przygód. Może warto go sprawdzić by znaleźć coś wartościowego.
items.heap.remains=Szczątki bohatera
items.heap.remains_desc=To jest wszystko co pozostało po jednym z twoich poprzedników. Może warto go sprawdzić by znaleźć coś wartościowego.

items.honeypot.name=dzban miodu
items.honeypot.ac_shatter=ROZBIJ
items.honeypot.desc=Wewnętrzne ściany tego wielkiego dzbana miodu są w zasadzie pokryte tylko cienką warstwą miodu. Zamiast tego gości on olbrzymią pszczołę! Ten gatunek pszczół zwykle pozostaje w swoich ulach – być może ten dzban to jakiś rodzaj specjalistycznej pułapki? Pszczoła jest całkiem zadowolona ze swojego nowego domu i bzyczy na ciebie ostrzegawczo, kiedy się jej przyglądasz.
items.honeypot$shatteredpot.name=stłuczony dzban miodu
items.honeypot$shatteredpot.desc=Dzban został stłuczony, tylko kleisty miód wyścielający ściany trzyma go w całości, i powoli zaczyna puszczać.\n\nPomimo tego, że jest on stłuczony, pszczoła ciągle próbuje chronić swój dzban.

items.item.prompt=Wybierz kierunek rzutu
items.item.ac_drop=UPUŚĆ
items.item.ac_throw=RZUĆ
items.item.rankings_desc=Zabity przez: %s
items.item.curse=klątwa
items.item.custom_note_type=Ten typ przedmiotu ma niestandardową notatkę: "_%s_"
items.item.custom_note=Ten przedmiot ma niestandardową notatkę: "_%s_"
items.item.discover_hint=Ten przedmiot możesz znaleźć losowo gdzieś w lochu.

items.kindofmisc.unequip_title=Zdejmij jeden z przedmiotów
items.kindofmisc.unequip_message=Musisz najpierw ściągnąć jeden z tych przedmiotów. Wybierz przedmiot do zamiany.

items.kindofweapon.swift_equip=Szybko dobierasz swoją broń.
items.kindofweapon.equip_cursed=Twoja dłoń mimowolnie zaciska się wokół broni.
items.kindofweapon.which_equip_msg=Które miejsce na broń chciałbyś wybrać do wyposażenia tego przedmiotu?\n\nMistrzyni bezpośrednio atakuje swoją główną bronią, ale może używać zdolności obu broni. Obie bronie mają tę samą liczbę ładunków.\n\nMistrzyni może również natychmiast zamienić miejscami swoją główną i dodatkową broń.
items.kindofweapon.which_equip_primary=Główna (%s)
items.kindofweapon.which_equip_secondary=Dodatkowa (%s)
items.kindofweapon.empty=puste

items.kingscrown.name=Korona króla krasnoludów
items.kingscrown.ac_wear=ZAŁÓŻ
items.kingscrown.naked=Niestety, korona nie może przemienić twojej bielizny.
items.kingscrown.upgraded=Korona zaczyna jasno świecić, a następnie rozpada się, gdy twoja zbroja ulega przemianie!
items.kingscrown.ratgraded=Łapa Szczurzego Króla zaczyna jasno świecić, a twoja zbroja ulega przemianie!
items.kingscrown.desc=Korona ostatniego króla krasnoludów. Świeci ogromną magiczną energią.\n\nPo nałożeniu, magia korony przepłynie do zbroi, którą obecnie nosisz, przekształcając ją w _unikatową zbroję ze specjalnymi umiejętnościami_. Nowa zbroja zachowa wszystkie właściwości oryginalnej zbroi.
items.kingscrown.discover_hint=Ten przedmiot możesz dostać jako łup z pewnych przeciwników.

items.liquidmetal.name=płynny metal
items.liquidmetal.ac_apply=UŻYJ
items.liquidmetal.prompt=Wybierz broń miotaną
items.liquidmetal.already_fixed=Ta broń miotana już jest w idealnym stanie!
items.liquidmetal.apply=Liczba użytych jednostek płynnego metalu do naprawy broni miotanej: %d.
items.liquidmetal.desc=Ten magiczny płyn wypełnia pęknięcia i rysy broni miotanej, całkowicie ją naprawiając! Jeżeli w zestawie brakuje sztuk broni, a jest on w idealnym stanie, to płynny metal można wykorzystać do odtworzenia brakującej broni z zestawu! \n\nBroń 1. kręgu wymaga 10 fiolek płynnego metalu by zostać w pełni naprawiona, a broń 5. kręgu wymaga 30. Każde ulepszenie zwiększa ilość wymaganego metalu o 35%.\n\nPłynny metal nie może być wykorzystany do naprawy nasączonych strzałek.
items.liquidmetal.discover_hint=Ten przedmiot możesz stworzyć poprzez alchemię.

items.lostbackpack.name=stracony plecak
items.lostbackpack.desc=To twój utracony ekwipunek. Zbierz go aby odzyskać wszystkie utracone przedmioty!

items.merchantsbeacon.name=kupiecki przekaźnik
items.merchantsbeacon.ac_use=UŻYJ
items.merchantsbeacon.desc=Ten dziwny wytwór krasnoludzkiej techniki pozwala na komunikację na dalekie odległości.\n\nPo uruchomieniu, ten nadajnik pozwoli ci sprzedawać przedmioty do sklepu z dowolnego miejsca labiryntu.\n\nJednakże magia tego nadajnika wystarczy tylko na jedną sesję, więc użyj go mądrze.

items.stylus.name=magiczny rylec
items.stylus.ac_inscribe=WYRYJ
items.stylus.prompt=Wybierz zbroję
items.stylus.identify=Musisz najpierw zidentyfikować czy ta zbroja jest przeklęta.
items.stylus.cursed=Magia rylca nie działa na przeklęte zbroje.
items.stylus.inscribed=Zapisałeś swoją zbroję rylcem.
items.stylus.desc=Ten magiczny rylec jest zrobiony z jakiegoś ciemnego, bardzo twardego kamienia. Możesz nim wyryć magiczny glif na swojej zbroi, ale nie możesz wybrać jaki on będzie. Rylec zrobi to za ciebie.

items.tengusmask.name=Maska Tengu
items.tengusmask.ac_wear=ZAŁÓŻ
items.tengusmask.used=Maska rozpada się, a jej moc napływa do ciebie!
items.tengusmask.desc=Ta maska spadła z twarzy Tengu po jego śmierci. Czujesz, jak emanuje z niej wielką magiczną moc. Czy maska była źródłem mocy Tengu?\n\nPo założeniu, ogromna moc maski zostanie przeniesiona na Ciebie, umożliwiając _wybór specjalizacji dla twojego bohatera._\n\nKtórą specjalizację wybierzesz?
items.tengusmask.discover_hint=Ten przedmiot możesz dostać jako łup z pewnych przeciwników.

items.torch.name=pochodnia
items.torch.ac_light=ZAPAL
items.torch.desc=Niezbędnik podróżnika - gdy w labiryncie zrobi się ciemno, pochodnia rozjaśni ci drogę.

items.waterskin.name=bukłak
items.waterskin.ac_drink=PIJ
items.waterskin.collected=Zbierasz kroplę rosy do bukłaka.
items.waterskin.full=Twój bukłak jest pełny!
items.waterskin.empty=Twój bukłak jest pusty!
items.waterskin.desc=Pojemnik na płyny wykonany ze skóry i sznurka, zamykany szczelnie korkiem.
items.waterskin.desc_water=Aktualnie bukłak zawiera tylko zwykła wodę pitną. Z pewnością w lochu znajdzie się coś innego, co można by przechowywać w bukłaku.
items.waterskin.desc_heal=Obecnie bukłak jest używany do przechowania wody leczniczej. Im pełniejszy bukłak, tym bardziej zostaniesz uzdrowiony podczas picia. Wypijesz tylko tyle, ile potrzebujesz.
items.waterskin.desc_full=Pełny bukłak wydaje się promieniować energią, być może da się go użyć do pobłogosławienia innego przedmiotu ułatwiającego przetrwanie?
items.waterskin.discover_hint=Z tym przedmiotem zaczyna jeden z bohaterów.

