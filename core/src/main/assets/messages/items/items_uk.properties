###armor curses
items.armor.curses.antientropy.name=%s анти-ентропії.
items.armor.curses.antientropy.desc=Прокляття анти-ентропії протидіє законам всесвіту, поглинаючи енергію в носія з оточення. Воно злегка підпалює носія, але заморожує все навколо!

items.armor.curses.bulk.name=%s незграбності
items.armor.curses.bulk.desc=Обладунок виглядає більшим, але насправді не має бонусів до захисту. Що гірше, додатковий розмір значно ускладнює проходження крізь двері.

items.armor.curses.corrosion.name=%s корозії.
items.armor.curses.corrosion.desc=Обладунок корозії здатен розбризкати корозійну рідину, покривши все навколо липкою кислотою

items.armor.curses.displacement.name=%s телепортації
items.armor.curses.displacement.desc=Прокляття телепортації намагається убезпечити власника обладунку, телепортуючи його у випадкове місце рівня при отриманні шкоди.

items.armor.curses.metabolism.name=%s метаболізму
items.armor.curses.metabolism.desc=Прокляття метаболізму перетворює ситість на здоров'я коли власник обладунку поранений, підсилюючи регенерацію, але одночасно викликаючи голод.

items.armor.curses.multiplicity.name=%s копіювання
items.armor.curses.multiplicity.desc=Обладунок, проклятий копіюванням, містить в собі небезпечну ілюзорну магію. Він може створити копію власника, проте з такими ж шансами на успіх і копію ворога!

items.armor.curses.overgrowth.name=%s природи
items.armor.curses.overgrowth.desc=Обладунки природи вкриті великою кількістю квітучих рослин. Хоча це виглядає цікаво, ніякого додаткового захисту це не надає, проте під час бою ефекти рослин можуть хаотично спрацювати!

items.armor.curses.stench.name=%s смороду
items.armor.curses.stench.desc=Обладунки, прокляті смородом, випускатимуть хмари смердючого отруйного газу, смертельного для будь кого, хто зайде у його хмару.


###glyphs
items.armor.glyphs.affection.name=%s причарування
items.armor.glyphs.affection.desc=Ця потужна руна підкорить розум атакуючого, викликавши тимчасове причарування

items.armor.glyphs.antimagic.name=%s антимагії
items.armor.glyphs.antimagic.desc=Ця потужна руна дозволить обладункам захищати від магічних атак так само, як і від фізичних. На магічний захист не впливає ранг обладунку.

items.armor.glyphs.brimstone.name=%s вогненних чар
items.armor.glyphs.brimstone.desc=Ці чари захищають власника та його речі від вогню, роблячи його повністю невразливим до його шкоди та негативного ефекту.

items.armor.glyphs.camouflage.name=%s маскування
items.armor.glyphs.camouflage.desc=Ця руна дозволяє власнику ховатися у високій траві, надаючи тимчасову невидимість

items.armor.glyphs.entanglement.name=%s укорінення
items.armor.glyphs.entanglement.desc=Ця руна вирощує земляний обладунок навколо власника, який поглинає пошкодження, але зникає, якщо користувач переміститься.

items.armor.glyphs.flow.name=%s водних чар
items.armor.glyphs.flow.desc=Ці чари маніпулюють потоками води навколо власника,надаючи йому значну швидкість пересування у воді.

items.armor.glyphs.obfuscation.name=%s тіньових чар
items.armor.glyphs.obfuscation.desc=Ці чари приховують власника,роблячи його непомітнішим

items.armor.glyphs.potential.name=%s потенціалу
items.armor.glyphs.potential.desc=Ця руна випускає хвилі енергії при отриманні шкоди, надаючи заряди жезлам власника при активації.

items.armor.glyphs.repulsion.name=%s відштовхування
items.armor.glyphs.repulsion.desc=Ця руна відбиває енергію удару назад на ворога, відштовхуючи його назад.

items.armor.glyphs.stone.name=%s земних чар
items.armor.glyphs.stone.desc=Ці чари вкривають обладунок шаром надміцного каменю, що робить неможливим ухилення проте блокує шкоду, пропорційну шансу ухилення.

items.armor.glyphs.swiftness.name=%s швидкості
items.armor.glyphs.swiftness.desc=Ця руна підвищує швидкість власника в разі, якщо за ним не женеться ворог.

items.armor.glyphs.thorns.name=%s шипів
items.armor.glyphs.thorns.desc=Ця потужна руна шкодить ворогам, змушуючи їх повільно кровоточити, коли вони атакують власника.

items.armor.glyphs.viscosity.name=%s в'язкості
items.armor.glyphs.viscosity.deferred=відкладено %d
items.armor.glyphs.viscosity$defereddamage.name=відкладені пошкодження
items.armor.glyphs.viscosity$defereddamage.ondeath=Відкладена шкода вбиває тебе...
items.armor.glyphs.viscosity$defereddamage.rankings_desc=Вбитий відкладеною шкодою
items.armor.glyphs.viscosity$defereddamage.desc=Шкода наноситься протягом деякого часу, а не одноразово.\n\nВідкладеної шкоди лишилось: %d.
items.armor.glyphs.viscosity.desc=Ця руна здатна зберігати шкоду, нанесену власнику, наносячи її повільно, а не всю за раз.



###armor
items.armor.armor.ac_detach=ВІДЧЕПИТИ
items.armor.armor.detach_seal=Ви відчепили печатку від свого обладунку.
items.armor.armor.equip_cursed=Обладунки боляче впиваються у ваше тіло
items.armor.armor.identify=Ви достатньо використовували цей обладунок, щоб розпізнати його.
items.armor.armor.hardening_gone=Загартування цього обладунку стерлося!
items.armor.armor.incompatible=Несумісність різних типів магії стерла руну з цього обладунку!
items.armor.armor.curr_absorb=Цей _%1$d-ранговий_ обладунок блокує _%2$d-%3$d шкоди_ та вимагає _%4$d сили_ для належного використання.
items.armor.armor.avg_absorb=Зазвичай цей _%1$d-ранговий_ обладунок блокує _%2$d-%3$d шкоди_ та вимагає _%4$d сили_ для належного використання.
items.armor.armor.too_heavy=Через вашу недостатню силу, в цьому обладунку ви будете повільнішим, незграбнішим та менш захищеним.
items.armor.armor.probably_too_heavy=Здається, цей обладунок заважкий для тебе.
items.armor.armor.excess_str=Через вашу додаткову силу, ви будете _більш спритними_ у цьому обладунку.
items.armor.armor.evasion=Обладунок посилений на _ухилення._
items.armor.armor.defense=Обладунок посилений на _захист._
items.armor.armor.inscribed=на нього начертано _%s._
items.armor.armor.glyph_hardened=Це було _загартовано._
items.armor.armor.hardened_no_glyph=Цей обладунок був _загартований_, але наразі на нього не начертано руни.
items.armor.armor.cursed_worn=Через те, що цей обладунок проклятий, ви не можете його зняти.
items.armor.armor.cursed=Ви відчуваєте темну магію, що наповнює цей обладунок.
items.armor.armor.weak_cursed=Навіть попри те, що обладунок проклятий, ви можете зняти його.
items.armor.armor.not_cursed=Цей обладунок вільний від злих чарів.
items.armor.armor.seal_attached=До цього обладунку прикріплена зламана печатка Воїна. Коли він буде поранений до напівживого стану, вона дарує йому _%d захисту_.
items.armor.armor.seal_transfer=Зламана печатка воїна повинна бути прикріплена до обладунку, який він зараз носить, щоб принести йому користь. Ви хочете, щоб печатка автоматично знімалася з обладунку, який ви скидаєте, і прикріплювалася до обладунку, який ви одягаєте?
items.armor.armor.seal_transfer_yes=так
items.armor.armor.seal_transfer_no=ні
items.armor.armor$glyph.glyph=руна
items.armor.armor$glyph.killed=%s вбив тебе...
items.armor.armor$glyph.rankings_desc=Вбитий руною
items.armor.armor$glyph.discover_hint=Ви можете знайти предмет з цим ефектом випадковим чином у підземеллі або спробувати застосувати його до предмета самостійно.

items.armor.classarmor.ac_ability=ОБЕРІТЬ ЗДІБНІСТЬ
items.armor.classarmor.ac_transfer=ПЕРЕНЕСЕННЯ
items.armor.classarmor.no_ability=Ваш обладунок ще не має здібності, оберіть якусь!
items.armor.classarmor.not_equipped=Щоб використати спеціальну здібність цього обладунку, ви повинні його одягти!
items.armor.classarmor.low_charge=Обладунку не вистачає зарядів, щоб активувати свою особливу здібність!
items.armor.classarmor.charge_use=Використання здібності поглине _%s_ заряд.
items.armor.classarmor.transfer_title=Перенести обладунок
items.armor.classarmor.transfer_desc=Магію корони короля дварфів можна перенести на інший обладунок. Зауважте, що оригінальний обладунок буде знищено в процесі.
items.armor.classarmor.transfer_prompt=Оберіть обладунок
items.armor.classarmor.transfer_cancel=Скасувати
items.armor.classarmor.transfer_complete=Властивості вашого героїчного обладунку було перенесено!
items.armor.classarmor.discover_hint=Ви можете знайти цей предмет після перемоги над босом 20-го поверху певним героєм.

items.armor.clericarmor.name=вбрання героя
items.armor.clericarmor.desc=Одягнувши цю суміш тканини та пластини, Священник може виконувати особливу здатність.

items.armor.clotharmor.name=сорочка
items.armor.clotharmor.desc=Цей легкий одяг забезпечує базовий захист
items.armor.clotharmor.discover_hint=Один з героїв починає з цього предмета.

items.armor.duelistarmor.name=нагрудник героя
items.armor.duelistarmor.desc=Одягнувши цей латний обладунок і накидку, дуелянт може використовувати особливу здатність.

items.armor.huntressarmor.name=Плащ героя
items.armor.huntressarmor.no_enemies=Поблизу немає ворогів
items.armor.huntressarmor.desc=Одягнувши цей плащ, мисливиця може використовувати особливу здатність

items.armor.leatherarmor.name=шкіряний обладунок
items.armor.leatherarmor.desc=Обладунок, зроблений з висушеної гноллячої шкіри. Не такий легкий, як сорочка, але забезпечує кращий захист.

items.armor.magearmor.name=Мантія героя
items.armor.magearmor.desc=Одягнувши цю розкішну мантію, маг може використовувати особливу здатність.

items.armor.mailarmor.name=кольчуга
items.armor.mailarmor.desc=З'єднані між собою металеві ланки утворюють міцний, але гнучкий обладунок.

items.armor.platearmor.name=Лати
items.armor.platearmor.desc=Величезні металеві пластини, з'єднані між собою, забезпечують надзвичайний захист тому, хто має достатньо сили, щоб витримати їх величезну вагу.

items.armor.roguearmor.name=Накидка героя
items.armor.roguearmor.desc=Одягаючи цю темну накидку, розбійник може використовувати особливу здатність.

items.armor.scalearmor.name=Луската броня
items.armor.scalearmor.desc=Металеві луски, нашиті на шкіряну основу, утворюють гнучкий, але міцний обладунок.

items.armor.warriorarmor.name=латний обладунок героя
items.armor.warriorarmor.desc=Одягнувши ці важкі лати, воїн може використати особливу здібність.



###artifacts
items.artifacts.alchemiststoolkit.name=Набір алхіміка
items.artifacts.alchemiststoolkit.ac_brew=ЗМІШАТИ
items.artifacts.alchemiststoolkit.ac_energize=ЗАРЯДИТИ
items.artifacts.alchemiststoolkit.not_ready=Ваш набір ще не закінчив прогрівання.
items.artifacts.alchemiststoolkit.cursed=Ваш проклятий набір інструментів заважає вам використовувати алхімію!
items.artifacts.alchemiststoolkit.need_energy=Для цього вам потрібно щонайменше 6 енергії.
items.artifacts.alchemiststoolkit.energize_desc=Кожні 6 енергетичних кристалів дають набору інструментів достатньо енергії, щоб отримати рівень, що збільшує швидкість, з якою набір інструментів генерує енергію з часом, і дає йому змогу нагріватися швидше. \n\nСкільки енергії ви хотіли б використати?
items.artifacts.alchemiststoolkit.energize_1=6 енергії: +1 рівень
items.artifacts.alchemiststoolkit.energize_all=%1$d енергії: +%2$d рівнів
items.artifacts.alchemiststoolkit.desc=Цей набір містить ряд реактивів і трав разом з невеликим флаконом для змішування, що дозволяє займатися алхімією будь-де. Флакон містить щось схоже на кристали алхімічної енергії в рідкому вигляді.
items.artifacts.alchemiststoolkit.desc_cursed=Проклятий набір алхіміка причепився до вашої руки і не дозволяє вам використовувати алхімію.
items.artifacts.alchemiststoolkit.desc_warming=Наразі набір нагрівається, і він буде готовий до використання через деякий час.
items.artifacts.alchemiststoolkit.desc_hint=Одягнений набір повільно генерує алхімічну енергію, коли ви набираєтеся досвіду. Схоже, що суміш в флаконі можна покращити, додавши до неї енергетичні кристали.

items.artifacts.artifact.cannot_wear_two=Ви не можете одягти два однакових артефакти
items.artifacts.artifact.equip_cursed=Артефакт болісно прив’язується до вас.
items.artifacts.artifact.curse_known=Ви відчуваєте зловісну магію, що ховається в цьому артефакту.
items.artifacts.artifact.not_cursed=Цей артефакт не містить зловісної магії.
items.artifacts.artifact.need_to_equip=Для цього вам потрібно одягнути цей артефакт.

items.artifacts.capeofthorns.name=Шипастий плащ
items.artifacts.capeofthorns.desc=Ці зім'яті листи металу з переможеного ЗМ-300 утворили жорсткий плащ. Здається, він зберіг частину сили ЗМ-300.
items.artifacts.capeofthorns.desc_inactive=Плащ здається вам заспокійливо важким, він, здається, заряджається від отриманих пошкоджень.
items.artifacts.capeofthorns.desc_active=Плащ вивільняє накопичену енергію, випромінюючи захисну силу.
items.artifacts.capeofthorns$thorns.inert=Ваш плащ знову стає інертним.
items.artifacts.capeofthorns$thorns.radiating=Ваш плащ починає випромінювати енергію, ви відчуваєте себе захищеним!
items.artifacts.capeofthorns$thorns.levelup=Ваш Плащ міцнішає!
items.artifacts.capeofthorns$thorns.name=шипи
items.artifacts.capeofthorns$thorns.desc=Ваш плащ випромінює енергію, оточуючи вас полем відхиляючої сили!\n\nВся отримана шкода зменшується під час активної дії шипів. Крім того, якщо ворог знаходиться поруч з вами, зменшена шкода відбивється назад у нього.\n\nХодів залишилося до закінчення дії шипів:%s.

items.artifacts.chaliceofblood.name=кривавий кубок
items.artifacts.chaliceofblood.ac_prick=ВКОЛОТИСЯ
items.artifacts.chaliceofblood.yes=Так, я розумію, що я роблю
items.artifacts.chaliceofblood.no=Ні, я одумався
items.artifacts.chaliceofblood.prick_warn=Кожного разу, коли ви використовуєте кубок, він висмоктує все більше вашої життєвої енергії, але натомість ще більше посилює природне відновлення вашого здоров'я.\n\nНаразі укол завдасть _%1$d-%2$d шкоди_, хоча цю шкоду можна зменшити за допомогою _фізичного та магічного блокування або зменшення шкоди._ Не враховуючи ефекти зменшення шкоди, укол наразі має _%3$s%% шанс_ повністю виснажити вашу життєву силу.\n\nВи впевнені, що хочете надати кубку більше життєвої енергії?
items.artifacts.chaliceofblood.onprick=Ви колете себе, і ваша життєва енергія стікає в кубок.
items.artifacts.chaliceofblood.ondeath=Кубок висмоктує вашу енергію до кінця...
items.artifacts.chaliceofblood.desc=Цей сяючий срібний кубок дивно прикрашений гострими дорогоцінними каменями на обідку.
items.artifacts.chaliceofblood.desc_cursed=Проклятий кубок вчепився у вашу руку і гальмує регенерацію.
items.artifacts.chaliceofblood.desc_1=Коли ви тримаєте кубок, ви відчуваєте дивне відчуття, вас тягне вколоти руку гострими самоцвітами на обідку.
items.artifacts.chaliceofblood.desc_2=Частина вашої крові збирається в кубок, ви можете ледь відчувати, як кубок наповнює вас життєвою енергією, посилюючи природні сили відновлення вашого здоров'я. Ви все ще хочете порізатися, хоча й знаєте, як це боляче?
items.artifacts.chaliceofblood.desc_3=Кубок наповнений до краю вашою життєвою енергією. Ви відчуваєте, як він віддає вам життєву енергію назад.

items.artifacts.cloakofshadows.name=Плащ тіней
items.artifacts.cloakofshadows.ac_stealth=СТЕЛС
items.artifacts.cloakofshadows.cooldown=Вашому плащу потрібно ще %d  ходів, щоб зарядитись.
items.artifacts.cloakofshadows.cursed=Ви не можете використовувати проклятий плащ.
items.artifacts.cloakofshadows.no_charge=Ваш плащ ще недостатньо заряджений для його використання.
items.artifacts.cloakofshadows.desc=Безцінний магічний плащ, викрадений Розбійником із королівської зброярні багато років тому. Носячи його, ви можете на короткий час стати абсолютно невидимими.\n\nЧим більше використовується плащ, тим могутніше він ставатиме, дозволяючи Розбійнику ставити невидимим частіше і на довше.
items.artifacts.cloakofshadows.discover_hint=Один з героїв починає з цього предмета.
items.artifacts.cloakofshadows$cloakstealth.no_charge=У вашому плащі закінчилася енергія.
items.artifacts.cloakofshadows$cloakstealth.levelup=Ваш плащ міцніє!
items.artifacts.cloakofshadows$cloakstealth.name=непомітний
items.artifacts.cloakofshadows$cloakstealth.desc=Ваш Плащ Тіней наділяє вас невидимістю, поки ви ним оповиті. Ви залишитесь прихованим, поки ви не розвієте ефект або поки у плаща не скінчиться заряд.\n\nПід час невидимості вороги не можуть атакувати чи переслідувати вас. Фізичні атаки та магічні ефекти (наприклад, сувої та жезли) відразу ж скасовують невидимість.\n\nЗалишилося %d ходів.

