items.artifacts.driedrose.charged=Ваша троянда повністю зарядилась!
items.artifacts.driedrose.desc=Хіба це не та троянда, про яку згадував привид? Здається, що вона має певну духовну силу, можливо, її можна використати для прикликання духу того загиблого воїна.
items.artifacts.driedrose.desc_no_quest=Висушена віками троянда, яка якимось дивовижним чином зберегла свої пелюстки.\n\nЗдається, що вона має певну духовну силу, але ви не знаєте, як її використати прямо зараз.
items.artifacts.driedrose.desc_hint=Здається, що не вистачає декількох пелюсток. Можливо, їх повернення посилить троянду.
items.artifacts.driedrose.desc_cursed=Проклята троянда вчепилась в вашу руку, вона жахливо холодна.
