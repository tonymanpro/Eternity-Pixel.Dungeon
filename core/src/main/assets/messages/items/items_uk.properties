##ghost hero
items.artifacts.driedrose$ghosthero.name=Сумний привид
items.artifacts.driedrose$ghosthero.def_verb=ухилився
items.artifacts.driedrose$ghosthero.discover_hint=Ви можете знайти цього персонажа за допомогою певного артефакту.

items.artifacts.driedrose$ghosthero.hello=Привіт знову, %s.
items.artifacts.driedrose$ghosthero.introduce=Мій дух пов'язаний з цією трояндою. Вона було дуже дорогоцінним подарунком для мене, подарунком від мого кохання, яке я залишив на поверхні.\n\nЯ не можу повернутися до свого кохання, але завдяки вам у мене є другий шанс завершити свою подорож. Як тільки я зможу, я відгукнусь на ваш поклик і буду битись заради вас.\n\nПоки у вас є троянда, я чую ваш поклик, тож ви можете використовувати її, щоб прикликати мене здалеку.\n\nСподіваюсь, ви зможете пройти там, де не зміг я...

items.artifacts.driedrose$ghosthero.dialogue_sewers_1=Ці каналізації раніше були безпечними, люди навіть тут жили взимку.
items.artifacts.driedrose$ghosthero.dialogue_sewers_2=Цікаво, що сталося з охоронними патрулями, вони втекли?
items.artifacts.driedrose$ghosthero.dialogue_sewers_3=У мене була сім'я на поверхні, я сподіваюся, що вони в безпеці.
items.artifacts.driedrose$ghosthero.dialogue_sewers_4=Охоронці не змогли перемогти цих монстрів, але, можливо, ми зможемо.
items.artifacts.driedrose$ghosthero.dialogue_sewers_5=Якщо навіть каналізація настільки небезпечна, мені все одно цікаво, що знаходиться нижче ...
items.artifacts.driedrose$ghosthero.dialogue_sewers_6=Що могло змусити щурів та крабів вирости до таких колосальних розмірів?
items.artifacts.driedrose$ghosthero.dialogue_prison_1=Я чув історії про це місце, нічого хорошого.
items.artifacts.driedrose$ghosthero.dialogue_prison_2=Це місце завжди було більше підземеллям, чим темницею.
items.artifacts.driedrose$ghosthero.dialogue_prison_3=Я не уявляю, що сталося, коли це місце покинули.
items.artifacts.driedrose$ghosthero.dialogue_prison_4=Схоже, і полонені, і охоронці перетворилися на монстрів.
items.artifacts.driedrose$ghosthero.dialogue_prison_5=Що може бути відповідальним за появу всіх цих скелетів?
items.artifacts.driedrose$ghosthero.dialogue_prison_6=Ці люди не мали загинути так...
items.artifacts.driedrose$ghosthero.dialogue_caves_1=Жодної людини чи дварфа тут не було вже дуже давно.
items.artifacts.driedrose$ghosthero.dialogue_caves_2=Що змусило дварфів відмовитись від золотої шахти?
items.artifacts.driedrose$ghosthero.dialogue_caves_3=Жаль, що все тутешнє золото непридатне для використання на поверхні.
items.artifacts.driedrose$ghosthero.dialogue_caves_4=Істоти тут також спотворені темною магією, так як і в каналізації.
items.artifacts.driedrose$ghosthero.dialogue_caves_5=Навіть кажани тут кровожерливі.
items.artifacts.driedrose$ghosthero.dialogue_caves_6=Жодних ознак гірничої техніки, дварфи її відкликали?
items.artifacts.driedrose$ghosthero.dialogue_city_1=Дварфи були прогресивною, але жадібною расою.
items.artifacts.driedrose$ghosthero.dialogue_city_2=Тож столиця дварфів справді була знищена?
items.artifacts.driedrose$ghosthero.dialogue_city_3=Я сподіваюся, що Місто ніколи не закінчить так, як скінчив Метрополіс.
items.artifacts.driedrose$ghosthero.dialogue_city_4=Дварфи не повинні бути такими блідими.
items.artifacts.driedrose$ghosthero.dialogue_city_5=Я не знаю, що гірше, зустріти дварфа , чи тих, кого вони вивільнили...
items.artifacts.driedrose$ghosthero.dialogue_city_6=Здається, дварфи також втратили розум...
items.artifacts.driedrose$ghosthero.dialogue_halls_1=Що це за місце?
items.artifacts.driedrose$ghosthero.dialogue_halls_2=Це жахливе місце...
items.artifacts.driedrose$ghosthero.dialogue_halls_3=Про що думали дварфи, граючи з такою силою?
items.artifacts.driedrose$ghosthero.dialogue_halls_4=Тут потойбічні чудовиська, звідки вони взялися?
items.artifacts.driedrose$ghosthero.dialogue_halls_5=Ти це відчуваєш? Наче щось спостерігає за нами.
items.artifacts.driedrose$ghosthero.dialogue_halls_6=Слава богу, тут є смолоскипи, тут так темно!
items.artifacts.driedrose$ghosthero.dialogue_ascension_1=Чому це відбувається, я думав, що нам вдалося?
items.artifacts.driedrose$ghosthero.dialogue_ascension_2=Як ця річ досі може впливати на світ?
items.artifacts.driedrose$ghosthero.dialogue_ascension_3=Сподіваюсь, ти знаєш, що робитимеш з цим амулетом.
items.artifacts.driedrose$ghosthero.dialogue_ascension_4=Гадаю, ми ще не закінчили.
items.artifacts.driedrose$ghosthero.dialogue_ascension_5=Ми вже стільки пройшли, що зможемо це закінчити!
items.artifacts.driedrose$ghosthero.dialogue_ascension_6=Ще трохи, ми зможемо вибратися звідси!

items.artifacts.driedrose$ghosthero.seen_goo_1=Остерігайся Хлюпня!
items.artifacts.driedrose$ghosthero.seen_goo_2=Багато моїх друзів загинули від його руки. Час помсти настав!
items.artifacts.driedrose$ghosthero.seen_goo_3=Такій гидоті не можна дозволяти існувати далі!
items.artifacts.driedrose$ghosthero.seen_tengu_1=Останній в'язень - смертоносний вбивця...
items.artifacts.driedrose$ghosthero.seen_tengu_2=Він заманив нас у пастку!
items.artifacts.driedrose$ghosthero.seen_tengu_3=Я чув страшні історії про його маску ...
items.artifacts.driedrose$ghosthero.seen_dm300_1=Лише дварфи могли створити подібні гірничі машини, які вміли б  так само добре знищувати ворогів.
items.artifacts.driedrose$ghosthero.seen_dm300_2=Ця річ величезна ...
items.artifacts.driedrose$ghosthero.seen_dm300_3=Як ця річ змогла працювати так довго?
items.artifacts.driedrose$ghosthero.seen_king_1=Коли люди кажуть, що влада оскверняє... це саме те, що вони мали на увазі.
items.artifacts.driedrose$ghosthero.seen_king_2=Він зараз більше ліч, ніж король.
items.artifacts.driedrose$ghosthero.seen_king_3=Навіть після смерті дварфи служать своєму володарю.
items.artifacts.driedrose$ghosthero.seen_yog_1=Ох, це не добре...
items.artifacts.driedrose$ghosthero.seen_yog_2=Так ось як виглядає бог?
items.artifacts.driedrose$ghosthero.seen_yog_3=Це буде боляче...

items.artifacts.driedrose$ghosthero.defeated_by_enemy_1=Удачі....
items.artifacts.driedrose$ghosthero.defeated_by_enemy_2=Втомився... поки що...
items.artifacts.driedrose$ghosthero.defeated_by_enemy_3=Я повернуся...
items.artifacts.driedrose$ghosthero.defeated_by_boss_1=Вибач... удачі...
items.artifacts.driedrose$ghosthero.defeated_by_boss_2=Закінчи це... без мене....
items.artifacts.driedrose$ghosthero.defeated_by_boss_3=Ні...Я не можу...
items.artifacts.driedrose$ghosthero.blessed_ankh_1=Як ти це пережив?
items.artifacts.driedrose$ghosthero.blessed_ankh_2=Я б хотів мати одного з них...
items.artifacts.driedrose$ghosthero.blessed_ankh_3=О боже мій! Ти ще й досі живий!
items.artifacts.driedrose$ghosthero.player_killed_1=Ні!...
items.artifacts.driedrose$ghosthero.player_killed_2=Я не міг їм допомогти ...
items.artifacts.driedrose$ghosthero.player_killed_3=Мені це не подобається...

items.artifacts.driedrose$ghosthero.direct_prompt=Що я повинен зробити?
items.artifacts.driedrose$ghosthero.directed_follow_1=Добре,я піду за тобою
items.artifacts.driedrose$ghosthero.directed_follow_2=Я буду битися за тебе
items.artifacts.driedrose$ghosthero.directed_follow_3=Слідую за тобою...
items.artifacts.driedrose$ghosthero.directed_follow_4=Добре, пішли!
items.artifacts.driedrose$ghosthero.directed_follow_5=Я прикрию твою спину.
items.artifacts.driedrose$ghosthero.directed_attack_1=Гаразд, Я атакуватиму його.
items.artifacts.driedrose$ghosthero.directed_attack_2=Я займуся цим.
items.artifacts.driedrose$ghosthero.directed_attack_3=Вступаю у бій...
items.artifacts.driedrose$ghosthero.directed_attack_4=Давай переможемо їх!
items.artifacts.driedrose$ghosthero.directed_attack_5=Здолав цього
items.artifacts.driedrose$ghosthero.directed_position_1=Гаразд,я буду утримувати цю позицію.
items.artifacts.driedrose$ghosthero.directed_position_2=Я йду туди і буду захищати.
