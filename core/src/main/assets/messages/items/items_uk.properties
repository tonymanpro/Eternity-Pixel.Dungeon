items.modules.strengthmodule.name=Strength Module
items.modules.strengthmodule.desc=When this module is used, it will increase your strength by 1.
items.modules.timereversermodule.name=Time Reverser Module
items.modules.timereversermodule.desc=When this module is used, a powerful time god will freeze your current state for 10 turns, newly spawned entities are not affected by this effect.
