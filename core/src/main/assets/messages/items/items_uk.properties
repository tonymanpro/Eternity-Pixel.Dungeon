items.artifacts.driedrose$ghosthero.directed_position_4=Вже йду
items.artifacts.driedrose$ghosthero.directed_position_5=Направляюся туди

items.artifacts.driedrose$ghosthero.desc=Неміцна на вигляд ефірна гуманоїдна фігура. Його сила, здається, пов’язана з трояндою.\n\nХоча цей привид й слабкий, проте він є вашим єдиним другом в цьому темному і холодному підземеллі.

