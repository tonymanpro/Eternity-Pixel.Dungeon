items.artifacts.lloydsbeacon.prompt=Оберіть місце для пострілу.
items.artifacts.lloydsbeacon.levelup=Ваш маяк покращився!
items.artifacts.lloydsbeacon.preventing=Могутня магічна аура цього місця не дозволяє вам використовувати маяк!
items.artifacts.lloydsbeacon.creatures=Ментальна аура ворогів поблизу не дозволяє вам використати маяк.
items.artifacts.lloydsbeacon.return=Маяк телепортації був встановлений,тепер ви можете повернутися в це місце у будь-який час.
items.artifacts.lloydsbeacon.desc=Маяк телепортації це хитромудрий магічний прилад, який використовує просторову магію. Маяк може бути використаний для повернення в раніше позначену точку, або може вивільнити сплеск нестабільної телепортуючої магії. Ця магія може бути спрямована на ворога або на самого користувача.
items.artifacts.lloydsbeacon.desc_set=Маяк був встановлений десь на %d рівні підземелля.

items.artifacts.masterthievesarmband.name=пов'язка голови гільдії
items.artifacts.masterthievesarmband.ac_steal=ВКРАСТИ
items.artifacts.masterthievesarmband.no_charge=Ваша пов'язка не має достатньо заряду.
items.artifacts.masterthievesarmband.cursed=Ви не можете скористатися проклятою пов'язкою.
items.artifacts.masterthievesarmband.full=Ваша пов'язка повністю заряджена!
items.artifacts.masterthievesarmband.prompt=Оберіть ворога для націлення
items.artifacts.masterthievesarmband.no_target=Ви маєте обрати ворога, що прилеглий до вас.
items.artifacts.masterthievesarmband.steal_shopkeeper=Ви не можете напряму красти у крамарів.
items.artifacts.masterthievesarmband.no_steal=У цього ворога немає нічого, щоб вкрасти.
items.artifacts.masterthievesarmband.stole_item=Ви вкрали предмет: %s.
items.artifacts.masterthievesarmband.failed_steal=Ви не змогли нічого вкрасти.
items.artifacts.masterthievesarmband.level_up=Ваша пов'язка міцнішає!
items.artifacts.masterthievesarmband.desc=Ця фіолетова оксамитова пов'язка носить знак голови Гільдії злодіїв. Вона не належить вам, але, ймовірно, вона теж не належала останньому власнику.
items.artifacts.masterthievesarmband.desc_cursed=Проклята пов'язка прив’язалась до вашого зап'ястя, і чомусь ваш мішечок із золотом, здається, повільно втрачає свою вагу...
items.artifacts.masterthievesarmband.desc_worn=У міру того, як ви отримуєте досвід, ви відчуваєте нарощування сили в пов'язці на зап'ясті. Ви можете використати цю силу, щоб красти магазинах, або пограбувати ворогів!\n\nГрабунок ворогів відбувається моментально, тимчасово дезорієнтує їх, та дає вам шанс отримати якусь здобич, що вони мають! Ця сила більш ефективна, проти несвідомих ворогів. Грабунок одного й того ж самого ворога декілька разів не дає кращий шанс на здобич.

items.artifacts.sandalsofnature.name=сандалії природи
items.artifacts.sandalsofnature.name_1=черевики природи
items.artifacts.sandalsofnature.name_2=чоботи природи
items.artifacts.sandalsofnature.name_3=краги природи
items.artifacts.sandalsofnature.ac_feed=ЗГОДУВАТИ
items.artifacts.sandalsofnature.ac_root=УКОРІНИТИСЯ
items.artifacts.sandalsofnature.prompt=Виберіть насінину
items.artifacts.sandalsofnature.levelup=Ваші чоботи збільшилися в розмірах!
items.artifacts.sandalsofnature.absorb_seed=Чоботи поглинають насіння, здається що вони стали здоровішими.
items.artifacts.sandalsofnature.no_effect=Ви спочатку маєте нагодувати взуття насінням.
items.artifacts.sandalsofnature.low_charge=Ваше взуття не має достатньо енергії для цього.
items.artifacts.sandalsofnature.prompt_target=Оберіть локацію
items.artifacts.sandalsofnature.out_of_range=Ця локація поза зоною досяжності.
items.artifacts.sandalsofnature.desc_1=На перший погляд вам здалося, що це сандалії, але насправді вони виявилися двома рослинами! Вони дуже слабкі і бліді, можливо, їм потрібно дати чимось підживитися?
items.artifacts.sandalsofnature.desc_2=Ваші сандалії виросли! Тепер вони більше нагадують черевики, також до них повернувся колір. Можливо, вони можуть вирости ще більше?
items.artifacts.sandalsofnature.desc_3=Ваші черевики виросли знову і тепер нагадують пару міцних чобіт з кори. Рослини відновили свою силу, але, можливо, і це не остання їх трансформація?
items.artifacts.sandalsofnature.desc_4=Рослини, схоже, досягли свого максимального розміру, вони вже нагадують пару броньованих крагів.  Вони мають глибокий бурий колір, схожий на колір дуже міцного дерева.
items.artifacts.sandalsofnature.desc_hint=Ви відчуваєте єдність з природою, носячи цей артефакт.
items.artifacts.sandalsofnature.desc_cursed=Прокляті сандалі блокують будь-який зв'язок з природою.
items.artifacts.sandalsofnature.desc_ability=Взуття переливається кольором останнього насіння, яким ви його нагодували. Вони можуть ненадовго вкорінитися в землю і створити ефект цієї рослини будь-де в радіусі 3-х плиток.\nНасіння: _%s_\nНеобхідно заряду: _%d%%_
items.artifacts.sandalsofnature.desc_seeds=Ви нагодували взуття насіниною %d.

items.artifacts.skeletonkey.name=скелетний ключ
items.artifacts.skeletonkey.ac_insert=ВСТАВИТИ
items.artifacts.skeletonkey.cursed=Не можна використовувати проклятий скелетний ключ.
items.artifacts.skeletonkey.prompt=Виберіть ціль
items.artifacts.skeletonkey.invalid_target=Там нічого замикати чи відмикати.
items.artifacts.skeletonkey.lock_no_space=Не можна замикати персонажа за дверима!
items.artifacts.skeletonkey.iron_charges=Відкриття звичайного замка вимагає 1 заряд.
items.artifacts.skeletonkey.gold_charges=Відкриття золотого замка вимагає 2 заряди.
items.artifacts.skeletonkey.lock_charges=Замикання дверей вимагає 2 заряди.
items.artifacts.skeletonkey.wall_charges=Для створення тимчасової стіни потрібно 2 заряди.
items.artifacts.skeletonkey.crystal_charges=Відкриття кришталевого замка вимагає 5 зарядів.
items.artifacts.skeletonkey.wont_open=Ключ з якоїсь причини не входить у цей замок.
items.artifacts.skeletonkey.locked_with_key=Ці двері замкнено твоїм скелетним ключем.
items.artifacts.skeletonkey.force_lock=Замок ослаб без вашого скелетного ключа. Вам вдається його виламати.
items.artifacts.skeletonkey.discard=Ви викидаєте зайві ключі.
items.artifacts.skeletonkey.levelup=Ваш скелетний ключ стає сильнішим!
items.artifacts.skeletonkey.desc=Важливий на вигляд ключ з головкою у формі черепа. Його зубці здаються різними щоразу, коли на них дивишся.
items.artifacts.skeletonkey.desc_worn=Цей чарівний ключ, здається, набуває сили, коли ви використовуєте його замість звичайних ключів від підземелля. Його можна вставляти майже в будь-який замок підземелля, щоб відкрити або закрити його, включаючи двері, які раніше ніколи не замикалися.\n\nКлюч можна використовувати навіть на порожньому просторі в прямому або діагональному напрямку, щоб «заблокувати» повітря перед собою, створивши міцну стіну шириною в 3 плитки, яка протримається 10 ходів. Блокування відштовхне ворогів, якщо для цього є місце.
items.artifacts.skeletonkey.desc_cursed=Проклятий ключ, здається, активно уникає вставляння в будь-який замок і навіть ускладнює (але не унеможливлює) використання інших ключів.
items.artifacts.skeletonkey$keywall.desc=Тут за допомогою скелетного ключа було встановлено тимчасову магічну стіну.

items.artifacts.talismanofforesight.name=талісман передбачення
items.artifacts.talismanofforesight.ac_scry=ПРОЗРІННЯ
items.artifacts.talismanofforesight.low_charge=Цьому талісману потрібно щонайменше 5% заряду для активації передбачення.
items.artifacts.talismanofforesight.prompt=Виберіть місцевість для сканування.
items.artifacts.talismanofforesight.levelup=Ваш талісман став могутнішим!
items.artifacts.talismanofforesight.full_charge=Ваш талісман повністю заряджений!
items.artifacts.talismanofforesight.desc=Гладкий камінь із дивними гравюрами на ньому. Ви відчуваєте, як камінь оглядає все навколо себе, шукаючи щось приховане.
items.artifacts.talismanofforesight.desc_worn=Коли ви тримаєте талісман, ви відчуваєте, як ваші почуття загострюються. Талісман повільно накопичує заряд з часом, або коли ви виявляєте приховані двері чи пастки.\n\nТалісман може витратити накопичений заряд для використання Прозріння у конусоподібній зоні, яке розкриє всі секрети та пастки відсканованої місцевості та дасть вам побачити всіх ворогів і предмети на рівні, проте тільки на короткий час.
items.artifacts.talismanofforesight.desc_cursed=Проклятий талісман пильно дивиться на вас, через що вам важко сконцентруватись.
items.artifacts.talismanofforesight$foresight.name=прозріння
items.artifacts.talismanofforesight$foresight.uneasy=Ви відчуваєте себе некомфортно.
items.artifacts.talismanofforesight$foresight.desc=Вам якось не по собі, ніби поблизу є якась небезпека.

items.artifacts.timekeepershourglass.name=пісочний годинник хранителя часу
items.artifacts.timekeepershourglass.ac_activate=АКТИВУВАТИ
items.artifacts.timekeepershourglass.deactivate=Ви деактивували зупинку часу.
items.artifacts.timekeepershourglass.no_charge=Ваш пісочний годинник ще не зарядився достатньо, щоб ним користуватися.
items.artifacts.timekeepershourglass.cursed=Ви не можете використовувати проклятий пісочний годинник.
items.artifacts.timekeepershourglass.onstasis=Світ, здається, вмить змінився навколо вас.
items.artifacts.timekeepershourglass.onfreeze=Все навколо вас раптом зупиняється.
items.artifacts.timekeepershourglass.stasis=Переміститись у стазис
items.artifacts.timekeepershourglass.freeze=Зупинити час навколо
items.artifacts.timekeepershourglass.prompt=Як би ви хотіли використати магію пісочного годинника?\n\nПід час стазису час рухається нормально, поки ви заморожені й абсолютно невразливі, споживає до 2 зарядів за раз.\n\nКоли час завмер, ви можете рухатися так, ніби ваші дії не потребують часу. Це можна деактивувати в будь-який час за допомогою пісочного годинника або атакуючи.
items.artifacts.timekeepershourglass.desc=Цей великий пісочний годинник виглядає досить невибагливо, але ви відчуваєте велику силу в його тонкій вирізаній рамі. Коли ви обертаєте пісочний годинник і спостерігаєте за потоком піску, ви можете відчути його магічну міць, безумовно, використання його магії дасть вам частковий контроль над часом.
items.artifacts.timekeepershourglass.desc_hint=Пісочний годинник, здається, втратив частину свого піску, якби ж знайти трохи ще ...
items.artifacts.timekeepershourglass.desc_cursed=Проклятий пісочний годинник причепився до вашого поясу, ви відчуваєте, як він намагається маніпулювати потоком часу навколо вас.
items.artifacts.timekeepershourglass$timefreeze.name=Час зупинився
items.artifacts.timekeepershourglass$timefreeze.desc=Навколо вас застигає час, що дозволяє виконувати дії миттєво. Ефект триватиме, поки його не буде скасовано або ваш пісочний годинник не розрядиться. Атака або використання магії також порушує цей ефект.\n\nХодів до закінчення заряду: %s.
items.artifacts.timekeepershourglass$sandbag.name=мішечок магічного піску
items.artifacts.timekeepershourglass$sandbag.levelup=Ви додаєте пісок до пісочного годинника.
items.artifacts.timekeepershourglass$sandbag.maxlevel=Ваш пісочний годинник наповнився чарівним піском!
items.artifacts.timekeepershourglass$sandbag.no_hourglass=У вас немає пісочного годинника, щоб якось використати цей пісок.
items.artifacts.timekeepershourglass$sandbag.desc=Цей невеликий мішечок з дрібним піском повинен відмінно працювати з вашим пісочним годинником.\n\nЗдається дивним, що крамар має цей конкретний товар прямо тоді, коли вам це потрібно ...

items.artifacts.unstablespellbook.name=хаотичний гримуар
items.artifacts.unstablespellbook.ac_read=ПРОЧИТАТИ
items.artifacts.unstablespellbook.ac_add=ДОДАТИ
items.artifacts.unstablespellbook.blinded=Ви не можете читати з гримуару, коли ви засліплені.
items.artifacts.unstablespellbook.no_charge=Ваш гримуар розряджений.
items.artifacts.unstablespellbook.cursed=Ви не можете читати з проклятого гримуару.
items.artifacts.unstablespellbook.prompt=Оберіть сувій
items.artifacts.unstablespellbook.infuse_scroll=Ви наділяєте гримуар силою сувою.
items.artifacts.unstablespellbook.unable_scroll=Ви не можете додати цей сувій до гримуару.
items.artifacts.unstablespellbook.unknown_scroll=Ви ще не знаєте, що це за сувій.
items.artifacts.unstablespellbook.desc=Цей Гримуар у підозріло хорошому стані, враховуючи його вік. Книга шипить та тріскотить, коли ви перелистуєте її сторінки та сяє нестабільною енергією. Ви не можете прочитати щось конкретне звідси.
items.artifacts.unstablespellbook.desc_cursed=Проклятий гримуар причепився до вашого поясу, він не дає вам прочитати більшість сувоїв.
items.artifacts.unstablespellbook.desc_index=Гримуар неповний. Зараз його зміст вказує на такі сторінки:
items.artifacts.unstablespellbook.desc_empowered=Сувої, які ви додали до гримуару, світяться таємничою силою. Ви зможете скористатися рідкісною версією їх ефектів, але ціною додаткового заряду.
items.artifacts.unstablespellbook.read_empowered=Ви додали цей сувій до гримуару. Тепер у вас є змога використати як звичайну, так і рідкісну його версію.\n\nРідкісна версія коштує 2 заряди замість одного.



###bags
items.bags.bag.name=рюкзак
items.bags.bag.discover_hint=Ви можете придбати цю річ у магазині.

items.bags.potionbandolier.name=пояс для зілля
items.bags.potionbandolier.desc=Цей великий ремінь перехрещується на ваших грудях, в ньому багато кишеньок, де досить зручно зберігати різноманітні зілля, ваш бурдюк або флакони з рідким металом.\n\nЗілля, які зберігаються в цьому поясі, захищені від холоду.

items.bags.scrollholder.name=Футляр для сувоїв
items.bags.scrollholder.desc=Цей трубчастий футляр виглядає так, ніби він створений для зберігання інструментів астронома, але він ідеально підходить для зберігання ваших сувоїв. Навіть є кілька бічних кишеньок, в які ідеально поміщаються магічні кристали, чаклунський грифель та магічна смола.\n\nФутляр виготовлений з негорючих матеріалів, тому ваші сувої не горітимуть всередині нього.

items.bags.velvetpouch.name=оксамитовий мішечок
items.bags.velvetpouch.desc=Невеликий оксамитовий мішечок може зберігати в собі крихітні предмети, такі як насіння, рунічні камені, і деякі алхімічні інгредієнти.
items.bags.velvetpouch.discover_hint=Один з героїв починає з цього предмета.

items.bags.magicalholster.name=Магічна кобура
items.bags.magicalholster.desc=Цей тонкий футляр зроблений з шкіри якогось магічного монстра й просочений дуже потужними чарами, які дозволяють йому зберігати в собі величезну кількість метальної зброї та жезлів.\n\nОпускаючи руку в футляр, ви завжди будете витягати саме той предмет, який ви шукали.\n\nЗавдяки магічній природі футляра, жезли заряджаються трохи швидше, а метальна зброя буде служити трохи довше, ніж звичайно.



###bombs
items.bombs.arcanebomb.name=Магічна бомба
items.bombs.arcanebomb.desc=Ця бомба була пронизана містичними властивостями. Він вибухне потужним вибухом, схожим на прокачану атаку Хлюпня, завдаючи, _%1$d-%2$d магічної шкоди_ до всього в межах 2 плиток.
items.bombs.arcanebomb.discover_hint=Ви можете створити цей предмет за допомогою алхімії.

items.bombs.bomb.name=Бомба
items.bombs.bomb.ac_lightthrow=ПІДПАЛИТИ І КИНУТИ
items.bombs.bomb.snuff_fuse=Ви швидко підпалили шнур бомби.
items.bombs.bomb.ondeath=Вибух убив вас...
items.bombs.bomb.rankings_desc=Вбитий вибухом
items.bombs.bomb.desc=Здоровенна чорна порохова бомба. Від цієї бомби спричиняє вибух, який завдає _%1$d-%2$d шкоди_ до будь-чого, що прилягає до нього, і знищить деяку прилеглу місцевість або предмети.
items.bombs.bomb.desc_fuse=Схоже, шнур горітиме декілька ходів після запалення.
items.bombs.bomb.desc_burning=Шнур бомби догорає, тримайтеся на відстані або загасіть його!
items.bombs.bomb$doublebomb.name=дві бомби
items.bombs.bomb$doublebomb.desc=Дві потужні бомби з чорним порохом, схоже, ви отримуєте одну задарма!

items.bombs.firebomb.name=Напалмова бомба
items.bombs.firebomb.desc=Ця бомба була модифікована, щоб вибухати на більшій території, завдаючи _%1$d-%2$d шкоди_ і розкидує напалмове полум’я в межах 2 плиток.
items.bombs.firebomb.discover_hint=Ви можете створити цей предмет за допомогою алхімії.

items.bombs.flashbangbomb.name=світлова граната
items.bombs.flashbangbomb.desc=Ця налаштована бомба вибухне світлом, звуком і електрикою, коли вибухне. Буде прийнято будь-що в межах 2 плиток отримає _%1$d-%2$d шкоди_ від вибуху ще 25%% шкоди від електрики та буде приголомшеним на 10 ходів.
items.bombs.flashbangbomb.discover_hint=Ви можете створити цей предмет за допомогою алхімії.

items.bombs.frostbomb.name=Морозяна бомба
items.bombs.frostbomb.desc=Ця бомба була модифікована, щоб вибухати на більшій території, завдаючи _%1$d-%2$d шкоди_ і поширюючи тривалий порив крижаного повітря в межах 2 плиток.
items.bombs.frostbomb.discover_hint=Ви можете створити цей предмет за допомогою алхімії.

items.bombs.holybomb.name=Освячена бомба
items.bombs.holybomb.desc=Ця бомба була модифікована, щоб під час вибуху спалахнути праведним світлом на більшій території. Все, що знаходиться в межах 2 плиток, отримає _%1$d-%2$d шкоди_ від вибуху, а нечисть або демонічні вороги отримають додаткові 50%% шкоди від праведного світла.
items.bombs.holybomb.discover_hint=Ви можете створити цей предмет за допомогою алхімії.

items.bombs.noisemaker.name=Шумова граната
items.bombs.noisemaker.desc=Ця бомба буде невпинно шуміти, коли її шнур догорить. Коли щось торкнеться бомби, вона вибухне і завдасть _%1$d-%2$d шкоди_ до всього в межах 2 плиток!
items.bombs.noisemaker.desc_burning=Шумова граната тріскотить, вона вибухне, коли щось наблизиться!
items.bombs.noisemaker.discover_hint=Ви можете створити цей предмет за допомогою алхімії.

items.bombs.smokebomb.name=димова бомба
items.bombs.smokebomb.desc=Ця бомба була модифікована, щоб викидати густу хмару газу одночасно з вибухом. Це завдасть _%1$d-%2$d шкоди_ і поширює огортаючий туман у межах 2 плиток.
items.bombs.smokebomb.discover_hint=Ви можете створити цей предмет за допомогою алхімії.

items.bombs.regrowthbomb.name=Життєдайна бомба
items.bombs.regrowthbomb.desc=Ця спеціально створена бомба виплесне життєдайну рідину всюди в межах 3 плиток, а не вибухне як інші. Площа, що потрапила у радіус дії, швидко проросте травою та рослинами. Ви та будь-які союзники, які були у радіусі дії, зціляться так ніби вони випили зілля зцілення.
items.bombs.regrowthbomb.discover_hint=Ви можете створити цей предмет за допомогою алхімії.

items.bombs.shrapnelbomb.name=Шрапнель
items.bombs.shrapnelbomb.desc=Ця бомба була модифікована за допомогою уламків металу ЗМ-300, який, коли вибухне, розірветься та розлетиться всюди завдаючи _%1$d-%2$d шкоди_ у величезному діапазоні навколо бомби. Вам краще сховатися за щось, коли це використовуєте...
items.bombs.shrapnelbomb.discover_hint=Ви можете створити цей предмет за допомогою алхімії.

items.bombs.woollybomb.name=Вовняна бомба
items.bombs.woollybomb.desc=Ця модифікована бомба створить широке поле магічних овець після вибуху. Вибух завдасть _%1$d-%2$d шкоди_ до будь-чого в межах 2 плиток. Ці вівці блокують рух і залишаються на дуже довгий час! Однак вівці не залишатимуться так надовго в присутності потужних ворогів, і можуть бути розвіяні вручну, взаємодіючи з ними.
items.bombs.woollybomb.discover_hint=Ви можете створити цей предмет за допомогою алхімії.

###food
items.food.berry.name=підземна ягода
items.food.berry.eat_msg=Яка смачна ягода!
items.food.berry.desc=Ця мала ягода знайдена мисливицею серед рослинності підземелля. Її можна швидко поглинути, що трохи втамує голод, та може принести корисну насінину!
items.food.berry.discover_hint=Ви можете знайти цей предмет за допомогою певної здібності героя.

items.food.blandfruit.name=піскофрукт
items.food.blandfruit.cooked=приготований піскофрукт
items.food.blandfruit.sunfruit=сонцефрукт
items.food.blandfruit.rotfruit=гнилофрукт
items.food.blandfruit.earthfruit=землефрукт
items.food.blandfruit.blindfruit=сліпофрукт
items.food.blandfruit.firefruit=вогнефрукт
items.food.blandfruit.icefruit=льодофрукт
items.food.blandfruit.fadefruit=варпофрукт
items.food.blandfruit.sorrowfruit=сумнофрукт
items.food.blandfruit.stormfruit=грозофрукт
items.food.blandfruit.dreamfruit=магофрукт
items.food.blandfruit.starfruit=зорефрукт
items.food.blandfruit.swiftfruit=стрімкофрукт
items.food.blandfruit.raw=Ви не в змозі примусити себе з'їсти його сирим.
items.food.blandfruit.desc=Ні запаху, ні смаку не має. Можливо, якщо його зварити з чимось, то він стане кращим?
items.food.blandfruit.desc_cooked=Плід набряк від замочування в горщику і навіть ввібрав властивості насіння, з яким його готували. Він матиме ефект того зілля, якому відповідало насіння.
items.food.blandfruit.desc_eat=На вигляд вже готове до вживання!
items.food.blandfruit.desc_throw=На вигляд доволі нестабільний. Можливо, краще його кинути?
items.food.blandfruit$chunks.name=шматки піскофрукту
items.food.blandfruit$chunks.desc=Піскофрукт вибухнув від удару, залишивши інертні шматки позаду.\n\nХоча і трохи забруднені, ці великі шматки вареного піскофрукта здаються абсолютно їстівними.

items.food.chargrilledmeat.name=смажене м'ясо
items.food.chargrilledmeat.desc=Схоже на непоганий стейк.
items.food.chargrilledmeat.discover_hint=Ви можете створити його за допомогою іншого харчового продукту.

items.food.food.name=сухпайок
items.food.food.ac_eat=ЇСТИ
items.food.food.eat_msg=Ця їжа була неперевершена!
items.food.food.desc=Нічого незвичайного: в'ялене м’ясо, печиво і так далі.

items.food.frozencarpaccio.name=заморожене м'ясо
items.food.frozencarpaccio.invis=Ви бачите, як ваші руки стають невидимими!
items.food.frozencarpaccio.hard=Ви відчуваєте, як ваша шкіра твердне!
items.food.frozencarpaccio.refresh=Освіжаюче!
items.food.frozencarpaccio.better=Ви відчуваете себе краще!
items.food.frozencarpaccio.desc=Шматок замороженого сирого м’яса. Єдиний спосіб його з'їсти -  це нарізати тонкими скибочками, і таким чином вже спожити. Воно на диво смачне.
items.food.frozencarpaccio.discover_hint=Ви можете створити його за допомогою іншого харчового продукту.

items.food.meatpie.name=м'ясний пиріг
items.food.meatpie.eat_msg=Ця їжа - прекрасна!
items.food.meatpie.desc=Делікатесний пиріг з пікантного м'яса. Цей пиріг наситить вас сильніше, ніж будь-яка інша їжа, яку можна знайти у підземеллі.
items.food.meatpie.discover_hint=Ви можете створити цей предмет за допомогою алхімії.

items.food.mysterymeat.name=загадкове м'ясо
items.food.mysterymeat.eat_msg=Їжа мала дивний смак.
items.food.mysterymeat.hot=Ой! Гаряче!
items.food.mysterymeat.legs=Ви не відчуваєте своїх ніг!
items.food.mysterymeat.not_well=Ви почуваєтесь не дуже добре.
items.food.mysterymeat.stuffed=Ви обжерлись.
items.food.mysterymeat.desc=Їжте на свій страх і ризик!
items.food.mysterymeat.discover_hint=Ви можете отримати цей предмет у вигляді трофею з певних ворогів.
items.food.mysterymeat$placeholder.name=м'ясо

items.food.phantommeat.name=фантомне м'ясо
items.food.phantommeat.desc=Великий блискучий напівпрозорий стейк, вирізаний з примарної піраньї. Це чарівне м’ясо не потребує варіння, воно надає низку захисних переваг, крім того, що повністю насичує вас. Коли його з’їсти, він надає невидимість, дубову шкіру, деяке зцілення та лікує багато шкідливих наслідків.
items.food.phantommeat.discover_hint=Ви можете отримати цей предмет у вигляді трофею з певних ворогів.

items.food.pasty.name=млинець
items.food.pasty.fish_name=риба на пару
items.food.pasty.amulet_name=амулет єндера?
items.food.pasty.egg_name=великоднє яйце
items.food.pasty.rainbow_name=веселкове зілля
items.food.pasty.shattered_name=зелений торт
items.food.pasty.pie_name=гарбузовий пиріг
items.food.pasty.vanilla_name=синій торт
items.food.pasty.cane_name=новорічний льодяник
items.food.pasty.sparkling_name=блискуче зілля
items.food.pasty.desc=Це смачний млинець з дрібно порубаним яловичим м'ясом, що може бути смачніше?
items.food.pasty.fish_desc=Ціла риба, приготована на пару, магічно збережена на зеленому ложі. Це традиція зберігати трохи риби на потім у цю пору року, тож ви залишите собі залишки, а не з’їште всю відразу.\n\nЗ Новим роком за місячним календарем!
items.food.pasty.amulet_desc=Ви нарешті знайшли його, магічний амулет - зачекайте хвилинку, це просто загорнута у фольгу шоколадка, яка виглядає як амулет! Це не дасть вам безмежної сили, але принаймні наситить вас і дасть вам невеликий заряд артефакту.\n\nЗ днем дурня!
items.food.pasty.egg_desc=Велике шоколадне яйце, загорнуте в барвисту жовту фольгу. Тут легко вистачить шоколаду, щоб вас наситити, а цукор може дати вашим артефактам трохи додаткового заряду.\n\nЩасливого Великодня!
items.food.pasty.rainbow_desc=Це барвисте зілля є різновидом рідкої їжі. Крім того, що воно втамовує ваш голод, у ньому є трохи магії, яка заспокоїть сусіднього ворога, який не є босом, змушуючи їх тимчасово вагатися, щоб битися з вами.\n\nЩасливого прайду!
items.food.pasty.shattered_desc=Цей великий шматок ванільного торту покритий кольоровою посипкою та зеленою глазуррю. Торт був зроблений, щоб відсвяткувати роки досвіду, і надасть невелику частину цього досвіду якщо його з'їсти.\n\nShattered Pixel Dungeon був вперше випущений 5 серпня 2014 року. З днем народження Shattered Pixel Dungeon!
items.food.pasty.pie_desc=Чудовий великий шматок гарбузового пирога. Його солодкий і пряний смак наповнить вас і трохи зцілить.\n\nВеселого хелловіну!
items.food.pasty.vanilla_desc=Цей великий шматок ванільного торту покритий кольоровою посипкою та синьою глазуррю. Торт був зроблений, щоб відсвяткувати роки досвіду, і надасть невелику частину цього досвіду якщо його з'їсти.\n\nОригінальний Pixel Dungeon був вперше випущений 4 грудня 2012 року. З днем народження, Pixel Dungeon!
items.food.pasty.cane_desc=Величезна цукрова цукерка. Вона достатньо велика, щоб вас наситити, а цукор також може трохи підбадьорити ваші палички.\n\nЩасливих свят!
items.food.pasty.sparkling_desc=Це блискуче зілля є видом рідкої їжі. Воно втамовує голод та симулює ігристе вино, але насправді не є алкогольним. Тепле відчуття у вашому животі надасть невелику кількість щиту.\n\nЗ Новим роком!
items.food.pasty$fishleftover.name=рибні залишки
items.food.pasty$fishleftover.eat_msg=Ця їжа була смачною.
items.food.pasty$fishleftover.desc=Трохи надлишку риби з вашого попереднього прийому їжі. Ви можете їсти його в будь-який час, щоб трохи насититься.

items.food.smallration.name=урізаний сухпайок
items.food.smallration.eat_msg=Непогано.
items.food.smallration.desc=Він схожий на стандартний сухпайок, але менший.
items.food.smallration.discover_hint=Ви можете придбати цю річ у магазині.

items.food.stewedmeat.name=тушковане м'ясо
items.food.stewedmeat.eat_msg=Непогано.
items.food.stewedmeat.desc=Тушкування м’яса очистило його від будь-яких захворювань або паразитів. Тепер це м'ясо  можна безпечно їсти.
items.food.stewedmeat.discover_hint=Ви можете створити цей предмет за допомогою алхімії.

items.food.supplyration.name=харчувальний пайок
items.food.supplyration.desc=Цей пайок був залишений у підземеллі від і для членів гільдії злодіїв. Він спеціально розроблений для споживання на ходу, і для допомоги із загальним шахрайством.\n\nХоча він не насичує так сильно, як звичайний пайок, його можна швидко з’їсти, він забезпечує невелике пряме зцілення та відновить один заряд Плаща Тіней Розбійника.
items.food.supplyration.discover_hint=Ви можете знайти цей предмет за допомогою певної здібності героя.



##journal items
items.journal.documentpage.name=вирвана сторінка
items.journal.documentpage.desc=Одинока сторінка, певно, вирвана з якоїсь книги. Вам потрібно підняти її, щоб прочитати.

items.journal.alchemypage.name=вирвана сторінка алхімічного довідника
items.journal.alchemypage.desc=Втрачена сторінка з алхімічного посібника.\n\nШрифт тексту занадто малий, щоб прочитати сторінку на відстані, але ви можете прочитати заголовок сторінки:\n\n_"%s"_

items.journal.guidebook.name=фоліант шукача пригод
items.journal.guidebook.hint_mobile=Ваш путівник має поради для вас! Торкніться блимаючої кнопки журналу у верхньому правому куті, щоб прочитати його.
items.journal.guidebook.hint_desktop=Ваш путівник має поради для вас! Натисніть блимаючу кнопку журналу (%s), вгорі праворуч, щоб прочитати його.
items.journal.guidebook.hint_status=Путівник
items.journal.guidebook.desc=Путівник шукача пригод, залишений тут тим, хто вирішив, що пригоди не для нього! Ця конкретна книга є магічною і може підказати шукачам пригод прочитати сторінку в потрібний момент.\n\nПопри цю функціональність, книга користується найбільшою популярністю через великі слова "Без паніки!", Написані великими доброзичливими буквами на обкладинці.

items.journal.guidepage.name=вирвана сторінка путівника
items.journal.guidepage.desc=Втрачена сторінка з книги путівника.\n\nШрифт тексту занадто малий,щоб прочитати сторінку на відстані, але ви можете прочитати заголовок сторінки:\n\n_"%s"_

items.journal.regionlorepage$sewers.name=пошарпаний лист
items.journal.regionlorepage$sewers.desc=Схоже на лист, написаний на брудному клаптику паперу. Вам треба підняти його, щоб розібрати, що на ньому написано.

items.journal.regionlorepage$prison.name=зношений запис зі щоденника
items.journal.regionlorepage$prison.desc=Запис зі щоденника, або схожий запис, написаний на старому клаптику паперу. Схоже, що він зберігся краще, ніж листи, що ви знайшли в каналізації, проте вам все одно треба підняти його, щоб прочитати.

items.journal.regionlorepage$caves.name=старий запис щоденника
items.journal.regionlorepage$caves.desc=Схоже на запис в щоденнику туриста, зберігся неочікувано добре, не зважаючи на вік. Підніміть, щоб прочитати.

items.journal.regionlorepage$city.name=іржава табличка
items.journal.regionlorepage$city.desc=Маленька іржава металева табличка з магічно викарбуваним повідомленням. Літери досі розбірливі, не зважаючи на вік таблички, проте вам треба її підняти, щоб прочитати.

items.journal.regionlorepage$halls.name=сяюча табличка
items.journal.regionlorepage$halls.desc=Маленька чорна табличка з карбованими осяяними зеленими літерами. Осяяні літери зливаються в туман з відстані, тому вам потрібно підняти її, щоб прочитати.


###keys
items.keys.goldenkey.name=золотий ключ
items.keys.goldenkey.desc=Зазубрини на цьому золотому ключі крихітні і хитромудрі. Можливо, цей ключ відкриє замкнену скриню?

items.keys.crystalkey.name=Кришталевий ключ
items.keys.crystalkey.desc=Гладенькі поверхні кришталевого ключа сяють у пітьмі. Можливо, він відкриє щось зроблене з кришталю?

items.keys.ironkey.name=залізний ключ
items.keys.ironkey.desc=Зазубрини на цьому старовинному залізному ключі сильно зношені; його шкіряний ремінець пошкоджений часом. Які двері він може відкрити?

items.keys.wornkey.name=зношений ключ
items.keys.wornkey.desc=Цей ключ зношений і потьмянілий, але виглядає солідно. Ймовірно, він може відкрити якісь важливі двері поблизу.



###potions
items.potions.potion.ac_drink=ПИТИ
items.potions.potion.turquoise=бірюзове зілля
items.potions.potion.crimson=багряне зілля
items.potions.potion.azure=лазурове зілля
items.potions.potion.jade=зелене зілля
items.potions.potion.golden=золотисте зілля
items.potions.potion.magenta=пурпурове зілля
items.potions.potion.charcoal=чорне зілля
items.potions.potion.ivory=біле зілля
items.potions.potion.amber=помаранчеве зілля
items.potions.potion.bistre=буре зілля
items.potions.potion.indigo=синє зілля
items.potions.potion.silver=сріблясте зілля
items.potions.potion.unknown_desc=Ця пляшечка містить булькотючу кольорову рідину. Цікаво, що буде, якщо випити її або кинути в когось?
items.potions.potion.harmful=Шкідливе зілля!
items.potions.potion.beneficial=Корисне зілля!
items.potions.potion.yes=Так, я розумію, що я роблю
items.potions.potion.no=Ні, я одумався
items.potions.potion.sure_drink=Ви впевнені, що хочете це випити? У більшості випадків такі зілля слід кидати у своїх ворогів.
items.potions.potion.sure_throw=Ви впевнені, що хочете його кинути? У більшості випадків його краще випити.
items.potions.potion.shatter=З розбитого флакона розтеклася безпечна рідина.
items.potions.potion.discover_hint=Ви можете знайти цей предмет випадково в підземеллі або виготовити його за допомогою алхімії.
items.potions.potion$placeholder.name=зілля
items.potions.potion$seedtopotion.name=Випадкове зілля

items.potions.potionofexperience.name=зілля Мудрості
items.potions.potionofexperience.desc=Екстракт накопиченого досвіду битв, ця рідка субстанція моментально підвищить рівень вашого досвіду.

items.potions.potionoffrost.name=зілля Морозу
items.potions.potionoffrost.desc=Хімічна речовина, що міститься в цій пляшці, при взаємодії з повітрям вступить у реакцію, під час якої все в радіусі ураження замерзне.

items.potions.potionofhaste.name=зілля Швидкості
items.potions.potionofhaste.energetic=Ви почуваєтесь переповненим енергією!
items.potions.potionofhaste.desc=Випивши цей солодкий відвар, ви відчуєте сильний приплив енергії, який дозволить вам бігати з підвищеною швидкістю.

items.potions.potionofhealing.name=зілля Зцілення
items.potions.potionofhealing.heal=Ваші рани загоюються.
items.potions.potionofhealing.desc=Ця настоянка швидко відновить ваше здоров'я і миттєво вилікує від багатьох недуг.

items.potions.potionofinvisibility.name=зілля Невидимості
items.potions.potionofinvisibility.invisible=Ви бачите, як ваші руки стають невидимими!
items.potions.potionofinvisibility.desc=Випивши це зілля, ви тимчасово станете невидимим. Поки ви невидимий, вороги не зможуть вас побачити. Фізичні атаки та магічні ефекти (такі як сувої та жезли) негайно скасовують невидимість.

items.potions.potionoflevitation.name=зілля Левітації
items.potions.potionoflevitation.float=Ви злітаєте у повітря!
items.potions.potionoflevitation.desc=Коли ви вип'єте цю цікаву рідину, то зможете зависати в повітрі, перелітаючи пастки та провалля. Якщо ви кинете це зілля, то воно створить хмару дурманного газу, дезорієнтуючи всіх, хто потрапив в неї.

items.potions.potionofliquidflame.name=зілля Рідкого полум’я
items.potions.potionofliquidflame.desc=Ця колба містить нестабільну сполуку, яка спалахне рідким полум’ям при контакті з відкритим  повітрям.

items.potions.potionofmindvision.name=зілля Ментального зору
items.potions.potionofmindvision.see_mobs=Ти відчуваєш присутність інших розумів!
items.potions.potionofmindvision.see_none=Ви відчуваєте, що ви зараз на цьому рівні одні.
items.potions.potionofmindvision.desc=Випивши це, ваш розум налаштується на психічні сигнали віддалених істот, що дозволить вам відчувати біологічну присутність крізь стіни. Також це зілля дозволить вам бачити крізь сусідні стіни та двері.

items.potions.potionofparalyticgas.name=зілля Паралітичного газу
items.potions.potionofparalyticgas.desc=При змішуванні з повітрям ця рідина утворить дивну жовту хмару. Кожен, хто вдихне цю суміш, буде паралізований миттєво, не маючи змоги рухатися деякий час навіть після того, як хмара розсіється. Цей предмет можна і треба кидати у ворогів.

items.potions.potionofpurity.name=зілля Освіження
items.potions.potionofpurity.freshness=Ви відчуваєте незвичну для підземелля свіжість.
items.potions.potionofpurity.protected=Захисна плівка оточує вас!
items.potions.potionofpurity.desc=Цей магічний реагент швидко нейтралізує всі шкідливі ефекти на великій території. Якщо його випити, то це дасть вам тимчасовий імунітет до таких ефектів.

items.potions.potionofstrength.name=зілля Сили
items.potions.potionofstrength.msg=У вашому тілі проливається нова сила, зараз ви маєте %d очок сили!
items.potions.potionofstrength.desc=Ця потужна рідина просякне твої м'язи, назавжди збільшуючи силу на 1.

items.potions.potionoftoxicgas.name=зілля Токсичного газу
items.potions.potionoftoxicgas.desc=Відкорковування або розбиття цієї запаяної ємності змусить її вміст вибухнути хмарою\nзеленого токсичного газу. Краще кинути це зілля у віддаленого ворога, ніж намагатися відкрити.



###brews
items.potions.brews.brew.discover_hint=Ви можете створити цей предмет за допомогою алхімії.

items.potions.brews.aquabrew.name=водне вариво
items.potions.brews.aquabrew.desc=У разі розбивання цей напій випустить на своєму місці вибух води під тиском. Його сили достатньо лише для того, щоб завдати шкоди вогненним ворогам, але він також розповсюджує воду на прилеглу місцевість, вимикає пастки, гасить пожежі та відкидає персонажів поблизу вибуху.

items.potions.brews.blizzardbrew.name=Крижана суміш
items.potions.brews.blizzardbrew.desc=Якщо розбити цю колбу, вона випустить заметіль, що швидко розповсюджуватиметься подібно до газу.

items.potions.brews.causticbrew.name=Роз'їдаюча суміш
items.potions.brews.causticbrew.desc=Ця суміш розповсюдить корозійну кислоту у широкій зоні навколо місця кидка. Все, що потрапило в цю зону, буде повільно плавитися, якщо не змиє кислоту водою.

items.potions.brews.infernalbrew.name=Пекельна суміш
items.potions.brews.infernalbrew.desc=Якщо розбити цю колбу, вона випустить пекельне полум'я, що швидко розповсюджуватиметься подібно до газу.

items.potions.brews.shockingbrew.name=Грозова суміш
items.potions.brews.shockingbrew.desc=Якщо розбити цю колбу, вона випустить великий електричний вихор навколо місця розбиття.

items.potions.brews.unstablebrew.name=нестабільне вариво
items.potions.brews.unstablebrew.desc=Це магічне вариво світиться мінливим веселковим кольором.\n\nКоли випите або кинуте, воно спричинить ефект випадкового зілля. Ефект зілля завжди буде корисним, якщо його випити, і завжди буде шкідливим, якщо його кинути.

###elixirs
items.potions.elixirs.elixir.discover_hint=Ви можете створити цей предмет за допомогою алхімії.

items.potions.elixirs.elixirofarcanearmor.name=настоянка містичного захисту
items.potions.elixirs.elixirofarcanearmor.desc=Ця настоянка надасть вам довготривалий опір магії, якщо її випити.

items.potions.elixirs.elixirofaquaticrejuvenation.name=настоянка водної регенерації
items.potions.elixirs.elixirofaquaticrejuvenation.desc=Ця настоянка містить залишки Хлюпня, посилені зіллям зцілення. Якщо випити це, то ви хоч і не отримаєте миттєвого відновлення, але будете відновлювати здоров'я при знаходженні у воді.
items.potions.elixirs.elixirofaquaticrejuvenation$aquahealing.name=воднe лікування
items.potions.elixirs.elixirofaquaticrejuvenation$aquahealing.desc=Ви тимчасово наділені регенеративними здібностями Хлюпня.\n\nКоли ви стоїте в воді, ви відновлюватимете невелику кількість здоров'я за один хід. Цей ефект призупиняється, якщо ви вже повністю здорові або вийшли з води..\n\nЛікування залишилось: %d.

items.potions.elixirs.elixirofdragonsblood.name=настоянка драконячої крові
items.potions.elixirs.elixirofdragonsblood.desc=Будучи випитою, ця настоянка дарує вам силу вогню. Цей ефект надасть імунітет до вогню і дозволить  підпалювати ворогів при фізичних атаках.

items.potions.elixirs.elixiroffeatherfall.name=настоянка легкого падіння
items.potions.elixirs.elixiroffeatherfall.light=Ви відчуваєте себе легким, як пір'їнка!
items.potions.elixirs.elixiroffeatherfall.desc=Ця настоянка пропонує слабший, але більш контрольований ефект левітації, дозволяючи людині, яка п’є, падати на великі відстані без шкоди на деякий час.
items.potions.elixirs.elixiroffeatherfall$featherbuff.name=сповільнене падіння
items.potions.elixirs.elixiroffeatherfall$featherbuff.desc=Ви перебуваєте під дією настоянки легкого падіння, яка дозволяє вам впасти в прірву, не отримавши пошкоджень!\nЗалишилося ходів:%s.

items.potions.elixirs.elixirofhoneyedhealing.name=настоянка цілющого меду
items.potions.elixirs.elixirofhoneyedhealing.desc=Ця настоянка поєднує в собі цілющий ефект і солодкість меду. Якщо його випити, воно застосує той самий ефект, що й зілля зцілення, і трохи втамує голод, але його також можна кинути, щоб зцілити союзника.\n\nІстоти, що полюбляють мед, можуть перейти на вашу сторону, якщо кинути у них це.

items.potions.elixirs.elixiroficytouch.name=настоянка крижаного дотику
items.potions.elixirs.elixiroficytouch.desc=Будучи випитою, ця настоянка надасть вам силу холоду. Цей ефект зробить вас невразливим до холоду та дозволить заморожувати ворогів при фізичних атаках.

items.potions.elixirs.elixirofmight.name=настоянка могутності
items.potions.elixirs.elixirofmight.msg=У вашому тілі проливається нова сила, зараз ви маєте %d очок сили!
items.potions.elixirs.elixirofmight.desc=Будучи випитою, ця настоянка збільшить вашу силу та додатково підвищить ваше максимальне здоров'я на %d . Набуте додаткове здоров'я пропорційне вашому максимальному, але з кожним новим рівнем буде зменшуватись,
items.potions.elixirs.elixirofmight$htboost.name=максимальне підвищення здоров'я
items.potions.elixirs.elixirofmight$htboost.desc=Ви відчуваєте, що ваше тіло наповнилося неприродною силою та здоров'ям.\n\nВи отримали додаткове здоров'я на обмежений період часу. Коли ви підвищуєте свій рівень, покращення буде поступово слабнути.\n\nЗдоров'я збільшено на: %d.\nРівнів залишилося: %d.

items.potions.elixirs.elixiroftoxicessence.name=настоянка отруйної крові
items.potions.elixirs.elixiroftoxicessence.desc=Будучи випитою, ця настоянка наповнить вас токсичною енергією. Людина, яка його п’є, постійно поширюватиме токсичний газ, рухаючись, і матиме імунітет до токсичного газу та отрути трохи довше, ніж тривалість ефекту.



###exotic potions
items.potions.exotic.exoticpotion.turquoise=рідкісне бірюзове зілля
items.potions.exotic.exoticpotion.crimson=рідкісне багряне зілля
items.potions.exotic.exoticpotion.azure=рідкісне лазурове зілля
items.potions.exotic.exoticpotion.jade=рідкісне зелене зілля
items.potions.exotic.exoticpotion.golden=рідкісне золотисте зілля
items.potions.exotic.exoticpotion.magenta=рідкісне пурпурове зілля
items.potions.exotic.exoticpotion.charcoal=рідкісне чорне зілля
items.potions.exotic.exoticpotion.ivory=рідкісне біле зілля
items.potions.exotic.exoticpotion.amber=рідкісне бурштинове зілля
items.potions.exotic.exoticpotion.bistre=рідкісне буре зілля
items.potions.exotic.exoticpotion.indigo=рідкісне індигове зілля
items.potions.exotic.exoticpotion.silver=рідкісне сріблясте зілля
items.potions.exotic.exoticpotion.unknown_desc=Ця кругла колба містить неоднорідну барвисту рідину. Воно виглядає незвичним для цього місця, хтозна, що станеться, якщо це випити чи кинути.
items.potions.exotic.exoticpotion.warning=Ви дійсно хочете скасувати використання цього зілля? Воно все одно буде спожито.
items.potions.exotic.exoticpotion.yes=Так, я впевнений.
items.potions.exotic.exoticpotion.no=Ні, я передумав
items.potions.exotic.exoticpotion.discover_hint=Ви можете створити цей предмет за допомогою алхімії.

items.potions.exotic.potionofcleansing.name=зілля Очищення
items.potions.exotic.potionofcleansing.desc=Той, хто вип'є цей потужний реагент, стане невразливим від всіх негативних ефектів статусу на декілька ходів. Також можна кинути його в ціль, щоб очистити її.
items.potions.exotic.potionofcleansing$cleanse.name=очищений
items.potions.exotic.potionofcleansing$cleanse.desc=Цей персонаж тимчасово невразливий до всіх шкідливих ефектів статусу!\n\nЗалишилося ходів: %s.

items.potions.exotic.potionofcorrosivegas.name=зілля Корозійного газу
items.potions.exotic.potionofcorrosivegas.desc=Відкоркування або руйнування цієї посудини призведе до того, що його запресований під великим тиском вміст вибухне смертельною хмарою корозійного газу іржавого кольору. Цей газ розповсюджується швидше, ніж токсичний, проте і не триматиметься в повітрі так довго.

items.potions.exotic.potionofdragonsbreath.name=зілля Драконячого подиху
items.potions.exotic.potionofdragonsbreath.prompt=Виберіть місце для підпалу
items.potions.exotic.potionofdragonsbreath.desc=Ця колба містить незвичайну сполуку, яка спалахне полум'ям після змішування зі слиною. Швидке спльовування рідини дозволить вам в прямому сенсі видихати вогонь!

items.potions.exotic.potionofearthenarmor.name=зілля земного захисту
items.potions.exotic.potionofearthenarmor.desc=Замість того, щоб вас паралізувати, ця дивна рідина впливає на шкіру, змушуючи її загрубіти, що дасть вам тимчасовий природний захист.

items.potions.exotic.potionofdivineinspiration.name=зілля Небесного дару
items.potions.exotic.potionofdivineinspiration.no_more_points=Ви не можете отримати більше бонусних очок таланту.
items.potions.exotic.potionofdivineinspiration.select_tier=Оберіть ряд талантів, в якому хочете отримати два бонусних очки. Цей ряд має бути розблокованим, щоб мати можливість витратити очки.
items.potions.exotic.potionofdivineinspiration.bonus=+2 очки таланту!
items.potions.exotic.potionofdivineinspiration.desc=Цей напій, що є втіленням святої енергії в рідкій формі, наділяє того, хто його вип'є, божественною силою, даруючи йому два додаткові пункти таланту в обраному ним рівні.\n\nЦе зілля можна використовувати тільки один раз для кожного рівня таланту.

items.potions.exotic.potionofmagicalsight.name=зілля Магічного зору
items.potions.exotic.potionofmagicalsight.desc=Випивши це, ваші відчуття тимчасово загостряться до неймовірного рівня, дозволяючи вам бачити крізь стіни в радіусі 12 плиток!

items.potions.exotic.potionofmastery.name=зілля Майстерності
items.potions.exotic.potionofmastery.prompt=Стати майстром з предметом
items.potions.exotic.potionofmastery.weapon_easier=Ваша зброя стає легшою для використання!
items.potions.exotic.potionofmastery.armor_easier=Ваш обладунок стає легшим для носіння!
items.potions.exotic.potionofmastery.desc=Це зілля не надає грубої сили, а натомість налаштовує м'язи того, хто його вживає, на певний предмет. Це полегшує користування цим предметом, ніби той, хто випив зілля, практикувався з ним і розвинув м'язову пам'ять.\n\nОбрана зброя або обладунки вимагатимуть на 2 пункти сили менше для використання. Це зілля можна використати лише раз на кожному предметі.

items.potions.exotic.potionofshielding.name=зілля Захисту
items.potions.exotic.potionofshielding.desc=Замість того, щоб лікувати, це зілля створює навколо тіла користувача міцний захисний щит, який блокує значну частину шкоди.

items.potions.exotic.potionofshroudingfog.name=зілля Густого туману
items.potions.exotic.potionofshroudingfog.desc=Піддаючись впливу повітря, рідина в цій колбі утворюватиме густий димчастий туман, який швидко розповсюджується і блокує зір ваших ворогів.

items.potions.exotic.potionofsnapfreeze.name=зілля Миттєвого замороження
items.potions.exotic.potionofsnapfreeze.desc=Хімічна речовина, що міститься в цьому зіллі, швидко реагує з повітрям, миттєво заморожуючи і знерухомлюючи все, що потрапляє під її дію.

items.potions.exotic.potionofstamina.name=зілля Витривалості
items.potions.exotic.potionofstamina.desc=Випивши цю дивно солодку рідину, у вас з'явиться довготривалий приплив енергії, що дозволить вам бігати в швидкому темпі протягом тривалого періоду часу.

items.potions.exotic.potionofstormclouds.name=зілля Дощових хмар
items.potions.exotic.potionofstormclouds.desc=Кинувши це зілля, ви створите швидко поширювану хмару концентрованого пару, яка конденсується і виллється на навколишнє середовище. Більша частина місцевості перетвориться на воду, вогняні вороги отримають ушкодження, вогонь буде погашений, а пастки будуть переповнені і зламані.



###quest items
items.quest.ceremonialcandle.name=церемоніальна свічка
items.quest.ceremonialcandle.desc=Кілька свічок, які сплавилися в єдине ціле через тривале використання.\n\nВони нічого не варті поодинці, але, якщо їх виставити у певному порядку, вони можуть зосередити енергію для ритуалу виклику.
items.quest.ceremonialcandle.discover_hint=Ви можете знайти цей предмет під час виконання певного завдання.

items.quest.corpsedust.name=трупний прах
items.quest.corpsedust.chill=Холод пронизує вашу спину.
items.quest.corpsedust.desc=Дрібка трупного праху зовні нічим не вирізняється від будь-якої іншої тліні, але згубна сила, що таїться в ній, вам відчутна.\n\nПозбутися від неї якнайшвидше — чи не найліпша думка.
items.quest.corpsedust.discover_hint=Ви можете знайти цей предмет під час виконання певного завдання.

items.quest.darkgold.name=руда темного золота
items.quest.darkgold.you_now_have=Зараз ви маєте %d руди темного золота.
items.quest.darkgold.desc=Цей метал називається темним не через колір (він не відрізняється від кольору звичайного золота), а тому, що він плавиться під сонячним світлом, що робить його непридатним для використання на поверхні.
items.quest.darkgold.discover_hint=Ви можете знайти цей предмет під час виконання певного завдання.

items.quest.dwarftoken.name=дварфський жетон
items.quest.dwarftoken.desc=Багато дварфів а також деякі їх творіння носять ці маленькі шматочки металу невідомого призначення. Можливо, це ювелірні вироби, чи, можливо, якесь посвідчення особи. Дварфи - дивний народ.
items.quest.dwarftoken.discover_hint=Ви можете знайти цей предмет під час виконання певного завдання.

items.quest.embers.name=жарина стихійника
items.quest.embers.desc=Особлива жарина, яку можна отримати лише з молодих вогняних стихійників. Воно й досі випромінює тепло.
items.quest.embers.discover_hint=Ви можете знайти цей предмет під час виконання певного завдання.

items.quest.escapecrystal.name=кристал втечі
items.quest.escapecrystal.ac_use=ВИКОРИСТАТИ
items.quest.escapecrystal.desc=Тонкий магічний кристал, який, здається, містить магію телепортації. Ви можете використовувати кристал у будь-який час, щоб покинути сховище гномів, але ви не зможете нічого взяти з собою!
items.quest.escapecrystal.discover_hint=Ви можете знайти цей предмет під час виконання певного завдання.

items.quest.gooblob.name=слизька крапля
items.quest.gooblob.desc=Пружна та слизька густа крапля, яка лишилася від переможеного хлюпня. Вона подібна на велику кульку желе, хоч ви і не наважитеся її з'їсти.\n\nСам по собі цей згусток не несе ніякої користі, але його можна поєднати з певним зіллям або бомбою. Врешті-решт його можна перетворити на пристойну кількість енергії.
items.quest.gooblob.discover_hint=Ви можете отримати цей предмет у вигляді трофею з певних ворогів.

items.quest.metalshard.name=проклятий металевий уламок
items.quest.metalshard.desc=Уламок іржавого проклятого металу, який лишився від ЗМ-300. Ви відчуваєте в ньому сплячу зловісну магію. Сам по собі цей шматок не має ніякої користі, але його можна поєднати з певним сувоєм чи навіть з бомбою. На всяк випадок його можна перетворити в непогану кількість енергії.
items.quest.metalshard.discover_hint=Ви можете отримати цей предмет у вигляді трофею з певних ворогів.

items.quest.pickaxe.name=Кайло
items.quest.pickaxe.ability_name=пробити
items.quest.pickaxe.ability_desc=Дуелянт може _пронизати_ ворога кайлом. Це гарантовано вражає, застосовує вразливість на 3 ходи і завдає _%1$d-%2$d шкоди_ ворогам із твердою шкірою.
items.quest.pickaxe.upgrade_ability_stat_name=Навички ураження
items.quest.pickaxe.desc=Це міцний і важкий інструмент для руйнування каменів. Вам не потрібно використовувати кирку, щоб добувати нею, але її, ймовірно, можна використовувати як зброю.
items.quest.pickaxe.discover_hint=Ви можете знайти цей предмет під час виконання певного завдання.

items.quest.ratskull.name=череп гігантського щура
items.quest.ratskull.desc=На диво великий череп щура. Він був би чудовим мисливським трофеєм, якби у вас була стіна, на яку його можна було б повісити.



###remains
items.remains.remainsitem.ac_use=ВИКОРИСТАТИ
items.remains.remainsitem.discover_hint=Ви можете знайти цей предмет в останках певного героя з попереднього програного забігу.

items.remains.bowfragment.name=фрагмент лука
items.remains.bowfragment.desc=Цей уламок дерева колись був частиною втраченого духового лука Мисливиці. Ви все ще можете відчути трохи енергії природи, що залишилася у фрагменті, ви можете використати фрагмент, щоб виростити навколо себе високу траву. Однак це знищить фрагмент.

items.remains.brokenhilt.name=зламане руків'я
items.remains.brokenhilt.desc=Схоже, це зламане руків'я походить від зброї переможеної дуелянтки. Ви все ще можете відчути трохи бойової сили, що залишилася в руків'ї, ви можете використати це, щоб отримати невелику додаткову шкоду під час наступних двох ударів ближнього бою. Однак це знищить руків'я.

items.remains.brokenstaff.name=зламаний посох
items.remains.brokenstaff.desc=Посох цього мага був зламаний навпіл після того, як його власник зустрів смерть. Ви все ще можете відчути деяку магічну енергію, що залишилася в посоху, ви можете використовувати її, щоб трохи підвищити заряд своїх чарівних паличок. Однак це знищить посох.

items.remains.cloakscrap.name=клаптик тканини
items.remains.cloakscrap.desc=Цей клаптик напівпрозорої тканини виглядає так, ніби він був зроблений із останнього плаща тіней розбійника. Ви все ще відчуваєте, що в ньому залишилося трохи містичної енергії та можете використовувати її, щоб трохи підвищити заряд своїх артефактів. Однак це призведе до руйнування тканини.

items.remains.sealshard.name=уламки печатки
items.remains.sealshard.desc=Ці крихітні уламки червоного воску схожі на печатку загиблого воїна. Ви все ще відчуваєте, як сила волі чіпляється за печатку, ви можете використовувати її, щоб трохи захистити себе. Однак це знищить уламки печатки.

items.remains.tornpage.name=вирвана сторінка
items.remains.tornpage.desc=Ця сторінка виглядає так, ніби її вирвали зі старого священного фоліанта священника. На ній ще залишилося трохи божественної енергії, ви можете використати її, щоб відновити трохи здоров'я. Однак це знищить вирвану сторінку.



###rings
items.rings.ring.diamond=діамантовий перстень
items.rings.ring.opal=опаловий перстень
items.rings.ring.garnet=гранатовий перстень
items.rings.ring.ruby=рубіновий перстень
items.rings.ring.amethyst=аметистовий перстень
items.rings.ring.topaz=перстень з топазом
items.rings.ring.onyx=оніксовий перстень
items.rings.ring.tourmaline=турмаліновий перстень
items.rings.ring.emerald=смарагдовий перстень
items.rings.ring.sapphire=сапфіровий перстень
items.rings.ring.quartz=кварцовий перстень
items.rings.ring.agate=агатовий перстень
items.rings.ring.equip_cursed=Перстень боляче стиснув ваш палець!
items.rings.ring.unknown_desc=Цей металевий перстень прикрашений великим каменем, який виблискує у темряві. Хто знає, який ефект він має, якщо його одягти?
items.rings.ring.known=Це  %s
items.rings.ring.identify=Ви достатньо знайомі з вашим перснем, щоб його розпізнати.
items.rings.ring.cursed_worn=Оскільки цей перстень проклятий, ти не в змозі його зняти.
items.rings.ring.curse_known=У цьому персні відчувається злісна магія.
items.rings.ring.not_cursed=Цей перстень вільний від злих чарів.

items.rings.ringofaccuracy.name=Перстень точності
items.rings.ringofaccuracy.stats=При носінні цей перстень підвищить вашу точність на _%s%%._
items.rings.ringofaccuracy.typical_stats=При носінні цей перстень зазвичай підвищує вашу точність на _%s%%._
items.rings.ringofaccuracy.combined_stats=Ваші споряджені персні поєднують свою потужність, підвищуючи вашу точність на _%s%%_ загалом.
items.rings.ringofaccuracy.upgrade_stat_name_1=Посилення точності
items.rings.ringofaccuracy.desc=Цей перстень підвищує вашу концентрацію, завдяки чому ваші атаки легше влучають у ціль. Проклятий перстень, навпаки, ускладнює влучання ваших атак.

items.rings.ringofarcana.name=перстень містики
items.rings.ringofarcana.stats=Будучи надягнутим, цей перстень покращуватиме силу зачарувань та рун на _%s%%._
items.rings.ringofarcana.typical_stats=Будучи надягнутим, цей перстень зазвичай покращуватиме силу зачарувань та рун на _%s%%._
items.rings.ringofarcana.combined_stats=Ваші споряджені персні поєднують свою силу, збільшуючи силу зачарувань і рун на _%s%%_ загалом.
items.rings.ringofarcana.upgrade_stat_name_1=Посилення магічної сили
items.rings.ringofarcana.desc=Цей перстень підсилює магічні чари на зброї та руни на обладунку, включно з прокляттями! Спочатку це збільшує шанс активації, а потім збільшує силу ефекту, щойно шанс активації досягає 100%. Натомість проклятий перстень послабить чари, руни і прокляття.

items.rings.ringofelements.name=Перстень елементів
items.rings.ringofelements.stats=Будучи надягнутим, цей перстень надасть _%s%%_ опору стихіям.
items.rings.ringofelements.typical_stats=Будучи надягнутим, цей перстень зазвичай надаватиме _%s%%_ опору стихіям.
items.rings.ringofelements.combined_stats=Ваші споряджені персні поєднують свою силу, забезпечуючи _%s%%_ елементальний опір загалом.
items.rings.ringofelements.upgrade_stat_name_1=Опір
items.rings.ringofelements.desc=Цей перстень забезпечує опір більшості стихійних та магічних ефектів, знижуючи отримувані пошкодження та тривалість негативного ефекту. Зрозуміло, що проклятий перстень навпаки посилить ці ефекти.

items.rings.ringofenergy.name=Перстень енергії
items.rings.ringofenergy.stats=Будучи надягнутим, цей перстень збільшить швидкість заряду жезлів, артефактів і героїчного обладунку на _%s%%._
items.rings.ringofenergy.typical_stats=Будучи надягнутим, цей перстень зазвичай збільшує швидкість заряду жезлів, артефактів і героїчного обладунку на _%s%%._
items.rings.ringofenergy.combined_stats=Ваші споряджені персні поєднують свою потужність, збільшуючи швидкість заряджання на _%s%%_ загалом.
items.rings.ringofenergy.upgrade_stat_name_1=Посилення заряду
items.rings.ringofenergy.desc=Ваше магічне спорядження буде швидше заряджатися у чаклунській аурі цього персня. Проклятий перстень навпаки уповільнить їх перезарядку.

items.rings.ringofevasion.name=Перстень ухилення
items.rings.ringofevasion.stats=Будучи надягнутим, цей перстень підвищить ваше ухилення на _%s%%._
items.rings.ringofevasion.typical_stats=Будучи надягнутим, цей перстень зазвичай підвищуватиме ваше ухилення на _%s%%._
items.rings.ringofevasion.combined_stats=Ваші споряджені персні поєднують свою силу, збільшуючи ваше ухилення на _%s%%_ загалом.
items.rings.ringofevasion.upgrade_stat_name_1=Посилення ухилення
items.rings.ringofevasion.desc=Цей перстень покращує реакцію, через що ворогам важче влучити у вас . Проклятий перстень, натомість, полегшить їм цю задачу.

items.rings.ringofforce.name=перстень сили
items.rings.ringofforce.stats=Якщо ви б'єтеся беззбройними, за вашої поточної сили, з цим перснем ви наноситимете _%1$d-%2$d шкоди за удар. _  Якщо ви носите зброю, то її пошкодження збільшаться на  _%3$d._
items.rings.ringofforce.typical_stats=Якщо ви б'єтеся беззбройними, за вашої поточної сили, з цим перснем ви зазвичай наноситимете _%1$d-%2$d шкоди за удар._ Якщо ви носите зброю, то її пошкодження збільшаться на _%3$d._
items.rings.ringofforce.combined_stats=Ваші споряджені персні поєднують свою силу, завдаючи загальну суму _%1$d-%2$d ушкодження_ без зброї або збільшення шкоди на _%3$d_ з одним.
items.rings.ringofforce.upgrade_stat_name_1=Беззбройне пошкодження
items.rings.ringofforce.upgrade_stat_name_2=Посилення шкоди від зброї
items.rings.ringofforce.upgrade_stat_name_3=Навички ураження
items.rings.ringofforce.ability_name=бойова стійка
items.rings.ringofforce.typical_ability_desc=Дуелянт може стати в _бойову стійку_ за допомогою цього персня. Поки вона перебуває в стійці, її звичайні атаки використовуватимуть цей перстень навіть зі зброєю. Вони будуть наносити _%1$d-%2$d шкоди_ й успадкують зачарування та посилення зброї. Ця стійка сповільнює перезарядження зброї на 50%%.
items.rings.ringofforce.ability_desc=Дуелянт може стати в _бойову стійку_ за допомогою цього персня. Поки вона перебуває в стійці, її звичайні атаки використовуватимуть цей перстень навіть зі зброєю. Вони будуть наносити _%1$d-%2$d шкоди_ й успадкують зачарування та посилення зброї. Ця стійка сповільнює перезарядження зброї на 50%%.
items.rings.ringofforce.desc=Цей перстень посилює силу ударів власника в ближньому бою. Ця додаткова сила досить слабка при використанні зброї, але беззбройна атака стане набагато сильнішою. Проклятий перстень, навпаки, послаблює удари власника.
items.rings.ringofforce$brawlersstance.name=бойова стійка
items.rings.ringofforce$brawlersstance.desc=У цій стійці звичайні атаки дуелянта будуть використовувати одягнутий перстень імпульсу, навіть якщо у неї є зброя. Ці атаки отримують додаткову шкоду та все ще використовують посилення та зачарування зброї.\n\nОднак підтримання цієї стійки потребує зосередження, зменшуючи швидкість перезарядки здатності зброї на 50%.\n\nЦю стійку можна вмикати або вимикати за допомогою персня сили, але зниження швидкості заряду триватиме деякий час, якщо стійку швидко активувати та деактивувати.

items.rings.ringoffuror.name=Перстень гніву
items.rings.ringoffuror.stats=Будучи надягнутим, цей перстень покращуватиме вашу швидкість атаки на _%s%%._
items.rings.ringoffuror.typical_stats=Будучи надягнутим, цей перстень зазвичай покращуватиме вашу швидкість атаки на _%s%%._
items.rings.ringoffuror.combined_stats=Ваші споряджені персні поєднують свою силу, збільшуючи швидкість ваших атак на _%s%%_ загалом.
items.rings.ringoffuror.upgrade_stat_name_1=Посилення швидкості атаки
items.rings.ringoffuror.desc=Цей перстень вивільняє ваш внутрішній гнів, через що ви можете наносити атаки швидше, ніж зазвичай. Проклятий перстень матиме зворотній ефект.

items.rings.ringofhaste.name=Перстень швидкості
items.rings.ringofhaste.stats=Будучи надягнутим, цей перстень покращуватиме вашу швидкість руху на _%s%%._
items.rings.ringofhaste.typical_stats=Будучи надягнутим, цей перстень зазвичай покращуватиме вашу швидкість руху на _%s%%._
items.rings.ringofhaste.combined_stats=Ваші споряджені персні поєднують свою силу, збільшуючи вашу швидкість руху на _%s%%_ загалом.
items.rings.ringofhaste.upgrade_stat_name_1=Прискорення швидкості руху
items.rings.ringofhaste.desc=Цей перстень зменшує навантаження при переміщенні, що дозволяє рухатись швидше, ніж зазвичай. Проклятий перстень матиме зворотній ефект.

items.rings.ringofmight.name=Перстень могутності
items.rings.ringofmight.stats=Будучи надягнутим, цей перстень підвищить вашу силу на _%1$d_ і ваше максимальне здоров'я на _%2$s %%._
items.rings.ringofmight.typical_stats=Будучи надягнутим, цей перстень зазвичай покращуватиме вашу силу на _%1$d і ваше максимальне здоров'я на _%2$s%%._
items.rings.ringofmight.combined_stats=Ваші споряджені персні поєднують свою силу, збільшуючи вашу силу на _%1$d_ та максимальне здоров'я на _%2$s%%_ загалом.
items.rings.ringofmight.upgrade_stat_name_1=Підвищення сили
items.rings.ringofmight.upgrade_stat_name_2=Покращення макс здоров'я
items.rings.ringofmight.desc=Цей перстень посилює ваші фізичні здібності, через що ваша сила та здоров'я підвищиться. Проклятий перстень матиме зворотній ефект.

items.rings.ringofsharpshooting.name=Перстень стрільця
items.rings.ringofsharpshooting.stats=Будучи надягнутим, цей перстень підвищуватиме шкоду від метальної зброї, наче вони матимуть рівень вищий на _%1$d_ та посилить їх міцність на _%2$s%%._
items.rings.ringofsharpshooting.typical_stats=Будучи надягнутим, цей перстень зазвичай підвищуватиме шкоду від метальної зброї, наче вони матимуть рівень вищий на _%1$d_ та посилить їх міцність на _%2$s%%._
items.rings.ringofsharpshooting.combined_stats=Ваші споряджені персні поєднують свою силу, підвищуючи рівень ефективної метальної зброї на _%1$d_ і підвищення їх довговічності на _%2$s%%_ загалом.
items.rings.ringofsharpshooting.upgrade_stat_name_1=Посилення рівня шкоди
items.rings.ringofsharpshooting.upgrade_stat_name_2=Посилення міцності
items.rings.ringofsharpshooting.desc=Цей перстень покращує вашу концентрацію та точність, через що кинута вами метальна зброя буде наносити більші пошкодження та буде довше служити вам. Проклятий перстень матиме зворотній ефект.

items.rings.ringoftenacity.name=Перстень стійкості
items.rings.ringoftenacity.stats=Будучи надягнутим, цей перстень зменшуватиме отримувану шкоду на _%s%%._
items.rings.ringoftenacity.typical_stats=Будучи надягнутим, цей перстень зазвичай зменшуватиме отримувану шкоду на _%s%%._
items.rings.ringoftenacity.combined_stats=Ваші споряджені персні поєднують свою силу, зменшуючи завдану вами шкоду на _%s%%_ загалом.
items.rings.ringoftenacity.upgrade_stat_name_1=Максимальна стійкість до пошкоджень
items.rings.ringoftenacity.desc=При носінні цього персня, ви зможете пережити зазвичай смертельні атаки. Чим менше у вас здоров'я, тим сильніше буде проявлятися цей ефект. Проклятий перстень, навпаки, дасть змогу монстрам значно легше вас вбити.

items.rings.ringofwealth.name=Перстень удачі
items.rings.ringofwealth.stats=Будучи надягнутим, цей перстень покращить вашу удачу на _%s%%._
items.rings.ringofwealth.typical_stats=Будучи надягнутим, цей перстень зазвичай покращуватиме вашу удачу на _%s%%._
items.rings.ringofwealth.combined_stats=Ваші споряджені персні поєднують свою силу, збільшуючи вашу удачу на _%s%%_ загалом.
items.rings.ringofwealth.upgrade_stat_name_1=Підвищення удачі
items.rings.ringofwealth.desc=Цей перстень працює як магніт для скарбів ,збільшуючи вірогідність того, що вороги та контейнери матимуть цінні предмети. Проклятий перстень, навпаки, зменшить ваші шанси на отримання здобичі.



###scrolls
items.scrolls.scroll.ac_read=ПРОЧИТАТИ
items.scrolls.scroll.kaunan=сувій КАУНАН
items.scrolls.scroll.sowilo=сувій СОВІЛО
items.scrolls.scroll.laguz=сувій ЛАҐУЗ
items.scrolls.scroll.yngvi=сувій ІНГВІ
items.scrolls.scroll.gyfu=сувій ГІФУ
items.scrolls.scroll.raido=сувій РАЙДО
items.scrolls.scroll.isaz=сувій ІСА
items.scrolls.scroll.mannaz=сувій МАННАЗ
items.scrolls.scroll.naudiz=сувій НАУТІЗ
items.scrolls.scroll.berkanan=сувій БЕРКАНАН
items.scrolls.scroll.odal=сувій ОДАЛ
items.scrolls.scroll.tiwaz=сувій ТЕЙВАЗ
items.scrolls.scroll.unknown_desc=На цьому пергаменті написана якась нерозбірлива магічна руна. Хто знає, що буде, якщо прочитати вголос?
items.scrolls.scroll.blinded=Ти не можеш прочитати сувій, будучи засліпленим!
items.scrolls.scroll.no_magic=Ви не можете прочитати сувій, допоки на вас діє імунітет до магії.
items.scrolls.scroll.cursed=Ваш проклятий гримуар заважає вам використати магію цього сувою! Лише сувій очищення матиме достатньо сили, щоб знищити темну силу прокляття...
items.scrolls.scroll$placeholder.name=сувій

items.scrolls.inventoryscroll.warning=Ви справді бажаєте скасувати використання цього сувою? Сувій не було раніше ідентифіковано, тому його все одно буде спожито.
items.scrolls.inventoryscroll.yes=Так, я впевнений.
items.scrolls.inventoryscroll.no=Ні, я передумав.

items.scrolls.scrollofidentify.name=сувій розпізнавання
items.scrolls.scrollofidentify.inv_title=Розпізнати предмет
items.scrolls.scrollofidentify.it_is=Вашу річ було розпізнано: %s.
items.scrolls.scrollofidentify.desc=Цей сувій розкриває всі таємниці будь-якого предмета.

items.scrolls.scrolloflullaby.name=сувій колискової
items.scrolls.scrolloflullaby.sooth=З сувою звучить колискова мелодія. Вам хочеться заснути.
items.scrolls.scrolloflullaby.desc=Будучи прочитаним, цей сувій викличе магічну мелодію, яка занурить всіх, хто її почув, у магічний сон. Для вас і ваших союзників  цей сон - лікувальний.

items.scrolls.scrollofmagicmapping.name=сувій магічної карти
items.scrolls.scrollofmagicmapping.layout=Тепер ви знаєте план поверху.
items.scrolls.scrollofmagicmapping.desc=Прочитавши цей сувій, ваша свідомість наповниться всією інформацією про план та усі таємниці поверху, на якому був прочитаний цей сувій. Проте розташування предметів та істот все ще буде таємницею.

items.scrolls.scrollofmirrorimage.name=сувій ілюзій
items.scrolls.scrollofmirrorimage.copies=Сувій створює ваші ілюзії.
items.scrolls.scrollofmirrorimage.no_copies=Сувій намагається створити ваші ілюзії, але для них немає місця.
items.scrolls.scrollofmirrorimage.desc=Прочитавши цей сувій, ви створите двох ваших ілюзорних двійників. Вони подібні до ваших слабких клонів та будуть переслідувати ворогів. Проте, вони не мають жодної міцності та зникнуть при отриманні шкоди.

items.scrolls.scrollofretribution.name=сувій відплати
items.scrolls.scrollofretribution.blast=Потужна магічна енергія виривається з сувою!
items.scrolls.scrollofretribution.desc=Прочитавши цей сувій, ви випустите концентровану смертельну магію, яка черпатиме силу з ваших страждань. Чим менше у вас здоров'я - тим сильніший буде заряд. Якщо у вас дуже мало здоров'я, то цей заряд здатен відразу знищити майже усіх ворогів.\n\nВикористання цього сувою виснажить вас, послабивши та засліпивши.

items.scrolls.scrollofrage.name=сувій виклику
items.scrolls.scrollofrage.roar=Сувій видає гучний рев, який чути на весь поверх!
items.scrolls.scrollofrage.desc=Прочитавши цей сувій, він викличе потужний рев, який привертає увагу всіх ворогів на поверсі та розлючує тих, що поруч.

items.scrolls.scrollofrecharging.name=сувій перезарядки
items.scrolls.scrollofrecharging.surge=Магічний потік проходить через ваше тіло, перезаряджаючи жезли!
items.scrolls.scrollofrecharging.desc=Чиста магічна сила, яка заточена в цьому пергаменті, з часом заряджатиме усі жезли користувача, якщо її випустити.

items.scrolls.scrollofremovecurse.name=сувій очищення
items.scrolls.scrollofremovecurse.inv_title=Очистити предмет
items.scrolls.scrollofremovecurse.cleansed=Ваш предмет оточує очисне сяйво, і злі чари розсіюються!
items.scrolls.scrollofremovecurse.not_cleansed=Ваш предмет оточує очисне сяйво, але нічого не відбувається.
items.scrolls.scrollofremovecurse.spirit=Твій сувій визволяє змучений дух!
items.scrolls.scrollofremovecurse.desc=Магія, яка заточена в цьому сувої, при використанні вмить зніме будь-яке прокляття з однієї зброї, персня, жезла, обладунку чи артефакта.

items.scrolls.scrollofteleportation.name=сувій телепортації
items.scrolls.scrollofteleportation.tele=Вас телепортувало в інше місце поверху.
items.scrolls.scrollofteleportation.no_tele=Магічна телепортація провалилась.
items.scrolls.scrollofteleportation.cant_reach=Ви не можете телепортуватись туди.
items.scrolls.scrollofteleportation.prompt=Виберіть місце для телепортації
items.scrolls.scrollofteleportation.desc=Заклинання на цьому пергаменті миттєво перенесе читача в інше місце поверху. Сувій надає пріоритет областям, де читач раніше ще не бував, але без можливості телепортації за зачинені двері чи барикади. Проте, сувій може показати приховані двері, що ведуть у нові кімнати.

items.scrolls.scrollofterror.name=сувій жаху
items.scrolls.scrollofterror.none=Сувій випускає блискучий спалах червоного світла.
items.scrolls.scrollofterror.one=Сувій випускає блискучий спалах червоного світла, через що %s втікає!
items.scrolls.scrollofterror.many=Сувій випускає блискучий спалах червоного світла, через що монстри тікають!
items.scrolls.scrollofterror.desc=Прочитавши цей сувій, він вивільнить спалах червоного світла, який переповнить жахом усіх істот у вашому полі зору, через що вони втечуть. Напад на ворога, що втікає, скоротить ефект.

items.scrolls.scrolloftransmutation.name=сувій перетворення
items.scrolls.scrolloftransmutation.inv_title=Перетворити предмет
items.scrolls.scrolloftransmutation.nothing=Не стається нічого особливого.
items.scrolls.scrolloftransmutation.morph=Ваш предмет перетворюється у щось інше!
items.scrolls.scrolloftransmutation.desc=У сувої міститься потужна перетворююча магія. Якщо його використати на підходящий предмет, то той перетвориться на інший предмет того ж типу. Магія навіть збереже покращення, зачарування та руни. Сувої та зілля будуть перетворені на їхній екзотичний еквівалент і навпаки.

items.scrolls.scrollofupgrade.name=сувій покращення
items.scrolls.scrollofupgrade.inv_title=Покращити предмет
items.scrolls.scrollofupgrade.weaken_curse=Сувій покращення послаблює прокляття на предметі.
items.scrolls.scrollofupgrade.remove_curse=Сувій покращення очищує ваш предмет від прокляття.
items.scrolls.scrollofupgrade.desc=Цей сувій покращує один предмет або комплект метальної зброї. Палички збільшать потужність і кількість зарядів, зброя та обладунки завдаватимуть і блокуватимуть більше шкоди, набори метальної зброї будуть повністю відновлюватися і стануть міцнішими, а ефекти перснів посиляться.\n\nВін навіть може послабити або іноді повністю розвіяти прокляття, хоча він не такий потужний, як сувій очищення. На жаль, покращувальна магія також може стерти зачарування або руни на спорядженні вищого рівня.



###exotic scrolls
items.scrolls.exotic.exoticscroll.kaunan=Рідкісний сувій КАУНАН
items.scrolls.exotic.exoticscroll.sowilo=Рідкісний сувій СОВІЛО
items.scrolls.exotic.exoticscroll.laguz=Рідкісний сувій ЛАҐУЗ
items.scrolls.exotic.exoticscroll.yngvi=Рідкісний сувій ІНГВІ
items.scrolls.exotic.exoticscroll.gyfu=Рідкісний сувій ҐІФУ
items.scrolls.exotic.exoticscroll.raido=Рідкісний сувій РАЙДО
items.scrolls.exotic.exoticscroll.isaz=Рідкісний сувій ІСА
items.scrolls.exotic.exoticscroll.mannaz=Рідкісний сувій МАННАЗ
items.scrolls.exotic.exoticscroll.naudiz=Рідкісний сувій НАУДІЗ
items.scrolls.exotic.exoticscroll.berkanan=Рідкісний сувій БЕРКАНАН
items.scrolls.exotic.exoticscroll.odal=Рідкісний сувій ОДАЛ
items.scrolls.exotic.exoticscroll.tiwaz=Рідкісний сувій ТЕЙВАЗ
items.scrolls.exotic.exoticscroll.unknown_desc=На цьому чорному пергаменті написана сяюча магічна руна, яку неможливо розшифрувати. Схоже, що вона незвична для цього місця. Хто знає, що станеться, якщо її прочитати вголос?
items.scrolls.exotic.exoticscroll.discover_hint=Ви можете створити цей предмет за допомогою алхімії.

items.scrolls.exotic.scrollofsirenssong.name=сувій пісні сирени
items.scrolls.exotic.scrollofsirenssong.prompt=Виберіть ціль
items.scrolls.exotic.scrollofsirenssong.no_target=Сувій активується без цілі.
items.scrolls.exotic.scrollofsirenssong.cancel=Ви маєте обрати ціль.
items.scrolls.exotic.scrollofsirenssong.desc=Після читання цього сувою пролунає приємна мелодія, яка перетворить одного обраного супротивника на вашого постійного союзника! Решта ворогів, які почули мелодію, будуть тимчасово причаровані.\n\nОднак сильні противники можуть протистояти цьому ефекту. При виборі їх як цілі вони будуть просто причаровані.
items.scrolls.exotic.scrollofsirenssong$enthralled.name=захоплений
items.scrolls.exotic.scrollofsirenssong$enthralled.desc=Це створіння було захоплене магією сувою пісні сирен.\n\nЗахоплена істота є вашим постійним союзником, і буде атакувати будь-яких ворогів, яких зустріне.

items.scrolls.exotic.scrollofantimagic.name=сувій антимагії
items.scrolls.exotic.scrollofantimagic.desc=Закляття у цьому сувої закутає вас у магічну ауру, яка тимчасово блокуватиме всі магічні ефекти, як шкідливі, так і корисні. Сюди входить більшість ефектів магічних предметів, таких як палички, сувої, персні, артефакти, заклинання та прокляття. Здібності героїчного обладунку досить сильні, щоб працювати незалежно від цього.

items.scrolls.exotic.scrollofchallenge.name=сувій виклику
items.scrolls.exotic.scrollofchallenge.desc=При прочитанні, цей сувій видає гучне ревіння, яке приваблює до героїв ворогів, одночасно створюючи поруч з ними невелику арену.\n\nДопоки герої знаходяться у зоні цієї арени, вони отримуватимуть на 33% менше пошкоджень з усіх джерел (це застосовується перед будь-якими іншими формами зниження отриманих пошкоджень), і не втрачатимуть ситість.\n\nРозмір арени буде масштабований відповідно до розміру зони, в якій знаходяться герої. У деяких зонах з босами арена буде особливо маленькою.
items.scrolls.exotic.scrollofchallenge$challengearena.name=арена виклику
items.scrolls.exotic.scrollofchallenge$challengearena.desc=Навколо вас з'явилася чарівна арена, позначена клубочистим червоним туманом.\n\nДопоки ви знаходитесь у тумані, ваш голод не буде зростати, і ви будете отримувати на 33 %% менше пошкоджень з усіх джерел. Якщо ви маєте інші способи зниження отримуваної шкоди (такі, як обладунок), то вони будуть застосовані після 33 %% зниження.\n\nЗалишилось ходів: %d

items.scrolls.exotic.scrollofdivination.name=сувій ворожіння
items.scrolls.exotic.scrollofdivination.nothing_left=Не лишилося чого ідентифікувати!
items.scrolls.exotic.scrollofdivination.desc=Цей сувій назавжди ідентифікує чотири випадкові типи предметів, які ви ще не знаєте. Сувій може ідентифікувати колір зілля, руну сувою або самоцвіт персня. Ідентифікованими можуть бути не лише ті предмети, які ви носите з собою.
items.scrolls.exotic.scrollofdivination$wnddivination.desc=Ваш сувій ворожіння ідентифікував предмети:

items.scrolls.exotic.scrollofdread.name=сувій смертельного жаху
items.scrolls.exotic.scrollofdread.desc=При прочитанні цей сувій видає спалах червоного світла, який викликає невимовний жах в усіх ворогів у полі вашого зору. Цей ефект настільки значний, що вони будуть намагатися швидко втікти з усього підземелля, щоб більше їх ніколи не бачили!\n\nТак само як і з сувоєм жаху, цей ефект припиниться з часом, або якщо ворог буде атакований.\n\nВороги з сильною волею, якто боси, потраплять під вплив звичайного жаху замість смертельного.

items.scrolls.exotic.scrollofenchantment.name=сувій зачарування
items.scrolls.exotic.scrollofenchantment.inv_title=Зачарувати предмет
items.scrolls.exotic.scrollofenchantment.weapon=Виберіть, як зачарувати вашу зброю.
items.scrolls.exotic.scrollofenchantment.armor=Виберіть, яку руну нанести на ваш обладунок.
items.scrolls.exotic.scrollofenchantment.cancel=скасувати
items.scrolls.exotic.scrollofenchantment.cancel_warn=Скасування все одно призведе до використання сувою зачарування, ви впевнені?
items.scrolls.exotic.scrollofenchantment.cancel_warn_yes=Так, звісно
items.scrolls.exotic.scrollofenchantment.cancel_warn_no=Ні, не варто
items.scrolls.exotic.scrollofenchantment.desc=Цей сувій наділить зброю чи обладунок потужною магічною енергією. Читач навіть має певну ступінь контролю над тим, які саме чари будуть нанесені.

items.scrolls.exotic.scrollofforesight.name=сувій проникливості
items.scrolls.exotic.scrollofforesight.desc=У розум того, хто прочитав цей сувій, з граничною ясністю почне надходити інформація про навколишню місцевість. Це дасть змогу автоматично виявляти будь-які секрети в радіусі свого пошуку.

items.scrolls.exotic.scrollofmetamorphosis.name=сувій метаморфозу
items.scrolls.exotic.scrollofmetamorphosis.choose_desc=Оберіть талант для перетворення.
items.scrolls.exotic.scrollofmetamorphosis.replace_desc=Оберіть яким талантом ви хочете замінити ваш перетворений талант.
items.scrolls.exotic.scrollofmetamorphosis.cancel_warn=Скасування все одно призведе до використання сувою метаморфоз, ви впевнені?
items.scrolls.exotic.scrollofmetamorphosis.metamorphose_talent=перетворений талант
items.scrolls.exotic.scrollofmetamorphosis.desc=Цей сувій містить потужну магію перетворення, яка застосовуватиметься до заклинача, а не до предмета. Магія цього сувою дозволить вам обрати один талант і замінити його одним із п'ятьох талантів того самого рівня з різних класів героїв!\n\nЦей ефект можна застосувати лише до талантів класу, а не талантів, отриманих від підкласів або здібностей обладунку. Таланти, які ви не можете використовувати, не будуть надані як варіанти.

items.scrolls.exotic.scrollofmysticalenergy.name=сувій містичної енергії
items.scrolls.exotic.scrollofmysticalenergy.desc=Після звільнення, чиста магічна сила, яка схована у цьому пергаменті, буде певний час заряджати споряджені артефакти.

items.scrolls.exotic.scrollofpassage.name=сувій переходу
items.scrolls.exotic.scrollofpassage.desc=Заклинання на цьому пергаменті миттєво переносить читача в найближчу область на першому поверсі над ними. Дуже зручно для швидкого доступу до крамниці.

items.scrolls.exotic.scrollofprismaticimage.name=сувій призматичного вартового
items.scrolls.exotic.scrollofprismaticimage.desc=Прочитавши цей сувій, ви створите вашу призматичну копію. Вона матиме такий же захист, як і ви, проте зменшене здоров'я та силу атаки..\n\nКопія з'являється тільки тоді, коли її хазяїну загрожують вороги, за інших обставин, вона невидима та неактивна.\n\nЯкщо у вас вже є призматична копія, повторне застосування сувою повністю її зцілить.

items.scrolls.exotic.scrollofpsionicblast.name=сувій ментального удару
items.scrolls.exotic.scrollofpsionicblast.ondeath=Ментальний удар розриває вашу свідомість...
items.scrolls.exotic.scrollofpsionicblast.desc=Цей сувій містить неймовірно руйнівну енергію, яку можна направити на знищення розуму усіх видимих істот.\n\nОднак є вагомий мінус, ви також отримаєте пошкодження, засліплення та ослаблення. Чим більше ворогів підпаде під дію цього чаклування , тим менше буде завдано вам шкоди.



###spells
items.spells.alchemize.name=Алхімія
items.spells.alchemize.prompt=Алхімізувати предмет
items.spells.alchemize.desc=Це заклинання містить перетворювальні сили, подібні до тих, що містяться в алхімічному горщику. Кожне застосування дозволяє користувачеві перетворити предмет (або стопку предметів) на золото або алхімічну енергію. Перетворення зілля або сувоїв на енергію дозволить їх навіть ідентифікувати!\n\nДеякі способи використання Алхімізувача продаються в магазинах, але набагато більше можна зробити за допомогою алхімії, поєднавши насіння, рунічний камінь і трохи алхімічної енергії.
items.spells.alchemize$wndalchemizeitem.sell=Перетворити в %d
items.spells.alchemize$wndalchemizeitem.sell_1=Перетворити 1 в %d
items.spells.alchemize$wndalchemizeitem.sell_all=Перетворити все в %d
items.spells.alchemize$wndalchemizeitem.energize=Перетворити в %d енергії
items.spells.alchemize$wndalchemizeitem.energize_1=Перетворити 1 у %d енергії
items.spells.alchemize$wndalchemizeitem.energize_all=Перетворити все у %d енергії

items.spells.beaconofreturning.name=маяк повернення
items.spells.beaconofreturning.preventing=Могутня магічна аура цього місця не дозволяє вам використати закляття!
items.spells.beaconofreturning.creatures=Аура ворожої істоти не дозволяє вам телепортуватись.
items.spells.beaconofreturning.set=Маяк встановлено у вашій теперішній точці перебування.
items.spells.beaconofreturning.wnd_body=Установка замінить локацію, куди маяк був встановлений перед цим.\n\nВикористання поверне вас до останнього місця установки та використає один заряд чарів.
items.spells.beaconofreturning.wnd_set=Встановити
items.spells.beaconofreturning.wnd_return=Повернутися
items.spells.beaconofreturning.desc_set=Цей маяк встановлено десь на %d поверсі.
items.spells.beaconofreturning.desc=Це складне закляття надає користувачу можливість повернутися до заданого місця, незалежно від відстані. Заклинання буде використано лише після повернення, його можна використати стільки разів, скільки вам потрібно, але воно запам’ятає лише останнє місце, у яке було встановлено.

items.spells.curseinfusion.name=прокляте зачарування
items.spells.curseinfusion.inv_title=Проклясти предмет
items.spells.curseinfusion.desc=Це заклинання наділяє предмет тією ж зловісною магією, що була у ЗМ-300. Предмет, на якому буде використано це зачарування, буде негайно проклятий, і будь-яке зачарування або руна, яку він мав, будуть знищені.\n\nЩо стосується зброї, обладунків та жезлів, на додачу до прокляття, предмет буде покращено. Покращення від проклять не накопичуються, і втрачаються, як тільки предмет очищується від прокляття.\n\nКілька вливань прокляття також можна використовувати для зміни прокляття на зброю чи обладунок.

items.spells.spell.ac_cast=ЧАКЛУВАТИ
items.spells.spell.no_magic=Ви не можете чаклувати через магічний імунітет.
items.spells.spell.discover_hint=Ви можете створити цей предмет за допомогою алхімії.

items.spells.magicalinfusion.name=магічне покращення
items.spells.magicalinfusion.inv_title=Покращити предмет
items.spells.magicalinfusion.infuse=Твій предмет насичено магічною енергією!
items.spells.magicalinfusion.desc=Це заклинання володіє тією ж магічною силою, що і сувій покращення, проте в більш стабільній формі.\n\nОкрім стандартного покращення предмета, воно ніколи не стирає зачарування, руни, або прокляття.

items.spells.magicalporter.name=телепортатор
items.spells.magicalporter.inv_title=Телепортувати предмет
items.spells.magicalporter.nowhere=Ви нікуди не можете це телепортувати.
items.spells.magicalporter.desc=Це магічне заклинання транспортує будь-який предмет. Однак, на відміну від торгового маяка, товари будуть перевезені до входу на наступний рівень після боса.

items.spells.phaseshift.name=нестабільний телепорт
items.spells.phaseshift.no_target=Тут немає нічого що можна телепортувати.
items.spells.phaseshift.desc=Це хаотичне заклинання телепортує свою ціль у випадкове місце поточного поверху і оглушить їх на тривалий період. Сильні вороги, однак, оглушення не отримають. Воно може бути спрямоване як на себе, так і на когось іншого.

items.spells.reclaimtrap.name=записати пастку
items.spells.reclaimtrap.no_trap=Там немає пастки.
items.spells.reclaimtrap.desc_trap=Наразі заклинання готове до запуску _%s._
items.spells.reclaimtrap.desc=Це заклинання містить залишки механічної енергії ЗМ-300. Коли заклинання накладено на активну пастку, сила пастки буде прив'язана до вас, що дозволить вам використовувати заклинання ще раз, щоб вигнати цю силу і викликати ефект пастки в будь-якому місці, де ви захочете.\n\nОднак деякі пастки можуть працювати не в усіх місцях, і одночасно можна зберігати лише одну пастку.

items.spells.recycle.name=переробити
items.spells.recycle.inv_title=Переробити предмет
items.spells.recycle.recycled=Ваш предмет був перероблений у: %s.
items.spells.recycle.desc=Це заклинання містить меншу форму магії перетворення. Хоча це заклинання не працюватиме на спорядженні, воно перетворить сувій, зілля, насіння, рунний камінь або дротик із наконечником у випадковий предмет того самого типу.

items.spells.summonelemental.name=викликати духа стихій
items.spells.summonelemental.ac_imbue=НАДІЛИТИ
items.spells.summonelemental.imbue_prompt=Наповніть предмет
items.spells.summonelemental.desc=Це заклинання проводить енергію елементального попелу, використаного при виготовленні, і дає змогу вам викликати союзного елементаля битися за вас! Тільки один елементаль може існувати одночасно, але заклинання можна використовувати знову, щоб викликати елементаля до вас.
items.spells.summonelemental.desc_newborn=Зараз заклинання не наділене силою і викликає _новонародженого стихійника_ без атаки на відстані. Ви можете наділити силою розпізнаного зілля рідкого полум'я, зілля морозу, сувоєм перезарядки або сувоєм перетворення, щоб підсилити заклинання, завдяки чому майбутні виклики будуть повними силами стихійника!
items.spells.summonelemental.desc_fire=Заклинання наразі гаряче на дотик, воно викличе _елементаля вогню_. Ви можете наділити його іншим предметом, але заклинання втратить поточне насичення.
items.spells.summonelemental.desc_frost=Заклинання наразі холодне на дотик, воно викличе _елементаля морозу_. Ви можете наділити його іншим предметом, але заклинання втратить поточне насичення.
items.spells.summonelemental.desc_shock=Заклинання зараз випромінює статичну енергію. Це викличе _грозового елементаля_. Ви можете наділити заклинання іншим предметом, але воно втратить поточне наповнення.
items.spells.summonelemental.desc_chaos=Заклинання зараз випромінює хаотичну енергію. Це викличе _хаотичного елементаля_. Ви можете наділити заклинання іншим предметом, але воно втратить поточне наповнення.

items.spells.targetedspell.prompt=Виберіть ціль
items.spells.targetedspell.inv_title=Наділити предмет

items.spells.telekineticgrab.name=телекінетичний захват
items.spells.telekineticgrab.cant_grab=Ви не можете взяти це.
items.spells.telekineticgrab.no_target=Там немає нічого що можна взяти.
items.spells.telekineticgrab.desc=Це заклинання дає змогу захоплювати всі об'єкти на відстані або навіть застряглу у ворогові всю метальну зброю!\n\nЙого також можна використовувати на чужих предметах або скринях.

items.spells.unstablespell.name=нестійке заклинання
items.spells.unstablespell.desc=Цей невеликий чорний квадратний кристал має мінливі рунічні символи на кожній грані.\n\nПри активації він спричинить ефект випадкового сувою. Ефект сувою завжди буде бойовим якщо є вороги у вашому полі зору, і завжди буде зосереджений не на бойових діях.

items.spells.wildenergy.name=нестабільна енергія
items.spells.wildenergy.desc=Це заклинання містить частину проклятої енергії, яка живила ЗМ-300. Під час відтворення вона заряджатиме ваші жезли та артефакти, а також викликає ефект якогось проклятого жезла. Ви можете вибрати напрям пострілу цією проклятою магією.


###runestones
items.stones.inventorystone.ac_use=ВИКОРИСТАТИ

items.stones.runestone$placeholder.name=рунічний камінь
items.stones.runestone.discover_hint=Ви можете знайти цей предмет випадково в підземеллі або виготовити його за допомогою алхімії.

items.stones.stoneofaggression.name=камінь агресії
items.stones.stoneofaggression.desc=Якщо кинути цей камінь у будь-кого, всі вороги, які перебувають поруч, вважатимуть за краще атакувати цього персонажа протягом короткого часу.\n\nОднак вороги-боси можуть протистояти ефекту, значно зменшуючи тривалість і отримуючи менше шкоди від атак своїх прислужників.
items.stones.stoneofaggression$aggression.name=обраний
items.stones.stoneofaggression$aggression.desc=Маніпулятивна магія змушує всіх ворогів поблизу атакувати цього персонажа.\n\nХодів залишилося: %s.

items.stones.stoneofaugmentation.name=камінь посилення
items.stones.stoneofaugmentation.inv_title=Посилити предмет
items.stones.stoneofaugmentation.desc=Цей камінь несе в собі потужну магію, яка може посилити спорядження, покращуючи одну його властивість ціною іншої.\n\nВикористання на зброї дозволить вам підвищити  її швидкість атаки або пошкодження, нанесені нею. Метальна зброя також набуває або втрачає міцність пропорційно до швидкості польоту.\n\nВикористання на обладунках дозволить вам посилити їх захист або рейтинг ухилення.
items.stones.stoneofaugmentation.discover_hint=Ви можете купити цей предмет у магазині або виготовити його за допомогою алхімії.
items.stones.stoneofaugmentation$wndaugment.choice=Що ви хочете посилити?
items.stones.stoneofaugmentation$wndaugment.speed=Швидкість
items.stones.stoneofaugmentation$wndaugment.damage=Пошкодження
items.stones.stoneofaugmentation$wndaugment.evasion=Ухилення
items.stones.stoneofaugmentation$wndaugment.defense=Захист
items.stones.stoneofaugmentation$wndaugment.none=Прибрати посилення
items.stones.stoneofaugmentation$wndaugment.cancel=Не зважай

items.stones.stoneofblast.name=камінь вибуху
items.stones.stoneofblast.desc=Цей рунічний камінь миттєво вибухне у місці, куди його кинуто. Подібно до бомби, він нанесе шкоду усім навколо.

items.stones.stoneofblink.name=камінь стрибка
items.stones.stoneofblink.desc=Цей рунічний камінь телепортує героя у місце, куди його було кинуто.

items.stones.stoneofclairvoyance.name=камінь прозріння
items.stones.stoneofclairvoyance.desc=Цей рунічний камінь відкриє таємниці всіх клітинок у широкому радіусі навколо місця, куди його було кинуто. Його магія здатна навіть проникати крізь стіни.

items.stones.stoneofdeepsleep.name=камінь глибокого сну
items.stones.stoneofdeepsleep.desc=Цей камінь, кинутий у ворога, занурить його в глибокий магічний сон. Такий сон не можна потривожити, поки ворог не зазнав якоїсь шкоди.

items.stones.stoneofdetectmagic.name=камінь виявлення магії
items.stones.stoneofdetectmagic.inv_title=Виявлення предмета
items.stones.stoneofdetectmagic.detected_none=Ви не помічаєте ніякої магії, що впливає на цей предмет.
items.stones.stoneofdetectmagic.detected_both=Ви виявляєте як позитивну, так і зловісну магію, що впливає на цей предмет!
items.stones.stoneofdetectmagic.detected_good=Ви виявили позитивну магію, що впливає на цей предмет!
items.stones.stoneofdetectmagic.detected_bad=Ви виявили зловісну магію, що впливає на цей предмет!
items.stones.stoneofdetectmagic.desc=Цей рунічний камінь здатний виявити магію, що впливає на предмет. Використання цього каменю на нерозпізнаному предметі покаже вам, чи на нього діє зловісне прокляття і чи впливає на нього позитивна магія, наприклад зачарування або покращення.

items.stones.stoneofdisarming.name=камінь деактивації
items.stones.stoneofdisarming.desc=Цей рунічний камінь несе в собі магію, здатну знищити підступні пастки, розкидані по підземеллю. Він роззброїть до 9 пасток навколо себе.

items.stones.stoneofenchantment.name=камінь зачарування
items.stones.stoneofenchantment.inv_title=Зачарувати предмет
items.stones.stoneofenchantment.weapon=Ваша зброя сяє у темряві!
items.stones.stoneofenchantment.armor=Ваш обладунок сяє у темряві!
items.stones.stoneofenchantment.desc=Цей рунічний камінь несе потужну магію зачарування. На відміну від сувою покращення, він не посилить предмет явно, надаючи йому замість цього нові магічні сили.

items.stones.stoneoffear.name=камінь страху
items.stones.stoneoffear.desc=Цей камінь так сильно налякає персонажа, в якого він був кинутий, що йому захочеться забратися куди подалі. Будь-яка шкода, завдана тому, хто тікає, знизить тривалість ефекту.

items.stones.stoneofflock.name=камінь отари
items.stones.stoneofflock.desc=Цей рунічний камінь прикликає магічних овець навколо себе на короткий час

items.stones.stoneofintuition.name=камінь інтуїції
items.stones.stoneofintuition.inv_title=Виберіть предмет
items.stones.stoneofintuition.desc=Цей рунічний камінь містить слабшу версію магії, яку несуть у собі сувої розпізнавання. Замість прямого розпізнавання предмета, він дасть вам змогу спробувати вгадати тип сувою, зілля або персня.
items.stones.stoneofintuition.break_info=Ви можете використати каміння інтуїції двічі, перш ніж один розіб’ється, _наступне використання не призведе до споживання каменю_.
items.stones.stoneofintuition.break_warn=Ви вже використовували камінь інтуїції раніше, тому _наступне використання споживе камінь_.
items.stones.stoneofintuition$wndguess.text=Спробуйте вгадати тип невідомого предмета. Якщо у вас вийде, його буде розпізнано!
items.stones.stoneofintuition$wndguess.correct=Правильно. Тип предмета розпізнано!
items.stones.stoneofintuition$wndguess.incorrect=Ви не вгадали.
items.stones.stoneofintuition$wndguess.break=Ваш камінь інтуїції розсипається в порох…

items.stones.stoneofshock.name=камінь шоку
items.stones.stoneofshock.desc=Цей рунічний камінь вибухає електричною енергією, яка на короткий час оглушує всіх супротивників поблизу, а також надає кидаючому заряд палички за кожну влучену ціль.


###trinkets
items.trinkets.chaoticcenser.name=хаотична кадильниця
items.trinkets.chaoticcenser.spew=Твоє кадило ось-ось спалахне: %s.
items.trinkets.chaoticcenser.desc=Через деякий час у алхімічному горщику ця кадильниця, здається, виробляє дим сама по собі! Ці гази накопичуються і будуть вивергатися з кадильниці у бік ворогів через напіввипадкові проміжки часу. Здається, воно здатне виробляти всі види газів, але ви отримаєте попередження безпосередньо перед тим, як кадило активується.
items.trinkets.chaoticcenser.typical_stats_desc=Зазвичай цей аксесуар породжує шкідливий газ поблизу ворога приблизно кожні _%d_ ходів. Гази з'являтимуться лише за наявності ворогів. На вищих рівнях ці гази, швидше за все, будуть екзотичними та потужними.
items.trinkets.chaoticcenser.stats_desc=На цьому рівні, цей аксесуар породжує шкідливий газ поблизу ворога приблизно кожні _%d_ ходів. Гази з'являтимуться лише за наявності ворогів. На вищих рівнях ці гази, швидше за все, будуть екзотичними та потужними.

items.trinkets.crackedspyglass.name=тріснута підзорна труба
items.trinkets.crackedspyglass.desc=Цей ручний телескоп був би зразком чудової та точної роботи, якби не тріщина на передній лінзі. Підзорна труба, здається, допомагає вам, відкриваючи нові предмети в підземеллі, але через її дефект відкриті предмети досить важко розгледіти!
items.trinkets.crackedspyglass.typical_stats_desc=Зазвичай цей аксесуар має _%1$s%% шанс_ створити додатковий прихований предмет на кожному поверсі, де немає боса.
items.trinkets.crackedspyglass.stats_desc=На цьому рівні, цей аксесуар має _%1$s%% шанс_ створити додатковий прихований предмет на кожному поверсі, де немає боса.
items.trinkets.crackedspyglass.stats_desc_upgraded=На цьому рівні, цей аксесуар має _100%% шанс_ створити додатковий прихований предмет на кожному небосовому поверсі та _%1$s%% шанс_ створити другий додатковий прихований предмет.

items.trinkets.dimensionalsundial.name=міжвимірний сонячний годинник
items.trinkets.dimensionalsundial.warning=Ваш сонячний годинник не кидає тінь, ви стривожені.
items.trinkets.dimensionalsundial.desc=Цей маленький ручний сонячний годинник якимось чином здатний відкидати тінь у глибині підземелля, навіть якщо ви не тримаєте його вертикально. Ще більш дивно те, що положення тіні не має ніякого відношення до сонця в цьому світі. Коли немає тіні, сонячний годинник ніби привертає небезпеку.
items.trinkets.dimensionalsundial.typical_stats_desc=Зазвичай цей аксесуар зменшує швидкість появи ворогів на _%1$d%%_, коли у реальному житті день (8:00-20:00), і збільшує швидкість появи ворогів на _%2$d%%_ вночі (20:00-8:00).
items.trinkets.dimensionalsundial.stats_desc=На поточному рівні, цей аксесуар зменшує швидкість появи ворогів на _%1$d%%_, коли у реальному житті день (8:00-20:00), і збільшує швидкість появи ворогів на _%2$d%%_ вночі (20:00-8:00).

items.trinkets.exoticcrystals.name=екзотичні кристали
items.trinkets.exoticcrystals.desc=Ці маленькі рожеві кристали мають таку ж форму, що й кристали алхімічної енергії. Хоча їх не можна використовувати безпосередньо для отримання енергії, вони, здається, якимось чином впливають на зілля та сувої, які ви знайдете.
items.trinkets.exoticcrystals.typical_stats_desc=Зазвичай цей аксесуар замінить _%s%%_ зілля або сувоїв, які випадають на їхні екзотичні еквіваленти. Це не впливає на зілля сили, сувої покращень або предмети, які генеруються, щоб допомогти пройти небезпечні кімнати.
items.trinkets.exoticcrystals.stats_desc=На цьому рівні цей аксесуар замінить _%s%%_ зілля або сувоїв, які випадають на їхні екзотичні еквіваленти. Це не впливає на зілля сили, сувої покращень або предмети, які генеруються, щоб допомогти пройти небезпечні кімнати.

items.trinkets.eyeofnewt.name=око тритона
items.trinkets.eyeofnewt.desc=Це золотисто-чорне око тритона є звичайним інгредієнтом, перетвореним на аксесуар. Здається, око зменшує ваш зір в обмін на те, що дозволяє вам бачити речі іншими способами.
items.trinkets.eyeofnewt.typical_stats_desc=Зазвичай цей аксесуар зменшить дальність вашого бачення на _%1$s%%_, але також дасть вам ментальний зір у межах _%2$d_ плиток.
items.trinkets.eyeofnewt.stats_desc=На поточному рівні цей аксесуар зменшить дальність вашого бачення на _%1$s%%_, але також дасть вам ментальний зір у межах _%2$d_ плиток.

items.trinkets.ferrettuft.name=тхорячий чубчик
items.trinkets.ferrettuft.desc=Пучок шовковистого білого тхорячого хутра, скріплений лаймово-зеленою стрічкою, зав'язаною в бант. Тхори відомі своєю спритністю, пустотливістю та відсутністю доброчесності. Здається, частина цієї сили випромінюється з брелока, посилюючи ухилення від усього, що знаходиться поруч.
items.trinkets.ferrettuft.typical_stats_desc=Зазвичай цей аксесуар збільшує ухилення всіх персонажів до _%1$s%%_.
items.trinkets.ferrettuft.stats_desc=На поточному рівні цей аксесуар збільшить ухилення всіх персонажів на _%1$s%%_.

items.trinkets.mimictooth.name=зуб міміка
items.trinkets.mimictooth.desc=Цей великий гострий зуб, мабуть, був вирваний з дуже засмученого міміка. Здається, він впливає на міміків підземелля, роблячи їх більш частими та небезпечними.
items.trinkets.mimictooth.typical_stats_desc=Зазвичай цей аксесуар зробить усі види міміків в _%1$s разів_ більш поширеними, зробить міміків набагато складнішими для виявлення та дасть кожному поверху _%2$s%%_ шанс містити міміка з чорного дерева.
items.trinkets.mimictooth.stats_desc=На поточному рівні цей аксесуар зробить усі види міміків в _%1$s разів_ більш поширеними, зробить міміків набагато складнішими для виявлення та дасть кожному поверху _%2$s%%_ шанс містити міміка з чорного дерева.

items.trinkets.mossyclump.name=грудка моху
items.trinkets.mossyclump.desc=Здається, ця грудка мокрого моху утримує вологу, як би сильно ви її не стискали. Здається, вона магічним чином прив’язана до самого підземелля, завдяки чому частіше з’являються трава та вода.
items.trinkets.mossyclump.typical_stats_desc=Зазвичай цей аксесуар заповнить _%d%%_ нетематичних поверхів водою або травою.\nПокращення цього аксесуару вимагає більшу кількість енергії.
items.trinkets.mossyclump.stats_desc=На поточному рівні цей аксесуар заповнить _%d%%_ нетематичних поверхів водою або травою.\nПокращення цього аксесуару вимагає більшу кількість енергії.

items.trinkets.parchmentscrap.name=клаптик пергаменту
items.trinkets.parchmentscrap.desc=Цей маленький клаптик пергаменту виглядає так, ніби він від сувою. Він зберіг частину своєї магії, і, здається, впливає на зброю та обладунки, знайдені в підземеллі.
items.trinkets.parchmentscrap.typical_stats_desc=Зазвичай цей аксесуар зробить зачарування та руни в _%d разів_ більш розповсюдженими, а прокляття на зброї та обладунках в _%s разів_ більш розповсюдженими. Він не впливає на прокляття на жезлах, перснях або артефактах.\n\nПокращення цього аксесуару вимагає більшу кількість енергії.
items.trinkets.parchmentscrap.stats_desc=На поточному рівні цей аксесуар зробить зачарування та руни в _%d разів_ більш розповсюдженими, а прокляття на зброї та обладунках в _%s разів_ більш розповсюдженими. Він не впливає на прокляття на жезлах, перснях або артефактах.\n\nПокращення цього аксесуару вимагає більшу кількість енергії.

items.trinkets.petrifiedseed.name=скам'яніла насінина
items.trinkets.petrifiedseed.desc=Це насіння скам’яніло через повільні геологічні процеси або магію. Здається, насіння магічно впливає на флору підземелля, час від часу замінюючи насіння рослин рунічними каменями.
items.trinkets.petrifiedseed.typical_stats_desc=Зазвичай цей аксесуар змушуватиме витоптану траву залишати рунічні камені замість насіння _%1$s%%_ часу, а також змушуватиме високу траву залишати предмети на _%2$s%%_ частіше.
items.trinkets.petrifiedseed.stats_desc=На поточному рівні цей аксесуар змушуватиме витоптану траву залишати рунічні камені замість насіння _%1$s%%_ часу, а також змушуватиме високу траву залишати предмети на _%2$s%%_ частіше.

items.trinkets.ratskull.name=щурячий череп
items.trinkets.ratskull.desc=Цей похмурий артефакт не набагато більший за череп звичайного щура, що в цьому підземеллі є рідкістю. Здається, магічний вплив черепа приваблює більш рідкісних мешканців підземелля, змушуючи їх з’являтися набагато частіше.
items.trinkets.ratskull.typical_stats_desc=Зазвичай цей аксесуар збільшить імовірність появи рідкісних та екзотичних ворогів в _%d разів_. Однак череп вдвічі менш ефективний для залучення кришталевих міміків і броньованих статуй.
items.trinkets.ratskull.stats_desc=На поточному рівні цей аксесуар збільшить імовірність появи рідкісних та екзотичних ворогів в _%d разів_. Однак череп вдвічі менш ефективний для залучення кришталевих міміків і броньованих статуй.

items.trinkets.saltcube.name=куб солі
items.trinkets.saltcube.desc=Цей великий кристал солі був розрізаний у майже ідеальну форму куба, і йому якимось чином вдалося витягти половину води з алхімічного горщика замість того, щоб розчинитися. Здається, він чарівним чином зневоднює та зберігає їжу, яку ви їсте, подовжуючи ситість, яку ви отримуєте, але також зменшує відновлення вашого здоров’я, коли ви не голодуєте.
items.trinkets.saltcube.typical_stats_desc=Зазвичай цей аксесуар збільшить час, перш ніж ви зголоднієте на _%1$s%%_, але також зменшить швидкість відновлення здоров’я на _%2$s%%_ якщо двері не замкнені.
items.trinkets.saltcube.stats_desc=На поточному рівні цей аксесуар збільшить час, перш ніж ви зголоднієте на _%1$s%%_, але також зменшить швидкість відновлення здоров’я на _%2$s%%_ якщо двері не замкнені.

items.trinkets.shardofoblivion.name=уламок забуття
items.trinkets.shardofoblivion.desc=Після гасіння в алхімічному горщику цей маленький уламок проклятого металу перетворився на... ніщо? Здається, що світло згинається навколо нього, і він ширяє на місці, коли ви його не тримаєте. Уламок, здається, чарівним чином черпає силу з вашого невігластва, тому, ймовірно, краще не думати про це занадто багато.
items.trinkets.shardofoblivion.typical_stats_desc=Зазвичай цей аксесуар збільшує швидкість випадання здобичі з ворогів на 20%% за кожну одиницю неідентифікованого обладнання, яке ви спорядили або нещодавно використовували, максимум до _%d предмет(ів)_. Уламок також не дозволить вам розпізнавати обладнання, але його можна використовувати для ручного розпізнавання готових для нього предметів.
items.trinkets.shardofoblivion.stats_desc=На поточному рівні цей аксесуар збільшує швидкість випадання здобичі з ворогів на 20%% за кожну одиницю неідентифікованого обладнання, яке ви спорядили або нещодавно використовували, максимум до _%d предмет(ів)_. Уламок також не дозволить вам розпізнавати обладнання, але його можна використовувати для ручного розпізнавання готових для нього предметів.
items.trinkets.shardofoblivion.ac_identify=ІДЕНТИФІКУВАТИ
items.trinkets.shardofoblivion.identify_prompt=Розпізнати предмет
items.trinkets.shardofoblivion.identify_ready=Предмет готовий для розпізнання: %s. Використовуйте свій Уламок Забуття, щоб розпізнати його.
items.trinkets.shardofoblivion.identify_ready_worn=Тепер ваші вживані речі готові до розпізнання. Використовуйте свій Уламок Забуття, щоб розпізнати його.
items.trinkets.shardofoblivion.identify_not_yet=Цей предмет ще не готовий до ідентифікації.
items.trinkets.shardofoblivion.identify=Ви ідентифікували предмет!
items.trinkets.shardofoblivion$wandusetracker.name=Використано нерозпізнаний жезл
items.trinkets.shardofoblivion$wandusetracker.desc=Нещодавно ви використали нерозпізнаний жезл, який на деякий час вважається використаним нерозпізнаним спорядженням для уламка забуття.\n\nХодів залишилося: %s.
items.trinkets.shardofoblivion$thrownusetracker.name=Використано нерозпізнану метальну зброю
items.trinkets.shardofoblivion$thrownusetracker.desc=Нещодавно ви використали нерозпізнану метальну зброю, яка зараховується як одна одиниця використаного нерозпізнаного спорядження для уламка забуття на деякий час.\n\nХодів залишилося: %s.

items.trinkets.thirteenleafclover.name=тринадцятилиста конюшина
items.trinkets.thirteenleafclover.desc=Якимсь чином тушкування в алхімічному горщику призвело до того, що ця конюшина виростила купу додаткових листочків! Не зовсім зрозуміло, щасливий цей аксесуар чи нещасливий, можливо, він зробить вашу удачу більш хаотичною?
items.trinkets.thirteenleafclover.typical_stats_desc=Зазвичай цей аксесуар завдаватиме вам максимальної шкоди _%1$d%%_ за одиницю часу, і мінімальну шкоду _%2$d%%_ за одиницю часу.
items.trinkets.thirteenleafclover.stats_desc=На поточному рівні цей аксесуар завдаватиме вам максимальної шкоди _%1$d%%_ за одиницю часу, і мінімальну шкоду _%2$d%%_ за одиницю часу.

items.trinkets.trapmechanism.name=механізм пастки
items.trinkets.trapmechanism.desc=Основний механізм однієї з пасток підземелля, обережно вирізаний з підлоги, щоб його можна було носити. Здається, що він магічно пов'язаний з самим підземеллям, роблячи небезпечну місцевість більш поширеною, але також збільшуючи вашу прихильність до неї.
items.trinkets.trapmechanism.typical_stats_desc=Зазвичай цей аксесуар зробить _%1$d%%_ нетематичних поверхів стають пастками або прірвами. Крім того, _%2$d%%_ приховані пастки підземелля стануть видимими.
items.trinkets.trapmechanism.stats_desc=На поточному рівні цей аксесуар зробить _%1$d%%_ нетематичних поверхів стають пастками або прірвами. Крім того, _%2$d%%_ приховані пастки підземелля стануть видимими.

items.trinkets.vialofblood.name=флакон з кров'ю
items.trinkets.vialofblood.desc=Цей тонкий флакон містить кров якогось мешканця підземелля, яка повільно рухається, коли ви обертаєте флакон. Здається, що це магічним чином посилює лікувальні ефекти, але водночас і затримує їх.
items.trinkets.vialofblood.typical_stats_desc=Зазвичай цей аксесуар збільшує загальний запас здоров'я, який ви отримуєте від випитого зілля зцілення, бурдюка або колодязя здоров'я, на _%1$s%%_. Однак ці лікувальні ефекти також будуть проявлятися повільніше, відновлюючи максимум _%2$s_ здоров'я за хід (це значення залежить від рівня героя).
items.trinkets.vialofblood.stats_desc=На поточному рівні цей аксесуар збільшує загальний запас здоров'я, який ви отримуєте від випитого зілля зцілення, бурдюка або колодязів здоров'я, на _%1$s%%_. Однак ці лікувальні ефекти також будуть проявлятися повільніше, відновлюючи максимум _%2$s_ здоров'я за хід (це значення залежить від рівня героя).

items.trinkets.wondrousresin.name=дивна смола
items.trinkets.wondrousresin.desc=Ця мерехтлива синя смола, здається, має дистильовану сутність магії проклятої палички. Алхімічна магія, здається, дещо стабілізувала її, і тепер вона впливає на ваші палички.
items.trinkets.wondrousresin.typical_stats_desc=Зазвичай цей аксесуар змушує прокляті чарівні палички ставати нейтральними або позитивними _%1$s%%_ часу, а не прокляті чарівні палички стрілятимуть додатковим нейтральним або позитивним проклятим ударом протягом _%2$s%%_ часу.\n\nПокращення цього аксесуара коштує більшу кількість енергії.
items.trinkets.wondrousresin.stats_desc=На поточному рівні цей артефакт змушуватиме ефекти проклятих паличок ставати нейтральними або позитивними _%1$s%%_ часу, а не прокляті палички стрілятимуть додатковим проклятим заклинанням _%2$s%%_ часу.\n\nПокращення цього аксесуару вимагає більшу кількість енергії.

items.trinkets.trinketcatalyst.name=магічний каталіст
items.trinkets.trinketcatalyst.window_title=створити аксесуар
items.trinkets.trinketcatalyst.window_text=Вода починає світитися, коли ви додаєте каталізатор. Поруч є кілька предметів, які можна наділити енергією, щоб перетворити на чарівний артефакт.
items.trinkets.trinketcatalyst.desc=Ця куля чарівного золотого пилу мерехтить у темряві підземелля. Цей каталізатор можна використати в алхімічному горщику з невеликою кількістю алхімічної енергії для виготовлення унікального аксесуару.\n\nАксесуари створюють різні ефекти, які трохи змінюють підземелля або його мешканців. Аксесуари можна покращити, додавши більше енергії, щоб зробити їхній ефект сильнішим, або викинути, щоб повністю відмовитися від ефекту.
items.trinkets.trinketcatalyst$randomtrinket.name=випадковий аксесуар
items.trinkets.trinketcatalyst$randomtrinket.desc=Один сусідній предмет застряг у сумці, яку ви не можете відкрити.\n\nПроцес алхімії розчинить мішечок, але ви не дізнаєтесь, який аксесуар отримаєте, доки не зробите це!

items.trinkets.trinket.discover_hint=Цей предмет має шанс стати додатковим, коли ви створюєте аксесуар за допомогою алхімії.
items.trinkets.trinket$placeholder.name=аксесуар

###wands
items.wands.cursedwand.ondeath=Ви були вбиті власним %s.
items.wands.cursedwand.nothing=Нічого не відбулося.
items.wands.cursedwand.mass_invuln=З вашої палички виривається яскраве світло!
items.wands.cursedwand.petrify=Ви раптом застигаєте на місці!
items.wands.cursedwand.grass=Навколо вас піднімається трава!
items.wands.cursedwand.fire=Ви відчуваєте запах диму...
items.wands.cursedwand.transmogrify_wand=Ваш жезл перетворився на щось інше!
items.wands.cursedwand.transmogrify_other=Ваш предмет перетворився на щось інше!
items.wands.cursedwand.disguise=Ваша зовнішність змінюється на очах!
items.wands.cursedwand.supernova=Палаюча куля енергії починає рости. Вам потрібно тікати!
items.wands.cursedwand.supernova_positive=Палаюча куля енергії починає рости, але це виглядає безпечно.
items.wands.cursedwand.sinkhole=Підлога під вами провалюється!
items.wands.cursedwand.sinkhole_positive=Земля починає провалюватись, але все ще достатньо тверда під вами.
items.wands.cursedwand.gravity=Гравітація раптом починає тягнути у випадкових напрямках!
items.wands.cursedwand.gravity_positive=Гравітація раптово починає тягнути у випадкових напрямках, але це не впливає на вас.
items.wands.cursedwand.gravity_end=Гравітаційний хаос закінчується.

items.wands.damagewand.upgrade_stat_name_1=Магічна шкода

items.wands.wand.ac_zap=ВИСТРІЛИТИ
items.wands.wand.fizzles=Ваш жезл іскрить; він не має достатньо зарядів.
items.wands.wand.no_magic=Ваш жезл іскрить; ви не можете користуватися жезлами будучи імунним до магії.
items.wands.wand.self_target=Неможливо вистрілити у себе!
items.wands.wand.identify=Ви достатньо знайомі з вашим жезлом, щоб її розпізнати.
items.wands.wand.resin_one=Ця палиця отримала _1 рівень_ від таємничої смоли.
items.wands.wand.resin_many=Цей жезл отримав _%d рівні_ від таємничої смоли.
items.wands.wand.cursed=Цей жезл проклятий, а його магія хаотична та непередбачувана.
items.wands.wand.not_cursed=Цей жезл вільний від темної магії.
items.wands.wand.curse_discover=Цей %s проклятий!
items.wands.wand.prompt=Виберіть, куди стріляти
items.wands.wand$placeholder.name=жезл

items.wands.wandofblastwave.name=жезл вибухової хвилі
items.wands.wandofblastwave.staff_name=патериця вибухової хвилі
items.wands.wandofblastwave.ondeath=Ти вбив себе своїм жезлом силового удару
items.wands.wandofblastwave.knockback_ondeath=Зіткнення вбило тебе...
items.wands.wandofblastwave.desc=Цей жезл зроблений з чогось подібного до мармуру, має золоті вставки та круглий чорний кристал на верхівці. Він доволі важкий.
items.wands.wandofblastwave.typical_stats_desc=Ця паличка стріляє болтом, який різко детонує в цільовому місці. Сила цього вибуху зазвичай дає _%1$d-%2$d шкоди_ і достатньо сильний, щоб змусити більшість ворогів злетіти.
items.wands.wandofblastwave.stats_desc=Цей жезл посилає заряд, який вибухає у цільовому місці. Він завдає _%1$d - %2$d_ шкоди та є настільки сильним, що може відправити більшість ворогів у політ.
items.wands.wandofblastwave.upgrade_stat_name_2=Нокдаун
items.wands.wandofblastwave.bmage_desc=Коли _Бойовий маг_ вражає паралізованого ворога посохом вибухової хвилі, він витрачає параліч, щоб нанести додаткову магічну шкоду. Він має короткий час перезарядки на одного ворога.
items.wands.wandofblastwave.eleblast_desc=Стихійний вибух із жезлом вибухової хвилі завдає 67% шкоди та збиває всіх ворогів поза зоною вибуху.

items.wands.wandofcorrosion.name=жезл корозії
items.wands.wandofcorrosion.staff_name=патериця корозії
items.wands.wandofcorrosion.desc=Цей жезл зроблений з мертвотно-сірого каменю та має сяючий помаранчевий кристал на верхівці.
items.wands.wandofcorrosion.stats_desc=Цей жезл вистрілює стрілу, яка вибухає в хмарі висококорозійного газу в цільовому місці. Все, що потрапить в цю хмару, з часом отримає додаткові пошкодження, починаючи _%d одиниць шкоди._
items.wands.wandofcorrosion.upgrade_stat_name_1=Шкода від корозії
items.wands.wandofcorrosion.upgrade_stat_name_2=Об'єм газу
items.wands.wandofcorrosion.bmage_desc=Коли _бойовий маг_ вражає ворога жезлом корозії, у ворога є шанс покритися їдким слизом.
items.wands.wandofcorrosion.eleblast_desc=Вибух стихії з жезлом корозії завдає ворогам 4 ходу корозії, починаючи з 6 одиниць шкоди.

items.wands.wandofcorruption.name=жезл панування
items.wands.wandofcorruption.staff_name=Патериця Панування
items.wands.wandofcorruption.already_corrupted=Неможливе подальше використання на даного персонажа.
items.wands.wandofcorruption.desc=Цей жезл випромінює хаотичну темну енергію. Він має невеликий декоративний череп на верхівці.
items.wands.wandofcorruption.stats_desc=Цей жезл випустить заряд руйнівної енергії, який буде накладати на ворогів негативні ефекти, врешті-решт підкоряючи їх вашій волі. Вороги здатні протистояти ефекту жезла, але ослаблених підкорити значно легше.
items.wands.wandofcorruption.upgrade_stat_name_1=Сила деформації
items.wands.wandofcorruption.upgrade_stat_name_2=Тривалість негативного ефекту
items.wands.wandofcorruption.bmage_desc=Коли _бойовий маг_ вражає ворога жезлом панування, у ворога є шанс розлютитися.
items.wands.wandofcorruption.eleblast_desc=Стихійний вибух з жезлом панування накладає на ворогів 5 ходів шаленства.

items.wands.wandofdisintegration.name=жезл дезінтеграції
items.wands.wandofdisintegration.staff_name=Патериця Дезінтеграції
items.wands.wandofdisintegration.desc=Цей жезл зроблений з суцільного шматка обсидіану. Всередині нього пульсує фіолетове світло. Його руйнівна сила готова вирватися вперед.
items.wands.wandofdisintegration.stats_desc=Цей жезл випускає смертоносний промінь, який пронизує будь-які перешкоди та сягає все далі з кожним покращенням жезла. Промінь наносить _%1$d - %2$d шкоди_, яка збільшується з кожним пронизаним ворогом.
items.wands.wandofdisintegration.upgrade_stat_name_2=Максимальна дальність
items.wands.wandofdisintegration.bmage_desc=Коли _бойовий маг_ використовує жезл дезінтеграції, дальність атаки збільшується так, ніби в ньому є чари проєкції.
items.wands.wandofdisintegration.eleblast_desc=Вибух стихії з жезлом дезінтеграції завдає 100% шкоди та пробиває стіни.

items.wands.wandoffireblast.name=жезл вогняного шторму
items.wands.wandoffireblast.staff_name=Патериця Вогняного Шторму
items.wands.wandoffireblast.desc=Цей жезл зроблений з червоного лакованого дерева та має золоті візерунки. Він тріскотить та шипить на своїй верхівці, готовий випустити свою могутню магію.
items.wands.wandoffireblast.stats_desc=Цей жезл вистрілює конусом вогню коли використана. Її наступна атака використає _%1$d заряди_ і нанесе _%2$d-%3$d пошкоджень._ Чим більше зарядів використає жезл, тим більшим і потужнішим буде ефект.
items.wands.wandoffireblast.upgrade_stat_name_1=Шкода 1 заряду
items.wands.wandoffireblast.upgrade_stat_name_2=Шкода 2 заряду
items.wands.wandoffireblast.upgrade_stat_name_3=Шкода 3 заряду
items.wands.wandoffireblast.bmage_desc=Коли _Бойовий маг_ вражає ворога посохом вогняного шторму, є шанс, що він спричинить вибух, який завдасть шкоди ворогам і поглине весь вогонь поблизу! Цей шанс збільшується, чим більше вогню знаходиться поруч з ворогом.
items.wands.wandoffireblast.eleblast_desc=Стихійний вибух із вогненним жезлом завдає 100% шкоди, розриває двері та підпалює ворогів і місцевість.

items.wands.wandoffrost.name=жезл морозу
items.wands.wandoffrost.staff_name=патериця морозу
items.wands.wandoffrost.desc=Цей жезл, судячи з усього, зроблений з якогось магіічного льоду. Його верхівка світиться яскравіше. Жезл дуже холодний, але ваші руки чомусь лишаються теплими.
items.wands.wandoffrost.stats_desc=Цей жезл стріляє крижаною енергією в ваших ворогів, наносячи _%1$d-%2$d шкоди_ і охолоджуючи. Цей ефект, здається, посилюється в воді. Вороги, які вже охолоджені або заморожені, отримують менше шкоди від цього жезла.
items.wands.wandoffrost.upgrade_stat_name_2=Тривалість відпочинку
items.wands.wandoffrost.bmage_desc=Коли _бойовий маг_ вражає охолодженого супротивника жезлом морозу, у ворогів є шанс моментально замерзнути. Чим більше охолоджений противник, тим більшим є цей шанс.
items.wands.wandoffrost.eleblast_desc=Стихійний вибух із жезлом морозу завдає 100% шкоди, заморожує ворогів і гасить пожежі.

items.wands.wandoflightning.name=жезл блискавок
items.wands.wandoflightning.staff_name=патериця блискавок
items.wands.wandoflightning.ondeath=Ти вбив себе своїм жезлом блискавок...
items.wands.wandoflightning.desc=Цей жезл зроблений з суцільного металу. Він доволі важкий. На верхівці розміщені два виступи, між якими проскакують дуги електрики.
items.wands.wandoflightning.stats_desc=Цей жезл посилає потужну блискавку, що пронизує те, в що вона направлена, і наносить  _%1$d-%2$d шкоди._ Цей струм іскрить по всім наближеним істотам, і ще краще розповсюджується в воді. Іскри цього жезла можуть нашкодити вам, але не завдадуть болю вашим союзникам.
items.wands.wandoflightning.bmage_desc=Коли _бойовий маг_ вражає ворога жезлом блискавки, він має шанс зарядитися електричним струмом на 10 ходів. Під час заряджання бойовий маг має імунітет до шкоди від блискавки і продовжує бити блискавкою по дузі.
items.wands.wandoflightning.eleblast_desc=Стихійний вибух з жезлом блискавок завдає 100% шкоди, оглушує ворогів на 5 ходів і електризує воду.
items.wands.wandoflightning$lightningcharge.name=Електрично заряджений
items.wands.wandoflightning$lightningcharge.desc=Наразі бойовий маг заряджений енергією, що надає йому імунітет до його жезла блискавки і збільшує дальність, на яку блискавка може випромінювати дугу.\n\nХодів залишилося: %s.

items.wands.wandoflivingearth.name=жезл живої землі
items.wands.wandoflivingearth.staff_name=патериця живої землі
items.wands.wandoflivingearth.desc=Цей жезл зроблений з дивного каменю з прожилками жовтої сяючої енергії. Камені трохи зсуваються, як ви стискаєте жезл, ніби відчуваючи вашу руку.
items.wands.wandoflivingearth.stats_desc=Цей жезл посилає заряди магічного каменю у ворогів, наносячи _%1$d - %2$d шкоди._ Камінь також оточить вас, надаючи захист, пропорційний до нанесеної шкоди. Якщо буде отримано достатню кількість кам'яного щита, він перетвориться у кам'яного захисника на наступний хід.
items.wands.wandoflivingearth.upgrade_stat_name_2=Максимальне здоров'я вартового
items.wands.wandoflivingearth.upgrade_stat_name_3=Блокування вартового
items.wands.wandoflivingearth.bmage_desc=Коли _бойовий маг_ вражає ворога жезлом живої землі, частина завданої шкоди повертається у вигляді кам'яного захисту.
items.wands.wandoflivingearth.eleblast_desc=Стихійний вибух з жезлом живої землі завдає 50% шкоди і лікує активного земляного охоронця за кожного ураженого ворога.
items.wands.wandoflivingearth$rockarmor.name=кам'яний обладунок
items.wands.wandoflivingearth$rockarmor.desc=Магічний камінь оточив ваше тіло, намагаючись вас захистити. При наступній атаці він знизить отриману шкоду на 50%%. Проте, кожна заблокована атака послаблює кам'яний щит.\n\nЗалишок Щита: %1$d.\n\nЯкщо ви маєте достатньо каменю навколо вас, наступний постріл жезлу перетворить ваш кам'яний щит на Захисника, який битиметься на вашому боці.\n\nЩиту необхідно для формування Захисника: %2$d.
items.wands.wandoflivingearth$rockarmor.desc_many=Цей земляний вартовий також користується силою багатьох. Ходів залишилося: %d.
items.wands.wandoflivingearth$earthguardian.name=кам'яний вартовий
items.wands.wandoflivingearth$earthguardian.desc=Камінь, прикликаний вашим жезлом, перетворився на Кам'яного Вартового! Він атакуватиме ворогів поблизу, змушуючи їх нападати на нього, а не на вас. Коли ворогів навколо не лишиться, Вартовий перетвориться назад у щит та повернеться при наступному застосуванні жезла.
items.wands.wandoflivingearth$earthguardian.wand_info=Захисна сила вартового залежить від рівня вашого жезла. Зараз він здатен заблокувати _%1$d-%2$d шкоди._
items.wands.wandoflivingearth$earthguardian.discover_hint=Ви можете знайти цього персонажа за допомогою певного жезла.

items.wands.wandofmagicmissile.name=жезл магічних стріл
items.wands.wandofmagicmissile.staff_name=патериця магічних стріл
items.wands.wandofmagicmissile.desc=Цей доволі простий жезл запускає стріли з чистої енергії. Хоча і будучи позбавленим будь-яких особливих ефектів, цей жезл має більше зарядів та трохи посилює інші жезли, будучи покращеним.
items.wands.wandofmagicmissile.stats_desc=Кожна магічна стріла наносить _%1$d-%2$d шкоди_ та трохи посилить інші жезли, якщо цей покращений.
items.wands.wandofmagicmissile.bmage_desc=Коли _бойовий маг_ вражає ворога жезлом магічних стріл, всі його жезли отримують додатковий заряд.
items.wands.wandofmagicmissile.eleblast_desc=Стихійний вибух з жезлом магічних стріл завдає 50% шкоди і дає магу 15 ходів перезарядки.
items.wands.wandofmagicmissile.discover_hint=Один з героїв починає з цього предмета.
items.wands.wandofmagicmissile$magiccharge.name=магічний заряд
items.wands.wandofmagicmissile$magiccharge.desc=Ваш Жезл Магічних Стріл повертає силу іншим жезлам, посилюючи їх наступне використання.\n\nВаші жезли посилені до: +%d.\n\nХодів Магічного Заряду лишилось: %s.

items.wands.wandofprismaticlight.name=жезл чистого світла
items.wands.wandofprismaticlight.staff_name=патериця чистого світла
items.wands.wandofprismaticlight.desc=Цей жезл зроблений з суцільного шматка осяйного кристала, схожого на гладке скло. Спалахи світла танцюють навколо верхівки, готові відправитися вперед.
items.wands.wandofprismaticlight.stats_desc=Цей жезл випускає промені світла, які пронизують темряву підземелля, виявляючи приховані місця та пастки. Промінь також осліпить ворогів та нанесе _%1$d-%2$d шкоди._ Демони та нечисть спалахнуть у праведному вогні, отримуючи додаткову шкоду.
items.wands.wandofprismaticlight.upgrade_stat_name_2=Шанс осліплення
items.wands.wandofprismaticlight.upgrade_stat_name_3=Тривалість світла
items.wands.wandofprismaticlight.bmage_desc=Коли _бойовий маг_ вражає супротивника жезлом чистого світла, він буде покалічений на час, який залежить від рівня жезла.
items.wands.wandofprismaticlight.eleblast_desc=Стихійний вибух з жезлом чистого світла завдає 67% шкоди, розкриває місцевість і засліплює ворогів на 5 ходів.

items.wands.wandofregrowth.name=жезл відродження
items.wands.wandofregrowth.staff_name=патериця відродження
items.wands.wandofregrowth.desc=Цей жезл зроблений з тонкого шматка різьбленого дерева. Якимось чином, він досі живий та яскравий, наче серцевина молодого деревця. "Коли життя згасає, нове життя народжується... Вічний цикл ніколи не перерветься!"
items.wands.wandofregrowth.stats_desc=При використанні цей жезл стріляє конусом потужної енергії росту, оживляючи траву, коріння і рідкісні рослини. Наступний її постріл поглине _%1$d заряд(ів)_. Чим більше зарядів використовує жезл, тим більшим і сильнішим буде ефект.
items.wands.wandofregrowth.degradation=Після використання ще _%d зарядів_ цей жезл перестане вирощувати рослини і нову траву. Це обмеження можна збільшити, підвищуючи свій рівень або рівень жезла.
items.wands.wandofregrowth.upgrade_stat_name_1=Трави за заряд
items.wands.wandofregrowth.upgrade_stat_name_2=Загальна межа трави
items.wands.wandofregrowth.bmage_desc=Коли _бойовий маг_ вражає ворога патерицею росту і стоїть на траві, він отримує природне зцілення пропорційно завданій шкоді.
items.wands.wandofregrowth.eleblast_desc=Стихійний вибух з жезлом відродження обплутує ворогів і беспорядочно вирощує траву в області вибуху.
items.wands.wandofregrowth$dewcatcher.name=Росянка
items.wands.wandofregrowth$dewcatcher.desc=Росянки - дивовижні рослини, які накопичують магічну росу. Вони намагаються замаскуватися у густій траві, проте сяйво зібраної роси видає їх.
items.wands.wandofregrowth$dewcatcher.discover_hint=Ви можете знайти цю рослину за допомогою певного жезлу.
items.wands.wandofregrowth$seedpod.name=Насінник
items.wands.wandofregrowth$seedpod.desc=Насінники - магічні рослини, які лишають по собі насіння інших рослин замість свого. Тим не менш, вони здатні якось розмножуватись, не маючи власного насіння.
items.wands.wandofregrowth$seedpod.discover_hint=Ви можете знайти цю рослину за допомогою певного жезлу.
items.wands.wandofregrowth$lotus.name=Золотий лотос
items.wands.wandofregrowth$lotus.desc=Золотий лотос - містична рослина, яка може бути створена лише потужним жезлом відродження. Його аура посилює всі рослини навколо та їх ефекти, але спаливши всю свою енергію, він швидко гине.
items.wands.wandofregrowth$lotus.wand_info=Цей лотос був створений жезлом відродження _+%1$d_. Всі рослини в радіусі його дії _миттєво спрацюють_, якщо посаджені під персонажем. Вони також матимуть _%2$d%% шанс_ лишити по собі насіння, а змазані дротики матимуть на _%3$d%% менше міцності_.
items.wands.wandofregrowth$lotus.discover_hint=Ви можете знайти цю рослину за допомогою спеціального жезлу, попередньо покращивши його кілька разів.

items.wands.wandoftransfusion.name=жезл передачі
items.wands.wandoftransfusion.staff_name=патериця передачі
items.wands.wandoftransfusion.ondeath=Ти вбив себе своїм жезлом передачі
items.wands.wandoftransfusion.charged=Ваша патериця заряджена життєвою енергією ворога!
items.wands.wandoftransfusion.desc=Хоч і будучи доволі просто зробленим, цей жезл вирізняється пурпуровим руків'ям та вугільно-чорним каменем на верхівці.
items.wands.wandoftransfusion.stats_desc=При використанні на союзників і причарованих ворогів, жезл висмоктує _%1$d здоров'я користувача_, лікуючи або захищаючи на _%2$d здоров'я._ При використанні на ворогів жезл ненадовго зачаровує їх, одночасно накладаючи на користувача  _%3$d захисту_. Агресивна нечисть отримує _%4$d-%5$d шкоди_ замість причарування.
items.wands.wandoftransfusion.upgrade_stat_name_1=Зцілення союзників
items.wands.wandoftransfusion.upgrade_stat_name_2=Самозахист
items.wands.wandoftransfusion.upgrade_stat_name_3=Шкода від нечисті
items.wands.wandoftransfusion.bmage_desc=Коли _бойовий маг_ вражає зачарованого ворога патерицею передачі, він отримує щит, а його наступний постріл цією патерицею не буде коштувати здоров’я.
items.wands.wandoftransfusion.eleblast_desc=Стихійний вибух з жезлом передачі зачаровує ворогів, лікує союзників і завдає 100% шкоди нечисті.

items.wands.wandofwarding.name=жезл охорони
items.wands.wandofwarding.staff_name=патериця охорони
items.wands.wandofwarding.no_more_wards=Ваш жезл не може прикликати більше охоронців.
items.wands.wandofwarding.bad_location=Ви не можете розмістити тут охоронця.
items.wands.wandofwarding.desc=Цей короткий металевий жезл має яскравий фіолетовий кристал, що левітує навколо верхівки.
items.wands.wandofwarding.stats_desc=Замість нанесення прямої шкоди ворогам, цей жезл прикликатиме нерухомих охоронців та вартових. Вони можуть бути прикликані всюди, навіть за стінами, якщо ви мажте там огляд. Цей жезл може витримати _%d енергії_ підтримки охоронців одночасно.
items.wands.wandofwarding.upgrade_stat_name_1=Шкода від вартового
items.wands.wandofwarding.upgrade_stat_name_2=Енергія вартового
items.wands.wandofwarding.bmage_desc=Коли _бойовий маг_ вражає ворога патерицею охорони, усі активні охоронці та вартові мають шанс зцілитися.
items.wands.wandofwarding.eleblast_desc=Стихійний вибух із жезлом охорони лікує всіх охоронців та вартових у зоні вибуху.
items.wands.wandofwarding$ward.desc_generic_ward=Цей жезл буде автоматично посилати заряди у ворогів, що зайдуть у його радіус огляду.\n\nВикористання вашого Жезлу Охорони покращить його.\n\nЖезл має обмежену кількість пострілів перш ніж розсіється.
items.wands.wandofwarding$ward.desc_generic_sentry=Цей вартовий має таку саму бойову міць, що й охоронець, але має очки здоров'я замість встановленої кількості зарядів. Він нагадує кристал на кінчику вашого жезлу охорони. \n\nВикористання вашого жезлу охорони покращить та вилікує його.\n\nЦей вартовий витрачатиме певний відсоток здоров'я з кожною атакою, проте може бути вилікуваний вашим жезлом.
items.wands.wandofwarding$ward.name_1=менший охоронець
items.wands.wandofwarding$ward.desc_1=Цей базовий охоронець буде автоматично посилати заряди у ворогів, що зайдуть у його радіус огляду, наносячи _%1$d - %2$d шкоди._\n\nВикористання вашого Жезлу Охорони покращить його.\n\nЦей Охоронець може атакувати лише один раз перед зникненням.\n\nВаш Жезл Охорони використовує _%3$d енергії для підтримки цього Охоронця.
items.wands.wandofwarding$ward.name_2=охоронець
items.wands.wandofwarding$ward.desc_2=Цей покращений охоронець, на відміну від свого меншого родича, може атакувати кілька разів. Кожна його атака нанесе _%1$d - %2$d шкоди._\n\nВикористання вашого Жезлу Охорони покращить його.\n\nЦей Охоронець може атакувати лише тричі перед зникненням.\n\nВаш Жезл Охорони використовує _%3$d енергії_ для підтримки цього Охоронця.
items.wands.wandofwarding$ward.name_3=майстер охоронець
items.wands.wandofwarding$ward.desc_3=Найсильніший з-поміж охоронців може атакувати більше разів, ніж його попередники. Кожна його атака нанесе _%1$d - %2$d шкоди._\n\nВикористання вашого жезлу охорони покращить його.\n\nЦей охоронець може атакувати п'ять разів перед зникненням.\n\nВаш жезл охорони використовує _%3$d енергії_ для підтримки цього охоронця.
items.wands.wandofwarding$ward.name_4=менший вартовий
items.wands.wandofwarding$ward.desc_4=Цей менший вартовий має таку саму бойову міць, що й майстер охоронець, але має очки здоров'я замість встановленої кількості зарядів. Він нагадує кристал на кінчику вашого жезлу охорони. Кожна його атака завдаватиме _%1$d-%2$d шкоди._\n\nВикористання вашого жезлу охорони покращить та вилікує його.\n\nЦей вартовий витрачатиме певний відсоток здоров'я з кожною атакою, проте може бути вилікуваний вашим жезлом.\n\nВаш жезл охорони використовує _%3$d енергії_ для підтримки цього вартового.
items.wands.wandofwarding$ward.name_5=вартовий
items.wands.wandofwarding$ward.desc_5=Покращений вартовий більший та витриваліший.  Кожна його атака нанесе _%1$d - %2$d шкоди._\n\nВикористання вашого жезлу охорони покращить та вилікує його.\n\nЦей вартовий витрачатиме певний відсоток здоров'я з кожною атакою, проте може бути вилікуваний вашим жезлом.\n\nВаш жезл охорони використовує _%3$d енергії_ для підтримки цього вартового.
items.wands.wandofwarding$ward.name_6=майстер вартовий
items.wands.wandofwarding$ward.desc_6=Повністю покращений вартовий значно міцніший від своїх попередників. Кожна його атака нанесе _%1$d - %2$d шкоди._\n\nВикористання вашого жезлу охорони вилікує його.\n\nЦей вартовий витрачатиме певний відсоток здоров'я з кожною атакою, проте може бути вилікуваний вашим жезлом.\n\nВаш жезл охорони використовує _%3$d енергії_ для підтримки цього вартового.
items.wands.wandofwarding$ward.discover_hint=Ви можете знайти цього персонажа за допомогою певного жезла.
items.wands.wandofwarding$ward.dismiss_title=Розвіяти охоронця?
items.wands.wandofwarding$ward.dismiss_body=Ви можете розвіяти цього охоронця, якщо ви більше не хочете, щоб ваш жезл підтримував його. Це негайно його знищить.\n\nРозвіяти охоронця?
items.wands.wandofwarding$ward.dismiss_confirm=так
items.wands.wandofwarding$ward.dismiss_cancel=ні

###weapon curses
items.weapon.curses.annoying.name=%s надокучливості
items.weapon.curses.annoying.msg_1=ОХХ, МИ Б'ЄМОСЯ, ЧИ ЩО?
items.weapon.curses.annoying.msg_2=ТАК, ТРИМАЙТЕ ЙОГО!
items.weapon.curses.annoying.msg_3=АГОВ, ПОСЛУХАЙ!
items.weapon.curses.annoying.msg_4=ЦЕ ВЖЕ БОС, ТАК!?
items.weapon.curses.annoying.msg_5=ЙОЙ, НЕ РОЗМАХУЙ МНОЮ ТАК СИЛЬНО!
items.weapon.curses.annoying.msg_6=ПОМРИ, КОМАХО!
items.weapon.curses.annoying.msg_7=УУУУУУУУУУУУУУУХ!
items.weapon.curses.annoying.msg_8=МОЖЕ ПЕРЕПОЧИНЕМО!?
items.weapon.curses.annoying.msg_9=БУМ, ХАХА!
items.weapon.curses.annoying.msg_10=ГАРНИЙ УДАР!
items.weapon.curses.annoying.msg_11=Я не збирався бути зброєю, я хотів просто бути сокирою лісоруба.
items.weapon.curses.annoying.msg_12=Не забувайте, надмірна самовпевненість це повільний і підступний вбивця.
items.weapon.curses.annoying.msg_13=ВСЯ ВАША БАЗА НАЛЕЖИТЬ НАМ!
items.weapon.curses.annoying.desc=Надокучлива зброя здатна говорити, але вона занадто енергійна. Вона часто привертає зайву увагу до вас, навіть цього не прагнучи.
items.weapon.curses.annoying.elestrike_desc=Стихійний удар із дратівливим прокляттям має 20% шанс розбурхати кожного ворога в радіусі протягом 6 ходів.

items.weapon.curses.dazzling.name=%s засліплення
items.weapon.curses.dazzling.desc=Засліплююча зброя іноді створює спалах світла, що сліпить всіх, хто її побачить.
items.weapon.curses.dazzling.elestrike_desc=Стихійний удар із сліпучим прокляттям має 50% шанс осліпити кожного ворога в радіусі дії на 6 ходів.

items.weapon.curses.displacing.name=%s зміщення
items.weapon.curses.displacing.desc=Зброя зміщення наділена хаотичною магією телепортації та може переміщувати ворогів по поверху випадковим чином та на випадкову відстань.
items.weapon.curses.displacing.elestrike_desc=Стихійний удар з прокляттям зміщення з імовірністю 50% переносить кожного ворога в радіусі дії.

items.weapon.curses.explosive.name=вибуховий %s
items.weapon.curses.explosive.warm=Тепло...
items.weapon.curses.explosive.hot=Гаряче!
items.weapon.curses.explosive.desc=Вибухова зброя постійно нарощує потужність та вибухає, пошкоджуючи все, що знаходиться поблизу.
items.weapon.curses.explosive.desc_cool=Зараз ваша зброя холодна на дотик.
items.weapon.curses.explosive.desc_warm=Ваша зброя нарощує енергію і стає теплою...
items.weapon.curses.explosive.desc_hot=Ваша зброя гаряча! Вона от-от вибухне!
items.weapon.curses.explosive.elestrike_desc=Стихійний удар з прокляттям вибуху з імовірністю 50% підриває випадкового ворога в радіусі дії.

items.weapon.curses.friendly.name=%s дружби
items.weapon.curses.friendly.desc=Дружня зброя найкраще підходить для пацифістів, іноді прикликючи магію причарування, роблячи бій неможливим.
items.weapon.curses.friendly.elestrike_desc=Стихійний удар із дружнім прокляттям має 50% шанс зачарувати кожного ворога в радіусі дії на 6 ходів.

items.weapon.curses.polarized.name=%s поляризації
items.weapon.curses.polarized.desc=Зброя з поляризацією викликає магічний ефект, від якого її атака може завдавати на 50% більше шкоди, або не завдавати її зовсім.
items.weapon.curses.polarized.elestrike_desc=Стихійний удар з прокляттям поляризації має 50% шансу завдати 24-36 одиниць шкоди кожному ворогу в радіусі дії.

items.weapon.curses.sacrificial.name=%s пожертви
items.weapon.curses.sacrificial.desc=Зброя пожертви вимагатиме крові власника в обмін на використання у бою. Чим здоровіший власник, тим більше крові забере прокляття.
items.weapon.curses.sacrificial.elestrike_desc=Стихійний удар з прокляттям пожертви викликає кровотечу у героя і кожного ворога в радіусі дії на 12 здоров'я.

items.weapon.curses.wayward.name=%s мінливості
items.weapon.curses.wayward.desc=Мінлива зброя іноді стає вкрай неточною. Ця магія триває деякий час після активації, але її можна розвіяти, завдавши удару мінливою зброєю.
items.weapon.curses.wayward.elestrike_desc=Стихійний удар з прокляттям мінливості має 50% шансу заклясти кожного ворога в радіусі дії на 6 ходів.
items.weapon.curses.wayward$waywardbuff.name=мінливий
items.weapon.curses.wayward$waywardbuff.desc=Активувалася магія на вашій мінливій зброї, від якої вона стає вкрай неточною на деякий час. Зверніть увагу, що це не впливає на гарантовані удари, такі як несподівані атаки. Успішна атака з мінливої зброї негайно розвіє цей ефект.\n\nЗалишилося ходів: %s.

###enchantments
items.weapon.enchantments.blazing.name= %s вогняних чар
items.weapon.enchantments.blazing.desc=Це зачарування наділяє зброю здатністю плюватись вогнем, підпалюючи ворогів і завдаючи бонусної шкоди тим, хто вже горить.
items.weapon.enchantments.blazing.elestrike_desc=Стихійний удар з зачаруванням вогню поширює полум'я на всі плитки в радіусі дії, впродовж 8 ходів.

items.weapon.enchantments.blocking.name=%s оборони
items.weapon.enchantments.blocking.desc=Блокуюча зброя може ненадовго захистити вас після атаки цією зброєю.
items.weapon.enchantments.blocking.elestrike_desc=Стихійний удар з чарами оборони дає Дуелянту додаткові 6 одиниць захисту за кожного ворога в радіусі дії.
items.weapon.enchantments.blocking$blockbuff.name=оборона
items.weapon.enchantments.blocking$blockbuff.desc=Зачарування оборони на вашій зброї ненадовго посилило ваш обладунок захистом!\n\nЗалишилося захисту: %d.\n\nЗалишилося ходів: %s.

items.weapon.enchantments.blooming.name=%s цвітіння
items.weapon.enchantments.blooming.desc=Квітуча зброя містить магію, яка змусить рослинність проростати на ворогах, які були уражені цією зброєю, або навколо них.
items.weapon.enchantments.blooming.elestrike_desc=Стихійний удар з чарами цвітіння покриває травою до 8 плиток в радіусі дії та знерухомлює всіх ворогів в радіусі дії на 6 ходів.

items.weapon.enchantments.chilling.name= %s холоду
items.weapon.enchantments.chilling.desc=Вороги, уражені цим зачаруванням, задубівають, рухаючись та атакуючи повільніше.
items.weapon.enchantments.chilling.elestrike_desc=Стихійний удар з чарами холоду поширює крижане повітря на всі плитки в радіусі дії, впродовж 8 ходів.

items.weapon.enchantments.kinetic.name=%s кінетики
items.weapon.enchantments.kinetic.desc=Вбивши ворога кінетичною зброєю, вся надмірна шкода зберігається в зброї та застосується під час наступної успішної атаки.
items.weapon.enchantments.kinetic.elestrike_desc=Стихійний удар з чарами кінетики завдає 40% збереженої шкоди кожному ворогу в радіусі дії, окрім основної цілі.
items.weapon.enchantments.kinetic$conserveddamage.name=збережена шкода
items.weapon.enchantments.kinetic$conserveddamage.desc=Ваша зброя зберегла надлишкову шкоду від попереднього вбивства, і застосує її, як бонусну, у наступній атаці. Енергія буде повільно зменшуватись з часом.\n\nЗбережена шкода: %d.

items.weapon.enchantments.corrupting.name= %s панування
items.weapon.enchantments.corrupting.desc=Ці потужні чари володіють здатністю підкорення ворогів. Коли ворога вбивають цією зброєю, є шанс, що він постане з мертвих та підкориться вашій волі.
items.weapon.enchantments.corrupting.elestrike_desc=Стихійний удар з чарами панування, має 5-25% шансу (залежно від втраченого здоров'я) підкорити всіх ворогів в радіусі дії, окрім основної цілі.

items.weapon.enchantments.elastic.name=%s пружності
items.weapon.enchantments.elastic.desc=Зброя пружності має шанс відкинути ворогів назад, хоча лише на короткі відстані.
items.weapon.enchantments.elastic.elestrike_desc=Стихійний удар з чарами пружності відкидає всіх ворогів в радіусі дії на 5 плиток назад.

items.weapon.enchantments.grim.name=%s вироку
items.weapon.enchantments.grim.desc=Ці потужні чари володіють здатністю миттєво вбивати ворога. Ефект має все більший шанс спрацювати, коли ворог слабшає.
items.weapon.enchantments.grim.elestrike_desc=Стихійний удар із зачаруванням вироку має шанс у 6-30% (залежно від недостатнього здоров'я) щоб вбити всіх ворогів у радіусі, крім основної цілі.

items.weapon.enchantments.lucky.name=%s удачі
items.weapon.enchantments.lucky.desc=Вороги, які були вбиті зброєю удачі, мають шанс залишити додаткову здобич.
items.weapon.enchantments.lucky.elestrike_desc=Стихійний удар з чарами удачі має 12.5% шансу утворити предмет під кожним ворогом у радіусі дії. Цей ефект спрацьовує лише один раз для кожного ворога.

items.weapon.enchantments.projecting.name=%s проекції
items.weapon.enchantments.projecting.desc=З цим заклинанням зброя ближнього бою отримає додатковий радіус дії. Зброя дальнього бою буде пробивати стіни, якщо націлена на близькі цілі.
items.weapon.enchantments.projecting.elestrike_desc=Стихійний удар з чарами проєкції завдає 30% шкоди кожному ворогу в радіусі дії, окрім основної цілі.

items.weapon.enchantments.shocking.name= %s розрядів
items.weapon.enchantments.shocking.desc=Електричні дуги, що вискакують з цієї зброї, наносять додаткову шкоду всім ворогам поруч.
items.weapon.enchantments.shocking.elestrike_desc=Стихійний удар з чарами розряду поширює струм на всі плитки в радіусі дії, впродовж 8 ходів.

items.weapon.enchantments.unstable.name= %s хаосу
items.weapon.enchantments.unstable.desc=Це зачарування випромінює хаотичну енергію, з кожним ударом застосовуючи різні зачарування.
items.weapon.enchantments.unstable.elestrike_desc=Стихійний удар із зачаруванням хаосу викличе випадковий ефект зачарування в кожного ворога в радіусі дії, крім основної цілі.

items.weapon.enchantments.vampiric.name=%s вампіризму
items.weapon.enchantments.vampiric.desc=Це потужне зачарування дозволяє витягувати життєву силу з ворога при кожному ударі. Ефект посилюється, коли у власника мало здоров'я.
items.weapon.enchantments.vampiric.elestrike_desc=Стихійний удар з чарами вампіризму зцілює дуелянта на 2.5 HP за кожного ворога в радіусі дії.


###melee weapons
items.weapon.melee.assassinsblade.name=клинок вбивці
items.weapon.melee.assassinsblade.stats_desc=Ця зброя сильніша при неочікуваних атаках
items.weapon.melee.assassinsblade.ability_name=затаїтися
items.weapon.melee.assassinsblade.typical_ability_desc=Дуелянт може _затаїтися_ тримаючи в руках стилет убивці. Ця здатність дозволяє їй миттєво переміщатись на відстані до 3 плиток і зазвичай надає їй _%d ходів невидимості_.
items.weapon.melee.assassinsblade.ability_desc=Дуелянт може _затаїтися_ тримаючи в руках стилет убивці. Ця здатність дозволяє їй миттєво переміщатись на відстані до 3 плиток і надає їй _%d ходів невидимості_.
items.weapon.melee.assassinsblade.upgrade_ability_stat_name=Тривалість вміння
items.weapon.melee.assassinsblade.desc=Невелике хвилясте лезо з обсидіану, яким, попри його малу вагу, складно користуватись, може наносити справді смертельні удари.

items.weapon.melee.battleaxe.name=Бойова сокира
items.weapon.melee.battleaxe.stats_desc=Це досить точна зброя.
items.weapon.melee.battleaxe.ability_name=потужний удар
items.weapon.melee.battleaxe.typical_ability_desc=Дуелянт може здійснити _потужний удар_ бойовою сокирою. Ця зосереджена атака зазвичай завдає _%1$d-%2$d шкоди_ якщо вона застала ворога зненацька та оглушає на 5 ходів, знижуючи точність і ухилення на 50%%. Потужний удар завжди завдає звичайної шкоди, якщо не застає зненацька.
items.weapon.melee.battleaxe.ability_desc=Дуелянт може здійснити _потужний удар_ бойовою сокирою. Ця зосереджена атака завдає _%1$d-%2$d шкоди_ якщо вона застала ворога зненацька та оглушає на 5 ходів, знижуючи точність і ухилення на 50%%. Потужний удар завжди завдає звичайної шкоди, якщо не застає зненацька.
items.weapon.melee.battleaxe.desc=Величезне сталеве лезо цієї бойової сокири здатне наносити важкі пошкодження.

items.weapon.melee.crossbow.name=Арбалет
items.weapon.melee.crossbow.typical_stats_desc=Зазвичай ця зброя посилює метальні дротики, завдаючи _%1$d-%2$d шкоди_, коли вона споряджена, і навіть надає їм своє зачарування.
items.weapon.melee.crossbow.stats_desc=Ця зброя посилює метальні дротики, завдаючи _%1$d-%2$d шкоди_, коли вона споряджена, і навіть надає їм своє зачарування.
items.weapon.melee.crossbow.ability_name=заряджений постріл
items.weapon.melee.crossbow.typical_ability_desc=Дуелянтка може _зарядити_ свій арбалет, що призведе до того, що її наступна звичайна атака з ним завжди влучить і застосовує один із трьох ефектів: атаки ближнього бою відкидають ворогів, а не змазані дротики зазвичай завдають _+%1$d шкоди_, і змазані дротики застосовують свій ефект у зоні 7x7 і зазвичай тривають на _%2$d більше застосувань_.
items.weapon.melee.crossbow.ability_desc=Дуелянтка може _зарядити_ свій арбалет, що призведе до того, що її наступна звичайна атака з ним завжди влучить і застосовує один із трьох ефектів: атаки ближнього бою відкидають ворогів, а не змазані дротики завдають _+%1$d шкоди_, і змазані дротики застосовують свій ефект у зоні 7x7 і тривають на _%2$d більше застосувань_.
items.weapon.melee.crossbow.desc=Досить складна зброя, яка стріляє дротиками на виняткових швидкостях. Вага цього арбалета та міцна конструкція роблять його гідною зброєю для ближнього бою, хоч він для цього і не призначений.
items.weapon.melee.crossbow.upgrade_ability_stat_name=Посилення вмінь
items.weapon.melee.crossbow$chargedshot.name=заряджений
items.weapon.melee.crossbow$chargedshot.desc=Дуелянтка спрямовує силу в свій арбалет. Наступна атака, яку вона зробить з ним, завжди вражатиме та застосовуватиме один із трьох ефектів:\n- Атаки ближнього бою відкидають ворогів на кілька плиток.\n- Не змазані дротики завдадуть додаткової шкоди.\n- Змазані дротики отримають додаткове застосування та діють у зоні 7x7. Позитивні ефекти від дротиків впливатимуть лише на союзників, а шкідливі – лише на ворогів. Дуелянтка не може використовувати цю здатність для застосування позитивних ефектів дротиків для себе.

items.weapon.melee.cudgel.name=дрючок
items.weapon.melee.cudgel.stats_desc=Ця зброя досить точна.
items.weapon.melee.cudgel.ability_name=потужний удар
items.weapon.melee.cudgel.typical_ability_desc=Дуелянт може здійснити _потужний удар_ дрючком. Ця зосереджена атака зазвичай завдає _%1$d-%2$d шкоди_ якщо вона застала ворога зненацька та оглушає на 5 ходів, знижуючи точність і ухилення на 50%%. Потужний удар завжди завдає звичайної шкоди, якщо не застає зненацька.
items.weapon.melee.cudgel.ability_desc=Дуелянт може здійснити _потужний удар_ дрючком. Ця зосереджена атака завдає _%1$d-%2$d шкоди_ якщо вона застала ворога зненацька та оглушає на 5 ходів, знижуючи точність і ухилення на 50%%. Потужний удар завжди завдає звичайної шкоди, якщо не застає зненацька.
items.weapon.melee.cudgel.desc=Невелика латунна булава, зроблена більше як знаряддя самозахисту для шляхти, ніж як зброя для пригод.
items.weapon.melee.cudgel.discover_hint=Один з героїв починає з цього предмета.

items.weapon.melee.dagger.name=кинджал
items.weapon.melee.dagger.stats_desc=Ця зброя сильніша при неочікуваних атаках.
items.weapon.melee.dagger.ability_name=затаїтися
items.weapon.melee.dagger.typical_ability_desc=Дуелянт може _затаїтися_ тримаючи в руках кинджал. Ця здатність дозволяє їй миттєво переміщатись на відстані до 5 плиток і зазвичай надає їй _%d ходів невидимості_.
items.weapon.melee.dagger.ability_desc=Дуелянт може _затаїтися_ тримаючи в руках кинджал. Ця здатність дозволяє їй миттєво переміщатись на відстані до 5 плиток і надає їй _%d ходів невидимості_, але коштує 2 заряди.
items.weapon.melee.dagger.upgrade_ability_stat_name=Тривалість вміння
items.weapon.melee.dagger.desc=Простий залізний кинджал зі зношеною дерев'яною ручкою.
items.weapon.melee.dagger.discover_hint=Один з героїв починає з цього предмета.

items.weapon.melee.dirk.name=кортик
items.weapon.melee.dirk.stats_desc=Ця зброя сильніша при неочікуваних атаках.
items.weapon.melee.dirk.ability_name=затаїтися
items.weapon.melee.dirk.typical_ability_desc=Дуелянт може _затаїтися_ тримаючи в руках кортик. Ця здатність дозволяє їй миттєво переміщатись на відстані до 4 плиток і зазвичай надає їй _%d ходів невидимості_.
items.weapon.melee.dirk.ability_desc=Дуелянт може _затаїтися_ тримаючи в руках кортик. Ця здатність дозволяє їй миттєво переміщатись на відстані до 5 плиток і надає їй _%d ходів невидимості_, але коштує 2 заряди.
items.weapon.melee.dirk.upgrade_ability_stat_name=Тривалість вміння
items.weapon.melee.dirk.desc=Трохи довший та міцніший кинджал, що дає змогу наносити збільшену шкоду.

items.weapon.melee.flail.name=Бойовий ціп
items.weapon.melee.flail.stats_desc=Ця зброя - неточна.\nЦією зброєю не можна атакувати зненацька.
items.weapon.melee.flail.ability_name=обертати
items.weapon.melee.flail.spin_warn=Ви більше не можете обертати ціп.
items.weapon.melee.flail.typical_ability_desc=Дуелянт може _обертати_ ціп, щоб на короткий час збільшити його силу. Кожен з 3 обертів ціпа зазвичай буде завдавати _+%d шкоди_ під час наступної звичайної атаки. Обертаючись, ціп також гарантовано влучає у ворога. Лише почати обертати ціп коштує заряд.
items.weapon.melee.flail.ability_desc=Дуелянт може _обертати_ ціп, щоб на короткий час збільшити його силу. Кожен з 3 обертів ціпа буде завдавати _+%d шкоди_ під час наступної звичайної атаки. Обертаючись, ціп також гарантовано влучає у ворога. Лише почати обертати ціп коштує заряд.
items.weapon.melee.flail.desc=Шипаста куля прикріплена до ручки за допомогою довгого ланцюга. Дуже незграбна зброя, але пряме влучення буде руйнівним.
items.weapon.melee.flail$spinabilitytracker.name=обертання
items.weapon.melee.flail$spinabilitytracker.desc=Дуелянт обертає свій ціп, нарощуючи шкоду для наступної звичайної атаки. Кожен оберт займає один хід, але збільшує шкоду, максимум на 3 оберти. Обертаючись, ціп також гарантовано влучає у ворога.\n\nНакручено обертів: %1$d%%.\nЗалишилось ходів: %2$s.

items.weapon.melee.gauntlet.name=Кам'яна рукавичка
items.weapon.melee.gauntlet.stats_desc=Ця зброя дуже швидка.
items.weapon.melee.gauntlet.ability_name=комбо-удар
items.weapon.melee.gauntlet.typical_ability_desc=Дуелянт може здійснити _комбо-удар_ кам'яною рукавичкою. Ця атака гарантовано влучає і зазвичай завдає _+%d шкоди_ за кожен раз, коли дуелянт вдарила звичайною ближньою або кидальною зброєю. Якщо ви не влучаєте протягом 5 ходів, ця комбінація скидається.
items.weapon.melee.gauntlet.ability_desc=Дуелянт може здійснити _комбо-удар_ кам'яною рукавичкою. Ця атака гарантовано влучає і завдає _+%d шкоди_ за кожен раз, коли дуелянт вдарила звичайною ближньою або кидальною зброєю. Якщо ви не влучаєте протягом 5 ходів, ця комбінація скидається.
items.weapon.melee.gauntlet.desc=Ця масивна рукавиця зроблена з багряної тканини, вкритої важким магічним каменем. Тканина стискається навколо вашої руки, роблячи товсті кам'яні плити майже другою шкірою. Використання такої важкої зброї вимагає величезної могутності, але й додає руйнівної сили вашим ударам.

items.weapon.melee.glaive.name=глефа
items.weapon.melee.glaive.stats_desc=Ця зброя досить повільна.\nЦя зброя має збільшений радіус атаки.
items.weapon.melee.glaive.ability_name=пронизувати
items.weapon.melee.glaive.typical_ability_desc=Дуелянт може використати вістря глефи, щоб _пронизати_ ворога в радіусі атаки, але не поруч з нею. Це зазвичай завдає _%1$d-%2$d шкоди_, відкидає ворога назад і гарантовано влучає.
items.weapon.melee.glaive.ability_desc=Дуелянт може використати вістря глефи, щоб _пронизати_ ворога в радіусі атаки, але не поруч з ним. Це завдає _%1$d-%2$d шкоди_, відкидає ворога назад і гарантовано влучає.
items.weapon.melee.glaive.desc=Масивний спис, у якого лезо меча замість наконечника.

items.weapon.melee.gloves.name=шиповані рукавиці
items.weapon.melee.gloves.stats_desc=Ця зброя дуже швидка.
items.weapon.melee.gloves.ability_name=комбо-удар
items.weapon.melee.gloves.typical_ability_desc=Дуелянт може здійснити _комбо-удар_ шипованими рукавицями. Ця атака гарантовано влучає і зазвичай завдає _+%d шкоди_ за кожен раз, коли дуелянт вдарила звичайною ближньою або кидальною зброєю. Якщо ви не влучаєте протягом 5 ходів, ця комбінація скидається.
items.weapon.melee.gloves.ability_desc=Дуелянт може здійснити _комбо-удар_ шипованими рукавицями. Ця атака гарантовано влучає і завдає _+%d шкоди_ за кожен раз, коли дуелянт вдарила звичайною ближньою або метальною зброєю. Якщо ви не влучаєте протягом 5 ходів, ця комбінація скидається.
items.weapon.melee.gloves.desc=Ці рукавиці не забезпечують ніякого реального захисту, але вони можуть виступати в якості зброї, зберігаючи руки вільними.
items.weapon.melee.gloves.discover_hint=Один з героїв починає з цього предмета.

items.weapon.melee.greataxe.name=бердиш
items.weapon.melee.greataxe.stats_desc=Ця зброя неймовірно важка.
items.weapon.melee.greataxe.ability_name=відплата
items.weapon.melee.greataxe.typical_ability_desc=Дуелянт може здійснити атаку _відплати_ бердишем, якщо у неї залишилося менше ніж 50%% здоров'я. Ця нищівна атака зазвичай завдає _%1$d-%2$d шкоди_, гарантовано влучає та відбувається миттєво, якщо вбиває ворога.
items.weapon.melee.greataxe.ability_desc=Дуелянт може здійснити атаку _відплати_ бердишем, якщо у неї залишилося менше ніж 50%% здоров'я. Ця нищівна атака завдає _%1$d-%2$d шкоди_, гарантовано влучає та відбувається миттєво, якщо вбиває ворога.
items.weapon.melee.greataxe.desc=Розрахована для носіння на плечі, ця велетенська сокира настільки ж руйнівна, наскільки важка.

items.weapon.melee.greatshield.name=егіда
items.weapon.melee.greatshield.typical_stats_desc=Зазвичай це зброя блокує 0-%d ушкоджень. Цей показник росте з покращенням зброї.
items.weapon.melee.greatshield.stats_desc=Ця зброя блокує 0-%d ушкоджень. Цей показник росте з покращенням зброї.
items.weapon.melee.greatshield.ability_name=захист
items.weapon.melee.greatshield.typical_ability_desc=Дуелянт може _захистити_ себе егідою, стаючи повністю невразливою до наступних фізичних або магічних атак, спрямованих проти неї зазвичай впродовж _%d ходів_. Захист закінчиться, якщо Дуелянт атакує або скористається магією після того, як заблокувала атаку.
items.weapon.melee.greatshield.ability_desc=Дуелянт може _захистити_ себе егідою, стаючи повністю невразливою до наступних фізичних або магічних атак, спрямованих проти неї впродовж _%d ходів_. Захист закінчиться, якщо Дуелянт атакує або скористається магією після того, як заблокувала атаку.
items.weapon.melee.greatshield.upgrade_ability_stat_name=Тривалість вміння
items.weapon.melee.greatshield.desc=Більш подібна до пересувної стіни, ця егіда дає великий захист, проте нею важко атакувати.

items.weapon.melee.greatsword.name=Цвайхандер
items.weapon.melee.greatsword.ability_name=розсікти
items.weapon.melee.greatsword.typical_ability_desc=Дуелянт може _розсікти_ ворога цвайхандером. Це зазвичай завдає _%1$d-%2$d шкоди_ та гарантовано влучає. Якщо, розсікаючи противника, Дуелянт вбиває його, це стається миттєво і вона може використати цю атаку ще раз безплатно протягом 5 ходів.
items.weapon.melee.greatsword.ability_desc=Дуелянт може _розсікти_ ворога цвайхандером. Це завдає _%1$d-%2$d шкоди_ та гарантовано влучає. Якщо, розсікаючи противника, Дуелянт вбиває його, це стається миттєво і вона може використати цю атаку ще раз безплатно протягом 5 ходів.
items.weapon.melee.greatsword.desc=Це довжелезне лезо завдає великих ушкоджень, вкладаючи свою велетенську масу у кожен удар.

items.weapon.melee.handaxe.name=сокира
items.weapon.melee.handaxe.stats_desc=Це досить точна зброя.
items.weapon.melee.handaxe.ability_name=потужний удар
items.weapon.melee.handaxe.typical_ability_desc=Дуелянт може здійснити _потужний удар_ ручною сокирою. Ця зосереджена атака зазвичай завдає _%1$d-%2$d шкоди_ якщо вона застала ворога зненацька та оглушає на 5 ходів, знижуючи точність і ухилення на 50%%. Потужний удар завжди завдає звичайної шкоди, якщо не застає зненацька.
items.weapon.melee.handaxe.ability_desc=Дуелянт може здійснити _потужний удар_ ручною сокирою. Ця зосереджена атака завдає _%1$d-%2$d шкоди_ якщо вона застала ворога зненацька та оглушає на 5 ходів, знижуючи точність і ухилення на 50%%. Потужний удар завжди завдає звичайної шкоди, якщо не застає зненацька.
items.weapon.melee.handaxe.desc=Легка сокира, найчастіше застосовувана для рубання дерев, але також підходяща і для ворожих голів.

items.weapon.melee.katana.name=катана
items.weapon.melee.katana.stats_desc=Ця зброя блокує 0-3 пошкоджень.
items.weapon.melee.katana.ability_name=випад
items.weapon.melee.katana.typical_ability_desc=Дуелянт може зробити _випад_ катаною на ворога, який знаходиться на відстані 1 плитки від неї. Вона рухається у бік ворога, зазвичай завдає _%1$d-%2$d шкоди_ та гарантовано влучає.
items.weapon.melee.katana.ability_desc=Дуелянт може зробити _випад_ катаною на ворога, який знаходиться на відстані 1 плитки від неї. Вона рухається у бік ворога, завдає _%1$d-%2$d шкоди_ та гарантовано влучає.
items.weapon.melee.katana.desc=Тонкий меч з великою металевою гардою над руків'ям.

items.weapon.melee.longsword.name=Клеймор
items.weapon.melee.longsword.ability_name=розсікти
items.weapon.melee.longsword.typical_ability_desc=Дуелянт може _розсікти_ ворога клеймором. Це зазвичай завдає _%1$d-%2$d шкоди_ та гарантовано влучає. Якщо, розсікаючи противника, Дуелянт вбиває його, це стається миттєво і вона може використати цю атаку ще раз безплатно протягом 5 ходів.
items.weapon.melee.longsword.ability_desc=Дуелянт може _розсікти_ ворога клеймором. Це завдає _%1$d-%2$d шкоди_ та гарантовано влучає. Якщо, розсікаючи противника, Дуелянт вбиває його, це стається миттєво і вона може використати цю атаку ще раз безплатно протягом 5 ходів.
items.weapon.melee.longsword.desc=Довге сталеве лезо цього меча відблискує заспокійливим світлом, хоча великий розмір робить його доволі важким.

items.weapon.melee.mace.name=булава
items.weapon.melee.mace.stats_desc=Це досить точна зброя.
items.weapon.melee.mace.ability_name=потужний удар
items.weapon.melee.mace.typical_ability_desc=Дуелянт може здійснити _потужний удар_ булавою. Ця зосереджена атака зазвичай завдає _%1$d-%2$d шкоди_ якщо вона застала ворога зненацька та оглушає на 5 ходів, знижуючи точність і ухилення на 50%%. Потужний удар завжди завдає звичайної шкоди, якщо не застає зненацька.
items.weapon.melee.mace.ability_desc=Дуелянт може здійснити _потужний удар_ булавою. Ця зосереджена атака завдає _%1$d-%2$d шкоди_ якщо вона застала ворога зненацька та оглушає на 5 ходів, знижуючи точність і ухилення на 50%%. Потужний удар завжди завдає звичайної шкоди, якщо не застає зненацька.
items.weapon.melee.mace.desc=Великий залізний наконечник цієї зброї завдає значних ушкоджень.

items.weapon.melee.magesstaff.name=Патериця мага
items.weapon.melee.magesstaff.ac_imbue=НАДІЛИТИ
items.weapon.melee.magesstaff.ac_zap=ВИСТРІЛИТИ
items.weapon.melee.magesstaff.prompt=Оберіть жезл
items.weapon.melee.magesstaff.imbue=Ви наділяєте свою патерицю силою %s.
items.weapon.melee.magesstaff.preserved=Жезл був збережений!
items.weapon.melee.magesstaff.imbue_desc=Ви впевнені, що хочете наділити свою чарівну паличку силою цього жезла?\n\nЯкщо жезл, який використовується для посилення, має такий же або вищий рівень за чарівну паличку, то чарівна паличка успадкує рівень цього жезлу плюс один із його власних покращень.
items.weapon.melee.magesstaff.imbue_level=В результаті цього процесу ми отримаємо _+%d жезла._
items.weapon.melee.magesstaff.imbue_unknown=Ви не знаєте рівень цієї палички, але це допоможе вам отримати щонайменше _+%d жезла._
items.weapon.melee.magesstaff.imbue_cursed=_Якщо ви зачаруєте прокляту паличку, то ваш жезл також стане проклятим!_
items.weapon.melee.magesstaff.imbue_lost=Це жезл, який наділяє силою вашу патерицю, _буде втрачений_.
items.weapon.melee.magesstaff.imbue_talent=Це жезл, який наділяє силою вашу патерицю, _повернеться з +0_.
items.weapon.melee.magesstaff.yes=Так, я впевнений
items.weapon.melee.magesstaff.no=Ні, я передумав
items.weapon.melee.magesstaff.desc=Ця патериця створена самим магом. Це унікальна магічна зброя. Замість того, щоб мати вроджену магічну силу, вона може бути наділена енергією будь-якого жезла.
items.weapon.melee.magesstaff.no_wand=В даний час патериця не має магічної сили, вона має бути _наділеною силою жезла_, перед тим, як почати її використовувати для заклинань.
items.weapon.melee.magesstaff.has_wand=Зараз патериця наділена силою _%s._
items.weapon.melee.magesstaff.cursed_wand=Ця патериця проклята, що робить її магію хаотичною та непередбачуваною.
items.weapon.melee.magesstaff.discover_hint=Один з героїв починає з цього предмета.

items.weapon.melee.meleeweapon.ac_ability=ЗДАТНІСТЬ
items.weapon.melee.meleeweapon.stats_known=Ця _%1$d-рангова_ зброя ближнього бою, яка наносить _%2$d-%3$d ушкоджень_ і вимагає щонайменше _%4$d сили_.
items.weapon.melee.meleeweapon.stats_unknown=Зазвичай ця _%1$d-рангова_ зброя ближнього бою, яка наносить _%2$d-%3$d ушкоджень_ і вимагає щонайменше _%4$d сили_.
items.weapon.melee.meleeweapon.probably_too_heavy=Ймовірно, ця зброя занадто важка для вас.
items.weapon.melee.meleeweapon.stats_desc=
items.weapon.melee.meleeweapon.ability_need_equip=Ви повинні вдягнути цю зброю, щоб використовувати її здатність.
items.weapon.melee.meleeweapon.ability_low_str=Ви недостатньо сильні, щоб використовувати вміння цієї зброї.
items.weapon.melee.meleeweapon.ability_no_charge=У вас недостатньо енергії, щоб використовувати це вміння.
items.weapon.melee.meleeweapon.ability_cant_use=Ви не можете використовувати це вміння зараз.
items.weapon.melee.meleeweapon.ability_no_target=Там немає цілі.
items.weapon.melee.meleeweapon.ability_target_range=Ця ціль недосяжна.
items.weapon.melee.meleeweapon.ability_occupied=Ця локація зайнята.
items.weapon.melee.meleeweapon.upgrade_ability_stat_name=Навички ураження
items.weapon.melee.meleeweapon.prompt=Оберіть ціль
items.weapon.melee.meleeweapon.swap=Змінити зброю
items.weapon.melee.meleeweapon.swap_full=Ви не можете робити це з повним інвентарем.


items.weapon.melee.shortsword.name=короткий меч
items.weapon.melee.shortsword.ability_name=розсікти
items.weapon.melee.shortsword.typical_ability_desc=Дуелянт може _розсікти_ ворога коротким мечем. Це зазвичай завдає _%1$d-%2$d шкоди_ та гарантовано влучає. Якщо, розсікаючи противника, Дуелянт вбиває його, це стається миттєво і вона може використати цю атаку ще раз безплатно протягом 5 ходів.
items.weapon.melee.shortsword.ability_desc=Дуелянт може _розсікти_ ворога коротким мечем. Це завдає _%1$d-%2$d шкоди_ та гарантовано влучає. Якщо, розсікаючи противника, Дуелянт вбиває його, це стається миттєво і вона може використати цю атаку ще раз безплатно протягом 5 ходів.
items.weapon.melee.shortsword.desc=Короткий меч, всього на кілька сантиметрів довший за кинджал.

items.weapon.melee.quarterstaff.name=ціпок
items.weapon.melee.quarterstaff.stats_desc=Ця зброя блокує 0-2 шкоди.
items.weapon.melee.quarterstaff.ability_name=оборонна стійка
items.weapon.melee.quarterstaff.typical_ability_desc=Дуелянт може стати в _захисну стійку_ з ціпком у руках. Стійка потроює шанс ухилення зазвичай на _%d ходів_ і активується миттєво, але коштує 2 заряди.
items.weapon.melee.quarterstaff.ability_desc=Дуелянт може стати в _захисну стійку_ з ціпком у руках. Стійка потроює шанс ухилення на _%d ходів_ і активується миттєво, але коштує 2 заряди.
items.weapon.melee.quarterstaff.upgrade_ability_stat_name=Тривалість вміння
items.weapon.melee.quarterstaff.desc=Ціпок з твердого сорту дерева, його кінці оббиті металом.
items.weapon.melee.quarterstaff$defensivestance.name=оборонна стійка
items.weapon.melee.quarterstaff$defensivestance.desc=Дуелянт використовує свій ціпок, щоб відбивати удари та снаряди. Поки вона перебуває в цій стійці, її ухилення від усіх атак потроюється.\n\nЗалишилося ходів: %s.

items.weapon.melee.rapier.name=рапіра
items.weapon.melee.rapier.stats_desc=Ця зброя блокує 0-1 шкоди.
items.weapon.melee.rapier.ability_name=випад
items.weapon.melee.rapier.typical_ability_desc=Дуелянт може зробити _випад_ катаною на ворога, який знаходиться на відстані 1 плитки від неї. Вона рухається у бік ворога, зазвичай завдає _%1$d-%2$d шкоди_ та гарантовано влучає.
items.weapon.melee.rapier.ability_desc=Дуелянт може зробити _випад_ рапірою на ворога, який знаходиться на відстані 1 плитки від неї. Вона рухається у бік ворога, завдає _%1$d-%2$d шкоди_ та гарантовано влучає.
items.weapon.melee.rapier.desc=Тонкий і довгий меч, який забезпечує захист замість рубаючої сили.
items.weapon.melee.rapier.discover_hint=Один з героїв починає з цього предмета.

items.weapon.melee.roundshield.name=круглий щит
items.weapon.melee.roundshield.typical_stats_desc=Зазвичай це зброя блокує 0-%d ушкоджень. Цей показник росте з покращенням зброї.
items.weapon.melee.roundshield.stats_desc=Ця зброя блокує 0-%d ушкоджень. Цей показник росте з покращенням зброї.
items.weapon.melee.roundshield.ability_name=захист
items.weapon.melee.roundshield.typical_ability_desc=Дуелянт може _захистити_ себе круглим щитом, стаючи повністю невразливою до наступних фізичних або магічних атак, спрямованих проти неї зазвичай впродовж _%d ходів_. Захист закінчиться, якщо Дуелянт атакує або скористається магією після того, як заблокувала атаку.
items.weapon.melee.roundshield.ability_desc=Дуелянт може _захистити_ себе круглим щитом, стаючи повністю невразливою до наступних фізичних або магічних атак, спрямованих проти неї впродовж _%d ходів_. Захист закінчиться, якщо Дуелянт атакує або скористається магією після того, як заблокувала атаку.
items.weapon.melee.roundshield.upgrade_ability_stat_name=Тривалість вміння
items.weapon.melee.roundshield.desc=Цей великий щит ефективно блокує атаки, а у крайніх випадках його можна використовувати, як зброю.
items.weapon.melee.roundshield$guardtracker.name=варта
items.weapon.melee.roundshield$guardtracker.guarded=під вартою
items.weapon.melee.roundshield$guardtracker.desc=Дуелянт підготувала свій щит, очікуючи на атаку. Наступна фізична або магічна атаки будуть заблоковані.\n\nЗалишилось ходів: %s.

items.weapon.melee.runicblade.name=рунічний клинок
items.weapon.melee.runicblade.stats_desc=Ця зброя отримує більше сили при покращенні.
items.weapon.melee.runicblade.ability_name=рунічний удар
items.weapon.melee.runicblade.typical_ability_desc=Дуелянт може здійснити _рунічний удар_ рунічним клинком. Ця атака гарантовано влучає і зазвичай _збільшує силу зачарування на +%d%%_.
items.weapon.melee.runicblade.ability_desc=Дуелянт може здійснити _рунічний удар_ рунічним клинком. Ця атака гарантовано влучає і _збільшує силу зачарування на +%d%%_.
items.weapon.melee.runicblade.upgrade_ability_stat_name=Сила вміння
items.weapon.melee.runicblade.desc=Таємнича зброя з далеких земель, з яскраво-синім лезом.

items.weapon.melee.sai.name=парні стилети
items.weapon.melee.sai.stats_desc=Ця зброя дуже швидка.
items.weapon.melee.sai.ability_name=комбо-удар
items.weapon.melee.sai.typical_ability_desc=Дуелянт може здійснити _комбо-удар_ парними стилетами. Ця атака гарантовано влучає і зазвичай завдає _+%d шкоди_ за кожен раз, коли дуелянт вдарила звичайною ближньою або кидальною зброєю. Якщо ви не влучаєте протягом 5 ходів, ця комбінація скидається.
items.weapon.melee.sai.ability_desc=Дуелянт може здійснити _комбо-удар_ парними стилетами. Ця атака гарантовано влучає і завдає _+%d шкоди_ за кожен раз, коли дуелянт вдарила звичайною ближньою або кидальною зброєю. Якщо ви не влучаєте протягом 5 ходів, ця комбінація скидається.
items.weapon.melee.sai.desc=Два тонких леза для носіння у кожній руці. Найкраще підходять для знищення ворогів серією блискавичних ударів.
items.weapon.melee.sai$combostriketracker.name=комбо-удар
items.weapon.melee.sai$combostriketracker.desc=Дуелянт нарощує комбо, яке можна використати для збільшення шкоди від здібності комбо-удару. Кожна успішна звичайна атака ближнього бою або метальною зброєю буде зарахована, але неуспішна атака протягом 5 ходів скидає цю комбінацію.\n\nКількість ударів: %1$d.\n\nХодів до того, як попадання скинуться: %2$s.

items.weapon.melee.scimitar.name=ятаган
items.weapon.melee.scimitar.stats_desc=Ця зброя досить швидка.
items.weapon.melee.scimitar.ability_name=танець меча
items.weapon.melee.scimitar.typical_ability_desc=Дуелянт може здійснити _танець меча_ з ятаганом. Ця стійка миттєво дає їй +60%% до швидкості атаки й +50%% до точності зазвичай на _%d ходів_.
items.weapon.melee.scimitar.ability_desc=Дуелянт може здійснити _танець меча_ з ятаганом. Ця стійка миттєво дає їй +60%% до швидкості атаки й +50%% до точності на _%d ходів_.
items.weapon.melee.scimitar.upgrade_ability_stat_name=Тривалість вміння
items.weapon.melee.scimitar.desc=Меч з товтим кривим лезом. Його форма дозволяє наносити швидкі, але менш потужні атаки.
items.weapon.melee.scimitar$sworddance.name=танець меча
items.weapon.melee.scimitar$sworddance.desc=Дуелянт завдає швидких імпульсних ударів, ніби танцюючи. Завдяки цій стійці вона атакує на 60%% швидше (достатньо, щоб атакувати двічі за хід ятаганом) і має +50%% до точності.\n\nЗалишилося ходів: %s.

items.weapon.melee.sickle.name=серп
items.weapon.melee.sickle.stats_desc=Це досить неточна зброя.
items.weapon.melee.sickle.ability_name=пожинати
items.weapon.melee.sickle.typical_ability_desc=Дуелянт може _пожинати_ ворога за допомогою серпа. Ця руйнівна атака гарантовано влучає і зазвичай завдає _%d шкоди._ Ця нищівна атака спричиняє кровотечу, якщо ціль не має імунітету.
items.weapon.melee.sickle.ability_desc=Дуелянт може _пожинати_ ворога за допомогою серпа. Ця руйнівна атака гарантовано влучає і завдає _%d шкоди._ Ця нищівна атака спричиняє кровотечу, якщо ціль не має імунітету.
items.weapon.melee.sickle.desc=Ручне сільськогосподарське приладдя, яке може одночасно бути сильною, але громіздкою зброєю.

items.weapon.melee.spear.name=спис
items.weapon.melee.spear.stats_desc=Ця зброя досить повільна.\nЦя зброя має збільшений радіус атаки.
items.weapon.melee.spear.ability_name=пронизувати
items.weapon.melee.spear.typical_ability_desc=Дуелянт може використати вістря списа, щоб _пронизати_ ворога в радіусі атаки, але не поруч з нею. Це зазвичай завдає _%1$d-%2$d шкоди_, відкидає ворога назад і гарантовано влучає.
items.weapon.melee.spear.ability_desc=Дуелянт може використати вістря списа, щоб _пронизати_ ворога в радіусі атаки, але не поруч з ним. Це завдає _%1$d-%2$d шкоди_, відкидає ворога назад і гарантовано влучає.
items.weapon.melee.spear.desc=Тонкий дерев'яний спис з гострим залізним наконечником.

items.weapon.melee.sword.name=Меч
items.weapon.melee.sword.ability_name=розсікти
items.weapon.melee.sword.typical_ability_desc=Дуелянт може _розсікти_ ворога мечем. Це зазвичай завдає _%1$d-%2$d шкоди_ та гарантовано влучає. Якщо, розсікаючи противника, Дуелянт вбиває його, це стається миттєво і вона може використати цю атаку ще раз безплатно протягом 5 ходів.
items.weapon.melee.sword.ability_desc=Дуелянт може _розсікти_ ворога мечем. Це завдає _%1$d-%2$d шкоди_ та гарантовано влучає. Якщо, розсікаючи противника, Дуелянт вбиває його, це стається миттєво і вона може використати цю атаку ще раз безплатно протягом 5 ходів.
items.weapon.melee.sword.desc=Гарно збалансований меч. Не дуже великий, але все ж довший за короткий меч.
items.weapon.melee.sword$cleavetracker.name=розсікти
items.weapon.melee.sword$cleavetracker.desc=Дуелянт готова продовжувати розсікати ворогів! Наступне розсікання не вимагатиме заряду зброї.\n\nХодів залишилося: %s.

items.weapon.melee.warhammer.name=бойовий молот
items.weapon.melee.warhammer.stats_desc=Ця зброя досить точна.
items.weapon.melee.warhammer.ability_name=потужний удар
items.weapon.melee.warhammer.typical_ability_desc=Дуелянт може здійснити _потужний удар_ бойовим молотом. Ця зосереджена атака зазвичай завдає _%1$d-%2$d шкоди_ якщо вона застала ворога зненацька та оглушає на 5 ходів, знижуючи точність і ухилення на 50%%. Потужний удар завжди завдає звичайної шкоди, якщо не застає зненацька.
items.weapon.melee.warhammer.ability_desc=Дуелянт може здійснити _потужний удар_ бойовим молотом. Ця зосереджена атака завдає _%1$d-%2$d шкоди_ якщо вона застала ворога зненацька та оглушає на 5 ходів, знижуючи точність і ухилення на 50%%. Потужний удар завжди завдає звичайної шкоди, якщо не застає зненацька.
items.weapon.melee.warhammer.desc=Мало хто може встояти перед нищівним ударом цієї велетенської маси сталі й свинцю, але для його ефективного використання потрібна велика сила.

items.weapon.melee.warscythe.name=бойова коса
items.weapon.melee.warscythe.stats_desc=Це досить неточна зброя.
items.weapon.melee.warscythe.ability_name=пожинати
items.weapon.melee.warscythe.typical_ability_desc=Дуелянт може _пожинати_ ворога за допомогою бойової коси. Ця руйнівна атака гарантовано влучає і зазвичай завдає _%d шкоди._ Ця нищівна атака спричиняє кровотечу, якщо ціль не має імунітету.
items.weapon.melee.warscythe.ability_desc=Дуелянт може _пожинати_ ворога за допомогою бойової коси. Ця руйнівна атака гарантовано влучає і завдає _%d шкоди._ Ця нищівна атака спричиняє кровотечу, якщо ціль не має імунітету.
items.weapon.melee.warscythe.desc=Це велике і громіздке приладдя було посилено, щоб краще різати ворогів, ніж пшеницю.

items.weapon.melee.whip.name=Батіг
items.weapon.melee.whip.stats_desc=Ця зброя має значно розширений радіус атаки.
items.weapon.melee.whip.ability_name=шмагнути
items.weapon.melee.whip.typical_ability_desc=Дуелянт може _вдарити батогом_ усіх ворогів навколо себе. Ця здатність зазвичай наносить _%1$d-%2$d шкоди_, зачіпає всіх ворогів у радіусі атаки та гарантовано влучає.
items.weapon.melee.whip.ability_desc=Дуелянт може _вдарити батогом_ усіх ворогів навколо себе. Ця здатність наносить _%1$d-%2$d шкоди_, зачіпає всіх ворогів у радіусі атаки та гарантовано влучає.
items.weapon.melee.whip.desc=Шипований наконечник цього батога хоч і наносить мало шкоди, але його дальність атаки не має аналогів.

items.weapon.melee.wornshortsword.name=зношений короткий меч
items.weapon.melee.wornshortsword.ability_name=розсікти
items.weapon.melee.wornshortsword.typical_ability_desc=Дуелянт може _розсікти_ ворога зношеним коротким мечем. Це зазвичай завдає _%1$d-%2$d шкоди_ та гарантовано влучає. Якщо, розсікаючи противника, Дуелянт вбиває його, це стається миттєво і вона може використати цю атаку ще раз безплатно протягом 5 ходів.
items.weapon.melee.wornshortsword.ability_desc=Дуелянт може _розсікти_ ворога зношеним коротким мечем. Це завдає _%1$d-%2$d шкоди_ та гарантовано влучає. Якщо, розсікаючи противника, Дуелянт вбиває його, це стається миттєво і вона може використати цю атаку ще раз безплатно протягом 5 ходів.
items.weapon.melee.wornshortsword.desc=Дуже короткий меч, зношений через інтенсивне використання. Він слабший і трохи легший, ніж звичайний короткий меч.
items.weapon.melee.wornshortsword.discover_hint=Один з героїв починає з цього предмета.


###missile weapons
items.weapon.missiles.darts.adrenalinedart.name=Дротик адреналіну
items.weapon.missiles.darts.adrenalinedart.desc=Ці дротики змащені сумішшю на основі скорополоху, що прискорить рух або атаки союзників, або на короткий час сповільнить рух або атаки ворогів. Сам дротик все ще шкодить ворогам, але не союзникам.

items.weapon.missiles.darts.blindingdart.name=Сліпучий дротик
items.weapon.missiles.darts.blindingdart.desc=На наконечник цього дротику було нанесено хімічну речовину на основі Спалахачу, яка осліпить свою ціль на короткий час. Однак дротик не дезорієнтує ціль, тому ворог все одно знатиме, де ви були.

items.weapon.missiles.darts.chillingdart.name=Морозяний дротик
items.weapon.missiles.darts.chillingdart.desc=На наконечник цього дротику було нанесено хімічну речовину на основі Морозяника, яка значно охолодить ціль.

items.weapon.missiles.darts.cleansingdart.name=очищуючий дротик
items.weapon.missiles.darts.cleansingdart.desc=Вістря цих дротиків покриті речовиною на основі магорози, яка тимчасово робить союзників несприйнятливими до всіх негативних ефектів або знімає позитивні ефекти з ворогів. Вороги можуть навіть ненадовго забути, що вони нападають на вас або тікають від вас. Сам дротик, як і раніше, шкідливий для ворогів, але не заподіє шкоди союзникам.

items.weapon.missiles.darts.dart.name=Дротик
items.weapon.missiles.darts.dart.ac_tip=ЗМАЗАТИ
items.weapon.missiles.darts.dart.prompt=Виберіть насінину
items.weapon.missiles.darts.dart.tip_title=Змазування дротиків
items.weapon.missiles.darts.dart.tip_desc=Насіння можна поєднати з одним або двома дротиками, щоб посилити їх. Кожен тип насіння видасть свій тип дротику, що має унікальний ефект.\n\nПоєднуючи дротик з цією насіниною, ви отримаєте _%s._
items.weapon.missiles.darts.dart.tip_all=змазати %1$d дротиків %2$d насіннинами
items.weapon.missiles.darts.dart.tip_two=змазати 2 дротики однією насіниною
items.weapon.missiles.darts.dart.tip_one=змазати 1 дротик однією насіниною
items.weapon.missiles.darts.dart.tip_cancel=скасувати
items.weapon.missiles.darts.dart.desc=Ці прості загострені дерев'яні тріски збалансовані так, щоб їх було комфортно кидати. Їх можна змазати речовинами насінин, щоб отримати бонусні ефекти для них.
items.weapon.missiles.darts.dart.unlimited_uses=Завдяки своїй простій конструкції, дротик не буде втрачати міцності при застосуванні.

items.weapon.missiles.darts.displacingdart.name=Портальний дротик
items.weapon.missiles.darts.displacingdart.desc=На наконечник цього дротику було нанесено хімічну речовину на основі Портальця, яка телепортуватиме  ворога, в якого ви поцілили, на невелику відстань.

items.weapon.missiles.darts.healingdart.name=Цілющий дротик
items.weapon.missiles.darts.healingdart.desc=Ці дротики вкриті складом на основі Соняха та будуть застосовувати лікування до цілі. Вони все ще наносять шкоду ворогам, проте безпечні для союзників.

items.weapon.missiles.darts.holydart.name=Святий дротик
items.weapon.missiles.darts.holydart.desc=Вістря цих дротиків змащені сумішшю на основі зорецвіту, що наділяє ціль священною енергією. Союзники і звичайні вороги стають благословленними, але нечисть чи демонічні вороги зазнають сильної шкоди. Сам дротик все ще шкодить ворогам, але не союзникам.

items.weapon.missiles.darts.incendiarydart.name=Запальний дротик
items.weapon.missiles.darts.incendiarydart.desc=На наконечник цього дротику було нанесено хімічну речовину на основі Драконки. Ця хімічна речовина дуже активна, і при влученні у ворога, він буде підпалений.

items.weapon.missiles.darts.paralyticdart.name=Паралітичний дротик
items.weapon.missiles.darts.paralyticdart.desc=На наконечник цього дротику було нанесено хімічну речовину на основі Дубокореня. Ця хімічна речовина паралізує свою ціль.

items.weapon.missiles.darts.poisondart.name=Отруйний дротик
items.weapon.missiles.darts.poisondart.desc=На наконечник цього дротику було нанесено хімічну речовину на основі Горемоху. Вона дуже токсична та отруїть ціль.

items.weapon.missiles.darts.rotdart.name=роз'їдаючий дротик
items.weapon.missiles.darts.rotdart.desc=Ці підступні дротики вкриті речовиною на основі гнилоягоди, що роз'їдає все, чого торкнеться вістря дротика. Сильні супротивники чинитимуть опір більшій частині ефекту, але корозія досить сильна, щоб вбити більшу частину звичайних монстрів. Ці дротики зберігають ефект довше, ніж інші, однак тривалість ефекту не може бути збільшена.
items.weapon.missiles.darts.rotdart.discover_hint=Ви можете створити цей предмет, використовуючи насіння з певного завдання.

items.weapon.missiles.darts.shockingdart.name=Штормовий дротик
items.weapon.missiles.darts.shockingdart.desc=На наконечник цього дротика було нанесено хімічну речовину на основі грозової лози, яка при влученні вдарить ворога слабким розрядом.

items.weapon.missiles.darts.tippeddart.ac_clean=ОЧИСТИТИ
items.weapon.missiles.darts.tippeddart.clean_title=Очистити дротики
items.weapon.missiles.darts.tippeddart.clean_desc=Ця дія видалить змазку з дротика, зробивши його звичайним.
items.weapon.missiles.darts.tippeddart.clean_all=очистити всі
items.weapon.missiles.darts.tippeddart.clean_one=очистити один
items.weapon.missiles.darts.tippeddart.cancel=скасувати
items.weapon.missiles.darts.tippeddart.uses_left=Цей набір дротиків має _%d/%d_ використань, перш ніж змазка зноситься..
items.weapon.missiles.darts.tippeddart.unlimited_uses=_Але вони настільки високоякісні, що не зношуються._
items.weapon.missiles.darts.tippeddart.about_to_break=Покриття вашого дротика скоро зітреться.
items.weapon.missiles.darts.tippeddart.has_broken=Покриття вашого дротика стерлось.
items.weapon.missiles.darts.tippeddart.discover_hint=Ви можете купити цей елемент у магазині або створити його за допомогою насіння.


items.weapon.missiles.bolas.name=Болас
items.weapon.missiles.bolas.stats_desc=Ця зброя калічить ціль.
items.weapon.missiles.bolas.desc=Ця незвичайна зброя не завдає великої шкоди, але чудово сповільнює ціль.

items.weapon.missiles.boomerang.name=Бумеранг
items.weapon.missiles.boomerang.desc=Будучи кинутою у ворога, ця зброя повернеться до рук її власника.
items.weapon.missiles.boomerang.durability=Завдяки своїй міцній конструкції цей бумеранг не зламається від використання.

items.weapon.missiles.fishingspear.name=Гарпун
items.weapon.missiles.fishingspear.desc=Крихітні метальні списи, які добре працюють як імпровізована зброя, незважаючи на те, що призначені для риболовлі.

items.weapon.missiles.forcecube.name=Силовий Куб
items.weapon.missiles.forcecube.ondeath=Ти вбив себе своїм силовим кубом...
items.weapon.missiles.forcecube.stats_desc=Ця зброя поширює силу свого удару на невелику площу, вражаючи все, що знаходиться поблизу.
items.weapon.missiles.forcecube.desc=Ці магічні кубики дивної форми досить малі, щоб їх можна було тримати в руці, але неймовірно важкі.

items.weapon.missiles.heavyboomerang.name=Важкий бумеранг
items.weapon.missiles.heavyboomerang.stats_desc=Через п'ять ходів ця зброя повертається до місця, звідки вона була кинута.
items.weapon.missiles.heavyboomerang.desc=Цим великим бумерангом важко ефективно володіти, але він завдасть значної шкоди.

items.weapon.missiles.javelin.name=Метальний спис
items.weapon.missiles.javelin.desc=Ці великі списи збалансовані так, щоб тримати наконечник попереду, коли вони розсікають повітря.

items.weapon.missiles.kunai.name=Кунай
items.weapon.missiles.kunai.stats_desc=Ця зброя сильніша проти необізнаних ворогів.
items.weapon.missiles.kunai.desc=Ці маленькі ножі дуже потужні в руках досвідченого користувача.

items.weapon.missiles.missileweapon.stats_known=Цей набір _%1$d-рангової_ метальної зброї завдасть _%2$d-%3$d шкоди_ і вимагає _%4$d сили_ для використання.
items.weapon.missiles.missileweapon.stats_unknown=Зазвичай цей набір _%1$d-рангової_ метальної зброї завдає _%2$d-%3$d шкоди_ і вимагає _%4$d сили_ для використання.
items.weapon.missiles.missileweapon.stats_desc=
items.weapon.missiles.missileweapon.probably_too_heavy=Можливо, ця зброя занадто важка для вас.
items.weapon.missiles.missileweapon.distance=Метальна зброя більш точна на відстані, але менш точна зблизька.
items.weapon.missiles.missileweapon.durability=Метальна зброя буде зношуватися і ламатись, коли вона використовується.
items.weapon.missiles.missileweapon.uses_left=У цього набору метальної зброї ще є _%d/%d_ кидків до того, як вона зламається.
items.weapon.missiles.missileweapon.unlimited_uses=Цей набір настільки якісний, що фактично служитиме вічно.
items.weapon.missiles.missileweapon.unknown_uses=Зазвичай цей набір метальної зброї буде мати _%d_ використань до того, як він зламається.
items.weapon.missiles.missileweapon.curse_discover=Ця метальна зброя проклята!
items.weapon.missiles.missileweapon.about_to_break=Ваша метальна зброя скоро зламається.
items.weapon.missiles.missileweapon.has_broken=Одна з ваших метальних зброй зламалась.
items.weapon.missiles.missileweapon.dust=Метальна зброя розсипається на порох, коли ви торкаєтесь її.
items.weapon.missiles.missileweapon.break_upgraded_warn_desc=Якщо остання метальна зброя у вашому покращеному наборі метальної зброї зламається, набір буде назавжди втрачено. Ви впевнені, що хочете її кинути?
items.weapon.missiles.missileweapon.break_upgraded_warn_yes=Так
items.weapon.missiles.missileweapon.break_upgraded_warn_no=Ні
items.weapon.missiles.missileweapon$placeholder.name=метальна зброя

items.weapon.missiles.shuriken.name=сюрикен
items.weapon.missiles.shuriken.stats_desc=Сюрікени можна кидати миттєво з перезарядкою у 20 ходів.
items.weapon.missiles.shuriken.desc=Ці зіркоподібні шматки металу з гострими лезами можна швидко кидати на ходу.
items.weapon.missiles.shuriken$shurikeninstanttracker.name=Перезарядка сюрікенів
items.weapon.missiles.shuriken$shurikeninstanttracker.desc=Нещодавно ви кинули сюрікен миттєво, і тепер повинні зачекати, перш ніж зробити це знову. Сюрікени все ще можна кидати, але зі звичайною швидкістю зброї.\n\nХодів залишилося: %s.

items.weapon.missiles.throwingclub.name=метальна довбня
items.weapon.missiles.throwingclub.stats_desc=Ця зброя не прилипає до ворогів і може відразу бути підібраною.
items.weapon.missiles.throwingclub.desc=Досить проста, але міцна метальна зброя, по суті, великий камінь, закріплений на палиці.

items.weapon.missiles.throwinghammer.name=метальний молот
items.weapon.missiles.throwinghammer.stats_desc=Ця зброя не прилипає до ворогів і може відразу бути підібраною.
items.weapon.missiles.throwinghammer.desc=Ці важкі молоти призначені для того, щоб кидати їх у ворога. Завдяки гладкій суцільнометалевій конструкції вони досить міцні.

items.weapon.missiles.throwingknife.name=метальний ніж
items.weapon.missiles.throwingknife.stats_desc=Ця зброя сильніша проти необізнаних ворогів.
items.weapon.missiles.throwingknife.desc=Ці легкі ножі збалансовані таким чином, щоб пронизувати повітря дугою прямо в ціль.
items.weapon.missiles.throwingknife.discover_hint=Один з героїв починає з цього предмета.

items.weapon.missiles.throwingspear.name=метальний дротик
items.weapon.missiles.throwingspear.desc=Ці легкі списи мають тонкі оправи, які призначені для метання, а не штовхання.

items.weapon.missiles.throwingspike.name=метальна шпилька
items.weapon.missiles.throwingspike.desc=Ці міцні загострені металеві списи призначені для того, щоб кидати їх у далеких ворогів.
items.weapon.missiles.throwingspike.discover_hint=Один з героїв починає з цього предмета.

items.weapon.missiles.throwingstone.name=метальний камінь
items.weapon.missiles.throwingstone.desc=Ці камені відшліфовані, щоб їх можна було кидати з більшою потужністю, ніж звичайний камінь.
items.weapon.missiles.throwingstone.discover_hint=Один з героїв починає з цього предмета.

items.weapon.missiles.tomahawk.name=томагавк
items.weapon.missiles.tomahawk.stats_desc=Ця зброя завдає _%1$d-%2$d кровотечі_ своїй цілі.
items.weapon.missiles.tomahawk.typical_stats_desc=Зазвичай ця зброя завдає _%1$d-%2$d кровотечі_ своїй цілі.
items.weapon.missiles.tomahawk.desc=Ці метальні сокири мають зубчастий край, який розривається, коли вони встромляються у ворога.

items.weapon.missiles.trident.name=тризубець
items.weapon.missiles.trident.desc=Масивний спис з трьома смертельними зубцями на кінці. Він важкий, але досить смертоносний.


items.weapon.spiritbow.name=лук душ
items.weapon.spiritbow.ac_shoot=ВИСТРІЛИТИ
items.weapon.spiritbow.prompt=Виберіть ціль
items.weapon.spiritbow.stats=Цей лук не можна покращити сувоєм, проте він сам буде покращуватись, коли ви підвищуватимете свій рівень. На поточному рівні, стріли, випущені з лука, будуть наносити _%1$d-%2$d ушкоджень_ . Лук вимагає _%3$d сили_, щоб нормально його використовувати.
items.weapon.spiritbow.desc=Лук, зроблений з давнього магічного дерева. Його тятива та візерунки сяють чистим блакитним світлом. Цей лук здатен створювати магічні стріли, а тому не потребує боєприпасів.
items.weapon.spiritbow.discover_hint=Один з героїв починає з цього предмета.

items.weapon.weapon.identify=Тепер ви добре знайомі зі своєю зброєю, щоб ідентифікувати її.
items.weapon.weapon.too_heavy=Через вашу недостатню силу, ця зброя зменшить вашу швидкість атаки, точність та здатність до несподіваних атак.
items.weapon.weapon.excess_str=Через свою надлишкову силу, ви наносимите _0-%d додаткової шкоди_. при використанні цієї зброї.
items.weapon.weapon.hardening_gone=Загартування цієї зброї стерлося!
items.weapon.weapon.incompatible=Взаємодія різних типів магії знищує чари на цій зброї!
items.weapon.weapon.cursed_worn=Оскільки ця зброя проклята, ви не здатні від неї позбавитись.
items.weapon.weapon.cursed=Ви відчуваєте, що у цій зброї ховається темна магія.
items.weapon.weapon.weak_cursed=Навіть незважаючи на те, що ця зброя проклята, ви можете зняти її.
items.weapon.weapon.not_cursed=Ця зброя вільна від темної магії.
items.weapon.weapon.faster=Ця зброя збалансована на підвищення _швидкості атаки_.
items.weapon.weapon.stronger=Ця зброя збалансована на підвищення _завдаваної шкоди_.
items.weapon.weapon.enchanted=вона має _%s._
items.weapon.weapon.enchant_hardened=Вона була _загартована._
items.weapon.weapon.hardened_no_enchant=Ця зброя була _загартована_, але наразі не зачарована.
items.weapon.weapon$enchantment.enchant=зачарування
items.weapon.weapon$enchantment.rankings_desc=Вбитий зачаруванням
items.weapon.weapon$enchantment.discover_hint=Ви можете знайти предмет з цим ефектом випадковим чином у підземеллі або спробувати застосувати його до предмета самостійно.


###misc items
items.amulet.name=Амулет Єндера
items.amulet.ac_end=ЗАВЕРШИТИ ГРУ
items.amulet.desc=Амулет Єндера - найпотужніший артефакт, що відомий людям та гномам. Його сяючі кристали несуть у собі небачену силу.\n\nЯк з'явився амулет - невідомо. Кажуть, що Король гномів знайшов його незадовго до падіння Метрополії. Як він його знайшов? Яким чином він програв Давньому Богу? Ці запитання лишаться на кращі часи - все що має значення зараз, це те, що він ваш!
items.amulet.desc_origins=Невідомо, звідки походить амулет. Але історія свідчить, що король дворфів виявив його незадовго до того, як цивілізація дворфів відмовилася від усіх зовнішніх контактів. Як він його виявив? Яким чином давній Бог отримав від нього амулет? Такі питання залишимо на пізніше, все, що важливо зараз - амулет у ваших руках!
items.amulet.desc_ascent=Невідомо, звідки походить амулет, але очевидно, що на нього сильно вплинула сила давнього Бога. Підземелля, здається, підкоряється волі давнього Бога, коли ви проходите по ньому, роблячи ворогів набагато численнішими і могутнішими! Ви також більше не можете активувати або викинути амулет, ніби він став проклятим.
items.amulet.ascent_title=Вознесіння
items.amulet.ascent_desc=Ви починаєте відчувати велику і жахливу силу давнього Бога, випромінювану амулетом. Сходження назад через підземелля в якості смертного може виявитися складнішим, ніж ви думали!\n\nЯкщо ви продовжите сходження з амулетом, підземелля стане небезпечнішим, телепорти між поверхами буде відключено, і ви зможете виграти гру тільки, якщо виберетеся з підземелля, перемагаючи ворогів!\n\nВи можете поки що залишити амулет тут, якщо хочете піднятися, не розпочинаючи це випробування, або активувати амулет для сходження, щоб завершити гру в звичайному режимі.
items.amulet.ascent_yes=Продовжити!
items.amulet.ascent_no=Зупинитися зараз
items.amulet.discover_hint=Ви можете знайти цей предмет на дні підземелля...

items.ankh.name=Анх
items.ankh.ac_bless=ОСВЯТИТИ
items.ankh.bless=Ви освятили анх чистою водою.
items.ankh.desc=Цей древній символ дарує можливість відродитися після смерті. Більшість ваших предметів буде збережено на місці смерті, і їх можна буде підібрати, коли ви повернетеся на це місце. Використовуючи повний бурдюк із водою, можна освятити анх, надавши йому додаткових сил.
items.ankh.desc_blessed=Цей древній символ безсмертя дає можливість повернутися до життя після смерті. Анх був благословенний і тепер набагато сильніший. Анх пожертвує собою, щоб врятувати вас у момент смертельної небезпеки.
items.ankh.discover_hint=Ви можете придбати цю річ у магазині.

items.arcaneresin.name=магічна смола
items.arcaneresin.prompt=Оберіть жезл
items.arcaneresin.ac_apply=ЗАСТОСУВАТИ
items.arcaneresin.level_too_high=Цей жезл занадто сильний, смола не може його поліпшити.
items.arcaneresin.not_enough=У вас недостатньо смоли для цього!
items.arcaneresin.apply=Ви огортаєте жезл смолою, роблячи його потужнішим!
items.arcaneresin.desc=Цей порошок переливається всіма кольорами від білого до фіолетового. Він може бути використаний як підсилювач магічних властивостей предмета, наприклад, жезлів!\n\nПокращення жезлів смолою витратить аж до трьох одиниць, ґрунтуючись на початковому рівні жезла. Смола може поліпшити жезл до рівня +3.\n\nОднак покращення смолою _замінюються іншими джерелами покращень_ (такими як сувої покращень) і не застосовуються під час злиттям жезлу в патерицю мага.
items.arcaneresin.discover_hint=Ви можете створити цей предмет за допомогою алхімії.

items.brokenseal.name=зламана печатка
items.brokenseal.ac_affix=ПРИКРІПИТИ
items.brokenseal.prompt=Оберіть обладунок
items.brokenseal.unknown_armor=Спочатку ви повинні розпізнати, проклятий цей обладунок чи ні.
items.brokenseal.cursed_armor=Печатку неможливо прикріпити до проклятого обладунку.
items.brokenseal.affix=Ви прикріпили печатку до свого обладунку!
items.brokenseal.desc=Воскова печатка, яку прикріплювали до обладунків як символ доблесті. У центрі викарбувано вицвілу руну захисту, а посередині вона розколота навпіл.\n\nНа згадку про рідну домівку, печатка допомагає воїну вистояти. Під час носіння печатки воїн миттєво отримує захист, коли його здоров'я знижується до половини або менше.\n\nПечатка може бути _прикріплена до обладунку,_ і переміщуватися між обладунками. Вона може нести з собою одне покращення, якщо це покращення було застосовано до обладунку, коли печатка була прикріплена до нього.
items.brokenseal.inscribed=На печатці є напис _%s._
items.brokenseal.choose_title=Оберіть Руну
items.brokenseal.choose_desc=І на обладунках, і на зламаній печатці є руни. Виберіть, яку руну слід зберегти.\n\nРуна обладунків: %1$s\nРуна зламаної печатки: %2$s\n\nЗверніть увагу, що якщо ви виберете руну, яка зараз знаходиться на обладунках, то згодом не зможете її перенести.
items.brokenseal.discover_hint=Один з героїв починає з цього предмета.
items.brokenseal$warriorshield.name=Захист воїна
items.brokenseal$warriorshield.desc_active=Зламана печатка воїна наразі допомагає йому вистояти, надаючи йому захист на додачу до здоров'я. Після того, як захист спрацює, він перезавантажується, перш ніж його можна буде використати знову.\n\nЦей захист не зникає з часом, але закінчується, якщо протягом кількох ходів поблизу немає ворогів. Коли він закінчується, будь-який невикористаний захист зменшує час перезарядки, максимум до 50%%.\n\nЗахисту залишилося: %1$d.\n\nПоточна перезарядка: %2$d.
items.brokenseal$warriorshield.desc_cooldown=Воїн нещодавно отримав захист від зламаної печатки, і повинен почекати, поки знову зможе скористатися її захисним ефектом.\n\nХодів залишилося: %d.
items.brokenseal$warriorshield.desc_negative_cooldown=Час відновлення щита Воїна наразі є від'ємним, що означає, що коли його щит активується, час відновлення буде меншим, ніж звичайні 150 ходів. Час відновлення щита може бути зменшений до -150 ходів, що означає, що він буде знову доступний одразу після активації.\n\nПоточний час відновлення: %d.

items.dewdrop.name=Крапля роси
items.dewdrop.already_full=Ви вже повністю здорові!
items.dewdrop.desc=Кришталево чиста росинка.\n\nЗавдяки магії цього місця, вона має відновлювальні властивості.

items.equipableitem.curse_detected=Ви відчуваєте, що річ проклята, ще до того, як ви її спорядите!
items.equipableitem.unequip_cursed=Ви не можете зняти проклятий предмет!
items.equipableitem.ac_equip=НАДЯГНУТИ
items.equipableitem.ac_unequip=ЗНЯТИ

items.energycrystal.name=енергетичний кристал
items.energycrystal.desc=Колекція маленьких магічних кристалів, наповнених алхімічною енергією.\n\nЦі кристали - найчастіший інгредієнт в алхімічних рецептах, їх можна отримати в алхімічному казані шляхом розщеплення розхідних предметів.

items.gold.name=золото
items.gold.desc=Купа золотих монет. Збирайте золоті монети, щоб витратити їх пізніше в магазині.

items.heap.for_sale=%1$dg:%2$s
items.heap.chest=Скриня
items.heap.chest_desc=Ви не дізнаєтесь, що всередині, поки не відкриєте!
items.heap.locked_chest=Замкнена скриня
items.heap.locked_chest_desc=Ви не дізнаєтесь, що всередині цієї скрині, поки не відкриєте її. Проте щоб відкрити цю скриню вам потрібен золотий ключ.
items.heap.crystal_chest=Кришталева скриня
items.heap.crystal_chest_desc=Ви бачите _%s_ всередині, але щоб відкрити цю скриню, вам потрібен кришталевий ключ.
items.heap.artifact=Артефакт
items.heap.wand=Жезл
items.heap.ring=Перстень
items.heap.tomb=Надгробок
items.heap.tomb_desc=Ця стародавня гробниця може містити щось корисне для вас, але її власник, безумовно, заперечуватиме.
items.heap.skeleton=Кості
items.heap.skeleton_desc=Це все, що залишилося від хоробрих авантюристів, які побували тут до вас. Можливо, варто покопатися в їх рештках.
items.heap.remains=Кості героя
items.heap.remains_desc=Це все, що залишилося від одного з ваших попередників. Можливо, варто покопатися в його рештках.

items.honeypot.name=медовий горщик
items.honeypot.ac_shatter=РОЗБИТИ
items.honeypot.desc=Це дійсно великий медовий горщик, проте замість меду в ньому знаходиться гігантська бджола! Цей вид масивних бджіл не любить покидати вулик, можливо, горщик - це якась спеціалізована пастка? Бджола веде себе спокійно, до тих пір, поки вона знаходиться всередині горщика з медом, і сердито гуде на вас, коли ви дивитеся на неї.
items.honeypot$shatteredpot.name=Розколотий медовий горщик
items.honeypot$shatteredpot.desc=Горщик був зруйнований, тільки клейкий мед, що покриває його стінки, утримує його від повного розпаду, і він повільно розклеюється.\n\nНезважаючи на його жахливий стан, бджола все ще бажає захищати цей горщик.

items.item.prompt=Оберіть місце для кидку
items.item.ac_drop=ВИКЛАСТИ
items.item.ac_throw=КИНУТИ
items.item.rankings_desc=Вас вбив  %s
items.item.curse=прокляття
items.item.custom_note_type=Цей тип позиції має власну нотатку: "_%s_"
items.item.custom_note=Цей предмет має власну нотатку: «_%s_»
items.item.discover_hint=Ви можете знайти цей предмет у підземеллі випадковим чином.

items.kindofmisc.unequip_title=Зняти предмет
items.kindofmisc.unequip_message=Спершу ви маєте зняти один з ваших споряджених предметів. Оберіть предмет для заміни.

items.kindofweapon.swift_equip=Ви швидко вдягли вашу зброю.
items.kindofweapon.equip_cursed=Ваша рука не може відпустити цю зброю.
items.kindofweapon.which_equip_msg=У яку комірку для зброї ви хотіли б спорядити цей предмет?\n\nЧемпіон атакує своєю основною зброєю, але може використовувати здібності обох. Основна та додаткова зброя мають спільну кількість зарядів.\n\nЧемпіон може миттєво міняти місцями основну та додаткову зброю.
items.kindofweapon.which_equip_primary=Основне (%s)
items.kindofweapon.which_equip_secondary=Додаткове (%s)
items.kindofweapon.empty=порожньо

items.kingscrown.name=Корона Короля дварфів
items.kingscrown.ac_wear=НАДЯГТИ
items.kingscrown.naked=На жаль, корона не здатна посилити спідню білизну.
items.kingscrown.upgraded=Корона зникає у спалаху сили, яка трансформує ваш обладунок!
items.kingscrown.ratgraded=Лапи Короля Щурів яскраво сяють, в той час як ваш обладунок трансформується!
items.kingscrown.desc=Корона останнього Короля дварфів, вона сяє від неймовірної магічної сили.\n\nБудучи надягнутою, корона перенесе свою силу у обладунок героя, перетворивши його на _унікальний епічний обладунок зі спеціальними здібностями._ Новий обладунок збереже усі властивості старого.
items.kingscrown.discover_hint=Ви можете отримати цей предмет у вигляді трофею з певних ворогів.

items.liquidmetal.name=рідкий метал
items.liquidmetal.ac_apply=ЗАСТОСУВАТИ
items.liquidmetal.prompt=Оберіть метальну зброю
items.liquidmetal.already_fixed=Ця метальна зброя вже в ідеальному стані!
items.liquidmetal.apply=Ви використовуєте %d рідкого металу для ремонту вашої метальної зброї.
items.liquidmetal.desc=Ця чарівна рідина може заповнити тріщини та розриви на метальній зброї, відновлюючи її до ідеального стану! Якщо в наборі зброї відсутня якась зброя, але в іншому вона повністю відремонтована, то рідкий метал можна використовувати навіть для заміни відсутньої зброї з набору!\n\nДля повного ремонту зброї 1-го рангу потрібно 10 рідкого металу, для зброї 5-го рангу - 30. Кожне покращення також збільшує кількість необхідного металу на 35%.\n\nРідкий метал не можна використовувати для ремонту наконечників на дротиках.
items.liquidmetal.discover_hint=Ви можете створити цей предмет за допомогою алхімії.

items.lostbackpack.name=загублений рюкзак
items.lostbackpack.desc=Це ваш загублений інвентар. Підберіть його, щоб повернути всі речі, які були втрачені вами!

items.merchantsbeacon.name=Торгівельний маяк
items.merchantsbeacon.ac_use=ВИКОРИСТАТИ
items.merchantsbeacon.desc=Ця дивна технологія дварфів дозволяє спілкуватися на великих відстанях.\n\nПісля активації цей маяк дозволить вам продавати товари до крамниці з будь-якого місця у підземеллі.\n\nТим не менш, магії всередині маяка вистачає лише на одну сесію, тому використовуйте його розумно.

items.stylus.name=чаклунський грифель
items.stylus.ac_inscribe=НАЧЕРТАТИ
items.stylus.prompt=Виберіть обладунок.
items.stylus.identify=Ви маєте спочатку розпізнати, чи цей обладунок проклятий.
items.stylus.cursed=Магія грифеля не діє на проклятий обладунок.
items.stylus.inscribed=Ви нанесли начертання грифелем на свій обладунок.
items.stylus.desc=Цей чаклунський грифель вироблений із якогось темного, вкрай твердого каменю. За допомогою нього ви зможете начертати магічну руну на свій обладунок, проте, яка саме це буде руна вирішить сам грифель, а не ви.

items.tengusmask.name=Маска Тенгу
items.tengusmask.ac_wear=НАДЯГТИ
items.tengusmask.used=Маска розсипається попелом, в той час як її сила вливається у вас!
items.tengusmask.desc=Ця маска злетіла з лиця Тенгу, як той загинув від вашого удару. ви відчуваєте велику силу у ній, можливо, Тенгу черпав з неї свою міць?\n\nБудучи надягненою, маска передасть вам свою силу, розблокуючи _вибір підкласу_.\n\nЯкий підклас оберете?
items.tengusmask.discover_hint=Ви можете отримати цей предмет у вигляді трофею з певних ворогів.

items.torch.name=Смолоскип
items.torch.ac_light=ЗАПАЛИТИ
items.torch.desc=Коли темрява здобуває силу, факел розжене її та освітить шлях до істини

items.waterskin.name=бурдюк
items.waterskin.ac_drink=ВИПИТИ
items.waterskin.collected=Ви зібрали краплю роси у свій бурдюк.
items.waterskin.full=Ваша баклага повна!
items.waterskin.empty=Ваша баклага пуста!
items.waterskin.desc=Місткість для рідини, зроблена зі шкіри та мотузки та затикана корком.
items.waterskin.desc_water=Наразі бурдюк містить лише звичайну питну воду. У підземеллі точно має щось бути, що можна сюди помістити.
items.waterskin.desc_heal=Баклага зараз зберігає цілющу воду. Чим більше вона заповнена, ти  сильніше ви вилікуєтесь як вип'єте з неї. Ви питимите якраз стільки, скільки треба для повного зцілення.
items.waterskin.desc_full=Повна баклага випромінює енергію, можливо вона зможе освятити ще якусь річ?
items.waterskin.discover_hint=Один з героїв починає з цього предмета.

