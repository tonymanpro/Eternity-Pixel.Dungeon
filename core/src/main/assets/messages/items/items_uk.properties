items.test_tubes.tubeoftranscendingtime.name=Tube of Transcending Time
items.test_tubes.tubeoftranscendingtime.desc=Use this thing to make time travelling work for 10 turns, actually it stops time.
items.test_tubes.tubeofgodspeed.name=Tube of Godspeed
items.test_tubes.tubeofgodspeed.desc=This powerful tube will increase the speed of the drinker 5 times.
