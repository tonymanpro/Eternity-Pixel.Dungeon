items.modules.mindvisionmodule.desc=A simple module that will let you see enemies on the floor.
items.modules.overloadmodule.name=Overload Module
items.modules.overloadmodule.desc=Be careful using this module as this will temporarily increase the mobs limit and its spawn rate.
items.modules.potionmodule.name=Potion Module
