items.artifacts.driedrose$wndghosthero.title=Спорядження привида
items.artifacts.driedrose$wndghosthero.desc=Самі по собі привиди слабкі, але їхня форма достатньо міцна, щоб мати на них зброю та обладунки. Вони зможуть використовувати ці предмети так само, як і ви.\n\nВ даний час привид може надягати предмети, що вимагають до _%d сили._
