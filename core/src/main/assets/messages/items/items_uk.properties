items.artifacts.etherealchains.cant_pull=Ваші ланцюги не можуть притягнути цю ціль.
items.artifacts.etherealchains.cant_reach=Ваші ланцюги не можуть туди дістатися.
items.artifacts.etherealchains.inside_wall=Ваші ланцюги можуть притягувати тільки через стіни, а не всередину них.
items.artifacts.etherealchains.nothing_to_grab=Тут немає за що зачепитися.
items.artifacts.etherealchains.prompt=Оберіть цільову локацію
items.artifacts.etherealchains.desc=Ці великі, але легкі ланцюги світяться духовною енергією. Їх можна використовувати, щоб притягувати вас до певного місця або тягнути ворогів до себе. Ефірна природа ланцюгів дозволяє їм навіть проникати крізь стіни!
items.artifacts.etherealchains.desc_cursed=Прокляті ланцюги обплуталися навколо вас та грізно свистять, намагаючись вас заплутати та повалити.
items.artifacts.etherealchains.desc_equipped=Ланцюги отримують енергію від переможених ворогів. Кожна одиниця енергії - це ланка ланцюга, яка дає сягає на одну плитку.
items.artifacts.etherealchains$chainsrecharge.levelup=Ваші ланцюги міцнішають!

items.artifacts.holytome.name=священний фоліант
items.artifacts.holytome.ac_cast=ЧАКЛУВАТИ
items.artifacts.holytome.no_spell=Зараз ти не можеш накласти це закляття.
items.artifacts.holytome.cursed=Ви не можете використовувати проклятий фоліант.
items.artifacts.holytome.levelup=Ваш фоліант стає сильнішим!
items.artifacts.holytome.desc=Священний фоліант, який слугує фокусом для божественної магії священника. Використання фоліанту дозволяє священнику накладати різноманітні магічні заклинання.\n\nПо мірі використання фоліанту буде ставати все потужнішим, даючи священнику більше максимальних зарядів і дещо збільшуючи швидкість перезарядки.
items.artifacts.holytome.discover_hint=Один з героїв починає з цього предмета.

