items.artifacts.skeletonkey.force_lock=The lock has weakened without your skeleton key. You manage to force it open.
items.artifacts.skeletonkey.discard=You discard your excess keys.
items.artifacts.skeletonkey.levelup=Your skeleton key grows stronger!
items.artifacts.skeletonkey.desc=An important-looking key with a head shaped like a skull. Its teeth seem to be different every time you look at them.
items.artifacts.skeletonkey.desc_worn=This magical key seems to gain power as you use it instead of the dungeon's regular keys. It can be inserted into almost any of the dungeon's locks to either open or close them, including doors that were never locked previously.\n\nThe key can even be used on empty space in a cardinal or diagonal direction to 'lock' the air in front of you, creating a 3 tile wide solid wall that lasts for 10 turns. Locking will push away enemies if there is space to do so.
items.artifacts.skeletonkey.desc_cursed=The cursed key seems to be actively avoiding fitting into any lock, and is even making it difficult (but not impossible) for you to use your other keys.
items.artifacts.skeletonkey$keywall.desc=A temporary magical wall has been placed here by the skeleton key.

items.artifacts.talismanofforesight.name=φυλαχτό της πρόβλεψης
items.artifacts.talismanofforesight.ac_scry=ΠΡΟΒΛΕΨΕ
items.artifacts.talismanofforesight.low_charge=Το φυλαχτό απαιτεί τουλάχιστον 5% φορτίο για να προβλέψει.
items.artifacts.talismanofforesight.prompt=Διάλεξε μία περιοχή να ελέγξεις.
items.artifacts.talismanofforesight.levelup=Το Φυλαχτό σου γίνεται πιο δυνατό!
items.artifacts.talismanofforesight.full_charge=Το φυλαχτό είναι πλήρως φορτισμένο!
items.artifacts.talismanofforesight.desc=Μια λεία πέτρα με παράξενα σκαλίσματα πάνω της. Νιώθεις να παρατηρεί τα πάντα γύρω σου, έχοντας το νου της για οτιδήποτε κρυμμένο.
items.artifacts.talismanofforesight.desc_worn=Νιώθεις τις αισθήσεις σου να οξύνονται όσο κρατάς το φυλαχτό. Το φυλαχτό αναπτύσσει αργά φορτίο με το πέρασμα του χρόνου, ή όταν ανακαλύπτεις κρυμμένες πόρτες και παγίδες.\n\nΜπορείς να ξοδέψεις το φορτίο του φυλαχτού για να «προβλέψεις» σε κωνικό σχήμα. Αυτό θα φανερώσει όλα τα τετράγωνα και τα μυστικά στη σαρωμένη περιοχή, και θα σου χαρίσει όραση πάνω σε εχθρούς κι αντικείμενα για ένα μικρό χρονικό διάστημα.
items.artifacts.talismanofforesight.desc_cursed=Το καταραμένο φυλαχτό σε κοιτάζει επίμονα, θαμπώνοντας τις αισθήσεις σου.
items.artifacts.talismanofforesight$foresight.name=διορατικότητα
items.artifacts.talismanofforesight$foresight.uneasy=Νιώθεις άβολα.
items.artifacts.talismanofforesight$foresight.desc=Έχεις μια μεγάλη νευρικότητα... σαν να υπάρχει κάποιος αφανής κίνδυνος εδώ κοντά.

items.artifacts.timekeepershourglass.name=κλεψύδρα του Χρονοφύλακα
items.artifacts.timekeepershourglass.ac_activate=ΕΝΕΡΓΟΠΟΙΗΣΕ
items.artifacts.timekeepershourglass.deactivate=Απενεργοποιείς το πάγωμα του χρόνου.
items.artifacts.timekeepershourglass.no_charge=Η κλεψύδρα δεν έχει επαναφορτιστεί αρκετά για να ξαναχρησιμοποιηθεί.
items.artifacts.timekeepershourglass.cursed=Δεν μπορείς να χρησιμοποιήσεις μία καταραμένη κλεψύδρα.
items.artifacts.timekeepershourglass.onstasis=Ο κόσμος δείχνει να μετατοπίζεται γύρω σου αστραπιαία.
items.artifacts.timekeepershourglass.onfreeze=Όλα γύρω σου ξαφνικά παγώνουν.
items.artifacts.timekeepershourglass.stasis=Βάλε με σε στασιμότητα
items.artifacts.timekeepershourglass.freeze=Πάγωσε τον χρόνο γύρω μου
items.artifacts.timekeepershourglass.prompt=Πώς θα ήθελες να χρησιμοποιήσεις τη μαγεία της κλεψύδρας;\n\nΣτη στασιμότητα, ο χρόνος κινείται κανονικά ενώ εσύ παγώνεις κι έχεις πλήρη ατρωσία από τα πάντα. Καταναλώνει έως και 2 φορτίο τη φορά.\n\nΌταν ο χρόνος παγώνει, μπορείς να κινείσαι χωρίς να καταναλώνουν χρόνο οι ενέργειές σου. Αυτό μπορεί να απενεργοποιηθεί οποιαδήποτε στιγμή, χρησιμοποιώντας την κλεψύδρα ή κάνοντας επίθεση.
items.artifacts.timekeepershourglass.desc=Αυτή η περίτεχνη κλεψύδρα δεν γεμίζει το μάτι, αλλά αισθάνεσαι μια μεγάλη δύναμη στο σμιλεμένο της πλαίσιο. Καθώς κυλά η άμμος, νιώθεις τη μαγεία της κλεψύδρας να σε τραβά. Λογικά αυτή η μαγεία θα σου χαρίσει έναν βαθμό ελέγχου πάνω στον χρόνο.
items.artifacts.timekeepershourglass.desc_hint=Η κλεψύδρα δείχνει να έχει χάσει άμμο. Μακάρι να μπορούσες να βρεις λίγη...
items.artifacts.timekeepershourglass.desc_cursed=Η καταραμένη κλεψύδρα είναι προσκολλημένη στο πλάι σου· τη νιώθεις να προσπαθεί να παραποιήσει τη ροή του χρόνου σου.
items.artifacts.timekeepershourglass$timefreeze.name=Πάγωμα χρόνου
items.artifacts.timekeepershourglass$timefreeze.desc=Ο χρόνος γύρω σου έχει παγώσει και μπορείς να εκτελείς ενέργειες ακαριαία. Η επίδραση θα διαρκέσει έως ότου ακυρωθεί, ή μέχρι να ξεμείνει η κλεψύδρα από ενέργεια. Η επίθεση ή η χρήση μαγείας θα ακυρώσουν κι αυτές την επίδραση.\n\nΓύροι έως ότου καταναλωθεί φορτίο: %s.
items.artifacts.timekeepershourglass$sandbag.name=ασκί μαγικής άμμου
items.artifacts.timekeepershourglass$sandbag.levelup=Προσθέτεις την άμμο στην κλεψύδρα σου.
items.artifacts.timekeepershourglass$sandbag.maxlevel=Η κλεψύδρα σου είναι γεμάτη με μαγική άμμο!
items.artifacts.timekeepershourglass$sandbag.no_hourglass=Δεν έχεις κάποια κλεψύδρα για να της βάλεις την άμμο.
items.artifacts.timekeepershourglass$sandbag.desc=Αυτό το σακίδιο ψιλής άμμου πρέπει να λειτουργεί άψογα με την κλεψύδρα σου.\n\nΕίναι περίεργο το γεγονός ότι ο μαγαζάτορας έχει το συγκεκριμένο αντικείμενο, ακριβώς τη στιγμή που το χρειάζεσαι...

items.artifacts.unstablespellbook.name=ασταθές βιβλίο ξορκιών
items.artifacts.unstablespellbook.ac_read=ΔΙΑΒΑΣΕ
items.artifacts.unstablespellbook.ac_add=ΠΡΟΣΘΕΣΕ
items.artifacts.unstablespellbook.blinded=Δεν μπορείς να διαβάσεις το βιβλίο ενώ έχεις τυφλωθεί.
items.artifacts.unstablespellbook.no_charge=Το βιβλίο ξορκιών δεν έχει ενέργεια αυτή τη στιγμή.
items.artifacts.unstablespellbook.cursed=Δεν μπορείς να διαβάσεις ένα καταραμένο βιβλίο ξορκιών.
items.artifacts.unstablespellbook.prompt=Επίλεξε έναν πάπυρο
items.artifacts.unstablespellbook.infuse_scroll=Εγχέεις την ενέργεια του παπύρου στο βιβλίο.
items.artifacts.unstablespellbook.unable_scroll=Δεν μπορείς να προσθέσεις αυτόν τον πάπυρο στο βιβλίο.
items.artifacts.unstablespellbook.unknown_scroll=Δεν γνωρίζεις το είδος του παπύρου ακόμη.
items.artifacts.unstablespellbook.desc=Αυτός ο τόμος είναι σε εκπληκτικά καλή κατάσταση δεδομένης της ηλικίας του. Βγάζει τσιριχτούς και κοφτούς ήχους ενώ γυρνάς τις σελίδες του, εκπέμποντας ασταθή ενέργεια. Ποιος ξέρει τι ξόρκι μπορεί να εκτελεστεί εάν το διαβάσεις.
items.artifacts.unstablespellbook.desc_cursed=Το καταραμένο βιβλίο έχει προσκολληθεί πάνω σου, εμποδίζοντας την ικανότητα χρήσης των περισσότερων παπύρων.
items.artifacts.unstablespellbook.desc_index=Το βιβλίο είναι ατελές. Το ευρετήριο δείχνει στις ακόλουθες κενές σελίδες:
items.artifacts.unstablespellbook.desc_empowered=Οι πάπυροι που έχεις προσθέσει στο βιβλίο ακτινοβολούν με ενέργεια. Μπορείς να επιλέξεις τις επιδράσεις των εξωτικών εκδοχών αυτών των παπύρων, με κόστος ενός επιπλέον φορτίου.
items.artifacts.unstablespellbook.read_empowered=Ο πάπυρος που πρόσθεσες στο βιβλίο εκτινάσσεται με ενέργεια. Μπορείς να αξιοποιήσεις είτε την κανονική είτε την εξωτική εκδοχή της επίδρασης του παπύρου.\n\nΗ επιλογή της εξωτικής εκδοχής θα σου κοστίσει 2 φορτίο αντί για 1.



###bags
items.bags.bag.name=σακίδιο
items.bags.bag.discover_hint=Μπορείς να αγοράσεις αυτό το αντικείμενο σε ένα μαγαζί.

items.bags.potionbandolier.name=ζώνη φίλτρων
items.bags.potionbandolier.desc=Αυτή η χοντρή ζώνη εφαρμόζει γύρω από το στήθος σου σαν κορδέλα. Έχει πολλά θερμομονωμένα λουριά πάνω της για να κρατά φιάλες φίλτρων, το φλασκί νερού, καθώς και φιάλες υγρού μετάλλου.\n\nΌσο είναι μες στη ζώνη, τα φίλτρα σου θα είναι προστατευμένα από το κρύο.

items.bags.scrollholder.name=θήκη παπύρων
items.bags.scrollholder.desc=Αυτό το σωληνοειδές δοχείο φαίνεται ιδανικό για τα εργαλεία και τα γραφήματα ενός αστρονόμου, αλλά και οι πάπυροί σου θα χωρέσουν μια χαρά. Έχει και κάποια πλαϊνά τμήματα που θα βόλευαν για τους κρυστάλλους ξορκιών, τα απόκρυφα κονδύλια και την απόκρυφη ρητίνη.\n\nΗ θήκη δεν δείχνει εύφλεκτη, οπότε οι πάπυροι θα είναι ασφαλείς από τη φωτιά εκεί μέσα.

items.bags.velvetpouch.name=βελούδινο πουγκί
items.bags.velvetpouch.desc=Αυτό το μικρό βελούδινο πουγκί μπορεί να αποθηκεύσει πολλά μικρά αντικείμενα μέσα, όπως σπόρους, ρουνικούς λίθους και κάποια αλχημικά συστατικά.
items.bags.velvetpouch.discover_hint=Ένας από τους ήρωες ξεκινά με αυτό το αντικείμενο.

items.bags.magicalholster.name=μαγική θήκη
items.bags.magicalholster.desc=Αυτή η λεπτή θήκη είναι φτιαγμένη από το δέρμα κάποιου εξωτικού ζώου. Η ισχυρή της μαγεία της επιτρέπει να αποθηκεύει μια μεγάλη ποσότητα όπλων απόστασης.\n\nΜπορείς απλά να βάζεις το χέρι σου στη θήκη και θα πιάνεις πάντα το αντικείμενο που ψάχνεις.\n\nΧάρη στη μαγεία της θήκης, τα ραβδιά θα φορτίζονται λίγο πιο γρήγορα --και τα όπλα ρίψης θα διαρκούν λίγο περισσότερο-- όταν βρίσκονται μέσα της.



###bombs
items.bombs.arcanebomb.name=απόκρυφη βόμβα
items.bombs.arcanebomb.desc=Αυτή η βόμβα έχει εμποτιστεί με μαγικές ιδιότητες. Θα προκαλέσει μια δυνατή έκρηξη παρόμοια με την επίθεση φουσκώματος του Γκου. Η έκρηξη θα προκαλέσει _%1$d-%2$d_ μαγική ζημιά σε οτιδήποτε εντός 2 τετραγώνων.
items.bombs.arcanebomb.discover_hint=Μπορείς να δημιουργήσεις αυτό το αντικείμενο μέσω αλχημείας.

items.bombs.bomb.name=βόμβα
items.bombs.bomb.ac_lightthrow=ΑΝΑΨΕ & ΠΕΤΑΞΕ
items.bombs.bomb.snuff_fuse=Σβήνεις γρήγορα το φυτίλι της βόμβας.
items.bombs.bomb.ondeath=Η έκρηξη σε εξόντωσε...
items.bombs.bomb.rankings_desc=Εξοντώθηκες από μια έκρηξη
items.bombs.bomb.desc=Μία ογκώδης βόμβα πυρίτιδας. Η έκρηξή της θα προκαλέσει _%1$d-%2$d ζημιά_ σε οτιδήποτε βρίσκεται δίπλα και θα καταστρέψει κάποιο από το διπλανό έδαφος ή/και κάποια από τα διπλανά αντικείμενα.
items.bombs.bomb.desc_fuse=Φαίνεται ότι το φυτίλι θα χρειαστεί δύο γύρους για να καεί αφού το ανάψεις.
items.bombs.bomb.desc_burning=Το φυτίλι της βόμβας καίγεται· κράτα απόσταση ή σβήστο!
items.bombs.bomb$doublebomb.name=δύο βόμβες
items.bombs.bomb$doublebomb.desc=Ένας σωρός από δύο ογκώδεις βόμβες πυρίτιδας· φαίνεται ότι παίρνεις τη μία δωρεάν!

items.bombs.firebomb.name=βόμβα φωτιάς
items.bombs.firebomb.desc=Αυτή η βόμβα έχει τροποποιηθεί ώστε να εκρήγνυται σε μεγάλη περιοχή, προκαλώντας _%1$d-%2$d ζημιά_ και ξεχύνοντας διαρκείς φλόγες σε ακτίνα 2 τετραγώνων.
items.bombs.firebomb.discover_hint=Μπορείς να δημιουργήσεις αυτό το αντικείμενο μέσω αλχημείας.

items.bombs.flashbangbomb.name=βόμβα κρότου λάμψης
items.bombs.flashbangbomb.desc=Αυτή η εξατομικευμένη βόμβα θα προκαλέσει μια έκρηξη φωτός, ήχου και ηλεκτροπληξίας. Οτιδήποτε βρίσκεται εντός 2 τετραγώνων θα λάβει _%1$d-%2$d_ ζημιά από την έκρηξη, συν 25%% ζημιά ηλεκτροπληξίας, και θα ακινητοποιηθεί για 10 γύρους.
items.bombs.flashbangbomb.discover_hint=Μπορείς να δημιουργήσεις αυτό το αντικείμενο μέσω αλχημείας.

items.bombs.frostbomb.name=βόμβα πάγου
items.bombs.frostbomb.desc=Αυτή η βόμβα έχει τροποποιηθεί ώστε να εκρήγνυται σε μεγάλη περιοχή, προκαλώντας _%1$d-%2$d ζημιά_ και απλώνοντας διαρκή παγωμένο αέρα σε ακτίνα 2 τετραγώνων.
items.bombs.frostbomb.discover_hint=Μπορείς να δημιουργήσεις αυτό το αντικείμενο μέσω αλχημείας.

items.bombs.holybomb.name=ιερή βόμβα
items.bombs.holybomb.desc=Αυτή η βόμβα έχει τροποποιηθεί ώστε να εκπέμψει ιερό φως σε μεγάλη έκταση. Οτιδήποτε βρίσκεται εντός 2 τετραγώνων θα λάβει _%1$d-%2$d ζημιά_ από την έκρηξη. Οι απέθαντοι και οι δαιμονικοί εχθροί θα λάβουν επιπλέον ζημιά 50%% από το ιερό φως.
items.bombs.holybomb.discover_hint=Μπορείς να δημιουργήσεις αυτό το αντικείμενο μέσω αλχημείας.

items.bombs.noisemaker.name=θορυβοποιός βόμβα
items.bombs.noisemaker.desc=Αυτή η εξατομικευμένη βόμβα θα κάνει έναν επαναλαμβανόμενο θόρυβο μόλις καεί το φυτίλι. Εάν κάτι αγγίξει τη βόμβα, θα εκραγεί και θα προκαλέσει _%1$d-%2$d ζημιά_ σε ακτίνα 2 τετραγώνων!
items.bombs.noisemaker.desc_burning=Ή βόμβα θορύβου κάνει τικ-τακ· θα εκραγεί όταν κάτι την πλησιάσει!
items.bombs.noisemaker.discover_hint=Μπορείς να δημιουργήσεις αυτό το αντικείμενο μέσω αλχημείας.

items.bombs.smokebomb.name=βόμβα καπνού
items.bombs.smokebomb.desc=Αυτή η βόμβα έχει τροποποιηθεί για να ξεχύνει ένα πυκνό νέφος καπνού παράλληλα με την έκρηξη. Θα προκαλέσει _%1$d-%2$d ζημιά_ και θα απλώσει παχιά ομίχλη σε ακτίνα 2 τετραγώνων.
items.bombs.smokebomb.discover_hint=Μπορείς να δημιουργήσεις αυτό το αντικείμενο μέσω αλχημείας.

items.bombs.regrowthbomb.name=βόμβα αναγέννησης
items.bombs.regrowthbomb.desc=Αυτή η εξατομικευμένη βόμβα θα εκτοξεύσει ζωτικό υγρό εντός 3 τετραγώνων αντί να εκραγεί. Στην περιοχή αυτή θα ξεπηδήσουν ακαριαία φυτά και γρασίδι. Εσύ και οι σύμμαχοί σου θα θεραπευτείτε αν βρεθείτε στην έκρηξη, σαν να είχατε πιει ένα φίλτρο γιατρειάς.
items.bombs.regrowthbomb.discover_hint=Μπορείς να δημιουργήσεις αυτό το αντικείμενο μέσω αλχημείας.

items.bombs.shrapnelbomb.name=βόμβα θραυσμάτων
items.bombs.shrapnelbomb.desc=Αυτή η βόμβα έχει τροποποιηθεί με τα μεταλλικά θραύσματα του DM-300, τα οποία θα θρυμματιστούν και θα πεταχτούν παντού κατά την έκρηξη. Η έκρηξη αυτή θα προκαλέσει _%1$d-%2$d ζημιά_ σε μια τεράστια έκταση γύρω από τη βόμβα. Καλύτερα να κρυφτείς πίσω από κάτι πριν την πυροδοτήσεις...
items.bombs.shrapnelbomb.discover_hint=Μπορείς να δημιουργήσεις αυτό το αντικείμενο μέσω αλχημείας.

items.bombs.woollybomb.name=βόμβα προβάτων
items.bombs.woollybomb.desc=Αυτή η εξατομικευμένη βόμβα θα υλοποιήσει ένα κοπάδι μαγικών προβάτων σε ευρεία έκταση. Η έκρηξή της θα προκαλέσει _%1$d-%2$d ζημιά_ σε οτιδήποτε εντός 2 τετραγώνων. Τα πρόβατα θα εμποδίζουν την κίνηση και θα παραμείνουν για πολύ μεγάλο χρονικό διάστημα! Δεν διαρκούν, όμως, τόσο πολύ υπό την παρουσία ισχυρών εχθρών. Μπορούν επίσης να εξαλειφθούν συντομότερα με το να αλληλεπιδράσεις με αυτά.
items.bombs.woollybomb.discover_hint=Μπορείς να δημιουργήσεις αυτό το αντικείμενο μέσω αλχημείας.

###food
items.food.berry.name=μούρο κατακομβών
items.food.berry.eat_msg=Αυτό το μούρο ήταν γευστικό!
items.food.berry.desc=Αυτό το μικρό μούρο βρέθηκε από την Κυνηγό μες στη βλάστηση της κατακόμβης. Φαγώνεται γρήγορα, επαναφέρει μια μικρή ποσότητα κορεσμού, και ίσως να περιέχει κι έναν χρήσιμο σπόρο!
items.food.berry.discover_hint=Μπορείς να βρεις αυτό το αντικείμενο χρησιμοποιώντας ένα συγκεκριμένο ταλέντο ήρωα.

items.food.blandfruit.name=ηπίδιο
items.food.blandfruit.cooked=μαγειρεμένο ηπίδιο
items.food.blandfruit.sunfruit=ηλιόφρουτο
items.food.blandfruit.rotfruit=σαπιόφρουτο
items.food.blandfruit.earthfruit=γαιόφρουτο
items.food.blandfruit.blindfruit=τυφλόφρουτο
items.food.blandfruit.firefruit=φλογόφρουτο
items.food.blandfruit.icefruit=παγόφρουτο
items.food.blandfruit.fadefruit=αχνόφρουτο
items.food.blandfruit.sorrowfruit=οδυνόφρουτο
items.food.blandfruit.stormfruit=μπορελόφρουτο
items.food.blandfruit.dreamfruit=μαγόφρουτο
items.food.blandfruit.starfruit=αστερόφρουτο
items.food.blandfruit.swiftfruit=ταχύφρουτο
items.food.blandfruit.raw=Δεν αντέχεις να το φας ωμό.
items.food.blandfruit.desc=Τόσο ξερό και ανούσιο... ίσως βράζοντάς το με κάποιο άλλο συστατικό να βελτιωθεί.
items.food.blandfruit.desc_cooked=Το φρούτο έχει παχύνει από την παραμονή του στο τσουκάλι κι έχει απορροφήσει τις ιδιότητες του σπόρου με τον οποίο μαγειρεύτηκε. Θα έχει την επίδραση οποιουδήποτε φίλτρου αντιστοιχούσε σε αυτόν τον σπόρο.
items.food.blandfruit.desc_eat=Δείχνει έτοιμο να φαγωθεί!
items.food.blandfruit.desc_throw=Φαίνεται αρκετά ασταθές· ίσως θα ήταν καλύτερα να το πετάξεις κάπου.
items.food.blandfruit$chunks.name=κομμάτια ηπιδίου
items.food.blandfruit$chunks.desc=Το ηπίδιο εξερράγη στην πρόσκρουση, αφήνοντας πίσω κάποια αδρανή κομμάτια.\n\nΠαρά τη λίγη βρομιά, τα κομμάτια του μαγειρεμένου ηπιδίου φαίνονται πλήρως βρώσιμα.

items.food.chargrilledmeat.name=ψημένο κρέας
items.food.chargrilledmeat.desc=Φαίνεται σαν μια αξιοπρεπής μπριζόλα.
items.food.chargrilledmeat.discover_hint=Μπορείς να το δημιουργήσεις με ένα άλλο φαγητό.

items.food.food.name=μερίδα φαγητού
items.food.food.ac_eat=ΦΑΕ
items.food.food.eat_msg=Αυτό το φαγητό ήταν πεντανόστιμο!
items.food.food.desc=Τίποτα φανταχτερό εδώ: ξερό κρέας, μερικά μπισκότα... τέτοια πράγματα.

items.food.frozencarpaccio.name=παγωμένο καρπάτσιο
items.food.frozencarpaccio.invis=Βλέπεις τα χέρια σου να γίνονται αόρατα!
items.food.frozencarpaccio.hard=Νιώθεις το δέρμα σου να σκληραίνει!
items.food.frozencarpaccio.refresh=Αναζωογονητικό!
items.food.frozencarpaccio.better=Νιώθεις καλύτερα!
items.food.frozencarpaccio.desc=Ένα κομμάτι ωμού, παγωμένου κρέατος. Ο μόνος τρόπος να το φας είναι να το κόψεις σε λεπτές φετούλες. Και με τον τρόπο αυτό είναι παραδόξως καλό.
items.food.frozencarpaccio.discover_hint=Μπορείς να το δημιουργήσεις με ένα άλλο φαγητό.

items.food.meatpie.name=κρεατόπιτα
items.food.meatpie.eat_msg=Το φαγητό ήταν υπέροχο!
items.food.meatpie.desc=Μία πεντανόστιμη πίτα με αλμυρό κρέας. Θα σε χορτάσει πολύ περισσότερο από οποιοδήποτε άλλο γεύμα.
items.food.meatpie.discover_hint=Μπορείς να δημιουργήσεις αυτό το αντικείμενο μέσω αλχημείας.

items.food.mysterymeat.name=μυστηριώδες κρέας
items.food.mysterymeat.eat_msg=Το φαγητό είχε... περίεργη γεύση.
items.food.mysterymeat.hot=Ωχ, καίει!
items.food.mysterymeat.legs=Δεν νιώθεις τα πόδια σου!
items.food.mysterymeat.not_well=Δε νιώθεις καλά.
items.food.mysterymeat.stuffed=Έχεις γεμίσει.
items.food.mysterymeat.desc=Φάε με δική σου ευθύνη!
items.food.mysterymeat.discover_hint=Μπορείς να αποκτήσεις αυτό το αντικείμενο ως λεία από συγκεκριμένους εχθρούς.
items.food.mysterymeat$placeholder.name=κρέας

items.food.phantommeat.name=φασματικό κρέας
items.food.phantommeat.desc=Μια αστραφτερή και ημιδιαφανής μπριζόλα, κομμένη από ένα φασματικό πιράνχας. Αυτό το μαγικό κρέας δεν χρειάζεται μαγείρεμα και, μαζί με τον κορεσμό, προσφέρει μια σειρά από αμυντικά οφέλη. Με την κατανάλωση προσδίδει αορατότητα, φλοιώδες δέρμα, λίγη θεραπεία και αφαιρεί πολλές βλαβερές επιδράσεις.
items.food.phantommeat.discover_hint=Μπορείς να αποκτήσεις αυτό το αντικείμενο ως λεία από συγκεκριμένους εχθρούς.

items.food.pasty.name=πιτάκι
items.food.pasty.fish_name=ψάρι στον ατμό
items.food.pasty.amulet_name=Φυλακτό του Γέντορ;
items.food.pasty.egg_name=πασχαλινό αυγό
items.food.pasty.rainbow_name=φίλτρο ουράνιου τόξου
items.food.pasty.shattered_name=πράσινη τούρτα
items.food.pasty.pie_name=κολοκυθόπιτα
items.food.pasty.vanilla_name=μπλε τούρτα
items.food.pasty.cane_name=μπαστούνι γλειφιτζούρι
items.food.pasty.sparkling_name=αφρώδες φίλτρο
items.food.pasty.desc=Μία αυθεντική κορνουαλική πίτα με παραδοσιακή γέμιση βοδινού και πατάτας. Πεντανόστιμη!
items.food.pasty.fish_desc=Ένα ολόκληρο ψάρι στον ατμό, διατηρημένο μαγικά σε μια στρώση λαχανικών. Είναι παράδοση αυτής της περιόδου να κρατάς λίγο ψάρι για αργότερα, οπότε θα αφήσεις λίγα απομεινάρια αντί να το φας όλο με τη μία.\n\nΧαρούμενο το νέο σεληνιακό έτος!
items.food.pasty.amulet_desc=Επιτέλους το βρήκες· το μαγικό φυλακτό του... μισό λεπτό, αυτό δεν είναι παρά μια τυλιγμένη σοκολάτα που μοιάζει με το φυλακτό! Δεν θα σου προσφέρει απέραντη δύναμη, αλλά τουλάχιστον θα σε γεμίσει και θα σου χαρίσει λίγο φορτίο στα τεχνουργήματα.\n\nΠρωταπριλιά!
items.food.pasty.egg_desc=Ένα υπέροχο μεγάλο σοκολατένιο αυγό, τυλιγμένο σε κίτρινη συσκευασία. Έχει αρκετή σοκολάτα για να σε γεμίσει, και η ζάχαρη μπορεί να σου χαρίσει λίγο φορτίο στα τεχνουργήματα.\n\nΚαλό Πάσχα!
items.food.pasty.rainbow_desc=Αυτό το πολύχρωμο φίλτρο είναι ένα είδος υγρής τροφής. Μαζί με τον κορεσμό της πείνας, έχει λίγη μαγεία που θα ηρεμήσει ένα διπλανό μη αφεντικό και θα τον κάνει να διστάσει να σε πολεμήσει για λίγο.\n\n.
items.food.pasty.shattered_desc=Αυτό το μεγάλο κομμάτι από τούρτα βανίλια έχει πολύχρωμες τρούφες και μια πράσινη επικάλυψη. Η τούρτα φτιάχτηκε για να γιορτάσει έτη εμπειρίας, έτσι θα σου προσφέρει ένα μικρό κομμάτι από αυτήν την εμπειρία όταν το φας.\n\nΤο Shattered Pixel Dungeon πρωτοκυκλοφόρησε στις 5 Αυγούστου 2014. Χαρούμενα γεννέθλια Shattered Pixel Dungeon!
items.food.pasty.pie_desc=Ένα τεράστιο κομμάτι κολοκυθόπιτας. Η γλυκιά και πικάντικη γεύση του θα σε γεμίσει και θα σου αναπληρώσει λίγη ζωή.\n\nΧαρούμενο Χαλοουίν!
items.food.pasty.vanilla_desc=Αυτό το μεγάλο κομμάτι από τούρτα βανίλια έχει πολύχρωμες τρούφες και μια μπλε επικάλυψη. Η τούρτα φτιάχτηκε για να γιορτάσει έτη εμπειρίας, έτσι θα σου προσφέρει ένα μικρό κομμάτι από αυτήν την εμπειρία όταν το φας.\n\nΤο πρωτότυπο Pixel Dungeon πρωτοκυκλοφόρησε στις 4 Δεκεμβρίου 2012. Χαρούμενα γεννέθλια Pixel Dungeon!
items.food.pasty.cane_desc=Ένα τεράστιο ζαχαρωτό μπαστούνι. Είναι αρκετά μεγάλο για να σε χορτάσει, και η ζάχαρη μπορεί να χαρίσει στα ραβδιά σου λίγο φορτίο.\n\nΚαλά Χριστούγεννα!
items.food.pasty.sparkling_desc=Αυτό το αφρώδες φίλτρο είναι ένα είδος υγρής τροφής. Ικανοποιεί την πείνα και θυμίζει αφρώδες κρασί, αλλά δεν περιέχει αλκοόλ. Η ζεστή αίσθηση στην κοιλιά σου θα σου χαρίσει λίγη προστασία.\n\nΕυτυχισμένο το νέο έτος!
items.food.pasty$fishleftover.name=απομεινάρια ψαριού
items.food.pasty$fishleftover.eat_msg=Το φαγητό ήταν εντάξει.
items.food.pasty$fishleftover.desc=Λίγο ψάρι που απέμεινε από το προηγούμενό σου γεύμα. Μπορείς να το φας ανά πάσα στιγμή για να κορέσεις λίγη πείνα.

items.food.smallration.name=μικρή μερίδα φαγητού
items.food.smallration.eat_msg=Το φαγητό ήταν εντάξει.
items.food.smallration.desc=Μοιάζει με μία κανονική μερίδα φαγητού, αλλά είναι μικρότερη.
items.food.smallration.discover_hint=Μπορείς να αγοράσεις αυτό το αντικείμενο σε ένα κατάστημα.

items.food.stewedmeat.name=βρασμένο κρέας
items.food.stewedmeat.eat_msg=Το φαγητό ήταν εντάξει.
items.food.stewedmeat.desc=Χάρη στον βρασμό, το κρέας έχει καθαριστεί από ασθένειες και παράσιτα. Θα πρέπει να είναι βρώσιμο πλέον.
items.food.stewedmeat.discover_hint=Μπορείς να δημιουργήσεις αυτό το αντικείμενο μέσω αλχημείας.

items.food.supplyration.name=μερίδα προμηθειών
items.food.supplyration.desc=Αυτή η μερίδα αφέθηκε στην κατακόμβη από τα μέλη της συντεχνίας των ληστών, ειδικά για τα μέλη της. Είναι σχεδιασμένη να τρώγεται στα γρήγορα και να βοηθά στις κατεργαριές.\n\nΔεν σε γεμίζει όπως μια κανονική μερίδα, αλλά τρώγεται ακαριαία, παρέχει λίγη άμεση γιατρειά και αναπληρώνει 1 φορτίο στον μανδύα των σκιών του Κλέφτη.
items.food.supplyration.discover_hint=Μπορείς να βρεις αυτό το αντικείμενο χρησιμοποιώντας ένα συγκεκριμένο ταλέντο ήρωα.



##journal items
items.journal.documentpage.name=σκισμένη σελίδα
items.journal.documentpage.desc=Μία και μόνο σελίδα, πιθανώς σκισμένη από κάποιο βιβλίο. Θα πρέπει να τη μαζέψεις για να τη διαβάσεις.

items.journal.alchemypage.name=σκισμένη σελίδα βιβλίου αλχημείας
items.journal.alchemypage.desc=Μία αποκομμένη σελίδα από έναν οδηγό αλχημείας.\n\nΤο μεγαλύτερο μέρος του κειμένου είναι πολύ μικρό για να διαβαστεί από μακριά, αλλά μπορείς να ξεχωρίσεις τον τίτλο της σελίδας:\n\n_«%s»_

items.journal.guidebook.name=τόμος της κατακομβικής κυριαρχίας
items.journal.guidebook.hint_mobile=Ο οδηγός σού έχει μια συμβουλή! Πάτα το ημερολόγιο που αναβοσβήνει πάνω δεξιά να τη διαβάσεις.
items.journal.guidebook.hint_desktop=Ο οδηγός σού έχει μια συμβουλή! Πάτα το κουμπί ημερολογίου (%s) που αναβοσβήνει πάνω δεξιά να τη διαβάσεις.
items.journal.guidebook.hint_status=Οδηγός
items.journal.guidebook.desc=Ένας οδηγός εξερευνητών, παρατημένος από κάποιον που κατάλαβε ότι η περιπέτεια δεν είναι γι' αυτόν! Το συγκεκριμένο βιβλίο είναι μαγικό· θα ειδοποιεί τους εξερευνητές να διαβάζουν κάθε σελίδα την κατάλληλη στιγμή.\n\nΠαρά τη χρησιμότητά του, το βιβλίο είναι πασίγνωστο για τις δύο μεγάλες φιλικές λέξεις στο εξώφυλλο: «Μην πανικοβάλλεσαι!»

items.journal.guidepage.name=σκισμένη σελίδα οδηγού
items.journal.guidepage.desc=Μία αποκομμένη σελίδα από έναν οδηγό εξερευνητών.\n\nΤο μεγαλύτερο μέρος του κειμένου είναι πολύ μικρό για να διαβαστεί από μακριά, αλλά μπορείς να ξεχωρίσεις τον τίτλο της σελίδας:\n\n_«%s»_

items.journal.regionlorepage$sewers.name=φθαρμένο γράμμα
items.journal.regionlorepage$sewers.desc=Κάτι που μοιάζει με γράμμα τυπωμένο σε ένα χαρτί γεμάτο λάσπες. Πρέπει να το μαζέψεις για να μπορέσεις να διακρίνεις τι γράφει πάνω.

items.journal.regionlorepage$prison.name=φθαρμένη καταχώριση ημερολογίου
items.journal.regionlorepage$prison.desc=Μια καταχώριση ημερολογίου, ή άλλου μέσου καταγραφών, γραμμένη σε ένα παλιό κομμάτι χαρτιού. Φαίνεται πως είχε καλύτερη μοίρα από τα γράμματα που βρήκες στους υπονόμους. Μα και πάλι θα πρέπει να το μαζέψεις για να το διαβάσεις.

items.journal.regionlorepage$caves.name=παλιά καταχώριση
items.journal.regionlorepage$caves.desc=Κάτι που μοιάζει με καταχώριση σε βιβλίο καταγραφών κάποιου εξερευνητή. Είναι εκπληκτικά διατηρημένη παρά το πόσο παλιά μπορεί να είναι. Μάζεψέ τη για να τη διαβάσεις.

items.journal.regionlorepage$city.name=σκουριασμένο πλακίδιο
items.journal.regionlorepage$city.desc=Ένα μικρό και σκουριασμένο μεταλλικό πλακίδιο, που έχει χαραγμένο ένα μήνυμα με μαγικό τρόπο. Τα γράμματα είναι ξεκάθαρα παρά την ηλικία του, μα θα πρέπει να το μαζέψεις για να το διαβάσεις.

items.journal.regionlorepage$halls.name=λαμπερό πλακίδιο
items.journal.regionlorepage$halls.desc=Ένα μικρό μαύρο πλακίδιο με λαμπερά πράσινα γράμματα χαραγμένα επάνω. Τα λαμπερά γράμματα θολώνουν από μακριά· θα πρέπει να το μαζέψεις για να το διαβάσεις.


###keys
items.keys.goldenkey.name=χρυσό κλειδί
items.keys.goldenkey.desc=Οι εγκοπές αυτού του χρυσού κλειδιού είναι μικρές και περίτεχνες. Μήπως ανοίγει κάποιο κλειδωμένο σεντούκι;

items.keys.crystalkey.name=Κρυστάλλινο κλειδί
items.keys.crystalkey.desc=Οι εγκοπές αυτού του κρυστάλλινου κλειδιού λαμπυρίζουν στο σκοτάδι. Ίσως να ανοίγει κάτι που είναι φτιαγμένο από κρύσταλλο;

items.keys.ironkey.name=σιδερένιο κλειδί
items.keys.ironkey.desc=Οι εγκοπές αυτού του αρχαίου σιδερένιου κλειδιού έχουν φθαρεί αρκετά· το δερμάτινο κορδόνι του είναι φαγωμένο από τον χρόνο. Τι πόρτα να ανοίγει, άραγε;

items.keys.wornkey.name=worn key
items.keys.wornkey.desc=This key is worn and discolored, but looks serious. Probably it can open some serious door nearby.



###potions
items.potions.potion.ac_drink=ΠΙΕΣ
items.potions.potion.turquoise=τυρκουάζ φίλτρο
items.potions.potion.crimson=κόκκινο φίλτρο
items.potions.potion.azure=μπλε φίλτρο
items.potions.potion.jade=πράσινο φίλτρο
items.potions.potion.golden=χρυσό φίλτρο
items.potions.potion.magenta=ροζ φίλτρο
items.potions.potion.charcoal=ανθρακί φίλτρο
items.potions.potion.ivory=λευκό φίλτρο
items.potions.potion.amber=κεχριμπαρένιο φίλτρο
items.potions.potion.bistre=καφέ φίλτρο
items.potions.potion.indigo=ιώδες φίλτρο
items.potions.potion.silver=ασημί φίλτρο
items.potions.potion.unknown_desc=Αυτή η φιάλη περιέχει ένα χρωματιστό στροβιλιζόμενο υγρό. Άραγε, τι θα κάνει αν το πιεις ή το πετάξεις;
items.potions.potion.harmful=Βλαβερό φίλτρο!
items.potions.potion.beneficial=Ωφέλιμο φίλτρο
items.potions.potion.yes=Ναι, ξέρω τι κάνω
items.potions.potion.no=Όχι, άλλαξα γνώμη
items.potions.potion.sure_drink=Σίγουρα θέλεις να το πιεις; Τέτοια φίλτρα συνήθως προορίζονται για πέταγμα στους εχθρούς.
items.potions.potion.sure_throw=Σίγουρα θέλεις να το πετάξεις; Τις περισσότερες φορές βγάζει νόημα να το πιεις.
items.potions.potion.shatter=Η φιάλη σπάει και το υγρό πιτσιλά ακίνδυνα.
items.potions.potion.discover_hint=Μπορείς να βρεις αυτό το αντικείμενο τυχαία στην κατακόμβη, ή να το παρασκευάσεις μέσω αλχημείας.
items.potions.potion$placeholder.name=φίλτρο
items.potions.potion$seedtopotion.name=Τυχαίο φίλτρο

items.potions.potionofexperience.name=φίλτρο εμπειρίας
items.potions.potionofexperience.desc=Εξιστορημένες εμπειρίες από πληθώρα μαχών, συμπυκνωμένες σε υγρή μορφή. Αυτό το ποτό θα αυξήσει άμεσα το επίπεδο εμπειρίας σου.

items.potions.potionoffrost.name=φίλτρο πάγου
items.potions.potionoffrost.desc=Το χημικό αυτού του φίλτρου θα εξατμιστεί μόλις εκτεθεί στον αέρα, σχηματίζοντας ένα παγωμένο νέφος.

items.potions.potionofhaste.name=φίλτρο βιασύνης
items.potions.potionofhaste.energetic=Νιώθεις ένα κύμα ενέργειας!
items.potions.potionofhaste.desc=Αφού πιεις αυτό το αλλόκοτα γλυκό υγρό, θα εμποτιστείς με τρομερή ενέργεια για μια μικρή περίοδο. Η ενέργεια αυτή σου επιτρέπει να τρέχεις με μεγάλη ταχύτητα.

items.potions.potionofhealing.name=φίλτρο γιατρειάς
items.potions.potionofhealing.heal=Οι πληγές σου αρχίζουν να κλείνουν.
items.potions.potionofhealing.desc=Αυτό το φίλτρο θα επαναφέρει γρήγορα τη ζωή σου και θα θεραπεύσει ακαριαία πολλές ασθένειες.

items.potions.potionofinvisibility.name=φίλτρο αορατότητας
items.potions.potionofinvisibility.invisible=Βλέπεις τα χέρια σου να γίνονται αόρατα!
items.potions.potionofinvisibility.desc=Με την κατάποση αυτού του φίλτρου αποκτάς προσωρινή αορατότητα. Οι εχθροί δεν μπορούν να σε δουν όσο έχεις αορατότητα. Οι φυσιολογικές επιθέσεις και οι μαγικές επιδράσεις (όπως από παπύρους ή ραβδιά) θα ακυρώσουν αμέσως την αορατότητα.

items.potions.potionoflevitation.name=φίλτρο αιώρησης
items.potions.potionoflevitation.float=Επιπλέεις στον αέρα!
items.potions.potionoflevitation.desc=Η κατανάλωση αυτού του αλλόκοτου υγρού θα σε κάνει να αιωρείσαι· θα μπορείς να ίπτασαι πάνω από παγίδες και χάσματα με ευκολία. Το πέταγμα αυτού του φίλτρου θα δημιουργήσει ένα νέφος ακατέργαστου αερίου, που αποπροσανατολίζει οποιονδήποτε πιαστεί μέσα του.

items.potions.potionofliquidflame.name=φίλτρο υγρής φλόγας
items.potions.potionofliquidflame.desc=Αυτή η φιάλη περιέχει μια ασταθή χημική ένωση που θα αναφλεχθεί βίαια μόλις εκτεθεί στον αέρα.

items.potions.potionofmindvision.name=φίλτρο ενόρασης
items.potions.potionofmindvision.see_mobs=Με κάποιον τρόπο, νιώθεις την πνευματική παρουσία των άλλων πλασμάτων!
items.potions.potionofmindvision.see_none=Με κάποιον τρόπο, ξέρεις ότι είσαι μόνο εσύ στο επίπεδο προς το παρόν.
items.potions.potionofmindvision.desc=Αφού πιεις το φίλτρο, το μυαλό σου θα εναρμονιστεί με την ψυχική υπογραφή μακρινών πλασμάτων. Αυτό θα σου επιτρέψει να νιώθεις τις βιολογικές παρουσίες μέσα από τοίχους. Επίσης, το φίλτρο θα σου επιτρέψει να βλέπεις μέσα από κοντινούς τοίχους και πόρτες.

items.potions.potionofparalyticgas.name=φίλτρο παραλυτικού αερίου
items.potions.potionofparalyticgas.desc=Μόλις εκτεθεί στον αέρα, το υγρό αυτής της φιάλης θα προκαλέσει μια παραλυτική κίτρινη ομίχλη. Όποιος εισπνεύσει το νέφος θα παραλύσει άμεσα, και δεν θα μπορεί να κινηθεί για κάποιο διάστημα μετά τη διάλυση του αερίου. Το φίλτρο μπορεί να πεταχτεί σε μακρινούς εχθρούς για να πιαστούν στην επήρεια του αερίου.

items.potions.potionofpurity.name=φίλτρο κάθαρσης
items.potions.potionofpurity.freshness=Αισθάνεσαι μια ασυνήθιστη φρεσκάδα στον αέρα.
items.potions.potionofpurity.protected=Μια προστατευτική μεμβράνη σε περιτυλίγει!
items.potions.potionofpurity.desc=Αυτό το μαγικό αντιδραστήριο εξουδετερώνει σε μεγάλη ακτίνα όλες τις επιβλαβείς επιδράσεις που σχετίζονται με το περιβάλλον. Πίνοντάς το θα λάβεις προσωρινή ατρωσία από τέτοιες επιδράσεις.

items.potions.potionofstrength.name=φίλτρο δύναμης
items.potions.potionofstrength.msg=Νεοανακαλυφθείσα δύναμη διαπερνά το σώμα σου. Τώρα έχεις %d δύναμη!
items.potions.potionofstrength.desc=Αυτό το ισχυρό υγρό εγχέεται στους μυς σου και αυξάνει μόνιμα τη δύναμή σου κατά έναν πόντο.

items.potions.potionoftoxicgas.name=φίλτρο τοξικού αερίου
items.potions.potionoftoxicgas.desc=Το άνοιγμα ή το σπάσιμο αυτής της πεπιεσμένης φιάλης θα κάνει το περιεχόμενό της να εκραγεί σε ένα τοξικό πράσινο νέφος. Ίσως να θέλεις να πετάξεις αυτό το φίλτρο σε μακρινούς εχθρούς αντί απλά να του βγάλεις τον φελλό.



###brews
items.potions.brews.brew.discover_hint=Μπορείς να δημιουργήσεις αυτό το αντικείμενο μέσω αλχημείας.

items.potions.brews.aquabrew.name=υδατικό σκεύασμα
items.potions.brews.aquabrew.desc=Όταν η φιάλη σπάσει, το σκεύασμα θα απελευθερώσει μια έκρηξη πεπιεσμένου νερού στην περιοχή. Η έκρηξη προκαλεί ζημιά μόνο σε φλογερούς εχθρούς, αλλά θα εξαπλώσει νερό στο κοντινό έδαφος, θα αφοπλίσει παγίδες, θα σβήσει φωτιές και θα πετάξει πίσω τους χαρακτήρες που βρίσκονται κοντά σε αυτήν.

items.potions.brews.blizzardbrew.name=σκεύασμα χιονοθύελλας
items.potions.brews.blizzardbrew.desc=Μόλις σπάσει η φιάλη, το σκεύασμα θα απελευθερώσει μια στροβιλιζόμενη χιονοθύελλα που εξαπλώνεται γρήγορα σαν αέριο.

items.potions.brews.causticbrew.name=καυστικό σκεύασμα
items.potions.brews.causticbrew.desc=Αυτό το σκεύασμα εξαπλώνει διαβρωτική γλίτσα σε μια ευρεία περιοχή γύρω από το σημείο σπασμού του. Οποιοσδήποτε πιαστεί στη γλίτσα θα λιώνει σιγά-σιγά, μέχρι να την ξεπλύνει στο νερό.

items.potions.brews.infernalbrew.name=κολασιαίο σκεύασμα
items.potions.brews.infernalbrew.desc=Μόλις σπάσει η φιάλη, το σκεύασμα θα απελευθερώσει μια μαινόμενη κόλαση φωτιάς που εξαπλώνεται γρήγορα σαν αέριο.

items.potions.brews.shockingbrew.name=σκεύασμα ηλεκτροπληξίας
items.potions.brews.shockingbrew.desc=Μόλις σπάσει η φιάλη, το σκεύασμα θα απελευθερώσει μια ηλεκτρική καταιγίδα σε μια ευρεία περιοχή γύρω από το σημείο σπασμού.

items.potions.brews.unstablebrew.name=ασταθές σκεύασμα
items.potions.brews.unstablebrew.desc=Αυτό το μαγικό σκεύασμα λάμπει με τα εναλασσόμενα χρώματα του ουράνιου τόξου.\n\nΌταν καταποθεί ή πεταχτεί, θα ενεργοποιήσει την επίδραση ενός τυχαίου φίλτρου. Η επίδραση θα είναι πάντα ωφέλιμη όταν το πίνεις και πάντα επιβλαβής όταν το πετάς.

###elixirs
items.potions.elixirs.elixir.discover_hint=Μπορείς να δημιουργήσεις αυτό το αντικείμενο μέσω αλχημείας.

items.potions.elixirs.elixirofarcanearmor.name=ελιξίριο απόκρυφης πανοπλίας
items.potions.elixirs.elixirofarcanearmor.desc=Αυτό το ελιξίριο θα προσφέρει στον χρήστη μια αντίσταση μεγάλης διαρκείας στη ζημιά από μαγεία.

items.potions.elixirs.elixirofaquaticrejuvenation.name=ελιξίριο υδατικής αναζωογόνησης
items.potions.elixirs.elixirofaquaticrejuvenation.desc=Το ελιξίριο περιέχει τα κατάλοιπα του Γκου, ενισχυμένα με ένα φίλτρο γιατρειάς. Αν και δεν παρέχει άμεση ίαση, θα επαναφέρει σταθερά μια μεγαλύτερη ποσότητα ζωής ενώ στέκεσαι σε νερό.
items.potions.elixirs.elixirofaquaticrejuvenation$aquahealing.name=υδατική ίαση
items.potions.elixirs.elixirofaquaticrejuvenation$aquahealing.desc=Έχεις λάβει προσωρινές αναζωογονητικές ιδιότητες, παρόμοιες με αυτές του Γκου.\n\nΕνώ στέκεσαι σε νερό, θα ανακτάς μια μικρή ποσότητα ζωής ανά γύρο. Η επίδραση διακόπτεται για όσο έχεις πλήρη ζωή ή για όσο βρίσκεσαι εκτός νερού.\n\nΊαση που απομένει: %d.

items.potions.elixirs.elixirofdragonsblood.name=ελιξίριο δρακόνιου αίματος
items.potions.elixirs.elixirofdragonsblood.desc=Όταν το ελιξίριο καταναλωθεί, μια φλογερή δύναμη θα κυλήσει στις φλέβες του χρήστη. Αυτή η επίδραση θα κάνει τον χρήστη απρόσβλητο από τη φωτιά, και του επιτρέπει να αναφλέξει τους εχθρούς του με φυσιολογικές επιθέσεις.

items.potions.elixirs.elixiroffeatherfall.name=ελιξίριο φτερωτής πτώσης
items.potions.elixirs.elixiroffeatherfall.light=Νιώθεις πως έχεις την ελαφρότητα ενός φτερού!
items.potions.elixirs.elixiroffeatherfall.desc=Αυτό το ελιξίριο παρέχει μια πιο ανίσχυρη αλλά και πιο ελεγχόμενη επίδραση αιώρησης. Επιτρέπει στον χρήστη να πέφτει αλώβητος από μεγάλα ύψη για κάποιο χρονικό διάστημα.
items.potions.elixirs.elixiroffeatherfall$featherbuff.name=φτερωτή πτώση
items.potions.elixirs.elixiroffeatherfall$featherbuff.desc=Είσαι υπό την επίδραση ενός ελιξιρίου φτερωτής πτώσης, η οποία σου επιτρέπει να πέφτεις σε χάσματα χωρίς να λαμβάνεις ζημιά!\n\nΓύροι που απομένουν: %s.

items.potions.elixirs.elixirofhoneyedhealing.name=ελιξίριο μελωμένης ίασης
items.potions.elixirs.elixirofhoneyedhealing.desc=Αυτό το ελιξίριο συνδυάζει την ίαση με τη γλυκύτητα του μελιού. Έχει την ίδια επίδραση με ένα φίλτρο γιατρειάς όταν το πίνεις, αλλά ικανοποιεί και λίγη από την πείνα σου. Μπορεί, όμως, και να πεταχτεί για να θεραπεύσει έναν σύμμαχο.\n\nΤα πλάσματα με προτίμηση στο μέλι μπορεί να κατευναστούν αν χρησιμοποιηθεί πάνω τους.

items.potions.elixirs.elixiroficytouch.name=ελιξίριο παγωμένου αγγίγματος
items.potions.elixirs.elixiroficytouch.desc=Όταν το ελιξίριο καταναλωθεί, θα επιτρέψει στον χρήστη να απορροφά τη θερμότητα των εχθρών που επιτίθεται. Η επίδραση θα κάνει τον χρήστη απρόσβλητο από το κρύο, και οι φυσιολογικές του επιθέσεις θα ψύχουν τους εχθρούς.

items.potions.elixirs.elixirofmight.name=ελιξίριο ισχύος
items.potions.elixirs.elixirofmight.msg=Νεοανακαλυφθείσα δύναμη διαπερνά το σώμα σου. Τώρα έχεις %d δύναμη!
items.potions.elixirs.elixirofmight.desc=Αυτό το ισχυρό υγρό θα εγχυθεί στους μυς σου και θα αυξήσει μόνιμα τη δύναμή σου κατά 1 και, προσωρινά, τη μέγιστη ζωή σου κατά %d. Η αύξηση ζωής είναι αναλογική της τρέχουσας μέγιστης ζωής σου, αλλά θα εξασθενεί όσο ανεβαίνεις επίπεδα.
items.potions.elixirs.elixirofmight$htboost.name=αύξηση μέγιστης ζωής
items.potions.elixirs.elixirofmight$htboost.desc=Αισθάνεσαι το σώμα σου αφύσικα δυνατό και υγιές.\n\nΗ μέγιστη ζωή σου αυξάνεται για μια μεγάλη χρονική περίοδο. Όσο ανεβαίνεις επίπεδα, η ενίσχυση θα εξασθενεί σταθερά.\n\nΤρέχον ποσό αύξησης: %d.\nΕπίπεδα που απομένουν: %d.

items.potions.elixirs.elixiroftoxicessence.name=ελιξίριο τοξικής ουσίας
items.potions.elixirs.elixiroftoxicessence.desc=Όταν το ελιξίριο καταναλωθεί, θα εμποτίσει τον χρήστη με τοξική ενέργεια. Ο χρήστης θα εξαπλώνει συνεχώς τοξικό αέριο ενώ κινείται. Θα είναι, επίσης, άτρωτος στο τοξικό αέριο και το δηλητήριο έως και για λίγο μετά την επίδραση.



###exotic potions
items.potions.exotic.exoticpotion.turquoise=εξωτικό τυρκουάζ φίλτρο
items.potions.exotic.exoticpotion.crimson=εξωτικό κόκκινο φίλτρο
items.potions.exotic.exoticpotion.azure=εξωτικό μπλε φίλτρο
items.potions.exotic.exoticpotion.jade=εξωτικό πράσινο φίλτρο
items.potions.exotic.exoticpotion.golden=εξωτικό χρυσό φίλτρο
items.potions.exotic.exoticpotion.magenta=εξωτικό ροζ φίλτρο
items.potions.exotic.exoticpotion.charcoal=εξωτικό ανθρακί φίλτρο
items.potions.exotic.exoticpotion.ivory=εξωτικό λευκό φίλτρο
items.potions.exotic.exoticpotion.amber=εξωτικό κεχριμπαρένιο φίλτρο
items.potions.exotic.exoticpotion.bistre=εξωτικό καφέ φίλτρο
items.potions.exotic.exoticpotion.indigo=εξωτικό ιώδες φίλτρο
items.potions.exotic.exoticpotion.silver=εξωτικό ασημί φίλτρο
items.potions.exotic.exoticpotion.unknown_desc=Αυτή η στρογγυλή φιάλη περιέχει ένα χρωματιστό κοκκώδες υγρό. Φαίνεται πως δεν προέρχεται από αυτά τα μέρη. Άραγε, τι θα κάνει αν το πιεις ή το πετάξεις;
items.potions.exotic.exoticpotion.warning=Θες σίγουρα να ακυρώσεις τη χρήση αυτού του φίλτρου; Θα καταναλωθεί έτσι κι αλλιώς.
items.potions.exotic.exoticpotion.yes=Ναι, ακύρωση
items.potions.exotic.exoticpotion.no=Όχι, άλλαξα γνώμη
items.potions.exotic.exoticpotion.discover_hint=Μπορείς να δημιουργήσεις αυτό το αντικείμενο μέσω αλχημείας.

items.potions.exotic.potionofcleansing.name=φίλτρο εξαγνισμού
items.potions.exotic.potionofcleansing.desc=Αυτό το ισχυρό αντιδραστήριο θα κάνει τον χρήστη απρόσβλητο από όλες τις επιβλαβείς επιδράσεις, για λίγους γύρους μετά την κατάποση. Μπορεί, επίσης, να πεταχτεί σε έναν στόχο για να τον εξαγνίσει.
items.potions.exotic.potionofcleansing$cleanse.name=εξάγνιση
items.potions.exotic.potionofcleansing$cleanse.desc=Αυτός ο χαρακτήρας είναι προσωρινά απρόσβλητος από κάθε επιβλαβή επίδραση!\n\nΓύροι που απομένουν: %s.

items.potions.exotic.potionofcorrosivegas.name=φίλτρο διαβρωτικού αερίου
items.potions.exotic.potionofcorrosivegas.desc=Το άνοιγμα ή το σπάσιμο αυτής της πεπιεσμένης φιάλης θα κάνει το περιεχόμενό της να εκραγεί σε ένα διαβρωτικό κεραμιδί νέφος. Αυτό το αέριο επεκτείνεται γρηγορότερα –και είναι πιο θανατηφόρο– από το τοξικό αέριο, αλλά διαρκεί λιγότερο.

items.potions.exotic.potionofdragonsbreath.name=φίλτρο δρακονικής αναπνοής
items.potions.exotic.potionofdragonsbreath.prompt=Δίαλεξε ένα σημείο να εξαπολύσεις τη φλόγα
items.potions.exotic.potionofdragonsbreath.desc=Αυτό το φιαλίδιο περιέχει μια ασυνήθιστη χημική ένωση που αναφλέγεται μόλις αναμειχθεί με το σάλιο. Φτύνοντας γρήγορα το υγρό, ο χρήστης εξαπολύει φλόγες από το στόμα του!

items.potions.exotic.potionofearthenarmor.name=φίλτρο γαιώδους πανοπλίας
items.potions.exotic.potionofearthenarmor.desc=Αυτό το υγρό προκαλεί μια σκληρυντική επίδραση στο δέρμα αντί να παραλύει. Το δέρμα μετατρέπεται προσωρινά σε φυσική πανοπλία.

items.potions.exotic.potionofdivineinspiration.name=φίλτρο θεϊκής έμπνευσης
items.potions.exotic.potionofdivineinspiration.no_more_points=Δεν μπορείς να λάβεις άλλους πρόσθετους πόντους ταλέντων.
items.potions.exotic.potionofdivineinspiration.select_tier=Διάλεξε μια βαθμίδα ταλέντων για να προστεθούν 2 πόντοι. Θα πρέπει να έχεις ξεκλειδώσει τη βαθμίδα για να μπορείς να ξοδέψεις τους πόντους.
items.potions.exotic.potionofdivineinspiration.bonus=+2 πόντοι ταλέντων!
items.potions.exotic.potionofdivineinspiration.desc=Η δύναμη της ιερής ενέργειας σε υγρή μορφή. Αυτό το ρόφημα θα εμφυσήσει μια θεϊκή δύναμη στον χρήστη, παρέχοντάς του δύο πόντους ταλέντων σε μια βαθμίδα ταλέντων της επιλογής του.\n\nΤο φίλτρο μπορεί να χρησιμοποιηθεί μόνο μία φορά ανά βαθμίδα.

items.potions.exotic.potionofmagicalsight.name=φίλτρο μαγικής όρασης
items.potions.exotic.potionofmagicalsight.desc=Αφού το πιεις αυτό, οι αισθήσεις σου θα οξυνθούν για λίγο σε απίστευτο βαθμό. Θα μπορείς να βλέπεις μέσα από τοίχους σε έκταση 12 τετραγώνων!

items.potions.exotic.potionofmastery.name=φίλτρο αριστοτεχνίας
items.potions.exotic.potionofmastery.prompt=Οικειοποιήσου με ένα αντικείμενο
items.potions.exotic.potionofmastery.weapon_easier=Το όπλο σου γίνεται ευκολότερο στη χρήση!
items.potions.exotic.potionofmastery.armor_easier=Η πανοπλία σου γίνεται ευκολότερη στη χρήση!
items.potions.exotic.potionofmastery.desc=Αντί να προσδώσει ωμή δύναμη, αυτό το φίλτρο θα συντονίσει τη μυϊκή δύναμη του χρήστη σε ένα συγκεκριμένο αντικείμενο. Το αντικείμενο θα γίνει ευκολότερο στη χρήση· λες και έχει εξασκηθεί με αυτό ο χρήστης κι έχει δημιουργήσει μυϊκή μνήμη.\n\nΤο επιλεγμένο αντικείμενο (όπλο ή πανοπλία) θα απαιτεί 2 λιγότερη δύναμη για να χρησιμοποιηθεί. Το φίλτρο μπορεί να χρησιμοποιηθεί μόνο μία φορά σε κάθε αντικείμενο.

items.potions.exotic.potionofshielding.name=φίλτρο θωράκισης
items.potions.exotic.potionofshielding.desc=Το φίλτρο αυτό, αντί να θεραπεύσει, θα προβάλει μια ανθεκτική ασπίδα γύρω από το σώμα του χρήστη. Η ασπίδα αυτή εμποδίζει σημαντική ποσότητα ζημιάς.

items.potions.exotic.potionofshroudingfog.name=φίλτρο ομίχλης κάλυψης
items.potions.exotic.potionofshroudingfog.desc=Όταν το υγρό αυτής της φιάλης εκτεθεί στον αέρα, θα παράξει μια παχιά ομίχλη καπνού. Η ομίχλη επεκτείνεται ταχύτατα κι εμποδίζει εντελώς το οπτικό πεδίο των εχθρών σου.

items.potions.exotic.potionofsnapfreeze.name=φίλτρο ακαριαίου πάγου
items.potions.exotic.potionofsnapfreeze.desc=Το χημικό αυτού του φίλτρου θα αντιδράσει άμεσα με τον αέρα, παγώνοντας ακαριαία και ριζώνοντας τους πάντες στο πεδίο επίδρασής του.

items.potions.exotic.potionofstamina.name=φίλτρο αντοχής
items.potions.exotic.potionofstamina.desc=Αυτό το ιδιαίτερα γλυκό υγρό θα σου χαρίσει μια διαρκή αύξηση ενέργειας. Αυτό θα σου επιτρέψει να τρέχεις με ταχύτερο ρυθμό για μια εκτεταμένη χρονική περίοδο.

items.potions.exotic.potionofstormclouds.name=φίλτρο μαύρων συννέφων
items.potions.exotic.potionofstormclouds.desc=Η ρίψη αυτού του φίλτρου θα δημιουργήσει ένα νέφος συμπιεσμένου ατμού που επεκτείνεται ταχύτατα. Αμέσως μετά, θα συμπυκνωθεί και θα πέσει ως βροχή στο έδαφος. Σχεδόν κάθε τύπος εδάφους θα μετατραπεί σε νερό, οι φλογεροί εχθροί θα λάβουν ζημιά, οι φωτιές θα σβήσουν και οι παγίδες θα καταστραφούν.



###quest items
items.quest.ceremonialcandle.name=τελετουργικό κερί
items.quest.ceremonialcandle.desc=Ένα μάτσο κεριών που έχουν λιώσει κι έχουν ενωθεί μεταξύ τους από τη χρήση.\n\nΑπό μόνα τους είναι άχρηστα. Σε συνδυασμό με άλλα κεριά, όμως, μπορούν να συγκεντρώσουν την απαιτούμενη ενέργεια μιας επικαλεστικής τελετουργίας.
items.quest.ceremonialcandle.discover_hint=Μπορείς να βρεις αυτό το αντικείμενο κατα την διάρκεια μιας συγκεκριμένης αποστολής.

items.quest.corpsedust.name=σκόνη σορού
items.quest.corpsedust.chill=Ένα ρίγος διαπερνά το κορμί σου.
items.quest.corpsedust.desc=Η μπάλα της σκόνης σορού δεν διαφέρει εξωτερικά από μία απλή μπάλα σκόνης. Νιώθεις, όμως, μια διαβολική ενέργεια να ελλοχεύει μέσα της.\n\nΘα ήταν καλή ιδέα να την ξεφορτωθείς το συντομότερο δυνατό.
items.quest.corpsedust.discover_hint=Μπορείς να βρεις αυτό το αντικείμενο κατα την διάρκεια μιας συγκεκριμένης αποστολής.

items.quest.darkgold.name=ψήγματα σκοτεινού χρυσού
items.quest.darkgold.you_now_have=Τώρα έχεις %d ψήγματα σκοτεινού χρυσού.
items.quest.darkgold.desc=Αυτό το μέταλλο δεν το αποκαλούν σκοτεινό λόγω του χρώματός του (δεν διαφέρει οπτικά από τον απλό χρυσό), αλλά επειδή λιώνει υπό το φως της ημέρας. Αυτό τον καθιστά άχρηστο στην επιφάνεια.
items.quest.darkgold.discover_hint=Μπορείς να βρεις αυτό το αντικείμενο κατα την διάρκεια μιας συγκεκριμένης αποστολής.

items.quest.dwarftoken.name=έμβλημα νάνων
items.quest.dwarftoken.desc=Πολλοί νάνοι –και κάποιες από τις μεγαλύτερες δημιουργίες τους– έχουν πάνω τους αυτά τα μικρά κομμάτια μετάλλου άγνωστης λειτουργίας. Ίσως είναι κοσμήματα ή κάποιο είδος ταυτότητας· οι νάνοι είναι παράξενος λαός.
items.quest.dwarftoken.discover_hint=Μπορείς να βρεις αυτό το αντικείμενο κατα την διάρκεια μιας συγκεκριμένης αποστολής.

items.quest.embers.name=στοιχειακά κάρβουνα
items.quest.embers.desc=Ειδικά κάρβουνα που μπορούν να συλλεχθούν μόνο από νεαρά στοιχεία της φωτιάς. Εκπέμπουν θερμική ενέργεια.
items.quest.embers.discover_hint=Μπορείς να βρεις αυτό το αντικείμενο κατα την διάρκεια μιας συγκεκριμένης αποστολής.

items.quest.escapecrystal.name=escape crystal
items.quest.escapecrystal.ac_use=ΧΡΗΣΙΜΟΠΟΙΗΣΕ
items.quest.escapecrystal.desc=A thin magical spell crystal that seems to contain teleportation magic. You can use the crystal at any time to leave the dwarven vault, but you won't be able to take anything out with you!
items.quest.escapecrystal.discover_hint=Μπορείς να βρεις αυτό το αντικείμενο κατα την διάρκεια μιας συγκεκριμένης αποστολής.

items.quest.gooblob.name=μάζα γλίτσας
items.quest.gooblob.desc=Μια τρεμάμενη μάζα γλίτσας που αποκόπηκε από το Γκου όταν πέθανε. Μοιάζει με μπάλα από ζελέ, αλλά δεν θα τολμούσες να τη φας.\n\nΔεν κάνει κάτι από μόνη της, αλλά ίσως χρησιμεύει σε συνδυασμό με συγκεκριμένα φίλτρα ή με μια βόμβα. Στην τελική θα μπορούσε να μετατραπεί σε μια καλή ποσότητα ενέργειας.
items.quest.gooblob.discover_hint=Μπορείς να αποκτήσεις αυτό το αντικείμενο ως λεία από συγκεκριμένους εχθρούς.

items.quest.metalshard.name=καταραμένο μεταλλικό θραύσμα
items.quest.metalshard.desc=Ένα σκουριασμένο κόμμα καταραμένου μετάλλου, το οποίο έσπασε από το DM-300 όταν καταστράφηκε. Νιώθεις μια αδρανή διαβολική μαγεία μέσα του.\n\nΔεν κάνει κάτι από μόνο του, αλλά ίσως χρησιμεύσει σε συνδυασμό με συγκεκριμένους παπύρους ή με μια βόμβα. Στην τελική θα μπορούσε να μετατραπεί σε μια καλή ποσότητα ενέργειας.
items.quest.metalshard.discover_hint=Μπορείς να αποκτήσεις αυτό το αντικείμενο ως λεία από συγκεκριμένους εχθρούς.

items.quest.pickaxe.name=αξίνα
items.quest.pickaxe.ability_name=τρυπημα
items.quest.pickaxe.ability_desc=Η Ξιφομάχος μπορεί να _τρυπήσει_ έναν εχθρό με την αξίνα. Αυτό χτυπά εγγυημένα, εφαρμόζει ευαλωτότητα για 3 γύρους, και προκαλεί _%1$d-%2$d_ ζημιά σε εχθρούς με σκληρό δέρμα.
items.quest.pickaxe.upgrade_ability_stat_name=Ζημιά ικανότητας
items.quest.pickaxe.desc=Ένα βαρύ και στιβαρό εργαλείο για σπάσιμο βράχων. Δεν χρειάζεται να εξοπλίσεις την αξίνα για να εξορύξεις με αυτήν. Αλλά μπορείς να την εξοπλίσεις ως όπλο στην ανάγκη.
items.quest.pickaxe.discover_hint=Μπορείς να βρεις αυτό το αντικείμενο κατα την διάρκεια μιας συγκεκριμένης αποστολής.

items.quest.ratskull.name=κρανίο γιγαντιαίου αρουραίου
items.quest.ratskull.desc=Ένα εκπληκτικά μεγάλο κρανίο αρουραίου. Θα ήταν εξαιρετικό τρόπαιο κυνηγιού, αν είχες έναν τοίχο να το κρεμάσεις.



###remains
items.remains.remainsitem.ac_use=ΧΡΗΣΙΜΟΠΟΙΗΣΕ
items.remains.remainsitem.discover_hint=Μπορείς να βρεις αυτό το αντικείμενο στα λείψανα ενός συγκεκριμένου ήρωα από ένα προηγούμενο αποτυχημένο παιχνίδι.

items.remains.bowfragment.name=κομμάτι τόξου
items.remains.bowfragment.desc=Αυτό το σπασμένο κομμάτι ξύλου ήταν κάποτε τμήμα του πνευματικού τόξου μιας Κυνηγού. Νιώθεις ακόμα λίγη ενέργεια της φύσης επάνω του. Μπορείς να το χρησιμοποιήσεις για να αναπτυχθεί ψηλό γρασίδι τριγύρω σου. Αυτό, όμως, θα καταστρέψει το κομμάτι τόξου.

items.remains.brokenhilt.name=σπασμένη λαβή
items.remains.brokenhilt.desc=Αυτή η σπασμένη λαβή φαίνεται να προήλθε από το όπλο μιας ηττημένης Ξιφομάχου. Νιώθεις να έχει μείνει λίγη μαχητική ισχύ στη λαβή, με την οποία μπορείς να προκαλέσεις επιπλέον ζημιά στα δύο σου επόμενα χτυπήματα μάχης σώμα-με-σώμα. Αυτό, όμως, θα καταστρέψει τη λαβή.

items.remains.brokenstaff.name=σπασμένη ράβδος
items.remains.brokenstaff.desc=Η ράβδος έχει σπάσει στη μέση μετά τον θάνατο του ιδιοκτήτη Μάγου της. Νιώθεις ακόμα λίγη μαγική ενέργεια στη ράβδο, με την οποία μπορείς να δώσεις στα ραβδιά σου λίγη φόρτιση. Αυτό, όμως, θα καταστρέψει τη ράβδο.

items.remains.cloakscrap.name=κομμάτι υφάσματος
items.remains.cloakscrap.desc=Αυτό το κομμάτι ημιδιαφανούς υφάσματος μοιάζει να προέρχεται από τον μανδύα των σκιών ενός αείμνηστου Κλέφτη. Νιώθεις ακόμα λίγη μυστικιστική ενέργεια πάνω του, με την οποία μπορείς να δώσεις λίγο φορτίο στα τεχνουργήματά σου. Αυτό, όμως, θα καταστρέψει το ύφασμα.

items.remains.sealshard.name=θραύσματα σφραγίδας
items.remains.sealshard.desc=Αυτά τα μικρά θραύσματα κόκκινου κεριού μοιάζουν να προέρχονται από τη σφραγίδα ενός πεσμένου Πολεμιστή. Νιώθεις μια κάποια δύναμη θελήσεως πάνω στη σφραγίδα, χάρη στην οποία μπορείς να λάβεις λίγη ασπίδα προστασίας. Αυτό, όμως, θα καταστρέψει τα θραύσματα της σφραγίδας.

items.remains.tornpage.name=σκισμένη σελίδα
items.remains.tornpage.desc=Αυτή η σελίδα φαίνεται να σκίστηκε από τον ιερό τόμο ενός εκλιπόντος Κληρικού. Έχει ακόμα λίγη θεϊκή ενέργεια επάνω του, την οποία μπορείς να χρησιμοποιήσεις για να ανακτήσεις λίγη ζωή. Αυτό, όμως, θα κάνει τη σελίδα να καταστραφεί.



###rings
items.rings.ring.diamond=δαχτυλίδι με διαμάντι
items.rings.ring.opal=δαχτυλίδι με οπάλιο
items.rings.ring.garnet=δαχτυλίδι με γρανάτη
items.rings.ring.ruby=δαχτυλίδι με ρουμπίνι
items.rings.ring.amethyst=δαχτυλίδι με αμέθυστο
items.rings.ring.topaz=δαχτυλίδι με τοπάζιο
items.rings.ring.onyx=δαχτυλίδι με όνυχα
items.rings.ring.tourmaline=δαχτυλίδι με τουρμαλίνη
items.rings.ring.emerald=δαχτυλίδι με σμαράγδι
items.rings.ring.sapphire=δαχτυλίδι με ζαφείρι
items.rings.ring.quartz=δαχτυλίδι με χαλαζία
items.rings.ring.agate=δαχτυλίδι από αχάτη
items.rings.ring.equip_cursed=Το δαχτυλίδι στενεύει επίπονα στο δάχτυλό σου!
items.rings.ring.unknown_desc=Αυτό το μεταλλικό δαχτυλίδι είναι διακοσμημένο με πετράδι που φωσφορίζει στο σκοτάδι. Άραγε, τι επίδραση θα έχει μόλις φορεθεί;
items.rings.ring.known=Αυτό είναι ένα %s
items.rings.ring.identify=Έχεις εξοικειωθεί αρκετά με το δαχτυλίδι σου ώστε να το αναγνωρίσεις.
items.rings.ring.cursed_worn=Αυτό το δαχτυλίδι είναι καταραμένο· δεν μπορείς να το βγάλεις από πάνω σου.
items.rings.ring.curse_known=Νιώθεις μια διαβολική μαγεία να ελλοχεύει στο δαχτυλίδι.
items.rings.ring.not_cursed=Αυτό το δαχτυλίδι είναι απαλλαγμένο από διαβολική μαγεία.

items.rings.ringofaccuracy.name=δαχτυλίδι της ακρίβειας
items.rings.ringofaccuracy.stats=Όσο το δαχτυλίδι είναι φορεμένο, αυξάνει την ακρίβειά σου κατά _%s%%._
items.rings.ringofaccuracy.typical_stats=Όσο το δαχτυλίδι είναι φορεμένο, κανονικά αυξάνει την ακρίβειά σου κατά _%s%%._
items.rings.ringofaccuracy.combined_stats=Τα εξοπλισμένα δακτυλίδια συνδυάζουν την ισχύ τους, αυξάνοντας την ακρίβειά σου κατά _%s%%._
items.rings.ringofaccuracy.upgrade_stat_name_1=Άυξηση ακρίβειας
items.rings.ringofaccuracy.desc=Αυτό το δαχτυλίδι αυξάνει τη συγκέντρωσή σου· θα είναι πιο πιθανό για τις επιθέσεις σου να χτυπούν τον στόχο. Ένα καταραμένο δαχτυλίδι θα κάνει τις επιθέσεις σου να βρίσκουν δυσκολότερα τον στόχο.

items.rings.ringofarcana.name=δαχτυλίδι αρκάνας
items.rings.ringofarcana.stats=Όσο το δαχτυλίδι είναι φορεμένο, αυξάνει την ισχύ των γλύφων και των μαγικών ενισχύσεων κατά _%s%%._
items.rings.ringofarcana.typical_stats=Όσο το δαχτυλίδι είναι φορεμένο, κανονικά αυξάνει την ισχύ των γλύφων και των μαγικών ενισχύσεων κατά _%s%%._
items.rings.ringofarcana.combined_stats=Τα εξοπλισμένα δακτυλίδια συνδυάζουν την ισχύ τους, αυξάνοντας την ισχύ των μαγικών ενισχύσεων και των γλύφων κατά _%s%%._
items.rings.ringofarcana.upgrade_stat_name_1=Αύξηση αρκάνας
items.rings.ringofarcana.desc=Αυτό το δαχτυλίδι βελτιώνει τις μαγικές ενισχύσεις των όπλων και τους γλύφους των πανοπλιών – συμπεριλαμβανομένων των κατάρων! Αρχικά αυξάνει την πιθανότητα ενεργοποίησης της επίδρασης και έπειτα, αφού η πιθανότητα φτάσει στο 100%, αυξάνει την ισχύ της. Ένα καταραμένο δαχτυλίδι αποδυναμώνει τις ενισχύσεις, τους γλύφους και τις κατάρες.

items.rings.ringofelements.name=δαχτυλίδι των στοιχείων
items.rings.ringofelements.stats=Όσο το δαχτυλίδι είναι φορεμένο, προσφέρει _%s%%_ αντίσταση στα φυσικά στοιχεία.
items.rings.ringofelements.typical_stats=Όσο το δαχτυλίδι είναι φορεμένο, κανονικά προσφέρει _%s%%_ αντίσταση στα φυσικά στοιχεία.
items.rings.ringofelements.combined_stats=Τα εξοπλισμένα δαχτυλίδια σου συνδυάζουν την ισχύ τους, προσφέροντας _%s%%_ συνολική στοιχειακή αντίσταση.
items.rings.ringofelements.upgrade_stat_name_1=Αντίσταση
items.rings.ringofelements.desc=Αυτό το δαχτυλίδι αυξάνει την αντοχή στις περισσότερες φυσικές και μαγικές επιδράσεις, μειώνοντας τη ζημιά και τη διάρκειά τους. Ένα καταραμένο δαχτυλίδι χειροτερεύει αυτές τις επιδράσεις.

items.rings.ringofenergy.name=δαχτυλίδι της ενέργειας
items.rings.ringofenergy.stats=Όσο το δαχτυλίδι είναι φορεμένο, αυξάνει την ταχύτητα φόρτισης των ραβδιών, τεχνουργημάτων και ηρωικών πανοπλιών κατά _%s%%._
items.rings.ringofenergy.typical_stats=Όσο το δαχτυλίδι είναι φορεμένο, κανονικά αυξάνει την ταχύτητα φόρτισης των ραβδιών, τεχνουργημάτων και ηρωικών πανοπλιών κατά _%s%%._
items.rings.ringofenergy.combined_stats=Τα εξοπλισμένα δαχτυλίδια σου συνδυάζουν την ισχύ τους, αυξάνοντας την ταχύτητα φόρτισης κατά _%s%%_ συνολικά.
items.rings.ringofenergy.upgrade_stat_name_1=Αύξηση φόρτισης
items.rings.ringofenergy.desc=Ο μαγικός σου εξοπλισμός επαναφορτίζεται γρηγορότερα στο απόκρυφο πεδίο που εκπέμπει αυτό το δαχτυλίδι. Ένα καταραμένο δαχτυλίδι θα επιβραδύνει την επαναφόρτιση.

items.rings.ringofevasion.name=δαχτυλίδι της αποφυγής
items.rings.ringofevasion.stats=Όσο το δαχτυλίδι είναι φορεμένο, αυξάνει την αποφυγή σου κατά _%s%%._
items.rings.ringofevasion.typical_stats=Όσο το δαχτυλίδι είναι φορεμένο, κανονικά αυξάνει την αποφυγή σου κατά _%s%%._
items.rings.ringofevasion.combined_stats=Τα εξοπλισμένα δαχτυλίδια σου συνδυάζουν την ισχύ τους, αυξάνοντας την αποφυγή σου κατά _%s%%_ συνολικά.
items.rings.ringofevasion.upgrade_stat_name_1=Αύξηση αποφυγής
items.rings.ringofevasion.desc=Αυτό το δαχτυλίδι επιταχύνει τα αντανακλαστικά του χρήστη, κάνοντάς το ευκολότερο γι' αυτόν να αποφεύγει χτυπήματα. Αντίθετα, ένα καταραμένο δαχτυλίδι θα κάνει τον χρήστη ευκολότερο στόχο.

items.rings.ringofforce.name=δαχτυλίδι της ισχύος
items.rings.ringofforce.stats=Χωρίς όπλο, και με την τωρινή σου δύναμη, το δαχτυλίδι προκαλεί _%1$d-%2$d ζημιά._ Κρατώντας όπλο, το δαχτυλίδι αυξάνει τη ζημιά κατά _%3$d._
items.rings.ringofforce.typical_stats=Χωρίς όπλο, και με την τωρινή σου δύναμη, το δαχτυλίδι προκαλεί κανονικά _%1$d-%2$d ζημιά._ Κρατώντας όπλο, κανονικά αυξάνει τη ζημιά κατά _%3$d._
items.rings.ringofforce.combined_stats=Τα εξοπλισμένα δαχτυλίδια συνδυάζουν την ισχύ τους. Χωρίς όπλο, προκαλούν συνολικά _%1$d-%2$d ζημιά._ Με όπλο, αυξάνουν τη ζημιά κατά _%3$d._
items.rings.ringofforce.upgrade_stat_name_1=Άοπλη ζημιά
items.rings.ringofforce.upgrade_stat_name_2=Αύξηση ένοπλης ζημιάς
items.rings.ringofforce.upgrade_stat_name_3=Ζημιά ικανότητας
items.rings.ringofforce.ability_name=σταση του παλαιστη
items.rings.ringofforce.typical_ability_desc=Η Ξιφομάχος μπορεί να υιοθετήσει τη _στάση του παλαιστή_ με αυτό το δαχτυλίδι, και οι κανονικές της επιθέσεις θα χρησιμοποιούν το δαχτυλίδι ακόμα και με εξοπλισμένο όπλο. Οι επιθέσεις κανονικά προκαλούν _%1$d-%2$d ζημιά_ και κληρονομούν τη μαγική ενίσχυση και την ενδυνάμωση του όπλου. Η στάση επιβραδύνει την αναπλήρωση του οπλικού φορτίου κατά 50%%.
items.rings.ringofforce.ability_desc=Η Ξιφομάχος μπορεί να υιοθετήσει τη _στάση του παλαιστή_ με αυτό το δαχτυλίδι, και οι κανονικές της επιθέσεις θα χρησιμοποιούν το δαχτυλίδι ακόμα και με εξοπλισμένο όπλο. Οι επιθέσεις προκαλούν _%1$d-%2$d ζημιά_ και κληρονομούν τη μαγική ενίσχυση και την ενδυνάμωση του όπλου. Η στάση επιβραδύνει την αναπλήρωση του οπλικού φορτίου κατά 50%%.
items.rings.ringofforce.desc=Αυτό το δαχτυλίδι αυξάνει την ισχύ των χτυπημάτων μάχης σώμα-με-σώμα. Η αύξηση ισχύος είναι αρκετά ασθενής όταν κρατάς όπλο – αλλά μια άοπλη επίθεση θα γίνει εξαιρετικά ισχυρότερη. Αντιθέτως, ένα καταραμένο δαχτυλίδι θα αποδυναμώσει τα χτυπήματα του χρήστη.
items.rings.ringofforce$brawlersstance.name=στάση του παλαιστή
items.rings.ringofforce$brawlersstance.desc=Σε αυτή τη στάση, οι κανονικές επιθέσεις της Ξιφομάχου χρησιμοποιούν το δαχτυλίδι της ισχύος ακόμα κι αν έχει εξοπλισμένο όπλο. Αυτές οι επιθέσεις προκαλούν επιπλέον ζημιά και εξακολουθούν να χρησιμοποιούν την ενδυνάμωση και τη μαγική ενίσχυση του όπλου.\n\nΗ διατήρηση της στάσης, όμως, εξαντλεί τη συγκέντρωση, μειώνοντας την ταχύτητα επαναφόρτισης των οπλικών ικανοτήτων κατά 50%.\n\nΗ στάση ενεργοποιείται και απενεργοποιείται με τη χρήση του δαχτυλιδιού της ισχύος, αλλά, αν ενεργοποιηθεί και απενεργοποιηθεί γρήγορα, η μείωση της ταχύτητας φόρτισης θα παραμείνει για λίγο ακόμα.

items.rings.ringoffuror.name=δαχτυλίδι της παραφοράς
items.rings.ringoffuror.stats=Όσο το δαχτυλίδι είναι φορεμένο, αυξάνει την ταχύτητα των επιθέσεών σου κατά _%s%%._
items.rings.ringoffuror.typical_stats=Όσο το δαχτυλίδι είναι φορεμένο, κανονικά αυξάνει την ταχύτητα των επιθέσεών σου κατά _%s%%._
items.rings.ringoffuror.combined_stats=Τα εξοπλισμένα δαχτυλίδια σου συνδυάζουν την ισχύ τους, αυξάνοντας την ταχύτητα των επιθέσεών σου κατά _%s%%_ συνολικά.
items.rings.ringoffuror.upgrade_stat_name_1=Αύξηση ταχύτητας επίθεσης
items.rings.ringoffuror.desc=Αυτό το δαχτυλίδι εμφυσεί στον χρήστη μια εσωτερική οργή που του επιτρέπει να επιτίθεται ταχύτερα. Αντ' αυτού, ένα καταραμένο δαχτυλίδι θα επιβραδύνει την ταχύτητα επίθεσης.

items.rings.ringofhaste.name=δαχτυλίδι της βιασύνης
items.rings.ringofhaste.stats=Όσο το δαχτυλίδι είναι φορεμένο, αυξάνει την ταχύτητα κίνησής σου κατά _%s%%._
items.rings.ringofhaste.typical_stats=Όσο το δαχτυλίδι είναι φορεμένο, κανονικά αυξάνει την ταχύτητα κίνησής σου κατά _%s%%._
items.rings.ringofhaste.combined_stats=Τα εξοπλισμένα δαχτυλίδια σου συνδυάζουν την ισχύ τους, αυξάνοντας την ταχύτητα κίνησής σου κατά _%s%%_ συνολικά.
items.rings.ringofhaste.upgrade_stat_name_1=Αύξηση ταχύτητας κίνησης
items.rings.ringofhaste.desc=Αυτό το δαχτυλίδι μειώνει τη δυσκολία κίνησης του χρήστη, επιτρέποντάς του να τρέχει με υπεράνθρωπη ταχύτητα. Αντ' αυτού, ένα καταραμένο δαχτυλίδι επιβραδύνει τον χρήστη.

items.rings.ringofmight.name=δαχτυλίδι της δύναμης
items.rings.ringofmight.stats=Όσο το δαχτυλίδι είναι φορεμένο, αυξάνει τη δύναμή σου κατά _%1$d_ και τη μέγιστη ζωή σου κατά _%2$s%%._
items.rings.ringofmight.typical_stats=Όσο το δαχτυλίδι είναι φορεμένο, κανονικά αυξάνει τη δύναμή σου κατά _%1$d_ και τη μέγιστη ζωή σου κατά _%2$s%%._
items.rings.ringofmight.combined_stats=Τα εξοπλισμένα δαχτυλίδια σου συνδυάζουν την ισχύ τους, αυξάνοντας τη δύναμή σου κατά _%1$d_ και τη μέγιστη ζωή κατά _%2$s%%_ συνολικά.
items.rings.ringofmight.upgrade_stat_name_1=Αύξηση δύναμης
items.rings.ringofmight.upgrade_stat_name_2=Αύξηση μέγιστης ζωής
items.rings.ringofmight.desc=Αυτό το δαχτυλίδι τονώνει τα σωματικά χαρακτηριστικά του κατόχου, προσφέροντάς του μεγαλύτερη σωματική δύναμη και κράση. Ένα καταραμένο δαχτυλίδι θα αποδυναμώσει τον κάτοχο.

items.rings.ringofsharpshooting.name=δαχτυλίδι της ευστοχίας
items.rings.ringofsharpshooting.stats=Όσο το δαχτυλίδι είναι φορεμένο, αυξάνει τη ζημιά των όπλων ρίψης σου σαν να είχε αυξηθεί το επίπεδό τους κατά _%1$d._ Αυξάνει, επίσης, την ανθεκτικότητά τους κατά _%2$s%%._
items.rings.ringofsharpshooting.typical_stats=Όσο το δαχτυλίδι είναι φορεμένο, κανονικά αυξάνει τη ζημιά των όπλων ρίψης σου σαν να είχε αυξηθεί το επίπεδό τους κατά _%1$d._ Αυξάνει, επίσης, την ανθεκτικότητά τους, τυπικά κατά _%2$s%%._
items.rings.ringofsharpshooting.combined_stats=Τα εξοπλισμένα δαχτυλίδια σου συνδυάζουν την ισχύ τους, αυξάνοντας το επίπεδο των όπλων ρίψης κατά _%1$d_ και την ανθεκτικότητά τους κατά _%2$s%%_ συνολικά.
items.rings.ringofsharpshooting.upgrade_stat_name_1=Αύξηση επιπέδου ζημιάς
items.rings.ringofsharpshooting.upgrade_stat_name_2=Αύξηση αντοχής
items.rings.ringofsharpshooting.desc=Αυτό το δαχτυλίδι ενισχύει την ευστοχία του χρήστη, κάνοντας όλα τα όπλα ρίψης περισσότερο επιζήμια και ανθεκτικά. Ένα καταραμένο δαχτυλίδι θα έχει την αντίθετη επίδραση.

items.rings.ringoftenacity.name=δαχτυλίδι της επιμονής
items.rings.ringoftenacity.stats=Όσο το δαχτυλίδι είναι φορεμένο, μειώνει τη ζημιά που δέχεσαι κατά έως _%s%%._
items.rings.ringoftenacity.typical_stats=Όσο το δαχτυλίδι είναι φορεμένο, κανονικά μειώνει τη ζημιά που δέχεσαι κατά έως _%s%%._
items.rings.ringoftenacity.combined_stats=Τα εξοπλισμένα δαχτυλίδια σου συνδυάζουν την ισχύ τους, μειώνοντας τη ζημιά που λαμβάνεις κατά _%s%%_ συνολικά.
items.rings.ringoftenacity.upgrade_stat_name_1=Μέγιστη αντοχή στη ζημιά
items.rings.ringoftenacity.desc=Όσο το δαχτυλίδι είναι φορεμένο, επιτρέπει στον χρήστη να αντιστέκεται σε άλλοτε θανατηφόρα χτυπήματα. Όσο πιο τραυματισμένος είναι ο χρήστης, τόσο πιο ανθεκτικός θα είναι στη ζημιά. Ένα καταραμένο δαχτυλίδι θα επιτρέπει στους εχθρούς να εκτελούν ευκολότερα τον χρήστη.

items.rings.ringofwealth.name=δαχτυλίδι του πλούτου
items.rings.ringofwealth.stats=Όσο το δαχτυλίδι είναι φορεμένο, αυξάνει την τύχη σου κατά _%s%%._
items.rings.ringofwealth.typical_stats=Όσο το δαχτυλίδι είναι φορεμένο, κανονικά αυξάνει την τύχη σου κατά _%s%%._
items.rings.ringofwealth.combined_stats=Τα εξοπλισμένα δαχτυλίδια σου συνδυάζουν την ισχύ τους, αυξάνοντας την τύχη σου κατά _%s%%_ συνολικά.
items.rings.ringofwealth.upgrade_stat_name_1=Αύξηση καλοτυχίας
items.rings.ringofwealth.desc=Αυτό το δαχτυλίδι δρα ως μαγνήτης θησαυρών. Αυξάνει την πιθανότητα για τους εχθρούς και τους αποθηκευτικούς χώρους να έχουν πολύτιμα αντικείμενα ως λεία. Ένα καταραμένο δαχτυλίδι μειώνει την πιθανότητα να παίρνεις λάφυρα.



###scrolls
items.scrolls.scroll.ac_read=ΔΙΑΒΑΣΕ
items.scrolls.scroll.kaunan=πάπυρος KAUNAN
items.scrolls.scroll.sowilo=πάπυρος SOWILO
items.scrolls.scroll.laguz=πάπυρος LAGUZ
items.scrolls.scroll.yngvi=πάπυρος YNGVI
items.scrolls.scroll.gyfu=πάπυρος GYFU
items.scrolls.scroll.raido=πάπυρος RAIDO
items.scrolls.scroll.isaz=πάπυρος ISAZ
items.scrolls.scroll.mannaz=πάπυρος MANNAZ
items.scrolls.scroll.naudiz=πάπυρος NAUDIZ
items.scrolls.scroll.berkanan=πάπυρος BERKANAN
items.scrolls.scroll.odal=πάπυρος ODAL
items.scrolls.scroll.tiwaz=πάπυρος TIWAZ
items.scrolls.scroll.unknown_desc=Ένας ακατανόητος μαγικός ρούνος είναι γραμμένος σε αυτήν την περγαμηνή. Άραγε, τι θα κάνει αν διαβαστεί φωναχτά;
items.scrolls.scroll.blinded=Δεν μπορείς να διαβάσεις έναν πάπυρο ενώ έχεις τυφλωθεί.
items.scrolls.scroll.no_magic=Δεν μπορείς να διαβάσεις πάπυρο όσο έχεις μαγική ανοσία.
items.scrolls.scroll.cursed=Το καταραμένο βιβλίο σε εμποδίζει να χρησιμοποιήσεις τον πάπυρο! Ίσως ο πάπυρος αφαίρεσης κατάρας να μπορεί να λειτουργήσει...
items.scrolls.scroll$placeholder.name=πάπυρος

items.scrolls.inventoryscroll.warning=Θέλεις σίγουρα να ακυρώσεις την χρήση αυτού του παπύρου; Θα καταναλωθεί έτσι κι αλλιώς, καθώς δεν ήταν αναγνωρισμένος προτού τον χρησιμοποιήσεις.
items.scrolls.inventoryscroll.yes=Ναι, ακύρωση
items.scrolls.inventoryscroll.no=Όχι, άλλαξα γνώμη

items.scrolls.scrollofidentify.name=πάπυρος αναγνώρισης
items.scrolls.scrollofidentify.inv_title=Αναγνώρισε ένα αντικείμενο
items.scrolls.scrollofidentify.it_is=Το εξής αντικείμενο έχει αναγνωριστεί: %s.
items.scrolls.scrollofidentify.desc=Αυτός ο πάπυρος αποκαλύπτει μόνιμα όλα τα μυστικά ενός αντικειμένου.

items.scrolls.scrolloflullaby.name=πάπυρος νανουρίσματος
items.scrolls.scrolloflullaby.sooth=Ο πάπυρος εκπέμπει μια ηρεμιστική μελωδία. Νιώθεις μεγάλη υπνηλία.
items.scrolls.scrolloflullaby.desc=Όταν ο πάπυρος διαβαστεί, θα εκπέμψει μια νανουριστική μελωδία που θα βάλει όσους την ακούσουν σε έναν βαθύ μαγικό ύπνο. Για τον αναγνώστη και τους συμμάχους του, ο ύπνος είναι αναζωογονητικός.

items.scrolls.scrollofmagicmapping.name=πάπυρος μαγικής χαρτογράφησης
items.scrolls.scrollofmagicmapping.layout=Τώρα γνωρίζεις τη διάταξη του επιπέδου.
items.scrolls.scrollofmagicmapping.desc=Όταν ο πάπυρος διαβαστεί, θα χαράξει στη μνήμη σου μια εικόνα κρυστάλλινης διαύγειας που αποκαλύπτει την ακριβή διάταξη του επιπέδου και των κρυμμένων μυστικών του. Οι θέσεις των αντικειμένων και των πλασμάτων θα παραμείνουν άγνωστες.

items.scrolls.scrollofmirrorimage.name=πάπυρος κατοπτρικής εικόνας
items.scrolls.scrollofmirrorimage.copies=Ο πάπυρος σχηματίζει τις κατοπτρικές σου εικόνες.
items.scrolls.scrollofmirrorimage.no_copies=Ο πάπυρος προσπαθεί να σχηματίσει τις κατοπτρικές σου εικόνες, μα δεν έχουν πού να πάνε.
items.scrolls.scrollofmirrorimage.desc=Η μαγεία αυτού του παπύρου θα δημιουργήσει δύο ψεύτικους διδύμους του αναγνώστη. Αυτές οι κατοπτρικές εικόνες δρουν ως οι πιο αδύναμοι κλώνοι του αναγνώστη και κυνηγούν τους εχθρούς του. Έχουν, όμως, μηδενική ανθεκτικότητα και θα εξαφανιστούν μόλις τους προκληθεί ζημιά.

items.scrolls.scrollofretribution.name=πάπυρος αντεκδίκησης
items.scrolls.scrollofretribution.blast=Ισχυρή μαγική ενέργεια εξαπολύεται από τον πάπυρο!
items.scrolls.scrollofretribution.desc=Αυτός ο πάπυρος περιέχει καταστροφική ενέργεια που διοχετεύει τα βάσανα του αναγνώστη σε μία έκρηξη ισχύος. Όσο πιο αποδυναμωμένος είναι ο αναγνώστης, τόσο περισσότερη ζημιά θα προκαλέσει. Σε πολύ χαμηλή ζωή, ο πάπυρος μπορεί να σκοτώσει ακαριαία τους περισσότερους εχθρούς.\n\nΗ χρήση του παπύρου έχει επιπτώσεις στον χρήστη: τον τυφλώνει και τον αποδυναμώνει.

items.scrolls.scrollofrage.name=πάπυρος οργής
items.scrolls.scrollofrage.roar=Ο πάπυρος εκπέμπει έναν εξοργιστικό ήχο που αντηχεί στην κατακόμβη!
items.scrolls.scrollofrage.desc=Όταν διαβαστεί φωναχτά, ο πάπυρος θα απελευθερώσει μια τρομερή ιαχή. Θα τραβήξει όλους τους εχθρούς στον αναγνώστη και θα εξοργίσει τους κοντινούς.

items.scrolls.scrollofrecharging.name=πάπυρος επαναφόρτισης
items.scrolls.scrollofrecharging.surge=Ένα κύμα ενέργειας διαπερνά το σώμα σου που αναζωογονεί τα ραβδιά σου!
items.scrolls.scrollofrecharging.desc=Αφού απελευθερωθεί, η ωμή μαγική δύναμη αυτής της περγαμηνής θα επαναφορτίζει όλα τα ραβδιά του χρήστη ανά τον χρόνο.

items.scrolls.scrollofremovecurse.name=πάπυρος αφαίρεσης κατάρας
items.scrolls.scrollofremovecurse.inv_title=Καθάρισε ένα αντικείμενο
items.scrolls.scrollofremovecurse.cleansed=Το αντικείμενο λάμπει με εξαγνιστικό φως, και μια διαβολική ενέργεια διασκορπίζεται!
items.scrolls.scrollofremovecurse.not_cleansed=Το αντικείμενό σου λάμπει με εξαγνιστικό φως, αλλά δεν συμβαίνει κάτι.
items.scrolls.scrollofremovecurse.spirit=Ο πάπυρος απελευθερώνει το βασανισμένο πνεύμα!
items.scrolls.scrollofremovecurse.desc=Η μαγεία αυτού του παπύρου θα αφαιρέσει ακαριαία οποιαδήποτε κατάρα από ένα όπλο, ένα δαχτυλίδι, ένα ραβδί, μια πανοπλία ή ένα τεχνούργημα.

items.scrolls.scrollofteleportation.name=πάπυρος τηλεμεταφοράς
items.scrolls.scrollofteleportation.tele=Τηλεμεταφέρθηκες αστραπιαία σε ένα άλλο σημείο του επιπέδου.
items.scrolls.scrollofteleportation.no_tele=Η μαγεία τηλεμεταφοράς αποτυγχάνει.
items.scrolls.scrollofteleportation.cant_reach=Δεν μπορείς να τηλεμεταφερθείς εκεί.
items.scrolls.scrollofteleportation.prompt=Επίλεξε μία θέση να τηλεμεταφερθείς
items.scrolls.scrollofteleportation.desc=Το ξόρκι αυτής της περγαμηνής τηλεμεταφέρει άμεσα τον αναγνώστη σε μια διαφορετική περιοχή αυτού του επιπέδου. Ο πάπυρος δίνει προτεραιότητα σε μέρη που ο αναγνώστης δεν έχει ξαναπάει, αλλά δεν μπορεί να τηλεμεταφέρει μέσα από κλειδωμένες πόρτες ή οχυρώματα. Μπορεί, όμως, να αποκαλύψει κρυμμένες πόρτες που οδηγούν σε νέες περιοχές.

items.scrolls.scrollofterror.name=πάπυρος τρόμου
items.scrolls.scrollofterror.none=Ο πάπυρος εκπέμπει μια δυνατή κόκκινη λάμψη.
items.scrolls.scrollofterror.one=Ο πάπυρος εκπέμπει μια δυνατή κόκκινη λάμψη, και ο εχθρός (%s) το σκάει!
items.scrolls.scrollofterror.many=Ο πάπυρος εκπέμπει μία δυνατή κόκκινη λάμψη, και τα τέρατα το σκάνε!
items.scrolls.scrollofterror.desc=Όταν ο πάπυρος διαβαστεί, θα εκπέμψει μια λάμψη κόκκινου φωτός που προκαλεί τρόμο σε όλα τα ορατά πλάσματα. Κάθε επηρεασμένο πλάσμα θα τρέξει να ξεφύγει. Με την επίθεση σε εχθρό που διαφεύγει, η διάρκεια της επίδρασης μειώνεται.

items.scrolls.scrolloftransmutation.name=πάπυρος μεταστοιχείωσης
items.scrolls.scrolloftransmutation.inv_title=Μεταστοιχείωσε ένα αντικείμενο
items.scrolls.scrolloftransmutation.nothing=Δεν συνέβη κάτι ενδιαφέρον.
items.scrolls.scrolloftransmutation.morph=Το αντικείμενο μεταμορφώθηκε σε κάτι διαφορετικό!
items.scrolls.scrolloftransmutation.desc=Αυτός ο πάπυρος περιέχει ισχυρή μαγεία μεταστοιχείωσης. Όταν εφαρμοστεί σε κάποιο κατάλληλο αντικείμενο, θα το μετατρέψει σε ένα άλλο του ίδιου τύπου. Η μαγεία θα διατηρήσει τις αναβαθμίσεις, τις μαγικές ενισχύσεις και τους γλύφους. Οι πάπυροι και τα φίλτρα θα μετατρέπονται στα εξωτικά τους αντίστοιχα, και αντίστροφα.

items.scrolls.scrollofupgrade.name=πάπυρος αναβάθμισης
items.scrolls.scrollofupgrade.inv_title=Αναβάθμισε ένα αντικείμενο
items.scrolls.scrollofupgrade.weaken_curse=Ο πάπυρος αναβάθμισης αποδυνάμωσε την κατάρα του αντικειμένου σου.
items.scrolls.scrollofupgrade.remove_curse=Ο πάπυρος αναβάθμισης εξάλειψε την κατάρα του αντικειμένου σου!
items.scrolls.scrollofupgrade.desc=Αυτός ο πάπυρος θα αναβαθμίσει ένα αντικείμενο ή ένα σετ όπλων ρίψης. Η δύναμη και το μέγιστο φορτίο των ραβδιών θα αυξηθούν, τα όπλα και οι πανοπλίες θα προκαλούν/εμποδίζουν περισσότερη ζημιά, τα σετ όπλων ρίψης θα γίνουν ανθεκτικότερα και θα επισκευαστούν πλήρως, και η επίδραση των δαχτυλιδιών θα ενταθεί. \n\nΟ πάπυρος είναι ικανός να μετριάσει --ή και να εξαλείψει πλήρως-- μια κατάρα, αν και δεν είναι το ίδιο δραστικός με έναν πάπυρο αφαίρεσης κατάρας. Δυστυχώς, η μαγεία του παπύρου μπορεί να εξαλείψει και τη μαγική ενίσχυση ή τον γλύφο από εξοπλισμό υψηλού επιπέδου.



###exotic scrolls
items.scrolls.exotic.exoticscroll.kaunan=εξωτκός πάπυρος KAUNAN
items.scrolls.exotic.exoticscroll.sowilo=εξωτικός πάπυρος SOWILO
items.scrolls.exotic.exoticscroll.laguz=εξωτικός πάπυρος LAGUZ
items.scrolls.exotic.exoticscroll.yngvi=εξωτικός πάπυρος YNGVI
items.scrolls.exotic.exoticscroll.gyfu=εξωτικός πάπυρος GYFU
items.scrolls.exotic.exoticscroll.raido=εξωτικός πάπυρος RAIDO
items.scrolls.exotic.exoticscroll.isaz=εξωτικός πάπυρος ISAZ
items.scrolls.exotic.exoticscroll.mannaz=εξωτικός πάπυρος MANNAZ
items.scrolls.exotic.exoticscroll.naudiz=εξωτικός πάπυρος NAUDIZ
items.scrolls.exotic.exoticscroll.berkanan=εξωτικός πάπυρος BERKANAN
items.scrolls.exotic.exoticscroll.odal=εξωτικός πάπυρος ODAL
items.scrolls.exotic.exoticscroll.tiwaz=εξωτικός πάπυρος TIWAZ
items.scrolls.exotic.exoticscroll.unknown_desc=Ένας λαμπερός, ακατανόητος μαγικός ρούνος είναι γραμμένος στη μαύρη περγαμηνή. Φαίνεται ότι δεν ανήκει σε αυτήν τη γη. Άραγε, τι θα κάνει αν διαβαστεί φωναχτά;
items.scrolls.exotic.exoticscroll.discover_hint=Μπορείς να δημιουργήσεις αυτό το αντικείμενο μέσω αλχημείας.

items.scrolls.exotic.scrollofsirenssong.name=πάπυρος άσματος σειρήνων
items.scrolls.exotic.scrollofsirenssong.prompt=Επίλεξε έναν στόχο
items.scrolls.exotic.scrollofsirenssong.no_target=Ο πάπυρος ενεργοποιείται χωρίς στόχο.
items.scrolls.exotic.scrollofsirenssong.cancel=Πρέπει να επιλέξεις έναν στόχο.
items.scrolls.exotic.scrollofsirenssong.desc=Η ανάγνωση αυτού του παπύρου εκπέμπει μια σαγηνευτική μελωδία που σκλαβώνει τον εχθρό-στόχο· ο στόχος θα γίνει ο μόνιμος σύμμαχός σου! Οι άλλοι εχθροί που ακούν τον πάπυρο θα γοητευθούν προσωρινά.\n\nΟι πολύ ισχυροί εχθροί θα αντισταθούν στη σκλαβωτική επίδραση και απλώς θα γοητευθούν.
items.scrolls.exotic.scrollofsirenssong$enthralled.name=σκλάβωμα
items.scrolls.exotic.scrollofsirenssong$enthralled.desc=Αυτό το πλάσμα έχει συνεπαρθεί από τη μαγεία ενός παπύρου άσματος σειρήνων.\n\nΈνας σκλαβωμένος χαρακτήρας γίνεται ο μόνιμος σύμμαχός σου και θα παλεύει κάθε εχθρό που συναντά.

items.scrolls.exotic.scrollofantimagic.name=πάπυρος αντι-μαγείας
items.scrolls.exotic.scrollofantimagic.desc=Η μαγεία αυτού του παπύρου θα σε περικυκλώσει με μια μαγική αύρα που εμποδίζει προσωρινά όλες τις μαγικές επιδράσεις, είτε επιβλαβείς είτε βοηθητικές. Περιλαμβάνονται οι επιδράσεις ραβδιών, δαχτυλιδιών, παπύρων, τεχνουργημάτων, μαγικών ενισχύσεων και κατάρων. Οι ικανότητες των ηρωικών πανοπλιών, όμως, είναι αρκετά ισχυρές ώστε να λειτουργούν και πάλι.

items.scrolls.exotic.scrollofchallenge.name=πάπυρος πρόκλησης
items.scrolls.exotic.scrollofchallenge.desc=Όταν ο πάπυρος διαβαστεί δυνατά, θα απελευθερώσει μια δυνατή ιαχή που τραβάει τους εχθρούς στον αναγνώστη. Ταυτόχρονα, θα δημιουργήσει μια μικρή αρένα γύρω του.\n\nΌσο ο χρήστης είναι στην αρένα, λαμβάνει 33% μειωμένη ζημιά από όλες τις πηγές και δεν μειώνεται ο κορεσμός του. (Η μείωση της ζημιάς γίνεται πριν εφαρμοστούν άλλες μορφές εμποδισμού ζημιάς.)\n\nΤο μέγεθος της αρένας κλιμακώνεται ανάλογα με το μέγεθος του χώρου που βρίσκεται ο αναγνώστης. Θα είναι ιδιαίτερα μικρή σε κάποιους χώρους αφεντικών.
items.scrolls.exotic.scrollofchallenge$challengearena.name=αρένα πρόκλησης
items.scrolls.exotic.scrollofchallenge$challengearena.desc=Μία μαγική αρένα έχει υλοποιηθεί γύρω σου. Σηματοδοτείται από τον κυματοειδή κόκκινο καπνό.\n\nΌσο βρίσκεσαι στον καπνό, η πείνα σου δεν αυξάνεται και λαμβάνεις 33%% λιγότερη ζημιά από κάθε πηγή. Αν έχεις κι άλλα μέσα μείωσης ζημιάς (όπως η πανοπλία), θα εφαρμοστούν μετά από αυτή τη μείωση 33%%.\n\nΓύροι που απομένουν: %d.

items.scrolls.exotic.scrollofdivination.name=πάπυρος μαντείας
items.scrolls.exotic.scrollofdivination.nothing_left=Δεν έχει μείνει τίποτα να αναγνωρίσεις!
items.scrolls.exotic.scrollofdivination.desc=Αυτός ο πάπυρος θα αναγνωρίσει τυχαία 4 τύπους αντικειμένων που δεν γνωρίζεις ήδη. Οι τύποι που θα αναγνωριστούν μπορεί να είναι το χρώμα ενός φίλτρου, ο ρούνος ενός παπύρου ή το πετράδι ενός δαχτυλιδιού. Τα αντικείμενα που θα αναγνωριστούν δεν θα είναι απαραίτητα κάποια που κουβαλάς.
items.scrolls.exotic.scrollofdivination$wnddivination.desc=Ο πάπυρος μαντείας σου έχει αναγνωρίσει τα εξής αντικείμενα:

items.scrolls.exotic.scrollofdread.name=πάπυρος πανικού
items.scrolls.exotic.scrollofdread.desc=Όταν ο πάπυρος διαβαστεί, θα εκπέμψει μια κόκκινη λάμψη που υποβάλλει τον πανικό σε όλους τους εχθρούς του οπτικού σου πεδίου. Μια επίδραση τόσο ισχυρή, που οι εχθροί θα το σκάσουν εντελώς από την κατακόμβη και δε θα ξαναφανούν ποτέ!\n\nΑκριβώς όπως και στον τρόμο, ο πανικός μπορεί να καταλαγιάσει είτε με τον χρόνο είτε αν ο στόχος λάβει ζημιά.\n\nΟι εχθροί με ισχυρή βούληση, όπως τα αφεντικά, θα λάβουν την απλή επίδραση του τρόμου.

items.scrolls.exotic.scrollofenchantment.name=πάπυρος ενίσχυσης
items.scrolls.exotic.scrollofenchantment.inv_title=Ενίσχυσε ένα αντικείμενο
items.scrolls.exotic.scrollofenchantment.weapon=Διάλεξε μία μαγική ενίσχυση για να εφαρμόσεις στο όπλο σου.
items.scrolls.exotic.scrollofenchantment.armor=Διάλεξε έναν γλύφο για να εφαρμόσεις στην πανοπλία σου.
items.scrolls.exotic.scrollofenchantment.cancel=Ακύρωση
items.scrolls.exotic.scrollofenchantment.cancel_warn=Η ακύρωση θα καταναλώσει τον πάπυρο μαγικής ενίσχυσης έτσι κι αλλιώς. Σίγουρα;
items.scrolls.exotic.scrollofenchantment.cancel_warn_yes=Ναι, σίγουρα
items.scrolls.exotic.scrollofenchantment.cancel_warn_no=Όχι, άλλαξα γνώμη
items.scrolls.exotic.scrollofenchantment.desc=Αυτός ο πάπυρος εγχέει ένα όπλο ή μία πανοπλία με ισχυρή μαγική ενέργεια. Ο αναγνώστης έχει έναν βαθμό ελέγχου στη μαγεία που θα εγχυθεί.

items.scrolls.exotic.scrollofforesight.name=πάπυρος διορατικότητας
items.scrolls.exotic.scrollofforesight.desc=Όταν ο πάπυρος διαβαστεί, οι λεπτομέρειες του κοντινού εδάφους θα εκπέμπονται με κρυστάλλινη διαύγεια στο μυαλό του αναγνώστη. Η επίδραση διαρκεί για μεγάλο χρονικό διάστημα. Αποκαλύπτει επίσης κάθε κρυφή πόρτα ή παγίδα, καθιστώντας αχρείαστη την αναζήτηση.

items.scrolls.exotic.scrollofmetamorphosis.name=πάπυρος μεταμόρφωσης
items.scrolls.exotic.scrollofmetamorphosis.choose_desc=Επίλεξε ένα ταλέντο να το μεταμορφώσεις.
items.scrolls.exotic.scrollofmetamorphosis.replace_desc=Διάλεξε ένα νέο ταλέντο που θα αντικαταστήσει το μεταμορφωμένο.
items.scrolls.exotic.scrollofmetamorphosis.cancel_warn=Η ακύρωση θα καταναλώσει τον πάπυρο μεταμόρφωσης έτσι κι αλλιώς. Σίγουρα;
items.scrolls.exotic.scrollofmetamorphosis.metamorphose_talent=μεταμόρφωση ταλέντου
items.scrolls.exotic.scrollofmetamorphosis.desc=Αυτός ο πάπυρος περιέχει μια ισχυρή μαγεία μεταστοιχείωσης, η οποία εφαρμόζεται στον ίδιο τον χρήστη κι όχι σε αντικείμενο. Σου επιτρέπει να επιλέξεις ένα ταλέντο σου και να το αντικαταστήσεις με ένα άλλο από πέντε επιλογές της ίδιας βαθμίδας – από κάθε άλλον ήρωα!\n\nΑυτή η επίδραση μπορεί να χρησιμοποιηθεί μόνο στα κύρια ταλέντα των ηρώων – όχι σε ταλέντα εξειδικεύσεων ή ικανοτήτων πανοπλίας. Τα ταλέντα που δεν μπορείς να χρησιμοποιήσεις δεν θα δοθούν ως επιλογές.

items.scrolls.exotic.scrollofmysticalenergy.name=πάπυρος απόκρυφης ενέργειας
items.scrolls.exotic.scrollofmysticalenergy.desc=Όταν απελευθερωθεί, η ωμή μαγική δύναμη αυτής της περγαμηνής θα φορτίζει σταδιακά τα εξοπλισμένα τεχνουργήματα του χρήστη.

items.scrolls.exotic.scrollofpassage.name=πάπυρος περάσματος
items.scrolls.exotic.scrollofpassage.desc=Η μαγεία αυτής της περγαμηνής τηλεμεταφέρει τον αναγνώστη στην από πάνω είσοδο της τρέχουσας τοποθεσίας. Πολύ χρήσιμο για να φτάσεις γρήγορα στο κατάστημα.

items.scrolls.exotic.scrollofprismaticimage.name=πάπυρος πρισματικής εικόνας
items.scrolls.exotic.scrollofprismaticimage.desc=Η μαγεία αυτού του παπύρου θα δημιουργήσει έναν πολύχρωμο δίδυμο του αναγνώστη. Αυτή η πρισματική εικόνα δρα ως ο πιο αδύναμος κλώνος του αναγνώστη: έχει παρόμοια άμυνα, αλλά χαμηλότερη ζωή και επίθεση.\n\nΗ πρισματική εικόνα θα παρουσιάζεται όταν υπάρχουν κοντινοί εχθροί, και θα επιχειρεί να προστατεύει τον αναγνώστη.\n\nΑν υπάρχει ήδη κάποια πρισματική εικόνα, με τη χρήση του παπύρου θα θεραπευτεί πλήρως.

items.scrolls.exotic.scrollofpsionicblast.name=πάπυρος ψιονικής έκρηξης
items.scrolls.exotic.scrollofpsionicblast.ondeath=Η ψιονική έκρηξη σου ξεσκίζει το μυαλό...
items.scrolls.exotic.scrollofpsionicblast.desc=Αυτός ο πάπυρος περιέχει μια τρομερά καταστροφική ενέργεια, που μπορεί να διοχετευτεί για να καταστρέψει τα μυαλά όλων των ορατών πλασμάτων.\n\nΥπάρχει, όμως, σημαντική αντίδραση: ο αναγνώστης θα λάβει επίσης ζημιά, θα τυφλωθεί και θα αποδυναμωθεί. Όσο περισσότερους στόχους χτυπήσει ο πάπυρος, τόσο λιγότερη ζημιά θα λάβει ο αναγνώστης.



###spells
items.spells.alchemize.name=αλχημισμός
items.spells.alchemize.prompt=Αλχήμισε ένα αντικείμενο
items.spells.alchemize.desc=Αυτό το ξόρκι κατέχει δυνάμεις μεταστοιχείωσης παρόμοιες με αυτές του αλχημικού τσουκαλιού. Με κάθε εκτέλεση, ο χρήστης θα μπορεί να μετατρέψει ένα αντικείμενο (ή στοίβα αντικειμένων) είτε σε χρυσό είτε σε αλχημική ενέργεια. Η μετατροπή φίλτρων και παπύρων σε αλχημική ενέργεια θα τα αναγνωρίσει κιόλας!\n\nΚάποιες ποσότητες του αλχημισμού πωλούνται στα καταστήματα. Αλλά μπορεί να δημιουργηθεί πολύ περισσότερος μέσω της αλχημείας, αναμειγνύοντας έναν σπόρο με έναν ρουνικό λίθο και λίγη αλχημική ενέργεια.
items.spells.alchemize$wndalchemizeitem.sell=Μετατροπή σε %dχρ
items.spells.alchemize$wndalchemizeitem.sell_1=Μετατροπή 1 σε %dχρ
items.spells.alchemize$wndalchemizeitem.sell_all=Μετατροπή όλων σε %dχρ
items.spells.alchemize$wndalchemizeitem.energize=Αυτό για %d ενέργεια
items.spells.alchemize$wndalchemizeitem.energize_1=1 για %d ενέργεια
items.spells.alchemize$wndalchemizeitem.energize_all=Όλα για %d ενέργεια

items.spells.beaconofreturning.name=πομπός της επιστροφής
items.spells.beaconofreturning.preventing=Η ισχυρή μαγική αύρα αυτού του μέρους απέτρεψε τη χρήση του ξορκιού!
items.spells.beaconofreturning.creatures=Η ψυχική αύρα των γειτονικών πλασμάτων αποτρέπει την τηλεμεταφορά.
items.spells.beaconofreturning.set=Ο πομπός ορίστηκε στην τρέχουσα θέση.
items.spells.beaconofreturning.wnd_body=Με τον ορισμό, θα αναιρέσεις το σημείο στο οποίο είχε τεθεί προηγουμένως ο πομπός.\n\nΜε την επιστροφή, θα βρεθείς στην τελευταία θέση που είχες ορίσει. Αυτό θα καταναλώσει μία χρήση του ξορκιού.
items.spells.beaconofreturning.wnd_set=Θέσε
items.spells.beaconofreturning.wnd_return=Επίστρεψε
items.spells.beaconofreturning.desc_set=Ο πομπός ορίστηκε κάπου στο %dο επίπεδο.
items.spells.beaconofreturning.desc=Αυτό το περίπλοκο ξόρκι δίνει στον χρήστη τη δυνατότητα να επιστρέψει σε μία προκαθορισμένη θέση, ανεξαρτήτως απόστασης. Το ξόρκι θα καταναλωθεί μόνο στην επιστροφή. Μπορεί να οριστεί όσες φορές θέλεις, αλλά θυμάται μόνο την πιο πρόσφατη θέση που έχει οριστεί.

items.spells.curseinfusion.name=έγχυση κατάρας
items.spells.curseinfusion.inv_title=Καταράσου ένα αντικείμενο
items.spells.curseinfusion.desc=Αυτό το ξόρκι εγχέει την ισχυρή κακοήθη μαγεία του DM-300 σε ένα κομμάτι εξοπλισμού. Το αντικείμενο θα καταραστεί αμέσως, και οποιαδήποτε μαγική ενίσχυση ή γλύφος πάνω του θα εξαλειφθεί.\n\nΣτην περίπτωση των όπλων, των πανοπλιών και των ραβδιών, το αντικείμενο θα λάβει και αναβαθμίσεις. Οι αναβαθμίσεις από πολλαπλές εφαρμογές της έγχυσης κατάρας δεν προστίθενται. Αν το αντικείμενο χάσει την κατάρα, θα χαθεί και η αναβάθμιση.\n\nΟι πολλαπλές εγχύσεις κατάρας μπορούν να αλλάξουν την κατάρα ενός όπλου ή πανοπλίας.

items.spells.spell.ac_cast=ΕΚΤΕΛΕΣΕ
items.spells.spell.no_magic=Δεν μπορείς να χρησιμοποιήσεις ξόρκια όσο έχεις μαγική ανοσία.
items.spells.spell.discover_hint=Μπορείς να δημιουργήσεις αυτό το αντικείμενο μέσω αλχημείας.

items.spells.magicalinfusion.name=μαγική έγχυση
items.spells.magicalinfusion.inv_title=Αναβάθμισε ένα αντικείμενο
items.spells.magicalinfusion.infuse=Το αντικείμενο έχει εγχυθεί με απόκρυφη ενέργεια!
items.spells.magicalinfusion.desc=Αυτό το ξόρκι κατέχει την ίδια μαγική δύναμη με έναν πάπυρο αναβάθμισης, αλλά σε πιο σταθερή μορφή.\n\nΕνώ αναβαθμίζει κανονικά το αντικείμενο, δεν εξαλείφει τις μαγικές ενίσχυσεις ούτε τους γλύφους ή τις κατάρες.

items.spells.magicalporter.name=μαγικός μεταφορέας
items.spells.magicalporter.inv_title=Στείλε ένα αντικείμενο
items.spells.magicalporter.nowhere=Δεν υπάρχει κάποιο μέρος για να στείλεις αντικείμενο.
items.spells.magicalporter.desc=Αυτό το ξόρκι θα μεταφέρει μαγικά οποιοδήποτε αντικείμενο επιλέξεις. Σε αντίθεση με τον πομπό του εμπόρου, όμως, τα αντικείμενα θα μεταφερθούν στην είσοδο του επιπέδου που βρίσκεται το επόμενο αφεντικό.

items.spells.phaseshift.name=αλλαγή φάσης
items.spells.phaseshift.no_target=Δεν υπάρχει κάτι εκεί για να τηλεμεταφέρεις.
items.spells.phaseshift.desc=Αυτό το χαοτικό ξόρκι θα τηλεμεταφέρει οποιονδήποτε επιλεγμένο χαρακτήρα σε μια τυχαία περιοχή του τρέχοντος επιπέδου. Ταυτόχρονα, θα τον ακινητοποιήσει για ένα μεγάλο χρονικό διάστημα. Οι ισχυροί εχθροί θα αντισταθούν στην ακινητοποιητική επίδραση. Το ξόρκι μπορεί να χρησιμοποιηθεί σε έναν στόχο ή και στον ίδιο τον χρήστη.

items.spells.reclaimtrap.name=ανάσωση παγίδας
items.spells.reclaimtrap.no_trap=Δεν υπάρχει παγίδα εκεί.
items.spells.reclaimtrap.desc_trap=Αυτό το ξόρκι είναι έτοιμο να ενεργοποιήσει μια _%s._
items.spells.reclaimtrap.desc=Αυτό το ξόρκι περιέχει απομεινάρια της μηχανικής ενέργειας του DM-300. Όταν χρησιμοποιηθεί σε μια ενεργή παγίδα, η ουσία της παγίδας θα απορροφηθεί από το ξόρκι. Θα μπορείς, έπειτα, να ενεργοποιήσεις την επίδραση της παγίδας σε όποιο σημείο θέλεις.\n\nΚάποιες παγίδες μπορεί να μη λειτουργούν παντού, και το ξόρκι μπορεί να αποθηκεύσει μόνο μία παγίδα κάθε φορά.

items.spells.recycle.name=ανακύκλωση
items.spells.recycle.inv_title=Ανακύκλωσε ένα αντικείμενο
items.spells.recycle.recycled=Το αντικείμενο ανακυκλώθηκε σε: %s.
items.spells.recycle.desc=Αυτό το ξόρκι περιέχει μια κατώτερη μορφή μαγείας μεταστοιχείωσης. Ενώ δεν θα δουλέψει σε εξοπλισμό, το ξόρκι θα μετατρέψει έναν πάπυρο, ένα φίλτρο, έναν σπόρο, έναν ρουνικό λίθο ή ένα εμποτισμένο βέλος σε ένα τυχαίο αντικείμενο του ίδιου τύπου.

items.spells.summonelemental.name=επίκληση στοιχείου
items.spells.summonelemental.ac_imbue=ΕΜΠΟΤΙΣΕ
items.spells.summonelemental.imbue_prompt=Εμπότισε ένα αντικείμενο
items.spells.summonelemental.desc=Αυτό το ξόρκι διοχετεύει την ενέργεια των στοιχειακών κάρβουνων που χρησιμοποιήθηκαν για την παρασκευή του. Η ενέργεια αυτή θα σου επιτρέψει να υλοποιήσεις ένα φιλικό στοιχείο που θα παλεύει στο πλευρό σου! Μπορείς να έχεις μόνο ένα στοιχείο επικαλεσμένο τη φορά, αλλά, αν ξαναχρησιμοποιήσεις το ξόρκι, το στοιχείο θα επιστρέψει δίπλα σου με μηδενικό κόστος.
items.spells.summonelemental.desc_newborn=Το ξόρκι δεν έχει εμποτιστεί· θα υλοποιήσει ένα _νεογέννητο στοιχείο_ που δεν διαθέτει επιθέσεις απόστασης. Μπορείς να ενδυναμώσεις το ξόρκι εμποτίζοντάς το με ένα από τα εξής αναγνωρισμένα αντικείμενα: φίλτρο υγρής φλόγας, φίλτρο πάγου, πάπυρος επαναφόρτισης, πάπυρος μεταστοιχείωσης. Έτσι, οι μελλοντικές του επικλήσεις θα είναι ενός ισχυρού στοιχείου!
items.spells.summonelemental.desc_fire=Το ξόρκι είναι καυτό στο άγγιγμα· θα υλοποιήσει ένα _στοιχείο της φωτιάς._ Μπορείς να εμποτίσεις ένα διαφορετικό αντικείμενο, αλλά το ξόρκι θα χάσει τον τρέχοντα εμποτισμό.
items.spells.summonelemental.desc_frost=Το ξόρκι είναι ψυχρό στο άγγιγμα· θα υλοποιήσει ένα _στοιχείο του πάγου._ Μπορείς να εμποτίσεις ένα διαφορετικό αντικείμενο, αλλά το ξόρκι θα χάσει τον τρέχοντα εμποτισμό.
items.spells.summonelemental.desc_shock=Το ξόρκι εκπέμπει στατική ενέργεια· θα υλοποιήσει ένα _στοιχείο του ηλεκτρισμού._ Μπορείς να εμποτίσεις ένα διαφορετικό αντικείμενο, αλλά το ξόρκι θα χάσει τον τρέχοντα εμποτισμό.
items.spells.summonelemental.desc_chaos=Το ξόρκι εκπέμπει χαοτική ενέργεια· θα υλοποιήσει ένα _στοιχείο του χάους._ Μπορείς να εμποτίσεις ένα διαφορετικό αντικείμενο, αλλά το ξόρκι θα χάσει τον τρέχοντα εμποτισμό.

items.spells.targetedspell.prompt=Επίλεξε έναν στόχο
items.spells.targetedspell.inv_title=Αναβάθμισε ένα αντικείμενο

items.spells.telekineticgrab.name=τηλεκινητική αρπαγή
items.spells.telekineticgrab.cant_grab=Δεν μπορείς να το αρπάξεις αυτό.
items.spells.telekineticgrab.no_target=Δεν υπάρχει κάτι να αρπάξεις εδώ.
items.spells.telekineticgrab.desc=Αυτό το ξόρκι επιτρέπει στον χρήστη να αρπάξει από μακριά όλα τα αντικείμενα σε ένα σημείο – ή όλα τα όπλα ρίψης που έχουν καρφωθεί σε έναν εχθρό!\n\nΔεν μπορεί να αρπάξει αντικείμενα που ανήκουν σε άλλους, ούτε να αρπάξει αποθηκευτικούς χώρους όπως σεντούκια.

items.spells.unstablespell.name=ασταθές ξόρκι
items.spells.unstablespell.desc=Αυτός ο μικρός τετραγωνικός κρύσταλλος έχει εναλασσόμενα ρουνικά σύμβολα σε κάθε επιφάνεια.\n\nΌταν εκτελεστεί, θα ενεργοποιήσει την επίδραση ενός τυχαίου παπύρου. Η επίδραση θα είναι πάντα σχετική με τη μάχη αν υπάρχουν εχθροί στο οπτικό σου πεδίο, ειδάλλως θα είναι πάντα μη μαχητική.

items.spells.wildenergy.name=ξέφρενη ενέργεια
items.spells.wildenergy.desc=Αυτό το ξόρκι περιέχει κάποια από την καταραμένη ενέργεια που τροφοδοτούσε το DM-300. Όταν εκτελεστεί, θα επαναφορτίσει τα ραβδιά και τα εξοπλισμένα τεχνουργήματά σου και θα προκαλέσει μια τυχαία επίδραση καταραμένου ραβδιού. Μπορείς να διαλέξεις την κατεύθυνση που θα εξαπολύσεις την καταραμένη επίδραση.


###runestones
items.stones.inventorystone.ac_use=ΧΡΗΣΙΜΟΠΟΙΗΣΕ

items.stones.runestone$placeholder.name=ρουνικός λίθος
items.stones.runestone.discover_hint=Μπορείς να βρεις αυτό το αντικείμενο τυχαία στην κατακόμβη, ή να το παρασκευάσεις μέσω αλχημείας.

items.stones.stoneofaggression.name=λίθος επιθετικότητας
items.stones.stoneofaggression.desc=Όταν αυτός ο λίθος πεταχτεί σε κάποιον σύμμαχο ή εχθρό, όλοι οι κοντινοί εχθροί θα προτιμούν να επιτίθενται σε αυτόν για ένα μικρό χρονικό διάστημα.\n\nΤα αφεντικά αντιστέκονται μερικώς στην επίδραση, μειώνοντας τη ζημιά και ακόμα περισσότερο τη διάρκεια από τις επιθέσεις των υποτακτικών τους.
items.stones.stoneofaggression$aggression.name=στόχος
items.stones.stoneofaggression$aggression.desc=Μια χειριστική μαγεία κάνει όλους τους κοντινούς εχθρούς να προτιμούν να επιτεθούν σε αυτόν τον στόχο.\n\nΓύροι που απομένουν: %s.

items.stones.stoneofaugmentation.name=λίθος ενδυνάμωσης
items.stones.stoneofaugmentation.inv_title=Ενδυνάμωσε ένα αντικείμενο
items.stones.stoneofaugmentation.desc=Αυτός ο ρουνικός λίθος κατέχει ισχυρή μαγεία που ενδυναμώνει τον εξοπλισμό, ενισχύοντας μία ιδιότητα εις βάρος κάποιας άλλης.\n\nΌταν χρησιμοποιηθεί σε ένα όπλο, θα σου επιτρέψει να ενισχύσεις είτε ταχύτητα είτε επίθεση. Τα όπλα ρίψης θα λάβουν ή θα χάσουν αντοχή, ανάλογα με την ταχύτητα τους.\n\nΌταν χρησιμοποιηθεί σε μία πανοπλία, θα σου επιτρέψει να ενισχύσεις είτε άμυνα είτε αποφυγή.
items.stones.stoneofaugmentation.discover_hint=Μπορείς να αγοράσεις αυτό το αντικείμενο από κατάστημα ή να το παρασκευάσεις μέσω αλχημείας.
items.stones.stoneofaugmentation$wndaugment.choice=Τι θα ήθελες να ενδυναμώσεις;
items.stones.stoneofaugmentation$wndaugment.speed=Ταχύτητα
items.stones.stoneofaugmentation$wndaugment.damage=Ζημιά
items.stones.stoneofaugmentation$wndaugment.evasion=Αποφυγή
items.stones.stoneofaugmentation$wndaugment.defense=Άμυνα
items.stones.stoneofaugmentation$wndaugment.none=Αφαίρεσε την ενδυνάμωση
items.stones.stoneofaugmentation$wndaugment.cancel=Άκυρο

items.stones.stoneofblast.name=λίθος έκρηξης
items.stones.stoneofblast.desc=Αυτός ο ρουνικός λίθος εκρήγνυται άμεσα στο σημείο στο οποίο πετάγεται. Όπως και σε μία βόμβα, η έκρηξη θα προκαλέσει ζημιά σε οτιδήποτε κοντινό.

items.stones.stoneofblink.name=λίθος διακτινισμού
items.stones.stoneofblink.desc=Αυτός ο ρουνικός λίθος θα τηλεμεταφέρει τον χρήστη στο σημείο που θα πεταχτεί.

items.stones.stoneofclairvoyance.name=λίθος διορατικότητας
items.stones.stoneofclairvoyance.desc=Αυτός ο λίθος αποκαλύπτει όλα τα τετράγωνα μιας ευρείας περιοχής γύρω από το σημείο που πετιέται. Η επίδρασή του θα περάσει ακόμη και μέσα από τοίχους.

items.stones.stoneofdeepsleep.name=λίθος βαθέως ύπνου
items.stones.stoneofdeepsleep.desc=Όταν αυτός ο λίθος πεταχτεί στον εχθρό, θα τον βάλει σε έναν βαθύ μαγικό ύπνο. Οι μαγικά υπνωτισμένοι εχθροί θα κοιμούνται αιώνια έως ότου ενοχληθούν.

items.stones.stoneofdetectmagic.name=λίθος εντοπισμού μαγείας
items.stones.stoneofdetectmagic.inv_title=Ανίχνευσε ένα αντικείμενο
items.stones.stoneofdetectmagic.detected_none=Δεν εντόπισες κάποια μαγεία που να επηρεάζει αυτό το αντικείμενο.
items.stones.stoneofdetectmagic.detected_both=Εντοπίζεις τόσο θετική όσο και διαβολική μαγεία να επηρεάζει το αντικείμενο!
items.stones.stoneofdetectmagic.detected_good=Εντοπίζεις θετική μαγεία να επηρεάζει το αντικείμενο!
items.stones.stoneofdetectmagic.detected_bad=Εντοπίζεις διαβολική μαγεία να επηρεάζει το αντικείμενο!
items.stones.stoneofdetectmagic.desc=Αυτός ο ρουνικός λίθος μπορεί να εντοπίσει οποιαδήποτε μαγεία που επηρεάζει ένα αντικείμενο. Η χρήση του λίθου σε μη αναγνωρισμένο αντικείμενο θα σου αποκαλύψει το αν είναι καταραμένο αλλά και το αν έχει αναβαθμίσεις ή μαγική ενίσχυση.

items.stones.stoneofdisarming.name=λίθος αφοπλισμού
items.stones.stoneofdisarming.desc=Αυτός ο ρουνικός λίθος κατέχει μαγεία που αχρηστεύει τις απανταχού επιζήμιες παγίδες της κατακόμβης. Θα αφοπλίσει μέχρι και 9 παγίδες γύρω από το σημείο που θα πεταχτεί.

items.stones.stoneofenchantment.name=λίθος ενίσχυσης
items.stones.stoneofenchantment.inv_title=Ενίσχυσε ένα αντικείμενο
items.stones.stoneofenchantment.weapon=Το όπλο σου λάμπει στο σκοτάδι!
items.stones.stoneofenchantment.armor=Η πανοπλία σου λάμπει στο σκοτάδι!
items.stones.stoneofenchantment.desc=Αυτός ο ρουνικός λίθος κατέχει μαγεία ενίσχυσης. Σε αντίθεση με έναν πάπυρο αναβάθμισης, δεν θα αυξήσει απευθείας τη δύναμη ενός αντικειμένου· θα εμποτίσει ένα όπλο ή μια πανοπλία με μαγική ενίσχυση ή γλύφο, χαρίζοντάς τους μία νέα δύναμη.

items.stones.stoneoffear.name=λίθος φόβου
items.stones.stoneoffear.desc=Όταν αυτός ο λίθος πεταχτεί σε κάποιον χαρακτήρα, θα κυριευτεί από τον τρόμο και θα τρέξει να ξεφύγει. Η επίθεση σε τρομαγμένο χαρακτήρα θα μειώσει τη διάρκεια της επίδρασης.

items.stones.stoneofflock.name=λίθος κοπαδιού
items.stones.stoneofflock.desc=Αυτός ο ρουνικός λίθος υλοποιεί μαγικά πρόβατα γύρω από το σημείο στο οποίο πετάγεται, για μια μικρή χρονική περίοδο.

items.stones.stoneofintuition.name=λίθος διαίσθησης
items.stones.stoneofintuition.inv_title=Επίλεξε ένα αντικείμενο
items.stones.stoneofintuition.desc=Αυτός ο ρουνικός λίθος φέρει μια πιο αδύναμη εκδοχή της μαγείας που βρίσκεται στους παπύρους αναγνώρισης. Αντί να αναγνωρίσει κατευθείαν ένα αντικείμενο, επαφίεται στη διαίσθησή σου. Ο λίθος σού επιτρέπει να αποπειραθείς να αναγνωρίσεις τον τύπο ενός φίλτρου, παπύρου ή δαχτυλιδιού, μαντεύοντάς τον.
items.stones.stoneofintuition.break_info=Μπορείς να χρησιμοποιήσεις έναν λίθο διαίσθησης δύο φορές προτού καταναλωθεί. _Η επόμενη χρήση δεν θα καταναλώσει τον λίθο._
items.stones.stoneofintuition.break_warn=Έχεις χρησιμοποιήσει έναν λίθο διαίσθησης προηγουμένως, οπότε η _επόμενη χρήση θα καταναλώσει έναν λίθο._
items.stones.stoneofintuition$wndguess.text=Μάντεψε ποιος είναι ο τύπος του αγνώστου αντικειμένου. Εάν μαντέψεις σωστά, ο τύπος του θα αναγνωριστεί!
items.stones.stoneofintuition$wndguess.correct=Σωστό. Ο τύπος αντικειμένου έχει ταυτοποιηθεί!
items.stones.stoneofintuition$wndguess.incorrect=Η εικασία σου ήταν λανθασμένη.
items.stones.stoneofintuition$wndguess.break=Ο λίθος διαίσθησής σου γίνεται σκόνη...

items.stones.stoneofshock.name=λίθος ηλεκτροπληξίας
items.stones.stoneofshock.desc=Αυτός ο ρουνικός λίθος απελευθερώνει μια έκρηξη ηλεκτρικής ενέργειας. Ακινητοποιεί για λίγο όλους τους κοντινούς στόχους και παρέχει φορτίο στα ραβδιά του χρήστη για κάθε στόχο που χτυπήθηκε.


###trinkets
items.trinkets.chaoticcenser.name=χαοτικό θυμιατό
items.trinkets.chaoticcenser.spew=Το θυμιατό είναι έτοιμο να εξαπολύσει: %s.
items.trinkets.chaoticcenser.desc=Αφού έμεινε για κάποιο χρόνο στο αλχημικό τσουκάλι, αυτό το θυμιατό φαίνεται πως παράγει καπνό από μόνο του! Αυτά τα αέρια συγκεντρώνονται και ξεχύνονται από το θυμιατό προς τους εχθρούς σε ημι-τυχαία χρονικά διαστήματα. Φαίνεται ικανό να παράγει όλα τα είδη αερίων, αλλά θα έχεις μια προειδοποίηση αμέσως πριν ενεργοποιηθεί.
items.trinkets.chaoticcenser.typical_stats_desc=Κανονικά, αυτό το μαραφέτι εξαπολύει επιβλαβές αέριο κοντά σε εχθρό περίπου κάθε _%d_ γύρους. Το αέριο θα εμφανίζεται μόνο όταν υπάρχουν εχθροί. Σε μεγαλύτερα επίπεδα του μαραφετιού, τα αέρια είναι πιο πιθανό να είναι εξωτικά και ισχυρά.
items.trinkets.chaoticcenser.stats_desc=Στο τωρινό του επίπεδο, το μαραφέτι εξαπολύει επιβλαβές αέριο κοντά σε εχθρό περίπου κάθε _%d_ γύρους. Το αέριο θα εμφανίζεται μόνο όταν υπάρχουν εχθροί. Σε μεγαλύτερα επίπεδα του μαραφετιού, τα αέρια είναι πιο πιθανό να είναι εξωτικά και ισχυρά.

items.trinkets.crackedspyglass.name=cracked spyglass
items.trinkets.crackedspyglass.desc=This handheld telescope would be a demonstration of great and precise workmanship, if it weren't for the crack along its front lens. The spyglass seems to be helping you by revealing new items in the dungeon, but due to its flaw the revealed items are quite hard to see!
items.trinkets.crackedspyglass.typical_stats_desc=Typically this trinket has a _%1$s%% chance_ to create an extra hidden item on each non-boss floor.
items.trinkets.crackedspyglass.stats_desc=At its current level, this trinket has a _%1$s%% chance_ to create an extra hidden item on each non-boss floor.
items.trinkets.crackedspyglass.stats_desc_upgraded=At its current level, this trinket has a _100%% chance_ to create an extra hidden item on each non-boss floor, and a _%1$s%% chance_ to create a second extra hidden item.

items.trinkets.dimensionalsundial.name=διαστατικό ηλιακό ρολόι
items.trinkets.dimensionalsundial.warning=Το ηλιακό ρολόι δεν εκπέμπει σκιά... νιώθεις άβολα.
items.trinkets.dimensionalsundial.desc=Αυτό το μικρό ηλιακό ρολόι μπορεί κάπως και εκπέμπει μια σκιά στα βάθη της κατακόμβης, ακόμη κι όταν δεν το κρατάς ορθό. Σαν να μην έφτανε αυτό, η θέση της σκιάς δεν φαίνεται να σχετίζεται με τον ήλιο αυτού του κόσμου. Φαίνεται πως το ηλιακό ρολόι προσελκύει τον κίνδυνο όταν δεν εκπέμπεται η σκιά.
items.trinkets.dimensionalsundial.typical_stats_desc=Κανονικά, αυτό το μαραφέτι μειώνει τον ρυθμό δημιουργίας εχθρών κατά _%1$d%%_ όταν είναι μέρα στην πραγματική ζωή (8πμ ως 8μμ), ενώ αυξάνει τον ρυθμό δημιουργίας εχθρών κατά _%2$d%%_ τη νύχτα (8μμ ως 8πμ).
items.trinkets.dimensionalsundial.stats_desc=Στο τωρινό του επίπεδο, μειώνει τον ρυθμό δημιουργίας εχθρών κατά _%1$d%%_ όταν είναι μέρα στην πραγματική ζωή (8πμ ως 8μμ), ενώ αυξάνει τον ρυθμό δημιουργίας εχθρών κατά _%2$d%%_ τη νύχτα (8μμ ως 8πμ).

items.trinkets.exoticcrystals.name=εξωτικοί κρύσταλλοι
items.trinkets.exoticcrystals.desc=Αυτοί οι μικροί ροζ κρύσταλλοι έχουν το ίδιο σχήμα με τους κρυστάλλους αλχημικής ενέργειας. Αν και δεν μπορούν να χρησιμοποιηθούν απευθείας για ενέργεια, φαίνεται πως κάπως επηρεάζουν τα φίλτρα και τους παπύρους που βρίσκεις.
items.trinkets.exoticcrystals.typical_stats_desc=Κανονικά, το μαραφέτι θα αντικαθιστά το _%s%%_ των φίλτρων και παπύρων που βρίσκεις στην κατακόμβη με τα εξωτικά τους αντίστοιχα. Αυτό δεν επηρεάζει τα φίλτρα δύναμης και τους παπύρους αναβάθμισης, ούτε τα αντικείμενα που εμφανίζονται ειδικά για να βοηθούν στην επίλυση των ειδικών δωματίων με εμπόδια.
items.trinkets.exoticcrystals.stats_desc=Στο τωρινό του επίπεδο, θα αντικαθιστά το _%s%%_ των φίλτρων και παπύρων που βρίσκεις στην κατακόμβη με τα εξωτικά τους αντίστοιχα. Αυτό δεν επηρεάζει τα φίλτρα δύναμης και τους παπύρους αναβάθμισης, ούτε τα αντικείμενα που εμφανίζονται ειδικά για να βοηθούν στην επίλυση των ειδικών δωματίων με εμπόδια.

items.trinkets.eyeofnewt.name=μάτι του τρίτωνα
items.trinkets.eyeofnewt.desc=Αυτό το χρυσόμαυρο μάτι τρίτωνα είναι ένα κατά τα άλλα κοινό συστατικό που έχει μετατραπεί μαγικά σε μαραφέτι. Το μάτι φαίνεται να μειώνει την όρασή σου και να σου επιτρέπει να βλέπεις με άλλους τρόπους.
items.trinkets.eyeofnewt.typical_stats_desc=Στο τωρινό του επίπεδο μειώνει το οπτικό σου πεδίο κατά _%1$s%%,_ αλλά σου χαρίζει ενόραση πάνω σε εχθρούς που βρίσκονται εντός _%2$d_ τετραγώνων.
items.trinkets.eyeofnewt.stats_desc=Στο τωρινό του επίπεδο μειώνει το οπτικό σου πεδίο κατά _%1$s%%,_ αλλά σου χαρίζει ενόραση πάνω σε εχθρούς που βρίσκονται εντός _%2$d_ τετραγώνων.

items.trinkets.ferrettuft.name=ferret tuft
items.trinkets.ferrettuft.desc=A tuft of silky white ferret fur, held together by a Lime green ribbon tied into a bow. Ferrets are known for their agility, mischievousness, and lack of integrity. Some of that power seems to radiate from the trinket, enhancing the evasion of anything nearby.
items.trinkets.ferrettuft.typical_stats_desc=Typically this trinket will increase the evasion of all characters by _%1$s%%_.
items.trinkets.ferrettuft.stats_desc=At its current level this trinket will increase the evasion of all characters by _%1$s%%_.

items.trinkets.mimictooth.name=δόντι μίμου
items.trinkets.mimictooth.desc=Αυτό το τεράστιο κοφτερό δόντι πρέπει να έχει αποσπαστεί από κάποιον δυστυχή μίμο. Φαίνεται πως επηρεάζει τους μίμους της κατακόμβης, κάνοντάς τους πιο πολυάριθμους και επικίνδυνους.
items.trinkets.mimictooth.typical_stats_desc=Κανονικά, το μαραφέτι θα κάνει όλους τους τύπους μίμων _%1$s φορές_ συχνότερους και πολύ πιο δύσκολους να εντοπιστούν, αλλά θα αυξήσει και τη ποσότητα λείας που πετούν. Επιπλέον, κάθε όροφος θα έχει _%2$s%%_ πιθανότητα να περιέχει κι έναν κρυμμένο μίμο εβένου.
items.trinkets.mimictooth.stats_desc=Στο τωρινό του επίπεδο, το μαραφέτι θα κάνει όλους τους τύπους μίμων _%1$s φορές_ συχνότερους και πολύ πιο δύσκολους να εντοπιστούν, αλλά θα αυξήσει και τη ποσότητα λείας που πετούν. Επιπλέον, κάθε όροφος θα έχει _%2$s%%_ πιθανότητα να περιέχει κι έναν κρυμμένο μίμο εβένου.

items.trinkets.mossyclump.name=σβόλος βρύων
items.trinkets.mossyclump.desc=Αυτός ο σβόλος υγρών βρύων φαίνεται να κατακρατά την υγρασία του ανεξάρτητα από το πόσο πολύ τον πιέζεις. Φαίνεται πως είναι μαγικά δεμένο με την ίδια την κατακόμβη, κάνοντας συχνότερη την εμφάνιση του γρασιδιού και του νερού.
items.trinkets.mossyclump.typical_stats_desc=Κανονικά, αυτό το μαραφέτι θα κάνει το _%d%%_ των κανονικών (χωρίς ιδιαίτερο γνώρισμα) ορόφων να γεμίζει είτε με νερό είτε με γρασίδι.\n\nΑυτό το μαραφέτι απαιτεί σχετικά μεγάλη ενέργεια για να αναβαθμιστεί.
items.trinkets.mossyclump.stats_desc=Στο τωρινό του επίπεδο, θα κάνει το _%d%%_ των κανονικών (χωρίς ιδιαίτερο γνώρισμα) ορόφων να γεμίζει είτε με νερό είτε με γρασίδι.\n\nΑυτό το μαραφέτι απαιτεί σχετικά μεγάλη ενέργεια για να αναβαθμιστεί.

items.trinkets.parchmentscrap.name=κομμάτι περγαμηνής
items.trinkets.parchmentscrap.desc=Αυτό το μικρό κομμάτι περγαμηνής φαίνεται πως προήλθε από κάποιον πάπυρο. Έχει διατηρήσει κάποια από τη μαγεία του και φαίνεται πως επηρεάζει τα όπλα και τις πανοπλίες που βρίσκεις στην κατακόμβη.
items.trinkets.parchmentscrap.typical_stats_desc=Κανονικά, το μαραφέτι θα κάνει τις μαγικές ενισχύσεις και τους γλύφους να εμφανίζονται _%d φορές_ συχνότερα, και τις κατάρες στις πανοπλίες και στα όπλα _%s φορές_ συχνότερα. Οι κατάρες σε ραβδιά, δαχτυλίδια και τεχνουργήματα δεν επηρεάζονται.\n\nΑυτό το μαραφέτι απαιτεί σχετικά μεγάλη ενέργεια για να αναβαθμιστεί.
items.trinkets.parchmentscrap.stats_desc=Στο τωρινό του επίπεδο, το μαραφέτι θα κάνει τις μαγικές ενισχύσεις και τους γλύφους να εμφανίζονται _%d φορές_ συχνότερα, και τις κατάρες στις πανοπλίες και στα όπλα _%s φορές_ συχνότερα. Οι κατάρες σε ραβδιά, δαχτυλίδια και τεχνουργήματα δεν επηρεάζονται.\n\nΑυτό το μαραφέτι απαιτεί σχετικά μεγάλη ενέργεια για να αναβαθμιστεί.

items.trinkets.petrifiedseed.name=απολιθωμένος σπόρος
items.trinkets.petrifiedseed.desc=Αυτός ο σπόρος είναι απολιθωμένος, είτε από γεωλογικές διαδικασίες είτε από μαγεία. Φαίνεται πως επηρεάζει μαγικά τη χλωρίδα της κατακόμβης, αντικαθιστώντας περιστασιακά τους σπόρους των φυτών με ρουνικούς λίθους.
items.trinkets.petrifiedseed.typical_stats_desc=Κανονικά, αυτό το μαραφέτι θα κάνει το ποδοπατημένο γρασίδι να πετά ρουνικούς λίθους αντί για σπόρους στο _%1$s%%_ των περιπτώσεων. Θα κάνει, επίσης, το ψηλό γρασίδι να πετά ό,τι πετάει _%2$s%%_ συχνότερα.
items.trinkets.petrifiedseed.stats_desc=Στο τωρινό του επίπεδο, το μαραφέτι θα κάνει το ποδοπατημένο γρασίδι να πετά ρουνικούς λίθους αντί για σπόρους στο _%1$s%%_ των περιπτώσεων. Θα κάνει, επίσης, το ψηλό γρασίδι να πετά ό,τι πετάει _%2$s%%_ συχνότερα.

items.trinkets.ratskull.name=κρανίο αρουραίου
items.trinkets.ratskull.desc=Αυτό το μακάβριο μαραφέτι δεν είναι πολύ μεγαλύτερο από το κρανίο ενός φυσιολογικού αρουραίου, που αποτελεί σπανιότητα εδώ στην κατακόμβη. Η μαγική του επιρροή φαίνεται πως προσελκύει τους πιο σπάνιους κατοίκους της κατακόμβης, κάνοντάς τους να εμφανίζονται πολύ πιο συχνά.
items.trinkets.ratskull.typical_stats_desc=Κανονικά, αυτό το μαραφέτι θα κάνει κάθε σπάνιο εξωτικό εχθρό _%d φορές_ πιθανότερο να εμφανιστεί. Είναι, όμως, μόνο κατά το ήμισι αποτελεσματικό στο να προσελκύει κρυστάλλινους μίμους και πάνοπλα αγάλματα.
items.trinkets.ratskull.stats_desc=Στο τωρινό του επίπεδο, το μαραφέτι θα κάνει κάθε σπάνιο εξωτικό εχθρό _%d φορές_ πιθανότερο να εμφανιστεί. Είναι, όμως, μόνο κατά το ήμισι αποτελεσματικό στο να προσελκύει κρυστάλλινους μίμους και πάνοπλα αγάλματα.

items.trinkets.saltcube.name=κύβος άλατος
items.trinkets.saltcube.desc=Αυτός ο μεγάλος κρύσταλλος αλατιού έχει κοπεί σε σχεδόν τέλειο κυβικό σχήμα, και κάπως κατάφερε να στραγγίξει το μισό νερό του αλχημικού τσουκαλιού αντί να διαλυθεί. Φαίνεται πως αποστραγγίζει και διατηρεί μαγικά τις τροφές που καταναλώνεις, επεκτείνοντας έτσι τον κορεσμό που λαμβάνεις αλλά και μειώνοντας την αναπλήρωση ζωής σου όταν δεν λιμοκτονείς.
items.trinkets.saltcube.typical_stats_desc=Κανονικά, αυτό το μαραφέτι θα αυξήσει την περίοδο προτού ξεκινήσεις να πεινάς κατά _%1$s%%,_ αλλά θα μειώσει και το ρυθμό αναπλήρωσης ζωής κατά _%2$s%%._, εκτός αν το επίπεδο είναι κλειδωμένο.
items.trinkets.saltcube.stats_desc=Στο τωρινό του επίπεδο, θα αυξήσει την περίοδο προτού ξεκινήσεις να πεινάς κατά _%1$s%%,_ αλλά θα μειώσει και το ρυθμό αναπλήρωσης ζωής κατά _%2$s%%._, εκτός αν το επίπεδο είναι κλειδωμένο.

items.trinkets.shardofoblivion.name=θραύσμα της λήθης
items.trinkets.shardofoblivion.desc=Αφού παρέμεινε στο αλχημικό τσουκάλι, αυτό το μικρό θραύσμα καταραμένου μετάλλου άλλαξε και πλέον αποτελείται από... τίποτα; Το φως φαίνεται να κάμπτεται γύρω από το θραύσμα, και αιωρείται όταν δεν το κρατάς. Το θραύσμα φαίνεται να αντλεί μαγικά δύναμη από την άγνοιά σου... είναι καλύτερα να μη το φέρνεις πολύ στο μυαλό σου.
items.trinkets.shardofoblivion.typical_stats_desc=Κανονικά, αυτό το μαραφέτι αυξάνει το πόσο συχνά αφήνουν λεία οι εχθροί κατά 20%% για κάθε μη αναγνωρισμένο εφόδιο που έχεις εξοπλισμένο ή πρόσφατα αναγνωρισμένο, με όριο _%d αντικείμενο/-α._ Το θραύσμα σε αποτρέπει από το να αναγνωρίζεις εξοπλισμό, αλλά μπορεί να χρησιμοποιηθεί για να αναγνωρίσεις χειροκίνητα όποια εφόδια είναι έτοιμα γι' αυτό.
items.trinkets.shardofoblivion.stats_desc=Στο τωρινό του επίπεδο, το μαραφέτι αυξάνει το πόσο συχνά αφήνουν λεία οι εχθροί κατά 20%% για κάθε μη αναγνωρισμένο εφόδιο που έχεις εξοπλισμένο ή πρόσφατα αναγνωρισμένο, με όριο _%d αντικείμενο/-α._ Το θραύσμα σε αποτρέπει από το να αναγνωρίζεις εξοπλισμό, αλλά μπορεί να χρησιμοποιηθεί για να αναγνωρίσεις χειροκίνητα όποια εφόδια είναι έτοιμα γι' αυτό.
items.trinkets.shardofoblivion.ac_identify=ΑΝΑΓΝΩΡΙΣΗ
items.trinkets.shardofoblivion.identify_prompt=Αναγνώρισε ένα εφόδιο
items.trinkets.shardofoblivion.identify_ready=Ένα αντικείμενο είναι έτοιμο να αναγνωριστεί: %s. Χρησιμοποίησε το θραύσμα της λήθης για να το αναγνωρίσεις.
items.trinkets.shardofoblivion.identify_ready_worn=Τα αντικείμενα που φοράς είναι όλα τους έτοιμα να αναγνωριστούν. Χρησιμοποίησε το θραύσμα της λήθης για να το αναγνωρίσεις.
items.trinkets.shardofoblivion.identify_not_yet=Αυτό το εφόδιο δεν είναι έτοιμο να αναγνωριστεί ακόμη.
items.trinkets.shardofoblivion.identify=Αναγνωρίζεις το αντικείμενο!
items.trinkets.shardofoblivion$wandusetracker.name=Χρησιμοποιήθηκε μη αναγνωρισμένο ραβδί
items.trinkets.shardofoblivion$wandusetracker.desc=Έχεις χρησιμοποιήσει πρόσφατα ένα μη αναγνωρισμένο ραβδί. Αυτό μετράει ως μία χρήση ενός μη αναγνωρισμένου εφοδίου για το θραύσμα της λήθης, για μικρό χρονικό διάστημα.\n\nΓύροι που απομένουν: %s.
items.trinkets.shardofoblivion$thrownusetracker.name=Χρησιμοποιήθηκε μη αναγνωρισμένο όπλο ρίψης
items.trinkets.shardofoblivion$thrownusetracker.desc=Έχεις χρησιμοποιήσει πρόσφατα ένα μη αναγνωρισμένο όπλο ρίψης. Αυτό μετράει ως μία χρήση ενός μη αναγνωρισμένου εφοδίου για το θραύσμα της λήθης, για μικρό χρονικό διάστημα.\n\nΓύροι που απομένουν: %s.

items.trinkets.thirteenleafclover.name=δεκατριάφυλλο τριφύλλι
items.trinkets.thirteenleafclover.desc=Το βράσιμο αυτού του τριφυλλιού στο αλχημικό τσουκάλι κάπως το έκανε να φυτρώσει ένα μάτσο από φύλλα! Δεν είναι ξεκάθαρο αν είναι γούρικο ή γρουσούζικο... μήπως κάνει την τύχη σου πιο χαοτική;
items.trinkets.thirteenleafclover.typical_stats_desc=Κανονικά, αυτό το μαραφέτι θα σε κάνει να προκαλείς τη μέγιστη ζημιά στο _%1$d%%_ των περιπτώσεων, και την ελάχιστη ζημιά στο _%2$d%%_ των περιπτώσεων.
items.trinkets.thirteenleafclover.stats_desc=Στο τωρινό του επίπεδο, αυτό το μαραφέτι θα σε κάνει να προκαλείς τη μέγιστη ζημιά στο _%1$d%%_ των περιπτώσεων, και την ελάχιστη ζημιά στο _%2$d%%_ των περιπτώσεων.

items.trinkets.trapmechanism.name=μηχανισμός παγίδας
items.trinkets.trapmechanism.desc=Ο κεντρικός μηχανισμός μίας από τις παγίδες λάκκου της κατακόμβης. Έχει αφαιρεθεί προσεκτικά από το έδαφος ώστε να είναι φορητός. Φαίνεται πως είναι μαγικά δεμένος με την ίδια την κατακόμβη, κάνοντας πιο κοινό το επικίνδυνο έδαφος αλλά αυξάνοντας και τον "δεσμό" σου με αυτό.
items.trinkets.trapmechanism.typical_stats_desc=Κανονικά, αυτό το μαραφέτι θα κάνει το _%1$d%%_ των κοινών (χωρίς ιδιαίτερο γνώρισμα) ορόφων να γεμίσουν με παγίδες ή χάσματα. Επιπλέον, _%2$d%%_ από τις κρυμμένες παγίδες της κατακόμβης θα γίνουν ορατές.
items.trinkets.trapmechanism.stats_desc=Στο τωρινό του επίπεδο, αυτό το μαραφέτι θα κάνει το _%1$d%%_ των κοινών (χωρίς ιδιαίτερο γνώρισμα) ορόφων να γεμίσουν με παγίδες ή χάσματα. Επιπλέον, _%2$d%%_ από τις κρυμμένες παγίδες της κατακόμβης θα γίνουν ορατές.

items.trinkets.vialofblood.name=φιαλίδιο αίματος
items.trinkets.vialofblood.desc=Αυτό το λεπτό φιαλίδιο περιέχει το αίμα κάποιων κατοίκων της κατακόμβης. Το αίμα κυλά αργά καθώς περιστρέφεις το φιαλίδιο. Φαίνεται να ενδυναμώνει μαγικά τις ισχυρότερες επιδράσεις αναπλήρωσης ζωής, αλλά τις καθυστερεί επίσης.
items.trinkets.vialofblood.typical_stats_desc=Αυτό το μαραφέτι κανονικά αυξάνει τη ζωή που λαμβάνεις από την κατάποση φίλτρων γιατρειάς, από το φλασκί νερού και από το πηγάδι της ζωής κατά _%1$s%%._ Όμως, αυτές οι θεραπευτικές επιδράσεις θα γίνονται πιο αργά: η αναπλήρωση έχει μέγιστο όριο _%2$s_ ζωή ανά γύρο. (Αυτό αυξάνεται με το επίπεδο του ήρωα.)
items.trinkets.vialofblood.stats_desc=Στο τωρινό του επίπεδο, το μαραφέτι αυξάνει τη ζωή που λαμβάνεις από την κατάποση φίλτρων γιατρειάς, από το φλασκί νερού και από το πηγάδι της ζωής κατά _%1$s%%._ Όμως, αυτές οι θεραπευτικές επιδράσεις θα γίνονται πιο αργά: η αναπλήρωση έχει μέγιστο όριο _%2$s_ ζωή ανά γύρο. (Αυτό αυξάνεται με το επίπεδο του ήρωα.)

items.trinkets.wondrousresin.name=θαυματουργή ρητίνη
items.trinkets.wondrousresin.desc=Αυτή η λαμπερή μπλε ρητίνη φαίνεται να κατέχει τη διυλισμένη ουσία ενός καταραμένου ραβδιού. Η μαγεία του αλχημικού τσουκαλιού φαίνεται να την έχει σταθεροποιήσει κάπως, και πλέον επηρεάζει τα ραβδιά σου.
items.trinkets.wondrousresin.typical_stats_desc=Κανονικά, το μαραφέτι θα κάνει τις επιδράσεις των καταραμένων ραβδιών να γίνουν θετικές ή ουδέτερες στο _%1$s%%_ των περιπτώσεων. Θα αναγκάσει, επίσης, τα μη καταραμένα ραβδιά να εξαπολύουν μια επιπλέον ουδέτερη ή θετική καταραμένη βολή στο _%2$s%%_ των περιπτώσεων.\n\nΑυτό το μαραφέτι απαιτεί σχετικά μεγάλη ενέργεια για να αναβαθμιστεί.
items.trinkets.wondrousresin.stats_desc=Στο τωρινό του επίπεδο, το μαραφέτι θα κάνει τις επιδράσεις των καταραμένων ραβδιών να γίνουν θετικές ή ουδέτερες στο _%1$s%%_ των περιπτώσεων. Θα αναγκάσει, επίσης, τα μη καταραμένα ραβδιά να εξαπολύουν μια επιπλέον ουδέτερη ή θετική καταραμένη βολή στο _%2$s%%_ των περιπτώσεων.\n\nΑυτό το μαραφέτι απαιτεί σχετικά μεγάλη ενέργεια για να αναβαθμιστεί.

items.trinkets.trinketcatalyst.name=μαγικός καταλύτης
items.trinkets.trinketcatalyst.window_title=δημιούργησε ένα μαραφέτι
items.trinkets.trinketcatalyst.window_text=Το νερό αρχίζει να λάμπει καθώς προσθέτεις τον καταλύτη. Υπάρχουν κάποια κοντινά αντικείμενα που μπορείς να εμποτίσεις με ενέργεια και να τα μετατρέψεις σε μαγικά μαραφέτια.
items.trinkets.trinketcatalyst.desc=Αυτή η μπάλα χρυσής μαγικής σκόνης λαμπυρίζει στο σκοτάδι της κατακόμβης. Ο καταλύτης χρησιμοποιείται στο αλχημικό τσουκάλι με λίγη αλχημική ενέργεια για να παράξει ένα μοναδικό μαραφέτι.\n\nΤα μαραφέτια παρέχουν ποικίλες επιδράσεις που επηρεάζουν ελαφρά την ίδια την κατακόμβη και τους κατοίκους της. Μπορούν να αναβαθμιστούν με περισσότερη ενέργεια για να γίνει ισχυρότερη η επίδρασή τους, αλλά και να πεταχτούν ώστε να απορριφθεί εντελώς η επίδραση.
items.trinkets.trinketcatalyst$randomtrinket.name=τυχαίο μαραφέτι
items.trinkets.trinketcatalyst$randomtrinket.desc=Ένα κοντινό αντικείμενο έχει κολλήσει σε ένα πουγκί που δεν μπορείς να ανοίξεις.\n\nΗ αλχημική διαδικασία θα διαλύσει το πουγκί, αλλά δεν θα γνωρίζεις τι μαραφέτι θα δημιουργηθεί έως ότου την πραγματοποιήσεις!

items.trinkets.trinket.discover_hint=Αυτό το αντικείμενο έχει μία πιθανότητα να είναι επιλογή όποτε κατασκευάζεις ένα μαραφέτι μέσω αλχημείας.
items.trinkets.trinket$placeholder.name=μαραφέτι

###wands
items.wands.cursedwand.ondeath=Εξοντώθηκες από το ίδιο σου το %s.
items.wands.cursedwand.nothing=Δεν συνέβη κάτι.
items.wands.cursedwand.mass_invuln=Λαμπερό φως ξεχύνεται από το ραβδί σου!
items.wands.cursedwand.petrify=Ξαφνικά παγώνεις εκεί που βρίσκεσαι!
items.wands.cursedwand.grass=Γρασίδι εκτοξεύεται γύρω σου!
items.wands.cursedwand.fire=Σου μυρίζει καμένο...
items.wands.cursedwand.transmogrify_wand=Το ραβδί μεταμορφώνεται μαγικά σε κάτι διαφορετικό!
items.wands.cursedwand.transmogrify_other=Το ραβδί μεταμορφώνεται μαγικά σε κάτι διαφορετικό!
items.wands.cursedwand.disguise=Η εμφάνισή σου αλλάζει μπροστά στα μάτια σου!
items.wands.cursedwand.supernova=Μία φλεγόμενη μπάλα ενέργειας ξεκινά να μεγαλώνει. Καλύτερα να τρέξεις!
items.wands.cursedwand.supernova_positive=Μία φλεγόμενη μπάλα ενέργειας ξεκινά να μεγαλώνει, αλλά φαίνεται ασφαλής.
items.wands.cursedwand.sinkhole=Το έδαφος γύρω σου αρχίζει να καταρρέει!
items.wands.cursedwand.sinkhole_positive=Το έδαφος αρχίζει να καταρρέει, αλλά φαίνεται στιβαρό από κάτω σου.
items.wands.cursedwand.gravity=Η βαρύτητα ξεκινά έξαφνα να τραβά από τυχαίες κατευθύνσεις!
items.wands.cursedwand.gravity_positive=Η βαρύτητα ξεκινά έξαφνα να τραβά από τυχαίες κατευθύνσεις, αλλά δεν φαίνεται να σε επηρεάζει.
items.wands.cursedwand.gravity_end=Το βαρυτικό χάος λαμβάνει τέλος.

items.wands.damagewand.upgrade_stat_name_1=Μαγική ζημιά

items.wands.wand.ac_zap=ΕΞΑΠΟΛΥΣΕ
items.wands.wand.fizzles=Το ραβδί σου σφυρίζει· δεν πρέπει να έχει αρκετό φορτίο.
items.wands.wand.no_magic=Το ραβδί σφυρίζει· δεν μπορείς να χρησιμοποιήσεις ραβδιά όσο έχεις μαγική ανοσία.
items.wands.wand.self_target=Δεν μπορείς να στοχεύσεις τον εαυτό σου!
items.wands.wand.identify=Έχεις εξοικειωθεί αρκετά με το ραβδί σου ώστε να το αναγνωρίσεις.
items.wands.wand.resin_one=Το ραβδί έχει λάβει _1 επίπεδο_ από την απόκρυφη ρητίνη.
items.wands.wand.resin_many=Το ραβδί έχει λάβει _%d επίπεδα_ από την απόκρυφη ρητίνη.
items.wands.wand.cursed=Αυτό το ραβδί είναι καταραμένο, κάνοντας τη μαγεία του χαοτική και τυχαία.
items.wands.wand.not_cursed=Αυτό το ραβδί είναι απαλλαγμένο από διαβολική μαγεία.
items.wands.wand.curse_discover=Αυτό το %s είναι καταραμένο!
items.wands.wand.prompt=Διάλεξε το σημείο εξαπόλυσης
items.wands.wand$placeholder.name=ραβδί

items.wands.wandofblastwave.name=ραβδί κύματος έκρηξης
items.wands.wandofblastwave.staff_name=ράβδος κύματος έκρηξης
items.wands.wandofblastwave.ondeath=Εξοντώθηκες από το ίδιο σου το ραβδί κύματος έκρηξης...
items.wands.wandofblastwave.knockback_ondeath=Η πρόσκρουση σε εξόντωσε...
items.wands.wandofblastwave.desc=Αυτό το ραβδί είναι φτιαγμένο από κάποιο είδος αυλακωμένης πέτρας, με χρυσαφί περίγραμμα κι ένα στρογγυλό μαύρο πετράδι στην άκρη. Το αισθάνεσαι πολύ βαρύ στο χέρι σου.
items.wands.wandofblastwave.typical_stats_desc=Αυτό το ραβδί εξαπολύει μια βολή που εκρήγνυται βίαια στο στοχευμένο σημείο. Η ισχύς αυτής της έκρηξης προκαλεί _%1$d-%2$d ζημιά_ και είναι αρκετά ισχυρή ώστε να πετάξει μακριά τους περισσότερους εχθρούς.
items.wands.wandofblastwave.stats_desc=Αυτό το ραβδί εξαπολύει μία βολή που εκρήγνυται βίαια στη στοχευμένη περιοχή. Η ισχύς αυτής της έκρηξης προκαλεί _%1$d-%2$d ζημιά,_ και είναι αρκετά ισχυρή ώστε να πετάξει μακριά τους περισσότερους εχθρούς.
items.wands.wandofblastwave.upgrade_stat_name_2=Πέταγμα
items.wands.wandofblastwave.bmage_desc=Όταν _ο Μαγομαχητής_ κοπανά έναν παράλυτο εχθρό με τη ράβδο κύματος έκρηξης, θα καταναλώσει την παράλυση ώστε να προκαλέσει επιπλέον μαγική ζημιά. Αυτό έχει μια σύντομο περίοδο αναπλήρωσης για τον κάθε εχθρό.
items.wands.wandofblastwave.eleblast_desc=Η στοιχειακή έκρηξη από τη ράβδο κύματος έκρηξης προκαλεί 67% ζημιά, και πετάει όλους τους εχθρούς έξω από την περιοχή της έκρηξης.

items.wands.wandofcorrosion.name=ραβδί διάβρωσης
items.wands.wandofcorrosion.staff_name=ράβδος διάβρωσης
items.wands.wandofcorrosion.desc=Αυτό το ραβί έχει έναν ωχρού χρώματος κορμό που καταλήγει σε ένα λαμπερό πορτοκαλί πετράδι.
items.wands.wandofcorrosion.stats_desc=Αυτό το ραβδί ρίχνει μια βολή που ξεσπά σε ένα νέφος καυστικού αερίου. Οτιδήποτε βρεθεί μες στο νέφος θα λαμβάνει αυξανόμενη ζημιά με το πέρασμα του χρόνου. Η ζημιά ξεκινά από _ %d._
items.wands.wandofcorrosion.upgrade_stat_name_1=Ζημιά διάβρωσης
items.wands.wandofcorrosion.upgrade_stat_name_2=Όγκος αερίου
items.wands.wandofcorrosion.bmage_desc=Όταν _ο Μαγομαχητής_ κοπανά έναν εχθρό με τη ράβδο διάβρωσης, ο εχθρός έχει μια πιθανότητα να λάβει την επίδραση καυστικής γλίτσας.
items.wands.wandofcorrosion.eleblast_desc=Η στοιχειακή έκρηξη από τη ράβδο διάβρωσης προκαλεί διάβρωση στους εχθρούς για 4 γύρους, ξεκινώντας με 6 ζημιά.

items.wands.wandofcorruption.name=ραβδί διαφθοράς
items.wands.wandofcorruption.staff_name=ράβδος διαφθοράς
items.wands.wandofcorruption.already_corrupted=Αυτός ο χαρακτήρας δεν μπορεί να επηρεαστεί περισσότερο.
items.wands.wandofcorruption.desc=Αυτό το ραβδί εκπέμπει χαοτική σκοτεινή ενέργεια, αν δεν ήταν ήδη προφανές από τον διακοσμητικό σκελετό στην κορυφή του.
items.wands.wandofcorruption.stats_desc=Αυτό το ραβδί απελευθερώνει ενέργεια διαφθοράς στους εχθρούς που τους υποτάσσει, τελικά, στη θέλησή σου. Οι στόχοι μπορούν να αντισταθούν στη διαφθορά, με τους αποδυναμωμένους να διαφθείρονται ευκολότερα από τους υγιείς.
items.wands.wandofcorruption.upgrade_stat_name_1=Ισχύς διαφθοράς
items.wands.wandofcorruption.upgrade_stat_name_2=Διάρκεια επίδρασης
items.wands.wandofcorruption.bmage_desc=Όταν _ο Μαγομαχητής_ κοπανά έναν εχθρό με τη ράβδο διαφθοράς, ο εχθρός έχει μια πιθανότητα να πάθει αμόκ.
items.wands.wandofcorruption.eleblast_desc=Η στοιχειακή έκρηξη από τη ράβδο διαφθοράς προκαλεί αμόκ στους εχθρούς για 5 γύρους.

items.wands.wandofdisintegration.name=ραβδί αποδόμησης
items.wands.wandofdisintegration.staff_name=ράβδος αποδόμησης
items.wands.wandofdisintegration.desc=Αυτό το ραβδί είναι φτιαγμένο από ένα λείο και συμπαγές κομμάτι οψιδιανού. Ένα βαθύ μωβ φως το διαπερνά που καταλήγει στην αιχμή του. Λάμπει με μια καταστροφική ενέργεια που είναι έτοιμη να ξεχυθεί.
items.wands.wandofdisintegration.stats_desc=Αυτό το ραβδί εξαπολύει μια ακτίνα που διαπερνά οποιοδήποτε εμπόδιο, και θα πηγαίνει πιο μακριά όσο πιο αναβαθμισμένο είναι. Η ακτίνα προκαλεί _%1$d-%2$d ζημιά,_ και προκαλεί επιπλέον ζημιά για κάθε εχθρό ή εμπόδιο που διαπερνά.
items.wands.wandofdisintegration.upgrade_stat_name_2=Μέγιστη εμβέλεια
items.wands.wandofdisintegration.bmage_desc=Η ράβδος αποδόμησης έχει αυξημένη έκταση επίθεσης σώμα-με-σώμα όταν χρησιμοποιείται από _τον Μαγομαχητή_ – σαν να είχε τη μαγική ενίσχυση προβλητικότητας.
items.wands.wandofdisintegration.eleblast_desc=Η στοιχειακή έκρηξη από τη ράβδο αποδόμησης προκαλεί 100% ζημιά και διαπερνά τους τοίχους.

items.wands.wandoffireblast.name=ραβδί έκρηξης φωτιάς
items.wands.wandoffireblast.staff_name=ράβδος έκρηξης φωτιάς
items.wands.wandoffireblast.desc=Αυτό το ραβδί είναι φτιαγμένο από κόκκινο λακαρισμένο ξύλο, επενδυμένο με χρυσό φύλλο που του δίνει μια βασιλική αίσθηση. Τρίζει και σφυρίζει στην άκρη· είναι έτοιμο να απελευθερώσει την ισχυρή του μαγεία.
items.wands.wandoffireblast.stats_desc=Αυτό το ραβδί εξαπολύει έναν κώνο φωτιάς. Η επόμενη επίθεσή του θα καταναλώσει _%1$d φορτίο_ και θα προκαλέσει _%2$d-%3$d ζημιά._ Όσο περισσότερο φορτίο χρησιμοποιηθεί, τόσο ισχυρότερη και εκτενέστερη θα είναι η επίδραση.
items.wands.wandoffireblast.upgrade_stat_name_1=Ζημιά 1 φορτίου
items.wands.wandoffireblast.upgrade_stat_name_2=Ζημιά 2 φορτίων
items.wands.wandoffireblast.upgrade_stat_name_3=Ζημιά 3 φορτίων
items.wands.wandoffireblast.bmage_desc=Όταν _ο Μαγομαχητής_ κοπανά έναν εχθρό με τη ράβδο έκρηξης φωτιάς, υπάρχει μία πιθανότητα να πυροδοτήσει μία έκρηξη η οποία προκαλεί ζημιά στους εχθρούς και καταναλώνει όλη την τριγύρω φωτιά. Αυτή η πιθανότητα αυξάνεται όσο περισσότερες φλόγες βρίσκονται γύρω από τον εχθρό.
items.wands.wandoffireblast.eleblast_desc=Η στοιχειακή έκρηξη από τη ράβδο έκρηξης φωτιάς προκαλεί 100% ζημιά, ανοίγει βίαια τις πόρτες, και βάζει φωτιά στο έδαφος και σε εχθρούς.

items.wands.wandoffrost.name=ραβδί παγώματος
items.wands.wandoffrost.staff_name=ράβδος παγώματος
items.wands.wandoffrost.desc=Αυτό το ραβδί φαίνεται φτιαγμένο από κάποιου είδους μαγικό πάγο. Γίνεται όλο και πιο λαμπερό προς την στρογγυλεμένη του άκρη. Το νιώθεις πολύ κρύο στην αφή, αλλά, παραδόξως, το χέρι σου διατηρείται ζεστό.
items.wands.wandoffrost.stats_desc=Αυτό το ραβδί προκαλεί εκρήξεις παγωμένης ενέργειας στους εχθρούς σου. Τους προκαλεί _%1$d-%2$d ζημιά_ και τους ψύχει. Η επίδραση φαίνεται πως είναι ισχυρότερη στο νερό. Οι ήδη κρυωμένοι ή παγωμένοι εχθροί λαμβάνουν λιγότερη ζημιά από το ραβδί.
items.wands.wandoffrost.upgrade_stat_name_2=Διάρκεια ψύχους
items.wands.wandoffrost.bmage_desc=Όταν _ο Μαγομαχητής_ κοπανά έναν ψυχρό εχθρό με τη ράβδο παγώματος, ο εχθρός έχει μια πιθανότητα να παγώσει ακαριαία. Αυτή η πιθανότητα αυξάνεται όσο περισσότερο έχει ψυχθεί.
items.wands.wandoffrost.eleblast_desc=Η στοιχειακή έκρηξη από τη ράβδο παγώματος προκαλεί 100% ζημιά, παγώνει τους εχθρούς και σβήνει φωτιές.

items.wands.wandoflightning.name=ραβδί αστραπής
items.wands.wandoflightning.staff_name=ράβδος αστραπής
items.wands.wandoflightning.ondeath=Εξοντώθηκες από το ίδιο σου το ραβδί αστραπής...
items.wands.wandoflightning.desc=Αυτό το ραβδί είναι φτιαγμένο από συμπαγές μέταλλο, κάτι που το κάνει απίστευτα βαρύ. Δύο προεκτάσεις καμπυλώνουν μαζί στην άκρη και σχηματίζουν ηλεκτρικό τόξο ανάμεσά τους.
items.wands.wandoflightning.stats_desc=Αυτό το ραβδί εκτοξεύει ισχυρές αστραπές που ηλεκτρίζουν ό,τι χτυπούν, προκαλώντας _%1$d-%2$d ζημιά._ Ο ηλεκτρισμός μεταδίδεται σε κοντινούς χαρακτήρες και εξαπλώνεται πιο εύκολα στο νερό. Οι αστραπές του ραβδιού μπορούν να σου προκαλέσουν ζημιά, αλλά όχι στους συμμάχους σου.
items.wands.wandoflightning.bmage_desc=Όταν _ο Μαγομαχητής_ κοπανά έναν εχθρό με τη ράβδο αστραπής, έχει μια πιθανότητα να φορτιστεί ηλεκτρικά για 10 γύρους. Όσο είναι φορτισμένος, είναι απρόσβλητος από ηλεκτρική ζημιά και μεταδίδει μακρύτερα τις αστραπές.
items.wands.wandoflightning.eleblast_desc=Η στοιχειακή έκρηξη από τη ράβδο αστραπής προκαλεί 100% ζημιά, ακινητοποιεί τους εχθρούς για 5 γύρους και ηλεκτρίζει το νερό.
items.wands.wandoflightning$lightningcharge.name=Ηλεκτρική φόρτιση
items.wands.wandoflightning$lightningcharge.desc=Ο Μαγομαχητής είναι φορτισμένος με ενέργεια, προσδίδοντας ανοσία στη ράβδο της αστραπής του και αυξάνοντας την απόσταση στην οποία μπορούν να διαδοθούν οι αστραπές της.\n\nΓύροι που απομένουν: %s.

items.wands.wandoflivingearth.name=ραβδί ζωντανής γης
items.wands.wandoflivingearth.staff_name=ράβδος ζωντανής γης
items.wands.wandoflivingearth.desc=Αυτό το ραβδί είναι φτιαγμένο από ένα παράξενο πέτρωμα· το διατρέχουν λαμπερές κίτρινες δέσμες ενέργειας. Οι μαγικές πέτρες μετατοπίζονται ελαφρά με το άγγιγμα, λες και νιώθουν το χέρι σου.
items.wands.wandoflivingearth.stats_desc=Αυτό το ραβδί στέλνει ριπές μαγικής πέτρας στους εχθρούς και προκαλεί _%1$d-%2$d ζημιά._ Έπειτα, οι πέτρες επανασχηματίζονται γύρω από τον χρήστη ως πανοπλία με ισχύ ανάλογη της ζημιάς που προκλήθηκε. Αφού μαζευτεί αρκετή πανοπλία, θα μετασχηματιστεί σε έναν πέτρινο φύλακα στην επόμενη εξαπόλυση.
items.wands.wandoflivingearth.upgrade_stat_name_2=Μέγιστη ζωή φρουρού
items.wands.wandoflivingearth.upgrade_stat_name_3=Άμυνα φρουρού
items.wands.wandoflivingearth.bmage_desc=Όταν _ο Μαγομαχητής_ κοπανά έναν εχθρό με τη ράβδο ζωντανής γης, κάποια από τη προκληθείσα ζημιά επιστρέφει ως πετρώδης πανοπλία.
items.wands.wandoflivingearth.eleblast_desc=Η στοιχειακή έκρηξη από τη ράβδο ζωντανής γης προκαλεί 50% ζημιά, και θεραπεύει τον ενεργό γαιώδη φρουρό για κάθε εχθρό που χτυπήθηκε.
items.wands.wandoflivingearth$rockarmor.name=πετρώδης πανοπλία
items.wands.wandoflivingearth$rockarmor.desc=Μαγικές πέτρες περιβάλλουν το σώμα σου. Επιχειρούν να εμποδίσουν τις επιθέσεις εναντίον σου και μειώνουν τη ζημιά που λαμβάνεις κατά 50%%. Όμως, κάθε επίθεση που εμποδίζεται καταστρέφει ένα μέρος των πετρών.\n\nΕναπομείνουσα πανοπλία: %1$d.\n\nΑφού μαζευτούν αρκετές πέτρες γύρω σου, η επόμενη ριπή του ραβδιού ζωντανής γης θα τις κάνει να υλοποιήσουν έναν φρουρό που θα παλέψει στο πλευρό σου.\n\nΑπαιτούμενη πανοπλία για τον Φρουρό: %2$d.
items.wands.wandoflivingearth$rockarmor.desc_many=Αυτός ο γαιώδης φρουρός επωφελείται επίσης από την Ισχύ τον πολλών. Γύροι που απομένουν: %d.
items.wands.wandoflivingearth$earthguardian.name=γαιώδης φρουρός
items.wands.wandoflivingearth$earthguardian.desc=Οι πέτρες του ραβδιού ζωντανής γης έχουν υλοποιήσει έναν γαιώδη φρουρό! Αυτός ο πέτρινος προστάτης θα επιτίθεται στους κοντινούς εχθρούς και θα τους αναγκάζει να επικεντρώνονται σε αυτόν αντί για εσένα. Όταν όλες οι κοντινές απειλές εξαφανιστούν, ο φρουρός θα επανασχηματιστεί γύρω σου. Θα επιστρέψει όταν χρησιμοποιήσεις ξανά το ραβδί.
items.wands.wandoflivingearth$earthguardian.wand_info=Η αμυντική ισχύς του φρουρού είναι δεμένη με το επίπεδο του ραβδιού σου. Αυτή τη στιγμή μπλοκάρει _%1$d-%2$d ζημιά_
items.wands.wandoflivingearth$earthguardian.discover_hint=Μπορείς να βρεις αυτόν τον χαρακτήρα με ένα συγκεκριμένο ραβδί.

items.wands.wandofmagicmissile.name=ραβδί μαγικού βλήματος
items.wands.wandofmagicmissile.staff_name=ράβδος μαγικού βλήματος
items.wands.wandofmagicmissile.desc=Αυτό το λιτό ραβδί εξαπολύει βλήματα αγνής μαγικής ενέργειας. Αν και το ραβδί δεν έχει κάποια ιδιαίτερη επίδραση, έχει μεγαλύτερο φορτίο σε σύγκριση με άλλα. Επιπλέον, θα ενδυναμώσει για λίγο τα ραβδιά χαμηλότερου επιπέδου από αυτό.
items.wands.wandofmagicmissile.stats_desc=Κάθε ριπή αυτού του ραβδιού προκαλεί _%1$d-%2$d ζημιά_ και ενδυναμώνει για λίγο τα ραβδιά χαμηλότερου επιπέδου από αυτό.
items.wands.wandofmagicmissile.bmage_desc=Όταν _ο Μαγομαχητής_ κοπανά έναν εχθρό με τη ράβδο μαγικού βλήματος, τόσο η ράβδος όσο και τα ραβδιά του θα λάβουν φορτίο.
items.wands.wandofmagicmissile.eleblast_desc=Η στοιχειακή έκρηξη από τη ράβδο μαγικού βλήματος προκαλεί 50% ζημιά και παρέχει στον Μάγο 15 γύρους επαναφόρτισης.
items.wands.wandofmagicmissile.discover_hint=Ένας από τους ήρωες ξεκινά με αυτό το αντικείμενο.
items.wands.wandofmagicmissile$magiccharge.name=μαγικό φορτίο
items.wands.wandofmagicmissile$magiccharge.desc=Το ραβδί μαγικού βλήματος έχει τροφοδοτήσει τα ραβδιά σου και αυξάνει το επίπεδό τους για την επόμενη εξαπόλυση.\n\nΤα ραβδιά σου ενισχύονται στο: +%d.\n\nΓύροι μαγικού φορτίου που απομένουν: %s.

items.wands.wandofprismaticlight.name=ραβδί πρισματικού φωτός
items.wands.wandofprismaticlight.staff_name=ράβδος πρισματικού φωτός
items.wands.wandofprismaticlight.desc=Αυτό το ραβδί είναι φτιαγμένο από έναν συμπαγή και ημιδιαφανή κρύσταλλο. Μοιάζει με μακρύ κομμάτι από λείο γυαλί. Μικρά τμήματα πολύχρωμου φωτός πάλλονται στην άκρη του ραβδιού· είναι έτοιμα να εκτιναχθούν.
items.wands.wandofprismaticlight.stats_desc=Αυτό το ραβδί εξαπολύει ακτίνες φωτός που διαπερνούν τα σκοτάδια της κατακόμβης. Οι ακτίνες αποκαλύπτουν κρυμμένα σημεία και παγίδες, μπορούν να τυφλώσουν εχθρούς και προκαλούν _%1$d-%2$d ζημιά._ Οι δαιμονικοί και οι απέθαντοι εχθροί θα καούν στο λαμπερό φως του ραβδιού, λαμβάνοντας επιπλέον ζημιά.
items.wands.wandofprismaticlight.upgrade_stat_name_2=Πιθανότητα τύφλωσης
items.wands.wandofprismaticlight.upgrade_stat_name_3=Διάρκεια φωτός
items.wands.wandofprismaticlight.bmage_desc=Όταν _ο Μαγομαχητής_ κοπανά έναν εχθρό με τη ράβδο πρισματικού φωτός, ο εχθρός σακατεύεται για μια χρονική περίοδο αναλογικά με το επίπεδο της ράβδου.
items.wands.wandofprismaticlight.eleblast_desc=Η στοιχειακή έκρηξη από τη ράβδο πρισματικού φωτός προκαλεί 67% ζημιά, αποκαλύπτει όλο το έδαφος εντός της έκρηξης και τυφλώνει τους εχθρούς για 5 γύρους.

items.wands.wandofregrowth.name=ραβδί αναγέννησης
items.wands.wandofregrowth.staff_name=ράβδος αναγέννησης
items.wands.wandofregrowth.desc=Αυτό το λεπτό ραβδί είναι φτιαγμένο από ένα λεπτομερώς σκαλισμένο ξύλο. Με κάποιον τρόπο παραμένει ζωντανό και ζωηρό. Το χρώμα του είναι έντονο πράσινο, σαν την καρδιά ενός νεαρού δέντρου. «Όταν η ζωή σταματά, μια νέα ζωή ξεκινά να αναπτύσσεται... Ο αέναος κύκλος παραμένει!»
items.wands.wandofregrowth.stats_desc=Αυτό το ραβδί εκτοξεύει μαγική ενέργεια αναγέννησης σε κωνικό σχήμα – κάνοντας γρασίδι, ρίζες και σπάνια φυτά να αναπηδήσουν. Η επόμενη εξαπόλυση θα καταναλώσει _%1$d φορτίο._ Όσο περισσότερο φορτίο χρησιμοποιηθεί, τόσο ισχυρότερη και εκτενέστερη θα είναι η επίδραση.
items.wands.wandofregrowth.degradation=Αφού καταναλωθεί _%d φορτίο,_ το ραβδί θα αποτυγχάνει να παράγει φυτά και φρέσκο γρασίδι. Αυτό το όριο αυξάνεται ανεβαίνοντας επίπεδο ή αναβαθμίζοντας το ραβδί.
items.wands.wandofregrowth.upgrade_stat_name_1=Γρασίδι ανά φορτίο
items.wands.wandofregrowth.upgrade_stat_name_2=Όριο συνολικού γρασιδιού
items.wands.wandofregrowth.bmage_desc=Όταν _ο Μαγομαχητής_ κοπανά έναν εχθρό με τη ράβδο αναγέννησης, και ένας από τους δύο στέκεται σε γρασίδι, θα λάβει φυτική ίαση ανάλογη της ζημιάς που προκάλεσε.
items.wands.wandofregrowth.eleblast_desc=Η στοιχειακή έκρηξη από τη ράβδο αναγέννησης ριζώνει τους εχθρούς και φυτρώνει γρασίδι με τυχαίο τρόπο στην περιοχή της έκρηξης.
items.wands.wandofregrowth$dewcatcher.name=Δροσοσυλλέκτης
items.wands.wandofregrowth$dewcatcher.desc=Οι δροσοσυλλέκτες είναι θαυμαστά φυτά που γεμίζουν με μαγική δρόσο. Αποπειρώνται να καμουφλαριστούν σαν γρασίδι για να αποφύγουν την προσοχή. Οι όγκοι συλλεγμένης δρόσου, όμως, τα προδίδουν.
items.wands.wandofregrowth$dewcatcher.discover_hint=Μπορείς να βρεις αυτό το φυτό με ένα συγκεκριμένο ραβδί.
items.wands.wandofregrowth$seedpod.name=Λοβός Σπόρου
items.wands.wandofregrowth$seedpod.desc=Οι λοβοί σπόρων είναι μαγικά φυτά που παράγουν σπόρους από άλλα είδη φυτών αντί για δικούς τους. Καταφέρνουν με κάποιον τρόπο να εξαπλώνονται, παρόλο που δεν έχουν δικούς τους σπόρους.
items.wands.wandofregrowth$seedpod.discover_hint=Μπορείς να βρεις αυτό το φυτό με ένα συγκεκριμένο ραβδί.
items.wands.wandofregrowth$lotus.name=Χρυσός λωτός
items.wands.wandofregrowth$lotus.desc=Ο χρυσός λωτός είναι ένα μαγικό φυτό που μπορεί να υλοποιηθεί μόνο από ένα ισχυρό ραβδί αναγέννησης. Η αύρα του ενισχύει όλα τα φυτά και τις επιδράσεις τους, αλλά εξαντλεί και τη ζωτική του ενέργεια και το κάνει να πεθαίνει σε σύντομο χρονικό διάστημα.
items.wands.wandofregrowth$lotus.wand_info=Αυτός ο λωτός έχει δημιουργηθεί από ένα ραβδί αναγέννησης _+%1$d._ Όλα τα φυτά στο πεδίο επίδρασής του _θα ενεργοποιηθούν ακαριαία,_ εφόσον φυτεύονται στο τετράγωνο ενός χαρακτήρα. Επιπλέον, τα φυτά έχουν _%2$d%% πιθανότητα_ να πετάξουν τον σπόρο τους, και τα εμποτισμένα βέλη ξοδεύουν _%3$d%% λιγότερη ανθεκτικότητα._
items.wands.wandofregrowth$lotus.discover_hint=Μπορείς να βρεις αυτό το φυτό με ένα συγκεκριμένο ραβδί, αφού το αναβαθμίσεις πολλές φορές.

items.wands.wandoftransfusion.name=ραβδί μετάγγισης
items.wands.wandoftransfusion.staff_name=ράβδος μετάγγισης
items.wands.wandoftransfusion.ondeath=Εξοντώθηκες από το ίδιο σου το ραβδί μετάγγισης...
items.wands.wandoftransfusion.charged=Η ράβδος φορτίστηκε με τη ζωτική ενέργεια του εχθρού σου!
items.wands.wandoftransfusion.desc=Ένα απλά σχηματισμένο ραβδί· ξεχωρίζει χάρη στην πορφυρή του απόχρωση και το κατάμαυρο πετράδι στην άκρη.
items.wands.wandoftransfusion.stats_desc=Όταν χρησιμοποιείται σε συμμάχους ή γοητευμένους εχθρούς, αυτό το ραβδί απορροφά _%1$d ζωή από τον χρήστη_ και θεραπεύει ή προστατεύει τον σύμμαχο για _%2$d ζωή._ Όταν χρησιμοποιείται σε εχθρούς, το ραβδί τούς γοητεύει για λίγο και προσφέρει _%3$d προστασία_ στον χρήστη. Εχθρικοί απέθαντοι θα λάβουν _%4$d-%5$d ζημιά_ αντί να γοητευθούν.
items.wands.wandoftransfusion.upgrade_stat_name_1=Θεραπεία συμμάχου
items.wands.wandoftransfusion.upgrade_stat_name_2=Προστασία
items.wands.wandoftransfusion.upgrade_stat_name_3=Ζημιά σε απέθαντους
items.wands.wandoftransfusion.bmage_desc=_Ο Μαγομαχητής_ λαμβάνει προστασία όποτε κοπανά έναν γοητευμένο εχθρό με τη ράβδο μετάγγισης. Η επόμενη εξαπόλυση από τη ράβδο δεν θα του κοστίσει ζωή.
items.wands.wandoftransfusion.eleblast_desc=Η στοιχειακή έκρηξη από τη ράβδο μετάγγισης γοητεύει τους εχθρούς, θεραπεύει τους συμμάχους, και προκαλεί 100% ζημιά στους απέθαντους εχθρούς.

items.wands.wandofwarding.name=ραβδί φύλαξης
items.wands.wandofwarding.staff_name=ράβδος φύλαξης
items.wands.wandofwarding.no_more_wards=Το ραβδί σου δεν μπορεί να διατηρήσει άλλες φυλάξεις.
items.wands.wandofwarding.bad_location=Δεν μπορείς να τοποθετήσεις φύλαξη εκεί.
items.wands.wandofwarding.desc=Αυτό το μικρό μεταλλικό ραβδί έχει ένα λαμπερό μωβ πετράδι που αιωρείται στην άκρη του.
items.wands.wandofwarding.stats_desc=Αντί να χτυπά τους εχθρούς απευθείας, αυτό το ραβδί υλοποιεί στάσιμες φυλάξεις και φρουρούς. Οι φυλάξεις μπορούν να υλοποιηθούν οπουδήποτε – ακόμα και μέσα από τοίχους αν έχεις όραση. Το ραβδί μπορεί να διατηρήσει φυλάξεις _%d πόντων ενέργειας_ κάθε φορά.
items.wands.wandofwarding.upgrade_stat_name_1=Ζημιά φύλαξης
items.wands.wandofwarding.upgrade_stat_name_2=Ενέργεια φύλαξης
items.wands.wandofwarding.bmage_desc=Όταν _ο Μαγομαχητής_ κοπανά έναν εχθρό με τη ράβδο φύλαξης, όλοι οι ενεργοί φρουροί έχουν μια πιθανότητα να θεραπευτούν.
items.wands.wandofwarding.eleblast_desc=Η στοιχειακή έκρηξη από τη ράβδο φύλαξης θεραπεύει όλους τους φρουρούς στην περιοχή έκρηξης.
items.wands.wandofwarding$ward.desc_generic_ward=Αυτή η φύλαξη θα εξαπολύσει αυτόματα σε οποιονδήποτε εχθρό έρθει στο οπτικό της πεδίο.\n\nΗ φύλαξη θα αναβαθμιστεί αν της ρίξεις με το ραβδί φύλαξης.\n\nΟι φυλάξεις έχουν περιορισμένο αριθμό εξαπολύσεων και έπειτα εξουδετερώνονται.
items.wands.wandofwarding$ward.desc_generic_sentry=Αυτός ο φρουρός έχει την ίδια επιθετική ισχύ με τη φύλαξη, αλλά διαθέτει πόντους ζωής αντί για φορτίο. Ομοιάζει με το πετράδι στην άκρη του ραβδιού φύλαξης.\n\nΟ φρουρός θα αναβαθμιστεί και θα θεραπευθεί αν του ρίξεις με το ραβδί φύλαξης.\n\nΟ φρουρός καταναλώνει ζωή όποτε ρίχνει σε εχθρό – αλλά μπορεί να θεραπευτεί χρησιμοποιώντας το ραβδί φύλαξης επάνω του.
items.wands.wandofwarding$ward.name_1=μικρή φύλαξη
items.wands.wandofwarding$ward.desc_1=Αυτή η βασική φύλαξη θα χτυπήσει αυτόματα οποιονδήποτε εχθρό έρθει στο πεδίο όρασής της, προκαλώντας _%1$d-%2$d ζημιά._\n\nΑν ρίξεις στη φύλαξη με το ραβδί φύλαξής σου, θα αναβαθμιστεί.\n\nΑυτή η φύλαξη θα χτυπήσει μία φορά πριν διαλυθεί.\n\nΤο ραβδί φύλαξής σου χρησιμοποιεί _%3$d ενέργεια_ για να διατηρήσει αυτήν τη φύλαξη.
items.wands.wandofwarding$ward.name_2=φύλαξη
items.wands.wandofwarding$ward.desc_2=Αυτή η αναβαθμισμένη φύλαξη έχει πιο περίπλοκο μοτίβο και μπορεί να επιτεθεί πολλαπλές φορές. Κάθε χτύπημα της φύλαξης προκαλεί _%1$d-%2$d ζημιά._\n\nΑν ρίξεις στη φύλαξη με το ραβδί φύλαξής σου, θα αναβαθμιστεί.\n\nΑυτή η φύλαξη θα χτυπήσει τρεις φορές προτού διαλυθεί.\n\nΤο ραβδί φύλαξής σου χρησιμοποιεί _%3$d ενέργεια_ για να διατηρήσει αυτήν τη φύλαξη.
items.wands.wandofwarding$ward.name_3=ανώτερη φύλαξη
items.wands.wandofwarding$ward.desc_3=Αυτή η πλήρως αναβαθμισμένη φύλαξη μπορεί να επιτεθεί περισσότερες φορές από τους προκατόχους της. Κάθε χτύπημα αυτής της φύλαξης προκαλεί _%1$d-%2$d ζημιά._\n\nΑν ρίξεις στη φύλαξη με το ραβδί φύλαξής σου, θα αναβαθμιστεί.\n\nΑυτή η φύλαξη θα χτυπήσει πέντε φορές προτού διαλυθεί.\n\nΤο ραβδί φύλαξής σου χρησιμοποιεί _%3$d ενέργεια_ για να διατηρήσει αυτήν τη φύλαξη.
items.wands.wandofwarding$ward.name_4=μικρός φρουρός
items.wands.wandofwarding$ward.desc_4=Αυτός ο μικρός φρουρός έχει την ίδια δύναμη με μία ανώτερη φύλαξη, αλλά διαθέτει πόντους ζωής αντί για προκαθορισμένο φορτίο. Ομοιάζει με το πετράδι στην άκρη του ραβδιού φύλαξης. Κάθε χτύπημα του φρουρού προκαλεί_%1$d-%2$d ζημιά._\n\nΑν ρίξεις στον φρουρό με το ραβδί φύλαξής σου, θα αναβαθμιστεί και θα θεραπευθεί.\n\nΟ φρουρός καταναλώνει ζωή όποτε χτυπά έναν εχθρό – αλλά μπορεί να θεραπευτεί χρησιμοποιώντας το ραβδί φύλαξης επάνω του.\n\nΤο ραβδί φύλαξης χρησιμοποιεί _%3$d ενέργεια_ για να διατηρήσει τον φρουρό.
items.wands.wandofwarding$ward.name_5=φρουρός
items.wands.wandofwarding$ward.desc_5=Αυτός ο αναβαθμισμένος φρουρός είναι μεγαλύτερος και ανθεκτικότερος από έναν μικρό φρουρό. Κάθε χτύπημα του φρουρού προκαλεί _%1$d-%2$d ζημιά._\n\nΑν ρίξεις στον φρουρό με το ραβδί φύλαξής σου, αναβαθμίζεται και θεραπεύεται.\n\nΟ φρουρός καταναλώνει κάποια ζωή όποτε χτυπά έναν εχθρό – αλλά μπορεί να θεραπευτεί χρησιμοποιώντας το ραβδί φύλαξης πάνω του.\n\nΤο ραβδί φύλαξης χρησιμοποιεί _%3$d ενέργεια_ για να διατηρήσει τον φρουρό.
items.wands.wandofwarding$ward.name_6=ανώτερος φρουρός
items.wands.wandofwarding$ward.desc_6=Αυτός ο πλήρως αναβαθμισμένος φρουρός είναι σημαντικά ανθεκτικότερος από τους προκατόχους του. Κάθε χτύπημα του φρουρού προκαλεί _%1$d-%2$d ζημιά._\n\nΑν ρίξεις στον φρουρό με το ραβδί φύλαξής σου, θα θεραπευθεί.\n\nΟ φρουρός ξοδεύει ζωή όποτε χτυπά έναν εχθρό -αλλά μπορεί να θεραπευτεί χρησιμοποιώντας το ραβδί φύλαξης πάνω του.\n\nΤο ραβδί φύλαξής σου χρησιμοποιεί _%3$d ενέργεια_ για να διατηρήσει τον φρουρό.
items.wands.wandofwarding$ward.discover_hint=Μπορείς να βρεις αυτόν τον χαρακτήρα με ένα συγκεκριμένο ραβδί.
items.wands.wandofwarding$ward.dismiss_title=Αποδέσμευση της φύλαξης;
items.wands.wandofwarding$ward.dismiss_body=Μπορείς να αποδεσμεύσεις τη φύλαξη αν δεν θέλεις να τη διατηρεί το ραβδί σου. Εάν το κάνεις, η φύλαξη θα εξουδετερωθεί αμέσως.\n\nΑποδέσμευση της φύλαξης;
items.wands.wandofwarding$ward.dismiss_confirm=ναι
items.wands.wandofwarding$ward.dismiss_cancel=όχι

###weapon curses
items.weapon.curses.annoying.name=%s ενοχλητικότητας
items.weapon.curses.annoying.msg_1=ΩΩΩ! ΠΟΙΟΝ ΠΟΛΕΜΑΜΕ!;
items.weapon.curses.annoying.msg_2=ΝΑΙ! ΦΑΤΟΝ!
items.weapon.curses.annoying.msg_3=ΕΕ! ΑΚΟΥ!
items.weapon.curses.annoying.msg_4=ΦΤΑΣΑΜΕ ΣΤΟ ΑΦΕΝΤΙΚΟ Ή ΑΚΟΜΑ!;
items.weapon.curses.annoying.msg_5=ΕΕ! ΜΗ ΜΕ ΚΟΥΝΑΣ ΤΟΣΟ ΔΥΝΑΤΑ!
items.weapon.curses.annoying.msg_6=ΨΟΦΑ, ΖΩΥΦΙΟ!
items.weapon.curses.annoying.msg_7=ΟΥΑΑΑΑΑΑΑΑΑΑΑΟΥ!
items.weapon.curses.annoying.msg_8=ΝΑ ΚΑΝΟΥΜΕ ΚΑΝΑ ΔΙΑΛΕΙΜΜΑ;!
items.weapon.curses.annoying.msg_9=ΜΠΑΜ! ΧΑΧΑ!
items.weapon.curses.annoying.msg_10=ΩΡΑΙΟ ΧΤΥΠΗΜΑ!
items.weapon.curses.annoying.msg_11=Δεν ήθελα να 'μουν όπλο... ήθελα να 'μουν τσεκούρι ξυλοκόπου.
items.weapon.curses.annoying.msg_12=Να θυμάσαι, η αλαζονεία είναι ένας αργός και ύπουλος φονιάς.
items.weapon.curses.annoying.msg_13=ΘΑ ΣΑΣ ΠΑΡΟΥΜΕ ΤΑ ΣΩΒΡΑΚΑ!
items.weapon.curses.annoying.desc=Τα ενοχλητικά όπλα είναι ικανά να μιλούν, αλλά είναι και αρκετά ανήσυχα. Συχνά θα τραβούν, άθελά τους, την προσοχή επάνω σου.
items.weapon.curses.annoying.elestrike_desc=Ένα στοιχειακό χτύπημα με την κατάρα ενοχλητικότητας έχει 20% πιθανότητα να προκαλέσει αμόκ σε κάθε εχθρό εντός εμβέλειας για 6 γύρους.

items.weapon.curses.dazzling.name=%s εκθαμβωτικότητας
items.weapon.curses.dazzling.desc=Τα εκθαμβωτικά όπλα εκπέμπουν εκτυφλωτικό φως ανά διαστήματα, τυφλώνοντας όλους όσους τα βλέπουν.
items.weapon.curses.dazzling.elestrike_desc=Ένα στοιχειακό χτύπημα με την κατάρα εκθαμβωτικότητας έχει 50% πιθανότητα να τυφλώσει κάθε εχθρό εντός εμβέλειας για 6 γύρους.

items.weapon.curses.displacing.name=%s εκτοπισμού
items.weapon.curses.displacing.desc=Τα εκτοπιστικά όπλα είναι εγχυμένα με χαοτική μαγεία τηλεμεταφοράς. Κατέχουν την ικανότητα να τηλεμεταφέρουν τους εχθρούς σε τυχαία μέρη του ορόφου.
items.weapon.curses.displacing.elestrike_desc=Ένα στοιχειακό χτύπημα με την κατάρα εκτοπισμού έχει 50% πιθανότητα να τηλεμεταφέρει κάθε εχθρό που βρίσκεται εντός εμβέλειας.

items.weapon.curses.explosive.name=%s εκρηκτικότητας
items.weapon.curses.explosive.warm=Ζεστό...
items.weapon.curses.explosive.hot=Καυτό!
items.weapon.curses.explosive.desc=Τα εκρηκτικά όπλα συγκεντρώνουν σταθερά ισχύ και εκρήγνυνται, προκαλώντας ζημιά σε οτιδήποτε βρίσκεται κοντά τους.
items.weapon.curses.explosive.desc_cool=Το όπλο είναι ψυχρό στο άγγιγμα.
items.weapon.curses.explosive.desc_warm=Το όπλο αναπτύσσει ενέργεια και θερμαίνεται...
items.weapon.curses.explosive.desc_hot=Το όπλο σου είναι καυτό! Είναι έτοιμο να εκραγεί!
items.weapon.curses.explosive.elestrike_desc=Ένα στοιχειακό χτύπημα με την κατάρα εκρηκτικότητας έχει 50% πιθανότητα να προκαλέσει μια έκρηξη σε έναν τυχαίο εχθρό εντός εμβέλειας.

items.weapon.curses.friendly.name=%s φιλικότητας
items.weapon.curses.friendly.desc=Τα φιλικά όπλα είναι κατάλληλα για ειρηνιστές: κάπου-κάπου ενεργοποιούν μια μαγεία που καθιστά αδύνατη τη μάχη.
items.weapon.curses.friendly.elestrike_desc=Ένα στοιχειακό χτύπημα με την κατάρα φιλικότητας έχει 50% πιθανότητα να γοητεύσει κάθε εχθρό εντός εμβέλειας για 6 γύρους.

items.weapon.curses.polarized.name=%s πόλωσης
items.weapon.curses.polarized.desc=Η μαγεία ενός όπλου πόλωσης το κάνει να προκαλεί είτε 50% παραπάνω ζημιά είτε καθόλου ζημιά.
items.weapon.curses.polarized.elestrike_desc=Ένα στοιχειακό χτύπημα με την κατάρα πόλωσης έχει 50% πιθανότητα να προκαλέσει 24-36 ζημιά σε κάθε εχθρό εντός εμβέλειας.

items.weapon.curses.sacrificial.name=%s θυσιασμού
items.weapon.curses.sacrificial.desc=Τα όπλα θυσιασμού θα απαιτούν αίμα από τον χρήστη για να επιτίθενται στους εχθρούς. Όσο πιο υγιής είναι ο χρήστης, τόσο περισσότερο αίμα απομυζά η κατάρα.
items.weapon.curses.sacrificial.elestrike_desc=Ένα στοιχειακό χτύπημα με την κατάρα θυσιασμού κάνει τον ήρωα και κάθε εχθρό εντός εμβέλειας να αιμορραγήσουν για 12 ζωή.

items.weapon.curses.wayward.name=%s ιδιοτροπίας
items.weapon.curses.wayward.desc=Τα ιδιότροπα όπλα γίνονται εξαιρετικά ανακριβή ανά διαστήματα. Η μαγεία αυτή διαρκεί για λίγο αφού ενεργοποιηθεί, αλλά εξαλείφεται μόλις καταφέρεις χτύπημα με το ιδιότροπο όπλο.
items.weapon.curses.wayward.elestrike_desc=Ένα στοιχειακό χτύπημα με την κατάρα ιδιοτροπίας έχει 50% πιθανότητα να καταραστεί κάθε εχθρό εντός εμβέλειας για 6 γύρους.
items.weapon.curses.wayward$waywardbuff.name=ιδιοτροπία
items.weapon.curses.wayward$waywardbuff.desc=Η μαγεία του ιδιότροπου όπλου έχει ενεργοποιηθεί και το κάνει εξαιρετικά ανακριβές για ένα μικρό χρονικό διάστημα. Έχε υπόψη σου ότι δεν επηρεάζονται οι επιθέσεις που είναι εγγυημένες να επιτύχουν, όπως οι αιφνίδιες. Μία επιτυχής επίθεση με το ιδιότροπο όπλο θα εξαλείψει αμέσως την επίδραση.\n\nΓύροι που απομένουν: %s.

###enchantments
items.weapon.enchantments.blazing.name=%s ανάφλεξης
items.weapon.enchantments.blazing.desc=Αυτή η ενίσχυση κάνει το όπλο να εκτοπίζει φλόγες, αναφλέγοντας τους εχθρούς και προκαλώντας επιπλέον ζημιά σε όσους είναι ήδη τυλιγμένοι με φλόγες.
items.weapon.enchantments.blazing.elestrike_desc=Ένα στοιχειακό χτύπημα με την ενίσχυση ανάφλεξης εξαπλώνει φωτιά σε κάθε τετράγωνο εντός εμβέλειας, η οποία διαρκεί 8 γύρους.

items.weapon.enchantments.blocking.name=%s αμυντικότητας
items.weapon.enchantments.blocking.desc=Τα όπλα αμυντικότητας έχουν μια πιθανότητα να σε περικλείσουν για λίγο με ασπίδα προστασίας αφού επιτεθείς με αυτά.
items.weapon.enchantments.blocking.elestrike_desc=Ένα στοιχειακό χτύπημα με την ενίσχυση αμυντικότητας προσδίδει στην Ξιφομάχο 6 επιπλέον προστασία για κάθε εχθρό εντός εμβέλειας.
items.weapon.enchantments.blocking$blockbuff.name=αμυντικότητα
items.weapon.enchantments.blocking$blockbuff.desc=Η μαγική ενίσχυση αμυντικότητας του όπλου σού παρέχει μια σύντομη αύξηση της αμυντικής σου ισχύος!\n\nΠροστασία που απομένει: %d.\n\nΓύροι που απομένουν: %s.

items.weapon.enchantments.blooming.name=%s ανθηρότητας
items.weapon.enchantments.blooming.desc=Η μαγεία των όπλων ανθηρότητας κάνει τη βλάστηση να ξεπηδά γύρω από αυτούς που χτυπιούνται από αυτά.
items.weapon.enchantments.blooming.elestrike_desc=Ένα στοιχειακό χτύπημα με την ενίσχυση ανθηρότητας απλώνει γρασίδι σε έως και 8 τετράγωνα και ριζώνει όλους τους εχθρούς εντός εμβέλειας για 6 γύρους.

items.weapon.enchantments.chilling.name=%s ψύχους
items.weapon.enchantments.chilling.desc=Οι εχθροί που χτυπιούνται από αυτήν την ενίσχυση ψύχονται, κι επιβραδύνονται οι κινήσεις και οι επιθέσεις τους.
items.weapon.enchantments.chilling.elestrike_desc=Ένα στοιχειακό χτύπημα με την ενίσχυση ψύχους εξαπλώνει ψυχρό αέρα σε κάθε τετράγωνο εντός εμβέλειας, ο οποίος διαρκεί 8 γύρους.

items.weapon.enchantments.kinetic.name=%s κινητικότητας
items.weapon.enchantments.kinetic.desc=Όταν ένας εχθρός σκοτωθεί από όπλο κινητικότητας, η περίσσια ισχύς του χτυπήματος αποθηκεύεται στο όπλο. Θα εφαρμοστεί ως επιπλέον ζημιά στην επόμενη επιτυχημένη επίθεση.
items.weapon.enchantments.kinetic.elestrike_desc=Ένα στοιχειακό χτύπημα με την ενίσχυση κινητικότητας εφαρμόζει το 40% της αποθηκευμένης ζημιάς σε κάθε εχθρό εντός εμβέλειας, εκτός από τον κύριο στόχο.
items.weapon.enchantments.kinetic$conserveddamage.name=διατηρημένη ζημιά
items.weapon.enchantments.kinetic$conserveddamage.desc=Το όπλο σου έχει αποθηκεύσει την περίσσια ισχύ από ένα προηγούμενο θανάσιμο χτύπημα. Θα την εφαρμόσει ως επιπλέον ζημιά στην επόμενη επίθεσή σου. Όμως, η ενέργεια αυτή εξασθενεί σιγά-σιγά με το πέρασμα του χρόνου.\n\nΔιατηρημένη ζημιά: %d.

items.weapon.enchantments.corrupting.name=%s διαφθοράς
items.weapon.enchantments.corrupting.desc=Αυτή η ισχυρή ενίσχυση κατέχει την ικανότητα να υποτάξει τους εχθρούς στη θέλησή σου. Όταν ένας εχθρός εξοντωθεί από αυτό το όπλο, υπάρχει πιθανότητα να γίνει διεφθαρμένος αντί να πεθάνει.
items.weapon.enchantments.corrupting.elestrike_desc=Ένα στοιχειακό χτύπημα με την ενίσχυση διαφθοράς έχει πιθανότητα 5-25% (βάσει της χαμένης ζωής) να διαφθείρει κάθε εχθρό εντός εμβέλειας, εκτός από τον κύριο στόχο.

items.weapon.enchantments.elastic.name=%s ελαστικότητας
items.weapon.enchantments.elastic.desc=Τα όπλα ελαστικότητας έχουν μια πιθανότητα να πετάξουν τους εχθρούς πίσω σε μικρές αποστάσεις.
items.weapon.enchantments.elastic.elestrike_desc=Ένα στοιχειακό χτύπημα με την ενίσχυση ελαστικότητας πετάει 5 τετράγωνα πίσω όλους τους εχθρούς εντός εμβέλειας.

items.weapon.enchantments.grim.name=%s ολέθρου
items.weapon.enchantments.grim.desc=Αυτή η ισχυρή ενίσχυση κατέχει τη δύναμη να εκτελέσει ακαριαία έναν εχθρό. Η επίδραση είναι πιο πιθανό να συμβεί όσο πιο αδύναμος είναι ο εχθρός.
items.weapon.enchantments.grim.elestrike_desc=Ένα στοιχειακό χτύπημα με την ενίσχυση ολέθρου έχει 6-30% πιθανότητα (βάσει της χαμένης ζωής) να εξοντώσει κάθε εχθρό εντός εμβέλειας, εκτός από τον κύριο στόχο.

items.weapon.enchantments.lucky.name=%s καλοτυχίας
items.weapon.enchantments.lucky.desc=Οι εχθροί που σκοτώνονται από όπλο καλοτυχίας έχουν την πιθανότητα να πετάξουν επιπλέον λάφυρα.
items.weapon.enchantments.lucky.elestrike_desc=Ένα στοιχειακό χτύπημα με την ενίσχυση καλοτυχίας έχει 12.5% πιθανότητα να αφήσει λάφυρα κάτω από κάθε εχθρό εντός εμβέλειας. Μπορεί να ενεργοποιηθεί μόνο μία φορά ανά εχθρό.

items.weapon.enchantments.projecting.name=%s προβλητικότητας
items.weapon.enchantments.projecting.desc=Με αυτήν την ενίσχυση, τα όπλα μάχης σώμα-με-σώμα αποκτούν μεγαλύτερη εμβέλεια χτυπήματος. Τα όπλα απόστασης μπορούν να διαπερνούν τους κοντινούς τοίχους, όταν στοχεύουν κοντινούς στόχους.
items.weapon.enchantments.projecting.elestrike_desc=Ένα στοιχειακό χτύπημα με την ενίσχυση προβλητικότητας προκαλεί 30% ζημιά σε κάθε εχθρό εντός εμβέλειας, εκτός από τον κύριο στόχο.

items.weapon.enchantments.shocking.name=%s ηλεκτροπληξίας
items.weapon.enchantments.shocking.desc=Τα όπλα ηλεκτροπληξίας σχηματίζουν ηλεκτρικά τόξα, προκαλώντας επιπλέον ζημιά σε όλους τους κοντινούς εχθρούς.
items.weapon.enchantments.shocking.elestrike_desc=Ένα στοιχειακό χτύπημα με την ενίσχυση ηλεκτροπληξίας απλώνει ηλεκτρισμό σε κάθε τετράγωνο εντός εμβέλειας που διαρκεί 8 γύρους.

items.weapon.enchantments.unstable.name=%s αστάθειας
items.weapon.enchantments.unstable.desc=Αυτή η ενίσχυση ακτινοβολεί με χαοτική ενέργεια· δρα ως μια διαφορετική ενίσχυση σε κάθε χτύπημα.
items.weapon.enchantments.unstable.elestrike_desc=Ένα στοιχειακό χτύπημα με την ενίσχυση αστάθειας εφαρμόζει την επίδραση τυχαίας μαγικής ενίσχυσης σε κάθε εχθρό εντός εμβέλειας, εκτός από τον κύριο στόχο.

items.weapon.enchantments.vampiric.name=%s αφαίμαξης
items.weapon.enchantments.vampiric.desc=Αυτή η ισχυρή ενίσχυση απορροφά τη ζωή από τους εχθρούς σε κάθε χτύπημα, διοχετεύοντάς την πίσω στον χρήστη. Όσο πιο χαμηλή είναι η ζωή του χρήστη, τόσο ισχυρότερη είναι η επίδραση.
items.weapon.enchantments.vampiric.elestrike_desc=Ένα στοιχειακό χτύπημα με την ενίσχυση αφαίμαξης αναπληρώνει στην Ξιφομάχο 2.5 ζωή για κάθε εχθρό εντός εμβέλειας.


###melee weapons
items.weapon.melee.assassinsblade.name=δολοφονικό λεπίδι
items.weapon.melee.assassinsblade.stats_desc=Αυτό το όπλο είναι ισχυρότερο σε ανυποψίαστους εχθρούς.
items.weapon.melee.assassinsblade.ability_name=κρυψιμο
items.weapon.melee.assassinsblade.typical_ability_desc=Η Ξιφομάχος μπορεί να _κρυφτεί_ κρατώντας το δολοφονικό λεπίδι. Αυτή η ικανότητα επιτρέπει στην Ξιφομάχο να αναπηδήσει ακαριαία έως και 3 τετράγωνα μακριά και κανονικά της δίνει _%d γύρους αορατότητας._
items.weapon.melee.assassinsblade.ability_desc=Η Ξιφομάχος μπορεί να _κρυφτεί_ κρατώντας το δολοφονικό λεπίδι. Αυτή η ικανότητα επιτρέπει στην Ξιφομάχο να αναπηδήσει ακαριαία έως και 3 τετράγωνα μακριά και της δίνει _%d γύρους αορατότητας._
items.weapon.melee.assassinsblade.upgrade_ability_stat_name=Διάρκεια ικανότητας
items.weapon.melee.assassinsblade.desc=Ένα μικρό και καμπυλωτό λεπίδι φτιαγμένο από οψιδιανό. Δύσκολο στη χρήση παρά την ελαφρότητά του, αλλά θανατηφόρο αν πετύχει καλά τον στόχο.

items.weapon.melee.battleaxe.name=πολεμικό τσεκούρι
items.weapon.melee.battleaxe.stats_desc=Αυτό το όπλο είναι αρκετά ακριβές.
items.weapon.melee.battleaxe.ability_name=βαρυ χτυπημα
items.weapon.melee.battleaxe.typical_ability_desc=Η Ξιφομάχος μπορεί να εκτελέσει ένα _βαρύ χτύπημα_ με το πολεμικό τσεκούρι. Αυτή η συγκεντρωμένη επίθεση κανονικά προκαλεί _%1$d-%2$d ζημιά,_ αν είναι αιφνίδια, και σαστίζει για 5 γύρους, κάτι που μειώνει την ακρίβεια και την αποφυγή κατά 50%%. Το βαρύ χτύπημα χτυπά εγγυημένα, αλλά προκαλεί κανονική ζημιά αν δεν αιφνιδιάσει τον εχθρό.
items.weapon.melee.battleaxe.ability_desc=Η Ξιφομάχος μπορεί να εκτελέσει ένα _βαρύ χτύπημα_ με το πολεμικό τσεκούρι. Αυτή η συγκεντρωμένη επίθεση προκαλεί _%1$d-%2$d ζημιά,_ αν είναι αιφνίδια, και σαστίζει για 5 γύρους, κάτι που μειώνει την ακρίβεια και την αποφυγή κατά 50%%. Το βαρύ χτύπημα χτυπά εγγυημένα, αλλά προκαλεί κανονική ζημιά αν δεν αιφνιδιάσει τον εχθρό.
items.weapon.melee.battleaxe.desc=Η τεράστια ατσάλινη κεφαλή του πολεμικού τσεκουριού δίνει βάρος σε κάθε του χτύπημα.

items.weapon.melee.crossbow.name=βαλλίστρα
items.weapon.melee.crossbow.typical_stats_desc=Typically this weapon enhances thrown darts to deal _%1$d-%2$d damage_ when it is equipped, and will even grant its enchantment to them.
items.weapon.melee.crossbow.stats_desc=This weapon enhances thrown darts to deal _%1$d-%2$d damage_ when it is equipped, and will even grant its enchantment to them.
items.weapon.melee.crossbow.ability_name=φορτισμενη βολη
items.weapon.melee.crossbow.typical_ability_desc=Η Ξιφομάχος μπορεί να _φορτίσει_ τη βαλλίστρα. Έτσι, η επόμενη κανονική επίθεση με αυτή χτυπά εγγυημένα και εφαρμόζει 1 από 3 επιδράσεις: η επίθεση μάχης σώμα-με-σώμα πετά τον εχθρό μακριά· ένα μη εμποτισμένο βέλος προκαλεί τυπικά _+%1$d ζημιά·_ ένα εμποτισμένο βέλος εφαρμόζει την επίδρασή του σε περιοχή 7x7 και τυπικά διαρκεί για _%2$d περισσότερες χρήσεις._
items.weapon.melee.crossbow.ability_desc=Η Ξιφομάχος μπορεί να _φορτίσει_ τη βαλλίστρα. Έτσι, η επόμενη κανονική επίθεση με αυτή χτυπά εγγυημένα και εφαρμόζει 1 από 3 επιδράσεις: η επίθεση μάχης σώμα-με-σώμα πετά τον εχθρό μακριά· ένα μη εμποτισμένο βέλος προκαλεί _+%1$d ζημιά·_ ένα εμποτισμένο βέλος εφαρμόζει την επίδρασή του σε περιοχή 7x7 και διαρκεί για _%2$d περισσότερες χρήσεις._
items.weapon.melee.crossbow.desc=Ένα αρκετά περίτεχνο όπλο που εξαπολύει βέλη σε εξαιρετικές ταχύτητες. Αν και δεν είναι σχεδιασμένη για αυτό, το βάρος και η στιβαρότητά της την καθιστούν επαρκές όπλο μάχης σώμα-με-σώμα.
items.weapon.melee.crossbow.upgrade_ability_stat_name=Ενδυνάμωση ικανότητας
items.weapon.melee.crossbow$chargedshot.name=φορτισμένη
items.weapon.melee.crossbow$chargedshot.desc=Η Ξιφομάχος συγκεντρώνει ισχύ στη βαλλίστρα της. Η επόμενη επίθεση με αυτή θα χτυπήσει εγγυημένα και θα εφαρμόσει μία από τις παρακάτω επιδράσεις:\n- Η επίθεση μάχης σώμα-με-σώμα πετά τους εχθρούς λίγα τετράγωνα μακριά.\n- Ένα μη εμποτισμένο βέλος προκαλεί επιπλέον ζημιά.\n- Ένα εμποτισμένο βέλος λαμβάνει επιπλέον χρήσεις κσι ενεργοποιεί την επίδρασή του σε μια περιοχή 7x7. Οι θετικές επιδράσεις βελών επηρεάζουν μόνο τους συμμάχους, ενώ οι επιβλαβείς μόνο τους εχθρούς. Η Ξιφομάχος δεν μπορεί να εφαρμόσει θετικές επιδράσεις βελών στον εαυτό της με αυτήν την ικανότητα.

items.weapon.melee.cudgel.name=βαρδούκιο
items.weapon.melee.cudgel.stats_desc=Αυτό το όπλο είναι αρκετά ακριβές.
items.weapon.melee.cudgel.ability_name=βαρυ χτυπημα
items.weapon.melee.cudgel.typical_ability_desc=Η Ξιφομάχος μπορεί να εκτελέσει ένα _βαρύ χτύπημα_ με το βαρδούκιο. Αυτή η συγκεντρωμένη επίθεση κανονικά προκαλεί _%1$d-%2$d ζημιά,_ αν ήταν αιφνίδια, και σαστίζει για 5 γύρους, κάτι που μειώνει την ακρίβεια και την αποφυγή κατά 50%%. Το βαρύ χτύπημα χτυπά εγγυημένα, αλλά προκαλεί κανονική ζημιά αν δεν αιφνιδιάσει τον εχθρό.
items.weapon.melee.cudgel.ability_desc=Η Ξιφομάχος μπορεί να εκτελέσει ένα _βαρύ χτύπημα_ με το βαρδούκιο. Αυτή η συγκεντρωμένη επίθεση προκαλεί _%1$d-%2$d ζημιά,_ αν ήταν αιφνίδια, και σαστίζει για 5 γύρους, κάτι που μειώνει την ακρίβεια και την αποφυγή κατά 50%%. Το βαρύ χτύπημα χτυπά εγγυημένα, αλλά προκαλεί κανονική ζημιά αν δεν αιφνιδιάσει τον εχθρό.
items.weapon.melee.cudgel.desc=Ένας μικρός ορειχάλκινος κεφαλοθραύστης. Προορίζεται περισσότερο ως εργαλείο αυτοάμυνας για ευγενείς παρά ως όπλο εξερευνητών.
items.weapon.melee.cudgel.discover_hint=Ένας από τους ήρωες ξεκινά με αυτό το αντικείμενο.

items.weapon.melee.dagger.name=στιλέτο
items.weapon.melee.dagger.stats_desc=Αυτό το όπλο είναι ισχυρότερο σε ανυποψίαστους εχθρούς.
items.weapon.melee.dagger.ability_name=κρυψιμο
items.weapon.melee.dagger.typical_ability_desc=Η Ξιφομάχος μπορεί να _κρυφτεί_ κρατώντας το στιλέτο. Αυτή η ικανότητα επιτρέπει στην Ξιφομάχο να αναπηδήσει ακαριαία έως και 5 τετράγωνα μακριά και κανονικά της δίνει _%d γύρους αορατότητας._
items.weapon.melee.dagger.ability_desc=Η Ξιφομάχος μπορεί να _κρυφτεί_ κρατώντας το στιλέτο. Αυτή η ικανότητα επιτρέπει στην Ξιφομάχο να αναπηδήσει ακαριαία έως και 5 τετράγωνα μακριά και της δίνει _%d γύρους αορατότητας._
items.weapon.melee.dagger.upgrade_ability_stat_name=Διάρκεια ικανότητας
items.weapon.melee.dagger.desc=Ένα απλό σιδερένιο στιλέτο με φθαρμένη ξύλινη λαβή.
items.weapon.melee.dagger.discover_hint=Ένας από τους ήρωες ξεκινά με αυτό το αντικείμενο.

items.weapon.melee.dirk.name=λεπίδι
items.weapon.melee.dirk.stats_desc=Αυτό το όπλο είναι ισχυρότερο σε ανυποψίαστους εχθρούς.
items.weapon.melee.dirk.ability_name=κρυψιμο
items.weapon.melee.dirk.typical_ability_desc=Η Ξιφομάχος μπορεί να _κρυφτεί_ κρατώντας το λεπίδι. Αυτή η ικανότητα επιτρέπει στην Ξιφομάχο να αναπηδήσει ακαριαία έως και 4 τετράγωνα μακριά και κανονικά της δίνει _%d γύρους αορατότητας._
items.weapon.melee.dirk.ability_desc=Η Ξιφομάχος μπορεί να _κρυφτεί_ κρατώντας το λεπίδι. Αυτή η ικανότητα επιτρέπει στην Ξιφομάχο να αναπηδήσει ακαριαία έως και 4 τετράγωνα μακριά και της δίνει _%d γύρους αορατότητας._
items.weapon.melee.dirk.upgrade_ability_stat_name=Διάρκεια ικανότητας
items.weapon.melee.dirk.desc=Ένα στιλέτο με λίγο παραπάνω ατσάλι, για βαθύτερα μπηξίματα στις σάρκες των εχθρών.

items.weapon.melee.flail.name=κόπανος
items.weapon.melee.flail.stats_desc=Αυτό το όπλο είναι κάπως ανακριβές.\nΤο όπλο δεν μπορεί να επιτεθεί αιφνιδιαστικά.
items.weapon.melee.flail.ability_name=στριφογυρισμα
items.weapon.melee.flail.spin_warn=Δεν μπορείς να στριφογυρίσεις άλλο τον κόπανο.
items.weapon.melee.flail.typical_ability_desc=Η Ξιφομάχος μπορεί να _στριφογυρίσει_ τον κόπανο για να αυξήσει την ισχύ του για λίγο. Κανονικά θα προκαλέσει _+%d ζημιά_ στην επόμενη κανονική επίθεση για κάθε γύρο περιστροφής (μέγιστοι 3 γύροι). Το χτύπημα είναι εγγυημένο όταν ο κόπανος στριφογυρίζει. Το ξεκίνημα του στριφογυρίσματος από μόνο του κοστίζει 1 φορτίο.
items.weapon.melee.flail.ability_desc=Η Ξιφομάχος μπορεί να _στριφογυρίσει_ τον κόπανο για να αυξήσει την ισχύ του για λίγο. Θα προκαλέσει _+%d ζημιά_ στην επόμενη κανονική επίθεση για κάθε γύρο περιστροφής (μέγιστοι 3 γύροι). Το χτύπημα είναι εγγυημένο όταν ο κόπανος στριφογυρίζει. Το ξεκίνημα του στριφογυρίσματος από μόνο του κοστίζει 1 φορτίο.
items.weapon.melee.flail.desc=Μία μπάλα με καρφιά που ενώνεται με αλυσίδα πάνω στη λαβή. Πολύ δύσχρηστο όπλο, αλλά καταστροφικό αν καταφέρει καλό χτύπημα.
items.weapon.melee.flail$spinabilitytracker.name=στριφογύρισμα
items.weapon.melee.flail$spinabilitytracker.desc=Η Ξιφομάχος στριφογυρίζει τον κόπανο και αυξάνει τη ζημιά της επόμενης κανονικής επίθεσης με αυτόν. Κάθε στριφογύρισμα απαιτεί έναν γύρο αλλά αυξάνει και τη ζημιά του, με μέγιστους τους 3 γύρους. Ο κόπανος θα χτυπήσει εγγυημένα όσο στριφογυρίζει.\n\nΣτριφογυρίσματα ως τώρα: %1$d%%. \nΓύροι που απομένουν: %2$s.

items.weapon.melee.gauntlet.name=πέτρινο γάντι
items.weapon.melee.gauntlet.stats_desc=Αυτό είναι ένα πολύ γρήγορο όπλο.
items.weapon.melee.gauntlet.ability_name=διαδοχικο χτυπημα
items.weapon.melee.gauntlet.typical_ability_desc=Η Ξιφομάχος μπορεί να εκτελέσει _διαδοχικό χτύπημα_ με το πέτρινο γάντι. Αυτή η επίθεση πετυχαίνει εγγυημένα και προκαλεί τυπικά _+%d ζημιά_ για κάθε φορά που η Ξιφομάχος είχε χτυπήσει με κανονική επίθεση με όπλο μάχης σώμα-με-σώμα ή όπλο ρίψης. Το να μην χτυπήσει για 5 γύρους μηδενίζει αυτή την διαδοχή.
items.weapon.melee.gauntlet.ability_desc=Η Ξιφομάχος μπορεί να εκτελέσει _διαδοχικό χτύπημα_ με το πέτρινο γάντι. Αυτή η επίθεση πετυχαίνει εγγυημένα και προκαλεί _+%d ζημιά_ για κάθε φορά που η Ξιφομάχος είχε χτυπήσει με κανονική επίθεση με όπλο μάχης σώμα-με-σώμα ή όπλο ρίψης. Το να μην χτυπήσει για 5 γύρους μηδενίζει αυτή την διαδοχή.
items.weapon.melee.gauntlet.desc=Αυτό το τεράστιο γάντι είναι φτιαγμένο από κόκκινο ύφασμα με ένα στρώμα βαριάς μαγικής πέτρας. Το ύφασμα στενεύει γύρω σου, κάνοντας τις παχιές πέτρινες πλάκες σαν δεύτερο δέρμα. Για να χρησιμοποιήσεις ένα τόσο βαρύ όπλο χρειάζεται δύναμη, αλλά προσθέτει τρομερή ισχύ στα χτυπήματά σου.

items.weapon.melee.glaive.name=λόγχη
items.weapon.melee.glaive.stats_desc=Αυτό το όπλο είναι κάπως αργό.\nΤο όπλο έχει μεγαλύτερη εμβέλεια.
items.weapon.melee.glaive.ability_name=καρφωμα
items.weapon.melee.glaive.typical_ability_desc=Η Ξιφομάχος μπορεί να χρησιμοποιήσει την αιχμή της λόγχης για να _καρφώσει_ έναν εχθρό εντός εμβέλειας, αλλά όχι δίπλα της. Αυτό κανονικά προκαλεί _%1$d-%2$d ζημιά,_ χτυπά εγγυημένα και πετάει τον εχθρό πίσω.
items.weapon.melee.glaive.ability_desc=Η Ξιφομάχος μπορεί να χρησιμοποιήσει την αιχμή της λόγχης για να _καρφώσει_ έναν εχθρό εντός εμβέλειας, αλλά όχι δίπλα της. Αυτό προκαλεί _%1$d-%2$d ζημιά,_ χτυπά εγγυημένα και πετάει τον εχθρό πίσω.
items.weapon.melee.glaive.desc=Ένα τεράστιο κοντάρι με μια λεπίδα ξίφους τοποθετημένη στην άκρη του.

items.weapon.melee.gloves.name=γάντια με καρφιά
items.weapon.melee.gloves.stats_desc=Αυτό είναι ένα πολύ γρήγορο όπλο.
items.weapon.melee.gloves.ability_name=διαδοχικο χτυπημα
items.weapon.melee.gloves.typical_ability_desc=Η Ξιφομάχος μπορεί να εκτελέσει _διαδοχικό χτύπημα_ με τα γάντια με καρφιά. Αυτή η επίθεση πετυχαίνει εγγυημένα και προκαλεί τυπικά _+%d ζημιά_ για κάθε φορά που η Ξιφομάχος είχε χτυπήσει με κανονική επίθεση με όπλο μάχης σώμα-με-σώμα ή όπλο ρίψης. Το να μην χτυπήσει για 5 γύρους μηδενίζει αυτή την διαδοχή.
items.weapon.melee.gloves.ability_desc=Η Ξιφομάχος μπορεί να εκτελέσει _διαδοχικό χτύπημα_ με τα γάντια με καρφιά. Αυτή η επίθεση πετυχαίνει εγγυημένα και προκαλεί  _+%d ζημιά_ για κάθε φορά που η Ξιφομάχος είχε χτυπήσει με κανονική επίθεση με όπλο μάχης σώμα-με-σώμα ή όπλο ρίψης. Το να μην χτυπήσει για 5 γύρους μηδενίζει αυτή την διαδοχή.
items.weapon.melee.gloves.desc=Αυτά τα γάντια με καρφιά δεν παρέχουν κάποια ουσιώδη προστασία. Λειτουργούν, όμως, ως ένα αξιοπρεπές όπλο και αφήνουν τα χέρια ελεύθερα.
items.weapon.melee.gloves.discover_hint=Ένας από τους ήρωες ξεκινά με αυτό το αντικείμενο.

items.weapon.melee.greataxe.name=πέλεκυς
items.weapon.melee.greataxe.stats_desc=Αυτό το όπλο είναι απίστευτα βαρύ.
items.weapon.melee.greataxe.ability_name=εκδικητικο χτυπημα
items.weapon.melee.greataxe.typical_ability_desc=Η Ξιφομάχος μπορεί να εκτελέσει ένα _εκδικητικό χτύπημα_ με τον πέλεκυ αν έχει κάτω από 50%% ζωή. Αυτή η ισοπεδωτική επίθεση χτυπά εγγυημένα, κανονικά προκαλεί _%1$d-%2$d ζημιά_ και εκτελείται ακαριαία εφόσον εξοντώσει τον εχθρό.
items.weapon.melee.greataxe.ability_desc=Η Ξιφομάχος μπορεί να εκτελέσει ένα _εκδικητικό χτύπημα_ με τον πέλεκυ αν έχει κάτω από 50%% ζωή. Αυτή η ισοπεδωτική επίθεση χτυπά εγγυημένα για _%1$d-%2$d ζημιά,_ και εκτελείται ακαριαία εφόσον εξοντώσει τον εχθρό.
items.weapon.melee.greataxe.desc=Προορισμένος να κρατιέται πάνω από τον ώμο· αυτός ο γιγαντιαίος πέλεκυς είναι τόσο ισχυρός όσο και βαρύς.

items.weapon.melee.greatshield.name=γιγάντια ασπίδα
items.weapon.melee.greatshield.typical_stats_desc=Κανονικά, αυτό το όπλο εμποδίζει 0-%d ζημιά. Η παρεμπόδιση αυξάνεται με αναβαθμίσεις.
items.weapon.melee.greatshield.stats_desc=Αυτό το όπλο εμποδίζει 0-%d ζημιά. Η παρεμπόδιση αυξάνεται με αναβαθμίσεις.
items.weapon.melee.greatshield.ability_name=φυλαξη
items.weapon.melee.greatshield.typical_ability_desc=Η Ξιφομάχος μπορεί να _φυλαχθεί_ με τη γιγάντια ασπίδα και να εκμηδενίσει όλες τις φυσικές ή μαγικές επιθέσεις εναντίον της, κανονικά για _%d γύρους._ Η φύλαξη θα τελειώσει αν η Ξιφομάχος επιτεθεί ή χρησιμοποιήσει μαγεία αφού αποκρούσει μια επίθεση.
items.weapon.melee.greatshield.ability_desc=Η Ξιφομάχος μπορεί να _φυλαχθεί_ με τη γιγάντια ασπίδα, εκμηδενίζοντας όλες τις φυσικές ή μαγικές επιθέσεις εναντίον της για _%d γύρους._ Η φύλαξη θα τελειώσει αν η Ξιφομάχος επιτεθεί ή χρησιμοποιήσει μαγεία αφού αποκρούσει μια επίθεση.
items.weapon.melee.greatshield.upgrade_ability_stat_name=Διάρκεια ικανότητας
items.weapon.melee.greatshield.desc=Περισσότερο κινητό τείχος παρά ασπίδα. Αυτή η γιγάντια μάζα μετάλλου βοηθά στην άμυνα, αλλά δεν αφήνει μεγάλο περιθώριο για επιθέσεις.

items.weapon.melee.greatsword.name=μεγαξίφος
items.weapon.melee.greatsword.ability_name=κοψια
items.weapon.melee.greatsword.typical_ability_desc=Η Ξιφομάχος μπορεί να κάνει _κοψιά_ σε έναν εχθρό με το μεγαξίφος. Αυτό κανονικά προκαλεί _%1$d-%2$d ζημιά_ και πετυχαίνει εγγυημένα. Εάν εξοντώσει τον εχθρό, η κοψιά γίνεται ακαριαία και μπορεί να χρησιμοποιηθεί ξανά από την Ξιφομάχο εντός 5 γύρων χωρίς κόστος.
items.weapon.melee.greatsword.ability_desc=Η Ξιφομάχος μπορεί να κάνει _κοψιά_ σε έναν εχθρό με το μεγαξίφος. Αυτό προκαλεί _%1$d-%2$d ζημιά_ και πετυχαίνει εγγυημένα. Εάν εξοντώσει τον εχθρό, η κοψιά γίνεται ακαριαία και μπορεί να χρησιμοποιηθεί ξανά από την Ξιφομάχο εντός 5 γύρων χωρίς κόστος.
items.weapon.melee.greatsword.desc=Αυτή η επιβλητική λεπίδα προκαλεί βαριά ζημιά, επενδύοντας το βάρος της σε κάθε χτύπημα.

items.weapon.melee.handaxe.name=τσεκούρι χειρός
items.weapon.melee.handaxe.stats_desc=Αυτό το όπλο είναι αρκετά ακριβές.
items.weapon.melee.handaxe.ability_name=βαρυ χτυπημα
items.weapon.melee.handaxe.typical_ability_desc=Η Ξιφομάχος μπορεί να εκτελέσει ένα _βαρύ χτύπημα_ με το τσεκούρι χειρός. Αυτή η συγκεντρωμένη επίθεση κανονικά προκαλεί _%1$d-%2$d ζημιά,_ αν ήταν αιφνίδια, και σαστίζει για 5 γύρους, κάτι που μειώνει την ακρίβεια και την αποφυγή κατά 50%%. Το βαρύ χτύπημα χτυπά εγγυημένα, αλλά προκαλεί κανονική ζημιά αν δεν αιφνιδιάσει τον εχθρό.
items.weapon.melee.handaxe.ability_desc=Η Ξιφομάχος μπορεί να εκτελέσει ένα _βαρύ χτύπημα_ με το τσεκούρι χειρός. Αυτή η συγκεντρωμένη επίθεση προκαλεί _%1$d-%2$d ζημιά,_ αν ήταν αιφνίδια, και σαστίζει για 5 γύρους, κάτι που μειώνει την ακρίβεια και την αποφυγή κατά 50%%. Το βαρύ χτύπημα χτυπά εγγυημένα, αλλά προκαλεί κανονική ζημιά αν δεν αιφνιδιάσει τον εχθρό.
items.weapon.melee.handaxe.desc=Ένα ελαφρύ τσεκούρι που συνήθως χρησιμοποιείται για κόψιμο δέντρων. Η πλατιά του λεπίδα λειτουργεί καλά και εναντίον εχθρών.

items.weapon.melee.katana.name=κατάνα
items.weapon.melee.katana.stats_desc=Αυτό το όπλο εμποδίζει 0-3 πόντους ζημιάς.
items.weapon.melee.katana.ability_name=λογχισμα
items.weapon.melee.katana.typical_ability_desc=Η Ξιφομάχος μπορεί να _λογχίσει_ έναν εχθρό με το κατάνα από 1 τετράγωνο μακριά. Μετακινείται προς τον εχθρό και χτυπά εγγυημένα προκαλώντας κανονικά _%1$d-%2$d ζημιά._
items.weapon.melee.katana.ability_desc=Η Ξιφομάχος μπορεί να _λογχίσει_ έναν εχθρό με το κατάνα από 1 τετράγωνο μακριά. Μετακινείται προς τον εχθρό και χτυπά εγγυημένα προκαλώντας _%1$d-%2$d ζημιά._
items.weapon.melee.katana.desc=Ένα λεπτό σπαθί με προστατευτικό μέταλλο πάνω από τη λαβή.

items.weapon.melee.longsword.name=μακροξίφος
items.weapon.melee.longsword.ability_name=κοψια
items.weapon.melee.longsword.typical_ability_desc=Η Ξιφομάχος μπορεί να κάνει _κοψιά_ σε έναν εχθρό με το μακροξίφος. Αυτό κανονικά προκαλεί _%1$d-%2$d ζημιά_ και πετυχαίνει εγγυημένα. Εάν εξοντώσει τον εχθρό, η κοψιά γίνεται ακαριαία και μπορεί να χρησιμοποιηθεί ξανά από την Ξιφομάχο εντός 5 γύρων χωρίς κόστος.
items.weapon.melee.longsword.ability_desc=Η Ξιφομάχος μπορεί να κάνει _κοψιά_ σε έναν εχθρό με το μακροξίφος. Αυτό προκαλεί _%1$d-%2$d ζημιά_ και πετυχαίνει εγγυημένα. Εάν εξοντώσει τον εχθρό, η κοψιά γίνεται ακαριαία και μπορεί να χρησιμοποιηθεί ξανά από την Ξιφομάχο εντός 5 γύρων χωρίς κόστος.
items.weapon.melee.longsword.desc=Η μακριά και κοφτερή ατσάλινη λεπίδα του σπαθιού λάμπει καθησυχαστικά, αν και το μέγεθός της το κάνει αρκετά βαρύ.

items.weapon.melee.mace.name=κεφαλοθραύστης
items.weapon.melee.mace.stats_desc=Αυτό το όπλο είναι αρκετά ακριβές.
items.weapon.melee.mace.ability_name=βαρυ χτυπημα
items.weapon.melee.mace.typical_ability_desc=Η Ξιφομάχος μπορεί να εκτελέσει ένα _βαρύ χτύπημα_ με τον κεφαλοθραύστη. Αυτή η συγκεντρωμένη επίθεση κανονικά προκαλεί _%1$d-%2$d ζημιά,_ αν ήταν αιφνίδια, και σαστίζει για 5 γύρους, κάτι που μειώνει την ακρίβεια και την αποφυγή κατά 50%%. Το βαρύ χτύπημα χτυπά εγγυημένα, αλλά προκαλεί κανονική ζημιά αν δεν αιφνιδιάσει τον εχθρό.
items.weapon.melee.mace.ability_desc=Η Ξιφομάχος μπορεί να εκτελέσει ένα _βαρύ χτύπημα_ με τον κεφαλοθραύστη. Αυτή η συγκεντρωμένη επίθεση προκαλεί _%1$d-%2$d ζημιά,_ αν ήταν αιφνίδια, και σαστίζει για 5 γύρους, κάτι που μειώνει την ακρίβεια και την αποφυγή κατά 50%%. Το βαρύ χτύπημα χτυπά εγγυημένα, αλλά προκαλεί κανονική ζημιά αν δεν αιφνιδιάσει τον εχθρό.
items.weapon.melee.mace.desc=Η μεγάλη σιδερένια κεφαλή αυτού του όπλου προκαλεί ουσιώδη ζημιά.

items.weapon.melee.magesstaff.name=ράβδος μάγου
items.weapon.melee.magesstaff.ac_imbue=ΕΜΠΟΤΙΣΕ
items.weapon.melee.magesstaff.ac_zap=ΕΞΑΠΟΛΥΣΕ
items.weapon.melee.magesstaff.prompt=Επίλεξε ένα ραβδί
items.weapon.melee.magesstaff.imbue=Εμποτίζεις τη ράβδο σου με το %s.
items.weapon.melee.magesstaff.preserved=Το προηγούμενο ραβδί διατηρήθηκε!
items.weapon.melee.magesstaff.imbue_desc=Θέλεις σίγουρα να εμποτίσεις το κοντάρι σου με αυτό το ραβδί;\n\nΑν το ραβδί έχει το ίδιο ή υψηλότερο επίπεδο από το κοντάρι, το κοντάρι θα αποκτήσει το επίπεδο του ραβδιού συν ένα επίπεδο από τις δικές του αναβαθμίσεις.
items.weapon.melee.magesstaff.imbue_level=Ο εμποτισμός θα έχει ως αποτέλεσμα ένα _κοντάρι επιπέδου +%d._
items.weapon.melee.magesstaff.imbue_unknown=Δε γνωρίζεις το επίπεδο αυτού του ραβδιού, αλλά αυτός ο εμποτισμός θα έχει ως αποτέλεσμα ένα _κοντάρι τουλάχιστον επιπέδου +%d_.
items.weapon.melee.magesstaff.imbue_cursed=_Εάν εμποτίσεις το κοντάρι σου με ένα καταραμένο ραβδί, τότε και το κοντάρι θα γίνει καταραμένο!_
items.weapon.melee.magesstaff.imbue_lost=Το ραβδί που είναι εμποτισμένο στη ράβδο σου _θα χαθεί._
items.weapon.melee.magesstaff.imbue_talent=Το ραβδί που είναι εμποτισμένο στη ράβδο σου _θα επιστρέψει στο +0._
items.weapon.melee.magesstaff.yes=Ναι, σίγουρα
items.weapon.melee.magesstaff.no=Όχι, άλλαξα γνώμη
items.weapon.melee.magesstaff.desc=Κατασκευασμένη από τον ίδιο τον Μάγο. Αυτή η ράβδος είναι ένα μοναδικό μαγικό όπλο που μπορεί να εμποτιστεί με ραβδί.
items.weapon.melee.magesstaff.no_wand=Η ράβδος δεν κατέχει κάποια μαγεία αυτή τη στιγμή. Πρέπει να _εμποτιστεί με τη δύναμη ενός ραβδιού_ για να μπορεί να εξαπολύει ξόρκια.
items.weapon.melee.magesstaff.has_wand=Η ράβδος είναι εμποτισμένη με ένα _%s._
items.weapon.melee.magesstaff.cursed_wand=Αυτή η ράβδος είναι καταραμένη, έτσι η μαγεία της είναι χαοτική και τυχαία.
items.weapon.melee.magesstaff.discover_hint=Ένας από τους ήρωες ξεκινά με αυτό το αντικείμενο.

items.weapon.melee.meleeweapon.ac_ability=ΙΚΑΝΟΤΗΤΑ
items.weapon.melee.meleeweapon.stats_known=Αυτό το όπλο _%1$dης βαθμίδας_ προκαλεί _%2$d-%3$d ζημιά_ στη μάχη σώμα-με-σώμα και απαιτεί _%4$d δύναμη_ για να χρησιμοποιηθεί σωστά.
items.weapon.melee.meleeweapon.stats_unknown=Κανονικά, αυτό το όπλο _%1$dης βαθμίδας_ προκαλεί _%2$d-%3$d ζημιά_ στη μάχη σώμα-με-σώμα και απαιτεί _%4$d δύναμη_ για να χρησιμοποιηθεί σωστά.
items.weapon.melee.meleeweapon.probably_too_heavy=Πιθανώς αυτό το όπλο να είναι πολύ βαρύ για σένα.
items.weapon.melee.meleeweapon.stats_desc=
items.weapon.melee.meleeweapon.ability_need_equip=Πρέπει να εξοπλίσεις το όπλο για να χρησιμοποιήσεις την ικανότητά του.
items.weapon.melee.meleeweapon.ability_low_str=Δεν έχεις αρκετή δύναμη για να χρησιμοποιήσεις την ικανότητα.
items.weapon.melee.meleeweapon.ability_no_charge=Δεν έχεις αρκετή ενέργεια για να χρησιμοποιήσεις την ικανότητα.
items.weapon.melee.meleeweapon.ability_cant_use=Δεν μπορείς να χρησιμοποιήσεις την ικανότητα προς το παρόν.
items.weapon.melee.meleeweapon.ability_no_target=Δεν υπάρχει στόχος εκεί.
items.weapon.melee.meleeweapon.ability_target_range=Ο στόχος είναι εκτός εμβέλειας.
items.weapon.melee.meleeweapon.ability_occupied=Αυτή η θέση είναι κατειλημμένη.
items.weapon.melee.meleeweapon.upgrade_ability_stat_name=Ζημιά ικανότητας
items.weapon.melee.meleeweapon.prompt=Επίλεξε έναν στόχο
items.weapon.melee.meleeweapon.swap=Εναλλαγή όπλων
items.weapon.melee.meleeweapon.swap_full=Δεν έχεις ελεύθερο αποθηκευτικό χώρο για να το κάνεις αυτό.


items.weapon.melee.shortsword.name=ξίφος
items.weapon.melee.shortsword.ability_name=κοψια
items.weapon.melee.shortsword.typical_ability_desc=Η Ξιφομάχος μπορεί να κάνει _κοψιά_ σε έναν εχθρό με το ξίφος. Αυτό κανονικά προκαλεί _%1$d-%2$d ζημιά_ και πετυχαίνει εγγυημένα. Εάν εξοντώσει τον εχθρό, η κοψιά γίνεται ακαριαία και μπορεί να χρησιμοποιηθεί ξανά από την Ξιφομάχο εντός 5 γύρων χωρίς κόστος.
items.weapon.melee.shortsword.ability_desc=Η Ξιφομάχος μπορεί να κάνει _κοψιά_ σε έναν εχθρό με το ξίφος. Αυτό προκαλεί _%1$d-%2$d ζημιά_ και πετυχαίνει εγγυημένα. Εάν εξοντώσει τον εχθρό, η κοψιά γίνεται ακαριαία και μπορεί να χρησιμοποιηθεί ξανά από την Ξιφομάχο εντός 5 γύρων χωρίς κόστος.
items.weapon.melee.shortsword.desc=Ένα ιδιαίτερα κοντό σπαθί· λίγα μόλις εκατοστά μακρύτερο από το στιλέτο.

items.weapon.melee.quarterstaff.name=σιδηροκόνταρο
items.weapon.melee.quarterstaff.stats_desc=Αυτό το όπλο εμποδίζει 0-2 πόντους ζημιάς.
items.weapon.melee.quarterstaff.ability_name=αμυντικη σταση
items.weapon.melee.quarterstaff.typical_ability_desc=Η Ξιφομάχος μπορεί να πάρει μια _αμυντική στάση_ με το σιδηροκόνταρο. Αυτή η στάση δεν απαιτεί κανέναν γύρο για να ενεργοποιηθεί και τριπλασιάζει την αποφυγή της, κανονικά για _%d γύρους._
items.weapon.melee.quarterstaff.ability_desc=Η Ξιφομάχος μπορεί να πάρει μια _αμυντική στάση_ με το σιδηροκόνταρο. Αυτή η στάση δεν απαιτεί κανέναν γύρο για να ενεργοποιηθεί και τριπλασιάζει την αποφυγή της για _%d γύρους._
items.weapon.melee.quarterstaff.upgrade_ability_stat_name=Διάρκεια ικανότητας
items.weapon.melee.quarterstaff.desc=Ένα κοντάρι από σκληρό ξύλο. Οι άκρες του είναι καλυμμένες με σίδερο.
items.weapon.melee.quarterstaff$defensivestance.name=αμυντική στάση
items.weapon.melee.quarterstaff$defensivestance.desc=Η Ξιφομάχος χρησιμοποιεί το σιδηροκόνταρο για να αποκρούει τα εισερχόμενα χτυπήματα και βλήματα. Όσο βρίσκεται σε αυτή τη στάση, τριπλασιάζεται η αποφυγή της ενάντια σε όλες τις επιθέσεις.\n\nΓύροι που απομένουν: %s.

items.weapon.melee.rapier.name=ξιφίδιο
items.weapon.melee.rapier.stats_desc=Αυτό το όπλο εμποδίζει 0-1 πόντους ζημιάς.
items.weapon.melee.rapier.ability_name=λογχισμα
items.weapon.melee.rapier.typical_ability_desc=Η Ξιφομάχος μπορεί να _λογχίσει_ έναν εχθρό με το ξιφίδιο από 1 τετράγωνο μακριά. Μετακινείται προς τον εχθρό και χτυπά εγγυημένα προκαλώντας κανονικά _%1$d-%2$d ζημιά._
items.weapon.melee.rapier.ability_desc=Η Ξιφομάχος μπορεί να _λογχίσει_ έναν εχθρό με το ξιφίδιο από 1 τετράγωνο μακριά. Μετακινείται προς τον εχθρό και χτυπά εγγυημένα προκαλώντας _%1$d-%2$d ζημιά._
items.weapon.melee.rapier.desc=Ένα λεπτοκαμωμένο ξίφος που προσφέρει κάποια προστασία με αντίτιμο τη μικρή του κοπτική δύναμη.
items.weapon.melee.rapier.discover_hint=Ένας από τους ήρωες ξεκινά με αυτό το αντικείμενο.

items.weapon.melee.roundshield.name=στρογγυλή ασπίδα
items.weapon.melee.roundshield.typical_stats_desc=Κανονικά, αυτό το όπλο εμποδίζει 0-%d ζημιά. Η παρεμπόδιση αυξάνεται με αναβαθμίσεις.
items.weapon.melee.roundshield.stats_desc=Αυτό το όπλο εμποδίζει 0-%d ζημιά. Η παρεμπόδιση αυξάνεται με αναβαθμίσεις.
items.weapon.melee.roundshield.ability_name=φυλαξη
items.weapon.melee.roundshield.typical_ability_desc=Η Ξιφομάχος μπορεί να _φυλαχθεί_ με τη στρογγυλή ασπίδα και να εκμηδενίσει όλες τις φυσικές ή μαγικές επιθέσεις εναντίον της, κανονικά για _%d γύρους._ Η φύλαξη θα τελειώσει αν η Ξιφομάχος επιτεθεί ή χρησιμοποιήσει μαγεία αφού αποκρούσει μια επίθεση.
items.weapon.melee.roundshield.ability_desc=Η Ξιφομάχος μπορεί να _φυλαχθεί_ με τη στρογγυλή ασπίδα, εκμηδενίζοντας όλες τις φυσικές ή μαγικές επιθέσεις εναντίον της για _%d γύρους._ Η φύλαξη θα τελειώσει αν η Ξιφομάχος επιτεθεί ή χρησιμοποιήσει μαγεία αφού αποκρούσει μια επίθεση.
items.weapon.melee.roundshield.upgrade_ability_stat_name=Διάρκεια ικανότητας
items.weapon.melee.roundshield.desc=Αυτή η ασπίδα αποκρούει αποτελεσματικά τις επιθέσεις και, στην ανάγκη, γίνεται ένα αξιοπρεπές όπλο.
items.weapon.melee.roundshield$guardtracker.name=φύλαξη
items.weapon.melee.roundshield$guardtracker.guarded=φύλαξη
items.weapon.melee.roundshield$guardtracker.desc=Η Ξιφομάχος έχει προτάξει την ασπίδα της αναμένοντας τις επερχόμενες επιθέσεις. Οι φυσιολογικές και οι μαγικές επιθέσεις εναντίον της εκμηδενίζονται.\n\nΓύροι που απομένουν: %s.

items.weapon.melee.runicblade.name=ρουνικό σπαθί
items.weapon.melee.runicblade.stats_desc=Αυτό το όπλο ωφελείται περισσότερο από τις αναβαθμίσεις.
items.weapon.melee.runicblade.ability_name=ρουνικο χτυπημα
items.weapon.melee.runicblade.typical_ability_desc=Η Ξιφομάχος μπορεί να εκτελέσει ένα _ρουνικό χτύπημα_ με το ρουνικό σπαθί. Αυτή η επίθεση χτυπά εγγυημένα και κανονικά αυξάνει την ισχύ της μαγικής ενίσχυσης κατά _%d%%._
items.weapon.melee.runicblade.ability_desc=Η Ξιφομάχος μπορεί να εκτελέσει ένα _ρουνικό χτύπημα_ με το ρουνικό σπαθί. Αυτή η επίθεση χτυπά εγγυημένα και αυξάνει την ισχύ της μαγικής ενίσχυσης κατά _%d%%._
items.weapon.melee.runicblade.upgrade_ability_stat_name=Ισχύς ικανότητας
items.weapon.melee.runicblade.desc=Ένα μυστηριώδες όπλο με λαμπερή μπλε λεπίδα, από κάποια μακρινή γη.

items.weapon.melee.sai.name=σάι
items.weapon.melee.sai.stats_desc=Αυτό είναι ένα πολύ γρήγορο όπλο.
items.weapon.melee.sai.ability_name=διαδοχικο χτυπημα
items.weapon.melee.sai.typical_ability_desc=Η Ξιφομάχος μπορεί να εκτελέσει _διαδοχικό χτύπημα_ με το σάι. Αυτή η επίθεση πετυχαίνει εγγυημένα και προκαλεί τυπικά _+%d ζημιά_ για κάθε φορά που η Ξιφομάχος είχε χτυπήσει με κανονική επίθεση με όπλο μάχης σώμα-με-σώμα ή όπλο ρίψης. Το να μην χτυπήσει για 5 γύρους μηδενίζει αυτή την διαδοχή.
items.weapon.melee.sai.ability_desc=Η Ξιφομάχος μπορεί να εκτελέσει _διαδοχικό χτύπημα_ με το σάι. Αυτή η επίθεση πετυχαίνει εγγυημένα και προκαλεί _+%d ζημιά_ για κάθε φορά που η Ξιφομάχος είχε χτυπήσει με κανονική επίθεση με όπλο μάχης σώμα-με-σώμα ή όπλο ρίψης. Το να μην χτυπήσει για 5 γύρους μηδενίζει αυτή την διαδοχή.
items.weapon.melee.sai.desc=Δυο λεπτά λεπίδια, προορισμένα να κρατιούνται σε ένα χέρι το καθένα. Άψογα για την καταστροφή εχθρών με καταιγισμό κοψιμάτων.
items.weapon.melee.sai$combostriketracker.name=διαδοχικό χτύπημα
items.weapon.melee.sai$combostriketracker.desc=Η Ξιφομάχος δημιουργεί μια διαδοχή χτυπημάτων, η οποία αυξάνει τη ζημιά της οπλικής ικανότητας «διαδοχικό χτύπημα». Μετράει κάθε επιτυχημένη επίθεση με όπλο μάχης σώμα-με-σώμα ή ρίψης, αλλά η διαδοχή μηδενίζεται αν δεν επιτεθεί εντός 5 γύρων.\n\nΠρόσφατα χτυπήματα: %1$d.\n\nΓύροι έως ότου χαθεί η διαδοχή: %2$s.

items.weapon.melee.scimitar.name=γιαταγάνι
items.weapon.melee.scimitar.stats_desc=Αυτό το όπλο είναι αρκετά γρήγορο.
items.weapon.melee.scimitar.ability_name=χορος του σπαθιου
items.weapon.melee.scimitar.typical_ability_desc=Η Ξιφομάχος μπορεί να εκτελέσει τον _χορό του σπαθιού_ με το γιαταγάνι. Αυτό δεν απαιτεί κανέναν γύρο για να ενεργοποιηθεί και δίνει στην Ξιφομάχο +60%% ταχύτητα επίθεσης και +50%% ακρίβεια, κανονικά για _%d γύρους._
items.weapon.melee.scimitar.ability_desc=Η Ξιφομάχος μπορεί να εκτελέσει τον _χορό του σπαθιού_ με το γιαταγάνι. Αυτό δεν απαιτεί κανέναν γύρο για να ενεργοποιηθεί, και δίνει στην Ξιφομάχο +60%% ταχύτητα επίθεσης και +50%% ακρίβεια για _%d γύρους._
items.weapon.melee.scimitar.upgrade_ability_stat_name=Διάρκεια ικανότητας
items.weapon.melee.scimitar.desc=Ένα σπαθί με πλατιά και κυρτή λεπίδα. Χάρη στο σχήμα του προκαλεί ταχύτερες –αλλά και λιγότερο ισχυρές– επιθέσεις.
items.weapon.melee.scimitar$sworddance.name=χορός του σπαθιού
items.weapon.melee.scimitar$sworddance.desc=Η Ξιφομάχος εκτελεί γρήγορα χτυπήματα κινούμενη σε ένα είδος χορού. Για όσο διαρκεί αυτός ο χορός, επιτίθεται 60%% γρηγορότερα (ακριβώς όσο χρειάζεται για να επιτεθεί 2 φορές σε έναν γύρο με γιαταγάνι) και έχει +50%% ακρίβεια.\n\nΓύροι που απομένουν: %s.

items.weapon.melee.sickle.name=δρεπάνι χειρός
items.weapon.melee.sickle.stats_desc=Αυτό το όπλο είναι κάπως ανακριβές.
items.weapon.melee.sickle.ability_name=θερισμα
items.weapon.melee.sickle.typical_ability_desc=Η Ξιφομάχος μπορεί να _θερίσει_ έναν εχθρό με το δρεπάνι χειρός. Αυτή η καταστροφική επίθεση χτυπά εγγυημένα και προκαλεί αιμορραγία, κανονικά ίση με _%d ζημιά._ Αν ο στόχος δεν δύναται να αιμορραγήσει, η ζημιά εφαρμόζεται απευθείας.
items.weapon.melee.sickle.ability_desc=Η Ξιφομάχος μπορεί να _θερίσει_ έναν εχθρό με το δρεπάνι χειρός. Αυτή η καταστροφική επίθεση χτυπά εγγυημένα και προκαλεί αιμορραγία ίση με _%d ζημιά._ Αν ο στόχος δεν δύναται να αιμορραγήσει, η ζημιά εφαρμόζεται απευθείας.
items.weapon.melee.sickle.desc=Γεωργικό εργαλείο χειρός που λειτουργεί και ως ένα ισχυρό αλλά δύσχρηστο όπλο.

items.weapon.melee.spear.name=δόρυ
items.weapon.melee.spear.stats_desc=Αυτό το όπλο είναι κάπως αργό.\nΤο όπλο έχει μεγαλύτερη έκταση χτυπήματος.
items.weapon.melee.spear.ability_name=καρφωμα
items.weapon.melee.spear.typical_ability_desc=Η Ξιφομάχος μπορεί να χρησιμοποιήσει την αιχμή του δόρατος για να _καρφώσει_ έναν εχθρό εντός εμβέλειας, αλλά όχι δίπλα της. Αυτό κανονικά προκαλεί _%1$d-%2$d ζημιά,_ χτυπά εγγυημένα και πετάει τον εχθρό πίσω.
items.weapon.melee.spear.ability_desc=Η Ξιφομάχος μπορεί να χρησιμοποιήσει την αιχμή του δόρατος για να _καρφώσει_ έναν εχθρό εντός εμβέλειας, αλλά όχι δίπλα της. Αυτό προκαλεί _%1$d-%2$d ζημιά,_ χτυπά εγγυημένα και πετάει τον εχθρό πίσω.
items.weapon.melee.spear.desc=Μία λεπτή, ξύλινη ράβδος με σιδερένια αιχμή.

items.weapon.melee.sword.name=σπαθί
items.weapon.melee.sword.ability_name=κοψια
items.weapon.melee.sword.typical_ability_desc=Η Ξιφομάχος μπορεί να κάνει _κοψιά_ σε έναν εχθρό με το σπαθί. Αυτό κανονικά προκαλεί _%1$d-%2$d ζημιά_ και πετυχαίνει εγγυημένα. Εάν εξοντώσει τον εχθρό, η κοψιά γίνεται ακαριαία και μπορεί να χρησιμοποιηθεί ξανά από την Ξιφομάχο εντός 5 γύρων χωρίς κόστος.
items.weapon.melee.sword.ability_desc=Η Ξιφομάχος μπορεί να κάνει _κοψιά_ σε έναν εχθρό με το σπαθί. Αυτό προκαλεί _%1$d-%2$d ζημιά_ και χτυπά εγγυημένα. Εάν εξοντώσει τον εχθρό, η κοψιά γίνεται ακαριαία και μπορεί να χρησιμοποιηθεί ξανά από την Ξιφομάχο εντός 5 γύρων χωρίς κόστος.
items.weapon.melee.sword.desc=Ένα καλά ισορροπημένο όπλο. Όχι πολύ μεγάλο, αλλά αρκετά μακρύτερο από το ξίφος.
items.weapon.melee.sword$cleavetracker.name=κοψιά
items.weapon.melee.sword$cleavetracker.desc=Η Ξιφομάχος είναι έτοιμη να εκτελέσει ξανά κοψιά. Η επόμενη χρήση της κοψιάς δεν θα δαπανήσει καθόλου οπλικό φορτίο.\n\nΓύροι που απομένουν: %s.

items.weapon.melee.warhammer.name=πολεμική σφύρα
items.weapon.melee.warhammer.stats_desc=Αυτό το όπλο είναι αρκετά ακριβές.
items.weapon.melee.warhammer.ability_name=βαρυ χτυπημα
items.weapon.melee.warhammer.typical_ability_desc=Η Ξιφομάχος μπορεί να εκτελέσει ένα _βαρύ χτύπημα_ με την πολεμική σφύρα. Αυτή η συγκεντρωμένη επίθεση κανονικά προκαλεί _%1$d-%2$d ζημιά,_ αν ήταν αιφνίδια, και σαστίζει για 5 γύρους, κάτι που μειώνει την ακρίβεια και την αποφυγή κατά 50%%. Το βαρύ χτύπημα χτυπά εγγυημένα, αλλά προκαλεί κανονική ζημιά αν δεν αιφνιδιάσει τον εχθρό.
items.weapon.melee.warhammer.ability_desc=Η Ξιφομάχος μπορεί να εκτελέσει ένα _βαρύ χτύπημα_ με την πολεμική σφύρα. Αυτή η συγκεντρωμένη επίθεση προκαλεί _%1$d-%2$d ζημιά,_ αν ήταν αιφνίδια, και σαστίζει για 5 γύρους, κάτι που μειώνει την ακρίβεια και την αποφυγή κατά 50%%. Το βαρύ χτύπημα χτυπά εγγυημένα, αλλά προκαλεί κανονική ζημιά αν δεν αιφνιδιάσει τον εχθρό.
items.weapon.melee.warhammer.desc=Λίγα πλάσματα μπορούν να αντέξουν το συντριπτικό χτύπημα αυτής της τεράστιας μάζας ατσαλιού και μολύβδου. Χρειάζεται, όμως, μεγάλη δύναμη για να χρησιμοποιηθεί αποτελεσματικά.

items.weapon.melee.warscythe.name=πολεμικό δρεπάνι
items.weapon.melee.warscythe.stats_desc=Αυτό το όπλο είναι κάπως ανακριβές.
items.weapon.melee.warscythe.ability_name=θερισμα
items.weapon.melee.warscythe.typical_ability_desc=Η Ξιφομάχος μπορεί να _θερίσει_ έναν εχθρό με το πολεμικό δρεπάνι. Αυτή η καταστροφική επίθεση χτυπά εγγυημένα και προκαλεί αιμορραγία, κανονικά ίση με _%d ζημιά._ Αν ο στόχος δεν δύναται να αιμορραγήσει, η ζημιά εφαρμόζεται απευθείας.
items.weapon.melee.warscythe.ability_desc=Η Ξιφομάχος μπορεί να _θερίσει_ έναν εχθρό με το πολεμικό δρεπάνι. Αυτή η καταστροφική επίθεση χτυπά εγγυημένα και προκαλεί αιμορραγία ίση με _%d ζημιά._ Αν ο στόχος δεν δύναται να αιμορραγήσει, η ζημιά εφαρμόζεται απευθείας.
items.weapon.melee.warscythe.desc=Αυτό το μεγάλο και κάπως δύσχρηστο εργαλείο έχει τροποποιηθεί ώστε να θερίζει ψυχές αντί για σοδειές.

items.weapon.melee.whip.name=μαστίγιο
items.weapon.melee.whip.stats_desc=Αυτό το όπλο έχει τεράστια εμβέλεια.
items.weapon.melee.whip.ability_name=μαστιγωμα
items.weapon.melee.whip.typical_ability_desc=Η Ξιφομάχος μπορεί να _μαστιγώσει_ όλους τους εχθρούς γύρω της με το μαστίγιο. Αυτή η ικανότητα χτυπά εγγυημένα και κανονικά προκαλεί _%1$d-%2$d ζημιά_ σε όλους τους εχθρούς εντός εμβέλειας επίθεσης.
items.weapon.melee.whip.ability_desc=Η Ξιφομάχος μπορεί να _μαστιγώσει_ όλους τους εχθρούς γύρω της με το μαστίγιο. Αυτή η ικανότητα χτυπά εγγυημένα και προκαλεί _%1$d-%2$d ζημιά_ σε όλους τους εχθρούς εντός εμβέλειας επίθεσης.
items.weapon.melee.whip.desc=Ενώ το αγκυλωτό κομμάτι σχοινιού στην άκρη του όπλου προκαλεί ελάχιστη ζημιά, η έκτασή του είναι ασυναγώνιστη.

items.weapon.melee.wornshortsword.name=φθαρμένο ξίφος
items.weapon.melee.wornshortsword.ability_name=κοψια
items.weapon.melee.wornshortsword.typical_ability_desc=Η Ξιφομάχος μπορεί να κάνει _κοψιά_ σε έναν εχθρό με το φθαρμένο ξίφος. Αυτό κανονικά προκαλεί _%1$d-%2$d ζημιά_ και πετυχαίνει εγγυημένα. Εάν εξοντώσει τον εχθρό, η κοψιά γίνεται ακαριαία και μπορεί να χρησιμοποιηθεί ξανά από την Ξιφομάχο εντός 5 γύρων χωρίς κόστος.
items.weapon.melee.wornshortsword.ability_desc=Η Ξιφομάχος μπορεί να κάνει _κοψιά_ σε έναν εχθρό με το φθαρμένο ξίφος. Αυτό προκαλεί _%1$d-%2$d ζημιά_ και πετυχαίνει εγγυημένα. Εάν εξοντώσει τον εχθρό, η κοψιά γίνεται ακαριαία και μπορεί να χρησιμοποιηθεί ξανά από την Ξιφομάχο εντός 5 γύρων χωρίς κόστος.
items.weapon.melee.wornshortsword.desc=Ένα αρκετά κοντό σπαθί που έχει φθαρεί από την πολλή χρήση. Είναι πιο αδύναμο –αλλά και λίγο ελαφρύτερο– από ένα ξίφος σε καλή κατάσταση.
items.weapon.melee.wornshortsword.discover_hint=Ένας από τους ήρωες ξεκινά με αυτό το αντικείμενο.


###missile weapons
items.weapon.missiles.darts.adrenalinedart.name=βέλος αδρεναλίνης
items.weapon.missiles.darts.adrenalinedart.desc=Αυτά τα βέλη είναι εμποτισμένα με μια χημική ένωση βασισμένη στο αστραποβότανο. Αυξάνουν την ταχύτητα κίνησης κι επίθεσης των συμμάχων, ενώ μειώνουν για λίγο την ταχύτητα κίνησης των εχθρών. Το ίδιο το βέλος παραμένει επιβλαβές για τους εχθρούς, αλλά δεν βλάπτει τους συμμάχους.

items.weapon.missiles.darts.blindingdart.name=εκτυφλωτικό βέλος
items.weapon.missiles.darts.blindingdart.desc=Αυτά τα βέλη είναι εμποτισμένα με μια χημική ένωση βασισμένη στο τυφλόχορτο, η οποία τυφλώνει τον στόχο για ένα μικρό χρονικό διάστημα. Δεν τον αποπροσανατολίζει, όμως· θα θυμάται τη θέση που σε είδε τελευταία.

items.weapon.missiles.darts.chillingdart.name=ψυχρό βέλος
items.weapon.missiles.darts.chillingdart.desc=Αυτά τα βέλη είναι εμποτισμένα με μια χημική ένωση βασισμένη στο παγολούλουδο, η οποία ψύχει σημαντικά τον στόχο.

items.weapon.missiles.darts.cleansingdart.name=εξαγνιστικό βέλος
items.weapon.missiles.darts.cleansingdart.desc=Αυτά τα βέλη είναι εμποτισμένα με μια ένωση βασισμένη στον μαγοβασιλικό. Καθιστούν τους συμμάχους προσωρινά άτρωτους από όλες τις αρνητικές επιδράσεις και εξαλείφουν τις θετικές επιδράσεις από τους εχθρούς. Οι εχθροί μπορεί ακόμη και να ξεχάσουν για λίγο ότι σου επιτίθονταν ή ότι το έσκαγαν από σένα. Το ίδιο το βέλος παραμένει επιβλαβές για τους εχθρούς, αλλά δεν βλάπτει τους συμμάχους.

items.weapon.missiles.darts.dart.name=βέλος
items.weapon.missiles.darts.dart.ac_tip=ΕΜΠΟΤΙΣΕ
items.weapon.missiles.darts.dart.prompt=Επίλεξε έναν σπόρο
items.weapon.missiles.darts.dart.tip_title=Εμπότισε τα βέλη
items.weapon.missiles.darts.dart.tip_desc=Ένας σπόρος μπορεί να συνδυαστεί με ένα ή δύο βέλη για να τα εμποτίσει. Κάθε τύπος σπόρου παράγει τον δικό του τύπο εμποτισμένου βέλους, δίνοντάς του μια μοναδική επίδραση μίας χρήσης.\n\nΟ εμποτισμός με αυτόν τον σπόρο θα παράξει ένα _%s._
items.weapon.missiles.darts.dart.tip_all=Εμπότισε %1$d βέλη με %2$d σπόρους
items.weapon.missiles.darts.dart.tip_two=Εμπότισε 2 βέλη με 1 σπόρο
items.weapon.missiles.darts.dart.tip_one=Εμπότισε 1 βέλος με 1 σπόρο
items.weapon.missiles.darts.dart.tip_cancel=Ακύρωση
items.weapon.missiles.darts.dart.desc=Αυτά τα ξύλινα βέλη έχουν σιδερένιες αιχμές κι εξαπολύονται απευθείας στον στόχο με ένα τίναγμα του καρπού. Μπορούν να εμποτιστούν με σπόρους για να ενεργοποιούν επιπλέον επιδράσεις αφού πεταχτούν.
items.weapon.missiles.darts.dart.unlimited_uses=Χάρη στην απλή κατασκευή τους, τα βέλη διαρκούν ουσιαστικά για πάντα.

items.weapon.missiles.darts.displacingdart.name=εκτοπιστικό βέλος
items.weapon.missiles.darts.displacingdart.desc=Αυτά τα βέλη είναι εμποτισμένα με μια χημική ένωση βασισμένη στο αχνόφυλλο, η οποία τηλεμεταφέρει τον στόχο σε μια μικρή απόσταση.

items.weapon.missiles.darts.healingdart.name=θεραπευτικό βέλος
items.weapon.missiles.darts.healingdart.desc=Αυτά τα βέλη είναι εμποτισμένα με μια χημική ένωση βασισμένη στο ηλιόχορτο, η οποία προσφέρει ένα κύμα ίασης στον στόχο. Το ίδιο το βέλος παραμένει επιβλαβές για τους εχθρούς, αλλά δεν βλάπτει τους συμμάχους.

items.weapon.missiles.darts.holydart.name=ιερό βέλος
items.weapon.missiles.darts.holydart.desc=Αυτά τα βέλη είναι εμποτισμένα με μια χημική ένωση βασισμένη στο αστρολούλουδο, η οποία εμφυσεί μια ιερή ενέργεια στον στόχο. Οι σύμμαχοι και οι κανονικοί εχθροί θα ευλογηθούν, αλλά οι απέθαντοι και οι δαιμονικοί εχθροί θα λάβουν βαριά ζημιά. Το ίδιο το βέλος παραμένει επιβλαβές για τους εχθρούς, αλλά δεν βλάπτει τους συμμάχους.

items.weapon.missiles.darts.incendiarydart.name=εμπρηστικό βέλος
items.weapon.missiles.darts.incendiarydart.desc=Αυτά τα βέλη είναι εμποτισμένα με μια χημική ένωση βασισμένη στον φλογανθό, η οποία ξεσπά σε λαμπερές φλόγες κατά την πρόσκρουση.

items.weapon.missiles.darts.paralyticdart.name=παραλυτικό βέλος
items.weapon.missiles.darts.paralyticdart.desc=Αυτά τα βέλη είναι εμποτισμένα με μια χημική ένωση βασισμένη στη γαιόριζα, η οποία παραλύει τον στόχο για λίγο.

items.weapon.missiles.darts.poisondart.name=δηλητηριώδες βέλος
items.weapon.missiles.darts.poisondart.desc=Αυτά τα βέλη είναι εμποτισμένα με μια χημική ένωση βασισμένη στο οδυνόβρυο, η οποία δηλητηριάζει τον στόχο.

items.weapon.missiles.darts.rotdart.name=σαπιοβέλος
items.weapon.missiles.darts.rotdart.desc=Αυτά τα διαβολικά βέλη είναι εμποτισμένα με μια όξινη χημική ένωση βασισμένη στο σαπιόμουρο. Η ουσία αυτή θα διαβρώσει άγρια οτιδήποτε ακουμπήσουν τα βέλη. Οι ισχυροί εχθροί αντιστέκονται στο μεγαλύτερο κομμάτι της διάβρωσης, αλλά οι κοινοί εχθροί εξολοθρεύονται εύκολα. Αυτός ο εμποτισμός διαρκεί περισσότερο από τους άλλους, αλλά δεν μπορεί να αυξηθεί η διάρκειά του.
items.weapon.missiles.darts.rotdart.discover_hint=Μπορείς να δημιουργήσεις αυτό το αντικείμενο χρησιμοποιώντας έναν σπόρο από μια συγκεκριμένη αποστολή.

items.weapon.missiles.darts.shockingdart.name=ηλεκτρικό βέλος
items.weapon.missiles.darts.shockingdart.desc=Αυτά τα βέλη είναι εμποτισμένα με μια χημική ένωση βασισμένη στο μπορέλι, η οποία προκαλεί άγριο ηλεκτροσόκ στον στόχο.

items.weapon.missiles.darts.tippeddart.ac_clean=ΚΑΘΑΡΙΣΕ
items.weapon.missiles.darts.tippeddart.clean_title=Καθάρισε τα βέλη
items.weapon.missiles.darts.tippeddart.clean_desc=Με αυτήν την ενέργεια, τα βέλη χάνουν τον εμποτισμό τους και μετατρέπονται σε κανονικά βέλη.
items.weapon.missiles.darts.tippeddart.clean_all=Καθαρισμός όλων
items.weapon.missiles.darts.tippeddart.clean_one=Καθαρισμός ενός
items.weapon.missiles.darts.tippeddart.cancel=Ακύρωση
items.weapon.missiles.darts.tippeddart.uses_left=Αυτή η στοίβα βελών έχει _%d/%d_ χρήσεις πριν χαθεί η επίδραση μιας κεφαλής.
items.weapon.missiles.darts.tippeddart.unlimited_uses=_Αλλά αυτά είναι τόσο υψηλής ποιότητας που ουσιαστικά θα διαρκέσουν για πάντα._
items.weapon.missiles.darts.tippeddart.about_to_break=Η επίδραση του βέλους σου είναι έτοιμη να λήξει.
items.weapon.missiles.darts.tippeddart.has_broken=Η επίδραση του βέλους έληξε.
items.weapon.missiles.darts.tippeddart.discover_hint=Μπορείς να αγοράσεις αυτό το αντικείμενο από ένα μαγαζί, ή να το δημιουργήσεις με έναν σπόρο.


items.weapon.missiles.bolas.name=μπόλας
items.weapon.missiles.bolas.stats_desc=Αυτό το όπλο προκαλεί σακάτεμα στον στόχο του.
items.weapon.missiles.bolas.desc=Αυτά τα ιδιόμορφα όπλα απόστασης δεν προκαλούν μεγάλη ζημιά, αλλά λειτουργούν καλά στο να επιβραδύνουν τον στόχο.

items.weapon.missiles.boomerang.name=μπούμερανγκ
items.weapon.missiles.boomerang.desc=Αφού πεταχτεί στον εχθρό, αυτό το καμπυλωτό όπλο ρίψης επιστρέφει στα χέρια του χρήστη.
items.weapon.missiles.boomerang.durability=Χάρη στη στιβαρή κατασκευή του, το μπούμερανγκ αυτό δεν σπάει με τη χρήση.

items.weapon.missiles.fishingspear.name=ακόντιο ψαρέματος
items.weapon.missiles.fishingspear.desc=Μικρά ακόντια που λειτουργούν καλά και ως αυτοσχέδια όπλα, παρότι είναι σχεδιασμένα για ψάρεμα.

items.weapon.missiles.forcecube.name=κύβος ισχύος
items.weapon.missiles.forcecube.ondeath=Εξοντώθηκες από τον ίδιο σου τον κύβο ισχύος...
items.weapon.missiles.forcecube.stats_desc=Αυτό το όπλο διαδίδει τη δύναμη της σύγκρουσης του σε μία μικρή περιοχή, χτυπώντας τα πάντα γύρω του.
items.weapon.missiles.forcecube.desc=Αυτοί οι περίεργα σχηματισμένοι μαγικοί κύβοι είναι αρκετά μικροί για να χωρέσουν στο χέρι σου, αλλά είναι απίστευτα βαριοί.

items.weapon.missiles.heavyboomerang.name=βαρύ μπούμερανγκ
items.weapon.missiles.heavyboomerang.stats_desc=This weapon circles back to the location it was thrown from after five turns.
items.weapon.missiles.heavyboomerang.desc=Αυτό το μεγάλο μπούμερανγκ είναι δύσκολο να χρησιμοποιηθεί αποτελεσματικά, αλλά προκαλεί σημαντική ζημιά.

items.weapon.missiles.javelin.name=ακόντιο
items.weapon.missiles.javelin.desc=Αυτά τα μεγάλα ακόντια είναι σχεδιασμένα ώστε να μένουν μπροστά οι αιχμές τους ενώ σκίζουν τον αέρα.

items.weapon.missiles.kunai.name=κουνάι
items.weapon.missiles.kunai.stats_desc=Αυτό το όπλο είναι ισχυρότερο σε ανυποψίαστους εχθρούς.
items.weapon.missiles.kunai.desc=Αυτά τα μικρά μαχαίρια είναι πολύ ισχυρά στα χέρια ενός ικανού χρήστη.

items.weapon.missiles.missileweapon.stats_known=Αυτό το σετ όπλων ρίψης _%1$dης βαθμίδας_ προκαλεί _%2$d-%3$d ζημιά_ και απαιτεί _%4$d δύναμη_ για να χρησιμοποιηθεί σωστά.
items.weapon.missiles.missileweapon.stats_unknown=Κανονικά, αυτό το σετ όπλων ρίψης _%1$dης βαθμίδας_ προκαλεί _%2$d-%3$d ζημιά_ και απαιτεί _%4$d δύναμη_ για να χρησιμοποιηθεί σωστά.
items.weapon.missiles.missileweapon.stats_desc=
items.weapon.missiles.missileweapon.probably_too_heavy=Πιθανώς αυτό το όπλο να είναι πολύ βαρύ για σένα.
items.weapon.missiles.missileweapon.distance=Τα όπλα ρίψης είναι πιό εύστοχα από απόσταση, αλλά λιγότερο εύστοχα από κοντά.
items.weapon.missiles.missileweapon.durability=Τα όπλα ρίψης φθείρονται και σπάνε όσο χρησιμοποιούνται.
items.weapon.missiles.missileweapon.uses_left=Απομένουν _%d/%d_ χρήσεις σε αυτό το σετ όπλων ρίψης πριν σπάσει ένα από αυτά.
items.weapon.missiles.missileweapon.unlimited_uses=Αυτό το σετ είναι τόσο υψηλής ποιότητας που ουσιαστικά θα διαρκέσει για πάντα.
items.weapon.missiles.missileweapon.unknown_uses=Κανονικά, απομένουν _%d_ χρήσεις σε αυτό το σετ όπλων ρίψης πριν σπάσει ένα από αυτά.
items.weapon.missiles.missileweapon.curse_discover=Αυτό το όπλο ρίψης είναι καταραμένο!
items.weapon.missiles.missileweapon.about_to_break=Το όπλο ρίψης σου είναι έτοιμο να σπάσει.
items.weapon.missiles.missileweapon.has_broken=Ένα από τα όπλα ρίψης σου έσπασε.
items.weapon.missiles.missileweapon.dust=Το όπλο ρίψης γίνεται σκόνη καθώς το ακουμπάς.
items.weapon.missiles.missileweapon.break_upgraded_warn_desc=Εάν το τελευταίο όπλο ρίψης στο βελτιωμένο σετ όπλων ρίψης σπάσει, τότε το σετ θα χαθεί μόνιμα. Θέλεις σίγουρα να το πετάξεις;
items.weapon.missiles.missileweapon.break_upgraded_warn_yes=Ναι
items.weapon.missiles.missileweapon.break_upgraded_warn_no=Όχι
items.weapon.missiles.missileweapon$placeholder.name=όπλο ρίψης

items.weapon.missiles.shuriken.name=σούρικεν
items.weapon.missiles.shuriken.stats_desc=Τα σούρικεν μπορούν να ριφθούν ακαριαία με μια περίοδο αναπλήρωσης 20 γύρων.
items.weapon.missiles.shuriken.desc=Αυτά τα μεταλλικά αστεράκια με λεπίδες κοφτερές σαν ξυράφι μπορούν να ριφθούν γρήγορα εν κινήσει.
items.weapon.missiles.shuriken$shurikeninstanttracker.name=Περίοδος αναπλήρωσης σούρικεν
items.weapon.missiles.shuriken$shurikeninstanttracker.desc=Έριξες πρόσφατα ένα σούρικεν ακαριαία και πρέπει να περιμένεις πριν το ξανακάνεις. Μπορείς ακόμα να ρίξεις σούρικεν, αλλά σε κανονική ταχύτητα.\n\nΓύροι που απομένουν: %s.

items.weapon.missiles.throwingclub.name=ρόπαλο ρίψης
items.weapon.missiles.throwingclub.stats_desc=Αυτό το όπλο δεν κολλά πάνω στους εχθρούς και μπορεί να συλλεχθεί ακαριαία.
items.weapon.missiles.throwingclub.desc=Ένα αρκετά απλό αλλά ανθεκτικό όπλο ρίψης. Στην ουσία δεν είναι παρά μια μεγάλη πέτρα δεμένη σε ξύλο.

items.weapon.missiles.throwinghammer.name=σφυρί ρίψης
items.weapon.missiles.throwinghammer.stats_desc=Αυτό το όπλο δεν κολλά πάνω στους εχθρούς και μπορεί να συλλεχθεί ακαριαία.
items.weapon.missiles.throwinghammer.desc=Αυτά τα βαριά σφυριά είναι σχεδιασμένα να ρίχνονται σε εχθρούς. Η λεία και πλήρως μεταλλική κατασκευή τους τα καθιστά πολύ ανθεκτικά.

items.weapon.missiles.throwingknife.name=μαχαίρι ρίψης
items.weapon.missiles.throwingknife.stats_desc=Αυτό το όπλο είναι ισχυρότερο σε ανυποψίαστους εχθρούς.
items.weapon.missiles.throwingknife.desc=Αυτά τα ελαφριά μαχαίρια σκίζουν τον αέρα σε καμπυλωτή πορεία και καρφώνονται στον στόχο.
items.weapon.missiles.throwingknife.discover_hint=Ένας από τους ήρωες ξεκινά με αυτό το αντικείμενο.

items.weapon.missiles.throwingspear.name=δόρυ ρίψης
items.weapon.missiles.throwingspear.desc=These lightweight spears have thin frames which are designed to be thrown, and not thrusted.

items.weapon.missiles.throwingspike.name=καρφί ρίψης
items.weapon.missiles.throwingspike.desc=Αυτές οι ανθεκτικές, μυτερές μεταλλικές ράβδοι προορίζονται για ρίψεις σε μακρινούς εχθρούς.
items.weapon.missiles.throwingspike.discover_hint=Ένας από τους ήρωες ξεκινά με αυτό το αντικείμενο.

items.weapon.missiles.throwingstone.name=πέτρα ρίψης
items.weapon.missiles.throwingstone.desc=Αυτές οι πέτρες είναι λειασμένες για να μπορούν να πεταχτούν με περισσότερη δύναμη από ό,τι μια κοινή πέτρα.
items.weapon.missiles.throwingstone.discover_hint=Ένας από τους ήρωες ξεκινά με αυτό το αντικείμενο.

items.weapon.missiles.tomahawk.name=τόμαχοκ
items.weapon.missiles.tomahawk.stats_desc=This weapon inflicts _%1$d-%2$d bleed_ to its target.
items.weapon.missiles.tomahawk.typical_stats_desc=This weapon typically inflicts _%1$d-%2$d bleed_ to its target.
items.weapon.missiles.tomahawk.desc=Αυτά τα τσεκούρια ρίψης έχουν μια οδοντωτή άκρη που σκίζουν τον εχθρό καθώς κολλούν πάνω του.

items.weapon.missiles.trident.name=τρίαινα
items.weapon.missiles.trident.desc=Τεράστια ακόντια με τρεις θανατηφόρες πρόκες στην άκρη. Είναι ισχυρά, αλλά και πολύ βαριά.


items.weapon.spiritbow.name=πνευματικό τόξο
items.weapon.spiritbow.ac_shoot=ΡΙΞΕ
items.weapon.spiritbow.prompt=Επίλεξε έναν στόχο
items.weapon.spiritbow.stats=Το τόξο δεν μπορεί να αναβαθμιστεί απευθείας, αλλά θα δυναμώνει σταθερά όσο ανεβαίνεις επίπεδο. Στο τρέχον επίπεδο, τα βέλη του τόξου θα προκαλούν _%1$d-%2$d ζημιά_ – και απαιτείται _%3$d δύναμη_ για να χρησιμοποιηθεί σωστά.
items.weapon.spiritbow.desc=Ένα τόξο φτιαγμένο από αρχαίο μαγικό ξύλο. Η χορδή και οι χαράξεις του τόξου λάμπουν με ένα αχνό μπλε φως. Όταν τραβάς τη χορδή, το τόξο υλοποιεί ένα μαγικό βέλος για να το εξαπολύσει στους εχθρούς.
items.weapon.spiritbow.discover_hint=Ένας από τους ήρωες ξεκινά με αυτό το αντικείμενο.

items.weapon.weapon.identify=Έχεις εξοικειωθεί αρκετά με το όπλο σου ώστε να το αναγνωρίσεις.
items.weapon.weapon.too_heavy=Εξαιτίας της ανεπαρκούς σου δύναμης, με αυτό το όπλο περιορίζεται η ταχύτητα επίθεσης, η ακρίβεια, και η ικανότητα αιφνίδιας επίθεσης.
items.weapon.weapon.excess_str=Χάρη στην υπερβολική σου δύναμη, θα προκαλείς _0-%d επιπλέον ζημιά_ με αυτό το όπλο.
items.weapon.weapon.hardening_gone=Η σκλήρυνση του όπλου έχει εξασθενήσει!
items.weapon.weapon.incompatible=Η αλληλεπίδραση διαφόρων ειδών μαγείας εξάλειψε τη μαγική ενίσχυση του όπλου!
items.weapon.weapon.cursed_worn=Αυτό το όπλο είναι καταραμένο· δεν μπορείς να το βγάλεις από πάνω σου.
items.weapon.weapon.cursed=Νιώθεις μια διαβολική μαγεία να ελλοχεύει στο όπλο.
items.weapon.weapon.weak_cursed=Παρά την κατάρα, μπορείς να αφήσεις αυτό το όπλο.
items.weapon.weapon.not_cursed=Αυτό το όπλο είναι απαλλαγμένο από διαβολική μαγεία.
items.weapon.weapon.faster=Έχει ενδυναμωθεί για ανώτερη _ταχύτητα._
items.weapon.weapon.stronger=Έχει ενδυναμωθεί για ανώτερη _ζημιά._
items.weapon.weapon.enchanted=έχει μια _%s._
items.weapon.weapon.enchant_hardened=Έχει _σκληρυνθεί._
items.weapon.weapon.hardened_no_enchant=Το όπλο έχει _σκληρυνθεί,_ αλλά δεν είναι μαγικά ενισχυμένο προς το παρόν.
items.weapon.weapon$enchantment.enchant=μαγική ενίσχυση
items.weapon.weapon$enchantment.rankings_desc=Εξοντώθηκες από μαγική ενίσχυση
items.weapon.weapon$enchantment.discover_hint=Μπορείς να βρεις ένα αντικείμενο με αυτή την επίδραση τυχαία στην κατακόμβη, ή να προσπαθήσεις να την εφαρμόσεις σε ένα αντικείμενο ο ίδιος.


###misc items
items.amulet.name=Φυλακτό του Γέντορ
items.amulet.ac_end=ΤΕΡΜΑΤΙΣΕ ΤΟ ΠΑΙΧΝΙΔΙ
items.amulet.desc=Το Φυλαχτό του Γέντορ είναι το πιο ισχυρό τεχνούργημα που έχουν δει τόσο οι άνθρωποι όσο και οι νάνοι. Οι σπινθηροβόλοι του κρύσταλλοι περιέχουν απίστευτη και θαυματουργή δύναμη.
items.amulet.desc_origins=Η προέλευση του φυλαχτού είναι άγνωστη. Η ιστορία λέει πως ο Βασιλιάς των Νάνων καυχιόταν για την ανακάλυψή του, λίγο πριν ο πολιτισμός τους αποκόψει κάθε επικοινωνία. Πώς το βρήκε; Πώς του το πήρε ο Yog-Dzewa; Ερωτήσεις για κάποια άλλη στιγμή. Το μόνο που έχει σημασία είναι ότι το φυλαχτό είναι πλέον δικό σου!
items.amulet.desc_ascent=Η προέλευση του φυλαχτού είναι άγνωστη, αλλά είναι εμφανές ότι έχει επηρεαστεί σημαντικά από τη δύναμη του Yog-Dzewa. Η κατακόμβη φαίνεται να υποκύπτει στον Yog ενώ κινείσαι σε αυτήν, και κάνει τους εχθρούς πολυάριθμους και ισχυρότερους! Επιπλέον, δεν μπορείς πια να ενεργοποιήσεις ή να ξεφορτωθείς το φυλακτό... λες και είναι καταραμένο.
items.amulet.ascent_title=Ανάβαση
items.amulet.ascent_desc=Αρχίζεις να αισθάνεσαι τη μεγάλη και αποτρόπαιη δύναμη του Yog-Dzewa να εκπέμπεται από το φυλακτό. Ίσως η ανάβαση στην κατακόμβη ως θνητή οντότητα να είναι πιο δύσκολη από ό,τι περίμενες!\n\nΑν συνεχίσεις την ανάβαση με το φυλακτό, η κατακόμβη θα γίνει πιο επικίνδυνη. Η τηλεμεταφορά μεταξύ ορόφων θα απενεργοποιηθεί, και δεν θα μπορείς να νικήσεις το παιχνίδι παρά μόνο με το εξοντώνεις εχθρούς ενώ ανεβαίνεις στην κατακόμβη!\n\nΜπορείς να αφήσεις το φυλακτό εδώ για τώρα εφόσον θέλεις να ανεβείς χωρίς να ξεκινήσεις την πρόκληση. Μπορείς, επίσης, να ενεργοποιήσεις το φυλακτό προτού ανεβείς και να ολοκληρώσεις το παιχνίδι κανονικά.
items.amulet.ascent_yes=Συνέχεια!
items.amulet.ascent_no=Τέλος για τώρα
items.amulet.discover_hint=Μπορείς να βρεις αυτό το αντικείμενο στον τελικό όροφο της κατακόμβης...

items.ankh.name=ανκχ
items.ankh.ac_bless=ΕΥΛΟΓΗΣΕ
items.ankh.bless=Ευλογείς το ανκχ με μαγικό νερό.
items.ankh.desc=Αυτό το αρχαίο σύμβολο αθανασίας σού επιτρέπει να επιστρέψεις στη ζωή μετά τον θάνατο. Τα περισσότερα αντικείμενα θα πεταχτούν στο σημείο που πέθανες, αλλά μπορούν να ανακτηθούν αν επιστρέψεις εκεί. Το ανκχ μπορεί να ευλογηθεί για περισσότερη δύναμη με ένα γεμάτο φλασκί νερού.
items.ankh.desc_blessed=Αυτό το αρχαίο σύμβολο αθανασίας σού επιτρέπει να επιστρέψεις στη ζωή μετά τον θάνατο. Το ανκχ έχει ευλογηθεί και είναι πολύ ισχυρότερο. Θα θυσιαστεί για να σε σώσει από μια θανάσιμη κατάληξη.
items.ankh.discover_hint=Μπορείς να αγοράσεις αυτό το αντικείμενο σε ένα μαγαζί.

items.arcaneresin.name=απόκρυφη ρητίνη
items.arcaneresin.prompt=Επίλεξε ένα ραβδί
items.arcaneresin.ac_apply=ΕΦΑΡΜΟΣΕ
items.arcaneresin.level_too_high=Το ραβδί είναι υπερβολικά ισχυρό για να βελτιωθεί από τη ρητίνη.
items.arcaneresin.not_enough=Δεν έχεις αρκετή ρητίνη γι' αυτό!
items.arcaneresin.apply=Επικαλύπτεις το ραβδί με ρητίνη, αυξάνοντας τη δύναμή του!
items.arcaneresin.desc=Αυτή η λεπτή σκόνη λαμπυρίζει μεταξύ αποχρώσεων του μωβ και του λευκού. Λειτουργεί ως ενισχυτής μαγικής ενέργειας, αυξάνοντας το επίπεδο των ραβδιών όταν χρησιμοποιείται σε αυτά!\n\nΗ αναβάθμιση ενός ραβδιού κοστίζει 1, 2, ή 3 ρητίνη, ανάλογα με το αρχικό επίπεδο του ραβδιού. Η ρητίνη μπορεί να αναβαθμίζει ραβδιά έως το +3.\n\nΟι αναβαθμίσεις ρητίνης _επικαλύπτονται από άλλες πηγές αναβάθμισης_ (π.χ. παπύρους αναβάθμισης). Επιπλέον, δεν εφαρμόζονται όταν το ραβδί εμποτίζεται στη ράβδο του Μάγου.
items.arcaneresin.discover_hint=Μπορείς να δημιουργήσεις αυτό το αντικείμενο μέσω αλχημείας.

items.brokenseal.name=σπασμένη σφραγίδα
items.brokenseal.ac_affix=ΠΡΟΣΑΡΤΗΣΕ
items.brokenseal.prompt=Επίλεξε μια πανοπλία
items.brokenseal.unknown_armor=Πρέπει πρώτα να αναγνωρίσεις εάν αυτή η πανοπλία είναι καταραμένη ή όχι.
items.brokenseal.cursed_armor=Η σφραγίδα δεν εφαρμόζεται σε καταραμένες πανοπλίες.
items.brokenseal.affix=Προσαρτάς τη σφραγίδα στην πανοπλία σου!
items.brokenseal.desc=Μια κέρινη σφραγίδα που προσαρτάται στην πανοπλία ως σύμβολο γενναιοψυχίας. Έχει έναν ξεθωριασμένο ρούνο προστασίας σκαλισμένο στο κέντρο, και είναι σπασμένη στη μέση.\n\nΩς ένα ενθύμιο από την οικία του, η σφραγίδα βοηθά τον Πολεμιστή να επιμένει. Όσο φορά την σφραγίδα, ο Πολεμιστής θα λαμβάνει ακαριαία προστασία όταν πρόκειται η ζωή του να πέσει στο μισό και κάτω.\n\nΗ σφραγίδα μπορεί να _προσαρτηθεί σε μια πανοπλία_ και να μετακινείται μεταξύ πανοπλιών. Μπορεί να μεταφέρει μία αναβάθμιση κατά τη μετακίνηση, αρκεί αυτή να είχε εφαρμοστεί στην πανοπλία ενώ η σφραγίδα ήταν προσαρτημένη.
items.brokenseal.inscribed=Η σφραγίδα είναι χαραγμένη με: _%s._
items.brokenseal.choose_title=Διάλεξε έναν γλύφο
items.brokenseal.choose_desc=Τόσο η πανοπλία όσο και η σπασμένη σφραγίδα έχουν από έναν γλύφο. Διάλεξε ποιος γλύφος θα παραμείνει.\n\nΓλύφος πανοπλίας: %1$s\nΓλύφος σφραγίδας: %2$s\n\nΈχε υπόψιν σου ότι αν επιλέξεις τον γλύφο της πανοπλίας, η σφραγίδα δεν θα μπορεί να τον μεταφέρει μετά.
items.brokenseal.discover_hint=Ένας από τους ήρωες ξεκινά με αυτό το αντικείμενο.
items.brokenseal$warriorshield.name=Ασπίδα Πολεμιστή
items.brokenseal$warriorshield.desc_active=Η σπασμένη σφραγίδα του Πολεμιστή τον βοηθά να επιμείνει, προσφέροντας του προστασία πάνω από την ζωή του. Υπάρχει περίοδος αναπλήρωσης από όταν η προστασία αρχικά ενεργοποιηθεί, μέχρι να μπορέσει να επαναχρησιμοποιηθεί.\n\nΑυτή η προστασία δεν φθίνει με τον χρόνο, αλλά θα τελειώσει εάν δεν βρίσκονται κοντά εχθροί για μερικούς γύρους. Όταν τελειώσει, η αχρησιμοποίητη προστασία θα μειώσει την περίοδο αναπλήρωσης, εώς και 50%%.\n\nΠροστασία που απομένει: %1$d.\n\nΤρέχουσα περίοδος αναπλήρωσης: %2$d.
items.brokenseal$warriorshield.desc_cooldown=Ο Πολεμιστής έχει πρόσφατα λάβει προστασία από την σπασμένη σφραγίδα του, και πρέπει να περιμένει μέχρι να μπορέσει να ωφεληθεί ξανά από την προστατευτική της επίδραση.\n\nΓύροι που απομένουν: %d.
items.brokenseal$warriorshield.desc_negative_cooldown=The Warrior's shield cooldown is currently negative, meaning that when his shield activates the cooldown will be lower than the usual 150 turns. The shield cooldown can be reduced to as low as -150 turns, which means it will immediately be available again once it is activated.\n\nCurrent cooldown: %d.

items.dewdrop.name=δροσοσταλιά
items.dewdrop.already_full=Έχεις ήδη πλήρη υγεία.
items.dewdrop.desc=Μία πεντακάθαρη δροσοσταλίδα.\n\nΕξαιτίας της μαγείας αυτού του μέρους, το αγνό νερό έχει μικρές αναζωογονητικές ιδιότητες.

items.equipableitem.curse_detected=Αισθάνεσαι πως το αντικείμενο είναι καταραμένο λίγο πριν το εξοπλίσεις!
items.equipableitem.unequip_cursed=Δεν μπορείς να αφαιρέσεις ένα καταραμένο αντικείμενο!
items.equipableitem.ac_equip=ΕΞΟΠΛΙΣΕ
items.equipableitem.ac_unequip=ΑΦΟΠΛΙΣΕ

items.energycrystal.name=ενεργειακός κρύσταλλος
items.energycrystal.desc=Μια συλλογή από μικρούς μαγικούς κρυστάλλους, γεμάτους με αλχημική ενέργεια.\n\nΑυτοί οι κρύσταλλοι είναι το πιο κοινό συστατικό των αλχημικών συνταγών. Μπορούν να παραχθούν σε ένα αλχημικό τσουκάλι με τη διάλυση αναλώσιμων αντικειμένων.

items.gold.name=χρυσός
items.gold.desc=Ένας σωρός από χρυσά νομίσματα. Μάζεψε χρυσά νομίσματα για να τα ξοδέψεις αργότερα σε κατάστημα.

items.heap.for_sale=%1$dχρ: %2$s
items.heap.chest=Σεντούκι
items.heap.chest_desc=Δεν θα γνωρίζεις τι έχει μέσα μέχρι να το ανοίξεις!
items.heap.locked_chest=Κλειδωμένο σεντούκι
items.heap.locked_chest_desc=Δεν θα γνωρίζεις τι έχει μέσα μέχρι να το ανοίξεις! Αλλά για να το ανοίξεις χρειάζεσαι ένα χρυσό κλειδί.
items.heap.crystal_chest=Κρυστάλλινο σεντούκι
items.heap.crystal_chest_desc=Μπορείς να δεις ένα _%s_ μέσα, αλλά για να το ανοίξεις χρειάζεσαι ένα κρυστάλλινο κλειδί.
items.heap.artifact=ένα τεχνούργημα
items.heap.wand=ένα ραβδί
items.heap.ring=ένα δαχτυλίδι
items.heap.tomb=Τάφος
items.heap.tomb_desc=Αυτός ο αρχαίος τάφος ίσως περιέχει κάτι χρήσιμο – αλλά ο ιδιοκτήτης σίγουρα θα έχει ενστάσεις αν πας να ελέγξεις.
items.heap.skeleton=Σκελετικά λείψανα
items.heap.skeleton_desc=Αυτό είναι ό,τι απέμεινε από κάποιον άτυχο εξερευνητή. Ίσως αξίζει να ελέγξεις για κάτι πολύτιμο.
items.heap.remains=Λείψανα ήρωα
items.heap.remains_desc=Αυτό είναι ό,τι απέμεινε από κάποιον προκάτοχό σου. Ίσως αξίζει να ελέγξεις για κάτι πολύτιμο.

items.honeypot.name=δοχείο μελιού
items.honeypot.ac_shatter=ΔΙΑΛΥΣΕ
items.honeypot.desc=Αυτό το μεγάλο δοχείο έχει μέλι μόνο στα τοιχώματά του. Στο εσωτερικό του φιλοξενεί μία γιγάντια μέλισσα! Αυτού του είδους οι μέλισσες συνήθως μένουν στις κυψέλες τους· μήπως το δοχείο δεν είναι παρά ένα κλουβί από παγιδευτές; Η μέλισσα δείχνει χαρούμενη μες στο δοχείο και σου βουίζει επιφυλακτικά όταν το κοιτάς.
items.honeypot$shatteredpot.name=σπασμένο δοχείο μελιού
items.honeypot$shatteredpot.desc=Το δοχείο έχει σπάσει· μόνο το κολλώδες μέλι πάνω στα τοιχώματα το συγκρατεί, και σιγά-σιγά διαλύεται.\n\nΠαρά τη ρημαγμένη του κατάσταση, η μέλισσα θέλει ακόμα να προστατεύσει το δοχείο.

items.item.prompt=Διάλεξε το σημείο που θα το πετάξεις
items.item.ac_drop=ΑΣΕ ΚΑΤΩ
items.item.ac_throw=ΠΕΤΑΞΕ
items.item.rankings_desc=Εξοντώθηκες από: %s
items.item.curse=κατάρα
items.item.custom_note_type=Αυτό το είδος αντικειμένου έχει μία εξατομικευμένη σημείωση: «_%s_»
items.item.custom_note=Το εφόδιο έχει μια εξατομικευμένη σημείωση: _%s_
items.item.discover_hint=Μπορείς να βρεις αυτό το αντικείμενο τυχαία στην κατακόμβη.

items.kindofmisc.unequip_title=Αφόπλισε ένα αντικείμενο
items.kindofmisc.unequip_message=Πρέπει να αφοπλίσεις ένα από αυτά τα εφόδια πρώτα. Διάλεξε το εφόδιο με το οποίο θα το ανταλλάξεις.

items.kindofweapon.swift_equip=Εξοπλίζεις το όπλο ακαριαία.
items.kindofweapon.equip_cursed=Η λαβή σου στενεύει ακούσια γύρω από το όπλο.
items.kindofweapon.which_equip_msg=Σε ποια υποδοχή θέλεις να εξοπλίσεις το εφόδιο; \n\nΗ Μαχήτρια επιτίθεται απευθείας με το κύριο όπλο, αλλά μπορεί να χρησιμοποιεί την ικανότητα οποιουδήποτε όπλου. Και τα δύο όπλα χρησιμοποιούν την ίδια τιμή φορτίου.\n\nΗ Μαχήτρια μπορεί, επίσης, να εναλλάσσει ακαριαία το κύριο και το δευτερεύον όπλο.
items.kindofweapon.which_equip_primary=Κύριο (%s)
items.kindofweapon.which_equip_secondary=Δευτερεύον (%s)
items.kindofweapon.empty=Κενό

items.kingscrown.name=Στέμμα του νάνου βασιλιά
items.kingscrown.ac_wear=ΦΟΡΕΣΕ
items.kingscrown.naked=Δυστυχώς, το στέμμα δεν μπορεί να μεταμορφώσει τα εσώρουχά σου.
items.kingscrown.upgraded=Το στέμμα λάμπει δυνατά και αποδομείται, ενώ η πανοπλία σου μετατρέπεται!
items.kingscrown.ratgraded=Οι πατούσες του αρουραίου βασιλιά λάμπουν καθώς η πανοπλία σου μεταμορφώνεται!
items.kingscrown.desc=Το στέμμα του τελευταίου νάνου βασιλιά· λάμπει με απίστευτη μαγική ενέργεια.\n\nΜόλις το φορέσεις, η μαγεία του στέμματος θα κυλήσει στην πανοπλία που φοράς και θα τη μετατρέψει σε μια _επική πανοπλία με ειδικές ικανότητες._ Η νέα πανοπλία θα διατηρήσει όλες τις ιδιότητες της πρωτότυπης.
items.kingscrown.discover_hint=Μπορείς να αποκτήσεις αυτό το αντικείμενο ως λεία από συγκεκριμένους εχθρούς.

items.liquidmetal.name=υγρό μέταλλο
items.liquidmetal.ac_apply=ΕΦΑΡΜΟΣΕ
items.liquidmetal.prompt=Επίλεξε ένα όπλο ρίψης
items.liquidmetal.already_fixed=Αυτό το όπλο ρίψης είναι ήδη σε άψογη κατάσταση!
items.liquidmetal.apply=Χρησιμοποιείς %d υγρό μέταλλο για την επισκευή του όπλου ρίψης σου.
items.liquidmetal.desc=This magical liquid can fill into the cracks and tears on a thrown weapon, restoring it to perfect condition! If a set of weapons is missing a weapon but otherwise fully repaired, then liquid metal can even be used to replace a missing weapon from the set!\n\nA tier 1 weapon requires 10 liquid metal to be fully repaired, a tier 5 weapon requires 30. Each upgrade also increases the amount of metal needed by 35%.\n\nLiquid metal cannot be used to repair the tips on tipped darts.
items.liquidmetal.discover_hint=Μπορείς να δημιουργήσεις αυτό το αντικείμενο μέσω αλχημείας.

items.lostbackpack.name=χαμένο σακίδιο
items.lostbackpack.desc=Αυτός είναι ο χαμένος σου αποθηκευτικός χώρος. Μάζεψέ τον για να ανακτήσεις όλα τα αντικείμενα που έχασες!

items.merchantsbeacon.name=πομπός του εμπόρου
items.merchantsbeacon.ac_use=ΧΡΗΣΙΜΟΠΟΙΗΣΕ
items.merchantsbeacon.desc=Αυτό το αλλόκοτο κομμάτι τεχνολογίας των νάνων σού επιτρέπει να επικοινωνήσεις από μεγάλες αποστάσεις.\n\nΜόλις ενεργοποιηθεί, θα σου επιτρέψει να πουλήσεις αντικείμενα στο κατάστημα από οποιοδήποτε σημείο της κατακόμβης.\n\nΗ μαγεία του πομπού επαρκεί για μία μόνο χρήση· αξιοποίησέ τη σοφά.

items.stylus.name=απόκρυφο κονδύλι
items.stylus.ac_inscribe=ΧΑΡΑΞΕ
items.stylus.prompt=Διάλεξε μια πανοπλία
items.stylus.identify=Πρέπει πρώτα να αναγνωρίσεις το αν η πανοπλία είναι καταραμένη ή όχι.
items.stylus.cursed=Η μαγεία του κονδυλίου δεν λειτουργεί σε καταραμένες πανοπλίες.
items.stylus.inscribed=Χάραξες την πανοπλία σου με το κονδύλι.
items.stylus.desc=Το απόκρυφο κονδύλι είναι φτιαγμένο από κάποια πολύ σκληρή και σκοτεινή πέτρα. Με αυτό μπορείς να χαράξεις έναν μαγικό γλύφο στην πανοπλία σου, αλλά δεν μπορείς να διαλέξεις ποιος θα είναι· το κονδύλι θα αποφασίσει για εσένα.

items.tengusmask.name=Μάσκα του Τένγκου
items.tengusmask.ac_wear=ΦΟΡΕΣΕ
items.tengusmask.used=Η μάσκα αποδομείται καθώς η δύναμή της κυλάει μέσα σου!
items.tengusmask.desc=Αυτή η μάσκα έπεσε από το πρόσωπο του Τένγκου καθώς πέθαινε· νιώθεις μια τεράστια μαγική δύναμη να αναδίδεται από αυτήν. Μήπως η μάσκα ήταν η πηγή της δύναμης του Τένγκου;\n\nΜόλις φορεθεί, η απίστευτη δύναμη της μάσκας θα μεταφερθεί σε σένα και θα μπορείς να _επιλέξεις μια εξειδίκευση για τον ήρωά σου._\n\nΠοια εξειδίκευση θα επιλέξεις;
items.tengusmask.discover_hint=Μπορείς να αποκτήσεις αυτό το αντικείμενο ως λεία από συγκεκριμένους εχθρούς.

items.torch.name=πυρσός
items.torch.ac_light=ΑΝΑΨΕ
items.torch.desc=Ο ακρογωνιαίος λίθος της περιπέτειας. Όταν η κατακόμβη σκοτεινιάζει, ο πυρσός σε βοηθά να βρίσκεις τον δρόμο.

items.waterskin.name=φλασκί νερού
items.waterskin.ac_drink=ΠΙΕΣ
items.waterskin.collected=Συλλέγεις τη δροσοσταλίδα στο φλασκί νερού.
items.waterskin.full=Το φλασκί νερού σου είναι γεμάτο!
items.waterskin.empty=Το φλασκί νερού σου είναι άδειο!
items.waterskin.desc=Ένα αποθηκευτικό μέσο για υγρά, φτιαγμένο από δέρμα και σπάγκο και σφραγισμένο με πώμα φελλού.
items.waterskin.desc_water=Το φλασκί περιέχει μόνο λίγες σταγόνες κοινού νερού. Σίγουρα θα υπάρχει και κάτι άλλο στην κατακόμβη για να βάλεις μέσα του.
items.waterskin.desc_heal=Το φλασκί αποθηκεύει θεραπευτικό νερό. Όσο πιο γεμάτο είναι, τόσο περισσότερο θα θεραπευτείς αμέσως μόλις πιεις από αυτό. Θα πιεις μόνο όσο χρειάζεσαι.
items.waterskin.desc_full=Το γεμάτο φλασκί νερού φαίνεται να εκπέμπει ενέργεια. Μήπως μπορεί να ευλογήσει κάποιο αντικείμενο επιβίωσης;
items.waterskin.discover_hint=Ένας από τους ήρωες ξεκινά με αυτό το αντικείμενο.

