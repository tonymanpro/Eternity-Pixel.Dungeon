items.artifacts.examinationparchment.energize_desc=Every 10 energy crystals will give the parchment enough energy to gain a level, which increases the rate that the parchment generates energy over time, and how quickly it charges up.\n\nHow much energy would you like to use?
items.artifacts.examinationparchment.energize_1=10 energy: +1 level
