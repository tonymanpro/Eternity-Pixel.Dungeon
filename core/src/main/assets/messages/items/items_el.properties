items.artifacts.examinationparchment.desc=This parchment looks like it needs to know what level of knowledge you have. Charging this parchment has two ways: you can answer a mathematical questions provided by the parchment or slain enemies as you gain experience. It is said that the origins of the parchment is still unknown, and it has powerful ability to buy items and remove buffs anywhere and to anyone including you.
items.artifacts.examinationparchment.desc_old=This parchment looks like it needs to verify your existence, you need to answer some mathematical questions to gain charge for it. The origins of this parchment is still unknown, but it gives you power through shops and your personal buffs.
items.artifacts.examinationparchment.desc_cursed=The cursed parchment has bound itself to your side, and refuses to let you use any scrolls.
items.artifacts.examinationparchment.desc_warming=The parchment is currently warming up, and will be ready to use after a little while.
items.artifacts.examinationparchment.desc_hint=The equipped parchment is slowly generating some charges as you gain experience. It looks like the parchment could be enhanced by adding energy crystals to it.\n\nYou can use this on buying items and removing buffs as you wish.
