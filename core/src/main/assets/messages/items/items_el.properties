items.artifacts.sandalsofnature.levelup=Τα υποδήματα αυξάνονται σε μέγεθος!
items.artifacts.sandalsofnature.absorb_seed=Τα υποδήματα απορροφούν τον σπόρο. Φαίνονται υγιέστερα.
items.artifacts.sandalsofnature.no_effect=Πρέπει πρώτα να ταΐσεις τα υποδήματα με σπόρο.
items.artifacts.sandalsofnature.low_charge=Τα υποδήματα δεν έχουν αρκετή ενέργεια γι' αυτό.
items.artifacts.sandalsofnature.prompt_target=Επίλεξε μια περιοχή
items.artifacts.sandalsofnature.out_of_range=Αυτή η περιοχή είναι εκτός εύρους.
items.artifacts.sandalsofnature.desc_1=Αν και μοιάζουν με σανδάλια φτιαγμένα από σπάγκο, εντούτοις πρόκειται για δύο φυτά! Φαίνονται πολύ αδύναμα και χλωμά... μήπως πρέπει να τους δοθούν θρεπτικές ουσίες;
items.artifacts.sandalsofnature.desc_2=Τα υποδήματα έχουν μεγαλώσει και πλέον ομοιάζουν με δύο εφαρμοστά παπούτσια. Κάποιο χρώμα φαίνεται να έχει επανέλθει... μήπως μπορούν να μεγαλώσουν κι άλλο;
items.artifacts.sandalsofnature.desc_3=Τα φυτά μεγάλωσαν και πλέον θυμίζουν συμπαγείς μπότες από φλοιό. Φαίνεται να έχουν ανακτήσει τη δύναμή τους, αλλά ίσως να μπορούν να μεγαλώσουν κι άλλο;
items.artifacts.sandalsofnature.desc_4=Τα φυτά φαίνονται να έχουν φτάσει στο μέγιστο μέγεθός τους και ομοιάζουν με ζευγάρι από θωρακισμένα περικνήμια. Τα περικνήμια είναι σκούρου καφέ χρώματος και θυμίζουν στιβαρό δέντρο.
items.artifacts.sandalsofnature.desc_hint=Νιώθεις μεγαλύτερη εναρμόνιση με τη φύση ενώ φοράς αυτό το τεχνούργημα.
items.artifacts.sandalsofnature.desc_cursed=Τα καταραμένα σανδάλια εμποδίζουν οποιαδήποτε εναρμόνιση με τη φύση.
items.artifacts.sandalsofnature.desc_ability=Τα υποδήματα κυματίζουν με το χρώμα του τελευταίου σπόρου που τα τάισες. Μπορούν να ριζωθούν για λίγο στο έδαφος και να ενεργοποιήσουν την επίδραση του αντίστοιχου φυτού, οπουδήποτε εντός 3 τετραγώνων. \nΣπόρος: _%s_\nΑπαιτούμενο φορτίο: _%d%%_
items.artifacts.sandalsofnature.desc_seeds=Έχεις ταΐσει τα υποδήματά σου %d σπόρους.

