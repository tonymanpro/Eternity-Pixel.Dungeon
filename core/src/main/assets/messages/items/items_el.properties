###armor curses
items.armor.curses.antientropy.name=%s αντι-εντροπίας
items.armor.curses.antientropy.desc=Η κατάρα αντι-εντροπίας λειτουργεί ενάντια στους νόμους του σύμπαντος: μεταφέρει ενέργεια από τον περιβάλλοντα χώρο προς τον χρήστη. Έτσι, ο χρήστης αρπάζει φωτιά για ένα μικρό χρονικό διάστημα – αλλά τα πάντα γύρω του παγώνουν!

items.armor.curses.bulk.name=%s όγκου
items.armor.curses.bulk.desc=Armor of bulk looks larger and more imposing, but doesn't actually have enhanced defense. Even worse, the added size makes moving into doorways very difficult.

items.armor.curses.corrosion.name=%s διάβρωσης
items.armor.curses.corrosion.desc=Μια πανοπλία διάβρωσης είναι ικανή να εκτοξεύει διαβρωτικό υγρό γύρω της. Οποιοσδήποτε βρεθεί τριγύρω θα καλυφθεί με καυστική γλίτσα.

items.armor.curses.displacement.name=%s εκτοπισμού
items.armor.curses.displacement.desc=Η κατάρα εκτοπισμού προσπαθεί να μεταφέρει τον χρήστη σε ασφαλές μέρος όταν δέχεται επίθεση. Δυστυχώς το παρακάνει και τον τηλεμεταφέρει τυχαία σε άκυρα σημεία του επιπέδου.

items.armor.curses.metabolism.name=%s μεταβολισμού
items.armor.curses.metabolism.desc=Η κατάρα του μεταβολισμού μετατρέπει τον κορεσμό σε ζωή όποτε ο χρήστης τραυματίζεται. Αυτό προσφέρει μια κάποια θεραπεία, αλλά καταλήγεις να λιμοκτονείς πολύ γρήγορα.

items.armor.curses.multiplicity.name=%s πολλαπλασιασμού
items.armor.curses.multiplicity.desc=Μία πανοπλία πολλαπλασιασμού περιέχει επικίνδυνη μαγεία διπλασιασμού. Μερικές φορές θα δημιουργήσει την κατοπτρική εικόνα του κατόχου, αλλά είναι εξίσου πιθανό να παράξει διπλότυπο του επιτιθέμενου!

items.armor.curses.overgrowth.name=%s υπεράνθησης
items.armor.curses.overgrowth.desc=Η πανοπλία υπεράνθησης καλύπτεται από διάφορα ανθισμένα φυτά. Είναι ένα ενδιαφέρον φαινόμενο που όμως δεν προσφέρει τίποτα στην άμυνα. Επίσης, τα φυτά της μπορεί να ενεργοποιηθούν τυχαία κατά τη διάρκεια της μάχης!

items.armor.curses.stench.name=%s μπόχας
items.armor.curses.stench.desc=Μια πανοπλία μπόχας εκλύει τοξικά νέφη δυσωδίας που βλάπτουν οποιονδήποτε πιαστεί σε αυτά.


###glyphs
items.armor.glyphs.affection.name=%s της στοργής
items.armor.glyphs.affection.desc=Αυτός ο ισχυρός γλύφος επηρεάζει το μυαλό των επιτιθέμενων, σαγηνεύοντάς τους προσωρινά.

items.armor.glyphs.antimagic.name=%s αντι-μαγείας
items.armor.glyphs.antimagic.desc=Αυτός ο ισχυρός γλύφος επιτρέπει στην πανοπλία να προστατεύει από τις μαγικές επιθέσεις, μαζί με τις φυσιολογικές. Η μαγική αυτή άμυνα δεν επηρεάζεται από τη βαθμίδα της πανοπλίας.

items.armor.glyphs.brimstone.name=%s πυροπροστασίας
items.armor.glyphs.brimstone.desc=Αυτός ο γλύφος προστατεύει τον κάτοχο και τα υπάρχοντά του από τη φωτιά, εκμηδενίζοντας τη ζημιά και τις αρνητικές της επιδράσεις.

items.armor.glyphs.camouflage.name=%s καμουφλάζ
items.armor.glyphs.camouflage.desc=Αυτός ο γλύφος επιτρέπει στον κάτοχο να κρύβεται στο ψηλό γρασίδι, προσφέροντάς του προσωρινή αορατότητα.

items.armor.glyphs.entanglement.name=%s περιτύλιξης
items.armor.glyphs.entanglement.desc=Αυτός ο γλύφος τυλίγει τον κάτοχο με γαιώδη πανοπλία που απορροφά τη ζημιά – αλλά η ασπίδα σπάει εάν ο κάτοχος μετακινηθεί.

items.armor.glyphs.flow.name=%s της ροής
items.armor.glyphs.flow.desc=Αυτός ο γλύφος τροποποιεί τη ροή του νερού γύρω από τον κάτοχο, κάνοντάς τον να κινείται πιο γρήγορα στο νερό.

items.armor.glyphs.obfuscation.name=%s κάλυψης
items.armor.glyphs.obfuscation.desc=Αυτός ο γλύφος κάνει τον κάτοχο δυσδιάκριτο και πιο δύσκολα εντοπίσιμο.

items.armor.glyphs.potential.name=%s δυναμικού
items.armor.glyphs.potential.desc=Αυτός ο γλύφος συσσωρεύει ενέργεια με τη λήψη χτυπημάτων και φορτίζει τα ραβδιά του κατόχου του.

items.armor.glyphs.repulsion.name=%s απώθησης
items.armor.glyphs.repulsion.desc=Αυτός ο γλύφος αντιστρέφει την ορμή των επιτιθέμενων και τους πετάει προς τα πίσω.

items.armor.glyphs.stone.name=%s πετροποίησης
items.armor.glyphs.stone.desc=Αυτός ο γλύφος περιβάλλει την πανοπλία με μαγική πέτρα. Οι επιθέσεις δεν μπορούν να αποφευχθούν, αλλά εμποδίζονται πόντοι ζημιάς αναλογικά με το επίπεδο αποφυγής.

items.armor.glyphs.swiftness.name=%s ταχύτητας
items.armor.glyphs.swiftness.desc=Αυτός ο γλύφος ενισχύει την ταχύτητα του χρήστη, εφόσον δεν βρίσκεται δίπλα σε κάποιον εχθρό.

items.armor.glyphs.thorns.name=%s των αγκαθιών
items.armor.glyphs.thorns.desc=Αυτός ο ισχυρός γλύφος προκαλεί αιμορραγία σε όποιον επιτίθεται στον κάτοχο.

items.armor.glyphs.viscosity.name=%s αναβλητικότητας
items.armor.glyphs.viscosity.deferred=Αναβεβλημένη %d
items.armor.glyphs.viscosity$defereddamage.name=αναβεβλημένη ζημιά
items.armor.glyphs.viscosity$defereddamage.ondeath=Η αναβεβλημένη ζημιά σε εξόντωσε...
items.armor.glyphs.viscosity$defereddamage.rankings_desc=Εξοντώθηκες από: αναβεβλημένη ζημιά
items.armor.glyphs.viscosity$defereddamage.desc=Η εισερχόμενη ζημιά σού προκαλείται σταδιακά με το πέρασμα του χρόνου αντί για ακαριαία.\n\nΑναβεβλημένη ζημιά που απομένει: %d.
items.armor.glyphs.viscosity.desc=Αυτός ο γλύφος μπορεί να αποθηκεύει τη ζημιά που δέχεται ο κάτοχος, κάνοντάς την να του προκαλείται σταδιακά αντί για απευθείας.



###armor
items.armor.armor.ac_detach=ΑΠΟΚΟΛΛΗΣΗ
items.armor.armor.detach_seal=Βγάζεις τη σφραγίδα από την πανοπλία σου.
items.armor.armor.equip_cursed=Η πανοπλία τυλίγεται γύρω σου επώδυνα.
items.armor.armor.identify=Έχεις εξοικειωθεί αρκετά με την πανοπλία σου ώστε να την αναγνωρίσεις.
items.armor.armor.hardening_gone=Η σκλήρυνση της πανοπλίας έχει εξασθενήσει!
items.armor.armor.incompatible=Η αλληλεπίδραση διαφόρων ειδών μαγείας εξάλειψε τον γλύφο της πανοπλίας!
items.armor.armor.curr_absorb=Αυτή η πανοπλία _%1$dης βαθμίδας_ εμποδίζει _%2$d-%3$d ζημιά_ και απαιτεί _%4$d δύναμη_ για να χρησιμοποιηθεί σωστά.
items.armor.armor.avg_absorb=Κανονικά, αυτή η πανοπλία _%1$dης βαθμίδας_ εμποδίζει _%2$d-%3$d ζημιά_ και απαιτεί _%4$d δύναμη_ για να χρησιμοποιηθεί σωστά.
items.armor.armor.too_heavy=Εξαιτίας της ανεπαρκούς σου δύναμης, με αυτή την πανοπλία μειώνεται η ικανότητά σου να κινείσαι, να αποφεύγεις, και να αμύνεσαι.
items.armor.armor.probably_too_heavy=Αυτή η πανοπλία μάλλον παραείναι βαριά για εσένα.
items.armor.armor.excess_str=Χάρη στην υπερβολική σου δύναμη, έχεις _μεγαλύτερη αποφυγή_ φορώντας αυτή την πανοπλία.
items.armor.armor.evasion=Έχει ενδυναμωθεί για ανώτερη _αποφυγή._
items.armor.armor.defense=Έχει ενδυναμωθεί για ανώτερη _άμυνα._
items.armor.armor.inscribed=είναι χαραγμένη με: _%s._
items.armor.armor.glyph_hardened=Έχει _σκληρυνθεί._
items.armor.armor.hardened_no_glyph=Η πανοπλία έχει _σκληρυνθεί,_ αλλά δεν είναι χαραγμένη με γλύφο προς το παρόν.
items.armor.armor.cursed_worn=Αυτή η πανοπλία είναι καταραμένη· δεν μπορείς να τη βγάλεις από πάνω σου.
items.armor.armor.cursed=Νιώθεις μια διαβολική μαγεία να ελλοχεύει στην πανοπλία.
items.armor.armor.weak_cursed=Παρά την κατάρα, μπορείς να βγάλεις αυτήν την πανοπλία.
items.armor.armor.not_cursed=Αυτή η πανοπλία είναι απαλλαγμένη από διαβολική μαγεία.
items.armor.armor.seal_attached=Η σπασμένη σφραγίδα του πολεμιστή είναι καρφιτσωμένη σε αυτή την πανοπλία. Λίγο πριν τραυματιστεί και το επίπεδο ζωής του φτάσει κάτω από το μισό, θα του παρέχει _%d προστασία_.
items.armor.armor.seal_transfer=Η σπασμένη σφραγίδα του Πολεμιστή πρέπει να καρφιτσωθεί στην πανοπλία που φοράει για να τον ευνοήσει. Θέλεις να αφαιρεθεί αυτόματα από την πανοπλία που αφαιρείς και να καρφιτσωθεί στην πανοπλία που πρόκειται να φορέσεις;
items.armor.armor.seal_transfer_yes=Ναι
items.armor.armor.seal_transfer_no=Όχι
items.armor.armor$glyph.glyph=γλύφος
items.armor.armor$glyph.killed=Εξοντώθηκες από: %s...
items.armor.armor$glyph.rankings_desc=Εξοντώθηκες από γλύφο
items.armor.armor$glyph.discover_hint=Μπορείς να βρεις ένα αντικείμενο με αυτή την επίδραση τυχαία στην κατακόμβη, ή να προσπαθήσεις να την εφαρμόσεις σε ένα αντικείμενο ο ίδιος.

items.armor.classarmor.ac_ability=ΕΠΙΛΕΞΕ ΙΚΑΝΟΤΗΤΑ
items.armor.classarmor.ac_transfer=ΜΕΤΑΦΕΡΕ
items.armor.classarmor.no_ability=Η πανοπλία σου δεν διαθέτει κάποια ικανότητα· θα πρέπει να διαλέξεις μία!
items.armor.classarmor.not_equipped=Πρέπει να φοράς την πανοπλία για να αξιοποιήσεις την ειδική της δύναμη!
items.armor.classarmor.low_charge=Η πανοπλία δεν έχει αρκετό φορτίο για να ενεργοποιηθεί η ειδική της δύναμη!
items.armor.classarmor.charge_use=Αν κάνεις χρήση της ικανότητας τώρα, θα καταναλώσεις _%s_ φορτίο.
items.armor.classarmor.transfer_title=Μεταφορά σε πανοπλία
items.armor.classarmor.transfer_desc=Η μαγεία από το στέμμα του νάνου βασιλιά μπορεί να μεταφερθεί σε άλλη πανοπλία. Έχε υπόψη σου ότι η προηγούμενη πανοπλία θα καταστραφεί κατά τη διαδικασία.
items.armor.classarmor.transfer_prompt=Επίλεξε μια πανοπλία
items.armor.classarmor.transfer_cancel=Ακύρωση
items.armor.classarmor.transfer_complete=Τα χαρακτηριστικά της ηρωικής σου πανοπλίας έχουν μεταφερθεί!
items.armor.classarmor.discover_hint=Μπορείς να βρεις αυτό το αντικείμενο αφότου κατατροπώσεις το αφεντικό στο επίπεδο 20 με έναν συγκεκριμένο ήρωα.

items.armor.clericarmor.name=ηρωικά άμφια
items.armor.clericarmor.desc=Όσο φορά αυτόν τον συνδυασμό υφάσματος και πανοπλίας, ο Κληρικός μπορεί να εκτελέσει μια ειδική ικανότητα.

items.armor.clotharmor.name=υφασμάτινη πανοπλία
items.armor.clotharmor.desc=Αυτό το ελαφρύ ρούχο προσφέρει βασική προστασία.
items.armor.clotharmor.discover_hint=Ένας από τους ήρωες ξεκινά με αυτό το αντικείμενο.

items.armor.duelistarmor.name=θωρακική ηρωική πανοπλία
items.armor.duelistarmor.desc=Όσο φορά αυτήν την πανοπλία και την κάπα, η Ξιφομάχος μπορεί να εκτελέσει μια ειδική ικανότητα.

items.armor.huntressarmor.name=ηρωικός μανδύας
items.armor.huntressarmor.no_enemies=Δεν υπάρχουν εχθροί τριγύρω
items.armor.huntressarmor.desc=Όσο φοράει τον μανδύα, η Κυνηγός μπορεί να εκτελέσει μια ειδική ικανότητα.

items.armor.leatherarmor.name=δερμάτινη πανοπλία
items.armor.leatherarmor.desc=Πανοπλία από κατεργασμένα δέρματα τεράτων. Όχι τόσο ελαφριά όσο η υφασμάτινη πανοπλία, αλλά με καλύτερη προστασία.

items.armor.magearmor.name=ηρωικός χιτώνας
items.armor.magearmor.desc=Όσο φοράει αυτόν τον υπέροχο χιτώνα, ο Μάγος μπορεί να εκτελέσει μια ειδική ικανότητα.

items.armor.mailarmor.name=αλυσιδωτή πανοπλία
items.armor.mailarmor.desc=Οι αλληλένδετοι μεταλλικοί κρίκοι κάνουν αυτήν την πανοπλία γερή αλλά και ευέλικτη.

items.armor.platearmor.name=μεταλλική πανοπλία
items.armor.platearmor.desc=Η πανοπλία αποτελείται από τεράστιες μεταλλικές πλάκες ενωμένες μεταξύ τους. Προσφέρει απαράμιλλη προστασία σε κάθε δυνατό εξερευνητή που θα αντέξει το τεράστιο βάρος της.

items.armor.roguearmor.name=ηρωικό ένδυμα
items.armor.roguearmor.desc=Όσο φοράει αυτό το σκοτεινό ένδυμα, ο Κλέφτης μπορεί να εκτελέσει μια ειδική ικανότητα.

items.armor.scalearmor.name=φολιδωτή πανοπλία
items.armor.scalearmor.desc=Οι μεταλλικές φολίδες, ραμμένες πάνω σε ένα δερμάτινο γιλέκο, δημιουργούν μια ευέλικτη αλλά και ισχυρή πανοπλία.

items.armor.warriorarmor.name=επιμεταλλωμένη ηρωική πανοπλία
items.armor.warriorarmor.desc=Όσο φορά αυτή τη βαριά επιμεταλλωμένη πανοπλία, ο Πολεμιστής μπορεί να εκτελέσει μια ειδική ικανότητα.



###artifacts
items.artifacts.alchemiststoolkit.name=εργαλειοθήκη του αλχημιστή
items.artifacts.alchemiststoolkit.ac_brew=ΠΑΡΑΣΚΕΥΑΣΕ
items.artifacts.alchemiststoolkit.ac_energize=ΕΝΕΡΓΕΙΩΣΕ
items.artifacts.alchemiststoolkit.not_ready=Η εργαλειοθήκη σου δεν έχει ετοιμαστεί ακόμα.
items.artifacts.alchemiststoolkit.cursed=Η καταραμένη εργαλειοθήκη σε αποτρέπει από το να κάνεις αλχημεία!
items.artifacts.alchemiststoolkit.need_energy=Χρειάζεσαι τουλάχιστον 6 ενέργεια γι' αυτό.
items.artifacts.alchemiststoolkit.energize_desc=6 ενεργειακοί κρύσταλλοι προσφέρουν αρκετή ενέργεια για να ανεβεί ένα επίπεδο η εργαλειοθήκη. Αυτό αυξάνει τον ρυθμό παραγωγής ενέργειας της εργαλειοθήκης, καθώς και τον ρυθμό προετοιμασίας της.\n\nΠόση ενέργεια θα ήθελες να χρησιμοποιήσεις;
items.artifacts.alchemiststoolkit.energize_1=6 ενέργεια: +1 επίπεδο
items.artifacts.alchemiststoolkit.energize_all=%1$d ενέργεια: +%2$d επίπεδα
items.artifacts.alchemiststoolkit.desc=Η εργαλειοθήκη περιέχει διάφορα συστατικά και βότανα, μαζί με ένα φιαλίδιο ανάμειξης, ώστε να μπορείς να κάνεις αλχημεία όπου κι αν βρίσκεσαι. Το φιαλίδιο περιέχει κρυστάλλους αλχημικής ενέργειας σε υγρή μορφή.
items.artifacts.alchemiststoolkit.desc_cursed=Η καταραμένη εργαλειοθήκη έχει προσκολληθεί στο πλευρό σου, και σε αποτρέπει από το να κάνεις αλχημεία.
items.artifacts.alchemiststoolkit.desc_warming=Η εργαλειοθήκη σου προετοιμάζεται, και θα είναι έτοιμη για χρήση μετά από λίγο.
items.artifacts.alchemiststoolkit.desc_hint=Όσο τη φοράς, η εργαλειοθήκη σου θα παράγει αλχημική ενέργεια καθώς λαμβάνεις εμπειρία. Φαίνεται πως το μείγμα στο φιαλίδιο μπορεί να ενισχυθεί με την προσθήκη ενεργειακών κρυστάλλων.

items.artifacts.artifact.cannot_wear_two=Δεν μπορείς να εξοπλιστείς με δύο ίδια τεχνουργήματα.
items.artifacts.artifact.equip_cursed=Το τεχνούργημα προσκολλάται επίπονα πάνω σου.
items.artifacts.artifact.curse_known=Νιώθεις μια διαβολική μαγεία να ελλοχεύει στο τεχνούργημα.
items.artifacts.artifact.not_cursed=Αυτό το τεχνούργημα είναι απαλλαγμένο από διαβολική μαγεία.
items.artifacts.artifact.need_to_equip=Χρειάζεται να εξοπλίσεις το τεχνούργημα για να το κάνεις αυτό.

items.artifacts.capeofthorns.name=αγκαθωτή κάπα
items.artifacts.capeofthorns.desc=Αυτά τα κομμάτια μετάλλου του DM-300 έχουν σχηματίσει μια συμπαγή κάπα. Μια απόκρυφη ενέργεια φαίνεται να αναβλύζει από μέσα της· μήπως διατηρεί κάποια από τη δύναμη του DM-300;
items.artifacts.capeofthorns.desc_inactive=Η κάπα ακουμπάει στιβαρά στους ώμους σου· φαίνεται να παίρνει ενέργεια από τη ζημιά που δέχεσαι.
items.artifacts.capeofthorns.desc_active=Η κάπα φαίνεται να απελευθερώνει την αποθηκευμένη της ενέργεια. Εκπέμπει μια προστατευτική αύρα.
items.artifacts.capeofthorns$thorns.inert=Η κάπα σου αδρανοποιείται ξανά.
items.artifacts.capeofthorns$thorns.radiating=Η κάπα αρχίζει να εκπέμπει ενέργεια· νιώθεις την προστασία της!
items.artifacts.capeofthorns$thorns.levelup=Η κάπα σου γίνεται ισχυρότερη!
items.artifacts.capeofthorns$thorns.name=αγκάθια
items.artifacts.capeofthorns$thorns.desc=Η κάπα σου εκπέμπει ενέργεια και σε καλύπτει με ένα πεδίο αμυντικής ισχύος!\n\nΌλη η εισερχόμενη ζημιά μειώνεται όσο η επίδραση των αγκαθιών είναι ενεργή. Επιπλέον, εάν ο επιτιθέμενος είναι δίπλα σου, η ζημιά που απορροφάται επιστρέφει σε αυτόν.\n\nΓύροι αγκαθιών που απομένουν: %s.

items.artifacts.chaliceofblood.name=δισκοπότηρο αίματος
items.artifacts.chaliceofblood.ac_prick=ΤΡΥΠΗΣΟΥ
items.artifacts.chaliceofblood.yes=Ναι, ξέρω τι κάνω
items.artifacts.chaliceofblood.no=Όχι, άλλαξα γνώμη
items.artifacts.chaliceofblood.prick_warn=Each time you use the chalice it will drain more of your life energy, but will further enhance your natural health regeneration in exchange.\n\nCurrently pricking yourself will deal _%1$d-%2$d damage_, although this damage can be reduced by _both physical and magical blocking or damage reduction._ Without considering damage reduction effects, pricking yourself currently has a _%3$s%% chance_ to drain your life force completely.\n\nAre you sure you want to offer the chalice more life energy?
items.artifacts.chaliceofblood.onprick=Τρυπάς τον εαυτό σου, και η ζωτική σου ενέργεια εγχέεται στο δισκοπότηρο.
items.artifacts.chaliceofblood.ondeath=Το δισκοπότηρο απομυζά όλη σου τη ζωτική ενέργεια...
items.artifacts.chaliceofblood.desc=Το χείλος του ασημένιου δισκοπότηρου είναι αλλόκοτα διακοσμημένο με κοφτερά πετράδια.
items.artifacts.chaliceofblood.desc_cursed=Το καταραμένο δισκοπότηρο έχει προσκολληθεί στο χέρι σου και εμποδίζει την αναπλήρωση ζωής.
items.artifacts.chaliceofblood.desc_1=Κρατώντας το δισκοπότηρο, νιώθεις μια περίεργη επιθυμία να τρυπηθείς στα κοφτερά του πετράδια.
items.artifacts.chaliceofblood.desc_2=Some of your blood is pooled into the chalice, you can subtly feel the chalice feeding life energy into you, increasing your natural health regeneration. You still want to cut yourself on the chalice, even though you know it will hurt.
items.artifacts.chaliceofblood.desc_3=Το δισκοπότηρο είναι γεμάτο με τη ζωτική σου ουσία. Το νιώθεις να μεταφέρει ζωτική ενέργεια πίσω σε εσένα.

items.artifacts.cloakofshadows.name=μανδύας των σκιών
items.artifacts.cloakofshadows.ac_stealth=ΚΑΛΥΨΗ
items.artifacts.cloakofshadows.cooldown=Ο μανδύας χρειάζεται %d γύρους για να επαναφορτιστεί.
items.artifacts.cloakofshadows.cursed=Δεν μπορείς να χρησιμοποιήσεις έναν καταραμένο μανδύα.
items.artifacts.cloakofshadows.no_charge=Ο μανδύας σου δεν έχει επαναφορτιστεί ακόμα.
items.artifacts.cloakofshadows.desc=Ένας ανεκτίμητος μαγικός μανδύας. Ο Κλέφτης τον «αφήρεσε» από το βασιλικό οπλοστάσιο πριν από πολλά χρόνια. Θα σου προσφέρει πλήρη αορατότητα για μικρά χρονικά διαστήματα όταν τον φοράς.\n\nΟ μανδύας γίνεται ισχυρότερος με τη χρήση, επιτρέποντας στον Κλέφτη να γίνεται αόρατος πιο συχνά και για μεγαλύτερα χρονικά διαστήματα.
items.artifacts.cloakofshadows.discover_hint=Ένας από τους ήρωες ξεκινά με αυτό το αντικείμενο.
items.artifacts.cloakofshadows$cloakstealth.no_charge=Ο μανδύας σου ξέμεινε από ενέργεια.
items.artifacts.cloakofshadows$cloakstealth.levelup=Ο μανδύας σου δυναμώνει!
items.artifacts.cloakofshadows$cloakstealth.name=κάλυψη
items.artifacts.cloakofshadows$cloakstealth.desc=Ο μανδύας των σκιών σου σου παρέχει αορατότητα όσο τυλίγεσαι με αυτόν. Θα παραμείνεις υπό κάλυψη μέχρι να την ακυρώσεις, ή μέχρι ο μανδύας να ξεμείνει από ενέργεια.\n\nΌσο έχεις αορατότητα, οι εχθροί δεν μπορούν να σου επιτεθούν ή να σε ακολουθήσουν. Οι φυσιολογικές επιθέσεις και οι μαγικές επιδράσεις (όπως από παπύρους ή ραβδιά) θα ακυρώσουν αμέσως την αορατότητα.\n\nΓύροι έως ότου καταναλωθεί φορτίο: %d.

