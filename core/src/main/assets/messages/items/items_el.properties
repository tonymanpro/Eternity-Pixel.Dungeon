items.pets.petegg.name_dragon=Dragon Egg
items.pets.petegg.desc_dragon=A warm egg radiating gentle heat. Needs warmth to incubate and hatch.\n\nIncubation progress: _%d%%_
items.pets.petegg.name_wolf=Wolf Egg
items.pets.petegg.desc_wolf=A sturdy spotted egg. Incubates with every step you take in the dungeon.\n\nIncubation progress: _%d%%_
items.pets.petegg.name_fairy=Fairy Egg
items.pets.petegg.desc_fairy=A delicate glowing egg that hums with gentle magic. Incubates with steps and proximity to water.\n\nIncubation progress: _%d%%_
items.pets.petegg.name_spider=Spider Egg
items.pets.petegg.desc_spider=A silk-wrapped egg pulsating with arcane life. Incubates with movement and dark foliage.\n\nIncubation progress: _%d%%_
items.pets.petegg.name_manticore=Manticore Egg
items.pets.petegg.desc_manticore=A legendary egg radiating crimson embers and amethyst venom. Incubates with dungeon exploration and combat.\n\nIncubation progress: _%d%%_
items.pets.petegg.manticore_supporter_locked=The Manticore is an exclusive Supporter companion! Enter your license key or support on Patreon/Steam to hatch.
