items.artifacts.driedrose$ghosthero.seen_tengu_3=Έχω ακούσει ιστορίες τρόμου για αυτή τη μάσκα...
items.artifacts.driedrose$ghosthero.seen_dm300_1=Μόνο οι νάνοι θα έφτιαχναν μηχανή εξόρυξης που σκοτώνει εισβολείς.
items.artifacts.driedrose$ghosthero.seen_dm300_2=Αυτό το πράγμα είναι τεράστιο...
items.artifacts.driedrose$ghosthero.seen_dm300_3=Πώς έχει μείνει αυτό το πράγμα ενεργό για τόσο καιρό;
items.artifacts.driedrose$ghosthero.seen_king_1=Όταν λένε ότι η δύναμη διαφθείρει, αυτό εννοούν.
items.artifacts.driedrose$ghosthero.seen_king_2=Περισσότερο νεκροζώντανος είναι πλέον παρά βασιλιάς.
items.artifacts.driedrose$ghosthero.seen_king_3=Οι νάνοι και στον θάνατο υπακούν τον αφέντη τους.
items.artifacts.driedrose$ghosthero.seen_yog_1=Ωχ, αυτό δεν φαίνεται καλό.
items.artifacts.driedrose$ghosthero.seen_yog_2=Ώστε έτσι μοιάζει ένας θεός;
items.artifacts.driedrose$ghosthero.seen_yog_3=Αυτό θα πονέσει...

items.artifacts.driedrose$ghosthero.defeated_by_enemy_1=Καλή τύχη...
items.artifacts.driedrose$ghosthero.defeated_by_enemy_2=Κουράστηκα... για τώρα...
items.artifacts.driedrose$ghosthero.defeated_by_enemy_3=Θα επιστρέψω...
items.artifacts.driedrose$ghosthero.defeated_by_boss_1=Συγγνώμη... καλή τύχη...
items.artifacts.driedrose$ghosthero.defeated_by_boss_2=Αποτελείωσέ το... χωρίς εμένα...
items.artifacts.driedrose$ghosthero.defeated_by_boss_3=Όχι... Δεν μπορώ...
items.artifacts.driedrose$ghosthero.blessed_ankh_1=Πώς επέζησες από αυτό;
items.artifacts.driedrose$ghosthero.blessed_ankh_2=Μακάρι να είχα ένα από αυτά...
items.artifacts.driedrose$ghosthero.blessed_ankh_3=Ουάου! Ζεις ακόμα!
items.artifacts.driedrose$ghosthero.player_killed_1=Όχι!...
items.artifacts.driedrose$ghosthero.player_killed_2=Δεν μπόρεσα να σε βοηθήσω...
