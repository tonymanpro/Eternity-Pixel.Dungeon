items.artifacts.driedrose.ac_direct=ΚΑΤΕΥΘΥΝΕ
items.artifacts.driedrose.ac_outfit=ΕΞΟΠΛΙΣΜΟΣ
items.artifacts.driedrose.spawned=Έχεις ήδη καλέσει το φάντασμα.
items.artifacts.driedrose.no_charge=Το τριαντάφυλλο δεν έχει φορτιστεί ακόμη.
items.artifacts.driedrose.cursed=Δεν μπορείς να χρησιμοποιήσεις ένα καταραμένο τριαντάφυλλο.
items.artifacts.driedrose.no_space=Δεν υπάρχει ελεύθερος χώρος δίπλα σου.
items.artifacts.driedrose.charged=Το τριαντάφυλλο είναι πλήρως φορτισμένο!
items.artifacts.driedrose.desc=Αυτό είναι το τριαντάφυλλο που ανέφερε το φάντασμα προτού εξαφανιστεί; Φαίνεται να διαθέτει αρκετή πνευματική ενέργεια. Ίσως με αυτό να μπορείς να κατευθύνεις την ενέργεια του χαμένου πολεμικού του πνεύματος.
items.artifacts.driedrose.desc_no_quest=Ένα στεγνό, γέρικο τριαντάφυλλο που διατηρείται ακόμη παρά την ηλικία του.\n\nΦαίνεται να έχει κάποια πνευματική δύναμη, αλλά δεν έχεις ιδέα πώς να την αξιοποιήσεις προς το παρόν.
items.artifacts.driedrose.desc_hint=Φαίνεται να λείπουν κάποια πέταλα. Ίσως αν τα τοποθετήσεις να ενδυναμωθεί το τριαντάφυλλο.
items.artifacts.driedrose.desc_cursed=Το καταραμένο τριαντάφυλλο έχει προσκολληθεί στο χέρι σου. Είναι απόκοσμα ψυχρό.
items.artifacts.driedrose.desc_weapon=Όπλο του φαντάσματος: %s
items.artifacts.driedrose.desc_armor=Πανοπλία του φαντάσματος: %s
items.artifacts.driedrose.desc_strength=Δύναμη του φαντάσματος: %s
items.artifacts.driedrose$petal.name=ξερό πέταλο
items.artifacts.driedrose$petal.no_rose=Δεν έχεις τριαντάφυλλο να του προσκολλήσεις το πέταλο.
items.artifacts.driedrose$petal.no_room=Δεν υπάρχει χώρος για το πέταλο, οπότε το πετάς.
items.artifacts.driedrose$petal.maxlevel=Το ρόδο ολοκληρώθηκε!
items.artifacts.driedrose$petal.levelup=Προσθέτεις το πέταλο στο τριαντάφυλλο.
items.artifacts.driedrose$petal.desc=Ένα ισχνό και ξερό πέταλο, που με κάποιον τρόπο επιβίωσε στην κατακόμβη.
items.artifacts.driedrose$wndghosthero.title=Εξοπλισμός φαντάσματος
items.artifacts.driedrose$wndghosthero.desc=Το φάντασμα είναι αδύναμο από μόνο του, αλλά η μορφή του είναι αρκετά στερεή για να εξοπλιστεί με πανοπλία και όπλο. Μπορεί να χρησιμοποιήσει αυτά τα αντικείμενα ακριβώς όπως κι εσύ.\n\nΤο φάντασμα μπορεί να εξοπλιστεί με αντικείμενα που απαιτούν έως και _%d δύναμη._
items.artifacts.driedrose$wndghosthero.weapon_prompt=Επίλεξε ένα όπλο
items.artifacts.driedrose$wndghosthero.armor_prompt=Επίλεξε μία πανοπλία
items.artifacts.driedrose$wndghosthero.cant_unique=Το φάντασμα δεν μπορεί να χρησιμοποιήσει ειδικά αντικείμενα.
items.artifacts.driedrose$wndghosthero.cant_cursed=Το φάντασμα μπορεί να χρησιμοποιήσει μόνο αντικείμενα τα οποία είσαι σίγουρος πως δεν είναι καταραμένα.
items.artifacts.driedrose$wndghosthero.cant_strength_unknown=Το φάντασμα ίσως να μην είναι αρκετά δυνατό να το χρησιμοποιήσει αυτό.
items.artifacts.driedrose$wndghosthero.cant_strength=Το φάντασμα δεν είναι αρκετά δυνατό να το χρησιμοποιήσει αυτό.

##ghost hero
items.artifacts.driedrose$ghosthero.name=θλιμμένο φάντασμα
items.artifacts.driedrose$ghosthero.def_verb=Αποφυγή
items.artifacts.driedrose$ghosthero.discover_hint=Μπορείς να βρεις αυτόν τον χαρακτήρα με ένα συγκεκριμένο τεχνούργημα.

items.artifacts.driedrose$ghosthero.hello=%s! Γεια σου και πάλι.
items.artifacts.driedrose$ghosthero.introduce=Το πνεύμα μου είναι δεμένο στο τριαντάφυλλο. Ήταν ό,τι πολυτιμότερο είχα· το δώρο του αγαπημένου μου που άφησα στην επιφάνεια.\n\nΔεν μπορώ να επιστρέψω σε αυτόν. Αλλά χάρη σε εσένα, έχω άλλη μία ευκαιρία να ολοκληρώσω το ταξίδι μου. Θα ανταποκρίνομαι στο κάλεσμά σου, και θα παλεύω στο πλευρό σου, όποτε μπορώ.\n\nΘα ακούω τη φωνή σου όσο έχεις το τριαντάφυλλο. Χρησιμοποίησέ το για να με καθοδηγείς από μακριά.\n\nΕλπίζω να πετύχεις εκεί που απέτυχα...

items.artifacts.driedrose$ghosthero.dialogue_sewers_1=Οι υπόνομοι ήταν κάποτε ασφαλείς... κάποιοι κιόλας ζούσαν εδώ τον χειμώνα.
items.artifacts.driedrose$ghosthero.dialogue_sewers_2=Αναρωτιέμαι τι απέγιναν οι φρουροί περιπολίας... τα παράτησαν;
items.artifacts.driedrose$ghosthero.dialogue_sewers_3=Είχα οικογένεια στην επιφάνεια... ελπίζω να είναι ασφαλείς.
items.artifacts.driedrose$ghosthero.dialogue_sewers_4=Οι φύλακες δεν μπόρεσαν να εξοντώσουν τα τέρατα... ίσως εμείς μπορούμε.
items.artifacts.driedrose$ghosthero.dialogue_sewers_5=Αν οι υπόνομοι είναι τόσο επικίνδυνοι, ποιος ξέρει τι παραμονεύει εκεί κάτω...
items.artifacts.driedrose$ghosthero.dialogue_sewers_6=Τι μπορεί να έχει κάνει τους αρουραίους και τα καβούρια τόσο μεγάλα;
items.artifacts.driedrose$ghosthero.dialogue_prison_1=Έχω ακούσει ιστορίες γι' αυτό το μέρος... τίποτα καλό.
items.artifacts.driedrose$ghosthero.dialogue_prison_2=Εδώ πιο πολύ μπουντρούμι ήταν πάντα παρά φυλακή.
items.artifacts.driedrose$ghosthero.dialogue_prison_3=Δεν μπορώ να φανταστώ τι έγινε, αφού εγκαταλείφθηκε το μέρος.
items.artifacts.driedrose$ghosthero.dialogue_prison_4=Όπως φαίνεται, φύλακες και φυλακισμένοι έχουν γίνει όλοι κτήνη.
items.artifacts.driedrose$ghosthero.dialogue_prison_5=Τι μπορεί να ευθύνεται για όλους αυτούς τους σκελετούς;
items.artifacts.driedrose$ghosthero.dialogue_prison_6=Δεν άξιζε σε αυτούς τους ανθρώπους να καταλήξουν έτσι...
items.artifacts.driedrose$ghosthero.dialogue_caves_1=Έχει πολύ καιρό να πατήσει εδώ άνθρωπος ή νάνος.
items.artifacts.driedrose$ghosthero.dialogue_caves_2=Τι μπορεί να έκανε τους νάνους να παρατήσουν ένα χρυσωρυχείο;
items.artifacts.driedrose$ghosthero.dialogue_caves_3=Κρίμα που όλος αυτός ο χρυσός είναι άχρηστος στην επιφάνεια.
items.artifacts.driedrose$ghosthero.dialogue_caves_4=Τα πλάσματα εδώ είναι διεστραμμένα, όπως και στους υπονόμους.
items.artifacts.driedrose$ghosthero.dialogue_caves_5=Ακόμα κι οι νυχτερίδες είναι αιμοδιψείς εδώ πέρα.
items.artifacts.driedrose$ghosthero.dialogue_caves_6=Κανένα ίχνος εξοπλισμού εξόρυξης... τον πήραν όλο οι νάνοι;
items.artifacts.driedrose$ghosthero.dialogue_city_1=Οι νάνοι ήταν εργατικοί, αλλά άπληστοι.
items.artifacts.driedrose$ghosthero.dialogue_city_2=Ώστε έχει όντως πέσει η μητρόπολη των νάνων.
items.artifacts.driedrose$ghosthero.dialogue_city_3=Εύχομαι η επιφάνεια να μην καταλήξει ποτέ σαν αυτό το μέρος.
items.artifacts.driedrose$ghosthero.dialogue_city_4=Οι νάνοι δεν θα 'πρεπε να είναι τόσο χλωμοί.
items.artifacts.driedrose$ghosthero.dialogue_city_5=Δεν ξέρω τι είναι χειρότερο, οι νάνοι ή οι δημιουργίες τους.
items.artifacts.driedrose$ghosthero.dialogue_city_6=Φαίνεται ότι οι νάνοι έχουν γίνει κι αυτοί άμυαλα τέρατα.
items.artifacts.driedrose$ghosthero.dialogue_halls_1=Τι είναι αυτό το μέρος;
items.artifacts.driedrose$ghosthero.dialogue_halls_2=Αυτό το μέρος είναι τρομακτικό...
items.artifacts.driedrose$ghosthero.dialogue_halls_3=Τι σκέφτονταν οι νάνοι όταν έπαιζαν με μια τέτοια δύναμη;
items.artifacts.driedrose$ghosthero.dialogue_halls_4=Τα τέρατα εδώ είναι απόκοσμα... από πού ήρθαν;
items.artifacts.driedrose$ghosthero.dialogue_halls_5=Το νιώθεις; Σαν κάτι να μας παρακολουθεί.
items.artifacts.driedrose$ghosthero.dialogue_halls_6=Ευτυχώς υπάρχουν πυρσοί... είναι τόσο σκοτεινά εδώ!
items.artifacts.driedrose$ghosthero.dialogue_ascension_1=Γιατί συμβαίνει αυτό; Νόμιζα ότι τα καταφέραμε.
items.artifacts.driedrose$ghosthero.dialogue_ascension_2=Πώς μπορεί αυτό το πράγμα να επηρεάζει ακόμα τον κόσμο;
items.artifacts.driedrose$ghosthero.dialogue_ascension_3=Ελπίζω να ξέρεις τι κάνεις με αυτό το φυλακτό.
items.artifacts.driedrose$ghosthero.dialogue_ascension_4=Υποθέτω ότι δεν τελειώσαμε ακόμη.
items.artifacts.driedrose$ghosthero.dialogue_ascension_5=Έχουμε φτάσει τόσο μακριά... μπορούμε να το τελειώσουμε!
items.artifacts.driedrose$ghosthero.dialogue_ascension_6=Λίγο ακόμα έμεινε, και θα ξεφύγουμε από εδώ!

items.artifacts.driedrose$ghosthero.seen_goo_1=Προσοχή, το Γκου!
items.artifacts.driedrose$ghosthero.seen_goo_2=Πολλοί φίλοι μου πέθαναν από αυτό το πράγμα... ώρα για εκδίκηση!
items.artifacts.driedrose$ghosthero.seen_goo_3=Σε ένα τέτοιο βδέλυγμα δεν μπορεί να επιτραπεί η ζωή!
items.artifacts.driedrose$ghosthero.seen_tengu_1=Ο μόνος φυλακισμένος που απέμεινε είναι ένας θανάσιμος δολοφόνος. Φυσικά...
