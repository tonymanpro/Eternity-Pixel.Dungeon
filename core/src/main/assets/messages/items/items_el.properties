items.artifacts.holytome.ac_cast=ΕΚΤΕΛΕΣΕ
items.artifacts.holytome.no_spell=Δεν μπορείς να εκτελέσεις αυτό το ξόρκι τώρα.
items.artifacts.holytome.cursed=Δεν μπορείς να χρησιμοποιήσεις έναν καταραμένο τόμο.
items.artifacts.holytome.levelup=Ο τόμος σου δυναμώνει!
items.artifacts.holytome.desc=Ένας ιερός τόμος που λειτουργεί ως η συγκέντρωση της θεϊκής μαγείας του Κληρικού. Ο τόμος επιτρέπει στον Κληρικό να εκτελέσει ποικίλα μαγικά ξόρκια.\n\nΟ τόμος θα γίνεται σταθερά ισχυρότερος όσο χρησιμοποιείται, αυξάνοντας το μέγιστο φορτίο του καθώς και αμυδρά την ταχύτητα επαναφόρτισής του.
items.artifacts.holytome.discover_hint=Ένας από τους ήρωες ξεκινά με αυτό το αντικείμενο.

