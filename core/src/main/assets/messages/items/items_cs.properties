items.weapon.melee.magesstaff.typical_ability_desc=The Rat King can _lunge_ with a mage's staff at an enemy 1 tile away. This moves toward the enemy, typically deals _%1$d-%2$d damage_, and is guaranteed to hit.
items.weapon.melee.magesstaff.ability_desc=The Rat King can _lunge_ with a mage's staff at an enemy 1 tile away. This moves toward the enemy, deals _%1$d-%2$d damage_, and is guaranteed to hit.
