items.artifacts.etherealchains.cant_reach=Tvé řetězy tam nedosáhnou.
items.artifacts.etherealchains.inside_wall=Řetězy tě nemohou přesunout do stěn! Pouze skrze ně.
items.artifacts.etherealchains.nothing_to_grab=Není tu co zachytit.
items.artifacts.etherealchains.prompt=Urči směr vrhnutí
items.artifacts.etherealchains.desc=Tyto velké, ale lehké řetězy září přízračnou energií. Mohou být použity k přitáhnutí se na určité místo nebo k přitáhnutí nepřátel směrem k tobě. Přízračná vlastnost řetězů jim dokonce umožňuje se protáhnout skrze zdi!
items.artifacts.etherealchains.desc_cursed=Prokleté řetězy jsou uzamčené kolem tvém pasu, neustále se houpu a snaží se tě zpomalit či spoutat.
items.artifacts.etherealchains.desc_equipped=Řetězy spočívají po tvém boku a pomalu čerpají duchovní energii těch, které zabíjíš. Každé nabití je jako článek řetězu, který jej prodlouží přesně o jedno pole.
items.artifacts.etherealchains$chainsrecharge.levelup=Tvé řetězy se stávají silnější!

items.artifacts.holytome.name=Svatá kniha
items.artifacts.holytome.ac_cast=VYVOLAT
items.artifacts.holytome.no_spell=Toto kouzlo nyní nemůžeš seslat.
items.artifacts.holytome.cursed=Nemůžeš použít prokletou knihu.
items.artifacts.holytome.levelup=Tvá kniha nabývá na síle!
items.artifacts.holytome.desc=Svatá kniha, která je ohniskem Klerikovy božské magie. Použitím knihy může Klerik seslat řadu různých magických efektů.\n\nKniha bude sílit s tím, jak ji Klerik bude používat, čímž získá vyšší maximum nabití a zvýší se její rychlost dobíjení.
items.artifacts.holytome.discover_hint=S tímto předmětem začíná jeden z hrdinů.

