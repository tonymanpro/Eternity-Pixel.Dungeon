items.artifacts.skeletonkey.wall_charges=Vyvolání dočasné zdi stojí 2 použití.
items.artifacts.skeletonkey.crystal_charges=Otevření krystalového zámku stojí 5 použití.
items.artifacts.skeletonkey.wont_open=Klíč z nějakého důvodu nejde zasunout do tohoto zámku.
items.artifacts.skeletonkey.locked_with_key=Tyto dveře byly uzamčeny tvým kostěným klíčem.
items.artifacts.skeletonkey.force_lock=Zámek bez tvého kostěného klíče ochabl. Povedlo se ti ho otevřít násilím.
items.artifacts.skeletonkey.discard=Vyhazuješ přebytečné klíče.
items.artifacts.skeletonkey.levelup=Tvůj kostěný klíč nabývá na síle!
items.artifacts.skeletonkey.desc=Důležitě vypadající klíč s hlavou ve tvaru lebky. Zdá se, jako by drážky na jeho ozubí změnily tvar pokaždé, když se na něj podíváš.
items.artifacts.skeletonkey.desc_worn=Zdá se, že tento kouzelný klíč nabývá na síle tím, že ho používáš místo běžných klíčů v kobce. Lze ho vložit do jakéhokoliv zámku a tím ho odemknout nebo uzamknout, bez ohledu na to, jestli byl předtím zamčený nebo ne.\n\nKlíč lze dokonce použít i na uzamčení vzduchu na místě v tvé těěsné blízkosti, čímž vytvoří pevnou 3 políčka širokou stěnu na 10 tahů. Vytvoření této stěny odtlačí nepřátele dozadu, pokud je k tomu místo.
items.artifacts.skeletonkey.desc_cursed=Prokletý klíč se aktivně brání tomu, abys ho vsunul do jakéhokoliv zámku, a také ti znesnadňuje (ale neznemožňuje) používání všech ostatních klíčů.
items.artifacts.skeletonkey$keywall.desc=Kostěný klíč zde vytvořil dočasnou magickou zeď.

items.artifacts.talismanofforesight.name=Talisman předtuchy
items.artifacts.talismanofforesight.ac_scry=ODHALIT
items.artifacts.talismanofforesight.low_charge=Talisman vyžaduje pro odhalení alespoň 5% nabití.
items.artifacts.talismanofforesight.prompt=Urči směr odhalení
items.artifacts.talismanofforesight.levelup=Tvůj talisman se stává silnějším!
items.artifacts.talismanofforesight.full_charge=Tvůj talisman je plně nabitý!
items.artifacts.talismanofforesight.desc=Hladký kámen se zvláštními rytinami. Cítíš, jakoby sledoval vše okolo tebe a také dokázal zpozorovat cokoliv, co je skryté.
items.artifacts.talismanofforesight.desc_worn=Když talisman držíš, cítíš, že jsou tvé smysly zesíleny. Talisman se pomalu nabíjí nejen postupem času, ale také když objevíš skryté dveře či pasti.\n\nTalisman může využít své nabití a v kuželovitém tvaru daným směrem 'odhalit' všechny plochy a skryté věci. To ti na krátkou dobu umožní uvidět také nepřátele a předměty.
items.artifacts.talismanofforesight.desc_cursed=Prokletý talisman zírá přímo do tvého nitra, což otupuje tvé smysly.
items.artifacts.talismanofforesight$foresight.name=předpověď
items.artifacts.talismanofforesight$foresight.uneasy=Cítíš se neklidně.
items.artifacts.talismanofforesight$foresight.desc=Cítíš se nervózně, jako kdyby bylo poblíž neviděné nebezpečí.

items.artifacts.timekeepershourglass.name=Hodiny strážce času
items.artifacts.timekeepershourglass.ac_activate=POUŽÍT
items.artifacts.timekeepershourglass.deactivate=Rušíš zamrznutí času.
items.artifacts.timekeepershourglass.no_charge=Tvé hodiny se pro další použití ještě dostatečně nedobily.
items.artifacts.timekeepershourglass.cursed=Nemůžeš použít prokleté hodiny.
items.artifacts.timekeepershourglass.onstasis=Zdá se, že svět kolem tebe se v mžiku pohnul.
items.artifacts.timekeepershourglass.onfreeze=Vše kolem tebe najednou zamrzá v čase.
items.artifacts.timekeepershourglass.stasis=Zastavit mě v čase
items.artifacts.timekeepershourglass.freeze=Zastavit čas okolo mě
items.artifacts.timekeepershourglass.prompt=Jak si přeješ použít magii hodin?\n\nPokud se zamrazíš v čase, bude čas kolem normálně plynout, zatímco ty budeš zastavený a zcela nezranitelný. Tím se spotřebují 2 nabití.\n\nPokud zastavíš čas kolem sebe, budeš se moci pohybovat, aniž by to trvalo nějaký čas. To je možné kdykoliv zrušit použitím hodin nebo zaútočením.
items.artifacts.timekeepershourglass.desc=Tyto ozdobné přesýpací hodiny vypadají poměrně skromně. Z jejich jemně vytesané konstrukce ovšem cítíš velkou moc. Jak otáčíš přesýpacími hodinami a sleduješ proudící písek, pociťuješ jak tebou jejich magie jemně škube. Použití této magie ti zajisté dá nějakou kontrolu nad časem.
items.artifacts.timekeepershourglass.desc_hint=Vypadá to, že hodiny ztratili nějaký svůj písek, snad by se dal někde najít...
items.artifacts.timekeepershourglass.desc_cursed=Prokleté hodiny přilnuli k tvém boku. Cítíš, jak se snaží zmanipulovat tvůj pohyb časem.
items.artifacts.timekeepershourglass$timefreeze.name=Zastavení času
items.artifacts.timekeepershourglass$timefreeze.desc=Čas kolem tebe byl zastaven, díky čemuž můžeš provádět akce okamžitě. Efekt bude trvat, dokud ho nezrušíš nebo dokud se hodiny nevybijí. Útoky nebo koužívání kouzel tento efekt také zruší.\n\nZbývá tahů než se spotřebuje použití: %s.
items.artifacts.timekeepershourglass$sandbag.name=Pytlík magického písku
items.artifacts.timekeepershourglass$sandbag.levelup=Přidáváš písek do svých hodin.
items.artifacts.timekeepershourglass$sandbag.maxlevel=Tvé hodiny jsou magickým pískem už úplně naplněny!
items.artifacts.timekeepershourglass$sandbag.no_hourglass=Nemáš hodiny do kterých by se písek vložil.
items.artifacts.timekeepershourglass$sandbag.desc=Tento malý váček jemného písku se skvěle hodí ke tvým hodinám.\n\nJe podivné, že kupec má tento konkrétní předmět zrovna když ho potřebuješ...

items.artifacts.unstablespellbook.name=Nestabilní kniha kouzel
items.artifacts.unstablespellbook.ac_read=ČÍST
items.artifacts.unstablespellbook.ac_add=PŘIDAT
items.artifacts.unstablespellbook.blinded=Nemůžeš číst z knihy, když nic nevidíš.
items.artifacts.unstablespellbook.no_charge=Tvá kniha právě teď nemá energii.
items.artifacts.unstablespellbook.cursed=Nemůžeš číst z prokleté knihy.
items.artifacts.unstablespellbook.prompt=Vyber svitek
items.artifacts.unstablespellbook.infuse_scroll=Vkládáš do knihy energii ze svitku.
items.artifacts.unstablespellbook.unable_scroll=Nedokážeš tento svitek přidat do knihy.
items.artifacts.unstablespellbook.unknown_scroll=Ještě nevíš, co je to za svitek.
items.artifacts.unstablespellbook.desc=Tato kniha je vzhledem ke svému věku v překvapivě dobrém stavu. Během listování stránkami syčí a praská pod návalem nestabilní energie. Pokud z této knihy něco přečteš, není jisté jaké kouzlo tím vyvoláš.
items.artifacts.unstablespellbook.desc_cursed=Prokletá kniha se k tobě přichytila a brání ti v možnosti používat většinu svitků.
items.artifacts.unstablespellbook.desc_index=Kniha je neúplná. Ovšem její rejstřík odkazuje na následující prázdné stránky:
items.artifacts.unstablespellbook.desc_empowered=Svitky, které byli přidány do knihy, září magickou silou. Budeš si moci vybrat vzácnou verzi efektu těchto svitků, ale artefakt to bude stát více nabití.
items.artifacts.unstablespellbook.read_empowered=Svitek, který byl přidán do knihy, přerůstá energií. Máš možnost vyvolat běžnou nebo vzácnou verzi efektu tohoto svitku.\n\nVýběr vzácné varianty bude stát artefakt dvě nabití, namísto jednoho.



###bags
items.bags.bag.name=Batoh
items.bags.bag.discover_hint=Tento předmět můžeš zakoupit v obchodě.

items.bags.potionbandolier.name=Pás na lektvary
items.bags.potionbandolier.desc=Tento silný bandalír se ti omotává kolem hrudníku jako šerpa. Má mnoho izolačních popruhů na držení lahviček s lektvary, tvého měchu na vody nebo lahviček s tekutým kovem.\n\nLektvary uvnitř bandalíru by měly být chráněny před chladem.

items.bags.scrollholder.name=Tuba na svitky
items.bags.scrollholder.desc=Tato dlouhá, válcovitá nádoba vypadá vhodně na rozličné astronomické náčiní a plánky, ale tvoje svitky se do ní také vejdou. Navíc je v ní několik přihrádek, do nichž se hezky vejdou tvé kouzelné krystaly, rydla a prášky.\n\nTuba nevypadá hořlavě, takže tvé svitky by v ní měly být v bezpečí před ohněm.

items.bags.velvetpouch.name=Sametový váček
items.bags.velvetpouch.desc=Tento malý sametový váček v sobě může uchovat malé předměty, jako třeba semínka, runové kameny a některé alchymické přísady.
items.bags.velvetpouch.discover_hint=S tímto předmětem začíná jeden z hrdinů.

items.bags.magicalholster.name=Magické pouzdro
items.bags.magicalholster.desc=Tohle štíhlé pouzdro je vyrobeno z kůže nějakého vzácného zvířete a obdařeno silnou magií, která umožňuje uvnitř uchovat masivní množství zbraní na dálku.\n\nMůžeš do něj jednoduše sáhnout a vždy vytáhnout předmět, který přesně hledáš.\n\nVzhledem k magickým vlastnostem pouzdra se v něm hůlky budou dobíjet trochu rychleji a vrhací zbraně o trochu déle vydrží.



###bombs
items.bombs.arcanebomb.name=Magická bomba
items.bombs.arcanebomb.desc=Tato bomba byla naplněna magickými vlastnostmi. Exploduje v mocný výbuch, podobný Slizákovu nafukujícímu útoku, čímž způsobí _%1$d-%2$d magického poškození_ všemu v okruhu 2 políček.
items.bombs.arcanebomb.discover_hint=Tento předmět můžeš vyrobit pomocí alchymie.

items.bombs.bomb.name=Bomba
items.bombs.bomb.ac_lightthrow=ZAPÁLIT A HODIT
items.bombs.bomb.snuff_fuse=Rychle hasíš zápalnou šňůru bomby.
items.bombs.bomb.ondeath=Výbuch tě zabíjí...
items.bombs.bomb.rankings_desc=Zabil tě výbuch
items.bombs.bomb.desc=Poměrně robustní bomba plněná černým prachem. Její výbuch způsobí _%1$d-%2$d poškození_ všemu na sousedících políčkách, a také může zničit některé předměty nebo terén.
items.bombs.bomb.desc_fuse=Vypadá to, že zápalné šňůře bude pár kol trvat, než po zapálení celá shoří.
items.bombs.bomb.desc_burning=Zápalná šňůra bomby je zapálená! Drž se dál nebo ji rychle seber a uhas!
items.bombs.bomb$doublebomb.name=Dvě bomby
items.bombs.bomb$doublebomb.desc=Sada dvou robustních černých prachových bomb. Vypadá to, že jednu máš zdarma!

items.bombs.firebomb.name=Ohnivá bomba
items.bombs.firebomb.desc=Tato bomba byla upravena, aby svým výbuchem zasáhla širší oblast, čímž způsobí _%1$d-%2$d poškození_ a zaplaví sytými plameny vše v okruhu 2 políček.
items.bombs.firebomb.discover_hint=Tento předmět můžeš vyrobit pomocí alchymie.

items.bombs.flashbangbomb.name=Oslepující bomba
items.bombs.flashbangbomb.desc=Tato upravená bomba vybuchne v prudkém výšlehu světla, zvuku a elektřiny. Vše v okruhu 2 políček utrpí _%1$d-%2$d poškození_ z výbuchu, navíc 25%% poškození elektřinou a navíc bude omráčeno na 10 kol.
items.bombs.flashbangbomb.discover_hint=Tento předmět můžeš vyrobit pomocí alchymie.

items.bombs.frostbomb.name=Mrazivá bomba
items.bombs.frostbomb.desc=Tato bomba byla upravena, aby svým výbuchem zasáhla širší oblast, čímž způsobí _%1$d-%2$d poškození_ v okruhu 2 políček a v zasažené oblasti vytvoří přetrvávající chlad.
items.bombs.frostbomb.discover_hint=Tento předmět můžeš vyrobit pomocí alchymie.

items.bombs.holybomb.name=Svěcená bomba
items.bombs.holybomb.desc=Tato bomba byla upravena tak, aby při výbuchu vyšlehla zábleskem svatého světla. Vše v okruhu 2 políček utrží _%1$d-%2$d poškození_ z exploze, a nemtrým či démonickým nepřátelům způsobí navíc 50%% poškození svatým světlem.
items.bombs.holybomb.discover_hint=Tento předmět můžeš vyrobit pomocí alchymie.

items.bombs.noisemaker.name=Hlučná bomba
items.bombs.noisemaker.desc=Jakmile zápalná šňůra dohoří, bude tato upravená bomba opakovaně vydávat hluk. Když se bomby něco dotkne, vybuchne a způsobí _%1$d-%2$d poškození_ všemu v okruhu 2 políček.
items.bombs.noisemaker.desc_burning=Hlučná bomba je odjištěná a vybuchne, když se k ní něco přiblíží!
items.bombs.noisemaker.discover_hint=Tento předmět můžeš vyrobit pomocí alchymie.

items.bombs.smokebomb.name=Dýmovnice
items.bombs.smokebomb.desc=Tato bomba byla upravena tak, aby spolu s výbuchem vypustila oblak hustého dýmu. Výbuchem způsobí _%1$d-%2$d poškození_ a vytvoří do vzdálenosti 2 políček oblak zahalující mlhy.
items.bombs.smokebomb.discover_hint=Tento předmět můžeš vyrobit pomocí alchymie.

items.bombs.regrowthbomb.name=Růstová bomba
items.bombs.regrowthbomb.desc=Tato upravená bomba kolem sebe namísto výbuchu rozstříkne životadárnou tekutinu. Zasažená oblast do 3 políček rychle zaroste trávou a rostlinami. Ty a každý spojenec zachycený v dosahu budete léčeni stejně, jako byste vypili lektvar léčení.
items.bombs.regrowthbomb.discover_hint=Tento předmět můžeš vyrobit pomocí alchymie.

items.bombs.shrapnelbomb.name=Střepinová bomba
items.bombs.shrapnelbomb.desc=Tato bomba byla upravena útržky kovu z DM-300, které se po výbuchu roztříští a všude rozletí, což čemukoliv ve velkém dosahu okolo bomby udělí _%1$d-%2$d poškození_. Bude lepší se po použití za něco schovat...
items.bombs.shrapnelbomb.discover_hint=Tento předmět můžeš vyrobit pomocí alchymie.

items.bombs.woollybomb.name=Stádová bomba
items.bombs.woollybomb.desc=Tato upravená bomba vytvoří po výbuchu velikou plochu z magických ovcí. Samotný výbuch způsobí _%1$d-%2$d poškození_ všem v okruhu 2 políček. Bombou vyvolané ovce budou překážet v pohybu a vydrží velmi dlouhou dobu! Ovce však nevydrží tak dlouho v blízkosti mocných nepřátel a lze je odčarovat dříve tím, že s nimi budeš interagovat.
items.bombs.woollybomb.discover_hint=Tento předmět můžeš vyrobit pomocí alchymie.

###food
items.food.berry.name=Jedlá bobule
items.food.berry.eat_msg=Ta bobule chutnala skvěle!
items.food.berry.desc=Tuto malou bobuli našla Lovkyně mezi podzemní vegetací. Lze ji sníst rychle, obnoví malé množství hladu, a navíc může obsahovat užitečné semínko!
items.food.berry.discover_hint=Tento předmět můžeš najít pomocí specifické schopnosti hrdiny.

items.food.blandfruit.name=Popelice
items.food.blandfruit.cooked=Vařená Popelice
items.food.blandfruit.sunfruit=Slunice
items.food.blandfruit.rotfruit=Hnilice
items.food.blandfruit.earthfruit=Kořenice
items.food.blandfruit.blindfruit=Zmizice
items.food.blandfruit.firefruit=Ohnivice
items.food.blandfruit.icefruit=Ledice
items.food.blandfruit.fadefruit=Viděnice
items.food.blandfruit.sorrowfruit=Jedovice
items.food.blandfruit.stormfruit=Bouřnice
items.food.blandfruit.dreamfruit=Mágovoce
items.food.blandfruit.starfruit=Hvězdnice
items.food.blandfruit.swiftfruit=Rychlice
items.food.blandfruit.raw=Nesneseš sníst to syrové.
items.food.blandfruit.desc=Tak suché a bez chuti. Podušení s další ingrediencí by to možná zlepšilo.
items.food.blandfruit.desc_cooked=Plod nabyl při povaření v kotlíku na objemu a dokonce i nasákl vlastnosti semínka, se kterým byl uvařen. Po snědení či použití se projeví efekt takového lektvaru, kterému odpovídá použité semínko.
items.food.blandfruit.desc_eat=Vypadá to, že je připraven k jídlu!
items.food.blandfruit.desc_throw=Zdá se být hodně nestálý, možná by bylo nejlepší jej hodit.
items.food.blandfruit$chunks.name=Kousky Popelice
items.food.blandfruit$chunks.desc=Popelice se nárazem rozprskla a zanechala po sobě jen kousky.\n\nI přes trochu hlíny se zdá, že jsou tyto velké kusy vařené Popelice perfektně jedlé.

items.food.chargrilledmeat.name=Propečené maso
items.food.chargrilledmeat.desc=Vypadá jako docela slušný steak.
items.food.chargrilledmeat.discover_hint=Tento předmět můžeš získat pomocí jiného jídla.

items.food.food.name=Porce jídla
items.food.food.ac_eat=JÍST
items.food.food.eat_msg=Chutnalo to výborně!
items.food.food.desc=Nic zvláštního: sušené maso, pár sušenek - podobné věci.

items.food.frozencarpaccio.name=Zmražené maso
items.food.frozencarpaccio.invis=Ruce ti zmizely před očima!
items.food.frozencarpaccio.hard=Cítíš, jak tvá kůže tvrdne!
items.food.frozencarpaccio.refresh=Osvěžující!
items.food.frozencarpaccio.better=Cítíš se lépe!
items.food.frozencarpaccio.desc=Kousek zmraženého syrového masa. Jediný způsob, jak ho jíst, je odřezáváním tenkých plátků. A je to překvapivě dobré.
items.food.frozencarpaccio.discover_hint=Tento předmět můžeš získat pomocí jiného jídla.

items.food.meatpie.name=Masový koláč
items.food.meatpie.eat_msg=Bylo to neuvěřitelně dobré!
items.food.meatpie.desc=Výtečný koláč plněný lahodným masem. Tohle tě zasytí mnohem víc než jakékoliv jiné jídlo.
items.food.meatpie.discover_hint=Tento předmět můžeš vyrobit pomocí alchymie.

items.food.mysterymeat.name=Tajemné maso
items.food.mysterymeat.eat_msg=Chutnalo to... zvláštně.
items.food.mysterymeat.hot=Ou, je to horké!
items.food.mysterymeat.legs=Necítíš své nohy!
items.food.mysterymeat.not_well=Není ti příliš dobře.
items.food.mysterymeat.stuffed=Cítíš se sytě.
items.food.mysterymeat.desc=Požití na vlastní riziko!
items.food.mysterymeat.discover_hint=Tento předmět můžeš získat jako kořist z některých nepřátel.
items.food.mysterymeat$placeholder.name=Maso

items.food.phantommeat.name=Přízračné maso
items.food.phantommeat.desc=Velký třpytivý plátek masa ukrojený z přízračné piraně. Toto kouzelné maso není potřeba vařit a poskytuje po snězení řadu defensivních výhod, a navíc tě plně zasytí. Po snězení ti poskytne neviditelnost, zdřevnatění, částečně tě vyléčí a navíc odstraní řadu škodlivých efektů.
items.food.phantommeat.discover_hint=Tento předmět můžeš získat jako kořist z některých nepřátel.

items.food.pasty.name=Piroh
items.food.pasty.fish_name=Dušená ryba
items.food.pasty.amulet_name=Amulet Yendoru?
items.food.pasty.egg_name=Velikonoční vejce
items.food.pasty.rainbow_name=Duhový lektvar
items.food.pasty.shattered_name=Zelený dort
items.food.pasty.pie_name=Dýňový koláč
items.food.pasty.vanilla_name=Modrý dort
items.food.pasty.cane_name=Sladká tyčka
items.food.pasty.sparkling_name=Třpytivý lektvar
items.food.pasty.desc=Nefalšovaný cornwallský piroh s tradiční náplní z hovězího masa a brambor. Vynikající!
items.food.pasty.fish_desc=Celá dušená ryba, magicky uchovaná na zeleninovém lůžku. Je tradicí si nechat kousek ryby na později, proto si necháš nějaké zbytky, místo abys ji snědl celou naráz.\n\nŠťastný Lunární Nový rok!
items.food.pasty.amulet_desc=Konečně jsi ho našel, opěvovaný Amule - tak moment, tohle je jen kousek čokolády zabalený tak, aby vypadal jako amulet! Sice ti neposkytne neomezenou moc, ale aspoň tě zasytí a trošku doplní tvé artefakty.\n\nApríl!
items.food.pasty.egg_desc=Velké čokoládové vejce zabalené v barevné žluté fólii. Je dost velké, aby tě zasytilo, a jeho sladká chuť by mohla lehce doplnit tvé artefakty.\n\nVeselé Velikonoce!
items.food.pasty.rainbow_desc=Tato barvami hýřící kapalina je druhem tekuté stravy. Krom zasycení tvého hladu dokáže její magie uklidnit sousedícího nepřítele, krom bossů, který s tebou po nějakou dobu nebude chtít bojovat!\n\nHezké svátky hrdosti!
items.food.pasty.shattered_desc=Tento veliký kus vanilkového dortu je pokryt barevnými posypkami a zelenou polevou. Dort byl upečen k oslavě mnoha let zkušeností, a po snězení ti nějaké zkušenosti přidá.\n\nShattered Pixel Dungeon byl poprvé spuštěn 5. srpna 2014. Všechno nejlepší, Shattered Pixel Dungeone!
items.food.pasty.pie_desc=Pořádně velký kousek dýňového koláče. Jeho sladká a kořeněná chuť tě nasytí a také trochu vyléčí.\n\nVeselý Halloween!
items.food.pasty.vanilla_desc=Tento veliký kus vanilkového dortu je pokryt barevnými posypkami a modrou polevou. Dort byl upečen k oslavě mnoha let zkušeností, a po snězení ti nějaké zkušenosti přidá.\n\nPůvodní Pixel Dungeon byl poprvé spuštěn 4. prosince 2012. Všechno nejlepší, Pixel Dungeone!
items.food.pasty.cane_desc=Obrovská cukrová tyč. Dost velká na to, aby tě zasytila, a cukr by navíc mohl o trochu víc dobít tvé hůlky.\n\nVeselé Vánoce!
items.food.pasty.sparkling_desc=Tento třpytivý lektvar je formou tekuté stravy. Zasytí hlad a svou chutí připomíná šumivé víno, ačkoliv není alkoholický. Hřejivý pocit v tvém břiše ti poskytne nějakou dodatečnou ochranu.\n\nŠťastný Nový rok!
items.food.pasty$fishleftover.name=Zbytky ryby
items.food.pasty$fishleftover.eat_msg=Chutnalo to dobře.
items.food.pasty$fishleftover.desc=Kousek ryby, která zbyla z tvého předchozího pokrmu. Kdykoliv ji můžeš dojíst a trochu zasytit svůj hlad.

items.food.smallration.name=Malá porce jídla
items.food.smallration.eat_msg=Chutnalo to dobře.
items.food.smallration.desc=Vypadá úplně stejně jako normální balíček jídla, jen je menší.
items.food.smallration.discover_hint=Tento předmět můžeš zakoupit v obchodě.

items.food.stewedmeat.name=Dušené maso
items.food.stewedmeat.eat_msg=Chutnalo to dobře.
items.food.stewedmeat.desc=Podušení očistilo maso od všech chorob a parazitů. Nyní by mělo být bezpečné ho sníst.
items.food.stewedmeat.discover_hint=Tento předmět můžeš vyrobit pomocí alchymie.

items.food.supplyration.name=Zásobní porce
items.food.supplyration.desc=Tuto porci jídla si v kobce schovali členové cechu zlodějů pro případy nouze. Byla navržena, aby se dala rychle sníst během akce, ať už jde o jakoukoliv lumpárnu.\n\nAčkoliv tě nezasytí tolik, jako normální porce, můžeš ji sníst rychleji a obnoví ti trochu životů a nabití pláště stínů.
items.food.supplyration.discover_hint=Tento předmět můžeš najít pomocí specifické schopnosti hrdiny.



##journal items
items.journal.documentpage.name=Vytrhnutá stránka
items.journal.documentpage.desc=Osamělá stránka, pravděpodobně vytrhá z nějaké knihy. Musíš ji zvednout, aby se dala přečíst.

items.journal.alchemypage.name=Stránka z příručky alchymie
items.journal.alchemypage.desc=Vytrhnutá stránka z příručky o alchymii.\n\nVětšina textu je příliš malá, aby se dala z dálky přečíst, ale zřetelně vidíš nadpis stránky:\n\n_"%s"_

items.journal.guidebook.name=Kniha mistrů podzemí
items.journal.guidebook.hint_mobile=Tvá kniha má pro tebe radu! Zmáčkni blikající ikonu příručky vpravo nahoře, aby sis ji přečetl.
items.journal.guidebook.hint_desktop=Tvá kniha má pro tebe radu! Zmáčkni blikající ikonu příručky (%s) vpravo nahoře, aby sis ji přečetl.
items.journal.guidebook.hint_status=Příručka
items.journal.guidebook.desc=Příručka dobrodruha, kterou tu nechal někdo, kdo si řekl, že dobrodružství není nic pro něj! Tahle kniha je kouzelná, a proto dokáže pobídnout dobrodruhy, aby si nějakou stránku přečetli v pravou chvíli.\n\nPřes její funkčnost je kniha nejpopulárnější díky do očí bijícímu nápisu ''Nepanikař!'' napsanému velkým zdobeným písmem na obalu knihy.

items.journal.guidepage.name=Stránka z příručky
items.journal.guidepage.desc=Stránka vytrhnutá z příručky dobrodruha.\n\nVětšina textu je příliš malá, aby se dala z dálky přečíst, ale zřetelně vidíš nadpis stránky:\n\n_"%s"_

items.journal.regionlorepage$sewers.name=Starý dopis
items.journal.regionlorepage$sewers.desc=Vypadá to jako dopis napsaný na špinavém kusu papíru. Budeš ho muset sebrat, abys zjistil, co je tam napsáno.

items.journal.regionlorepage$prison.name=Špinavý úvod deníku
items.journal.regionlorepage$prison.desc=Začátek deníku, nebo nějaké jiné písemnosti, napsaný na starém kusu papíru. Zdá se zachovalejší než dopis, který jsi našel v kanálech, ale stejně ho budeš muset sebrat, abys ho přečetl.

items.journal.regionlorepage$caves.name=Starý deník
items.journal.regionlorepage$caves.desc=To, co se zdá jako úvod dobrodruhova deníku, se zachovalo překvapivě dobře, na to, jak musí být starý. Pro přečtení ho seber.

items.journal.regionlorepage$city.name=Zrezlá tabulka
items.journal.regionlorepage$city.desc=Malá rezavá kovová tabulka s magicky vyleptanou zprávou. Písmena jsou i přes stáří tabulky stále jasná, budeš ji však muset sebrat, abys je dokázal přečíst.

items.journal.regionlorepage$halls.name=Svítící tabulka
items.journal.regionlorepage$halls.desc=Malá černá tabulka se zářícími zelenými písmeny vyleptanými v ní. Svítící znaky se zdálky rozmazávají v oparu, budeš ji muset sebrat, abys je přečetl.


###keys
items.keys.goldenkey.name=Zlatý klíč
items.keys.goldenkey.desc=Výřezy na tomto zlatém klíči jsou drobné a složité. Možná by mohl otevřít zamčenou truhlu?

items.keys.crystalkey.name=Krystalový klíč
items.keys.crystalkey.desc=Jemně vybroušené plošky toho krystalového klíče se třpytí ve tmě. Možná jím půjde otevřít něco z křišťálu?

items.keys.ironkey.name=Železný klíč
items.keys.ironkey.desc=Výřezy na tomto starém železném klíči jsou velmi opotřebované. Stejně tak i jeho kožená šňůrka. Jaké dveře by mohl asi otevřít?

items.keys.wornkey.name=Starý klíč
items.keys.wornkey.desc=Tento klíč je opotřebený a orezlý, ale vypadá důležitě. Nejspíš bude otevírat nějaké důležité dveře v okolí.



###potions
items.potions.potion.ac_drink=PÍT
items.potions.potion.turquoise=Tyrkysový lektvar
items.potions.potion.crimson=Karmínový lektvar
items.potions.potion.azure=Azurový lektvar
items.potions.potion.jade=Nefritový lektvar
items.potions.potion.golden=Zlatý lektvar
items.potions.potion.magenta=Purpurový lektvar
items.potions.potion.charcoal=Uhelný lektvar
items.potions.potion.ivory=Slonovinový lektvar
items.potions.potion.amber=Jantarový lektvar
items.potions.potion.bistre=Mahagonový lektvar
items.potions.potion.indigo=Indigový lektvar
items.potions.potion.silver=Stříbrný lektvar
items.potions.potion.unknown_desc=Tato lahvička obsahuje vířící barevnou kapalinu. Kdo ví, co tento lektvar způsobí, když se vypije nebo hodí?
items.potions.potion.harmful=Škodlivý lektvar!
items.potions.potion.beneficial=Prospěšný lektvar!
items.potions.potion.yes=Ano, vím co dělám
items.potions.potion.no=Ne, rozmýšlím si to
items.potions.potion.sure_drink=Opravdu chceš tento lektvar vypít? Ve většině případů by se měl hodit po nepřátelích.
items.potions.potion.sure_throw=Opravdu chceš tento lektvar hodit? Ve většině případů dává smysl ho vypít.
items.potions.potion.shatter=Lektvar se roztříštil a jeho obsah se neškodně rozstříkl.
items.potions.potion.discover_hint=Tento předmět můžeš najít v kobce nebo vyrobit pomocí alchymie.
items.potions.potion$placeholder.name=Lektvar
items.potions.potion$seedtopotion.name=Náhodný lektvar

items.potions.potionofexperience.name=Lektvar zkušeností
items.potions.potionofexperience.desc=Zkušenosti z mnoha bitev koncentrované do tekuté podoby. Tento nápoj okamžitě zvýší tvoji úroveň.

items.potions.potionoffrost.name=Lektvar mrazu
items.potions.potionoffrost.desc=Chemikálie obsažená v tomto lektvaru se při kontaktu se vzduchem vypaří do mrazivého oblaku.

items.potions.potionofhaste.name=Lektvar rychlosti
items.potions.potionofhaste.energetic=Cítíš nával energie!
items.potions.potionofhaste.desc=Vypití této podivně sladké tekutiny tě na krátkou dobu zaplní obrovskou energií, což ti umožní běžet vysokou rychlostí.

items.potions.potionofhealing.name=Lektvar léčení
items.potions.potionofhealing.heal=Tvé rány se začínají zavírat.
items.potions.potionofhealing.desc=Tento lektvar rychle obnoví tvé zdraví a okamžitě tě i zbaví některých nepříznivých efektů.

items.potions.potionofinvisibility.name=Lektvar neviditelnosti
items.potions.potionofinvisibility.invisible=Ruce ti zmizely před očima!
items.potions.potionofinvisibility.desc=Vypití tohoto lektvaru ti dočasně poskytne neviditelnost. Během neviditelnosti tě nepřátelé nebudou schopni vidět. Fyzické útoky a magické efekty (jako svitky nebo hůlky) neviditelnost okamžitě zruší.

items.potions.potionoflevitation.name=Lektvar levitace
items.potions.potionoflevitation.float=Vznášíš se ve vzduchu!
items.potions.potionoflevitation.desc=Vypití této podivné tekutiny způsobí, že se budeš vznášet ve vzduchu, což ti umožní se snadno přesouvat nad pastmi a propastmi. Rozbití tohoto lektvaru vytvoří oblak matoucího plynu, dezorientující cokoliv, co se do něj chytí.

items.potions.potionofliquidflame.name=Lektvar tekutého ohně
items.potions.potionofliquidflame.desc=Tato lahvička obsahuje nestabilní směs, která při kontaktu se vzduchem prudce vzplane.

items.potions.potionofmindvision.name=Lektvar vidění
items.potions.potionofmindvision.see_mobs=Nějak dokážeš cítit přítomnost myslí ostatních tvorů!
items.potions.potionofmindvision.see_none=Dokážeš s jistotou říct, že jsi na tomto patře v tuto chvíli o samotě.
items.potions.potionofmindvision.desc=Po vypití bude tvá mysl citlivá na psychické vnímání vzdálených tvorů, což ti umožní cítit jejich biologickou přítomnost skrze zdi. Také ti tento lektvar umožní vidět přes blízké zdi a dveře.

items.potions.potionofparalyticgas.name=Lektvar paralyzujícího plynu
items.potions.potionofparalyticgas.desc=Při kontaktu se vzduchem se kapalina v této lahvičce vypaří do znecitlivujícího žlutého oparu. Každý, kdo plyn vdechne, bude okamžitě paralyzován, nebude schopen se vůbec pohybovat a to i chvíli po tom, co se plyn rozptýlí. Lektvar můžeš hodit po vzdálených nepřátelích a tím je v efektu plynu zachytit.

items.potions.potionofpurity.name=Lektvar čistoty
items.potions.potionofpurity.freshness=Cítíš ve vzduchu neobvyklou svěžest.
items.potions.potionofpurity.protected=Obklopuje tě jakási ochranná vrstva!
items.potions.potionofpurity.desc=Tato magická látka rychle neutralizuje všechny škodlivé efekty v širokém dosahu, které ovlivňují okolní prostředí. Vypití ti vůči takovým efektům poskytne dočasnou imunitu.

items.potions.potionofstrength.name=Lektvar síly
items.potions.potionofstrength.msg=Tvým tělem proudí nově objevená síla. Nyní máš %d síly!
items.potions.potionofstrength.desc=Tato mocná tekutina proteče skrze svaly a trvale zvýší tvou fyzickou sílu o jeden bod.

items.potions.potionoftoxicgas.name=Lektvar toxického plynu
items.potions.potionoftoxicgas.desc=Odzátkování nebo roztříštění této přetlakované skleničky způsobí, že její obsah vybuchne ve smrtící oblak toxického zeleného plynu. Možná bude rozumné jej hodit po vzdálených nepřátelích, než ho otevírat v ruce.



###brews
items.potions.brews.brew.discover_hint=Tento předmět můžeš vyrobit pomocí alchymie.

items.potions.brews.aquabrew.name=Vodní směs
items.potions.brews.aquabrew.desc=Po rozbití tato směs vypustí na místě dopadu proudy silně stlačené vody. Proud je dost silný, aby ublížil pouze ohnivým nepřátelům, ale rozšíří kolem místa dopadu vodu, zaplaví pasti, uhasí ohně a odmrští postavy v zasažené oblasti.

items.potions.brews.blizzardbrew.name=Směs ledové vichřice
items.potions.brews.blizzardbrew.desc=Po rozbití tato směs vypustí vířící mrazivou vichřici, která se bude rychle šířit, podobně jako plyn.

items.potions.brews.causticbrew.name=Směs žíraviny
items.potions.brews.causticbrew.desc=Tato směs rozšíří žíravý sliz do široké oblasti kolem místa, kde se lahvička roztříští. Jakékoliv stvoření zachycené v tomto slizu se začne pomalu rozpouštět, pokud se nedokáže omýt ve vodě.

items.potions.brews.infernalbrew.name=Směs ohnivého pekla
items.potions.brews.infernalbrew.desc=Po rozbití tato směs vypustí běsnící ohnivé peklo, které se šíří podobně jako plyn.

items.potions.brews.shockingbrew.name=Směs elektrické bouře
items.potions.brews.shockingbrew.desc=Po rozbití vytvoří tato směs elektrickou bouři v široké oblasti kolem místa, kde se rozbije.

items.potions.brews.unstablebrew.name=Nestabilní směs
items.potions.brews.unstablebrew.desc=Tato magická směs svítí měnícími se barvami duhy.\n\nPo vypití nebo hození se směs projeví jako náhodný lektvar. Účinek lektvaru bude vždy blahodárný, pokud bude vypita, a vždy škodlivý, pokud bude hozena.

###elixirs
items.potions.elixirs.elixir.discover_hint=Tento předmět můžeš vyrobit pomocí alchymie.

items.potions.elixirs.elixirofarcanearmor.name=Elixír magické zbroje
items.potions.elixirs.elixirofarcanearmor.desc=Tento elixír poskytne tomu, kdo jej vypije, dlouhotrvající odolnost vůči magickému poškození.

items.potions.elixirs.elixirofaquaticrejuvenation.name=Elixír vodního omlazení
items.potions.elixirs.elixirofaquaticrejuvenation.desc=Tento elixír obsahuje Slizákovi zbytky obohacené lektvarem léčení. Ačkoliv neposkytne okamžité uzdravení, po malých dávkách ti doplní velké množství zdraví, pokaždé když budeš stát ve vodě.
items.potions.elixirs.elixirofaquaticrejuvenation$aquahealing.name=Vodní léčení
items.potions.elixirs.elixirofaquaticrejuvenation$aquahealing.desc=Dočasně získáváš obnovující vlastnosti podobné těm Slizákovým.\n\nBěhem stání ve vodě se ti obnoví malé množství zdraví za tah. Efekt se pozastaví, pokud máš plné zdraví nebo když jsi mimo vodu.\n\nZbývající léčení: %d

items.potions.elixirs.elixirofdragonsblood.name=Elixír dračí krve
items.potions.elixirs.elixirofdragonsblood.desc=Po vypití proteče žilami toho, kdo tento elixír vypije, prudká ohnivá síla. Obdržený efekt tě udělá imunní vůči ohni a umožní ti zapálit nepřátele fyzickým útokem.

items.potions.elixirs.elixiroffeatherfall.name=Elixír lehkého dopadu
items.potions.elixirs.elixiroffeatherfall.light=Cítíš se lehce jako pírko!
items.potions.elixirs.elixiroffeatherfall.desc=Tento elixír se projevuje slabším, zato však snáze kontrolovatelným účinkem levitace, díky čemuž umožňuje svému uživateli se na nějakou chvíli snášet z velkých výšek, aniž by se zranil.
items.potions.elixirs.elixiroffeatherfall$featherbuff.name=Lehkost pírka
items.potions.elixirs.elixiroffeatherfall$featherbuff.desc=Jsi pod vlivem kouzla elixíru lehkého dopadu, což ti umožňuje spadnout do propasti, aniž by ses zranil!\n\nZbývá tahů: %s.

items.potions.elixirs.elixirofhoneyedhealing.name=Elixír léčivého medu
items.potions.elixirs.elixirofhoneyedhealing.desc=Tento elixír spojuje léčení se sladkou chutí medu. Po vypití tě vyléčí stejně jako lektvar léčení a navíc ukojí malé množství hladu, ale může být také hozen na spojence pro jejich vyléčení.\n\nPokud by se tento lektvar použil na nějaké stvoření s blízkým vztahem k medu, mohlo by třeba dojít k usmíření.

items.potions.elixirs.elixiroficytouch.name=Elixír ledového doteku
items.potions.elixirs.elixiroficytouch.desc=Po vypití umožní tento elixír tomu, kdo jej vypije, vysát teplo z nepřátel, na které útočí. Obdržený efekt tě udělá imunní vůči chladu a dovolí ti ochladit nepřítele fyzickým útokem.

items.potions.elixirs.elixirofmight.name=Elixír moci
items.potions.elixirs.elixirofmight.msg=Tvým tělem proudí nově objevená síla. Nyní máš %d síly!
items.potions.elixirs.elixirofmight.desc=Tato mocná tekutina proteče skrze svaly, trvale zvýší tvou fyzickou sílu o jeden bod a tvé zdraví dočasně o %d b. Velikost zvýšeného zdraví se přizpůsobuje tvému maximálnímu počtu životů, ale pomalu opadá s tím, jak se zvyšuje tvá úroveň.
items.potions.elixirs.elixirofmight$htboost.name=Zvýšené maximální zdraví
items.potions.elixirs.elixirofmight$htboost.desc=Cítíš, jak je tvé tělo nepřirozeně silné a zdravé.\n\nTvé maximální zdraví je na delší dobu zvýšeno. Tím, jak se bude zvyšovat tvá úroveň, zvýšení zdraví bude postupně slábnout.\n\nAktuální zvýšené množství: %d\nZbývající úrovně: %d

items.potions.elixirs.elixiroftoxicessence.name=Elixír toxické esence
items.potions.elixirs.elixiroftoxicessence.desc=Po vypití naplní tento elixír toho, kdo jej vypije, toxickou energií. Uživatel bude kolem sebe neustále šířit toxický plyn, a také se vůči němu i jiným jedům stane imunní na dobu o něco delší než je trvání efektu.



###exotic potions
items.potions.exotic.exoticpotion.turquoise=Vzácný tyrkysový lektvar
items.potions.exotic.exoticpotion.crimson=Vzácný karmínový lektvar
items.potions.exotic.exoticpotion.azure=Vzácný azurový lektvar
items.potions.exotic.exoticpotion.jade=Vzácný nefritový lektvar
items.potions.exotic.exoticpotion.golden=Vzácný zlatý lektvar
items.potions.exotic.exoticpotion.magenta=Vzácný purpurový lektvar
items.potions.exotic.exoticpotion.charcoal=Vzácný uhelný lektvar
items.potions.exotic.exoticpotion.ivory=Vzácný slonovinový lektvar
items.potions.exotic.exoticpotion.amber=Vzácný jantarový lektvar
items.potions.exotic.exoticpotion.bistre=Vzácný mahagonový lektvar
items.potions.exotic.exoticpotion.indigo=Vzácný indigový lektvar
items.potions.exotic.exoticpotion.silver=Vzácný stříbrný lektvar
items.potions.exotic.exoticpotion.unknown_desc=Tato kulatá lahvička obsahuje zrnitou barevnou kapalinu. Zdá se, že je velmi neobvyklá, takže kdo ví co to udělá, pokud se vypije nebo hodí?
items.potions.exotic.exoticpotion.warning=Opravdu chceš zrušit použití tohoto lektvaru? Tak či tak bude spotřebován.
items.potions.exotic.exoticpotion.yes=Ano, souhlasím
items.potions.exotic.exoticpotion.no=Ne, rozmýšlím si to
items.potions.exotic.exoticpotion.discover_hint=Tento předmět můžeš vyrobit pomocí alchymie.

items.potions.exotic.potionofcleansing.name=Lektvar očištění
items.potions.exotic.potionofcleansing.desc=Toto silná látka učiní toho, kdo ji vypije na pár tahů imuním vůči všem negativním efektům. Je také možné ji hodit na nějaký cíl a tím jej očistit.
items.potions.exotic.potionofcleansing$cleanse.name=Očištěn
items.potions.exotic.potionofcleansing$cleanse.desc=Tato postava je dočasně imunní vůči všem škodlivým efektům!\n\nZbývá tahů: %s.

items.potions.exotic.potionofcorrosivegas.name=Lektvar žíravého plynu
items.potions.exotic.potionofcorrosivegas.desc=Odšpuntování nebo rozbití této natlakované baňky způsobí, že její obsah exploduuje a vytvoří oblak rezavého smrtelně nebezpečného žíravého plynu. Plyn se šíří rychleji než toxický plyn a je nebezpečnější, ale nedrží se v okolí tak dlouho.

items.potions.exotic.potionofdragonsbreath.name=Lektvar dračího dechu
items.potions.exotic.potionofdragonsbreath.prompt=Urči směr vypálení
items.potions.exotic.potionofdragonsbreath.desc=Tato lahvička obsahuje neobvyklou sloučeninu, která se chvíli po tom, co se smíchá se slinami, vznítí v plameny. Rychlé vyplivnutí tekutiny umožní uživateli plivat svými ústy oheň!

items.potions.exotic.potionofearthenarmor.name=Lektvar dřevnaté zbroje
items.potions.exotic.potionofearthenarmor.desc=Namísto paralýzy, bude mít tato kapalina tvrdnoucí účinek na kůži, což ji v podstatě změní na dočasnou přírodní zbroj.

items.potions.exotic.potionofdivineinspiration.name=Lektvar nebeské inspirace
items.potions.exotic.potionofdivineinspiration.no_more_points=Nemůžeš získat více bodů schopností.
items.potions.exotic.potionofdivineinspiration.select_tier=Vyber si stupeň schopností, do něhož získáš dva body navíc. Abys je mohl utratit, musíš mít daný stupeň odemčený.
items.potions.exotic.potionofdivineinspiration.bonus=+2 body schopností!
items.potions.exotic.potionofdivineinspiration.desc=Svatá energie ve zkapalněné podobě. Uživatelem tohoto lektvaru prostoupí svatá síla, což mu poskytne dva body schopností do stupně dle jeho volby.\n\nTento lektvar lze použít jen jednou pro každý stupeň schopností.

items.potions.exotic.potionofmagicalsight.name=Lektvar magického zraku
items.potions.exotic.potionofmagicalsight.desc=Po vypití budou tvé smysly na krátkou dobu zesíleny na neuvěřitelnou úroveň, což ti umožní vidět přes zdi v okruhu 12 políček!

items.potions.exotic.potionofmastery.name=Lektvar mistrovství
items.potions.exotic.potionofmastery.prompt=Přizpůsobit se předmětu
items.potions.exotic.potionofmastery.weapon_easier=Tvou zbraň je snazší používat!
items.potions.exotic.potionofmastery.armor_easier=Tvou zbroj je nyní snazší nosit!
items.potions.exotic.potionofmastery.desc=Namísto hrubé síly přizpůsobí tento lektvar svaly svého uživatele přímo jednomu konkrétnímu předmětu. Díky tomu bude mnohem snazší s tímto předmětem zacházet, jako kdyby s ním uživatel dlouhodobě trénoval a jeho tělo si na něj zvyklo.\n\nVybraná zbraň nebo zbroj bude vyžadovat o 2 body síly méně. Lektvar lze použít ke každému předmětu jen jednou.

items.potions.exotic.potionofshielding.name=Lektvar chránění
items.potions.exotic.potionofshielding.desc=Namísto léčení vytvoří tento lektvar kolem uživatelova těla ochranný štít, blokující značné množství poškození.

items.potions.exotic.potionofshroudingfog.name=Lektvar zahalující mlhy
items.potions.exotic.potionofshroudingfog.desc=Při styku se vzduchem vytvoří kapalina v této lahvičce hustou dýmavou mlhu, která se rychle šíří a blokuje vidění tvých nepřátel.

items.potions.exotic.potionofsnapfreeze.name=Lektvar přímého zmražení
items.potions.exotic.potionofsnapfreeze.desc=Chemikálie obsažená v tomto lektvaru rychle zreaguje se vzduchem, což okamžitě zmrazí a přichytí k zemi všechny v dosahu.

items.potions.exotic.potionofstamina.name=Lektvar výdrže
items.potions.exotic.potionofstamina.desc=Vypití této podivně sladké tekutiny tě naplní dlouhotrvajícím nárůstem energie, který ti umožní běžet po delší dobu rychlejším tempem.

items.potions.exotic.potionofstormclouds.name=Lektvar bouřných mračen
items.potions.exotic.potionofstormclouds.desc=Rozbití tohoto lektvaru vytvoří rychle se šířící mrak přesycené vodní páry, která zkondenzuje a začne pršet na okolní terén. Většina okolního terénu se změní na vodu, ohniví nepřátelé budou zraňováni, oheň bude uhašen a pasti se zaplaví a rozbijí.



###quest items
items.quest.ceremonialcandle.name=Rituální svíčka
items.quest.ceremonialcandle.desc=Sada svíček, roztavených a spojených k sobě častým používáním.\n\nSamotné jsou bezcenné, ale při použití s ostatními svíčkami v nějakém schématu, mohou soustředit svou energii na vyvolávací rituál.
items.quest.ceremonialcandle.discover_hint=Tento předmět můžeš najít během jednoho z úkolů.

items.quest.corpsedust.name=Mrtvolný prach
items.quest.corpsedust.chill=Po zádech ti přeběhl mráz.
items.quest.corpsedust.desc=Hromádka mrtvolného prachu se navenek neliší od obyčejné hromádky prachu. Z této ovšem cítíš unikat zlovolnou energii.\n\nBude asi dobrý nápad se jí co nejdřív zbavit.
items.quest.corpsedust.discover_hint=Tento předmět můžeš najít během jednoho z úkolů.

items.quest.darkgold.name=Temné zlato
items.quest.darkgold.you_now_have=Právě máš %d kusů rudy temného zlata.
items.quest.darkgold.desc=Tento kov se nenazývá temným kvůli své barvě (není odlišná od normální zlaté), ale protože se na denním světle roztéká, což ho na povrchu dělá nepoužitelným.
items.quest.darkgold.discover_hint=Tento předmět můžeš najít během jednoho z úkolů.

items.quest.dwarftoken.name=Trpasličí žeton
items.quest.dwarftoken.desc=Mnoho trpaslíků a některé z jejich větších výtvorů u sebe nosí malý kousek kovu neznámého účelu. Možná je to šperk nebo nějaký způsob prokázání identity. Trpaslíci jsou zvláštní.
items.quest.dwarftoken.discover_hint=Tento předmět můžeš najít během jednoho z úkolů.

items.quest.embers.name=Elementární uhlík
items.quest.embers.desc=Speciální uhlík, který lze získat pouze z mladých ohnivých elementálů. Vyzařuje tepelnou energii.
items.quest.embers.discover_hint=Tento předmět můžeš najít během jednoho z úkolů.

items.quest.escapecrystal.name=Únikový krystal
items.quest.escapecrystal.ac_use=POUŽÍT
items.quest.escapecrystal.desc=Úzký magický krystal, který v sobě skrývá teleportační kouzlo. Můžeš ho kdykoliv použít pro opuštění trpasličí pokladnice, ale nezvládneš s sebou nic vzít!
items.quest.escapecrystal.discover_hint=Tento předmět můžeš najít během jednoho z úkolů.

items.quest.gooblob.name=Hrudka slizu
items.quest.gooblob.desc=Třesoucí se hrudka slizu, která odpadla ze Slizáka, když umřel. Vypadá trochu jako velká koule želé, ale nemáš odvahu pokusit se ji sníst.\n\nSama o sobě je k ničemu, ale v mohla by se hodit v kombinaci s některými lektvary nebo bombami. Přinejhorším by mělo být možné ji převést ve slušné množství energie.
items.quest.gooblob.discover_hint=Tento předmět můžeš získat jako kořist z některých nepřátel.

items.quest.metalshard.name=Prokletý kovový střep
items.quest.metalshard.desc=Úlomek zrezlého prokletého kovu, který se odštípl z DM-300, když byl zničen. Cítíš v něm neaktivní zlou energii.\n\nSám o sobě je k ničemu, ale mohl by se hodit spolu s některými svitky nebo bombami. Přinejhorším by mělo být možné ho převést ve slušné množství energie.
items.quest.metalshard.discover_hint=Tento předmět můžeš získat jako kořist z některých nepřátel.

items.quest.pickaxe.name=Krumpáč
items.quest.pickaxe.ability_name=Proražení
items.quest.pickaxe.ability_desc=Šermířka dokáže nepřítele _prorazit_ krumpáčem. Takový útok je zaručený zásah, způsobí na 3 kola zranitelnost a způsobí _%1$d-%2$d poškození_ nepřátelům s tuhou kůží.
items.quest.pickaxe.upgrade_ability_stat_name=Zranění schopnosti
items.quest.pickaxe.desc=Jedná se o velký a robustní nástroj na rozbíjení kamenů. Nemusíš se jím vybavit, abys s ním mohl kopat, i když pravděpodobně může být v nouzi použit i jako zbraň.
items.quest.pickaxe.discover_hint=Tento předmět můžeš najít během jednoho z úkolů.

items.quest.ratskull.name=Obří krysí lebka
items.quest.ratskull.desc=Překvapivě velká krysí lebka. Byla by to skvělá lovecká trofej, kdyby tu někde bylo místo, kam ji vystavit.



###remains
items.remains.remainsitem.ac_use=POUŽÍT
items.remains.remainsitem.discover_hint=Tento předmět můžeš najít v ostatcích hrdiny padlého v minulé hře.

items.remains.bowfragment.name=Úlomek luku
items.remains.bowfragment.desc=Tento dřevěný úlomek byl kdysi částí přízračného luku ztracené lovkyně. Stále z něj cítíš slabou přírodní magii, a dokážeš s jeho pomocí vyvolat kolem sebe několik trsů vysoké trávy. Úlomek se tím bohužel zničí.

items.remains.brokenhilt.name=Ulomený jílec
items.remains.brokenhilt.desc=Tento uražený jílec pravděpodobně pochází ze zbraně poražené šermířky. Cítíš z něj zbytky bojovného ducha, a dokážeš jej použít k lehkému posílení svých dvou následujících úderů. Jílec tím však bude zničen.

items.remains.brokenstaff.name=Zlomená hůl
items.remains.brokenstaff.desc=Hůl tohoto mága byla rozlomena vedví, když její majitel nalezl svůj konec. Cítíš v ní zbytky magické moci, kterými dokážeš poskytnout slabé nabití svým hůlkám. Tím však bude hůl zničena.

items.remains.cloakscrap.name=Cár látky
items.remains.cloakscrap.desc=Tento útržek pooloprůhledné tkaniny vypadá jako zbytek pláště stínů mrtvého zloděje. Cítíš z něj slabou mystickou sílu, kterou dokážeš použít, abys lehce dobil své artefakty. Látka tím však bude nadobro zničena.

items.remains.sealshard.name=Úlomky pečetě
items.remains.sealshard.desc=Tyto drobné střípky rudého vosku vypadají jako zbytky z pečetě padlého válečníka. Cítíš, jak se v ní drží zbytky jeho vůle, a dokážeš je použít, aby ti poskytly malé množství dodatečné ochrany. Úlomky pečetě se tím bohužel zničí.

items.remains.tornpage.name=Vytrhnutá stránka
items.remains.tornpage.desc=Tato stránka vypadá, jako by byla vytržena k knihy padlého klerika. Stále se v ní drží zbytky svaté magie, které můžeš použít k vyléčení malého množství zdraví. Tím se však vytržená stránka nadobro zničí.



###rings
items.rings.ring.diamond=Diamantový prsten
items.rings.ring.opal=Opálový prsten
items.rings.ring.garnet=Granátový prsten
items.rings.ring.ruby=Rubínový prsten
items.rings.ring.amethyst=Ametystový prsten
items.rings.ring.topaz=Topazový prsten
items.rings.ring.onyx=Onyxový prsten
items.rings.ring.tourmaline=Turmalínový prsten
items.rings.ring.emerald=Smaragdový prsten
items.rings.ring.sapphire=Safírový prsten
items.rings.ring.quartz=Křemenný prsten
items.rings.ring.agate=Achátový prsten
items.rings.ring.equip_cursed=Prsten se bolestivě svírá kolem tvého prstu!
items.rings.ring.unknown_desc=Kovový kroužek ozdobený velkým drahokamem třpytícím se ve tmě. Kdo ví, jaký efekt ti propůjčí, když si ho nasadíš?
items.rings.ring.known=Tohle je %s
items.rings.ring.identify=Nyní dostatečně znáš svůj prsten.
items.rings.ring.cursed_worn=Prsten je prokletý a nemáš proto sílu ho sundat.
items.rings.ring.curse_known=Cítíš z tohoto prstenu unikat zlou magii.
items.rings.ring.not_cursed=Z prstenu neuniká žádná zlá magie.

items.rings.ringofaccuracy.name=Prsten přesnosti
items.rings.ringofaccuracy.stats=Tento prsten během nošení zvýší tvou přesnost o _%s%%._
items.rings.ringofaccuracy.typical_stats=Běžně tento prsten během nošení zvýší tvou přesnost o _%s%%._
items.rings.ringofaccuracy.combined_stats=Tvé prsteny kombinují svou sílu, čímž zvyšují tvou přesnost o _%s%%_ celkově.
items.rings.ringofaccuracy.upgrade_stat_name_1=Zvýšení přesnosti
items.rings.ringofaccuracy.desc=Prsten zvyšuje tvou pozornost, což tvým útokům usnadňuje najít jejich cíl. Prokletý prsten tvým útokům naopak znesnadní na sebe navazovat.

items.rings.ringofarcana.name=Prsten tajemna
items.rings.ringofarcana.stats=Při nošení zvýší tento prsten sílu run a očarování o _%s%%._
items.rings.ringofarcana.typical_stats=Při nošení zvýší obvykle tento prsten sílu run a očarování o _%s%%._
items.rings.ringofarcana.combined_stats=Tvé prsteny kombinují svou sílu, čímž zvyšují sílu tvých očarování a run o _%s%%_ celkově.
items.rings.ringofarcana.upgrade_stat_name_1=Zvýšení síly mystiky
items.rings.ringofarcana.desc=Tento prsten posiluje magická očarování zbraní a runy vyryté na zbrojích, včetně prokletí, zvyšujíc nejprve jejich šanci na aktivování, následně pak sílu jejich efektu, pokud je šance na aktiivování 100%. Prokletý prsten naopak očarování a runy oslabí.

items.rings.ringofelements.name=Prsten živlů
items.rings.ringofelements.stats=Tento prsten během nošení poskytne _%s%%_ ochrany proti živlům.
items.rings.ringofelements.typical_stats=Běžně tento prsten během nošení poskytne _%s%%_ ochrany proti živlům.
items.rings.ringofelements.combined_stats=Tvé prsteny kombinují svou sílu, čímž zvyšují tvou odolnost vůči živlům o _%s%%_ celkově.
items.rings.ringofelements.upgrade_stat_name_1=Odolnost
items.rings.ringofelements.desc=Prsten poskytuje ochranu proti většině živlů a magickým efektům, snižuje poškození a také trvání škodlivých efektů. Prokletý prsten tyto efekty naopak výrazně zhorší.

items.rings.ringofenergy.name=Prsten energie
items.rings.ringofenergy.stats=Tento prsten během nošení zvýší rychlost dobíjení hůlek, artefaktů a hrdinských zbrojí o _%s%%_.
items.rings.ringofenergy.typical_stats=Tento prsten během nošení obvykle zvýší rychlost dobíjení hůlek, artefaktů a hrdinských zbrojí o _%s%%_.
items.rings.ringofenergy.combined_stats=Tvé prsteny kombinují svou sílu, čímž zvyšují rychlost nabíjení o _%s%%_ celkově.
items.rings.ringofenergy.upgrade_stat_name_1=Zvýšení dobíjení
items.rings.ringofenergy.desc=Tvé magické předměty se budou v magickém poli vyzařujícím z tohoto prstenu dobíjet výrazně rychleji. Prokletý prsten dobíjení naopak zpomalí.

items.rings.ringofevasion.name=Prsten vyhýbání
items.rings.ringofevasion.stats=Tento prsten během nošení zvýší tvé vyhýbání o _%s%%._
items.rings.ringofevasion.typical_stats=Běžně tento prsten během nošení zvýší tvé vyhýbání o _%s%%._
items.rings.ringofevasion.combined_stats=Tvé prsteny kombinují svou sílu, čímž zvyšují tvé vyhýbání o _%s%%_ celkově.
items.rings.ringofevasion.upgrade_stat_name_1=Zvýšení vyhýbání
items.rings.ringofevasion.desc=Prsten urychluje nositelovy reakce, takže pro nepřátele je daleko obtížnější ho zasáhnout. Prokletý prsten z nositele naopak udělá snadný cíl.

items.rings.ringofforce.name=Prsten údernosti
items.rings.ringofforce.stats=Beze zbraně tento prsten, s tvou současnou sílou, udělí _%1$d-%2$d poškození._  S vybavenou zbraní prsten zvýší tvé poškození o _%3$d._
items.rings.ringofforce.typical_stats=Beze zbraně tento prsten, s tvou současnou sílou, běžně udělí _%1$d-%2$d poškození._ S vybavenou zbraní prsten zvýší tvé poškození běžně o _%3$d._
items.rings.ringofforce.combined_stats=Tvé prsteny kombinují svou sílu, čímž ti poskytují celkem _%1$d-%2$d poškození_ beze zbraně, nebo zvyšují poškození o _%3$d_, pokud zbraň máš.
items.rings.ringofforce.upgrade_stat_name_1=Poškození beze zbraně
items.rings.ringofforce.upgrade_stat_name_2=Zvýšení poškození se zbraní
items.rings.ringofforce.upgrade_stat_name_3=Poškození schopnostmi
items.rings.ringofforce.ability_name=Postoj rváče
items.rings.ringofforce.typical_ability_desc=Šermířka může s tímto prstenem zaujmout _postoj rváče_, v němž budou její zblízka zbraní používat tento prsten, i když je vybavena zbraní. Takové útoky budou typicky způsobovat _%1$d-%2$d poškození_ a budou využívat očarování a přizpůsobení zbraně. Tento postoj zpomalí rychlost, jakou se obnovují použití zbraně o 50%%.,
items.rings.ringofforce.ability_desc=Šermířka může s tímto prstenem zaujmout _postoj rváče_, v němž budou její zblízka zbraní používat tento prsten, i když je vybavena zbraní. Takové útoky budou způsobovat _%1$d-%2$d poškození_ a budou využívat očarování a přizpůsobení zbraně. Tento postoj zpomalí rychlost, jakou se obnovují použití zbraně o 50%%.,
items.rings.ringofforce.desc=Prsten nositeli zvýší sílu jeho úderů na blízko. Tato mimořádná síla se pří držení zbraně příliš neprojeví, ale právě neozbrojený útok bude mnohem silnějším. Prokletý prsten naopak nositelovi údery oslabí.
items.rings.ringofforce$brawlersstance.name=Postoj rváče
items.rings.ringofforce$brawlersstance.desc=V tomto postoji Šermířka útočí svým prstenem údernosti, i když je vybavena zbraní. Tyto útoky způsobují bonusové poškození a stále využívají očarování a přizpůsobení její zbraně.\n\nUdržovaní takového postoje si každopádně žádá soustředění, kvůli čemuž se použití schopností zbraně obnovují o 50% pomaleji.\n\nTento postoj lze zaujmout či ukončit použitím prstenu údernosti, ovšem zpomalení obnovy schopností přetrvá chvíli po jeho ukončení.

items.rings.ringoffuror.name=Prsten zuřivosti
items.rings.ringoffuror.stats=Tento prsten během nošení zvýší rychlost tvých útoků o _%s%%._
items.rings.ringoffuror.typical_stats=Běžně tento prsten během nošení zvýší rychlost tvých útoků o _%s%%._
items.rings.ringoffuror.combined_stats=Tvé prsteny kombinují svou sílu, čímž zvyšují rychlost tvých útoků o _%s%%_ celkově.
items.rings.ringoffuror.upgrade_stat_name_1=Zvýšení rychlosti útoků
items.rings.ringoffuror.desc=Prsten poskytuje nositeli vnitřní zuřivost, která umožňuje útočit mnohem rychleji. Prokletý prsten nositelovu rychlost útoků naopak zpomalí.

items.rings.ringofhaste.name=Prsten rychlosti
items.rings.ringofhaste.stats=Tento prsten během nošení zvýší tvou rychlost pohybu o _%s%%._
items.rings.ringofhaste.typical_stats=Běžně tento prsten během nošení zvýší tvou rychlost pohybu o _%s%%._
items.rings.ringofhaste.combined_stats=Tvé prsteny kombinují svou sílu, čímž zvyšují tvou rychlost pohybu o _%s%%_ celkově.
items.rings.ringofhaste.upgrade_stat_name_1=Zvýšení rychlosti pohybu
items.rings.ringofhaste.desc=Prsten nositeli ulehčuje namáhavý pohyb a umožňuje mu běžet nadlidskou rychlostí. Prokletý prsten nositele naopak zatíží.

items.rings.ringofmight.name=Prsten síly
items.rings.ringofmight.stats=Tento prsten během nošení zvýší tvou sílu o _%1$d_ a tvé maximální zdraví o _%2$s%%._
items.rings.ringofmight.typical_stats=Běžně tento prsten během nošení zvýší tvou sílu o _%1$d_ a tvé maximální zdraví o _%2$s%%._
items.rings.ringofmight.combined_stats=Tvé prsteny kombinují svou moc, čímž zvyšují tvou sílu o _%1$d_ a tvé maximální HP o _%2$s%%_celkově.
items.rings.ringofmight.upgrade_stat_name_1=Zvýšení síly
items.rings.ringofmight.upgrade_stat_name_2=Zvýšení maximálních HP
items.rings.ringofmight.desc=Prsten zlepšuje fyzické vlastnosti nositele, poskytuje větší fyzickou sílu a více zdraví. Prokletý prsten nositele naopak oslabí.

items.rings.ringofsharpshooting.name=Prsten ostrostřelby
items.rings.ringofsharpshooting.stats=Při nošení zvyšuje tento prsten poškození způsobené vrhacími zbraněmi, jako kdyby jejich úroveň byla větší o _%1$d_, a jejich výdrž se zvýší o _%2$s%%_.
items.rings.ringofsharpshooting.typical_stats=Při nošení zvyšuje tento prsten poškození způsobené vrhacími zbraněmi, jako kdyby jejich úroveň byla větší o _%1$d_, a jejich výdrž se zvýší o _%2$s%%_.
items.rings.ringofsharpshooting.combined_stats=Tvé prsteny kombinují svou moc, čímž zvyšují úroveň tvých vrhacích zbraní o _%1$d_ a jejich výdrž o _%2$s%%_celkově.
items.rings.ringofsharpshooting.upgrade_stat_name_1=Zvýšení úrovně poškození
items.rings.ringofsharpshooting.upgrade_stat_name_2=Zvýšení výdrže
items.rings.ringofsharpshooting.desc=Prsten nositeli zlepšuje přesnost míření, což udělá všechny vrhací zbraně více škodlivé a odolnější. Prokletý prsten bude mít opačný účinek.

items.rings.ringoftenacity.name=Prsten neústupnosti
items.rings.ringoftenacity.stats=Tento prsten během nošení sníží poškození, které obdržíš, až o _%s%%._
items.rings.ringoftenacity.typical_stats=Běžně tento prsten během nošení sníží poškození, které obdržíš, až o _%s%%._
items.rings.ringoftenacity.combined_stats=Tvé prsteny kombinují svou sílu, čímž snižují tebou utržená zranění až o _%s%%_ celkově.
items.rings.ringoftenacity.upgrade_stat_name_1=Maximální odolnost k poškození
items.rings.ringoftenacity.desc=Prsten během nošení umožní nositeli odolat smrtelným úderům. Čím více je nositel zraněn, tím více je vůči poškození odolnější. Prokletý prsten naopak usnadní nepřátelům nositele na místě popravit.

items.rings.ringofwealth.name=Prsten blahobytu
items.rings.ringofwealth.stats=Tento prsten během nošení zvýší tvé štěstí o _%s%%._
items.rings.ringofwealth.typical_stats=Běžně tento prsten během nošení zvýší tvé štěstí o _%s%%._
items.rings.ringofwealth.combined_stats=Tvé prsteny kombinují svou sílu, čímž zvyšují tvé štěstí o _%s%%_ celkově.
items.rings.ringofwealth.upgrade_stat_name_1=Zvýšení štěstí
items.rings.ringofwealth.desc=Prsten funguje jako magnet na poklady a zvyšuje pravděpodobnost, že budou nepřátelé nebo truhly a dodatečně obsahovat užitečné či cenné předměty. Prokletý prsten tvou šanci najít něco zajímavého spíše sníží.



###scrolls
items.scrolls.scroll.ac_read=ČÍST
items.scrolls.scroll.kaunan=Svitek KAUNAN
items.scrolls.scroll.sowilo=Svitek SOWILO
items.scrolls.scroll.laguz=Svitek LAGUZ
items.scrolls.scroll.yngvi=Svitek YNGVI
items.scrolls.scroll.gyfu=Svitek GYFU
items.scrolls.scroll.raido=Svitek RAIDO
items.scrolls.scroll.isaz=Svitek ISAZ
items.scrolls.scroll.mannaz=Svitek MANNAZ
items.scrolls.scroll.naudiz=Svitek NAUDIZ
items.scrolls.scroll.berkanan=Svitek BERKANAN
items.scrolls.scroll.odal=Svitek ODAL
items.scrolls.scroll.tiwaz=Svitek TIWAZ
items.scrolls.scroll.unknown_desc=Na tomto pergamenu je napsána nerozluštitelná magická runa. Kdo ví, co takový svitek udělá, když se přečte nahlas?
items.scrolls.scroll.blinded=Nemůžeš číst svitek, když nic nevidíš.
items.scrolls.scroll.no_magic=Nemůžeš číst svitek během magické imunity.
items.scrolls.scroll.cursed=Prokletá kniha kouzel ti zabraňuje ve vyvolání magie tohoto svitku! Ovšem svitek odstranění prokletí by mohl být dost silný na to, aby stále fungoval...
items.scrolls.scroll$placeholder.name=Svitek

items.scrolls.inventoryscroll.warning=Opravdu chceš zrušit použití tohoto svitku? Svitek nebyl předtím identifikován, a tak bude stejně spotřebován.
items.scrolls.inventoryscroll.yes=Ano, souhlasím
items.scrolls.inventoryscroll.no=Ne, rozmýšlím si to

items.scrolls.scrollofidentify.name=Svitek identifikace
items.scrolls.scrollofidentify.inv_title=Identifikuj předmět
items.scrolls.scrollofidentify.it_is=Tvůj předmět byl identifikován: %s.
items.scrolls.scrollofidentify.desc=Tento svitek trvale odhalí všechna tajemství jednoho předmětu.

items.scrolls.scrolloflullaby.name=Svítek ukolébání
items.scrolls.scrolloflullaby.sooth=Svitek vydává uklidňující melodii. Cítíš se velmi ospale.
items.scrolls.scrolloflullaby.desc=Přečtení tohoto svitku vydá uklidňující melodii, která ukolébá všechny, kteří ji uslyší, do hlubokého magického spánku. Pro čtenáře a jeho spojence je spánek posilňující.

items.scrolls.scrollofmagicmapping.name=Svitek magického mapování
items.scrolls.scrollofmagicmapping.layout=Nyní znáš rozvržení celé této úrovně.
items.scrolls.scrollofmagicmapping.desc=Když přečteš tento svitek, do paměti se ti vryje krystalově čistý obraz, který ti ukáže přesné rozvržení této úrovně a odhalí ti všechna tajná místa. Rozmístění předmětů a tvorů zůstane ovšem neznámé.

items.scrolls.scrollofmirrorimage.name=Svitek zrcadlového odrazu
items.scrolls.scrollofmirrorimage.copies=Svitek vytváří zrcadlové obrazy tebe.
items.scrolls.scrollofmirrorimage.no_copies=Svitek se pokouší vytvořit zrcadlové obrazy tebe, nemají se však kde zformovat.
items.scrolls.scrollofmirrorimage.desc=Zaříkávadlo na tomto svitku vytvoří dvě iluzorní dvojčata toho, kdo jej přečte. Tyto zrcadlové odrazy fungují jako tvoje slabší klony a budou pronásledovat tvé nepřátele. Nemají však žádnou výdrž a zmizí jakmile obdrží poškození.

items.scrolls.scrollofretribution.name=Svitek odplaty
items.scrolls.scrollofretribution.blast=Mocná magická energie vytryskla ze svitku!
items.scrolls.scrollofretribution.desc=Tento svitek obsahuje destruktivní energii, která soustředí veškeré utrpení toho, kdo jej přečte, do silného výbuchu. Čím slabší čtenář je, tím více poškození svitek udělí. S velmi nízkým zdravím může tento svitek okamžitě zabít většinu nepřátel.\n\nPoužití svitku má však na čtenáře neblahý efekt v podobě oslepení a oslabení.

items.scrolls.scrollofrage.name=Svitek vzteku
items.scrolls.scrollofrage.roar=Svitek vydal rozzuřený řev, který se ozývá celou kobkou!
items.scrolls.scrollofrage.desc=Tento svitek vypustí po přečtení hlasitý řev, který přiláká všechny nepřátele k tomu, kdo jej přečte a rozzuří ty poblíž.

items.scrolls.scrollofrecharging.name=Svitek nabíjení
items.scrolls.scrollofrecharging.surge=Cítíš prudký nárůst energie. Protéká skrze tvé tělo a posiluje tvé hůlky!
items.scrolls.scrollofrecharging.desc=Čirá magická energie vázaná v tomto pergamenu po vypuštění postupně dobije všechny hůlky tomu, kdo jej přečte.

items.scrolls.scrollofremovecurse.name=Svitek odstranění prokletí
items.scrolls.scrollofremovecurse.inv_title=Očisti předmět
items.scrolls.scrollofremovecurse.cleansed=Předmět vzplanul očisťujícím světlem a zlá energie se vytratila!
items.scrolls.scrollofremovecurse.not_cleansed=Předmět vzplanul očisťujícím světlem, ale nic se nestalo.
items.scrolls.scrollofremovecurse.spirit=Tvůj svitek osvobozuje umučenou duši!
items.scrolls.scrollofremovecurse.desc=Zaklínadlo na tomto svitku okamžitě odstraní prokletí z vybrané zbraně, prstenu, hůlky, zbroje nebo artefaktu.

items.scrolls.scrollofteleportation.name=Svitek teleportace
items.scrolls.scrollofteleportation.tele=Mrknutím oka tě teleportace přesunula na jiné místo v této úrovni.
items.scrolls.scrollofteleportation.no_tele=Teleportační magie selhala.
items.scrolls.scrollofteleportation.cant_reach=Tam se nemůžeš teleportovat.
items.scrolls.scrollofteleportation.prompt=Vyber místo pro teleportování
items.scrolls.scrollofteleportation.desc=Kouzlo na tomto pergamenu okamžitě přesune toho, kdo jej přečte, na jiné místo v současné úrovni. Svitek upřednostňuje oblasti, které ještě nemáš objevené, není ovšem schopen tě teleportovat za zamčené dveře nebo barikády. Může však odhalit skryté dveře, které vedou do nových oblastí.

items.scrolls.scrollofterror.name=Svitek teroru
items.scrolls.scrollofterror.none=Svitek vydal oslnivý záblesk červeného světla.
items.scrolls.scrollofterror.one=Svitek vydal oslnivý záblesk červeného světla a %s utíká!
items.scrolls.scrollofterror.many=Svitek vydal oslnivý záblesk červeného světla a nepřátelé utíkají!
items.scrolls.scrollofterror.desc=Po přečtení vytvoří tento svitek záblesk rudého světla, které zachvátí všechny nepřátele v dosahu strachem a způsobí, že se otočí a utečou. Útok na prchajícího nepřítele zkrátí účinek strachu.

items.scrolls.scrolloftransmutation.name=Svitek proměny
items.scrolls.scrolloftransmutation.inv_title=Proměň předmět
items.scrolls.scrolloftransmutation.nothing=Nic zvláštního se nestalo.
items.scrolls.scrolloftransmutation.morph=Tvůj předmět se mění na něco jiného!
items.scrolls.scrolloftransmutation.desc=Tento svitek obsahuje silnou magii proměny. Pokud je použit na vhodný předmět, promění jej na jiný předmět stejného typu. Magie dokonce zachová vylepšení, okouzlení zbraní i runy na zbrojích. Svitky a lektvary budou svitkem přeměněny ve svou vzácnou variantu.

items.scrolls.scrollofupgrade.name=Svitek vylepšení
items.scrolls.scrollofupgrade.inv_title=Vylepši předmět
items.scrolls.scrollofupgrade.weaken_curse=Svitek vylepšení oslabuje prokletí tvého předmětu.
items.scrolls.scrollofupgrade.remove_curse=Svitek vylepšení očišťuje tvůj předmět od prokletí!
items.scrolls.scrollofupgrade.desc=Tento svitek vylepší jeden předmět, případně sadu vrhacích zbraní, a zlepší i jeho kvalitu. Hůlky zvýší svou sílu a počet nabití, zbraně a zbroje způsobí a zablokují více poškození a také zesílí účinky prstenů.\n\nSvitek je dokonce schopen zmírnit nebo někdy úplně rozptýlit účinky prokletí, ačkoliv není tak silný jako svitek odstranění prokletí.



###exotic scrolls
items.scrolls.exotic.exoticscroll.kaunan=Vzácný svitek KAUNAN
items.scrolls.exotic.exoticscroll.sowilo=Vzácný svitek SOWILO
items.scrolls.exotic.exoticscroll.laguz=Vzácný svitek LAGUZ
items.scrolls.exotic.exoticscroll.yngvi=Vzácný svitek YNGVI
items.scrolls.exotic.exoticscroll.gyfu=Vzácný svitek GYFU
items.scrolls.exotic.exoticscroll.raido=Vzácný svitek RAIDO
items.scrolls.exotic.exoticscroll.isaz=Vzácný svitek ISAZ
items.scrolls.exotic.exoticscroll.mannaz=Vzácný svitek MANNAZ
items.scrolls.exotic.exoticscroll.naudiz=Vzácný svitek NAUDIZ
items.scrolls.exotic.exoticscroll.berkanan=Vzácný svitek BERKANAN
items.scrolls.exotic.exoticscroll.odal=Vzácný svitek ODAL
items.scrolls.exotic.exoticscroll.tiwaz=Vzácný svitek TIWAZ
items.scrolls.exotic.exoticscroll.unknown_desc=Na tomto černém pergamenu je napsána nerozluštitelná magická runa. Zdá se, že je velmi neobvyklá, takže kdo ví, co to udělá, když se přečte nahlas?
items.scrolls.exotic.exoticscroll.discover_hint=Tento předmět můžeš vyrobit pomocí alchymie.

items.scrolls.exotic.scrollofsirenssong.name=Svitek písně sirén
items.scrolls.exotic.scrollofsirenssong.prompt=Vyber cíl
items.scrolls.exotic.scrollofsirenssong.no_target=Svitek se aktivuje bez cíle.
items.scrolls.exotic.scrollofsirenssong.cancel=Musíš si vybrat cíl.
items.scrolls.exotic.scrollofsirenssong.desc=Přečtení tohoto svitku vyvolá okouzlující melodii, která uchvátí srdce vybraného nepřítele a udělá z něj permanentního spojence! Ostatní nepřátelé, kteří melodii uslyší, budou dočasně okouzleni.\n\nNěkteří silní nepřátelé mohou uchvácení odolat, a budou namísto něj okouzleni.
items.scrolls.exotic.scrollofsirenssong$enthralled.name=Uchvácen
items.scrolls.exotic.scrollofsirenssong$enthralled.desc=Toto stvoření bylo očarováno magií svitku písně sirén.\n\nUchvácené stvoření je tvým spojencem a bude za tebe bojovat s nepřáteli, které potká.

items.scrolls.exotic.scrollofantimagic.name=Svitek anti-magie
items.scrolls.exotic.scrollofantimagic.desc=Zaklínadlo na tomto svitku tě obklopí kouzelnou aurou, která dočasně blokuje všechny magické efekty, škodlivé i užitečné. Týký se to mimo jiné většiny magických předmětů, jako jsou hůlky, svitky, prsteny, artefakty, očarování nebo kletby. Pouze schopnosti hrdinných zbrojí jsou stále schopny fungovat.

items.scrolls.exotic.scrollofchallenge.name=Svitek výzvy
items.scrolls.exotic.scrollofchallenge.desc=Po přečtení vypustí tento svitek mocný řev, který přiláká nepřátele k jeho čtenáři a zároveň kolem něj vymezí malou arénu.\n\nDokud se čtenář svitku zdržuje ve vyhraničené aréně, obdrží o 33% méně poškození (což se započítává před jinými efekty snižujícími poškození) a zároveň nebude ztrácet nasycení.\n\nVelikost arény je úměrná velikosti oblasti, v níž čtenář stojí. V některých oblastech bossů bude obzvlášť malá.
items.scrolls.exotic.scrollofchallenge$challengearena.name=Aréna výzvy
items.scrolls.exotic.scrollofchallenge$challengearena.desc=Objevila se kolem tebe magická aréna vyznačená vzdouvající se červenou mlhou.\n\nDokud stojíš v mlze, nebude tvůj hlad narůstat a obdržíš o 33%% méně poškození. Pokud máš jiné prostředky snižování poškození (jako například zbroj), započtou se až po 33%% snížení.\n\nZbývá tahů: %d.

items.scrolls.exotic.scrollofdivination.name=Svitek věštění
items.scrolls.exotic.scrollofdivination.nothing_left=Nezbývá nic, co by bylo možné identifikovat!
items.scrolls.exotic.scrollofdivination.desc=Tento svitek trvale odhalí čtyři náhodné typy předmětů, které ještě neznáš. Identifikované typy mohou být barvy lektvarů, runy na svitcích nebo kameny na prstenech. Předměty, které identifikuješ, nemusí být nutně ty, které máš u sebe.
items.scrolls.exotic.scrollofdivination$wnddivination.desc=Tvůj svitek věštění identifikoval tyto předměty:

items.scrolls.exotic.scrollofdread.name=Svitek hrůzy
items.scrolls.exotic.scrollofdread.desc=Po přečtení vyšlehne z tohoto svitku záblesk rudého světla , který zaseje do tvých nepřátel neuvěřitelný pocit hrůzy. Je to hrůza tak strašlivá, že se co nejrychleji pokusí v panice utéct z kobky a nikdy se do ní nevracet!\n\nStejně jako u svitku teroru, tento efekt může pominout s časem nebo pokud je napřítel napaden.\n\nSilní nepřátelé, jako jsou bossové, budou namísto hrůzy jen běžně vyděšeni.

items.scrolls.exotic.scrollofenchantment.name=Svitek okouzlení
items.scrolls.exotic.scrollofenchantment.inv_title=Okouzli předmět
items.scrolls.exotic.scrollofenchantment.weapon=Vyber okouzlení, které chceš na zbraň použít.
items.scrolls.exotic.scrollofenchantment.armor=Vyber runu, kterou chceš na zbroj použít.
items.scrolls.exotic.scrollofenchantment.cancel=Zrušit
items.scrolls.exotic.scrollofenchantment.cancel_warn=Zrušení výběru svitek okouzlení stejně spotřebuje, jsi si jist?
items.scrolls.exotic.scrollofenchantment.cancel_warn_yes=Ano, určitě
items.scrolls.exotic.scrollofenchantment.cancel_warn_no=Ne, rozmýšlím si to
items.scrolls.exotic.scrollofenchantment.desc=Tento svitek naplní zbraň nebo zbroj silnou magickou energií. Kdo jej přečte, má dokonce část kontroly nad tím, jakou schopností bude zbraň či zbroj obdařena.

items.scrolls.exotic.scrollofforesight.name=Svitek předvídavosti
items.scrolls.exotic.scrollofforesight.desc=Po přečtení tohoto svitku se všechny detaily o okolním terénu začnou s křišťálovou precizností ukládat do čtenářovy mysli. Tento efekt trvá značnou dobu a odhalí i skryté dveře a pasti, takže není třeba je hledat.

items.scrolls.exotic.scrollofmetamorphosis.name=Svitek metamorfózy
items.scrolls.exotic.scrollofmetamorphosis.choose_desc=Vyber schopnost k metamorfóze
items.scrolls.exotic.scrollofmetamorphosis.replace_desc=Vyber si novou schopnost, která nahradí schopnost metamorfovanou.
items.scrolls.exotic.scrollofmetamorphosis.cancel_warn=Zrušení výběru svitek metamorfózy stejně spotřebuje, jsi si jist?
items.scrolls.exotic.scrollofmetamorphosis.metamorphose_talent=Metamorfuj schopnost
items.scrolls.exotic.scrollofmetamorphosis.desc=Tento svitek obsahuje mocnou magii přeměny, která namísto předmětu ovlivní samotného čtenáře. Magie svitku ti umožní vybrat si jednu schopnost a nahradit ji jednou z pěti schopností jiných hrdinů! Tento efekt se týká pouze schopností tříd, ne schopností podtříd nebo speciálních zbrojí. Schopnosti, které nemůžeš použít, nebudou nabídnuty jako možnost.

items.scrolls.exotic.scrollofmysticalenergy.name=Svitek mystické energie
items.scrolls.exotic.scrollofmysticalenergy.desc=Čistá magická energie, vázající se k tomuto pergamenu, po vypuštění postupně dobije vybavené artefakty toho, kdo jej přečte.

items.scrolls.exotic.scrollofpassage.name=Svitek průchodu
items.scrolls.exotic.scrollofpassage.desc=Kouzlo na tomto pergamenu okamžitě přesune toho, kdo jej přečte, k nejbližšímu prvnímu patru oblasti nad ním. Velmi užitečné pro rychlou cestu do obchodu.

items.scrolls.exotic.scrollofprismaticimage.name=Svitek průzračného odrazu
items.scrolls.exotic.scrollofprismaticimage.desc=Zaříkávadlo na tomto svitku vytvoří barevné iluzorní dvojče toho, kdo jej přečte. Tento průzračný odraz funguje jako tvůj slabší klon s podobnou obranou, ale nižším zdravím a poškozením.\n\nPrůzračný odraz se objeví, když jsou přítomni nepřátelé a pokusí se bránit čtenáře svitku.\n\nPokud už průzračný odraz existuje, použití tohoto svitku jej úplně vyléčí.

items.scrolls.exotic.scrollofpsionicblast.name=Svitek psionického výbuchu
items.scrolls.exotic.scrollofpsionicblast.ondeath=Psionický výbuch roztrhal tvou mysl...
items.scrolls.exotic.scrollofpsionicblast.desc=Tento svitek obsahuje neuvěřitelnou destruktivní energii, která může být soustředěna ke zničení myslí všech viditelných tvorů.\n\nJe tu ovšem výrazná zpětná vazba a ten, kdo svitek přečte, bude poškozen, oslepen a oslaben. Čím více cílů tento svitek zasáhne, tím menší poškození udělí tobě.



###spells
items.spells.alchemize.name=Alchymizace
items.spells.alchemize.prompt=Alchymizace předmětu
items.spells.alchemize.desc=Toto kouzlo má podobné transmutativní schopnosti jako alchymický kotlík. Každé jeho seslání umožňuje jeho sesilateli proměnit předmět (nebo svazek předmětů) ve zlato nebo v alchymickou energii. Proměna svitků nebo lektvarů v energii je navíc také identifikuje!\n\nAlchymizaci lze buď zakoupit v obchodě nebo vytvořit skrze alchymii. K tomu je potřeba zkombinovat semínko, runový kámen a špetku alchymické energie.
items.spells.alchemize$wndalchemizeitem.sell=Přeměň v %d zl
items.spells.alchemize$wndalchemizeitem.sell_1=Přeměň 1 v %d zl
items.spells.alchemize$wndalchemizeitem.sell_all=Přeměň vše v %d zl
items.spells.alchemize$wndalchemizeitem.energize=Přeměň v %d energie
items.spells.alchemize$wndalchemizeitem.energize_1=Přeměň 1 v %d energie.
items.spells.alchemize$wndalchemizeitem.energize_all=Přeměň vše v %d energie

items.spells.beaconofreturning.name=Kouzlo návratu
items.spells.beaconofreturning.preventing=Silná magická aura tohoto místa ti zabraňuje v použití kouzla!
items.spells.beaconofreturning.creatures=Psychická aura tvorů poblíž ti v tuto chvíli nedovoluje se teleportovat.
items.spells.beaconofreturning.set=Kouzlo návratu bylo uložen na tvé současné pozici.
items.spells.beaconofreturning.wnd_body=Uložení přepíše lokaci, na kterou bylo kouzlo návratu uloženo předtím.\n\nNávrat tě vrátí na tvou poslední uloženou lokaci a spotřebuje jedno použití kouzla.
items.spells.beaconofreturning.wnd_set=Uložit
items.spells.beaconofreturning.wnd_return=Navrátit
items.spells.beaconofreturning.desc_set=Kouzlo návratu bylo uložen někde na %d. patře.
items.spells.beaconofreturning.desc=Tohle složité kouzlo poskytuje uživateli možnost vrátit se na jakékoliv uložené místo, bez ohledu na vzdálenost. Kouzlo se spotřebuje pouze návratem, může být uloženo kolikrát budeš chtít, ale vždy si bude pamatovat pouze poslední uloženou lokaci.

items.spells.curseinfusion.name=Prokleté vylepšení
items.spells.curseinfusion.inv_title=Proklej předmět
items.spells.curseinfusion.desc=Toto kouzlo naplní část vybavení stejnou zvrácenou magií, jaká byla přítomna v DM-300. Daný předmět tím bude okamžitě proklet a jeho případná očarování nebo runy tím budou přepsány.\n\nV případě zbraní, zbrojí a hůlek bude předmět navíc ještě vylepšen. Prokletá vylepšení se nesčítají a budou ztracena, pokud bude předmět očištěn.\n\nToto kouzlo je možné na jeden předmět použít vícekrát a změnit tak prokletí na zbroji či zbrani.

items.spells.spell.ac_cast=VYVOLAT
items.spells.spell.no_magic=Nemůžeš vyvolávat kouzla během magické imunity.
items.spells.spell.discover_hint=Tento předmět můžeš vyrobit pomocí alchymie.

items.spells.magicalinfusion.name=Magické vylepšení
items.spells.magicalinfusion.inv_title=Vylepši předmět
items.spells.magicalinfusion.infuse=Tvůj předmět je naplněn kouzelnou energií!
items.spells.magicalinfusion.desc=Toto kouzlo obsahuje stejnou magickou moc jako svitek vylepšení, ale v mnohem stálejší podobě.\n\nNejen, že předmět vylepší, ale zároveň nikdy nevyruší očarování, runu ani kletbu.

items.spells.magicalporter.name=Magický přenašeč
items.spells.magicalporter.inv_title=Přenes předmět
items.spells.magicalporter.nowhere=Neexistuje místo, na které by se dal předmět přenést.
items.spells.magicalporter.desc=Tohle kouzlo magicky přenese jakýkoliv předmět, na které je vyvoláno. Ovšem na rozdíl od Kšeftovače, který předmět předá kupci, kouzlo předmět přenesen ke vchodu do patra s dalším bossem.

items.spells.phaseshift.name=Fázový přesun
items.spells.phaseshift.no_target=Tady není co teleportovat.
items.spells.phaseshift.desc=Toto chaotické kouzlo teleportuje jakoukoliv bytost, proti níž je zaměřeno na náhodnou pozici na tomto podlaží kobky a na značnou dobu je omráčí. Silnější nepřátelé mohou odolat efektu omráčení. Kouzlo lze zaměřit na jiný cíl, i na sesilatele samotného.

items.spells.reclaimtrap.name=Pohlcení pasti
items.spells.reclaimtrap.no_trap=Není tu žádná past.
items.spells.reclaimtrap.desc_trap=Kouzlo je momentálně připraveno použít _%s._
items.spells.reclaimtrap.desc=Toto kouzlo obsahuje zbytky mechanické energie DM-300. Při vyvolání na aktivní past, bude její síla pohlcena a uchována do tebe samotného. To ti umožní oopětovným použitím tohoto kouzla seslat jeho moc a vyvolat na efekt pohlcené pasti na tebou vybraném místě.\n\nEfekty některých pastí ovšem nemusí fungovat na všech místech a kouzlem lze naráz uchovávat pouze jednu past.

items.spells.recycle.name=Recyklace
items.spells.recycle.inv_title=Zrecykluj předmět
items.spells.recycle.recycled=Tvůj předmět by zrecyklován na: %s
items.spells.recycle.desc=Toto kouzlo obsahuje slabší verzi magie přeměny. Ačkoliv neúčinkuje na vybavení, dokáže přeměnit svitek, lektvar, semínko, runový kámen nebo napuštěnou šipku v náhodný předmět stejného druhu.

items.spells.summonelemental.name=Vyvolání elementála
items.spells.summonelemental.ac_imbue=NAPLNIT
items.spells.summonelemental.imbue_prompt=Pohltit předmět
items.spells.summonelemental.desc=Toto kouzlo čerpá energii elementárních uhlíků použitých k jeho výrobě a umožní ti vyvolat elementála, aby bojoval po tvém boku! Najednou můžeš mít vyvolaného jen jednoho elementála, ovšem kouzlo lze zadarmo znovu seslat a vrátit tak elementála k sobě.
items.spells.summonelemental.desc_newborn=Toto kouzlo je momentálně nenaplněno, a vyvolá slabšího _novorozeného elementála_ bez speciálního útoku. Kouzlo může pohltit identifikovaný lektvar tekutého ohně, lektvar mrazu, svitek nabíjení nebo svitek proměny, díky čemuž bude v budoucnu vyvolávat elementála v plné síle!
items.spells.summonelemental.desc_fire=Kouzlo je horké na dotek, vyvolá _ohnivého elementála_. Kouzlo může pohltit jiný předmět, ale momentálně pohlcený předmět bude ztracen.
items.spells.summonelemental.desc_frost=Kouzlo je chladné na dotek, vyvolá _ledového elementála_. Kouzlo může pohltit jiný předmět, ale momentálně pohlcený předmět bude ztracen.
items.spells.summonelemental.desc_shock=Kouzlo jiskří statickou elektřinou, vyvolá _elektrického elementála_. Kouzlo může pohltit jiný předmět, ale momentálně pohlcený předmět bude ztracen.
items.spells.summonelemental.desc_chaos=Z kouzla sálá chaotická energie, vyvolá _chaotického elementála_. Kouzlo může pohltit jiný předmět, ale momentálně pohlcený předmět bude ztracen.

items.spells.targetedspell.prompt=Vyber cíl
items.spells.targetedspell.inv_title=Očaruj předmět

items.spells.telekineticgrab.name=Telekinetický úchop
items.spells.telekineticgrab.cant_grab=To nemůžeš chytit.
items.spells.telekineticgrab.no_target=Není tu co chytit.
items.spells.telekineticgrab.desc=Kouzlo umožňuje sesilateli na dálku sebrat všechny předměty na nějakém místě, nebo všechny vrhací zbraně v jednom protivníkovi!\n\nNelze jej však použít k sebrání věcí, které patří někomu jinému, nebo k vybírání truhel.

items.spells.unstablespell.name=Nestabilní kouzlo
items.spells.unstablespell.desc=Tento malý černý hranatý krystal je ze všech stran pokryt měnícími se runovými symboly.\n\nPo aktivaci spustí efekt náhodného svitku. Účinek svitku bude vždy bojově založený, pokud jsou v tvém okolí nepřátelé, a vždy nebojově založený v opačném případě.

items.spells.wildenergy.name=Divoká energie
items.spells.wildenergy.desc=Toto kouzlo obsahuje část prokleté energie, která poháněla DM-300. Při vyvolání sice dobije tvé hůlky a nošené artefakty, ale zároveň vyvolá stejný náhodný efekt, jaký dělají prokleté hůlky. Máš ovšem možnost určit, kterým směrem tato prokletá magie poletí.


###runestones
items.stones.inventorystone.ac_use=POUŽÍT

items.stones.runestone$placeholder.name=Runový kámen
items.stones.runestone.discover_hint=Tento předmět můžeš najít v kobce nebo vyrobit pomocí alchymie.

items.stones.stoneofaggression.name=Kámen agrese
items.stones.stoneofaggression.desc=Když je tento kámen hozen po nepříteli nebo spojenci, všichni nepřátelé v okolí budou po krátkou dobu preferovat útočit na něj.\n\nMocní nepřátelé mohou účinku kamene odolat, čímž výrazně sníží jeho trvání a zároveň jim jejich spojenci způsobí menší poškození.
items.stones.stoneofaggression$aggression.name=Zacílen
items.stones.stoneofaggression$aggression.desc=Manipulativní magie nutí blízké nepřátele útočit na tuto postavu.\n\nZbývá tahů: %s.

items.stones.stoneofaugmentation.name=Kámen přizpůsobení
items.stones.stoneofaugmentation.inv_title=Přizpůsob předmět
items.stones.stoneofaugmentation.desc=Tento runový kámen je obdařen magií, která může přizpůsobit vybavení a tím zlepšit jednu jeho vlastnost za cenu té druhé.\n\nPoužití na zbraň ti umožní zlepšit buďto rychlost nebo poškození. Vrhací zbraně navíc získají nebo ztratí výdrž dle své rychlosti.\n\nPoužití na zbroj ti umožní zlepšit obranu nebo vyhýbání.
items.stones.stoneofaugmentation.discover_hint=Tento předmět můžeš koupit v obchodě nebo vyrobit pomocí alchymie.
items.stones.stoneofaugmentation$wndaugment.choice=Kterou vlastnost chceš zlepšit?
items.stones.stoneofaugmentation$wndaugment.speed=Rychlost
items.stones.stoneofaugmentation$wndaugment.damage=Poškození
items.stones.stoneofaugmentation$wndaugment.evasion=Vyhýbání
items.stones.stoneofaugmentation$wndaugment.defense=Obranu
items.stones.stoneofaugmentation$wndaugment.none=Odstranit přizpůsobení
items.stones.stoneofaugmentation$wndaugment.cancel=Nedělat nic

items.stones.stoneofblast.name=Kámen výbuchu
items.stones.stoneofblast.desc=Tento runový kámen okamžitě exploduje na místě, kam je hozen. Stejně jako bomba, výbuch udělí poškození všemu co je v blízkosti.

items.stones.stoneofblink.name=Kámen přesunutí
items.stones.stoneofblink.desc=Tento runový kámen teleportuje toho, kdo jej hodí, na místo kam je hozen.

items.stones.stoneofclairvoyance.name=Kámen jasnozřivosti
items.stones.stoneofclairvoyance.desc=Tento kámen okamžitě odhalí všechny plochy ve velmi široké oblasti okolo místa, kam byl hozen. Jeho efekt dokonce dosáhne i přes stěny.

items.stones.stoneofdeepsleep.name=Kámen hlubokého spánku
items.stones.stoneofdeepsleep.desc=Když je tento kámen hozen po nepříteli, upadne do hlubokého magického spánku. Takto uspaní nepřátelé se neprobudí, dokud nejsou vyrušeni.

items.stones.stoneofdetectmagic.name=Kámen detekce
items.stones.stoneofdetectmagic.inv_title=Odhal předmět
items.stones.stoneofdetectmagic.detected_none=Neohalil jsi žádnou magii, která by ovlivňovala tento předmět.
items.stones.stoneofdetectmagic.detected_both=Odhalil jsi, že na tento předmět působí jak posilující, tak zlá magie!
items.stones.stoneofdetectmagic.detected_good=Odhalil jsi posilující magii ovlivňující tento předmět!
items.stones.stoneofdetectmagic.detected_bad=Odhalil jsi zlou magii ovlivňující tento předmět!
items.stones.stoneofdetectmagic.desc=Tento runový kámen dokáže detekovat magii, která působí na předměty. Použití tohoto kamene na neidentifikovaný předmět ti odhalí, zda na předmět působí zlá kletba a jestli na něj působí posilující magie, jako jsou vylepšení nebo očarování.

items.stones.stoneofdisarming.name=Kámen odjištění
items.stones.stoneofdisarming.desc=Tento runový kámen obsahuje magii, která může deaktivovat škodlivé pasti, ukryté napříč kobkou. Odjistí až 9 pastí okolo místa, kam je hozen.

items.stones.stoneofenchantment.name=Kámen okouzlení
items.stones.stoneofenchantment.inv_title=Okouzli předmět
items.stones.stoneofenchantment.weapon=Tvá zbraň září ve tmě!
items.stones.stoneofenchantment.armor=Tvá zbroj září ve tmě!
items.stones.stoneofenchantment.desc=Tento runový kámen je obdařen magií okouzlení. Na rozdíl od svitku vylepšení nezvýší přímo sílu předmětu, ale místo toho naplní zbraň nebo zbroj magickým okouzlením, které předmětu poskytne novou sílu.

items.stones.stoneoffear.name=Kámen strachu
items.stones.stoneoffear.desc=Když je tento kámen po někom hozen, uchvátí zasaženou postavu teror a začne ve strachu utíkat. Útoky na prchající postavu zkrátí trvání efektu.

items.stones.stoneofflock.name=Kámen stáda
items.stones.stoneofflock.desc=Tento runový kámen vyvolá na krátkou chvíli magické ovce okolo místa, kam je hozen.

items.stones.stoneofintuition.name=Kámen intuice
items.stones.stoneofintuition.inv_title=Vyber předmět
items.stones.stoneofintuition.desc=Tento runový kámen obsahuje slabší verzi magie obsažené ve svitcích identifikace. Namísto přímého identifikování předmětu, bude pracovat s tvou intuicí a umožní ti pokusit se typ lektvaru, svitku či prstenu identifikovat pouhým hádáním.
items.stones.stoneofintuition.break_info=Kámen intuice lze použít dvakrát, než se rozbije. _Tvé příští použití kámen nespotřebuje_.
items.stones.stoneofintuition.break_warn=Kámen intuice už jsi jednou použil, takže _tvé příští použití kámen spotřebuje_.
items.stones.stoneofintuition$wndguess.text=Hádej, jaký typ neidentifikovaného předmět by to mohl být. Pokud uhádneš správně, bude identifikován!
items.stones.stoneofintuition$wndguess.correct=Správně. Typ předmětu byl identifikován!
items.stones.stoneofintuition$wndguess.incorrect=Tvůj odhad byl špatný.
items.stones.stoneofintuition$wndguess.break=Tvůj kámen intuice se rozpadá v prach...

items.stones.stoneofshock.name=Kámen probití
items.stones.stoneofshock.desc=Tento runový kámen uvolní výbuch elektrické energie, která krátce ochromí všechny cíle poblíž a obdaří toho, kdo jej hodil, nabitím hůlky za každý zasáhlí cíl.


###trinkets
items.trinkets.chaoticcenser.name=Chaotická kadidelnice
items.trinkets.chaoticcenser.spew=Tvá kadidelnice se chystá vypustit: %s.
items.trinkets.chaoticcenser.desc=Po nějaké době máčení v alchymickém kotlíku se zdá, jako by z této kadidelnice sám stoupal kouř! Z jejího nitra pomalu unikají různé plyny a postupně v náhodných intervalech vytryskávají ven všemi možnými směry. Zdá se, že dokáže vytvořit všechny možné plyny, ale budeš upozorněn chvíli před tím, než kadidelnice plyn vypustí.
items.trinkets.chaoticcenser.typical_stats_desc=Tento doplněk obvykle způsobí to, že se poblíž objeví oblak škodlivého plynu každých _%d_ tahů. Plyn se objeví pouze  v blízkosti nepřátel. Na vyšších úrovních je vyšší pravděpodobnost, že se bude jednat o vzácnější a nebezpečnější plyn.
items.trinkets.chaoticcenser.stats_desc=Tento doplněk na své současné úrovni způsobí to, že se poblíž objeví oblak škodlivého plynu každých _%d_ tahů. Plyn se objeví pouze  v blízkosti nepřátel. Na vyšších úrovních je vyšší pravděpodobnost, že se bude jednat o vzácnější a nebezpečnější plyn.

items.trinkets.crackedspyglass.name=Prasklý dalekohled
items.trinkets.crackedspyglass.desc=Tento ruční teleskop by byl krásnou ukázkou mistrovské řemeslné práce, nebýt dlouhé praskliny na jeho přední čočce. Zdá se, že ti pomáhá v kobce nalézt nové předměty, ale kvůli jeho poškození je těžké je spatřit.
items.trinkets.crackedspyglass.typical_stats_desc=Tento doplněk má obvykle _%1$s%% šanci_ vytvořit bonusový skrytý předmět na každém patře bez bosse.
items.trinkets.crackedspyglass.stats_desc=Tento doplněk má na své současné úrovni _%1$s%% šanci_ vytvořit bonusový skrytý předmět na každém patře bez bosse.
items.trinkets.crackedspyglass.stats_desc_upgraded=Tento doplněk má na své současné úrovni _100%% šanci_ vytvořit bonusový skrytý předmět na každém patře bez bosse, a navíc _%1$s%% šanci_ vytvořit i druhý skrytý předmět.

items.trinkets.dimensionalsundial.name=Dimenzionální sluneční hodiny
items.trinkets.dimensionalsundial.warning=Tvé sluneční hodiny nevrhají stín, cítíš se nesvůj.
items.trinkets.dimensionalsundial.desc=Tyto drobné kapesní sluneční hodiny nějakým způsobem vrhají stín i v hlubinách podzemí, a to i když je nedržíš rovně. Ještě zvláštnější je to, že se zdá, jako by neměly žádnou spojitost se sluncem v tomto světě. Když nevrhají stín, zdá se, jako kdyby přitahovaly potíže.
items.trinkets.dimensionalsundial.typical_stats_desc=Tento doplněk obvykle sníží počet nepřátel o _%1$d%%_, když je v reálném světě den (od 8 ráno do 8 večer), a zvýší počet nepřátel o _%2$d%%_, když je v reálném světě noc (od 8 večer do 8 ráno).
items.trinkets.dimensionalsundial.stats_desc=Tento doplněk na své současné úrovni sníží počet nepřátel o _%1$d%%_, když je v reálném světě den (od 8 ráno do 8 večer), a zvýší počet nepřátel o _%2$d%%_, když je v reálném světě noc (od 8 večer do 8 ráno).

items.trinkets.exoticcrystals.name=Exotické krystaly
items.trinkets.exoticcrystals.desc=Tyto malé růžové krystalky mají podobný tvar jako krystaly alchymické energie. Ačkoliv je nelze použít k alchymii přímo, zdá se, jako by nějakým záhadným způsobem ovlivňovaly, jaké svitky a lektvary najdeš.
items.trinkets.exoticcrystals.typical_stats_desc=Tento doplněk obvykle nahradí _%s%%_ lektvarů a svitků jejich vzácnými variantami. Toto se nevztahuje na lektvary síly, svitky vylepšení a předměty generované za účelem překonání překážky.
items.trinkets.exoticcrystals.stats_desc=Tento doplněk na své současné úrovni nahradí _%s%%_ lektvarů a svitků jejich vzácnými variantami. Toto se nevztahuje na lektvary síly, svitky vylepšení a předměty generované za účelem překonání překážky.

items.trinkets.eyeofnewt.name=Oko čolka
items.trinkets.eyeofnewt.desc=Toto černozlaté oko čolka skrvnitého je běžnou alchymickou ingrediencí, nyní je však upravené jako doplněk. Zdá se, že oslabuje tvůj vlastní zrak, ovšem umožňuje ti vidět věci jinými způsoby.
items.trinkets.eyeofnewt.typical_stats_desc=Tento doplněk obvykle sníží tvůj dohled o _%1$s%%_, ovšem umožní ti vycítit mysl tvých nepřátel na vzdálenost _%2$d_ políček.
items.trinkets.eyeofnewt.stats_desc=Tento doplněk na své současné úrovni sníží tvůj dohled o _%1$s%%_, ovšem umožní ti vycítit mysl tvých nepřátel na vzdálenost _%2$d_ políček.

items.trinkets.ferrettuft.name=Chomáč fretčí srsti
items.trinkets.ferrettuft.desc=Chomáč hebké srsti z fretky, svázaný zelenou pentlí s mašlí. Fretky jsou známé pro svou mrštnost, darebnost a rychlé reflexy, a část těchto vlastností jako by magicky vyzařovala z tohoto doplňku, zvyšujíc vyhýbání všem bytostem poblíž.
items.trinkets.ferrettuft.typical_stats_desc=Obvykle tento doplněk zvýší vyhýbání všech postav o _%1$s%%_.
items.trinkets.ferrettuft.stats_desc=Tento doplněk na své současné úrovni zvýší vyhýbání všech postav o _%1$s%%_.

items.trinkets.mimictooth.name=Zub mimika
items.trinkets.mimictooth.desc=Tento velký ostrý zub musel být vytržen velmi nešťastnému mimikovi. Zdá se, že ovlivňuje mimiky v kobce a činí je častějšími a nebezpečnějšími.
items.trinkets.mimictooth.typical_stats_desc=Tento doplněk učiní na své současné úrovni všechny druhy mimiků _%1$sx_ běžnějšími a ztíží jejich rozpoznávání, ovšem zvýší jejich kořist. Také způsobí na každém poschodí šanci _%2$s%%_ k výskytu obzvlášť zákeřného ebenového mimika.
items.trinkets.mimictooth.stats_desc=Tento doplněk učiní na své současné úrovni všechny druhy mimiků _%1$sx_ běžnějšími a ztíží jejich rozpoznávání, ovšem zvýší jejich kořist. Také způsobí na každém poschodí šanci _%2$s%%_ k výskytu obzvlášť zákeřného ebenového mimika.

items.trinkets.mossyclump.name=Hrouda mechu
items.trinkets.mossyclump.desc=Tento chomáč mokrého mechu si udržuje svou vlhkost, bez ohledu na to, jak moc ho stiskneš. Zdá se, že je magicky spojen s kobkou, což zvyšuje pravděpodobnost výskytu trávy a vody.
items.trinkets.mossyclump.typical_stats_desc=Tento doplněk obvykle nahradí _%d%%_ běžných poschodí poschodími plnými vody nebo vegetace.\n\nTento doplněk stojí hodně energie k vylepšení.
items.trinkets.mossyclump.stats_desc=Tento doplněk na své současné úrovni nahradí _%d%%_ běžných poschodí poschodími plnými vody nebo vegetace.\n\nTento doplněk stojí hodně energie k vylepšení.

items.trinkets.parchmentscrap.name=Útržek pergamenu
items.trinkets.parchmentscrap.desc=Tento drobný útržek pergamenu byl kdysi nejspíše součástí magického svitku. Část jeho magie se zachovala, a teď se zdá, že ovlivňuje zbraně a zbroje, na které narazíš.
items.trinkets.parchmentscrap.typical_stats_desc=Tento doplněk učiní obvykle očarování a runy _%dx_ častější, a kletby na zbaních a zbrojích _%sx_ častější. Kletby hůlek, prstenů a artefaktů nejsou ovlivněny.\n\nTento doplněk stojí hodně energie k vylepšení.
items.trinkets.parchmentscrap.stats_desc=Tento doplněk učiní na své současné úrovni očarování a runy _%dx_ častější, a kletby na zbaních a zbrojích _%sx_ častější. Kletby hůlek, prstenů a artefaktů nejsou ovlivněny.\n\nTento doplněk stojí hodně energie k vylepšení.

items.trinkets.petrifiedseed.name=Zkamenělé semínko
items.trinkets.petrifiedseed.desc=Toto semínko zkamenělo, buď pomalými geologickými procesy, nebo magií. Semeno se zdá být magicky ovlivňující flóru kobky, a občas nahrazuje semínka runovými kameny.
items.trinkets.petrifiedseed.typical_stats_desc=Tento doplněk obvykle nahradí semínka získaná pošlapáváním trávy z _%1$s%%_ runovými kameny, a také zvýší množství předmětů získaných z vysoké trávy o _%2$s%%_.
items.trinkets.petrifiedseed.stats_desc=Tento doplněk na své současné úrovni nahradí semínka získaná pošlapáváním trávy z _%1$s%%_ runovými kameny, a také zvýší množství předmětů získaných z vysoké trávy o _%2$s%%_.

items.trinkets.ratskull.name=Krysí lebka
items.trinkets.ratskull.desc=Tento morbidní doplněk není o mnoho větší než lebka normální krysy, což je v této kobce vlastně vzácnost. Zdá se, že její přítomnost přitahuje vzácnější obyvatele kobky, na které budeš narážet častěji.
items.trinkets.ratskull.typical_stats_desc=Tento doplněk obvykle způsobí, že se vzácní nepřátelé budou objevovat _%dx_ častěji. Účinek lebky je ovšem jen poloviční pro krystalové mimiky a obrněné sochy.
items.trinkets.ratskull.stats_desc=Tento doplněk na své současné úrovni způsobí, že se vzácní nepřátelé budou objevovat _%dx_ častěji. Účinek lebky je ovšem jen poloviční pro krystalové mimiky a obrněné sochy.

items.trinkets.saltcube.name=Kostka soli
items.trinkets.saltcube.desc=Tento velký solný krystal byl vyřezán do téměř dokonalého tvaru kostky a nějakým způsobem se mu podařilo odčerpat polovinu vody z alchymistického kotlíku místo toho, aby se rozpustil. Zdá se, že magicky dehydruje a konzervuje jídlo, které jíš, čímž prodlužuje sytost, ale také snižuje obnovu zdraví, když nehladovíš.
items.trinkets.saltcube.typical_stats_desc=Tento doplněk obvykle prodlouží dobu, za kterou dostaneš hlad, o _%1$s%%_, ovšem zpomalí tvou přirozenou regeneraci zdraví o _%2$s%%_, pokud není podlaží zamčené.
items.trinkets.saltcube.stats_desc=Tento doplněk na své současné úrovni prodlouží dobu, za kterou dostaneš hlad, o _%1$s%%_, ovšem zpomalí tvou přirozenou regeneraci zdraví o _%2$s%%_, pokud není podlaží zamčené.

items.trinkets.shardofoblivion.name=Úlomek zapomnění
items.trinkets.shardofoblivion.desc=Po vylouhování v alchymickém kotli se tento kovový úlomek přeměnil, a zdá se, jako by byl vyroben z... ničeho? Světlo se kolem něj láme a visí v prostoru, i když jej nedržíš. Zdá se, jako by bral svou magickou sílu z tvé nevědomosti, takže bude asi nejlepší o něm příliš nepřemýšlet.
items.trinkets.shardofoblivion.typical_stats_desc=Tento doplněk obvykle zvýší šanci tvých nepřátel na zanechání kořisti o 20%% za každý neidentifikovaný předmět, kterým jsi vybaven nebo který jsi nedávno použil, nanejvýš však za _%d_ kus(y) vybavení. Úlomek ti také zabraňuje identifikovat vybavení, ovšem lze jej použít k ruční identifikaci předmětů, které jsou na to již připraveny.
items.trinkets.shardofoblivion.stats_desc=Tento doplněk na své současnné úrovni zvýší šanci tvých nepřátel na zanechání kořisti o 20%% za každý neidentifikovaný předmět, kterým jsi vybaven nebo který jsi nedávno použil, nanejvýš však za _%d_ kus(y) vybavení. Úlomek ti také zabraňuje identifikovat vybavení, ovšem lze jej použít k ruční identifikaci předmětů, které jsou na to již připraveny.
items.trinkets.shardofoblivion.ac_identify=IDENTIFIKOVAT
items.trinkets.shardofoblivion.identify_prompt=Identifikuj předmět
items.trinkets.shardofoblivion.identify_ready=Předmět je připraven k identifikaci: %s. Použij Úlomek zapomnění k jeho identifikaci.
items.trinkets.shardofoblivion.identify_ready_worn=Tvé vybavené předměty jsou nyní všechny připrraveny k identifikaci. Použij Úlomek zapomnění k jejich identifikaci.
items.trinkets.shardofoblivion.identify_not_yet=Tento předmět ještě není připraven k identifikaci.
items.trinkets.shardofoblivion.identify=Identifikoval jsi předmět!
items.trinkets.shardofoblivion$wandusetracker.name=Použita neidentifikovaná hůlka
items.trinkets.shardofoblivion$wandusetracker.desc=Nedávno jsi použil neidentifikovanou hůlku, která se na krátkou dobu počítá jako použitý neidentifikovaný předmět pro tvůj úlomek zapomnění.\n\nZbývá tahů: %s.
items.trinkets.shardofoblivion$thrownusetracker.name=Použita neidentifikovaná vrhací zbraň
items.trinkets.shardofoblivion$thrownusetracker.desc=Nedávno jsi použil neidentifikovanou vrhací zbraň, která se na krátkou dobu počítá jako použitý neidentifikovaný předmět pro tvůj úlomek zapomnění.\n\nZbývá tahů: %s.

items.trinkets.thirteenleafclover.name=Třináctilístek
items.trinkets.thirteenleafclover.desc=Ponoření této rostlinky jetele do kotle způsobilo, že mu vyrostlo několik lístků navíc! Těžko říct, jestli přináší štěstí nebo smůlu, ale možná tento doplněk mohl jen učinit náhodu více chaotickou.
items.trinkets.thirteenleafclover.typical_stats_desc=Tento doplněk obvykle způsobí to, že tvé útoky způsobí nejvyšší možné poškození v _%1$d%%_ případů a nejnižší možné poškození v _%2$d%%_ případů.
items.trinkets.thirteenleafclover.stats_desc=Tento doplněk na své současné úrovni způsobí to, že tvé útoky způsobí nejvyšší možné poškození v _%1$d%%_ případů a nejnižší možné poškození v _%2$d%%_ případů.

items.trinkets.trapmechanism.name=Soukolí pasti
items.trinkets.trapmechanism.desc=Klíčový mechanismus jedné z mnoha padacích pastí v kobce, pečlivě vyjmutý z podlahy, aby jej bylo možné vzít. Zdá se, že je magicky provázán se samotným podzemím, a ačkoliv činí okolní terén obtížnějším, zvyšuje i tvoje vnímání terénu.
items.trinkets.trapmechanism.typical_stats_desc=Tento doplněk obvykle nahradí _%1$d%%_ běžných poschodí poschodími s pastmi nebo jámami. Navíc způsobí, že _%2$d%%_ skrytých pastí v kobce bude odhaleno.
items.trinkets.trapmechanism.stats_desc=Tento doplněk na své současné úrovni nahradí _%1$d%%_ běžných poschodí poschodími s pastmi nebo jámami. Navíc způsobí, že _%2$d%%_ skrytých pastí v kobce bude odhaleno.

items.trinkets.vialofblood.name=Lahvička s krví
items.trinkets.vialofblood.desc=Tato tenká lahvička obsahuje krev nějakého obyvatele kobky, která se pomalu pohybuje, když s lahvičkou otáčíš. Zdá se, že magicky posiluje silnější léčebné účinky, ale také je zpožďuje.
items.trinkets.vialofblood.typical_stats_desc=Tento doplněk obvykle zvýší celkové množství životů, které ti obnoví lektvary léčení, měch s vodou nebo studny zdraví o _%1$s%%_. Tyto léčivé efekty se však budou projevovat pomaleji a obnoví nanejvýš _%2$s_ životů za kolo (tato hodnota roste s úrovní hrdiny).
items.trinkets.vialofblood.stats_desc=Tento doplněk na své současné úrovni zvýší celkové množství životů, které ti obnoví lektvary léčení, měch s vodou nebo studny zdraví o _%1$s%%_. Tyto léčivé efekty se však budou projevovat pomaleji a obnoví nanejvýš _%2$s_ životů za kolo (tato hodnota roste s úrovní hrdiny).

items.trinkets.wondrousresin.name=Divutvorná pryskyřice
items.trinkets.wondrousresin.desc=Tato modrá třpytivá pryskyřice destilovala esenci magie prokleté hůlky. Vypadá to, že ji magie z alchymistického kotlíku částečně stabilizovala, a nyní ovlivňuje tvé hůlky.
items.trinkets.wondrousresin.typical_stats_desc=Tento doplněk způsobí obyvkle to, že efekt při použití prokletých hůlek bude neutrální nebo pozitivní v _%1$s%%_ případů, a také poskytne šanci _%2$s%%_ seslat prokletý výšleh hůlky po použití neprokleté hůlky.\n\nTento doplněk stojí hodně energie k vylepšení.
items.trinkets.wondrousresin.stats_desc=Tento doplněk způsobí na své současné úrovni to, že efekt při použití prokletých hůlek bude neutrální nebo pozitivní v _%1$s%%_ případů, a také poskytne šanci _%2$s%%_ seslat prokletý výšleh hůlky po použití neprokleté hůlky.\n\nTento doplněk stojí hodně energie k vylepšení.

items.trinkets.trinketcatalyst.name=Magický katalyzátor
items.trinkets.trinketcatalyst.window_title=Vytvořit doplněk
items.trinkets.trinketcatalyst.window_text=Voda v kotli začíná svítit, když do ní vložíš katalyzátor. V okolí je zrovna několik drobností, které bys mohl naplnit jeho energií a učinit z nich magický doplněk.
items.trinkets.trinketcatalyst.desc=Tento slepenec magického prášku se třpytí ve tmě kobky. Tento katalyzátor lze v alchymickém kotli použít k výrobě unikátního magického doplňku.\n\nDoplňky poskytují rozličné efekty, které lehce upravují podzemí nebo jeho obyvatele. Lze je vylepšit alchymickou energií a posílit tak jejich účinek, nebo je zahodit a vůbec nebrat v potaz.
items.trinkets.trinketcatalyst$randomtrinket.name=Náhodný doplněk
items.trinkets.trinketcatalyst$randomtrinket.desc=Nějaký drobný předmět je schovaný ve váčku, který se ti nedaří otevřít.\n\nAlchymické procesy dokáží váček rozpustit, ale dokud to neuděláš, nevíš, jaký doplněk se v něm ukrývá!

items.trinkets.trinket.discover_hint=Tento předmět má šanci moci být vyroben, pokud si  vyrábíš doplněk skrze alchymii.
items.trinkets.trinket$placeholder.name=Doplněk

###wands
items.wands.cursedwand.ondeath=Zabíjí tě vlastní %s.
items.wands.cursedwand.nothing=Nic se nestalo.
items.wands.cursedwand.mass_invuln=Z tvé hůlky vyšlehlo jasné bílé světlo!
items.wands.cursedwand.petrify=Najednou zamrzáš na místě!
items.wands.cursedwand.grass=Vzrostly kolem tebe rostliny!
items.wands.cursedwand.fire=Cítíš, jak něco hoří...
items.wands.cursedwand.transmogrify_wand=Tvá hůlka se přeměnila v úplně jiný předmět!
items.wands.cursedwand.transmogrify_other=Nějaký tvůj předmět se mění na něco jiného!
items.wands.cursedwand.disguise=Tvůj vzhled se ti mění před očima!
items.wands.cursedwand.supernova=Hořící koule energie začíná růst. Možná bys měl utíkat!
items.wands.cursedwand.supernova_positive=Hořící koule energie začíná růst, ale zdá se, že je to bezpečné.
items.wands.cursedwand.sinkhole=Země se kolem tebe začíná rozpadat!
items.wands.cursedwand.sinkhole_positive=Zem se začíná propadat, ale pod tvýma nohama se zdá být pevná.
items.wands.cursedwand.gravity=Gravitace najednou začíná působit náhodnými směry!
items.wands.cursedwand.gravity_positive=Gravitace najednou začíná působit náhodnými směry, ale zdá se, že na tebe nemá vliv.
items.wands.cursedwand.gravity_end=Gravitační chaos končí.

items.wands.damagewand.upgrade_stat_name_1=Magické poškození

items.wands.wand.ac_zap=SESLAT
items.wands.wand.fizzles=Tvá hůlka zasyčela. Nespíš je úplně vybitá.
items.wands.wand.no_magic=Tvá hůlka zasyčela. Nemůžeš používat hůlky během magické imunity.
items.wands.wand.self_target=Nemůžeš zacílit sebe!
items.wands.wand.identify=Nyní dostatečně znáš svou hůlku.
items.wands.wand.resin_one=Tato hůlka získala _1 úroveň_ z kouzelné pryskyřice.
items.wands.wand.resin_many=Tato hůlka získala _%d úrovně_ z kouzelné pryskyřice.
items.wands.wand.cursed=Hůlka je prokletá, což dělá její magii chaotickou a náhodnou.
items.wands.wand.not_cursed=Z hůlky neuniká žádná zlá magie.
items.wands.wand.curse_discover=%s je prokletá!
items.wands.wand.prompt=Urči místo seslání
items.wands.wand$placeholder.name=hůlka

items.wands.wandofblastwave.name=Hůlka nárazové vlny
items.wands.wandofblastwave.staff_name=Hůl nárazové vlny
items.wands.wandofblastwave.ondeath=Zabíjíš se svou vlastní Hůlkou nárazové vlny...
items.wands.wandofblastwave.knockback_ondeath=Náraz tě zabíjí...
items.wands.wandofblastwave.desc=Tato hůlka je vyrobena z mramorového kamene, se zlatým lemem a kulatým černým drahokamem na špičce. Přijde ti velmi těžká.
items.wands.wandofblastwave.typical_stats_desc=Tato hůlka sesílá střely, které na cíleném místě prudce vybuchují. Síla tohoto nárazu uděluje _%1$d-%2$d poškození_ a je dostatečně silná na odhození většiny nepřátel.
items.wands.wandofblastwave.stats_desc=Hůlka sesílá střely, které na cíleném místě prudce vybuchují. Síla tohoto nárazu uděluje _%1$d-%2$d poškození_ a je dostatečně silná na odhození většiny nepřátel.
items.wands.wandofblastwave.upgrade_stat_name_2=Odhození
items.wands.wandofblastwave.bmage_desc=Když _Bojový mág_ udeří omráčeného nepřítele holí nárazové vlny, sejme tím jeho omráčení a způsobí místo toho silné magické poškození. Tento efekt má pro každého nepřítele krátký cooldown.
items.wands.wandofblastwave.eleblast_desc=Výbuch elementů s holí nárazové vlny způsobí 67% poškození a odhodí všechny nepřátele pryč ze zasažené oblasti.

items.wands.wandofcorrosion.name=Hůlka žíravosti
items.wands.wandofcorrosion.staff_name=Hůl žíravosti
items.wands.wandofcorrosion.desc=Tato hůlka má bledé tělo, které se otevírá v oslnivý oranžový drahokam.
items.wands.wandofcorrosion.stats_desc=Tato hůlka vystřelí na cílenou lokaci mrak vysoce žíravého plynu. Všichni chyceni v tomto mraku budou každý tah dostávat zranění, které se s časem zvyšuje, počínaje na _%d zranění_.
items.wands.wandofcorrosion.upgrade_stat_name_1=Zranění žíravostí
items.wands.wandofcorrosion.upgrade_stat_name_2=Objem plynu
items.wands.wandofcorrosion.bmage_desc=Když _Bojový mág_ udeří nepřítele holí žíravosti, má nepřítel šanci, že bude pokryt žíravým slizem.
items.wands.wandofcorrosion.eleblast_desc=Výbuch elementů s holí žíravosti způsobí nepřátelům 4 tahy rozežírání, počínajíc na 6 poškození.

items.wands.wandofcorruption.name=Hůlka zkaženosti
items.wands.wandofcorruption.staff_name=Hůl zkaženosti
items.wands.wandofcorruption.already_corrupted=Tato postava nemůže být více ovlivněna.
items.wands.wandofcorruption.desc=Tato hůlka vyzařuje chaotickou temnou energii. Pokud to ještě není jasné, vychází z malé dekorativní lebky vytvarované na špičce.
items.wands.wandofcorruption.stats_desc=Hůlka vypustí proud energie, která různými způsoby oslabí tvé nepřátele a občas je i podvolí tvé vůli efektem zkaženosti. Nepřátelé jsou schopni zkaženosti odolat, ale oslabení nepřátelé podlehnou zkaženosti mnohem snadněji, než ti zdraví.
items.wands.wandofcorruption.upgrade_stat_name_1=Síla zkaženosti
items.wands.wandofcorruption.upgrade_stat_name_2=Trvání efektů
items.wands.wandofcorruption.bmage_desc=Když _Bojový mág_ udeří nepřítele holí zkaženosti, je šance, že nepřítele popadne amok.
items.wands.wandofcorruption.eleblast_desc=Výbuch elementů s holí zkaženosti způsobí všem nepřátelům na 5 kol amok.

items.wands.wandofdisintegration.name=Hůlka ničivých paprsků
items.wands.wandofdisintegration.staff_name=Hůl ničivých paprsků
items.wands.wandofdisintegration.desc=Tato hůlka je vyrobena z pevného, hladkého kusu obsidiánu s tajemným fialovým světlem, které se táhne po boku a končí na špičce. Září ničivou energií, čekající na vypuštění.
items.wands.wandofdisintegration.stats_desc=Hůlka sesílá paprsky, které protnou jakoukoliv překážku a dosáhnou tím dál, čím více je hůlka vylepšena. Paprsek uděluje _%1$d-%2$d poškození,_ a také udělí bonusové poškození za každého nepřítele a stěnu, kterou pronikne.
items.wands.wandofdisintegration.upgrade_stat_name_2=Maximální dosah
items.wands.wandofdisintegration.bmage_desc=Když je držena _Bojovým mágem_, má hůl ničivých paprsků zvýšený dosah.
items.wands.wandofdisintegration.eleblast_desc=Výbuch elementů s holí ničivých paprsků způsobí 100% poškození, a to i přes zdi.

items.wands.wandoffireblast.name=Hůlka ohnivé střely
items.wands.wandoffireblast.staff_name=Hůl ohnivé střely
items.wands.wandoffireblast.desc=Tato hůlka je vyrobena z červeného lakovaného dřeva se zlatým páskem, který je použit aby vypadala takto nádherně. Špička praská, syčí a touží vypustit svou mocnou magii.
items.wands.wandoffireblast.stats_desc=Tato hůlka vychrlí při použití kuželovitý proud ohně. Její příští útok spořebuje _%1$d nabití_ a způsobí _%2$d-%3$d poškození_. Čím více nabití hůlka spotřebuje, tím silnější je její efekt.
items.wands.wandoffireblast.upgrade_stat_name_1=Zranění 1 nabitím
items.wands.wandoffireblast.upgrade_stat_name_2=Zranění 2 nabitími
items.wands.wandoffireblast.upgrade_stat_name_3=Zranění 3 nabitími
items.wands.wandoffireblast.bmage_desc=Když _Bojový mág_ udeří nepřítele holí ohnivé střely, je šance, že způsobí explozi, která pohltí všechny okolní plameny a zraní tím nepřátele. Tato šance roste s množstvím ohně okolo nepřítele.
items.wands.wandoffireblast.eleblast_desc=Výbuch elementů s holí ohnivé střely způsobí 100% poškození, vyrazí dveře a zapálí jak nepřátele, tak terén.

items.wands.wandoffrost.name=Hůlka mrazu
items.wands.wandoffrost.staff_name=Hůl mrazu
items.wands.wandoffrost.desc=Tato hůlka vypadá, že je vyrobena z nějakého druhu magického ledu. Směrem k zaoblené špičce září mnohem jasněji. Cítíš, jak je na dotek chladná, ale tvá ruka stejně zůstává teplá.
items.wands.wandoffrost.stats_desc=Tato hůlka vystřelí na tvé nepřátele ledovou střelu, která způsobí _%1$d-%2$d poškození_ a zchladí je. Tento efekt je silnější ve vodě. Nepřátelům, kteří už zchlazení nebo zamrzlí jsou, způsobuje tato hůlka menší poškození.
items.wands.wandoffrost.upgrade_stat_name_2=Trvání ochlazení
items.wands.wandoffrost.bmage_desc=Když _Bojový mág_ udeří nepřítele holí mrazivé střely, mají šanci okamžitě zamrznout. Tato šance tím větší, čím víc je nepřítel ochlazen.
items.wands.wandoffrost.eleblast_desc=Výbuch elementů s holí mrazu způsobí 100% poškození, zmrazí nepřátele a uhasí ohně.

items.wands.wandoflightning.name=Hůlka blesků
items.wands.wandoflightning.staff_name=Hůl blesků
items.wands.wandoflightning.ondeath=Zabíjíš se svou vlastní Hůlkou blesků...
items.wands.wandoflightning.desc=Tato hůlka je vyrobena z pevného kovu, takže je překvapivě těžká. Na špičce se k sobě zakřivují dva hroty, mezi kterými jiskří elektřina.
items.wands.wandoflightning.stats_desc=Tato hůlka sešle mocný elektrický výboj proti čemukoliv, na co je namířena a způsobí _%1$d-%2$d poškození_. Taková elektřina může přeskočit na postavy stojící poblíž, obzvlášť dobře se šíří ve vodě. Přeskočené výboje mohou ublížit i tobě, nezraní však tvé spojence.
items.wands.wandoflightning.bmage_desc=Když _Bojový mág_ udeří nepřítele holí blesků, má šanci seslat se na 10 tahů nabít elektřinou. Když je Bojový mág takto nabitý, je imunní vůči poškození bleskem a jeho blesky budou přeskakovat na delší vzdálenosti.
items.wands.wandoflightning.eleblast_desc=Výbuch elementů s holí blesků způsobí 100% poškození, paraylzuje napřátele na 5 kol a elektrifikuje vodu.
items.wands.wandoflightning$lightningcharge.name=Elektricky nabitý
items.wands.wandoflightning$lightningcharge.desc=Bojový mág jiskří energií, což mu poskytuje imunitu před blesky z jeho hole a zvyšuje vzdálenost, na niž budou přeskakovat.\n\nZbývá tahů: %s.

items.wands.wandoflivingearth.name=Hůlka živoucí země
items.wands.wandoflivingearth.staff_name=Hůl živoucí země
items.wands.wandoflivingearth.desc=Tato hůlka je vyrobena ze zvláštního kamene s pruhy zářící žluté energie. Jakmile hůlku sevřeš, přijde ti, že kameny se mírně pohnuly, jakoby mohly cítit tvou ruku.
items.wands.wandoflivingearth.stats_desc=Hůlka vyšle na nepřátele smršť magických kamenů udělující _%1$d-%2$d poškození._ Kameny se poté uspořádají kolem uživatele, poskytující obranu v poměru k poškození, které udělily. Pokud je vytvořeno dostatek kamenů, zformují se ve chvíli, kdy hůlku znovu použiješ, do kamenného ochránce.
items.wands.wandoflivingearth.upgrade_stat_name_2=Maximální HP ochránce
items.wands.wandoflivingearth.upgrade_stat_name_3=Zbroj ochránce
items.wands.wandoflivingearth.bmage_desc=Když _Bojový mág_ udeří nepřítele holí živoucí země, část způsobeného poškození se mu vrátí jako kamenná zbroj.
items.wands.wandoflivingearth.eleblast_desc=Výbuch elementů s holí živoucí země způsobí 50% poškození a vyléčí vyvolaného kamenného ochránce za každého zasaženého nepřítele.
items.wands.wandoflivingearth$rockarmor.name=Kamenná zbroj
items.wands.wandoflivingearth$rockarmor.desc=Magické kameny obklopují tvé tělo, snaží se za tebe blokovat cizí útoky a snižují obdržené poškození o 50%%. Každé zablokované poškození ovšem některé kameny kolem tebe rozbije.\n\nZbývající kamenná zbroj: %1$d\n\nPokud je kolem tebe nashromážděno dostatek kamenů, další použití tvé hůlky živoucí země způsobí, že se kameny zformují do ochránce, který za tebe bude bojovat.\n\nZbroj potřebná pro ochránce: %2$d
items.wands.wandoflivingearth$rockarmor.desc_many=Tento kamenný ochránce je pod vlivem Síly mnoha. Zbývá tahů: %d.
items.wands.wandoflivingearth$earthguardian.name=Kamenný ochránce
items.wands.wandoflivingearth$earthguardian.desc=Kameny z tvé hůlky živoucí země se zformovaly do silného kamenného ochránce! Tento strážce země bude útočit na nepřátele poblíž, což je přinutí soustředit svůj útok na ochránce, místo na tebe. Když jsou všechny hrozby poblíž pryč, ochránce se rozloží zpět kolem tebe a vrátí se, až znovu použiješ svou hůlku.
items.wands.wandoflivingearth$earthguardian.wand_info=Ochráncova obranná síla se váže k úrovni tvé hůlky. Aktuálně blokuje _%1$d-%2$d poškození._
items.wands.wandoflivingearth$earthguardian.discover_hint=S touto postavou se můžeš setkat pomocí jedné specifické hůlky.

items.wands.wandofmagicmissile.name=Hůlka magických střel
items.wands.wandofmagicmissile.staff_name=Hůl magických střel
items.wands.wandofmagicmissile.desc=Tato poměrně prostá hůlka vypouští střely čisté magické energie. Přestože postrádá jakékoliv speciální schopnosti, má více dostupných nabití a pokud je vylepšena, dokáže na chvíli posílit účinky ostatních hůlek.
items.wands.wandofmagicmissile.stats_desc=Každá střela z této hůlky udělí _%1$d-%2$d poškození_ a když je vylepšená, na krátký moment posílí ostatní hůlky.
items.wands.wandofmagicmissile.bmage_desc=Když _Bojový mág_ udeří nepřítele holí magických střel, získají nabití všechny jeho hůlky.
items.wands.wandofmagicmissile.eleblast_desc=Výbuch elementů s holí magických střel způsobí 50% poškození a poskytne mágovi 15 tahů nabíjení hůlek.
items.wands.wandofmagicmissile.discover_hint=S tímto předmětem začíná jeden z hrdinů.
items.wands.wandofmagicmissile$magiccharge.name=Magický náboj
items.wands.wandofmagicmissile$magiccharge.desc=Tvá hůlka magických střel dodává zpět tvým ostatním hůlkám sílu a zvyšuje účinnost jejich dalšího výstřelu.\n\nOstatní hůlky jsou dočasně vylepšeny na: +%d\n\nZbývající tahy magického posílení: %s

items.wands.wandofprismaticlight.name=Hůlka čirého světla
items.wands.wandofprismaticlight.staff_name=Hůl čirého světla
items.wands.wandofprismaticlight.desc=Tato hůlka je vyrobena z pevného kusu průsvitného krystalu. Jako dlouhý kus hladkého skla. Malé paprsky barevného světla tancují kolem špičky hůlky, která touží vypálit.
items.wands.wandofprismaticlight.stats_desc=Hůlka vysílá paprsky světla, které protínají temnotu kobky a odkrývají skrytá místa a pasti. Světelný paprsek může oslepit nepřátele a udělit _%1$d-%2$d poškození._ Démoni a nemrtví nepřátele jsou jasným světlem hůlky spáleni a obdrží bonusové poškození.
items.wands.wandofprismaticlight.upgrade_stat_name_2=Šance oslepení
items.wands.wandofprismaticlight.upgrade_stat_name_3=Trvání osvětlení
items.wands.wandofprismaticlight.bmage_desc=Když _Bojový mág_ udeří nepřítele holí čirého světla, na krátkou dobu je zmrzačí. Tato doba se zvyšuje s úrovní hole.
items.wands.wandofprismaticlight.eleblast_desc=Výbuch elementů s holí čirého světla způsobí 67% poškození, odhalí všechen terén v zasažené oblasti a oslepí nepřátele na 5 kol.

items.wands.wandofregrowth.name=Hůlka růstu
items.wands.wandofregrowth.staff_name=Hůl růstu
items.wands.wandofregrowth.desc=Tato hůlka je vyrobena z tenkého, mistrovsky vyřezávaného dřívka. Cítíš, jak stále pulzuje životem, jako mladý, rodící se strom. ''Když jeden život zhasne, nový se narodí... Nekonečný kruh stále přetrvává!''
items.wands.wandofregrowth.stats_desc=Při použití sešle tato hůlka kuželovitý proud růstové energie, který probudí trávu, semínka, kořeny i vzácné rostliny k životu. Její příští použití spotřebuje _%1$d nabití_. Čím více nabití hůlka spotřebuje, tím větší a silnější bude mít účinek.
items.wands.wandofregrowth.degradation=Po použití dalších _%d nabití_ ztratí tato hůlka schopnost tvořit vzácné rostliny a čerstvou trávu. Tento limit lze navýšit postoupením na další úroveň nebo vylepšením hůlky.
items.wands.wandofregrowth.upgrade_stat_name_1=Vegetace na nabití
items.wands.wandofregrowth.upgrade_stat_name_2=Celkový limit vegetace
items.wands.wandofregrowth.bmage_desc=Když _Bojový mág_ udeří nepřítele holí růstu zatímco stojí na trávě, získá efekt rostlinného léčení v závislosti na uděleném poškození.
items.wands.wandofregrowth.eleblast_desc=Výbuch elementů s holí růstu uvězní nepřátele kořeny a způsobí vyrašení vegetace náhodně po zasažené oblasti.
items.wands.wandofregrowth$dewcatcher.name=Rosnatka
items.wands.wandofregrowth$dewcatcher.desc=Rosnatka je vzácná a nenápadná rostlina, která zachycuje kouzelnou rosu. Většinou se snaží maskovat jako obyčejná tráva, ale velké kapky nasbírané rosy ji prozrazují.
items.wands.wandofregrowth$dewcatcher.discover_hint=S touto rostlinou se můžeš setkat pomocí jedné specifické hůlky.
items.wands.wandofregrowth$seedpod.name=Semeník
items.wands.wandofregrowth$seedpod.desc=Semeník je magická rostlina, která namísto vlastních semínek, produkuje raději semínka ostatních typů rostlin. Přestože nemá žádný vlastní zdroj rozmnožování, nějakým způsobem se zvládá dál šířit.
items.wands.wandofregrowth$seedpod.discover_hint=S touto rostlinou se můžeš setkat pomocí jedné specifické hůlky.
items.wands.wandofregrowth$lotus.name=Zlatý lotos
items.wands.wandofregrowth$lotus.desc=Zlatý lotos je mystická rostlina, která může být vyvolána pouze mocnou hůlkou růstu. Jeho aura posiluje všechny okolní rostliny a jejich účinky, ale lotos rychle ztrácí svou energii a po krátké době uhyne.
items.wands.wandofregrowth$lotus.wand_info=Tento lotos byl vytvořen hůlkou růstu úrovně _+%1$d_. Všechny ostatní rostliny v jeho dosahu se _okamžitě aktivují_, pokud vyrostly přímo pod nějakou postavou. Také budou mít _%2$d%% šanci_ zanechat po sobě nazpět své semínko, a napuštěné šipky přijdou v auře lotosu o _%3$d%% méně výdrže._
items.wands.wandofregrowth$lotus.discover_hint=S touto rostlinou se můžeš setkat pomocí jedné specifické hůlky, pokud ji několikrát vylepšíš.

items.wands.wandoftransfusion.name=Hůlka transfuze
items.wands.wandoftransfusion.staff_name=Hůl transfuze
items.wands.wandoftransfusion.ondeath=Zabíjíš se svou vlastní Hůlkou transfuze...
items.wands.wandoftransfusion.charged=Hůl je nabita životní energií tvých nepřátel!
items.wands.wandoftransfusion.desc=Poměrně jednoduše tvarovaná hůlka, která vyniká díky svému purpurovému odstínu a černému drahokamu na špičce.
items.wands.wandoftransfusion.stats_desc=Při použití na spojence nebo okouzlené nepřátele sebere tato hůlka _%1$d životů sesilatele_, aby svému cíli vyléčila _%2$d životů_, případně poskytla dodatečnou ochranu. Je-li použita na nepřítele, na krátkou dobu jej okouzlí a poskytne sesilateli _%3$d body dodatečné ochrany_. Nemrtvým nepřátelům hůlka namísto okouzlení způsobí _%4$d-%5$d poškození_.
items.wands.wandoftransfusion.upgrade_stat_name_1=Léčení spojence
items.wands.wandoftransfusion.upgrade_stat_name_2=Dodatečná ochrana
items.wands.wandoftransfusion.upgrade_stat_name_3=Poškození nemrtvým
items.wands.wandoftransfusion.bmage_desc=Když _Bojový mág_ udeří nepřítele holí transfuze, získá dočasnou ochranu a jeho přístí seslání nebude stát žádné zdraví.
items.wands.wandoftransfusion.eleblast_desc=Výbuch elementů s holí transfuze okouzlí nepřátele, vyléčí spojence a způsobí 100% poškození nemrtvým nepřátelům.

items.wands.wandofwarding.name=Hůlka ochrany
items.wands.wandofwarding.staff_name=Hůl ochrany
items.wands.wandofwarding.no_more_wards=Tvá hůlka už nedokáže vytvořit více ochranných entit.
items.wands.wandofwarding.bad_location=Nemůžeš zde umístit ochranný znak.
items.wands.wandofwarding.desc=Této krátké kovové hůlce se nad špičkou vznáší jasný purpurový drahokam.
items.wands.wandofwarding.stats_desc=Namísto přímého poškození nepřátel, vyvolá tato hůlka nehybné ochranné entity, jako jsou znaky a krystaly. Entity mohou být vyvolány kdekoliv, kde dohlédneš. Magii hůlky lze vyslat i přes zdi, pokud tvá postava dokáže nějakým způsobem vidět i na místa, které normálně nevidí. K udržení ochranných entit ti hůlka v tuto chvíli poskytuje _%d b. energie._
items.wands.wandofwarding.upgrade_stat_name_1=Poškození ochranných entit
items.wands.wandofwarding.upgrade_stat_name_2=Energie ochranných entit
items.wands.wandofwarding.bmage_desc=Když _Bojový mág_ udeří nepřítele holí ochrany, mají všechny jeho aktivní ochranné krystaly a znaky šanci se vyléčit.
items.wands.wandofwarding.eleblast_desc=Výbuch elementů s holí ochrany vyléčí všechy ochranné krystaly a znaky v zasažené oblasti.
items.wands.wandofwarding$ward.desc_generic_ward=Tento ochranný znak sežehne každého nepřítele, který se jí dostane na dohled.\n\nSeslání kouzla tvou hůlkou ochrany na již vyvolanou entitu ji vylepší.\n\nOchranné znaky mohou seslat jen omezené množství výšlehů, než se rozplynou.
items.wands.wandofwarding$ward.desc_generic_sentry=Tento menší ochranný krystal má stejnou palebnou sílu jako ochranný znak, ovšem má životy namísto předem daného počtu útoků. Vzhledem připomíná drahokam na špičce tvé hůlky ochrany. \n\nZacílení tohoto ochranného krystalu hůlkou ochrany ho vylepší a vyléčí.\n\nTento ochranný krystal spotřebuje na každý útok část svých životů, avšak ty mu lze doplnit použitím hůlky ochrany.
items.wands.wandofwarding$ward.name_1=Menší ochranný znak
items.wands.wandofwarding$ward.desc_1=Tato základní ochranná entita sežehne každého nepřítele, který se jí dostane na dohled a udělí _%1$d-%2$d poškození._\n\nSesláním kouzla hůlkou ochrany na již vyvolanou entitu ji vylepšíš.\n\nTento ochranný znak vystřelí pouze jednou, než se rozptýlí.\n\nHůlka ochrany využívá _%3$d b. energie_ k udržení tohoto znaku.
items.wands.wandofwarding$ward.name_2=Ochranný znak
items.wands.wandofwarding$ward.desc_2=Vylepšený ochranný znak má mnohem složitější vzor a může zaútočit vícekrát. Každý výstřel z tohoto znaku udělí _%1$d-%2$d poškození._\n\nSesláním kouzla hůlkou ochrany na již vyvolaný znak jej vylepšíš.\n\nTento ochranný znak vystřelí třikrát, než se rozptýlí.\n\nHůlka ochrany využívá _%3$d b. energie_ k udržení tohoto znaku.
items.wands.wandofwarding$ward.name_3=Větší ochranný znak
items.wands.wandofwarding$ward.desc_3=Plně vylepšený ochranný znak je schopen zaútočit mnohem častěji, než jeho předchůdci. Každý výstřel z tohoto znaku udělí _%1$d-%2$d poškození._\n\nSesláním kouzla hůlkou ochrany na vyvolaný znak jej vylepšíš.\n\nTento ochranný znak vystřelí pětkrát, než se rozptýlí.\n\nHůlka ochrany využívá _%3$d b. energie_ k udržení tohoto znaku.
items.wands.wandofwarding$ward.name_4=Menší ochranný krystal
items.wands.wandofwarding$ward.desc_4=Tento menší ochranný krystal má stejnou palebnou sílu jako větší ochranný znak, ovšem má životy namísto předem daného počtu útoků. Vzhledem připomíná drahokam na špičce tvé hůlky ochrany. Každý útok tohoto ochranného krystalu způsobí _%1$d-%2$d poškození_.\n\nZacílení tohoto ochranného krystalu hůlkou ochrany ho vylepší a vyléčí.\n\nTento ochranný krystal spotřebuje na každý útok část svých životů, avšak ty mu lze doplnit použitím hůlky ochrany.\n\nUdržení tohoto ochranného znaku stojí tvou hůlku ochrany _%3$d body energie_.
items.wands.wandofwarding$ward.name_5=Ochranný krystal
items.wands.wandofwarding$ward.desc_5=Ochranný krystal je větší a mnohem vytrvalejší, než jeho menší verze. Každý výstřel z tohoto krystalu udělí _%1$d-%2$d poškození._\n\nSesláním kouzla hůlkou ochrany na vyvolaný krystal jej vyléčíš a vylepšíš.\n\nTento ochranný krystal vyčerpá část svého zdraví pokaždé, když sežehne nepřítele, ale může být doléčen tvou hůlkou ochrany.\n\nHůlka využívá _%3$d b. energie_ k udržení tohoto krystalu.
items.wands.wandofwarding$ward.name_6=Větší ochranný krystal
items.wands.wandofwarding$ward.desc_6=Plně vylepšený ochranný krystal je výrazně odolnější než jeho předchůdci. Každý výstřel z tohoto krystalu udělí _%1$d-%2$d poškození._\n\nSesláním kouzla hůlkou ochrany na tento krystal jej vyléčíš.\n\nTento ochranný krystal vyčerpá část svého zdraví pokaždé, když sežehne nepřítele, ale může být doléčen tvou hůlkou ochrany.\n\nHůlka využívá _%3$d b. energie_ k udržení tohoto krystalu.
items.wands.wandofwarding$ward.discover_hint=S touto postavou se můžeš setkat pomocí jedné specifické hůlky.
items.wands.wandofwarding$ward.dismiss_title=Rozptýlit tuto ochrannou entitu?
items.wands.wandofwarding$ward.dismiss_body=Můžeš tuto ochrannou entitu rozptýlit, pokud nechceš aby tvou hůlku dál zatěžovala. To entitu okamžitě zruší.\n\nChceš rozptýlit tuto ochrannou entitu?
items.wands.wandofwarding$ward.dismiss_confirm=Ano
items.wands.wandofwarding$ward.dismiss_cancel=Ne

###weapon curses
items.weapon.curses.annoying.name=%s Obtěžování
items.weapon.curses.annoying.msg_1=OU, MY S NĚČÍM BOJUJEM!?
items.weapon.curses.annoying.msg_2=JÉJ, DO NICH!
items.weapon.curses.annoying.msg_3=HEJ, POSLOUCHEJ!
items.weapon.curses.annoying.msg_4=UŽ JSME U BOSSE!?
items.weapon.curses.annoying.msg_5=AU, NEMÁCHEJ TAK SE MNOU!
items.weapon.curses.annoying.msg_6=CHCÍPNI, HMYZÁKU!
items.weapon.curses.annoying.msg_7=JUPÍÍÍÍÍÍÍÍÍÍÍ!
items.weapon.curses.annoying.msg_8=MŮŽEME SI DÁT PŘESTÁVKU!?
items.weapon.curses.annoying.msg_9=BUM, HAHA!
items.weapon.curses.annoying.msg_10=DOBRÁ RÁNA!
items.weapon.curses.annoying.msg_11=Nikdy jsem nechtěl být zbraň, chtěl jsem být dřevorubecká sekera.
items.weapon.curses.annoying.msg_12=Pamatuj, přehnané sebevědomí je pomalý a zákeřný vrah.
items.weapon.curses.annoying.msg_13=VĚECHNO TADY TEĎ PATŘÍ NÁM!
items.weapon.curses.annoying.desc=Obtěžující zbraně jsou sice schopné komunikovat, ale jsou užvaněné až příliš. Často na tebe budou bezdůvodně přitahovat pozornost.
items.weapon.curses.annoying.elestrike_desc=Elementární úder s kletbou obtěžování má 20% šanci způsobit každému cíli v dosahu na 6 tahů amok.

items.weapon.curses.dazzling.name=%s Oslepení
items.weapon.curses.dazzling.desc=Blýskavé zbraně se občas rozzáří prudkým zábleskem světla, který oslepí všechny, které je mohou vidět.
items.weapon.curses.dazzling.elestrike_desc=Elementární úder s kletbou oslepení má 50% šanci oslepit na 6 tahů každého nepřítele v dosahu.

items.weapon.curses.displacing.name=%s Přesouvání
items.weapon.curses.displacing.desc=Zbraně přesouvání jsou naplněny chaotickou teleportační magií, která má schopnost náhodně přemísťovat nepřátele po podlaží.
items.weapon.curses.displacing.elestrike_desc=Elementární úder s kletbou přemístění má 50% šanci teleportovat každého nepřítele v dosahu.

items.weapon.curses.explosive.name=%s výbušnosti
items.weapon.curses.explosive.warm=Teplé...
items.weapon.curses.explosive.hot=Horké!
items.weapon.curses.explosive.desc=Výbušné zbraně si postupně budují sílu a explodují, čímž zraňují všechny kolem sebe.
items.weapon.curses.explosive.desc_cool=Tvá zbraň je právě studená na dotek.
items.weapon.curses.explosive.desc_warm=Tvá zbraň buduje energii a zahřívá se...
items.weapon.curses.explosive.desc_hot=Tvoje zbraň je horká! Každou chvíli vybuchne!
items.weapon.curses.explosive.elestrike_desc=Elementární úder s kletbou výbušnosti má šanci 50% způsobit explozi na místě každého z nepřátel v dosahu.

items.weapon.curses.friendly.name=%s Odmítání
items.weapon.curses.friendly.desc=Zbraně odmítání se nejlépe hodí pro pacifisty, jelikož občas vyvolávají kouzlo, které držiteli zbraně znemožní bojovat.
items.weapon.curses.friendly.elestrike_desc=Elementární úder s kletbou odmítání má 50% šanci okouzlit každého nepřítele v dosahu na 6 tahů.

items.weapon.curses.polarized.name=%s Polarizace
items.weapon.curses.polarized.desc=Polarizovaná zbraň je ovlivněna magií, která způsobí, že její útok udělí buď o 50% více poškození nebo vůbec žádné poškození.
items.weapon.curses.polarized.elestrike_desc=Elementární úder s kletbou polarizace má 50% šanci způsobit 24-36 poškození každému nepříteli v dosahu.

items.weapon.curses.sacrificial.name=%s Obětování
items.weapon.curses.sacrificial.desc=Obětní zbraně vyžadují od nositele krev výměnou za to, že zaútočí na nepřítele. Čím je nositel zdravější, tím více krve mu prokletí vezme.
items.weapon.curses.sacrificial.elestrike_desc=Elementární úder s kletbou obětování způsobí hrdinovi a všem nepřátelům v dosahu krvácení za 12 HP.

items.weapon.curses.wayward.name=%s Vzdoru
items.weapon.curses.wayward.desc=Zbraně s prokletím vzdoru se občas stanou extrémně nepřesnými. Jejich magie může chvíli trvat, když se projeví, ale lze ji vyrušit úspěšným zásahem takovou zbraní.
items.weapon.curses.wayward.elestrike_desc=Elementární úder s kletbou vzdoru má 50% šanci rozostřit smysly každého nepřítele v dosahu na 6 tahů.
items.weapon.curses.wayward$waywardbuff.name=Vzdor
items.weapon.curses.wayward$waywardbuff.desc=Magie tvé zbraně vzdoruje tvým útokům, což z ní na nějakou dobu dělá extrémně nepřesnou. Tento efekt neovlivňuje útoky, které mají garantovaný zásah, jako jsou útoky ze zálohy, a lze jej okamžitě vyrušit úspěšným zásahem touto zbraní.\n\nZbývá tahů: %s.

###enchantments
items.weapon.enchantments.blazing.name=%s Zapálení
items.weapon.enchantments.blazing.desc=Toto okouzlení zahalí zbraň plameny, které zapalují zasažené nepřátele a způsobují bonusové poškození těm už zapáleným.
items.weapon.enchantments.blazing.elestrike_desc=Elementární úder s očarováním ohnivosti zapálí každé políčko v dosahu na 8 kol.

items.weapon.enchantments.blocking.name=%s Blokace
items.weapon.enchantments.blocking.desc=Zbraně blokování mají šanci ti poskytnout ochranu, když s nimi zaútočíš.
items.weapon.enchantments.blocking.elestrike_desc=Elementární úder s očarováním blokace poskytne Šermířce 6 bodů dodatečné ochrany za každého zasaženého nepřítele.
items.weapon.enchantments.blocking$blockbuff.name=Blokující
items.weapon.enchantments.blocking$blockbuff.desc=Okouzlení blokování na tvé zbrani ti poskytlo krátkodobou defensivní sílu!\n\nZbývající ochrana: %d\n\nZbývá tahů: %s.

items.weapon.enchantments.blooming.name=%s Rozkvětu
items.weapon.enchantments.blooming.desc=Zbraně rozkvětu obsahují magii, která způsobí, že vegetace vyroste skrz nebo kolem těch, které zasáhnou.
items.weapon.enchantments.blooming.elestrike_desc=Elementární úder s očarováním rozkvětu vytvoří vegetaci na až 8 políčkách v dosahu a uvězní všechny zasažené napřátele na 6 kol.

items.weapon.enchantments.chilling.name=%s Ochlazení
items.weapon.enchantments.chilling.desc=Nepřátelé zasažení tímto okouzlením jsou ochlazeni, což zpomaluje jejich pohyb a útoky.
items.weapon.enchantments.chilling.elestrike_desc=Elementární úder s očarováním mrazu vyšle ledově chladný závan vzduchu na každé políčko v dosahu po dobu 8 kol.

items.weapon.enchantments.kinetic.name=%s Uchování
items.weapon.enchantments.kinetic.desc=Když je nepřítel zabit uchovávající zbraní, jakékoliv přebytečné poškození je do ní uloženo a bude aplikováno v dalším úspěšném útoku.
items.weapon.enchantments.kinetic.elestrike_desc=Elementární úder s očarováním uchování způsobí 40% uchovaného poškození každému nepříteli dosahu, kromě původního cíle.
items.weapon.enchantments.kinetic$conserveddamage.name=Uchované poškození
items.weapon.enchantments.kinetic$conserveddamage.desc=Tvá zbraň si uchovala přebytečné poškození z předchozího úderu a použije ho jako bonusové poškození ve tvém dalším útoku. Uchovaná síla se ovšem časem pomalu rozplyne.\n\nUchované poškození: %d

items.weapon.enchantments.corrupting.name=%s Zkaženosti
items.weapon.enchantments.corrupting.desc=Tohle silné okouzlení má moc podrobit si vůli tvých nepřátel. Když je nepřítel touto zbraní zabit, je zde šance, že namísto smrti podlehne efektu zkaženosti.
items.weapon.enchantments.corrupting.elestrike_desc=Elementární úder s očarováním zkaženosti má 5-25% šanci (podle chybějících životů cíle) zkazit a podrobit každého nepřítele v dosahu, vyjma původního cíle.

items.weapon.enchantments.elastic.name=%s Odrazivosti
items.weapon.enchantments.elastic.desc=Zbraně odrazivosti mají šanci odrazit nepřátele na krátkou vzdálenost pryč.
items.weapon.enchantments.elastic.elestrike_desc=Elementární úder s očarováním odrazivosti odmrští všechny zasažené nepřátele o 5 políček dozadu.

items.weapon.enchantments.grim.name=%s Smrti
items.weapon.enchantments.grim.desc=Tohle mocné okouzlení má sílu okamžitě popravit nepřítele. Čím slabší je nepřítel, tím má efekt větší pravděpodobnost se projevit.
items.weapon.enchantments.grim.elestrike_desc=Elementární úder s očarováním smrti má až 6-30% šanci (podle chybějících životů) okamžitě zabít každého nepřítele v dosahu, kromě původního cíle.

items.weapon.enchantments.lucky.name=%s Štěstí
items.weapon.enchantments.lucky.desc=Nepřátelé, kteří jsou zabiti zbraní štěstí, mají šanci, že z nich vypadne extra předmět.
items.weapon.enchantments.lucky.elestrike_desc=Elementární úder s očarováním štěstí má 12.5% šanci vytvořit pod každým ze zasažených nepřátel kořist. Tento efekt se může projevit jen jednou na každém nepříteli.

items.weapon.enchantments.projecting.name=%s Dosahu
items.weapon.enchantments.projecting.desc=S tímto okouzlením získají zbraně na blízko extra dosah. Zbraně na dálku budou schopné proniknout okolními zdmi.
items.weapon.enchantments.projecting.elestrike_desc=Elementární úder s očarováním dosahu způsobí 30% poškození každému nepřiteli v dosahu, kromě původního cíle.

items.weapon.enchantments.shocking.name=%s Probíjení
items.weapon.enchantments.shocking.desc=Z probíjející zbraně jiskří elektřina, která uděluje extra poškození všem nepřátelům poblíž.
items.weapon.enchantments.shocking.elestrike_desc=Elementární úder s očarováním průbojnosti vytvoří elektřinu, která bude po 8 kol probíjet na každém zasaženém políčku.

items.weapon.enchantments.unstable.name=%s Nestálosti
items.weapon.enchantments.unstable.desc=Tohle okouzlení vyzařuje chaotickou energii, která se pokaždé projeví jiným efektem.
items.weapon.enchantments.unstable.elestrike_desc=Elementární úder s očarováním nestálosti aplikuje na každého zasaženého nepřítele, kromě původního cíle, efekt náhodného očarování.

items.weapon.enchantments.vampiric.name=%s Vysátí
items.weapon.enchantments.vampiric.desc=Tohle silné okouzlení s každým úderem saje životní sílu z nepřátel a převádí ji zpět do držitele zbraně. Čím méně má držitel zdraví, tím je účinek silnější.
items.weapon.enchantments.vampiric.elestrike_desc=Elementární úder s očarováním vysátí vyléčí Šermířce 2.5 životů za každého zasaženého nepřítele.


###melee weapons
items.weapon.melee.assassinsblade.name=Vrahova čepel
items.weapon.melee.assassinsblade.stats_desc=Zbraň je silnější proti nic netušícím nepřátelům.
items.weapon.melee.assassinsblade.ability_name=Plížení
items.weapon.melee.assassinsblade.typical_ability_desc=Šermířka se s vrahovou čepelí může _plížit_. To jí umožní se okamžitě přemístit až 3 políčka pryč a poskytne jí obyvkle _%d tahy neviditelnosti_.
items.weapon.melee.assassinsblade.ability_desc=Šermířka se s vrahovou čepelí může _plížit_. To jí umožní se okamžitě přemístit až 3 políčka pryč a poskytne jí _%d tahy neviditelnosti_.
items.weapon.melee.assassinsblade.upgrade_ability_stat_name=Trvání schopnosti
items.weapon.melee.assassinsblade.desc=Malá vlnkovitá čepel z obsidiánu. I přes skvělé vyvážení je obtížné s ní zacházet, ale pokud najde ten správný cíl, dokáže být smrtící.

items.weapon.melee.battleaxe.name=Bojová sekera
items.weapon.melee.battleaxe.stats_desc=Jedná se o poněkud přesnou zbraň.
items.weapon.melee.battleaxe.ability_name=Těžká rána
items.weapon.melee.battleaxe.typical_ability_desc=Šermířka může s bojovou sekerou provést _těžkou ránu_. Tento soustředěný útok způsobí obvykle _%1$d-%2$d poškození_, pokud nepřítele překvapí, a ochromí je na 5 tahů, čímž sníží jeho přesnost a vyhýbání o 50%%. Těžká rána spolehlivě zasáhne nepřítele, ovšem pokud nezasadí překvapivý útok, způsobí normální poškození.
items.weapon.melee.battleaxe.ability_desc=Šermířka může s bojovou sekerou provést _těžkou ránu_. Tento soustředěný útok způsobí _%1$d-%2$d poškození_, pokud nepřítele překvapí, a ochromí je na 5 tahů, čímž sníží jeho přesnost a vyhýbání o 50%%. Těžká rána spolehlivě zasáhne nepřítele, ovšem pokud nezasadí překvapivý útok, způsobí normální poškození.
items.weapon.melee.battleaxe.desc=Obrovská ocelová hlava této bojové sekery vkládá do každého úderu značnou tíhu.

items.weapon.melee.crossbow.name=Kuše
items.weapon.melee.crossbow.typical_stats_desc=Zbraň obvykle zvyšuje sílu hozených šipek na _%1$d-%2$d poškození_, a také jim poskytne své případné okouzlení.
items.weapon.melee.crossbow.stats_desc=Tato zbraň zvyšuje sílu hozených šipek na _%1$d-%2$d poškození_, a také jim poskytne své případné okouzlení.
items.weapon.melee.crossbow.ability_name=Nabitá střela
items.weapon.melee.crossbow.typical_ability_desc=Šermířka může _nabít_ svou kuši, čímž způsobí, že její příští útok s jistotou zasáhne a získá jeden ze 3 efektů: útok zblízka odhodí nepřátele dozadu, běžné šipky způsobí obvykle o _+%1$d poškození_ a napuštěné šipky aplikují svůj účinek v oblasti 7x7 políček a získají obvykle o _%2$d použití více_.
items.weapon.melee.crossbow.ability_desc=Šermířka může _nabít_ svou kuši, čímž způsobí, že její příští útok s jistotou zasáhne a získá jeden ze 3 efektů: útok zblízka odhodí nepřátele dozadu, běžné šipky způsobí o _+%1$d poškození_ a napuštěné šipky aplikují svůj účinek v oblasti 7x7 políček a získají o _%2$d použití více_.
items.weapon.melee.crossbow.desc=Poměrně složitá zbraň, která dokáže s mimořádnou rychlostí vystřelovat šipky. Přestože pro to není navržena, tíha kuše a její robustní konstrukce z ní dělá také slušnou zbraň na blízko.
items.weapon.melee.crossbow.upgrade_ability_stat_name=Posílení schopnosti
items.weapon.melee.crossbow$chargedshot.name=Nabito
items.weapon.melee.crossbow$chargedshot.desc=Šermířka se soustředí na svou kuši. Příští útok, který s ní provede, s jistotou zasáhne a získá jeden ze tří efektů:\n- Útoky zblízka odhodí nepřátele o několik políček dozadu.\n- Běžné šipky způsobí větší poškození.\n- Napuštěné šipky získají více použití a svůj účinek aplikují v oblasti 7x7 políček. Škodlivé efekty se aktivují pouze na nepřátele a positivní efekty se aplikují pouze na spojence, přičemž Šermířka nemůže tuto schopnost použít k tomu, aby positivní efekt šipky aplikovala sama na sebe.

items.weapon.melee.cudgel.name=Žezlo
items.weapon.melee.cudgel.stats_desc=Jedná se o poněkud přesnou zbraň.
items.weapon.melee.cudgel.ability_name=Těžká rána
items.weapon.melee.cudgel.typical_ability_desc=Šermířka může s žezlem provést _těžkou ránu_. Tento soustředěný útok způsobí obvykle _%1$d-%2$d poškození_, pokud nepřítele překvapí, a ochromí je na 5 tahů, čímž sníží jeho přesnost a vyhýbání o 50%%. Těžká rána spolehlivě zasáhne nepřítele, ovšem pokud nezasadí překvapivý útok, způsobí normální poškození.
items.weapon.melee.cudgel.ability_desc=Šermířka může s žezlem provést _těžkou ránu_. Tento soustředěný útok způsobí _%1$d-%2$d poškození_, pokud nepřítele překvapí, a ochromí je na 5 tahů, čímž sníží jeho přesnost a vyhýbání o 50%%. Těžká rána spolehlivě zasáhne nepřítele, ovšem pokud nezasadí překvapivý útok, způsobí normální poškození.
items.weapon.melee.cudgel.desc=Malý mosazný palcát, vyrobený spíše jako prostředek k sebeobraně pro šlechtu, než jako skutečná zbraň.
items.weapon.melee.cudgel.discover_hint=S tímto předmětem začíná jeden z hrdinů.

items.weapon.melee.dagger.name=Dýka
items.weapon.melee.dagger.stats_desc=Zbraň je silnější proti nic netušícím nepřátelům.
items.weapon.melee.dagger.ability_name=Plížení
items.weapon.melee.dagger.typical_ability_desc=Šermířka se s dýkou může _plížit_. To jí umožní se okamžitě přemístit až 5 políček pryč a poskytne jí obyvkle _%d tahy neviditelnosti_.
items.weapon.melee.dagger.ability_desc=Šermířka se s dýkou může _plížit_. To jí umožní se okamžitě přemístit až 5 políček pryč a poskytne jí _%d tahy neviditelnosti_.
items.weapon.melee.dagger.upgrade_ability_stat_name=Trvání schopnosti
items.weapon.melee.dagger.desc=Jednoduchá železná dýka s dřevěnou rukojetí.
items.weapon.melee.dagger.discover_hint=S tímto předmětem začíná jeden z hrdinů.

items.weapon.melee.dirk.name=Dlouhá dýka
items.weapon.melee.dirk.stats_desc=Zbraň je silnější proti nic netušícím nepřátelům.
items.weapon.melee.dirk.ability_name=Plížení
items.weapon.melee.dirk.typical_ability_desc=Šermířka se s dlouhou dýkou může _plížit_. To jí umožní se okamžitě přemístit až 4 políčka pryč a poskytne jí obyvkle _%d tahy neviditelnosti_.
items.weapon.melee.dirk.ability_desc=Šermířka se s dlouhou dýkou může _plížit_. To jí umožní se okamžitě přemístit až 4 políčka pryč a poskytne jí _%d tahy neviditelnosti_.
items.weapon.melee.dirk.upgrade_ability_stat_name=Trvání schopnosti
items.weapon.melee.dirk.desc=Delší dýka, která poskytuje o trochu víc oceli k vražení do nepřátel.

items.weapon.melee.flail.name=Biják
items.weapon.melee.flail.stats_desc=Jedná se o poněkud nepřesnou zbraň.\nTato zbraň nemůže provést překvapivý útok.
items.weapon.melee.flail.ability_name=Roztočení
items.weapon.melee.flail.spin_warn=Už nemůžeš svůj biják roztočit
items.weapon.melee.flail.typical_ability_desc=Šermířka může _roztočit_ svůj biják a vybudovat si tak na krátkou dobu sílu. Za každý tah točení způsobí biják svým příštím útokem obvykle _+%d poškození_, a to až třikrát. Roztočený biják navíc s jistotou zasáhne. Pouze roztočení bijáku stojí použití zbraně.
items.weapon.melee.flail.ability_desc=Šermířka může _roztočit_ svůj biják a vybudovat si tak na krátkou dobu sílu. Za každý tah točení způsobí biják svým příštím útokem _+%d poškození_, a to až třikrát. Roztočený biják navíc s jistotou zasáhne. Pouze roztočení bijáku stojí použití zbraně.
items.weapon.melee.flail.desc=Špičatá koule připevněná k rukojeti dlouhým řetězem. Velmi nepraktická, ale zničující, pokud zasadí pevný úder.
items.weapon.melee.flail$spinabilitytracker.name=Roztáčení
items.weapon.melee.flail$spinabilitytracker.desc=Šermířka točí svým bijákem, čímž si buduje poškození pro svůj další úder s ním. Každé otočení trvá 1 kolo a zvyšuje poškození, a to až třikrát. Roztočený biják navíc s jistotou zasáhne.\n\nMomentální otočky: %1$d%%.\nZbývá tahů: %2$s.

items.weapon.melee.gauntlet.name=Kamenná rukavice
items.weapon.melee.gauntlet.stats_desc=Jedná se o velmi rychlou zbraň.
items.weapon.melee.gauntlet.ability_name=Následný úder
items.weapon.melee.gauntlet.typical_ability_desc=Šermířka může s kamennou rukavicí provést _následný úder_. Tento útok s jistotou zasáhne a způsobuje obvykle o _+%d vyšší poškození_ za každý zásah, který Šermířka zasadila obyčejným útokem zbraní zblízka nebo vrhací zbraní. Nezasáhne-li nic během 5 tahů, tato série se přeruší.
items.weapon.melee.gauntlet.ability_desc=Šermířka může s kamennou rukavicí provést _následný úder_. Tento útok s jistotou zasáhne a způsobuje o _+%d vyšší poškození_ za každý zásah, který Šermířka zasadila obyčejným útokem zbraní zblízka nebo vrhací zbraní.  Nezasáhne-li nic během 5 tahů, tato série se přeruší.
items.weapon.melee.gauntlet.desc=Masivní rukavice vyrobená z karmínové látky a po povrchu pokrytá těžkými magickými kameny. Tkanina se kolem tebe utahuje, takže tlusté kamenné pláty jsou téměř jako druhá kůže. Rozpřáhnutí s tak těžkou zbraní vyžaduje sílu, ale dodává tvým úderům obrovskou moc.

items.weapon.melee.glaive.name=Halapartna
items.weapon.melee.glaive.stats_desc=Jedná se o poněkud pomalou zbraň.\nTato zbraň má extra dosah.
items.weapon.melee.glaive.ability_name=Nabodnutí
items.weapon.melee.glaive.typical_ability_desc=Šermířka dokáže využít hrot halapartny k _nabodnutí_ nepřítele v dosahu, který není přímo u ní. Tím nepřítele s jistotou zasáhne, způsobí obvykle _%1$d-%2$d poškození_ a zatlačí nepřítele dozadu.
items.weapon.melee.glaive.ability_desc=Šermířka dokáže využít hrot kopí k _nabodnutí_ nepřítele v dosahu, který není přímo u ní. Tím nepřítele s jistotou zasáhne, způsobí _%1$d-%2$d poškození_ a zatlačí nepřítele dozadu.
items.weapon.melee.glaive.desc=Masivní dřevcová zbraň sestrojená z čepele zvláštního meče přidělaného ke konci tyče.

items.weapon.melee.gloves.name=Okované rukavice
items.weapon.melee.gloves.stats_desc=Jedná se o velmi rychlou zbraň.
items.weapon.melee.gloves.ability_name=Následný úder
items.weapon.melee.gloves.typical_ability_desc=Šermířka může s okovanou rukavicí provést _následný úder_. Tento útok s jistotou zasáhne a způsobuje obvykle o _+%d vyšší poškození_ za každý zásah, který Šermířka zasadila obyčejným útokem zbraní zblízka nebo vrhací zbraní. Nezasáhne-li nic během 5 tahů, tato série se přeruší.
items.weapon.melee.gloves.ability_desc=Šermířka může s okovanou rukavicí provést _následný úder_. Tento útok s jistotou zasáhne a způsobuje o _+%d vyšší poškození_ za každý zásah, který Šermířka zasadila obyčejným útokem zbraní zblízka nebo vrhací zbraní. Nezasáhne-li nic během 5 tahů, tato série se přeruší.
items.weapon.melee.gloves.desc=Okované rukavice, které sice neposkytují žádnou skutečnou ochranu, ale fungují jako obstojná zbraň a zároveň udrží ruce volné.
items.weapon.melee.gloves.discover_hint=S tímto předmětem začíná jeden z hrdinů.

items.weapon.melee.greataxe.name=Velká sekera
items.weapon.melee.greataxe.stats_desc=Jedná se o neuvěřitelně těžkou zbraň.
items.weapon.melee.greataxe.ability_name=Odplata
items.weapon.melee.greataxe.typical_ability_desc=Šermířka může s velkou sekerou provést _odplatný_ útok proti nepříteli, pokud má sama méně než 50%% životů. Tento devastující útok s jistotou zasáhne a způsobí obvykle _%1$d-%2$d poškození_, a pokud nepřítele zabije, proběhne okamžitě.
items.weapon.melee.greataxe.ability_desc=Šermířka může s velkou sekerou provést _odplatný_ útok proti nepříteli, pokud má sama méně než 50%% životů. Tento devastující útok s jistotou zasáhne a způsobí _%1$d-%2$d poškození_, a pokud nepřítele zabije, proběhne okamžitě.
items.weapon.melee.greataxe.desc=Původně nošena přes rameno, tato titanová sekera je stejně silná, jako je těžká.

items.weapon.melee.greatshield.name=Velký štít
items.weapon.melee.greatshield.typical_stats_desc=Běžně zbraň blokuje 0-%d poškození. Zablokované poškození se s vylepšením zvyšuje.
items.weapon.melee.greatshield.stats_desc=Zbraň blokuje 0-%d poškození. Zablokované poškození se s vylepšením zvyšuje.
items.weapon.melee.greatshield.ability_name=Kryt
items.weapon.melee.greatshield.typical_ability_desc=Šermířka se může _krýt_ kulatým štítem, čímž zcela vyruší všechny fyzické nebo magické útoky vedený proti ní obvykle během _%d tahů_. Jakmile Šermířka vykryje alespoň jeden útok, její vlastní útoky nebo použití magie kryt ukončí.
items.weapon.melee.greatshield.ability_desc=Šermířka se může _krýt_ velkým štítem, čímž zcela vyruší všechny fyzické nebo magické útoky vedený proti ní během _%d tahů_. Jakmile Šermířka vykryje alespoň jeden útok, její vlastní útoky nebo použití magie kryt ukončí.
items.weapon.melee.greatshield.upgrade_ability_stat_name=Trvání schopnosti
items.weapon.melee.greatshield.desc=Spíš mobilní stěna než štít. Tato obrovská masa kovu sice poskytuje kvalitní obranu, ale nenechává příliš prostoru na útočení.

items.weapon.melee.greatsword.name=Velký meč
items.weapon.melee.greatsword.ability_name=Rozpolcení
items.weapon.melee.greatsword.typical_ability_desc=Šermířka může nepřítele _rozpoltit_ velkým mečem. Tento útok způsobí obvykle _%1$d-%2$d poškození_ a s jistotou zasáhne. Pokud rozpolcení zabije nepřítele, proběhne okamžitě a Šermířka ho může během 5 tahů znovu použít zadarmo.
items.weapon.melee.greatsword.ability_desc=Šermířka může nepřítele _rozpoltit_ velkým mečem. Tento útok způsobí _%1$d-%2$d poškození_ a s jistotou zasáhne. Pokud rozpolcení zabije nepřítele, proběhne okamžitě a Šermířka ho může během 5 tahů znovu použít zadarmo.
items.weapon.melee.greatsword.desc=Ohromná čepel, která způsobuje velké poškození tím, že do každého úderu přenáší svou tíhu.

items.weapon.melee.handaxe.name=Ruční sekera
items.weapon.melee.handaxe.stats_desc=Jedná se o poněkud přesnou zbraň.
items.weapon.melee.handaxe.ability_name=Těžká rána
items.weapon.melee.handaxe.typical_ability_desc=Šermířka může s ruční sekerou provést _těžkou ránu_. Tento soustředěný útok způsobí obvykle _%1$d-%2$d poškození_, pokud nepřítele překvapí, a ochromí je na 5 tahů, čímž sníží jeho přesnost a vyhýbání o 50%%. Těžká rána spolehlivě zasáhne nepřítele, ovšem pokud nezasadí překvapivý útok, způsobí normální poškození.
items.weapon.melee.handaxe.ability_desc=Šermířka může s ruční sekerou provést _těžkou ránu_. Tento soustředěný útok způsobí _%1$d-%2$d poškození_, pokud nepřítele překvapí, a ochromí je na 5 tahů, čímž sníží jeho přesnost a vyhýbání o 50%%. Těžká rána spolehlivě zasáhne nepřítele, ovšem pokud nezasadí překvapivý útok, způsobí normální poškození.
items.weapon.melee.handaxe.desc=Lehká sekera, nejčastěji používaná pro kácení stromů. Široká čepel funguje dobře i proti nepřátelům.

items.weapon.melee.katana.name=Katana
items.weapon.melee.katana.stats_desc=Zbraň blokuje 0-3 poškození.
items.weapon.melee.katana.ability_name=Výpad
items.weapon.melee.katana.typical_ability_desc=Šermířka může katanou provést _výpad_ k nepříteli 1 políčko daleko. Tím se k němu přesune, způsobí obvykle _%1$d-%2$d poškození_ a s jistotou zasáhne.
items.weapon.melee.katana.ability_desc=Šermířka může katanou provést _výpad_ k nepříteli 1 políčko daleko. Tím se k němu přesune, způsobí _%1$d-%2$d poškození_ a s jistotou zasáhne.
items.weapon.melee.katana.desc=Tenký meč s velkou kovovou záštitou na konci rukojeti.

items.weapon.melee.longsword.name=Dlouhý meč
items.weapon.melee.longsword.ability_name=Rozpolcení
items.weapon.melee.longsword.typical_ability_desc=Šermířka může nepřítele _rozpoltit_ dlouhým mečem. Tento útok způsobí obvykle _%1$d-%2$d poškození_ a s jistotou zasáhne. Pokud rozpolcení zabije nepřítele, proběhne okamžitě a Šermířka ho může během 5 tahů znovu použít zadarmo.
items.weapon.melee.longsword.ability_desc=Šermířka může nepřítele _rozpoltit_ dlouhým mečem. Tento útok způsobí _%1$d-%2$d poškození_ a s jistotou zasáhne. Pokud rozpolcení zabije nepřítele, proběhne okamžitě a Šermířka ho může během 5 tahů znovu použít zadarmo.
items.weapon.melee.longsword.desc=Dlouhé ostří tohoto ocelového meče se povzbudivě leskne, nicméně je díky své velikosti poněkud těžký.

items.weapon.melee.mace.name=Palcát
items.weapon.melee.mace.stats_desc=Jedná se o poněkud přesnou zbraň.
items.weapon.melee.mace.ability_name=Těžká rána
items.weapon.melee.mace.typical_ability_desc=Šermířka může s palcátem provést _těžkou ránu_. Tento soustředěný útok způsobí obvykle _%1$d-%2$d poškození_, pokud nepřítele překvapí, a ochromí je na 5 tahů, čímž sníží jeho přesnost a vyhýbání o 50%%. Těžká rána spolehlivě zasáhne nepřítele, ovšem pokud nezasadí překvapivý útok, způsobí normální poškození.
items.weapon.melee.mace.ability_desc=Šermířka může s palcátem provést _těžkou ránu_. Tento soustředěný útok způsobí _%1$d-%2$d poškození_, pokud nepřítele překvapí, a ochromí je na 5 tahů, čímž sníží jeho přesnost a vyhýbání o 50%%. Těžká rána spolehlivě zasáhne nepřítele, ovšem pokud nezasadí překvapivý útok, způsobí normální poškození.
items.weapon.melee.mace.desc=Velká železná hlavice této zbraně způsobuje značné škody.

items.weapon.melee.magesstaff.name=Mágova hůl
items.weapon.melee.magesstaff.ac_imbue=NAPLNIT
items.weapon.melee.magesstaff.ac_zap=SESLAT
items.weapon.melee.magesstaff.prompt=Vyber hůlku
items.weapon.melee.magesstaff.imbue=%s naplňuje svou silou tvoji hůl.
items.weapon.melee.magesstaff.preserved=Předchozí hůlka byla zachována!
items.weapon.melee.magesstaff.imbue_desc=Opravdu si přeješ naplnit svou hůl touto hůlkou?\n\nPokud je hůlka určená k naplnění stejné nebo vyšší úrovně než mágova hůl, získá hůl vylepšení dané hůlky a navíc jedno ze svých vylepšení.
items.weapon.melee.magesstaff.imbue_level=Toto naplnění vytvoří hůl _úrovně +%d_.
items.weapon.melee.magesstaff.imbue_unknown=Neznáš úroveň této hůlky, ale toto naplnění vytvoří hůl minimálně _úrovně +%d_.
items.weapon.melee.magesstaff.imbue_cursed=_Pokud svou hůl naplníš prokletou hůlkou, stane se tvá hůl také prokletou!_
items.weapon.melee.magesstaff.imbue_lost=Hůlka, kterou je právě naplněna tvá hůl, _bude ztracena_.
items.weapon.melee.magesstaff.imbue_talent=Hůlka, kterou je právě naplněna tvá hůl, _bude navrácena na úrovni +0_.
items.weapon.melee.magesstaff.yes=Ano, určitě
items.weapon.melee.magesstaff.no=Ne, rozmýšlím si to
items.weapon.melee.magesstaff.desc=Tato hůl, kterou si Mág sám vyrobil, je unikátní magická zbraň, která může být naplněna kouzelnou hůlkou.
items.weapon.melee.magesstaff.no_wand=V současné době v sobě hůl nemá žádnou magii. Než bude moci být použita k sesílání kouzel, musí být _naplněna silou nějaké hůlky._
items.weapon.melee.magesstaff.has_wand=Hůl svou silou právě naplňuje _%s._
items.weapon.melee.magesstaff.cursed_wand=Hůl je prokletá, takže její magie je zrádná a nevyzpytatelná.
items.weapon.melee.magesstaff.discover_hint=S tímto předmětem začíná jeden z hrdinů.

items.weapon.melee.meleeweapon.ac_ability=Schopnost
items.weapon.melee.meleeweapon.stats_known=Tato zbraň na blízko _stupně %1$d_ uděluje _%2$d-%3$d poškození_ a vyžaduje _%4$d bodů síly_ pro řádné využití.
items.weapon.melee.meleeweapon.stats_unknown=Běžně tato zbraň na blízko _stupně %1$d_ uděluje _%2$d-%3$d poškození_ a vyžaduje _%4$d bodů síly_ pro řádné využití.
