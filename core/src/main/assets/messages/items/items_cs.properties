items.artifacts.masterthievesarmband.no_target=Musíš zacílit nepřítele přímo vedle sebe.
items.artifacts.masterthievesarmband.steal_shopkeeper=Nemůžeš krást přímo od obchodníků.
items.artifacts.masterthievesarmband.no_steal=Tento nepřítel nemá nic, co bys mohl ukradnout.
items.artifacts.masterthievesarmband.stole_item=Ukradl jsi předmět: %s.
items.artifacts.masterthievesarmband.failed_steal=Nepodařilo se ti nic ukrást.
items.artifacts.masterthievesarmband.level_up=Tvůj náramek je silnější!
items.artifacts.masterthievesarmband.desc=Tento sametový fialový náramek nese znak mistra zlodějů. Nepatří ti, ale pravděpodobně nepatřil ani jeho poslednímu majiteli.
items.artifacts.masterthievesarmband.desc_cursed=Prokletý náramek se přichytil k tvému zápěstí a zdá se, že tvůj váček se zlatem začíná být z nějakého důvodu pomalu lehčí...
items.artifacts.masterthievesarmband.desc_worn=Cítíš, jak se v náramku střádá moc, když získáváš zkušenosti. Tuto moc můžeš použít ke kradení v obchodech nebo k oloupení nepřátel!\n\nOloupení nepřátel se děje okamžitě, na chvíli je dezorientuje a poskytne ti šanci získat jejich předměty! Tato schopnost je silnější proti nic netušícím nepřátelům. Oloupení jednoho nepřítele vícekrát ti nedá víc šancí jim sebrat předměty.

