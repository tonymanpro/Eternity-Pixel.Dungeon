items.artifacts.etherealchains.cant_pull=鎖は対象を引き寄せられない。
items.artifacts.etherealchains.cant_reach=鎖はそこまで届かない。
items.artifacts.etherealchains.inside_wall=壁の側に近寄ることはできるが、中には入れない。
items.artifacts.etherealchains.nothing_to_grab=掴めるものがない。
items.artifacts.etherealchains.prompt=対象とする場所を選択
items.artifacts.etherealchains.desc=長く、しかし軽い鎖は霊的なエネルギーで輝いている。地形に向かって投げ込めばその場所まであなたを引き寄せ、敵に向かって投げ込めば敵をあなたに引き寄せる。鎖の霊的特性によって壁を突き抜けて伸びることができる！
items.artifacts.etherealchains.desc_cursed=呪われた鎖はあなたに巻き付いており、絶えず揺れ動き、あなたをつまずかせたり縛りつけようとする。
items.artifacts.etherealchains.desc_equipped=鎖はあなたの周りに漂い、倒した敵の霊的なエネルギーを徐々に吸収する。それぞれのチャージは鎖の輪となり、1チャージごと1マスまで伸びることができる。
items.artifacts.etherealchains$chainsrecharge.levelup=鎖はより強力になった！

items.artifacts.holytome.name=聖典
items.artifacts.holytome.ac_cast=詠唱
items.artifacts.holytome.no_spell=今はその呪文を唱えることができない。
items.artifacts.holytome.cursed=呪われた聖典は使用することはできない。
items.artifacts.holytome.levelup=聖典はより強力になった！
items.artifacts.holytome.desc=聖職者の神聖な魔法の源として用いられる聖なる書物だ。この書物を使うことで、聖職者はさまざまな魔法の呪文を唱えることができる。\n\n聖典は聖職者が使用するにつれて着実に強力になり、聖職者の最大充填量を増やし、充填速度をわずかに上昇させる。
items.artifacts.holytome.discover_hint=勇士の一人がスタート時にこのアイテムを持っている。

items.artifacts.hornofplenty.name=豊穣の角
items.artifacts.hornofplenty.ac_snack=一口
items.artifacts.hornofplenty.ac_eat=食べる
items.artifacts.hornofplenty.ac_store=貯める
items.artifacts.hornofplenty.eat=角に入っている食べ物を食べた。
items.artifacts.hornofplenty.prompt=食料を選択
items.artifacts.hornofplenty.no_food=角の中に食料がない！
items.artifacts.hornofplenty.full=角は食料でいっぱいだ！
items.artifacts.hornofplenty.reject=角は調理していない無味果を拒絶した。
items.artifacts.hornofplenty.maxlevel=角は可能な限り全ての食料を食べた！
items.artifacts.hornofplenty.levelup=角はあなたの食料を取り込んで成長した。
items.artifacts.hornofplenty.feed=角はあなたの食料を取り込んだ。
items.artifacts.hornofplenty.desc=この角笛は吹き鳴らすことはできないが、冒険して経験を積むにつれ、食べ物で満たされるようだ。充填量1を消費して一口ずつ食べることも、満腹になるまで食べることもできる。
items.artifacts.hornofplenty.desc_hint=栄養を角に与えることによって角の能力を上昇させられるかもしれない。
items.artifacts.hornofplenty.desc_cursed=角の呪いがあなたを拘束し、食料を生み出さず盛んに消費している。

items.artifacts.lloydsbeacon.name=保険標識
items.artifacts.lloydsbeacon.ac_zap=放つ
items.artifacts.lloydsbeacon.ac_set=設定する
items.artifacts.lloydsbeacon.ac_return=戻る
items.artifacts.lloydsbeacon.no_charge=標識を動かす十分なエネルギーがない。
items.artifacts.lloydsbeacon.tele_fail=転移魔法は失敗した。
items.artifacts.lloydsbeacon.prompt=放つ場所を選択
items.artifacts.lloydsbeacon.levelup=標識はより強力になった！
items.artifacts.lloydsbeacon.preventing=保険標識を使ってここから戻ろうとしたが、強力な魔法のオーラに阻害された！
items.artifacts.lloydsbeacon.creatures=保険標識を使ってここから戻ろうとしたが、周囲の生物の超常的なオーラに阻害された。
items.artifacts.lloydsbeacon.return=保険標識にうまくこの場所を設定できた。いつでもここに戻れるようになる。
items.artifacts.lloydsbeacon.desc=保険標識は、転移魔法を簡単に扱えるようにするための複雑な魔術装置だ。標識は戻るための標としても機能するが、装備して十分に充填されるとランダムな転移魔法の奔流を排出することもできる。この魔法は対象に向けて放つこともできるし、自分自身に向けて使用することもできる。
items.artifacts.lloydsbeacon.desc_set=標識はダンジョンの第%d階層のどこかに設定されている。

items.artifacts.masterthievesarmband.name=熟練した泥棒の腕章
items.artifacts.masterthievesarmband.ac_steal=盗む
items.artifacts.masterthievesarmband.no_charge=腕章は十分に充填されていない。
items.artifacts.masterthievesarmband.cursed=呪われた腕章は使用できない。
items.artifacts.masterthievesarmband.full=腕章が十分に充填された！
items.artifacts.masterthievesarmband.prompt=対象とする敵を選択
items.artifacts.masterthievesarmband.no_target=隣接する敵を対象にしてください。
items.artifacts.masterthievesarmband.steal_shopkeeper=小売店主から直接盗むことはできません。
items.artifacts.masterthievesarmband.no_steal=その敵には盗めるものがありません。
items.artifacts.masterthievesarmband.stole_item=%sを盗んだ。
items.artifacts.masterthievesarmband.failed_steal=何も盗めなかった。
items.artifacts.masterthievesarmband.level_up=腕章はより強力になった！
items.artifacts.masterthievesarmband.desc=紫のベルベットの腕章は泥棒稼業に熟練していることを示す印がついている。これはあなたの所有物ではないが、最後にこれを持っていた人も持ち主ではないだろう。
items.artifacts.masterthievesarmband.desc_cursed=呪われた腕章は手首を拘束し、なぜか財布がだんだん軽くなっていく気がする…
items.artifacts.masterthievesarmband.desc_worn=経験を積むにつれ、手首の腕章に力がみなぎるのを感じる。この力を使って店から盗んだり、敵から奪ったりすることができる！\n\n盗みは即座に発生し、敵を一時的に混乱させ、敵が持っている戦利品を手に入れる可能性がある！この力はこちらに気づいていない敵に対してより効果的だ。同じ敵から複数回盗もうとしても、戦利品を手に入れる確率は増えない。

items.artifacts.sandalsofnature.name=天然のサンダル
items.artifacts.sandalsofnature.name_1=天然の靴
items.artifacts.sandalsofnature.name_2=天然の長靴
items.artifacts.sandalsofnature.name_3=天然のすね当て
items.artifacts.sandalsofnature.ac_feed=与える
items.artifacts.sandalsofnature.ac_root=根付かせる
items.artifacts.sandalsofnature.prompt=種を選択
items.artifacts.sandalsofnature.levelup=履物が成長した！
items.artifacts.sandalsofnature.absorb_seed=履物は種を吸収して、より元気になったようだ。
items.artifacts.sandalsofnature.no_effect=まず履物に種を与えなければならない。
items.artifacts.sandalsofnature.low_charge=履物は十分に充填されていない。
items.artifacts.sandalsofnature.prompt_target=場所を選択
items.artifacts.sandalsofnature.out_of_range=その場所は範囲外だ。
items.artifacts.sandalsofnature.desc_1=この履物は紐で編まれたサンダルのように見えるが、実際は二株の植物だ！青白く、とてもひ弱に見えるので、栄養を与える必要があるのではないだろうか？
items.artifacts.sandalsofnature.desc_2=この履物は成長し、今やきちんと仕立てられた靴のように見える。いくらか色づいてきた。もっと成長するかも？
items.artifacts.sandalsofnature.desc_3=この植物は更に成長し、今や樹皮で作られた長靴の様相を呈している。植物は力を取り戻しつつあるが、まだ成長できるのではないだろうか？
items.artifacts.sandalsofnature.desc_4=この植物や今や完全に成長し、装甲されたすね当てとなった。すね当ては濃い茶色で、非常に頑丈な木で出来ているようだ。
items.artifacts.sandalsofnature.desc_hint=このアーティファクトを装備している間、より自然と同調できる気がする。
items.artifacts.sandalsofnature.desc_cursed=呪われたサンダルは自然との同調を阻害した。
items.artifacts.sandalsofnature.desc_ability=最後に与えた種の色で足元が波打つ。地面に短時間根を張り、半径3タイル内であればどこでもその植物の効果を発揮することができる。\n\n現在の種の効果: _%s_\n必要なチャージ量: _%d%%_
items.artifacts.sandalsofnature.desc_seeds=履物に%d粒の種を与えた。

