items.armor.armor.incompatible=異なる魔法の相互作用によって刻印は鎧から消え去ってしまった！
items.armor.armor.curr_absorb=この _ランク%1$d_ の鎧は _%2$dから%3$dのダメージ_ を軽減し、適切に着用するには _%4$dの筋力_ が必要となる。
items.armor.armor.avg_absorb=この _ランク%1$d_ の鎧は、通常、 _%2$dから%3$dのダメージ_ を軽減し、適切に着用するには _%4$dの筋力_ が必要となる。
items.armor.armor.too_heavy=筋力が足りないので、この鎧を着用している時は移動速度、回避力、防御力が減少する。
items.armor.armor.probably_too_heavy=おそらくこの鎧は重すぎる。
items.armor.armor.excess_str=筋力が十分あるおかげで、この鎧を着用しているときは _回避力が上がる_ 。
items.armor.armor.evasion=_回避力_ が向上するように補強されている。
items.armor.armor.defense=_防御力_ が向上するように補強されている。
items.armor.armor.inscribed=_%s_ が彫り込まれている。
items.armor.armor.glyph_hardened=それは_硬化_されている。
items.armor.armor.hardened_no_glyph=この鎧は_硬化_されているが、今は刻印が刻まれていない。
items.armor.armor.cursed_worn=この鎧は呪われているため、脱ぐことができない。
items.armor.armor.cursed=この鎧の中には凶悪な魔力が潜んでいるようだ。
items.armor.armor.weak_cursed=呪われているにもかかわらず、この鎧を外すことができる。
items.armor.armor.not_cursed=この鎧は害悪を及ぼす魔法がない。
items.armor.armor.seal_attached=この鎧には戦士の壊れた印章が貼り付けられており、体力が半分以下になりそうになると、_%dのシールド_を与える。
items.armor.armor.seal_transfer=戦士の壊れた印章は、現在着ている鎧に貼り付けられていなければ恩恵を受けられない。脱いだ鎧から印章を自動的に取り外し、現在着ている鎧に貼り付けますか？
items.armor.armor.seal_transfer_yes=はい
items.armor.armor.seal_transfer_no=いいえ
items.armor.armor$glyph.glyph=刻印
items.armor.armor$glyph.killed=%sに殺された…
items.armor.armor$glyph.rankings_desc=刻印に殺された
items.armor.armor$glyph.discover_hint=この効果を持つアイテムは、ダンジョン内でランダムに見つけることができる。

items.armor.classarmor.ac_ability=能力を選択
items.armor.classarmor.ac_transfer=移す
items.armor.classarmor.no_ability=あなたの鎧には現在、能力がついていません。1つ選んでください。
items.armor.classarmor.not_equipped=この鎧の特殊効果を利用したいなら、装備しないと！
items.armor.classarmor.low_charge=この鎧の特殊能力を使うための充填量が足りない。
items.armor.classarmor.charge_use=この能力を使用すると、充填量が_%s_消費される。
items.armor.classarmor.transfer_title=鎧に移す
items.armor.classarmor.transfer_desc=ドワーフの王の王冠の魔力を別の鎧に移すことができる。ただし、元の鎧は破壊される。
items.armor.classarmor.transfer_prompt=鎧を選択
items.armor.classarmor.transfer_cancel=キャンセル
items.armor.classarmor.transfer_complete=あなたの勇士の鎧の特性は引き継がれた！
items.armor.classarmor.discover_hint=特定の勇士で20階に居るボスを倒すと手に入る。

items.armor.clericarmor.name=勇士の法衣
items.armor.clericarmor.desc=この僧服と板金鎧を組み合わせた法衣を身に着けている間、聖職者は特別な能力を発揮することができる。

items.armor.clotharmor.name=布の鎧
items.armor.clotharmor.desc=この軽い鎧は基礎的な防御機能しかない。
items.armor.clotharmor.discover_hint=勇士の一人がスタート時にこのアイテムを持っている。

items.armor.duelistarmor.name=勇士の胸当て
items.armor.duelistarmor.desc=このマント付きの胸鎧を身に着けている間、決闘者は特別な能力を発揮することができる。

items.armor.huntressarmor.name=勇士の外套
items.armor.huntressarmor.no_enemies=視界に敵の姿は映っていない。
items.armor.huntressarmor.desc=この外套を身に着けている間、女猟師は特別な能力を発揮することができる。

items.armor.leatherarmor.name=革の鎧
items.armor.leatherarmor.desc=なめした怪物の革でできた鎧だ。布の鎧ほど軽くないが、より強い防御力を有している。

items.armor.magearmor.name=勇士のローブ
items.armor.magearmor.desc=この豪華なローブを身に着けている間、魔術師は特別な能力を発揮することができる。

items.armor.mailarmor.name=鎖帷子
items.armor.mailarmor.desc=金属製の輪を連結して作られた、強靭でありながら柔軟性のある鎧だ。

items.armor.platearmor.name=板金鎧
items.armor.platearmor.desc=大量の大きな金属板がつなぎ合わさって作られている鎧だ。これを着用できる力がある冒険者に対し、驚異的な保護を与えるだろう。

items.armor.roguearmor.name=勇士の装束
items.armor.roguearmor.desc=この暗黒の装束を身に着けている間、盗賊は特別な能力を発揮することができる。

items.armor.scalearmor.name=鱗甲の鎧
items.armor.scalearmor.desc=革の服に金属の鱗が縫い付けられたこの鎧は動きやすく防御力もある。

items.armor.warriorarmor.name=勇士の板金鎧
items.armor.warriorarmor.desc=この重厚な板金鎧を身に着けている間、戦士は特別な能力を発揮することができる。



###artifacts
items.artifacts.alchemiststoolkit.name=錬金術師の道具箱
items.artifacts.alchemiststoolkit.ac_brew=醸造する
items.artifacts.alchemiststoolkit.ac_energize=エネルギー
items.artifacts.alchemiststoolkit.not_ready=まだ道具箱の準備ができていない。
items.artifacts.alchemiststoolkit.cursed=道具箱の呪いで錬金術を使えなかった！
items.artifacts.alchemiststoolkit.need_energy=最低でも6エネルギーが必要だ。
items.artifacts.alchemiststoolkit.energize_desc=エネルギーの結晶6個ごとに、道具箱の強化値を上昇させるのに必要なエネルギーが与えられ、時間経過によるエネルギー生成率の上昇や、使用可能になるまでの時間が早くなる。\n\nどれだけエネルギーを使う？
items.artifacts.alchemiststoolkit.energize_1=6 エネルギー: 強化値+1
items.artifacts.alchemiststoolkit.energize_all=%1$dエネルギー: 強化値+%2$d
items.artifacts.alchemiststoolkit.desc=この道具箱には、多くの試薬と薬草、そして小さな混合瓶が入っており、どこでも錬金術が行うことができる。小瓶の中には錬金術のエネルギーの結晶のようなものが液状で入っている。
items.artifacts.alchemiststoolkit.desc_cursed=道具箱の呪いがあなたを拘束し、錬金術が使えなかった。
items.artifacts.alchemiststoolkit.desc_warming=道具箱の準備ができた。少し時間が経てば使えるようになるだろう。
items.artifacts.alchemiststoolkit.desc_hint=装備した道具箱は、経験を積むことで徐々に錬金術のエネルギーが発生する。小瓶の中の混合液に、エネルギーの結晶を加えて強化することができそうだ。

items.artifacts.artifact.cannot_wear_two=同じアーティファクトを二つ装備することはできない。
items.artifacts.artifact.equip_cursed=アーティファクトは強く体を拘束している。
items.artifacts.artifact.curse_known=このアーティファクトの中には凶悪な魔力が潜んでいるようだ。
items.artifacts.artifact.not_cursed=このアーティファクトは害悪を及ぼす魔法がない。
items.artifacts.artifact.need_to_equip=使用するにはアーティファクトを装備する必要がある。

items.artifacts.capeofthorns.name=荊棘のケープ
items.artifacts.capeofthorns.desc=DM-300から剥がれ落ちた金属板は密集して硬いケープに変化した。たくさんのエネルギーが`蓄えられているように見える。ひょっとしてDM-300の力だろうか？
items.artifacts.capeofthorns.desc_inactive=このケープを着ると肩に心地よい重さが感じられ、あなたが受けるダメージからエネルギーを得ているようだ。
items.artifacts.capeofthorns.desc_active=ケープは貯めたエネルギーを解き放とうとしている。あなたを保護する力が滲み出ている。
items.artifacts.capeofthorns$thorns.inert=ケープは再び活動を止めた。
items.artifacts.capeofthorns$thorns.radiating=ケープはエネルギーを放射し始めた。保護されている！
items.artifacts.capeofthorns$thorns.levelup=ケープはより強力になった！
items.artifacts.capeofthorns$thorns.name=荊棘
items.artifacts.capeofthorns$thorns.desc=ケープはエネルギーを発していて、あなたの周りに偏向力が漲っている！\n\nあなたが受ける全てのダメージは荊棘が有効である間軽減される。加えて、攻撃者が隣接している場合、軽減したダメージを攻撃者に跳ね返す。\n\n荊棘が終わるまで: %s ターン

items.artifacts.chaliceofblood.name=血の聖杯
items.artifacts.chaliceofblood.ac_prick=刺す
items.artifacts.chaliceofblood.yes=このまま続ける
items.artifacts.chaliceofblood.no=気が変わった
items.artifacts.chaliceofblood.prick_warn=聖杯を使うたびに生命力が吸い上げられるが、代わりに自然回復力が強化される。\n\n現在、自身を刺すと _%1$dから%2$dのダメージ_ を受けることになるが、このダメージは_物理・魔法防御またはダメージ軽減効果_によって軽減可能だ。ダメージ軽減効果を考慮しない場合、自身を刺すと _%3$s%%_ の確率で生命力が完全に尽きてしまう。\n\n聖杯にさらなる生命力を捧げるか？
items.artifacts.chaliceofblood.onprick=自身をちくりと指し、生命力が聖杯に吸収された。
items.artifacts.chaliceofblood.ondeath=聖杯によって生命力が干からびてしまった…
items.artifacts.chaliceofblood.desc=輝く銀色の聖杯の縁は尖った宝石で奇妙に飾られている。
items.artifacts.chaliceofblood.desc_cursed=聖杯の呪いはあなたの手を拘束し、回復能力を阻害している。
items.artifacts.chaliceofblood.desc_1=聖杯を握ると、尖った宝石で自身を傷つけねばならないような感覚に襲われた。
items.artifacts.chaliceofblood.desc_2=あなたの血の一部が聖杯に溜まり、聖杯が生命力をあなたへと注ぎ込まれ、自然治癒力が高まっているのを微かに感じ取れる。苦痛を伴うと分かっていながらも、なお聖杯で自らを傷つけたい衝動に駆られてしまう。
items.artifacts.chaliceofblood.desc_3=聖杯は血液で縁まで一杯だ。聖杯に与えた生命力が自身に注ぎ込まれているようだ。

items.artifacts.cloakofshadows.name=影の外套
items.artifacts.cloakofshadows.ac_stealth=潜伏する
items.artifacts.cloakofshadows.cooldown=外套が再び活性状態になるまであと%dターン必要だ。
items.artifacts.cloakofshadows.cursed=呪われた外套は使用できない。
items.artifacts.cloakofshadows.no_charge=外套は十分に充填されていないので使用できない。
items.artifacts.cloakofshadows.desc=盗賊によって何年も前に王族の武器庫から盗まれた貴重な魔法の外套。着ると、少しの間完全に不可視となる。\n\n使えば使うほど強力になっていき、不可視となる頻度が上がり持続期間も長くなる。
items.artifacts.cloakofshadows.discover_hint=勇士の一人がスタート時にこのアイテムを持っている。
items.artifacts.cloakofshadows$cloakstealth.no_charge=外套はエネルギー切れだ。
items.artifacts.cloakofshadows$cloakstealth.levelup=外套はより強力になった！
items.artifacts.cloakofshadows$cloakstealth.name=影纏い
items.artifacts.cloakofshadows$cloakstealth.desc=影の外套を纏っているおかげであなたは不可視になっている。自身で解除するか外套のチャージを使い切るまで不可視状態は続く。\n\n敵は追いかけたり攻撃することが不可能になる。物理攻撃や魔法（巻物、杖など）を使うと不可視状態が解除される。\n\nチャージ消費まで: %dターン

items.artifacts.driedrose.name=乾燥した薔薇
items.artifacts.driedrose.ac_summon=召喚
items.artifacts.driedrose.ac_direct=呼ぶ
items.artifacts.driedrose.ac_outfit=装着
items.artifacts.driedrose.spawned=既に幽霊を召喚している。
items.artifacts.driedrose.no_charge=薔薇はまだ完全に充填されていない。
items.artifacts.driedrose.cursed=呪われた薔薇は使用できない。
items.artifacts.driedrose.no_space=近くに空いている場所がない。
items.artifacts.driedrose.charged=薔薇が完全に充填された！
items.artifacts.driedrose.desc=これが幽霊が消える直前に言及した薔薇なのだろうか？いくらかの霊的な力を感じる。いなくなった戦士の霊体との交信に使えるかもしれない。
items.artifacts.driedrose.desc_no_quest=乾燥した年代物の薔薇は、その年月にも関わらず、どういうわけか元の形を保っている。\n\n霊的な力を感じるが、どうやって使えばいいのかがわからない。
items.artifacts.driedrose.desc_hint=何枚かの花弁がなくなっているようだ。あるべき場所に戻すことができたら、より強力になるだろう。
items.artifacts.driedrose.desc_cursed=薔薇の呪いは手を拘束し、不気味な冷気を放った。
items.artifacts.driedrose.desc_weapon=幽霊の武器：%s
items.artifacts.driedrose.desc_armor=幽霊の鎧：%s
items.artifacts.driedrose.desc_strength=幽霊の筋力：%s
items.artifacts.driedrose$petal.name=乾燥した花弁
items.artifacts.driedrose$petal.no_rose=この花弁を戻すための薔薇を持っていない。
items.artifacts.driedrose$petal.no_room=これ以上花弁を固定する場所がないので、廃棄した。
items.artifacts.driedrose$petal.maxlevel=薔薇が完成した！
items.artifacts.driedrose$petal.levelup=花弁を薔薇に戻した。
