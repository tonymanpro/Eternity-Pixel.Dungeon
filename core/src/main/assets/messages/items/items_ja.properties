items.weapon.melee.flail.name=フレイル
items.weapon.melee.flail.stats_desc=この武器による攻撃はより不正確になる。\nこの武器では奇襲攻撃が出来ない。
items.weapon.melee.flail.ability_name=回転
items.weapon.melee.flail.spin_warn=これ以上フレイルを回転させることはできない。
items.weapon.melee.flail.typical_ability_desc=決闘者はフレイルを_回転_させることで、短時間の間パワーを蓄積させることができる。フレイルを回転させるたびに、次の通常攻撃で通常、_ダメージが%d上昇_し、最大3回まで回転させることができる。また、回転中のフレイルは確実に命中する。フレイルの回転を開始するときのみ、充填が必要になる。
items.weapon.melee.flail.ability_desc=決闘者はフレイルを_回転_させることで、短時間の間パワーを蓄積させることができる。フレイルを回転させるたびに、次の通常攻撃で_ダメージが%d上昇_し、最大3回まで回転させることができる。また、回転中のフレイルは確実に命中する。フレイルの回転を開始するときのみ、充填が必要になる。
items.weapon.melee.flail.desc=棘がついた球体が鎖によって持ち手に取り付けられている。非常に扱いにくいが、強烈な打撃が命中すると敵を粉砕するだろう。
items.weapon.melee.flail$spinabilitytracker.name=回転中
items.weapon.melee.flail$spinabilitytracker.desc=決闘者はフレイルを回転させ、次の通常攻撃のためにダメージを蓄積している。1回行うごとに1ターンかかるが、ダメージは上昇し最大3回まで行うことができる。回転中のフレイルは確実に命中するようになる。\n\n現在の回転: %1$d%%\n残り: %2$sターン

items.weapon.melee.gauntlet.name=石の篭手
items.weapon.melee.gauntlet.stats_desc=この武器による攻撃はとても素早くなる。
items.weapon.melee.gauntlet.ability_name=複合撃
items.weapon.melee.gauntlet.typical_ability_desc=決闘者は石の篭手で_複合撃_を行うことができる。この攻撃は確実に命中し、決闘者が通常の近接攻撃か投擲武器による攻撃を命中させた回数につき、通常、与えるダメージが _%d上昇する。_ 5ターンの間攻撃が命中しなかった場合、この回数はリセットされる。
items.weapon.melee.gauntlet.ability_desc=決闘者は石の篭手で_複合撃_を行うことができる。この攻撃は確実に命中し、決闘者が通常の近接攻撃か投擲武器による攻撃を命中させた回数につき、与えるダメージが _%d上昇する。_ 5ターンの間攻撃が命中しなかった場合、この回数はリセットされる。
items.weapon.melee.gauntlet.desc=この巨大な篭手は重い魔法石が表面にあしらわれている真紅の布で作られている。この布はあなたの手によく合い、硬い石版は外皮のようだ。重量級の武器のように動かせるようになるには筋力が必要だが、一撃に途方もない力を加えるだろう。

