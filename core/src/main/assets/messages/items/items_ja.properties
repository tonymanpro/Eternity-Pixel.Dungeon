items.weapon.melee.glaive.typical_ability_desc=決闘者は薙刀の穂先を使い、範囲内にいるが隣接していない敵に_刺突_することができる。これは通常、 _%1$dから%2$dのダメージ_ を与え、確実に命中して敵を吹き飛ばす。
items.weapon.melee.glaive.ability_desc=決闘者は薙刀の穂先を使い、範囲内にいるが隣接していない敵に_刺突_することができる。これは _%1$dから%2$dのダメージ_ を与え、確実に命中して敵を吹き飛ばす。
