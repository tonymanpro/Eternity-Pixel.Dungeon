items.artifacts.driedrose$wndghosthero.title=幽霊の装備
items.artifacts.driedrose$wndghosthero.desc=幽霊は儚い存在だが、その姿は武器や鎧を装備するのに十分なほど実体化している。あなたと同じように武器や鎧を装備できるだろう。\n\n現在、幽霊は _%dの筋力_ が必要なアイテムを装備できる。
