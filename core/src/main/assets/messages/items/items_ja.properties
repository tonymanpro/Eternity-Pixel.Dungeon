items.weapon.melee.dagger.typical_ability_desc=決闘者はダガーを振るっている時、_忍び足_ができる。この能力は5タイル分の距離まで瞬時に移動し、通常、_%dターンの間、不可視状態になれる。_
items.weapon.melee.dagger.ability_desc=決闘者はダガーを振るっている時、_忍び足_ができる。この能力は5タイル分の距離まで瞬時に移動し、_%dターンの間、不可視状態になれる。_
