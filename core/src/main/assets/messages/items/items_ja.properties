items.artifacts.skeletonkey.wall_charges=一時的な壁を生成するには2の充填量が必要だ。
items.artifacts.skeletonkey.crystal_charges=結晶の錠を開けるには5の充填量が必要だ。
items.artifacts.skeletonkey.wont_open=鍵が何らかの理由でこの錠に合わない。
items.artifacts.skeletonkey.locked_with_key=その扉はあなたの万能鍵で施錠されていた。
items.artifacts.skeletonkey.force_lock=その錠は万能鍵なしで弱まっている。なんとかこじ開ける。
items.artifacts.skeletonkey.discard=余った鍵を捨てた。
items.artifacts.skeletonkey.levelup=万能鍵はより強力になった！
items.artifacts.skeletonkey.desc=頭部が頭蓋骨のような形をした、重要そうな鍵だ。その歯は見るたびに形が変わっているように見える。
items.artifacts.skeletonkey.desc_worn=この魔法の鍵は、ダンジョンの通常の鍵の代わりに使うと、使うほどに力を増すようだ。ダンジョンのほぼ全ての錠に差し込むことができ、開錠も施錠も可能だ。これまでに一度も施錠されたことのない扉も例外ではない。\n\nこの鍵は、空いている空間に対して四方向または斜め方向に使うことで、目の前の空間を「ロック」することもできる。これにより幅3タイル分の固い壁が形成され、10ターン間持続する。ロック時には、敵が押し出される余地があれば押し退けられる。
items.artifacts.skeletonkey.desc_cursed=呪われた鍵は、どの錠にもはまるのを積極的に避けているようで、他の鍵を使うことさえ困難にしている。（ただし不可能ではない）
items.artifacts.skeletonkey$keywall.desc=この場所には万能鍵によって、一時的な魔法の壁が設置されている。

items.artifacts.talismanofforesight.name=予見の護符
items.artifacts.talismanofforesight.ac_scry=占う
items.artifacts.talismanofforesight.low_charge=この護符を使用するには、少なくとも5%の充填が必要だ。
items.artifacts.talismanofforesight.prompt=探索する場所を選択してください。
items.artifacts.talismanofforesight.levelup=護符はより強力になった！
items.artifacts.talismanofforesight.full_charge=護符が十分に充填された！
items.artifacts.talismanofforesight.desc=奇妙な彫刻が施されたなめらかな石だ。周辺のすべてを見守り、隠されたものを見張っているような気がする。
items.artifacts.talismanofforesight.desc_worn=護符を握りしめると、感覚が鋭敏になったような気がする。護符は、時間の経過や、隠された扉や罠などを発見した時に、徐々に充填される。\n\nこの護符は、チャージを消費して円錐形の「探索」を行うことができ、探索した範囲内全てのタイルと秘密を露呈し、短時間敵やアイテムが見えるようになる。
items.artifacts.talismanofforesight.desc_cursed=呪われた護符がじっとあなたを見つめ、感覚を鈍らせている。
items.artifacts.talismanofforesight$foresight.name=予見
items.artifacts.talismanofforesight$foresight.uneasy=不安になってきた。
items.artifacts.talismanofforesight$foresight.desc=近くに見えない危険があるような、とても緊張した気分だ。

items.artifacts.timekeepershourglass.name=時の守護者の砂時計
items.artifacts.timekeepershourglass.ac_activate=起動
items.artifacts.timekeepershourglass.deactivate=時間停止を解除する。
items.artifacts.timekeepershourglass.no_charge=砂時計は十分に充填されていないので使用できない。
items.artifacts.timekeepershourglass.cursed=呪われた砂時計は使用できない。
items.artifacts.timekeepershourglass.onstasis=周りの世界が目まぐるしく動いているように見える。
items.artifacts.timekeepershourglass.onfreeze=あなた以外が突然停止した。
items.artifacts.timekeepershourglass.stasis=停滞に身を置く。
items.artifacts.timekeepershourglass.freeze=周りの時間を止める。
items.artifacts.timekeepershourglass.prompt=砂時計の魔法をどう使うか？\n\n停滞すると、流れる時の中で停止し完全に無敵となる。これは、一回につき最大2チャージまで消費する。\n\n時間を止めると、時間をかけずに行動したかのように動けるようになる。これは砂時計を再使用するか、攻撃することで解除される。
items.artifacts.timekeepershourglass.desc=この凝った意匠の大きな砂時計は役に立ちそうもないが、綺麗に婉曲した本体からは大きな力が感じられる。砂時計の天地を逆転させて砂が流れ落ちるのを見ると、その魔法が強くあなたを惹きつけるのを感じ、時を司る力を手に入れることができるだろう。
items.artifacts.timekeepershourglass.desc_hint=砂時計の中の砂が足りないようだ。もしもっと砂を集められれば…
items.artifacts.timekeepershourglass.desc_cursed=砂時計の呪いはあなたを拘束し、あなたの時の流れを操ろうとしているようだ。
items.artifacts.timekeepershourglass$timefreeze.name=時間停止
items.artifacts.timekeepershourglass$timefreeze.desc=あなたの周りの時間が止まり、瞬時に行動を起こすことができるようになる。この効果は砂時計で解除するか、砂時計の充填が切れるまで続く。また、攻撃を行ったり魔法を使用しても解除される。\n\nチャージ消費まで: %sターン
items.artifacts.timekeepershourglass$sandbag.name=魔法の砂袋
items.artifacts.timekeepershourglass$sandbag.levelup=砂時計に砂を入れた。
items.artifacts.timekeepershourglass$sandbag.maxlevel=砂時計は魔法の砂で一杯だ！
items.artifacts.timekeepershourglass$sandbag.no_hourglass=砂を入れるための砂時計を持っていない。
items.artifacts.timekeepershourglass$sandbag.desc=この小さい袋に入っている細かい砂は砂時計の砂にぴったりだ。\n\nなぜいつも必要になったときに店にこのアイテムが並んでいるのだろう…

items.artifacts.unstablespellbook.name=不安定な呪文書
items.artifacts.unstablespellbook.ac_read=読む
items.artifacts.unstablespellbook.ac_add=追加する
items.artifacts.unstablespellbook.blinded=盲目状態では呪文書を読めない。
items.artifacts.unstablespellbook.no_charge=呪文書はエネルギー切れだ。
items.artifacts.unstablespellbook.cursed=呪われた呪文書は読むことができない。
items.artifacts.unstablespellbook.prompt=巻物を選択
items.artifacts.unstablespellbook.infuse_scroll=呪文書を巻物のエネルギーで満たした。
items.artifacts.unstablespellbook.unable_scroll=この巻物は呪文書に追加できない。
items.artifacts.unstablespellbook.unknown_scroll=識別されていない巻物だ。
items.artifacts.unstablespellbook.desc=この秘本はその経過年数からは考えられないくらいに良い状態を保っている。ページをめくるたびに烟いたり爆ぜたりして、不安定なエネルギーが渦巻いている。呪文書を読んだときにどんな呪文が唱えられるかを知ることは不可能だ。
items.artifacts.unstablespellbook.desc_cursed=呪われた呪文書はあなたを拘束し、ほとんどの巻物を使うことができなくなる。
items.artifacts.unstablespellbook.desc_index=この呪文書は未完成だ。白紙のページの箇所を目次が表示している。
items.artifacts.unstablespellbook.desc_empowered=呪文書に追加された巻物は力で輝いている。より多いチャージ量と引き換えに、奇抜な巻物の効果を選ぶことができるようになる。
items.artifacts.unstablespellbook.read_empowered=呪文書に追加された巻物がエネルギーにみなぎっている。巻物の効果を通常通りにするか奇抜にするかを選べるようになる。\n\n奇抜な効果を選ぶと2つのチャージを消費するようになる。



###bags
items.bags.bag.name=背嚢
items.bags.bag.discover_hint=このアイテムは店で購入できる。

items.bags.potionbandolier.name=ポーション入れ
items.bags.potionbandolier.desc=この分厚い帯のようなポーション入れは胸にぴったりと合い、ポーションの瓶や革水袋、液体金属の瓶を留める断熱材のストラップがたくさんついている。\n\nポーション入れに入っているポーションは冷気から守られるだろう。

items.bags.scrollholder.name=巻物入れ
items.bags.scrollholder.desc=この筒状の容器は天文学者の星図や道具を持ち運ぶもののように見えるが、巻物も同じように入る。側面には呪文結晶、秘儀の尖筆、秘儀の樹脂を入れるのに適した仕切りがいくつかある。\n\n巻物入れは不燃性なので、巻物に引火することはないだろう。

items.bags.velvetpouch.name=ベルベットのポーチ
items.bags.velvetpouch.desc=この小さなベルベットのポーチには、種やルーンストーン、錬金術の素材など、たくさんの小物を入れることができる。
items.bags.velvetpouch.discover_hint=勇士の一人がスタート時にこのアイテムを持っている。

items.bags.magicalholster.name=魔法のホルスター
items.bags.magicalholster.desc=このすらりとしたホルスターは何匹かの珍しい動物の皮で作られており、その強力な魔法によって大量の遠隔武器を収納できる。\n\n単に手を入れただけで望んだアイテムを出すことが出来る。\n\nホルスターの魔法のおかげで、中に入っている杖の充填は少しだけ早くなり、投擲武器は少しだけ寿命が伸びるだろう。



###bombs
items.bombs.arcanebomb.name=秘儀爆弾
items.bombs.arcanebomb.desc=この爆弾は秘儀の特性が込められており、爆発するとグゥの膨張攻撃に似た強力な爆発を起こし、2タイル以内のものに _%1$dから%2$dの魔法ダメージ_ を与える。
items.bombs.arcanebomb.discover_hint=このアイテムは錬金術で作ることができる。

items.bombs.bomb.name=爆弾
items.bombs.bomb.ac_lightthrow=着火して投げる
items.bombs.bomb.snuff_fuse=素早く導火線の火を消した。
items.bombs.bomb.ondeath=爆死した…
items.bombs.bomb.rankings_desc=爆発によって死亡
items.bombs.bomb.desc=かなり重い黒色火薬の爆弾だ。この爆弾の爆発は隣接するものに _%1$dから%2$dのダメージ_ を与え、隣接する地形やアイテムを破壊する。
items.bombs.bomb.desc_fuse=導火線に着火してから爆発するまで数ターンの猶予がありそうだ。
items.bombs.bomb.desc_burning=爆弾の導火線が燃え尽きつつある。すぐにここから離れないと！
items.bombs.bomb$doublebomb.name=二つの爆弾
items.bombs.bomb$doublebomb.desc=二つの重い爆弾。一個くらいなら持てそうだ。

items.bombs.firebomb.name=火炎爆弾
items.bombs.firebomb.desc=この爆弾はより広い範囲で爆発し、_%1$dから%2$dのダメージ_ を与え、2タイルの範囲内で炎が燃え続けるように改造されている。
items.bombs.firebomb.discover_hint=このアイテムは錬金術で作ることができる。

items.bombs.flashbangbomb.name=閃光弾
items.bombs.flashbangbomb.desc=この改造された爆弾は、爆発すると閃光と音と電撃の爆風を巻き起こす。2タイルの範囲内にいるものは爆発による _%1$dから%2$dのダメージ_ と電撃による25%%の追加ダメージを受け、10ターンの間麻痺する。
items.bombs.flashbangbomb.discover_hint=このアイテムは錬金術で作ることができる。

items.bombs.frostbomb.name=氷爆弾
items.bombs.frostbomb.desc=この爆弾はより広い範囲で爆発し、_%1$dから%2$dのダメージ_ を与え、2タイルの範囲内で凍てつくような風を起こすように改造されている。
items.bombs.frostbomb.discover_hint=このアイテムは錬金術で作ることができる。

items.bombs.holybomb.name=威光爆弾
items.bombs.holybomb.desc=この爆弾は、爆発時により広い範囲に聖なる光を放つように改造されている。2タイル以内のものは爆発によって _%1$dから%2$dのダメージ_ を受け、不死や悪魔の敵は聖なる光によってさらに50%%の追加ダメージを受ける。
items.bombs.holybomb.discover_hint=このアイテムは錬金術で作ることができる。

items.bombs.noisemaker.name=騒音弾
items.bombs.noisemaker.desc=この改造された爆弾は、導火線が切れると繰り返し騒音を出すようだ。爆弾に何かが触れると爆発し、2タイル以内のものに _%1$dから%2$dのダメージ_ を与える！
items.bombs.noisemaker.desc_burning=騒音弾はチクタクと音を響かせており、何かが触れると爆発するだろう！
items.bombs.noisemaker.discover_hint=このアイテムは錬金術で作ることができる。

items.bombs.smokebomb.name=発煙弾
items.bombs.smokebomb.desc=この改造された爆弾は、爆発と同時に厚い雲のようなガスを噴き出すようだ。_%1$dから%2$dのダメージ_ を与え、2タイルの範囲内に視界を遮る霧が発生する。
items.bombs.smokebomb.discover_hint=このアイテムは錬金術で作ることができる。

items.bombs.regrowthbomb.name=活力弾
items.bombs.regrowthbomb.desc=この改造された爆弾は、爆発する代わりに3タイルの範囲内に活力を与える液体を撒き散らす。液体を浴びた場所は瞬く間に草や植物が芽吹く。液体を浴びた自分自身や味方は治癒のポーションを飲んだかのように回復するだろう。
items.bombs.regrowthbomb.discover_hint=このアイテムは錬金術で作ることができる。

items.bombs.shrapnelbomb.name=破片爆弾
items.bombs.shrapnelbomb.desc=この爆弾はDM-300の金属片で改造されており、爆発すると破片があちこちに飛び散り、爆弾から広い範囲にいるもの全てに _%1$dから%2$dのダメージ_ を与える。これを使う前は何かの陰に隠れたほうがいいだろう…
items.bombs.shrapnelbomb.discover_hint=このアイテムは錬金術で作ることができる。

items.bombs.woollybomb.name=羊弾
items.bombs.woollybomb.desc=この改造された爆弾は、爆発すると広い範囲で魔法の羊が召喚される。爆発は2タイル以内のものに _%1$dから%2$dのダメージ_ を与える。羊は動きを封じ、非常に長い時間留まる！しかし、強力な敵がいる場合は羊はそれほど長くは留まらない。また、羊と話すことで、手動ですぐに消すこともできる。
items.bombs.woollybomb.discover_hint=このアイテムは錬金術で作ることができる。

###food
items.food.berry.name=ダンジョンの果実
items.food.berry.eat_msg=この果実はとっても美味しい！
items.food.berry.desc=この小さな果実は、女猟師がダンジョンの植物から見つけたものだ。すぐに食べることができ、空腹を少し回復できる。
items.food.berry.discover_hint=このアイテムは特定の勇士の天賦を使って見つけることができる。

items.food.blandfruit.name=無味果
items.food.blandfruit.cooked=調理済みの無味果
items.food.blandfruit.sunfruit=太陽の果実
items.food.blandfruit.rotfruit=腐敗の果実
items.food.blandfruit.earthfruit=大地の果実
items.food.blandfruit.blindfruit=盲目の果実
items.food.blandfruit.firefruit=炎の果実
items.food.blandfruit.icefruit=氷の果実
items.food.blandfruit.fadefruit=霧散の果実
items.food.blandfruit.sorrowfruit=悲嘆の果実
items.food.blandfruit.stormfruit=嵐の果実
items.food.blandfruit.dreamfruit=癒術の果実
items.food.blandfruit.starfruit=星の果実
items.food.blandfruit.swiftfruit=敏捷の果実
items.food.blandfruit.raw=生のまま食べるなんて耐えられない。
items.food.blandfruit.desc=乾燥していて味がしない。他の何かと混ぜた方がきっとおいしいだろう。
items.food.blandfruit.desc_cooked=鍋に浸してから実は丸々と膨らみ、同時に調理していた原料の特性さえ吸収していった。いまや対応するポーションや種の効果を発揮するようになった。
items.food.blandfruit.desc_eat=食べられそうだ！
items.food.blandfruit.desc_throw=とても不安定に見える。投げるのが一番良いだろう。
items.food.blandfruit$chunks.name=無味果の塊
items.food.blandfruit$chunks.desc=無味果は衝撃で爆発し、あとには何の変哲もない塊が残った。\n\n少し泥で汚れているにも関わらず、調理済みの大きな塊は安全に食べられそうに思える。

items.food.chargrilledmeat.name=焼肉
items.food.chargrilledmeat.desc=まともなステーキになってきた。
items.food.chargrilledmeat.discover_hint=別の食材を使って作ることもできる。

items.food.food.name=糧食
items.food.food.ac_eat=食べる
items.food.food.eat_msg=美味しい！
items.food.food.desc=彩りを添えるものはなにもない。乾燥肉、いくつかのビスケット…こんなものだ。

items.food.frozencarpaccio.name=冷凍カルパッチョ
items.food.frozencarpaccio.invis=手が見えなくなってきた！
items.food.frozencarpaccio.hard=皮膚が硬くなったようだ！
items.food.frozencarpaccio.refresh=爽快だ！
items.food.frozencarpaccio.better=元気になった！
items.food.frozencarpaccio.desc=冷凍の生肉だ。食べるには薄く切る必要があるが、意外とおいしい。
items.food.frozencarpaccio.discover_hint=別の食材を使って作ることもできる。

items.food.meatpie.name=ミートパイ
items.food.meatpie.eat_msg=信じられないくらい美味しい！
items.food.meatpie.desc=塩の効いた肉が詰め込まれた美味しいパイだ。他のどんな食事もこれには敵わないだろう。
items.food.meatpie.discover_hint=このアイテムは錬金術で作ることができる。

items.food.mysterymeat.name=得体の知れない肉
items.food.mysterymeat.eat_msg=ちょっと…奇妙な味だ。
items.food.mysterymeat.hot=あつっ！
items.food.mysterymeat.legs=足の感覚がない！
items.food.mysterymeat.not_well=具合が悪い。
items.food.mysterymeat.stuffed=お腹がいっぱいで動きづらい。
items.food.mysterymeat.desc=食べるのは自己責任！
items.food.mysterymeat.discover_hint=このアイテムは特定の敵からドロップで入手できる。
items.food.mysterymeat$placeholder.name=肉

items.food.phantommeat.name=幻の肉
items.food.phantommeat.desc=霊体ピラニアから切り出した、光り輝く半透明の大きな肉。この魔法の肉は調理する必要がなく、十分に腹を満たすだけでなく、多くの防御的な利点を付与する。食べると、透明化、樹皮の肌、若干の治癒、多くの状態異常の回復を与える。
items.food.phantommeat.discover_hint=このアイテムは特定の敵からドロップで入手できる。

items.food.pasty.name=パスティ
items.food.pasty.fish_name=蒸し魚
items.food.pasty.amulet_name=イェンダーの魔除け？
items.food.pasty.egg_name=イースターエッグ
items.food.pasty.rainbow_name=虹色のポーション
items.food.pasty.shattered_name=緑色のケーキ
items.food.pasty.pie_name=パンプキンパイ
items.food.pasty.vanilla_name=青色のケーキ
items.food.pasty.cane_name=棒キャンディ
items.food.pasty.sparkling_name=スパークリングポーション
items.food.pasty.desc=牛肉とじゃがいもの伝統的な具が入った、本格的なコーニッシュパスティだ。おいしい！
items.food.pasty.fish_desc=魔法的に保存された、丸ごと一匹の蒸し魚が青菜の上に乗っている。毎年この時期は、魚は一度に全部食べるのではなく、少し残しておく風習がある。\n\n旧正月、あけましておめでとうございます！
items.food.pasty.amulet_desc=遂にあなたはイェンダーの魔除けを......おや、ちょっと待てよ......？これは魔除けに似せて作られたただのホイル包みチョコレートだ！無限のパワーは得られないが、少なくともお腹は満たされるし、ちょっとしたアーティファクトの充填もできる。\n\nエイプリルフール！
items.food.pasty.egg_desc=カラフルな黄色のホイルに包まれた大きなチョコレートエッグだ。腹を満たすのに十分な量のチョコレートがあり、砂糖があなたのアーティファクトにほんの少し充填を与えてくれるかもしれない。\n\nハッピーイースター！
items.food.pasty.rainbow_desc=このカラフルなポーションは一種の流動食だ。空腹を満たすだけでなく、隣接するボス以外の敵を落ち着かせ、一時的に戦うのをためらわせる魔法が少し入っている。\n\nハッピープライド！
items.food.pasty.shattered_desc=この大きなバニラケーキの一切れには、カラフルなスプリンクルと緑色のフロスティングが施されている。このケーキは長年の経験を祝うために作られたもので、食べると経験値が少し増える。\n\nShattered Pixel Dungeonは2014年8月5日に初リリースされました。Shattered Pixel Dungeon、誕生日おめでとう！
items.food.pasty.pie_desc=パンプキンパイの大きな一切れだ！甘くて香ばしい味で満腹になり、少し体力が回復するだろう。\n\nハッピーハロウィン！
items.food.pasty.vanilla_desc=この大きなバニラケーキの一切れには、カラフルなスプリンクルと青色のフロスティングが施されている。このケーキは長年の経験を祝うために作られたもので、食べると経験値が少し増える。\n\nオリジナルのPixel Dungeonは2012年12月4日に初リリースされました。Pixel Dungeon、誕生日おめでとう！
items.food.pasty.cane_desc=甘くて美味しい巨大な棒キャンディだ！満腹になるほど大きく、砂糖は杖を少し充填するだろう。\n\nハッピーホリデー！
items.food.pasty.sparkling_desc=このスパークリングポーションは一種の流動食だ。空腹を満たし、スパークリングワインを思わせるが、アルコールは入っていない。お腹の温かい感覚が、ちょっとしたシールドを与えてくれるだろう。\n\n新年、明けましておめでとうございます！
items.food.pasty$fishleftover.name=蒸し魚の残り
items.food.pasty$fishleftover.eat_msg=まあまあ美味しい。
items.food.pasty$fishleftover.desc=前の食事で残った魚だ。いつでも好きなときに食べられて、少しだけ空腹を満たすことができる。

items.food.smallration.name=小さい糧食
items.food.smallration.eat_msg=まあまあ美味しい。
items.food.smallration.desc=標準的な糧食と全く同じに見えるけれど、少し量が少ない。
items.food.smallration.discover_hint=このアイテムは店で購入できる。

items.food.stewedmeat.name=肉の煮込み
items.food.stewedmeat.eat_msg=まあまあ美味しい。
items.food.stewedmeat.desc=肉を煮込むことで病原菌や寄生虫を取り除いた。これで安全に食べられるはずだ。
items.food.stewedmeat.discover_hint=このアイテムは錬金術で作ることができる。

items.food.supplyration.name=支援糧食
items.food.supplyration.desc=この糧食は盗賊ギルドの仲間がダンジョン内に置いていったものだ。移動しつつ食べたり、一般的な盗賊活動を支援するために特別に設計されている。\n\n通常の糧食ほど腹を満たせないが、素早く食べられて、少し直接的な治癒を得られる上に、盗賊の影の外套の充填を回復させることができる。
items.food.supplyration.discover_hint=このアイテムは特定の勇士の天賦を使って見つけることができる。



##journal items
items.journal.documentpage.name=引き裂かれたページ
items.journal.documentpage.desc=多分、どこかの本から引き裂かれた一枚のページ。読むためには拾う必要がある。

items.journal.alchemypage.name=錬金術の書から引き裂かれたページ
items.journal.alchemypage.desc=錬金術の手引書から引き裂かれたページ。\n\n遠くからではほとんどの文章は小さすぎて読めないが、かろうじてページのタイトルだけは読める：\n\n_「%s」_

items.journal.guidebook.name=ダンジョンの謎
items.journal.guidebook.hint_mobile=ガイドブックにアドバイスが書かれています！画面右上の点滅する日誌ボタンをタップして読んでください。
items.journal.guidebook.hint_desktop=ガイドブックにアドバイスが書かれています！画面右上の点滅する日誌ボタン (%s) を選択して読んでください。
items.journal.guidebook.hint_status=ガイドブック
items.journal.guidebook.desc=冒険が苦手な人が置いていった冒険者のためのガイドブック。この本は魔法の本で、タイミングよく冒険者に本を紐解くことをすすめてくれるのだ。\n表紙に大きく書かれた「落ち着いてこー！」という、くすっと笑える文言が人気をよんでいる。

items.journal.guidepage.name=手引書から引き裂かれたページ
items.journal.guidepage.desc=冒険者の手引きから引き裂かれたページ。\n\n遠くからではほとんどの文章は小さすぎて読めないが、かろうじてページのタイトルだけは読める：\n\n_「%s」_

items.journal.regionlorepage$sewers.name=擦り切れた手紙
items.journal.regionlorepage$sewers.desc=汚れた紙片に書かれた手紙のようなものだ。手に取ってみないと、何が書いてあるのかわからない。

items.journal.regionlorepage$prison.name=擦り切れた日記
items.journal.regionlorepage$prison.desc=古い紙に書かれた日記か何かの記録。下水道で見つけた手紙よりはましなようだが、読むにはやはり手に取る必要がある。

items.journal.regionlorepage$caves.name=古い日誌
items.journal.regionlorepage$caves.desc=探検家の日誌と思われるもので、古いはずなのに驚くほど保存状態が良い。手に取って読んでみよう。

items.journal.regionlorepage$city.name=錆びた金属板
items.journal.regionlorepage$city.desc=錆びた金属製の小さな板に、魔法で文字が刻まれている。古くても文字は鮮明だが、手に取らないと読めない。

items.journal.regionlorepage$halls.name=光り輝く石板
items.journal.regionlorepage$halls.desc=緑色に光る文字が刻まれた小さな黒い石板。光る文字は遠目には霞んで見えるので、手に取らないと読めない。


###keys
items.keys.goldenkey.name=金の鍵
items.keys.goldenkey.desc=この金の鍵は歯がとても小さく複雑にできている。施錠された宝箱をこの鍵で開けられるのではないか？

items.keys.crystalkey.name=結晶の鍵
items.keys.crystalkey.desc=結晶の鍵の表面は暗闇で光り輝いている。結晶で作られた何かをこの鍵で開けられるのではないか？

items.keys.ironkey.name=鉄の鍵
items.keys.ironkey.desc=この古い鉄の鍵は歯がすり減っており、ぼろぼろの革のストラップは時代の流れを感じさせる。どんな扉なら開けられるのだろう？

items.keys.wornkey.name=古びた鍵
items.keys.wornkey.desc=この鍵は古びて色褪せているが、重々しい雰囲気を漂わせている。おそらく近くにある重要な扉を開けられるだろう。



###potions
items.potions.potion.ac_drink=飲み干す
items.potions.potion.turquoise=青緑のポーション
items.potions.potion.crimson=紅のポーション
items.potions.potion.azure=空色のポーション
items.potions.potion.jade=翡翠のポーション
items.potions.potion.golden=金のポーション
items.potions.potion.magenta=赤紫のポーション
items.potions.potion.charcoal=墨色のポーション
items.potions.potion.ivory=象牙色のポーション
items.potions.potion.amber=琥珀色のポーション
items.potions.potion.bistre=黄褐色のポーション
items.potions.potion.indigo=藍色のポーション
items.potions.potion.silver=銀のポーション
items.potions.potion.unknown_desc=フラスコの中には鮮やかな液体が渦巻いている。飲んだり投げたりしたらどうなるのだろう？
items.potions.potion.harmful=有害なポーション！
items.potions.potion.beneficial=有益なポーション
items.potions.potion.yes=このまま続ける
items.potions.potion.no=気が変わった
items.potions.potion.sure_drink=本当に飲みたいのか？大抵の場合、こんなポーションは敵に向かって投げつけるものだ。
items.potions.potion.sure_throw=本当に投げたいのか？大抵の場合、これは飲んだほうが役に立つ。
items.potions.potion.shatter=フラスコが壊れて、液体が地面に飛び散った。
items.potions.potion.discover_hint=このアイテムはダンジョン内でランダムに見つかるか、錬金術で作ることができる。
items.potions.potion$placeholder.name=ポーション
items.potions.potion$seedtopotion.name=ランダムなポーション

items.potions.potionofexperience.name=経験値のポーション
items.potions.potionofexperience.desc=無数の戦いのエッセンスを絞り出したこの液体を飲むと、経験値が一気に上がっていくだろう。

items.potions.potionoffrost.name=凍結のポーション
items.potions.potionoffrost.desc=このポーションにはある種の化学物質が含まれており、空気に接したらたちまち気化して周囲を凍結させる雲となるだろう。

items.potions.potionofhaste.name=加速のポーション
items.potions.potionofhaste.energetic=エネルギーに満ち溢れている！
items.potions.potionofhaste.desc=奇妙に甘いこの液体を飲むと、少しの間途方もないエネルギーが体を駆け巡り、高速で動けるようになる。

items.potions.potionofhealing.name=治癒のポーション
items.potions.potionofhealing.heal=傷が癒えていく。
items.potions.potionofhealing.desc=この霊薬はたちどころに傷を癒すとともに、身体の異常も解消してくれるだろう。

items.potions.potionofinvisibility.name=不可視のポーション
items.potions.potionofinvisibility.invisible=手が見えなくなってきた！
items.potions.potionofinvisibility.desc=このポーションを飲むと一時的に不可視状態になる。不可視状態の間、敵はあなたを見ることができなくなる。物理攻撃や魔法効果（巻物や杖など）は即座に不可視状態が解除される。

items.potions.potionoflevitation.name=浮遊のポーション
items.potions.potionoflevitation.float=空中に浮いている！
items.potions.potionoflevitation.desc=このポーションを飲むと滞空できるようになり、罠や奈落の上に佇むことができる。ポーションを投げると混乱ガスが発生し、巻き込んだもの全てを前後不覚に陥らせるだろう。

items.potions.potionofliquidflame.name=炎のポーション
items.potions.potionofliquidflame.desc=このポーションには不安定な物質が含まれており、空気に接したらたちまち気化して激しい衝撃と共に炎に変化するだろう。

items.potions.potionofmindvision.name=天眼のポーション
items.potions.potionofmindvision.see_mobs=何故か他の生物の存在を感じ取れるようになってきた！
items.potions.potionofmindvision.see_none=どういうわけか現在この階層では一人きりだ、と感じられた。
items.potions.potionofmindvision.desc=このポーションを飲むと、あなたの心は遠くにいる生物の神経信号と同調し始め、壁に遮られていてもその存在を知覚できるだろう。また、近くの壁や扉を通して見通すことができるようになる。

items.potions.potionofparalyticgas.name=麻痺ガスのポーション
items.potions.potionofparalyticgas.desc=このフラスコ内の液体は、外気に触れると麻痺性の黄色い霧へと気化する。この霧を吸い込んだ者は即座に麻痺し、霧が消えた後もしばらくの間動けなくなる。このアイテムは遠くの敵に投げつけてガスの効果範囲内に捕らえることも可能だ。

items.potions.potionofpurity.name=清純のポーション
items.potions.potionofpurity.freshness=空気が珍しく清々しい。
items.potions.potionofpurity.protected=保護膜があなたを包み込んだ！
items.potions.potionofpurity.desc=この魔法の薬はエリア内の有害な効果を一瞬にして無効化するだろう。飲む事でそれらの効果に対する耐性を一時的に得ることができる。

items.potions.potionofstrength.name=筋力のポーション
items.potions.potionofstrength.msg=新たな力が全身を駆け巡り、あなたの筋力は%dになった！
items.potions.potionofstrength.desc=この強力な液体を飲むと筋肉を駆け巡り、あなたの筋力が1ポイント上昇するだろう。

items.potions.potionoftoxicgas.name=毒ガスのポーション
items.potions.potionoftoxicgas.desc=この加圧容器を開けたり割ったりすると、中身が噴出して致死性の緑の毒ガスに変化するだろう。どう考えてもこのポーションは手で開けるより遠くの敵に投げつけたほうがいい。



###brews
items.potions.brews.brew.discover_hint=このアイテムは錬金術で作ることができる。

items.potions.brews.aquabrew.name=圧水の醸造物
items.potions.brews.aquabrew.desc=この醸造物の瓶が粉々になると、その場所に圧縮された水を噴射する。炎を纏っている敵にダメージを与えられる程度の威力だが、近くの地形に水を拡散させて罠を解除し、火を消し、噴射地点の近くにいるキャラクターを吹き飛ばすだろう。

items.potions.brews.blizzardbrew.name=吹雪の醸造物
items.potions.brews.blizzardbrew.desc=瓶が粉々になると、ガスのように広がる渦巻く吹雪が解き放たれ、すぐに拡散するだろう。

items.potions.brews.causticbrew.name=苛性の醸造物
items.potions.brews.causticbrew.desc=瓶が粉々になると、この醸造物は苛性粘液となって辺り一帯に撒き散らされる。粘液がかかったものは洗い落とさない限りゆっくりと溶け出していくだろう。

items.potions.brews.infernalbrew.name=地獄の醸造物
items.potions.brews.infernalbrew.desc=粉々になると、ガスのように広がる荒れ狂う業火が解き放たれ、すぐに広がるだろう。

items.potions.brews.shockingbrew.name=電撃の醸造物
items.potions.brews.shockingbrew.desc=粉々になると、割れた場所を中心に周囲の広い範囲に、雷雲が解き放たれるだろう。

items.potions.brews.unstablebrew.name=不定の醸造物
items.potions.brews.unstablebrew.desc=虹色に輝く魔法の醸造物だ。\n\nこの醸造物を飲んだり投げたりすると、ランダムなポーションの効果が発動する。ポーションの効果は、飲めば必ず有益になり、投げれば必ず有害になる。

###elixirs
items.potions.elixirs.elixir.discover_hint=このアイテムは錬金術で作ることができる。

items.potions.elixirs.elixirofarcanearmor.name=秘儀の鎧の霊薬
items.potions.elixirs.elixirofarcanearmor.desc=この霊薬を飲むと、長い間魔法攻撃に対する耐性を得る。

items.potions.elixirs.elixirofaquaticrejuvenation.name=水中回復の霊薬
items.potions.elixirs.elixirofaquaticrejuvenation.desc=この霊薬は治癒のポーションで強化されたグゥの名残だ。飲んでも即座に回復はしないが、水の中に佇んでいる間、着実に体力を回復していくだろう。
items.potions.elixirs.elixirofaquaticrejuvenation$aquahealing.name=水中回復
items.potions.elixirs.elixirofaquaticrejuvenation$aquahealing.desc=あなたは一時的にグゥと同じ再生能力を持つようになった。\n\n水の中に立っているとき、毎ターンに少量の体力を回復していくだろう。この効果はあなたが全快しているときや水の外にいるときは中断される。\n\n水中回復が終わるまで: %d ターン

items.potions.elixirs.elixirofdragonsblood.name=龍の血液の霊薬
items.potions.elixirs.elixirofdragonsblood.desc=霊薬を飲み干すと、炎の力があなたの血管を駆け巡る。炎に対する耐性が付き、物理攻撃をした敵が炎に包まれるようになるだろう。

items.potions.elixirs.elixiroffeatherfall.name=天衣飛翔の霊薬
items.potions.elixirs.elixiroffeatherfall.light=羽のように軽くなったようだ！
items.potions.elixirs.elixiroffeatherfall.desc=この霊薬は弱い浮遊効果をもたらすが、より制御しやすくなっており、飲んだ者は少しの間、無傷で激しい高低差を落下することができる。
items.potions.elixirs.elixiroffeatherfall$featherbuff.name=天衣飛翔
items.potions.elixirs.elixiroffeatherfall$featherbuff.desc=あなたは天衣飛翔の霊薬の効果により、ダメージを受けることなく奈落に落下することができる！\n\n残り: %sターン

items.potions.elixirs.elixirofhoneyedhealing.name=甘露な治癒の霊薬
items.potions.elixirs.elixirofhoneyedhealing.desc=蜂蜜で甘味づけされた治癒の霊薬だ。飲み干すと治癒のポーションと同じ効果が得られ、空腹を少し満たすが、味方を回復させるために投げることもできる。\n\n蜂蜜が好きな生物にこのアイテムを使うとなだめることができるかもしれない。

items.potions.elixirs.elixiroficytouch.name=氷の触感の霊薬
items.potions.elixirs.elixiroficytouch.desc=霊薬を飲み干すと、攻撃した敵から熱を奪うようになる。冷気に対する耐性が付き、物理攻撃をした敵を凍えさせるだろう。

items.potions.elixirs.elixirofmight.name=力の霊薬
items.potions.elixirs.elixirofmight.msg=新たな力が全身を駆け巡り、あなたの筋力は%dになった！
items.potions.elixirs.elixirofmight.desc=この液体は筋肉を駆け巡り、あなたの筋力を1ポイント上昇させ、追加で一時的に最大体力が%dポイント上昇する。この補正は最大体力に比例するが、レベルが上がるにつれ徐々に少なくなるだろう。
items.potions.elixirs.elixirofmight$htboost.name=最大体力への補正
items.potions.elixirs.elixirofmight$htboost.desc=体が異常に強く、健康になっている。\n\nあなたの最大体力は長期間に渡り補正がかかるが、レベルが上がるにつれ、補正はだんだん消えていくだろう。\n\n現在の補正量: %d\n最大体力への補正が消えるまで: %d レベル

items.potions.elixirs.elixiroftoxicessence.name=毒素の霊薬
items.potions.elixirs.elixiroftoxicessence.desc=この霊薬を飲み干すと、毒性のエネルギーで満たされる。動くたびに毒ガスを撒き散らすようになり、その効果時間より少し長い間、毒ガスや毒に対する免疫が付くだろう。



###exotic potions
items.potions.exotic.exoticpotion.turquoise=奇抜な青緑のポーション
items.potions.exotic.exoticpotion.crimson=奇抜な紅のポーション
items.potions.exotic.exoticpotion.azure=奇抜な空色のポーション
items.potions.exotic.exoticpotion.jade=奇抜な翡翠のポーション
items.potions.exotic.exoticpotion.golden=奇抜な金のポーション
items.potions.exotic.exoticpotion.magenta=奇抜な赤紫のポーション
items.potions.exotic.exoticpotion.charcoal=奇抜な墨色のポーション
items.potions.exotic.exoticpotion.ivory=奇抜な象牙色のポーション
items.potions.exotic.exoticpotion.amber=奇抜な琥珀色のポーション
items.potions.exotic.exoticpotion.bistre=奇抜な黄褐色のポーション
items.potions.exotic.exoticpotion.indigo=奇抜な藍色のポーション
items.potions.exotic.exoticpotion.silver=奇抜な銀のポーション
items.potions.exotic.exoticpotion.unknown_desc=この円形のフラスコにはきめの粗い鮮やかな液体が入っている。見たことのない流体だ。飲んだり投げたりしたらどうなるのだろう？
items.potions.exotic.exoticpotion.warning=本当にこのポーションの使用を取り消しますか？取り消してもポーションは消費されます。
items.potions.exotic.exoticpotion.yes=このまま続ける
items.potions.exotic.exoticpotion.no=気が変わった
items.potions.exotic.exoticpotion.discover_hint=このアイテムは錬金術で作ることができる。

items.potions.exotic.potionofcleansing.name=消毒のポーション
items.potions.exotic.potionofcleansing.desc=この強力な試薬は、飲むと数ターンの間、すべての有害な状態異常を受けなくなる。また、対象者に投げつけて浄化することもできる。
items.potions.exotic.potionofcleansing$cleanse.name=浄化
items.potions.exotic.potionofcleansing$cleanse.desc=このキャラクターは、一時的に全ての有害な状態異常を受けなくなる！\n\n残り: %sターン

items.potions.exotic.potionofcorrosivegas.name=腐食ガスのポーション
items.potions.exotic.potionofcorrosivegas.desc=この加圧容器を開けたり割ったりすると、中身が噴出して腐食性の錆色のガスに変化するだろう。そのガスは毒ガスより速く拡散し、より致命的だが、長続きはしない。

items.potions.exotic.potionofdragonsbreath.name=竜の息吹のポーション
items.potions.exotic.potionofdragonsbreath.prompt=燃やす場所を選択
items.potions.exotic.potionofdragonsbreath.desc=このフラスコは、唾液と混ざると炎が吹き出す珍しい成分が入っている。すぐに吐き出すと口から炎を噴射できるようになるぞ！

items.potions.exotic.potionofearthenarmor.name=大地の鎧のポーション
items.potions.exotic.potionofearthenarmor.desc=この液体は、身体を麻痺させるのではなく皮膚を硬化させる作用を持ち、一時的な天然の鎧に変えるだろう。

items.potions.exotic.potionofdivineinspiration.name=天与の啓示のポーション
items.potions.exotic.potionofdivineinspiration.no_more_points=これ以上、ボーナス天賦ポイントを獲得することはできない。
items.potions.exotic.potionofdivineinspiration.select_tier=ボーナスポイント2点を獲得する天賦の段階を選択します。ポイントを使うには、その段階をロック解除している必要があります。
items.potions.exotic.potionofdivineinspiration.bonus=天賦ポイント+2！
items.potions.exotic.potionofdivineinspiration.desc=聖なるエネルギーの力を液体にしたもので、飲んだ者に天与の力を与え、選択された段階でのボーナス天賦ポイントを2ポイント付与する。\n\nこのポーションは、天賦の各段階につき1回のみ使用できる。

items.potions.exotic.potionofmagicalsight.name=千里眼のポーション
items.potions.exotic.potionofmagicalsight.desc=これを飲むと、感覚が一時的に信じられないほど鋭敏になり、半径12タイルの範囲を壁に遮られずに見通す事ができるようになる！

items.potions.exotic.potionofmastery.name=習得のポーション
items.potions.exotic.potionofmastery.prompt=習得するアイテム
items.potions.exotic.potionofmastery.weapon_easier=あなたの武器は使い易くなった
items.potions.exotic.potionofmastery.armor_easier=あなたの鎧は着易くなった
items.potions.exotic.potionofmastery.desc=このポーションは、直接筋力を与えるのではなく、使用者の筋肉を特定のアイテムに同調させる。これにより、飲んだ者はそのアイテムで練習し、筋肉が覚えたかのように、そのアイテムがより使いやすくなる。\n\n選択した武器や鎧の必要筋力を2ポイント軽減できる。このポーションは各アイテムに対して1回のみ使用可能だ。

items.potions.exotic.potionofshielding.name=盾のポーション
items.potions.exotic.potionofshielding.desc=このポーションを飲むと、治癒するかわりに体の周りに耐久力のあるシールドを出現させ、かなりの量のダメージから守るだろう。

items.potions.exotic.potionofshroudingfog.name=五里霧中のポーション
items.potions.exotic.potionofshroudingfog.desc=フラスコの中の液体は、空気に触れると濃い煙のような霧となり、すぐに拡散して敵の視界を遮る厚い霧となるだろう。

items.potions.exotic.potionofsnapfreeze.name=瞬間凍結のポーション
items.potions.exotic.potionofsnapfreeze.desc=このポーションに含まれる化学物質は空気と急速に反応し、効果範囲内のすべてのものを瞬時に凍結させ、束縛するだろう。

items.potions.exotic.potionofstamina.name=スタミナのポーション
items.potions.exotic.potionofstamina.desc=奇妙に甘いこの液体を飲むと、長い間エネルギーが体を満たし、長期間高速で動けるようになるだろう。

items.potions.exotic.potionofstormclouds.name=大嵐のポーション
items.potions.exotic.potionofstormclouds.desc=このポーションを投げると、すぐに拡散する凝集した蒸気が発生し、凝縮して周囲に流れ落ちる。ほとんどの地形は水に覆われ、炎を纏う敵はダメージを受け、火は消され、水没した罠は壊れてしまうだろう。



###quest items
items.quest.ceremonialcandle.name=儀式用の蝋燭
items.quest.ceremonialcandle.desc=使用されて溶け出し、互いに混ざり合っている蝋燭一式だ。\n\nこれだけでは何もできないが、他の蝋燭と一緒に正しい模様を描くと、召喚の儀式を行うエネルギーがそこに集中する。
items.quest.ceremonialcandle.discover_hint=このアイテムは特定のクエストで見つけることができる。

items.quest.corpsedust.name=死体の灰
items.quest.corpsedust.chill=背筋に悪寒が走った。
items.quest.corpsedust.desc=この塊は見た目は普通の灰と変わらないが、凶悪なエネルギーが中に潜んでいるようだ。\n\nできるだけ早く手放した方がいい。
items.quest.corpsedust.discover_hint=このアイテムは特定のクエストで見つけることができる。

items.quest.darkgold.name=幽金鉱石
items.quest.darkgold.you_now_have=現在、%d 個の幽金鉱石を持っている。
items.quest.darkgold.desc=この金属が「幽金」と呼ばれるのは色ではなく（通常の金と変わらない）、太陽の光で溶けてしまい、地上では使い物にならないからである。
items.quest.darkgold.discover_hint=このアイテムは特定のクエストで見つけることができる。

items.quest.dwarftoken.name=ドワーフのお守り
items.quest.dwarftoken.desc=大勢のドワーフとその大きな創造物の中には、用途不明の小さい金属片を持っているものもいる。装飾品や識別札の一種なのだろうか？本当にドワーフは奇妙な集団だ。
items.quest.dwarftoken.discover_hint=このアイテムは特定のクエストで見つけることができる。

items.quest.embers.name=炎の元素霊の燃えさし
items.quest.embers.desc=生まれたての炎の元素霊からしか採れない特別な燃えさしだ。温かいエネルギーを発している。
items.quest.embers.discover_hint=このアイテムは特定のクエストで見つけることができる。

items.quest.escapecrystal.name=脱出の結晶
items.quest.escapecrystal.ac_use=使用する
items.quest.escapecrystal.desc=薄い魔法の呪文結晶で、転移魔法が封じ込められているようだ。この結晶を使えばいつでもドワーフの宝物庫を離れることができるが、何も持ち出すことはできない！
items.quest.escapecrystal.discover_hint=このアイテムは特定のクエストで見つけることができる。

items.quest.gooblob.name=グゥの一部
items.quest.gooblob.desc=不安定なベトベトした塊だ。グゥは死んでもうこれに魂は入っていない。ゼリー状の球体に似ているが、食べることはできないだろう。\n\nこれだけでは役に立たないが、特定のポーションや爆弾と組み合わせることができるかもしれない。少なくとも、ちゃんとしたエネルギーに変換されるはず。
items.quest.gooblob.discover_hint=このアイテムは特定の敵からドロップで入手できる。

items.quest.metalshard.name=呪われた金属片
items.quest.metalshard.desc=DM-300が壊れる時に剥がれ落ちた、錆びている呪われた金属片。凶悪な魔法が内部に潜んでいるようだ。\n\nこれだけでは役に立たないが、特定の巻物や爆弾と組み合わせることができるかもしれない。少なくとも、ちゃんとしたエネルギーに変換されるはず。
items.quest.metalshard.discover_hint=このアイテムは特定の敵からドロップで入手できる。

items.quest.pickaxe.name=つるはし
items.quest.pickaxe.ability_name=貫通
items.quest.pickaxe.ability_desc=決闘者は、つるはしで敵を_貫通_させることができる。これは確実に命中し、3ターンの間脆弱状態にし、硬質な皮膚を持つ敵には _%1$dから%2$dのダメージ_ を与える。
items.quest.pickaxe.upgrade_ability_stat_name=武器能力ダメージ
items.quest.pickaxe.desc=岩を砕くために作られた頑丈で重い道具だ。装備しなくても採掘はできるが、いざというときには武器として装備することもできるだろう。
items.quest.pickaxe.discover_hint=このアイテムは特定のクエストで見つけることができる。

items.quest.ratskull.name=巨大鼠の頭蓋骨
items.quest.ratskull.desc=かなり大きな鼠の頭蓋骨だ。かけるところさえあれば、いい飾り物になりそうだ。



###remains
items.remains.remainsitem.ac_use=使用する
items.remains.remainsitem.discover_hint=このアイテムは、前回特定の勇士で死んだ後の勇士の遺体から見つけることができる。

items.remains.bowfragment.name=弓の木片
items.remains.bowfragment.desc=この割れた木片は、かつて失われた女猟師の精霊の弓の一部だった。木片にはまだ自然のエネルギーが少し残っている。この木片を使用すると、周りに高い草を生やすことができるが、木片は壊れてしまう。

items.remains.brokenhilt.name=折れた柄
items.remains.brokenhilt.desc=この折れた柄は、倒されてしまった決闘者の武器のようだ。柄にはまだ少し武力が残っており、この柄を使用すると次の2回まで近接攻撃の命中時に少しボーナスダメージを得ることができるが、柄は壊れてしまう。

items.remains.brokenstaff.name=折れた長杖
items.remains.brokenstaff.desc=この魔術師の折れた長杖は、持ち主が亡くなった後、真っ二つに折れてしまったようだ。長杖にはまだ魔法のエネルギーが残っており、使用すると他の杖の充填を少し増やすことができるが、折れた長杖は壊れてしまう。

items.remains.cloakscrap.name=布切れ
items.remains.cloakscrap.desc=この半透明の布切れは、盗賊亡き後の影の外套の一部のようだ。まだ少し神秘的なエネルギーが残っており、使用するとアーティファクトの充填を少し増やすことができるが、布切れは壊れてしまう。

items.remains.sealshard.name=印章の破片
items.remains.sealshard.desc=この赤い蝋の小さな破片は、倒れた戦士の印章の一部のようだ。印章の破片にはまだ少し意志の力が残っており、使用すると自分をシールドすることができるが、印章の破片は壊れてしまう。

items.remains.tornpage.name=破れたページ
items.remains.tornpage.desc=このページは息を引き取った聖職者の聖典から破り取られたもののようだ。まだ少し神聖なエネルギーが残っており、使用すると体力を少し回復させることができるが、ページは消滅してしまう。



###rings
items.rings.ring.diamond=ダイアモンドの指輪
items.rings.ring.opal=オパールの指輪
items.rings.ring.garnet=ガーネットの指輪
items.rings.ring.ruby=ルビーの指輪
items.rings.ring.amethyst=アメジストの指輪
items.rings.ring.topaz=トパーズの指輪
items.rings.ring.onyx=オニキスの指輪
items.rings.ring.tourmaline=トルマリンの指輪
items.rings.ring.emerald=エメラルドの指輪
items.rings.ring.sapphire=サファイアの指輪
items.rings.ring.quartz=水晶の指輪
items.rings.ring.agate=瑪瑙の指輪
items.rings.ring.equip_cursed=指輪は指を強く締め付けている！
items.rings.ring.unknown_desc=暗闇で輝く大きな宝石であしらわれた指輪だ。嵌めるとどうなるのだろうか？
items.rings.ring.known=これは%sだ。
items.rings.ring.identify=指輪に隅々まで精通し、識別できるようになった。
items.rings.ring.cursed_worn=指輪は呪われているため、外すことができない。
items.rings.ring.curse_known=この指輪の中には凶悪な魔力が潜んでいるようだ。
items.rings.ring.not_cursed=この指輪は害悪を及ぼす魔法がない。

items.rings.ringofaccuracy.name=正確の指輪
items.rings.ringofaccuracy.stats=この指輪をはめているときは、正確性が _%s%%_ 上昇する。
items.rings.ringofaccuracy.typical_stats=この指輪をはめているときは、通常、正確性が _%s%%_ 上昇する。
items.rings.ringofaccuracy.combined_stats=装備している指輪の力が融合し、正確性が合計で _%s%%_ 上昇する。
items.rings.ringofaccuracy.upgrade_stat_name_1=正確性上昇
items.rings.ringofaccuracy.desc=この指輪はあなたの集中力を増し、攻撃がより敵に当たりやすくなる。呪われていた場合は、攻撃が当たりづらくなるだろう。

items.rings.ringofarcana.name=秘儀の指輪
items.rings.ringofarcana.stats=この指輪をはめているときは、エンチャントと刻印の効力が _%s%%_ 増加する。
items.rings.ringofarcana.typical_stats=この指輪をはめているときは、通常、エンチャントと刻印の効力が _%s%%_ 増加する。
items.rings.ringofarcana.combined_stats=装備している指輪の力が融合し、エンチャントと刻印の効力が合計で _%s%%_ 上昇する。
items.rings.ringofarcana.upgrade_stat_name_1=秘儀効力上昇
items.rings.ringofarcana.desc=この指輪は着用者が装備している武器のエンチャントや鎧の刻印、呪いを強化する指輪だ。まず発動率が上がり、発動率が100%になると効果の強さが上がる。呪われていた場合は、逆にエンチャントや刻印、呪いを弱体化させるだろう。

items.rings.ringofelements.name=元素の指輪
items.rings.ringofelements.stats=この指輪をはめているときは、 _%s%%_ の属性抵抗を得る。
items.rings.ringofelements.typical_stats=この指輪をはめているときは、 通常、_%s%%_ の属性抵抗を得る。
items.rings.ringofelements.combined_stats=装備している指輪の力が融合し、合計で _%s%%_ の属性抵抗を得る。
items.rings.ringofelements.upgrade_stat_name_1=属性抵抗
items.rings.ringofelements.desc=この指輪は殆どの属性と魔法効果に対する抵抗力を与え、ダメージと持続期間が減少する。当然、呪われていた場合は、それらの効果を悪化させるだろう。

items.rings.ringofenergy.name=エネルギーの指輪
items.rings.ringofenergy.stats=この指輪をはめているときは、杖、アーティファクト、及び勇士の鎧が充填される速さが _%s%%_ 上昇する。
items.rings.ringofenergy.typical_stats=この指輪をはめているとき、大抵は、杖、アーティファクト、及び勇士の鎧が充填される速さが _%s%%_ 上昇する。
items.rings.ringofenergy.combined_stats=装備している指輪の力が融合し、充填速度が合計で _%s%%_ 上昇する。
items.rings.ringofenergy.upgrade_stat_name_1=充填速度上昇
items.rings.ringofenergy.desc=この指輪から放射される魔術的の領域内では、あなたの魔法の装備の充填がより早くなる。呪われた指輪では逆に充填が遅くなる。

items.rings.ringofevasion.name=回避の指輪
items.rings.ringofevasion.stats=この指輪をはめているときは、回避力が _%s%%_ 上昇する。
items.rings.ringofevasion.typical_stats=この指輪をはめているときは、通常、回避力が _%s%%_ 上昇する。
items.rings.ringofevasion.combined_stats=装備している指輪の力が融合し、回避力が合計で _%s%%_ 上昇する。
items.rings.ringofevasion.upgrade_stat_name_1=回避力上昇
items.rings.ringofevasion.desc=この指輪は着用者の反射神経を刺激し、攻撃を当てることが困難になる。呪われていた場合は、攻撃に当たりやすくなるだろう。

items.rings.ringofforce.name=力の指輪
items.rings.ringofforce.stats=この指輪は、武器を装備していない場合、あなたの現在の筋力に従って、 _%1$dから%2$dのダメージ_ を与える。武器を装備している場合、ダメージが _%3$d_ 増加する。
items.rings.ringofforce.typical_stats=この指輪は、通常、武器を装備していない場合、あなたの現在の筋力に従って、 _%1$dから%2$dのダメージ_ を与える。武器を装備している場合、ダメージが _%3$d_ 増加する。
items.rings.ringofforce.combined_stats=装備している指輪の力が融合し、武器を装備していない場合、合計で _%1$dから%2$dのダメージ_を与え、武器を装備している場合、ダメージが _%3$d_ 増加する。
items.rings.ringofforce.upgrade_stat_name_1=素手ダメージ
items.rings.ringofforce.upgrade_stat_name_2=武器ダメージ上昇
items.rings.ringofforce.upgrade_stat_name_3=武器能力ダメージ
items.rings.ringofforce.ability_name=喧嘩屋の構え
items.rings.ringofforce.typical_ability_desc=決闘者はこの指輪を装備することで、_喧嘩屋の構え_をとることができる。この構えをとっている間は、武器を装備していても通常攻撃はこの指輪を使うことになる。この構えによる攻撃は、通常、 _%1$dから%2$dのダメージ_ を与え、武器のエンチャントや補強状態が適用される。この構えでは、武器の充填速度は50%%遅くなる。
items.rings.ringofforce.ability_desc=決闘者はこの指輪を装備することで、_喧嘩屋の構え_をとることができる。この構えをとっている間は、武器を装備していても通常攻撃はこの指輪を使うことになる。この構えによる攻撃は、 _%1$dから%2$dのダメージ_ を与え、武器のエンチャントや補強状態が適用される。この構えでは、武器の充填速度は50%%遅くなる。
items.rings.ringofforce.desc=この指輪は着用者の打撃力を上げる。この効果は素手で敵を殴打した場合に発揮されるため、武器を使用した状態ではほぼ効果がない。呪われていた場合は、逆に着用者の打撃力を下げるだろう。
items.rings.ringofforce$brawlersstance.name=喧嘩屋の構え
items.rings.ringofforce$brawlersstance.desc=この構えは、武器を装備していても通常攻撃は装備中の力の指輪を使う。これらの攻撃はボーナスダメージを得るとともに、武器の補強状態やエンチャントが適用される。\n\nただし、この構えを維持するには集中力が必要であり、武器能力の充填速度が50%遅くなる。\n\nこの構えは、力の指輪を使うことでオン・オフを切り替えることができるが、素早く構えを発動したり解除したりすると、充填速度の低下は少しの間持続する。

items.rings.ringoffuror.name=激怒の指輪
items.rings.ringoffuror.stats=この指輪をはめているときは、攻撃速度が _%s%%_ 上昇する。
items.rings.ringoffuror.typical_stats=この指輪をはめているときは、通常、攻撃速度が _%s%%_ 上昇する。
items.rings.ringoffuror.combined_stats=装備している指輪の力が融合し、攻撃速度が合計で _%s%%_ 上昇する。
items.rings.ringoffuror.upgrade_stat_name_1=攻撃速度上昇
items.rings.ringoffuror.desc=この指輪は着用者に内なる怒りを与えることで、武器を振る速度が早くなる。呪われていた場合は、逆に攻撃速度が遅くなるだろう。

items.rings.ringofhaste.name=加速の指輪
items.rings.ringofhaste.stats=この指輪をはめているときは、移動速度が _%s%%_ 上昇する。
items.rings.ringofhaste.typical_stats=この指輪をはめているときは、通常、移動速度が _%s%%_ 上昇する。
items.rings.ringofhaste.combined_stats=装備している指輪の力が融合し、移動速度が合計で _%s%%_ 上昇する。
items.rings.ringofhaste.upgrade_stat_name_1=移動速度上昇
items.rings.ringofhaste.desc=この指輪は着用者が移動する際の負担を軽くし、超人的な速さで駆ける事を可能にする。呪われていた場合は、体が重くなり移動速度が減少するだろう。

items.rings.ringofmight.name=筋力の指輪
items.rings.ringofmight.stats=この指輪をはめているときは、筋力が _%1$d_ 上昇し、最大HPが _%2$s%%_ 上昇する。
items.rings.ringofmight.typical_stats=この指輪をはめているときは、通常、筋力が _%1$d_ 上昇し、最大HPが _%2$s%%_ 上昇する。
items.rings.ringofmight.combined_stats=装備している指輪の力が融合し、合計で筋力が _%1$d_ 上昇し、最大HPが _%2$s%%_ 上昇する。
items.rings.ringofmight.upgrade_stat_name_1=筋力上昇
items.rings.ringofmight.upgrade_stat_name_2=最大HP上昇
items.rings.ringofmight.desc=この指輪は着用者の身体能力を底上げし、筋力が増大する。呪われていた場合は、筋力が弱まるだろう。

items.rings.ringofsharpshooting.name=精密射撃の指輪
items.rings.ringofsharpshooting.stats=この指輪をはめているときは、投擲武器の強化値が _%1$d_ 上昇したかのようにダメージが増加し、投擲武器の耐久力が _%2$s%%_ 上昇する。
items.rings.ringofsharpshooting.typical_stats=この指輪をはめているときは、通常、投擲武器の強化値が _%1$d_ 上昇したかのようにダメージを増加し、投擲武器の耐久力を _%2$s%%_ 上昇する。
items.rings.ringofsharpshooting.combined_stats=装備している指輪の力が融合し、合計で投擲武器の強化値が _%1$d_ 上昇し、投擲武器の耐久力が _%2$s%%_ 上昇する。
items.rings.ringofsharpshooting.upgrade_stat_name_1=強化値ダメージ上昇
items.rings.ringofsharpshooting.upgrade_stat_name_2=耐久力上昇
items.rings.ringofsharpshooting.desc=この指輪は着用者の射撃精密性を向上し、全ての投擲武器のダメージを上げるとともに耐久力が増すようになる。呪われていた場合は、逆の効果になる。すなわち、ダメージが減少しより壊れやすくなるだろう。

items.rings.ringoftenacity.name=執念の指輪
items.rings.ringoftenacity.stats=この指輪をはめているときは、被ダメージを _%s%%_ 減少する。
items.rings.ringoftenacity.typical_stats=この指輪をはめているときは、通常、被ダメージを _%s%%_ 減少する。
items.rings.ringoftenacity.combined_stats=装備している指輪の力が融合し、被ダメージを合計で _%s%%_ 軽減する。
items.rings.ringoftenacity.upgrade_stat_name_1=最大被ダメージ減少
items.rings.ringoftenacity.desc=この指輪は死に至る通常攻撃に対して着用者が抵抗する力を授ける。傷が深ければ深いほど更なるダメージを軽減してくれる。呪われていた場合は、敵はより容易に着用者を殺すことができるだろう。

items.rings.ringofwealth.name=幸運の指輪
items.rings.ringofwealth.stats=この指輪をはめているときは、運気が _%s%%_ 上昇する。
items.rings.ringofwealth.typical_stats=この指輪をはめているときは、通常、運気が _%s%%_ 上昇する。
items.rings.ringofwealth.combined_stats=装備している指輪の力が融合し、運気が合計で _%s%%_ 上昇する。
items.rings.ringofwealth.upgrade_stat_name_1=運気上昇
items.rings.ringofwealth.desc=この指輪は宝を引き寄せる磁石のような働きをし、敵や容器が貴重なアイテムを持っている可能性を高める。呪われた指輪は、かえって戦利品を受け取る確率を下げてしまう。



###scrolls
items.scrolls.scroll.ac_read=詠唱する
items.scrolls.scroll.kaunan=のちなみちみの巻物
items.scrolls.scroll.sowilo=とらてにりらの巻物
items.scrolls.scroll.laguz=りちきなつの巻物
items.scrolls.scroll.yngvi=んみきひにの巻物
items.scrolls.scroll.gyfu=きんはなの巻物
items.scrolls.scroll.raido=すちにしらの巻物
items.scrolls.scroll.isaz=にとちつの巻物
items.scrolls.scroll.mannaz=もちみみちつの巻物
items.scrolls.scroll.naudiz=みちなしにつの巻物
items.scrolls.scroll.berkanan=こいすのちみちみの巻物
items.scrolls.scroll.odal=らしちりの巻物
items.scrolls.scroll.tiwaz=かにてちつの巻物
items.scrolls.scroll.unknown_desc=この羊皮紙には解読できない魔法文字が記されている。詠唱してみたら何が起こるのだろう？
items.scrolls.scroll.blinded=盲目の間は巻物を読むことができない。
items.scrolls.scroll.no_magic=魔法に対する耐性がある間は巻物を読むことができない。
items.scrolls.scroll.cursed=呪われた呪文書によって巻物の魔法の発動が阻害された！解呪の巻物があればうまくいくかもしれない…
items.scrolls.scroll$placeholder.name=巻物

items.scrolls.inventoryscroll.warning=本当にこの巻物の使用を取り消しますか？巻物は識別されていないので、取り消しても巻物は消費されます。
items.scrolls.inventoryscroll.yes=このまま続ける
items.scrolls.inventoryscroll.no=気が変わった

items.scrolls.scrollofidentify.name=識別の巻物
items.scrolls.scrollofidentify.inv_title=どれを識別する？
items.scrolls.scrollofidentify.it_is=アイテムが識別された: %s
items.scrolls.scrollofidentify.desc=この巻物は対象としたアイテムの詳細を明らかにする。

items.scrolls.scrolloflullaby.name=子守歌の巻物
items.scrolls.scrolloflullaby.sooth=巻物からは穏やかなメロディーが発せられている。強い眠気を感じる。
items.scrolls.scrolloflullaby.desc=この巻物を読むと流れ出す穏やかなメロディーは、聴くものすべてをなだめて深い魔法の眠りにつかせる。読み手と仲間が眠りに落ちると、体力が回復するだろう。

items.scrolls.scrollofmagicmapping.name=魔法の地図の巻物
items.scrolls.scrollofmagicmapping.layout=今やあなたはこの階層の構造について把握した。
items.scrolls.scrollofmagicmapping.desc=この巻物を読むと、今いる階層の正確な構造をあなたの記憶にはっきりと刻みつけ、罠や隠された扉をも露呈してくれるだろう。ただしアイテムや生き物の位置はわからない。

items.scrolls.scrollofmirrorimage.name=鏡像の巻物
items.scrolls.scrollofmirrorimage.copies=巻物はあなたの鏡像を形作った。
items.scrolls.scrollofmirrorimage.no_copies=巻物はあなたの鏡像を形作ろうとしたが、現れる場所がない。
items.scrolls.scrollofmirrorimage.desc=この巻物を読むと、読み手に酷似した二人の幻影が現れるだろう。鏡像はより弱い読み手の身代わりとして振る舞い、敵を追いかけるだろう。時間経過で消えることはないが、ダメージを受けると消滅してしまう。

items.scrolls.scrollofretribution.name=報復の巻物
items.scrolls.scrollofretribution.blast=巻物から強力な魔力が噴き出す！
items.scrolls.scrollofretribution.desc=この巻物を読むと、読み手の苦痛が破壊的なエネルギーとなり外部に向かって爆散する。読み手が弱まっているほど、より多くのダメージを与えるようになる。とても低い体力でこの巻物を読めば、大抵の敵は容易に殺すことができる。\n\n巻物を使用すると代償として盲目となり弱体化する。

items.scrolls.scrollofrage.name=激怒の巻物
items.scrolls.scrollofrage.roar=この巻物は聴いたものが激怒する轟音をダンジョン中に響き渡らせた！
items.scrolls.scrollofrage.desc=この巻物を大声で読むと、とてつもない轟音が放たれる。聴いたものは激怒して読み上げたものに向かってくるだろう。

items.scrolls.scrollofrecharging.name=充填の巻物
items.scrolls.scrollofrecharging.surge=エネルギーの奔流があなたの体をめぐり、杖を充填していく！
items.scrolls.scrollofrecharging.desc=この羊皮紙に封じ込められた純粋な魔力は、解放されると時間とともに詠唱者のすべての杖を充填するだろう。

items.scrolls.scrollofremovecurse.name=解呪の巻物
items.scrolls.scrollofremovecurse.inv_title=どれを解呪する？
items.scrolls.scrollofremovecurse.cleansed=あなたのアイテムは清らかな輝きに包まれ、凶悪なエネルギーが消え去った！
items.scrolls.scrollofremovecurse.not_cleansed=あなたのアイテムは清らかな輝きに包まれたが、それだけのようだ。
items.scrolls.scrollofremovecurse.spirit=あなたの巻物は苦痛の霊魂を呪いから解放した！
items.scrolls.scrollofremovecurse.desc=この巻物に込められた魔法は、選択した一つの武具・指輪・杖・アーティファクトにかけられた呪いを解くだろう。

items.scrolls.scrollofteleportation.name=転移の巻物
items.scrolls.scrollofteleportation.tele=一瞬の間に階層の別の場所に転移した。
items.scrolls.scrollofteleportation.no_tele=転移魔法は失敗した。
items.scrolls.scrollofteleportation.cant_reach=そこには転移できない。
items.scrolls.scrollofteleportation.prompt=転移する場所を選択
items.scrolls.scrollofteleportation.desc=羊皮紙に記された呪文を読み上げた者は、即座に同じ階層の別の場所に転移する。この巻物は読み手がまだ訪れていない場所を優先的に選ぶが、施錠された扉や障害物を越えて転移する場所を選ぶことはできない。しかし、隠された扉によって通じる新しい場所に転移する可能性がある。

items.scrolls.scrollofterror.name=恐怖の巻物
items.scrolls.scrollofterror.none=この巻物は強く赤い閃光を放った。
items.scrolls.scrollofterror.one=巻物から放たれた赤く鮮やかな閃光が%sを恐れおののかせた！
items.scrolls.scrollofterror.many=巻物から放たれた赤く鮮やかな閃光がモンスターを恐れおののかせた！
items.scrolls.scrollofterror.desc=読んだとき、この巻物は赤い閃光を発して、あなたの視界に居る全ての生物を照らし、恐怖に戦かせるだろう。恐れを抱いた生物は身を翻して一目散に逃げ出ていく。逃げ出す敵に攻撃を加えるとより短期間で効果が終わるようになるだろう。

items.scrolls.scrolloftransmutation.name=変成の巻物
items.scrolls.scrolloftransmutation.inv_title=どれを変化させる？
items.scrolls.scrolloftransmutation.nothing=何も起こらなかった。
items.scrolls.scrolloftransmutation.morph=アイテムはなにか別のものに変化した！
items.scrolls.scrolloftransmutation.desc=この巻物は強力な変成の魔法が込められている。適するアイテムに対して使用すると、同じタイプの別のアイテムに変化するだろう。この魔法は強化やエンチャント、刻印を保存したまま変化させる。巻物やポーションは、同等の奇抜なものに変化し、その逆も可能だ。

items.scrolls.scrollofupgrade.name=強化の巻物
items.scrolls.scrollofupgrade.inv_title=どれを強化する？
items.scrolls.scrollofupgrade.weaken_curse=強化の巻物はそのアイテムの呪いを弱めた。
items.scrolls.scrollofupgrade.remove_curse=強化の巻物はそのアイテムの呪いを浄化した！
items.scrolls.scrollofupgrade.desc=この巻物を読むと、1つのアイテムまたは1組の投擲武器を強化する。杖なら威力と最大充填量が上昇し、武器や鎧なら攻撃力や防御力が上昇し、投擲武器の束なら完全に修復され耐久性が上昇し、指輪ならその効果がより強まるだろう。\n\n解呪の巻物ほど強力ではないが、呪いを弱めたり、時には完全に呪いを消すこともできる。残念なことに、強化の魔法は強化値が高い装備のエンチャントや刻印を消してしまうことがある。



###exotic scrolls
items.scrolls.exotic.exoticscroll.kaunan=奇抜なのちなみちみの巻物
items.scrolls.exotic.exoticscroll.sowilo=奇抜なとらてにりらの巻物
items.scrolls.exotic.exoticscroll.laguz=奇抜なりちきなつの巻物
items.scrolls.exotic.exoticscroll.yngvi=奇抜なんみきひにの巻物
items.scrolls.exotic.exoticscroll.gyfu=奇抜なきんはなの巻物
items.scrolls.exotic.exoticscroll.raido=奇抜なすちにしらの巻物
items.scrolls.exotic.exoticscroll.isaz=奇抜なにとちつの巻物
items.scrolls.exotic.exoticscroll.mannaz=奇抜なもちみみちつの巻物
items.scrolls.exotic.exoticscroll.naudiz=奇抜なみちなしにつの巻物
items.scrolls.exotic.exoticscroll.berkanan=奇抜なこいすのちみちみの巻物
items.scrolls.exotic.exoticscroll.odal=奇抜ならしちりの巻物
items.scrolls.exotic.exoticscroll.tiwaz=奇抜なかにてちつの巻物
items.scrolls.exotic.exoticscroll.unknown_desc=この黒い羊皮紙には解読できない輝く魔法文字が記されている。見たことのない文字だ。詠唱してみたら何が起こるのだろう？
items.scrolls.exotic.exoticscroll.discover_hint=このアイテムは錬金術で作ることができる。

items.scrolls.exotic.scrollofsirenssong.name=セイレーンの歌の巻物
items.scrolls.exotic.scrollofsirenssong.prompt=対象を選択
items.scrolls.exotic.scrollofsirenssong.no_target=この巻物は対象を指定せずに発動します。
items.scrolls.exotic.scrollofsirenssong.cancel=対象を指定する必要があります。
items.scrolls.exotic.scrollofsirenssong.desc=この巻物を読むと、魅力的な旋律を発し、対象にした敵を虜にし、永久に味方にする！それを聞いた他の敵も、一時的に魅了される。\n\n特定の強い敵は、虜の効果に抵抗し、その代わりに魅了されてしまう。
items.scrolls.exotic.scrollofsirenssong$enthralled.name=心奪
items.scrolls.exotic.scrollofsirenssong$enthralled.desc=この生物は、セイレーンの歌の巻物の魔法に魅了されてしまった。\n\n魅了されたキャラクターは一生あなたの味方となり、遭遇した敵と戦ってくれるだろう。

items.scrolls.exotic.scrollofantimagic.name=反魔法の巻物
items.scrolls.exotic.scrollofantimagic.desc=この巻物に書かれている呪文は、あなたを魔法のオーラで包み込み、有害・有益に関係なく、あらゆる魔法の効果を一時的に遮断する。これは、杖、巻物、指輪、アーティファクト、エンチャント、呪いなど、ほとんどの魔法アイテムの効果が含まれる。ただし、勇士の鎧の能力はこのオーラに関係なく機能するほど強力である。

items.scrolls.exotic.scrollofchallenge.name=挑戦の巻物
items.scrolls.exotic.scrollofchallenge.desc=この巻物を大声で読むと、大咆哮を放ち、敵を引き寄せると同時に、周囲に小さな闘技場を作る。\n\nこの闘技場にいる限り、すべての源から受けるダメージが33％減少し（これは他のダメージ減少の前に適用される）、満腹感が失われることはない。\n\n闘技場の大きさは、読者がいる地域の大きさに比例する。一部のボス地域では特に小さくなる。
items.scrolls.exotic.scrollofchallenge$challengearena.name=挑戦闘技場
items.scrolls.exotic.scrollofchallenge$challengearena.desc=あなたの周囲に赤い霧が立ち込める魔法の闘技場が作られた。\n\n霧の中に立っている間、空腹は進行せず、全てのダメージ源からのダメージが33%%軽減される。あなたが他のダメージ軽減手段（鎧など）を持っている場合、それらは33%%の軽減の後に適用される。\n\n残り: %dターン

items.scrolls.exotic.scrollofdivination.name=占術の巻物
items.scrolls.exotic.scrollofdivination.nothing_left=識別すべきアイテムはもう残っていない！
items.scrolls.exotic.scrollofdivination.desc=この巻物は4種類の未識別のアイテムをランダムに識別する。識別される可能性のあるアイテムはポーションと巻物、そして指輪だ。識別されるアイテムは必ずしも持っているアイテムだけとは限らない。
items.scrolls.exotic.scrollofdivination$wnddivination.desc=占術の巻物は以下のアイテムを識別した：

items.scrolls.exotic.scrollofdread.name=畏怖の巻物
items.scrolls.exotic.scrollofdread.desc=この巻物を読むと、視界内の全ての敵に途方もない恐怖を植え付ける、赤い光の閃光を放出する。あまりに強烈なこの効果に、敵はすぐさまダンジョンから逃げようとし、二度と姿を現すことはないだろう！\n\n恐怖と同じように、この効果は時間経過や敵の攻撃で消滅することがある。\n\nボスのような強い意志を持つ敵には、代わりに通常の恐怖を負わせる。

items.scrolls.exotic.scrollofenchantment.name=エンチャントの巻物
items.scrolls.exotic.scrollofenchantment.inv_title=どれに付与する？
items.scrolls.exotic.scrollofenchantment.weapon=武器に付与するエンチャントを選んでください。
items.scrolls.exotic.scrollofenchantment.armor=鎧に刻む刻印を選んでください。
items.scrolls.exotic.scrollofenchantment.cancel=取り消す
items.scrolls.exotic.scrollofenchantment.cancel_warn=取り消してもエンチャントの巻物は消費されます。本当によろしいですか？
items.scrolls.exotic.scrollofenchantment.cancel_warn_yes=本当に実行する
items.scrolls.exotic.scrollofenchantment.cancel_warn_no=気が変わった
items.scrolls.exotic.scrollofenchantment.desc=この巻物は武器か鎧を強力な魔法の力で満たすだろう。読み手はどんな魔法が込められるかについてある程度制御できる。

items.scrolls.exotic.scrollofforesight.name=予見の巻物
items.scrolls.exotic.scrollofforesight.desc=この巻物を読むと、近くの地形の詳細が常に鮮明に頭に浮かぶようになる。この効果はかなりの時間続き、隠された扉や罠をすべて露呈させ、探索を不要にする。

items.scrolls.exotic.scrollofmetamorphosis.name=変容の巻物
items.scrolls.exotic.scrollofmetamorphosis.choose_desc=変容させる天賦を選択
items.scrolls.exotic.scrollofmetamorphosis.replace_desc=変容した天賦と入れ換える新しい天賦を選択してください。
items.scrolls.exotic.scrollofmetamorphosis.cancel_warn=取り消しても変容の巻物は消費されます。本当によろしいですか？
items.scrolls.exotic.scrollofmetamorphosis.metamorphose_talent=天賦変容
items.scrolls.exotic.scrollofmetamorphosis.desc=この巻物には強力な変異魔法が含まれており、アイテムではなく読み手に適用される。この巻物の魔法は、天賦を1つ選び、それを異なる勇士の同じ段階の5つの天賦の内の1つに置き換えることができる。\n\nこの効果はクラスの天賦にのみ適用され、サブクラスや鎧の能力から得た天賦には適用されない。使用できない天賦は選択肢として与えられない。

items.scrolls.exotic.scrollofmysticalenergy.name=神秘的なエネルギーの巻物
items.scrolls.exotic.scrollofmysticalenergy.desc=この羊皮紙に封鎖されている魔力が解放されたとき、装備しているアーティファクトは時間と共に充填されていくだろう。

items.scrolls.exotic.scrollofpassage.name=通路の巻物
items.scrolls.exotic.scrollofpassage.desc=この羊皮紙に書かれている呪文を読むと、読み手はもっとも近い地域の最初のフロアに転移するだろう。店に入りたい時は非常に便利だ。

items.scrolls.exotic.scrollofprismaticimage.name=虹色の像の巻物
items.scrolls.exotic.scrollofprismaticimage.desc=この巻物を読むと、読み手に酷似した二人の色彩豊かな幻影が現れるだろう。虹色の像は読み手と同じ防御力を持つが、HPと攻撃力は低くなり、身代わりとして振る舞う。\n\n敵が現れると虹色の像は実体化し、読み手を守ろうとする。\n\n既に虹色の像が存在している場合、像のHPが完全に回復するだろう。

items.scrolls.exotic.scrollofpsionicblast.name=精神衝撃の巻物
items.scrolls.exotic.scrollofpsionicblast.ondeath=衝撃はあなたの精神をばらばらに引き裂いた…
items.scrolls.exotic.scrollofpsionicblast.desc=この巻物に満ちる凄まじく破壊的なエネルギーは、目に見えるすべての生物の精神を破壊する。\n\nこれは強い後遺症を残し、読み手もダメージを受け、盲目になり弱体化する。巻物による攻撃が当たれば当たるほど、自傷ダメージは少なくなる。



###spells
items.spells.alchemize.name=錬金
items.spells.alchemize.prompt=アイテムを錬金する
items.spells.alchemize.desc=この呪文には錬金鍋にあるような変成の力が含まれている。1回唱えるたびに、アイテム（またはアイテムの束）を金や錬金エネルギーに変換することができる。ポーションや巻物をエネルギーに変換するとそれらは識別される！\n\n呪文は店で少量売られているが、種とルーンストーン、そして少しの錬金エネルギーを組み合わせれば、錬金術でより多く作ることもできる。
items.spells.alchemize$wndalchemizeitem.sell=%dgに変える
items.spells.alchemize$wndalchemizeitem.sell_1=1個を%dgに変える
items.spells.alchemize$wndalchemizeitem.sell_all=全てを%dgに変える
items.spells.alchemize$wndalchemizeitem.energize=%dエネルギーに変える
items.spells.alchemize$wndalchemizeitem.energize_1=1個を%dエネルギーに変える
items.spells.alchemize$wndalchemizeitem.energize_all=全てを%dエネルギーに変える

items.spells.beaconofreturning.name=帰還標識
items.spells.beaconofreturning.preventing=帰還標識を使ってここから戻ろうとしたが、強力な魔法のオーラに阻害された！
items.spells.beaconofreturning.creatures=帰還標識を使ってここから戻ろうとしたが、周囲の生物の超常的なオーラに阻害された。
items.spells.beaconofreturning.set=標識に現在地を設定した。
items.spells.beaconofreturning.wnd_body=標識に設定されていた場所はこの場所に上書きされます。\n\n帰還するときは最後に設定した場所に帰還し、呪文を一個消費します。
items.spells.beaconofreturning.wnd_set=設定
items.spells.beaconofreturning.wnd_return=帰還
items.spells.beaconofreturning.desc_set=この標識は%d階のどこかに設定されている。
items.spells.beaconofreturning.desc=この複雑な呪文はその距離にかかわらず、使用者を設定した場所に帰還させることができる。帰還したときしかこの呪文は消費されないので、自分の好きな場所を設定することができるが、最後に設定した場所しか有効にならない。

items.spells.curseinfusion.name=呪詛注入
items.spells.curseinfusion.inv_title=どれを呪う？
items.spells.curseinfusion.desc=この呪文はDM-300に内在していた凶悪な魔法と同じ種類の魔法を装備に注入する。アイテムに使用すると直ちに呪われ、エンチャントや刻印は上書きされるだろう。\n\n武器、鎧、杖の場合は、呪われる際に同時に強化を得る。これによる強化は重複せず、解呪されると強化も解除される。\n\n複数の呪いを注入することで、武器や鎧の呪いを変えることもできる。

items.spells.spell.ac_cast=唱える
items.spells.spell.no_magic=魔法に対する耐性がある間は呪文を唱えることができない。
items.spells.spell.discover_hint=このアイテムは錬金術で作ることができる。

items.spells.magicalinfusion.name=魔力注入
items.spells.magicalinfusion.inv_title=どれに注入する？
items.spells.magicalinfusion.infuse=あなたのアイテムに秘儀のエネルギーが浸透した！
items.spells.magicalinfusion.desc=この呪文は強化の巻物と同じ力を秘めているが、より安定している。\n\n通常通りアイテムを強化するのに加え、エンチャントや刻印、呪いを消去してしまうことがない。

items.spells.magicalporter.name=物質転送
items.spells.magicalporter.inv_title=どれを転送する？
items.spells.magicalporter.nowhere=アイテムの転送先がありません。
items.spells.magicalporter.desc=この呪文は対象にしたアイテムを転送する。商人の標識とは違い、転送したアイテムは次のボスの階の入り口に転送される。

items.spells.phaseshift.name=位相変化
items.spells.phaseshift.no_target=そこにはテレポートするものがない。
items.spells.phaseshift.desc=この混沌とした呪文は生物を現在の階のランダムな場所に転移させ、かなりの時間硬直させる。強力な敵は硬直効果に耐えることができるだろう。好きな対象に向けて使用でき、自分に向けて使用することもできる。

items.spells.reclaimtrap.name=罠回収
items.spells.reclaimtrap.no_trap=そこには罠がない。
items.spells.reclaimtrap.desc_trap=この呪文は現在、_%s_を発動する準備ができているようだ。
items.spells.reclaimtrap.desc=この呪文にはDM-300の機械的なエネルギーの残滓が含まれている。稼働中の罠に対して使用すると、罠の力を吸収する事ができ、再び呪文を使うことでこの力を解放し、好きな場所に罠の効果を発動できる。\n\nただし、発動場所によっては機能しない罠もあり、一度に保持できる罠は1つだけである。

items.spells.recycle.name=資源再生
items.spells.recycle.inv_title=どれを再生成する？
items.spells.recycle.recycled=アイテムは%sとして再生成された。
items.spells.recycle.desc=この呪文は効力が抑えられた変成魔法が含まれている。装備には使えないが、巻物、ポーション、ルーンストーン、塗布された投矢が同じタイプのランダムなアイテムに変化するだろう。

items.spells.summonelemental.name=元素霊召喚
items.spells.summonelemental.ac_imbue=魔力を込める
items.spells.summonelemental.imbue_prompt=適用する媒体を選択
items.spells.summonelemental.desc=この呪文は、元素霊の燃えさしのエネルギーで霊界に接続し、友好的な元素霊を召喚し、一緒に戦わせることができる。一度に召喚できる元素霊は1体だけだが、この呪文を唱えなおせば、代価なしに元素霊を自分の元に戻すことができる。
items.spells.summonelemental.desc_newborn=この呪文は現在浸透しておらず、範囲攻撃を持たない_生まれたての炎の元素霊_を召喚する。この呪文の力を強化するために、識別された炎のポーション、凍結のポーション、充填の巻物、変成の巻物のいずれかを浸透させると、以降は完全な力の元素霊を召喚することができる！
items.spells.summonelemental.desc_fire=この呪文は現在、触ると熱く、_炎の元素霊_ を召喚する。別のアイテムを浸透させることもできるが、呪文は現在の効果を失う。
items.spells.summonelemental.desc_frost=この呪文は現在、触ると冷たく、_霜の元素霊_ を召喚する。別のアイテムを浸透させることもできるが、呪文は現在の効果を失う。
items.spells.summonelemental.desc_shock=この呪文は現在、静電気を帯びており、_電撃の元素霊_ を召喚する。別のアイテムを浸透させることもできるが、呪文は現在の効果を失う。
items.spells.summonelemental.desc_chaos=この呪文は現在、混沌の力を放射しており、_混沌の元素霊_ を召喚する。別のアイテムを浸透させることもできるが、呪文は現在の効果を失う。

items.spells.targetedspell.prompt=対象を選択
items.spells.targetedspell.inv_title=どれに注入する？

items.spells.telekineticgrab.name=念動掌握
items.spells.telekineticgrab.cant_grab=それを掴むことはできない。
items.spells.telekineticgrab.no_target=そこには掴むものがない。
items.spells.telekineticgrab.desc=この呪文を使うと、その場にある全てのアイテムや、敵に突き刺さったすべての投擲武器などを遠隔で掴むことができるようになる。\n\nただし、他人が持っている物や、宝箱などの容器を掴むことはできない。

items.spells.unstablespell.name=不定呪文
items.spells.unstablespell.desc=この小さな黒い立方体の結晶の表面には、ルーン文字が描かれている。\n\nこの結晶を発動するとランダムな巻物の効果が発動する。巻物の効果は、視界に敵がいる場合、戦闘に特化した効果が必ず選ばれ、そうでない場合は戦闘向けでない効果が必ず選ばれる。

items.spells.wildenergy.name=自然エネルギー
items.spells.wildenergy.desc=この呪文はDM-300から得られた呪われたエネルギーが含まれている。唱えると杖と装備しているアーティファクトが再充填されるようになり、同時に呪われた杖の効果が起動するようになるだろう。だが、呪われた杖の効果を放つ場所はあなたが指定できる。


###runestones
items.stones.inventorystone.ac_use=使用する

items.stones.runestone$placeholder.name=ルーンストーン
items.stones.runestone.discover_hint=このアイテムはダンジョン内でランダムに見つかるか、錬金術で作ることができる。

items.stones.stoneofaggression.name=攻勢の石
items.stones.stoneofaggression.desc=この石を味方や敵に投げつけると、近くにいる全ての敵がそのキャラクターを短時間攻撃するようになる。\n\nただし、ボスはこの効果に抵抗することができ、効果時間が大幅に短縮され、その手下の攻撃によるダメージも軽減される。
items.stones.stoneofaggression$aggression.name=標的
items.stones.stoneofaggression$aggression.desc=操りの魔法により、近くにいるすべての敵がこのキャラクターを攻撃するようになる。\n\n残り: %sターン

items.stones.stoneofaugmentation.name=補強の石
items.stones.stoneofaugmentation.inv_title=どれを補強する？
items.stones.stoneofaugmentation.desc=このルーンストーンは、装備品による補正を補強する強力な魔法が込められているが、補強されない方の補正が下がってしまう。\n\n武器に対して使用すると、攻撃速度かダメージ量のどちらかを補強することができる。投擲武器の場合は、その速度に応じて耐久性が上昇または低下する。\n\n鎧に対して使用すると、防御力か回避力のどちらかを補強することができる。
items.stones.stoneofaugmentation.discover_hint=このアイテムは店で買うか、錬金術で作ることができる。
items.stones.stoneofaugmentation$wndaugment.choice=どちらを強化しますか？
items.stones.stoneofaugmentation$wndaugment.speed=速度
items.stones.stoneofaugmentation$wndaugment.damage=ダメージ
items.stones.stoneofaugmentation$wndaugment.evasion=回避
items.stones.stoneofaugmentation$wndaugment.defense=防御
items.stones.stoneofaugmentation$wndaugment.none=補強を取り除く
items.stones.stoneofaugmentation$wndaugment.cancel=そのままにする

items.stones.stoneofblast.name=衝撃の石
items.stones.stoneofblast.desc=このルーンストーンを投げるとたちまち爆発する。爆弾に似ており、周囲に居る生物にダメージを与えるだろう。

items.stones.stoneofblink.name=瞬転の石
items.stones.stoneofblink.desc=このルーンストーンを投げると、着地点に転移するだろう。

items.stones.stoneofclairvoyance.name=透視の石
items.stones.stoneofclairvoyance.desc=この石を投げると、着地点から非常に広範囲のマスの詳細を露呈するだろう。この効果は壁を貫通する。

items.stones.stoneofdeepsleep.name=熟睡の石
items.stones.stoneofdeepsleep.desc=この石を敵に投げると、深い魔法の眠りの状態にするだろう。魔法の眠りに落ちている敵は邪魔されるまで起きることがない。

items.stones.stoneofdetectmagic.name=感魔の石
items.stones.stoneofdetectmagic.inv_title=感知するアイテムを選択
items.stones.stoneofdetectmagic.detected_none=このアイテムに影響を与える魔法は感知されない。
items.stones.stoneofdetectmagic.detected_both=このアイテムに影響を与える好意と悪意の両方の魔法を感知した！
items.stones.stoneofdetectmagic.detected_good=このアイテムに影響を与える好意の魔法を感知した！
items.stones.stoneofdetectmagic.detected_bad=このアイテムに影響を与える悪意の魔法を感知した！
items.stones.stoneofdetectmagic.desc=このルーンストーンは、アイテムに影響を及ぼしている魔法を感知することができる。未識別のアイテムにこの石を使用すると、それが悪意のある呪いの影響を受けているかどうか、またはエンチャントや強化のような好意の魔法の影響を受けているかどうかがわかる。

items.stones.stoneofdisarming.name=解除の石
items.stones.stoneofdisarming.desc=このルーンストーンはダンジョンの中にある有害な罠を解除する魔法を秘めている。投げられた場所の周囲にある罠を9個まで解除できるだろう。

items.stones.stoneofenchantment.name=エンチャントの石
items.stones.stoneofenchantment.inv_title=どれに付与する？
items.stones.stoneofenchantment.weapon=あなたの武器は暗闇で光り輝いた！
items.stones.stoneofenchantment.armor=あなたの鎧は暗闇で光り輝いた！
items.stones.stoneofenchantment.desc=このルーンストーンはエンチャントの魔法が込められている。強化の巻物と異なりアイテムの力は直接増加せず、かわりに武器や鎧にエンチャントの魔法を付与し、新たな力を授ける。

items.stones.stoneoffear.name=恐怖の石
items.stones.stoneoffear.desc=この石をキャラクターに投げつけると、そのキャラクターは恐怖に圧倒され、振り向いて逃げ出す。逃げているキャラクターを攻撃すると、その効果は短くなる。

items.stones.stoneofflock.name=一群の石
items.stones.stoneofflock.desc=このルーンストーンは着地点の周囲に少しの間魔法の羊を召喚するだろう。

items.stones.stoneofintuition.name=直感の石
items.stones.stoneofintuition.inv_title=アイテムを選択
items.stones.stoneofintuition.desc=このルーンストーンは識別の巻物の魔法が弱められて込められている。直接アイテムを識別するのではなく、あなたの直感に働きかけ、ポーションや巻物、指輪の種類を推測して識別することができる。
items.stones.stoneofintuition.break_info=直感の石は1個壊れるまで2回使うことができ、_次の使用は石を消費しない。_
items.stones.stoneofintuition.break_warn=以前に直感の石を使用したので、_次の使用は石を消費する。_
items.stones.stoneofintuition$wndguess.text=識別されていないアイテムの種類を推測してください。もし正しければ、その種類が識別されるでしょう！
items.stones.stoneofintuition$wndguess.correct=正解だ。このアイテムの種類は識別された！
items.stones.stoneofintuition$wndguess.incorrect=あなたの推測は間違っていた。
items.stones.stoneofintuition$wndguess.break=直感の石は粉々に砕け散った…

items.stones.stoneofshock.name=電撃の石
items.stones.stoneofshock.desc=このルーンストーンは対象の周囲の生物を硬直させる電気エネルギーを解き放ち、当たった対象に応じて投げた者の杖を充填する。


###trinkets
items.trinkets.chaoticcenser.name=混沌の香炉
items.trinkets.chaoticcenser.spew=香炉は次のものを噴出しようとしている: %s
items.trinkets.chaoticcenser.desc=錬金鍋に入れてしばらくすると、この香炉は自ら煙を出しているように見える！これらの煙が蓄積され、半不規則な間隔で敵に向かって噴き出す。あらゆる種類のガスを発生させることができるようだが、香炉が作動する直前に一瞬の警告を行う。
items.trinkets.chaoticcenser.typical_stats_desc=通常、この装身具はおよそ _%d_ ターンごとに有害なガスを発生させる。ガスは敵がいるときのみ発生する。強化値が高くなると、これらのガスは奇抜で強力なものになる。
items.trinkets.chaoticcenser.stats_desc=現在の強化値では、この装身具はおよそ _%d_ ターンごとに有害なガスを発生させる。ガスは敵がいるときのみ発生する。強化値が高くなると、これらのガスは奇抜で強力なものになる。

items.trinkets.crackedspyglass.name=割れた小型望遠鏡
items.trinkets.crackedspyglass.desc=この手持ち望遠鏡は、前面レンズにひびが入っていなければ、精巧で精密な職人技の結晶と言えるだろう。この望遠鏡はダンジョン内の新たなアイテムを映し出すことであなたを手助けしているようだが、その欠陥のせいで映し出されたアイテムはなかなか見えづらい！
items.trinkets.crackedspyglass.typical_stats_desc=通常、この装身具はボスが居ない階で追加の隠しアイテムを _%1$s%%の確率_ で生成する。
items.trinkets.crackedspyglass.stats_desc=現在の強化値では、この装身具はボスが居ない階で追加の隠しアイテムを _%1$s%%の確率_ で生成する。
items.trinkets.crackedspyglass.stats_desc_upgraded=現在の強化値では、この装身具はボスが居ない階で追加の隠しアイテムを _100%%の確率_ で生成し、さらに _%1$s%%の確率_ で2つ目の追加の隠しアイテムを生成する。

items.trinkets.dimensionalsundial.name=次元の日時計
items.trinkets.dimensionalsundial.warning=日時計が影を映し出していないことに不安を感じる。
items.trinkets.dimensionalsundial.desc=この携帯型の日時計は、なぜかダンジョンの奥深くでも影を映し出すことができる。さらに不思議なことに、影の位置はこの世界の太陽とは無関係のようだ。影がないとき、日時計は危険を呼び寄せるようだ。
items.trinkets.dimensionalsundial.typical_stats_desc=通常、この装身具は現実の昼間（午前8時～午後8時）は敵の出現率を _%1$d%%_ 減少し、夜間（午後8時～午前8時）は敵の出現率を _%2$d%%_ 増加させる。
items.trinkets.dimensionalsundial.stats_desc=現在の強化値では、この装身具は現実の昼間（午前8時～午後8時）は敵の出現率を _%1$d%%_ 減少し、夜間（午後8時～午前8時）は敵の出現率を _%2$d%%_ 増加させる。

items.trinkets.exoticcrystals.name=奇抜な結晶
items.trinkets.exoticcrystals.desc=この小さなピンク色の結晶は、錬金術のエネルギーの結晶と同じ形をしている。直接エネルギーとして使うことはできないが、発見したポーションや巻物に何らかの影響を与えているようだ。
items.trinkets.exoticcrystals.typical_stats_desc=通常、この装身具はポーションや巻物のドロップの _%s%%_ を奇抜な同等品に置き換える。これは筋力のポーション、強化の巻物、仕掛けがある部屋を攻略するために生成されるアイテムには影響しない。
items.trinkets.exoticcrystals.stats_desc=現在の強化値では、この装身具はポーションや巻物のドロップの _%s%%_ を奇抜な同等品に置き換える。これは筋力のポーション、強化の巻物、仕掛けがある部屋を攻略するために生成されるアイテムには影響しない。

items.trinkets.eyeofnewt.name=イモリの眼
items.trinkets.eyeofnewt.desc=この黄金色と黒色のイモリの眼は一般的な材料で、現在は装身具として強化されている。この眼は、他の方法でものを見ることができる代わりに、視力を低下させているようだ。
items.trinkets.eyeofnewt.typical_stats_desc=通常、この装身具は視界が _%1$s%%_ 狭まるが、_%2$d_ タイル以内の敵を発見することができる。
items.trinkets.eyeofnewt.stats_desc=現在の強化値では、この装身具は視界が _%1$s%%_ 狭まるが、_%2$d_ タイル以内の敵を発見することができる。

items.trinkets.ferrettuft.name=フェレットの毛束
items.trinkets.ferrettuft.desc=絹のような白いフェレットの毛束を、ライムグリーンのリボンでつないだものだ。フェレットは俊敏で、いたずら好きで、やんちゃなことで知られている。そのパワーの一部は、この装身具から放たれているようで、近くにいるものの回避能力を高めている。
items.trinkets.ferrettuft.typical_stats_desc=通常、この装身具は全てのキャラクターの回避力を _%1$s%%_ 上昇させる。
items.trinkets.ferrettuft.stats_desc=現在の強化値では、この装身具は全てのキャラクターの回避力を _%1$s%%_ 上昇させる。

items.trinkets.mimictooth.name=ミミックの牙
items.trinkets.mimictooth.desc=この大きな鋭い牙は、とても不幸なミミックから抜かれたに違いない。ダンジョンのミミックたちに影響を与え、より多く、より危険な存在にしているようだ。
items.trinkets.mimictooth.typical_stats_desc=通常、この装身具はあらゆる種類のミミックの出現率を _%1$s倍_ にし、ミミックの発見をより困難にするが、彼らがドロップする戦利品の量も増える。また、ダンジョンの各階に _%2$s%%_ の確率で気付きにくい黒檀のミミックを出現させる。
items.trinkets.mimictooth.stats_desc=現在の強化値では、この装身具はあらゆる種類のミミックの出現率を _%1$s倍_ にし、ミミックの発見をより困難にするが、彼らがドロップする戦利品の量も増える。また、ダンジョンの各階に _%2$s%%_ の確率で気付きにくい黒檀のミミックを出現させる。

items.trinkets.mossyclump.name=苔の塊
items.trinkets.mossyclump.desc=この湿った苔の塊は、どれだけ強く握りしめても水分を保っているようだ。ダンジョンそのものと魔法的に結びついているようで、草や水が出現しやすくなる。
items.trinkets.mossyclump.typical_stats_desc=通常、この装身具は特徴のない階を _%d%%_ の確率で水または草で満たすようにする。\n\nこの装身具を強化するにはより多くの錬金エネルギーが必要だ。
items.trinkets.mossyclump.stats_desc=現在の強化値では、この装身具は特徴のない階を _%d%%_ の確率で水または草で満たすようにする。\n\nこの装身具を強化するにはより多くの錬金エネルギーが必要だ。

items.trinkets.parchmentscrap.name=羊皮紙の断片
items.trinkets.parchmentscrap.desc=この羊皮紙の断片は、まるで巻物のようだ。魔力の一部を残しており、ダンジョンで見つけた武器や鎧に影響を与えているようだ。
items.trinkets.parchmentscrap.typical_stats_desc=通常、この装身具はエンチャントと刻印が付く確率を通常の _%d倍_ にし、武器や鎧に呪いが付く確率を通常の _%s倍_ にする。杖、指輪、アーティファクトの呪いは影響を受けない。\n\nこの装身具を強化するにはより多くの錬金エネルギーが必要だ。
items.trinkets.parchmentscrap.stats_desc=現在の強化値では、この装身具はエンチャントと刻印が付く確率を通常の _%d倍_ にし、武器や鎧に呪いが付く確率を通常の _%s倍_ にする。杖、指輪、アーティファクトの呪いは影響を受けない。\n\nこの装身具を強化するにはより多くの錬金エネルギーが必要だ。

items.trinkets.petrifiedseed.name=種の化石
items.trinkets.petrifiedseed.desc=この種は、ゆっくりとした地質学的過程か魔法によって化石化したものだ。この種は魔法によってダンジョンの植生に影響を与えているようで、時折植物の種をルーンストーンに置き換えている。
items.trinkets.petrifiedseed.typical_stats_desc=通常、この装身具は踏まれた草が種の代わりにルーンストーンを落とす確率が_%1$s%%_ 高くなり、高い草がアイテムを落とす確率も _%2$s%%_ 高くなる。
items.trinkets.petrifiedseed.stats_desc=現在の強化値では、この装身具は踏まれた草が種の代わりにルーンストーンを落とす確率が_%1$s%%_ 高くなり、高い草がアイテムを落とす確率も _%2$s%%_ 高くなる。

items.trinkets.ratskull.name=鼠の頭蓋骨
items.trinkets.ratskull.desc=この不気味な装身具は、普通の鼠の頭蓋骨よりさほど大きくない。この頭蓋骨の魔力は、ダンジョンの珍しい生物を引き寄せ、出現頻度を上げるようだ。
items.trinkets.ratskull.typical_stats_desc=通常、この装身具はレア種の敵の出現率を _%d倍_ にする。ただし、結晶のミミックや鎧を着た彫像を引き寄せる効果は半分程度だ。
items.trinkets.ratskull.stats_desc=現在の強化値では、この装身具はレア種の敵の出現率を _%d倍_ にする。ただし、結晶のミミックや鎧を着た彫像を引き寄せる効果は半分程度だ。

items.trinkets.saltcube.name=塩の立方体
items.trinkets.saltcube.desc=この大きな塩の結晶は、ほぼ完璧な立方体の形に切り出されており、どういうわけか溶ける代わりに錬金鍋から半分の水を排出することができた。食料を魔法のように脱水して保存し、満腹感を長持ちさせているようだが、飢餓状態でないときの体力回復も弱めている。
items.trinkets.saltcube.typical_stats_desc=通常、この装身具は空腹になるまでの時間を _%1$s%%_ 増加させるが、階が封鎖されていない限り、体力の回復速度も _%2$s%%_ 減少させる。
items.trinkets.saltcube.stats_desc=現在の強化値では、この装身具は空腹になるまでの時間を _%1$s%%_ 増加させるが、階が封鎖されていない限り、体力の回復速度も _%2$s%%_ 減少させる。

items.trinkets.shardofoblivion.name=忘却の欠片
items.trinkets.shardofoblivion.desc=錬金鍋で煮込んだ後、この呪われた金属の小さな欠片は… 無？光は欠片のまわりで曲がっているように見え、あなたが欠片を持っていないときはその場に浮かんでいる。その欠片は、あなたの無知から魔法のように力を引き出しているようだ。だから、あまり深く考えないほうがいいだろう。
items.trinkets.shardofoblivion.typical_stats_desc=通常、この装身具は装備中、もしくは最近使用した未識別の装備品1つにつき敵が戦利品を落とす確率を20%%増加させ、最大 _%dつの未識別アイテム_ まで適用される。また、この欠片は装備品の識別を妨げるが、識別可能になったアイテムを手動で識別するために使用することができる。
items.trinkets.shardofoblivion.stats_desc=現在の強化値では、この装身具は装備中、もしくは最近使用した未識別の装備品1つにつき敵が戦利品を落とす確率を20%%増加させ、最大 _%dつの未識別アイテム_ まで適用される。また、この欠片は装備品の識別を妨げるが、識別可能になったアイテムを手動で識別するために使用することができる。
items.trinkets.shardofoblivion.ac_identify=識別する
items.trinkets.shardofoblivion.identify_prompt=アイテムの識別
items.trinkets.shardofoblivion.identify_ready=アイテムを識別する準備ができた: %s。忘却の欠片を使用して識別する。
items.trinkets.shardofoblivion.identify_ready_worn=装備中のアイテムはもう識別できる。アイテムに忘却の欠片を使用して識別する。
items.trinkets.shardofoblivion.identify_not_yet=そのアイテムはまだ識別する準備ができていない。
items.trinkets.shardofoblivion.identify=あなたはそのアイテムを識別した！
items.trinkets.shardofoblivion$wandusetracker.name=使用された未識別の杖
items.trinkets.shardofoblivion$wandusetracker.desc=あなたは最近未識別の杖を使用したが、これは少しの間、忘却の欠片の装備中の未識別のアイテム1個としてカウントされる。\n\n残り: %sターン 。
items.trinkets.shardofoblivion$thrownusetracker.name=未識別の投擲武器の使用
items.trinkets.shardofoblivion$thrownusetracker.desc=最近、未識別の投擲武器を使用した。これは、一時的に「忘却の欠片」における使用した未識別装備品としてカウントされる。\n\n残り: %sターン。

items.trinkets.thirteenleafclover.name=十三葉のクローバー
items.trinkets.thirteenleafclover.desc=錬金鍋で煮込んでいるうちに、どういうわけかこのクローバーに葉がたくさん生えた！この装身具が幸運なのか不運なのかよくわからないが、もしかしたらこの装身具が運をより混沌とさせるのだろうか？
items.trinkets.thirteenleafclover.typical_stats_desc=通常、この装身具は _%1$d%%_ の確率で最大ダメージを与え、 _%2$d%%_ の確率で最小ダメージを与える。
items.trinkets.thirteenleafclover.stats_desc=現在の強化値では、この装身具は _%1$d%%_ の確率で最大ダメージを与え、 _%2$d%%_ の確率で最小ダメージを与える。

items.trinkets.trapmechanism.name=罠の機構
items.trinkets.trapmechanism.desc=ダンジョンの落とし穴の罠の中核となる機構で、持ち運べるように床から慎重に削り出されている。ダンジョンそのものと魔法で結びついているようで、危険な地形がより顕著になるだけでなく、それに対する親和性も高まる。
items.trinkets.trapmechanism.typical_stats_desc=通常、この装身具は特徴のない階を _%1$d%%_ の確率で罠か奈落で埋め尽くすようにする。さらに、ダンジョンの隠された罠の _%2$d%%_ が見えるようになる。
items.trinkets.trapmechanism.stats_desc=現在の強化値では、この装身具は特徴のない階を _%1$d%%_ の確率で罠か奈落で埋め尽くすようにする。さらに、ダンジョンの隠された罠の _%2$d%%_ が見えるようになる。

items.trinkets.vialofblood.name=血の小瓶
items.trinkets.vialofblood.desc=この薄い小瓶にはダンジョンの住人の血液が入っていて、小瓶を回すとゆっくりと動く。魔法で治癒効果を高めているようだが、同時に効果を遅らせることもしている。
items.trinkets.vialofblood.typical_stats_desc=通常、この装身具は治癒のポーションや革水袋、あるいは回復の泉を飲んで得られる全体的な体力回復量を _%1$s%%_ 増加させる。ただし、これらの回復効果はよりゆっくりと発生し、1ターンに最大で _%2$s_ HPを回復する。（これは勇士のレベルに応じて変化する）
items.trinkets.vialofblood.stats_desc=現在の強化値では、この装身具は治癒のポーションや革水袋、あるいは回復の泉を飲んで得られる全体的な体力回復量を _%1$s%%_ 増加させる。ただし、これらの回復効果はよりゆっくりと発生し、1ターンに最大で _%2$s_ HPを回復する。（これは勇士のレベルに応じて変化する）

items.trinkets.wondrousresin.name=不思議な樹脂
items.trinkets.wondrousresin.desc=この青く煌めく樹脂は、呪われた杖の魔法のエッセンスを抽出したように見える。錬金鍋からの魔法でいくらか安定したようで、今は所持している杖に影響を及ぼしている。
items.trinkets.wondrousresin.typical_stats_desc=通常、この装身具は呪われた杖の効果を _%1$s%%_ の確率で中立か有益なものにし、呪われていない杖に _%2$s%%_ の確率で呪いの魔法を追加で発射させる。\n\nこの装身具を強化するには、より多くの錬金エネルギーが必要だ。
items.trinkets.wondrousresin.stats_desc=現在の強化値では、この装身具は呪われた杖の効果を _%1$s%%_ の確率で中立か有益なものにし、呪われていない杖に _%2$s%%_ の確率で呪いの魔法を追加で発射させる。\n\nこの装身具を強化するには、より多くの錬金エネルギーが必要だ。

items.trinkets.trinketcatalyst.name=魔法の触媒
items.trinkets.trinketcatalyst.window_title=装身具の作成
items.trinkets.trinketcatalyst.window_text=触媒を加えると、水が輝き始める。近くに、エネルギーを注入して魔法の装身具にできるアイテムがいくつかあるようだ。
items.trinkets.trinketcatalyst.desc=ダンジョンの暗闇の中でも煌めく、魔法の金粉の塊だ。この触媒を錬金鍋で使用すると、わずかな錬金エネルギーで固有の装身具を作り出すことができる。\n\n装身具は、ダンジョンやその住人をわずかに変化させるさまざまな効果をもたらす。また、より強力な効果を得るために、より多くの錬金エネルギーを使って強化することができる。
items.trinkets.trinketcatalyst$randomtrinket.name=ランダムな装身具
items.trinkets.trinketcatalyst$randomtrinket.desc=近くにあるアイテムが袋の中に入っていて開けられない。\n\n錬金術で袋を溶かすことができるが、どんな装身具が手に入るかはやってみないとわからない！

items.trinkets.trinket.discover_hint=このアイテムは、錬金術で装身具を作るたびに選択肢に入る可能性がある。
items.trinkets.trinket$placeholder.name=装身具

###wands
items.wands.cursedwand.ondeath=あなたは自分自身の%sによって死んだ。
items.wands.cursedwand.nothing=何も起こらなかった。
items.wands.cursedwand.mass_invuln=杖から鮮やかな光が噴き出す！
items.wands.cursedwand.petrify=突然、その場で固まった！
items.wands.cursedwand.grass=草が噴き出すように伸びてきた！
items.wands.cursedwand.fire=何かが燃えている…
items.wands.cursedwand.transmogrify_wand=なんと杖は別のアイテムに変化した！
items.wands.cursedwand.transmogrify_other=なんとアイテムはなにか別のものに変化した！
items.wands.cursedwand.disguise=あなたの外見は目の前で変わる！
items.wands.cursedwand.supernova=燃え盛るエネルギーの球が膨張し始める。今のうちに逃げろ！
items.wands.cursedwand.supernova_positive=燃え盛るエネルギーの球が膨張し始めたが、どういうわけか安全な感じがするようだ。
items.wands.cursedwand.sinkhole=あなたの周囲の地面が口を開けている！
items.wands.cursedwand.sinkhole_positive=あなたの周囲の地面が口を開けているが、足下は十分に固いようだ。
items.wands.cursedwand.gravity=重力は突然、でたらめな方向に引っ張り始める！
items.wands.cursedwand.gravity_positive=重力は突然、でたらめな方向に引っ張り始めるが、影響はないようだ。
items.wands.cursedwand.gravity_end=混沌とした重力は治まった。

items.wands.damagewand.upgrade_stat_name_1=魔法ダメージ

items.wands.wand.ac_zap=放つ
items.wands.wand.fizzles=杖は十分に充填されていないのか、わずかに震えただけだった。
items.wands.wand.no_magic=魔法に対する耐性がある間は、杖はわずかに震えるだけで使用できない。
items.wands.wand.self_target=自分自身は狙えない！
items.wands.wand.identify=杖に隅々まで精通し、識別できるようになった。
items.wands.wand.resin_one=この杖は秘儀の樹脂から_強化値+1_を得ている。
items.wands.wand.resin_many=この杖は秘儀の樹脂から_強化値+%d_得ている。
items.wands.wand.cursed=杖は呪われ、込められた魔力が暴走している。
items.wands.wand.not_cursed=この杖は害悪を及ぼす魔法がない。
items.wands.wand.curse_discover=%sは呪われている！
items.wands.wand.prompt=放つ場所を選択
items.wands.wand$placeholder.name=杖

items.wands.wandofblastwave.name=爆風の杖
items.wands.wandofblastwave.staff_name=爆風の長杖
items.wands.wandofblastwave.ondeath=あなたは自分の杖が放った爆風に巻き込まれて死んだ…
items.wands.wandofblastwave.knockback_ondeath=衝突して死んだ…
items.wands.wandofblastwave.desc=この杖は本体が大理石の一種でできており、先端に金色の飾りと丸い黒色の宝石が取り付けられている。手に持つとずっしりとした重みを感じる。
items.wands.wandofblastwave.typical_stats_desc=この杖は対象の場所で爆発するボルトを放つ。衝撃の力は通常、 _%1$dから%2$dのダメージ_ を与え、ほとんどの敵を吹き飛ばせるくらい強力だ。
items.wands.wandofblastwave.stats_desc=この杖は対象の場所で爆発するボルトを放つ。衝撃の力は _%1$dから%2$dのダメージ_ を与え、ほとんどの敵を吹き飛ばせるくらい強力だ。
items.wands.wandofblastwave.upgrade_stat_name_2=ノックバック
items.wands.wandofblastwave.bmage_desc=_魔術戦士_が麻痺状態の敵に対して爆風の長杖で殴ったとき、麻痺状態を解除して追加の魔法ダメージを爆発的に与える。この効果は敵ごとに短いクールダウンがある。
items.wands.wandofblastwave.eleblast_desc=爆風の長杖による元素の爆発は、67%のダメージを与え、爆発領域の外にいる全ての敵を強打する。

items.wands.wandofcorrosion.name=腐食の杖
items.wands.wandofcorrosion.staff_name=腐食の長杖
items.wands.wandofcorrosion.desc=この杖の持ち手は灰色で、先端には鮮やかなオレンジ色の宝石があしらわれている。
items.wands.wandofcorrosion.stats_desc=この杖はボルトを放ち、狙った場所に腐食性の高いガスの雲を発生させる。この雲の中に入ったものは、最初は_%d_ダメージから始まり、時間経過とともにダメージが増加する。
items.wands.wandofcorrosion.upgrade_stat_name_1=腐食ダメージ
items.wands.wandofcorrosion.upgrade_stat_name_2=ガスの量
items.wands.wandofcorrosion.bmage_desc=_魔術戦士_が腐食の長杖で敵を殴ったとき、その敵は粘液を浴びることがある。
items.wands.wandofcorrosion.eleblast_desc=腐食の長杖による元素の爆発は、6ダメージから始まる4ターンの腐食を敵に与える。

items.wands.wandofcorruption.name=堕落の杖
items.wands.wandofcorruption.staff_name=堕落の長杖
items.wands.wandofcorruption.already_corrupted=相手にこれ以上の影響を与えることはできない。
items.wands.wandofcorruption.desc=この杖の先には頭蓋骨をかたどった装飾が取り付けられているが、自身が放つ混沌とした暗いエネルギーによりはっきりとは見えない。
items.wands.wandofcorruption.stats_desc=この杖は敵に不利な効果を与える腐敗したエネルギーの衝撃を解き放ち、次第に敵をあなたに屈服させるだろう。敵は堕落に耐性を持つが、弱体化した敵は健康な敵に比べより堕落しやすくなる。
items.wands.wandofcorruption.upgrade_stat_name_1=堕落の力
items.wands.wandofcorruption.upgrade_stat_name_2=デバフ持続時間
items.wands.wandofcorruption.bmage_desc=_魔術戦士_が堕落の長杖で敵を殴ったとき、その敵は熱狂状態になることがある。
items.wands.wandofcorruption.eleblast_desc=堕落の長杖による元素の爆発は、5ターンの熱狂を敵に与える。

items.wands.wandofdisintegration.name=分解の杖
items.wands.wandofdisintegration.staff_name=分解の長杖
items.wands.wandofdisintegration.desc=この杖は滑らかでしっかりとした黒曜石の塊でできている。深紫の光が杖の先端から終端まで絶えず走り、破壊的なエネルギーが放たれるのを待っている事を感じさせる。
items.wands.wandofdisintegration.stats_desc=この杖は障害物を突き抜ける光線を放ち、強化するにつれてより遠くへ届くようになる。光線は _%1$dから%2$dのダメージ_ を与え、突き抜けた敵や壁に応じてボーナスダメージが入る。
items.wands.wandofdisintegration.upgrade_stat_name_2=最大射程距離
items.wands.wandofdisintegration.bmage_desc=_魔術戦士_が振るったとき、分解の長杖は突出のエンチャントが付加されたかのように、攻撃範囲が拡大される。
items.wands.wandofdisintegration.eleblast_desc=分解の長杖による元素の爆発は、壁を貫通し、100%のダメージを与える。

items.wands.wandoffireblast.name=爆炎の杖
items.wands.wandoffireblast.staff_name=爆炎の長杖
items.wands.wandoffireblast.desc=赤い漆塗りの木で作られたこの杖には黄金色の葉が惜しみなくあしらわれており、壮麗なことこの上ない。杖は絶えず先端から鋭く弾けるような音を発しており、強力な魔法を放つことを切望している。
items.wands.wandoffireblast.stats_desc=この杖は、使用すると炎を円錐状に吹き出す。次の攻撃では、_%1$dのチャージ_を消費し、_%2$dから%3$dのダメージを与える。_チャージが多いほど、効果は広く強くなる。
items.wands.wandoffireblast.upgrade_stat_name_1=充填1 消費時ダメージ
items.wands.wandoffireblast.upgrade_stat_name_2=充填2 消費時ダメージ
items.wands.wandoffireblast.upgrade_stat_name_3=充填3 消費時ダメージ
items.wands.wandoffireblast.bmage_desc=_魔術戦士_が爆炎の長杖で敵を殴ったとき、周囲の火をすべて消費して爆発が発生させ、敵にダメージを与える可能性がある。この確率は、敵に火が隣接しているほど高まる。
items.wands.wandoffireblast.eleblast_desc=爆炎の長杖による元素の爆発は、100%のダメージを与え、扉を破裂させ、敵と地形を燃え上がらせる。

items.wands.wandoffrost.name=凍結の杖
items.wands.wandoffrost.staff_name=凍結の長杖
items.wands.wandoffrost.desc=この杖はある種の魔法の氷で出来ているようだ。丸みを帯びたその先端は明るく輝いている。手に持つと冷たさを感じるが、握る手のひらが温かさを保てる程度だ。
items.wands.wandoffrost.stats_desc=この杖は敵に向かって氷エネルギーの衝撃を放ち、 _%1$dから%2$dのダメージ_ を与えて凍えさせる。この効果は水の中にいるとより強くなる。既に凍えたり凍結した敵は、この杖から受けるダメージが減少する。
items.wands.wandoffrost.upgrade_stat_name_2=悪寒の持続時間
items.wands.wandoffrost.bmage_desc=_魔術戦士_が凍結の長杖で凍えた敵を殴ったとき、その敵が即座に凍結するときがある。この確率はより凍えているほど大きくなる。
items.wands.wandoffrost.eleblast_desc=凍結の長杖による元素の爆発は、100%のダメージを与え、敵を凍らせ、火を消火する。

items.wands.wandoflightning.name=稲妻の杖
items.wands.wandoflightning.staff_name=稲妻の長杖
items.wands.wandoflightning.ondeath=あなたは自分の杖が放った電撃に巻き込まれて死んだ…
items.wands.wandoflightning.desc=この杖は頑丈な金属で作られており、驚くほど重い。先端は二本に分岐しており、間を電気火花が飛び交っている。
items.wands.wandoflightning.stats_desc=この杖は強力な稲妻が弧を描き、撃たれたものすべてに _%1$dから%2$dのダメージを与える。_この電気は近くのキャラクターで弧を描き、水の中ではより拡散しやすい。この杖の弧は自分にダメージを与えるが、味方にはダメージを与えない。
items.wands.wandoflightning.bmage_desc=_魔術戦士_が稲妻の長杖で敵を殴ったとき、10ターンの間、自身を帯電させる可能性がある。帯電している間は、魔術戦士は電撃のダメージを受けず、電撃をさらに遠くまで放つことができる。
items.wands.wandoflightning.eleblast_desc=稲妻の長杖による元素の爆発は、100%のダメージを与え、敵を5ターン硬直させ、水に電撃を流す。
items.wands.wandoflightning$lightningcharge.name=帯電
items.wands.wandoflightning$lightningcharge.desc=魔術戦士は現在、帯電しており、これにより稲妻の長杖に対する免疫を獲得し、電撃が杖から放たれる範囲が拡大される。\n\n残り: %sターン

items.wands.wandoflivingearth.name=生ける大地の杖
items.wands.wandoflivingearth.staff_name=生ける大地の長杖
items.wands.wandoflivingearth.desc=この杖は珍妙な岩から作られており、エネルギーが黄色の帯となって光り輝いている。杖を握ると、触れたことを感じて岩が動き出したように見える。
items.wands.wandoflivingearth.stats_desc=この杖は敵に魔法の岩石を発射し、 _%1$dから%2$dのダメージ_ を与える。発射後、この岩石は使用者の周りに漂い、与えたダメージに応じた岩石の鎧となる。もし岩石が十分あれば、次に杖を振るときは岩石でできた守護者に変化するだろう。
items.wands.wandoflivingearth.upgrade_stat_name_2=守護者の最大HP
items.wands.wandoflivingearth.upgrade_stat_name_3=守護者の防御力
items.wands.wandoflivingearth.bmage_desc=_魔術戦士_が生ける大地の長杖で敵を殴ったとき、与えたダメージの一部は岩石の鎧として戻る。
items.wands.wandoflivingearth.eleblast_desc=生ける大地の長杖による元素の爆発は、50%のダメージを与え、敵に命中する度に活動中の大地の守護者を回復する。
items.wands.wandoflivingearth$rockarmor.name=岩石の鎧
items.wands.wandoflivingearth$rockarmor.desc=魔法の岩石があなたの周りに漂い、攻撃を受ける時にあなたを守ろうとし、受けるダメージを50%%軽減する。しかし、ダメージを防ぐごとに岩石の一部が削り取られてしまう。\n残りの鎧: %1$d\n\nもし十分な量の岩石があなたの周りにあれば、次に生ける大地の杖を振ったときに岩石が守護者の形に組み上がり、あなたと共に戦ってくれるだろう。\n\n守護者に必要な鎧: %2$d
items.wands.wandoflivingearth$rockarmor.desc_many=この大地の守護者もまた数多の力の恩恵を受けている。\n\n残り: %dターン
items.wands.wandoflivingearth$earthguardian.name=大地の守護者
items.wands.wandoflivingearth$earthguardian.desc=生ける大地の杖から発射された岩石はあなたを守る大地の守護者に変化した！岩でできた守護者は近くの敵を攻撃し、攻撃を守護者に向けさせ、あなたが攻撃されないようにする。周囲の敵がすべて消滅した場合、守護者は岩石に変化してあなたの周りに漂い、杖を振ったときに再び現れるだろう。
items.wands.wandoflivingearth$earthguardian.wand_info=この守護者の防御力はあなたの杖の強化値に比例している。現在、 _%1$dから%2$dのダメージ_ を防御する。
items.wands.wandoflivingearth$earthguardian.discover_hint=このキャラクターは特定の杖で見つけることができる。

items.wands.wandofmagicmissile.name=魔力の矢の杖
items.wands.wandofmagicmissile.staff_name=魔力の矢の長杖
items.wands.wandofmagicmissile.desc=このありふれた形状の杖は純粋な魔力を放つ。杖自体に特殊な効果はないが、 チャージ数が多く、強化すると他の杖に一時的に力を与えることができる。
items.wands.wandofmagicmissile.stats_desc=この杖から放たれるボルトの一撃は _%1$dから%2$dのダメージ_  を与え、強化されている場合は他の杖に一時的に力を与える。
items.wands.wandofmagicmissile.bmage_desc=_魔術戦士_が魔力の矢の長杖で敵を殴ったとき、長杖だけでなく、すべての杖が充填される。
items.wands.wandofmagicmissile.eleblast_desc=魔力の矢の長杖による元素の爆発は、50%のダメージを与え、魔術師に15ターンの再充填を付与する。
items.wands.wandofmagicmissile.discover_hint=勇士の一人がスタート時にこのアイテムを持っている。
items.wands.wandofmagicmissile$magiccharge.name=魔力装填
items.wands.wandofmagicmissile$magiccharge.desc=魔力の矢の杖は、あなたの杖に力を与え、次回杖を撃った時の強化値を引き上げた。\n\nあなたの杖の強化値への補正: +%d\n\n魔力装填が終わるまで: %s ターン

items.wands.wandofprismaticlight.name=光彩の杖
items.wands.wandofprismaticlight.staff_name=光彩の長杖
items.wands.wandofprismaticlight.desc=この杖は半透明の結晶で作られており、滑らかなガラスで出来た細長い塊のようだ。色とりどりの光が杖の先端から揺らめき、漏れ出していく。
items.wands.wandofprismaticlight.stats_desc=この杖はダンジョンの暗闇を切り裂く光線を放ち、隠された場所や罠を露呈させる。光線は敵の目を晦ませ、 _%1$dから%2$dのダメージ_ を与える。悪魔や不死の敵は杖から発せられる光によって炎上し、ボーナスダメージを受ける。
items.wands.wandofprismaticlight.upgrade_stat_name_2=盲目の確率
items.wands.wandofprismaticlight.upgrade_stat_name_3=光源の持続時間
items.wands.wandofprismaticlight.bmage_desc=_魔術戦士_が光彩の長杖で敵を殴ったとき、長杖の強化値に応じた期間、敵が大怪我する。
items.wands.wandofprismaticlight.eleblast_desc=光彩の長杖による元素の爆発は、67%のダメージを与え、爆発範囲内の全地形を露呈させ、敵を5ターン盲目にする。

items.wands.wandofregrowth.name=再萌芽の杖
items.wands.wandofregrowth.staff_name=再萌芽の長杖
items.wands.wandofregrowth.desc=この杖の芯は、細かい意匠が彫られた細い木で作られている。どういうわけか、未だ生命力と活気に満ち、その緑色は若木の青さのようだ。「生命が絶えたとき、必ず新しい生命が芽生える...。永遠の循環が常に残っているのだ！」
items.wands.wandofregrowth.stats_desc=この杖を使うと、円錐状に魔法の芽吹きエネルギーが吹き出し、草や根、珍しい植物が芽吹く。次回の発動で_%1$d回分のチャージ_を消費する。チャージが多いほど効果は大きく、強くなる。
items.wands.wandofregrowth.degradation=_%d回分の充填量_を消費すると、この杖は植物や新鮮な草を生成できなくなる。この限界は、レベルアップや杖の強化によって増加する。
items.wands.wandofregrowth.upgrade_stat_name_1=充填ごとの草の量
items.wands.wandofregrowth.upgrade_stat_name_2=草の生成限界
items.wands.wandofregrowth.bmage_desc=_魔術戦士_が再萌芽の長杖で敵を殴り、かつどちらかが草の上に立っていると、与えたダメージに比例して草木の治癒を得る。
items.wands.wandofregrowth.eleblast_desc=再萌芽の長杖による元素の爆発は、敵を束縛し、爆発領域付近に草を無作為に生やす。
items.wands.wandofregrowth$dewcatcher.name=集露花
items.wands.wandofregrowth$dewcatcher.desc=集露花は、内部に魔法の露を溜め込む不思議な植物だ。気付かれないように草に擬態しようとするが、集めた露の膨らみで区別できる。
items.wands.wandofregrowth$dewcatcher.discover_hint=この植物は特定の杖で見つけることができる。
items.wands.wandofregrowth$seedpod.name=集種鞘
items.wands.wandofregrowth$seedpod.desc=集種鞘は、自らの種ではなく、他の種類の植物の種を生み出す魔法の植物だ。 自らの種を持っていないにも関わらず、どういうわけか広く生育している。
items.wands.wandofregrowth$seedpod.discover_hint=この植物は特定の杖で見つけることができる。
items.wands.wandofregrowth$lotus.name=金の蓮華
items.wands.wandofregrowth$lotus.desc=金の蓮華は、強力な再萌芽の杖によってのみ発生させることができる、神妙な植物だ。その霊気は全ての植物と植物の効果を強化するが、短時間でそのエネルギーの為に燃え尽きてしまう。
items.wands.wandofregrowth$lotus.wand_info=この蓮華は_+%1$d_の再萌芽の杖によって生み出された。その霊気が漂う範囲の内の全ての植物は、キャラクター上に植えられたときに、_即発動_する。植物はさらに_%2$d%%の確率_で種を落とし、塗布された矢の耐久力の消耗を_%3$d%%軽減_する。
items.wands.wandofregrowth$lotus.discover_hint=この植物は、特定の杖を何度か強化すると見つけることができる。

items.wands.wandoftransfusion.name=輸血の杖
items.wands.wandoftransfusion.staff_name=輸血の長杖
items.wands.wandoftransfusion.ondeath=あなたは自分の杖が体力を吸い取りすぎて死んだ…
items.wands.wandoftransfusion.charged=あなたの長杖は敵の生命エネルギーで一杯だ！
items.wands.wandoftransfusion.desc=ありふれた形状の杖だが、持ち手の赤紫の色彩と先端の漆黒の宝石が際立っている。
items.wands.wandoftransfusion.stats_desc=味方または魅了された敵に対してこの杖を使うと、_使用者の%1$dHP分_を用いて味方へ_%2$dHP分_、回復したりシールドを作ることができる。敵に対して使うと、使用者に_%3$dHP分のシールド_を与え、少しの間、敵を魅了する。敵対的な不死の敵は魅了する代わりに、_%4$dから%5$dのダメージ_を受ける。
items.wands.wandoftransfusion.upgrade_stat_name_1=味方への回復
items.wands.wandoftransfusion.upgrade_stat_name_2=自身のシールド
items.wands.wandoftransfusion.upgrade_stat_name_3=不死の敵へのダメージ
items.wands.wandoftransfusion.bmage_desc=_魔術戦士_が輸血の長杖で魅了された敵を殴ったとき、彼はその長杖での次の撃ちに体力を費やさず、シールドを得る。
items.wands.wandoftransfusion.eleblast_desc=輸血の長杖による元素の爆発は、敵を魅了し、味方を回復し、不死の敵に100%のダメージを与える。

items.wands.wandofwarding.name=護衛の杖
items.wands.wandofwarding.staff_name=護衛の長杖
items.wands.wandofwarding.no_more_wards=杖はこれ以上護衛を維持できない。
items.wands.wandofwarding.bad_location=護衛を配置する空き場所がない。
items.wands.wandofwarding.desc=この短い金属の杖の先端には紫色に輝く宝石が浮かんでいる。
items.wands.wandofwarding.stats_desc=この杖は敵に直接ダメージを与えるのではなく、移動しない歩哨や砲塔を召喚する。歩哨はどこでも召喚でき、視界があれば壁を通り抜けて召喚することもできる。この杖は一度に_%dエネルギー_に相当する歩哨を維持できる。
items.wands.wandofwarding.upgrade_stat_name_1=歩哨のダメージ
items.wands.wandofwarding.upgrade_stat_name_2=歩哨のエネルギー上限
items.wands.wandofwarding.bmage_desc=_魔術戦士_が護衛の長杖で敵を殴ったとき、全ての砲塔と歩哨が回復することがある。
items.wands.wandofwarding.eleblast_desc=護衛の長杖による元素の爆発は、爆発領域内の全ての砲塔と歩哨を回復する。
items.wands.wandofwarding$ward.desc_generic_ward=この砲塔は視界に入った敵を自動的に狙い撃つ。\n\n護衛の杖でこの砲塔を撃つと強化される。\n\n砲塔は消滅するまでの発射回数に制限を持つ。
items.wands.wandofwarding$ward.desc_generic_sentry=この歩哨も砲塔と同じ火力を持つが、決まったチャージ数の代わりに体力を持っている。護衛の杖の先端にある宝石に似ているようだ。\n\n護衛の杖でこの歩哨を撃つと、強化され回復する。\n\nこの歩哨は敵を狙い撃つするたびに体力を消費するが、護衛の杖を使うことで回復させることができる。
items.wands.wandofwarding$ward.name_1=小型砲塔
items.wands.wandofwarding$ward.desc_1=この単純な砲塔はその砲撃範囲に侵入した敵に自動で攻撃し、 _%1$dから%2$dのダメージ_ を与える。\n\nこの砲塔に向けて護衛の杖を振るうと強化することができる。\n\nこの砲塔は消滅する前に一回攻撃する。\n\nこの砲塔を維持するために護衛の杖は _%3$dエネルギー_ を使用する。
items.wands.wandofwarding$ward.name_2=砲塔
items.wands.wandofwarding$ward.desc_2=この強化された砲塔はより複雑な機構になり、複数回攻撃できるようになった。この砲塔が放つ毎回の攻撃は _%1$dから%2$dのダメージ_ を与える。\n\nこの砲塔に向けて護衛の杖を振るうと強化することができる。\n\nこの砲塔は消滅する前に三回攻撃する。\n\nこの砲塔を維持するために護衛の杖は _%3$dエネルギー_ を使用する。
items.wands.wandofwarding$ward.name_3=大型砲塔
items.wands.wandofwarding$ward.desc_3=この完全に強化された砲塔は、強化する前と比べてより多く攻撃できるようになった。この砲塔が放つ毎回の攻撃は _%1$dから%2$dのダメージ_ を与える。\n\nこの砲塔に向けて護衛の杖を振るうと強化することができる。\n\nこの砲塔は消滅する前に5回攻撃する。\n\nこの砲塔を維持するために護衛の杖は _%3$dエネルギー_ を使用する。
items.wands.wandofwarding$ward.name_4=小型歩哨
items.wands.wandofwarding$ward.desc_4=この小型の歩哨は大型砲塔と同じ火力を持つが、充填回数が定まっている代わりに体力がある。歩哨は護衛の杖の先端に装飾されている宝石に類似している。この歩哨が放つ毎回の攻撃は _%1$dから%2$dのダメージ_ を与える。\n\nこの歩哨に向けて護衛の杖を振るうと、強化してさらに回復することができる。\n\n歩哨が敵に向かって攻撃をするたびにいくらか体力を消費するが、護衛の杖を歩哨に向けて振るえば回復させることができる。\n\nこの歩哨を維持するために護衛の杖は _%3$dエネルギー_ を使用する。
items.wands.wandofwarding$ward.name_5=歩哨
items.wands.wandofwarding$ward.desc_5=この強化された歩哨はより大きくなり、小型歩哨より丈夫になった。この歩哨が放つ毎回の攻撃は _%1$dから%2$dのダメージ_ を与える。\n\nこの歩哨に向けて護衛の杖を振るうと、強化してさらに回復することができる。\n\n歩哨が敵に向かって攻撃をするたびにいくらか体力を消費するが、護衛の杖を歩哨に向けて振るえば回復させることができる。\n\nこの歩哨を維持するために護衛の杖は _%3$dエネルギー_ を使用する。
items.wands.wandofwarding$ward.name_6=大型歩哨
items.wands.wandofwarding$ward.desc_6=この完全に強化された歩哨は、強化する前と比べてかなり丈夫になった。この歩哨が放つ毎回の攻撃は _%1$dから%2$dのダメージ_ を与える。\n\nこの歩哨に向けて護衛の杖を振るうと、回復することができる。\n\n歩哨が敵に向かって攻撃をするたびにいくらか体力を消費するが、護衛の杖を歩哨に向けて振るえば回復させることができる。\n\nこの歩哨を維持するために護衛の杖は _%3$dエネルギー_ を使用する。
items.wands.wandofwarding$ward.discover_hint=このキャラクターは特定の杖で見つけることができる。
items.wands.wandofwarding$ward.dismiss_title=護衛を解体しますか？
items.wands.wandofwarding$ward.dismiss_body=これ以上護衛を維持したくない場合、護衛を解体することができる。解体すると、この護衛は直ちに破壊される。\n\n護衛を解体しますか？
items.wands.wandofwarding$ward.dismiss_confirm=はい
items.wands.wandofwarding$ward.dismiss_cancel=いいえ

###weapon curses
items.weapon.curses.annoying.name=騒がしい%s
items.weapon.curses.annoying.msg_1=うわっ、ひょっとして何かと戦ってる！？
items.weapon.curses.annoying.msg_2=やっちまえ！
items.weapon.curses.annoying.msg_3=おい、聞けよ！
items.weapon.curses.annoying.msg_4=まだボスと戦ってないのか！？
items.weapon.curses.annoying.msg_5=いたっ、そんなに強く振り回すなって！
items.weapon.curses.annoying.msg_6=死ねぇ！虫けらぁ！
items.weapon.curses.annoying.msg_7=ヒィィヤャッッホォォォオオォオウゥ！
items.weapon.curses.annoying.msg_8=ちょっとは休もうぜ！？
items.weapon.curses.annoying.msg_9=ビシッ！ハッハー！
items.weapon.curses.annoying.msg_10=いい一撃だ！
items.weapon.curses.annoying.msg_11=武器よりも木こりの斧になりたかったな…
items.weapon.curses.annoying.msg_12=覚えておいで、軽率さというのはジワジワと命を食い尽す死神だ。
items.weapon.curses.annoying.msg_13=タフすぎてソンはない
items.weapon.curses.annoying.desc=騒がしい武器は発話能力があるが、少し元気すぎる。意味もないのに話し出しあなたに注目を集めるだろう。
items.weapon.curses.annoying.elestrike_desc=騒がしい呪いによる元素の一撃は、範囲内の各敵を20%の確率で6ターンの間、熱狂状態にさせる。

items.weapon.curses.dazzling.name=眩い%s
items.weapon.curses.dazzling.desc=眩い武器は時々眩いばかりの閃光を放ち、見るものすべての目を眩ませるだろう。
items.weapon.curses.dazzling.elestrike_desc=眩い呪いによる元素の一撃は、範囲内の各敵を50%の確率で6ターンの間、盲目状態にさせる。

items.weapon.curses.displacing.name=退去させる%s
items.weapon.curses.displacing.desc=退去させる武器は混沌とした転移魔法で満たされていて、同じ階のどこかにランダムに敵を転移させてしまうことがある。
items.weapon.curses.displacing.elestrike_desc=退去させる呪いによる元素の一撃は、範囲内の各敵を50%の確率でテレポートさせる。

items.weapon.curses.explosive.name=爆発性の%s
items.weapon.curses.explosive.warm=温かい…
items.weapon.curses.explosive.hot=熱い！
items.weapon.curses.explosive.desc=爆発性の武器は徐々に力を溜めて爆発し、近くにあるものにダメージを与えるだろう。
items.weapon.curses.explosive.desc_cool=武器は現在触ると冷たい。
items.weapon.curses.explosive.desc_warm=あなたの武器はエネルギーを蓄積し、暖かくなる…
items.weapon.curses.explosive.desc_hot=あなたの武器は熱い！　今にも爆発するだろう！
items.weapon.curses.explosive.elestrike_desc=爆発性の呪いによる元素の一撃は、範囲内のランダムな敵を50%の確率で爆発させる。

items.weapon.curses.friendly.name=友好的な%s
items.weapon.curses.friendly.desc=友好的な武器は平和主義者の武器としては最適だ。稀に起動する魔法によって戦闘が不可能になるだろう。
items.weapon.curses.friendly.elestrike_desc=友好的な呪いによる元素の一撃は、範囲内の各敵を50%の確率で6ターンの間、魅了状態にさせる。

items.weapon.curses.polarized.name=二極化した%s
items.weapon.curses.polarized.desc=二極化した武器は攻撃が更に50%のダメージを与えるか、全くダメージを与えないかのどちらかになってしまう呪いにかかっている。
items.weapon.curses.polarized.elestrike_desc=二極化した呪いによる元素の一撃は、範囲内の各敵を50%の確率で24から36のダメージを与える。

items.weapon.curses.sacrificial.name=償わせる%s
items.weapon.curses.sacrificial.desc=償わせる武器は敵を攻撃する見返りに使用者の血を要求する。健康であればあるほど、呪いはより大量の血を要求するだろう。
items.weapon.curses.sacrificial.elestrike_desc=償わせる呪いによる元素の一撃は、勇士と範囲内の各敵に12HP分の流血状態にさせる。

items.weapon.curses.wayward.name=我儘な%s
items.weapon.curses.wayward.desc=我儘な武器は時々極端に正確性が悪くなる。この魔法は発動してから少しの間持続するが、我儘な武器で一撃を加えることで解除される。
items.weapon.curses.wayward.elestrike_desc=我儘な呪いによる元素の一撃は、範囲内の各敵を50%の確率で6ターンの間、幻惑の呪い状態にさせる。
items.weapon.curses.wayward$waywardbuff.name=武器の我儘
items.weapon.curses.wayward$waywardbuff.desc=我儘な武器の魔法が発動し、短時間の間、極めて正確性が悪くなる。ただし、奇襲攻撃などの命中が保証されている攻撃には効果がない。我儘な武器での攻撃が成功すると、この効果はすぐに解除される。\n\n武器の我儘が終わるまで: %s ターン

###enchantments
items.weapon.enchantments.blazing.name=猛炎の%s
items.weapon.enchantments.blazing.desc=猛炎の武器は炎を吹き出し、既に着火しているものに対してはボーナスダメージを与えるだろう。
items.weapon.enchantments.blazing.elestrike_desc=猛炎のエンチャントによる元素の一撃は、範囲内のすべてのタイルに火を広げ、8ターン持続する。

items.weapon.enchantments.blocking.name=防御の%s
items.weapon.enchantments.blocking.desc=防御の武器は攻撃したあとに、一時的なシールドを張る可能性がある。
items.weapon.enchantments.blocking.elestrike_desc=防御のエンチャントによる元素の一撃は、範囲内の敵1体につき、決闘者に追加で6HP相当のシールドを付与する。
items.weapon.enchantments.blocking$blockbuff.name=防御中
items.weapon.enchantments.blocking$blockbuff.desc=防御の武器のエンチャントにより、防御力が一時的に上昇した！\n\nシールドの残り: %d\n\n終わるまで: %sターン

items.weapon.enchantments.blooming.name=開花の%s
items.weapon.enchantments.blooming.desc=開花の武器は当てた敵の周りに若葉を芽吹かせる魔法が込められている。
items.weapon.enchantments.blooming.elestrike_desc=開花のエンチャントによる元素の一撃は、範囲内の最大8タイルに草を広げ、範囲内のすべての敵を6ターンの間、束縛状態にさせる。

items.weapon.enchantments.chilling.name=冷却の%s
items.weapon.enchantments.chilling.desc=冷却の武器で攻撃された敵は凍えてしまい、動きや攻撃が遅くなる。
items.weapon.enchantments.chilling.elestrike_desc=冷却のエンチャントによる元素の一撃は、範囲内のすべてのタイルに冷気を広げ、8ターン持続する。

items.weapon.enchantments.kinetic.name=保存の%s
items.weapon.enchantments.kinetic.desc=保存の武器で敵が殺されると、余剰の力が武器に蓄えられ、成功した次の攻撃に追加される。
items.weapon.enchantments.kinetic.elestrike_desc=保存のエンチャントによる元素の一撃は、保存済みダメージの40%を、主要なターゲットを除く範囲内の各敵に与える。
items.weapon.enchantments.kinetic$conserveddamage.name=保存済みダメージ
items.weapon.enchantments.kinetic$conserveddamage.desc=あなたの武器は前回の決定打から得られた余剰の力を保存しており、次の攻撃にボーナスダメージとして追加されるだろう。しかし、このエネルギーは時間と共に無くなっていく。\n\n保存済みダメージ: %d

items.weapon.enchantments.corrupting.name=堕落の%s
items.weapon.enchantments.corrupting.desc=この強力なエンチャントは敵をあなたの思いのままにする能力を秘めている。この武器で敵が殺されると、死ぬ代わりに堕落する可能性がある。
items.weapon.enchantments.corrupting.elestrike_desc=堕落のエンチャントによる元素の一撃は、5～25％の確率（減らしたHPに基づく）で、主要ターゲットを除く範囲内の各敵を堕落状態にさせる。

items.weapon.enchantments.elastic.name=弾性の%s
items.weapon.enchantments.elastic.desc=弾性の武器で攻撃すると敵が少しの距離後退する可能性がある。
items.weapon.enchantments.elastic.elestrike_desc=弾性のエンチャントによる元素の一撃は、範囲内のすべての敵を5タイル分吹き飛ばす。

items.weapon.enchantments.grim.name=致死の%s
items.weapon.enchantments.grim.desc=致死の武器は、攻撃した敵を即死させる強力なエンチャントが付与されている。この効果は敵が弱っているほど発揮されやすい。
items.weapon.enchantments.grim.elestrike_desc=致死のエンチャントによる元素の一撃は、6～30％の確率（減らしたHPに基づく）で、主要ターゲットを除く範囲内の各敵を即死させる。

items.weapon.enchantments.lucky.name=強運の%s
items.weapon.enchantments.lucky.desc=この武器で殺された敵は追加の戦利品を落とす可能性がある。
items.weapon.enchantments.lucky.elestrike_desc=強運のエンチャントによる元素の一撃は、12.5%の確率で範囲内の各敵の足元に戦利品を産み出すことがある。この効果は敵1体につき1回しか発動しない。

items.weapon.enchantments.projecting.name=突出の%s
items.weapon.enchantments.projecting.desc=このエンチャントにより、近接武器は射程距離が増加する。遠距離武器は近くの標的を狙うと壁を貫通する。
items.weapon.enchantments.projecting.elestrike_desc=突出のエンチャントによる元素の一撃は、主要ターゲットを除く範囲内の各敵に30%の追加ダメージを与える。

items.weapon.enchantments.shocking.name=電撃の%s
items.weapon.enchantments.shocking.desc=電撃の武器から迸る電弧は、周囲の敵に追加ダメージを与える。
items.weapon.enchantments.shocking.elestrike_desc=電撃のエンチャントによる元素の一撃は、範囲内のすべてのタイルに電気を広げ、8ターン持続する。

items.weapon.enchantments.unstable.name=不定の%s
items.weapon.enchantments.unstable.desc=このエンチャントは混沌としたエネルギーを放っており、攻撃が当たった際にそれぞれ異なるエンチャントの効果が発揮される。
items.weapon.enchantments.unstable.elestrike_desc=不定のエンチャントによる元素の一撃は、主要ターゲットを除く範囲内の各敵にランダムなエンチャント効果を適用する。

items.weapon.enchantments.vampiric.name=吸血の%s
items.weapon.enchantments.vampiric.desc=この強力なエンチャントは攻撃した際に生命力を吸い上げ、使用者に還元する。この効果は使用者の体力が少ないほど強力になる。
items.weapon.enchantments.vampiric.elestrike_desc=吸血のエンチャントによる元素の一撃は、範囲内の敵1体につき、決闘者のHPを2.5回復させる。


###melee weapons
items.weapon.melee.assassinsblade.name=暗殺者の刃
items.weapon.melee.assassinsblade.stats_desc=この武器による攻撃はあなたに気づいていない敵に対してより強力になる。
items.weapon.melee.assassinsblade.ability_name=忍び足
items.weapon.melee.assassinsblade.typical_ability_desc=決闘者は暗殺者の刃を振るっている時、_忍び足_ができる。この能力は3タイル分の距離まで瞬時に移動し、通常、_%dターンの間、不可視状態になれる。_
items.weapon.melee.assassinsblade.ability_desc=決闘者は暗殺者の刃を振るっている時、_忍び足_ができる。この能力は3タイル分の距離まで瞬時に移動し、_%dターンの間、不可視状態になれる。_
items.weapon.melee.assassinsblade.upgrade_ability_stat_name=武器能力の持続時間
items.weapon.melee.assassinsblade.desc=黒曜石で作られた波状の刃は、その重さの割に扱うことが難しいが、正しく扱うことができれば致命傷を与えるだろう。

items.weapon.melee.battleaxe.name=戦斧
items.weapon.melee.battleaxe.stats_desc=この武器による攻撃はより正確になる。
items.weapon.melee.battleaxe.ability_name=強打
items.weapon.melee.battleaxe.typical_ability_desc=決闘者は戦斧で_強打_を行うことができる。この集中的攻撃は奇襲攻撃の場合、通常、 _%1$dから%2$dのダメージ_ を与え、5ターンの間、正確性と回避力が50%%低下する朦朧状態にさせる。強打は必ず命中するが、奇襲攻撃でない場合、通常のダメージを与える。
items.weapon.melee.battleaxe.ability_desc=決闘者は戦斧で_強打_を行うことができる。この集中的攻撃は奇襲攻撃の場合、 _%1$dから%2$dのダメージ_ を与え、5ターンの間、正確性と回避力が50%%低下する朦朧状態にさせる。強打は必ず命中するが、奇襲攻撃でない場合、通常のダメージを与える。
items.weapon.melee.battleaxe.desc=巨大な鋼の斧身によって重量級の横薙ぎが放たれる。

items.weapon.melee.crossbow.name=弩
items.weapon.melee.crossbow.typical_stats_desc=通常、この武器は装備中に投げた投矢を強化し、_%1$dから%2$dのダメージ_ を与える。さらにそのエンチャント効果を投矢にも付与する。
items.weapon.melee.crossbow.stats_desc=この武器は装備中に投げた投矢を強化し、_%1$dから%2$dのダメージ_ を与える。さらにそのエンチャント効果を投矢にも付与する。
items.weapon.melee.crossbow.ability_name=溜め撃ち
items.weapon.melee.crossbow.typical_ability_desc=決闘者は弩で_力溜め_を行うことができ、次の弩による通常攻撃が必ず命中し、3つの効果のうち1つを適用する。近接攻撃は敵を吹き飛ばし、塗布剤が塗られていない投矢は通常、 _%1$dダメージ_ 増加し、塗布剤が塗られた投矢は7×7タイルの範囲の敵に命中時の効果を適用し、通常、 _%2$d回分、より長持ちする。_
items.weapon.melee.crossbow.ability_desc=決闘者は弩で_力溜め_を行うことができ、次の弩による通常攻撃が必ず命中し、3つの効果のうち1つを適用する。近接攻撃は敵を吹き飛ばし、塗布剤が塗られていない投矢は  _%1$dダメージ_ 増加し、塗布剤が塗られた投矢は7×7タイルの範囲の敵に命中時の効果を適用し、 _%2$d回分、より長持ちする。_
items.weapon.melee.crossbow.desc=並外れた速度で矢を打ち出すことのできる非常に入り組んだ武器だ。近接武器として作られてはいないものの、その重量と頑丈な構造によって近接武器としても使用できる。
items.weapon.melee.crossbow.upgrade_ability_stat_name=武器能力上昇
items.weapon.melee.crossbow$chargedshot.name=力溜め
items.weapon.melee.crossbow$chargedshot.desc=決闘者は弩に力を溜めている。次に弩で行う攻撃は必ず命中し、3つの効果のいずれかが適用される：\n- 近接攻撃は敵を数タイル先に吹き飛ばす。\n- 塗布剤が塗られていない投矢はボーナスダメージを与える。\n- 塗布剤が塗られた投矢は使用回数が増え、7×7の範囲に効果が適用される。有益な効果は味方にのみ適用され、有害な効果は敵にのみ適用される。決闘者はこの能力を使用して自分自身に有益な投矢の効果を与えることはできない。

items.weapon.melee.cudgel.name=棍棒
items.weapon.melee.cudgel.stats_desc=この武器による攻撃はより正確になる。
items.weapon.melee.cudgel.ability_name=強打
items.weapon.melee.cudgel.typical_ability_desc=決闘者は棍棒で_強打_を行うことができる。この集中的攻撃は奇襲攻撃の場合、通常、 _%1$dから%2$dのダメージ_ を与え、5ターンの間、正確性と回避力が50%%低下する朦朧状態にさせる。強打は必ず命中するが、奇襲攻撃でない場合、通常のダメージを与える。
items.weapon.melee.cudgel.ability_desc=決闘者は棍棒で_強打_を行うことができる。この集中的攻撃は奇襲攻撃の場合、 _%1$dから%2$dのダメージ_ を与え、5ターンの間、正確性と回避力が50%%低下する朦朧状態にさせる。強打は必ず命中するが、奇襲攻撃でない場合、通常のダメージを与える。
items.weapon.melee.cudgel.desc=小型の真鍮製の棍棒だ。冒険用の武器というよりは、貴族の護身用として作られたもののようだ。
items.weapon.melee.cudgel.discover_hint=勇士の一人がスタート時にこのアイテムを持っている。

items.weapon.melee.dagger.name=ダガー
