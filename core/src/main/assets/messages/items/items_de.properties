###armor curses
items.armor.curses.antientropy.name=%s der Anti-Entropie
items.armor.curses.antientropy.desc=Ein Anti-Entropie-Fluch arbeitet gegen die Kräfte des Universums, indem er der Umgebung Energie entzieht und in den Träger überführt. Dies setzt den Träger kurz in Flammen, friert aber alles um ihn herum ein!

items.armor.curses.bulk.name=%s des Füllstoffs
items.armor.curses.bulk.desc=Eine Füllstoff-Rüstung sieht zwar größer und imposanter aus, schützt jedoch nicht besser. Was noch schlimmer ist: Das zusätzliche Volumen macht es sehr schwer, sich durch Türöffnungen zu zwängen.

items.armor.curses.corrosion.name=%s der Zersetzung
items.armor.curses.corrosion.desc=Eine Rüstung der Zersetzung ist dazu in der Lage, mit einer zersetzenden Flüssigkeit aufzuplatzen, wodurch alles im Umkreis mit einem klebrigen Säureschlamm bedeckt wird.

items.armor.curses.displacement.name=%s der Verdrängung
items.armor.curses.displacement.desc=Der Fluch der Verschiebung versucht es, den Träger in die Sicherheit zu verschieben, wenn er angegriffen wird. Der Fluch ist jedoch etwas zu effektiv und teleportiert den Benutzer zufällig in der Ebene herum.

items.armor.curses.metabolism.name=%s des Metabolismus
items.armor.curses.metabolism.desc=Der Metabolismusfluch verwandelt Sättigung direkt in Gesundheit, wenn der Träger verletzt wird, was die Gesundheit erhöht, aber zu einem schnellem Verhungern führt.

items.armor.curses.multiplicity.name=%s der Vervielfältigung
items.armor.curses.multiplicity.desc=Rüstungen, auf denen der Vervielfältigungsfluch lastet, enthalten eine gefährliche Verdoppelungsmagie. Sie wird manchmal ein Spiegelbild des Trägers erschaffen, aber es ist ebenso wahrscheinlich, dass sie den Gegner verdoppelt.

items.armor.curses.overgrowth.name=%s der Überwucherung
items.armor.curses.overgrowth.desc=Die Rüstung der Überwucherung ist mit verschiedenen, blühenden Pflanzen überzogen. Während dieser Effekt sicherlich interessant aussieht, bringt er nichts für die Verteidigung und Pflanzenwachstum wird zufällig im Kampf aktiviert!

items.armor.curses.stench.name=%s des Gestanks
items.armor.curses.stench.desc=Rüstung, die mit Gestank verflucht wurde, wird Wolken aus einem schädlichen Gas absondern, was gefährlich für alles und jeden ist, welcher sich in den Gaswolke aufhält.


###glyphs
items.armor.glyphs.affection.name=%s der Zuneigung
items.armor.glyphs.affection.desc=Diese starke Glyphe manipuliert den Verstand von Gegnern, was sie kurzzeitig betört.

items.armor.glyphs.antimagic.name=%s der Antimagie
items.armor.glyphs.antimagic.desc=Diese starke Glyphe ermöglicht es einer Rüstung, den Träger nicht nur gegen physische, sondern auch magische Angriffe zu verteidigen. Die magische Verteidigung ist unabhängig von der Rüstungsklasse.

items.armor.glyphs.brimstone.name=%s des Schwefels
items.armor.glyphs.brimstone.desc=Diese Glyphe schützt den Träger und alle seine Gegenstände vor Feuer und all dessen Effekten.

items.armor.glyphs.camouflage.name=%s der Tarnung
items.armor.glyphs.camouflage.desc=Diese Glyphe ermöglicht es dem Träger, sich mit hohem Gewächs optisch anzugleichen, was ihn kurzzeitig unsichtbar macht.

items.armor.glyphs.entanglement.name=%s der Verwurzlung
items.armor.glyphs.entanglement.desc=Diese Glyphe lässt eine irdene Rüstung um den Träger wachsen, um Schaden zu absorbieren, jedoch bricht sie bei Bewegung.

items.armor.glyphs.flow.name=%s des Flusses
items.armor.glyphs.flow.desc=Diese Glyphe manipuliert den Wasserfluss um den Träger, wodurch er viel schneller wird, wenn er durch Wasser geht.

items.armor.glyphs.obfuscation.name=%s der Vernebelung
items.armor.glyphs.obfuscation.desc=Diese Glyphe verdunkelt den Träger, so dass er schwerer zu entdecken ist.

items.armor.glyphs.potential.name=%s des Potenzials
items.armor.glyphs.potential.desc=Diese Glyphe sammelt Energie, wenn sie getroffen wird, mit der sie die Zauberstäbe des Trägers ein wenig auflädt.

items.armor.glyphs.repulsion.name=%s des Rückstoßes
items.armor.glyphs.repulsion.desc=Diese Glyphe lässt Angreifer abprallen, wodurch sie zurückgeschleudert werden.

items.armor.glyphs.stone.name=%s des Steins
items.armor.glyphs.stone.desc=Diese Glyphe umhüllt die Rüstung mit schwerem, magischen Gestein, das Ausweichen unmöglich macht und Schaden im Verhältnis zur Ausweichrate blockt.

items.armor.glyphs.swiftness.name=%s der Schnelligkeit
items.armor.glyphs.swiftness.desc=Diese Glyphe erhöht die Geschwindigkeit des Trägers, wenn er nicht in der Nähe eines Feindes steht.

items.armor.glyphs.thorns.name=%s der Dornen
items.armor.glyphs.thorns.desc=Diese starke Glyphe lässt Angreifer langsam verbluten, wenn sie den Träger angreifen.

items.armor.glyphs.viscosity.name=%s der Zähigkeit
items.armor.glyphs.viscosity.deferred=verzögert %d
items.armor.glyphs.viscosity$defereddamage.name=verzögerter Schaden
items.armor.glyphs.viscosity$defereddamage.ondeath=Der verzögerte Schaden hat dich getötet...
items.armor.glyphs.viscosity$defereddamage.rankings_desc=Durch verzögerten Schaden getötet
items.armor.glyphs.viscosity$defereddamage.desc=Anstelle davon, dass Schaden sofort zugefügt wird, verteilt er sich über die Zeit.\n\nVerbleibender verzögerter Schaden: %d.
items.armor.glyphs.viscosity.desc=Diese Glyphe ist dazu in der Lage, den durch den Träger erlittenen Schaden zu verzögern. Mit der Zeit wird der gespeicherte Schaden nach und nach, anstatt auf einmal, auf den Träger übertragen.



###armor
items.armor.armor.ac_detach=ENTFERNEN
items.armor.armor.detach_seal=Du entfernst das Siegel von deiner Rüstung.
items.armor.armor.equip_cursed=Die Rüstung schnürt sich schmerzhaft um dich.
items.armor.armor.identify=Du bist mit deiner Rüstung nun vertraut genug, um sie zu identifizieren.
items.armor.armor.hardening_gone=Die Härtung auf dieser Rüstung ist abgetragen!
items.armor.armor.incompatible=Die Interaktion mit verschiedenen Arten von Magie hat die Glyphe von dieser Rüstung entfernt!
items.armor.armor.curr_absorb=Diese _Klasse-%1$d_ Rüstung verhindert _%2$d-%3$d Schadenspunkte_ und benötigt eine _Stärke von %4$d,_ um ohne Abzüge verwendet werden zu können.
items.armor.armor.avg_absorb=Üblicherweise verhindert diese _Klasse-%1$d_ Rüstung _%2$d-%3$d Schaden_ und benötigt eine _Stärke von %4$d,_ um ohne Abzüge verwendet werden zu können.
items.armor.armor.too_heavy=Aufgrund deiner unzureichenden Stärke wird diese Rüstung deine Bewegungs-, Ausweich- und Verteidigungsfähigkeiten verringern.
items.armor.armor.probably_too_heavy=Diese Rüstung ist wahrscheinlich zu schwer für dich.
items.armor.armor.excess_str=Aufgrund deiner überschüssigen Stärke hast du eine _erhöhte Ausweichfähigkeit,_ solange du diese Rüstung trägst.
items.armor.armor.evasion=Verzaubert, um die _Ausweichrate_ zu erhöhen.
items.armor.armor.defense=Verzaubert, um die _Verteidigung_ zu erhöhen.
items.armor.armor.inscribed=trägt die Inschrift _%s._
items.armor.armor.glyph_hardened=Der Gegenstand wurde _verhärtet._
items.armor.armor.hardened_no_glyph=Diese Rüstung wurde _verhärtet,_ aber ist derzeit nicht mit einer Glyphe graviert.
items.armor.armor.cursed_worn=Da diese Rüstung verflucht ist, bist du nicht dazu in der Lage, sie abzulegen.
items.armor.armor.cursed=Du spürst, dass eine bösartige Magie in dieser Rüstung ruht.
items.armor.armor.weak_cursed=Trotz des Fluchs gelingt es dir, die Rüstung abzulegen.
items.armor.armor.not_cursed=Diese Rüstung ist frei von bösartiger Magie.
items.armor.armor.seal_attached=Das zerbrochene Siegel des Kriegers ist an dieser Rüstung befestigt. Sobald seine Gesundheit unter die Hälfte seiner Lebenspunkte zu sinken droht, verleiht es ihm bis zu _%d Abschirmung_.
items.armor.armor.seal_transfer=Das zerbrochene Siegel des Kriegers muss an seiner ausgerüsteten Rüstung befestigt sein, um ihm einen Bonus zu gewähren. Möchtest du das Siegel automatisch von der bisherigen Rüstung ablösen und an der neuen Rüstung befestigen?
items.armor.armor.seal_transfer_yes=ja
items.armor.armor.seal_transfer_no=nein
items.armor.armor$glyph.glyph=Glyphe
items.armor.armor$glyph.killed=%s hat dich getötet...
items.armor.armor$glyph.rankings_desc=Getötet von einer Glyphe
items.armor.armor$glyph.discover_hint=Du kannst einen Gegenstand mit diesem Effekt zufällig im Dungeon finden, oder du kannst versuchen, ihn selber auf einen Gegenstand anzuwenden.

items.armor.classarmor.ac_ability=FÄHIGKEIT AUSWÄHLEN
items.armor.classarmor.ac_transfer=ÜBERTRAGEN
items.armor.classarmor.no_ability=Deine Rüstung hat momentan keine Fähigkeit, du solltest aber eine auswählen!
items.armor.classarmor.not_equipped=Du musst diese Rüstung tragen, um ihre speziellen Fähigkeiten zu verwenden.
items.armor.classarmor.low_charge=Die Rüstung hat nicht genug Ladung, um ihre besonderen Fähigkeiten zu verwenden.
items.armor.classarmor.charge_use=Die sofortige Verwendung der Fähigkeit verbraucht _%s_ Ladung.
items.armor.classarmor.transfer_title=Rüstung übertragen
items.armor.classarmor.transfer_desc=Die Magie der Krone des Zwergenkönigs kann auf eine andere Rüstung übertragen werden. Bedenke jedoch, dass die ursprüngliche Rüstung dabei zerstört wird.
items.armor.classarmor.transfer_prompt=Wähle eine Rüstung
items.armor.classarmor.transfer_cancel=Abbrechen
items.armor.classarmor.transfer_complete=Die Eigenschaften deiner Heldenrüstung wurden übertragen!
items.armor.classarmor.discover_hint=Du kannst diesen Gegenstand finden, nachdem du den Boss auf Ebene 20 mit einem bestimmten Helden besiegt hast.

items.armor.clericarmor.name=Kleidung des Helden
items.armor.clericarmor.desc=Während der Kleriker diese Mischung aus Stoff und Stahl trägt, kann er eine Spezialfähigkeit einsetzen.

items.armor.clotharmor.name=Stoffrüstung
items.armor.clotharmor.desc=Diese sehr leichte Rüstung bietet einen grundlegenen Schutz.
items.armor.clotharmor.discover_hint=Einer der Helden startet mit diesem Gegenstand.

items.armor.duelistarmor.name=Brustpanzer des Helden
items.armor.duelistarmor.desc=Während sie diese Plattenrüstung und den Umhang trägt, kann die Zweikämpferin eine besondere Fähigkeit einsetzen.

items.armor.huntressarmor.name=Umhang des Helden
items.armor.huntressarmor.no_enemies=Keine Gegner in Sicht.
items.armor.huntressarmor.desc=Während die Jägerin diesen Umhang trägt, kann sie eine besondere Fähigkeit einsetzen.

items.armor.leatherarmor.name=Lederharnisch
items.armor.leatherarmor.desc=Diese Rüstung besteht aus gegerbtem Monsterleder. Der Lederharnisch ist zwar nicht so leicht wie die Stoffrüstung, gewährt aber dafür mehr Schutz.

items.armor.magearmor.name=Robe des Helden
items.armor.magearmor.desc=Während der Magier diese prachtvolle Robe trägt, kann er eine besondere Fähigkeit einsetzen.

items.armor.mailarmor.name=Kettenhemd
items.armor.mailarmor.desc=Verflochtene Metallverbindungen erzeugen eine harte, aber auch flexible Rüstung.

items.armor.platearmor.name=Plattenrüstung
items.armor.platearmor.desc=Riesige Platten aus Metall verbinden sich zu einer mächtigen Rüstung, die jedem, der stark genug ist, ihre atemberaubende Last zu tragen, unvergleichlichen Schutz bietet.

items.armor.roguearmor.name=Gewand des Helden
items.armor.roguearmor.desc=Während der Schurke dieses dunkle Gewand trägt, kann er eine besondere Fähigkeit einsetzen.

items.armor.scalearmor.name=Schuppenrüstung
items.armor.scalearmor.desc=Die Metallschuppen wurden an eine Lederweste angenäht und schaffen damit eine flexible, aber auch schützende Rüstung.

items.armor.warriorarmor.name=Plattenrüstung des Helden
items.armor.warriorarmor.desc=Während er diese schwer gepanzerte Rüstung trägt, kann der Krieger eine besondere Fähigkeit einsetzen.



###artifacts
items.artifacts.alchemiststoolkit.name=tragbares Alchemielabor
items.artifacts.alchemiststoolkit.ac_brew=BRAUEN
items.artifacts.alchemiststoolkit.ac_energize=AUFWÄRMEN
items.artifacts.alchemiststoolkit.not_ready=Dein Labor ist noch nicht auf Betriebstemperatur.
items.artifacts.alchemiststoolkit.cursed=Dein verfluchtes Labor hindert dich daran, Alchemie zu verwenden!
items.artifacts.alchemiststoolkit.need_energy=Du benötigst mindestens 6 Energie dafür.
items.artifacts.alchemiststoolkit.energize_desc=Jeweils 6 Energiekristalle geben dem Labor genügend Energie dafür, eine neue Stufe zu erreichen, was wiederum die Rate der Energieproduktion des Alchemielabors und die Geschwindigkeit seiner Aufwärmung erhöht.\n\nWieviel Energie möchtest du einsetzen?
items.artifacts.alchemiststoolkit.energize_1=6 Energie: +1 Stufe
items.artifacts.alchemiststoolkit.energize_all=%1$d Energie: +%2$d Level
items.artifacts.alchemiststoolkit.desc=Dieses Alchemielabor enthält eine Anzahl von Stoffen und Kräutern sowie eine kleine Mischphiole, was dir "Alchemie unterwegs" ermöglicht. Die Phiole enthält etwas, das aussieht wie flüssige Kristalle alchemischer Energie.
items.artifacts.alchemiststoolkit.desc_cursed=Das verfluchte Laborgerät hat sich an deine Seite gefesselt und verhindert, dass du Alchemie verwenden kannst.
items.artifacts.alchemiststoolkit.desc_warming=Das Alchemielabor wärmt sich gerade auf und wird in Kürze einsatzbereit sein.
items.artifacts.alchemiststoolkit.desc_hint=Das ausgerüstete Alchemielabor generiert langsam alchemische Energie, während du Erfahrung sammelst. Es sieht so aus, als könne man die Mixtur in der Phiole verbessern, wenn man Energiekristalle beimischt.

items.artifacts.artifact.cannot_wear_two=Du kannst nicht zwei gleiche Artefakte tragen.
items.artifacts.artifact.equip_cursed=Das Artefakt bindet sich schmerzhaft an dich.
items.artifacts.artifact.curse_known=Du spürst, dass eine bösartige Magie in diesem Artefakt ruht.
items.artifacts.artifact.not_cursed=Dieses Artefakt ist frei von bösartiger Magie.
items.artifacts.artifact.need_to_equip=Du musst das Artefakt ausrüsten, um das zu tun.

items.artifacts.capeofthorns.name=Dornenumhang
items.artifacts.capeofthorns.desc=Diese kollabierten Metallplatten des DM-300 haben sich zu einem massiven Umhang gebogen. Darin scheint mächtige Energie gespeichert zu sein - vielleicht etwas der Kraft vom DM-300?
items.artifacts.capeofthorns.desc_inactive=Dieser Umhang liegt schwer und beruhigend auf deinen Schultern. Es scheint als gewinne er an Kraft, wenn du Schaden erleidest.
items.artifacts.capeofthorns.desc_active=Der Umhang scheint die gespeicherte Energie freizugeben. Er umgibt dich mit einem schützenden Kraftfeld.
items.artifacts.capeofthorns$thorns.inert=Dein Umhang wird wieder inaktiv.
items.artifacts.capeofthorns$thorns.radiating=Dein Umhang beginnt Energie abzustrahlen! Du fühlst dich geschützt!
items.artifacts.capeofthorns$thorns.levelup=Dein Umhang wird stärker!
items.artifacts.capeofthorns$thorns.name=Dornen
items.artifacts.capeofthorns$thorns.desc=Dein Umhang umgibt dich mit einem abschirmenden Kraftfeld!\n\nDein Schaden ist reduziert, solange der Dornen-Effekt besteht. Und wenn der Angreifer neben dir steht, bekommt er den reduzierten Schadensbetrag ab.\n\nVerbleibende Züge mit Dornen: %s.

items.artifacts.chaliceofblood.name=Kelch des Blutes
items.artifacts.chaliceofblood.ac_prick=STECHEN
items.artifacts.chaliceofblood.yes=Ja, ich weiß was ich tue
items.artifacts.chaliceofblood.no=Nein, habs mir anders überlegt
items.artifacts.chaliceofblood.prick_warn=Jedes Mal, wenn du den Kelch verwendest, entzieht er dir mehr Lebensenergie, erhöht im Gegenzug dafür jedoch deine natürliche Regeneration von Lebenspunkten.\n\nDerzeit wird das Stechen damit dir _%1$d-%2$d_ Schaden zufügen, dieser Schaden kann jedoch _sowohl mit physischem, als auch mit magischem Schutz oder Schadensreduktion_ reduziert werden. Ohne Berücksichtigung von Effekten der Schadensreduktion besteht derzeit eine _Chance von %3$s%%_, dass deine Lebensenergie vollständig ausgelaugt wird.\n\nBist du dir sicher, dass du dem Kelch noch mehr Lebensenergie opfern willst?
items.artifacts.chaliceofblood.onprick=Du stichst dich und dein Blut fließt in den Kelch.
items.artifacts.chaliceofblood.ondeath=Der Kelch saugt dir das Blut aus...
items.artifacts.chaliceofblood.desc=Dieser funkelnde Silberkelch ist am Rand merkwürdig mit spitzen Edelsteinen verziert.
items.artifacts.chaliceofblood.desc_cursed=Der verfluchte Kelch hat sich an deine Hand gefesselt und verhindert, dass sich deine Lebensenergie wieder auflädt.
items.artifacts.chaliceofblood.desc_1=Wenn du den Kelch in deinen Händen hältst, verspürst du den seltsamen Drang, dich mit den spitzen Edelsteinen zu stechen.
items.artifacts.chaliceofblood.desc_2=Ein bisschen deines Blutes ist im Kelch und du spürst, wenn auch schwach, wie er dir Lebensenergie zurückgibt und deine natürliche Regeneration von Lebenspunkten erhöht. Obwohl du weißt, dass es weh tun wird, willst du dich nochmal am Kelch stechen.
items.artifacts.chaliceofblood.desc_3=Der Kelch ist bis zum Rand mit deinem Blut gefüllt. Du spürst wie er dir Lebensenergie zurückgibt.

items.artifacts.cloakofshadows.name=Umhang der Schatten
items.artifacts.cloakofshadows.ac_stealth=TARNUNG
items.artifacts.cloakofshadows.cooldown=Dein Umhang benötigt noch %d Schritte um sich wiederaufzuladen.
items.artifacts.cloakofshadows.cursed=Du kannst keinen verfluchten Umhang verwenden.
items.artifacts.cloakofshadows.no_charge=Dein Umhang ist noch nicht so weit aufgeladen, dass er verwendet werden kann.
items.artifacts.cloakofshadows.desc=Ein unbezahlbarer magischer Umhang, den der Schurke vor vielen Jahren aus der königlichen Rüstungskammer gestohlen hat. Wenn dieser Umhang getragen wird, kann er seinen Träger für kurze Zeit unsichtbar machen.\n\nJe öfter der Umhang verwendet wird, desto mächtiger wird er, was längere und häufigere Verwendung ermöglicht.
items.artifacts.cloakofshadows.discover_hint=Einer der Helden startet mit diesem Gegenstand.
items.artifacts.cloakofshadows$cloakstealth.no_charge=Die Energie deines Umhangs ist aufgebraucht.
items.artifacts.cloakofshadows$cloakstealth.levelup=Dein Umhang wird stärker!
items.artifacts.cloakofshadows$cloakstealth.name=verhüllt
items.artifacts.cloakofshadows$cloakstealth.desc=Dein Umhang der Schatten gewährt dir Unsichtbarkeit, wenn du dich damit verhüllst. Du bleibst verhüllt, bis die Unsichtbarkeit abgebrochen wird oder die Ladungen des Umhangs verbraucht sind.\n\nSolange du unsichtbar bist, können Gegner dich nicht angreifen oder verfolgen. Physische Angriffe oder magische Effekte (wie Schriftrollen und Zauberstäbe) beenden die Unsichtbarkeit sofort. \n\nZüge bis zum Verbrauch der nächsten Ladung: %d.

items.artifacts.driedrose.name=Vertrocknete Rose
items.artifacts.driedrose.ac_summon=BESCHWÖREN
items.artifacts.driedrose.ac_direct=BEFEHLEN
items.artifacts.driedrose.ac_outfit=AUSRÜSTEN
items.artifacts.driedrose.spawned=Du hast den Geist bereits beschworen.
items.artifacts.driedrose.no_charge=Die Rose ist noch nicht vollständig aufgeladen.
items.artifacts.driedrose.cursed=Du kannst keine verfluchte Rose benutzen.
items.artifacts.driedrose.no_space=Es ist kein Platz in deiner Nähe frei.
items.artifacts.driedrose.charged=Die Rose ist vollständig aufgeladen!
items.artifacts.driedrose.desc=Ist das die Rose, über die der Geist sprach, bevor er verschwand? Sie scheint eine spirituelle Energie in sich zu tragen, vielleicht kann man sie benutzen, um die Energie dieses verlorenen Kriegers zu bündeln.
items.artifacts.driedrose.desc_no_quest=Eine vertrocknete, alte Rose, die trotz des Alters noch zusammengehalten wird.\n\nSie scheint eine spirituelle Kraft zu besitzen, aber Du hast zurzeit keine Idee, wie Du sie nutzen könntest.
items.artifacts.driedrose.desc_hint=Ihr scheinen ein paar Blütenblätter zu fehlen. Vielleicht kann die Rose gestärkt werden, indem man sie wieder anbringt.
items.artifacts.driedrose.desc_cursed=Die verfluchte Rose ist an deine Hand gebunden, sie fühlt sich gruselig und kalt an.
items.artifacts.driedrose.desc_weapon=Waffe des Geistes: %s
items.artifacts.driedrose.desc_armor=Rüstung des Geistes: %s
items.artifacts.driedrose.desc_strength=Stärke des Geistes: %s
items.artifacts.driedrose$petal.name=Vertrocknetes Blütenblatt
items.artifacts.driedrose$petal.no_rose=Du hast keine Rose, der du dieses Blütenblatt hinzufügen kannst.
items.artifacts.driedrose$petal.no_room=Es ist kein Platz für dieses Blütenblatt übrig, du wirfst es weg.
items.artifacts.driedrose$petal.maxlevel=Die Rose ist wieder vollständig!
items.artifacts.driedrose$petal.levelup=Du fügst das Blütenblatt der Rose hinzu.
items.artifacts.driedrose$petal.desc=Ein zartes, vertrocknetes Blütenblatt, das so tief im Dungeon irgendwie überlebt hat.
items.artifacts.driedrose$wndghosthero.title=Ausrüstung des Geistes
items.artifacts.driedrose$wndghosthero.desc=Der Geist selbst ist schwach, doch seine Form ist solide genug, um mit einem Schwert und einer Rüstung ausgerüstet zu werden. Er wird in der Lage sein, diese Dinge wie du zu führen.\n\nDer Geist kann zurzeit Gegenstände ausrüsten, die bis zu _%d Stärke benötigen._
items.artifacts.driedrose$wndghosthero.weapon_prompt=Wähle eine Waffe
items.artifacts.driedrose$wndghosthero.armor_prompt=Wähle eine Rüstung
items.artifacts.driedrose$wndghosthero.cant_unique=Der Geist kann keine einzigartigen Gegenstände nutzen.
items.artifacts.driedrose$wndghosthero.cant_cursed=Der Geist kann nur Ausrüstungsgegenstände benutzen, bei denen du dir sicher bist, dass sie nicht verflucht sind.
items.artifacts.driedrose$wndghosthero.cant_strength_unknown=Der Geist ist möglicherweise nicht stark genug.
items.artifacts.driedrose$wndghosthero.cant_strength=Der Geist ist dafür nicht stark genug.

##ghost hero
items.artifacts.driedrose$ghosthero.name=Trauriger Geist
items.artifacts.driedrose$ghosthero.def_verb=ausgewichen
items.artifacts.driedrose$ghosthero.discover_hint=Du kannst diesen Charakter mit einem bestimmten Artefakt finden.

items.artifacts.driedrose$ghosthero.hello=Hallo mal wieder, %s.
items.artifacts.driedrose$ghosthero.introduce=Mein Geist ist an diese Rose gebunden, sie war sehr kostbar für mich - ein Geschenk meiner Geliebten, die ich an der Oberfläche zurücklassen musste.\n\nIch kann sie nicht wiedersehen, aber dank dir bekomme ich noch eine Chance, meine Reise zu vollenden. Wenn ich es schaffe, werde ich deinen Ruf hören und an deiner Seite kämpfen.\n\nSolange du die Rose trägst, kann ich deine Stimme hören, und so kannst du mich aus der Ferne leiten.\n\nHoffentlich kannst du vollbringen, woran ich gescheitert bin...

items.artifacts.driedrose$ghosthero.dialogue_sewers_1=Diese Kanalisation war einst sicher, im Winter haben hier sogar Menschen gelebt.
items.artifacts.driedrose$ghosthero.dialogue_sewers_2=Ich frage mich, was mit den Wachtruppen passiert ist. Haben sie aufgegeben?
items.artifacts.driedrose$ghosthero.dialogue_sewers_3=Ich hatte eine Familie an der Oberfläche. Ich hoffe, es geht ihnen gut.
items.artifacts.driedrose$ghosthero.dialogue_sewers_4=Die Wächter konnten diese Monster nicht besiegen, aber vielleicht schaffen wir es.
items.artifacts.driedrose$ghosthero.dialogue_sewers_5=Wenn schon die Abwasserkanäle so gefährlich sind, dann frage ich mich, was darunter vor sich geht...
items.artifacts.driedrose$ghosthero.dialogue_sewers_6=Was kann das Riesenwachstum dieser Ratten und Krabben verursacht haben?
items.artifacts.driedrose$ghosthero.dialogue_prison_1=Ich habe Geschichten über diesen Ort gehört, aber keine guten.
items.artifacts.driedrose$ghosthero.dialogue_prison_2=Dieser Ort war schon immer mehr Verlies als ein Gefängnis.
items.artifacts.driedrose$ghosthero.dialogue_prison_3=Ich kann mir nicht vorstellen, was vor sich gegangen sein muss, als dieser Ort verlassen wurde.
items.artifacts.driedrose$ghosthero.dialogue_prison_4=Es scheint, als wären sowohl Gefangene als auch Wächter in Monster verwandelt worden.
items.artifacts.driedrose$ghosthero.dialogue_prison_5=Was könnte für all diese Skelette verantwortlich sein?
items.artifacts.driedrose$ghosthero.dialogue_prison_6=Diese Menschen hätten nicht so enden müssen...
items.artifacts.driedrose$ghosthero.dialogue_caves_1=Hier ist schon sehr lange Zeit kein Mensch oder Zwerg gewesen.
items.artifacts.driedrose$ghosthero.dialogue_caves_2=Was könnte Zwerge dazu bringen, eine Goldmine aufzugeben?
items.artifacts.driedrose$ghosthero.dialogue_caves_3=Es ist eine Schande, dass all dieses Gold an der Oberfläche nutzlos ist.
items.artifacts.driedrose$ghosthero.dialogue_caves_4=Die Kreaturen hier sind verdorben, genau wie in der Kanalisation.
items.artifacts.driedrose$ghosthero.dialogue_caves_5=Selbst die Fledermäuse sind hier blutdurstig.
items.artifacts.driedrose$ghosthero.dialogue_caves_6=Keine Spur von Bergbaumaschinen, haben die Zwerge sie alle geborgen?
items.artifacts.driedrose$ghosthero.dialogue_city_1=Die Zwerge waren fleißig, aber auch gierig.
items.artifacts.driedrose$ghosthero.dialogue_city_2=Also ist die Zwergenmetropole wirklich gefallen.
items.artifacts.driedrose$ghosthero.dialogue_city_3=Ich hoffe, die Oberfläche endet nie wie dieser Ort.
items.artifacts.driedrose$ghosthero.dialogue_city_4=Zwerge sollten nicht so blass aussehen.
items.artifacts.driedrose$ghosthero.dialogue_city_5=Ich weiß nicht, was schlimmer ist, diese Zwerge oder ihre Geschöpfe.
items.artifacts.driedrose$ghosthero.dialogue_city_6=Es sieht so aus, als seien die Zwerge nun ebenfalls geistlose Monster.
items.artifacts.driedrose$ghosthero.dialogue_halls_1=Was ist das für ein Ort?
items.artifacts.driedrose$ghosthero.dialogue_halls_2=Dieser Ort ist grauenhaft...
items.artifacts.driedrose$ghosthero.dialogue_halls_3=Was haben sich die Zwerge dabei gedacht, mit solchen Mächten herumzuspielen?
items.artifacts.driedrose$ghosthero.dialogue_halls_4=Die Monster hier wirken wie aus einer anderen Welt, woher sind sie gekommen?
items.artifacts.driedrose$ghosthero.dialogue_halls_5=Spürst du das auch? Es ist, als würde uns jemand beobachten.
items.artifacts.driedrose$ghosthero.dialogue_halls_6=Zum Glück gibt es Fackeln, es ist so dunkel hier!
items.artifacts.driedrose$ghosthero.dialogue_ascension_1=Warum passiert das, ich dachte, wir haben es geschafft?
items.artifacts.driedrose$ghosthero.dialogue_ascension_2=Wie kann dieses Ding immer noch Einfluss auf die Welt haben?
items.artifacts.driedrose$ghosthero.dialogue_ascension_3=Ich hoffe, du weißt, was du mit diesem Amulett machst.
items.artifacts.driedrose$ghosthero.dialogue_ascension_4=Ich nehme an, wir sind noch nicht ganz fertig.
items.artifacts.driedrose$ghosthero.dialogue_ascension_5=Wir sind nun einmal schon so weit, wir schaffen es bis zum Ende!
items.artifacts.driedrose$ghosthero.dialogue_ascension_6=Nur noch etwas weiter, wir können es hier heraus schaffen!

items.artifacts.driedrose$ghosthero.seen_goo_1=Vorsicht vor dem Schleim!
items.artifacts.driedrose$ghosthero.seen_goo_2=Viele meiner Freunde sind durch dieses Ding gestorben. Zeit für Rache!
items.artifacts.driedrose$ghosthero.seen_goo_3=So eine Scheußlichkeit darf nicht leben!
items.artifacts.driedrose$ghosthero.seen_tengu_1=Der einzige verbliebene Gefangene ist ein Meuchelmörder. War ja klar...
items.artifacts.driedrose$ghosthero.seen_tengu_2=Er hat uns gefangen!
items.artifacts.driedrose$ghosthero.seen_tengu_3=Ich habe schreckliche Geschichten über diese Maske gehört...
items.artifacts.driedrose$ghosthero.seen_dm300_1=Nur Zwerge konnten eine Bergbaumaschine entwickeln, die auch Eindringlinge tötet.
items.artifacts.driedrose$ghosthero.seen_dm300_2=Dieses Ding ist ja riesig...
items.artifacts.driedrose$ghosthero.seen_dm300_3=Wie konnte dieses Ding nur so lange aktiv bleiben?
items.artifacts.driedrose$ghosthero.seen_king_1=Das meinen die Leute wohl, wenn sie sagen, dass Macht einen verdirbt.
items.artifacts.driedrose$ghosthero.seen_king_2=Er ist jetzt mehr ein Leichnam als ein König!
items.artifacts.driedrose$ghosthero.seen_king_3=Sogar im Tod folgen die Zwerge ihrem Herren.
items.artifacts.driedrose$ghosthero.seen_yog_1=Oh, das sieht nicht gut aus.
items.artifacts.driedrose$ghosthero.seen_yog_2=So sieht also eine Gottheit aus?
items.artifacts.driedrose$ghosthero.seen_yog_3=Das wird weh tun...

items.artifacts.driedrose$ghosthero.defeated_by_enemy_1=Viel Glück...
items.artifacts.driedrose$ghosthero.defeated_by_enemy_2=Müde... zumindest jetzt...
items.artifacts.driedrose$ghosthero.defeated_by_enemy_3=Ich werde zurückkommen...
items.artifacts.driedrose$ghosthero.defeated_by_boss_1=Es tut mir leid... Viel Glück...
items.artifacts.driedrose$ghosthero.defeated_by_boss_2=Beende es... ohne mich...
items.artifacts.driedrose$ghosthero.defeated_by_boss_3=Nein... ich kann nicht...
items.artifacts.driedrose$ghosthero.blessed_ankh_1=Wie hast du das überlebt?
items.artifacts.driedrose$ghosthero.blessed_ankh_2=Ich wünschte, ich hätte einen von denen...
items.artifacts.driedrose$ghosthero.blessed_ankh_3=Meine Güte! Du lebst noch!
items.artifacts.driedrose$ghosthero.player_killed_1=Nein!...
items.artifacts.driedrose$ghosthero.player_killed_2=Ich konnte ihnen nicht helfen...
items.artifacts.driedrose$ghosthero.player_killed_3=Nicht so...

items.artifacts.driedrose$ghosthero.direct_prompt=Was soll ich machen?
items.artifacts.driedrose$ghosthero.directed_follow_1=Gut, ich folge dir.
items.artifacts.driedrose$ghosthero.directed_follow_2=Ich werde hinter dir bleiben.
items.artifacts.driedrose$ghosthero.directed_follow_3=Folge dir...
items.artifacts.driedrose$ghosthero.directed_follow_4=In Ordnung, auf geht’s!
items.artifacts.driedrose$ghosthero.directed_follow_5=Ich halte dir den Rücken frei.
items.artifacts.driedrose$ghosthero.directed_attack_1=Okay, ich greife das da an.
items.artifacts.driedrose$ghosthero.directed_attack_2=Ich werde den schon kriegen.
items.artifacts.driedrose$ghosthero.directed_attack_3=Attackieren...
items.artifacts.driedrose$ghosthero.directed_attack_4=Holen wir uns die!
items.artifacts.driedrose$ghosthero.directed_attack_5=Den habe ich.
items.artifacts.driedrose$ghosthero.directed_position_1=Okay, ich bewache diese Stelle.
items.artifacts.driedrose$ghosthero.directed_position_2=Ich werde dorthin gehen und kämpfen.
items.artifacts.driedrose$ghosthero.directed_position_3=Ändere meine Position...
items.artifacts.driedrose$ghosthero.directed_position_4=Schon unterwegs!
items.artifacts.driedrose$ghosthero.directed_position_5=Ich gehe dorthin.

items.artifacts.driedrose$ghosthero.desc=Ein zierlich aussehendes, schemenhaftes Wesen von menschlicher Gestalt. Ihre Macht ist an die Rose gebunden, die du hast.\n\nDieser Geist mag nicht viel hermachen, aber er scheint dein einziger echter Freund hier unten zu sein.

##back to artifacts
items.artifacts.etherealchains.name=Ätherketten
items.artifacts.etherealchains.ac_cast=AUSWERFEN
items.artifacts.etherealchains.rooted=Deine Ketten können dich nicht ziehen, solange du verwurzelt bist.
items.artifacts.etherealchains.no_charge=Deine Ketten sind nicht ausreichend aufgeladen.
items.artifacts.etherealchains.cursed=Du kannst verfluchte Ketten nicht verwenden.
items.artifacts.etherealchains.does_nothing=Das wird gar nichts bewirken.
items.artifacts.etherealchains.cant_pull=Deine Kette kann dieses Ziel nicht ziehen.
items.artifacts.etherealchains.cant_reach=Deine Kette können diesen Ort nicht erreichen.
items.artifacts.etherealchains.inside_wall=Deine Kette kann dich durch Wände ziehen, aber nicht hinein.
items.artifacts.etherealchains.nothing_to_grab=Dort ist nichts zu greifen.
items.artifacts.etherealchains.prompt=Wähle eine Zielposition.
items.artifacts.etherealchains.desc=Diese lange, aber leichte Kette glüht mit spiritueller Energie. Sie kann verwendet werden, um sich in Richtung von Wänden oder um Gegner zu sich zu ziehen. Die ätherische Natur dieser Ketten erlaubt sogar durch Wände geschleudert zu werden.
items.artifacts.etherealchains.desc_cursed=Die verfluchten Ketten klammern sich unlösbar um dich, zerren an dir und versuchen, dich zu fesseln oder dich stürzen zu lassen.
items.artifacts.etherealchains.desc_equipped=Die Kette hängt an deiner Seite und saugt langsam die spirituelle Energie derer auf, die du besiegst. Jede Ladung entspricht einem Kettenglied, das genau eine Kachel weit reicht.
items.artifacts.etherealchains$chainsrecharge.levelup=Deine Kette wird stärker!

items.artifacts.holytome.name=heiliger Foliant
items.artifacts.holytome.ac_cast=AUSWERFEN
items.artifacts.holytome.no_spell=Du kannst diesen Zauber gerade nicht sprechen.
items.artifacts.holytome.cursed=Du kannst ein verfluchtes Zauberbuch nicht benutzen.
items.artifacts.holytome.levelup=Dein Zauberbuch wurde stärker!
items.artifacts.holytome.desc=Ein heiliger Foliant, der als Fokus für die göttliche Magie des Klerikers fungiert. Mithilfe des Folianten kann der Kleriker eine Vielzahl von Zaubersprüchen wirken.\n\nWährend der Kleriker den Folianten verwendet, wird dieser mit der Zeit immer mächtiger, wodurch der Kleriker mehr maximale Ladungen erhält und sich die Aufladerate leicht erhöht.
items.artifacts.holytome.discover_hint=Einer der Helden startet mit diesem Gegenstand.

items.artifacts.hornofplenty.name=Horn des Überflusses
items.artifacts.hornofplenty.ac_snack=IMBISS
items.artifacts.hornofplenty.ac_eat=ESSEN
items.artifacts.hornofplenty.ac_store=FÜTTERN
items.artifacts.hornofplenty.eat=Du isst aus dem Horn.
items.artifacts.hornofplenty.prompt=Wähle etwas zu Essen aus
items.artifacts.hornofplenty.no_food=In deinem Horn ist nichts zu essen!
items.artifacts.hornofplenty.full=Dein Horn ist voll mit Essen!
items.artifacts.hornofplenty.reject=Dein Horn spuckt die ungekochte Fadfrucht wieder aus.
items.artifacts.hornofplenty.maxlevel=Dein Horn hat so viel Essen konsumiert wie es kann!
items.artifacts.hornofplenty.levelup=Dein Horn hat die Nahrungsspende verzehrt und wird stärker!
items.artifacts.hornofplenty.feed=Das Horn hat dein Nahrungsopfer verzehrt.
items.artifacts.hornofplenty.desc=Man kann nicht in dieses Horn blasen, aber es füllt sich nach und nach mit Lebensmitteln, wenn man es ausrüstet und an Erfahrung gewinnt. Du kannst jede Ladung einzeln als Imbiss genießen oder essen, bis du voll bist.
items.artifacts.hornofplenty.desc_hint=Vielleicht ist es möglich, die Kräfte des Horns zu erhöhen, wenn man ihm Nahrung gibt.
items.artifacts.hornofplenty.desc_cursed=Das verfluchte Horn hat sich an dich gebunden und scheint begierig darauf dir Essen zu entreißen anstatt es zu produzieren.

items.artifacts.lloydsbeacon.name=Iloyds Leuchtfeuerstab
items.artifacts.lloydsbeacon.ac_zap=FEUERN
items.artifacts.lloydsbeacon.ac_set=FESTLEGEN
items.artifacts.lloydsbeacon.ac_return=RÜCKKEHR
items.artifacts.lloydsbeacon.no_charge=Dein Leuchtfeuer-Stab hat im Moment nicht genug Energie.
items.artifacts.lloydsbeacon.tele_fail=Die Teleportationsmagie versagt.
items.artifacts.lloydsbeacon.prompt=Wähle ein Feld, auf das gefeuert werden soll.
items.artifacts.lloydsbeacon.levelup=Dein Leuchtfeuer-Stab wird stärker!
items.artifacts.lloydsbeacon.preventing=Die starke magische Aura dieses Ortes verhindert, dass du Iloyds Leuchtfeuerstab verwenden kannst!
items.artifacts.lloydsbeacon.creatures=Die psychische Aura naher Kreaturen erlaubt es dir nicht, Iloyds Leuchtfeuerstab zu verwenden.
items.artifacts.lloydsbeacon.return=Lloyds Leuchtfeuerstab wurde erfolgreich auf deine momentane Position gepeilt und erlaubt dir jederzeit hierher zurückzukehren.
items.artifacts.lloydsbeacon.desc=Lloyds Leuchtfeuerstab ist ein kompliziertes, magisches Gerät, das es seinem Benutzer erlaubt, Teleportationsmagie anzuwenden. Er ermöglicht es, an vorher festgelegte Positionen zurückzukehren, ermöglicht aber auch zufällige Teleportationen, sofern er durch das Ausrüsten aufgeladen wurde. Diese Teleportationen können auf beliebige Ziele oder auf sich selbst gerichtet werden.
items.artifacts.lloydsbeacon.desc_set=Das Leuchtfeuer wurde irgendwo auf Ebene %d gesetzt.

items.artifacts.masterthievesarmband.name=Armband des Meisterdiebes
items.artifacts.masterthievesarmband.ac_steal=STEHLEN
items.artifacts.masterthievesarmband.no_charge=Dein Armband hat noch nicht genügend Ladung.
items.artifacts.masterthievesarmband.cursed=Du kannst kein verfluchtes Armband benutzen.
items.artifacts.masterthievesarmband.full=Dein Armband ist vollständig aufgeladen!
items.artifacts.masterthievesarmband.prompt=Wähle einen Feind aus, auf den du zielen möchtest
items.artifacts.masterthievesarmband.no_target=Du musst auf einen Feind zielen, der direkt neben dir steht.
items.artifacts.masterthievesarmband.steal_shopkeeper=Du kannst nicht direkt von Händlern stehlen.
items.artifacts.masterthievesarmband.no_steal=Dieser Feind hat nichts, was man stehlen könnte.
items.artifacts.masterthievesarmband.stole_item=Du hast gestohlen: %s.
items.artifacts.masterthievesarmband.failed_steal=Du hast es nicht geschafft, etwas zu stehlen.
items.artifacts.masterthievesarmband.level_up=Dein Armband wird stärker!
items.artifacts.masterthievesarmband.desc=Dieses purpurne Seidenarmband ziert das Symbol eines Meisterdiebes. Es gehört dir zwar nicht, aber wahrscheinlich gehörte es seinem vorigen Nutzer auch nicht.
items.artifacts.masterthievesarmband.desc_cursed=Das verfluchte Armband ist fest an deinem Handgelenk und irgendwie scheint dein Goldbeutel immer leichter zu werden...
items.artifacts.masterthievesarmband.desc_worn=Du fühlst, wie sich im Armband an deinem Handgelenk Energie aufbaut, während du Erfahrung sammelst. Diese Energie kannst du nutzen, um aus Läden zu stehlen oder Feinde auszurauben!\n\nFeinde ausrauben passiert augenblicklich, sie werden kurz desorientiert, was dir Gelegenheit gibt, ihnen abzunehmen, was auch immer sie dabeihaben! Diese Fähigkeit ist wirkungsvoller gegen ahnungslose Feinde. Den selben Feind mehrmals auszurauben bringt keine zusätzliche Beute ein.

items.artifacts.sandalsofnature.name=Sandalen der Natur
items.artifacts.sandalsofnature.name_1=Schuhe der Natur
items.artifacts.sandalsofnature.name_2=Stiefel der Natur
items.artifacts.sandalsofnature.name_3=Beinschienen der Natur
items.artifacts.sandalsofnature.ac_feed=FÜTTERN
items.artifacts.sandalsofnature.ac_root=VERWURZELN
items.artifacts.sandalsofnature.prompt=Wähle ein Samenkorn
items.artifacts.sandalsofnature.levelup=Das Schuhwerk wächst rapide!
items.artifacts.sandalsofnature.absorb_seed=Das Schuhwerk absorbiert das Samenkorn, es sieht gesünder aus.
items.artifacts.sandalsofnature.no_effect=Du musst deinen Schuhen erst einen Samen verfüttern.
items.artifacts.sandalsofnature.low_charge=Deine Schuhe haben dafür nicht genug Energie.
items.artifacts.sandalsofnature.prompt_target=Wähle einen Ort
items.artifacts.sandalsofnature.out_of_range=Dieser Ort ist außer Reichweite.
items.artifacts.sandalsofnature.desc_1=Was ursprünglich wie ein paar Sandalen aus Lianen aussah, sind in Wahrheit zwei Pflanzen! Sie scheinen sehr schwach und blass, vielleicht brauchen sie Nährstoffe?
items.artifacts.sandalsofnature.desc_2=Das Schuhwerk ist gewachsen und sieht nun eher wie ein paar maßgeschneiderter Schuhe aus. Es hat wieder etwas Farbe bekommen; vielleicht kann es noch weiter wachsen?
items.artifacts.sandalsofnature.desc_3=Die Pflanzen sind erneut gewachsen und haben nun Ähnlichkeit mit einem Paar solider Schuhe aus Rinde. Die Pflanzen scheinen ihre Kraft zurückerlangt zu haben, vielleicht können sie aber noch weiter wachsen?
items.artifacts.sandalsofnature.desc_4=Die Pflanzen scheinen ausgewachsen zu sein, sie ähneln bewehrten Beinschienen. Sie sind braun und sehen wie kräftige Bäume aus.
items.artifacts.sandalsofnature.desc_hint=Mit diesem Artefakt fühlst du dich mehr mit der Natur verbunden.
items.artifacts.sandalsofnature.desc_cursed=Die verfluchten Sandalen verhindern jegliche Einstimmung auf die Natur.
items.artifacts.sandalsofnature.desc_ability=Die Schuhe haben eine Schattierung der Farbe des Samens, den du ihnen zuletzt verfüttert hast. Sie können sich kurzzeitig im Erdboden verwurzeln und den Effekt der jeweiligen Pflanze irgendwo in einem Radius von 3 Feldern hervorrufen.\nSamen: _%s_\nBenötigte Ladungen: _%d%%_
items.artifacts.sandalsofnature.desc_seeds=Du hast dem Schuhwerk %d Samen gefüttert.

items.artifacts.skeletonkey.name=Skelettschlüssel
items.artifacts.skeletonkey.ac_insert=EINSETZEN
items.artifacts.skeletonkey.cursed=Du kannst keinen verfluchten Skelettschlüssel verwenden.
items.artifacts.skeletonkey.prompt=Wähle ein Ziel
items.artifacts.skeletonkey.invalid_target=Hier gibt es nichts, das man auf- oder abschließen könnte.
items.artifacts.skeletonkey.lock_no_space=Du kannst niemanden, der in einer Tür steht, abschließen!
items.artifacts.skeletonkey.iron_charges=Es kostet 1 Ladung, ein normales Schloss zu öffnen.
items.artifacts.skeletonkey.gold_charges=Es kostet 2 Ladungen, ein goldenes Schloss zu öffnen.
items.artifacts.skeletonkey.lock_charges=Es kostet 2 Ladungen, eine Tür abzuschließen.
items.artifacts.skeletonkey.wall_charges=Es kostet 2 Ladungen, eine temporäre Wand zu erschaffen.
items.artifacts.skeletonkey.crystal_charges=Es kostet 5 Ladungen, ein Kristallschloss zu öffnen.
items.artifacts.skeletonkey.wont_open=Aus irgendeinem Grund weigert sich der Schlüssel, in dieses Schloss zu passen.
items.artifacts.skeletonkey.locked_with_key=Die Tür wurde mit deinem Skelettschlüssel verschlossen.
items.artifacts.skeletonkey.force_lock=Das Schloss ist ohne deinen Skelettschlüssel marode geworden. Du schaffst es, es aufzubrechen.
items.artifacts.skeletonkey.discard=Du wirfst deine überflüssigen Schlüssel weg.
items.artifacts.skeletonkey.levelup=Dein Skelettschlüssel wird stärker!
items.artifacts.skeletonkey.desc=Ein wichtig aussehender Schlüssel, dessen Reide wie ein Schädel geformt ist. Jedes mal, wenn du darauf schaust, scheinen die Zähne anders angeordnet zu sein.
items.artifacts.skeletonkey.desc_worn=Dieser magische Schlüssel scheint stärker zu werden, wenn du ihn anstelle der normalen Schlüssel im Dungeon benutzt. Er kann in fast jedes Schloss des Dungeons gesteckt werden, um es entweder zu öffnen oder zu verschließen. Es funktioniert sogar bei Schlössern, dessen Türen zuvor nicht verschlossen waren.Zudem kann der Schlüssel in freiem Räumen in eine der vier Himmelsrichtungen oder diagonal verwendet werden, um die Luft vor dir zu ‚verschließen‘. Dadurch entsteht eine drei Felder breite Barriere, die 10 Züge lang bestehen bleibt. Bei diesem Vorgang werden Gegner weggestoßen, sofern genügend Platz dafür vorhanden ist.
items.artifacts.skeletonkey.desc_cursed=Der verfluchte Schlüssel scheint aktiv zu vermeiden, in irgendein Schloss zu passen, und erschwert dir sogar die Nutzung deiner anderen Schlüssel – wenn auch nicht völlig.
items.artifacts.skeletonkey$keywall.desc=Eine temporäre magische Barriere wurde hier mithilfe des Skelettschlüssels erschaffen.

items.artifacts.talismanofforesight.name=Talisman der Vorsehung
items.artifacts.talismanofforesight.ac_scry=VORHERSEHUNG
items.artifacts.talismanofforesight.low_charge=Dieser Talisman benötigt mindestens 5% Ladung, um vorauszuschauen.
items.artifacts.talismanofforesight.prompt=Wähle ein Feld zum Untersuchen.
items.artifacts.talismanofforesight.levelup=Dein Talisman wird stärker!
items.artifacts.talismanofforesight.full_charge=Dein Talisman ist vollständig aufgeladen!
items.artifacts.talismanofforesight.desc=Ein glatter Stein mit merkwürdigen Gravuren. Es kommt dir vor, als würde er alles um dich herum beobachten und ein Auge für Verstecktes offen halten.
items.artifacts.talismanofforesight.desc_worn=Als du den Talisman umhängst, spürst du, wie sich deine Sinne schärfen. Der Talisman lädt sich langsam auf, wenn Zeit vergeht und wenn du versteckte Türen oder Fallen aufdeckst.\n\nDer Talisman kann seine Ladung einsetzen, um alle Geheimnisse in einem kegelförmigen Gebiet zu enthüllen, und erlaubt dir, Gegner und Gegenstände für kurze Zeit zu sehen.
items.artifacts.talismanofforesight.desc_cursed=Der verfluchte Talisman starrt dich an, was deine Sinne abschwächt.
items.artifacts.talismanofforesight$foresight.name=Vorhersehung
items.artifacts.talismanofforesight$foresight.uneasy=Du fühlst dich unwohl.
items.artifacts.talismanofforesight$foresight.desc=Du bist nervös. Als wäre eine unsichtbare Gefahr in der Nähe.

items.artifacts.timekeepershourglass.name=Stundenglas des Hüters der Zeit
items.artifacts.timekeepershourglass.ac_activate=AKTIVIEREN
items.artifacts.timekeepershourglass.deactivate=Du beendest die Unterbrechung des Laufs der Zeit.
items.artifacts.timekeepershourglass.no_charge=Deine Sanduhr hat sich noch nicht genug aufgeladen.
items.artifacts.timekeepershourglass.cursed=Du kannst eine verfluchte Sanduhr nicht verwenden.
items.artifacts.timekeepershourglass.onstasis=Die Welt scheint sich in einem Augenblick verändert zu haben.
items.artifacts.timekeepershourglass.onfreeze=Deine Umgebung friert urplötzlich ein.
items.artifacts.timekeepershourglass.stasis=Versetze mich selbst in Stasis
items.artifacts.timekeepershourglass.freeze=Friere die Zeit ein
items.artifacts.timekeepershourglass.prompt=Wie möchtest du die Magie der Sanduhr verwenden?\n\nIn Stasis läuft die Zeit normal weiter, während du eingefroren und absolut unverwundbar bist. Verbraucht bis zu 2 Ladungen auf einmal.\n\nWenn die Zeit eingefroren ist, kannst du dich bewegen, als würden deine Handlungen keine Zeit beanspruchen. Ein Angriff oder das Benutzen der Sanduhr stoppt den Effekt.
items.artifacts.timekeepershourglass.desc=Diese große, verzierte Sanduhr sieht nicht danach aus, doch du fühlst, dass eine große Macht von diesem Gebilde ausgeht. Wenn du die Sanduhr drehst und den rieselnden Sand beobachtest, spürst du, wie seine Magie dich in ihren Bann zieht. Diese Magie gibt dir sicher etwas Kontrolle über die Zeit.
items.artifacts.timekeepershourglass.desc_hint=Die Sanduhr scheint Sand verloren zu haben. Wenn du nur welchen finden könntest...
items.artifacts.timekeepershourglass.desc_cursed=Die verfluchte Sanduhr ist an dich gefesselt, und du spürst, wie sie versucht, deinen Zeitfluss zu manipulieren.
items.artifacts.timekeepershourglass$timefreeze.name=Zeit einfrieren
items.artifacts.timekeepershourglass$timefreeze.desc=Die Zeit um dich herum ist eingefroren, so dass du Aktionen augenblicklich ausführen kannst. Dieser Effekt hält an, bis er abgebrochen wird oder deine Sanduhr keine Ladung mehr hat. Auch ein Angriff oder die Verwendung von Magie wird diesen Effekt beenden.\n\nZüge bis zum Einsatz einer Ladung: %s.
items.artifacts.timekeepershourglass$sandbag.name=Beutel mit magischem Sand
items.artifacts.timekeepershourglass$sandbag.levelup=Du hast den Sand in deine Sanduhr gefüllt.
items.artifacts.timekeepershourglass$sandbag.maxlevel=Deine Sanduhr ist mit magischem Sand gefüllt!
items.artifacts.timekeepershourglass$sandbag.no_hourglass=Du hast keine Sanduhr, in die du diesen Sand geben könntest.
items.artifacts.timekeepershourglass$sandbag.desc=Dieser kleine Beutel feinen Sandes ist perfekt geeignet für deine Sanduhr.\n\nMerkwürdig, dass der Händler diesen Gegenstand genau dann hat, wenn du ihn brauchst...

items.artifacts.unstablespellbook.name=Instabiles Zauberbuch
items.artifacts.unstablespellbook.ac_read=LESEN
items.artifacts.unstablespellbook.ac_add=HINZUFÜGEN
items.artifacts.unstablespellbook.blinded=Solange du blind bist kannst du nicht im Buch lesen.
items.artifacts.unstablespellbook.no_charge=Dein Zauberbuch hat im Moment keine Energie.
items.artifacts.unstablespellbook.cursed=Du kannst nicht in einem verfluchten Zauberbuch lesen.
items.artifacts.unstablespellbook.prompt=Wähle eine Schriftrolle
items.artifacts.unstablespellbook.infuse_scroll=Du fügst die Energie der Schriftrolle dem Buch hinzu.
items.artifacts.unstablespellbook.unable_scroll=Du kannst dem Buch diese Schriftrolle nicht hinzufügen.
items.artifacts.unstablespellbook.unknown_scroll=Du weißt noch nicht, was das für eine Schriftrolle ist.
items.artifacts.unstablespellbook.desc=Dieses Buch ist in erstaunlich gutem Zustand für sein Alter. Während du durch die Seiten blätterst, zischt und knistert es, pulsiert mit instabiler Energie. Wenn du aus diesem Buch liest, lässt sich nicht vorhersagen, welchen Zauberspruch du dadurch hervorbringst.
items.artifacts.unstablespellbook.desc_cursed=Das verfluchte Buch hat sich an dich gebunden, es hindert dich daran die meisten Schriftrollen lesen zu können.
items.artifacts.unstablespellbook.desc_index=Das Verzeichis des Buches ist unvollständig und weist im Moment auf die folgenden leeren Seiten hin:
items.artifacts.unstablespellbook.desc_empowered=Die Schriftrollen, die du dem Buch hinzugefügt hast, pulsieren vor Macht. Du kannst die exotische Variante der Effekte dieser Schriftrollen wählen, aber das kostet eine zusätzliche Ladung.
items.artifacts.unstablespellbook.read_empowered=Die Schriftrolle, die du zum Zauberbuch hinzugefügt hast, strotzt vor Energie. Du kannst entweder die normale oder die exotische Variante des Effekts von diesem Zauberspruch kanalisieren.\n\nWählst du die exotische Variante, kostet das 2 Ladungen anstelle von 1.



###bags
items.bags.bag.name=Rucksack
items.bags.bag.discover_hint=Du kannst diesen Gegenstand in einem Laden kaufen.

items.bags.potionbandolier.name=Trank-Bandelier
items.bags.potionbandolier.desc=Dieses dicke Bandelier liegt eng an deiner Brust an, ähnlich wie eine Schärpe; es viele kleine Schlaufen, in denen du deine Tränke, deinen Wasserschlauch oder Fläschchen mit flüssigem Metall sicher verstauen kannst.\n\nWährend sie in den Taschen sind, sollten deine Tränke gut vor Kälte geschützt sein.

items.bags.scrollholder.name=Schriftrollen-Rolle
items.bags.scrollholder.desc=Dieser röhrenförmige Behälter sieht aus, als würde er die Werkzeuge und Karten eines Astronomen enthalten, aber deine Schriftrollen passen genauso gut hinein. Es gibt sogar ein paar Seitenfächer, in die Zauberkristalle, arkane Stifte und arkanes Harz passen.\n\nDer Behälter sieht nicht sehr entflammbar aus, deine Schriftrollen sollten also darin vor Feuer sicher sein.

items.bags.velvetpouch.name=Samtbeutel
items.bags.velvetpouch.desc=Dieser kleine Samtbeutel kann viel kleine Gegenstände aufnehmen, wie beispielsweise Samen, Runensteine und einige Alchemie-Zutaten.
items.bags.velvetpouch.discover_hint=Einer der Helden startet mit diesem Gegenstand.

items.bags.magicalholster.name=Magisches Holster
items.bags.magicalholster.desc=Dieses schlanke Holster besteht aus einer exotischen Tierhaut und besitzt eine mächtige Magie, die es ermöglicht, eine große Anzahl an Fernkampfwaffen aufzubewahren.\n\nDu kannst einfach in die Tasche greifen und nimmst immer den gesuchten Gegenstand heraus.\n\nDie Magie des Holsters sorgt dafür, dass Zauberstäbe ein wenig schneller laden und Geschosse etwas länger halten.



###bombs
items.bombs.arcanebomb.name=Arkane Bombe
items.bombs.arcanebomb.desc=Diese Bombe wurde mit arkanen Eigenschaften versehen und explodiert mit enormem Druck, ähnlich dem Angriff des aufgeblasenen Schleims. Sie verursacht _%1$d-%2$dPunkte magischen Schadens_ innerhalb von 2 Feldern.
items.bombs.arcanebomb.discover_hint=Du kannst diesen Gegenstand mit Alchemie herstellen.

items.bombs.bomb.name=Bombe
items.bombs.bomb.ac_lightthrow=ANZÜNDEN & WERFEN
items.bombs.bomb.snuff_fuse=Du hast die Lunte der Bombe ganz schnell wieder gelöscht.
items.bombs.bomb.ondeath=Die Explosion hat dich getötet...
items.bombs.bomb.rankings_desc=Von einer Explosion getötet worden
items.bombs.bomb.desc=Eine ziemlich große Schwarzpulverbombe. Eine Explosion dieser Bombe verursacht _%1$d-%2$d Punkte Schaden_ an allem, was in der Nähe ist und wird manches an benachbartem Terrain oder Gegenständen zerstören.
items.bombs.bomb.desc_fuse=Es scheint, als ob die Zündschnur eine Weile benötigt, um abzubrennen, sobald sie angezündet wird.
items.bombs.bomb.desc_burning=Die Zündschnur brennt gerade, also halte Abstand oder lösche sie!
items.bombs.bomb$doublebomb.name=zwei Bomben
items.bombs.bomb$doublebomb.desc=Hier liegen zwei große Schwarzpulver-Bomben! Die zweite gibt es anscheinend obendrauf!

items.bombs.firebomb.name=Feuerbombe
items.bombs.firebomb.desc=Diese Bombe wurde so verändert, dass sie _%1$d-%2$dSchadenspunkte_ verursacht und innerhalb von 2 Feldern einen anhaltenden Feuersturm verursacht.
items.bombs.firebomb.discover_hint=Du kannst diesen Gegenstand mit Alchemie herstellen.

items.bombs.flashbangbomb.name=Blendbombe
items.bombs.flashbangbomb.desc=Diese maßgeschneiderte Bombe detoniert in einer Explosion aus Licht, Ton und Elektrizität. Alles im Umkreis von 2 Feldern erleidet _%1$d- %2$d Schaden_ durch die Explosion, zusätzlich 25%% Schaden durch die Elektrizität und wird 10 Züge lang betäubt.
items.bombs.flashbangbomb.discover_hint=Du kannst diesen Gegenstand mit Alchemie herstellen.

items.bombs.frostbomb.name=Frostbombe
items.bombs.frostbomb.desc=Diese Bombe wurde so verändert, dass sie _%1$d-%2$d Schadenspunkte_ verursacht und innerhalb von 2 Feldern einen eiskalten Windstoß verursacht.
items.bombs.frostbomb.discover_hint=Du kannst diesen Gegenstand mit Alchemie herstellen.

items.bombs.holybomb.name=gesegnete Bombe
items.bombs.holybomb.desc=Diese Bombe wurde so verändert, dass sie heiliges Licht in einem großen Bereich entfesselt, wenn sie explodiert. Alles in einem Umkreis von 2 Feldern wird von der Explosion _%1$d-%2$d Punkte_ Schaden nehmen und untote oder dämonische Gegner nehmen zusätzliche 50%% Punkte Schaden von dem heiligen Licht.
items.bombs.holybomb.discover_hint=Du kannst diesen Gegenstand mit Alchemie herstellen.

items.bombs.noisemaker.name=Knallbombe
items.bombs.noisemaker.desc=Diese Bombe wurde so verändert, dass sie regelmäßig Geräusche macht, wenn du sie anzündest. Wenn dann etwas die Bombe berührt, wird sie explodieren und an allem im Umkreis von 2 Feldern _%1$d-%2$d Punkte_ Schaden verursachen.
items.bombs.noisemaker.desc_burning=Die Knallbombe beginnt zu ticken, sie wird explodieren, wenn etwas in ihre Nähe kommt!
items.bombs.noisemaker.discover_hint=Du kannst diesen Gegenstand mit Alchemie herstellen.

items.bombs.smokebomb.name=Rauchbombe
items.bombs.smokebomb.desc=Diese Bombe wurde so verändert, dass sie eine dicke Wolke Gas ausstößt, sobald sie explodiert. Sie wird _%1$d-%2$d Schadenspunkte_ verursachen und im Umkreis von 2 Feldern dichte Nebelschwaden verteilen.
items.bombs.smokebomb.discover_hint=Du kannst diesen Gegenstand mit Alchemie herstellen.

items.bombs.regrowthbomb.name=Bombe des Wildwuchses
items.bombs.regrowthbomb.desc=Diese spezielle Bombe verspritzt lebensspendende Flüssigkeit im Umkreis von 3 Feldern, anstatt zu explodieren. In der von der Explosion betroffenen Gegend sprießen schnell Gras und Pflanzen. Du selbst und alle Verbündeten, die von der Explosion betroffen sind, werden geheilt, als hätten sie einen Heiltrank getrunken.
items.bombs.regrowthbomb.discover_hint=Du kannst diesen Gegenstand mit Alchemie herstellen.

items.bombs.shrapnelbomb.name=Schrapnellbombe
items.bombs.shrapnelbomb.desc=Diese Bombe wurde mit Metallplatten von DM-300 verändert. Wenn sie explodiert, werden diese Platten in Stücke brechen und in alle Richtungen davonschießen. Alles in einem riesigen Bereich erleidet _%1$d-%2$d Punkte_ Schaden. Du suchst dir am besten etwas, wohinter du dich verstecken kannst, wenn du die Bombe benutzt...
items.bombs.shrapnelbomb.discover_hint=Du kannst diesen Gegenstand mit Alchemie herstellen.

items.bombs.woollybomb.name=Herdenbombe
items.bombs.woollybomb.desc=Diese angepasste Bombe erschafft ein weites Feld mit magischen Schafen, wenn sie explodiert. Die Explosion wird _%1$d-%2$d Punkte_ Schaden im Umkreis von 2 Feldern verursachen. Diese Schafe blockieren die Bewegung und bleiben für lange Zeit an Ort und Stelle! In der Gegenwart mächtiger Feinde verbleiben sie allerdings weniger lang, und wenn man mit ihnen interagiert, verschwinden sie noch schneller.
items.bombs.woollybomb.discover_hint=Du kannst diesen Gegenstand mit Alchemie herstellen.

###food
items.food.berry.name=Dungeonbeere
items.food.berry.eat_msg=Diese Beere war lecker!
items.food.berry.desc=Diese kleine Beere wurde von der Jägerin unter der Vegetation des Dungeons gefunden. Sie kann schnell verspeist werden, sättigt ein wenig und könnte einen brauchbaren Samen enthalten!
items.food.berry.discover_hint=Du kannst diesen Gegenstand durch ein bestimmtes Heldentalent finden.

items.food.blandfruit.name=Fadfrucht
items.food.blandfruit.cooked=gekochte Fadfrucht
items.food.blandfruit.sunfruit=Sonnenfrucht
items.food.blandfruit.rotfruit=Fäulnisfrucht
items.food.blandfruit.earthfruit=Erdfrucht
items.food.blandfruit.blindfruit=Blindfrucht
items.food.blandfruit.firefruit=Feuerfrucht
items.food.blandfruit.icefruit=Eisfrucht
items.food.blandfruit.fadefruit=Blassfrucht
items.food.blandfruit.sorrowfruit=Trauerfrucht
items.food.blandfruit.stormfruit=Sturmfrucht
items.food.blandfruit.dreamfruit=Magierfrucht
items.food.blandfruit.starfruit=Sternenfrucht
items.food.blandfruit.swiftfruit=Flinkfrucht
items.food.blandfruit.raw=Du kannst es nicht über dich bringen, es roh zu essen.
items.food.blandfruit.desc=So trocken und substanzlos - vielleicht bringt es etwas, diese mit einer anderen Zutat zu kochen.
items.food.blandfruit.desc_cooked=Die Frucht ist während der Zeit im Topf sichtbar praller geworden und hat sogar die Eigenschaften des mitgekochten Samens übernommen. Sie hat nun die gleichen Effekte wie ein aus mehreren dieser Samen gebrauter Trank.
items.food.blandfruit.desc_eat=Sieht so aus, als könne man sie jetzt essen!
items.food.blandfruit.desc_throw=Sieht ziemlich gefährlich aus, vielleicht solltest du sie lieber werfen als essen.
items.food.blandfruit$chunks.name=Fadfruchtstücke
items.food.blandfruit$chunks.desc=Die Fadfrucht ist beim Aufprall geplatzt und hat farblose Stücke hinterlassen.\n\nAbgesehen von etwas Dreck sehen diese großen Stücke einer gekochten Fadfrucht recht essbar aus.

items.food.chargrilledmeat.name=Gebratenes Fleisch
items.food.chargrilledmeat.desc=Es sieht aus wie ein gutes Steak.
items.food.chargrilledmeat.discover_hint=Du kannst das mit einem anderen essbaren Gegenstand herstellen.

items.food.food.name=Essensration
items.food.food.ac_eat=ESSEN
items.food.food.eat_msg=Das hat echt lecker geschmeckt!
items.food.food.desc=Nichts besonderes drin: getrocknetes Fleisch, einige Kekse - sowas halt.

items.food.frozencarpaccio.name=Gefrorenes Carpaccio
items.food.frozencarpaccio.invis=Du siehst, wie deine Hände unsichtbar werden!
items.food.frozencarpaccio.hard=Du spürst wie deine Haut härter wird!
items.food.frozencarpaccio.refresh=Erfrischend!
items.food.frozencarpaccio.better=Dir geht es besser!
items.food.frozencarpaccio.desc=Es ist ein Stück gefrorenes, rohes Fleisch. Man kann es nur essen, indem man dünne Scheiben davon abschneidet. Und so schmeckt es überraschend gut.
items.food.frozencarpaccio.discover_hint=Du kannst das mit einem anderen essbaren Gegenstand herstellen.

items.food.meatpie.name=Fleischpastete
items.food.meatpie.eat_msg=Das Essen war unglaublich!
items.food.meatpie.desc=Ein leckerer Teig mit mächtiger Fleischfüllung. Dies wird dich viel besser sättigen als jede andere Mahlzeit.
items.food.meatpie.discover_hint=Du kannst diesen Gegenstand mit Alchemie herstellen.

items.food.mysterymeat.name=Mysteriöses Fleisch
items.food.mysterymeat.eat_msg=Irgendwie hat das Essen ... merkwürdig geschmeckt.
items.food.mysterymeat.hot=Oh! Heiß, heiß, heiß!
items.food.mysterymeat.legs=Du spürst deine Beine nicht mehr!
items.food.mysterymeat.not_well=Du fühlst dich nicht wirklich wohl.
items.food.mysterymeat.stuffed=Du bist satt.
items.food.mysterymeat.desc=Verzehr auf eigene Gefahr!
items.food.mysterymeat.discover_hint=Dieser Gegenstand wird von bestimmten Gegnern fallengelassen.
items.food.mysterymeat$placeholder.name=Fleisch

items.food.phantommeat.name=Phantomfleisch
items.food.phantommeat.desc=Ein großes, halbdurchsichtig schimmerndes Steak von einem Phantom-Piranha. Diese magische Mahlzeit braucht nicht gekocht zu werden und bewirkt bei Verzehr, abgesehen von vollständiger Sättigung, eine Vielzahl defensiver Boni: Es gewährt Unsichtbarkeit, Rindenhaut und etwas Heilung, und hebt außerdem viele negative Effekte auf.
items.food.phantommeat.discover_hint=Dieser Gegenstand wird von bestimmten Gegnern fallengelassen.

items.food.pasty.name=Pastete
items.food.pasty.fish_name=gedünsteter Fisch
items.food.pasty.amulet_name=das Amulett von Yendor?
items.food.pasty.egg_name=Osterei
items.food.pasty.rainbow_name=Regenbogentrank
items.food.pasty.shattered_name=grüne Torte
items.food.pasty.pie_name=Kürbiskuchen
items.food.pasty.vanilla_name=blaue Torte
items.food.pasty.cane_name=Zuckerstange
items.food.pasty.sparkling_name=spritziger Trank
items.food.pasty.desc=Eine echte Cornish-Fleischpastete mit traditioneller Füllung aus Rindfleisch und Tomaten. Köstlich!
items.food.pasty.fish_desc=Ein ganzer, gedünsteter Fisch, magisch haltbar gemacht, auf Blattgemüse angerichtet. Es ist in dieser Jahreszeit Tradition, etwas von dem Fisch für später aufzuheben, du wirst also einige Reste behalten, anstatt alles auf einmal aufzuessen.\n\nGesundes Mond-Neujahr!
items.food.pasty.amulet_desc=Endlich hast du es gefunden, das magische Amulett von... Moment mal, das ist ja nur eine Schokolade in Alufolie, die so aussehen soll wie das Amulett! Das verleiht dir sicher keine grenzenlose Macht, aber wenigstens kann es dich sättigen und deine Artefakte etwas aufladen.\n\nApril, April!
items.food.pasty.egg_desc=Ein riesengroßes Schokoladen-Osterei in grell-gelber Alufolie. Das reicht locker dazu, dich zu sättigen, und der Zuckergehalt allein könnte deinen Artefakten etwas zusätzliche Ladung verschaffen.\n\nFrohe Ostern!
items.food.pasty.rainbow_desc=Dieser farbenfrohe Trank ist eine Art flüssige Nahrung. Er stillt deinen Hunger und hat die magische Eigenschaft, einen direkt neben dir stehenden Gegner, der kein Boss ist, zu besänftigen, so dass dieser eine Zeitlang zögern wird, gegen dich zu kämpfen.\n\nHappy Pride!
items.food.pasty.shattered_desc=Dieses große Stück Vanilletorte ist mit bunten Steuseln und grüner Glasur bedeckt. Die Torte wurde gebacken, um die Jahre an Erfahrung zu feiern, und sie verleiht einen kleinen Teil dieser Erfahrung, wenn sie gegessen wird.\n\nShattered Pixel Dungeon wurde erstmals am 5. August 2014 veröffentlicht. Herzlichen Glückwunsch zum Geburtstag, Shattered Pixel Dungeon!
items.food.pasty.pie_desc=Ein großes und großartiges Stück Kürbiskuchen. Sein würzig-süßer Geschmack wird dich sättigen und dich ein kleines bisschen heilen.\n\nHappy Halloween!
items.food.pasty.vanilla_desc=Dieses große Stück Vanilletorte ist mit bunten Steuseln und blauer Glasur bedeckt. Die Torte wurde gebacken, um die Jahre an Erfahrung zu feiern, und sie verleiht einen kleinen Teil dieser Erfahrung, wenn sie gegessen wird.\n\nDas originale Pixel Dungeon wurde erstmals am 4. Dezember 2012 veröffentlicht. Herzlichen Glückwunsch zum Geburtstag, Pixel Dungeon!
items.food.pasty.cane_desc=Eine riesige,-süße Zuckerstange. Sie ist groß genug, um dich zu sättigen, und allein der Zuckergehalt könnte deinen Zauberstäben etwas zusätzliche Ladung verschaffen.\n\nFrohes Fest!
items.food.pasty.sparkling_desc=Dieser spritzige Trank ist eine Art flüssige Nahrung. Er stillt deinen Hunger und soll Sekt imitieren, enthält aber keinen Alkohol. Das warme Gefühl im Bauch verleiht dir ein wenig Abschirmung.\n\nGesundes Neues Jahr!
items.food.pasty$fishleftover.name=Fischreste
items.food.pasty$fishleftover.eat_msg=Das Essen... naja, ging so.
items.food.pasty$fishleftover.desc=Etwas übriger Fisch von deiner vorigen Mahlzeit. Du kannst das jederzeit für den kleinen Hunger essen.

items.food.smallration.name=Kleine Essensration
items.food.smallration.eat_msg=Das Essen... naja, ging so.
items.food.smallration.desc=Es sieht fast genauso wie eine gängige Essensration aus - nur weniger als üblich.
items.food.smallration.discover_hint=Du kannst diesen Gegenstand in einem Laden kaufen.

items.food.stewedmeat.name=gedünstetes Fleisch
items.food.stewedmeat.eat_msg=Das Essen schmeckte gut.
items.food.stewedmeat.desc=Durch das Dünsten wurden in diesem Fleisch alle Krankheitserreger und Keime abgetötet. Es dürfte sicher sein, das zu essen.
items.food.stewedmeat.discover_hint=Du kannst diesen Gegenstand mit Alchemie herstellen.

items.food.supplyration.name=Versorgungsration
items.food.supplyration.desc=Diese Ration wurde von und für Mitglieder der Diebesgilde im Dungeon gelassen. Sie wurde eigens für den Verzehr unterwegs zusammengestellt und hilft beim reibungslosen Ausführen von allerlei Gemeinheiten.\n\nSie füllt deinen Bauch zwar nicht so gut wie eine normale Essensration, aber sie kann schnell verzehrt werden, verleiht ein wenig an sofortiger Genesung und füllt dem Schurken die Ladungen eines Umhangs der Schatten wieder auf.
items.food.supplyration.discover_hint=Du kannst diesen Gegenstand durch ein bestimmtes Heldentalent finden.



##journal items
items.journal.documentpage.name=Herausgerissene Seite
items.journal.documentpage.desc=Eine einsame, herausgerissene Seite, welche aus einem Buch stammt. Du musst sie aufheben, um sie lesen zu können.

items.journal.alchemypage.name=herausgerissene Seite eines Alchemiebuchs
items.journal.alchemypage.desc=Eine herausgerissene Seite eines Handbuchs der Alchemie.\n\nAus dieser Distanz kannst du den kleinen Text nicht lesen, die Überschrift _"%s"_ jedoch schon.

items.journal.guidebook.name=Abenteurer-Handbuch
items.journal.guidebook.hint_mobile=Dein Abenteurerhandbuch enthält neue Hinweise! Betätige den blinkenden Tagebuch-Knopf oben rechts, um sie zu lesen.
items.journal.guidebook.hint_desktop=Dein Abenteurerhandbuch enthält neue Hinweise! Betätige den blinkenden Tagebuch-Knopf (%s) oben rechts, um sie zu lesen.
items.journal.guidebook.hint_status=Handbuch
items.journal.guidebook.desc=Ein Handbuch, das von jemanden hier liegengelassen wurde, der beschlossen hat, dass Abenteuer nichts für ihn sind! Dieses Buch hat magische Eigenschaften: Es kann Abenteurer zur rechten Zeit darauf hinweisen, eine bestimmte Seite zu lesen.\n\nAbgesehen von dieser Eigenheit ist das Buch vor allem wegen der Aufschrift "Keine Panik!" beliebt, die in großen, freundlichen Lettern auf dem Einband steht.

items.journal.guidepage.name=Herausgerissene Seite des  "Almanachs der Abenteurer"
items.journal.guidepage.desc=Eine herausgerissene Seite aus dem „Almanach der Abenteurer“.\n\nDer meiste Text in dieser Distanz ist zu klein um es zu erkennen, aber du kannst die Überschrift klar und deutlich lesen:\n\n_"%s"_

items.journal.regionlorepage$sewers.name=verschlissener Brief
items.journal.regionlorepage$sewers.desc=Das sieht aus wie ein Brief auf einem schmutzigen Fetzen Papier. Du musst ihn aufheben, um erkennen zu können, was da geschrieben steht.

items.journal.regionlorepage$prison.name=verschlissener Tagebucheintrag
items.journal.regionlorepage$prison.desc=Ein Tagebucheintrag oder eine andere Art Eintragung auf einem Stück alten Papiers. Es scheint besser erhalten zu sein als die Briefe, die du in der Kanalisation gefunden hast, aber du musst es immer noch aufheben, um es zu lesen.

items.journal.regionlorepage$caves.name=alter Logbucheintrag
items.journal.regionlorepage$caves.desc=Das sieht aus wie eine Eintragung aus dem Logbuch eines Erkunders, erstaunlich gut erhalten, obwohl es sehr alt sein muss. Hebe es auf, um es zu lesen.

items.journal.regionlorepage$city.name=rostige Platte
items.journal.regionlorepage$city.desc=Eine kleine, rostige Metallplatte mit einer magisch darauf eingebrannten Nachricht. Die Buchstaben sind trotz des Alters der Platte gut zu erkennen, aber du musst sie aufheben, um es zu lesen.

items.journal.regionlorepage$halls.name=leuchtende Platte
items.journal.regionlorepage$halls.desc=Eine kleine, schwarze Platte mit darauf eingebrannten, leuchtenden Lettern. Die leuchtenden Lettern verschwimmen auf die Entfernung, du wirst die Platte also aufheben, um sie zu lesen.


###keys
items.keys.goldenkey.name=Goldener Schlüssel
items.keys.goldenkey.desc=Die Zähne auf diesem goldenen Schlüssel sind winzig und kunstvoll ausgearbeitet. Vielleicht öffnet er eine verschlossene Truhe?

items.keys.crystalkey.name=Kristallschlüssel
items.keys.crystalkey.desc=Die geschliffenen Oberflächen auf diesem Kristallschlüssel schimmern in der Dunkelheit. Vielleicht kann er etwas öffnen, das aus Kristall ist?

items.keys.ironkey.name=Eisenschlüssel
items.keys.ironkey.desc=Der Bart dieses altertümlichen Schlüssels ist deutlich verschlissen. Welches Schloss kann dieser Schlüssel wohl öffnen?

items.keys.wornkey.name=abgenutzter Schlüssel
items.keys.wornkey.desc=Der Schlüssel ist abgenutzt und verfärbt, allerdings sieht er so aus, als wäre er von hoher Bedeutung. Er könnte vielleicht genutzt werden, um eine besondere Tür in der Nähe zu öffnen.



###potions
items.potions.potion.ac_drink=TRINKEN
items.potions.potion.turquoise=Türkiser Trank
items.potions.potion.crimson=Karminroter Trank
items.potions.potion.azure=Himmelblauer Trank
items.potions.potion.jade=Jadefarbener Trank
items.potions.potion.golden=Goldener Trank
items.potions.potion.magenta=Magentafarbener Trank
items.potions.potion.charcoal=kohlefarbener Trank
items.potions.potion.ivory=Elfenbeinfarbener Trank
items.potions.potion.amber=Bernsteinfarbener Trank
items.potions.potion.bistre=Bräunlicher Trank
items.potions.potion.indigo=Indigoblauer Trank
items.potions.potion.silver=Silberner Trank
items.potions.potion.unknown_desc=Dieses Fläschchen enthält eine wallende farbige Flüssigkeit. Wer weiß, was passieren wird, wenn man sie trinkt oder wirft?
items.potions.potion.harmful=Schädlicher Trank!
items.potions.potion.beneficial=Nützlicher Trank
items.potions.potion.yes=Ja, ich weiß was ich tue
items.potions.potion.no=Nein, lieber doch nicht...
items.potions.potion.sure_drink=Willst du ihn wirklich trinken? Normalerweise sollte dieser Trank auf deine Gegner geworfen werden.
items.potions.potion.sure_throw=Willst du ihn wirklich werfen? In den meisten Fällen macht es mehr Sinn, diesen zu konsumieren.
items.potions.potion.shatter=Das Fläschchen zerbricht und die Flüssigkeit spritzt harmlos herum.
items.potions.potion.discover_hint=Du kannst diesen Gegenstand zufällig im Dungeon finden oder mit Alchemie herstellen.
items.potions.potion$placeholder.name=Trank
items.potions.potion$seedtopotion.name=Zufälliger Trank

items.potions.potionofexperience.name=Trank der Erfahrung
items.potions.potionofexperience.desc=Die angesammelte Erfahrung vieler Kämpfe reduziert zu einer Flüssigkeit. Wenn dies getrunken wird, steigert er deine aktuelle Stufe.

items.potions.potionoffrost.name=Trank des Frosts
items.potions.potionoffrost.desc=Die Chemikalie in diesem Trank verdampft nach Kontakt mit der Luft zu einer eiskalten Wolke.

items.potions.potionofhaste.name=Trank der Eile
items.potions.potionofhaste.energetic=Du fühlst dich tatkräftig!
items.potions.potionofhaste.desc=Das Trinken dieser seltsam süßen Flüssigkeit wird dir für eine kurze Zeit enorm viel Energie geben, und es dir erlauben, sehr schnell zu rennen.

items.potions.potionofhealing.name=Heiltrank
items.potions.potionofhealing.heal=Deine Wunden beginnen sich zu schließen.
items.potions.potionofhealing.desc=Ein Elixier, welches schnell und effektiv deine Gesundheit wiederherstellt und viele Beschwerden heilt.

items.potions.potionofinvisibility.name=Trank der Unsichtbarkeit
items.potions.potionofinvisibility.invisible=Du siehst, wie deine Hände unsichtbar werden!
items.potions.potionofinvisibility.desc=Wenn dieser Trank getrunken wird, gewährt er dir zeitweilig Unsichtbarkeit. Solange du unsichtbar bist, können Feinde dich nicht sehen. Physische Angriffe und magische Effekte (zum Beispiel aus Schriftrollen und Zauberstäben) beenden die Unsichtbarkeit aber sofort.

items.potions.potionoflevitation.name=Trank der Schwerelosigkeit
items.potions.potionoflevitation.float=Du schwebst!
items.potions.potionoflevitation.desc=Durch das Trinken dieser sonderbaren Flüssigkeit wirst du in der Lage sein zu schweben. Dadurch kannst du über Fallen und Abgründe mühelos hinwegschweben. Wenn dieser Trank geworfen wird, erzeugt dieser eine Gaswolke, welche Desorientierung verursacht.

items.potions.potionofliquidflame.name=Trank der flüssigen Flamme
items.potions.potionofliquidflame.desc=Dieser Trank beinhaltet eine instabile Mischung, welche bei Kontakt mit der Luft in gewaltige Flammen ausbrechen wird.

items.potions.potionofmindvision.name=Trank der übersinnlichen Wahrnehmung
items.potions.potionofmindvision.see_mobs=Irgendwie kannst du die Präsenz der Gedanken anderer Kreaturen wahrnehmen!
items.potions.potionofmindvision.see_none=Irgendwie weißt du, dass du im Moment auf dieser Ebene alleine bist.
items.potions.potionofmindvision.desc=Nachdem dies getrunken wurde erlangt dein Geist die Fähigkeit die Anwesenheit entfernter Kreaturen durch Wände hindurch wahrzunehmen. Dieser Trank gestattet es dir ebenfalls durch benachbarte Wände oder Türen hindurch zu sehen.

items.potions.potionofparalyticgas.name=Trank des Lähmungsgases
items.potions.potionofparalyticgas.desc=Wenn die Flüssigkeit in dieser Flasche mit der Luft in Kontakt gerät, verdunstet sie in eine gelbe Wolke. Jeder, der diese Wolke einatmet, wird sofort gelähmt und ist für eine gewisse Zeit nicht in der Lage, sich zu bewegen. Dieser Gegenstand kann auf entfernte Gegner geworfen werden.

items.potions.potionofpurity.name=Trank der Reinheit
items.potions.potionofpurity.freshness=Du spürst ungewöhnliche Frische in der Luft.
items.potions.potionofpurity.protected=Eine schützende Schicht umhüllt dich!
items.potions.potionofpurity.desc=Dieses magische Reagenz wird schnell alle gefährlichen Flächeneffekte in einem großen Bereich neutralisieren. Du wirst zeitweilig gegen die Effekte immun, wenn du es trinkst.

items.potions.potionofstrength.name=Trank der Stärke
items.potions.potionofstrength.msg=Neu entdeckte Stärke durchströmt deinen Körper; du hast nun %d Stärkepunkte!
items.potions.potionofstrength.desc=Diese mächtige Flüssigkeit durchströmt deinen Körper und verbessert deine Muskeln, was deine Stärke dauerhaft um einen Punkt erhöht.

items.potions.potionoftoxicgas.name=Trank des Giftgases
items.potions.potionoftoxicgas.desc=Sobald dieses luftdichte Flasche geöffnet oder zerstört wird, entweicht eine grüne Wolke aus tödlich-toxischen Gasen. Du solltest erwägen, diesen Trank auf Gegner zu werfen anstatt ihn in deiner Hand zu entkorken.



###brews
items.potions.brews.brew.discover_hint=Du kannst diesen Gegenstand mit Alchemie herstellen.

items.potions.brews.aquabrew.name=Aqua-Gebräu
items.potions.brews.aquabrew.desc=Wenn der Behälter dieser Brühe zerbrochen wird, entweicht ihm an der Stelle des Aufpralls ein Schwall von unter Druck stehendem Wasser. Dieser Schwall schadet nicht nur feurigen Gegnern, sondern verbreitet auch Wasser in naheliegendem Terrain und entschärft Fallen, außerdem werden Charakter in der Nähe des Schwalls zurückgestoßen.

items.potions.brews.blizzardbrew.name=Blizzardbräu
items.potions.brews.blizzardbrew.desc=Wenn es zerbrochen wird, entfesselt dieses Gebräu einen tosenden Schneesturm, der sich schnell wie ein Gas ausbreitet.

items.potions.brews.causticbrew.name=Ätzende Brühe
items.potions.brews.causticbrew.desc=Dieses Gebräu wird zersetzenden Schlamm überall verteilen, wo sein Gefäß zerbricht. Alles, woran Schlamm klebt, wird langsam schmelzen, wenn dieser nicht in Wasser abgewaschen wird.

items.potions.brews.infernalbrew.name=Höllensud
items.potions.brews.infernalbrew.desc=Wenn es zerbrochen wird, entfesselt dieses Gebräu ein flammendes Inferno, das sich schnell wie ein Gas ausbreitet.

items.potions.brews.shockingbrew.name=Schockbrause
items.potions.brews.shockingbrew.desc=Wenn es zerbrochen wird, entfesselt dieses Gebräu einen elektrischen Sturm in einem weit gefassten Bereich um den Ort, an dem es zerbrochen wurde.

items.potions.brews.unstablebrew.name=instabiles Gebräu
items.potions.brews.unstablebrew.desc=Dieses magische Gebräu leuchtet abwechselnd in allen Regenbogenfarben.\n\nWenn es getrunken oder geworfen wird, löst es den Effekt eines zufälligen Tranks aus. Die Wirkung des Tranks ist immer vorteilhaft, wenn er getrunken, und immer schädlich, wenn er geworfen wird.

###elixirs
items.potions.elixirs.elixir.discover_hint=Du kannst diesen Gegenstand mit Alchemie herstellen.

items.potions.elixirs.elixirofarcanearmor.name=Elixier der arkanen Rüstung
items.potions.elixirs.elixirofarcanearmor.desc=Dieses Elixier verleiht einen lang anhaltenden Schutz gegen magische Angriffe.

items.potions.elixirs.elixirofaquaticrejuvenation.name=Elixier der aquatischen Verjüngung
items.potions.elixirs.elixirofaquaticrejuvenation.desc=Dieses Elixier enthält die Überreste eines Schleims, angereichert mit einem Heiltrank. Während es keine unmittelbare Heilung bringt, wird es deine Lebenskraft zuverlässig wieder herstellen, während du im Wasser stehst.
items.potions.elixirs.elixirofaquaticrejuvenation$aquahealing.name=aquatische Heilung
items.potions.elixirs.elixirofaquaticrejuvenation$aquahealing.desc=Du hast vorübergehend Heilungskräfte wie die des Schleims erhalten.\n\nWährend du im Wasser stehst, wirst du pro Zug ein wenig Gesundheit zurückgewinnen. Dieser Effekt pausiert, wenn du volle Lebenspunkte hast oder nicht im Wasser stehst.\n\nVerbleibende Runden: %d.

items.potions.elixirs.elixirofdragonsblood.name=Drachenblutelixier
items.potions.elixirs.elixirofdragonsblood.desc=Wenn dieses Elixier getrunken wird, lässt es feurige Energie durch die Adern des Trinkenden fließen. Dieser Effekt lässt den Trinkenden immun gegenüber Feuer werden und mit physischen Angriffen attackierte Feinde gehen in Flammen auf.

items.potions.elixirs.elixiroffeatherfall.name=Elixier des Federflugs
items.potions.elixirs.elixiroffeatherfall.light=Du fühlst dich so leicht wie eine Feder!
items.potions.elixirs.elixiroffeatherfall.desc=Dieses Elixier bietet einen schwächeren, aber kontrollierteren Levitationseffekt, der es dem Trinker ermöglicht, für kurze Zeit unbeschadet aus größeren Höhen zu fallen.
items.potions.elixirs.elixiroffeatherfall$featherbuff.name=Federfall
items.potions.elixirs.elixiroffeatherfall$featherbuff.desc=Du stehst unter der Wirkung eines Federflug-Elixiers, das es dir ermöglicht, in Abgründe zu fallen, ohne Schaden zu nehmen!\n\nVerbleibende Züge: %s.

items.potions.elixirs.elixirofhoneyedhealing.name=Elixier der honigsüßen Heilung
items.potions.elixirs.elixirofhoneyedhealing.desc=Dieses Elixier kombiniert Heilung mit der Süße von Honig. Wenn es getrunken wird, hat es die gleiche Wirkung wie ein Heiltrank und stillt einen kleinen Teil des Hungers. Es kann aber auch geworfen werden, um einen Verbündeten zu heilen.\n\nKreaturen mit einer Vorliebe für Honig könnten besänftigt werden, wenn dieser Gegenstand bei ihnen angewendet wird.

items.potions.elixirs.elixiroficytouch.name=Elixier der eisigen Berührung
items.potions.elixirs.elixiroficytouch.desc=Wenn dieses Elixier verbraucht wird, erlaubt es dem Trinkenden Feinden mit dem Angriff Wärme zu entziehen. Dieser Effekt macht den Trinkenden immun gegen Kälte und lässt ihn mit physischen Angriffen Gegner einfrieren.

items.potions.elixirs.elixirofmight.name=Elixier der Macht
items.potions.elixirs.elixirofmight.msg=Neu entdeckte Stärke durchströmt deinen Körper; du hast nun %d Stärkepunkte!
items.potions.elixirs.elixirofmight.desc=Diese mächtige Flüssigkeit wird in deine Muskeln fahren, was deine Stärke dauerhaft um einen Punkt anhebt und zeitweise deine maximalen Lebenspunkte um %d erhöht. Der Ausbau der Lebenspunkte ist höher, wenn deine maximalen Lebenspunkte höher sind, schwindet aber langsam wieder, während du höhere Level erreichst.
items.potions.elixirs.elixirofmight$htboost.name=Erhöhung der maximalen Lebenspunkte
items.potions.elixirs.elixirofmight$htboost.desc=Dein Körper fühlt sich unnatürlich stark und gesund an.\n\nDeine maximalen Lebenspunkte sind für längere Zeit erhöht. Wenn du Erfahrungsstufen gewinnst, wird diese Erhöhung langsam abnehmen\n\nMomentane Erhöhung: %d.\nVerbleibende Erfahrungsstufen: %d.

items.potions.elixirs.elixiroftoxicessence.name=Elixier der toxischen Essenz
items.potions.elixirs.elixiroftoxicessence.desc=Wenn dieses Elixier getrunken wird, wird der Trinkende von giftiger Energie durchdrungen. Wer es getrunken hat, verbreitet bei jeder Bewegung Giftgas um sich herum, wird außerdem immun gegen Giftgas und Gift, was etwas länger anhält, als der Effekt als solcher.



###exotic potions
items.potions.exotic.exoticpotion.turquoise=Exotischer türkiser Trank
items.potions.exotic.exoticpotion.crimson=Exotischer karminfarbener Trank
items.potions.exotic.exoticpotion.azure=Exotischer himmelblauer Trank
items.potions.exotic.exoticpotion.jade=Exotischer jadefarbener Trank
items.potions.exotic.exoticpotion.golden=Exotischer goldener Trank
items.potions.exotic.exoticpotion.magenta=Exotischer magentafarbener Trank
items.potions.exotic.exoticpotion.charcoal=Exotischer kohlefarbener Trank
items.potions.exotic.exoticpotion.ivory=Exotischer elfenbeinfarbener Trank
items.potions.exotic.exoticpotion.amber=Exotischer bernsteinfarbener Trank
items.potions.exotic.exoticpotion.bistre=Exotischer bräunlicher Trank
items.potions.exotic.exoticpotion.indigo=Exotischer himmelblauer Trank
items.potions.exotic.exoticpotion.silver=Exotischer silberner Trank
items.potions.exotic.exoticpotion.unknown_desc=Dieses runde Fläschchen enthält eine schlierige, farbige Flüssigkeit. Sie scheint nicht von dieser Welt zu sein. Wer weiß, was passieren wird, wenn man sie trinkt oder wirft?
items.potions.exotic.exoticpotion.warning=Willst du wirklich die Nutzung dieses Tranks unterbrechen? Der Trank wird dadurch trotzdem verbraucht.
items.potions.exotic.exoticpotion.yes=Ja, ich bin mir sicher
items.potions.exotic.exoticpotion.no=Nein, lieber doch nicht...
items.potions.exotic.exoticpotion.discover_hint=Du kannst diesen Gegenstand mit Alchemie herstellen.

items.potions.exotic.potionofcleansing.name=Trank der Reinigung
items.potions.exotic.potionofcleansing.desc=Dieses starke Mittelchen wird, wenn man es trinkt, einige Züge lang alle schädlichen Effekte neutralisieren, die dem Trinkenden anhängen. Es kann auch auf ein Ziel geworfen werden, um es so zu reinigen.
items.potions.exotic.potionofcleansing$cleanse.name=gereinigt
items.potions.exotic.potionofcleansing$cleanse.desc=Dieser Charakter ist vorübergehend immun gegen alle schädlichen Effekte!\n\nVerbleibende Züge: %s.

items.potions.exotic.potionofcorrosivegas.name=Trank der Zersetzung
items.potions.exotic.potionofcorrosivegas.desc=Wird dieses unter Druck stehende Fläschchen geöffnet oder zerbrochen, explodiert der Inhalt zu einer tödlichen Wolke aus ätzendem, rostbraunem Gas. Dieses Gas verbreitet sich schneller als Giftgas und es ist auch tödlicher, jedoch hält es sich nicht sehr lange.

items.potions.exotic.potionofdragonsbreath.name=Trank des Drachenodems
items.potions.exotic.potionofdragonsbreath.prompt=Wähle ein Ziel zum Verbrennen.
items.potions.exotic.potionofdragonsbreath.desc=Dieses Fläschchen enthält eine ungewöhnliche Mixtur, die zu einer Flamme ausbricht, sobald sie Kontakt mit Speichel hat. Der Trinkende kann, wenn er schnell ist, auf diese Art Flammen aus seinem Mund speien!

items.potions.exotic.potionofearthenarmor.name=Trank der irdenen Rüstung
items.potions.exotic.potionofearthenarmor.desc=Anstatt zu paralysieren, hat diese Flüssigkeit einen härtenden Effekt auf die Haut, so dass diese kurzzeitig zu einer natürlichen Rüstung wird.

items.potions.exotic.potionofdivineinspiration.name=Trank der Göttlichen Inspiration
items.potions.exotic.potionofdivineinspiration.no_more_points=Du kannst nicht noch mehr Bonus-Talentpunkte erlangen.
items.potions.exotic.potionofdivineinspiration.select_tier=Wähle eine Talentstufe, in der du zwei Bonuspunkte bekommen möchtest. Du musst die Stufe freigeschaltet haben, bevor du darin Talentpunkte vergibst.
items.potions.exotic.potionofdivineinspiration.bonus=+2 Talentpunkte!
items.potions.exotic.potionofdivineinspiration.desc=Durch die verflüssigte Macht heiliger Energie wird dieser Trank denjenigen, der ihn trinkt, mit göttlicher Macht durchdringen und ihm zwei Talentpunkte in einer Stufe seiner Wahl gewähren.\n\nDieser Trank kann nur einmal pro Talentstufe eingesetzt werden.

items.potions.exotic.potionofmagicalsight.name=Trank der magischen Sicht
items.potions.exotic.potionofmagicalsight.desc=Wenn du das trinkst, werden deine Sinne kurzzeitig extrem geschärft, wodurch du in einem 12-Felder-Radius durch Wände sehen kannst!

items.potions.exotic.potionofmastery.name=Trank der Meisterschaft
items.potions.exotic.potionofmastery.prompt=Einen Gegenstand meistern
items.potions.exotic.potionofmastery.weapon_easier=Deine Waffe ist nun leichter zu handhaben!
items.potions.exotic.potionofmastery.armor_easier=Deine Rüstung lässt sich nun leichter tragen!
items.potions.exotic.potionofmastery.desc=Anstatt dass er rohe Stärke verleiht, stimmt dieser Trank die Muskeln des Nutzers auf einen bestimmten Gegenstand ab. Dadurch wird dieser Gegenstand einfacher zu handhaben, als habe derjenige, der diesen Trank getrunken hat, damit geübt und ein Muskelgedächtnis aufgebaut.\n\nDie ausgewählte Waffe oder Rüstung benötigt dann 2 Stärkepunkte weniger zum Gebrauch. Dieser Trank kann nur einmal pro Gegenstand verwendet werden.

items.potions.exotic.potionofshielding.name=Schildtrank
items.potions.exotic.potionofshielding.desc=Anstatt zu heilen, wird dieser Trank stattdessen einen beständigen Schild um den Körper des Trinkenden aufbauen, der eine beträchtliche Menge an Schaden abblockt.

items.potions.exotic.potionofshroudingfog.name=Trank des verhüllenden Nebels
items.potions.exotic.potionofshroudingfog.desc=Wird die Flüssigkeit in diesem Fläschchen Luft ausgesetzt, so produziert sie einen dicken, rauchigen Nebel, der sich schnell ausbreitet und die Sicht deiner Gegner behindert.

items.potions.exotic.potionofsnapfreeze.name=Blitzeis-Trank
items.potions.exotic.potionofsnapfreeze.desc=Die Chemikalien in diesem Trank reagieren schnell mit der Luft: Sie gefrieren und verwurzeln alles in ihrer Reichweite.

items.potions.exotic.potionofstamina.name=Trank der Ausdauer
items.potions.exotic.potionofstamina.desc=Wenn du diese sonderbar süße Flüssigkeit trinkst, wirst du von einem langanhaltenden Energieschub erfasst, so dass du längere Zeit mit erhöhtem Tempo laufen kannst.

items.potions.exotic.potionofstormclouds.name=Trank der Gewitterwolken
items.potions.exotic.potionofstormclouds.desc=Wirft man diesen Trank, so erhält man eine sich schnell ausbreitende Wolke aus konzentriertem Dampf, der kondensiert und sich in der Umgebung ansammelt. Der Großteil des Terrains wird dadurch zu Wasser, feurige Gegner erhalten Schaden, Feuer wird gelöscht, und Fallen werden überflutet und zerstört.



###quest items
items.quest.ceremonialcandle.name=Zeremoniekerze
items.quest.ceremonialcandle.desc=Ein Satz Kerzen, welche alle durch mehrfache Verwendung zusammen verschmolzen sind.\n\nDer Satz alleine ist wertlos, aber wenn mehrere Kerzen in einem gewissen Muster verwendet werden, können sie Energie sammeln, um ein Beschwörungsritual durchzuführen.
items.quest.ceremonialcandle.discover_hint=Du kannst diesen Gegenstand während einer bestimmten Aufgabe finden.

items.quest.corpsedust.name=Leichenstaub
items.quest.corpsedust.chill=Dir läuft ein Schauer den Rücken hinunter.
items.quest.corpsedust.desc=Dieser Ball aus Leichenstaub sieht fast genau so aus wie ein normaler Staubball, doch strahlt dieser eine bösartige Energie aus.\n\nDu solltest das Zeug so schnell wie möglich loswerden.
items.quest.corpsedust.discover_hint=Du kannst diesen Gegenstand während einer bestimmten Aufgabe finden.

items.quest.darkgold.name=Dunkelgold-Erz
items.quest.darkgold.you_now_have=Du hast nun %d Dunkelgolderz.
items.quest.darkgold.desc=Dieses Metall wird aufgrund seiner Farbe Dunkelgold genannt (es unterscheidet sich nicht von normalem Gold), doch es schmilzt, wenn es dem Sonnenlicht ausgesetzt wird, was es auf der Oberfläche absolut nutzlos macht.
items.quest.darkgold.discover_hint=Du kannst diesen Gegenstand während einer bestimmten Aufgabe finden.

items.quest.dwarftoken.name=Zwergenmünze
items.quest.dwarftoken.desc=Viele Zwerge und einige ihrer größten Kreationen trugen diese kleinen Metallstücke mit unbekanntem Verwendungszweck mit sich. Vielleicht ist das Schmuck, oder eine Art Ausweis? Zwerge sind und bleiben eigenartig.
items.quest.dwarftoken.discover_hint=Du kannst diesen Gegenstand während einer bestimmten Aufgabe finden.

items.quest.embers.name=Asche eines Elementars
items.quest.embers.desc=Spezielle Asche, welche nur von jungen Feuerelementaren gewonnen werden kann. Die Asche strahlt thermische Energie aus.
items.quest.embers.discover_hint=Du kannst diesen Gegenstand während einer bestimmten Aufgabe finden.

items.quest.escapecrystal.name=Fluchtkristall
items.quest.escapecrystal.ac_use=VERWENDEN
items.quest.escapecrystal.desc=Ein schmaler magischer Zauberkristall, der offenbar eine Art Teleportationsmagie enthält. Du kannst diesen Kristall jederzeit benutzen, um die Zwergenschatzkammer zu verlassen – allerdings wirst du somit nichts aus ihr mitnehmen können!
items.quest.escapecrystal.discover_hint=Du kannst diesen Gegenstand während einer bestimmten Aufgabe finden.

items.quest.gooblob.name=Schleimklumpen
items.quest.gooblob.desc=Ein schwabbelnder Klumpen Glibberzeug, der sich vom Schleim gelöst hat, als er starb. Es ist fast wie ein großer Wackelpudding, doch würdest du es sicher nicht wagen, das zu essen.\n\nFür sich genommen ist er nutzlos, doch könnte er wirkungsvoll sein, wenn man ihn zusammen mit bestimmten Tränken oder einer Bombe kombiniert. Zumindest sollte man ihn in eine ordentliche Menge Energie umwandeln können.
items.quest.gooblob.discover_hint=Dieser Gegenstand wird von bestimmten Gegnern fallengelassen.

items.quest.metalshard.name=verfluchte Metallplatte
items.quest.metalshard.desc=Eine Platte rostigen, verfluchten Metalls, die sich vom DM-300 gelöst hat, als er zerstört wurde. Du kannst eine inaktive, böse Magie in ihr spüren.\n\nFür sich genommen ist sie nutzlos, doch könnte sie nützlich sein, wenn man sie zusammen mit bestimmten Schriftrollen oder einer Bombe kombiniert. Zumindest sollte man sie in eine ordentliche Menge Energie konvertieren können.
items.quest.metalshard.discover_hint=Dieser Gegenstand wird von bestimmten Gegnern fallengelassen.

items.quest.pickaxe.name=Spitzhacke
items.quest.pickaxe.ability_name=durchbohren
items.quest.pickaxe.ability_desc=Die Zweikämpferin kann einen Gegner mit einer Spitzhacke _durchbohren_. Der Hieb trifft garantiert, bewirkt für 3 Züge Verwundbarkeit und fügt Gegnern mit starrer Haut _%1$d-%2$d Schaden_ zu.
items.quest.pickaxe.upgrade_ability_stat_name=Fähigkeitsschaden
items.quest.pickaxe.desc=Dies ist ein robustes und schweres Werkzeug zum Zerschlagen von Stein. Du musst die Spitzhacke nicht ausrüsten, um damit zu schürfen, aber notfalls kann sie wahrscheinlich auch als Waffe eingesetzt werden.
items.quest.pickaxe.discover_hint=Du kannst diesen Gegenstand während einer bestimmten Aufgabe finden.

items.quest.ratskull.name=Gigantischer Rattenschädel
items.quest.ratskull.desc=Dies ist, zu deiner Verwunderung, ein ungewöhnlich großer Ratten-Totenschädel. Es wäre eine großartige Trophäe, wenn du eine Wand hättest, woran du ihn aufhängen könntest.



###remains
items.remains.remainsitem.ac_use=VERWENDEN
items.remains.remainsitem.discover_hint=Du kannst diesen Gegenstand in den Gebeinen eines bestimmten Helden aus einem zuvor verlorenen Spiel finden.

items.remains.bowfragment.name=Bogenfragment
items.remains.bowfragment.desc=Dieses Bruchstück aus Holz war einst Teil des Seelenbogens einer verschollenen Jägerin. Du spürst immer noch ein wenig natürliche Energie in dem Bruchstück, und du kannst sie dazu einsetzen, etwas hohes Gras um dich herum wachsen zu lassen. Dabei wird das Fragment allerdings zerstört.

items.remains.brokenhilt.name=zerbrochener Griff
items.remains.brokenhilt.desc=Dieser zerbrochene Griff sieht aus, als stamme er von der Waffe einer besiegten Zweikämpferin. Man spürt noch etwas Kampfkraft im Griff, die man nutzen kann, um bei den nächsten beiden Nahkampfschlägen etwas Bonusschaden zu erzielen. Allerdings wird der Griff dadurch zerstört.

items.remains.brokenstaff.name=zerbrochener Stab
items.remains.brokenstaff.desc=Dieser Magierstab wurde in der Mitte entzwei gebrochen, nachdem sein Eigentümer den Tod gefunden hat. Du spürst immer noch ein wenig magische Energie in dem Stab, und du kannst sie dazu einsetzen, deinen Stäben etwas  zusätzliche Ladung zu verleihen. Dabei wird der Stab allerdings zerstört.

items.remains.cloakscrap.name=Stofffetzen
items.remains.cloakscrap.desc=Dieser Stofffetzen sieht aus, als stamme er aus dem Umhang der Schatten eines dahingeschiedenen Schurken. Du spürst immer noch ein wenig mystische Energie in dem Fetzen, und du kannst sie dazu einsetzen, deinen Artefakten etwas zusätzliche Ladung zu verleihen. Dabei wird der Stoff allerdings zerstört.

items.remains.sealshard.name=Siegel-Bruchstücke
items.remains.sealshard.desc=Diese winzigen Bruchstücke aus rotem Siegelwachs sehen aus, als stammen sie aus dem Siegel eines gefallenen Kriegers. Du spürst immer noch etwas von der Willenskraft, die dem Siegel anhaftete, und du kannst sie dazu einsetzen, dir etwas Abschirmung zu verleihen. Dabei werden die Siegel-Bruchstücke allerdings zerstört.

items.remains.tornpage.name=Herausgerissene Seite
items.remains.tornpage.desc=Diese Seite sieht aus, als sei sie aus dem heiligen Folianten eines verblichenen Klerikers gerissen worden. Ihr haftet noch ein wenig göttliche Energie an, die du nutzen kannst, um ein wenig Gesundheit wiederherzustellen. Dabei wir die Seite allerdings zerstört.



###rings
items.rings.ring.diamond=Diamantring
items.rings.ring.opal=Opalring
items.rings.ring.garnet=Granatring
items.rings.ring.ruby=Rubinring
items.rings.ring.amethyst=Amethystring
items.rings.ring.topaz=Topasring
items.rings.ring.onyx=Onyxring
items.rings.ring.tourmaline=Turmalinring
items.rings.ring.emerald=Smaragdring
items.rings.ring.sapphire=Saphirring
items.rings.ring.quartz=Quarzring
items.rings.ring.agate=Achatring
items.rings.ring.equip_cursed=Der Ring schnürt sich schmerzhaft um deinen Finger!
items.rings.ring.unknown_desc=Dieser metallene Fingerreif ist mit einem großen Edelstein, der in der Dunkelheit glitzert, verziert. Wer weiß, was er bewirkt, wenn man ihn trägt?
items.rings.ring.known=Dies ist ein %s
items.rings.ring.identify=Nun bist du mit deinem Ring vertraut genug, um ihn zu identifizieren.
items.rings.ring.cursed_worn=Da dieser Ring verflucht ist, bist du nicht dazu in der Lage, ihn abzustreifen.
items.rings.ring.curse_known=Du spürst, dass eine bösartige Magie in diesem Ring ruht.
items.rings.ring.not_cursed=Dieser Ring ist frei von bösartiger Magie.

items.rings.ringofaccuracy.name=Ring der Zielgenauigkeit
items.rings.ringofaccuracy.stats=Wenn dieser Ring getragen wird, erhöht er deine Genauigkeit um _%s%%._
items.rings.ringofaccuracy.typical_stats=Wenn dieser Ring getragen wird, erhöht er normalerweise deine Genauigkeit um _%s%%._
items.rings.ringofaccuracy.combined_stats=Deine ausgerüsteten Ringe kombinieren ihre Kraft und erhöhen so deine Genauigkeit insgesamt um _%s%%._
items.rings.ringofaccuracy.upgrade_stat_name_1=Präzisionssteigerung
items.rings.ringofaccuracy.desc=Dieser Ring verbessert deine Konzentration und macht es deinen Angriffen leichter, ihr Ziel zu finden. Ein verfluchter Ring wird es deinen Angriffen stattdessen schwerer machen.

items.rings.ringofarcana.name=Ring der Arkana
items.rings.ringofarcana.stats=Wenn dieser Ring getragen wird, verstärkt er die Wirkung von Verzauberungen und Glyphen um _%s%%._
items.rings.ringofarcana.typical_stats=Wenn dieser Ring getragen wird, verstärkt er normalerweise die Wirkung von Verzauberungen und Glyphen um _%s%%._
items.rings.ringofarcana.combined_stats=Deine ausgerüsteten Ringe kombinieren ihre Kraft und erhöhen so die Stärke deiner Verzauberungen und Glyphen insgesamt um _%s%%._
items.rings.ringofarcana.upgrade_stat_name_1=Arkane Verstärkung
items.rings.ringofarcana.desc=Dieser Ring verstärkt Verzauberungen von Waffen und Glyphen auf Rüstungen, einschließlich der Flüche! Zuerst steigt dabei die Häufigkeit des magischen Effekts. Tritt dieser garantiert ein, erhöht sich danach auch die Stärke des Effekts. Ein verfluchter Ring wird stattdessen Verzauberungen, Glyphen und Flüche schwächen.

items.rings.ringofelements.name=Ring der Elemente
items.rings.ringofelements.stats=Wenn dieser Ring getragen wird, bietet er _%s%%_ Elementarwiderstand.
items.rings.ringofelements.typical_stats=Wenn er getragen wird, bietet dieser Ring normalerweise _%s%%_ Elementarwiderstand.
items.rings.ringofelements.combined_stats=Deine ausgerüsteten Ringe kombinieren ihre Kraft und gewähren dir somit insgesamt _%s%%_ Elementarwiderstand.
items.rings.ringofelements.upgrade_stat_name_1=Widerstand
items.rings.ringofelements.desc=Der Träger dieses Ringes kann elementaren und magischen Effekten leichter widerstehen, indem der erlittene Schaden und die Dauer der Effekte reduziert werden. Selbstverständlich verstärkt ein verfluchter Ring stattdessen die negativen Effekte.

items.rings.ringofenergy.name=Ring der Energie
items.rings.ringofenergy.stats=Wenn dieser Ring getragen wird, erhöht sich die Aufladegeschwindigkeit von Zauberstäben, Artefakten und Heldenrüstung um _%s%%._
items.rings.ringofenergy.typical_stats=Wenn dieser Ring getragen wird, erhöht sich die Aufladegeschwindigkeit von Zauberstäben, Artefakten und Heldenrüstung normalerweise um _%s%%._
items.rings.ringofenergy.combined_stats=Deine ausgerüsteten Ringe kombinieren ihre Kraft und erhöhen so die Aufladegeschwindigkeit insgesamt um _%s%%._
items.rings.ringofenergy.upgrade_stat_name_1=Aufladungssteigerung
items.rings.ringofenergy.desc=Deine magische Ausrüstung lädt sich in dem arkanen Feld, das von diesem Ring ausstrahlt, schneller auf. Ein verfluchter Ring wird die Aufladung dagegen verlangsamen.

items.rings.ringofevasion.name=Ring des Ausweichens
items.rings.ringofevasion.stats=Wenn dieser Ring getragen wird, erhöht sich das Ausweichen um _%s%%._
items.rings.ringofevasion.typical_stats=Wenn dieser Ring getragen wird, erhöht sich normalerweise das Ausweichen um _%s%%._
items.rings.ringofevasion.combined_stats=Deine ausgerüsteten Ringe kombinieren ihre Kraft und erhöhen so dein Ausweichen insgesamt um _%s%%._
items.rings.ringofevasion.upgrade_stat_name_1=Verstärkung des Ausweichens
items.rings.ringofevasion.desc=Dieser Ring beschleunigt die Reaktionen seines Trägers, sodass er nicht so leicht zu treffen ist. Ein verfluchter Ring dagegen wird Gegnern Treffer erleichtern.

items.rings.ringofforce.name=Ring der Kraft
items.rings.ringofforce.stats=Unbewaffnet wirst du mit diesem Ring bei deiner momentanen Stärke _%1$d-%2$d Schaden_ verursachen. Mit einer ausgerüsteten Waffe erhöht dieser Ring den Schaden um _%3$d._
items.rings.ringofforce.typical_stats=Unbewaffnet wirst du mit diesem Ring bei deiner momentanen Stärke typischerweise _%1$d-%2$d Schaden_ verursachen. Mit einer ausgerüsteten Waffe erhöht dieser Ring typischerweise den Schaden um _%3$d._
items.rings.ringofforce.combined_stats=Deine ausgerüsteten Ringe kombinieren ihre Kraft und verursachen so insgesamt _%1$d-%2$d Schaden_ ohne ausgerüstete Waffe, oder sie erhöhen den Schaden um _%3$d_ mit einer ausgerüsteten Waffe.
items.rings.ringofforce.upgrade_stat_name_1=Unbewaffneter Schaden
items.rings.ringofforce.upgrade_stat_name_2=Gesteigerter Waffenschaden
items.rings.ringofforce.upgrade_stat_name_3=Fähigkeitsschaden
items.rings.ringofforce.ability_name=Kämpferstellung
items.rings.ringofforce.typical_ability_desc=Die Zweikämpferin kann mit diesem Ring eine _Kämpferstellung_ einnehmen, so dass sie diesen Ring immer, selbst mit ausgerüsteter Waffe einsetzt. Solche Angriffe verursachen üblicherweise _%1$d-%2$d Schaden_ und nutzen ebenso die Verzauberung und Verbesserung der Waffe. Die Kämpferstellung verlangsamt die Aufladerate einer Waffe um 50%%.
items.rings.ringofforce.ability_desc=Die Zweikämpferin kann mit diesem Ring eine _Kämpferstellung_ einnehmen, so dass sie diesen Ring immer, selbst mit ausgerüsteter Waffe einsetzt. Solche Angriffe verursachen _%1$d-%2$d Schaden_ und nutzen ebenso die Verzauberung und Verbesserung der Waffe. Die Kämpferstellung verlangsamt die Aufladerate einer Waffe um 50%%.
items.rings.ringofforce.desc=Dieser Ring verbessert die Wucht der Nahkampf-Attacken des Trägers. Diese zusätzliche Kraft ist recht schwach, wenn Waffen getragen werden, aber ein unbewaffneter Angriff wird deutlich stärker sein. Ein verfluchter Ring wird die Attacken des Trägers stattdessen schwächen.
items.rings.ringofforce$brawlersstance.name=Kämpferstellung
items.rings.ringofforce$brawlersstance.desc=In dieser Stellung wird ein ausgerüsteter Ring der Kraft bei allen regulären Angriffen der Zweikämpferin eingesetzt, selbst, wenn sie eine Waffe ausgerüstet hat. Diese Angriffe erhalten Bonusschaden und nutzen dabei die Verbesserungen und Verzauberungen der Waffe.\n\nDie Aufrechterhaltung dieser Stellung benötigt Konzentration, wodurch die Aufladegeschwindigkeit der Waffenfähigkeit um 50% reduziert wird.\n\nDiese Stellung kann durch die Nutzung des Rings der Kraft eingenommen und wieder verlassen werden, jedoch wird die Aufladegeschwindigkeit eine Zeitlang erhalten bleiben, wenn die Stellung schnell eingenommen und wieder verlassen wird.

items.rings.ringoffuror.name=Ring des Zorns
items.rings.ringoffuror.stats=Wenn dieser Ring getragen wird, erhöht er die Geschwindigkeit deiner Angriffe um _%s%%._
items.rings.ringoffuror.typical_stats=Wenn dieser Ring getragen wird, erhöht er normalerweise die Geschwindigkeit deiner Angriffe um _%s%%._
items.rings.ringoffuror.combined_stats=Deine ausgerüsteten Ringe kombinieren ihre Kraft und erhöhen so deine Angriffsgeschwindigkeit insgesamt um _%s%%._
items.rings.ringoffuror.upgrade_stat_name_1=Gesteigerte Angriffsgeschwindigkeit
items.rings.ringoffuror.desc=Dieser Ring entfacht in seinem Träger großen Zorn, wodurch er schneller angreifen kann. Ein verfluchter Ring verlangsamt stattdessen die Angriffsgeschwindigkeit des Trägers.

items.rings.ringofhaste.name=Ring der Eile
items.rings.ringofhaste.stats=Wenn dieser Ring getragen wird, erhöht sich deine Bewegungsgeschwindigkeit um _%s%%._
items.rings.ringofhaste.typical_stats=Wenn dieser Ring getragen wird, erhöht sich normalerweise deine Bewegungsgeschwindigkeit um _%s%%._
items.rings.ringofhaste.combined_stats=Deine ausgerüsteten Ringe kombinieren ihre Kraft und erhöhen so Bewegungsgeschwindigkeit insgesamt um _%s%%._
items.rings.ringofhaste.upgrade_stat_name_1=Gesteigerte Bewegungsgeschwindigkeit
items.rings.ringofhaste.desc=Dieser Ring reduziert für den Träger die für Bewegung notwendige Anstrengung, was es diesem erlaubt, sich mit übermenschlicher Geschwindigkeit zu bewegen. Ein verfluchter Ring beschwert stattdessen den Träger.

items.rings.ringofmight.name=Ring der Macht
items.rings.ringofmight.stats=Wenn dieser Ring getragen wird, erhöht sich deine Stärke um _%1$d_ und deine maximalen Lebenspunkte um _%2$s%%._
items.rings.ringofmight.typical_stats=Wenn dieser Ring getragen wird, erhöht sich normalerweise deine Stärke um _%1$d_ und deine maximalen Lebenspunkte um _%2$s%%._
items.rings.ringofmight.combined_stats=Deine ausgerüsteten Ringe kombinieren ihre Kraft und steigern so deine Stärke insgesamt um _%1$d_ und die maximalen Lebenspunkte um _%2$s%%._
items.rings.ringofmight.upgrade_stat_name_1=Stärkebonus
items.rings.ringofmight.upgrade_stat_name_2=Gesteigerte Maximale Lebenspunkte
items.rings.ringofmight.desc=Dieser Ring verstärkt die physischen Eigenschaften seines Trägers und erhöht somit die Körperkraft und Konstitution. Ein geschwächter Ring schwächt die physischen Eigenschaften seinen Träger.

items.rings.ringofsharpshooting.name=Ring des Scharfschützen
items.rings.ringofsharpshooting.stats=Wenn dieser Ring getragen wird, erhöht er den effektiven Nutzen deiner Wurfwaffen um _%1$d_ und deren Lebensdauer um _%2$s%%._
items.rings.ringofsharpshooting.typical_stats=Wenn dieser Ring getragen wird, erhöht er normalerweise den effektiven Nutzen deiner Wurfwaffen um _%1$d_ und deren Lebensdauer um _%2$s%%._
items.rings.ringofsharpshooting.combined_stats=Deine ausgerüsteten Ringe kombinieren ihre Kraft und steigern so die effektive Stufe von Wurfwaffen insgesamt um _%1$d_ und erhöhen ihre Haltbarkeit um _%2$s%%._
items.rings.ringofsharpshooting.upgrade_stat_name_1=Gesteigerter Stufenschaden
items.rings.ringofsharpshooting.upgrade_stat_name_2=Gesteigerte Haltbarkeit
items.rings.ringofsharpshooting.desc=Dieser Ring verstärkt die Präzision und das Zielvermögen seines Trägers, was allen Geschosswaffen höhere Durchschlagskraft und Lebensdauer verleiht. Ein verfluchter Ring hat den gegenteiligen Effekt.

items.rings.ringoftenacity.name=Ring der Zähigkeit
items.rings.ringoftenacity.stats=Wenn dieser Ring getragen wird, verringert er den erlittenen Schaden um bis zu _%s%%._
items.rings.ringoftenacity.typical_stats=Wenn dieser Ring getragen wird, verringert er normalerweise den erlittenen Schaden um bis zu _%s%%._
items.rings.ringoftenacity.combined_stats=Deine ausgerüsteten Ringe kombinieren ihre Kraft und verringern so den dir zugefügten Schaden insgesamt um _%s%%._
items.rings.ringoftenacity.upgrade_stat_name_1=Maximaler Schadenswiderstand
items.rings.ringoftenacity.desc=Wenn dieser getragen wird, erlaubt er seinem Träger wesentlich mehr Widerstandskraft gegen tödliche Angriffe. Je stärker sein Träger verletzt ist, desto weniger Schaden erleidet er. Ein verfluchter Ring dagegen vereinfacht es einem Gegner, den Träger zu erledigen.

items.rings.ringofwealth.name=Ring des Wohlstandes
items.rings.ringofwealth.stats=Wenn dieser Ring getragen wird, erhöht sich dein Glück um _%s%%._
items.rings.ringofwealth.typical_stats=Wenn dieser Ring getragen wird, erhöht sich normalerweise dein Glück um _%s%%._
items.rings.ringofwealth.combined_stats=Deine ausgerüsteten Ringe kombinieren ihre Kraft und erhöhen so dein Glück insgesamt um _%s%%._
items.rings.ringofwealth.upgrade_stat_name_1=Gesteigertes Glück
items.rings.ringofwealth.desc=Dieser Ring funktioniert wie ein Magnet für Schätze: Er erhöht die Wahrscheinlichkeit, dass Gegner und Behälter wertvolle Gegenstände bei sich tragen. Ein verfluchter Ring wird die Wahrscheinlichkeit hingegen reduzieren.



###scrolls
items.scrolls.scroll.ac_read=LESEN
items.scrolls.scroll.kaunan=Schriftrolle von KAUNAN
items.scrolls.scroll.sowilo=Schrifftrolle von SOWILO
items.scrolls.scroll.laguz=Schriftrolle von LAGUZ
items.scrolls.scroll.yngvi=Schriftrolle von YNGVI
items.scrolls.scroll.gyfu=Schriftrolle von GEBO
items.scrolls.scroll.raido=Schriftrolle von RAIDO
items.scrolls.scroll.isaz=Schriftrolle von ISAZ
items.scrolls.scroll.mannaz=Schriftrolle von MANNAZ
items.scrolls.scroll.naudiz=Schriftrolle von NAUDIZ
items.scrolls.scroll.berkanan=Schriftrolle von BERKANAN
items.scrolls.scroll.odal=Schriftrolle von ODAL
items.scrolls.scroll.tiwaz=Schriftrolle von TIWAZ
items.scrolls.scroll.unknown_desc=Auf diesem Pergament ist eine nicht entzifferbare magische Rune geschrieben. Wer weiß schon, was sie anstellen wird, wenn man sie laut vorliest?
items.scrolls.scroll.blinded=Du kannst keine Schriftrolle lesen, wenn du geblendet bist.
items.scrolls.scroll.no_magic=Du kannst keine Schriftrolle lesen, wenn du gegen Magie immun bist.
items.scrolls.scroll.cursed=Dein verfluchtes Zauberbuch hindert dich daran, die Magie der Schriftrolle zu wirken! Eine Schriftrolle des Fluchbrechers könnte jedoch stark genug sein...
items.scrolls.scroll$placeholder.name=Schriftrolle

items.scrolls.inventoryscroll.warning=Willst du wirklich den Spruch der Schriftrolle unterbrechen? Die Schriftrolle wurde vorher nicht identifiziert und wird somit trotzdem verbraucht.
items.scrolls.inventoryscroll.yes=Ja, ich bin mir sicher
items.scrolls.inventoryscroll.no=Nein, lieber doch nicht...

items.scrolls.scrollofidentify.name=Schriftrolle der Identifizierung
items.scrolls.scrollofidentify.inv_title=Identifiziere Gegenstand
items.scrolls.scrollofidentify.it_is=Dein Gegenstand wurde identifiziert: %s.
items.scrolls.scrollofidentify.desc=Diese Schriftrolle enthüllt sämtliche Geheimnisse eines einzigen Gegenstandes.

items.scrolls.scrolloflullaby.name=Schriftrolle des Wiegenliedes
items.scrolls.scrolloflullaby.sooth=Die Schriftrolle gibt eine schöne Melodie von sich. Du wirst müde.
items.scrolls.scrolloflullaby.desc=Beim Lesen der Schriftrolle erklingt eine beruhigende Melodie, welche alle, die sie hören können, in einen magischen Schlaf fallen lässt. Für den Verlesenden und seine Mitstreiter ist dieser Schlaf erholsam.

items.scrolls.scrollofmagicmapping.name=Schriftrolle der magischen Kartographie
items.scrolls.scrollofmagicmapping.layout=Du kennst nun die Räumlichkeiten dieser Ebene.
items.scrolls.scrollofmagicmapping.desc=Wenn diese Schriftrolle gelesen wird, wird eine genaue Abbildung dieser Ebene und all seiner Geheimnisse in deinen Gedächtnis eingeprägt. Der Standort von Gegenständen und Kreaturen bleibt dir jedoch weiterhin verborgen.

items.scrolls.scrollofmirrorimage.name=Schriftrolle des Spiegelbildes
items.scrolls.scrollofmirrorimage.copies=Die Schriftrolle erschafft Spiegelbilder von dir.
items.scrolls.scrollofmirrorimage.no_copies=Die Schriftrolle versucht, Spiegelbilder von dir zu erschaffen, aber sie finden nirgends Platz.
items.scrolls.scrollofmirrorimage.desc=Das Beschwören dieser Schriftrolle wird zwei unwirkliche Zwillinge erschaffen. Diese Spiegelbilder handeln wie schwächere Abbilder des Lesenden und jagen ihren Feinden nach. Sie halten jedoch nichts aus und verblassen, sobald sie Schaden erleiden.

items.scrolls.scrollofretribution.name=Schriftrolle der Vergeltung
items.scrolls.scrollofretribution.blast=Mächtige, magische Energie bricht aus der Schriftrolle hervor!
items.scrolls.scrollofretribution.desc=Diese Schriftrolle enthält eine destruktive Energie, die das Leiden des Lesenden in einer mächtigen Detonation nach außen kanalisiert. Je schwächer der Lesende, desto mehr Schaden richtet sie an. Bei sehr geringer Lebenskraft kann diese Schriftrolle die meisten Feinde sofort töten.\n\nAllerdings verlangt diese Schriftrolle einen Tribut von dem, der sie einsetzt: Er wird geblendet und geschwächt.

items.scrolls.scrollofrage.name=Schriftrolle des Zorns
items.scrolls.scrollofrage.roar=Die Schriftrolle gibt einen ohrenbetäubenden Lärm von sich, welcher durch das Dungeon schallt!
items.scrolls.scrollofrage.desc=Wenn diese Schriftrolle gelesen wird, entfesselt sie einen ohrenbetäubenden Schrei, welcher sämtliche Gegner anzieht. Gegner, die sich in unmittelbarer Nähe befinden, werden wütend.

items.scrolls.scrollofrecharging.name=Schriftrolle der Aufladung
items.scrolls.scrollofrecharging.surge=Eine Energiewelle fließt durch deinen Körper und erfüllt deine Zauberstäbe mit neuer Kraft.
items.scrolls.scrollofrecharging.desc=Die diesem Pergament innewohnende rohe, magische Kraft wird alle Zauberstäbe des Anwenders mit der Zeit aufladen, wenn sie entfesselt wird.

items.scrolls.scrollofremovecurse.name=Schriftrolle des Fluchbrechers
items.scrolls.scrollofremovecurse.inv_title=Wähle einen Gegenstand zum Reinigen
items.scrolls.scrollofremovecurse.cleansed=Dein Gegenstand erstrahlt in einem reinigenden Licht und eine bösartige Energie entweicht!
items.scrolls.scrollofremovecurse.not_cleansed=Dein Gegenstand gibt ein reinigenes Licht von sich, aber nichts passiert.
items.scrolls.scrollofremovecurse.spirit=Deine Schriftrolle befreit die gequälte Seele!
items.scrolls.scrollofremovecurse.desc=Die Zauberformel auf dieser Schriftrolle wird sofort alle Flüche von einer einzelnen Waffe, einem Ring, einer Rüstung oder einem Artefakt entfernen.

items.scrolls.scrollofteleportation.name=Schriftrolle der Teleportation
items.scrolls.scrollofteleportation.tele=Du wurdest augenblicklich an einen anderen Ort auf dieser Ebene teleportiert.
items.scrolls.scrollofteleportation.no_tele=Die Teleportationsmagie versagt.
items.scrolls.scrollofteleportation.cant_reach=Du kannst dich nicht dahin teleportieren.
items.scrolls.scrollofteleportation.prompt=Wähle einen Zielort zum Teleportieren.
items.scrolls.scrollofteleportation.desc=Der Zauber auf diesem Pergament transportiert den Leser sofort an einen anderen Ort auf dieser Ebene. Dabei werden Bereiche bevorzugt, an denen der Leser zuvor noch nicht war, obwohl der Spruch dabei nicht hinter verschlossene Türen oder Barrikaden teleportieren kann. Er kann aber verborgene Türen enthüllen, die zu neuen Bereichen führen.

items.scrolls.scrollofterror.name=Schriftrolle des Terrors
items.scrolls.scrollofterror.none=Die Schriftrolle strahlt einen helles, rotes Licht aus.
items.scrolls.scrollofterror.one=Die Schriftrolle strahlt einen helles, rotes Licht aus und %s flieht!
items.scrolls.scrollofterror.many=Die Schriftrolle strahlt einen helles, rotes Licht aus und die Monster fliehen!
items.scrolls.scrollofterror.desc=Wenn diese Schriftrolle gelesen wird, emittiert sie einen roten Lichtblitz, der alle Feinde in deinem Sichtfeld mit Schrecken überwältigt, so dass sie sich abwenden und fliehen.  Angriffe auf einen fliehenden Feind verkürzen die Dauer dieses Effekts.

items.scrolls.scrolloftransmutation.name=Schriftrolle der Umwandlung
items.scrolls.scrolloftransmutation.inv_title=Wandle einen Gegenstand um
items.scrolls.scrolloftransmutation.nothing=Es passiert nichts Interessantes.
items.scrolls.scrolloftransmutation.morph=Dein Gegenstand verwandelt sich in etwas anderes!
items.scrolls.scrolloftransmutation.desc=Diese Schriftrolle enthält eine mächtige Umwandlungsmagie. Wird sie auf einen passenden Gegenstand angewandt, verwandelt sie ihn in einen anderen Gegenstand des gleichen Typs. Die Magie wird dabei sogar Aufwertungen, Verzauberungen und Glyphen beibehalten. Schriftrollen und Tränke werden in ihr exotisches, exotische Schriftrollen und Tränke in ihr normales Äquivalent verwandelt.

items.scrolls.scrollofupgrade.name=Schriftrolle der Verbesserung
items.scrolls.scrollofupgrade.inv_title=Verbessere Gegenstand
items.scrolls.scrollofupgrade.weaken_curse=Die Schriftrolle der Verbesserung schwächt den Fluch deines Gegenstandes.
items.scrolls.scrollofupgrade.remove_curse=Die Schriftrolle der Verbesserung bricht den Fluch deines Gegenstandes.
items.scrolls.scrollofupgrade.desc=Diese Schriftrolle verbessert einen einzelnen Gegenstand oder einen Satz Wurfwaffen. Zauberstäbe werden stärker und können mehr Ladungen erhalten, Waffen und Rüstungen verursachen bzw. blockieren mehr Schaden, Wurfwaffensätze werden komplett repariert und haltbarer, und die Wirkung von Ringen wird intensiviert.\n\nSie kann sogar Flüche abschwächen oder manchmal sogar ganz aufheben, ist aber nicht so wirksam wie eine Schriftrolle des Fluchbrechers. Leider kann die Verbesserungsmagie auch Verzauberungen oder Glyphen auf höherwertiger Ausrüstung löschen.



###exotic scrolls
items.scrolls.exotic.exoticscroll.kaunan=exotische Schriftrolle von KAUNAN
items.scrolls.exotic.exoticscroll.sowilo=exotische Schriftrolle von SOWILO
items.scrolls.exotic.exoticscroll.laguz=exotische Schriftrolle von LAGUZ
items.scrolls.exotic.exoticscroll.yngvi=exotische Schriftrolle von YNGVI
items.scrolls.exotic.exoticscroll.gyfu=exotische Schriftrolle von GEBO
items.scrolls.exotic.exoticscroll.raido=exotische Schriftrolle von RAIDO
items.scrolls.exotic.exoticscroll.isaz=exotische Schriftrolle von ISAN
items.scrolls.exotic.exoticscroll.mannaz=exotische Schriftrolle von MANNAZ
items.scrolls.exotic.exoticscroll.naudiz=exotische Schriftrolle von NAUDIZ
items.scrolls.exotic.exoticscroll.berkanan=exotische Schriftrolle von BERKANAN
items.scrolls.exotic.exoticscroll.odal=exotische Schriftrolle von OTHALAN
items.scrolls.exotic.exoticscroll.tiwaz=exotische Schriftrolle von TIWAZ
items.scrolls.exotic.exoticscroll.unknown_desc=Eine pulsierende, nicht zu entziffernde magische Rune ist auf dieses schwarze Pergament geschrieben worden. Sie scheint in dieser Welt fremd zu sein. Wer weiß, was passiert, wenn man sie laut liest?
items.scrolls.exotic.exoticscroll.discover_hint=Du kannst diesen Gegenstand mit Alchemie herstellen.

items.scrolls.exotic.scrollofsirenssong.name=Schriftrolle des Sirenenlieds
items.scrolls.exotic.scrollofsirenssong.prompt=Wähle ein Ziel
items.scrolls.exotic.scrollofsirenssong.no_target=Die Schriftrolle wird ohne ein Ziel aktiviert.
items.scrolls.exotic.scrollofsirenssong.cancel=Du musst ein Ziel auswählen.
items.scrolls.exotic.scrollofsirenssong.desc=Wenn diese Schriftrolle gelesen wird, ertönt eine betörende Melodie, welche eine feindliche Kreatur bezaubert und sie permanent zu einer verbündeten Kreatur macht! Andere Feinde, die diese Melodie hören, werden zeitweilig betört sein.\n\nBesonders starke Feinde können der Bezauberung widerstehen, so dass sie stattdessen nur betört werden.
items.scrolls.exotic.scrollofsirenssong$enthralled.name=bezaubert
items.scrolls.exotic.scrollofsirenssong$enthralled.desc=Diese Kreatur ist durch die Magie einer Schriftrolle des Sirenenlieds bezaubert worden.\n\nEin bezaubertes Wesen ist für immer dein Verbündeter und bekämpft jeden Feind, dem es begegnet.

items.scrolls.exotic.scrollofantimagic.name=Schriftrolle der Antimagie
items.scrolls.exotic.scrollofantimagic.desc=Das Aussprechen dieses Zauberspruchs wird dich mit einer magischen Aura umgeben, die zeitweilig alle magischen Effekte blockiert, seien diese schädlich oder hilfreich. Das umfasst auch die meisten Effekte magischer Gegenstände wie Zauberstäbe, Schriftrollen, Ringe, Artefakte, Verzauberungen und Flüche. Die Fähigkeiten der Heldenrüstung sind allerdings stark genug, um trotzdem zu funktionieren.

items.scrolls.exotic.scrollofchallenge.name=Schriftrolle der Herausforderung
items.scrolls.exotic.scrollofchallenge.desc=Wenn sie laut gelesen wird, entfesselt diese Schriftrolle ein lautes Brüllen, das Feinde zum Nutzer lockt, während sie gleichzeitig eine kleine Arena um ihn herum erschafft.\n\nSolange der diese Schriftrolle Lesende innerhalb dieser Arena verweilt, erleidet er 33% weniger Schaden, egal, aus welcher Quelle (dies geschieht vor anderen Arten der Schadensreduktion), und seine Sättigung nimmt nicht ab.\n\nDie Größe der Arena ist umso größer, je größer das Gebiet ist, in dem sich der Lesende befindet. Sie wird in manchen Boss-Gebieten besonders klein sein.
items.scrolls.exotic.scrollofchallenge$challengearena.name=Arena der Herausforderung
items.scrolls.exotic.scrollofchallenge$challengearena.desc=Um dich herum ist eine Arena entstanden, die durch einen wabernden roten Nebel gekennzeichnet ist.\n\nSolange du innerhalb des Nebels verbleibst, wird dein Hunger nicht zunehmen und du erleidest 33%% weniger Schaden, egal, aus welcher Quelle. Sofern du andere Quellen der Schadensreduktion hast (wie etwa Rüstung), so werden diese erst nach der 33%% Reduktion angewandt.\n\nVerbleibende Züge: %d.

items.scrolls.exotic.scrollofdivination.name=Schriftrolle der Wahrsagerei
items.scrolls.exotic.scrollofdivination.nothing_left=Es gibt nichts mehr zu identifizieren!
items.scrolls.exotic.scrollofdivination.desc=Dieser Zauberspruch wird vier zufällige Eigenschaften von Gegenständen identifizieren, die dir noch nicht bekannt sind. Das kann die Farbe eines Tranks, die Rune einer Schriftrolle oder der Edelstein eines Rings sein. Die identifizierten Gegenstände müssen nicht unbedingt unter denen sein, die du bei dir trägst.
items.scrolls.exotic.scrollofdivination$wnddivination.desc=Deine Schriftrolle der Wahrsagerei hat die folgenden Gegenstände identifiziert:

items.scrolls.exotic.scrollofdread.name=Schriftrolle der Furcht
items.scrolls.exotic.scrollofdread.desc=Wenn diese Schriftrolle gelesen wird, emittiert sie einen roten Lichtblitz, der unvorstellbaren Schrecken über alle Feinde in deinem Sichtkreis bringt. Der Effekt ist so heftig, dass sie schleunigst aus dem Dungeon fliehen, so dass man sie nie wiedersieht!\n\nGenau wie bei der Schriftrolle des Terrors kann der Effekt mit der Zeit nachlassen, oder dann, wenn der Feind angegriffen wird.\n\nFeinde mit besonders starkem Willen, solche wie die Bosse, werden stattdessen von gewöhnlichem Schrecken übermannt.

items.scrolls.exotic.scrollofenchantment.name=Schriftrolle der Verzauberung
items.scrolls.exotic.scrollofenchantment.inv_title=Verzaubere einen Gegenstand
items.scrolls.exotic.scrollofenchantment.weapon=Wähle eine Verzauberung. die du auf deiner Waffe anwenden willst.
items.scrolls.exotic.scrollofenchantment.armor=Wähle eine Glyphe, die du auf deiner Rüstung anbringen willst.
items.scrolls.exotic.scrollofenchantment.cancel=Abbrechen
items.scrolls.exotic.scrollofenchantment.cancel_warn=Abbrechen wird deine Schriftrolle der Verzauberung trotzdem verbrauchen. Bist du sicher?
items.scrolls.exotic.scrollofenchantment.cancel_warn_yes=Ja, ich bin mir sicher.
items.scrolls.exotic.scrollofenchantment.cancel_warn_no=Nein, ich habe meine Meinung geändert
items.scrolls.exotic.scrollofenchantment.desc=Diese Schriftrolle wird eine Rüstung oder Waffe mit einer starken magischen Energie versehen. Der Lesende hat sogar eine gewisse Kontrolle über die Art von Magie, welche hineingezaubert wird.

items.scrolls.exotic.scrollofforesight.name=Schriftrolle der Vorhersehung
items.scrolls.exotic.scrollofforesight.desc=Nachdem du diese Schriftrolle liest, werden Details des umgebenden Terrains mit kristallener Klarheit in deinem Verstand erscheinen. Dieser Effekt hält eine beträchtliche Zeit an und offenbart verborgene Türen und Fallen, ohne, dass du danach suchen müsstest.

items.scrolls.exotic.scrollofmetamorphosis.name=Schriftrolle der Metamorphose
items.scrolls.exotic.scrollofmetamorphosis.choose_desc=Wähle ein Talent für die Metamorphose
items.scrolls.exotic.scrollofmetamorphosis.replace_desc=Wähle ein neues Talent, durch das dein gewandeltes Talent ersetzt werden soll.
items.scrolls.exotic.scrollofmetamorphosis.cancel_warn=Auch wenn du abbrichst, wird deine Schriftrolle der Metamorphose verbraucht. Bist du sicher?
items.scrolls.exotic.scrollofmetamorphosis.metamorphose_talent=Talent umwandeln
items.scrolls.exotic.scrollofmetamorphosis.desc=Diese Schriftrolle birgt eine mächtige Transmutationsmagie, die auf die lesende Person anstatt auf einen Gegenstand wirkt. Die Magie dieser Schriftrolle lässt dich ein Talent auswählen und dieses durch eines von fünf Talenten derselben Stufe von anderen Heldenklassen ersetzen.\n\nDieser Effekt wirkt nur auf Talente von Klassen, nicht auf Talente, die von Unterklassen oder durch Rüstungsfähigkeiten verliehen werden. Talente, die du nicht einsetzen kannst, werden nicht zur Auswahl stehen.

items.scrolls.exotic.scrollofmysticalenergy.name=Schriftrolle der mystischen Energie
items.scrolls.exotic.scrollofmysticalenergy.desc=Die rohe magische Macht, die auf dieses Pergament gebannt wurde, wird, wenn man sie entfesselt, die ausgerüsteten Artefakte des Lesenden mit der Zeit aufladen.

items.scrolls.exotic.scrollofpassage.name=Schriftrolle des Aufstiegs
items.scrolls.exotic.scrollofpassage.desc=Der Zauberspruch auf diesem Pergament befördert den Lesenden sofort zum Eingang der ersten Ebene der aktuellen Region. Sehr nützlich, um schnell zu einem Laden zu gelangen.

items.scrolls.exotic.scrollofprismaticimage.name=Schriftrolle der Lichtbrechung
items.scrolls.exotic.scrollofprismaticimage.desc=Das Beschwören dieser Schriftrolle wird eine Illusion des Lesers erschaffen, die in allen Farben des Regenbogens erstrahlt. Dieses magische Ebenbild verhält sich wie ein schwächeres Abbild des Lesers mit ähnlicher Verteidigung, aber geringerer Lebensenergie und weniger verursachtem Schaden.\n\nDas Abbild erscheint, wenn Gegner in der Nähe sind und wird versuchen, den Leser zu verteidigen.\n\nWenn es bereits existiert, wird diese Schriftrolle das Abbild vollständig heilen.

items.scrolls.exotic.scrollofpsionicblast.name=Schriftrolle der psionischen Explosion
items.scrolls.exotic.scrollofpsionicblast.ondeath=Die psionische Explosion riss deinen Geist in Stücke...
items.scrolls.exotic.scrollofpsionicblast.desc=Diese Schriftrolle birgt unglaubliche destruktive Energie, welche dazu verwendet werden kann, den Geist aller sichtbaren Kreaturen in Stücke zu reißen.\n\nDas hat aber auch eine bedeutende Kehrseite: Auch der Lesende wird verletzt, geblendet und geschwächt. Je mehr Ziele dieser Zauberspruch trifft, desto weniger Schaden erfährt der Lesende.



###spells
items.spells.alchemize.name=Alchemieren
items.spells.alchemize.prompt=einen Gegenstand alchemisieren
items.spells.alchemize.desc=Dieser Zauber birgt eine Transmutationskraft ähnlich der, die man in Alchemiekesseln findet. Jeder Spruch dieses Zaubers erlaubt es dem Nutzer, einen (oder mehrere) Gegenstände in Gold oder alchemische Energie zu verwandeln. Tränke oder Schriftrollen werden durch diese Verwandlung dazu noch identifiziert!\n\nEinige wenige Alchemierungen werden in Läden verkauft, aber wesentlich mehr können durch Alchemie hergestellt werden, indem man einen Samen, einen Runenstein und etwas alchemische Energie kombiniert.
items.spells.alchemize$wndalchemizeitem.sell=In %d Gold umwandeln
items.spells.alchemize$wndalchemizeitem.sell_1=1 in %d Gold umwandeln
items.spells.alchemize$wndalchemizeitem.sell_all=Alle in %d Gold umwandeln
items.spells.alchemize$wndalchemizeitem.energize=In %d Energie umwandeln
items.spells.alchemize$wndalchemizeitem.energize_1=1 in %d Energie umwandeln
items.spells.alchemize$wndalchemizeitem.energize_all=Alle in %d Energie umwandeln

items.spells.beaconofreturning.name=Leuchtfeuer der Rückkehr
items.spells.beaconofreturning.preventing=Die starke magische Aura dieses Ortes verhindert, dass du diesen Zauber verwendest.
items.spells.beaconofreturning.creatures=Die psychische Aura naher Kreaturen erlaubt es dir im Moment nicht, dich zu teleportieren.
items.spells.beaconofreturning.set=Das Leuchtfeuer wurde auf deine jetzige Position gesetzt.
items.spells.beaconofreturning.wnd_body=Setzen wird den Ort überschreiben, auf den das Leuchtfeuer vorher eingestellt war.\n\nZurückkehren wird dich zur zuletzt gesetzten Position zurückbringen und eine Benutzung des Zaubers verbrauchen.
items.spells.beaconofreturning.wnd_set=Setzen
items.spells.beaconofreturning.wnd_return=Rückkehr
items.spells.beaconofreturning.desc_set=Dieses Leuchtfeuer wurde irgendwo auf Ebene %d gesetzt.
items.spells.beaconofreturning.desc=Dieser schwierige Zauber erlaubt es dem Anwender, zu einer voreingestellten Stelle zurückzukehren, egal wie weit weg sie liegt. Die Zauberkraft wird nur durch das Rückkehren verbraucht, die Position kann so oft festgelegt werden, wie gewünscht. Aber nur der zuletzt gesetzte Ort gilt.

items.spells.curseinfusion.name=Fluchinfusion
items.spells.curseinfusion.inv_title=Verfluche einen Gegenstand
items.spells.curseinfusion.desc=Dieser Zauber erfüllt einen Gegenstand mit der gleichen starken, bösartigen Magie, die auch dem DM-300 innewohnt. Der betroffene Gegenstand wird sofort verflucht und jede Verzauberung oder Glyphe überschrieben.\n\nBei Waffen, Rüstung oder Zauberstäben wird der jeweilige Gegenstand zusätzlich zum Fluch deutlich verbessert. Verbesserungen durch Fluchinfusion summieren sich aber nicht, und die Verbesserungen verschwinden, sobald der Fluch des Gegenstands gebrochen wird.\n\nMehrere Fluchinfusionen können auch dazu genutzt werden, den Fluch auf einer Waffe oder Rüstung zu ändern.

items.spells.spell.ac_cast=ZAUBERN
items.spells.spell.no_magic=Du kannst keine Zauber sprechen, während du gegen Magie immun bist.
items.spells.spell.discover_hint=Du kannst diesen Gegenstand mit Alchemie herstellen.

items.spells.magicalinfusion.name=magische Infusion
items.spells.magicalinfusion.inv_title=Fusioniere Gegenstand
items.spells.magicalinfusion.infuse=Dein Gegenstand ist von arkaner Macht durchdrungen!
items.spells.magicalinfusion.desc=Dieser Zauberspruch besitzt die gleiche magische Energie wie die Schriftrolle der Verbesserung, jedoch in etwas stabilerer Form.\n\nAbgesehen von der normalen Verbesserung eines Gegenstandes wird dieser Zauberspruch niemals eine Verzauberung oder einen Fluch entfernen.

items.spells.magicalporter.name=Magischer Träger
items.spells.magicalporter.inv_title=Trage einen Gegenstand
items.spells.magicalporter.nowhere=Es gibt keinen Ort, an welchen ein Gegenstand hingetragen werden könnte.
items.spells.magicalporter.desc=Dieser Zauber wird auf magische Art und Weise jeden Gegenstand transportieren. Anders als beim Händler-Ortungsgerät werden die Gegenstände jedoch zum Eingang der nächsten Boss-Ebene verbracht.

items.spells.phaseshift.name=Phasensprung
items.spells.phaseshift.no_target=Es gibt hier nichts zu teleportieren.
items.spells.phaseshift.desc=Dieser chaotische Zauber wird jeden Charakter, auf den er abzielt, auf eine zufällige Stelle auf der aktuellen Ebene teleportieren, und ihn eine beträchtliche Zeit lang betäuben. Starke Gegner werden dem Betäubungseffekt widerstehen können. Der Zauber kann auf ein Ziel oder den Zaubernden selbst gerichtet werden.

items.spells.reclaimtrap.name=Falle bergen
items.spells.reclaimtrap.no_trap=Dort ist keine Falle.
items.spells.reclaimtrap.desc_trap=Der Zauber ist derzeit dazu bereit, _%s_ auszulösen.
items.spells.reclaimtrap.desc=Dieser Spruch beinhaltet mechanische Energie aus dem DM-300. Auf eine aktive Falle angewendet, haftet dir die Kraft der Falle an, und du kannst den Zauber erneut wirken, um diese Kraft zu entfesseln und den Effekt der Falle an einem beliebigen Ort auszulösen.\n\nAllerdings werden bestimmte Fallen nicht an allen Orten funktionieren, und der Zauber kann nur die Kraft einer Falle gleichzeitig speichern.

items.spells.recycle.name=Wiederverwertung
items.spells.recycle.inv_title=Einen Gegenstand wiederverwerten
items.spells.recycle.recycled=Dein Gegenstand wurde als %s wiederverwertet.
items.spells.recycle.desc=Dieser Zauberspruch birgt eine schwächere Art von Verwandlungsmagie. Sie wirkt zwar nicht auf Ausrüstungsgegenstände, kann jedoch Schriftrollen, Tränke, Samen, Runensteine oder präparierte Pfeile in einen zufälligen Gegenstand gleicher Art umwandeln.

items.spells.summonelemental.name=Elementar beschwören
items.spells.summonelemental.ac_imbue=VERSCHMELZEN
items.spells.summonelemental.imbue_prompt=Einen Gegenstand verschmelzen
items.spells.summonelemental.desc=Dieser Zauberspruch kanalisiert die Energie der zur Herstellung verwendeten Asche eines Elementars und beschwört ein freundliches Elementar, das an deiner Seite kämpft! Es kann immer nur ein Elementar gleichzeitig beschworen werden, aber du kannst den Zauberspruch weiterhin, ohne ihn zu verbrauchen, einsetzen, um das Elementar zu dir zurückzurufen.
items.spells.summonelemental.desc_newborn=Dieser Zauberspruch ist derzeit nicht verschmolzen und wird ein _neugeborenes Elementar_ ohne Fernkampffähigkeit beschwören. Du kannst einen identifizierten Trank der flüssigen Flamme, einen Trank des Frosts, eine Schriftrolle der Aufladung oder eine Schriftrolle der Umwandlung mit dem Zauberspruch verschmelzen, um ihm mehr Kraft zu verleihen, so dass künftige Beschwörungen ein ausgewachsenes Elementar erschaffen!
items.spells.summonelemental.desc_fire=Dieser Zauberspruch fühlt sich derzeit heiß an, er wird ein _Feuerelementar_ beschwören. Du kannst ihn mit einem anderen Gegenstand verschmelzen, doch dann verliert der Spruch seine gegenwärtige Verschmelzung.
items.spells.summonelemental.desc_frost=Der Zauberspruch fühlt sich derzeit kalt an, er wird ein _Frostelementar_ beschwören. Du kannst ihn mit einem anderen Gegenstand verschmelzen, doch dann verliert der Spruch seine gegenwärtige Verschmelzung.
items.spells.summonelemental.desc_shock=Dieser Zauberspruch strahlt derzeit elektrostatische Energie aus, er wird ein _Schockelementar_ beschwören. Du kannst ihn mit einem anderen Gegenstand verschmelzen, doch dann verliert der Spruch seine gegenwärtige Verschmelzung.
items.spells.summonelemental.desc_chaos=Dieser Zauberspruch strahlt derzeit chaotische Energie aus, er wird ein _Chaoselementar_ beschwören. Du kannst ihn mit einem anderen Gegenstand verschmelzen, doch dann verliert der Spruch seine gegenwärtige Verschmelzung.

items.spells.targetedspell.prompt=Wähle ein Ziel
items.spells.targetedspell.inv_title=Fusioniere Gegenstand

items.spells.telekineticgrab.name=telekinetischer Griff
items.spells.telekineticgrab.cant_grab=Du kannst nicht danach greifen.
items.spells.telekineticgrab.no_target=Dort gibt es nichts zu greifen.
items.spells.telekineticgrab.desc=Dieser Zauberspruch erlaubt es dem Zaubernden, Gegenstände an einem fernen Ort oder in einem Feind steckende Wurfwaffen zu greifen!\n\nEr kann nicht eingesetzt werden, um sich fremdes Eigentum anzueignen oder um nach Behältern wie Truhen zu greifen.

items.spells.unstablespell.name=instabiler Zauberspruch
items.spells.unstablespell.desc=Dieser kleine, schwarze Kristallwürfel zeigt auf jeder seiner Oberflächen eine sich ändernde Rune.\n\nBei Aktivierung wird er den Effekt eines zufälligen Zauberspruchs auslösen. Sollten Feinde im Sichtfeld sein, wird es sich um einen Angriffszauber handeln, andernfalls wird ein friedlicher Spruch ausgelöst.

items.spells.wildenergy.name=ungezähmte Energie
items.spells.wildenergy.desc=Dieser Zauber enthält einen Teil der verfluchten Energie, die den DM-300 angetrieben hat. Wird er gesprochen, wird er deine Zauberstäbe und getragenen Artefakte aufladen und außerdem einen zufälligen verfluchten Stabeffekt auslösen. Du kannst jedoch die Richtung wählen, in welche diese verfluchte Magie geschossen wird.


###runestones
items.stones.inventorystone.ac_use=VERWENDEN

items.stones.runestone$placeholder.name=Runenstein
items.stones.runestone.discover_hint=Du kannst diesen Gegenstand zufällig im Dungeon finden oder mit Alchemie herstellen.

items.stones.stoneofaggression.name=Stein der Aggression
items.stones.stoneofaggression.desc=Wenn dieser Stein auf einen Verbündeten oder Feind geworfen wird, werden es alle Feinde in der Nähe bevorzugen, diesen Charakter für kurze Zeit anzugreifen.\n\nBossgegner können dem Effekt jedoch widerstehen, wodurch die Dauer erheblich verkürzt wird und sie weniger Schaden durch die Angriffe ihrer Diener erleiden.
items.stones.stoneofaggression$aggression.name=markiert
items.stones.stoneofaggression$aggression.desc=Manipulative Magie bringt alle nahen Feinde dazu, diesen Charakter bevorzugt anzugreifen.\n\nVerbleibende Züge: %s.

items.stones.stoneofaugmentation.name=Stein der magischen Feineinstellung
items.stones.stoneofaugmentation.inv_title=Verzaubere einen Gegenstand
items.stones.stoneofaugmentation.desc=Dieser Runenstein besitzt eine kraftvolle Magie, mithilfe derer sich die Eigenschaft eines Gegenstandes auf Kosten einer anderen verbessern lässt.\n\nAuf eine Waffe angewandt, erhöht er entweder die Geschwindigkeit oder den Schaden. Ebenso erhalten oder verlieren Wurfwaffen proportional zu ihrer Geschwindigkeit an Haltbarkeit.\n\nAuf eine Rüstung angewandt, erhöht er entweder die Ausweichrate oder die Verteidigung.
items.stones.stoneofaugmentation.discover_hint=Du kannst diesen Gegenstand in einem Laden kaufen oder mit Alchemie herstellen.
items.stones.stoneofaugmentation$wndaugment.choice=Was würdest Du gern erhöhen?
items.stones.stoneofaugmentation$wndaugment.speed=Geschwindigkeit
items.stones.stoneofaugmentation$wndaugment.damage=Schaden
items.stones.stoneofaugmentation$wndaugment.evasion=Ausweichen
items.stones.stoneofaugmentation$wndaugment.defense=Verteidigung
items.stones.stoneofaugmentation$wndaugment.none=Feineinstellung entfernen
items.stones.stoneofaugmentation$wndaugment.cancel=Später entscheiden

items.stones.stoneofblast.name=Stein der Detonation
items.stones.stoneofblast.desc=Dieser Stein wird sofort an der Stelle explodieren, an die er geworfen wurde. Genau wie eine Bombe wird die Explosion alles beschädigen, was in der Nähe ist.

items.stones.stoneofblink.name=Blinzelstein
items.stones.stoneofblink.desc=Dieser Runenstein wird den Werfenden zu der Stelle teleportieren, an der er landet.

items.stones.stoneofclairvoyance.name=Stein der Hellsichtigkeit
items.stones.stoneofclairvoyance.desc=Dieser Stein wird sofort einen großen Bereich um die Stelle offenbaren, an die er geworfen wird. Dieser Effekt wird durch Wände nicht behindert.

items.stones.stoneofdeepsleep.name=Stein des Tiefschlafs
items.stones.stoneofdeepsleep.desc=Wenn dieser Stein auf einen Feind geworfen wird, versetzt er ihn in einen tiefen magischen Schlaf. Magisch eingeschlafene Feinde werden für immer schlafen, bis sie gestört werden.

items.stones.stoneofdetectmagic.name=Stein der Zaubersicht
items.stones.stoneofdetectmagic.inv_title=Prüfe einen Gegenstand
items.stones.stoneofdetectmagic.detected_none=Du bemerkst keine Magie, die auf diesen Gegenstand einwirkt.
items.stones.stoneofdetectmagic.detected_both=Du entdeckst sowohl positive als auch bösartige Magie, die auf diesen Gegenstand einwirkt!
items.stones.stoneofdetectmagic.detected_good=Du entdeckst positive Magie, die diesen Gegenstand beeinflusst!
items.stones.stoneofdetectmagic.detected_bad=Du entdeckst, dass bösartige Magie auf diesen Gegenstand einwirkt!
items.stones.stoneofdetectmagic.desc=Dieser Runenstein kann Magie erkennen, die einen Gegenstand beeinflusst. Wenn dieser Stein auf einen nicht identifizierten Gegenstand angewendet wird, erfährst du, ob dieser von einem bösen Fluch betroffen ist und ob er von positiver Magie wie einer Verzauberung oder Verbesserungen beeinflusst wird.

items.stones.stoneofdisarming.name=Stein der Entwaffnung
items.stones.stoneofdisarming.desc=Dieser Runenstein enthält Magie, die im Dungeon verborgene, heimtückische Fallen entschärfen kann. Er entschärft bis zu 9 Fallen im Bereich, in den man ihn wirft.

items.stones.stoneofenchantment.name=Stein der Verzauberung
items.stones.stoneofenchantment.inv_title=Verzaubere einen Gegenstand
items.stones.stoneofenchantment.weapon=Deine Waffe glüht in der Dunkelheit!
items.stones.stoneofenchantment.armor=Deine Rüstung glüht in der Dunkelheit!
items.stones.stoneofenchantment.desc=Dieser Runenstein besitzt die Magie der Bezauberung. Anders als eine Schriftrolle der Verbesserung, kann er nicht direkt die Macht eines Gegenstands erhöhen. Stattdessen wird er eine Waffe oder Rüstung mit einem Zauber versehen, so dass sie eine neue Eigenschaft erhalten.

items.stones.stoneoffear.name=Stein der Furcht
items.stones.stoneoffear.desc=Wenn dieser Stein auf einen Charakter geworfen wird, wird dieser von Angst überwältigt, dreht sich um und flieht. Wenn du einen fliehenden Charakter angreifst, wird der Effekt verkürzt.

items.stones.stoneofflock.name=Herdenstein
items.stones.stoneofflock.desc=Dieser Runenstein beschwört für eine kurze Zeit magische Schafe herauf, um die Stelle herum an die er geworfen wurde.

items.stones.stoneofintuition.name=Stein der Intuition
items.stones.stoneofintuition.inv_title=Wähle einen Gegenstand
items.stones.stoneofintuition.desc=Dieser Runenstein besitzt eine schwächere Version der Magie, die auch in Schriftrollen der Identifizierung zu finden ist. Anstatt einen Gegenstand direkt zu identifizieren, bemüht er deine Intuition, und erlaubt dir so den Versuch, die Eigenschaften eines Tranks, einer Schriftrolle oder eines Rings zu erraten.
items.stones.stoneofintuition.break_info=Du kannst den Stein der Intuition zweimal benutzen, bevor er zerbricht. _Deine nächste Nutzung wird keinen Stein verbrauchen_.
items.stones.stoneofintuition.break_warn=Du hast zuvor einen Stein der Intuition benutzt, also _wird deine nächste Nutzung einen Stein verbrauchen_.
items.stones.stoneofintuition$wndguess.text=Errate, welchen Typs der nicht identifizierte Gegenstand ist. Falls du richtig liegst, wird der Gegenstand identifiziert!
items.stones.stoneofintuition$wndguess.correct=Richtig. Der Typ des Gegenstands wurde identifiziert!
items.stones.stoneofintuition$wndguess.incorrect=Du hast falsch geraten.
items.stones.stoneofintuition$wndguess.break=Dein Stein der Intuition zerfällt zu Staub...

items.stones.stoneofshock.name=Stein des Schocks
items.stones.stoneofshock.desc=Dieser Runenstein setzt einen Strahl elektrischer Energie frei, welche vorübergehend alle Ziele in der Nähe betäubt und dem Werfenden pro Treffer eine Zauberstabaufladung einbringt.


###trinkets
items.trinkets.chaoticcenser.name=chaotischer Weihrauch
items.trinkets.chaoticcenser.spew=Dein Weihrauchgefäß produziert gleich: %s.
items.trinkets.chaoticcenser.desc=Nach einiger Zeit im Alchemiegefäß scheint dieses Weihrauchgefäß ganz von selbst Rauch zu produzieren! Diese Gase sammeln sich an und spucken in zufälligen Abständen aus dem Weihrauchfass auf die Gegner. Es scheint in der Lage zu sein, alle Arten von Gasen zu produzieren aber ihr werdet einen Moment vorgewarnt, bevor das Räuchergefäß aktiviert wird.
items.trinkets.chaoticcenser.typical_stats_desc=Dieses Kleinod wird ungefähr alle _%d_ Züge schädliches Gas in der Nähe eines Feindes erzeugen. Gase treten nur auf, wenn Feinde zugegen sind. Auf höheren Stufen steigt die Wahrscheinlichkeit, dass exotisches und mächtiges Gas erzeugt wird.
items.trinkets.chaoticcenser.stats_desc=Dieses Kleinod wird ungefähr alle _%d_ Züge schädliches Gas in der Nähe eines Feindes erzeugen. Gase treten nur auf, wenn Feinde zugegen sind. Auf höheren Stufen steigt die Wahrscheinlichkeit, dass exotisches und mächtiges Gas erzeugt wird.

items.trinkets.crackedspyglass.name=gesprungenes Fernglas
items.trinkets.crackedspyglass.desc=Dieses handliche Teleskop wäre ein beeindruckendes Beispiel für großartige und präzise Handwerkskunst – wäre da nicht der Riss in seiner vorderen Linse. Das Fernrohr scheint dir zu helfen, neue Gegenstände im Dungeon aufzuspüren, doch durch seinen Makel sind die entdeckten Objekte nur schwer zu erkennen!
items.trinkets.crackedspyglass.typical_stats_desc=Normalerweise erschafft dieses Kleinod mit einer _Chance von %1$s%%_ einen zusätzlichen verborgenen Raum auf jeder Nicht-Boss-Ebene.
items.trinkets.crackedspyglass.stats_desc=Auf seiner aktuellen Stufe hat dieses Kleinod eine _Chance von %1$s%%_, einen zusätzlichen verborgenen Gegenstand auf jeder Nicht-Boss-Ebene zu erschaffen.
items.trinkets.crackedspyglass.stats_desc_upgraded=Auf seiner aktuellen Stufe hat dieses Kleinod eine _Chance von 100%%_, einen zusätzlichen verborgenen Gegenstand auf jeder Nicht-Boss-Ebene zu erschaffen, sowie eine _Chance von %1$s%%_, einen zweiten verborgenen Gegenstand zu erschaffen.

items.trinkets.dimensionalsundial.name=Dimensions-Sonnenuhr
items.trinkets.dimensionalsundial.warning=Deine Sonnenuhr wirft keinen Schatten, du fühlst dich unbehaglich.
items.trinkets.dimensionalsundial.desc=Diese kleine, in der Hand gehaltene Sonnenuhr ist irgendwie auch in den Tiefen des Dungeons dazu in der Lage, einen Schatten zu werfen, selbst dann, wenn du sie nicht waagerecht hältst. Noch seltsamer, die Position des Schattens hat scheinbar keinen Bezug zur Sonne in dieser Welt. Wenn kein Schatten geworfen wird, scheint die Sonnenuhr Gefahr anzuziehen.
items.trinkets.dimensionalsundial.typical_stats_desc=Normalerweise reduziert dieses Kleinod die Spawn-Rate tagsüber (8-20 Uhr) um _%1$d %%_, und es erhöht die Spawn-Rate nachts (20-8 Uhr) um _%2$d%%_.
items.trinkets.dimensionalsundial.stats_desc=Auf der aktuellen Stufe reduziert dieses Kleinod die Spawn-Rate tagsüber (8-20 Uhr) um _%1$d %%_, und es erhöht die Spawn-Rate nachts (20-8 Uhr) um _%2$d%%_.

items.trinkets.exoticcrystals.name=exotische Kristalle
items.trinkets.exoticcrystals.desc=Diese kleinen rosafarbenen Kristalle haben die gleiche Form wie die Kristalle der alchemischen Energie. Obwohl sie nicht direkt zur Energiegewinnung taugen, beeinflussen sie irgendwie die Tränke und Schriftrollen, die du findest.
items.trinkets.exoticcrystals.typical_stats_desc=Normalerweise wird dieses Kleinod _%s%%_ der gefundenen Tränke oder Schriftrollen durch ihr exotisches Äquivalent ersetzen. Das betrifft keine Tränke der Stärke, Schriftrollen der Verbesserung, oder Gegenstände, die benötigt werden, um Gefahrenräume zu meistern.
items.trinkets.exoticcrystals.stats_desc=Auf der aktuellen Stufe wird dieses Kleinod _%s%%_ der gefundenen Tränke oder Schriftrollen durch ihr exotisches Äquivalent ersetzen. Das betrifft keine Tränke der Stärke, Schriftrollen der Verbesserung, oder Gegenstände, die benötigt werden, um Gefahrenräume zu meistern.

items.trinkets.eyeofnewt.name=Molchauge
items.trinkets.eyeofnewt.desc=Dieses schwarzgoldene Molchauge ist eine gewöhnliche Zutat, die hier zu einem Kleinod verarbeitet wurde. Das Auge scheint deine Sichtweite zu reduzieren, dafür verändert es deine Wahrnehmung.
items.trinkets.eyeofnewt.typical_stats_desc=Normalerweise wird dieses Kleinod deine Sichtweite um _%1$s%%_ verringern, verleiht dir aber gleichzeitig übersinnliche Wahrnehmung gegenüber Feinden in einem Umkreis von _%2$d_ Feldern.
items.trinkets.eyeofnewt.stats_desc=Auf der aktuellen Stufe wird dieses Kleinod deine Sichtweite um _%1$s%%_ verringern, verleiht dir aber gleichzeitig übersinnliche Wahrnehmung gegenüber Feinden in einem Umkreis von _%2$d_ Feldern.

items.trinkets.ferrettuft.name=Frettchenfell
items.trinkets.ferrettuft.desc=Ein Büschel aus seidigem, weißen Frettchenfell, das von einer hellgrünen Schleife zusammengehalten wird. Frettchen sind für ihre Flinkheit, Hinterhältigkeit und mangelnde Integrität bekannt. Das Kleinod scheint etwas von dieser Kraft auszustrahlen und erleichtert allem um sich herum das Ausweichen.
items.trinkets.ferrettuft.typical_stats_desc=Normalerweise erhöht dieses Kleinod die Ausweichrate aller Charaktere um _%1$s%%_.
items.trinkets.ferrettuft.stats_desc=Auf seiner aktuellen Stufe erhöht dieses Kleinod die Ausweichrate aller Charaktere um _%1$s%%_.

items.trinkets.mimictooth.name=Zahn eines Mimik
items.trinkets.mimictooth.desc=Dieser große, scharfe Zahn muss wohl einem sehr unglücklichen Mimik gezogen worden sein. Er scheint die Mimiks in diesem Dungeon zu beeinflussen, so dass sie häufiger vorkommen und gefährlicher sind.
items.trinkets.mimictooth.typical_stats_desc=Normalerweise wird dieses Kleinod alle Arten von Mimiks _%1$s_ mal häufiger vorkommen lassen, sie sind wesentlich schwerer zu erkennen, und jede Ebene hat eine Chance von _%2$s%%_, ein besonders geheimnisvolles Ebenholz-Mimik zu enthalten.
items.trinkets.mimictooth.stats_desc=Auf der aktuellen Stufe wird dieses Kleinod alle Arten von Mimiks _%1$s_ mal häufiger vorkommen lassen, sie sind wesentlich schwerer zu erkennen, und jede Ebene hat eine Chance von _%2$s%%_, ein besonders geheimnisvolles Ebenholz-Mimik zu enthalten.

items.trinkets.mossyclump.name=Moosklumpen
items.trinkets.mossyclump.desc=Dieser Klumpen feuchten Mooses bewahrt Feuchtigkeit, egal, wie sehr du ihn ausquetschst. Er scheint magisch mit dem Dungeon selbst verbunden zu sein, wodurch es wesentlich wahrscheinlicher wird, dass Gras und Wasser vorkommen.
items.trinkets.mossyclump.typical_stats_desc=Normalerweise wird dieses Kleinod _%d%%_ des normalen Untergrundes so verändern, dass er entweder mit Wasser oder Gras angefüllt ist.\n\nEs kostet eine größere Menge Energie, dieses Kleinod zu verbessern.
items.trinkets.mossyclump.stats_desc=Auf seiner aktuellen Stufe wird dieses Kleinod _%d%%_  des normalen Untergrundes so verändern, dass er entweder mit Wasser oder Gras angefüllt ist.\n\nEs kostet eine größere Menge Energie, dieses Kleinod zu verbessern.

items.trinkets.parchmentscrap.name=Pergamentfetzen
items.trinkets.parchmentscrap.desc=Dieser kleine Fetzen Pergament sieht aus, als stamme er von einer Schriftrolle. Er hat etwas von seiner Magie bewahrt, und diese scheint die Waffen und Rüstungen zu beeinflussen, die im Dungeon zu finden sind.
items.trinkets.parchmentscrap.typical_stats_desc=Normalerweise wird dieses Kleinod Verzauberungen und Glyphen _%dx_ mal häufiger vorkommen lassen, Flüche auf Waffen und Rüstungen werden _%sx_ häufiger vorkommen. Flüche auf Zauberstäben, Ringen oder Artefakten werden davon nicht beeinflusst.\n\nEs kostet eine größere Menge Energie, dieses Kleinod zu verbessern.
items.trinkets.parchmentscrap.stats_desc=Auf der aktuellen Stufe wird dieses Kleinod Verzauberungen und Glyphen _%dx_ mal häufiger vorkommen lassen, und Flüche auf Waffen und Rüstungen werden _%sx_ häufiger vorkommen. Flüche auf Zauberstäben, Ringen oder Artefakten werden davon nicht beeinflusst.\n\nEs kostet eine größere Menge Energie, dieses Kleinod zu verbessern.

items.trinkets.petrifiedseed.name=versteinerter Samen
items.trinkets.petrifiedseed.desc=Dieser Samen ist versteinert, ob durch lange geologische Prozesse oder durch Magie. Dieser Samen scheint die Flora im Dungeon magisch zu beeinflussen, wodurch Pflanzensamen mitunter durch Runensteine ersetzt werden.
items.trinkets.petrifiedseed.typical_stats_desc=Üblicherweise führt dieses Kleinod dazu, dass zertrampeltes Gras in _%1$s%%_ der Fälle Runensteine statt Samen hervorbringt und dass hohes Gras außerdem _%2$s%%_ häufiger Gegenstände enthält.
items.trinkets.petrifiedseed.stats_desc=Auf seiner aktuellen Stufe bewirkt dieses Kleinod, dass zertrampeltes Gras in _%1$s%%_ der Fälle Runensteine statt Samen hervorbringt und dass hohes Gras außerdem _%2$s%%_ häufiger Gegenstände enthält.

items.trinkets.ratskull.name=Rattenschädel
items.trinkets.ratskull.desc=Dieses makabre Kleinod ist nicht viel größer als der Schädel einer normalen Ratte, was in diesem Dungeon schon eine Seltenheit ist. Der magische Einfluss dieses Rattenschädels scheint die selteneren Bewohner dieses Dungeons anzuziehen, so dass diese wesentlich häufiger auftreten.
items.trinkets.ratskull.typical_stats_desc=Normalerweise wird dieses Kleinod dafür sorgen, dass seltene exotische Feinde _%dx_ wahrscheinlicher erscheinen. Der Schädel ist allerdings nur halb so effektiv, wenn es darum geht, Kristall-Mimiks und gepanzerte Statuen anzulocken.
items.trinkets.ratskull.stats_desc=Auf seiner aktuellen Stufe wird dieses Kleinod dafür sorgen, dass seltene exotische Feinde _%dx_ wahrscheinlicher erscheinen. Der Schädel ist allerdings nur halb so effektiv, wenn es darum geht, Kristall-Mimiks und gepanzerte Statuen anzulocken.

items.trinkets.saltcube.name=Salzwürfel
items.trinkets.saltcube.desc=Dieser große Salzkristall wurde zu einem fast perfekten Würfel geschnitten und hat es irgendwie geschafft, die Hälfte des Wassers aus dem Alchemiekessel aufzusaugen, statt zu sich aufzulösen. Es scheint deine Nahrung magisch zu dehydrieren und zu bewahren. Es steigert deine Sättigung, aber reduziert auch deine Regeneration, wenn du nicht am Verhungern bist.
items.trinkets.saltcube.typical_stats_desc=Normalerweise wird dieses Kleinod die Zeit, bis du hungrig wirst, um _%1$s%%_ verlängern, aber es wird auch deine Regenerationsrate um _%2$s%%_ reduzieren, es sei denn, die Ebene ist gesperrt.
items.trinkets.saltcube.stats_desc=Auf seiner aktuellen Stufe wird dieses Kleinod die Zeit, bis du hungrig wirst, um _%1$s%%_ verlängern, aber es wird auch deine Regenerationsrate um _%2$s%%_ reduzieren, es sei denn, die Ebene ist gesperrt.

items.trinkets.shardofoblivion.name=Scherbe des Vergessens
items.trinkets.shardofoblivion.desc=Nach dem Schmoren im Alchemietopf hat sich diese kleine Scherbe aus verfluchtem Metall verändert und besteht nun aus … nichts? Das Licht scheint sich um sie herum zu biegen, und sie schwebt an Ort und Stelle, wenn du sie nicht hältst. Die Scherbe scheint auf magische Weise Kraft aus deiner Unwissenheit zu beziehen, also ist es wahrscheinlich am besten, nicht zu viel darüber nachzudenken.
items.trinkets.shardofoblivion.typical_stats_desc=Normalerweise erhöht dieses Kleinod die Rate, mit der Feinde Beute fallen lassen, um 20%% pro jeden nicht identifizierten Ausrüstungsgegenstand, den du ausgerüstet oder kürzlich verwendet hast, bis zu einem Maximum von _%d Gegenstand(en)_. Die Scherbe verhindert auch, dass du Ausrüstung identifizieren kannst, sie kann aber verwendet werden, um Gegenstände, die dafür bereit sind, manuell zu identifizieren.
items.trinkets.shardofoblivion.stats_desc=Auf der derzeitigen Stufe erhöht dieses Kleinod die Rate, mit der Feinde Beute fallen lassen, um 20%% pro jeden nicht identifizierten Ausrüstungsgegenstand, den du ausgerüstet oder kürzlich verwendet hast, bis zu einem Maximum von _%d Gegenstand(en)_. Die Scherbe verhindert auch, dass du Ausrüstung identifizieren kannst, sie kann aber verwendet werden, um Gegenstände, die dafür bereit sind, manuell zu identifizieren.
items.trinkets.shardofoblivion.ac_identify=IDENTIFIZIEREN
items.trinkets.shardofoblivion.identify_prompt=Identifiziere einen Gegenstand
items.trinkets.shardofoblivion.identify_ready=Ein Gegenstand kann nun identifiziert werden: %s. Nutze deine Scherbe des Vergessens, um ihn zu identifizieren.
items.trinkets.shardofoblivion.identify_ready_worn=All deine getragenen Gegenstände sind bereit, identifiziert zu werden. Nutze deine Scherbe des Vergessens, um sie zu identifizieren.
items.trinkets.shardofoblivion.identify_not_yet=Dieser Gegenstand kann noch nicht identifiziert werden.
items.trinkets.shardofoblivion.identify=Du hast den Gegenstand erkannt!
items.trinkets.shardofoblivion$wandusetracker.name=Nicht identifizierter Zauberstab verwendet
items.trinkets.shardofoblivion$wandusetracker.desc=Du hast vor Kurzem einen nicht identifizierten Zauberstab verwendet, der für kurze Zeit als ein verwendetes, nicht identifiziertes Ausrüstungsstück für die Scherbe des Vergessens zählt.\n\nVerbleibende Züge: %s.
items.trinkets.shardofoblivion$thrownusetracker.name=Nicht Identifizierte Wurfwaffe Benutzt
items.trinkets.shardofoblivion$thrownusetracker.desc=Du hast kürzlich eine nicht identifizierte Wurfwaffe benutzt, die eine kleine Zeitlang für die Scherbe des Vergessens als ein nicht identifizierter Ausrüstungsgegenstand zählt.\n\nVerbleibende Züge: %s.

items.trinkets.thirteenleafclover.name=dreizehnblättriges Kleeblatt
items.trinkets.thirteenleafclover.desc=Irgendwie hat das Köcheln im Alchemiekessel diesen Klee dazu gebracht, einen Strauß Extrablätter wachsen zu lassen! Es ist nicht ganz klar, ob dieses Kleinod Glück oder Unglück bringt, aber vielleicht macht es dein Glück etwas chaotischer?
items.trinkets.thirteenleafclover.typical_stats_desc=Normalerweise verursachst du durch dieses Kleinod in _%1$d%%_ der Fälle den Maximalschaden, und in _%2$d%%_ der Fälle den Minimalschaden.
items.trinkets.thirteenleafclover.stats_desc=Auf seiner aktuellen Stufe verursachst du durch dieses Kleinod in _%1$d%%_ der Fälle den Maximalschaden, und in _%2$d%%_ der Fälle den Minimalschaden.

items.trinkets.trapmechanism.name=Fallgruben-Mechanismus
items.trinkets.trapmechanism.desc=Das Herzstück des Mechanismus einer der Fallgruben des Dungeons, das vorsichtig aus dem Boden herausgetrennt wurde, damit es sich transportieren lässt. Es scheint magisch mit dem Dungeon selbst verbunden zu sein, so dass gefährliches Terrain häufiger vorkommt, aber auch deine Affinität dazu erhöht wird.
items.trinkets.trapmechanism.typical_stats_desc=Normalerweise wird dieses Kleinod _%1$d%%_ des normalen Untergrundes so verändern, dass er entweder mit Fallen oder Abgründen angefüllt ist. Zusätzlich werden _%2$d%%_ der verborgenen Fallen des Dungeons stattdessen sichtbar sein.
items.trinkets.trapmechanism.stats_desc=Auf seiner aktuellen Stufe wird dieses Kleinod _%1$d%%_ des normalen Untergrundes so verändern, dass er entweder mit Fallen oder Abgründen angefüllt ist. Außerdem werden _%2$d%%_ der versteckten Fallen des Dungeons sichtbar sein.

items.trinkets.vialofblood.name=Phiole des Bluts
items.trinkets.vialofblood.desc=Diese dünne Phiole beinhaltet das Blut eines Bewohners des Dungeons, und es bewegt sich langsam, während du die Phiole drehst. Es scheint auf magische Weise stärkere Heilungseffekte zu bewirken, diese aber auch zu verzögern.
items.trinkets.vialofblood.typical_stats_desc=Normalerweise erhöht dieses Kleinod die allgemeine Gesundheit, die du durch das Trinken von Heiltränken, Wasserschläuchen oder Heilbrunnen gewinnst, um _%1$s%%_. Diese Heileffekte treten jedoch auch langsamer ein; es werden maximal _%2$s_ LP pro Runde regeneriert (dies skaliert mit der Stufe des Helden).
items.trinkets.vialofblood.stats_desc=Auf seiner aktuellen Stufe erhöht dieses Kleinod die allgemeine Gesundheit, die du durch das Trinken von Heiltränken, Wasserschläuchen oder Heilbrunnen gewinnst, um _%1$s%% _. Diese Heileffekte treten jedoch auch langsamer ein; es werden maximal _%2$s_ LP pro Runde regeneriert (dies skaliert mit der Stufe des Helden).

items.trinkets.wondrousresin.name=Wunderharz
items.trinkets.wondrousresin.desc=Dieses schimmernde blaue Harz enthält die destillierte Essenz der Magie eines verfluchten Zauberstabs. Die Magie des Alchemiekessels scheint diese etwas stabilisiert zu haben, und nun beeinflusst es deine Zauberstäbe.
items.trinkets.wondrousresin.typical_stats_desc=Normalerweise bewirkt dieses Kleinod, dass die Effekte verfluchter Zauberstäbe in _%1$s%%_ der Fälle neutral oder positiv werden, und sorgt dafür, dass nicht verfluchte Zauberstäbe in _%2$s%%_ der Fälle einen zusätzlichen neutralen oder positiven verfluchten Schuss abfeuern.\n\nEs kostet recht viel Energie, dieses Kleinod zu verbessern.
items.trinkets.wondrousresin.stats_desc=Auf seiner aktuellen Stufe bewirkt dieses Kleinod, dass die Effekte verfluchter Zauberstäbe in _%1$s%%_ der Fälle neutral oder positiv werden, und sorgt dafür, dass nicht verfluchte Zauberstäbe in _%2$s%%_ der Fälle einen zusätzlichen neutralen oder positiven verfluchten Schuss abfeuern.\n\nEs kostet recht viel Energie, dieses Kleinod zu verbessern.

items.trinkets.trinketcatalyst.name=magischer Katalysator
items.trinkets.trinketcatalyst.window_title=Kleinod erschaffen
items.trinkets.trinketcatalyst.window_text=Als du den Katalysator hinzufügst, beginnt das Wasser zu leuchten. Es gibt einige Dinge in der Nähe, die du mit Energie durchdringen kannst, sodass sie zu einem magischen Kleinod werden.
items.trinkets.trinketcatalyst.desc=Dieser Ball aus magischem, goldenen Staub schimmert in der Dunkelheit des Dungeons. Dieser Katalysator kann mit etwas alchemischer Energie in einem Alchemiekessel verwendet werden, um ein einzigartiges Kleinod herzustellen.\n\nKleinodien bewirken verschiedene Effekte, welche das Dungeon oder seine Bewohner leicht verändern. Sie können mit alchemischer Energie verbessert werden, um ihren Effekt zu verstärken, oder man legt sie einfach ab, wodurch ihr Effekt abbricht.
items.trinkets.trinketcatalyst$randomtrinket.name=zufälliges Kleinod
items.trinkets.trinketcatalyst$randomtrinket.desc=In einem Beutel steckt ein Gegenstand fest, an den du nicht herankommst.\n\nDer Alchemie-Prozess würde den Beutel auflösen, aber was für ein Kleinod es ist, wirst du erst herausfinden, wenn du es machst!

items.trinkets.trinket.discover_hint=Dieser Gegenstand kann bei der Herstellung eines Kleinods durch Alchemie herauskommen.
items.trinkets.trinket$placeholder.name=Kleinod

###wands
items.wands.cursedwand.ondeath=Du wurdest durch deinen eigenen %s getötet.
items.wands.cursedwand.nothing=Es passiert nichts.
items.wands.cursedwand.mass_invuln=Ein gleißendes Licht bricht aus deinem Zauberstab hervor!
items.wands.cursedwand.petrify=Du erstarrst plötzlich!
items.wands.cursedwand.grass=Plötzlich beginnt Gras um dich zu wuchern!
items.wands.cursedwand.fire=Du riechst etwas Verbranntes...
items.wands.cursedwand.transmogrify_wand=Dein Zauberstab verwandelt sich in einen anderen Gegenstand!
items.wands.cursedwand.transmogrify_other=Dein Gegenstand transformiert sich in etwas anderes!
items.wands.cursedwand.disguise=Dein Aussehen verändert sich vor deinen Augen!
items.wands.cursedwand.supernova=Ein flammender Energieball beginnt zu wachsen. Vielleicht solltest du weglaufen!
items.wands.cursedwand.supernova_positive=Ein flammender Energieball beginnt zu wachsen, aber du fühlst dich irgendwie sicher.
items.wands.cursedwand.sinkhole=Der Boden um dich herum gibt nach!
items.wands.cursedwand.sinkhole_positive=Der Boden gibt nach, aber unter dir fühlt er sich fest genug an.
items.wands.cursedwand.gravity=Die Gravitation beginnt plötzlich in zufällige Richtungen zu ziehen!
items.wands.cursedwand.gravity_positive=Die Gravitation beginnt plötzlich in zufällige Richtungen zu ziehen, aber das scheint dich nicht zu beeinflussen.
items.wands.cursedwand.gravity_end=Die chaotische Gravitation hört auf.

items.wands.damagewand.upgrade_stat_name_1=Magieschaden

items.wands.wand.ac_zap=FEUERN
items.wands.wand.fizzles=Dein Zauberstab zischt; er scheint nicht genug Ladungen zu besitzen.
items.wands.wand.no_magic=Dein Zauberstab zischt; du kannst keine Zauberstäbe verwenden, während du gegen Magie immun bist.
items.wands.wand.self_target=Du kannst dich selber nicht als Ziel bestimmen.
items.wands.wand.identify=Du bist nun mit dem Zauberstab vertraut genug, um ihn zu identifizieren.
items.wands.wand.resin_one=Dieser Zauberstab hat _1 Stufe_ aus arkanem Harz gewonnen.
items.wands.wand.resin_many=Dieser Zauberstab hat _%d Stufen_ durch arkanes Harz gewonnen.
items.wands.wand.cursed=Dieser Zauberstab ist verflucht, wodurch seine Magie zufällig und chaotisch wirkt.
items.wands.wand.not_cursed=Dieser Zauberstab ist frei von bösartiger Magie.
items.wands.wand.curse_discover=Dieser %s ist verflucht!
items.wands.wand.prompt=Wähle ein Ziel zum Zaubern.
items.wands.wand$placeholder.name=Zauberstab

items.wands.wandofblastwave.name=Zauberstab der Schockwelle
items.wands.wandofblastwave.staff_name=Stab der Schockwelle
items.wands.wandofblastwave.ondeath=Du hast dich selbst durch deinen eigenen Stab der Schockwelle getötet...
items.wands.wandofblastwave.knockback_ondeath=Der Zusammenprall hat dich getötet...
items.wands.wandofblastwave.desc=Dieser Zauberstab besteht aus golden geschmücktem, marmoriertem Stein und an seiner Spitze thront ein schwarzer Edelstein. Er fühlt sich sehr schwer an.
items.wands.wandofblastwave.typical_stats_desc=Dieser Zauberstab schleudert ein magisches Geschoss, welcher an seinem Zielort heftig explodiert. Die Kraft dieser Explosion richtet normalerweise _%1$d-%2$d Schaden_ an und ist so stark, dass die meisten Gegner davonfliegen.
items.wands.wandofblastwave.stats_desc=Dieser Zauberstab schleudert ein magisches Geschoss, welcher an seinem Zielort gewaltsam explodiert. Die Kraft dieser Schockwelle richtet _%1$d-%2$d Schaden_ an und ist so stark, dass die meisten Gegner davonfliegen.
items.wands.wandofblastwave.upgrade_stat_name_2=Rückstoß
items.wands.wandofblastwave.bmage_desc=Wenn _der Kampfmagier_ einen paralysierten Gegner mit einem Stab der Druckwelle trifft, verbraucht es die Paralyse, um einen Stoß an zusätzlichem Magieschaden zuzufügen. Dies hat eine kurze Abklingzeit pro Feind.
items.wands.wandofblastwave.eleblast_desc=Ein Elementarschuss mit einem Stab der Schockwelle verursacht 67% Schaden und stößt Feinde außerhalb des Explosionsbereiches.

items.wands.wandofcorrosion.name=Zauberstab der Zersetzung
items.wands.wandofcorrosion.staff_name=Stab der Zersetzung
items.wands.wandofcorrosion.desc=Dieser Zauberstab hat einen aschgrauen Körper und vollendet sein Aussehen mit einem orangefarben glänzendem Edelstein, welcher auf seiner Spitze thront.
items.wands.wandofcorrosion.stats_desc=Dieser Zauberstab schießt einen Bolzen, der am Zielort explodiert und eine Wolke mit stark zersetzendem Gas freigibt. Alles, was sich in der Wolke befindet, wird zunehmend mehr Schaden erleiden, beginnend mit _%d Schaden._
items.wands.wandofcorrosion.upgrade_stat_name_1=Korrosionsschaden
items.wands.wandofcorrosion.upgrade_stat_name_2=Gas Volumen
items.wands.wandofcorrosion.bmage_desc=Wenn _der Kampfmagier_ einen Feind mit einem Stab der Korrosion trifft, besteht die Chance, dass der Gegner mit ätzendem Schlamm bedeckt wird.
items.wands.wandofcorrosion.eleblast_desc=Ein Elementarstoß mit einem Stab der Korrosion fügt Feinden 4 Züge lang Korrosion zu, beginnend mit 6 Schaden.

items.wands.wandofcorruption.name=Zauberstab der Korruption
items.wands.wandofcorruption.staff_name=Stab der Korruption
items.wands.wandofcorruption.already_corrupted=Dieser Charakter kann nicht weiter beeinflusst werden.
items.wands.wandofcorruption.desc=Dieser Zauberstab strahlt chaotische, dunkle Energie ab, falls das nicht schon durch den kleinen, dekorativen Schädel an seiner Spitze offensichtlich wurde.
items.wands.wandofcorruption.stats_desc=Dieser Zauberstab setzt eine Welle korrumpierender Energie frei, welche Gegner schwächt und sie schließlich Deinem Willen unterwirft. Gegner können versuchen der Korruption zu widerstehen, aber geschwächte Gegner sind deutlich leichter zu korrumpieren als gesunde.
items.wands.wandofcorruption.upgrade_stat_name_1=Korrumpierende Macht
items.wands.wandofcorruption.upgrade_stat_name_2=Dauer der Schwächung
items.wands.wandofcorruption.bmage_desc=Wenn _der Kampfmagier_ einen Gegner mit einem Stab der Korruption trifft, kann das Amok beim Gegner auslösen.
items.wands.wandofcorruption.eleblast_desc=Ein Elementarschuss mit einem Stab der Korruption verursacht bei Feinden 5 Züge Amok.

items.wands.wandofdisintegration.name=Zauberstab des Zerfalls
items.wands.wandofdisintegration.staff_name=Stab des Zerfalls
items.wands.wandofdisintegration.desc=Dieser Zauberstab besteht aus glattem Obsidian, welcher von einem violetten Licht umgeben ist. Er strahlt eine destruktive Energie aus und wartet geduldig darauf, verwendet zu werden.
items.wands.wandofdisintegration.stats_desc=Dieser Stab sendet einen alles durchdringenden Strahl aus, welcher noch weiter reicht, wenn der Stab verbessert wird. Dieser Stab richtet _%1$d-%2$d Schaden_ an und verursacht zusätzlichen Schaden für jeden Gegner und jedes Hindernis, welcher der Strahl durchdrungen hat.
items.wands.wandofdisintegration.upgrade_stat_name_2=maximale Reichweite
items.wands.wandofdisintegration.bmage_desc=Wenn er von _dem Kampfmagier_ geschwungen wird, hat ein Stab des Zerfalls eine erhöhte Angriffsreichweite, als ob er eine projizierende Verzauberung hätte.
items.wands.wandofdisintegration.eleblast_desc=Ein Elementarschuss mit einem Stab des Zerfalls verursacht 100% Schaden und durchdringt Wände.

items.wands.wandoffireblast.name=Zauberstab des Flammenstoßes
items.wands.wandoffireblast.staff_name=Stab des Flammenstoßes
items.wands.wandoffireblast.desc=Dieser Zauberstab besteht aus rot-lackiertem Holz, geschmückt mit goldenen Blättern, was diesem Stab ein majestätisches Aussehen verleiht. Knacken und Zischen ist aus seiner Spitze zu hören, begierig, seine mächtige Magie zu entfachen.
items.wands.wandoffireblast.stats_desc=Dieser Zauberstab stößt einen Feuerkegel aus, wenn er benutzt wird. Sein nächster Angriff verbraucht _%1$d Ladungen_ und verursacht _%2$d-%3$d Schaden._ Je mehr Ladungen der Zauberstab verbraucht, desto größer und stärker ist der Effekt.
items.wands.wandoffireblast.upgrade_stat_name_1=1 Aufladeschaden
items.wands.wandoffireblast.upgrade_stat_name_2=2 Aufladeschaden
items.wands.wandoffireblast.upgrade_stat_name_3=3 Aufladeschaden
items.wands.wandoffireblast.bmage_desc=Wenn _der Kampfmagier _ einen Gegner mit dem Stab des Flammenstoßes angreift, besteht die Chance, dass er eine Explosion hervorruft, die Gegner schädigt und in der Nähe befindliches Feuer verschlingt! Je mehr Feuer sich in unmittelbarer Nähe des Feindes befindet, desto höher ist diese Chance.
items.wands.wandoffireblast.eleblast_desc=Ein Elementarschuss mit einem Stab des Flammenstoßes verursacht 100% Schaden, reißt Türen auf und setzt Gegner und das Gelände in Flammen.

items.wands.wandoffrost.name=Zauberstab des Frosts
items.wands.wandoffrost.staff_name=Stab des Frosts
items.wands.wandoffrost.desc=Dieser Zauberstab scheint aus magischen Eis zu bestehen, wie seine kugelförmigen Spitze. Außerdem fühlt sich der Stab sehr kalt an, doch irgendwie verbleibt deine Hand warm.
items.wands.wandoffrost.stats_desc=Dieser Zauberstab schießt Stöße eisiger Energie auf deine Feinde, fügt _%1$d-%2$d Schaden zu_ und lässt sie unterkühlen. Der Effekt scheint im Wasser stärker zu sein. Gegner, die bereits unterkühlt oder eingefroren sind, erleiden durch diesen Zauberstab weniger Schaden.
items.wands.wandoffrost.upgrade_stat_name_2=Dauer der Unterkühlung
items.wands.wandoffrost.bmage_desc=Wenn _der Kampfmagier_ einen unterkühlten Feind mit dem Stab des Frosts angreift, hat dieser eine Chance, sofort einzufrieren. Diese Chance ist umso größer, je stärker der Gegner unterkühlt ist.
items.wands.wandoffrost.eleblast_desc=Ein Elementarschuss mit einem Stab des Eises verursacht 100% Schaden, friert Gegner ein und löscht Feuer.

items.wands.wandoflightning.name=Zauberstab des Blitzschlags
items.wands.wandoflightning.staff_name=Stab des Blitzschlags
items.wands.wandoflightning.ondeath=Du hast dich mithilfe deines Zauberstab des Blitzschlags selbst getötet...
items.wands.wandoflightning.desc=Dieser Zauberstab besteht aus solidem Metal und wirkt schwerer als der erste Eindruck vermuten lässt. Zwei Zinken verbinden sich an der Spitze, wo die Elektrizität sich lichtbogenartig entlädt.
items.wands.wandoflightning.stats_desc=Dieser Stab sendet starke Blitze, die alles durchdringen, worauf sie treffen und dabei _%1$d-%2$d Schaden verursachen._ Dieser Stromschlag springt auch auf nahe befindliche Charaktere über und verbreitet sich leichter im Wasser. Die Stromschläge von diesem Stab können dir Schaden zufügen, sie verletzen deine Alliierten jedoch nicht.
items.wands.wandoflightning.bmage_desc=Wenn _der Kampfmagier_ einen Gegner mit einem Stab des Blitzschlags trifft, besteht die Chance, dass er sich im Verlauf von 10 Zügen selbst elektrisch auflädt. Während er aufgeladen ist, bleibt der Kampfmagier immun gegen Blitzschlag und verteilt Blitzschläge weiter.
items.wands.wandoflightning.eleblast_desc=Ein Elementarschuss mit einem Stab des Blitzschlags verursacht 100% Schaden, betäubt Gegner und setzt Wasser unter Strom.
items.wands.wandoflightning$lightningcharge.name=Elektrisch geladen
items.wands.wandoflightning$lightningcharge.desc=Der Kampfmagier ist derzeit mit Energie geladen, wodurch er Immunität gegenüber seinem Stab des Blitzschlags erhält und die Reichweite der Blitzschläge von diesem erweitert ist.\n\nVerbleibende Züge: %s.

items.wands.wandoflivingearth.name=Zauberstab der lebendigen Erde
items.wands.wandoflivingearth.staff_name=Stab der lebendigen Erde
items.wands.wandoflivingearth.desc=Dieser Zauberstab besteht aus einem eigenartigen Stein, der von Bändern mit leuchtend gelber Energie durchzogen ist. Der Stein scheint sich leicht zu verändern, wenn du den Zauberstab greifst, als ob er deine Hand spüren könnte.
items.wands.wandoflivingearth.stats_desc=Dieser Zauberstab schickt Pfeile aus magischem Stein auf Feinde und verursacht _%1$d-%2$d Schaden_. Die Steine  bauen sich um den Benutzer neu auf und gewähren ihm Schutz im Verhältnis zum verursachten Schaden. Hat sich ausreichend Rüstung geformt, formt sie sich zu einem Fels-Wächter, sobald der Stab das nächste Mal benutzt wird.
items.wands.wandoflivingearth.upgrade_stat_name_2=Wächter Max LP
items.wands.wandoflivingearth.upgrade_stat_name_3=Blockierung durch Wächter
items.wands.wandoflivingearth.bmage_desc=Wenn _der Kampfmagier_ einen Gegner mit dem Stab der lebendigen Erde trifft, kehrt ein Teil des zugefügten Schadens als Steinrüstung zurück.
items.wands.wandoflivingearth.eleblast_desc=Ein Elementarschuss mit einem Stab der lebendigen Erde verursacht 50% Schaden und heilt einen aktiven irdenen Wächter bei jedem getroffenen Gegner.
items.wands.wandoflivingearth$rockarmor.name=Steinrüstung
items.wands.wandoflivingearth$rockarmor.desc=Magische Steine umgeben deinen Körper. Wirst du angegriffen, so werden sie versuchen, den Angriff für dich zu blocken; sie reduzieren den dir zugefügten Schaden um 50%%. Jeder abgewendete Schaden kratzt allerdings etwas an den Steinen.\n\nVerbleibende Rüstung: %1$d.\n\nWenn sich genügend Steine um dich herum aufgebaut haben, wird das nächste Mal, wenn du den Zauberstab der lebendigen Erde benutzt, ein Wächter aus den Steinen erschaffen, der gemeinsam mit dir kämpft.\n\nFür den Wächter nötige Rüstung: %2$d.
items.wands.wandoflivingearth$rockarmor.desc_many=Dieser irdene Wächter profitiert auch von der Macht der Vielen. Verbleibende Züge: %d.
items.wands.wandoflivingearth$earthguardian.name=irdener Wächter
items.wands.wandoflivingearth$earthguardian.desc=Die Steine aus deinem Zauberstab der lebendigen Erde haben sich in einen irdenen Wächter verwandelt! Dieser steinerne Wächter wird Feinde in der Nähe angreifen, was sie dazu zwingen wird, sich auf ihn anstatt auf dich zu konzentrieren. Sind alle Gefahren um dich herum beseitigt, wird er sich zurückverwandeln und wiederkehren, wenn du deinen Stab das nächste Mal benutzt.
items.wands.wandoflivingearth$earthguardian.wand_info=Die Verteidigungskraft des Wächters hängt von der Stufe deines Zauberstabs ab. Derzeit blockiert er _%1$d-%2$d Schaden._
items.wands.wandoflivingearth$earthguardian.discover_hint=Du kannst diesen Charakter mit einem bestimmten Zauberstab finden.

items.wands.wandofmagicmissile.name=Zauberstab der magischen Geschosse
items.wands.wandofmagicmissile.staff_name=Stab der magischen Geschosse
items.wands.wandofmagicmissile.desc=Dieser recht einfache Zauberstab verschießt Geschosse aus purer magische Energie. Dieser Stab hat selbst zwar keine besonderen Effekte, verfügt jedoch über mehr Ladungen und kann kurzzeitig andere Zauberstäbe verstärken, wenn er verbessert wird.
items.wands.wandofmagicmissile.stats_desc=Jedes Geschoss dieses Zauberstabs richtet _%1$d–%2$d Schaden_ an. Er verstärkt kurzzeitig andere Stäbe, wenn er verbessert wird.
items.wands.wandofmagicmissile.bmage_desc=Wenn _der Kampfmagier_ einen Gegner mit dem Stab der magischen Geschosse trifft, erhalten alle seine Zauberstäbe zusätzlich zu seinem Stab eine Aufladung.
items.wands.wandofmagicmissile.eleblast_desc=Ein Elementarschuss mit einem Stab der magischen Geschosse verursacht 50% Schaden und gewährt dem Magier 15 Züge Zauberstabaufladung.
items.wands.wandofmagicmissile.discover_hint=Einer der Helden startet mit diesem Gegenstand.
items.wands.wandofmagicmissile$magiccharge.name=magische Ladung
items.wands.wandofmagicmissile$magiccharge.desc=Dein Zauberstab der magischen Geschosse hat Kraft in deine Stäbe zurückgeführt und die Stufe des nächsten Schusses, den sie abfeuern, erhöht.\n\nDeine Stäbe wurden um %d Stufen erhöht.\n\nVerbleibende Züge mit magischer Ladung: %s.

items.wands.wandofprismaticlight.name=Zauberstab des prismatischen Lichts
items.wands.wandofprismaticlight.staff_name=Stab des prismatischen Lichtes
items.wands.wandofprismaticlight.desc=Dieser Zauberstab besteht aus einem solidem, lichtdurchlässigem Kristall und sieht fast so aus wie ein langes, glattes Stück Glas. Kleine Schimmer bunten Lichts tanzen um die Spitze des Stabs, begierig darauf, sich zu entfesseln.
items.wands.wandofprismaticlight.stats_desc=Dieser Zauberstab gibt einen Lichtstrahl frei, der durch die Dunkelheit des Dungeons schneidet und Geheimgänge und verborgene Fallen sichtbar macht. Dieser Lichtstrahl kann Feinde blenden und verursacht _%1$d-%2$d Schaden_. Dämonen und Untote gehen durch dieses Licht in Flammen auf und erleiden dadurch Zusatzschaden.
items.wands.wandofprismaticlight.upgrade_stat_name_2=Chance auf Blendung
items.wands.wandofprismaticlight.upgrade_stat_name_3=Leuchtdauer
items.wands.wandofprismaticlight.bmage_desc=Wenn _der Kampfmagier_ einen Gegner mit dem Stab des prismatischen Lichtes trifft, wird er für eine Dauer, die sich mit Stufe des Stabs verlängert, verkrüppelt.
items.wands.wandofprismaticlight.eleblast_desc=Ein Elementarschuss mit einem Stab des prismatischen Lichtes verursacht 67% Schaden, enthüllt das Gelände im Schussbereich, und lässt Gegner für 5 Züge erblinden.

items.wands.wandofregrowth.name=Zauberstab des Wildwuchses
items.wands.wandofregrowth.staff_name=Stab des Wildwuchses
items.wands.wandofregrowth.desc=Dieser Zauberstab ist aus einem dünnen Schaft fachmännisch geschnitzten Holzes gefertigt. Es scheint immer noch lebendig zu sein und zu wachsen, und es ist hellgrün wie das Innere eines jungen Baumes. "Wenn Leben endet, beginnt immer neues Leben zu wachsen... Der ewige Kreislauf bleibt immer bestehen!"
items.wands.wandofregrowth.stats_desc=Wenn dieser Zauberstab benutzt wird, schießt er magische Wachstumsenergie in einem Kegel nach außen, wodurch Gras, Wurzeln und seltene Pflanzen zum Leben erwachen. Sein nächster Angriff verbraucht _%1$d Ladungen_. Je mehr Ladungen der Zauberstab verbraucht, desto größer und stärker ist der Effekt.
items.wands.wandofregrowth.degradation=Nach weiteren _%d Aufladungen_ wird dieser Zauberstab keine Pflanzen und kein frisches Gras mehr zu produzieren. Diese Begrenzung wird durch das Erreichen neuer Stufen oder Verbesserung des Zauberstabs erhöht.
items.wands.wandofregrowth.upgrade_stat_name_1=Gras pro Ladung
items.wands.wandofregrowth.upgrade_stat_name_2=gesamtes Gras-Limit
items.wands.wandofregrowth.bmage_desc=Wenn _der Kampfmagier_ einen Gegner mit einem Stab des Wildwuchses trifft und jemand davon auf Gras steht, erhält er Kräuterheilung im Verhältnis zum zugefügten Schaden.
items.wands.wandofregrowth.eleblast_desc=Ein Elementarschuss mit einem Stab des Wildwuchses verwurzelt Gegner und lässt im Bereich des Schusses zufällig Gras wachsen.
items.wands.wandofregrowth$dewcatcher.name=Taufänger
items.wands.wandofregrowth$dewcatcher.desc=Taufänger sind wundersame Pflanzen, die sich mit magischem Tau füllen. Sie versuchen, sich als Gras zu tarnen, um nicht aufzufallen, aber ihre Ausbuchtungen aus gesammeltem Tau verraten sie.
items.wands.wandofregrowth$dewcatcher.discover_hint=Du kannst diese Pflanze mit einem bestimmten Zauberstab finden.
items.wands.wandofregrowth$seedpod.name=Samenschote
items.wands.wandofregrowth$seedpod.desc=Samenschoten sind magische Pflanzen, die Samen anderer Pflanzen anstelle eigener produzieren. Irgendwie schaffen sie es, sich zu vermehren, obwohl sie keine eigenen Samen haben.
items.wands.wandofregrowth$seedpod.discover_hint=Du kannst diese Pflanze mit einem bestimmten Zauberstab finden.
items.wands.wandofregrowth$lotus.name=Goldener Lotus
items.wands.wandofregrowth$lotus.desc=Der goldene Lotus ist eine mystische Pflanze, die nur von einem mächtigen Zauberstab des Wildwuchses beschworen werden kann. Seine Aura verbessert alle Pflanzen und Pflanzen-Effekte, jedoch brennt er durch seine Energie und stirbt nach kurzer Zeit.
items.wands.wandofregrowth$lotus.wand_info=Dieser Lotus wurde durch einen _+%1$d_ Stab des Wildwuchses hervorgebracht. Alle Pflanzen in seinem Einfluss werden _sofort auslösen_, wenn sie auf deinem Feld oder dem Feld eines Gegners gepflanzt werden. Die Pflanzen haben außerdem eine _%2$d%%-prozentige Wahrscheinlichkeit,_ ihre Samen fallen zu lassen, und präparierte Wurfpfeile verbrauchen _%3$d%% weniger von ihrer Haltbarkeit_.
items.wands.wandofregrowth$lotus.discover_hint=Du kannst diese Pflanze mit einem bestimmten Zauberstab finden, nachdem du ihn mehrmals verbessert hast.

items.wands.wandoftransfusion.name=Zauberstab der Transfusion
items.wands.wandoftransfusion.staff_name=Stab der Transfusion
items.wands.wandoftransfusion.ondeath=Du hast dich mithilfe deines Zauberstabes der Transfusion selbst getötet...
items.wands.wandoftransfusion.charged=Dein Stab ist geladen mit der Lebensenergie deines Feindes!
items.wands.wandoftransfusion.desc=Dieser recht gewöhnlich aussehende Zauberstab hebt sich nur durch sein magentafarbene Verzierung und den pechschwarzen Edelstein an seiner Spitze hervor.
items.wands.wandoftransfusion.stats_desc=Auf Verbündete oder betörte Feinde angewandt, verzehrt dieser Zauberstab _%1$d der Lebensenergie des Anwenders_, um den Verbündeten um _%2$d Lebensenergie_ zu heilen oder abzuschirmen. Auf Feinde angewandt, betört er sie kurzzeitig und verleiht dem Anwender _%3$d Abschirmung_. Feindliche Untote erleiden _%4$d-%5$d Schaden_, anstatt verzaubert zu werden.
items.wands.wandoftransfusion.upgrade_stat_name_1=Verbündeten-Heilung
items.wands.wandoftransfusion.upgrade_stat_name_2=Selbstabschirmung
items.wands.wandoftransfusion.upgrade_stat_name_3=Schaden an Untoten
items.wands.wandoftransfusion.bmage_desc=Wenn _der Kampfmagier_ einen verzauberten Gegner mit dem Stab der Transfusion trifft, erhält er einen Schild und der nächste Schuss mit dem Stab kostet keine Gesundheit.
items.wands.wandoftransfusion.eleblast_desc=Ein Elementarschuss mit einem Stab der Transfusion betört Gegner, heilt Verbündete und verursacht 100% Schaden bei untoten Gegnern.

items.wands.wandofwarding.name=Zauberstab der Abwehr
items.wands.wandofwarding.staff_name=Stab der Abwehr
items.wands.wandofwarding.no_more_wards=Dein Zauberstab kann keinen weiteren Wächter mehr aufrechterhalten.
items.wands.wandofwarding.bad_location=Du kannst hier keinen Wächter platzieren.
items.wands.wandofwarding.desc=An der Spitze dieses kurzen, metallenen Zauberstabes befindet sich ein heller, violetter Edelstein.
items.wands.wandofwarding.stats_desc=Anstatt den Gegner direkt zu verletzen, wird dieser Zauberstab stationäre Wächter heraufbeschwören. Wächter können überall beschworen werden, sogar durch Wände hindurch, wenn du Sicht hast. Dieser Zauberstab hat genug Energie, um _%d Wächter_ auf einmal aufrechtzuerhalten.
items.wands.wandofwarding.upgrade_stat_name_1=Wächterschaden
items.wands.wandofwarding.upgrade_stat_name_2=Wächterenergie
items.wands.wandofwarding.bmage_desc=Wenn der Kampfmagier einen Gegner mit dem Stab der Abwehr trifft, haben alle aktiven Wächter und Schildwachen die Chance, geheilt zu werden.
items.wands.wandofwarding.eleblast_desc=Ein Elementarschuss mit einem Stab der Abwehr heilt alle Wächter und Schildwachen im Bereich des Einschlags.
items.wands.wandofwarding$ward.desc_generic_ward=Der Wächter wird jeden Gegner in Reichweite automatisch unter Beschuss nehmen.\n\nWird der Wächter mit deinem Zauberstab der Abwehr beschossen, wird er stärker.\n\nWächter haben eine begrenzte Zahl an Schüssen, bevor sie sich auflösen.
items.wands.wandofwarding$ward.desc_generic_sentry=Diese Schildwache hat dieselbe Feuerkraft wie ein Wächter, aber statt einer begrenzten Zahl an Schüssen hat sie Lebenspunkte. Sie ähnelt dem Stein auf der Spitze deines Zauberstabs der Abwehr.\n\nBeschießt du diese Schildwache mit deinem Zauberstab der Abwehr, so wird ihre Stufe erhöht und sie wird geheilt.\n\nDiese Schildwache wird jedes Mal etwas Gesundheit verlieren, wenn sie einen Gegner beschießt, sie kann aber geheilt werden, wenn du deinen Zauberstab der Abwehr auf sie richtest.
items.wands.wandofwarding$ward.name_1=kleiner Wächter
items.wands.wandofwarding$ward.desc_1=Der Standard-Wächter wird jeden Gegner in Sichtweite automatisch unter Beschuss nehmen und verursacht _%1$d–%2$d Schaden._\n\nWird der Wächter mit deinem Zauberstab der Abwehr beschossen, wird er stärker.\n\nDer Wächter wird nur einen Schuss abgeben, bevor er verschwindet.\n\nDein Zauberstab der Abwehr benötigt _%3$d Energiepunkte_, um den Wächter am Leben zu erhalten.
items.wands.wandofwarding$ward.name_2=Wächter
items.wands.wandofwarding$ward.desc_2=Dieser verbesserte Wächter besitzt eine komplexere Taktik und kann mehrfach angreifen. Jeder Schuss dieses Wächters verursacht _%1$d–%2$d Schaden._\n\nWird der Wächter mit deinem Zauberstab der Abwehr beschossen, so wird er stärker.\n\nDer Wächter wird dreimal schießen, bevor er verschwindet.\n\nDein Zauberstab der Abwehr benötigt _%3$d Energiepunkte_, um den Wächter am Leben zu erhalten.
items.wands.wandofwarding$ward.name_3=großer Wächter
items.wands.wandofwarding$ward.desc_3=Der voll ausgerüstete Wächter kann mehrmals und schneller angreifen als seine Vorgänger. Jeder Schuss dieses Wächters verursacht _%1$d–%2$d_ Schaden.\n\nWird der Wächter mit deinem Zauberstab der Abwehr beschossen, so wird er stärker.\n\nDer Wächter wird fünfmal schießen, bevor er verschwindet.\n\nDein Zauberstab der Abwehr benötigt _%3$d Energiepunkte_, um den Wächter am Leben zu erhalten.
items.wands.wandofwarding$ward.name_4=kleine Schildwache
items.wands.wandofwarding$ward.desc_4=Dieser kleine Wächter hat die gleiche Feuerkraft wie ein großer Wächter, aber besitzt Gesundheit anstelle einer Anzahl von Ladungen. Er ähnelt dem Edelstein an der Spitze deines Stabs der Abwehr. Jeder Schuss von diesem Wächter verursacht _%1$d-%2$dSchaden._\n\nWenn du diesen Wächter mit deinem Zauberstab der Abwehr beschießt, wird er aufgewertet und geheilt.\n\nDein Zauberstab der Abwehr benutzt _%3$dEnergie_, um den Wächter zu erhalten.
items.wands.wandofwarding$ward.name_5=Schildwache
items.wands.wandofwarding$ward.desc_5=Diese verbesserte Schildwache ist größer und zäher als die schwache Schildwache. Jeder Schuss von dieser Wache verursacht _%1$d–%2$d Schaden._\n\nWird die Schildwache mit deinem Zauberstab der Abwehr beschossen, so wird sie stärker und geheilt.\n\nJeder Schuss der Schildwache zieht dieser Lebensenergie ab. Sie kann jedoch mit dem Stab der Abwehr geheilt werden.\n\nDein Zauberstab der Abwehr benötigt _%3$d Energiepunkte_, um die Schildwache aufrechtzuerhalten.
items.wands.wandofwarding$ward.name_6=große Schildwache
items.wands.wandofwarding$ward.desc_6=Diese voll ausgerüstete Schildwache ist deutlich zäher als ihre Vorgänger. Jeder Schuss von dieser Wache verursacht _%1$d–%2$d Schaden._\n\nWird die Schildwache mit deinem Zauberstab der Abwehr beschossen, so wird sie geheilt.\n\nJeder Schuss der Schildwache zieht dieser Lebensenergie ab. Sie kann jedoch mit dem Stab der Abwehr geheilt werden.\n\nDein Zauberstab der Abwehr benötigt _%3$d Energiepunkte_, um die Schildwache aufrechtzuerhalten.
items.wands.wandofwarding$ward.discover_hint=Du kannst diesen Charakter mit einem bestimmten Zauberstab finden.
items.wands.wandofwarding$ward.dismiss_title=Diesen Wächter entfernen?
items.wands.wandofwarding$ward.dismiss_body=Du kannst diesen Wächter entfernen, falls dein Zauberstab ihn nicht länger versorgen soll. Dies wird den Wächter sofort zerstören.\n\nWächter entfernen?
items.wands.wandofwarding$ward.dismiss_confirm=ja
items.wands.wandofwarding$ward.dismiss_cancel=nein

###weapon curses
items.weapon.curses.annoying.name=%s der Nerverei
items.weapon.curses.annoying.msg_1=OH, BEKÄMPFEN WIR ETWAS?
items.weapon.curses.annoying.msg_2=JA, HOL SIE DIR!
items.weapon.curses.annoying.msg_3=HEY, HÖR MIR ZU!
items.weapon.curses.annoying.msg_4=SIND WIR SCHON BEIM ENDGEGNER?
items.weapon.curses.annoying.msg_5=AUTSCH, SCHLAG NICHT SO FEST ZU!
items.weapon.curses.annoying.msg_6=STIRB, DU INSEKT!
items.weapon.curses.annoying.msg_7=HUIIIIIIIIIIIII!
items.weapon.curses.annoying.msg_8=KÖNNEN WIR KURZ PAUSE MACHEN!?
items.weapon.curses.annoying.msg_9=ZACK, HAHA!
items.weapon.curses.annoying.msg_10=GUTER SCHLAG!
items.weapon.curses.annoying.msg_11=Ich wollte keine Waffe, ich wollte einer Holzfälleraxt sein.
items.weapon.curses.annoying.msg_12=Denk daran, Selbstüberschätzung ist ein langsamer und heimtückischer Mörder.
items.weapon.curses.annoying.msg_13=ALL DEINE STÜTZPUNKT SIND GEHÖREN UNS!
items.weapon.curses.annoying.desc=Nervige Waffen können sprechen, aber sie sind etwas zu energisch. Sie werden oft die Aufmerksamkeit auf dich lenken, ohne, dass sie das eigentlich wollen.
items.weapon.curses.annoying.elestrike_desc=Ein Elementarschlag mit dem Fluch der Nerverei wird mit einer Wahrscheinlichkeit von 20% alle Gegner in Angriffsreichweite für 6 Züge wütend machen.

items.weapon.curses.dazzling.name=%s der Blendung
items.weapon.curses.dazzling.desc=Waffen der Blendung leuchten gelegentlich in einem grellen Blitz auf und blenden so alles und jeden, der sie sehen kann.
items.weapon.curses.dazzling.elestrike_desc=Ein Elementarschlag mit dem Fluch der Blendung wird mit einer Wahrscheinlichkeit von 50% alle Gegner in Angriffsreichweite für 6 Züge blenden.

items.weapon.curses.displacing.name=%s der Verdrängung
items.weapon.curses.displacing.desc=Waffen der Verdrängung wurden mit einer chaotischen Teleportationsmagie versehen. Sie besitzen die Fähigkeit, Gegner irgendwo auf diese Ebene zu teleportieren.
items.weapon.curses.displacing.elestrike_desc=Ein Elementarschlag mit dem Fluch der Verdrängung wird mit einer Wahrscheinlichkeit von 50% alle Gegner in Angriffsreichweite an einen anderen Ort teleportieren.

items.weapon.curses.explosive.name=Explosions-%s
items.weapon.curses.explosive.warm=Warm...
items.weapon.curses.explosive.hot=Heiß!
items.weapon.curses.explosive.desc=Explosive Waffen bauen ständig Ladung auf und explodieren alles in ihrer Nähe.
items.weapon.curses.explosive.desc_cool=Deine Waffe fühlt sich momentan kühl an.
items.weapon.curses.explosive.desc_warm=Deine Waffe baut Ladung auf und wird warm...
items.weapon.curses.explosive.desc_hot=Deine Waffe ist heiß! Sie wird gleich explodieren!
items.weapon.curses.explosive.elestrike_desc=Ein Elementarschlag mit dem explosiven Fluch wird mit einer Wahrscheinlichkeit von 50% eine Explosion bei einem zufälligen Gegner in Angriffsreichweite verursachen.

items.weapon.curses.friendly.name=%s der Freundlichkeit
items.weapon.curses.friendly.desc=Freundliche Waffen sind am besten für Pazifisten geeignet und lösen gelegentlich Magie aus, die es unmöglich macht zu kämpfen.
items.weapon.curses.friendly.elestrike_desc=Ein Elementarschlag mit einem Fluch der Freundlichkeit wird mit einer Wahrscheinlichkeit von 50% alle Gegner in Reichweite für 6 Züge betören.

items.weapon.curses.polarized.name=%s der Polarisation
items.weapon.curses.polarized.desc=Eine polarisierte Waffe steht unter dem Einfluss von Magie, die dazu führt, dass diese Waffe entweder 50% mehr oder gar keinen Schaden anrichtet.
items.weapon.curses.polarized.elestrike_desc=Ein Elementarschlag mit einem Fluch der Polarisation wird mit einer Wahrscheinlichkeit von 50% bei allen Gegnern in Reichweite 24-36 Schaden anrichten.

items.weapon.curses.sacrificial.name=Opfer-%s
items.weapon.curses.sacrificial.desc=Opferwaffen dürstet es nach dem Blut ihres Trägers als Gegenleistung für den Angriff auf Feinde. Je gesünder der Träger ist, desto mehr Blut wird der Fluch verlangen.
items.weapon.curses.sacrificial.elestrike_desc=Ein Elementarschlag mit einem Opfer-Fluch wird am Helden und allen Gegnern in Reichweite 12 Punkte Blutungsschaden anrichten.

items.weapon.curses.wayward.name=%s der Launigkeit
items.weapon.curses.wayward.desc=Launische Waffen werden mitunter sehr ungenau. Diese Magie hält eine kurze Zeitlang an, wenn sie aktiviert wird, sie wird jedoch zerstreut, wenn man mit der launischen Waffe einen Treffer landet.
items.weapon.curses.wayward.elestrike_desc=Ein Elementarschlag mit einem Fluch der Launigkeit wird mit einer Wahrscheinlichkeit von 50% alle Gegner in Reichweite für 6 Züge verhexen.
items.weapon.curses.wayward$waywardbuff.name=launisch
items.weapon.curses.wayward$waywardbuff.desc=Die Magie deiner launischen Waffe wurde aktiviert, so dass sie eine kurze Zeit lang sehr ungenau ist. Dies betrifft aber keine Angriffe, deren Treffer garantiert ist, wie zum Beispiel Überraschungsangriffe. Ein erfolgreicher Angriff mit einer launischen Waffe wird diesen Effekt sofort zerstreuen.\n\nVerbleibende Züge: %s.

###enchantments
items.weapon.enchantments.blazing.name=Flammen-%s
items.weapon.enchantments.blazing.desc=Diese Verzauberung lässt Flammen aus einer Waffe züngeln, sodass Feinde in Flammen aufgehen; bereits brennende Feinde erleiden zusätzlichen Schaden.
items.weapon.enchantments.blazing.elestrike_desc=Ein Elementarschlag mit einer Flammen-Verzauberung entfacht auf allen Feldern in Reichweite Feuer, das 8 Züge lang brennt.

items.weapon.enchantments.blocking.name=%s der Abwehr
items.weapon.enchantments.blocking.desc=Abwehrende Waffen haben die Chance, dich kurz zu schützen, nachdem du mit ihnen angegriffen hast.
items.weapon.enchantments.blocking.elestrike_desc=Ein Elementarschlag mit einer Abwehrverzauberung gewährt der Zweikämpferin für jeden Gegner in Reichweite 6 Punkte Abschirmung.
items.weapon.enchantments.blocking$blockbuff.name=Abwehr
items.weapon.enchantments.blocking$blockbuff.desc=Die Abwehrverzauberung deiner Waffe hat kurzzeitig deine Defensivkräfte verstärkt!\n\nVerbleibende Abwehr: %d\n\nVerbleibende Züge: %s.

items.weapon.enchantments.blooming.name=%s der Blüte
items.weapon.enchantments.blooming.desc=Blühende Waffen enthalten Magie, die dazu führt, dass Vegetation an oder neben der Position des damit Geschlagenen zu sprießen beginnt.
items.weapon.enchantments.blooming.elestrike_desc=Ein Elementarschlag mit einer Verzauberung der Blüte wird auf bis zu 8 Feldern in Reichweite Gras wachsen lassen und dabei alle Gegner in Reichweite für 6 Züge verwurzeln.

items.weapon.enchantments.chilling.name=Frost-%s
items.weapon.enchantments.chilling.desc=Gegner, die mit dieser Verzauberung getroffen werden, werden unterkühlt, was ihre Bewegungen und Angriffe verlangsamt.
items.weapon.enchantments.chilling.elestrike_desc=Ein Elementarschlag mit einer Frost-Verzauberung verströmt eisige Luft auf allen Feldern in Reichweite, die dort 8 Züge lang verweilt.

items.weapon.enchantments.kinetic.name=%s der Kinetik
items.weapon.enchantments.kinetic.desc=Wenn ein Gegner mit einer kinetischen Waffe getötet wird, nimmt diese jede überschüssige Kraft auf und überträgt sie auf ihren nächsten erfolgreichen Angriff.
items.weapon.enchantments.kinetic.elestrike_desc=Ein Elementarschlag mit einer kinetischen Verzauberung fügt allen Gegnern in Reichweite, abgesehen vom eigentlichen Angriffsziel, 40% des aufgenommenen überschüssigen Schadens zu.
items.weapon.enchantments.kinetic$conserveddamage.name=konservierter Schaden
items.weapon.enchantments.kinetic$conserveddamage.desc=Deine Waffe hat überschüssige Kraft von vorherigen Tötungen gespeichert und fügt diese deinem nächsten Angriff als zusätzlichen Schaden zu. Jedoch wird diese Kraft langsam mit der Zeit verschwinden.\n\nKonservierter Schaden: %d.

items.weapon.enchantments.corrupting.name=%s der Korruption
items.weapon.enchantments.corrupting.desc=Diese mächtige Verzauberung besitzt die Fähigkeit, Feinde deinem Willen zu unterwerfen. Wird ein Feind mit dieser Waffe getötet, besteht die Chance, dass er korrumpiert wird, anstatt zu sterben.
items.weapon.enchantments.corrupting.elestrike_desc=Ein Elementarschlag mit einer Verzauberung der Korruption wird alle Gegner in Reichweite, abgesehen vom eigentlichen Angriffsziel, mit einer Wahrscheinlichkeit von 5-25% (abhängig von den fehlenden LP) korrumpieren.

items.weapon.enchantments.elastic.name=%s der Elastizität
items.weapon.enchantments.elastic.desc=Mit elastischen Waffen hat man eine Chance, Feinde über eine kurze Distanz zurückzuschleudern.
items.weapon.enchantments.elastic.elestrike_desc=Ein Elementarschlag mit einer Verzauberung der Elastizität schleudert alle Gegner in Reichweite 5 Felder weit zurück.

items.weapon.enchantments.grim.name=%s des Grauens
items.weapon.enchantments.grim.desc=Diese mächtige Verzauberung besitzt die Kraft, einen Gegner sofort zu exekutieren. Je schwächer der Gegner ist, desto wahrscheinlicher wird dieser sofort getötet.
items.weapon.enchantments.grim.elestrike_desc=Ein Elementarschlag mit einer Verzauberung des Grauens wird mit einer Wahrscheinlichkeit von 6-30% (abhängig von den fehlenden LP) alle Gegner in Reichweite, abgesehen vom eigentlichen Angriffsziel, töten.

items.weapon.enchantments.lucky.name=%s des Glücks
items.weapon.enchantments.lucky.desc=Feinde, die mit einer glücklichen Waffe getötet werden, hinterlassen möglicherweise zusätzliche Beute.
items.weapon.enchantments.lucky.elestrike_desc=Ein Elementarschlag mit einer Verzauberung des Glücks lässt mit einer Wahrscheinlichkeit von 12,5% unter allen Gegnern in Reichweite Beute erscheinen. Dieser Effekt kann bei jedem Gegner nur einmal ausgelöst werden.

items.weapon.enchantments.projecting.name=%s der Reichweite
items.weapon.enchantments.projecting.desc=Mit dieser Verzauberung werden Nahkampfwaffen eine größere Reichweite erhalten. Fernwaffen werden nahegelegene Wände durchdringen, wenn ein nahegelegenes Ziel anvisiert wird.
items.weapon.enchantments.projecting.elestrike_desc=Ein Elementarschlag mit einer Verzauberung der Projektion wird allen Gegnern in Reichweite, abgesehen vom eigentlichen Angriffsziel, 30% des Angriffsschadens zufügen.

items.weapon.enchantments.shocking.name=Schock-%s
items.weapon.enchantments.shocking.desc=Elekrizität geht von der verzauberten Waffe kontrolliert hervor, was zusätzlichen Schaden an alle Gegner in der Nähe anrichtet.
items.weapon.enchantments.shocking.elestrike_desc=Ein Elementarschlag mit einer Schock-Verzauberung generiert Elektrizität auf allen Feldern in Reichweite, die dann 8 Züge lang unter Spannung stehen.

items.weapon.enchantments.unstable.name=%s des Chaos
items.weapon.enchantments.unstable.desc=Diese Verzauberung sondert eine chaotische Energie ab und wird mit jedem Treffer als eine andere Verzauberung agieren.
items.weapon.enchantments.unstable.elestrike_desc=Ein Elementarschlag mit einer chaotischen Verzauberung fügt jedem Gegner in Reichweite, abgesehen vom eigentlichen Angriffsziel, den Effekt einer zufälligen Verzauberung zu.

items.weapon.enchantments.vampiric.name=%s des Vampirs
items.weapon.enchantments.vampiric.desc=Diese mächtige Verzauberung saugt mit jedem Treffer Lebensenergie aus den getroffenen Gegnern und gibt diese an den Träger der verzauberten Waffe weiter. Je weniger Lebenspunkte der Träger hat, desto stärker ist dieser Effekt.
items.weapon.enchantments.vampiric.elestrike_desc=Ein Elementarschlag mit einer Vampir-Verzauberung heilt die Zweikämpferin um 2,5 LP pro Gegner in Reichweite.


###melee weapons
items.weapon.melee.assassinsblade.name=Attentäterklinge
items.weapon.melee.assassinsblade.stats_desc=Diese Waffe kann gegen ahnungslose Gegner besonders effektiv geführt werden.
items.weapon.melee.assassinsblade.ability_name=schleichen
items.weapon.melee.assassinsblade.typical_ability_desc=Die Zweikämpferin kann _schleichen_, wenn sie eine Attentäterklinge führt. Diese Fähigkeit gestattet es der Zweikämpferin, sofort bis zu 3 Felder weit zu springen und verleiht ihr im Schnitt _%d Züge Unsichtbarkeit_.
items.weapon.melee.assassinsblade.ability_desc=Die Zweikämpferin kann _schleichen_, wenn sie eine Attentäterklinge führt. Diese Fähigkeit gestattet es der Zweikämpferin, sofort bis zu 3 Felder weit zu springen und verleiht ihr _%d Züge Unsichtbarkeit_.
items.weapon.melee.assassinsblade.upgrade_ability_stat_name=Dauer der Fähigkeit
items.weapon.melee.assassinsblade.desc=Eine kleine gewellte Klinge aus Obsidian. Es fällt schwer sie zu führen, obwohl die Klinge sehr leicht ist. In den richtigen Händen ist diese Waffe tödlich.

items.weapon.melee.battleaxe.name=Streitaxt
items.weapon.melee.battleaxe.stats_desc=Diese Waffe ermöglicht präzise Angriffe.
items.weapon.melee.battleaxe.ability_name=schwerer Hieb
items.weapon.melee.battleaxe.typical_ability_desc=Die Zweikämpferin kann mit der Streitaxt einen _schweren Hieb_ ausführen. Dieser wuchtige Schlag verursacht üblicherweise _%1$d-%2$d Schaden_, wenn er den Gegner überrascht, und macht ihn 5 Züge lang benommen, wodurch Genauigkeit und Ausweichen um 50%% reduziert werden. Ein schwerer Hieb trifft immer, verursacht aber normalen Schaden, wenn er den Gegner nicht überrascht.
items.weapon.melee.battleaxe.ability_desc=Die Zweikämpferin kann mit der Streitaxt einen _schweren Hieb_ ausführen. Dieser wuchtige Schlag verursacht _%1$d-%2$d Schaden_, wenn er den Gegner überrascht, und macht ihn 5 Züge lang benommen, wodurch Genauigkeit und Ausweichen um 50%% reduziert werden. Ein schwerer Hieb trifft immer, fügt aber nur normalen Schaden zu, wenn der Gegner damit nicht überrascht wird.
items.weapon.melee.battleaxe.desc=Der enorme Stahlkopf dieser Streitaxt bringt eine beachtliche Wucht mit jedem Schlag.

items.weapon.melee.crossbow.name=Armbrust
items.weapon.melee.crossbow.typical_stats_desc=Normalerweise verbessert diese Waffe Wurfpfeile, so dass diese _%1$d-%2$d Schaden_ zufügen, wenn sie ausgerüstet ist, und sie verleiht ihnen sogar ihre Verzauberung.
items.weapon.melee.crossbow.stats_desc=Diese Waffe verstärkt, wenn ausgerüstet, Wurfpfeile so, dass diese _%1$d-%2$d_ Schaden verursachen, und verleiht ihnen ihre Verzauberung.
items.weapon.melee.crossbow.ability_name=geladener Schuss
items.weapon.melee.crossbow.typical_ability_desc=Die Zweikämpferin kann ihre Armbrust _aufladen_, wodurch ihr nächster normaler Angriff damit immer trifft und einen von drei Effekten ausführt: Nahkampfangriffe stoßen Feinde weg, nicht präparierte Pfeile verursachen normalerweise _+%1$d Schaden_, präparierte Pfeile lösen ihre Wirkung in einem 7x7-Bereich aus und halten normalerweise für _%2$d nochmalige Anwendungen_.
items.weapon.melee.crossbow.ability_desc=Die Zweikämpferin kann ihre Armbrust _aufladen_, wodurch ihr nächster normaler Angriff damit immer trifft und einen von drei Effekten ausführt: Nahkampfangriffe stoßen Feinde weg, nicht präparierte Pfeile verursachen _+%1$d Schaden_ und präparierte Pfeile lösen ihren Effekt in einem 7x7-Bereich aus und halten für _%2$d weitere Anwendungen_.
items.weapon.melee.crossbow.desc=Eine etwas komplizierte Waffe, welche Bolzen mit außergewöhnlicher Geschwindigkeit verschießt. Obwohl sie nicht dafür entworfen wurde, ist sie dank ihrer schweren und kräftigen Ausführung durchaus für den Nahkampf verwendbar.
items.weapon.melee.crossbow.upgrade_ability_stat_name=Fähigkeitsschub
items.weapon.melee.crossbow$chargedshot.name=aufgeladen
items.weapon.melee.crossbow$chargedshot.desc=Die Zweikämpferin konzentriert ihre Kraft auf ihre Armbrust. Der nächste Angriff, den sie damit ausführt, wird immer treffen und einen von drei Effekten auslösen:\n- Nahkampfangriffe werden Feinde ein paar Felder weit wegstoßen.\n- nicht präparierte Pfeile verursachen Bonusschaden.\n- Präparierte Pfeile erhalten zusätzliche Nutzungen und entfalten ihre Wirkung in einem 7x7-Bereich. Positive Pfeileffekte wirken sich nur auf Verbündete aus, schädliche Effekte wirken sich nur auf Feinde aus. Die Zweikämpferin kann diese Fähigkeit nicht nutzen, um positive Pfeileffekte auf sich selbst auszuüben.

items.weapon.melee.cudgel.name=Totschläger
items.weapon.melee.cudgel.stats_desc=Diese Waffe ermöglicht präzise Angriffe.
items.weapon.melee.cudgel.ability_name=schwerer Hieb
items.weapon.melee.cudgel.typical_ability_desc=Die Zweikämpferin kann mit dem Totschläger einen _schweren Hieb_ ausführen. Dieser konzentrierte Schlag verursacht üblicherweise _%1$d-%2$d Schaden_, wenn er den Feind überrascht, und macht ihn 5 Züge lang benommen, wodurch Genauigkeit und Ausweichen um 50%% reduziert werden. Ein schwerer Hieb trifft immer, fügt aber nur normalen Schaden zu, wenn der Gegner damit nicht überrascht wird.
items.weapon.melee.cudgel.ability_desc=Die Zweikämpferin kann mit dem Totschläger einen _schweren Hieb_ ausführen. Dieser konzentrierte Schlag verursacht _%1$d-%2$d Schaden_, wenn er den Feind überrascht, und macht ihn 5 Züge lang benommen, wodurch Genauigkeit und Ausweichen um 50%% reduziert werden. Ein schwerer Hieb trifft immer, fügt aber nur normalen Schaden zu, wenn der Gegner damit nicht überrascht wird.
items.weapon.melee.cudgel.desc=Eine kleine Messingkeule, die eher nur zur Selbstverteidigung gemacht ist...
items.weapon.melee.cudgel.discover_hint=Einer der Helden startet mit diesem Gegenstand.

items.weapon.melee.dagger.name=Dolch
items.weapon.melee.dagger.stats_desc=Diese Waffe ist gegen ahnungslose Gegner wirksamer.
items.weapon.melee.dagger.ability_name=schleichen
items.weapon.melee.dagger.typical_ability_desc=Die Zweikämpferin kann _schleichen_, wenn sie einen Dolch führt. Diese Fähigkeit gestattet es der Zweikämpferin, sofort bis zu 5 Felder weit zu springen und verleiht ihr üblicherweise _%d Züge Unsichtbarkeit_.
items.weapon.melee.dagger.ability_desc=Die Zweikämpferin kann _schleichen_, wenn sie einen Dolch führt. Diese Fähigkeit gestattet es der Zweikämpferin, sofort bis zu 5 Felder weit zu springen und verleiht ihr _%d Züge Unsichtbarkeit_.
items.weapon.melee.dagger.upgrade_ability_stat_name=Dauer der Fähigkeit
items.weapon.melee.dagger.desc=Ein einfacher Eisendolch mit einem abgenutzten Holzgriff.
items.weapon.melee.dagger.discover_hint=Einer der Helden startet mit diesem Gegenstand.

items.weapon.melee.dirk.name=Langdolch
items.weapon.melee.dirk.stats_desc=Diese Waffe kann gegen ahnungslose Gegner effektiv geführt werden.
items.weapon.melee.dirk.ability_name=schleichen
items.weapon.melee.dirk.typical_ability_desc=Die Zweikämpferin kann _schleichen_, wenn sie einen Langdolch führt. Diese Fähigkeit gestattet es der Zweikämpferin, sofort bis zu 4 Felder weit zu springen und verleiht ihr üblicherweise _%d Züge Unsichtbarkeit_.
items.weapon.melee.dirk.ability_desc=Die Zweikämpferin kann _schleichen_, wenn sie einen Langdolch führt. Diese Fähigkeit gestattet es der Zweikämpferin, sofort bis zu 4 Felder weit zu springen und verleiht ihr _%d Züge Unsichtbarkeit_.
items.weapon.melee.dirk.upgrade_ability_stat_name=Dauer der Fähigkeit
items.weapon.melee.dirk.desc=Ein längerer Stoßdolch, hat ein wenig mehr Stahl, der in Gegner versenkt werden kann.

items.weapon.melee.flail.name=Flegel
items.weapon.melee.flail.stats_desc=Dies ist eine eher ungenaue Waffe.\nDiese Waffe kann nicht für Überraschungsangriffe genutzt werden.
items.weapon.melee.flail.ability_name=schwingen
items.weapon.melee.flail.spin_warn=Du kannst den Flegel nicht mehr schwingen.
items.weapon.melee.flail.typical_ability_desc=Die Zweikämpferin kann einen Flegel _schwingen_, um kurzzeitig Kraft aufzubauen. Jeder Zug, in der die Flegel gedreht wird, verursacht bei ihrem nächsten regulären Angriff normalerweise _+%d Schaden_, höchstens 3 Mal. Ein sich drehender Flegel trifft garantiert. Nur der erste Schwung kostet eine Ladung.
items.weapon.melee.flail.ability_desc=Die Zweikämpferin kann einen Flegel _schwingen_, um damit kurzzeitig Kraft aufzubauen. Jeder Zug, in dem der Flegel geschwungen wird, verursacht bei seinem nächsten normalen Angriff +%d Schaden_ bis zu maximal 3 Zügen. Ein schwingender Flegel trifft außerdem garantiert. Nur der erste Schwung kostet eine Ladung.
items.weapon.melee.flail.desc=Eine Kugel, übersät mit Stacheln, die mittels einer schweren Kette an einem Griff befestigt wurde. Diese Waffe ist sehr unhandlich, richtet bei einem direkten Treffer aber verheerenden Schaden an.
items.weapon.melee.flail$spinabilitytracker.name=schwingend
items.weapon.melee.flail$spinabilitytracker.desc=Die Zweikämpferin schwingt ihren Flegel und baut so für ihren nächsten regulären Angriff Schaden auf. Jeder Schwung benötigt einen Zug, erhöht aber den Schaden, bis zu maximal drei Drehungen. Ein geschwungener Flegel trifft außerdem garantiert.\n\nAktive Drehungen: %1$d%%.\nVerbleibende Züge: %2$s.

items.weapon.melee.gauntlet.name=Steinhandschuh
items.weapon.melee.gauntlet.stats_desc=Diese Waffe ermöglicht sehr schnelle Angriffe.
items.weapon.melee.gauntlet.ability_name=Kombi-Angriff
items.weapon.melee.gauntlet.typical_ability_desc=Die Zweikämpferin kann mit einem Steinhandschuh einen _Komboschlag_ ausführen. Dieser Angriff trifft garantiert und verursacht normalerweise _+%d Schaden_ für jedes Mal, wenn die Zweikämpferin in den letzten 5 Zügen mit einem normalen Nahkampfangriff oder einer Wurfwaffe getroffen hat. 5 Züge ohne Treffer setzen diese Kombi zurück.
items.weapon.melee.gauntlet.ability_desc=Die Zweikämpferin kann mit einem Steinhandschuh einen _Komboschlag_ ausführen. Dieser Angriff trifft garantiert und verursacht _+%d Schaden_ für jedes Mal, wenn die Zweikämpferin mit einem normalen Nahkampfangriff oder einer Wurfwaffe getroffen hat. 5 Züge ohne Treffer setzen diese Kombi zurück.
items.weapon.melee.gauntlet.desc=Dieser massive Kampfhandschuh ist aus einem karminrotem Material gefertigt, mit darauf aufgesetzten, schweren, magischen Steinen. Das Material zieht sich um deine Hand zusammen und macht die dicke Steinplatte fast zu einer zweiten Haut. Eine dermaßen schwere Waffe zu schwingen erfordert viel Stärke, bringt aber eine enorme Wucht in deine Schläge.

items.weapon.melee.glaive.name=Glefe
items.weapon.melee.glaive.stats_desc=Dies ist eine eher langsame Waffe.\nDiese Waffe hat eine erhöhte Reichweite.
items.weapon.melee.glaive.ability_name=aufspießen
items.weapon.melee.glaive.typical_ability_desc=Die Zweikämpferin kann die Spitze einer Glefe dazu benutzen, einen Gegner in Reichweite _aufzuspießen_, sofern er nicht auf einem benachbarten Feld steht. Dies fügt üblicherweise _%1$d-%2$d_ Schaden zu, wirft den Gegner zurück und trifft garantiert.
items.weapon.melee.glaive.ability_desc=Die Zweikämpferin kann die Spitze einer Glefe dazu benutzen, einen Gegner in Reichweite _aufzuspießen_, sofern er nicht auf einem benachbarten Feld steht. Dies fügt _%1$d-%2$d_ Schaden zu, wirft den Gegner zurück und trifft garantiert.
items.weapon.melee.glaive.desc=Eine gewaltige Stangenwaffe, die aus einer Schwertklinge am Ende einer Stange besteht.

items.weapon.melee.gloves.name=Kampfhandschuhe
items.weapon.melee.gloves.stats_desc=Diese Waffe ermöglicht sehr schnelle Angriffe.
items.weapon.melee.gloves.ability_name=Kombi-Angriff
items.weapon.melee.gloves.typical_ability_desc=Die Zweikämpferin kann mit Kampfhandschuhen einen _Komboschlag_ ausführen. Dieser Angriff trifft garantiert und verursacht normalerweise _+%d Schaden_ für jedes Mal, dass die Zweikämpferin in den letzten 5 Zügen mit einem normalen Nahkampf- oder Wurfwaffenangriff getroffen hat. 5 Züge ohne Treffer setzen diese Kombi zurück.
items.weapon.melee.gloves.ability_desc=Die Zweikämpferin kann mit Kampfhandschuhen einen _Komboschlag_ ausführen. Dieser Angriff trifft garantiert und verursacht _+%d Schaden_ für jedes Mal, wenn die Zweikämpferin mit einem normalen Nahkampf- oder Wurfwaffenangriff getroffen hat. 5 Züge ohne Treffer setzen diese Kombi zurück.
items.weapon.melee.gloves.desc=Diese Kampfhandschuhe bieten keinen Schutz, dienen jedoch als einsatzbereite Waffe, welche die Hände frei lässt.
items.weapon.melee.gloves.discover_hint=Einer der Helden startet mit diesem Gegenstand.

items.weapon.melee.greataxe.name=Großaxt
items.weapon.melee.greataxe.stats_desc=Diese Waffe ist unglaublich schwer.
items.weapon.melee.greataxe.ability_name=Vergeltung
items.weapon.melee.greataxe.typical_ability_desc=Die Zweikämpferin kann mit ihrer Großaxt einen _Vergeltungsangriff_ ausführen, wenn sie weniger als 50%% Lebenspunkte hat. Dieser verheerende Angriff fügt üblicherweise _%1$d-%2$d Schaden_ zu, trifft garantiert und passiert augenblicklich, wenn dadurch ein Gegner getötet wird.
items.weapon.melee.greataxe.ability_desc=Die Zweikämpferin kann mit ihrer Großaxt einen _Vergeltungsangriff_ ausführen, wenn sie weniger als 50%% Lebenspunkte hat. Dieser verheerende Angriff fügt _%1$d-%2$d Schaden_ zu, trifft garantiert und passiert augenblicklich, wenn dadurch ein Gegner getötet wird.
items.weapon.melee.greataxe.desc=Gedacht um auf der Schulter des Besitzers getragen zu werden, ist diese gigantische Axt ebenso mächtig wie schwer.

items.weapon.melee.greatshield.name=Großschild
items.weapon.melee.greatshield.typical_stats_desc=Diese Waffe wehrt typischerweise 0-%d Schaden ab. Die Abwehrkraft steigt mit den Aufwertungen der Waffe.
items.weapon.melee.greatshield.stats_desc=Diese Waffe wehrt 0–%d Schaden ab. Die Abwehrkraft steigt mit den Aufwertungen der Waffe.
items.weapon.melee.greatshield.ability_name=schützen
items.weapon.melee.greatshield.typical_ability_desc=Die Zweikämpferin kann sich mit ihrem Großschild _schützen_ und so innerhalb von üblicherweise _%d Zügen_ alle gegen sie geführten physischen oder magischen Angriffe vollständig negieren. Nachdem die Zweikämpferin einen Angriff abgeblockt hat, beendet ein Gegenangriff oder die Anwendung von Magie diesen Schutz vorzeitig.
items.weapon.melee.greatshield.ability_desc=Die Zweikämpferin kann sich mit ihrem Großschild _schützen_ und so innerhalb von _%d Zügen_ alle gegen sie geführten physischen oder magischen Angriffe vollständig negieren. Nachdem die Zweikämpferin so einen Angriff abgeblockt hat, beendet ein Gegenangriff oder die Anwendung von Magie diesen Schutz vorzeitig.
items.weapon.melee.greatshield.upgrade_ability_stat_name=Dauer der Fähigkeit
items.weapon.melee.greatshield.desc=Dieses gigantische Schild ist eher eine mobile Wand als ein Schild. Es hilft bei der Verteidigung, aber lässt nicht viel Spielraum um anzugreifen.

items.weapon.melee.greatsword.name=Großschwert
items.weapon.melee.greatsword.ability_name=aufschlitzen
items.weapon.melee.greatsword.typical_ability_desc=Die Zweikämpferin kann mit ihrem Großschwert einen Gegner _aufschlitzen_. Dies fügt üblicherweise _%1$d-%2$d Schaden_ zu und trifft garantiert. Wenn ein Gegner durch Aufschlitzen getötet wird, geschieht es augenblicklich und die Zweikämpferin kann innerhalb von 5 Zügen kostenfrei einen weiteren Gegner aufschlitzen.
items.weapon.melee.greatsword.ability_desc=Die Zweikämpferin kann mit ihrem Großschwert einen Gegner _aufschlitzen_. Dies fügt _%1$d-%2$d Schaden_ zu und trifft garantiert. Wenn ein Gegner durch Aufschlitzen getötet wird, geschieht es augenblicklich und die Zweikämpferin kann innerhalb von 5 Zügen kostenfrei einen weiteren Gegner aufschlitzen.
items.weapon.melee.greatsword.desc=Diese aufragende Klinge richtet hohen Schaden aufgrund der Wucht, welche diese Klinge mit jedem Hieb erzeugt.

items.weapon.melee.handaxe.name=Handaxt
items.weapon.melee.handaxe.stats_desc=Diese Waffe ermöglicht präzise Angriffe.
items.weapon.melee.handaxe.ability_name=schwerer Hieb
items.weapon.melee.handaxe.typical_ability_desc=Die Zweikämpferin kann mit der Handaxt einen _schweren Hieb_ ausführen. Dieser wuchtige Schlag verursacht üblicherweise _%1$d-%2$d Schaden_, wenn er den Gegner überrascht, und macht das Ziel 5 Züge lang benommen, wodurch Genauigkeit und Ausweichen um 50%% reduziert werden. Ein schwerer Hieb trifft immer, verursacht aber nur normalen Schaden, wenn der Gegner dadurch nicht überrascht wird.
items.weapon.melee.handaxe.ability_desc=Die Zweikämpferin kann mit der Handaxt einen _schweren Hieb_ ausführen. Dieser wuchtige Schlag verursacht _%1$d-%2$d Schaden_, wenn er den Gegner überrascht, und macht das Ziel 5 Züge lang benommen, wodurch Genauigkeit und Ausweichen um 50%% reduziert werden. Ein schwerer Hieb trifft immer, verursacht aber nur normalen Schaden, wenn der Gegner dadurch nicht überrascht wird.
items.weapon.melee.handaxe.desc=Eine leichte Holzfälleraxt. Zweckentfremdet funktioniert diese breite Klinge auch gut gegen Feinde.

items.weapon.melee.katana.name=Katana
items.weapon.melee.katana.stats_desc=Diese Waffe wehrt 0-3 Schaden ab.
items.weapon.melee.katana.ability_name=stürzen
items.weapon.melee.katana.typical_ability_desc=Die Zweikämpferin kann sich mit einem Katana auf einen Gegner _stürzen_, der sich 1 Feld entfernt befindet. Dadurch bewegt sie sich auf den Gegner zu, fügt üblicherweise _%1$d-%2$d Schaden_ zu und trifft garantiert.
items.weapon.melee.katana.ability_desc=Die Zweikämpferin kann sich mit einem Katana auf einen Gegner _stürzen_, der sich 1 Feld entfernt befindet. Dadurch bewegt sie sich auf den Gegner zu, fügt _%1$d-%2$d Schaden_ zu und trifft garantiert.
items.weapon.melee.katana.desc=Ein schlankes Schwert mit einer breiten Parierstange oberhalb des Griffs.

items.weapon.melee.longsword.name=Langschwert
items.weapon.melee.longsword.ability_name=aufschlitzen
items.weapon.melee.longsword.typical_ability_desc=Die Zweikämpferin kann mit ihrem Langschwert einen Gegner _aufschlitzen_. Dies fügt üblicherweise _%1$d-%2$d Schaden_ zu und trifft garantiert. Wenn ein Gegner durch Aufschlitzen getötet wird, geschieht es augenblicklich und die Zweikämpferin kann innerhalb von 5 Zügen kostenfrei einen weiteren Gegner aufschlitzen.
items.weapon.melee.longsword.ability_desc=Die Zweikämpferin kann mit einem Langschwert einen Gegner _aufschlitzen_. Dies fügt _%1$d-%2$d Schaden_ zu und trifft garantiert. Wenn ein Gegner durch Aufschlitzen getötet wird, geschieht es augenblicklich und die Zweikämpferin kann innerhalb von 5 Zügen kostenfrei einen weiteren Gegner aufschlitzen.
items.weapon.melee.longsword.desc=Die scharfe Klinge dieses stählernden Langschwertes reflektiert beruhigend im Licht, obwohl es wegen seiner Länge recht schwer ist.

items.weapon.melee.mace.name=Streitkolben
items.weapon.melee.mace.stats_desc=Diese Waffe ermöglicht präzise Angriffe.
items.weapon.melee.mace.ability_name=schwerer Hieb
items.weapon.melee.mace.typical_ability_desc=Die Zweikämpferin kann mit dem Streitkolben einen _schweren Hieb_ ausführen. Dieser wuchtige Schlag verursacht üblicherweise _%1$d-%2$d Schaden_ und macht das Ziel 5 Züge lang benommen, wodurch Genauigkeit und Ausweichen um 50%% reduziert werden. Ein schwerer Hieb trifft immer, fügt aber nur normalen Schaden zu, wenn der Gegner damit nicht überrascht wird.
items.weapon.melee.mace.ability_desc=Die Zweikämpferin kann mit dem Streitkolben einen _schweren Hieb_ ausführen. Dieser wuchtige Schlag verursacht _%1$d-%2$d Schaden_ und macht das Ziel 5 Züge lang benommen, wodurch Genauigkeit und Ausweichen um 50%% reduziert werden. Ein schwerer Hieb trifft immer, fügt aber nur normalen Schaden zu, wenn der Gegner damit nicht überrascht wird.
items.weapon.melee.mace.desc=Die große Eisenspitze dieser Waffe richtet beträchtlichen Schaden an.

items.weapon.melee.magesstaff.name=Magierstab
items.weapon.melee.magesstaff.ac_imbue=VERSCHMELZEN
items.weapon.melee.magesstaff.ac_zap=FEUERN
items.weapon.melee.magesstaff.prompt=Wähle einen Stab zum Verschmelzen
items.weapon.melee.magesstaff.imbue=Du hast deinen Stab mit dem %s verschmolzen.
items.weapon.melee.magesstaff.preserved=Der vorherige Zauberstab blieb erhalten!
items.weapon.melee.magesstaff.imbue_desc=Bist du dir sicher, dass du diesen Stab mit diesem Zauberstaub verschmelzen möchtest?\n\nWenn der Zauberstab mit einem Stab der gleichen oder einer höheren Stufe verschmolzen wird, erhält der Stab die Stufe des Zauberstabs und eine einzelne seiner eigenen Verbesserungen.
items.weapon.melee.magesstaff.imbue_level=Diese Verschmelzung wird einen _+%d Stab_ erzeugen.
items.weapon.melee.magesstaff.imbue_unknown=Du kennst die Stufe dieses Zauberstabs nicht, aber diese Verschmelzung wird zumindest einen _+%d Stab_ erzeugen.
items.weapon.melee.magesstaff.imbue_cursed=_Wenn du mit einem verfluchten Zauberstab verschmilzt, wird dein Stab ebenfalls verflucht!_
items.weapon.melee.magesstaff.imbue_lost=Der Zauberstab, der derzeit mit deinem Stab verschmolzen ist, _geht verloren_.
items.weapon.melee.magesstaff.imbue_talent=Der Zauberstab, der derzeit mit deinem Stab verschmolzen ist, _wird mit +0 zurückkommen_.
items.weapon.melee.magesstaff.yes=Ja, ich bin mir sicher.
items.weapon.melee.magesstaff.no=Nein, lieber doch nicht...
items.weapon.melee.magesstaff.desc=Dieser vom Magier selbst gefertigte Stab ist eine einzigartige magische Waffe, die mit einem Zauberstab verschmolzen werden kann.
items.weapon.melee.magesstaff.no_wand=In diesem Stab ruht aktuell keine Magie. Zuerst muss dieser Zauberstab mit _der Kraft eines anderen Zauberstabs verschmolzen werden,_ damit dieser Zauber wirken kann.
items.weapon.melee.magesstaff.has_wand=Der Stab ist derzeit mit einem _%s_ verschmolzen.
items.weapon.melee.magesstaff.cursed_wand=Dieser Stab ist verflucht, was seine Magie chaotisch und zufällig macht.
items.weapon.melee.magesstaff.discover_hint=Einer der Helden startet mit diesem Gegenstand.

items.weapon.melee.meleeweapon.ac_ability=FÄHIGKEIT
items.weapon.melee.meleeweapon.stats_known=Diese Nahkampfwaffe der _Stufe %1$d_ richtet _%2$d-%3$d Schaden_ an und benötigt eine _Stärke von %4$d,_ um die Waffe ohne Abzüge verwenden zu können.
items.weapon.melee.meleeweapon.stats_unknown=Diese Nahkampfwaffe der _Stufe %1$d_ richtet gewöhnlich _%2$d-%3$d Schaden_ an und benötigt eine _Stärke von %4$d,_ um die Waffe ohne Abzüge verwenden zu können.
items.weapon.melee.meleeweapon.probably_too_heavy=Wahrscheinlich ist diese Waffe zu schwer für dich.
items.weapon.melee.meleeweapon.stats_desc=
items.weapon.melee.meleeweapon.ability_need_equip=Du musst diese Waffe ausrüsten, um ihre Fähigkeit nutzen zu können.
items.weapon.melee.meleeweapon.ability_low_str=Du bist nicht stark genug, um die Fähigkeit dieser Waffe zu nutzen.
items.weapon.melee.meleeweapon.ability_no_charge=Du hast nicht genügend Energie, um diese Fähigkeit zu nutzen.
items.weapon.melee.meleeweapon.ability_cant_use=Du kannst diese Fähigkeit jetzt nicht nutzen.
items.weapon.melee.meleeweapon.ability_no_target=Es ist kein Ziel da.
items.weapon.melee.meleeweapon.ability_target_range=Dieses Ziel befindet sich nicht in Reichweite.
items.weapon.melee.meleeweapon.ability_occupied=Dieser Ort ist bereits besetzt.
items.weapon.melee.meleeweapon.upgrade_ability_stat_name=Fähigkeitsschaden
items.weapon.melee.meleeweapon.prompt=Wähle ein Ziel
items.weapon.melee.meleeweapon.swap=Waffen tauschen
items.weapon.melee.meleeweapon.swap_full=Du kannst das mit einem vollen Inventar nicht tun.


items.weapon.melee.shortsword.name=Kurzschwert
items.weapon.melee.shortsword.ability_name=aufschlitzen
items.weapon.melee.shortsword.typical_ability_desc=Die Zweikämpferin kann mit ihrem Kurzschwert einen Gegner _aufschlitzen_. Dies fügt üblicherweise _%1$d-%2$d Schaden_ zu und trifft garantiert. Wenn ein Gegner durch Aufschlitzen getötet wird, geschieht es augenblicklich und die Zweikämpferin kann innerhalb von 5 Zügen kostenfrei einen weiteren Gegner aufschlitzen.
items.weapon.melee.shortsword.ability_desc=Die Zweikämpferin kann mit ihrem Kurzschwert einen Gegner _aufschlitzen_. Dies fügt _%1$d-%2$d Schaden_ zu und trifft garantiert.  Wenn ein Gegner durch Aufschlitzen getötet wird, geschieht es augenblicklich und die Zweikämpferin kann innerhalb von 5 Zügen kostenfrei einen weiteren Gegner aufschlitzen.
items.weapon.melee.shortsword.desc=Ein ziemlich kurzes Schwert, nur ein paar Zoll länger als ein Dolch.

items.weapon.melee.quarterstaff.name=Kampfstab
items.weapon.melee.quarterstaff.stats_desc=Diese Waffe blockt 0-2 Schaden.
items.weapon.melee.quarterstaff.ability_name=Verteidigungshaltung
items.weapon.melee.quarterstaff.typical_ability_desc=Die Zweikämpferin kann mit einem Kampfstab eine _Verteidigungshaltung_ einnehmen. Diese Haltung benötigt keine Aktivierungszeit und verdreifacht das Ausweichen für üblicherweise _%d Züge_.
items.weapon.melee.quarterstaff.ability_desc=Die Zweikämpferin kann mit einem Kampfstab eine _Verteidigungshaltung_ einnehmen. Diese Haltung benötigt keine Aktivierungszeit und verdreifacht das Ausweichen für _%d Züge_.
items.weapon.melee.quarterstaff.upgrade_ability_stat_name=Dauer der Fähigkeit
items.weapon.melee.quarterstaff.desc=Dieser Stab besteht aus Hartholz, seine Enden sind mit Eisen beschlagen.
items.weapon.melee.quarterstaff$defensivestance.name=Verteidigungshaltung
items.weapon.melee.quarterstaff$defensivestance.desc=Die Zweikämpferin benutzt ihren Kampfstab dazu, eingehende Schläge und Projektile abzuwehren. Solange sie in dieser Haltung verbleibt, ist es dreimal so wahrscheinlich, dass sie einem beliebigen Angriff ausweichen kann.\n\nVerbleibende Züge: %s.

items.weapon.melee.rapier.name=Rapier
items.weapon.melee.rapier.stats_desc=Diese Waffe blockt 0-1 Schadenspunkte.
items.weapon.melee.rapier.ability_name=stürzen
items.weapon.melee.rapier.typical_ability_desc=Die Zweikämpferin kann sich mit einem Rapier auf einen Gegner _stürzen_, der sich 1 Feld entfernt befindet. Dadurch bewegt sie sich auf den Gegner zu, fügt üblicherweise _%1$d-%2$d Schaden_ zu und trifft garantiert.
items.weapon.melee.rapier.ability_desc=Die Zweikämpferin kann sich mit einem Rapier auf einen Gegner _stürzen_, der sich 1 Feld entfernt befindet. Dadurch bewegt sie sich auf den Gegner zu, fügt _%1$d-%2$d Schaden_ zu und trifft garantiert.
items.weapon.melee.rapier.desc=Ein schmales, gerades Schwert, das zusätzlich etwas Schutz bietet, sich dafür aber weniger zum Aufschlitzen der Gegner eignet.
items.weapon.melee.rapier.discover_hint=Einer der Helden startet mit diesem Gegenstand.

items.weapon.melee.roundshield.name=Rundschild
items.weapon.melee.roundshield.typical_stats_desc=Diese Waffe wehrt üblicherweise 0–%d Schaden ab. Diese Abwehr steigt mit der Aufwertung der Waffe.
items.weapon.melee.roundshield.stats_desc=Diese Waffe wehrt 0–%d Schaden ab. Die Abwehrkraft steigt mit den Aufwertungen der Waffe.
items.weapon.melee.roundshield.ability_name=schützen
items.weapon.melee.roundshield.typical_ability_desc=Die Zweikämpferin kann sich mit ihrem Rundschild _schützen_ und so innerhalb von üblicherweise _%d Zügen_ alle gegen sie geführten physischen oder magischen Angriffe komplett negieren. Nachdem die Zweikämpferin so einen Angriff blockiert hat, beendet ein Gegenangriff oder die Anwendung von Magie diesen Schutz.
items.weapon.melee.roundshield.ability_desc=Die Zweikämpferin kann sich mit ihrem Rundschild _schützen_ und so innerhalb von _%d Zügen_ alle gegen sie geführten physischen oder magischen Angriffe komplett negieren. Nachdem die Zweikämpferin so einen Angriff blockiert hat, beendet ein Gegenangriff oder die Anwendung von Magie diesen Schutz.
items.weapon.melee.roundshield.upgrade_ability_stat_name=Dauer der Fähigkeit
items.weapon.melee.roundshield.desc=Dieses große Schild wehrt Angriffe effektiv ab und ist zur Not auch eine brauchbare Waffe.
items.weapon.melee.roundshield$guardtracker.name=beschützt
items.weapon.melee.roundshield$guardtracker.guarded=beschützt
items.weapon.melee.roundshield$guardtracker.desc=Die Zweikämpferin hat ihren Schild in Erwartung kommender Angriffe bereitgemacht. Gegen sie geführte physische oder magische Angriffe werden vollständig negiert.\n\nVerbleibende Züge: %s.

items.weapon.melee.runicblade.name=Runenklinge
items.weapon.melee.runicblade.stats_desc=Diese Waffe wird von weiteren Aufwertungen besonders profitieren.
items.weapon.melee.runicblade.ability_name=Runenschnitt
items.weapon.melee.runicblade.typical_ability_desc=Die Zweikämpferin kann mit einer Runenklinge einen _Runenschnitt_ ausführen. Dieser Angriff trifft garantiert und hat üblicherweise eine Verzauberungskraft von _+%d%%_.
items.weapon.melee.runicblade.ability_desc=Die Zweikämpferin kann mit einer Runenklinge einen _Runenschnitt_ ausführen. Dieser Angriff trifft garantiert und hat eine Verzauberungskraft von _+%d%%_.
items.weapon.melee.runicblade.upgrade_ability_stat_name=Fähigkeitskraft
items.weapon.melee.runicblade.desc=Eine mysteriöse Waffe aus einem fernen Land, mit einer leuchtend blauen Klinge.

items.weapon.melee.sai.name=Sai
items.weapon.melee.sai.stats_desc=Diese Waffe ermöglicht sehr schnelle Angriffe.
items.weapon.melee.sai.ability_name=Kombi-Angriff
items.weapon.melee.sai.typical_ability_desc=Die Zweikämpferin kann einen _Kombi-Angriff_ mit dem Sai ausführen. Dieser Angriff trifft garantiert und fügt üblicherweise _+%d Schaden_ pro Treffer, den die Zweikämpferin mit einer normalen Nahkampf- oder Wurfwaffe landet, zu. 5 Runden ohne Treffer setzen diese Kombi zurück.
items.weapon.melee.sai.ability_desc=Die Zweikämpferin kann einen _Kombi-Angriff_ mit dem Sai ausführen. Dieser Angriff trifft garantiert und fügt pro in den letzten 5 Zügen erfolgtem Treffer mit einer regulären Nahkampf- oder Wurfwaffe _+%d Schaden_ zu. 5 Züge ohne Treffer setzen diese Kombi zurück.
items.weapon.melee.sai.desc=Zwei dünne Klingen, die in je einer Hand getragen werden sollen. Großartig geeignet, um Gegner mit hektischen Stichen niederzustrecken.
items.weapon.melee.sai$combostriketracker.name=Kombi-Angriff
items.weapon.melee.sai$combostriketracker.desc=Die Zweikämpferin baut eine Kombi auf, die zur Erhöhung des Schadens der Kombi-Fähigkeit genutzt werden kann. Jeder erfolgreiche Angriff mit einer Nahkampf- oder Wurfwaffe wird gezählt, jedoch wird dieser Zähler zurückgesetzt, wenn innerhalb von 5 Zügen kein erfolgreicher Angriff ausgeführt wurde.\n\nGezählte Treffer: %1$d.\n\nZüge, bis die Treffer verfallen: %2$s.

items.weapon.melee.scimitar.name=Krummsäbel
items.weapon.melee.scimitar.stats_desc=Diese Waffe ermöglicht schnelle Angriffe.
items.weapon.melee.scimitar.ability_name=Schwerttanz
items.weapon.melee.scimitar.typical_ability_desc=Die Zweikämpferin kann mit einem Krummsäbel einen _Schwerttanz_ ausführen. Diese Haltung benötigt keine Aktivierungszeit und gewährt der Zweikämpferin eine Angriffsgeschwindigkeit von +60%% und +50%% Genauigkeit im Verlauf von üblicherweise _%d Zügen_.
items.weapon.melee.scimitar.ability_desc=Die Zweikämpferin kann mit einem Krummsäbel einen _Schwerttanz_ ausführen. Diese Haltung benötigt keine Aktivierungszeit und gewährt der Zweikämpferin eine Angriffsgeschwindigkeit von +60%% und +50%% Genauigkeit im Verlauf von _%d Zügen_.
items.weapon.melee.scimitar.upgrade_ability_stat_name=Dauer der Fähigkeit
items.weapon.melee.scimitar.desc=Eine stark geschwungene Klinge. Ihre Form ermöglicht schnelle, dabei jedoch weniger kraftvolle Hiebe.
items.weapon.melee.scimitar$sworddance.name=Schwerttanz
items.weapon.melee.scimitar$sworddance.desc=Die Zweikämpferin bewegt sich tänzerisch mit schnellen, schwungvollen Hieben. In diesem Zustand greift sie um 60%% schneller an (schnell genug, um genau zweimal pro Zug mit einem Krummsäbel anzugreifen) und ihre Genauigkeit steigt um +50%%.\n\nVerbleibende Züge: %s.

items.weapon.melee.sickle.name=Sichel
items.weapon.melee.sickle.stats_desc=Dies ist eine ziemlich ungenaue Waffe.
items.weapon.melee.sickle.ability_name=ernten
items.weapon.melee.sickle.typical_ability_desc=Die Zweikämpferin kann einen Feind mit einer Sichel _ernten_. Dieser verheerende Angriff trifft garantiert und verursacht üblicherweise _%d Schaden._ Dieser Schaden wird als Blutung angewendet, wenn das Ziel nicht immun ist.
items.weapon.melee.sickle.ability_desc=Die Zweikämpferin kann einen Feind mit einer Sichel _ernten_. Dieser verheerende Angriff trifft garantiert und verursacht _%d Schaden._ Dieser Schaden wird als Blutung angewendet, wenn das Ziel nicht immun ist.
items.weapon.melee.sickle.desc=Ein manuelles Bauernwerkzeug, das auch als starke, aber unhandliche Waffe genutzt werden kann.

items.weapon.melee.spear.name=Speer
items.weapon.melee.spear.stats_desc=Dies ist eine eher langsame Waffe.\nDiese Waffe besitzt erhöhte Reichweite.
items.weapon.melee.spear.ability_name=aufspießen
items.weapon.melee.spear.typical_ability_desc=Die Zweikämpferin kann die Spitze eines Speers dazu benutzen, einen Gegner in Reichweite _aufzuspießen_, sofern er nicht auf einem angrenzenden Feld steht. Dies fügt üblicherweise _%1$d-%2$d_ Schaden zu, wirft den Gegner zurück und trifft garantiert.
items.weapon.melee.spear.ability_desc=Die Zweikämpferin kann die Spitze eines Speers dazu benutzen, einen Gegner in Reichweite _aufzuspießen_, sofern er nicht auf einem angrenzenden Feld steht. Dies fügt _%1$d-%2$d_ Schaden zu, wirft den Gegner zurück und trifft garantiert.
items.weapon.melee.spear.desc=Ein schlanker Holzstab. An seiner Spitze ruht eine scharfe Eisenspitze.

items.weapon.melee.sword.name=Schwert
items.weapon.melee.sword.ability_name=aufschlitzen
items.weapon.melee.sword.typical_ability_desc=Die Zweikämpferin kann mit ihrem Schwert einen Gegner _aufschlitzen_. Dies fügt üblicherweise _%1$d-%2$d Schaden_ zu und trifft garantiert. Wenn ein Gegner durch das Aufschlitzen getötet wird, geschieht es augenblicklich und die Zweikämpferin kann innerhalb von 5 Zügen kostenfrei einen weiteren Gegner aufschlitzen.
items.weapon.melee.sword.ability_desc=Die Zweikämpferin kann mit einem Schwert einen Gegner _aufschlitzen_. Dies fügt _%1$d-%2$d Schaden_ zu und trifft garantiert. Wenn ein Gegner durch das Aufschlitzen getötet wird, geschieht es augenblicklich und die Zweikämpferin kann innerhalb von 5 Zügen kostenfrei einen weiteren Gegner aufschlitzen.
items.weapon.melee.sword.desc=Ein gut ausbalanciertes Schwert. Nicht zu groß, aber immer noch merklich länger als ein Kurzschwert.
items.weapon.melee.sword$cleavetracker.name=aufschlitzen
items.weapon.melee.sword$cleavetracker.desc=Die Zweikämpferin ist bereit, dem einen aufgeschlitzten Feind einen weiteren hinzuzufügen. Die nächste Aktivierung des Aufschlitzens verbraucht keine Ladungen der Waffenfähigkeit.\n\nVerbleibende Züge: %s.

items.weapon.melee.warhammer.name=Streithammer
items.weapon.melee.warhammer.stats_desc=Diese Waffe ermöglicht präzise Angriffe.
items.weapon.melee.warhammer.ability_name=schwerer Hieb
items.weapon.melee.warhammer.typical_ability_desc=Die Zweikämpferin kann mit dem Streithammer einen _schweren Hieb_ ausführen. Dieser wuchtige Schlag verursacht üblicherweise _%1$d-%2$d Schaden_ und macht das Ziel 5 Züge lang benommen, wodurch Genauigkeit und Ausweichen um 50%% reduziert werden. Ein schwerer Hieb trifft immer, fügt aber nur normalen Schaden zu, wenn der Gegner damit nicht überrascht wird.
items.weapon.melee.warhammer.ability_desc=Die Zweikämpferin kann mit dem Streithammer einen _schweren Hieb_ ausführen. Dieser wuchtige Schlag verursacht _%1$d-%2$d Schaden_ und macht das Ziel 5 Züge lang benommen, wodurch Genauigkeit und Ausweichen um 50%% reduziert werden. Ein schwerer Hieb trifft immer, fügt aber nur normalen Schaden zu, wenn der Gegner damit nicht überrascht wird.
items.weapon.melee.warhammer.desc=Nur wenige Kreaturen können dem vernichtenden Schlag dieser gewaltigen Masse aus Blei und Stahl standhalten, aber es braucht große Stärke, um diese Waffe effektiv verwenden zu können.

items.weapon.melee.warscythe.name=Kampfsense
items.weapon.melee.warscythe.stats_desc=Dies ist eine ziemlich ungenaue Waffe.
items.weapon.melee.warscythe.ability_name=ernten
items.weapon.melee.warscythe.typical_ability_desc=Die Zweikämpferin kann einen Feind mit einer Kriegssense _ernten_. Dieser verheerende Angriff trifft garantiert und verursacht üblicherweise _%d Schaden._ Dieser Schaden wird als Blutung angewendet, wenn das Ziel nicht immun ist.
items.weapon.melee.warscythe.ability_desc=Die Zweikämpferin kann einen Feind mit einer Kriegssense _ernten_. Dieser verheerende Angriff trifft garantiert und verursacht _%d Schaden._ Dieser Schaden wird als Blutung angewendet, wenn das Ziel nicht immun ist.
items.weapon.melee.warscythe.desc=Dieses große, unhandliche Werkzeug wurde verstärkt, um damit statt Getreideähren die Köpfe seiner Feinde zu ernten.

items.weapon.melee.whip.name=Peitsche
items.weapon.melee.whip.stats_desc=Diese Waffe verfügt über eine enorme Reichweite.
items.weapon.melee.whip.ability_name=Rundumschlag
items.weapon.melee.whip.typical_ability_desc=Die Zweikämpferin kann mit einer Peitsche zu einem _Rundumschlag_ gegen alle Gegner um sie herum ausholen. Diese Fähigkeit verursacht üblicherweise _%1$d-%2$d Schaden_, greift alle Gegner in Reichweite an und trifft garantiert.
items.weapon.melee.whip.ability_desc=Die Zweikämpferin kann mit einer Peitsche zu einem _Rundumschlag_ gegen alle Gegner um sie herum ausholen. Diese Fähigkeit verursacht _%1$d-%2$d Schaden_, greift alle Gegner in Reichweite an und trifft garantiert.
items.weapon.melee.whip.desc=Der mit einem Haken versehene Riemen richtet zwar nur geringen Schaden an, dafür ist die Reichweite dieser Waffe jedoch unschlagbar.

items.weapon.melee.wornshortsword.name=abgenutztes Kurzschwert
items.weapon.melee.wornshortsword.ability_name=aufschlitzen
items.weapon.melee.wornshortsword.typical_ability_desc=Die Zweikämpferin kann mit ihrem abgenutzten Kurzschwert einen Gegner _aufschlitzen_. Dies fügt üblicherweise _%1$d-%2$d Schaden_ zu und trifft garantiert. Wird ein Gegner durch das Aufschlitzen getötet, geschieht dies augenblicklich und die Zweikämpferin kann innerhalb von 5 Zügen kostenfrei einen weiteren Gegner aufschlitzen.
items.weapon.melee.wornshortsword.ability_desc=Die Zweikämpferin kann mit ihrem abgenutzten Kurzschwert einen Gegner _aufschlitzen_. Dies fügt _%1$d-%2$d Schaden_ zu und trifft garantiert. Wird ein Gegner durch das Aufschlitzen getötet, geschieht dies augenblicklich und die Zweikämpferin kann innerhalb von 5 Zügen kostenfrei einen weiteren Gegner aufschlitzen.
items.weapon.melee.wornshortsword.desc=Ein recht kurzes Schwert, welches aufgrund langanhaltender Verwendung deutlich abgenutzt ist. Es ist sowohl schwächer als auch leichter als ein gewöhnliches Kurzschwert.
items.weapon.melee.wornshortsword.discover_hint=Einer der Helden startet mit diesem Gegenstand.


###missile weapons
items.weapon.missiles.darts.adrenalinedart.name=Adrenalin-Wurfpfeil
items.weapon.missiles.darts.adrenalinedart.desc=Diese Wurfpfeile wurden mit einer auf Flinkdistel basierenden Mischung präpariert, die Bewegungs- und Angriffsgeschwindigkeit von Verbündeten erhöht, oder aber kurz die Bewegungsgeschwindigkeit von Feinden senkt. Die Wurfpfeile selbst fügen Feinden immer noch Schaden zu, gegenüber Verbündeten sind sie harmlos.

items.weapon.missiles.darts.blindingdart.name=Wurfpfeil der Blendung
items.weapon.missiles.darts.blindingdart.desc=Diese Wurfpfeile wurden mit einer auf Blindkraut basierenden Mischung präpariert, die ihr Ziel für kurze Zeit erblinden lässt. Allerdings behält ein Feind seine Orientierung und wird immer noch wissen, wo er dich zuletzt gesehen hat.

items.weapon.missiles.darts.chillingdart.name=Frost-Wurfpfeil
items.weapon.missiles.darts.chillingdart.desc=Diese Wurfpfeile wurden mit einer auf Eiskappe basierenden Mischung präpariert, die ihr Ziel deutlich abkühlt.

items.weapon.missiles.darts.cleansingdart.name=reinigender Wurfpfeil
items.weapon.missiles.darts.cleansingdart.desc=Diese Wurfpfeile sind mit einer auf Maguskönigskraut basierenden Mischung präpariert, die Verbündete vorübergehend immun gegen alle negativen Effekte macht oder positive Effekte bei Feinden verschwinden lässt. Die Wurfpfeile selbst fügen Feinden immer noch Schaden zu, gegenüber Verbündeten sind sie harmlos.

items.weapon.missiles.darts.dart.name=Wurfpfeil
items.weapon.missiles.darts.dart.ac_tip=PRÄPARIEREN
items.weapon.missiles.darts.dart.prompt=Wähle ein Samenkorn
items.weapon.missiles.darts.dart.tip_title=Pfeile präparieren
items.weapon.missiles.darts.dart.tip_desc=Ein Samen kann mit einem oder zwei Pfeilen kombiniert werden, um sie zu präparieren. Die Sorte des Samens bestimmt die Art des Pfeils und seine einzigartige Wirkung.\n\nEin mit diesen Samen präparierter Pfeil wird ein _%s_.
items.weapon.missiles.darts.dart.tip_all=präpariere %1$d Pfeile mit %2$d Samen
items.weapon.missiles.darts.dart.tip_two=präpariere 2 Pfeile mit 1 Samen
items.weapon.missiles.darts.dart.tip_one=präpariere 1 Pfeil mit 1 Samen
items.weapon.missiles.darts.dart.tip_cancel=Abbrechen
items.weapon.missiles.darts.dart.desc=Diese einfachen Wurfpfeile aus Holz mit metallenen Spitzen sind ideal für zielgenaue Würfe und stechen ihr Opfer mit nur einem Schwung aus dem Handgelenk. Sie können mit Samen präpariert werden, um zusätzliche Effekte zu bewirken.
items.weapon.missiles.darts.dart.unlimited_uses=Dank ihrer einfachen Bauweise nutzen sich Wurfpfeile nicht ab und halten somit für immer.

items.weapon.missiles.darts.displacingdart.name=Wurfpfeil der Verdrängung
items.weapon.missiles.darts.displacingdart.desc=Diese Wurfpfeile wurden mit einer auf Blassblatt basierenden Mischung präpariert, die ihr Ziel ein kleines Stück wegteleportiert.

items.weapon.missiles.darts.healingdart.name=heilender Wurfpfeil
items.weapon.missiles.darts.healingdart.desc=Diese Wurfpfeile wurden mit einer auf Sonnengras basierenden Mischung präpariert, welche einen Heilungsschub beim Ziel auslöst. Die Wurfpfeile selbst fügen Feinden immer noch Schaden zu, gegenüber Verbündeten sind sie harmlos.

items.weapon.missiles.darts.holydart.name=geheiligter Wurfpfeil
items.weapon.missiles.darts.holydart.desc=Diese Wurfpfeile wurden mit einer auf Sternenblumen basierenden Mischung präpariert, die dem Ziel heilige Energie einflößt. Verbündete und normale Feinde werden dadurch gesegnet, untote oder dämonische Feinde jedoch erleiden schweren Schaden. Die Wurfpfeile selbst fügen Feinden immer noch Schaden zu, gegenüber Verbündeten sind sie harmlos.

items.weapon.missiles.darts.incendiarydart.name=Brand-Wurfpfeil
items.weapon.missiles.darts.incendiarydart.desc=Diese Wurfpfeile wurden mit einer auf Feuerblüten basierenden Mischung präpariert, die sich beim Auftreffen hell entzündet.

items.weapon.missiles.darts.paralyticdart.name=Paralyse-Wurfpfeil
items.weapon.missiles.darts.paralyticdart.desc=Diese Wurfpfeile wurden mit einer auf Erdwurzel basierenden Mischung präpariert, die ihr Ziel kurzzeitig lähmt.

items.weapon.missiles.darts.poisondart.name=Gift-Wurfpfeil
items.weapon.missiles.darts.poisondart.desc=Diese Wurfpfeile wurden in eine Mischung getaucht, die Trauermoos enthält und das Ziel vergiftet.

items.weapon.missiles.darts.rotdart.name=Wurfpfeil der Fäulnis
items.weapon.missiles.darts.rotdart.desc=Diese bösartigen Wurfpfeile werden mit einer säurehaltigen, auf Faulbeeren basierenden Mischung präpariert und ätzen sich aggressiv durch alles, womit der Pfeil in Berührung kommt. Starke Feinde werden einen Großteil der Wirkung aushalten, aber die Korrosion ist stark genug, um die meisten normalen Gegner zu töten. Diese Wurfpfeile sind länger haltbar als andere präparierte Wurfpfeile, jedoch kann ihre Lebensdauer nicht erhöht werden.
items.weapon.missiles.darts.rotdart.discover_hint=Du kannst diesen Gegenstand während einer bestimmten Aufgabe finden.

items.weapon.missiles.darts.shockingdart.name=Schock-Wurfpfeil
items.weapon.missiles.darts.shockingdart.desc=Diese Wurfpfeile wurden in eine Mischung getaucht, die Sturmreben enthält und die dem Ziel einen ordentlichen Schock verpassen.

items.weapon.missiles.darts.tippeddart.ac_clean=SÄUBERN
items.weapon.missiles.darts.tippeddart.clean_title=Saubere Pfeile
items.weapon.missiles.darts.tippeddart.clean_desc=Diese Aktion wird den Samen von den Pfeilen entfernen, dabei werden sie wieder zu normalen Pfeilen.
items.weapon.missiles.darts.tippeddart.clean_all=alle säubern
items.weapon.missiles.darts.tippeddart.clean_one=einen säubern
items.weapon.missiles.darts.tippeddart.cancel=Abbrechen
items.weapon.missiles.darts.tippeddart.uses_left=Diese Wurfpfeile können noch _%d/%d_ mal verwendet werden, bevor die Wirkung einer präparierten Spitze nachlässt.
items.weapon.missiles.darts.tippeddart.unlimited_uses=_Aber diese sind von so hoher Qualität, dass sie für immer halten werden._
items.weapon.missiles.darts.tippeddart.about_to_break=Die Wirkung deines präparierten Pfeils läuft bald ab.
items.weapon.missiles.darts.tippeddart.has_broken=Die Wirkung deines präparierten Pfeils ist abgelaufen.
items.weapon.missiles.darts.tippeddart.discover_hint=Du kannst diesen Gegenstand in einem Laden kaufen oder ihn mit einem Samen herstellen.


items.weapon.missiles.bolas.name=Bola
items.weapon.missiles.bolas.stats_desc=Diese Waffe verkrüppelt das von ihr getroffene Ziel.
items.weapon.missiles.bolas.desc=Diese ungewöhnlichen Fernkampfwaffen richten zwar nicht besonders viel Schaden an, leisten aber ganze Arbeit darin, das Ziel zu verlangsamen.

items.weapon.missiles.boomerang.name=Bumerang
items.weapon.missiles.boomerang.desc=Wenn diese flach-gekrümmte Waffe auf den Feind geworfen wird, kehrt sie wieder in die Hand des Werfers zurück.
items.weapon.missiles.boomerang.durability=Aufgrund seiner soliden Bauweise nutzt sich dieser Bumerang nicht ab.

items.weapon.missiles.fishingspear.name=Harpune
items.weapon.missiles.fishingspear.desc=Kleine Wurfspieße, die sich gut als improvisierte Waffe eignen, außer, dass sie natürlich zum Fischen gemacht worden sind.

items.weapon.missiles.forcecube.name=Kraftwürfel
items.weapon.missiles.forcecube.ondeath=Du hast dich mit deinem eigenen Kraftwürfel getötet...
items.weapon.missiles.forcecube.stats_desc=Diese Waffe verteilt die Gewalt ihres Einschlags in einem kleinen Gebiet, wodurch alles in der Nähe getroffen wird.
items.weapon.missiles.forcecube.desc=Diese seltsam geformten magischen Würfel sind klein genug, um sie in der Hand zu halten, aber sie sind unglaublich schwer.

items.weapon.missiles.heavyboomerang.name=schwerer Bumerang
items.weapon.missiles.heavyboomerang.stats_desc=Fünf Züge, nachdem sie geworfen wurde, fliegt diese Waffe zurück an den Ort, von dem sie geworfen wurde.
items.weapon.missiles.heavyboomerang.desc=Dieser große Bumerang ist schwer zu beherrschen, verursacht aber erheblichen Schaden.

items.weapon.missiles.javelin.name=Wurfspeer
items.weapon.missiles.javelin.desc=Diese schweren Wurfspeere sind so ausbalanciert, dass sie immer mit der Spitze voranfliegen.

items.weapon.missiles.kunai.name=Kunai
items.weapon.missiles.kunai.stats_desc=Diese Waffe ist gegen ahnungslose Gegner wirksamer.
items.weapon.missiles.kunai.desc=Diese kleinen Wurfmesser entfalten in geübter Hand eine große Wirkung.

items.weapon.missiles.missileweapon.stats_known=Dieser Satz Wurfwaffen der _Stufe %1$d_ verursacht _%2$d-%3$d Schaden_ und benötigt eine _Stärke von %4$d_ für die Benutzung.
items.weapon.missiles.missileweapon.stats_unknown=Dieser Satz an Wurfwaffen der _Stufe %1$d_ verursacht üblicherweise _%2$d-%3$d Schaden_ und benötigt eine _Stärke von %4$d_ für die Benutzung.
items.weapon.missiles.missileweapon.stats_desc=
items.weapon.missiles.missileweapon.probably_too_heavy=Wahrscheinlich ist diese Waffe zu schwer für dich.
items.weapon.missiles.missileweapon.distance=Wurfwaffen sind auf Entfernung genauer, aber weniger genau im Nahbereich.
items.weapon.missiles.missileweapon.durability=Wurfwaffen werden beim Gebrauch abgenutzt und zerbrechen.
items.weapon.missiles.missileweapon.uses_left=Diese Waffen können noch _%d/%d_ Mal verwendet werden, bevor eine zerbricht.
items.weapon.missiles.missileweapon.unlimited_uses=_Dieser Satz ist von so hoher Qualität, dass sie für immer halten werden._
items.weapon.missiles.missileweapon.unknown_uses=Im Normalfall hat man mit diesem Satz Wurfwaffen _%d_ Anwendungen, bevor eine davon bricht.
items.weapon.missiles.missileweapon.curse_discover=Diese Wurfwaffe ist verflucht!
items.weapon.missiles.missileweapon.about_to_break=Deine Wurfwaffe zerbricht gleich.
items.weapon.missiles.missileweapon.has_broken=Eine deiner Wurfwaffen ist zerbrochen.
items.weapon.missiles.missileweapon.dust=Diese Wurfwaffe zerfällt zu Staub, als du sie berührst.
items.weapon.missiles.missileweapon.break_upgraded_warn_desc=Wenn die letzte Wurfwaffe aus deinem verbesserten Satz Wurfwaffen bricht, geht der Satz unwiederbringlich verloren. Bist du sicher, dass du sie werfen möchtest?
items.weapon.missiles.missileweapon.break_upgraded_warn_yes=Ja
items.weapon.missiles.missileweapon.break_upgraded_warn_no=Nein
items.weapon.missiles.missileweapon$placeholder.name=Wurfwaffe

items.weapon.missiles.shuriken.name=Wurfstern
items.weapon.missiles.shuriken.stats_desc=Wurfsterne können augenblicklich mit einer Abklingzeit von 20 Zügen geworfen werden.
items.weapon.missiles.shuriken.desc=Diese sternförmigen Metallobjekte mit messerscharfen Kanten können schnell aus der Bewegung heraus geworfen werden.
items.weapon.missiles.shuriken$shurikeninstanttracker.name=Wurfstern-Abklingzeit
items.weapon.missiles.shuriken$shurikeninstanttracker.desc=Du hast vor kurzem augenblicklich einen Wurfstern geworfen und musst nun warten, bevor du dies wieder tun kannst. Wurfsterne können immer noch geworfen werden, jedoch mit der normalen Waffengeschwindigkeit.\n\nVerbleibende Züge: %s.

items.weapon.missiles.throwingclub.name=Wurfschläger
items.weapon.missiles.throwingclub.stats_desc=Diese Waffe bleibt nicht in Feinden stecken und kann sofort wieder aufgesammelt werden.
items.weapon.missiles.throwingclub.desc=Eine ziemlich schlichte, aber haltbare Wurfwaffe, im Grunde ein großer Stein, der an einem Stock befestigt wurde.

items.weapon.missiles.throwinghammer.name=Wurfhammer
items.weapon.missiles.throwinghammer.stats_desc=Diese Waffe bleibt nicht in Feinden stecken und kann sofort wieder aufgesammelt werden.
items.weapon.missiles.throwinghammer.desc=Diese schweren Hämmer wurden geschmiedet, um auf Gegner geworfen zu werden. Ihre glatte Bauweise aus Metall bedeutet, dass sie ausgesprochen haltbar sind.

items.weapon.missiles.throwingknife.name=Wurfmesser
items.weapon.missiles.throwingknife.stats_desc=Diese Waffe ist gegen ahnungslose Gegner wirksamer.
items.weapon.missiles.throwingknife.desc=Diese leichten Messer sind so austariert, um durch die Luft direkt an ihr Ziel zu fliegen.
items.weapon.missiles.throwingknife.discover_hint=Einer der Helden startet mit diesem Gegenstand.

items.weapon.missiles.throwingspear.name=Wurfspeer
items.weapon.missiles.throwingspear.desc=Diese leichten Speere haben dünne Schäfte und wurden zum Werfen und nicht zum Stoßen ausgelegt.

items.weapon.missiles.throwingspike.name=Wurfspieß
items.weapon.missiles.throwingspike.desc=Diese haltbaren spitzen Metallstäbe sollen auf entfernte Gegner geschleudert werden.
items.weapon.missiles.throwingspike.discover_hint=Einer der Helden startet mit diesem Gegenstand.

items.weapon.missiles.throwingstone.name=Wurfstein
items.weapon.missiles.throwingstone.desc=Diese Steine wurden abgeschliffen, damit sie mit größerer Kraft geworfen werden können als normale Steine.
items.weapon.missiles.throwingstone.discover_hint=Einer der Helden startet mit diesem Gegenstand.

items.weapon.missiles.tomahawk.name=Tomahawk
items.weapon.missiles.tomahawk.stats_desc=Diese Waffe fügt ihrem Ziel _Blutungen der Stärke %1$d-%2$d_ zu.
items.weapon.missiles.tomahawk.typical_stats_desc=Normalerweise fügt diese Waffe ihrem Ziel _Blutungen der Stärke %1$d-%2$d_ zu.
items.weapon.missiles.tomahawk.desc=Diese Wurfäxte haben eine gezackte Kante, die Wunden reißt, während sie in einem Feind stecken bleiben.

items.weapon.missiles.trident.name=Dreizack
items.weapon.missiles.trident.desc=Massive Wurfspeere mit drei tödlichen Zacken. Sie sind mächtig, aber ziemlich schwer.


items.weapon.spiritbow.name=Seelenbogen
items.weapon.spiritbow.ac_shoot=SCHIESSEN
items.weapon.spiritbow.prompt=Wähle ein Ziel
items.weapon.spiritbow.stats=Der Bogen kann nicht direkt verbessert werden, sondern wird mit zunehmendem Level immer stärker. Auf deinem aktuellen Level verursachen Pfeile, die aus dem Bogen geschossen werden, _%1$d–%2$d Schaden_ und er erfordert eine _Stärke von %3$d_, um korrekt verwendet zu werden.
items.weapon.spiritbow.desc=Ein Bogen, gemacht aus uraltem, magischen Holz. Schnur und Zeichen des Bogens erglühen in einem blassen Blau. Wird die Sehne gespannt, beschwört dieser Bogen einen magischen Pfeil, der auf einen Feind geschossen werden kann.
items.weapon.spiritbow.discover_hint=Einer der Helden startet mit diesem Gegenstand.

items.weapon.weapon.identify=Du bist mit deiner Waffe nun vertraut genug, um sie zu identifizieren.
items.weapon.weapon.too_heavy=Aufgrund deiner unzureichenden Stärke wirst du diese Waffe mit verringerter Angriffsgeschwindigkeit und Treffergenauigkeit verwenden.
items.weapon.weapon.excess_str=Aufgrund deiner überschüssigen Stärke wirst du bis  _0-%d Zusatzschaden_ mit dieser Waffe anrichten.
items.weapon.weapon.hardening_gone=Die Verhärtung dieser Waffe wurde abgetragen!
items.weapon.weapon.incompatible=Die Interaktion mit verschiedenen Arten von Magie hat die Verzauberung von dieser Waffe entfernt!
items.weapon.weapon.cursed_worn=Da diese Waffe verflucht ist, kannst du sie nicht mehr loslassen.
items.weapon.weapon.cursed=Du spürst, dass eine bösartige Magie in dieser Waffe ruht.
items.weapon.weapon.weak_cursed=Trotz des Fluchs gelingt es dir, die Waffe abzulegen.
items.weapon.weapon.not_cursed=Diese Waffe ist frei von bösartiger Magie.
items.weapon.weapon.faster=Verzaubert, um die _Geschwindigkeit_ zu erhöhen.
items.weapon.weapon.stronger=Verzaubert, um mehr _Schaden_ zu verursachen.
items.weapon.weapon.enchanted=steht unter der Wirkung von _%s_.
items.weapon.weapon.enchant_hardened=Sie wurde _verhärtet._
items.weapon.weapon.hardened_no_enchant=Diese Waffe wurde _verhärtet,_ aber ist derzeit nicht verzaubert.
items.weapon.weapon$enchantment.enchant=Verzauberung
items.weapon.weapon$enchantment.rankings_desc=Getötet durch eine Verzauberung
items.weapon.weapon$enchantment.discover_hint=Du kannst einen Gegenstand mit diesem Effekt zufällig im Dungeon finden, oder du kannst versuchen, ihn selber auf einen Gegenstand anzuwenden.


###misc items
items.amulet.name=Amulett von Yendor
items.amulet.ac_end=SPIEL BEENDEN
items.amulet.desc=Das Amulett von Yendor ist das mächtigste Artefakt, das Menschen oder Zwergen kennen. Seine schimmernden Kristalle beherbergen eine unglaubliche und wunderbare Macht.
items.amulet.desc_origins=Es ist nicht bekannt, wo das Amulett seinen Ursprung nimmt. Die Geschichtsschreibung besagt, dass der Zwergenkönig das Amulett entdeckte, kurz bevor die Zwergenzivilisation alle Kontakte abbrach. Wie hat er es gefunden? Wie hat Yog-Dzewa es ihm abgenommen? Diese Fragen heben wir uns vielleicht für später auf; alles, was jetzt zählt, ist, dass das Amulett jetzt dir gehört!
items.amulet.desc_ascent=Es ist nicht bekannt, wo das Amulett seinen Ursprung nimmt, jedoch steht es deutlich unter dem Einfluss der Macht Yog-Dzewas. Das Dungeon scheint sich Yogs Willen zu beugen, während du es durchquerst, so dass deine Feinde zahlreicher und stärker werden! Du bist auch nicht mehr dazu in der Lage, das Amulett zu aktivieren oder abzuwerfen, ganz, als wäre es verflucht.
items.amulet.ascent_title=Aufstieg
items.amulet.ascent_desc=Du beginnst zu spüren, wie die große und schreckliche Macht Yog-Dzewas aus dem Amulett ausstrahlt. Als einfacher Sterblicher wieder zurück durch das Dungeon an die Oberfläche zu steigen, könnte schwerer werden, als du gedacht hast!\n\nWenn du damit fortfährst, mit dem Amulett nach oben zu steigen, wird das Dungeon gefährlicher werden, Teleportationen zwischen Ebenen werden unmöglich und du kannst das Spiel nur gewinnen, wenn du Feinde besiegst, während du durch das Dungeon bis nach oben steigst!\n\nDu kannst das Amulett aber auch erst einmal hier liegen lassen, wenn du aufsteigen willst, ohne dich dieser Herausforderung zu stellen, oder das Amulett aktivieren, bevor du aufsteigst, und das Spiel so normal beenden.
items.amulet.ascent_yes=Fortfahren!
items.amulet.ascent_no=Vorerst abbrechen
items.amulet.discover_hint=Du kannst diesen Gegenstand am Ende des Dungeons finden...

items.ankh.name=Anch
items.ankh.ac_bless=SEGNEN
items.ankh.bless=Du segnest das Anch mit magischem Wasser.
items.ankh.desc=Dieses alte Symbol der Unsterblichkeit verleiht die Fähigkeit, nach dem Tod zum Leben zurückzukehren. Die meisten Gegenstände werden an der Stelle fallen gelassen, an der man gestorben ist, können aber wiedererlangt werden, wenn man dorthin zurückkehrt. Mit einem vollen Wasserschlauch kann das Anch mit zusätzlicher Kraft gesegnet werden.
items.ankh.desc_blessed=Dieses alte Symbol der Unsterblichen gewährt die Fähigkeit der Wiedergeburt nach dem Tod. Dieses Anch wurde gesegnet und ist nun viel stärker als zuvor. Solltest du in tödlicher Gefahr sein, wird sich das Anch opfern und dich erretten.
items.ankh.discover_hint=Du kannst diesen Gegenstand in einem Laden kaufen.

items.arcaneresin.name=arkanes Harz
items.arcaneresin.prompt=Wähle einen Stab zum Verschmelzen
items.arcaneresin.ac_apply=ANWENDEN
items.arcaneresin.level_too_high=Dieser Zauberstab ist zu mächtig, als dass Harz ihn verbessern könnte.
items.arcaneresin.not_enough=Du besitzt nicht genug Harz dafür!
items.arcaneresin.apply=Du beschichtest deinen Zauberstab mit Harz und erhöhst damit seine Kraft!
items.arcaneresin.desc=Dieses feine Pulver schimmert in Violett- und Weißtönen. Es kann als Verstärker magischer Energien wirken und die Stufe von Zauberstäben erhöhen, wenn es auf sie aufgetragen wird!\n\nDie Verbesserung eines Zauberstabs kostet 1, 2 oder 3 Harze, je nach der ursprünglichen Stufe des Zauberstabs. Harz kann Zauberstäbe bis zu einem Maximum von +3 aufrüsten.\n\nAufwertungen durch Harz werden jedoch _von anderen Quellen für Verbesserungen_ (wie Schriftrollen der Verbesserung) überschrieben und gelten nicht, wenn ein Zauberstab in den Stab des Magiers eingearbeitet wird.
items.arcaneresin.discover_hint=Du kannst diesen Gegenstand mit Alchemie herstellen.

items.brokenseal.name=Zerbrochenes Siegel
items.brokenseal.ac_affix=BEFESTIGEN
items.brokenseal.prompt=Wähle eine Rüstung
items.brokenseal.unknown_armor=Du musst zuerst identifizieren, ob diese Rüstung verflucht ist oder nicht.
items.brokenseal.cursed_armor=Das Siegel lässt sich nicht auf einer verfluchten Rüstung anbringen.
items.brokenseal.affix=Du befestigtst das Siegel an deiner Rüstung.
items.brokenseal.desc=Ein Wachssiegel, angebracht an der Rüstung als ein Symbol der Tapferkeit. All die Markierungen auf dem Siegel haben sich mit der Zeit abgenutzt und es ist in der Mitte zerbrochen.\n\nAls eine Erinnerung an seine Heimat hilft das Siegel dem Krieger durchzuhalten. Während das Siegel getragen wird, erhält der Krieger sofort Abschirmung, sobald ein Schaden seine LP auf mindestens die Hälfte der gesamten LP zu verringern droht.\n\nDas Siegel kann _an eine Rüstung angebracht_ und von Rüstung zu Rüstung übertragen werden. Es kann eine einzige Aufwertung mitnehmen, solange das Siegel während der Aufwertung an der Rüstung befestigt war.
items.brokenseal.inscribed=Auf dem Siegel steht geschrieben: _%s._
items.brokenseal.choose_title=Wähle eine Glyphe
items.brokenseal.choose_desc=Sowohl diese Rüstung, als auch das zerbrochene Siegel tragen eine Glyphe. Wähle, welche der beiden Glyphen bewahrt werden soll.\n\nRüstungsglyphe: %1$s\nGlyphe des zerbrochenen Siegels: %2$s\n\nBedenke: Wenn du die Glyphe wählst, die derzeit auf der Rüstung ist, wird das Siegel sie später nicht transferieren können.
items.brokenseal.discover_hint=Einer der Helden startet mit diesem Gegenstand.
items.brokenseal$warriorshield.name=Kriegerschild
items.brokenseal$warriorshield.desc_active=Das zerbrochene Siegel hilft derzeit dem Krieger durchzuhalten und verleiht ihm Abschirmung über seinen LP. Nach der Aktivierung der Abschirmung muss eine Abklingzeit ablaufen, bevor sie erneut aktiviert werden kann.\n\nDer Schild nimmt nicht mit der Zeit ab, endet aber, wenn für ein paar Züge keine Gegner in der Nähe sind. Wenn er endet, reduzieren unverbrauchte Schildpunkte die Abklingeit um ein Maximum von 50%%.\n\nVerbleibender Schild: %1$d.\n\nVerbleiende Abklingzeit: %2$d.
items.brokenseal$warriorshield.desc_cooldown=Der Krieger hat vor kurzem Abschirmung vom zerbrochenen Siegel erhalten und muss warten, bevor er wieder von diesem schützenden Effekt profitieren kann.\n\nVerbleibende Züge: %d.
items.brokenseal$warriorshield.desc_negative_cooldown=Die Abklingzeit der Abschirmung des Kriegers ist momentan negativ, das heißt, wenn seine Abschirmung aktiviert wird, ist die Abklingzeit kürzer als die üblichen 150 Züge. Die Abklingzeit der Abschirmung kann auf bis zu -150 Züge herabgesetzt werden, was bedeutet, dass sie sofort wieder verfügbar ist, nachdem sie aktiviert wurde.Derzeitige Abklingzeit: %d.

items.dewdrop.name=Tautropfen
items.dewdrop.already_full=Du bist bereits bei vollständiger Gesundheit.
items.dewdrop.desc=Ein kristallklarer Tautropfen.\n\nAufgrund der Magie, die diesem Ort innewohnt, hat dieses reine Wasser geringfügige Heilkräfte.

items.equipableitem.curse_detected=Kurz, bevor du den Gegenstand ausrüstest, spürst du, dass er verflucht ist!
items.equipableitem.unequip_cursed=Du kannst einen verfluchten Gegenstand nicht ablegen!
items.equipableitem.ac_equip=AUSRÜSTEN
items.equipableitem.ac_unequip=ABLEGEN

items.energycrystal.name=Energiekristall
items.energycrystal.desc=Eine Sammlung kleiner magischer Kristalle, die mit alchemischer Energie angefüllt sind.\n\nDiese Kristalle sind die am weitesten verbreitete Zutat von Alchemierezepten und können in einem Alchemiekessel durch Umwandlung verbrauchbarer Gegenstände erzeugt werden.

items.gold.name=Gold
items.gold.desc=Ein Haufen voller Goldmünzen. Sammle Goldmünzen, um sie später in einem Laden auszugeben.

items.heap.for_sale=%1$dg: %2$s
items.heap.chest=Truhe
items.heap.chest_desc=Du kennst den Inhalt nicht, bis du es geöffnet hast!
items.heap.locked_chest=Verschlossene Truhe
items.heap.locked_chest_desc=Du weißt nicht, was sich darin befindet, bis du sie öffnest! Aber dafür benötigst du einen goldenen Schlüssel.
items.heap.crystal_chest=Kristalltruhe
items.heap.crystal_chest_desc=Du kannst _%s_ erkennen, aber um diese Truhe zu öffnen, benötigst du einen Kristallschlüssel.
items.heap.artifact=ein Artefakt
items.heap.wand=einen Zauberstab
items.heap.ring=einen Ring
items.heap.tomb=Grabmal
items.heap.tomb_desc=Dieses uralte Grabmal könnte etwas nützliches beinhalten, doch sein Besitzer hätte sicherlich etwas dagegen, wenn du sein Grab plünderst.
items.heap.skeleton=Gebeine
items.heap.skeleton_desc=Dies sind die Hinterlassenschaften eines verunglückten Abenteuers. Vielleicht lässt sich hier etwas Wertvolles finden.
items.heap.remains=Gebeine eines Helden
items.heap.remains_desc=Das hier ist alles, was noch von deinem Vorgänger übrig ist. Vielleicht lässt sich hier etwas Wertvolles finden.

items.honeypot.name=Honigtopf
items.honeypot.ac_shatter=ZERSCHMETTERN
items.honeypot.desc=Dieser Honigtopf ist kaum mit Honig gefüllt, stattdessen lebt dort eine gigantische Biene! Diese Art von riesigen Bienen bleibt eigentlich in ihrem Nest, vielleicht ist dieser Topf ja ein spezielles Gefängnis eines Imkers? Die Biene wirkt jedenfalls entspannt und gibt ein warnendes Surren von sich, wenn du in ihren Topf schaust.
items.honeypot$shatteredpot.name=zerbrochener Honigtopf
items.honeypot$shatteredpot.desc=Dieser Topf ist zerschmettert worden und nur der klebrige Honig hält die Bruchstücke zusammen, welche langsam auseinanderfallen.\n\nAuch wenn der Topf zerschmettert ist, scheint die Biene weiterhin den Topf zu verteidigen.

items.item.prompt=Wähle die Wurfrichtung
items.item.ac_drop=FALLEN LASSEN
items.item.ac_throw=WERFEN
items.item.rankings_desc=Getötet von: %s
items.item.curse=Fluch
items.item.custom_note_type=Dieser Gegenstands-Typ hat eine persönliche Notiz: "_%s_"
items.item.custom_note=Dieser Gegenstand hat eine persönliche Notiz: "_%s_"
items.item.discover_hint=Du kannst diesen Gegenstand zufällig im Dungeon finden.

items.kindofmisc.unequip_title=Ein Ausrüstungsteil ablegen
items.kindofmisc.unequip_message=Du musst erst einen dieser Gegenstände ablegen. Wähle einen Gegenstand, mit dem du tauschen möchtest.

items.kindofweapon.swift_equip=Du rüstest deine Waffe blitzschnell aus.
items.kindofweapon.equip_cursed=Dein Griff verfestigt sich unfreiwillig um die Waffe.
items.kindofweapon.which_equip_msg=In welcher Waffenhand möchtest du diesen Gegenstand ausrüsten?\n\nDie Meisterin führt direkte Angriffe mit ihrer Primärwaffe aus, kann aber die Fähigkeiten beider Waffen benutzen. Die beiden Waffen teilen sich die Zahl der Ladungen.\n\nDie Meisterin kann ebenso augenblicklich Primär- und Sekundärwaffe tauschen.
items.kindofweapon.which_equip_primary=Primär (%s)
items.kindofweapon.which_equip_secondary=Sekundär (%s)
items.kindofweapon.empty=leer

items.kingscrown.name=Krone des Zwergenkönigs
items.kingscrown.ac_wear=TRAGEN
items.kingscrown.naked=Unglücklicherweise kann die Krone deine Unterwäsche nicht verwandeln.
items.kingscrown.upgraded=Die Krone leuchtet hell und löst sich auf, während sich deine Rüstung verwandelt!
items.kingscrown.ratgraded=Die Pfoten des Rattenkönigs leuchten, während sich deine Rüstung verwandelt.
items.kingscrown.desc=Die Krone des letzten Zwergenkönigs strahlt eine ungeheure, magische Energie aus.\n\nWenn du die Krone aufsetzt, fließt die Magie der Krone in die Rüstung, die du gerade trägst und verwandelt sie in eine _einzigartige epische Rüstung mit besonderen Fähigkeiten._ Die neue Rüstung behält alle Eigenschaften der ursprünglichen Rüstung.
items.kingscrown.discover_hint=Dieser Gegenstand wird von bestimmten Gegnern fallengelassen.

items.liquidmetal.name=Flüssigmetall
items.liquidmetal.ac_apply=ANWENDEN
items.liquidmetal.prompt=Wähle eine Wurfwaffe
items.liquidmetal.already_fixed=Diese Wurfwaffe befindet sich schon in perfektem Zustand!
items.liquidmetal.apply=Du benutzt %d Flüssigmetall, um deine Wurfwaffe zu reparieren.
items.liquidmetal.desc=Diese magische Flüssigkeit kann durch Gebrauch entstandene Risse und Brüche einer Wurfwaffe ausbessern und sie so wieder in einen makellosen Zustand versetzen! Wenn einem Satz Waffen ein Exemplar fehlt, es ansonsten aber vollständig repariert ist, kann dieses flüssige Metall sogar dazu verwendet werden, die fehlende Waffe in dem Satz zu ersetzen!\n\nEine Waffe der Stufe 1 benötigt 10 Einheiten Flüssigmetall, um vollständig repariert zu werden, eine Waffe der Stufe 5 benötigt 30. Mit jeder Verbesserung erhöht sich auch die benötigte Menge an Metall um 35%.\n\nFlüssigmetall kann nicht dazu verwendet werden, die Spitzen von präparierten Wurfpfeilen aufzufrischen.
items.liquidmetal.discover_hint=Du kannst diesen Gegenstand mit Alchemie herstellen.

items.lostbackpack.name=verlorener Rucksack
items.lostbackpack.desc=Dies ist dein verlorenes Inventar. Sammle es ein, um alle verlorenen Gegenstände wiederzubekommen!

items.merchantsbeacon.name=Händler-Ortungsgerät
items.merchantsbeacon.ac_use=VERWENDEN
items.merchantsbeacon.desc=Dieses alte Stück Zwergen-Technologie erlaubt es dir, über weite Distanzen zu kommunizieren.\n\nNachdem es aktiviert worden ist, erlaubt dir dieses Ortungsgerät, deine Gegenstände an den Pixel-Markt zu verkaufen, egal, wo du dich im Dungeon befindest.\n\nJedoch wirkt die Magie, die in diesem Ortungsgerät innewohnt, nur ein einziges Mal. Nutze es weise.

items.stylus.name=arkaner Gravierstift
items.stylus.ac_inscribe=EINGRAVIEREN
items.stylus.prompt=Wähle eine Rüstung
items.stylus.identify=Du musst erst bestimmen, ob diese Rüstung verflucht ist.
items.stylus.cursed=Die Magie dieses Gravierstifts wird nicht auf einer verfluchten Rüstung funktionieren.
items.stylus.inscribed=Du hast deine Rüstung mit dem Gravierstift beschriftet.
items.stylus.desc=Dieser arkane Gravierstift besteht aus einem dunklen und harten Stein. Wenn du ihn verwendest, kannst du deine Rüstung mit einer magischen Glyphe beschreiben, doch du hast keinen Einfluss darauf, welche Glyphe gewählt wird. Der Stift entscheidet dies für dich.

items.tengusmask.name=Tengus Maske
items.tengusmask.ac_wear=TRAGEN
items.tengusmask.used=Die Maske löst sich auf, während ihre Kraft in dich strömt!
items.tengusmask.desc=Diese Maske fiel von Tengus Gesicht, als er starb; du spürst, dass eine starke magische Macht von ihr ausgeht. War die Maske die Quelle von Tengus Kraft?\n\nWenn du die Maske aufsetzt, wird die enorme Macht der Maske auf dich übertragen, so dass du _eine Unterklasse für deinen Helden wählen kannst._\n\nWelche Unterklasse möchtest du auswählen?
items.tengusmask.discover_hint=Dieser Gegenstand wird von bestimmten Gegnern fallengelassen.

items.torch.name=Fackel
items.torch.ac_light=ENTZÜNDEN
items.torch.desc=Eines der wichtigsten Werkzeuge eines Abenteuers. Wenn einem Dungeon sämtliches Licht fehlt, kann eine Fackel helfen, den Weg zu erleuchten.

items.waterskin.name=Wasserschlauch
items.waterskin.ac_drink=TRINKEN
items.waterskin.collected=Du sammelst einen Tautropfen in deinen Wasserschlauch.
items.waterskin.full=Dein Wasserschlauch ist voll!
items.waterskin.empty=Dein Wasserschlauch ist leer!
items.waterskin.desc=Ein Behälter für Flüssigkeiten, gemacht aus Leder und einem Strick, verschlossen mit einem Korken.
items.waterskin.desc_water=Momentan ist im Wasserschlauch nur ein wenig Trinkwasser. Sicherlich gibt es im Dungeon etwas, das stattdessen im Wasserschlauch aufbewahrt werden kann.
items.waterskin.desc_heal=Der Wasserschlauch wird momentan dazu genutzt, heilendes Wasser zu speichern. Je voller der Wasserschlauch ist, desto mehr wirst du sofort geheilt, wenn du daraus trinkst. Du trinkst nur so viel, wie du brauchst.
items.waterskin.desc_full=Der volle Wasserschlauch scheint Energie auszustrahlen. Möglicherweise kann er benutzt werden, um einen anderen fürs Überleben wichtigen Gegenstand zu segnen?
items.waterskin.discover_hint=Einer der Helden startet mit diesem Gegenstand.

