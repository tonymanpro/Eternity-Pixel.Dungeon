###armor curses
items.armor.curses.antientropy.name=%s анти-энтропии
items.armor.curses.antientropy.desc=Проклятие анти-энтропии работает против законов вселенной, втягивая энергию в носителя из его окружения. Оно слегка поджигает носителя, но замораживает все вокруг!

items.armor.curses.bulk.name=%s неповоротливости
items.armor.curses.bulk.desc=Доспех неповоротливости может и выглядит больше и внушительнее обычного, но защищает вовсе не лучше. Куда хуже, больший размер сильно мешает проходить через двери.

items.armor.curses.corrosion.name=%s коррозии
items.armor.curses.corrosion.desc=Из доспехов коррозии выделяется едкая жидкость и всё вокруг покрывается липкой кислотой.

items.armor.curses.displacement.name=%s телепортации
items.armor.curses.displacement.desc=Проклятие телепортации пытается защитить своего владельца от опасности, перенося его на новое место при получении повреждений. Впрочем, его эффект является скорее помехой, потому что способен телепортировать владельца по всему уровню.

items.armor.curses.metabolism.name=%s метаболизма
items.armor.curses.metabolism.desc=Проклятие метаболизма ускоряет работу организма своего владельца, ускоряя как скорость регенерации, так и скорость истощения.

items.armor.curses.multiplicity.name=%s копирования
items.armor.curses.multiplicity.desc=Доспех, на который наложено проклятие копирования, способен доставить немало проблем. Иногда удар по такому доспеху создаст копию владельца, но с таким же успехом он может создать и копию атакующего!

items.armor.curses.overgrowth.name=%s цветения
items.armor.curses.overgrowth.desc=Доспех цветения покрыт различными растениями. Хоть это и выглядит красиво, но никак не улучшает защиту, а в бою эти растения будут активироваться в случайном порядке!

items.armor.curses.stench.name=%s зловония
items.armor.curses.stench.desc=Доспех, на который наложено проклятие зловония, способен испускать облака ядовитого газа, опасного как для владельца, так и для всех, кто окажется рядом.


###glyphs
items.armor.glyphs.affection.name=%s очарования
items.armor.glyphs.affection.desc=Эта могущественная руна способна подчинить разум атакующего, временно очаровывая его.

items.armor.glyphs.antimagic.name=%s антимагии
items.armor.glyphs.antimagic.desc=Эта могущественная руна позволяет доспеху защищать своего носителя от магических атак. Количество поглощаемого урона не зависит от уровня редкости доспеха.

items.armor.glyphs.brimstone.name=%s жара
items.armor.glyphs.brimstone.desc=Эта руна защищает носителя и его вещи от языков пламени, давая полную неуязвимость к огню.

items.armor.glyphs.camouflage.name=%s маскировки
items.armor.glyphs.camouflage.desc=Эта руна позволяет своему владельцу становится незаметным на фоне высокой травы, даруя ему кратковременную невидимость.

items.armor.glyphs.entanglement.name=%s опутывания
items.armor.glyphs.entanglement.desc=Эта руна наращивает земляную броню вокруг носителя, поглощая урон, но такая броня разрушится, если носитель сдвинется с места.

items.armor.glyphs.flow.name=%s амфибии
items.armor.glyphs.flow.desc=Эта руна манипулирует течением воды вокруг владельца, значительно увеличивая его скорость передвижения в воде.

items.armor.glyphs.obfuscation.name=%s темноты
items.armor.glyphs.obfuscation.desc=Доспех, на который нанесена эта руна, размывает очертания владельца, делая его менее заметным.

items.armor.glyphs.potential.name=%s напряжения
items.armor.glyphs.potential.desc=Эта руна накапливает энергию при попадании по ней, заряжая палочки носителя при активации.

items.armor.glyphs.repulsion.name=%s отталкивания
items.armor.glyphs.repulsion.desc=Эта руна способна отразить силу удара в сторону атакующего, отталкивая его назад.

items.armor.glyphs.stone.name=%s гранита
items.armor.glyphs.stone.desc=Эта руна покрывает доспех толстым слоем камня, что делает уклонение невозможным, но увеличивает защиту пропорционально уклонению.

items.armor.glyphs.swiftness.name=%s скорости
items.armor.glyphs.swiftness.desc=Эта руна увеличивает скорость владельца, но только, пока вблизи нет врага.

items.armor.glyphs.thorns.name=%s шипов
items.armor.glyphs.thorns.desc=Эта могущественная руна вызывает кровотечение у тех, кто посмел поднять руку на владельца.

items.armor.glyphs.viscosity.name=%s вязкости
items.armor.glyphs.viscosity.deferred=отложено %d
items.armor.glyphs.viscosity$defereddamage.name=отложенный урон
items.armor.glyphs.viscosity$defereddamage.ondeath=Вы погибли от отложенного урона...
items.armor.glyphs.viscosity$defereddamage.rankings_desc=Погиб от отложенного урона
items.armor.glyphs.viscosity$defereddamage.desc=Урон наносится постепенно, вместо того, чтобы наноситься сразу.\n\nОсталось ходов с отложенным уроном: %d.
items.armor.glyphs.viscosity.desc=Руна способна накапливать получаемый носителем урон, отдавая его со временем, а не весь сразу.



###armor
items.armor.armor.ac_detach=ОТКРЕПИТЬ
items.armor.armor.detach_seal=Вы открепили печать от брони.
items.armor.armor.equip_cursed=Броня больно сжимает ваше тело.
items.armor.armor.identify=Вы использовали ваш доспех достаточно долго для того, чтобы опознать его.
items.armor.armor.hardening_gone=Закалка на этой броне стерлась!
items.armor.armor.incompatible=Взаимодействие разных типов магии стерло руну с этой брони!
items.armor.armor.curr_absorb=Эта броня _%1$d-го уровня_ поглощает _%2$d-%3$d урона_ за удар и требует _%4$d очков силы_ для комфортного использования.
items.armor.armor.avg_absorb=Как правило, такая броня _%1$d-го уровня_ поглощает _%2$d-%3$d урона_ за удар и требует _%4$d очков силы_ для комфортного использования.
items.armor.armor.too_heavy=Вы недостаточно сильны для того, чтобы носить эту броню, поэтому в ней ваша защита, уклонение и скорость передвижения будут понижены.
items.armor.armor.probably_too_heavy=Вероятно, эта броня будет слишком тяжела для вас.
items.armor.armor.excess_str=Благодаря избыточной силе вы _лучше уклоняетесь_ в этой броне.
items.armor.armor.evasion=Этот доспех сбалансирован, чтобы увеличивать _уклонение._
items.armor.armor.defense=Этот доспех сбалансирован, чтобы увеличивать _защиту._
items.armor.armor.inscribed=носит начертание _%s._
items.armor.armor.glyph_hardened=Подверглось _закалке_.
items.armor.armor.hardened_no_glyph=Эта броня прошла _закалку,_ но сейчас на ней не начертана руна.
items.armor.armor.cursed_worn=Ваша броня проклята, и вы не в силах снять её.
items.armor.armor.cursed=Вы чувствуете недобрую магию, таящуюся в этой броне.
items.armor.armor.weak_cursed=Даже несмотря на то, что броня проклята, вы можете снять её.
items.armor.armor.not_cursed=Эта броня не проклята.
items.armor.armor.seal_attached=Сломанная печать Воина прикреплена к этой броне. Когда он будет ранен ниже половины здоровья, она даст ему _%d щита_.
items.armor.armor.seal_transfer=Сломанная печать Воина должна быть прикреплена к его доспехам, которые он носит в данный момент, чтобы принести ему пользу. Хотите ли вы автоматически снять печать с доспехов, которые вы снимаете, и прикрепить ее к доспехам, которые вы экипируете?
items.armor.armor.seal_transfer_yes=Да
items.armor.armor.seal_transfer_no=Нет
items.armor.armor$glyph.glyph=руны
items.armor.armor$glyph.killed=%s убила вас...
items.armor.armor$glyph.rankings_desc=Убит руной
items.armor.armor$glyph.discover_hint=Вы можете случайно найти предмет с этим эффектом в подземелье или попытаться самому нанести его на предмет.

items.armor.classarmor.ac_ability=ВЫБЕРИТЕ СПОСОБНОСТЬ
items.armor.classarmor.ac_transfer=ПЕРЕНОС
items.armor.classarmor.no_ability=Ваша броня не имеет способности в данный момент, вы можете выбрать одну из них!
items.armor.classarmor.not_equipped=Вам надо надеть эту броню, чтобы использовать даруемые ей способности!
items.armor.classarmor.low_charge=У брони недостаточно заряда, чтобы использовать ее особые способности!
items.armor.classarmor.charge_use=Применяя способность сейчас, вы потратите _%s_ заряда.
items.armor.classarmor.transfer_title=Перенести Броню
items.armor.classarmor.transfer_desc=Магия короны короля дворфов может быть перенесена на другую броню. Заметьте, что прошлая броня будет уничтожена в процессе.
items.armor.classarmor.transfer_prompt=Выберете Броню
items.armor.classarmor.transfer_cancel=Отменить
items.armor.classarmor.transfer_complete=Свойства вашей героической брони были перенесены!
items.armor.classarmor.discover_hint=Вы можете найти этот предмет после победы над боссом 20 этажа определённым героем.

items.armor.clericarmor.name=облачение героя
items.armor.clericarmor.desc=Носив эту смесь ткани и доспехов, Клирик может использовать особую способность.

items.armor.clotharmor.name=тканая броня
items.armor.clotharmor.desc=Эта легкая броня обеспечивает минимальную защиту. Лучше, чем ничего.
items.armor.clotharmor.discover_hint=Один из героев начинает с этим предметом.

items.armor.duelistarmor.name=нагрудник героя
items.armor.duelistarmor.desc=Пока надеты эти броня и плащ, Дуэлянт может использовать особую способность.

items.armor.huntressarmor.name=плащ героя
items.armor.huntressarmor.no_enemies=Нет врагов в поле зрения
items.armor.huntressarmor.desc=Пока Охотница носит этот плащ, она может использовать особую способность.

items.armor.leatherarmor.name=кожаная броня
items.armor.leatherarmor.desc=Броня из выделанной шкуры какого-то животного. Она не так легка, как тканевая, но зато обеспечивает большую защиту.

items.armor.magearmor.name=мантия героя
items.armor.magearmor.desc=В этом великолепном одеянии Маг может использовать особую способность.

items.armor.mailarmor.name=кольчужная броня
items.armor.mailarmor.desc=Переплетенные металлические кольца позволяют сочетать хорошую защиту с достаточной гибкостью.

items.armor.platearmor.name=латная броня
items.armor.platearmor.desc=Эти толстые металлические пластины, скрепленные в один доспех, способны обеспечить несравнимую защиту тому, кто в силах вынести их невероятную тяжесть.

items.armor.roguearmor.name=одежда героя
items.armor.roguearmor.desc=Надевая это темное одеяние, Разбойник может использовать особую способность.

items.armor.scalearmor.name=пластинчатая броня
items.armor.scalearmor.desc=Вшитые в кожаный жилет железные полоски создают гибкую, но надежную броню.

items.armor.warriorarmor.name=латная броня героя
items.armor.warriorarmor.desc=Пока надеты тяжёлые латные доспехи, Воин может использовать особую способность.



###artifacts
items.artifacts.alchemiststoolkit.name=набор алхимика
items.artifacts.alchemiststoolkit.ac_brew=СВАРИТЬ
items.artifacts.alchemiststoolkit.ac_energize=РАЗЛОЖИТЬ
items.artifacts.alchemiststoolkit.not_ready=Ваш набор алхимика ещё не разогрелся.
items.artifacts.alchemiststoolkit.cursed=Проклятый набор алхимика препятствует использованию алхимии!
items.artifacts.alchemiststoolkit.need_energy=Нужно как минимум 6 энергии.
items.artifacts.alchemiststoolkit.energize_desc=Каждые 6 энергетических кристаллов повышают уровень набора, что позволяет ему нагреваться быстрее.\n\nСколько кристаллов вы хотите потратить?
items.artifacts.alchemiststoolkit.energize_1=6 кристаллов: +1 уровень
items.artifacts.alchemiststoolkit.energize_all=%1$d кристаллов: +%2$d уровней
items.artifacts.alchemiststoolkit.desc=Этот набор содержит реагенты, растения и маленький сосуд для смешивания, что позволяет заниматься алхимией в любом месте. Сосуд содержит что-то наподобие энергетических кристаллов, но в жидкой форме.
items.artifacts.alchemiststoolkit.desc_cursed=Проклятый набор не позволит выпустить себя из рук. Его влияние препятствует использованию алхимии.
items.artifacts.alchemiststoolkit.desc_warming=Набор разогревается и через некоторое время будет готов к использованию.
items.artifacts.alchemiststoolkit.desc_hint=Экипированный набор понемногу создает алхимическую энергию, когда вы зарабатываете опыт. Может быть, получится улучшить его при помощи твёрдых кристаллов?

items.artifacts.artifact.cannot_wear_two=Вы не можете использовать два одинаковых артефакта.
items.artifacts.artifact.equip_cursed=Артефакт больно впивается в ваше тело.
items.artifacts.artifact.curse_known=Вы чувствуете недобрую магию, таящуюся в этом артефакте.
items.artifacts.artifact.not_cursed=Этот артефакт не проклят.
items.artifacts.artifact.need_to_equip=Вам необходимо надеть артефакт, чтобы его использовать.

items.artifacts.capeofthorns.name=шипастый плащ
items.artifacts.capeofthorns.desc=Груда металлических листов, оставшихся от DM-300, собралась в грубый плащ. В нём таится какая-то энергия, быть может, часть сил DM-300?
items.artifacts.capeofthorns.desc_inactive=Тяжесть плаща успокаивает вас. Похоже, он питается энергией от полученных вами ударов.
items.artifacts.capeofthorns.desc_active=Плащ излучает накопленную энергию, защищая владельца.
items.artifacts.capeofthorns$thorns.inert=Ваш Плащ вернулся в нормальное состояние.
items.artifacts.capeofthorns$thorns.radiating=Ваш Плащ начал излучать энергию, которая защищает вас!
items.artifacts.capeofthorns$thorns.levelup=Ваш Плащ стал сильнее!
items.artifacts.capeofthorns$thorns.name=шипы
items.artifacts.capeofthorns$thorns.desc=Ваш плащ излучает энергию, окружая вас отражающим полем!\n\nВо время действия эффекта весь получаемый урон снижен. К тому же, если атакующий стоит рядом с вами, он получит обратно отражённый урон.\n\nХодов осталось: %s.

items.artifacts.chaliceofblood.name=кровавая чаша
items.artifacts.chaliceofblood.ac_prick=УКОЛОТЬСЯ
items.artifacts.chaliceofblood.yes=Да, я знаю, что я делаю
items.artifacts.chaliceofblood.no=Нет, я передумал
items.artifacts.chaliceofblood.prick_warn=С каждым использованием чаши, она истощает все больше ваших жизненных сил, но взамен дарует ускоренную регенерацию здоровья.\n\nЧаша нанесет _%1$d-%2$d урона_ при уколе, хотя урон может быть уменьшен как _физическим, так и магическим блоком, или уменьшением урона._ Без учета уменьшающих урон эффектов, укол, на текущий момент, имеет _шанс в %3$s%%_ истощить ваши жизненные силы полностью. \n\nВы уверены, что хотите предложить чаше больше своих жизненных сил?
items.artifacts.chaliceofblood.onprick=Вы роняете каплю своей крови в чашу, отдавая ей часть своей жизненной энергии.
items.artifacts.chaliceofblood.ondeath=Чаша осушила вас до конца...
items.artifacts.chaliceofblood.desc=Блестящая серебряная чаша с острыми кристаллами на кромке.
items.artifacts.chaliceofblood.desc_cursed=Эта чаша проклята и не позволит выпустить себя из рук. Её влияние замедляет естественное заживление ран.
items.artifacts.chaliceofblood.desc_1=Держа чашу в руках, вы чувствуете странное желание уколоть себя этими острыми кристаллами.
items.artifacts.chaliceofblood.desc_2=Часть вашей крови собралась в чаше, едва заметно можно почувствовать, как чаша питает вас жизненной силой, увеличивая естественную регенерацию здоровья. Вы все еще хотите пустить больше крови в чашу, хотя вы знаете, что это будет больно.
items.artifacts.chaliceofblood.desc_3=Чаша до краёв наполнена вашей энергией. Вы чувствуете, как она возвращает её вам.

items.artifacts.cloakofshadows.name=плащ теней
items.artifacts.cloakofshadows.ac_stealth=УКРЫТЬСЯ
items.artifacts.cloakofshadows.cooldown=Плащу требуется ещё %d ходов для перезарядки.
items.artifacts.cloakofshadows.cursed=Вы не можете использовать проклятый плащ.
items.artifacts.cloakofshadows.no_charge=Ваш плащ недостаточно заряжен, чтобы его можно было использовать.
items.artifacts.cloakofshadows.desc=Бесценный волшебный плащ, много лет назад украденный Разбойником из королевской оружейной. Носящий плащ может на короткое время становиться невидимым.\n\nЧем больше плащ используется. тем сильнее он становится, позволяя Разбойнику становиться невидимым чаще и на больший срок.
items.artifacts.cloakofshadows.discover_hint=Один из героев начинает с этим предметом.
items.artifacts.cloakofshadows$cloakstealth.no_charge=Ваш плащ полностью разрядился.
items.artifacts.cloakofshadows$cloakstealth.levelup=Ваш плащ стал сильнее!
items.artifacts.cloakofshadows$cloakstealth.name=маскировка
items.artifacts.cloakofshadows$cloakstealth.desc=Укрывшись под плащом теней, вы получили временную невидимость. Вы останетесь скрыты, пока не отмените эффект или у плаща не иссякнет энергия.\n\nВ этом состоянии враги не атакуют и не преследуют вас. Атака или использование магии (например, свитка или палочки) немедленно рассеет невидимость.\n\nХодов осталось: %d.

items.artifacts.driedrose.name=засохшая роза
items.artifacts.driedrose.ac_summon=ПРИЗВАТЬ
items.artifacts.driedrose.ac_direct=НАПРАВИТЬ
items.artifacts.driedrose.ac_outfit=СНАРЯДИТЬ
items.artifacts.driedrose.spawned=Вы уже призвали призрака.
items.artifacts.driedrose.no_charge=Ваша роза ещё не заряжена.
items.artifacts.driedrose.cursed=Вы не можете использовать проклятую розу.
items.artifacts.driedrose.no_space=Рядом с вами нет свободного места.
items.artifacts.driedrose.charged=Ваша роза полностью заряжена!
items.artifacts.driedrose.desc=Не та ли это роза, о которой упоминал тот призрак перед тем как исчезнуть? Кажется, в ней есть какая-то духовная сила. Возможно, с её помощью можно призвать дух того погибшего воина...
items.artifacts.driedrose.desc_no_quest=Старая засохшая роза, которая каким-то образом уцелела через столько лет.\n\nВы чувствуете, что в ней теплится какая-то сила, однако понятия не имеете, как эту силу использовать.
items.artifacts.driedrose.desc_hint=Не хватает нескольких лепестков. Наверное, роза станет могущественнее, если их вернуть.
items.artifacts.driedrose.desc_cursed=Проклятая роза оплетает вашу руку. От неё сильно веет холодом.
items.artifacts.driedrose.desc_weapon=Оружие призрака: %s
items.artifacts.driedrose.desc_armor=Броня призрака: %s
items.artifacts.driedrose.desc_strength=Сила призрака: %s
items.artifacts.driedrose$petal.name=засохший лепесток
items.artifacts.driedrose$petal.no_rose=У вас нет розы, к которой можно прикрепить этот лепесток.
items.artifacts.driedrose$petal.no_room=Для этого лепестка не осталось места, вы его выбрасываете.
items.artifacts.driedrose$petal.maxlevel=Теперь все лепестки на месте!
items.artifacts.driedrose$petal.levelup=Вы прикрепляете лепесток к розе.
items.artifacts.driedrose$petal.desc=Хрупкий высушенный лепесток. Как он оказался здесь в целости и сохранности?
items.artifacts.driedrose$wndghosthero.title=Экипировка призрака
items.artifacts.driedrose$wndghosthero.desc=Призрак не особенно силен сам по себе, но он достаточно осязаем, чтобы носить оружие и доспехи. Он сможет использовать их точно так же, как и вы.\n\nВ данный момент призрак может экипировать вещи, требующие не более _%d ед. силы._
items.artifacts.driedrose$wndghosthero.weapon_prompt=Выберите оружие
items.artifacts.driedrose$wndghosthero.armor_prompt=Выберите доспехи
items.artifacts.driedrose$wndghosthero.cant_unique=Призрак не способен использовать уникальные предметы.
items.artifacts.driedrose$wndghosthero.cant_cursed=Призрак может использовать только ту экипировку, которая, вы уверены, не проклята.
items.artifacts.driedrose$wndghosthero.cant_strength_unknown=Призрак может быть слишком слаб для того, чтобы это использовать.
items.artifacts.driedrose$wndghosthero.cant_strength=Призрак слишком слаб для того, чтобы это использовать.

##ghost hero
items.artifacts.driedrose$ghosthero.name=печальный призрак
items.artifacts.driedrose$ghosthero.def_verb=уклоняется
items.artifacts.driedrose$ghosthero.discover_hint=Вы можете найти этого персонажа с помощью определённого артефакта.

items.artifacts.driedrose$ghosthero.hello=И снова здравствуй, %s.
items.artifacts.driedrose$ghosthero.introduce=Мой дух связан с этой розой. Она была очень дорога мне - это подарок от очень важного для меня человека, чью любовь я оставил на поверхности.\n\nЯ не могу к нему вернуться, но благодаря тебе у меня появился второй шанс завершить свой путь. Я отвечу на твой зов и буду биться за тебя, когда смогу.\n\nПока роза у тебя, я могу слышать твой голос, таким образом ты можешь использовать её, чтобы направить меня издалека.\n\nНадеюсь, ты справишься там, где не справился я...

items.artifacts.driedrose$ghosthero.dialogue_sewers_1=Эти канализации когда-то были безопасны, люди даже жили тут во время зимы.
items.artifacts.driedrose$ghosthero.dialogue_sewers_2=Интересно, что случилось с теми, кто патрулировал это место?
items.artifacts.driedrose$ghosthero.dialogue_sewers_3=У меня была семья на поверхности. Я надеюсь, что они в безопасности.
items.artifacts.driedrose$ghosthero.dialogue_sewers_4=Стражники не смогли одолеть этих монстров... Но, может, это сможем мы.
items.artifacts.driedrose$ghosthero.dialogue_sewers_5=Если даже канализация настолько опасна, боюсь представить, что творится ниже...
items.artifacts.driedrose$ghosthero.dialogue_sewers_6=Что заставило этих крыс и крабов вырасти до таких размеров?
items.artifacts.driedrose$ghosthero.dialogue_prison_1=Я слышал разные истории об этом месте, но ни одной хорошей.
items.artifacts.driedrose$ghosthero.dialogue_prison_2=Это место всегда было скорее лабиринтом, чем тюрьмой.
items.artifacts.driedrose$ghosthero.dialogue_prison_3=Боюсь даже представить, что тут началось, когда это место объявили заброшенным.
items.artifacts.driedrose$ghosthero.dialogue_prison_4=Похоже на то, что и заключенные, и стражники превратились в монстров.
items.artifacts.driedrose$ghosthero.dialogue_prison_5=Что же могло вернуть этих мертвецов к жизни?
items.artifacts.driedrose$ghosthero.dialogue_prison_6=Эти люди не должны были закончить вот так...
items.artifacts.driedrose$ghosthero.dialogue_caves_1=Здесь не было ни людей, ни дворфов в течении очень долгого времени.
items.artifacts.driedrose$ghosthero.dialogue_caves_2=Что могло заставить дворфов покинуть золотые рудники?
items.artifacts.driedrose$ghosthero.dialogue_caves_3=Жалко, что всё золото здесь будет бесполезным на поверхности.
items.artifacts.driedrose$ghosthero.dialogue_caves_4=Существа в этих пещерах мутировали, прямо как в канализации.
items.artifacts.driedrose$ghosthero.dialogue_caves_5=Даже летучие мыши здесь стали кровожадными.
items.artifacts.driedrose$ghosthero.dialogue_caves_6=Ни следа горного оборудования, неужели дворфы все разворовали?
items.artifacts.driedrose$ghosthero.dialogue_city_1=Дворфы были трудолюбивыми, но жадными.
items.artifacts.driedrose$ghosthero.dialogue_city_2=Значит, столица дворфов действительно пала.
items.artifacts.driedrose$ghosthero.dialogue_city_3=Надеюсь, что город наверху никогда таким не станет.
items.artifacts.driedrose$ghosthero.dialogue_city_4=Дворфы не должны выглядеть настолько бледными.
items.artifacts.driedrose$ghosthero.dialogue_city_5=Я не знаю, что хуже - дворфы или их творения.
items.artifacts.driedrose$ghosthero.dialogue_city_6=Похоже, дворфы сейчас такие же безмозглые монстры.
items.artifacts.driedrose$ghosthero.dialogue_halls_1=Что это за место?
items.artifacts.driedrose$ghosthero.dialogue_halls_2=Это место вызывает ужас...
items.artifacts.driedrose$ghosthero.dialogue_halls_3=О чём думали дворфы, играясь с такой силой?
items.artifacts.driedrose$ghosthero.dialogue_halls_4=Монстры здесь будто не из нашего мира, откуда они взялись?
items.artifacts.driedrose$ghosthero.dialogue_halls_5=Ты чувствуешь это? За нами будто что-то наблюдает.
items.artifacts.driedrose$ghosthero.dialogue_halls_6=Слава богу, здесь есть факелы, тут так темно!
items.artifacts.driedrose$ghosthero.dialogue_ascension_1=Почему это происходит, я думал, у нас все получилось?
items.artifacts.driedrose$ghosthero.dialogue_ascension_2=Каким образом эта штука все еще способна влиять на этот мир?
items.artifacts.driedrose$ghosthero.dialogue_ascension_3=Надеюсь, вы знаете, что нужно сделать с этим амулетом.
items.artifacts.driedrose$ghosthero.dialogue_ascension_4=Полагаю, мы еще не закончили путешествие.
items.artifacts.driedrose$ghosthero.dialogue_ascension_5=Мы уже зашли так далеко, мы сможем довести это до конца!
items.artifacts.driedrose$ghosthero.dialogue_ascension_6=Еще чуть-чуть, и мы сможем выбраться отсюда!

items.artifacts.driedrose$ghosthero.seen_goo_1=Остерегайся Слизня!
items.artifacts.driedrose$ghosthero.seen_goo_2=Много моих друзей погибло от этой твари, настало время отмщения!
items.artifacts.driedrose$ghosthero.seen_goo_3=Нельзя позволить такой мерзости жить!
items.artifacts.driedrose$ghosthero.seen_tengu_1=Единственный оставшийся заключенный - смертельный убийца. Ну конечно...
items.artifacts.driedrose$ghosthero.seen_tengu_2=Мы в ловушке!
items.artifacts.driedrose$ghosthero.seen_tengu_3=Я слышал ужасные истории об этой маске...
items.artifacts.driedrose$ghosthero.seen_dm300_1=Только дворфы могли создать шахтерскую машину и оставить её убивать незваных гостей.
items.artifacts.driedrose$ghosthero.seen_dm300_2=Эта штука огромна...
items.artifacts.driedrose$ghosthero.seen_dm300_3=Как эта штука оставалась активной так долго?
items.artifacts.driedrose$ghosthero.seen_king_1=Когда люди говорят, что власть развращает, это именно то, что они имеют в виду.
items.artifacts.driedrose$ghosthero.seen_king_2=Теперь он больше лич, чем король.
items.artifacts.driedrose$ghosthero.seen_king_3=Даже после смерти дворфы подчиняются своему хозяину.
items.artifacts.driedrose$ghosthero.seen_yog_1=Ох, это не выглядит хорошо.
items.artifacts.driedrose$ghosthero.seen_yog_2=Так вот как выглядит бог?
items.artifacts.driedrose$ghosthero.seen_yog_3=Это будет больно...

items.artifacts.driedrose$ghosthero.defeated_by_enemy_1=Удачи...
items.artifacts.driedrose$ghosthero.defeated_by_enemy_2=Устал...пока что...
items.artifacts.driedrose$ghosthero.defeated_by_enemy_3=Я вернусь...
items.artifacts.driedrose$ghosthero.defeated_by_boss_1=Прости... удачи...
items.artifacts.driedrose$ghosthero.defeated_by_boss_2=Прикончи это... без меня...
items.artifacts.driedrose$ghosthero.defeated_by_boss_3=Нет... Я не могу...
items.artifacts.driedrose$ghosthero.blessed_ankh_1=Как ты пережил это?
items.artifacts.driedrose$ghosthero.blessed_ankh_2=Хотел бы я себе такой...
items.artifacts.driedrose$ghosthero.blessed_ankh_3=Боже мой! Ты еще жив!
items.artifacts.driedrose$ghosthero.player_killed_1=Нет!...
items.artifacts.driedrose$ghosthero.player_killed_2=Я не смог ничем помочь...
items.artifacts.driedrose$ghosthero.player_killed_3=Только не это...

items.artifacts.driedrose$ghosthero.direct_prompt=Что мне делать?
items.artifacts.driedrose$ghosthero.directed_follow_1=Хорошо, я пойду за тобой.
items.artifacts.driedrose$ghosthero.directed_follow_2=Я буду рядом.
items.artifacts.driedrose$ghosthero.directed_follow_3=Следую за тобой...
items.artifacts.driedrose$ghosthero.directed_follow_4=Хорошо, идем!
items.artifacts.driedrose$ghosthero.directed_follow_5=Я тебя прикрою.
items.artifacts.driedrose$ghosthero.directed_attack_1=Хорошо, я нападу на него.
items.artifacts.driedrose$ghosthero.directed_attack_2=Я займусь этим.
items.artifacts.driedrose$ghosthero.directed_attack_3=Вступаю в бой...
items.artifacts.driedrose$ghosthero.directed_attack_4=За ними!
items.artifacts.driedrose$ghosthero.directed_attack_5=Положись на меня.
items.artifacts.driedrose$ghosthero.directed_position_1=Хорошо, я займу эту позицию.
items.artifacts.driedrose$ghosthero.directed_position_2=Я пойду туда и буду обороняться.
items.artifacts.driedrose$ghosthero.directed_position_3=Меняю позицию...
items.artifacts.driedrose$ghosthero.directed_position_4=В пути!
items.artifacts.driedrose$ghosthero.directed_position_5=Я пойду туда.

items.artifacts.driedrose$ghosthero.desc=Бесплотная фигура, очертаниями напоминающая истощенного человека. Похоже, её сила зависит от розы, что вы держите в руках.\n\nЭтот призрак, может, и не такой уж могущественный союзник, но он - единственный, кого вы можете назвать своим другом в этом подземелье.

##back to artifacts
items.artifacts.etherealchains.name=призрачные цепи
items.artifacts.etherealchains.ac_cast=КИНУТЬ
items.artifacts.etherealchains.rooted=Цепи не могут вас перенести, пока вы оплетены.
items.artifacts.etherealchains.no_charge=Ваши цепи слишком короткие для этого.
items.artifacts.etherealchains.cursed=Вы не можете использовать проклятые цепи.
items.artifacts.etherealchains.does_nothing=Это бесполезно.
items.artifacts.etherealchains.cant_pull=Ваши цепи не способны притянуть этого врага.
items.artifacts.etherealchains.cant_reach=Ваши цепи сюда не дотянутся.
items.artifacts.etherealchains.inside_wall=Ваши цепи не способны перенести вас внутрь стены.
items.artifacts.etherealchains.nothing_to_grab=Здесь не к чему притянуться.
items.artifacts.etherealchains.prompt=Выберите место или цель.
items.artifacts.etherealchains.desc=Эти толстые, но лёгкие цепи мерцают духовной энергией. Их можно использовать для того, чтобы быстро переместить себя к стене или притянуть кого-то другого поближе. Благодаря призрачной сущности цепей вы сможете даже проходить сквозь стены!
items.artifacts.etherealchains.desc_cursed=Проклятые цепи обмотались вокруг вас, они постоянно раскачиваются, пытаясь свалить вас с ног или зацепиться за что-нибудь.
items.artifacts.etherealchains.desc_equipped=Цепи свисают с вас, медленно поглощая души убитых вами врагов. Каждый заряд - это звено в цепи, способное преодолеть ровно одну клетку.
items.artifacts.etherealchains$chainsrecharge.levelup=Ваши цепи стали длиннее!

items.artifacts.holytome.name=священный том
items.artifacts.holytome.ac_cast=ПРИМЕНИТЬ
items.artifacts.holytome.no_spell=Вы не можете применить это заклинание прямо сейчас.
items.artifacts.holytome.cursed=Вы не можете использовать проклятый том.
items.artifacts.holytome.levelup=Ваш том стал сильнее!
items.artifacts.holytome.desc=Священный том, который служит фокусом для божественной магии Клирика. Использование тома позволяет Клирику накладывать различные магические заклинания.\n\nТом будет постепенно становиться более мощным по мере его использования, увеличивая максимальное количество зарядов и немного ускоряя восстановление зарядов.
items.artifacts.holytome.discover_hint=Один из героев начинает с этим предметом.

items.artifacts.hornofplenty.name=рог изобилия
items.artifacts.hornofplenty.ac_snack=ПЕРЕКУСИТЬ
items.artifacts.hornofplenty.ac_eat=СЪЕСТЬ
items.artifacts.hornofplenty.ac_store=ПОЛОЖИТЬ
items.artifacts.hornofplenty.eat=Вы едите из рога.
items.artifacts.hornofplenty.prompt=Выберите еду
items.artifacts.hornofplenty.no_food=Рог пуст!
items.artifacts.hornofplenty.full=Рог полон еды!
items.artifacts.hornofplenty.reject=Рог отвергает сырой пустофрукт.
items.artifacts.hornofplenty.maxlevel=Рог поглотил всю еду, что мог!
items.artifacts.hornofplenty.levelup=Рог поглощает вашу еду, становясь сильнее!
items.artifacts.hornofplenty.feed=Рог поглощает пожертвованную еду.
items.artifacts.hornofplenty.desc=Подудеть в этот рог не получится, но зато при получении владельцем опыта он постепенно наполняется едой. Можно съесть каждый кусок еды отдельно, а можно и всё сразу.
items.artifacts.hornofplenty.desc_hint=Возможно, рог можно усилить, скормив ему что-нибудь.
items.artifacts.hornofplenty.desc_cursed=Проклятый рог связан с вами, и он скорее будет пожирать еду, нежели производить её.

items.artifacts.lloydsbeacon.name=маяк Ллойда
items.artifacts.lloydsbeacon.ac_zap=ИСПОЛЬЗОВАТЬ
items.artifacts.lloydsbeacon.ac_set=УСТАНОВИТЬ
items.artifacts.lloydsbeacon.ac_return=ВЕРНУТЬСЯ
items.artifacts.lloydsbeacon.no_charge=У маяка недостаточно энергии.
items.artifacts.lloydsbeacon.tele_fail=Телепортация не удалась.
items.artifacts.lloydsbeacon.prompt=Выберите цель.
items.artifacts.lloydsbeacon.levelup=Ваш маяк стал сильнее!
items.artifacts.lloydsbeacon.preventing=Сильная магия этого места не позволяет использовать маяк Ллойда!
items.artifacts.lloydsbeacon.creatures=Аура ближайших существ не позволяет вам использовать маяк Ллойда.
items.artifacts.lloydsbeacon.return=Маяк Ллойда установлен на вашу текущую позицию, вы сможете вернуться сюда в любое время.
items.artifacts.lloydsbeacon.desc=Маяк Ллойда - хитроумное магическое приспособление, позволяющее контролировать телепортацию. Маяк может вернуть вас в установленное место, а если его надеть, то он сможет излучать вспышки телепортирующей магии, которые можно направить на врага, или на себя.
items.artifacts.lloydsbeacon.desc_set=Маяк установлен на %d уровень в Pixel Dungeon.

items.artifacts.masterthievesarmband.name=нарукавник гильдии воров
items.artifacts.masterthievesarmband.ac_steal=УКРАСТЬ
items.artifacts.masterthievesarmband.no_charge=У вашего нарукавника недостаточно заряда.
items.artifacts.masterthievesarmband.cursed=Вы не можете использовать проклятый нарукавник.
items.artifacts.masterthievesarmband.full=Ваш нарукавник полностью заряжен!
items.artifacts.masterthievesarmband.prompt=Выберите врага в качестве цели
items.artifacts.masterthievesarmband.no_target=Вы должны выбрать ближайшего к вам врага.
items.artifacts.masterthievesarmband.steal_shopkeeper=Вы не можете украсть непосредственно у продавца.
items.artifacts.masterthievesarmband.no_steal=У этого врага нечего украсть.
items.artifacts.masterthievesarmband.stole_item=Вы украли предмет: %s.
items.artifacts.masterthievesarmband.failed_steal=Вам не удалось ничего украсть.
items.artifacts.masterthievesarmband.level_up=Ваш нарукавник стал сильнее!
items.artifacts.masterthievesarmband.desc=Этот фиолетовый нарукавник из бархата несёт на себе знак мастера воровского дела. Вам он не принадлежит, равно как и прошлому владельцу.
items.artifacts.masterthievesarmband.desc_cursed=Проклятый нарукавник впивается в ваше запястье, и каким-то странным образом ваш мешочек с золотом начинает становиться легче...
items.artifacts.masterthievesarmband.desc_worn=Вы чувствуете, как нарукавник на вашем запястье заряжается силой, чем больше опыта вы приобретаете. Эту силу вы можете использовать для того, чтобы грабить магазины или врагов!\n\nОграбление врагов происходит моментально, они на короткое время теряют ориентацию, и у вас появляется шанс получить любой предмет, который у них имеется. Эта сила более действительна против не подозревающих ничего врагов. Повторная попытка ограбить одного и того же врага не прибавляет шансов успеха в ограблении.

items.artifacts.sandalsofnature.name=сандалии природы
items.artifacts.sandalsofnature.name_1=ботинки природы
items.artifacts.sandalsofnature.name_2=сапоги природы
items.artifacts.sandalsofnature.name_3=поножи природы
items.artifacts.sandalsofnature.ac_feed=УДОБРИТЬ
items.artifacts.sandalsofnature.ac_root=ИСПОЛЬЗОВАТЬ
items.artifacts.sandalsofnature.prompt=Выберите семя
items.artifacts.sandalsofnature.levelup=Ваша обувь увеличивается!
items.artifacts.sandalsofnature.absorb_seed=Обувь поглощает семя, расцветая на глазах.
items.artifacts.sandalsofnature.no_effect=Сначала вы должны удобрить свою обувь семенем.
items.artifacts.sandalsofnature.low_charge=У вашей обуви не хватает энергии для этого.
items.artifacts.sandalsofnature.prompt_target=Выберите место
items.artifacts.sandalsofnature.out_of_range=Это место вне досягаемости.
items.artifacts.sandalsofnature.desc_1=То, что на первый взгляд казалось парой сандалий, оказалось двумя растениями! Они выглядят слабыми и вялыми, может, их стоит удобрить?
items.artifacts.sandalsofnature.desc_2=Обувь выросла и теперь больше похожа на пару тканых туфель. К ним отчасти вернулся цвет, может, они могут вырасти ещё больше?
items.artifacts.sandalsofnature.desc_3=Обувь выросла и теперь больше похожа на пару ботинок из коры. Растения выглядят сильными - может, и это не предел?
items.artifacts.sandalsofnature.desc_4=Растения стали огромными, теперь они похожи на пару бронированных сапог. Они глубокого коричневого цвета и похожи на крепкое дерево.
items.artifacts.sandalsofnature.desc_hint=Вы чувствуете связь с природой, нося этот артефакт.
items.artifacts.sandalsofnature.desc_cursed=Проклятые сандалии блокируют всю связь с природой.
items.artifacts.sandalsofnature.desc_ability=Обувь переливается цветом последнего семени, которым вы их скормили. Они могут на короткое время пустить корни в землю и произвести эффект этого растения в любом месте в радиусе 3 плиток.\nСемя:_%s_\nТребуется энергия:_%d%%_
items.artifacts.sandalsofnature.desc_seeds=Вы дали вашей обуви семена %d.

items.artifacts.skeletonkey.name=костяной ключ
items.artifacts.skeletonkey.ac_insert=ВСТАВИТЬ
items.artifacts.skeletonkey.cursed=Ты не можешь использовать проклятый костяной ключ.
items.artifacts.skeletonkey.prompt=Выберите цель
items.artifacts.skeletonkey.invalid_target=Здесь нечего запирать или отпирать.
items.artifacts.skeletonkey.lock_no_space=Ты не можешь запереть персонажа внутри двери!
items.artifacts.skeletonkey.iron_charges=Вскрытие обычного замка требует 1 заряд.
items.artifacts.skeletonkey.gold_charges=Вскрытие золотого замка требует 2 заряда.
items.artifacts.skeletonkey.lock_charges=Чтобы запереть дверь нужно 2 заряда.
items.artifacts.skeletonkey.wall_charges=Создание временной стены требует 2 заряда.
items.artifacts.skeletonkey.crystal_charges=Вскрытие хрустального замка требует 5 зарядов.
items.artifacts.skeletonkey.wont_open=По какой-то причине ключ отказывается помещаться в этот замок.
items.artifacts.skeletonkey.locked_with_key=Эта дверь была заперта вашим костяным ключом.
items.artifacts.skeletonkey.force_lock=Замок ослаб и без использования вашего костяного ключа. Вам удалось силой открыть его.
items.artifacts.skeletonkey.discard=Вы избавляетесь от лишних ключей.
items.artifacts.skeletonkey.levelup=Ваш костяной ключ становится сильнее!
items.artifacts.skeletonkey.desc=Важно выглядящий ключ с кольцом в виде черепа. Его лезвие выглядит разным каждый раз, как вы на него смотрите.
items.artifacts.skeletonkey.desc_worn=Этот магический ключ, кажется, получает силу каждый раз, как вы используете его вместо обычных ключей подземелья. Он может быть вставлен практически в каждый замок, чтобы отпереть, или запереть его, включая двери, которые никогда не были заперты до этого.\n\nКлюч даже может быть использован на пустое место в прямом или диагональном направлении, чтобы "запереть" воздух впереди вас, создавая 3 клетки широкой, плотной стены, которая существует 10 ходов. Запирание оттолкнёт врагов, если есть свободное место.
items.artifacts.skeletonkey.desc_cursed=Проклятый ключ, кажется, активно сопротивляется помещаться в любой замок и даже мешает (не до невозможности) использовать другие ключи.
items.artifacts.skeletonkey$keywall.desc=Временная магическая стена была размещена здесь костяным ключом.

items.artifacts.talismanofforesight.name=талисман предвидения
items.artifacts.talismanofforesight.ac_scry=ИСПОЛЬЗОВАТЬ
items.artifacts.talismanofforesight.low_charge=Талисман требует как минимум 5% заряда для сканирования.
items.artifacts.talismanofforesight.prompt=Выберите место для сканирования.
items.artifacts.talismanofforesight.levelup=Ваш Талисман стал сильнее!
items.artifacts.talismanofforesight.full_charge=Ваш Талисман полностью заряжен!
items.artifacts.talismanofforesight.desc=Гладкий камень со странной гравировкой. Вам кажется, что он осматривается вокруг в поисках чего-нибудь скрытого.
items.artifacts.talismanofforesight.desc_worn=Когда вы держите талисман, вы ощущаете, что ваши чувства усиливаются. Талисман медленно накапливает заряд с течением времени, и тогда, когда вы обнаруживаете скрытые двери или ловушки.\n\nТалисман может тратить свой заряд на 'сканирование' в форме конуса, которое раскрывает все плитки и секреты в сканированной области, а также позволяет видеть врагов и предметы в течение короткого времени.
items.artifacts.talismanofforesight.desc_cursed=Проклятый талисман пристально смотрит на вас, притупляя ваши чувства.
items.artifacts.talismanofforesight$foresight.name=предвидение
items.artifacts.talismanofforesight$foresight.uneasy=Вам стало не по себе.
items.artifacts.talismanofforesight$foresight.desc=Вы сильно нервничаете, будто рядом есть незримая опасность.

items.artifacts.timekeepershourglass.name=песочные часы хранителя времени
items.artifacts.timekeepershourglass.ac_activate=ПЕРЕВЕРНУТЬ
items.artifacts.timekeepershourglass.deactivate=Вы деактивируете песочные часы.
items.artifacts.timekeepershourglass.no_charge=В песочных часах недостаточно зарядов для использования.
items.artifacts.timekeepershourglass.cursed=Вы не можете использовать проклятые песочные часы.
items.artifacts.timekeepershourglass.onstasis=Мир вокруг вас мгновенно изменился.
items.artifacts.timekeepershourglass.onfreeze=Мир вокруг вас остановился.
items.artifacts.timekeepershourglass.stasis=Уйти в стазис
items.artifacts.timekeepershourglass.freeze=Остановить время
items.artifacts.timekeepershourglass.prompt=Как вы хотите использовать магию песочных часов?\n\nВ стазисе время вокруг вас идет своим чередом, пока вы недвижимы и неуязвимы. Это потребует до 2 зарядов за раз.\n\nОстановив время, вы сможете двигаться так, как будто ваши действия мгновенны. Повторное использование часов или атака прервут действие эффекта.
items.artifacts.timekeepershourglass.desc=Большие резные песочные часы выглядят просто, но вы чувствуете сильную магию внутри. Поворачивая часы и смотря на текущий песок, вы чувствуете их магию. Она определённо позволит вам управлять временем.
items.artifacts.timekeepershourglass.desc_hint=В часах не хватает песка, вот бы найти немного...
items.artifacts.timekeepershourglass.desc_cursed=Проклятые песочные часы прилипли к вам, пытаясь манипулировать временем вокруг вас.
items.artifacts.timekeepershourglass$timefreeze.name=Заморозка Времени
items.artifacts.timekeepershourglass$timefreeze.desc=Время застыло вокруг вас, позволяя выполнять действия мгновенно. Эффект будет действовать, пока вы его не отмените или когда у часов закончится энергия. Атака или магия также прервут эффект часов.\n\nХодов осталось: %s.
items.artifacts.timekeepershourglass$sandbag.name=мешочек с волшебным песком
items.artifacts.timekeepershourglass$sandbag.levelup=Вы добавили песок в часы.
items.artifacts.timekeepershourglass$sandbag.maxlevel=Часы полны волшебного песка!
items.artifacts.timekeepershourglass$sandbag.no_hourglass=У вас нет часов, чтобы поместить в них песок.
items.artifacts.timekeepershourglass$sandbag.desc=Этот маленький мешочек чистого песка отлично подойдёт к вашим часам.\n\nСтранно, что он появился у торговца как раз тогда, когда понадобился...

items.artifacts.unstablespellbook.name=нестабильная книга заклинаний
items.artifacts.unstablespellbook.ac_read=ЧИТАТЬ
items.artifacts.unstablespellbook.ac_add=ДОБАВИТЬ
items.artifacts.unstablespellbook.blinded=Вы ослеплены и не можете разобрать текст.
items.artifacts.unstablespellbook.no_charge=Ваша книга заклинаний истощена.
items.artifacts.unstablespellbook.cursed=Вы не можете читать проклятую книгу.
items.artifacts.unstablespellbook.prompt=Выберите свиток
items.artifacts.unstablespellbook.infuse_scroll=Вы наполнили книгу энергией свитка.
items.artifacts.unstablespellbook.unable_scroll=Вы не можете добавить этот свиток в книгу.
items.artifacts.unstablespellbook.unknown_scroll=Вы не знаете, что это за свиток.
items.artifacts.unstablespellbook.desc=Книга выглядит неплохо для своего возраста. Она искрит и потрескивает, когда вы листаете страницы, излучая нестабильную энергию. Вы не можете прочитать конкретное заклинание из книги.
items.artifacts.unstablespellbook.desc_cursed=Проклятая книга привязалась к вам, она не позволит использовать большинство свитков.
items.artifacts.unstablespellbook.desc_index=В этой книге не хватает страниц, но из оглавления можно узнать следующие заголовки:
items.artifacts.unstablespellbook.desc_empowered=Свитки, что вы добавили в книгу, начали излучать магический свет. Вы можете использовать особую версию эффекта добавленных свитков, но ценой дополнительного заряда.
items.artifacts.unstablespellbook.read_empowered=Свиток, добавленный вами в книгу излучает энергию. Вы можете направить его энергию в обычный или особый вариант этого же свитка.\n\nВыбор особого свитка потратит две единицы заряда вместо одного.



###bags
items.bags.bag.name=рюкзак
items.bags.bag.discover_hint=Вы можете купить этот предмет в магазине.

items.bags.potionbandolier.name=пояс для зелий
items.bags.potionbandolier.desc=Этот широкий пояс надевается на грудь, как патронташ. В нём много маленьких кармашков для бутыльков с зельями и жидким металлом. Даже есть место для бурдюка.\n\nКарманы достаточно плотные для того, чтобы не дать бутылькам потрескаться от холода.

items.bags.scrollholder.name=футляр для свитков
items.bags.scrollholder.desc=Похоже, раньше этот футляр использовался для хранения астрономических карт, но и для свитков он вполне подойдёт. Здесь есть даже несколько боковых отделений, которые прекрасно подойдут для ваших заклинаний, мистических грифелей и магической смолы.\n\nПохоже, этот футляр огнеупорен, так что сможет защитить ваши свитки от огня.

items.bags.velvetpouch.name=бархатный мешочек
items.bags.velvetpouch.desc=В этой небольшой сумочке из бархата можно хранить множество мелких предметов, таких как семена, рунные камни и некоторые алхимические ингредиенты.
items.bags.velvetpouch.discover_hint=Один из героев начинает с этим предметом.

items.bags.magicalholster.name=волшебный чехол
items.bags.magicalholster.desc=Этот зачарованный чехол, сделанный из шкуры какого-то экзотического зверя, позволяет хранить в нем огромное количество метательных оружий.\n\nДостаточно просто запустить руку в чехол, и вы всегда достанете именно то, что искали.\n\nБлагодаря магии чехла, хранящиеся в нём палочки будут перезаряжаться немного быстрее, а метательные оружия будут дольше служить.



###bombs
items.bombs.arcanebomb.name=магическая бомба
items.bombs.arcanebomb.desc=Эта бомба была наделена магическими свойствами. Её взрыв будет схож с атакой накачавшегося Слизня, который наносит _%1$d-%2$d магического урона_ всем кто находится в пределах 2 клеток.
items.bombs.arcanebomb.discover_hint=Вы можете создать этот предмет с помощью алхимии.

items.bombs.bomb.name=бомба
items.bombs.bomb.ac_lightthrow=ПОДЖЕЧЬ И БРОСИТЬ
items.bombs.bomb.snuff_fuse=Вы спешно задуваете фитиль бомбы.
items.bombs.bomb.ondeath=Вас разорвало взрывной волной...
items.bombs.bomb.rankings_desc=Убит взрывом
items.bombs.bomb.desc=Довольно крупная бомба, под завязку начиненная черным порохом. Взрыв этой бомбы наносит _%1$d-%2$d урона_ всему, что находится рядом с ней, и разрушает некоторую прилегающую местность или предметы.
items.bombs.bomb.desc_fuse=Похоже, что фитиль будет гореть несколько ходов, если его зажечь.
items.bombs.bomb.desc_burning=Фитиль горит, лучше избавиться от бомбы или затушить его!
items.bombs.bomb$doublebomb.name=две бомбы
items.bombs.bomb$doublebomb.desc=Две здоровенные пороховые бомбы по цене одной!

items.bombs.firebomb.name=зажигательная бомба
items.bombs.firebomb.desc=Эта бомба была модифицирована таким образом, чтобы при взрыве наносить _%1$d-%2$d урона_ на большей области, поджигая всё в радиусе 2 клеток от точки взрыва.
items.bombs.firebomb.discover_hint=Вы можете создать этот предмет с помощью алхимии.

items.bombs.flashbangbomb.name=световая граната
items.bombs.flashbangbomb.desc=Это бомба была модифицирована таким образом, чтобы при взрыве излучить звуковую вспышку света с электрическим разрядом. Сам взрыв наносит _%1$d-%2$d урона_ всем кто находится в пределах 2 клеток, и дополнительно наносит электричеством 25%% урона, оглушая на 10 ходов.
items.bombs.flashbangbomb.discover_hint=Вы можете создать этот предмет с помощью алхимии.

items.bombs.frostbomb.name=замораживающая бомба
items.bombs.frostbomb.desc=Эта бомба была модифицирована таким образом, чтобы при взрыве наносить _%1$d-%2$d урона_ на большой области, создавая облако замораживающего газа в радиусе 2 клеток.
items.bombs.frostbomb.discover_hint=Вы можете создать этот предмет с помощью алхимии.

items.bombs.holybomb.name=освящённая бомба
items.bombs.holybomb.desc=Это бомба была модифицирована таким образом, чтобы при взрыве излучать вспышки святой энергии. Сам взрыв наносит _%1$d-%2$d урона_ всем кто находится в пределах 2 клеток, а если под него попадает нежить или демон, они получают дополнительно 50%% урона от святой энергии.
items.bombs.holybomb.discover_hint=Вы можете создать этот предмет с помощью алхимии.

items.bombs.noisemaker.name=шумовая бомба
items.bombs.noisemaker.desc=Эта модифицированная бомба будет безостановочно издавать шум, когда фитиль догорит. Если что-либо коснется бомбы, она тут же взорвется и нанесет _%1$d-%2$d урона_ всем кто в радиусе 2 клеток!
items.bombs.noisemaker.desc_burning=Генератор шума тикает, взрыв произойдет, если что-либо приблизится на достаточное расстояние!
items.bombs.noisemaker.discover_hint=Вы можете создать этот предмет с помощью алхимии.

items.bombs.smokebomb.name=дымовая бомба
items.bombs.smokebomb.desc=Эта бомба была модифицирована таким образом, чтобы при взрыве высвобождать облако газа. Она нанесет _%1$d-%2$dурона_ и распространит окутывающий туман в радиусе 2 клеток от точки взрыва.
items.bombs.smokebomb.discover_hint=Вы можете создать этот предмет с помощью алхимии.

items.bombs.regrowthbomb.name=восстанавливающая бомба
items.bombs.regrowthbomb.desc=Эта модифицированная бомба вместо взрыва разбрызгивает в радиусе 3 клеток особый исцеляющий состав, провоцирующий ускоренный рост трав и растений, а так же лечащий вас и ваших союзников, будто вы выпили зелье исцеления.
items.bombs.regrowthbomb.discover_hint=Вы можете создать этот предмет с помощью алхимии.

items.bombs.shrapnelbomb.name=осколочная бомба
items.bombs.shrapnelbomb.desc=Эта бомба была наполнена осколками DM-300, которые разлетятся во все стороны при взрыве, нанося _%1$d-%2$d урона_ всем в огромном радиусе вокруг бомбы. Лучше будет спрятаться за что-нибудь перед тем, как она взорвётся...
items.bombs.shrapnelbomb.discover_hint=Вы можете создать этот предмет с помощью алхимии.

items.bombs.woollybomb.name=шерстяная бомба
items.bombs.woollybomb.desc=Эта бомба создаст широкое поле волшебных овец после взрыва, который наносит _%1$d-%2$d урона_ всему, что находится в пределах 2 клеток. Они не позволят кому-либо пройти, и будут стоять очень долго! Правда, в присутствии сильных врагов овцы буду исчезать быстрее, и их можно отогнать при взаимодействии с ними.
items.bombs.woollybomb.discover_hint=Вы можете создать этот предмет с помощью алхимии.

###food
items.food.berry.name=подземельная ягода
items.food.berry.eat_msg=Эта ягода была вкусной!
items.food.berry.desc=Это небольшая ягода, найденная охотницей среди растительности. Ее можно очень быстро съесть, она восполняет небольшое количество сытости, а также может содержать полезное семя!
items.food.berry.discover_hint=Вы можете найти этот предмет, используя определённый талант героя.

items.food.blandfruit.name=пустофрукт
items.food.blandfruit.cooked=сваренный пустофрукт
items.food.blandfruit.sunfruit=солнцефрукт
items.food.blandfruit.rotfruit=гнилофрукт
items.food.blandfruit.earthfruit=землефрукт
items.food.blandfruit.blindfruit=бледнофрукт
items.food.blandfruit.firefruit=огнефрукт
items.food.blandfruit.icefruit=хладофрукт
items.food.blandfruit.fadefruit=мыслефрукт
items.food.blandfruit.sorrowfruit=кислофрукт
items.food.blandfruit.stormfruit=грозофрукт
items.food.blandfruit.dreamfruit=магофрукт
items.food.blandfruit.starfruit=звёздофрукт
items.food.blandfruit.swiftfruit=скорофрукт
items.food.blandfruit.raw=Вы не в силах заставить себя съесть его сырым.
items.food.blandfruit.desc=Не имеет ни вкуса, ни запаха. Может, если его сварить с чем-то ещё, он станет получше?
items.food.blandfruit.desc_cooked=Во время варки в котле этот фрукт разбух и даже впитал в себя некоторые свойства ингредиентов, с которыми был сварен. Он будет обладать свойствами любого зелья, которому соответствовало семя.
items.food.blandfruit.desc_eat=Похоже, теперь его можно есть!
items.food.blandfruit.desc_throw=Похоже, что он может взорваться, если его бросить.
items.food.blandfruit$chunks.name=остатки пустофрукта
items.food.blandfruit$chunks.desc=Пустофрукт лопнул при ударе, развалившись на несколько небольших кусков.\n\nНесмотря на то, что они немного испачканы, они выглядят вполне съедобными.

items.food.chargrilledmeat.name=прожаренное мясо
items.food.chargrilledmeat.desc=Пахнет как неплохой стейк.
items.food.chargrilledmeat.discover_hint=Вы можете создать это, используя другой предмет пищи.

items.food.food.name=рацион пищи
items.food.food.ac_eat=СЪЕСТЬ
items.food.food.eat_msg=Эта еда была просто превосходна!
items.food.food.desc=Ничего особенного - вяленое мясо, немного сухариков и всё такое.

items.food.frozencarpaccio.name=замороженное мясо
items.food.frozencarpaccio.invis=Вы видите, как ваши руки становятся невидимыми!
items.food.frozencarpaccio.hard=Вы чувствуете, что ваша кожа затвердела!
items.food.frozencarpaccio.refresh=Освежающе!
items.food.frozencarpaccio.better=Вы чувствуете себя лучше!
items.food.frozencarpaccio.desc=Это кусок насквозь промороженного мяса. Его можно есть, только нарезая тонкими ломтиками, как карпаччо. Впрочем, так оно получается на вкус даже лучше, чем обычно.
items.food.frozencarpaccio.discover_hint=Вы можете создать это, используя другой предмет пищи.

items.food.meatpie.name=мясной пирог
items.food.meatpie.eat_msg=Это было чертовски вкусно!
items.food.meatpie.desc=Аппетитный пирог, полный вкусного мяса. Такое лакомство способно насытить куда лучше любой другой пищи.
items.food.meatpie.discover_hint=Вы можете создать этот предмет с помощью алхимии.

items.food.mysterymeat.name=загадочное мясо
items.food.mysterymeat.eat_msg=Это еда была какой-то странной на вкус.
items.food.mysterymeat.hot=Ой! Горячо!
items.food.mysterymeat.legs=Вы не чувствуете своих ног!
items.food.mysterymeat.not_well=Вы чувствуете себя не очень хорошо.
items.food.mysterymeat.stuffed=Вы наелись.
items.food.mysterymeat.desc=Ешьте на свой страх и риск!
items.food.mysterymeat.discover_hint=Вы можете получить этот предмет как трофей с определённых врагов.
items.food.mysterymeat$placeholder.name=мясо

items.food.phantommeat.name=призрачное мясо
items.food.phantommeat.desc=Большой и блестящий полупрозрачный стейк, вырезанный из призрачной пираньи. Это волшебное мясо не нуждается в приготовлении и обладает рядом защитных свойств в дополнение большой питательности. Одного кусочка хватит, чтобы полностью насытить вас, затянуть раны и излечить от вредных эффектов. Кроме того, мясо сделает вас невидимым и наложит эффект дубовой кожи.
items.food.phantommeat.discover_hint=Вы можете получить этот предмет как трофей с определённых врагов.

items.food.pasty.name=пирог
items.food.pasty.fish_name=рыба на пару
items.food.pasty.amulet_name=Амулет Индора?
items.food.pasty.egg_name=пасхальное яйцо
items.food.pasty.rainbow_name=радужное зелье
items.food.pasty.shattered_name=зеленый тортик
items.food.pasty.pie_name=тыквенный пирог
items.food.pasty.vanilla_name=синий тортик
items.food.pasty.cane_name=новогодний леденец
items.food.pasty.sparkling_name=игристое зелье
items.food.pasty.desc=Настоящий корнуэльский пирог с начинкой из говядины и картофеля. Восхитительно!
items.food.pasty.fish_desc=Рыба на пару, волшебно поданная на зелени. В это время года есть традиция сохранять кусочек рыбы на потом, поэтому вы оставите немного объедков, вместо того, чтобы съесть всё сразу.\n\nСчастливого Лунного Нового Года!
items.food.pasty.amulet_desc=Вы наконец-то нашли его, великий Амулет Инд- погодите-ка, это ведь обычная шоколадка в фольге, которая просто похожа на амулет! Она не наделит вас безграничной силой, но, по меньшей мере, поможет насытиться и немного зарядить ваши артефакты.\n\nС Днём Дураков! ;)
items.food.pasty.egg_desc=Огромное шоколадное яйцо, завёрнутое в яркую жёлтую фольгу. В нём достаточно шоколада, чтобы насытить вас, а сахар даст вашим артефактам немного дополнительного заряда.\n\nС Пасхой!
items.food.pasty.rainbow_desc=Это разноцветное зелье является подобием жидкой еды. В дополнение к питательной ценности зелье обладает небольшим количеством магии, которая успокоит всех смежных врагов кроме боссов, заставляя их подумать прежде чем атаковать вас.\n\nС днём Гордости!
items.food.pasty.shattered_desc=Этот большой кусок ванильного торта украшен разноцветной посыпкой и зеленой глазурью. Торт испечен со знанием дела опытными руками, и даже передаст частичку опыта тому, кто его попробует.\n\nShattered Pixel Dungeon впервые была выпущена 5 августа 2014 года. С днем рождения, Shattered Pixel Dungeon!
items.food.pasty.pie_desc=Здоровенный кусок тыквенного пирога. Его сладкий и пряный вкус способен не только полностью утолить голод, но и восстановить немного здоровья.\n\nСчастливого Дня Всех Святых!
items.food.pasty.vanilla_desc=Этот большой кусок ванильного торта украшен разноцветной посыпкой и синей глазурью. Торт испечен со знанием дела опытными руками, и даже передаст частичку опыта тому, кто его попробует.\n\nОригинальная версия Pixel Dungeon была впервые выпущена 4 декабря 2012 года. С днем рождения, Pixel Dungeon!
items.food.pasty.cane_desc=Огромная сладкая карамельная трость. Она достаточно большая для того, чтобы полностью утолить голод, а избыток сахара может ещё и добавить энергии для ваших волшебных палочек.\n\nС праздником!
items.food.pasty.sparkling_desc=Это зелье, играющее пузырьками, представляет собой разновидность жидкой пищи. Оно утоляет голод и напоминает игристое вино, хотя и не является алкогольным. Ощущение тепла в животе дарует ощущение защиты.\n\nС Новым годом!
items.food.pasty$fishleftover.name=рыбные объедки
items.food.pasty$fishleftover.eat_msg=На вкус так себе.
items.food.pasty$fishleftover.desc=Немного остатков рыбы после вашего предыдущего приёма пищи. Вы в любой момент можете съесть их, чтобы слегка восполнить сытость.

items.food.smallration.name=урезанный рацион
items.food.smallration.eat_msg=На вкус так себе.
items.food.smallration.desc=Он выглядит как обычный рацион, но поменьше.
items.food.smallration.discover_hint=Вы можете купить этот предмет в магазине.

items.food.stewedmeat.name=тушёное мясо
items.food.stewedmeat.eat_msg=На вкус так себе.
items.food.stewedmeat.desc=Тушёное мясо очищено от любой инфекции и паразитов. Его можно спокойно есть.
items.food.stewedmeat.discover_hint=Вы можете создать этот предмет с помощью алхимии.

items.food.supplyration.name=паёк
items.food.supplyration.desc=Этот паёк был оставлен в подземелье членами гильдии воров для её же участников. Он был специально разработан для перекуса на ходу и для помощи в тёмных делах.\n\nХотя он и не насытит вас так же, как и обычный рацион, паёк может быть съеден моментально. Он восстановит немного здоровья и один заряд Плаща Теней Разбойника.
items.food.supplyration.discover_hint=Вы можете найти этот предмет используя определённый талант героя.



##journal items
items.journal.documentpage.name=вырванная страница
items.journal.documentpage.desc=Эту страницу, кажется, вырвали из какой-то книги. Чтобы разобрать, что на ней написано, придётся её подобрать.

items.journal.alchemypage.name=вырванная страница учебника алхимии
items.journal.alchemypage.desc=Вырванная страница из учебника алхимии.\n\nБольшая часть текста слишком мелкая, чтобы прочесть её издалека, но можно вполне разглядеть заголовок:\n\n_"%s"_

items.journal.guidebook.name=альманах путешественника
items.journal.guidebook.hint_mobile=В справочнике новый совет для вас! Нажмите в правом верхнем углу на мигающую кнопку журнала, чтобы прочитать его.
items.journal.guidebook.hint_desktop=В справочнике новый совет для вас! Нажмите в правом верхнем углу на мигающую кнопку журнала (%s), чтобы прочитать его.
items.journal.guidebook.hint_status=Справочник
items.journal.guidebook.desc=Путеводитель путешественника, забытый тут кем-то, кто решил, что приключения - не его удел. Эта конкретная книга - магическая, она может обратить внимание путешественника на определенную страницу в нужное время.\n\nКнига крайне популярна не только лишь из-за её содержания, но и из-за красиво выведенной надписи "Не паникуй!" на обложке.

items.journal.guidepage.name=вырванная страница справочника
items.journal.guidepage.desc=Вырванная страница из справочника путешественника.\n\nБольшая часть текста слишком мелкая, чтобы прочесть её издалека, но можно вполне разглядеть заголовок:\n\n_"%s"_

items.journal.regionlorepage$sewers.name=потертое письмо
items.journal.regionlorepage$sewers.desc=Похоже на письмо, написанное на заляпанной бумаге. Вам придется его поднять, чтобы прочесть, что там написано.

items.journal.regionlorepage$prison.name=потертая запись из дневника
items.journal.regionlorepage$prison.desc=Это запись в дневнике или какая-то иная запись, написанная на старом листе бумаги. Похоже, она сохранилась лучше, чем те письма, которые вы находили в канализации, но вам, все же, придется его поднять, чтобы его прочитать.

items.journal.regionlorepage$caves.name=старая запись из журнала
items.journal.regionlorepage$caves.desc=Это выглядит как запись из журнала исследователя, и она удивительным образом хорошо сохранилась. Поднимите ее, чтобы прочесть.

items.journal.regionlorepage$city.name=ржавая табличка
items.journal.regionlorepage$city.desc=Маленькая, ржавая металлическая пластина с выжженным на ней сообщением. Несмотря на возраст пластины, буквы отчетливо видны, но вам придется поднять ее, чтобы прочитать текст.

items.journal.regionlorepage$halls.name=светящаяся табличка
items.journal.regionlorepage$halls.desc=Это маленькая, черная скрижаль со светящейся, выжженной на ней надписью. Издалека свет, исходящий от начертания, сливается в дымку, так что вам придется поднять скрижаль, чтобы прочитать текст.


###keys
items.keys.goldenkey.name=золотой ключ
items.keys.goldenkey.desc=У этого ключа очень маленькая и изящная бородка. Возможно, это ключ от какого-то сундука?

items.keys.crystalkey.name=Хрустальный ключ
items.keys.crystalkey.desc=Вырезанные из цельного куска хрусталя, изгибы этого ключа мерцают в темноте. Может, он откроет что-то сделанное из хрусталя?

items.keys.ironkey.name=железный ключ
items.keys.ironkey.desc=Бородка этого ключа уже изношена, а кожаный ремешок очень старый. Интересно, какую дверь им можно открыть?

items.keys.wornkey.name=изношенный ключ
items.keys.wornkey.desc=Этот ключ изношен и выцвел, но выглядит серьёзным. Скорее всего, он может открыть какую-нибудь серьёзную дверь неподалёку.



###potions
items.potions.potion.ac_drink=ВЫПИТЬ
items.potions.potion.turquoise=бирюзовое зелье
items.potions.potion.crimson=багряное зелье
items.potions.potion.azure=лазурное зелье
items.potions.potion.jade=зелёное зелье
items.potions.potion.golden=золотистое зелье
items.potions.potion.magenta=пурпурное зелье
items.potions.potion.charcoal=серое зелье
items.potions.potion.ivory=белёсое зелье
items.potions.potion.amber=янтарное зелье
items.potions.potion.bistre=коричневое зелье
items.potions.potion.indigo=фиолетовое зелье
items.potions.potion.silver=серебристое зелье
items.potions.potion.unknown_desc=Этот пузырёк содержит какое-то зелье. Интересно, что будет, если его выпить или разбить?
items.potions.potion.harmful=Вредное зелье!
items.potions.potion.beneficial=Полезное зелье
items.potions.potion.yes=Да, все правильно
items.potions.potion.no=Нет, я передумал
items.potions.potion.sure_drink=Вы уверены, что хотите выпить это зелье? Возможно, стоит кинуть им в кого-нибудь другого.
items.potions.potion.sure_throw=Вы уверены, что хотите бросить это зелье? Возможно, его лучше выпить.
items.potions.potion.shatter=Бутыль разлетается на мелкие осколки, а её содержимое безо всякого эффекта растекается по полу.
items.potions.potion.discover_hint=Вы можете случайно найти этот предмет в подземелье или создать его с помощью алхимии.
items.potions.potion$placeholder.name=зелье
items.potions.potion$seedtopotion.name=Случайное Зелье

items.potions.potionofexperience.name=зелье Опыта
items.potions.potionofexperience.desc=Это зелье содержит концентрированный опыт множества сражений. Если его выпить, ваш уровень будет немедленно повышен.

items.potions.potionoffrost.name=зелье Холода
items.potions.potionoffrost.desc=При контакте с воздухом этот химикат мгновенно испаряется, замораживая всех, кто попал в облако его паров.

items.potions.potionofhaste.name=зелье Ускорения
items.potions.potionofhaste.energetic=Вы чувствуете прилив энергии!
items.potions.potionofhaste.desc=Глоток этой удивительно сладкой жидкости наполнит вас огромной энергией, ненадолго позволив перемещаться гораздо быстрее.

items.potions.potionofhealing.name=зелье Исцеления
items.potions.potionofhealing.heal=Ваши раны начинают заживать.
items.potions.potionofhealing.desc=Этот эликсир стремительно заживляет любые раны и моментально исцеляет многие недуги.

items.potions.potionofinvisibility.name=зелье Невидимости
items.potions.potionofinvisibility.invisible=Вы видите, как ваши руки становятся невидимыми!
items.potions.potionofinvisibility.desc=Выпив это зелье, вы станете совершенно невидимы для противников на какое-то время. Впрочем, физические атаки и магические эффекты (такие как свитки и палочки) моментально рассеют невидимость.

items.potions.potionoflevitation.name=зелье Левитации
items.potions.potionoflevitation.float=Вы взмываете в воздух!
items.potions.potionoflevitation.desc=Если выпить этот занятный состав, то некоторое время вы будете парить в воздухе и сможете пересечь пропасть или перелететь через ловушку.\n\nЕсли бросить это зелье, оно создаст облако неочищенного газа, дезориентирующего любого, кто в него попадёт.

items.potions.potionofliquidflame.name=зелье Алхимического огня
items.potions.potionofliquidflame.desc=Этот сосуд содержит нестабильный реактив, который при малейшем контакте с воздухом резко загорается, поджигая всё вокруг.

items.potions.potionofmindvision.name=зелье Ментального зрения
items.potions.potionofmindvision.see_mobs=Вы каким-то образом можете чувствовать присутствие других существ!
items.potions.potionofmindvision.see_none=Вы каким-то образом понимаете, что на этом уровне подземелья нет никого, кроме вас.
items.potions.potionofmindvision.desc=Глоток этого зелья помогает настроить ваш разум на психические частоты других существ, позволяя вам определять местоположение других существ сквозь любые препятствия.\n\nТакже в этом состоянии вы можете видеть сквозь ближайшие стены и двери.

items.potions.potionofparalyticgas.name=зелье Парализующего газа
items.potions.potionofparalyticgas.desc=При контакте с открытым воздухом жидкость в этой бутыли испарится, превращаясь в обездвиживающий жёлтый газ. Любой, кто вдохнёт его, будет мгновенно парализован, теряя возможность сопротивляться до тех пор, пока облако не развеется.\n\nЭто зелье лучше кидать во врагов, находящихся на расстоянии.

items.potions.potionofpurity.name=зелье Очищения
items.potions.potionofpurity.freshness=Вы чувствуете, что на вас неожиданно пахнуло свежим воздухом.
items.potions.potionofpurity.protected=Некое подобие защитной пленки обволакивает вас!
items.potions.potionofpurity.desc=Этот магический реагент способен моментально нейтрализовать все вредоносные газы в большой зоне. Выпив его, вы получите временный иммунитет к газам любого рода.

items.potions.potionofstrength.name=зелье Силы
items.potions.potionofstrength.msg=По вашему телу распространяется новоприобретённая сила, теперь у вас %d силы!
items.potions.potionofstrength.desc=Это редкое зелье влияет на мускулатуру всего вашего тела, навсегда увеличивая вашу силу на единицу.

items.potions.potionoftoxicgas.name=зелье Токсического газа
items.potions.potionoftoxicgas.desc=Разбивание или раскупоривание этого герметичного флакона заставит его содержимое взорваться смертоносным облаком отравляющего газа. Возможно, лучше бросить это зелье в кого-то, находящегося на расстоянии, а не открывать его самому.



###brews
items.potions.brews.brew.discover_hint=Вы можете создать этот предмет с помощью алхимии.

items.potions.brews.aquabrew.name=экстракт Водянистости
items.potions.brews.aquabrew.desc=Если его разбить, то этот экстракт высвободит водный всплеск в точке приземления. Оно достаточно мощное, чтобы нанести урон огненным существам, но оно также затопит местность вокруг, обезвредит ловушки, потушит пламя и откинет врагов, которые оказались рядом со всплеском.

items.potions.brews.blizzardbrew.name=экстракт Снежного вихря
items.potions.brews.blizzardbrew.desc=Если его разбить, то этот экстракт выпустит на свободу вихрь замораживающей пурги, который будет быстро распространяться подобно газам.

items.potions.brews.causticbrew.name=экстракт Едкой слизи
items.potions.brews.causticbrew.desc=Если разбить этот экстракт, то он покроет всех вокруг чрезвычайно едкой кислотой. Кислота будет наносить урон всем, кто попадёт под неё, пока её не смоют водой.

items.potions.brews.infernalbrew.name=экстракт Адского пламени
items.potions.brews.infernalbrew.desc=Если его разбить, то этот экстракт выпустит на свободу бушующее адское пламя, которое будет быстро распространяться подобно газам.

items.potions.brews.shockingbrew.name=экстракт Грозового облака
items.potions.brews.shockingbrew.desc=Если его разбить, то этот экстракт выпустит на свободу электрический шторм на большом пространстве вокруг того места, где был разбит экстракт.

items.potions.brews.unstablebrew.name=нестабильный экстракт
items.potions.brews.unstablebrew.desc=Этот волшебный напиток переливается цветами радуги.\n\nКогда его выпьют или бросят, он активирует эффект случайного зелья. Эффект напитка всегда будет положительный, если его выпить, и всегда будет отрицательный, если бросить.

###elixirs
items.potions.elixirs.elixir.discover_hint=Вы можете создать этот предмет с помощью алхимии.

items.potions.elixirs.elixirofarcanearmor.name=эликсир Мистической брони
items.potions.elixirs.elixirofarcanearmor.desc=Данный эликсир дарует выпившему длительное сопротивление магическому урону.

items.potions.elixirs.elixirofaquaticrejuvenation.name=эликсир Водной регенерации
items.potions.elixirs.elixirofaquaticrejuvenation.desc=Этот эликсир содержит в себе остатки Слизня, смешанные с лечебным зельем. Вместо моментального исцеления он дарует выпившему его способность восстанавливать здоровье при соприкосновении с водой.
items.potions.elixirs.elixirofaquaticrejuvenation$aquahealing.name=водная регенерация
items.potions.elixirs.elixirofaquaticrejuvenation$aquahealing.desc=Вы временно получили способности Слизня к регенерации.\n\nНаходясь в воде, вы восстанавливаете небольшое количество здоровья каждый ход. Эффект приостанавливается, когда у вас полное здоровье или вы находитесь вне воды.\n\nЛечения осталось: %d.

items.potions.elixirs.elixirofdragonsblood.name=эликсир Крови дракона
items.potions.elixirs.elixirofdragonsblood.desc=Будучи выпитым, эликсир наделит героя силой огня, протекающей по его венам. Этот эффект подарит ему иммунитет к огню и позволит поджигать врагов своими ударами.

items.potions.elixirs.elixiroffeatherfall.name=эликсир Антигравитации
items.potions.elixirs.elixiroffeatherfall.light=Вы чувствуете себя легким, как пёрышко!
items.potions.elixirs.elixiroffeatherfall.desc=Этот эликсир дарует частичный контроль над гравитацией, позволяя выпившему его падать в пропасти без риска для здоровья.
items.potions.elixirs.elixiroffeatherfall$featherbuff.name=антигравитация
items.potions.elixirs.elixiroffeatherfall$featherbuff.desc=Вы под эффектом эликсира Антигравитации, который позволяет вам падать в пропасти и не получить урон!\n\nОсталось ходов: %s.

items.potions.elixirs.elixirofhoneyedhealing.name=эликсир Медового исцеления
items.potions.elixirs.elixirofhoneyedhealing.desc=Этот эликсир не только исцеляет раны, но ещё и очень сладкий! Он немного утоляет голод и применяет тот же эффект, что и зелье регенерации, если его выпить. Но можно и бросить его в союзника, чтобы вылечить его раны.\n\nС помощью этого эликсира можно укротить тех существ, которые любят мёд.

items.potions.elixirs.elixiroficytouch.name=эликсир Ледяного касания
items.potions.elixirs.elixiroficytouch.desc=Тот, кто выпьет такой эликсир, сможет высасывать тепло из врагов одним своим прикосновением. Это даст полный иммунитет к холоду, а также позволит накладывать окоченение своими физическими атаками.

items.potions.elixirs.elixirofmight.name=эликсир Могущества
items.potions.elixirs.elixirofmight.msg=По вашему телу распространяется новоприобретённая сила, теперь у вас %d силы!
items.potions.elixirs.elixirofmight.desc=Это мощное зелье растечётся по вашим мышцам, навсегда увеличив вашу силу на одно очко и здоровье на %d очков. Бонус к здоровью зависит зависит от вашего максимального здоровья, но при получении уровней будет постепенно спадать.
items.potions.elixirs.elixirofmight$htboost.name=увеличение запаса здоровья
items.potions.elixirs.elixirofmight$htboost.desc=Вы чувствуете непривычную силу и живучесть.\n\nВаше максимальное здоровье увеличено на долгое время. Когда вы получаете уровни, этот бонус будет понемногу снижаться.\n\nУвеличение жизни на данный момент: %d.\nУровней осталось: %d.

items.potions.elixirs.elixiroftoxicessence.name=эликсир Зловония
items.potions.elixirs.elixiroftoxicessence.desc=Этот эликсир дарует выпившему токсическую силу. Испивший будет источать токсичный газ, а так же будет невосприимчив к отравлению и токсичному газу даже чуть дольше, чем длится эффект.



###exotic potions
items.potions.exotic.exoticpotion.turquoise=особое бирюзовое зелье
items.potions.exotic.exoticpotion.crimson=особое багряное зелье
items.potions.exotic.exoticpotion.azure=особое лазурное зелье
items.potions.exotic.exoticpotion.jade=особое зелёное зелье
items.potions.exotic.exoticpotion.golden=особое золотистое зелье
items.potions.exotic.exoticpotion.magenta=особое пурпурное зелье
items.potions.exotic.exoticpotion.charcoal=особое серое зелье
items.potions.exotic.exoticpotion.ivory=особое белёсое зелье
items.potions.exotic.exoticpotion.amber=особое янтарное зелье
items.potions.exotic.exoticpotion.bistre=особое коричневое зелье
items.potions.exotic.exoticpotion.indigo=особое фиолетовое зелье
items.potions.exotic.exoticpotion.silver=особое серебристое зелье
items.potions.exotic.exoticpotion.unknown_desc=Этот округлый пузырёк содержит странную разноцветную жидкость, совсем не похожую на обычные зелья. Интересно, что будет, если его выпить или разбить?
items.potions.exotic.exoticpotion.warning=Вы действительно хотите отменить использование этого зелья? Оно все равно будет истрачено.
items.potions.exotic.exoticpotion.yes=Да, я уверен
items.potions.exotic.exoticpotion.no=Нет, я передумал
items.potions.exotic.exoticpotion.discover_hint=Вы можете создать этот предмет с помощью алхимии.

items.potions.exotic.potionofcleansing.name=зелье Избавления
items.potions.exotic.potionofcleansing.desc=Этот мощный реагент сделает выпившего его невосприимчивым ко всем отрицательным эффектам на несколько ходов при употреблении. Его также можно кинуть в цель, чтобы очистить её.
items.potions.exotic.potionofcleansing$cleanse.name=очищенные
items.potions.exotic.potionofcleansing$cleanse.desc=Этот персонаж имеет временный иммунитет против любых вредных эффектов!\n\nХодов осталось: %s.

items.potions.exotic.potionofcorrosivegas.name=зелье Коррозийного газа
items.potions.exotic.potionofcorrosivegas.desc=Бросок или откупоривание этой находящейся под давлением бутыли спровоцирует формирование из содержимого облака едкого газа цвета ржавчины. Его концентрация, однако, будет невысока и облако не слишком долго продержится.

items.potions.exotic.potionofdragonsbreath.name=зелье Драконьего дыхания
items.potions.exotic.potionofdragonsbreath.prompt=Выберите цель
items.potions.exotic.potionofdragonsbreath.desc=Этот пузырёк содержит необычный реактив, который мгновенно воспламеняется при смешении со слюной. Вовремя выплюнув жидкость, вы сможете выпускать пламя изо рта!

items.potions.exotic.potionofearthenarmor.name=зелье Природной брони
items.potions.exotic.potionofearthenarmor.desc=Вместо того, чтобы парализовать, эта жидкость заставляет кожу затвердеть, что временно наделит вас природной бронёй.

items.potions.exotic.potionofdivineinspiration.name=зелье Небесного вдохновения
items.potions.exotic.potionofdivineinspiration.no_more_points=Вы не можете получить больше бонусных очков таланта.
items.potions.exotic.potionofdivineinspiration.select_tier=Выберите уровень талантов к которому будут добавлены два очка. Уровень должен быть открытым.
items.potions.exotic.potionofdivineinspiration.bonus=+2 очка талантов!
items.potions.exotic.potionofdivineinspiration.desc=Будучи святой энергией в жидкой форме, это зелье наделит выпившего двумя дополнительным очками талантов того уровня, который он выберет.\n\nЭто зелье может быть использовано единожды для каждого уровня талантов.

items.potions.exotic.potionofmagicalsight.name=зелье Волшебного взора
items.potions.exotic.potionofmagicalsight.desc=После того, как вы это выпьете, ваши чувства ненадолго обострятся до невероятного уровня, увеличивая дальность обзора до 12 клеток и позволяя видеть сквозь стены!

items.potions.exotic.potionofmastery.name=зелье Мастерства
items.potions.exotic.potionofmastery.prompt=Освоить предмет
items.potions.exotic.potionofmastery.weapon_easier=Вашим оружием стало проще пользоваться!
items.potions.exotic.potionofmastery.armor_easier=Ваша броня становится легче!
items.potions.exotic.potionofmastery.desc=Вместо того, чтобы увеличивать силу, это зелье настраивает мышцы на определенный предмет. Это упростит использование этого предмета, как если бы пьющий практиковался с ним и развил мышечную память.\n\nДля использования выбранного оружия или доспехов потребуется на 2 единицы силы меньше. Это зелье можно использовать только один раз для каждого предмета.

items.potions.exotic.potionofshielding.name=зелье Защиты
items.potions.exotic.potionofshielding.desc=Вместо того, чтобы исцелять, это зелье создаёт волшебный барьер вокруг выпившего. Этот барьер может поглотить значительное количество повреждений.

items.potions.exotic.potionofshroudingfog.name=зелье Густого тумана
items.potions.exotic.potionofshroudingfog.desc=При контакте с воздухом жидкость в этом пузырьке превратится в густой клубящийся туман, полностью блокирующий обзор.

items.potions.exotic.potionofsnapfreeze.name=зелье Заморозки
items.potions.exotic.potionofsnapfreeze.desc=Химикаты в этом зелье моментально реагируют с воздухом, мгновенно замораживая и обездвиживая всех вокруг.

items.potions.exotic.potionofstamina.name=зелье Выносливости
items.potions.exotic.potionofstamina.desc=Глоток этой странно сладковатой жидкости дарует длительный прилив энергии, надолго увеличивая скорость перемещения.

items.potions.exotic.potionofstormclouds.name=зелье Грозовых туч
items.potions.exotic.potionofstormclouds.desc=Если бросить это зелье, оно образует быстро распространяющееся облако концентрированного пара, конденсат которого опустится на окрестности. Большая часть местности будет затоплена, огненные существа получат урон, пламя потушится, а ловушки выйдут из строя и сломаются.



###quest items
items.quest.ceremonialcandle.name=ритуальная свеча
items.quest.ceremonialcandle.desc=Несколько свеч, слепившихся в одну из-за использования.\n\nСами по себе они бесполезны, но если использовать их в определенной последовательности, они способны сконцентрировать энергию, необходимую для ритуала призыва.
items.quest.ceremonialcandle.discover_hint=Вы можете найти этот предмет во время определённого задания.

items.quest.corpsedust.name=прах мертвеца
items.quest.corpsedust.chill=Холодок пробегает по вашей спине.
items.quest.corpsedust.desc=Эта кучка праха не сильно отличается от любой другой в этом подземелье, но вы чувствуете таящуюся в ней темную энергию.\n\nПожалуй, лучше от неё избавиться, да как можно скорее.
items.quest.corpsedust.discover_hint=Вы можете найти этот предмет во время определённого задания.

items.quest.darkgold.name=руда тёмного золота
items.quest.darkgold.you_now_have=Теперь у вас есть %d руды тёмного золота.
items.quest.darkgold.desc=Этот металл называется темным не из-за его цвета (который не отличается от обычного золота), а из-за того, что при воздействии солнечного света он плавится.\n\nДумаю, не стоит говорить, что темное золото не очень-то ценится городскими жителями.
items.quest.darkgold.discover_hint=Вы можете найти этот предмет во время определённого задания.

items.quest.dwarftoken.name=дворфский жетон
items.quest.dwarftoken.desc=По неизвестным причинам многие дворфы и некоторые из их творений носят с собой эти маленькие кусочки металла. Может быть, это какие-то украшения или опознавательные символы... Кто их поймет, этих бородатых.
items.quest.dwarftoken.discover_hint=Вы можете найти этот предмет во время определённого задания.

items.quest.embers.name=пепел элементаля
items.quest.embers.desc=Особый вид пепла, который можно получить только с молодых огненных элементалей. Даже сейчас он излучает тепло.
items.quest.embers.discover_hint=Вы можете найти этот предмет во время определённого задания.

items.quest.escapecrystal.name=кристалл побега
items.quest.escapecrystal.ac_use=ПРИМЕНИТЬ
items.quest.escapecrystal.desc=Тонкий магический кристалл, кажется, содержит телепортационную магию. Вы можете использовать его в любое время, чтобы покинуть убежище дворфов, но вы не сможете ничего с собой забрать!
items.quest.escapecrystal.discover_hint=Вы можете найти этот предмет во время определённого задания.

items.quest.gooblob.name=сгусток слизи
items.quest.gooblob.desc=Желеобразный комочек, оставшийся после Слизня. Похоже на большой желейный шарик, но вы бы не рискнули попробовать его на вкус.\n\nСам по себе он бесполезен, но может проявить свои свойства в комбинации с зельем или бомбой. В крайнем случае, его можно просто продать или конвертировать в энергетические кристаллы.
items.quest.gooblob.discover_hint=Вы можете получить этот предмет как трофей с определённых врагов.

items.quest.metalshard.name=проклятый осколок
items.quest.metalshard.desc=Ржавый осколок проклятого металла - это всё, что осталось от DM-300. Вы чувствуете в нём скрытую тёмную магию.\n\nСам по себе он бесполезен, но может проявить свои свойства в сочетании с бомбой или свитком. В крайнем случае, его можно просто продать или конвертировать в энергетические кристаллы.
items.quest.metalshard.discover_hint=Вы можете получить этот предмет как трофей с определённых врагов.

items.quest.pickaxe.name=кирка
items.quest.pickaxe.ability_name=пробить
items.quest.pickaxe.ability_desc=Дуэлянт может _пробить_ врага киркой. Это гарантирует попадание, добавляет уязвимость на 3 хода и наносит _%1$d-%2$d урона_ врагам с жёсткой кожей.
items.quest.pickaxe.upgrade_ability_stat_name=Урон Способности
items.quest.pickaxe.desc=Это прочный и тяжелый инструмент для дробления камней. Вам не нужно экипировать кирку, чтобы добывать при помощи неё, а в крайнем случае её можно использовать как оружие.
items.quest.pickaxe.discover_hint=Вы можете найти этот предмет во время определённого задания.

items.quest.ratskull.name=череп гигантской крысы
items.quest.ratskull.desc=Удивительно огромный крысиный череп. Из него вышел бы неплохой трофей, если бы вам было куда его вешать.



###remains
items.remains.remainsitem.ac_use=ПРИМЕНИТЬ
items.remains.remainsitem.discover_hint=Вы можете найти этот предмет в останках определённого героя с прошлого проигранного забега.

items.remains.bowfragment.name=частичка лука
items.remains.bowfragment.desc=Этот сломанный кусок древесины когда-то был частью Лука Духов, принадлежащего заблудшей Охотнице. Вы всё ещё чувствуете еле сохранившуюся крупицу энергии природы, которую вы можете использовать, чтобы вырастить вокруг вас высокую траву. Однако, это разрушит частичку лука.

items.remains.brokenhilt.name=сломанная рукоять
items.remains.brokenhilt.desc=Это сломанная рукоять, видимо, часть оружия, которое принадлежало побеждённой Дуэлянту. Вы всё ещё чувствуете частичку боевой энергии, которая осталась в этом эфесе, которую вы можете использовать, чтобы получить небольшой бонус к урону для следующих двух рукопашных атак. Однако, это уничтожит сломанную рукоять.

items.remains.brokenstaff.name=разломанный посох
items.remains.brokenstaff.desc=Этот Посох Мага был сломан пополам после того, как его владелец встретил свою кончину. Вы всё ещё чувствуете оставшиеся потоки магической энергии в этом посохе, которые вы можете использовать, чтобы дать вашим палочкам небольшой бонус к зарядке. Однако, это уничтожит разломанный посох.

items.remains.cloakscrap.name=обрывок ткани
items.remains.cloakscrap.desc=Этот кусок полупрозрачной ткани явно раньше принадлежал Плащу Теней Разбойника. Вы всё ещё ощущаете загадочную энергию, циркулирующую по нему, которую вы можете использовать, чтобы дать вашим артефактам небольшой бонус к зарядке. Однако, это уничтожит обрывок ткани.

items.remains.sealshard.name=осколки печати
items.remains.sealshard.desc=Эти мелкие осколки красного воска, вероятно, когда-то были печатью павшего Воина. Вы всё ещё ощущаете часть воли, заключённой в печати, которую вы можете использовать, чтобы создать немного защиты поверх здоровья. Однако это уничтожит осколки печати.

items.remains.tornpage.name=вырванная страница
items.remains.tornpage.desc=Эта страница выглядит так, как будто её вырвали из исчерпанного священного тома Клирика. На ней всё ещё остаётся немного божественной энергии, которую можно использовать, чтобы восстановить немного здоровья. Однако использование этой энергии приведет к уничтожению разорванной страницы.



###rings
items.rings.ring.diamond=кольцо с бриллиантом
items.rings.ring.opal=кольцо с опалом
items.rings.ring.garnet=кольцо с гранатом
items.rings.ring.ruby=кольцо с рубином
items.rings.ring.amethyst=кольцо с аметистом
items.rings.ring.topaz=кольцо с топазом
items.rings.ring.onyx=кольцо с ониксом
items.rings.ring.tourmaline=кольцо с турмалином
items.rings.ring.emerald=кольцо с изумрудом
items.rings.ring.sapphire=кольцо с сапфиром
items.rings.ring.quartz=кольцо с кварцем
items.rings.ring.agate=кольцо с агатом
items.rings.ring.equip_cursed=Кольцо болезненно сжимает ваш палец!
items.rings.ring.unknown_desc=Эта круглая полоска металла украшена сверкающим драгоценным камнем. Кто знает, что будет, если её надеть?
items.rings.ring.known=Это %s
items.rings.ring.identify=Вы достаточно долго знакомы с кольцом, чтобы опознать его.
items.rings.ring.cursed_worn=Ваше кольцо проклято, вы не в силах его снять.
items.rings.ring.curse_known=Вы чувствуете, что это кольцо скрывает в себе какую-то темную магию.
items.rings.ring.not_cursed=Это кольцо не проклято.

items.rings.ringofaccuracy.name=кольцо меткости
items.rings.ringofaccuracy.stats=Пока это кольцо надето, оно будет увеличивать точность на _%s%%._
items.rings.ringofaccuracy.typical_stats=Пока это кольцо надето, оно должно будет увеличивать точность на _%s%%._
items.rings.ringofaccuracy.combined_stats=Ваши надетые кольца объединили свою силу и теперь вместе увеличивают точность на _%s%%._
items.rings.ringofaccuracy.upgrade_stat_name_1=Усиление Меткости
items.rings.ringofaccuracy.desc=Это кольцо повышает вашу сосредоточенность, снижая шансы врагов уклониться от атаки. Проклятое кольцо, напротив, будут увеличивать шанс промахнуться.

items.rings.ringofarcana.name=кольцо волшебства
items.rings.ringofarcana.stats=Пока это кольцо надето, оно будет увеличивать силу зачарований и рун на _%s %%._
items.rings.ringofarcana.typical_stats=Пока это кольцо надето, оно обычно увеличивает силу зачарований и рун на _%s%%._
items.rings.ringofarcana.combined_stats=Ваши надетые кольца объединили свою силу и теперь вместе увеличивают силу зачарований и рун на _%s%%._
items.rings.ringofarcana.upgrade_stat_name_1=Усиление Волшебства
items.rings.ringofarcana.desc=Это кольцо усиливает магические зачарования на оружии и руны на броне, включая проклятия! Сначала это увеличивает шанс активации, а затем увеличивает силу эффекта, как только шанс активации достигает 100%. Вместо этого проклятое кольцо ослабит зачарования, руны и проклятия.

items.rings.ringofelements.name=кольцо стихий
items.rings.ringofelements.stats=Пока это кольцо надето, оно будет давать _%s%%_ защиты от стихий.
items.rings.ringofelements.typical_stats=Пока это кольцо надето, оно должно будет давать _%s%%_ защиты от стихий.
items.rings.ringofelements.combined_stats=Ваши надетые кольца объединили свою силу и теперь вместе дают _%s%%_ защиты от стихий.
items.rings.ringofelements.upgrade_stat_name_1=Сопротивление
items.rings.ringofelements.desc=Это кольцо обеспечивает сопротивление большинству стихийных и магических эффектов, уменьшая урон и длительность дебаффов. Естественно, проклятое кольцо вместо этого усилит силу негативных эффектов.

items.rings.ringofenergy.name=кольцо энергии
items.rings.ringofenergy.stats=При ношении это кольцо увеличит скорость заряда палочек, артефактов и героической брони на _%s%%._
items.rings.ringofenergy.typical_stats=При ношении это кольцо обычно увеличивает скорость заряда палочек, артефактов и героической брони на _%s%%._
items.rings.ringofenergy.combined_stats=Ваши надетые кольца объединили свою силу и теперь вместе увеличивают скорость зарядов на _%s%%._
items.rings.ringofenergy.upgrade_stat_name_1=Усиление Зарядки
items.rings.ringofenergy.desc=Ваше магическое снаряжение будет быстрее заряжаться в магическом поле, излучаемом этим кольцом. Вместо этого проклятое кольцо замедлит перезарядку.

items.rings.ringofevasion.name=кольцо уклонения
items.rings.ringofevasion.stats=Пока это кольцо надето, оно будет увеличивать ваш шанс увернуться на _%s%%._
items.rings.ringofevasion.typical_stats=Пока это кольцо надето, оно должно будет увеличивать ваш шанс увернуться на _%s%%._
items.rings.ringofevasion.combined_stats=Ваши надетые кольца объединили свою силу и теперь вместе увеличивают ваш шанс увернуться на _%s%%._
items.rings.ringofevasion.upgrade_stat_name_1=Усиление Уклонения
items.rings.ringofevasion.desc=Это кольцо ускоряет реакцию владельца, и по нему становится сложнее попасть. Проклятое кольцо, наоборот, понижает шанс увернуться.

items.rings.ringofforce.name=кольцо урона
items.rings.ringofforce.stats=При вашей текущей силе, если вы безоружны, это кольцо будет наносить _%1$d-%2$d урона,_ а если вы вооружены, урон вашего оружия увеличится на _%3$d._
items.rings.ringofforce.typical_stats=При вашей текущей силе, если вы безоружны, это кольцо должно будет наносить _%1$d-%2$d урона,_ а если вы вооружены, урон вашего оружия должен увеличиться на _%3$d._
items.rings.ringofforce.combined_stats=Ваши надетые кольца объединили свою силу и теперь вместе будут наносить _%1$d-%2$d урона_ если вы безоружны или увеличат урон на _%3$d_ если вы вооружены.
items.rings.ringofforce.upgrade_stat_name_1=Безоружный Урон
items.rings.ringofforce.upgrade_stat_name_2=Усиление Урона Оружием
items.rings.ringofforce.upgrade_stat_name_3=Урон Способности
items.rings.ringofforce.ability_name=боевая стойка
items.rings.ringofforce.typical_ability_desc=Дуэлянт может встать в _боевую стойку_ при помощи кольца урона. Пока Дуэлянт находится в стойке, её атаки будут использовать кольцо урона, даже с экипированным оружием. Эти атаки обычно наносят _%1$d-%2$d урона_, а так же перенимают эффект камня баланса и зачарование оружия. Стойка замедляет восстановление зарядов оружия на 50%%.
items.rings.ringofforce.ability_desc=Дуэлянт может встать в _боевую стойку_ при помощи кольца урона. Пока Дуэлянт находится в стойке, её атаки будут использовать кольцо урона, даже с экипированным оружием. Эти атаки наносят _%1$d-%2$d урона_, а так же перенимают эффект камня баланса и зачарование оружия. Стойка замедляет восстановление зарядов оружия на 50%%.
items.rings.ringofforce.desc=Это кольцо увеличивает силу ударов владельца. Эффект не так значителен при использовании оружия, но при атаке голыми руками вы будете наносить значительно больший урон. Проклятое же кольцо, напротив, ослабит удары.
items.rings.ringofforce$brawlersstance.name=боевая стойка
items.rings.ringofforce$brawlersstance.desc=Находясь в стойке, обычные атаки Дуэлянта будут использовать экипированное Кольцо Урона даже если у неё экипировано оружие. Атаки получат дополнительный урон и будут подвержены эффектам Камня Баланса и зачарованиям оружия.\n\nПоддержание стойки помогает сфокусироваться, но уменьшает скорость перезарядки зарядов оружия на 50%.\n\nМожно встать и выйти из стойки используя Кольцо Урона, но уменьшение скорости перезарядки будет наложено даже если стойка была быстро активирована и деактивирована.

items.rings.ringoffuror.name=кольцо неистовства
items.rings.ringoffuror.stats=Пока это кольцо надето, оно будет увеличивать скорость ваших атак на _%s%%._
items.rings.ringoffuror.typical_stats=Пока это кольцо надето, оно должно будет увеличивать скорость ваших атак на _%s%%._
items.rings.ringoffuror.combined_stats=Ваши надетые кольца объединили свою силу и теперь вместе увеличивают скорость ваших атак на _%s%%._
items.rings.ringoffuror.upgrade_stat_name_1=Усиление Скорости Атаки
items.rings.ringoffuror.desc=Это кольцо порождает во владельце ярость, позволяя ему наносить удары быстрее, чем обычно. Проклятое же кольцо, напротив, будет замедлять атаки.

items.rings.ringofhaste.name=кольцо ускорения
items.rings.ringofhaste.stats=Пока это кольцо надето, оно будет увеличивать скорость передвижения на _%s%%._
items.rings.ringofhaste.typical_stats=Пока это кольцо надето, оно должно будет увеличивать скорость передвижения на _%s%%._
items.rings.ringofhaste.combined_stats=Ваши надетые кольца объединили свою силу и теперь вместе увеличивают скорость передвижения на _%s%%._
items.rings.ringofhaste.upgrade_stat_name_1=Усиление Скорости Передвижения
items.rings.ringofhaste.desc=Это кольцо снижает утомление от бега и даёт владельцу способность перемещаться быстрее человеческих возможностей. Проклятое же кольцо, напротив, уменьшает скорость передвижения.

items.rings.ringofmight.name=кольцо мощи
items.rings.ringofmight.stats=Пока это кольцо надето, оно будет увеличивать вашу силу на _%1$d_ и максимальное количество здоровья на _%2$s%%._
items.rings.ringofmight.typical_stats=Пока это кольцо надето, оно должно будет увеличивать вашу силу на _%1$d_ и максимальное количество здоровья на _%2$s%%._
items.rings.ringofmight.combined_stats=Ваши надетые кольца объединили свою силу и теперь вместе увеличивают вашу силу на _%1$d_ и максимальное количество здоровья на _%2$s%%._
items.rings.ringofmight.upgrade_stat_name_1=Усиление силы
items.rings.ringofmight.upgrade_stat_name_2=Усиление макс. ОЗ
items.rings.ringofmight.desc=Это кольцо улучшает физические параметры своего владельца, даруя ему повышенную силу и выносливость. Проклятое же кольцо, напротив, снижает силу и здоровье владельца.

items.rings.ringofsharpshooting.name=кольцо стрельбы
items.rings.ringofsharpshooting.stats=Пока это кольцо надето, оно будет увеличивать урон от ваших метательных оружий настолько, будто их уровень увеличен на _%1$d_, и их прочность будет увеличена на _%2$s%%._
items.rings.ringofsharpshooting.typical_stats=Пока это кольцо надето, оно должно будет увеличивать урон от ваших метательных оружий настолько, будто их уровень увеличен на _%1$d_, и их прочность будет увеличена на _%2$s%%._
items.rings.ringofsharpshooting.combined_stats=Ваши надетые кольца объединили свою силу и теперь вместе увеличивают урон от ваших метательных оружий настолько, будто их уровень увеличен на _%1$d_, и их прочность будет увеличена на _%2$s%%._
items.rings.ringofsharpshooting.upgrade_stat_name_1=Повышение уровня урона
items.rings.ringofsharpshooting.upgrade_stat_name_2=Усиление прочности
items.rings.ringofsharpshooting.desc=Это кольцо улучшает меткость и глазомер владельца, увеличивая урон и срок службы любых метательных оружий. Проклятое кольцо даёт обратный эффект.

items.rings.ringoftenacity.name=кольцо живучести
items.rings.ringoftenacity.stats=Пока это кольцо надето, оно будет снижать получаемый урон не более чем на _%s%%_.
items.rings.ringoftenacity.typical_stats=Пока это кольцо надето, оно должно будет снижать получаемый урон не более чем на _%s%%._
items.rings.ringoftenacity.combined_stats=Ваши надетые кольца объединили свою силу и теперь вместе снижают получаемый урон не более чем на _%s%%._
items.rings.ringoftenacity.upgrade_stat_name_1=Максимальное сопротивление к урону
items.rings.ringoftenacity.desc=Будучи надетым, это кольцо позволит владельцу переживать ранения, которые в ином случае стали бы для него смертельными. Чем сильнее ранен владелец, тем сильнее будет этот эффект. Проклятое же кольцо, напротив, будет делать владельца более уязвимым к добиванию.

items.rings.ringofwealth.name=кольцо богатства
items.rings.ringofwealth.stats=Пока это кольцо надето, оно будет увеличивать вашу удачу на _%s%%._
items.rings.ringofwealth.typical_stats=Пока это кольцо надето, оно должно будет увеличивать вашу удачу на _%s%%._
items.rings.ringofwealth.combined_stats=Ваши надетые кольца объединили свою силу и теперь вместе увеличивают вашу удачу на _%s%%._
items.rings.ringofwealth.upgrade_stat_name_1=Усиление удачи
items.rings.ringofwealth.desc=Это кольцо действует как магнит для сокровищ, увеличивая вероятность того, что враги и сундуки будут содержать ценные предметы. Проклятое кольцо, вместо этого, уменьшит ваши шансы получить добычу.



###scrolls
items.scrolls.scroll.ac_read=ЧИТАТЬ
items.scrolls.scroll.kaunan=свиток КЕНАЗ
items.scrolls.scroll.sowilo=свиток СОВИЛО
items.scrolls.scroll.laguz=свиток ЛАГУЗ
items.scrolls.scroll.yngvi=свиток ИНГУЗ
items.scrolls.scroll.gyfu=свиток ГЕБО
items.scrolls.scroll.raido=свиток РАЙДО
items.scrolls.scroll.isaz=свиток ИСА
items.scrolls.scroll.mannaz=свиток МАННАЗ
items.scrolls.scroll.naudiz=свиток НАУТИЗ
items.scrolls.scroll.berkanan=свиток БЕРКАНА
items.scrolls.scroll.odal=свиток ОДАЛ
items.scrolls.scroll.tiwaz=свиток ТЕЙВАЗ
items.scrolls.scroll.unknown_desc=Этот манускрипт покрыт непонятными письменами, озаглавленными неизвестной вам руной. Кто знает, что будет, если прочитать его вслух?
items.scrolls.scroll.blinded=Вы ослеплены и не можете разобрать, что написано на этом свитке.
items.scrolls.scroll.no_magic=Вы не можете использовать свитки под действием антимагии.
items.scrolls.scroll.cursed=Ваша проклятая нестабильная книга заклинаний не дает вам использовать силу этого свитка! Возможно, свиток Рассеяния все равно сможет сработать...
items.scrolls.scroll$placeholder.name=свиток

items.scrolls.inventoryscroll.warning=Вы действительно хотите отменить использование этого свитка? Он все равно будет истрачен, так как не был опознан.
items.scrolls.inventoryscroll.yes=Да, я уверен
items.scrolls.inventoryscroll.no=Нет, я передумал

items.scrolls.scrollofidentify.name=свиток Опознания
items.scrolls.scrollofidentify.inv_title=Какой предмет опознать?
items.scrolls.scrollofidentify.it_is=Ваш предмет был опознан: %s.
items.scrolls.scrollofidentify.desc=Этот свиток способен навсегда открыть все тайны одного предмета.

items.scrolls.scrolloflullaby.name=свиток Колыбельной
items.scrolls.scrolloflullaby.sooth=В воздухе раздается убаюкивающая мелодия. Вы чувствуете, что хотите спать.
items.scrolls.scrolloflullaby.desc=Чтение этого свитка вслух вызывает тихую мелодию, которая погрузит всех, кто её слышал, в глубокий волшебный сон. Для прочитавшего этот свиток и его союзников, этот сон будет оздоровляющим.

items.scrolls.scrollofmagicmapping.name=свиток Магической карты
items.scrolls.scrollofmagicmapping.layout=Теперь вы знакомы с планировкой этого уровня.
items.scrolls.scrollofmagicmapping.desc=После прочтения этого свитка в ваш разум впишется ясная картина уровня. Вам станут известны все коридоры и ловушки, в том числе скрытые. Однако местоположение предметов и существ останется неизвестным.

items.scrolls.scrollofmirrorimage.name=свиток Зеркальных копий
items.scrolls.scrollofmirrorimage.copies=Свиток сформировал зеркальные копии по вашему образу и подобию.
items.scrolls.scrollofmirrorimage.no_copies=Свиток пытается воссоздать по вашему образу зеркальные копии, но им негде появиться.
items.scrolls.scrollofmirrorimage.desc=При использовании, этот свиток создаст две зеркальных копии прочитавшего. Эти иллюзии слабее оригинала, но будут существовать до тех пор, пока не получат урон.

items.scrolls.scrollofretribution.name=свиток Возмездия
items.scrolls.scrollofretribution.blast=Свиток извергает мощную магическую энергию!
items.scrolls.scrollofretribution.desc=Этот свиток содержит могущественную магию, способную передавать свои страдания всем окружающим. Сила эффекта зависит от того, насколько мало здоровья осталось у читающего, и в крайних случаях может даже мгновенно убить большинство врагов.\n\nОднако использование свитка не проходит без последствий, ослепляя и ослабляя прочитавшего.

items.scrolls.scrollofrage.name=свиток Ярости
items.scrolls.scrollofrage.roar=Свиток издаёт яростный рёв, эхом отдающийся в подземелье!
items.scrolls.scrollofrage.desc=При прочтении вслух этот свиток издаст яростный рёв, привлекающий внимание врагов и вводящий в ярость тех, кто уже здесь.

items.scrolls.scrollofrecharging.name=свиток Перезарядки
items.scrolls.scrollofrecharging.surge=Сквозь ваше тело проходит поток энергии, заряжая ваши палочки!
items.scrolls.scrollofrecharging.desc=В этом свитке заключена чистая магическая энергия, которая при высвобождении начнёт постепенно заряжать все палочки прочитавшего.

items.scrolls.scrollofremovecurse.name=свиток Рассеяния проклятия
items.scrolls.scrollofremovecurse.inv_title=Какой предмет очищать?
items.scrolls.scrollofremovecurse.cleansed=Ваш предмет окутывает сияние, и тёмная энергия покидает его!
items.scrolls.scrollofremovecurse.not_cleansed=Ваш предмет окутывает сияние, но ничего не происходит.
items.scrolls.scrollofremovecurse.spirit=Ваш свиток освобождает измученного призрака!
items.scrolls.scrollofremovecurse.desc=Магия этого свитка позволит снять проклятие с одного оружия, кольца, палочки, доспеха или артефакта.

items.scrolls.scrollofteleportation.name=свиток Телепортации
items.scrolls.scrollofteleportation.tele=В мгновенье ока вы оказываетесь в другом месте уровня.
items.scrolls.scrollofteleportation.no_tele=Телепортация не удалась.
items.scrolls.scrollofteleportation.cant_reach=Вы не можете телепортироваться сюда.
items.scrolls.scrollofteleportation.prompt=Куда телепортироваться?
items.scrolls.scrollofteleportation.desc=Магия этого свитка мгновенно переносит прочитавшего в случайную локацию на этом же этаже. Свиток чаще всего переносит в те места, в которых прочитавший ещё не был до этого, но не может телепортировать за закрытые двери или баррикады. Он, однако, способен показать скрытые двери, которые ведут в новые области.

items.scrolls.scrollofterror.name=свиток Ужаса
items.scrolls.scrollofterror.none=Свиток излучает яркий красный свет.
items.scrolls.scrollofterror.one=Свиток излучает яркий красный свет, и %s убегает!
items.scrolls.scrollofterror.many=Свиток излучает яркий красный свет, и монстры убегают!
items.scrolls.scrollofterror.desc=Вспышка красного света наполнит всех видимых существ ужасом и они попытаются убежать. Любой удар по убегающему врагу ослабит этот эффект.

items.scrolls.scrolloftransmutation.name=свиток Превращения
items.scrolls.scrolloftransmutation.inv_title=Превратить предмет
items.scrolls.scrolloftransmutation.nothing=Ничего не произошло.
items.scrolls.scrolloftransmutation.morph=Ваш предмет превращается во что-то другое!
items.scrolls.scrolloftransmutation.desc=Этот свиток содержит могущественное заклинание превращения. Если использовать на подходящем предмете, свиток превратит его в другой предмет такого же типа. При этом сохранятся все улучшения и зачарования. Свитки и зелья будут превращены в их особый эквивалент или в обратную сторону.

items.scrolls.scrollofupgrade.name=свиток Улучшения
items.scrolls.scrollofupgrade.inv_title=Какой предмет улучшить?
items.scrolls.scrollofupgrade.weaken_curse=Свиток улучшения ослабляет проклятие на этом предмете.
items.scrolls.scrollofupgrade.remove_curse=Свиток улучшения развеивает проклятие на этом предмете!
items.scrolls.scrollofupgrade.desc=Этот свиток улучшит один предмет или комплект метательного оружия. У палочки возрастёт мощь и количество зарядов, оружие и броня будут наносить и поглощать больше урона, комплекты метательного оружия будут полностью восстановлены и станут более прочными, а эффективность колец увеличится.\n\nЭтот свиток способен ослабить или даже снять проклятие, хотя он и не столь эффективен, как свиток Рассеяния проклятия. Магия этого свитка, к сожалению, способна снять зачарование на оружии или рун на брони более высоких уровней.



###exotic scrolls
items.scrolls.exotic.exoticscroll.kaunan=особый свиток КЕНАЗ
items.scrolls.exotic.exoticscroll.sowilo=особый свиток СОВИЛО
items.scrolls.exotic.exoticscroll.laguz=особый свиток ЛАГУЗ
items.scrolls.exotic.exoticscroll.yngvi=особый свиток ИНГУЗ
items.scrolls.exotic.exoticscroll.gyfu=особый свиток ГЕБО
items.scrolls.exotic.exoticscroll.raido=особый свиток РАЙДО
items.scrolls.exotic.exoticscroll.isaz=особый свиток ИСА
items.scrolls.exotic.exoticscroll.mannaz=особый свиток МАННАЗ
items.scrolls.exotic.exoticscroll.naudiz=особый свиток НАУТИЗ
items.scrolls.exotic.exoticscroll.berkanan=особый свиток БЕРКАНА
items.scrolls.exotic.exoticscroll.odal=особый свиток ОДАЛ
items.scrolls.exotic.exoticscroll.tiwaz=особый свиток ТЕЙВАЗ
items.scrolls.exotic.exoticscroll.unknown_desc=Этот чёрный манускрипт покрыт непонятными светящимися письменами и совсем не похож на обычные свитки. Кто знает, что будет, если прочитать его вслух?
items.scrolls.exotic.exoticscroll.discover_hint=Вы можете создать этот предмет с помощью алхимии.

items.scrolls.exotic.scrollofsirenssong.name=свиток Песни Сирены
items.scrolls.exotic.scrollofsirenssong.prompt=Выберите цель
items.scrolls.exotic.scrollofsirenssong.no_target=Свиток был использован без цели.
items.scrolls.exotic.scrollofsirenssong.cancel=Нужно выбрать цель.
items.scrolls.exotic.scrollofsirenssong.desc=После чтения этого свитка раздастся приятная мелодия, которая зачарует и превратить одного выбранного противника в вашего постоянного союзника! Остальные враги, услышавшие мелодию, будут временно очарованы.\n\nОднако, сильные противники могут противостоять этому эффекту. При выборе их в качестве цели они будут просто очарованы.
items.scrolls.exotic.scrollofsirenssong$enthralled.name=зачарованный
items.scrolls.exotic.scrollofsirenssong$enthralled.desc=Это существо было околдовано магией свитка очарования.\n\nТеперь это существо - ваш союзник и оно будет сражаться за вас.

items.scrolls.exotic.scrollofantimagic.name=свиток Антимагии
items.scrolls.exotic.scrollofantimagic.desc=Заклинание в этом свитке окружит вас волшебной аурой, временно блокирующей любые вредные и полезные магические эффекты. Это включает большинство эффектов магических предметов, таких как палочки, свитки, кольца, артефакты, зачарования и проклятия. Однако способности героической брони настолько сильные, что могут работать даже под воздействием этого эффекта.

items.scrolls.exotic.scrollofchallenge.name=свиток Вызова
items.scrolls.exotic.scrollofchallenge.desc=Когда прочтён, свиток издаст громкий рёв, который привлечёт врагов к прочитавшему, создавая тем временем маленькую арену вокруг него.\n\nПока прочитавший остаётся в этой арене, он будет получать на 33% меньше урона от всех источников оного (это сопротивление будет учитываться перед всеми остальными формами сопротивлению урона), и не будет терять сытости.\n\nРазмер арены будет зависеть от размера комнаты, в котором находится прочитавший. Размер будет особенно меньше в комнатах некоторых боссов.
items.scrolls.exotic.scrollofchallenge$challengearena.name=арена вызова
items.scrolls.exotic.scrollofchallenge$challengearena.desc=Магическая арена появилась вокруг вас, очерченную клубящимся красным туманом.\n\nПока вы стоите в тумане, ваш голод не будет увеличиваться и вы будете получать на 33%% меньше урона от всех источников оного. Если у вас есть другое сопротивление урону (например, броня), оно будет учитываться после 33%% сопротивления.\n\nХодов осталось: %d.

items.scrolls.exotic.scrollofdivination.name=свиток Предсказания
items.scrolls.exotic.scrollofdivination.nothing_left=Больше нечего опознавать!
items.scrolls.exotic.scrollofdivination.desc=Этот свиток опознает четыре случайных неопознанных предмета. Это может быть цвет зелья, руна свитка или камень кольца. Опознанные предметы необязательно будут предметами из вашего инвентаря.
items.scrolls.exotic.scrollofdivination$wnddivination.desc=Ваш свиток предсказания распознал следующие предметы:

items.scrolls.exotic.scrollofdread.name=свиток Кошмара
items.scrolls.exotic.scrollofdread.desc=Когда прочтён, свиток выпустит волну красного света, которая внушит неописуемый ужас всем врагам в поле зрения. Эффект настолько сильный, что враги попытаются удрать из подземелья без оглядки!\n\nТак же как и ужас, этот эффект ослабевает со временем, или когда враг атакован.\n\nНа врагов с сильной волей, например боссов, будет наложен обычный ужас.

items.scrolls.exotic.scrollofenchantment.name=свиток Зачарования
items.scrolls.exotic.scrollofenchantment.inv_title=Зачаровать предмет
items.scrolls.exotic.scrollofenchantment.weapon=Выберите, какое зачарование применить к вашему оружию.
items.scrolls.exotic.scrollofenchantment.armor=Выберите, какую руну нанести на вашу броню.
items.scrolls.exotic.scrollofenchantment.cancel=Отменить
items.scrolls.exotic.scrollofenchantment.cancel_warn=При отмене свиток зачарования будет истрачен зря, вы уверены?
items.scrolls.exotic.scrollofenchantment.cancel_warn_yes=Да, я уверен
items.scrolls.exotic.scrollofenchantment.cancel_warn_no=Нет, я передумал
items.scrolls.exotic.scrollofenchantment.desc=Этот свиток наполнит оружие или броню мощной волшебной энергией. Прочитавший даже сможет в некоторой степени контролировать тип накладываемого зачарования.

items.scrolls.exotic.scrollofforesight.name=свиток Предвидения
items.scrolls.exotic.scrollofforesight.desc=В разум прочитавшего этот свиток с предельной ясностью начнет поступать информация об окружающей местности. Это позволит автоматически обнаруживать любые секреты в радиусе своего поиска.

items.scrolls.exotic.scrollofmetamorphosis.name=свиток Метаморфозы
items.scrolls.exotic.scrollofmetamorphosis.choose_desc=Выберите талант для преобразования.
items.scrolls.exotic.scrollofmetamorphosis.replace_desc=Выберите новый талант на замену преобразованному.
items.scrolls.exotic.scrollofmetamorphosis.cancel_warn=При отмене свиток превращения будет истрачен зря, вы уверены?
items.scrolls.exotic.scrollofmetamorphosis.metamorphose_talent=Преобразовать талант
items.scrolls.exotic.scrollofmetamorphosis.desc=Этот свиток содержит мощную магию трансмутации, которая будет применена к заклинателю вместо предмета. Магия этого свитка позволит вам выбрать талант и заменить его одним из пяти талантов других классов такого же уровня.\n\nЭтот эффект может применяться только к талантам класса, не талантам подклассов или способностям брони. Таланты, которые вы не можете использовать не будут даны для выбора.

items.scrolls.exotic.scrollofmysticalenergy.name=свиток Мистической энергии
items.scrolls.exotic.scrollofmysticalenergy.desc=Необузданная магическая сила, заключенная в этом манускрипте, при высвобождении будет в течение некоторого времени заряжать экипированные артефакты.

items.scrolls.exotic.scrollofpassage.name=свиток Прохода
items.scrolls.exotic.scrollofpassage.desc=Заклинание на этом пергаменте мгновенно переносит читателя в ближайшую область на первом этаже над ними. Очень удобно для быстрого доступа в магазин.

items.scrolls.exotic.scrollofprismaticimage.name=свиток Зеркальной копии
items.scrolls.exotic.scrollofprismaticimage.desc=Заклятие в этом свитке создаст радужную копию прочитавшего. Эта иллюзия имеет меньший урон и живучесть, но примерно такую же защиту, что и оригинал.\n\nКопия появляется только при встрече с врагами, скрываясь из виду всё остальное время.\n\nЕсли радужная копия уже существует, она будет полностью исцелена.

items.scrolls.exotic.scrollofpsionicblast.name=свиток Ментального удара
items.scrolls.exotic.scrollofpsionicblast.ondeath=Ментальный удар разрывает ваш разум...
items.scrolls.exotic.scrollofpsionicblast.desc=Этот свиток содержит невероятную разрушительную энергию, которая может быть направлена на уничтожение разумов видимых существ.\n\nОтдача, однако, настолько велика, что прочитавший также получит урон, будет ослеплён и ослаблен. Чем больше целей поразит свиток, тем меньше урона будет получено.



###spells
items.spells.alchemize.name=Трансмутация
items.spells.alchemize.prompt=Расщепить предмет
items.spells.alchemize.desc=Это заклинание содержит силы трансмутации, схожие с иными в алхимическом котле. Каждое заклинание позволяет превратить предмет (или несколько предметов) в золото или алхимическую энергию. Превращение зелий или свитков в энергию опознаёт их!\n\nНесколько готовых заклинаний Трансмутации продаётся в магазинах, но намного больше можно сделать с помощью алхимии, соединив в котле семя, рунный камень и немного алхимической энергии.
items.spells.alchemize$wndalchemizeitem.sell=Превратить в %d золота
items.spells.alchemize$wndalchemizeitem.sell_1=Превратить 1 в %d золота
items.spells.alchemize$wndalchemizeitem.sell_all=Превратить всё в %d золота
items.spells.alchemize$wndalchemizeitem.energize=Превратить в %d энергии
items.spells.alchemize$wndalchemizeitem.energize_1=Превратить 1 в %d энергии
items.spells.alchemize$wndalchemizeitem.energize_all=Превратить всё в %d энергии

items.spells.beaconofreturning.name=Маяк возвращения
items.spells.beaconofreturning.preventing=Сильная магия этого места не позволяет вам использовать заклинание!
items.spells.beaconofreturning.creatures=Психическая аура близлежащих существ не позволяет вам телепортироваться.
items.spells.beaconofreturning.set=Маяк был установлен в данном месте.
items.spells.beaconofreturning.wnd_body=Установка перезапишет место установки.\n\nВозвращение вернёт вас в последнее установленное место.
items.spells.beaconofreturning.wnd_set=Установить
items.spells.beaconofreturning.wnd_return=Вернуться
items.spells.beaconofreturning.desc_set=Маяк установлен где-то на %d этаже.
items.spells.beaconofreturning.desc=Это сложное заклинание позволит пользователю вернуться в установленную местность, вне зависимости от расстояния. Заклинание тратится только при возвращении, оно может быть установлено сколько угодно раз. Но помните, что оно вернёт вас только в последнюю установленную точку.

items.spells.curseinfusion.name=Проклятие
items.spells.curseinfusion.inv_title=Проклясть предмет
items.spells.curseinfusion.desc=Это заклинание наделит предмет вашей экипировки той же тёмной магией, что когда-то жила в DM-300. Любые зачарования или руны будут развеяны, а предмет станет проклят.\n\nОружия, доспехи и палочки при этом получат бонусы к уровню улучшения, но этот бонус исчезнет, если снять проклятие с предмета. Этот бонус нельзя применить повторно.\n\nЕго также можно использовать для изменения самого типа проклятия на оружии или доспехе.

items.spells.spell.ac_cast=ПРИМЕНИТЬ
items.spells.spell.no_magic=Вы не можете использовать заклинания под действием антимагии.
items.spells.spell.discover_hint=Вы можете создать этот предмет с помощью алхимии.

items.spells.magicalinfusion.name=Зачарование
items.spells.magicalinfusion.inv_title=Какой предмет зачаровать?
items.spells.magicalinfusion.infuse=Ваш предмет наполнен мистической энергией!
items.spells.magicalinfusion.desc=Это заклинание практически аналогично свитку улучшения, но его энергия более стабильна.\n\nПри улучшении этим заклинанием оружия или доспеха, оно никогда не сотрет зачарование, руну или проклятье.

items.spells.magicalporter.name=Транспортация
items.spells.magicalporter.inv_title=Переместить предмет
items.spells.magicalporter.nowhere=Тебе некуда переносить предмет.
items.spells.magicalporter.desc=Это заклинание позволяет телепортировать любую вещь, но не к торговцу, а ко входу на этаже следующего босса.

items.spells.phaseshift.name=Искажение
items.spells.phaseshift.no_target=Здесь нечего телепортировать.
items.spells.phaseshift.desc=Это хаотичное заклинание телепортирует свою цель в случайную точку этажа и оглушит её на продолжительный период. Однако, сильные враги, оглушение не получат. Оно может быть направлено как на себя, так и на кого-то другого.

items.spells.reclaimtrap.name=Конвертация
items.spells.reclaimtrap.no_trap=Тут нет ловушек.
items.spells.reclaimtrap.desc_trap=Сейчас это заклинание готово к активации _%s._
items.spells.reclaimtrap.desc=Это заклинание содержит остатки механической энергии DM-300. При использовании на активную ловушку, сила ловушки прикрепляется к вам, что позволяет использовать заклинание снова для высвобождения этой силы и активации эффекта ловушки в любом месте, на ваш выбор.\n\nТем не менее, некоторые ловушки могут не работать в некоторых местах, и можно хранить только одну ловушку за раз.

items.spells.recycle.name=Переработка
items.spells.recycle.inv_title=Переработать предмет
items.spells.recycle.recycled=Предмет был переработан в: %s.
items.spells.recycle.desc=Заклинание содержит слабую версию магии трансмутации. Пускай это не работает на экипировке, это заклинание может превратить свиток, зелье, семя, рунный камень или дротик с наконечником в случайный предмет того же типа.

items.spells.summonelemental.name=вызов элементаля
items.spells.summonelemental.ac_imbue=НАДЕЛИТЬ
items.spells.summonelemental.imbue_prompt=Наделить предмет
items.spells.summonelemental.desc=Это заклинание проводит энергию элементального пепла, использованного при изготовлении, и позволяет вам призвать союзного элементаля сражаться за вас! Только один элементаль может существовать одновременно, но заклинание можно использовать снова, чтобы призвать элементаля к вам.
items.spells.summonelemental.desc_newborn=Заклинание в данный момент не наделено, и призовёт _молодого элементаля_ без дальнобойной атаки. Вы можете использовать опознанное Зелье Алхимического огня, Зелье Холода, Свиток Перезарядки или Свиток Превращения, для наполнения заклинания, чтобы в будущем призывать сильного элементаля!
items.spells.summonelemental.desc_fire=Заклинание сейчас горячее на ощупь. Оно будет вызывать _огненного элементаля_. Вы можете наделить заклинание другим предметом, но оно потеряет текущее наполнение.
items.spells.summonelemental.desc_frost=Заклинание сейчас холодное на ощупь. Оно будет вызывать _ледяного элементаля_. Вы можете наделить заклинание другим предметом, но оно потеряет текущее наполнение.
items.spells.summonelemental.desc_shock=Заклинание сейчас излучает статическую энергию. Оно будет вызывать _электрического элементаля_. Вы можете наделить заклинание другим предметом, но оно потеряет текущее наполнение.
items.spells.summonelemental.desc_chaos=Заклинание сейчас излучает хаотическую энергию. Оно будет вызывать _хаотического элементаля_. Вы можете наделить заклинание другим предметом, но оно потеряет текущее наполнение.

items.spells.targetedspell.prompt=Выберите цель
items.spells.targetedspell.inv_title=Какой предмет зачаровать?

items.spells.telekineticgrab.name=Телекинетический захват
items.spells.telekineticgrab.cant_grab=Вы не можете схватить это.
items.spells.telekineticgrab.no_target=Здесь нечего хватать.
items.spells.telekineticgrab.desc=Это заклинание позволяет захватывать все объекты на расстоянии или даже все застрявшее во враге метательное оружие!\n\nНо его нельзя использовать на чужих предметах или сундуках.

items.spells.unstablespell.name=нестабильное заклинание
items.spells.unstablespell.desc=Это маленький черный квадратный кристалл с движущимися руническими символами, начертанными на каждой из его поверхностей.\n\nПри активации он вызывает эффект случайного свитка. Эффект свитка всегда будет ориентирован на сражение, если в вашем поле зрения есть враги, и наоборот.

items.spells.wildenergy.name=дикая энергия
items.spells.wildenergy.desc=Это заклинание содержит часть проклятой энергии, которая питала DM-300. При активации оно перезарядит ваши палочки и экипированные артефакты, но вызовет случайный эффект, как если бы вы использовали проклятую палочку. Впрочем, вы всё же сможете выбрать направление выстрела.


###runestones
items.stones.inventorystone.ac_use=ПРИМЕНИТЬ

items.stones.runestone$placeholder.name=рунный камень
items.stones.runestone.discover_hint=Вы можете случайно найти этот предмет в подземелье или создать его с помощью алхимии.

items.stones.stoneofaggression.name=камень Агрессии
items.stones.stoneofaggression.desc=Если бросить этот камень в кого-либо, все находящиеся рядом враги предпочтут атаковать этого персонажа в течение короткого времени.\n\nОднако боссы способны противиться этому эффекту, значительно сокращая его действие, но и получают меньше урона от атак своих приспешников.
items.stones.stoneofaggression$aggression.name=метка агрессии
items.stones.stoneofaggression$aggression.desc=Волшебная энергия, которая заставляет всех ближайших врагов атаковать данную цель.\n\nОсталось ходов: %s.

items.stones.stoneofaugmentation.name=камень Баланса
items.stones.stoneofaugmentation.inv_title=Балансировать предмет
items.stones.stoneofaugmentation.desc=Этот рунный камень обладает могучими чарами, которые могут балансировать экипировку, увеличивая одно свойство за счёт другого.\n\nДля оружия он позволяет улучшить либо урон, либо скорость атаки. Метательные оружия также или обретут, или потеряют прочность в зависимости от скорости атаки.\n\nДля доспехов он позволяет улучшить либо защиту, либо уклонение.
items.stones.stoneofaugmentation.discover_hint=Вы можете купить этот предмет в магазине или создать его с помощью алхимии.
items.stones.stoneofaugmentation$wndaugment.choice=Что вы хотели бы улучшить?
items.stones.stoneofaugmentation$wndaugment.speed=Скорость
items.stones.stoneofaugmentation$wndaugment.damage=Урон
items.stones.stoneofaugmentation$wndaugment.evasion=Уклонение
items.stones.stoneofaugmentation$wndaugment.defense=Защита
items.stones.stoneofaugmentation$wndaugment.none=Убрать балансирование
items.stones.stoneofaugmentation$wndaugment.cancel=Я передумал

items.stones.stoneofblast.name=камень Взрыва
items.stones.stoneofblast.desc=Этот рунный камень моментально взорвётся при броске. Прямо как бомба, взрыв нанесёт урон всем, кто находится рядом.

items.stones.stoneofblink.name=камень Перемещения
items.stones.stoneofblink.desc=Если бросить этот рунный камень на пол, то он перенесёт своего владельца на место своего падения.

items.stones.stoneofclairvoyance.name=камень Ясновидения
items.stones.stoneofclairvoyance.desc=Этот камень мгновенно откроет все клетки в очень большой области вокруг того места, куда он был брошен. Этому эффекту не препятствуют даже стены.

items.stones.stoneofdeepsleep.name=камень Непробудного сна
items.stones.stoneofdeepsleep.desc=Этот камень, брошенный во врага, погрузит его в глубокий магический сон. Такой сон нельзя потревожить, пока враг не получил какой-либо урон.

items.stones.stoneofdetectmagic.name=камень Обнаружения магии
items.stones.stoneofdetectmagic.inv_title=Проверить предмет
items.stones.stoneofdetectmagic.detected_none=Вы не обнаружили никакой магии, воздействующей на этот предмет.
items.stones.stoneofdetectmagic.detected_both=Вы обнаружили как благотворную, так и недобрую магию, таящуюся в этом предмете.
items.stones.stoneofdetectmagic.detected_good=Вы обнаружили благотворную магию, таящуюся в этом предмете.
items.stones.stoneofdetectmagic.detected_bad=Вы обнаружили недобрую магию, таящуюся в этом предмете.
items.stones.stoneofdetectmagic.desc=Этот рунный камень способен обнаруживать магию, воздействующую на предмет. Применив этот камень к неопознанному предмету, можно узнать, находится ли он под воздействием темного проклятия или благотворной магии, такой как зачарование или улучшение.

items.stones.stoneofdisarming.name=камень Обезвреживания
items.stones.stoneofdisarming.desc=Этот рунный камень содержит магию, которая способна обезвредить вредоносные ловушки, спрятанные в подземелье. Он может обезвредить до 9 ловушек вокруг того места, куда будет брошен.

items.stones.stoneofenchantment.name=камень Зачарования
items.stones.stoneofenchantment.inv_title=Зачаровать предмет
items.stones.stoneofenchantment.weapon=Ваше оружие светится в темноте!
items.stones.stoneofenchantment.armor=Ваша броня светится в темноте!
items.stones.stoneofenchantment.desc=Этот рунный камень содержит зачаровывающую магию. В отличие от аналогичных свитков, он не может быть использован для улучшения предметов. Но зато может наложить на оружие или броню случайное зачарование, наделив предмет новыми силами.

items.stones.stoneoffear.name=камень Страха
items.stones.stoneoffear.desc=Этот камень так сильно испугает персонажа, в которого он был брошен, что ему захочется убраться куда подальше. Любой урон, нанесённый убегающему, снизит длительность эффекта.

items.stones.stoneofflock.name=камень Стада
items.stones.stoneofflock.desc=Этот рунный камень на короткое время призовёт стадо волшебных овец в том месте, куда он был брошен.

items.stones.stoneofintuition.name=камень Интуиции
items.stones.stoneofintuition.inv_title=Выберите предмет
items.stones.stoneofintuition.desc=Этот рунный камень содержит ослабленную версию той магии, что присутствует в свитках опознания. Вместо того, чтобы напрямую раскрыть секреты предмета, он воздействует на вашу интуицию, позволяя угадать назначение зелья или свитка.
items.stones.stoneofintuition.break_info=Вы можете использовать камень интуиции дважды, прежде чем он сломается, _ваше следующее использование не потратит камень_.
items.stones.stoneofintuition.break_warn=Вы ранее использовали камень интуиции, потому _ваше следующее использование потратит камень_.
items.stones.stoneofintuition$wndguess.text=Угадай тип неопознанного предмета. Если отгадаешь, то он будет опознан!
items.stones.stoneofintuition$wndguess.correct=Вы угадали. Предмет был опознан!
items.stones.stoneofintuition$wndguess.incorrect=Вы не угадали.
items.stones.stoneofintuition$wndguess.break=Камень интуиции рассыпался в пыль...

items.stones.stoneofshock.name=камень Шока
items.stones.stoneofshock.desc=Этот рунный камень вызывает электрический взрыв, который ненадолго оглушает все ближайшие цели и дает заряд волшебной палочки за каждую цель, которая была задета.


###trinkets
items.trinkets.chaoticcenser.name=хаотичное кадило
items.trinkets.chaoticcenser.spew=Ваше кадило вот-вот начнет источаться: %s.
items.trinkets.chaoticcenser.desc=Побывав в котле какое-то время, это кадило для благовоний начало создавать дым само по себе! Эти газы накапливаются и будут выбрасываться из кадила в направлениях врагов и полуслучайных интервалах. Судя по всему, оно способно производить все виды газов, но перед тем, как оно активируется, вы получите предзнаменование.
items.trinkets.chaoticcenser.typical_stats_desc=Обычно этот аксессуар будет производить поблизости вредный газ каждые _%d_ ходов. Газ будет появляться, только когда поблизости присутствуют враги. При более высоких уровнях эти газы будут более экзотическими и мощными.
items.trinkets.chaoticcenser.stats_desc=На текущем уровне этот аксессуар будет производить поблизости вредный газ каждые _%d_ ходов. Газ будет появляться, только когда поблизости присутствуют враги. При более высоких уровнях эти газы будут более экзотическими и мощными.

items.trinkets.crackedspyglass.name=сломанная подзорная труба
items.trinkets.crackedspyglass.desc=Этот ручной телескоп был бы демонстрацией великой и тонкой работы, не будь у него трещины в передней линзе. Подзорная труба, кажется, помогает, раскрывая новые предметы в подземелье. Но из-за ее изъяна, раскрытые предметы не очень просто увидеть!
items.trinkets.crackedspyglass.typical_stats_desc=Обычно этот аксессуар имеет _%1$s%% шанс_ создать дополнительный скрытый предмет на каждом этаже без босса.
items.trinkets.crackedspyglass.stats_desc=На текущем уровне этот аксессуар имеет _%1$s%% шанс_ создать дополнительный скрытый предмет на каждом этаже без босса.
items.trinkets.crackedspyglass.stats_desc_upgraded=На текущем уровне этот аксессуар имеет _100%% шанс_ создать дополнительный скрытый предмет на каждом этаже без босса, а также _%1$s%% шанс_ на создание второго дополнительного скрытого предмета.

items.trinkets.dimensionalsundial.name=межпространственные солнечные часы
items.trinkets.dimensionalsundial.warning=Солнечные часы перестали отбрасывать тень. Вы ощущаете тревогу.
items.trinkets.dimensionalsundial.desc=Эти портативные солнечные часы каким-то образом способны отбрасывать тень в глубинах подземелья, даже если вы не держите их правильно. Еще более странно положение тени, которая, похоже, не имеет никакого отношения к солнцу в этом мире. Когда тень не отбрасывается, кажется, что солнечные часы привлекают опасность.
items.trinkets.dimensionalsundial.typical_stats_desc=Обычно этот аксессуар уменьшает количество противников днём (8:00-20:00) на _%1$d%%_ и увеличивает ночью (20:00-8:00) на _%2$d%%_.
items.trinkets.dimensionalsundial.stats_desc=На текущем уровне этот аксессуар уменьшает количество противников днём (8:00-20:00) на _%1$d%%_ и увеличивает ночью (20:00-8:00) на _%2$d%%_.

items.trinkets.exoticcrystals.name=экзотические кристаллы
items.trinkets.exoticcrystals.desc=Эти мелкие розоватые кристаллы имеют такую же форму, что и кристаллы алхимической энергии. Хотя их и нельзя напрямую использовать для получения энергии, те, видимо, каким-то образом влияют на зелья и свитки, которые вы находите.
items.trinkets.exoticcrystals.typical_stats_desc=Обычно этот аксессуар будет заменять _%s%%_ появляющихся зелий и свитков их особыми версиями. Эффект не затрагивает зелья Силы, свитки Улучшения и предметы, которые требуются для решения головоломок.
items.trinkets.exoticcrystals.stats_desc=На текущем уровне этот аксессуар будет заменять _%s%%_ появляющихся зелий и свитков их особыми версиями. Эффект не затрагивает зелья Силы, свитки Улучшения и предметы, которые требуются для решения головоломок.

items.trinkets.eyeofnewt.name=глаз тритона
items.trinkets.eyeofnewt.desc=Этот золотисто-черный глаз тритона — обычный ингредиент, теперь превращённый в аксессуар. Глаз, по-видимому, ухудшает зрение в обмен на то, что позволяет видеть вещи по-другому.
items.trinkets.eyeofnewt.typical_stats_desc=Обычно этот аксессуар уменьшает дальность обзора на _%1$s%%_, но также даёт возможность ментально видеть врагов в пределах _%2$d_ клеток.
items.trinkets.eyeofnewt.stats_desc=На текущем уровне этот аксессуар уменьшит дальность обзора на _%1$s%%_, но также даст возможность ментально видеть врагов в пределах _%2$d_ клеток.

items.trinkets.ferrettuft.name=мех хорька
items.trinkets.ferrettuft.desc=Пучок шелковистого белого меха хорька, скреплённый лаймово-зелёной лентой, завязанной в бант. Хорьки известны своим проворством, озорством и отстутствием добросовестности. Часть этой энергии исходит от аксессуара, увеличивая уклонение всего вокруг.
items.trinkets.ferrettuft.typical_stats_desc=Обычно этот аксессуар увеличивает уклонение всех персонажей на _%1$s%%_.
items.trinkets.ferrettuft.stats_desc=На текущем уровне этот аксессуар увеличивает уклонение всех персонажей на _%1$s%%_.

items.trinkets.mimictooth.name=зуб мимика
items.trinkets.mimictooth.desc=Видимо, этот огромный клык вырвали у неудачливого мимика. Кажется, он каким-то образом влияет на мимиков, из-за чего они появляются чаще и становятся опаснее.
items.trinkets.mimictooth.typical_stats_desc=Обычно этот аксессуар призывает мимиков в _%1$s_ раз чаще, но усложняет их обнаружение, а также увеличивает выпадение предметов с них. Кроме того, на каждом уровне будет шанс появления очень скрытных эбонитовых мимиков, равный _%2$s%%_.
items.trinkets.mimictooth.stats_desc=На текущем уровне этот аксессуар призывает мимиков в _%1$s_ раз чаще, но усложняет их обнаружение, а также увеличивает выпадение предметов с них. Кроме того, на каждом уровне будет шанс появления очень скрытных эбонитовых мимиков, равный _%2$s%%_.

items.trinkets.mossyclump.name=комок мха
items.trinkets.mossyclump.desc=Этот сгусток мокрого мха остаётся влажным, как сильно вы бы его не сжимали. Судя по всему, он магически связан с самим подземельем, из-за чего вода и трава будут появляться чаще.
items.trinkets.mossyclump.typical_stats_desc=Обычно этот аксессуар заполнит _%d%%_ нетематических этажей либо водой или травой.\n\nУлучшение этого аксессуара требует большого количества энергии.
items.trinkets.mossyclump.stats_desc=На текущем уровне этот аксессуар заполнит _%d%%_ нетематических этажей либо водой, либо травой.\n\nУлучшение этого аксессуара требует большого количества энергии.

items.trinkets.parchmentscrap.name=обрывок пергамента
items.trinkets.parchmentscrap.desc=Этот маленький клочок пергамента выглядит так, будто его вырезали из свитка. Он сохранил часть своей магии, и, похоже, влияет на оружие и доспехи, найденные в подземелье.
items.trinkets.parchmentscrap.typical_stats_desc=Как правило, этот аксессуар увеличивает шанс появления зачарований и рун в _%d_ раз, и изменяет шанс появления проклятий на оружии и доспехах в _%s_ раз. При этом шанс появления проклятий на палочках, кольцах или артефактах не изменится.\n\nУлучшение этого аксессуара требует большого количества энергии.
items.trinkets.parchmentscrap.stats_desc=На текущем уровне этот аксессуар увеличивает шанс появления зачарований и рун в _%d_ раз, и изменяет шанс появления проклятий на оружии и доспехах в _%s_ раз. При этом шанс появления проклятий на палочках, кольцах или артефактах не изменится.\n\nУлучшение этого аксессуара требует большого количества энергии.

items.trinkets.petrifiedseed.name=окаменевшее семя
items.trinkets.petrifiedseed.desc=Это семя превратилось в окаменелость либо в результате медленных геологических процессов, либо с помощью магии. Похоже, что семя магическим образом влияет на флору подземелья, иногда заменяя семена растений руническими камнями.
items.trinkets.petrifiedseed.typical_stats_desc=Обычно этот аксессуар сделает так, что из растоптанной травы будут выпадать рунные камни вместо семян в _%1$s%%_ случаев. Он так же увеличит шанс выпадения предметов из высокой травы на _%2$s%%_.
items.trinkets.petrifiedseed.stats_desc=На текущем уровне этот аксессуар сделает так, что из растоптанной травы будут выпадать рунные камни вместо семян в _%1$s%%_ случаев. Он так же увеличит шанс выпадения предметов из высокой травы на _%2$s%%_.

items.trinkets.ratskull.name=череп крысы
items.trinkets.ratskull.desc=Этот жутковатый аксессуар не намного больше черепа обычной крысы, что является большой редкостью в этом подземелье. Магическое влияние черепа, похоже, привлекает более редких обитателей подземелья, заставляя их появляться гораздо чаще.
items.trinkets.ratskull.typical_stats_desc=Обычно этот аксессуар увеличит шанс появления особых врагов в _%d_ раз. Однако череп в два раза менее эффективен в привлечении кристаллических мимиков и живых статуй.
items.trinkets.ratskull.stats_desc=На текущем уровне этот аксессуар увеличит шанс появления особых врагов в _%d_ раз. Однако череп в два раза менее эффективен в привлечении кристаллических мимиков и живых статуй.

items.trinkets.saltcube.name=куб соли
items.trinkets.saltcube.desc=Этот крупный кристалл соли был вырезан в форме почти идеального куба, и ему каким-то образом удалось слить половину воды из алхимического котла вместо того, чтобы раствориться. Кажется, что это волшебным образом обезвоживает и сохраняет пищу, которую вы едите, продлевая чувство сытости, но также уменьшая восстановление вашего здоровья, когда вы не голодаете.
items.trinkets.saltcube.typical_stats_desc=Обычно этот аксессуар увеличит ваше время сытости на _%1$s%%_, но уменьшит эффективность восстановления здоровья на _%2$s%%_, если этаж не закрыт.
items.trinkets.saltcube.stats_desc=На текущем уровне этот аксессуар увеличит ваше время сытости на _%1$s%%_, но уменьшит эффективность восстановления здоровья на _%2$s%%_, если этаж не закрыт.

items.trinkets.shardofoblivion.name=осколок небытия
items.trinkets.shardofoblivion.desc=После варки в алхимическом котле этот маленький осколок проклятого металла превратился в... ничто? Кажется, что свет огибает его, и он парит на месте, когда вы его не держите. Осколок, похоже, волшебным образом черпает силу из вашего невежества, так что, наверное, лучше не думать об этом слишком много.
items.trinkets.shardofoblivion.typical_stats_desc=Обычно этот аксессуар увеличит шанс выпадения сокровищ из врагов на 20%% для каждого неопознанного предмета экипировки, что вы экипировали или недавно использовали, вплоть до _%d предметов_. Осколок так же предотвращает опознание экипировки, но его можно использовать, чтобы вручную опознать предметы, которые готовы к этому.
items.trinkets.shardofoblivion.stats_desc=На текущем уровне этот аксессуар увеличит шанс выпадения сокровищ из врагов на 20%% за каждый неопознанный предмет экипировки, что вы экипировали или недавно использовали, вплоть до _%d предметов_. Осколок так же предотвращает опознание экипировки, но его можно использовать, чтобы вручную опознать предметы, которые готовы к этому.
items.trinkets.shardofoblivion.ac_identify=ОПОЗНАТЬ
items.trinkets.shardofoblivion.identify_prompt=Опознать предмет
items.trinkets.shardofoblivion.identify_ready=Предмет готов к опознанию: %s. Используйте осколок бытия на нём, чтобы его опознать.
items.trinkets.shardofoblivion.identify_ready_worn=Все ваши носимые вещи готовы к опознанию. Используйте осколок небытия на них, чтобы их опознать.
items.trinkets.shardofoblivion.identify_not_yet=Этот предмет ещё не готов быть опознанным.
items.trinkets.shardofoblivion.identify=Вы опознали предмет!
items.trinkets.shardofoblivion$wandusetracker.name=Использована неопознанная палочка
items.trinkets.shardofoblivion$wandusetracker.desc=Вы недавно использовали неопознанную волшебную палочку, которая на некоторое время считается частью неопознанного снаряжения, используемого осколком небытия.\n\nХодов осталось: %s.
items.trinkets.shardofoblivion$thrownusetracker.name=Использовано неопознанное метательное оружие
items.trinkets.shardofoblivion$thrownusetracker.desc=Вы недавно использовали неопознанное метательное оружие, которое на некоторое время считается частью неопознанного снаряжения, используемого осколком небытия.\n\nХодов осталось: %s.

items.trinkets.thirteenleafclover.name=тринадцатилистный клевер
items.trinkets.thirteenleafclover.desc=Каким-то образом при варке в алхимическом котле у этого клевера выросла куча дополнительных листьев! На самом деле не совсем понятно, приносит ли этот аксессуар удачу или нет, возможно, этот клевер сделает вашу удачу более хаотичной?
items.trinkets.thirteenleafclover.typical_stats_desc=Обычно этот аксессуар заставит вас наносить переменчивый урон, делая его максимальным в _%1$d%%_ случаев, и минимальным в _%2$d%%_ случаев.
items.trinkets.thirteenleafclover.stats_desc=На текущем уровне этот аксессуар заставит вас наносить переменчивый урон, делая его максимальным в _%1$d%%_ случаев, и минимальным в _%2$d%%_ случаев.

items.trinkets.trapmechanism.name=механизм ловушки
items.trinkets.trapmechanism.desc=Основной механизм одной из ловушек в подземелье, аккуратно вырезанный в полу, чтобы его можно было переносить. Кажется, что он магическим образом связан с самим подземельем, что делает опасную местность более распространенной для вас, но при этом увеличивая ваше чутьё к ним.
items.trinkets.trapmechanism.typical_stats_desc=Обычно этот аксессуар повысит на _%1$d%%_ шанс появления ловушек и пропастей на нетематических этажах.\n\nКроме того, _%2$d%%_ скрытых ловушек подземелья станут видимыми.
items.trinkets.trapmechanism.stats_desc=На текущем уровне этот аксессуар повысит на _%1$d%%_ шанс появления ловушек и пропастей на нетематических этажах.\n\nКроме того, _%2$d%%_ скрытых ловушек подземелья станут видимыми.

items.trinkets.vialofblood.name=флакон крови
items.trinkets.vialofblood.desc=Этот тонкий флакон содержит кровь какого-то обитателя подземелья, она медленно перемещается, когда вы вращаете флакон. Похоже, что это волшебным образом усиливает целебные эффекты, но также их замедляет.
items.trinkets.vialofblood.typical_stats_desc=Обычно этот аксессуар увеличивает общее количество здоровья, которое вы получаете, выпивая целебные зелья, бурдюки с водой или колодцы здоровья, на _%1$s%%_. Однако эти лечебные эффекты также проявляются медленнее, восстанавливая максимум _%2$s_ здоровья за ход (это зависит от уровня героя).
items.trinkets.vialofblood.stats_desc=На текущем уровне этот аксессуар увеличит общее количество здоровья, которое вы получаете, выпивая целебные зелья, бурдюки с водой или колодцы здоровья, на _%1$s%%_. Однако эти лечебные эффекты также будут проявляться медленнее, восстанавливая максимум _%2$s_ здоровья за ход (это зависит от уровня героя).

items.trinkets.wondrousresin.name=чудотворная смола
items.trinkets.wondrousresin.desc=Эта мерцающая голубая смола, по-видимому, содержит в себе дистиллированную эссенцию магии проклятой палочки. Магия алхимического котла, видимо, несколько стабилизировала ее, и теперь она воздействует на ваши палочки.
items.trinkets.wondrousresin.typical_stats_desc=Обычно этот аксессуар сделает эффекты проклятой палочки нейтральными или положительными в _%1$s%%_ случаев, а так же при выстрелах не проклятыми палочками, те будут в _%2$s%%_ случаев выстреливать нейтральным или положительным проклятым зарядом.\n\nУлучшение этого аксессуара требует большого количества энергии.
items.trinkets.wondrousresin.stats_desc=На текущем уровне это аксессуар сделает эффекты проклятой палочки нейтральными или положительными в _%1$s%%_ случаев, а так же при выстрелах не проклятыми палочками, те будут в _%2$s%%_ случаев выстреливать нейтральным или положительным проклятым зарядом.\n\nУлучшение этого аксессуара требует большого количества энергии.

items.trinkets.trinketcatalyst.name=магический катализатор
items.trinkets.trinketcatalyst.window_title=создать аксессуар
items.trinkets.trinketcatalyst.window_text=Как только вы добавляете катализатор, вода в котле начинает сиять. Выберите один из предметов, чтобы наполнить его энергией и превратить в магический аксессуар.
items.trinkets.trinketcatalyst.desc=Этот золотистый комок пыли сверкает во тьме подземелья. Такой катализатор можно объединить с небольшим количеством алхимической энергии, чтобы создать уникальный аксессуар.\n\nАксессуары дают различные эффекты, которые помогают немного разнообразить подземелье и его обитателей. Аксессуары можно улучшить при помощи энергии, чтобы сделать их эффекты более сильными. Если вы хотите полностью избавиться от их эффектов, то аксессуары достаточно просто выбросить.
items.trinkets.trinketcatalyst$randomtrinket.name=случайный аксессуар
items.trinkets.trinketcatalyst$randomtrinket.desc=Один из предметов, находящихся поблизости, спрятан в мешочке, который вы не можете открыть.\n\nВ процессе алхимии мешочек растворится, но вы не узнаете, какой аксессуар получите, пока не сделаете его!

items.trinkets.trinket.discover_hint=Этот предмет может появиться в выборе, когда вы создаёте аксессуар с помощью алхимии.
items.trinkets.trinket$placeholder.name=аксессуар

###wands
items.wands.cursedwand.ondeath=Вас убил ваш собственный %s.
items.wands.cursedwand.nothing=Ничего не произошло.
items.wands.cursedwand.mass_invuln=Яркий свет извергается из вашей палочки!
items.wands.cursedwand.petrify=Вы внезапно замерзаете на месте!
items.wands.cursedwand.grass=Вокруг вас внезапно появляются заросли травы!
items.wands.cursedwand.fire=Вы чувствуете запах гари...
items.wands.cursedwand.transmogrify_wand=Ваша палочка превратилась в другой предмет!
items.wands.cursedwand.transmogrify_other=Ваш предмет превращается во что-то другое!
items.wands.cursedwand.disguise=Ваш облик меняется у вас на глазах!
items.wands.cursedwand.supernova=Раскаленный шар энергии начинает расти. Лучше бежать!
items.wands.cursedwand.supernova_positive=Пылающий энергетический шар начинает расти, но кажется безопасным.
items.wands.cursedwand.sinkhole=Почва вокруг вас начинает обрушиваться!
items.wands.cursedwand.sinkhole_positive=Почва начинает обрушиваться, но кажется довольно твёрдой под вашими ногами.
items.wands.cursedwand.gravity=Гравитация тянет в случайных направлениях!
items.wands.cursedwand.gravity_positive=Гравитация тянет в случайных направлениях, но не касается вас.
items.wands.cursedwand.gravity_end=Гравитационный хаос закончился.

items.wands.damagewand.upgrade_stat_name_1=Магический урон

items.wands.wand.ac_zap=ИСПОЛЬЗОВАТЬ
items.wands.wand.fizzles=Ваша палочка искрит. Видимо, у нее кончились заряды.
items.wands.wand.no_magic=Вы не можете использовать палочки под действием антимагии.
items.wands.wand.self_target=Нельзя выбрать себя в качестве цели!
items.wands.wand.identify=Вы достаточно долго знакомы с палочкой, чтобы опознать ее.
items.wands.wand.resin_one=Палочка получила _1 уровень_ от магической смолы.
items.wands.wand.resin_many=Палочка получила _%d уровня_ от магической смолы.
items.wands.wand.cursed=Эта палочка проклята, ее сила хаотична и непредсказуема.
items.wands.wand.not_cursed=Эта палочка не проклята.
items.wands.wand.curse_discover=Этот %s проклят!
items.wands.wand.prompt=Выберите цель
items.wands.wand$placeholder.name=палочка

items.wands.wandofblastwave.name=палочка Взрывной волны
items.wands.wandofblastwave.staff_name=посох Взрывной волны
items.wands.wandofblastwave.ondeath=Вы убили себя собственной палочкой Взрывной волны...
items.wands.wandofblastwave.knockback_ondeath=Столкновение убило вас...
items.wands.wandofblastwave.desc=Эта палочка с золотой отделкой и навершием из черного самоцвета сделана из мрамора. Довольно увесистая.
items.wands.wandofblastwave.typical_stats_desc=Эта палочка выпускает заряд, создающий мощный взрыв в точке удара. Взрыв обычно наносит _%1$d-%2$d урона,_ и способен отправить большинство врагов в полёт.
items.wands.wandofblastwave.stats_desc=Эта палочка выпускает заряд, создающий мощный взрыв в точке удара. Взрыв наносит _%1$d-%2$d урона,_ и способен отправить большинство врагов в полёт.
items.wands.wandofblastwave.upgrade_stat_name_2=Отталкивание
items.wands.wandofblastwave.bmage_desc=Когда _Боевой маг_ поражает парализованного противника зарядом из посоха Взрывной волны, это поглотит паралич и нанесет дополнительный магический урон. У этой способности есть небольшая перезарядка при использовании на одном враге.
items.wands.wandofblastwave.eleblast_desc=Стихийный взрыв с посохом взрывной волны наносит 67% урона и сбивает всех врагов за пределами области взрыва.

items.wands.wandofcorrosion.name=палочка Коррозии
items.wands.wandofcorrosion.staff_name=посох Коррозии
items.wands.wandofcorrosion.desc=Мертвенно-бледная рукоять этой палочки украшена сияющим драгоценным камнем ярко-оранжевого цвета.
items.wands.wandofcorrosion.stats_desc=При использовании эта палочка стреляет зарядом, который взрывается в облако крайне едкого газа в месте попадания. Урон, наносимый этим газом, растет в зависимости от того, сколько времени цель находилась в облаке, начиная с _%d ед. урона._
items.wands.wandofcorrosion.upgrade_stat_name_1=Урон коррозии
items.wands.wandofcorrosion.upgrade_stat_name_2=Объём Газа
items.wands.wandofcorrosion.bmage_desc=Когда _Боевой маг_ поражает врага посохом Коррозии, у врага есть шанс покрыться едкой слизью.
items.wands.wandofcorrosion.eleblast_desc=Стихийный взрыв с посохом коррозии накладывает на врагов 4 хода коррозии, которая начинается с 6 урона.

items.wands.wandofcorruption.name=палочка Порчи
items.wands.wandofcorruption.staff_name=посох Порчи
items.wands.wandofcorruption.already_corrupted=Эта цель уже под вашим контролем.
items.wands.wandofcorruption.desc=Даже без маленького черепа на навершии можно понять, что эта вещь не для всяких рук - палочка просто источает темную магию.
items.wands.wandofcorruption.stats_desc=Эта палочка выпускает разряд Порчи, пытаясь подчинить врагов вашей воле. В противном случае, палочка наложит на цель случайный негативный эффект. Но чем больше негативных эффектов на цели, тем больше шансов на то, что она будет подчинена.
items.wands.wandofcorruption.upgrade_stat_name_1=Сила Порчи
items.wands.wandofcorruption.upgrade_stat_name_2=Длительность Ослабления
items.wands.wandofcorruption.bmage_desc=Когда _Боевой маг_ поражает врага посохом Порчи, у врага есть шанс впасть в буйство.
items.wands.wandofcorruption.eleblast_desc=Стихийный взрыв с посохом порчи накладывает на врагов 5 ходов буйства.

items.wands.wandofdisintegration.name=палочка Дезинтеграции
items.wands.wandofdisintegration.staff_name=посох Дезинтеграции
items.wands.wandofdisintegration.desc=Эта палочка сделана из цельного куска обсидиана, внутри которого течет фиолетовый свет, заканчивающийся у навершия. Она мерцает разрушительной энергией, ожидая, когда ей воспользуются.
items.wands.wandofdisintegration.stats_desc=Палочка испускает луч, пронзающий любые препятствия на своём пути. Дальность луча увеличивается с улучшением палочки. Луч наносит _%1$d-%2$d урона,_ и чем больше луч пронзает врагов и препятствий, тем больше дополнительный урон.
items.wands.wandofdisintegration.upgrade_stat_name_2=Максимальная дистанция
items.wands.wandofdisintegration.bmage_desc=Когда _Боевой маг_ использует посох Дезинтеграции, дальность атаки увеличивается так, будто в нём есть зачарование проекции.
items.wands.wandofdisintegration.eleblast_desc=Стихийный взрыв с посохом дезинтеграции наносит 100% урона и пробивает стены насквозь.

items.wands.wandoffireblast.name=палочка Огненной вспышки
items.wands.wandoffireblast.staff_name=посох Огненной вспышки
items.wands.wandoffireblast.desc=Эта палочка сделана из лакированного красного дерева с навершием в виде золотого листа, из-за чего выглядит, как королевский скипетр. Она шипит и искрит, готовая выпустить свою неудержимую магию.
items.wands.wandoffireblast.stats_desc=При использовании эта палочка выпускает конус огня. Его следующая поглотит _%1$d зарядов_ и нанесёт _%2$d-%3$d урона_. Чем больше зарядов используется, тем больше и сильнее эффект.
items.wands.wandoffireblast.upgrade_stat_name_1=Урон 1 Заряда
items.wands.wandoffireblast.upgrade_stat_name_2=Урон 2 Заряда
items.wands.wandoffireblast.upgrade_stat_name_3=Урон 3 Заряда
items.wands.wandoffireblast.bmage_desc=Когда _Боевой маг_ поражает врага посохом Огненной вспышки, есть шанс, что произойдёт взрыв, который нанесет урон врагам и поглотит весь огонь поблизости! Чем больше огня вокруг врага, тем больше этот шанс.
items.wands.wandoffireblast.eleblast_desc=Стихийный взрыв с посохом огненной вспышки наносит 100% урона, прорывается через открытые двери и поджигает врагов и местность.

items.wands.wandoffrost.name=палочка Холода
items.wands.wandoffrost.staff_name=посох Холода
items.wands.wandoffrost.desc=Кажется, эта палочка сделана из какого-то волшебного льда. Она становится ярче около навершия. На ощупь довольно холодная, но ваша рука почему-то остается тёплой.
items.wands.wandoffrost.stats_desc=Эта палочка стреляет в ваших врагов потоком льда, нанося _%1$d-%2$d урона_ и замораживает их. В воде эффект сильнее. Замороженные враги, получают меньше урона от этой палочки.
items.wands.wandoffrost.upgrade_stat_name_2=Длительность Окоченения
items.wands.wandoffrost.bmage_desc=Когда _Боевой маг_ поражает охлажденного противника посохом Холода, у противника есть шанс моментально замерзнуть. Чем более охлажден противник, тем больше этот шанс.
items.wands.wandoffrost.eleblast_desc=Стихийный взрыв с посохом холода наносит 100% урона, замораживает врагов и тушит пожары.

items.wands.wandoflightning.name=палочка Молний
items.wands.wandoflightning.staff_name=посох Молний
items.wands.wandoflightning.ondeath=Вы убили себя собственной палочкой Молний...
items.wands.wandoflightning.desc=Эта палочка сделана из цельного металла, из-за чего она довольно тяжёлая. На навершии есть два зубца, между которыми проскакивают электрические дуги.
items.wands.wandoflightning.stats_desc=Эта палочка испускает мощные молнии, которые пронизывают все, против чего они направлены, и причиняют _%1$d-%2$d урона_. Это электричество переходит на близкие персонажи и свободнее распространяется в воде. Молнии из этой палочки могут нанести вам вред, но не затрагивают ваших союзников.
items.wands.wandoflightning.bmage_desc=Когда _Боевой маг_ поражает противника посохом Молний, есть шанс электрически зарядить себя на 10 ходов. Будучи заряженным Боевой маг невосприимчив к электрическому урону и его молнии будут бить дальше.
items.wands.wandoflightning.eleblast_desc=Стихийный взрыв с посохом молнии наносит 100% урона, оглушает врагов на 5 ходов и электризует воду.
items.wands.wandoflightning$lightningcharge.name=Электрически заряжен
items.wands.wandoflightning$lightningcharge.desc=Боевой маг сейчас заряжен энергией, что даёт ему иммунитет к его посоху Молний и увеличивает дальность атаки молнией.\n\nХодов осталось: %s.

items.wands.wandoflivingearth.name=палочка Живой земли
items.wands.wandoflivingearth.staff_name=посох Живой земли
items.wands.wandoflivingearth.desc=Эта палочка сделана из странного камня с полосами светящейся желтой энергии. Камни, кажется, слегка сдвигаются, когда вы держите палочку, как будто они чувствуют вашу руку.
items.wands.wandoflivingearth.stats_desc=Эта палочка создает снаряды из магических камней, нанося _%1$d-%2$d урона._ Затем камни возвращаются к владельцу палочки, чтобы создать вокруг него броню. Если брони достаточно, то при следующем использовании палочки она превратится в каменного стража.
items.wands.wandoflivingearth.upgrade_stat_name_2=Макс. ОЗ Стража
items.wands.wandoflivingearth.upgrade_stat_name_3=Блокирование Стража
items.wands.wandoflivingearth.bmage_desc=Когда _Боевой маг_ поражает врага посохом Живой земли, часть нанесенного урона возвращается в виде каменной брони.
items.wands.wandoflivingearth.eleblast_desc=Стихийный взрыв с посохом живой земли наносит 50% урона и лечит активного земляного стража за каждого пораженного врага.
items.wands.wandoflivingearth$rockarmor.name=каменная броня
items.wands.wandoflivingearth$rockarmor.desc=Магические камни окружают ваше тело и пытаются защитить вас при вражеской атаке, уменьшая урон по вам на 50%%. Броня снижается при поглощении урона.\n\nБрони осталось: %1$d\n\nЕсли на вашем теле достаточно камня, то следующее использование вашей палочки Живой земли заставит камни собраться в стража, который будет сражаться за вас.\n\nНужно брони для призыва стража: %2$d.
items.wands.wandoflivingearth$rockarmor.desc_many=Этот земляной страж также получает бонус от силы многих. Ходов осталось: %d.
items.wands.wandoflivingearth$earthguardian.name=земляной страж
items.wands.wandoflivingearth$earthguardian.desc=Камни из вашей палочки живой земли превратились в защитного земляного стража! Этот каменный защитник будет атаковать ближайших врагов, что заставит их атаковать стража вместо вас. Когда все угрозы поблизости исчезнут, страж вновь сформируется вокруг вас и вернется, когда вы в следующий раз воспользуетесь своей палочкой.
items.wands.wandoflivingearth$earthguardian.wand_info=Защитная сила стража связана с уровнем вашей палочки. На данный момент он блокирует _%1$d-%2$d урона._
items.wands.wandoflivingearth$earthguardian.discover_hint=Вы можете найти этого персонажа с помощью определённой палочки.

items.wands.wandofmagicmissile.name=палочка Магической стрелы
items.wands.wandofmagicmissile.staff_name=посох Магической стрелы
items.wands.wandofmagicmissile.desc=Довольно простая палочка, стреляющая стрелами чистой магической энергии. Хоть палочка и не обладает какими-либо особыми эффектами, она имеет довольно много доступных зарядов и может на некоторое время усилить другие палочки после улучшения.
items.wands.wandofmagicmissile.stats_desc=Каждый выстрел из этой палочки наносит _%1$d-%2$d урона_ и на некоторое время усиливает другие палочки, если она улучшена.
items.wands.wandofmagicmissile.bmage_desc=Когда _Боевой маг_ поражает врага посохом Магической стрелы, все его палочки получают дополнительный заряд.
items.wands.wandofmagicmissile.eleblast_desc=Стихийный взрыв с посохом магической стрелы наносит 50% урона и дает магу 15 ходов перезарядки.
items.wands.wandofmagicmissile.discover_hint=Один из героев начинает с этим предметом.
items.wands.wandofmagicmissile$magiccharge.name=магический заряд
items.wands.wandofmagicmissile$magiccharge.desc=Палочка Магической стрелы наполнила ваши палочки энергией, увеличив их уровень.\n\nВаши палочки улучшены на: +%d.\n\nХодов осталось: %s.

items.wands.wandofprismaticlight.name=палочка Чистого света
items.wands.wandofprismaticlight.staff_name=посох Чистого света
items.wands.wandofprismaticlight.desc=Эта палочка сделан из цельного куска прозрачного хрусталя. Она напоминает длинный кусок гладкого стекла. Цветные лучики света играют у навершия, стремясь вырваться вперёд.
items.wands.wandofprismaticlight.stats_desc=Эта палочка испускает луч света, наносящий _%1$d-%2$d урона_ и ослепляющий врагов. Свет также пронзает тьму подземелья, раскрывая скрытые двери и ловушки. Демоны и нежить загорятся чистым пламенем этой палочки, получая значительно больше урона.
items.wands.wandofprismaticlight.upgrade_stat_name_2=Шанс Ослепления
items.wands.wandofprismaticlight.upgrade_stat_name_3=Длительность Света
items.wands.wandofprismaticlight.bmage_desc=Когда _Боевой маг_ поражает противника посохом Чистого света, то противник становится покалеченным на время, которое увеличивается в зависимости от уровня посоха.
items.wands.wandofprismaticlight.eleblast_desc=Стихийный взрыв с посохом чистого света наносит 67% урона, раскрывает местность и ослепляет врагов на 5 ходов.

items.wands.wandofregrowth.name=палочка Восстановления
items.wands.wandofregrowth.staff_name=посох Восстановления
items.wands.wandofregrowth.desc=Эта искусно обработанная палочка сделана из тонкого и искусно обработанного дерева. Каким-то образом дерево всё ещё живое и имеет ярко-зелёную окраску, как сердцевина молодого дерева. "Когда угасает жизнь, всегда начинается новая жизнь... Вечный цикл всегда остается!"
items.wands.wandofregrowth.stats_desc=При использовании эта палочка выстрелит зарядом возрождающей энергии в конусовидной области, взывая траву, корни и редкие растения к жизни. Следующее использование поглотит _%1$d зарядов_. Чем больше зарядов потребляет эта палочка, тем больше и сильнее становится эффект.
items.wands.wandofregrowth.degradation=После использования еще _%d зарядов_ эта палочка перестанет производить растения и новую траву. Это ограничение можно повысить, повышая свой уровень или уровень палочки.
items.wands.wandofregrowth.upgrade_stat_name_1=Травы За Заряд
items.wands.wandofregrowth.upgrade_stat_name_2=Общий Лимит Травы
items.wands.wandofregrowth.bmage_desc=Когда _Боевой маг_ поражает врага посохом Восстановления и хотя бы один из них стоит на траве, он получает Травяное исцеление пропорционально нанесенному урону.
items.wands.wandofregrowth.eleblast_desc=Стихийный взрыв с посохом восстановления опутывает врагов и беспорядочно выращивает траву в области взрыва.
items.wands.wandofregrowth$dewcatcher.name=Росянка
items.wands.wandofregrowth$dewcatcher.desc=Росянки - удивительные растения, наполняющиеcя волшебной росой. Чтобы не привлекать внимание, они маскируются под траву, но их выдают наполненные росой выпуклости.
items.wands.wandofregrowth$dewcatcher.discover_hint=Вы можете найти это растение с помощью определённой палочки.
items.wands.wandofregrowth$seedpod.name=Семяловка
items.wands.wandofregrowth$seedpod.desc=Семяловки - это волшебные растения, которые производят семена других видов растений, вместо своих собственных. Каким-то образом им удается распространяться, несмотря на отсутствие собственных семян.
items.wands.wandofregrowth$seedpod.discover_hint=Вы можете найти это растение с помощью определённой палочки.
items.wands.wandofregrowth$lotus.name=Золотой Лотос
items.wands.wandofregrowth$lotus.desc=Золотой лотос — это мистическое растение, которое может быть вызвано только мощной палочкой восстановления. Его аура усиливает все растения и их эффекты, но он быстро сжигает свою энергию и скоропостижно умирает.
items.wands.wandofregrowth$lotus.wand_info=Этот лотос был создан палочкой Восстановления, усиленной на _%1$d_. Эффекты всех растений _работают моментально_, если они были посажены на клетку с персонажем. Кроме того, есть _%2$d%% шанс_ получить семя с растения, а также смазанные дротики будут использовать на _%3$d%% меньше прочности_.
items.wands.wandofregrowth$lotus.discover_hint=Вы можете найти это растение с помощью определённой палочки, после её улучшения несколько раз.

items.wands.wandoftransfusion.name=палочка Трансфузии
items.wands.wandoftransfusion.staff_name=посох Трансфузии
items.wands.wandoftransfusion.ondeath=Вы убились собственной палочкой Трансфузии...
items.wands.wandoftransfusion.charged=Ваш посох заряжен жизненной энергией вашего противника!
items.wands.wandoftransfusion.desc=Хотя эта палочка довольно проста на вид, она выделяется за счёт пурпурного оттенка и угольно-чёрного камня на ее навершии.
items.wands.wandoftransfusion.stats_desc=При использовании на союзниках или очарованных врагах эта палочка забирает _%1$d здоровья пользователя_, чтобы вылечить или защитить союзника на _%2$d здоровья._ При использовании на врагов палочка на короткое время зачаровывает их, одновременно применяя _%3$d защиты_ к пользователю. Враждебная нежить получит _%4$d-%5$d урона_ вместо того, чтобы быть очарованной.
items.wands.wandoftransfusion.upgrade_stat_name_1=Исцеление Союзника
items.wands.wandoftransfusion.upgrade_stat_name_2=Самозащита
items.wands.wandoftransfusion.upgrade_stat_name_3=Урон по Нежити
items.wands.wandoftransfusion.bmage_desc=Когда _Боевой маг_ попадает в зачарованного врага своим посохом Трансфузии, он наделяется щитом и его следующий выстрел этим посохом не будет стоить ему здоровья.
items.wands.wandoftransfusion.eleblast_desc=Стихийный взрыв с посохом трансфузии очаровывает врагов, лечит союзников и наносит 100% урона нежити.

items.wands.wandofwarding.name=палочка Стражей
items.wands.wandofwarding.staff_name=посох Стражей
items.wands.wandofwarding.no_more_wards=Ваша палочка не может поддерживать большее количество стражей.
items.wands.wandofwarding.bad_location=Вы не можете разместить здесь стража.
items.wands.wandofwarding.desc=Это короткая металлическая палочка с ярко-фиолетовым драгоценным камнем, парящим возле ее наконечника.
items.wands.wandofwarding.stats_desc=Вместо того, чтобы наносить прямой урон, эта палочка будет призывать стражей и часовых. Стражи могут быть размещены в любом видимом для вас месте, даже через стены. Эта палочка имеет только _%d ед. энергии_ на поддержку стражей.
items.wands.wandofwarding.upgrade_stat_name_1=Урон стража
items.wands.wandofwarding.upgrade_stat_name_2=Энергия стража
items.wands.wandofwarding.bmage_desc=Когда _Боевой маг_ поражает врага посохом Стражей, все активные стражи и часовые имеют шанс исцелиться.
items.wands.wandofwarding.eleblast_desc=Стихийный взрыв посохом стражей лечит всех стражей и часовых в зоне взрыва.
items.wands.wandofwarding$ward.desc_generic_ward=Этот страж будет автоматически атаковать любого врага, что попадет в его поле зрения.\n\nИспользование палочки стражей на вашего стража улучшит его.\n\nСтражи атакуют ограниченное количество раз, а затем исчезают.
items.wands.wandofwarding$ward.desc_generic_sentry=Этот часовой обладает такой же боевой мощью, что и страж, но имеет очки здоровья вместо установленного количества зарядов. Он напоминает драгоценный камень на кончике вашей палочки стражей.\n\nИспользование палочки стражей на вашего часового улучшит и исцелит его.\n\nЧасовой будет тратить немного здоровья каждый раз, когда атакует врага, но его можно вылечить, используя палочку стражей.
items.wands.wandofwarding$ward.name_1=малый страж
items.wands.wandofwarding$ward.desc_1=Этот стандартный страж будет автоматически атаковать любого врага, что попадет в его поле зрения, нанося _%1$d-%2$d урона._\n\nИспользование палочки Стражей на вашего стража улучшит его.\n\nЭтот страж атакует лишь раз, а затем исчезнет.\n\nПалочка Стражей использует _%3$d ед. энергии_ для поддержания этого стража.
items.wands.wandofwarding$ward.name_2=средний страж
items.wands.wandofwarding$ward.desc_2=Этот улучшенный страж имеет более сложное поведение и способен атаковать несколько раз. Каждая атака будет наносить _%1$d-%2$d урона._\n\nИспользование палочки Стражей на вашего стража улучшит его.\n\nЭтот страж атакует три раза, а затем исчезнет.\n\nПалочка Стражей использует _%3$d ед. энергии_ для поддержания этого стража.
items.wands.wandofwarding$ward.name_3=большой страж
items.wands.wandofwarding$ward.desc_3=Этот максимально улучшенный страж способен атаковать большее количество раз, чем его предшественники. Каждая атака будет наносить _%1$d-%2$d урона._\n\nИспользование палочки Стражей на вашего стража улучшит его.\n\nЭтот страж атакует пять раз, а затем исчезнет.\n\nПалочка Стражей использует _%3$d ед. энергии_ для поддержания этого стража.
items.wands.wandofwarding$ward.name_4=малый часовой
items.wands.wandofwarding$ward.desc_4=Этот небольшой часовой обладает такой же боевой мощью, что и большой страж, но имеет очки здоровья вместо установленного количества зарядов. Он напоминает драгоценный камень на кончике вашей палочки стражей. Каждая его атака будет наносить _%1$d-%2$d урона._\n\nИспользование палочки стражей на вашего часового улучшит и исцелит его.\n\nЧасовой будет тратить немного здоровья каждый раз, когда атакует врага, но его можно вылечить, используя палочку стражей.\n\nПалочка стражей использует _%3$d ед. энергии_ для поддержания этого часового.
items.wands.wandofwarding$ward.name_5=средний часовой
items.wands.wandofwarding$ward.desc_5=Этот улучшенный часовой больше и немного прочнее, чем малый часовой. Каждая его атака будет наносить _%1$d-%2$d урона._\n\nИспользование палочки Стражей на вашего часового улучшит и исцелит его.\n\nЧасовой будет тратить немного здоровья каждый раз, когда атакует врага, но его можно вылечить, используя палочку Стражей.\n\nПалочка Стражей использует _%3$d ед. энергии_ для поддержания этого часового.
items.wands.wandofwarding$ward.name_6=большой часовой
items.wands.wandofwarding$ward.desc_6=Этот максимально улучшенный часовой значительно прочнее, чем его предшественники. Каждая его атака будет наносить _%1$d-%2$dурона._\n\nИспользование палочки Стражей на вашего часового исцелит его.\n\nЧасовой будет тратить немного здоровья каждый раз, когда атакует врага, но его можно вылечить, используя палочку Стражей.\n\nПалочка Стражей использует _%3$d ед. энергии_ для поддержания этого часового.
items.wands.wandofwarding$ward.discover_hint=Вы можете найти этого персонажа с помощью определённой палочки.
items.wands.wandofwarding$ward.dismiss_title=Отозвать этого стража?
items.wands.wandofwarding$ward.dismiss_body=Вы можете уничтожить этого стража, если больше не хотите, чтобы ваша палочка тратила энергию на его поддержку.\n\nОтозвать этого стража?
items.wands.wandofwarding$ward.dismiss_confirm=Да
items.wands.wandofwarding$ward.dismiss_cancel=Нет

###weapon curses
items.weapon.curses.annoying.name=%s болтливости
items.weapon.curses.annoying.msg_1=О-О-О, МЫ ЩАС БУДЕМ ДРАТЬСЯ?!
items.weapon.curses.annoying.msg_2=ДА, ВДАРЬ ИМ!
items.weapon.curses.annoying.msg_3=ЭЙ, ПОСЛУШАЙ!
items.weapon.curses.annoying.msg_4=МЫ УЖЕ У БОССА?!
items.weapon.curses.annoying.msg_5=ОЙ, НЕ МАХАЙ МНОЙ ТАК СИЛЬНО!
items.weapon.curses.annoying.msg_6=УМРИ, БУКАШКА!
items.weapon.curses.annoying.msg_7=УУУУУУУУУУУУУУУХ!
items.weapon.curses.annoying.msg_8=ДАВАЙ ПЕРЕДОХНЕМ!?
items.weapon.curses.annoying.msg_9=БАЦ, ХАХА!
items.weapon.curses.annoying.msg_10=ДОБРОТНЫЙ УДАР!
items.weapon.curses.annoying.msg_11=Я не собирался быть оружием, я хотел просто быть топором дровосека.
items.weapon.curses.annoying.msg_12=Не забывайте: чрезмерная самоуверенность это медленный и коварный убийца.
items.weapon.curses.annoying.msg_13=ВСЕ ВАША БАЗА ПРИНАДЛЕЖАТЬ НАМ!
items.weapon.curses.annoying.desc=Болтливое оружие способно разговаривать. Точнее, оно ОБОЖАЕТ разговаривать, чем нередко может привлечь излишнее внимание.
items.weapon.curses.annoying.elestrike_desc=Стихийный удар с проклятием болтливости с вероятностью 20% может привести в бешенство каждого врага в радиусе действия на 6 ходов.

items.weapon.curses.dazzling.name=%s ослепления
items.weapon.curses.dazzling.desc=Ослепляющие орудия иногда создают вспышку света, ослепляющую всех, кто её увидит.
items.weapon.curses.dazzling.elestrike_desc=Стихийный удар с проклятием ослепления с вероятностью 50% ослеплит всех врагов в радиусе действия на 6 ходов.

items.weapon.curses.displacing.name=%s телепортации
items.weapon.curses.displacing.desc=Оружие телепортации наполнено непредсказуемой магией, оно может переместить врага в случайное место.
items.weapon.curses.displacing.elestrike_desc=Стихийный удар с проклятием телепортации с вероятностью 50% переносит каждого врага в радиусе действия.

items.weapon.curses.explosive.name=%s подрыва
items.weapon.curses.explosive.warm=Тепло...
items.weapon.curses.explosive.hot=Горячо!
items.weapon.curses.explosive.desc=Взрывные орудия накапливают заряд и взрываются, нанося урон всему вокруг них.
items.weapon.curses.explosive.desc_cool=Сейчас ваше оружие холодное на ощупь.
items.weapon.curses.explosive.desc_warm=Ваше орудие накапливает энергию и становится теплее...
items.weapon.curses.explosive.desc_hot=Ваше орудие горячее! Оно вот-вот взорвется!
items.weapon.curses.explosive.elestrike_desc=Стихийный удар с проклятием подрыва с вероятностью 50% взрывает случайного врага в радиусе действия.

items.weapon.curses.friendly.name=%s дружелюбия
items.weapon.curses.friendly.desc=Оружия дружелюбия больше всего подходят пацифистам, иногда накладывая чары, предотвращающие конфликт.
items.weapon.curses.friendly.elestrike_desc=Стихийный удар с проклятием дружелюбия с вероятностью 50% может очаровать всех врагов в радиусе действия на 6 ходов.

items.weapon.curses.polarized.name=%s поляризации
items.weapon.curses.polarized.desc=Поляризованное оружие при атаке наносит либо на 50% больше урона, либо не наносит урона вообще.
items.weapon.curses.polarized.elestrike_desc=Стихийный удар с проклятием поляризации с вероятностью 50% наносит 24-36 урона каждому врагу в радиусе действия.

items.weapon.curses.sacrificial.name=%s страданий
items.weapon.curses.sacrificial.desc=Оружие страданий требует крови атакующего за то, что само наносит урон. Чем здоровее атакующий, тем больше крови оно потребует.
items.weapon.curses.sacrificial.elestrike_desc=Стихийный удар с проклятием страданий даёт герою и каждому врагу в радиусе действия кровотечение на 12 здоровья.

items.weapon.curses.wayward.name=%s упрямства
items.weapon.curses.wayward.desc=Оружие упрямства иногда уводит ваши удары в сторону. Эта магия действует некоторое время после её активации, но может быть рассеяна при нанесении удара этим орудием.
items.weapon.curses.wayward.elestrike_desc=Стихийный удар с проклятьем упрямства имеет 50% шанс активироваться на каждом враге в радиусе действия на 6 ходов.
items.weapon.curses.wayward$waywardbuff.name=упрямство
items.weapon.curses.wayward$waywardbuff.desc=Магия вашего орудия упрямости активировалась, из-за чего нанести удар будет сложно некоторое время. Однако это не влияет на гарантированные атаки, например неожиданные атаки. Успешная атака с помощью этого орудия уберет этот эффект.\n\nОсталось ходов: %s.

###enchantments
items.weapon.enchantments.blazing.name=%s пламени
items.weapon.enchantments.blazing.desc=Эти чары заставляют оружие извергать пламя, поджигая врагов и нанося дополнительный урон противникам, которые уже горят.
items.weapon.enchantments.blazing.elestrike_desc=Стихийный удар с зачарованием пламени поджигает все клетки в радиусе действия на 8 ходов.

items.weapon.enchantments.blocking.name=%s обороны
items.weapon.enchantments.blocking.desc=Это зачарование может ненадолго защитить вас после атаке этим оружием.
items.weapon.enchantments.blocking.elestrike_desc=Стихийный удар с зачарованием обороны даёт Дуэлянту 6 зарядов щита за каждого врага в радиусе действия.
items.weapon.enchantments.blocking$blockbuff.name=оборона
items.weapon.enchantments.blocking$blockbuff.desc=Зачарование обороны на вашем оружии ненадолго усилило вашу броню щитом!\n\nОсталось щита: %d.\n\nОсталось ходов: %s.

items.weapon.enchantments.blooming.name=%s цветения
items.weapon.enchantments.blooming.desc=При каждом ударе цветущим оружием есть шанс, что рядом с целью вырастет трава.
items.weapon.enchantments.blooming.elestrike_desc=Стихийный удар с зачарованием цветения сажает траву в зоне до 8 клеток и обездвиживает всех врагов в радиусе действия на 6 ходов.

items.weapon.enchantments.chilling.name=%s холода
items.weapon.enchantments.chilling.desc=Враги, пораженные этим зачарованием, коченеют от холода, их скорость атаки и передвижения снижается.
items.weapon.enchantments.chilling.elestrike_desc=Стихийный удар с зачарованием холода на 8 ходов выпустит потоки леденящего воздуха на все клетки в радиусе действия.

items.weapon.enchantments.kinetic.name=%s инерции
items.weapon.enchantments.kinetic.desc=Когда оружие инерции убивает врага, оно сохраняет избыточный урон чтобы добавить его к следующей успешной атаке.
items.weapon.enchantments.kinetic.elestrike_desc=Стихийный удар с зачарованием инерции нанесёт 40% от избыточного урона каждому врагу в радиусе, кроме основной цели.
items.weapon.enchantments.kinetic$conserveddamage.name=инерция
items.weapon.enchantments.kinetic$conserveddamage.desc=Ваше оружие сохранило избыточный урон от предыдущего убийства и добавит его к вашей следующей атаке. Со временем, этот бонус будет постепенно уменьшаться.\n\nСохраненный урон: %d.

items.weapon.enchantments.corrupting.name=%s подчинения
items.weapon.enchantments.corrupting.desc=Это мощное зачарование обладает способностью подчинять врагов вашей воле. Когда враг убит этим оружием, есть вероятность, что вместо смерти он будет подчинен.
items.weapon.enchantments.corrupting.elestrike_desc=Стихийный удар с зачарованием подчинения имеет 5-25% шанс (в зависимости от недостающего здоровья) подчинить каждого врага в радиусе, кроме основной цели.

items.weapon.enchantments.elastic.name=%s отталкивания
items.weapon.enchantments.elastic.desc=Отталкивающее оружие дает шанс отбросить противника на некоторое расстояние.
items.weapon.enchantments.elastic.elestrike_desc=Стихийный удар с зачарованием отталкивания откидывает всех врагов на 5 клеток.

items.weapon.enchantments.grim.name=%s погибели
items.weapon.enchantments.grim.desc=Это могущественное зачарование имеет силы мгновенно прикончить врага. Чем он слабее - тем выше вероятность срабатывания.
items.weapon.enchantments.grim.elestrike_desc=Стихийный удар с зачарованием погибели имеет шанс в 6-30% (в зависимости от недостающего здоровья) убить всех врагов в радиусе, кроме основной цели.

items.weapon.enchantments.lucky.name=%s удачи
items.weapon.enchantments.lucky.desc=Убитые оружием удачи враги могут оставлять дополнительные трофеи.
items.weapon.enchantments.lucky.elestrike_desc=Стихийный удар с зачарованием удачи имеет 12.5% шанс создать предмет под каждым задетым врагом. Этот эффект не может сработать на одном противнике дважды.

items.weapon.enchantments.projecting.name=%s проекции
items.weapon.enchantments.projecting.desc=С этим зачарованием оружие ближнего боя сможет бить дальше, а дальнего - проходить сквозь ближайшие стены, когда нацелено на ближайшие цели.
items.weapon.enchantments.projecting.elestrike_desc=Стихийный удар с зачарованием проекции наносит 30% урона каждому врагу в радиусе, кроме главной цели.

items.weapon.enchantments.shocking.name=%s молний
items.weapon.enchantments.shocking.desc=Разряды электричества от оружия молний наносят дополнительный урон врагам поблизости.
items.weapon.enchantments.shocking.elestrike_desc=Стихийный удар с зачарованием молний выпустит электрическую бурю, которая распространится на каждую клетку в радиусе и будет длиться 8 ходов.

items.weapon.enchantments.unstable.name=%s хаоса
items.weapon.enchantments.unstable.desc=Это зачарование излучает хаотическую энергию, давая непредвиденный результат при каждой атаке.
items.weapon.enchantments.unstable.elestrike_desc=Стихийный удар с зачарованием хаоса вызовет случайный эффект зачарования у каждого врага в радиусе действия, кроме основной цели.

items.weapon.enchantments.vampiric.name=%s вампиризма
items.weapon.enchantments.vampiric.desc=Это могущественное зачарование с каждым ударом вытягивает жизненные силы врагов и передает их владельцу. Чем меньше здоровья у того, кто его носит, тем сильнее этот эффект.
items.weapon.enchantments.vampiric.elestrike_desc=Стихийный удар с зачарованием вампиризма вылечит Дуэлянта на 2.5 ОЗ за каждого врага в области поражения.


###melee weapons
items.weapon.melee.assassinsblade.name=клинок убийцы
items.weapon.melee.assassinsblade.stats_desc=Это оружие эффективнее при скрытных атаках.
items.weapon.melee.assassinsblade.ability_name=спрятаться
items.weapon.melee.assassinsblade.typical_ability_desc=Дуэлянт с клинком убийцы может _спрятаться_. Эта способность позволяет мгновенно совершить скачок до 3 клеток и обычно даёт _%d хода невидимости._
items.weapon.melee.assassinsblade.ability_desc=Дуэлянт с клинком убийцы может _спрятаться_. Эта способность позволяет мгновенно совершить скачок до 3 клеток и даёт _%d хода невидимости._
items.weapon.melee.assassinsblade.upgrade_ability_stat_name=Длительность Способности
items.weapon.melee.assassinsblade.desc=Небольшое волнистое лезвие из обсидиана. Несмотря на лёгкий вес, оно неудобно в применении, но смертоносно при точном ударе.

items.weapon.melee.battleaxe.name=боевой топор
items.weapon.melee.battleaxe.stats_desc=Это довольно меткое оружие.
items.weapon.melee.battleaxe.ability_name=мощный удар
items.weapon.melee.battleaxe.typical_ability_desc=Дуэлянт может совершить _мощный удар_ боевым топором. Эта концентрированная атака обычно наносит _%1$d-%2$d урона_, если враг был застигнут врасплох, а также ошеломляет его на 5 ходов, чем снижает точность и уклонение на 50%%. Мощный удар всегда попадает в цель, но наносит обычный урон, если он не застает врага врасплох.
items.weapon.melee.battleaxe.ability_desc=Дуэлянт может совершить _мощный удар_ боевым топором. Эта концентрированная атака наносит _%1$d-%2$d урона_, если враг был застигнут врасплох, а также ошеломляет его на 5 ходов, чем снижает точность и уклонение на 50%%. Мощный удар всегда попадает в цель, но наносит обычный урон, если он не застает врага врасплох.
items.weapon.melee.battleaxe.desc=Огромное стальное лезвие этого топора позволяет наносить удары с устрашающей силой.

items.weapon.melee.crossbow.name=арбалет
items.weapon.melee.crossbow.typical_stats_desc=Когда экипировано, это оружие обычно позволяет наносить дротикам на _%1$d-%2$d_ больше урона и даже наделяет их своим зачарованием.
items.weapon.melee.crossbow.stats_desc=Когда экипировано, это оружие позволяет наносить дротикам на _%1$d-%2$d_ больше урона и даже наделяет их своим зачарованием.
items.weapon.melee.crossbow.ability_name=заряженный выстрел
items.weapon.melee.crossbow.typical_ability_desc=Дуэлянт может _зарядить_ её арбалет, благодаря чему её следующая атака им гарантированно попадёт в цель и применит один из трёх эффектов: рукопашная атака откинет врага, несмазанные дротики обычно будут наносить на _%1$d больше_ урона, а смазанные применят их эффект на площади 7х7 и могут остаться смазанными на _%2$d больше применений_.
items.weapon.melee.crossbow.ability_desc=Дуэлянт может _зарядить_ её арбалет, благодаря чему её следующая атака им гарантированно попадёт в цель и применит один из трёх эффектов: рукопашная атака откинет врага, несмазанные дротики будут наносить на _%1$d больше_ урона, а смазанные применят их эффект на площади 7х7 и останутся смазанными на _%2$d больше применений_.
items.weapon.melee.crossbow.desc=Замысловатое оружие, позволяющее стрелять дротиками со значительной силой. Хоть арбалет и не предназначен для ближнего боя, но его вес и прочность позволяют использовать его как дубину.
items.weapon.melee.crossbow.upgrade_ability_stat_name=Усиление Способности
items.weapon.melee.crossbow$chargedshot.name=заряжен
items.weapon.melee.crossbow$chargedshot.desc=Дуэлянт концентрируется и усиливает свой арбалет. Следующая атака им гарантированно попадёт в цель и применит один из трёх эффектов:\n- Рукопашная атака откинет врагов на несколько клеток.\n- Несмазанные дротики нанесут дополнительный урон.\n- Смазанные дротики получат дополнительные использования и применят свои эффекты по площади 7х7. Положительные эффекты дротиков применяются только к союзникам, а отрицательные только к противникам. Дуэлянт не может использовать эту способность, чтобы наложить на себя положительные эффекты дротиков.

items.weapon.melee.cudgel.name=палица
items.weapon.melee.cudgel.stats_desc=Это довольно меткое оружие.
items.weapon.melee.cudgel.ability_name=мощный удар
items.weapon.melee.cudgel.typical_ability_desc=Дуэлянт может совершить _мощный удар_ палицей. Эта концентрированная атака обычно наносит _%1$d-%2$d урона_, если враг был застигнут врасплох, а также ошеломляет его на 5 ходов, чем снижает точность и уклонение на 50%%. Мощный удар всегда попадает в цель, но наносит обычный урон, если он не застает врага врасплох.
items.weapon.melee.cudgel.ability_desc=Дуэлянт может совершить _мощный удар_ палицей. Эта концентрированная атака наносит _%1$d-%2$d урона_, если враг был застигнут врасплох, а также ошеломляет его на 5 ходов, чем снижает точность и уклонение на 50%%. Мощный удар всегда попадает в цель, но наносит обычный урон, если он не застает врага врасплох.
items.weapon.melee.cudgel.desc=Маленькая латунная дубина, предназначенная больше как средство самообороны для знати, чем как оружие для приключений.
items.weapon.melee.cudgel.discover_hint=Один из героев начинает с этим предметом.

items.weapon.melee.dagger.name=кинжал
items.weapon.melee.dagger.stats_desc=Это оружие эффективнее при скрытных атаках.
items.weapon.melee.dagger.ability_name=спрятаться
items.weapon.melee.dagger.typical_ability_desc=Дуэлянт с кинжалом может _спрятаться_. Эта способность позволяет мгновенно совершить скачок до 5 клеток и обычно даёт _%d хода невидимости._
items.weapon.melee.dagger.ability_desc=Дуэлянт с кинжалом может _спрятаться_. Эта способность позволяет мгновенно совершить скачок до 5 клеток и даёт _%d хода невидимости._
items.weapon.melee.dagger.upgrade_ability_stat_name=Длительность Способности
items.weapon.melee.dagger.desc=Простой деревянный кинжал с изношенной деревянной рукоятью.
items.weapon.melee.dagger.discover_hint=Один из героев начинает с этим предметом.

items.weapon.melee.dirk.name=кортик
items.weapon.melee.dirk.stats_desc=Это оружие эффективнее при скрытных атаках.
items.weapon.melee.dirk.ability_name=спрятаться
items.weapon.melee.dirk.typical_ability_desc=Дуэлянт с кортиком может _спрятаться_. Эта способность позволяет мгновенно совершить скачок до 4 клеток и обычно даёт _%d хода невидимости._
items.weapon.melee.dirk.ability_desc=Дуэлянт с кортиком может _спрятаться_. Эта способность позволяет мгновенно совершить скачок до 4 клеток и даёт _%d хода невидимости._
items.weapon.melee.dirk.upgrade_ability_stat_name=Длительность Способности
items.weapon.melee.dirk.desc=Кортик длиннее обычного кинжала, поэтому позволяет наносить более глубокие раны.

items.weapon.melee.flail.name=кистень
items.weapon.melee.flail.stats_desc=Это оружие не отличается особой точностью.\nИм нельзя осуществить неожиданную атаку.
items.weapon.melee.flail.ability_name=вращать
items.weapon.melee.flail.spin_warn=Вы больше не можете вращать кистень.
items.weapon.melee.flail.typical_ability_desc=Дуэлянт может _вращать_ кистень, чтобы увеличить его силу на короткое время. Обычно, пока кистень вращается, следующая атака им может вплоть до 3 раз получить _+%d дополнительного урона_. Вращающийся кистень гарантированно попадает в цель. Только начать крутить кистень стоит заряд оружия.
items.weapon.melee.flail.ability_desc=Дуэлянт может _вращать_ кистень, чтобы увеличить его силу на короткое время. Пока кистень вращается, следующая атака им может вплоть до 3 раз получить _+%d дополнительного урона_. Вращающийся кистень гарантированно попадает в цель. Только начать крутить кистень стоит заряд оружия.
items.weapon.melee.flail.desc=Шипастый шар на цепи, присоединённой к рукояти. Крайне неуклюжее оружие, но сокрушительное при точном попадании.
items.weapon.melee.flail$spinabilitytracker.name=вращение
items.weapon.melee.flail$spinabilitytracker.desc=Дуэлянт раскручивает свой кистень, увеличивая урон следующей обычной атаки этим оружием. Каждое вращение занимает 1 ход, но увеличивает урон до максимум трех вращений. Раскрученный кистень гарантированно попадет в цель.\n\nТекущая раскрутка: %1$d%%.\nХодов осталось: %2$s.

items.weapon.melee.gauntlet.name=каменная перчатка
items.weapon.melee.gauntlet.stats_desc=Это очень быстрое оружие.
items.weapon.melee.gauntlet.ability_name=двойной удар
items.weapon.melee.gauntlet.typical_ability_desc=Дуэлянт может совершить _двойной удар_ каменной перчаткой. Эта атака гарантированно попадёт в цель и обычно наносит на _%d больше урона_ за каждый раз, когда Дуэлянт удачно попала в противника в ближнем бою или метательным оружием. Комбо сбрасывается, если ей не удаётся провести успешную атаку в течение 5 ходов.
items.weapon.melee.gauntlet.ability_desc=Дуэлянт может совершить _двойной удар_ каменной перчаткой. Эта атака гарантированно попадёт в цель и наносит на _%d больше урона_ за каждый раз, когда Дуэлянт удачно попала в противника в ближнем бою или метательным оружием. Комбо сбрасывается, если ей не удаётся провести успешную атаку в течение 5 ходов.
items.weapon.melee.gauntlet.desc=Эта зачарованная перчатка сделана из ткани багрового цвета и покрыта каменными пластинами. Она отлично облегает вашу руку, из-за чего толстые пластины чувствуются как вторая кожа. Использование такого оружия требует большой силы, зато придаёт вашим ударам невероятную мощь.

items.weapon.melee.glaive.name=глефа
items.weapon.melee.glaive.stats_desc=Это довольно медленное оружие.\nЭто оружие имеет повышенную дальность атаки.
items.weapon.melee.glaive.ability_name=пронзить
items.weapon.melee.glaive.typical_ability_desc=Дуэлянт, используя наконечник глефы, может _пронзить_ врага в зоне досягаемости, но не стоящего вплотную. Эта атака обычно наносит _%1$d-%2$d урона_, отталкивает противника и гарантированно попадает в цель.
items.weapon.melee.glaive.ability_desc=Дуэлянт, используя наконечник глефы, может _пронзить_ врага в зоне досягаемости, но не стоящего вплотную. Эта атака наносит _%1$d-%2$d урона_, отталкивает противника и гарантированно попадает в цель.
items.weapon.melee.glaive.desc=Крупное древковое оружие с длинным клинком на конце.

items.weapon.melee.gloves.name=шипованные перчатки
items.weapon.melee.gloves.stats_desc=Это очень быстрое оружие.
items.weapon.melee.gloves.ability_name=двойной удар
items.weapon.melee.gloves.typical_ability_desc=Дуэлянт может совершить _двойной удар_ шипованными перчатками. Эта атака гарантированно попадёт в цель и обычно наносит на _%d больше урона_ за каждый раз, когда Дуэлянт удачно попала в противника в ближнем бою или метательным оружием. Комбо сбрасывается, если ей не удаётся провести успешную атаку в течение 5 ходов.
items.weapon.melee.gloves.ability_desc=Дуэлянт может совершить _двойной удар_ шипованными перчатками. Эта атака гарантированно попадёт в цель и наносит на _%d больше урона_ за каждый раз, когда Дуэлянт удачно попала в противника в ближнем бою или метательным оружием. Комбо сбрасывается, если ей не удаётся провести успешную атаку в течение 5 ходов.
items.weapon.melee.gloves.desc=Эти шипованные перчатки не обеспечивают никакой защиты, но они выступают в качестве неплохого оружия, оставляя руки свободными.
items.weapon.melee.gloves.discover_hint=Один из героев начинает с этим предметом.

items.weapon.melee.greataxe.name=секира
items.weapon.melee.greataxe.stats_desc=Это невероятно тяжёлое оружие.
items.weapon.melee.greataxe.ability_name=возмездие
items.weapon.melee.greataxe.typical_ability_desc=Дуэлянт может совершить _удар возмездия_ секирой, если у неё меньше 50%% здоровья. Эта уничтожающая всё и вся атака обычно наносит _%1$d-%2$d урона_, гарантированно попадает в цель и моментальна, если убивает врага.
items.weapon.melee.greataxe.ability_desc=Дуэлянт может совершить _удар возмездия_ секирой, если у неё меньше 50%% здоровья. Эта уничтожающая всё и вся атака наносит _%1$d-%2$d урона_, гарантированно попадает в цель и моментальна, если убивает врага.
items.weapon.melee.greataxe.desc=Предназначенный для ношения на плече, этот массивный топор настолько же опасен, насколько тяжёл.

items.weapon.melee.greatshield.name=ростовой щит
items.weapon.melee.greatshield.typical_stats_desc=Обычно это оружие блокирует от 0 до %d урона. Этот блок зависит от уровня оружия.
items.weapon.melee.greatshield.stats_desc=Это оружие блокирует от 0 до %d урона. Этот блок зависит от уровня оружия.
items.weapon.melee.greatshield.ability_name=защититься
items.weapon.melee.greatshield.typical_ability_desc=Дуэлянт может _защитить_ себя ростовым щитом, становясь полностью неуязвимой к физическим и магическим атакам обычно в течение _%d ходов_. Как только Дуэлянт заблокирует атаку, атакование в ответ или использование магии разрушит её защиту.
items.weapon.melee.greatshield.ability_desc=Дуэлянт может _защитить_ себя ростовым щитом, становясь полностью неуязвимой к физическим и магическим атакам в течение _%d ходов_. Как только Дуэлянт заблокирует атаку, атакование в ответ или использование магии разрушит её защиту.
items.weapon.melee.greatshield.upgrade_ability_stat_name=Длительность Способности
items.weapon.melee.greatshield.desc=Больше похожий на переносную стену, этот гигантский лист металла обеспечивает отличную защиту, но не слишком подходит для нападения.

items.weapon.melee.greatsword.name=двуручный меч
items.weapon.melee.greatsword.ability_name=рассечь
items.weapon.melee.greatsword.typical_ability_desc=Дуэлянт может _рассечь_ врага двуручным мечом. Эта атака обычно наносит _%1$d-%2$d урона_ и гарантированно попадает в цель. Если, рассекая противника, Дуэлянт убивает его, то она может использовать эту атаку ещё раз бесплатно на протяжении 5 ходов.
items.weapon.melee.greatsword.ability_desc=Дуэлянт может _рассечь_ врага двуручным мечом. Эта атака наносит _%1$d-%2$d урона_ и гарантированно попадает в цель. Если, рассекая противника, Дуэлянт убивает его, то она может использовать эту атаку ещё раз бесплатно на протяжении 5 ходов.
items.weapon.melee.greatsword.desc=Внушительный клинок этого меча придает его взмахам огромную силу.

items.weapon.melee.handaxe.name=ручной топор
items.weapon.melee.handaxe.stats_desc=Это довольно меткое оружие.
items.weapon.melee.handaxe.ability_name=мощный удар
items.weapon.melee.handaxe.typical_ability_desc=Дуэлянт может совершить _мощный удар_ ручным топором. Эта концентрированная атака обычно наносит _%1$d-%2$d урона_, если враг был застигнут врасплох, а также ошеломляет его на 5 ходов, чем снижает точность и уклонение на 50%%. Мощный удар всегда попадает в цель, но наносит обычный урон, если он не застает врага врасплох.
items.weapon.melee.handaxe.ability_desc=Дуэлянт может совершить _мощный удар_ ручным топором. Эта концентрированная атака наносит _%1$d-%2$d урона_, если враг был застигнут врасплох, а также ошеломляет его на 5 ходов, чем снижает точность и уклонение на 50%%. Мощный удар всегда попадает в цель, но наносит обычный урон, если он не застает врага врасплох.
items.weapon.melee.handaxe.desc=Лёгкий топор, часто применяемый для рубки деревьев. Его широкое топорище неплохо справится и с врагами.

items.weapon.melee.katana.name=катана
items.weapon.melee.katana.stats_desc=Это оружие блокирует от 0 до 3 урона.
items.weapon.melee.katana.ability_name=выпад
items.weapon.melee.katana.typical_ability_desc=Дуэлянт с катаной может сделать _выпад_ в сторону врага, который находится на расстоянии в 1 клетку. Выпад сближает с противником, обычно нанося ему _%1$d-%2$d урона_ и гарантированно попадает в цель.
items.weapon.melee.katana.ability_desc=Дуэлянт с катаной может сделать _выпад_ в сторону врага, который находится на расстоянии в 1 клетку. Выпад сближает с противником, нанося ему _%1$d-%2$d урона_ и гарантированно попадает в цель.
items.weapon.melee.katana.desc=Тонкий меч с большой металлической гардой над рукоятью.

items.weapon.melee.longsword.name=длинный меч
items.weapon.melee.longsword.ability_name=рассечь
items.weapon.melee.longsword.typical_ability_desc=Дуэлянт может _рассечь_ врага длинным мечом. Эта атака обычно наносит _%1$d-%2$d урона_ и гарантированно попадает в цель. Если, рассекая противника, Дуэлянт убивает его, это происходит мгновенно, то она может использовать эту атаку ещё раз бесплатно на протяжении 5 ходов.
items.weapon.melee.longsword.ability_desc=Дуэлянт может _рассечь_ врага длинным мечом. Эта атака наносит _%1$d-%2$d урона_ и гарантированно попадает в цель. Если, рассекая противника, Дуэлянт убивает его, это происходит мгновенно, то она может использовать эту атаку ещё раз бесплатно на протяжении 5 ходов.
items.weapon.melee.longsword.desc=Длинный бритвенно-острый клинок этого меча успокаивающе блестит, хотя из-за своего размера он довольно тяжёл.

items.weapon.melee.mace.name=булава
items.weapon.melee.mace.stats_desc=Это довольно меткое оружие.
items.weapon.melee.mace.ability_name=мощный удар
items.weapon.melee.mace.typical_ability_desc=Дуэлянт может совершить _мощный удар_ булавой. Эта концентрированная атака обычно наносит _%1$d-%2$d урона_, если враг был застигнут врасплох, а также ошеломляет его на 5 ходов, чем снижает точность и уклонение на 50%%. Мощный удар всегда попадает в цель, но наносит обычный урон, если он не застает врага врасплох.
items.weapon.melee.mace.ability_desc=Дуэлянт может совершить _мощный удар_ булавой. Эта концентрированная атака наносит _%1$d-%2$d урона_, если враг был застигнут врасплох, а также ошеломляет его на 5 ходов, чем снижает точность и уклонение на 50%%. Мощный удар всегда попадает в цель, но наносит обычный урон, если он не застает врага врасплох.
items.weapon.melee.mace.desc=Железное навершие этого оружия способно нанести значительные повреждения.

items.weapon.melee.magesstaff.name=посох Мага
items.weapon.melee.magesstaff.ac_imbue=НАДЕЛИТЬ
items.weapon.melee.magesstaff.ac_zap=ИСПОЛЬЗОВАТЬ
items.weapon.melee.magesstaff.prompt=Выберите палочку
items.weapon.melee.magesstaff.imbue=Вы используете %s для того, чтобы наделить ваш посох его силой.
items.weapon.melee.magesstaff.preserved=Предыдущая палочка была сохранена!
items.weapon.melee.magesstaff.imbue_desc=Вы уверены, что хотите наделить свой посох силой этой палочки?\n\nЕсли наделяемая палочка имеет тот же или более высокий уровень, что и посох, посох унаследует уровень этой палочки плюс одно из его собственных улучшений.
items.weapon.melee.magesstaff.imbue_level=Таким образом, получится посох _+%d уровня._
items.weapon.melee.magesstaff.imbue_unknown=Вы не знаете уровень этой палочки, но в результате получится посох хотя бы _+%d уровня._
items.weapon.melee.magesstaff.imbue_cursed=_Если вы наделите свой посох силой проклятой палочки, то и ваш посох станет проклятым!_
items.weapon.melee.magesstaff.imbue_lost=Палочка, силой которой в данный момент наполнен ваш посох, _будет потеряна_.
items.weapon.melee.magesstaff.imbue_talent=Палочка, силой которой в данный момент наполнен ваш посох, _будет возвращена как +0_.
items.weapon.melee.magesstaff.yes=Да, я уверен
items.weapon.melee.magesstaff.no=Нет, я передумал
items.weapon.melee.magesstaff.desc=Созданный самим Магом, этот посох является уникальным волшебным оружием, которое может быть наделено силой любой палочки.
items.weapon.melee.magesstaff.no_wand=Сейчас посох не имеет особой магии, его нужно _наделить силой палочки,_ чтобы получить возможность использовать заклинания.
items.weapon.melee.magesstaff.has_wand=Сейчас этот посох наделён той же силой, что и _%s._
items.weapon.melee.magesstaff.cursed_wand=Посох проклят, что делает его магию хаотичной и случайной.
items.weapon.melee.magesstaff.discover_hint=Один из героев начинает с этим предметом.

items.weapon.melee.meleeweapon.ac_ability=СПОСОБНОСТЬ
items.weapon.melee.meleeweapon.stats_known=Это оружие ближнего боя _%1$d-го уровня_ наносит _%2$d-%3$d ед. урона_ и требует _%4$d очков силы_ для эффективного использования.
items.weapon.melee.meleeweapon.stats_unknown=Это оружие ближнего боя _%1$d-го уровня_ обычно наносит _%2$d-%3$d ед. урона_ и требует _%4$d очков силы_ для эффективного использования.
items.weapon.melee.meleeweapon.probably_too_heavy=Вероятно, это оружие будет слишком тяжело для вас.
items.weapon.melee.meleeweapon.stats_desc=
items.weapon.melee.meleeweapon.ability_need_equip=Вы должны экипировать это оружие, чтобы использовать его способность.
items.weapon.melee.meleeweapon.ability_low_str=Вы недостаточно сильны чтобы использовать способность этого оружия.
items.weapon.melee.meleeweapon.ability_no_charge=У вас недостаточно энергии чтобы использовать эту способность.
items.weapon.melee.meleeweapon.ability_cant_use=Вы не можете использовать эту способность сейчас.
items.weapon.melee.meleeweapon.ability_no_target=Там нет цели.
items.weapon.melee.meleeweapon.ability_target_range=Эта цель недосягаема.
items.weapon.melee.meleeweapon.ability_occupied=Это место занято.
items.weapon.melee.meleeweapon.upgrade_ability_stat_name=Урон Способности
items.weapon.melee.meleeweapon.prompt=Выберите Цель
items.weapon.melee.meleeweapon.swap=Поменять Оружия
items.weapon.melee.meleeweapon.swap_full=Вы не можете делать это с полным инвентарем.


items.weapon.melee.shortsword.name=короткий меч
items.weapon.melee.shortsword.ability_name=рассечь
items.weapon.melee.shortsword.typical_ability_desc=Дуэлянт может _рассечь_ врага коротким мечом. Эта атака обычно наносит _%1$d-%2$d урона_ и гарантированно попадает в цель. Если, рассекая противника, Дуэлянт убивает его, то она может использовать эту атаку ещё раз бесплатно на протяжении 5 ходов.
items.weapon.melee.shortsword.ability_desc=Дуэлянт может _рассечь_ врага коротким мечом. Эта атака наносит _%1$d-%2$d урона_ и гарантированно попадает в цель. Если, рассекая противника, Дуэлянт убивает его, то она может использовать эту атаку ещё раз бесплатно на протяжении 5 ходов.
items.weapon.melee.shortsword.desc=Довольно короткий меч, всего на несколько дюймов длиннее кинжала.

items.weapon.melee.quarterstaff.name=боевой посох
items.weapon.melee.quarterstaff.stats_desc=Это оружие блокирует от 0 до 2 урона.
items.weapon.melee.quarterstaff.ability_name=встать в стойку
items.weapon.melee.quarterstaff.typical_ability_desc=Дуэлянт может принять _защитную стойку_ со своим боевым посохом. Стойка не требует времени на активацию и утраивает её уклонение обычно на _%d ходов_.
items.weapon.melee.quarterstaff.ability_desc=Дуэлянт может принять _защитную стойку_ со своим боевым посохом. Стойка не требует времени на активацию и утраивает её уклонение на _%d ходов_.
items.weapon.melee.quarterstaff.upgrade_ability_stat_name=Длительность Способности
items.weapon.melee.quarterstaff.desc=Посох из крепкого дерева с нехилыми железными набалдашниками на обоих концах.
items.weapon.melee.quarterstaff$defensivestance.name=встать в стойку
items.weapon.melee.quarterstaff$defensivestance.desc=Дуэлянт использует свой боевой посох для защиты от ударов и выстрелов. Пока она в своей стойке, шанс уклонения от атак утроен.\n\nХодов осталось: %s.

items.weapon.melee.rapier.name=шпага
items.weapon.melee.rapier.stats_desc=Это оружие блокирует от 0 до 1 урона.
items.weapon.melee.rapier.ability_name=выпад
items.weapon.melee.rapier.typical_ability_desc=Дуэлянт может шпагой сделать _выпад_ во врага, который находится на расстоянии в 1 клетку. Выпад сближает с противником, обычно нанося ему _%1$d-%2$d урона_ и гарантированно попадает в цель.
items.weapon.melee.rapier.ability_desc=Дуэлянт может шпагой сделать _выпад_ во врага, который находится на расстоянии в 1 клетку. Выпад сближает с противником, нанося ему _%1$d-%2$d урона_ и гарантированно попадает в цель.
items.weapon.melee.rapier.desc=Тонкий и длинный меч, который обеспечивает защиту взамен на рубящую силу.
items.weapon.melee.rapier.discover_hint=Один из героев начинает с этим предметом.

items.weapon.melee.roundshield.name=круглый щит
items.weapon.melee.roundshield.typical_stats_desc=Обычно это оружие блокирует от 0 до %d урона. Этот блок зависит от уровня оружия.
items.weapon.melee.roundshield.stats_desc=Это оружие блокирует от 0 до %d урона. Этот блок зависит от уровня оружия.
items.weapon.melee.roundshield.ability_name=защититься
items.weapon.melee.roundshield.typical_ability_desc=Дуэлянт может _защитить_ себя круглым щитом, становясь полностью неуязвимой к физическим и магическим атакам обычно в течение _%d ходов_. Как только Дуэлянт заблокирует атаку, атакование в ответ или использование магии разрушит её защиту.
items.weapon.melee.roundshield.ability_desc=Дуэлянт может _защитить_ себя круглым щитом, становясь полностью неуязвимой к физическим и магическим атакам в течение _%d ходов_. Как только Дуэлянт заблокирует атаку, атакование в ответ или использование магии разрушит её защиту.
items.weapon.melee.roundshield.upgrade_ability_stat_name=Длительность Способности
items.weapon.melee.roundshield.desc=Этот большой щит хорошо защищает от ударов и, в трудную минуту, может даже послужить вместо оружия.
items.weapon.melee.roundshield$guardtracker.name=защищается
items.weapon.melee.roundshield$guardtracker.guarded=под защитой
items.weapon.melee.roundshield$guardtracker.desc=Дуэлянт подготовила свой щит в ожидании атак. Она неуязвима к физическим или магическим атакам.\n\nХодов осталось: %s.

items.weapon.melee.runicblade.name=рунный клинок
items.weapon.melee.runicblade.stats_desc=Урон этого оружия гораздо сильнее возрастает при улучшении.
items.weapon.melee.runicblade.ability_name=рунический удар
items.weapon.melee.runicblade.typical_ability_desc=Дуэлянт может совершить _рунический удар_ рунным клинком. Атака гарантированно попадает по цели и обычно увеличивает на _+%d%% силу зачарования._
items.weapon.melee.runicblade.ability_desc=Дуэлянт может совершить _рунический удар_ рунным клинком. Атака гарантированно попадает по цели и увеличивает на _+%d%% силу зачарования._
items.weapon.melee.runicblade.upgrade_ability_stat_name=Сила Способности
items.weapon.melee.runicblade.desc=Загадочное оружие из дальней страны со светло-голубым лезвием.

items.weapon.melee.sai.name=сай
items.weapon.melee.sai.stats_desc=Это очень быстрое оружие.
items.weapon.melee.sai.ability_name=двойной удар
items.weapon.melee.sai.typical_ability_desc=Дуэлянт может совершить _двойной удар_ используя сай. Эта атака гарантированно попадёт в цель и обычно наносит на _%d больше урона_ за каждый раз, когда Дуэлянт удачно попала в противника в ближнем бою или метательным оружием. Комбо сбрасывается, если ей не удаётся провести успешную атаку в течение 5 ходов.
items.weapon.melee.sai.ability_desc=Дуэлянт может совершить _двойной удар_ используя сай. Эта атака гарантированно попадёт в цель и наносит на _%d больше урона_ за каждый раз, когда Дуэлянт удачно попала в противника в ближнем бою или метательным оружием. Комбо сбрасывается, если ей не удаётся провести успешную атаку в течение 5 ходов.
items.weapon.melee.sai.desc=Два тонких клинка, предназначенных для ношения в каждой руке. Превосходно подходит для уничтожения врагов шквалом порезов.
items.weapon.melee.sai$combostriketracker.name=двойной удар
items.weapon.melee.sai$combostriketracker.desc=Дуэлянт совершает комбо, которое может быть использовано для увеличения урона от способности "двойной удар". Засчитывается каждая удачная обычная атака рукопашным или метательным оружием, но непопадание по противникам в течение 5 ходов сбрасывает это комбо.\n\nКоличество попаданий: %1$d.\n\nХодов до сброса комбо: %2$s.

items.weapon.melee.scimitar.name=скимитар
items.weapon.melee.scimitar.stats_desc=Это довольно быстрое оружие.
items.weapon.melee.scimitar.ability_name=танец меча
items.weapon.melee.scimitar.typical_ability_desc=Дуэлянт со скимитаром в руках может исполнить боевой _танец с мечом_. Активация этой способности не требует времени и дарует Дуэлянту +60%% к скорости атаки и +50%% к точности. Обычно эффект продолжается _%d ходов._
items.weapon.melee.scimitar.ability_desc=Дуэлянт со скимитаром в руках может исполнить боевой _танец с мечом_. Активация этой способности не требует времени и дарует Дуэлянту +60%% к скорости атаки и +5%% к точности на _%d ходов._
items.weapon.melee.scimitar.upgrade_ability_stat_name=Длительность Способности
items.weapon.melee.scimitar.desc=Широкий изогнутый клинок. Его форма позволяет наносить быстрые, но менее сильные атаки.
items.weapon.melee.scimitar$sworddance.name=танец меча
items.weapon.melee.scimitar$sworddance.desc=Дуэлянт делает быстрые импульсные удары своим оружием, будто танцуя. Благодаря этому, она атакует на 60%% быстрее (этого достаточно, чтобы атаковать скимитаром дважды за ход) и увеличивает точность ударов на +50%%.\n\nХодов осталось: %s.

items.weapon.melee.sickle.name=серп
items.weapon.melee.sickle.stats_desc=Это довольно неточное оружие.
items.weapon.melee.sickle.ability_name=жатва
items.weapon.melee.sickle.typical_ability_desc=Дуэлянт может совершить _разрез_ серпом. Эта разрушительная атака гарантированно попадает по врагу и обычно наносит _%d урона_. Этот урон применяется как кровотечение, если цель не имеет иммунитет.
items.weapon.melee.sickle.ability_desc=Дуэлянт может совершить _разрез_ серпом. Эта разрушительная атака гарантированно попадает по врагу и наносит _%d урона_. Этот урон применяется как кровотечение, если цель не имеет иммунитет.
items.weapon.melee.sickle.desc=Ручной сельскохозяйственный инструмент, который можно использовать как мощное, но громоздкое оружие.

items.weapon.melee.spear.name=копьё
items.weapon.melee.spear.stats_desc=Это довольно медленное оружие.\nЭто оружие имеет повышенную дальность атаки.
items.weapon.melee.spear.ability_name=пронзить
items.weapon.melee.spear.typical_ability_desc=Дуэлянт, используя наконечник копья, может _пронзить_ врага в зоне досягаемости, но не стоящего вплотную. Эта атака обычно наносит _%1$d-%2$d урона_, отталкивает противника и гарантированно попадает в цель.
items.weapon.melee.spear.ability_desc=Дуэлянт, используя наконечник копья, может _пронзить_ врага в зоне досягаемости, но не стоящего вплотную. Эта атака наносит _%1$d-%2$d урона_, отталкивает противника и гарантированно попадает в цель.
items.weapon.melee.spear.desc=Тонкая длинная палка с куском заостренного железа на конце.

items.weapon.melee.sword.name=меч
items.weapon.melee.sword.ability_name=рассечь
items.weapon.melee.sword.typical_ability_desc=Дуэлянт может _рассечь_ врага мечом. Эта атака обычно наносит _%1$d-%2$d урона_ и гарантированно попадает в цель. Если, рассекая противника, Дуэлянт убивает его, то она может использовать эту атаку ещё раз бесплатно на протяжении 5 ходов.
items.weapon.melee.sword.ability_desc=Дуэлянт может _рассечь_ врага мечом. Эта атака наносит _%1$d-%2$d урона_ и гарантированно попадает в цель. Если, рассекая противника, Дуэлянт убивает его, то она может использовать эту атаку ещё раз бесплатно на протяжении 5 ходов.
items.weapon.melee.sword.desc=Прекрасно сбалансированный меч. Не очень большой, но всё же длиннее короткого меча.
items.weapon.melee.sword$cleavetracker.name=рассекание
items.weapon.melee.sword$cleavetracker.desc=Дуэлянт готова продолжать рассекать врагов! Следующее рассекание не будет требовать заряд оружия.\n\nХодов осталось: %s.

items.weapon.melee.warhammer.name=боевой молот
items.weapon.melee.warhammer.stats_desc=Это довольно меткое оружие.
items.weapon.melee.warhammer.ability_name=мощный удар
items.weapon.melee.warhammer.typical_ability_desc=Дуэлянт может совершить _мощный удар_ боевым молотом. Эта концентрированная атака обычно наносит _%1$d-%2$d урона_, если враг был застигнут врасплох, а также ошеломляет его на 5 ходов, чем снижает точность и уклонение на 50%%. Мощный удар всегда попадает в цель, но наносит обычный урон, если он не застает врага врасплох.
items.weapon.melee.warhammer.ability_desc=Дуэлянт может совершить _мощный удар_ боевым молотом. Эта концентрированная атака наносит _%1$d-%2$d урона_, если враг был застигнут врасплох, а также ошеломляет его на 5 ходов, чем снижает точность и уклонение на 50%%. Мощный удар всегда попадает в цель, но наносит обычный урон, если он не застает врага врасплох.
items.weapon.melee.warhammer.desc=Мало кто сможет устоять перед сокрушительной мощью этой громады из свинца и стали, но только сильнейшие способны использовать его в полную силу.

items.weapon.melee.warscythe.name=боевая коса
items.weapon.melee.warscythe.stats_desc=Это довольно неточное оружие.
items.weapon.melee.warscythe.ability_name=жатва
items.weapon.melee.warscythe.typical_ability_desc=Дуэлянт может совершить _разрез_ боевой косой. Эта разрушительная атака гарантированно попадает по врагу и обычно наносит _%d урона_. Этот урон применяется как кровотечение, если цель не имеет иммунитет.
items.weapon.melee.warscythe.ability_desc=Дуэлянт может совершить _разрез_ боевой косой. Эта разрушительная атака гарантированно попадает по врагу и наносит _%d урона_. Этот урон применяется как кровотечение, если цель не имеет иммунитет.
items.weapon.melee.warscythe.desc=Это крупный и громоздкий инструмент был усилен так, чтобы он лучше справлялся с уничтожением врагов, а не со сбором урожая.

items.weapon.melee.whip.name=кнут
items.weapon.melee.whip.stats_desc=Это оружие имеет огромную дальность атаки.
items.weapon.melee.whip.ability_name=хлестнуть
items.weapon.melee.whip.typical_ability_desc=Дуэлянт может _хлестнуть_ кнутом всех врагов вокруг. Эта способность обычно наносит _%1$d-%2$d урона_, атакует всех врагов в зоне действия кнута и гарантированно попадает.
items.weapon.melee.whip.ability_desc=Дуэлянт может _хлестнуть_ кнутом всех врагов вокруг. Эта способность наносит _%1$d-%2$d урона_, атакует всех врагов в зоне действия кнута и гарантированно попадает.
items.weapon.melee.whip.desc=Хотя этот покрытый шипами хлыст и трудно назвать настоящим оружием, его дальность атаки не имеет аналогов.

items.weapon.melee.wornshortsword.name=изношенный короткий меч
items.weapon.melee.wornshortsword.ability_name=рассечь
items.weapon.melee.wornshortsword.typical_ability_desc=Дуэлянт может _рассечь_ врага изношенным коротким мечом. Эта атака обычно наносит _%1$d-%2$d урона_ и гарантированно попадает в цель. Если, рассекая противника, Дуэлянт убивает его, то она может использовать эту атаку ещё раз бесплатно на протяжении 5 ходов.
items.weapon.melee.wornshortsword.ability_desc=Дуэлянт может _рассечь_ врага изношенным коротким мечом. Эта атака наносит _%1$d-%2$d урона_ и гарантированно попадает в цель. Если, рассекая противника, Дуэлянт убивает его, то она может использовать эту атаку ещё раз бесплатно на протяжении 5 ходов.
items.weapon.melee.wornshortsword.desc=Довольно короткий меч, уже сильно изношенный из-за длительного использования. Он слабее и немного легче обычного короткого меча лучшего состояния.
items.weapon.melee.wornshortsword.discover_hint=Один из героев начинает с этим предметом.


###missile weapons
items.weapon.missiles.darts.adrenalinedart.name=адреналиновый дротик
items.weapon.missiles.darts.adrenalinedart.desc=Эти дротики покрыты веществом на основе Скорополоха, которое увеличивает скорость передвижения и атаки союзников или ненадолго снижает скорость передвижения врагов. Сам дротик всё ещё наносит урон врагам, но для союзников он безопасен.

items.weapon.missiles.darts.blindingdart.name=ослепляющий дротик
items.weapon.missiles.darts.blindingdart.desc=Эти дротики, покрытые веществом на основе Слепняка, на некоторое время ослепляют жертву. Но они не дезориентируют её, так что противник запомнит ваше последнее известное местонахождение.

items.weapon.missiles.darts.chillingdart.name=замораживающий дротик
items.weapon.missiles.darts.chillingdart.desc=Эти дротики, покрытые веществом на основе Ледяной лилии, замораживают цель при попадании.

items.weapon.missiles.darts.cleansingdart.name=очищающий дротик
items.weapon.missiles.darts.cleansingdart.desc=Наконечник этих дротиков покрыт веществом на основе Магорозы, которое временно делает союзников невосприимчивыми ко всем негативным эффектам или снимает положительные эффекты с врагов. Враги могут даже ненадолго забыть, что они нападают на вас или убегают от вас. Сам дротик по-прежнему вреден для врагов, но не причинит вреда союзникам.

items.weapon.missiles.darts.dart.name=дротик
items.weapon.missiles.darts.dart.ac_tip=СМАЗАТЬ
items.weapon.missiles.darts.dart.prompt=Выберите семя
items.weapon.missiles.darts.dart.tip_title=Смазанные дротики
items.weapon.missiles.darts.dart.tip_desc=Один или два дротика можно отварить с семенами для того, чтобы покрыть их соответствующим составом. Составы стираются после одного попадания, но каждый из них имеет свой, уникальный эффект.\n\nСмазав дротик с этими семенами, вы получите _%s._
items.weapon.missiles.darts.dart.tip_all=Смазать %1$d дротиков %2$d семенами
items.weapon.missiles.darts.dart.tip_two=Смазать 2 дротика с 1 семенем
items.weapon.missiles.darts.dart.tip_one=Смазать 1 дротик с 1 семенем
items.weapon.missiles.darts.dart.tip_cancel=Отменить
items.weapon.missiles.darts.dart.desc=Эти простые деревянные стержни с заострённым наконечником сбалансированы так, что даже легкое движение кистью способно отправить их на значительное расстояние. Они могут быть смазаны семенами для получения дополнительных эффектов при попадании.
items.weapon.missiles.darts.dart.unlimited_uses=Благодаря своей простой конструкции дротики не сломаются никогда.

items.weapon.missiles.darts.displacingdart.name=телепортирующий дротик
items.weapon.missiles.darts.displacingdart.desc=Эти дротики, покрытые веществом на основе Ведьминого стебля, телепортируют цель назад на короткое расстояние.

items.weapon.missiles.darts.healingdart.name=исцеляющий дротик
items.weapon.missiles.darts.healingdart.desc=Эти дротики, покрытые веществом на основе Солнечника, ускоряют выздоровление цели. Сам дротик всё ещё наносит урон врагам, для союзников, однако, он безопасен.

items.weapon.missiles.darts.holydart.name=освященный дротик
items.weapon.missiles.darts.holydart.desc=Эти дротики, покрытые веществом на основе Звездоцвета, которое наполняют цель святой энергией. Союзники и обычные враги получат благословение, но такие враги, как нежить или демон, получат большой урон. Сам дротик всё еще наносит урон врагам, для союзников, однако, он безопасен.

items.weapon.missiles.darts.incendiarydart.name=поджигающий дротик
items.weapon.missiles.darts.incendiarydart.desc=Эти дротики, покрытые веществом на основе Огнецвета, при попадании загораются ярким пламенем.

items.weapon.missiles.darts.paralyticdart.name=парализующий дротик
items.weapon.missiles.darts.paralyticdart.desc=Эти дротики, покрытые веществом на основе Земляного корня, на некоторое время парализуют жертву.

items.weapon.missiles.darts.poisondart.name=отравленный дротик
items.weapon.missiles.darts.poisondart.desc=Эти дротики, покрытые веществом на основе Грустномоха, отравляют цель при попадании.

items.weapon.missiles.darts.rotdart.name=гнилостный дротик
items.weapon.missiles.darts.rotdart.desc=Эти коварные дротики покрыты веществом на основе гнилоягоды, разъедающим всё, чего коснётся кончик дротика. Сильные противники будут сопротивляться большей части эффекта, но коррозия достаточно сильна, чтобы убить большую часть обычных монстров. Эти дротики сохраняют эффект дольше, чем другие, однако длительность эффекта не может быть увеличена.
items.weapon.missiles.darts.rotdart.discover_hint=Вы можете создать этот предмет используя семечко с определённого задания.

items.weapon.missiles.darts.shockingdart.name=электрический дротик
items.weapon.missiles.darts.shockingdart.desc=Эти дротики, покрытые веществом на основе Грозовой лозы, при попадании ударят цель электрическим разрядом.

items.weapon.missiles.darts.tippeddart.ac_clean=ОЧИСТИТЬ
items.weapon.missiles.darts.tippeddart.clean_title=Очищенные дротики
items.weapon.missiles.darts.tippeddart.clean_desc=Это действие очистит дротик от эффекта семени, нанесенного на него, превратив его обратно в обычный дротик.
items.weapon.missiles.darts.tippeddart.clean_all=Очистить все
items.weapon.missiles.darts.tippeddart.clean_one=Очистить один
items.weapon.missiles.darts.tippeddart.cancel=Отменить
items.weapon.missiles.darts.tippeddart.uses_left=Осталось _%d/%d_ бросков перед тем, как один из дротиков потеряет эффект.
items.weapon.missiles.darts.tippeddart.unlimited_uses=_Но эти настолько хороши, что могут использоваться вечно._
items.weapon.missiles.darts.tippeddart.about_to_break=Ваш дротик скоро потеряет эффект.
items.weapon.missiles.darts.tippeddart.has_broken=Ваш дротик потерял эффект.
items.weapon.missiles.darts.tippeddart.discover_hint=Вы можете купить этот предмет в магазине или создать его с помощью семечка.


items.weapon.missiles.bolas.name=болас
items.weapon.missiles.bolas.stats_desc=Это оружие наносит хромоту на свою цель.
items.weapon.missiles.bolas.desc=Это необычное метательное оружие наносит не слишком много урона, но зато замедляет передвижение цели при попадании.

items.weapon.missiles.boomerang.name=бумеранг
items.weapon.missiles.boomerang.desc=Этот плоский изогнутый деревянный снаряд вернется к хозяину, если кинуть его во врага.
items.weapon.missiles.boomerang.durability=Благодаря своей конструкции, бумеранг не изнашивается при использовании.

items.weapon.missiles.fishingspear.name=рыболовное копьё
items.weapon.missiles.fishingspear.desc=Маленькие метательные копья, предназначенные для рыбалки. Вполне годятся и в качестве импровизированного оружия.

items.weapon.missiles.forcecube.name=силовой куб
items.weapon.missiles.forcecube.ondeath=Вы убили себя собственным Силовым Кубом...
items.weapon.missiles.forcecube.stats_desc=Это оружие распределяет силу своего удара, задевая все вокруг себя.
items.weapon.missiles.forcecube.desc=Эти странные кубики достаточно малы для того, чтобы держать их в руке, но невероятно тяжелые.

items.weapon.missiles.heavyboomerang.name=тяжелый бумеранг
items.weapon.missiles.heavyboomerang.stats_desc=Это оружие возвратится обратно туда, откуда оно было брошено, через пять ходов.
items.weapon.missiles.heavyboomerang.desc=Этот увесистый бумеранг трудно использовать эффективно, однако он наносит значительный урон.

items.weapon.missiles.javelin.name=пилум
items.weapon.missiles.javelin.desc=Эти увесистые метательные копья сбалансированы так, чтобы удерживать остриё точно впереди, пока оно пронзает воздух.

items.weapon.missiles.kunai.name=кунаи
items.weapon.missiles.kunai.stats_desc=Это оружие эффективнее при скрытных атаках.
items.weapon.missiles.kunai.desc=Эти маленькие ножи невероятно опасны в умелых руках.

items.weapon.missiles.missileweapon.stats_known=Этот комплект метательного оружия _%1$d-ого уровня_ наносит _%2$d-%3$d урона_ и требует _%4$d очков силы_ для использования.
items.weapon.missiles.missileweapon.stats_unknown=Как правило, этот комплект метательного оружия _%1$d-ого уровня_ наносит _%2$d-%3$d урона_ и требует _%4$d очков силы_ для использования.
items.weapon.missiles.missileweapon.stats_desc=
items.weapon.missiles.missileweapon.probably_too_heavy=Вероятно, это оружие будет слишком тяжело для вас.
items.weapon.missiles.missileweapon.distance=Шанс попадания метательным оружием уменьшается, если использовать его в ближнем бою.
items.weapon.missiles.missileweapon.durability=Метательные оружия постепенно изнашиваются при использовании.
items.weapon.missiles.missileweapon.uses_left=Осталось _%d/%d_ бросков перед тем, как сломается одно из метательных оружий.
items.weapon.missiles.missileweapon.unlimited_uses=Этот комплект настолько хорош, что его можно использовать вечно.
items.weapon.missiles.missileweapon.unknown_uses=Как правило, этот комплект метательных оружий будет иметь _%d_ бросков перед тем, как одно из них сломается.
items.weapon.missiles.missileweapon.curse_discover=Это метательное оружие проклято!
items.weapon.missiles.missileweapon.about_to_break=Брошенное вами оружие вот-вот сломается.
items.weapon.missiles.missileweapon.has_broken=Одно из ваших метательных оружий сломалось.
items.weapon.missiles.missileweapon.dust=Метательное оружие рассыпается в пыль при прикосновении.
items.weapon.missiles.missileweapon.break_upgraded_warn_desc=Если последнее метательное оружие в зачарованном комплекте сломается, комплект будет навсегда утерян. Вы уверены, что хотите его бросить?
items.weapon.missiles.missileweapon.break_upgraded_warn_yes=Да
items.weapon.missiles.missileweapon.break_upgraded_warn_no=Нет
items.weapon.missiles.missileweapon$placeholder.name=метательное оружие

items.weapon.missiles.shuriken.name=сюрикен
items.weapon.missiles.shuriken.stats_desc=Сюрикены можно бросать мгновенно с перезарядкой в 20 ходов.
items.weapon.missiles.shuriken.desc=Эти заточенные в форме звёздочек кусочки металла можно быстро использовать на ходу.
items.weapon.missiles.shuriken$shurikeninstanttracker.name=Перезарядка сюрикена
items.weapon.missiles.shuriken$shurikeninstanttracker.desc=Вы недавно использовали сюрикен мгновенно и должны подождать перед тем, как сделать это снова. Сюрикены всё ещё можно бросать, но с обычной скоростью.\n\nХодов осталось: %s.

items.weapon.missiles.throwingclub.name=метательная дубина
items.weapon.missiles.throwingclub.stats_desc=Это оружие не впивается во врага, его можно подобрать моментально.
items.weapon.missiles.throwingclub.desc=Это незамысловатое, но прочное метательное оружие, по сути, является просто большим камнем на палке.

items.weapon.missiles.throwinghammer.name=метательный молот
items.weapon.missiles.throwinghammer.stats_desc=Это оружие не впивается во врага, его можно подобрать моментально.
items.weapon.missiles.throwinghammer.desc=Эти здоровенные молоты предназначены для метания во врага. Их гладкая цельнометаллическая конструкция обеспечивает особенную прочность.

items.weapon.missiles.throwingknife.name=метательный нож
items.weapon.missiles.throwingknife.stats_desc=Это оружие эффективнее при скрытных атаках.
items.weapon.missiles.throwingknife.desc=Эти легковесные ножи сбалансированы так, чтобы по дугообразной траектории попадать прямо в цель.
items.weapon.missiles.throwingknife.discover_hint=Один из героев начинает с этим предметом.

items.weapon.missiles.throwingspear.name=метательное копьё
items.weapon.missiles.throwingspear.desc=Эти лёгкие и тонкие копья предназначены для метания, а не для ближнего боя.

items.weapon.missiles.throwingspike.name=метательная игла
items.weapon.missiles.throwingspike.desc=Эти прочные острые иглы предназначены для метания во врагов на расстоянии.
items.weapon.missiles.throwingspike.discover_hint=Один из героев начинает с этим предметом.

items.weapon.missiles.throwingstone.name=метательный камень
items.weapon.missiles.throwingstone.desc=Эти камни отшлифованы так, чтобы их можно было бросать сильнее обычных камней.
items.weapon.missiles.throwingstone.discover_hint=Один из героев начинает с этим предметом.

items.weapon.missiles.tomahawk.name=томагавк
items.weapon.missiles.tomahawk.stats_desc=Это оружие причиняет _%1$d-%2$d кровотечения_ цели.
items.weapon.missiles.tomahawk.typical_stats_desc=Это оружие обычно причиняет _%1$d-%2$d кровотечения_ цели.
items.weapon.missiles.tomahawk.desc=Эти метательные топоры имеют зазубренные края, которые впиваются во врага.

items.weapon.missiles.trident.name=трезубец
items.weapon.missiles.trident.desc=Массивные метательные копья с тремя смертоносными зубцами на конце. Мощные, но тяжеловатые.


items.weapon.spiritbow.name=Лук Духов
items.weapon.spiritbow.ac_shoot=ВЫСТРЕЛ
items.weapon.spiritbow.prompt=Выберите цель
items.weapon.spiritbow.stats=Лук не может быть улучшен напрямую, но вместо этого он будет постепенно улучшаться с получением новых уровней. На данном уровне, его стрелы будут наносить _%1$d-%2$d урона_ и требовать _%3$d очков силы_ для эффективного использования.
items.weapon.spiritbow.desc=Лук сделан из древнего волшебного дерева. Тетива лука и узоры светятся слабым голубоватым светом. Натянув тетиву, лук создаст волшебную стрелу, которую можно выпустить во врага.
items.weapon.spiritbow.discover_hint=Один из героев начинает с этим предметом.

items.weapon.weapon.identify=Вы достаточно долго знакомы с оружием, чтобы опознать его.
items.weapon.weapon.too_heavy=Из-за недостаточной силы, точность и скорость ваших атак с этим оружием будут снижены. Кроме того, вы не сможете совершать неожиданные атаки данным оружием.
items.weapon.weapon.excess_str=Благодаря избыточной силе, ваши атаки данным оружием будут наносить  _0-%d ед. доп. урона._
items.weapon.weapon.hardening_gone=Закалка на этом оружии стерлась!
items.weapon.weapon.incompatible=Взаимодействие несовместимой магии развеяло зачарование на этом оружии!
items.weapon.weapon.cursed_worn=Поскольку это оружие проклято, вы не в силах убрать его.
items.weapon.weapon.cursed=Вы чувствуете, что это оружие скрывает в себе какую-то темную магию.
items.weapon.weapon.weak_cursed=Даже несмотря на то, что это оружие проклято, вы можете убрать его.
items.weapon.weapon.not_cursed=Это оружие не проклято.
items.weapon.weapon.faster=Это оружие сбалансировано, чтобы увеличивать _скорость._
items.weapon.weapon.stronger=Это оружие сбалансировано, чтобы увеличивать _урон._
items.weapon.weapon.enchanted=наложено _%s._
items.weapon.weapon.enchant_hardened=Подверглось _закалке._
items.weapon.weapon.hardened_no_enchant=Это оружие прошло _закалку,_ но сейчас на нём не наложено зачарование.
items.weapon.weapon$enchantment.enchant=зачарование
items.weapon.weapon$enchantment.rankings_desc=Убит зачарованием
items.weapon.weapon$enchantment.discover_hint=Вы можете случайно найти предмет с этим эффектом в подземелье или попытаться самому нанести его на предмет.


###misc items
items.amulet.name=Амулет Индора
items.amulet.ac_end=ЗАКОНЧИТЬ ИГРУ
items.amulet.desc=Амулет Индора - мощнейший из известных человеческому и дворфскому роду артефактов. Его мерцающие кристаллы содержат неимоверную и удивительную магическую силу.
items.amulet.desc_origins=Неизвестно, откуда произошел амулет. Но история свидетельствует, что Король дворфов обнаружил его незадолго до того, как цивилизация дворфов отказалась от всех внешних контактов. Как он его обнаружил? Каким образом Йог-Джева получил от него амулет? Такие вопросы оставим на позже; все, что важно сейчас - амулет в ваших руках!
items.amulet.desc_ascent=Неизвестно, откуда произошел амулет, но очевидно, что на него сильно повлияла сила Йог-Джева. Подземелье, кажется, подчиняется воле Йога, когда вы проходите по нему, делая врагов намного более многочисленными и могущественными! Вы также больше не можете активировать или выбросить амулет, как будто он стал проклятым.
items.amulet.ascent_title=Восхождение
items.amulet.ascent_desc=Вы начинаете ощущать великую и ужасную силу Йог-Джевы, излучаемую амулетом. Восхождение обратно через подземелье в качестве смертного может оказаться сложнее, чем вы думали!\n\nЕсли вы продолжите восхождение с амулетом, подземелье станет более опасным, телепорты между этажами будут отключены, и вы сможете выиграть игру только, если выберетесь из подземелья, побеждая врагов!\n\nВы можете пока оставить амулет здесь, если хотите подняться, не начиная это испытание, или активировать амулет для восхождения, чтобы завершить игру в обычном режиме.
items.amulet.ascent_yes=Продолжить!
items.amulet.ascent_no=Остановиться сейчас
items.amulet.discover_hint=Вы можете найти этот предмет в самом низу подземелья...

items.ankh.name=анх
items.ankh.ac_bless=ОСВЯТИТЬ
items.ankh.bless=Вы освящаете анх волшебной водой.
items.ankh.desc=Этот древний символ дарует возможность возродиться после смерти. Большинство ваших предметов будет сохранено на месте смерти, и их можно будет подобрать, когда вы вернетесь на это место. Используя полный бурдюк с водой, можно освятить анх, придав ему дополнительные силы.
items.ankh.desc_blessed=Древний символ бессмертия даёт возможность возродиться после смерти. Анх освящён и обладает большей силой. Анх пожертвует собой, чтобы спасти вас от смерти.
items.ankh.discover_hint=Вы можете купить этот предмет в магазине.

items.arcaneresin.name=магическая смола
items.arcaneresin.prompt=Выберите палочку
items.arcaneresin.ac_apply=ИСПОЛЬЗОВАТЬ
items.arcaneresin.level_too_high=Эта палочка слишком сильна, смола не может её улучшить.
items.arcaneresin.not_enough=Недостаточно магической смолы!
items.arcaneresin.apply=Вы обволакиваете палочку смолой, делая её мощнее!
items.arcaneresin.desc=Этот порошок переливается всеми цветами от белого до фиолетового. Он может быть использован как усилитель магических свойств предмета, например, палочек.\n\nУлучшение палочек смолой потратит вплоть до трёх единиц, основываясь на изначальном уровне палочки. Смола может улучшить палочку до уровня +3.\n\nОднако, улучшения из смолы _стираются другими источниками улучшений_ (такими как свитки улучшения) и не применяются при слиянии волшебной палочки с посохом Мага.
items.arcaneresin.discover_hint=Вы можете создать этот предмет с помощью алхимии.

items.brokenseal.name=сломанная печать
items.brokenseal.ac_affix=ПРИКРЕПИТЬ
items.brokenseal.prompt=Выберите броню
items.brokenseal.unknown_armor=Сперва вам необходимо определить, проклята ли эта броня.
items.brokenseal.cursed_armor=Невозможно прикрепить печать к проклятой броне.
items.brokenseal.affix=Вы прикрепили печать к броне!
items.brokenseal.desc=Восковая печать, прикреплённая к броне как символ отваги. В её центре высечена поблёкшая руна защиты, а сама печать расколота надвое.\n\nБудучи памятью о доме, эта печать укрепляет воина. Когда он её носит, он будет мгновенно получать щит, как только будет ранен ниже половины здоровья.\n\nПечать можно _прикрепить к броне_, а так же переместить на другую. Она способна перенести один уровень улучшения, если улучшение было наложено на броню с печатью.
items.brokenseal.inscribed=На печати начертана _%s._
items.brokenseal.choose_title=Выберите руну
items.brokenseal.choose_desc=И эта броня и сломанная печать несут руну. Выберите, какую руну необходимо сохранить. \n\nРуна на броне: %1$s.\nРуна на сломанной печати: %2$s.\n\nОбратите внимание, что если вы выберите руну, которая сейчас на броне, печать не сможет перенести ее позже.
items.brokenseal.discover_hint=Один из героев начинает с этим предметом.
items.brokenseal$warriorshield.name=Щит Воина
items.brokenseal$warriorshield.desc_active=Сломанная печать Воина сейчас укрепляет его, даруя ему щит поверх собственного здоровья. Щит нельзя сразу же получить повторно – требуется время на перезарядку.\n\nЭтот щит не уменьшается со временем, но закончится, если рядом в течение нескольких ходов не будет врагов. Когда он заканчивается, весь оставшийся щит уменьшит перезарядку, вплоть до 50%%.\n\nЩита осталось: %1$d.\n\nТекущая перезарядка: %2$d.
items.brokenseal$warriorshield.desc_cooldown=Воин недавно получил щит от своей сломанной печати и должен подождать перед повторным получением эффекта.\n\nХодов осталось: %d.
items.brokenseal$warriorshield.desc_negative_cooldown=Откат щита Воина сейчас отрицательный, что значит, что когда его щит активируется, его перезарядка займёт меньше обычных 150 ходов. Откат щита может быть понижен до -150 ходов, что значит, что он мгновенно перезарядится при активации.\n\nТекущая перезарядка: %d

items.dewdrop.name=капля росы
items.dewdrop.already_full=Вы и так здоровы.
items.dewdrop.desc=Кристально чистая капля росы.\n\nБлагодаря магии этого места чистая вода обладает слабыми исцеляющими способностями.

items.equipableitem.curse_detected=Вы чувствуете что этот предмет проклят, прямо перед тем как его надеть!
items.equipableitem.unequip_cursed=Вы не можете снять проклятый предмет!
items.equipableitem.ac_equip=НАДЕТЬ
