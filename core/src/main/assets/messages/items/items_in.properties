items.weapon.missiles.missileweapon.durability=Senjata lempar akan perlahan rusak saat terus dipakai.
items.weapon.missiles.missileweapon.uses_left=Set senjata lempar ini dapat dipakai _%d/%d_ kali lagi sebelum salah satu rusak.
items.weapon.missiles.missileweapon.unlimited_uses=Set ini memiliki kualitas tinggi, sehingga efektif untuk bertahan selamanya.
