items.weapon.missiles.shuriken.name=shuriken
items.weapon.missiles.shuriken.stats_desc=Shuriken dapat dilempar langsung dengan cooldown 20 giliran.
items.weapon.missiles.shuriken.desc=Potongan logam berbentuk bintang dengan bilah setajam silet ini dapat dengan cepat dilempar saat bergerak.
items.weapon.missiles.shuriken$shurikeninstanttracker.name=cooldown shuriken
items.weapon.missiles.shuriken$shurikeninstanttracker.desc=Kamu baru saja melempar shuriken secara instan, dan harus menunggu sebelum melakukannya lagi. Shuriken masih bisa dilempar, tetapi dengan kecepatan senjata normal.\n\nGiliran Tersisa: %s.

items.weapon.missiles.throwingclub.name=palu lempar kecil
items.weapon.missiles.throwingclub.stats_desc=Senjata ini tidak menempel pada musuh dan bisa diambil secara instan.
items.weapon.missiles.throwingclub.desc=Senjata lempar yang cukup sederhana tetapi tahan lama, pada dasarnya berupa batu besar yang diikatkan pada tongkat.

items.weapon.missiles.throwinghammer.name=palu lempar
items.weapon.missiles.throwinghammer.stats_desc=Senjata ini tidak menempel pada musuh dan bisa diambil secara instan.
items.weapon.missiles.throwinghammer.desc=Palu-palu berat ini dirancang untuk dilempar ke arah musuh. Konstruksi logamnya yang halus membuatnya cukup tahan lama.

items.weapon.missiles.throwingknife.name=pisau lempar
items.weapon.missiles.throwingknife.stats_desc=Senjata ini lebih kuat melawan musuh yang sedang lengah.
items.weapon.missiles.throwingknife.desc=Pisau ringan ini diseimbangkan agar meluncur di udara tepat ke sasarannya.
items.weapon.missiles.throwingknife.discover_hint=Salah satu pahlawan berawal dengan item ini.

items.weapon.missiles.throwingspear.name=tombak lempar
items.weapon.missiles.throwingspear.desc=Tombak ringan berkerangka tipis ini dipakai dengan cara dilempar, bukan ditusuk.

items.weapon.missiles.throwingspike.name=duri lempar
items.weapon.missiles.throwingspike.desc=Batang logam runcing yang tahan lama ini dimaksudkan untuk dilemparkan ke musuh yang jauh.
items.weapon.missiles.throwingspike.discover_hint=Salah satu pahlawan berawal dengan item ini.

items.weapon.missiles.throwingstone.name=batu lempar
items.weapon.missiles.throwingstone.desc=Batu-batu ini diampelas agar mampu dilempar dengan kekuatan lebih besar daripada batu biasa.
items.weapon.missiles.throwingstone.discover_hint=Salah satu pahlawan berawal dengan item ini.

items.weapon.missiles.tomahawk.name=tomahawk
items.weapon.missiles.tomahawk.stats_desc=Senjata ini memberikan efek _%1$d-%2$d pendarahan_ ke targetnya.
items.weapon.missiles.tomahawk.typical_stats_desc=Senjata ini biasanya memberikan efek _%1$d-%2$d pendarahan_ ke targetnya.
items.weapon.missiles.tomahawk.desc=Kapak lempar ini memiliki mata pisau bergerigi yang akan robek saat menempel pada musuh.

items.weapon.missiles.trident.name=trisula
items.weapon.missiles.trident.desc=Tombak lempar besar dengan tiga mata pisau di ujungnya. Tombak itu kuat, tapi agak berat.


items.weapon.spiritbow.name=busur roh
items.weapon.spiritbow.ac_shoot=TEMBAK
items.weapon.spiritbow.prompt=Pilih sasaran
items.weapon.spiritbow.stats=Busur ini tidak dapat ditingkatkan secara langsung, tetapi akan terus tumbuh lebih kuat saat dirimu naik level. Pada levelmu saat ini, anak panah yang ditembakkan dari busur akan memberikan _%1$d-%2$d damage_ dan membutuhkan _%3$d kekuatan_ untuk digunakan dengan benar.
items.weapon.spiritbow.desc=Busur yang terbuat dari kayu sihir kuno. Tali dan goresan busur bersinar dengan cahaya biru pucat. Saat tali ditarik, busur ini akan memunculkan panah ajaib yang bisa ditembakkan ke musuh.
items.weapon.spiritbow.discover_hint=Salah satu pahlawan berawal dengan item ini.

items.weapon.weapon.identify=Kau sekarang sudah cukup familiar dengan senjatamu.
items.weapon.weapon.too_heavy=Karena kekuatanmu masih kurang, senjata ini akan melambatkan serangan, akurasi, dan kemampuan serangan mendadakmu.
items.weapon.weapon.excess_str=Karena kelebihan kekuatan, kamu akan mendapat _0-%d damage bonus_ dengan senjata ini.
items.weapon.weapon.hardening_gone=Pengerasan pada senjata ini telah hilang!
items.weapon.weapon.incompatible=Interaksi antara sihir yang berbeda tipe menetralkan enchantment di senjata ini!
items.weapon.weapon.cursed_worn=Karena senjata ini terkutuk, kau tidak kuat untuk melepasnya.
items.weapon.weapon.cursed=Kau dapat merasakan sihir jahat mengamuk di dalam senjata ini.
items.weapon.weapon.weak_cursed=Meski terkena kutukan, kau dapat melepas senjata ini.
items.weapon.weapon.not_cursed=Senjata ini bebas dari sihir jahat.
items.weapon.weapon.faster=Peningkatan _kecepatan_ telah ditambahkan.
items.weapon.weapon.stronger=Peningkatan _damage_ telah ditambahkan.
items.weapon.weapon.enchanted=itu mempunyai _%s._
items.weapon.weapon.enchant_hardened=Sudah _dikeraskan._
items.weapon.weapon.hardened_no_enchant=Senjata ini telah _dikeraskan_, namun saat ini tidak ada enchantment.
items.weapon.weapon$enchantment.enchant=enchantment
items.weapon.weapon$enchantment.rankings_desc=Terbunuh oleh sihir
items.weapon.weapon$enchantment.discover_hint=Kamu bisa menemukan item dengan efek ini secara acak di terungku, atau mencoba menerapkannya pada item sendiri.


###misc items
items.amulet.name=jimat yendor
items.amulet.ac_end=AKHIR PERMAINAN
items.amulet.desc=Jimat Yendor adalah artefak paling kuat yang diketahui oleh manusia atau kurcaci. Kristal berkilauan di permukaannya mengandung kekuatan yang tidak tertandingi.
items.amulet.desc_origins=Asal muasal jimat tersebut tidak diketahui. Sejarah mengatakan bahwa Raja Kurcaci membual bahwa dia telah menemukan artefak tersebut tidak lama sebelum peradaban kurcaci memutuskan semua kontak. Bagaimana dia menemukannya? Bagaimana Yog-Dzewa mengambilnya? Pertanyaan lain kali mungkin, yang terpenting sekarang adalah jimat itu milikmu!
items.amulet.desc_ascent=Asal muasal jimat tersebut tidak diketahui, namun yang jelas jimat tersebut sangat dipengaruhi oleh kekuatan Yog-Dzewa. Terungku ini tampaknya mengikuti keinginan Yog saat kau melewatinya, membuat musuh jauh lebih banyak dan kuat! Kau juga tidak dapat lagi mengaktifkan atau membuang jimat tersebut, seolah-olah jimat tersebut dikutuk.
items.amulet.ascent_title=Naik...
items.amulet.ascent_desc=Kau mulai merasakan kekuatan Yog-Dzewa yang besar dan mengerikan terpancar dari jimat tersebut. Naik kembali melalui terungku sebagai manusia mungkin lebih sulit dari yang kau kira!\n\nJika kau terus naik dengan jimat, terungku akan menjadi lebih berbahaya, teleportasi antar lantai akan dinonaktifkan, dan kau hanya akan bisa memenangkan permainan dengan mengalahkan musuh saat kau naik melalui terungku!\n\nKau dapat meninggalkan jimat di sini untuk saat ini jika ingin naik tanpa memulai tantangan ini, atau mengaktifkan jimat sebelum naik untuk mengakhiri permainan secara normal.
items.amulet.ascent_yes=Lanjutkan!
items.amulet.ascent_no=Berhenti Sekarang
items.amulet.discover_hint=Kamu bisa menemukan barang ini di dasar terungku...

items.ankh.name=ankh
items.ankh.ac_bless=BERKATI
items.ankh.bless=Kamu memberkati ankh dengan air ajaib.
items.ankh.desc=Simbol kuno yang melambangkan keabadian ini memberikan kemampuan untuk hidup kembali setelah kematian. Sebagian besar item akan dijatuhkan di tempat kamu mati, tetapi dapat diambil kembali jika kamu kembali ke sana. Menggunakan kantong air penuh, ankh dapat diberkati dengan kekuatan ekstra.
items.ankh.desc_blessed=Simbol kuno dari keabadian ini memberikanmu kemampuan untuk dapat hidup kembali setelah mati. Ankh ini sudah diberkati dan sekarang jauh lebih kuat. Ankh akan mengorbankan dirinya untuk menyelamatkanmu di saat bahaya mematikan.
items.ankh.discover_hint=Item ini bisa dibeli di toko.

items.arcaneresin.name=getah sihir
items.arcaneresin.prompt=Pilih sebuah tongkat sihir
items.arcaneresin.ac_apply=TERAPKAN
items.arcaneresin.level_too_high=Tongkat sihir itu terlalu kuat untuk diperkuat oleh getah.
items.arcaneresin.not_enough=Kau tidak memiliki cukup resin untuk itu!
items.arcaneresin.apply=Kau melapisi tongkat sihirmu dengan getah, meningkatkan kekuatannya!
items.arcaneresin.desc=Bubuk halus ini berkilau warna putih keunguan. Bubuk itu dapat digunakan sebagai penguat energi sihir, salah satunya dapat meningkatkan level tongkat sihir saat diterapkan!\n\nMeningkatkan tongkat sihir akan menghabiskan 1, 2, atau 3 getah tergantung dari level awal dari tongkat sihir. Getah dapat meningkatkan tongkat sihir sampai maksimal +3.\n\nPeningkatan resin _digantikan oleh sumber peningkatan lain_ (seperti gulungan peningkatan), dan tidak berlaku saat menjiwai tongkat sihir ke dalam tongkat Penyihir.
items.arcaneresin.discover_hint=Kamu bisa membuat item ini dengan peracikan.

items.brokenseal.name=segel rusak
items.brokenseal.ac_affix=TEMPELKAN
items.brokenseal.prompt=Pilih armor
items.brokenseal.unknown_armor=Kamu harus mengidentifikasi terlebih dahulu apakah armor itu terkena kutukan atau tidak.
items.brokenseal.cursed_armor=Segel tidak bisa dipasang pada armor terkutuk.
items.brokenseal.affix=Kau menempelkan segel ke armormu!
items.brokenseal.desc=Segel lilin yang ditempelkan pada armor sebagai simbol keberanian. Di bagian tengahnya terukir tanda perlindungan yang sudah pudar, dan retak menjadi dua di bagian tengah.\n\nSebuah kenang-kenangan dari rumahnya, segel tersebut membantu Pendekar untuk bertahan. Saat mengenakan segel, Pendekar akan langsung memperoleh perisai saat darahnya hampir setengah atau lebih rendah.\n\nSegel ini dapat _ditempelkan pada armor,_ dan dapat dipindahkan ke armor lain. Segel ini juga dapat membawa satu peningkatan dengannya, selama peningkatan itu diterapkan pada armor sementara segel terpasang padanya.
items.brokenseal.inscribed=Segel diberi kekuatan _%s._
items.brokenseal.choose_title=Pilih Glyph
items.brokenseal.choose_desc=Armor dan segel rusak membawa sebuah glyph. Pilih glyph mana yang harus disimpan.\n\nGlyph Armor: %1$s\nGlyph Segel Rusak: %2$s\n\nPerhatikan bahwa jika Kau memilih glyph yang saat ini ada di armor, segel tersebut tidak akan dapat mentransfernya nanti.
items.brokenseal.discover_hint=Salah satu pahlawan berawal dengan item ini.
items.brokenseal$warriorshield.name=Perisai Pendekar
items.brokenseal$warriorshield.desc_active=Segel rusak Pendekar saat ini membantunya bertahan, memberinya perisai di atas darahnya. Terdapat cooldown setelah perisai awalnya dipicu sebelum dapat digunakan lagi.\n\nPerisai ini tidak berkurang seiring waktu, tetapi akan berakhir jika tidak ada musuh di dekatnya selama beberapa giliran. Saat berakhir, perisai yang tidak digunakan akan mengurangi cooldown, hingga maksimal 50%%.\n\nPerisai tersisa: %1$d.\n\nCooldown saat ini: %2$d.
items.brokenseal$warriorshield.desc_cooldown=Pendekar baru saja memperoleh perisai dari segel rusaknya, dan harus menunggu hingga ia dapat memperoleh manfaat dari efek perisainya lagi.\n\nGiliran tersisa: %d.
items.brokenseal$warriorshield.desc_negative_cooldown=Cooldown perisai Pendekar saat ini bernilai negatif, artinya saat perisainya aktif, cooldown akan lebih rendah dari biasanya yaitu 150 giliran. Cooldown perisai dapat dikurangi hingga serendah -150 giliran, yang berarti perisai akan langsung tersedia kembali setelah diaktifkan.\n\nCooldown saat ini: %d.

items.dewdrop.name=tetes embun
items.dewdrop.already_full=Darahmu sudah penuh.
items.dewdrop.desc=Tetesan embun yang jernih.\n\nDikarenakan oleh keajaiban tempat ini, air murni memiliki sedikit kekuatan penyembuhan.

items.equipableitem.curse_detected=Kamu merasa item itu terkutuk sebelum kamu memakainya!
items.equipableitem.unequip_cursed=Kau tidak dapat melepaskan item yang terkutuk!
items.equipableitem.ac_equip=PAKAI
items.equipableitem.ac_unequip=LEPASKAN

items.energycrystal.name=kristal energi
items.energycrystal.desc=Kumpulan kristal ajaib kecil, diisi dengan energi peracik.\n\nKristal ini adalah bahan yang paling umum dalam resep peracik dan dapat diproduksi di panci peracik dengan membuang barang-barang konsumsi.

items.gold.name=emas
items.gold.desc=Koin emas. Kumpulkan koin untuk dipakai di toko nanti.

items.heap.for_sale=%1$dg: %2$s
items.heap.chest=Peti
items.heap.chest_desc=Kau tidak akan tahu isinya sampai kau membukanya sendiri!
items.heap.locked_chest=Peti terkunci
items.heap.locked_chest_desc=Kau tidak akan tahu apa yang ada di dalam sampai kau membukanya! Tapi untuk membukanya kau membutuhkan kunci emas.
items.heap.crystal_chest=peti kristal
items.heap.crystal_chest_desc=Kau dapat melihat _%s_ di dalam, tapi untuk membuka petinya kau membutuhkan kunci kristal.
items.heap.artifact=sebuah artefak
items.heap.wand=sebuah tongkat sihir
items.heap.ring=sebuah cincin
items.heap.tomb=Kuburan
items.heap.tomb_desc=Kuburan kuno ini mungkin memiliki sesuatu yang berguna, tapi si penghuni kuburan ini pasti akan mengetahuinya.
items.heap.skeleton=Kerangka mayat
items.heap.skeleton_desc=Semua ini yang tersisa dari petualang yang tidak beruntung. Mungkin tidak ada salahnya mencari sesuatu yang berharga di dalamnya.
items.heap.remains=Mayat pahlawan
items.heap.remains_desc=Semua itu adalah peninggalan dari salah satu pendahulumu. Tidak ada salahnya mengecek mungkin ada sesuatu yang berguna.

items.honeypot.name=pot madu
items.honeypot.ac_shatter=PECAHKAN
items.honeypot.desc=Pot madu yang besar ini bukan hanya benar-benar dilapisi dengan madu, tapi ini juga merupakan rumah bagi lebah besar! Lebah semacam itu biasanya tinggal di sarangnya, mungkin pot itu adalah semacam kandang penjebak spesial? Lebah itu terlihat elok di dalam pot dengan madunya, dan dia mendengung dengan waspada saat kau melihat ke dalam.
items.honeypot$shatteredpot.name=pot madu pecah
items.honeypot$shatteredpot.desc=Potnya sudah pecah, madu yang lengket yang menempel pada dinding potlah yang dapat menahan bentuknya, yang lama-kelamaan akan hancur juga.\n\nDi samping sudah rusak, lebahnya kelihatannya masih ingin melindungi pot itu.

items.item.prompt=Pilih arah lemparan
items.item.ac_drop=JATUHKAN
items.item.ac_throw=LEMPAR
items.item.rankings_desc=Terbunuh oleh: %s
items.item.curse=kutukan
items.item.custom_note_type=Tipe dari item ini memiliki catatan khusus: "_%s_"
items.item.custom_note=Item ini memiliki catatan khusus: "_%s_"
items.item.discover_hint=Kamu bisa menemukan barang ini secara acak di terungku.

items.kindofmisc.unequip_title=Lepaskan satu item
items.kindofmisc.unequip_message=Kau harus melepas salah satu item ini terlebih dahulu. Pilih item untuk ditukar.

items.kindofweapon.swift_equip=Kau dengan cepat melengkapi senjatamu.
items.kindofweapon.equip_cursed=Tanpa sadar tanganmu memegang senjatamu dengan sangat erat.
items.kindofweapon.which_equip_msg=Di slot senjata manakah kamu ingin melengkapi item ini?\n\nJagoan langsung menyerang dengan senjata utamanya, namun dapat menggunakan kemampuan senjata mana pun. Kedua senjata tersebut memiliki jumlah daya yang sama.\n\nJagoan juga dapat menukarkan senjata utama dan cadangan secara instan.
items.kindofweapon.which_equip_primary=Utama(%s)
items.kindofweapon.which_equip_secondary=Cadangan(%s)
items.kindofweapon.empty=kosong

items.kingscrown.name=Mahkota Raja Kurcaci
items.kingscrown.ac_wear=PAKAI
items.kingscrown.naked=Sayangnya, mahkota itu tidak dapat mengubah pakaian dalammu.
items.kingscrown.upgraded=Mahkotanya bersinar terang dan kemudian hancur saat armormu bertransformasi!
items.kingscrown.ratgraded=Cakar Raja Tikus bersinar terang seraya armormu bertransformasi!
items.kingscrown.desc=Mahkota raja kurcaci yang terakhir, bersinar dengan energi magis yang luar biasa.\n\nSaat dipakai, sihir mahkota akan mengalir ke armor yang kau pakai saat ini, mengubahnya menjadi _armor epik yang unik dengan kemampuan khusus._ Armor baru akan menyimpan semua properti dari armor asli.
items.kingscrown.discover_hint=Item ini dijatuhkan oleh musuh tertentu.

items.liquidmetal.name=logam cair
items.liquidmetal.ac_apply=TERAPKAN
items.liquidmetal.prompt=Pilih senjata lempar
items.liquidmetal.already_fixed=Senjata lempar itu sudah dalam kondisi sempurna!
items.liquidmetal.apply=Kau menggunakan %d logam cair untuk memperbaiki senjata lemparmu.
items.liquidmetal.desc=Cairan ajaib ini dapat mengisi retakan dan sobekan pada senjata lempar, mengembalikannya ke kondisi sempurna! Jika satu set senjata hilang tetapi sudah diperbaiki sepenuhnya, logam cair bahkan dapat digunakan untuk mengganti senjata yang hilang dari set tersebut!\n\nSenjata tingkat 1 membutuhkan 10 logam cair untuk diperbaiki sepenuhnya, senjata tingkat 5 membutuhkan 30. Setiap peningkatan juga meningkatkan jumlah logam yang dibutuhkan sebesar 35%.\n\nLogam cair tidak dapat digunakan untuk memperbaiki ujung anak panah yang berujung.
items.liquidmetal.discover_hint=Item ini bisa didapatkan melalui peracikan.

items.lostbackpack.name=tas yang hilang
items.lostbackpack.desc=Ini adalah perlengkapanmu yang hilang. Ambil untuk dapat memperoleh kembali perlengkapanmu yang hilang!

items.merchantsbeacon.name=suar pedagang
items.merchantsbeacon.ac_use=GUNAKAN
items.merchantsbeacon.desc=Teknologi kuno para kurcaci ini membuatmu dapat berkomunikasi dari jarak yang jauh.\n\nSetelah diaktifkan, suar ini akan membolehkanmu menjual item ke Toko Pixel dari mana saja di terungku.\n\nNamun, sihir dalam suar ini hanya dapat digunakan sekali saja. Jadi gunakan dengan bijak.

items.stylus.name=stylus sihir
items.stylus.ac_inscribe=TANDAI
items.stylus.prompt=Pilih sebuah armor
items.stylus.identify=Kamu harus mengidentifikasi terlebih dahulu apakah armor itu terkena kutukan.
items.stylus.cursed=Sihir stylus tidak akan bekerja pada armor terkutuk.
items.stylus.inscribed=Kau memberikan tanda pada armormu dengan stylus.
items.stylus.desc=Stylus sihir ini terbuat dari batu yang sangat keras dan gelap. Dengan memakainya kau dapat menandai glyph ajaib ke armormu, tapi kau tidak punya kemampuan untuk memilih glyph apa, stylus yang akan memutuskannya.

items.tengusmask.name=Topeng Tengu
items.tengusmask.ac_wear=PAKAI
items.tengusmask.used=Topengnya hancur saat kekuatannya mengalir ke dirimu!
items.tengusmask.desc=Topeng ini jatuh dari wajah Tengu saat dia mati, kau bisa merasakan kekuatan magis yang luar biasa memancar darinya. Apakah topeng itu merupakan sumber kekuatan Tengu?\n\nSaat dipakai, kekuatan topeng yang luar biasa akan ditransfer ke dirimu, memungkinkanmu untuk _memilih subkelas untuk pahlawanmu._\n\nSubkelas mana yang akan kau pilih?
items.tengusmask.discover_hint=Item ini dijatuhkan oleh musuh tertentu.

items.torch.name=obor
items.torch.ac_light=NYALAKAN
items.torch.desc=Pokok petualangan, ketika terungku menjadi gelap, obor dapat membantu memimpin jalannya.

items.waterskin.name=kantong air
items.waterskin.ac_drink=MINUM
items.waterskin.collected=Kau mengumpulkan tetesan embun ke dalam kantong airmu.
items.waterskin.full=Kantong airmu penuh!
items.waterskin.empty=Kantong airmu kosong!
items.waterskin.desc=Sebuah wadah untuk cairan, terbuat dari kulit dan tali, ditutup dengan penutup gabus.
items.waterskin.desc_water=Saat ini kantong air hanya berisi air minum biasa. Tentunya ada sesuatu di terungku yang bisa disimpan oleh kantong air sebagai gantinya.
items.waterskin.desc_heal=Kantung air saat ini digunakan untuk menyimpan air penyembuhan. Semakin penuh kantung airnya, kau akan segera sembuh saat meminumnya. Kau hanya akan minum sebanyak yang kau butuhkan.
items.waterskin.desc_full=Kantong air yang penuh nampaknya memancarkan energi, mungkin itu dapat digunakan untuk memberkati item untuk bertahan hidup yang lainnya?
items.waterskin.discover_hint=Salah satu pahlawan berawal dengan item ini.

