items.weapon.melee.handaxe.typical_ability_desc=Duelis dapat melakukan sebuah _pukulan keras_ dengan kapak tangan. Serangan terkonsentrasi ini biasanya menimbulkan _%1$d-%2$d damage_ dan efek pusing selama 5 giliran yang mana mengurangi akurasi dan penghindaran sebanyak 50%%. Pukulan keras selalu kena tapi menimbulkan damage biasa jika tidak mengejutkan musuh.
