items.potions.potion.charcoal=ramuan hitam
items.potions.potion.ivory=ramuan putih
items.potions.potion.amber=ramuan jingga
items.potions.potion.bistre=ramuan coklat
items.potions.potion.indigo=ramuan ungu
items.potions.potion.silver=ramuan perak
items.potions.potion.unknown_desc=Ramuan ini mengandung cairan berwarna. Siapa yang tahu apa yang akan terjadi saat diminum atau dilempar?
items.potions.potion.harmful=Ramuan berbahaya!
items.potions.potion.beneficial=Ramuan berguna
items.potions.potion.yes=Ya, aku tahu apa yang kulakukan
items.potions.potion.no=Tidak, aku berubah pikiran
items.potions.potion.sure_drink=Kau yakin ingin meminumnya? Kau mungkin seharusnya melempar ramuan seperti ini kepada musuh.
items.potions.potion.sure_throw=Kau yakin ingin melemparnya? Lebih masuk akal jika ramuan itu diminum.
items.potions.potion.shatter=Ramuan pecah dan cairannya memercik tanpa arti.
items.potions.potion.discover_hint=Kamu bisa menemukan item ini secara acak di terungku, atau membuatnya dengan panci peracik.
items.potions.potion$placeholder.name=ramuan
items.potions.potion$seedtopotion.name=Ramuan Acak

items.potions.potionofexperience.name=ramuan pengalaman
items.potions.potionofexperience.desc=Pengalaman yang tersimpan dalam bentuk cair, meminum ini akan langsung menaikkan pengalaman levelmu.

items.potions.potionoffrost.name=ramuan es
items.potions.potionoffrost.desc=Bahan kimia yang terkandung dalam ramuan ini akan menguap menjadi awan beku ketika terkena paparan udara bebas.

items.potions.potionofhaste.name=ramuan kecepatan
items.potions.potionofhaste.energetic=Kau merasa energik!
items.potions.potionofhaste.desc=Dengan meminum cairan manis yang aneh ini kau akan merasakan energi yang sangat besar dalam waktu singkat, membuatmu dapat berlari dengan kecepatan yang luar biasa.

items.potions.potionofhealing.name=ramuan penyembuhan
items.potions.potionofhealing.heal=Lukamu mulai tertutup.
items.potions.potionofhealing.desc=Eliksir ini akan memulihkan darahmu secara bertahap dan akan langsung menghilangkan berbagai penyakit.

items.potions.potionofinvisibility.name=ramuan tembus pandang
items.potions.potionofinvisibility.invisible=Kau melihat tanganmu jadi tembus pandang!
items.potions.potionofinvisibility.desc=Dengan meminum ramuan ini untuk sementara kau akan tembus pandang. Saat tembus pandang, musuh tidak dapat melihatmu. Serangan fisik atau efek magis (seperti gulungan dan tongkat sihir) akan segera membatalkan tembus pandang.

items.potions.potionoflevitation.name=ramuan melayang
items.potions.potionoflevitation.float=Kau melayang di udara!
items.potions.potionoflevitation.desc=Dengan meminum ramuan ini kau dapat melayang di udara, dapat melewati jebakan dan jurang dengan santai. Dengan melemparkan ramuan ini, maka akan menciptakan awan mentah, memusingkan siapa saja di dalamnya.

items.potions.potionofliquidflame.name=ramuan api cair
items.potions.potionofliquidflame.desc=Ramuan ini mengandung bahan tidak stabil yang akan terbakar saat bersentuhan dengan udara luar.

items.potions.potionofmindvision.name=ramuan melihat pikiran
items.potions.potionofmindvision.see_mobs=Entah bagaimana kau dapat merasakan pikiran makhluk lain.
items.potions.potionofmindvision.see_none=Kau dapat merasakan bahwa kau sendirian di level ini sekarang.
items.potions.potionofmindvision.desc=Setelah meminum ini, pikiranmu akan menyelaraskan ciri fisik makhluk di kejauhan, membuatmu dapat merasakan tanda-tanda makhluk hidup di balik dinding. Juga, ramuan ini akan membiarkanmu melihat menembus tembok dan pintu terdekat.

items.potions.potionofparalyticgas.name=ramuan gas pelumpuh
items.potions.potionofparalyticgas.desc=Ketika bereaksi dengan udara luar, cairan di ramuan ini akan menguap menjadi awan-awan kuning. Siapa pun yang menghirup awan itu akan langsung lumpuh, tidak dapat bergerak untuk sesaat sampai awannya menghilang. Item ini dapat dilempar dari jauh pada musuh untuk menjebak mereka.

items.potions.potionofpurity.name=ramuan kemurnian
items.potions.potionofpurity.freshness=Kau merasakan kesegaran tidak biasa di udara.
items.potions.potionofpurity.protected=Selaput pelindung menyelubungimu!
items.potions.potionofpurity.desc=Reagen sihir ini akan menetralkan semua efek berbahaya di area yang besar dengan cepat. Jika meminumnya, maka kau akan kebal terhadap berbagai efek.

items.potions.potionofstrength.name=ramuan kekuatan
items.potions.potionofstrength.msg=Kekuatan baru mengalir dalam tubuhmu, sekarang kau punya %d kekuatan!
items.potions.potionofstrength.desc=Cairan yang kuat ini mengalir di ototmu, secara permanen menambah kekuatanmu satu poin.

items.potions.potionoftoxicgas.name=ramuan gas beracun
items.potions.potionoftoxicgas.desc=Jika kau membuka atau memecahkan ramuan ini, maka ramuan ini akan meledak menjadi awan racun kehijauan yang mematikan. Mungkin kau seharusnya melempar ramuan ini ke musuh yang jauh daripada membukanya langsung di tempat.



###brews
items.potions.brews.brew.discover_hint=Item ini bisa didapatkan melalui peracikan.

items.potions.brews.aquabrew.name=racikan air
items.potions.brews.aquabrew.desc=Ketika dipecahkan, seduhan ini akan melepaskan semburan air bertekanan di tempat pecahnya. Kekuatannya hanya cukup untuk memberi damage pada musuh berapi, namun juga menyebarkan air di sekitarnya, merusak jebakan, memadamkan api, dan mementalkan karakter di dekat semburan.

items.potions.brews.blizzardbrew.name=seduhan badai salju
items.potions.brews.blizzardbrew.desc=Saat pecah, seduhan ini akan mengeluarkan badai salju yang menyebar cepat seperti gas.

items.potions.brews.causticbrew.name=seduhan kaustik
items.potions.brews.causticbrew.desc=Seduhan ini akan menyebarkan cairan korosif di sekitar lokasi cairan itu pecah. Apapun yang tertangkap oleh cairan akan perlahan meleleh jika tidak dicuci dengan air.

items.potions.brews.infernalbrew.name=seduhan neraka
items.potions.brews.infernalbrew.desc=Saat pecah, seduhan ini akan mengeluarkan amukan api yang menyebar cepat seperti gas.

items.potions.brews.shockingbrew.name=seduhan pengejut
items.potions.brews.shockingbrew.desc=Saat pecah, seduhan ini akan melepaskan badai listrik di area yang luas di sekitar lokasi seduhan itu pecah.

items.potions.brews.unstablebrew.name=racikan tidak stabil
items.potions.brews.unstablebrew.desc=Ramuan buatan ini bersinar dengan warna pelangi\n\nKetika diminum akan memicu effect acak dari berbagai ramuan yang ada. Efek ramuan akan selalu menguntungkan jika diminum, dan akan selalu merugikan jika dilempar.

###elixirs
items.potions.elixirs.elixir.discover_hint=Item ini bisa didapatkan melalui peracikan.

items.potions.elixirs.elixirofarcanearmor.name=eliksir armor sihir
items.potions.elixirs.elixirofarcanearmor.desc=Eliksir ini akan memberikan peminum ketahanan terus-menerus dari serangan sihir.

items.potions.elixirs.elixirofaquaticrejuvenation.name=eliksir peremajaan akuatik
items.potions.elixirs.elixirofaquaticrejuvenation.desc=Eliksir ini mengandung sisa-sisa dari Goo yang dicampur dengan ramuan penyembuhan. Efek penyembuhannya tidak langsung, namun efeknya akan meningkat drastis saat kau berdiri di atas air.
items.potions.elixirs.elixirofaquaticrejuvenation$aquahealing.name=penyembuhan akuatik
items.potions.elixirs.elixirofaquaticrejuvenation$aquahealing.desc=Untuk sementara kau memperoleh sifat restoratif yang mirip dengan Goo.\n\nSaat berdiri di atas air, kau akan memulihkan sejumlah kecil darah per giliran. Efeknya dihentikan sementara saat kau dalam keadaan darah penuh atau tidak berada di atas air.\n\nPenyembuhan tersisa: %d.

items.potions.elixirs.elixirofdragonsblood.name=eliksir darah naga
items.potions.elixirs.elixirofdragonsblood.desc=Saat diminum, eliksir ini akan mengalirkan kekuatan api melalui pembuluh darah peminum. Efek ini akan membuat peminum kebal terhadap api, dan memungkinkan mereka untuk membakar musuh dengan serangan fisik.

items.potions.elixirs.elixiroffeatherfall.name=ramuan jatuh ringan
items.potions.elixirs.elixiroffeatherfall.light=Kau merasa ringan seperti bulu!
items.potions.elixirs.elixiroffeatherfall.desc=Eliksir ini memberikan efek melayang yang lebih lemah tapi lebih terkendali, yang memungkinkan peminumnya jatuh dalam jarak yang jauh tanpa cedera untuk beberapa saat.
items.potions.elixirs.elixiroffeatherfall$featherbuff.name=jatuh ringan
items.potions.elixirs.elixiroffeatherfall$featherbuff.desc=Kamu berada di bawah efek dari eliksir jatuh ringan, memungkinkan kamu untuk terjatuh di jurang tanpa terkena damage! \n\nGiliran tersisa:%s

items.potions.elixirs.elixirofhoneyedhealing.name=eliksir penyembuhan madu
items.potions.elixirs.elixirofhoneyedhealing.desc=Eliksir ini menggabungkan penyembuhan dengan manisnya madu. Ketika diminum, eliksir ini akan mendapat efek yang sama dengan ramuan penyembuhan dan menghilangkan sedikit rasa lapar, tapi juga bisa dilemparkan untuk menyembuhkan sekutu.\n\nMakhluk yang berhubungan dengan madu mungkin akan senang jika item ini digunakan pada mereka.

items.potions.elixirs.elixiroficytouch.name=eliksir sentuhan es
items.potions.elixirs.elixiroficytouch.desc=Saat dikonsumsi, eliksir ini akan memungkinkan peminum untuk meredam panas dari musuh yang mereka serang. Efek ini akan membuat peminum kebal terhadap hawa dingin, dan memungkinkan mereka untuk mendinginkan musuh dengan serangan fisik.

items.potions.elixirs.elixirofmight.name=eliksir tenaga
items.potions.elixirs.elixirofmight.msg=Kekuatan baru mengalir dalam tubuhmu, sekarang kau punya %d kekuatan!
items.potions.elixirs.elixirofmight.desc=Cairan yang kuat ini akan mengalir melalui otot-ototmu, meningkatkan kekuatanmu secara permanen sebanyak satu poin dan darahmu sebanyak %d poin. Peningkatan darah berskala dengan darah maksimummu, tetapi perlahan-lahan akan hilang saat kau naik level.
items.potions.elixirs.elixirofmight$htboost.name=peningkatan darah maksimal
items.potions.elixirs.elixirofmight$htboost.desc=Tubuhmu terasa kuat dan sehat secara tidak wajar.\n\nDarah maksimummu ditingkatkan untuk jangka waktu yang lama. Saat kau naik level, peningkatan itu akan terus memudar.\n\nJumlah peningkatan saat ini: %d.\nLevel tersisa: %d.

items.potions.elixirs.elixiroftoxicessence.name=eliksir esensi beracun
items.potions.elixirs.elixiroftoxicessence.desc=saat diminum, Ramuan ini akan menjiwai peminum dengan energi beracun. Peminum akan menyebarkan gas beracun secara terus menerus selama mereka bergerak, dan akan kebal terhadap gas beracun maupun racun sedikit lebih lama dari durasi efek Ramuan.



###exotic potions
items.potions.exotic.exoticpotion.turquoise=ramuan pirus eksotik
items.potions.exotic.exoticpotion.crimson=ramuan merah eksotik
items.potions.exotic.exoticpotion.azure=ramuan biru eksotik
items.potions.exotic.exoticpotion.jade=ramuan hijau eksotik
items.potions.exotic.exoticpotion.golden=ramuan emas eksotik
items.potions.exotic.exoticpotion.magenta=ramuan magenta eksotik
items.potions.exotic.exoticpotion.charcoal=ramuan hitam eksotik
items.potions.exotic.exoticpotion.ivory=ramuan putih eksotik
items.potions.exotic.exoticpotion.amber=ramuan kuning eksotik
items.potions.exotic.exoticpotion.bistre=ramuan coklat eksotik
items.potions.exotic.exoticpotion.indigo=ramuan ungu eksotik
items.potions.exotic.exoticpotion.silver=ramuan perak eksotik
items.potions.exotic.exoticpotion.unknown_desc=Botol bundar ini berisi cairan kasar yang berwarna-warni. Sepertinya ini benda asing, siapa yang tahu apa yang mungkin terjadi ketika diminum atau dilempar?
items.potions.exotic.exoticpotion.warning=Apakah Kau benar-benar ingin membatalkan penggunaan ramuan ini? Bagaimanapun juga akan tetap terpakai.
items.potions.exotic.exoticpotion.yes=Ya, aku yakin
items.potions.exotic.exoticpotion.no=Tidak, aku berubah pikiran
items.potions.exotic.exoticpotion.discover_hint=Item ini bisa didapatkan melalui peracikan.

items.potions.exotic.potionofcleansing.name=ramuan pembersihan
items.potions.exotic.potionofcleansing.desc=Reagen yang kuat ini akan membuat peminumnya kebal terhadap semua status efek berbahaya selama beberapa giliran saat diminum. Ramuan ini juga bisa dilemparkan ke target untuk membuatnya steril dari efek berbahaya tersebut.
items.potions.exotic.potionofcleansing$cleanse.name=dibersihkan
items.potions.exotic.potionofcleansing$cleanse.desc=Karakter ini untuk sementara kebal terhadap semua status efek berbahaya!\n\nGiliran tersisa: %s

items.potions.exotic.potionofcorrosivegas.name=ramuan gas korosif
items.potions.exotic.potionofcorrosivegas.desc=Melepas atau menghancurkan botol ini akan menyebabkan isinya meledak menjadi awan gas korosif yang mematikan. Gas ini menyebar lebih cepat daripada gas beracun dan lebih mematikan, tetapi juga tidak akan bertahan lama.

items.potions.exotic.potionofdragonsbreath.name=ramuan nafas naga
items.potions.exotic.potionofdragonsbreath.prompt=Pilih lokasi untuk dibakar
items.potions.exotic.potionofdragonsbreath.desc=Botol ini mengandung senyawa tidak biasa yang akan menyemburkan api ketika bercampur dengan air liur. Meludahkan cairan dengan cepat akan memungkinkan pengguna memuntahkan api dari mulut mereka!

items.potions.exotic.potionofearthenarmor.name=ramuan armor tanah
items.potions.exotic.potionofearthenarmor.desc=Alih-alih melumpuhkan, ternyata cairan ini memiliki efek pengerasan pada kulit yang akan mengubahnya menjadi armor alami sementara.

items.potions.exotic.potionofdivineinspiration.name=ramuan inspirasi hebat
items.potions.exotic.potionofdivineinspiration.no_more_points=Kau tidak bisa mendapatkan bonus poin bakat lagi.
items.potions.exotic.potionofdivineinspiration.select_tier=Pilih tingkat bakat untuk mendapatkan dua poin bonus. Kau harus membuka kunci tingkat untuk dapat menggunakan poin.
items.potions.exotic.potionofdivineinspiration.bonus=+2 Poin Bakat!
items.potions.exotic.potionofdivineinspiration.desc=Kekuatan energi suci direduksi menjadi bentuk cair, minuman ini akan menjiwai peminum dengan kekuatan suci, memberi mereka dua poin bakat bonus di tingkat yang mereka pilih.\n\nRamuan ini hanya dapat digunakan sekali untuk setiap tingkatan bakat.

items.potions.exotic.potionofmagicalsight.name=ramuan penglihan sihir
items.potions.exotic.potionofmagicalsight.desc=Setelah meminum ini, indramu akan meningkat ke tingkat yang luar biasa, untuk sementara memungkinkanmu untuk melihat menembus dinding dalam radius 12 petak!

items.potions.exotic.potionofmastery.name=ramuan penguasaan
items.potions.exotic.potionofmastery.prompt=Kuasai sebuah Item
items.potions.exotic.potionofmastery.weapon_easier=Senjata Anda menjadi lebih mudah digunakan!
items.potions.exotic.potionofmastery.armor_easier=Armormu menjadi lebih mudah dipakai!
items.potions.exotic.potionofmastery.desc=Alih-alih memberikan kekuatan mentah, ramuan ini malah akan menyelaraskan otot-otot pengguna dengan item tertentu. Ini akan membuat item itu lebih mudah digunakan, seolah-olah peminum telah berlatih dengannya dan membangun memori otot.\n\nSenjata atau armor yang dipilih akan membutuhkan 2 lebih sedikit kekuatan untuk digunakan. Ramuan ini hanya dapat digunakan sekali pada setiap item.

items.potions.exotic.potionofshielding.name=ramuan perisai
items.potions.exotic.potionofshielding.desc=Alih-alih menyembuhkan, ramuan ini malah akan memproyeksikan perisai di sekitar tubuh pengguna, menahan sejumlah besar damage.

items.potions.exotic.potionofshroudingfog.name=ramuan selubung kabut
items.potions.exotic.potionofshroudingfog.desc=Saat terkena udara, cairan dalam botol ini akan menghasilkan kabut tebal yang dengan cepat menyebar dan menghalangi penglihatan musuhmu.

items.potions.exotic.potionofsnapfreeze.name=ramuan pembekuan
items.potions.exotic.potionofsnapfreeze.desc=Bahan kimia yang terkandung dalam ramuan ini akan cepat bereaksi dengan udara, semua yang terkena efek akan langsung membeku dan tidak dapat bergerak.

items.potions.exotic.potionofstamina.name=ramuan stamina
items.potions.exotic.potionofstamina.desc=Meminum cairan manis yang aneh ini akan memberimu dorongan energi yang tahan lama, memungkinkanmu berlari dengan kecepatan lebih cepat untuk periode waktu yang lama.

items.potions.exotic.potionofstormclouds.name=ramuan awan badai
items.potions.exotic.potionofstormclouds.desc=Melempar ramuan ini akan menciptakan uap air yang menyebar dengan cepat , yang akan mengembun lalu menghujani lingkungan sekitar. Sebagian besar area akan terendam air, musuh api akan terkena damage, api akan padam, dan jebakan akan rusak.



###quest items
items.quest.ceremonialcandle.name=lilin ritual
items.quest.ceremonialcandle.desc=Satu set lilin, sudah mencair dan sudah terpakai beberapa kali.\n\nJika hanya satu memang tidak berguna, tapi jika digunakan dalam pola tertentu, lilin-lilin ini dapat mengeluarkan energi untuk ritual.
items.quest.ceremonialcandle.discover_hint=Kamu bisa menemukan item ini dalam misi tertentu.

items.quest.corpsedust.name=abu mayat
items.quest.corpsedust.chill=Rasa dingin merambat ke punggungmu.
items.quest.corpsedust.desc=Bola abu mayat tidak terlalu berbeda dengan bola debu biasa. Tapi kau dapat merasakan energi jahat mengamuk di dalamnya.\n\nMelenyapkannya secepatnya adalah ide yang bagus.
items.quest.corpsedust.discover_hint=Kamu bisa menemukan item ini dalam misi tertentu.

items.quest.darkgold.name=bijih emas gelap
items.quest.darkgold.you_now_have=Kamu sekarang punya %d bijih emas gelap
items.quest.darkgold.desc=Logam ini dikatakan gelap bukan karena warnanya (tidak ada bedanya dengan emas biasa), tapi karena ini akan meleleh di bawah sinar matahari, membuatnya tidak berguna di permukaan.
items.quest.darkgold.discover_hint=Kamu bisa menemukan item ini dalam misi tertentu.

items.quest.dwarftoken.name=token kurcaci
items.quest.dwarftoken.desc=Banyak kurcaci dan beberapa ciptaan mereka yang lebih besar membawa potongan kecil logam yang tidak diketahui tujuannya. Mungkin itu perhiasan atau mungkin semacam tanda pengenal. Kurcaci adalah orang yang aneh.
items.quest.dwarftoken.discover_hint=Kamu bisa menemukan item ini dalam misi tertentu.

items.quest.embers.name=bara elemental
items.quest.embers.desc=Bara spesial yang hanya bisa didapatkan dari elemental api muda. Bara itu memancarkan energi panas.
items.quest.embers.discover_hint=Kamu bisa menemukan item ini dalam misi tertentu.

items.quest.escapecrystal.name=kristal pelarian
items.quest.escapecrystal.ac_use=GUNAKAN
items.quest.escapecrystal.desc=Sebuah kristal mantra magis tipis yang tampaknya mengandung sihir teleportasi. Anda dapat menggunakan kristal ini kapan saja untuk meninggalkan brankas kurcaci, tetapi Anda tidak akan dapat membawa apa pun keluar bersamamu!
items.quest.escapecrystal.discover_hint=Kamu bisa menemukan item ini dalam misi tertentu.

items.quest.gooblob.name=gumpalan goo
items.quest.gooblob.desc=Gumpalan lendir yang menggeliat, merupakan bagian dari Goo yang terpisah saat ia mati. Bentuknya hampir mirip dengan gumpalan agar-agar yang besar, tapi kau tidak berani memakannya.\n\nGumpalan itu tidak akan berguna jika dibiarkan begitu saja, tapi mungkin akan menjadi berguna jika digabungkan dengan ramuan tertentu, atau sebuah bom. Atau setidaknya, gumpalan itu dapat diubah menjadi energi dengan jumlah yang besar.
items.quest.gooblob.discover_hint=Item ini dijatuhkan oleh musuh tertentu.

items.quest.metalshard.name=pecahan logam terkutuk
items.quest.metalshard.desc=Pecahan logam terkutuk berkarat, yang mematahkan DM-300 saat dihancurkan. Kau dapat merasakan sihir jahat yang tidak aktif di dalamnya.\n\nSerpihan itu tidak akan melakukan apapun jika tidak digabungkan dengan gulungan tertentu, atau sebuah bom. Setidaknya itu harus diubah menjadi energi dalam jumlah yang layak.
items.quest.metalshard.discover_hint=Item ini dijatuhkan oleh musuh tertentu.

items.quest.pickaxe.name=beliung
items.quest.pickaxe.ability_name=menembus
items.quest.pickaxe.ability_desc=Duelis dapat _menembus_ musuh dengan beliung. Ini dijamin kena, memberikan efek rentan selama 3 giliran, dan memberikan _%1$d-%2$d damage_ kepada musuh dengan kulit tebal.
items.quest.pickaxe.upgrade_ability_stat_name=Damage Keahlian
items.quest.pickaxe.desc=Ini adalah alat yang kokoh dan berat untuk memecahkan batu. Anda tidak perlu menggunakan beliung untuk menambangnya, tapi mungkin bisa digunakan sebagai senjata dalam keadaan darurat.
items.quest.pickaxe.discover_hint=Kamu bisa menemukan item ini dalam misi tertentu.

items.quest.ratskull.name=tengkorak tikus raksasa
items.quest.ratskull.desc=Tengkorak tikus yang besar. Akan sangat bagus untuk trofi berburu, jika kau punya cukup ruang di dinding untuk menggantungnya



###remains
items.remains.remainsitem.ac_use=GUNAKAN
items.remains.remainsitem.discover_hint=Item ini bisa didapatkan dari mayat pahlawan tertentu dari kekalahan sebelumnya.

items.remains.bowfragment.name=serpihan busur
items.remains.bowfragment.desc=Potongan serpihan kayu ini dulu adalah bagian dari busur roh pemburu yang hilang. Anda masih dapat merasakan sedikit energi tersisa pada serpihan ini, dapat anda gunakan untuk menumbuhkan rumput tinggi disekitar anda. Namun jika melakukan ini akan menghancurkan serpihan selamanya

items.remains.brokenhilt.name=gagang rusak
items.remains.brokenhilt.desc=Gagang patah ini sepertinya berasal dari senjata Duelis yang kalah.  Kamu masih bisa merasakan sedikit kekuatan beladiri yang tersisa di gagangnya, kamu bisa menggunakannya untuk mendapatkan sedikit bonus damage pada dua serangan jarak dekatmu berikutnya. Namun melakukan hal ini akan menghancurkan gagangnya.

items.remains.brokenstaff.name=tongkat patah
items.remains.brokenstaff.desc=Tongkat Penyihir ini telah patah menjadi dua setelah pemiliknya menemui ajalnya. Kamu masih dapat merasakan sisa energi magis pada tongkat ini, kamu dapat menggunakannya untuk memberikan sedikit peningkatan daya pada tongkatmu. Namun melakukan hal ini akan menghancurkan tongkat.

items.remains.cloakscrap.name=potongan kain
items.remains.cloakscrap.desc=Potongan kain tembus pandang ini sepertinya berasal dari jubah bayangan Pengembara. Kamu masih bisa merasakan sedikit energi mistis yang tersisa di dalamnya, kamu dapat menggunakannya untuk memberikan sedikit peningkatan pada pada artefak kamu. Namun melakukan hal ini akan merusak kain.

items.remains.sealshard.name=pecahan segel
items.remains.sealshard.desc=Pecahan kecil lilin merah ini sepertinya berasal dari segel Pendekar yang gugur. Anda masih bisa merasakan sedikit kemauan yang menempel pada segelnya, Anda bisa menggunakannya untuk memberi sedikit perlindungan pada dirimu sendiri. Namun melakukan hal ini akan menghancurkan pecahan segel.

items.remains.tornpage.name=halaman yang robek
items.remains.tornpage.desc=Halaman ini tampak seperti dirobek dari kitab suci milik seorang Ulama yang telah pensiun. Masih ada sedikit energi suci yang menempel padanya, Kamu dapat menggunakannya untuk memulihkan sedikit kesehatan. Namun, melakukan hal ini akan menghancurkan halaman yang dirobek.



