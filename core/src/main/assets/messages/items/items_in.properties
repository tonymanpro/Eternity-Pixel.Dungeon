items.scrolls.scroll.creuch=scroll of CREUCH
items.scrolls.scroll.unknown_desc=An indecipherable magical rune is written on this parchment. Who knows what it will do when read aloud?
items.scrolls.scroll.blinded=You can't read a scroll while blinded.
items.scrolls.scroll.no_magic=You can't read a scroll while magic immune.
items.scrolls.scroll.cursed=Your cursed spellbook prevents you from invoking this scroll's magic! A scroll of remove curse might be strong enough to still work though...
items.scrolls.scroll.exam_cursed=Your cursed parchment prevents you from invoking this scroll's magic! A scroll of remove curse might be strong enough to still work though...
items.scrolls.scroll$placeholder.name=scroll
items.scrolls.inventoryscroll.warning=Do you really want to cancel this scroll usage? The scroll wasn't previously identified, so it will be consumed anyway.
items.scrolls.inventoryscroll.yes=Yes, I'm positive
items.scrolls.inventoryscroll.no=No, I changed my mind
items.scrolls.scrollofidentify.name=scroll of identify
items.scrolls.scrollofidentify.inv_title=Identify an item
items.scrolls.scrollofidentify.it_is=Your scroll identifies the %s.
items.scrolls.scrollofidentify.desc=This scroll permanently reveals all of the secrets of a single item.
items.scrolls.scrolloflullaby.name=scroll of lullaby
items.scrolls.scrolloflullaby.sooth=The scroll utters a soothing melody. You feel very sleepy.
items.scrolls.scrolloflullaby.desc=Reading this scroll emits a soothing melody which will lull all who hear it into a deep magical sleep. For the reader and their allies the sleep is restorative.
items.scrolls.scrollofmagicmapping.name=scroll of magic mapping
items.scrolls.scrollofmagicmapping.layout=You are now aware of the level layout.
items.scrolls.scrollofmagicmapping.desc=When this scroll is read, an image of crystal clarity will be etched into your memory, alerting you to the precise layout of the level and revealing all hidden secrets. The locations of items will reveal their icon if identified, and creatures will still remain unknown.
items.scrolls.scrollofmirrorimage.name=scroll of mirror image
items.scrolls.scrollofmirrorimage.copies=The scroll forms mirror images of you.
items.scrolls.scrollofmirrorimage.no_copies=The scroll attempts to create mirror images of you, but they have nowhere to go.
items.scrolls.scrollofmirrorimage.desc=The incantation on this scroll will create two illusory twins of the reader. These mirror images act as weaker clones of the reader, and will chase down their enemies. They have no durability however, and will fade upon taking damage.
items.scrolls.scrollofretribution.name=scroll of retribution
items.scrolls.scrollofretribution.blast=Powerful magical energy erupts from the scroll!
items.scrolls.scrollofretribution.desc=This scroll contains destructive energy which channels the reader's suffering outward into a blast of power. The weaker the reader is, the more damage they will deal. At very low health this scroll can kill most enemies instantly.\n\nUsing the scroll takes a toll on the user however, blinding and weakening them.
items.scrolls.scrollofrage.name=scroll of rage
items.scrolls.scrollofrage.roar=The scroll emits an enraging roar that echoes throughout the dungeon!
items.scrolls.scrollofrage.desc=When read aloud, this scroll will unleash a great roar that draws all enemies to the reader, and enrages nearby ones.
items.scrolls.scrollofrecharging.name=scroll of recharging
items.scrolls.scrollofrecharging.surge=A surge of energy courses through your body, invigorating your wands!
items.scrolls.scrollofrecharging.desc=The raw magical power bound up in this parchment will charge up all the user's wands over time when released.
items.scrolls.scrollofremovecurse.name=scroll of remove curse
items.scrolls.scrollofremovecurse.inv_title=Cleanse an item
items.scrolls.scrollofremovecurse.cleansed=Your item glows with a cleansing light, and a malevolent energy disperses!
items.scrolls.scrollofremovecurse.not_cleansed=Your item glows with a cleansing light, but nothing happens.
items.scrolls.scrollofremovecurse.spirit=Your scroll frees the tormented spirit!
items.scrolls.scrollofremovecurse.desc=The incantation on this scroll will instantly strip any curses from a single weapon, ring, wand, armor, or artifact.
items.scrolls.scrollofteleportation.name=scroll of teleportation
items.scrolls.scrollofteleportation.tele=In a blink of an eye you were teleported to another location of the level.
items.scrolls.scrollofteleportation.no_tele=The teleportation magic fails.
items.scrolls.scrollofteleportation.cant_reach=You can't teleport there.
items.scrolls.scrollofteleportation.prompt=Choose a location to teleport
items.scrolls.scrollofteleportation.desc=The spell on this parchment instantly transports the reader to a different location on the dungeon level. The scroll prioritizes areas the reader hasn't been to before, though it is not able to teleport past locked doors or barricades. It can, however, reveal hidden doors that lead to new areas.\n\nThe spell in this parchment however, paralyzes you for 3 turns.
items.scrolls.scrollofterror.name=scroll of terror
items.scrolls.scrollofterror.none=The scroll emits a brilliant flash of red light.
items.scrolls.scrollofterror.one=The scroll emits a brilliant flash of red light and the %s flees!
items.scrolls.scrollofterror.many=The scroll emits a brilliant flash of red light and the monsters flee!
items.scrolls.scrollofterror.desc=When read, this scroll will emit a flash of red light that will overwhelm all enemies in your field of view with terror, and they will turn and flee. Attacking a fleeing enemy will shorten the effect.
items.scrolls.scrolloftransmutation.name=scroll of transmutation
items.scrolls.scrolloftransmutation.inv_title=Transmute an item
items.scrolls.scrolloftransmutation.nothing=Nothing interesting happens.
items.scrolls.scrolloftransmutation.morph=Your item morphs into something different!
items.scrolls.scrolloftransmutation.desc=This scroll contains powerful transmutation magic. When used on an eligible item it will transform it into a different item of the same type. The magic will even preserve upgrades, enchantments, and glyphs. Scrolls and potions will be transmuted into their exotic equivalent, and vice-versa.
items.scrolls.scrollofupgrade.name=scroll of upgrade
items.scrolls.scrollofupgrade.inv_title=Upgrade an item
items.scrolls.scrollofupgrade.ac_upgrade=USE ALL UPGRADES
items.scrolls.scrollofupgrade.ac_upgrade_amount=USE SOME UPGRADES
items.scrolls.scrollofupgrade.weaken_curse=The scroll of upgrade weakens the curse on your item.
items.scrolls.scrollofupgrade.remove_curse=The scroll of upgrade cleanses the curse on your item!
items.scrolls.scrollofupgrade.desc=This scroll will upgrade a single item. Wands will increase in power and number of charges, weapons and armor will deal and block more damage, and the effects of rings will intensify. It can even weaken or sometimes totally dispel curses, though it is not as potent as a scroll of remove curse.
items.scrolls.scrollofpower.name=scroll of power
items.scrolls.scrollofpower.enhance=The scroll emits a magical enhancement throughout the dungeon!
items.scrolls.scrollofpower.desc=When read aloud, this scroll will unleash a great enhancement that draws all enemies to the reader, but the mob gives you a bonus experience.
items.scrolls.exotic.scrollofinsurgence.name=scroll of insurgence
items.scrolls.exotic.scrollofinsurgence.desc=When read aloud, this scroll will simultaneously create an arena while drawing all mobs into you.\n\nWhile in the arena, mobs give additional experience when killed, and gives some additional loots in some cases.
items.scrolls.exotic.scrollofinsurgence$challengeinsurgence.name=challenge arena
items.scrolls.exotic.scrollofinsurgence$challengeinsurgence.desc=A magical arena has appeared around you, denoted by a calm and chaotic blue fog.\n\nWhile standing in the fog, your hunger will not increase, and it gives additional experience from mobs killed.\n\nTurns remaining: %d.
items.fishingrods.fishingrod.name=fishing rod
items.fishingrods.fishingrod.basics=Each fishing rod has two stats: efficiency and fortune. Efficiency determines, how long the hook will stay before catching something. Fortune determines, how much loot this rod can catch at once. While fortune increases very rapidly with upgrades, efficiency takes more scrolls to significantly improve. Make sure of upgrading your fishing rod for good catches.\n\nCurrent efficiency: _%d%%_\nCurrent fortune: _%d_
items.fishingrods.fishingrod.ac_cast=CAST
items.fishingrods.fishingrod.ac_uncast=UNCAST
items.fishingrods.fishingrod.prompt=Choose tile to start fishing
items.fishingrods.fishingrod.no_water=It's pointless to cast the rod into dry place.
items.fishingrods.fishingrod.cant_reach=It's impossible to throw the hook that far.
items.fishingrods.fishingrod.cant_see=You are not sure, where to cast.
items.fishingrods.fishingrod.hook_here=You can't have two hooks.
items.fishingrods.fishingrod.no_hook_here=It's not possible to uncast without hook.
items.fishingrods.fishingrod.upgrade_fishing_efficiency=Fishing Efficiency
items.fishingrods.fishingrod.upgrade_fishing_fortune=Fishing Fortune
items.fishingrods.basicfishingrod.name=wooden fishing rod
items.fishingrods.basicfishingrod.desc=The durable and flexible wood fishing rod. Doesn't have much power, but useful for small drops.
items.fishingrods.goldenfishingrod.name=golden fishing rod
items.fishingrods.goldenfishingrod.desc=The elite fishing device, capable of big feats with few upgrades.
items.fishingrods.neutroniumfishingrod.name=neutronium fishing rod
items.fishingrods.neutroniumfishingrod.desc=Your endless avarice have produced this extremely dense rod, that catches very powerful items.
items.fishingrods.avaritiafishingrod.name=infinity fishing rod
items.fishingrods.avaritiafishingrod.desc=This is final stage of fishing rods. It creates insane amount of items with each cast.
items.fishingrods.chaosfishingrod.name=chaos fishing rod
items.fishingrods.chaosfishingrod.desc=Welcome to another episode of Project Ozone 3, in Kappa Mode!
items.fishingrods.spiritualfishingrod.name=chaos fishing rod
items.fishingrods.spiritualfishingrod.desc=The fishing rod entirely made of souls from all beings you have killed for power and money. How unfortunately fortunate. 
items.scrolls.exotic.exoticscroll.kaunan=exotic scroll of KAUNAN
items.scrolls.exotic.exoticscroll.sowilo=exotic scroll of SOWILO
items.scrolls.exotic.exoticscroll.laguz=exotic scroll of LAGUZ
items.scrolls.exotic.exoticscroll.yngvi=exotic scroll of YNGVI
items.scrolls.exotic.exoticscroll.gyfu=exotic scroll of GYFU
items.scrolls.exotic.exoticscroll.raido=exotic scroll of RAIDO
items.scrolls.exotic.exoticscroll.isaz=exotic scroll of ISAZ
items.scrolls.exotic.exoticscroll.mannaz=exotic scroll of MANNAZ
items.scrolls.exotic.exoticscroll.naudiz=exotic scroll of NAUDIZ
items.scrolls.exotic.exoticscroll.berkanan=exotic scroll of BERKANAN
items.scrolls.exotic.exoticscroll.odal=exotic scroll of ODAL
items.scrolls.exotic.exoticscroll.tiwaz=exotic scroll of TIWAZ
items.scrolls.exotic.exoticscroll.zychron=exotic scroll of ZYCHRON
items.scrolls.exotic.exoticscroll.creuch=exotic scroll of CREUCH
items.scrolls.exotic.exoticscroll.unknown_desc=A glowing indecipherable magical rune is written on this black parchment. It seems to be foreign to this land, who knows what it will do when read aloud?
items.scrolls.exotic.scrollofsirenssong.name=scroll of siren's song
items.scrolls.exotic.scrollofsirenssong.prompt=Choose a target
items.scrolls.exotic.scrollofsirenssong.no_target=The scroll activates without a target.
items.scrolls.exotic.scrollofsirenssong.cancel=You must choose a target.
items.scrolls.exotic.scrollofsirenssong.desc=Reading this scroll emits an alluring melody which will enthrall a targeted enemy, permanently turning them into an ally! Other enemies who hear it will be temporarily charmed.\n\nParticularly strong enemies can resist the enthrall effect, and will be charmed instead.
items.scrolls.exotic.scrollofsirenssong$enthralled.name=enthralled
items.scrolls.exotic.scrollofsirenssong$enthralled.desc=This creature has been bewitched by the magic of a scroll of siren's song.\n\nAn enthralled character is permanently your ally, and will fight any enemies they encounter.
items.scrolls.exotic.scrollofaffection.name=scroll of affection
items.scrolls.exotic.scrollofaffection.desc=Reading this scroll will emit an alluring laugh which beckons all who hear it to your side.
items.scrolls.exotic.scrollofantimagic.name=scroll of anti-magic
items.scrolls.exotic.scrollofantimagic.desc=The incantation on this scroll will surround you with a magical aura that temporarily blocks all magical effects, harmful or helpful. Heroic armor abilities are strong enough to work regardless however.
items.scrolls.exotic.scrollofdetermination.name=scroll of determination
items.scrolls.exotic.scrollofdetermination.desc=When read aloud, this scroll will protect his user by applying determination shield that steals life of nearby enemies.
items.scrolls.exotic.scrollofchallenge.name=scroll of challenge
items.scrolls.exotic.scrollofchallenge.desc=When read aloud, this scroll will unleash a great roar that draws enemies to the user while simultaneously creating a small arena around them.\n\nAs long as the reader stays in this arena they will take 33% less damage from all sources (this is applied before other forms of damage reduction), and they will not lose satiety.\n\nThe size of the arena will scale with the size of the area the reader is in. It will be particularly small in some boss areas.
items.scrolls.exotic.scrollofchallenge$challengearena.name=challenge arena
items.scrolls.exotic.scrollofchallenge$challengearena.desc=A magical arena has appeared around you, denoted by a billowing red fog.\n\nWhile standing in the fog, your hunger will not increase and you will take 33%% less damage from all sources. If you have any other sources of damage reduction (such as armor), they will apply after the 33%% reduction.\n\nTurns remaining: %d.
items.scrolls.exotic.scrollofdivination.name=scroll of divination
items.scrolls.exotic.scrollofdivination.nothing_left=There is nothing left to identify globally, identifying the part of your inventory instead.
items.scrolls.exotic.scrollofdivination.desc=This scroll will permanently identify four random item types. The types identified can be a potion's color, a scroll's rune, or a ring's gem. The items identified won't necessarily be ones you're carrying.
items.scrolls.exotic.scrollofdivination$wnddivination.desc=Your scroll of divination has identified the following items:
items.scrolls.exotic.scrollofdread.name=scroll of dread
items.scrolls.exotic.scrollofdread.desc=When read, this scroll will emit a flash of red light that will instill incredible terror in all enemies in your field of view. So great is this effect that they will rapidly try to flee from the entire dungeon, never to be seen again!\n\nJust like with terror, this effect can expire with time, or if the enemy is attacked.\n\nStrong-willed enemies, such as bosses, will be inflicted with regular terror instead.
items.scrolls.exotic.scrollofenchantment.name=scroll of enchantment
items.scrolls.exotic.scrollofenchantment.inv_title=Enchant an item
items.scrolls.exotic.scrollofenchantment.weapon=Select an enchantment to apply to your weapon.
items.scrolls.exotic.scrollofenchantment.armor=Select a glyph to apply to your armor.
items.scrolls.exotic.scrollofenchantment.cancel=cancel
items.scrolls.exotic.scrollofenchantment.cancel_warn=Cancelling will still consume your scroll of enchantment, are you sure?
items.scrolls.exotic.scrollofenchantment.cancel_warn_yes=Yes, I'm sure
items.scrolls.exotic.scrollofenchantment.cancel_warn_no=No, I changed my mind
items.scrolls.exotic.scrollofenchantment.desc=This scroll will infuse a weapon or armor with powerful magical energy. The reader even has some degree of control over which magic is imbued.
items.scrolls.exotic.scrollofforesight.name=scroll of foresight
items.scrolls.exotic.scrollofforesight.desc=After reading this scroll, the detail of nearby terrain will be constantly fed to the reader's mind in crystal clarity. This effect lasts for a considerable amount of time, and will reveal all hidden doors or traps, making searching unnecessary.
items.scrolls.exotic.scrollofmetamorphosis.name=scroll of metamorphosis
items.scrolls.exotic.scrollofmetamorphosis.choose_desc=Choose a talent to metamorphose.
items.scrolls.exotic.scrollofmetamorphosis.replace_desc=Choose a new talent to replace your metamorphosed talent with.
items.scrolls.exotic.scrollofmetamorphosis.metamorphose_talent=metamorphose talent
items.scrolls.exotic.scrollofmetamorphosis.desc=This scroll contains powerful transmutation magic, which will apply to the caster instead of to an item. The magic of this scroll will let you select one talent, and replace it with one of four talents of the same tier from different hero classes!\n\nThis effect can only apply to class talents, not talents gained from subclasses or armor abilities. Talents that you cannot use will not be given as options.
items.scrolls.exotic.scrollofmysticalenergy.name=scroll of mystical energy
items.scrolls.exotic.scrollofmysticalenergy.desc=The raw magical power bound up in this parchment will, when released, charge a user's equipped artifacts over time.
items.scrolls.exotic.scrollofpassage.name=scroll of passage
items.scrolls.exotic.scrollofpassage.desc=The spell on this parchment instantly transports the reader to the nearest region first floor above them. Very handy for quickly getting to a shop.
items.scrolls.exotic.scrollofpetrification.name=scroll of petrification
items.scrolls.exotic.scrollofpetrification.desc=A flash of red light will overwhelm all creatures in your field of view with such great terror that they will be frozen on the spot.
items.scrolls.exotic.scrollofmidas.name=scroll of midas
items.scrolls.exotic.scrollofmidas.desc=This scroll contains powerful transmutation magic. When invoked, all enemies in the reader's sight will be transformed into sheer amount of gold!\n\nThe transformation is permanent, eliminating all enemies affected. Powerful enemies will resist the effect though, and any items affected enemies were carrying are lost.
items.scrolls.exotic.scrollofprismaticimage.name=scroll of prismatic image
items.scrolls.exotic.scrollofprismaticimage.desc=The incantation on this scroll will create a colorful illusory twin of the reader. This prismatic image acts as a weaker clone of the reader, with similar defence but lower hp and damage.\n\nThe prismatic image will show itself when enemies are present, and will attempt to defend the reader.\n\nIf a prismatic image already exists, using this scroll will fully heal it.
items.scrolls.exotic.scrollofpsionicblast.name=scroll of psionic blast
items.scrolls.exotic.scrollofpsionicblast.ondeath=The Psionic Blast tears your mind apart...
items.scrolls.exotic.scrollofpsionicblast.desc=This scroll contains incredible destructive energy that can be channeled to destroy the minds of all visible creatures.\n\nThere is significant feedback however, and the reader will also be damaged, blinded, and weakened. The more targets the scroll hits, the less self-damage will be taken.
items.spells.alchemize.name=alchemize
items.spells.alchemize.prompt=Alchemize an Item
items.spells.alchemize.desc=This spell contains transmutative powers similar to those found in an alchemy pot. Each cast allows the user to turn an item (or stack of items) into gold or alchemical energy. Turning potions or scrolls into energy will even identify them!\n\nA few Alchemize uses are sold from shops, but many more can be made using alchemy by combining a seed, runestone, and a little alchemical energy.
items.spells.alchemize$wndalchemizeitem.sell=Turn into %dg
items.spells.alchemize$wndalchemizeitem.sell_1=Turn 1 into %dg
items.spells.alchemize$wndalchemizeitem.sell_all=Turn all into %dg
items.spells.alchemize$wndalchemizeitem.energize=Turn into %d energy
items.spells.alchemize$wndalchemizeitem.energize_1=Turn 1 into %d energy
items.spells.alchemize$wndalchemizeitem.energize_all=Turn all into %d energy
items.spells.beaconofreturning.name=beacon of returning
items.spells.beaconofreturning.preventing=The strong magic aura of this place prevents you from using the spell!
items.spells.beaconofreturning.creatures=The Psychic aura of neighbouring creatures doesn't allow you to teleport at this moment.
items.spells.beaconofreturning.set=The beacon was set at your current location.
items.spells.beaconofreturning.wnd_body=Setting will override the location the beacon was previously set to.\n\nReturning will return to your last set location and consume one use of the spell.
items.spells.beaconofreturning.wnd_set=Set
items.spells.beaconofreturning.wnd_return=Return
items.spells.beaconofreturning.desc_set=This beacon was set somewhere on floor %d.
items.spells.beaconofreturning.desc=This intricate spell grants the user the ability to return to a set location, regardless of distance. The spell will only be consumed by returning, it can be set as many times as you like, but it will only remember the most recent location it was set to.
items.spells.curseinfusion.name=curse infusion
items.spells.curseinfusion.inv_title=Curse an item
items.spells.curseinfusion.desc=This spell infuses a piece of equipment with the same powerful malignant magic present within DM-300. The item it is used on will immediately be cursed, and any enchantment or glyph it may have had will be overridden.\n\nIn the case of weapons, armor, and wands, the item will gain upgrades in addition to being cursed. Curse infusion upgrades do not stack, and the upgrades are lost if the item becomes uncursed.\n\nMultiple curse infusions can also be used to change the curse on a weapon or armor.
items.spells.galacticinfusion.name=galactic infusion
items.spells.galacticinfusion.inv_title=Galactize an item
items.spells.galacticinfusion.desc=This spell infuses a piece of weapon with galactic enchantment. Galactic enchantment attaches a weapon with multiple enchants making the weapon more powerful.
items.spells.galacticinfusion.galactized=Your weapon is now galactized!
items.spells.spell.ac_cast=CAST
items.spells.spell.no_magic=You can't cast spells while magic immune.
items.spells.magicalinfusion.name=magical infusion
items.spells.magicalinfusion.inv_title=Infuse an item
items.spells.magicalinfusion.infuse=Your item is infused with arcane energy!
items.spells.magicalinfusion.desc=This spell possesses the same magical power as a scroll of upgrade, but in a more stable form.\n\nIn addition to upgrading an item as normal it will never erase an enchantment, glyph, or curse.
items.spells.magicalporter.name=magical porter
items.spells.magicalporter.inv_title=Port an item
items.spells.magicalporter.nowhere=There is nowhere for you to port an item to.
items.spells.magicalporter.desc=This spell will magically transport any item it is cast on. Unlike a merchant's beacon however, the items will be transported to the entrance of the next boss floor.
items.spells.phaseshift.name=phase shift
items.spells.phaseshift.no_target=There is nothing to teleport there.
items.spells.phaseshift.desc=This chaotic spell will teleport any character it is aimed at to a random location on the current floor, and stun them for a significant amount of time. Powerful foes will be able to resist the stunning effect. This spell can be directed at a target or at the user themselves.
items.spells.reclaimtrap.name=reclaim trap
items.spells.reclaimtrap.no_trap=There is no trap there.
items.spells.reclaimtrap.desc_trap=The spell is currently imbued with a _%s._
items.spells.reclaimtrap.desc=This spell contains remnants of the mechanical energy of DM-300. When cast on an active trap, the power of the trap will be absorbed into the spell, allowing you to trigger the trap's effect at any location you like.\n\nHowever, some traps may not function in all places, and the spell can only store one trap at a time.
items.spells.recycle.name=recycle
items.spells.recycle.inv_title=Recycle an item
items.spells.recycle.recycled=Your item was recycled into: %s.
items.spells.recycle.desc=This spell contains a lesser form of transmutation magic. While it won't work on equipment, this spell will transform a scroll, potion, seed, runestone, or tipped dart into a random item of the same type.
items.spells.summonelemental.name=summon elemental
items.spells.summonelemental.ac_imbue=IMBUE
items.spells.summonelemental.imbue_prompt=Imbue an item
items.spells.summonelemental.desc=This spell channels the energy of the elemental embers used to make it, and will allow you to summon a friendly elemental to fight with you! Only one elemental can be summoned at a time, but the spell can be re-cast to return the elemental to you at no cost.
items.spells.summonelemental.desc_newborn=The spell is currently unimbued, and will summon a _newborn elemental_ without a ranged attack. You can imbue an identified potion of liquid flame, potion of frost, scroll of recharging, or scroll of transmutation to power the spell up, causing future summons to be a full power elemental!
items.spells.summonelemental.desc_fire=The spell is currently hot to the touch, it will summon a _fire elemental_. You can imbue a different item, but the spell will lose its current imbue.
items.spells.summonelemental.desc_frost=The spell is currently cold to the touch, it will summon a _frost elemental_. You can imbue a different item, but the spell will lose its current imbue.
items.spells.summonelemental.desc_shock=The spell is currently radiating static energy, it will summon a _shock elemental_. You can imbue a different item, but the spell will lose its current imbue.
items.spells.summonelemental.desc_chaos=The spell is currently radiating chaotic energy, it will summon a _chaos elemental_. You can imbue a different item, but the spell will lose its current imbue.
items.spells.targetedspell.prompt=Choose a target
items.spells.targetedspell.inv_title=Infuse an item
items.spells.telekineticgrab.name=telekinetic grab
items.spells.telekineticgrab.cant_grab=You can't grab that.
items.spells.telekineticgrab.no_target=There's nothing to grab there.
items.spells.telekineticgrab.desc=This spell allows the caster to remotely grab all items at 3x3 area around the location, or all thrown weapons stuck to an enemy!\n\nIt can't be used to grab items that someone else owns, or to grab containers like chests.
items.spells.unstablespell.name=unstable spell
items.spells.unstablespell.desc=This small black square crystal has shifting runic symbols on each of its surfaces.\n\nWhen activated, it will trigger the effect of a random scroll. The scroll effect will always be combat focused if there are enemies in your field of view, and will always be non-combat focused otherwise.
items.spells.wildenergy.name=wild energy
items.spells.wildenergy.desc=This spell contains some of the cursed energy which powered DM-300. When cast, it will recharge your wands and worn artifacts, while also triggering a random cursed wand effect. You are able to choose a direction for this cursed magic to shoot in, however.
items.spells.vampirism.name=vampirism
items.spells.vampirism.desc=This spell twistes restorative magic of healing potion and allows user to steal 30\u0025-50\u0025 health from any living target.
items.spells.raritize.name=raritize
items.spells.raritize.inv_title=Raritize an item
items.spells.raritize.raritized=Your item was raritized to %s.
items.spells.raritize.desc=This spell contains a super implicit magic which enhances your equipable item with raritizing magic.
items.spells.itemquantifier.name=Item Quantifier
items.spells.itemquantifier.inv_title=Gamble an item
items.spells.itemquantifier.quantified=Your item was quantified to %s.
items.spells.itemquantifier.false_quantify=Your item was not quantified and reduced to %s.
items.spells.itemquantifier.quantified_unique=Your unique item was quantified to %s.
items.spells.itemquantifier.false_quantify_unique=Your unique item was not quantified and reduced to %s.
items.spells.itemquantifier.desc=This spell contains unstable quantifier magic, any consumable item has 75% chance (and 25% chance if the item is unique) to increase your item's quantity by _three_ otherwise takes _one_.
items.spells.respawnbooster.name=overpopulation
items.spells.respawnbooster.desc=This spell messes with dungeon's population limits, decreasing the time for new monsters to appear and increasing limit of said monsters on depth.
items.spells.firebooster.name=flame empower
items.spells.firebooster.desc=This spell makes you more favorable to gods of burning, making anything burning in the dungeon by 25% more powerful.
items.spells.gambler.name=Gambling Spell
items.spells.gambler.desc=This spell contains unstable magic, attracting your gold making them multiply itself or nothing at all or worse.
items.spells.gambler.secrecy=You are so addicted to gambling and you see this message. Are you insane?
items.spells.extractor.name=Extractor
items.spells.extractor.inv_title=Extract an item
items.spells.extractor.extracted=Your item's upgrades were extracted.
items.spells.extractor.desc=This spell is made from Blacksmith's power, it extracts the upgrades from an item.
items.spells.barricade.name=Barricade
items.spells.barricade.desc=This spell when casted, builds a barricade wall and stays until it burns.
items.spells.pocketalchemy.name=Pocket Alchemy
items.spells.pocketalchemy.desc=This spell casts terrain manipulation magic where you can turn an empty cell with an alchemy pot. However, pointing this spell on a valid position will apply a cooldown to avoid abusing the spell.\n\nYou can get this spell on shops with a very low chance or craft this in the alchemy.
items.spells.pocketalchemy.alchemy_oncooldown=You can't use this spell right now.
items.spells.pocketalchemy$alchemycooldown.name=Spell Cooldown: Pocket Alchemy
items.spells.pocketalchemy$alchemycooldown.desc=You recently used pocket alchemy spell, you may wait for some time to deploy an alchemy on to the ground again.\n\nRemaining turns: %s.
items.spells.determinantinfusion.name=Determinant Infusion
items.spells.determinantinfusion.desc=This spell when casted, a scream from this spell will alert all of the entities in the dungeon, but never gives your location. A static shield will appear before you.
items.spells.tierupgrade.name=Weapon Tier Upgrader
items.spells.tierupgrade.inv_title=Upgrade Tier
items.spells.tierupgrade.tier_up=Your weapon's tier has been upgraded.
items.spells.tierupgrade.desc=This spell contains powerful transmutative magic that is only specialized for weapons, to increase the weapon's tier by 1. However due to its potential, it is said to take the current user's HP by 10%, and weapon tier can reset if used with Scroll of Transmutation.
items.spells.armortierupgrade.name=Armor Tier Upgrader
items.spells.armortierupgrade.inv_title=Upgrade Tier
items.spells.armortierupgrade.tier_up=Your armor's tier has been upgraded.
items.spells.armortierupgrade.desc=This spell contains powerful transmutative magic that is only specialized for armors, to increase the armors's tier by 1. However due to its potential, it is said to take the current user's HP by 18%.
items.spells.danceimmune.name=Dance Immune Spell
items.spells.danceimmune.desc=This spell when casted, a magical power flows into you, preventing dancing curses even if it's positive.
items.spells.danceimmune.applied=Dancing effects wears off its power temporarily.
items.spells.danceimmune.ongoing=You are currently under this effect, please try again later.
items.spells.powerless.name=Powerless Spell
items.spells.powerless.desc=This spell releases a powerful magic that reveals every mob in the dungeon every 5 turns, it will also stun all mobs on the floor.
items.spells.powerless$powerlessbuff.name=Powerless Magic
items.spells.powerless$powerlessbuff.desc=This can release a powerful magic that reveals every 5 turns, well it is useful only when there are few mobs.\n\nShots Remaining: %s.
items.spells.itemgetter.name=Item Getter
items.spells.itemgetter.desc=This spell when cast on a cell with items, you will be asked to select it and get it manually.
items.spells.itemgetter.no_match=There's no items in that cell.
items.spells.itemgetter.found=The item %s has been found.
items.spells.itemgetter.cant_grab=You can't grab %s.
items.stones.inventorystone.ac_use=USE
items.stones.runestone$placeholder.name=runestone
items.stones.stoneofaggression.name=stone of aggression
items.stones.stoneofaggression.desc=When this stone is thrown at an ally or enemy, all nearby enemies will be forced to attack that character for a short time.\n\nWhen used on enemies, the magic will only last for a few turns, but when used on yourself or allies it will last significantly longer.
items.stones.stoneofaggression$aggression.name=targeted
items.stones.stoneofaggression$aggression.desc=Manipulative magic is forcing all nearby enemies to attack this character.\n\nTurns remaining: %s.
items.stones.stoneofaugmentation.name=stone of augmentation
items.stones.stoneofaugmentation.inv_title=Augment an item
items.stones.stoneofaugmentation.desc=This runestone possesses potent magic which can augment equipment to enhance one property at the cost of another.\n\nUsing on a weapon will allow you to enhance either speed or damage.\n\nUsing on armor will allow you to enhance either defense or evasion.
items.stones.stoneofaugmentation$wndaugment.choice=What would you like to enhance?
items.stones.stoneofaugmentation$wndaugment.speed=Speed
items.stones.stoneofaugmentation$wndaugment.damage=Damage
items.stones.stoneofaugmentation$wndaugment.evasion=Evasion
items.stones.stoneofaugmentation$wndaugment.defense=Defense
items.stones.stoneofaugmentation$wndaugment.none=Remove Augmentation
items.stones.stoneofaugmentation$wndaugment.cancel=Never mind
items.stones.stoneofblast.name=stone of blast
items.stones.stoneofblast.desc=This runestone will instantly explode at the location it is thrown to. Just like a bomb, the explosion will deal damage to anything nearby.
items.stones.stoneofblink.name=stone of blink
items.stones.stoneofblink.desc=This runestone will teleport the user to the location it is thrown to.
items.stones.stoneofclairvoyance.name=stone of clairvoyance
items.stones.stoneofclairvoyance.desc=This stone will instantly reveal all tiles in a very wide area around where it is thrown. Its effect will even reach through walls.
items.stones.stoneofdeepsleep.name=stone of deep sleep
items.stones.stoneofdeepsleep.desc=When this stone is thrown at an enemy, it will put them into a deep magical sleep. Magically slept enemies will sleep forever until disturbed.
items.stones.stoneofdisarming.name=stone of disarming
items.stones.stoneofdisarming.desc=This runestone holds magic that can disable malicious traps hidden throughout the dungeon. It will disarm up to 9 traps around the area it is thrown at.
items.stones.stoneofenchantment.name=stone of enchantment
items.stones.stoneofenchantment.inv_title=Enchant an item
items.stones.stoneofenchantment.weapon=Your weapon glows in the darkness!
items.stones.stoneofenchantment.armor=Your armor glows in the darkness!
items.stones.stoneofenchantment.desc=This runestone possesses enchanting magic. Unlike a scroll of upgrade, it will not increase the direct power of an item, but will instead imbue a weapon or armor with an enchantment, granting it a new power.
items.stones.stoneoffear.name=stone of fear
items.stones.stoneoffear.desc=When this stone is thrown onto a character they will be overwhelmed with terror, and will turn and flee. Attacking a fleeing character will shorten the effect.
items.stones.stoneofflock.name=stone of flock
items.stones.stoneofflock.desc=This runestone summons magical sheep for a short time around the location it is thrown to.
items.stones.stoneofintuition.name=stone of intuition
items.stones.stoneofintuition.inv_title=Select an item
items.stones.stoneofintuition.desc=This runestone holds a weaker version of the magic found in scrolls of identification. Rather than directly identifying an item, it will work on your intuition, allowing you to attempt to identify the type of a potion, scroll, or ring by guessing.
items.stones.stoneofintuition.break_info=You can use stones of intuition twice before one breaks, _your next use won't consume a stone_.
items.stones.stoneofintuition.break_warn=You've used a stone of intuition previously, so _your next use will consume a stone_.
items.stones.stoneofintuition$wndguess.text=Guess what the type of the unidentified item is. If you guess correctly, the type will be identified!
items.stones.stoneofintuition$wndguess.correct=Correct. The item's type has been identified!
items.stones.stoneofintuition$wndguess.incorrect=Your guess was incorrect.
items.stones.stoneofintuition$wndguess.break=Your stone of intuition crumbles to dust...
items.stones.stoneofshock.name=stone of shock
items.stones.stoneofshock.desc=This runestone unleashes a blast of electrical energy which briefly stuns all nearby targets, and grants the thrower wand charge for each target hit.
items.stones.stoneofempowerment.name=stone of empowerment
items.stones.stoneofempowerment.desc=This runestone will either enhance the target's EXP gain or damages it within the thrower's damage roll.
items.treasurebags.treasurebag.desc=Open this to obtain juicy loot!
items.treasurebags.treasurebag.ac_open=OPEN
items.treasurebags.gootreasurebag.name=Treasure Bag (Goo)
items.treasurebags.tengutreasurebag.name=Treasure Bag (Tengu)
items.treasurebags.dm300treasurebag.name=Treasure Bag (DM-300)
items.treasurebags.dktreasurebag.name=Treasure Bag (Dwarf King)
items.treasurebags.gamblebag.name=Lucky Bag
items.treasurebags.gamblebag.desc=You can get something and you can get nothing! Check your luck by opening this bag!
items.treasurebags.biggergamblebag.name=Big Lucky Bag
items.treasurebags.biggergamblebag.desc=You can get something and you can get nothing! Check your luck by opening this bag!\n\nThis bag contains more items on average!
items.treasurebags.qualitybag.name=Elite Bag
items.treasurebags.qualitybag.desc=This bag contains uncursed weapon, uncursed armor, uncursed ring, uncursed artifact, uncursed wand, food, runestone, seed, potion, exotic potion, scroll, exotic scroll and food.
items.treasurebags.alchemybag.name=bag with alchemy items
items.treasurebags.burntbag.name=burnt bag
items.treasurebags.burntbag.desc=This bag is a result of burning away some regular or big lucky bags. You can get some stuff, and you can get nothing but grilled beef! Check your luck by opening this bag!\n\nThere is a 35% possibility to get something better than this burnt piece of gambling! Just try burning more!
items.treasurebags.idealbag.name=refined lucky bag
items.treasurebags.idealbag.desc=This bag is a result of burning away some regular or big lucky bags and getting very lucky as result. You can get a lot of stuff, and you can get nothing! Check your luck by opening this bag!\n\nThere is a probability of some exclusive items dropping from this bag.
items.treasurebags.idealbag$plutonium.name=blob of plutonium
items.treasurebags.idealbag$plutonium.desc=This small pile of white-ish material is incredibly poisonous for some reason and will kill you, if not taken care of as soon as possible.\n\nThe only use is to sell it to shopkeeper, to watch them die of poison too.
items.treasurebags.idealbag$osmiridiumplate.name=osmiridium plate
items.treasurebags.idealbag$osmiridiumplate.desc=This tough and heavy piece of metal can be charged to produce a special shield, that will prevent all damage and turn some of it into "overflow", which will heal you and even go past maximum health.
items.treasurebags.idealbag$osmirdiumshield.name=osmiridium shield
items.treasurebags.idealbag$osmirdiumshield.desc=The one of toughest metals have come to form this beautiful energized shield.\n\nWhen active, the character will take no damage and some of it will be converted into "overflow" healing, which goes past character's maximum health.
items.treasurebags.idealbag$brokenenderiumblade.name=broken enderium blade
items.treasurebags.idealbag$brokenenderiumblade.desc=The what remains of a beautiful sword built from top-notch cosmic materials.\n\nIt seems to be incredibly valuable and would sell for a lot of money.
items.treasurebags.idealbag$energybottle.name=energite bottle
items.treasurebags.idealbag$energybottle.desc=The alchemical energy concept, purified into purest kinds of liquid.\n\nIt can be alchemized into a lot of energy for further use.
items.treasurebags.commontreasurebag.name=Common Lucky Bag
items.treasurebags.commontreasurebag.desc=This bag is usually the same as burnt bag, it is cheap compared to the normal lucky bag.
items.treasurebags.uncommontreasurebag.name=Uncommon Lucky Bag
items.treasurebags.uncommontreasurebag.desc=This bag contains some slightly upgraded equipment or throwable and quantity of some items are slightly increased, it is somehow more expensive than the normal lucky bag.
items.treasurebags.raretreasurebag.name=Rare Lucky Bag
items.treasurebags.raretreasurebag.desc=This bag quite rarer than the uncommon lucky bag, it has several items that has better quality compared to the normal lucky bag, and it is slightly expensive though.
items.treasurebags.epictreasurebag.name=Epic Lucky Bag
items.treasurebags.epictreasurebag.desc=This bag expensive and has high quality items, it also has raritized items with low chance, though elite bags are cheaper that this bag.
items.treasurebags.legendarytreasurebag.name=Legendary Lucky Bag
items.treasurebags.legendarytreasurebag.desc=This bag the most expensive bag and has high quality items, it also has raritized items with much higher chance, though elite bags are cheaper that this bag.
items.trinkets.chaoticcenser.name=chaotic censer
items.trinkets.chaoticcenser.desc=After some time in the alchemy pot this incense-burning censer appears to be producing smoke all on its own! These gasses build up and will spew forth from the censer in random directions and semi-random intervals. It seems capable of producing all sorts of gasses, but the position they shoot out in seems to be more likely to be in your favour at least.
items.trinkets.chaoticcenser.typical_stats_desc=Typically this trinket will spawn a harmful gas nearby roughly every _%d_ turns. The gas is more likely to appear when enemies are present, and less likely to appear in enclosed spaces. At higher levels these gases are more likely to be exotic and powerful.
items.trinkets.chaoticcenser.stats_desc=At its current level, this trinket will spawn a harmful gas nearby roughly every _%d_ turns. The gas is more likely to appear when enemies are present, and less likely to appear in enclosed spaces. At higher levels these gases are more likely to be exotic and powerful.
items.trinkets.dimensionalsundial.name=dimensional sundial
items.trinkets.dimensionalsundial.warning=Your sundial isn't casting a shadow, you feel uneasy.
items.trinkets.dimensionalsundial.desc=This small handheld sundial is somehow able to cast a shadow in the depths of the dungeon, even if you aren't holding it upright. Even more strangely, the shadow's position seems to have no relation to the sun in this world. When no shadow is cast, the sundial seems to attract danger.
items.trinkets.dimensionalsundial.typical_stats_desc=Typically this trinket will reduce the spawning rate of enemies by _%1$d%%_ during the daytime in real life (8am-8pm), and increase the spawning rate of enemies by _%2$d%%_ at nighttime (8pm-8am).
items.trinkets.dimensionalsundial.stats_desc=At its current level, this trinket will reduce the spawning rate of enemies by _%1$d%%_ during the daytime in real life (8am-8pm), and increase the spawning rate of enemies by _%2$d%%_ at nighttime (8pm-8am).
items.trinkets.exoticcrystals.name=exotic crystals
items.trinkets.exoticcrystals.desc=These small pink crystals have the same shape as crystals of alchemical energy. While they can't be used for energy directly, they seem to be somehow influencing the potions and scrolls you find.
items.trinkets.exoticcrystals.typical_stats_desc=Typically this trinket will replace _%s%%_ of potion or scroll drops with their exotic equivalents. This does not affect potions of strength, scrolls of upgrade, or items that are generated to help solve hazard rooms.
items.trinkets.exoticcrystals.stats_desc=At its current level this trinket will replace _%s%%_ of potion or scroll drops with their exotic equivalents. This does not affect potions of strength, scrolls of upgrade, or items that are generated to help solve hazard rooms.
items.trinkets.eyeofnewt.name=eye of newt
items.trinkets.eyeofnewt.desc=This golden and black newt's eye is a common ingredient, now enhanced into a trinket. The eye seems to be reducing your vision in exchange for letting you see things in other ways.
items.trinkets.eyeofnewt.typical_stats_desc=Typically this trinket will reduce your vision range by _%1$s%%_, but will also grant you mind vision on enemies within _%2$d_ tiles.
items.trinkets.eyeofnewt.stats_desc=At its current level this trinket will reduce your vision range by _%1$s%%_, but will also grant you mind vision on enemies within _%2$d_ tiles.
items.trinkets.ferrettuft.name=ferret tuft
items.trinkets.ferrettuft.desc=A tuft of silky white ferret fur, held together by a lime green ribbon tied into a bow. Ferrets are known for their agility, mischievousness, and lack of integrity. Some of that power seems to radiate from the trinket, enhancing the evasion of anything nearby.
items.trinkets.ferrettuft.typical_stats_desc=Typically this trinket will increase the evasion of all characters by _%1$s%%_.
items.trinkets.ferrettuft.stats_desc=At its current level this trinket will increase the evasion of all characters by _%1$s%%_.
items.trinkets.mimictooth.name=mimic tooth
items.trinkets.mimictooth.desc=This large sharp tooth must have been pulled from a very unhappy mimic. It seems to be influencing the mimics of the dungeon, making them more frequent and dangerous.
items.trinkets.mimictooth.typical_stats_desc=Typically this trinket will make all kinds of mimic _%1$sx_ more common and much more difficult to detect, but will also increase the amount of loot they drop. Each dungeon floor will also have a _%2$s%%_ chance to contain an extra stealthy ebony mimic.
items.trinkets.mimictooth.stats_desc=At its current level this trinket will make all kinds of mimic _%1$sx_ more common and much more difficult to detect, but will also increase the amount of loot they drop. Each dungeon floor will also have a _%2$s%%_ chance to contain an extra stealthy ebony mimic.
items.trinkets.mossyclump.name=mossy clump
items.trinkets.mossyclump.desc=This clump of wet moss seems to hold onto its moisture no matter how hard you squeeze it. It seems to be magically tied to the dungeon itself, making grass and water more likely to appear.
items.trinkets.mossyclump.typical_stats_desc=Typically this trinket will make _%d%%_ of regular floors become filled with either water or grass instead.\n\nThis trinket costs a very large amount of energy to upgrade.
items.trinkets.mossyclump.stats_desc=At its current level this trinket will make _%d%%_ of regular floors become filled with either water or grass instead.\n\nThis trinket costs a very large amount of energy to upgrade.
items.trinkets.parchmentscrap.name=parchment scrap
items.trinkets.parchmentscrap.desc=This little scrap of parchment looks like it came from a scroll. It has retained some of its magic, and it seems to be influencing weapons and armor found in the dungeon.
items.trinkets.parchmentscrap.typical_stats_desc=Typically this trinket will make enchantments and glyphs _%dx_ as common, and curses on weapons and armor _%sx_ as common. Curses on wands, rings, or artifacts are not affected.\n\nThis trinket costs a moderately large amount of energy to upgrade.
items.trinkets.parchmentscrap.stats_desc=At its current level this trinket will make enchantments and glyphs _%dx_ as common, and curses on weapons and armor _%sx_ as common. Curses on wands, rings, or artifacts are not affected.\n\nThis trinket costs a moderately large amount of energy to upgrade.
items.trinkets.petrifiedseed.name=petrified seed
items.trinkets.petrifiedseed.desc=This seed has been fossilised, either by slow geological processes or by magic. The seed seems to be magically influencing the flora of the dungeon, occasionally replacing plant seeds with runestones.
items.trinkets.petrifiedseed.typical_stats_desc=Typically this trinket will cause trampled grass to drop runestones instead of seeds _%1$s%%_ of the time, and will also cause high grass to drop items _%2$s%%_ more often.
items.trinkets.petrifiedseed.stats_desc=At its current level this trinket will cause trampled grass to drop runestones instead of seeds _%1$s%%_ of the time, and will also cause high grass to drop items _%2$s%%_ more often.
items.trinkets.ratskull.name=rat skull
items.trinkets.ratskull.desc=This macabre trinket isn't much larger than the skull of a normal rat, which is somehow a rarity down in this dungeon. The skull's magical influence seems to attract the more rare denizens of the dungeon, making them appear far more often.
items.trinkets.ratskull.typical_stats_desc=Typically this trinket will make rare exotic enemies _%dx_ as likely to appear. The skull is only half as effective at attracting crystal mimics and armored statues, however.
items.trinkets.ratskull.stats_desc=At its current level this trinket will make rare exotic enemies _%dx_ as likely to appear. The skull is only half as effective at attracting crystal mimics and armored statues, however.
items.trinkets.saltcube.name=salt cube
items.trinkets.saltcube.desc=This large salt crystal was cut into an almost perfect cube shape, and it somehow managed to drain half the water from the alchemy pot instead of dissolving. It seems to be magically dehydrating and preserving the food you eat, extending the satiety you get, but also lessening your health restoration when not starving.
items.trinkets.saltcube.typical_stats_desc=Typically this trinket will increase the amount of time before you grow hungry by _%1$s%%_, but will also reduce your rate of health regeneration by _%2$s%%_.
items.trinkets.saltcube.stats_desc=At its current level this trinket will increase the amount of time before you grow hungry by _%1$s%%_, but will also reduce your rate of health regeneration by _%2$s%%_.
items.trinkets.shardofoblivion.name=shard of oblivion
items.trinkets.shardofoblivion.desc=After stewing in the alchemy pot, this small shard of cursed metal has changed to be made of... nothing? Light seems to bend around it, and it hovers in place when you aren't holding it. The shard seems to be magically drawing power from your ignorance, so it's probably best to not think about it too much.
items.trinkets.shardofoblivion.typical_stats_desc=Typically this trinket will increase the rate that enemies drop loot by 20%% for each piece of unidentified equipment you have equipped or recently used, to a max of _%d item(s)_. The shard will also prevent you from identifying equipment, but can be used to manually identify items that are ready for it.
items.trinkets.shardofoblivion.stats_desc=At its current level this trinket will increase the rate that enemies drop loot by 20%% for each piece of unidentified equipment you have equipped or recently used, to a max of _%d item(s)_. The shard will also prevent you from identifying equipment, but can be used to manually identify items that are ready for it.
items.trinkets.shardofoblivion.ac_identify=IDENTIFY
items.trinkets.shardofoblivion.identify_prompt=Identify an Item
items.trinkets.shardofoblivion.identify_ready=An item is ready to identify: %s.
items.trinkets.shardofoblivion.identify_ready_worn=Your worn items are now all ready to identify.
items.trinkets.shardofoblivion.identify_not_yet=That item isn't ready to be identified yet.
items.trinkets.shardofoblivion.identify=You identify the item!
items.trinkets.shardofoblivion$wandusetracker.name=Unidentified Wand Used
items.trinkets.shardofoblivion$wandusetracker.desc=You have recently used an unidentified wand, which counts as one piece of used unidentified equipment for the shard of oblivion for a little while.\n\nTurns remaining: %s
items.trinkets.shardofoblivion$thrownusetracker.name=Unidentified Thrown Weapon Used
items.trinkets.shardofoblivion$thrownusetracker.desc=You have recently used an unidentified thrown weapon, which counts as one piece of used unidentified equipment for the shard of oblivion for a little while.\n\nTurns remaining: %s.
items.trinkets.staircasetotem.name=Staircase Totem
items.trinkets.staircasetotem.desc=This strange totem seems to manipulate the dungeon's generation, the room's count increases as well as enemies around you after you descend into the next floors.
items.trinkets.staircasetotem.typical_stats_desc=Typically this trinket will increase the next floor's room count by _+%1$s%%_ (special rooms and secret rooms are halved) and enemies' count by _+%2$s%%_.
items.trinkets.staircasetotem.stats_desc=At this level this trinket will increase the next floor's room count by _+%1$s%%_ (special rooms and secret rooms are halved) and enemies' count by _+%2$s%%_.
items.trinkets.thirteenleafclover.name=thirteen leaf clover
items.trinkets.thirteenleafclover.desc=Somehow stewing in the alchemy pot has caused this clover to grow a bunch of extra leaves! It's not really clear if this trinket is lucky or unlucky, perhaps this trinket will make your luck more chaotic?
items.trinkets.thirteenleafclover.typical_stats_desc=Normally when the hero deals damage, numbers closer to the average are more common. Typically this trinket has a _%d%%_ chance to invert this, making your attacks much more likely to deal the maximum or minimum damage instead.\n\nThis trinket costs relatively little energy to upgrade.
items.trinkets.thirteenleafclover.stats_desc=Normally when the hero deals damage, numbers closer to the average are more common. At its current level this trinket has a _%d%%_ chance to invert this, making your attacks much more likely to deal the maximum or minimum damage instead.\n\nThis trinket costs relatively little energy to upgrade.
items.trinkets.trapmechanism.name=trap mechanism
items.trinkets.trapmechanism.desc=The core mechanism of one of the dungeon's pitfall traps, carefully carved out of the floor so it can be carried. It seems to be magically tied to the dungeon itself, making terrain more hazardous for you and the dungeon's inhabitants.
items.trinkets.trapmechanism.typical_stats_desc=Typically this trinket will make _%d%%_ of regular floors become filled with either traps or chasms instead.\n\nThis trinket costs relatively little energy to upgrade.
items.trinkets.trapmechanism.stats_desc=At its current level this trinket will make _%d%%_ of regular floors become filled with either traps or chasms instead.\n\nThis trinket costs relatively little energy to upgrade.
items.trinkets.vialofblood.name=vial of blood
items.trinkets.vialofblood.desc=This thin vial contains the blood of some denizen of the dungeon, it moves slowly as you rotate the vial. It seems to be magically enhancing stronger healing effects, but also delaying them.
items.trinkets.vialofblood.typical_stats_desc=Typically this trinket will increase the overall health you gain from drinking potions of healing, waterskins, or wells of health by _%1$s%%_. However, these healing effects will also occur more slowly, regenerating a maximum of _%2$s_ HP per turn (this scales with hero level).
items.trinkets.vialofblood.stats_desc=At its current level this trinket will increase the overall health you gain from drinking potions of healing, waterskins, or wells of health by _%1$s%%_. However, these healing effects will also occur more slowly, regenerating a maximum of _%2$s_ HP per turn (this scales with hero level).
items.trinkets.wondrousresin.name=wondrous resin
items.trinkets.wondrousresin.desc=This shimmering blue resin appears to have the distilled essence of a cursed wand's magic. The magic from the alchemy pot has seemed to stabilize it somewhat, and it's now affecting your wands.
items.trinkets.wondrousresin.typical_stats_desc=Typically this trinket will force cursed wand effects to become neutral or positive _%1$s%%_ of the time, and will cause uncursed wands to fire an additional neutral or positive cursed zap _%2$s%%_ of the time.\n\nThis trinket costs a moderately large amount of energy to upgrade.
items.trinkets.wondrousresin.stats_desc=At its current level this trinket will force cursed wand effects to become neutral or positive _%1$s%%_ of the time, and will cause uncursed wands to fire an additional neutral or positive cursed zap _%2$s%%_ of the time.\n\nThis trinket costs a moderately large amount of energy to upgrade.
items.trinkets.trinketcatalyst.name=magical catalyst
items.trinkets.trinketcatalyst.window_text=The water begins to glow as you add the catalyst. There are a few nearby items you could imbue with energy to turn into a magical trinket.
items.trinkets.trinketcatalyst.desc=This ball of magical golden dust glimmers in the darkness of the dungeon. This catalyst can be used at an alchemy pot with a little alchemical energy to produce a unique trinket item.\n\nTrinkets provide various different effects that slightly alter the dungeon or its inhabitants. Trinkets can be upgraded with more energy to make their effect more powerful, or dropped to forego the effect entirely.
items.trinkets.trinketcatalyst$randomtrinket.name=random trinket
items.trinkets.trinketcatalyst$randomtrinket.desc=One nearby item is stuck inside a pouch that you can't get open.\n\nThe alchemy process will dissolve the pouch away, but you won't know what trinket you'll get until you do it!
items.trinkets.trinket$placeholder.name=trinket
items.wands.cursedwand.ondeath=You were killed by your own %s.
items.wands.cursedwand.nothing=Nothing happens.
items.wands.cursedwand.mass_invuln=Brilliant light erupts from your wand!
items.wands.cursedwand.petrify=You suddenly freeze in place!
items.wands.cursedwand.grass=Grass erupts around you!
items.wands.cursedwand.fire=You smell burning...
items.wands.cursedwand.transmogrify_wand=Your wand transmogrifies into a different item!
items.wands.cursedwand.transmogrify_other=Your item transmogrifies into something different!
items.wands.cursedwand.disguise=Your appearance changes before your eyes!
items.wands.cursedwand.supernova=A blazing ball of energy starts to grow. You might want to run!
items.wands.cursedwand.supernova_positive=A blazing ball of energy starts to grow, but it feels safe somehow.
items.wands.cursedwand.sinkhole=The ground starts to give way around you!
items.wands.cursedwand.sinkhole_positive=The ground starts to give way, but feels solid enough beneath you.
items.wands.cursedwand.gravity=Gravity suddenly starts to pull in random directions!
items.wands.cursedwand.gravity_positive=Gravity suddenly starts to pull in random directions, but this doesn't seem to affect you.
items.wands.cursedwand.gravity_end=The gravity chaos ends.
items.wands.damagewand.upgrade_stat_name_1=Magic Damage
items.wands.wand.ac_zap=ZAP
items.wands.wand.fizzles=Your wand fizzles; it must not have enough charge.
items.wands.wand.no_magic=Your wand fizzles; you cannot use wands while magic immune.
items.wands.wand.self_target=You can't target yourself!
items.wands.wand.identify=You are now familiar enough with your wand to identify it.
items.wands.wand.resin_one=This wand has gained _1 level_ from arcane resin.
items.wands.wand.resin_many=This wand has gained _%d levels_ from arcane resin.
items.wands.wand.cursed=This wand is cursed, making its magic chaotic and random.
items.wands.wand.not_cursed=This wand is free of malevolent magic.
items.wands.wand.curse_discover=This %s is cursed!
items.wands.wand.prompt=Choose a location to zap
items.wands.wand.charges=This wand has charges: %d/%d.
items.wands.wand$placeholder.name=wand
items.wands.wandofblastwave.name=wand of blast wave
items.wands.wandofblastwave.staff_name=staff of blast wave
items.wands.wandofblastwave.ondeath=You killed yourself with your own Wand of Blast Wave...
items.wands.wandofblastwave.desc=This wand is made of a sort of marbled stone, with gold trim and a round black gem at the tip. It feels very weighty in your hand.
items.wands.wandofblastwave.typical_stats_desc=This wand shoots a bolt which violently detonates at a target location. The force of this blast typically deals _%1$d-%2$d damage_ and is strong enough to send most enemies flying.
items.wands.wandofblastwave.stats_desc=This wand shoots a bolt which violently detonates at a target location. The force of this blast deals _%1$d-%2$d damage_ and is strong enough to send most enemies flying.
items.wands.wandofblastwave.upgrade_stat_name_2=Knockback
items.wands.wandofblastwave.bmage_desc=When _the Battlemage_ strikes an enemy with a staff of blast wave, the enemy has a chance to be knocked back, as if the staff had an elastic enchantment.
items.wands.wandofblastwave.eleblast_desc=An elemental blast with a staff of blast wave deals 67% damage and knocks all enemies outside of the blast area.
items.wands.wandofcorrosion.name=wand of corrosion
items.wands.wandofcorrosion.staff_name=staff of corrosion
items.wands.wandofcorrosion.desc=This wand has an ashen body which opens to a brilliant orange gem.
items.wands.wandofcorrosion.stats_desc=This wand shoots a bolt which explodes into a cloud of highly corrosive gas at a targeted location. Anything caught inside this cloud will take increasing damage over time, starting at _%d damage._
items.wands.wandofcorrosion.upgrade_stat_name_1=Corrosion Damage
items.wands.wandofcorrosion.upgrade_stat_name_2=Gas Volume
items.wands.wandofcorrosion.bmage_desc=When _the Battlemage_ strikes an enemy with a staff of corrosion, the enemy has a chance to become oozed.
items.wands.wandofcorrosion.eleblast_desc=An elemental blast with a staff of corrosion inflicts enemies with 4 turns of corrosion, starting at 6 damage.
items.wands.wandofcorruption.name=wand of corruption
items.wands.wandofcorruption.staff_name=staff of corruption
items.wands.wandofcorruption.already_corrupted=That character cannot be influenced further.
items.wands.wandofcorruption.desc=This wand radiates chaotic dark energy, if that weren't already obvious from the small decorative skull shaped onto its tip.
items.wands.wandofcorruption.stats_desc=This wand will release a blast of corrupting energy which will debuff enemies and eventually bend them to your will. Enemies are able to resist the corruption, but weakened enemies are much easier to corrupt than healthy ones.
items.wands.wandofcorruption.upgrade_stat_name_1=Corrupting Power
items.wands.wandofcorruption.upgrade_stat_name_2=Debuff Duration
items.wands.wandofcorruption.bmage_desc=When _the Battlemage_ strikes an enemy with a staff of corruption, the enemy has a chance to become amoked.
items.wands.wandofcorruption.eleblast_desc=An elemental blast with a staff of corruption inflicts enemies with 5 turns of amok.
items.wands.wandofdisintegration.name=wand of disintegration
items.wands.wandofdisintegration.staff_name=staff of disintegration
items.wands.wandofdisintegration.desc=This wand is made from a solid smooth chunk of obsidian, with a deep purple light running up its side, ending at the tip. It glows with destructive energy, waiting to shoot forward.
items.wands.wandofdisintegration.stats_desc=This wand shoots a beam that pierces any obstacle, and will go farther the more it is upgraded. The beam deals _%1$d-%2$d damage,_ and will also deal bonus damage for each enemy and wall it penetrates.
items.wands.wandofdisintegration.upgrade_stat_name_2=Max Range
items.wands.wandofdisintegration.bmage_desc=When wielded by _the Battlemage_, a staff of disintegration has increased attack range, as if it had a projecting enchantment.
items.wands.wandofdisintegration.eleblast_desc=An elemental blast with a staff of disintegration deals 100% damage and pierces through walls.
items.wands.wandoffireblast.name=wand of fireblast
items.wands.wandoffireblast.staff_name=staff of fireblast
items.wands.wandoffireblast.desc=This wand is made from red-lacquered wood with golden leaf used liberally to make it look quite regal. It crackles and hisses at the tip, eager to unleash its powerful magic.
items.wands.wandoffireblast.stats_desc=This wand blasts out a cone of fire when used. Its next attack will consume _%1$d charges_ and deal _%2$d-%3$d damage._ The more charges the wand uses, the larger and stronger the effect.
items.wands.wandoffireblast.upgrade_stat_name_1=1 Charge Damage
items.wands.wandoffireblast.upgrade_stat_name_2=2 Charge Damage
items.wands.wandoffireblast.upgrade_stat_name_3=3 Charge Damage
items.wands.wandoffireblast.bmage_desc=When _the Battlemage_ strikes an enemy with a staff of fireblast, the enemy has a chance to burst into flames, as if the staff had a blazing enchantment.
items.wands.wandoffireblast.eleblast_desc=An elemental blast with a staff of fireblast deals 100% damage, bursts open doors, and sets enemies and terrain on fire.
items.wands.wandofearthblast.name=wand of avalanche
items.wands.wandofearthblast.staff_name=staff of avalanche
items.wands.wandofearthblast.desc=The artifact of ancient times, when everything was possible with crushing rocks.
items.wands.wandofearthblast.stats_desc=This wand produces a blast of extremely powerful earthquake when used, extending out into a cone shape. As this wand is upgraded it will consume more charges, the effect becomes significantly more powerful the more charges are consumed. Its next attack will consume _%1$d charges_ and deal _%2$d-%3$d damage._
items.wands.wandofearthblast.eleblast_desc=An elemental blast with a staff of avalanche deals 130% damage, destroys soft terrain like doors and grass, paralyses enemies and removes fire, frost and webs.
items.wands.wandofearthblast.bmage_desc=When _the Battlemage_ strikes an enemy with a staff of avalanche, the enemy has a chance to get stunned for a short time, making them unable to move and attack.
items.wands.wandoffrost.name=wand of frost
items.wands.wandoffrost.staff_name=staff of frost
items.wands.wandoffrost.desc=This wand seems to be made out of some kind of magical ice. It grows brighter towards its rounded tip. It feels very cold when held, but somehow your hand stays warm.
items.wands.wandoffrost.stats_desc=This wand shoots blasts of icy energy toward your foes, dealing _%1$d-%2$d damage_ and chilling. The effect seems stronger in water. Enemies that are already chilled or frozen take less damage from this wand.
items.wands.wandoffrost.upgrade_stat_name_2=Chill Duration
items.wands.wandoffrost.bmage_desc=When _the Battlemage_ strikes a chilled enemy with a staff of frost, they have a chance to instantly freeze. This chance becomes greater the more chilled they are.
items.wands.wandoffrost.eleblast_desc=An elemental blast with a staff of frost deals 100% damage, freezes enemies, and puts out fires.
items.wands.wandoflightning.name=wand of lightning
items.wands.wandoflightning.staff_name=staff of lightning
items.wands.wandoflightning.ondeath=You killed yourself with your own Wand of Lightning...
items.wands.wandoflightning.desc=This wand is made out of solid metal, making it surprisingly heavy. Two prongs curve together at the tip, and electricity arcs between them.
items.wands.wandoflightning.stats_desc=This wand sends powerful lightning arcing through whatever it is shot at, dealing _%1$d-%2$d damage._ This electricity will arc to nearby characters, and spreads more easily in water. The arcs from this wand can damage you, but won't hurt your allies.
items.wands.wandoflightning.bmage_desc=When _the Battlemage_ strikes an enemy with a staff of lightning, the staff has a chance to arc lightning to other nearby enemies, as if it had a shocking enchantment.
items.wands.wandoflightning.eleblast_desc=An elemental blast with a staff of lightning deals 100% damage, stuns enemies for 5 turns, and electrifies water.
items.wands.wandoflivingearth.name=wand of living earth
items.wands.wandoflivingearth.staff_name=staff of living earth
items.wands.wandoflivingearth.desc=This wand is made from a curious rock, with bands of glowing yellow energy. The rocks seem to shift slightly as you grip the wand, as if they can feel your hand.
items.wands.wandoflivingearth.stats_desc=This wand sends bolts of magical rock at enemies, dealing _%1$d-%2$d damage._ The rocks will then re-form around the user, granting them armor in proportion to the damage dealt. If enough armor is built, it will form into a rock guardian when the wand is next zapped.
items.wands.wandoflivingearth.upgrade_stat_name_2=Guardian Max HP
items.wands.wandoflivingearth.upgrade_stat_name_3=Guardian Blocking
items.wands.wandoflivingearth.bmage_desc=When _the Battlemage_ strikes an enemy with a staff of living earth, some of the damage dealt is returned as rock armor.
items.wands.wandoflivingearth.eleblast_desc=An elemental blast with a staff of living earth deals 50% damage, and heals an active earthen guardian for each enemy hit.
items.wands.wandoflivingearth$rockarmor.name=rock armor
items.wands.wandoflivingearth$rockarmor.desc=Magical rocks are surrounding your body, when you are attacked they will attempt to block for you, and will reduce the damage you take by 50%%. Each damage blocked scrapes away some of the rock however.\n\nRemaining Armor: %1$d.\n\nIf enough rock is built around you, the next zap from your wand of living earth will cause the rocks to form up into a guardian which will fight with you.\n\nArmor needed for Guardian: %2$d.
items.wands.wandoflivingearth$earthguardian.name=earthen guardian
items.wands.wandoflivingearth$earthguardian.desc=The rocks from your wand of living earth have formed into a protective earthen guardian! This rocky protector will attack nearby enemies, which will force them to attack the guardian instead of you. When all nearby threats are gone, the guardian will re-form around you, and will return when you next use your wand.
items.wands.wandoflivingearth$earthguardian.wand_info=The guardian's defensive power is tied to the level of your wand. It currently blocks _%1$d-%2$d damage._
items.wands.wandofmagicmissile.name=wand of magic missile
items.wands.wandofmagicmissile.staff_name=staff of magic missile
items.wands.wandofmagicmissile.desc=This fairly plain wand launches missiles of pure magical energy. While the wand itself lacks any special effects, it has more available charges and can briefly empower other wands when upgraded.
items.wands.wandofmagicmissile.stats_desc=Each bolt from this wand deals _%1$d-%2$d damage,_ and will briefly empower other wands if it is upgraded.
items.wands.wandofmagicmissile.bmage_desc=When _the Battlemage_ strikes an enemy with a staff of magic missile, all of his wands will gain charge in addition to his staff.
items.wands.wandofmagicmissile.eleblast_desc=An elemental blast with a staff of magic missile deals 50% damage, and grants the mage 15 turns of recharging.
items.wands.wandofmagicmissile$magiccharge.name=magic charge
items.wands.wandofmagicmissile$magiccharge.desc=Your wand of magic missile has fed power back into your wands, boosting the effective level of the next zap they make.\n\nYour wands are boosted to: +%d.\n\nTurns of magic charge remaining: %s.
items.wands.wandofprismaticlight.name=wand of prismatic light
items.wands.wandofprismaticlight.staff_name=staff of prismatic light
items.wands.wandofprismaticlight.desc=This wand is made of a solid piece of translucent crystal, like a long chunk of smooth glass. Small bits of colorful light dance around the tip of the wand, eager to burst forth.
items.wands.wandofprismaticlight.stats_desc=This wand shoots rays of light which cut through the darkness of the dungeon, revealing hidden areas and traps. The beam can blind enemies, and deals _%1$d-%2$d damage._ Demonic and undead foes will burn in the bright light of the wand, taking bonus damage.
items.wands.wandofprismaticlight.upgrade_stat_name_2=Blind Chance
items.wands.wandofprismaticlight.upgrade_stat_name_3=Light Duration
items.wands.wandofprismaticlight.bmage_desc=When _the Battlemage_ strikes an enemy with a staff of prismatic light, they will be crippled for a duration that scales with staff level.
items.wands.wandofprismaticlight.eleblast_desc=An elemental blast with a staff of prismatic light deals 67% damage, reveals all terrain in the blast, and blinds enemies for 5 turns.
items.wands.wandofunstable.name=wand of 
items.wands.wandofunstable.staff_name=staff of 
items.wands.wandofunstable.desc=This wand is made of antimatter. It sparkles with unsettling sparks, that explode into different elemental projectiles.
items.wands.wandofunstable.stats_desc=This wand imitates the random wand blasts with each usage.
items.wands.wandofunstable.bmage_desc=When _the Battlemage_ strikes an enemy with a staff of unstable, it will initiate random Battlemage effects.
items.wands.wandofunstable.eleblast_desc=An elemental blast with a staff of unstable uses blast effects from a random wand and makes it 50% stronger.
items.wands.wandoflifesteal.name=wand of lifesteal
items.wands.wandoflifesteal.staff_name=staff of lifesteal
items.wands.wandoflifesteal.desc=This wand is made of a solid piece titanium with a tendency to steal life from others. While this wand looks like different from the other wands, it can give you a slight advantage from the enemies you fight.
items.wands.wandoflifesteal.stats_desc=This wand shoots healing ray which heals you when fired at the enemies. The beam can steal life from enemies, and deals _%1$d-%2$d damage._
items.wands.wandoflifesteal.upgrade_stat_name_2=Max Range
items.wands.wandoflifesteal.bmage_desc=When _the Battlemage_ strikes an enemy with a staff of lifesteal, they will amok towards everyone for a duration that scales with staff level.
items.wands.wandoflifesteal.eleblast_desc=An elemental blast with a staff of lifesteal deals damage and steals some health.
items.wands.wandofregrowth.name=wand of regrowth
items.wands.wandofregrowth.staff_name=staff of regrowth
items.wands.wandofregrowth.desc=This wand is made from a thin shaft of expertly carved wood. Somehow it is still alive and vibrant, bright green like a young tree's core. "When life ceases new life always begins to grow... The eternal cycle always remains!"
items.wands.wandofregrowth.stats_desc=When used, this wand will blast magical regrowth energy outward in a cone, causing grass, roots, and rare plants to spring to life. Its next zap will consume _%1$d charges_. The more charges the wand uses, the larger and stronger the effect.
items.wands.wandofregrowth.degradation=After another _%d charges_ this wand will start failing to produce plants and fresh grass. This limit is increased by leveling up or upgrading the wand.
items.wands.wandofregrowth.upgrade_stat_name_1=Grass Per Charge
items.wands.wandofregrowth.upgrade_stat_name_2=Total Grass Limit
items.wands.wandofregrowth.bmage_desc=When _the Battlemage_ strikes an enemy with a staff of regrowth, and either are standing on grass, he will gain herbal healing in proportion with the damage dealt.
items.wands.wandofregrowth.eleblast_desc=An elemental blast with a staff of regrowth roots enemies and grows grass randomly over the blasts area.
items.wands.wandofregrowth$dewcatcher.name=Dewcatcher
items.wands.wandofregrowth$dewcatcher.desc=Dewcatchers are wondrous plants that fill themselves with magical dew. They attempt to camouflage as grass to avoid attention, but their bulges of collected dew give them away.
items.wands.wandofregrowth$seedpod.name=Seed Pod
items.wands.wandofregrowth$seedpod.desc=Seed Pods are magical plants that produce seeds from other plant types, rather than any seeds of their own. They somehow manage to spread despite having no seed of their own.
items.wands.wandofregrowth$lotus.name=Golden Lotus
items.wands.wandofregrowth$lotus.desc=The golden lotus is a mystical plant that can only be conjured by a powerful wand of regrowth. Its aura enhances all plants and plant effects, but it burns through its energy and dies after a short time.
items.wands.wandofregrowth$lotus.wand_info=This lotus was produced by a _+%1$d_ wand of regrowth. All plants in its effect will _instantly trigger_ if they are planted on a character. Plants will also have a _%2$d%% chance_ to drop their seed, and tipped darts will use _%3$d%% less durability_.
items.wands.wandoftransfusion.name=wand of transfusion
items.wands.wandoftransfusion.staff_name=staff of transfusion
items.wands.wandoftransfusion.ondeath=You killed yourself with your own Wand of Transfusion...
items.wands.wandoftransfusion.charged=Your staff is charged with the life energy of your enemy!
items.wands.wandoftransfusion.desc=A fairly plainly shaped wand, it stands out due to its magenta hue and pitch black gem at the tip.
items.wands.wandoftransfusion.stats_desc=When used on allies or charmed enemies, this wand will sap _%1$d of the user's health_ to heal or shield the ally for _%2$d health._ When used on enemies, the wand briefly charms them while applying _%3$d shielding_ to the user. Hostile undead will take _%4$d-%5$d damage_ instead of being charmed.
items.wands.wandoftransfusion.upgrade_stat_name_1=Ally Healing
items.wands.wandoftransfusion.upgrade_stat_name_2=Self-Shielding
items.wands.wandoftransfusion.upgrade_stat_name_3=Undead Damage
items.wands.wandoftransfusion.bmage_desc=When _the Battlemage_ strikes a charmed enemy with a staff of transfusion, he will gain shielding and his next zap with the staff will not cost any health.
items.wands.wandoftransfusion.eleblast_desc=An elemental blast with a staff of transfusion charms enemies, heals allies, and deals 100% damage to undead enemies.
items.wands.wandofwarding.name=wand of warding
items.wands.wandofwarding.staff_name=staff of warding
items.wands.wandofwarding.no_more_wards=Your wand can't sustain any more wards.
items.wands.wandofwarding.bad_location=You can't place a ward there.
items.wands.wandofwarding.desc=This short metal wand has a bright purple gem floating above its tip.
items.wands.wandofwarding.stats_desc=Rather than directly damaging an enemy, this wand will summon stationary wards and sentries. Wards can be summoned anywhere, even through walls if you have vision. This wand can sustain _%d energy_ worth of wards at a time.
items.wands.wandofwarding.upgrade_stat_name_1=Ward Damage
items.wands.wandofwarding.upgrade_stat_name_2=Ward Energy
items.wands.wandofwarding.bmage_desc=When _the Battlemage_ strikes an enemy with a staff of warding, all active sentries have a chance to be healed.
items.wands.wandofwarding.eleblast_desc=An elemental blast with a staff of warding heals all sentries in the blast area.
items.wands.wandofwarding$ward.desc_generic_ward=This ward will automatically zap any enemy which comes into its range of vision.\n\nZapping this ward with your wand of warding will upgrade it.\n\nWards have a limited number of zaps before dissipating.
items.wands.wandofwarding$ward.desc_generic_sentry=This sentry has the same firepower as a ward, but has health instead of a set number of charges. It resembles the gem at the tip of your wand of warding.\n\nZapping this sentry with your wand of warding will upgrade and heal it.\n\nThis sentry will spend some health each time it zaps an enemy, but can be healed by using your wand of warding on it.
items.wands.wandofwarding$ward.name_1=lesser ward
items.wands.wandofwarding$ward.desc_1=This basic ward will automatically zap any enemy which comes into its range of vision, dealing _%1$d-%2$d damage._\n\nZapping this ward with your wand of warding will upgrade it.\n\nThis ward will only zap a single time before dissipating.\n\nYour wand of warding is using _%3$d energy_ to sustain this ward.
items.wands.wandofwarding$ward.name_2=ward
items.wands.wandofwarding$ward.desc_2=This upgraded ward has a more intricate pattern, and can attack multiple times. Each zap from this ward will deal _%1$d-%2$d damage._\n\nZapping this ward with your wand of warding will upgrade it.\n\nThis ward will zap three times before dissipating.\n\nYour wand of warding is using _%3$d energy_ to sustain this ward.
items.wands.wandofwarding$ward.name_3=greater ward
items.wands.wandofwarding$ward.desc_3=This fully upgraded ward is able to attack more times than its predecessors. Each zap from this ward will deal _%1$d-%2$d damage._\n\nZapping this ward with your wand of warding will upgrade it.\n\nThis ward will zap five times before dissipating.\n\nYour wand of warding is using _%3$d energy_ to sustain this ward.
items.wands.wandofwarding$ward.name_4=lesser sentry
items.wands.wandofwarding$ward.desc_4=This smaller sentry has the same firepower as a greater ward, but has health instead of a set number of charges. It resembles the gem at the tip of your wand of warding. Each zap from this sentry will deal _%1$d-%2$d damage._\n\nZapping this sentry with your wand of warding will upgrade and heal it.\n\nThis sentry will spend some health each time it zaps an enemy, but can be healed by using your wand of warding on it.\n\nYour wand of warding is using _%3$d energy_ to sustain this sentry.
items.wands.wandofwarding$ward.name_5=sentry
items.wands.wandofwarding$ward.desc_5=This upgraded sentry is larger and more durable than a lesser sentry. Each zap from this sentry will deal _%1$d-%2$d damage._\n\nZapping this sentry with your wand of warding will upgrade and heal it.\n\nThis sentry will spend some health each time it zaps an enemy, but can be healed by using your wand of warding on it.\n\nYour wand of warding is using _%3$d energy_ to sustain this sentry.
items.wands.wandofwarding$ward.name_6=greater sentry
items.wands.wandofwarding$ward.desc_6=This fully upgraded sentry is significantly more durable than its predecessors. Each zap from this sentry will deal _%1$d-%2$d damage._\n\nZapping this sentry with your wand of warding will heal it.\n\nThis sentry will spend some health each time it zaps an enemy, but can be healed by using your wand of warding on it.\n\nYour wand of warding is using _%3$d energy_ to sustain this sentry.
items.wands.wandofwarding$ward.dismiss_title=Dismiss this ward?
items.wands.wandofwarding$ward.dismiss_body=You can dispel this ward if you no longer want your wand to maintain it. Doing so immediately destroys the ward.\n\nDismiss this ward?
items.wands.wandofwarding$ward.dismiss_confirm=yes
items.wands.wandofwarding$ward.dismiss_cancel=no
items.wands.wandofteleportation.name=wand of teleportation
items.wands.wandofteleportation.staff_name=staff of teleportation
items.wands.wandofteleportation.desc=This wand is made of quartz, with onyx around it. It shines within the light, shooting it somewhere will result like blinking eye, everywhere you want.
items.wands.wandofteleportation.stats_desc=This wand teleports you to the bolt's location.
items.wands.wandofteleportation.bmage_desc=When _the Battlemage_ strikes an enemy with a staff of teleportation, you will be teleported to bolt's position.
items.wands.wandofteleportation.eleblast_desc=An elemental blast with a staff of teleportation will teleport you in your desired position.
items.wands.wandofterraforming.name=wand of terraforming
items.wands.wandofterraforming.staff_name=staff of terraforming
items.wands.wandofterraforming.ac_change_terrain=CHANGE TERRAIN
items.wands.wandofterraforming.no_valid_cell=You can't point it somewhere invalid.
items.wands.wandofterraforming.reshaped=The terrain reshapes on the target.
items.wands.wandofterraforming.desc=This short metal wand has a bright yellow gem floating above its tip.
items.wands.wandofterraforming.stats_desc=Rather than directly damaging an enemy, this wand will change your terrain according to your choice, you can select variety of them and use them on strategizing your moves against you enemy.
items.wands.wandofterraforming.bmage_desc=When _the Battlemage_ strikes an enemy with a staff of terraforming, unfortunately it does nothing.
items.wands.wandofterraforming.eleblast_desc=An elemental blast with a staff of terraforming does nothing.
items.wands.wandofterraforming.terrain_changed=Terrain selected.
items.weapon.curses.annoying.name=annoying %s
items.weapon.curses.annoying.msg_1=OOH, ARE WE FIGHTING SOMETHING!?
items.weapon.curses.annoying.msg_2=YEAH, GET THEM!
items.weapon.curses.annoying.msg_3=HEY, LISTEN!
items.weapon.curses.annoying.msg_4=ARE WE AT THE BOSS YET!?
items.weapon.curses.annoying.msg_5=OUCH, DON'T SWING ME SO HARD!
items.weapon.curses.annoying.msg_6=DIE, INSECT!
items.weapon.curses.annoying.msg_7=WHEEEEEEEEEEEEEEE!
items.weapon.curses.annoying.msg_8=CAN WE TAKE A BREAK!?
items.weapon.curses.annoying.msg_9=POW, HAHA!
items.weapon.curses.annoying.msg_10=WELL STRUCK!
items.weapon.curses.annoying.msg_11=I didn't want to be a weapon, I wanted to be a lumberjack's axe.
items.weapon.curses.annoying.msg_12=Remember, overconfidence is a slow and insidious killer.
items.weapon.curses.annoying.msg_13=ALL YOUR BASE ARE BELONG TO US!
items.weapon.curses.annoying.desc=Annoying weapons are capable of speech, but they're a bit too energetic. They will often draw attention to you without meaning to.
items.weapon.curses.annoying.elestrike_desc=An elemental strike with an annoying curse has a 20% chance to amok each enemy in range for 6 turns.
items.weapon.curses.dazzling.name=dazzling %s
items.weapon.curses.dazzling.desc=Dazzling weapons will sometimes flash with dazzling light, blinding everything that can see them.
items.weapon.curses.dazzling.elestrike_desc=An elemental strike with a dazzling curse has a 50% chance to blind each enemy in range for 6 turns.
items.weapon.curses.displacing.name=displacing %s
items.weapon.curses.displacing.desc=Displacing weapons are infused with chaotic teleportation magic, possessing the ability to warp enemies around the floor randomly.
items.weapon.curses.displacing.elestrike_desc=An elemental strike with a displacing curse has a 50% chance to teleport each enemy in range.
items.weapon.curses.explosive.name=explosive %s
items.weapon.curses.explosive.warm=Warm...
items.weapon.curses.explosive.hot=Hot!
items.weapon.curses.explosive.desc=Explosive weapons steadily build up power and explode, damaging anything nearby.
items.weapon.curses.explosive.desc_cool=Your weapon is currently cool to the touch.
items.weapon.curses.explosive.desc_warm=Your weapon is building energy and getting warm...
items.weapon.curses.explosive.desc_hot=Your weapon is hot! It's about to explode!
items.weapon.curses.explosive.elestrike_desc=An elemental strike with an explosive curse has a 50% chance to cause an explosion to appear on a random enemy in range.
items.weapon.curses.friendly.name=friendly %s
items.weapon.curses.friendly.desc=Friendly weapons are best suited for pacifists, occasionally triggering magic that makes it impossible to fight.
items.weapon.curses.friendly.elestrike_desc=An elemental strike with a friendly curse has a 50% chance to charm each enemy in range for 6 turns.
items.weapon.curses.polarized.name=polarized %s
items.weapon.curses.polarized.desc=A polarized weapon is affected by magic that causes its attack to either deal 50% more damage, or no damage at all.
items.weapon.curses.polarized.elestrike_desc=An elemental strike with a polarized curse has a 50% chance to deal 24-36 damage to each enemy in range.
items.weapon.curses.sacrificial.name=sacrificial %s
items.weapon.curses.sacrificial.desc=Sacrificial weapons will demand blood from the wearer in return for attacking foes. The more healthy the wearer is, the more blood the curse will take.
items.weapon.curses.sacrificial.elestrike_desc=An elemental strike with a sacrificial curse causes the hero and each enemy in range to bleed for 12 HP.
items.weapon.curses.wayward.name=wayward %s
items.weapon.curses.wayward.desc=Wayward weapons will sometimes become extremely inaccurate. This magic lasts for a little while when it activates, but can be dispelled by landing a blow with the wayward weapon.
items.weapon.curses.wayward.elestrike_desc=An elemental strike with a wayward curse has a 50% chance to hex each enemy in range for 6 turns.
items.weapon.curses.wayward$waywardbuff.name=wayward
items.weapon.curses.wayward$waywardbuff.desc=Your wayward weapon's magic has activated, making it extremely inaccurate for a short time. Note that this does not affect attacks which are guaranteed to hit, such as surprise attacks. Successfully attacking with the wayward weapon will clear this effect immediately.\n\nTurns remaining: %s.
items.weapon.curses.warmaster.name=warmaster %s
items.weapon.curses.warmaster.desc=warmaster weapons will sometimes summons an arena. This magic lasts for a little while when it activates, and you can't escape within the arena and leaving will result to take ~30% of your HP, hitting enemies will reduce the time waiting for the arena to dissipate or add 1 turn instead. While under the arena, you can't be grappled or teleported anywhere beside your enemy.
items.weapon.curses.warmaster.elestrike_desc=An elemental strike with a warmaster curse summons an arena instantly.
items.weapon.curses.warmaster$warmasterbuff.name=warmaster
items.weapon.curses.warmaster$warmasterbuff.desc=Your warmaster weapon's magic has activated, forcing you to battle with enemies. Leaving the arena will cause you to be damaged.\n\nTurns remaining: %s.
items.weapon.enchantments.blazing.name=blazing %s
items.weapon.enchantments.blazing.desc=This enchantment causes flames to spit forth from a weapon, igniting enemies and dealing bonus damage to enemies that are already aflame.
items.weapon.enchantments.blazing.elestrike_desc=An elemental strike with a blazing enchantment spreads fire to every tile in range, which lasts 8 turns.
items.weapon.enchantments.blocking.name=blocking %s
items.weapon.enchantments.blocking.desc=Blocking weapons have a chance to briefly shield you after attacking with them.
items.weapon.enchantments.blocking.elestrike_desc=An elemental strike with a blocking enchantment grants the Duelist an extra 6 shielding for each enemy in range.
items.weapon.enchantments.blocking$blockbuff.name=blocking
items.weapon.enchantments.blocking$blockbuff.desc=Your weapon's blocking enchantment has granted you a brief boost to your defensive power!\n\nShielding remaining: %d\n\nTurns remaining: %s.
items.weapon.enchantments.blooming.name=blooming %s
items.weapon.enchantments.blooming.desc=Blooming weapons contain magic which will cause vegetation to sprout on or around those struck by them.
items.weapon.enchantments.blooming.elestrike_desc=An elemental strike with a blooming enchantment spreads grass to up to 8 tiles in range, and roots all enemies in range for 6 turns.
items.weapon.enchantments.chilling.name=chilling %s
items.weapon.enchantments.chilling.desc=Enemies struck with this enchantment are chilled, slowing their movement and attacks.
items.weapon.enchantments.chilling.elestrike_desc=An elemental strike with a chilling enchantment spreads chilling air to every tile in range, which lasts 8 turns.
items.weapon.enchantments.kinetic.name=kinetic %s
items.weapon.enchantments.kinetic.desc=When an enemy is killed with a kinetic weapon, any excess force is stored in the weapon and will be applied to the next successful attack.
items.weapon.enchantments.kinetic.elestrike_desc=An elemental strike with a kinetic enchantment applies 40% of stored damage to each enemy in range, except the primary target.
items.weapon.enchantments.kinetic$conserveddamage.name=conserved damage
items.weapon.enchantments.kinetic$conserveddamage.desc=Your weapon has stored the excess force from a previous killing blow, and will apply it as bonus damage to your next attack. The energy will slowly fade over time, however.\n\nConserved Damage: %d.
items.weapon.enchantments.corrupting.name=corrupting %s
items.weapon.enchantments.corrupting.desc=This powerful enchantment possesses the ability to turn enemies to your will. When an enemy is killed with this weapon, there is a chance they will become corrupted instead of dying.
items.weapon.enchantments.corrupting.elestrike_desc=An elemental strike with a corrupting enchantment has a 5-25% chance (based on missing HP) to corrupt each enemy in range, except the primary target.
items.weapon.enchantments.elastic.name=elastic %s
items.weapon.enchantments.elastic.desc=Elastic weapons have a chance to send enemies flying back short distances.
items.weapon.enchantments.elastic.elestrike_desc=An elemental strike with an elastic enchantment knocks all enemies in range back 5 tiles.
items.weapon.enchantments.grim.name=grim %s
items.weapon.enchantments.grim.desc=This powerful enchantment possesses the power to significantly injure an enemy. The effect is more likely to occur and is more poweful the weaker the enemy is.
items.weapon.enchantments.grim.elestrike_desc=An elemental strike with a grim enchantment has a 6-30% chance (based on missing HP) to kill each enemy in range, except the primary target.
items.weapon.enchantments.lucky.name=lucky %s
items.weapon.enchantments.lucky.desc=Enemies which are killed by a lucky weapon have a chance to drop extra loot.
items.weapon.enchantments.lucky.elestrike_desc=An elemental strike with a lucky enchantment has a 12.5% chance to spawn loot under each enemy in range. This effect can only trigger once per enemy.
items.weapon.enchantments.projecting.name=projecting %s
items.weapon.enchantments.projecting.desc=With this enchantment melee weapons will gain extra reach. Ranged weapons will be able to penetrate nearby walls.
items.weapon.enchantments.projecting.elestrike_desc=An elemental strike with a projecting enchantment deals 30% damage to each enemy in range, except the primary target.
items.weapon.enchantments.shocking.name=shocking %s
items.weapon.enchantments.shocking.desc=Electricity arcs from a shocking weapon, dealing extra damage to all nearby enemies.
items.weapon.enchantments.shocking.elestrike_desc=An elemental strike with a shocking enchantment spreads electricity to every tile in range, which lasts 8 turns.
items.weapon.enchantments.unstable.name=unstable %s
items.weapon.enchantments.unstable.desc=This enchantment radiates chaotic energy, acting as a different enchantment with each hit.
items.weapon.enchantments.unstable.elestrike_desc=An elemental strike with an unstable enchantment applies a random enchantment effect to each enemy in range, except the primary target.
items.weapon.enchantments.vampiric.name=vampiric %s
items.weapon.enchantments.vampiric.desc=This powerful enchantment leeches life force from enemies with each blow, funneling it back into the wearer. The effect is stronger the lower the wearer's health.
items.weapon.enchantments.vampiric.elestrike_desc=An elemental strike with a vampiric enchantment heals the Duelist for 2.5 HP for each enemy in range.
items.weapon.enchantments.galactic.name=galactic %s
items.weapon.enchantments.galactic.desc=Galactic weapon has several additional enchantments attached to it!
items.weapon.enchantments.galactic.elestrike_desc=An elemental strike with a galactic enchantment has a several additional enchantments attached to it.
items.weapon.enchantments.trihit.name=trihit %s
items.weapon.enchantments.trihit.desc=Trihit weapon has two additional hitmarks on hit!
items.weapon.enchantments.trihit.elestrike_desc=An elemental strike with a trihit enchantment will hit mobs in a cone aoe.
items.weapon.enchantments.laserised.name=laserised %s
items.weapon.enchantments.laserised.desc=Laserised weapon fires laser while hitting an enemy!
items.weapon.enchantments.laserised.elestrike_desc=An elemental strike with a laserised enchantment will laser enemies and damage them based on your weapon's level.
items.weapon.enchantments.summoner.name=summoner %s
items.weapon.enchantments.summoner.desc=Summoner weapon summons a guardian that will help you throughout the battle!
items.weapon.enchantments.summoner.elestrike_desc=An elemental strike with a summoner enchantment will give you a double experience buff, and an additional chance to spawn a knight in every affected cell.
items.weapon.enchantments.summoner$alephknight.name=aleph knight
items.weapon.enchantments.summoner$alephknight.desc=This white apparition seems to be a summoned echo of one of the dungeon's stone guardians.\n\nWhile the statue itself is almost incorporeal and has slight increased toughness, the _%s,_ it's wielding, looks real.
items.weapon.enchantments.scorching.name=scorching %s
items.weapon.enchantments.scorching.desc=Scorching weapon deals additional damage when the attacker deals more than 7% of their enemies' max HP!
items.weapon.enchantments.scorching.elestrike_desc=An elemental strike with a scorching enchantment will deal additional damage when the attacker deals more than 7% of their enemies' max HP in a cone AOE.
items.weapon.enchantments.racked.name=racked %s
items.weapon.enchantments.racked.desc=Racked weapon deals massive damage when hitting enemies 15 times!
items.weapon.enchantments.racked.elestrike_desc=An elemental strike with a racked enchantment will deal massive damage when hitting enemies 15 times, it collects stacks but doesn't damage those enemies affected in a cone AOE unless the stack reaches more than 15.
items.weapon.enchantments.racked$rackedenchantmentcooldown.name=Racked Enchantment Cooldown
items.weapon.enchantments.racked$rackedenchantmentcooldown.desc=You have recently used this enchantment's ability, and must wait before using it again.\n\nTurns remaining: %s.
items.weapon.enchantments.racked$stacktracker.name=Racked Stacks
items.weapon.enchantments.racked$stacktracker.desc=You have built stacks throughout your run however, you need to maintain those stacks as they are not permanently kept, reaching a certain stack will deal enormous damage in the next attack.\n\nCurrent Stack: _%s stacks_\nTurns remaining until a stack decays: _%s turns_
items.weapon.enchantments.sharpened.name=sharpened %s
items.weapon.enchantments.sharpened.desc=Enemies hit with the sharpened enchantment has a chance to be inflicted a bleeding debuff.
items.weapon.enchantments.sharpened.elestrike_desc=An elemental strike with a sharpened enchantment will inflict bleeding to all enemies proportional to their health in a cone AOE.
items.weapon.enchantments.interfered.name=interfered %s
items.weapon.enchantments.interfered.desc=Enemies hit with the interfered enchantment has a chance to be inflicted by an additional elemental damages that scales within the weapon's level (max 100% of weapon's inflicted damage).
items.weapon.enchantments.interfered.elestrike_desc=An elemental strike with an interfered enchantment has a chance to be inflicted by an additional elemental damages to all enemies that scales within the weapon's level (max 110% of weapon's inflicted damage).
items.weapon.melee.blacksmith.firingsnapper.name=firing snapper
items.weapon.melee.blacksmith.firingsnapper.stats_desc=This weapon is not as fast as regular whip, but is able to target any enemy as long as there is a clear path to it with no solid obstacles. When used, the Firing Snapper will explode every hostile creature on its way with blazing magic, making it and its neighbors take damage.
items.weapon.melee.blacksmith.firingsnapper.ability_name=help from hell
items.weapon.melee.blacksmith.firingsnapper.ability_desc=The Duelist can cast for _help from hell_ with Firing Snapper to surround themselves with blazing circle of fire, with chance of temporary demonic minions to appear to help in a fight; the hero will be immune to fire while circle is present. This ability costs 2 charges.
items.weapon.melee.blacksmith.firingsnapper.desc=This thorny and warm weapon is imbued with a blazing wrath of orange mine crystals, ready to surround everything on its path with smokes and fire of underworld.
items.weapon.melee.blacksmith.starlightsmasher.name=starlight smasher
items.weapon.melee.blacksmith.starlightsmasher.charging=Charged!
items.weapon.melee.blacksmith.starlightsmasher.ability_name=celestial flashbang
items.weapon.melee.blacksmith.starlightsmasher.ability_desc=The Duelist can cast a _celestial flashbang_ with Starlight Smasher, which will create 7x7 energized aura to blind and cripple every hostile creature in it; if hammer is charged with starlight energy, the enemies in aura will also be damaged for 25% damage. This ability costs 2 charges and uses up starlight energy if there was any.
items.weapon.melee.blacksmith.starlightsmasher.stats_desc=This is a pretty accurate weapon.\nThis weapon deals astronomical crushing damage, but disorientates both attacker and victim.\nStriking enemies with Starlight Smasher imbues it with powerful starlight energy. While this weapon is charged with such energy, throwing it at any enemy will strike 3x3 area with concentrated magical bolts from above, that deal 85% damage and inflict brief Blindness.
items.weapon.melee.blacksmith.starlightsmasher.desc=The crushing and skull-smashing blow of this towering mass of starlight-imbued crystals and refined steel can charge up energy to allow this weapon to be thrown like a shooting star to strike down enemies with astral magic.
items.weapon.melee.blacksmith.regrowingslasher.name=regrowing slasher
items.weapon.melee.blacksmith.regrowingslasher.stats_desc=This weapon blocks 0-4 damage.\nThis weapon will heal its user and all their allies by 0.8% of their max HP each strike. Once user or any ally are at full health, user is given 3.3% of their max HP in barkskin armor, the fading speed of which depends on amount of user's allies.\nWith small chance that grows with amount of allies weapon's user has, the user will be affected with random positive plant effect and the target will be affected with random negative plant effect.
items.weapon.melee.blacksmith.regrowingslasher.ability_name=herbal sacrifice
items.weapon.melee.blacksmith.regrowingslasher.ability_desc=The Duelist can cast a _herbal sacrifice_ with Regrowing Slasher to transform all visible allies into regrowth spirits, a powerful variants of wraiths that are immune to environment and magical damage and can survive 2 physical hits before dying; each transformed ally will heal the user for 10% of their HP. This ability costs 2 charges.
items.weapon.melee.blacksmith.regrowingslasher$regrowthspirit.name=regrowth spirit
items.weapon.melee.blacksmith.regrowingslasher$regrowthspirit.desc=Regrowth spirits are spirits tied to nature, empowered by sacrifice done to summon them. Their attack stats are stronger than wraith's, and they can ignore environmental and magical damage, while being able to survive up to 2 physical hits.
items.weapon.melee.blacksmith.regrowingslasher.desc=This slender light sword made with plant-energized crystals with a large steel guard above the handle is pouring healing and regrowth magic out of its blade.
items.weapon.melee.blacksmith.gleamingstaff.name=gleaming staff
items.weapon.melee.blacksmith.gleamingstaff.stats_desc=This weapon blocks 0-%d damage. This blocking scales with upgrades.\nThe damage of this quarterstaff leaves a lot to be desired, but it can materialize treasure bags from hitting enemies %d times.
items.weapon.melee.blacksmith.gleamingstaff.ability_name=avaritia's energy
items.weapon.melee.blacksmith.gleamingstaff.ability_desc=The Duelist can trigger _avaritia's energy_ with Gleaming Staff. This effect will stun the user for the time required to do 10 attacks, make them take triple damage, but staff's defense power is doubled and each physical hit from an enemy will grant Big Lucky Bags to user with 50% chance. This ability costs 2 charges.
items.weapon.melee.blacksmith.gleamingstaff.desc=A staff of quality gold-plated hardwood, its ends are shod with refined steel. Its hardness and durability make it a decent source of protection, while its golden properties can conjure the power of gambling.
items.weapon.melee.blacksmith.gleamingstaff$guardtracker.name=avaritia's energy
items.weapon.melee.blacksmith.gleamingstaff$guardtracker.desc=The greed gods are upon you, but they don't give any mercy...\n\nAny damage taken is tripled, but taking physical damage has 50% chance to give Big Lucky Bag.
items.weapon.melee.blacksmith.fantasmalstabber.name=fantasmal stabber
items.weapon.melee.blacksmith.fantasmalstabber.ability_name=super-sneak
items.weapon.melee.blacksmith.fantasmalstabber.ability_desc=The Duelist can _super-sneak_ while wielding Fantasmal Stabber. This ability lets the Duelist instantly blink up to 10 tiles away and grants her 1 turn of invisibility, which increases the efficiency of assassin perk, but costs 2 charges.
items.weapon.melee.blacksmith.fantasmalstabber.stats_desc=This weapon is stronger against unaware enemies.\nThis weapon proves you to be Assassin.\nThis weapon can attack incredibly quickly and pierce through enemy's armor.\nThis weapon slightly charges hero's artifacts and wands on each stab.
items.weapon.melee.blacksmith.fantasmalstabber.desc=A small, extra sharpened dagger with refined steel handle and magically-attuned wooden handle, that allows its wielder to stab very quickly through any foe they desire and empower their magic weapons while doing so.
items.weapon.melee.assassinsblade.name=assassin's blade
items.weapon.melee.assassinsblade.stats_desc=This weapon is stronger against unaware enemies.
items.weapon.melee.assassinsblade.ability_name=sneak
items.weapon.melee.assassinsblade.typical_ability_desc=The Duelist can _sneak_ while wielding an assassin's blade. This ability lets the Duelist instantly blink up to 3 tiles away and typically grants her _%d turns of invisibility._
items.weapon.melee.assassinsblade.ability_desc=The Duelist can _sneak_ while wielding an assassin's blade. This ability lets the Duelist instantly blink up to 3 tiles away and grants her _%d turns of invisibility._
items.weapon.melee.assassinsblade.upgrade_ability_stat_name=Ability Duration
items.weapon.melee.assassinsblade.desc=A small wavy blade made of obsidian, difficult to use despite being lightweight, but deadly if it finds the right mark.
items.weapon.melee.battleaxe.name=battle axe
items.weapon.melee.battleaxe.stats_desc=This is a rather accurate weapon.
items.weapon.melee.battleaxe.ability_name=heavy blow
items.weapon.melee.battleaxe.typical_ability_desc=The Duelist can perform a _heavy blow_ with a battle axe. This concentrated attack typically deals _%1$d-%2$d damage_ if it surprised the enemy, and dazes them for 5 turns which reduces accuracy and evasion by 50%%. Heavy blow always hits but deals regular damage if it does not surprise the enemy.
items.weapon.melee.battleaxe.ability_desc=The Duelist can perform a _heavy blow_ with a battle axe. This concentrated attack deals _%1$d-%2$d damage_ if it surprised the enemy, and dazes them for 5 turns which reduces accuracy and evasion by 50%%. Heavy blow always hits but deals regular damage if it does not surprise the enemy.
items.weapon.melee.battleaxe.desc=The enormous steel head of this battle axe puts considerable heft behind each wide stroke.
items.weapon.melee.crossbow.name=crossbow
items.weapon.melee.crossbow.stats_desc=This weapon enhances the damage of thrown darts when equipped, and will even grant its enchantment to them.
items.weapon.melee.crossbow.ability_name=charged shot
items.weapon.melee.crossbow.typical_ability_desc=The Duelist can _charge_ her crossbow, causing her next regular attack with it to always hit and apply one of three effects: melee attacks will knock enemies away, untipped darts will typically deal _+%1$d damage_, and tipped darts will apply their effect in a 7x7 area and typically last for _%2$d more uses_.
items.weapon.melee.crossbow.ability_desc=The Duelist can _charge_ her crossbow, causing her next regular attack with it to always hit and apply one of three effects: melee attacks will knock enemies away, untipped darts will deal _+%1$d damage_, and tipped darts will apply their effect in a 7x7 area and last for _%2$d more uses_.
items.weapon.melee.crossbow.desc=A fairly intricate weapon which shoots bolts at exceptional speeds. While it isn't designed for it, this crossbow's heft and sturdy construction make it a decent melee weapon as well.
items.weapon.melee.crossbow.upgrade_ability_stat_name=Ability Boost
items.weapon.melee.crossbow$chargedshot.name=charged
items.weapon.melee.crossbow$chargedshot.desc=The Duelist is focusing power into her crossbow. The next attack she makes with it will always hit and apply one of three effects:\n- Melee attacks will knock enemies a few tiles away.\n- Untipped darts will deal bonus damage.\n- Tipped darts will gain extra uses and apply their effect in a 7x7 area. Positive dart effects will only affect allies, and harmful effects will only apply to enemies. The Duelist cannot use this ability to apply positive dart effects to herself.
items.weapon.melee.dagger.name=dagger
items.weapon.melee.dagger.stats_desc=This weapon is stronger against unaware enemies.
items.weapon.melee.dagger.ability_name=sneak
items.weapon.melee.dagger.typical_ability_desc=The Duelist can _sneak_ while wielding a dagger. This ability lets the Duelist instantly blink up to 5 tiles away and typically grants her _%d turns of invisibility._
items.weapon.melee.dagger.ability_desc=The Duelist can _sneak_ while wielding a dagger. This ability lets the Duelist instantly blink up to 5 tiles away and grants her _%d turns of invisibility._
items.weapon.melee.dagger.upgrade_ability_stat_name=Ability Duration
items.weapon.melee.dagger.desc=A simple iron dagger with a worn wooden handle.
items.weapon.melee.dirk.name=dirk
items.weapon.melee.dirk.ability_name=sneak
items.weapon.melee.dirk.stats_desc=This weapon is stronger against unaware enemies.\nThis weapon proves you to be Assassin.
items.weapon.melee.dirk.typical_ability_desc=The Duelist can _sneak_ while wielding a dirk. This ability lets the Duelist instantly blink up to 4 tiles away and typically grants her _%d turns of invisibility,_ which increases the efficiency of assassin perk.
items.weapon.melee.dirk.ability_desc=The Duelist can _sneak_ while wielding a dirk. This ability lets the Duelist instantly blink up to 4 tiles away and grants her _%d turns of invisibility,_ which increases the efficiency of assassin perk.
items.weapon.melee.dirk.upgrade_ability_stat_name=Ability Duration
items.weapon.melee.dirk.desc=A longer thrusting dagger, gives a bit more steel to plunge into foes.
items.weapon.melee.flail.name=flail
items.weapon.melee.flail.stats_desc=This is a rather inaccurate weapon.\nThis weapon cannot surprise attack.
items.weapon.melee.flail.ability_name=spin
items.weapon.melee.flail.spin_warn=You can't spin the flail any more.
items.weapon.melee.flail.typical_ability_desc=The Duelist can _spin_ a flail to build up power for a short time. Each turn the flail is spun it will typically deal _+%d damage_ on its next regular attack, to a max of 3 times. A spinning flail is also guaranteed to hit. Only starting to spin the flail costs a charge.
items.weapon.melee.flail.ability_desc=The Duelist can _spin_ a flail to build up power for a short time. Each turn the flail is spun it will deal _+%d damage_ on its next regular attack, to a max of 3 times. A spinning flail is also guaranteed to hit. Only starting to spin the flail costs a charge.
items.weapon.melee.flail.desc=A spiked ball attached to a handle by a length of chain. Very unwieldy, but devastating if it lands a solid hit.
items.weapon.melee.flail$spinabilitytracker.name=spinning
items.weapon.melee.flail$spinabilitytracker.desc=The Duelist is spinning her flail, building damage for her next regular attack with it. Each spin takes one turn but increases damage, to a max of three spins. The flail is also guaranteed to hit while spinning.\n\nCurrent spins: %1$d%%.\nTurns remaining: %2$s.
items.weapon.melee.gauntlet.name=stone gauntlet
items.weapon.melee.gauntlet.ability_name=god's lightning
items.weapon.melee.gauntlet.ability_desc=The Duelist can cast a _god's lightning_ with a stone gauntlet. This attack will strike enemies for _%1$d-%2$d_ damage in a large radius with lightnings and stun them in space and time for short period of time.
items.weapon.melee.gauntlet.typical_ability_desc=The Duelist can cast a _god's lightning_ with a stone gauntlet. This attack will typically strike enemies for _%1$d-%2$d_ damage in a large radius with lightnings and stun them in space and time for short period of time.
items.weapon.melee.gauntlet.stats_desc=This is a very fast weapon.\nThis weapon will strike the foes with lightning magic.
items.weapon.melee.gauntlet.desc=This massive gauntlet is made of crimson fabric with heavy magical stone layered on top. The fabric tightens around you, making the thick stone plates almost like a second skin. Swinging such a heavy weapon requires strength, but adds tremendous force to your blows.
items.weapon.melee.glaive.name=glaive
items.weapon.melee.glaive.stats_desc=This is a rather slow weapon.\nThis weapon has extra reach.
items.weapon.melee.glaive.ability_name=spike
items.weapon.melee.glaive.typical_ability_desc=The Duelist can use the tip of a glaive to _spike_ an enemy that is in range but not adjacent. This typically deals _%1$d-%2$d_ damage, knocks the enemy back, and is guaranteed to hit.
