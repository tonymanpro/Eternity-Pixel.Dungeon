###armor curses
items.armor.curses.antientropy.name=%s anti-entropi
items.armor.curses.antientropy.desc=Cara kerja kutukan anti-entropi adalah melawan hukum alam, yaitu dengan menyerap energi kepada si pemakai dan menghempaskan energi kepada lingkungan sekitar. Kutukan ini akan membakar pemakai dalam waktu singkat, tapi akan membekukan segalanya di lingkungkan sekitar!

items.armor.curses.bulk.name=%s besar
items.armor.curses.bulk.desc=Armor berukuran besar terlihat lebih besar dan lebih mengesankan, namun sebenarnya tidak memiliki pertahanan yang ditingkatkan. Lebih buruk lagi, ukuran yang bertambah membuat pergerakan memasuki pintu menjadi sangat sulit.

items.armor.curses.corrosion.name=%s korosi
items.armor.curses.corrosion.desc=Armor korosi bisa menyemburkan cairan korosif, melumuri segalanya di area dengan cairan asam yang lengket.

items.armor.curses.displacement.name=%s pemindahan
items.armor.curses.displacement.desc=Kutukan pemindahan membuat si pemakai pindah ke lokasi aman saat diserang. Namun kutukan ini terlalu efektif, memindahkan si pemakai di sekitar level secara acak.

items.armor.curses.metabolism.name=%s metabolisme
items.armor.curses.metabolism.desc=Kutukan metabolisme secara langsung mengubah rasa lapar menjadi darah saat si pemakai terluka, memberikan pemyembuhan, namun mempercepat rasa lapar.

items.armor.curses.multiplicity.name=%s penggandaan
items.armor.curses.multiplicity.desc=Armor yang terkena kutukan penggandaan mengandung sihir duplikasi yang berbahaya. Kadang armor itu akan menciptakan cerminan diri si pemakai, tapi kemungkinan yang sama juga armor itu akan menciptakan duplikasi si penyerang!

items.armor.curses.overgrowth.name=%s tumbuhan
items.armor.curses.overgrowth.desc=Armor tumbuhan dilapisi oleh tumbuhan yang mekar. Di samping terlihat menarik, efek ini tidak berpengaruh apapun pada pertahanan, dan tanaman-tanaman itu akan aktif secara acak saat dalam pertempuran!

items.armor.curses.stench.name=%s bau
items.armor.curses.stench.desc=Armor yang terkutuk oleh bau akan megeluarkan awan gas berbahaya, yang sangat berbahaya bagi apa pun yang terjebak di dalamnya.


###glyphs
items.armor.glyphs.affection.name=%s mempesona
items.armor.glyphs.affection.desc=Glyph yang kuat ini memanipulasi pikiran si penyerang, membuat mereka terpesona untuk sementara.

items.armor.glyphs.antimagic.name=%s anti-sihir
items.armor.glyphs.antimagic.desc=Glyph yang kuat ini memungkinkan armor untuk melindungi pemakainya dari serangan sihir dan juga serangan fisik. Pertahanan sihir ini tidak dipengaruhi oleh tingkatan armor.

items.armor.glyphs.brimstone.name=%s belerang
items.armor.glyphs.brimstone.desc=Glyph ini melindungi pemakainya dan barang-barang bawaannya dari api, sepenuhnya meniadakan damage dan efek negatif dari api.

items.armor.glyphs.camouflage.name=%s kamuflase
items.armor.glyphs.camouflage.desc=Glyph ini membuat si pemakai melebur dengan rumput tinggi, membuatnya tembus pandang sesaat.

items.armor.glyphs.entanglement.name=%s belitan
items.armor.glyphs.entanglement.desc=Glyph ini menumbuhkan armor tanah di sekitar pemakainya untuk menyerap damage, tetapi armor ini akan hancur jika pemakainya bergerak.

items.armor.glyphs.flow.name=%s mengalir
items.armor.glyphs.flow.desc=Glyph ini memanipulasi aliran air di sekitar si pemakai, membuat mereka lebih cepat bergerak di atasnya.

items.armor.glyphs.obfuscation.name=%s penyamaran
items.armor.glyphs.obfuscation.desc=Glyph ini meremangkan fisik si pemakai, membuat mereka sulit untuk dideteksi.

items.armor.glyphs.potential.name=%s potensial
items.armor.glyphs.potential.desc=Glyph ini membangun energi saat pemakai dipukul, memberikan daya ke tongkat sihir pemakainya saat aktif.

items.armor.glyphs.repulsion.name=%s penolak
items.armor.glyphs.repulsion.desc=Glyph ini memantulkan kekuatan si penyerang, menerbangkan mereka ke belakang.

items.armor.glyphs.stone.name=%s batu
items.armor.glyphs.stone.desc=Glyph ini menyelimuti armor dengan batu ajaib berat yang membuatnya mustahil menghindari serangan, tapi damage yang ditahan berkurang sebanding dengan penghindaran.

items.armor.glyphs.swiftness.name=%s kegesitan
items.armor.glyphs.swiftness.desc=Glyph ini meningkatkan kecepatan pemakainya setiap kali mereka tidak berada di dekat musuh.

items.armor.glyphs.thorns.name=%s duri
items.armor.glyphs.thorns.desc=Glyph yang kuat ini melukai penyerang, menyebabkan mereka perlahan mengalami pendarahan saat menyerang pemakainya.

items.armor.glyphs.viscosity.name=%s viskositas
items.armor.glyphs.viscosity.deferred=%d tangguhan
items.armor.glyphs.viscosity$defereddamage.name=damage tangguhan
items.armor.glyphs.viscosity$defereddamage.ondeath=Damage tangguhan membunuhmu...
items.armor.glyphs.viscosity$defereddamage.rankings_desc=Terbunuh oleh damage tangguhan
items.armor.glyphs.viscosity$defereddamage.desc=Damage diberikan secara perlahan alih-alih diterima secara lansung semua.\n\nGiliran damage tangguhan: %d.
items.armor.glyphs.viscosity.desc=Glyph ini mampu menyimpan damage yang diterima si pengguna. Memberikan damage perlahan-lahan, dari pada memberinya secara langsung.



###armor
items.armor.armor.ac_detach=LEPAS
items.armor.armor.detach_seal=Kamu melepas segel dari armormu.
items.armor.armor.equip_cursed=Armor ini mengerut di sekeliling tubuhmu sangat kencang.
items.armor.armor.identify=Kamu sekarang sudah cukup familiar dengan armormu.
items.armor.armor.hardening_gone=Pengerasan pada armor ini telah hilang!
items.armor.armor.incompatible=Interaksi antara tipe sihir yang berbeda telah menghapus glyph di armor ini!
items.armor.armor.curr_absorb=Armor _tingkat-%1$d_ ini menahan _%2$d-%3$d damage_ dan membutuhkan _%4$d kekuatan_ untuk digunakan dengan baik.
items.armor.armor.avg_absorb=Biasanya, armor _tingkat-%1$d_ menahan _%2$d-%3$d damage_ dan membutuhkan _%4$d kekuatan_ untuk digunakan dengan baik.
items.armor.armor.too_heavy=Karena kekuatanmu tidak cukup, memakai armor ini akan mengurangi kemampuanmu dalam bergerak, menghindar, dan bertahan.
items.armor.armor.probably_too_heavy=Mungkin armor ini terlalu berat untukmu.
items.armor.armor.excess_str=Karena kelebihan kekuatan, kamu _lebih mudah menghindar_ saat memakai armor ini.
items.armor.armor.evasion=Peningkatan _penghindaran_ telah ditambahkan.
items.armor.armor.defense=Peningkatan _pertahanan_ telah ditambahkan.
items.armor.armor.inscribed=Telah diberi kekuatan _%s._
items.armor.armor.glyph_hardened=Sudah _dikeraskan._
items.armor.armor.hardened_no_glyph=Armor ini telah _dikeraskan_, namun saat ini tidak tertulis sebuah glyph.
items.armor.armor.cursed_worn=Karena armor ini terkutuk, kamu tidak kuat untuk melepaskannya.
items.armor.armor.cursed=Kamu dapat merasakan sihir jahat di armor ini.
items.armor.armor.weak_cursed=Meskipun ada kutukan, kamu dapat melepas armor ini.
items.armor.armor.not_cursed=Armor ini bebas dari sihir jahat.
items.armor.armor.seal_attached=Segel rusak Pendekar terpasang pada armor ini. Saat ia akan terluka hingga darahnya setengah, itu akan memberinya _%d perisai_.
items.armor.armor.seal_transfer=Supaya memberi efek, segel rusak Pendekar harus melekat pada armor yang ia pakai. Apakah kamu ingin otomatis memindahkan segel dari armor yang kamu lepas ke armor yang akan kamu pakai?
items.armor.armor.seal_transfer_yes=ya
items.armor.armor.seal_transfer_no=tidak
items.armor.armor$glyph.glyph=glyph
items.armor.armor$glyph.killed=%s membunuhmu...
items.armor.armor$glyph.rankings_desc=Terbunuh oleh glyph
items.armor.armor$glyph.discover_hint=Kamu bisa menemukan item dengan efek ini secara acak di terungku, atau mencoba menerapkannya pada item sendiri.

items.armor.classarmor.ac_ability=PILIH KEMAMPUAN
items.armor.classarmor.ac_transfer=TRANSFER
items.armor.classarmor.no_ability=Armormu saat ini tidak memiliki kemampuan, kamu sebaiknya pilih sekarang!
items.armor.classarmor.not_equipped=Kamu harus memakai armor ini untuk dapat memakai kekuatan spesialnya!
items.armor.classarmor.low_charge=Armor tidak memiliki cukup daya untuk menggunakan kekuatan khususnya!
items.armor.classarmor.charge_use=Menggunakan kemampuan ini sekarang akan menghabiskan _%s_ daya.
items.armor.classarmor.transfer_title=Transfer Armor
items.armor.classarmor.transfer_desc=SIhir dari mahkota raja kurcaci dapat dipindahkan ke setelan armor lain. Namun armor asli akan hancur dalam prosesnya.
items.armor.classarmor.transfer_prompt=Pilih sebuah Armor
items.armor.classarmor.transfer_cancel=Batal
items.armor.classarmor.transfer_complete=Properti armor heroik kamu telah ditransfer!
items.armor.classarmor.discover_hint=Kamu bisa menemukan item ini setelah mengalahkan bos lantai 20 dengan pahlawan tertentu.

items.armor.clericarmor.name=pakaian adat pahlawan
items.armor.clericarmor.desc=Ketika mengenakan campuran kain dan besi ini, Ulama dapat menggunakan kemampuan spesial.

items.armor.clotharmor.name=armor kain
items.armor.clotharmor.desc=Armor ringan ini memberi proteksi biasa.
items.armor.clotharmor.discover_hint=Salah satu pahlawan berawal dengan item ini.

items.armor.duelistarmor.name=pelindung dada pahlawan
items.armor.duelistarmor.desc=Ketika mengenakan armor besi dan mantel ini, Duelis dapat menggunakan kemampuan spesial.

items.armor.huntressarmor.name=mantel pahlawan
items.armor.huntressarmor.no_enemies=Tidak ada musuh dalam jarak pandang.
items.armor.huntressarmor.desc=Saat memakai jubah ini, Pemburu dapat menggunakan kemampuan spesial.

items.armor.leatherarmor.name=armor kulit
items.armor.leatherarmor.desc=Armor yang terbuat dari kulit monster. Tidak seringan armor kain tapi memberikan proteksi lebih baik.

items.armor.magearmor.name=jubah pahlawan
items.armor.magearmor.desc=Saat memakai jubah yang cantik ini, Penyihir dapat menggunakan kemampuan spesial.

items.armor.mailarmor.name=armor zirah
items.armor.mailarmor.desc=Logam-logam saling terhubung menciptakan armor yang cukup kuat dan fleksibel.

items.armor.platearmor.name=armor besi
items.armor.platearmor.desc=Piringan logam yang banyak sekali bergabung menjadi pakaian yang memberikan proteksi tak tertandingi untuk petualang yang cukup kuat untuk menahan beratnya.

items.armor.roguearmor.name=seragam pahlawan
items.armor.roguearmor.desc=Saat menggunakan pakaian gelap ini, Pengembara dapat menggunakan kemampuan spesial.

items.armor.scalearmor.name=armor sisik
items.armor.scalearmor.desc=Sisik logam dijahit di atas rompi kulit menghasilkan armor yang fleksibel, dan protektif.

items.armor.warriorarmor.name=baju besi pahlawan
items.armor.warriorarmor.desc=Saat memakai baju lapis baja berat ini, Pendekar dapat menggunakan kemampuan spesial.



###artifacts
items.artifacts.alchemiststoolkit.name=Alat peracik
items.artifacts.alchemiststoolkit.ac_brew=MASAK
items.artifacts.alchemiststoolkit.ac_energize=BERI ENERGI
items.artifacts.alchemiststoolkit.not_ready=Alatmu belum selesai melakukan pemanasan.
items.artifacts.alchemiststoolkit.cursed=Alat terkutukmu mencegahmu untuk meracik!
items.artifacts.alchemiststoolkit.need_energy=Kamu membutuhkan setidaknya 6 energi untuk itu.
items.artifacts.alchemiststoolkit.energize_desc=Setiap 6 kristal energi akan memberikan peralatan ini cukup kekuatan untuk naik level, yang meningkatkan kecepatan peralatan ini untuk membuat energi dari waktu ke waktu, dan seberapa cepat peralatan menhadi hangat.\n\nBerapa banyak energi yang ingin kamu gunakan?
items.artifacts.alchemiststoolkit.energize_1=6 energi: +1 level
items.artifacts.alchemiststoolkit.energize_all=%1$d energi: +%2$d level
items.artifacts.alchemiststoolkit.desc=Alat ini berisi sejumlah reagen dan rempah-rempah, bersamaan dengan botol-botol peracik kecil, membuatmu bisa meracik di perjalanan. Botolnya mengandung sesuatu yang kelihatannya seperti energi alkimua dalam bentuk cair.
items.artifacts.alchemiststoolkit.desc_cursed=Alat terkutuk ini telah mengikat dirinya sendiri di sampingmu, dan melarangmu untuk menggunakan alat peracik.
items.artifacts.alchemiststoolkit.desc_warming=Alat ini sedang dalam pemanasan, dan akan siap digunakan setelah beberapa saat.
items.artifacts.alchemiststoolkit.desc_hint=Alat yang sedang dipakai akan secara perlahan menciptakan energi racikan ketika kamu mendapatkan pengalaman. Sepertinya racikan di botol dapat ditingkatkan dengan menambahkan kristal energi ke dalamnya.

items.artifacts.artifact.cannot_wear_two=Kamu tidak dapat memakai dua artefak yang sama.
items.artifacts.artifact.equip_cursed=Artefak itu menempel erat dengan sendirinya padamu.
items.artifacts.artifact.curse_known=Kamu dapat merasa sihir jahat mengamuk di dalam artefak itu.
items.artifacts.artifact.not_cursed=Artefak ini bebas dari sihir jahat.
items.artifacts.artifact.need_to_equip=Kamu harus memakai artefak itu untuk dapat melakukannya.

items.artifacts.capeofthorns.name=mantel duri
items.artifacts.capeofthorns.desc=Bekas-bekas lembaran logam dari DM-300 yang hancur telah menyatu menjadi sebuah mantel yang kaku. Sepertinya itu menyimpan energi, mungkin saja ada kekuatan DM-300 nya?
items.artifacts.capeofthorns.desc_inactive=Mantel ini terasa berat di bahumu, sepertinya mantel itu mendapatkan energi dari damage yang kamu terima.
items.artifacts.capeofthorns.desc_active=Mantel ini sepertinya sedang mengeluarkan energi yang tersimpan, mantel ini memancarkan kekuatan protektif.
items.artifacts.capeofthorns$thorns.inert=Mantelmu menjadi lemah kembali.
items.artifacts.capeofthorns$thorns.radiating=Mantelmu mulai memancarkan energi, kamu merasa terlindungi!
items.artifacts.capeofthorns$thorns.levelup=Mantelmu bertambah kuat!
items.artifacts.capeofthorns$thorns.name=duri
items.artifacts.capeofthorns$thorns.desc=Mantelmu memancarkan energi, mengelilingimu dengan kekuatan deflektif!\n\nSemua damage yang kamu terima berkurang selama efek duri berlangsung. Ditambah, jika si penyerang berada di sebelahmu, maka damage yang dikurangi itu akan dipantulkan kepada si penyerang.\n\nSisa waktu efek duri: %s giliran.

items.artifacts.chaliceofblood.name=piala darah
items.artifacts.chaliceofblood.ac_prick=TUSUK
items.artifacts.chaliceofblood.yes=Ya, aku tahu apa yang kulakukan
items.artifacts.chaliceofblood.no=Tidak, aku berubah pikiran
items.artifacts.chaliceofblood.prick_warn=Setiap kali Anda menggunakan piala itu, energi hidupmu akan terkuras lebih banyak, tetapi sebagai gantinya akan meningkatkan regenerasi kesehatan alami Anda.\n\nSaat ini, menusuk diri sendiri akan menimbulkan _%1$d-%2$d damage_, meskipun damage ini dapat dikurangi dengan _pemblokiran fisik dan magis atau pengurangan damage_. Tanpa mempertimbangkan efek pengurangan damage, menusuk diri sendiri saat ini memiliki _peluang %3$s%%_ untuk menguras energi hidupmu sepenuhnya.\n\nApakah Anda yakin ingin mempersembahkan lebih banyak energi hidup pada piala itu?
items.artifacts.chaliceofblood.onprick=Kau menusuk jarimu, dan esensi kehidupanmu tertuang dalam piala.
items.artifacts.chaliceofblood.ondeath=Piala itu menyerap esensi kehidupanmu sampai habis...
items.artifacts.chaliceofblood.desc=Piala perak yang berkilau ini dengan anehnya dihiasi dengan permata tajam di pinggirnya.
items.artifacts.chaliceofblood.desc_cursed=Piala terkutuk menempel sendiri di tanganmu, dan menghalangi kemampuanmu untuk meregenarasi darah.
items.artifacts.chaliceofblood.desc_1=Ketika kamu memegang piala itu, anehnya kamu merasa terdorong untuk menusuk jarimu ke permata yang tajam.
items.artifacts.chaliceofblood.desc_2=Sebagian darahmu dikumpulkan ke dalam piala, kamu dapat secara halus merasakan piala tersebut memberi energi kehidupan ke dalam dirimu, meningkatkan regenerasi alami darahmu. Kamu tetap ingin melukai diri sendiri dengan piala itu, meskipun kamu tahu itu akan menyakitkan.
items.artifacts.chaliceofblood.desc_3=Piala diisi sampai penuh dengan esensi kehidupanmu. Kamu dapat merasakan piala yang mengalirkan energi kehidupan kembali ke dalam dirimu.

items.artifacts.cloakofshadows.name=jubah bayangan
items.artifacts.cloakofshadows.ac_stealth=MENYAMAR
items.artifacts.cloakofshadows.cooldown=Jubahmu membutuhkan %d giliran lagi untuk dapat terisi ulang.
items.artifacts.cloakofshadows.cursed=Kamu tidak bisa memakai jubah yang terkutuk.
items.artifacts.cloakofshadows.no_charge=Jubahmu belum cukup terisi untuk dapat dipakai.
items.artifacts.cloakofshadows.desc=Jubah ajaib yang tak ternilai harganya, dicuri dari tempat senjata kerajaan bertahun-tahun lalu oleh Pengembara. Saat dipakai, jubah ini dapat menjadi tembus pandang untuk sesaat.\n\nSemakin sering jubah dipakai, akan bertambah kuat juga lah jubah ini, membuat Pengembara dapat tembus pandang lebih sering dan lebih lama.
items.artifacts.cloakofshadows.discover_hint=Salah satu pahlawan berawal dengan item ini.
items.artifacts.cloakofshadows$cloakstealth.no_charge=Jubahmu kehabisan energi.
items.artifacts.cloakofshadows$cloakstealth.levelup=Jubahmu tambah kuat!
items.artifacts.cloakofshadows$cloakstealth.name=berjubah
items.artifacts.cloakofshadows$cloakstealth.desc=Jubah bayangan memberimu kemampuan tidak terlihat saat kamu diselimuti olehnya. Kamu akan tetap terselubung hingga kemampuan itu dibatalkan atau jubahmu kehabisan daya.\n\nSaat kamu tidak terlihat, musuh tidak dapat menyerang atau mengikutimu. Serangan fisik dan efek magis (seperti gulungan dan tongkat sihir) akan segera membatalkan kemampuan tidak terlihat.\n\nGiliran hingga daya dipakai: %d.

items.artifacts.driedrose.name=mawar kering
items.artifacts.driedrose.ac_summon=PANGGIL
items.artifacts.driedrose.ac_direct=ARAHKAN
items.artifacts.driedrose.ac_outfit=PERLENGKAPAN
items.artifacts.driedrose.spawned=Kamu sudah memanggil hantunya.
items.artifacts.driedrose.no_charge=Mawarmu belum terisi penuh.
items.artifacts.driedrose.cursed=Kamu tidak dapat memakai mawar terkutuk.
items.artifacts.driedrose.no_space=Tidak ada ruang kosong di dekatmu.
items.artifacts.driedrose.charged=Mawarmu terisi penuh!
items.artifacts.driedrose.desc=Apakah ini mawar yang dikatakan oleh hantu sebelum ia menghilang? Sepertinya mawar ini menyimpan kekuatan spiritual, mungkin ini dapat dijadikan penghubung kepada hantu itu.
items.artifacts.driedrose.desc_no_quest=Mawar yang sudah kering tapi entah kenapa kelopaknya masih menempel dengan baik.\n\nKelihatannya mawar itu punya kekuatan spiritual, tapi kamu tidak tahu bagaimana cara menggunakannya sekarang.
items.artifacts.driedrose.desc_hint=Sepertinya mawar ini kehilangan kelopaknya. Mungkin dengan memasangnya kembali dapat memperkuat mawarnya.
items.artifacts.driedrose.desc_cursed=Mawar terkutuk menempel pada tanganmu, rasanya dingin.
items.artifacts.driedrose.desc_weapon=Senjata hantu: %s
items.artifacts.driedrose.desc_armor=Armor hantu: %s
items.artifacts.driedrose.desc_strength=Kekuatan hantu: %s
items.artifacts.driedrose$petal.name=kelopak kering
items.artifacts.driedrose$petal.no_rose=Kamu tidak mempunyai mawar untuk menempelkan kelopak ini.
items.artifacts.driedrose$petal.no_room=Tidak ada ruang lagi untuk kelopak ini, jadi kamu membuangnya.
items.artifacts.driedrose$petal.maxlevel=Mawarnya lengkap!
items.artifacts.driedrose$petal.levelup=Kamu menambahkan kelopak ke mawar.
items.artifacts.driedrose$petal.desc=Kelopak kering yang rapuh, yang entah bagaimana dapat bertahan sampai sejauh ini di dalam terungku.
items.artifacts.driedrose$wndghosthero.title=Perlengkapan Hantu
items.artifacts.driedrose$wndghosthero.desc=Hantu itu lemah, tapi bentuk mereka cukup padat untuk dapat dipakaikan senjata dan armor. Mereka dapat memakai item sama sepertimu.\n\nHantu itu saat ini dapat memakai item yang membutuhkan _%d kekuatan._
items.artifacts.driedrose$wndghosthero.weapon_prompt=Pilih sebuah senjata
items.artifacts.driedrose$wndghosthero.armor_prompt=Pilih sebuah armor
items.artifacts.driedrose$wndghosthero.cant_unique=Hantu itu tidak dapat menggunakan item unik.
items.artifacts.driedrose$wndghosthero.cant_cursed=Hantu itu hanya bisa memakai item yang kamu yakin tidak terkutuk.
items.artifacts.driedrose$wndghosthero.cant_strength_unknown=Hantu mungkin tidak cukup kuat untuk menggunakan itu.
items.artifacts.driedrose$wndghosthero.cant_strength=Hantu itu tidak cukup kuat untuk menggunakan itu.

##ghost hero
items.artifacts.driedrose$ghosthero.name=hantu sedih
items.artifacts.driedrose$ghosthero.def_verb=menghindar
items.artifacts.driedrose$ghosthero.discover_hint=Kamu bisa menemukan karakter ini dengan suatu artefak khusus.

items.artifacts.driedrose$ghosthero.hello=Halo lagi %s.
items.artifacts.driedrose$ghosthero.introduce=Jiwaku terikat pada mawar ini, bunga ini sangat berharga bagiku, hadiah dari cintaku yang kutinggalkan di permukaan.\n\nSaya tidak bisa kembali kepadanya, tetapi berkat kamu saya memiliki kesempatan kedua untuk menyelesaikan perjalananku. Ketika saya mampu, saya akan menjawab panggilanmu dan bertarung bersamamu.\n\nSelama kamu memiliki mawarnya, saya dapat mendengar suaramu, sehingga kamu dapat menggunakanya di mana saja walaupun saya jauh di luar sana.\n\nSemoga kamu berhasil di mana saya gagal...

items.artifacts.driedrose$ghosthero.dialogue_sewers_1=Selokan ini dulunya aman, orang bahkan tinggal di sini pada musim dingin.
items.artifacts.driedrose$ghosthero.dialogue_sewers_2=Aku penasaran apa yang terjadi dengan para penjaga, apakah mereka menyerah?
items.artifacts.driedrose$ghosthero.dialogue_sewers_3=Aku memiliki keluarga di permukaan, kuharap mereka aman.
items.artifacts.driedrose$ghosthero.dialogue_sewers_4=Para penjaga tidak bisa mengalahkan monster-monster ini, tapi mungkin kita bisa.
items.artifacts.driedrose$ghosthero.dialogue_sewers_5=Bahkan jika selokan saja berbahaya seperti ini, aku penasaran apa yang ada di bawah...
items.artifacts.driedrose$ghosthero.dialogue_sewers_6=Apa yang menyebabkan tikus dan kepiting ini tumbuh begitu besar?
items.artifacts.driedrose$ghosthero.dialogue_prison_1=Aku pernah mendengar cerita tentang tempat ini, tidak ada yang bagus.
items.artifacts.driedrose$ghosthero.dialogue_prison_2=Tempat ini selalu lebih seperti terungku daripada penjara.
items.artifacts.driedrose$ghosthero.dialogue_prison_3=Aku tidak bisa membayangkan apa yang terjadi ketika tempat ini ditinggalkan.
items.artifacts.driedrose$ghosthero.dialogue_prison_4=Sepertinya para tahanan dan penjaga telah berubah menjadi monster.
items.artifacts.driedrose$ghosthero.dialogue_prison_5=Siapa yang bertanggung jawab atas semua tengkorak ini?
items.artifacts.driedrose$ghosthero.dialogue_prison_6=Orang-orang ini tidak harus berakhir seperti ini...
items.artifacts.driedrose$ghosthero.dialogue_caves_1=Sudah lama tidak ada manusia atau kurcaci yang berada di sini.
items.artifacts.driedrose$ghosthero.dialogue_caves_2=Apa yang menyebabkan para kurcaci meninggalkan tambang emas ini?
items.artifacts.driedrose$ghosthero.dialogue_caves_3=Sayang sekali semua emas di sini tidak berguna di permukaan.
items.artifacts.driedrose$ghosthero.dialogue_caves_4=Makhluk di sini gila, seperti yang ada di selokan.
items.artifacts.driedrose$ghosthero.dialogue_caves_5=Bahkan kelelawar pun haus darah di sini.
items.artifacts.driedrose$ghosthero.dialogue_caves_6=Tidak ada tanda-tanda peralatan penambangan, apakah para kurcaci merebut kembali semuanya?
items.artifacts.driedrose$ghosthero.dialogue_city_1=Para kurcaci itu pintar berindustri, tapi serakah.
items.artifacts.driedrose$ghosthero.dialogue_city_2=Jadi kota metropolis kurcaci benar-benar telah runtuh.
items.artifacts.driedrose$ghosthero.dialogue_city_3=Kuharap permukaan tidak pernah berakhir seperti tempat ini.
items.artifacts.driedrose$ghosthero.dialogue_city_4=Para kurcaci tidak seharusnya terlihat pucat.
items.artifacts.driedrose$ghosthero.dialogue_city_5=Aku tidak tahu apa yang lebih buruk, para kurcaci, atau ciptaan mereka.
items.artifacts.driedrose$ghosthero.dialogue_city_6=Tampaknya para kurcaci juga merupakan monster yang tidak punya pikiran.
items.artifacts.driedrose$ghosthero.dialogue_halls_1=Tempat apa ini?
items.artifacts.driedrose$ghosthero.dialogue_halls_2=Tempat ini menakutkan...
items.artifacts.driedrose$ghosthero.dialogue_halls_3=Apa yang dipikirkan para kurcaci, mempermainkan kekuatan seperti ini?
items.artifacts.driedrose$ghosthero.dialogue_halls_4=Monster di sini seperti dari dunia lain, dari mana asalnya?
items.artifacts.driedrose$ghosthero.dialogue_halls_5=Apakah kamu merasakannya? Seperti ada sesuatu yang mengawasi kita.
items.artifacts.driedrose$ghosthero.dialogue_halls_6=Syukurlah ada obor, sangat gelap di sini!
items.artifacts.driedrose$ghosthero.dialogue_ascension_1=Mengapa ini terjadi, aku kira kita berhasil?
items.artifacts.driedrose$ghosthero.dialogue_ascension_2=Bagaimana hal itu masih dapat mempengaruhi dunia ini?
items.artifacts.driedrose$ghosthero.dialogue_ascension_3=Kuharap kamu tahu apa yang kamu lakukan dengan jimat itu.
items.artifacts.driedrose$ghosthero.dialogue_ascension_4=Sepertinya kita masih belum selesai.
items.artifacts.driedrose$ghosthero.dialogue_ascension_5=Kita telah datang sangat jauh, kita dapat menyelesaikan ini!
items.artifacts.driedrose$ghosthero.dialogue_ascension_6=Sedikit lagi, kita dapat keluar dari sini!

items.artifacts.driedrose$ghosthero.seen_goo_1=Awas Goo!
items.artifacts.driedrose$ghosthero.seen_goo_2=Banyak temanku yang mati karena makhluk ini, waktunya untuk balas dendam!
items.artifacts.driedrose$ghosthero.seen_goo_3=Kekejian seperti itu tidak bisa dibiarkan hidup!
items.artifacts.driedrose$ghosthero.seen_tengu_1=Satu tahanan yang tersisa adalah pembunuh yang mematikan. Tentu saja...
items.artifacts.driedrose$ghosthero.seen_tengu_2=Dia menjebak kita!
items.artifacts.driedrose$ghosthero.seen_tengu_3=Aku pernah mendengar cerita horor tentang topeng itu...
items.artifacts.driedrose$ghosthero.seen_dm300_1=Hanya para kurcaci yang bisa membangun mesin penambang yang bisa membunuh penyusup.
items.artifacts.driedrose$ghosthero.seen_dm300_2=Itu sangat besar...
items.artifacts.driedrose$ghosthero.seen_dm300_3=Bagaimana benda ini tetap aktif begitu lama?
items.artifacts.driedrose$ghosthero.seen_king_1=Ketika orang mengatakan kekuatan merusak, inilah yang mereka maksud.
items.artifacts.driedrose$ghosthero.seen_king_2=Dia lebih seperti mayat daripada seorang raja sekarang.
items.artifacts.driedrose$ghosthero.seen_king_3=Bahkan ketika sudah mati para kurcaci tetap mematuhi tuan mereka.
items.artifacts.driedrose$ghosthero.seen_yog_1=Oh, ini tidak terlihat bagus.
items.artifacts.driedrose$ghosthero.seen_yog_2=Jadi, seperti inikah Dewa itu?
items.artifacts.driedrose$ghosthero.seen_yog_3=Ini akan menyakitkan...

items.artifacts.driedrose$ghosthero.defeated_by_enemy_1=Semoga berhasil...
items.artifacts.driedrose$ghosthero.defeated_by_enemy_2=Lelah... untuk sekarang...
items.artifacts.driedrose$ghosthero.defeated_by_enemy_3=Aku akan kembali...
items.artifacts.driedrose$ghosthero.defeated_by_boss_1=Maafkan aku... semoga berhasil...
items.artifacts.driedrose$ghosthero.defeated_by_boss_2=Selesaikanlah... tanpa aku...
items.artifacts.driedrose$ghosthero.defeated_by_boss_3=Tidak... Aku tidak bisa...
items.artifacts.driedrose$ghosthero.blessed_ankh_1=Bagaimana kamu bisa selamat?
items.artifacts.driedrose$ghosthero.blessed_ankh_2=Aku harap aku memiliki salah satu dari benda itu...
items.artifacts.driedrose$ghosthero.blessed_ankh_3=Astaga! Kamu masih hidup!
items.artifacts.driedrose$ghosthero.player_killed_1=Tidak!...
items.artifacts.driedrose$ghosthero.player_killed_2=Aku tidak bisa membantu mereka...
items.artifacts.driedrose$ghosthero.player_killed_3=Tidak seperti ini...

items.artifacts.driedrose$ghosthero.direct_prompt=Apa yang harus kulakukan?
items.artifacts.driedrose$ghosthero.directed_follow_1=Oke, saya akan mengikutimu.
items.artifacts.driedrose$ghosthero.directed_follow_2=Saya akan berada di belakangmu.
items.artifacts.driedrose$ghosthero.directed_follow_3=Mengikutimu...
items.artifacts.driedrose$ghosthero.directed_follow_4=Oke, mari kita pergi!
items.artifacts.driedrose$ghosthero.directed_follow_5=Saya akan membantumu.
items.artifacts.driedrose$ghosthero.directed_attack_1=Oke, aku akan menyerang yang itu.
items.artifacts.driedrose$ghosthero.directed_attack_2=Aku akan mengatasi yang satu ini.
items.artifacts.driedrose$ghosthero.directed_attack_3=Laksanakan...
items.artifacts.driedrose$ghosthero.directed_attack_4=Ayo tangkap mereka!
items.artifacts.driedrose$ghosthero.directed_attack_5=Kuatasi yang satu itu.
items.artifacts.driedrose$ghosthero.directed_position_1=Oke. Aku akan menahan posisi.
items.artifacts.driedrose$ghosthero.directed_position_2=Aku akan pergi ke sana dan bertahan.
items.artifacts.driedrose$ghosthero.directed_position_3=Berpindah...
items.artifacts.driedrose$ghosthero.directed_position_4=Dalam perjalanan!
items.artifacts.driedrose$ghosthero.directed_position_5=Aku akan pergi ke sana.

items.artifacts.driedrose$ghosthero.desc=Sosok halus yang tampak lemah dengan bentuk manusia. Kekuatan darinya tampaknya terikat pada mawar yang kamu miliki.\n\nHantu ini mungkin tidak membantu banyak, tapi mereka tampaknya satu-satunya teman sejatimu di bawah sini.

##back to artifacts
items.artifacts.etherealchains.name=rantai halus
items.artifacts.etherealchains.ac_cast=LEMPAR
items.artifacts.etherealchains.rooted=Rantaimu tidak dapat menarikmu saat kamu sedang tertanam.
items.artifacts.etherealchains.no_charge=Rantaimu tidak punya daya yang cukup.
items.artifacts.etherealchains.cursed=Kamu tidak dapat menggunakan rantai terkutuk.
items.artifacts.etherealchains.does_nothing=Itu tidak akan melakukan apa pun.
items.artifacts.etherealchains.cant_pull=Rantaimu tidak dapat menarik target itu.
items.artifacts.etherealchains.cant_reach=Rantaimu tidak dapat mencapai sampai sana.
items.artifacts.etherealchains.inside_wall=Rantaimu hanya dapat menarikmu melewati dinding, bukan ke dalamnya.
items.artifacts.etherealchains.nothing_to_grab=Tidak ada apa pun untuk diraih di sana.
items.artifacts.etherealchains.prompt=Pilih lokasi untuk ditarget.
items.artifacts.etherealchains.desc=Rantai yang besar tapi ringan itu bercahaya oleh energi spiritual. Rantai itu dapat dipakai untuk menarik dirimu sendiri ke suatu tempat, atau menarik musuh ke hadapanmu. Rantai yang secara natural halus itu bahkan dapat memanjang menembus dinding!
items.artifacts.etherealchains.desc_cursed=Rantai terkutuk terkunci di sampingmu, terus-menerus berayun, mencoba membuatmu tersandung atau mengikatmu.
items.artifacts.etherealchains.desc_equipped=Rantai itu bergelantungan di sisimu, perlahan memancarkan energi spiritual dari musuh-musuh yang kamu kalahkan. Setiap daya melambangkan panjang rantai itu, yang mana akan memanjang tepat satu petak.
items.artifacts.etherealchains$chainsrecharge.levelup=Rantaimu tumbuh lebih kuat!

items.artifacts.holytome.name=kitab suci
items.artifacts.holytome.ac_cast=LEMPAR
items.artifacts.holytome.no_spell=Kamu tidak dapat menggunakan mantra itu sekarang
items.artifacts.holytome.cursed=Kamu tidak bisa menggunakan kitab yang terkutuk
items.artifacts.holytome.levelup=kitab mu menjadi lebih kuat
items.artifacts.holytome.desc=Kitab suci yang berfungsi sebagai pusat sihir suci milik Ulama. Dengan menggunakan kitab suci, Ulama dapat mengeluarkan berbagai mantra sihir. Kitab suci akan semakin kuat seiring Ulama menggunakannya, sehingga Ulama memperoleh lebih banyak daya maksimum dan sedikit meningkatkan kecepatan pengisian ulang.
items.artifacts.holytome.discover_hint=Salah satu pahlawan berawal dengan item ini.

items.artifacts.hornofplenty.name=terompet kecukupan
items.artifacts.hornofplenty.ac_snack=CAMILAN
items.artifacts.hornofplenty.ac_eat=MAKAN
items.artifacts.hornofplenty.ac_store=SIMPAN
items.artifacts.hornofplenty.eat=Kamu makan dari terompet.
items.artifacts.hornofplenty.prompt=Pilih makanan
items.artifacts.hornofplenty.no_food=Terompetmu tidak punya makanan untuk dimakan!
items.artifacts.hornofplenty.full=Terompetmu penuh makanan!
items.artifacts.hornofplenty.reject=Terompetmu menolak buah campur yang tidak dimasak.
items.artifacts.hornofplenty.maxlevel=Terompetmu telah memakan semua makanan semampu ia bisa!
items.artifacts.hornofplenty.levelup=Terompet itu memakan makanan yang kamu berikan dan bertambah kuat!
items.artifacts.hornofplenty.feed=Terompet itu memakan makanan yang kamu beri.
items.artifacts.hornofplenty.desc=Terompet ini tidak dapat ditiup, tapi sepertinya akan terisi makanan selagi kamu berpetualang dan mendapat pengalaman. Kamu dapat memakan per satu daya sebagai camilan, atau dimakan hingga kenyang.
items.artifacts.hornofplenty.desc_hint=Mungkin ada cara untuk meningkatkan kekuatan terompet ini dengan cara memberikannya energi makanan.
items.artifacts.hornofplenty.desc_cursed=Terompet terkutuk menempel dengan sendirinya di sampingmu, sepertinya ia lebih bersemangat untuk mengambil makanan dari pada membuatnya.

items.artifacts.lloydsbeacon.name=Suar lloyd
items.artifacts.lloydsbeacon.ac_zap=TEMBAK
items.artifacts.lloydsbeacon.ac_set=PASANG
items.artifacts.lloydsbeacon.ac_return=KEMBALI
items.artifacts.lloydsbeacon.no_charge=Suarmu tidak mempunyai cukup energi saat ini.
items.artifacts.lloydsbeacon.tele_fail=Sihir teleportasi gagal.
items.artifacts.lloydsbeacon.prompt=Pilih lokasi untuk ditembak.
items.artifacts.lloydsbeacon.levelup=Suarmu bertambah kuat!
items.artifacts.lloydsbeacon.preventing=Aura sihir yang kuat di tempat ini menahanmu untuk memakai suar lloyd!
items.artifacts.lloydsbeacon.creatures=Aura psikis dari musuh di seberang membuatmu tidak dapat menggunakan suar lloyd saat ini.
items.artifacts.lloydsbeacon.return=Suar lloyd berhasil dipasang di lokasi saat ini, sekarang kamu dapat kembali ke sini kapan saja.
items.artifacts.lloydsbeacon.desc=Suar lloyd adalah alat sihir rumit yang memberikan si pengguna kontrol terhadap sihir teleportasi. Suar ini dapat digunakan untuk dapat kembali ke tempat yang ditentukan, tapi juga dapat mengeluarkan sihir teleportasi acak ketika itu penuh dan dipakai. Sihir ini dapat ditargetkan ke sesuatu ataupun ke si pengguna sendiri.
items.artifacts.lloydsbeacon.desc_set=Suar ini dipasang di suatu tempat di level %d Pixel Dungeon.

items.artifacts.masterthievesarmband.name=Gelang tangan bos pencuri
items.artifacts.masterthievesarmband.ac_steal=MENCURI
items.artifacts.masterthievesarmband.no_charge=Gelang Tanganmu tidak memiliki cukup daya.
items.artifacts.masterthievesarmband.cursed=Kamu tidak bisa menggunakan gelang tangan yang terkutuk.
items.artifacts.masterthievesarmband.full=Gelang Tanganmu terisi penuh!
items.artifacts.masterthievesarmband.prompt=Pilih musuh untuk ditargetkan
items.artifacts.masterthievesarmband.no_target=Kamu harus menargetkan musuh yang berdekatan denganmu
items.artifacts.masterthievesarmband.steal_shopkeeper=Kamu tidak dapat mencuri dari pemilik toko secara langsung.
items.artifacts.masterthievesarmband.no_steal=Musuh itu tidak punya apa-apa untuk dicuri.
items.artifacts.masterthievesarmband.stole_item=Kamu mencuri item:%s
items.artifacts.masterthievesarmband.failed_steal=Kamu tidak berhasil mencuri apa pun.
items.artifacts.masterthievesarmband.level_up=Gelang tanganmu tumbuh lebih kuat!
items.artifacts.masterthievesarmband.desc=Gelang tangan ungu ini memiliki tanda dari bos pencuri. Ini bukan milikmu, tetapi mungkin juga bukan milik pengguna terakhirnya.
items.artifacts.masterthievesarmband.desc_cursed=Gelang tangan terkutuk itu terikat ke pergelangan tanganmu, dan entah kenapa kantong emasmu tampaknya perlahan menjadi lebih ringan...
items.artifacts.masterthievesarmband.desc_worn=Kamu merasakan kekuatan gelang tangan di lenganmu itu bertambah seiring kamu memperoleh pengalaman. Kamu bisa memakai kekuatan ini untuk mencuri di toko, atau bahkan mencopet musuh!\n\nMencopet musuh akan terjadi seacara instan, akan memusingkan mereka, dan memberimu peluang untuk mencopet sesuatu yang mereka punya! Kekuatan ini lebih efektif digunakan kepada musuh yang sedang lengah. Mencopet dari musuh yang sama berkali-kali tidak akan memberikan peluang mendapatkan barang tambahan.

items.artifacts.sandalsofnature.name=sandal alam
items.artifacts.sandalsofnature.name_1=sepatu alam
items.artifacts.sandalsofnature.name_2=sepatu bot alam
items.artifacts.sandalsofnature.name_3=pelindung kaki alam
items.artifacts.sandalsofnature.ac_feed=BERI MAKAN
items.artifacts.sandalsofnature.ac_root=MENGAKAR
items.artifacts.sandalsofnature.prompt=Pilih sebuah benih
items.artifacts.sandalsofnature.levelup=Alas kakimu membesar!
items.artifacts.sandalsofnature.absorb_seed=Alas kaki itu menyerap benihnya, dan kelihatan lebih sehat.
items.artifacts.sandalsofnature.no_effect=Kamu harus memasukkan benih ke alas kakimu terlebih dahulu.
items.artifacts.sandalsofnature.low_charge=Alas kakimu tidak memiliki cukup energi untuk itu.
items.artifacts.sandalsofnature.prompt_target=Pilih sebuah lokasi
items.artifacts.sandalsofnature.out_of_range=Lokasi itu di luar jangkauan.
items.artifacts.sandalsofnature.desc_1=Benda yang telihat seperti sandal ini ternyata terbuat dari tanaman asli! Sandal itu terlihat sangat rapuh dan pucat, mungkin sandal ini perlu diberi nutrisi?
items.artifacts.sandalsofnature.desc_2=Alas kaki ini berkembang dan sekarang lebih terlihat seperti sepatu. Mungkin masih bisa tumbuh lebih besar?
items.artifacts.sandalsofnature.desc_3=Tanaman ini tumbuh lagi dan sekarang membentuk sepatu bot yang solid terbuat dari kulit kayu. Tanaman itu kelihatannya telah bertambah kuat, tapi mungkin juga mereka masih bisa tumbuh lebih besar?
items.artifacts.sandalsofnature.desc_4=Tanaman ini sepertinya sudah tumbuh secara maksimal, tanaman ini membentuk sepasang armor greave. Greave ini berwarna coklat dan membentuk kayu yang kuat.
items.artifacts.sandalsofnature.desc_hint=Kamu merasa lebih terikat dengan alam saat memakai artefak ini.
items.artifacts.sandalsofnature.desc_cursed=Sandal terkutuk menghalangi interaksi dengan alam sekitar.
items.artifacts.sandalsofnature.desc_ability=Alas kaki itu beriak sesuai warna benih terakhir yang Anda berikan.  Mereka dapat berakar sebentar ke dalam tanah dan menghasilkan efek tanaman tersebut di mana saja dalam radius 3 petak.\nBenih: _%s_\nButuh daya: _%d%%_
items.artifacts.sandalsofnature.desc_seeds=Kamu telah memberi alas kakimu %d benih.

items.artifacts.skeletonkey.name=kunci tengkorak
items.artifacts.skeletonkey.ac_insert=MASUKKAN
items.artifacts.skeletonkey.cursed=Kamu tidak bisa memakai kunci tengkorak yang dikutuk.
items.artifacts.skeletonkey.prompt=Pilih target
items.artifacts.skeletonkey.invalid_target=Tidak ada yang perlu dikunci atau dibuka di sana
items.artifacts.skeletonkey.lock_no_space=Anda tidak bisa mengunci karakter di dalam pintu!
items.artifacts.skeletonkey.iron_charges=Membuka kunci biasa memerlukan 1 daya.
items.artifacts.skeletonkey.gold_charges=Membuka kunci emas memerlukan 2 daya.
items.artifacts.skeletonkey.lock_charges=Mengunci pintu memerlukan 2 daya.
items.artifacts.skeletonkey.wall_charges=Membuat tembok sementara memerlukan 2 daya.
items.artifacts.skeletonkey.crystal_charges=Membuka kunci kristal memerlukan 5daya.
items.artifacts.skeletonkey.wont_open=Entah mengapa, kunci tersebut tidak bisa masuk ke dalam gembok ini.
items.artifacts.skeletonkey.locked_with_key=Pintu itu dikunci dengan kunci tengkorak milikmu.
items.artifacts.skeletonkey.force_lock=Gembok itu menjadi lemah tanpa kunci utamamu. Anda berhasil membukanya secara paksa.
items.artifacts.skeletonkey.discard=Anda membuang kunci-kuncimu yang berlebihan.
items.artifacts.skeletonkey.levelup=Kunci tengkorakmu menjadi lebih kuat!
items.artifacts.skeletonkey.desc=Sebuah kunci yang tampak penting dengan kepala berbentuk tengkorak. Gigi-giginya tampak berbeda setiap kali kamu melihatnya
items.artifacts.skeletonkey.desc_worn=Kunci ajaib ini tampaknya semakin kuat saat kamu menggunakannya, bukan kunci biasa di dalam terungku. Kunci ini dapat dimasukkan ke hampir semua kunci di terungku untuk membuka atau menutupnya, termasuk pintu yang sebelumnya tidak pernah terkunci.\n\nKunci ini bahkan dapat digunakan pada ruang kosong di arah mata angin atau diagonal untuk 'mengunci' udara di depanmu, menciptakan dinding padat selebar 3 petak yang bertahan selama 10 giliran. Penguncian akan mendorong musuh menjauh jika ada ruang untuk melakukannya.
items.artifacts.skeletonkey.desc_cursed=Kunci terkutuk itu tampaknya secara aktif menghindari masuk ke dalam kunci manapun, dan bahkan mempersulit (tetapi bukan tidak mungkin) kamu untuk menggunakan kuncimu yang lain.
items.artifacts.skeletonkey$keywall.desc=Dinding magis sementara telah ditempatkan di sini oleh kunci tengkorak.

items.artifacts.talismanofforesight.name=jimat mata batin
items.artifacts.talismanofforesight.ac_scry=PINDAI
items.artifacts.talismanofforesight.low_charge=Jimat membutuhkan setidaknya 5% daya untuk bisa diaktifkan.
items.artifacts.talismanofforesight.prompt=Pilih lokasi untuk dipindai.
items.artifacts.talismanofforesight.levelup=Jimatmu bertambah kuat!
items.artifacts.talismanofforesight.full_charge=Jimatmu sudah terisi penuh!
items.artifacts.talismanofforesight.desc=Batu halus dengan ukiran aneh di atasnya. Kamu merasa batu itu seperti mengawasi segala sesuatu di sekitarmu, mengawasi apa pun yang tersembunyi.
items.artifacts.talismanofforesight.desc_worn=Saat kamu memegang jimat ini, kamu merasa inderamu meningkat. Jimat perlahan membangun daya seiring berjalannya waktu dan ketika kamu menemukan pintu atau jebakan tersembunyi.\n\nJimat dapat mengeluarkan daya-nya untuk dapat 'memindai' dalam bentuk kerucut, yang mengungkapkan semua permukaan dan rahasia di area yang dipindai, dan akan memberimu penglihatan musuh dan item untuk waktu yang singkat.
items.artifacts.talismanofforesight.desc_cursed=Jimat terkutuk itu dengan saksama menatapmu, menumpulkan indramu.
items.artifacts.talismanofforesight$foresight.name=mata batin
items.artifacts.talismanofforesight$foresight.uneasy=Kamu merasa gelisah.
items.artifacts.talismanofforesight$foresight.desc=Kamu merasa gugup, seperti ada sesuatu berbahaya di sekitar yang tak terlihat.

items.artifacts.timekeepershourglass.name=jam pasir penjaga waktu
items.artifacts.timekeepershourglass.ac_activate=AKTIFKAN
items.artifacts.timekeepershourglass.deactivate=Kamu menonaktifkan pembekuan waktu.
items.artifacts.timekeepershourglass.no_charge=Jam pasirmu belum cukup terisi ulang untuk dapat digunakan.
items.artifacts.timekeepershourglass.cursed=Kamu tidak dapat menggunakan jam pasir terkutuk.
items.artifacts.timekeepershourglass.onstasis=Dunia kelihatannya bergerak di sekitarmu secara instan.
items.artifacts.timekeepershourglass.onfreeze=Segalanya di sekitarmu menjadi beku.
items.artifacts.timekeepershourglass.stasis=Buat diriku statis
items.artifacts.timekeepershourglass.freeze=Hentikan waktu di sekitarku
items.artifacts.timekeepershourglass.prompt=Bagaimana kamu ingin memakai sihir jam pasir ini?\n\nSaat dalam keadaan statis, waktu akan berjalan normal sedangkan kamu mematung dan akan benar-benar kebal terhadap apa pun, memakan 2 daya setiap waktu.\n\nKetika waktu terhenti, kamu dapat bergerak seolah-olah tindakanmu tidak memakan waktu lama. Ini dapat dinonaktifkan kapan saja dengan menggunakan jam pasir atau menyerang.
items.artifacts.timekeepershourglass.desc=Jam pasir berornamen besar ini terlihat sederhana, tetapi kamu merasakan kekuatan besar dalam bingkai yang diukir halus. Saat kamu memutar jam pasir dan menyaksikan pasir mengalir, kamu dapat merasakan keajaibannya menarikmu, pastinya menggunakan sihir ini akan memberimu kendali atas waktu.
items.artifacts.timekeepershourglass.desc_hint=Jam pasir ini kelihatannya kehilangan sejumlah pasir, seandainya kamu dapat menemukan beberapa...
items.artifacts.timekeepershourglass.desc_cursed=Jam pasir terkutuk itu terkunci di sisimu, kamu dapat merasa jam itu berusaha memanipulasi aliran waktu.
items.artifacts.timekeepershourglass$timefreeze.name=Pembekuan Waktu
items.artifacts.timekeepershourglass$timefreeze.desc=Waktu terhenti di sekitarmu, memungkinkanmu melakukan tindakan secara instan. Efeknya akan bertahan hingga dibatalkan atau jam pasirmu kehabisan daya. Menyerang atau menggunakan sihir juga akan merusak efek ini.\n\nGIliran sampai daya dipakai: %s.
items.artifacts.timekeepershourglass$sandbag.name=sekantong pasir ajaib
items.artifacts.timekeepershourglass$sandbag.levelup=Kamu menambahkan pasir ke jam pasirmu.
items.artifacts.timekeepershourglass$sandbag.maxlevel=Jam pasirmu dipenuhi oleh pasir ajaib!
items.artifacts.timekeepershourglass$sandbag.no_hourglass=Kamu tidak punya jam pasir untuk meletakkan pasir ini.
items.artifacts.timekeepershourglass$sandbag.desc=Kantong kecil berisi pasir ini harusnya cocok untuk jam pasirmu.\n\nRasanya aneh si penjaga toko mempunyai item spesifik di saat kamu membutuhkannya...

items.artifacts.unstablespellbook.name=buku mantra tidak stabil
items.artifacts.unstablespellbook.ac_read=BACA
items.artifacts.unstablespellbook.ac_add=TAMBAH
items.artifacts.unstablespellbook.blinded=Kamu tidak bisa membaca buku saat dibutakan.
items.artifacts.unstablespellbook.no_charge=Buku mantra kamu kehabisan energi untuk saat ini.
items.artifacts.unstablespellbook.cursed=Kamu tidak bisa membaca dari buku mantra terkutuk.
items.artifacts.unstablespellbook.prompt=Pilih gulungan
items.artifacts.unstablespellbook.infuse_scroll=Kamu memasukkan energi gulungan ke dalam buku.
items.artifacts.unstablespellbook.unable_scroll=Kamu tidak bisa menambah gulungan ini ke buku.
items.artifacts.unstablespellbook.unknown_scroll=Kamu belum yakin tipe gulungan apa ini.
items.artifacts.unstablespellbook.desc=Buku ini ternyata kondisinya masih bagus walaupun sudah kuno. Buku ini mendesis dan bersuara saat kamu membuka halamannya, memancarkan energi yang tidak stabil. Jika kamu membaca dari buku ini, tidak akan ada yang tahu mantra apa yang kamu gunakan.
items.artifacts.unstablespellbook.desc_cursed=Buku terkutuk itu menempel padamu dengan sendirinya, menghambat kemampuanmu untuk memakai sebagian besar gulungan.
items.artifacts.unstablespellbook.desc_index=Buku ini belum lengkap. Indeks buku itu saat ini mengacu pada halaman kosong berikut:
items.artifacts.unstablespellbook.desc_empowered=Gulungan yang baru saja kamu tambahkan ke buku bersinar dengan kekuatan. Kamu akan bisa memilih versi khusus dari efek gulungan ini, tapi dengan daya tambahan.
items.artifacts.unstablespellbook.read_empowered=Gulungan yang kamu tambahkan ke buku mantra dialiri dengan energi. Kamu dapat menngeluarkan versi biasa, atau eksotik dari efek gulungan ini.\n\nMemilih varian eksotik akan memakai 2 daya, bukannya 1.



###bags
items.bags.bag.name=tas punggung
items.bags.bag.discover_hint=Item ini bisa dibeli di toko.

items.bags.potionbandolier.name=bandolier ramuan
items.bags.potionbandolier.desc=Bandolier tebal ini dipasang di dada Anda seperti selempang, memiliki banyak tali berinsulasi untuk menampung botol ramuan, kantong air, atau botol logam cair.\n\nSaat berada di dalam bandolier, ramuan Anda terlindung dari dingin.

items.bags.scrollholder.name=tempat gulungan
items.bags.scrollholder.desc=Wadah berbentuk tabung ini sepertinya bekas tempat menyimpan peralatan dan skema seorang ahli astronom, tetapi gulunganmu kelihatannya pas juga di dalamnya. Bahkan ada bagian di samping yang kelihatannya cocok untuk menempatkan kristal-kristal mantra, stylus sihir, dan getah magis.\n\nWadah ini nampaknya tahan api, jadi gulunganmu yang ada di dalam seharusnya aman dari api

items.bags.velvetpouch.name=kantong kecil
items.bags.velvetpouch.desc=Kantong beludru kecil ini bisa menyimpan item-item kecil di dalamnya, seperti benih, batu kuno, dan beberapa bahan peracik.
items.bags.velvetpouch.discover_hint=Salah satu pahlawan berawal dengan item ini.

items.bags.magicalholster.name=sarung ajaib
items.bags.magicalholster.desc=Sarung ramping ini terbuat dari kulit hewan eksotis, dan memiliki sihir yang kuat yang memungkinkannya menyimpan sejumlah besar senjata jarak jauh.\n\nKamu cukup merogoh ke dalam sarung ini dan kamu akan selalu mendapatkan item yang kamu cari.\n\nKarena sihir sarung itu, tongkat sihir akan mengisi ulang sedikit lebih cepat dan senjata jarak jauh akan bertahan sedikit lebih lama di dalamnya.



###bombs
items.bombs.arcanebomb.name=bom sihir
items.bombs.arcanebomb.desc=Bom ini dijiwai dengan sifat magis. Itu akan meledak menjadi ledakan kuat yang mirip dengan serangan pompa Goo, memberikan _%1$d-%2$d damage sihir_ pada apapun dalam radius 2 petak.
items.bombs.arcanebomb.discover_hint=Item ini bisa didapatkan melalui peracikan.

items.bombs.bomb.name=bom
items.bombs.bomb.ac_lightthrow=NYALAKAN & LEMPAR
items.bombs.bomb.snuff_fuse=Kamu dengan cepat mematikan sumbu bom.
items.bombs.bomb.ondeath=Ledakan itu membunuhmu...
items.bombs.bomb.rankings_desc=Terbunuh karena ledakan
items.bombs.bomb.desc=Bom bubuk hitam yang cukup besar. Ledakan dari bom ini menghasilkan _%1$d-%2$d damage_ pada apa pun yang ada di dekatnya, dan akan menghancurkan beberapa medan atau benda di dekatnya.
items.bombs.bomb.desc_fuse=Sepertinya akan membutuhkan beberapa giliran sebelum terbakar setelah itu dinyalakan.
items.bombs.bomb.desc_burning=Bomnya terbakar, jaga jarakmu atau matikan!
items.bombs.bomb$doublebomb.name=dua bom
items.bombs.bomb$doublebomb.desc=Setumpuk dua bom bubuk hitam besar dan kuat, sepertinya kamu dapat satu gratis!

items.bombs.firebomb.name=bom api
items.bombs.firebomb.desc=Bom ini telah dimodifikasi agar meledak dalam area yang lebih luas, menimbulkan _%1$d-%2$d damage_ dan menyebarkan api berkelanjutan dalam radius 2 petak.
items.bombs.firebomb.discover_hint=Item ini bisa didapatkan melalui peracikan.

items.bombs.flashbangbomb.name=bom kilat
items.bombs.flashbangbomb.desc=Bom yang disesuaikan ini akan meledak menjadi ledakan cahaya, suara, dan listrik saat meledak. Apa pun dalam jarak 2 petak akan menerima _%1$d-%2$d damage_ dari ledakan, tambahan 25%% damage dari listrik, dan akan lumpuh selama 10 giliran.
items.bombs.flashbangbomb.discover_hint=Item ini bisa didapatkan melalui peracikan.

items.bombs.frostbomb.name=bom beku
items.bombs.frostbomb.desc=Bom ini telah dimodifikasi agar meledak dalam area yang lebih luas, menimbulkan _%1$d-%2$d damage_ dan menyebarkan hembusan udara dingin yang berkelanjutan dalam radius 2 petak.
items.bombs.frostbomb.discover_hint=Item ini bisa didapatkan melalui peracikan.

items.bombs.holybomb.name=bom suci
items.bombs.holybomb.desc=Bom ini telah dimodifikasi untuk memancarkan cahaya suci di area yang lebih luas saat meledak. Apa pun dalam jarak 2 petak akan menerima _%1$d-%2$d damage_ dari ledakan, dan musuh seperti mayat hidup atau iblis akan menerima tambahan 50%% damage dari cahaya suci.
items.bombs.holybomb.discover_hint=Item ini bisa didapatkan melalui peracikan.

items.bombs.noisemaker.name=pembuat suara
items.bombs.noisemaker.desc=Bom ini disesuaikan ini akan berulang kali membuat suara saat sumbunya habis. Saat sesuatu menyentuhnya, bom itu akan meledak dan memberi _%1$d-%2$d damage_ pada apapun dalam radius 2 petak!
items.bombs.noisemaker.desc_burning=Pembuat suara terus berdetak, itu akan meledak ketika ada sesuatu yang mendekat!
items.bombs.noisemaker.discover_hint=Item ini bisa didapatkan melalui peracikan.

items.bombs.smokebomb.name=bom asap
items.bombs.smokebomb.desc=Bom ini telah dimodifikasi untuk memuntahkan awan gas tebal bersamaan dengan ledakannya. Bom ini akan menimbulkan _%1$d-%2$d damage_ dan menyebarkan kabut tebal dalam radius 2 petak.
items.bombs.smokebomb.discover_hint=Item ini bisa didapatkan melalui peracikan.

items.bombs.regrowthbomb.name=bom pertumbuhan
items.bombs.regrowthbomb.desc=Bom yang disesuaikan ini akan memercikkan cairan pemberi kehidupan di sekelilingnya dalam radius 3 petak alih-alih meledak. Daerah yang terkena ledakan akan dengan cepat menumbuhkan rumput dan tanaman. Dirimu dan sekutu mana pun yang terperangkap dalam ledakan itu akan disembuhkan seperti mereka meminum ramuan penyembuhan.
items.bombs.regrowthbomb.discover_hint=Item ini bisa didapatkan melalui peracikan.

items.bombs.shrapnelbomb.name=Bom pecahan logam
items.bombs.shrapnelbomb.desc=Bom ini telah dimodifikasi dengan serpihan logam DM-300, yang akan pecah dan menyebar kemanapun saat meledak, menghasilkan _%1$d-%2$d damage_ dalam jangkauan yang sangat luas di sekitar bom. Sebaiknya kamu bersembunyi di balik sesuatu saat menggunakannya...
items.bombs.shrapnelbomb.discover_hint=Item ini bisa didapatkan melalui peracikan.

items.bombs.woollybomb.name=bom wol
items.bombs.woollybomb.desc=Bom yang disesuaikan ini akan menciptakan kerumunan domba ajaib yang luas setelah meledak. Ledakan akan menghasilkan _%1$d-%2$d damage_ pada apa pun dalam radius 2 petak. Domba akan menghalangi gerakan dan bertahan untuk waktu yang sangat lama! Namun, domba tidak akan bertahan lama di hadapan musuh yang kuat, dan dapat dihilangkan secara manual lebih cepat dengan berinteraksi dengan mereka.
items.bombs.woollybomb.discover_hint=Item ini bisa didapatkan melalui peracikan.

###food
items.food.berry.name=buah beri terungku
items.food.berry.eat_msg=Buah beri itu rasanya enak!
items.food.berry.desc=Buah beri kecil ini ditemukan oleh Pemburu di antara vegetasi terungku lainnya. Beri ini dapat dimakan dengan cepat, sedikit mengenyangkan, dan mungkin memiliki benih yang bisa dipakai di dalamnya!
items.food.berry.discover_hint=Item ini bisa ditemukan menggunakan bakat pahlawan tertentu.

items.food.blandfruit.name=buah campur
items.food.blandfruit.cooked=buah campur masak
items.food.blandfruit.sunfruit=buah matahari
items.food.blandfruit.rotfruit=buah rot
items.food.blandfruit.earthfruit=buah tanah
items.food.blandfruit.blindfruit=buah buta
items.food.blandfruit.firefruit=buah api
items.food.blandfruit.icefruit=buah es
items.food.blandfruit.fadefruit=buah hilang
items.food.blandfruit.sorrowfruit=buah kesedihan
items.food.blandfruit.stormfruit=buah badai
items.food.blandfruit.dreamfruit=buah sihir
items.food.blandfruit.starfruit=buah bintang
items.food.blandfruit.swiftfruit=buah lincah
items.food.blandfruit.raw=Kau tidak dapat memakannya mentah-mentah.
items.food.blandfruit.desc=Sangat kering dan tidak berisi, mungkin memasaknya dengan bahan lain dapat meningkatkan kualitasnya.
items.food.blandfruit.desc_cooked=Buah itu telah mengenyal seraya terendam di dalam pot dan bahkan telah menyerap sifat dari benih yang dimasak bersamanya. Buah itu akan memiliki efek ramuan apapun yang berhubungan dengan benih tersebut.
items.food.blandfruit.desc_eat=Kelihatan sudah siap disantap!
items.food.blandfruit.desc_throw=Kelihatan sedikit bergejolak, lebih baik dilempar saja.
items.food.blandfruit$chunks.name=bongkahan buah campur
items.food.blandfruit$chunks.desc=Buah campur telah meledak karena benturan, meninggalkan secuil sisanya.\n\nMeskipun sedikit kotor, secuil bongkahan buah campur yang matang itu terlihat bisa dimakan.

items.food.chargrilledmeat.name=daging panggang
items.food.chargrilledmeat.desc=Kelihatannya seperti steak.
items.food.chargrilledmeat.discover_hint=Item ini bisa dibuat menggunakan item makanan lain.

items.food.food.name=jatah makanan
items.food.food.ac_eat=MAKAN
items.food.food.eat_msg=Makanan itu sangat enak!
items.food.food.desc=Tidak ada yang mewah: daging kering, beberapa biskuit - hal-hal seperti itu.

items.food.frozencarpaccio.name=carpaccio beku
items.food.frozencarpaccio.invis=Kau melihat tanganmu jadi tembus pandang!
items.food.frozencarpaccio.hard=Kau merasa kulitmu mengeras!
items.food.frozencarpaccio.refresh=Menyegarkan!
items.food.frozencarpaccio.better=Kau merasa lebih baik!
items.food.frozencarpaccio.desc=Ini adalah sepotong daging mentah beku. Satu-satunya cara untuk memakannya adalah dengan memotongnya tipis-tipis. Dan ternyata rasanya enak.
items.food.frozencarpaccio.discover_hint=Item ini bisa dibuat menggunakan item makanan lain.

items.food.meatpie.name=pie daging
items.food.meatpie.eat_msg=Makanan itu luar biasa!
items.food.meatpie.desc=Pie lezat yang diisi dengan daging gurih. Ini akan membuatmu kenyang lebih dari makanan lainnya.
items.food.meatpie.discover_hint=Item ini bisa didapatkan melalui peracikan.

items.food.mysterymeat.name=daging misteri
items.food.mysterymeat.eat_msg=Makanan itu rasanya... aneh.
items.food.mysterymeat.hot=Aduh itu panas!
items.food.mysterymeat.legs=Kau tidak dapat merasakan kakimu!
items.food.mysterymeat.not_well=Kau merasa tidak enak.
items.food.mysterymeat.stuffed=Kau terisi.
items.food.mysterymeat.desc=Makan dengan resikomu sendiri!
items.food.mysterymeat.discover_hint=Item ini dijatuhkan oleh musuh tertentu.
items.food.mysterymeat$placeholder.name=daging

items.food.phantommeat.name=daging hantu
items.food.phantommeat.desc=Sebuah steak besar yang berkilauan dan translusen, dipotong dari seekor piranha hantu. Daging ajaib ini tidak perlu dimasak dan memberikan berbagai keuntungan defensif disamping membuatmu kenyang sepenuhnya. Ketika dimakan, daging ini memberikan efek tembus pandang, kulit kayu, sedikit penyembuhan, dan menghapus banyak efek berbahaya.
items.food.phantommeat.discover_hint=Item ini dijatuhkan oleh musuh tertentu.

items.food.pasty.name=pastel
items.food.pasty.fish_name=ikan kukus
items.food.pasty.amulet_name=jimat Yendor?
items.food.pasty.egg_name=telur paskah
items.food.pasty.rainbow_name=ramuan pelangi
items.food.pasty.shattered_name=kue hijau
items.food.pasty.pie_name=pai labu
items.food.pasty.vanilla_name=kue biru
items.food.pasty.cane_name=permen tongkat
items.food.pasty.sparkling_name=ramuan berkilau
items.food.pasty.desc=Ini adalah Pastel Cornish asli dengan isian tradisional dari daging sapi dan kentang. Lezat!
items.food.pasty.fish_desc=Ikan kukus utuh, diawetkan secara ajaib di atas hamparan sayuran.  Merupakan tradisi untuk menyimpan beberapa ikan untuk nanti di sepanjang tahun ini, jadi Anda akan menyimpan sisa ikan daripada memakannya sekaligus.\n\nSelamat Malam Tahun Baru!
items.food.pasty.amulet_desc=Anda akhirnya menemukannya, jimat - tunggu dulu, ini hanyalah coklat terbungkus kertas timah yang dibuat agar terlihat seperti jimat! Itu tidak akan memberimu kekuatan tanpa batas, tapi setidaknya itu akan membuatmu kenyang dan memberimu sedikit daya artefak.\n\nApril Mop!
items.food.pasty.egg_desc=Telur coklat besar yang besar, dibungkus dengan kertas kuning berwarna-warni. Ada cukup banyak coklat di sini untuk membuatmu kenyang, dan gula mungkin memberi sedikit daya tambahan pada artefak kamu. \n\nSelamat Hari Paskah!
items.food.pasty.rainbow_desc=Ramuan penuh warna ini seperti makanan cair. Selain dapat memuaskan rasa lapar, dia memiliki kekuatan untuk menenangkan musuh musuh non-bos yang berdekatan, membuat mereka ragu-ragu untuk melawanmu \n\nBerbahagialah untuk Sementara!
items.food.pasty.shattered_desc=Potongan besar kue vanilla ini memiliki taburan dan krim bewarna hijau. Kue ini dibuat untuk merayakan pengalaman bertahun-tahun, dan akan memberikan sedikit dari pengalaman tersebut saat dimakan.\n\nShattered Pixel Dungeon pertama kali dirilis pada 5 Agustus 2014. Selamat ulang tahun Shattered Pixel Dungeon!
items.food.pasty.pie_desc=Potongan besar pie labu! Rasanya yang manis dan pedas akan membuatmu kenyang dan memberimu sedikit darah.\n\nSelamat Halloween!
items.food.pasty.vanilla_desc=Potongan besar kue vanilla ini memiliki taburan dan krim bewarna biru. Kue ini dibuat untuk merayakan pengalaman bertahun-tahun, dan akan memberikan sedikit dari pengalaman tersebut saat dimakan.\n\nPixel Dungeon pertama kali dirilis pada 4 Desember 2012. Selamat ulang tahun Pixel Dungeon!
items.food.pasty.cane_desc=Permen tongkat raksasa yang manis. Permen itu cukup besar untuk dapat membuatmu kenyang, dan gulanya mungkin memberikan tongkat sihirmu sedikit daya tambahan juga.\n\nSelamat Berlibur!
items.food.pasty.sparkling_desc=Ramuan berkilau ini adalah sejenis makanan cair. Memuaskan rasa lapar dan mensimulasikan anggur soda, namun tidak mengandung alkohol. Rasa hangat di perutmu akan memberimu sedikit perlindungan.\n\nSelamat tahun baru!
items.food.pasty$fishleftover.name=ikan sisa
items.food.pasty$fishleftover.eat_msg=Rasa makanan itu oke.
items.food.pasty$fishleftover.desc=Beberapa sisa ikan dari makananmu sebelumnya. Kamu bisa memakannya kapanpun kamu mau untuk mengurangi sedikit rasa lapar.

items.food.smallration.name=jatah makanan kecil
items.food.smallration.eat_msg=Rasa makanan itu oke.
items.food.smallration.desc=Kelihatan seperti jatah makanan biasa tetapi lebih kecil.
items.food.smallration.discover_hint=Item ini bisa dibeli di toko.

items.food.stewedmeat.name=daging rebus
items.food.stewedmeat.eat_msg=Rasa makanan itu oke.
items.food.stewedmeat.desc=Dengan merebus daging, maka daging ini bersih dari segala penyakit atau parasit. Daging ini aman dikonsumsi.
items.food.stewedmeat.discover_hint=Item ini bisa didapatkan melalui peracikan.

items.food.supplyration.name=suplai makanan
items.food.supplyration.desc=Jatah makanan ini ditinggalkan di terungku oleh dan untuk anggota kelompok pencuri. itu dirancang khusus untuk dimakan saat perjalanan, dan membantu dalam kejahatan.\n\nmeskipun itu tidak membuatmu kenyang seperti makanan biasa, makanan ini dapat dimakan dengan cepat, memberikan sedikit penyembuhan dan akan mengisi daya ke jubah bayangan milik Pengembara.
items.food.supplyration.discover_hint=Item ini bisa ditemukan menggunakan bakat pahlawan tertentu.



##journal items
items.journal.documentpage.name=halaman yang robek
items.journal.documentpage.desc=Sehelai kertas, mungkin dirobek dari buku atau sejenisnya. Kau harus memungutnya untuk dapat membacanya.

items.journal.alchemypage.name=halaman sobek buku racikan
items.journal.alchemypage.desc=Halaman robek dari buku panduan tentang peracikan.\n\nSebagian besar teks terlalu kecil untuk dibaca dari kejauhan, tetapi kau dapat melihat judul halaman:\n\n_"%s"_

items.journal.guidebook.name=kitab penguasaan terungku
items.journal.guidebook.hint_mobile=Buku panduan kamu berisi saran untukmu! Ketuk tombol jurnal yang menyala di kanan atas untuk membacanya.
items.journal.guidebook.hint_desktop=Buku panduan kamu berisi saran untukmu! Pilih tombol jurnal yang menyala (%s) di kanan atas untuk membacanya.
items.journal.guidebook.hint_status=Buku Panduan
items.journal.guidebook.desc=Buku panduan petualang, ditinggalkan di sini oleh seseorang yang memutuskan berpetualang bukan untuk mereka! Buku khusus ini ajaib, dan dapat mendorong para petualang untuk membaca halaman pada saat yang tepat.\n\nTerlepas dari fungsi itu, buku ini paling populer karena kata-kata besar "Jangan Panik!" ditulis dengan huruf besar yang ramah di sampulnya.

items.journal.guidepage.name=halaman buku panduan yang robek
items.journal.guidepage.desc=Halaman yang robek dari sebuah buku panduan berpetualang.\n\nHampir semua teks terlalu kecil untuk dibaca dari kejauhan, tapi kau dapat membaca judul dari halaman itu:\n\n_"%s"_

items.journal.regionlorepage$sewers.name=surat usang
items.journal.regionlorepage$sewers.desc=Yang kelihatannya seperti sebuah surat, yang ditulis pada selembar kertas yang ternodai tanah. Kamu harus mengambilnya untuk dapat melihat apa yang tertulis di atasnya.

items.journal.regionlorepage$prison.name=catatan jurnal usang
items.journal.regionlorepage$prison.desc=Catatan jurnal, atau jenis catatan lain, yang ditulis di selembar kertas lama. Tampaknya bernasib lebih baik daripada huruf yang Anda temukan di selokan, tetapi Anda masih harus mengambilnya untuk membacanya.

items.journal.regionlorepage$caves.name=buku catatan tua
items.journal.regionlorepage$caves.desc=Apa yang tampak seperti sebuah catatan dalam buku catatan seorang penjelajah, ternyata terpelihara dengan baik meskipun usianya sudah lama. Ambil untuk membacanya.

items.journal.regionlorepage$city.name=tablet berkarat
items.journal.regionlorepage$city.desc=Sebuah tablet logam kecil yang berkarat dengan sebuah pesan yang terukir secara ajaib di permukaannya. Tulisannya masih jelas untuk dibaca meskipun usia tablet yang sudah tua, tetapi kamu harus mengambilnya untuk membacanya.

items.journal.regionlorepage$halls.name=tablet bercahaya
items.journal.regionlorepage$halls.desc=Sebuah tablet hitam kecil dengan tulisan hijau bercahaya terukir di permukaannya. Tulisan bercahayanya terlihat kabur dari kejauhan, kau harus mengambilnya untuk membacanya.


###keys
items.keys.goldenkey.name=kunci emas
items.keys.goldenkey.desc=Ukiran di ujung kunci emas ini sangat kecil dan rumit. Mungkin dapat membuka peti yang terkunci?

items.keys.crystalkey.name=Kunci kristal
items.keys.crystalkey.desc=Permukaan potongan kunci kristal ini berkilau dalam kegelapan. Mungkin itu akan membuka sesuatu yang terbuat dari kristal?

items.keys.ironkey.name=kunci besi
items.keys.ironkey.desc=Ukiran di kunci besi kuno ini bagus; tali kulitnya sudah dimakan waktu. Pintu apa yang dapat dibuka dengan ini?

items.keys.wornkey.name=kunci usang
items.keys.wornkey.desc=Kunci ini sudah usang dan warnanya pudar, tetapi terlihat serius. Mungkin kunci ini bisa membuka pintu penting di dekat sini.



###potions
items.potions.potion.ac_drink=MINUM
items.potions.potion.turquoise=ramuan pirus
items.potions.potion.crimson=ramuan merah
items.potions.potion.azure=ramuan biru
items.potions.potion.jade=ramuan hijau
items.potions.potion.golden=ramuan emas
