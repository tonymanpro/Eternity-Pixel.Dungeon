items.wands.cursedwand.mass_invuln=Cahaya terang memancar dari tongkat sihirmu!
items.wands.cursedwand.petrify=Anda tiba - tiba membeku di tempat!
items.wands.cursedwand.grass=Rerumputan tumbuh di sekitarmu!
items.wands.cursedwand.fire=Kau mencium sesuatu terbakar...
items.wands.cursedwand.transmogrify_wand=Tongkat sihirmu berubah menjadi item yang berbeda!
items.wands.cursedwand.transmogrify_other=Item-mu berubah menjadi sesuatu yang berbeda!
items.wands.cursedwand.disguise=Penampilanmu berubah di depan matamu!
items.wands.cursedwand.supernova=Bola energi yang membara mulai membesar. Kamu mungkin ingin lari!
items.wands.cursedwand.supernova_positive=Bola energi yang membara mulai membesar, tapi entah mengapa terasa aman.
items.wands.cursedwand.sinkhole=Permukaan tanah mulai memberi jalan di sekitarmu!
items.wands.cursedwand.sinkhole_positive=Tanah mulai runtuh, tetapi terasa cukup kokoh di bawahmu.
items.wands.cursedwand.gravity=Gravitasi tiba-tiba mulai menarik ke arah acak!
items.wands.cursedwand.gravity_positive=Gravitasi tiba-tiba mulai menarik ke arah acak, tetapi hal ini tampaknya tidak memengaruhimu.
items.wands.cursedwand.gravity_end=Kekacauan gravitasi berakhir.

