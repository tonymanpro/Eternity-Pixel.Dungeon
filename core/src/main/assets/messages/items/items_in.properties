items.weapon.missiles.missileweapon.has_broken=Salah satu dari senjata jarak jauhmu telah rusak.
items.weapon.missiles.missileweapon.dust=Senjata lempar hancur menjadi debu saat kamu menyentuhnya.
items.weapon.missiles.missileweapon.break_upgraded_warn_desc=Jika senjata lempar terakhir di set senjata lemparmu yang ditingkatkan rusak, set tersebut akan hilang secara permanen. Yakin ingin melemparnya?
