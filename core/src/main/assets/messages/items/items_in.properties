items.weapon.melee.quarterstaff.ability_name=jurus bertahan
items.weapon.melee.quarterstaff.typical_ability_desc=Duelis dapat mengambil _jurus bertahan_ dengan quarterstaff. Jurus ini tidak membutuhkan waktu untuk diaktifkan dan biasanya meningkatkan penghindarannya tiga kali lipat selama _%d giliran._
items.weapon.melee.quarterstaff.ability_desc=Duelist dapat mengambil _jurus bertahan_ dengan quarterstaff.  Jurus ini tidak membutuhkan waktu untuk diaktifkan dan meningkatkan penghindarannya tiga kali lipat selama _%d giliran._
items.weapon.melee.quarterstaff.upgrade_ability_stat_name=Durasi Kemampuan
items.weapon.melee.quarterstaff.desc=Tongkat kayu keras, diakhiri dengan sebongkah besi.
items.weapon.melee.quarterstaff$defensivestance.name=jurus bertahan
items.weapon.melee.quarterstaff$defensivestance.desc=Duelis sedang menggunakan quarterstaff miliknya untuk menolak serangan dan proyektil yang datang. Selama dia dalam jurus ini, penghindarannya terhadap semua serangan meningkat hingga tiga kali lipat.\n\nGiliran tersisa: %s.

items.weapon.melee.rapier.name=rapier
items.weapon.melee.rapier.stats_desc=Senjata ini menahan 0-1 damage.
items.weapon.melee.rapier.ability_name=tusuk
items.weapon.melee.rapier.typical_ability_desc=Duelis dapat _menusuk_ dengan rapier ke arah musuh yang berjarak 1 petak. Ini bergerak ke arah musuh, biasanya menimbulkan _%1$d-%2$d damage_, dan dijamin kena.
items.weapon.melee.rapier.ability_desc=Duelis dapat _menusuk_ dengan rapier ke arah musuh yang berjarak 1 petak. Ini bergerak ke arah musuh, menimbulkan _%1$d-%2$d damage_, dan dijamin kena.
items.weapon.melee.rapier.desc=Pedang lurus ramping yang menawarkan perlindungan dengan imbalan kekuatan tebasan yang lebih sedikit.
items.weapon.melee.rapier.discover_hint=Salah satu pahlawan berawal dengan item ini.

items.weapon.melee.roundshield.name=tameng bulat
items.weapon.melee.roundshield.typical_stats_desc=Biasanya senjata ini menahan 0-%d damage. Penahanan ini berskala dengan peningkatan.
items.weapon.melee.roundshield.stats_desc=Senjata ini menahan 0-%d damage. Jumlah pertahanan bertambah seiring dengan peningkatan.
items.weapon.melee.roundshield.ability_name=tahan
items.weapon.melee.roundshield.typical_ability_desc=Duelis dapat _menahan_ dirinya sendiri dengan tameng bulat, sepenuhnya meniadakan semua serangan fisik atau magis yang biasanya dilakukan terhadapnya selama _%d giliran_. Setelah Duelis memblokir serangan, menyerang balik atau menggunakan sihir akan mengakhiri pertahanan.
items.weapon.melee.roundshield.ability_desc=Duelis dapat _menahan_ dirinya sendiri dengan tameng bulat, sepenuhnya meniadakan semua serangan fisik atau magis yang dilakukan terhadapnya selama _%d giliran_. Setelah Duelis memblokir serangan, menyerang balik atau menggunakan sihir akan mengakhiri pertahanan.
items.weapon.melee.roundshield.upgrade_ability_stat_name=Durasi Kemampuan
items.weapon.melee.roundshield.desc=Tameng besar ini secara efektif menahan serangan dan menjadi senjata yang berguna saat darurat.
items.weapon.melee.roundshield$guardtracker.name=menahan
items.weapon.melee.roundshield$guardtracker.guarded=ketahan
items.weapon.melee.roundshield$guardtracker.desc=Duelis telah menyiapkan tamengnya untuk mengantisipasi serangan yang datang. Serangan fisik atau magis berikutnya yang dilakukan terhadapnya akan ditiadakan sepenuhnya.\n\nGiliran tersisa: %s.

items.weapon.melee.runicblade.name=pedang kuno
items.weapon.melee.runicblade.stats_desc=Senjata ini lebih menguntungkan dari peningkatan.
items.weapon.melee.runicblade.ability_name=tebasan rahasia
items.weapon.melee.runicblade.typical_ability_desc=Duelis melakukan _tebasan kuno_ dengan pedang kuno. Serangan ini dijamin kena dan biasanya menimbulkan _%d%% kekuatan enchantment._
items.weapon.melee.runicblade.ability_desc=Duelis melakukan _tebasan kuno_ dengan pedang kuno. Serangan ini dijamin kena dan menimbulkan _%d%% kekuatan enchantment._
items.weapon.melee.runicblade.upgrade_ability_stat_name=Kekuatan Kemampuan
items.weapon.melee.runicblade.desc=Senjata misterius dari daratan yang jauh, dengan pedang yang berwarna biru terang.

items.weapon.melee.sai.name=sai
items.weapon.melee.sai.stats_desc=Ini adalah senjata yang sangat cepat.
items.weapon.melee.sai.ability_name=serangan kombo
items.weapon.melee.sai.typical_ability_desc=Duelis dapat melakukan _serangan kombo_ dengan sai. Serangan ini dijamin kena dan biasanya memberikan _+%d damage_ setiap kali Duelis mengenai sasaran dengan senjata jarak dekat biasa atau senjata lempar. Tidak menyerang dalam 5 giliran mengulang kombo ini.
items.weapon.melee.sai.ability_desc=Duelis dapat melakukan _serangan kombo_ dengan sai. Serangan ini dijamin kena dan memberikan _+%d damage_ setiap kali Duelis mengenai sasaran dengan senjata jarak dekat biasa atau senjata lempar. Tidak menyerang dalam 5 giliran mengulang kombo ini.
items.weapon.melee.sai.desc=Dua pedang tipis yang diperuntukkan untuk dipakai di kedua tangan. Sangat baik untuk merobohkan musuh dengan serangan yang cepat.
items.weapon.melee.sai$combostriketracker.name=serangan kombo
items.weapon.melee.sai$combostriketracker.desc=Duelis membangun kombo yang dapat digunakan untuk meningkatkan damage kemampuan serangan kombo. Setiap serangan jarak dekat biasa atau serangan senjata lempar yang berhasil akan dihitung, tapi saat tidak berhasil menyerang selama 5 giliran akan mereset kombo ini.\n\nSerangan saat ini: %1$d.\nGiliran hingga serangan hilang: %2$s.

items.weapon.melee.scimitar.name=simitar
items.weapon.melee.scimitar.stats_desc=Senjata ini cukup cepat.
items.weapon.melee.scimitar.ability_name=tarian pedang
items.weapon.melee.scimitar.typical_ability_desc=Duelist dapat melakukan _tarian pedang_ dengan simitar. Jurus ini tidak membutuhkan waktu lama untuk diaktifkan dan memberi Duelist +60%% kecepatan serangan dan +50%% akurasi biasanya untuk _%d giliran._
items.weapon.melee.scimitar.ability_desc=Duelist dapat melakukan _tarian pedang_ dengan simitar. Jurus ini tidak membutuhkan waktu lama untuk diaktifkan dan memberi Duelist +60%% kecepatan serangan dan +50%% akurasi untuk _%d giliran._
items.weapon.melee.scimitar.upgrade_ability_stat_name=Durasi Kemampuan
items.weapon.melee.scimitar.desc=Pedang melengkung yang tebal. Bentuknya memungkinkan untuk serangan lebih cepat, tapi membuatnya lebih lemah.
items.weapon.melee.scimitar$sworddance.name=tarian pedang
items.weapon.melee.scimitar$sworddance.desc=Duelis melakukan serangan cepat berdasarkan momentum dalam semacam tarian. Saat jurus ini aktif, dia menyerang 60%% lebih cepat (cukup untuk menyerang tepat dua kali putaran dengan simitar) dan memiliki akurasi +50%%.\n\nGiliran tersisa: %s.

items.weapon.melee.sickle.name=sabit
items.weapon.melee.sickle.stats_desc=ini adalah senjata yang tidak akurat
items.weapon.melee.sickle.ability_name=panen
items.weapon.melee.sickle.typical_ability_desc=Duelis dapat _memanen_ musuh dengan sabit. Serangan dahsyat ini dijamin mengenai sasaran dan biasanya menghasilkan _%d damage_. Damage ini diterapkan sebagai pendarahan jika target tidak kebal.
items.weapon.melee.sickle.ability_desc=Duelis dapat _memanen_ musuh dengan sabit. Serangan dahsyat ini dijamin mengenai sasaran dan menghasilkan _%d damage_. Damage ini diterapkan sebagai pendarahan jika target tidak kebal.
items.weapon.melee.sickle.desc=Alat pertanian genggam yang bisa berfungsi ganda sebagai senjata yang kuat namun berat.

items.weapon.melee.spear.name=tombak
items.weapon.melee.spear.stats_desc=Senjata ini lumayan berat.\nSenjata ini mempunyai jangkauan ekstra.
items.weapon.melee.spear.ability_name=tancap
items.weapon.melee.spear.typical_ability_desc=Duelis dapat menggunakan ujung tombak untuk _menancap_ musuh yang berada dalam jangkauan tetapi tidak berdekatan. Ini biasanya memberikan _%1$d-%2$d damage_, mendorong musuh ke belakang, dan dijamin kena.
items.weapon.melee.spear.ability_desc=Duelis dapat menggunakan ujung tombak untuk _menancap_ musuh yang berada dalam jangkauan tetapi tidak berdekatan. Ini memberikan _%1$d-%2$d damage_, mendorong musuh ke belakang, dan dijamin kena.
items.weapon.melee.spear.desc=Kayu panjang ramping berujung besi tajam.

items.weapon.melee.sword.name=pedang
items.weapon.melee.sword.ability_name=membelah
items.weapon.melee.sword.typical_ability_desc=Duelis dapat _membelah_ musuh dengan pedang. Ini biasanya menimbulkan _%1$d-%2$d damage_ dan dijamin kena. Jika membelah dapat membunuh musuh itu akan terjadi seketika Duelis dapat membelah lagi dalam 5 giliran secara gratis.
items.weapon.melee.sword.ability_desc=Duelis dapat _membelah_ musuh dengan pedang. Ini menimbulkan _%1$d-%2$d damage_ dan dijamin kena. Jika membelah dapat membunuh musuh itu akan terjadi seketika Duelis dapat membelah lagi dalam 5 giliran secara gratis.
items.weapon.melee.sword.desc=Pedang yang seimbang. Tidak terlalu besar, tapi tetap lebih panjang dari pedang pendek.
items.weapon.melee.sword$cleavetracker.name=membelah
items.weapon.melee.sword$cleavetracker.desc=Duelis siap melanjutkan pembelahan sebelumnya. Pembelahan berikutnya tidak akan memakan daya kemampuan senjata apa pun.\n\nGiliran tersisa: %s.

items.weapon.melee.warhammer.name=palu perang
items.weapon.melee.warhammer.stats_desc=Senjata ini lumayan akurat.
items.weapon.melee.warhammer.ability_name=pukulan keras
items.weapon.melee.warhammer.typical_ability_desc=Duelis dapat melakukan sebuah _pukulan keras_ dengan palu tempur. Serangan terkonsentrasi ini biasanya menimbulkan _%1$d-%2$d damage_ dan efek pusing selama 5 giliran yang mana mengurangi akurasi dan penghindaran sebanyak 50%%. Pukulan keras selalu kena tapi menimbulkan damage biasa jika tidak mengejutkan musuh.
items.weapon.melee.warhammer.ability_desc=Duelis dapat melakukan sebuah _pukulan keras_ dengan palu tempur. Serangan terkonsentrasi ini menimbulkan _%1$d-%2$d damage_ dan efek pusing selama 5 giliran yang mana mengurangi akurasi dan penghindaran sebanyak 50%%. Pukulan keras selalu kena tapi menimbulkan damage biasa jika tidak mengejutkan musuh.
items.weapon.melee.warhammer.desc=Beberapa makhluk tidak dapat menahan pukulan menghancurkan dari besi padat dan tinggi ini, tapi senjata ini membutuhkan kekuatan yang besar untuk dapat memakainya dengan baik.

items.weapon.melee.warscythe.name=sabit perang
items.weapon.melee.warscythe.stats_desc=ini adalah senjata yang tidak akurat
items.weapon.melee.warscythe.ability_name=panen
items.weapon.melee.warscythe.typical_ability_desc=Duelis dapat _memanen_ musuh dengan sabit perang. Serangan dahsyat ini dijamin mengenai sasaran dan biasanya menghasilkan _%d damage_. Damage ini diterapkan sebagai pendarahan jika target tidak kebal.
items.weapon.melee.warscythe.ability_desc=Duelis dapat _memanen_ musuh dengan sabit perang. Serangan dahsyat ini dijamin mengenai sasaran dan menghasilkan _%d damage_. Damage ini diterapkan sebagai pendarahan jika target tidak kebal.
items.weapon.melee.warscythe.desc=Alat yang besar dan berat ini telah diperkuat agar lebih baik dalam menebas musuh daripada tanaman.

items.weapon.melee.whip.name=cambuk
items.weapon.melee.whip.stats_desc=Senjata ini memiliki jangkauan yang sangat jauh.
items.weapon.melee.whip.ability_name=libas
items.weapon.melee.whip.typical_ability_desc=Duelist dapat _meliibaskan_ semua musuh di sekitarnya dengan cambuk. Kemampuan ini biasanya menimbulkan _%1$d-%2$d damage_, menyerang semua musuh dalam jangkauan serangan, dan dijamin kena.
items.weapon.melee.whip.ability_desc=Duelist dapat _meliibaskan_ semua musuh di sekitarnya dengan cambuk. Kemampuan ini menimbulkan _%1$d-%2$d damage_, menyerang semua musuh dalam jangkauan serangan, dan dijamin kena.
items.weapon.melee.whip.desc=Sementara tali di ujung senjata ini menghasilkan damage yang sangat kecil, tapi jangkauannya bukan main.

items.weapon.melee.wornshortsword.name=pedang pendek usang
items.weapon.melee.wornshortsword.ability_name=membelah
items.weapon.melee.wornshortsword.typical_ability_desc=Duelis dapat _membelah_ musuh dengan pedang pendek usang. Ini biasanya menimbulkan _%1$d-%2$d damage_ dan dijamin kena. Jika membelah dapat membunuh musuh itu akan terjadi seketika Duelis dapat membelah lagi dalam 5 giliran secara gratis.
items.weapon.melee.wornshortsword.ability_desc=Duelis dapat _membelah_ musuh dengan pedang pendek usang. Ini menimbulkan _%1$d-%2$d damage_ dan dijamin kena. Jika membelah dapat membunuh musuh itu akan terjadi seketika Duelis dapat membelah lagi dalam 5 giliran secara gratis.
items.weapon.melee.wornshortsword.desc=Pedang yang cukup pendek, telah usang karena pemakaian yang berlebihan. Pedang pendek ini lebih lemah dan lebih ringan dari pada pedang pendek dengan kondisi yang baik.
items.weapon.melee.wornshortsword.discover_hint=Salah satu pahlawan berawal dengan item ini.


###missile weapons
items.weapon.missiles.darts.adrenalinedart.name=anak panah adrenalin
items.weapon.missiles.darts.adrenalinedart.desc=Anak panah ini telah dilumuri oleh senyawa dari bunga lincah yang akan meningkatkan kecepatan gerakan dan serangan dari sekutu, atau juga bisa untuk menurunkan kecepatan gerak dari musuh. Anak panahnya sendiri tetap akan bisa menyakiti musuh, tapi tidak akan menyakiti sekutu.

items.weapon.missiles.darts.blindingdart.name=anak panah pembuta
items.weapon.missiles.darts.blindingdart.desc=Anak panah itu dilumuri dengan senyawa dari rumput buta yang akan membutakan target dalam sejenak. Anak panah itu tidak membuat pusing, jadi musuh masih tau di mana mereka terakhir melihatmu.

items.weapon.missiles.darts.chillingdart.name=anak panah dingin
items.weapon.missiles.darts.chillingdart.desc=Semua anak panah ini dilumuri dengan senyawa dari tanaman kantung es yang secara signifikan akan mendinginkan target.

items.weapon.missiles.darts.cleansingdart.name=anak panah pembersih
items.weapon.missiles.darts.cleansingdart.desc=Anak panah ini dilengkapi dengan senyawa berbasis mageroyal yang untuk sementara akan membuat sekutu kebal terhadap semua efek negatif, atau akan membersihkan efek positif dari musuh.  Musuh bahkan mungkin sempat lupa bahwa mereka sedang menyerang atau melarikan diri dari Anda.  Anak panah itu sendiri masih berbahaya bagi musuh, namun tidak akan membahayakan sekutu.

items.weapon.missiles.darts.dart.name=anak panah
items.weapon.missiles.darts.dart.ac_tip=LUMURI
items.weapon.missiles.darts.dart.prompt=Pilih sebuah benih
items.weapon.missiles.darts.dart.tip_title=Anak Panah Berlumur
items.weapon.missiles.darts.dart.tip_desc=Benih dapat dikombinasikan dengan satu atau dua anak panah untuk dilumuri ujungnya. Setiap jenis benih menghasilkan jenis anak panahnya sendiri, dengan efek sekali pakai yang unik.\n\nMelumuri anak panah dengan benih ini akan menghasilkan _%s._
items.weapon.missiles.darts.dart.tip_all=lumuri %1$d ujung anak panah dengan %2$d benih
items.weapon.missiles.darts.dart.tip_two=lumuri 2 ujung anak panah dengan 1 benih
items.weapon.missiles.darts.dart.tip_one=lumuri 1 ujung anak panah dengan 1 benih
items.weapon.missiles.darts.dart.tip_cancel=batal
items.weapon.missiles.darts.dart.desc=Duri logam sederhana itu dibuat sedemikian rupa agar dapat terbang menghantam musuh dengan usaha yang kecil. Anak panah ini sendiri dapat dibalut dari esensi benih untuk mendapatkan efek bonus saat dilempar.
items.weapon.missiles.darts.dart.unlimited_uses=Karena konstruksinya yang sederhana, anak panah ini akan bertahan secara efektif selamanya.

items.weapon.missiles.darts.displacingdart.name=anak panah pemindah
items.weapon.missiles.darts.displacingdart.desc=Semua anak panah ini dilumuri dengan senyawa dari daun hilang yang akan men-teleport target ke lokasi sekitar.

items.weapon.missiles.darts.healingdart.name=anak panah penyembuh
items.weapon.missiles.darts.healingdart.desc=Semua anak panah ini dilumuri dengan senyawa dari rumput matahari yang akan memberikan penyembuhan bagi targetnya. Anak panahnya itu sendiri tentu saja tetap berbahaya bagi musuh, tetapi tidak akan menyakiti sekutu.

items.weapon.missiles.darts.holydart.name=anak panah suci
items.weapon.missiles.darts.holydart.desc=Anak panah ini telah dilumuri oleh senyawa dari bunga bintang yang menanamkan energi suci kepada targetnya. Sekutu dan musuh biasa akan diberkati, tapi musuh iblis dan mayat hidup akan mendapatkan damage yang besar. Anak panahnya sendiri tetap akan bisa menyakiti musuh, tapi tidak akan menyakiti sekutu.

items.weapon.missiles.darts.incendiarydart.name=anak panah pembakar
items.weapon.missiles.darts.incendiarydart.desc=Semua anak panah itu dilumuri dengan senyawa dari tanaman api yang akan meledak menjadi api ketika tersentuh sesuatu.

items.weapon.missiles.darts.paralyticdart.name=anak panah pelumpuh
items.weapon.missiles.darts.paralyticdart.desc=Anak panah itu di dilumuri oleh senyawa dari benih akar tanah yang mana akan membuat target yang kena menjadi lumpuh sejenak.

items.weapon.missiles.darts.poisondart.name=anak panah racun
items.weapon.missiles.darts.poisondart.desc=Semua anak panah ini dilumuri dengan senyawa dari lumut kesedihan yang akan meracuni target.

items.weapon.missiles.darts.rotdart.name=anak panah busuk
items.weapon.missiles.darts.rotdart.desc=Ujung dari anak panah yang berbahaya ini dilumuri dengan senyawa dari rotberry, yang mana akan melahap apa saja yang terkena anak panah ini secara agresif. Musuh yang kuat akan sedikit kebal dengan efek ini, tapi kekuatan korosinya cukup iuntuk membunuh musuh biasa. Anak panah ini tahan lebih lama dari pada anak panah lainnya, tapi daya tahannya tidak dapat ditingkatkan lagi.
items.weapon.missiles.darts.rotdart.discover_hint=Kamu dapat membuat item ini menggunakan benih dari misi tertentu.

items.weapon.missiles.darts.shockingdart.name=anak panah pengejut
items.weapon.missiles.darts.shockingdart.desc=Semua anak panah ini dilumuri dengan senyawa dari jalar badai yang akan memberikan kejutan pada target.

items.weapon.missiles.darts.tippeddart.ac_clean=BERSIHKAN
items.weapon.missiles.darts.tippeddart.clean_title=Anak Panah Bersih
items.weapon.missiles.darts.tippeddart.clean_desc=Tindakan ini akan menghilangkan ujung benih pada anak panahmu, mengembalikannya ke anak panah biasa.
items.weapon.missiles.darts.tippeddart.clean_all=bersihkan semua
items.weapon.missiles.darts.tippeddart.clean_one=bersihkan satu
items.weapon.missiles.darts.tippeddart.cancel=batal
items.weapon.missiles.darts.tippeddart.uses_left=Ujung anak panah ini dapat dipakai _%d/%d_ kali lagi sebelum habis.
items.weapon.missiles.darts.tippeddart.unlimited_uses=_Tetapi ini berkualitas tinggi sehingga efektif bertahan selamanya._
items.weapon.missiles.darts.tippeddart.about_to_break=Ujung anak panah mu akan segera habis.
items.weapon.missiles.darts.tippeddart.has_broken=Ujung anak panah mu telah habis.
items.weapon.missiles.darts.tippeddart.discover_hint=Kamu dapat membeli barang ini di toko, atau membuatnya menggunakan benih.


items.weapon.missiles.bolas.name=bolas
items.weapon.missiles.bolas.stats_desc=Senjata ini memberikan efek pincang pada targetnya.
items.weapon.missiles.bolas.desc=Senjata jarak jauh yang tidak biasa ini tidak terlalu banyak memberi damage, namun sangat efektif untuk melambatkan targetnya.

items.weapon.missiles.boomerang.name=bumerang
items.weapon.missiles.boomerang.desc=Dilempar pada musuh, senjata lengkung kayu yang datar ini akan kembali pada tangan si pelempar.
items.weapon.missiles.boomerang.durability=Karena bumerang ini sangat kokoh, maka ia tidak akan rusak saat digunakan.

items.weapon.missiles.fishingspear.name=tombak pancing
items.weapon.missiles.fishingspear.desc=Tombak lempar kecil yang berfungsi baik sebagai senjata rakitan meskipun dirancang untuk memancing.

items.weapon.missiles.forcecube.name=kubus ledak
items.weapon.missiles.forcecube.ondeath=Kau bunuh diri dengan Kubus Ledak milikmu sendiri...
items.weapon.missiles.forcecube.stats_desc=Senjata ini menyebarkan kekuatan benturannya ke area kecil, dan mengenai apa pun yang ada di dekatnya.
items.weapon.missiles.forcecube.desc=Kubus ajaib berbentuk aneh ini cukup kecil untuk dipegang di tanganmu, tetapi sangat berat.

items.weapon.missiles.heavyboomerang.name=bumerang berat
items.weapon.missiles.heavyboomerang.stats_desc=Senjata ini kembali ke lokasi asalnya setelah lima giliran.
items.weapon.missiles.heavyboomerang.desc=Bumerang besar ini sulit digunakan secara efektif, tetapi akan menghasilkan damage yang cukup parah.

items.weapon.missiles.javelin.name=lembing
items.weapon.missiles.javelin.desc=Tombak lempar yang lebih besar itu diseimbangkan agar ujung runcingnya itu tetap melayang lurus di udara.

items.weapon.missiles.kunai.name=kunai
items.weapon.missiles.kunai.stats_desc=Senjata ini lebih kuat melawan musuh yang sedang lengah.
items.weapon.missiles.kunai.desc=Pisau kecil ini sangat kuat di tangan pengguna yang terampil.

items.weapon.missiles.missileweapon.stats_known=Set senjata lempar _tingkat-%1$d_ ini memberikan _%2$d-%3$d damage_ dan membutuhkan _%4$d kekuatan_ untuk digunakan.
