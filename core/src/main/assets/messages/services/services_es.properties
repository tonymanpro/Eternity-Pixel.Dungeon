services.news.guideentries.bartering.title=Trueques con el Rey Rata
services.news.guideentries.bartering.summary=Si bien reiniciar los pisos de la mazmorra es una forma eficaz de obtener más objetos, a veces necesitas tipos exactos de objetos, como armas o pociones de curación.\n\nEs cuando necesitas al Rey Rata. Él tiene cualquier tipo de objeto en sus interminables tesoros y puede compartirlos contigo... si tienes otros tesoros para él.\nHay una pequeña excepción: nunca te dará ni una sola pieza de oro.\n\nEl trueque continuo puede darte algo especial y aumentar la cantidad de artículos por cada intercambio.

services.news.guideentries.bbat.title=Asistente del Pícaro
services.news.guideentries.bbat.summary=En la oscuridad de la mazmorra, no es fácil conseguir amigos. Pero si eres un pícaro...\n\nBbat es un aliado especial que te sigue y ataca a los monstruos.\n\n_-_ Tiene una casilla adicional de alcance.\n\n_-_ Crece con tus subidas de nivel.\n\n_-_ Al recibir daño, recarga ligeramente tu capa.\n\n_-_ Al morir, entra en un enfriamiento en el que no puede ser invocado de nuevo. Una vez expirado el enfriamiento, puedes invocar a bbat con tu capa.\n\nSi quieres jugar más con bbat, puedes elegir la subclase _Cazador_.\n\n_-_ El bbat del Cazador pierde algo de daño, pero gana mayor velocidad de ataque y la habilidad de marcar objetivos.\nLas marcas se acumulan entre sí y te permiten teletransportarte detrás del objetivo y emboscarlo con una gran cantidad de efectos negativos.\n\n_-_ Si bien las marcas se pueden usar para infligir efectos negativos y moverse por el piso, también puedes dejar que bbat derrote al enemigo porque bbat inflige más daño a los enemigos marcados.

services.news.guideentries.blacky.title=Combinación de Objetos
services.news.guideentries.blacky.summary=El Herrero recibió cambios cruciales en la jugabilidad.\n\n_-_ ¡Ahora puedes combinar diferentes objetos para obtener sus niveles combinados en un solo objeto! Hay dos reglas que determinan qué objeto debe recibir las mejoras:\nEl objeto más poderoso recibe las mejoras, como una armadura de placas heredará el nivel de una armadura de cota de malla.\nSi los objetos son iguales o simplemente no tienen niveles/grados, el objeto con mayor mejora recibe todas las mejoras. Esto no se aplica a las cañas de pescar, que heredarán las mejoras de cualquier otro objeto en cualquier caso.\n\n_-_ La misión del herrero se puede repetir reiniciando tanto las minas como los niveles del herrero y otorga un 50% más de favor.

services.news.guideentries.expgen.title=Arena de Combate
services.news.guideentries.expgen.summary=Si quieres ganar tu dinero y premios de manera eficiente, ¡bienvenido a la arena!\n_-_ La _Arena_ es una nueva área única a la que se puede acceder con boletos especiales que se pueden comprar en cualquier tienda.\n\n_-_ Los monstruos en la _arena_ son los más fuertes de esta mazmorra y se vuelven más fuertes con el tiempo que pases allí, pero otorgan oro y objetos aleatorios como botín.\n\n_-_ Mientras farmeas, puedes comprar bolsas de botín en la tienda de la arena. Se pueden comprar tantas veces como desees.

services.news.guideentries.fatelock.title=Controlando el Destino
services.news.guideentries.fatelock.summary=Una vez que controlas el destino, puedes lograrlo todo. Hasta cierto punto.\n\nEl Cierre del Destino (Fate Lock) se otorga al comienzo del juego y proporciona varias opciones:\n\n_-_ Puedes activarlo para habilitar la probabilidad del 33% de obtener objetos aleatorios de cualquier monstruo asesinado. Además, una vez que obtienes cierta cantidad de experiencia (que escala con el progreso del juego), se te otorga un Pergamino de Mejora y el temporizador se reinicia.\nLa acumulación de experiencia funciona independientemente de si el cierre está activo, por lo que puedes desactivar y reactivar el cierre para obtener mejoras acumuladas.\n\n_-_ Puedes reiniciar el piso actual de la mazmorra para que todos los enemigos, salas y objetos se regeneren. Te daña un 55% de tu salud total, así que prepara curación si quieres conquistar la mazmorra repetidamente. Todos los monstruos también se vuelven ligeramente más fuertes con cada reinicio; este aumento solo se puede reducir al ingresar a un nuevo ciclo de mazmorra.

services.news.guideentries.fishing.title=Pescando Más Objetos
services.news.guideentries.fishing.summary=Cuando te acostumbras a hacer trueques, la variedad de objetos que puedes intercambiar o vender es bastante limitada. ¿Cómo conseguir más objetos sin la molestia de luchar y explorar?\n¡Consigue una caña de pescar! Este sencillo dispositivo es capaz de proporcionarte una cantidad infinita de objetos a cambio de tu tiempo.\n\n_-_ Para comenzar, usa la acción LANZAR en la caña de pescar y apunta al agua. Debería haber un anzuelo en esa agua.\n\n_-_ Ahora simplemente espera (turnos dentro del juego, no tiempo real) hasta que el anzuelo brille. Es hora de usar la acción RECOGER.\n\n_-_ El anzuelo agarrará algún objeto en su camino y lo dejará justo debajo de tus pies.\n\nHay cañas de pescar para cada etapa del juego (no capítulos, sino ciclos, de los cuales hablaremos más adelante).

services.news.guideentries.other.title=Observaciones Varias
services.news.guideentries.other.summary=Hay otras cosas que deberías saber:\n\n_-_ Puedes mejorar los artefactos una vez que alcanzan +10.\n\n_-_ Las varitas ya no tienen limitación de cargas máximas; y el Bastón del Mago tiene un 33% más de cargas en comparación con una varita sin bastón._-_ Las tiendas ahora venden más objetos con mayor variedad.\n\n_-_ El espacio del inventario se ha incrementado enormemente, tanto para la mochila como para las bolsas dedicadas.\n\n_-_ Los encantamientos y glifos ya no tienen posibilidades de desaparecer al mejorarlos.\n\n_-_ Los anillos tienen una reducción masiva en comparación con Shattered PD original y su efectividad tiene un límite de 200 mil millones de mejoras.\n\n_-_ La _Poción de Maestría_ aumenta la efectividad del objeto en un 20%.\n\n_-_ La armadura de clase se carga un 150% más rápido.\n\n_-_ Las abejas se volverán más agresivas con los ciclos, aumentando su velocidad de ataque.\n\n_-_ El _Pergamino de Desafío_ ahora es el _Pergamino de Determinación_; en lugar de confundir a las entidades, aplica un escudo con robo de vida al héroe.\n\n_-_ El _Pergamino de Adivinación_, una vez que haya cumplido su función prevista, intentará identificar cada objeto en el inventario con un 33% de probabilidad.\n\n_-_ El Rey Enano ahora tiene 3 veces más salud, pero ya no tiene fase 2.

services.news.guideentries.overhaul.title=Armas Renovadas
services.news.guideentries.overhaul.summary=Algunas armas en la nueva mazmorra han cambiado significativamente sus propiedades:\n\n_-_ El _Espadón_ invoca estatuas de caballeros a tu alrededor para ayudarte a luchar contra los monstruos. Tienen la misma arma que tú, pero significativamente menos salud que las estatuas animadas comunes.\n\n_-_ La _Gran Hacha_ ahora tiene una habilidad a distancia: al lanzarla, puedes realizar un devastador ataque en área de 3x3.\n\n_-_ El _Sai_ ahora puede reducir progresivamente la armadura en impactos exitosos.\n\n_-_ La _Espada Rúnica_ ahora puede disparar cuchillas mágicas que tienen todas las propiedades de ataques mágicos y cuerpo a cuerpo a la vez. Pero la hoja necesita algo de recarga después del lanzamiento.\n\n_-_ El _Kunai_ en ataque sorpresa otorga una mejora a todas las armas cuerpo a cuerpo en tu posesión.\n\n_-_ La _Jabalina_ en golpes mortales puede crear un objeto consumible individual como la pesca.\n\n_-_ La _Maza_ tiene un poder inmenso que le permite disparar rayos láser en los ataques.\n\n_-_ Los _Martillos de Guerra_ son extremadamente fuertes, pero aturden tanto al atacante como al objetivo.\n\n_-_ Los _Escudos_ reflejarán el daño mágico infligido a su portador.\n\n_-_ La _Espada Larga_ cortará a los enemigos adyacentes con daño sagrado que activa encantamientos.\n\n_-_ Los _Guanteletes de Piedra_ infligen daño de rayo a los enemigos cercanos.\n\n_-_ Los _Látigos_ atacarán 3 veces por turno con un alcance de 8 casillas, pero infligen menos daño a mayor distancia.\n\n_-_ El _Dardo Desplazador_ puede ignorar paredes y otros enemigos, pero recibe una penalización de daño.\n\n_-_ El _Dardo de Adrenalina_ tiene una velocidad de ataque instantánea, pero también tiene una penalización de daño.\n\n_-_ El _Dardo Sagrado_ condena a los enemigos al impactar.\n\n_-_ El _Tridente_ genera una pequeña cantidad de oro en cada impacto.\n\n_-_ Cualquier arma _Siniestra (Grim)_ ahora inflige daño adicional basado en la salud del enemigo, en lugar de matar instantáneamente a los enemigos.

services.news.guideentries.potionsofexp.title=Mejorando la Ganancia de EXP
services.news.guideentries.potionsofexp.summary=Cuando matar monstruos y reiniciar pisos no es suficiente, es hora de conseguir más proteínas.\n¡Presentamos el jugo especial de luz estelar para mejorar tu precisión, evasión y coeficiente intelectual!\n\nLa Poción de Experiencia es una forma excelente de recolectar más experiencia y botín, ya que activa un aumento de experiencia de 2x y un objeto adicional de los monstruos cuando el Cierre del Destino está activo.\n\nLa Poción de Sobrecarga es una versión exótica de la Poción de Experiencia y activa una mecánica llamada resurrección en algunos roguelikes: cuando matas a un monstruo, el juego intentará generar otro monstruo con las mismas reglas de generación regular.\nEstas dos pociones funcionan excepcionalmente bien juntas.\n\nLa Astroflor otorga ambos efectos durante un tiempo mucho más corto; disfrútala.\n\n\nSi necesitas oro en lugar de EXP, puedes usar el _Pergamino de Midas_. Convierte a todos los enemigos en el campo de visión en oro, pero no otorga botín adicional ni experiencia.

services.news.guideentries.resets.title=Ciclos de Mazmorra
services.news.guideentries.resets.summary=Al derrotar a Yog, todo comienza a tomar forma.\n\nEn lugar del Amuleto de Yendor, encontrarás el Cierre del Destino Oscuro. A partir de ese momento puedes:\n\n_-_ Terminar el juego luchando contra el Mímico Oscuro, que es un jefe muy poderoso que utiliza las habilidades de todos los demás jefes del juego. Esta guía no cubrirá la estrategia contra él, deberías descubrirla por ti mismo.\n\no\n\n_-_ Entrar en un nuevo bucle en tu aventura, llamado Ciclo. Con cada nuevo ciclo, todo se vuelve más fuerte y más poderoso, tanto los enemigos como las armas. Puedes volver a obtener algunos objetos valiosos, como botines de jefes, pociones de fuerza o artefactos.\nLa escalada se detiene al entrar al sexto ciclo; cualquier reinicio adicional se mantendrá en la misma dificultad.

services.news.guideentries.spells.title=Nuevos Hechizos
services.news.guideentries.spells.summary=Puedes fabricar o encontrar tres nuevos hechizos:\n\n_-_ _Vampirismo_ drena salud del enemigo y la devuelve en forma de regeneración.\n\n_-_ _Superpoblación_ reduce el temporizador de reaparición de monstruos y aumenta su cantidad máxima en el piso.\n\n_-_ _Potenciación de Fuego_ aumenta el daño del fuego en un 10% con cada uso.\n\n_-_ _Bomba de Identificación_ limpia todo tu inventario de equipo no identificado.

services.news.guideentries.treasurebags.title=Cajas con Objetos
services.news.guideentries.treasurebags.summary=Una vez que un jefe es derrotado por primera vez, comienza a soltar _bolsas de tesoro_. Se pueden abrir para obtener recompensas adicionales.\n\n_-_ Una vez que la mazmorra se reinicia al menos una vez, puedes obtener algunos objetos exclusivos y más consumibles.\n\n\nTambién hay otras cuatro bolsas de tesoro por encontrar:\n_-_ _Bolsa de la Suerte_ proporciona de 0 a 15 objetos aleatorios al abrirla, se puede encontrar en cualquier tienda.\n\n_-_ _Bolsa de Alquimia_ se puede conseguir pescando o en tiendas más profundas.\n\n_-_ _Gran Bolsa de la Suerte_ proporciona de 0 a 30 objetos aleatorios, dando más objetos cuando es posible.\n\n_-_ _Bolsa Élite_ contiene todas las categorías de objetos, libres de maldiciones e identificados.\n\n_-_ _Bolsa Quemada_ contiene de 0 a 5 objetos aleatorios al abrirla, que pueden ser reemplazados con carne asada.\n\n_-_ _Bolsa de la Suerte Refinada_ contiene tantos objetos como 10 Bolsas de la Suerte y otorga botín exclusivo.

