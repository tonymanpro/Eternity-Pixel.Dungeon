services.news.guideentries.bartering.title=與鼠王交易
services.news.guideentries.bartering.summary=雖然重置地牢樓層是獲取更多物品的高效方式，但有時你需要特定類型的物品，比如武器或治療藥水。\n\n這就是你需要鼠王的時候。他在他無盡的寶藏中有任何類型的物品，併且可以與你分享...如果你有其他的寶藏給他。\n有一個小例外：他永遠不會給你一塊金幣。\n\n持續的交易可以給你一些特別的東西，併增加每次交易的物品數量。

services.news.guideentries.bbat.title=盜賊助手
services.news.guideentries.bbat.summary=在黑暗的地牢中交朋友併非易事。但如果你是一名盜賊……\n\n暗影蝙蝠是一個特殊的盟友，他會跟隨你併攻擊怪物。\n\n_-_ 它會隨著你的升級而成長。\n\n_-_受到傷害時，稍微充電你的鬥篷。\n\n_-_死亡時，給出冷卻時間，在此期間暗影蝙蝠不能被重新召喚。一旦冷卻時間過去，你可以用你的鬥篷召喚暗影蝙蝠。\n\n如果你想更多地和暗影蝙蝠一起玩，那麼你可以選擇_獵手_專精。\n\n_-_ 獵人的暗影蝙蝠損失一些傷害，但獲得增加的攻擊速度和標記目標的能力。\n標記可以疊加，併允許你傳送到目標後面併用大量的debuff伏擊它。\n\n_-_ 雖然標記可以用來施加debuff和移動樓層，你也可以讓暗影蝙蝠擊敗敵人，因為暗影蝙蝠對標記的敵人造成更多的傷害。

services.news.guideentries.blacky.title=合成物品
services.news.guideentries.blacky.summary=鐵匠迎來了一些改變遊戲規則的重大改動。\n\n_-_ 你現在可以合併不同的物品，得到他們在一個物品中的組合等級！有兩個規則，決定哪個物品應該接收升級：\n更強大的物品得到升級，比如板甲將繼承鏈甲的等級。\n如果物品相等或者簡單地沒有等級，最高升級的物品得到所有升級。這不適用於釣魚竿，它們將繼承其他物品的升級。\n\n_-_ 另一個改變是鐵匠現在是無限的。你可以使用他的提供在任何物品上，但你需要支付一些錢來使用重鑄。

services.news.guideentries.expgen.title=競技場
services.news.guideentries.expgen.summary=如果你想高效地贏取金錢和獎品，歡迎來到競技場！\n_-_ _競技場_ 是新的獨特區域，可以通過在任何商店購買的獨特票據進入。\n\n_-_ _競技場_ 中的怪物是這個地牢中最強的，隨著在那里度過的時間變得更強，但有金幣和隨機物品作為戰利品。\n\n_-_ 在磨練的時候，你可以在競技場商店購買戰利品袋。它們可以無限購買。

services.news.guideentries.fatelock.title=掌控命運
services.news.guideentries.fatelock.summary=一旦你掌控了命運，就能實現一切。在某種程度上。\n\n命運枷鎖在遊戲開始時給予，併提供幾個選項：\n\n_-_ 你可以啟活它以啟用從任何被殺的怪物中獲得隨機物品的能力，機率為33%。此外，一旦你獲得100經驗，你將被給予升級卷軸併重置計時器。\n經驗積累的工作與鎖是否被啟活無關，所以你可以禁用和重新啟用鎖來獲得升級的爆發。\n\n_-_ 你可以重置當前的地牢樓層，使所有的敵人、房間和物品再生。它會對你的總HP造成50%的傷害，所以如果你想反復征服地牢，準備好治療。

services.news.guideentries.fishing.title=釣起更多物品
services.news.guideentries.fishing.summary=當你習慣了以物易物後，可供交換或出售的物品池相當有限。怎樣才能免去戰鬥和探索的麻煩，輕鬆獲取更多物品呢？\n給自己弄一根釣魚竿！這個簡單的設備能夠以你的時間為代價為你提供無限量的物品。\n\n_-_ 要開始，使用釣魚竿上的釣取動作併指向水。這個水上應該有一個釣魚鉤。\n\n_-_ 然後等待（遊戲迴合，而不是實際時間），直到鉤子發射。現在是使用迴收動作的時候了。\n\n_-_ 鉤子會在它的路上抓住一些物品，併把它們放在你的腳下。\n\n每個遊戲階段（不是章節，而是周期，我們將在後面討論）都有釣魚竿。

services.news.guideentries.overhaul.title=武器重製
services.news.guideentries.overhaul.summary=新地牢中的部分武器屬性發生了顯著變化：\n\n_-_ _大劍_ 召喚騎士雕像在你周圍，幫助你與怪物戰鬥。他們使用與你相同的武器，但是HP明顯少於常見的動態雕像。\n\n_-_ _巨斧_ 現在具有遠程能力：在投擲時，你可以進行毀滅性的3x3攻擊。\n\n_-_ _雙釵_ 現在能夠在成功擊中後逐步減少護甲。\n\n_-_ _符文之刃_ 現在可以射出魔法之刃，這些刃具有魔法和近戰攻擊的所有屬性。但是施法後的刃需要一些時間來充能。\n\n_-_ _苦無_ 在驚奇攻擊時給你所有的近戰武器提供buff。\n\n_-_ _標槍_ 在殺死擊中時可以創建像釣魚一樣的單個消耗品。\n\n_-_ _錘子_ 具有巨大的力量，可以在攻擊時射出啟射束。\n\n_-_ _戰錘_ 非常強大，但會使攻擊者和目標都昏迷。\n\n_-_ _盾牌_ 將反射對其所有者造成的魔法傷害。\n\n_-_ _長劍_ 將用神聖傷害斬擊相鄰的敵人，這會觸發附魔。\n\n_-_ _石頭手套_ 對附近的敵人造成閃電傷害。\n\n_-_ _鞭子_ 每迴合將攻擊3次，範圍為8格，但距離越遠，傷害越小。\n\n_-_ _位移飛鏢_ 可以忽略牆壁和其他敵人，但會受到傷害懲罰。\n\n_-_ _腎上腺素飛鏢_ 具有即時攻擊速度，但也有傷害懲罰。\n\n_-_ _神聖飛鏢_ 在擊中時會使敵人注定死亡。\n\n_-_ _三叉戟_ 在每次擊中時都會生成少量的金幣。\n\n_-_ 任何 _死神_ 附魔武器現在都會根據敵人的健康狀況造成額外的傷害，而不是屠殺敵人。

services.news.guideentries.potionsofexp.title=提升經驗獲取
services.news.guideentries.potionsofexp.summary=當擊殺怪物和重置樓層還不夠用時，是時候補充点蛋白質了。\n現在推出特殊的星隕果汁來提高你的準確性、閃避和智商！\n\n經驗藥水是收集更多經驗和戰利品的好方法，因為它在命運鎖啟活時啟活2倍經驗提升和從怪物那里獲得額外物品。\n\n創世之力合劑是經驗藥水的異國版本，啟活了一種在一些roguelikes中被稱為復活的機製：當你殺死一個怪物時，遊戲會嘗試按照常規的生成規則生成另一個怪物。\n這兩種藥水一起使用效果特別好。\n\n星隕花在更短的時間內給出兩種效果，玩得開心！\n\n\n如果你需要金幣而不是經驗，你可以使用_邁達斯卷軸_。它會把視野中的每個敵人變成金子，但不會給出額外的掉落和任何經驗。

services.news.guideentries.resets.title=地牢輪迴
services.news.guideentries.resets.summary=擊敗 Yog 之後，一切才剛剛開始步入正軌。\n\n你會遇到黑色命運枷鎖，而不是Yendor護身符。從那時起你可以：\n\n_-_ 通過與夢魘復仇者戰鬥結束遊戲，這是一個非常強大的boss，使用遊戲中每個其他boss的能力。這個指南不會涵蓋對他的策略，你應該自己看看。\n\n或者\n\n_-_ 進入你冒險的新循環，稱為周期。每進入一個新的周期，一切都會變得更強大，無論是敵人還是武器。你可以重新獲得一些有價值的物品，比如boss掉落、力量藥水或神器。\n在進入第五個周期後，升級停止，任何進一步的重置都將保持在同一難度。

services.news.guideentries.spells.title=全新法術
services.news.guideentries.spells.summary=你可以製作或找到三種新法術。\n\n_-_ _吸血晶柱_ 從敵人身上吸取生命，併以再生的形式給予迴來。\n\n_-_ _超生晶核_ 減少怪物的重生計時器，併增加他們在樓層上的最大數量。\n\n_-_ _黃昏菱晶_ 每次使用都會增加火焰的傷害10%。

services.news.guideentries.treasurebags.title=百寶袋
services.news.guideentries.treasurebags.summary=一旦擊敗過某位 Boss 一次，它就會開始掉落_百寶袋_。打開它們可以獲得額外的物資。\n\n_-_ 一旦地牢至少被重置一次，你就可以獲得一些獨特的物品和更多的消耗品。\n\n\n還有四個其他的寶物袋可以找到：\n_-_ _幸運袋_ 在打開時提供0-15個隨機物品，可以在任何商店找到。\n\n_-_ _煉金袋_ 可以通過釣魚或在更深的商店獲得。\n\n_-_ _更大的幸運袋_ 提供0-30個隨機物品，盡可能提供更多的物品。\n\n_-_ _精英袋_ 包含每個類別的物品，沒有詛咒併且已經被鑑定。


# Eternity PD Fallback Keys
services.news.guideentries.other.title=其他說明
services.news.guideentries.other.summary=還有一些其他你應該了解的事項：\n\n_-_ 神器達到+10後可以繼續升級。\n\n_-_ 法杖不再有最大充能上限；與沒有法杖相比，法师魔杖可多容納33%的充能。\n\n_-_ 商店現在出售更多種類、更多數量的物品。\n\n_-_ 背包和專用袋子的物品欄空間大幅增加。\n\n_-_ 附魔與刻印在升級時不再有消失的機率。\n\n_-_ 戒指相比原版破碎像素地牢有所削弱，其效果上限為2000億次升級。\n\n_-_ _精通藥水_可將物品的效能提升20%。\n\n_-_ 职業護甲充能速度加快150%。\n\n_-_ 蜜蜂會隨著輪迴周期變得更加狂暴，攻擊速度不斷提高。\n\n_-_ _挑戰卷軸_現在變為_決心卷軸_；它不再使生物混亂，而是為英雄施加吸血護盾。\n\n_-_ _占卜卷軸_在發揮原有功效後，還會以33%的機率嘗試鑑定物品欄中的每件物品。\n\n_-_ 矮人國王現在拥有3倍生命值，但不再有第二階段。
