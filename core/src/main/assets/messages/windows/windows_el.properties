windows.wndblacksmith.reforge=_Επανασφυρηλάτηση (%d εύνοια):_ Θα ξανασφυρηλατήσω δυο εφόδια του ίδιου τύπου σε ένα, καλύτερης ποιότητας.
windows.wndblacksmith.harden=_Σκλήρυνση (%d εύνοια):_ Θα σκληρύνω ένα όπλο ή πανοπλία, για να διατηρεί πιο εύκολα τη μαγική ενίσχυση ή τον γλύφο.
windows.wndblacksmith.upgrade=_Αναβάθμιση (%d εύνοια):_ Άμα έχεις εφόδιο κάτω από το +2, θα σ' το αναβαθμίσω.
windows.wndblacksmith.smith=_Σιδηρουργική (%d εύνοια):_ Θα σου φτιάξω ένα νέο όπλο ή πανοπλία από το τίποτα. Θα είναι μεγαλύτερης βαθμίδας, ίσως αναβαθμισμένο και θα έχεις και κάποια επιλογή στο τι παίρνεις.
windows.wndblacksmith.smith_verify=Καλά, θα βάλω τον κλίβανο να ζεστάνει και μετά διάλεξε ό,τι θες.
windows.wndblacksmith.smith_yes=Εντάξει, άναψε τον κλίβανο.
windows.wndblacksmith.smith_no=Άκυρο.
windows.wndblacksmith.cashout=_Εξαργύρωση (όλη την εύνοια):_ Θα σου δώσω κανονικό χρυσό που τον έχω εδώ να βρίσκεται. 1 για κάθε πόντο εύνοιας.
