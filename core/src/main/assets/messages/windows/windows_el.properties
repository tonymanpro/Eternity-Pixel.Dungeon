windows.wndupgrade.title=Αναβάθμισε ένα αντικείμενο
windows.wndupgrade.desc=Η αναβάθμιση ενός αντικειμένου το βελτιώνει μόνιμα:
windows.wndupgrade.remaining=Έχεις _%d_ αντικείμενα αναβάθμισης ακόμα.
windows.wndupgrade.unided=Δεν γνωρίζεις τις ιδιότητες αυτού του αντικειμένου. Εδώ φαίνεται η μη αναβαθμισμένη του κατάσταση.
windows.wndupgrade.unknown_ring=Δεν γνωρίζεις ποια είναι η επίδραση αυτού του δαχτυλιδιού, έτσι δεν έχεις ιδέα τι θα του κάνει η αναβάθμιση.
windows.wndupgrade.cursed=Η αναβάθμιση αυτού του εφοδίου έχει 33% πιθανότητα να εξαγνίσει την κατάρα του.
windows.wndupgrade.cursed_weaken=Η αναβάθμιση αυτού του αντικειμένου θα αποδυναμώσει την κατάρα, ενώ έχει και 33% πιθανότητα να την εξαλείψει εντελώς.
windows.wndupgrade.curse_infusion=Αν εξαλειφθεί η κατάρα, το αντικείμενο δεν θα επωφελείται πια από την έγχυση κατάρας!
windows.wndupgrade.enchant=Η αναβάθμιση αυτού του εφοδίου έχει %d%% πιθανότητα να καταστρέψει τη μαγική του ενίσχυση!
windows.wndupgrade.glyph=Η αναβάθμιση αυτού του εφοδίου έχει %d%% πιθανότητα να καταστρέψει και τον γλύφο του!
windows.wndupgrade.harden=Η αναβάθμιση αυτού του εφοδίου έχει %d%% πιθανότητα να καταστρέψει και τη σκλήρυνσή του!
windows.wndupgrade.resin=Αυτό το ραβδί έχει αναβαθμιστεί με απόκρυφη ρητίνη. Οι κανονικές αναβαθμίσεις θα αντικαθιστούν τις αναβαθμίσεις της ρητίνης!
