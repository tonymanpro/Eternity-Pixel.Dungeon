windows.wndblacksmith.prompt=Καλά, η συμφωνία είναι συμφωνία. Να τι μπορώ να κάνω. Δουλεύω μόνο με αναγνωρισμένα και μη καταραμένα εφόδια.\n\n_Τρέχουσα εύνοια: %d_
windows.wndblacksmith.pickaxe=_Αξίνα (%d εύνοια):_ Δε βαριέσαι, σ' τη δίνω πίσω την αξίνα αν τη θες. Έχω κι άλλες εγώ.
windows.wndblacksmith.pickaxe_verify=Σίγουρα θες τούτο το παλιόπραγμα; Η πέτρα εδώ γύρω δεν είναι μαλακή όπως αυτή του ορυχείου, οπότε δε θα μπορείς να σκάψεις άλλο με αυτό.
