windows.wndblacksmith.prompt=Oke, kesepakatan adalah kesepaktan. Inilah yang bisa aku lakukan untukmu. Aku hanya bekerja dengan item yang teridentifikasi dan tidak terkutuk. \n\n_Bantuan Saat Ini: %d_
