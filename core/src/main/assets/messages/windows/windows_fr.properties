windows.wndblacksmith.prompt=D’accord, un marché est un marché. Voici ce que je peux faire pour toi. Je ne travaille qu'avec des objets identifiés et non maudits.\n\n_Faveur actuelle : %d_
windows.wndblacksmith.pickaxe=_Pioche (%d faveur):_ Je suppose que j'peux t'laisser la pioche si tu veux. J’en ai plein d'autres.
windows.wndblacksmith.pickaxe_verify=T'es sûr de vouloir ce vieux truc ? La roche ici n'est pas tendre comme dans la mine, alors tu ne pourras plus creuser avec.
windows.wndblacksmith.pickaxe_free=Eh, t'as fait du bon travail, j'te la donne gratuitement.
windows.wndblacksmith.pickaxe_yes=Oui, je la veux.
windows.wndblacksmith.pickaxe_no=J'ai changé d'avis.
windows.wndblacksmith.reforge=_Reforger (%d faveur):_ J'peux reforger deux objets du même type en un de meilleure qualité.
windows.wndblacksmith.harden=_Durcir (%d faveur):_ J'peux durcir une arme ou une armure, pour garder plus facilement un enchantement ou un glyphe.
windows.wndblacksmith.upgrade=_Amélioration (%d faveur):_ Si t'as un objet en-dessous de +2, j'peux l'améliorer pour toi.
windows.wndblacksmith.smith=_Forger (%d faveur) :_ J'peux essayer de forger une arme ou une armure pour toi à partir de zéro. Elle sera de qualité supérieure et probablement améliorée, et t'auras un certain choix sur ce que t'obtiendras.
windows.wndblacksmith.smith_verify=D'accord, je vais faire chauffer la forge et tu pourras choisir ce que tu veux.
windows.wndblacksmith.smith_yes=D'accord, faites chauffer la forge.
windows.wndblacksmith.smith_no=J'ai changé d'avis.
windows.wndblacksmith.cashout=_Payer (toute la faveur restante):_ J'peux aussi te donner des pièces qui me restent. 1 pour chaque point de faveur.
windows.wndblacksmith.cashout_verify=D'accord, je te donne %d d'or. Mais je ne ferai plus rien pour toi après ça !
windows.wndblacksmith.cashout_yes=Donnez-moi l'or.
windows.wndblacksmith.cashout_no=J'ai changé d'avis.
windows.wndblacksmith$wndreforge.message=D’accord, je peux reforger deux objets identifiés du même type. Le plus faible sera détruit pour donner une amélioration au plus fort. S'ils sont de même niveau, je garderai celui de gauche.
