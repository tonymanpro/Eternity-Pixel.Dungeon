windows.wndblacksmith.prompt=Tamam, anlaşma anlaşmadır. İşte sizin için yapabileceklerim. Sadece tanımlanmış ve lanetlenmemiş eşyalarla çalışırım.\n\n\n_Şu anki iyilik: %d_
