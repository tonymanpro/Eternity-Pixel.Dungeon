windows.wndblacksmith.reforge=_Yeniden Birleştirme (%d minnet):_ Aynı türden iki eşyayı birleştirerek daha yüksek kalitede tek bir eşyaya dönüştürebilirim.
windows.wndblacksmith.harden=_Sertleştirme (%d minnet):_ Bir silahı veya zırhı sertleştirebilirim, böylece bir büyüyü veya rünü tutmak daha kolay olur.
windows.wndblacksmith.upgrade=_Yükseltme (%d minnet):_ Eğer +2'nin altında bir eşyaya sahipseniz onu sizin için yükseltebilirim.
windows.wndblacksmith.smith=_Hamallık (%d minnet):_ Senin için sıfırdan bir silah veya zırh üretmeyi deneyebilirim. Daha yüksek kademeli, muhtemelen yükseltilmiş olacak ve ne alacağın konusunda biraz seçim şansın olacak.
