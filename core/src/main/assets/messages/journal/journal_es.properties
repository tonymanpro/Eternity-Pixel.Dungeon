journal.document.infinity.title=Más Allá de la Realidad
journal.document.infinity.all_that_matters.title=Todo lo que Importa
journal.document.infinity.all_that_matters.body=La última vez fui despachado por el guardia de la prisión porque era demasiado poderoso para ellos. Ahora tengo mi libertad, nadie podrá detenerme y todo será mío...\n\nSin embargo, hay algo con lo que debo lidiar: ese mímico parece consumir mi codicia e intenta detenerme... Me está esperando, debo estar listo.\n\n- ??????
journal.document.infinity.it_was_all_a_dream.title=¡Todo Fue un Sueño!
journal.document.infinity.it_was_all_a_dream.body=Me desperté confundido. Soñé que era una entidad poderosa en esta mazmorra. Ese mímico parece mucho más poderoso que otros mímicos que he visto; tendré más cuidado a partir de ahora.\n\n- ??????

