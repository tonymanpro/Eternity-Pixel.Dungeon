###features
levels.features.chasm.chasm=Jurang
levels.features.chasm.yes=Ya, aku tahu apa yang kulakukan
levels.features.chasm.no=Tidak, aku berubah pikiran
levels.features.chasm.jump=Kau yakin mau melompat ke dalam jurang? Jatuh sejauh itu mungkin akan menyakitkan.
levels.features.chasm.ondeath=Kau mati terjatuh...
levels.features.chasm.rankings_desc=Mati karena Benturan



###rooms
levels.rooms.special.magicalfireroom$eternalfire.desc=Dinding api hijau terang yang padat ada di sini, sepertinya disebabkan oleh sihir. Ia sangat padat sehingga kamu tidak bisa melewatinya, dan menyulut apa pun yang terlalu dekat. Tidak ada tanda-tanda terbakar secara alami, kamu perlu menggunakan sesuatu untuk memadamkannya.

levels.rooms.special.sentryroom$sentry.name=penjaga merah
levels.rooms.special.sentryroom$sentry.desc=Penjaga merah darah ini tampaknya ditempatkan di sini untuk menjaga harta karun di ujung lain ruangan ini. Itu akan menembakkan sinar sihir penghancur padamu jika kau melangkah di area yang dipertahankannya.\n\nItu kebal terhadap semua efek berbahaya dan dapat melihat tembus pandang, tetapi tampaknya perlu beberapa saat untuk mengisi daya sebelum mulai menembak. \n\nEntah bagaimana penjaga hanya ingin menembakimu, seolah-olah tahu bahwa penghuni terungku bukanlah ancaman bagi harta karun itu.
levels.rooms.special.sentryroom$sentry.discover_hint=Kamu bisa menemukan musuh ini dimanapun di terungku.

levels.rooms.special.toxicgasroom$toxicvent.name=ventilasi beracun
levels.rooms.special.toxicgasroom$toxicvent.desc=Seorang petualang yang ceroboh pasti telah memicu jebakan ini sejak lama. Meskipun tidak aktif, ia masih memuntahkan gas beracun ke dalam ruangan dan tidak menunjukkan tanda-tanda akan berhenti. Kau akan memerlukan beberapa cara untuk terkena damage dari gas jika kau ingin menjelajahi ruangan ini.

levels.rooms.special.weakfloorroom$hiddenwell.name=Sumur yang jauh
levels.rooms.special.weakfloorroom$hiddenwell.desc=Kau hanya dapat melihat sumur di bawah sana, mungkin ada sesuatu di bawah sana?

levels.rooms.quest.ambitiousimproom$questentrance.name=Pintu Masuk Brankas
levels.rooms.quest.ambitiousimproom$questentrance.desc=Lubang mengerikan ini tampaknya merupakan pintu masuk ke semacam brankas kuno kurcaci. Sebuah penghalang magis mencegah masuk, Anda dapat berjalan di atasnya seolah-olah ada lantai di sini.

levels.rooms.quest.blacksmithroom$questentrance.name=Pintu masuk tambang
levels.rooms.quest.blacksmithroom$questentrance.desc=Tangga ini mengarah ke sebuah tambang tua tepat di bawah bengkel pandai besi.

levels.rooms.quest.ritualsiteroom$ritualmarker.name=Tanda ritual
levels.rooms.quest.ritualsiteroom$ritualmarker.desc=Sebuah tanda yang dilukis untuk sebuah ritual gelap. Lilin biasanya ditempatkan di empat sudut.

levels.rooms.quest.massgraveroom$bones.name=Kuburan massal
levels.rooms.quest.massgraveroom$bones.desc=Tulang-tulang berserakan di lantai, apa yang telah terjadi di sini?

levels.rooms.quest.mineentrance$questexit.name=Pintu keluar tambang
levels.rooms.quest.mineentrance$questexit.desc=Tangga ini mengarah keluar dari tambang, kembali ke bengkel pandai besi.

###traps
levels.traps.alarmtrap.name=jebakan alarm
levels.traps.alarmtrap.alarm=Jebakan itu menimbulkan suara kencang yang menggema di seluruh terungku!
levels.traps.alarmtrap.desc=Jebakan ini kelihatannya terikat dengan mekanisme alarm yang berisik. Jika menginjak jebakan ini sepertinya akan menarik perhatian segala hal di level ini.

levels.traps.blazingtrap.name=jebakan membara
levels.traps.blazingtrap.desc=Menginjak jebakan ini akan mengeluarkan bahan kimia membahayakan yang akan membuat area terbakar.

levels.traps.burningtrap.name=jebakan pembakar
levels.traps.burningtrap.desc=Jika jebakan ini terinjak, maka campuran bahan kimia di dalamnya akan terbakar dan membakar area di sekitarnya.

levels.traps.chillingtrap.name=jebakan dingin
levels.traps.chillingtrap.desc=Saat diaktifkan, senyawa yang ada di dalam jebakan ini secara berkala akan membekukan udara di sekitar lokasinya.

levels.traps.confusiontrap.name=jebakan gas pusing
levels.traps.confusiontrap.desc=Menginjak jebakan ini akan mengeluarkan awan-awan gas memabukkan di area.

levels.traps.cursingtrap.name=jebakan kutukan
levels.traps.cursingtrap.curse=Benda yang kau pakai jadi terkutuk!
levels.traps.cursingtrap.desc=Jebakan ini mengandung sihir jahat yang bisa ditemukan pada peralatan terkutuk. Memicunya akan mengutuk beberapa item di area terdekat.

levels.traps.disarmingtrap.name=jebakan penghilang senjata
levels.traps.disarmingtrap.disarm=Senjatamu kena teleport!
levels.traps.disarmingtrap.desc=Jebakan ini mengandung sihir teleportasi spesifik, yang akan menghilangkan senjata korban ke lokasi lain di sekitar.

levels.traps.disintegrationtrap.name=jebakan penghancur
levels.traps.disintegrationtrap.one=Jebakan itu menghancurkan %s-mu!
levels.traps.disintegrationtrap.some=Jebakan itu menghancurkan beberapa %s-mu!
levels.traps.disintegrationtrap.ondeath=Kau terbunuh oleh jebakan penghancur...
levels.traps.disintegrationtrap.desc=Saat terinjak, jebakan ini akan menusuk target terdekat dengan sinar penghancur, memberikan damage yang signifikan dan menghancurkan item.\n\nUntungnya mekanisme jebakan ini tidak tersenbunyi.

levels.traps.distortiontrap.name=jebakan distorsi
levels.traps.distortiontrap.desc=Dibuat dari sihir aneh yang asalnya tak diketahui, perangkap ini akan memanggil semua jenis makhluk ke lokasi ini.

levels.traps.explosivetrap.name=jebakan peledak
levels.traps.explosivetrap.desc=Jebakan ini berisi bubuk peledak dan mekanisme pemicu. Mengaktifkannya akan menyebabkan ledakan di area terdekat.

levels.traps.flashingtrap.name=jebakan silau
levels.traps.flashingtrap.desc=Saat aktivasi, jebakan ini akan menyalakan bubuk cahaya yang ada di dalamnya, yang menyebabkan buta, pincang, dan menyakiti korbannya.\n\nJebakan ini mungkin menyimpan banyak bubuk, sehingga bisa terus aktif berkali-kali tanpa rusak.

levels.traps.flocktrap.name=jebakan domba
levels.traps.flocktrap.desc=Mungkin lelucon dari penyihir amatiran, saat menginjak jebakan ini maka kawanan domba ajaib akan muncul tiba-tiba.

levels.traps.frosttrap.name=jebakan beku
levels.traps.frosttrap.desc=Saat diaktifkan, senyawa yang ada di dalam jebakan ini secara berkala akan membekukan udara dengan radius yang luas.

levels.traps.gatewaytrap.name=jebakan gerbang
levels.traps.gatewaytrap.desc=Perangkap teleportasi khusus ini dapat aktif berkali-kali dan selalu berteleportasi ke lokasi yang sama.

levels.traps.geysertrap.name=jebakan geiser
levels.traps.geysertrap.desc=Saat terpicu, jebakan ini akan menyemburkan geiser air, memberi damage pada musuh api, menghempaskan semua karakter di dekatnya, memadamkan api, dan mengubah medan di sekitarnya menjadi air.

levels.traps.gnollrockfalltrap.name=jebakan longsor gnoll
levels.traps.gnollrockfalltrap.desc=Jebakan longsor ini dibuat dengan bantuan sihir. Jika dipicu akan menyebabkan bebatuan mengendur dan langsung berjatuhan dari atas pada area 5x5 di sekitarnya. Karena bebatuan yang lebih lunak di area tersebut, jebakan ini tidak akan menimbulkan damage sebanyak jebakan longsor biasa, tetapi armormu juga tidak akan efektif untuk menahannya. Batuan juga tidak akan jatuh di lokasi yang berdekatan dengan barikade, karena membantu menahan langit-langit.\n\n_Jebakan ini tidak bisa membedakan teman dan musuh, dan pasti juga berbahaya bagi para gnoll seperti halnya bagimu._

levels.traps.grimtrap.name=jebakan maut
levels.traps.grimtrap.ondeath=Kau terbunuh oleh jebakan maut...
levels.traps.grimtrap.desc=Sihir destruktif yang sangat amat kuat tersimpan di dalam jebakan ini, cukup untuk dapat membunuh segalanya kecuali pahlawan yang sangat sehat. Jika terinjak jebakan ini akan meluncurkan sihir ke karakter terdekat.\n\nUntungnya mekanisme jebakan ini tidak tersembunyi.

levels.traps.grippingtrap.name=jebakan pengait
levels.traps.grippingtrap.desc=Jebakan ini akan mengait pada kaki siapapun yang menginjaknya, menyakiti mereka dan melambatkan gerakan mereka.\n\nKarena kesederhanaannya, jebakan ini dapat aktif berkali-kali tanpa rusak.

levels.traps.guardiantrap.name=jebakan penjaga
levels.traps.guardiantrap.alarm=Jebakan itu menimbulkan suara kencang yang menggema di seluruh terungku!
levels.traps.guardiantrap.desc=Jebakan ini terikat dengan mekanisme sihir yang aneh, yang mana akan memunculkan penjaga dan membangunkan semua musuh di lantai ini.
levels.traps.guardiantrap$guardian.name=penjaga jebakan
levels.traps.guardiantrap$guardian.desc=Penampakan biru ini tampaknya merupakan gema panggilan dari salah satu penjaga batu terungku.
levels.traps.guardiantrap$guardian.desc_weapon=Meskipun patung itu sendiri hampir tidak berwujud, _%s_ yang dipegangnya terlihat nyata.
levels.traps.guardiantrap$guardian.discover_hint=Kamu dapat menemukan musuh ini dengan jebakan tertentu.

levels.traps.oozetrap.name=jebakan cairan
levels.traps.oozetrap.desc=Jebakan ini akan mengeluarkan cairan kaustik saat diaktifkan, yang mana akan terus menyedotmu sampai dicuci dengan air.

levels.traps.pitfalltrap.name=jebakan jurang
levels.traps.pitfalltrap.triggered_hero=Permukaan tanah mulai memberi jalan di sekitarmu!
levels.traps.pitfalltrap.triggered=Permukaan tanah mulai memberikan jalan di sekitar jebakan!
levels.traps.pitfalltrap.no_pit=tanahnya terlalu keras untuk jebakan jurang bekerja di sini.
levels.traps.pitfalltrap.desc=Jebakan ini terhubung dengan mekanisme pintu jebakan yang besar, dan tidak lama setelah terinjak, semua yang berada di dekatnya akan tergelincir masuk ke tanah dan jatuh! Walaupun begitu, jebakan ini  tidak akan berfungsi pada area yang memiliki lantai yang keras dan padat.

levels.traps.poisondarttrap.name=jebakan anak panah racun
levels.traps.poisondarttrap.ondeath=Anda terbunuh oleh jebakan anak panah racun...
levels.traps.poisondarttrap.desc=Pelempar anak panah yang kecil pasti tersembunyi di dekat sini, jika kau mengaktifkan jebakan ini maka anak panah racun akan mengarah pada target terdekat.\n\nUntungnya mekanisme jebakan ini tidak tersembunyi.

levels.traps.rockfalltrap.name=jebakan longsor
levels.traps.rockfalltrap.ondeath=Kau dihancurkan oleh jebakan longsor...
levels.traps.rockfalltrap.desc=Jebakan ini terhubung ke serangkaian batu lepas di atas, memicunya akan menyebabkan batu-batu tersebut runtuh ke seluruh ruangan! Jika jebakan tidak berada di ruangan tertentu, batu akan jatuh di area sekitar jebakan.\n\nUntungnya mekanisme pemicunya tidak tersembunyi.

levels.traps.shockingtrap.name=jebakan pengejut
levels.traps.shockingtrap.desc=Sebuah mekanisme dengan energi besar yang tersimpan di dalamnya. Jika terinjak maka jebakan ini akan mengeluarkan energi tersebut di area sekitar.

levels.traps.stormtrap.name=jebakan petir
levels.traps.stormtrap.desc=Sebuah mekanisme dengan energi besar yang tersimpan di dalamnya. Jika terinjak maka jebakan ini akan mengeluarkan energi tersebut menjadi petir elektrik yang besar.

levels.traps.summoningtrap.name=jebakan pemanggil
levels.traps.summoningtrap.desc=Menginjak jebakan ini akan memunculkan beberapa jenis monster di area ini.

levels.traps.teleportationtrap.name=jebakan teleportasi
levels.traps.teleportationtrap.desc=Setiap kali jebakan ini dipicu, segala sesuatu di sekitarnya akan diteleportasi ke lokasi acak di lantai ini.

levels.traps.tengudarttrap.desc=Tengu jelas-jelas telah bersiap untuk bertarung. Jebakan ini akan mengaktifkan penembak panah yang akan menembakkan panah beracun pada target terdekat yang bukan Tengu.\n\nJebakan ini dibuat dengan sangat baik sampai-sampai pemicunya mustahil ditemukan tanpa bantuan sihir. Walaupun begitu, jebakan ini akan terlihat sebentar saat dipasang.

levels.traps.toxictrap.name=jebakan gas beracun
levels.traps.toxictrap.desc=Menginjak jebakan ini akan mengeluarkan awan gas beracun di area.

levels.traps.trap.discover_hint=Kamu bisa menemukan jebakan ini secara acak di terungku. Setiap wilayah memiliki jebakan yang berbeda yang mungkin muncul.
levels.traps.trap.rankings_desc=Terbunuh oleh: %s

levels.traps.corrosiontrap.name=jebakan gas korosif
levels.traps.corrosiontrap.desc=Jika jebakan ini terinjak maka gumpalan gas asam yang mematikan akan keluar dan memenuhi area sekitar.

levels.traps.warpingtrap.name=jebakan pemindahan
levels.traps.warpingtrap.desc=Jebakan ini mirip dengan jebakan teleportasi, tetapi juga akan menyebabkan pahlawan kehilangan memori tentang tata letak lantai ini!

levels.traps.weakeningtrap.name=jebakan pelemah
levels.traps.weakeningtrap.desc=Sihir jahat pada jebakan ini menyedot energi dari apapun yang menyentuhnya. Namun, musuh yang kuat akan mampu menahan efeknya.

levels.traps.worndarttrap.name=jebakan anak panah bekas
levels.traps.worndarttrap.ondeath=Anda terbunuh oleh jebakan anak panah bekas...
levels.traps.worndarttrap.desc=Penembak anak panah pasti tersembunyi di dekat sini, jika mengaktifkan jebakan ini maka anak panah akan menembak target terdekat.\n\nKarena faktor usia, jebakan itu tidak terlalu berbahaya, bahkan tidak tersembunyi...



###levels
levels.cavesbosslevel.wires_name=Kabel terbuka
levels.cavesbosslevel.wires_desc=Sebagian tanah digali di sini, menunjukkan beberapa kabel besar yang terbuka. Mereka pasti menghubungkan berbagai mesin listrik secara bersamaan.\n\nKabel itu memiliki arus listrik yang mengalir. Jika DM-300 melangkah di sini mungkin ia dapat menyerap listrik dari kabel ini.
levels.cavesbosslevel.energy_desc=Tanah di sini mengeluarkan percikan listrik, dan berbahaya untuk diinjak. _Percikan ini sepertinya tertarik ke arah tertentu..._ mungkin mengarah ke sumber listrik?
levels.cavesbosslevel.gate_name=Gerbang besi
levels.cavesbosslevel.gate_desc=Gerbang logam besar yang menghalangi jalan menuju kota metropolitan kurcaci. Kotak logam di tengah mengeluarkan suara dengungan yang keras, kotak itu harus dihubungkan ke sirkuit dan mesin di dekatnya. Mungkin menghancurkan DM-300 akan membuka gerbangnya?
levels.cavesbosslevel.gate_desc_broken=Gerbang itu pasti telah terhubung ke DM-300 dalam beberapa cara, karena itu meledak saat DM-300 dikalahkan. Sekarang hanya pecahan yang tersisa.
levels.cavesbosslevel.water_desc=Dengan semua listrik di sekitar sini, air mungkin tidak selalu aman...

levels.citybosslevel.throne_name=Takhta
levels.citybosslevel.throne_desc=Tahta yang sangat besar ini adalah tempat kedudukan kerajaan kurcaci, yang sekarang diambil alih oleh necromancer yang gila kekuasaan.\n\nTampaknya ada beberapa bagian magis atau mekanis di takhta itu, Raja Kurcaci dapat memiliki kekuatan tambahan saat duduk di atasnya.
levels.citybosslevel.summoning_name=Alas pemanggil
levels.citybosslevel.summoning_desc=Alas ini memiliki lubang besar di tengahnya, yang mana bisa memancarkan energi gelap.\n\nRaja Kurcaci menggunakan alas ini sebagai titik fokus untuk sihir penghidupan kembali, dan dapat memanggil kaki tangannya ke sana. Alas ini harus mengisi daya untuk beberapa giliran sebelum antek-antek muncul, dan jenis yang dipanggil dihubungkan oleh terbangunnya kekuatan magis.

levels.caveslevel.grass_name=Lumut berpijar
levels.caveslevel.high_grass_name=Jamur berpijar
levels.caveslevel.water_name=Air dingin yang membeku
levels.caveslevel.entrance_desc=Tangga menuju lantai atas.
levels.caveslevel.exit_desc=Tangga menuju lantai bawah.
levels.caveslevel.high_grass_desc=Jamur besar menghalangi pandangan.
levels.caveslevel.wall_deco_desc=Lapisan sejenis bijih bahan tambang terlihat di tembok. Emas?
levels.caveslevel.bookshelf_desc=Siapa yang butuh rak buku di dalam gua?
levels.caveslevel.region_deco_name=Struktur logam
levels.caveslevel.region_deco_desc=Sebuah bangunan besar yang seluruhnya terbuat dari logam, mungkin dibangun oleh para kurcaci saat mereka menambang tempat ini. Kamu mungkin melihat rel kereta tambang yang sudah lama tidak digunakan di sepanjang bagian atasnya.

levels.citylevel.water_name=Air berwarna yang mencurigakan
levels.citylevel.high_grass_name=Bunga yang mekar
levels.citylevel.entrance_desc=Jalan menuju lantai atas.
levels.citylevel.exit_desc=Jalan menuju lantai bawah.
levels.citylevel.deco_desc=Beberapa petak menghilang di sini.
levels.citylevel.sp_desc=Karpet tebal menutupi lantai.
levels.citylevel.statue_desc=Patung ini menggambarkan kurcaci yang berdiri heroik.
levels.citylevel.bookshelf_desc=Barisan buku yang agak berantakan mememuhi rak buku.
levels.citylevel.region_deco_name=Alas yang membara
levels.citylevel.region_deco_desc=Sebuah alas tinggi dengan api ajaib berwarna hijau terang di atasnya. Api itu begitu pekat sehingga bisa dikatakan padat.

levels.citylevel.upcoming_quest_intro_title=Pesan Pengembang
levels.citylevel.upcoming_quest_intro_body=Pembaruan besar berikutnya untuk Shattered Pixel Dungeon akan menghadirkan perombakan pada misi yang diberikan oleh Iblis Kecil Ambisius! Misi ini akan menugaskan Anda untuk menyerbu brankas kurcaci kuno, yang saat ini Anda berdiri di atas pintu masuknya.\n\nSaat ini area misi baru cukup kosong, tetapi Anda dipersilakan untuk turun dan melihat-lihat, baik untuk menguji area baru maupun memberikan umpan balik awal!\n\nSalah satu mekanisme misi adalah bahwa tidak ada itemmu yang akan ikut bersamamu, jadi saat turun Anda akan kehilangan item Anda untuk sementara dan akan diberikan kristal pelarian yang memungkinkan Anda untuk kembali. Efek kelaparan dan regenerasi juga akan dihentikan sementara.\n\n- Evan
levels.citylevel.upcoming_quest_intro_yes=Turun memasuki brankas
levels.citylevel.upcoming_quest_intro_no=Tetap disini

levels.hallslevel.water_name=Lava dingin
levels.hallslevel.grass_name=Lumut Menyala
levels.hallslevel.high_grass_name=Jamur Menyala
levels.hallslevel.statue_name=Pilar
levels.hallslevel.water_desc=Terlihat seperti lava, tapi itu dingin dan kelihatannya aman untuk disentuh.
levels.hallslevel.statue_desc=Pilar ini dibuat dari tulang manusia asli. Luar biasa.
levels.hallslevel.bookshelf_desc=Buku dalam bahasa kuno menumpuk di rak buku.
levels.hallslevel.region_deco_name=Bongkahan puing
levels.hallslevel.region_deco_desc=Sepotong batu besar yang tampak pecah dari langit-langit atau dinding di dekatnya.


levels.level.hidden_trap=%s yang tersembunyi aktif!
