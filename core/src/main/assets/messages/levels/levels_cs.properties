levels.level.default_name=???
levels.level.chasm_desc=You can't see the bottom.
levels.level.water_desc=In case of burning step into the water to extinguish the fire.
levels.level.entrance_desc=Stairs lead up to the upper depth.
levels.level.exit_desc=Stairs lead down to the lower depth.
levels.level.embers_desc=Embers cover the floor.
levels.level.high_grass_desc=Dense vegetation blocks the view.
levels.level.locked_door_desc=This door is locked, you need a matching key to unlock it.
levels.level.crystal_door_desc=This locked door is made of magical crystal. You can see through, but you'll need a crystal key to open it.
levels.level.locked_exit_desc=Heavy bars block the stairs leading down.
levels.level.barricade_desc=The wooden barricade is firmly set but has dried over the years. Might it burn?
levels.level.inactive_trap_desc=The trap has been triggered before and it's not dangerous anymore.
levels.level.statue_desc=Someone wanted to adorn this place, but failed, obviously.
levels.level.alchemy_desc=This pot is filled with magical water. Items can be mixed into the pot to create something new!
levels.level.empty_well_desc=The well has run dry.
levels.level$feeling.chasm_title=chasm floor
levels.level$feeling.water_title=water floor
levels.level$feeling.grass_title=grass floor
levels.level$feeling.dark_title=dark floor
levels.level$feeling.large_title=large floor
levels.level$feeling.traps_title=traps floor
levels.level$feeling.secrets_title=secrets floor
levels.level$feeling.chasm_desc=Your steps echo across the dungeon.
levels.level$feeling.water_desc=You hear water splashing around you.
levels.level$feeling.grass_desc=The smell of vegetation is thick in the air.
levels.level$feeling.dark_desc=You can hear enemies moving in the darkness.
levels.level$feeling.large_desc=This dungeon floor seems unusually large.
levels.level$feeling.traps_desc=The ground seems especially treacherous here.
levels.level$feeling.secrets_desc=The atmosphere hints that this floor hides many secrets.
levels.mininglevel.wall_desc=A smooth rock wall that's a little softer than usual. You can mine through it with your pickaxe, but it'll take some effort and increase your hunger a bit.
levels.mininglevel.gold_extra_desc=You can probably mine it out with your pickaxe.
levels.mininglevel.crystal_name=Crystal spike
levels.mininglevel.boulder_name=Boulder
levels.mininglevel.crystal_desc=There is a large and colorful crystal outcropping here. These crystals are fragile and can easily be broken with a pickaxe, or will break if something is mined next to it.
levels.mininglevel.boulder_desc=There is a large boulder blocking the way. It should be fairly easy to break with a pickaxe.
levels.mininglevel.barricade_desc=The wooden barricade is firmly set and acts as a support for the ceiling.\n\nThis was probably constructed by the gnolls to give some protection against falling rocks. _Any adjacent cells will be protected from rockfall traps and attacks._\n\nIt looks like it would burn just as well as any other barricade.
levels.prisonlevel.water_name=Dark cold water
levels.prisonlevel.empty_deco_desc=There are old blood stains on the floor.
levels.prisonlevel.bookshelf_desc=This is probably a vestige of a prison library. Might it burn?
levels.prisonlevel.region_deco_name=Prison cage
levels.prisonlevel.region_deco_desc=A metal cage just large enough to hold a person. It seems to be locked to the ground in some way, you can't move it.
levels.prisonlevel.region_deco_alt_name=Hanging cage
levels.prisonlevel.region_deco_alt_desc=A metal cage just large enough to hold a person. It's hanging over a deep chasm, suspended by a chain.
levels.sewerlevel.water_name=Murky water
levels.sewerlevel.empty_deco_desc=Wet yellowish moss covers the floor.
levels.sewerlevel.bookshelf_desc=The bookshelf is packed with cheap useless books. Might it burn?
levels.sewerlevel.region_deco_name=Storage barrel
levels.sewerlevel.region_deco_desc=A stout barrel that's almost as big as you are. It must be full of something or another, it's too heavy to move.
levels.traps.trap.discover_hint=You can find this trap randomly in the dungeon. Each region has different traps that may appear.
levels.citylevel.upcoming_quest_intro_title=Developer Message
levels.citylevel.upcoming_quest_intro_body=The next major update to Eternity Pixel Dungeon will feature an overhaul to the quest given by the Ambitious Imp! This quest will task you with raiding an ancient dwarven vault, that you're currently standing on top of the entrance for.\n\nCurrently the new quest area is pretty empty, but you're welcome to go down and look around, both to test the new area and give early feedback!\n\nOne of the quest's mechanics is that none of your items will come with you, so when descending you'll temporarily lose your items and _will be given an escape crystal that lets you return._ Hunger and regeneration effects will also be paused.\n\n- Evan
levels.citylevel.upcoming_quest_intro_yes=Descend into the vault
levels.citylevel.upcoming_quest_intro_no=Stay here
