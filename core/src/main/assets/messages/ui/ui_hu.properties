ui.updatenotification$wndupdate.desc=A Shattered Pixel Dungeon rendszeresen frissül nagyjavításokkal a meglévő tartalmakhoz, vagy teljesen új tartalmakkal!\n\nA játék egyensúlya is gyakran tökéletesedik a játék frissítéseivel, hogy az egyes tárgyak/hősök/ellenségek se nem túl erősek, se nem túl gyengék ne legyenek.\n\nA frissítések tartalmazhatnak hibajavításokat, és egyéb különféle stabilitásnöveléseket.
