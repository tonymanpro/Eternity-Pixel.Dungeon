###blobs
actors.blobs.blizzard.name=Schneesturm
actors.blobs.blizzard.desc=Hier tobt ein Schneesturm.

actors.blobs.confusiongas.name=Verwirrungsgas
actors.blobs.confusiongas.desc=Eine Wolke aus Verwirrungsgas wirbelt hier herum.

actors.blobs.electricity.name=Elektrizität
actors.blobs.electricity.desc=Ein elektrisches Feld wirft hier helle Funken.
actors.blobs.electricity.rankings_desc=Durch Stromschlag getötet
actors.blobs.electricity.ondeath=Ein Stromschlag hat dich erledigt...

actors.blobs.fire.name=Feuer
actors.blobs.fire.desc=Hier wütet ein Feuer.

actors.blobs.foliage.name=Laub
actors.blobs.foliage.desc=Lichtstrahlen durchbrechen die Finsternis des unterirdischen Gartens.

actors.blobs.freezing.name=eiskalte Luft
actors.blobs.freezing.desc=Die Luft ist unnatürlich kalt hier.

actors.blobs.goowarn.name=dunkle Energie
actors.blobs.goowarn.desc=Partikel dunkler Energie schwärmen hier umher!

actors.blobs.inferno.name=Inferno
actors.blobs.inferno.desc=Hier wütet ein Inferno.

actors.blobs.paralyticgas.name=Lähmungsgas
actors.blobs.paralyticgas.desc=Eine Wolke aus Lähmungsgas wirbelt hier herum.

actors.blobs.regrowth.name=Wildwuchs

actors.blobs.sacrificialfire.name=Opferflamme
actors.blobs.sacrificialfire.desc=Hier ist ein Altar mit einer darauf brennenden Opferflamme. Jede Kreatur, die hier getötet wird, wird von den Flammen als ein Opfer für die Geister des Dungeons verzehrt.\n\nVielleicht gibt es eine Belohnung, wenn genügend Opfer dargebracht worden sind?
actors.blobs.sacrificialfire.worthy=Das Feuer verzehrt deine Opfergabe und wird größer.
actors.blobs.sacrificialfire.unworthy=Das Feuer verzehrt deine Opfergabe, es verändert sich aber nicht.
actors.blobs.sacrificialfire.reward=Das Feuer erstrahlt hell und löst sich dann auf; zurück bleibt eine Belohnung!

actors.blobs.smokescreen.name=Nebelwand
actors.blobs.smokescreen.desc=Hier wirbelt eine dicke, schwarze Rauchwolke herum.

actors.blobs.stenchgas.name=Stinkgas
actors.blobs.stenchgas.desc=Eine übelriechende Wolke hängt hier schwer in der Luft.

actors.blobs.stormcloud.name=Gewitterwolken
actors.blobs.stormcloud.desc=Hier wabert eine Wolke aus Wasserdampf herum.

actors.blobs.toxicgas.name=Giftgas
actors.blobs.toxicgas.desc=Eine grünliche Wolke aus toxischen Gasen wirbelt hier herum.
actors.blobs.toxicgas.rankings_desc=Erstickt
actors.blobs.toxicgas.ondeath=Du bist durch das giftige Gas gestorben...

actors.blobs.corrosivegas.name=Zersetzungsgas
actors.blobs.corrosivegas.desc=Hier wirbelt eine Wolke aus tödlich ätzendem Gas herum.

actors.blobs.waterofawareness.name=Wasser der Wahrnehmung
actors.blobs.waterofawareness.procced=Als du einen Schluck nimmst, spürst du, wie sich dein Geist mit Erkenntnis füllt.
actors.blobs.waterofawareness.desc=Die Macht des Wissens strahlt aus dem Wasser dieses Brunnens. Wenn du davon trinkst, werden alle getragenen Gegenstände vollständig identifiziert, Flüche auf allen Gegenständen in deinem Inventar erkannt und alle Gegenstände in der aktuellen Ebene offenbart.

actors.blobs.waterofhealth.name=Wasser der Gesundheit
actors.blobs.waterofhealth.procced=Als du einen Schluck nimmst, fühlst du, wie alle deine Wunden verheilen.
actors.blobs.waterofhealth.desc=Die Kraft der Gesundheit wird vom Wasser dieses Brunnens ausgestrahlt. Trinke aus diesem Brunnen, um deine Wunden zu heilen, deinen Hunger zu stillen und Flüche von allen getragenen Gegenständen zu brechen.

actors.blobs.web.name=Spinnennetz
actors.blobs.web.desc=Dicke Spinnweben bedecken hier alles. Die Spinnweben werden durch alles, was sie berührt oder durch sie hindurchgeworfen wird, zerstört, aber der betroffene Gegenstand bleibt an der Stelle hängen.



###buffs
actors.buffs.adrenaline.name=Adrenalin
actors.buffs.adrenaline.desc=Ein Kraftschub, welcher Adrenalin freigibt und so Angriffs- und Bewegungsgeschwindigkeit verstärkt.\n\nDas so freigegebene Adrenalin ermöglicht es dem Anwender, die doppelte Angriffs- und 1,5-fache Bewegungsgeschwindigkeit zu entfalten\n\nVerbleibende Züge: %s

actors.buffs.adrenalinesurge.name=Stärkebonus
actors.buffs.adrenalinesurge.desc=Ein plötzlicher Anstieg großer Macht, leider jedoch nicht von Dauer.\n\nStärkebonus +%d.\nZüge bis zum Abklingen: %s.

actors.buffs.amok.name=Amok
actors.buffs.amok.desc=Amok erzeugt einen Zustand des Zorns und Verwirrung in jenen, die ihm ausgesetzt werden. \n\nSolange eine Kreatur Amok läuft, wird diese alles angreifen, was in ihrer Nähe ist, egal ob Freund oder Feind. \n\nVerbleibende Züge mit Amok: %s.

actors.buffs.arcanearmor.name=arkane Rüstung
actors.buffs.arcanearmor.desc=Ein feiner Schild umgibt dich, welcher den Schaden von magischen Angriffen verringert.\n\nDeine magische Rüstung ist momentan verstärkt um: 0-%d.\n\nZüge, bis die magische Rüstung vergeht: %s.

actors.buffs.artifactrecharge.name=Artefaktaufladung
actors.buffs.artifactrecharge.desc=Energie durchströmt dich und erhöht die Aufladegeschwindigkeit deiner ausgerüsteten Artefakte.\n\nDieser Effekt betrifft Artefakte unterschiedlich stark, jedoch wird jedes Artefakt schneller aufgeladen als normal.\n\nVerbleibende Züge: %s.

actors.buffs.ascensionchallenge.name=Fluch des Amuletts
actors.buffs.ascensionchallenge.desc=Irgendwie erhält Yog-Dzewa durch das Amulett seinen Einfluss auf diese Welt aufrecht und versucht, deinen Aufstieg zu verhindern!\n\nYog-Dzewas Einfluss macht das Dungeon wesentlich gefährlicher - dadurch wächst die Zahl der Gegner und sie werden stärker! Diese Macht wird weiter wachsen, wenn nichts dagegen unternommen wird. Sie kann eingedämmt werden, wenn man Gegner besiegt, welche durch die Macht Yog-Dzewas verstärkt worden sind.
actors.buffs.ascensionchallenge.desc_clear=Die dunkle Energie, die von dem Amulett ausgestrahlt wird, ist einstweilen, so gut es möglich ist, geschwächt.
actors.buffs.ascensionchallenge.desc_beckon=Das Amulett _ruft gerade entfernte Gegner herbei_ und führt sie zu deiner Position.
actors.buffs.ascensionchallenge.desc_haste=Das Amulett _beschleunigt jetzt entfernte Gegner,_ so dass sie schneller zu dir kommen!
actors.buffs.ascensionchallenge.desc_slow=Das Amulett _verlangsamt dich_ gerade, so dass Effekte der Geschwindigkeitserhöhung negiert werden!
actors.buffs.ascensionchallenge.desc_damage=Die von dem Amulett abgestrahlte Energie ist so stark geworden, dass sie dir _direkt schadet!_
actors.buffs.ascensionchallenge.beckon=Das Amulett ruft nun weit entfernte Gegner herbei.
actors.buffs.ascensionchallenge.haste=Das Amulett beschleunigt nun weit entfernte Gegner!
actors.buffs.ascensionchallenge.slow=Das Amulett fühlt sich in deinen Habseligkeiten nun an wie ein bleiernes Gewicht!
actors.buffs.ascensionchallenge.damage=Das Amulett beginnt, dunkle Energie auszustrahlen. Es brennt!
actors.buffs.ascensionchallenge.weaken_info=Der Fluch des Amuletts kann geschwächt werden, indem mehr Feinde besiegt werden.
actors.buffs.ascensionchallenge.weaken_info_no_kills=Wenn du Feinde besiegst, wird sich der Fluch des Amuletts abschwächen!
actors.buffs.ascensionchallenge.weaken=Du spürst, wie der Fluch des Amuletts etwas nachlässt.
actors.buffs.ascensionchallenge.break=Du nimmst dir etwas Zeit, um Atem zu schöpfen, und spürst, wie deine Wunden zu heilen beginnen!
actors.buffs.ascensionchallenge.almost=Du spürst, wie Yog-Dzewas Macht über das Amulett schwächer wird, du hast es fast geschafft!
actors.buffs.ascensionchallenge.on_kill=Die dunkle Energie verschlingt dich...

actors.buffs.barkskin.name=Rindenhaut
actors.buffs.barkskin.desc=Deine Haut ist gehärtet, sie fühlt sich rau und fest an wie Rinde.\n\nDie gehärtete Haut erhöht deine effektive Rüstung, wodurch du dich besser gegen physische Angriffe verteidigen kannst.\n\nDeine Rüstung ist derzeit erhöht um: 0-%d.\nVerbleibende Züge bis zur Schwächung der Rindenhaut: %s.\n\nFalls du Rindenhaut von mehreren Quellen erhältst, wirkt sich nur die stärkste aus.

actors.buffs.barrier.name=Barriere
actors.buffs.barrier.desc=Eine dauerhafte Kraftblase, die jeglichen Schaden blockiert.\n\nDie Barriere übernimmt den Schaden für alles, was sie schützt, solange noch Abschirmung vorhanden ist. Die Abschirmung wird jedoch mit der Zeit langsam abgebaut.\n\nVerbleibende Abschirmung: %d.

actors.buffs.berserk.angered=verärgert
actors.buffs.berserk.berserk=rasend
actors.buffs.berserk.exhausted=erschöpft
actors.buffs.berserk.recovering=sich erholend
actors.buffs.berserk.angered_desc=Die Schwere der Verletzungen des Berserkers verstärkt seine Angriffe. Wenn der Berserker physischen Schaden nimmt, baut sich seine Wut auf und verleiht ihm zusätzlichen Schaden auf seine Angriffe. Auch Schaden, der von der Rüstung absorbiert wird, steigert die Wut.\n\nDiese Wut nimmt jedoch mit der Zeit ab. Je niedriger die Lebenspunkte, desto länger hält sie an.\n\nBei 100%% Wut kann der Berserker in Rage verfallen, wodurch er Abschirmung in Höhe der Stufe seiner Rüstung und der ihm fehlenden Lebenspunkte erhält. In Rage verfällt dieser Schutz mit der Zeit, und sobald er verschwunden ist, muss der Berserker ausruhen, ehe er wieder Wut aufbauen kann.\n\nDerzeitige Wut: _%1$.0f%%_\n_+%2$.0f%%_ Schaden\n\nRage-Abschirmung mit der derzeitigen Rüstung und LP: _%3$d_
actors.buffs.berserk.berserk_desc=Furcht und Unsicherheit verblassen, nur der blanke Zorn bleibt. Dieser Zustand verleiht dem Berserker große Macht: _er teilt 50%% mehr Schaden aus und erhält zusätzliche Abschirmung,_ doch die Abschirmung schwindet jeden Zug.\n\nSobald die Abschirmung auf 0 gesunken ist, endet die Rage.\n\nDer Berserker muss nun eine Zeitlang ruhen, bis sich seine Wut wieder aufbauen kann.\n\nVerbleibende Abschirmung: %d
actors.buffs.berserk.recovering_desc=Innere Stärke hat ihre Grenzen. Der Berserker muss sich ausruhen, bevor er sich wieder in Rage bringen kann.\n\nWährend der Berserker sich erholt, erzeugt erlittener Schaden keine Wut.
actors.buffs.berserk.recovering_desc_turns=Züge bis zur Genesung: _%d_
actors.buffs.berserk.recovering_desc_levels=Level bis zur Erholung: _%.2f_
actors.buffs.berserk.rankings_desc=Zu Tode gewütet.
actors.buffs.berserk.action_name=Berserker
actors.buffs.berserk.no_seal=Du benötigst dein gebrochenes Siegel für die Raserei!

actors.buffs.bleeding.name=blutend
actors.buffs.bleeding.ondeath=Du bist verblutet...
actors.buffs.bleeding.heromsg=Du blutest!
actors.buffs.bleeding.rankings_desc=Verblutet
actors.buffs.bleeding.desc=Aus dieser Wunde tritt eine besorgniserregende Menge Blut aus. \n\nDie Blutung richtet jeden Zug Schaden an. Dieser Schaden verringert sich jeden Zug um einen zufälligen Wert, bis die Blutung gestillt ist.\n\nDiese Blutung richtet im Moment bis zu %d Schaden an.

actors.buffs.bless.name=gesegnet
actors.buffs.bless.desc=Eine beträchtliche Steigerung der Konzentration, ausgelöst durch eine Eingebung der Götter, so sagt man.\n\nDieser Segen steigert die Zielgenauigkeit und Ausweichrate um 25%%, was den Gesegneten einen Kampf wesentlich effektiver bestreiten lässt.\n\nVerbleibende Züge mit Segnung: %s.

actors.buffs.blindness.name=geblendet
actors.buffs.blindness.heromsg=Du bist geblendet!
actors.buffs.blindness.desc=Geblendet zu sein, hüllt die umliegende Welt in einen dunklen Schleier. \n\nWährend ein Charakter geblendet ist, ist seine Sichtweite auf ein Feld reduziert, womit Fernkampfangriffe nutzlos sind und man weiter entfernte Feinde leicht aus der Sicht verliert. Zusätzlich ist ein geblendeter Held nicht in der Lage, Schriftrollen oder Bücher zu lesen. \n\nVerbleibende Züge mit Erblindung: %s.

actors.buffs.buff.heromsg=

actors.buffs.burning.name=brennend
actors.buffs.burning.heromsg=Du hast Feuer gefangen!
actors.buffs.burning.burnsup=%s verbrennt!
actors.buffs.burning.ondeath=Du bist verbrannt...
actors.buffs.burning.rankings_desc=Zu Asche verbrannt
actors.buffs.burning.desc=Nur wenige Dinge sind besorgniserregender, als von Flammen verschlungen zu werden.\n\nFeuer richtet jeden Zug Schaden an, bis es durch Wasser gelöscht wird oder abklingt. Auch das Zerschmettern eines Trankes in unmittelbarer Nähe kann Feuer löschen.\n\nSolange man brennt, besteht die Gefahr, dass entflammbare Gegenstände oder Terrain entzündet werden, sobald man mit diesem in Berührung kommt.\n\nVerbleibende Züge in Flammen: %s.

actors.buffs.championenemy.warn=Du spürst eine tödliche Gegenwart.
actors.buffs.championenemy$blazing.name=Flammen-Champion
actors.buffs.championenemy$blazing.desc=Flammende Champions verursachen 25% mehr Nahkampfschaden, entzünden Gegner, die sie angreifen, sind immun gegen Feuer und verbreiten bei ihrem Tod Feuer um sich herum. Wasser ist von diesem Feuer aber nicht betroffen.
actors.buffs.championenemy$projecting.name=projizierender Champion
actors.buffs.championenemy$projecting.desc=Projizierende Champions verursachen 25% mehr Nahkampfschaden und haben +3 Angriffsreichweite.
actors.buffs.championenemy$antimagic.name=Antimagie-Champion
actors.buffs.championenemy$antimagic.desc=Antimagische Champions erleiden 50% weniger Schaden und sind immun gegenüber magischen Effekten.
actors.buffs.championenemy$giant.name=Riesen-Champion
actors.buffs.championenemy$giant.desc=Riesen-Champions erleiden 80% weniger Schaden und haben +1 Angriffsreichweite, können sich aber nicht durch enge Räume bewegen.
actors.buffs.championenemy$blessed.name=gesegneter Champion
actors.buffs.championenemy$blessed.desc=Gesegnete Champions haben eine 4-fache Genauigkeit und Ausweichrate.
actors.buffs.championenemy$growing.name=Wachstums-Champion
actors.buffs.championenemy$growing.desc=Wachsende Champions erhalten einen stetig steigenden Bonus auf Genauigkeit, Ausweichen, physischen Schaden und eine Reduzierung des erlittenen Schadens.\n\nAktueller Genauigkeit-/Ausweich-/Schadensbonus: %1$d%%\nAktuelle Schadensreduzierung: %2$d%%

actors.buffs.charm.name=betört
actors.buffs.charm.heromsg=Du wurdest betört!
actors.buffs.charm.cant_attack=Du wurdest von diesem Gegner betört und kannst ihn nicht angreifen.
actors.buffs.charm.desc=Betörung ist eine manipulative Magie, die Feinde zeitweilig dazu bringen kann, einander zu mögen.\n\nCharaktere, welche von Betörung betroffen sind, können den Feind, von welchem sie betört wurden, nicht direkt angreifen. Dabei ist es aber nach wie vor möglich, andere Ziele zu attackieren. Der Schock durch Schmerz wird die Dauer der Betörung verringern.\n\nVerbleibende Züge mit Betörung: %s.

actors.buffs.chill.name=unterkühlt
actors.buffs.chill.freezes=%s friert ein!
actors.buffs.chill.desc=Nicht ganz gefroren, aber trotzdem viel zu kalt.\n\nUnterkühlte Ziele führen alles langsamer aus, abhängig von den übrigen Zügen des Effekts. Im schlimmsten Fall wirkt die Unterkühlung wie eine Verlangsamung.\n\nVerbleibende Züge mit Unterkühlung: %1$s.\nGeschwindigkeit ist reduziert um: %2$s%%

actors.buffs.combo.name=Kombi
actors.buffs.combo.action_name=Kombi-Angriff
actors.buffs.combo.combo=%d-Treffer-Kombi!
actors.buffs.combo.bad_target=Das Ziel ist zu weit entfernt
actors.buffs.combo.prompt=Wähle ein Ziel für den Angriff.
actors.buffs.combo.desc=Erfolgreiche Angriffe gewähren dem Gladiator Momentum: Jeder Treffer mit Fern- oder Nahkampfwaffen erhöht die Kombo um eins, aber eine längere Unterbrechung setzt sie vollständig zurück. Während einer Kombo sinkt durch das Siegel des Kriegers erhaltener Schild nicht mit der Zeit.\n\nDie Kombo befähigt den Gladiator zu einzigartigen, garantiert treffenden Komboangriffen! Verschiedene Aktionen sind ab einer Kombo von 2, 4, 6, 8 und 10 ausführbar. Manche beenden die Kombo, andere nicht - jede kann aber nur einmal pro Kombo eingesetzt werden.\n\nAktuelle Kombo: %1$d.\n\nZüge bis zum Ende der Kombo: %2$s.
actors.buffs.combo$combomove.clobber.name=Prügel
actors.buffs.combo$combomove.clobber.desc=Stößt einen Gegner 2 Felder zurück, verursacht aber keinen Schaden und kann ihn nicht in Fallgruben stoßen. Erhöht den Kombi-Zähler um 1.
actors.buffs.combo$combomove.clobber.empower_desc=Stößt einen Gegner 3 Felder zurück, verursacht Schwindel, aber keinen Schaden. Erhöht den Kombi-Zähler um 1.
actors.buffs.combo$combomove.slam.name=Harter Schlag
actors.buffs.combo$combomove.slam.desc=Verursacht %d%% (Kombi*20%%) deines Rüstungswertes als zusätzlichen Schaden. Setzt die Kombi bei Verwendung zurück.
actors.buffs.combo$combomove.slam.empower_desc=_Springt bis zu %1$d Feld(ern)_ und verursacht %2$d%% (Kombi*20%%) deiner Abwehrkraft als Bonus-Schaden. Setzt den Kombi-Zähler zurück, wenn verwendet.
actors.buffs.combo$combomove.parry.name=Parade
actors.buffs.combo$combomove.parry.desc=Blockt den nächsten Angriff innerhalb eines Zuges, und kontert diesen sofort. Setzt den Kombi-Zähler auch dann zurück, wenn nichts pariert wurde.
actors.buffs.combo$combomove.parry.empower_desc=Blockt _alle Angriffe_ innerhalb eines Zugs. wenn aktiviert, und kontert diese sofort. Setzt den Kombi-Zähler zurück, wenn nichts pariert wurde.
actors.buffs.combo$combomove.crush.name=Brecher
actors.buffs.combo$combomove.crush.desc=Fügt dem Primärziel %d%% (Kombi*25%%) Schaden und die Hälfte dieses Schadens allen umliegenden Gegnern in einem 7x7 Felder großen Wirkungsbereich zu.
actors.buffs.combo$combomove.crush.empower_desc=_Springt bis zu %1$d Feld(er)_ und fügt dem Primärziel %2$d%% (Kombi*25%%) Schaden sowie allen anderen Gegnern in einem 7x7 Felder großen Wirkungsbereich die Hälfte dieses Schadens zu. Bei Benutzung wird die Kombi zurückgesetzt.
actors.buffs.combo$combomove.fury.name=Wut
actors.buffs.combo$combomove.fury.desc=Trifft den Gegner einmal pro gesammelter Kombi. Jeder Treffer verursacht 60% Schaden und kann Verzauberungen auslösen. Setzt den Kombi-Zähler bei Benutzung zurück.
actors.buffs.combo$combomove.fury.empower_desc=_Springt bis zu %d Feld(er)_ und trifft einen Gegner je einmal pro Kombi, die du hast; jeder Treffer verursacht 60%% Schaden und kann Verzauberungen auslösen. Bei Benutzung wird die Kombi zurückgesetzt.

actors.buffs.corruption.name=korrumpiert
actors.buffs.corruption.desc=Korruption sickert in das Innerste eines Wesens, wodurch es sich gegen seine eigene Natur wendet.\n\nKorrumpierte Kreaturen greifen ihre Verbündeten an und ignorieren ihre vorherigen Gegner. Korruption schadet außerdem dem Opfer, wodurch es langsam verendet.\n\nKorruption ist permanent und kann nur durch den Tod beendet werden.

actors.buffs.cripple.name=verkrüppelt
actors.buffs.cripple.heromsg=Du bist verkrüppelt!
actors.buffs.cripple.desc=Du bist dir ziemlich sicher, dass Beine nicht auf diese Weise gebeugt werden sollten.\n\nVerkrüppelte bewegen sich nur halb so schnell, wodurch sie zwei Züge benötigen, um sich ein Feld fortzubewegen.\n\nAnzahl verbleibender Züge mit Verkrüppelung: %s.

actors.buffs.daze.name=benommen
actors.buffs.daze.heromsg=Du bist benommen!
actors.buffs.daze.desc=Ohrensausen und verschwommene Sicht erschweren den Kampf.\n\nWährend du benommen bist, sind Genauigkeit und Ausweichen um 50%% reduziert.\n\nVerbleibende Züge mit Benommenheit: %s.

actors.buffs.degrade.name=geschwächt
actors.buffs.degrade.heromsg=Deine Ausrüstung fühlt sich schwächer an!
actors.buffs.degrade.desc=Mächtige dunkle Magie zehrt an der Stärke deiner Ausrüstung, welche durch Schriftrollen der Verbesserung aufgewertet wurden!\n\nVerbesserte Ausrüstungsgegenstände werden temporär so behandelt, als hätten sie eine niedrigere Stufe als tatsächlich. _Jede Verbesserung ab +3 wird exponentiell schwächer als die vorige._ Die Beschreibungen deiner Gegenstände wird angepasst, um die reduzierten Werte zu spiegeln.\n\nSchwächungen beeinflussen keine Stärkeanforderungen, Ladungen von Zauberstäben, Haltbarkeit von Wurfwaffen oder Artefakte.\n\nVerbleibende Züge mit Schwächung: %s. Die Nutzung einer Schriftrolle der Verbesserung oder des Fluchbrechers wird die Schwächung sofort aufheben.

actors.buffs.doom.name=verdammt
actors.buffs.doom.desc=Es ist schwer, optimistisch zu bleiben, wenn es scheint, dass alle Welt dich tot sehen möchte.\n\nVerdammte Charaktere erleiden +67% Schaden aus allen Schadensquellen.\n\nDie Verdammung ist permanent, ihre Auswirkungen enden erst mit dem Tod.

actors.buffs.dread.name=Grauen
actors.buffs.dread.desc=Ein Schrecken, der so groß ist, dass dieser sein Ziel dazu nötigt, so schnell wie möglich aus dem Dungeon zu fliehen!\n\nKreaturen, die vom Schrecken betroffen sind, laufen mit hoher Geschwindigkeit vor ihrem Gegner davon und verschwinden vollständig aus dem Dungeon, sobald sie außer Sichtweite sind. Für Feinde, die auf diese Weise beseitigt werden, gibt es keine Gegenstände und nur die Hälfte an Erfahrungspunkten. Der Schock des Schmerzes verringert die Dauer des Grauens.\n\nVerbleibende Züge des Grauens: %d.

actors.buffs.drowsy.name=schläfrig
actors.buffs.drowsy.desc=Eine magische Kraft macht es schwierig, wach zu bleiben. Nach einigen Zügen fällt das Ziel in einen tiefen magischen Schlaf.\n\nDer Held kann der Schläfrigkeit widerstehen, wenn er Schaden nimmt oder bei voller Gesundheit ist.\n\nZüge bis zum Eintritt des magischen Schlafs: %s

actors.buffs.earthimbue.name=eins mit der Erde
actors.buffs.earthimbue.desc=Du wirst von der Kraft der Erde erfüllt!\n\nAlle physischen Angriffe lassen den Erdboden unter den Feinden beben, so dass sie für eine kurze Zeit verkrüppelt werden.\n\nVerbleibende Züge mit Erd-Durchdringung: %s.

actors.buffs.enhancedrings.name=verbesserte Ringe
actors.buffs.enhancedrings.desc=Das zuletzt genutzte Artefakt des Schurken verstärkt seine Ringe, deren Stufe um 1 erhöht wird.\n\nVerbleibende Züge: %s.

actors.buffs.fireimbue.name=eins mit dem Feuer
actors.buffs.fireimbue.desc=Die Kräfte des Feuers durchströmen deinen Körper!\n\nAlle deine physischen Angriffe haben eine Chance, dass Gegner in Flammen aufgehen. Außerdem bist du komplett immun gegen die Auswirkungen von Feuer. \n\nVerbleibende Züge mit Feuer-Durchdringung: %s.

actors.buffs.foresight.name=Vorhersehung
actors.buffs.foresight.desc=Irgendwie ist es dir nun möglich, die räumlichen Umrisse des dich umgebenden Gebietes in deinem Geist zu erblicken.\n\nSolange der Effekt der Vorhersehung anhält, werden dir sämtliche Felder in einem großen Radius um dich herum offenbar, einschließlich eventueller versteckter Fallen oder Türen.\n\nVerbleibende Züge mit Vorhersehung: %s.

actors.buffs.frost.name=eingefroren
actors.buffs.frost.freezes=%s friert ein!
actors.buffs.frost.desc=Nicht zu verwechseln mit einer kompletten Einfrierung: Hier ist das Ziel eher von einer unschädlichen Eisschicht umhüllt.\n\nEinfrieren wirkt ähnlich wie Lähmung, was dem Opfer jegliche Bewegung verwehrt. Anders als bei einer Lähmung endet der Effekt, wenn das eingefrorene Ziel Schaden erleidet, da dadurch die Eisschicht aufbricht.\n\nVerbleibende Züge mit Einfrieren: %s.

actors.buffs.frostimbue.name=eins mit dem Frost
actors.buffs.frostimbue.desc=Die Kräfte des Eises durchströmen deinen Körper!\n\nAlle deine physischen Angriffe werden Feinde immer stärker einfrieren. Zusätzlich bist du selbst komplett gegen Kälte immun.\n\nVerbleibende Züge mit Frostkraft: %s.

actors.buffs.fury.name=wütend
actors.buffs.fury.heromsg=Du wirst wütend!
actors.buffs.fury.desc=Du bist wütend und das mögen deine Feinde ganz und gar nicht.\n\nEine große Wut ist in dir entbrannt, durch die der von dir verursachte physische Schaden um 50%% erhöht ist.\n\nSolange deine aktuelle Lebensenergie unter 50%% verbleibt, hält deine Wut an.

actors.buffs.blobimmunity.name=reinigende Barriere
actors.buffs.blobimmunity.desc=Eine wunderliche Kraft umgibt dich mit einer Schutzschicht, welche alle über die Luft kommenden negativen Effekte blockiert.\n\nDu bist immun gegen alle an den Ort gebundenen Effekte, solange die Barriere anhält.\n\nVerbleibende Züge mit Immunität: %s.

actors.buffs.gravitychaostracker.name=Gravitationschaos
actors.buffs.gravitychaostracker.desc_intro=Aller paar Züge werden alle Charaktere auf der aktuellen Ebene des Dungeons in eine zufällige Richtung geworfen.
actors.buffs.gravitychaostracker.desc_positive=Du und deine Verbündeten scheinen allerdings immun zu sein.
actors.buffs.gravitychaostracker.desc_duration=Es ist unklar, wie lange dieser Effekt anhält, aber er kann sicher nicht ewig andauern.

actors.buffs.greaterhaste.name=größere Eile
actors.buffs.greaterhaste.desc=Ein unglaublicher Geschwindigkeitsschub, für einen Moment fühlt es sich an, als ob alles andere stillsteht.\n\nUnter dem Einfluss größerer Eile dauern Bewegungsaktionen überhaupt keine Zeit, andere Aktionen werden jedoch weiterhin mit normaler Geschwindigkeit ausgeführt. Jeder Bewegungsschritt verbraucht einen Zug größerer Eile.\n\nVerbleibende Züge größerer Eile: %d

actors.buffs.haste.name=Eile
actors.buffs.haste.desc=Energie fließt durch deine Muskeln, was dich dazu befähigt, unglaublich schnell zu laufen!\n\nWährend du unter Eile stehst, rennst du mit 3-facher Geschwindigkeit, wirst aber alle anderen Aktionen mit normaler Geschwindigkeit ausführen\n\nVerbleibende Züge mit Eile: %s.

actors.buffs.healing.name=Heilung
actors.buffs.healing.desc=Ein magisches Heilmittel, welches Wunden schließt und Fleisch wieder zusammenfügt.\n\nDie Lebensenergie wird mit jedem Zug wiederhergestellt, bis die heilende Wirkung endet. Die Stärke der Heilung mag über die Zeit abnehmen.\n\nNächste Heilung: %d.\n\nVerbleibende Züge mit Heilung: %d.

actors.buffs.herodisguise.name=Tarnung
actors.buffs.herodisguise.desc=Illusionäre Magie hat dein Aussehen verändert! Der Effekt ist rein kosmetisch, fühlt sich aber trotzdem sehr seltsam an.\n\nVerbleibende Züge mit Verkleidung: %s.

actors.buffs.hex.name=verhext
actors.buffs.hex.heromsg=Du wurdest verhext!
actors.buffs.hex.desc=Dunkle Magie, welche die Konzentration beeinträchtigt und das Ziel so leicht desorientiert macht.\n\nVerhexung reduziert die Genauigkeit und das Ausweichen um 20%%, so dass das Ziel im Kampf weniger effektiv ist.\n\nVerbleibende Züge mit Verhexung: %s.

actors.buffs.holdfast.name=Position halten
actors.buffs.holdfast.desc=Der Krieger hält seine Position, was seine Rüstung um %1$d-%2$d verstärkt und die Abklingrate einiger Effekte um %3$d%% verlangsamt. Dies hält an, bis er sich wieder bewegt.

actors.buffs.hunger.hungry=hungrig
actors.buffs.hunger.starving=verhungernd
actors.buffs.hunger.onhungry=Du hast Hunger.
actors.buffs.hunger.onstarving=Du verhungerst!
actors.buffs.hunger.ondeath=Du bist verhungert...
actors.buffs.hunger.cursedhorn=Das verfluchte Horn stiehlt dem Essen einen Teil seiner Energie, wenn du etwas isst.
actors.buffs.hunger.rankings_desc=Verhungert
actors.buffs.hunger.desc_intro_hungry=Du fühlst, dass dein Bauch etwas zu Essen verlangt, aber es lässt sich noch aushalten.
actors.buffs.hunger.desc_intro_starving=Du bist so hungrig, dass es weh tut.
actors.buffs.hunger.desc=\n\nDein Hunger erhöht sich mit der Zeit, die du im Dungeon verbringst. Irgendwann beginnst du zu verhungern. Während du verhungerst, wirst du Lebensenergie verlieren, anstatt sie zu regenerieren.\n\nRationieren ist wichtig! Wenn du über genug Lebensenergie verfügst, kann Hungern eine Option sein, um Nahrung für später aufzusparen. Durch effiziente Rationierung kann deine Nahrung viel länger ausreichen!

actors.buffs.invisibility.name=unsichtbar
actors.buffs.invisibility.desc=Du bist visuell komplett mit deiner Umgebung verschmolzen, wodurch es unmöglich ist, dich zu entdecken.\n\nSolange du unsichtbar bist, können Gegner dich nicht angreifen oder verfolgen. Physische Angriffe oder magische Effekte (wie die Verwendung von Schriftrollen und Zauberstäben) beenden die Unsichtbarkeit sofort.\n\nVerbleibende Züge mit Unsichtbarkeit: %s.

actors.buffs.invulnerability.name=unverwundbar
actors.buffs.invulnerability.desc=Dieser Charakter ist mit großer Schutzkraft ausgestattet, die ihm für kurze Zeit Unverwundbarkeit verleiht!\n\nVerbleibende Züge: %s

actors.buffs.levitation.name=schwebend
actors.buffs.levitation.desc=Eine magische Kraft lässt dich schwerelos über dem Boden schweben.\n\nSchwebende Charaktere bewegen sich lautlos und ignorieren alle bodenbasierten Effekte. Fallen lösen nicht aus, brennende Charaktere können sich nicht im Wasser löschen, Pflanzen werden nicht zertrampelt, Wurzeln verfehlen und Gruben werden überflogen. Sei vorsichtig, denn all diese Dinge können in der Sekunde in Kraft treten, in der die Levitation endet!\n\nVerbleibende Züge mit Schweben: %s

actors.buffs.lifelink.name=Lebensverbindung
actors.buffs.lifelink.ondeath=Das Lebensband hat dich getötet…
actors.buffs.lifelink.desc=Die Lebenskraft dieses Charakters ist mit einem anderen Charakter in der Nähe verbunden. Jeglicher Schaden wird von diesen beiden geteilt.\n\nSobald diesem Charakter Schaden zugefügt wird, wird die Hälfte davon stattdessen an den Charakter am Ende der Lebensband weitergegeben.\n\nVerbleibende Züge mit Lebensband: %s.

actors.buffs.light.name=beleuchtet
actors.buffs.light.desc=Selbst im dunkelsten Dungeon ist ein ruhiges Licht an deiner Seite tröstlich.\n\nLicht hält Dunkelheit in Schach und erlaubt es dir, die umliegende Gegend angemessen zu erhellen.\n\nVerbleibende Züge mit Illumination: %s.

actors.buffs.lockedfloor.name=Ebene ist verschlossen
actors.buffs.lockedfloor.desc=Diese Ebene ist verschlossen und du kannst sie nicht verlassen!\n\nWährend eine Ebene verschlossen ist, leidest du keinen Hunger und erleidest keinen Schaden durch Verhungern. Außerdem werden deine passiven Regenerationseffekte stoppen, wenn du dich nicht gerade daran machst, den Boss auf dieser Ebene zu besiegen.\n\nWenn du von einem ungesegneten Anch wiederbelebt wirst, während die Ebene verschlossen ist, wird die Ebene neu gestartet.\n\nTöte den Boss, um die Ebene zu entriegeln.

actors.buffs.lostinventory.name=verlorenes Inventar
actors.buffs.lostinventory.desc=Du hast dein Inventar irgendwo im Dungeon verloren! Bis du es wiedererlangst, wirst du kaum Gegenstände aufnehmen und benutzen können.

actors.buffs.magicalsight.name=magische Sicht
actors.buffs.magicalsight.desc=Irgendwie kannst du mit deinem Geist anstelle deiner Augen sehen.\n\nSolange Magische Sicht aktiv ist, kannst du in einem 12-Felder-Radius durch das Gelände blicken.\n\nVerbleibende Züge mit magischer Sicht: %s.

actors.buffs.magicalsleep.name=magischer Schlaf
actors.buffs.magicalsleep.toohealthy=Du bist zu gesund und widerstehst dem Drang zu schlafen.
actors.buffs.magicalsleep.fallasleep=Du fällst in einen magischen Schlaf.
actors.buffs.magicalsleep.wakeup=Du wachst auf und fühlst dich erfrischt und gesund.
actors.buffs.magicalsleep.desc=Dieser Charakter ist in einen magischen Schlaf gefallen, von dem er auf natürliche Weise nicht erwachen kann.\n\nMagischer Schlaf ähnelt normalem Schlaf, allerdings kann nur zugefügter Schaden das Ziel wecken.\n\nFür den Helden und seine Verbündeten hat der magische Schlaf einige regenerative Eigenschaften, die es ihnen erlauben, sich beim Schlafen schnell zu heilen.

actors.buffs.magicimmune.name=immun gegenüber Magie
actors.buffs.magicimmune.desc=Alle magischen Effekte verlieren ihre Gewalt über dich, du bist ihnen gegenüber vollkommen immun.\n\nSolange die Immunität gegen Magie anhält, haben schädigende und helfende magische Effekte keine Wirkung auf dich, einschließlich solcher Dinge wie Flüche, Verzauberungen, Zauberstäbe, Schriftrollen, Ringe, Artefakte usw. Die Fähigkeiten der Heldenrüstung sind allerdings stark genug, um trotz dieses Effekts zu funktionieren.\n\nVerbleibende Züge mit Immunität gegen Magie: %s.

actors.buffs.mindvision.name=übersinnliche Wahrnehmung
actors.buffs.mindvision.desc=Irgendwie kannst du alle Kreaturen auf dieser Ebene mithilfe deiner Gedanken ausmachen. Es ist ein seltsames Gefühl.\n\nAlle Wesen auf dieser Ebene sind sichtbar, solange die übersinnliche Wahrnehmung aktiv ist. Eine dadurch gesichtete Kreatur gilt als gültiges Ziel für viele magische Effekte.\n\nVerbleibende Züge mit übersinnlicher Wahrnehmung: %s.

actors.buffs.momentum.momentum=Schwung aufbauen
actors.buffs.momentum.running=freilaufend
actors.buffs.momentum.resting=sich erholend
actors.buffs.momentum.action_name=Freilauf
actors.buffs.momentum.momentum_desc=Wenn er sich bewegt, baut der Freiläufer Schwung auf, welchen er zum Starten des Freilaufens nutzen kann.\n\nJede Ladung Schwung garantiert 2 Züge Freilaufen; der Freiläufer kann bis zu 10 Ladungen aufbauen. Schwung geht schnell verloren, wenn der Freiläufer stehen bleibt.\n\nDerzeitige Schwung-Ladung: %d.
actors.buffs.momentum.running_desc=Während er sich bewegt, baut der Freiläufer Schwung auf, welchen er zum Starten des Freilaufens nutzen kann.\n\nWährend des Freilaufens bewegt sich der Freiläufer doppelt so schnell und bekommt einen auf seiner Stufe basierenden Bonus auf Ausweichen.\n\nVerbleibende Züge: %d.
actors.buffs.momentum.resting_desc=Während er sich bewegt, baut der Freiläufer Schwung auf, welchen er zum Starten des Freilaufens nutzen kann.\n\nDer Freiläufer braucht Zeit, um seine Ausdauer zu regenerieren, bevor er wieder Schwung aufbauen kann.\n\nVerbleibende Züge: %d.

actors.buffs.monkenergy.name=Energie
actors.buffs.monkenergy.action=Fähigkeiten der Nonne
actors.buffs.monkenergy.desc=Indem sie Feinde besiegt, sammelt die Nonne Energie, die sie in einer Vielzahl verschiedener Fähigkeiten einsetzen kann. Die meisten Feinde bringen ihr, wenn sie besiegt werden, 1 Energie, und die Nonne verliert mit der Zeit keine Energie.\n\nAktuelle Energie: %1$d/%2$d.
actors.buffs.monkenergy.desc_cooldown=Die Nonne hat gerade eine Fähigkeit eingesetzt, und muss etwas warten, bevor sie eine weitere einsetzen kann.\n\nAktuelle Abklingzeit: %d Züge.
actors.buffs.monkenergy$monkability$flurry.name=hastige Hiebe
actors.buffs.monkenergy$monkability$flurry.desc=Zwei sofortige Schläge, die %1$d-%2$d Schaden verursachen und Rüstung ignorieren. Diese Fähigkeit kann nicht sofort wiederholt werden.
actors.buffs.monkenergy$monkability$flurry.empower_desc=Zwei sofortige Schläge, die %1$d-%2$d Schaden verursachen, Rüstung ignorieren _und die Verzauberung deiner Waffe nutzen_. Diese Fähigkeit kann nicht sofort wiederholt werden.
actors.buffs.monkenergy$monkability$focus.name=Konzentration
actors.buffs.monkenergy$monkability$focus.desc=Die Nonne konzentriert sich einen Zug lang, so dass sie den nächsten, gegen sie geführten Angriff pariert.
actors.buffs.monkenergy$monkability$focus.empower_desc=Die Nonne _fokussiert augenblicklich_, wodurch sie den nächsten, gegen sie geführten Angriff pariert.
actors.buffs.monkenergy$monkability$focus$focusbuff.name=konzentriert
actors.buffs.monkenergy$monkability$focus$focusbuff.desc=Die Nonne konzentriert sich auf ihre Umgebung und kann den nächsten gegen sie geführten Angriff voraussehen. Solange sie konzentriert ist, wird sie den nächsten Angriff garantiert parieren.
actors.buffs.monkenergy$monkability$dash.name=Sprint
actors.buffs.monkenergy$monkability$dash.prompt=Wähle einen Ort
actors.buffs.monkenergy$monkability$dash.desc=Ein augenblicklicher Sprint auf bis zu 4 Felder Entfernung. Mit dieser Fähigkeit kann man über Gefahren, nicht aber über Gegner oder durch Hindernisse springen.
actors.buffs.monkenergy$monkability$dash.empower_desc=Ein augenblicklicher Sprung über bis zu _8 Felder_. Durch diese Fähigkeit kann man über Gefahren, nicht aber über Gegner oder durch Hindernisse springen.
actors.buffs.monkenergy$monkability$dragonkick.name=Drachentritt
actors.buffs.monkenergy$monkability$dragonkick.desc=Ein verheerender Tritt, der %1$d-%2$d Schaden zufügt und Rüstungen ignoriert. Der Tritt schleudert das Ziel fort und paralysiert es einen Zug pro Feld, das es dabei zurücklegt.
actors.buffs.monkenergy$monkability$dragonkick.empower_desc=Ein verheerender Tritt, der _%1$d-%2$d Schaden_ verursacht und dabei Rüstung ignoriert. Der Tritt stößt _alle angrenzenden Ziele_ weg und paralysiert sie so lange, wie viele Felder sie gestoßen wurden.
actors.buffs.monkenergy$monkability$meditate.name=Meditieren
actors.buffs.monkenergy$monkability$meditate.desc=Die Nonne fokussiert 5 Züge lang Energie in ihrem Körper. Dies reinigt sie von den meisten negativen Effekten und gewährt ihr 8 Züge lang Aufladung von Zauberstäben und Artefakten.
actors.buffs.monkenergy$monkability$meditate.empower_desc=Die Nonne fokussiert ihre Energie 5 Züge lang in ihren Körper. Dadurch werden die meisten negativen Effekte neutralisiert und sie erhält 8 Züge Aufladung für Zauberstäbe und Artefakte. _Sie erhält außerdem 80% Schadensresistenz während der Meditation, und 20% ihrer fehlenden Lebenspunkte werden allmählich wiederhergestellt._

actors.buffs.ooze.name=ätzender Schlamm
actors.buffs.ooze.heromsg=Ätzender Schlamm frisst sich durch dein Fleisch! Wasch ihn ab!
actors.buffs.ooze.ondeath=Du löst dich auf...
actors.buffs.ooze.rankings_desc=Aufgelöst
actors.buffs.ooze.desc=Diese klebrige Säure haftet sich an Fleisch und löst es langsam auf.\n\nDer Schlamm wird dir durchgängig Schaden zufügen, kann jedoch sofort im Wasser abgewaschen werden.\n\nVerbleibende Züge mit Schlamm: %s.

actors.buffs.paralysis.name=gelähmt
actors.buffs.paralysis.heromsg=Du bist gelähmt!
actors.buffs.paralysis.out=widersteht der Lähmung
actors.buffs.paralysis.desc=Häufig ist es das Schlimmste, gar nichts zu tun.\n\nEine Lähmung bringt sämtliche Aktionen zum Erliegen und zwingt das Ziel dazu, solange auszuharren, bis der Effekt vorüber ist. Der Schmerz von erlittenen Verletzungen kann aber dazu führen, dass Opfer der Lähmung widerstehen und sich damit von der Wirkung befreien.\n\nVerbleibende Züge mit Lähmung: %s.

actors.buffs.physicalempower.name=körperlich ertüchtigt
actors.buffs.physicalempower.desc=Deine Schläge sind verstärkt, so dass du mit physischen Angriffen mehr Schaden austeilst, sofern du Gegner angreifst.\n\nBonusschaden: %1$d.\nVerbleibende Schläge: %2$d.

actors.buffs.pincushion.name=Nadelkissen
actors.buffs.pincushion.desc=Die Wurfwaffen, die du gegen diesen Charakter eingesetzt hast, stecken derzeit in ihm und fallen zu Boden, nachdem er besiegt wurde.\n\nDie folgenden Gegenstände sind derzeit angeheftet:

actors.buffs.poison.name=vergiftet
actors.buffs.poison.heromsg=Du bist vergiftet!
actors.buffs.poison.ondeath=Du bist an der Vergiftung gestorben...
actors.buffs.poison.rankings_desc=Dem Gift erlegen
actors.buffs.poison.desc=Gift arbeitet sich durch deinen gesamten Körper und schädigt diesen nach und nach.\n\nDas Gift richtet jeden Zug Schaden an, bis es abklingt. Die Menge des Schadens hängt von der Dauer der Vergiftung ab,\n\nVerbleibende Züge mit Vergiftung: %s.

actors.buffs.preparation.name=Vorbereitung
actors.buffs.preparation.action_name=vorbereiteter Schlag
actors.buffs.preparation.desc=Der Attentäter wartet geduldig und bereitet sich darauf vor, aus dem Schatten zuzuschlagen.
actors.buffs.preparation.desc_dmg=Sein nächster Angriff wird _%1$d%%Bonus-Schaden anrichten_ und wird einfache Gegner mit weniger als _%2$d%% Gesundheit_ oder Bosse mit weniger als _%3$d%%Gesundheit_ umbringen.
actors.buffs.preparation.desc_dmg_likely=Der Angriff hat außerdem eine höhere Chance, mehr Schaden zuzufügen.
actors.buffs.preparation.desc_blink=Er kann sich an den Gegner heran teleportieren, bevor er angreift, mit einer maximalen Reichweite von _%d._
actors.buffs.preparation.desc_invis_time=Unsichtbar verbrachte Züge: _%d._
actors.buffs.preparation.desc_invis_next=Züge mit verstärkten Angriffen: _%d._
actors.buffs.preparation.prompt=Wähle ein anzugreifendes Ziel!\nMaximale Teleportationsreichweite: %d
actors.buffs.preparation.no_target=Hier gibt es nichts anzugreifen.
actors.buffs.preparation.out_of_reach=Das Ziel ist außer Reichweite.
actors.buffs.preparation.assassinated=gemeuchelt

actors.buffs.prismaticguard.name=Spektralschild
actors.buffs.prismaticguard.desc=Du wirst von einem spektralen Abbild geschützt, das derzeit nicht aktiv ist. Wenn Feinde zugegen sind, wird das Abbild zu deinem Schutze aktiv!\n\nSolange es inaktiv ist, wird das Abbild sich stetig von Schaden erholen, den es erlitten hat.\n\nDerzeitige Lebenspunkte: %d/%d.
actors.buffs.prismaticguard.desc_many=Dieses spektrale Abbild profitiert auch von der Macht der Vielen. Verbleibende Züge: %d.

actors.buffs.recharging.name=aufladend
actors.buffs.recharging.desc=Energie fließt durch deinen Körper, was die Aufladerate deiner Zauberstäbe verbessert.\n\nDie Aufladung wird jeden Zug um ein Viertel erhöht, zusätzlich zur Standardaufladung. \n\nVerbleibende Züge mit Aufladung: %s.

actors.buffs.revealedarea.name=aufgedecktes Gebiet
actors.buffs.revealedarea.desc=Dem Helden wurde vorübergehend ein Teil des Dungeons offenbart. Der Held wird diesen Teil sehen, egal, wo er sich befindet.\n\nVerbleibende Züge: %s.

actors.buffs.revealedchar.name=aufgedeckt
actors.buffs.revealedchar.desc=Dieser Charakter wurde dem Helden offenbart. Der Held wird ihn sehen, egal, wo er sich befindet.\n\nVerbleibende Züge: %s.

actors.buffs.roots.name=verwurzelt
actors.buffs.roots.heromsg=Du kannst dich nicht bewegen!
actors.buffs.roots.desc=Wurzeln (magisch oder natürlich) schlingen sich um Füße und halten ihre Opfer am Boden.\n\nWurzeln fesseln das Opfer und zwingen es zur Bewegungslosigkeit. Andere Aktionen können weiterhin durchgeführt werden, einschließlich Teleportationseffekte.\n\nVerbleibende Züge mit Verwurzelung: %s.

actors.buffs.scrollempower.name=Schriftrollenverstärker
actors.buffs.scrollempower.desc=Die Energie aus der kürzlich gelesenen Schriftrolle des Magiers stärkt seine Zauberstäbe!\n\nStufenanstieg: +%1$d.\nVerbleibende Zauber: %2$d.

actors.buffs.shadows.name=mit den Schatten verschmolzen
actors.buffs.shadows.desc=Du bist mit den Schatten verschmolzen, was dir Unsichtbarkeit gewährt und deinen Stoffwechsel verlangsamt.\n\nWährend du unsichtbar bist, können Gegner dich weder angreifen noch dir folgen. Die meisten physischen sowie magischen Angriffe (wie Schriftrollen oder Stäbe) werden die Unsichtbarkeit sofort beenden. Außerdem nimmt dein Hunger langsamer zu, während du unsichtbar bist.\n\nDein Schattenmantel verbleibt so lange, bis du die Schatten verlässt oder in Kontakt mit einem Gegner kommst.

actors.buffs.slow.name=verlangsamt
actors.buffs.slow.desc=Verlangsamungsmagie wirkt auf den Zeitfluss ihres Ziels; für das Ziel bewegt sich alles ungewöhnlich schnell.\n\nEin verlangsamter Charakter benötigt für alle seine Aktionen doppelt so viel Zeit wie gewöhnlich.\n\nVerbleibende Züge mit Verlangsamung: %s.

actors.buffs.snipersmark.name=Markierung der Scharfschützin
actors.buffs.snipersmark.action_name_snapshot=Schnappschuss
actors.buffs.snipersmark.action_name_volley=Salve
actors.buffs.snipersmark.action_name_sniper=Scharfschützenschuss
actors.buffs.snipersmark.desc=Die Scharfschützin ist auf das Ziel konzentriert, das sie zuletzt angegriffen hat. Sie ist in der Lage, mit ihrem Bogen einen speziellen Angriff auszuführen, der davon abhängt, wie der Bogen verbessert wurde.\n\nEin nicht ausgerüsteter Bogen wird einen _Schnellschuss_ abfeuern, der weniger Schaden anrichtet, aber keine Zeit zum Abfeuern braucht.\n\nEin Bogen, der hinsichtlich Geschwindigkeit verbessert wurde, kann eine _Salve_ von drei Pfeilen abfeuern. Jeder Pfeil verursacht geringen Schaden, kann aber trotzdem eine Verzauberung bewirken. Das Abfeuern der Salve dauert einen Zug.\n\nEin auf Schaden hin ausgebauter Bogen wird einen _Präzisionsschuss_ abfeuern. Dieser Schuss ist ein garantierter Treffer, benötigt zwei Züge und verursacht einen Extraschaden, welcher von der Entfernung zum Ziel abhängt.\n\nVerbleibende Züge: %s.

actors.buffs.soulmark.name=Seele markiert
actors.buffs.soulmark.desc=Der Hexenmeister hat sich an die Seele dieser Kreatur gebunden. Er heilt und sättigt sich, während die Kreatur physischen Schaden nimmt, solange das Seelenzeichen verbleibt.\n\nVerbleibende Züge mit Seelenzeichnung: %s.

actors.buffs.stamina.name=Ausdauer
actors.buffs.stamina.desc=Du hast unendliche Ausdauer, die dir schnellere Bewegungen erlaubt!\n\nSolange du unter dem Einfluss der Ausdauer stehst, läufst du 50 %% schneller, aber wirst alle anderen Aktionen mit normaler Geschwindigkeit ausführen.\n\nVerbleibende Züge mit Ausdauer: %s.

actors.buffs.vulnerable.name=verwundbar
actors.buffs.vulnerable.heromsg=Du fühlst dich zerbrechlich!
actors.buffs.vulnerable.desc=Verwundbarkeitsmagie steigert jeden physischen Schaden, der einem Charakter zugefügt wird, um 33%%, nachdem der Schaden durch die Rüstung reduziert worden ist.\n\nVerbleibende Züge mit Verwundbarkeit: %s.

actors.buffs.terror.name=verängstigt
actors.buffs.terror.desc=Terror ist manipulative Magie, die ihr Ziel zu einer unkontrollierten Panik zwingt.\n\nTerrorisierte Charakter werden gezwungen, vor ihrem Feind Reißaus zu nehmen und zu versuchen, so viele Türen und Wände wie möglich zwischen sich und den Feind zu bringen. Allerdings verringert der Schock durch Schmerz die Dauer des Terrors.\n\nVerbleibende Züge mit Terror: %s.

actors.buffs.toxicimbue.name=eins mit dem Gift
actors.buffs.toxicimbue.desc=Du bist eins mit dem Element des Giftes!\n\nImmer, wenn du dich bewegst, bricht ein Schwall von giften Gasen hervor, welcher deinen Gegnern schadet. Solange du diesen Effekt besitzt, und einige Züge darüber hinaus, bist du gegen die Auswirkungen von Giftgas und Gift immun.\n\nVerbleibende Züge mit toxischer Durchdringung: %s.

actors.buffs.corrosion.name=Korrosion
actors.buffs.corrosion.heromsg=Du löst dich auf!
actors.buffs.corrosion.ondeath=Du löst dich auf...
actors.buffs.corrosion.rankings_desc=Aufgelöst
actors.buffs.corrosion.desc=Eine starke Säure löst – mit atemberaubender Geschwindigkeit – Fleisch, Metall und Knochen auf.\n\nDer Schaden durch die Zersetzung steigt mir der Zeit, in der sich das Ziel weiter auflöst.\n\nVerbleibende Züge mit Zersetzung: %1$s.\nDerzeitiger Zersetzungsschaden: %2$d.

actors.buffs.vertigo.name=schwindelig
actors.buffs.vertigo.desc=In einer geraden Linie zu laufen kann schwierig sein, wenn sich dabei die ganze Welt dreht.\n\nSolange man unter Schwindel leidet, bewegt man sich in eine zufällige Richtung anstatt in die gewünschte Richtung.\n\nVerbleibende Züge mit Schwindelgefühl: %s

actors.buffs.wandempower.name=Zauberstäbe gestärkt
actors.buffs.wandempower.desc=Deine schadensverursachenden Zauberstäbe wurden verstärkt, wodurch der Schaden, den sie verursachen, für einige Treffer erhöht ist.\n\nBonusschaden: %1$d.\nVerbleibende Treffer: %2$d.

actors.buffs.weakness.name=geschwächt
actors.buffs.weakness.heromsg=Du fühlst dich geschwächt!
actors.buffs.weakness.desc=Alles erscheint plötzlich sehr viel schwerer zu sein.\n\nSchwächungsmagie reduziert die körperliche Stärke eines Charakters, so dass dieser um 33%% verringerten Schaden verursacht.\n\nVerbleibende Züge mit Schwäche: %s.

actors.buffs.wellfed.name=gut genährt
actors.buffs.wellfed.desc=Du fühlst dich ziemlich zufrieden und satt.\n\nSolange dein Bauch vollgestopft ist, wird dein Hunger sich nicht vergrößern und du wirst eine Zeitlang etwas mehr heilen.\n\nVerbleibende Züge: %d.



###hero

##abilities
actors.hero.abilities.armorability.self_target=Du kannst nicht auf dich selbst zielen!
actors.hero.abilities.armorability.no_target=Dort befindet sich kein Ziel!
actors.hero.abilities.armorability.prompt=Wähle einen Ort als Ziel
actors.hero.abilities.armorability.cost=Aufladekosten: _%d_

actors.hero.abilities.warrior.heroicleap.name=Heldensprung
actors.hero.abilities.warrior.heroicleap.prompt=Wähle die Richtung, in die du springen möchtest
actors.hero.abilities.warrior.heroicleap.short_desc=Der Krieger führt einen _Heldensprung_ zum anvisierten Ort aus und segelt dabei über Feinde und Gefahren hinweg.
actors.hero.abilities.warrior.heroicleap.desc=Der Krieger springt zu einer anvisierten Position und überspringt dabei alle Feinde oder Hindernisse, die sich ihm in den Weg stellen. Er kann jedoch nicht über Wände oder anderes festes Terrain springen.
actors.hero.abilities.warrior.shockwave.name=Schockwelle
actors.hero.abilities.warrior.shockwave.short_desc=Der Krieger setzt eine _Schockwelle_ in einem konischen Gebiet frei, indem er auf den Boden schlägt. Feinde, die von der Schockwelle erfasst werden, erleiden Schaden und werden gelähmt.
actors.hero.abilities.warrior.shockwave.desc=Der Krieger schlägt auf den Boden und ruft dadurch eine Schockwelle hervor, die bis zu 5 Felder weit in einem kegelförmigen Bereich von 60 Grad reicht.\n\nFeinde, die von dieser Schockwelle erwischt werden, sind 5 Züge lang verkrüppelt. Außerdem bekommen sie 5-10 Punkte Schaden, dazu 1-2 Schadenspunkte pro Stärke, die der Krieger über 10 hinaus hat.
actors.hero.abilities.warrior.endure.name=ertragen
actors.hero.abilities.warrior.endure$enduretracker.name=Ausdauer
actors.hero.abilities.warrior.endure$enduretracker.desc=Der Krieger verursacht nun Bonusschaden auf der Grundlage des erlittenen Schadens.\n\nBonus-Schaden: %1$d\nVerbleibende Schläge: %2$d
actors.hero.abilities.warrior.endure.short_desc=Der Krieger _hält durch_, überspringt mehrere Züge, erhält aber eine hohe Schadensresistenz. Er verursacht dann Bonus-Schaden basierend auf dem Schaden, den er eingesteckt hat.
actors.hero.abilities.warrior.endure.desc=Der Krieger hält 3 Züge lang durch und erleidet nur die Hälfte des Schadens aus allen Quellen. Diese Reduktion wird vor schadenssenkenden Effekten wie Rüstungen angewendet.\n\nNach dem Durchhalten teilt der Krieger bei seinem nächsten Treffer innerhalb von 10 Zügen Bonusschaden aus. Dieser Bonusschaden entspricht der Hälfte des gesamten Schadens, der ihm während des Aushaltens zugefügt wurde, vor allen Effekten der Schadensreduzierung!\n\nWenn der Krieger über eine Kombi verfügt, erhöht sich die verbleibende Zeit durch den Einsatz dieser Fähigkeit um 3 Züge.

actors.hero.abilities.mage.elementalblast.name=Elementarstoß
actors.hero.abilities.mage.elementalblast.no_staff=Du kannst diese Fähigkeit ohne deinen Zauberstab nicht einsetzen.
actors.hero.abilities.mage.elementalblast.short_desc=Der Magier sendet einen _Elementarstoß_ aus seinem Stab aus, der einen großen Bereich um ihn herum mit einem Effekt bedeckt, der je nach dem Zauber in seinem Stab variiert.
actors.hero.abilities.mage.elementalblast.desc=Der Magier sendet einen Magiestoß aus, der einen Radius von bis zu 4 Feldern abdeckt und bis zu 15-25 Schaden verursacht. Der spezifische Effekt des Magiestoßes hängt von dem Zauberstab ab, der mit dem Stab des Magiers fusioniert wurde.
actors.hero.abilities.mage.elementalblast.generic_desc=Die Wirkung des Elementarstoßes ähnelt der Wirkung des Zauberstabs, wenn er auf einen Feind oder Verbündeten gezielt wird.
actors.hero.abilities.mage.wildmagic.name=Wilde Magie
actors.hero.abilities.mage.wildmagic.no_wands=Du hast keine Zauberstäbe, die du einsetzen könntest!
actors.hero.abilities.mage.wildmagic.short_desc=Der Magier entfesselt die _Wilde Magie_, die in seinen Zauberstäben innewohnt, und feuert sie in einem einzigen Zug zufällig mehrmals auf ein ausgewähltes Ziel.
actors.hero.abilities.mage.wildmagic.desc=Der Magier entfesselt die Macht in seinen Zauberstäben, indem er sie bis zu 4 Mal in einem einzigen Zug zufällig abfeuert. Der Stab des Magiers wird bei diesem Effekt nicht berücksichtigt.\n\nAußerdem wird die Stufe jedes Zauberstabs um 2 erhöht, bis zu +3. Diese Fähigkeit verbraucht die Hälfte der Ladungen für jeden Schuss, und ein Zauberstab kann nicht mehr als 2 Mal abgefeuert werden.
actors.hero.abilities.mage.warpbeacon.name=Sprungmarke
actors.hero.abilities.mage.warpbeacon.depths=Du kannst nicht zwischen Tiefen springen.
actors.hero.abilities.mage.warpbeacon.locked_floor=Du kannst eine blockierte Ebene nicht verlassen.
actors.hero.abilities.mage.warpbeacon.too_far=Dieser Ort is zu weit entfernt!
actors.hero.abilities.mage.warpbeacon.invalid_beacon=Du kannst den Marker dort nicht platzieren!
actors.hero.abilities.mage.warpbeacon.window_desc=Dein Marker ist derzeit platziert auf Ebene %d.
actors.hero.abilities.mage.warpbeacon.window_tele=Teleportiere zum Marker
actors.hero.abilities.mage.warpbeacon.window_clear=entferne Marker
actors.hero.abilities.mage.warpbeacon.window_cancel=abbrechen
actors.hero.abilities.mage.warpbeacon.short_desc=Der Magier platziert eine _Sprungmarke_ an seinem aktuellen Standort, zu dem er sich sofort zurückteleportieren kann.
actors.hero.abilities.mage.warpbeacon.desc=Der Magier platziert eine Sprungmarke, zu der er sich auf Wunsch teleportieren kann. Die Platzierung einer Sprungmarke benötigt einen Zug, aber das Teleportieren passiert augenblicklich.\n\nDer Magier kann normalerweise nicht zwischen verschiedenen Ebenen teleportieren oder unerreichbare Orte, wie verschlossene Räume, erreichen. Der Magier kann in Gegner hinein teleportieren, wodurch sie beiseite geschoben werden.

actors.hero.abilities.rogue.smokebomb.name=Rauchbombe
actors.hero.abilities.rogue.smokebomb.fov=Du kannst nur zu einem leeren Feld in deinem Sichtfeld springen.
actors.hero.abilities.rogue.smokebomb.prompt=Wähle, wohin du springen möchtest
actors.hero.abilities.rogue.smokebomb$ninjalog.name=hölzerner Köder
actors.hero.abilities.rogue.smokebomb$ninjalog.desc=Irgendwie sind Gegner einfach davon überzeugt, dass dieser hölzerne Köder der echte Schurke ist!
actors.hero.abilities.rogue.smokebomb$ninjalog.discover_hint=Diesen Charakter kannst du durch Verwendung einer bestimmten Rüstungsfertigkeit entdecken.
actors.hero.abilities.rogue.smokebomb.short_desc=Der Schurke lässt eine _Rauchbombe_ fallen, während er sich wegteleportiert. Er blendet die Gegner nahe seiner alten Position.
actors.hero.abilities.rogue.smokebomb.desc=Der Schurke wirft eine Rauchbombe und teleportiert sich bis zu 6 Felder weit weg. Er kann durch Gefahren und Feinde hindurch teleportieren, aber nicht durch festes Terrain wie Wände.\n\nFeinde, die sich in der Nähe der alten Position des Schurken befinden, werden 5 Züge lang geblendet.
actors.hero.abilities.rogue.deathmark.name=Todesmakierung
actors.hero.abilities.rogue.deathmark.ally_target=Du kannst nur Gegner markieren.
actors.hero.abilities.rogue.deathmark.short_desc=Der Schurke platziert eine _Todesmarkierung_ auf einem ausgewählten Gegner. Markierte Gegner erleiden Bonusschaden, aber können nicht sterben, bevor die Markierung beendet ist.
actors.hero.abilities.rogue.deathmark.desc=Der Schurke platziert eine Markierung auf einen ausgewählten Gegner, was dafür sorgt, dass dieser 25% Bonusschaden bekommt. Die Markierung wird sofort eingesetzt und hält 5 Züge.\n\nMarkierte Gegner erleiden Bonusschaden, aber können nicht sterben, bis die Markierung ausläuft. Wenn ein Gegner bei Auslauf der Markierung 0 Lebenspunkte hat, stirbt er sofort.
actors.hero.abilities.rogue.deathmark$deathmarktracker.name=für den Tod markiert
actors.hero.abilities.rogue.deathmark$deathmarktracker.desc=Dieser Gegner wurde markiert, was dafür sorgt, dass er 25%% Bonusschaden bekommt, aber auch, dass er nicht sterben kann, bevor die Markierung ausläuft.\n\nVerbleibende Züge: %s.
actors.hero.abilities.rogue.shadowclone.name=Schattendoppelgänger
actors.hero.abilities.rogue.shadowclone.short_desc=Der Schurke beschwört einen _Schattendoppelgänger_, welcher gelenkt werden kann, um ihn im Kampf zu unterstützen.
actors.hero.abilities.rogue.shadowclone.desc=Der Schurke beschwört eine schattenhafte Nachahmung seiner selbst, die darauf gerichtet werden kann, ihn im Kampf zu unterstützen. Die Führung des Schattenklons kostet keine Ladung.\n\nDer Klon hat 80 Lebenspunkte, keine Rüstung und verursacht 10-20 Schaden. Alle diese Eigenschaften können mit Talenten verbessert werden, so dass der Klon von Waffen und Rüstungen profitiert, die der Held besitzt.
actors.hero.abilities.rogue.shadowclone$shadowally.name=Schattenschurke
actors.hero.abilities.rogue.shadowclone$shadowally.direct_defend=Dein Klon bewegt sich an diese Position.
actors.hero.abilities.rogue.shadowclone$shadowally.direct_follow=Dein Klon wird dir folgen.
actors.hero.abilities.rogue.shadowclone$shadowally.direct_attack=Dein Klon greift jetzt an!
actors.hero.abilities.rogue.shadowclone$shadowally.desc=Eine Kopie des Schurken aus schattenhafter Dunkelheit. Es steht still wie eine Statue, mit leeren Augen und winzigen Irrlichtern aus Dunkelheit, die wie Dampf aus ihm aufsteigen.\n\nDer Klon ist keine perfekte Kopie des Schurken, aber dennoch ein anständiger Kämpfer und kann mit den richtigen Talenten von der Ausrüstung des Schurken profitieren.
actors.hero.abilities.rogue.shadowclone$shadowally.discover_hint=Diesen Charakter kannst du durch Verwendung einer bestimmten Rüstungsfertigkeit entdecken.

actors.hero.abilities.huntress.spectralblades.name=Spektralklingen
actors.hero.abilities.huntress.spectralblades.short_desc=Die Jägerin wirft _Spektralklingen_ auf ein Ziel und verursacht Schaden auf Grundlage ihrer momentan ausgerüsteten Nahkampfwaffe.
actors.hero.abilities.huntress.spectralblades.desc=Die Jägerin wirft eine Geisterklinge auf einen Feind, die wie ein Fernangriff ihrer Nahkampfwaffe wirkt. Alle normalen Effekte einer Nahkampfwaffe werden aktiviert, einschließlich Verzauberungen.
actors.hero.abilities.huntress.naturespower.name=Kraft der Natur
actors.hero.abilities.huntress.naturespower.short_desc=Die Jägerin ruft die _Kräfte der Natur_, wodurch ihre Bewegungsgeschwindigkeit und die Feuerrate ihres Bogens für eine kurze Zeit erhöht wird.
actors.hero.abilities.huntress.naturespower.desc=Die Jägerin stärkt sich und ihren Bogen eine Zeitlang mit der Kraft der Natur! Dies hält 8 Züge lang an.\n\nIn dieser Zeit bewegt sich die Jägerin mit doppelter Geschwindigkeit, die Angriffe mit ihrem Bogen erfolgen um 33% schneller. Die Bonuseffekte am Bogen werden nicht ausgelöst, wenn die Scharfschützin ihre Spezialangriffe einsetzt.
actors.hero.abilities.huntress.naturespower$naturespowertracker.name=Kraft der Natur
actors.hero.abilities.huntress.naturespower$naturespowertracker.desc=Die Jägerin ist kurzzeitig dazu in der Lage, ihre Bewegungsgeschwindigkeit und die Angriffsgeschwindigkeit mit ihrem Bogen zu erhöhen.\n\nVerbleibende Züge: %s.
actors.hero.abilities.huntress.spirithawk.name=Geisterfalke
actors.hero.abilities.huntress.spirithawk.no_space=Es ist kein Platz in deiner Nähe frei.
actors.hero.abilities.huntress.spirithawk.short_desc=Die Jägerin beschwört einen _Geisterfalken_-Vertrauten, der ihr helfen kann, Orte auszukundschaften und Gegner abzulenken.
actors.hero.abilities.huntress.spirithawk.desc=Die Jägerin beschwört einen Geisterfalken-Vertrauten, der durch erneutes Anwenden der Fähigkeit gelenkt werden kann, solange er beschworen bleibt. Der Falke bleibt 100 Züge lang aktiv, und die Steuerung des Falken kostet keine Ladung.\n\nDer Falke hat nur wenige Lebenspunkte und Angriffskraft, ist aber schnell, weicht gut aus und ist treffsicher. Er teilt sein gesamtes Sichtfeld stetig mit der Jägerin. Er ist immun gegen alle flächengebundenen Effekte, wie Feuer oder Giftgas. Er greift nicht an, wenn er nicht ausdrücklich dazu aufgefordert wird.
actors.hero.abilities.huntress.spirithawk$hawkally.name=Geisterfalke
actors.hero.abilities.huntress.spirithawk$hawkally.direct_defend=Dein Falke bewegt sich an diese Position.
actors.hero.abilities.huntress.spirithawk$hawkally.direct_follow=Dein Falke bewegt sich und folgt dir.
actors.hero.abilities.huntress.spirithawk$hawkally.direct_attack=Dein Falke bewegt sich zum Angriff!
actors.hero.abilities.huntress.spirithawk$hawkally.desc=Ein magischer Falke, beschworen von der Jägerin. Er leuchtet in einem hellen ätherischen Blau, sein Kopf bewegt sich ständig, während er die Umgebung überblickt. \n\nObwohl er kein großer Kämpfer ist, eignen sich seine Geschwindigkeit und seine Sicht hervorragend zum Aufspüren und Ablenken von Feinden.
actors.hero.abilities.huntress.spirithawk$hawkally.desc_remaining=Verbleibende Züge: %d.
actors.hero.abilities.huntress.spirithawk$hawkally.desc_dodges=garantiertes Ausweichen übrig: %d.
actors.hero.abilities.huntress.spirithawk$hawkally.discover_hint=Diesen Charakter kannst du durch Verwendung einer bestimmten Rüstungsfertigkeit entdecken.

actors.hero.abilities.duelist.challenge.name=herausfordern
actors.hero.abilities.duelist.challenge.prompt=Wähle einen Feind zum Herausfordern
actors.hero.abilities.duelist.challenge.already_dueling=Du kannst nur an einem Duell gleichzeitig teilnehmen.
actors.hero.abilities.duelist.challenge.ally_target=Du kannst nur Feinde zum Kampf herausfordern.
actors.hero.abilities.duelist.challenge.unreachable_target=Du musst dazu in der Lage sein, dein Ziel zu erreichen.
actors.hero.abilities.duelist.challenge.distant_target=Dieser Gegner ist zu weit entfernt, als dass du ihn herausfordern könntest.
actors.hero.abilities.duelist.challenge.short_desc=Die Zweikämpferin _fordert_ einen in der Nähe befindlichen Gegner zu einem Duell, wodurch alle anderen Gegner zeitweilig eingefroren werden.
actors.hero.abilities.duelist.challenge.desc=Die Zweikämpferin fordert einen in der Nähe befindlichen Gegner zum Duell. Dieser Gegner ist dann gezwungen, gegen sie zu kämpfen, während alle anderen Gegner zeitweilig in der Zeit eingefroren werden.\n\nDas Ziel muss erreichbar und sich innerhalb eines Radius von 5 Feldern um die Zweikämpferin herum befinden. Das Duell hält an, bis 10 Züge vorüber sind, der Gegner stirbt oder die Zweikämpferin mehr als 5 Felder vom Gegner entfernt steht.\n\nEingefrorene Gegner sind unverwundbar. Die Alliierten der Zweikämpferin werden durch diese Fähigkeit nicht eingefroren, wird jedoch ein Boss herausgefordert, so werden seine Lakaien ebenfalls nicht eingefroren.
actors.hero.abilities.duelist.challenge$duelparticipant.name=Duellteilnehmer
actors.hero.abilities.duelist.challenge$duelparticipant.desc=Dieser Charakter nimmt an einem Duell teil. Er sowie jeder seiner Alliierten oder Lakaien können normal agieren, während andere eingefroren sind.\n\nDas Duell dauert eine bestimmte Zeit an, bis einer der Teilnehmer stirbt, oder bis die Teilnehmer sich auseinander bewegen, bis sie mehr als 5 Felder voneinander entfernt sind.\n\nVerbleibende Züge: %d.
actors.hero.abilities.duelist.elementalstrike.name=Elementarschlag
actors.hero.abilities.duelist.elementalstrike.short_desc=Die Zweikämpferin setzt einen _Elementarschlag_ ein, bei dem sich ein auf ihrer Waffenverzauberung beruhender Effekt kegelförmig ausbreitet.
actors.hero.abilities.duelist.elementalstrike.desc=Die Zweikämpferin schlägt einen Feind oder einen Ort mit einem regulären Angriff, der garantiert trifft und einen magischen Effekt in einem kegelförmigen Bereich von 65 Grad bis zu 4 Felder weit hervorruft. Dieser magische Effekt ist je nach der Verzauberung der Primärwaffe der Zweikämpferin unterschiedlich.
actors.hero.abilities.duelist.elementalstrike.generic_desc=Ein Elementarschlag ohne Verzauberung ruft einen geringen magischen Impuls hervor, der allen Feinden in Reichweite zwischen 6 und 12 Schadenspunkte zufügt.
actors.hero.abilities.duelist.feint.name=Finte
actors.hero.abilities.duelist.feint.prompt=Wähle einen Ort, wohin du sprinten möchtest
actors.hero.abilities.duelist.feint.too_far=Dieser Ort befindet sich nicht direkt neben dir.
actors.hero.abilities.duelist.feint.bad_location=Du kannst dich nicht an diesen Ort  bewegen.
actors.hero.abilities.duelist.feint.short_desc=Die Zweikämpferin _schlägt eine Finte_ und täuscht dabei einen Angriff vor, während sie aber auf ein angrenzendes Feld springt. Feinde werden ihr Nachbild angreifen und stehen einem Gegenangriff gegenüber schutzlos da.
actors.hero.abilities.duelist.feint.desc=Die Zweikämpferin täuscht einen Angriff vor, während sie aber auf ein nächstgelegenes Feld springt und ein kurzzeitiges Nachbild von sich hinterlässt. Feinde, welche die Zweikämpferin angreifen, werden stattdessen dieses Nachbild angreifen.\n\nFeinde, die ein solches Nachbild angreifen, werden verwirrt, wodurch ihre nächste Aktion abgebrochen wird und sie einem Überraschungsangriff schutzlos gegenüberstehen.

actors.hero.abilities.cleric.ascendedform.name=aufgestiegene Form
actors.hero.abilities.cleric.ascendedform.short_desc=Der Kleriker nimmt eine _Aufgestiegene Form_ an, erhält so neue Zaubersprüche, Angriffsreichweite und Abschirmung.
actors.hero.abilities.cleric.ascendedform.desc=Der Kleriker strahlt heilige Energie aus sich selbst aus und nimmt für 10 Züge eine erweiterte strahlende Form an. In dieser Form kann der Kleriker neue Zauber wirken, erhält 2 Angriffsreichweite und 30 Abschirmung; alle weiteren Zauber, die er wirkt, gewähren 10 Abschirmung pro verwendeter Ladung des Heiligen Folianten.\n\nDie Abschirmung durch die aufgestiegene Form und ihre Zauber lässt nicht normal nach, sie verschwindet jedoch sofort, sobald die aufgestiegene Form endet. Die Fähigkeit kann erneut verwendet werden, um die Dauer der aufgestiegenen Form zu verlängern.
actors.hero.abilities.cleric.ascendedform$ascendbuff.name=aufgestiegene Form
actors.hero.abilities.cleric.ascendedform$ascendbuff.desc=Strahlende Energie entweicht dem Körper des Klerikers. In dieser Form erhält der Kleriker 2 Angriffsreichweite (durch die heilige Energie, die von ihm ausgeht) und 10 Abschirmung, sobald er eine Ladung des heiligen Folianten verbraucht. Er kann auch Zauber wirken, die durch die Talente der aufgestiegenen Form freigeschaltet werden.\n\nDie Abschirmung, die durch die aufgestiegene Form und ihre Zauber gewährt wird, verfällt nicht normal, sie verschwindet jedoch sofort, wenn die aufgestiegene Form endet.\n\nDerzeitige Abschirmung: %1$d.\nVerbleibende Züge: %2$d.
actors.hero.abilities.cleric.trinity.name=Dreieinigkeit
actors.hero.abilities.cleric.trinity.no_imbue=Die Dreieinigkeit hat derzeit keinen Effekt für eine ihrer Formen festgelegt, nutze einen ihrer Sprüche!
actors.hero.abilities.cleric.trinity.no_duplicate=Dreieinigkeit kann keine Wirkung duplizieren, die du bereits ausgerüstet hast!
actors.hero.abilities.cleric.trinity.ench_glyph_use=Dreieinigkeit wird diese Wirkung für _%1$d Züge_ anwenden, zum Preis von _%2$s Ladung._
actors.hero.abilities.cleric.trinity.rare_ench_glyph_use=Dreieinigkeit wird diese _mächtige_ Wirkung für _%1$d Züge_ entfalten, zum Preis von _%2$s Ladung._
actors.hero.abilities.cleric.trinity.wand_use=Dreieinigkeit wird diesen Stab mit einer Stärke von _+%1$d_ entfesseln, zum Preis von _%2$s Ladung._
actors.hero.abilities.cleric.trinity.wand_multi_use=Dreieinigkeit wird diesen _mehrfach aufladbaren_ Stab mit einer Stärke von _+%1$d_ entfesseln, zum Preis von _%2$s Ladung._
actors.hero.abilities.cleric.trinity.thrown_use=Dreieinigkeit wird diese Waffe mit einer Stärke von _+%1$d_ schleudern, zum Preis von _%2$s Ladung._
actors.hero.abilities.cleric.trinity.ring_use=Dreieinigkeit wird die Wirkung dieses Rings mit einer Stärke von _+%1$d_ für 20 Zügen gewähren, zum Preis von _%2$s Ladung._
actors.hero.abilities.cleric.trinity.alchemiststoolkit_use=Dreieinigkeit wird die Fernalchemie-Wirkung dieses Artefakts entfalten, zum Preis von _%2$s Ladung._
actors.hero.abilities.cleric.trinity.chaliceofblood_use=Dreieinigkeit wird die passive Lebensregeneration dieses Artefakts mit einer Stärke von _+%1$d_ für 20 Zügen gewähren, zum Preis von _%2$s Ladung._
actors.hero.abilities.cleric.trinity.driedrose_use=Dreieinigkeit wird die Wirkung dieses Artefakts entfesseln, um eine verderbte, verbündete Totengeisterscheinung mit der Lebensenergie eines _+%1$d_ Geistes zu beschwören, zum Preis von _%2$s Ladung._
actors.hero.abilities.cleric.trinity.etherealchains_use=Dreieinigkeit wird die Kettenzauber-Wirkung dieses Artefakts mit einer Reichweite von _+%1$d_ anwenden, zum Preis von _%2$s Ladung._
actors.hero.abilities.cleric.trinity.hornofplenty_use=Dreieinigkeit wird die Verzehr-Wirkung dieses Artefakts entfalten, zum Preis von _%2$s Ladung._
actors.hero.abilities.cleric.trinity.masterthievesarmband_use=Dreieinigkeit wird die Diebstahlwirkung dieses Artefakts mit einer Stärke von _+%1$d_ anwenden, zum Preis von _%2$s Ladung._
actors.hero.abilities.cleric.trinity.sandalsofnature_use=Dreieinigkeit wird die Wurzelwirkung dieses Artefakts mit einem zufällig schädlichen Samen entfalten, zum Preis von _%2$s Ladung._
actors.hero.abilities.cleric.trinity.skeletonkey_use=Dreieinigkeit wird die Einsetzen-Wirkung dieses Artefakts entfalten, zum Preis von _%2$s Ladung._
actors.hero.abilities.cleric.trinity.talismanofforesight_use=Dreieinigkeit wird die Wahrsage-Wirkung dieses Artefakts mit einer Stärke von _+%1$d_ anwenden, zum Preis von _%2$s Ladung._
actors.hero.abilities.cleric.trinity.timekeepershourglass_use=Dreieinigkeit wird die Zeitstopp-Wirkung dieses Artefakts mit einer Dauer von _%1$d Zügen_ entfalten, zum Preis von _%2$s Ladung._
actors.hero.abilities.cleric.trinity.unstablespellbook_use=Dreieinigkeit wird die zufällige Schriftrollen-Wirkung dieses Artefakts entfalten, mit einer _%1$d/10_ Chance, die exotische Variante ohne zusätzliche Kosten zu gewähren, zum Preis von _%2$s Ladung._
actors.hero.abilities.cleric.trinity.cost=Die Ladungskosten dieser Fähigkeit variieren, betragen jedoch meist _%d._
actors.hero.abilities.cleric.trinity.short_desc=Der Kleriker erhält eine _Dreieinigkeit_ an Fähigkeiten, die Ausrüstung simulieren, welche er gesehen hat und die durch Einsatz neuer Zaubersprüche zugeordnet werden können.
actors.hero.abilities.cleric.trinity.desc=Der Kleriker erhält eine _Dreieinigkeit_ neuer Rüstungsfähigkeiten, die durch Einsatz dreier neuer Zaubersprüche verschiedenen Effekten von Gegenständen zugeordnet werden können. Jeder dieser Zaubersprüche simuliert den Effekt verschiedener Arten von Ausrüstungsgegenständen, den der Kleriker im Verlauf seines aktuellen Abenteuers identifiziert hat: Körperform (Waffen und Rüstungen), Verstandesform (Zauberstäbe und Wurfwaffen) und Geistform (Ringe und Artefakte).\n\nJede Dreieinigkeit kann mit nur einem Effekt gleichzeitig geprägt sein, und der Kleriker wählt, welcher davon aktiviert wird, wenn Dreieinigkeit genutzt wird. Dreieinigkeit dupliziert nicht die Effekte von Gegenständen, die bereits ausgerüstet sind.
actors.hero.abilities.cleric.trinity$wndusetrinity.text=Wähle aus, welche Form der Dreieinigkeit genutzt werden soll. Die Wirkungen unterschiedlicher Formen können gleichzeitig aktiv sein.
actors.hero.abilities.cleric.trinity$wndusetrinity.body=_Körperform: %s._
actors.hero.abilities.cleric.trinity$wndusetrinity.mind=_Verstandesform: %s._
actors.hero.abilities.cleric.trinity$wndusetrinity.spirit=_Geistform: %s._
actors.hero.abilities.cleric.trinity$wnditemtypeselect.text=Wähle eine Wirkung aus, die in die Dreieinigkeit eingewoben werden soll. Weitere Informationen werden vor der Bestätigung angezeigt.
actors.hero.abilities.cleric.trinity$wnditemconfirm.body=Der Körperform zuweisen
actors.hero.abilities.cleric.trinity$wnditemconfirm.mind=Der Verstandesform zuweisen
actors.hero.abilities.cleric.trinity$wnditemconfirm.spirit=Der Geistform zuweisen
actors.hero.abilities.cleric.powerofmany.name=die Macht der Vielen
actors.hero.abilities.cleric.powerofmany.prompt_default=Wähle einen Verbündeten oder einen Ort
actors.hero.abilities.cleric.powerofmany.prompt_ally=Lenke deinen Lichtverbündeten
actors.hero.abilities.cleric.powerofmany.ally_exists=Du hast bereits einen ermächtigten Verbündeten.
actors.hero.abilities.cleric.powerofmany.no_vision=Du kannst keinen Ort als Ziel wählen, den du nicht siehst.
actors.hero.abilities.cleric.powerofmany.only_allies=Du kannst nur Verbündete ermächtigen.
actors.hero.abilities.cleric.powerofmany.short_desc=Der Kleriker kanalisiert die _Macht der Vielen_ und verleiht so einem Verbündeten Macht, oder erschafft einen neuen.
actors.hero.abilities.cleric.powerofmany.desc=Der Kleriker kanalisiert die _Macht der Vielen_ und verleiht so einem Verbündeten Macht, oder erschafft für 100 Züge einen neuen, so bemächtigten. Zielt man damit auf ein leeres Feld, wird ein neuer Verbündeter geschaffen.\n\nSolange der Verbündete durch die Macht der Vielen bemächtigt ist, verursacht er +25% Schaden, erleidet -25% Schaden und teilt seinen Sichtkreis mit dem Kleriker. Außerdem bekommt er 25 Abschirmung, wenn die Fähigkeit genutzt wird.\n\nDer Kleriker erlangt ebenso drei neue Zaubersprüche, die nur mit einem bemächtigten Verbündeten gewirkt werden können. Die Macht der Vielen endet nicht, solange einer dieser Zaubersprüche aktiv ist.
actors.hero.abilities.cleric.powerofmany$powerbuff.name=die Macht der Vielen
actors.hero.abilities.cleric.powerofmany$powerbuff.desc=Dieser Verbündete wurde von der Macht der Vielen gestärkt, was ihm +25%% verursachten Schaden und -25%% erlittenen Schaden gewährt. Zudem teilt er sein Sichtfeld mit dem Kleriker und kann von Zaubern der Macht der Vielen profitieren.\n\nDie Macht der Vielen bleibt bestehen, selbst wenn Verbündete wie ein spektrales Abbild sich verbergen, aber die Dauer läuft dennoch weiter ab.\n\nVerbleibende Züge: %s.
actors.hero.abilities.cleric.powerofmany$lightally.name=Lichtverbündeter
actors.hero.abilities.cleric.powerofmany$lightally.direct_defend=Dein Verbündeter bewegt sich zu dieser Position.
actors.hero.abilities.cleric.powerofmany$lightally.direct_follow=Dein Verbündeter bewegt sich und folgt dir.
actors.hero.abilities.cleric.powerofmany$lightally.direct_attack=Dein Verbündeter geht zum Angriff über!
actors.hero.abilities.cleric.powerofmany$lightally.desc=Eine Kopie eines der Abenteuer suchenden Gefährten des Klerikers, bestehend aus festem Licht. Obwohl sie die Gestalt eines anderen Helden hat, besitzt sie keine seiner einzigartigen Fähigkeiten. Dieser Verbündete bleibt bestehen, solange die Macht der Vielen auf ihn angewandt ist.\n\nDieser Verbündete kann ohne Kosten gelenkt werden, indem die Rüstungsfähigkeit der Macht der Vielen erneut verwendet wird.
actors.hero.abilities.cleric.powerofmany$lightally.discover_hint=Diesen Charakter kannst du durch Verwendung einer bestimmten Rüstungsfertigkeit entdecken.


actors.hero.abilities.ratmogrify.name=rattifizieren
actors.hero.abilities.ratmogrify.cant_transform=Du kannst das nicht rattifizieren!
actors.hero.abilities.ratmogrify.too_strong=Dieser Gegner ist zu stark zum Rattifizieren!
actors.hero.abilities.ratmogrify.short_desc=Der Held _rattifiziert_ einen Gegner! Dies verwandelt ihn eine Zeitlang in eine Ratte ohne Fähigkeiten.
actors.hero.abilities.ratmogrify.desc=Der Held verwandelt einen Gegner 6 Züge lang in eine Ratte! Bosse, Verbündete und Ratten können nicht rattifiziert werden.\n\nVerwandelte Feinde behalten ihre ursprünglichen Werte, haben aber keine Fähigkeiten.
actors.hero.abilities.ratmogrify$transmograt.name=rattifiziert %s
actors.hero.abilities.ratmogrify$transmograt.desc=Dieser Gegner wurde in eine Ratte verwandelt. Eine enorme Verbesserung,  wenn du mich fragst! - Der Rattenkönig
actors.hero.abilities.ratmogrify$transmograt.rankings_desc=Getötet von: einem rattifizierten Feind

##Cleric Spells
actors.hero.spells.auraofprotection.name=Aura des Schutzes
actors.hero.spells.auraofprotection.short_desc=Stärkt die Verteidigung für den Paladin und Verbündete in deiner Nähe.
actors.hero.spells.auraofprotection.desc=Der Paladin strahlt für 20 Züge schützende Energie aus. Alle Verbündeten innerhalb von 2 Feldern (inklusive des Paladins) nehmen %1$d%% weniger Schaden und bekommen den Effekt seiner Rüstungsglyphe bei +%2$d%% Energie.\n\nDiese Schadensverminderung tritt ein vor anderen schadensvermindernden Effekten (z. B. Rüstung). Die Erhöhung der Energie der Glyphe findet immer statt. Jedoch kann dieser Zauber die Glyphe nicht dazu bringen, mehr als ein mal angewendet zu werden, wenn ein Charakter schon davon profitiert (zum Beispiel der Paladin selbst oder ein spektrales Abbild).
actors.hero.spells.auraofprotection$aurabuff.name=Aura des Schutzes
actors.hero.spells.auraofprotection$aurabuff.desc=Der Paladin strahlt schützende Energie um sich herum aus.\n\nJeder nahestehende Verbündete (einschließlich des Paladins selbst) erleidet verringerten Schaden und erhält die Wirkung der Rüstungsglyphe des Paladins mit verstärkter Kraft.\n\nVerbleibende Züge: %s.

actors.hero.spells.beamingray.name=glänzender Strahl
actors.hero.spells.beamingray.no_space=Es ist kein Platz dafür da, dass dein Verbündeter dort erscheint.
actors.hero.spells.beamingray.out_of_range=Dieser Ort ist außer Reichweite.
actors.hero.spells.beamingray.short_desc=Teleportiert deinen Verbündeten und gewährt Bonusschaden.
actors.hero.spells.beamingray.desc=Der Kleriker bündelt die Kraft seines Verbündeten in einem Lichtstrahl, der ihn an einen Ort versetzt. Trifft der Strahl auf einen Feind, wird der Verbündete in der Nähe abgesetzt und auf den Feind ausgerichtet.\n\nDer Strahl hat eine maximale Reichweite von %1$d Feldern und erhöht den Bonusschaden der Macht der Vielen gegen den nächsten Feind im Umkreis von 4 Feldern auf +%2$d%% für 10 Züge. Der Versetzungsstrahl kann sogar normalerweise unbewegliche Verbündete teleportieren, aber die Reichweite ist in diesen Fällen halbiert.
actors.hero.spells.beamingray$beamingrayboost.name=glänzender Strahl
actors.hero.spells.beamingray$beamingrayboost.desc=Dieser Verbündete wurde kürzlich durch den Versetzungsstrahl teleportiert und erhält nach der Versetzung Bonusschaden gegen den nächsten Feind. Die Macht der Vielen endet nicht, solange dieser Segen aktiv ist.\n\nVerbleibende Züge: %s.

actors.hero.spells.blessspell.name=segnen
actors.hero.spells.blessspell.short_desc=Segnet und schirmt den Kleriker ab, segnet und heilt andere.
actors.hero.spells.blessspell.desc=Der Kleriker spricht einen heiligen Segen auf sich selbst oder einen anderen Charakter aus, den er sehen kann.\n\nWenn der Segen auf sich selbst gewirkt wird, ist der Effekt schwächer und gewährt %1$d Züge Segen und %2$d Barriere.\n\nWenn er auf andere Charaktere gewirkt wird, ist der Zauber mächtiger und gewährt %3$d Züge Segen und %4$d Heilung. Überschüssige Heilung wird in Barriere umgewandelt.

actors.hero.spells.bodyform.name=Körperform
actors.hero.spells.bodyform.short_desc=Weist Dreieinigkeit einer Verzauberung oder Glyphe zu.
actors.hero.spells.bodyform.desc=Der Kleriker wählt eine Verzauberung oder Glyphe aus, die er in diesem Abenteuer identifiziert hat, und webt Dreieinigkeit in deren Wirkung ein.\n\nWird die Dreieinigkeit verwendet, erhält der Kleriker die Wirkung der gewählten Verzauberung oder Glyphe für %d Züge. Diese temporäre Verzauberung oder Glyphe funktioniert mit jeder Wirkung, die auch eine reguläre Verzauberung oder Glyphe hätte.\n\nDieser Zauber ersetzt jede andere Körperwirkung, mit der Dreieinigkeit momentan verbunden ist.
actors.hero.spells.bodyform$bodyformbuff.name=Körperform
actors.hero.spells.bodyform$bodyformbuff.desc=Die Körperform der Dreieinigkeit gewährt dir momentan die Kraft einer Verzauberung oder Glyphe, als hättest du sie auf deiner aktuellen Waffe oder Rüstung ausgerüstet.\n\nBeachte, dass die Körperform keine zusätzliche Kopie einer Wirkung gewähren kann, von der du bereits profitierst.\n\nAktuelle Wirkung: %1$s.\nVerbleibende Züge: %2$s.

actors.hero.spells.cleanse.name=reinigen
actors.hero.spells.cleanse.short_desc=Hebt Schwächungen auf und gewährt Abschirmung.
actors.hero.spells.cleanse.desc=Der Kleriker hebt alle schädlichen Status-Effekte an sich und an Verbündeten im Sichtfeld auf. Nachdem der Spruch abgelaufen ist, erhalten alle betroffenen Charaktere auch %1$d Züge Immunität gegen Schwächung und %2$d Barriere.

actors.hero.spells.clericspell.prompt=Wähle ein Ziel
actors.hero.spells.clericspell.no_target=Es ist kein Ziel da.
actors.hero.spells.clericspell.invalid_target=Du kannst diesen Ort nicht ins Ziel nehmen.
actors.hero.spells.clericspell.invalid_enemy=Du kannst nicht auf diesen Feind zielen.
actors.hero.spells.clericspell.charge_cost=Ladungskosten: %d

actors.hero.spells.divinesense.name=göttlicher Sinn
actors.hero.spells.divinesense.short_desc=Erhalte zeitweilig übersinnliche Wahrnehmung in einem weiten Umkreis.
actors.hero.spells.divinesense.desc=Der Kleriker fokussiert seine Sinne auf seiner Umgebung und erhält für 50 Züge übersinnliche Wahrnehmung in einem Umkreis von %d Feldern. Dieser Spruch benötigt keine Zeit, wenn er gewirkt wird.
actors.hero.spells.divinesense$divinesensetracker.name=göttlicher Sinn
actors.hero.spells.divinesense$divinesensetracker.desc=Dieser Charakter ist vorübergehend in der Lage, andere nahe Kreaturen mit seinem Verstand wahrzunehmen!\n\nVerbleibende Züge: %s.

actors.hero.spells.divineintervention.name=göttlicher Eingriff
actors.hero.spells.divineintervention.short_desc=Eine massive Verstärkung der Abschirmung für den Kleriker und seine Verbündeten.
actors.hero.spells.divineintervention.desc=Der Kleriker lässt eine enorme Menge an Kraft aus seinem Folianten in sich selbst und seine Verbündeten fließen und verstärkt jeden auf %1$d Abschirmung und verlängert die Aufgestiegene Form um %2$d Züge. Die unglaubliche Verteidigungskraft dieses Zaubers wird durch seine sehr hohen Ladekosten aufgewogen.\n\nGenau wie andere Arten der Abschirmung, die durch die aufgestiegene Form gewährt werden, verfällt diese Abschirmung nicht auf die übliche Weise, sondern erlischt sofort, wenn die aufgestiegene Form endet.

actors.hero.spells.flash.name=Blinken
actors.hero.spells.flash.prompt=Wähle einen Ort
actors.hero.spells.flash.short_desc=Zu einem nahegelegenen Ort teleportieren.
actors.hero.spells.flash.desc=Der Kleriker kanalisiert seine aufgestiegene Form an einen nahegelegenen Ort und teleportiert sich dorthin. _Blinken_ kann den Kleriker an jeden entdeckten Ort teleportieren, der in Reichweite und unbesetzt ist. Dieser Zauber kostet jedes Mal mehr Foliantenladungen, wenn er in derselben aufgestiegenen Form verwendet wird.

actors.hero.spells.guidinglight.name=Leitlicht
actors.hero.spells.guidinglight.short_desc=Fügt auf die Entfernung magischen Schaden zu und garantiert einen Treffer.
actors.hero.spells.guidinglight.desc=Der Kleriker feuert einen Blitz aus magischer Energie ab, der ein Ziel trifft, 2-8 Schaden verursacht und es erleuchtet. Der nächste ungehinderte physische Angriff auf einen erleuchteten Feind trifft ihn garantiert.
actors.hero.spells.guidinglight.desc_priest=_Dieser Zauber ist mächtiger, wenn er vom Priester gewirkt wird._ Der erste Einsatz des Zaubers innerhalb von 50 Zügen kostet keine Foliantenladungen, und die Erleuchtung wird von Gnadenstrahl, Stäben, anderen Charakteren und Artefakten verbraucht, die direkt auf Feinde wirken. Wenn die Erleuchtung auf diese Weise verwendet wird, verursacht sie zusätzlichen Magieschaden in Höhe der Stufe des Priesters + 5.
actors.hero.spells.guidinglight$guidinglightpriestcooldown.name=Leitlicht
actors.hero.spells.guidinglight$guidinglightpriestcooldown.desc=Der Priester kann nach 50 Zügen erneut kostenfrei Leitlicht wirken.\n\nVerbleibende Züge: %s.
actors.hero.spells.guidinglight$illuminated.name=Beleuchtet
actors.hero.spells.guidinglight$illuminated.desc=Dieser Charakter leuchtet infolge des Treffers durch das Leitlicht. Obwohl das Leuchten nicht stark genug ist, um die Umgebung zu erhellen, macht die magische Wirkung es dem Kleriker wesentlich leichter, ihn zu treffen.
actors.hero.spells.guidinglight$illuminated.desc_priest=Der Priester kann die Erleuchtung zusätzlich zum Gnadenstrahl, einem Stabblitz, einen Schlag eines Verbündeten oder die Wirkung mancher Artefakte verbrauchen. Auf diese Weise verursacht die Erleuchtung zusätzlichen Schaden in Höhe der Stufe des Priesters +5.
actors.hero.spells.guidinglight$illuminated.desc_generic=Andere Helden können die Erleuchtung weiterhin nutzen, um von der Fähigkeit des sengenden Lichts zu profitieren, erhalten jedoch keine zusätzliche Präzision.

actors.hero.spells.hallowedground.name=geweihter Boden
actors.hero.spells.hallowedground.prompt=Wähle einen Ort
actors.hero.spells.hallowedground.short_desc=Heilt Verbündete, verlangsamt Feinde und verbreitet in seinem Wirkungsbereich Gras.
actors.hero.spells.hallowedground.desc=Der Priester konzentriert seine göttliche Magie auf den Boden in der Nähe und erschafft so für 20 Züge einen %1$dx%1$d großen, geweihten Bereich.\n\nWenn dieser Zauber gewirkt wird, heilt er alle Verbündeten um 15 LP (gesunde Verbündete und der Priester erhalten Abschirmung), lässt Feinde kurzzeitig verwurzeln und breitet kurzes Gras aus.\n\nDer geweihte Boden heilt Verbündete um 1 LP pro Zug (gesunde Verbündete und der Priester erhalten Abschirmung), lähmt Feinde und lässt zufällig hohes Gras wachsen.\n\nGeweihter Boden wird durch Feuer zerstört und erzeugt zerfurchtes Gras, wenn passive Regenerationseffekte deaktiviert sind oder der Priester eine Zeit lang keine Erfahrung gesammelt hat.
actors.hero.spells.hallowedground$hallowedterrain.desc=Der Boden hier wurde geweiht. Geweihter Boden verlangsamt Feinde, heilt Verbündete und lässt Gras hervorsprießen.

actors.hero.spells.holyintuition.name=heilige Intuition
actors.hero.spells.holyintuition.prompt=wähle einen Gegenstand
actors.hero.spells.holyintuition.cursed=Du spürst, dass in diesem Gegenstand bösartige Magie lauert.
actors.hero.spells.holyintuition.uncursed=Dieser Gegenstand ist frei von bösartiger Magie.
actors.hero.spells.holyintuition.short_desc=Bestimmt, ob ein Gegenstand verflucht ist.
actors.hero.spells.holyintuition.desc=Der Kleriker fokussiert seine Sinne auf einen Gegenstand und bestimmt, ob dieser verflucht ist, ohne ihn ausrüsten zu müssen.

actors.hero.spells.holylance.name=heilige Lanze
actors.hero.spells.holylance.short_desc=Fügt auf Entfernung schweren magischen Schaden zu.
actors.hero.spells.holylance.desc=Der Priester konzentriert eine große Menge Energie in einer verheerenden Wurflanze aus Licht. Diese Lanze verursacht %1$d-%2$d Schaden und fügt untoten und dämonischen Zielen immer maximalen Schaden zu.\n\nDieser Zauber ist sehr teuer und hat eine Abklingzeit von 30 Zügen.
actors.hero.spells.holylance$lancecooldown.name=Abklingzeit heilige Lanze
actors.hero.spells.holylance$lancecooldown.desc=Der Priester hat vor kurzem die Heilige Lanze gewirkt und muss warten, bevor er sie nochmals wirken kann.\n\nVerbleibende Züge: %s.

actors.hero.spells.holyward.name=heilige Wache
actors.hero.spells.holyward.glyph_name=%s des Lichts
actors.hero.spells.holyward.glyph_desc=Diese Glyphe erhöht ein wenig den Schaden, den eine Rüstung abblocken kann.
actors.hero.spells.holyward.short_desc=Überschreibt zeitweilig Glyphen, um die Rüstungsstärke zu erhöhen.
actors.hero.spells.holyward.desc=Der Kleriker durchwirkt seine Rüstung mit der Glyphe des heiligen Lichts und erhöht so ihre Rüstungskraft um 1. Dieser Zauber wirkt augenblicklich.\n\nDiese Rune verweilt für 50 Züge und überschreibt für diese Zeit andere nützliche Runen auf der Rüstung. Der Kleriker kann diesen Effekt auch ohne eine Rüstung nutzen.
actors.hero.spells.holyward.desc_paladin=_Dieser Zauber ist mächtiger, wenn er vom Paladin gewirkt wird._ Die zusätzliche Schadensverringerung erhöht sich auf 3, der Zauber überschreibt keine bestehenden Glyphen mehr, und das Wirken anderer Zauber während der aktiven heiligen Wache verlängert deren Dauer um 10 Züge pro verwendeter Ladung.
actors.hero.spells.holyward$holyarmbuff.name=heilige Wache
actors.hero.spells.holyward$holyarmbuff.desc=Der Kleriker verleiht der von ihm getragenen Rüstung heilige Energie, wodurch jede eventuell vorhandene Glyphe überschrieben wird und die Rüstung einen zusätzlichen Schadenspunkt abblockt.\n\nVerbleibende Züge: %s.
actors.hero.spells.holyward$holyarmbuff.desc_paladin=Der Paladin hat seine getragene Rüstung mit heiliger Energie durchdrungen, wodurch die Rüstung zusätzlich 3 Schadenspunkte blockiert. \n\nDas Wirken anderer Zauber während der aktiven heiligen Wache verlängert deren Dauer um 10 Züge pro verwendeter Ladung. \n\nVerbleibende Züge: %s.

actors.hero.spells.holyweapon.name=heilige Waffe
actors.hero.spells.holyweapon.ench_name=heiliges %s
actors.hero.spells.holyweapon.ench_desc=Feinde, die von einer heiligen Waffe getroffen wurden, bekommen zusätzlichen magischen Schaden.
actors.hero.spells.holyweapon.short_desc=Überschreibt zeitweilig Verzauberungen, um den Schaden zu erhöhen.
actors.hero.spells.holyweapon.desc=Der Kleriker durchwirkt seine Waffe mit heiliger Energie, sodass sie bei Gegnern zusätzlich 2 magischen Schaden verursacht. Dieser Zauber wirkt augenblicklich.\n\nDie Verzauberung verweilt für 50 Züge und überschreibt temporär andere nützliche Verzauberungen auf der Waffe. Auch unbewaffnete Angriffe profitieren von diesem Effekt.
actors.hero.spells.holyweapon.desc_paladin=_Dieser Zauber ist mächtiger, wenn er vom Paladin gewirkt wird._ Der zusätzliche magische Schaden erhöht sich auf 6, der Zauber überschreibt keine bestehenden Verzauberungen mehr, und das Wirken anderer Zauber während der aktiven heiligen Waffe verlängert deren Dauer um 10 Züge pro verwendeter Ladung.
actors.hero.spells.holyweapon$holywepbuff.name=heilige Waffe
actors.hero.spells.holyweapon$holywepbuff.desc=Der Kleriker verleiht der von ihm getragenen Waffe heilige Energie, wodurch jede eventuell vorhandene Verzauberung überschrieben wird und die Waffe zusätzlich 2 magischen Schaden verursacht.\n\nVerbleibende Züge: %s.
actors.hero.spells.holyweapon$holywepbuff.desc_paladin=Der Paladin hat seine getragene Waffe mit heiliger Energie durchdrungen, wodurch seine Angriffe zusätzlichen magischen Schaden in Höhe von 6 verursachen. \n\nDas Wirken anderer Zauber während der aktiven heiligen Waffe verlängert deren Dauer um 10 Züge pro verwendeter Ladung. \n\nVerbleibende Züge: %s.

actors.hero.spells.judgement.name=Urteil
actors.hero.spells.judgement.short_desc=Schädigt alle sichtbaren Feinde.
actors.hero.spells.judgement.desc=Der Kleriker schlägt seine Faust gegen den Boden und erzeugt so eine Lichteruption, die allen Feinden in seinem Sichtbereich Schaden zufügt. Dies fügt %1$d-%2$d Grundschaden und weitere 33%% Schadenspunkte pro Zauberspruch zu, den der Kleriker gewirkt hat, seit er zuletzt die aufgestiegene Form angenommen hat (oder seit dem letzten Spruch des Urteils).\n\nDerzeit wird Urteil %3$d-%4$d Schaden zufügen.

actors.hero.spells.layonhands.name=Handauflegung
actors.hero.spells.layonhands.short_desc=Heilt sofort einen direkt benachbarten Charakter oder schirmt den Paladin ab.
actors.hero.spells.layonhands.desc=Der Paladin bündelt heilige Energie in seinen Händen, um alles zu heilen oder zu schützen, was er berührt. \n\nDer Paladin kann diesen Zauber auf einen benachbarten Charakter wirken, um ihm %1$d Heilung zu gewähren, oder auf sich selbst, um %1$d Abschirmung zu erhalten. Überschüssige Heilung durch diesen Zauber wird in Abschirmung umgewandelt. \n\nDieser Zauber wird augenblicklich gewirkt und kann wiederholt eingesetzt werden, jedoch nicht mehr als die dreifache Menge an Abschirmung gleichzeitig gewähren.

actors.hero.spells.lifelinkspell.name=Lebensverbindung
actors.hero.spells.lifelinkspell.short_desc=Teilt Schaden mit einem Verbündeten und reduziert dessen erlittenen Schaden.
actors.hero.spells.lifelinkspell.desc=Der Kleriker stärkt die Verbindung zwischen sich und seinem gestärkten Verbündeten. Durch diese gestärkte Verbindung wird jeglicher erlittener Schaden für %1$d Züge zwischen dem Helden und seinem Verbündeten geteilt, und der defensive Bonus der Macht der Vielen wird auf -%2$d%% erlittenen Schaden erhöht. Beachte, dass der Schaden nach der Rüstungsreduktion, aber vor der Schadensminderung durch die Macht der Vielen geteilt wird.\n\nSolange dieser Effekt aktiv ist, wirken wohltätige Klerikerzauber der Stufe 3 oder darunter sowohl auf den Kleriker als auch auf seinen Verbündeten, wenn sie ansonsten nur auf einen von beiden wirken würden.
actors.hero.spells.lifelinkspell$lifelinkspellbuff.name=Schutz durch Lebensband
actors.hero.spells.lifelinkspell$lifelinkspellbuff.desc=Der Kleriker hat kürzlich Lebensband auf diesen Verbündeten gewirkt.\n\nZusätzlich zu den üblichen Vorteilen von Lebensband erleidet diese Gestalt verminderten Schaden, wohltätige Klerikerzauber wirken auf sowohl den Kleriker als auch diesen Verbündeten, anstatt nur auf einen von beiden, und die Macht der Vielen läuft nicht ab, solange dieser Segen aktiv ist.\n\nVerbleibende Züge: %s.

actors.hero.spells.mindform.name=Verstandesform
actors.hero.spells.mindform.short_desc=Ordnet Dreieinigkeit einem Zauberstab oder einer Wurfwaffe zu.
actors.hero.spells.mindform.desc=Der Kleriker wählt einen Zauberstab oder Wurfwaffen, die er während dieses Abenteuers identifiziert hat, und erfüllt Dreieinigkeit mit deren Wirkung.\n\nWenn Dreieinigkeit verwendet wird, kann der Kleriker einen einzelnen Angriff ausführen, als würde er den gewählten Gegenstand mit +%d verwenden. Dies löst alle Effekte aus, die beim Einsatz dieses Gegenstandstyps normalerweise ausgelöst würden.\n\nDieser Spruch ersetzt jeden anderen Verstandeseffekt, mit dem Dreieinigkeit derzeit erfüllt ist.

actors.hero.spells.mnemonicprayer.name=Gebet zum Gedenken
actors.hero.spells.mnemonicprayer.short_desc=Verlängert positive wie negative Effekte an einem Verbündeten oder Feind und wendet Erleuchtet erneut an.
actors.hero.spells.mnemonicprayer.desc=Der Priester spricht ein Gebet, das die Dauer aller positiven oder negativen Effekte an einem bestimmten Ziel um %1$d Züge verlängert. Dieser Zauber wirkt augenblicklich. Positive Effekte halten bei Verbündeten (einschließlich des Priesters selbst) länger an, schädliche Effekte halten bei Feinden länger an.\n\nEingedenken kann nur eine bestimmte Instanz eines positiven oder negativen Effekts einmal verlängern, und es eignet sich nicht dazu, Effekte, die durch Rüstungsfähigkeiten verliehen werden, zu verlängern.

actors.hero.spells.radiance.name=Gnadenstrahl
actors.hero.spells.radiance.short_desc=Beleuchtet und betäubt kurzzeitig sichtbare Feinde.
actors.hero.spells.radiance.desc=Der Priester entfesselt ein heiliges Strahlen, das alle sichtbaren Feinde für 3 Züge betäubt. Ist ein Gegner bereits beleuchtet, so löst Gnadenstrahl den Bonusschaden der Beleuchtung aus und wendet den Beleuchtungseffekt an. Gnadenstrahl lässt auch den Priester selbst für 100 Züge leuchten, wenn die aktuelle Ebene in Dunkelheit gehüllt ist.

actors.hero.spells.recallinscription.name=Runen-Echo
actors.hero.spells.recallinscription.short_desc=Wiederholt einen kürzlich eingesetzten Runenstein oder Schriftrolle.
actors.hero.spells.recallinscription.desc=Der Kleriker verwendet heilige Magie, um die Wirkung einer magischen Rune von einem Runenstein oder die einer Schriftrolle, die er innerhalb der letzten %s Züge verwendet hat, zu wiederholen.\n\nRunen-Echo kann nicht verwendet werden, um Schriftrollen der Verbesserung zu replizieren. Die Aufladekosten dieses Zaubers variieren je nachdem, welcher Gegenstand zuletzt verwendet wurde: 2 für einen Runenstein, 3 für eine Schriftrolle, 4 für eine exotische Schriftrolle. Diese Aufladekosten verdoppeln sich auch beim Replizieren einer Schriftrolle der Umwandlung oder von Alchemiegegenständen, die mithilfe von Umwandlung oder Verbesserung hergestellt werden müssen.
actors.hero.spells.recallinscription$useditemtracker.name=kürzlich verwendete Rune
actors.hero.spells.recallinscription$useditemtracker.desc=Der Kleriker hat kürzlich einen Gegenstand verwendet, der mit dem Runen-Echo-Zauber funktioniert. Der Kleriker kann diesen Zauber wirken, um den Effekt des Gegenstands zu wiederholen.\n\nVerwendeter Gegenstand: %1$s.\n\nVerbleibende Züge: %2$s.

actors.hero.spells.shieldoflight.name=Lichtschild
actors.hero.spells.shieldoflight.short_desc=Gewährt zeitweilig Rüstungsschutz gegen ein Ziel.
actors.hero.spells.shieldoflight.desc=Der Kleriker schafft eine dünne Lichtbarriere zwischen sich und einem Feind, wodurch der Rüstungswert gegen diesen Feind für 5 Züge um %1$d-%2$d erhöht wird.\n\nDieser Spruch benötigt keine Zeit für seine Wirkung, er kann jedoch nicht gegen mehrere Ziele gleichzeitig eingesetzt werden.
actors.hero.spells.shieldoflight$shieldoflighttracker.name=Lichtschild
actors.hero.spells.shieldoflight$shieldoflighttracker.desc=Ein feiner Lichtschild steht zwischen diesem Charakter und einem Feind. Er ist nicht stark genug, um Angriffe vollständig abzublocken, wird sie aber abschwächen.\n\nVerbleibende Züge: %s

actors.hero.spells.spiritform.name=Geistform
actors.hero.spells.spiritform.short_desc=Ordnet Dreieinigkeit einem Ring oder einem Artefakt zu.
actors.hero.spells.spiritform.desc=Der Kleriker wählt einen Ring oder ein Artefakt, die er während dieses Abenteuers identifiziert hat (außer dem Heiligen Folianten), und erfüllt Dreieinigkeit mit dessen Wirkung.\n\nWenn ein Ring gewählt wird, gewährt Dreieinigkeit die Wirkung dieses Rings mit +%1$d für 20 Züge.\n\nWenn ein Artefakt gewählt wird, ahmt Dreieinigkeit die Wirkung dieses Artefakts mit +%2$d nach. Jedes Artefakt hat unterschiedliche spezifische Effekte und Rüstungsladungskosten, wenn es mit Dreieinigkeit verwendet wird.\n\nDieser Spruch ersetzt jeden anderen Geisteffekt, mit dem Dreieinigkeit derzeit erfüllt ist.
actors.hero.spells.spiritform$spiritformbuff.name=Geistform
actors.hero.spells.spiritform$spiritformbuff.desc=Die Geistform von Dreieinigkeit gewährt dir derzeit die Macht eines Gegenstands, als würdest du ihn ausgerüstet haben.\n\nBeachte, dass die Geistform keine zusätzliche Kopie eines Effekts gewähren kann, von dem du bereits profitierst.\n\nAktueller Effekt: %1$s.\n\nVerbleibende Züge: %2$s.

actors.hero.spells.smite.name=zerschlagen
actors.hero.spells.smite.short_desc=Garantiert einen Treffer mit Bonusschaden und Kraft durch Verzauberung.
actors.hero.spells.smite.desc=Der Paladin durchdringt einen Nahkampfangriff mit rechtschaffener Zerstörungskraft.\n\nZusätzlich zum normalen Nahkampfschaden macht Göttliche Strafgewalt nicht behinderte Angriffe garantiert treffsicher, verleiht +300%% Verzauberungsmacht und verursacht zusätzlichen magischen Schaden von %1$d - %2$d.\n\nDer zusätzliche magische Schaden von Göttliche Strafgewalt skaliert mit der Stufe des Paladins und erreicht gegen untote oder dämonische Feinde stets den maximalen Schaden.

actors.hero.spells.stasis.name=Entrückung
actors.hero.spells.stasis.short_desc=Entfernt Verbündete aus dem Dungeon und bewahrt sie auf.
actors.hero.spells.stasis.desc=Der Kleriker konzentriert seine Verbindung zu seinem Verbündeten auf sich selbst, wodurch dieser vorübergehend in einer Art Energiestasis im Inneren des Klerikers gefangen gehalten wird. Der Verbündete bleibt bis zu %d Züge lang erhalten, wobei alle auf ihn wirkenden positiven Effekte in der Zeit in Entrückung unberührt bleiben.\n\nDer Verbündete erscheint neben dem Kleriker, sobald die Entrückung auf natürliche Weise endet, oder er kann den Zauber sofort und kostenlos erneut wirken, um den Effekt vorzeitig zu beenden. Entrückung kann sogar unbewegliche Verbündete bewegen, sie aber nicht zwischen Ebenen transferieren.
actors.hero.spells.stasis$stasisbuff.name=Verbündeter in Entrückung
actors.hero.spells.stasis$stasisbuff.left_behind=Dein unbeweglicher Verbündeter bleibt zurück.
actors.hero.spells.stasis$stasisbuff.desc=Der Kleriker hat derzeit einen Verbündeten in Entrückung. Alle positiven Effekte dieses Verbündeten, einschließlich der Macht der Vielen, bleiben erhalten, und er erscheint nach Ablauf des Effekts wieder neben dem Kleriker. Der Effekt kann auch vorzeitig durch erneutes Wirken von Entrückung beendet werden.\n\nVerbündeter in Entrückung: %1$s.\nVerbleibende Züge: %2$s.

actors.hero.spells.sunray.name=Sonnenstrahl
actors.hero.spells.sunray.short_desc=Fügt auf Entfernung magischen Schaden zu und blendet das Ziel einmal.
actors.hero.spells.sunray.desc=Der Kleriker feuert einen blendenden Lichtstrahl auf ein Ziel, fügt ihm damit %1$d-%2$d Schaden zu und blendet es für %3$d Züge. Sonnenstrahl fügt untoten und dämonischen Zielen maximalen Schaden zu.\n\nNachdem ein Feind durch diesen Spruch getroffen wurde, passt sich sein Gesichtssinn an, so dass er nicht nochmals geblendet werden kann. Wenn er jedoch nochmals von diesem Spruch getroffen wird, während er geblendet ist, wird er durch das Licht überwältigt und wird stattdessen gelähmt.

actors.hero.spells.walloflight.name=Wand aus Licht
actors.hero.spells.walloflight.short_desc=Erschafft eine Wand, die Feinde blockiert.
actors.hero.spells.walloflight.desc=Der Paladin erschafft direkt vor sich eine Wand aus massivem Licht. Sie ist 1 Feld stark und %1$d Felder breit und hält 20 Züge.\n\nDiese Wand funktioniert wie eine normale Wand, ist aber durchsichtig. Gegner, die beim Erschaffen in der Wand gefangen sind, werden kurzzeitig betäubt und nach Möglichkeit zurückgedrängt. Alle in der Wand gefangenen Gegner können sich befreien.\n\nDie Wand kann in alle vier Himmelsrichtungen oder Diagonalen gewirkt werden. Ist bereits eine Wand aktiv, kann der Zauber kostenlos erneut verwendet werden, um die Wand sofort zu beräumen.
actors.hero.spells.walloflight.early_end=Du zerstreust die Lichtwand.
actors.hero.spells.walloflight$lightwall.desc=Schimmernde Lichtpaneele versperren hier den Durchgang.

##main hero
actors.hero.hero.name=du
actors.hero.hero.leave=Du kannst jetzt noch nicht gehen, der Rest des Dungeons wartet da unten.
actors.hero.hero.level_up=Level Up!
actors.hero.hero.new_level=Stufenaufstieg! +Genauigkeit, +Ausweichen, +5 LP!
actors.hero.hero.new_talent=+1 Talentpunkt!
actors.hero.hero.unspent=Du hast unverbrauchte Talentpunkte!
actors.hero.hero.level_cap=Du kannst nicht stärker werden, aber deine Erfahrung gibt dir einen Kräfteschub!
actors.hero.hero.you_now_have=Du hast aufgenommen: %s.
actors.hero.hero.you_cant_have=Du kannst nicht mehr mitnehmen: %s.
actors.hero.hero.locked_chest=Diese Truhe ist verschlossen und du hast keinen Schlüssel, um sie zu öffnen.
actors.hero.hero.locked_door=Du besitzt keinen passenden Schlüssel.
actors.hero.hero.noticed_smth=Du bemerkst etwas.
actors.hero.hero.wait=...
actors.hero.hero.search=suchen
actors.hero.hero.search_distracted=Es fällt schwer sich zu konzentrieren, das Suchen ist ermüdend.
actors.hero.hero.key_distracted=Du schaffst es nicht ganz, das Schloss zu öffnen. Du wirst es weiter versuchen müssen.
actors.hero.hero.pain_resist=Die Schmerzen helfen dir deinem Drang nach Schlaf zu widerstehen.
actors.hero.hero.revive=Das Anch explodiert mit lebenspendender Energie!

##classes
actors.hero.heroclass.warrior=Krieger
actors.hero.heroclass.warrior_desc_short=Der Krieger hält zusätzlichen Schaden aus, wenn sein _gebrochenes Siegel_ ihm Schild gewährt. Das Siegel kann von Rüstung zu Rüstung übertragen werden und _überträgt eine einzelne Verbesserung._
actors.hero.heroclass.warrior_desc=Der Krieger beginnt mit einem _einzigartigen gebrochenen Siegel_, das ihm Abschirmung verleiht, wenn er weniger als die Hälfte seiner Lebenspunkte hat. Das Siegel kann von einer Rüstung auf eine andere übertragen werden und dabei _eine Verbesserung transportieren_.\n\nDer Krieger startet außerdem mit einem _abgenutzten Kurzschwert_, _drei Wurfsteinen_, einer Stoffrüstung, einem Wasserschlauch und einem Samtbeutel.\n\nDer Krieger identifiziert automatisch:\n_-_ Schriftrollen der Identifizierung\n_-_ Heiltränke\n_-_ Schriftrollen der Wut
actors.hero.heroclass.warrior_unlock=Der Krieger ist automatisch freigeschaltet.

actors.hero.heroclass.mage=Magier
actors.hero.heroclass.mage_desc_short=Der Magier ist ein arkaner Meister und trägt einen _magischen Stab_, der stärker ist als ein Zauberstab. Der Stab kann _mit jedem beliebigen Zauberstab verschmolzen werden_, den der Zauberer findet.
actors.hero.heroclass.mage_desc=Der Magier startet mit einem _einzigartigen Zauberstab_, der sich deutlich schneller als andere Stäbe wieder auflädt und eine Ladung mehr hat. Der Zauberstab _kann mit jedem Stab verschmolzen werden_, den der Magier im Dungeon findet.\n\nDer Magier startet außerdem mit einem _Stab der magischen Geschosse_, welcher mit seinem Zauberstab verschmolzen ist, einer Stoffrüstung, einem Wasserschlauch und einem Samtbeutel.\n\nDer Magier identifiziert automatisch:\n_-_ Schriftrollen der Identifizierung\n_-_ Trank der flüssigen Flamme\n_-_ Schriftrolle der Verbesserung
actors.hero.heroclass.mage_unlock=Um den Magier freizuschalten, _benutze eine Schriftrolle der Verbesserung, um einen Gegenstand stärker zu machen._

actors.hero.heroclass.rogue=Schurke
actors.hero.heroclass.rogue_desc_short=Der Schurke kann Feinden ausweichen und aus der Unsichtbarkeit heraus angreifen, wenn er seinen _Umhang der Schatten_ benutzt. Außerdem _entdeckt er Geheimnisse und Fallen_ bereits aus größerer Entfernung.
actors.hero.heroclass.rogue_desc=Der Schurke startet mit einem einzigartigen _Umhang der Schatten_, mit dem er sich nach Belieben unsichtbar machen kann.\n\nDer Schurke kann aus großer Distanz _Geheimnisse und Fallen orten_.\n\nDer Schurke startet außerdem mit _einem Dolch_, _drei Wurfmessern_, einer Stoffrüstung, einem Wasserschlauch und einem Samtbeutel.\n\nDer Schurke identifiziert automatisch:\n_-_ Schriftrollen der Identifizierung\n_-_ Tränke der Unsichtbarkeit\n_-_ Schriftrollen der magischen Kartographie
actors.hero.heroclass.rogue_unlock=Um den Schurken freizuschalten, _führe 10 Überraschungsangriffe in einem Spiel aus._

actors.hero.heroclass.huntress=Jägerin
actors.hero.heroclass.huntress_desc_short=Die Jägerin ist eine Meisterin der Wurfwaffen und besitzt einen _magischen Bogen_ mit unendlich vielen Pfeilen. Außerdem kann sie durch hohes Gras laufen, _ohne es zu zertrampeln._
actors.hero.heroclass.huntress_desc=Die Jägerin startet mit einem _einzigartigen Seelenbogen_, der eine unendliche Anzahl von beschworenen Pfeilen abfeuern kann.\n\nDie Jägerin kann durch hohes Gras laufen, _ohne es zu zertrampeln._\n\nDie Jägerin startet außerdem mit _Kampfhandschuhen_, einer Stoffrüstung, einem Wasserschlauch und einem Samtbeutel.\n\nDie Jägerin identifiziert automatisch:\n_-_ Schriftrollen der Identifizierung\n_-_ Tränke der übersinnlichen Wahrnehmung\n_-_ Schriftrollen des Wiegenlieds
actors.hero.heroclass.huntress_unlock=Um die Jägerin freizuschalten, _triff 10 mal mit Wurfwaffen gegen Feinde in einem Spiel._

actors.hero.heroclass.duelist=Zweikämpferin
actors.hero.heroclass.duelist_desc_short=Die Zweikämpferin ist eine Meisterin der Waffen, sie kann ihre Waffe dazu einsetzen, eine _besondere Waffenfähigkeit_ aufzurufen. Diese besondere Fähigkeit ist _bei jeder Waffe eine andere._
actors.hero.heroclass.duelist_desc=Die Zweikämpferin beginnt mit einem _einzigartigen Rapier_, dessen besondere Fähigkeit mit der Zeit wieder aufgeladen wird.\n\nJede Waffe im Spiel hat eine _eigene besondere Fähigkeit_, welche die Zweikämpferin nutzen kann.\n\nDie Zweikämpferin beginnt auch mit _zwei Wurfspießen_, einer Stoffrüstung, einem Wasserschlauch und einem Samtbeutel.\n\nDie Zweikämpferin identifiziert automatisch:\n_-_ Schriftrollen der Identifizierung\n_-_ Tränke der Stärke\n_-_ Schriftrollen des Spiegelbilds
actors.hero.heroclass.duelist_unlock=Um die Zweikämpferin freizuschalten, _rüste eine Waffe der Klasse 2 oder höher ohne Einbußen durch mangelnde Stärke_ aus.

actors.hero.heroclass.cleric=Kleriker
actors.hero.heroclass.cleric_desc_short=Der Kleriker ist ein göttlicher Spruchwirker, der seinen einzigartigen _heiligen Folianten_ einsetzt, um göttliche Magie zu kanalisieren. Er kann mittels der Talente _Sprüche lernen und verbessern_.
actors.hero.heroclass.cleric_desc=Der Kleriker startet mit einem _einzigartigen heiligen Folianten_, den er einsetzen kann, um verschiedene Sprüche zu wirken.\n\nDie meisten der Talente des Klerikers betreffen das Erlernen neuer oder die Verbesserung bekannter Sprüche.\n\nDer Kleriker ist anfangs mit einem _Totschläger_, einer Stoffrüstung, einem Wasserschlauch und einem Samtbeutel ausgerüstet.\n\nDer Kleriker identifiziert automatisch:\n_-_ Schriftrollen der Identifikation\n_-_ Tränke der Reinheit\n_-_ Schriftrollen des Fluchbrechers
actors.hero.heroclass.cleric_unlock=Um den Kleriker freizuschalten, musst du _den Fluch auf einem beliebigen verfluchten Ausrüstungsgegenstand vollständig entfernen._

actors.hero.herosubclass.berserker=Berserker
actors.hero.herosubclass.berserker_short_desc=Der  _Berserker_ baut Wut auf, wenn er Schaden erleidet. Wut erhöht den von ihm ausgeteilten Schaden und kann bei 100% aktiviert werden, wodurch er einen zusätzlichen Schild erhält.
actors.hero.herosubclass.berserker_desc=Wenn der Berserker physischen Schaden erleidet, wird er wütend – selbst, wenn dieser Schaden von seiner Rüstung abgeblockt wird! Die Wut klingt mit der Zeit ab, bei geringer Gesundheit geschieht dies aber langsamer.\n\nDer Berserker verursacht unter Wut bis zu 50% mehr Schaden. Bei maximaler Wut kann er auch in Rage verfallen, wodurch er eine Menge an Abschirmung erhält und die Wut nicht nachlässt, solange die Abschirmung besteht. Die Abschirmung wächst mit der Stufe der Rüstung des Berserkers und kann massiv erhöht sein, wenn er geringe Lebensenergie hat. Nachdem er in Rage verfallen ist, benötigt der Berserker etwas Zeit, um sich zu erholen.
actors.hero.herosubclass.gladiator=Gladiator
actors.hero.herosubclass.gladiator_short_desc=Der _Gladiator_ baut eine Kombi auf, wenn er erfolgreiche Attacken durchführt. Er kann die Kombi einsetzen, um einzigartige Fähigkeiten zu nutzen.
actors.hero.herosubclass.gladiator_desc=Der Gladiator erhöht seine Kombo jedes mal um einen Punkt, wenn er erfolgreich mit einer Nahkampf- oder Wurfwaffe angreift. Wenn der Gladiator innerhalb von 5 Zügen (15 Züge nach einer Tötung) keinen Treffer landet, wird seine Kombo vollständig zurückgesetzt.\n\nMit steigender Kombo werden verschiedene Kombo-Aktionen mit Treffergarantie ausführbar:\n2er Kombo: Gegner wird zurückgestoßen, Kombo bleibt erhalten\n4er Kombo: verursacht Schaden basierend auf der Rüstung\n6er Kombo: pariert, Kombo bleibt erhalten\n8er Kombo: schädigt Ziel und nahe befindliche Gegner\n10er Kombo: greift einmal für jede Stufe der Kombo an
actors.hero.herosubclass.battlemage=Kampfmagier
actors.hero.herosubclass.battlemage_short_desc=Der _Kampfmagier_ löst Bonuseffekte aus, wenn er seinen Stab als Nahkampfwaffe einsetzt. Diese Effekte basieren auf dem Zauberstab, welcher mit dem Stab des Magiers verbunden ist.
actors.hero.herosubclass.battlemage_desc=Der Kampfmagier erhält einen Bonuseffekt, wenn er mit seinem Stab im Nahkampf zuschlägt, als hätte sein Stab eine zusätzliche Verzauberung. Diese Effekte hängen von dem Zauberstab ab, mit dem der Stab verschmolzen ist; jeder Zauberstab hat dabei seinen eigenen Effekt. Zusätzlich zu den Zauberstab-Effekten erhält der Stab des Kampfmagiers 0,5 Ladungen, wenn er damit zuschlägt.
actors.hero.herosubclass.warlock=Hexenmeister
actors.hero.herosubclass.warlock_short_desc=Der _Hexenmeister_ hat eine Chance, mit seinen Zauberstäben eine Seelenmarkierung auf Gegner zu setzen. Er heilt sich immer, wenn er markierten Gegnern physischen Schaden zufügt.
actors.hero.herosubclass.warlock_desc=Der Hexenmeister hat die Chance, Charakteren eine Seelenmarkierung zuzufügen, wenn er mit einem Zauberstab angreift. Die Chance, eine Seelenmarkierung anzubringen und ihre Dauer erhöhen sich mit dem Level des Zauberstabs.\n\nWenn ein Feind eine Seelenmarkierung besitzt, heilt der Hexenmeister 2 LP für jeweils 5 Schaden, den er ihm zufügt, jedoch nur mit Angriffen von Nahkampf- oder Wurfwaffen, nicht von Zauberstäben!
actors.hero.herosubclass.assassin=Attentäter
actors.hero.herosubclass.assassin_short_desc=Der _Attentäter_ kann einen tödlichen Angriff vorbereiten, während er unsichtbar ist. Je länger er wartet, desto stärker wird der Angriff.
actors.hero.herosubclass.assassin_desc=Der Attentäter bereitet seinen nächsten Schlag vor, wenn er unsichtbar wird. Je länger er sich vorbereitet, desto mächtiger wird sein nächster Angriff. Die Vorbereitung kann bis zu 9 Züge dauern.\n\nNach der Vorbereitung verursacht der Attentäter bei seinem nächsten Angriff zusätzlichen Schaden, kann zu seinem Ziel springen und sogar Gegner, die schwach genug sind, sofort töten.
actors.hero.herosubclass.freerunner=Freiläufer
actors.hero.herosubclass.freerunner_short_desc=Der _Freiläufer_ baut Schwung auf, wenn er läuft, den er nutzen kann, um das Freilaufen zu starten. Dies gibt ihm für eine kurze Zeit einen Bonus auf Geschwindigkeit und Ausweichen.
actors.hero.herosubclass.freerunner_desc=Der _Freiläufer_ baut beim Laufen Schwung auf. Er kann bis zu 10 Schwung aufbauen, nachdem er sich 10 Züge bewegt hat, aber er verliert diesen schnell, wenn er aufhört, sich zu bewegen. Der Freiläufer kann seinen Schwung 2 Züge pro Schwung-Punkt nutzen, um das Freilaufen zu starten.\n\nWährend des Freilaufens bewegt sich der Freiläufer doppelt so schnell und bekommt einen auf seiner Stufe basierenden Bonus auf Ausweichen. Sobald das Freilaufen vorüber ist, beginnt eine Abklingzeit, bevor wieder Schwung aufgebaut werden kann.
actors.hero.herosubclass.sniper=Scharfschützin
actors.hero.herosubclass.sniper_short_desc=Die _Scharfschützin_ kann Rüstung mit ihren Fernkampfangriffen durchdringen. Nach dem Angriff mit einer Wurfwaffe kann sie mit einem Spezialangriff von ihrem Bogen nachsetzen.
actors.hero.herosubclass.sniper_desc=Die Scharfschützin ist eine Meisterin des Fernkampfes; ihre Fernangriffe durchbohren feindliche Rüstungen. Wenn sie einen Feind mit Wurfwaffen angreift, platziert sie eine Scharfschützen-Markierung auf dem Feind, welche dann einen Spezialangriff mit ihrem Bogen gestattet. Dieser Spezialangriff ist abhängig von der Verzauberung des Bogens.\n\nEin nicht verzauberter Bogen wird sofort einen Schuss abgeben, allerdings mit reduziertem Schaden. Ein schneller Bogen wird eine Salve aus drei Pfeilen abfeuern, die zwar reduzierten Schaden bewirken, jedoch Verzauberungen auslösen können und einen Zug dauern. Ein Bogen mit erhöhtem Schaden wird einen Scharfschützenpfeil abfeuern, der garantiert trifft und Zusatzschaden verursacht. Dies dauert zwei Züge.
actors.hero.herosubclass.warden=Wächterin
actors.hero.herosubclass.warden_short_desc=_Die Wächterin_ kann durch hohes Gras sehen und bekommt Bonuseffekte, wenn sie Samen pflanzt und Pflanzen zertrampelt.
actors.hero.herosubclass.warden_desc=Die Wächterin hat eine starke Verbindung zur Natur, die ihr eine Reihe von Bonuseffekten in Bezug auf Gras und Pflanzen gibt. Sie kann durch hohes und gefurchtes Gras sehen, als wäre es ein leeres Feld.\n\nDie Wächterin sorgt dafür, dass um jeden Samen, den sie wirft oder pflanzt, Gras wächst; wenn sie Pflanzen zertritt, erhält sie Bonuseffekte. Diese Bonuseffekte ersetzen die normalen Pflanzeneffekte, was bedeutet, dass keine Pflanze, auf die die Wächterin tritt, ihr schadet.
actors.hero.herosubclass.champion=Meisterin
actors.hero.herosubclass.champion_short_desc=Die _Meisterin_ kann zwei Waffen führen und bekommt mehr Waffenladungen. Ihre normalen Angriffe erfolgen mit der Primärwaffe, aber sie kann die Waffen tauschen und die Fähigkeiten beider Waffen einsetzen.
actors.hero.herosubclass.champion_desc=Die Meisterin beherrscht Nahkampfwaffen perfekt und kann zusätzlich zu ihrer Primärwaffe eine zweite Waffe ausrüsten. Ihre normalen Angriffe erfolgen mit der Primärwaffe, aber sie kann ihre Waffen augenblicklich tauschen und die Fähigkeit einer der Waffen einsetzen.\n\nSie erhält außerdem 2 maximale Ladungen der Waffenfähigkeit mehr und eine um 50% erhöhte Aufladegeschwindigkeit der Waffenfähigkeit.
actors.hero.herosubclass.monk=Nonne
actors.hero.herosubclass.monk_short_desc=Die _Nonne_ baut im Kampf Energie auf. Diese Energie kann in einer Reihe von einzigartigen Fähigkeiten eingesetzt werden.
actors.hero.herosubclass.monk_desc=Die Nonne beherrscht die Körpertechnik perfekt. Wenn sie Feinde besiegt, gewinnt sie Energie, welche in einer Vielzahl an defensiven und technischen Fähigkeiten eingesetzt werden kann. Diese Energie nimmt mit der Zeit nicht ab, hat aber einen Maximalwert in Abhängigkeit von der Stufe der Nonne.\n\n1 Energie: schnelle Faustschläge\n2 Energie: fokussiert aufs Ausweichen gegen den nächsten Angriff\n3 Energie: augenblicklich im Nahbereich springen\n4 Energie: einen Feind zurücktreten\n5 Energie: meditieren zum Löschen des Status und zur Wiederherstellung der Ladungen von Zauberstäben und Artefakten
actors.hero.herosubclass.priest=Priester
actors.hero.herosubclass.priest_short_desc=Der _Priester_ erhält neue, weit reichende Sprüche und eine verstärkte Version des Leitlichts.
actors.hero.herosubclass.priest_desc=Der Priester erhält eine Vielzahl neuer und verbesserter Zauber mit Fokus auf den Fernkampf und Zusammenarbeit mit magischen Gegenständen.\n\nDer Priester kann _Leitlicht_ einmal alle 50 Züge kostenlos wirken, erleuchtet Gegner, die direkt von seinen Zaubern getroffen werden, und kann diesen Erleuchtungs-Effekt durch Angriffe - mit manchen Artefakten, Zauberstäben und Verbündeten - entladen, um Bonus-Schaden in Höhe seiner Stufe +5 zu verursachen.\n\nDer Priester erlernt außerdem den Zauber _Gnadenstrahl_, der die Dunkelheit vertreibt, alle sichtbaren Gegner trifft und diese kurzzeitig betäubt. Dieser Zauber erleuchtet Gegner und erfordert 2 Ladungen.
actors.hero.herosubclass.paladin=Paladin
actors.hero.herosubclass.paladin_short_desc=Der _Paladin_ erhält neue Zauber mit kurzer Reichweite und verstärkte Versionen der heiligen Waffe und der heiligen Wache.
actors.hero.herosubclass.paladin_desc=Der Paladin erhält eine Vielzahl neuer und verbesserter Zauber, die den Nahkampf und die Synergie mit Waffen und Rüstungen betonen.\n\nDie Zauber _Heilige Waffe_ und _Heiliger Schutz_ des Paladins gewähren höhere Boni, überschreiben nicht mehr bereits bestehende Verzauberungen und Glyphen und können durch das Wirken anderer Zauber verlängert werden.\n\nDer Paladin erhält außerdem den Zauber _Göttliche Strafgewalt_, der einen garantierten Nahkampftreffer mit Bonusschaden und Verzauberungskraft ermöglicht.

##talents
actors.hero.talent$provokedangertracker.name=provozierter Zorn
actors.hero.talent$provokedangertracker.desc=Der Krieger hat gerade seine Abschirmung verloren, sein nächster physischer Angriff wird Zusatzschaden verursachen.\n\nVerbleibende Züge: %s.
actors.hero.talent$lingeringmagictracker.name=nachwirkende Magie
actors.hero.talent$lingeringmagictracker.desc=Der Magier hat gerade einen Zauberstab oder Magierstab verwendet, und sein nächster physischer Angriff wird Zusatzschaden verursachen.\n\nVerbleibende Züge: %s.
actors.hero.talent$followupstriketracker.name=Anschlusstreffer
actors.hero.talent$followupstriketracker.desc=Nachdem die Zweikämpferin einen Feind mit einer Wurfwaffe angegriffen hat, verursacht sie bei ihrem nächsten Nahkampfangriff gegen dasselbe Ziel Bonusschaden.\n\nVerbleibende Züge: %s.
actors.hero.talent$patientstriketracker.name=geduldiger Schlag
actors.hero.talent$patientstriketracker.desc=Die Zweikämpferin hat einen Zug gewartet, ihr nächster Nahkampfangriff wird Bonusschaden anrichten.
actors.hero.talent$improvisedprojectilecooldown.name=Abklingzeit für improvisierte Wurfgeschosse
actors.hero.talent$improvisedprojectilecooldown.desc=Du hast dieses Talent vor kurzem benutzt und musst warten, bevor du es erneut nutzen kannst.\n\nVerbleibende Züge: %s.
actors.hero.talent$rejuvenatingstepscooldown.name=Abklingzeit für Schritte der Verjüngung
actors.hero.talent$rejuvenatingstepscooldown.desc=Du hast dieses Talent vor kurzem benutzt und musst warten, bevor du es erneut nutzen kannst.\n\nVerbleibende Züge: %s.
actors.hero.talent$seershotcooldown.name=Abklingzeit für Schuss der klaren Sicht
actors.hero.talent$seershotcooldown.desc=Du hast dieses Talent vor kurzem benutzt und musst warten, bevor du es erneut nutzen kannst.\n\nVerbleibende Züge: %s.
actors.hero.talent$aggressivebarriercooldown.name=Abklingzeit aggressive Barriere
actors.hero.talent$aggressivebarriercooldown.desc=Du hast dieses Talent vor kurzem benutzt und musst warten, bevor du es erneut nutzen kannst.\n\nVerbleibende Züge: %s.
actors.hero.talent$liquidagilacctracker.name=flüssige Wendigkeit
actors.hero.talent$liquidagilacctracker.desc=Der nächste normale Angriff der Zweikämpferin erhält zusätzliche Genauigkeit.\n\nVerbleibende Züge: %s.
actors.hero.talent$lethalhastecooldown.name=Abklingzeit letale Eile
actors.hero.talent$lethalhastecooldown.desc=Du hast dieses Talent vor kurzem benutzt und musst warten, bevor du es erneut nutzen kannst.\n\nVerbleibende Züge: %s.
actors.hero.talent$swiftequipcooldown.name=Abklingzeit rasches Ausrüsten
actors.hero.talent$swiftequipcooldown.desc=Du hast dieses Talent vor kurzem benutzt und musst warten, bevor du es erneut nutzen kannst.\n\nVerbleibende Züge: %s.
actors.hero.talent$preciseassaulttracker.name=präziser Angriff
actors.hero.talent$preciseassaulttracker.desc=Der nächste normale Angriff der Zweikämpferin erhält zusätzliche Genauigkeit.\n\nVerbleibende Züge: %s.
actors.hero.talent$deadlyfollowuptracker.name=tödliches Nachtreten
actors.hero.talent$deadlyfollowuptracker.desc=Nachdem die Zweikämpferin einen Feind mit einer Wurfwaffe angegriffen hat, verursacht sie bei ihren nächsten Nahkampfangriff gegen dasselbe Ziel Bonusschaden.\n\nVerbleibende Züge: %s.
actors.hero.talent$combinedlethalityabilitytracker.executed=hingerichtet
actors.hero.talent$satiatedspellstracker.name=Schutzzauber
actors.hero.talent$satiatedspellstracker.desc=Der nächste Zauber, den der Kleriker wirkt, verleiht ihm eine geringe Menge an Abschirmung.
actors.hero.talent$searinglightcooldown.name=Sengendes Licht
actors.hero.talent$searinglightcooldown.desc=Du hast dieses Talent vor kurzem benutzt und musst warten, bevor du es erneut nutzen kannst.\n\nVerbleibende Züge: %s.

#warrior
actors.hero.talent.hearty_meal.title=herzhafte Mahlzeit
actors.hero.talent.hearty_meal.desc=_+1:_ Das Essen von Nahrung heilt den Krieger um _4 LP_, wenn er 33% oder weniger Gesundheit hat.\n\n_+2:_ Das Essen von Nahrung heilt den Krieger um _6 LP_, wenn er 33% oder weniger Gesundheit hat.
actors.hero.talent.veterans_intuition.title=Intuition des Veteranen
actors.hero.talent.veterans_intuition.desc=_+1:_ Der Krieger identifiziert Waffen _1,75x schneller_ und Rüstungen _2,5x schneller_.\n\n_+2:_ Der Krieger identifiziert Waffen _2,5x schneller_ und Rüstungen, _sobald er sie ausrüstet_.
actors.hero.talent.provoked_anger.title=provozierter Zorn
actors.hero.talent.provoked_anger.desc=_+1:_ Wenn ein Abschirmungseffekt des Kriegers durch Schaden zerstört wird, verursacht sein nächster physischer Angriff _3 Bonusschaden_.\n\n_+2:_ Wenn ein Abschirmungseffekt des Kriegers durch Schaden zerstört wird, verursacht sein nächster physischer Angriff _5 Bonusschaden_.
actors.hero.talent.iron_will.title=eiserner Wille
actors.hero.talent.iron_will.desc=_+1:_ Die Schildstärke des Siegels des Kriegers wird _um 1_ erhöht.\n\n_+2:_ Die Schildstärke des Siegels des Kriegers wird _um 2_ erhöht.
actors.hero.talent.iron_will.meta_desc=_Wenn dieses Talent von einem anderen Helden erlangt wird_, verleiht es passiv eine 1 oder 2 maximale Schildversion des Effekts vom zerbrochenen Siegel des Kriegers.

actors.hero.talent.iron_stomach.title=eiserner Magen
actors.hero.talent.iron_stomach.desc=_+1:_ Nahrung zu sich nehmen braucht für den Krieger 1 Zug und verleiht ihm _75% Schadenswiderstand_ während des Essens.\n\n_+2:_ Nahrung zu sich nehmen braucht für den Krieger 1 Zug und verleiht ihm _100% Schadenswiderstand_ beim Essen.
actors.hero.talent.liquid_willpower.title=flüssige Willenskraft
actors.hero.talent.liquid_willpower.desc=_+1:_ Wenn der Kämpfer einen Trank, ein Gebräu oder Elixier trinkt oder wirft, erhält er _6.5% seiner maximalen LP als Schild_.\n\n_+2:_ Wenn der Kämpfer einen Trank, ein Gebräu oder Elixier trinkt oder wirft, erhält er _10% seiner maximalen LP als Schild_.\n\nDie Schildstärke verdoppelt sich, wenn ein Trank der Stärke, der Erfahrung, oder alchemische Gegenstände, die aus diesen gewonnen wurden, verwendet werden.\n\nBei alchemischen Gegenständen mit größerer Ausgabemenge (z.B. Aqua-Gebräu) kann dieses Talent, abhängig davon, wieviel dieses Gegenstands hergestellt wurde, ausgelöst werden.
actors.hero.talent.runic_transference.title=Runentransfer
actors.hero.talent.runic_transference.desc=_+1:_ Das zerbrochene Siegel des Kriegers kann _normale Glyphen_ genau so transferieren wie eine Verbesserung.\n\n_+2:_ Das zerbrochene Siegel des Kriegers kann _normale, starke und verfluchte Glyphen_ genau so transferieren wie eine Verbesserung.\n\nDas Siegel kann nur Glyphen transferieren, die an der Rüstung angewandt wurden, als das Siegel daran angebracht war.
actors.hero.talent.runic_transference.meta_desc=_Wenn dieses Talent von einem anderen Helden erworben wird_, verringert sich stattdessen die Wahrscheinlichkeit, dass Rüstungsverzauberungen durch den Einsatz von Schriftrollen der Verbesserung entfernt werden. Die Wahrscheinlichkeit, dass Rüstungsverzauberungen verloren gehen, beginnt bei Level 6 (statt 4) bei +1, oder bei Level 7 (statt 4) bei +2. Die Stufe, bei der Rüstungsverzauberungen garantiert verloren gehen, verbleibt unverändert bei +8.
actors.hero.talent.lethal_momentum.title=tödlicher Schwung
actors.hero.talent.lethal_momentum.desc=_+1:_ Wenn der Krieger einen tödlichen Schlag mit einer physischen Waffe landet, besteht eine _Chance von 67%_, dass er 0 Züge braucht.\n\n_+2:_ Wenn der Krieger einen tödlichen Schlag mit einer physischen Waffe landet, besteht eine _Chance von 100%_, dass er 0 Züge braucht.
actors.hero.talent.improvised_projectiles.title=improvisierte Wurfgeschosse
actors.hero.talent.improvised_projectiles.desc=_+1:_ Der Krieger kann einen Feind für _2 Züge_ blenden, indem er einen beliebigen Gegenstand, der keine Wurfwaffe ist, auf diesen wirft. Dies braucht 50 Züge, bis es erneut verfügbar ist.\n\n_+2:_ Der Krieger kann einen Feind für _3 Züge_ blenden, indem er einen beliebigen Gegenstand, der keine Wurfwaffe ist, auf diesen wirft. Dies braucht 50 Züge, bis es erneut verfügbar ist.

actors.hero.talent.hold_fast.title=Position halten
actors.hero.talent.hold_fast.desc=_+1:_ Wenn der Krieger wartet, bekommt er _1-2 Rüstung_ und verlangsamt das Abbauen der Kombi und der Schildverbesserungen um 50%, bis er sich bewegt.\n\n_+2:_ Wenn der Krieger wartet, bekommt er _2-4 Rüstung_ und verlangsamt das Abbauen der Kombi und der Schildverbesserungen um 75%, bis er sich bewegt.\n\n_+3:_ Wenn der Krieger wartet, bekommt er _3-6 Rüstung_ und verlangsamt das Abbauen der Kombi und der Schildverbesserungen um 100%, bis er sich bewegt.
actors.hero.talent.strongman.title=Muskelmann
actors.hero.talent.strongman.desc=_+1:_ Die Stärke des Kriegers wird um _8% erhöht_, es wird abgerundet.\n\n_+2:_ Die Stärke des Kriegers wird um _13% erhöht_, es wird abgerundet.\n\n_+3:_ Die Stärke des Kriegers wird um _18% erhöht_, es wird abgerundet.

actors.hero.talent.endless_rage.title=endlose Wut
actors.hero.talent.endless_rage.desc=_+1:_ Der Berserker kann bis zu _116% Wut_ erreichen.\n\n_+2:_ Der Berserker kann bis zu _133% Wut_ erreichen.\n\n_+3:_  Der Berserker kann bis zu _150% Wut_ erreichen.\n\nJeder Punkt Rage über 100% erhöht den Raserei-Schild um 1% und setzt die Abklingzeit um 1% herab, erhöht den Bonusschaden aber nicht über +50%.
actors.hero.talent.deathless_fury.title=unsterbliche Wut
actors.hero.talent.deathless_fury.desc=_+1:_ Wenn der Berserker gleich stirbt und die Wut 100% oder mehr beträgt , wird automatisch Raserei aktiviert, aber die Abklingzeit beträgt _3 Level des Helden_, wenn dies eintritt.\n\n_+2:_ Wenn der Berserker gleich stirbt und die Wut 100% oder mehr beträgt , wird automatisch Raserei aktiviert, aber die Abklingzeit beträgt _2 Level des Helden_, wenn dies eintritt.\n\n_+3:_ Wenn der Berserker gleich stirbt und die Wut 100% oder mehr beträgt , wird automatisch Raserei aktiviert, aber die Abklingzeit beträgt _1 Level des Helden_, wenn dies eintritt.\n\nDenke daran, dass der Berserker trotzdem stirbt, wenn er am Ende der Raserei 0 Lebenspunkte hat.
actors.hero.talent.enraged_catalyst.title=wütender Katalysator
actors.hero.talent.enraged_catalyst.desc=_+1:_ Verzauberungen und Flüche auf der Waffe eines Berserkers werden umso öfter aktiviert, je mehr Wut er angestaut hat, bis zu _15% öfter_ bei 100% Wut.\n\n_+2:_ Verzauberungen und Flüche auf der Waffe eines Berserkers werden umso öfter aktiviert, je mehr Wut er angestaut hat, bis zu _30% öfter_ bei 100% Wut.\n\n_+3:_ Verzauberungen und Flüche auf der Waffe eines Berserkers werden umso öfter aktiviert, je mehr Wut er angestaut hat, bis zu _45% öfter_ bei 100% Wut.

actors.hero.talent.cleave.title=Durchschneiden
actors.hero.talent.cleave.desc=_+1:_ Die Extra-Zeit, die der Gladiator für das Töten eines Gegners erhält, erhöht sich von 15 Zügen auf _30_.\n\n_+2:_ Die Extra-Zeit, die der Gladiator für das Töten eines Gegners erhält, erhöht sich von 15 Zügen auf _45_.\n\n_+3 _ Die Extra-Zeit, die der Gladiator für das Töten eines Gegners erhält, erhöht sich von 15 Zügen auf _60_.
actors.hero.talent.lethal_defense.title=tödliche Abwehr
actors.hero.talent.lethal_defense.desc=_+1:_ Wenn der Gladiator einen Gegner mit einem Kombo-Angriff tötet, wird die Abklingzeit vom Schild des zerbrochenen Siegels des Kriegers _um 50 Züge reduziert_.\n\n_+2:_ Wenn der Gladiator einen Gegner mit einem Kombo-Angriff tötet, wird die Abklingzeit vom Schild des zerbrochenen Siegels des Kriegers _um 100 Züge reduziert_.\n\n_+3:_ Wenn der Gladiator einen Gegner mit einem Kombo-Angriff tötet, wird die Abklingzeit vom Schild des zerbrochenen Siegels des Kriegers _um 150 Züge reduziert_.\n\nDie Schild-Abklingzeit kann durch dieses Talent um bis zu -150 Züge reduziert werden, was bedeutet, dass es bei einer Aktivierung sofort wieder verfügbar ist.
actors.hero.talent.enhanced_combo.title=verbesserte Kombi
actors.hero.talent.enhanced_combo.desc=_+1:_ Wenn der Kombiwert des Gladiators 7 oder mehr beträgt, erhöht sich der Rückstoß des Schlags auf 3, er verursacht Schwindel, und er kann Feinde in Gruben stoßen.\n\n_+2:_ Zusätzlich zu den Vorteilen von +1 funktioniert die Parade bei mehreren Angriffen, wenn der Kombiwert 9 oder höher beträgt.\n\n_+3:_ Zusätzlich zu den Vorteilen von +1 und +2 kann der Gladiator bis zu Kombiwert/3 Felder hervorspringen, wenn er Slam, Crush, oder Wut einsetzt.

actors.hero.talent.body_slam.title=Körperschlag
actors.hero.talent.body_slam.desc=_+1:_ Wenn der Krieger nach dem Sprung landet, bekommen alle nebenstehenden Gegner _1-4 plus 25% _ seines Rüstungswertes als Schaden.\n\n_+2:_ Wenn der Krieger nach dem Sprung landet, bekommen alle nebenstehenden Gegner _2-8 plus 50%_ seines Rüstungswertes als Schaden.\n\n_+3:_ Wenn der Krieger nach dem Sprung landet, bekommen alle nebenstehenden Gegner _3-12 plus 75%_ seines Rüstungswertes als Schaden.\n\n_+4:_ Wenn der Krieger nach dem Sprung landet, bekommen alle nebenstehenden Gegner _4-16 plus 100%_ seines Rüstungswertes als Schaden.
actors.hero.talent.impact_wave.title=Druckwelle
actors.hero.talent.impact_wave.desc=_+1:_ Wenn der Krieger nach dem Sprung landet, werden alle benachbarten Feinde _2 Felder_ zurückgestoßen und haben eine _25% Chance_, 5 Züge lang verwundbar zu werden.\n\n_+2:_ Wenn der Krieger nach dem Sprung landet, werden alle benachbarten Feinde _3 Felder_ zurückgestoßen und haben eine _50% Chance_, 5 Züge lang verwundbar zu werden.\n\n_+3:_ Wenn der Krieger nach dem Sprung landet, werden alle benachbarten Feinde _4 Felder_ zurückgestoßen und haben eine _75% Chance_, 5 Züge lang verwundbar zu werden.\n\n_+4:_ Wenn der Krieger nach dem Sprung landet, werden alle benachbarten Feinde _5 Felder_ zurückgestoßen und haben eine _100% Chance_, 5 Züge lang verwundbar zu werden.
actors.hero.talent.double_jump.title=Doppelsprung
actors.hero.talent.double_jump.desc=_+1:_ Wenn der Krieger innerhalb von 3 Zügen einen zweiten Sprung ausführt, hat dieser Sprung _16% reduzierte_ Aufladungskosten.\n\n_+2:_ Wenn der Krieger innerhalb von 3 Zügen einen zweiten Sprung ausführt, hat dieser Sprung _30% reduzierte_ Aufladungskosten.\n\n_+3:_ Wenn der Krieger innerhalb von 3 Zügen einen zweiten Sprung ausführt, hat dieser Sprung um _40% reduzierte_ Aufladungskosten.\n\n_+4:_ Wenn der Krieger innerhalb von 3 Zügen einen zweiten Sprung ausführt, hat dieser Sprung _50% reduzierte_ Aufladungskosten.

actors.hero.talent.expanding_wave.title=ausbreitende Welle
actors.hero.talent.expanding_wave.desc=_+1:_ Die Reichweite der Schockwelle erhöht sich von 5 auf _6 Felder_, und der Winkel der Ausbreitung vergrößert sich von 60 auf _75 Grad_.\n\n_+2:_ Die Reichweite der Schockwelle erhöht sich von 5 auf _7 Felder_, und der Winkel der Ausbreitung vergrößert sich von 60 auf _90 Grad_.\n\n_+3:_ Die Reichweite der Schockwelle erhöht sich von 5 auf _8 Felder_, und der Winkel der Ausbreitung vergrößert sich von 60 auf _105 Grad_.\n\n_+4:_ Die Reichweite der Schockwelle erhöht sich von 5 auf _9 Felder_, und der Winkel der Ausbreitung vergrößert sich von 60 auf _120 Grad_.
actors.hero.talent.striking_wave.title=Wellenschlag
actors.hero.talent.striking_wave.desc=_+1:_ Schockwelle hat eine Chance von _30%_, auch Treffereffekte wie Verzauberungen und Kombi zu verwenden.\n\n_+2:_ Schockwelle hat eine Chance von _60%_, auch Treffereffekte wie Verzauberungen und Kombi zu verwenden.\n\n_+3:_ Schockwelle hat eine Chance von _90%_, auch Treffereffekte wie Verzauberungen und Kombi zu verwenden.\n\n_+4:_ Schockwelle hat eine Chance von _100%_, auch Treffereffekte wie Verzauberungen und Kombi zu verwenden, und verleiht Verzauberungen _20% mehr Kraft_.
actors.hero.talent.shock_force.title=Energieschock
actors.hero.talent.shock_force.desc=_+1:_ Schockwelle verursacht _20% mehr Schaden_ und hat eine Chance von _25%_, statt zu verkrüppeln, zu betäuben.\n\n_+2:_ Schockwelle verursacht _40% mehr Schaden_ und hat eine Chance von _50%_, zu betäuben statt zu verkrüppeln.\n\n_+3:_ Schockwelle verursacht _60% mehr Schaden_ und hat eine Chance von _75%_, zu betäuben statt zu verkrüppeln.\n\n_+4:_ Schockwelle verursacht _80% mehr Schaden_ und hat eine Chance von _100%_, statt zu verkrüppeln, zu betäuben.

actors.hero.talent.sustained_retribution.title=anhaltende Vergeltung
actors.hero.talent.sustained_retribution.desc=_+1:_ Der Krieger verursacht _115% Bonusschaden_ verteilt auf _2 Treffer_, anstatt 100% Bonusschaden in 1 Treffer.\n\n_+2:_ Der Krieger verursacht _130% Bonusschaden_ verteilt auf _3 Treffer_, anstatt 100% Bonusschaden in 1 Treffer.\n\n_+3:_ Der Krieger verursacht _145% Bonusschaden_ verteilt auf _4 Treffer_, anstatt 100% Bonusschaden in 1 Treffer.\n\n_+4:_ Der Krieger verursacht _160 % Bonusschaden_ verteilt auf _5 Treffer_, anstatt 100 % Bonusschaden in 1 Treffer.
actors.hero.talent.shrug_it_off.title=nimm es hin
actors.hero.talent.shrug_it_off.desc=_+1:_ Die Schadensreduktion eines Kriegers ist von 50% _auf 60% erhöht_, während er durchhält.\n\n_+2:_ Die Schadensreduktion eines Kriegers ist von 50% _auf 68% erhöht_, während er durchhält.\n\n_+3:_ Die Schadensreduktion eines Kriegers ist von 50% _auf 74% erhöht_, während er durchhält.\n\n_+4:_ Die Schadensreduktion eines Kriegers ist von 50% _auf 80% erhöht_, während er durchhält.
actors.hero.talent.even_the_odds.title=die Chancen ausgleichen
actors.hero.talent.even_the_odds.desc=_+1:_ Der Krieger teilt zusätzliche _5% Bonus-Schaden_ an alle Feinde im Umkreis von 2 Feldern aus, wenn das Aushalten endet.\n\n_+2:_ Der Krieger teilt zusätzliche _10% Bonus-Schaden_ an alle Feinde im Umkreis von 2 Feldern aus, wenn das Aushalten endet.\n\n_+3:_ Der Krieger teilt zusätzliche _15% Bonus-Schaden_ an alle Feinde im Umkreis von 2 Feldern aus, wenn das Aushalten endet.\n\n_+4:_ Der Krieger teilt zusätzliche _20% Bonus-Schaden_ an alle Feinde im Umkreis von 2 Feldern aus, wenn das Aushalten endet.

#mage
actors.hero.talent.empowering_meal.title=stärkende Mahlzeit
actors.hero.talent.empowering_meal.desc=_+1:_ Das Essen von Nahrung gewährt dem Magier bei den nächsten drei Malen, in denen er mit einem Zauberstab Schaden verursacht, _2 zusätzlichen Schaden_.\n\n_+2:_ Das Essen von Nahrung gewährt dem Magier bei den nächsten 3 Malen, in denen er mit einem Zauberstab Schaden verursacht, 3 zusätzlichen Schaden.
actors.hero.talent.scholars_intuition.title=Intuition des Gelehrten
actors.hero.talent.scholars_intuition.desc=_+1:_ Der Magier kann Zauberstäbe _3 mal so schnell_ identifizieren.\n\n_+2:_ Der Magier identifiziert Zauberstäbe, _sobald er sie benutzt_.
actors.hero.talent.lingering_magic.title=nachwirkende Magie
actors.hero.talent.lingering_magic.desc=_+1:_ Wenn der Magier einen Zauberstab oder Stab einsetzt, verursacht sein nächster physischer Angriff _1-2 Bonusschaden_.\n\n_+2:_ Wenn der Magier einen Zauberstab oder Stab einsetzt, verursacht sein nächster physischer Angriff _2 Bonusschaden Schaden_.
actors.hero.talent.backup_barrier.title=Notbarriere
actors.hero.talent.backup_barrier.desc=_+1:_ Der Magier erhält _3 Schildpunkte_, wenn er die letzte Ladung seines Stabs verbraucht.\n\n_+2:_ Der Magier erhält _5 Schildpunkte_, wenn er die letzte Ladung seines Stabs verbraucht.
actors.hero.talent.backup_barrier.meta_desc=_Wenn dieses Talent durch einen anderen Helden gewonnen wird_, wird es stattdessen durch den Zauberstab des Helden mit dem höchsten Level ausgelöst.

actors.hero.talent.energizing_meal.title=energiereiche Mahlzeit
actors.hero.talent.energizing_meal.desc=_+1:_ Das Essen von Nahrung dauert für den Magier 1 Zug und gewährt ihm _5 Züge Zauberstab-Aufladung_.\n\n_+2:_ Das Essen von Nahrung dauert für den Magier 1 Zug und gewährt ihm _8 Züge Zauberstab-Aufladung_.
actors.hero.talent.inscribed_power.title=niedergeschriebene Macht
actors.hero.talent.inscribed_power.desc=_+1:_ Wenn der Magier eine Schriftrolle liest oder einen Zaubergegenstand verwendet, erhalten seine _nächsten 2 Zauberstab-Zaps_ +2 Stufen.\n\n_+2:_ Wenn der Magier eine Schriftrolle liest oder einen Zaubergegenstand verwendet, erhalten seine _nächsten 3 Zauberstab-Zaps_ +2 Stufen.\n\nDie Anzahl der verbesserten Zauberstab-Zaps wird verdoppelt, wenn eine Schriftrolle mit Upgrade-, Transmutations- oder Alchemiegegenständen verwendet wird, die mit diesen Schriftrollen hergestellt wurde..\n\nBei Alchemiegegenständen mit höheren Produktionsmengen (z. B. den meisten Zaubersprüchen) besteht eine Chance, dass dieses Talent ausgelöst wird, je nachdem, wie viele dieser Gegenstände produziert werden.
actors.hero.talent.wand_preservation.title=Bewahrung von Zauberstäben
actors.hero.talent.wand_preservation.desc=_+1:_ Wenn der Magier seinen Stab mit einem neuen Zauberstab versieht, erhält er den alten Zauberstab mit +0 zurück. _Dies kann jedoch nur einmal geschehen._\n\n_+2:_ Wenn der Magier seinen Stab mit einem neuen Zauberstab versieht, erhält er den alten Zauberstab mit +0 zurück. _Dies kann mit einer Abklingzeit von einer Heldenstufe wiederholt werden._
actors.hero.talent.wand_preservation.meta_desc=_Wenn dieses Talent durch einen anderen Helden gewonnen wird_, erhöht es stattdessen die Menge an gewonnenem arkanem Harz, wenn ein Zauberstab in einem Alchemiekessel aufgelöst wird, um 1 bei +1, oder um 2 bei +2.
actors.hero.talent.arcane_vision.title=arkane Wahrnehmung
actors.hero.talent.arcane_vision.desc=_+1:_ Wenn der Magier auf einen Feind feuert, bekommt er _10 Züge lang_ die Übersinnliche Wahrnehmung für ihn.\n\n_+2:_ Wenn der Magier auf einen Feind feuert, bekommt er _15 Züge lang_ die Übersinnliche Wahrnehmung für ihn.
actors.hero.talent.shield_battery.title=Schildbatterie
actors.hero.talent.shield_battery.desc=_+1:_ Der Magier kann mit einem Zauberstab auf sich selbst zielen, um alle Ladungen des Zauberstabs mit einer Rate von _4% maximale LP pro Ladung_ in einen Schild umzuwandeln.\n\n_+2:_ Der Magier kann mit einem Zauberstab auf sich selbst zielen, um alle Ladungen des Zauberstabs mit einer Rate von _6% maximale LP pro Ladung_ in einen Schild umzuwandeln.

actors.hero.talent.desperate_power.title=verzweifelte Macht
actors.hero.talent.desperate_power.desc=_+1:_ Die Stäbe des Magiers erhalten _+1 Stufe_ auf ihren letzten Angriff, wenn sie nur noch eine Ladung haben.\n\n_+2:_ Die Stäbe des Magiers erhalten _+2 Stufen_ auf ihren letzten Angriff, wenn sie nur noch eine Ladung haben.\n\n_+3:_ Die Stäbe des Magiers erhalten _+3 Stufen_ auf ihren letzten Angriff, wenn sie nur noch eine Ladung haben.
actors.hero.talent.ally_warp.title=Verbündeten-Teleportation
actors.hero.talent.ally_warp.desc=_+1:_ Der Magier kann einen Verbündeten innerhalb von _2 Feldern Entfernung_ wählen, um sofort mit ihm den Platz zu tauschen.\n\n_+2:_ Der Magier kann einen Verbündeten innerhalb von _4 Feldern Entfernung_ wählen, um sofort mit ihm den Platz zu tauschen.\n\n_+3:_ Der Magier kann einen Verbündeten innerhalb von _6 Feldern Entfernung_ wählen, um sofort mit ihnen den Platz zu tauschen.\n\nDer Magier kann seinen Platz nicht mit unbeweglichen Verbündeten tauschen.

actors.hero.talent.empowered_strike.title=ermächtigter Schlag
actors.hero.talent.empowered_strike.desc=_+1:_ Der erste Nahkampf-Schlag des Kampfmagiers mit seinem Stab nach dem Einsatz als Zauberstab verursacht _+16% Schaden_ und der Bonuseffekt des Stabs erhält _+50% Kraft_.\n\n_+2:_ Der erste Nahkampf-Schlag des Kampfmagiers mit seinem Stab nach dem Einsatz als Zauberstab verursacht _+33% Schaden_ und der Bonuseffekt des Stabs erhält _+100% Kraft_.\n\n_+3:_ Der erste Nahkampf-Schlag des Kampfmagiers mit seinem Stab nach dem Einsatz als Zauberstab verursacht _+50% Schaden_ und der Bonuseffekt des Stabs erhält _+150% Kraft_.
actors.hero.talent.mystical_charge.title=mystische Ladung
actors.hero.talent.mystical_charge.desc=_+1:_ Das Schlagen mit seinem Stab gewährt dem Kampfmagier _0,5 Züge_ Wiederaufladen von Artefakten.\n\n_+2:_ Das Schlagen mit seinem Stab gewährt dem Kampfmagier eine Wiederaufladung von Artefakten im Wert von _1 Zug_.\n\n_+3:_ Das Schlagen mit seinem Stab gewährt dem Kampfmagier _1,5 Züge_ Wiederaufladen von Artefakten.
actors.hero.talent.excess_charge.title=überschüssige Ladung
actors.hero.talent.excess_charge.desc=_+1:_ Wenn der Stab des Kampfmagiers voll aufgeladen ist, gewährt sein nächster Schuss ihm _0.67 Schild_ pro Stufe des Stabs.\n\n_+2:_ Wenn der Stab des Kampfmagiers voll aufgeladen ist, gewährt sein nächster Schuss ihm _1.33 Schild_ pro Stufe des Stabs.\n\n_+3:_ Wenn der Stab des Kampfmagiers voll aufgeladen ist, gewährt sein nächster Schuss ihm _2 Schild_ pro Stufe des Stabs.

actors.hero.talent.soul_siphon.title=Seelenfänger
actors.hero.talent.soul_siphon.desc=_+1:_ Physischer Schaden, der von anderen Charakteren verursacht wird, löst das Seelenzeichen des Hexenmeisters mit _13% Effektivität_ aus.\n\n_+2:_ Physischer Schaden, der von anderen Charakteren verursacht wird, löst das Seelenzeichen des Hexenmeisters mit _27 % Effektivität_ aus.\n\n_+3:_ Physischer Schaden, der von anderen Charakteren verursacht wird, löst das Seelenzeichen des Hexenmeisters mit _40% Effektivität_ aus.
actors.hero.talent.soul_eater.title=Seelenfresser
actors.hero.talent.soul_eater.desc=_+1:_ Seelenzeichen gewährt _0,33 Züge_ Sättigung für jeden zugefügten physischen Schaden. Seelenmarkierte Feinde haben eine _10% Chance_, bei ihrem Tod Effekte wie nach dem Verzehr von Nahrung auszulösen.\n\n_+2:_ Seelenzeichen gewährt _0,67 Züge_ Sättigung für jeden zugefügten physischen Schaden. Seelenmarkierte Feinde haben eine _20% Chance_, bei ihrem Tod Effekte wie nach dem Verzehr von Nahrung auszulösen.\n\n_+3:_ Seelenzeichen gewährt _1 Zug_ Sättigung für jeden zugefügten physischen Schaden. Seelenmarkierte Feinde haben eine _30% Chance_, bei ihrem Tod Effekte wie nach dem Verzehr von Nahrung auszulösen.
actors.hero.talent.necromancers_minions.title=Schergen des Nekromanten
actors.hero.talent.necromancers_minions.desc=_+1:_ Wenn ein seelenmarkierter Feind stirbt, hat der Hexenmeister eine _13% Chance_, ihn als verderbten Geist zu erwecken.\n\n_+2:_ Wenn ein seelenmarkierter Feind stirbt, hat der Hexenmeister eine  _27% Chance_, ihn als verderbten Geist zu erwecken.\n\n_+3:_ Wenn ein seelenmarkierter Feind stirbt, hat der Hexenmeister eine  _40% Chance_, ihn als verderbten Geist zu erwecken.

actors.hero.talent.blast_radius.title=Explosionsradius
actors.hero.talent.blast_radius.desc=_+1:_ Der Radius der Elementarexplosion wird erhöht von 4 auf _5 Felder_.\n\n_+2:_ Der Radius der Elementarexplosion wird erhöht von 4 auf _6 Felder_.\n\n_+3:_ Der Radius der Elementarexplosion wird erhöht von 4 auf _7 Felder_.\n\n_+4:_ Der Radius der Elementarexplosion wird erhöht von 4 auf _8 Felder_.
actors.hero.talent.elemental_power.title=Elementarenergie
actors.hero.talent.elemental_power.desc=_+1:_ Die Kraft der Elementarexplosion wird um _25%_ erhöht.\n\n_+2:_ Die Kraft der Elementarexplosion wird um _50%_ erhöht.\n\n_+3:_ Die Kraft der Elementarexplosion wird um _75%_ erhöht.\n\n_+4:_ Die Kraft der Elementarexplosion wird um _100%_ erhöht.
actors.hero.talent.reactive_barrier.title=reaktive Barriere
actors.hero.talent.reactive_barrier.desc=_+1:_ Der Magier erhält _2,5 Schild_ für jeden von einer Elementarexplosion betroffenen Charakter, für höchstens 5 Charaktere.\n\n_+2:_ Der Magier erhält _5 Schild_ für jeden von einer Elementarexplosion betroffenen Charakter, für höchstens 6 Charaktere.\n\n_+3:_ Der Magier erhält _7,5 Schild_ für jeden von einer Elementarexplosion betroffenen Charakter, für höchstens 7 Charaktere.\n\n_+4:_ Der Magier erhält _10 Schild_ für jeden von einer Elementarexplosion betroffenen Charakter, für höchstens 8 Charaktere.

actors.hero.talent.wild_power.title=wilde Kraft
actors.hero.talent.wild_power.desc=_+1:_ Beim Einsatz von wilder Magie werden Zauberstäbe um _2 oder 3, bis auf +4_, verstärkt.\n\n_+2:_ Beim Einsatz von wilder Magie werden Zauberstäbe um _3, bis auf +5_, verstärkt.\n\n_+3:_ Beim Einsatz von wilder Magie werden Zauberstäbe um _3 oder 4, bis auf +6_, verstärkt.\n\n_+4:_ Beim Einsatz von wilder Magie werden Zauberstäbe um _4, bis auf +7_, verstärkt.
actors.hero.talent.fire_everything.title=aus allen Rohren
actors.hero.talent.fire_everything.desc=_+1:_ wilde Magie feuert nun _5_ statt bisher 4 mal, und jeder Zauberstab hat eine 25% Chance, bis zu dreimal verwendet werden zu können.\n\n_+2:_ wilde Magie feuert nun _6_ statt bisher 4 mal, und jeder Zauberstab hat eine 50% Chance, bis zu dreimal verwendet werden zu können.\n\n_+3:_ wilde Magie feuert nun _7_ statt bisher 4 mal, und jeder Zauberstab hat eine 75% Chance, bis zu dreimal verwendet werden zu können.\n\n_+4:_ wilde Magie feuert nun _8_ statt bisher 4 mal, und jeder Zauberstab hat eine 100% Chance, bis zu dreimal verwendet werden zu können.
actors.hero.talent.conserved_magic.title=konservierte Magie
actors.hero.talent.conserved_magic.desc=_+1:_ Jeder Schuss mit wilder Magie verbraucht jetzt _0,33 Ladungen_ statt 0,5 und wilde Magie hat eine Chance von _25%_, keinen Zug zu verbrauchen.\n\n_+2:_ Jeder Schuss mit wilder Magie verbraucht jetzt _0,225 Ladungen_ statt 0,5 und wilde Magie hat eine Chance von _50%_, keinen Zug zu verbrauchen.\n\n_+3:_ Jeder Schuss mit wilder Magie verbraucht jetzt _0,15 Ladungen_ statt 0,5 und wilde Magie hat eine Chance von _75%_, keinen Zug zu verbrauchen.\n\n_+4:_ Jeder Schuss mit wilder Magie verbraucht jetzt _0,1 Ladungen_ statt 0,5 und wilde Magie hat eine Chance von _100%_, keinen Zug zu verbrauchen.

actors.hero.talent.telefrag.title=Teleporttod
actors.hero.talent.telefrag.desc=_+1:_ Wenn der Magier in einen anderen Charakter teleportiert, fügt er diesem _10-15 Schaden_ zu, erleidet aber selbst auch _5 Schaden_.\n\n_+2:_ Wenn der Magier in einen anderen Charakter teleportiert, fügt er diesem _20-30 Schaden_ zu, erleidet aber selbst auch _10 Schaden_.\n\n_+3:_ Wenn der Magier in einen anderen Charakter teleportiert, fügt er diesem _30-45 Schaden_ zu, erleidet aber selbst auch _15 Schaden_.\n\n_+4:_ Wenn der Magier in einen anderen Charakter teleportiert, fügt er diesem _40-60 Schaden_ zu, erleidet aber selbst auch _20 Schaden_.\n\nDer Held kann durch dieses Talent nicht getötet werden, der Selbstschaden kann durch Magieresistenz-Effekte reduziert werden.
actors.hero.talent.remote_beacon.title=fernes Leuchtfeuer
actors.hero.talent.remote_beacon.desc=_+1:_ Der Magier kann eine Sprungmarke an einem beliebigen Ort innerhalb von _4 Feldern_ aufstellen.\n\n_+2:_ Der Magier kann eine Sprungmarke an einem beliebigen Ort innerhalb von _8 Feldern_ aufstellen.\n\n_+3:_ Der Magier kann eine Sprungmarke an einem beliebigen Ort innerhalb von _12 Feldern_ aufstellen.\n\n_+4:_ Der Magier kann eine Sprungmarke an einem beliebigen Ort innerhalb von _16 Feldern_ platzieren.\n\nDer Magier kann keine Sprungmarken an Orten platzieren, die nicht zugänglich sind.
actors.hero.talent.longrange_warp.title=Fernteleportation
actors.hero.talent.longrange_warp.desc=_+1:_ Der Magier kann jetzt mit _150% Ladungskosten_ zwischen Ebenen teleportieren.\n\n_+2:_ Der Magier kann jetzt mit _117% Ladungskosten_ zwischen Ebenen teleportieren.\n\n_+3:_ Der Magier kann jetzt mit _83% Ladungskosten_ zwischen Ebenen teleportieren.\n\n_+4:_ Der Magier kann jetzt mit _50% Ladungskosten_ zwischen Ebenen teleportieren.\n\nDer Magier kann die Fernteleportation nicht nutzen, um abgeschlossene Ebenen zu verlassen.

#rogue
actors.hero.talent.cached_rations.title=versteckte Essensrationen
actors.hero.talent.cached_rations.desc=_+1:_ Der Schurke kann _2 Versorgungsrationen_ in Truhen finden, während er die nächsten Ebenen des Dungeons erforscht.\n\n_+2:_ Der Schurke kann _3 kleine Versorgungsrationen_ in Truhen finden, während er die nächsten Ebenen des Dungeons erforscht.\n\nVersorgungsrationen sind schnell gegessen, durch sie wird man mäßig gesättigt, sie heilen 5 Lebenspunkte und laden den Umhang der Schatten um 1 auf.
actors.hero.talent.thiefs_intuition.title=Intuition des Diebes
actors.hero.talent.thiefs_intuition.desc=_+1:_ Der Schurke identifiziert Ringe _2x schneller_ und identifiziert den Typ eines Ringes, _sobald er ihn ausrüstet_.\n\n_+2:_ Der Schurke identifiziert Ringe, _sobald er sie ausrüstet_, und identifiziert den Typ eines Ringes, _sobald er ihn aufhebt_.
actors.hero.talent.sucker_punch.title=Überraschungsschlag
actors.hero.talent.sucker_punch.desc=_+1:_ Der Schurke fügt einem Feind beim ersten Überraschungsangriff _1-2 Punkte zusätzlichen Schadens_ zu.\n\n_+2:_ Der Schurke fügt einem Feind beim ersten Überraschungsangriff _2 Punkte zusätzlichen Schadens_ zu.
actors.hero.talent.protective_shadows.title=schützende Schatten
actors.hero.talent.protective_shadows.desc=_+1:_ Der Schurke erhält _aller zwei Züge_, in denen er unsichtbar ist, einen Schildpunkt, _maximal 3_.\n\n_+2:_ Der Schurke erhält _jeden Zug_, in dem er unsichtbar ist, einen Schildpunkt, _maximal 5_.

actors.hero.talent.mystical_meal.title=mystische Mahlzeit
actors.hero.talent.mystical_meal.desc=_+1:_ Das Essen von Nahrung dauert für den Schurken einen Zug (Versorgungsrationen werden sofort gegessen) und gewährt ihm _3 Züge mit Artefakt-Aufladung_.\n\n_+2:_ Das Essen von Nahrung dauert für den Schurken einen Zug (Versorgungsrationen werden sofort gegessen) und gewährt ihm _5 Züge mit Artefakt-Aufladung_.\n\nDieses Talent kann nicht dazu eingesetzt werden, dass sich das Horn des Überflusses selbst auflädt.
actors.hero.talent.inscribed_stealth.title=niedergeschriebene Unsichtbarkeit
actors.hero.talent.inscribed_stealth.desc=_+1:_ Der Schurke erhält _3 Züge_ Unsichtbarkeit, nachdem er eine Schriftrolle gelesen oder einen Zaubergegenstand benutzt hat.\n\n_+2:_ Der Schurke erhält _5 Züge_ Unsichtbarkeit, nachdem er eine Schriftrolle gelesen oder einen Zaubergegenstand benutzt hat.\n\nDie Dauer der Unsichtbarkeit verdoppelt sich bei Verwendung einer Schriftrolle der Verbesserung, einer Schriftrolle der Umwandlung oder von Alchemiegegenständen, die mit diesen Schriftrollen hergestellt worden sind.\n\nBei Alchemiegegenständen mit höheren Produktionsmengen (z. B. den meisten Zaubern) besteht eine Chance, dass dieses Talent ausgelöst wird, abhängig von der Menge des hergestellten Gegenstands.
actors.hero.talent.wide_search.title=großangelegte Suche
actors.hero.talent.wide_search.desc=_+1:_ Der Suchradius des Schurken wird von einem 5x5 Felder großen Bereich zu einem _7x7 Felder großen Kreis_ erweitert.\n\n_+2:_ Der Suchradius des Schurken wird von einem 5x5 Felder großen Bereich zu einem _7x7 Felder großen Bereich_ erweitert..
actors.hero.talent.wide_search.meta_desc=_Wenn dieses Talent durch einen anderen Helden erworben wird_, wird es seinen Suchradius stattdessen von einem 3x3-Quadrat bei +1 zu einem 5x5-Kreis, bei +2 zu einem 5x5-Quadrat erweitern.
actors.hero.talent.silent_steps.title=leise Schritte
actors.hero.talent.silent_steps.desc=_+1:_ Der Schurke weckt keine schlafenden Feinde, solange er _3 oder mehr Felder entfernt_ ist.\n\n_+2:_ Der Schurke weckt keine schlafenden Feinde, solange er _nicht direkt neben ihnen_ steht.
actors.hero.talent.rogues_foresight.title=Vorhersehung des Schurken
actors.hero.talent.rogues_foresight.desc=_+1:_ Wenn sich der Schurke auf einer Ebene mit einem geheimen Raum befindet, hat er eine _75% Chance zu bemerken_, dass die Ebene ein Geheimnis birgt.\n\n_+2:_ Wenn sich der Schurke auf einer Ebene mit einem geheimen Raum befindet, hat er eine _100% Chance zu bemerken_, dass die Ebene ein Geheimnis birgt.

actors.hero.talent.light_cloak.title=leichter Umhang
actors.hero.talent.light_cloak.desc=_+1:_ Der Schurke kann seinen Umhang der Schatten auch verwenden, wenn er nicht ausgerüstet ist, jedoch lädt er sich mit _25% Geschwindigkeit_ auf, wenn er nicht ausgerüstet ist.\n\n_+2:_ Der Schurke kann seinen Umhang der Schatten auch verwenden, wenn er nicht ausgerüstet ist, jedoch lädt er sich mit _50% Geschwindigkeit_ auf, wenn er nicht ausgerüstet ist.\n\n_+3:_ Der Schurke kann seinen Umhang der Schatten auch verwenden, wenn er nicht ausgerüstet ist, jedoch lädt er sich mit _75% Geschwindigkeit_ auf, wenn er nicht ausgerüstet ist.
actors.hero.talent.light_cloak.meta_desc=_Wenn dieses Talent durch einen anderen Helden erworben wird_, wird es stattdessen die Geschwindigkeit der Aufladung aller Artefakte um 7/13/20% bei je +1/+2/+3 erhöhen.
actors.hero.talent.enhanced_rings.title=verbesserte Ringe
actors.hero.talent.enhanced_rings.desc=_+1:_ Wenn der Schurke ein Artefakt verwendet, erhalten seine Ringe _3 Züge lang_ eine Verbesserung um +1.\n\n_+2:_ Wenn der Schurke ein Artefakt verwendet, erhalten seine Ringe _6 Züge lang_ eine Verbesserung um +1.\n\n_+3:_ Wenn der Schurke ein Artefakt verwendet, erhalten seine Ringe _9 Züge lang_ eine Verbesserung um +1.

actors.hero.talent.enhanced_lethality.title=verbesserte Sterblichkeit
actors.hero.talent.enhanced_lethality.desc=_+1:_ Der Attentäter kann Gegner, die weniger als _4/13/27/67% Lebenspunkte_ pro Level der Vorbereitung haben, meucheln, statt solche mit weniger als 3/10/20/50%.\n\n_+2:_ Der Attentäter kann Gegner, die weniger als _5/17/33/83% Lebenspunkte_ pro Level der Vorbereitung haben, meucheln, statt solche mit weniger als 3/10/20/50%.\n\n_+3:_ Der Attentäter kann Gegner, die weniger als _6/20/40/100% Lebenspunkte_ pro Level der Vorbereitung haben, meucheln, statt solche mit weniger als 3/10/20/50%.
actors.hero.talent.assassins_reach.title=Reichweite des Attentäters
actors.hero.talent.assassins_reach.desc=_+1:_ Die Teleportreichweite des Attentäters pro Vorbereitungsstufe wird von 1/2/3/4 auf _1/3/4/6 Felder_ erhöht.\n\n_+2:_ Die Teleportreichweite des Attentäters pro Vorbereitungsstufe wird von 1/2/3/4 auf _2/4/6/8 Felder_ erhöht.\n\n_+3:_ Die Teleportreichweite des Attentäters pro Vorbereitungsstufe wird von 1/2/3/4 auf _2/5/7/10 Felder_ erhöht.\n\nDie Teleportation kann durch Gefahren und Gegner gehen, aber nicht durch festes Gelände wie Mauern.
actors.hero.talent.bounty_hunter.title=Kopfgeldjäger
actors.hero.talent.bounty_hunter.desc=_+1:_ Wenn der Attentäter einen Gegner mit einem vorbereiteten Angriff tötet, erhöht sich die Chance, dass der Gegner Gegenstände fallen lässt, um _2/4/8/16%_ pro Stufe der Vorbereitung.\n\n_+2:_ Wenn der Attentäter einen Gegner mit einem vorbereiteten Angriff tötet, erhöht sich die Chance, dass der Gegner Gegenstände fallen lässt, um _4/8/16/32%_ pro Stufe der Vorbereitung.\n\n_+3:_ Wenn der Attentäter einen Gegner mit einem vorbereiteten Angriff tötet, erhöht sich die Chance, dass der Gegner Gegenstände fallen lässt, um _6/12/24/48%_ pro Stufe der Vorbereitung.

actors.hero.talent.evasive_armor.title=ausweichende Rüstung
actors.hero.talent.evasive_armor.desc=_+1:_ Beim Freilaufen erhält der Freiläufer zusätzlich _+1 Ausweichen_ pro bezüglich seiner Rüstung überschüssigem Stärkepunkt.\n\n_+2:_ Beim Freilaufen erhält der Freiläufer zusätzlich _+2 Ausweichen_ pro bezüglich seiner Rüstung überschüssigem Stärkepunkt.\n\n_+3:_ Beim Freilaufen erhält der Freiläufer zusätzlich _+3 Ausweichen_ pro bezüglich seiner Rüstung überschüssigem Stärkepunkt.
actors.hero.talent.projectile_momentum.title=Projektilschwung
actors.hero.talent.projectile_momentum.desc=_+1:_ Beim Freilaufen erhält der Freiläufer _+50% Genauigkeit und +15% Schaden_ mit Wurfwaffen.\n\n_+2:_ Beim Freilaufen erhält der Freiläufer _+100% Genauigkeit und +30% Schaden_ mit Wurfwaffen.\n\n_+3:_ Beim Freilaufen erhält der Freiläufer _+150% Genauigkeit und +45% Schaden_ mit Wurfwaffen.
actors.hero.talent.speedy_stealth.title=schnelle Heimlichkeit
actors.hero.talent.speedy_stealth.desc=_+1:_ Der Freiläufer erhält pro Zug 2 Stöße Schwung, solange er unsichtbar ist.\n\n_+2:_ Zusätzlich zu den Vorteilen von +1 zählt Freilaufen nicht mehr herunter, solange der Freiläufer unsichtbar ist.\n\n_+3:_ Zusätzlich zu den Vorteilen von +1 und +2 bewegt sich der Freiläufer mit 2-facher Geschwindigkeit, wenn er unsichtbar ist, egal ob er frei läuft oder nicht.

actors.hero.talent.hasty_retreat.title=hastiger Rückzug
actors.hero.talent.hasty_retreat.desc=_+1:_ Nach dem Teleportieren erhält der Schurke _1 Zug_ Eile und Unsichtbarkeit.\n\n_+2:_ Nach dem Teleportieren erhält der Schurke _2 Züge_ Eile und Unsichtbarkeit.\n\n_+3:_ Nach dem Teleportieren erhält der Schurke _3 Züge_ Eile und Unsichtbarkeit.\n\n_+4:_ Nach dem Teleportieren erhält der Schurke _4 Züge_ Eile und Unsichtbarkeit.
actors.hero.talent.body_replacement.title=Körperersatz
actors.hero.talent.body_replacement.desc=_+1:_ Nach dem Teleportieren hinterlässt der Schurke einen hölzernen Köder, der _20 Gesundheit und 1-3 Rüstung_ hat.\n\n_+2:_ Nach dem Teleportieren lässt der Schurke einen hölzernen Lockvogel zurück, der _40 Lebenspunkte und 2-6 Rüstung_ hat.\n\n_+3:_ Nach dem Teleportieren lässt der Schurke einen hölzernen Lockvogel zurück, der _60 Lebenspunkte und 3-9 Rüstung_ hat.\n\n_+4:_ Nach dem Teleportieren lässt der Schurke einen hölzernen Köder zurück, der _80 Lebenspunkte und 4-12 Rüstung_ hat.\n\nEs kann jeweils nur ein Köder aktiv sein.
actors.hero.talent.shadow_step.title=Schattenschritt
actors.hero.talent.shadow_step.desc=_+1:_ Wenn der Schurke eine Rauchbombe einsetzt, während er unsichtbar ist, tritt sie sofort ein und hat um _16% reduzierte_ Aufladekosten, aber sie blendet auch keine Gegner und löst keine anderen Talente aus.\n\n_+2:_ Wenn der Schurke eine Rauchbombe einsetzt, während er unsichtbar ist, tritt sie sofort ein und hat um _30% reduzierte_ Aufladekosten, aber sie blendet auch keine Gegner und löst keine anderen Talente aus.\n\n_+3:_ Wenn der Schurke eine Rauchbombe einsetzt, während er unsichtbar tritt sie sofort ein und hat um _41% reduzierte_ Aufladekosten, aber sie blendet auch keine Gegner und löst keine anderen Talente aus.\n\n_+4:_ Wenn der Schurke eine Rauchbombe einsetzt, während er unsichtbar ist, tritt sie sofort ein und hat um _50% reduzierte_ Aufladekosten, aber sie blendet auch keine Gegner und löst keine anderen Talente aus.

actors.hero.talent.fear_the_reaper.title=fürchte den Sensenmann
actors.hero.talent.fear_the_reaper.desc=_+1:_ Wenn zum Tod markierte Gegner 0 LP erreichen, werden sie _verkrüppelt_.\n\n_+2:_ Wenn zum Tod markierte Gegner 0 LP erreichen, werden sie _verängstigt und verkrüppelt_.\n\n_+3:_ Wenn zum Tod markierte Gegner 0 LP erreichen, werden sie _verängstigt und verkrüppelt_ und Gegner im Radius von 3 Feldern werden _verkrüppelt_.\n\n_+4:_ Wenn zum Tod markierte Gegner 0 LP erreichen, werden sie _verängstigt und verkrüppelt_ und Gegner im Radius von 3 Feldern werden _verängstigt und verkrüppelt_.
actors.hero.talent.deathly_durability.title=tödliche Haltbarkeit
actors.hero.talent.deathly_durability.desc=_+1:_ Gegner, die durch Todesmarkierung getötet wurden, geben dem Schurken einen Schild in Höhe von _13%_ ihrer LP, die sie besaßen, als sie markiert wurden.\n\n_+2:_ Gegner, die durch Todesmarkierung getötet wurden geben dem Schurken einen Schild in Höhe von _25%_ ihrer LP, die sie besaßen, als sie markiert wurden.\n\n_+3:_ Gegner, die durch Todesmarkierung getötet wurden geben dem Schurken einen Schild in Höhe von _38%_ ihrer LP, die sie besaßen, als sie markiert wurden.\n\n_+4:_ Gegner, die durch Todesmarkierung getötet wurden geben dem Schurken einen Schild in Höhe von _50%_ ihrer LP, die sie besaßen, als sie markiert wurden.
actors.hero.talent.double_mark.title=Doppelmarkierung
actors.hero.talent.double_mark.desc=_+1:_ Das Markieren eines zweiten Ziels zur gleichen Zeit wie das erste hat _30% reduzierte_ Ladekosten.\n\n_+2:_ Das Markieren eines zweiten Ziels zur gleichen Zeit wie das erste hat _50% reduzierte_ Ladekosten.\n\n_+3:_ Das Markieren eines zweiten Ziels zur gleichen Zeit wie das erste hat _65% reduzierte_ Ladekosten.\n\n_+4:_ Das Markieren eines zweiten Ziels zur gleichen Zeit wie das erste hat _75% reduzierte_ Ladekosten.

actors.hero.talent.shadow_blade.title=Schattenklinge
actors.hero.talent.shadow_blade.desc=_+1:_ Der Schattenklon erhält _8%_ des Schadens des Helden pro Zug und hat eine Chance von _25%_, die Verzauberung auf der Waffe des Helden zu verwenden.\n\n_+2:_ Der Schattenklon erhält _16%_ des Schadens des Helden pro Zug und hat eine Chance von _50%_, die Verzauberung auf der Waffe des Helden anzuwenden.\n\n_+3:_ Der Schattenklon erhält _24%_ des Schadens des Helden pro Zug und hat eine Chance von _75%_, die Verzauberung auf der Waffe des Helden anzuwenden.\n\n_+4:_ Der Schattenklon erhält _32%_ des Schadens des Helden pro Zug und hat eine Chance von _100%_, die Verzauberung auf der Waffe des Helden anzuwenden.
actors.hero.talent.cloned_armor.title=geklonte Rüstung
actors.hero.talent.cloned_armor.desc=_+1:_ Der Schattenklon erhält _12%_ des Rüstungswerts des Helden und hat eine Chance von _25%_, die Glyphe auf der Rüstung des Helden zu verwenden.\n\n_+2:_ Der Schattenklon erhält _24%_ des Rüstungswerts des Helden und hat eine Chance von _50%_, die Glyphe auf der Rüstung des Helden zu verwenden.\n\n_+3:_ Der Schattenklon erhält _36%_ des Rüstungswerts des Helden und hat eine Chance von _75%_, die Glyphe auf der Rüstung des Helden zu verwenden.\n\n_+4:_ Der Schattenklon erhält _48%_ des Rüstungswerts des Helden und hat eine Chance von _100%_, die Glyphe auf die Rüstung des Helden zu verwenden.
actors.hero.talent.perfect_copy.title=perfekte Kopie
actors.hero.talent.perfect_copy.desc=_+1:_ Der Schattenklon erhält _10%_ der maximalen LP des Helden und kann sofort mit dem Helden bis zu _1 Feld_ entfernt die Plätze tauschen.\n\n_+2:_ Der Schattenklon erhält _20%_ der maximalen LP des Helden und kann sofort mit dem Helden bis zu _2 Felder_ entfernt Plätze tauschen.\n\n_+3:_ Der Schattenklon erhält _30%_ der maximalen LP des Helden und kann sofort mit dem Helden bis zu _3 Felder_ entfernt Plätze tauschen.\n\n_+4:_ Der Schattenklon erhält _40%_ der maximalen LP des Helden und kann sofort mit dem Helden bis zu _4 Felder_ entfernt Plätze tauschen.

#huntress
actors.hero.talent.natures_bounty.title=Fülle der Natur
actors.hero.talent.natures_bounty.desc=_+1:_ Die Jägerin kann _4 Beeren_ finden, die im hohen Gras versteckt sind, während sie die nächsten Stockwerke des Dungeons erkundet.\n\n_+2:_ Die Jägerin kann _6 Beeren_ finden, die im hohen Gras versteckt sind, während sie die nächsten Stockwerke des Dungeons erkundet.\n\nBeeren werden schnell gegessen, stellen ein wenig Sättigung wieder her und könnten einen verwendbaren Samen enthalten.
actors.hero.talent.survivalists_intuition.title=Intuition der Überlebenskünstlerin
actors.hero.talent.survivalists_intuition.desc=_+1:_ Die Jägerin identifiziert Wurfwaffen _3 mal schneller_.\n\n_+2:_ Die Jägerin identifiziert Wurfwaffen _wenn sie damit trifft_.
actors.hero.talent.followup_strike.title=Anschlusstreffer
actors.hero.talent.followup_strike.desc=_+1:_ Wenn die Jägerin einen Feind mit ihrem Bogen oder einer Wurfwaffe trifft, verursacht ihr nächster Nahkampfangriff gegen diesen Feind _2 Bonusschaden_.\n\n_+2:_ Wenn die Jägerin einen Feind mit ihrem Bogen oder einer Wurfwaffe trifft, verursacht ihr nächster Nahkampfangriff gegen diesen Feind _3 Bonusschaden_.
actors.hero.talent.natures_aid.title=Hilfe der Natur
actors.hero.talent.natures_aid.desc=_+1:_ Die Jägerin erhält eine Rindenhaut-Rüstung im Wert von 0-2, die alle _3 Züge_ nachlässt, wenn der Effekt einer Pflanze in ihrem Sichtfeld aktiviert wird.\n\n_+2:_ Die Jägerin erhält eine Rindenhaut-Rüstung im Wert von 0-2, die alle _5 Züge_ nachlässt, wenn der Effekt einer Pflanze in ihrem Sichtfeld aktiviert wird.

actors.hero.talent.invigorating_meal.title=stärkende Mahlzeit
actors.hero.talent.invigorating_meal.desc=_+1:_ Das Essen von Nahrung benötigt bei der Jägerin 1 Zug (Beeren werden sofort verspeist) und gewährt ihr _1 Zug Eile_.\n\n_+2:_ Das Essen von Nahrung benötigt bei der Jägerin 1 Zug (Beeren werden sofort verspeist) und gewährt ihr _2 Züge Eile_.
actors.hero.talent.liquid_nature.title=flüssige Natur
actors.hero.talent.liquid_nature.desc=_+1:_ Wenn die Jägerin einen Trank, ein Gebräu oder Elixier trinkt oder wirft, sprießt _Gras auf bis zu 4 Feldern_ in der Umgebung, und benachbarte Feinde werden _1 Zug lang_ verwurzelt.\n\n_+2:_ Wenn die Jägerin einen Trank, ein Gebräu oder Elixier trinkt oder wirft, sprießt _Gras auf bis zu 6 Feldern_ in der Umgebung, und benachbarte Feinde werden _2 Züge lang_ verwurzelt.\n\nDie Menge des Grases und die Dauer der Verwurzelung verdoppeln sich, wenn ein Trank der Stärke, der Erfahrung, oder alchemische Gegenstände, die aus diesen gewonnen wurden, verwendet werden.\n\nBei alchemischen Gegenständen mit größerer Ausgabemenge (z.B. Aqua-Gebräu) kann dieses Talent, abhängig davon, wieviel dieses Gegenstands hergestellt wurde, ausgelöst werden.
actors.hero.talent.rejuvenating_steps.title=Schritte der Verjüngung
actors.hero.talent.rejuvenating_steps.desc=_+1:_ Wenn die Jägerin auf kurzes Gras oder Asche tritt, sprießt hohes Gras, das die Jägerin sofort zerfurcht. Dies hat eine Abklingzeit von _10 Zügen_.\n\n_+2:_ Wenn die Jägerin auf kurzes Gras oder Asche tritt, sprießt hohes Gras, das die Jägerin sofort zerfurcht. Dies hat eine Abklingzeit von _5 Zügen_.\n\nDieses Talent erzeugt zerfurchtes Gras, wenn passive Regenerationseffekte deaktiviert sind oder der Held längere Zeit keine Erfahrung gesammelt hat.
actors.hero.talent.heightened_senses.title=geschärfte Sinne
actors.hero.talent.heightened_senses.desc=_+1:_ Die Jägerin erhält Übersinnliche Wahrnehmung auf Charaktere innerhalb von _2 Feldern um ihre Position_.\n\n_+2:_ Die Jägerin erhält Übersinnliche Wahrnehmung auf Charaktere innerhalb von _3 Feldern um ihre Position_.
actors.hero.talent.durable_projectiles.title=haltbare Wurfgeschosse
actors.hero.talent.durable_projectiles.desc=_+1:_ Von der Jägerin verwendete Wurfwaffen haben _+50% Haltbarkeit_.\n\n_+2:_ Von der Jägerin verwendete Wurfwaffen haben _+75% Haltbarkeit_.

actors.hero.talent.point_blank.title=aus nächster Nähe
actors.hero.talent.point_blank.desc=_+1:_ Wenn die Jägerin ihren Bogen oder eine Wurfwaffe im Nahkampf verwendet, hat sie _-25% Genauigkeit,_ statt -50%.\n\n_+2:_ Wenn die Jägerin ihren Bogen oder eine Wurfwaffe im Nahkampf verwendet, hat sie _normale Genauigkeit,_ statt -50%.\n\n_+3:_ Wenn die Jägerin ihren Bogen oder eine Wurfwaffe im Nahkampf verwendet, hat sie _+25% Genauigkeit,_ statt -50%.\n\nBeachte, dass Wurfwaffen oder der Seelenbogen immer +50% Genauigkeit haben, wenn sie aus der Ferne verwendet werden.
actors.hero.talent.seer_shot.title=Schuss der klaren Sicht
actors.hero.talent.seer_shot.desc=_+1:_ Wenn die Jägerin einen Pfeil auf den Boden abfeuert, gewährt er ihr _5 Züge lang_ Sicht in einem Bereich von 3x3 Feldern um diese Stelle herum. Dies hat eine Abklingzeit von 20 Zügen.\n\n_+2:_ Wenn die Jägerin einen Pfeil auf den Boden abfeuert, gewährt er ihr _10 Züge lang_ Sicht in einem Bereich von 3x3 Feldern um diese Stelle herum. Dies hat eine Abklingzeit von 20 Zügen.\n\n_+3:_ Wenn die Jägerin einen Pfeil auf den Boden abfeuert, gewährt er ihr _15 Züge lang_ Sicht in einem Bereich von 3x3 Feldern um diese Stelle herum. Dies hat eine Abklingzeit von 20 Zügen.
actors.hero.talent.seer_shot.meta_desc=_Wenn dieses Talent durch einen anderen Helden erworben wird_, wird es von einer beliebigen Wurfwaffe ausgelöst.

actors.hero.talent.farsight.title=Weitsicht
actors.hero.talent.farsight.desc=_+1:_ Die Sichtweite der Scharfschützin wird _um 25% erhöht_.\n\n_+2:_ Die Sichtweite der Scharfschützin wird _um 50% erhöht_.\n\n_+3:_ Die Sichtweite der Scharfschützin wird _um 75% erhöht_.
actors.hero.talent.shared_enchantment.title=geteilte Verzauberung
actors.hero.talent.shared_enchantment.desc=_+1:_ Wurfwaffen haben eine _33% Chance_, die Verzauberung des Scharfschützenbogens zu verwenden.\n\n_+2:_ Wurfwaffen haben eine _67% Chance_, die Verzauberung des Scharfschützenbogens zu verwenden.\n\n_+3:_ Wurfwaffen haben eine _100% Chance_, die Verzauberung des Scharfschützenbogens zu verwenden.\n\nDie Verzauberung des Bogens kann zusätzlich zu der Verzauberung der Wurfwaffe ausgelöst werden.
actors.hero.talent.shared_upgrades.title=geteilte Verbesserungen
actors.hero.talent.shared_upgrades.desc=_+1:_ Wenn die Scharfschützin mit einer verbesserten Wurfwaffe angreift, wird die Dauer der Scharfschützenmarkierung und der Schaden ihres Spezialangriffs pro Verbesserung um einen Zug und 16% erhöht, aber nur bis zu einem Maximum von __2 Zügen und +33% Schaden__.\n\n_+2:_ Wenn die Scharfschützin mit einer verbesserten Wurfwaffe angreift, wird die Dauer der Scharfschützenmarkierung und der Schaden ihres Spezialangriffs pro Verbesserung um einen Zug und 16% erhöht, aber nur bis zu einem Maximum von __4 Zügen und +67% Schaden__.\n\n_+3:_ Wenn die Scharfschützin mit einer verbesserten Wurfwaffe angreift, wird die Dauer der Scharfschützenmarkierung und der Schaden ihres Spezialangriffs pro Verbesserung um einen Zug und 16% erhöht, aber nur bis zu einem Maximum von __6 Zügen und +100% Schaden__.

actors.hero.talent.durable_tips.title=langlebige Spitzen
actors.hero.talent.durable_tips.desc=_+1:_ Präparierte Pfeile haben _2x Haltbarkeit_, wenn die Wächterin sie verwendet.\n\n_+2:_ Präparierte Pfeile haben _3x Haltbarkeit_, wenn die Wächterin sie verwendet.\n\n_+3:_ Präparierte Pfeile haben _4x Haltbarkeit_, wenn die Wächterin sie verwendet.
actors.hero.talent.barkskin.title=Rindenhaut
actors.hero.talent.barkskin.desc=_+1:_ Wenn die Wächterin ins Gras tritt, erhält sie Rindenhaut in Höhe von _0-50% ihrer Stufe_, die mit jedem Zug nachlässt.\n\n_+2:_ Wenn die Wächterin ins Gras tritt, erhält sie Rindenhaut in Höhe von _0-100% ihrer Stufe_, die mit jedem Zug nachlässt.\n\n_+3:_ Wenn die Wächterin ins Gras tritt, erhält sie Rindenhaut in Höhe von _0-150% ihrer Stufe_, die mit jedem Zug nachlässt.
actors.hero.talent.shielding_dew.title=Abschirmtau
actors.hero.talent.shielding_dew.desc=_+1:_ Tautropfen können die Wächterin schützen, wenn ihre Gesundheit voll ist, bis zu _20% ihrer maximalen LP_.\n\n_+2:_ Tautropfen können die Wächterin schützen, wenn ihre Gesundheit voll ist, bis zu _40% ihrer maximalen LP_.\n\n_+3:_ Tautropfen können die Wächterin schützen, wenn ihre Gesundheit voll ist, bis zu _60% ihrer maximalen LP_.

actors.hero.talent.fan_of_blades.title=Fächer der Klingen
actors.hero.talent.fan_of_blades.desc=_+1:_ Spektralklingen können bis zu _1 zusätzliches Ziel_ mit 50% Schaden treffen. Das Ziel muss sichtbar sein und sich innerhalb eines kegelförmigen Bereichs von _30 Grad_ befinden.\n\n_+2:_ Spektralklingen können bis zu _2 zusätzliche Ziele_ mit 50% Schaden treffen. Die Ziele müssen sichtbar sein und sich innerhalb eines kegelförmigen Bereichs von _60 Grad_ befinden.\n\n_+3:_ Spektralklingen können bis zu _3 zusätzliche Ziele_ mit 50% Schaden treffen. Die Ziele müssen sichtbar sein und sich innerhalb eines kegelförmigen Bereichs von _90 Grad_ befinden.\n\n_+4:_ Spektralklingen können bis zu _4 zusätzliche Ziele_ mit 50% Schaden treffen. Die Ziele müssen sichtbar sein und sich innerhalb eines kegelförmigen Bereichs von _120 Grad_ befinden.
actors.hero.talent.projecting_blades.title=projizierende Klingen
actors.hero.talent.projecting_blades.desc=_+1:_ Spektralklingen haben _+25% Genauigkeit_ und können bis zu _2 feste Felder_ durchdringen.\n\n_+2:_ Spektralklingen haben _+50% Genauigkeit_ und können bis zu _4 feste Felder_ durchdringen.\n\n_+3:_ Spektralklingen haben _+75% Genauigkeit_ und können bis zu _6 feste Felder_ durchdringen.\n\n_+4:_ Spektralklingen haben _+100% Genauigkeit_ und können bis zu _8 feste Felder_ durchdringen.
actors.hero.talent.spirit_blades.title=Geisterklingen
actors.hero.talent.spirit_blades.desc=_+1:_ Spektralklingen haben eine Chance von _30%_, die Verzauberung auch auf den Geisterbogen anzuwenden.\n\n_+2:_ Spektralklingen haben eine Chance von _60%_, die Verzauberung auch auf den Geisterbogen anzuwenden.\n\n_+3:_ Spektralklingen haben eine Chance von _90%_, die Verzauberung auch auf den Geisterbogen anzuwenden.\n\n_+4:_ Spektralklingen haben eine Chance von _100%_, die Verzauberung auch auf den Geisterbogen anzuwenden, und verleiht jeder Verzauberung _10% mehr Kraft_.

actors.hero.talent.growing_power.title=wachsende Kraft
actors.hero.talent.growing_power.desc=_+1:_ Die Erhöhung der Angriffs- und Bewegungsgeschwindigkeit durch die Kraft der Natur beträgt statt je 33% und 100% nun _38% und 125%_.\n\n_+2:_ Die Erhöhung der Angriffs- und Bewegungsgeschwindigkeit durch die Kraft der Natur beträgt statt je 33% und 100% nun _42% und 150%_.\n\n_+3:_ Die Erhöhung der Angriffs- und Bewegungsgeschwindigkeit durch die Kraft der Natur beträgt statt je 33% und 100% nun _46% und 175%_.\n\n_+4:_ Die Erhöhung der Angriffs- und Bewegungsgeschwindigkeit durch die Kraft der Natur beträgt statt je 33% und 100% nun _50% und 200%_.
actors.hero.talent.natures_wrath.title=Zorn der Natur
actors.hero.talent.natures_wrath.desc=_+1:_ Solange die Naturkraft aktiv ist, haben Schüsse aus dem Geisterbogen eine Chance von _8%_, einen zufälligen schädlichen Pflanzeneffekt auszulösen.\n\n_+2:_ Solange die Naturkraft aktiv ist, haben Schüsse aus dem Geisterbogen eine Chance von _17%_, einen zufälligen schädlichen Pflanzeneffekt auszulösen.\n\n_+3:_ Solange die Naturkraft aktiv ist, haben Schüsse aus dem Geisterbogen eine _25% Chance_, einen zufälligen schädlichen Pflanzeneffekt auszulösen.\n\n_+4:_ Solange die Naturkraft aktiv ist, haben Schüsse aus dem Geisterbogen eine _33% Chance_, einen zufälligen schädlichen Pflanzeneffekt auszulösen.\n\nDie Pflanzen, deren Effekte ausgelöst werden können, sind: Blindkraut, Feuerblüte, Eiskappe, Trauermoos und Sturmranke.
actors.hero.talent.wild_momentum.title=wilder Schwung
actors.hero.talent.wild_momentum.desc=_+1:_ Das Töten eines Feindes mit dem Geisterbogen verlängert die Wirkungsdauer der Naturkraft um _1 Zug_. Die Dauer kann um maximal _2 Züge_ verlängert werden.\n\n_+2:_ Das Töten eines Feindes mit dem Geisterbogen verlängert die Wirkungsdauer der Naturkraft um _2 Züge_. Die Dauer kann um max. _4 Züge_ verlängert werden.\n\n_+3:_ Das Töten eines Feindes mit dem Geisterbogen verlängert die Wirkungsdauer der Naturkraft um _3 Züge_. Die Dauer kann um maximal _6 Züge_ verlängert werden.\n\n_+4:_ Das Töten eines Feindes mit dem Geisterbogen verlängert die Wirkungsdauer der Naturkraft um _4 Züge_. Die Dauer kann um maximal _8 Züge_ verlängert werden.

actors.hero.talent.eagle_eye.title=Adlerauge
actors.hero.talent.eagle_eye.desc=_+1:_ Die Sichtweite des Geisterfalken wird von 6 auf _7 Felder_ erhöht.\n\n_+2:_ Die Sichtweite des Geisterfalken wird von 6 auf _8 Felder_ erhöht.\n\n_+3:_ Die Sichtweite des Geisterfalken wird von 6 auf _9 Felder_ erhöht und er erhält _2 Felder_ Gedankensicht.\n\n_+4:_ Die Sichtweite des Geisterfalken wird von 6 auf _10 Felder_ erhöht und er erhält _3 Felder_ Gedankensicht.
actors.hero.talent.go_for_the_eyes.title=hol dir die Augen
actors.hero.talent.go_for_the_eyes.desc=_+1:_ Angriffe des Geisterfalken blenden Feinde _2 Züge lang_.\n\n_+2:_ Angriffe des Geisterfalken blenden Gegner _5 Züge lang_.\n\n_+3:_ Angriffe des Geisterfalken blenden Gegner _5 Züge lang_ und verkrüppeln ihn für _2 Züge_.\n\n_+4:_ Angriffe des Geisterfalken blenden Gegner _5 Züge lang_ und verkrüppeln ihn für _5 Züge_.
actors.hero.talent.swift_spirit.title=flinker Geist
actors.hero.talent.swift_spirit.desc=_+1:_ Die Bewegungsgeschwindigkeit des Geisterfalken wird von 2 auf _2,5 Felder_ erhöht, und er weicht garantiert den ersten _2 Angriffen_ aus, die gegen ihn geführt werden.\n\n_+2:_ Die Bewegungsgeschwindigkeit des Geisterfalken wird von 2 auf _3 Felder_ erhöht und er weicht garantiert den ersten _4 Angriffen_ aus, die gegen ihn geführt werden.\n\n_+3:_ Die Bewegungsgeschwindigkeit des Geisterfalken wird von 2 auf _3,5 Felder_ erhöht und er weicht garantiert den ersten _6 Angriffen_ aus, die gegen ihn geführt werden.\n\n_+4:_ Die Bewegungsgeschwindigkeit des Geisterfalken wird von 2 auf _4 Felder_ erhöht und er weicht garantiert den ersten _8 Angriffen_ aus, die gegen ihn geführt werden.

#duelist
actors.hero.talent.strengthening_meal.title=kräftigende Mahlzeit
actors.hero.talent.strengthening_meal.desc=_+1:_ Verzehren von Nahrung gewährt der Zweikämpferin 3 Punkte Bonus-Schaden bei ihren nächsten _2 Angriffen_, bei denen sie einem Gegner physischen Schaden zufügt.\n\n_+2:_ Verzehren von Nahrung gewährt der Zweikämpferin 3 Punkte Bonus-Schaden bei ihren nächsten _3 Angriffen_, bei denen sie einem Gegner physischen Schaden zufügt
actors.hero.talent.adventurers_intuition.title=Intuition des Abenteurers
actors.hero.talent.adventurers_intuition.desc=_+1:_ Die Zweikämpferin identifiziert Waffen _2,5x schneller_ und Rüstungen _1,75x schneller_.\n\n_+2:_ Die Zweikämpferin identifiziert Waffen _sobald sie diese ausrüstet_ und Rüstungen _2,5x schneller_.
actors.hero.talent.patient_strike.title=geduldiger Schlag
actors.hero.talent.patient_strike.desc=_+1:_ Wenn die Zweikämpferin wartet, bevor sie einen Nahkampfangriff ausführt, wird sie damit _1-2 Punkte Bonus-Schaden_ zufügen.\n\n_+2:_ Wenn die Zweikämpferin wartet, bevor sie einen Nahkampfangriff ausführt, wird sie damit _2 Punkte Bonus-Schaden_ zufügen.
actors.hero.talent.aggressive_barrier.title=aggressive Barriere
actors.hero.talent.aggressive_barrier.desc=_+1:_ Die Zweikämpferin erhält _3 Schildpunkte_, wenn sie eine Waffenfähigkeit einsetzt und weniger als _50% Lebenspunkte_ hat.\n\n_+2:_ Die Zweikämpferin erhält _5 Schildpunkte_, wenn sie eine Waffenfähigkeit einsetzt und weniger als _50% Lebenspunkte_ hat.
actors.hero.talent.aggressive_barrier.meta_desc=_Wenn dieses Talent durch einen anderen Helden gewonnen wird_, verleiht es stattdessen eine Abschirmung bei Nahkampfangriffen mit niedrigen Lebenspunkten, mit einer Abklingzeit von 50 Zügen.

actors.hero.talent.focused_meal.title=fokussierte Mahlzeit
actors.hero.talent.focused_meal.desc=_+1:_ Das Essen von Nahrung dauert für die Zweikämpferin 1 Zug und gewährt ihr _0,67 Ladung_ auf ihre Waffen.\n\n_+2:_ Das Essen von Nahrung dauert für die Zweikämpferin 1 Zug und gewährt ihr _1 Ladung_ auf ihre Waffen.
actors.hero.talent.focused_meal.meta_desc=_Wenn dieses Talent von einem anderen Helden erlangt wird,_ verleiht es stattdessen dem nächsten Treffer Bonusschaden in Höhe seiner Stufe/3 bei +1 oder Stufe/2 bei +2.
actors.hero.talent.liquid_agility.title=flüssige Wendigkeit
actors.hero.talent.liquid_agility.desc=_+1:_ Beim Trinken oder Werfen eines Tranks, Gebräus oder Elixiers hat die Zweikämpferin _3x Ausweichfähigkeit_ und _3x Genauigkeit_ bei ihrem nächsten Nahkampfangriff innerhalb von 5 Zügen.\n\n_+2:_ Beim Trinken oder Werfen eines Tranks, Gebräus oder Elixiers hat die Zweikämpferin _unendliche Ausweichfähigkeit_ und _unendliche Genauigkeit_ bei ihrem nächsten Nahkampfangriff innerhalb von 5 Zügen.\n\nDieser Bonus hält einen zusätzlichen Zug und einen zusätzlichen Angriff an, wenn Tränke der Stärke, Erfahrung oder alchemische Gegenstände verwendet werden, die mit diesen Tränken hergestellt werden müssen.\n\nBei alchemischen Gegenständen mit höheren Produktionsmengen (z. B. Aquagebräu) besteht eine Chance, dass dieses Talent ausgelöst wird, je nachdem, wie viele von diesem Gegenstand hergestellt werden.
actors.hero.talent.weapon_recharging.title=Waffenaufladung
actors.hero.talent.weapon_recharging.desc=_+1:_ Die Zweikämpferin erhält aller _15 Züge_ eine Waffenladung, solange ein Waffen- oder Artefakt-Aufladungseffekt anhält.\n\n_+2:_ Die Zweikämpferin erhält aller _10 Züge_ eine Waffenladung, solange ein Waffen- oder Artefakt-Aufladungseffekt anhält.
actors.hero.talent.weapon_recharging.meta_desc=_Wenn dieses Talent durch einen anderen Helden gewonnen wird_, führt es dazu, dass er beim Aufladen +5% Nahkampfschaden bei +1 verursacht, oder +7,5% Nahkampfschaden bei +2.
actors.hero.talent.lethal_haste.title=letale Eile
actors.hero.talent.lethal_haste.desc=_+1:_ Trifft die Zweikämpferin einen Feind mit einer Waffenfähigkeit und landet einen tödlichen Schlag, erhält sie _3 Züge_ sofortige Eile. \n\n_+2:_ Trifft die Zweikämpferin einen Feind mit einer Waffenfähigkeit und landet einen tödlichen Schlag, erhält sie _5 Züge_ sofortige Eile.
actors.hero.talent.lethal_haste.meta_desc=_Wenn dieses Talent durch einen anderen Helden gewonnen wird_, wird es stattdessen durch reguläre Angriffe mit Waffen ausgelöst, mit einer Abklingzeit von 100 Zügen.
actors.hero.talent.swift_equip.title=rasches Ausrüsten
actors.hero.talent.swift_equip.desc=_+1:_ Die Zweikämpferin kann ihre ausgerüstete Waffe _einmal_ alle 20 Züge sofort umrüsten.\n\n_+2:_ Die Zweikämpferin kann ihre ausgerüstete Waffe _zweimal_ alle 20 Züge sofort umrüsten.\n\nWenn die Zweikämpferin über dieses Talent verfügt und es sich nicht in der Abklingzeit befindet, wird die Schnellnutzung eine nicht ausgerüstete Waffe ausrüsten.

actors.hero.talent.precise_assault.title=präziser Angriff
actors.hero.talent.precise_assault.desc=_+1:_ Wenn die Zweikämpferin eine Waffenfähigkeit einsetzt, erhält sie innerhalb von 5 Zügen _zweifache Genauigkeit_ bei ihrem nächsten Nahkampfangriff.\n\n_+2:_ Wenn die Zweikämpferin eine Waffenfähigkeit einsetzt, erhält sie innerhalb von 5 Zügen _fünffache Genauigkeit_ bei ihrem nächsten Nahkampfangriff.\n\n_+3:_ Wenn die Zweikämpferin eine Waffenfähigkeit einsetzt, erhält sie innerhalb von 5 Zügen _unendliche Genauigkeit_ bei ihrem nächsten Nahkampfangriff.
actors.hero.talent.precise_assault.meta_desc=_Wenn dieses Talent von einem anderen Helden erlangt wird,_ erhöht es stattdessen die Nahkampfgenauigkeit um 10 % bei +1, 20 % bei +2 oder 30 % bei +3.
actors.hero.talent.deadly_followup.title=tödliches Nachtreten
actors.hero.talent.deadly_followup.desc=_+1:_ Wenn die Zweikämpferin einen Gegner mit einer Wurfwaffe trifft, fügt sie ihm 5 Züge lang _10% mehr Nahkampfschaden_ zu.\n\n_+2:_ Wenn die Zweikämpferin einen Gegner mit einer Wurfwaffe trifft, fügt sie ihm 5 Züge lang _20% mehr Nahkampfschaden_ zu.\n\n_+3:_ Wenn die Zweikämpferin einen Gegner mit einer Wurfwaffe trifft, fügt sie ihm 5 Züge lang _30% mehr Nahkampfschaden_ zu.

actors.hero.talent.varied_charge.title=gewechselte Ladung
actors.hero.talent.varied_charge.desc=_+1:_ Die Meisterin erhält sofort _0,17 Waffenaufladungen_, wenn sie zwei verschiedene Waffenfähigkeiten nutzt, ohne Zeitlimit.\n\n_+2:_ Die Meisterin erhält sofort _0,33 Waffenaufladungen_, wenn sie zwei verschiedene Waffenfähigkeiten nutzt, ohne Zeitlimit.\n\n_+3:_ Die Meisterin erhält sofort _0,5 Waffenaufladungen_, wenn sie zwei verschiedene Waffenfähigkeiten nutzt, ohne Zeitlimit.
actors.hero.talent.twin_upgrades.title=Zwillings-Verbesserungen
actors.hero.talent.twin_upgrades.desc=_+1:_ Ist eine der beiden ausgerüsteten Waffen der Meisterin auf einer niedrigeren Stufe und _2 oder mehr Ränge niedriger_ als die andere, wird sie auf die Stufe der anderen Waffe verbessert.\n\n_+2:_ Ist eine der beiden ausgerüsteten Waffen der Meisterin auf einer niedrigeren Stufe und _1 oder mehr Ränge niedriger_ als die andere, wird sie auf die Stufe der anderen Waffe verbessert.\n\n_+3:_ Ist eine der beiden ausgerüsteten Waffen der Meisterin auf einer niedrigeren Stufe und _auf dem gleichen oder einem niedrigeren Rang_ wie die andere, wird sie auf die Stufe der anderen Waffe verbessert.
actors.hero.talent.combined_lethality.title=kombinierte Letalität
actors.hero.talent.combined_lethality.desc=_+1:_ Nutzt die Meisterin zwei verschiedene Waffenfähigkeiten in Folge, so wird die zweite Fähigkeit jeden Gegner, der kein Boss ist, töten, sofern er _weniger als 13% seiner maximalen Lebenspunkte_ hat.\n\n_+2:_ Nutzt die Meisterin zwei verschiedene Waffenfähigkeiten in Folge, so wird die zweite Fähigkeit jeden Gegner, der kein Boss ist, töten, sofern er _weniger als 27% seiner maximalen Lebenspunkte_ hat.\n\n_+3:_ Nutzt die Meisterin zwei verschiedene Waffenfähigkeiten in Folge, so wird die zweite Fähigkeit jeden Gegner, der kein Boss ist, töten, sofern er _weniger als 40% seiner maximalen Lebenspunkte_ hat.\n\nDieser Angriff kann ein regulärer Nahkampfangriff oder Teil einer Waffenfähigkeit sein.

actors.hero.talent.unencumbered_spirit.title=Unbeschwerter Geist
actors.hero.talent.unencumbered_spirit.desc=_+1:_ Die Nonne erhält _50% mehr Energie_ für jedes Ausrüstungsteil _der Klasse 3 oder niedriger_, das sie ausgerüstet hat.\n\n_+2:_ Die Nonne erhält _75% mehr Energie_ für jedes Ausrüstungsteil _der Klasse 2 oder niedriger_, das sie ausgerüstet hat. Der Bonus der Klasse 3 bleibt unverändert.\n\n_+3:_ Die Nonne erhält _100% mehr Energie_ für jedes Ausrüstungsteil _der Klasse 1 oder niedriger_, das sie ausgerüstet hat. Der Bonus der Klasse 2 und 3 bleibt unverändert. Sie erhält außerdem eine Stoffrüstung und Kampfhandschuhe.\n\nDas Talent gewährt keinen Bonus, wenn sie keine Waffe trägt oder mit einem Ring der Kraft angreift.
actors.hero.talent.monastic_vigor.title=klösterliche Lebenskraft
actors.hero.talent.monastic_vigor.desc=_+1:_ Wenn die Nonne _100% Energie_ hat, sind ihre Fähigkeiten verstärkt.\n\n_+2:_ Wenn die Nonne _80% oder mehr Energie_ hat, sind ihre Fähigkeiten verstärkt.\n\n_+3:_ Wenn die Nonne _60% oder mehr Energie_ hat, sind ihre Fähigkeiten verstärkt.\n\nWenn die Fähigkeiten verstärkt sind:\n- Hastige Hiebe verwenden Waffenverzauberungen\n- Konzentration passiert augenblicklich\n- Sprint erhält +4 Reichweite\n- Drachentritt fügt +50% Schaden zu, schleudert alle benachbarten Feinde zurück und paralysiert sie.\n- Meditation gewährt 80% Schadensresistenz und heilt langsam 20% der fehlenden Lebenspunkte.
actors.hero.talent.combined_energy.title=kombinierte Energie
actors.hero.talent.combined_energy.desc=_+1:_ Wenn die Nonne innerhalb von 5 Zügen eine Waffenfähigkeit und eine Fähigkeit mit _4+ Energie_ einsetzt, erhält sie 1 verbrauchte Energie zurück.\n\n_+2:_ Wenn die Nonne innerhalb von 5 Zügen eine Waffenfähigkeit und eine Fähigkeit mit _3+ Energie_ einsetzt, erhält sie 1 verbrauchte Energie zurück.\n\n_+3:_ Wenn die Nonne innerhalb von 5 Zügen eine Waffenfähigkeit und eine Fähigkeit mit _2+ Energie_ einsetzt, erhält sie 1 verbrauchte Energie zurück.

actors.hero.talent.close_the_gap.title=Lückenschluss
actors.hero.talent.close_the_gap.desc=_+1:_ Die Zweikämpferin teleportiert _bis zu zwei Felder weit_ in Richtung ihres Ziels, wenn sie ein Duell beginnt.\n\n_+2:_ Die Zweikämpferin teleportiert _bis zu drei Felder weit_ in Richtung ihres Ziels, wenn sie ein Duell beginnt.\n\n_+3:_ Die Zweikämpferin teleportiert _bis zu vier Felder weit_ in Richtung ihres Ziels, wenn sie ein Duell beginnt.\n\n_+4:_ Die Zweikämpferin teleportiert _bis zu fünf Felder weit_ in Richtung ihres Ziels, wenn sie ein Duell beginnt.\n\nDie Teleportation kann durch Gefahren und Gegner gehen, aber nicht durch festes Gelände wie Mauern. Die Teleportation wird berücksichtigt, wenn bestimmt wird, ob ein Gegner für eine Herausforderung innerhalb der Reichweite ist.
actors.hero.talent.invigorating_victory.title=erfrischender Sieg
actors.hero.talent.invigorating_victory.desc=_+1:_ Wenn die Zweikämpferin ihr Ziel besiegt, bevor das Duell beendet ist, wird sie um _5 LP plus 30% des Schadens_, den sie beim Duell eingesteckt hat, geheilt.\n\n_+2:_ Wenn die Zweikämpferin ihr Ziel besiegt, bevor das Duell beendet ist, wird sie um _10 LP plus 50% des Schadens_, den sie beim Duell eingesteckt hat, geheilt.\n\n_+3:_ Wenn die Zweikämpferin ihr Ziel besiegt, bevor das Duell beendet ist, wird sie um _15 LP plus 65% des Schadens_, den sie beim Duell eingesteckt hat, geheilt.\n\n_+4:_ Wenn die Zweikämpferin ihr Ziel besiegt, bevor das Duell beendet ist, wird sie um _20 LP plus 75% des Schadens_, den sie beim Duell eingesteckt hat, geheilt.
actors.hero.talent.elimination_match.title=K.o.-Runde
actors.hero.talent.elimination_match.desc=_+1:_ Wenn die Zweikämpferin innerhalb von 3 Zügen nach Abschluss eines Duells wieder zu einem Duell herausfordert, so hat die neue Herausforderung _16% weniger_ Ladungskosten.\n\n_+2:_ Wenn die Zweikämpferin innerhalb von 3 Zügen nach Abschluss eines Duells wieder zu einem Duell herausfordert, so hat die neue Herausforderung _30% weniger_ Ladungskosten.\n\n_+3:_ Wenn die Zweikämpferin innerhalb von 3 Zügen nach Abschluss eines Duells wieder zu einem Duell herausfordert, so hat die neue Herausforderung _40% weniger_ Ladungskosten.\n\n_+4:_ Wenn die Zweikämpferin innerhalb von 3 Zügen nach Abschluss eines Duells wieder zu einem Duell herausfordert, so hat die neue Herausforderung _50% weniger_ Ladungskosten.

actors.hero.talent.elemental_reach.title=elementare Reichweite
actors.hero.talent.elemental_reach.desc=_+1:_ Die Reichweite des Elementarschlags ist von 4 auf _5 Felder_ erhöht, sein Winkel von 65 auf _75 Grad_ erweitert.\n\n_+2:_ Die Reichweite des Elementarschlags ist von 4 auf _6 Felder_ erhöht, sein Winkel von 65 auf _85 Grad_ erweitert.\n\n_+3:_ Die Reichweite des Elementarschlags ist von 4 auf _7 Felder_ erhöht, sein Winkel von 65 auf _95 Grad_ erweitert.\n\n_+4:_ Die Reichweite des Elementarschlags ist von 4 auf _8 Felder_ erhöht, sein Winkel von 65 auf _105 Grad_ erweitert.
actors.hero.talent.striking_force.title=Schlagkraft
actors.hero.talent.striking_force.desc=_+1:_ Die Wirkung eines Elementarschlagst ist um _30%_ erhöht.\n\n_+2:_ Die Wirkung eines Elementarschlagst ist um _60%_ erhöht.\n\n_+3:_ Die Wirkung eines Elementarschlagst ist um _90%_ erhöht.\n\n_+4:_ Die Wirkung eines Elementarschlagst ist um _120%_ erhöht.
actors.hero.talent.directed_power.title=gerichtete Kraft
actors.hero.talent.directed_power.desc=_+1:_ Der direkte Angriff mittels Elementarschlag wird pro Gegner in Reichweite des Effekts, einschließlich des direkten Ziels, _um 30% verstärkt_.\n\n_+2:_ Der direkte Angriff mittels Elementarschlag wird pro Gegner in Reichweite des Effekts, einschließlich des direkten Ziels, _um 60% verstärkt_.\n\n_+3:_ Der direkte Angriff mittels Elementarschlag wird pro Gegner in Reichweite des Effekts, einschließlich des direkten Ziels, _um 90% verstärkt_.\n\n_+4:_ Der direkte Angriff mittels Elementarschlag wird pro Gegner in Reichweite des Effekts, einschließlich des direkten Ziels, _um 120% verstärkt_.

actors.hero.talent.feigned_retreat.title=fingierter Rückzug
actors.hero.talent.feigned_retreat.desc=_+1:_ Wenn ein Feind das Nachbild der Zweikämpferin angreift, erhält sie _2 Züge_ Eile.\n\n_+2:_ Wenn ein Feind das Nachbild der Zweikämpferin angreift, erhält sie _4 Züge_ Eile.\n\n_+3:_ Wenn ein Feind das Nachbild der Zweikämpferin angreift, erhält sie _6 Züge_ Eile.\n\n_+4:_ Wenn ein Feind das Nachbild der Zweikämpferin angreift, erhält sie _8 Züge_ Eile.
actors.hero.talent.expose_weakness.title=Schwäche bloßstellen
actors.hero.talent.expose_weakness.desc=_+1:_ Feinde, die das Nachbild der Zweikämpferin angreifen, werden für _2 Züge_ geschwächt und verwundbar.\n\n_+2:_ Feinde, die das Nachbild der Zweikämpferin angreifen, werden für _4 Züge_ geschwächt und verwundbar.\n\n_+3:_ Feinde, die das Nachbild der Zweikämpferin angreifen, werden für _6 Züge_ geschwächt und verwundbar.\n\n_+4:_ Feinde, die das Nachbild der Zweikämpferin angreifen, werden für _8 Züge_ geschwächt und verwundbar.
actors.hero.talent.counter_ability.title=Fähigkeit kontern
actors.hero.talent.counter_ability.desc=_+1:_ Wenn die Zweikämpferin innerhalb von 3 Zügen, nachdem ihr Nachbild angegriffen wurde, eine Waffenfähigkeit einsetzt, erhält sie sofort _0,38 Ladungen_ zurück.\n\n_+2:_ Wenn die Zweikämpferin innerhalb von 3 Zügen, nachdem ihr Nachbild angegriffen wurde, eine Waffenfähigkeit einsetzt, erhält sie sofort _0,77 Ladungen_ zurück.\n\n_+3:_ Wenn die Zweikämpferin innerhalb von 3 Zügen, nachdem ihr Nachbild angegriffen wurde, eine Waffenfähigkeit einsetzt, erhält sie sofort _1,13 Ladungen_ zurück.\n\n_+4:_ Wenn die Zweikämpferin innerhalb von 3 Zügen, nachdem ihr Nachbild angegriffen wurde, eine Waffenfähigkeit einsetzt, erhält sie sofort _1,5 Ladungen_ zurück.

#cleric
actors.hero.talent.satiated_spells.title=verstärkte Zauber
actors.hero.talent.satiated_spells.desc=_+1:_ Durch Essen erhält der Kleriker _3 Abschirmung_, wenn er das nächste Mal einen Zauber wirkt.\n\n_+2:_ Durch Essen erhält der Kleriker _5 Abschirmung_, wenn er das nächste Mal einen Zauber wirkt.
actors.hero.talent.satiated_spells.meta_desc=_Wenn dieses Talent von einem anderen Helden erlangt wird_, gewährt es stattdessen sofort Abschirmung, der normalerweise nach 10 Zügen nachzulassen beginnt.
actors.hero.talent.holy_intuition.title=heilige Intuition
actors.hero.talent.holy_intuition.desc=+1: Der Kleriker kann _Heilige Intuition_ wirken, einen Zauber, der _3 Ladungen_ kostet und enthüllt, ob ein Gegenstand verflucht ist.\n\n+2: Der Kleriker kann _Heilige Intuition_ wirken, einen Zauber, der _2 Ladungen_ kostet und enthüllt, ob ein Gegenstand verflucht ist.
actors.hero.talent.holy_intuition.meta_desc=_Wenn dieses Talent von einem anderen Helden erlangt wird,_ kann der Held stattdessen den Fluchstatus eines verfluchten Gegenstands unmittelbar vor dem Ausrüsten erkennen, und zwar in 15% der Fälle bei +1 oder in 25% der Fälle bei +2.
actors.hero.talent.searing_light.title=sengendes Licht
actors.hero.talent.searing_light.desc=_+1:_ Die physischen Angriffe des Klerikers auf von _Leitlicht_ erleuchtete Gegner verursachen _+3 Schaden._\n\n_+2:_ Die physischen Angriffe des Klerikers auf von _Leitlicht_ erleuchtete Gegner verursachen _+5 Schaden._
actors.hero.talent.searing_light.meta_desc=_Wenn dieses Talent von einem anderen Helden erlangt wird,_ gewährt es stattdessen seinen Bonusschaden, nachdem ein Zauberstab oder Artefakt auf einen Feind angewendet wurde, mit einer Abklingzeit von 20 Zügen.
actors.hero.talent.shield_of_light.title=Lichtschild
actors.hero.talent.shield_of_light.desc=_+1:_ Der Kleriker kann _Lichtschild_ wirken, einen Zauber, der sofort wirkt und ihm _2–4 Rüstung_ für 5 Züge gegen ein Ziel gewährt, was 1 Ladung kostet.\n\n_+2:_ Der Kleriker kann _Lichtschild_ wirken, einen Zauber, der sofort wirkt und ihm _3–6 Rüstung_ für 5 Züge gegen ein Ziel gewährt, was 1 Ladung kostet.
actors.hero.talent.shield_of_light.meta_desc=_Wenn dieses Talent von einem anderen Helden erlangt wird,_ verringert es stattdessen den physischen Schaden, den dir dein anvisierter Feind zufügt, um 1, zu 33% der Zeit bei +1 oder zu 50% der Zeit bei +2.

actors.hero.talent.enlightening_meal.title=Erleuchtende Mahlzeit
actors.hero.talent.enlightening_meal.desc=_+1:_ Das Essen von Nahrung kostet den Kleriker _1 Zug_ und gewährt ihm _0.67 Ladung_ für seinen Heiligen Folianten.\n\n_+2:_ Das Essen von Nahrung kostet den Kleriker _1 Zug_ und gewährt ihm _1 Ladung_ für seinen Heiligen Folianten.
actors.hero.talent.enlightening_meal.meta_desc=_Wenn dieses Talent von einem anderen Helden erlangt wird,_ gewährt es stattdessen 2 Züge Zauberstab- und Artefaktaufladung bei +1 oder 3 Züge bei +2. Dies kann nicht dazu verwandt werden, das Horn des Überflusses sich selbst aufladen zu lassen.
actors.hero.talent.recall_inscription.title=Runen-Echo
actors.hero.talent.recall_inscription.refunded=Dein Gegenstand wurde erstattet!
actors.hero.talent.recall_inscription.desc=_+1:_ Der Kleriker kann _Runen-Echo_ wirken, einen Zauber, der den Effekt des letzten Runensteins oder der letzten Schriftrolle, die er in den letzten _10 Zügen_ verwendet hat, repliziert.\n\n_+2:_ Der Kleriker kann _Runen-Echo_ wirken, einen Zauber, der den Effekt des letzten Runensteins oder der letzten Schriftrolle, die er in den letzten _300 Zügen_ verwendet hat, repliziert.\n\nRunen-Echo kann nicht verwendet werden, um Schriftrollen der Verbesserung zu replizieren. Die Aufladekosten dieses Zaubers variieren je nachdem, welcher Gegenstand zuletzt verwendet wurde: 2 für einen Runenstein, 3 für eine Schriftrolle, 4 für eine exotische Schriftrolle. Diese Aufladekosten verdoppeln sich auch beim Replizieren einer Schriftrolle der Umwandlung oder von Alchemiegegenständen, die mithilfe von Umwandlung oder Verbesserung hergestellt werden müssen.
actors.hero.talent.recall_inscription.meta_desc=_Wenn dieses Talent von einem anderen Helden erlangt wird,_ werden stattdessen alle Schriftrollen und Runensteine in 10% der Fälle mit +1 und in 15% der Fälle mit +2 zurückerstattet. Schriftrollen der Verbesserung sind von diesem Effekt ausgenommen.
actors.hero.talent.sunray.title=Sonnenstrahl
actors.hero.talent.sunray.desc=_+1:_ Der Kleriker kann _Sonnenstrahl_ wirken, einen Zauber, der 4–8 Schaden verursacht und das Ziel für 4 Züge blendet. Dies kostet 1 Ladung.\n\n_+2:_ Der Kleriker kann _Sonnenstrahl_ wirken, einen Zauber, der 6–12 Schaden verursacht und das Ziel für 6 Züge blendet. Dies kostet 1 Ladung.\n\nSonnenstrahl kann jedes Ziel nur einmal blenden. Ist das Ziel bereits durch Sonnenstrahl geblendet, wird es gelähmt. Dämonischen und untoten Gegnern fügt Sonnenstrahl stets maximalen Schaden zu.
actors.hero.talent.sunray.meta_desc=_Wenn dieses Talent von einem anderen Helden erlangt wird,_ führt es stattdessen dazu, dass Zauberstäbe und Artefakte Feinde 4 Züge lang blenden, 15% der Zeit bei +1 oder 25% der Zeit bei +2.
actors.hero.talent.divine_sense.title=Göttlicher Sinn
actors.hero.talent.divine_sense.desc=_+1:_ Der Kleriker kann _Göttlicher Sinn_ wirken, einen Zauber, der ihm 50 Züge lang _8 Felder_ Übersinnliche Wahrnehmung gewährt sofort wirksam ist. Dies kostet 2 Ladungen.\n\n_+2:_ Der Kleriker kann _Göttlicher Sinn_ wirken, einen Zauber, der ihm 50 Züge lang _12 Felder_ Übersinnliche Wahrnehmung gewährt und sofort wirksam ist. Dies kostet 2 Ladungen.
actors.hero.talent.divine_sense.meta_desc=_Wenn dieses Talent von einem anderen Helden erlangt wird,_ gewährt es ihm stattdessen für einen kurzen Moment Übersinnliche Wahrnehmung, nachdem er einen Zauberstab oder ein Artefakt verwendet hat, mit einer Reichweite von 3 Feldern bei +1 oder 5 Feldern bei +2.
actors.hero.talent.bless.title=Segen
actors.hero.talent.bless.desc=_+1:_ Der Kleriker kann _Segen_ spenden, einen Zauber, der _6 Züge Segen und 10 Abschirmung_ gewährt, wenn er auf sich selbst gewirkt wird, oder _10 Züge Segen und 10 Heilung_, wenn er auf einen anderen Charakter gewirkt wird. Dies kostet 1 Ladung.\n\n_+2:_ Der Kleriker kann _Segen_ spenden, einen Zauber, der _10 Züge Segen und 15 Abschirmung_ gewährt, wenn er auf sich selbst gewirkt wird, oder _15 Züge Segen und 15 Heilung_, wenn er auf einen anderen Charakter gewirkt wird. Dies kostet 1 Ladung.\n\nÜberschüssige Heilung durch diesen Zauber wird in Abschirmung umgewandelt.
actors.hero.talent.bless.meta_desc=_Wenn dieses Talent von einem anderen Helden erlangt wird,_ erhöht es stattdessen die Genauigkeit und Ausweichfähigkeit des Helden und aller Verbündeten um 3% bei +1 oder um 5% bei +2.

actors.hero.talent.cleanse.title=Läuterung
actors.hero.talent.cleanse.desc=_+1:_ Der Kleriker kann _Läuterung_ wirken, einen Zauber, der negative Statuseffekte von ihm und seinen Verbündeten in der Nähe entfernt und ihnen _10 Abschirmung_ gewährt. Dies kostet 2 Ladungen.\n\n_+2:_ Der Kleriker kann _Läuterung_ wirken, einen Zauber, der ihm und seinen Verbündeten in der Nähe 3 Züge lang Immunität gegen negative Status gewährt und ihnen _20 Abschirmung_ gewährt. Dies kostet 2 Ladungen.\n\n_+3:_ Der Kleriker kann _Läuterung_ wirken, einen Zauber, der ihm und seinen Verbündeten in der Nähe 5 Züge lang Immunität gegen negative Status gewährt und ihnen _30 Abschirmung_ gewährt. Dies kostet 2 Ladungen.
actors.hero.talent.cleanse.meta_desc=_Wenn dieses Talent von einem anderen Helden erlangt wird,_ werden stattdessen negative Statuseffekte des Helden nach der Verwendung eines Zauberstabs oder Artefakts beseitigt, und zwar in 10/20/30% der Fälle bei +1/+2/+3.
actors.hero.talent.light_reading.title=Leichte Lektüre
actors.hero.talent.light_reading.desc=_+1:_ Der Kleriker kann seinen Heiligen Folianten auch verwenden, wenn er nicht ausgerüstet ist. Ist dies der Fall, lädt er sich allerdings nur mit _25% der Geschwindigkeit_ auf.\n\n_+2:_ Der Kleriker kann seinen Heiligen Folianten auch verwenden, wenn er nicht ausgerüstet ist. Ist dies der Fall, lädt er sich allerdings nur mit _50% der Geschwindigkeit_ auf.\n\n_+3:_ Der Kleriker kann seinen Heiligen Folianten auch verwenden, wenn er nicht ausgerüstet ist. Ist dies der Fall, lädt er sich allerdings nur mit _75% der Geschwindigkeit_ auf.
actors.hero.talent.light_reading.meta_desc=_Wenn dieses Talent von einem anderen Helden erlangt wird,_ erhöht es stattdessen die Aufladegeschwindigkeit aller Zauberstäbe um 7/13/20% bei +1/+2/+3.

actors.hero.talent.holy_lance.title=Heilige Lanze
actors.hero.talent.holy_lance.desc=_+1:_ Der Priester kann _Heilige Lanze_ wirken, einen verheerenden Zauber, der _30–55 Schaden_ verursacht und 4 Ladungen kostet.\n\n_+2:_ Der Priester kann _Heilige Lanze_ wirken, einen verheerenden Zauber, der _45–83 Schaden_ verursacht und 4 Ladungen kostet.\n\n_+3:_ Der Priester kann _Heilige Lanze_ wirken, einen verheerenden Zauber, der _60–110 Schaden_ verursacht und 4 Ladungen kostet.\n\nHeilige Lanze fügt dämonischen und untoten Gegnern immer maximalen Schaden zu. Heilige Lanze hat eine Abklingzeit von 30 Züge, bevor sie erneut gewirkt werden kann.
actors.hero.talent.hallowed_ground.title=Geheiligter Boden
actors.hero.talent.hallowed_ground.desc=_+1:_ Der Priester kann _Geheiligter Boden_ wirken, einen Zauber, der Gelände in einem _3x3-Bereich_ für 20 Züge heiligt und dafür 2 Ladungen benötigt.\n\n_+2:_ Der Priester kann _Geheiligter Boden_ wirken, einen Zauber, der Gelände in einem _5x5-Bereich_ für 20 Züge heiligt und dafür 2 Ladungen benötigt.\n\n_+3:_ Der Priester kann _Geheiligter Boden_ wirken, einen Zauber, der Gelände in einem _7x7-Bereich_ für 20 Züge heiligt und dafür 2 Ladungen benötigt.\n\nWenn er gewirkt wird, heilt Geheiligter Boden Verbündete um 15 LP, macht Gegner kurzzeitig bewegungsunfähig und verbreitet kurzes Gras. Anschließend heilt er langsam Verbündete, verkrüppelt Gegner und lässt hohes Gras zufällig wachsen. Geheiligter Boden gewährt dem Priester Abschirmung statt Heilung und wird durch Feuer zerstört.
actors.hero.talent.mnemonic_prayer.title=Eingedenken
actors.hero.talent.mnemonic_prayer.desc=_+1:_ Der Priester kann _Eingedenken_ wirken, einen Zauber, der die Wirkung von positiven/negativen Effekten auf Verbündete/Feinde um _3 Züge_ verlängert. Dies kostet 1 Ladung.\n\n_+2:_ Der Priester kann _Eingedenken_ wirken, einen Zauber, der die Wirkung von positiven/negativen Effekten auf Verbündete/Feinde um _4 Züge_ verlängert. Dies kostet 1 Ladung.\n\n_+3:_ Der Priester kann _Eingedenken_ wirken, einen Zauber, der die Wirkung von positiven/negativen Effekten auf Verbündete/Feinde um _5 Züge_ verlängert. Dies kostet 1 Ladung.\n\nDas Wirken von Eingedenken benötigt keine Zeit. Eingedenken kann eine bestimmte Wirkung von positiven und negativen Effekten nur einmal verlängern und hat keinen Einfluss auf Rüstungsfähigkeiten.

actors.hero.talent.lay_on_hands.title=Handauflegung
actors.hero.talent.lay_on_hands.desc=_+1:_ Der Paladin kann _Handauflegung_ wirken, einen Zauber, der einen nahen Charakter sofort um _15 LP_ heilt oder dem Paladin _15 Abschirmung_ gewährt. Dies kostet 1 Ladung.\n\n_+2:_ Der Paladin kann _Handauflegung_ wirken, einen Zauber, der einen nahen Charakter sofort um _20 LP_ heilt oder dem Paladin _20 Abschirmung_ gewährt Dies kostet 1 Ladung.\n\n_+3:_ Der Paladin kann _Handauflegung_ wirken, einen Zauber, der einen nahen Charakter sofort um _25 LP_ heilt oder dem Paladin _25 Abschirmung_ gewährt Dies kostet 1 Ladung.\n\nÜberschüssige Heilung durch diesen Zauber wird in Abschirmung umgewandelt. Handauflegung kann wiederholt gewirkt werden, kann aber nicht mehr als einen dreifach gewirkten Abschirmung gewähren.
actors.hero.talent.aura_of_protection.title=Aura des Schutzes
actors.hero.talent.aura_of_protection.desc=_+1:_ Der Paladin kann die _Aura des Schutzes_ wirken, einen Zauber, der dem Paladin und allen Verbündeten im Umkreis von 2 Feldern 20% Schadensresistenz und den Effekt der Rüstungsglyphe des Paladins mit +50% Stärke für 20 Züge gewährt. Dies kostet 2 Ladungen.\n\n_+2:_ Der Paladin kann die _Aura des Schutzes_ wirken, einen Zauber, der dem Paladin und allen Verbündeten im Umkreis von 2 Feldern 30% Schadensresistenz und den Effekt der Rüstungsglyphe des Paladins mit +75% Stärke für 20 Züge gewährt. Dies kostet 2 Ladungen.\n\n_+3:_ Der Paladin kann die _Aura des Schutzes_ wirken, einen Zauber, der dem Paladin und allen Verbündeten im Umkreis von 2 Feldern 40% Schadensresistenz und den Effekt der Rüstungsglyphe des Paladins mit +100% Stärke für 20 Züge gewährt. Dies kostet 2 Ladungen.
actors.hero.talent.wall_of_light.title=Wand aus Licht
actors.hero.talent.wall_of_light.desc=_+1:_ Der Paladin kann _Wand aus Licht_ wirken, einen Zauber, der eine _3 Felder breite_ massive Wand vor dem Paladin erschafft, die Gegner abwehrt und 20 Züge lang anhält. Dies kostet 3 Ladungen.\n\n_+2:_ Der Paladin kann _Wand aus Licht_ wirken, einen Zauber, der eine _5 Felder breite_ massive Wand vor dem Paladin erschafft, die Gegner abwehrt und 20 Züge lang anhält. Dies kostet 3 Ladungen.\n\n_+3:_ Der Paladin kann _Wand aus Licht_ wirken, einen Zauber, der eine _7 Felder breite_ massive Wand vor dem Paladin erschafft, die Gegner abwehrt und 20 Züge lang anhält. Dies kostet 3 Ladungen.\n\nDie Wand kann gerade oder diagonal platziert werden; es kann immer nur eine Wand gleichzeitig existieren.

actors.hero.talent.divine_intervention.title=göttlicher Eingriff
actors.hero.talent.divine_intervention.desc=_+1:_ In der Aufgestiegenen Gestalt kann der Kleriker _Göttlicher Beistand_ wirken. Dies erhöht die Abschirmung des Klerikers und aller Verbündeten um bis zu _150 Punkte_ und verlängert die Aufgestiegene Gestalt um _3 Züge._\n\n_+2:_ In der Aufgestiegenen Gestalt kann der Kleriker _Göttlicher Beistand_ wirken. Dies erhöht die Abschirmung des Klerikers und aller Verbündeten um bis zu _200 Punkte_ und verlängert die Aufgestiegene Gestalt um _4 Züge._\n\n_+3:_ In der Aufgestiegenen Gestalt kann der Kleriker _Göttlicher Beistand_ wirken. Dies erhöht die Abschirmung des Klerikers und aller Verbündeten um bis zu _250 Punkte_ und verlängert die Aufgestiegene Gestalt um _5 Züge._\n\n+4: In der Aufgestiegenen Gestalt kann der Kleriker _Göttlicher Beistand_ wirken. Dies erhöht die Abschirmung des Klerikers und aller Verbündeten um bis zu _300 Punkte_ und verlängert die Aufgestiegene Gestalt um _6 Züge._\n\nDie Kosten von Göttlicher Beistand betragen satte 5 Foliantenladungen und es kann nur einmal in derselben Aufgestiegenen Form gewirkt werden.
actors.hero.talent.judgement.title=Richtspruch
actors.hero.talent.judgement.desc=_+1:_ In aufgestiegener Form kann der Kleriker _Richtspruch_ wirken, das allen sichtbaren Gegnern _10–20 Schaden_ zufügt.\n\n_+2:_ In aufgestiegener Form kann der Kleriker _Richtspruch_ wirken, das allen sichtbaren Gegnern _15–30 Schaden_ zufügt.\n\n_+3:_ In aufgestiegener Form kann der Kleriker _Richtspruch_ wirken, das allen sichtbaren Gegnern _20–40 Schaden_ zufügt.\n\n_+4:_ In aufgestiegener Form kann der Kleriker _Richtspruch_ wirken, das allen sichtbaren Gegnern _25–50 Schaden_ zufügt.\n\nRichtspruch kostet 3 Foliantenladungen. Richtspruch verursacht +33% Schaden für jeden Zauber, den der Kleriker seit dem Eintreten in die aufgestiegene Form oder seit dem letzten Wirken von _Richtspruch_ gewirkt hat.
actors.hero.talent.flash.title=Blitz
actors.hero.talent.flash.desc=_+1:_ In der Aufgestiegenen Form kann der Kleriker mit _Blitz_ bis zu _3 Felder_ weit teleportieren.\n\n_+2:_ In der Aufgestiegenen Form kann der Kleriker mit _Blitz_ bis zu _4 Felder_ weit teleportieren.\n\n_+3:_ In der Aufgestiegenen Form kann der Kleriker mit _Blitz_ bis zu _5 Felder_ weit teleportieren.\n\n_+4:_ In der Aufgestiegenen Form kann der Kleriker mit _Blitz_ bis zu _6 Felder_ weit teleportieren.\n\nBlitz kostet anfangs 2 Foliantenladungen und 1 weitere Ladung für jede Verwendung in derselben aufgestiegenen Form.

actors.hero.talent.body_form.title=Körperform
actors.hero.talent.body_form.desc=Der Kleriker kann _Körperform_ wirken, wodurch Dreieinigkeit die Kraft einer Verzauberung oder Glyphe erhält, die er in diesem Abenteuer identifiziert hat. Dies kostet 2 Ladungen.\n\n+1: Bei Einsatz von Dreieinigkeit erhält der Kleriker den gewählten Effekt für _20 Züge._\n\n+2: Bei Einsatz von Dreieinigkeit erhält der Kleriker den gewählten Effekt für _27 Züge._\n\n+3: Bei Einsatz von Dreieinigkeit erhält der Kleriker den gewählten Effekt für _33 Züge._\n\n+4: Bei Einsatz von Dreieinigkeit erhält der Kleriker den gewählten Effekt für _40 Züge._\n\nDreieinigkeit kann jeweils nur mit einer Körperform erfüllt werden. Die Rüstungskosten von Dreieinigkeit sind höher, wenn die gewählte Glyphe selten und mächtig ist.
actors.hero.talent.mind_form.title=Verstandesform
actors.hero.talent.mind_form.desc=Der Kleriker kann _Verstandesform_ wirken, die Dreieinigkeit die Kraft eines Zauberstabs oder einer Wurfwaffe verleiht, die der Kleriker in diesem Abenteuer verwendet hat. Dies kostet 3 Ladungen.\n\n_+1:_ Bei Dreieinigkeit nutzt der Kleriker den Zauber- oder Wurfeffekt des gewählten Gegenstands, als wäre dieser _+3._\n\n_+2:_ Bei Dreieinigkeit nutzt der Kleriker den Zauber- oder Wurfeffekt des gewählten Gegenstands, als wäre dieser _+4._\n\n_+3:_ Bei Dreieinigkeit nutzt der Kleriker den Zauber- oder Wurfeffekt des gewählten Gegenstands, als wäre dieser _+5._\n\n_+4:_ Bei Dreieinigkeit nutzt der Kleriker den Zauber- oder Wurfeffekt des gewählten Gegenstands, als wäre dieser _+6._\n\nDreieinigkeit kann jeweils nur mit einer Verstandesform erfüllt werden.
actors.hero.talent.spirit_form.title=Geistform
actors.hero.talent.spirit_form.desc=Der Kleriker kann _Geistform_ wirken, die Dreieinigkeit mit der Kraft eines Rings oder Artefakts erfüllt, das der Kleriker in diesem Abenteuer identifiziert hat (mit Ausnahme des Heiligen Folianten). Dies kostet 4 Ladungen.\n\n_+1:_ Bei Einsatz von Dreieinigkeit erhält der Kleriker für 20 Züge den Effekt eines Rings mit _+1_ oder löst den Effekt eines Artefakts mit _+4_ aus.\n\n_+2:_ Bei Einsatz von Dreieinigkeit erhält der Kleriker für 20 Züge den Effekt eines Rings mit _+2_ oder löst den Effekt eines Artefakts mit _+6_ aus.\n\n_+3:_ Bei Einsatz von Dreieinigkeit erhält der Kleriker für 20 Züge den Effekt eines Rings mit _+3_ oder löst den Effekt eines Artefakts mit _+8_ aus.\n\n_+4:_ Bei Einsatz von Dreieinigkeit erhält der Kleriker für 20 Züge den Effekt eines Rings mit _+4_ oder löst den Effekt eines Artefakts mit _+10_ aus.\n\nDreieinigkeit kann jeweils nur mit einer Geistform erfüllt werden. Artefakte haben unterschiedliche Effekte und Rüstungskosten, wenn sie durch Dreieinigkeit ausgelöst werden.

actors.hero.talent.beaming_ray.title=Strahl der Versetzung
actors.hero.talent.beaming_ray.desc=Der Kleriker kann von einem ermächtigten Verbündeten aus einen _Strahl der Versetzung_ für 1 Ladung wirken. Dieser Strahl durchdringt Wände und teleportiert den Verbündeten an einen Zielort. Befindet sich dort ein Gegner, erscheint der Verbündete neben ihm und nimmt ihn ins Visier. Der Strahl der Versetzung kann sogar normalerweise unbewegliche Verbündete teleportieren, hat dabei aber nur die halbe Reichweite.\n\n_+1:_ Der Strahl der Versetzung hat eine maximale Reichweite von _4 Feldern_ und erhöht den Bonus der Macht der Vielen auf _+35% Schaden_ gegen den nächsten Gegner für 10 Züge.\n\n_+2:_ Der Strahl der Versetzung hat eine maximale Reichweite von _8 Feldern_ und erhöht den Bonus der Macht der Vielen auf _+40% Schaden_ gegen den nächsten Gegner für 10 Züge.\n\n_+3:_ Der Strahl der Versetzung hat eine maximale Reichweite von _12 Feldern_ und erhöht den Bonus der Macht der Vielen auf _+45% Schaden_ gegen den nächsten Gegner für 10 Züge.\n\n_+4:_ Der Strahl der Versetzung hat eine maximale Reichweite von _16 Feldern_ und erhöht den Bonus der Macht der Vielen auf _+50% Schaden_ gegen den nächsten Feind für 10 Züge.
actors.hero.talent.life_link.title=Lebensband
actors.hero.talent.life_link.desc=Der Kleriker kann _Lebensband_ zwischen sich und einem ermächtigten Verbündeten für 2 Ladungen wirken. Dieser Zauber bewirkt, dass der Schaden zwischen dem Kleriker und seinem Verbündeten geteilt wird und dass vorteilhafte Klerikerzauber der Klasse 3 oder niedriger auf beide wirken, wenn einer von ihnen betroffen ist.\n\n_+1:_ Lebensband hält _10 Züge_ an und erhöht den Bonus der Macht der Vielen auf _-35% erlittenen Schaden._\n\n_+2:_ Lebensband hält _13 Züge_ an und erhöht den Bonus der Macht der Vielen auf _-40% erlittenen Schaden._\n\n_+3:_ Lebensband hält _17 Züge_ an und erhöht den Bonus der Macht der Vielen auf _-45% erlittenen Schaden._\n\n_+4:_ Lebensband hält _20 Züge_ an und erhöht den Bonus der Macht der Vielen auf _-50% erlittenen Schaden._
actors.hero.talent.stasis.title=Entrückung
actors.hero.talent.stasis.desc=Der Kleriker kann _Entrückung_ auf einen ermächtigten Verbündeten wirken. Dies kostet 2 Ladungen. Entrückung entfernt den Verbündeten vorübergehend aus dem Dungeon und erhält die verbleibende Zeit aller positiven Effekte, einschließlich der Macht der Vielen. Der Verbündete erscheint wieder neben dir, sobald der Effekt endet. Entrückung kann sofort und kostenlos erneut gewirkt werden, um den Effekt vorzeitig zu beenden. Entrückung wirkt auch auf unbewegliche Verbündete, kann diese aber nicht zwischen Dungeon-Ebenen bewegen.\n\n_+1:_ Entrückung hält maximal _60 Züge_ an.\n\n_+2:_ Entrückung hält maximal _90 Züge_ an.\n\n_+3:_ Entrückung hält maximal _120 Züge_ an.\n\n_+4:_ Entrückung hält maximal _150 Züge_ an.\n\nDer Kleriker kann außerdem Strahl der Versetzung wirken, wenn sich ein Verbündeter in Entrückung befindet, um ihn wiederzubeschwören, oder Lebensband einsetzen, um dessen Effekt präventiv anzuwenden. Verbündete profitieren jedoch nicht von Lebensband, während sie sich in Entrückung befinden.


#universal
actors.hero.talent.heroic_energy.title=heroische Energie
actors.hero.talent.heroic_energy.rat_title=rattenhafte Energie
actors.hero.talent.heroic_energy.desc=_+1:_ Die Rüstungsfähigkeit des Helden hat um _12% reduzierte_ Ladungskosten.\n\n_+2:_ Die Rüstungsfähigkeit des Helden hat um _23% reduzierte_ Ladungskosten.\n\n_+3:_ Die Rüstungsfähigkeit des Helden hat um _32% reduzierte_ Ladungskosten.\n\n_+4:_ Die Rüstungsfähigkeit des Helden hat um _40% reduzierte_ Ladungskosten.

actors.hero.talent.ratsistance.title=Rattwehr
actors.hero.talent.ratsistance.desc=_+1:_ Feindlich gesinnte rattifizierte Feinde verursachen _-10% Schaden_.\n\n_+2:_ Feindlich gesinnte rattifizierte Feinde verursachen _-19% Schaden_.\n\n_+3:_ Feindlich gesinnte rattifizierte Feinde verursachen _-27% Schaden_.\n\n_+4:_ Feindlich gesinnte rattifizierte Feinde verursachen _-35% Schaden_.
actors.hero.talent.ratlomacy.title=Rattlomatie
actors.hero.talent.ratlomacy.desc=_+1:_ Wenn du Rattifizierung auf einen bereits rattifizierten Feind anwendest, wird er freundlich gesinnt und die Verwandlung wird dauerhaft.\n\n_+2:_ Wenn du Rattifizierung auf einen bereits rattifizierten Feind anwendest, wird er freundlich gesinnt, die Verwandlung wird dauerhaft und er erhält _2 Züge_ Adrenalin.\n\n_+3:_ Wenn du Rattifizierung auf einen bereits rattifizierten Feind  anwendest, wird er freundlich gesinnt, die Verwandlung wird dauerhaft und er erhält _4 Züge_ Adrenalin.\n\n_+4:_ Wenn du Rattifizierung auf einen bereits rattifizierten Feind  anwendest, wird er freundlich gesinnt, die Verwandlung wird dauerhaft und er erhält _6 Züge_ Adrenalin.
actors.hero.talent.ratforcements.title=Rattentruppen
actors.hero.talent.ratforcements.desc=_+1:_ Wenn du Rattifizierung auf dich selbst anwendest, wird _1_ verbündete Beutelratte neben dir _beschworen_.\n\n_+2:_ Wenn du Rattifizierung auf dich selbst anwendest, werden _2_ verbündete Beutelratten neben dir _beschworen_.\n\n_+3:_ Wenn du Rattifizierung auf dich selbst anwendest, werden _3_ verbündete Beutelratten neben dir _beschworen_.\n\n_+4:_ Wenn du Rattifizierung auf dich selbst anwendest, werden _4_ verbündete Beutelratten neben dir _beschworen_.



###npcs
actors.mobs.npcs.blacksmith.name=Trollschmied
actors.mobs.npcs.blacksmith.intro_quest_warrior=Hallo, Mensch! Du siehst robust aus.
actors.mobs.npcs.blacksmith.intro_quest_mage=Hallo, Mensch! Du siehst schlau aus.
actors.mobs.npcs.blacksmith.intro_quest_rogue=Hallo, Mensch! Du siehst raffiniert aus.
actors.mobs.npcs.blacksmith.intro_quest_huntress=Hallo, Mensch! Du siehst flink aus.
actors.mobs.npcs.blacksmith.intro_quest_duelist=Hallo, Mensch! Du siehst mutig aus.
actors.mobs.npcs.blacksmith.intro_quest_cleric=Hallo, Mensch! Du siehst wichtig aus.
actors.mobs.npcs.blacksmith.intro_quest_start=Willste dich nützlich machen, hä? Weil ich hätt' da 'nen Job für dich. Ich hab' diese Werkstatt über 'ner Goldmine gebaut, die is' am unteren Ende von der Leiter da. Schnapp dir 'ne Spitzhacke und schürf mir etwas _Dunkelgold-Erz_. _40 Stück_ sollten reichen. Das Gestein da unten is' schön weich, _du wirst dich mit etwas Mühe durch die Wände graben können._\n\nWas heißt hier, wie werde ich dafür bezahlen? Du gieriges...\n\nIs' ja schon gut, ich kann dir was zusammenschmieden. Kannst dich glücklich schätzen, ich bin in dieser Gegend nämlich der einzige Schmied!
actors.mobs.npcs.blacksmith.intro_quest_crystal=Aber pass auf, die Mine ist gefährlich für kleine Menschlein wie dich. Is' schon seit 'ner Weile verlassen, inzwischen wachsen da 'ne Menge Kristalle. Die funkeln schön, sind aber zu zerbrechlich und deshalb wertlos, zumal sie durch irgendwelche magischen Dinge beschützt werden. Und die sind ziemlich stark, also _sei vorsichtig beim Schürfen,_ sonst ziehst du ihre Aufmerksamkeit auf dich.\n\nEs gibt auch irgendwo so 'nen _Riesenkristall._ Der is' aber viel stabiler, also mach dich auf 'nen Kampf gefasst, wenn du da drauf haust. Ich wette, es verlangsamt das Wachstum aller Kristalle wenn du das Ding zerbrichst; ich zahl' also extra, wenn du das hinkriegst!
actors.mobs.npcs.blacksmith.intro_quest_gnoll=Aber pass auf, die Mine is' gefährlich für kleine Menschlein wie dich. 'Ne Handvoll Gnolls sind auch auf das Gold aus, und jetz' zerlegen die da unten alles. Das sind dämliche Kerle, durch ihr Vorhauen gibt's überall Felsbrüche und Tunneleinstürze. Da musste dich durchwühlen, also Obacht bei _frisch gebrochenem Fels._\n\nEin Gnoll da unten is', glaub' ich, ganz besonders übel, wohl so 'ne Art _Geomantie-Schamane_. Ich zahl' extra, wenn du den findest und platt machst, aber der haut mit Sicherheit auch zurück, hähä.
actors.mobs.npcs.blacksmith.intro_quest_fungi=Aber pass auf, die Mine is' gefährlich für kleine Menschlein wie dich. Da wuchert inzwischen 'nen seltsames Pilzmonstrum herum. Das hat so 'ne Art Pilzwachen ausgebildet, die sind tödlich, wenn se dich bemerken, aber wenigstens können se dir nich' hinterherrennen. _Bleib außer Sichtweite,_ wenne weiterleben willst.\n\nIch zahle extra, wenn du den _größten Pilz_ ausschalten kannst, aber das wird garantiert nich' einfach. Der is' mit in Wänden versteckten Myzel-Knoten verbunden. Die meisten davon musste zerstören, eh' du ihm was anhaben kannst.
actors.mobs.npcs.blacksmith.reminder=Hör auf, mich abzulenken. Der Eingang zur Mine is' da drüben.
actors.mobs.npcs.blacksmith.reminder_crystal=Bring' mir so viel Gold, wie du kannst, und versuch' auch den großen Kristall zu zerbrechen.
actors.mobs.npcs.blacksmith.reminder_gnoll=Bring' mir so viel Gold, wie du kannst, und versuch' auch, den Gnoll-Geomanten zu töten.
actors.mobs.npcs.blacksmith.reminder_fungi=Bring' mir so viel Gold, wie du kannst, und versuch' auch den Riesenpilz zu töten.
actors.mobs.npcs.blacksmith.lost_pick=Ist dat´ dein Ernst? Wo ist meine Spitzhacke?!
actors.mobs.npcs.blacksmith.quest_start_prompt=Bereit zum Abstieg? Sieh zu, dass du etwas Stauraum für das Gold hast.\n\n_Ich lass’ dich nur einmal da runtergehen!_
actors.mobs.npcs.blacksmith.enter_yes=Bin bereit
actors.mobs.npcs.blacksmith.enter_no=Noch nicht
actors.mobs.npcs.blacksmith.exit_warn_none=Biste schon fertig? Du hast ja fast gar nix an Gold! Solltest schon _40 Stück_ beschaffen können!\n\n_Denk dran, ich lass dich nich' noch mal runter, wenn du erst wieder oben bist._
actors.mobs.npcs.blacksmith.exit_warn_low=Biste schon fertig? Sieht nich' so aus, als hätteste viel Gold dabei. Solltest schon _40 Stück_ beschaffen können!\n\n_Denk dran, ich lass dich nich' noch mal runter, wenn du erst wieder oben bist._
actors.mobs.npcs.blacksmith.exit_warn_med=Biste schon fertig? Bisschen Gold hast du ja, aber in der Mine ist definitiv noch mehr. Solltest schon _40 Stück_ beschaffen können!\n\n_Denk dran, ich lass dich nich' noch mal runter, wenn du erst wieder oben bist._
actors.mobs.npcs.blacksmith.exit_warn_high=Biste schon fertig? Hast ja ordentlich Gold dabei, aber ich könnte noch etwas mehr gebrauchen. Solltest schon _40 Stück_ beschaffen können!\n\n_Denk dran, ich lass dich nich' noch mal runter, wenn du erst wieder oben bist._
actors.mobs.npcs.blacksmith.exit_warn_full=Biste schon fertig? Du hast ja viel Gold dabei, aber sieh zu, dass du nix von deinem Krempel unten liegen lässt.\n\n_Denk dran, ich lass dich nich' noch mal runter, wenn du erst wieder oben bist._
actors.mobs.npcs.blacksmith.exit_warn_crystal=Der Riesenkristall is' auch noch da unten. Ich zahl' extra, wenn du den zerstörst.
actors.mobs.npcs.blacksmith.exit_warn_gnoll=Der Gnoll-Geomant is' auch noch da unten. Ich zahl' extra, wenn du den umbringst.
actors.mobs.npcs.blacksmith.exit_warn_fungi=Der Riesenpilz is' auch noch da unten. Ich zahl' extra, wenn du den platt machst.
actors.mobs.npcs.blacksmith.exit_yes=Bin Fertig
actors.mobs.npcs.blacksmith.exit_no=Noch nicht
actors.mobs.npcs.blacksmith.get_lost=Ich bin beschäftigt. Zisch ab!
actors.mobs.npcs.blacksmith.entrance_blocked=Der Weg nach unten ist versperrt.
actors.mobs.npcs.blacksmith.cant_enter_old=Dieses Gebiet ist in diesem Abenteuer nicht zugänglich. Beginne ein neues Spiel, um das neue Abenteuer zu versuchen!
actors.mobs.npcs.blacksmith.def_verb=geblockt
actors.mobs.npcs.blacksmith.desc=Der Trollschmied sieht aus wie alle Trolle: Er ist hochgewachsen und mager, und seine Haut erinnert in Farbe und Struktur an Stein. Der Trollschmied hantiert mit unverhältnismäßig kleinen Werkzeugen herum.

actors.mobs.npcs.ghost.name=Trauriger Geist
actors.mobs.npcs.ghost.rat_1=Seid gegrüßt, %s... Einst war ich wie Ihr – stark und zuversichtlich... Doch dann wurde ich von einer widerwärtigen Bestie erschlagen... Ich kann diesen Ort nicht verlassen... Nicht, bevor ich gerächt werde... Vernichtet die _verfaulende Ratte,_ die mir das Leben nahm...\n\nSie kriecht auf dieser Ebene umher... Verteilt ihren Gestank überall... _Hütet Euch vor ihrem widerwärtigen Geruch und zersetzenden Biss. Ihr Gift löst sich im Wasser auf..._
actors.mobs.npcs.ghost.rat_2=Bitte... Helft mir... Erschlagt die abscheuliche Kreatur...\n\n_Bekämpft sie nah am Wasser... Meidet ihren Gestank..._
actors.mobs.npcs.ghost.gnoll_1=Seid gegrüßt, %s... Einst war ich wie Ihr – stark und zuversichtlich... doch dann wurde ich von einem verschlagenen Wesen ermordet... Ich kann diesen Ort nicht verlassen... Nicht, bevor ich gerächt werde... Tötet den _Gnoll-Trickser_, der mir das Leben nahm...\n\nEr verhält sich nicht wie normale Gnolle... Sondern versteckt sich und verwendet Wurfwaffen... _Hütet Euch vor seinen Gift- und Brandpfeilen und meidet den Fernkampf..._
actors.mobs.npcs.ghost.gnoll_2=Bitte... Helft mir... Erschlagt den Trickser...\n\n_Lasst euch nicht treffen... Geht nah an ihn ran..._
actors.mobs.npcs.ghost.crab_1=Seid gegrüßt, %s... Einst war ich wie Ihr – stark und zuversichtlich... doch dann wurde ich von einer uralten Kreatur niedergestreckt... Ich kann diesen Ort nicht verlassen... Nicht, bevor ich gerächt werde... Tötet die _gigantische Krabbe,_ welche mir das Leben nahm... \n\nDiese Kreatur ist unnatürlich alt... Sie hat eine massive Schere und einen festen Panzer... Seid vorsichtig... _Sie pariert viele Angriffe mit ihrer Schere. Ihr müsst sie überraschen, andernfalls wird sie ein harter Gegner..._
actors.mobs.npcs.ghost.crab_2=Bitte... Helft mir... Erschlagt das Krustentier...\n\n_Es wird immer blocken... Wenn es euch kommen sieht..._
actors.mobs.npcs.ghost.find_me=Vielen Dank... findet mich...
actors.mobs.npcs.ghost.desc=Der Geist ist kaum sichtbar. Er sieht wie ein formloser, schwächlicher Lichtfleck mit einem trauernden Gesicht aus.

actors.mobs.npcs.imp.name=Ehrgeiziger Wicht
actors.mobs.npcs.imp.intro=Bist du ein Abenteurer? Ich liebe Abenteurer! Auf sie kann man sich immer verlassen, wenn etwas getötet werden muss, oder? Natürlich für ein Kopfgeld ;)
actors.mobs.npcs.imp.golems_1=In meinem Fall wären es _Golems_, die da umgebracht werden müssten. Weißt du, ich möchte hier einen kleinen Laden eröffnen, aber diese dummen Golems sind schlecht fürs Geschäft! Man kann mit einem wandelnden Granitklumpen so schlecht verhandeln, verdammt nochmal! Also, bitte, töte... sagen wir, _4 von ihnen_, und die Belohnung gehört dir.
actors.mobs.npcs.imp.monks_1=In meinem Fall wären es _Mönche_, die da umgebracht werden müssten. Weißt du, ich möchte hier einen kleinen Laden eröffnen, aber diese Irren kaufen selbst nichts und verscheuchen mir andere Kunden. Also, bitte, bringe... sagen wir, _5 von ihnen_ um die Ecke, und die Belohnung gehört dir.
actors.mobs.npcs.imp.golems_2=Na, wie läuft deine Golem-Safari? Vergiss nicht, die Münzen einzusammeln.
actors.mobs.npcs.imp.monks_2=Oh, du bist noch am Leben! Ich wusste, dass dein Kung-Fu stärker ist ;) Vergiss bloß nicht, denen diese Münzen abzuknöpfen.
actors.mobs.npcs.imp.cya=Bis bald, %s!
actors.mobs.npcs.imp.hey=Psst, %s!
actors.mobs.npcs.imp.desc=Wichte sind geringere Dämonen. Sie sind nicht für ihre Stärke oder magischen Fähigkeiten bekannt, aber sie sind intelligent und anpassungsfähig. Viele Wichte bevorzugen das Zusammenleben mit Nicht-Dämonen.

actors.mobs.npcs.impshopkeeper.name=Ehrgeiziger Wicht
actors.mobs.npcs.impshopkeeper.greetings=Hallo, %s!
actors.mobs.npcs.impshopkeeper.greetings_ascent=Was hast du getan, %s? Beeile dich beim Einkauf, ich muss hier weg!
actors.mobs.npcs.impshopkeeper.thief=Ich dachte, ich könnte dir vertrauen!
actors.mobs.npcs.impshopkeeper.buyback=Der Wicht gibt dir den Gegenstand fröhlich pfeifend zurück.
actors.mobs.npcs.impshopkeeper.desc=Der Wicht hat am Übergang zu den inneren Hallen einen kleinen Laden eröffnet. Es ist schön, hier ein freundliches Gesicht zu sehen, allerdings sind seine Preise alles andere als freundlich.

actors.mobs.npcs.mirrorimage.name=Spiegelbild
actors.mobs.npcs.mirrorimage.desc=Diese Illusion sieht dir sehr ähnlich, sie scheint sogar deine aktuelle Rüstung und Waffe zu tragen.\n\nSpiegelbilder suchen nach Feinden und greifen diese mit ihren imitierten Waffen an, welche sich genauso verhalten wie deine, aber weniger Schaden anrichten. Zuerst sind sie fast unsichtbar, aber um angreifen zu können, müssen Spielbilder eine feste Form annehmen.\n\nObwohl sie viel Schaden austeilen können, halten Spiegelbilder nicht lange durch und verblassen, sobald sie getroffen werden.
actors.mobs.npcs.mirrorimage.discover_hint=Du kannst diesen Charakter mit einer bestimmten Schriftrolle finden.

actors.mobs.npcs.npc.discover_hint=Du findest diesen Charakter in einer bestimmten Region des Dungeons.

actors.mobs.npcs.prismaticimage.name=Lichtbrechung
actors.mobs.npcs.prismaticimage.desc=Diese glitzernde Illusion sieht dir sehr ähnlich, sie scheint sogar deine derzeitige Waffe und Rüstung zu tragen.\n\nPrismatische Abbilder versuchen, die Aufmerksamkeit der Feinde auf sich zu lenken und setzen ihre verbesserte Verteidigung und Gesundheit dazu ein, dich zu schützen. Sie verfügen zwar nicht über die gleiche Schlagkraft wie Spiegelbilder, so aber doch über bessere Ausdauer und profitieren auch von den Vorteilen deiner Rüstung.\n\nWenn ihre Lebenspunkte auf 0 fallen, verblassen sie über mehrere Züge und können in dieser Zeit immer noch geheilt werden. Wenn keine Feinde zugegen sind, verblassen die Abbilder und finden zu ihrem Herrn zurück.
actors.mobs.npcs.prismaticimage.discover_hint=Du kannst diesen Charakter mit einer bestimmten Schriftrolle finden.

actors.mobs.npcs.ratking.name=König der Ratten
actors.mobs.npcs.ratking.not_sleeping=Ich schlafe nicht!
actors.mobs.npcs.ratking.what_is_it=Was ist? Ich habe keine Zeit für deinen Unsinn. Mein Königreich regiert sich nicht von alleine!
actors.mobs.npcs.ratking.confused=Wa... Wo bin ich? Mein Königreich braucht mich!
actors.mobs.npcs.ratking.crown_clothes=Zieh dir was an! Du bist nicht in der Verfassung, mit Majestäten zu sprechen!
actors.mobs.npcs.ratking.crown_desc=Oooh, ist diese Krone für mich? Sie glänzt viel mehr als meine, darum werde ich sie gnädigerweise annehmen!\n\nTatsächlich gedenke ich sogar, dir eine Belohnung für diese Krone anzubieten. Eine ungeheure Macht, die eines Helden wie dir angemessen ist! Würde dir das gefallen?
actors.mobs.npcs.ratking.crown_yes=Selbstverständlich!
actors.mobs.npcs.ratking.crown_info=Erzähle mir erstmal mehr.
actors.mobs.npcs.ratking.crown_no=Lieber doch nicht...
actors.mobs.npcs.ratking.crown_thankyou=Hehehe, vielen Dank! Jetzt geh' und mach deinen König stolz!
actors.mobs.npcs.ratking.crown_fine=Wohl an! Es ist ja nicht so, dass ich sie wollte...
actors.mobs.npcs.ratking.crown_after=Freust du dich über deine neue Rüstung? Keine Rücknahme!
actors.mobs.npcs.ratking.desc_crown=Diese Ratte ist etwas größer als eine gewöhnliche Beutelratte. Sie trägt die Krone des Zwergenkönigs auf ihrem Kopf.
actors.mobs.npcs.ratking.desc_birthday=Diese Ratte ist etwas größer als eine gewöhnliche Beutelratte. Sie trägt einen klitzekleinen grüne Partyhut anstelle der üblichen Krone. Alles Gute zum Geburtstag, Rattenkönig!
actors.mobs.npcs.ratking.desc_winter=Diese Ratte ist etwas größer als eine gewöhnliche Beutelratte. Sie trägt eine klitzekleine festliche Kopfbedeckung anstelle der üblichen Krone. Schöne Feiertage!
actors.mobs.npcs.ratking.desc=Diese Ratte ist etwas größer als eine gewöhnliche Beutelratte. Sie trägt eine klitzekleine Krone auf ihrem Kopf.
actors.mobs.npcs.ratking.discover_hint=Du findest diesen Charakter am Ende einer bestimmten Region im Dungeon.

actors.mobs.npcs.sheep.name=Schaf
actors.mobs.npcs.sheep.baa!=Bäh!
actors.mobs.npcs.sheep.baa?=Bäh?
actors.mobs.npcs.sheep.baa.=Bäh.
actors.mobs.npcs.sheep.baa...=Bäh...
actors.mobs.npcs.sheep.def_verb=geblockt
actors.mobs.npcs.sheep.desc=Dies ist ein magisches Schaf. Was daran so magisch sein soll? Du kannst es nicht töten. Es wird einfach stehenbleiben, sein Futter wiederkäuen und sein sorgenfreies Leben genießen, bis es wie durch Zauberhand verschwindet.
actors.mobs.npcs.sheep.discover_hint=Du kannst diesen Charakter mit einem bestimmten Gegenstand oder einer bestimmten Falle finden.

actors.mobs.npcs.shopkeeper.name=Händler
actors.mobs.npcs.shopkeeper.thief=Dieb, Dieb!
actors.mobs.npcs.shopkeeper.warn=Pass auf! Ich warne dich nicht nochmal.
actors.mobs.npcs.shopkeeper.flee=Der Ladeninhaber flieht!
actors.mobs.npcs.shopkeeper.sell=Verkaufe einen Gegenstand
actors.mobs.npcs.shopkeeper.talk=Unterhalten
actors.mobs.npcs.shopkeeper.buyback=Der Ladenbesitzer gibt dir den Gegenstand widerwillig zurück.
actors.mobs.npcs.shopkeeper.talk_prison_intro=Ich habe alles, was Du für ein erfolgreiches Abenteuer brauchst!
actors.mobs.npcs.shopkeeper.talk_prison_warrior=Das ist ein interessantes Siegel, das Du da hast. Die gibt es normalerweise nur im Ganzen. Bist Du ein in Ungnade gefallener Held oder sowas? Na, wie auch immer, was Du getan hast, ist nicht mein Problem, und es ändert nichts am Wert Deiner Münzen.
actors.mobs.npcs.shopkeeper.talk_prison_mage=Hehe, ich glaube, ich habe einen Steckbrief mit Deinem Namen irgendwo in der Stadt gesehen. Auf der Flucht, wie? Ach, Du bist unschuldig? Klar, logisch... keine Sorge, ich habe besseres zu tun, als Dich zu verpfeifen, aber vielleicht solltest Du mir sicherheitshalber etwas abkaufen?
actors.mobs.npcs.shopkeeper.talk_prison_rogue=Kommst Du von der Diebesgilde, um die Gegend leerzuräumen? Nein, nur einkaufen? Gut, erledige ein paar Monster, wenn Du schonmal da bist. Aber erwarte keinen Rabatt, ich bezahle schon genug Schutzgeld an euch Leute, dabei sorgt ihr hier unten kaum für meine Sicherheit.
actors.mobs.npcs.shopkeeper.talk_prison_huntress=Du scheinst nicht gerade in deinem Element zu sein, Miss. Enge Dungeongänge sind nicht so weitläufig wie große Hallen oder die Wälder, die die Stadt umgeben, nicht wahr? Ach, lass dich von meinem Geschwafel nicht ärgern. Möchtest Du vielleicht etwas kaufen?
actors.mobs.npcs.shopkeeper.talk_prison_duelist=Na, wenn das mal nicht die reisende Heldin ist! Wenn Du versuchst, mal wieder eine Stadt zu retten, dann viel Glück. Die Gefahren hier sind nämlich wesentlich schlimmer als ein paar läppische Gaunerbanden. Ich bin sicher, Du schlägst Dich besser als jede andere, nur versuche bitte, nicht direkt vor meiner Ladentür zu sterben.
actors.mobs.npcs.shopkeeper.talk_prison_cleric=Nun, ich grüße Dich, Hochwürden, oder ist es inzwischen Eure Heiligkeit? Hehe, wie dem auch sei, das hier ist kein Ort für Dich, und eine Menge an Leute wäre sicher ziemlich bestürzt, wenn Du plötzlich tot sein solltest. Aber sicher hast Du ein paar Geldstücke dabei, warum kaufst Du also nicht etwas, um das zu vermeiden?
actors.mobs.npcs.shopkeeper.talk_caves=Gib Geld aus, lebe länger.\n\nOh, und grüße den Trollschmied von mir, wenn Du ihn siehst. Erinnere das Schlitzohr an das Geld, das er mir immer noch für den Hammer schuldet, den ich ihm letzte Woche verkauft habe.
actors.mobs.npcs.shopkeeper.talk_city=Meine Waren können Dich hier unten schützen.\n\n... und trödel bitte nicht herum. Es hat ewig gedauert, die Bewohner hier dazu zu bringen, mich in Ruhe zu lassen. Ich will nicht, dass Du mir irgendwelchen Ärger verursachst.
actors.mobs.npcs.shopkeeper.talk_halls=Hey, ich hab Sonderangebote für Dämonenjäger!\n\nOh, und sei vorsichtig dort unten. Die Dämonen kümmern sich nicht darum, wie mutig du bist. Du kannst nicht zurückkommen und mehr Geld ausgeben, wenn du tot bist! ;)\n\nOb die Dämonen sind wie ich? Ha, nicht im geringsten. Ich bin nur ein gewöhnlicher Bursche, nicht gerade ein Kämpfer, und ich hab's geschafft, meinen Verstand intakt zu halten. Die Dämonen unten sind wesentlich stärkere Wesen, und sie alle wurden versklavt von... naja... sei einfach vorsichtig dort unten.
actors.mobs.npcs.shopkeeper.talk_ascent=Ich weiß nicht, was Du mit diesem Amulett vorhast, aber ich will nichts damit zu tun haben. Kauf irgendwas und zieh weiter, wir müssen beide hier weg!
actors.mobs.npcs.shopkeeper.desc=Dieser stämmige Typ würde von seinem Erscheinungsbild her eher ins Handelsviertel einer größeren Stadt passen als in ein Dungeon. Seine Preise erklären aber, warum er den Handel hier bevorzugt.

actors.mobs.npcs.wandmaker.name=Alter Stabmacher
actors.mobs.npcs.wandmaker.intro_warrior=Oh, sei gegrüßt! Welch eine angenehme Überraschung, einen Krieger aus dem Norden an diesem deprimierenden Ort anzutreffen! Du musst weit gereist sein, bevor du hierhergekommen bist. Wenn du auf Abenteuer aus bist, hätte ich vielleicht eine Aufgabe für dich.
actors.mobs.npcs.wandmaker.intro_rogue=Du meine Güte, hast du mich erschreckt! Ich habe keinen Banditen an diesem Ort entdeckt, der immer noch bei Verstand wäre, also musst du von der Oberfläche sein! Wenn du Interesse hast, einem Fremden zu helfen, hätte ich eine Aufgabe für dich.
actors.mobs.npcs.wandmaker.intro_mage=Oh, Hallo %s! Ich habe mitbekommen, dass da wohl etwas Unruhe zwischen dir und dem Institut der Zauberer herrschte? Vergiss es, ich war niemals ein Freund dieser Engstirnigen. Wenn du möchtest, hätte ich eine Aufgabe für dich.
actors.mobs.npcs.wandmaker.intro_huntress=Oh, hallo, meine Dame! Ein freundliches Gesicht hier in dieser Tiefe zu entdecken ist wahrlich eine erfreuliche Überraschung, oder? Tatsächlich kommt mir dein Gesicht bekannt vor. Es liegt mir auf der Zunge... Wie dem auch sei, falls du hier auf Abenteuer aus bist, hätte ich vielleicht eine Aufgabe für dich.
actors.mobs.npcs.wandmaker.intro_duelist=Oh, hallo, meine Dame! Welch angenehme Überraschung, in dieser deprimierenden Umgebung einer Heldin zu begegnen! Wenn Du gewillt wärest, einem alten Mann zu helfen, hätte ich eine Aufgabe für Dich.
actors.mobs.npcs.wandmaker.intro_cleric=Oh, hallo, Eure Heiligkeit! Welch eine freudige Überraschung, Dich an einem solch bedrückenden Ort zu treffen. Ich mag es nicht, jemandem etwas aufzubürden, aber ich hätte da wahrscheinlich eine Aufgabe für Dich.
actors.mobs.npcs.wandmaker.intro_1=\n\nIch bin hier, um eine seltene Zutat für einen Zauberstab zu finden, doch habe ich mich verlaufen und mein magischer Schutzschild ist geschwächt. Ich muss diesen Ort bald verlassen, doch ich kann den Gedanken nicht ertragen, ihm mit leeren Händen den Rücken zu kehren.
actors.mobs.npcs.wandmaker.intro_dust=Ich suche nach etwas _Leichenstaub._ Das ist eine besondere Art verfluchtes Gebein, das normalerweise an Orten wie diesem zu finden ist. Hier müsste irgendwo ein verbarrikadierter Raum sein, ich wette, da gibt es solchen Staub. Sei aber vorsichtig, der Fluch auf diesem Staub ist ziemlich mächtig, also _komm so schnell wie möglich zurück,_ damit ich den Staub reinigen kann.
actors.mobs.npcs.wandmaker.intro_ember=Ich suche nach etwas _frischer Asche_ von einem neugeborenen Feuerelementar. Elementare erscheinen normalerweise, wenn ein Beschwörungsritual außer Kontrolle gerät, also suche einfach ein paar Kerzen und einen Ritualplatz. Ich bin mir sicher, dass Du eins auftauchen lassen kannst. Pass jedoch auf, dass Du Dir beim Kampf _nicht Deine Rückzugsmöglichkeiten nimmst,_ oder halte _etwas bereit, das Frost erzeugen kann._ Neugeborene Elementare sind recht stark und chaotisch, aber Kälte können sie nicht leiden.
actors.mobs.npcs.wandmaker.intro_berry=Die frühere Wärterin dieses Gefängnisses züchtete hier eine _Faulbeere_ und ich brauche die Samen dieser Pflanze. Die Pflanze muss inzwischen außer Rand und Band sein, daher benötigt diese Aufgabe etwas Fingerspitzengefühl. Der Garten sollte sich hier irgendwo in der Nähe befinden. Versuche _Abstand von den Ranken zu gewinnen,_ wenn du nicht in kleine Stückchen geschnitten werden möchtest. Alles in Brand zu setzen wirkt verlockend, aber ich bitte dich das zu vermeiden, da es die gesamte Pflanze und ihre Samen vernichtet.
actors.mobs.npcs.wandmaker.intro_2=\n\nWenn du mir das besorgen kannst, werde ich dich mit einem meiner ausgezeichneten Zauberstäbe belohnen. Ich habe zwei mitgebracht, daher darfst du dir einen aussuchen und behalten.
actors.mobs.npcs.wandmaker.reminder_dust=Hast du Leichenstaub gefunden, %s? Suche nach verbarrikadierten Räumen.
actors.mobs.npcs.wandmaker.reminder_ember=Hast du diese Asche gefunden, %s? Du brauchst vier Kerzen und einen Ritualplatz.
actors.mobs.npcs.wandmaker.reminder_berry=Hast du einen Fäulnissamen gefunden, %s? Suche nach einem Raum, der vollständig zugewuchert ist.
actors.mobs.npcs.wandmaker.def_verb=geblockt
actors.mobs.npcs.wandmaker.desc=Dieser alte, aber noch rüstige Herr blickt leicht verwirrt. Er wird beschützt von einem magischen Schutzschild.



###mobs
actors.mobs.acidic.name=ätzender Skorpion
actors.mobs.acidic.desc=Diese riesigen, spinnenartigen Dämonenkreaturen vermeiden den Nahkampf, sie ziehen es vor, verkrüppelnde, zahnbesetzte Stacheln aus weiter Entfernung zu schießen. Diese hier trieft vor zersetzendem Schlamm.

actors.mobs.albino.name=Albinoratte
actors.mobs.albino.desc=Dies ist eine seltene Gattung der Ratte, erkennbar an ihrem weißen Fell und ihren gezackten Zähnen.
actors.mobs.albino.discover_hint=Du findest diesen seltenen Gegner in einer bestimmten Region im Dungeon.

actors.mobs.armoredstatue.name=gepanzerte Statue
actors.mobs.armoredstatue.desc=Wären da nicht diese beunruhigend rot leuchtenden Augen, könnte man annehmen, es handle sich nur um eine weitere Skulptur in diesem Dungeon.\n\nAugenscheinlich ist sie aufgrund der Rüstung, die sie trägt, in hervorragender Verfassung; es könnte sehr schwer werden, sie zu besiegen.
actors.mobs.armoredstatue.desc_arm_wep=Die Statue an sich ist aus Stein, aber _%1$s_ und _%2$s_, die sie bei sich trägt, sehen sehr echt aus.

actors.mobs.bandit.name=verrückter Bandit
actors.mobs.bandit.desc=Ein Elitedieb, der sich durch sein opulenteres lilafarbenes Gewand auszeichnet. Trotz seines größeren Könnens ist er genauso hirnlos geworden wie normale Diebe.\n\nVerrückte Banditen bestehlen dich nicht nur, sondern blenden, verkrüppeln und vergiften dich auch kurzzeitig! Allerdings ist die Wahrscheinlichkeit, dass sie zusätzliche Beute mit sich führen, viel höher als bei normalen Dieben.

actors.mobs.bat.name=Vampirfledermaus
actors.mobs.bat.desc=Diese flinken und hartnäckigen Höhlenbewohner sind weit gefährlicher, als es den Anschein hat. Durch jeden erfolgreichen Angriff gewinnen sie Lebensenergie, wodurch sie in der Lage sind, weit größere Gegner zu besiegen.

actors.mobs.bee.name=goldene Biene
actors.mobs.bee.desc_honey=Ungeachtet ihrer geringen Größe verteidigen Goldbienen ihr Heim bis aufs Blut. Diese aber ist besänftigt und scheint dir folgen zu wollen.
actors.mobs.bee.desc=Trotz der geringen Größe der goldenen Bienen, verteidigen sie erbittert ihre Behausung. Diese hier ist sehr wütend, bleib lieber auf Distanz.
actors.mobs.bee.discover_hint=Du kannst diesen Charakter mit einem bestimmten Gegenstand finden.

actors.mobs.brute.name=Gnoll-Grobian
actors.mobs.brute.enraged=rasend
actors.mobs.brute.def_verb=geblockt
actors.mobs.brute.desc=Grobiane sind die größten, stärksten und die zähsten aller Gnolle. Wenn sie tödlich verletzt sind, verfallen sie in Raserei, wodurch sie kurzzeitig einen Schild erhalten und weit mehr Schaden zufügen.
actors.mobs.brute$bruterage.name=Grobian-Raserei
actors.mobs.brute$bruterage.desc=Dieser Gnoll-Grobian ist tödlich verletzt, doch er möchte dich mit in den Tod reißen!\n\nDieser Grobian stirbt, sobald sein Schild abgelaufen ist, entweder mit der Zeit, oder durch zugefügten Schaden. Bis dahin fügt der Grobian erheblich mehr Schaden zu, pass also auf!\n\nVerbleibende Züge mit Schild: %d.

actors.mobs.causticslime.name=ätzender Schleim
actors.mobs.causticslime.desc=Dieser Schleim scheint von der dunklen Magie, welche von der Tiefe ausgeht, verdorben worden zu sein. Er hat seine normale grüne Farbe verloren und ätzender Schlamm tropft von ihm herunter.
actors.mobs.causticslime.discover_hint=Du findest diesen seltenen Gegner in einer bestimmten Region im Dungeon.

actors.mobs.crab.name=Kanalkrabbe
actors.mobs.crab.desc=Diese riesigen Krabben stehen in der Nahrungskette der Abwasserkanäle am höchsten. Sie sind extremst schnell und ihr dicker Panzer widersteht auch schweren Schlägen.

actors.mobs.crystalguardian.name=Kristallwächter
actors.mobs.crystalguardian.def_verb=geblockt
actors.mobs.crystalguardian.desc=Diese großen, kristallinen Wächter sehen fast wie Statuen aus, wären da nicht die hell strahlenden Augen. Das verhärtete Kristall, aus dem sie bestehen, führt dazu, dass sie zwar träge, aber sehr robust sind, es wäre also besser, _sie so lange wie möglich in ihrem Kristallnest schlafen zu lassen._\n\nAufgrund ihrer Größe bewegen sich Kristallwächter in eng umschlossenen Räumen sehr viel langsamer. Außerdem sind sie so widerstandsfähig, dass sie nicht endgültig getötet werden können. Man kann sie niederschlagen und so für eine Zeitlang ausschalten, aber nach einer Weile stehen sie einfach wieder auf.
actors.mobs.crystalguardian.discover_hint=Du kannst diesen Gegner während einer bestimmten Aufgabe finden.

actors.mobs.crystalmimic.name=Kristall-Mimik
actors.mobs.crystalmimic.ate=Das Mimik hat dein %s gefressen!
actors.mobs.crystalmimic.escaped=Das Kristall-Mimik ist entkommen!
actors.mobs.crystalmimic.desc=Mimiks sind magische Kreaturen, die jede beliebige Gestalt annehmen können. Im Dungeon nehmen sie fast immer die Gestalt einer Schatztruhe an, um damit arglose Abenteurer zu verführen.\n\nKristall-Mimiks sind schlauer als ihre gewöhnlichen Artgenossen und ziehen es vor, den Kampf zu vermeiden und dabei Gegenstände zu stehlen. Werden sie entdeckt, so versuchen sie, das Weite zu suchen, außerdem sind sie dazu in der Lage, mit ihren Angriffen Feinde an eine andere Position zu verschieben.

actors.mobs.crystalspire.name=Kristallspitze
actors.mobs.crystalspire.warning=Der Kristall vibriert, als du darauf schlägst. Wenn du so weitermachst, wird das Aufmerksamkeit auf dich ziehen...
actors.mobs.crystalspire.alert=Die Vibrationen werden stärker und rollen durch die ganze Höhle!
actors.mobs.crystalspire.desc=Diese gigantische Kristallspitze aus ultrahartem Kristall ist vermutlich der Ursprung all der eigenartigen kristallinen Kreaturen in dieser Höhle. Deine normalen Waffen sind dagegen kaum zu gebrauchen, du müsstest schon deine Spitzhacke verwenden, falls du sie zerstören willst.\n\n_Sieh zu, dass du vorbereitet bist, bevor du loslegst._ Einen derart mächtigen Kristall zu zertrümmern wird bestimmt eine Weile dauern, und wahrscheinlich wirst du dabei auch nicht ungestört bleiben. Die Kristallspitze selbst verfügt möglicherweise sogar über gewisse Mittel der Selbstverteidigung. _Vielleicht können die Angriffe der Kristallspitze gegen ihre eigenen Lakaien gerichtet werden._
actors.mobs.crystalspire.discover_hint=Du kannst diesen Gegner während einer bestimmten Aufgabe finden.

actors.mobs.crystalwisp.name=Kristallbüschel
actors.mobs.crystalwisp.beam_kill=Der Lichtstrahl hat dich getötet...
actors.mobs.crystalwisp.desc=Ein kleiner, zorniger fliegender Brocken aus gehärtetem Kristall, der ein helles Leuchten hervorbringt. Kristallbüschel sind nicht allzu stark, aber bei freier Schusslinie werden sie Lichtstrahlen auf dich abfeuern.\n\nKristallbüschel sind klein genug, um sich durch die verschiedenen Kristallspitzen zu bewegen, aber sie können nicht hindurchschießen.
actors.mobs.crystalwisp.discover_hint=Du kannst diesen Gegner während einer bestimmten Aufgabe finden.

actors.mobs.demonspawner.name=Dämonenschleuder
actors.mobs.demonspawner.on_death=Als die Dämonenschleuder stirbt, scheint die dämonische Energie hier nachzulassen.
actors.mobs.demonspawner.desc=Diese sich drehende Masse aus Zwergenfleisch produziert Schlitzer-Dämonen aus den gefallenen Zwergen dieses Gebiets. Ganz offensichtlich haben diese Dämonen kein Problem damit, jede nur erdenkliche Ressource gegen ihre Feinde einzusetzen.\n\nObwohl sie furchterregend aussehen, können Dämonenschleudern sich weder fortbewegen noch selbst verteidigen. Dabei macht es ihre erhebliche Masse einem aber schwer, sie schnell zu töten, und sie bringen bei Gefahr schneller Schlitzer-Dämonen hervor.\n\n_Die Dämonenschleudern scheinen mit einer zentralen Quelle der Dämonenenergie verbunden zu sein. Sie zu töten, könnte die Quelle schwächen._

actors.mobs.dm100.name=DM-100
actors.mobs.dm100.zap_kill=Der Stromschlag hat dich getötet...
actors.mobs.dm100.desc=Der DM-100 ist eine frühe Version der 'Verteidigungsmaschine' der Zwerge, er war dazu gedacht, die Zwergen-Bergleute in den Höhlen unter diesem Gefängnis zu beschützen. Der elektrische Schlag der Maschine erwies sich aber als zu schwach, also schenkte man sie der Menschenstadt darüber. Jahrelang wurden sie nicht eingesetzt, dann aber fanden sie ihren Weg in das Gefängnis, wo die Wärter sie anfangs als zu grausam befanden. Doch als die Gefangenen immer widerspenstiger wurden, wurden sie zu schließlich einer Notwendigkeit.

actors.mobs.dm200.name=DM-200
actors.mobs.dm200.vent=Der DM-200 schießt einen Strahl aus toxischen Abgasen!
actors.mobs.dm200.desc=Der DM-200 ist die zweite Generation der 'Verteidigungsmaschine' der Zwerge, er war dazu gedacht, die Zwergen-Bergleute in den Höhlen und in der Stadt weiter unten zu beschützen. Diese Maschinen sind viel größer und sperriger als ihre Vorläufer, sie greifen mit ihren verheerenden hydraulischen Fäusten an.\n\nIhre Größe ist jedoch zugleich auch ihre Hauptschwäche, denn sie passen nicht in die engen Tunnel und Türöffnungen des Dungeons. Die Zwerge wogen diesen Mangel an Beweglichkeit des DM-200 dadurch auf, dass sie ihm die Fähigkeit gaben, seine toxischen Abgase in Richtung weit entfernter oder unerreichbarer Gegner auszustoßen.

actors.mobs.dm201.name=DM-201
actors.mobs.dm201.vent=Der DM-201 feuert eine zersetzende Granate!
actors.mobs.dm201.desc=Die Zwerge experimentierten kurz damit, die geringe Beweglichkeit des DM-200 stärker zu betonen und schufen einige DM-Modelle, die völlig stationär sind. Der DM-201 ist ein nachgerüsteter DM-200, der als Wachturm ohne Bewegungsfähigkeit dient. Im Austausch für die nicht vorhandene Beweglichkeit haben die neuen Modelle deutlich mehr Haltbarkeit und Angriffskraft.\n\nDa die DM-201 keinen Motor haben, aus dem man Abgase ablassen könnte, haben die Zwerge sie stattdessen mit zersetzenden Gasgranaten ausgestattet! Die DM-201 gehen jedoch vorsichtig mit diesen Granaten um und feuern sie nur ab, wenn zwischen ihnen und ihrem Angreifer ausreichend Abstand ist.

actors.mobs.dm300.name=DM-300
actors.mobs.dm300.notice=UNBEFUGTES PERSONAL FESTGESTELLT!
actors.mobs.dm300.shield=Der DM-300 zapft Energie aus frei liegenden Kabeln ab und baut einen Schild auf!
actors.mobs.dm300.charging=SCHADEN ERLITTEN! AKTIVIERE STROMMAST!
actors.mobs.dm300.charging_hint=DM-300 ist unverwundbar, solange er unter Strom steht.
actors.mobs.dm300.supercharged=ZERSTÖREN! ZERSTÖREN! ZERSTÖREN!
actors.mobs.dm300.charge_lost=STROMMAST BESCHÄDIGT! RÜCKGRIFF AUF LOKALE ENERGIE!
actors.mobs.dm300.pylons_destroyed=ALARM! INSTABILITÄT IM STROMNETZ FESTGESTELLT!
actors.mobs.dm300.rankings_desc=Durch DM-300 zermalmt
actors.mobs.dm300.def_verb=geblockt
actors.mobs.dm300.defeated=KRITISCHER SCHADEN! INITIIERE STILLLEGU-
actors.mobs.dm300.desc=DM-300 ist die größte und stärkste 'Verteidigungsmaschine', die die Zwerge je gebaut haben. Eine solch wunderbare Maschine lässt sich nur schwer herstellen, so dass die Zwerge insgesamt nur sehr wenige gebaut haben, die die Eingänge ihrer unterirdischen Hauptstadt bewachten.\n\nDiese Maschine ist mit Ventilen ausgestattet, durch die toxische Abgase ausgestoßen werden, und mit einem Hochleistungsbohrer, den sie zum Angriff und zum Aufbrechen des Bodens einsetzen kann. DM-300 kann sich außerdem mit dem Stromnetz verbinden, was seine Kräfte noch weiter steigert.
actors.mobs.dm300.desc_supercharged=DM-300 ist elektrisch geladen. In diesem Zustand ist er unverwundbar und bewegt sich mit doppelter Geschwindigkeit! Zudem kann er sich nun durch _soliden Fels_ graben, auch wenn er sich dabei langsamer bewegt.\n\nDM-300 in diesem Zustand anzugreifen ist sinnlos; jedoch _muss ihn etwas in dieser Höhle mit Energie versorgen._ Dies zu zerstören, könnte ihn schwächen.

actors.mobs.dwarfking.name=König der Zwerge
actors.mobs.dwarfking.notice=Wie kannst du es wagen! Du hast keine Ahnung, worin du dich hier einmischst!
actors.mobs.dwarfking.lifelink_1=Ich benötige etwas von deiner Essenz, Sklave!
actors.mobs.dwarfking.lifelink_2=Blute für mich, Sklave!
actors.mobs.dwarfking.teleport_1=Mach sie fertig, Sklave!
actors.mobs.dwarfking.teleport_2=Halte sie beschäftigt, Sklave!
actors.mobs.dwarfking.wave_1=Genug! Erhebt euch, meine Sklaven!
actors.mobs.dwarfking.wave_2=Mehr! Blutet für euren König!
actors.mobs.dwarfking.wave_3=Das ist nutzlos! TÖTET SIE JETZT!
actors.mobs.dwarfking.enraged=Du kannst mich nicht töten, %s. ICH. BIN. UNSTERBLICH!
actors.mobs.dwarfking.losing=Nein! Das kannst du nicht tun... du hast keine Ahnung, was hierunter liegt...
actors.mobs.dwarfking.defeated=Du hast... uns allen das Verderben gebracht...
actors.mobs.dwarfking.rankings_desc=Fiel vor dem König der Zwerge
actors.mobs.dwarfking.desc=Vor vielen Jahren entdeckte einer der höchsten Zauberer am Hof der Zwerge Geheimnisse, die ihm unglaubliche Macht über Leben und Tod verliehen. Schon bald missbrauchte er diese Macht, unterjochte und verdarb seinesgleichen, seinen König, und schließlich jeden der Zwergenbürger. Seither ist er König, Gebieter über eine Legion untoter Vasallen.\n\nDer Zwergenkönig ist ein aggressiver Feind, der seine Gegner bevorzugt durch Horden seiner untoten Lakaien umzingelt und überwältigt.
actors.mobs.dwarfking$dkghoul.rankings_desc=Fiel vor dem König der Zwerge
actors.mobs.dwarfking$dkmonk.rankings_desc=Fiel vor dem König der Zwerge
actors.mobs.dwarfking$dkwarlock.rankings_desc=Fiel vor dem König der Zwerge
actors.mobs.dwarfking$dkgolem.rankings_desc=Fiel vor dem König der Zwerge

actors.mobs.ebonymimic.name=Ebenholz-Mimik
actors.mobs.ebonymimic.reveal=Da war ein Mimik!
actors.mobs.ebonymimic.hidden_name=verdächtiger Umriss
actors.mobs.ebonymimic.hidden_desc=Es scheint etwas da zu sein, aber es ist fast vollkommen durchsichtig.
actors.mobs.ebonymimic.desc=Mimiks sind magische Kreaturen, die jede beliebige Gestalt annehmen können. Im Dungeon nehmen sie fast immer die Gestalt einer Schatztruhe an, um damit arglose Abenteurer zu verführen.\n\nEbenholz-Mimiks sind verstohlene Mimiks, die über die Fähigkeit verfügen, nahezu unsichtbar zu werden. Sie lauern auf Dingen, mit denen Abenteurer wahrscheinlich interagieren werden, beinhalten aber auch eigene Beute. Sie sind nicht zäher als normale Mimiks, sobald sie entdeckt werden, aber ihr Überraschungsbiss ist verheerend.
actors.mobs.ebonymimic.discover_hint=Du kannst diesen Gegner mit einem bestimmten Kleinod finden.

actors.mobs.elemental$fireelemental.name=Feuerelementar
actors.mobs.elemental$fireelemental.desc=Elementare sind chaotische Wesen, die häufig hervorgebracht werden, wenn starke okkulte Magie nicht richtig kontrolliert wird. Elementare haben nur geringe Intelligenz, sie sind üblicherweise mit einer bestimmten Art von Magie verbunden.\n\nFeuerelementare sind eine häufige Art von Elementaren, sie fügen durch Feuermagie Schaden zu. Im Nahkampf setzen sie ihr Ziel in Brand, und gelegentlich können sie auch Feuerschläge schießen.
actors.mobs.elemental$newbornfireelemental.name=neugeborenes Feuerelementar
actors.mobs.elemental$newbornfireelemental.charging=Das Elementar lädt sich auf!
actors.mobs.elemental$newbornfireelemental.desc=Elementare sind chaotische Wesen, die häufig hervorgebracht werden, wenn starke, okkulte Magie nicht richtig kontrolliert wird. Elementare haben nur geringe Intelligenz, sie sind üblicherweise mit einer bestimmten Art von Magie verbunden.\n\nDieses Feuerelementar ist frisch beschworen, aber trotzdem schon ziemlich gefährlich!
actors.mobs.elemental$newbornfireelemental.desc_boss=Weil es so stümperhaft beschworen wurde, kann dieses Elementar Feuer erst nach einem Zug Aufladung und nur in ungenauen Stößen verschießen.
actors.mobs.elemental$newbornfireelemental.desc_ally=Da dieses Elementar durch einen Zauberspruch beschworen wurde, hat es etwas mehr Kontrolle über seine Flamme. Es ist zu Fernangriffen nicht in der Lage, aber es kann Feinde durch Nahkampfangriffe in Flammen setzen.
actors.mobs.elemental$newbornfireelemental.discover_hint=Du kannst diesen Gegner während einer bestimmten Aufgabe finden.
actors.mobs.elemental$frostelemental.name=Frostelementar
actors.mobs.elemental$frostelemental.desc=Elementare sind chaotische Wesen, die häufig hervorgebracht werden, wenn starke okkulte Magie nicht richtig kontrolliert wird. Elementare haben nur geringe Intelligenz, sie sind üblicherweise mit einer bestimmten Art von Magie verbunden.\n\nFrostelementare sind eine häufige Art von Elementaren, sie schwächen ihre Feinde durch Kälte-Magie. Sie frieren ihr Ziel im Nahkampf oder durch einen gelegentlichen Fernkampfangriff ein. Ihre Magie ist in Wasser wesentlich effektiver.
actors.mobs.elemental$shockelemental.name=Schockelementar
actors.mobs.elemental$shockelemental.desc=Elementare sind chaotische Wesen, die häufig hervorgebracht werden, wenn starke okkulte Magie nicht richtig kontrolliert wird. Elementare haben nur geringe Intelligenz, sie sind üblicherweise mit einer bestimmten Art von Magie verbunden.\n\nSchockelementare sind eine weniger häufige Art von Elementaren, sie zerreißen ihre Feinde durch Stromschläge und Lichtblitze. Im Nahkampf teilen sie Stromschläge an nahe befindliche Feinde aus, und dem Primärziel fügen sie zusätzlichen Schaden zu, wenn sie sich im Wasser befinden. Mitunter können sie auch einen Fernangriff mittels Lichtblitz gegen ihr Ziel richten, welcher dieses zeitweilig blendet.
actors.mobs.elemental$chaoselemental.name=Chaoselementar
actors.mobs.elemental$chaoselemental.desc=Elementare sind chaotische Wesen, die häufig hervorgebracht werden, wenn starke okkulte Magie nicht richtig kontrolliert wird. Elementare haben nur geringe Intelligenz, sie sind üblicherweise mit einer bestimmten Art von Magie verbunden.\n\nChaoselementare sind eine seltene und gefährliche Art von Elementaren, die sich noch in keinem bestimmten Element stabilisiert haben. Beim Angriff entfesseln sie wilde und unvorhersehbare Magie.

actors.mobs.eye.name=Übles Auge
actors.mobs.eye.deathgaze_kill=Der Blick des Bösen hat dich getötet...
actors.mobs.eye.desc=Üble Augen sind schwebende Bälle aufgestauter dämonischer Energie. Sie besitzen Nahkampffähigkeiten, aber ihre wahre Stärke zeigt sich durch ihre magischen Kräfte.\n\nNachdem sie kurz Energie aufbauen verschießt ein Übles Auge einen verheerenden Energiestrahl, welcher _Todesblick_ genannt wird. Alles im Sichtfeld des Üblen Auges nimmt enormen Schaden. Kluge Abenteurer nehmen hier schnell Deckung.

actors.mobs.fetidrat.name=verfaulende Ratte
actors.mobs.fetidrat.desc=Es ist offensichtlich, dass etwas mit dieser Ratte nicht stimmt. Ihr schmieriges, schwarzes Fell und die faulende Haut sind keineswegs mit den gesunden Ratten vergleichbar, welche du bisher gesehen hast. Ihre blassen, grünen Augen lassen sie besonders bedrohlich erscheinen.\n\nDie Ratte sondert eine übelriechende Wolke ab und der Gestank macht dich benommen, wenn du nahe herankommst.\n\nDunkler Schleim tropft Ihr aus dem Mundwinkel, welcher sich durch den Boden frisst. Es scheint sich aber in Wasser aufzulösen.
actors.mobs.fetidrat.discover_hint=Du kannst diesen Gegner während einer bestimmten Aufgabe finden.

actors.mobs.fungalcore.name=Pilzkern
actors.mobs.fungalcore.desc=Dieser gigantische Pilz muss wohl die Quelle für den Pilzbefall in dieser Höhle sein.

actors.mobs.fungalsentry.name=Pilzwache
actors.mobs.fungalsentry.desc=Dieser besonders hohe Pilz fungiert als Verteidigungsstellung für das grössere, in dieser Höhle lebende Pilzgeflecht.\n\nEr ist unbeweglich, aber er schiesst präzise Giftstösse gegen alles, was in seine Sicht gerät. Der Einschlag dieser Stösse ist recht schwach, _aber das Gift kann sich schnell zu tödlichen Mengen summieren._ Er kann zwar getötet werden, aber besser wäre es, ihn zu meiden.

actors.mobs.fungalspinner.name=Pilzspinner
actors.mobs.fungalspinner.desc=Dieser Höhlenspinner wird von einem parasitären Pilz kontrolliert. Der Pilz hat auch seine Fähigkeiten verändert; seine Spinn- und Giftdrüsen wurden durch den Pilz überwuchert.\n\nDer Pilzspinner wird dich statt mit Netzen mit Grünzeug bespucken, dadurch die Pilzsporen verbreiten und dich eventuell verwurzeln. Er kann dich nicht vergiften, aber er erreicht erhebliche Schadensresistenz, wenn er sich direkt neben einem Pilz befindet.

actors.mobs.ghoul.name=Zwergen-Wiedergänger
actors.mobs.ghoul.desc=Als die Zwergengesellschaft allmählich zusammenbrach und der jetzige Zwergenkönig uneingeschränkte Macht an sich riss, wurde die Schwachen und die, welche ihm widerstanden, nicht gerade fein behandelt. Als der König immer besser mit der Handhabung dunkler Magie vertraut wurde, unterjochte er diese Zwerge seinem Willen, und nun bilden sie das Fußvolk seiner Armee.\n\nWiedergänger sind für sich genommen nicht besonders stark, aber sie bewegen sich in Gruppen und es ist sehr viel schwerer, sie zur Strecke zu bringen, wenn sie in großer Zahl auftreten. _Wenn ein Wiedergänger besiegt wurde, wird er einige Züge später wieder auferstehen, solange noch ein anderer Wiedergänger in der Nähe ist._

actors.mobs.gnoll.name=Gnoll-Späher
actors.mobs.gnoll.desc=Gnolle sind Hyänen-ähnliche Humanoide. Sie hausen in der Kanalisation dieses Dungeons und wagen sich manchmal hinauf an die Oberfläche, um diese zu überfallen. Gnoll-Späher sind normale Mitglieder ihres Stammes,; Sie sind nicht so stark wie Rohlinge und nicht so intelligent wie Schamanen.

actors.mobs.gnollexile.name=verbannter Gnoll
actors.mobs.gnollexile.desc=Dieser graupelzige Gnoll hat eine große Markierung auf der Schulter, welche ihn als Verbannten markiert. Gnolle werden normalerweise von ihrer Gesellschaft ausgeschlossen, wenn sie Regeln ignorieren oder Gesetze brechen. Verbannte müssen stark und schlau sein, um zu überleben. Dieser hier scheint zu wissen, wie er den Speer in seiner Hand verwenden kann.
actors.mobs.gnollexile.desc_passive=_Der verbannte Gnoll greift nicht an._ Er scheint nicht so aggressiv wie die anderen Gnolle hier zu sein, und denkt wahrscheinlich nicht, dass es sich lohnt, gegen dich zu kämpfen. Du könntest ihn vorbeiziehen lassen, aber er trägt einen Rucksack, der voll mit nützlichen Gegenständen sein könnte...
actors.mobs.gnollexile.desc_aggro=_Der verbannte Gnoll schaut zornig um sich._ Es scheint, als hätte er sich letztendlich doch für den Kampf entschieden. Pass auf, ein Speer!
actors.mobs.gnollexile.seen_passive=Der speerschwingende Gnoll schaut dich warnend an, greift aber nicht an.
actors.mobs.gnollexile.seen_aggro=Der speerschwingende Gnoll greift an!

actors.mobs.gnollgeomancer.name=Gnoll-Geomant
actors.mobs.gnollgeomancer.warning=Der Geomant beginnt sich zu rühren. Vergewissere dich, dass du bereit bist, bevor du fortfährst!
actors.mobs.gnollgeomancer.alert=Der Geomant erwacht! Die gesamte Höhle scheint in Bewegung zu geraten, als er mit verrücktem Gelächter davonspringt!
actors.mobs.gnollgeomancer.rock_kill=Der fliegende Felsbrocken hat dich erschlagen...
actors.mobs.gnollgeomancer.rockfall_kill=Herunterfallende Felsbrocken haben dich erschlagen...
actors.mobs.gnollgeomancer.desc=Dieser beeindruckend große, ältere Gnoll muss wohl die Quelle der verschiedenen Erdreich bewegenden Magie sein, die hier wirkt, und er ist wohl auch der Anführer der ganzen Gnoll-Aktivität. Im Unterschied zu den hier rumorenden Gnoll-Pionieren ist der Geomant in seiner Magie gut bewandert, und er kann nicht durch geworfene oder fallende Steine verletzt werden. Dabei hat er aber keinerlei Möglichkeit für den Nahkampf.
actors.mobs.gnollgeomancer.desc_armor=Der Geomant ist derzeit in einer Schicht aus Steinrüstung eingekapselt. _Du musst nahe heran, um sie mit deiner Spitzhacke zu brechen, bevor du dem Geomanten Schaden zufügen kannst._
actors.mobs.gnollgeomancer.desc_armor_sapper=_Ein Gnoll-Pionier in der Nähe hält ein Gerät, das die Steinrüstung des Geomanten mit Energie versorgt. Momentan kannst du sie in keiner Weise beschädigen!_
actors.mobs.gnollgeomancer.desc_sleeping=Dieser beeindruckend große Gnoll-Schamane ist von einer Steinschicht umgeben und sieht beinahe wie eine Statue aus. Bei genauerem Hinsehen erkennt man, wie die Steine sich auf magische Weise im Einklang mit dem Atem des älteren Gnolls bewegen. Solange er auf diese Weise in Stein eingekapselt ist, kann er nicht verletzt werden, und derzeit schläft er buchstäblich wie ein Stein.\n\nDu kannst mit deiner Spitzhacke vermutlich durch die Steinschichten hacken, aber _mach dich auf einen Kampf gefasst, wenn du das tust._ Der Geomant muss wohl die Quelle der verschiedenen Erdreich bewegenden Magie sein, die hier wirkt, und er ist wohl auch der Anführer der ganzen Gnoll-Aktivität. _Es wäre keine schlechte Idee, die hier versprengten Gnolle zu besiegen, bevor du ihn angreifst._
actors.mobs.gnollgeomancer.discover_hint=Du kannst diesen Gegner während einer bestimmten Aufgabe finden.

actors.mobs.gnollguard.name=Gnoll-Wächter
actors.mobs.gnollguard.def_verb=geblockt
actors.mobs.gnollguard.spear_warn=Der Gnoll landet einen bösen Treffer mit der Spitze seines Speers!
actors.mobs.gnollguard.desc=Ein groß und stark aussehender Gnoll, bewaffnet mit Speer und Schild, aber ohne Helm. Diese Wächter sind wahrscheinlich Grobiane in Ausbildung, die man dazu abgestellt hat, die Mine vor eindringenden Wildtieren schützen zu helfen.\n\nDer Gnoll-Wächter ist stark genug, um den Speer mit einer Hand zu führen, aber er ist nicht sehr gut damit. _Er braucht genug offenes Gelände, um damit aus der Entfernung anzugreifen, und er verursacht wesentlich weniger Schaden, wenn du nah genug dran bist._
actors.mobs.gnollguard.desc_armor=_Ein Gnoll-Pionier in der Nähe hält ein Gerät, das diesem Wächter eine irdene Rüstung verleiht, die ihm zugefügten Schaden wesentlich verringert._
actors.mobs.gnollguard.discover_hint=Du kannst diesen Gegner während einer bestimmten Aufgabe finden.

actors.mobs.gnollsapper.name=Gnoll-Pionier
actors.mobs.gnollsapper.desc=Ein kleiner und schwacher, aber intelligenter Gnoll mit bleichem Fell und einem Ranzen voll von verschiedenen Geräten. Sie sind vermutlich hier, um Dunkelgold zu erkunden und zu schürfen und haben zu ihrem Schutz einen Wächter in der Nähe. Sie können zwar kämpfen, aber ihre Angriffe sind erbärmlich schwach, nicht stärker als die eines Gnoll-Spähers.\n\nAnstelle eines direkten Kampfes bevorzugen es die Pioniere, ihre verschiedenen Geräte einzusetzen, um so das Gestein für sich kämpfen zu lassen. Sie selbst sind nicht mit Erdreich bewegender Magie vertraut und werden daher umso mehr Gebrauch von ihren Geräten und Vorrichtungen machen. _Es dürfte eine Menge Wege geben, ihre Angriffe gegen sie selbst oder gegen ihren Wächter zu richten._
actors.mobs.gnollsapper.discover_hint=Du kannst diesen Gegner während einer bestimmten Aufgabe finden.

actors.mobs.gnolltrickster.name=Gnoll-Trickser
actors.mobs.gnolltrickster.desc=Eine merkwürdig ausschauende Kreatur, sogar unter den Gnollen. Er ist gebuckelt und trägt ein boshaftes Grinsen im Gesicht, bedacht darauf seine Schultertasche zu schützen.\n\nEine große Sammlung dürftig gefertigter Pfeile befindet sich in der Tasche, alle davon scheinen mit gefährlichen Substanzen versetzt worden zu sein.
actors.mobs.gnolltrickster.discover_hint=Du kannst diesen Gegner während einer bestimmten Aufgabe finden.

actors.mobs.goldenmimic.name=Gold-Mimik
actors.mobs.goldenmimic.desc=Mimiks sind magische Kreaturen, die jede Gestalt annehmen können, die sie wollen. In den Dungeons wählen sie fast immer die Gestalt einer Schatztruhe, um so arglose Abenteurer zu verführen.\n\nGold-Mimiks sind eine stärkere Art, sie versuchen, die stärksten Abenteurer anzugreifen. Sie haben bessere Schätze, sind aber auch viel stärker als normale Mimiks.

actors.mobs.golem.name=Golem
actors.mobs.golem.def_verb=geblockt
actors.mobs.golem.desc=Golems sind ein Versuch, die früheren Makel an den Zwergenmaschinen durch die neu entdeckte Verwendung von Magie durch die Zwerge zu korrigieren. Sie sind im Vergleich mit dem DM-300 wesentlich kompakter und effizienter, dabei immer noch sehr todbringend.\n\nGolems sind zu groß, um durch enge Passagen zu passen, aber die Zwerge haben ihnen zum Ausgleich magische Kräfte verliehen. Golems können sich selbst von einem Raum zum anderen teleportieren, und sie können Feinde zu sich heranteleportieren, wenn diese außer Reichweite sind.

actors.mobs.goo.name=Schleim
actors.mobs.goo.notice=GLUPP-GLUPP!
actors.mobs.goo.defeated=glupp.... glupp...
actors.mobs.goo.!!!=!!!
actors.mobs.goo.pumpup=Der Schleim bläht sich auf!
actors.mobs.goo.enraged=Wütend
actors.mobs.goo.gluuurp=GLUUUUPP!
actors.mobs.goo.rankings_desc=Vom Schleim absorbiert
actors.mobs.goo.desc=Es ist wenig über den Schleim bekannt. Es kann gut sein, dass er nicht mal eine Kreatur ist, sondern eher eine Ansammlung von abscheulichen Substanzen der Kanalisation, die irgendwie intelligent geworden sind. Unabhängig davon ist es die dunkle Magie die diesem Wesen erlaubt zu existieren\n\nSeine glibbrige Beschaffenheit ließ ihn viel dunkle Magie absorbieren, du fühlst schon eine Kälte nur, weil du hier bist. Wenn der Schleim dich mit seiner Energie angreifen kann, wirst du nicht lange leben.

actors.mobs.greatcrab.name=große Krabbe
actors.mobs.greatcrab.noticed=Die Krabbe verteidigt sich mit ihrer riesigen Scherenklaue.
actors.mobs.greatcrab.def_verb=geblockt
actors.mobs.greatcrab.desc=Diese Krabbe ist riesig, sogar im Vergleich mit anderen Kanalkrabben. Ihre blaue Schale ist von Rissen und Seepocken überzogen und weisen auf ein hohes Alter hin. Sie bewegt sich schwerfällig umher, dabei schafft Sie es eben gerade Ihr Gleichgewicht mit der enormen Scherenklaue zu bewahren. Obwohl diese Krabbe nur eine Scherenklaue hat, gleicht ihre Größe das leicht aus. Die Krabbe hält die Klaue vor sich, wenn immer sie einen Feind erblickt, damit schützt sie sich vor Angriffen hinter einem undurchdringlichen Schutzpanzer. Jedoch kann die Krabbe sich nicht gegen Angriffe verteidigen, die sie nicht kommen sieht oder die von mehreren Gegnern ausgehen.
actors.mobs.greatcrab.discover_hint=Du kannst diesen Gegner während einer bestimmten Aufgabe finden.

actors.mobs.guard.name=Gefängniswache
actors.mobs.guard.scorpion=Komm hierher!
actors.mobs.guard.def_verb=geblockt
actors.mobs.guard.desc=Einst Hüter des unterirdischen Gefängnisses, sind diese Wächter schon lange nicht mehr besser als die Insassen. Sie schleppen sich fort wie Zombies, hirnlos durch die Hallen streifend auf der Suche nach allem, was dort nicht hingehört, so wie du!\n\nSie tragen Ketten um ihre Hüfte, möglicherweise, um Feinde nah heranzuziehen.

actors.mobs.hermitcrab.name=Einsiedlerkrabbe
actors.mobs.hermitcrab.def_verb=geblockt
actors.mobs.hermitcrab.desc=Aus irgendeinem Grund hat sich diese Kanalkrabbe entschieden, den abgebrochenen oberen Teil eines Fasses auf ihrem Kopf zu tragen. Das zusätzliche Gewicht verlangsamt sie auf normale Geschwindigkeit, beschert ihr aber bedeutend mehr Verteidigungskraft. Du glaubst allerdings, irgendetwas im Fass herumspringen zu hören...

actors.mobs.mimic.name=Mimik
actors.mobs.mimic.reveal=Diese Truhe ist ein Mimik!
actors.mobs.mimic.hidden_hint=An dieser Kiste scheint etwas eigenartig zu sein... Es wäre keine gute Idee, da heranzugehen und sie zu öffnen versuchen.
actors.mobs.mimic.desc=Mimiks sind magische Kreaturen, die jede Gestalt annehmen können, die sie wollen. In den Dungeons wählen sie fast immer die Gestalt einer Schatztruhe, um so arglose Abenteurer zu verführen.\n\nMimiks fügen heftige Bisse zu, aber sie haben oft mehr Schätze, als eine normale Truhe.
actors.mobs.mimic.discover_hint=Du kannst diesen Gegner überall im Dungeon finden

actors.mobs.necromancer.name=Nekromant
actors.mobs.necromancer.desc=Diese Schüler von dunklen Magiern haben sich im Gefängnis zusammengerottet, da es der perfekte Ort ist, wo sie ihre dunkle Kunst ausüben können.\n\nNekromanten werden Skelette beschwören und verzaubern, sodass sie für die Nekromanten kämpfen. Wird der Nekromant getötet, so stirbt auch das Skelett, das er beschworen hat.
actors.mobs.necromancer$necroskeleton.name=Skelett des Nekromanten
actors.mobs.necromancer$necroskeleton.desc=Dieses Skelett wurde von einem Nekromanten zum Leben erweckt. Es verhält sich wie ein normales Skelett und wird sterben, sobald der Nekromant, der es herbeigerufen hat, getötet wurde.

actors.mobs.mob.died=Du hörst etwas in der Ferne sterben.
actors.mobs.mob.rage=#$%^
actors.mobs.mob.rankings_desc=Getötet von: %s
actors.mobs.mob.discover_hint=Du findest diesen Gegner in einer bestimmten Region im Dungeon.

actors.mobs.monk.name=Zwergenmönch
actors.mobs.monk.def_verb=geblockt
actors.mobs.monk.parried=pariert
actors.mobs.monk.desc=Diese Mönche sind Fanatiker, welche sich dem Schutz ihres Königs durch körperliche Kraft verschrieben haben. Ihre Ergebenheit ist so groß, dass sie ihren Geist vollständig ihrem König unterstellt haben, und nun streifen sie in der Zwergenstadt wie geistlose Zombies umher.\n\nMönche verlassen sich einzig auf die Kunst des Nahkampfs, sie sind dazu in der Lage, ihre unbewaffneten Fäuste sowohl offensiv, als auch defensiv einzusetzen. Wenn sie sich konzentrieren, werden Mönche die nächste physische Attacke gegen sie abwehren, selbst, wenn diese normalerweise garantiert getroffen hätte. Mönche bauen schneller Konzentration auf, wenn sie sich bewegen, und im direkten Kampf langsamer.
actors.mobs.monk$focus.name=konzentriert
actors.mobs.monk$focus.desc=Dieser Mönch ist vollständig auf sein Ziel konzentriert und scheint dessen Bewegungen vorauszuahnen, bevor diese passieren.\n\nWährend er so konzentriert ist, wird die nächste physische Attacke gegen diesen Charakter garantiert fehlgehen, ganz egal, unter welchen Bedingungen sie stattfindet. Die Abwehr dieser Attacke wird die Konzentration des Mönchs aufbrauchen, und er wird sie wieder aufbauen müssen, um eine weitere Attacke abzuwehren. Mönche bauen schneller Konzentration auf, wenn sie sich bewegen.

actors.mobs.phantompiranha.name=Phantom-Piranha
actors.mobs.phantompiranha.teleport_away=Der Phantom-Piranha teleportiert sich davon...
actors.mobs.phantompiranha.desc=Phantom-Piranhas sind eine seltene Piranha-Art mit magischen Fähigkeiten und unheimlich transparenten Körpern. Wenn sie angegriffen werden, können sie sich teleportieren - entweder in Sicherheit, oder in Angriffsreichweite zu ihrem Gegner!\n\nSie zu bekämpfen ist zwar ermüdend, aber ihr Fleisch ist für seine magischen Eigenschaften berühmt.

actors.mobs.piranha.name=Riesenpiranha
actors.mobs.piranha.desc=Diese fleischfressenden Fische wurden speziell gezüchtet, um überflutete Bereiche zu beschützen. Ihre Bisse sind tödlich, daher ist es besser, die direkte Konfrontation zu vermeiden.
actors.mobs.piranha.discover_hint=Du kannst diesen Gegner überall im Dungeon finden.

actors.mobs.pylon.name=Strommast
actors.mobs.pylon.desc_inactive=Ein Strommast, welcher dazu gedacht ist, die Elektrizität zu regeln, die die Maschinen hier in dieser Gegend versorgt.\n\nDieser Mast ist derzeit nicht aktiv und gegen Schaden immun.
actors.mobs.pylon.desc_active=Ein Strommast, welcher dazu gedacht ist, die Elektrizität zu regeln, die die Maschinen hier in dieser Gegend versorgt. Dieser Mast summt geradezu von der elektrischen Energie, das muss es wohl sein, woher der DM-300 seine Superladung hat!\n\nIn diesem Zustand sind die Strommasten verwundbar, jedoch werden sie im Uhrzeigersinn Stromschläge in die umgebenden Felder schießen. Aufgrund ihrer massiven metallischen Bauweise können Strommasten eine große Menge an Schaden absorbieren.

actors.mobs.rat.name=Beutelratte
actors.mobs.rat.desc=Beutelratten sind aggressive, aber recht schwache Bewohner der Kanalisation. Sie können unangenehm zubeißen, sind jedoch nur in größeren Gruppen lebensbedrohlich.

actors.mobs.ripperdemon.name=Schlitzer-Dämon
actors.mobs.ripperdemon.leap=Der Schlitzer-Dämon bereitet sich auf den Sprung vor!
actors.mobs.ripperdemon.desc=Diese schrecklichen Kreaturen sind das Ergebnis von dämonischen Mächten, die die vielen Zwergenkadaver in dieser Region für ihre Zwecke nutzen. Schlitzer-Dämonen sind abgemagerte schaurige Kreaturen, die Zwergen ähneln, aber mit gebrochenen Körpern und langen scharfen Krallen aus Knochen.\n\nSchlitzer-Dämonen sind nicht besonders widerstandsfähig, aber sie sind wendig und gefährlich. Sie sind in der Lage, große Entfernungen zu überspringen, um Ziele schnell zu erreichen, bevor sie sie mit ihren Klauen aufspießen.

actors.mobs.rotheart.name=Fäulnisherz
actors.mobs.rotheart.desc=Die Frucht der Fäulnispflanze ist sehr einzigartig. Anstatt zu verrotten und Nährstoffe herzugeben, wächst diese Frucht, verhärtet sich und umschließt den Samen. Sie schützt damit die inneren Organe, welche in der Frucht wachsen. Diese große Kugelform bezeichnet man als das Herz einer ausgewachsenen Fäulnispflanze.
actors.mobs.rotheart.discover_hint=Du kannst diesen Gegner während einer bestimmten Aufgabe finden.

actors.mobs.rotlasher.name=Fäulnispeitsche
actors.mobs.rotlasher.desc=Die Fäulnispeitsche ist Teil der Wurzelstruktur einer reifen Faulbeerenpflanze und zugleich ihr wichtigstes Verteidigungsmittel. Peitschen sind blind und stecken fest im Boden, greifen aber jede Bedrohung, die ihnen nahe kommt, heftig an. Wenn es keine Feinde in der Nähe gibt, stehen sie bewegungslos und versuchen, sich in die umgebende Vegetation einzufügen.
actors.mobs.rotlasher.discover_hint=Du kannst diesen Gegner während einer bestimmten Aufgabe finden.

actors.mobs.scorpio.name=Skorpion
actors.mobs.scorpio.desc=Diese riesigen, spinnenartigen Dämonenkreaturen vermeiden den Nahkampf, sie ziehen es vor, verkrüppelnde, zahnbesetzte Stacheln aus weiter Entfernung zu schießen.

actors.mobs.senior.name=Ältesten-Mönch
actors.mobs.senior.desc=Diese Mönche sind Fanatiker, welche sich dem Schutz ihres Königs durch körperliche Kraft verschrieben haben. Ihre Ergebenheit ist so groß, dass sie ihren Geist vollständig ihrem König unterstellt haben, und nun streifen sie in der Zwergenstadt wie geistlose Zombies umher.\n\nDieser Mönch beherrscht den Nahkampf, er kann in Bewegung viel schneller an Konzentration gewinnen als normale Mönche. Wenn sie sich konzentrieren, werden Mönche die nächste physische Attacke gegen sie abwehren, selbst, wenn diese normalerweise garantiert getroffen hätte. Mönche bauen schneller Konzentration auf, wenn sie in Bewegung sind, und im direkten Kampf langsamer.

actors.mobs.shaman.name=Gnoll-Schamane
actors.mobs.shaman.bolt_kill=Der Zauberblitz hat dich getötet...
actors.mobs.shaman.desc=Gnollschamanen sind intelligente Gnolle, die Kampfmagie nutzen können und so ihre fehlende Stärke aufwiegen. Sie haben in der Gnoll-Gesellschaft trotz ihrer größeren Schwäche eine sehr ehrbare Stellung.
actors.mobs.shaman$redshaman.spell_desc=Dieser Schamane trägt eine rote Maske, er wird Magie einsetzen, die zeitweise _deine Angriffskraft schwächt._
actors.mobs.shaman$blueshaman.spell_desc=Dieser Schamane trägt eine blaue Maske, er wird Magie einsetzen, die zeitweise _den dir zugefügten Schaden erhöht._
actors.mobs.shaman$purpleshaman.spell_desc=Dieser Schamane trägt eine violette Maske, er wird Magie einsetzen, die zeitweise _deine Zielgenauigkeit und Fähigkeit zum Ausweichen herabsetzt._

actors.mobs.armoredbrute.name=gepanzerter Grobian
actors.mobs.armoredbrute.desc=Die ältesten unter den Gnoll-Grobianen tragen oft starke Rüstungen, um ihren Status zur Schau zu stellen. Die Rüstung macht diese Grobiane wesentlich unempfindlicher gegen physischen Schaden, und ihre bessere Disziplin bedeutet, dass sie wesentlich länger in Raserei verfallen sein können, bevor sie an ihren Wunden zugrunde gehen.

actors.mobs.skeleton.name=Skelett
actors.mobs.skeleton.explo_kill=Du wurdest durch eine Knochenexplosion getötet...
actors.mobs.skeleton.def_verb=geblockt
actors.mobs.skeleton.desc=Skelette bestehen aus den Knochen glückloser Abenteurer und der Insassen des Gefängnisses, welche durch die Ausstrahlung dunkler Magie aus den tieferen Ebenen angetrieben werden. Nachdem sie genug Schaden genommen haben, lösen sie sich in einer Knochenexplosion auf. Knochensplitter aus dieser Explosion fügen allem in der Nähe Schaden zu, aber Rüstungen schwächen diesen Schaden sehr wirksam ab.

actors.mobs.slime.name=Schleim
actors.mobs.slime.def_verb=geblockt
actors.mobs.slime.desc=Schleime sind eigenartige, leicht magische Kreaturen mit einem gummiartigen äußeren Körper und einem flüssigen Kern. Die Abwassersysteme der Stadt versorgen sie mit reichlich Wasser und Nahrung.\n\nWegen ihrer elastischen äußeren Membran ist es schwierig, einem Schleim mehr als _6 Schaden_ pro Attacke zuzufügen.

actors.mobs.snake.name=Kanalschlange
actors.mobs.snake.hint=Versuche, den Suchknopf auf einer Schlange anzuwenden, um zu erfahren, wie man sie bekämpfen kann.
actors.mobs.snake.desc=Diese übergroßen Schlangen können sich schnell um Angriffe herumschlängeln, was es ziemlich schwer macht, sie zu treffen. Allerdings können magische oder Überraschungsangriffe sie kalt erwischen.\n\nDu kannst einen Überraschungsangriff ausführen, indem du angreifst, während du nicht im Sichtfeld der Schlange bist. Eine Möglichkeit wäre, dich von ihr durch eine Tür jagen zu lassen und dann _zuzuschlagen, wenn die Schlange durch die Tür kommt._

actors.mobs.spectralnecromancer.name=Geister-Nekromanten
actors.mobs.spectralnecromancer.desc=Skelette sind zwar das tägliche Brot eines Nekromanten, aber manche ziehen es vor, sich mit anderen, weniger körperlichen Dienern zu beschäftigen. Geister-Nekromanten haben sich für Geister als Diener ihrer Wahl entschieden!\n\nEinzelne Geister sind nicht so stark wie Skelette, aber diese Nekromanten scheuen sich nicht davor, gleich einen ganzen Haufen von ihnen zu beschwören!

actors.mobs.spinner.name=Höhlenspinner
actors.mobs.spinner.desc=Diese grünlichen, behaarten Höhlenspinnen versuchen, den direkten Kampf zu vermeiden. Stattdessen ziehen sie es vor, in einer Entfernung abzuwarten, während ihre Opfer in dem von ihnen abgesonderten Spinnennetz gefangen sind und langsam an ihrem giftigen Biss sterben. Sie sind dazu in der Lage. ihre Netze über große Entfernungen zu verschießen, und versuchen, jeden Weg, den ihr Opfer nimmt, zu blockieren.

actors.mobs.statue.name=belebte Statue
actors.mobs.statue.def_verb=geblockt
actors.mobs.statue.desc=Man könnte denken, dies sei nur eine weitere unbewegliche Statue dieses Dungeons, aber die rot leuchtenden Augen verraten sie.
actors.mobs.statue.desc_weapon=Die Statue an sich ist aus Stein, aber ihr _%s_, das sie bei sich trägt, sieht sehr echt aus.
actors.mobs.statue.discover_hint=Du kannst diesen Gegner überall im Dungeon finden.

actors.mobs.succubus.name=Succubus
actors.mobs.succubus.desc=Succubi sind Dämonen, die den Verstand ihrer Opfer manipulieren. Dieser hier hat die eine blasse, gotisch anmutende Menschengestalt angenommen, vielleicht, um Zwergen-Hexer anzuziehen?\n\nSuccubi können, wenn sie angreifen, ihren Feind zeitweilig betören, wodurch der Feind nicht mehr in der Lage ist, sie direkt anzugreifen. Wenn Succubi einen betörten Feind angreifen, stehlen sie ein wenig Lebenskraft von ihm.

actors.mobs.swarm.name=Fliegenschwarm
actors.mobs.swarm.desc=Der tödliche Schwarm Fliegen summt verärgert. Jeder nicht-magischer Angriff wird ihn in zwei kleinere aber genau so gefährliche Schwärme teilen.

actors.mobs.tengu.name=Tengu
actors.mobs.tengu.notice_gotcha=Hab' ich dich, %s!
actors.mobs.tengu.interesting=Machen wir das Ganze interessanter...
actors.mobs.tengu.notice_have=Jetzt hab' ich dich, %s!
actors.mobs.tengu.defeated=Endlich frei...
actors.mobs.tengu.rankings_desc=Von Tengu gemeuchelt
actors.mobs.tengu.desc=Ein berüchtigter und geheimnisumwobener Meuchelmörder, benannt nach der Maske, welche auf sein Gesicht transplantiert wurde.\n\nDer Tengu wird von großen Schnallen an seinen Handgelenken und Knien unten gehalten, aber seine Ketten scheint er schon vor langer Zeit losgeworden zu sein.\n\nEr wird versuchen, Fallen, trügerische Magie und Präzisionsangriffe zu verwenden, um das letzte Hindernis zu eliminieren, das zwischen ihm und seiner Flucht steht: dich.

actors.mobs.tengu$bombability$bombblob.desc=Eine Wolke aus überhitztem Rauch bläht sich hier auf. Vorsicht, sie wird explodieren!
actors.mobs.tengu$bombability$bombitem.name=Rauchbombe
actors.mobs.tengu$bombability$bombitem.cant_pickup=Sie klebt am Boden, du kannst sie nicht bewegen!
actors.mobs.tengu$bombability$bombitem.desc=Tengu hat eine seltsame Rauchbombe an diese Stelle geworfen, aus der dicker, heißer Rauch austritt. Sie macht laute tickende Geräusche, ganz wie ein Countdown zu einer Explosion!\n\nDie Bombe hat sich mit dem Boden verbunden, du kannst sie nicht aufheben.

actors.mobs.tengu$fireability$fireblob.desc=Tengu hat ein feines Pulver geworfen, welches hier auf Dampf trifft. Es wird sich entzünden!

actors.mobs.tengu$shockerability$shockerblob.desc=Hier steht alles unter Strom. Alles, was auf diesem Feld steht, wird beim nächsten Zug einen Stromschlag abbekommen!
actors.mobs.tengu$shockerability$shockeritem.name=Schocker
actors.mobs.tengu$shockerability$shockeritem.cant_pickup=Zu viel Elektrizität geht davon aus. Du kannst es nicht anfassen!
actors.mobs.tengu$shockerability$shockeritem.desc=Tengu hat hier eine eigenartige Maschine aufgebaut, die aus Teilen von DM-100 zu bestehen scheint. Aus der Maschine sprühen elektrische Funken, dabei scheint es aber, dass sie einem vorhersagbaren Muster folgen.\n\nWegen der ganzen Elektrizität darum gibt es keine Möglichkeit, sie aufzuheben.

actors.mobs.thief.name=verrückter Dieb
actors.mobs.thief.stole=Der Dieb hat %s von dir gestohlen!
actors.mobs.thief.carries=\n\nDer Dieb trägt ein _%s._ Gestohlen, versteht sich.
actors.mobs.thief.escapes=Der Dieb konnte mit deinem %s entkommen!
actors.mobs.thief.desc=Obwohl diese Insassen aus ihren Zellen befreit sind, ist dieser Ort immer noch ihr Gefängnis. Mit der Zeit hat dieser Ort sie sowohl ihres Verstands als auch ihrer Freiheit beraubt. Diese wahnwitzigen Diebe und Banditen haben schon vor langer Zeit vergessen, wer sie sind und warum sie stehlen.\n\nDiese Feinde tendieren dazu, zu stehlen und wegzulaufen, anstatt zu kämpfen. Stelle sicher, sie im Blick zu behalten, sonst wirst du deine gestohlenen Dinge vielleicht nie wieder finden.

actors.mobs.tormentedspirit.name=gequälte Seele
actors.mobs.tormentedspirit.desc=Gequälte Seelen sind eigentlich gutmütige Geister, die allerdings verflucht wurden. Solange sie verflucht sind, werden sie genau wie Spuk alles und jeden angreifen, und sind dazu noch stärker!\n\nEs könnte möglich sein, den Fluch durch Benutzung des richtigen Gegenstandes in unmittelbarer Nähe der gequälten Seele zu lösen. Sicherlich wird die Seele dafür dankbar sein...
actors.mobs.tormentedspirit.thank_you=Danke...

actors.mobs.vaultrat.desc=This rat has some behaviour changes to test out new vault enemy AI:\n_-_ Its movement can be 'heard' through walls\n_-_ It will wander along a pre-set patrol\n_-_ While wandering it has sharply reduced detection range behind the direction it moves in.\n_-_ While sleeping its detection range is also reduced\n_-_ When it detects you it will 'investigate' before swapping to hunting. Investigating enemies move toward you but don't attack and are easier to lose behind doors and corners.

actors.mobs.npcs.vaultsentry.name=vault scanning sentry
actors.mobs.npcs.vaultsentry.desc=Diese Schildwache überprüft das Gebiet in einem Muster. _Da das hier nur ein Testgebiet ist, wird die Schildwache nichts tun, falls sie dich entdeckt._

actors.mobs.npcs.vaultlaser.name=vault laser sentry
actors.mobs.npcs.vaultlaser.desc=Diese Schildwache feuert einen Laser in regelmäßigen Intervallen ab. _Da das hier nur ein Testgebiet ist, wird die Schildwache nichts tun, falls sie dich entdeckt._

actors.mobs.warlock.name=Zwergenhexer
actors.mobs.warlock.bolt_kill=Der Schattenblitz hat dich getötet...
actors.mobs.warlock.desc=Als das Interesse der Zwerge von der Ingenieurskunst zur Magie wechselte, kamen die Hexer in der Stadt an die Macht. Sie begannen mit Elementarmagie, wandten sich aber schnell der Dämonologie und Totenbeschwörung zu. Der stärkste dieser Hexer besetzte den Thron in der Zwergenstadt, und seinen Kumpanen wurde es gestattet, weiterhin ihre dunkle Magie zu praktizieren, solange sie ihm ihren freien Willen unterordnen.\n\nDiese Hexer besitzen starke, zerstörerische Magie, und sie sind dazu in der Lage, zeitweise die Verbesserungsmagie an deiner Ausrüstung außer Kraft zu setzen. Je mehr ein Gegenstand verbessert ist, desto stärker wird er davon betroffen sein.

actors.mobs.wraith.name=Spuk
actors.mobs.wraith.desc=Dies ist ein rachsüchtiges Gespenst eines Sünders, dessen Grabstätte gestört wurde. Da es ein ätherisches Wesen ist, ist es sehr schwer, es mit gewöhnlichen Waffen zu treffen.
actors.mobs.wraith.discover_hint=Du kannst diesen Gegner überall im Dungeon finden.

actors.mobs.yogdzewa.name=Yog-Dzewa
actors.mobs.yogdzewa.notice=ICH. SEHE. DICH.
actors.mobs.yogdzewa.darkness=Die Dunkelheit rückt näher…
actors.mobs.yogdzewa.hope=DEINE. HOFFNUNG. IST. EINE. ILLUSION!
actors.mobs.yogdzewa.defeated=…
actors.mobs.yogdzewa.rankings_desc=Von Yog-Dzewa verschlungen
actors.mobs.yogdzewa.desc=Yog-Dzewa ist ein alter Gott; ein großes Ungeheuer, dessen Einfluss in die Welten der Sterblichen reicht und sie verschlingt, um sein endloses Wachstum zu nähren. Die Zwerge müssen die Aufmerksamkeit dieses kosmischen Grauens erregt haben, als sie mit dunkler Magie experimentierten, und versuchen seitdem, es unter Verschluss zu halten.\n\nYog-Dzewa stammt aus einer Dimension von rohem magischem Chaos und kann seine wahre Form nicht in diese Welt bringen. Stattdessen hat es Avatare erschaffen und dämonische Lakaien beschworen, die hier seine Befehle ausführen.\n\nDieses riesige Auge ist der Brennpunkt von Yog-Dzewas Macht in dieser Welt. Während das Auge selbst unbeweglich ist, ist es in der Lage, mächtige Strahlen dämonischer Magie abzufeuern und eine Vielzahl von Lakaien zu beschwören, die ihn unterstützen.
actors.mobs.yogdzewa.desc_spawners=Du kannst Wellen dämonischer Energie spüren, die von den weiter oben liegenden Ebenen zum Auge strömen. Yog-Dzewa muss diese Energie von Kreaturen, die du dort oben am Leben gelassen hast, beziehen. _Yog wird diese Energie nutzen, um stärkere Lakaien zu beschwören!_
actors.mobs.yogdzewa$larva.name=Gotteslarve
actors.mobs.yogdzewa$larva.rankings_desc=Verschlungen von Yog-Dzewa
actors.mobs.yogdzewa$larva.desc=Diese winzigen Ausgeburten von Yog-Dzewa sind einfache Lakaien, die leicht zu produzieren sind. Obwohl sie einzeln schwach sind, können sie schnell herbeigerufen und in der Masse überwältigend werden.
actors.mobs.yogdzewa$yogripper.rankings_desc=Verschlungen von Yog-Dzewa
actors.mobs.yogdzewa$yogeye.rankings_desc=Verschlungen von Yog-Dzewa
actors.mobs.yogdzewa$yogscorpio.rankings_desc=Verschlungen von Yog-Dzewa

actors.mobs.yogfist.invuln_warn=Diese Faust ist in der Nähe des Auges unverwundbar!
actors.mobs.yogfist.rankings_desc=Verschlungen von Yog-Dzewa
actors.mobs.yogfist.desc=Diese Faust ist ein Bestandteil von Yog-Dzewas Macht. Die Fäuste sind mit seiner Macht verbunden und sind unverwundbar, wenn sie sich in der Nähe des Auges befinden.
actors.mobs.yogfist$burningfist.name=brennende Faust
actors.mobs.yogfist$burningfist.desc=Diese Faust ist aus chaotischer, feuriger Magie geformt. Während sie sich bewegt, wird sie ständig die Umgebung in Brand setzen. Sie ist auch in der Lage, Schüsse mit feuriger Kraft abzufeuern, die beim Aufprall Flammen verbreiten.\n\nDie Fähigkeit der Faust, Flammen zu verbreiten, wird in der Nähe von Wasser unterdrückt, aber ihre Hitze ist so groß, dass das Wasser um sie herum nach kurzer Zeit verdampft!
actors.mobs.yogfist$soiledfist.name=Faust des Erdreichs
actors.mobs.yogfist$soiledfist.desc=Diese Faust ist aus chaotischer irdener Magie geformt. Wenn sie sich bewegt, wird sie ständig Pflanzen um sich herum sprießen lassen. Sie kann auch konzentrierte Erdstöße abschießen, die ihr Ziel in schnell wachsende Reben und Wurzeln fesseln!\n\nDie Faust bezieht Kraft aus diesem Pflanzenleben und widersteht einer gewissen Menge Schaden, je nachdem, wie viel hohe oder zerfurchte Vegetation es in ihrer Nähe gibt!
actors.mobs.yogfist$rottingfist.name=Faust der Fäulnis
actors.mobs.yogfist$rottingfist.desc=Diese Faust ist aus lebendiger Fäulnis geformt. Sie ist eine hoch aufragende Masse aus verwesendem Fleisch, die im Nahkampf ätzenden Schleim und im Fernkampf giftige Gase absondern kann. Schlimmer noch, die große Masse der Faust lässt sie bluten, anstatt direkt Schaden zu nehmen.\n\nMit Wasser kann der Schleim abgewaschen werden, aber die Faust ist auch in der Lage, Wasser zu absorbieren, um sich selbst zu heilen! Außerdem führt eine Beschädigung der Faust, während sie blutet, dazu, dass sich die Blutung zwar erneuert, aber nicht vergrößert!
actors.mobs.yogfist$rustedfist.name=verrostete Faust
actors.mobs.yogfist$rustedfist.desc=Diese Faust ist aus lebendem Metall geformt. Es ist eine hoch aufragende Masse aus sich wandelndem Metall, die mächtige Nahkampfangriffe hat und ihre Ziele aus der Entfernung lahmlegen kann. Aufgrund ihrer enormen Masse nimmt die Faust jeden Schaden, der ihr zugefügt wird, nicht sofort, sondern über einen längeren Zeitraum auf.\n\nDie Faust ist jedoch unflexibel und kann sich nicht in enge Gänge zwängen. Dazu kommt, dass sie Schaden zwar verlangsamt aufnehmen kann, der verzögerte Schaden aber weiter zunehmen wird, wenn die Faust mehrmals getroffen wird.
actors.mobs.yogfist$brightfist.name=Faust des Lichts
actors.mobs.yogfist$brightfist.teleport=Die Faust teleportiert sich mit einem Lichtblitz davon, der dich erheblich blendet!
actors.mobs.yogfist$brightfist.desc=Diese Faust ist aus reiner Lichtenergie geformt. Sie ist in der Lage, bei jedem Zug kräftige Strahlen aus gleißendem Licht zu schießen! Diese Strahlen werden dich vorübergehend blenden und zusätzlich schweren Schaden anrichten. Die Faust ist auch in der Lage, die Arena kurz in blendendes Licht zu tauchen, um zu entkommen!\n\nDie Faust hat jedoch keine besonderen Fähigkeiten, die sie im Nahkampf einsetzen könnte.
actors.mobs.yogfist$darkfist.name=Faust der Dunkelheit
actors.mobs.yogfist$darkfist.teleport=Die Faust teleportiert sich in einem Strudel der Dunkelheit davon, wodurch deine Lichtquelle erlischt!
actors.mobs.yogfist$darkfist.desc=Diese Faust besteht aus purer, dunkler Energie. Sie kann jeden Zug mächtige Strahlen dunkler Magie ausstrahlen! Abgesehen davon, dass sie schweren Schaden verursachen, schwächen diese Strahlen deine Lichtquelle. Die Faust versteht es auch, das Gebiet kurz in Dunkelheit zu hüllen, um zu entkommen!\n\nDiese Faust hat allerdings keine besonderen Fähigkeiten für den Nahkampf.


actors.char.kill=%s hat dich getötet...
actors.char.defeat=du hast besiegt: %s.
actors.char.def_verb=ausgewichen
actors.char.invulnerable=unverwundbar
actors.char.immune=immun

# Eternity PD Fallback Keys
actors.blobs.blizzard.desc=A blizzard is swirling here.
actors.blobs.confusiongas.desc=A cloud of confusion gas is swirling here.
actors.blobs.dancefloor.desc=Dance dance dance!\n%s dancing tile: %s\nNext color: %s
actors.blobs.dancefloor.color_1_name=Red
actors.blobs.dancefloor.color_1_desc=Characters standing on this tile take direct damage (massively increased vs hero)
actors.blobs.dancefloor.color_2_name=Green
actors.blobs.dancefloor.color_2_desc=Characters standing on this tile act at 2x speed
actors.blobs.dancefloor.color_3_name=Blue
actors.blobs.dancefloor.color_3_desc=Characters standing on this tile are stunned
actors.blobs.dancefloor.color_4_name=White
actors.blobs.dancefloor.color_4_desc=Characters standing on this tile take defered damage (massively increased vs hero)
actors.blobs.dancefloor.color_5_name=Yellow
actors.blobs.dancefloor.color_5_desc=Mobs killed on this tile give double EXP and more loot
actors.blobs.dancefloor.color_6_name=Purple
actors.blobs.dancefloor.color_6_desc=Characters standing on this tile take double damage
actors.blobs.dancefloor.rankings_desc=Danced into a grave
actors.blobs.dancefloor.ondeath=You danced into your own grave
actors.blobs.dancefloor$dancingdefereddamage.name=Dancing with Death
actors.blobs.dancefloor$dancingdefereddamage.desc=This is the most dangerous dance you've ever performed, and you are absolutely _ROCKING_ it, disregarding the pain!\n\nDeferred damage remaining: %d.
actors.blobs.dancefloor$dancingdefereddamage.ondeath=You danced into your own grave
actors.blobs.dancefloor$dancingdefereddamage.rankings_desc=Danced into a grave
actors.blobs.dancefloor$dancingdoom.name=Dancing in a grave
actors.blobs.dancefloor$dancingdoom.desc=Grave isn't the best place to dance in, but no one is stopping you!\n\nCharacters who are brave enough to dance in a grave will receive double damage from all sources.
actors.blobs.dancefloor$dancespeed.name=Dancing with Time
actors.blobs.dancefloor$dancespeed.desc=Your perfect dance synchronized with a rhythm of the universe, and not even time gonna stop you from dancing!\n\nWhile you dance is perfect, you will perform all actions at double speed.
actors.blobs.dancefloor$dancingstun.name=Stunned
actors.blobs.dancefloor$dancingstun.heromsg=You are stunned!
actors.blobs.dancefloor$dancingstun.desc=Nothing feels worse than being stunned in a middle of a dance\n\nStun completely halts all actions, forcing the target to wait until the effect wears off.
actors.blobs.electricity.desc=A field of electricity is sparking brightly here.
actors.blobs.electricity.rankings_desc=Electrocuted
actors.blobs.electricity.ondeath=You were shocked to death...
actors.blobs.fire.desc=A fire is raging here.
actors.blobs.foliage.desc=Shafts of light pierce the gloom of the underground garden.
actors.blobs.freezing.desc=The air is unnaturally frigid here.
actors.blobs.goowarn.desc=Specks of dark energy are swarming here!
actors.blobs.inferno.desc=An inferno is raging here.
actors.blobs.paralyticgas.desc=A cloud of paralytic gas is swirling here.
actors.blobs.sacrificialfire.desc=There is an altar here with a sacrificial fire burning atop it. Any creature that's killed here will be consumed as an offering to the spirits of the dungeon.\n\nPerhaps a reward will be given if enough sacrifices are made?
actors.blobs.sacrificialfire.worthy=The fire consumes your offering and grows stronger.
actors.blobs.sacrificialfire.unworthy=The fire consumes your offering, but doesn't change.
actors.blobs.sacrificialfire.reward=The fire flares and then dissipates, leaving a reward behind!
actors.blobs.smokescreen.desc=A cloud of thick black smoke is swirling here.
actors.blobs.stenchgas.desc=A cloud of fetid stench is swirling here.
actors.blobs.stormcloud.desc=A cloud of billowing water vapor is swirling here.
actors.blobs.toxicgas.desc=A greenish cloud of toxic gas is swirling here.
actors.blobs.toxicgas.rankings_desc=Suffocated
actors.blobs.toxicgas.ondeath=You died from the toxic gas...
actors.blobs.corrosivegas.desc=A cloud of deadly caustic gas is swirling here.
actors.blobs.waterofawareness.procced=As you take a sip, you feel knowledge pour into your mind.
actors.blobs.waterofawareness.desc=Power of knowledge radiates from the water of this well. Take a sip from it to reveal all secrets of equipped items and reveal all items on the current floor.
actors.blobs.waterofhealth.procced=As you take a sip, you feel your wounds heal completely.
actors.blobs.waterofhealth.desc=Power of health radiates from the water of this well. Take a sip from it to heal your wounds and satisfy hunger.
actors.blobs.wateroftransmutation.desc=Power of change radiates from the water of this well. Throw an item into the well to turn it into something else.
actors.blobs.web.desc=A thick web is covering everything here. Anything that touches or is thrown through the web will break it, but will also be stuck in place.
actors.buffs.adrenaline.name=adrenaline
actors.buffs.adrenaline.desc=A surge of physical power, adrenaline enhanced both attack and movement speed.\n\nAdrenaline allows its target to run at 2x speed, and attack at 1.5x speed.\n\nTurns remaining: %s.
actors.buffs.adrenalinesurge.name=strength boost
actors.buffs.adrenalinesurge.desc=A surge of great might, but sadly not permanent.\n\nStrength boost: +%d.\nTurns until boost weakens: %s.
actors.buffs.amok.name=amok
actors.buffs.amok.desc=Amok causes a state of great rage and confusion in its target.\n\nWhen a creature is amoked, they will attack whatever is near them, whether they be friend or foe.\n\nTurns of amok remaining: %s.
actors.buffs.arcanearmor.name=arcane armor
actors.buffs.arcanearmor.desc=A thin shield is surrounding you, blocking some of the damage from magical attacks.\n\nYour magical armor is currently boosted by: 0-%d.\n\nTurns until arcane armor weakens: %s.
actors.buffs.artifactrecharge.name=artifact recharging
actors.buffs.artifactrecharge.desc=Energy is coursing through you, increasing the rate your equipped artifacts charge.\n\nEach artifact is affected a little differently, but they will all gain charge much faster than normal.\n\nTurns remaining: %s.
actors.buffs.ascensionchallenge.name=amulet's curse
actors.buffs.ascensionchallenge.desc=Somehow Yog-Dzewa is maintaining influence on this world through the amulet, and is trying to stop your ascent!\n\nYog's power is making the dungeon much more dangerous, increasing the number of enemies and making them stronger! This power will keep building if left unchecked, it can be weakened by defeating enemies that have been enhanced by Yog's power.
actors.buffs.ascensionchallenge.desc_clear=The dark energy radiating from the amulet has been weakened as much as possible for now.
actors.buffs.ascensionchallenge.desc_beckon=The amulet is currently _calling out to distant enemies,_ alerting them to your position.
actors.buffs.ascensionchallenge.desc_haste=The amulet is currently _hastening distant enemies,_ letting them reach you faster!
actors.buffs.ascensionchallenge.desc_slow=The amulet is currently _slowing you down,_ and negating speed boosting effects!
actors.buffs.ascensionchallenge.desc_damage=The energy from the amulet has gotten so strong that it's _directly harming you!_
actors.buffs.ascensionchallenge.beckon=The amulet begins calling out to distant enemies.
actors.buffs.ascensionchallenge.haste=The amulet begins hastening distant enemies!
actors.buffs.ascensionchallenge.slow=The amulet starts to feel like a lead weight in your inventory!
actors.buffs.ascensionchallenge.damage=The amulet begins radiating dark energy. It burns!
actors.buffs.ascensionchallenge.weaken_info=You must defeat enemies to weaken the amulet's curse!
actors.buffs.ascensionchallenge.weaken=You can feel the amulet's curse weaken slightly.
actors.buffs.ascensionchallenge.break=You take a moment to catch your breath and feel your wounds begin to close!
actors.buffs.ascensionchallenge.almost=You feel Yog's grip on the amulet begin to weaken, you're almost there!
actors.buffs.ascensionchallenge.on_kill=The dark energy consumes you...
actors.buffs.barkskin.name=barkskin
actors.buffs.barkskin.desc=Your skin is hardened, it feels rough and solid like bark.\n\nThe hardened skin increases your effective armor, allowing you to better defend against physical attack.\n\nYour armor is currently increased by: 0-%d.\nTurns until barkskin weakens: %s.\n\nIf you receive barkskin from multiple sources, only the strongest one will apply.
actors.buffs.barrier.name=barrier
actors.buffs.barrier.desc=A durable bubble of force which blocks all damage.\n\nThe barrier will take damage for whatever it is protecting so long as there is shielding left. The shielding will also slowly decay over time.\n\nShielding remaining: %d.
actors.buffs.rageshield.name=Determination Shield
actors.buffs.rageshield.heromsg=You are protected by your rage!
actors.buffs.rageshield.desc=A durable bubble of your sheer rage saps away life force from nearby enemies, if you are wounded.\n\nThe barrier will drain health from enemies in your sight, angering them and taking damage. The shielding will have bigger effect if enemy is in adjacent to host.\n\nShielding remaining: %d.
actors.buffs.berserk.angered=angered
actors.buffs.berserk.berserk=berserking
actors.buffs.berserk.exhausted=exhausted
actors.buffs.berserk.recovering=recovering
actors.buffs.berserk.angered_desc=The severity of the Berserker's injuries strengthen his blows. As the berserker takes physical damage, his rage will build, granting him bonus damage. Damage which is blocked by armor still counts towards building rage.\n\nRage will fade over time. The lower the berserker's health, the longer it will last.\n\nAt 100%% rage, the Berserker can go berserk, granting him 2x his seal's max shielding, increasing to 6x if he has very low health. This shielding decays over time and once it runs out the berserker will have to rest before building rage again.\n\nCurrent Rage: _%.0f%%_\n_+%.0f%%_ damage
actors.buffs.berserk.berserk_desc=Fear and uncertainty bleed away, leaving only anger. In this state the Berserker is extremely powerful, _dealing +50% damage and gaining bonus shielding._\n\nThis bonus shielding is equal to 2x his seal's max shielding, increasing to 6x if he has very low health. When this shielding is reduced to 0, berserking will end.\n\nAfter raging, the Berserker will need to recover before being able to build rage again.
actors.buffs.berserk.recovering_desc=Inner strength has its limits. The Berserker must rest before using his rage again.\n\nWhile recovering the Berserker does not build any rage from taking damage.
actors.buffs.berserk.recovering_desc_turns=Turns until recovered: _%d_
actors.buffs.berserk.recovering_desc_levels=Levels until recovered: _%.2f_
actors.buffs.berserk.rankings_desc=Berserked to Death
actors.buffs.berserk.action_name=Berserk
actors.buffs.berserk.no_seal=You need your broken seal to berserk!
actors.buffs.bleeding.name=bleeding
actors.buffs.bleeding.ondeath=You bled to death...
actors.buffs.bleeding.heromsg=You are bleeding!
actors.buffs.bleeding.rankings_desc=Bled to Death
actors.buffs.bleeding.desc=That wound is leaking a worrisome amount of blood.\n\nBleeding causes damage every turn. Each turn the damage decreases by a random amount, until the bleeding eventually stops.\n\nCurrent bleed damage: %d.
actors.buffs.bless.name=blessed
actors.buffs.bless.desc=A great burst of focus, some say it is inspired by the gods.\n\nBlessing increases accuracy and evasion by 25%%, making the blessed much more effective in combat.\nIt also increased experience gain by 2x for heroes and allows them to get more items.\n\nTurns of bless remaining: %s.
actors.buffs.blindness.name=blinded
actors.buffs.blindness.heromsg=You are blinded!
actors.buffs.blindness.desc=Blinding turns the surrounding world into a dark haze.\n\nWhile blinded, a character's vision range is reduced to one tile, rendering ranged attacks useless and making it very easy to lose track of distant enemies. Additionally, a blinded hero is unable to read scrolls or books.\n\nTurns of blindness remaining: %s.
actors.buffs.buff.heromsg=
actors.buffs.burning.name=burning
actors.buffs.burning.heromsg=You catch fire!
actors.buffs.burning.burnsup=%s burns up!
actors.buffs.burning.ondeath=You burned to death...
actors.buffs.burning.rankings_desc=Burned to Ash
actors.buffs.burning.desc=Few things are more distressing than being engulfed in flames.\n\nFire will deal damage every turn until it is put out by water or it expires. Fire can be extinquished by stepping into water, or from the splash of a shattering potion.\n\nAdditionally, the fire may ignite flammable terrain or items that it comes into contact with.\n\nTurns of burning remaining: %s.
actors.buffs.championenemy.warn=You sense a deadly presence.
actors.buffs.championenemy$blazing.name=blazing champion
actors.buffs.championenemy$blazing.desc=Blazing champions deal 25% more melee damage, ignite enemies they attack, are immune to fire, and spread fire around them as they die. They can't spread fire onto water however.
actors.buffs.championenemy$projecting.name=projecting champion
actors.buffs.championenemy$projecting.desc=Projecting champions deal 25% more melee damage and have +3 attack range.
actors.buffs.championenemy$antimagic.name=antimagic champion
actors.buffs.championenemy$antimagic.desc=Antimagic champions take 50% less damage and are completely immune to magical effects.
actors.buffs.championenemy$giant.name=giant champion
actors.buffs.championenemy$giant.desc=Giant champions take 80% less damage and have +1 attack range, but cannot move through enclosed spaces.
actors.buffs.championenemy$blessed.name=blessed champion
actors.buffs.championenemy$blessed.desc=Blessed champions have 4x accuracy and evasion.
actors.buffs.championenemy$growing.name=growing champion
actors.buffs.championenemy$growing.desc=Growing champions gain a steadily increasing bonus to accuracy, evasion, physical damage, and a reduction to damage taken.\n\nCurrent acc/eva/dmg boost: %1$d%%\nCurrent damage reduction: %2$d%%
actors.buffs.championenemy$tanky.name=tanky champion
actors.buffs.championenemy$tanky.desc=Tanky champions receives only 5% of the damage, but reduces their damage and speed by 25%.
actors.buffs.championenemy$speedy.name=speedy champion
actors.buffs.championenemy$speedy.desc=Speedy Champions will gain x4 speed and x1.5 evasion and accuracy.
actors.buffs.championenemy$frozen.name=frozen champion
actors.buffs.championenemy$frozen.desc=Frozen champions deal 25% more melee damage but they have -20% speed, chills enemies they attack and sometimes freezes them, are immune to cold gases or effects, and spread blizzard around them as they die.
actors.buffs.championenemy$blunt.name=blunt champion
actors.buffs.championenemy$blunt.desc=Blunt champions are expert for using their hands or something they use as a blunt weapons, they deal 75% more damage as well as inflicts vertigo when they attack and paralyzes you in rare cases.
actors.buffs.charm.name=charmed
actors.buffs.charm.heromsg=You are charmed!
actors.buffs.charm.cant_attack=You are charmed by that enemy and can't attack them.
actors.buffs.charm.desc=A charm is manipulative magic that can make enemies temporarily adore each other.\n\nCharacters affected by charm are unable to directly attack the enemy they are charmed by. Attacking other targets is still possible however. The shock of pain will lessen the duration of charm.\n\nTurns of charm remaining: %s.
actors.buffs.chill.name=chilled
actors.buffs.chill.freezes=%s freezes!
actors.buffs.chill.desc=Not quite frozen, but still much too cold.\n\nChilled targets perform all actions more slowly, depending on how many turns are left in the effect. At its worst, this is equivalent to being slowed.\n\nTurns of chill remaining: %1$s.\nSpeed is reduced by: %2$s%%
actors.buffs.combo.name=combo
actors.buffs.combo.action_name=combo attack
actors.buffs.combo.combo=%d hit combo!
actors.buffs.combo.bad_target=You must target an enemy in attack range.
actors.buffs.combo.prompt=Select a target to attack.
actors.buffs.combo.desc=The gladiator builds momentum as they land successful blows. Each attack increases the combo counter by one, but taking too long between hits will reset the combo counter to 0.\n\nBuilding combo unlocks special combo attacks that cannot miss! A different attack is unlocked at 2, 4, 6, 8, and 10 combo count. Some moves reset combo and some do not, but each move can only be used once per combo session.\n\nCurrent combo: %1$d.\n\nTurns until Combo is lost: %2$s.
actors.buffs.combo$combomove.clobber.name=clobber
actors.buffs.combo$combomove.clobber.desc=Knocks an enemy back 2 tiles, but deals no damage and cannot knock into pits. Increments combo by 1.
actors.buffs.combo$combomove.clobber.empower_desc=Knocks an enemy back _3 tiles, inflicts vertigo, and can knock into pits,_ but deals no damage. Increments combo by 1.
actors.buffs.combo$combomove.slam.name=slam
actors.buffs.combo$combomove.slam.desc=Deals %d%% (combo*20%%) of your damage blocking power as bonus damage. Resets combo when used.
actors.buffs.combo$combomove.slam.empower_desc=_Leaps up to %1$d tile(s)_ and deals %2$d%% (combo*20%%) of your damage blocking power as bonus damage. Resets combo when used.
actors.buffs.combo$combomove.parry.name=parry
actors.buffs.combo$combomove.parry.desc=Blocks the next attack within 1 turn when activated, and instantly retaliates to it. Resets combo if nothing is parried.
actors.buffs.combo$combomove.parry.empower_desc=Blocks _all attacks_ within 1 turn when activated, and instantly retaliates to them. Resets combo if nothing is parried.
actors.buffs.combo$combomove.crush.name=crush
actors.buffs.combo$combomove.crush.desc=Deals %d%% (combo*25%%) damage to the primary target, and half that damage to all other enemies in a 7x7 AOE. Resets combo when used.
actors.buffs.combo$combomove.crush.empower_desc=_Leaps up to %1$d tile(s)_ and deals %2$d%% (combo*25%%) damage to the primary target, and half that damage to all other enemies in a 7x7 AOE. Resets combo when used.
actors.buffs.combo$combomove.fury.name=fury
actors.buffs.combo$combomove.fury.desc=Hits an enemy once for each combo you have, each hit deals 60% damage and can trigger enchantments. Resets combo when used.
actors.buffs.combo$combomove.fury.empower_desc=_Leaps up to %d tile(s)_ and hits an enemy once for each combo you have, each hit deals 60%% damage and can trigger enchantments. Resets combo when used.
actors.buffs.corruption.name=corrupted
actors.buffs.corruption.desc=Corruption seeps into the essence of a being, twisting them against their former nature.\n\nCorrupted creatures will attack their allies, and ignore their former enemies. Corruption is damaging as well, and will slowly cause its target to succumb.\n\nCorruption is permanent, its effects only end in death.
actors.buffs.cripple.name=crippled
actors.buffs.cripple.heromsg=You are crippled!
actors.buffs.cripple.desc=You're pretty sure legs aren't meant to bend that way.\n\nCrippled halves movement speed, making moving a tile usually take two turns instead of one.\n\nTurns of cripple remaining: %s.
actors.buffs.daze.name=dazed
actors.buffs.daze.heromsg=You are dazed!
actors.buffs.daze.desc=Ringing ears and blurred vision make it difficult to fight.\n\nWhile dazed, accuracy and evasion are reduced by 50%%, making both landing and evading blows much harder.\n\nTurns of daze remaining: %s.
actors.buffs.degrade.name=degraded
actors.buffs.degrade.heromsg=Your equipment feels weaker!
actors.buffs.degrade.desc=Powerful dark magic is sapping the strength that scrolls of upgrade have applied to your equipment!\n\nWhile degraded, upgraded gear will be treated as if it is a lower level than it actually is. _Every upgrade after +3 becomes exponentially weaker than the last one._ The descriptions of your items will change to reflect their reduced power level.\n\nDegradation does not affect strength requirements, wand charges, durability of thrown weapons, or artifacts.\n\nTurns of degradation remaining: %s. Using a scroll of upgrade or remove curse will end degradation immediately.
actors.buffs.doom.name=doomed
actors.buffs.doom.desc=It's hard to keep going when it seems like the universe wants you dead.\n\nDoomed characters will receive +67% damage from all sources.\n\nDoom is permanent, its effects only end in death.
actors.buffs.dread.name=dread
actors.buffs.dread.desc=A terror so great that it will cause its target to flee the dungeon entirely!\n\nCreatures affected by dread will run from their opponent at high speed, and will disappear from the dungeon entirely once they are out of sight. Enemies that are defeated this way award half experience and drop no items. The shock of pain will lessen the duration of dread.\n\nTurns of dread remaining: %d.
actors.buffs.drowsy.name=drowsy
actors.buffs.drowsy.desc=A magical force is making it difficult to stay awake, after a few turns, the target will fall into a deep magical sleep.\n\nThe hero can resist drowsiness by taking damage or by being at full health.\n\nTurns until sleep: %s.
actors.buffs.earthimbue.name=imbued with earth
actors.buffs.earthimbue.desc=You are imbued with the power of earth!\n\nAll physical attacks will shift the earth under the enemy, crippling them for a short time.\n\nTurns of earth imbue remaining: %s.
actors.buffs.enhancedrings.name=enhanced rings
actors.buffs.enhancedrings.desc=The Rogue's recently used artifact is empowering his rings, granting them +1 level.\n\nTurns remaining: %s.
actors.buffs.fireimbue.name=imbued with fire
actors.buffs.fireimbue.desc=You are imbued with the power of fire!\n\nAll physical attacks will have a chance to light enemies ablaze. Additionally, you are completely immune to the effects of fire.\n\nTurns of fire imbue remaining: %s.
actors.buffs.foresight.name=foresight
actors.buffs.foresight.desc=You are somehow able to see the layout of surrounding terrain with your mind.\n\nWhile under the effect of foresight all tiles in a wide radius are revealed to you, including any secret traps or doors.\n\nTurns of foresight remaining: %s.
actors.buffs.frost.name=frozen
actors.buffs.frost.freezes=%s freezes!
actors.buffs.frost.desc=Not to be confused with freezing solid, this more benign freezing simply encases the target in ice.\n\nFreezing acts similarly to paralysis, making it impossible for the target to act. Unlike paralysis, freezing is immediately cancelled if the target takes damage, as the ice will shatter.\n\nTurns of freeze remaining: %s.
actors.buffs.frostimbue.name=imbued with frost
actors.buffs.frostimbue.desc=You are imbued with icy power!\n\nAll physical attacks will steadily stack chill on enemies. Additionally, you are completely immune to the cold.\n\nTurns of frost imbue remaining: %s.
actors.buffs.fury.name=furious
actors.buffs.fury.heromsg=You become furious!
actors.buffs.fury.desc=You are angry, enemies won't like you when you're angry.\n\nA great rage burns within you, increasing the damage you deal with physical attacks by 50%%.\n\nThis rage will last as long as you are injured below 50%% health.
actors.buffs.blobimmunity.name=purification barrier
actors.buffs.blobimmunity.desc=Some strange force is encasing you in a thin protective barrier, blocking out all harmful airborne effects.\n\nYou are immune to all area-bound effects while this barrier lasts.\n\nTurns of immunity remaining: %s.
actors.buffs.greaterhaste.name=greater haste
actors.buffs.greaterhaste.desc=An incredible boost of speed, for a moment it feels as if everything else is standing still.\n\nWhile under the effects of greater haste moving actions take no time at all, but other actions are still performed at normal speed. Each step of movement consumes a turn of greater haste.\n\nTurns of greater haste remaining: %d.
actors.buffs.godspeed.name=Godspeed
actors.buffs.godspeed.desc=Godly energy courses through your whole essence, allowing you to perform actions at incredible speeds!\n\nWhile under the effects of godspeed you will perform all actions at double speed.\n\nTurns of godspeed remaining: %s.
actors.buffs.haste.name=haste
actors.buffs.haste.desc=Energy courses through your muscles, allowing you to run at incredible speeds!\n\nWhile under the effects of haste you will run at 3x speed, but will perform all other actions at normal speed.\n\nTurns of haste remaining: %s.
actors.buffs.healing.name=healing
actors.buffs.healing.desc=A magical remedy is causing wounds to close and flesh to knit.\n\nEvery turn health will steadily regenerate until the healing effect expires. The amount of healing may fade over time.\n\nNext heal: %d.\n\nHealing remaining: %d.
actors.buffs.herodisguise.name=disguise
actors.buffs.herodisguise.desc=Illusory magic has altered your physical appearance! The effect is purely cosmetic, but feels very strange regardless.\n\nTurns of disguise remaining: %s.
actors.buffs.hex.name=hexed
actors.buffs.hex.heromsg=You have been hexed!
actors.buffs.hex.desc=Dark magic which saps focus, making the target slightly disoriented.\n\nHexing reduces accuracy and evasion by 20%%, making the target less effective in combat.\n\nTurns of hex remaining: %s.
actors.buffs.holdfast.name=hold fast
actors.buffs.holdfast.desc=The %s is holding his position, increasing their armor by %d-%d. This will last until they move.
actors.buffs.hunger.hungry=hungry
actors.buffs.hunger.starving=starving
actors.buffs.hunger.onhungry=You are hungry.
actors.buffs.hunger.onstarving=You are starving!
actors.buffs.hunger.ondeath=You starved to death...
actors.buffs.hunger.cursedhorn=The cursed horn steals some of the food energy as you eat.
actors.buffs.hunger.rankings_desc=Starved to Death
actors.buffs.hunger.desc_intro_hungry=You can feel your stomach calling out for food, but it's not too urgent yet.
actors.buffs.hunger.desc_intro_starving=You're so hungry it hurts.
actors.buffs.hunger.desc=\n\nHunger slowly increases as you spend time in the dungeon, eventually you will begin to starve. While starving you will slowly lose health instead of regenerating it.\n\nRationing is important! If you have health to spare starving isn't a bad idea if it means there will be more food later. Effective rationing can make food last a lot longer!
actors.buffs.invisibility.name=invisible
actors.buffs.invisibility.desc=You are completely blended into the surrounding terrain, making you impossible to see.\n\nWhile you are invisible enemies are unable to attack or follow you. Physical attacks and magical effects (such as scrolls and wands) will immediately cancel invisibility.\n\nTurns of invisibility remaining: %s.
actors.buffs.invulnerability.name=invulnerable
actors.buffs.invulnerability.desc=You are suffused with great protective power, granting you a brief period of invulnerability!\n\nTurns remaining: %s.
actors.buffs.levitation.name=levitating
actors.buffs.levitation.desc=A magical force is levitating you over the ground, making you feel weightless.\n\nLevitating characters move silently and ignore all ground-based effects. Traps won't trigger, water won't put out fire, plants won't be trampled, roots will miss, and pits will be hovered over. Be careful, as all these things can come into effect the second the levitation ends!\n\nTurns of levitation remaining: %s.
actors.buffs.lifelink.name=life link
actors.buffs.lifelink.desc=This character's life force is linked to another character nearby. Any damage taken is shared between them.\n\nWhenever this character takes damage, half of it will be dealt to the life link target instead.\n\nTurns of life link remaining: %s, or until the linked character dies.
actors.buffs.light.name=illuminated
actors.buffs.light.desc=Even in the Darkest Dungeon, a steady light at your side is always comforting.\n\nLight helps keep darkness at bay, allowing you to see a reasonable distance despite the environment.\n\nTurns of illumination remaining: %s.
actors.buffs.lockedfloor.name=floor is locked
actors.buffs.lockedfloor.desc=The current floor is locked, and you are unable to leave it!\n\nWhile a floor is locked, you will not gain hunger or take damage from starving. In addition, if you do not work towards defeating this floor's boss, passive regeneration effects will also stop.\n\nAdditionally, if you are revived by an unblessed ankh while the floor is locked, then it will reset.\n\nKill this floor's boss to break the lock.
actors.buffs.lostinventory.name=lost inventory
actors.buffs.lostinventory.desc=Your inventory has been lost somewhere in the dungeon! You won't be able to pick up or use most items until you retrieve it.
actors.buffs.magicalsight.name=magical sight
actors.buffs.magicalsight.desc=Somehow you are able to see with your mind, rather than your eyes.\n\nWhile magical sight is active you will be able to see through all terrain in a 12 tile radius.\n\nTurns of magical sight remaining: %s.
actors.buffs.magicalsleep.name=magical sleep
actors.buffs.magicalsleep.toohealthy=You are too healthy, and resist the urge to sleep.
actors.buffs.magicalsleep.fallasleep=You fall into a deep magical sleep.
actors.buffs.magicalsleep.wakeup=You wake up feeling refreshed and healthy.
actors.buffs.magicalsleep.desc=This character has fallen into a deep magical sleep which they will not wake from naturally.\n\nMagical sleep is similar to regular sleep, except that only damage will cause the target to wake up.\n\nFor the hero and their allies, magical sleep has some restorative properties, allowing them to rapidly heal while resting.
actors.buffs.magicimmune.name=immune to magic
actors.buffs.magicimmune.desc=All magical effects have lost their hold on you, you are completely impervious to them.\n\nWhile magic immune all harmful and helpful magical effects will not apply to you, including curses, enchants, wands, scrolls, rings, artifacts, etc. Heroic armor abilities are strong enough to work regardless of this effect.\n\nTurns of magic immunity remaining: %s.
actors.buffs.overload.name=Overload
actors.buffs.overload.desc=The reality is overloaded. Prepare to cry, suffer, kill and slaughter.\n\nThe death of any hostile creature triggers the spawn of other creature.\n\nTurns of overload remaining: %s.
actors.buffs.mindvision.name=mind vision
actors.buffs.mindvision.desc=Somehow you are able to see all creatures on this floor through your mind. It's a weird feeling.\n\nAll characters on this floor are visible to you as long as you have mind vision. Seeing a creature through mind vision counts as it being seen or nearby for the purposes of many magical effects.\n\nTurns of mind vision remaining: %s.
actors.buffs.momentum.momentum=building momentum
actors.buffs.momentum.running=freerunning
actors.buffs.momentum.resting=recovering
actors.buffs.momentum.action_name=freerun
actors.buffs.momentum.momentum_desc=As he moves, the Freerunner builds momentum, which he can spend to start freerunning.\n\nEach charge of momentum grants two turns of freerunning, and the Freerunner can build up to 10 charges. Momentum is rapidly lost when the Freerunner stops moving.\n\nCurrent momentum charge: %d.
actors.buffs.momentum.running_desc=As he moves, the Freerunner builds momentum, which he can spend to start freerunning.\n\nWhile freerunning, the Freerunner moves at double speed and gains bonus evasion based on his level.\n\nTurns remaining: %d.
actors.buffs.momentum.resting_desc=As he moves, the Freerunner builds momentum, which he can spend to start freerunning.\n\nThe Freerunner needs time to regain his stamina before building momentum again.\n\nTurns remaining: %d.
actors.buffs.monkenergy.name=energy
actors.buffs.monkenergy.action=Monk Abilities
actors.buffs.monkenergy.desc=As she defeats enemies, the Monk gains energy that she can use on a variety of abilities. Most enemies grant 1 energy when defeated, and the Monk does not lose energy over time.\n\nCurrent energy: %1$d/%2$d.
actors.buffs.monkenergy.desc_cooldown=The Monk has recently used an ability, and must wait before using another.\n\nCurrent cooldown: %d turns.
actors.buffs.monkenergy$monkability$flurry.name=flurry of blows
actors.buffs.monkenergy$monkability$flurry.desc=Two instant strikes that deal %1$d-%2$d damage and ignore armor. This ability cannot be used repeatedly.
actors.buffs.monkenergy$monkability$flurry.empower_desc=Two instant strikes that deal %1$d-%2$d damage, ignore armor, _and use your weapon's enchantment._ This ability cannot be used repeatedly.
actors.buffs.monkenergy$monkability$focus.name=focus
actors.buffs.monkenergy$monkability$focus.desc=The Monk takes a turn to focus, letting her parry the next attack made against her.
actors.buffs.monkenergy$monkability$focus.empower_desc=The Monk _instantly focuses,_ letting her parry the next attack made against her.
actors.buffs.monkenergy$monkability$focus$focusbuff.name=focused
actors.buffs.monkenergy$monkability$focus$focusbuff.desc=The Monk is focused on her surroundings, anticipating the next attack made against her. While focused, she is guaranteed to parry the next incoming attack.
actors.buffs.monkenergy$monkability$dash.name=dash
actors.buffs.monkenergy$monkability$dash.prompt=Choose a Location
actors.buffs.monkenergy$monkability$dash.desc=An instant dash up to 4 tiles away. This ability can go over hazards, but not through enemies or solid terrain.
actors.buffs.monkenergy$monkability$dash.empower_desc=An instant dash up to _8 tiles_ away. This ability can go over hazards, but not through enemies or solid terrain.
actors.buffs.monkenergy$monkability$dragonkick.name=dragon kick
actors.buffs.monkenergy$monkability$dragonkick.desc=A devastating kick that deals %1$d-%2$d damage and ignores armor. The kick knocks the target away and paralyzes them for each tile they travel.
actors.buffs.monkenergy$monkability$dragonkick.empower_desc=A devastating kick that deals _%1$d-%2$d damage_ and ignores armor. The kick knocks _all adjacent targets_ away and paralyzes them for each tile they travel.
actors.buffs.monkenergy$monkability$meditate.name=meditate
actors.buffs.monkenergy$monkability$meditate.desc=The Monk focuses energy into her body for 5 turns. This clears most negative effects and grants her 8 turns of wand and artifact recharging.
actors.buffs.monkenergy$monkability$meditate.empower_desc=The Monk focuses energy into her body for 5 turns. This clears most negative effects and grants her 8 turns of wand and artifact recharging. _She also gains 80% damage resistance while meditating, and slowly heals for 20% of her missing HP._
actors.buffs.killevolution.name=kill counter
actors.buffs.killevolution.action=Kill Abilities
actors.buffs.killevolution.desc=As they defeat enemies, the hero gains energy that they can use on a variety of abilities. Most enemies grant 1 energy when defeated, and the hero does not lose energy over time.\n\n_However, unequipping a weapon associated with this buff associated with will lose all of this energy and you need to start killing enemies again_\n\nCurrent energy: %1$d/%2$d.
actors.buffs.killevolution.desc_cooldown=The hero has recently used an ability, and must wait before using another.\n\nCurrent cooldown: %d turns.
actors.buffs.killevolution$killevolutionability$invisibledash.name=invisible dash
actors.buffs.killevolution$killevolutionability$invisibledash.prompt=Choose a Location
actors.buffs.killevolution$killevolutionability$invisibledash.desc=An instant dash up to 4 tiles away with an additional turn of invisibility allowing the hero to surprise attack. This ability can go over hazards, but not through enemies or solid terrain.
actors.buffs.killevolution$killevolutionability$invisibledash.empower_desc=An instant dash up to _8 tiles_ away with an additional turn of invisibility allowing the hero to surprise attack. This ability can go over hazards, but not through enemies or solid terrain.
actors.buffs.killevolution$killevolutionability$physicallyempowered.name=physical empower
actors.buffs.killevolution$killevolutionability$physicallyempowered.desc=The hero grants itself +2 bonus damage for 10 hits.
actors.buffs.killevolution$killevolutionability$physicallyempowered.empower_desc=The hero grants itself _+4 bonus damage_ for 10 hits.
actors.buffs.killevolution$killevolutionability$weaponupgrade.name=weapon upgrade
actors.buffs.killevolution$killevolutionability$weaponupgrade.desc=The hero upgrades their weapon (and Duelist's second weapon if there's any) permanently.
actors.buffs.killevolution$killevolutionability$weaponupgrade.empower_desc=The hero upgrades their weapon (and Duelist's second weapon if there's any) _twice_ permanently.
actors.buffs.killevolution$killevolutionability$chain.name=chain enemy
actors.buffs.killevolution$killevolutionability$chain.desc=The hero chains an enemy to pull them in closer range.
actors.buffs.killevolution$killevolutionability$immortalize.name=immortalize
actors.buffs.killevolution$killevolutionability$immortalize.desc=The hero grants itself immortality against all sources of damage for 15 turns.
actors.buffs.killevolution$killevolutionability$immortalize.empower_desc=The hero grants itself immortality against all sources of damage for _~22 turns_.
actors.buffs.ooze.name=caustic ooze
actors.buffs.ooze.heromsg=Caustic ooze eats your flesh. Wash it away!
actors.buffs.ooze.ondeath=You melt away...
actors.buffs.ooze.rankings_desc=Dissolved
actors.buffs.ooze.desc=This sticky acid clings to flesh, slowly melting it away.\n\nOoze will deal consistent damage over time, but can be immediately washed off in water.\n\nTurns of ooze remaining: %s.
actors.buffs.paralysis.name=paralysed
actors.buffs.paralysis.heromsg=You are paralysed!
actors.buffs.paralysis.out=resisted paralysis
actors.buffs.paralysis.desc=Oftentimes the worst thing to do is nothing at all.\n\nParalysis completely halts all actions, forcing the target to wait until the effect wears off. The pain from taking damage can cause characters to resist paralysis, breaking them out of the effect.\n\nTurns of paralysis remaining: %s.
actors.buffs.physicalempower.name=physically empowered
actors.buffs.physicalempower.desc=Your blows have been empowered, increasing the amount of damage you can deal when you hit enemies with physical attacks.\n\nBonus damage: %1$d.\nHits remaining: %2$d.
actors.buffs.pincushion.name=pincushion
actors.buffs.pincushion.desc=The thrown weapons you have used against this character are currently stuck to them and will fall to the floor after they are defeated.\n\nThe following items are currently attached:
actors.buffs.poison.name=poisoned
actors.buffs.poison.heromsg=You are poisoned!
actors.buffs.poison.ondeath=You died from poison...
actors.buffs.poison.rankings_desc=Succumbed to Poison
actors.buffs.poison.desc=Poison works its way through the body, slowly impairing its internal functioning.\n\nPoison deals damage each turn proportional to how long until it expires.\n\nTurns of poison remaining: %s.
actors.buffs.preparation.name=preparation
actors.buffs.preparation.action_name=prepared strike
actors.buffs.preparation.desc=The Assassin is walking nervously, preparing to thurst knife into target.
actors.buffs.preparation.desc_dmg=His next attack will deal _%1$d%% bonus damage_, and will execute regular enemies below _%2$d%% health_, or bosses below _%3$d%% health_.
actors.buffs.preparation.desc_dmg_likely=The attack will also be more likely to deal a larger amount of damage.
actors.buffs.preparation.desc_blink=He is able to blink towards an enemy before striking them, with a max distance of _%d._
actors.buffs.preparation.desc_invis_time=The Assassin has been running for _%d turns._
actors.buffs.preparation.desc_invis_next=His attack will become stronger at _%d turns._
actors.buffs.preparation.prompt=Select a target to attack!\nMax blink distance: %d
actors.buffs.preparation.no_target=There's nothing to attack there.
actors.buffs.preparation.out_of_reach=That target is out of reach.
actors.buffs.preparation.assassinated=assassinated
actors.buffs.marked.name=Marked
actors.buffs.marked.desc=The Hunter is waiting patiently, preparing to strike while his bbat weakens enemies.
actors.buffs.marked.desc_dmg=The bbat deals %s%% more damage to this enemy. You will be able to jump to marked enemy at any moment, but more bonus damage means more debuffs.
actors.buffs.marked.prompt=Select a target to teleport!\nMax blink distance: your view distance
actors.buffs.marked.no_target=There's nothing to teleport there.
actors.buffs.marked.out_of_reach=That target is out of reach.
actors.buffs.marked.assassinated=assassinated
actors.buffs.marked.desc_poison=At this point, you will _poison_ a target, dealing damage over time.
actors.buffs.marked.desc_cripple=At this point, you will _cripple_ the legs of target, reducing its movement speed.
actors.buffs.marked.desc_blinding=At this point, you will also make target _blind_,reducing its field of view to 1 tile.
actors.buffs.marked.desc_bleeding=At this point, you will also make target _bleed_,dealing damage over time.
actors.buffs.marked.desc_vulnerable=At this point, you will also _increase physical damage_ to enemy.
actors.buffs.marked.desc_hexed=At this point, you will also stun target, _reducing its accuracy and dexterity_ for short time.
actors.buffs.marked.desc_slow=At this point, you will also disorientate target, _slowing_ its actions.
actors.buffs.marked.desc_ooze=At this point, you will also apply deadly _caustic ooze_ to target, dealing damage over time until target finds water.
actors.buffs.marked.desc_paralysis=At this point, you will completely _paralyse_ the enemy, rendering it unable to attack.
actors.buffs.marked.desc_doom=At this point, you will also curse the enemy, _significantly increasing any damage to it_.
actors.buffs.prismaticguard.name=prismatic Guard
actors.buffs.prismaticguard.desc=You are being guarded by a prismatic image which is currently inactive. When enemies are present the prismatic image will spring to action and protect you!\n\nWhile inactive, the prismatic image will steadily recover from any damage it has taken.\n\nCurrent HP: %d/%d.
actors.buffs.recharging.name=recharging
actors.buffs.recharging.desc=Energy is coursing through you, improving the rate that your wands and staffs charge.\n\nEach turn this buff will increase current charge by one quarter, in addition to regular recharge.\n\nTurns of recharging remaining: %s.
actors.buffs.revealedarea.name=revealed area
actors.buffs.revealedarea.desc=An area of the dungeon has been temporarily revealed to the hero, They will see it no matter where they are.\n\nTurns remaining: %s.
actors.buffs.revealedchar.name=revealed
actors.buffs.revealedchar.desc=This character is revealed to the hero, They will be visible no matter where they are.\n\nTurns remaining: %s.
actors.buffs.roots.name=rooted
actors.buffs.roots.heromsg=You can't move!
actors.buffs.roots.desc=Roots (magical or natural) grab at the feet, forcing them down to the ground.\n\nRoots lock a target in place, making movement and most movement abilities impossible. Other actions are not affected, including teleportation effects.\n\nTurns of root remaining: %s.
actors.buffs.scrollempower.name=scroll empower
actors.buffs.scrollempower.desc=The energy from the Mage's recently read scroll is empowering his wands!\n\nLevel Boost: +%1$d.\nZaps remaining: %2$d.
actors.buffs.shadows.name=shadowmelded
actors.buffs.shadows.desc=You are blended into the shadows around you, granting you invisibility and slowing your metabolism.\n\nWhile you are invisible enemies are unable to attack or follow you. Most physical attacks and magical effects (such as scrolls and wands) will immediately cancel invisibility. Additionally, while shadowmelded, your rate of hunger is slowed.\n\nYou will remain shadowmelded until you leave the shadows or an enemy comes into contact with you.
actors.buffs.slow.name=slowed
actors.buffs.slow.desc=Slowing magic affects the target's rate of time, to them everything is moving super-fast.\n\nA slowed character performs all actions in twice the amount of time they would normally take.\n\nTurns of slow remaining: %s.
actors.buffs.snipersmark.name=sniper's mark
actors.buffs.snipersmark.action_name_snapshot=snapshot
actors.buffs.snipersmark.action_name_volley=volley
actors.buffs.snipersmark.action_name_sniper=sniper shot
actors.buffs.snipersmark.desc=The Sniper is honed in on the target she most recently attacked. She is able to perform a special attack with her bow which will vary based on how the bow is augmented.\n\nAn unaugmented bow will fire a _snapshot,_ which deals reduced damage but does not take any time to fire.\n\nA bow augmented for speed will fire a _volley_ of three arrows. Each arrow will deal reduced damage, but can still activate enchantment. This volley takes 1 turn to shoot.\n\nA bow augmented for damage will fire a _sniper shot._ This shot is guaranteed to hit, deals bonus damage based on distance from the target, and takes 2 turns to fire.\n\nTurns remaining: %s.
actors.buffs.soulmark.name=soul marked
actors.buffs.soulmark.desc=The warlock has tapped into the soul of this creature, allowing him to heal as it takes physical damage.\n\nTurns of soul mark remaining: %s.
actors.buffs.stamina.name=stamina
actors.buffs.stamina.desc=You have unending stamina, allowing for faster movement!\n\nWhile under the effects of stamina you will run at +50%% speed, but will perform all other actions at normal speed.\n\nTurns of stamina remaining: %s.
actors.buffs.vulnerable.name=vulnerable
actors.buffs.vulnerable.heromsg=You feel fragile!
actors.buffs.vulnerable.desc=Vulnerability magic increases all physical damage that a character takes by 33%%, after that damage has been reduced by armor.\n\nTurns of vulnerable remaining: %s.
actors.buffs.terror.name=terrified
actors.buffs.terror.desc=Terror is manipulative magic which forces its target into an uncontrollable panic.\n\nTerrified characters are forced to run away from their opponent, trying to put as many doors and walls between them as possible. The shock of pain will lessen the duration of terror, however.\n\nTurns of terror remaining: %s.
actors.buffs.toxicimbue.name=imbued with toxicity
actors.buffs.toxicimbue.desc=You are imbued with poisonous energy!\n\nAs you move around toxic gas will constantly billow forth from you, damaging your enemies. You are immune to toxic gas and poison for the duration of the effect, as well as for a few turns afterward.\n\nTurns of toxic imbue remaining: %s.
actors.buffs.corrosion.name=corrosion
actors.buffs.corrosion.heromsg=You are melting!
actors.buffs.corrosion.ondeath=You melt away...
actors.buffs.corrosion.rankings_desc=Dissolved
actors.buffs.corrosion.desc=Powerful acid melts away flesh, metal, and bone at an alarming rate.\n\nCorrosion damage increases over time, as the target continues to melt away.\n\nTurns of corrosion remaining: %1$s.\nCurrent corrosion damage: %2$d.
actors.buffs.vertigo.name=vertigo
actors.buffs.vertigo.desc=Walking in a straight line can be difficult when the whole world is spinning.\n\nWhile under the effects of vertigo, characters who attempt to move will go in a random direction, instead of the one they intended to go in.\n\nTurns of vertigo remaining: %s.
actors.buffs.wandempower.name=wands empowered
actors.buffs.wandempower.desc=Your damage-dealing wands have been empowered, increasing the amount of damage they deal for a few hits.\n\nBonus damage: %1$d.\nHits remaining: %2$d.
actors.buffs.weakness.name=weakened
actors.buffs.weakness.heromsg=You feel weakened!
actors.buffs.weakness.desc=Everything suddenly seems much heavier.\n\nWeakening magic reduces a character's physical strength, causing them to deal 33%% reduced damage.\n\nTurns of weakness remaining: %s.
actors.buffs.wellfed.name=well fed
actors.buffs.wellfed.desc=You feel quite satisfied and full.\n\nWhile well fed, your hunger will not increase, and you will heal an additional amount of health over time.\n\nTurns remaining: %d.
actors.buffs.danceimmunebuff.name=immune to dance curse
actors.buffs.danceimmunebuff.desc=All dancing effects loses all its power for a short time, well extending the effect is not effective, you must wait for this effect to wear down before using the spell again.\n\nTurns of magic immunity remaining: %s.
actors.hero.abilities.armorability.self_target=You can't target yourself!
actors.hero.abilities.armorability.no_target=There's nothing to target there!
actors.hero.abilities.armorability.prompt=Choose a location to target
actors.hero.abilities.armorability.cost=Charge cost: _%d_
actors.hero.abilities.warrior.heroicleap.name=heroic leap
actors.hero.abilities.warrior.heroicleap.prompt=Choose direction to leap
actors.hero.abilities.warrior.heroicleap.short_desc=The Warrior performs a _Heroic Leap_ towards a targeted location, sailing above enemies and hazards.
actors.hero.abilities.warrior.heroicleap.desc=The Warrior leaps toward a targeted location, going over any enemies or hazards in the way. He cannot leap over walls or other solid terrain however.
actors.hero.abilities.warrior.shockwave.name=shockwave
actors.hero.abilities.warrior.shockwave.short_desc=The Warrior releases a _Shockwave_ in a conical AOE by slamming the ground. Enemies caught in the shockwave are damaged and crippled.
actors.hero.abilities.warrior.shockwave.desc=The Warrior slams the ground, producing a shockwave that travels up to 5 tiles in a 60 degree cone.\n\nEnemies caught in this shockwave are crippled for 5 turns. They also take 5-10 damage, plus an additional 1-2 damage for every point of strength the Warrior has above 10.
actors.hero.abilities.warrior.endure.name=endure
actors.hero.abilities.warrior.endure$enduretracker.name=endurance
actors.hero.abilities.warrior.endure$enduretracker.desc=The Warrior is now dealing bonus damage based on the damage he endured.\n\nBonus Damage: %1$d\nHits Left: %2$d
actors.hero.abilities.warrior.endure.short_desc=The Warrior _Endures_, skipping several turns but gaining high damage resistance. He then deals bonus damage based on what he endured.
actors.hero.abilities.warrior.endure.desc=The Warrior endures for 3 turns, taking half damage from all sources. This reduction is applied before damage resisting effects like armor.\n\nAfter enduring, the warrior's next hit within 10 turns gains bonus damage. This bonus damage is equal to half of all the damage inflicted on him while enduring, before any damage reduction effects!\n\nIf the Warrior has any combo, using this ability increases its remaining time by 3 turns.
actors.hero.abilities.mage.elementalblast.name=elemental blast
actors.hero.abilities.mage.elementalblast.no_staff=You can't use this ability without your staff.
actors.hero.abilities.mage.elementalblast.short_desc=The Mage emits an _Elemental Blast_ from his staff, covering a large area around him in an effect that varies based on the wand in his staff.
actors.hero.abilities.mage.elementalblast.desc=The Mage emits a blast of magic, which covers a circular region up to 4 tiles away and deals up to 15-25 damage. The specific effect of elemental blast will vary by the wand imbued in the Mage's staff.
actors.hero.abilities.mage.elementalblast.generic_desc=The effect of elemental blast will be similar to the effect of the wand when zapped at an enemy or ally.
actors.hero.abilities.mage.wildmagic.name=wild magic
actors.hero.abilities.mage.wildmagic.no_wands=You have no wands to zap with!
actors.hero.abilities.mage.wildmagic.short_desc=The Mage unleashes the _Wild Magic_ contained in his wands, randomly firing them multiple times at a chosen target over a single turn.
actors.hero.abilities.mage.wildmagic.desc=The Mage unleashes the power in his wands, randomly firing them up to 4 times in a single turn. The Mage's staff is not included in this effect.\n\nEach wand also has its level boosted by 2, up to +3. This ability uses half a wand charge for each zap, and no one wand can be fired more than 2 times.
actors.hero.abilities.mage.warpbeacon.name=warp beacon
actors.hero.abilities.mage.warpbeacon.depths=You can't warp between depths!
actors.hero.abilities.mage.warpbeacon.locked_floor=You cannot leave a locked floor!
actors.hero.abilities.mage.warpbeacon.too_far=That location is too far!
actors.hero.abilities.mage.warpbeacon.invalid_beacon=You can't place a beacon there!
actors.hero.abilities.mage.warpbeacon.window_desc=Your beacon is currently placed on floor %d.
actors.hero.abilities.mage.warpbeacon.window_tele=teleport to beacon
actors.hero.abilities.mage.warpbeacon.window_clear=clear beacon
actors.hero.abilities.mage.warpbeacon.window_cancel=cancel
actors.hero.abilities.mage.warpbeacon.short_desc=The Mage places a _Warping Beacon_ at his current location, which he can instantly teleport back to.
actors.hero.abilities.mage.warpbeacon.desc=The Mage places a beacon, which can then be warped to at will. Placing the beacon takes 1 turn, but warping to it is instantaneous.\n\nThe Mage cannot warp between floors by default, or use the beacon to reach inaccessible places such as locked rooms. The Mage can teleport into enemies, which will push them aside.
actors.hero.abilities.rogue.smokebomb.name=smoke bomb
actors.hero.abilities.rogue.smokebomb.fov=You can only jump to an empty location in your field of view
actors.hero.abilities.rogue.smokebomb.prompt=Choose a location to jump to
actors.hero.abilities.rogue.smokebomb$ninjalog.name=wooden decoy
actors.hero.abilities.rogue.smokebomb$ninjalog.desc=Somehow, enemies are easily convinced that this wooden decoy is the real Rogue!
actors.hero.abilities.rogue.smokebomb.short_desc=The Rogue throws down a _Smoke Bomb_ while blinking away. He blinds enemies near his old location.
actors.hero.abilities.rogue.smokebomb.desc=The Rogue throws down a smoke bomb and blinks up to 6 tiles away. He can blink through hazards and enemies, but not through solid terrain like walls.\n\nEnemies that are adjacent to the Rogue's old position will be blinded for 5 turns.
actors.hero.abilities.rogue.deathmark.name=death mark
actors.hero.abilities.rogue.deathmark.ally_target=You can only mark enemies
actors.hero.abilities.rogue.deathmark.short_desc=The Rogue places a _Death Mark_ on a chosen enemy. Marked enemies take bonus damage, but cannot die until the mark ends.
actors.hero.abilities.rogue.deathmark.desc=The Rogue places a mark on a chosen enemy, causing them to take 25% extra damage. The mark is applied instantly and lasts for 5 turns.\n\nMarked enemies take bonus damage but are unable to die until the mark expires. If an enemy has 0 HP when the mark ends, they will immediately die.
actors.hero.abilities.rogue.deathmark$deathmarktracker.name=marked for death
actors.hero.abilities.rogue.deathmark$deathmarktracker.desc=This enemy has been marked, causing them to take 25%% bonus damage, but also rendering them unable to die until the mark ends.\n\nTurns remaining: %s.
actors.hero.abilities.rogue.shadowclone.name=shadow clone
actors.hero.abilities.rogue.shadowclone.short_desc=The Rogue summons a _Shadow Clone_, which can be directed to aid him in combat.
actors.hero.abilities.rogue.shadowclone.desc=The Rogue summons a shadowy mimic of himself, which can be directed to aid him in combat. Directing the shadow clone does not cost any charge.\n\nThe clone has 80 HP, no armor, and deals 10-20 damage. All of these traits can be improved with talents, such that the clone benefits from weapons and armor the hero has.
actors.hero.abilities.rogue.shadowclone$shadowally.name=shadow rogue
actors.hero.abilities.rogue.shadowclone$shadowally.direct_defend=Your clone moves to that position.
actors.hero.abilities.rogue.shadowclone$shadowally.direct_follow=Your clone moves to follow you.
actors.hero.abilities.rogue.shadowclone$shadowally.direct_attack=Your clone moves to attack!
actors.hero.abilities.rogue.shadowclone$shadowally.desc=A copy of the Rogue, made from shadowy darkness. It stands stock still, with empty eyes and tiny wisps of darkness rising from it like steam.\n\nThe clone is not a perfect copy of the Rogue, but is still a decent fighter, and can benefit from the Rogue's equipment with the right talents.
actors.hero.abilities.huntress.spectralblades.name=spectral blades
actors.hero.abilities.huntress.spectralblades.short_desc=The Huntress throws _Spectral Blades_ at a target, inflicting damage depending on her currently equipped melee weapon.
actors.hero.abilities.huntress.spectralblades.desc=The Huntress throws out a spectral blade at an enemy, which acts like a ranged strike from her melee weapon. All of the normal effects of a melee weapon will activate, including enchantments.
actors.hero.abilities.huntress.naturespower.name=nature's power
actors.hero.abilities.huntress.naturespower.short_desc=The Huntress calls upon _Nature's Power_, increasing her movement speed and her bow's rate of fire for a short time.
actors.hero.abilities.huntress.naturespower.desc=The Huntress temporarily empowers herself and her bow with the power of nature! This lasts for 8 turns.\n\nDuring this time, the Huntress moves at 2x speed, and attacks 33% faster with her bow. The bonus bow effects do not trigger if the Sniper is using her special attacks.
actors.hero.abilities.huntress.naturespower$naturespowertracker.name=nature's power
actors.hero.abilities.huntress.naturespower$naturespowertracker.desc=The Huntress is briefly empowered, increasing her movement speed and attack speed with her bow.\n\nTurns remaining: %s.
actors.hero.abilities.huntress.spirithawk.name=spirit hawk
actors.hero.abilities.huntress.spirithawk.no_space=There is no free space near you.
actors.hero.abilities.huntress.spirithawk.short_desc=The Huntress summons a _Spirit Hawk_ familiar, which can help her scout locations and distract enemies.
actors.hero.abilities.huntress.spirithawk.desc=The Huntress summons a spirit hawk familiar, which can be directed by using the ability again while it is summoned. The hawk lasts for 100 turns, directing the hawk does not cost any charge.\n\nThe hawk has minimal health and attacking power, but is fast, evasive, and accurate. It shares its entire field of vision with the Huntress at all times. It is immune to all area-bound effects, such as fire and poison gas. It will not attack unless specifically directed to.
actors.hero.abilities.huntress.spirithawk$hawkally.name=spirit hawk
actors.hero.abilities.huntress.spirithawk$hawkally.direct_defend=Your hawk moves to that position.
actors.hero.abilities.huntress.spirithawk$hawkally.direct_follow=Your hawk moves to follow you.
actors.hero.abilities.huntress.spirithawk$hawkally.direct_attack=Your hawk moves to attack!
actors.hero.abilities.huntress.spirithawk$hawkally.desc=A magical hawk, summoned by the Huntress. It glows a bright ethereal blue, its head constantly shifts around as it surveys the area.\n\nWhile it isn't much of a fighter its speed and vision make it excellent for scouting and distracting enemies.
actors.hero.abilities.huntress.spirithawk$hawkally.desc_remaining=Turns remaining: %d.
actors.hero.abilities.huntress.spirithawk$hawkally.desc_dodges=Guaranteed dodges remaining: %d.
actors.hero.abilities.duelist.challenge.name=challenge
actors.hero.abilities.duelist.challenge.prompt=Choose an enemy to challenge
actors.hero.abilities.duelist.challenge.already_dueling=You can only be in one duel at a time.
actors.hero.abilities.duelist.challenge.ally_target=You can only challenge enemies.
actors.hero.abilities.duelist.challenge.unreachable_target=You must be able to reach your target.
actors.hero.abilities.duelist.challenge.distant_target=That enemy is too far away to challenge.
actors.hero.abilities.duelist.challenge.short_desc=The Duelist _Challenges_ a nearby enemy to a duel, temporarily freezing all other enemies.
actors.hero.abilities.duelist.challenge.desc=The Duelist challenges a nearby enemy to a duel. That enemy is compelled to fight her while all other enemies are temporarily frozen in time.\n\nThe target must be reachable and within 5 tiles of the Duelist. The duel lasts until 10 turns pass, the enemy dies, or the Duelist is more than 5 tiles away from the enemy.\n\nFrozen enemies are invulnerable. The Duelist's allies are not frozen by this ability, but if a boss is targeted its minions will not be frozen either.
actors.hero.abilities.duelist.challenge$duelparticipant.name=duel participant
actors.hero.abilities.duelist.challenge$duelparticipant.desc=This character is participating in a duel. They, and any of their allies or minions, are allowed to act normally while others are frozen.\n\nThe duel will last for a set amount of time, until one participant dies, or until the participants move more than 5 tiles away from eachother.\n\nTurns remaining: %d.
actors.hero.abilities.duelist.elementalstrike.name=elemental strike
actors.hero.abilities.duelist.elementalstrike.short_desc=The Duelist performs an _Elemental Strike_, spreading an effect in a conical AOE based on her weapon enchantment.
actors.hero.abilities.duelist.elementalstrike.desc=The Duelist strikes an enemy or location, performing a regular attack that's guaranteed to hit and spreading a magical effect that travels up to 4 tiles in a 65 degree cone. This magical effect varies based on the enchantment on the Duelist's primary weapon.
actors.hero.abilities.duelist.elementalstrike.generic_desc=An elemental strike with no enchantment will release a small burst of magic, dealing 6-12 damage to all enemies in range.
actors.hero.abilities.duelist.feint.name=feint
actors.hero.abilities.duelist.feint.prompt=Choose a location to dash to
actors.hero.abilities.duelist.feint.too_far=That location is not adjacent to you.
actors.hero.abilities.duelist.feint.bad_location=You can't move to that location.
actors.hero.abilities.duelist.feint.short_desc=The Duelist _Feints_, faking an attack while dashing to an adjacent tile. Enemies will attack her afterimage, leaving them open to a counterattack.
actors.hero.abilities.duelist.feint.desc=The Duelist fakes an attack while dashing to an adjacent tile, leaving behind a momentary afterimage of herself. Enemies that were attacking the Duelist will attack her afterimage instead.\n\nEnemies that attack the afterimage become confused, which cancels their next action and leaves them open to a surprise attack.
actors.hero.abilities.ratmogrify.name=ratmogrify
actors.hero.abilities.ratmogrify.cant_transform=You can't ratmogrify that!
actors.hero.abilities.ratmogrify.too_strong=That enemy is too strong to ratmogrify!
actors.hero.abilities.ratmogrify.short_desc=The hero _Ratmogrifies_ an enemy! This temporarily turns them into a rat with no abilities.
actors.hero.abilities.ratmogrify.desc=The hero transforms an enemy into a rat for 6 turns! Bosses, allies, and rats cannot be ratmogrified.\n\nRatmogrified enemies retain their original stats, but do not have any abilities.
actors.hero.abilities.ratmogrify$transmograt.name=ratmogrified %s
actors.hero.abilities.ratmogrify$transmograt.desc=This enemy has been transformed into a rat. A big improvement, if you ask me! - Rat King
actors.hero.abilities.ratmogrify$transmograt.rankings_desc=Slain by: ratmogrified enemy
actors.hero.abilities.ratking.legacywrath.name=divine fury
actors.hero.abilities.ratking.legacywrath.short_desc=I unleash my _Divine Fury_ upon my enemies. It leaves me exposed for a few turns and drains all my armor charge. Everything must come at price!
actors.hero.abilities.ratking.legacywrath.desc=I unlock the ability to channel overwhelming power. With it, I can blink to any nearby location no further than 6 tiles, blinding any enemies adjacent to my old location. Once there, I will cast a spell of magical earth on everyone I can see in 6 tiles area (the effect depends on talents) and create a fan of spectral blades targeting any mob within 6 tiles of me before turning invisible.\n\nThis ability takes 2 turns to leap, 1 turn to rooting earth, and one turn to spectral blades, though using this with no enemies in sight will skip the attacking.\n\nUnfortunately, _I have to use all of my armor charge or 33% of my current HP_ to get enough power for this ability.
actors.hero.hero.name=you
actors.hero.hero.leave=You can't leave yet, the rest of the dungeon awaits below!
actors.hero.hero.level_up=Level up!
actors.hero.hero.new_level=Level up! +Accuracy, +Evasion, +5 HP!
actors.hero.hero.new_talent=+1 Talent Point!
actors.hero.hero.unspent=You have unspent talent points!
actors.hero.hero.level_cap=You cannot grow stronger, but your experiences do give you a surge of power!
actors.hero.hero.you_now_have=you picked up: %s.
actors.hero.hero.you_cant_have=you can't carry: %s.
actors.hero.hero.locked_chest=This chest is locked and you don't have a matching key.
actors.hero.hero.locked_door=You don't have a matching key.
actors.hero.hero.noticed_smth=You noticed something.
actors.hero.hero.wait=...
actors.hero.hero.search=search
actors.hero.hero.search_distracted=It's hard to concentrate, searching is exhausting.
actors.hero.hero.pain_resist=The pain helps you resist the urge to sleep.
actors.hero.hero.revive=The ankh explodes with life-giving energy!
actors.hero.heroclass.warrior=warrior
actors.hero.heroclass.warrior_desc_short=The Warrior endures extra damage with shielding granted by his _broken seal._ The seal can be moved between armors and _transfers a single upgrade._
actors.hero.heroclass.warrior_desc=The Warrior starts with a _unique broken seal_ that generates shielding over his health. The seal can be moved between armors, and can _transfer a single upgrade_ with it.\n\nThe Warrior also starts with a _worn shortsword_, _three throwing stones_, cloth armor, a waterskin, and a velvet pouch.\n\nThe Warrior automatically identifies:\n_-_ Scrolls of Identify\n_-_ Potions of Healing\n_-_ Scrolls of Rage
actors.hero.heroclass.warrior_unlock=The Warrior is automatically unlocked.
actors.hero.heroclass.warrior_perk_desc=The Warrior gains _non-stackable 1 + (5% of current STR rounded down)_ temporary strength within _60 + (5 * current level) turns_ from eating and will be protected from taking any damage for duration of eating.\n\nThe Warrior can blind any enemy for _5 turns_ by throwing non-missiles at it. This ability has _40 turns_ cooldown.\n\nThe Warrior has _15%_ more strength, rounded down.\n\nThe Warrior can transfer any glyphs with his seal.\n\nThe Warrior regenerates his health and shielding _two times_ faster than usual.
actors.hero.heroclass.mage=mage
actors.hero.heroclass.mage_desc_short=The Mage is an arcane expert and carries a _magical staff_ that's stronger than a wand. The staff can be _imbued with any wand_ the Mage finds.
actors.hero.heroclass.mage_desc=The Mage starts with a _unique staff_, which recharges significantly faster than a wand and has 1 more charge. The staff _can be imbued with any wand_ the Mage finds in the dungeon.\n\nThe Mage also starts with a _wand of magic missile_ imbued in his staff, cloth armor, a waterskin, and a velvet pouch.\n\nThe Mage automatically identifies:\n_-_ Scrolls of Identify\n_-_ Potions of Liquid Flame\n_-_ Scrolls of Upgrade
actors.hero.heroclass.mage_unlock=To unlock the Mage _use a scroll of upgrade to make an item stronger._
actors.hero.heroclass.mage_perk_desc=The Mage gets _12 turns_ of recharging from eating.\n\nThe Mage instantly identifies any wands he picks up.\n\nThe Mage can self-target with a wand to convert all of its charges into shielding at a rate of _10.5% max HP per charge_.\n\nWhen the Mage zaps an enemy, he gains mind vision on them for _10 turns_.\n\nWhen the Mage reads a scroll, his next _3 wand zaps_ will get +(hero level/5) levels. He also has _33% chance_ to get scroll from the enemy.
actors.hero.heroclass.rogue=rogue
actors.hero.heroclass.rogue_desc_short=The Rogue can evade enemies and strike from invisibility using his _cloak of shadows._ He also _detects secrets and traps_ from a greater distance.
actors.hero.heroclass.rogue_desc=The Rogue starts with a _unique Cloak of Shadows_, which he can use to become invisible at will.\n\nThe Rogue can _detect secrets and traps_ from a greater distance.\n\nThe Rogue also starts with _a dagger_, _three throwing knives_, cloth armor, a waterskin, and a velvet pouch.\n\nThe Rogue automatically identifies:\n_-_ Scrolls of Identify\n_-_ Potions of Invisibility\n_-_ Scrolls of Magic Mapping
actors.hero.heroclass.rogue_unlock=To unlock the Rogue _perform 10 surprise attacks in one game._
actors.hero.heroclass.rogue_perk_desc=The Rogue will not wake sleeping enemies while he is _3 or more tiles away from them_.\n\nThe Rogue can search in _7x7_ area and will knock adjacent enemies away with chip damage while searching.\n\nThe Rogue can use Cloak of Shadows without equipping it but it will recharge at 66% speed.\n\nOn using Scroll of Upgrade, the Rogue will charge all his wands by _1_ charge and get _10 turns_ worth of artifact recharging.\n\nThe Rogue's bombs deal _150%_ more damage and drop from any enemy with 10% chance.
actors.hero.heroclass.huntress=huntress
actors.hero.heroclass.huntress_desc_short=The Huntress is a master of thrown weapons and has a _magical bow_ with infinite arrows. She also travels through tall grass _without trampling it._
actors.hero.heroclass.huntress_desc=The Huntress starts with a _unique spirit bow_, which can fire an infinite number of conjured arrows.\n\nThe Huntress can travel through tall grass _without trampling it_.\n\nThe Huntress also starts with _studded gloves_, cloth armor, a waterskin, and a velvet pouch.\n\nThe Huntress automatically identifies:\n_-_ Scrolls of Identify\n_-_ Potions of Mind Vision\n_-_ Scrolls of Lullaby
actors.hero.heroclass.huntress_unlock=To unlock the Huntress _hit enemies with thrown weapons 10 times in one game._
actors.hero.heroclass.huntress_perk_desc=The Huntress identifies equipment _3x_ faster.\n\nWhen the Huntress steps on short grass or embers, they spring up into tall grass which the Huntress immediately furrows. This has a _5 turn cooldown_. This talent will produce furrowed grass if passive regeneration effects are disabled or the hero has not gained exp in a long time.\n\nThe Huntress gains mind vision on any enemy within _3 tiles of her position_.\n\nThe Huntress gets _5 turns_ of adrenaline from eating.\n\nThe Huntress has 8% chance to get _1-3_ alchemical energy after killing the enemy.
actors.hero.heroclass.rat_king=rat king
actors.hero.heroclass.rat_king_desc_short=My short description is than I am awesome as king could possibly be!
actors.hero.heroclass.rat_king_desc=Why choose a class when I could just go as myself?\n\nAs myself, I take all the special class items I could find: an old seal, a staff made by some mage, a priceless cloak of shadows from my treasury, and a bow from my armory.\n\nI start with all my class items, obviously. Also I've already acquired all the bags, so I start with those too.\nI can also detect traps and secrets from a greater distance.\
actors.hero.heroclass.rat_king_perk_desc=What? I don't need any help! I am strong enough by myself!
actors.hero.heroclass.duelist=duelist
actors.hero.heroclass.duelist_desc_short=The Duelist is a weapons master who can use her weapon to trigger a _special weapon ability._ This special ability is _different for every weapon._
actors.hero.heroclass.duelist_desc=The Duelist starts with a _unique rapier_ with a special ability that recharges over time.\n\nEvery weapon in the game has a _different special ability_ that the Duelist can use.\n\nThe Duelist also starts with _two throwing spikes_, cloth armor, a waterskin, and a velvet pouch.\n\nThe Duelist automatically identifies:\n_-_ Scrolls of Identify\n_-_ Potions of Strength\n_-_ Scrolls of Mirror Image
actors.hero.heroclass.duelist_unlock=To unlock the Duelist _equip a tier 2 or higher weapon with no strength penalty._
actors.hero.heroclass.duelist_perk_desc=The Duelist gets _2 weapon charge_ and bonus melee damage equal to _level/2_ on eating.\n\nThe Duelist gains one weapon charge every _10 turns_ and deals _+8%_ melee damage when under the effect of wand or artifact recharging buffs.\n\nThe Duelist can switch her equipped weapon instantly _twice within 5 turns_, with a 20 turn cooldown.\nIf this ability is not on cooldown, quick-using an unequipped weapon will equip it.\n\nIf the Duelist's ability manages to kill any enemy, she will restore HP equal to _her level_.\n\nThe Duelist gets _+50%_ enchantment power for her attacks.
actors.hero.herosubclass.gladiator=gladiator
actors.hero.herosubclass.berserker=berserker
actors.hero.herosubclass.berserker_short_desc=The _Berserker_ builds rage as he takes damage. Rage increases his damage and can be activated at 100% for bonus shielding.
actors.hero.herosubclass.berserker_desc=The Berserker gains rage as he takes physical damage, including damage that gets blocked by his armor! Rage steadily fades away over time, but fades more slowly if he is at low HP.\n\nThe Berserker deals up to +50% damage at 100% rage. At 100% rage he can also go berserk, gaining 2-6x his seal's maximum shielding depending on his missing health and keeping his rage at 100% as long as he has shielding left. However, the Berserker needs time to recover after he goes berserk.\n\nHis rage will trigger enchantments and curses up to 60% more frequently and decay much slower.
actors.hero.herosubclass.gladiator_short_desc=The _Gladiator_ builds combo when he makes successful attacks. He can spend combo to use unique abilities.
actors.hero.herosubclass.gladiator_desc=The Gladiator builds one point of combo every time he makes a successful attack with a melee or thrown weapon. If the Gladiator does not make a successful attack within 5 turns, his combo is reset.\n\nAs combo builds it unlocks various abilities which he can spend his combo to use:\n2 Combo: knock enemy back, preserves combo; when combo is 7 or higher, knockback range increases to 3, it inflicts vertigo, and it can knock enemies into pits\n4 Combo: deal damage based on armor\n6 Combo: parry, preserves combo; when combo is 9 or higher, works on multiple attacks\n8 Combo: damage target and nearby enemies\n10 Combo: attack once for each combo\n\nWhen the Gladiator kills an enemy, the combo cooldown for his next hit is increased to _50 turns_.\n\nThe Gladiator can leap up to combo/3 tiles when using combo-spending attacks.
actors.hero.herosubclass.battlemage=battlemage
actors.hero.herosubclass.battlemage_short_desc=The _Battlemage_ conjures bonus effects when fighting in melee with his staff. These effects depend on the wand his staff is imbued with.
actors.hero.herosubclass.battlemage_desc=The Battlemage gains a bonus effect whenever he strikes in melee with his staff, as if his staff had an additional enchantment. These effects depend on the wand his staff is imbued with, every wand has its own effect. In addition to the wand effects, the Battlemage's staff will also gain 0.5 charges when he strikes with it.\n\nThe Battlemage's first melee strike with his staff after zapping with it deals double damage and staff's bonus effect gets +300% power.\n\nStriking with his staff grants the Battlemage _2 turns_ worth of artifact recharging.
actors.hero.herosubclass.warlock=warlock
actors.hero.herosubclass.warlock_short_desc=The _Warlock_ has a chance to soul mark enemies with his wands. He will heal whenever he deals physical damage to marked enemies.
actors.hero.herosubclass.warlock_desc=The Warlock has a chance to inflict a soul mark on characters when he uses wands on them. The chance to apply a soul mark and its duration increase with wand level.\n\nWhen an enemy is soul marked, the Warlock will heal 2 hp for every 5 damage he deals to them, but only with attacks from melee or thrown weapons, not from wands!\n\nWhen a soul marked enemy dies, the Warlock has a _50% chance_ to raise them as a corrupted wraith.\n\nSoul mark grants 1.5 turns of satiety for each physical damage dealt. Soul marked enemies have a 40% chance to trigger on-eat effects when they die.
actors.hero.herosubclass.assassin=hunter
actors.hero.herosubclass.assassin_short_desc=The _Hunter_ marks enemies with his bbat and inflicts debuffs with it.
actors.hero.herosubclass.assassin_desc=The _Hunter_ is trained to control darkness and use it to hunt targets with his bbat. His pet marks enemies and progressively does more damage. When any enemy is marked, the hunter can blink to it, inflicting debuffs and healing bbat depending on strength of mark.
actors.hero.herosubclass.freerunner=freerunner
actors.hero.herosubclass.freerunner_short_desc=The _Freerunner_ builds momentum as he runs, which can be used to start freerunning. This grants him bonus speed and evasion for a short while.
actors.hero.herosubclass.freerunner_desc=As the Freerunner moves he builds stacks of momentum. He can gain up to 10 momentum after running for 10 turns, but rapidly loses it if he stops moving. The freerunner can use up his momentum to start freerunning, for 2 turns per point of momentum.\n\nWhen freerunning the Freerunner moves at 2x speed, and gains bonus evasion in proportion to his level. Once freerunning ends there is a cooldown before momentum can be built again.\n\nWhile freerunning, the Freerunner gains 2x accuracy and +50% damage with thrown weapons.\n\nThe Freerunner moves at 2x speed while invisible, regardless of whether he is freerunning or not.
actors.hero.herosubclass.sniper=sniper
actors.hero.herosubclass.sniper_short_desc=The _Sniper_ can pierce armor with her ranged attacks. After striking with a thrown weapon she can follow up with a special attack from her bow.
actors.hero.herosubclass.sniper_desc=The Sniper is a master of ranged combat, whose ranged attacks pierce enemy armor. When she attacks an enemy with a thrown weapon, she places a sniper's mark on them, which lets her follow up with a special attack from her bow. This special attack varies based on how her bow is augmented.\n\nAn unaugmented bow will fire a snapshot which deals reduced damage but fires instantly. A speed bow will fire a volley of three arrows which deal reduced damage, can still activate enchantments, and take 1 turn to fire. A damage bow will fire a sniper shot which is guaranteed to hit, deals bonus damage based on distance, and takes 2 turns to fire.\n\nThrown weapons have a 100% chance to use the enchantment on the Sniper's bow.\nThis ability does not apply to darts shot from an enchanted crossbow, they already trigger the crossbow's enchantment.\n\nWhen the Sniper attacks with an upgraded thrown weapon, each level increases the duration of sniper's mark by 1 turn and the damage of her special attack by _33%_.
actors.hero.herosubclass.warden=warden
actors.hero.herosubclass.warden_short_desc=The _Warden_ can see through tall grass and gains bonus effects when she plants seeds and tramples plants.
actors.hero.herosubclass.warden_desc=The Warden has a strong connection to nature which grants her a variety of bonus effects relating to grass and plants. She is able to see through tall and furrowed grass as if it were empty space.\n\nThe Warden causes grass to sprout up around any seed she throws or plants, and gains special effects when trampling plants. These special effects replace the regular plant effects, meaning that no plant is harmful for her to step on.\n\nDewdrops can shield the Warden when her health is full, up to _100% of her max HP_.\n\nTipped darts have _5x durability_ when the Warden uses them.
actors.hero.herosubclass.king=rat king
actors.hero.herosubclass.king_short_desc=Choosing is so boring, I'd rather just pick _all the subclasses_...
actors.hero.herosubclass.king_desc=Rat King can use all subclasses at once!\n\nNot all perks are transferred to Rat King's subclass powers.
actors.hero.herosubclass.champion=champion
actors.hero.herosubclass.champion_short_desc=The _Champion_ can wield two weapons and gets more weapon charges. Her regular attacks use her primary weapon, but she can swap weapons and use either weapon's ability.
actors.hero.herosubclass.champion_desc=The Champion is a master of melee weapons who can equip a secondary weapon in addition to her primary one. Her regular attacks use her primary weapon, but she can swap her primary weapon instantly and use either weapon's ability.\n\nShe also gains 2 more max weapon ability charges and +50% weapon ability recharge speed.\n\nIf one of the Champion's two equipped weapons has a lower level and is _the same tier or lower_ than the other weapon, it will be boosted to the other weapon's level.\n\nIf the Champion uses two different weapon abilities successively, the second ability will execute any non-boss enemy left at _below 35% HP_.\n\nThe Champion instantly regains _1 weapon charge_ when she uses two different weapon abilities, with no time limit.
actors.hero.herosubclass.monk=monk
actors.hero.herosubclass.monk_short_desc=The _Monk_ builds energy while fighting. This energy can be spent on a variety of unique abilities.
actors.hero.herosubclass.monk_desc=The Monk is a master of physical technique. As she defeats enemies, she gains energy which can be used on a variety of defensive and utility-focused abilities. This energy does not fade over time, but has a cap based on the Monk's level.\n\n1 Energy: quickly strike with fists\n2 Energy: focus to dodge next attack\n3 Energy: instantly dash nearby\n4 Energy: kick an enemy away\n5 Energy: meditate to restore charges\n\nThe Monk gains _25% more energy_ for each piece of _natural tier 3_ equipment she is using.\nThe Monk gains _50% more energy_ for each piece of _natural tier 2_ equipment she is using.\nThe Monk gains _100%_ for each piece of _natural tier 1_ equipment she is using. She also gains _150% more energy_ if she has no weapon (or ring of force), and gains a free cloth armor and studded gloves.\n\nIf the Monk uses a weapon ability and a _2+ energy_ ability successively, she regains 50% of her spent energy and resets her ability cooldown.\n\nIf the Monk has _70% or more energy_, her abilities are empowered. When empowered:\n- Flurry applies enchantments at 75% power\n- Focus is instantaneous\n- Dash gains +2 range\n- Dragon Kick deals +33% damage and applies its knock back and stun effect to all adjacent enemies\n- Meditate slowly heals 20% of missing HP and grants 80% damage resistance.
actors.hero.talent$provokedangertracker.name=provoked anger
actors.hero.talent$provokedangertracker.desc=The Warrior has recently lost his shielding, his next physical attack will deal bonus damage.\n\nTurns remaining: %s.
actors.hero.talent$lingeringmagictracker.name=lingering magic
actors.hero.talent$lingeringmagictracker.desc=The Mage has recently used a staff or wand, his next physical attack will deal bonus damage.\n\nTurns remaining: %s.
actors.hero.talent$followupstriketracker.name=followup strike
actors.hero.talent$followupstriketracker.desc=The Huntress has recently attacked an enemy with a thrown weapon, her next melee attack against the same target will have boosted damage.\n\nTurns remaining: %s.
actors.hero.talent$patientstriketracker.name=patient strike
actors.hero.talent$patientstriketracker.desc=The Duelist has just spent a turn waiting, her next melee attack will deal bonus damage.
actors.hero.talent$improvisedprojectilecooldown.name=improvised projectiles cooldown
actors.hero.talent$improvisedprojectilecooldown.desc=You have recently used this talent, and must wait before using it again.\n\nTurns remaining: %s.
actors.hero.talent$rejuvenatingstepscooldown.name=rejuvenating steps cooldown
actors.hero.talent$rejuvenatingstepscooldown.desc=You have recently used this talent, and must wait before using it again.\n\nTurns remaining: %s.
actors.hero.talent$seershotcooldown.name=seer shot cooldown
actors.hero.talent$seershotcooldown.desc=You have recently used this talent, and must wait before using it again.\n\nTurns remaining: %s.
actors.hero.talent$aggressivebarriercooldown.name=aggressive barrier cooldown
actors.hero.talent$aggressivebarriercooldown.desc=You have recently used this talent, and must wait before using it again.\n\nTurns remaining: %s.
actors.hero.talent$liquidagilacctracker.name=liquid agility
actors.hero.talent$liquidagilacctracker.desc=The Duelist's next regular melee attack will gain bonus accuracy.\n\nTurns remaining: %s.
actors.hero.talent$lethalhastecooldown.name=lethal haste cooldown
actors.hero.talent$lethalhastecooldown.desc=You have recently used this talent, and must wait before using it again.\n\nTurns remaining: %s.
actors.hero.talent$swiftequipcooldown.name=swift equip cooldown
actors.hero.talent$swiftequipcooldown.desc=You have recently used this talent, and must wait before using it again.\n\nTurns remaining: %s.
actors.hero.talent$preciseassaulttracker.name=precise assault
actors.hero.talent$preciseassaulttracker.desc=The Duelist's next regular melee attack will gain bonus accuracy.\n\nTurns remaining: %s.
actors.hero.talent$deadlyfollowuptracker.name=deadly followup
actors.hero.talent$deadlyfollowuptracker.desc=The Duelist has recently attacked an enemy with a thrown weapon, her melee attacks against the same target will have boosted damage.\n\nTurns remaining: %s.
actors.hero.talent$combinedlethalityabilitytracker.executed=executed
actors.hero.talent.hearty_meal.title=hearty meal
actors.hero.talent.hearty_meal.desc=_+1:_ Eating food heals the Warrior for _3 HP_ when he is at or below 30% health.\n\n_+2:_ Eating food heals the Warrior for _5 HP_ when he is at or below 30% health.
actors.hero.talent.veterans_intuition.title=veteran's intuition
actors.hero.talent.veterans_intuition.desc=_+1:_ The Warrior identifies weapons _1.75x faster_ and armor _2.5x faster_.\n\n_+2:_ The Warrior identifies weapons _2.5x faster_ and armor _when he equips it_.
actors.hero.talent.provoked_anger.title=provoked anger
actors.hero.talent.provoked_anger.desc=_+1:_ When the Warrior's shielding breaks, his next physical attack will deal _2 bonus damage_.\n\n_+2:_ When the Warrior's shielding breaks, his next physical attack will deal _3 bonus damage_.
actors.hero.talent.iron_will.title=iron will
actors.hero.talent.iron_will.desc=_+1:_ The max shield provided by the Warrior's seal is _increased by 1_.\n\n_+2:_ The max shield provided by the Warrior's seal is _increased by 2_.
actors.hero.talent.iron_will.meta_desc=_If this talent is gained by a different hero_ it will grant its shielding benefit without the broken seal.
actors.hero.talent.iron_stomach.title=iron stomach
actors.hero.talent.iron_stomach.desc=_+1:_ Eating food takes the Warrior 1 turn and grants him _75% damage resistance_ while eating.\n\n_+2:_ Eating food takes the Warrior 1 turn and grants him _100% damage resistance_ while eating.
actors.hero.talent.liquid_willpower.title=liquid willpower
actors.hero.talent.liquid_willpower.desc=_+1:_ The Warrior instantly regains _50% of the shielding_ from his broken seal when drinking or throwing a potion, brew, or elixir.\n\n_+2:_ The Warrior instantly regains _75% of the shielding_ from his broken seal when drinking or throwing a potion, brew, or elixir.\n\nThe shield regeneration effect is doubled when using potions of strength, experience, or alchemy items that must be crafted using those potions.\n\nFor alchemy items with higher output quantities (e.g. aqua brew), this talent has a chance to trigger based on how many of that item is produced.
actors.hero.talent.liquid_willpower.meta_desc=_If this talent is gained by a different hero_ it will instead grant shielding equal to 5% max hp at +1, or 7.5% max hp at +2.
actors.hero.talent.runic_transference.title=runic transference
actors.hero.talent.runic_transference.desc=_+1:_ The Warrior's broken seal can transfer _regular glyphs_ in the same way it transfers an upgrade.\n\n_+2:_ The Warrior's broken seal can transfer _regular, powerful, and curse glyphs_ in the same way it transfers an upgrade.\n\nThe seal can only transfer glyphs if they were applied to the armor when the seal was attached.
actors.hero.talent.runic_transference.meta_desc=_If this talent is gained by a different hero_ it will instead help glyphs on your armor resist being removed by scrolls of upgrade. Glyphs will begin to be lost when upgrading from level 6(up from 4) at +1, or level 7(up from 4) at +2. The level where glyphs are guaranteed to be lost is unchanged at +8.
actors.hero.talent.lethal_momentum.title=lethal momentum
actors.hero.talent.lethal_momentum.desc=_+1:_ When the Warrior lands a killing blow on an enemy with a physical weapon, it has a _67% chance_ to take 0 turns.\n\n_+2:_ When the Warrior lands a killing blow on an enemy with a physical weapon, it has a _100% chance_ to take 0 turns.
actors.hero.talent.improvised_projectiles.title=improvised projectiles
actors.hero.talent.improvised_projectiles.desc=_+1:_ The Warrior can blind an enemy for _2 turns_ by throwing any item that isn’t a thrown weapon at them. This has a 50 turn cooldown.\n\n_+2:_ The Warrior can blind an enemy for _3 turns_ by throwing any item that isn’t a thrown weapon at them. This has a 50 turn cooldown.
actors.hero.talent.hold_fast.title=hold fast
actors.hero.talent.hold_fast.desc=_+1:_ When the Warrior waits he gains _1-2 armor_ until he moves.\n\n_+2:_ When the Warrior waits he gains _2-4 armor_ until he moves.\n\n_+3:_ When the Warrior waits he gains _3-6 armor_ until he moves.
actors.hero.talent.strongman.title=strongman
actors.hero.talent.strongman.desc=_+1:_ The Warrior's strength is _increased by 8%_, rounded down.\n\n_+2:_ The Warrior's strength is _increased by 13%_, rounded down.\n\n_+3:_ The Warrior's strength is _increased by 18%_, rounded down.
actors.hero.talent.endless_rage.title=endless rage
actors.hero.talent.endless_rage.desc=_+1:_ The Berserker can reach a max of _116% rage_.\n\n_+2:_ The Berserker can reach a max of _133% rage_.\n\n_+3:_ The Berserker can reach a max of _150% rage_.\n\nEach point of rage above 100% increases berserk shielding by 1% and reduces cooldown by 1%, but does not increase the damage bonus beyond +50%.
actors.hero.talent.deathless_fury.title=deathless fury
actors.hero.talent.deathless_fury.desc=_+1:_ Berserk automatically triggers if the Berserker is about to die and rage is at or above 100%, but it has a cooldown of _3 hero levels_ when this happens.\n\n_+2:_ Berserk automatically triggers if the Berserker is about to die and rage is at or above 100%, but it has a cooldown of _2 hero levels_ when this happens.\n\n_+3:_ Berserk automatically triggers if the Berserker is about to die and rage is at or above 100%, but it has a cooldown of _1 hero level_ when this happens.\n\nNote that the Berserker will still die if he has 0 HP when berserking ends.
actors.hero.talent.enraged_catalyst.title=enraged catalyst
actors.hero.talent.enraged_catalyst.desc=_+1:_ Enchantments and curses on the Berserker's weapon trigger more often the more rage he has, to a maximum of _15% more often_ at 100% rage.\n\n_+2:_ Enchantments and curses on the Berserker's weapon trigger more often the more rage he has, to a maximum of _30% more often_ at 100% rage.\n\n_+3:_ Enchantments and curses on the Berserker's weapon trigger more often the more rage he has, to a maximum of _45% more often_ at 100% rage.
actors.hero.talent.cleave.title=cleave
actors.hero.talent.cleave.desc=_+1:_ When the Gladiator kills an enemy, the combo cooldown for his next hit is increased to _15 turns_.\n\n_+2:_ When the Gladiator kills an enemy, the combo cooldown for his next hit is increased to _30 turns_.\n\n_+3:_ When the Gladiator kills an enemy, the combo cooldown for his next hit is increased to _45 turns_.
actors.hero.talent.lethal_defense.title=lethal defense
actors.hero.talent.lethal_defense.desc=_+1:_ When the Gladiator kills an enemy with a combo move, he _regains 33%_ of the broken seal's shielding.\n\n_+2:_ When the Gladiator kills an enemy with a combo move, he _regains 67%_ of the broken seal's shielding.\n\n_+3:_ When the Gladiator kills an enemy with a combo move, he _regains 100%_ of the broken seal's shielding.
actors.hero.talent.enhanced_combo.title=enhanced combo
actors.hero.talent.enhanced_combo.desc=_+1:_ When the Gladiator's combo is 7 or higher, Clobber's knockback range increases to 3, it inflicts vertigo, and it can knock enemies into pits.\n\n_+2:_ In addition to the benefits of +1, when the Gladiator's combo is 9 or higher Parry works on multiple attacks.\n\n_+3:_ In addition to the benefits of +1 and +2, the Gladiator can leap up to combo/3 tiles when using Slam, Crush, or Fury.
actors.hero.talent.body_slam.title=body slam
actors.hero.talent.body_slam.desc=_+1:_ When the Warrior lands after jumping, all adjacent enemies take damage equal to _1-4 plus 25%_ of his damage blocking power.\n\n_+2:_ When the Warrior lands after jumping, all adjacent enemies take damage equal to _2-8 plus 50%_ of his damage blocking power.\n\n_+3:_ When the Warrior lands after jumping, all adjacent enemies take damage equal to _3-12 plus 75%_ of his damage blocking power.\n\n_+4:_ When the Warrior lands after jumping, all adjacent enemies take damage equal to _4-16 plus 100%_ of his damage blocking power.
actors.hero.talent.impact_wave.title=impact wave
actors.hero.talent.impact_wave.desc=_+1:_ When the Warrior lands after jumping, all adjacent enemies are knocked _2 tiles_ back and have a _25% chance_ of becoming vulnerable for 5 turns.\n\n_+2:_ When the Warrior lands after jumping, all adjacent enemies are knocked _3 tiles_ back and have a _50% chance_ of becoming vulnerable for 5 turns.\n\n_+3:_ When the Warrior lands after jumping, all adjacent enemies are knocked _4 tiles_ back and have a _75% chance_ of becoming vulnerable for 5 turns.\n\n_+4:_ When the Warrior lands after jumping, all adjacent enemies are knocked _5 tiles_ back and have a _100% chance_ of becoming vulnerable for 5 turns.
actors.hero.talent.double_jump.title=double jump
actors.hero.talent.double_jump.desc=_+1:_ If the Warrior performs a second leap within 3 turns, that leap has a _16% reduced_ charge cost.\n\n_+2:_ If the Warrior performs a second leap within 3 turns, that leap has a _30% reduced_ charge cost.\n\n_+3:_ If the Warrior performs a second leap within 3 turns, that leap has a _40% reduced_ charge cost.\n\n_+4:_ If the Warrior performs a second leap within 3 turns, that leap has a _50% reduced_ charge cost.
actors.hero.talent.expanding_wave.title=expanding wave
actors.hero.talent.expanding_wave.desc=_+1:_ Shockwave's range is increased to _6 tiles_ from 5, and its width is increased to _75 degrees_ from 60.\n\n_+2:_ Shockwave's range is increased to _7 tiles_ from 5, and its width is increased to _90 degrees_ from 60.\n\n_+3:_ Shockwave's range is increased to _8 tiles_ from 5, and its width is increased to _105 degrees_ from 60.\n\n_+4:_ Shockwave's range is increased to _9 tiles_ from 5, and its width is increased to _120 degrees_ from 60.
actors.hero.talent.striking_wave.title=striking wave
actors.hero.talent.striking_wave.desc=_+1:_ Shockwave has a _30% chance_ to also use on-hit effects like enchantments and combo.\n\n_+2:_ Shockwave has a _60% chance_ to also use on-hit effects like enchantments and combo.\n\n_+3:_ Shockwave has a _90% chance_ to also use on-hit effects like enchantments and combo.\n\n_+4:_ Shockwave has a _100% chance_ to also use on-hit effects like enchantments and combo, and it gives enchantments _+20% power_.
actors.hero.talent.shock_force.title=shock force
actors.hero.talent.shock_force.desc=_+1:_ Shockwave deals _20% more damage_ and has a _25% chance_ to stun instead of cripple.\n\n_+2:_ Shockwave deals _40% more damage_ and has a _50% chance_ to stun instead of cripple.\n\n_+3:_ Shockwave deals _60% more damage_ and has a _75% chance_ to stun instead of cripple.\n\n_+4:_ Shockwave deals _80% more damage_ and has a _100% chance_ to stun instead of cripple.
actors.hero.talent.sustained_retribution.title=sustained retribution
actors.hero.talent.sustained_retribution.desc=_+1:_ The Warrior deals _115% bonus damage_ spread over _2 hits_, instead of 100% bonus damage in 1 hit.\n\n_+2:_ The Warrior deals _130% bonus damage_ spread over _3 hits_, instead of 100% bonus damage in 1 hit.\n\n_+3:_ The Warrior deals _145% bonus damage_ spread over _4 hits_, instead of 100% bonus damage in 1 hit.\n\n_+4:_ The Warrior deals _160% bonus damage_ spread over _5 hits_, instead of 100% bonus damage in 1 hit.
actors.hero.talent.shrug_it_off.title=shrug it off
actors.hero.talent.shrug_it_off.desc=_+1:_ The Warrior's damage reduction while enduring is _increased to 60%_, from 50%.\n\n_+2:_ The Warrior's damage reduction while enduring is _increased to 68%_, from 50%.\n\n_+3:_ The Warrior's damage reduction while enduring is _increased to 74%_, from 50%.\n\n_+4:_ The Warrior's damage reduction while enduring is _increased to 80%_, from 50%.
actors.hero.talent.even_the_odds.title=even the odds
actors.hero.talent.even_the_odds.desc=_+1:_ The Warrior deals an additional _5% bonus damage_ for every enemy within 2 tiles when enduring ends.\n\n_+2:_ The Warrior deals an additional _10% bonus damage_ for every enemy within 2 tiles when enduring ends.\n\n_+3:_ The Warrior deals an additional _15% bonus damage_ for every enemy within 2 tiles when enduring ends.\n\n_+4:_ The Warrior deals an additional _20% bonus damage_ for every enemy within 2 tiles when enduring ends.
actors.hero.talent.empowering_meal.title=empowering meal
actors.hero.talent.empowering_meal.desc=_+1:_ Eating food grants the Mage _2 bonus damage_ on the next 3 times he deals damage with a wand.\n\n_+2:_ Eating food grants the Mage _3 bonus damage_ on the next 3 times he deals damage with a wand.
actors.hero.talent.scholars_intuition.title=scholar's intuition
actors.hero.talent.scholars_intuition.desc=_+1:_ The Mage identifies wands _3x faster_.\n\n_+2:_ The Mage identifies wands _when he uses them_.
actors.hero.talent.lingering_magic.title=lingering magic
actors.hero.talent.lingering_magic.desc=_+1:_ When the Mage zaps with a wand or staff, his next physical attack deals _1-2 bonus damage_.\n\n_+2:_ When the Mage zaps with a wand or staff, his next physical attack deals _2 bonus damage_.
actors.hero.talent.backup_barrier.title=backup barrier
actors.hero.talent.backup_barrier.desc=_+1:_ The Mage gains _3 shielding_ whenever he spends the last charge in his staff.\n\n_+2:_ The Mage gains _5 shielding_ whenever he spends the last charge in his staff.
actors.hero.talent.backup_barrier.meta_desc=_If this talent is gained by a different hero_ it will instead trigger from the hero's highest level wand.
actors.hero.talent.energizing_meal.title=energizing meal
actors.hero.talent.energizing_meal.desc=_+1:_ Eating food takes the Mage 1 turn and grants him _5 turns of wand recharging_.\n\n_+2:_ Eating food takes the Mage 1 turn and grants him _8 turns of wand recharging_.
actors.hero.talent.inscribed_power.title=inscribed power
actors.hero.talent.inscribed_power.desc=_+1:_ When the Mage reads a scroll or uses a spell item, his _next 2 wand zaps_ get +2 levels.\n\n_+2:_ When the Mage reads a scroll or uses a spell item, his _next 3 wand zaps_ get +2 levels.\n\nThe number of enhanced wand zaps is doubled when using a scroll of upgrade, transmutation, or alchemy items that must be crafted using those scrolls.\n\nFor alchemy items with higher output quantities (e.g. most spells), this talent has a chance to trigger based on how many of that item is produced.
actors.hero.talent.wand_preservation.title=wand preservation
actors.hero.talent.wand_preservation.desc=_+1:_ When the Mage imbues a new wand into his staff, the old wand is returned at +0, _but this can only be done once._\n\n_+2:_ When the Mage imbues a new wand into his staff, the old wand is returned at +0, _this can be done once per hero level._
actors.hero.talent.wand_preservation.meta_desc=_If this talent is gained by a different hero_ it will instead increase the amount of arcane resin gained when putting a wand into an alchemy pot by 1 at +1, or by 2 at +2.
actors.hero.talent.arcane_vision.title=arcane vision
actors.hero.talent.arcane_vision.desc=_+1:_ When the Mage zaps an enemy, he gains mind vision on them for _10 turns_.\n\n_+2:_ When the Mage zaps an enemy, he gains mind vision on them for _15 turns_.
actors.hero.talent.shield_battery.title=shield battery
actors.hero.talent.shield_battery.desc=_+1:_ The Mage can self-target with a wand to convert all of its charges into shielding at a rate of _4% max HP per charge_.\n\n_+2:_ The Mage can self-target with a wand to convert all of its charges into shielding at a rate of _6% max HP per charge_.
actors.hero.talent.desperate_power.title=desperate power
actors.hero.talent.desperate_power.desc=_+1:_ The Mage's wands and staff gain _+1 level_ on their final zap when they are down to their last charge.\n\n_+2:_ The Mage's wands and staff gain _+2 levels_ on their final zap when they are down to their last charge.\n\n_+3:_ The Mage's wands and staff gain _+3 levels_ on their final zap when they are down to their last charge.
actors.hero.talent.ally_warp.title=ally warp
actors.hero.talent.ally_warp.desc=_+1:_ The Mage can select an ally to instantly swap places with them, with a _2 tile range_.\n\n_+2:_ The Mage can select an ally to instantly swap places with them, with a _4 tile range_.\n\n_+3:_ The Mage can select an ally to instantly swap places with them, with a _6 tile range_.\n\nThe Mage cannot swap places with immobile allies.
actors.hero.talent.empowered_strike.title=empowered strike
actors.hero.talent.empowered_strike.desc=_+1:_ The Battlemage's first melee strike with his staff after zapping with it deals _+16% damage_ and the staff's bonus effect gets _+50% power_.\n\n_+2:_ The Battlemage's first melee strike with his staff after zapping with it deals _+33% damage_ and the staff's bonus effect gets _+100% power_.\n\n_+3:_ The Battlemage's first melee strike with his staff after zapping with it deals _+50% damage_ and the staff's bonus effect gets _+150% power_.
actors.hero.talent.mystical_charge.title=mystical charge
actors.hero.talent.mystical_charge.desc=_+1:_ Striking with his staff grants the Battlemage _0.5 turns_ worth of artifact recharging.\n\n_+2:_ Striking with his staff grants the Battlemage _1 turn_ worth of artifact recharging.\n\n_+3:_ Striking with his staff grants the Battlemage _1.5 turns_ worth of artifact recharging.
actors.hero.talent.excess_charge.title=excess charge
actors.hero.talent.excess_charge.desc=_+1:_ When the Battlemage's staff is fully charged, its next zap will grant him _0.67 shielding_ per level of the staff.\n\n_+2:_ When the Battlemage's staff is fully charged, its next zap will grant him _1.33 shielding_ per level of the staff.\n\n_+3:_ When the Battlemage's staff is fully charged, its next zap will grant him _2 shielding_ per level of the staff.
actors.hero.talent.soul_siphon.title=soul siphon
actors.hero.talent.soul_siphon.desc=_+1:_ Physical damage dealt by other characters triggers the Warlock's soul mark at _13% effectiveness_.\n\n_+2:_ Physical damage dealt by other characters triggers the Warlock's soul mark at _27% effectiveness_.\n\n_+3:_ Physical damage dealt by other characters triggers the Warlock's soul mark at _40% effectiveness_.
actors.hero.talent.soul_eater.title=soul eater
actors.hero.talent.soul_eater.desc=_+1:_ Soul mark grants _0.33 turns_ of satiety for each physical damage dealt. Soul marked enemies have a _10% chance_ to trigger on-eat effects when they die.\n\n_+2:_ Soul mark grants _0.67 turns_ of satiety for each physical damage dealt. Soul marked enemies have a _20% chance_ to trigger on-eat effects when they die.\n\n_+3:_ Soul mark grants _1 turn_ of satiety for each physical damage dealt. Soul marked enemies have a _30% chance_ to trigger on-eat effects when they die.
actors.hero.talent.necromancers_minions.title=necromancer's minions
actors.hero.talent.necromancers_minions.desc=_+1:_ When a soul marked enemy dies, the Warlock has a _13% chance_ to raise them as a corrupted wraith.\n\n_+2:_ When a soul marked enemy dies, the Warlock has a _27% chance_ to raise them as a corrupted wraith.\n\n_+3:_ When a soul marked enemy dies, the Warlock has a _40% chance_ to raise them as a corrupted wraith.
actors.hero.talent.blast_radius.title=blast radius
actors.hero.talent.blast_radius.desc=_+1:_ Elemental blast's radius is increased to _5 tiles_, from 4.\n\n_+2:_ Elemental blast's radius is increased to _6 tiles_, from 4.\n\n_+3:_ Elemental blast's radius is increased to _7 tiles_, from 4.\n\n_+4:_ Elemental blast's radius is increased to _8 tiles_, from 4.
actors.hero.talent.elemental_power.title=elemental power
actors.hero.talent.elemental_power.desc=_+1:_ The power of elemental blast is increased by _25%_.\n\n_+2:_ The power of elemental blast is increased by _50%_.\n\n_+3:_ The power of elemental blast is increased by _75%_.\n\n_+4:_ The power of elemental blast is increased by _100%_.
actors.hero.talent.reactive_barrier.title=reactive barrier
actors.hero.talent.reactive_barrier.desc=_+1:_ The Mage gains _2.5 shielding_ for every character affected by elemental blast, to a max of 5 characters.\n\n_+2:_ The Mage gains _5 shielding_ for every character affected by elemental blast, to a max of 6 characters.\n\n_+3:_ The Mage gains _7.5 shielding_ for every character affected by elemental blast, to a max of 7 characters.\n\n_+4:_ The Mage gains _10 shielding_ for every character affected by elemental blast, to a max of 8 characters.
actors.hero.talent.wild_power.title=wild power
actors.hero.talent.wild_power.desc=_+1:_ When using wild magic, wands will be boosted by either _2 or 3, up to +4_.\n\n_+2:_ When using wild magic, wands will be boosted by _3, up to +5_.\n\n_+3:_ When using wild magic, wands will be boosted by either _3 or 4, up to +6_.\n\n_+4:_ When using wild magic, wands will be boosted by _4, up to +7_.
actors.hero.talent.fire_everything.title=fire everything
actors.hero.talent.fire_everything.desc=_+1:_ Wild magic now fires _5 times_ up from 4, and each wand has a _25% chance_ to be usable 3 times.\n\n_+2:_ Wild magic now fires _6 times_ up from 4, and each wand has a _50% chance_ to be usable 3 times.\n\n_+3:_ Wild magic now fires _7 times_ up from 4, and each wand has a _75% chance_ to be usable 3 times.\n\n_+4:_ Wild magic now fires _8 times_ up from 4, and each wand has a _100% chance_ to be usable 3 times.
actors.hero.talent.conserved_magic.title=conserved magic
actors.hero.talent.conserved_magic.desc=_+1:_ Each zap from wild magic now uses _0.33 charges_ instead of 0.5, and wild magic has a _25% chance_ to not spend a turn.\n\n_+2:_ Each zap from wild magic now uses _0.225 charges_ instead of 0.5, and wild magic has a _50% chance_ to not spend a turn.\n\n_+3:_ Each zap from wild magic now uses _0.15 charges_ instead of 0.5, and wild magic has a _75% chance_ to not spend a turn.\n\n_+4:_ Each zap from wild magic now uses _0.1 charges_ instead of 0.5, and wild magic has a _100% chance_ to not spend a turn.
actors.hero.talent.telefrag.title=Telefrag
actors.hero.talent.telefrag.desc=_+1:_ If the Mage warps into another character he deals _10-15 damage_ to it, but also takes _5 damage_.\n\n_+2:_ If the Mage warps into another character he deals _20-30 damage_ to it, but also takes _10 damage_.\n\n_+3:_ If the Mage warps into another character he deals _30-45 damage_ to it, but also takes _15 damage_.\n\n_+4:_ If the Mage warps into another character he deals _40-60 damage_ to it, but also takes _20 damage_.\n\nThe hero cannot be killed by this talent, the self damage can be reduced by magic resisting effects.
actors.hero.talent.remote_beacon.title=Remote Beacon
actors.hero.talent.remote_beacon.desc=_+1:_ The Mage can place a beacon at any location within _4 tiles_.\n\n_+2:_ The Mage can place a beacon at any location within _8 tiles_.\n\n_+3:_ The Mage can place a beacon at any location within _12 tiles_.\n\n_+4:_ The Mage can place a beacon at any location within _16 tiles_.\n\nThe Mage cannot place beacons in locations that are inaccessible.
actors.hero.talent.longrange_warp.title=Longrange Warp
actors.hero.talent.longrange_warp.desc=_+1:_ The Mage can now warp between floors, at _150% charge cost_.\n\n_+2:_ The Mage can now warp between floors, at _117% charge cost_.\n\n_+3:_ The Mage can now warp between floors, at _83% charge cost_.\n\n_+4:_ The Mage can now warp between floors, at _50% charge cost_.\n\nThe Mage cannot use longrange warp to leave a locked floor.
actors.hero.talent.cached_rations.title=cached rations
actors.hero.talent.cached_rations.desc=_+1:_ The Rogue can find _2 supply rations_ placed in chests while he explores the next few floors of the dungeon.\n\n_+2:_ The Rogue can find _3 supply rations_ placed in chests while he explores the next few floors of the dungeon.\n\nSupply rations are eaten quickly, restore a moderate amount of satiety, heal 5 hp, and restore 1 charge to the cloak of shadows.
actors.hero.talent.thiefs_intuition.title=thief's intuition
actors.hero.talent.thiefs_intuition.desc=_+1:_ The Rogue identifies rings _2x faster_, and identifies the type of a ring _when he equips it_.\n\n_+2:_ The Rogue identifies rings _when he equips them_, and identifies the type of a ring _when he picks it up_.
actors.hero.talent.sucker_punch.title=sucker punch
actors.hero.talent.sucker_punch.desc=_+1:_ The Rogue deals _1-2 bonus damage_ the first time he surprise attacks an enemy.\n\n_+2:_ The Rogue deals _2 bonus damage_ the first time he surprise attacks an enemy.
actors.hero.talent.protective_shadows.title=protective shadows
actors.hero.talent.protective_shadows.desc=_+1:_ The Rogue gains one shielding _every other turn_ he is invisible, _to a max of 3_.\n\n_+2:_ The Rogue gains one shielding _every turn_ he is invisible, _to a max of 5_.
actors.hero.talent.mystical_meal.title=mystical meal
actors.hero.talent.mystical_meal.desc=_+1:_ Eating food takes the Rogue 1 turn (supply rations are eaten instantly) and grants him _3 turns of artifact recharging_.\n\n_+2:_ Eating food takes the Rogue 1 turn (supply rations are eaten instantly) and grants him _5 turns of artifact recharging_.\n\nThis talent cannot be used to let the horn of plenty recharge itself.
actors.hero.talent.inscribed_stealth.title=inscribed stealth
actors.hero.talent.inscribed_stealth.desc=_+1:_ The Rogue gains _3 turns_ of invisibility after reading a scroll or using a spell item.\n\n_+2:_ The Rogue gains _5 turns_ of invisibility after reading a scroll or using a spell item\n\nThe invisibility duration is doubled when using a scroll of upgrade, scroll of transmutation, or alchemy items that must be crafted using those scrolls.\n\nFor alchemy items with higher output quantities (e.g. most spells), this talent has a chance to trigger based on how many of that item is produced.
actors.hero.talent.wide_search.title=wide search
actors.hero.talent.wide_search.desc=_+1:_ The Rogue’s search radius is increased from a 5x5 square to a _7x7 circle_.\n\n_+2:_ The Rogue’s search radius is increased from a 5x5 square to a _7x7 square_.
actors.hero.talent.wide_search.meta_desc=_If this talent is gained by a different hero_ it will instead increase their search radius from a 3x3 square to a 5x5 circle at +1, or a 5x5 square at +2.
actors.hero.talent.silent_steps.title=silent steps
actors.hero.talent.silent_steps.desc=_+1:_ The Rogue will not wake sleeping enemies while he is _3 or more tiles away from them_.\n\n_+2:_ The Rogue will not wake sleeping enemies while he is _not adjacent to them_.
actors.hero.talent.rogues_foresight.title=rogue's foresight
actors.hero.talent.rogues_foresight.desc=_+1:_ When the Rogue is on a level with a secret room, he has a _75% chance to notice_ that the level contains a secret.\n\n_+2:_ When the Rogue is on a level with a secret room, he has a _100% chance to notice_ that the level contains a secret.
actors.hero.talent.light_cloak.title=light cloak
actors.hero.talent.light_cloak.desc=_+1:_ The Rogue can use his cloak of shadows when it is not equipped, but it recharges at _25% speed_.\n\n_+2:_ The Rogue can use his cloak of shadows when it is not equipped, but it recharges at _50% speed_.\n\n_+3:_ The Rogue can use his cloak of shadows when it is not equipped, but it recharges at _75% speed_.
actors.hero.talent.light_cloak.meta_desc=_If this talent is gained by a different hero_ it will instead increase the charging speed of all artifacts by 7/13/20% at +1/+2/+3.
actors.hero.talent.enhanced_rings.title=enhanced rings
actors.hero.talent.enhanced_rings.desc=_+1:_ When the Rogue uses an artifact, his rings gain +1 upgrade for _3 turns_.\n\n_+2:_ When the Rogue uses an artifact, his rings gain +1 upgrade for _6 turns_.\n\n_+3:_ When the Rogue uses an artifact, his rings gain +1 upgrade for _9 turns_.
actors.hero.talent.enhanced_lethality.title=enhanced lethality
actors.hero.talent.enhanced_lethality.desc=_+1:_ The Assassin can assassinate enemies left at below _4/13/27/67% health_ per level of preparation, up from 3/10/20/50%.\n\n_+2:_ The Assassin can assassinate enemies left at below _5/17/33/83% health_ per level of preparation, up from 3/10/20/50%.\n\n_+3:_ The Assassin can assassinate enemies left at below _6/20/40/100% health_ per level of preparation, up from 3/10/20/50%.
actors.hero.talent.assassins_reach.title=assassin's reach
actors.hero.talent.assassins_reach.desc=_+1:_ The Assassin's blink range per level of preparation is increased to _1/3/4/6 tiles_, from 1/2/3/4.\n\n_+2:_ The Assassin's blink range per level of preparation is increased to _2/4/6/8 tiles_, from 1/2/3/4.\n\n_+3:_ The Assassin's blink range per level of preparation is increased to _2/5/7/10 tiles_, from 1/2/3/4.\n\nThis blink can go through hazards and enemies, but not through solid terrain like walls.
actors.hero.talent.bounty_hunter.title=bounty hunter
actors.hero.talent.bounty_hunter.desc=_+1:_ When the Assassin kills an enemy with a prepared strike their item drop chance is increased by _2/4/8/16%_, per level of preparation.\n\n_+2:_ When the Assassin kills an enemy with a prepared strike their item drop chance is increased by _4/8/16/32%_, per level of preparation.\n\n_+3:_ When the Assassin kills an enemy with a prepared strike their item drop chance is increased by _6/12/24/48%_, per level of preparation.
actors.hero.talent.evasive_armor.title=evasive armor
actors.hero.talent.evasive_armor.desc=_+1:_ While freerunning, the Freerunner gains an additional _+1 evasion_ per excess point of strength on his armor.\n\n_+2:_ While freerunning, the Freerunner gains an additional _+2 evasion_ per excess point of strength on his armor.\n\n_+3:_ While freerunning, the Freerunner gains an additional _+3 evasion_ per excess point of strength on his armor.
actors.hero.talent.projectile_momentum.title=projectile momentum
actors.hero.talent.projectile_momentum.desc=_+1:_ While freerunning, the Freerunner gains _+20% accuracy and +15% damage_ with thrown weapons.\n\n_+2:_ While freerunning, the Freerunner gains _+40% accuracy and +30% damage_ with thrown weapons.\n\n_+3:_ While freerunning, the Freerunner gains _+60% accuracy and +45% damage_ with thrown weapons.
actors.hero.talent.speedy_stealth.title=speedy stealth
actors.hero.talent.speedy_stealth.desc=_+1:_ The Freerunner gains 2 stacks of momentum per turn while he is invisible.\n\n_+2:_ In addition to the benefits of +1, freerunning no longer counts down while the Freerunner is invisible.\n\n_+3:_ In addition to the benefits of +1 and +2, the Freerunner moves at 2x speed while invisible, regardless of whether he is freerunning or not.
actors.hero.talent.hasty_retreat.title=hasty retreat
actors.hero.talent.hasty_retreat.desc=_+1:_ After blinking the Rogue gains _1 turn_ of haste and invisibility.\n\n_+2:_ After blinking the Rogue gains _2 turns_ of haste and invisibility.\n\n_+3:_ After blinking the Rogue gains _3 turns_ of haste and invisibility.\n\n_+4:_ After blinking the Rogue gains _4 turns_ of haste and invisibility.
actors.hero.talent.body_replacement.title=body replacement
actors.hero.talent.body_replacement.desc=_+1:_ After blinking, the Rogue leaves a wooden decoy behind that has _20 health and 1-3 armor_.\n\n_+2:_ After blinking, the Rogue leaves a wooden decoy behind that has _40 health and 2-6 armor_.\n\n_+3:_ After blinking, the Rogue leaves a wooden decoy behind that has _60 health and 3-9 armor_.\n\n_+4:_ After blinking, the Rogue leaves a wooden decoy behind that has _80 health and 4-12 armor_.\n\nOnly one decoy can be active at a time.
actors.hero.talent.shadow_step.title=shadow step
actors.hero.talent.shadow_step.desc=_+1:_ If the rogue uses smoke bomb while invisible, it occurs instantly and has a _16% reduced_ charge cost, but it also doesn't blind enemies or trigger other talents.\n\n_+2:_ If the rogue uses smoke bomb while invisible, it occurs instantly and has a _30% reduced_ charge cost, but it also doesn't blind enemies or trigger other talents.\n\n_+3:_ If the rogue uses smoke bomb while invisible, it occurs instantly and has a _41% reduced_ charge cost, but it also doesn't blind enemies or trigger other talents.\n\n_+4:_ If the rogue uses smoke bomb while invisible, it occurs instantly and has a _50% reduced_ charge cost, but it also doesn't blind enemies or trigger other talents.
actors.hero.talent.fear_the_reaper.title=fear the reaper
actors.hero.talent.fear_the_reaper.desc=_+1:_ When a death marked enemy reaches 0 hp, they become _crippled_.\n\n_+2:_ When a death marked enemy reaches 0 hp, they become _feared and crippled_.\n\n_+3:_ When a death marked enemy reaches 0 hp, they become _feared and crippled_ and enemies within 3 tiles become _crippled_.\n\n_+4:_ When a death marked enemy reaches 0 hp, they become _feared and crippled_ and enemies within 3 tiles become _feared and crippled_.
actors.hero.talent.deathly_durability.title=deathly durability
actors.hero.talent.deathly_durability.desc=_+1:_ Enemies killed by death mark give the rogue shielding equal to _13%_ of their hp when they were marked.\n\n_+2:_ Enemies killed by death mark give the rogue shielding equal to _25%_ of their hp when they were marked.\n\n_+3:_ Enemies killed by death mark give the rogue shielding equal to _38%_ of their hp when they were marked.\n\n_+4:_ Enemies killed by death mark give the rogue shielding equal to _50%_ of their hp when they were marked.
actors.hero.talent.double_mark.title=double mark
actors.hero.talent.double_mark.desc=_+1:_ Marking a second target at the same time as the first one has a _30% reduced_ charge cost.\n\n_+2:_ Marking a second target at the same time as the first one has a _50% reduced_ charge cost.\n\n_+3:_ Marking a second target at the same time as the first one has a _65% reduced_ charge cost.\n\n_+4:_ Marking a second target at the same time as the first one has a _75% reduced_ charge cost.
actors.hero.talent.shadow_blade.title=shadow blade
actors.hero.talent.shadow_blade.desc=_+1:_ The shadow clone gains _8%_ of the hero's damage per turn, and has a _25% chance_ to use the enchantment on the hero's weapon.\n\n_+2:_ The shadow clone gains _16%_ of the hero's damage per turn, and has a _50% chance_ to use the enchantment on the hero's weapon.\n\n_+3:_ The shadow clone gains _24%_ of the hero's damage per turn, and has a _75% chance_ to use the enchantment on the hero's weapon.\n\n_+4:_ The shadow clone gains _32%_ of the hero's damage per turn, and has a _100% chance_ to use the enchantment on the hero's weapon.
actors.hero.talent.cloned_armor.title=cloned armor
actors.hero.talent.cloned_armor.desc=_+1:_ The shadow clone gains _12%_ of the hero's armor value, and has a _25% chance_ to use the glyph on the hero's armor.\n\n_+2:_ The shadow clone gains _24%_ of the hero's armor value, and has a _50% chance_ to use the glyph on the hero's armor.\n\n_+3:_ The shadow clone gains _36%_ of the hero's armor value, and has a _75% chance_ to use the glyph on the hero's armor.\n\n_+4:_ The shadow clone gains _48%_ of the hero's armor value, and has a _100% chance_ to use the glyph on the hero's armor.
actors.hero.talent.perfect_copy.title=perfect copy
actors.hero.talent.perfect_copy.desc=_+1:_ The shadow clone gains _10%_ of the hero's max HP, and can instantly swap places with the hero up to _1 tile_ away.\n\n_+2:_ The shadow clone gains _20%_ of the hero's max HP, and can instantly swap places with the hero up to _2 tiles_ away.\n\n_+3:_ The shadow clone gains _30%_ of the hero's max HP, and can instantly swap places with the hero up to _3 tiles_ away.\n\n_+4:_ The shadow clone gains _40%_ of the hero's max HP, and can instantly swap places with the hero up to _4 tiles_ away.
actors.hero.talent.natures_bounty.title=nature's bounty
actors.hero.talent.natures_bounty.desc=_+1:_ The Huntress can find _4 berries_ hidden in tall grass as she explores the next few floors of the dungeon.\n\n_+2:_ The Huntress can find _6 berries_ hidden in tall grass as she explores the next few floors of the dungeon.\n\nBerries are eaten quickly, restore a small amount of satiety, and might contain a usable seed.
actors.hero.talent.survivalists_intuition.title=survivalist's intuition
actors.hero.talent.survivalists_intuition.desc=_+1:_ The Huntress identifies all equipment _1.75x faster_.\n\n_+2:_ The Huntress identifies all equipment _2.5x faster_.
actors.hero.talent.followup_strike.title=followup strike
actors.hero.talent.followup_strike.desc=_+1:_ When the Huntress hits an enemy with her bow or a thrown weapon, her next melee attack against that enemy deals _2 bonus damage_.\n\n_+2:_ When the Huntress hits an enemy with her bow or a thrown weapon, her next melee attack against that enemy deals _3 bonus damage_.
actors.hero.talent.natures_aid.title=nature's aid
actors.hero.talent.natures_aid.desc=_+1:_ The Huntress gains 0-2 armor of barkskin, which fades every _3 turns_ when a plant's effect is activated in her vision.\n\n_+2:_ The Huntress gains 0-2 armor of barkskin, which fades every _5 turns_ when a plant's effect is activated in her vision.
actors.hero.talent.invigorating_meal.title=invigorating meal
actors.hero.talent.invigorating_meal.desc=_+1:_ Eating food takes the Huntress 1 turn (berries are eaten instantly) and grants her _1 turn of haste_.\n\n_+2:_ Eating food takes the Huntress 1 turn (berries are eaten instantly) and grants her _2 turns of haste_.
actors.hero.talent.liquid_nature.title=liquid nature
actors.hero.talent.liquid_nature.desc=_+1:_ When the Huntress drinks or throws a potion, brew, or elixir, _up to 4 grass tiles_ sprout in the surrounding area, and adjacent enemies are rooted for _1 turn_.\n\n_+2:_ When the Huntress drinks or throws a potion, brew, or elixir, _up to 6 grass tiles_ sprout in the surrounding area, and adjacent enemies are rooted for _2 turns_.\n\nThe amount of grass and root duration are doubled when using potions of strength, experience, or alchemy items that must be crafted using those potions.\n\nFor alchemy items with higher output quantities (e.g. aqua brew), this talent has a chance to trigger based on how many of that item is produced.
actors.hero.talent.rejuvenating_steps.title=rejuvenating steps
actors.hero.talent.rejuvenating_steps.desc=_+1:_ When the Huntress steps on short grass or embers, they spring up into tall grass which the Huntress immediately furrows. This has a _10 turn cooldown_.\n\n_+2:_ When the Huntress steps on short grass or embers, they spring up into tall grass which the Huntress immediately furrows. This has a _5 turn cooldown_.\n\nThis talent will produce furrowed grass if passive regeneration effects are disabled or the hero has not gained exp in a long time.
actors.hero.talent.heightened_senses.title=heightened senses
actors.hero.talent.heightened_senses.desc=_+1:_ The Huntress gains mind vision on any enemy within _2 tiles of her position_.\n\n_+2:_ The Huntress gains mind vision on any enemy within _3 tiles of her position_.
actors.hero.talent.durable_projectiles.title=durable projectiles
actors.hero.talent.durable_projectiles.desc=_+1:_ Thrown weapons have _+50% durability_ when used by the Huntress.\n\n_+2:_ Thrown weapons have _+75% durability_ when used by the Huntress.
actors.hero.talent.point_blank.title=point blank
actors.hero.talent.point_blank.desc=_+1:_ When the Huntress uses her bow or a thrown weapon at melee range it has _-30% accuracy,_ instead of -50%.\n\n_+2:_ When the Huntress uses her bow or a thrown weapon at melee range it has _-10% accuracy,_ instead of -50%.\n\n_+3:_ When the Huntress uses her bow or a thrown weapon at melee range it has _+10% accuracy,_ instead of -50%.\n\nNote that thrown weapons or the spirit bow always have +50% accuracy when used at a distance.
actors.hero.talent.seer_shot.title=seer shot
actors.hero.talent.seer_shot.desc=_+1:_ When the Huntress fires an arrow at the ground, it grants vision in a 3x3 area around it for _5 turns_. This has a 20 turn cooldown.\n\n_+2:_ When the Huntress fires an arrow at the ground, it grants vision in a 3x3 area around it for _10 turns_. This has a 20 turn cooldown.\n\n_+3:_ When the Huntress fires an arrow at the ground, it grants vision in a 3x3 area around it for _15 turns_. This has a 20 turn cooldown.
actors.hero.talent.seer_shot.meta_desc=_If this talent is gained by a different hero_ it will trigger from any thrown weapon.
actors.hero.talent.farsight.title=farsight
actors.hero.talent.farsight.desc=_+1:_ The Sniper's vision range is _increased by 25%_.\n\n_+2:_ The Sniper's vision range is _increased by 50%_.\n\n_+3:_ The Sniper's vision range is _increased by 75%_.
actors.hero.talent.shared_enchantment.title=shared enchantment
actors.hero.talent.shared_enchantment.desc=_+1:_ Thrown weapons have a _33% chance_ to use the enchantment on the Sniper's bow.\n\n_+2:_ Thrown weapons have a _67% chance_ to use the enchantment on the Sniper's bow.\n\n_+3:_ Thrown weapons have a _100% chance_ to use the enchantment on the Sniper's bow.\n\nThis talent does not apply to darts shot from an enchanted crossbow, they already trigger the crossbow's enchantment.
actors.hero.talent.shared_upgrades.title=shared upgrades
actors.hero.talent.shared_upgrades.desc=_+1:_ When the Sniper attacks with an upgraded thrown weapon, each level increases the duration of sniper's mark by 1 turn and the damage of her special attack by _10%_.\n\n_+2:_ When the Sniper attacks with an upgraded thrown weapon, each level increases the duration of sniper's mark by 1 turn and the damage of her special attack by _20%_.\n\n_+3:_ When the Sniper attacks with an upgraded thrown weapon, each level increases the duration of sniper's mark by 1 turn and the damage of her special attack by _30%_.
actors.hero.talent.durable_tips.title=durable tips
actors.hero.talent.durable_tips.desc=_+1:_ Tipped darts have _2x durability_ when the Warden uses them.\n\n_+2:_ Tipped darts have _3x durability_ when the Warden uses them.\n\n_+3:_ Tipped darts have _4x durability_ when the Warden uses them.
actors.hero.talent.barkskin.title=barkskin
actors.hero.talent.barkskin.desc=_+1:_ When stepping in grass, the Warden gains _0-50% of her level_ in barkskin armor which fades every turn.\n\n_+2:_ When stepping in grass, the Warden gains _0-100% of her level_ in barkskin armor which fades every turn.\n\n_+3:_ When stepping in grass, the Warden gains _0-150% of her level_ in barkskin armor which fades every turn.
actors.hero.talent.shielding_dew.title=shielding dew
actors.hero.talent.shielding_dew.desc=_+1:_ Dewdrops can shield the Warden when her health is full, up to _20% of her max HP_.\n\n_+2:_ Dewdrops can shield the Warden when her health is full, up to _40% of her max HP_.\n\n_+3:_ Dewdrops can shield the Warden when her health is full, up to _60% of her max HP_.
actors.hero.talent.fan_of_blades.title=fan of blades
actors.hero.talent.fan_of_blades.desc=_+1:_ Spectral blades can hit up to _1 additional target_ for 50% damage. The target must be visible and within a _30 degree_ cone AOE.\n\n_+2:_ Spectral blades can hit up to _2 additional targets_ for 50% damage. The targets must be visible and within a _60 degree_ cone AOE.\n\n_+3:_ Spectral blades can hit up to _3 additional targets_ for 50% damage. The targets must be visible and within a _90 degree_ cone AOE.\n\n_+4:_ Spectral blades can hit up to _4 additional targets_ for 50% damage. The targets must be visible and within a _120 degree_ cone AOE.
actors.hero.talent.projecting_blades.title=projecting blades
actors.hero.talent.projecting_blades.desc=_+1:_ Spectral blades has _+25% accuracy_, and can penetrate up to _2 solid tiles_.\n\n_+2:_ Spectral blades has _+50% accuracy_, and can penetrate up to _4 solid tiles_.\n\n_+3:_ Spectral blades has _+75% accuracy_, and can penetrate up to _6 solid tiles_.\n\n_+4:_ Spectral blades has _+100% accuracy_, and can penetrate up to _8 solid tiles_.
actors.hero.talent.spirit_blades.title=spirit blades
actors.hero.talent.spirit_blades.desc=_+1:_ Spectral blades has a _30% chance_ to also use the enchantment on the spirit bow.\n\n_+2:_ Spectral blades has a _60% chance_ to also use the enchantment on the spirit bow.\n\n_+3:_ Spectral blades has a _90% chance_ to also use the enchantment on the spirit bow.\n\n_+4:_ Spectral blades has a _100% chance_ to also use the enchantment on the spirit bow, and it gives each enchantment _+10% power_.
actors.hero.talent.growing_power.title=growing power
actors.hero.talent.growing_power.desc=_+1:_ The attack and movespeed boosts from nature's power are increased to _38% and 125%_, from 33% and 100%.\n\n_+2:_ The attack and movespeed boosts from nature's power are increased to _42% and 150%_, from 33% and 100%.\n\n_+3:_ The attack and movespeed boosts from nature's power are increased to _46% and 175%_, from 33% and 100%.\n\n_+4:_ The attack and movespeed boosts from nature's power are increased to _50% and 200%_, from 33% and 100%.
actors.hero.talent.natures_wrath.title=nature's wrath
actors.hero.talent.natures_wrath.desc=_+1:_ While nature's power is active, shots from the spirit bow have an _8% chance_ to trigger a random harmful plant effect.\n\n_+2:_ While nature's power is active, shots from the spirit bow have a _17% chance_ to trigger a random harmful plant effect.\n\n_+3:_ While nature's power is active, shots from the spirit bow have an _25% chance_ to trigger a random harmful plant effect.\n\n_+4:_ While nature's power is active, shots from the spirit bow have a _33% chance_ to trigger a random harmful plant effect.\n\nThe plants that can be triggered are: blindweed, firebloom, icecap, sorrowmoss, and stormvine.
actors.hero.talent.wild_momentum.title=wild momentum
actors.hero.talent.wild_momentum.desc=_+1:_ Killing an enemy with the spirit bow prolongs the duration of nature's power by _1 turn_. The duration can be extended by a max of _2 turns_.\n\n_+2:_ Killing an enemy with the spirit bow prolongs the duration of nature's power by _2 turns_. The duration can be extended by a max of _4 turns_.\n\n_+3:_ Killing an enemy with the spirit bow prolongs the duration of nature's power by _3 turns_. The duration can be extended by a max of _6 turns_.\n\n_+4:_ Killing an enemy with the spirit bow prolongs the duration of nature's power by _4 turns_. The duration can be extended by a max of _8 turns_.
actors.hero.talent.eagle_eye.title=eagle eye
actors.hero.talent.eagle_eye.desc=_+1:_ The spirit hawk's vision range is increased to _7 tiles_ from 6.\n\n_+2:_ The spirit hawk's vision range is increased to _8 tiles_ from 6.\n\n_+3:_ The spirit hawk's vision range is increased to _9 tiles_ from 6, and it gets _2 tiles_ of mind vision.\n\n_+4:_ The spirit hawk's vision range is increased to _10 tiles_ from 6, and it gets _3 tiles_ of mind vision.
actors.hero.talent.go_for_the_eyes.title=go for the eyes
actors.hero.talent.go_for_the_eyes.desc=_+1:_ Attacks from the spirit hawk blind enemies for _2 turns_.\n\n_+2:_ Attacks from the spirit hawk blind enemies for _5 turns_.\n\n_+3:_ Attacks from the spirit hawk blind enemies for _5 turns_ and cripple them for _2 turns_.\n\n_+4:_ Attacks from the spirit hawk blind enemies for _5 turns_ and cripple them for _5 turns_.
actors.hero.talent.swift_spirit.title=swift spirit
actors.hero.talent.swift_spirit.desc=_+1:_ The spirit hawk's movement speed is increased to _2.5 tiles_ from 2, and it is guaranteed to dodge the first _2 attacks_ made against it.\n\n_+2:_ The spirit hawk's movement speed is increased to _3 tiles_ from 2, and it is guaranteed to dodge the first _4 attacks_ made against it.\n\n_+3:_ The spirit hawk's movement speed is increased to _3.5 tiles_ from 2, and it is guaranteed to dodge the first _6 attacks_ made against it.\n\n_+4:_The spirit hawk's movement speed is increased to _4 tiles_ from 2, and it is guaranteed to dodge the first _8 attacks_ made against it.
actors.hero.talent.strengthening_meal.title=strengthening meal
actors.hero.talent.strengthening_meal.desc=_+1:_ Eating food grants the Duelist 3 bonus damage the next _2 times_ she hits an enemy with a physical attack.\n\n_+2:_ Eating food grants the Duelist 3 bonus damage the next _3 times_ she hits an enemy with a physical attack.
actors.hero.talent.adventurers_intuition.title=adventurer's intuition
actors.hero.talent.adventurers_intuition.desc=_+1:_ The Duelist identifies weapons _2.5x faster_ and armor _1.75x faster_.\n\n_+2:_ The Duelist identifies weapons _when she equips them_ and armor _2.5x faster_.
actors.hero.talent.patient_strike.title=patient strike
actors.hero.talent.patient_strike.desc=_+1:_ If the Duelist waits before performing a melee attack, she will deal _1-2 bonus damage_.\n\n_+2:_ If the Duelist waits before performing a melee attack, she will deal _2 bonus damage_.
actors.hero.talent.aggressive_barrier.title=aggressive barrier
actors.hero.talent.aggressive_barrier.desc=_+1:_ The Duelist gains _3 shielding_ when she uses a weapon ability and is at or below 50% health.\n\n_+2:_ The Duelist gains _5 shielding_ when she uses a weapon ability and is at or below 50% health.
actors.hero.talent.aggressive_barrier.meta_desc=_If this talent is gained by a different hero_ it will instead grant shielding when making a melee attack at low health, with a 50 turn cooldown.
actors.hero.talent.focused_meal.title=focused meal
actors.hero.talent.focused_meal.desc=_+1:_ Eating food takes the Duelist 1 turn and grants her _0.67 charges_ on her weapons.\n\n_+2:_ Eating food takes the Duelist 1 turn and grants her _1 charge_ on her weapons.
actors.hero.talent.focused_meal.meta_desc=_If this talent is gained by a different hero_ it will instead grant bonus damage to their next hit equal to their level/3 at +1, or level/2 at +2.
actors.hero.talent.liquid_agility.title=liquid agility
actors.hero.talent.liquid_agility.desc=_+1:_ When drinking or throwing a potion, brew, or elixir, the Duelist has _3x evasion_, and has _3x accuracy_ on her next melee attack within 5 turns.\n\n_+2:_ When drinking or throwing a potion, brew, or elixir, the Duelist has _infinite evasion_, and has _infinite accuracy_ on her next melee attack within 5 turns.\n\nThis bonus lasts for one additional turn and attack when using potions of strength, experience, or alchemy items that must be crafted using those potions.\n\nFor alchemy items with higher output quantities (e.g. aqua brew), this talent has a chance to trigger based on how many of that item is produced.
actors.hero.talent.weapon_recharging.title=weapon recharging
actors.hero.talent.weapon_recharging.desc=_+1:_ The Duelist gains one weapon charge every _15 turns_ when under the effect of wand or artifact recharging buffs.\n\n_+2:_ The Duelist gains one weapon charge every _10 turns_ when under the effect of wand or artifact recharging buffs.
actors.hero.talent.weapon_recharging.meta_desc=_If this talent is gained by a different hero_ it will instead cause them to deal +5% melee damage while recharging at +1, or +7.5% melee damage while recharging at +2.
actors.hero.talent.lethal_haste.title=lethal haste
actors.hero.talent.lethal_haste.desc=_+1:_ When the Duelist lands a killing blow on an enemy with a weapon ability, she gains _3 turns_ worth of instant movement.\n\n_+2:_ When the Duelist lands a killing blow on an enemy with a weapon ability, she gains _5 turns_ worth of instant movement.
actors.hero.talent.lethal_haste.meta_desc=_If this talent is gained by a different hero_ it will instead trigger with regular weapon attacks, with a 100 turn cooldown.
actors.hero.talent.swift_equip.title=swift equip
actors.hero.talent.swift_equip.desc=_+1:_ The Duelist can switch her equipped weapon instantly _one time_ every 20 turns.\n\n_+2:_ The Duelist can switch her equipped weapon instantly _two times_ every 20 turns.\n\nIf the Duelist has this talent and it is not on cooldown, quick-using an unequipped weapon will equip it.
actors.hero.talent.precise_assault.title=precise assault
actors.hero.talent.precise_assault.desc=_+1:_ When the Duelist uses a weapon ability, she gains _2x accuracy_ on her next melee attack within 5 turns.\n\n_+2:_ When the Duelist uses a weapon ability, she gains _5x accuracy_ on her next melee attack within 5 turns.\n\n_+3:_ When the Duelist uses a weapon ability, she gains _infinite accuracy_ on her next melee attack within 5 turns.
actors.hero.talent.precise_assault.meta_desc=_If this talent is gained by a different hero_ it will instead increase melee accuracy by 10% at +1, 20% at +2, or 30% at +3.
actors.hero.talent.deadly_followup.title=deadly followup
actors.hero.talent.deadly_followup.desc=_+1:_ When the Duelist hits an enemy with a thrown weapon, she will deal _10% more melee damage_ to them for 5 turns.\n\n_+2:_ When the Duelist hits an enemy with a thrown weapon, she will deal _20% more melee damage_ to them for 5 turns.\n\n_+3:_ When the Duelist hits an enemy with a thrown weapon, she will deal _30% more melee damage_ to them for 5 turns.
actors.hero.talent.varied_charge.title=varied charge
actors.hero.talent.varied_charge.desc=_+1:_ The Champion instantly regains _0.17 weapon charges_ when she uses two different weapon abilities, with no time limit.\n\n_+2:_ The Champion instantly regains _0.33 weapon charges_ when she uses two different weapon abilities, with no time limit.\n\n_+3:_ The Champion instantly regains _0.5 weapon charges_ when she uses two different weapon abilities, with no time limit.
actors.hero.talent.twin_upgrades.title=twin upgrades
actors.hero.talent.twin_upgrades.desc=_+1:_ If one of the Champion's two equipped weapons has a lower level and is _2 or more tiers lower_ than the other weapon, it will be boosted to the other weapon's level.\n\n_+2:_ If one of the Champion's two equipped weapons has a lower level and is _1 or more tiers lower_ than the other weapon, it will be boosted to the other weapon's level.\n\n_+3:_ If one of the Champion's two equipped weapons has a lower level and is _the same tier or lower_ than the other weapon, it will be boosted to the other weapon's level.
actors.hero.talent.combined_lethality.title=combined lethality
actors.hero.talent.combined_lethality.desc=_+1:_ If the Champion attacks with a melee weapon immediately after using a different weapon's ability, that attack will execute any non-boss enemy left at _below 13% HP_.\n\n_+2:_ If the Champion attacks with a melee weapon immediately after using a different weapon's ability, that attack will execute any non-boss enemy left at _below 27% HP_.\n\n_+3:_ If the Champion attacks with a melee weapon immediately after using a different weapon's ability, that attack will execute any non-boss enemy left at _below 40% HP_.\n\nThis attack can be a regular melee weapon attack, or part of a weapon ability.
actors.hero.talent.unencumbered_spirit.title=unencumbered spirit
actors.hero.talent.unencumbered_spirit.desc=_+1:_ The Monk gains _50% more energy_ for each piece of _tier 3 or lower_ equipment she is using.\n\n_+2:_ This talent's effect is increased to _75% more energy_ for each piece of _tier 2 or lower_ equipment the Monk is using.\n\n_+3:_ This talent's effect is increased to _100% more energy_ for each piece of _tier 1_ equipment the Monk is using. She also gains a free cloth armor and studded gloves.\n\nNote that this talent gives no benefit from being unarmed or attacking with a Ring of Force.
actors.hero.talent.monastic_vigor.title=monastic vigor
actors.hero.talent.monastic_vigor.desc=_+1:_ If the Monk has _100% energy_, her abilities are empowered.\n\n_+2:_ If the Monk has _80% or more energy_, her abilities are empowered.\n\n_+3:_ If the Monk has _60% or more energy_, her abilities are empowered.\n\nWhen empowered:\n- Flurry applies your weapon's enchantment\n- Focus is instantaneous\n- Dash gains +4 range\n- Dragon Kick deals +50% damage and applies its knock back and stun effect to all adjacent enemies\n- Meditate slowly heals 20% of missing HP and grants 80% damage resistance.
actors.hero.talent.combined_energy.title=combined energy
actors.hero.talent.combined_energy.desc=_+1:_ If the Monk uses a weapon ability and a _4+ energy_ ability within 5 turns of each other, she regains 1 spent energy.\n\n_+2:_ If the Monk uses a weapon ability and a _3+ energy_ ability within 5 turns of each other, she regains 1 spent energy.\n\n_+3:_ If the Monk uses a weapon ability and a _2+ energy_ ability within 5 turns of each other, she regains 1 spent energy.
actors.hero.talent.close_the_gap.title=close the gap
actors.hero.talent.close_the_gap.desc=_+1:_ The Duelist blinks _up to two tiles_ toward her target when starting a duel.\n\n_+2:_ The Duelist blinks _up to three tiles_ toward her target when starting a duel.\n\n_+3:_ The Duelist blinks _up to four tiles_ toward her target when starting a duel.\n\n_+4:_ The Duelist blinks _up to five tiles_ toward her target when starting a duel.\n\nThis blink can go through hazards and enemies, but not solid terrain like walls. The blink is taken into account when determining if an enemy is in range to be challenged.
actors.hero.talent.invigorating_victory.title=invigorating victory
actors.hero.talent.invigorating_victory.desc=_+1:_ If the Duelist defeats her target before the duel ends, she heals for _5 HP plus 30% of the damage_ she took during the duel.\n\n_+2:_ If the Duelist defeats her target before the duel ends, she heals for _10 HP plus 50% of the damage_ she took during the duel.\n\n_+3:_ If the Duelist defeats her target before the duel ends, she heals for _15 HP plus 65% of the damage_ she took during the duel.\n\n_+4:_ If the Duelist defeats her target before the duel ends, she heals for _20 HP plus 75% of the damage_ she took during the duel.
actors.hero.talent.elimination_match.title=elimination match
actors.hero.talent.elimination_match.desc=_+1:_ If the Duelist challenges again within 3 turns of a duel ending, that challenge has a _16% reduced_ charge cost.\n\n_+2:_ If the Duelist challenges again within 3 turns of a duel ending, that challenge has a _30% reduced_ charge cost.\n\n_+3:_ If the Duelist challenges again within 3 turns of a duel ending, that challenge has a _40% reduced_ charge cost.\n\n_+4:_ If the Duelist challenges again within 3 turns of a duel ending, that challenge has a _50% reduced_ charge cost.
actors.hero.talent.elemental_reach.title=elemental reach
actors.hero.talent.elemental_reach.desc=_+1:_ Elemental strike's range is increased to _5 tiles_ from 4, and its width is increased to _75 degrees_ from 65.\n\n_+2:_ Elemental strike's range is increased to _6 tiles_ from 4, and its width is increased to _85 degrees_ from 65.\n\n_+3:_ Elemental strike's range is increased to _7 tiles_ from 4, and its width is increased to _95 degrees_ from 65.\n\n_+4:_ Elemental strike's range is increased to _8 tiles_ from 4, and its width is increased to _105 degrees_ from 65.
actors.hero.talent.striking_force.title=striking force
actors.hero.talent.striking_force.desc=_+1:_ The power of elemental strike's effect is increased by _30%_.\n\n_+2:_ The power of elemental strike's effect is increased by _60%_.\n\n_+3:_ The power of elemental strike's effect is increased by _90%_.\n\n_+4:_ The power of elemental strike's effect is increased by _120%_.
actors.hero.talent.directed_power.title=directed power
actors.hero.talent.directed_power.desc=_+1:_ The direct attack from elemental strike gains _+30% enchantment power_ for each enemy in range of elemental strike's effect, including the attack target.\n\n_+2:_ The direct attack from elemental strike gains _+60% enchantment power_ for each enemy in range of elemental strike's effect, including the attack target.\n\n_+3:_ The direct attack from elemental strike gains _+90% enchantment power_ for each enemy in range of elemental strike's effect, including the attack target.\n\n_+4:_ The direct attack from elemental strike gains _+120% enchantment power_ for each enemy in range of elemental strike's effect, including the attack target.
actors.hero.talent.feigned_retreat.title=feigned retreat
actors.hero.talent.feigned_retreat.desc=_+1:_ If an enemy attacks the Duelist's afterimage, she gains _2 turns_ of haste.\n\n_+2:_ If an enemy attacks the Duelist's afterimage, she gains _4 turns_ of haste.\n\n_+3:_ If an enemy attacks the Duelist's afterimage, she gains _6 turns_ of haste.\n\n_+4:_ If an enemy attacks the Duelist's afterimage, she gains _8 turns_ of haste.
actors.hero.talent.expose_weakness.title=expose weakness
actors.hero.talent.expose_weakness.desc=_+1:_ Enemies that attack the Duelist's afterimage become weak and vulnerable for _2 turns_.\n\n_+2:_ Enemies that attack the Duelist's afterimage become weak and vulnerable for _4 turns_.\n\n_+3:_ Enemies that attack the Duelist's afterimage become weak and vulnerable for _6 turns_.\n\n_+4:_ Enemies that attack the Duelist's afterimage become weak and vulnerable for _8 turns_.
actors.hero.talent.counter_ability.title=counter ability
actors.hero.talent.counter_ability.desc=_+1:_ If the Duelist uses a weapon ability within 3 turns of her afterimage being attacked, she will instantly regain _0.38 charges_.\n\n_+2:_ If the Duelist uses a weapon ability within 3 turns of her afterimage being attacked, she will instantly regain _0.77 charges_.\n\n_+3:_ If the Duelist uses a weapon ability within 3 turns of her afterimage being attacked, she will instantly regain _1.13 charges_.\n\n_+4:_ If the Duelist uses a weapon ability within 3 turns of her afterimage being attacked, she will instantly regain _1.5 charges_.
actors.hero.talent.heroic_energy.title=heroic energy
actors.hero.talent.heroic_energy.rat_title=ratroic energy
actors.hero.talent.heroic_energy.desc=_+1:_ The hero's armor ability has a _12% reduced_ charge cost.\n\n_+2:_ The hero's armor ability has a _23% reduced_ charge cost.\n\n_+3:_ The hero's armor ability has a _32% reduced_ charge cost.\n\n_+4:_ The hero's armor ability has a _40% reduced_ charge cost.
actors.hero.talent.ratsistance.title=ratsistance
actors.hero.talent.ratsistance.desc=_+1:_ Hostile ratmogrified enemies deal _-10% damage_.\n\n_+2:_ Hostile ratmogrified enemies deal _-19% damage_.\n\n_+3:_ Hostile ratmogrified enemies deal _-27% damage_.\n\n_+4:_ Hostile ratmogrified enemies deal _-35% damage_.
actors.hero.talent.ratlomacy.title=ratlomacy
actors.hero.talent.ratlomacy.desc=_+1:_ Using ratmogrify on a ratmogrified enemy makes them friendly and makes the transformation permanent.\n\n_+2:_ Using ratmogrify on a ratmogrified enemy makes them friendly, makes the transformation permanent, and gives them _2 turns_ of adrenaline.\n\n_+3:_ Using ratmogrify on a ratmogrified enemy makes them friendly, makes the transformation permanent, and gives them _4 turns_ of adrenaline.\n\n_+4:_ Using ratmogrify on a ratmogrified enemy makes them friendly, makes the transformation permanent, and gives them _6 turns_ of adrenaline.
actors.hero.talent.ratforcements.title=ratforcements
actors.hero.talent.ratforcements.desc=_+1:_ Using ratmogrify on yourself _spawns 1_ ally marsupial rat next to you.\n\n_+2:_ Using ratmogrify on yourself _spawns 2_ ally marsupial rats next to you.\n\n_+3:_ Using ratmogrify on yourself _spawns 3_ ally marsupial rats next to you.\n\n_+4:_ Using ratmogrify on yourself _spawns 4_ ally marsupial rats next to you.
actors.hero.herosubclass.kingy=rat king
actors.hero.herosubclass.kingy_desc=Reading the book of Mastery grants Rat King the power of all subclasses!
actors.hero.perks.perk_obtain=You learned %s!
actors.hero.perks.sucker_punch.name=sucker punch
actors.hero.perks.sucker_punch.desc=First surprise attack deals 25% additional armor-piercing damage.
actors.hero.perks.directive.name=directive
actors.hero.perks.directive.desc=First surprise attack gives 1.5 turns of haste.
actors.hero.perks$directivemovingtracker.name=Instant Steps
actors.hero.perks$directivemovingtracker.desc=Your movement will take 0 tiles unless you stop moving.\n\nMoves left: %s.
actors.hero.perks.follow_up_strike.name=follow-up strike
actors.hero.perks.follow_up_strike.desc=After hitting enemy with a bow or throwing weapon, next melee attack will deal 25% additional armor-piercing damage.
actors.hero.perks.hold_fast.name=hold fast
actors.hero.perks.hold_fast.desc=While waiting in place, you get additional %s-%s armor.
actors.hero.perks.protein_infusion.name=protein infusion
actors.hero.perks.protein_infusion.desc=The hero gets up to 2x speed and 1.5x evasion depending on their satiety.
actors.hero.perks.fishing_pro.name=fishing proficiency
actors.hero.perks.fishing_pro.desc=With 25% chance the fishing loot will be doubled.
actors.hero.perks.wand_pro.name=recharge proficiency
actors.hero.perks.wand_pro.desc=Your wands recharge 25% faster.
actors.hero.perks.iron_will.name=iron reflection
actors.hero.perks.iron_will.desc=Below 50% HP taking damage from physical or magical attacks will release damaging shockwaves into enemies.
actors.hero.perks.mystical_meal.name=mystical meal
actors.hero.perks.mystical_meal.desc=Eating grants 6 turns of artifact recharge.
actors.hero.perks.additional_money.name=bounty hunter
actors.hero.perks.additional_money.desc=Killing enemies drops gold equivalent to 20% of regularly dropped gold.
actors.hero.perks.better_bartering.name=efficient bartering
actors.hero.perks.better_bartering.desc=Trading with Rat King has 33% chance to not consume an item.
actors.hero.perks.potions.name=lots of experience
actors.hero.perks.potions.desc=Potions of Overload and Potions of Experience last 2x longer.
actors.hero.perks.more_bag.name=bigger lootbags
actors.hero.perks.more_bag.desc=Treasure bags from shop contain roughly 50% more items.
actors.hero.perks.no_oneshots.name=steel skin
actors.hero.perks.no_oneshots.desc=If the incoming damage is going to kill you from full HP, it will be reduced by 50%.
actors.hero.perks.collect_everything.name=magnetic meal
actors.hero.perks.collect_everything.desc=Eating overpriced rations causes every top item in every heap on the map to be collected instantly.
actors.hero.perks.rat_summons.name=ratforcements
actors.hero.perks.rat_summons.desc=Searching in place will spawn several ally marsupial rats next to you, with 25 turns of adrenaline.
actors.hero.perks.grass_healing.name=restored nature
actors.hero.perks.grass_healing.desc=Drinking a potion of healing spawns 5x5 square of grass, centered around the hero, and roots every enemy inside it for 3 turns.
actors.hero.perks.friendly_bees.name=friendly bees
actors.hero.perks.friendly_bees.desc=All bees, spawned from shattered honeypots, will fight for hero.
actors.hero.perks.raritize_magic.name=Raritizing Magic
actors.hero.perks.raritize_magic.desc=Mobs will drop an item (artifacts, wands, weapons, rings, armors) with rarity (or nothing) at 7% chance.
actors.hero.perks.supply_rations.name=Cached Rations
actors.hero.perks.supply_rations.desc=You can now find cached rations in chests with _1/(25 + (5 * rations found))_ chance while you explore the next few floors in the dungeon.\n\nSupply rations are eaten quickly, restore a moderate amount of satiety, heal 5 hp, and restore 1 charge to the cloak of shadows (if you have the item).
actors.hero.perks.dungeon_berry.name=Nature's Bounty
actors.hero.perks.dungeon_berry.desc=You can now find berries in tall grass with _1/(15 + (5 * berries found))_ chance while you explore the next few floors in the dungeon.\n\nBerries are eaten quickly, restore a moderate amount of satiety, and might contain a usable seed.
actors.mobs.npcs.blacksmith.name=troll blacksmith
actors.mobs.npcs.blacksmith.intro_quest_ratking=Hello Our Majesty!
actors.mobs.npcs.blacksmith.intro_quest_warrior=Hey Human! You look like a tough one.
actors.mobs.npcs.blacksmith.intro_quest_mage=Hey Human! You look like a smart one.
actors.mobs.npcs.blacksmith.intro_quest_rogue=Hey Human! You look like a sneaky one.
actors.mobs.npcs.blacksmith.intro_quest_huntress=Hey Human! You look like a quick one.
actors.mobs.npcs.blacksmith.intro_quest_duelist=Hey Human! You look like a brave one.
actors.mobs.npcs.blacksmith.intro_quest_cleric=Hey Human! You look like an important one.
actors.mobs.npcs.blacksmith.intro_quest_start=Wanna be useful, eh? Yeah I got something you could do. I built dis workshop ontop of an old mine, it's just down dat ladder. Take dis pickaxe and mine me some _dark gold ore. 40 pieces_ should be enough. The rock down der is nice and soft so _you'll be able to mine through the walls with some effort._\n\nWhat do you mean, how am I gonna pay? You greedy...\n\nOk, ok, I can do some smithin' for you. Consider yourself lucky, I'm the only blacksmith around.
actors.mobs.npcs.blacksmith.intro_quest_crystal=Careful though, the mine's dangerous for a little human like you. It's been abandoned for a while, and bunch of crystals have started growing. They're shiny, but too fragile to be worth anythin', and they've got some magic things protecting 'em. They're pretty strong, so _be careful where you mine_ or you'll get their attention.\n\nThere's a _giant crystal_ somewhere too. It's a lot tougher, so be prepared for a fight if you start breakin' it. I'll bet smashing it will slow all the crystal growth down though, so I'll pay extra if you can do it.
actors.mobs.npcs.blacksmith.intro_quest_gnoll=Careful though, the mine's dangerous for a little human like you. Some gnolls want the gold too and now they're wreckin' the place. They're stupid things, so their mining has caused all sorts of collapses and cave-ins. You'll have to mine through it, so _look for recently disturbed rock._\n\nI think one of the gnolls is causing most of the trouble, probably a _geomancer shaman_ or somethin'. I'll pay extra, if you can find and kill it, but I'm sure it'll fight back.
actors.mobs.npcs.blacksmith.intro_quest_fungi=Careful though, the mine's dangerous for a little human like you. There's some sorta fungus monster that's been growing down there. It's got mushroom sentries that're really deadly if they see you, but they can't get up and chase you at least. _Keep out of sight_ if you want to stay alive.\n\nI'll pay extra if you can manage to take down the _biggest mushrom,_ but it'll take some real effort. It's connected to a bunch of mycelium nodes that're hidden in the walls. You'll have to break most of 'em before you can really damage it.
actors.mobs.npcs.blacksmith.reminder=You done wastin' my time? The mine entrance is over there.
actors.mobs.npcs.blacksmith.reminder_crystal=Bring me as much gold as you can, and try to break the big crystal too.
actors.mobs.npcs.blacksmith.reminder_gnoll=Bring me as much gold as you can, and try to kill the gnoll geomancer too.
actors.mobs.npcs.blacksmith.reminder_fungi=Bring me as much gold as you can, and try to kill the giant mushroom too.
actors.mobs.npcs.blacksmith.lost_pick=Are you kiddin' me? Where is my pickaxe?!
actors.mobs.npcs.blacksmith.quest_start_prompt=You ready to go down? Make sure you've got some free space for the gold.\n\n_I'm only lettin' you down der once!_
actors.mobs.npcs.blacksmith.enter_yes=I'm Ready
actors.mobs.npcs.blacksmith.enter_no=Not Yet
actors.mobs.npcs.blacksmith.exit_warn_none=You done already? You've hardly got any gold at all! You should be able to get _40 pieces._\n\n_Remember, I'm not lettin' you back in once you come up._
actors.mobs.npcs.blacksmith.exit_warn_low=You done already? Doesn't look like you've got a lot of gold. You should be able to get _40 pieces._\n\n_Remember, I'm not lettin' you back in once you come up._
actors.mobs.npcs.blacksmith.exit_warn_med=You done? You've got some gold at least, but there's definitely more in the mine. You should be able to get _40 pieces._\n\n_Remember, I'm not lettin' you back in once you come up._
actors.mobs.npcs.blacksmith.exit_warn_high=You done? Looks like you've got a good amount of gold, but I could use a bit more. You should be able to get _40 pieces._\n\n_Remember, I'm not lettin' you back in once you come up._
actors.mobs.npcs.blacksmith.exit_warn_full=You done? You've got lots of gold, but make sure you haven't left any of your gear behind.\n\n_Remember, I'm not lettin' you back in once you come up._
actors.mobs.npcs.blacksmith.exit_warn_crystal=That giant crystal's still down there too. I'll pay extra if you destroy it.
actors.mobs.npcs.blacksmith.exit_warn_gnoll=That gnoll geomancer's still down there too. I'll pay extra if you kill it.
actors.mobs.npcs.blacksmith.exit_warn_fungi=That giant mushroom's still down there too. I'll pay extra if you kill it.
actors.mobs.npcs.blacksmith.exit_yes=I'm Done
actors.mobs.npcs.blacksmith.exit_no=Not Yet
actors.mobs.npcs.blacksmith.entrance_blocked=The way down is blocked.
actors.mobs.npcs.blacksmith.cant_enter_old=That area is not accessible on this run. Play a new game to try the new quest!
actors.mobs.npcs.blacksmith.def_verb=blocked
actors.mobs.npcs.blacksmith.desc=This troll blacksmith looks like all trolls look: he is tall and lean, and his skin resembles stone in both color and texture. The troll blacksmith is tinkering with disproportionally small tools.
actors.mobs.npcs.blacksmith.gold_1=Hey human! Wanna be useful, eh? Take dis pickaxe and mine me some _dark gold ore, 15 pieces_ should be enough. What do you mean, how am I gonna pay? You greedy...\nOk, ok, I don't have money to pay, but I can do some smithin' for you. Consider yourself lucky, I'm the only blacksmith around.
actors.mobs.npcs.blacksmith.blood_1=Hey human! Wanna be useful, eh? Take dis pickaxe and _kill a bat_ wit' it, I need its blood on the head. What do you mean, how am I gonna pay? You greedy...\nOk, ok, I don't have money to pay, but I can do some smithin' for you. Consider yourself lucky, I'm the only blacksmith around.
actors.mobs.npcs.blacksmith.gold_2=Dark gold ore. 15 pieces. Seriously, is it dat hard?
actors.mobs.npcs.blacksmith.blood_2=I said I need bat blood on the pickaxe. Chop chop!
actors.mobs.npcs.blacksmith.completed=Oh, you have returned... Better late dan never.
actors.mobs.npcs.blacksmith.get_lost=I'm busy. Get lost!
actors.mobs.npcs.blacksmith.same_item=Select 2 different items, not the same item twice!
actors.mobs.npcs.blacksmith.diff_type=Select 2 items of the same type!
actors.mobs.npcs.blacksmith.un_ided=I need to know what I'm working with, identify them first!
actors.mobs.npcs.blacksmith.cursed=I don't work with cursed items!
actors.mobs.npcs.blacksmith.degraded=It's junk, the quality is too poor!
actors.mobs.npcs.blacksmith.cant_reforge=I can't reforge these items!
actors.mobs.npcs.blacksmith.key=Oh, you here. I never thought that you will actually finish this quest. It's quite embarrassing to get busted so easily... Did you know, than Wand of Fireblast had a brother? He is called Wand of Avalanche.\n\nThe people loved him more than his sister... That's why it was banished, to point of no return. Until now.\n\nI was really bored and decided to extract this wand from game files, but they were erased, as usual. But I have managed to program it back. It was quite glitchy, hehehe. But don't worry, this new wand is completely fixed and will work as designed!\n\n(Wand of Avalanche recipe has been added.)
actors.mobs.npcs.ghost.name=sad ghost
actors.mobs.npcs.ghost.rat_1=Hello %s... Once I was like you - strong and confident... But I was slain by a foul beast... I can't leave this place... Not until I have my revenge... Slay the _fetid rat,_ that has taken my life...\n\nIt stalks this floor... Spreading filth everywhere... _Beware its cloud of stink and corrosive bite, the acid dissolves in water..._
actors.mobs.npcs.ghost.rat_2=Please... Help me... Slay the abomination...\n\n_Fight it near water... Avoid the stench..._
actors.mobs.npcs.ghost.gnoll_1=Hello %s... Once I was like you - strong and confident... But I was slain by a devious foe... I can't leave this place... Not until I have my revenge... Slay the _gnoll trickster,_ that has taken my life...\n\nIt is not like the other gnolls... It hides and uses thrown weapons... _Beware its poisonous and incendiary darts, don't attack from a distance..._
actors.mobs.npcs.ghost.gnoll_2=Please... Help me... Slay the trickster...\n\n_Don't let it hit you... Get near to it..._
actors.mobs.npcs.ghost.crab_1=Hello %s... Once I was like you - strong and confident... But I was slain by an ancient creature... I can't leave this place... Not until I have my revenge... Slay the _great crab,_ that has taken my life...\n\nIt is unnaturally old... With a massive single claw and a thick shell... _Beware its claw, you must surprise the crab or it will block with it..._
actors.mobs.npcs.ghost.crab_2=Please... Help me... Slay the Crustacean...\n\n_It will always block... When it sees you coming..._
actors.mobs.npcs.ghost.find_me=Thank you... come find me...
actors.mobs.npcs.ghost.desc=The ghost is barely visible. It looks like a shapeless spot of faint light with a sorrowful face.
actors.mobs.npcs.imp.name=ambitious imp
actors.mobs.npcs.imp.intro=Are you an adventurer? I love adventurers! You can always rely on them if something needs to be killed, am I right? For a bounty of course ;)
actors.mobs.npcs.imp.golems_1=In my case it's _golems_ that need to be killed. You see, I'm going to start a little business here, but those stupid golems are bad for business! It's very hard to negotiate with wandering lumps of granite, damn them! So please kill... let's say _4 of them_ and a reward is yours.
actors.mobs.npcs.imp.monks_1=In my case it's _monks_ who need to be killed. You see, I'm going to start a little business here, but those lunatics don't buy anything themselves and will scare away other customers. So please kill... let's say _5 of them_ and a reward is yours.
actors.mobs.npcs.imp.golems_2=How is your golem safari going? Just don't forget to grab those tokens.
actors.mobs.npcs.imp.monks_2=Oh, you're still alive! I knew that your kung-fu would be stronger ;) Just don't forget to grab those tokens.
actors.mobs.npcs.imp.cya=See you, %s!
actors.mobs.npcs.imp.hey=Psst, %s!
actors.mobs.npcs.imp.desc=Imps are lesser demons. They are notable for neither their strength nor their magic talent, but they are quite smart and sociable. Many imps prefer to live among non-demons.
actors.mobs.npcs.impshopkeeper.name=ambitious imp
actors.mobs.npcs.impshopkeeper.greetings=Hello, %s!
actors.mobs.npcs.impshopkeeper.greetings_ascent=What did you do %s? Shop quickly, I've got to get out of here!
actors.mobs.npcs.impshopkeeper.thief=I thought I could trust you!
actors.mobs.npcs.impshopkeeper.buyback=The imp cheerily returns your item.
actors.mobs.npcs.impshopkeeper.desc=The imp has set up a little shop on the border of the inner halls. It's nice to see a friendly face, but his prices certainly don't seem friendly.
actors.mobs.npcs.mirrorimage.name=mirror image
actors.mobs.npcs.mirrorimage.desc=This illusion bears a close resemblance to you, even seeming to wield your current weapon and armor.\n\nMirror images will seek and attack enemies using their mimicked weapon, which behaves the same as yours, but deals less damage. They start out nearly invisible, but must take on a form that's more easily seen in order to attack.\n\nWhile their offensive power can be potent, mirror images have no durability, and will fade the moment they take damage.
actors.mobs.npcs.prismaticimage.name=prismatic image
actors.mobs.npcs.prismaticimage.desc=This shimmering illusion bears a close resemblance to you, even seeming to wield your current weapon and armor.\n\nPrismatic images will attempt to seek and draw focus from enemies, using their enhanced defense and health to protect you. While they do not have the same offensive power as mirror images, they have enhanced durability, including receiving benefits from your armor.\n\nWhen reduced to 0 hp, prismatic images will fade over several turns, and can still be healed during this time. When no enemies are present, prismatic images will fade and rejoin their master.
actors.mobs.npcs.ratking.name=rat king
actors.mobs.npcs.ratking.not_sleeping=I'm not sleeping!
actors.mobs.npcs.ratking.what_is_it=What is it? I have no time for this nonsense. My kingdom won't rule itself!
actors.mobs.npcs.ratking.confused=Wha... Where am I? My kingdom needs me!
actors.mobs.npcs.ratking.crown_clothes=Put some clothes on! You're in no state to talk to royalty!
actors.mobs.npcs.ratking.crown_desc=Oooh, is that crown for me!? It looks much shinier than mine, so I graciously accept!\n\nIn fact, I think I can offer you something as a reward for this crown. A tremendous power befitting a hero such as yourself! Would you like that?
actors.mobs.npcs.ratking.crown_yes=Of course!
actors.mobs.npcs.ratking.crown_info=Tell me more first.
actors.mobs.npcs.ratking.crown_no=I'd rather not...
actors.mobs.npcs.ratking.crown_thankyou=Hehehe, thank you! Now go and make your king proud!
actors.mobs.npcs.ratking.crown_fine=Fine! It's not like I wanted it anyway...
actors.mobs.npcs.ratking.crown_after=Enjoying your new armor? No take-backsies!
actors.mobs.npcs.ratking.desc_crown=This rat is a little bigger than a regular marsupial rat. It's wearing dwarf king's crown on its head.
actors.mobs.npcs.ratking.desc_birthday=This rat is a little bigger than a regular marsupial rat. It's wearing a tiny green party hat instead of its usual crown. Happy birthday Rat King!
actors.mobs.npcs.ratking.desc_winter=This rat is a little bigger than a regular marsupial rat. It's wearing a tiny festive hat instead of its usual crown. Happy Holidays!
actors.mobs.npcs.ratking.desc=This rat is a little bigger than a regular marsupial rat. It's wearing a tiny crown on its head.
actors.mobs.npcs.ratking.ghastly=This mirror image is the manifestation of the Rat King's will. It will not run away, but still trade with you when needed.
actors.mobs.npcs.sheep.name=sheep
actors.mobs.npcs.sheep.baa.=Baa.
actors.mobs.npcs.sheep.baa...=Baa...
actors.mobs.npcs.sheep.def_verb=blocked
actors.mobs.npcs.sheep.desc=This is a magic sheep. What's so magical about it? You can't kill it. It will stand there until it magically fades away, all the while chewing cud with a blank stare.
actors.mobs.npcs.shopkeeper.name=shopkeeper
actors.mobs.npcs.shopkeeper.thief=Thief, Thief!
actors.mobs.npcs.shopkeeper.warn=Watch it! I won't warn you again.
actors.mobs.npcs.shopkeeper.flee=The shopkeeper flees!
actors.mobs.npcs.shopkeeper.sell=Sell an item
actors.mobs.npcs.shopkeeper.talk=Talk
actors.mobs.npcs.shopkeeper.buyback=The shopkeeper reluctantly returns your item.
actors.mobs.npcs.shopkeeper.talk_prison_intro=I have everything you need for a successful adventure!
actors.mobs.npcs.shopkeeper.talk_prison_warrior=That's an interesting seal you've got there, they're usually in one piece. You a disgraced hero or something? Well whatever you've done is none of my business, your coins are still good.
actors.mobs.npcs.shopkeeper.talk_prison_mage=Hehe, I think I've seen a wanted poster with your name on it somewhere in the city. On the run are we? Oh you're innocent are you? Of course, of course... Don't fret, I've got better things to do than report on you, but perhaps you should buy something to be sure?
actors.mobs.npcs.shopkeeper.talk_prison_rogue=Have you come from the thieves guild to clear the area? No, just shopping? Well kill a few monsters while you're here anyway. Don't expect a discount either, I pay good protection money to you people and you're barely keeping me safe down here.
actors.mobs.npcs.shopkeeper.talk_prison_huntress=You seem to be out of your element miss. Tight dungeon corridors aren't as spacious as grand halls or the forests surrounding the city are they? Hehe, oh don't mind my rambling, why not buy something?
actors.mobs.npcs.shopkeeper.talk_prison_duelist=Well if it isn't the travelling hero! If you're trying to save another town then good luck, the dangers here are much worse than petty bandit gangs. I'm sure you'll do better than anyone else could, just try to not die right outside my store.
actors.mobs.npcs.shopkeeper.talk_prison_rat_king=Greetings, Your Majesty. Why you are here at all? You already have all the luxury and popularity in the world... Just for fun? Okay...
actors.mobs.npcs.shopkeeper.talk_caves=Spend money, live longer.\n\nOh and say hello to that Troll blacksmith for me if you see him. Remind the lug that he still owes me money for that hammer I sold him last week!
actors.mobs.npcs.shopkeeper.talk_city=My wares can keep you safe down here.\n\n...And don't loiter if you please. It took forever to get the locals down here to leave me alone, I don't want you attracting any trouble!
actors.mobs.npcs.shopkeeper.talk_halls=Hey there, I've got special prices for demon hunters!\n\nOh and be careful down there! The demons below won't care how courageous you are. You can't come back up and spend more money if you're dead! ;)\n\nAre the demons like me? Hehe, not at all. I'm just a small fellow, not much of a fighter, and I've managed to keep my mind intact. The demons below are much stronger things, and they've all been enslaved by... well... just be careful down there.
actors.mobs.npcs.shopkeeper.talk_ascent=I don't know what you're planning to do with that amulet but I want no part of it. Buy something and move on, we both need to leave this place!
actors.mobs.npcs.shopkeeper.desc=This stout guy looks more appropriate for a trade district in some large city than for a dungeon. His prices explain why he prefers to do business here.\n\nHave you wondered, how he reacts to clay?
actors.mobs.npcs.wandmaker.name=old wandmaker
actors.mobs.npcs.wandmaker.intro_warrior=Oh, hello there! What a pleasant surprise to meet a warrior from the north in such a depressing place! You must have travelled quite far to get here. If you're looking for adventure, I may have a task for you.
actors.mobs.npcs.wandmaker.intro_rogue=Oh Goodness, you startled me! I haven't met a bandit from this place that still has his sanity, so you must be from the surface! If you're up to helping a stranger out, I may have a task for you.
actors.mobs.npcs.wandmaker.intro_mage=Oh, hello %s! I heard there was some ruckus regarding you and the wizards institute? Oh never mind, I never liked those stick-in-the-muds anyway. If you're willing, I may have a task for you.
actors.mobs.npcs.wandmaker.intro_huntress=Oh, hello miss! A friendly face is a pleasant surprise down here isn't it? In fact, I swear I've seen your face before, but I can't put my finger on it... Oh never mind, if you're here for adventure, I may have a task for you.
actors.mobs.npcs.wandmaker.intro_duelist=Oh, hello miss! What a pleasant surprise to meet a hero in such a depressing place! If you're up to helping an old man out, I may have a task for you.
actors.mobs.npcs.wandmaker.intro_ratking=Oh, big greetings, Your Majesty! What a honor to meet your enlightening presence in such depressing place! If you're fine with helping an old man out, I may have a task for you.
actors.mobs.npcs.wandmaker.intro_1=\n\nI came here to find a rare ingredient for a wand, but I've gotten myself lost, and my magical shield is weakening. I'll need to leave soon, but can't bear to go without getting what I came for.
actors.mobs.npcs.wandmaker.intro_dust=I'm looking for some _corpse dust._ It's a special kind of cursed bone meal that usually shows up in places like this. There should be a barricaded room around here somewhere, I'm sure some dust will turn up there. Do be careful though, the curse the dust carries is quite potent, _get back to me as fast as you can_ and I'll cleanse it for you.
actors.mobs.npcs.wandmaker.intro_ember=I'm looking for some _fresh embers_ from a newborn fire elemental. Elementals usually pop up when a summoning ritual isn't controlled, so just find some candles and a ritual site and I'm sure you can get one to pop up. You'll want to _avoid boxing yourself in_ while fighting it though, or you could _keep some sort of freezing item handy._ Newborn Elementals are pretty powerful and chaotic, but they can't stand the cold.
actors.mobs.npcs.wandmaker.intro_berry=The old warden of this prison kept a _rotberry plant,_ and I'm after one of its seeds. The plant has probably gone wild by now though, so getting it to give up a seed might be tricky. Its garden should be somewhere around here. Try to _keep away from its vine lashers_ if you want to stay in one piece. Using fire might be tempting but please don't, you'll kill the plant and destroy its seeds.
actors.mobs.npcs.wandmaker.intro_2=\n\nIf you can get that for me, I'll be happy to pay you with one of my finely crafted wands! I brought two with me, so you can take whichever one you prefer.
actors.mobs.npcs.wandmaker.reminder_dust=Any luck with corpse dust, %s? Look for some barricades.
actors.mobs.npcs.wandmaker.reminder_ember=Any luck with those embers, %s? You'll need to find four candles and the ritual site.
actors.mobs.npcs.wandmaker.reminder_berry=Any luck with a Rotberry seed, %s? Look for a room filled with vegetation.
actors.mobs.npcs.wandmaker.def_verb=blocked
actors.mobs.npcs.wandmaker.desc=This old yet hale gentleman wears a slightly confused expression. He is protected by a magic shield.
actors.mobs.npcs.wandmaker.cheese=Oh god, cheese! You found it for me? Awesome! I will give you my most powerful wand in possession, although it's little unfinished.\n\nYou can try to kill that big slime again with it.
actors.mobs.npcs.hook.name=hook
actors.mobs.npcs.hook.desc=The hook from your cool fishing rod.
actors.mobs.npcs.expgenerator.name=power plant
actors.mobs.npcs.expgenerator.desc=This golden masterpiece gathers hidden sunlight and turns it into experience. You can damage to get the generator back.
actors.mobs.npcs.bbat.name=bbat
actors.mobs.npcs.bbat.desc=This bat is trained to hunt weak targets while the owner survives in battlefield. It has high dexterity, but pretty low offensive stats. 
actors.mobs.npcs.bbat$bbatrecharge.name=Bbat Recharge
actors.mobs.npcs.bbat$bbatrecharge.desc=Bbat needs %s turns to recover from damage and return to fight. You can summon it with your Cloak of Shadows
actors.mobs.acidic.name=acidic scorpio
actors.mobs.acidic.desc=These huge arachnid-like demonic creatures avoid close combat, preferring to fire crippling serrated spikes from long distances. This one appears to be dripping with corrosive ooze.
actors.mobs.albino.name=albino rat
actors.mobs.albino.desc=This is a rare breed of marsupial rat, with pure white fur and jagged teeth.
actors.mobs.armoredstatue.name=armored statue
actors.mobs.armoredstatue.desc=You would think that it's just another one of this dungeon's inanimate statues, but its red glowing eyes give it away.\n\nIt seems to be in great condition because of the armor it's wearing, it might be very hard to kill.
actors.mobs.armoredstatue.desc_arm_wep=While the statue itself is made of stone, the _%1$s_ and _%2$s_ it's wielding look real.
actors.mobs.bandit.name=crazy bandit
actors.mobs.bat.name=vampire bat
actors.mobs.bat.desc=These brisk and tenacious inhabitants of the caves are much more dangerous than they seem. They replenish their health with each successful attack, which allows them to defeat much larger opponents.
actors.mobs.bee.name=golden bee
actors.mobs.bee.desc_honey=Despite their small size, golden bees tend to protect their home fiercely. This one has been placated, and seems to want to follow you.
actors.mobs.bee.desc=Despite their small size, golden bees tend to protect their home fiercely. This one is very mad, better keep your distance.
actors.mobs.brute.name=gnoll brute
actors.mobs.brute.enraged=enraged
actors.mobs.brute.def_verb=blocked
actors.mobs.brute.desc=Brutes are the largest, strongest, and toughest of all gnolls. When mortally wounded, they go berserk, gaining temporary shielding and a large boost to damage.
actors.mobs.brute$bruterage.name=brute rage
actors.mobs.brute$bruterage.desc=This gnoll brute is dying, but wants to take you with it!\n\nThe brute will die when its shielding wears off, either due to time or if it is damaged. In the meantime, it will deal hugely increased damage, so watch out!\n\nShield remaining: %d.
actors.mobs.causticslime.name=caustic slime
actors.mobs.causticslime.desc=This slime seems to have been tainted by the dark magic emanating from below. It has lost its usual green color, and drips with caustic ooze.
actors.mobs.crab.name=sewer crab
actors.mobs.crab.desc=These huge crabs are at the top of the food chain in the sewers. They are extremely fast and their thick carapace can withstand heavy blows.
actors.mobs.crystalguardian.name=crystal guardian
actors.mobs.crystalguardian.def_verb=blocked
actors.mobs.crystalguardian.desc=These large crystalline guardians almost look like statues, if it weren't for their bright glowing eyes. The hardened crystal they're made out of causes them to be sluggish but very tough, so _it's best to leave them to sleep in their crystal nest for as long as possible._\n\nDue to their size, crystal guardians will move much more slowly in enclosed spaces. They're also so durable that they're impossible to kill outright. They can be beaten down and temporarily disabled, but they'll just get back up again after a little while.
actors.mobs.crystalmimic.name=crystal mimic
actors.mobs.crystalmimic.ate=The mimic ate your %s!
actors.mobs.crystalmimic.escaped=The crystal mimic has escaped!
actors.mobs.crystalmimic.desc=Mimics are magical creatures which can take any shape they wish. In dungeons they almost always choose a shape of a treasure chest, in order to lure in unsuspecting adventurers.\n\nCrystal mimics are trickier than their regular cousins, and prefer to avoid conflict while stealing loot. They will attempt to sprint away once discovered, and have the ability to reposition enemies when they attack.
actors.mobs.crystalspire.name=crystal spire
actors.mobs.crystalspire.warning=The crystal vibrates as you strike it. Keeping this up is bound to draw attention to you...
actors.mobs.crystalspire.alert=The vibration grows and rumbles through the whole cave!
actors.mobs.crystalspire.desc=This gigantic spire of ultra hard crystal is probably the source of all the strange crystalline creatures in this cave. Your regular weapons are ineffective against it, so you'll need to use your pickaxe if you want to destroy it.\n\n_Make sure you're prepared before you start breaking it._ Such a big crystal is likely to take a while to mine through, and you probably won't be able to do it undisturbed. The spire itself may even have some means of defending itself as well. _Perhaps the spire's own attacks could be used against its minions._
actors.mobs.crystalwisp.name=crystal wisp
actors.mobs.crystalwisp.beam_kill=The beam of light killed you...
actors.mobs.crystalwisp.desc=A small angry floating chunk of hardened crystal that's producing a bright glow. While not especially strong, crystal wisps will shoot a damaging beam of light at you if they have a clear shot.\n\nWisps are small enough to easily move through the various crystal outcroppings, but they aren't able to shoot through them.
actors.mobs.demonspawner.name=demon spawner
actors.mobs.demonspawner.on_death=The demonic energy here seems to lessen as the spawner dies.
actors.mobs.demonspawner.desc=This twisting amalgam of dwarven flesh is responsible for creating ripper demons from the dwarves that have died in this region. Clearly the demons see no issue with using every resource they can against their enemies.\n\nWhile visually terrifying, demon spawners have no means of moving or directly defending themselves. Their considerable mass makes them hard to kill quickly however, and they will spawn ripper demons more quickly when they are under threat.\n\n_Demon spawners seem to be connected to some central source of demonic power. Killing them may weaken it._
actors.mobs.dm100.name=DM-100
actors.mobs.dm100.zap_kill=The lightning bolt killed you...
actors.mobs.dm100.desc=The DM-100 is an early model of dwarven 'defense machine' which was designed to protect dwarven miners in the caves below this prison. Their electrical shocks proved too weak however, and so they were gifted to the human city above. They went unused for years and eventually found their way to the prison, where the warden initially deemed them too cruel to use. However, as the prisoners became more unruly they became a necessity.
actors.mobs.dm200.name=DM-200
actors.mobs.dm200.vent=The DM-200 fires a jet of toxic exhaust!
actors.mobs.dm200.desc=The DM-200 is the second generation of dwarven 'defense machine', which was designed to protect dwarven miners in the caves and city below. They are much larger and bulkier than their predecessors, and attack with devastating hydraulic fists.\n\nTheir increased size is also their primary weakness, as they are unable to fit into the narrow tunnels and doorways of the dungeon. The dwarves were able to compensate for the DM-200's lack of mobility by allowing them to vent their toxic exhaust fumes at distant enemies, or enemies they cannot reach.
actors.mobs.dm201.name=DM-201
actors.mobs.dm201.vent=The DM-201 lobs a corrosive grenade!
actors.mobs.dm201.desc=The dwarves briefly experimented with more heavily emphasizing the DM-200's lack of mobility and created some DM models that are entirely stationary. The DM-201 is a retrofitted DM-200 which acts as a sentry turret that has no movement ability. In exchange for the lack of mobility, DM-201s have significantly more durability and attacking power.\n\nAs DM-201s have no engine to vent exhaust from, the dwarves instead outfitted them with corrosive gas grenades! DM-201s are careful with these grenades however, and will only lob them when attacked from a distance.
actors.mobs.dm300.name=DM-300
actors.mobs.dm300.notice=UNAUTHORIZED PERSONNEL DETECTED!
actors.mobs.dm300.shield=DM-300 pulls power from the exposed wires and shields itself!
actors.mobs.dm300.charging=SUSTAINING DAMAGE! ACTIVATING POWER PYLON!
actors.mobs.dm300.charging_hint=DM-300 is invulnerable while it is being energized by a pylon!
actors.mobs.dm300.supercharged=DESTROY! DESTROY! DESTROY!
actors.mobs.dm300.charge_lost=PYLON DESTROYED! REVERTING TO LOCAL POWER!
actors.mobs.dm300.pylons_destroyed=ALERT! INSTABILITY DETECTED IN POWER GRID!
actors.mobs.dm300.rankings_desc=Crushed by the DM-300
actors.mobs.dm300.def_verb=blocked
actors.mobs.dm300.defeated=CRITICAL DAMAGE! ATTEMPTING SHUTDO-
actors.mobs.dm300.desc=The DM-300 is the largest and most powerful 'defense machine' that the dwarves ever built. Such an awesome machine is difficult to manufacture, so the dwarves only ever made a few to guard the entrances to their underground metropolis.\n\nIt is equipped with vents to jet its toxic exhaust fumes and a high power drill that it can use both to attack and disrupt the earth. DM-300 can also connect to an energy grid, further enhancing its power.
actors.mobs.dm300.desc_supercharged=DM-300 is currently charged full of electrical energy. In this form DM-300 cannot be damaged and moves at double speed! Additionally, its drill now spins fast enough for it to _tunnel through solid rock,_ though it moves much more slowly when doing this.\n\nAttacking DM-300 directly is pointless while it is supercharged, but _something in the area must be providing it with this energy,_ destroying that may weaken it.
actors.mobs.blackmimic.name=darkened mimic
actors.mobs.blackmimic.notice=Hey, you did go there.
actors.mobs.blackmimic.shield=I have powerfield for you!
actors.mobs.blackmimic.vent=How about some corrosive experience?
actors.mobs.blackmimic.rocks=Crush him, rocks!
actors.mobs.blackmimic.bomb=Explode!
actors.mobs.blackmimic.summon=TASTE THE MONSTERS
actors.mobs.blackmimic.charging=YOU FOOL
actors.mobs.blackmimic.charging_hint=Darkened Mimic is invulnerable while power pylon is there!
actors.mobs.blackmimic.supercharged=STOP RIGHT THERE YOU IDIOT
actors.mobs.blackmimic.charge_lost=WHHHHAAAAAT
actors.mobs.blackmimic.pylons_destroyed=HOW
actors.mobs.blackmimic.rankings_desc=Consumed by his own greed
actors.mobs.blackmimic.def_verb=blocked
actors.mobs.blackmimic.defeated=NOOOOOOOOOOOOOOOOOOOOOO-
actors.mobs.blackmimic.desc=The embodiment of your endless avaritia. It hopes to consume you alongside with Amulet, while using various gas based attacks and summoning monsters from dungeon.
actors.mobs.blackmimic.desc_clone=This is a clone of Darkened Mimic. It doesn't announce its attacks, is immune to any damage and has reduced chance to summon another clone.
actors.mobs.blackmimic.desc_supercharged=Darkened Mimic is currently charged full of frustration, In this form the mimic cannot be damaged and moves at triple speed! Additionally, its jaws now are strong enough for it to _tunnel through solid rock,_ though it moves much more slowly when doing this.\n\nAttacking Darkened Mimic directly is pointless while it is supercharged, but _something in the area must be providing it with this energy,_ destroying that may weaken it.
actors.mobs.blackmimic$fallingrocks.desc=Loose rocks are tumbling down from the ceiling here, it looks like its about to collapse!
actors.mobs.dwarfking.name=King of Dwarves
actors.mobs.dwarfking.notice=How dare you! You have no idea what you're interfering with!
actors.mobs.dwarfking.lifelink_1=I have need of your essence, slave!
actors.mobs.dwarfking.lifelink_2=Bleed for me, slave!
actors.mobs.dwarfking.teleport_1=Deal with them, slave!
actors.mobs.dwarfking.teleport_2=Keep them busy, slave!
actors.mobs.dwarfking.wave_1=Enough! Arise my slaves!
actors.mobs.dwarfking.wave_2=More! Bleed for your king!
actors.mobs.dwarfking.wave_3=Useless! KILL THEM NOW!
actors.mobs.dwarfking.enraged=You cannot kill me %s. I. AM. IMMORTAL!
actors.mobs.dwarfking.losing=No! You can't do this... you have no idea what lies below...
actors.mobs.dwarfking.defeated=You've... Doomed us all...
actors.mobs.dwarfking.rankings_desc=Fell Before the King of Dwarves
actors.mobs.dwarfking.desc=Many years ago one of the highest wizards in the dwarven court uncovered secrets which gave him tremendous power over life and death. He soon put this power to use, subjugating and corrupting his peers, his king, and eventually every dwarven citizen. Now he is king, ruler over a legion of undead subjects.\n\nThe King of Dwarves is an aggressive foe, who will attempt to surround and overwhelm his enemies with his horde of undead minions.
actors.mobs.dwarfking$dkghoul.rankings_desc=Fell Before the King of Dwarves
actors.mobs.dwarfking$dkmonk.rankings_desc=Fell Before the King of Dwarves
actors.mobs.dwarfking$dkwarlock.rankings_desc=Fell Before the King of Dwarves
actors.mobs.dwarfking$dkgolem.rankings_desc=Fell Before the King of Dwarves
actors.mobs.ebonymimic.name=ebony mimic
actors.mobs.ebonymimic.reveal=There was a mimic there!
actors.mobs.ebonymimic.hidden_name=suspicious outline
actors.mobs.ebonymimic.hidden_desc=There seems to be something here, but it's almost totally transparent.
actors.mobs.ebonymimic.desc=Mimics are magical creatures which can take any shape they wish. In dungeons they almost always choose a shape of a treasure chest, in order to lure in unsuspecting adventurers.\n\nEbony mimics are extremely tough mimics with the ability to make themselves almost invisible. They lurk on things that adventurers are likely to interact with, but do contain loot of their own as well.\n\nThere can't be anything even stronger, _right?_
actors.mobs.elemental$fireelemental.name=fire elemental
actors.mobs.elemental$fireelemental.desc=Elementals are chaotic creatures that are often created when powerful occult magic isn't properly controlled. Elementals have minimal intelligence, and are usually associated with a particular type of magic.\n\nFire elementals are a common type of elemental which deals damage with fiery magic. They will set their target ablaze with melee attacks, and can occasionally shoot bolts of fire as well.
actors.mobs.elemental$newbornfireelemental.name=newborn fire elemental
actors.mobs.elemental$newbornfireelemental.charging=The elemental is charging up!
actors.mobs.elemental$newbornfireelemental.desc=Elementals are chaotic creatures that are often created when powerful occult magic isn't properly controlled. Elementals have minimal intelligence, and are usually associated with a particular type of magic.\n\nThis fire elemental is freshly summoned, but still quite dangerous!
actors.mobs.elemental$newbornfireelemental.desc_boss=Because of the chaotic nature of its summoning, this elemental can only spread fire in inaccurate blasts after charging for a turn.
actors.mobs.elemental$newbornfireelemental.desc_ally=Because this elemental was summoned by a spell, it has a little more control over its flame. It's incapable of making ranged attacks, but will ignite enemies it attacks in melee.
actors.mobs.elemental$frostelemental.name=frost elemental
actors.mobs.elemental$frostelemental.desc=Elementals are chaotic creatures that are often created when powerful occult magic isn't properly controlled. Elementals have minimal intelligence, and are usually associated with a particular type of magic.\n\nFrost elementals are a common type of elemental which weakens enemies with chilling magic. They will chill their target with melee and occasional ranged attacks. Their magic is much more effective in water.
actors.mobs.elemental$shockelemental.name=shock elemental
actors.mobs.elemental$shockelemental.desc=Elementals are chaotic creatures that are often created when powerful occult magic isn't properly controlled. Elementals have minimal intelligence, and are usually associated with a particular type of magic.\n\nShock elementals are a less common type of elemental which disrupts its enemies with electricity and flashes of light. In melee they will arc electricity to nearby enemies, and deal bonus damage to their primary target if they are in water. They will also occasionally focus a ranged blast of light at their target, temporarily blinding them.
actors.mobs.elemental$chaoselemental.name=chaos elemental
actors.mobs.elemental$chaoselemental.desc=Elementals are chaotic creatures that are often created when powerful occult magic isn't properly controlled. Elementals have minimal intelligence, and are usually associated with a particular type of magic.\n\nChaos elementals are rare and dangerous elementals which haven't stabilized to a particular element. They will unleash wild unpredictable magic when they attack.
actors.mobs.eye.name=evil eye
actors.mobs.eye.deathgaze_kill=The deathgaze killed you...
actors.mobs.eye.desc=Evil Eyes are floating balls of pent up demonic energy. While they are capable of melee combat, their true strength comes from their magic.\n\nAfter building energy for a short time an Evil Eye will unleash a devastating beam of energy called the _deathgaze._ Anything within the Evil Eye's sights will take tremendous damage, wise adventurers will run for cover.
actors.mobs.fetidrat.name=fetid rat
actors.mobs.fetidrat.desc=Something is clearly wrong with this rat. Its greasy black fur and rotting skin are very different from the healthy rats you've seen previously. Its pale green eyes make it seem especially menacing.\n\nThe rat carries a cloud of horrible stench with it, it's overpoweringly strong up close.\n\nDark ooze dribbles from the rat's mouth, it eats through the floor but seems to dissolve in water.
actors.mobs.fungalcore.name=fungal core
actors.mobs.fungalcore.desc=This gigantic mushroom must be the source of all the fungal activity in this cave.
actors.mobs.fungalsentry.name=fungal sentry
actors.mobs.fungalsentry.desc=This especially tall mushroom acts as a point of defense for the larger fungal network living in this cave.\n\nIt is immobile, but will shoot precise blasts of poison at anything that gets within its line of sight. While the impact of these blasts is fairly weak, _they can stack up deadly amounts of poison very quickly._ While it can be killed, it's probably best to avoid it.
actors.mobs.fungalspinner.name=fungal spinner
actors.mobs.fungalspinner.desc=This cave spinner appears to be being controlled by a parasitic fungus. The fungus has also changed its abilities, replacing its web and venom sacks with fungal growth.\n\nThe fungal spinner will spit plant life at you instead of webs, spreading fungal vegetation and potentially rooting you. While it can't poison, the fungal spinner will gain substantial damage resistance if it is adjacent to any mushrooms.
actors.mobs.ghoul.name=dwarven ghoul
actors.mobs.ghoul.desc=As dwarven society slowly began to collapse, and the current king of the dwarves seized absolute power, those who were weak or who resisted him were not treated well. As the king grew more adept at wielding dark magic, he bent these dwarves to his will, and now they make up the footsoldiers of his army.\n\nGhouls are not especially strong on their own, but always travel in groups and are much harder to kill in large numbers. _When a ghoul is defeated, it will rise again after a few turns as long as another ghoul is nearby._
actors.mobs.gnoll.name=gnoll scout
actors.mobs.gnoll.desc=Gnolls are hyena-like humanoids. They dwell in sewers and dungeons, venturing up to raid the surface from time to time. Gnoll scouts are regular members of their pack, they are not as strong as brutes and not as intelligent as shamans.
actors.mobs.gnollgeomancer.name=gnoll geomancer
actors.mobs.gnollgeomancer.warning=The geomancer begins to stir. Make sure you're ready before you continue!
actors.mobs.gnollgeomancer.alert=The geomancer awakens! The entire cave seems to shift as it leaps away while laughing madly!
actors.mobs.gnollgeomancer.rock_kill=The flying boulder killed you...
actors.mobs.gnollgeomancer.rockfall_kill=The falling rocks killed you...
actors.mobs.gnollgeomancer.desc=This impressively tall senior gnoll must be the source of the various earth-moving magic around here, and the organizer of all the gnoll activity. Unlike the gnoll sappers in the area, the geomancer is quite adept with its magic, and cannot be damaged by thrown or falling rocks. It doesn't have any way to fight in melee combat though.
actors.mobs.gnollgeomancer.desc_armor=The geomancer is currently encased in a layer of rock armor. _You'll need to get up close and break it away with your pickaxe before you can damage the geomancer._
actors.mobs.gnollgeomancer.desc_armor_sapper=_A nearby gnoll sapper is holding a device that is empowering the geomancer's rock armor. You won't be able to damage it at all right now!_
actors.mobs.gnollgeomancer.desc_sleeping=This impressively tall gnoll shaman is surrounded by a layer of rock, and looks almost like a statue. Looking closely you can see the rock magically move in time with the senior gnoll's breathing. It can't be harmed while encased in rock like this, and it appears to be enjoying a literal dirt nap.\n\nYou can probably break through the layers of rock with your pickaxe, but _be sure you're ready for a fight when you do so._ The geomancer must be the source of the various earth-moving magic around here, and the organizer of all the gnoll activity. _Defeating the gnolls scattered around here before fighting it might be a good idea._
actors.mobs.gnollguard.name=gnoll guard
actors.mobs.gnollguard.spear_warn=The gnoll lands a vicious blow with the tip of its spear!
actors.mobs.gnollguard.desc=A large and tough looking gnoll wielding a spear and a shield, but no helmet. These guards are likely brutes in training, roped into helping protect the mine from encroaching wildlife.\n\nThe gnoll guard is strong enough to wield the spear in one hand, but can't use it very well. _It will need fairly open space to attack at a distance, and will do notably less damage to you if you get up close._
actors.mobs.gnollguard.desc_armor=_A nearby gnoll sapper is holding a device that is granting this guard earthen armor, heavily reducing the damage it takes._
actors.mobs.gnollsapper.name=gnoll sapper
actors.mobs.gnollsapper.desc=A small and weak but intelligent gnoll with pale fur and a satchel full of various gadgets. They are likely here to assist with prospecting and mining dark gold, and have a nearby guard for protection. They are capable of fighting, but their attacks are pitifully weak, no stronger than a gnoll scout.\n\nInstead of fighting directly, sappers prefer to use the various gadgets they have to make the rocky environment attack for them. They don't know earth-moving magic themselves though, and so are pretty likely to use their gadgets recklessly. _There should be lots of ways to use their attacks against them, or their guard._
actors.mobs.gnolltrickster.name=gnoll trickster
actors.mobs.gnolltrickster.desc=A strange looking creature, even by gnoll standards. It hunches forward with a wicked grin, almost cradling the satchel hanging over its shoulder. Its eyes are wide with a strange mix of fear and excitement.\n\nThere is a large collection of poorly made darts in its satchel, they all seem to be tipped with various harmful substances.
actors.mobs.goldenmimic.name=golden mimic
actors.mobs.goldenmimic.desc=Mimics are magical creatures which can take any shape they wish. In dungeons they almost always choose a shape of a treasure chest, in order to lure in unsuspecting adventurers.\n\nGolden mimics are tougher mimics which try to attract the strongest adventurers. They have better loot, but are also much stronger than regular mimics.
actors.mobs.golem.name=golem
actors.mobs.golem.def_verb=blocked
actors.mobs.golem.desc=Golems are an attempt to correct the previous flaws in dwarven machinery via the dwarves newfound use of magic. They are much more compact and efficient compared to the DM-300 while still being very deadly.\n\nWhile golems are still too large to fit into passageways, the dwarves have given them new magical abilities to compensate. Golems can teleport themselves between rooms, and teleport enemies to them when they are out of reach.
actors.mobs.goo.name=Goo
actors.mobs.goo.notice=GLURP-GLURP!
actors.mobs.goo.defeated=glurp... glurp...
actors.mobs.goo.pumpup=Goo is pumping itself up!
actors.mobs.goo.enraged=enraged
actors.mobs.goo.gluuurp=GLUUUURP!
actors.mobs.goo.rankings_desc=Absorbed by the Goo
actors.mobs.goo.desc=Little is known about The Goo. It's quite possible that it is not even a creature, but rather a conglomerate of vile substances from the sewers that somehow gained basic intelligence. Regardless, dark magic is certainly what has allowed Goo to exist.\n\nIts gelatinous nature has let it absorb lots of dark energy, you feel a chill just from being near. If Goo is able to attack with this energy you won't live for long.
actors.mobs.goldengoo.name=Golden Goo
actors.mobs.goldengoo.notice=SHINE-GLURP!
actors.mobs.goldengoo.defeated=glurp... shine...
actors.mobs.goldengoo.pumpup=Golden Goo is charging golden radiance!
actors.mobs.goldengoo.enraged=radiant rage
actors.mobs.goldengoo.gluuurp=GOLDEN GLUUUURP!
actors.mobs.goldengoo.rankings_desc=Absorbed by the Golden Goo
actors.mobs.goldengoo.desc=A legendary radiant variant of The Goo. Infused with pure golden essence, defeating it yields unimaginable class wealth!
actors.mobs.goldengoo.reward=The Golden Goo dropped a radiant +4 %s!
actors.mobs.greatcrab.name=great crab
actors.mobs.greatcrab.noticed=The crab blocks with its massive claw.
actors.mobs.greatcrab.def_verb=blocked
actors.mobs.greatcrab.desc=This crab is gigantic, even compared to other sewer crabs. Its blue shell is covered in cracks and barnacles, showing great age. It lumbers around slowly, barely keeping balance with its massive claw.\n\nWhile the crab only has one claw, its size easily compensates. The crab holds the claw in front of any threat, shielding itself behind an impenetrable wall of carapace. However, the crab cannot block attacks it doesn't see coming, or attacks from multiple enemies at once.
actors.mobs.guard.name=prison guard
actors.mobs.guard.scorpion=Get over here!
actors.mobs.guard.def_verb=blocked
actors.mobs.guard.desc=Once keepers of the prison, these guards have long since become no different than the inmates. They shamble like zombies, brainlessly roaming through the halls in search of anything out of place, like you!\n\nThey carry chains around their hip, possibly used to pull in enemies to close range.
actors.mobs.mimic.name=mimic
actors.mobs.mimic.reveal=That chest is a mimic!
actors.mobs.mimic.hidden_hint=Something about this chest feels off... Walking up and trying to open it might be a bad idea.
actors.mobs.mimic.desc=Mimics are magical creatures which can take any shape they wish. In dungeons they almost always choose a shape of a treasure chest, in order to lure in unsuspecting adventurers.\n\nMimics have a nasty bite, but often hold more treasure than a regular chest.
actors.mobs.necromancer.name=necromancer
actors.mobs.necromancer.desc=These apprentice dark mages have flocked to the prison, as it is the perfect place to practise their evil craft.\n\nNecromancers will summon and empower skeletons to fight for them. Killing the necromancer will also kill the skeleton it summons.
actors.mobs.necromancer$necroskeleton.name=necromancer's skeleton
actors.mobs.necromancer$necroskeleton.desc=This skeleton has been summoned by a necromancer. It behaves just like a regular skeleton, and will die when the necromancer which summoned it is slain.
actors.mobs.mob.died=You hear something die in the distance.
actors.mobs.mob.rage=#$%^
actors.mobs.mob.rankings_desc=Slain by: %s
actors.mobs.monk.name=dwarf monk
actors.mobs.monk.def_verb=blocked
actors.mobs.monk.parried=parried
actors.mobs.monk.desc=These monks are fanatics, who have devoted themselves to protecting their king through physical might. So great is their devotion that they have totally surrendered their minds to their king, and now roam the dwarvern city like mindless zombies.\n\nMonks rely solely on the art of hand-to-hand combat, and are able to use their unarmed fists both for offense and defense. When they become focused, monks will parry the next physical attack used against them, even if it was otherwise guaranteed to hit. Monks build focus more quickly while on the move, and more slowly when in direct combat.
actors.mobs.monk$focus.name=focused
actors.mobs.monk$focus.desc=This monk is perfectly honed in on their target, and seem to be anticipating their moves before they make them.\n\nWhile focused, the next physical attack made against this character is guaranteed to miss, no matter what circumstances there are. Parrying this attack will spend the monk's focus, and they will need to build it up again to parry another attack. Monks build focus more quickly while they are moving.
actors.mobs.phantompiranha.name=phantom piranha
actors.mobs.phantompiranha.teleport_away=The phantom piranha teleports away...
actors.mobs.phantompiranha.desc=Phantom piranhas are a rare breed of piranha with magical abilities and eerie translucent bodies. They are capable of teleporting as they are being attacked, either to escape or to quickly get close to their enemy!\n\nWhile they are annoying to fight, their meat is prized for its magical properties.
actors.mobs.piranha.name=giant piranha
actors.mobs.piranha.desc=These carnivorous fish are not natural inhabitants of underground pools. They were bred specifically to protect flooded treasure vaults.
actors.mobs.pylon.name=power pylon
actors.mobs.pylon.desc_inactive=A power pylon, meant to help regulate the electricity which powers the machinery in this area.\n\nThe pylon is currently inactive and immune to damage.
actors.mobs.pylon.desc_active=A power pylon, meant to help regulate the electricity which powers the machinery in this area. The pylon is currently surging with electrical energy, this must be what's supercharging DM-300!\n\nIn this state pylons are vulnerable, but will arc electricity to nearby cells in a clockwise pattern. Due to their heavy metal construction, pylons are resistant to large amounts of damage.
actors.mobs.rat.name=marsupial rat
actors.mobs.rat.desc=Marsupial rats are aggressive but rather weak denizens of the sewers. They have a nasty bite, but are only life threatening in large numbers.
actors.mobs.ripperdemon.name=ripper demon
actors.mobs.ripperdemon.leap=The ripper demon prepares to leap!
actors.mobs.ripperdemon.desc=These horrific creatures are the result of the many dwarven corpses in this region being put to use by demonic forces. Rippers are emaciated ghoulish creatures that resemble dwarves, but with broken bodies and long sharp claws made of bone.\n\nRipper demons are not particularly durable, but they are agile and dangerous. They are capable of leaping great distances to quickly reach targets before goring them with their claws.
actors.mobs.rotheart.name=rot heart
actors.mobs.rotheart.desc=A Rotberry's fruit is very unique. Instead of rotting away and providing nutrients, the fruit grows, hardens, and encompasses the seed. It provides protection for the internal organs which grow inside the fruit. This giant orb is referred to as the heart of an adult rotberry plant.
actors.mobs.rotlasher.name=rot lasher
actors.mobs.rotlasher.desc=The rot lasher is a part of a mature rotberry plant's root structure, and also their primary means of defense. Lashers are blind and stuck into the ground, but will violently assault any nearby threat after taking a moment to detect them. When there is no nearby enemies, they stand motionless, attempting to blend in with surrounding vegetation.
actors.mobs.scorpio.name=scorpio
actors.mobs.scorpio.desc=These huge arachnid-like demonic creatures avoid close combat, preferring to fire crippling serrated spikes from long distances.
actors.mobs.senior.name=senior monk
actors.mobs.senior.desc=These monks are fanatics, who have devoted themselves to protecting their king through physical might. So great is their devotion that they have totally surrendered their minds to their king, and now roam the dwarvern city like mindless zombies.\n\nThis monk has mastered the art of hand-to-hand combat, and is able to gain focus while moving much more quickly than regular monks. When they become focused, monks will parry the next physical attack used against them, even if it was otherwise guaranteed to hit. Monks build focus more quickly while on the move, and more slowly when in direct combat.
actors.mobs.shaman.name=gnoll shaman
actors.mobs.shaman.bolt_kill=The magic bolt killed you...
actors.mobs.shaman.desc=Gnoll shamans are intelligent gnolls who use battle spells to compensate for their lack of might. They have a very respected position in gnoll society, despite their weaker strength.
actors.mobs.shaman$redshaman.spell_desc=This shaman is wearing a red mask, and will use magic that temporarily _weakens your attacking power._
actors.mobs.shaman$blueshaman.spell_desc=This shaman is wearing a blue mask, and will use magic that temporarily _increases the damage you take._
actors.mobs.shaman$purpleshaman.spell_desc=This shaman is wearing a purple mask, and will use magic that temporarily _reduces your accuracy and evasion._
actors.mobs.armoredbrute.name=armored brute
actors.mobs.armoredbrute.desc=The most senior gnoll brutes often wear powerful armor to show their status. The armor makes these brutes much more resilient to physical damage, and their greater discipline means they can rage for much longer before succumbing to their wounds.
actors.mobs.skeleton.name=skeleton
actors.mobs.skeleton.explo_kill=You were killed by the explosion of bones...
actors.mobs.skeleton.def_verb=blocked
actors.mobs.skeleton.desc=Skeletons are composed of the bones of unlucky adventurers and inhabitants of the prison, animated by emanations of evil magic from the depths below. After they have been damaged enough, skeletons will disintegrate in an explosion of bones. The shrapnel from this explosion is harmful to anything nearby, but armor is very effective at mitigating it.
actors.mobs.slime.name=slime
actors.mobs.slime.def_verb=blocked
actors.mobs.slime.desc=Slimes are strange, slightly magical creatures with a rubbery outer body and a liquid core. The city sewers provide them with an ample supply of water and nutrients.\n\nBecause of their elastic outer membrane, it is difficult to deal more than _6 damage_ to slimes from any one attack.
actors.mobs.snake.name=sewer snake
actors.mobs.snake.hint=Try using the examine button on a snake to learn how to counter them.
actors.mobs.snake.desc=These oversized serpents are capable of quickly slithering around blows, making them quite hard to hit. Magical attacks or surprise attacks are capable of catching them off-guard however.\n\nYou can perform a surprise attack by attacking while out of the snake's vision. One way is to let a snake chase you through a doorway and then _strike just after it moves into the door._
actors.mobs.spectralnecromancer.name=spectral necromancer
actors.mobs.spectralnecromancer.desc=While Skeletons are a necromancer’s bread and butter, some prefer to look into other less corporeal minions. Spectral necromancers have chosen wraiths as their minion of choice!\n\nIndividual wraiths aren't as strong as skeletons, but these necromancers aren't afraid to summon a bunch of them!
actors.mobs.spinner.name=cave spinner
actors.mobs.spinner.desc=These greenish furry cave spiders try to avoid direct combat. Instead they prefer to wait in the distance while their victim struggles in their excreted cobweb, slowly dying from their venomous bite. They are capable of shooting their webs great distances, and will try to block whatever path their prey is taking.
actors.mobs.statue.name=animated statue
actors.mobs.statue.def_verb=blocked
actors.mobs.statue.desc=You would think that it's just another one of this dungeon's inanimate statues, but its red glowing eyes give it away.
actors.mobs.statue.desc_weapon=While the statue itself is made of stone, the _%s_ it's wielding looks real.
actors.mobs.succubus.name=succubus
actors.mobs.succubus.desc=Succubi are shapeshifting demons that manipulate the minds of their prey. This one has taken the form of a pale gothic humanoid, perhaps to attract dwarven warlocks?\n\nSuccubi may temporarily charm their enemy when they attack, making their enemy unable to directly attack them. When succubi attack a charmed enemy, they will steal some of their life essence.
actors.mobs.swarm.name=swarm of flies
actors.mobs.swarm.desc=The deadly swarm of flies buzzes angrily. Every non-magical attack will split it into two smaller but equally dangerous swarms.
actors.mobs.tengu.name=Tengu
actors.mobs.tengu.notice_gotcha=Gotcha, %s!
actors.mobs.tengu.interesting=Let's make this interesting...
actors.mobs.tengu.notice_have=I have you now, %s!
actors.mobs.tengu.defeated=Free at last...
actors.mobs.tengu.rankings_desc=Assassinated by the Tengu
actors.mobs.tengu.desc=A famous and enigmatic assassin, named for the mask grafted to his face.\n\nTengu is held down with large clasps on his wrists and knees, though he seems to have gotten rid of his chains long ago.\n\nHe will try to use traps, deceptive magic, and precise attacks to eliminate the only thing stopping his escape: you.
actors.mobs.tengu$bombability$bombblob.desc=A cloud of superheated smoke is billowing here. Watch out, it's going to explode!
actors.mobs.tengu$bombability$bombitem.name=Smoke Bomb
actors.mobs.tengu$bombability$bombitem.cant_pickup=It's stuck to the ground, you can't move it!
actors.mobs.tengu$bombability$bombitem.desc=Tengu has thrown a strange looking smoke bomb here, which is billowing a thick hot smoke. It's making a loud ticking noise, as if its counting down to an explosion!\n\nThe bomb has anchored itself to the ground, so you can't pick it up.
actors.mobs.tengu$fireability$fireblob.desc=Tengu has thrown a fine powder that seems to be catching into steam here, it's about to ignite!
actors.mobs.tengu$shockerability$shockerblob.desc=Electrical energy is building here, anything standing on this tile will be shocked next turn!
actors.mobs.tengu$shockerability$shockeritem.name=Shocker
actors.mobs.tengu$shockerability$shockeritem.cant_pickup=It's putting out too much electricity, you can't grab it!
actors.mobs.tengu$shockerability$shockeritem.desc=Tengu has thrown a curious machine here, which seems to be made of DM-100 parts. The machine is constantly arcing electricity around it, but it seems to be going in a predictable pattern.\n\nWith all the electricity arcing around it, there's no way you can pick this up.
actors.mobs.thief.name=crazy thief
actors.mobs.thief.stole=The thief stole %s from you!
actors.mobs.thief.carries=\n\nThe thief is carrying a _%s._ Stolen obviously.
actors.mobs.thief.escapes=The thief gets away with your %s!
actors.mobs.thief.desc=Though these inmates roam free of their cells, this place is still their prison. Over time, this place has taken their minds as well as their freedom. Long ago, these crazy thieves and bandits have forgotten who they are and why they steal.\n\nThese enemies are more likely to steal and run than they are to fight. Make sure to keep them in sight, or you might never see your stolen item again.
actors.mobs.oofthief.name=OOF thief
actors.mobs.oofthief.stole=The thief stole %s from you! You can recover it from resetting shop depths and buying %s from there!
actors.mobs.oofthief.escapes=The thief teleports away!
actors.mobs.oofthief.desc=Genetically engineered by tormented sparks of robots and funded by impossibly modified foxes, this variant of thief has been augmented to prevail above all its prison brothers.\n\nIt is roughly 2.5x times stronger than normal thieves in both resistance and accuracy, attacks 3 times in a row and sells all stolen loot to incredibly corrupted shop companies. It also has teleportation device to hide from its victims once enough property is stolen.\n\nOne of OOF thief's only weaknesses is its movement speed: it moves 3x faster than a normal human, but has _tendency to slip on a moss, or a rock, or a twig_ and make no progress in moving right to its target.\n\nOn the last breath, OOF thief will enter desperation mode, being immune to any damage for short time and moving significantly faster.
actors.mobs.tormentedspirit.name=tormented spirit
actors.mobs.tormentedspirit.desc=Tormented spirits are otherwise good-natured spirits that has been afflicted by a curse. So long as they are cursed they will attack just like a wraith, and are more powerful as well!\n\nIt may be possible to cleanse the curse by using the right item while next to the spirit. If the curse is lifted the spirit will surely be grateful...
actors.mobs.tormentedspirit.thank_you=Thank you...
actors.mobs.warlock.name=dwarf warlock
actors.mobs.warlock.bolt_kill=The shadow bolt killed you...
actors.mobs.warlock.desc=As the dwarves' interests shifted from engineering to arcane arts, warlocks came to power in the city. They started with elemental magic, but soon switched to demonology and necromancy. The strongest of these warlocks seized the throne of the dwarven city, and his cohorts were allowed to continue practising their dark magic, so long as they surrendered their free will to him.\n\nThese warlocks possess powerful disruptive magic, and are able to temporarily hinder the upgrade magic applied to your equipment. The more upgraded an item is, the more strongly it will be affected.
actors.mobs.wraith.name=wraith
actors.mobs.wraith.desc=A wraith is a vengeful spirit of a sinner, whose grave or tomb was disturbed. Being an ethereal entity, it is very hard to hit with a regular weapon.
actors.mobs.yogdzewa.name=Yog-Dzewa
actors.mobs.yogdzewa.notice=I. SEE. YOU.
actors.mobs.yogdzewa.darkness=The darkness pulls in closer...
actors.mobs.yogdzewa.hope=YOUR. HOPE. IS. AN. ILLUSION!
actors.mobs.yogdzewa.defeated=...
actors.mobs.yogdzewa.rankings_desc=Devoured by Yog-Dzewa
actors.mobs.yogdzewa.desc=Yog-Dzewa is an Old God; a great monstrosity which reaches into mortal worlds and devours them to fuel its endless growth. The dwarves must have attracted the attention of this cosmic horror while toying with dark magics, and have been trying to keep it contained ever since.\n\nYog-Dzewa originates from a dimension of raw magical chaos, and cannot bring its true form into this world. Instead it has created avatars and summoned demonic minions to do its bidding here.\n\nThis giant eye is the focal point of Yog-Dzewa's power in this world. While the eye itself is immobile, it is capable of shooting powerful beams of demonic magic and summoning a variety of minions to aid it.\n\nCan drop clay, if killed by Minecraft reference.
actors.mobs.yogdzewa.desc_spawners=You can feel waves of demonic energy radiating to the eye from the floors above. Something you left alive up there must be funneling power back into Yog-Dzewa. _Yog will use this energy to summon more powerful minions!_
actors.mobs.yogdzewa$larva.name=god's larva
actors.mobs.yogdzewa$larva.rankings_desc=Devoured by Yog-Dzewa
actors.mobs.yogdzewa$larva.desc=These tiny spawn of Yog-Dzewa are simple minions that are easy to produce. While individually weak, they are summoned quickly and can become overwhelming in large numbers.
actors.mobs.yogdzewa$yogripper.rankings_desc=Devoured by Yog-Dzewa
actors.mobs.yogdzewa$yogeye.rankings_desc=Devoured by Yog-Dzewa
actors.mobs.yogdzewa$yogscorpio.rankings_desc=Devoured by Yog-Dzewa
actors.mobs.yogfist.invuln_warn=The fist is invulnerable while near to the eye!
actors.mobs.yogfist.rankings_desc=Devoured by Yog-Dzewa
actors.mobs.yogfist.desc=This fist is an aspect of Yog-Dzewa's power. Fists are linked to the power of Yog-Dzewa, and will be protected from all damage when they are close to the eye.
actors.mobs.yogfist$burningfist.name=burning fist
actors.mobs.yogfist$burningfist.desc=This fist is formed out of chaotic fiery magic. As it moves it will constantly set terrain around it ablaze. It is also capable of shooting blasts of fiery power, which spread flames where they impact.\n\nThe fist's ability to spread flames is suppressed when near water, but its heat is so great that any water around it will evaporate after a short while!
actors.mobs.yogfist$soiledfist.name=soiled fist
actors.mobs.yogfist$soiledfist.desc=This fist is formed out of chaotic earthen magic. As it moves it will constantly cause vegetation to sprout around it. It can also shoot concentrated earthen blasts that will ensnare its target in rapidly growing vines and roots!\n\nThe fist derives power from this plant life, and will resist damage based on the amount of tall or furrowed vegetation near it!
actors.mobs.yogfist$rottingfist.name=rotting fist
actors.mobs.yogfist$rottingfist.desc=This fist is formed out of living corruption. It is a towering mass of decaying flesh that can spread caustic ooze in melee and toxic gas at range. Even worse, the fist's great mass causes it to bleed instead of taking damage directly.\n\nWater can be used to wash the ooze off, but the fist is also capable of absorbing water to heal itself! Additionally, damaging the fist while it is bleeding will cause the bleed to refresh, but not stack!
actors.mobs.yogfist$rustedfist.name=rusted fist
actors.mobs.yogfist$rustedfist.desc=This fist is formed out of living metal. It is a towering mass of shifting metal that has powerful melee attacks, and can cripple its targets at range. Because of its tremendous mass, the fist will take any damage dealt to it over time, instead of immediately.\n\nThe fist is inflexible however, and cannot move into tight passageways. Additionally, while it may take damage slowly, the deferred damage will continue to increase if the fist is hit multiple times.
actors.mobs.yogfist$brightfist.name=bright fist
actors.mobs.yogfist$brightfist.teleport=The fist teleports away in a flash of light that seriously blinds you!
actors.mobs.yogfist$brightfist.desc=This fist is formed out of pure light energy. It is capable of shooting powerful rays of searing light every turn! These beams will temporarily blind you in addition to dealing heavy damage. The fist is also capable of briefly engulfing the arena in blinding light in order to escape!\n\nThe fist has no special abilities which it can use in melee range however.
actors.mobs.yogfist$darkfist.name=dark fist
actors.mobs.yogfist$darkfist.teleport=The fist teleports away in a blast of darkness that extinguishes your light source!
actors.mobs.yogfist$darkfist.desc=This fist is formed out of pure dark energy. It is capable of shooting powerful blasts of dark magic every turn! These blasts will weaken your light source in addition to dealing heavy damage. The fist is also capable of briefly engulfing the arena in darkness in order to escape!\n\nThe fist has no special abilities which it can use in melee range however.
