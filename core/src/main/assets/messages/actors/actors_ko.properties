###blobs
actors.blobs.blizzard.name=눈보라
actors.blobs.blizzard.desc=여기에 눈보라가 휘몰아치고 있다.

actors.blobs.confusiongas.name=혼란 가스
actors.blobs.confusiongas.desc=여기에 혼란 가스 구름이 소용돌이치고 있다.

actors.blobs.electricity.name=전기
actors.blobs.electricity.desc=여기에 전기가 요란하게 튀기고 있다.
actors.blobs.electricity.rankings_desc=감전
actors.blobs.electricity.ondeath=당신은 감전되어 죽었다...

actors.blobs.fire.name=화염
actors.blobs.fire.desc=여기에 불이 맹렬하게 타고 있다.

actors.blobs.foliage.name=낙엽
actors.blobs.foliage.desc=지하 정원의 어둠에 한 줄기 빛이 내리쬔다.

actors.blobs.freezing.name=차가운 공기
actors.blobs.freezing.desc=여기의 공기는 유난히 차갑다.

actors.blobs.goowarn.name=어두운 에너지
actors.blobs.goowarn.desc=여기에 어두운 에너지가 도사리고 있다!

actors.blobs.inferno.name=지옥불
actors.blobs.inferno.desc=여기에 용암이 들끓고 있다.

actors.blobs.paralyticgas.name=마비 가스
actors.blobs.paralyticgas.desc=여기에 마비 가스 구름이 소용돌이치고 있다.

actors.blobs.regrowth.name=재성장

actors.blobs.sacrificialfire.name=희생의 불꽃
actors.blobs.sacrificialfire.desc=희생의 불꽃이 불타오르고 있는 제단이 있다. 여기서 죽은 생물은 던전의 영혼에게 바치는 제물로 소비될 것이다.\n\n희생이 충분하면 보상을 받을 수 있지 않을까?
actors.blobs.sacrificialfire.worthy=불꽃이 당신의 제물을 소비하고 더욱 강렬하게 불타오른다.
actors.blobs.sacrificialfire.unworthy=불꽃이 당신의 제물을 소비했지만, 아무런 변화가 없다.
actors.blobs.sacrificialfire.reward=불꽃이 크게 불타오르며, 보상을 남긴 채 사그라들었다!

actors.blobs.smokescreen.name=연막
actors.blobs.smokescreen.desc=여기에 짙은 검은색 연기가 소용돌이치고 있다.

actors.blobs.stenchgas.name=악취 가스
actors.blobs.stenchgas.desc=여기에 악취나는 구름이 소용돌이치고 있다.

actors.blobs.stormcloud.name=폭풍우
actors.blobs.stormcloud.desc=여기에 자욱한 수증기가 피어오르고 있다.

actors.blobs.toxicgas.name=독가스
actors.blobs.toxicgas.desc=여기에 초록색 유독성 가스 구름이 소용돌이치고 있다.
actors.blobs.toxicgas.rankings_desc=질식사
actors.blobs.toxicgas.ondeath=당신은 유독 가스 때문에 죽었다...

actors.blobs.corrosivegas.name=부식 가스
actors.blobs.corrosivegas.desc=여기에 치명적인 부식성 가스 구름이 소용돌이치고 있다.

actors.blobs.waterofawareness.name=지식의 우물물
actors.blobs.waterofawareness.procced=한 모금을 마시는 순간, 막대한 지식이 당신의 마음에 흘러들어옴을 느꼈다.
actors.blobs.waterofawareness.desc=지식의 힘이 이 우물의 물에서 뿜어져 나오고 있습니다. 우물의 물을 마시면 그 순간 당신이 착용 중인 모든 아이템을 감정하고, 가방에 있는 모든 아이템의 저주 여부를 식별하며, 현재 층에 있는 모든 아이템의 위치를 알 수 있게 됩니다.

actors.blobs.waterofhealth.name=회복의 우물물
actors.blobs.waterofhealth.procced=한 모금을 마시는 순간, 당신의 모든 상처가 완전히 나았다.
actors.blobs.waterofhealth.desc=회복의 힘이 이 우물의 물에서 뿜어져 나오고 있습니다. 우물의 물을 마시면 그 순간 당신의 모든 상처가 치유되고 배고픔도 완전히 사라지며, 착용 중인 아이템의 저주도 모두 사라지게 됩니다.

actors.blobs.web.name=거미줄
actors.blobs.web.desc=모든 것이 굵은 거미줄로 뒤덮혀 있다. 무언가가 거미줄을 건드리거나 거미줄에 던져진다면 거미줄이 끊어지지만, 그 대상은 거미줄에 걸려 꼼짝도 못하게 된다.



###buffs
actors.buffs.adrenaline.name=아드레날린
actors.buffs.adrenaline.desc=물리적인 힘이 솟아나게 하는 아드레날린이 공격과 이동속도를 향상시켰습니다.\n\n아드레날린은 대상을 2배 빠르게 달리게 하고, 1.5배 빠르게 공격하게 합니다.\n\n남은 턴: %s.

actors.buffs.adrenalinesurge.name=힘 증폭
actors.buffs.adrenalinesurge.desc=강력한 힘의 흐름이 느껴집니다. 아쉽게도 잠깐만 지속됩니다.\n\n힘 증가: +%d\n%s턴 후에 강화 효과가 약해집니다.

actors.buffs.amok.name=광란
actors.buffs.amok.desc=광란 효과는 대상에게 대단한 분노와 혼란 효과를 줍니다. \n\n어떤 생물체가 광란에 걸리면, 그 적과 아군 구분 없이 주변의 모든 것을 공격하게 됩니다. \n\n광란 효과의 남은 턴: %s.

actors.buffs.arcanearmor.name=신비한 갑옷
actors.buffs.arcanearmor.desc=얇은 방어막이 당신을 감싸며 마법 공격으로부터의 피해를 줄여주고 있습니다.\n\n당신의 신비한 갑옷은 현재 0-%d의 마법 피해를 막을 수 있습니다.\n\n신비한 갑옷은 %s턴 뒤에 약해집니다.

actors.buffs.artifactrecharge.name=유물 충전
actors.buffs.artifactrecharge.desc=에너지가 당신 주변을 맴돌고 있으며, 당신이 장착한 유물의 충전 속도를 상승시킵니다.\n\n모든 유물들이 평소보다 훨씬 빠른 속도로 충전됩니다. 효과는 유물마다 조금씩 다릅니다.\n\n남은 턴: %s.

actors.buffs.ascensionchallenge.name=부적의 저주
actors.buffs.ascensionchallenge.desc=어느 이유에선지 요그제바는 부적을 통해 이 세상에 대한 영향력을 유지하고 있고, 당신의 탈출을 방해하려 합니다!\n\n요그제바의 힘이 던전을 더 위험하게 만들었으며, 적의 수를 증가시키고 더욱 강력하게 만들었습니다! 요그제바의 힘은 시간이 지날수록 강해지며, 요그제바의 힘에 영향을 받은 적을 처치하면 약화될 수 있습니다.
actors.buffs.ascensionchallenge.desc_clear=부적이 발하는 암흑 에너지를 어떻게든 최대한 억제했습니다.
actors.buffs.ascensionchallenge.desc_beckon=부적은 _멀리 떨어진 적들을 호출하며,_ 당신의 위치를 노출시킵니다.
actors.buffs.ascensionchallenge.desc_haste=부적은 _멀리 떨어진 적들을 빨리 이동하게 하며,_ 당신을 빨리 추적하게 만듭니다!
actors.buffs.ascensionchallenge.desc_slow=부적은 _당신을 느리게 만들어,_ 가속 효과도 무효화합니다!
actors.buffs.ascensionchallenge.desc_damage=부적이 발하는 에너지가 너무 강력하여 _당신에게 직접 피해를 입힙니다!_
actors.buffs.ascensionchallenge.beckon=부적이 멀리 떨어진 적들을 부른다.
actors.buffs.ascensionchallenge.haste=부적이 멀리 떨어진 적들을 신속화한다!
actors.buffs.ascensionchallenge.slow=갑자기 부적이 너무나 무겁게 느껴진다!
actors.buffs.ascensionchallenge.damage=부적이 암흑 에너지를 발한다. 너무나 고통스럽다!
actors.buffs.ascensionchallenge.weaken_info=부적의 저주는 더 많은 적을 쓰러뜨려 약화시킬 수 있습니다.
actors.buffs.ascensionchallenge.weaken_info_no_kills=적을 쓰러뜨리면 부적의 저주가 약해집니다!
actors.buffs.ascensionchallenge.weaken=당신은 부적의 저주가 약해짐을 느낀다.
actors.buffs.ascensionchallenge.break=잠시 숨을 돌릴 수 있게 되었다. 상처가 낫고 있음을 느낀다.
actors.buffs.ascensionchallenge.almost=부적에 대한 요그제바의 집착이 약해짐을 느낀다. 거의 다 왔다!
actors.buffs.ascensionchallenge.on_kill=암흑 에너지가 당신을 삼켰다...

actors.buffs.barkskin.name=나무껍질
actors.buffs.barkskin.desc=피부가 거칠고 단단해져 마치 나무껍질과 같아졌습니다.\n\n단단해진 피부는 견고한 갑주와 같기에, 물리 공격을 더 잘 흡수합니다.\n\n현재 추가 방어력: 0-%d.\n나무껍질 효과가 약해질 때까지 남은 턴: %s.\n\n나무껍질 효과를 중복으로 얻었을 경우, 가장 방어력이 높은 효과 하나만 적용됩니다.

actors.buffs.barrier.name=방어막
actors.buffs.barrier.desc=단단한 힘의 방어막이 모든 피해를 막아줍니다.\n\n방어막은 방어막 수치가 소진될 때 까지 모든 피해를 막아줍니다. 또한 방어막 수치는 시간이 지날 수록 천천히 사라집니다.\n\n남은 방어막: %d.

actors.buffs.berserk.angered=분노
actors.buffs.berserk.berserk=광포화
actors.buffs.berserk.exhausted=탈진
actors.buffs.berserk.recovering=회복 중
actors.buffs.berserk.angered_desc=광전사는 부상이 심할수록 공격력도 강해집니다. 광전사가 물리 피해를 입을수록 분노가 쌓여 더 큰 피해를 줄 수 있습니다. 방어막으로 막은 피해 또한 분노를 중첩합니다.\n\n분노는 서서히 감소합니다. 광전사의 체력이 적을 수록 분노는 더 오래 지속됩니다.\n\n광전사는 100%% 분노한 상태에서는 광포화를 사용할 수 있습니다. 광포화 시 갑옷의 강화 수치와 잃은 체력에 비례하여 대량의 방어막을 얻습니다. 광포화 중 방어막은 서서히 감소하며, 방어막이 소진될 시 분노를 다시 쌓을 수 있기 전까지 휴식을 해야만 합니다.\n\n현재 분노: _%1$.0f%%_\n_+%2$.0f%%_ 피해\n\n광포화 방어막: _%3$d_
actors.buffs.berserk.berserk_desc=두려움과 번뇌가 사라지고 분노만 남습니다. 이 상태의 광전사는 극도로 강력합니다. _+50%%의 추가 피해를 입히고, 서서히 사라지는 추가 방어막을 얻습니다._\n\n광포하는 추가 방어막이 전부 소진되면 종료됩니다.\n\n광포화가 끝나면 다시 분노하기 전까지 약간의 휴식이 필요합니다.\n\n남은 방어막: %d
actors.buffs.berserk.recovering_desc=내면의 힘에는 한계가 있는 법입니다. 광전사가 다시 광포화할 수 있게 되려면 우선 조금 쉬어야만 합니다.\n\n회복 중인 광전사는 피해를 입을 때 분노를 얻지 못합니다.
actors.buffs.berserk.recovering_desc_turns=탈진 회복까지 남은 턴 수: _%d_
actors.buffs.berserk.recovering_desc_levels=탈진 회복까지 남은 레벨: _%.2f_
actors.buffs.berserk.rankings_desc=격노하며 버텼으나 사망
actors.buffs.berserk.action_name=광포화
actors.buffs.berserk.no_seal=광포화하기 위해서는 부러진 인장을 착용해야만 한다!

actors.buffs.bleeding.name=출혈
actors.buffs.bleeding.ondeath=당신은 과다출혈로 죽었다...
actors.buffs.bleeding.heromsg=당신은 피를 흘린다!
actors.buffs.bleeding.rankings_desc=과다 출혈로 사망
actors.buffs.bleeding.desc=상처에서 상당한 양의 피가 흘러나오고 있습니다.\n\n출혈은 턴마다 피해를 줍니다. 매 턴 입는 피해는 출혈이 끝날 때까지 무작위로 줄어듭니다. \n\n현재 출혈 피해: %d.

actors.buffs.bless.name=축복
actors.buffs.bless.desc=마치 신이 은총을 내린 것처럼 집중력이 폭발적으로 증가했습니다.\n\n축복은 정확도와 회피율을 25%%만큼 늘려, 축복받은 자를 전투에 더욱 능하게 만듭니다.\n\n축복 효과의 남은 턴: %s.

actors.buffs.blindness.name=실명
actors.buffs.blindness.heromsg=당신의 눈이 멀었다!
actors.buffs.blindness.desc=실명은 대상의 주변 모든 것을 어두운 안개처럼 보이게 합니다.\n\n대상은 실명한 동안 캐릭터의 시야 범위는 타일 한 칸으로 줄어들며, 원거리 공격은 무용지물이 되고 먼 거리의 적을 볼 수 없어 놓치게 됩니다. 또한 눈이 먼 영웅은 주문서나 책을 읽을 수 없습니다. \n\n실명 효과의 남은 턴: %s.

actors.buffs.buff.heromsg=

actors.buffs.burning.name=연소
actors.buffs.burning.heromsg=당신에게 불이 붙었다!
actors.buffs.burning.burnsup=%s에 불이 붙었다!
actors.buffs.burning.ondeath=당신은 불타 사망했다...
actors.buffs.burning.rankings_desc=재가 되어버림
actors.buffs.burning.desc=몸에 불이 붙는 것만큼 고통스러운 게 또 있을까요?\n\n불이 붙으면 물에 들어가거나 꺼질 때까지 턴마다 지속적으로 피해를 줍니다. 불은 물에 들어가거나 물약을 깨트리면 끌 수 있습니다.\n\n또한, 불이 붙은 상태에서 다른 지형이나 아이템에 불을 옮겨 붙일 수도 있습니다. \n\n연소 효과의 남은 턴: %s.

actors.buffs.championenemy.warn=당신은 매우 강력한 존재가 있음을 느낀다.
actors.buffs.championenemy$blazing.name=불타는 강화 개체
actors.buffs.championenemy$blazing.desc=불타는 강화 개체는 25% 더 많은 근접 피해를 입히고, 공격한 적을 불태울 수 있으며, 불에 면역이고, 죽을 때 물 위를 제외한 주변 타일에 불을 흩뿌립니다.
actors.buffs.championenemy$projecting.name=도달의 강화 개체
actors.buffs.championenemy$projecting.desc=도달의 강화 개체는 25% 더 많은 근접 피해를 입히고, +3타일 더 멀리 있는 적을 공격할 수 있습니다.
actors.buffs.championenemy$antimagic.name=항마의 강화 개체
actors.buffs.championenemy$antimagic.desc=항마의 강화 개체는 피해를 50% 덜 받으며 마법 효과에 대해 완전하게 면역입니다.
actors.buffs.championenemy$giant.name=거대한 강화 개체
actors.buffs.championenemy$giant.desc=거대한 강화 개체는 피해를 80% 덜 받으며 공격 범위가 한 칸 더 넓지만, 좁은 벽 사이를 지나갈 수 없습니다.
actors.buffs.championenemy$blessed.name=축복받은 강화 개체
actors.buffs.championenemy$blessed.desc=축복받은 강화 개체는 4배 더 많은 정확성과 회피를 가집니다.
actors.buffs.championenemy$growing.name=성장하는 강화 개체
actors.buffs.championenemy$growing.desc=성장하는 강화 개체는 지속적으로 추가 정확성, 회피, 물리 공격력, 받는 피해량 감소를 얻습니다.\n\n현재 정확성/회피/공격력 증가량: %1$d%%\n현재 받는 피해 감소량: %2$d%%

actors.buffs.charm.name=매혹
actors.buffs.charm.heromsg=당신은 매혹에 걸렸다!
actors.buffs.charm.cant_attack=당신은 그 적에게 매혹되어 있어 공격할 수 없다.
actors.buffs.charm.desc=매혹 효과는 적들을 서로 일시적으로 사랑에 빠지게 하는 조작 마법입니다.\n\n매혹에 걸린 대상들은 같이 매혹에 걸린 적들을 직 공격하는 것이 불가능해집니다. 하지만 다른 적을 공격하는 것은 가능합니다. 대상이 피해를 받으면 효과의 지속시간이 감소합니다.\n\n매혹 효과의 남은 턴: %s.

actors.buffs.chill.name=한기
actors.buffs.chill.freezes=%s이(가) 얼어붙었다!
actors.buffs.chill.desc=완전히 얼진 않았지만, 그래도 여전히 너무 춥습니다.\n\n한기에 걸린 대상은 모든 행동을 더 느리게 수행하며, 남은 효과 시간에 비례하여 느려집니다. 최대 한기 상태는 둔화 효과와 동일하게 느려집니다..\n\n한기 효과의 남은 턴: %1$s,\n속도 감소: %2$s%%.

actors.buffs.combo.name=연속 타격
actors.buffs.combo.action_name=연속 타격
actors.buffs.combo.combo=%d 연속 명중!
actors.buffs.combo.bad_target=공격 범위 내에 있는 적을 공격해야 합니다.
actors.buffs.combo.prompt=공격할 대상을 선택
actors.buffs.combo.desc=검투사는 공격에 성공할 때마다 전투에 추진력을 얻습니다. 각 공격은 연속 타격 수치를 하나 늘립니다. 그러나 일정 시간동안 공격을 성공하지 못하면 연속 타격 수치는 0으로 초기화됩니다. 또한 연속 타격 수치가 있는 동안은 부러진 인장의 방어막이 서서히 사라지지 않습니다.\n\n연속 타격을 많이 성공시키면 절대 빗나가지 않는 필살기를 사용할 수 있습니다! 연속 타격 수치가 2, 4, 6, 8, 10일때 각각 고유한 필살기를 사용할 수 있습니다. 연속 타격을 초기화시키지 않는 필살기도 있지만, 한 번의 연속 타격 중첩 동안 각 종류의 필살기를 한 번만 사용할 수 있습니다.\n\n현재 연속 타격: %1$d.\n\n연속 타격이 사라질 때까지 남은 턴: %2$s.
actors.buffs.combo$combomove.clobber.name=밀쳐내기
actors.buffs.combo$combomove.clobber.desc=적을 2타일 밀치지만, 피해를 주지 않고, 낭떠러지로 떨어뜨릴 수 없습니다. 연속 타격 수치가 1 증가합니다.
actors.buffs.combo$combomove.clobber.empower_desc=적을 _3타일 밀치고, 혼란시키며, 낭떠러지에 떨어뜨릴 수 있지만_, 피해를 입히지 않습니다. 연속 타격 수치가 1 증가합니다.
actors.buffs.combo$combomove.slam.name=메치기
actors.buffs.combo$combomove.slam.desc=근접 공격력에 더불어, 방어력의 %d%%(연속 타격 수치*20%%)만큼의 추가 피해를 입힙니다. 발동 후 연속 타격 수치가 초기화됩니다.
actors.buffs.combo$combomove.slam.empower_desc=_최대 %1$d 타일_ 거리를 도약해 %2$d%%(연속 타격*20%%) 피해에 더해 현재 방어력만큼의 피해를 추가로 입힙니다. 발동 후 연속 타격 수치가 초기화됩니다.
actors.buffs.combo$combomove.parry.name=받아치기
actors.buffs.combo$combomove.parry.desc=1턴 동안 다음 공격을 막고, 즉시 반격합니다. 발동 후 공격을 막지 못하면 연속 타격 수치가 초기화됩니다.
actors.buffs.combo$combomove.parry.empower_desc=1턴 동안 _모든 공격_을 막고, 공격해온 대상들에게 즉시 반격합니다. 발동 후 공격을 막지 못하면 연속 타격 수치가 초기화됩니다.
actors.buffs.combo$combomove.crush.name=으깨기
actors.buffs.combo$combomove.crush.desc=%d%%(연속 타격*25%%)의 피해를 지정한 대상에게 입히고, 7x7 지역에 있는 나머지 모든 적들에게 절반의 피해를 입힙니다. 발동 후 연속 타격 수치가 초기화됩니다.
actors.buffs.combo$combomove.crush.empower_desc=_최대 %1$d 타일_ 거리를 도약해 %2$d%%(연속 타격*25%%)의 피해를 지정한 대상에게 입히고, 7x7 지역에 있는 나머지 적들에게 절반의 피해를 입힙니다. 발동 후 연속 타격 수치가 초기화됩니다.
actors.buffs.combo$combomove.fury.name=분노 폭발
actors.buffs.combo$combomove.fury.desc=가진 연속 타격 수치의 횟수만큼 적을 60% 공격력으로 공격하며, 매 타격마다 무기에 부여된 마법이 발동할 수 있습니다. 발동 후 연속 타격 수치가 초기화됩니다.
actors.buffs.combo$combomove.fury.empower_desc=_최대 %d 타일_ 거리를 도약해 연속 타격 횟수만큼 적을 공격하며, 각 공격은 60%%의 피해를 주고 무기에 부여된 마법이 발동할 수 있습니다. 발동 후 연속 타격 수치가 초기화됩니다.

actors.buffs.corruption.name=타락
actors.buffs.corruption.desc=타락 마법은 존재의 근원을 조작하여, 대상을 아군과 적대하도록 만듭니다.\n\n타락한 생물체는 자신의 동료를 공격하며, 자신의 원래 적을 무시합니다. 타락은 또한 걸린 대상에게 피해를 입히며, 시간이 지남에 따라 체력이 천천히 사라집니다.\n\n타락 효과는 영구적으로 지속되며, 오직 죽어야만 끝이 납니다.

actors.buffs.cripple.name=불구
actors.buffs.cripple.heromsg=당신은 불구가 되었다!
actors.buffs.cripple.desc=다리가 잘못된 방향으로 꺾였습니다.\n\n불구 상태가 되면 이동 속도가 절반으로 줄어, 일반적으로 한칸을 움직이는 데 두 턴이 걸리게 됩니다.\n\n불구 효과의 남은 턴: %s.

actors.buffs.daze.name=멍해짐
actors.buffs.daze.heromsg=당신은 멍해졌다!
actors.buffs.daze.desc=귀의 울림과 시야의 흐려짐은 싸움을 어렵게 합니다.\n\n멍해진 상태에서는 명중률과 회피가 50%% 감소하며, 공격을 맞히고 피하기 훨씬 어려워집니다.\n\n멍해짐 효과의 남은 턴: %s.

actors.buffs.degrade.name=장비 약화
actors.buffs.degrade.heromsg=장비가 약해진 느낌을 받았다!
actors.buffs.degrade.desc=강력한 어둠의 마법이 당신의 장비에 깃든 강화의 주문서의 힘을 빨아들이고 있습니다! \n\n장비 약화가 적용되는 동안 강화된 장비는 제 성능을 온전히 발휘하지 못합니다. _+3 이후의 모든 강화 효율이 큰 폭으로 감소합니다._ 장비의 설명이 감소한 수치를 반영하여 표시됩니다.\n\n장비 약화는 힘 요구량, 마법 막대의 충전량, 투척 무기의 내구도, 그리고 유물 효과에는 영향을 주지 않습니다.\n\n장비 약화의 남은 턴: %s. 강화의 주문서를 사용하면 장비 약화 효과를 즉시 끝낼 수 있습니다.

actors.buffs.doom.name=파멸
actors.buffs.doom.desc=온 세상이 당신이 죽기를 바라는데, 어찌 계속 살아갈 수 있을까요?\n\n파멸한 대상은 +67%의 추가 피해를 받습니다.\n\n파멸은 영구적으로 지속되며, 오직 죽어야만 끝이 납니다.

actors.buffs.dread.name=두려움
actors.buffs.dread.desc=대상의 공포가 극에 달해 던전으로부터 도망치려 합니다!\n\n두려움에 떠는 대상은 적으로부터 빠른 속도로 도망치며, 시야에서 벗어난 순간 던전에서 완전히 사라집니다. 이러한 방식으로 처치한 적은 절반의 경험치를 주며, 전리품을 떨어뜨리지 않습니다. 피해를 입으면 두려움의 지속 시간이 줄어듭니다.\n\n두려움 효과의 남은 턴: %d.

actors.buffs.drowsy.name=졸림
actors.buffs.drowsy.desc=마법의 힘이 대상의 정신을 몽롱하게 만들며, 몇 턴 후에 깊은 마법의 수면에 빠지게  만듭니다.\n\n영웅은 피해를 입거나 체력이 최대일 때 졸음에 저항할 수 있습니다.\n\n잠에 들기까지 남은 턴: %s.

actors.buffs.earthimbue.name=대지와 동화함
actors.buffs.earthimbue.desc=당신은 대지의 힘과 하나가 되었습니다!\n\n당신의 모든 물리적 공격이 적이 밟고 있는 땅을 흔들어, 일시적으로 대상을 속박합니다.\n\n대지와 동화함 효과의 남은 턴: %s.

actors.buffs.enhancedrings.name=향상된 반지
actors.buffs.enhancedrings.desc=도적이 최근에 사용한 유물이 반지를 +1 만큼 강화하고 있습니다.\n\n남은 턴: %s.

actors.buffs.fireimbue.name=화염과 동화함
actors.buffs.fireimbue.desc=당신은 불의 힘과 하나가 되었습니다!\n\n당신의 모든 물리적 공격이 확률적으로 적에게 불을 붙입니다. 또한 당신은 불에 면역이 됩니다.\n\n화염과 동화함 효과의 남은 턴: %s.

actors.buffs.foresight.name=예지
actors.buffs.foresight.desc=당신은 어떻게든 주변 지형의 생김새를 볼 수 있게 되었습니다. 예지 효과가 지속되는 동안 넓은 범위에 있는 숨겨진 문이나 함정을 포함한 모든 지역이 드러납니다.\n\n예지 효과의 남은 턴: %s.

actors.buffs.frost.name=빙결
actors.buffs.frost.freezes=%s이(가) 얼어붙었다!
actors.buffs.frost.desc=빙결은 상대를 뼛속까지 얼려버리는 대신, 단순히 얼음으로 감싸 버립니다.\n\n빙결은 마비와 비슷하게 대상이 아무 행동도 하지 못하게 합니다. 하지만 대상이 피해를 입으면 얼음이 깨져 즉시 효과가 끝납니다.\n\n빙결 효과의 남은 턴: %s.

actors.buffs.frostimbue.name=냉기와 동화함
actors.buffs.frostimbue.desc=당신은 차가운 힘과 하나가 되었습니다!\n\n모든 물리 공격은 적을 점점 얼려버리며, 추가로 당신은 냉기에 면역을 가지게 됩니다.\n\n냉기와 동화함 효과의 남은 턴: %s.

actors.buffs.fury.name=격노
actors.buffs.fury.heromsg=당신은 분노에 휩싸였다!
actors.buffs.fury.desc=당신은 화가 났습니다. 그리고 적들은 당신에게서 도망치는게 좋을 겁니다.\n\n거대한 분노가 당신 속에서 타오르며, 당신이 가하는 물리 공격력을 50%% 만큼 증가시킵니다.\n\n분노 효과는 당신의 체력이 50%% 이하로 떨어지면 항상 발동합니다.

actors.buffs.blobimmunity.name=정화의 방어막
actors.buffs.blobimmunity.desc=어떤 기묘한 힘이 당신을 얇은 방어막으로 둘러싸, 공기 중의 모든 해로운 효과를 막아내고 있습니다.\n\n이 방어막이 유지되는 동안 모든 지역 효과를 받지 않습니다.\n\n면역 효과의 남은 턴: %s.

actors.buffs.gravitychaostracker.name=중력 혼돈
actors.buffs.gravitychaostracker.desc_intro=몇 턴 마다 현재 층의 모든 캐릭터들을 무작위 방향으로 날려 버립니다.
actors.buffs.gravitychaostracker.desc_positive=당신과 아군들은 이 효과에 면역입니다.
actors.buffs.gravitychaostracker.desc_duration=이 효과가 언제까지 지속될진 알 수 없으나, 영구히 지속되지 않는 것은 확실합니다.

actors.buffs.greaterhaste.name=초신속
actors.buffs.greaterhaste.desc=믿을 수 없을 정도로 빨라져, 잠시 동안 다른 모든 것이 제자리에 멈춰선 것처럼 느껴집니다.\n\n초신속의 효과 도중 이동에 시간이 전혀 들지 않습니다, 하지만 다른 행동은 여전히 기본 속도로 이루어집니다. 이동에 한 칸 움직일 때마다 초신속의 지속 시간이 소모됩니다.\n\n초신속 효과의 남은 턴: %d.

actors.buffs.haste.name=신속
actors.buffs.haste.desc=에너지가 당신의 근육을 따라 흐르며, 믿을 수 없는 속도로 달릴 수 있게 되었습니다!\n\n신속 효과가 적용되는 동안 당신은 3배 빠르게 달릴 수 있지만, 다른 행동들은 보통의 속도로 수행합니다.\n\n신속 효과의 남은 턴: %s.

actors.buffs.healing.name=치유 중
actors.buffs.healing.desc=마법의 치유력이 상처를 치유하고 살을 꿰매고 있습니다.\n\n치유 효과가 사라지기 전까지 매 턴마다 체력을 꾸준히 회복합니다. 매 턴마다 치유량은 조금씩 줄어들 수 있습니다.\n\n다음 턴 체력 회복량: %d.\n\n남은 총 회복량: %d.

actors.buffs.herodisguise.name=변장
actors.buffs.herodisguise.desc=환상 마법이 당신의 외형을 바꾸어 놓았습니다! 순전히 외형의 변화만 있을 뿐인 효과이지만, 어쨌든 기분이 매우 이상하게 느껴집니다.\n\n변장 효과의 남은 턴: %s.

actors.buffs.hex.name=주술에 걸림
actors.buffs.hex.heromsg=당신은 주술에 걸렸다!
actors.buffs.hex.desc=암흑 마법이 집중력을 빨아들여, 대상을 약간 혼란스럽게 합니다.\n\n이 주술은 정확도와 회피를 각각 20%%씩 줄여, 대상의 전투를 불리하게 만듭니다.\n\n주술 효과의 남은 턴: %s.

actors.buffs.holdfast.name=굳건한 태세
actors.buffs.holdfast.desc=전사가 현재 위치를 지키고 있으며, 방어력이 %1$d-%2$d만큼 증가하고 일부 버프들의 효과 감소를 %3$d%%만큼 지연시키고 있습니다. 이 효과는 이동하기 전까지 유지됩니다.

actors.buffs.hunger.hungry=배고픔
actors.buffs.hunger.starving=굶주림
actors.buffs.hunger.onhungry=당신은 배가 고프다.
actors.buffs.hunger.onstarving=당신은 너무 굶주렸다!
actors.buffs.hunger.ondeath=당신은 굶어 죽었다...
actors.buffs.hunger.cursedhorn=저주받은 뿔이 당신이 먹고 있는 음식의 영양분을 빼앗아 갔다.
actors.buffs.hunger.rankings_desc=굶어 죽음
actors.buffs.hunger.desc_intro_hungry=당신은 배가 조금 고프지만 아직 그렇게 급하지는 않습니다.
actors.buffs.hunger.desc_intro_starving=당신은 너무 배고파서 체력이 줄어들고 있습니다.
actors.buffs.hunger.desc=\n\n던전에서 시간을 보내는 동안 배고픔이 천천히 증가하여 결국 굶주리게 됩니다. 굶주리는 동안에는 체력이 회복되지 않고 천천히 감소합니다.\n\n식량 조절은 중요합니다! 남는 체력이 있다면 나중에 더 많은 식량을 위해 잠시 굶주리는것도 나쁘지 않은 생각입니다. 효과적인 식량 조절로 음식을 훨씬 더 많이 절약할 수 있습니다.

actors.buffs.invisibility.name=투명화
actors.buffs.invisibility.desc=당신은 주변 환경에 완벽하게 섞여들어 보이지 않습니다.\n\n투명화 상태 동안 적들은 공격하거나 따라올 수 없습니다. 물리적 공격이나 마법 효과(주문서나 마법 막대 등)를 사용하면 즉시 투명화가 풀립니다.\n\n투명화 효과의 남은 턴: %s.

actors.buffs.invulnerability.name=무적
actors.buffs.invulnerability.desc=이 캐릭터는 거대한 보호의 힘에 의해 둘러싸여 있으며, 짧은 시간 동안 피해를 입지 않습니다!\n\n남은 턴: %s.

actors.buffs.levitation.name=부유
actors.buffs.levitation.desc=마법의 힘이 당신을 공중으로 띄워 마치 무게가 없는 것처럼 느껴집니다.\n\n공중에 뜬 상태에서는 조용하게 움직일 수 있으며 모든 지상 효과를 무시합니다. 함정은 작동하지 않으며, 물 위에 올라가도 불을 끌 수 없고, 식물은 밟히지 않으며, 당신을 속박하려는 뿌리들 또한 영향을 주지 못합니다. 또 낭떠러지 위를 지나갈 수도 있습니다. 그러나 이 모든 일들은 부유 효과가 끝나는 그 순간부터 다시 효과를 발휘하니 주의하십시오!\n\n부유 효과의 남은 턴: %s.

actors.buffs.lifelink.name=생명 연결
actors.buffs.lifelink.ondeath=생명 연결 피해에 의해 사망했다...
actors.buffs.lifelink.desc=이 캐릭터의 생명력은 다른 캐릭터와 이어져 있습니다. 한 쪽이 입은 피해는 다른 대상과 공유됩니다.\n\n한 캐릭터가 피해를 입으면, 그 피해의 절반이 생명력을 공유한 대상에게 대신 가해집니다. \n\n생명 연결 효과의 남은 턴: %s.

actors.buffs.light.name=발광
actors.buffs.light.desc=가장 어두운 던전에서라도, 당신 곁에 있는 밝은 불빛은 매우 든든한 존재입니다.\n\n불빛은 어둠을 몰아 내며, 주변 환경에 구애받지 않고 시야를 더 넓혀줍니다.\n\n발광 효과의 남은 턴: %s.

actors.buffs.lockedfloor.name=층이 잠겨있음
actors.buffs.lockedfloor.desc=현재 층이 잠겨 있어 당신은 나갈 수 없습니다!\n\n층이 잠겨있는 동안 당신은 배고픔이 증가하지 않고 굶주림 피해를 입지 않습니다. 더하여 이 층의 보스를 물리치러 나아가지 않는 이상 재생 효과 또한 멈추게 됩니다.\n\n또 층이 잠겨있는 동안 축복받지 않은 앙크로 부활한다면 해당 층을 재시작하게 됩니다.\n\n잠금을 풀기 위해 이 층의 보스를 물리치십시오.

actors.buffs.lostinventory.name=잃어버린 배낭
actors.buffs.lostinventory.desc=당신은 배낭을 던전 어딘가에서 잃어버렸습니다! 배낭을 되찾기 전까지 대부분의 아이템을 줍거나 사용할 수 없습니다.

actors.buffs.magicalsight.name=마법 시야
actors.buffs.magicalsight.desc=당신은 어떻게든 마음으로 주변을 볼 수 있게 되었습니다.\n\n마법 시야가 활성화되는 동안 12 타일 반경의 모든 지형을 볼 수 있습니다.\n\n마법 시야 효과의 남은 턴: %s.

actors.buffs.magicalsleep.name=마법의 수면
actors.buffs.magicalsleep.toohealthy=너무 건강한 당신은 수면의 욕구에 저항했다.
actors.buffs.magicalsleep.fallasleep=당신은 깊은 마법의 잠에 빠졌다.
actors.buffs.magicalsleep.wakeup=당신은 생기있고 건강한 기분으로 깨어났다.
actors.buffs.magicalsleep.desc=이 캐릭터는 깊은 마법의 수면에 빠져 자연적으로는 일어날 수 없습니다.\n\n마법의 수면은 일반 수면과 크게 다르지 않지만, 오직 피해를 입어야만 깨어날 수 있습니다.\n\n영웅과 아군에게 걸린 마법 수면은 치유의 힘이 깃들어 있어, 자는 동안 체력을 빠른 속도로 회복시킵니다.

actors.buffs.magicimmune.name=마법 면역
actors.buffs.magicimmune.desc=모든 마법이 당신에게 미치는 효력을 잃어, 당신은 어떠한 마법 효과도 받지 않습니다.\n\n마법 면역 상태에서 당신은 저주, 마법 부여, 마법 막대, 주문서, 반지, 유물 등을 포함한 모든 해롭거나 이로운 마법 효과를 받지 않습니다. 영웅의 갑옷 능력은 이 효과를 무시할 정도로 강력하기 때문에, 사용이 가능합니다.\n\n마법 면역 효과의 남은 턴: %s.

actors.buffs.mindvision.name=심안
actors.buffs.mindvision.desc=당신은 어떻게든 이 층에 있는 모든 생물체들을 마음의 눈으로 볼 수 있습니다. 익숙한 현상은 아니겠지요.\n\n심안 효과가 지속되는 동안 현재 층에 있는 모든 캐릭터들을 볼 수 있습니다. 이 효과로 보이는 생명체들 역시 시야 내의 캐릭터에게 효과가 있는 마법 주문의 대상에 포함됩니다.\n\n심안 효과의 남은 턴: %s.

actors.buffs.momentum.momentum=가속 중
actors.buffs.momentum.running=프리러닝
actors.buffs.momentum.resting=회복 중
actors.buffs.momentum.action_name=프리러닝
actors.buffs.momentum.momentum_desc=프리러너는 달리면서 프리러닝을 시작하기 위해 사용할 가속력을 얻습니다.\n\n가속력 하나 당 2턴의 프리러닝이 가능하며, 최대 10까지 가속력을 쌓을 수 있습니다. 가속력은 프리러너가 멈춘 동안 빠르게 사라집니다.\n\n현재 가속력: %d.
actors.buffs.momentum.running_desc=프리러너는 달리면서 가속력을 얻으며, 얻은 가속력을 소모해 프리러닝 상태에 돌입합니다.\n\n프리러닝 중의 프리러너는 두 배 빠른 속도로 이동하며 현재 레벨에 따른 추가 회피를 얻습니다.\n\n남은 턴: %d.
actors.buffs.momentum.resting_desc=프리러너는 달리면서 프리러닝을 시작하기 위해 사용할 가속력을 얻습니다.\n\n프리러너는 가속력을 다시 쌓기 전 기력을 다시 회복할 시간이 필요합니다.\n\n남은 턴: %d.

actors.buffs.monkenergy.name=에너지
actors.buffs.monkenergy.action=수도사 능력
actors.buffs.monkenergy.desc=수도사는 적을 처치할 때 다양한 능력에 사용 가능한 에너지를 얻습니다. 대부분의 적들은 처치했을 때 1의 에너지를 제공하며, 시간이 지나도 이 에너지는 사라지지 않습니다.\n\n현재 에너지: %1$d/%2$d.
actors.buffs.monkenergy.desc_cooldown=당신은 최근에 능력을 사용하여, 다른 능력을 사용하기 위해서는 시간이 필요합니다.\n\n남은 턴: %d.
actors.buffs.monkenergy$monkability$flurry.name=휘몰아치는 타격
actors.buffs.monkenergy$monkability$flurry.desc=수도사가 즉시 %1$d-%2$d의 피해를 입히며 방어구를 관통하는 2번의 공격을 합니다. 이 능력은 반복해서 사용할 수 없습니다.
actors.buffs.monkenergy$monkability$flurry.empower_desc=%1$d-%2$d의 피해를 입히며 방어구를 무시하고, _무기에 부여된 마법을 발동시킬 수 있는_ 공격을 턴 소모 없이 2회 합니다. 이 능력은 반복해서 사용할 수 없습니다.
actors.buffs.monkenergy$monkability$focus.name=집중
actors.buffs.monkenergy$monkability$focus.desc=수도사는 1턴을 소모해 집중한 후, 다음에 받는 공격을 1회 방어합니다.
actors.buffs.monkenergy$monkability$focus.empower_desc=수도사는 _즉시 집중하여,_ 다음에 받는 공격을 1회 방어할 수 있게 됩니다.
actors.buffs.monkenergy$monkability$focus$focusbuff.name=집중
actors.buffs.monkenergy$monkability$focus$focusbuff.desc=수도사는 주변 환경에 집중하여, 자신이 받을 다음 공격을 예상합니다. 집중 상태의 수도사는 다음 공격을 반드시 막아낼 수 있습니다.
actors.buffs.monkenergy$monkability$dash.name=돌진
actors.buffs.monkenergy$monkability$dash.prompt=위치를 선택하세요
actors.buffs.monkenergy$monkability$dash.desc=수도사가 최대 4타일을 즉시 돌진합니다. 이 능력은 위험 요소를 지나쳐 갈 수는 있지만, 단단한 지형이나 적을 통과할 수는 없습니다.
actors.buffs.monkenergy$monkability$dash.empower_desc=수도사가 최대 _8 타일_을 즉시 돌진합니다. 이 능력은 위험 요소를 지나쳐 갈 수는 있지만, 단단한 지형이나 적을 통과할 수는 없습니다.
actors.buffs.monkenergy$monkability$dragonkick.name=날아차기
actors.buffs.monkenergy$monkability$dragonkick.desc=수도사가 %1$d-%2$d의 피해를 입히며 방어구를 관통하는 파괴적인 공격을 합니다. 이 발차기는 대상을 밀쳐내며 대상이 밀려난 거리에 비례하여 기절시킵니다.
actors.buffs.monkenergy$monkability$dragonkick.empower_desc=수도사가 _%1$d-%2$d_의 피해를 입히며 방어구를 관통하는 파괴적인 발차기를 합니다. 이 발차기는 _근접한 모든 대상_을 밀쳐내며 대상이 밀려난 거리에 비례하여 기절시킵니다.
actors.buffs.monkenergy$monkability$meditate.name=명상
actors.buffs.monkenergy$monkability$meditate.desc=수도사가 5턴 동안 에너지를 자신의 신체에 집중시킵니다. 이 능력은 대부분의 부정적인 효과를 제거하며 8턴의 충전 및 유물 충전 효과를 얻습니다.
actors.buffs.monkenergy$monkability$meditate.empower_desc=수도사는 5턴 동안 그녀의 신체 내부에 에너지를 집중시켜 대부분의 부정적 효과를 제거하고, 8턴의 충전과 유물 충전 효과를 얻습니다. _또한 명상하는 동안에는 받는 피해의 80%를 경감하며, 잃은 체력의 20%만큼을 천천히 회복합니다._

actors.buffs.ooze.name=산성 점액
actors.buffs.ooze.heromsg=산성 점액이 살점을 삼킨다. 물에서 씻어내야 한다!
actors.buffs.ooze.ondeath=당신은 녹아버렸다....
actors.buffs.ooze.rankings_desc=산성에 의해 녹아버림
actors.buffs.ooze.desc=이 끈적한 산성 점액이 살에 달라붙어 서서히 녹이고 있습니다.\n\n점액은 일정량의 피해를 지속하여 주지만, 물에서 즉시 씻어낼 수 있습니다.\n\n점액 효과의 남은 턴: %s.

actors.buffs.paralysis.name=마비
actors.buffs.paralysis.heromsg=당신은 마비되었다!
actors.buffs.paralysis.out=마비 저항
actors.buffs.paralysis.desc=아무 것도 할 수 없는 상황이 최악의 상황이라고 할 수 있습니다.\n\n마비는 대상의 모든 행동을 완전히 멈추어 지속 시간동안 가만히 있게 합니다. 마비 중인 대상은 피해를 입으면 그 고통으로 인해 마비에서 즉시 벗어날 수도 있습니다.\n\n마비 효과의 남은 턴: %s.

actors.buffs.physicalempower.name=물리 공격 강화
actors.buffs.physicalempower.desc=당신의 일격이 강화되어 물리 공격으로 적을 맞추었을 때 더 많은 피해를 줍니다.\n\n추가 피해량: %1$d.\n남은 타격 횟수: %2$d.

actors.buffs.pincushion.name=부착
actors.buffs.pincushion.desc=당신이 던진 투척 무기가 이 캐릭터에게 꽂혔습니다. 부착된 투척 무기는 그 캐릭터가 죽고 난 후 바닥에 떨어지게 됩니다.\n\n현재 다음과 같은 아이템들이 붙어 있습니다:

actors.buffs.poison.name=중독
actors.buffs.poison.heromsg=당신은 중독되었다!
actors.buffs.poison.ondeath=당신은 중독사하였다...
actors.buffs.poison.rankings_desc=맹독에 중독되어 사망
actors.buffs.poison.desc=독이 당신의 피를 타고 흘러가 내부 장기의 기능을 천천히 방해합니다.\n\n독은 매 턴마다 남은 지속시간에 비례하는 피해를 입힙니다.\n\n독 효과의 남은 턴: %s.

actors.buffs.preparation.name=마음가짐
actors.buffs.preparation.action_name=암살 공격
actors.buffs.preparation.desc=암살자는 그림자 속에서 침착하게 기다리며, 치명적인 일격을 준비합니다.
actors.buffs.preparation.desc_dmg=다음 공격 시 _%1$d%%의 추가 피해_를 주며, 체력이 _%2$d%%미만_인 일반적인 적 또는 체력이 _%3$d%%미만_인 보스를 일격에 처치합니다.
actors.buffs.preparation.desc_dmg_likely=이 공격은 또한 더 높은 피해를 입힐 경우가 많습니다.
actors.buffs.preparation.desc_blink=적을 공격하기 전에 대상 위치로 점멸할 수 있습니다. 최대 점멸 거리는 _%d_ 칸 입니다.
actors.buffs.preparation.desc_invis_time=투명화를 지속한 턴: _%d._
actors.buffs.preparation.desc_invis_next=더 강한 공격까지 남은 턴: _%d._
actors.buffs.preparation.prompt=공격할 대상을 선택\n최대 점멸 사정거리: %d
actors.buffs.preparation.no_target=공격할 대상이 없다.
actors.buffs.preparation.out_of_reach=사정거리 바깥의 적을 공격할 수 없다.
actors.buffs.preparation.assassinated=암살당함

actors.buffs.prismaticguard.name=프리즘 수호
actors.buffs.prismaticguard.desc=비활성화된 프리즈마 거울상이 당신을 지키고 있으며, 적이 등장하면 튀어나와 당신을 보호해 줄 것입니다!\n\n비활성화된 동안, 프리즈마 거울상은 받은 피해를 천천히 회복합니다.\n\n현재 체력은 %d이며, 최대 체력은 %d입니다.
actors.buffs.prismaticguard.desc_many=프리즈마 거울상 또한 집단의 힘의 효과를 받고 있습니다. 남은 턴: %d.

actors.buffs.recharging.name=충전
actors.buffs.recharging.desc=에너지가 당신에게 통하며 마법 막대와 지팡이를 빠르게 충전시킵니다.\n\n이 효과는 기존의 충전 속도에 더하여, 매 턴마다 1/4의 충전량을 추가로 충전시킵니다.\n\n충전 효과의 남은 턴: %s.

actors.buffs.revealedarea.name=드러난 구역
actors.buffs.revealedarea.desc=던전의 일부 구역이 일시적으로 당신에게 드러났으며,  당신이 어디에 있든 볼 수 있게 됩니다.\n\n남은 턴: %s.

actors.buffs.revealedchar.name=드러남
actors.buffs.revealedchar.desc=이 대상이 영웅에게 드러났으며, 어디에 있든 보이게 됩니다.\n\n남은 턴: %s.

actors.buffs.roots.name=속박
actors.buffs.roots.heromsg=당신은 움직일 수 없다!
actors.buffs.roots.desc=(자연적인 속박이든 마법 속박이든)속박은 대상을 발목을 잡아 땅에 묶어둡니다.\n\n속박에 걸린 대상은 그 자리에서 움직이지 못하며 대부분의 이동이 억제되지만, 이동을 제외한 모든 행동은 영향을 받지 않으며 순간이동도 정상적으로 할 수 있습니다.\n\n속박 효과의 남은 턴: %s

actors.buffs.scrollempower.name=주문서 강화
actors.buffs.scrollempower.desc=마법사가 최근에 읽은 주문서의 에너지가 마법 막대에 힘을 전달하고 있습니다!\n\n강화 수치 증가량: +%1$d\n남은 발사 횟수: %2$d

actors.buffs.shadows.name=그림자 숨기
actors.buffs.shadows.desc=당신은 주변의 그림자에 동화되어, 투명해졌으며 느린 신진대사를 가지게 되었습니다.\n\n투명화가 적용되는 동안, 적들은 당신을 공격하거나 따라올 수 없습니다. 대부분의 물리적인 공격이나 마법 효과(주문서나 마법 막대 등)는 즉시 투명화를 취소합니다. 또한, 그림자에 숨는 동안에는 덜 배고파집니다.\n\n직접 그림자에서 빠져나오거나, 적이 당신에게 다가오기 전까지는 계속 그림자에 숨어 있게 됩니다.

actors.buffs.slow.name=감속
actors.buffs.slow.desc=둔화 마법은 대상의 시간의 흐름에 영향을 주어, 다른 모든 것이 매우 빠르게 움직이는 것처럼 보이게 합니다.\n\n느려진 캐릭터는 모든 행동을 취하는 데에 두 배의 시간이 듭니다.\n\n둔화 효과의 남은 턴: %s.

actors.buffs.snipersmark.name=저격수의 표식
actors.buffs.snipersmark.action_name_snapshot=스냅샷
actors.buffs.snipersmark.action_name_volley=일제 사격
actors.buffs.snipersmark.action_name_sniper=저격 화살
actors.buffs.snipersmark.desc=저격수는 그녀가 가장 최근에 공격한 대상에게 집중합니다. 그녀는 어떻게 활이 개조되었는지에 따라 다양한 특수한 공격을 할 수 있습니다.\n\n개조되지 않은 활은 _스냅샷_을 쏘며, 턴을 소모하지 않지만 적은 피해를 줍니다.\n\n공격 속도가 개조된 활은 3발의 화살을 _일제 사격_합니다. 각각의 화살은 적은 피해를 입히지만, 마법을 발동시킬 수 있습니다. 일제 사격은 1턴을 소모합니다.\n\n피해량이 개조된 활은 _저격탄_을 쏩니다. 이 빗나가지 않는 화살은 대상과의 거리에 따른 추가 피해를 입히며, 발사하는 데 2턴을 소모합니다.\n\n남은 턴: %s.

actors.buffs.soulmark.name=영혼의 낙인
actors.buffs.soulmark.desc=흑마법사가 해당 생물체의 영혼을 이용하고 있습니다. 대상에게 물리 피해를 입힐 때마다 흑마법사의 체력이 회복됩니다.\n\n영혼의 낙인 효과의 남은 턴: %s.

actors.buffs.stamina.name=지구력
actors.buffs.stamina.desc=끝없는 지구력으로 더 빠르게 움직일 수 있게 되었습니다!\n\n효과 중에는 50%% 더 빠르게 이동하지만, 다른 행동은 정상적인 속도로 실행합니다.\n\n지구력 효과의 남은 턴: %s.

actors.buffs.vulnerable.name=취약
actors.buffs.vulnerable.heromsg=연약해진 느낌이 들었다!
actors.buffs.vulnerable.desc=취약 마법은 대상이 받는 모든 물리적 피해를 33%%만큼 늘립니다. 이 효과는 갑옷에 의한 피해 경감을 계산한 다음 적용됩니다.\n\n지구력 효과의 남은 턴: %s.

actors.buffs.terror.name=공포
actors.buffs.terror.desc=공포 효과는 대상의 정신을 조작하여 주체할 수 없는 공황 상태로 몰아넣는 마법입니다.\n\n공포에 질린 캐릭터들은 대상의 적들로부터 멀리 도망치며, 최대한 많은 벽과 문을 사이에 두려고 합니다. 하지만 고통의 충격은 이 효과를 중단시킵니다.\n\n공포 효과의 남은 턴: %s.

actors.buffs.toxicimbue.name=맹독과 동화함
actors.buffs.toxicimbue.desc=당신은 독성 에너지와 하나가 되었습니다!\n\n당신이 움직일 때마다 적들을 중독시키는 독가스가 피어오릅니다. 당신은 효과가 끝날 때까지, 그리고 효과가 끝나고 나서도 몇 턴 동안 독가스와 맹독 효과에 면역이 됩니다.\n\n맹독과 동화됨 효과의 남은 턴: %s.

actors.buffs.corrosion.name=부식
actors.buffs.corrosion.heromsg=당신의 몸이 녹고 있다!
actors.buffs.corrosion.ondeath=당신은 녹아버렸다...
actors.buffs.corrosion.rankings_desc=산성에 의해 녹아버림
actors.buffs.corrosion.desc=강력한 산은 살, 금속, 그리고 뼈 등등을 빠르게 녹여 버립니다.\n\n대상이 계속 녹아 내림에 따라 부식 피해가 증가합니다.\n\n부식 효과의 남은 턴: %1$s.\n현재 부식 피해: %2$d.

actors.buffs.vertigo.name=현기증
actors.buffs.vertigo.desc=온 세상이 빙빙 돌아가며 일직선으로 걷기조차 힘들어집니다.\n\n현기증 효과를 받는 동안 움직이려는 캐릭터는 의도한 방향 대신 무작위 방향으로 움직이게 됩니다.\n\n현기증 효과의 남은 턴: %s.

actors.buffs.wandempower.name=마법 막대 강화
actors.buffs.wandempower.desc=피해를 주는 마법 막대에 힘이 깃들어, 몇 번의 발사 동안 공격의 피해량이 증가합니다.\n\n추가 피해량: %1$d.\n남은 타격 횟수: %2$d.

actors.buffs.weakness.name=약화
actors.buffs.weakness.heromsg=당신은 약해진 기분이 든다!
actors.buffs.weakness.desc=모든 것이 갑작스레 훨씬 무겁게 느껴집니다.\n\n약화 마법은 대상의 물리적 힘을 약화시켜, 주는 피해량을 33%% 줄입니다.\n\n약화 효과의 남은 턴: %s.

actors.buffs.wellfed.name=배부름
actors.buffs.wellfed.desc=당신은 매우 배부르며, 만족감을 느끼고 있습니다.\n\n배부른 상태에서, 당신은 허기가 지지 않으며, 일정 시간 동안 체력을 추가로 회복합니다.\n\n남은 턴: %d.



###hero

##abilities
actors.hero.abilities.armorability.self_target=당신은 스스로를 겨냥할 수 없다!
actors.hero.abilities.armorability.no_target=지정할 대상이 없다!
actors.hero.abilities.armorability.prompt=목표 지점을 선택하세요
actors.hero.abilities.armorability.cost=충전 소모량: _%d_

actors.hero.abilities.warrior.heroicleap.name=영웅의 도약
actors.hero.abilities.warrior.heroicleap.prompt=도약할 지역을 선택하세요
actors.hero.abilities.warrior.heroicleap.short_desc=전사는 지정한 장소에 _영웅의 도약_을 사용하여 적들과 위험 요소를 뛰어넘을 수 있습니다.
actors.hero.abilities.warrior.heroicleap.desc=전사는 대상 지역으로 도약하며, 경로 상의 모든 적과 위협 요소를 뛰어 넘습니다.  하지만 벽이나 다른 단단한 지형을 뛰어넘지는 못합니다.
actors.hero.abilities.warrior.shockwave.name=충격파
actors.hero.abilities.warrior.shockwave.short_desc=전사는 땅을 내리쳐 부채꼴 모양의 범위에 _충격파_ 를 발산할 수 있습니다. 충격파에 휘말린 적들은 피해를 입고 불구가 됩니다.
actors.hero.abilities.warrior.shockwave.desc=전사가 땅을 내려쳐, 반지름 5칸의 60도 부채꼴 모양 범위에 충격파를 일으킵니다.\n\n충격파에 휩쓸린 적들은 5턴간 불구 상태가 되며, 5-10의 피해를 받습니다. 추가로 전사가 10을 초과한 힘 수치당 1-2의 추가 피해를 받습니다.
actors.hero.abilities.warrior.endure.name=인내
actors.hero.abilities.warrior.endure$enduretracker.name=인내력
actors.hero.abilities.warrior.endure$enduretracker.desc=전사는 이제 그가 견뎌낸 피해에 비례한 추가 피해를 입힐 수 있습니다.\n\n추가 피해량: %1$d\n남은 공격 횟수:%2$d
actors.hero.abilities.warrior.endure.short_desc=전사는 _인내_하여 몇 턴을 보내는 대신 높은 피해 저항력을 얻습니다. 그리고 나서 그가 견뎌낸 피해에 비례한 추가 피해를 입힙니다.
actors.hero.abilities.warrior.endure.desc=전사가 3턴 동안 인내하여, 모든 피해를 절반으로 줄입니다. 이 효과는 방어력 등에 의한 피해 경감에 앞서 적용됩니다.\n\n인내가 끝난 후 10턴 내에 전사가 공격에 성공하면, 인내하는 동안 받은 모든 공격의 경감 전 피해량의 총합의 절반만큼을 추가로 입힙니다!\n\n연속 타격을 쌓아 놓은 상태일 경우, 이 능력을 사용하면 연속 타격의 지속 시간이 3턴 연장됩니다.

actors.hero.abilities.mage.elementalblast.name=원소 폭발
actors.hero.abilities.mage.elementalblast.no_staff=지팡이가 없으면 이 능력을 사용할 수 없다.
actors.hero.abilities.mage.elementalblast.short_desc=마법사는 자신의 지팡이에서 _원소 폭발_을 일으켜 자신 주변의 넓은 공간을 지팡이에 융합한 마법 막대에 따른 효과로 뒤덮습니다.
actors.hero.abilities.mage.elementalblast.desc=마법사는 반지름 4칸의 원형 범위에 마법 폭발을 일으켜 최대 15-25의 피해를 입힙니다. 원소 폭발의 특수 효과는 마법사의 지팡이에 융합된 마법 막대의 종류에 따라 달라집니다.
actors.hero.abilities.mage.elementalblast.generic_desc=원소 폭발의 특수 효과는 해당 마법 막대를 적이나 아군에게 사용했을 때의 효과와 비슷합니다.
actors.hero.abilities.mage.wildmagic.name=격렬한 마법
actors.hero.abilities.mage.wildmagic.no_wands=발사할 마법 막대가 없다!
actors.hero.abilities.mage.wildmagic.short_desc=마법사는 그가 가지고 있는 마법 막대들에 깃든 _격렬한 마법_을 해방하여 한 턴만에 대상에게 무작위의 마법을 여러 발 발사합니다.
actors.hero.abilities.mage.wildmagic.desc=마법사는 그가 가진 마법 막대들의 힘을 해방하여 그 마법을 한 턴에 최대 4번까지 무작위로 발사할 수 있습니다. 마법사의 지팡이는 이 효과에 해당하지 않습니다. \n\n발사 중인 마법 막대는 +2만큼 강화되며, 최대 +3까지 강화됩니다. 이 능력으로 발사된 마법 막대는 절반의 충전량을 소모하며, 각각의 마법 막대는 최대 두 번까지만 발사됩니다.
actors.hero.abilities.mage.warpbeacon.name=순간이동 신호기
actors.hero.abilities.mage.warpbeacon.depths=층을 넘어서 순간이동을 할 수는 없다!
actors.hero.abilities.mage.warpbeacon.locked_floor=잠겨 있는 층을 벗어날 수는 없다!
actors.hero.abilities.mage.warpbeacon.too_far=그 위치는 너무 멀다!
actors.hero.abilities.mage.warpbeacon.invalid_beacon=거기에는 신호기를 설치할 수 없다!
actors.hero.abilities.mage.warpbeacon.window_desc=당신의 신호기는 현재 %d층에 설치되어 있습니다.
actors.hero.abilities.mage.warpbeacon.window_tele=이동한다
actors.hero.abilities.mage.warpbeacon.window_clear=제거한다
actors.hero.abilities.mage.warpbeacon.window_cancel=취소
actors.hero.abilities.mage.warpbeacon.short_desc=마법사는 _순간이동 신호기_를 현재 위치에 설치하고, 해당 위치로 즉시 순간이동하여 돌아갈 수 있습니다.
actors.hero.abilities.mage.warpbeacon.desc=마법사는 신호기를 설치하여, 언제든지 순간이동하여 돌아갈 수 있습니다. 신호기를 설치하는 데에는 1턴을 사용하지만 순간이동은 즉시 이루어집니다.\n\n마법사는 기본적으로 층을 넘어서 순간이동할 수 없으며, 잠긴 방처럼 접근할 수 없는 곳에 가기 위하여 신호기를 사용할 수 없습니다. 마법사는 적이 있는 곳으로 순간이동할 수 있으며, 이 경우 적을 밀쳐냅니다.

actors.hero.abilities.rogue.smokebomb.name=연막탄
actors.hero.abilities.rogue.smokebomb.fov=시야 안의 빈 공간으로만 이동할 수 있다.
actors.hero.abilities.rogue.smokebomb.prompt=이동할 지역을 선택하세요
actors.hero.abilities.rogue.smokebomb$ninjalog.name=통나무 미끼
actors.hero.abilities.rogue.smokebomb$ninjalog.desc=이유는 모르겠지만 적들은 이 통나무를 진짜 도적이라고 생각하는 것 같다!
actors.hero.abilities.rogue.smokebomb$ninjalog.discover_hint=이 캐릭터는 특정한 갑옷 능력의 효과로 등장합니다.
actors.hero.abilities.rogue.smokebomb.short_desc=도적은 점멸과 동시에 _연막탄_을 던져 점멸 전 위치 부근의 적들을 실명시킵니다.
actors.hero.abilities.rogue.smokebomb.desc=도적은 연막탄을 던지면서 최대 6칸 거리의 위치로 순간이동합니다. 도적은 순간이동할 때 적들과 위험 요소를 가로지를 수 있지만, 벽처럼 단단한 지형은 넘을 수 없습니다.\n\n도적의 순간이동 전 위치에 인접해 있던 적들은 5턴 동안 실명합니다.
actors.hero.abilities.rogue.deathmark.name=죽음의 표식
actors.hero.abilities.rogue.deathmark.ally_target=당신은 적들에게만 표식을 새길 수 있다.
actors.hero.abilities.rogue.deathmark.short_desc=도적은 _죽음의 표식_을 지정한 적에게 새길 수 있습니다. 표식이 새겨진 적은 추가 피해를 입지만, 표식이 사라지기 전까지는 죽지 않습니다.
actors.hero.abilities.rogue.deathmark.desc=도적은 지정한 적에게 표식을 새겨 25%의 추가 피해를 받게 합니다. 표식은 즉시 새길 수 있으며 5턴 동안 유지됩니다.\n\n표식이 새겨진 적은 추가 피해를 받지만 표식이 사라지기 전까지 죽지 않습니다. 적의 표식이 사라질 때 체력이 0이라면 그 적은 즉시 죽습니다.
actors.hero.abilities.rogue.deathmark$deathmarktracker.name=죽음의 표식
actors.hero.abilities.rogue.deathmark$deathmarktracker.desc=이 적은 표식이 새겨져 있어 25%%의 추가 피해를 받지만, 표식이 사라지기 전까지는 절대 죽지 않습니다.\n\n남은 턴: %s
actors.hero.abilities.rogue.shadowclone.name=그림자 분신
actors.hero.abilities.rogue.shadowclone.short_desc=도적은 _그림자 분신_을 소환해, 전투를 돕도록 지시할 수 있습니다.
actors.hero.abilities.rogue.shadowclone.desc=도적은 자신을 흉내내는 그림자를 소환해, 전투를 돕도록 지시할 수 있습니다. 그림자 분신에게 지시를 내리는 행동은 충전량을 소모하지 않습니다.\n\n분신은 80 체력을 가지고 있고, 방어력은 없으며, 10-20의 피해를 입힙니다. 특성을 통해 영웅이 가진 장비의 효과를 얻는 등의 방식으로 분신을 강화할 수 있습니다.
actors.hero.abilities.rogue.shadowclone$shadowally.name=도적의 그림자 분신
actors.hero.abilities.rogue.shadowclone$shadowally.direct_defend=분신이 해당 방향으로 이동했다.
actors.hero.abilities.rogue.shadowclone$shadowally.direct_follow=분신이 당신을 따라오고 있다.
actors.hero.abilities.rogue.shadowclone$shadowally.direct_attack=분신이 공격하기 위해 움직이고 있다!
actors.hero.abilities.rogue.shadowclone$shadowally.desc=어둠의 그림자로 만들어진, 도적의 분신입니다. 공허한 눈을 가지고 가만히 서 있으며, 작은 어둠의 불꽃이 증기처럼 피어오르고 있습니다. \n\n이 분신은 도적의 완벽한 복제는 아니지만 여전히 훌륭한 투사이며, 적절한 특성을 갖춘 도적의 장비에 따른 이점을 얻을 수 있습니다.
actors.hero.abilities.rogue.shadowclone$shadowally.discover_hint=이 캐릭터는 특정한 갑옷 능력의 효과로 등장합니다.

actors.hero.abilities.huntress.spectralblades.name=유령 칼날
actors.hero.abilities.huntress.spectralblades.short_desc=사냥꾼은 지정한 대상에게 _유령 칼날_을 던져 현재 착용하고 있는 근접 무기의 위력에 비례한 피해를 줍니다.
actors.hero.abilities.huntress.spectralblades.desc=사냥꾼은 근접 무기를 원거리 무기처럼 발사하는 유령 칼날을 적에게 던질 수 있습니다. 부여된 마법을 포함한 근접 무기의 적중 효과가 모두 발동할 수 있습니다.
actors.hero.abilities.huntress.naturespower.name=자연의 힘
actors.hero.abilities.huntress.naturespower.short_desc=사냥꾼은 _자연의 힘_을 불러모아 짧은 시간 동안 이동 속도와 영혼의 활의 발사 속도를 증가시킬 수 있습니다.
actors.hero.abilities.huntress.naturespower.desc=사냥꾼이 일시적으로 자연의 힘을 받아 영혼의 활과 스스로를 강화했습니다! 이 효과는 8 턴 동안 지속됩니다.\n\n지속 시간동안 사냥꾼은 두 배의 속도로 이동하며 활을 33% 더 빠르게 발사할 수 있습니다. 활의 추가 공격 속도는 저격수의 특수 공격에 적용되지 않습니다.
actors.hero.abilities.huntress.naturespower$naturespowertracker.name=자연의 힘
actors.hero.abilities.huntress.naturespower$naturespowertracker.desc=사냥꾼이 잠시 힘을 받아, 이동 속도와 활을 이용한 공격 속도가 증가합니다.\n\n남은 턴: %s.
actors.hero.abilities.huntress.spirithawk.name=영혼의 매
actors.hero.abilities.huntress.spirithawk.no_space=당신 주변에 빈 공간이 없다.
actors.hero.abilities.huntress.spirithawk.short_desc=사냥꾼은 동료인 _영혼의 매_를 소환하여 주변을 정찰하고 적의 주의를 다른 곳으로 돌릴 수 있습니다.
actors.hero.abilities.huntress.spirithawk.desc=사냥꾼은 동료인 영혼의 매를 소환할 수 있습니다. 매가 소환되어 있는 동안, 능력을 다시 사용하여 지시를 내릴 수 있습니다. 매는 100턴 동안 함께하며, 지시는 따로 충전량을 소모하지 않습니다.\n\n매는 매우 약한 체력과 공격력을 가졌지만 재빠르고 날렵하며 정확합니다. 매는 항상 사냥꾼과 시야 전체를 공유하며, 독가스 등 모든 지형 효과에 면역입니다. 매는 공격 지시를 받기 전에는 적을 공격하지 않습니다.
actors.hero.abilities.huntress.spirithawk$hawkally.name=영혼의 매
actors.hero.abilities.huntress.spirithawk$hawkally.direct_defend=매가 해당 위치로 이동했다.
actors.hero.abilities.huntress.spirithawk$hawkally.direct_follow=매가 당신을 따라오고 있다.
actors.hero.abilities.huntress.spirithawk$hawkally.direct_attack=매가 공격하기 위해 움직이고 있다!
actors.hero.abilities.huntress.spirithawk$hawkally.desc=사냥꾼이 소환한 마법의 매입니다. 영적인 밝은 푸른 빛을 발하고 있으며, 고개를 여기저기 돌려가며 지역을 정찰하고 있습니다.\n\n훌륭한 싸움꾼은 아니지만, 매의 날렵함과 넓은 시야는 정찰과 교란에 안성맞춤입니다.
actors.hero.abilities.huntress.spirithawk$hawkally.desc_remaining=남은 턴: %d.
actors.hero.abilities.huntress.spirithawk$hawkally.desc_dodges=남은 확정 회피 횟수: %d.
actors.hero.abilities.huntress.spirithawk$hawkally.discover_hint=이 캐릭터는 특정한 갑옷 능력의 효과로 등장합니다.

actors.hero.abilities.duelist.challenge.name=결투
actors.hero.abilities.duelist.challenge.prompt=결투할 적을 선택하세요
actors.hero.abilities.duelist.challenge.already_dueling=당신은 이미 결투 중이다.
actors.hero.abilities.duelist.challenge.ally_target=적에게만 결투를 신청할 수 있다.
actors.hero.abilities.duelist.challenge.unreachable_target=결투를 신청하려면 대상에게 도달할 수 있어야 한다.
actors.hero.abilities.duelist.challenge.distant_target=그 적은 결투하기에는 너무 멀리 있다.
actors.hero.abilities.duelist.challenge.short_desc=결투자는 근처의 적에게 _결투_를 신청해 다른 모든 적들을 일시적으로 얼립니다.
actors.hero.abilities.duelist.challenge.desc=결투자는 근처의 적에게 결투를 신청합니다. 그 적은 다른 모든 적의 시간이 멈춘 사이 결투자와 싸워야 합니다.\n\n대상은 결투자와 5타일 거리 이내의 도달 가능한 위치에 있어야 합니다. 결투는 10턴이 지나거나, 적이 죽거나, 결투자와 적의 거리가 5타일보다 멀어질 때까지 이어집니다.\n\n시간이 멈춘 다른 적들은 어떤 피해도 받지 않습니다. 결투자의 아군들은 영향을 받지 않지만, 보스와 결투할 경우 보스가 불러낸 부하도 영향을 받지 않습니다.
actors.hero.abilities.duelist.challenge$duelparticipant.name=결투 대상
actors.hero.abilities.duelist.challenge$duelparticipant.desc=이 대상은 결투에 참여하고 있습니다. 다른 모든 적이 얼어붙은 사이 대상과 대상의 아군 내지는 부하들만이 정상적으로 행동할 수 있습니다.\n\n결투는 정해진 시간이 다하거나 참가자 하나가 죽거나 서로의 거리가 5타일보다 더 멀어질 때까지 이어집니다.\n\n남은 턴: %d.
actors.hero.abilities.duelist.elementalstrike.name=원소 해방
actors.hero.abilities.duelist.elementalstrike.short_desc=결투자는 _원소 해방_을 사용해 부채꼴 모양 범위에 무기 마법에 기반한 효과를 방출합니다.
actors.hero.abilities.duelist.elementalstrike.desc=결투자가 적이나 특정 위치를 타격하여 반드시 명중하는 일반 공격을 하고 그 위치에서 퍼져나가는 반경 4타일, 65도 크기의 부채꼴 범위에 마법 효과를 방출합니다. 마법 효과는 결투자가 들고 있는 주 무기에 부여된 마법에 기반합니다.
actors.hero.abilities.duelist.elementalstrike.generic_desc=마법이 없는 무기로 원소를 해방하면 작은 마력 폭발을 일으켜 범위 내에 있는 모든 적에게 6-12의 피해를 입힙니다.
actors.hero.abilities.duelist.feint.name=눈속임
actors.hero.abilities.duelist.feint.prompt=이동할 지역을 선택하세요
actors.hero.abilities.duelist.feint.too_far=그 위치는 당신과 근접한 곳이 아니다.
actors.hero.abilities.duelist.feint.bad_location=그 곳으로 이동할 수 없다.
actors.hero.abilities.duelist.feint.short_desc=결투자는 _눈속임_을 사용해, 근처 1칸으로 이동함과 동시에 받는 공격을 속일 수 있습니다. 적들은 잔상을 공격하며, 그로 인해 반격에 노출됩니다.
actors.hero.abilities.duelist.feint.desc=결투자는 근처 1칸으로 이동함과 동시에 순간적인 잔상을 남겨 적들의 공격을 속일 수 있습니다. 결투자를 공격하던 적들은 대신 잔상을 공격하게 됩니다.\n\n잔상을 공격한 적들은 혼란스러워하며, 다음 행동을 취소하고 기습에 취약해집니다.

actors.hero.abilities.cleric.ascendedform.name=승천자의 형상
actors.hero.abilities.cleric.ascendedform.short_desc=성직자가 _승천자의 형상_을 취하며, 새로운 주문을 얻고, 추가 공격 사거리와 방어막을 얻습니다.
actors.hero.abilities.cleric.ascendedform.desc=성직자가 내면으로부터 성스러운 에너지를 발하며, 10턴 동안 승천자의 모습을 취합니다. 이 동안 성직자는 새로운 주문을 얻고, 2의 공격 범위와 30의 방어막을 얻습니다. 또한 주문을 시전하면 사용한 성서의 충전량당 10의 방어막을얻습니다. \n\n형상 지속시간 동안 승천자의 형상과 주문으로 얻은 방어막은 줄어들지 않지만, 형상 지속시간이 다하면 방어막도 즉시 소실됩니다. 이 능력을 재시전하면 형상 지속시간을 갱신합니다.
actors.hero.abilities.cleric.ascendedform$ascendbuff.name=승천자의 형상
actors.hero.abilities.cleric.ascendedform$ascendbuff.desc=성직자의 몸에서 성스러운 에너지가 발현하고 있습니다. 이 형상을 취한 성직자는 (성스러운 에너지로 말미암아) 2의 공격 범위를 얻고, 사용한 성서 충전당 10의 방어막을 얻습니다. 또한 승천자의 형상 특성으로 얻은 주문을 시전할 수 있습니다.\n\n승천자의 형상 동안 얻은 방어막은 서서히 사라지지 않지만, 형상 지속시간이 종료되면 즉시 소실됩니다.\n\n현재 방어막: %1$d.\n남은 턴: %2$d.
actors.hero.abilities.cleric.trinity.name=삼위일체
actors.hero.abilities.cleric.trinity.no_imbue=현재 삼위일체에 아무런 효과를 지정하지 않았습니다. 주문을 시전하기 위해서는 먼저 아이템 효과를 지정해야 합니다!
actors.hero.abilities.cleric.trinity.no_duplicate=삼위일체는 현재 착용 중인 아이템의 효과를 불러올 수 없습니다!
actors.hero.abilities.cleric.trinity.ench_glyph_use=삼위일체가 이 효과를 _%1$d 턴_ 동안 얻으며 _갑옷 충전량을 %2$s_ 소모합니다.
actors.hero.abilities.cleric.trinity.rare_ench_glyph_use=삼위일체가 이 강력한 효과를 _%1$d 턴_ 동안 얻으며 _갑옷 충전량을 %2$s_ 소모합니다.
actors.hero.abilities.cleric.trinity.wand_use=삼위일체가 이 마법 막대를 _+%1$d 강화 효율_로 발사하며 _갑옷 충전량을 %2$s_ 소모합니다.
actors.hero.abilities.cleric.trinity.wand_multi_use=삼위일체가 이 _여러 번 발사 가능한_ 마법 막대를 _+%1$d 강화 효율_로 발사하며 _갑옷 충전량을 %2$s_ 소모합니다.
actors.hero.abilities.cleric.trinity.thrown_use=삼위일체가 이 투척 무기를 _+%1$d 강화 효율_로 투척하며 _갑옷 충전량을 %2$s_ 소모합니다.
actors.hero.abilities.cleric.trinity.ring_use=삼위일체가 이 반지의 효과를 20턴 동안 _+%1$d 강화 효율로_ 얻으며 _갑옷 충전량을 %2$s_ 소모합니다.
actors.hero.abilities.cleric.trinity.alchemiststoolkit_use=삼위일체가 이 유물의 원격 연금술 효과를 사용하며, _갑옷 충전량을 %2$s_ 소모합니다.
actors.hero.abilities.cleric.trinity.chaliceofblood_use=삼위일체가 이 유물의 체력 재생 효과를 20턴 동안 _+%1$d 강화 효율로_ 얻으며, _갑옷 충전량을 %2$s_ 소모합니다.
actors.hero.abilities.cleric.trinity.driedrose_use=삼위일체가 이 유물의 효과로 타락한 아군 망령을 슬픈 유령의_+%1$d 강화시_ 최대 체력으로 소환하며, _갑옷 충전량을 %2$s 소모합니다.
actors.hero.abilities.cleric.trinity.etherealchains_use=삼위일체가 이 유물의 사슬 발사 효과를 _+%1$d 강화_시 최대 거리만큼 발사하며, _갑옷 충전량을 %2$s_ 소모합니다.
actors.hero.abilities.cleric.trinity.hornofplenty_use=삼위일체가 이 유물의 간식 먹기 효과를 발동하며, _갑옷 충전량을 %2$s_ 소모합니다.
actors.hero.abilities.cleric.trinity.masterthievesarmband_use=삼위일체가 이 유물의 적 전리품 훔치기 효과를 _+%1$d 강화 효율로_ 발동하며, _갑옷 충전량을 %2$s_ 소모합니다.
actors.hero.abilities.cleric.trinity.sandalsofnature_use=삼위일체가 이 유물의 적 속박 효과를 무작위 해로운 씨앗과 함께 발동하며, _갑옷 충전량을 %2$s_ 소모합니다.
actors.hero.abilities.cleric.trinity.skeletonkey_use=삼위일체가 이 유물의 삽입 효과를 발동하며, _갑옷 충전량을 %2$s_ 소모합니다.
actors.hero.abilities.cleric.trinity.talismanofforesight_use=삼위일체가 이 유물의 탐색 효과를 _+%1$d 강화 효율_로 발동하며, _갑옷 충전량을 %2$s_ 소모합니다.
actors.hero.abilities.cleric.trinity.timekeepershourglass_use=삼위일체가 이 유물의 시간 정지 효과를 _%1$d_턴 동안 발동하며, _갑옷 충전량을 %2$s_ 소모합니다.
actors.hero.abilities.cleric.trinity.unstablespellbook_use=삼위일체가 이 유물의 무작위 주문서 효과를 발동하며, _%1$d/10_ 확률로 추가 비용 없이 신비한 효과를 발동합니다. 또한 _갑옷 충전량을 %2$s_ 소모합니다.
actors.hero.abilities.cleric.trinity.cost=이 능력의 충전량 소모량은 때에 따라 다르지만, 보통은 _%d_ 충전량을 소모합니다.
actors.hero.abilities.cleric.trinity.short_desc=성직자가 _삼위일체_ 능력을 얻어, 지금까지 감정한 장비들의 효과를 발동할 수 있습니다. 또한 새로운 주문을 시전하여 복제할 장비의 효과를 교체할 수 있습니다.
actors.hero.abilities.cleric.trinity.desc=성직자가 갑옷 능력으로 _삼위일체_를 얻습니다. 이 주문들은 세 가지 종류로 나뉘어지며, 이번 게임에서 감정한 장비의 효과를 복제하여 사용합니다. 삼위일체 주문은 성체(무기와 갑옷), 성심(마법 막대와 투척 무기), 그리고 성령(반지와 유물)의 세 종류로 제공됩니다.\n\n세 삼위일체 형상은 각각 하나씩의 효과만을 복제할 수 있으며, 성직자가 삼위일체 시전 시 원하는 효과를 고를 수 있습니다. 또한 이미 착용 중인 장비의 효과는 복제할 수 없습니다.
actors.hero.abilities.cleric.trinity$wndusetrinity.text=시전할 삼위일체 형상을 선택하세요. 서로 다른 삼위일체 형상을 동시에 발동할 수 있습니다.
actors.hero.abilities.cleric.trinity$wndusetrinity.body=_성체 형상: %s._
actors.hero.abilities.cleric.trinity$wndusetrinity.mind=_성심 형상: %s._
actors.hero.abilities.cleric.trinity$wndusetrinity.spirit=_성령 형상: %s._
actors.hero.abilities.cleric.trinity$wnditemtypeselect.text=삼위일체에 등록된 효과를 선택하세요. 사용 확인 창에서 추가 정보를 확인할 수 있습니다.
actors.hero.abilities.cleric.trinity$wnditemconfirm.body=성체 형상에 등록
actors.hero.abilities.cleric.trinity$wnditemconfirm.mind=성심 형상에 등록
actors.hero.abilities.cleric.trinity$wnditemconfirm.spirit=성령 형상에 등록
actors.hero.abilities.cleric.powerofmany.name=집단의 힘
actors.hero.abilities.cleric.powerofmany.prompt_default=아군 또는 위치를 선택
actors.hero.abilities.cleric.powerofmany.prompt_ally=빛의 아군 행동 선택
actors.hero.abilities.cleric.powerofmany.ally_exists=이미 강화된 아군이 있습니다.
actors.hero.abilities.cleric.powerofmany.no_vision=볼 수 없는 위치를 지정할 수 없습니다.
actors.hero.abilities.cleric.powerofmany.only_allies=아군만 강화할 수 있습니다.
actors.hero.abilities.cleric.powerofmany.short_desc=성직자가 _집단의 힘_을 불러내어, 현재 있는 아군을 강화하거나, 새로운 아군을 불러옵니다.
actors.hero.abilities.cleric.powerofmany.desc=성직자가 _집단의 힘_을 불러내어, 100턴 동안 아군을 강화하거나, 새로운 강화된 아군을 소환합니다. 빈 위치를 지정하면 아군을 소환합니다.\n\n집단의 힘으로 강화된 아군은 +25% 추가 피해를 입히고, 받는 피해가 -25% 감소하며, 성직자와 시야를 공유합니다. 또한 능력을 시전 시 아군이 25의 방어막을 얻습니다.\n\n성직자는 또한 강화된 아군에게 시전 할 수 있는 세 가지 주문을 얻습니다. 이 주문이 지속되는 동안 집단의 힘이 끝나지 않습니다.
actors.hero.abilities.cleric.powerofmany$powerbuff.name=집단의 힘
actors.hero.abilities.cleric.powerofmany$powerbuff.desc=이 아군은 집단의 힘으로 강화되어, 주는 피해가 +25%% 증가하고, 입는 피해가 -25%% 감소합니다. 또한 성직자와 시야를 공유하며, 집단의 힘 주문의 효과를 받을 수 있습니다.\n\n집단의 힘은 프리즈마 거울상 같은 사라지는 아군에게도 계속 적용되지만, 지속시간 또한 정지되지 않습니다.\n\n남은 턴:%s.
actors.hero.abilities.cleric.powerofmany$lightally.name=빛의 동료
actors.hero.abilities.cleric.powerofmany$lightally.direct_defend=아군이 해당 위치로 이동합니다.
actors.hero.abilities.cleric.powerofmany$lightally.direct_follow=아군이 당신을 따라옵니다.
actors.hero.abilities.cleric.powerofmany$lightally.direct_attack=아군이 적을 공격합니다!
actors.hero.abilities.cleric.powerofmany$lightally.desc=성직자의 모험가 동료의 형상을 빌려 빛으로 만들어진 형상입니다. 모습은 다른 영웅을 닮았지만, 고유 능력을 사용할 수 없습니다. 이 아군은 집단의 힘이 유지되는 동안 계속 유지됩니다.\n\n이 아군은 집단의 힘 갑옷 능력을 사용하여 행동을 지정할 수 있습니다.
actors.hero.abilities.cleric.powerofmany$lightally.discover_hint=이 캐릭터는 특정한 갑옷 능력의 효과로 등장합니다.


actors.hero.abilities.ratmogrify.name=쥐 변이
actors.hero.abilities.ratmogrify.cant_transform=당신은 그것을 쥐로 만들 수 없다!
actors.hero.abilities.ratmogrify.too_strong=이 적은 쥐로 만들기엔 너무 강력하다!
actors.hero.abilities.ratmogrify.short_desc=영웅은 적을 잠깐 동안 아무런 능력이 없는 쥐로 바꾸는 _쥐 변이_를 사용할 수 있습니다!
actors.hero.abilities.ratmogrify.desc=영웅이 적 하나를 6턴 동안 쥐로 바꿉니다! 보스, 아군, 그리고 쥐는 쥐로 변이시킬 수 없습니다.\n\n쥐로 변이된 적은 원래의 능력치를 유지하지만 특수 능력을 모두 잃습니다.
actors.hero.abilities.ratmogrify$transmograt.name=쥐로 변한 %s
actors.hero.abilities.ratmogrify$transmograt.desc="이 적은 쥐로 바뀌었다. 내 생각에는 크나큰 발전이노라!" - 쥐 대왕
actors.hero.abilities.ratmogrify$transmograt.rankings_desc=쥐로 변한 적에게 사망

##Cleric Spells
actors.hero.spells.auraofprotection.name=보호의 오라
actors.hero.spells.auraofprotection.short_desc=성기사와 주변 아군의 방어력을 증폭시킴.
actors.hero.spells.auraofprotection.desc=성기사가 보호의 에너지를 발하는 빛나는 오라를 20턴 동안 둘렀습니다. 2타일 이내의 모든 아군(성기사 본인 포함)은 %1$d%%적은 피해를 입으며, 성기사가 착용한 갑옷의 상형문자의 위력이 +%2$d%% 증폭됩니다.\n\n이 주문의 피해 감소 효과는 다른 피해 감소 요인(방어력)보다 먼저 적용되며, 상형문자 위력 증폭 또한 항상 적용되지만, 여러 캐릭터가 동시에 상형문자의 효과를 받을 경우(성기사 본인 또는 프리즈마 거울상), 효과가 최대 한 번만 적용됩니다.
actors.hero.spells.auraofprotection$aurabuff.name=보호의 오라
actors.hero.spells.auraofprotection$aurabuff.desc=성기사가 본인 주변에 보호의 에너지를 발하고 있습니다.\n\n주변의 모든 아군(과 성기사 본인)은 감소된 피해를 입이며, 성기사가 착용 중인 갑옷의 상형문자 효과가 증폭됩니다.\n\n남은 턴: %s.

actors.hero.spells.beamingray.name=재배치 광선
actors.hero.spells.beamingray.no_space=해당 위치는 아군이 나타날 수 없다.
actors.hero.spells.beamingray.out_of_range=효과범위를 벗어났습니다.
actors.hero.spells.beamingray.short_desc=아군을 이동시키며 추가 피해를 제공함.
actors.hero.spells.beamingray.desc=성직자가 집단의 힘을 광선으로 빚어내어 대상 위치로 발사합니다. 광선이 적에게 적중하면 근처의 아군을 대상 적에게 이동시킵니다.\n\n광선은 최대 %1$d타일 거리까지 발사되며, 10턴 동안 4타일 내 내 가장 가까운 적에게 주는 피해가 +%2$d%% 증가합니다. 재배치 광선은 움직일 수 없는 아군 또한 이동시킬 수 있지만, 그럴 경우 사거리가 절반으로 감소합니다.
actors.hero.spells.beamingray$beamingrayboost.name=재배치 광선
actors.hero.spells.beamingray$beamingrayboost.desc=이 아군은 최근에 재배치 광선으로 이동하였으며, 순간이동 후 근처 적에게 입히는 피해가 증가하였습니다. 이 효과가 지속되는 동안 집단의 힘이 끝나지 않습니다.\n\n남은 턴: %s.

actors.hero.spells.blessspell.name=축복
actors.hero.spells.blessspell.short_desc=자신을 축복하고 방어막 부여, 타인을 축복하고 회복.
actors.hero.spells.blessspell.desc=성직자가 자신 또는 시야에 들어온 캐릭터를 축복합니다.\n\n스스로를 축복할 경우 효과가 약해져, %1$d턴의 축복과 %2$d의 방어막을 얻습니다.\n\n다른 캐릭터를 대상으로 할 경우 효과가 더 강해져, %3$d턴의 축복과 %4$d턴의 치유 효과를 줍니다. 초과 치유량은 방어막으로 전환됩니다.

actors.hero.spells.bodyform.name=성체 형상
actors.hero.spells.bodyform.short_desc=삼위일체로 이전 마법 부여 또는 상형문자를 불러냄
actors.hero.spells.bodyform.desc=성직자가 이번 게임에서 식별한 무기 마법 부여 또는 방어구 상형문자를 삼위일체에 불러내어 그 효과를 다시 누릴 수 있습니다.\n\n성직자는 삼위일체를 시전하여 선택한 마법 부여 또는 상형문자의 효과를 %d 턴 동안 얻습니다. 이렇게 불러낸 효과는 기존 마법 부여 또는 상형문자의 효과와 동일하게 작동합니다.\n\n이 주문은 현재 삼위일체로 불러낸 다른 성체 효과를 덮어씁니다.
actors.hero.spells.bodyform$bodyformbuff.name=성체 형상
actors.hero.spells.bodyform$bodyformbuff.desc=현재 삼위일체의 성체 형상이 무기의 마법 또는 상형문자의 효과를 해당 장비를 착용하고 있는 것처럼 제공하고 있습니다.\n\n성체 형상은 현재 장착 중인 장비의 효과를 제공하지 않음에 주의하십시오.\n\n현재 효과: %1$s.\n\n남은 턴: %2$s.

actors.hero.spells.cleanse.name=정화
actors.hero.spells.cleanse.short_desc=디버프를 정화하고 방어막을 얻음.
actors.hero.spells.cleanse.desc=성직자가 자신과 시야 내 아군들의 모든 해로운 효과를 제거합니다. 주문이 끝난 후 영향을 받은 대상은 %1$d턴의 디버프 면역과 %2$d의 방어막을 얻습니다.

actors.hero.spells.clericspell.prompt=대상을 선택하세요
actors.hero.spells.clericspell.no_target=대상이 없다.
actors.hero.spells.clericspell.invalid_target=해당 지역을 목표로 할 수 없다.
actors.hero.spells.clericspell.invalid_enemy=그 적을 대상으로 할 수 없다.
actors.hero.spells.clericspell.charge_cost=충전 소모량: %d

actors.hero.spells.divinesense.name=신성한 감각
actors.hero.spells.divinesense.short_desc=잠시 동안 넓은 지역에 심안을 얻음.
actors.hero.spells.divinesense.desc=성직자가 주변에 감각을 집중하여, %d타일 범위에 50턴 동안 심안 효과를 얻습니다. 이 주문은 턴 소모 없이 시전할 수 있습니다.
actors.hero.spells.divinesense$divinesensetracker.name=신성한 감각
actors.hero.spells.divinesense$divinesensetracker.desc=이 캐릭터는 마음의 눈으로 주변의 존재들을 볼 수 있게 되었습니다!\n\n남은 턴: %s.

actors.hero.spells.divineintervention.name=신성한 개입
actors.hero.spells.divineintervention.short_desc=성직자와 아군에게 대량의 방어막 부여.
actors.hero.spells.divineintervention.desc=성직자가 성서에서 엄청난 힘을 끌어내어, 자신과 아군에게%1$d의 방어막을 부여하고 승천자의 형상 지속시간을 %2$d 증가시킵니다. 이 주문은 소모 충전량이 매우 높은 대신 강력한 방어 성능을 가집니다.\n\n승천자의 형상 도중 얻는 방어막처럼 이 방어막 또한 점차 감소하지 않으나, 형상 종료 시 즉시 소실됩니다.

actors.hero.spells.flash.name=섬광
actors.hero.spells.flash.prompt=위치를 선택하세요
actors.hero.spells.flash.short_desc=근처 위치로 순간이동.
actors.hero.spells.flash.desc=성직자가 승천자의 형상을 이끌어 해당 지역으로 순간이동합니다. 섬광은 다른 대상이 없는 범위 내 어떤 지역으로도 이동할 수 있습니다. 이 주문은 재시전 시 같은 형상 지속시간 동안 더 많은 성서 충전을 사용합니다.

actors.hero.spells.guidinglight.name=인도하는 빛
actors.hero.spells.guidinglight.short_desc=원거리 마법 피해를 입히며 다음 공격이 반드시 적중.
actors.hero.spells.guidinglight.desc=성직자가 마법 에너지를 발사해 대상에게 2-8 피해를 입히고 발광시킵니다. 발광하는 적에게 하는 힘 제한을 충족하는 무기의 다음 물리 공격은 반드시 적중합니다.
actors.hero.spells.guidinglight.desc_priest=_이 주문은 사제가 시전 시 더 강력해집니다._ 50턴마다 시전하는 인도하는 빛이 성서 충전을 소모하지 않으며, 발광이 광휘, 다른 아군 및 마법 막대와 적을 지정하는 몇몇 유물로 소모가 가능합니다. 이 방법으로 발광을 소모할 경우 사제의 레벨과 동일한 추가 마법 피해를 줍니다.
actors.hero.spells.guidinglight$guidinglightpriestcooldown.name=인도하는 빛
actors.hero.spells.guidinglight$guidinglightpriestcooldown.desc=사제는 인도하는 빛을 50턴마다 충전 소모 없이 사용할 수 있습니다.\n\n남은 턴: %s.
actors.hero.spells.guidinglight$illuminated.name=발광
actors.hero.spells.guidinglight$illuminated.desc=이 캐릭터는 인도하는 빛에 적중하여 발광하고 있습니다. 주변을 밝힐 정도로 밝게 빛나고 있지는 않지만, 모종의 마법을 발휘하여 성직자가 공격을 맞추기 훨씬 쉬워졌습니다.
actors.hero.spells.guidinglight$illuminated.desc_priest=사제는 또한 발광을 광휘, 마법 막대 발사, 아군의 공격, 또는 유물의 효과로 소모할 수 있습니다. 이 방법으로 발광을 소모하면 사제의 레벨 + 5의 추가 마법 피해를 입힙니다.
actors.hero.spells.guidinglight$illuminated.desc_generic=다른 영웅들 또한 발광으로 타오르는 빛 특성의 효과를 발동할 수 있지만, 추가 명중률은 얻지 못합니다.

actors.hero.spells.hallowedground.name=축성의 땅
actors.hero.spells.hallowedground.prompt=위치를 선택하세요
actors.hero.spells.hallowedground.short_desc=범위 내 아군을 치유, 적을 둔화, 잔디를 생성시킴.
actors.hero.spells.hallowedground.desc=사제가 근처의 땅에 신성한 마법을 주입하여, %1$dx%1$d 범위의 땅을 20턴 동안 축성합니다.\n\n시전 시, 범위 내 모든 아군을 15만큼 치유하며 (최대 체력인 경우 방어막을 부여), 적을 잠시 속박하며, 짧은 풀을 퍼트립니다.\n\n축성된 땅은 매 턴 아군을 1만큼 치유하며 (최대 체력인 경우 방어막을 부여), 적들을 불구로 만들고, 무작위로 긴 풀이 자라나게 합니다.\n\n축성된 땅에 불이 붙으면 파괴되며, 지속 회복 효과가 끝나거나 사제가 일정 기간 동안 경험치를 얻지 않으면 헤처나간 풀을 생성합니다.
actors.hero.spells.hallowedground$hallowedterrain.desc=이 땅은 축성되었습니다. 축성된 땅은 적을 둔화시키며, 아군을 치유하고, 풀이 자라나게 합니다.

actors.hero.spells.holyintuition.name=신성한 직감
actors.hero.spells.holyintuition.prompt=아이템을 선택하세요
actors.hero.spells.holyintuition.cursed=당신은 악의로 가득 찬 마법이 아이템에 깃들었음을 느낍니다.
actors.hero.spells.holyintuition.uncursed=이 아이템에는 악의적인 마법이 없습니다.
actors.hero.spells.holyintuition.short_desc=아이템의 저주 여부를 확인.
actors.hero.spells.holyintuition.desc=성직자가 아이템에 감각을 집중하여 착용하지 않고도 저주 유무를 확인할 수 있습니다.

actors.hero.spells.holylance.name=성창
actors.hero.spells.holylance.short_desc=막강한 원거리 마법 피해를 입힘.
actors.hero.spells.holylance.desc=사제가 다량의 에너지를 모아 거대한 빛의 창을 만들어 던집니다. 이 창은 %1$d-%2$d 피해를 입히며, 언데드나 악마 적에겐 반드시 최대 피해를 입힙니다.\n\n이 주문은 충전 소모가 매우 높으며, 30턴의 쿨다운이 있습니다.
actors.hero.spells.holylance$lancecooldown.name=성창 쿨다운
actors.hero.spells.holylance$lancecooldown.desc=사제가 최근에 성창을 시전했습니다. 다시 시전하기 전 까지 대기해야 합니다.\n\n남은 턴: %s.

actors.hero.spells.holyward.name=신성한 보호구
actors.hero.spells.holyward.glyph_name=빛의 %s
actors.hero.spells.holyward.glyph_desc=이 상형문자는 방어구가 막을 수 있는 피해량을 약간 증가시킵니다.
actors.hero.spells.holyward.short_desc=방어구에 일시적으로 피해 방어를 향상시키는 상형문자 부여.
actors.hero.spells.holyward.desc=성직자가 현재 착용 중인 방어구에 신성한 빛의 상형문자를 부여하여, 갑옷의 피해 방어를 1 증가시킵니다. 이 주문은 턴 소모 없이 시전할 수 있습니다.\n\n상형문자는 50턴 동안 지속되며, 지속시간 동안 다른 이로운 상형문자의 효과를 덮어씁니다. 성직자가 아무런 갑옷을 입지 않아도 이 효과는 사용할 수 있습니다.
actors.hero.spells.holyward.desc_paladin=_이 주문은 성기사가 시전 시 더 강력해집니다._ 추가 피해 방어가 3으로 증가하며, 더 이상 현재 상형문자를 덮어쓰지 않습니다. 또한 신성한 보호구가 지속되는 동안 다른 주문을 시전 시 소모한 충전 당 10턴의 지속시간을 추가로 얻습니다.
actors.hero.spells.holyward$holyarmbuff.name=신성한 보호구
actors.hero.spells.holyward$holyarmbuff.desc=성직자가 현재 착용 중인 방어구에 신성한 빛을 부여해, 현재 상형문자를 덮어씌우고 방어구가 1의 피해를 추가로 막습니다.\n\n남은 턴: %s.
actors.hero.spells.holyward$holyarmbuff.desc_paladin=성기사가 현재 착용 중인 갑옷을 신성한 에너지와 융합하여 3의 피해를 추가로 막을 수 있습니다.\n\n신성한 보호구가 지속되는 동안 다른 주문을 시전 시, 소모한 충전 당 10턴의 지속시간이 추가됩니다.\n\n남은 턴: %s.

actors.hero.spells.holyweapon.name=신성한 무기
actors.hero.spells.holyweapon.ench_name=신성한 %s
actors.hero.spells.holyweapon.ench_desc=신성한 무기에 공격당한 적들은 추가 마법 피해를 입습니다.
actors.hero.spells.holyweapon.short_desc=무기에 일시적으로 추가 마법 피해를 입히는 마법 부여
actors.hero.spells.holyweapon.desc=성직자가 현재 착용 중인 무기에 성스러운 마법을 부여하여, 그 무기에 공격당한 적이 2의 추가 마법 피해를 입게 합니다. 이 주문은 턴 소모 없이 시전할 수 있습니다.\n\n이 마법은 50턴 동안 지속되며, 지속시간 동안 다른 이로운 마법의 효과를 덮어씁니다. 무기를 들고 있지 않아도 이 효과는 적용됩니다.
actors.hero.spells.holyweapon.desc_paladin=_이 주문은 성기사가 시전 시 더 강력해집니다._ 추가 마법 피해가 6으로 증가하며, 더 이상 현재 마법을 덮어쓰지 않습니다. 또한 신성한 무기가 지속되는 동안 다른 주문을 시전 시 소모한 충전 당 10턴의 지속시간을 추가로 얻습니다.
actors.hero.spells.holyweapon$holywepbuff.name=신성한 무기
actors.hero.spells.holyweapon$holywepbuff.desc=성직자가 현재 착용 중인 무기에 성스러운 마법을 부여해, 현재 마법을 덮어씌우고 무기에 공격당한 적에게 2의 마법 피해를 추가로 입힙니다.\n\n남은 턴: %s.
actors.hero.spells.holyweapon$holywepbuff.desc_paladin=성기사가 현재 착용 중인 무기에 성스러운 에너지를 융합하여, 공격 시 6의 추가 마법 피해를 줍니다.\n\n신성한 무기가 지속되는 동안 다른 주문을 시전 시, 소모한 충전 당 10턴의 지속시간이 추가됩니다.\n\n남은 턴: %s.

actors.hero.spells.judgement.name=심판
actors.hero.spells.judgement.short_desc=시야 내 모든 적에게 피해를 입힘.
actors.hero.spells.judgement.desc=성직자가 주먹을 바닥에 내려쳐, 빛을 분출시켜 사야 내 모든 적에게 피해를 입힙니다. 이 능력은 기본적으로 %1$d-%2$d 피해를 입히며, 승천자의 형상 시전 후(또는 지난 번 심판 시전 후) 시전한 주문마다 33%%피해를 추가로 입힙니다.\n\n현재 심판은 %3$d-%4$d의 피해를 입힙니다.

actors.hero.spells.layonhands.name=안수기도
actors.hero.spells.layonhands.short_desc=주변의 캐릭터를 즉시 회복하거나 성기사에게 방어막 부여
actors.hero.spells.layonhands.desc=성기사가 손을 통해 신성력을 발하여, 손에 닿는 대상을 치유하거나 보호합니다.\n\n성기사가 이 주문을 시전하면 주변에 있는 캐릭터를 %1$d만큼 치유하거나, 자신에게 %1$d만큼의 방어막을 부여합니다. 초과 치유된 체력은 방어막으로 전환됩니다.\n\n이 주문은 즉시 시전되며 연속으로 시전할 수 있지만, 최대 3회분의 방어막만 얻을 수 있습니다.

actors.hero.spells.lifelinkspell.name=생명 연결
actors.hero.spells.lifelinkspell.short_desc=아군과 입은 피해를 나누고, 아군이 입는 피해를 경감시킴.
actors.hero.spells.lifelinkspell.desc=성직자가 자신과 강화된 아군 사이의 연결을 강화합니다. 강화된 연결은 %1$d턴 동안 영웅과 대상 아군이 입는 피해를 서로 공유하며, 집단의 힘의 입는 피해 감소가 -%2$d%%까지 증가합니다. 피해 공유는 방어력으로 피해가 감소된 이후 이루어지며, 그 다음에 집단의 힘으로 피해가 감소됩니다.\n\n이 효과가 활성화된 동안, 3티어 이하의 성직자 주문은 영웅과 대상 양 쪽 모두에게 효과를 제공합니다.
actors.hero.spells.lifelinkspell$lifelinkspellbuff.name=생명 연결 보호
actors.hero.spells.lifelinkspell$lifelinkspellbuff.desc=성직자가 최근에 아군에게 생명 연결을 시전했습니다.\n\n생명 연결의 기존 효과에 더하여, 이 캐릭터가 받는 피해가 줄어들며, 이로운 성직자의 주문이 양쪽 대상 모두에게 효과를 부여합니다. 또한 지속시간 동안 집단의 힘이 종료되지 않습니다.\n\n남은 턴: %s.

actors.hero.spells.mindform.name=성심 형상
actors.hero.spells.mindform.short_desc=삼위일체로 이전 마법 막대 또는 투척 무기를 불러냄.
actors.hero.spells.mindform.desc=성직자가 이번 게임에서 식별한 마법 막대 또는 투척 무기를 삼위일체에 불러내어 그 효과를 다시 누릴 수 있습니다.\n\n성직자는 삼위일체를 시전하여 선택한 아이템을 +%d 강화 수치로 한 번 발사/투척합니다. 이렇게 불러낸 효과는 기존 아이템의 효과와 동일하게 작동합니다.\n\n이 주문은 현재 삼위일체로 불러낸 다른 성심 효과를 덮어씁니다.

actors.hero.spells.mnemonicprayer.name=연장 기도문
actors.hero.spells.mnemonicprayer.short_desc=아군/적의 버프/디버프를 연장하며 발광을 다시 적용.
actors.hero.spells.mnemonicprayer.desc=사제가 기도문을 외워 대상 하나의 모든 버프 또는 디버프를 %1$d턴 동안 연장시킵니다. 이 주문은 턴 소모 없이 시전할 수 있습니다. (자신과) 아군에게는 버프가, 적에게는 디버프 지속 시간이 더 증가합니다.\n\n연장 기도문은 버프 또는 디버프를 한 번만 연장하며, 방어구 능력으로 얻은 버프는 연장하지 않습니다.

actors.hero.spells.radiance.name=광휘
actors.hero.spells.radiance.short_desc=빛을 발하여 보이는 모든 적을 기절시킴.
actors.hero.spells.radiance.desc=사제가 신성한 빛을 방출하여 시야 내의 적을 3턴 동안 기절시킵니다. 이미 발광 중인 대상에게는 발광 추가 피해를 입히고 나서 다시 발광시킵니다. 광휘는 또한 현재 층이 어두운 층일 경우 100턴 동안 주변에 빛을 밝힙니다.

actors.hero.spells.recallinscription.name=도돌이 각인
actors.hero.spells.recallinscription.short_desc=가장 최근에 쓴 룬석 또는 주문서를 다시 사용.
actors.hero.spells.recallinscription.desc=성직자가 신성한 마법으로 %s턴 이내 사용한 마지막 룬석 또는 주문서의 효과를 다시 발동합니다.\n\n도돌이 각인은 강화의 주문서 효과를 재사용할 수 없습니다. 이 주문의 충전 사용량은 재사용한 효과에 따라 달라집니다. 룬석은 2, 주문서는 3, 신비로운 주문서는 4의 충전을 사용합니다. 변환의 주문서 또는 그 재료로 만든 연금술 아이템을 재발동하는 경우 충전이 2배로 소모됩니다.
actors.hero.spells.recallinscription$useditemtracker.name=최근에 사용한 룬
actors.hero.spells.recallinscription$useditemtracker.desc=성직자가 가장 최근에 사용한 아이템을 도돌이 각인 주문으로 재사용할 수 있습니다. 도돌이 각인 주문 시전 시 그 아이템 효과가 재발동합니다.\n\n해당 아이템: %1$s.\n\n남은 턴: %2$s.

actors.hero.spells.shieldoflight.name=빛의 방패
actors.hero.spells.shieldoflight.short_desc=대상의 공격에 대해 임시 방어력을 얻음.
actors.hero.spells.shieldoflight.desc=성직자가 적 하나를 사이에 두고 빛의 역장을 만들어, 5턴 동안 방어구의 피해 방어를 %1$d-%2$d 증가시킵니다.\n\n이 주문은 시전 시간이 없으나, 여러 적을 대상으로 사용할 수 없습니다.
actors.hero.spells.shieldoflight$shieldoflighttracker.name=빛의 방패
actors.hero.spells.shieldoflight$shieldoflighttracker.desc=얇은 빛의 방패가 캐릭터와 대상 적 사이에 떠 있습니다. 적의 공격을 완전히 막을 만큼 강력하진 않습니다만, 피해를 일부 경감할 수는 있습니다.\n\n남은 턴: %s

actors.hero.spells.spiritform.name=성령 형상
actors.hero.spells.spiritform.short_desc=삼위일체로 이전 반지 또는 유물을 불러냄.
actors.hero.spells.spiritform.desc=성직자가 이번 게임에서 식별한 반지 또는 마법 유물(성서 제외)을 삼위일체에 불러내어 그 효과를 다시 누릴 수 있습니다.\n\n반지를 선택할 시, 삼위일체는 20턴 동안 해당 반지를 +%1$d 강화한 효과를 제공합니다.\n\n유물을 선택할 시, 삼위일체는 해당 유물을 +%2$d 강화한 효과를 제공합니다. 유물마다 삼위일체로 시전 시 사용 효과 및 갑옷 충전 사용량이 달라집니다.\n\n이 주문은 현재 삼위일체로 불러낸 다른 성령 효과를 덮어씁니다.
actors.hero.spells.spiritform$spiritformbuff.name=성령 형상
actors.hero.spells.spiritform$spiritformbuff.desc=현재 삼위일체의 성령 형상이 아이템의 효과를 해당 장비를 착용하고 있는 것처럼 제공하고 있습니다.\n\n성령 형상은 현재 착용 중인 장비의 효과를 제공하지 않음에 주의하십시오.\n\n현재 효과: %1$s.\n\n남은 턴: %2$s.

actors.hero.spells.smite.name=천벌
actors.hero.spells.smite.short_desc=반드시 적중하며 추가 피해와 마법 위력을 가지는 공격을 함.
actors.hero.spells.smite.desc=성기사가 응분의 힘을 무기에 담아 공격에 사용합니다.\n\n기본 근접 공격 피해에 더불어, 천벌은 방해받지 않은 경우 반드시 명중하며, 무기에 부여된 마법의 위력이 +300%% 증폭되고, %1$d - %2$d의 추가 마법 피해를 줍니다.\n\n천벌의 추가 마법 피해는 성기사의 레벨에 비례하며, 악마와 언데드 적에겐 항상 최대 추가 피해를 입힙니다.

actors.hero.spells.stasis.name=정지
actors.hero.spells.stasis.short_desc=아군을 던전에서 제외한 후 보존함.
actors.hero.spells.stasis.desc=성직자가 아군과의 연결을 자신 쪽으로 집중합니다. 대상 아군은 일시적으로 에너지와 같은 형태로 정지하여 성직자에게 깃들게 됩니다. 대상 아군은 %d턴까지 보존하며, 정지된 동안 이로운 효과는 정지됩니다.\n\n정지한 아군은 정지가 끝나거나, 해당 주문을 충전 소모 없이 재시전 시 성직자 주변에 다시 나타납니다. 정지는 움직일 수 없는 아군 또한 데려갈 수 있으나, 층을 같이 이동할 수 는 없습니다.
actors.hero.spells.stasis$stasisbuff.name=정지 상태의 아군
actors.hero.spells.stasis$stasisbuff.left_behind=움직일 수 없는 아군은 두고 이동합니다.
actors.hero.spells.stasis$stasisbuff.desc=성직자가 현재 아군을 정지장에 가두었습니다. 대상 아군이 가진 집단의 힘을 포함한 모든 강화 효과는 보존되며, 지속시간이 끝날 때 성직자 근처에 다시 나타납니다. 이 효과는 정지를 재시전하여 즉시 발동할 수 있습니다.\n\n정지 상태의 아군: %1$s.\n남은 턴: %2$s.

actors.hero.spells.sunray.name=태양 광선
actors.hero.spells.sunray.short_desc=대상에게 원거리 마법 피해를 주며 실명시킴.
actors.hero.spells.sunray.desc=성직자가 대상에게 눈부신 광선을 발사하며, %1$d-%2$d 피해를 주고 %3$d턴 동안 실명시킵니다. 태양 광선은 언데드나 악마 적에게 항상 최대 피해를 줍니다.\n\n이 주문에 적중당한 대상은 이내 빛에 적응하여, 얼마 동안 태양 광선으로 다시 실명하지 않습니다. 하지만, 실명 중인 대상에게 태양 광선을 다시 적중하면, 빛이 적을 압도하여 대상을 마비시킵니다.

actors.hero.spells.walloflight.name=빛의 벽
actors.hero.spells.walloflight.short_desc=적을 가로막는 벽을 생성함.
actors.hero.spells.walloflight.desc=성기사가 자신 바로 앞에 고체화된 빛으로 이루어진 1타일 두께, %1$d타일 넓이의 벽을 20턴 동안 생성합니다.\n\n이 벽은 일반적인 벽과 동일하게 작동하지만, 반대편을 볼 수 있습니다. 벽이 생성될 때 경로에 있는 적은 잠시 기절하며 공간이 있는 경우 밀려납니다. 벽에 갇힌 적은 얼마든지 벽 밖으로 나올 수 있습니다.\n\n벽은 상하좌우와 대각선 8방향으로 생성할 수 있으며, 이미 벽이 생성되어 있을 경우 주문을 다시 시전하면 별도의 충전 소모 없이 벽을 제거합니다.
actors.hero.spells.walloflight.early_end=당신은 빛의 벽을 제거했다.
actors.hero.spells.walloflight$lightwall.desc=고체화된 빛의 벽이 길을 막고 있다.

##main hero
actors.hero.hero.name=당신
actors.hero.hero.leave=당신은 아직 떠날 수 없습니다. 아래에 남아있는 던전이 기다리고 있습니다!
actors.hero.hero.level_up=레벨 업!
actors.hero.hero.new_level=레벨 업! +정확성, +회피, +5 최대 체력!
actors.hero.hero.new_talent=+1 특성 포인트!
actors.hero.hero.unspent=사용하지 않은 특성 포인트가 있다!
actors.hero.hero.level_cap=당신은 더 이상 강해질 순 없지만, 당신의 경험들은 당신에게 새로운 힘을 주었다!
actors.hero.hero.you_now_have=%s을(를) 얻었다.
actors.hero.hero.you_cant_have=%s를 주울 수 없다.
actors.hero.hero.locked_chest=이 상자는 잠겨 있고 당신은 맞는 열쇠를 가지고 있지 않다.
actors.hero.hero.locked_door=맞는 열쇠를 갖고 있지 않다.
actors.hero.hero.noticed_smth=당신은 무언가를 눈치챘다.
actors.hero.hero.wait=...
actors.hero.hero.search=탐색
actors.hero.hero.search_distracted=집중할 수 없어 탐색에 약간 시간이 걸린다.
actors.hero.hero.key_distracted=자물쇠가 완전히 열리지 않는다. 계속 시도해 보는 것이 좋을 것이다.
actors.hero.hero.pain_resist=고통으로 인해 당신은 수면 욕구에 저항했다.
actors.hero.hero.revive=앙크는 부활의 에너지로 폭발했다!

##classes
actors.hero.heroclass.warrior=전사
actors.hero.heroclass.warrior_desc_short=전사는 _부러진 인장_이 주는 방어막으로 피해를 더 견딜 수 있습니다. 인장은 다른 갑옷에 붙일 수 있으며 _1의 강화 수치_를 옮길 수 있습니다.
actors.hero.heroclass.warrior_desc=전사는 체력이 절반 이하로 떨어질 시 대량의 방어막을 생성하는 _특별한 부러진 인장_을 가지고 시작합니다. 전사의 인장은 방어구들 간에 옮겨 붙일 수 있으며, 인장에 붙은 _1만큼의 강화 수치_를 옮겨 가져갈 수 있습니다.\n\n전사는 또한 _낡은 소검_, _세 개의 투척용 돌_, 천 갑옷, 가죽 물통, 벨벳 주머니를 가지고 시작합니다.\n\n전사는 다음 아이템을 감정한 채로 시작합니다.\n_-_ 감정의 주문서\n_-_ 치유 물약\n_-_ 분노의 주문서
actors.hero.heroclass.warrior_unlock=전사는 자동으로 해금됩니다.

actors.hero.heroclass.mage=마법사
actors.hero.heroclass.mage_desc_short=마법사는 비전 마법의 전문가로, 마법 막대보다 강력한, _마법 지팡이_를 가지고 있습니다. 지팡이는 마법사가 찾은 _다른 마법 막대와 융합_할 수 있습니다.
actors.hero.heroclass.mage_desc=마법사는 최대 충전량이 원본 마법 막대보다 1만큼 더 많고 재충전 속도가 월등히 빠른 _특별한 지팡이_를 가지고 시작합니다. 이 지팡이에는 마법사가 던전에서 발견한 _다른 마법 막대를 융합할 수 있습니다._\n\n마법사는 _마탄의 마법 막대_를 지팡이에 융합한 채로 시작하며, 또한 천 갑옷, 가죽 물통, 벨벳 주머니를 가지고 시작합니다.\n\n마법사는 다음 아이템을 감정한 채로 시작합니다.\n_-_ 감정의 주문서\n_-_ 액체 화염의 물약\n_-_ 강화의 주문서
actors.hero.heroclass.mage_unlock=마법사를 해금하려면 _강화의 주문서를 사용하여 아이템을 강화하세요._

actors.hero.heroclass.rogue=도적
actors.hero.heroclass.rogue_desc_short=도적은 _그림자의 망토_를 사용하여 투명한 상태에서 적을 피하거나 기습을 가할 수 있습니다. 또한 도적은 더욱 먼 거리에서도 _비밀과 함정을 탐지_할 수 있습니다.
actors.hero.heroclass.rogue_desc=도적은 언제든지 투명화가 가능한 특별한 마법 유물인 _그림자의 망토_를 가지고 시작합니다.\n\n도적은 더욱 멀리서도 _숨겨진 비밀과 함정들을 감지_할 수 있습니다.\n\n도적은 또한 _단검_, _세 개의 투척용 나이프_, 천 갑옷, 가죽 물통, 벨벳 주머니를 가지고 시작합니다.\n\n도적은 다음 아이템들을 감정한 채로 시작합니다.\n_-_ 감정의 주문서\n_-_ 투명화의 물약\n_-_ 마법 지도의 주문서
actors.hero.heroclass.rogue_unlock=도적을 해금하려면 _한 판에 기습 공격을 10번 하세요._

actors.hero.heroclass.huntress=사냥꾼
actors.hero.heroclass.huntress_desc_short=사냥꾼은 투척 무기의 달인으로 무한히 화살을 발사하는 _마법의 활_을 가지고 있습니다. 또한 사냥꾼은 길게 자란 풀을 _짓밟지 않고_ 지나갈 수 있습니다.
actors.hero.heroclass.huntress_desc=사냥꾼은 화살을 무한히 발사할 수 있는 _특별한 영혼의 활_을 가지고 시작합니다.\n\n사냥꾼은 길게 자란 풀을 _짓밟지 않고_ 지나갈 수 있습니다.\n\n사냥꾼은 또한 _징 박힌 장갑_, 천 갑옷, 가죽 물통, 벨벳 주머니를 가지고 시작합니다.\n\n사냥꾼은 다음 아이템들을 감정한 채로 시작합니다:\n_-_ 감정의 주문서\n_-_ 심안의 물약\n_-_ 자장가의 주문서
actors.hero.heroclass.huntress_unlock=사냥꾼을 해금하려면 _한 판에 투척 무기로 적을 10번 맞히세요._

actors.hero.heroclass.duelist=결투자
actors.hero.heroclass.duelist_desc_short=결투자는 무기의 _특별한 능력_을 사용할 수 있는 무기의 달인입니다. 들고 있는 _무기에 따라_ 다른 특수 능력을 발휘할 수 있습니다.
actors.hero.heroclass.duelist_desc=결투자는 서서히 충전되는 특수 능력을 가진 _특별한 레이피어_를 들고 시작합니다.\n\n결투자로 게임을 진행하면 무기별로 _다른 특별한 능력_을 사용할 수 있습니다.\n\n결투자는 또한 _두 개의 투척용 대못_, 천 갑옷, 가죽 물통, 벨벳 주머니를 가지고 시작합니다.\n\n결투자는 다음 아이템을 감정한 채로 시작합니다.\n_-_ 감정의 주문서\n_-_ 힘의 물약\n_-_ 거울상의 주문서
actors.hero.heroclass.duelist_unlock=결투자를 해금하려면 _2티어 이상의 무기를 힘 페널티 없이 착용하십시오_.

actors.hero.heroclass.cleric=성직자
actors.hero.heroclass.cleric_desc_short=성직자는 고유 유물인 _성서_를 사용하는 신성한 주문사용자입니다. 성직자는 특성으로 _주문을 배우고 강화_할 수 있습니다.
actors.hero.heroclass.cleric_desc=성직자는 _고유 유물인 성서_를 가지고 시작하며, 성서를 사용해 다양한 주문을 시전합니다.\n\n성직자의 특성 대부분은 주문을 얻거나 강화하는 역할을 합니다.\n\n성직자는 또한 _곤봉_, 천 갑옷, 가죽 물통, 벨벳 주머니를 가지고 시작합니다.\n\n성직자는 다음 아이템을 감정한 채로 시작합니다.\n_-_ 감정의 주문서\n_-_ 정화의 물약\n_-_ 저주 해제의 주문서
actors.hero.heroclass.cleric_unlock=성직자를 해금하려면, _아이템 하나에 깃든 저주를 완전히 정화하세요._

actors.hero.herosubclass.berserker=광전사
actors.hero.herosubclass.berserker_short_desc=_광전사_는 피해를 입을 때마다 분노를 쌓습니다. 분노는 피해량을 증가시키며, 광포화하여 순식간에 막대한 추가 방어막을 얻을 수 있습니다.
actors.hero.herosubclass.berserker_desc=광전사는 방어구로 막아낸 피해를 포함한 물리적인 피해를 입음에 따라 분노를 얻습니다! 분노는 서서히 감소하지만, 체력이 적을수록 분노는 더욱 오래 지속됩니다.\n\n광전사는 분노에 따라 최대 50%의 추가 피해를 줍니다. 또한 분노가 100%일 때 광포화 할 수 있으며, 방어구의 강화 수치와 잃은 체력에 비례하여 대량의 추가 방어막을 얻고, 방어막이 남아있는 동안 분노를 계속 100%로 유지합니다. 하지만, 광전사가 광포화 한 이후에는 회복을 할 시간이 필요합니다.
actors.hero.herosubclass.gladiator=검투사
actors.hero.herosubclass.gladiator_short_desc=_검투사_는 공격이 성공할 때마다 연속 타격을 쌓습니다. 연속 타격을 소모하여 특유의 필살기를 사용할 수 있습니다.
actors.hero.herosubclass.gladiator_desc=검투사는 근접 무기 혹은 투척 무기로 공격을 성공시킬 때마다 1의 연속 타격을 얻습니다. 검투사가 5턴(적을 처치한 후에는 15턴) 내에 공격을 성공시키지 못하면, 연속 타격이 초기화됩니다.\n\n연속 타격이 쌓이면 연속 타격을 소모하여 아래의 필살기를 사용할 수 있습니다. 필살기는 반드시 적중합니다.\n2 연속 타격: 적을 밀쳐내고, 연속 타격을 유지합니다.\n4 연속 타격: 방어력에 비례한 피해를 입힙니다.\n6 연속 타격: 적의 공격을 반격하며, 연속 타격을 유지합니다.\n8 연속 타격: 지정한 적과 주변의 적 모두에게 피해를 입힙니다.\n10 연속 타격: 현재 연속 타격만큼 반복해서 적을 공격합니다.
actors.hero.herosubclass.battlemage=전투 마법사
actors.hero.herosubclass.battlemage_short_desc=_전투 마법사_는 자신의 지팡이로 근접 공격을 할 때 추가 효과를 얻습니다. 이 효과는 지팡이에 융합된 마법 막대의 종류에 따라 달라집니다.
actors.hero.herosubclass.battlemage_desc=전투 마법사는 그의 지팡이로 근접 공격을 할 때, 마치 지팡이에 추가적인 마법이 부여된 것처럼 추가 효과를 얻습니다. 이 효과는 지팡이에 융합되어 있는 마법 막대에 따라 달라지며, 각각의 마법 막대는 고유한 효과를 가지고 있습니다. 마법 막대의 효과 외에도, 전투 마법사의 지팡이는 성공적인 공격을 가할 때마다 0.5의 충전량을 얻습니다.
actors.hero.herosubclass.warlock=흑마법사
actors.hero.herosubclass.warlock_short_desc=_흑마법사_는 마법 막대로 적들에게 영혼 표식을 새길 확률이 있습니다. 흑마법사는 표식이 새겨진 적에게 물리 피해를 입힐때마다 체력을 회복합니다.
actors.hero.herosubclass.warlock_desc=흑마법사는 대상에게 마법 막대를 사용할 때 영혼 표식을 새길 확률이 있습니다. 영혼 표식을 새길 확률과 지속 시간은 막대의 강화수치에 따라 증가합니다.\n\n적에게 영혼의 표식이 새겨진 경우, 흑마법사는 그들에게 입히는 매 5의 피해 당 2의 체력을 회복합니다. 그러나 오직 근접 공격 혹은 투척 무기로 입히는 피해만 해당되며, 마법 막대는 해당하지 않습니다!
actors.hero.herosubclass.assassin=암살자
actors.hero.herosubclass.assassin_short_desc=_암살자_는 투명한 상태에서 치명적인 일격을 준비할 수 있습니다. 투명화한 상태로 오래 기다릴수록, 일격이 더욱 강력해집니다.
actors.hero.herosubclass.assassin_desc=암살자는 투명화 상태가 되면 다음 공격을 더욱 신중하게 준비합니다. 준비한 시간이 길어질수록, 다음 공격이 더욱 강력해집니다. 마음가짐은 최대 9 턴까지 쌓을 수 있습니다.\n\n마음가짐 이후 암살자는 다음 공격에 더 큰 피해를 주고, 대상에게 점멸하여 접근할 수 있으며 심지어는 약해진 적을 일격에 처치할 수도 있습니다.
actors.hero.herosubclass.freerunner=프리러너
actors.hero.herosubclass.freerunner_short_desc=_프리러너_는 이동할 때마다 가속력을 쌓고, 프리러닝 상태에 돌입하는 데에 사용할 수 있습니다. 프리러닝 상태가 되면 짧은 시간 동안 추가적인 이동 속도와 회피를 얻습니다.
actors.hero.herosubclass.freerunner_desc=프리러너는 이동함에 따라 가속력을 쌓습니다. 10턴 동안 이동함으로써 최대 10의 가속력을 쌓을 수 있지만, 이동을 멈추면 가속력은 빠르게 사라집니다. 프리러너는 가속력을 모두 사용해, 가속력 1당 2턴의 프리러닝 상태에 돌입할 수 있습니다.\n\n프리러닝 도중 프리러너는 2배의 속도로 이동하며, 레벨에 비례하여 추가 회피를 얻습니다. 프리러닝이 끝나면, 다시 가속력을 쌓기 위한 재사용 대기 시간이 존재합니다.
actors.hero.herosubclass.sniper=저격수
actors.hero.herosubclass.sniper_short_desc=_저격수_는 원거리 공격으로 방어구를 꿰뚫을 수 있습니다. 또한 투척 무기를 맞힌 다음 활로 특수한 추가 공격을 가할 수 있습니다.
actors.hero.herosubclass.sniper_desc=저격수는 원거리 전투의 숙련자로, 원거리 공격이 적의 방어를 관통합니다. 투척 무기를 적에게 명중시켰을 때, 대상에게 저격수의 표식을 새겨 이후 활을 이용해 특별한 공격을 사용할 수 있습니다. 이 특별한 공격은 저격수의 활이 어떻게 증강되었는지에 따라 달라집니다.\n\n증강되지 않은 활은 적은 피해를 주지만 턴 소모가 없는 스냅 샷을 발사합니다. 공격 속도를 증강한 활은 1턴을 소모해 적은 피해를 주지만 활에 부여된 마법을 발동할 수 있는 3발의 화살을 일제 사격합니다. 공격력을 증강한 활은 2턴을 소모해 반드시 명중하고 거리에 비례한 추가 피해를 주는 저격탄을 발사합니다.
actors.hero.herosubclass.warden=숲지기
actors.hero.herosubclass.warden_short_desc=_숲지기_는 길게 자란 풀 너머를 볼 수 있으며, 씨앗을 심거나 식물을 밟을 때 추가 효과를 얻습니다.
actors.hero.herosubclass.warden_desc=숲지기는 자연과의 강한 유대로 풀과 식물로부터 다양한 추가 효과를 얻을 수 있습니다. 또한 길게 자란 풀과 헤쳐나간 풀에 시야가 방해받지 않고 그 너머를 볼 수 있습니다.\n\n숲지기는 씨앗을 던지거나 심을 때 근처에 풀을 자라나게 하며, 식물을 밟을 때 특별한 효과를 얻습니다. 이 특별한 효과는 기존 식물의 효과를 대체하며, 밟는 식물로부터 어떠한 피해도 받지 않게 합니다.
actors.hero.herosubclass.champion=챔피언
actors.hero.herosubclass.champion_short_desc=_챔피언_은 두 개의 무기를 착용할 수 있으며, 더 많은 무기 충전량을 얻게 됩니다. 일반적인 공격은 주 무기로 하지만, 주 무기를 두 번째 무기와 즉시 바꿀 수 있으며 두 무기의 능력을 모두 사용할 수 있습니다.
actors.hero.herosubclass.champion_desc=챔피언은 근접 무기에 통달하여 주 무기 이외에 보조 무기 하나를 더 착용할 수 있습니다. 일반적인 공격은 주 무기로 하지만, 언제든지 주 무기를 즉시 교체할 수 있으며 두 무기의 능력 모두 사용할 수 있습니다.\n\n챔피언은 또한 최대 무기 능력 충전량을 2만큼 추가로 얻으며 무기 능력 충전 속도가 +50% 증가합니다.
actors.hero.herosubclass.monk=수도사
actors.hero.herosubclass.monk_short_desc=_수도사_는 전투 중에 에너지를 얻습니다. 얻은 에너지를 사용하여 다양한 특수 능력을 사용할 수 있습니다.
actors.hero.herosubclass.monk_desc=수도사는 신체 기술의 달인입니다. 수도사가 적을 처치하면 에너지를 얻으며, 얻은 에너지를 통해 방어적인 보조 능력들을 사용할 수 있게 됩니다. 이 에너지는 시간이 지남에 따라 사라지지 않으며, 가질 수 있는 최대 에너지는 수도사의 레벨에 비례합니다.\n\n1 에너지: 주먹으로 재빠르게 공격합니다.\n2 에너지: 집중하여 다음 공격을 회피합니다.\n3 에너지: 근처의 위치로 즉시 돌진합니다.\n4 에너지: 적을 발로 차 날려 보냅니다.\n5 에너지: 명상하여 상태 이상을 회복하고 마법 막대와 유물을 충전합니다.
actors.hero.herosubclass.priest=사제
actors.hero.herosubclass.priest_short_desc=_사제_는 강력한 장거리 주문을 얻고, 인도하는 빛이 강화됩니다.
actors.hero.herosubclass.priest_desc=사제는 원거리 전투와 마법 아이템의 연계에 중점을 둔 다양하고 강력한 주문들을 얻습니다.\n\n사제는 _인도하는 빛_을 50턴에 한 번 충전 소모 없이 사용하며, 주문에 직접적인 대상이 된 적을 발광시키고, 발광 효과를 아군, 마법 막대, 몇몇 유물을 통해 소모시켜 사제의 레벨+5의 추가 피해를 줍니다.\n\n사제는 또한 _광휘_ 주문을 얻어, 2의 충전을 사용해 어둠을 몰아내며 시야 내 모든 적들을 잠시 기절시키며 발광을 적용하거나 이미 발광한 적에게 추가 피해를 입힙니다.
actors.hero.herosubclass.paladin=성기사
actors.hero.herosubclass.paladin_short_desc=_성기사_는 새로운 근거리 주문을 얻고, 신성한 무기와 신성한 보호구가 강화됩니다.
actors.hero.herosubclass.paladin_desc=성기사는 근접 전투와 무기 및 방어구와의 연계에 중점을 둔 다양하고 강력한 주문을 얻습니다.\n\n성기사의 _신성한 무기_와 _신성한 보호구_가 더 큰 효과를 가지며, 더 이상 기존의 마법과 상형문자를 덮어쓰지 않으며, 다른 주문을 시전해 지속시간을 연장할 수 있습니다.\n\n성기사는 또한 _천벌_ 주문을 얻어, 반드시 적중하는 근접 공격을 하며 추가 피해를 입히고 무기의 마법이 증폭됩니다.

##talents
actors.hero.talent$provokedangertracker.name=분노 자극
actors.hero.talent$provokedangertracker.desc=전사는 최근에 방어막을 잃어, 다음 물리 공격에 추가 피해를 입힙니다.\n\n남은 턴: %s.
actors.hero.talent$lingeringmagictracker.name=잔류 마력
actors.hero.talent$lingeringmagictracker.desc=마법사는 최근에 지팡이나 마법 막대를 사용했으며, 다음 물리 공격에 추가 피해를 입힙니다.\n\n남은 턴: %s.
actors.hero.talent$followupstriketracker.name=추가 타격
actors.hero.talent$followupstriketracker.desc=최근 투척 무기로 적을 공격하였습니다. 같은 대상을 근접 무기로 공격하면 추가 피해를 줍니다.\n\n남은 턴: %s
actors.hero.talent$patientstriketracker.name=침착한 공격
actors.hero.talent$patientstriketracker.desc=공격을 하기 전 한 턴을 대기하였습니다. 다음 물리 공격은 추가 피해를 줍니다.
actors.hero.talent$improvisedprojectilecooldown.name= 재사용 대기 시간: 급조한 투척물
actors.hero.talent$improvisedprojectilecooldown.desc=당신은 최근에 이 특성을 사용하여, 다시 사용하는 데에 시간이 필요합니다.\n\n남은 턴: %s.
actors.hero.talent$rejuvenatingstepscooldown.name= 재사용 대기 시간: 활력의 발걸음
actors.hero.talent$rejuvenatingstepscooldown.desc=당신은 최근에 이 특성을 사용하여, 다시 사용하는 데에 시간이 필요합니다.\n\n남은 턴: %s.
actors.hero.talent$seershotcooldown.name= 재사용 대기 시간: 예지의 화살
actors.hero.talent$seershotcooldown.desc=당신은 최근에 이 특성을 사용하여, 다시 사용하는 데에 시간이 필요합니다.\n\n남은 턴: %s.
actors.hero.talent$aggressivebarriercooldown.name=재사용 대기 시간: 공격적인 방어막
actors.hero.talent$aggressivebarriercooldown.desc=당신은 최근에 이 특성을 사용하여, 다시 사용하는 데에 시간이 필요합니다.\n\n남은 턴: %s.
actors.hero.talent$liquidagilacctracker.name=액체로 이루어진 민첩성
actors.hero.talent$liquidagilacctracker.desc=다음 번 일반 근접 공격은 추가 명중률을 얻습니다.\n\n남은 턴: %s.
actors.hero.talent$lethalhastecooldown.name=재사용 대기 시간: 치명적인 신속
actors.hero.talent$lethalhastecooldown.desc=당신은 최근에 이 특성을 사용하여, 다시 사용하는 데에 시간이 필요합니다.\n\n남은 턴: %s.
actors.hero.talent$swiftequipcooldown.name=재사용 대기 시간: 재빠른 장착
actors.hero.talent$swiftequipcooldown.desc=당신은 최근에 이 특성을 사용하여, 다시 사용하는 데에 시간이 필요합니다.\n\n남은 턴: %s.
actors.hero.talent$preciseassaulttracker.name=정확한 일격
actors.hero.talent$preciseassaulttracker.desc=다음 번 일반 근접 공격은 추가 명중률을 얻습니다.\n\n남은 턴: %s.
actors.hero.talent$deadlyfollowuptracker.name=치명적인 후속타
actors.hero.talent$deadlyfollowuptracker.desc=최근 투척 무기로 적을 공격하였습니다. 같은 대상을 근접 무기로 공격하면 추가 피해를 줍니다.\n\n남은 턴: %s
actors.hero.talent$combinedlethalityabilitytracker.executed=처형됨
actors.hero.talent$satiatedspellstracker.name=보호의 주문
actors.hero.talent$satiatedspellstracker.desc=성직자가 다음 주문 시전 시 약간의 방어막을 얻습니다.
actors.hero.talent$searinglightcooldown.name=타오르는 빛
actors.hero.talent$searinglightcooldown.desc=당신은 최근에 이 특성을 사용하여, 다시 사용하는 데에 시간이 필요합니다.\n\n남은 턴: %s.

#warrior
actors.hero.talent.hearty_meal.title=푸짐한 식사
actors.hero.talent.hearty_meal.desc=_+1:_ 체력이 33% 이하일 때 음식을 먹으면 _4_의 체력을 회복합니다.\n\n_+2:_ 체력이 33% 이하일 때 음식을 먹으면 _6_의 체력을 회복합니다.
actors.hero.talent.veterans_intuition.title=베테랑의 직감
actors.hero.talent.veterans_intuition.desc=_+1:_ 무기를 _1.75배 빠르게_, 방어구를 _2.5배 빠르게_ 감정합니다.\n\n_+2:_ 무기를 _2.5배 빠르게_ 감정하고, 방어구를 _착용하는 즉시_ 감정합니다.
actors.hero.talent.provoked_anger.title=분노 자극
actors.hero.talent.provoked_anger.desc=_+1:_ 종류에 관계없이 전사에게 부여된 방어막이 공격을 받아 사라지면 다음 물리 공격의 피해량이 _3_ 증가합니다.\n\n_+2:_ 종류에 관계없이 전사에게 부여된 방어막이 공격을 받아 사라지면 다음 물리 공격의 피해량이 _5_ 증가합니다.
actors.hero.talent.iron_will.title=강철의 의지
actors.hero.talent.iron_will.desc=_+1:_ 전사의 부러진 인장이 제공하는 방어막이 _1 만큼 증가_합니다.\n\n_+2:_ 전사의 부러진 인장이 제공하는 방어막이 _2 만큼 증가_합니다.
actors.hero.talent.iron_will.meta_desc=_다른 직업이 이 특성을 얻으면,_ 체력이 절반 이하로 감소할 때 최대 1 또는 2의 방어막을 얻습니다.

actors.hero.talent.iron_stomach.title=강철의 위장
actors.hero.talent.iron_stomach.desc=_+1:_ 식사 시 1 턴만 소모되며 식사 중에 받는 피해가 _75%_ 감소합니다.\n\n_+2:_ 식사 시 1 턴만 소모되며 식사 중에 받는 피해가 _100%_ 감소합니다.
actors.hero.talent.liquid_willpower.title=액체로 이루어진 의지
actors.hero.talent.liquid_willpower.desc=_+1:_ 물약, 혼합물, 영약을 마시거나 던진 이후 _최대 체력의 6.5%에 해당하는 방어막_을 즉시 회복합니다.\n\n_+2:_ 물약, 혼합물, 영약을 마시거나 던진 이후 _최대 체력의 10%에 해당하는 방어막_을 즉시 회복합니다.\n\n방어막 재생 효과는 힘의 물약, 경험의 물약 및 이 물약을 재료로 사용하여 만든 연금술 아이템을 사용했을 때 2배가 됩니다.\n\n사용한 물약의 수보다 많은 양의 결과물을 제작하는 연금술 아이템(예: 물 혼합물)의 경우, 이 특성은 그 결과물의 개수에 따라 발동할 확률이 달라집니다.
actors.hero.talent.runic_transference.title=상형문자 전이
actors.hero.talent.runic_transference.desc=_+1:_ 전사의 부러진 인장이 강화수치를 옮길 때와 같은 방식으로 _평범한 상형문자_를 옮길 수 있습니다.\n\n_+2:_ 전사의 부러진 인장이 강화수치를 옮길 때와 같은 방식으로 _평범한, 강력한, 저주 상형문자_를 옮길 수 있습니다.\n\n인장이 갑옷에 붙어 있는 동안 부여된 상형문자만 옮길 수 있습니다.
actors.hero.talent.runic_transference.meta_desc=_다른 직업이 이 특성을 얻으면,_ 강화의 주문서로 갑옷을 강화할 때 상형문자가 확률적으로 사라지기 시작하는 최소 강화 수치가 +1에서 4 -> 6으로, +2에서 4 -> 7로 증가합니다. 강화 수치 8 이상의 갑옷을 강화할 때는 여전히 상형문자가 확정으로 사라지게 됩니다.
actors.hero.talent.lethal_momentum.title=치명적인 관성
actors.hero.talent.lethal_momentum.desc=_+1:_ 적을 처치하는 마지막 물리 공격이 _67% 확률_로 턴을 소모하지 않습니다.\n\n_+2:_ 적을 처치하는 마지막 물리 공격이 _100% 확률_로 턴을 소모하지 않습니다.
actors.hero.talent.improvised_projectiles.title=급조한 투척물
actors.hero.talent.improvised_projectiles.desc=_+1:_ 투척 무기가 아닌 아이템을 적에게 던질 경우 맞은 적을 _2턴_ 동안 실명시킵니다. 50턴의 재사용 대기 시간이 있습니다.\n\n_+2:_ 투척 무기가 아닌 아이템을 적에게 던질 경우 맞은 적을 _3턴_ 동안 실명시킵니다. 50턴의 재사용 대기 시간이 있습니다.

actors.hero.talent.hold_fast.title=굳건한 태세
actors.hero.talent.hold_fast.desc=_+1:_ 전사는 대기 시 다음에 움직이기 전까지 _1-2_의 방어력을 얻고 연속 타격과 방어막 버프의 감소를 _50%_만큼 늦춥니다.\n\n_+2:_ 전사는 대기 시 다음에 움직이기 전까지 _2-4_의 방어력을 얻고 연속 타격과 방어막 버프의 감소를 _75%_만큼 늦춥니다.\n\n_+3:_ 전사는 대기 시 다음에 움직이기 전까지 _3-6_의 방어력을 얻고 연속 타격과 방어막 버프의 감소를 _100%_만큼 늦춥니다.
actors.hero.talent.strongman.title=철인
actors.hero.talent.strongman.desc=_+1:_ 전사의 힘이 _8%_ 만큼 증가합니다. 소수점 미만은 버립니다.\n\n_+2:_ 전사의 힘이 _13%_ 만큼 증가합니다. 소수점 미만은 버립니다.\n\n_+3:_ 전사의 힘이 _18%_ 만큼 증가합니다. 소수점 미만은 버립니다.

actors.hero.talent.endless_rage.title=끝없는 분노
actors.hero.talent.endless_rage.desc=_+1:_ 광전사는 분노를 최대 _116%_ 까지 쌓을 수 있습니다.\n\n_+2:_ 광전사는 분노를 최대 _133%_ 까지 쌓을 수 있습니다.\n\n_+3:_ 광전사는 분노를 최대 _150%_ 까지 쌓을 수 있습니다.\n\n100%를 넘는 분노 1%당 광포화시 방어막을 1% 더 얻고 회복에 걸리는 시간이 1% 줄어들지만, 추가 피해량은 +50% 이상으로 늘어나지 않습니다.
actors.hero.talent.deathless_fury.title=불사의 분노
actors.hero.talent.deathless_fury.desc=_+1:_ 분노가 100% 이상일 때 치명적인 피해를 입으면 즉시 광포화합니다. 이 효과를 다시 사용하려면 _영웅 레벨을 3 올려야_합니다.\n\n_+2:_ 분노가 100% 이상일 때 치명적인 피해를 입으면 즉시 광포화합니다. 이 효과를 다시 사용하려면 _영웅 레벨을 2 올려야_합니다.\n\n_+3:_ 분노가 100% 이상일 때 치명적인 피해를 입으면 즉시 광포화합니다. 이 효과를 다시 사용하려면 _영웅 레벨을 1 올려야_합니다.\n\n광포화 효과가 종료될 때 체력이 0이면 즉시 사망합니다.
actors.hero.talent.enraged_catalyst.title=광분의 촉매
actors.hero.talent.enraged_catalyst.desc=_+1:_ 광전사의 무기에 부여된 마법 또는 저주가 분노에 비례해서 더 자주 발동하게 되며, 100%의 분노에서 최대 _15% 더 자주 발동_합니다.\n\n_+2:_ 광전사의 무기에 부여된 마법 또는 저주가 분노에 비례해서 더 자주 발동하게 되며, 100%의 분노에서 최대 _30% 더 자주 발동_합니다.\n\n_+3:_ 광전사의 무기에 부여된 마법 또는 저주가 분노에 비례해서 더 자주 발동하게 되며, 100%의 분노에서 최대 _45% 더 자주 발동_합니다.

actors.hero.talent.cleave.title=가르기
actors.hero.talent.cleave.desc=_+1:_ 적을 처치했을 때 연속 타격이 유지되는 시간이 기존 15턴에서 _30턴_으로 늘어납니다.\n\n_+2:_ 적을 처치했을 때 연속 타격이 유지되는 시간이 기존 15턴에서 _45턴_으로 늘어납니다.\n\n_+3:_ 적을 처치했을 때 연속 타격이 유지되는 시간이 기존 15턴에서 _60턴_으로 늘어납니다.
actors.hero.talent.lethal_defense.title=치명적인 방어
actors.hero.talent.lethal_defense.desc=_+1:_ 필살기로 적을 처치한 경우 부러진 인장 효과의 재사용 대기 시간이 _50턴 감소합니다_.\n\n_+2:_ 필살기로 적을 처치한 경우 부러진 인장 효과의 재사용 대기 시간이 _100턴 감소합니다_.\n\n_+3:_ 필살기로 적을 처치한 경우 부러진 인장 효과의 재사용 대기 시간이 _150턴 감소합니다_.\n\n이 특성으로 방어막 재사용 대기 시간이 -150 감소될 수 있으며, 이 경우 방어막이 제공된 후 곧바로 효과가 다시 준비됩니다.
actors.hero.talent.enhanced_combo.title=향상된 콤보
actors.hero.talent.enhanced_combo.desc=_+1:_ 검투사의 연속 타격이 7 이상일 때, 밀쳐내기의 밀쳐내는 거리가 3칸으로 증가하고, 적을 혼란시키며, 적을 밀쳐내 낭떠러지에 떨어뜨릴 수 있습니다.\n\n_+2:_ +1의 효과에 더불어, 검투사의 연속 타격이 9 이상일 때 받아치기가 여러 번의 공격을 받아칠 수 있습니다.\n\n_+3:_ +1, +2의 효과에 더불어, 검투사는 메치기, 으깨기, 분노 폭발을 사용할 때 연속 타격/3 개의 타일을 도약할 수 있습니다.

actors.hero.talent.body_slam.title=몸통 박치기
actors.hero.talent.body_slam.desc=_+1:_ 전사가 도약 후 착지할 때, 근접한 모든 적들은 _1-4 + 전사의 방어력의 25%_ 만큼 피해를 입습니다.\n\n_+2_ 전사가 도약 후 착지할 때, 근접한 모든 적들은 _2-8 + 전사의 방어력의 50%_ 만큼 피해를 입습니다.\n\n_+3:_ 전사가 도약 후 착지할 때, 근접한 모든 적들은 _3-12 + 전사의 방어력의 75%_ 만큼 피해를 입습니다.\n\n_+4:_ 전사가 도약 후 착지할 때, 근접한 모든 적들은 _4-16 + 전사의 방어력의 100%_ 만큼 피해를 입습니다.
actors.hero.talent.impact_wave.title=충격파
actors.hero.talent.impact_wave.desc=_+1:_ 전사가 도약 후 착지할 때, 근접한 모든 적들은 _2타일_ 만큼 밀려나며, _25% 확률_로 5턴간 취약 상태가 됩니다.\n\n_+2:_ 전사가 도약 후 착지할 때, 근접한 모든 적들은 _3타일_ 만큼 밀려나며, _50% 확률_로 5턴간 취약 상태가 됩니다.\n\n_+3:_ 전사가 도약 후 착지할 때, 근접한 모든 적들은 _4타일_ 만큼 밀려나며, _75% 확률_로 5턴간 취약 상태가 됩니다.\n\n_+4:_ 전사가 도약 후 착지할 때, 근접한 모든 적들은 _5타일_ 만큼 밀려나며, _100% 확률_로 5턴간 취약 상태가 됩니다.
actors.hero.talent.double_jump.title=이중 도약
actors.hero.talent.double_jump.desc=_+1:_ 전사가 도약한 후 3턴 이내에 다시 도약할 경우, 해당 도약은 _16% 적은_ 충전량을 소모합니다.\n\n_+2:_ 전사가 도약한 후 3턴 이내에 다시 도약할 경우, 해당 도약은 _30% 적은_ 충전량을 소모합니다.\n\n_+3:_ 전사가 도약한 후 3턴 이내에 다시 도약할 경우, 해당 도약은 _40% 적은_ 충전량을 소모합니다.\n\n_+4:_ 전사가 도약한 후 3턴 이내에 다시 도약할 경우, 해당 도약은 _50% 적은_ 충전량을 소모합니다.

actors.hero.talent.expanding_wave.title=확장된 충격파
actors.hero.talent.expanding_wave.desc=_+1:_ 충격파의 거리가 기존 5타일에서 _6타일_ 로 증가하고, 폭이 기존 60도에서 _75도_로 증가합니다.\n\n_+2:_ 충격파의 거리가 기존 5타일에서 _7타일_ 로 증가하고, 폭이 기존 60도에서 _90도_로 증가합니다.\n\n_+3:_ 충격파의 거리가 기존 5타일에서 _8타일_ 로 증가하고, 폭이 기존 60도에서 _105도_로 증가합니다.\n\n_+4:_ 충격파의 거리가 기존 5타일에서 _9타일_ 로 증가하고, 폭이 기존 60도에서 _120도_로 증가합니다.
actors.hero.talent.striking_wave.title=충격파 타격
actors.hero.talent.striking_wave.desc=_+1:_ 충격파를 사용할 때 _30% 확률_로 무기의 마법이 발동되고 연속 타격 수치를 늘립니다.\n\n_+2:_ 충격파를 사용할 때 _60% 확률_로 무기의 마법이 발동되고 연속 타격 수치를 늘립니다.\n\n_+3:_ 충격파를 사용할 때 _90% 확률_로 무기의 마법이 발동되고 연속 타격 수치를 늘립니다.\n\n_+4:_ 충격파를 사용할 때 _100% 확률_로 무기의 마법이 발동되고 연속 타격 수치를 늘립니다. 또한 충격파로 발동된 마법의 효과를 _20%_ 증가시킵니다.
actors.hero.talent.shock_force.title=충격력
actors.hero.talent.shock_force.desc=_+1:_ 충격파의 피해량이 _20% 증가_하며, _25% 확률_로 대상을 기절시킵니다.\n\n_+2:_ 충격파의 피해량이 _40% 증가_하며, _50% 확률_로 대상을 기절시킵니다.\n\n_+3:_ 충격파의 피해량이 _60% 증가_하며, _75% 확률_로 대상을 기절시킵니다.\n\n_+4:_ 충격파의 피해량이 _80% 증가_하며, _100% 확률_로 대상을 기절시킵니다.

actors.hero.talent.sustained_retribution.title=지속적인 응징
actors.hero.talent.sustained_retribution.desc=_+1:_ 전사는 100%의 추가 피해로 1회 공격하는 대신, 총 _115%의 추가 피해_를 _2회_에 나누어 입힙니다.\n\n_+2:_ 전사는 100%의 추가 피해로 1회 공격하는 대신, 총 _130%의 추가 피해_를 _3회_에 나누어 입힙니다.\n\n_+3:_ 전사는 100%의 추가 피해로 1회 공격하는 대신, 총 _145%의 추가 피해_를 _4회_에 나누어 입힙니다.\n\n_+4:_ 전사는 100%의 추가 피해로 1회 공격하는 대신, 총 _160%의 추가 피해_를 _5회_에 나누어 입힙니다.
actors.hero.talent.shrug_it_off.title=무시하기
actors.hero.talent.shrug_it_off.desc=_+1:_ 전사가 인내하는 동안 얻는 피해 감소량이 기존 50%에서 _60%_로 증가합니다.\n\n_+2:_ 전사가 인내하는 동안 얻는 피해 감소량이 기존 50%에서 _68%_로 증가합니다.\n\n_+3:_ 전사가 인내하는 동안 얻는 피해 감소량이 기존 50%에서 _74%_로 증가합니다.\n\n_+4:_ 전사가 인내하는 동안 얻는 피해 감소량이 기존 50%에서 _80%_로 증가합니다.
actors.hero.talent.even_the_odds.title=균등한 기회
actors.hero.talent.even_the_odds.desc=_+1:_ 전사는 인내가 끝났을 때 주변 2타일 이내에 있던 모든 적 하나 당 기존 추가 피해에 더불어 _5%의 추가 피해_를 입힙니다.\n\n_+2:_ 전사는 인내가 끝났을 때 주변 2타일 이내에 있던 모든 적 하나 당 기존 추가 피해에 더불어 _10%의 추가 피해_를 입힙니다.\n\n_+3:_ 전사는 인내가 끝났을 때 주변 2타일 이내에 있던 모든 적 하나 당 기존 추가 피해에 더불어 _15%의 추가 피해_를 입힙니다.\n\n_+4:_ 전사는 인내가 끝났을 때 주변 2타일 이내에 있던 모든 적 하나 당 기존 추가 피해에 더불어 _20%의 추가 피해_를 입힙니다.

#mage
actors.hero.talent.empowering_meal.title=힘이 나는 식사
actors.hero.talent.empowering_meal.desc=_+1:_ 식사 후 다음 3번의 마법 막대 발사의 피해량이 _2_만큼 증가합니다.\n\n_+2:_ 식사 후 다음 3번의 마법 막대 발사의 피해량이 _3_만큼 증가합니다.
actors.hero.talent.scholars_intuition.title=학자의 직감
actors.hero.talent.scholars_intuition.desc=_+1:_ 마법 막대를 _3배 빠르게_ 감정합니다.\n\n_+2:_ 마법 막대를 _사용하는 즉시_ 감정합니다.
actors.hero.talent.lingering_magic.title=잔류 마력
actors.hero.talent.lingering_magic.desc=_+1:_ 마법사가 지팡이나 마법 막대를 발사하면 다음 물리 공격의 피해량이 _1-2_ 증가합니다.\n\n_+2:_ 마법사가 지팡이나 마법 막대를 발사하면 다음 물리 공격의 피해량이 _2_ 증가합니다.
actors.hero.talent.backup_barrier.title=예비 방어막
actors.hero.talent.backup_barrier.desc=_+1:_ 마법사의 지팡이의 마지막 충전량을 사용할 때마다 _3 만큼의 방어막_을 얻습니다.\n\n_+2:_ 마법사의 지팡이의 마지막 충전량을 사용할 때마다 _5 만큼의 방어막_을 얻습니다.
actors.hero.talent.backup_barrier.meta_desc=_다른 직업이 이 특성을 얻으면,_ 가장 높은 강화 수치의 마법 막대가 발동됩니다.

actors.hero.talent.energizing_meal.title=에너지 넘치는 식사
actors.hero.talent.energizing_meal.desc=_+1:_ 식사에 1턴만 소모되며, 식사 시 _5턴의 충전 효과_를 얻습니다.\n\n_+2:_ 식사에 1턴만 소모되며, 식사 시 _8턴의 충전 효과_를 얻습니다.
actors.hero.talent.inscribed_power.title=각인된 힘
actors.hero.talent.inscribed_power.desc=_+1:_ 주문서, 주문을 사용한 이후 _다음 2번_의 마법 막대 발사에 +2의 강화 수치가 더해집니다.\n\n_+2:_ 주문서, 주문을 사용한 이후 _다음 3번_의 마법 막대 발사에 +2의 강화 수치가 더해집니다.\n\n마법 막대 강화 효과는 강화의 주문서, 변환의 주문서 및 이 주문서를 재료로 사용하여 만든 연금술 아이템을 사용했을 때 발사 수가 2배 증가합니다.\n\n사용한 물약의 수보다 많은 양의 결과물을 제작하는 연금술 아이템(예: 주문)의 경우, 이 특성은 그 결과물의 개수에 따라 발동할 확률이 달라집니다.
actors.hero.talent.wand_preservation.title=마법막대 보존
actors.hero.talent.wand_preservation.desc=_+1:_ 마법사의 지팡이에 새로운 마법 막대를 융합할 때, 지팡이에 융합되어 있던 마법 막대가 +0인 상태로 반환됩니다. 이 효과는 _최대 한 번 적용됩니다._\n\n_+2:_ 마법사의 지팡이에 새로운 마법 막대를 융합할 때, 지팡이에 융합되어 있던 마법 막대가 +0인 상태로 반환됩니다. 이 효과는 _영웅의 레벨이 오를 때마다 다시 사용할 수 있게 됩니다._
actors.hero.talent.wand_preservation.meta_desc=_다른 직업이 이 특성을 얻으면,_ 마법 막대를 연금술 솥에 넣었을 때 얻는 신비한 송진의 양이 +1일때 1개, +2일때 2개 증가합니다.
actors.hero.talent.arcane_vision.title=비전 시야
actors.hero.talent.arcane_vision.desc=_+1:_ 마법을 적에게 맞힌 경우 해당 적에 대해 _10 턴의 심안 효과_를 얻습니다.\n\n_+2:_ 마법을 적에게 맞힌 경우 해당 적에 대해 _15 턴의 심안 효과_를 얻습니다.
actors.hero.talent.shield_battery.title=방어막 충전
actors.hero.talent.shield_battery.desc=_+1:_ 자신에게 마법 막대를 발사하면, 남은 충전량을 모두 소모하고 충전량당 _최대 체력의 4%_에 해당하는 방어막을 얻습니다.\n\n_+2:_ 자신에게 마법 막대를 발사하면, 남은 충전량을 모두 소모하고 충전량당 _최대 체력의 6%_에 해당하는 방어막을 얻습니다.

actors.hero.talent.desperate_power.title=필사적인 힘
actors.hero.talent.desperate_power.desc=_+1:_ 마법사의 마법 막대와 지팡이의 현재 충전량이 1일 때 최종 발사에 강화 수치가 _+1_ 만큼 증가합니다.\n\n_+2:_ 마법사의 마법 막대와 지팡이의 현재 충전량이 1일 때 최종 발사에 강화 수치가 _+2_ 만큼 증가합니다.\n\n_+3:_ 마법사의 마법 막대와 지팡이의 현재 충전량이 1일 때 최종 발사에 강화 수치가 _+3_ 만큼 증가합니다.
actors.hero.talent.ally_warp.title=아군 순간이동
actors.hero.talent.ally_warp.desc=_+1:_ 마법사는 _2타일_ 내의 아군을 선택하여 즉시 위치를 바꿀 수 있습니다.\n\n_+2:_ 마법사는 _4타일_ 내의 아군을 선택하여 즉시 위치를 바꿀 수 있습니다.\n\n_+3:_ 마법사는 _6타일_ 내의 아군을 선택하여 즉시 위치를 바꿀 수 있습니다.\n\n이 특성은 움직일 수 없는 아군에게는 사용할 수 없습니다.

actors.hero.talent.empowered_strike.title=강력한 일격
actors.hero.talent.empowered_strike.desc=_+1:_ 전투 마법사는 지팡이 발사 이후 첫 지팡이 근접 공격 피해량이 _+16%_ , 지팡이 추가 효과의 위력이 _+50%_ 증가합니다.\n\n_+2:_ 전투 마법사는 지팡이 발사 이후 첫 지팡이 근접 공격 피해량이 _+33%_ , 지팡이 추가 효과의 위력이 _+100%_ 증가합니다.\n\n_+3:_ 전투 마법사는 지팡이 발사 이후 첫 지팡이 근접 공격 피해량이 _+50%_ , 지팡이 추가 효과의 위력이 _+150%_ 증가합니다.
actors.hero.talent.mystical_charge.title=신비한 충전
actors.hero.talent.mystical_charge.desc=_+1:_ 전투 마법사는 지팡이 근접 공격이 명중할 때마다 _0.5턴_의 유물 충전 효과를 얻습니다.\n\n_+2:_ 전투 마법사는 지팡이 근접 공격이 명중할 때마다 _1턴_의 유물 충전 효과를 얻습니다.\n\n_+3:_ 전투 마법사는 지팡이 근접 공격이 명중할 때마다 _1.5턴_의 유물 충전 효과를 얻습니다.
actors.hero.talent.excess_charge.title=과충전
actors.hero.talent.excess_charge.desc=_+1:_  전투 마법사의 지팡이가 전부 충전되어 있을 때, 다음 지팡이 사용 시 지팡이 강화 수치의 _0.67배의 방어막_을 얻습니다.\n\n_+2:_ 전투 마법사의 지팡이가 전부 충전되어 있을 때, 다음 지팡이 사용 시 지팡이 강화 수치의 _1.33배의 방어막_을 얻습니다.\n\n_+3:_ 전투 마법사의 지팡이가 전부 충전되어 있을 때,  다음 지팡이 사용 시 지팡이 강화 수치의 _2배의 방어막_을 얻습니다.

actors.hero.talent.soul_siphon.title=영혼 흡수
actors.hero.talent.soul_siphon.desc=_+1:_ 다른 캐릭터의 물리 공격이 영혼의 낙인을 _13% 효율_로 발동시킵니다.\n\n_+2:_ 다른 캐릭터의 물리 공격이 영혼의 낙인을 _27% 효율_로 발동시킵니다.\n\n_+3:_ 다른 캐릭터의 물리 공격이 영혼의 낙인을 _40% 효율_로 발동시킵니다.
actors.hero.talent.soul_eater.title=영혼 포식자
actors.hero.talent.soul_eater.desc=_+1:_ 흑마법사는 영혼의 낙인이 새겨진 적에게 가하는 물리 피해 1 당 _0.33 턴_의 허기를 회복합니다. 낙인이 새겨진 적이 죽을 때 _10% 확률_로 음식 섭취 효과가 발동됩니다.\n\n_+2:_ 흑마법사는 영혼의 낙인이 새겨진 적에게 가하는 물리 피해 1 당 _0.67 턴_의 허기를 회복합니다. 낙인이 새겨진 적이 죽을 때 _20% 확률_로 음식 섭취 효과가 발동됩니다.\n\n_+3:_ 흑마법사는 영혼의 낙인이 새겨진 적에게 가하는 물리 피해 1 당 _1 턴_의 허기를 회복합니다. 낙인이 새겨진 적이 죽을 때 _30% 확률_로 음식 섭취 효과가 발동됩니다.
actors.hero.talent.necromancers_minions.title=사령술사의 하수인
actors.hero.talent.necromancers_minions.desc=_+1:_ 영혼의 낙인이 걸린 적이 죽었을 때, _13% 확률_로 그 자리에 타락한 망령을 일으킵니다.\n\n_+2:_ 영혼의 낙인이 걸린 적이 죽었을 때, _27% 확률_로 그 자리에 타락한 망령을 일으킵니다.\n\n_+3:_ 영혼의 낙인이 걸린 적이 죽었을 때, _40% 확률_로 그 자리에 타락한 망령을 일으킵니다.

actors.hero.talent.blast_radius.title=폭발 반경
actors.hero.talent.blast_radius.desc=_+1:_ 원소 폭발의 범위가 4타일에서 _5타일_로 증가합니다. \n\n_+2:_ 원소 폭발의 범위가 4타일에서 _6타일_로 증가합니다. \n\n_+3:_ 원소 폭발의 범위가 4타일에서 _7타일_로 증가합니다. \n\n_+4:_ 원소 폭발의 범위가 4타일에서 _8타일_로 증가합니다.
actors.hero.talent.elemental_power.title=원소의 힘
actors.hero.talent.elemental_power.desc=_+1:_ 원소 폭발의 위력이  _25%_ 증가합니다. \n\n_+2:_ 원소 폭발의 위력이 _50%_ 증가합니다. \n\n_+3:_ 원소 폭발의 위력이 _75%_ 증가합니다. \n\n_+4:_ 원소 폭발의 위력이 _100%_ 증가합니다.
actors.hero.talent.reactive_barrier.title=반응형 방어막
actors.hero.talent.reactive_barrier.desc=_+1:_ 마법사는 원소 폭발에 영향 받은 대상 하나 당 _2.5의 방어막_을 얻습니다. 이 효과는 최대 5명의 적까지만 적용됩니다.\n\n_+2:_ 마법사는 원소 폭발에 영향 받은 대상 하나 당 _5의 방어막_을 얻습니다. 이 효과는 최대 6명의 적까지만 적용됩니다.\n\n_+3:_ 마법사는 원소 폭발에 영향 받은 대상 하나 당 _7.5의 방어막_을 얻습니다. 이 효과는 최대 7명의 적까지만 적용됩니다.\n\n_+4:_ 마법사는 원소 폭발에 영향 받은 대상 하나 당 _10의 방어막_을 얻습니다. 이 효과는 최대 8명의 적까지만 적용됩니다.

actors.hero.talent.wild_power.title=격렬한 힘
actors.hero.talent.wild_power.desc=_+1:_ 격렬한 마법으로 발사 중인 마법 막대가 _+2-3만큼, 최대 +4까지_ 강화됩니다.\n\n_+2:_ 격렬한 마법으로 발사 중인 마법 막대가 _+3만큼, 최대 +5까지_ 강화됩니다.\n\n_+3:_ 격렬한 마법으로 발사 중인 마법 막대가 _+3-4만큼, 최대 +6까지_ 강화됩니다.\n\n_+4:_ 격렬한 마법으로 발사 중인 마법 막대가 _+4만큼, 최대 +7까지_ 강화됩니다.
actors.hero.talent.fire_everything.title=전탄 발사
actors.hero.talent.fire_everything.desc=_+1:_ 격렬한 마법이 _최대 5번_까지 발사되며, 각각의 마법 막대가 _25% 확률_로 3번까지 발사됩니다.\n\n_+2:_  격렬한 마법이 _최대 6번_까지 발사되며, 각각의 마법 막대가 _50% 확률_로 3번까지 발사됩니다.\n\n_+3:_  격렬한 마법이 _최대 7번_까지 발사되며, 각각의 마법 막대가 _75% 확률_로 3번까지 발사됩니다.\n\n_+4:_  격렬한 마법이 _최대 8번_까지 발사되며, 각각의 마법 막대가 _100% 확률_로 3번까지 발사됩니다.
actors.hero.talent.conserved_magic.title=보존된 마법
actors.hero.talent.conserved_magic.desc=_+1:_ 격렬한 마법 사용 시, 매 발사마다 소모되는 충전량이 기존 0.5에서 _0.33_으로 감소하며, _25%_의 확률로 턴을 소모하지 않습니다.\n\n_+2:_ 격렬한 마법 사용 시, 매 발사마다 소모되는 충전량이 기존 0.5에서 _0.225_로 감소하며, _50%_의 확률로 턴을 소모하지 않습니다.\n\n_+3:_ 격렬한 마법 사용 시, 매 발사마다 소모되는 충전량이 기존 0.5에서 _0.15_로 감소하며, _75%_의 확률로 턴을 소모하지 않습니다.\n\n_+4:_ 격렬한 마법 사용 시, 매 발사마다 소모되는 충전량이 기존 0.5에서 _0.1_로 감소하며, _100%_의 확률로 턴을 소모하지 않습니다.

actors.hero.talent.telefrag.title=순간이동 처치
actors.hero.talent.telefrag.desc=_+1:_ 마법사가 다른 대상에게 순간이동하면 대상에게 _10-15의 피해_를 입히지만, 자신 역시 _5의 피해_를 입습니다.\n\n_+2:_ 마법사가 다른 대상에게 순간이동하면 대상에게 _20-30의 피해_를 입히지만, 자신 역시 _10의 피해_를 입습니다.\n\n_+3:_ 마법사가 다른 대상에게 순간이동하면 대상에게 _30-45의 피해_를 입히지만, 자신 역시 _15의 피해_를 입습니다.\n\n_+4:_ 마법사가 다른 대상에게 순간이동하면 대상에게 _40-60의 피해_를 입히지만, 자신 역시 _20의 피해_를 입습니다.\n\n영웅은 이 효과로 죽지 않으며, 자가 피해는 항마 효과로 경감할 수 있습니다.
actors.hero.talent.remote_beacon.title=원격 신호기
actors.hero.talent.remote_beacon.desc=_+1:_ 마법사는 _4타일_ 이내에 있는 모든 위치에 신호기를 설치할 수 있습니다.\n\n_+2:_ 마법사는 _8타일_ 이내에 있는 모든 위치에 신호기를 설치할 수 있습니다.\n\n_+3:_ 마법사는 _12타일_ 이내에 있는 모든 위치에 신호기를 설치할 수 있습니다.\n\n_+4:_ 마법사는 _16타일_ 이내에 있는 모든 위치에 신호기를 설치할 수 있습니다.\n\n마법사가 접근 불가능한 위치에는 신호기를 설치할 수 없습니다.
actors.hero.talent.longrange_warp.title=장거리 순간이동
actors.hero.talent.longrange_warp.desc=_+1:_ 마법사는 기존 대비 _150%의 충전량_을 소모하여 다른 층으로 순간이동할 수 있습니다.\n\n_+2:_ 마법사는 기존 대비 _117%의 충전량_을 소모하여 다른 층으로 순간이동할 수 있습니다.\n\n_+3:_ 마법사는 기존 대비 _83%의 충전량_을 소모하여 다른 층으로 순간이동할 수 있습니다.\n\n_+4:_ 마법사는 기존 대비 _50%의 충전량_을 소모하여 다른 층으로 순간이동할 수 있습니다.\n\n마법사는 장거리 순간이동을 이용해 잠긴 층에서 빠져나올 수 없습니다.

#rogue
actors.hero.talent.cached_rations.title=은닉한 보존식
actors.hero.talent.cached_rations.desc=_+1:_ 다음에 탐험하는 몇 개의 층 내에서 상자에 보관되어 있는 보급 식량을 최대 _2개_ 찾을 수 있게 됩니다.\n\n_+2:_ 다음에 탐험하는 몇 개의 층 내에서 상자에 보관되어 있는 보급 식량을 최대 _3개_ 찾을 수 있게 됩니다.\n\n보급 식량은 빠르게 먹을 수 있으며, 적당한 양의 포만감과 5의 체력을 회복하고 그림자의 망토의 충전량을 1만큼 충전합니다.
actors.hero.talent.thiefs_intuition.title=도둑의 직감
actors.hero.talent.thiefs_intuition.desc=_+1:_ 반지를 _2배 빠르게 감정_하며, 반지의 종류를 _착용하는 즉시_ 감정합니다.\n\n_+2:_ 반지를 _착용하는 즉시 감정_하며, 반지의 종류를 _획득하는 즉시_ 감정합니다.
actors.hero.talent.sucker_punch.title=불시의 타격
actors.hero.talent.sucker_punch.desc=_+1:_ 적을 처음 기습할 때 _1-2 만큼의 추가 피해_를 입힙니다.\n\n_+2:_ 적을 처음 기습할 때 _2 만큼의 추가 피해_를 입힙니다.
actors.hero.talent.protective_shadows.title=보호의 그림자
actors.hero.talent.protective_shadows.desc=_+1:_ 투명화 상태가 되면 _매 2턴마다_ 1 의 방어막을 얻으며, _최대 3_ 까지 얻을 수 있습니다.\n\n_+2:_ 투명화 상태가 되면 _매 턴마다_ 1 의 방어막을 얻으며, _최대 5_ 까지 얻을 수 있습니다.

actors.hero.talent.mystical_meal.title=신비한 식사
actors.hero.talent.mystical_meal.desc=_+1:_ 식사에 1 턴만 소모되며(보급 식량은 즉시 먹을 수 있습니다), 식사 시 _3 턴의 유물 충전 효과_를 얻습니다.\n\n_+2:_ 식사에 1 턴만 소모되며(보급 식량은 즉시 먹을 수 있습니다), 식사 시 _5 턴의 유물 충전 효과_를 얻습니다.\n\n풍요의 뿔로 유물 충전 효과를 얻은 경우 풍요의 뿔은 충전되지 않습니다.
actors.hero.talent.inscribed_stealth.title=각인된 은밀성
actors.hero.talent.inscribed_stealth.desc=_+1:_ 주문서, 주문을 사용한 이후 _3턴_의 투명화를 얻습니다.\n\n_+2:_ 주문서, 주문을 사용한 이후 _5턴_의 투명화를 얻습니다.\n\n투명화의 지속 시간은 강화의 주문서, 변환의 주문서 및 이 주문서를 재료로 사용하여 만든 연금술 아이템을 사용했을 때 2배가 됩니다.\n\n사용한 물약의 수보다 많은 양의 결과물을 제작하는 연금술 아이템(예: 주문)의 경우, 이 특성은 그 결과물의 개수에 따라 발동할 확률이 달라집니다.
actors.hero.talent.wide_search.title=광범위한 탐색
actors.hero.talent.wide_search.desc=_+1:_ 탐색 범위가 5x5 사각형에서 _7x7 원형_으로 증가합니다.\n\n_+2:_ 탐색 범위가 5x5 사각형에서 _7x7 사각형_으로 증가합니다.
actors.hero.talent.wide_search.meta_desc=_다른 직업이 이 특성을 얻으면,_ +1일 때 탐색 범위가 5x5 범위의 원형으로, +2일 때 탐색 범위가 5x5 범위의 사각형으로 늘어납니다.
actors.hero.talent.silent_steps.title=조용한 발걸음
actors.hero.talent.silent_steps.desc=_+1:_ 적이 _3타일 이상_ 떨어져 있을 경우 자고 있는 적을 깨우지 않습니다.\n\n_+2:_ _적에게 근접하지 않는 한_ 자고 있는 적을 깨우지 않습니다.
actors.hero.talent.rogues_foresight.title=도적의 예지
actors.hero.talent.rogues_foresight.desc=_+1:_ 도적이 비밀 방이 있는 층에 처음 진입할 때, _75% 의 확률_로 해당 층에 숨겨진 비밀이 있음을 간파합니다.\n\n_+2:_ 도적이 비밀 방이 있는 층에 처음 진입할 때, _100% 의 확률_로 해당 층에 숨겨진 비밀이 있음을 간파합니다.

actors.hero.talent.light_cloak.title=경량화 망토
actors.hero.talent.light_cloak.desc=_+1:_ 도적은 그림자의 망토를 착용하지 않고도 사용할 수 있지만, 착용하지 않은 망토는 충전 속도가 _25%_로 감소합니다.\n\n_+2:_ 도적은 그림자의 망토를 착용하지 않고도 사용할 수 있지만, 착용하지 않은 망토는 충전 속도가 _50%_로 감소합니다.\n\n_+3:_ 도적은 그림자의 망토를 착용하지 않고도 사용할 수 있지만, 착용하지 않은 망토는 충전 속도가 _75%_로 감소합니다.
actors.hero.talent.light_cloak.meta_desc=_다른 직업이 이 특성을 얻으면,_ 특성 레벨에 따라 모든 유물의 충전 속도가 7/13/20% 증가합니다.
actors.hero.talent.enhanced_rings.title=향상된 반지
actors.hero.talent.enhanced_rings.desc=_+1:_ 도적이 유물을 사용했을 때, 반지들의 강화 수치가 _3 턴_ 동안 +1 만큼 증가합니다.\n\n_+2:_ 도적이 유물을 사용했을 때, 반지들의 강화 수치가 _6 턴_ 동안 +1 만큼 증가합니다.\n\n_+3:_ 도적이 유물을 사용했을 때, 반지들의 강화 수치가 _9 턴_ 동안 +1 만큼 증가합니다.

actors.hero.talent.enhanced_lethality.title=향상된 치사율
actors.hero.talent.enhanced_lethality.desc=_+1:_ 암살자의 마음가짐 단계에 따라 체력이 _4/13/27/67%_ 미만인 적을 일격에 처치할 수 있게 됩니다.\n\n_+2:_ 암살자의 마음가짐 단계에 따라 체력이 _5/17/33/83%_ 미만인 적을 일격에 처치할 수 있게 됩니다.\n\n_+3:_ 암살자의 마음가짐 단계에 따라 체력이 _6/20/40/100%_ 미만인 적을 일격에 처치할 수 있게 됩니다.\n\n암살자는 기본적으로 마음가짐 단계에 따라 체력이 3/10/20/50% 미만인 적을 일격에 처치할 수 있습니다.
actors.hero.talent.assassins_reach.title=암살자의 접근
actors.hero.talent.assassins_reach.desc=_+1:_ 암살자의 마음가짐 단계에 따라 점멸할 수 있는 거리가 기존 1/2/3/4 타일에서 _1/3/4/6 타일_로 증가합니다.\n\n_+2:_ 암살자의 마음가짐 단계에 따라 점멸할 수 있는 거리가 기존 1/2/3/4 타일에서 _2/4/6/8 타일_로 증가합니다.\n\n_+3:_ 암살자가 마음가짐 단계에 따라 점멸할 수 있는 거리가 기존 1/2/3/4 타일에서 _2/5/7/10 타일_로 증가합니다.\n\n암살자는 함정과 적을 넘어서 점멸할 수 있지만, 벽처럼 단단한 지형 등은 뚫지 못합니다.
actors.hero.talent.bounty_hunter.title=현상금 사냥꾼
actors.hero.talent.bounty_hunter.desc=_+1:_ 암살자가 마음가짐 공격으로 처치한 적이 아이템을 떨어트릴 확률이 그 단계에 따라 _2/4/8/16%_ 증가합니다.\n\n_+2:_ 암살자가 마음가짐 공격으로 처치한 적이 아이템을 떨어트릴 확률이 그 단계에 따라 _4/8/16/32%_ 증가합니다.\n\n_+3:_ 암살자가 마음가짐 공격으로 처치한 적이 아이템을 떨어트릴 확률이 그 단계에 따라 _6/12/24/48%_ 증가합니다.

actors.hero.talent.evasive_armor.title=기민한 갑옷
actors.hero.talent.evasive_armor.desc=_+1:_ 프리러닝 중에, 갑옷의 힘 요구 수치를 초과한 영웅의 힘 1당 _+1 의 추가 회피_를 얻습니다.\n\n_+2:_ 프리러닝 중에, 갑옷의 힘 요구 수치를 초과한 영웅의 힘 1당 _+2 의 추가 회피_를 얻습니다.\n\n_+3:_ 프리러닝 중에, 갑옷의 힘 요구 수치를 초과한 영웅의 힘 1당 _+3 의 추가 회피_를 얻습니다.
actors.hero.talent.projectile_momentum.title=발사체 가속
actors.hero.talent.projectile_momentum.desc=_+1:_ 프리러닝 도중, 투척 무기에 _+50%의 정확성과 +15%의 피해량_을 얻습니다.\n\n_+2:_ 프리러닝 도중, 투척 무기에 _+100%의 정확성과 +30%의 피해량_을 얻습니다.\n\n_+3:_ 프리러닝 도중, 투척 무기에 _+150%의 정확성과 +45%의 피해량_을 얻습니다.
actors.hero.talent.speedy_stealth.title=은신 가속
actors.hero.talent.speedy_stealth.desc=_+1:_ 프리러너는 은신 중에 매 턴마다 2의 가속력을 쌓습니다.\n\n_+2:_ +1의 효과에 더불어, 프리러너가 은신 중일 때는 프리러닝 지속 시간이 감소하지 않습니다.\n\n_+3:_ +1, +2의 효과에 더불어, 프리러너는 프리러닝에 상관없이 은신 중에 2배의 속도로 이동합니다.

actors.hero.talent.hasty_retreat.title=빠른 후퇴
actors.hero.talent.hasty_retreat.desc=_+1:_ 도적은 점멸한 후 _1턴_ 동안 신속과 투명화 효과를 얻습니다.\n\n_+2:_ 도적은 점멸한 후 _2턴_ 동안 신속과 투명화 효과를 얻습니다.\n\n_+3:_ 도적은 점멸한 후 _3턴_ 동안 신속과 투명화 효과를 얻습니다.\n\n_+4:_ 도적은 점멸한 후 _4턴_ 동안 신속과 투명화 효과를 얻습니다.
actors.hero.talent.body_replacement.title=몸 바꿔치기
actors.hero.talent.body_replacement.desc=_+1:_ 도적은 점멸한 후 _20의 체력과 1-3의 방어력_을 가진 통나무 미끼를 남깁니다. \n\n_+2:_ 도적은 점멸한 후 _40의 체력과 2-6의 방어력_을 가진 통나무 미끼를 남깁니다. \n\n_+3:_ 도적은 점멸한 후 _60의 체력과 3-9의 방어력_을 가진 통나무 미끼를 남깁니다. \n\n_+4:_ 도적은 점멸한 후 _80의 체력과 4-12의 방어력_을 가진 통나무 미끼를 남깁니다. \n\n한 번에 하나의 미끼만 존재할 수 있습니다.
actors.hero.talent.shadow_step.title=그림자 밟기
actors.hero.talent.shadow_step.desc=_+1:_ 도적이 투명화 상태에서 연막탄을 사용하면 즉시 발동하며 기존 대비 _16% 적은_ 충전량을 사용하지만, 적들을 실명시키지 않고 다른 특성을 발동시키지도 않습니다.\n\n_+2:_ 도적이 투명화 상태에서 연막탄을 사용하면 즉시 발동하며 기존 대비 _30% 적은_ 충전량을 사용하지만, 적들을 실명시키지 않고 다른 특성을 발동시키지도 않습니다.\n\n_+3:_ 도적이 투명화 상태에서 연막탄을 사용하면 즉시 발동하며 기존 대비 _41% 적은_ 충전량을 사용하지만, 적들을 실명시키지 않고 다른 특성을 발동시키지도 않습니다.\n\n_+4:_ 도적이 투명화 상태에서 연막탄을 사용하면 즉시 발동하며 기존 대비 _50% 적은_ 충전량을 사용하지만, 적들을 실명시키지 않고 다른 특성을 발동시키지도 않습니다.

actors.hero.talent.fear_the_reaper.title=사신을 두려워하라
actors.hero.talent.fear_the_reaper.desc=_+1:_ 죽음의 표식이 새겨진 적의 체력이 0이 되면, 대상을 _불구_ 상태로 만듭니다.\n\n_+2:_ 죽음의 표식이 새겨진 적의 체력이 0이 되면, 대상을 _공포, 불구_ 상태로 만듭니다.\n\n_+3:_ 죽음의 표식이 새겨진 적의 체력이 0이 되면, 대상을 _공포, 불구_ 상태로 만들고, 3타일 이내에 있는 모든 적을 _불구_ 상태로 만듭니다.\n\n_+4:_ 죽음의 표식이 새겨진 적의 체력이 0이 되면, 대상을 _공포, 불구_ 상태로 만들고, 3타일 이내에 있는 모든 적을 _공포, 불구_ 상태로 만듭니다.
actors.hero.talent.deathly_durability.title=치명적인 내구력
actors.hero.talent.deathly_durability.desc=_+1:_ 죽음의 표식에 걸린 적이 사망하면, 해당 적이 표식에 걸린 시점의 체력의 _13%_ 만큼 방어막을 얻습니다. \n\n_+2:_ 죽음의 표식에 걸린 적이 사망하면, 해당 적이 표식에 걸린 시점의 체력의 _25%_ 만큼 방어막을 얻습니다. \n\n_+3:_ 죽음의 표식에 걸린 적이 사망하면, 해당 적이 표식에 걸린 시점의 체력의 _38%_ 만큼 방어막을 얻습니다. \n\n_+4:_ 죽음의 표식에 걸린 적이 사망하면, 해당 적이 표식에 걸린 시점의 체력의 _50%_ 만큼 방어막을 얻습니다.
actors.hero.talent.double_mark.title=이중 표식
actors.hero.talent.double_mark.desc=_+1:_ 한 턴에 표식을 두 번 새길 경우, 두 번째 표식은 _30% 적은_충전량을 소모합니다.\n\n_+2:_  한 턴에 표식을 두 번 새길 경우, 두 번째 표식은 _50% 적은_충전량을 소모합니다.\n\n_+3:_  한 턴에 표식을 두 번 새길 경우, 두 번째 표식은 _65% 적은_충전량을 소모합니다.\n\n_+4:_  한 턴에 표식을 두 번 새길 경우, 두 번째 표식은 _75% 적은_충전량을 소모합니다.

actors.hero.talent.shadow_blade.title=그림자 칼날
actors.hero.talent.shadow_blade.desc=_+1:_ 그림자 분신의 공격력이 영웅의 턴당 피해량의 _8%_ 만큼 증가하며, _25% 확률_로 공격에 영웅의 무기에 있는 마법이 발동됩니다.\n\n_+2:_ 그림자 분신의 공격력이 영웅의 턴당 피해량의 _16%_ 만큼 증가하며, _50% 확률_로 공격에 영웅의 무기에 있는 마법이 발동됩니다.\n\n_+3:_ 그림자 분신의 공격력이 영웅의 턴당 피해량의 _24%_ 만큼 증가하며, _75% 확률_로 공격에 영웅의 무기에 있는 마법이 발동됩니다.\n\n_+4:_ 그림자 분신의 공격력이 영웅의 턴당 피해량의 _32%_ 만큼 증가하며, _100% 확률_로 공격에 영웅의 무기에 있는 마법이 발동됩니다.
actors.hero.talent.cloned_armor.title=복제된 갑옷
actors.hero.talent.cloned_armor.desc=_+1:_ 그림자 분신이 영웅이 가진 방어력의 _12%_ 만큼 방어력을 얻고, 피격 시 _25% 확률_로 영웅의 갑옷에 부여된 상형문자가 발동됩니다.\n\n_+2:_ 그림자 분신이 영웅이 가진 방어력의 _24%_ 만큼의 방어력을 얻고, 피격 시 _50% 확률_로 영웅의 갑옷에 부여된 상형문자가 발동됩니다.\n\n_+3:_ 그림자 분신이 영웅이 가진 방어력의 _36%_ 만큼의 방어력을 얻고, 피격 시 _75% 확률_로 영웅의 갑옷에 부여된 상형문자가 발동됩니다.\n\n_+4:_ 그림자 분신이 영웅이 가진 방어력의 _48%_ 만큼의 방어력을 얻고, 피격 시 _100% 확률_로 영웅의 갑옷에 부여된 상형문자가 발동됩니다.
actors.hero.talent.perfect_copy.title=완벽한 복제
actors.hero.talent.perfect_copy.desc=_+1:_ 그림자 분신은 영웅의 최대 체력의 _10%_ 만큼의 체력을 얻고, 영웅과 _1 타일_ 이내에 있는 분신과 즉시 위치를 바꿀 수 있습니다.\n\n_+1:_ 그림자 분신은 영웅의 최대 체력의 _20%_ 만큼의 체력을 얻고, 영웅과 _2 타일_ 이내에 있는 분신과 즉시 위치를 바꿀 수 있습니다.\n\n_+1:_ 그림자 분신은 영웅의 최대 체력의 _30%_ 만큼의 체력을 얻고, 영웅과 _3 타일_ 이내에 있는 분신과 즉시 위치를 바꿀 수 있습니다.\n\n_+1:_ 그림자 분신은 영웅의 최대 체력의 _40%_ 만큼의 체력을 얻고, 영웅과 _4 타일_ 이내에 있는 분신과 즉시 위치를 바꿀 수 있습니다.

#huntress
actors.hero.talent.natures_bounty.title=자연의 은혜
actors.hero.talent.natures_bounty.desc=_+1:_ 다음에 탐험하는 몇 개의 층 내에 있는 길게 자란 풀에서 _4개의 열매_를 찾아낼 수 있습니다.\n\n_+2:_ 다음에 탐험하는 몇 개의 층 내에 있는 길게 자란 풀에서 _6개의 열매_를 찾아낼 수 있습니다.\n\n열매는 재빠르게 먹을 수 있으며, 약간의 허기를 회복하고 씨앗을 얻을 수 있습니다.
actors.hero.talent.survivalists_intuition.title=생존자의 직감
actors.hero.talent.survivalists_intuition.desc=_+1:_ 투척 무기를 _3배_ 빠르게 감정합니다.\n\n_+2:_ 투척 무기를 _명중시키는 즉시_ 감정합니다.
actors.hero.talent.followup_strike.title=추가 타격
actors.hero.talent.followup_strike.desc=_+1:_ 활 또는 투척 무기를 적에게 맞춘 경우, 그 적에게 가하는 다음 근접 공격은 _2의 추가 피해_를 입힙니다.\n\n_+2:_ 활 또는 투척 무기를 적에게 맞춘 경우, 그 적에게 가하는 다음 근접 공격은 _3의 추가 피해_를 입힙니다.
actors.hero.talent.natures_aid.title=자연의 도움
actors.hero.talent.natures_aid.desc=_+1:_ 시야 내에서 식물이 발동할 때 _3턴 마다 감소_하며 0-2의 방어력을 제공하는 나무껍질 효과를 얻습니다. \n\n_+2:_ 시야 내에서 식물이 발동할 때 _5턴 마다 감소_하며 0-2의 방어력을 제공하는 나무껍질 효과를 2 얻습니다.

actors.hero.talent.invigorating_meal.title=활기 넘치는 식사
actors.hero.talent.invigorating_meal.desc=_+1:_ 식사에 1턴(열매는 즉시 먹을 수 있습니다)만 소모되며, 식사 시 _1턴의 신속 효과_를 얻습니다.\n\n_+2:_ 식사에 1턴(열매는 즉시 먹을 수 있습니다)만 소모되며, 식사 시 _2턴의 신속 효과_를 얻습니다.
actors.hero.talent.liquid_nature.title=액체로 이루어진 자연
actors.hero.talent.liquid_nature.desc=_+1:_ 사냥꾼이 물약, 혼합물, 영약을 마시거나 던진 이후 주변 지역에 최대 _4타일_의 풀을 생성하고, 주변에 있는 적들을 _1턴_동안 속박시킵니다.\n\n_+2:_ 사냥꾼이 물약, 혼합물, 영약을 마시거나 던진 이후 주변 지역에 최대 _6타일_의 풀을 생성하고, 주변에 있는 적들을 _2턴_동안 속박시킵니다.\n\n방어막 재생 효과는 힘의 물약, 경험의 물약 및 이 물약을 재료로 사용하여 만든 연금술 아이템을 사용했을 때 2배가 됩니다.\n\n사용한 물약의 수보다 많은 양의 결과물을 제작하는 연금술 아이템(예: 물 혼합물)의 경우, 이 특성은 그 결과물의 개수에 따라 발동할 확률이 달라집니다.
actors.hero.talent.rejuvenating_steps.title=활력의 발걸음
actors.hero.talent.rejuvenating_steps.desc=_+1:_ 사냥꾼이 짧은 풀 또는 타고 남은 재 위에 올라설 경우 길게 자란 풀로 자라나며 즉시 헤쳐진 상태가 됩니다. _10 턴_ 의 재사용 대기 시간이 있습니다.\n\n_+2:_ 사냥꾼이 짧은 풀 또는 타고 남은 재 위에 올라설 경우 길게 자란 풀로 자라나며 즉시 헤쳐진 상태가 됩니다. _5 턴_ 의 재사용 대기 시간이 있습니다.\n\n이 특성은 지속 재생 효과가 중단되거나 경험치를 오랜 시간 얻지 않을 때 자동으로 헤쳐진 풀을 생성합니다.
actors.hero.talent.heightened_senses.title=예리해진 감각
actors.hero.talent.heightened_senses.desc=_+1:_ 주변 _2 타일_에 있는 모든 캐릭터에 대해 심안 효과를 얻습니다.\n\n_+2:_ 주변 _3 타일_에 있는 모든 캐릭터에 대해 심안 효과를 얻습니다.
actors.hero.talent.durable_projectiles.title=튼튼한 투척 무기
actors.hero.talent.durable_projectiles.desc=_+1:_ 사냥꾼이 사용하는 투척 무기의 내구도가 _50%_ 증가합니다.\n\n_+2:_ 사냥꾼이 사용하는 투척 무기의 내구도가 _75%_ 증가합니다.

actors.hero.talent.point_blank.title=근접 투척
actors.hero.talent.point_blank.desc=_+1:_ 영혼의 활 또는 투척 무기의 근거리 명중률 보정이 기존 -50%에서 _-25%_로 변경됩니다.\n\n_+2:_ 영혼의 활 또는 투척 무기의 근거리 명중률 보정이 기존 -50%에서 _0%_로 변경됩니다.\n\n_+3:_ 영혼의 활 또는 투척 무기의 근거리 명중률 보정이 기존 -50%에서 _+25%_로 변경됩니다.\n\n원거리에서의 투척 무기는 항상 +50%의 명중률을 얻습니다.
actors.hero.talent.seer_shot.title=예지의 화살
actors.hero.talent.seer_shot.desc=_+1:_ 사냥꾼이 활을 바닥에 쏘면 착탄 지점을 중심으로 3x3 지역이 _5 턴_ 동안 보입니다. 20 턴의 재사용 대기시간을 가집니다.\n\n_+2:_ 사냥꾼이 활을 바닥에 쏘면 착탄 지점을 중심으로 3x3 지역이 _10 턴_ 동안 보입니다. 20 턴의 재사용 대기시간을 가집니다.\n\n_+3:_ 사냥꾼이 활을 바닥에 쏘면 착탄 지점을 중심으로 3x3 지역이 _15 턴_ 동안 보입니다. 20 턴의 재사용 대기시간을 가집니다.
actors.hero.talent.seer_shot.meta_desc=_다른 직업이 이 특성을 얻으면,_ 모든 투척 무기에 적용됩니다.

actors.hero.talent.farsight.title=천리안
actors.hero.talent.farsight.desc=_+1:_ 저격수의 시야 범위가 _25%_ 만큼 증가합니다.\n\n_+2:_ 저격수의 시야 범위가 _50%_ 만큼 증가합니다.\n\n_+3:_ 저격수의 시야 범위가 _75%_ 만큼 증가합니다.
actors.hero.talent.shared_enchantment.title=마법부여 공유
actors.hero.talent.shared_enchantment.desc=_+1:_ 투척 무기를 던질 때 _33% 확률_로 활의 마법이 적용됩니다.\n\n_+2:_ 투척 무기를 던질 때 _67% 확률_로 활의 마법이 적용됩니다.\n\n_+3:_ 투척 무기를 던질 때 _100% 확률_로 활의 마법이 적용됩니다.\n\n활의 마법은 투척 무기에 이미 부여된 마법과 관계없이 추가로 발동합니다.
actors.hero.talent.shared_upgrades.title=강화 공유
actors.hero.talent.shared_upgrades.desc=_+1:_ 강화된 투척 무기로 공격하는 경우 강화 수치당 저격수의 표식 지속 시간이 1턴씩, 특수 활 공격의 피해량이 16%씩 증가하여, 최대 _+2의 강화수치에서 +2턴, +33% 피해량_을 가지게 됩니다.\n\n_+2:_ 강화된 투척 무기로 공격하는 경우 강화 수치당 저격수의 표식 지속 시간이 1턴씩, 특수 활 공격의 피해량이 16%씩 증가하여, 최대 _+4의 강화수치에서 +4턴, +67% 피해량_을 가지게 됩니다.\n\n_+3:_ 강화된 투척 무기로 공격하는 경우 강화 수치당 저격수의 표식 지속 시간이 1턴씩, 특수 활 공격의 피해량이 16%씩 증가하여, 최대 _+6의 강화수치에서 +6턴, +100% 피해량_을 가지게 됩니다.

actors.hero.talent.durable_tips.title=튼튼한 화살촉
actors.hero.talent.durable_tips.desc=_+1:_ 숲지기가 사용하는 추출물을 묻힌 다트가 _2 배의 내구도_를 가집니다.\n\n_+2:_ 숲지기가 사용하는 추출물을 묻힌 다트가 _3 배의 내구도_를 가집니다.\n\n_+3:_ 숲지기가 사용하는 추출물을 묻힌 다트가 _4 배의 내구도_를 가집니다.
actors.hero.talent.barkskin.title=나무껍질
actors.hero.talent.barkskin.desc=_+1:_ 숲지기는 수풀을 지날 때 매 턴 감소하며 _0-현재 레벨의 50%_의 방어력을 제공하는 나무껍질 효과를 얻습니다.\n\n_+2:_ 숲지기는 수풀을 지날 때 매 턴 감소하며 _0-현재 레벨의 100%_의 방어력을 제공하는 나무껍질 효과를 얻습니다.\n\n_+3:_ 숲지기는 수풀을 지날 때 매 턴 감소하며 _0-현재 레벨의 150%_의 방어력을 제공하는 나무껍질 효과를 얻습니다.
actors.hero.talent.shielding_dew.title=보호의 이슬
actors.hero.talent.shielding_dew.desc=_+1:_ 숲지기는 최대 체력일 때 이슬을 획득하면 초과한 회복량만큼의 방어막을 _최대 체력의 20%_까지 얻습니다.\n\n_+2:_ 숲지기는 최대 체력일 때 이슬을 획득하면 초과한 회복량만큼의 방어막을 _최대 체력의 40%_까지 얻습니다.\n\n_+3:_ 숲지기는 최대 체력일 때 이슬을 획득하면 초과한 회복량만큼의 방어막을 _최대 체력의 60%_까지 얻습니다.

actors.hero.talent.fan_of_blades.title=칼날부채
actors.hero.talent.fan_of_blades.desc=_+1:_ 유령 칼날이 최대 _1명의 추가 대상_에게 50% 피해로 적중합니다. 대상은 반드시 _30도_의 부채꼴 범위 내 보이는 곳에 있어야 합니다.\n\n_+2:_ 유령 칼날이 최대 _2명의 추가 대상_에게 50% 피해로 적중합니다. 대상은 반드시 _60도_의 부채꼴 범위 내 보이는 곳에 있어야 합니다.\n\n_+3:_ 유령 칼날이 최대 _3명의 추가 대상_에게 50% 피해로 적중합니다. 대상은 반드시 _90도_의 부채꼴 범위 내 보이는 곳에 있어야 합니다.\n\n_+4:_ 유령 칼날이 최대 _4명의 추가 대상_에게 50% 피해로 적중합니다. 대상은 반드시 _120도_의 부채꼴 범위 내 보이는 곳에 있어야 합니다.
actors.hero.talent.projecting_blades.title=도달의 칼날
actors.hero.talent.projecting_blades.desc=_+1:_ 유령 칼날의 정확도가 _25% 증가_하고, _2개의 단단한 타일_을 관통할 수 있습니다.\n\n_+2:_ 유령 칼날의 정확도가 _50% 증가_하고, _4개의 단단한 타일_을 관통할 수 있습니다.\n\n_+3:_ 유령 칼날의 정확도가 _75% 증가_하고, _6개의 단단한 타일_을 관통할 수 있습니다.\n\n_+4:_ 유령 칼날의 정확도가 _100% 증가_하고, _8개의 단단한 타일_을 관통할 수 있습니다.
actors.hero.talent.spirit_blades.title=영혼의 칼날
actors.hero.talent.spirit_blades.desc=_+1:_ 유령 칼날에 _30% 확률_로 영혼의 활의 마법이 적용됩니다.\n\n_+2:_ 유령 칼날에 _60% 확률_로 영혼의 활의 마법이 적용됩니다.\n\n_+3:_ 유령 칼날에 _90% 확률_로 영혼의 활의 마법이 적용됩니다.\n\n_+4:_ 유령 칼날에 _100% 확률_로 영혼의 활의 마법이 적용됩니다. 또한 유령 칼날에 부여된 각 마법의 효과를 _10%_ 증가시킵니다.

actors.hero.talent.growing_power.title=성장하는 힘
actors.hero.talent.growing_power.desc=_+1:_ 자연의 힘으로 얻는 공격 속도와 이동 속도가 기존 33%/100%에서 _38%/125%_로 증가합니다.\n\n_+2:_ 자연의 힘으로 얻는 공격 속도와 이동 속도가 기존 33%/100%에서 _42%/150%_로 증가합니다.\n\n_+3:_ 자연의 힘으로 얻는 공격 속도와 이동 속도가 기존 33%/100%에서 _46%/175%_로 증가합니다.\n\n_+4:_ 자연의 힘으로 얻는 공격 속도와 이동 속도가 기존 33%/100%에서 _50%/200%_로 증가합니다.
actors.hero.talent.natures_wrath.title=자연의 분노
actors.hero.talent.natures_wrath.desc=_+1:_ 자연의 힘이 활성화된 동안, 영혼의 활로 가하는 공격이 _8% 확률_로 무작위 해로운 식물 효과를 발동합니다.\n\n_+2:_ 자연의 힘이 활성화된 동안, 영혼의 활로 가하는 공격이 _17% 확률_로 무작위 해로운 식물 효과를 발동합니다.\n\n_+3:_ 자연의 힘이 활성화된 동안, 영혼의 활로 가하는 공격이 _25% 확률_로 무작위 해로운 식물 효과를 발동합니다.\n\n_+4:_ 자연의 힘이 활성화된 동안, 영혼의 활로 가하는 공격이 _33% 확률_로 무작위 해로운 식물 효과를 발동합니다.\n\n발동 가능한 식물: 실명초, 화염초, 눈꽃송이, 슬픔이끼, 폭풍덩굴
actors.hero.talent.wild_momentum.title=야생의 관성
actors.hero.talent.wild_momentum.desc=_+1:_ 영혼의 활로 적을 처치하면 자연의 힘의 지속 시간이 _1턴_ 만큼 연장됩니다. 지속 시간은 최대 _2턴_ 까지 연장시킬 수 있습니다.\n\n_+2:_ 영혼의 활로 적을 처치하면 자연의 힘의 지속 시간이 _2턴_ 만큼 연장됩니다. 지속 시간은 최대 _4턴_ 까지 연장시킬 수 있습니다.\n\n_+3:_ 영혼의 활로 적을 처치하면 자연의 힘의 지속 시간이 _3턴_ 만큼 연장됩니다. 지속 시간은 최대 _6턴_ 까지 연장시킬 수 있습니다.\n\n_+4:_ 영혼의 활로 적을 처치하면 자연의 힘의 지속 시간이 _4턴_ 만큼 연장됩니다. 지속 시간은 최대 _8턴_ 까지 연장시킬 수 있습니다.

actors.hero.talent.eagle_eye.title=매의 눈
actors.hero.talent.eagle_eye.desc=_+1:_ 영혼의 매의 시야가 _7타일_로 증가합니다.\n\n_+2:_ 영혼의 매의 시야가 _8타일_로 증가합니다.\n\n_+3:_ 영혼의 매의 시야가 기존 _9타일_로 증가하며, _2타일_ 범위의 심안 효과를 얻습니다. \n\n_+4:_ 영혼의 매의 시야가 기존 _10타일_로 증가하며, _3타일_ 범위의 심안 효과를 얻습니다.
actors.hero.talent.go_for_the_eyes.title=눈을 노려라
actors.hero.talent.go_for_the_eyes.desc=_+1:_ 영혼의 매의 공격이 적을 _2턴_ 동안 실명시킵니다.\n\n_+2:_ 영혼의 매의 공격이 적을 _5턴_ 동안 실명시킵니다.\n\n_+3:_ 영혼의 매의 공격이 적을 _5턴_ 동안 실명시키고 _2턴_ 동안 불구로 만듭니다.\n\n_+4:_ 영혼의 매의 공격이 적을 _5턴_ 동안 실명시키고 _5턴_ 동안 불구로 만듭니다.
actors.hero.talent.swift_spirit.title=신속한 영혼
actors.hero.talent.swift_spirit.desc=_+1:_ 영혼의 매의 이동 속도가 _2.5타일_로 증가하며, 소환 후 들어오는 _첫 2 회의 공격_을 반드시 회피합니다.\n\n_+2:_ 영혼의 매의 이동 속도가 _3타일_로 증가하며, 소환 후 들어오는 _첫 4 회의 공격_을 반드시 회피합니다.\n\n_+3:_ 영혼의 매의 이동 속도가 _3.5타일_로 증가하며, 소환 후 들어오는 _첫 6 회의 공격_을 반드시 회피합니다.\n\n_+4:_ 영혼의 매의 이동 속도가 _4타일_로 증가하며, 소환 후 들어오는 _첫 8 회의 공격_을 반드시 회피합니다.

#duelist
actors.hero.talent.strengthening_meal.title=강해지는 식사
actors.hero.talent.strengthening_meal.desc=_+1:_ 식사 후 다음에 명중하는 _2번_의 물리 공격이 3의 추가 피해를 입힙니다.\n\n_+2:_ 식사 후 다음에 명중하는 _3번_의 물리 공격이 3의 추가 피해를 입힙니다.
actors.hero.talent.adventurers_intuition.title=모험가의 직감
actors.hero.talent.adventurers_intuition.desc=_+1:_ 무기를 _2.5배 빠르게_, 방어구를 _1.75배 빠르게_ 감정합니다.\n\n_+2:_ 무기를 _착용하는 즉시_ 감정하고, 방어구를 _2.5배 빠르게_ 감정합니다.
actors.hero.talent.patient_strike.title=침착한 공격
actors.hero.talent.patient_strike.desc=_+1:_ 근접 공격을 하기 전에 대기하면 _1-2의 추가 피해_를 줍니다.\n\n_+2:_ 근접 공격을 하기 전에 대기하면 _2의 추가 피해_를 줍니다.
actors.hero.talent.aggressive_barrier.title=공격적인 방어막
actors.hero.talent.aggressive_barrier.desc=_+1:_ 체력이 50% 이하일 때 무기 능력을 사용하면 _3의 방어막_을 얻습니다.\n\n_+2:_ 체력이 50% 이하일 때 무기 능력을 사용하면 _5의 방어막_을 얻습니다.
actors.hero.talent.aggressive_barrier.meta_desc=_다른 직업이 이 특성을 얻으면,_ 체력이 낮을 때 적을 근접 공격하면 방어막을 얻습니다. 50턴의 재사용 대기 시간이 있습니다.

actors.hero.talent.focused_meal.title=집중하는 식사
actors.hero.talent.focused_meal.desc=_+1:_ 식사에 1턴만 소모되며, 식사 시 무기의 충전량이 _0.67_  회복됩니다.\n\n_+2:_ 식사에 1턴만 소모되며, 식사 시 무기의 충전량이 _1_ 회복됩니다.
actors.hero.talent.focused_meal.meta_desc=_다른 직업이 이 특성을 얻으면,_ 다음에 명중하는 공격이 +1일 때 레벨/3의 추가 피해를, +2일 때 레벨/2의 추가 피해를 입힙니다.
actors.hero.talent.liquid_agility.title=액체로 이루어진 민첩성
actors.hero.talent.liquid_agility.desc=_+1:_ 물약, 혼합물, 영약을 마시거나 던지는 동안 _3배의 회피_를 얻고, 5턴 이내의 다음 근접 공격에 _3배의 정확성_을 얻습니다.\n\n_+2:_ 물약, 혼합물, 영약을 마시거나 던지는 동안 _공격을 반드시 회피_하고, 5턴 이내의 다음 근접 공격이 _반드시 명중합니다._\n\n회피 및 정확성 증가 효과는 힘의 물약, 경험의 물약 및 이 물약을 재료로 사용하여 만든 연금술 아이템을 사용했을 때 추가로 1턴 동안 지속됩니다.\n\n사용한 물약의 수보다 많은 양의 결과물을 제작하는 연금술 아이템(예: 물 혼합물)의 경우, 이 특성은 그 결과물의 개수에 따라 발동할 확률이 달라집니다.
actors.hero.talent.weapon_recharging.title=무기 충전
actors.hero.talent.weapon_recharging.desc=_+1:_ 충전 또는 유물 충전 효과가 있을 경우 _15턴_마다 무기 충전량을 추가로 얻습니다.\n\n_+2:_ 충전 또는 유물 충전 효과가 있을 경우 _10턴_마다 무기 충전량을 추가로 얻습니다.
actors.hero.talent.weapon_recharging.meta_desc=_다른 직업이 이 특성을 얻으면,_ 충전 효과가 있을 때 근접 공격이 +1에서 +5%의 추가 피해를, +2에서 +7.5%의 추가 피해를 입힙니다.
actors.hero.talent.lethal_haste.title=치명적인 신속
actors.hero.talent.lethal_haste.desc=_+1:_ 무기 능력으로 적을 처치하면 _3턴_ 분량만큼 즉시 움직일 수 있게 됩니다.\n\n_+2:_ 무기 능력으로 적을 처치하면 _5턴_ 분량만큼 즉시 움직일 수 있게 됩니다.
actors.hero.talent.lethal_haste.meta_desc=_다른 직업이 이 특성을 얻으면,_ 대신 일반 무기 공격으로 신속을 얻을 수 있습니다. 100턴의 재사용 대기 시간이 있습니다.
actors.hero.talent.swift_equip.title=재빠른 장착
actors.hero.talent.swift_equip.desc=_+1:_ 20턴마다 무기를 턴 소모 없이 _한 번_ 바꿀 수 있게 됩니다.\n\n_+2:_ 20턴마다 무기를 턴 소모 없이 _두 번_ 바꿀 수 있게 됩니다.\n\n결투자가 이 특성을 가지고 있고, 재사용 대기 중이 아닐 때 장착하지 않은 무기의 능력을 사용하면 해당 무기를 즉시 장착합니다.

actors.hero.talent.precise_assault.title=정확한 일격
actors.hero.talent.precise_assault.desc=_+1:_ 무기 능력을 발동한 후, 5턴 이내의 다음 근접 공격이 _2배의 정확성_을 얻습니다.\n\n_+2:_ 무기 능력을 발동한 후, 5턴 이내의 다음 근접 공격이 _5배의 정확성_을 얻습니다.\n\n_+3:_ 무기 능력을 발동한 후, 5턴 이내의 다음 근접 공격이 _반드시 명중합니다._
actors.hero.talent.precise_assault.meta_desc=_다른 영웅이 이 특성을 획득하면,_ 근접 공격의 정확성이 +1에서 10%, +2에서 20%, +3에서 30% 증가합니다.
actors.hero.talent.deadly_followup.title=치명적인 후속타
actors.hero.talent.deadly_followup.desc=_+1:_ 투척 무기가 적중한 경우, 5턴동안 해당 적에게 입히는 _근접 공격의 피해량이 10% 증가_합니다.\n\n_+2:_ 투척 무기가 적중한 경우, 5턴동안 해당 적에게 입히는 _근접 공격의 피해량이 20% 증가_합니다.\n\n_+3:_  투척 무기가 적중한 경우, 5턴동안 해당 적에게 입히는 _근접 공격의 피해량이 30% 증가_합니다.

actors.hero.talent.varied_charge.title=다채로운 충전
actors.hero.talent.varied_charge.desc=_+1:_ 두 개의 서로 다른 무기 능력을 사용하면 _0.17_의 무기 충전량을 즉시 얻습니다.\n\n_+2:_ 두 개의 서로 다른 무기 능력을 사용하면 _0.33_의 무기 충전량을 즉시 얻습니다.\n\n_+3:_ 두 개의 서로 다른 무기 능력을 사용하면 _0.50_의 무기 충전량을 즉시 얻습니다.
actors.hero.talent.twin_upgrades.title=이중 강화
actors.hero.talent.twin_upgrades.desc=_+1:_ 장착한 두 무기 중 강화 수치가 더 낮은 무기의 티어가 더 높은 강화 수치를 가진 무기의 티어보다 _2티어 이상 낮을 경우_ 해당 무기의 강화 수치가 더 높은 강화수치를 가진 무기의 강화 수치로 증가합니다.\n\n_+2:_ 장착한 두 무기 중 강화 수치가 더 낮은 무기의 티어가 더 높은 강화 수치를 가진 무기의 티어보다 _1티어 이상 낮을 경우_ 해당 무기의 강화 수치가 더 높은 강화수치를 가진 무기의 강화 수치로 증가합니다.\n\n_+3:_ 장착한 두 무기 중 강화 수치가 더 낮은 무기의 티어가 더 높은 강화 수치를 가진 무기의 티어와 _같거나 낮을 경우_ 해당 무기의 강화 수치가 더 높은 강화수치를 가진 무기의 강화 수치로 증가합니다.
actors.hero.talent.combined_lethality.title=복합적인 치명성
actors.hero.talent.combined_lethality.desc=_+1:_ 다른 무기의 능력을 사용한 직후 근접 무기로 적을 공격하면 보스가 아닌 _13% 미만의 체력_을 가진 적을 즉시 처치할 수 있습니다.\n\n_+2:_ 다른 무기의 능력을 사용한 직후 근접 무기로 적을 공격하면 보스가 아닌 _27% 미만의 체력_을 가진 적을 즉시 처치할 수 있습니다.\n\n_+3:_ 다른 무기의 능력을 사용한 직후 근접 무기로 적을 공격하면 보스가 아닌 _40% 미만의 체력_을 가진 적을 즉시 처치할 수 있습니다.\n\n이 효과는 일반적인 근접 무기 공격으로도, 무기 능력의 공격으로도 발동할 수 있습니다.

actors.hero.talent.unencumbered_spirit.title=자유로운 영혼
actors.hero.talent.unencumbered_spirit.desc=_+1:_ 장착한 장비 중 _3 티어_ 이하의 장비 하나 당 _50%의 추가 에너지_를 얻습니다.\n\n_+2:_ 장착한 장비 중 _2 티어_ 이하의 장비 하나 당 이 특성이 추가로 제공하는 에너지가 _75%_로 증가합니다. 3티어 장비 효과는 그대로 유지됩니다.\n\n_+3:_ 장착한 장비 중 _1 티어_ 이하의 장비 하나 당 이 특성이 추가로 제공하는 에너지가 _100%_로 증가합니다. 2티어 및 3티어 장비 효과는 그대로 유지됩니다. 또한 천 갑옷과 징 박힌 장갑을 얻습니다.\n\n이 특성은 무기를 들지 않거나 완력의 반지를 착용 중일 때에는 적용되지 않습니다.
actors.hero.talent.monastic_vigor.title=수도사의 원기
actors.hero.talent.monastic_vigor.desc=_+1:_ 에너지가 _100%_일 때, 수도사의 능력이 강화됩니다.\n\n_+2:_ 에너지가 _80% 이상_일 때, 수도사의 능력이 강화됩니다.\n\n_+3:_ 에너지가 _60% 이상_일 때, 수도사의 능력이 강화됩니다.\n\n강화 능력:\n- 휘몰아치는 타격이 무기의 마법을 적용합니다.\n- 집중이 즉시 적용됩니다.\n- 돌진의 사용 가능 범위가 +4타일 증가합니다.\n- 날아차기가 +50%의 피해를 입히며 넉백과 기절 효과가 주변 모든 적에게 적용됩니다.\n- 명상이 잃은 체력의 20%를 서서히 회복하며 받는 피해를 80% 경감합니다.
actors.hero.talent.combined_energy.title=복합적인 에너지
actors.hero.talent.combined_energy.desc=_+1:_ 무기 능력과 _4 이상의 에너지_를 사용하는 수도사 능력을 5턴 이내에 사용하면 1의 에너지를 돌려받습니다.\n\n_+2:_ 무기 능력과 _3 이상의 에너지_를 사용하는 수도사 능력을 5턴 이내에 사용하면 1의 에너지를 돌려받습니다.\n\n_+3:_ 무기 능력과 _2 이상의 에너지_를 사용하는 수도사 능력을 5턴 이내에 사용하면 1의 에너지를 돌려받습니다.

actors.hero.talent.close_the_gap.title=파고들기
actors.hero.talent.close_the_gap.desc=_+1:_ 결투를 시작할 때 대상을 향해 _2타일_까지 점멸할 수 있습니다.\n\n_+2:_ 결투를 시작할 때 대상을 향해 _3타일_까지 점멸할 수 있습니다.\n\n_+3:_ 결투를 시작할 때 대상을 향해 _4타일_까지 점멸할 수 있습니다.\n\n_+4:_ 결투를 시작할 때 대상을 향해 _5타일_까지 점멸할 수 있습니다.\n\n이 점멸은 적들과 함정를 무시할 수 있지만, 벽처럼 단단한 지형 등은 뚫을 수 없습니다. 점멸은 적이 결투를 받아드릴 수 있는 곳으로만 갈 수 있습니다.
actors.hero.talent.invigorating_victory.title=활기 넘치는 승리
actors.hero.talent.invigorating_victory.desc=_+1:_ 결투가 끝나기 전 적을 처치할 경우 결투 동안 받은 총 피해의 _30% + 5_ 만큼의 체력을 회복합니다.\n\n_+2:_ 결투가 끝나기 전 적을 처치할 경우 결투 동안 받은 총 피해의 _50% + 10_ 만큼의 체력을 회복합니다.\n\n_+3:_ 결투가 끝나기 전 적을 처치할 경우 결투 동안 받은 총 피해의 _65% + 15_ 만큼의 체력을 회복합니다.\n\n_+4:_ 결투가 끝나기 전 적을 처치할 경우 결투 동안 받은 총 피해의 _75% + 20_ 만큼의 체력을 회복합니다.
actors.hero.talent.elimination_match.title=예선전
actors.hero.talent.elimination_match.desc=_+1:_ 결투가 끝난 직후 3턴 이내에 다시 결투를 신청할 경우 충전량 소모가 _16%_ 감소합니다.\n\n_+2:_ 결투가 끝난 직후 3턴 이내에 다시 결투를 신청할 경우 충전량 소모가 _30%_ 감소합니다.\n\n_+3:_ 결투가 끝난 직후 3턴 이내에 다시 결투를 신청할 경우 충전량 소모가 _40%_ 감소합니다.\n\n_+4:_ 결투가 끝난 직후 3턴 이내에 다시 결투를 신청할 경우 충전량 소모가 _50%_ 감소합니다.

actors.hero.talent.elemental_reach.title=원소 도달
actors.hero.talent.elemental_reach.desc=_+1:_ 원소 해방의 거리가 기존 4타일에서 _5타일_로 증가하고, 폭이 기존 65도에서 _75도_로 증가합니다.\n\n_+2:_ 원소 해방의 거리가 기존 4타일에서 _6타일_로 증가하고, 폭이 기존 65도에서 _85도_로 증가합니다.\n\n_+3:_ 원소 해방의 거리가 기존 4타일에서 _7타일_로 증가하고, 폭이 기존 65도에서 _95도_로 증가합니다.\n\n_+4:_ 원소 해방의 거리가 기존 4타일에서 _8타일_로 증가하고, 폭이 기존 65도에서 _105도_로 증가합니다.
actors.hero.talent.striking_force.title=격렬한 해방
actors.hero.talent.striking_force.desc=_+1:_ 원소 해방의 위력이 _30%_ 증가합니다.\n\n_+2:_ 원소 해방의 위력이 _60%_ 증가합니다.\n\n_+3:_ 원소 해방의 위력이 _90%_ 증가합니다.\n\n_+4:_ 원소 해방의 위력이 _120%_ 증가합니다.
actors.hero.talent.directed_power.title=유도된 힘
actors.hero.talent.directed_power.desc=_+1:_ 원소 해방으로 적을 직접 공격하면 해당 적을 포함해 범위 안에 있는 적 하나 당 무기에 부여된 마법의 위력이 _+30%_씩 증가합니다.\n\n_+2:_ 원소 해방으로 적을 직접 공격하면 해당 적을 포함해 범위 안에 있는 적 하나 당 무기에 부여된 마법의 위력이 _+60%_씩 증가합니다.\n\n_+3:_ 원소 해방으로 적을 직접 공격하면 해당 적을 포함해 범위 안에 있는 적 하나 당 무기에 부여된 마법의 위력이 _+90%_씩 증가합니다.\n\n_+4:_ 원소 해방으로 적을 직접 공격하면 해당 적을 포함해 범위 안에 있는 적 하나 당 무기에 부여된 마법의 위력이 _+120%_씩 증가합니다.

actors.hero.talent.feigned_retreat.title=위장 후퇴
actors.hero.talent.feigned_retreat.desc=_+1:_ 적이 잔상을 공격하면 _2턴_의 신속을 얻습니다.\n\n_+2:_ 적이 잔상을 공격하면 _4턴_의 신속을 얻습니다.\n\n_+3:_ 적이 잔상을 공격하면 _6턴_의 신속을 얻습니다.\n\n_+4:_ 적이 잔상을 공격하면 _8턴_의 신속을 얻습니다.
actors.hero.talent.expose_weakness.title=약점 노출
actors.hero.talent.expose_weakness.desc=_+1:_ 잔상을 공격하는 적이 _2턴_의 약화와 취약을 얻습니다.\n\n_+2:_ 잔상을 공격하는 적이 _4턴_의 약화와 취약을 얻습니다.\n\n_+3:_ 잔상을 공격하는 적이 _6턴_의 약화와 취약을 얻습니다.\n\n_+4:_ 잔상을 공격하는 적이 _8턴_의 약화와 취약을 얻습니다.
actors.hero.talent.counter_ability.title=받아치는 능력
actors.hero.talent.counter_ability.desc=_+1:_ 잔상이 공격받은 후 3턴 이내에 무기 능력을 사용하면 _0.38_의 충전량을 즉시 회복합니다.\n\n_+2:_ 잔상이 공격받은 후 3턴 이내에 무기 능력을 사용하면 _0.77_의 충전량을 즉시 회복합니다.\n\n_+3:_잔상이 공격받은 후 3턴 이내에 무기 능력을 사용하면 _1.13_의 충전량을 즉시 회복합니다.\n\n_+4:_ 잔상이 공격받은 후 3턴 이내에 무기 능력을 사용하면 _1.5_의 충전량을 즉시 회복합니다.

#cleric
actors.hero.talent.satiated_spells.title=포만한 주문
actors.hero.talent.satiated_spells.desc=_+1:_ 식사 후 다음 주문 시전 시 _3의 방어막_을 얻습니다.\n\n_+1:_ 식사 후 다음 주문 시전 시 _5의 방어막_을 얻습니다.
actors.hero.talent.satiated_spells.meta_desc=_다른 직업이 이 특성을 얻으면,_ 대신 즉시 방어막을 얻고, 보통 10턴 이후에 감소되기 시작합니다.
actors.hero.talent.holy_intuition.title=신성한 직감
actors.hero.talent.holy_intuition.desc=_+1:_ 성직자가 _신성한 직감_ 주문을 얻습니다. 신성한 직감은 대상 아이템의 저주 여부를 판단합니다. _충전 소모 : 3_\n\n_+2:_ 성직자가 _신성한 직감_ 주문을 얻습니다. 신성한 직감은 대상 아이템의 저주 여부를 판단합니다. _충전 소모 : 2_
actors.hero.talent.holy_intuition.meta_desc=_다른 직업이 이 특성을 얻으면,_ 아이템을 착용하기 직전 일정 확률로 저주 여부를 알려줍니다. 확률은 +1일때 15%, +2일때 25%입니다.
actors.hero.talent.searing_light.title=불타는 빛
actors.hero.talent.searing_light.desc=_+1:_ _인도하는 빛_에 발광한 적에게 가하는 물리 공격이 _3의 추가 피해_를 줍니다.\n\n_+2_ _인도하는 빛_에 발광한 적에게 가하는 물리 공격이 _5의 추가 피해_를 줍니다.
actors.hero.talent.searing_light.meta_desc=_다른 직업이 이 특성을 얻으면,_ 적에게 마법 막대 또는 유물을 사용한 후 추가 피해를 줍니다. 쿨다운은 20턴입니다.
actors.hero.talent.shield_of_light.title=빛의 방패
actors.hero.talent.shield_of_light.desc=_+1:_ 성직자가 _빛의 방패_ 주문을 얻습니다. 빛의 방해는 즉시 시전되며 5턴 동안 대상의 공격에 대해 _2-4 방어력_을 얻습니다. 충전 소모 : 1\n\n_+2:_ 성직자가 _빛의 방패_ 주문을 얻습니다. 빛의 방해는 즉시 시전되며 5턴 동안 대상의 공격에 대해 _3-6 방어력_을 얻습니다. 충전 소모 : 1
actors.hero.talent.shield_of_light.meta_desc=_다른 직업이 이 특성을 얻으면,_ 일정 확률로 대상 적에게 입는 피해를 1 감소시킵니다. 확률은 +1일때 33%, +2일때 50%입니다.

actors.hero.talent.enlightening_meal.title=깨달음의 식사
actors.hero.talent.enlightening_meal.desc=_+1:_ 식사에 1턴만 소모되며, 식사 시 성서의 충전량이 _0.67_  회복됩니다.\n\n_+2:_ 식사에 1턴만 소모되며, 식사 시 성서의 충전량이 _1_ 회복됩니다.
actors.hero.talent.enlightening_meal.meta_desc=_다른 직업이 이 특성을 얻으면,_ +1일 때 2턴의 충전 및 유물 충전 효과를, +2일 때 3턴의 충전 및 유물 충전 효과를 얻습니다. 이 효과로는 풍요의 뿔을 충전할 수 없습니다.
actors.hero.talent.recall_inscription.title=도돌이 각인
actors.hero.talent.recall_inscription.refunded=당신의 아이템은 재활용되었다!
actors.hero.talent.recall_inscription.desc=_+1:_ 성직자가 _도돌이 각인_ 주문을 얻습니다. 도돌이 각인은 지난 _10턴 이내_ 사용한 룬석 또는 주문서 효과를 재발동합니다.\n\n_+2:_ 성직자가 _도돌이 각인_ 주문을 얻습니다. 도돌이 각인은 지난 _300턴 이내_ 사용한 룬석 또는 주문서 효과를 재발동합니다.\n\n도돌이 각인은 강화의 주문서 효과를 재사용할 수 없습니다. 이 주문의 충전 사용량은 재사용한 효과에 따라 달라집니다. 룬석은 2, 주문서는 3, 신비로운 주문서는 4의 충전을 사용합니다. 변환의 주문서 또는 그 재료로 만든 연금술 아이템을 재발동하는 경우 충전이 2배로 소모됩니다.
actors.hero.talent.recall_inscription.meta_desc=_다른 직업이 이 특성을 얻으면,_ 사용한 주문서와 룬석을 일정 확률로 재활용합니다. 확률은 +1일때 10%, +2일때 15%입니다. 강화의 주문서는 이 효과에서 제외됩니다.
actors.hero.talent.sunray.title=태양 광선
actors.hero.talent.sunray.desc=_+1:_ 성직자가 _태양 광선_ 주문을 얻습니다. 태양 광선은 대상에게 4-8 피해를 주며, _4턴 동안_ 실명시킵니다. 충전 소모 : 1\n\n_+2:_ 성직자가 _태양 광선_ 주문을 얻습니다. 태양 광선은 대상에게 6-12 피해를 주며, _6턴 동안_ 실명시킵니다. 충전 소모 : 1\n\n태양 광선은 대상을 한 번만 실명시키지만, 이미 실명한 대상이 태양 광선에 적중하면 마비됩니다. 태양 광선은 악마와 언데드 적에게 항상 최대 피해를 줍니다.
actors.hero.talent.sunray.meta_desc=_다른 직업이 이 특성을 얻으면,_ 대신 마법 막대와 유물이 일정 확률로 적을 4턴 동안 실명시킵니다. 확률은 +1일때 15%, +2일때 25%입니다.
actors.hero.talent.divine_sense.title=신성한 감각
actors.hero.talent.divine_sense.desc=_+1:_ 성직자가 _신성한 감각_ 주문을 얻습니다. 신성한 감각은 즉시 시전되며, 자신의 _8타일 이내_에 50턴 동안 심안 효과를 얻습니다. 충전 소모 : 2\n\n_+2:_ 성직자가 _신성한 감각_ 주문을 얻습니다. 신성한 감각은 즉시 시전되며, 자신의 _12타일 이내_에 50턴 동안 심안 효과를 얻습니다. 충전 소모 : 2
actors.hero.talent.divine_sense.meta_desc=_다른 직업이 이 특성을 얻으면,_ 마법 막대 또는 유물을 사용한 후 잠시 동안 +1일때 3타일, +2일때 5타일의 심안을 얻습니다.
actors.hero.talent.bless.title=축복
actors.hero.talent.bless.desc=_+1:_ 성직자가 _축복_ 주문을 얻습니다. 축복은 자신에게 _6턴의 축복과 10의 방어막_을, 또는 다른 캐릭터에게 _10턴의 축복과 10의 회복_을 부여합니다. 충전 소모 : 1\n\n_+2:_ 성직자가 _축복_ 주문을 얻습니다. 축복은 자신에게 _10턴의 축복과 15의 방어막_을, 또는 다른 캐릭터에게 _15턴의 축복과 15의 회복_을 부여합니다. 충전 소모 : 1\n\n이 주문으로 초과 치유된 체력은 방어막으로 전환됩니다.
actors.hero.talent.bless.meta_desc=_다른 직업이 이 특성을 얻으면,_ 대신 영웅과 모든 아군의 명중과 회피를 +1일때 3%, +2일때 5% 증가합니다.

actors.hero.talent.cleanse.title=정화
actors.hero.talent.cleanse.desc=_+1:_ 성직자가 _정화_ 주문을 얻습니다. 정화는 성직자와 근처 아군의 _부정적인 효과_를 제거하고, _10의 방어막_을 부여합니다. 충전 소모 : 2\n\n_+2:_ 성직자가 _정화_ 주문을 얻습니다. 정화는 성직자와 근처 아군에게 _3턴의 디버프 면역_효과와 _20의 방어막_을 부여합니다. 충전 소모 : 2\n\n_+3:_ 성직자가 _정화_ 주문을 얻습니다. 정화는 성직자와 근처 아군에게 _5턴의 디버프 면역_효과와 _30의 방어막_을 부여합니다. 충전 소모 : 2
actors.hero.talent.cleanse.meta_desc=_다른 직업이 이 특성을 얻으면,_ 마법 막대와 유물을 사용한 후 일정 확률로 부정적인 상태 이상을 제거합니다. 확률은 +1/+2/+3일때 10/20/30%입니다.
actors.hero.talent.light_reading.title=속독
actors.hero.talent.light_reading.desc=_+1:_ 성직자가 성서를 착용하지 않고도 사용할 수 있지만, 착용하지 않은 성서는 충전 속도가 _25%_로 감소합니다.\n\n_+2:_ 성직자가 성서를 착용하지 않고도 사용할 수 있지만, 착용하지 않은 성서는 충전 속도가 _50%_로 감소합니다.\n\n_+3:_ 성직자가 성서를 착용하지 않고도 사용할 수 있지만, 착용하지 않은 성서는 충전 속도가 _75%_로 감소합니다.
actors.hero.talent.light_reading.meta_desc=_다른 직업이 이 특성을 얻으면,_ 모든 마법 막대의 충전 속도가 +1/+2/+3일때 7/13/20% 증가합니다.

actors.hero.talent.holy_lance.title=성창
actors.hero.talent.holy_lance.desc=_+1:_ 사제가 _성창_ 주문을 얻습니다. 성창은 강력한 원거리 주문으로 _30-55의 피해_를 줍니다. 충전 소모 : 4\n\n_+2:_ 사제가 _성창_ 주문을 얻습니다. 성창은 강력한 원거리 주문으로 _45-83의 피해_를 줍니다. 충전 소모 : 4\n\n_+3:_ 사제가 _성창_ 주문을 얻습니다. 성창은 강력한 원거리 주문으로 _60-110의 피해_를 줍니다. 충전 소모 : 4\n\n성창은 언데드와 악마 적에게 항상 최대 피해를 줍니다. 또한 성창은 시전한 후 30턴의 쿨다운이 있습니다.
actors.hero.talent.hallowed_ground.title=축성의 땅
actors.hero.talent.hallowed_ground.desc=_+1:_ 사제가 _축성의 땅_ 주문을 얻습니다. 축성의 땅은 20턴 동안 _3x3 크기의 땅을 축성합니다._ 충전 소모 : 2\n\n_+2:_ 사제가 _축성의 땅_ 주문을 얻습니다. 축성의 땅은 20턴 동안 _5x5 크기의 땅을 축성합니다._ 충전 소모 : 2\n\n_+3:_ 사제가 _축성의 땅_ 주문을 얻습니다. 축성의 땅은 20턴 동안 _7x7 크기의 땅을 축성합니다._ 충전 소모 : 2\n\n시전 시, 범위 내 모든 아군을 15만큼 치유하고, 적을 잠시 속박하며, 짧은 풀을 퍼트립니다. 그 후 아군을 천천히 치유하며, 적들을 불구로 만들고, 무작위로 긴 풀이 자라나게 합니다. 축성의 땅은 사제 본인에게는 치유 대신 방어막을 제공하며, 불이 붙으면 사라집니다.
actors.hero.talent.mnemonic_prayer.title=연장 기도문
actors.hero.talent.mnemonic_prayer.desc=_+1:_ 사제가 _연장 기도문_ 주문을 얻습니다. 연장 기도문은 아군/적의 버프/디버프의 지속시간을 _3턴 연장합니다._ 충전 소모 : 1\n\n_+2:_ 사제가 _연장 기도문_ 주문을 얻습니다. 연장 기도문은 아군/적의 버프/디버프의 지속시간을 _4턴 연장합니다._ 충전 소모 : 1\n\n_+3:_ 사제가 _연장 기도문_ 주문을 얻습니다. 연장 기도문은 아군/적의 버프/디버프의 지속시간을 _5턴 연장합니다._ 충전 소모 : 1\n\n연장 기도문은 시전에 턴을 소모하지 않습니다. 또한 연장 기도문은 특정한 버프 또는 디버프를 한 번만 연장하며, 갑옷 능력으로 얻은 버프는 연장하지 않습니다.

actors.hero.talent.lay_on_hands.title=안수기도
actors.hero.talent.lay_on_hands.desc=_+1:_ 성기사가 _안수 기도_ 주문을 얻습니다. 안수기도는 인접한 캐릭터를 _15_만큼 치유하거나, 성기사에게 _15의 방어막_을 부여합니다. 충전 소모 : 1\n\n_+2:_ 성기사가 _안수 기도_ 주문을 얻습니다. 안수기도는 인접한 캐릭터를 _20_만큼 치유하거나, 성기사에게 _20의 방어막_을 부여합니다. 충전 소모 : 1\n\n_+3:_ 성기사가 _안수 기도_ 주문을 얻습니다. 안수기도는 인접한 캐릭터를 _25_만큼 치유하거나, 성기사에게 _25의 방어막_을 부여합니다. 충전 소모 : 1\n\n초과 치유된 체력은 방어막으로 전환됩니다. 안수기도는 연속하여 시전할 수 있지만, 최대 세 번 시전 분량의 방어막까지만 부여할 수 있습니다.
actors.hero.talent.aura_of_protection.title=보호의 오라
actors.hero.talent.aura_of_protection.desc=_+1:_ 성기사가 _보호의 오라_ 주문을 얻습니다. 보호의 오라는 20턴 동안 성기사와 2타일 이내의 아군이 _입는 피해가 20% 감소_하며, 성기사가 착용한 갑옷의 상형문자 위력이 _+50% 증폭_됩니다. 충전 소모 : 2.\n\n_+2:_ 성기사가 _보호의 오라_ 주문을 얻습니다. 보호의 오라는 20턴 동안 성기사와 2타일 이내의 아군이 _입는 피해가 30% 감소_하며, 성기사가 착용한 갑옷의 상형문자 위력이 _+75% 증폭_됩니다. 충전 소모 : 2.\n\n_+3:_ 성기사가 _보호의 오라_ 주문을 얻습니다. 보호의 오라는 20턴 동안 성기사와 2타일 이내의 아군이 _입는 피해가 40% 감소_하며, 성기사가 착용한 갑옷의 상형문자 위력이 _+100% 증폭_됩니다. 충전 소모 : 2.
actors.hero.talent.wall_of_light.title=빛의 벽
actors.hero.talent.wall_of_light.desc=_+1:_ 성기사가 _빛의 벽_ 주문을 얻습니다. 빛의 벽은 20턴 동안 지속되는 _3타일 길이_의 벽을 설치하여 적들을 밀쳐내고 가로막습니다. 충전 소모 : 3\n\n_+2:_ 성기사가 _빛의 벽_ 주문을 얻습니다. 빛의 벽은 20턴 동안 지속되는 _5타일 길이_의 벽을 설치하여 적들을 밀쳐내고 가로막습니다. 충전 소모 : 3\n\n_+3:_ 성기사가 _빛의 벽_ 주문을 얻습니다. 빛의 벽은 20턴 동안 지속되는 _7타일 길이_의 벽을 설치하여 적들을 밀쳐내고 가로막습니다. 충전 소모 : 3

actors.hero.talent.divine_intervention.title=신성한 개입
actors.hero.talent.divine_intervention.desc=_+1:_ 승천자의 형상 도중, 성직자는 _신성한 개입_을 시전할 수 있습니다. 신성한 개입은 성직자와 모든 아군에게 _최대 150의 방어막_을 부여하고 승천자의 형상 지속시간을 _3턴_ 늘립니다.\n\n_+2:_ 승천자의 형상 도중, 성직자는 _신성한 개입_을 시전할 수 있습니다. 신성한 개입은 성직자와 모든 아군에게 _최대 200의 방어막_을 부여하고 승천자의 형상 지속시간을 _4턴_ 늘립니다.\n\n_+3:_ 승천자의 형상 도중, 성직자는 _신성한 개입_을 시전할 수 있습니다. 신성한 개입은 성직자와 모든 아군에게 _최대 250의 방어막_을 부여하고 승천자의 형상 지속시간을 _5턴_ 늘립니다.\n\n_+4:_ 승천자의 형상 도중, 성직자는 _신성한 개입_을 시전할 수 있습니다. 신성한 개입은 성직자와 모든 아군에게 _최대 300의 방어막_을 부여하고 승천자의 형상 지속시간을 _6턴_ 늘립니다.\n\n신성한 개입은 무려 성서 충전을 5나 소모하며, 같은 승천자의 형상 동안 한 번만 시전할 수 있습니다.
actors.hero.talent.judgement.title=심판
actors.hero.talent.judgement.desc=_+1:_ 승천자의 형상 도중, 성직자는 _심판_을 시전할 수 있습니다. 심판은 시야 내 모든 적에게 _10-20의 피해_를 입힙니다.\n\n_+2:_ 승천자의 형상 도중, 성직자는 _심판_을 시전할 수 있습니다. 심판은 시야 내 모든 적에게 _15-30의 피해_를 입힙니다.\n\n_+3:_ 승천자의 형상 도중, 성직자는 _심판_을 시전할 수 있습니다. 심판은 시야 내 모든 적에게 _20-40의 피해_를 입힙니다.\n\n_+4:_ 승천자의 형상 도중, 성직자는 _심판_을 시전할 수 있습니다. 심판은 시야 내 모든 적에게 _25-50의 피해_를 입힙니다.\n\n심판은 성서 충전을 3 소모합니다. 심판은 승천자의 형상 시전 후 또는 지난 번 심판 시전 이후 시전한 주문마다 +33% 피해를 추가로 입힙니다.
actors.hero.talent.flash.title=섬광
actors.hero.talent.flash.desc=_+1:_ 승천자의 형상 도중, 성직자는 _섬광_을 시전할 수 있습니다. 섬광을 시전하면 _3 타일 이내_의 위치로 순간이동합니다.\n\n_+2:_ 승천자의 형상 도중, 성직자는 _섬광_을 시전할 수 있습니다. 섬광을 시전하면 _4 타일 이내_의 위치로 순간이동합니다.\n\n_+3:_ 승천자의 형상 도중, 성직자는 _섬광_을 시전할 수 있습니다. 섬광을 시전하면 _5 타일 이내_의 위치로 순간이동합니다.\n\n_+4:_ 승천자의 형상 도중, 성직자는 _섬광_을 시전할 수 있습니다. 섬광을 시전하면 _6 타일 이내_의 위치로 순간이동합니다.\n\n섬광은 기본적으로 성서 충전을 2 소모하며, 같은 승천자의 형상 지속시간 중 섬광을 다시 시전할 때 마다 1의 충전을 추가로 소모합니다.

actors.hero.talent.body_form.title=성체 형상
actors.hero.talent.body_form.desc=성직자가 _성체 형상_ 주문을 얻습니다. 성체 형상은 이번 게임 동안 감정한 장비의 마법과 상형문자의 효과를 지정하여 나중에 불러올 수 있습니다. 충전 소모 : 2\n\n_+1:_ 삼위일체를 사용할 때, 성직자가 선택한 효과를 _20턴_ 동안 얻습니다.\n\n_+2:_ 삼위일체를 사용할 때, 성직자가 선택한 효과를 _27턴_ 동안 얻습니다.\n\n_+3:_ 삼위일체를 사용할 때, 성직자가 선택한 효과를 _33턴_ 동안 얻습니다.\n\n_+4:_ 삼위일체를 사용할 때, 성직자가 선택한 효과를 _40턴_ 동안 얻습니다.\n\n삼위일체는 한 번에 한 가지만의 성체 효과를 지정할 수 있습니다. 삼위일체의 갑옷 충전량 소모는 선택한 마법 또는 상형문자가 희귀하고 강력할수록 증가합니다.
actors.hero.talent.mind_form.title=성심 형상
actors.hero.talent.mind_form.desc=성직자가 _성심 형상_ 주문을 얻습니다. 성심 형상은 이번 게임에서 감정한 마법 막대 또는 투척 무기의 효과를 지정하여 나중에 불러올 수 있습니다. 충전 소모 : 3\n\n_+1:_ 삼위일체를 사용할 때, 성직자가 선택한 아이템을 _+3_ 강화의 효율로 발사하거나 던집니다.\n\n_+2:_ 삼위일체를 사용할 때, 성직자가 선택한 아이템을 _+4_ 강화의 효율로 발사하거나 던집니다.\n\n_+3:_ 삼위일체를 사용할 때, 성직자가 선택한 아이템을 _+5_ 강화의 효율로 발사하거나 던집니다.\n\n_+4:_ 삼위일체를 사용할 때, 성직자가 선택한 아이템을 _+6_ 강화의 효율로 발사하거나 던집니다.\n\n삼위일체는 한 번에 한 가지만의 성심 효과를 지정할 수 있습니다.
actors.hero.talent.spirit_form.title=성령 형상
actors.hero.talent.spirit_form.desc=성직자가 _성령 형상_ 주문을 얻습니다. 성령 형상은 이번 게임에서 감정한 반지 또는 유물(성서 제외)의 효과를 지정하여 나중에 불러올 수 있습니다. 충전 소모 : 4\n\n_+1:_ 삼위일체를 사용할 때, 성직자가 선택한 반지의 효과를 20턴 동안 _+1_ 강화의 효율로 얻거나, 선택한 유물의 효과를 _+4_ 강화의 효율로 사용합니다.\n\n_+2:_ 삼위일체를 사용할 때, 성직자가 선택한 반지의 효과를 20턴 동안 _+2_ 강화의 효율로 얻거나, 선택한 유물의 효과를 _+6_ 강화의 효율로 사용합니다.\n\n_+3:_ 삼위일체를 사용할 때, 성직자가 선택한 반지의 효과를 20턴 동안 _+3_ 강화의 효율로 얻거나, 선택한 유물의 효과를 _+8 강화의 효율로 사용합니다._\n\n_+4:_ 삼위일체를 사용할 때, 성직자가 선택한 반지의 효과를 20턴 동안 _+4_ 강화의 효율로 얻거나, 선택한 유물의 효과를 _+10_ 강화의 효율로 사용합니다.\n\n삼위일체는 한 번에 한 가지만의 성령 효과를 지정할 수 있습니다. 몇몇 유물의 경우 삼위일체로 시전 시 그 효과 또는 갑옷 충전 소모량이 다릅니다.

actors.hero.talent.beaming_ray.title=재배치 광선
actors.hero.talent.beaming_ray.desc=성직자가 _재배치 광선_ 주문을 얻습니다. 이 광선은 벽을 통과하며, 강화된 아군을 대상 위치로 이동시킵니다. 만약 광선이 적에게 닿는다면, 대신 아군을 적 근처로 이동시키며 적을 공격하게 합니다. 재배치 광선은 이동할 수 없는 아군도 이동시킬 수 있지만, 그럴 경우 사거리가 절반이 됩니다. 충전 소모 : 1\n\n_+1:_ 재배치 광선의 최대 사거리는 4타일이며, 10턴 동안 가장 가까운 적에게 집단의 힘 추가 피해가 _+35%로 증가_합니다.\n\n_+2:_ 재배치 광선의 최대 사거리는 8타일이며, 10턴 동안 가장 가까운 적에게 집단의 힘 추가 피해가 _+40%로 증가_합니다.\n\n_+3:_ 재배치 광선의 최대 사거리는12타일이며, 10턴 동안 가장 가까운 적에게 집단의 힘 추가 피해가 _+45%로 증가_합니다.\n\n_+4:_ 재배치 광선의 최대 사거리는 16타일이며, 10턴 동안 가장 가까운 적에게 집단의 힘 추가 피해가 _+50%로 증가_합니다.
actors.hero.talent.life_link.title=생명 연결
actors.hero.talent.life_link.desc=성직자가 _생명 연결_ 주문을 얻습니다. 강화된 아군과의 연결을 강화하여 각자가 입는 피해를 공유하며, 3티어 이하 아군 강화 주문의 효과가 양쪽에게 모두 적용됩니다. 충전 소모 : 2\n\n_+1:_ 생명 연결이 _10턴 동안 지속_되며, 집단의 힘 피해 감소가 _-35%로 증가_합니다.\n\n_+2:_ 생명 연결이 _13턴 동안 지속_되며, 집단의 힘 피해 감소가 _-40%로 증가_합니다.\n\n_+3:_ 생명 연결이 _17턴 동안 지속_되며, 집단의 힘 피해 감소가 _-45%로 증가_합니다.\n\n_+4:_ 생명 연결이 _20턴 동안 지속_되며, 집단의 힘 피해 감소가 _-50%로 증가_합니다.
actors.hero.talent.stasis.title=정지
actors.hero.talent.stasis.desc=성직자가 _정지_ 주문을 얻습니다. 정지 주문은 대상 아군을 잠시 동안 던전에서 제외하며, 집단의 힘을 포함한 모든 강화 효과를 보존합니다. 대상 아군은 지속시간 종료 시 영웅 옆 다시 나타납니다. 또한 주문을 재시전하여 즉시 아군을 나타나게 할 수 있습니다. 정지는 이동이 불가능한 아군 또한 데려올 수 있으나, 층을 같이 이동할 수는 없습니다. 충전 소모 : 1\n\n_+1:_ 정지가 최대 _60턴_ 동안 지속됩니다.\n\n_+2:_ 정지가 최대 _90턴_ 동안 지속됩니다.\n\n_+3:_ 정지가 최대 _120턴_ 동안 지속됩니다.\n\n_+4:_ 정지가 최대 _150턴_ 동안 지속됩니다.\n\n성직자는 또한  재배치 광선으로 정지한 아군을 꺼낼 수 있습니다. 또한 생명 연결한 아군을 정지해도 강화 효과의 지속 시간은 흐르지 않으나, 그 효과 또한 일시적으로 작동하지 않습니다.


#universal
actors.hero.talent.heroic_energy.title=영웅적인 에너지
actors.hero.talent.heroic_energy.rat_title=쥐적인 에너지
actors.hero.talent.heroic_energy.desc=_+1:_ 영웅의 방어구 능력 사용에 드는 충전량이  _12% 감소_합니다.\n\n_+2:_ 영웅의 방어구 능력 사용에 드는 충전량이 _23% 감소_합니다.\n\n_+3:_ 영웅의 방어구 능력 사용에 드는 충전량이 _32% 감소_합니다.\n\n_+4:_ 영웅의 방어구 능력 사용에 드는 충전량이 _40% 감소_합니다.

actors.hero.talent.ratsistance.title=쥐항력
actors.hero.talent.ratsistance.desc=_+1:_ 쥐로 변한 적은 _10% 적은 피해_를 입힙니다.\n\n_+2:_ 쥐로 변한 적은 _19% 적은 피해_를 입힙니다.\n\n_+3:_ 쥐로 변한 적은 _27% 적은 피해_를 입힙니다.\n\n_+4:_ 쥐로 변한 적은 _35% 적은 피해_를 입힙니다.
actors.hero.talent.ratlomacy.title=쥐 외교
actors.hero.talent.ratlomacy.desc=_+1:_ 쥐로 변한 적에게 다시 쥐 변이를 사용하면 대상을 아군으로 만들고 변이가 풀리지 않게 합니다.\n\n_+2:_ 쥐로 변한 적에게 다시 쥐 변이를 사용하면 대상을 아군으로 만들고 변이가 풀리지 않게 하며, 대상에게 _2턴_의 아드레날린 효과를 부여합니다.\n\n_+3:_ 쥐로 변한 적에게 다시 쥐 변이를 사용하면 대상을 아군으로 만들고 변이가 풀리지 않게 하며, 대상에게 _4턴_의 아드레날린 효과를 부여합니다.\n\n_+4:_ 쥐로 변한 적에게 다시 쥐 변이를 사용하면 대상을 아군으로 만들고 변이가 풀리지 않게 하며, 대상에게 _6턴_의 아드레날린 효과를 부여합니다.
actors.hero.talent.ratforcements.title=쥐원군
actors.hero.talent.ratforcements.desc=_+1:_ 자신에게 쥐 변이를 사용하면, 자신 옆에 아군 주머니쥐를 _1마리_ 소환합니다.\n\n_+2:_ 자신에게 쥐 변이를 사용하면, 자신 옆에 아군 주머니쥐를 _2마리_ 소환합니다.\n\n_+3:_ 자신에게 쥐 변이를 사용하면, 자신 옆에 아군 주머니쥐를 _3마리_ 소환합니다.\n\n_+4:_ 자신에게 쥐 변이를 사용하면, 자신 옆에 아군 주머니쥐를 _4마리_ 소환합니다.



###npcs
actors.mobs.npcs.blacksmith.name=트롤 대장장이
actors.mobs.npcs.blacksmith.intro_quest_warrior=이봐, 인간! 터프하게 생기셨구만.
actors.mobs.npcs.blacksmith.intro_quest_mage=이봐, 인간! 똑똑하게 생기셨구만.
actors.mobs.npcs.blacksmith.intro_quest_rogue=이봐, 인간! 숨어 다니게 생기셨구만.
actors.mobs.npcs.blacksmith.intro_quest_huntress=이봐, 인간! 날쌔게 생기셨구만.
actors.mobs.npcs.blacksmith.intro_quest_duelist=이봐, 인간! 용감하게 생기셨구만.
actors.mobs.npcs.blacksmith.intro_quest_cleric=이봐, 인간! 중요한 인물처럼 생기셨구만.
actors.mobs.npcs.blacksmith.intro_quest_start=날 도와줄 수 있다고? 좋아, 네가 할 만한 일이 있지. 난 이 공방을 오래된 광산 위에 지었어. 바로 저 사다리 아래라고. 이 곡괭이를 가지고 _어두운 금 원석을 좀 캐와. 40개_면 충분할 거야. 아래에 있는 벽은 부술 수 있으니, 잘 사용해 보라고.\n\n뭐, 보수? 이 탐욕스러운 인간 같으니라고...\n\n알았어, 알았다고. 재련 정도는 해 줄 수 있어. 운 좋은 줄 알아. 이 주변 대장장이는 나 뿐이니까.
actors.mobs.npcs.blacksmith.intro_quest_crystal=조심하는 게 좋을 거야. 그 광산은 너 같이 작은 인간한테는 위협적이니까. 버려진 지 오랜 시간이 지난 광산이라, 많은 수정들이 자라나기 시작했어. 그 수정들은 반짝거려서 겉보기엔 좋아 보여도, 값을 매기기엔 너무 깨지기 쉬운 물건이라 쓸모없는데다, 스스로를 지키려고 마법 같은 것도 쓴다니까. 꽤나 강력하단 말이지. 그러니까 _어디에서 채굴하든 간에, 긴장을 늦추지 않는 게 좋을 거야_. 그렇지 않으면 그것들의 주의를 끌 테니까.\n\n광산 어딘가에 커다란 수정도 있을 텐데, 그건 훨씬 위험하니까, 그걸 부술 거라면 준비 단단히 하는 게 좋을 거야. 일단 부수기만 한다면 다른 수정들을 느려지게 만드니까, 만약 그걸 부순다면 보수를 추가로 주도록 하지.
actors.mobs.npcs.blacksmith.intro_quest_gnoll=조심하는 게 좋을 거야. 그 광산은 너 같이 작은 인간한테는 위협적이니까. 몇몇 놀 놈들이 골드에 미친 나머지 거기를 부숴 버리기 시작했어. 단순하고 멍청한 놈들이라서, 그 따위로 채굴하고 있으니 온갖 붕괴란 붕괴는 다 일으켜서 있던 통로도 없애고 있단 말이지. 그 녀석들 사이에서 금을 캐 와야 할 거야. 그러니 _최근에 떨어진 바위들을 찾아 보라고_.\n\n그 놈들 중에 한 놈이 유독 말썽인 것 같아. 아마도 _흙점쟁이 주술사_나 그런 비슷한 놈이겠지. 만약 그 놈을 찾아내서 처리해 준다면, 보수를 더 주도록 하지. 하지만 장담하건대 그 놈도 쉽게 죽어 주진 않을 거야.
actors.mobs.npcs.blacksmith.intro_quest_fungi=조심하는 게 좋을 거야. 그 광산은 너 같이 작은 인간한테는 위협적이니까. 거기엔 일종의 버섯 괴물 같은 게 자라나고 있어. 심지어 그건 버섯 포탑 같은 게 달려 있어서, 들키면 상당히 치명적일 거야. 그 놈들은 일어날 순 없어도, 적어도 널 추적하는건 가능하니까, 살고 싶다면 가능한 한 그 놈들의 _시야 밖에 있는 게 좋을 거라고_.\n\n만약 어떻게든 거기 있는 _가장 큰 버섯_을 해치워 준다면, 보수를 더 주도록 하지. 다만 진짜 힘들긴 할 거야. 그건 벽 안에 숨겨진 수많은 균사 마디에 연결되어 있어서, 실제로 피해를 주려면 그것들을 싸그리 다 부숴 버려야 할 거라고.
actors.mobs.npcs.blacksmith.reminder=내 시간 뺏는 건 이제 끝낸 거야? 광산 입구는 저쪽이니까 잘 해 보라고.
actors.mobs.npcs.blacksmith.reminder_crystal=너가 할 수 있는 만큼 많은 금을 가져와줘, 그리고 큰 크리스탈도 깨려고 해봐.
actors.mobs.npcs.blacksmith.reminder_gnoll=너가 할 수 있는 만큼 많은 금을 가져와줘, 그리고 놀 흙점쟁이도 죽이려고 해봐.
actors.mobs.npcs.blacksmith.reminder_fungi=너가 할 수 있는 만큼 많은 금을 가져와줘, 그리고 거대 버섯도 죽이려고 해봐.
actors.mobs.npcs.blacksmith.lost_pick=장난 아니거든? 내 곡괭이 어따 두고 온 거야?!
actors.mobs.npcs.blacksmith.quest_start_prompt=준비는 끝난 거야? 그 가방에 금 가져올 공간은 확실하게 남겨 두라고.\n\n_딱 한 번만 내려보내 줄 거니까!_
actors.mobs.npcs.blacksmith.enter_yes=준비됐다
actors.mobs.npcs.blacksmith.enter_no=아직이다
actors.mobs.npcs.blacksmith.exit_warn_none=벌써 끝냈어? 뭐야, 금을 하나도 가지고 있질 않잖아! _40개_는 가져올 수 있을 거라고.\n\n_기억하라고, 한 번 올라오면 다시 안 들여보내 줄 거니까._
actors.mobs.npcs.blacksmith.exit_warn_low=벌써 끝냈어? 그렇게 많은 금을 가지고 있는 것처럼 보이진 않는데. _40개_는 가져올 수 있을 거라고.\n\n_기억하라고, 한 번 올라오면 다시 안 들여보내 줄 거니까._
actors.mobs.npcs.blacksmith.exit_warn_med=끝났어? 적어도 금을 좀 가지고 있는 것 같긴 하지만, 아직 광산엔 확실히 많은 금이 남아 있을 텐데. _40개_는 가져올 수 있을 거라고.\n_기억하라고, 한 번 올라오면 다시 안 들여보내 줄 거니까._
actors.mobs.npcs.blacksmith.exit_warn_high=끝났어? 꽤 많은 금을 가지고 온 것 같은데, 그래도 난 아직 좀 더 사용할 수 있다고. _40개_는 가져올 수 있을 거라고.\n\n_기억하라고, 한 번 올라오면 다시 안 들여보내 줄 거니까._
actors.mobs.npcs.blacksmith.exit_warn_full=끝났어? 상당한 금을 들고 온 것 같구만. 나오기 전에 빠뜨린 거 없나 잘 확인하라고.\n\n_기억하라고, 한 번 올라오면 다시 안 들여보내 줄 거니까._
actors.mobs.npcs.blacksmith.exit_warn_crystal=그 거대 수정이 여전히 아래에 남아 있어. 그걸 부수면 보수를 더 주지.
actors.mobs.npcs.blacksmith.exit_warn_gnoll=놀 흙점쟁이가 여전히 아래에 남아 있어. 그걸 처리하고 오면 보수를 더 주지.
actors.mobs.npcs.blacksmith.exit_warn_fungi=그 거대 버섯이 여전히 아래에 남아 있어. 그걸 처치하고 오면 보수를 더 주지.
actors.mobs.npcs.blacksmith.exit_yes=끝났다
actors.mobs.npcs.blacksmith.exit_no=아직이다
actors.mobs.npcs.blacksmith.get_lost=이래 봬도 난 좀 바쁘거든. 이제 꺼져!
actors.mobs.npcs.blacksmith.entrance_blocked=내려가는 길이 막혀 있다.
actors.mobs.npcs.blacksmith.cant_enter_old=그 지역은 이번 게임에서는 더 이상 갈 수 없습니다. 새로운 게임을 시작해 새로운 퀘스트를 시도해 보세요!
actors.mobs.npcs.blacksmith.def_verb=방어
actors.mobs.npcs.blacksmith.desc=저 트롤 대장장이는 다른 트롤과 비슷하게 생겼습니다. 키는 크고 늘씬하며, 피부의 색상과 질감이 바위 같습니다. 트롤 대장장이는 그의 덩치에 걸맞지 않는 작은 도구로 장비를 손질하고 있습니다.

actors.mobs.npcs.ghost.name=슬픈 유령
actors.mobs.npcs.ghost.rat_1=반갑네 %s(이)여... 한때 난 당신처럼 자신감 넘치고 강한 모험가였다네... 하지만 난 추악한 짐승에 의해 죽어 버렸네... 그래서 난 이 곳을 떠날 수 없지... 복수를 하기 전 까진 말야... _악취나는 쥐_를 죽여 줘... 놈이 내 목숨을 앗아 갔으니...\n\n놈은 이 바닥을 돌아다니며... 오물을 여기저기 퍼트리고 있어... _악취나는 구름과 산성 이빨을 조심해... 그리고 산성 공격은 물에 씻어낼 수 있어..._
actors.mobs.npcs.ghost.rat_2=부탁하네... 날 도와줘... 그 돌연변이를 죽여...\n\n_물 근처에서 싸워... 그리고 악취 구름을 피해..._
actors.mobs.npcs.ghost.gnoll_1=반갑네 %s(이)여... 한때 난 당신처럼 자신감 넘치고 강한 모험가였다네... 하지만 난 비겁한 적에게 죽어 버렸네... 그래서 난 이 곳을 떠날 수 없지... 복수를 하기 전 까진 말야... _놀 사기꾼_을 죽여줘... 놈이 내 목숨을 앗아 갔으니...\n\n놈은 다른 놀과 달라... 숨어서 투척 무기를 사용해... _놈의 맹독과 화염 다트를 조심해... 멀리서 공격하려 하지 마..._
actors.mobs.npcs.ghost.gnoll_2=부탁하네... 날 도와줘... 그 사기꾼을 죽여...\n\n_녀석에게 공격할 틈을 줘선 안 돼... 거리를 좁혀야 해..._
actors.mobs.npcs.ghost.crab_1=반갑네 %s(이)여... 한때 난 당신처럼 자신감 넘치고 강한 모험가였다네... 하지만 난 고대의 존재에게 죽어 버렸네... 그래서 난 이 곳을 떠날 수 없지... 복수를 하기 전 까진 말야... _거대한 게_를 죽여 줘... 놈이 내 목숨을 앗아 갔으니...\n\n놈은 비정상적으로 나이 들었어... 그리고 거대한 집게발 하나와 두꺼운 갑각으로 무장했지... _놈의 집게발을 조심해... 기습을 하지 않으면 어떤 공격이든 방어할 테니까..._
actors.mobs.npcs.ghost.crab_2=부탁하네... 날 도와줘... 그 게새끼를 죽여...\n\n_기습을 하지 않으면... 어떤 공격이든 막아 버려..._
actors.mobs.npcs.ghost.find_me=고마워... 나를 찾아 와...
actors.mobs.npcs.ghost.desc=이 유령은 거의 보이지 않습니다. 슬픈 얼굴을 하고 있는 형체 없는 흐릿한 빛을 띄고 있습니다.

actors.mobs.npcs.imp.name=야심만만한 임프
actors.mobs.npcs.imp.intro=너 혹시 모험가니? 난 모험가가 좋아! 뭔가 없애버리고 싶은 게 있으면 그들한테 부탁하면 되거든. 약간의 보상과 함께 말이야. 그렇지? ;)
actors.mobs.npcs.imp.golems_1=내가 없애버리고 싶은 건 _골렘들_이야. 보다시피 난 여기서 작은 사업을 시작할 예정인데, 저 멍청한 골렘들이 내 사업을 망치고 있어서 말야! 저 대가리까지 돌덩어리인 녀석들과 협상하는 게 여간 쉬운 일이 아니야! 저 돌대가리들! 그래서 말인데... 얘네를 한 _4기 정도_만 없애 주면 보상을 줄게.
actors.mobs.npcs.imp.monks_1=내가 없애버리고 싶은 건 _드워프 수도승들_이야. 보다시피 난 여기서 작은 사업을 시작하려고 하는데, 저 미친 놈들은 아무 것도 사지 않는 데다 다른 손님들을 겁줘서 쫓아내거든. 그래서 말인데... 그 녀석들을 한 _5명 정도_만 없애 주면 보상을 줄게.
actors.mobs.npcs.imp.golems_2=골렘 사파리는 잘 되어 가니? 토큰 주워 오는 거 잊지 말고.
actors.mobs.npcs.imp.monks_2=오, 아직 안 죽었구나! 역시 네 무술이 더 강할 줄 알았다니까! ;) 아 참, 수도승이 떨어트린 토큰을 잊지 말라고.
actors.mobs.npcs.imp.cya=이따 봐, %s!
actors.mobs.npcs.imp.hey=야, %s!
actors.mobs.npcs.imp.desc=임프는 하급 악마입니다. 그들은 강력하지도, 특별한 마법 재능이 있지도 않습니다. 하지만 그들은 꽤 영리하고 사교적입니다. 많은 임프는 악마 이외의 다른 존재와 살기를 원합니다.

actors.mobs.npcs.impshopkeeper.name=야심만만한 임프
actors.mobs.npcs.impshopkeeper.greetings=안녕, %s!
actors.mobs.npcs.impshopkeeper.greetings_ascent=대체 뭔 짓을 한거야, %s? 살 거 있으면 빨리 사, 나도 튀어야 하니까!
actors.mobs.npcs.impshopkeeper.thief=믿을 만한 놈인 줄 알았더니!
actors.mobs.npcs.impshopkeeper.buyback=임프가 흔쾌히 당신에게 아이템을 돌려주었다.
actors.mobs.npcs.impshopkeeper.desc=임프는 전당 입구에 작은 가게를 세웠습니다. 친근한 얼굴을 보니 반갑지만 그의 가격은 확실히 친근하다고 하기엔 어려워 보입니다.

actors.mobs.npcs.mirrorimage.name=거울상
actors.mobs.npcs.mirrorimage.desc=이 환영은 당신과 닮아 있으며, 당신이 쓰는 무기와 방어구도 복제하였습니다.\n\n거울상은 자신이 가진 무기를 들고 적들을 찾아 전투를 벌이나, 당신보다 피해를 적게 입힙니다. 환영은 투명한 상태로 생성되지만, 적들을 공격한 후에는 투명화가 풀리게 됩니다.\n\n적당한 공격 수단이 될 수 있지만, 환영은 내구력이 매우 약해 피해를 입으면 즉시 사라져 버립니다.
actors.mobs.npcs.mirrorimage.discover_hint=이 캐릭터는 특정한 주문서의 효과로 등장합니다.

actors.mobs.npcs.npc.discover_hint=이 캐릭터는 던전의 특정한 장소에서 등장합니다.

actors.mobs.npcs.prismaticimage.name=프리즈마 거울상
actors.mobs.npcs.prismaticimage.desc=이 빛나는 환영은 당신과 매우 유사한 외형을 띠고 있으며, 당신이 장비한 갑옷과 무기까지도 복제한 것으로 보입니다.\n\n프리즈마 거울상은 적을 탐색하는 데 온 힘을 기울이며, 향상된 방어력과 체력을 이용하여 당신을 지키기 위해 노력할 것입니다. 비록 거울상만큼의 공격력을 지니지는 않지만, 당신의 갑옷으로부터 얻는 방어력을 포함하여 더욱 향상된 내구력을 가지고 있습니다.\n\n체력이 0이 될 경우, 프리즈마 거울상은 몇 턴 후 사라지게 되며, 사라지기 전까지는 체력을 회복할 수 있습니다. 시야 내에 적이 없는 경우, 프리즈마 거울상은 그 몸을 감추고 당신의 곁을 맴돕니다. 적이 나타날 때까지 말이죠.
actors.mobs.npcs.prismaticimage.discover_hint=이 캐릭터는 특정한 주문서의 효과로 등장합니다.

actors.mobs.npcs.ratking.name=쥐 대왕
actors.mobs.npcs.ratking.not_sleeping=짐은 자고 있지 않았다!
actors.mobs.npcs.ratking.what_is_it=뭐지? 짐은 이 황당한 일을 지켜볼 시간이 없다. 내 왕국은 그냥 돌아가지 않는단 말이다!
actors.mobs.npcs.ratking.confused=여... 여기는 어디지? 나의 왕국이 나를 필요로 하고 있다!
actors.mobs.npcs.ratking.crown_clothes=뭐라도 옷을 걸치거라! 왕과 이야기할 수 있는 상태가 아니군!
actors.mobs.npcs.ratking.crown_desc=오오, 그 왕관은 나를 위한 것인가!? 짐의 것보다 훨씬 빛나는구나. 기쁘게 받아들이겠다!\n\n이 왕관에 대한 보상으로 뭔가 하사할 수 있을 것 같구나. 자네 같은 영웅에게 어울리는 엄청난 힘이지! 마음에 드느냐?
actors.mobs.npcs.ratking.crown_yes=물론이죠!
actors.mobs.npcs.ratking.crown_info=더 이야기해 주십시오.
actors.mobs.npcs.ratking.crown_no=그건 좀...
actors.mobs.npcs.ratking.crown_thankyou=히히히, 고맙다! 이제 가서 너의 왕을 자랑스럽게 하거라!
actors.mobs.npcs.ratking.crown_fine=좋다! 어차피 짐이 원하던 건 아니니까...
actors.mobs.npcs.ratking.crown_after=새 갑옷은 마음에 드는가? 무르는 건 안 된다네!
actors.mobs.npcs.ratking.desc_crown=이 쥐는 다른 주머니쥐들보다 조금 더 큽니다. 머리에 드워프 왕의 왕관을 쓰고 있습니다.
actors.mobs.npcs.ratking.desc_birthday=이 쥐는 다른 주머니쥐들보다 조금 더 큽니다. 평소 쓰던 왕관 대신 작은 녹색 파티 모자를 쓰고 있습니다. 생신 축하드립니다, 쥐 대왕님!
actors.mobs.npcs.ratking.desc_winter=이 쥐는 다른 주머니쥐들보다 조금 더 큽니다. 평소 쓰던 왕관 대신 작은 크리스마스 모자를 쓰고 있습니다. 즐거운 연말 되세요!
actors.mobs.npcs.ratking.desc=이 쥐는 다른 주머니쥐들보다 조금 더 큽니다. 머리에 작은 왕관을 쓰고 있습니다.
actors.mobs.npcs.ratking.discover_hint=이 캐릭터는 던전의 특정한 지역의 마지막 부분에서 등장합니다.

actors.mobs.npcs.sheep.name=양
actors.mobs.npcs.sheep.baa!=메에!
actors.mobs.npcs.sheep.baa?=메에?
actors.mobs.npcs.sheep.baa.=메에.
actors.mobs.npcs.sheep.baa...=메에...
actors.mobs.npcs.sheep.def_verb=방어
actors.mobs.npcs.sheep.desc=이 양은 마법 양입니다. 어떤 마법이 있냐고요? 당신은 그 양을 죽일 수 없습니다. 그 양은 멍한 눈으로 되새김질이나 하면서, 마법이 없어질 때까지 계속 있을겁니다.
actors.mobs.npcs.sheep.discover_hint=이 캐릭터는 특정한 아이템 또는 함정의 효과로 등장합니다.

actors.mobs.npcs.shopkeeper.name=상점 주인
actors.mobs.npcs.shopkeeper.thief=도둑, 도둑이다!
actors.mobs.npcs.shopkeeper.warn=조심하세요! 마지막 경고입니다.
actors.mobs.npcs.shopkeeper.flee=상점 주인이 달아났다!
actors.mobs.npcs.shopkeeper.sell=판매할 아이템을 선택하세요
actors.mobs.npcs.shopkeeper.talk=이야기한다
actors.mobs.npcs.shopkeeper.buyback=상점 주인은 마지못해 당신의 아이템을 돌려주었다.
actors.mobs.npcs.shopkeeper.talk_prison_intro=성공적인 모험에 필요한 물건, 여기 다 있습죠!
actors.mobs.npcs.shopkeeper.talk_prison_warrior=멋있게 생긴 인장이구만요. 원래는 한 조각인 것 같은데, 어디서 쫓겨나기라도 한 거요? 아무렴, 당신이 어떤 과거를 가졌던 나에겐 상관 없어요. 돈만 있으면 되니까요.
actors.mobs.npcs.shopkeeper.talk_prison_mage=후후, 당신의 이름이 현상 수배지에 올라간 걸 본 것 같은데, 어디 도망이라도 다니는 중인가요? 아, 당신은 무고하단 건가요? 아무렴... 너무 놀라진 마세요. 제 물건을 꼭 사 주신다면 신고는 하지 않을 지도요.
actors.mobs.npcs.shopkeeper.talk_prison_rogue=도적 길드에서 여길 청소하라고 파견한 사람인가요? 그냥 둘러보는 거라고요? 그래도 여기 있는 동안 몬스터 몇 마리 정도는 없애 주셨으면 해요. 아 그렇다고 할인은 기대하지 말고요. 여기 안전하게 있느라 쓴 돈이 한두 푼이 아니거든요.
actors.mobs.npcs.shopkeeper.talk_prison_huntress=익숙한 장소는 아니신가 보군요, 아가씨. 던전의 복도는 도시의 건물이나 숲과는 다른 느낌이지 않나요? 허허, 제 잡담은 신경쓰지 마시고, 뭔가 살 생각은 없으신가요?
actors.mobs.npcs.shopkeeper.talk_prison_duelist=방랑하는 영웅 아니신가요! 여기 문제를 해결하러 오신 거라면, 조심하세요. 떨거지 도적놈들과는 비교할 수 없을 정도로 사악한 적들이니까요. 다른 사람들보단 잘 해내실 수 있을 거라 믿어요. 제 상점 앞에서 죽지만은 마세요.
actors.mobs.npcs.shopkeeper.talk_prison_cleric=안녕하세요. 귀족 나리, 아니, 성직자 나리라고 해야하나요? 하하, 아무렴 어느 쪽이던 여긴 당신에겐 어울리는 장소가 아니겠지요. 당신 같은 분이 이런 데서 죽게 되면 사람들이 들고 일어날 텐데요. 그래도 당신 돈은 꽤 많아 보이니, 목숨 부지한다고 치고 뭔가 좀 사 가는 게 어떻겠습니까?
actors.mobs.npcs.shopkeeper.talk_caves=오래 살려면, 돈을 쓰세요.\n\n아, 그리고 트롤 대장장이에게 말 좀 전해 주세요. 그 양반이 지난 주에 사 간 망치 외상값 좀 갚아 달라고 말이에요!
actors.mobs.npcs.shopkeeper.talk_city=내 물건들이 당신을 안전하게 지켜줄 겁니다.\n\n...그렇다고 여기 너무 어슬렁거리진 마세요. 여기 토착생물들을 떼어 내느라 얼마나 고생했는지 아시나요? 제 가게에 녀석들을 끌고 오는 건 사절이에요!
actors.mobs.npcs.shopkeeper.talk_halls=안녕! 악마 사냥꾼들에겐 특별 할인가로 판매해 줄게!\n\n아 그리고, 아래를 탐험할 거면 조심해! 거기 악마들은 네가 얼마나 용감한지 신경조차 안 써. 죽으면 그 많은 돈이 다 무슨 소용이겠어? ;)\n\n다른 악마들도 나랑 비슷하냐고? 후후, 전혀 안 그래. 난 싸움꾼은 아니지만, 어떻게든 제정신은 유지하고 있다고. 저기 아래 악마들은 훨씬 강력하지만, 무언가에 의해 조종당하는... 뭐... 아무튼 조심해.
actors.mobs.npcs.shopkeeper.talk_ascent=그 아뮬렛으로 뭘 할 건지는 모르겠지만 난 엮이고 싶지 않아. 빨리 튀어야 하니까 얼른 물건부터 사고 나가라고!
actors.mobs.npcs.shopkeeper.desc=이 작은 남자는 거대한 도시보단 던전에 틀어박혀 장사를 하는 것에 더 소질이 있는 것 같습니다. 손님들에게 바가지를 씌우는 걸 보면 왜 그런지 알 수 있죠.

actors.mobs.npcs.wandmaker.name=지팡이 깎는 노인
actors.mobs.npcs.wandmaker.intro_warrior=오, 안녕하신가! 이런 음침한 곳에서 북쪽 출신 전사를 만나다니, 엄청 반갑구려! 먼 길 오느라 고생이 많았겠어. 모험거리를 찾고 있다면 네게 맡길 만한 일이 하나 있는데, 들어 볼텐가?
actors.mobs.npcs.wandmaker.intro_rogue=오 신이시여, 놀랐구먼! 아직 이성을 잃지 않은 도적은 본 적이 없으니, 자네는 분명 지상에서 내려온 사람이겠군! 이 늙은이를 도와줄 수 있겠는가? 부탁이 있다네.
actors.mobs.npcs.wandmaker.intro_mage=오, 반갑네 %s(이)여! 자네에 대해 마법사 학회에서 이야기를 들은 적이 있던가? 아 신경쓸 거 없네, 그 앞뒤 꽉 막힌 녀석들이랑은 엮이기도 싫으니 말야. 이 늙은이를 돕고 싶다면, 여기 부탁이 있네.
actors.mobs.npcs.wandmaker.intro_huntress=오, 반갑네, 여인이여! 이런 곳에서 우호적인 이를 만나다니 놀랍군 그래. 사실 자네를 어디선가 본 적이 있는 것 같은데, 확실하지는 않군... 뭐, 어쨌든, 모험을 하러 온 겐가? 그럼 부탁할 게 있다네.
actors.mobs.npcs.wandmaker.intro_duelist=오, 반갑네, 여인이여! 이 우울한 곳을 찾는 영웅이 있다니 얼마나 놀라운 기쁨인가! 이 늙은이를 돕고 싶으면, 여기 부탁이 있네.
actors.mobs.npcs.wandmaker.intro_cleric=오, 반갑소, 귀족 나리! 이 우울한 장소에 한 줄기 빛과 같은 분이시구먼! 굳이 폐를 끼치고 싶진 않지만, 그래도 한 가지 부탁 하나만 해도 괜찮을까 하네.
actors.mobs.npcs.wandmaker.intro_1=\n\n난 마법 막대를 만들 희귀한 재료를 찾으러 왔네, 하지만 여기서 길을 잃었고, 마법 방어막도 점점 힘을 잃어가는구먼. 곧 여길 떠야하기는 한데, 그 물건을 못 얻고 그냥 갈 수는 없어서 말이지.
actors.mobs.npcs.wandmaker.intro_dust=내가 필요한 건 _시체 먼지_일세. 이러한 장소에서만 나온다는 특별한 종류의 저주 받은 뼛가루지. 여기 어딘가에 나무로 막힌 문이 있을 건대,  그 문 너머에 있을 거라고 확신하지. 하지만 주의하게나. 그 먼지가 가진 저주는 꽤 강력하거든, _먼지를 얻었으면 최대한 빨리 나에게로 돌아와 주게._ 그 저주를 정화해 줄 테니 말야.
actors.mobs.npcs.wandmaker.intro_ember=내가 필요한 건 갓 소환된 불정령에서 얻을 수 있는 _신선한 잉걸불_일세. 정령은 조정되지 않은 소환 의식으로 쉽게 부를 수 있으니, 의식의 제단에 양초를 몇 개 가져가면 하나 소환할 수 있을 걸세. 불정령과 싸우면서 _갇히게 되는 상황을 최대한 피하게_. 아니면 _얼음을 일으키는 물건을 들고 있는 편이 좋다네_. 갓 소환된 불정령들은 꽤 강력하고 혼란스럽지만, 차가운 건 못 견디니까 말이야.
actors.mobs.npcs.wandmaker.intro_berry=예전에 이 감옥의 한 간수는 _썩은열매 식물_을 키웠다고 하더군, 그리고 난 그 씨앗을 필요로 한다네. 하지만 지금쯤 그 식물은 통제불능으로 자랐을 것이고, 씨앗을 쉽게 얻을 수는 없을 것일세. 썩은열매가 만든 정원은 여기 근처에 있을 걸세. 살고 싶으면 _덩굴에 묶이지 않게 주의_하게나. 불을 쓰고 싶겠지만, 불을 이용하면 식물과 함께 씨앗을 태워 버리니 _불은 절대로 사용하면 안 된다네._
actors.mobs.npcs.wandmaker.intro_2=\n\n그 물건을 내게 가져오면 특별히 이 늙은이가 정성스레 만든 마법 막대를 보답으로 주지! 나 한테 두 개가 있으니, 둘 중 하나 원하는 걸 가져가면 된다네.
actors.mobs.npcs.wandmaker.reminder_dust=시체 먼지는 아직인가, %s(이)여? 나무로 막힌 곳을 찾아보게나.
actors.mobs.npcs.wandmaker.reminder_ember=잉걸불은 아직인가, %s(이)여? 양초 4개를 찾아 의식의 제단으로 가게나.
actors.mobs.npcs.wandmaker.reminder_berry=썩은열매 씨앗은 아직인가, %s(이)여? 식물로 가득 찬 방을 찾아 보게나.
actors.mobs.npcs.wandmaker.def_verb=방어
actors.mobs.npcs.wandmaker.desc=이 늙었지만 정정한 신사는 길을 잃어 약간 난감한 표정을 하고 있습니다. 현재 그는 마법 방어막으로 보호되고 있습니다.



###mobs
actors.mobs.acidic.name=산성 전갈
actors.mobs.acidic.desc=절지동물을 닮은 이 악마 생물체는 근접전을 무조건 피하며, 불구를 거는 날카로운 가시를 먼 거리에서 발사합니다. 이 개체는 부식성 점액을 뚝뚝 떨어뜨리고 있습니다.

actors.mobs.albino.name=알비노 쥐
actors.mobs.albino.desc=주머니쥐의 특별한 개체로써, 순백의 털과 뾰족한 이빨이 특징입니다.
actors.mobs.albino.discover_hint=이 적은 던전의 특정한 장소에서 희귀한 확률로 등장합니다.

actors.mobs.armoredstatue.name=갑옷 입은 석상
actors.mobs.armoredstatue.desc=단순히 봐서는 던전의 다른 움직임 없는 석상들과 별반 다르지 않아 보입니다만, 붉게 빛나는 눈은 전혀 그렇지 않다고 말합니다.\n\n석상에 입혀진 갑옷 덕분에 꽤 괜찮은 상태를 유지하고 있으며, 파괴하기도 매우 어렵습니다.
actors.mobs.armoredstatue.desc_arm_wep=이 석상은 돌로 만들어져 있지만, 석상에 장착된 _%1$s_와 _%2$s_ 만큼은 진짜처럼 보입니다.

actors.mobs.bandit.name=미치광이 강도
actors.mobs.bandit.desc=돋보이는 보라색 로브를 입은 정예 도둑입니다. 뛰어난 능력을 가지고 있었습니다만, 지금은 다른 도둑들처럼 이성을 잃어버리고 말았습니다.\n\n미치광이 강도는 당신에게서 아이템을 훔칠 뿐만 아니라 실명, 불구, 중독을 부여합니다! 그렇지만 일반 도둑들보다는 더 나은 전리품을 들고 있을 가능성이 높습니다.

actors.mobs.bat.name=흡혈 박쥐
actors.mobs.bat.desc=이 작고 끈질긴 동굴의 서식자들은 보이는 것보다 훨씬 더 위험합니다. 그들은 공격에 성공할 때마다 스스로의 체력을 회복하여, 자신보다 훨씬 큰 적을 제압합니다.

actors.mobs.bee.name=황금 벌
actors.mobs.bee.desc_honey=황금 벌들은 작은 몸집에도 불구하고 그들의 집을 맹렬하게 지키려고 합니다. 이 녀석은 진정되었으며, 당신을 따라가고 싶어하는 것처럼 보입니다.
actors.mobs.bee.desc=황금 벌들은 작은 몸집에도 불구하고 그들의 집을 맹렬하게 지키려고 합니다. 이 녀석은 매우 화가 나 있는 상태이니, 가까이 다가가지 않는 게 좋겠습니다.
actors.mobs.bee.discover_hint=이 캐릭터는 특정한 아이템의 효과로 등장합니다.

actors.mobs.brute.name=놀 병정
actors.mobs.brute.enraged=분노
actors.mobs.brute.def_verb=방어
actors.mobs.brute.desc=놀 병정은 모든 놀 중 가장 크고, 강력하며, 터프한 녀석들입니다. 치명적인 피해를 입을 경우, 그들은 격노하여 일시적인 방어막과 강력한 공격력을 얻게 됩니다.
actors.mobs.brute$bruterage.name=병정의 광포화
actors.mobs.brute$bruterage.desc=이 놀 병정은 죽어가고 있지만, 당신을 길동무로 데려가려 합니다!\n\n시간이 흐르거나 피해를 받는 등의 이유로 놀 병정에게 둘러진 방어막이 모두 사라진다면 놀 병정은 죽습니다. 그러나 방어막이 남아있는 동안 가하는 피해가 엄청나게 증가하므로 주의하십시오!\n\n남은 방어막: %d.

actors.mobs.causticslime.name=산성 슬라임
actors.mobs.causticslime.desc=이 슬라임은 아래층에서 올라오는 어두운 마법에 오염되었습니다. 이 슬라임은 원래의 녹색 빛을 잃었으며, 산성 점액을 뚝뚝 흘리고 있습니다.
actors.mobs.causticslime.discover_hint=이 적은 던전의 특정한 장소에서 희귀한 확률로 등장합니다.

actors.mobs.crab.name=하수구 게
actors.mobs.crab.desc=이 커다란 게는 하수구 먹이사슬의 최상위 포식자입니다. 그들은 매우 빠르며 단단한 갑각이 강력한 공격도 견디게 해 줍니다.

actors.mobs.crystalguardian.name=수정 수호자
actors.mobs.crystalguardian.def_verb=방어
actors.mobs.crystalguardian.desc=이 거대한 결정체 수호자들은, 이들의 밝게 빛나는 눈만 제외하면 거의 조각상 같습니다. 경화된 수정들로 인해 매우 둔하지만 강력하므로, _가능한 한 오래 그들의 수정 둥지에서 잠들어 있도록 내버려두는 것이 최선입니다._\n\n수정 수호자들은 매우 크기에, 협소한 공간에서 훨씬 느리게 움직입니다. 또한 이들은 너무나도 튼튼하기에, 완전히 처치할 수 없습니다. 이들을 제압하여 일시적으로 비활성화시킬 수는 있겠지만, 금세 다시 일어납니다.
actors.mobs.crystalguardian.discover_hint=이 적은 특정한 퀘스트에서 등장합니다.

actors.mobs.crystalmimic.name=수정 미믹
actors.mobs.crystalmimic.ate=미믹이 당신의 %s를 삼켜버렸다!
actors.mobs.crystalmimic.escaped=수정 미믹이 탈출했다!
actors.mobs.crystalmimic.desc=미믹은 그들이 원하는 어떤 모양의 물체로도 변할 수 있는 마법 생명체입니다. 던전에서 그들은 대부분 상자 모양을 하고 있는데, 이는 아무 것도 모르는 모험가들을 끌어들이기 위함으로 보입니다.\n\n수정 미믹은 다른 일반적인 미믹들보다 까다로우며, 전리품을 훔치는 동안은 전투를 피하려 듭니다. 그들은 발견되는 즉시 전력질주로 도주하며, 자신을 공격하려는 적들을 다른 위치로 옮길 수 있습니다.

actors.mobs.crystalspire.name=수정 첨탑
actors.mobs.crystalspire.warning=당신이 공격함에 따라 수정이 진동합니다. 계속한다면 당신에게 주의가 끌릴 수밖에 없을 것입니다...
actors.mobs.crystalspire.alert=진동이 커져 온 동굴이 울리고 있습니다!
actors.mobs.crystalspire.desc=이 거대한 초경화 수정은 아마 이 동굴에 사는 기이한 결정 생물체들의 근원일 것입니다. 당신의 일반적인 무기는 이들에게 효과적이지 않으므로,  파괴하고 싶다면 곡괭이를 사용해야 합니다.\n\n_수정을 파괴하기 전에 충분히 준비하십시오._ 이런 거대한 수정을 채광하는 것은 꽤 시간이 걸릴 것이고, 그 동안 방해받게 될 것입니다. 이 첨탑 자체로도 자기 보호를 위한 수단들을 갖추고 있을 수도 있습니다. _어쩌면 그것의 하수인들을 대적하는 데 첨탑의 공격을 이용할 수도 있을 것 같습니다._
actors.mobs.crystalspire.discover_hint=이 적은 특정한 퀘스트에서 등장합니다.

actors.mobs.crystalwisp.name=수정 위습
actors.mobs.crystalwisp.beam_kill=당신은 빛의 광선에 의해 사망했다...
actors.mobs.crystalwisp.desc=매우 화가 난, 떠다니는 경화된 수정 덩어리입니다. 밝은 빛을 내고 있습니다. 특별히 강하지는 않지만, 수정 위습은 당신과 자신 사이에 장애물이 없다면 빛의 광선을 발사해 피해를 줍니다.\n\n위습은 여러 수정 돌출물 사이를 쉽게 이동할 정도로 작지만, 이를 관통하여 광선을 쏠 수는 없습니다.
actors.mobs.crystalwisp.discover_hint=이 적은 특정한 퀘스트에서 등장합니다.

actors.mobs.demonspawner.name=악마 소환수
actors.mobs.demonspawner.on_death=소환수가 죽으면서, 이곳에 있는 악마의 기운이 감소한 느낌이 든다.
actors.mobs.demonspawner.desc=이 드워프들의 살가죽이 뭉진 융합체는 이 지역에서 죽은 드워프들의 시체로부터 리퍼 악마들을 소환하는 역할을 담당하고 있습니다. 악마들은 그들의 적을 상대하기 위해 가능한 모든 자원을 사용하는 것임이 분명해 보입니다.\n\n굉장히 끔찍한 외형을 가지고 있긴 하지만, 악마 소환수들은 움직이거나 스스로를 직접 방어할 능력이 없습니다. 다만 소환수는 거대한 몸집을 가지고 있어 빠르게 처치하기가 어려우며, 또한 위협받고 있는 소환수는 더욱 빠른 속도로 리퍼 악마를 소환합니다.\n\n_악마 소환수들은 어떠한 악마적 힘을 주는 존재에 연결되어 있는 것 같습니다. 악마 소환수를 죽이면 그 존재를 약화시킬 수 있을 것 같습니다._

actors.mobs.dm100.name=DM-100
actors.mobs.dm100.zap_kill=번개 화살로 인해 사망했다...
actors.mobs.dm100.desc=DM-100은 동굴에 있는 드워프 광부들을 보호하기 위해 설계된 드워프제 '방어 기계'의 초창기 모델입니다. 그러나 전기 충격이 너무 약한 탓에, 바로 위층에 있는 인간들의 도시에 제공되었습니다. DM-100은 몇 년 동안 사용처를 찾지 못하다가 결국 감옥에 배치되었습니다. 처음에 경비원들은 이를 너무 잔인하다고 여겼으나, 점점 죄수들을 다루기 힘들어지자 이 기계는 필수품이 되었습니다.

actors.mobs.dm200.name=DM-200
actors.mobs.dm200.vent=DM-200이 유독성 배기 가스를 방출했다!
actors.mobs.dm200.desc=DM-200은 드워프제 '방어 기기'의 2세대 모델로, 동굴과 도시에 머무는 드워프 광부들을 보호하기 위하여 제작되었습니다. 이들은 이전 세대 모델보다 더욱 크고 거대하며, 위협적인 유압식 주먹으로 적들을 공격합니다.\n\n그들의 가장 큰 약점은 거대해진 크기로, 이 때문에 던전의 조그만 통로나 문을 지나갈 수 없습니다. 드워프들은 이러한 DM-200의 부족한 기동성을 너무 멀거나 다가갈 수 없는 적들에게 유독성 배기 가스를 분출하는 것으로 보완했습니다.

actors.mobs.dm201.name=DM-201
actors.mobs.dm201.vent=DM-201이 부식성 수류탄을 던졌다!
actors.mobs.dm201.desc=드워프들은 DM-200의 이동 능력 부족을 더욱 강조하면서 짧게 실험을 했고, 완전하게 멈춰 있는 몇 개의 DM 모델들을 만들었습니다. DM-201은 개조된 DM-200으로, 이동 능력이 없는 보초용 터렛 역할을 합니다. DM-201은 이동 능력이 없는 대신, 내구성과 공격력이 훨씬 더 높습니다.\n\nDM-201은 배기가스를 배출할 엔진이 없기 때문에 드워프들은 대신 부식성 가스 수류탄을 장착시켰습니다! 그러나 DM-201은 이 수류탄들을 조심히 다루며, 먼 곳에서 공격할 때만 수류탄을 던집니다.

actors.mobs.dm300.name=DM-300
actors.mobs.dm300.notice=무단 침입자 감지!
actors.mobs.dm300.shield=DM-300이 노출된 전력관의 동력을 충전하여 방어막을 생성했다!
actors.mobs.dm300.charging=동체 피해 발생! 전력탑 활성화!
actors.mobs.dm300.charging_hint=DM-300은 전력탑에서 충전 중일 때는 피해를 받지 않는다!
actors.mobs.dm300.supercharged=파괴! 파괴! 파괴!
actors.mobs.dm300.charge_lost=전력탑 파괴됨! 내부 동력으로 전환 중!
actors.mobs.dm300.pylons_destroyed=경고, 전력망의 불균형 감지!
actors.mobs.dm300.rankings_desc=DM-300에게 박살남
actors.mobs.dm300.def_verb=방어
actors.mobs.dm300.defeated=치명적인 피해 발생! 장비를 정지합니...
actors.mobs.dm300.desc=DM-300은 드워프가 제작한 '방어 기계'들 중 가장 크고 강력한 것입니다. 이토록 강력한 기계는 양산이 어려웠기 때문에, 단 몇 기만 드워프 지하 대도시를 방어하기 위해 제작되었습니다.\n\nDM-300은 유독성 배기 가스를 방출할 수 있고, 강력한 드릴로 공격을 하거나 지반을 흔들 수 있습니다. 또한 전력망에 연결되어 출력을 더욱 증폭시킬 수 있습니다.
actors.mobs.dm300.desc_supercharged=DM-300이 전력을 가득 충전했습니다. 이 상태에서는 피해를 입지 않으며 두 배의 속도로 움직입니다! 게다가 드릴의 위력 또한 _벽을 뚫고 나갈 정도로 증가_했습니다만, 벽을 파는 중에는 훨씬 느려집니다.\n\n초강력 충전된 DM-300을 직접 공격해도 소용이 없습니다. 하지만 _지역 어딘가에 전력을 공급하는 원천_이 있습니다. 그것을 파괴하면 충전이 약해질 것입니다.

actors.mobs.dwarfking.name=드워프 제왕
actors.mobs.dwarfking.notice=무엄하도다! 네놈이 감히 누구한테 덤비는가!
actors.mobs.dwarfking.lifelink_1=너희들의 정수가 필요하다, 노예들아!
actors.mobs.dwarfking.lifelink_2=피를 바치거라, 노예들아!
actors.mobs.dwarfking.teleport_1=놈을 해치워라, 노예들아!
actors.mobs.dwarfking.teleport_2=놈을 방해해라, 노예들아!
actors.mobs.dwarfking.wave_1=그만! 일어나라, 나의 종들아!
actors.mobs.dwarfking.wave_2=더! 피를 더 바치란 말이다!
actors.mobs.dwarfking.wave_3=쓸모 없는 것들! 놈을 당장 끝장내라!
actors.mobs.dwarfking.enraged=네놈은 날 죽일 수 없다, %s(이)여. 짐은 불멸이다!!
actors.mobs.dwarfking.losing=안 돼! 이럴 수는 없다... 네놈은 아래에 뭐가 있는지도 모를 테니...
actors.mobs.dwarfking.defeated=결국 네놈이... 모든 것을 끝장내는구나...
actors.mobs.dwarfking.rankings_desc=드워프의 제왕에게 무릎 꿇음
actors.mobs.dwarfking.desc=오래 전 드워프 궁정의 최고위 마법사 하나가 삶과 죽음을 아우르는 힘의 비밀을 밝혀내었습니다. 그는 곧 이 힘을 이용하여 그의 동료와 주군, 종래에는 모든 드워프 시민들을 예속하고 타락시켰습니다. 이제는 그가 제왕이 되어 언데드 군단을 부리고 있습니다.\n\n드워프 왕은 호전적인 적이며, 그의 적들을 언데드 군단으로 압도하려고 합니다.
actors.mobs.dwarfking$dkghoul.rankings_desc=드워프의 제왕에게 무릎 꿇음
actors.mobs.dwarfking$dkmonk.rankings_desc=드워프의 제왕에게 무릎 꿇음
actors.mobs.dwarfking$dkwarlock.rankings_desc=드워프의 제왕에게 무릎 꿇음
actors.mobs.dwarfking$dkgolem.rankings_desc=드워프의 제왕에게 무릎 꿇음

actors.mobs.ebonymimic.name=흑단 미믹
actors.mobs.ebonymimic.reveal=여기 미믹이 있었다!
actors.mobs.ebonymimic.hidden_name=수상한 윤곽
actors.mobs.ebonymimic.hidden_desc=이곳에 무언가 있는 것 같지만, 거의 투명합니다.
actors.mobs.ebonymimic.desc=미믹은 그들이 원하는 어떤 형태든 취할 수 있는 마법 생명체입니다. 던전에서는 거의 항상 보물상자의 형태를 선택하는데, 이는 조심성 없는 모험가를 꾀어내기 위함입니다.\n\n흑단 미믹은 눈에 거의 띄지 않는 미믹으로, 거의 완벽하게 투명해질 수 있는 능력이 있습니다. 그들은 모험가가 상호작용할 가능성이 큰 물건들에 잠복하지만, 그들만의 전리품 또한 가지고 있습니다. 정체가 드러난 후에는 일반적인 미믹과 크게 다르지 않은 전투력을 가지고 있습니다만, 기습 깨물기는 매우 파괴적입니다.
actors.mobs.ebonymimic.discover_hint=이 적은 특정한 장신구의 효과로 등장합니다.

actors.mobs.elemental$fireelemental.name=화염 정령
actors.mobs.elemental$fireelemental.desc=정령들은 강력한 초자연적 마법을 제대로 제어하지 못했을 때 만들어지는 혼돈의 생물체입니다. 정령들은 최소한의 지능만을 가지고 있으며, 이는 보통 특정한 종류의 마법에 관한 것으로 한정됩니다.\n\n화염 정령은 화염 마법으로 적들을 공격하는 흔한 종류의 정령입니다. 화염 정령은 자신이 근접 공격한 대상을 불태우며, 그리고 때때로 불꽃 화살을 발사합니다.
actors.mobs.elemental$newbornfireelemental.name=갓 소환된 화염 정령
actors.mobs.elemental$newbornfireelemental.charging=정령이 힘을 모으고 있다!
actors.mobs.elemental$newbornfireelemental.desc=정령들은 강력한 초자연적 마법을 제대로 제어하지 못했을 때 만들어지는 혼돈의 생물체입니다. 정령들은 최소한의 지능만을 가지고 있으며, 이는 보통 특정한 종류의 마법에 관한 것으로 한정됩니다.\n\n이 불의 정령은 갓 소환되었지만, 그래도 위험한 건 마찬가지입니다!
actors.mobs.elemental$newbornfireelemental.desc_boss=소환의 혼란스러운 환경 때문에, 이 정령은 한 턴 동안 힘을 모은 후 빗나가기 쉬운 불의 폭발을 흩뿌릴 수 있습니다.
actors.mobs.elemental$newbornfireelemental.desc_ally=이 정령은 주문에 의해 소환되었기 때문에, 불꽃을 조금 더 잘 다룰 수 있습니다. 원거리 공격은 불가능하지만, 근접 공격 시 적을 불태울 수 있습니다.
actors.mobs.elemental$newbornfireelemental.discover_hint=이 캐릭터는 특정한 퀘스트에서 등장합니다.
actors.mobs.elemental$frostelemental.name=서리 정령
actors.mobs.elemental$frostelemental.desc=정령들은 강력한 초자연적 마법을 제대로 제어하지 못했을 때 만들어지는 혼돈의 생물체입니다. 정령들은 최소한의 지능만을 가지고 있으며, 이는 보통 특정한 종류의 마법에 관한 것으로 한정됩니다.\n\n서리 정령은 차가운 마법을 사용하여 적들을 약화시키는 흔한 종류의 정령입니다. 서리 정령은 자신의 근접 공격과 가끔씩 사용하는 원거리 공격에 맞은 대상을 얼어붙게 하며, 이들의 마법은 물 속에 있는 대상에게 특히나 더 효과적입니다.
actors.mobs.elemental$shockelemental.name=전기 정령
actors.mobs.elemental$shockelemental.desc=정령들은 강력한 초자연적 마법을 제대로 제어하지 못했을 때 만들어지는 혼돈의 생물체입니다. 정령들은 최소한의 지능만을 가지고 있으며, 이는 보통 특정한 종류의 마법에 관한 것으로 한정됩니다.\n\n전기 정령은 전기와 섬광을 사용하여 적들을 방해하는 비교적 차가운 마법을 사용하여 적들을 약화시키는 비교적 덜 흔한 종류의 정령입니다. 전기 정령은 근접 공격을 할 때 전기를 주변의 적들에게 방출하며, 공격의 주 목표가 물 속에 있다면 더 많은 피해를 줍니다. 또한 이들은 때때로 원거리에서 공격 대상에게 광선을 쏘아 일시적으로 실명시킬 수 있습니다.
actors.mobs.elemental$chaoselemental.name=혼돈 정령
actors.mobs.elemental$chaoselemental.desc=정령들은 강력한 초자연적 마법을 제대로 제어하지 못했을 때 만들어지는 혼돈의 생물체입니다. 정령들은 최소한의 지능만을 가지고 있으며, 이는 보통 특정한 종류의 마법에 관한 것으로 한정됩니다..\n\n혼돈 정령은 특정한 원소로 안정화되지 않은 위험하고 희귀한 종류의 정령입니다. 혼돈 정령은 공격할 때마다 예측 불가능한 마법을 방출합니다.

actors.mobs.eye.name=악마의 눈
actors.mobs.eye.deathgaze_kill=죽음의 눈길에 의해 사망했다...
actors.mobs.eye.desc=악마의 눈은 악마의 에너지로 가득 찬 떠다니는 구체입니다. 근접 공격도 충분히 강력하지만, 진정한 무서움은 그것이 사용하는 마법에서 나옵니다.\n\n짧은 시간 동안 에너지를 충전한 악마의 눈은 _죽음의 시선_이라는 강력한 에너지 광선을 발사합니다. 악마의 눈의 시야에 든 모든 존재는 커다란 피해를 입게 되니, 현명한 모험가들은 사각으로 도망쳐서 피합니다.

actors.mobs.fetidrat.name=악취나는 쥐
actors.mobs.fetidrat.desc=이 쥐는 분명히 무언가 잘못되었습니다. 기름진 검은 털과 썩어가는 피부는 이전에 보았던 건강한 쥐들과는 매우 다릅니다. 창백한 녹색 눈은 유달리 위협적으로 보입니다.\n\n이 쥐는 끔찍한 악취를 풍기며, 가까이에서 매우 강렬합니다.\n\n검은 점액이 쥐의 입에서 뚝뚝 떨어지며 바닥을 녹이지만 물에서는 녹아서 없어집니다.
actors.mobs.fetidrat.discover_hint=이 캐릭터는 특정한 퀘스트에서 등장합니다.

actors.mobs.fungalcore.name=균사 핵
actors.mobs.fungalcore.desc=이 거대한 버섯은 이 동굴의 모든 균사 활동의 원천인게 확실합니다.

actors.mobs.fungalsentry.name=균사 포탑
actors.mobs.fungalsentry.desc=이 특히 큰 버섯은 이 동굴에 사는 더 큰 균사 네트워크의 방어의 핵심으로 작용니다.\n\n이 버섯은 움직이지 않지만, 시야 내에 들어오는 어떤 것이든 독을 정확하게 발사합니다. 이러한 독의 충격은 상당히 약하지만, _독은 매우 빠르게 중첩됩니다._ 이 버섯은 죽일 수는 있지만, 아마도 피하는 게 가장 좋습니다.

actors.mobs.fungalspinner.name=균사 거미
actors.mobs.fungalspinner.desc=이 동굴 거미는 기생 균사에 의해 조종되는 것으로 보입니다. 균사는 또한 그의 능력을 변경하여 거미줄과 독 주머니를 균사 성장물로 대체했습니다.\n\n균사 거미는 거미줄 대신 생명의 힘을 뱉어내어 균사 식물을 퍼뜨리고 당신을 속박할 수 있습니다. 균사 거미는 독을 줄 수는 없지만, 만약 어떤 버섯과 인접해 있다면 상당한 피해 저항력을 얻습니다.

actors.mobs.ghoul.name=드워프 구울
actors.mobs.ghoul.desc=드워프 사회가 서서히 무너지기 시작하고, 현재의 드워프 왕이 절대 권력을 장악하면서 약하거나 그에게 저항하는 자들은 좋은 대우를 받지 못했습니다. 왕이 암흑 마법을 더욱 능숙하게 휘두를 수 있게 되자, 그는 드워프들을 그의 뜻대로 세뇌했고, 이제 그들은 그의 군대의 보병 역할을 하고 있습니다.\n\n구울은 그 자체로 특별히 강하지는 않지만 항상 무리를 지어 활동하며, 많은 숫자로 상대방을 압도하려고 합니다. _하나의 구울이 쓰러지면, 다른 구울이 주변이 있는 한 계속해서 몇 턴 후에 부활하게 됩니다._

actors.mobs.gnoll.name=놀 정찰병
actors.mobs.gnoll.desc=놀은 사람의 몸에 하이에나의 얼굴을 달아놓은 모습을 하고 있습니다. 주로 하수구와 던전에 살며, 가끔 지상으로 침공을 가하기도 합니다. 놀 정찰병은 무리의 대부분을 구성하지만, 병정 계급만큼 강하지도 않고, 주술사 계급만큼 똑똑하지도 않습니다.

actors.mobs.gnollexile.name=놀 추방자
actors.mobs.gnollexile.desc=이 회색 털을 가진 놀은 어깨에 커다란 추방자의 낙인이 찍혀 있습니다. 아마도 명령이나 규칙을 따르지 않아서 공동체에서 추방된 것 같습니다. 추방자가 살아남기 위해서는 싸움 실력도 뛰어나고 생존 감각이 남달라야 합니다. 이 녀석이 창을 드는 모습을 보면 알 수 있지요.
actors.mobs.gnollexile.desc_passive=_놀 추방자는 공격할 의사가 없습니다._ 놀 추방자는 여타 놀처럼 당신을 공격적으로 쫓지 않습니다. 아마도 당신과 싸울 가치가 없다고 여기는 것 같습니다. 그냥 내버려 두는 것도 좋은 방법입니다만, 녀석이 가지고 다니는 가방엔 유용한 아이템이 있을 지도 모릅니다...
actors.mobs.gnollexile.desc_aggro=_놀 추방자가 화난 채로 주변을 살핍니다._ 무언가가 녀석이 다시 싸우게끔 만든 것 같습니다. 놈의 창을 조심하세요!
actors.mobs.gnollexile.seen_passive=창을 든 놀이 당신을 노려보지만, 공격하려고 하지는 않습니다.
actors.mobs.gnollexile.seen_aggro=창을 든 놀이 당신을 공격하려고 합니다!

actors.mobs.gnollgeomancer.name=놀 흙점쟁이
actors.mobs.gnollgeomancer.warning=흙점쟁이가 뒤척이기 시작합니다. 계속하기 전에 당신이 준비가 되어 있는지 확인하세요!
actors.mobs.gnollgeomancer.alert=흙점쟁이가 깨어났습니다! 전체 동굴이 미친듯이 웃으며 뛰어나가는 것처럼 변하고 있습니다!
actors.mobs.gnollgeomancer.rock_kill=날아오는 바위에 맞아 사망했다...
actors.mobs.gnollgeomancer.rockfall_kill=떨어지는 바위에 맞아 사망했다...
actors.mobs.gnollgeomancer.desc=이 인상적으로 커다란 상급 놀은 이 구역의 다양한 대지 이동 마법의 원천일 뿐만 아니라, 이 일대에서 벌어지는 놀 활동의 책임자이기도 합니다. 놀 공병과는 달리, 흙점쟁이는 마법에 꽤 능숙하며, 날아오거나 떨어지는 돌에 의해 피해를 받지 않습니다. 그렇지만 근접한 거리에선 전혀 싸울 수 없습니다.
actors.mobs.gnollgeomancer.desc_armor=지금은 흙점쟁이가 바위 갑옷으로 감싸여 있습니다. _흙점쟁이를 공격하기 전에 근접해서 곡괭이로 갑옷을 부수어야 합니다._
actors.mobs.gnollgeomancer.desc_armor_sapper=_근처의 놀 공병이 흙점쟁이의 바위 갑옷을 강화하는 장치를 들고 있습니다. 지금은 전혀 피해를 입힐 수 없습니다!_
actors.mobs.gnollgeomancer.desc_sleeping=이 인상적으로 커다란 놀 주술사는 암석층으로 둘러싸여 조각상과도 같은 모습입니다. 자세히 보면 바위가 상급 놀의 숨결과 함께 마법처럼 움직이는 것을 볼 수 있습니다. 이렇게 바위에 둘러싸여 있으면 피해를 입지 않고, 말 그대로 흙 낮잠을 즐기는 것처럼 보입니다.\n\n곡괭이로 암석층을 뚫을 수 있을 것입니다. 하지만 _그렇게 할 때 싸울 준비가 되어 있는지 꼭 확인하세요._ 여기에 있는 다양한 대지 이동 마법의 원천은 흙점쟁이며, 이 구역의 모든 놀 활동의 책임자입니다. _싸우기 전에 주위에 흩어져 있는 다른 놀들을 물리치는 것도 좋은 방법입니다._
actors.mobs.gnollgeomancer.discover_hint=이 캐릭터는 특정한 퀘스트에서 등장합니다.

actors.mobs.gnollguard.name=놀 경비병
actors.mobs.gnollguard.def_verb=방어
actors.mobs.gnollguard.spear_warn=놀이 창끝으로 맹렬한 타격을 가했습니다!
actors.mobs.gnollguard.desc=창과 방패를 휘두르지만, 투구는 쓰지 않은 크고 거친 모습의 놀입니다. 이 경비병은 야생 동물의 침입으로부터 광산을 보호하기 위해 훈련받은 병사일 가능성이 높습니다.\n\n놀 경비병은 한 손으로 창을 휘두를 정도로 힘이 세지만, 창을 잘 사용하지는 못합니다. _원거리에서 공격하려면 상당히 넓은 공간이 필요하며, 가까이 다가가면 공격력이 현저히 떨어집니다._
actors.mobs.gnollguard.desc_armor=_근처의 놀 공병은 이 경비병에게 대지 방어구를 부여하는 장치를 들고 있어, 입는 피해를 크게 줄이고 있습니다._
actors.mobs.gnollguard.discover_hint=이 캐릭터는 특정한 퀘스트에서 등장합니다.

actors.mobs.gnollsapper.name=놀 공병
actors.mobs.gnollsapper.desc=작고 약하지만 영리한 놀로 창백한 털과 다양한 도구로 가득한 가방을 가지고 있습니다. 그들은 아마도 여기에 어두운 금을 채굴하고 탐사하는 데 도움을 주기 위해 온 것이며, 근처 경비병에게 보호를 받고 있습니다. 그들은 싸울 수는 있지만, 그들의 공격은 놀 정찰병보다 강하지 않습니다.\n\n직접 싸우는 대신, 공병들은 바위로 된 환경이 그들을 위해 스스로 공격하도록 다양한 도구를 사용하는 것을 선호합니다. 그러나 그들은 직접 대지 이동 마법을 사용할 수 없으므로, 그들은 자신들의 도구를 무모하게 사용할 가능성이 매우 높습니다. _그들의 공격을 그들이나 그들의 경비병에게 역이용할 수 있는 방법이 있을 것입니다._
actors.mobs.gnollsapper.discover_hint=이 캐릭터는 특정한 퀘스트에서 등장합니다.

actors.mobs.gnolltrickster.name=놀 사기꾼
actors.mobs.gnolltrickster.desc=놀의 기준으로 봐서도 매우 특이한 생물체입니다. 등은 앞으로 굽어 있고 허리띠 가방을 거의 어깨에 둘러매고 있습니다. 또한 얼굴엔 사악한 미소를 머금으며 눈은 공포와 기쁨으로 크게 뜨여 있습니다.\n\n가방 안에는 조잡하게 만들어진 다트들이 많이 들어 있습니다. 모든 다트들의 끝 부분은 해로운 물질이 발라져 있는 것 같습니다.
actors.mobs.gnolltrickster.discover_hint=이 캐릭터는 특정한 퀘스트에서 등장합니다.

actors.mobs.goldenmimic.name=황금 미믹
actors.mobs.goldenmimic.desc=미믹은 그들이 원하는 어떤 모양의 물체로도 변할 수 있는 마법 생명체입니다. 던전에서 그들은 대부분 상자 모양을 하고 있는데, 이는 아무것도 모르는 모험가들을 끌어들이기 위함으로 보입니다.\n\n황금 미믹은 강한 모험가들을 끌어들이려 하는 강력한 미믹입니다. 그들은 더 좋은 전리품을 가지고 있지만, 그만큼 다른 미믹보다 더 강력합니다.

actors.mobs.golem.name=골렘
actors.mobs.golem.def_verb=방어
actors.mobs.golem.desc=골렘은 드워프 종족의 새로운 마법을 통하여 드워프 공학에 존재했던 결함을 고치기 위한 시도의 일환입니다. 이들은 DM-300에 비해 작고 효율적이면서도 그 치명적인 공격력을 유지하고 있습니다.\n\n골렘들은 여전히 통로를 지나가기엔 너무 크지만, 드워프들은 이를 보완하기 위해 그들에게 새로운 마법 능력을 부여했습니다. 그들은 순간이동을 통해 방을 오갈 수 있으며, 사거리 밖에 있는 적을 그들에게 순간이동시킬 수 있습니다.

actors.mobs.goo.name=구
actors.mobs.goo.notice=꾸륵-꾸륵!
actors.mobs.goo.defeated=꾸륵...꾸륵...
actors.mobs.goo.!!!=!!!
actors.mobs.goo.pumpup=구가 스스로의 몸집을 불리기 시작했다!
actors.mobs.goo.enraged=분노
actors.mobs.goo.gluuurp=꾸르르륵!
actors.mobs.goo.rankings_desc=구에게 흡수됨
actors.mobs.goo.desc=구에 대해서 알려진 것은 많지 않습니다. 아마도 구는 원래 생물체가 아니며, 하수구에 있던 유독한 물질들이 모여서 아주 기초적인 지성을 얻게 된 것 같습니다. 방법이야 어찌 되었든, 어두운 마법의 힘이 구를 존재하게 하는 것은 틀림없어 보입니다.\n\n구의 젤리같은 몸체는 많은 양의 암흑 에너지를 빨아들일 수 있어 가까이 다가가기만 해도 오싹함을 느낄 수 있습니다. 이 에너지를 전면으로 개방한다면 당신도 버틸 수 없습니다.

actors.mobs.greatcrab.name=거대한 게
actors.mobs.greatcrab.noticed=거대한 게가 거대한 집게발로 공격을 막았다.
actors.mobs.greatcrab.def_verb=방어
actors.mobs.greatcrab.desc=이 게는 다른 하수구 게와 비교해도 엄청 거대합니다. 파란 껍데기의 금과 깨어진 흔적으로 보건데 아주 오랜 시간을 살았을 것입니다. 이 게는 천천히 주변을 돌아다니며, 거대한 집게발 때문에 겨우 균형을 유지하고 있습니다. \n\n이 게의 집게발은 하나 뿐이지만, 그 크기 덕분에 다른 게에 비해 부족함이 없습니다. 그 거대한 집게발을 자신의 바로 앞에 들어 다가오는 모든 위협을 뚫을 수 없는 갑각으로 방어합니다. 그러나, 이 게라 할지라도 자신이 미처 눈치채지 못한 공격이나 여러 방향에서 동시에 들어오는 공격은 막아내지 못합니다.
actors.mobs.greatcrab.discover_hint=이 캐릭터는 특정한 퀘스트에서 등장합니다.

actors.mobs.guard.name=감옥 경비원
actors.mobs.guard.scorpion=이쪽으로 와라!
actors.mobs.guard.def_verb=방어
actors.mobs.guard.desc=한때 감옥을 지키던 이 경비병들도 지금은 미쳐버린 수감자들과 별반 다를 것이 없게 되었습니다. 그들은 좀비처럼 경련하며, 제 자리에 없는 것들을 찾아 복도를 돌아다닙니다. 당신을 포함해서요!\n\n그들은 허리춤에 쇠사슬을 묶어 두었습니다. 자신의 적들을 가까이 당기기 위해서죠.

actors.mobs.hermitcrab.name=소라게
actors.mobs.hermitcrab.def_verb=방어
actors.mobs.hermitcrab.desc=무슨 이유에서인지, 이 하수구 게는 부서진 통의 윗부분을 머리에 뒤집어 썼습니다! 통의 무게 때문에 보통의 게보다는 느리지만, 방어력은 더욱 보강되었습니다. 그런데, 통 속에서 무언가가 펄떡거리는 소리가 들리는 것 같습니다만...

actors.mobs.mimic.name=미믹
actors.mobs.mimic.reveal=이 상자는 미믹이다!
actors.mobs.mimic.hidden_hint=이 상자에서 무언가 불길함이 느껴진다... 가까이 다가가 상자를 열려고 하는 것은 결코 좋은 생각이 아닐 것이다.
actors.mobs.mimic.desc=미믹은 그들이 원하는 어떤 모양의 물체로도 변할 수 있는 마법 생명체입니다. 던전에서 그들은 대부분 상자 모양을 하고 있는데, 이는 아무것도 모르는 모험가들을 끌어들이기 위함으로 보입니다.\n\n미믹은 날카로운 이빨을 가지고 있지만, 보통의 상자보다 더 많은 보물을 지니고 있습니다.
actors.mobs.mimic.discover_hint=이 적은 던전의 어느 장소에서나 등장합니다.

actors.mobs.necromancer.name=사령술사
actors.mobs.necromancer.desc=이 견습 암흑 마도사들은 그들의 사악한 술법을 연습하기에 가장 적합한 장소인 감옥으로 모여들었습니다.\n\n사령술사들은 해골을 일으키고 강화하여 적들과 싸우게 합니다. 사령술사를 죽이면 그가 일으킨 해골도 함께 죽습니다.
actors.mobs.necromancer$necroskeleton.name=사령술사가 일으킨 해골
actors.mobs.necromancer$necroskeleton.desc=이 해골은 사령술사가 소환한 것입니다. 일반 해골과 똑같이 행동하며, 이 해골을 일으킨 사령술사가 죽으면 함께 죽습니다.

actors.mobs.mob.died=멀리서 무언가 죽는 소리를 들었다.
actors.mobs.mob.rage=#$%^
actors.mobs.mob.rankings_desc=%s에 의해 사망
actors.mobs.mob.discover_hint=이 적은 던전의 특정한 장소에서 등장합니다.

actors.mobs.monk.name=드워프 수도승
actors.mobs.monk.def_verb=방어
actors.mobs.monk.parried=막음
actors.mobs.monk.desc=이 수도승들은 광신도 집단으로, 신체적 완력을 통해 스스로를 그들의 왕을 지키는 데에 헌신했습니다. 너무나 헌신적인 나머지 그들은 정신마저 드워프 왕에게 굴복하였으며, 이제는 자의가 없는 좀비마냥 드워프 도시를 떠돌고 있습니다.\n\n수도승들은 오직 맨손 전투 무술에 의존하며, 그들의 무장하지 않은 맨손을 공격과 방어 모두에 자유자재로 사용할 수 있습니다. 그들이 집중한 상태가 되면, 수도승들은 그들을 향한 다음 공격을 튕겨낼 수 있으며, 이는 필중 공격에도 예외없이 적용됩니다. 그들은 움직이는 동안은 더 빠르게, 움직이지 않고 싸울 때는 더 느리게 집중력을 쌓습니다.
actors.mobs.monk$focus.name=집중
actors.mobs.monk$focus.desc=수도승은 대상에게 모든 집중력을 쏟아부어, 대상의 움직임을 완벽히 파악합니다.\n\n집중한 수도승을 향한 물리 공격은 주변 상황이 어떠했던 간에 반드시 빗나갑니다. 수도승은 공격을 막아낼 때 집중을 소모하며, 다시 공격을 막아내기 위해서는 집중력을 다시 쌓아야 합니다. 수도승들은 움직이는 동안 더 빠르게 집중력을 쌓습니다.

actors.mobs.phantompiranha.name=유령 피라냐
actors.mobs.phantompiranha.teleport_away=유령 피라냐는 다른 곳으로 순간이동했다...
actors.mobs.phantompiranha.desc=유령 피라냐는 피라냐의 희귀한 변종으로, 마법 능력과 불길한 투명색 몸을 가지고 있습니다. 공격받는 즉시 다른 곳으로 순간이동하며, 적에게서 도망치거나 재빨리 접근할 수 있습니다!\n\n싸우기엔 무척 성가신 존재지만, 유령 피라냐 고기는 아주 뛰어난 마법 효능을 가지고 있는 것으로 알려져 있습니다.

actors.mobs.piranha.name=거대 피라냐
actors.mobs.piranha.desc=이 육식성 물고기들은 침수 지역을 지키기 위해 특별히 사육되었습니다. 침입자를 잔인하게 물어뜯으므로, 직접적으로 맞서기보단 피하는 편이 좋을 것입니다.
actors.mobs.piranha.discover_hint=이 적은 던전의 어느 장소에서나 등장합니다.

actors.mobs.pylon.name=전력탑
actors.mobs.pylon.desc_inactive=전력탑은 이 구역의 기계들에게 전력을 안정적으로 공급하기 위해 세워졌습니다.\n\n현재 전력탑은 비활성화되어 피해를 입지 않습니다.
actors.mobs.pylon.desc_active=전력탑은 이 구역의 기계들에게 전력을 안정적으로 공급하기 위해 세워졌습니다. 현재 전기 에너지를 끌어모아 DM-300을 과충전시키는 것 같습니다!\n\n충전된 전력탑은 피해를 입을 수 있지만, 시계 방향으로 전기를 방출합니다. 또한 전력탑은 무거운 금속으로 만들어져 있어 강력한 피해에 저항할 수 있습니다.

actors.mobs.rat.name=주머니쥐
actors.mobs.rat.desc=주머니쥐는 하수구에 서식하는 공격적이지만 약한 생물체입니다. 주머니쥐의 이빨은 아프지만, 수가 모일 때만 목숨을 위협할 수 있습니다.

actors.mobs.ripperdemon.name=리퍼 악마
actors.mobs.ripperdemon.leap=리퍼 악마가 도약하려고 한다!
actors.mobs.ripperdemon.desc=이 끔찍한 생물들은 이 지역에 있는 많은 드워프 시체들이 악마적인 힘에 의해 사용된 결과물입니다. 리퍼는 여윈 구울 같은 생명체로, 드워프와 닮아있지만 망가진 몸체에 뼈로 만들어진 길고 날카로운 발톱을 가졌습니다.\n\n리퍼 악마는 딱히 강인하지는 않지만, 민첩하고 위험한 존재입니다. 그들은 목표에 신속하게 접근하여 발톱으로 물어뜯기 전에 먼 거리를 뛰어오를 수 있습니다.

actors.mobs.rotheart.name=부패 심장
actors.mobs.rotheart.desc=썩은열매의 열매는 매우 특이합니다. 썩어서 양분을 주는 대신, 열매가 자라나 단단해지며, 씨앗을 감쌉니다. 그리고 열매 내부에 생명 활동을 주관하는 기관이 자라나며, 단단해진 열매는 이를 보호합니다. 이 거대한 열매는 다 자란 썩은열매 식물의 심장에 비유됩니다.
actors.mobs.rotheart.discover_hint=이 캐릭터는 특정한 퀘스트에서 등장합니다.

actors.mobs.rotlasher.name=썩은 휘감개
actors.mobs.rotlasher.desc=썩은 휘감개는 성숙한 썩은열매 식물의 뿌리 구조의 일부이며, 또한 그들의 주된 방어 수단이기도 합니다. 휘감개는 근처의 대상만 감지할 수 있으며 땅 속에 묶여 있어 움직일 수도 없지만, 근처에 위협이 있으면 잠시 후에 감지하여 격렬하게 공격합니다. 근처에 먹잇감이 없으면, 움직임 없이 가만히 있어 주변 식물과 동화됩니다.
actors.mobs.rotlasher.discover_hint=이 캐릭터는 특정한 퀘스트에서 등장합니다.

actors.mobs.scorpio.name=전갈
actors.mobs.scorpio.desc=거미같이 생긴 이 거대한 악마 생물은 무슨 수를 써서라도 근접전을 피하며, 불구로 만드는 톱니 모양 가시를 먼 거리에서 쏘아댑니다.

actors.mobs.senior.name=상급 수도승
actors.mobs.senior.desc=이 수도승들은 광신적이며, 신체적 완력을 통해 스스로를 그들의 왕을 지키는 데에 헌신했습니다. 너무나 헌신적인 나머지 그들은 정신마저 드워프 왕에게 굴복하였으며, 이제는 자의가 없는 좀비마냥 드워프 도시를 떠돌고 있습니다.\n\n상급 수도승은 맨손 전투 무술에 통달했으며, 일반적인 수도승에 비해 움직이는 도중에 대상에 집중하는 속도가 매우 빠릅니다. 그들이 집중한 상태가 되면, 수도승은 자신을 향한 다음 물리 공격을 튕겨낼 수 있으며, 이는 원래는 반드시 적중했을 공격에도 예외없이 적용됩니다. 수도승들은 움직일 때 더욱 빠르게 집중력을 쌓으며, 반면 전투 중에는 비교적 느린 속도로 집중력을 쌓습니다.

actors.mobs.shaman.name=놀 주술사
actors.mobs.shaman.bolt_kill=당신은 마법 화살에 의해 사망했다...
actors.mobs.shaman.desc=놀 주술사들은 그들의 부족한 힘을 보완하기 위해 공격 마법을 사용하는 지능적인 놀들입니다. 그들은 약한 힘을 가지고 있음에도 놀 사회에서 굉장히 높으신 분 취급을 받습니다.
actors.mobs.shaman$redshaman.spell_desc=이 주술사는 붉은색 가면을 쓰고 있으며, 일시적으로 _당신의 공격 능력을 저하시키는_ 마법을 사용합니다.
actors.mobs.shaman$blueshaman.spell_desc=이 주술사는 파란색 가면을 쓰고 있으며, 일시적으로 _당신이 받는 피해를 늘리는_ 마법을 사용합니다.
actors.mobs.shaman$purpleshaman.spell_desc=이 주술사는 보라색 가면을 쓰고 있으며, 일시적으로 _당신의 정확성과 회피를 낮추는_ 마법을 사용합니다.

actors.mobs.armoredbrute.name=갑옷 입은 놀 병정
actors.mobs.armoredbrute.desc=최고위 놀 병정들은 보통 강력한 방어구를 착용하여 그들의 지위를 과시합니다. 이 방어구는 병정들이 물리적 피해에 더 잘 저항할 수 있게 하며, 또한 이들의 엄격한 규율은 이들이 전투 중에 쓰러지기 전까지 훨씬 더 오랫동안 격노할 수 있게 합니다.

actors.mobs.skeleton.name=해골
actors.mobs.skeleton.explo_kill=당신은 뼈 폭발에 의해 사망했다...
actors.mobs.skeleton.def_verb=방어
actors.mobs.skeleton.desc=해골들은 던전에서 죽은 불행한 모험가 혹은 감옥의 거주자의 뼈로 이루어져 있으며, 깊은 곳에서 올라오는 사악한 마법으로 인해 움직이고 있습니다. 해골들은 일정 피해를 받게 되면 폭발하여 온 사방으로 뼈를 흩뿌립니다. 이 폭발로 생긴 파편들은 주변에 있는 모든 대상들에게 위협적이지만, 그래도 갑옷으로 막아내기는 어렵지 않습니다.

actors.mobs.slime.name=슬라임
actors.mobs.slime.def_verb=방어
actors.mobs.slime.desc=슬라임들은 기묘한 마법 생물체로, 탄력적인 외피와 액체성 내부로 이루어져 있습니다. 도시의 하수구에서 영양분과 물을 얻으며 살아갑니다.\n\n탄력적인 외피로 인해, 슬라임에게 한 번에 _6을 넘는 피해_를 주기는 무척 어렵습니다.

actors.mobs.snake.name=하수구 뱀
actors.mobs.snake.hint=뱀에게 조사 버튼을 사용하여 어떻게 반격할 수 있는지에 대해 배워 보세요.
actors.mobs.snake.desc=거대한 하수구 뱀들은 공격을 잘 회피하는 습성 덕에 피해를 주기가 까다롭습니다. 하지만 기습이나 마법 공격 등으로 대응할 수 있습니다.\n\n뱀의 시야 바깥에서 공격하면 한 번의 기습 공격을 가합니다. 문 너머로 뱀을 유인한 뒤 _뱀이 문을 넘어온 직후에 공격_하는 것도 좋은 방법입니다.

actors.mobs.spectralnecromancer.name=영혼 사령술사
actors.mobs.spectralnecromancer.desc=사령술사의 주요 관심사는 해골들이지만, 일부는 더 영적인 추종자를 부리는 것을 좋아하기도 합니다. 그래서 영혼 사령술사는 망령들을 추종자로 삼기로 했습니다!\n\n망령 하나는 해골만큼 강력하지 않지만, 영혼 사령술사는 망령들을 대거 소환하는 데에 거리낌이 없습니다!

actors.mobs.spinner.name=동굴 거미
actors.mobs.spinner.desc=이 녹색의 털복숭이 거미는 직접적으로 싸우기보단, 그들이 쳐둔 거미줄에 걸린 희생자가 그들의 독니에 물려 천천히 죽어가는 것을 거리를 두고 지켜봅니다.  그들은 먼 거리까지 거미줄을 발사할 수 있으며, 그들의 먹잇감이 도망치려는 어떠한 길도 막으려 듭니다.

actors.mobs.statue.name=움직이는 석상
actors.mobs.statue.def_verb=방어
actors.mobs.statue.desc=단순히 봐서는 던전의 다른 움직임 없는 석상들과 다를 것 없다고 느낄 것입니다. 하지만 붉게 빛나는 석상의 눈이 그 생각을 싹 날려 버리네요.
actors.mobs.statue.desc_weapon=이 석상은 돌로 만들어져 있지만, 석상에 장착된 _%s_만큼은 진짜처럼 보입니다.
actors.mobs.statue.discover_hint=이 적은 던전의 어느 장소에서나 등장합니다.

actors.mobs.succubus.name=서큐버스
actors.mobs.succubus.desc=서큐버스는 먹잇감의 정신을 조종하는 또다른 모습의 악마입니다. 이 서큐버스는 고딕 양식의 옷을 입은 창백한 사람의 형태를 띠고 있는데, 아마 드워프 흑마법사들을 유혹하려 한 걸지도요?\n\n서큐버스들은 공격할 때 공격한 대상을 매혹시킬 수 있으며, 대상의 직접 공격을 불가능하게 만듭니다. 그들이 매혹된 적을 공격하면, 대상의 생명력을 훔칩니다.

actors.mobs.swarm.name=파리떼
actors.mobs.swarm.desc=치명적인 파리떼들이 성난 듯이 윙윙댑니다. 모든 비마법 공격은 이를 원래보다는 작지만 여전히 위험한 두 무리의 파리떼로 나누어 버립니다.

actors.mobs.tengu.name=텐구 암살자
actors.mobs.tengu.notice_gotcha=잡았다, %s!
actors.mobs.tengu.interesting=재미 좀 보겠군...
actors.mobs.tengu.notice_have=넌 내 것이다, %s!
actors.mobs.tengu.defeated=마침내 자유로구나...
actors.mobs.tengu.rankings_desc=텐구 암살자에게 암살당함
actors.mobs.tengu.desc=이 유명하고도 신비로운 암살자는 그의 얼굴에 씌워진 가면을 따라 이름 붙여졌습니다.\n\n텐구 암살자는 팔다리에 커다란 수갑을 차고 있지만, 연결 고리는 이미 끊어 버린 지 오래입니다.\n\n그는 함정, 속임수 마법, 그리고 정확한 투척 공격으로 탈출을 막는 유일한 적을 없애버릴 작정입니다. 바로 당신이죠.

actors.mobs.tengu$bombability$bombblob.desc=엄청나게 가열된 연기 구름이 피어오르고 있습니다. 조심하십시오, 곧 폭발할 것입니다!
actors.mobs.tengu$bombability$bombitem.name=연막탄
actors.mobs.tengu$bombability$bombitem.cant_pickup=이 대상은 바닥에 들러붙어 있다. 옮길 수 없다!
actors.mobs.tengu$bombability$bombitem.desc=텐구 암살자가 이곳에 기묘하게 생긴 연막탄을 던졌으며, 뜨겁고 자욱한 연기가 피어오르고 있다. 연막탄이 째깍거리는 소음을 내고 있다. 머지않아 폭발할 것 같다!\n\n폭탄이 땅에 단단히 고정되어 있기 때문에, 당신은 이 폭탄을 주울 수 없다.

actors.mobs.tengu$fireability$fireblob.desc=텐구 암살자가 이 곳에 김이 모락모락 나는 고운 가루를 던졌으며, 곧 불이 붙을 것이다!

actors.mobs.tengu$shockerability$shockerblob.desc=이곳에 전기 에너지가 차오르고 있으며, 누구라도 이 타일에 올라서면 그 다음 턴에 감전될 것이다!
actors.mobs.tengu$shockerability$shockeritem.name=전기충격기
actors.mobs.tengu$shockerability$shockeritem.cant_pickup=너무 많은 전기를 방출하고 있어, 집을 수 없다!
actors.mobs.tengu$shockerability$shockeritem.desc=텐구 암살자가 이 곳에 DM-100의 부품으로 만들어진 듯한 특이한 기계를 던졌다. 이 기계는 주변에 계속하여 전기를 뿜어내지만, 다행이 전기를 방출하는 방식은 충분히 예측 가능하다.\n\n기계 주변으로 계속하여 전류가 흐르고 있기 때문에, 이걸 주울 방법은 없다.

actors.mobs.thief.name=미치광이 도둑
actors.mobs.thief.stole=미치광이 도둑이 당신에게서 %s을(를) 훔쳤다!
actors.mobs.thief.carries=\n\n저 도둑은 _%s_ 을(를) 들고 있습니다. 분명 누군가에게서 훔친 것입니다.
actors.mobs.thief.escapes=미치광이 도둑이 당신의 %s을(를) 들고 탈출했다!
actors.mobs.thief.desc=이 수감자들은 자신의 수감실 바깥에서 자유롭게 돌아다니지만, 이 장소 자체가 그들에겐 감옥입니다. 시간이 지나면서, 이 장소는 그들의 자유뿐만 아니라 생각조차도 앗아갔습니다. 오래 전에 이 미치광이 도둑들은 그들이 누구인지, 왜 훔치는지조차도 잊어버렸습니다.\n\n도둑들은 직접 싸우기보다는 물건을 훔쳐서 달아나려고 합니다. 그들을 시야에서 놓치지 마십시오. 아니면 도둑맞은 아이템을 다신 볼 수 없을지도 모릅니다.

actors.mobs.tormentedspirit.name=저주받은 영혼
actors.mobs.tormentedspirit.desc=저주받은 영혼은 원래는 선한 영혼이었으나 저주를 받고 말았습니다. 저주받은 영혼은 저주에 씌인 동안 망령과 비슷하게 당신을 적대하며, 더욱 강력합니다!\n\n저주받은 영혼 바로 옆에서 특정 아이템을 사용하는 것으로, 영혼에 내린 저주를 풀 수도 있을 것 같습니다. 저주가 사라진 영혼은 분명 당신에게 감사해할 것입니다...
actors.mobs.tormentedspirit.thank_you=고마워...

actors.mobs.vaultrat.desc=이 쥐는 새로운 금고의 적 AI를 테스트하기 위해 여러 행동에 변화가 있습니다.\n\n_-_ 당신은 이 쥐의 움직임을 벽 너머로 '들을' 수 있습니다.\n_-_ 미리 지정된 경로를 따라 반복적으로 움직입니다.\n_-_ 경로를 따라 움직이는 동안에는 이동 방향 뒤쪽의 감지 범위가 급격하게 줄어듭니다.\n_-_ 자는 동안에도 감지 범위가 감소합니다.\n_-_ 당신을 감지한 경우 우선 '조사'를 진행한 다음 추적을 시작합니다. 조사 중인 적들은 당신을 향해 다가오지만 공격하진 않으며, 문 뒤나 코너를 지날 때 당신을 놓치기 쉽습니다.

actors.mobs.npcs.vaultsentry.name=금고 스캔 파수기
actors.mobs.npcs.vaultsentry.desc=이 파수기는 특정 패턴의 영역을 스캔하고 있습니다. _현재 이 곳은 단순 테스트 구역이기 때문에, 파수기가 당신을 감지해도 별다른 영향은 없습니다._

actors.mobs.npcs.vaultlaser.name=금고 레이저 포탑
actors.mobs.npcs.vaultlaser.desc=이 포탑은 일정 간격으로 레이저를 발사합니다. _현재 이 곳은 단순 테스트 구역이기 때문에, 레이저가 실제로 피해를 입히지는 않습니다._

actors.mobs.warlock.name=드워프 흑마법사
actors.mobs.warlock.bolt_kill=당신은 어둠의 화살에 의해 사망했다...
actors.mobs.warlock.desc=드워프들의 관심사가 공학에서 신비학으로 바뀌자, 흑마법사들은 도시의 실세가 되었습니다. 처음에는 원소 마법으로 시작했지만, 곧 악마학과 강령술로 눈을 돌리기 시작했죠. 가장 강력한 흑마법사들이 드워프 도시의 왕좌를 장악했고, 그의 하수인들은 계속해서 흑마법을 연습할 수 있었습니다. 그들의 자유 의지조차 그에게 바치기 전까지는 말이죠.\n\n이 흑마법사들은 강력하고 파괴적인 마법을 다루며, 당신의 장비에 적용된 강화 마법을 일시적으로 저하시킬 수 있습니다. 더 많이 강화된 장비일수록, 더 많은 영향을 받습니다.

actors.mobs.wraith.name=망령
actors.mobs.wraith.desc=망령은 자신의 무덤을 파헤친 자를 쫓는 복수심 가득한 영혼입니다. 완전한 영체로 이루어져 있어 일반적인 무기로 공격하는 것은 매우 힘듭니다.
actors.mobs.wraith.discover_hint=이 적은 던전의 어느 장소에서나 등장합니다.

actors.mobs.yogdzewa.name=요그제바
actors.mobs.yogdzewa.notice=숨을. 곳은. 없다.
actors.mobs.yogdzewa.darkness=어둠이 가까워지고 있다...
actors.mobs.yogdzewa.hope=네. 희망은. 환상에. 불과할. 뿐이다!
actors.mobs.yogdzewa.defeated=...
actors.mobs.yogdzewa.rankings_desc=요그제바에게 삼켜짐
actors.mobs.yogdzewa.desc=요그제바는 필멸자들의 세계로 뻗어나가 끝없는 성장을 위해 그들을 집어삼키는 오래된 신입니다. 드워프들은 흑마법과 씨름하면서 이 우주적 공포의 관심을 끌었음이 분명하며, 그 이후로 이것을 억누르려 애쓰고 있었을 것입니다.\n\n요그제바는 가공되지 않은 혼돈 마법의 차원으로부터 비롯되며, 이 세상에 진정한 형태를 가져올 수 없습니다. 대신 그는 화신체를 만들고 악마 군단을 소환해 이곳에서 할 일을 수행했습니다.\n\n이 거대한 눈알은 이 세계에 있는 요그제바의 힘의 초점입니다. 눈알 자체는 움직일 수 없지만, 강력한 흑마법 광선을 발사할 수 있고 증원으로 다양한 군단을 소환할 수 있습니다.
actors.mobs.yogdzewa.desc_spawners=당신은 위층에서 눈알로 방사되는 악마의 에너지 파동을 느낄 수 있습니다. 당신이 위에 살려둔 무언가가 요그제바에게 힘을 공급하고 있는 것이 틀림없습니다. _요그제바는 이 에너지를 더 강력한 군단을 소환하기 위해 사용할 것입니다!_
actors.mobs.yogdzewa$larva.name=신의 애벌레
actors.mobs.yogdzewa$larva.rankings_desc=요그제바에게 삼켜짐
actors.mobs.yogdzewa$larva.desc=이 요그제바의 작은 새끼는 생산하기 쉬운 간단한 추종자입니다. 각 개체는 약하지만, 이것들은 빠르게 소환되어 압도적으로 많은 수가 될 수 있습니다.
actors.mobs.yogdzewa$yogripper.rankings_desc=요그제바에게 삼켜짐
actors.mobs.yogdzewa$yogeye.rankings_desc=요그제바에게 삼켜짐
actors.mobs.yogdzewa$yogscorpio.rankings_desc=요그제바에게 삼켜짐

actors.mobs.yogfist.invuln_warn=주먹은 눈알 근처에 있을 때는 피해를 받지 않는다!
actors.mobs.yogfist.rankings_desc=요그제바에게 삼켜짐
actors.mobs.yogfist.desc=이 주먹은 요그제바의 힘의 한 측면입니다. 주먹들은 요그제바의 힘에 연결되어 있으며, 요그제바와 가까이 있을 때는 모든 피해로부터 보호받게 됩니다.
actors.mobs.yogfist$burningfist.name=불타오르는 주먹
actors.mobs.yogfist$burningfist.desc=이 주먹은 무질서한 불꽃 마법으로 이루어져 있습니다. 불타오르는 주먹이 움직일 때, 주변의 지형을 지속적으로 불태웁니다. 또한, 불타는 힘의 폭발을 발사할 수 있으며, 충돌하는 장소에 불길을 퍼뜨립니다.\n\n불타오르는 주먹의 힘은 물 근처에서는 억제되지만, 엄청난 열기 때문에 짧은 시간후 그 주변의 물을 증발시킵니다!
actors.mobs.yogfist$soiledfist.name=더러워진 주먹
actors.mobs.yogfist$soiledfist.desc=이 주먹은 무질서한 땅의 마법으로 이루어져 있습니다. 더러워진 주먹이 움직일 때, 주변에 식물을 지속적으로 자라게 합니다. 또한, 빠르게 자라나는 덩굴과 뿌리로 목표를 붙잡는 응축된 땅의 폭발을 발사할 수 있습니다.\n\n흙의 주먹은 식물들의 생명력을 흡수하여, 근처에 있는 길게 자란 풀 또는 헤쳐나간 풀의 양에 비례하여 입는 피해가 감소합니다.
actors.mobs.yogfist$rottingfist.name=부패하는 주먹
actors.mobs.yogfist$rottingfist.desc=이 주먹은 살아있는 부패로 만들어졌습니다. 이것은 썩어가는 살점의 거대한 덩어리로, 근접한 곳에서는 산성 점액을 뿌리고 먼 곳에는 유독성 가스를 퍼트립니다. 더 큰 문제는 주먹의 거대한 덩어리로 인해 직접적인 피해를 입는 대신 출혈 형태로만 피해를 입는다는 것입니다.\n\n점액은 물에서 씻어낼 수 있지만, 이 주먹은 물을 흡수하여 스스로를 치료할 수 있습니다! 또한 이 주먹이 출혈 중일 때 피해를 입히면 주먹의 출혈을 갱신할 뿐, 출혈이 쌓이지는 않습니다!
actors.mobs.yogfist$rustedfist.name=녹슨 주먹
actors.mobs.yogfist$rustedfist.desc=이 주먹은 살아있는 금속으로 이루어져 있습니다. 녹슨 주먹은 강력한 근접 공격력을 가지고 있으며, 원거리에서는 목표를 불구로 만들 수 있습니다. 엄청나게 큰 덩어리 때문에, 주먹은 즉시 피해를 받는 것이 아닌 시간이 경과함에 따라 피해를 받게 됩니다.\n\n하지만 주먹은 유연성이 없고, 좁은 통로를 지날 수 없습니다. 또한 주먹은 피해를 느리게 입지만, 여러번 공격받으면 지연된 피해가 계속해서 증가합니다.
actors.mobs.yogfist$brightfist.name=눈부신 주먹
actors.mobs.yogfist$brightfist.teleport=눈부신 주먹은 당신의 눈을 심각하게 멀게 하는 섬광 속에서 순간이동했다!
actors.mobs.yogfist$brightfist.desc=이 주먹은 순수한 빛의 에너지로 이루어져 있습니다. 눈부신 주먹은 타오르는 강력한 빛을 매 턴마다 발사할 수 있습니다. 이 광선들은 당신의 눈을 일시적으로 멀게 하며, 또한 커다란 피해를 입힙니다. 그리고 주먹은 달아나기 위해 잠시동안 전투 지역을 눈부시게 밝은 빛으로 집어삼킬 수 있습니다.\n\n하지만 이 주먹은 근거리에서 사용할 수 있는 특별한 능력은 가지고 있지 않습니다.
actors.mobs.yogfist$darkfist.name=어두운 주먹
actors.mobs.yogfist$darkfist.teleport=어두운 주먹은 당신의 광원을 없애는 어둠의 폭발 속에서 순간이동했다!
actors.mobs.yogfist$darkfist.desc=이 주먹은 순수한 어둠의 에너지로 이루어져 있습니다. 어두운 주먹은 강력한 어둠 마법의 폭발을 발사할 수 있습니다. 이 폭발들은 당신의 광원을 약하게 하며, 또한 커다란 피해를 입힙니다. 그리고 주먹은 달아나기 위해 잠시동안 전투 지역을 어둠 속으로 집어삼킬 수 있습니다.\n\n하지만 이 주먹은 근거리에서 사용할 수 있는 특별한 능력은 가지고 있지 않습니다.


actors.char.kill=%s에 의해 죽었습니다...
actors.char.defeat=당신은 %s을(를) 쓰러뜨렸다.
actors.char.def_verb=회피
actors.char.invulnerable=무적
actors.char.immune=면역

# Eternity PD Fallback Keys
actors.blobs.blizzard.desc=A blizzard is swirling here.
actors.blobs.confusiongas.desc=A cloud of confusion gas is swirling here.
actors.blobs.dancefloor.desc=Dance dance dance!\n%s dancing tile: %s\nNext color: %s
actors.blobs.dancefloor.color_1_name=Red
actors.blobs.dancefloor.color_1_desc=Characters standing on this tile take direct damage (massively increased vs hero)
actors.blobs.dancefloor.color_2_name=Green
actors.blobs.dancefloor.color_2_desc=Characters standing on this tile act at 2x speed
actors.blobs.dancefloor.color_3_name=Blue
actors.blobs.dancefloor.color_3_desc=Characters standing on this tile are stunned
actors.blobs.dancefloor.color_4_name=White
actors.blobs.dancefloor.color_4_desc=Characters standing on this tile take defered damage (massively increased vs hero)
actors.blobs.dancefloor.color_5_name=Yellow
actors.blobs.dancefloor.color_5_desc=Mobs killed on this tile give double EXP and more loot
actors.blobs.dancefloor.color_6_name=Purple
actors.blobs.dancefloor.color_6_desc=Characters standing on this tile take double damage
actors.blobs.dancefloor.rankings_desc=Danced into a grave
actors.blobs.dancefloor.ondeath=You danced into your own grave
actors.blobs.dancefloor$dancingdefereddamage.name=Dancing with Death
actors.blobs.dancefloor$dancingdefereddamage.desc=This is the most dangerous dance you've ever performed, and you are absolutely _ROCKING_ it, disregarding the pain!\n\nDeferred damage remaining: %d.
actors.blobs.dancefloor$dancingdefereddamage.ondeath=You danced into your own grave
actors.blobs.dancefloor$dancingdefereddamage.rankings_desc=Danced into a grave
actors.blobs.dancefloor$dancingdoom.name=Dancing in a grave
actors.blobs.dancefloor$dancingdoom.desc=Grave isn't the best place to dance in, but no one is stopping you!\n\nCharacters who are brave enough to dance in a grave will receive double damage from all sources.
actors.blobs.dancefloor$dancespeed.name=Dancing with Time
actors.blobs.dancefloor$dancespeed.desc=Your perfect dance synchronized with a rhythm of the universe, and not even time gonna stop you from dancing!\n\nWhile you dance is perfect, you will perform all actions at double speed.
actors.blobs.dancefloor$dancingstun.name=Stunned
actors.blobs.dancefloor$dancingstun.heromsg=You are stunned!
actors.blobs.dancefloor$dancingstun.desc=Nothing feels worse than being stunned in a middle of a dance\n\nStun completely halts all actions, forcing the target to wait until the effect wears off.
actors.blobs.electricity.desc=A field of electricity is sparking brightly here.
actors.blobs.electricity.rankings_desc=Electrocuted
actors.blobs.electricity.ondeath=You were shocked to death...
actors.blobs.fire.desc=A fire is raging here.
actors.blobs.foliage.desc=Shafts of light pierce the gloom of the underground garden.
actors.blobs.freezing.desc=The air is unnaturally frigid here.
actors.blobs.goowarn.desc=Specks of dark energy are swarming here!
actors.blobs.inferno.desc=An inferno is raging here.
actors.blobs.paralyticgas.desc=A cloud of paralytic gas is swirling here.
actors.blobs.sacrificialfire.desc=There is an altar here with a sacrificial fire burning atop it. Any creature that's killed here will be consumed as an offering to the spirits of the dungeon.\n\nPerhaps a reward will be given if enough sacrifices are made?
actors.blobs.sacrificialfire.worthy=The fire consumes your offering and grows stronger.
actors.blobs.sacrificialfire.unworthy=The fire consumes your offering, but doesn't change.
actors.blobs.sacrificialfire.reward=The fire flares and then dissipates, leaving a reward behind!
actors.blobs.smokescreen.desc=A cloud of thick black smoke is swirling here.
actors.blobs.stenchgas.desc=A cloud of fetid stench is swirling here.
actors.blobs.stormcloud.desc=A cloud of billowing water vapor is swirling here.
actors.blobs.toxicgas.desc=A greenish cloud of toxic gas is swirling here.
actors.blobs.toxicgas.rankings_desc=Suffocated
actors.blobs.toxicgas.ondeath=You died from the toxic gas...
actors.blobs.corrosivegas.desc=A cloud of deadly caustic gas is swirling here.
actors.blobs.waterofawareness.procced=As you take a sip, you feel knowledge pour into your mind.
actors.blobs.waterofawareness.desc=Power of knowledge radiates from the water of this well. Take a sip from it to reveal all secrets of equipped items and reveal all items on the current floor.
actors.blobs.waterofhealth.procced=As you take a sip, you feel your wounds heal completely.
actors.blobs.waterofhealth.desc=Power of health radiates from the water of this well. Take a sip from it to heal your wounds and satisfy hunger.
actors.blobs.wateroftransmutation.desc=Power of change radiates from the water of this well. Throw an item into the well to turn it into something else.
actors.blobs.web.desc=A thick web is covering everything here. Anything that touches or is thrown through the web will break it, but will also be stuck in place.
actors.buffs.adrenaline.name=adrenaline
actors.buffs.adrenaline.desc=A surge of physical power, adrenaline enhanced both attack and movement speed.\n\nAdrenaline allows its target to run at 2x speed, and attack at 1.5x speed.\n\nTurns remaining: %s.
actors.buffs.adrenalinesurge.name=strength boost
actors.buffs.adrenalinesurge.desc=A surge of great might, but sadly not permanent.\n\nStrength boost: +%d.\nTurns until boost weakens: %s.
actors.buffs.amok.name=amok
actors.buffs.amok.desc=Amok causes a state of great rage and confusion in its target.\n\nWhen a creature is amoked, they will attack whatever is near them, whether they be friend or foe.\n\nTurns of amok remaining: %s.
actors.buffs.arcanearmor.name=arcane armor
actors.buffs.arcanearmor.desc=A thin shield is surrounding you, blocking some of the damage from magical attacks.\n\nYour magical armor is currently boosted by: 0-%d.\n\nTurns until arcane armor weakens: %s.
actors.buffs.artifactrecharge.name=artifact recharging
actors.buffs.artifactrecharge.desc=Energy is coursing through you, increasing the rate your equipped artifacts charge.\n\nEach artifact is affected a little differently, but they will all gain charge much faster than normal.\n\nTurns remaining: %s.
actors.buffs.ascensionchallenge.name=amulet's curse
actors.buffs.ascensionchallenge.desc=Somehow Yog-Dzewa is maintaining influence on this world through the amulet, and is trying to stop your ascent!\n\nYog's power is making the dungeon much more dangerous, increasing the number of enemies and making them stronger! This power will keep building if left unchecked, it can be weakened by defeating enemies that have been enhanced by Yog's power.
actors.buffs.ascensionchallenge.desc_clear=The dark energy radiating from the amulet has been weakened as much as possible for now.
actors.buffs.ascensionchallenge.desc_beckon=The amulet is currently _calling out to distant enemies,_ alerting them to your position.
actors.buffs.ascensionchallenge.desc_haste=The amulet is currently _hastening distant enemies,_ letting them reach you faster!
actors.buffs.ascensionchallenge.desc_slow=The amulet is currently _slowing you down,_ and negating speed boosting effects!
actors.buffs.ascensionchallenge.desc_damage=The energy from the amulet has gotten so strong that it's _directly harming you!_
actors.buffs.ascensionchallenge.beckon=The amulet begins calling out to distant enemies.
actors.buffs.ascensionchallenge.haste=The amulet begins hastening distant enemies!
actors.buffs.ascensionchallenge.slow=The amulet starts to feel like a lead weight in your inventory!
actors.buffs.ascensionchallenge.damage=The amulet begins radiating dark energy. It burns!
actors.buffs.ascensionchallenge.weaken_info=You must defeat enemies to weaken the amulet's curse!
actors.buffs.ascensionchallenge.weaken=You can feel the amulet's curse weaken slightly.
actors.buffs.ascensionchallenge.break=You take a moment to catch your breath and feel your wounds begin to close!
actors.buffs.ascensionchallenge.almost=You feel Yog's grip on the amulet begin to weaken, you're almost there!
actors.buffs.ascensionchallenge.on_kill=The dark energy consumes you...
actors.buffs.barkskin.name=barkskin
actors.buffs.barkskin.desc=Your skin is hardened, it feels rough and solid like bark.\n\nThe hardened skin increases your effective armor, allowing you to better defend against physical attack.\n\nYour armor is currently increased by: 0-%d.\nTurns until barkskin weakens: %s.\n\nIf you receive barkskin from multiple sources, only the strongest one will apply.
actors.buffs.barrier.name=barrier
actors.buffs.barrier.desc=A durable bubble of force which blocks all damage.\n\nThe barrier will take damage for whatever it is protecting so long as there is shielding left. The shielding will also slowly decay over time.\n\nShielding remaining: %d.
actors.buffs.rageshield.name=Determination Shield
actors.buffs.rageshield.heromsg=You are protected by your rage!
actors.buffs.rageshield.desc=A durable bubble of your sheer rage saps away life force from nearby enemies, if you are wounded.\n\nThe barrier will drain health from enemies in your sight, angering them and taking damage. The shielding will have bigger effect if enemy is in adjacent to host.\n\nShielding remaining: %d.
actors.buffs.berserk.angered=angered
actors.buffs.berserk.berserk=berserking
actors.buffs.berserk.exhausted=exhausted
actors.buffs.berserk.recovering=recovering
actors.buffs.berserk.angered_desc=The severity of the Berserker's injuries strengthen his blows. As the berserker takes physical damage, his rage will build, granting him bonus damage. Damage which is blocked by armor still counts towards building rage.\n\nRage will fade over time. The lower the berserker's health, the longer it will last.\n\nAt 100%% rage, the Berserker can go berserk, granting him 2x his seal's max shielding, increasing to 6x if he has very low health. This shielding decays over time and once it runs out the berserker will have to rest before building rage again.\n\nCurrent Rage: _%.0f%%_\n_+%.0f%%_ damage
actors.buffs.berserk.berserk_desc=Fear and uncertainty bleed away, leaving only anger. In this state the Berserker is extremely powerful, _dealing +50% damage and gaining bonus shielding._\n\nThis bonus shielding is equal to 2x his seal's max shielding, increasing to 6x if he has very low health. When this shielding is reduced to 0, berserking will end.\n\nAfter raging, the Berserker will need to recover before being able to build rage again.
actors.buffs.berserk.recovering_desc=Inner strength has its limits. The Berserker must rest before using his rage again.\n\nWhile recovering the Berserker does not build any rage from taking damage.
actors.buffs.berserk.recovering_desc_turns=Turns until recovered: _%d_
actors.buffs.berserk.recovering_desc_levels=Levels until recovered: _%.2f_
actors.buffs.berserk.rankings_desc=Berserked to Death
actors.buffs.berserk.action_name=Berserk
actors.buffs.berserk.no_seal=You need your broken seal to berserk!
actors.buffs.bleeding.name=bleeding
actors.buffs.bleeding.ondeath=You bled to death...
actors.buffs.bleeding.heromsg=You are bleeding!
actors.buffs.bleeding.rankings_desc=Bled to Death
actors.buffs.bleeding.desc=That wound is leaking a worrisome amount of blood.\n\nBleeding causes damage every turn. Each turn the damage decreases by a random amount, until the bleeding eventually stops.\n\nCurrent bleed damage: %d.
actors.buffs.bless.name=blessed
actors.buffs.bless.desc=A great burst of focus, some say it is inspired by the gods.\n\nBlessing increases accuracy and evasion by 25%%, making the blessed much more effective in combat.\nIt also increased experience gain by 2x for heroes and allows them to get more items.\n\nTurns of bless remaining: %s.
actors.buffs.blindness.name=blinded
actors.buffs.blindness.heromsg=You are blinded!
actors.buffs.blindness.desc=Blinding turns the surrounding world into a dark haze.\n\nWhile blinded, a character's vision range is reduced to one tile, rendering ranged attacks useless and making it very easy to lose track of distant enemies. Additionally, a blinded hero is unable to read scrolls or books.\n\nTurns of blindness remaining: %s.
actors.buffs.buff.heromsg=
actors.buffs.burning.name=burning
actors.buffs.burning.heromsg=You catch fire!
actors.buffs.burning.burnsup=%s burns up!
actors.buffs.burning.ondeath=You burned to death...
actors.buffs.burning.rankings_desc=Burned to Ash
actors.buffs.burning.desc=Few things are more distressing than being engulfed in flames.\n\nFire will deal damage every turn until it is put out by water or it expires. Fire can be extinquished by stepping into water, or from the splash of a shattering potion.\n\nAdditionally, the fire may ignite flammable terrain or items that it comes into contact with.\n\nTurns of burning remaining: %s.
actors.buffs.championenemy.warn=You sense a deadly presence.
actors.buffs.championenemy$blazing.name=blazing champion
actors.buffs.championenemy$blazing.desc=Blazing champions deal 25% more melee damage, ignite enemies they attack, are immune to fire, and spread fire around them as they die. They can't spread fire onto water however.
actors.buffs.championenemy$projecting.name=projecting champion
actors.buffs.championenemy$projecting.desc=Projecting champions deal 25% more melee damage and have +3 attack range.
actors.buffs.championenemy$antimagic.name=antimagic champion
actors.buffs.championenemy$antimagic.desc=Antimagic champions take 50% less damage and are completely immune to magical effects.
actors.buffs.championenemy$giant.name=giant champion
actors.buffs.championenemy$giant.desc=Giant champions take 80% less damage and have +1 attack range, but cannot move through enclosed spaces.
actors.buffs.championenemy$blessed.name=blessed champion
actors.buffs.championenemy$blessed.desc=Blessed champions have 4x accuracy and evasion.
actors.buffs.championenemy$growing.name=growing champion
actors.buffs.championenemy$growing.desc=Growing champions gain a steadily increasing bonus to accuracy, evasion, physical damage, and a reduction to damage taken.\n\nCurrent acc/eva/dmg boost: %1$d%%\nCurrent damage reduction: %2$d%%
actors.buffs.championenemy$tanky.name=tanky champion
actors.buffs.championenemy$tanky.desc=Tanky champions receives only 5% of the damage, but reduces their damage and speed by 25%.
actors.buffs.championenemy$speedy.name=speedy champion
actors.buffs.championenemy$speedy.desc=Speedy Champions will gain x4 speed and x1.5 evasion and accuracy.
actors.buffs.championenemy$frozen.name=frozen champion
actors.buffs.championenemy$frozen.desc=Frozen champions deal 25% more melee damage but they have -20% speed, chills enemies they attack and sometimes freezes them, are immune to cold gases or effects, and spread blizzard around them as they die.
actors.buffs.championenemy$blunt.name=blunt champion
actors.buffs.championenemy$blunt.desc=Blunt champions are expert for using their hands or something they use as a blunt weapons, they deal 75% more damage as well as inflicts vertigo when they attack and paralyzes you in rare cases.
actors.buffs.charm.name=charmed
actors.buffs.charm.heromsg=You are charmed!
actors.buffs.charm.cant_attack=You are charmed by that enemy and can't attack them.
actors.buffs.charm.desc=A charm is manipulative magic that can make enemies temporarily adore each other.\n\nCharacters affected by charm are unable to directly attack the enemy they are charmed by. Attacking other targets is still possible however. The shock of pain will lessen the duration of charm.\n\nTurns of charm remaining: %s.
actors.buffs.chill.name=chilled
actors.buffs.chill.freezes=%s freezes!
actors.buffs.chill.desc=Not quite frozen, but still much too cold.\n\nChilled targets perform all actions more slowly, depending on how many turns are left in the effect. At its worst, this is equivalent to being slowed.\n\nTurns of chill remaining: %1$s.\nSpeed is reduced by: %2$s%%
actors.buffs.combo.name=combo
actors.buffs.combo.action_name=combo attack
actors.buffs.combo.combo=%d hit combo!
actors.buffs.combo.bad_target=You must target an enemy in attack range.
actors.buffs.combo.prompt=Select a target to attack.
actors.buffs.combo.desc=The gladiator builds momentum as they land successful blows. Each attack increases the combo counter by one, but taking too long between hits will reset the combo counter to 0.\n\nBuilding combo unlocks special combo attacks that cannot miss! A different attack is unlocked at 2, 4, 6, 8, and 10 combo count. Some moves reset combo and some do not, but each move can only be used once per combo session.\n\nCurrent combo: %1$d.\n\nTurns until Combo is lost: %2$s.
actors.buffs.combo$combomove.clobber.name=clobber
actors.buffs.combo$combomove.clobber.desc=Knocks an enemy back 2 tiles, but deals no damage and cannot knock into pits. Increments combo by 1.
actors.buffs.combo$combomove.clobber.empower_desc=Knocks an enemy back _3 tiles, inflicts vertigo, and can knock into pits,_ but deals no damage. Increments combo by 1.
actors.buffs.combo$combomove.slam.name=slam
actors.buffs.combo$combomove.slam.desc=Deals %d%% (combo*20%%) of your damage blocking power as bonus damage. Resets combo when used.
actors.buffs.combo$combomove.slam.empower_desc=_Leaps up to %1$d tile(s)_ and deals %2$d%% (combo*20%%) of your damage blocking power as bonus damage. Resets combo when used.
actors.buffs.combo$combomove.parry.name=parry
actors.buffs.combo$combomove.parry.desc=Blocks the next attack within 1 turn when activated, and instantly retaliates to it. Resets combo if nothing is parried.
actors.buffs.combo$combomove.parry.empower_desc=Blocks _all attacks_ within 1 turn when activated, and instantly retaliates to them. Resets combo if nothing is parried.
actors.buffs.combo$combomove.crush.name=crush
actors.buffs.combo$combomove.crush.desc=Deals %d%% (combo*25%%) damage to the primary target, and half that damage to all other enemies in a 7x7 AOE. Resets combo when used.
actors.buffs.combo$combomove.crush.empower_desc=_Leaps up to %1$d tile(s)_ and deals %2$d%% (combo*25%%) damage to the primary target, and half that damage to all other enemies in a 7x7 AOE. Resets combo when used.
actors.buffs.combo$combomove.fury.name=fury
actors.buffs.combo$combomove.fury.desc=Hits an enemy once for each combo you have, each hit deals 60% damage and can trigger enchantments. Resets combo when used.
actors.buffs.combo$combomove.fury.empower_desc=_Leaps up to %d tile(s)_ and hits an enemy once for each combo you have, each hit deals 60%% damage and can trigger enchantments. Resets combo when used.
actors.buffs.corruption.name=corrupted
actors.buffs.corruption.desc=Corruption seeps into the essence of a being, twisting them against their former nature.\n\nCorrupted creatures will attack their allies, and ignore their former enemies. Corruption is damaging as well, and will slowly cause its target to succumb.\n\nCorruption is permanent, its effects only end in death.
actors.buffs.cripple.name=crippled
actors.buffs.cripple.heromsg=You are crippled!
actors.buffs.cripple.desc=You're pretty sure legs aren't meant to bend that way.\n\nCrippled halves movement speed, making moving a tile usually take two turns instead of one.\n\nTurns of cripple remaining: %s.
actors.buffs.daze.name=dazed
actors.buffs.daze.heromsg=You are dazed!
actors.buffs.daze.desc=Ringing ears and blurred vision make it difficult to fight.\n\nWhile dazed, accuracy and evasion are reduced by 50%%, making both landing and evading blows much harder.\n\nTurns of daze remaining: %s.
actors.buffs.degrade.name=degraded
actors.buffs.degrade.heromsg=Your equipment feels weaker!
actors.buffs.degrade.desc=Powerful dark magic is sapping the strength that scrolls of upgrade have applied to your equipment!\n\nWhile degraded, upgraded gear will be treated as if it is a lower level than it actually is. _Every upgrade after +3 becomes exponentially weaker than the last one._ The descriptions of your items will change to reflect their reduced power level.\n\nDegradation does not affect strength requirements, wand charges, durability of thrown weapons, or artifacts.\n\nTurns of degradation remaining: %s. Using a scroll of upgrade or remove curse will end degradation immediately.
actors.buffs.doom.name=doomed
actors.buffs.doom.desc=It's hard to keep going when it seems like the universe wants you dead.\n\nDoomed characters will receive +67% damage from all sources.\n\nDoom is permanent, its effects only end in death.
actors.buffs.dread.name=dread
actors.buffs.dread.desc=A terror so great that it will cause its target to flee the dungeon entirely!\n\nCreatures affected by dread will run from their opponent at high speed, and will disappear from the dungeon entirely once they are out of sight. Enemies that are defeated this way award half experience and drop no items. The shock of pain will lessen the duration of dread.\n\nTurns of dread remaining: %d.
actors.buffs.drowsy.name=drowsy
actors.buffs.drowsy.desc=A magical force is making it difficult to stay awake, after a few turns, the target will fall into a deep magical sleep.\n\nThe hero can resist drowsiness by taking damage or by being at full health.\n\nTurns until sleep: %s.
actors.buffs.earthimbue.name=imbued with earth
actors.buffs.earthimbue.desc=You are imbued with the power of earth!\n\nAll physical attacks will shift the earth under the enemy, crippling them for a short time.\n\nTurns of earth imbue remaining: %s.
actors.buffs.enhancedrings.name=enhanced rings
actors.buffs.enhancedrings.desc=The Rogue's recently used artifact is empowering his rings, granting them +1 level.\n\nTurns remaining: %s.
actors.buffs.fireimbue.name=imbued with fire
actors.buffs.fireimbue.desc=You are imbued with the power of fire!\n\nAll physical attacks will have a chance to light enemies ablaze. Additionally, you are completely immune to the effects of fire.\n\nTurns of fire imbue remaining: %s.
actors.buffs.foresight.name=foresight
actors.buffs.foresight.desc=You are somehow able to see the layout of surrounding terrain with your mind.\n\nWhile under the effect of foresight all tiles in a wide radius are revealed to you, including any secret traps or doors.\n\nTurns of foresight remaining: %s.
actors.buffs.frost.name=frozen
actors.buffs.frost.freezes=%s freezes!
actors.buffs.frost.desc=Not to be confused with freezing solid, this more benign freezing simply encases the target in ice.\n\nFreezing acts similarly to paralysis, making it impossible for the target to act. Unlike paralysis, freezing is immediately cancelled if the target takes damage, as the ice will shatter.\n\nTurns of freeze remaining: %s.
actors.buffs.frostimbue.name=imbued with frost
actors.buffs.frostimbue.desc=You are imbued with icy power!\n\nAll physical attacks will steadily stack chill on enemies. Additionally, you are completely immune to the cold.\n\nTurns of frost imbue remaining: %s.
actors.buffs.fury.name=furious
actors.buffs.fury.heromsg=You become furious!
actors.buffs.fury.desc=You are angry, enemies won't like you when you're angry.\n\nA great rage burns within you, increasing the damage you deal with physical attacks by 50%%.\n\nThis rage will last as long as you are injured below 50%% health.
actors.buffs.blobimmunity.name=purification barrier
actors.buffs.blobimmunity.desc=Some strange force is encasing you in a thin protective barrier, blocking out all harmful airborne effects.\n\nYou are immune to all area-bound effects while this barrier lasts.\n\nTurns of immunity remaining: %s.
actors.buffs.greaterhaste.name=greater haste
actors.buffs.greaterhaste.desc=An incredible boost of speed, for a moment it feels as if everything else is standing still.\n\nWhile under the effects of greater haste moving actions take no time at all, but other actions are still performed at normal speed. Each step of movement consumes a turn of greater haste.\n\nTurns of greater haste remaining: %d.
actors.buffs.godspeed.name=Godspeed
actors.buffs.godspeed.desc=Godly energy courses through your whole essence, allowing you to perform actions at incredible speeds!\n\nWhile under the effects of godspeed you will perform all actions at double speed.\n\nTurns of godspeed remaining: %s.
actors.buffs.haste.name=haste
actors.buffs.haste.desc=Energy courses through your muscles, allowing you to run at incredible speeds!\n\nWhile under the effects of haste you will run at 3x speed, but will perform all other actions at normal speed.\n\nTurns of haste remaining: %s.
actors.buffs.healing.name=healing
actors.buffs.healing.desc=A magical remedy is causing wounds to close and flesh to knit.\n\nEvery turn health will steadily regenerate until the healing effect expires. The amount of healing may fade over time.\n\nNext heal: %d.\n\nHealing remaining: %d.
actors.buffs.herodisguise.name=disguise
actors.buffs.herodisguise.desc=Illusory magic has altered your physical appearance! The effect is purely cosmetic, but feels very strange regardless.\n\nTurns of disguise remaining: %s.
actors.buffs.hex.name=hexed
actors.buffs.hex.heromsg=You have been hexed!
actors.buffs.hex.desc=Dark magic which saps focus, making the target slightly disoriented.\n\nHexing reduces accuracy and evasion by 20%%, making the target less effective in combat.\n\nTurns of hex remaining: %s.
actors.buffs.holdfast.name=hold fast
actors.buffs.holdfast.desc=The %s is holding his position, increasing their armor by %d-%d. This will last until they move.
actors.buffs.hunger.hungry=hungry
actors.buffs.hunger.starving=starving
actors.buffs.hunger.onhungry=You are hungry.
actors.buffs.hunger.onstarving=You are starving!
actors.buffs.hunger.ondeath=You starved to death...
actors.buffs.hunger.cursedhorn=The cursed horn steals some of the food energy as you eat.
actors.buffs.hunger.rankings_desc=Starved to Death
actors.buffs.hunger.desc_intro_hungry=You can feel your stomach calling out for food, but it's not too urgent yet.
actors.buffs.hunger.desc_intro_starving=You're so hungry it hurts.
actors.buffs.hunger.desc=\n\nHunger slowly increases as you spend time in the dungeon, eventually you will begin to starve. While starving you will slowly lose health instead of regenerating it.\n\nRationing is important! If you have health to spare starving isn't a bad idea if it means there will be more food later. Effective rationing can make food last a lot longer!
actors.buffs.invisibility.name=invisible
actors.buffs.invisibility.desc=You are completely blended into the surrounding terrain, making you impossible to see.\n\nWhile you are invisible enemies are unable to attack or follow you. Physical attacks and magical effects (such as scrolls and wands) will immediately cancel invisibility.\n\nTurns of invisibility remaining: %s.
actors.buffs.invulnerability.name=invulnerable
actors.buffs.invulnerability.desc=You are suffused with great protective power, granting you a brief period of invulnerability!\n\nTurns remaining: %s.
actors.buffs.levitation.name=levitating
actors.buffs.levitation.desc=A magical force is levitating you over the ground, making you feel weightless.\n\nLevitating characters move silently and ignore all ground-based effects. Traps won't trigger, water won't put out fire, plants won't be trampled, roots will miss, and pits will be hovered over. Be careful, as all these things can come into effect the second the levitation ends!\n\nTurns of levitation remaining: %s.
actors.buffs.lifelink.name=life link
actors.buffs.lifelink.desc=This character's life force is linked to another character nearby. Any damage taken is shared between them.\n\nWhenever this character takes damage, half of it will be dealt to the life link target instead.\n\nTurns of life link remaining: %s, or until the linked character dies.
actors.buffs.light.name=illuminated
actors.buffs.light.desc=Even in the Darkest Dungeon, a steady light at your side is always comforting.\n\nLight helps keep darkness at bay, allowing you to see a reasonable distance despite the environment.\n\nTurns of illumination remaining: %s.
actors.buffs.lockedfloor.name=floor is locked
actors.buffs.lockedfloor.desc=The current floor is locked, and you are unable to leave it!\n\nWhile a floor is locked, you will not gain hunger or take damage from starving. In addition, if you do not work towards defeating this floor's boss, passive regeneration effects will also stop.\n\nAdditionally, if you are revived by an unblessed ankh while the floor is locked, then it will reset.\n\nKill this floor's boss to break the lock.
actors.buffs.lostinventory.name=lost inventory
actors.buffs.lostinventory.desc=Your inventory has been lost somewhere in the dungeon! You won't be able to pick up or use most items until you retrieve it.
actors.buffs.magicalsight.name=magical sight
actors.buffs.magicalsight.desc=Somehow you are able to see with your mind, rather than your eyes.\n\nWhile magical sight is active you will be able to see through all terrain in a 12 tile radius.\n\nTurns of magical sight remaining: %s.
actors.buffs.magicalsleep.name=magical sleep
actors.buffs.magicalsleep.toohealthy=You are too healthy, and resist the urge to sleep.
actors.buffs.magicalsleep.fallasleep=You fall into a deep magical sleep.
actors.buffs.magicalsleep.wakeup=You wake up feeling refreshed and healthy.
actors.buffs.magicalsleep.desc=This character has fallen into a deep magical sleep which they will not wake from naturally.\n\nMagical sleep is similar to regular sleep, except that only damage will cause the target to wake up.\n\nFor the hero and their allies, magical sleep has some restorative properties, allowing them to rapidly heal while resting.
actors.buffs.magicimmune.name=immune to magic
actors.buffs.magicimmune.desc=All magical effects have lost their hold on you, you are completely impervious to them.\n\nWhile magic immune all harmful and helpful magical effects will not apply to you, including curses, enchants, wands, scrolls, rings, artifacts, etc. Heroic armor abilities are strong enough to work regardless of this effect.\n\nTurns of magic immunity remaining: %s.
actors.buffs.overload.name=Overload
actors.buffs.overload.desc=The reality is overloaded. Prepare to cry, suffer, kill and slaughter.\n\nThe death of any hostile creature triggers the spawn of other creature.\n\nTurns of overload remaining: %s.
actors.buffs.mindvision.name=mind vision
actors.buffs.mindvision.desc=Somehow you are able to see all creatures on this floor through your mind. It's a weird feeling.\n\nAll characters on this floor are visible to you as long as you have mind vision. Seeing a creature through mind vision counts as it being seen or nearby for the purposes of many magical effects.\n\nTurns of mind vision remaining: %s.
actors.buffs.momentum.momentum=building momentum
actors.buffs.momentum.running=freerunning
actors.buffs.momentum.resting=recovering
actors.buffs.momentum.action_name=freerun
actors.buffs.momentum.momentum_desc=As he moves, the Freerunner builds momentum, which he can spend to start freerunning.\n\nEach charge of momentum grants two turns of freerunning, and the Freerunner can build up to 10 charges. Momentum is rapidly lost when the Freerunner stops moving.\n\nCurrent momentum charge: %d.
actors.buffs.momentum.running_desc=As he moves, the Freerunner builds momentum, which he can spend to start freerunning.\n\nWhile freerunning, the Freerunner moves at double speed and gains bonus evasion based on his level.\n\nTurns remaining: %d.
actors.buffs.momentum.resting_desc=As he moves, the Freerunner builds momentum, which he can spend to start freerunning.\n\nThe Freerunner needs time to regain his stamina before building momentum again.\n\nTurns remaining: %d.
actors.buffs.monkenergy.name=energy
actors.buffs.monkenergy.action=Monk Abilities
actors.buffs.monkenergy.desc=As she defeats enemies, the Monk gains energy that she can use on a variety of abilities. Most enemies grant 1 energy when defeated, and the Monk does not lose energy over time.\n\nCurrent energy: %1$d/%2$d.
actors.buffs.monkenergy.desc_cooldown=The Monk has recently used an ability, and must wait before using another.\n\nCurrent cooldown: %d turns.
actors.buffs.monkenergy$monkability$flurry.name=flurry of blows
actors.buffs.monkenergy$monkability$flurry.desc=Two instant strikes that deal %1$d-%2$d damage and ignore armor. This ability cannot be used repeatedly.
actors.buffs.monkenergy$monkability$flurry.empower_desc=Two instant strikes that deal %1$d-%2$d damage, ignore armor, _and use your weapon's enchantment._ This ability cannot be used repeatedly.
actors.buffs.monkenergy$monkability$focus.name=focus
actors.buffs.monkenergy$monkability$focus.desc=The Monk takes a turn to focus, letting her parry the next attack made against her.
actors.buffs.monkenergy$monkability$focus.empower_desc=The Monk _instantly focuses,_ letting her parry the next attack made against her.
actors.buffs.monkenergy$monkability$focus$focusbuff.name=focused
actors.buffs.monkenergy$monkability$focus$focusbuff.desc=The Monk is focused on her surroundings, anticipating the next attack made against her. While focused, she is guaranteed to parry the next incoming attack.
actors.buffs.monkenergy$monkability$dash.name=dash
actors.buffs.monkenergy$monkability$dash.prompt=Choose a Location
actors.buffs.monkenergy$monkability$dash.desc=An instant dash up to 4 tiles away. This ability can go over hazards, but not through enemies or solid terrain.
actors.buffs.monkenergy$monkability$dash.empower_desc=An instant dash up to _8 tiles_ away. This ability can go over hazards, but not through enemies or solid terrain.
actors.buffs.monkenergy$monkability$dragonkick.name=dragon kick
actors.buffs.monkenergy$monkability$dragonkick.desc=A devastating kick that deals %1$d-%2$d damage and ignores armor. The kick knocks the target away and paralyzes them for each tile they travel.
actors.buffs.monkenergy$monkability$dragonkick.empower_desc=A devastating kick that deals _%1$d-%2$d damage_ and ignores armor. The kick knocks _all adjacent targets_ away and paralyzes them for each tile they travel.
actors.buffs.monkenergy$monkability$meditate.name=meditate
actors.buffs.monkenergy$monkability$meditate.desc=The Monk focuses energy into her body for 5 turns. This clears most negative effects and grants her 8 turns of wand and artifact recharging.
actors.buffs.monkenergy$monkability$meditate.empower_desc=The Monk focuses energy into her body for 5 turns. This clears most negative effects and grants her 8 turns of wand and artifact recharging. _She also gains 80% damage resistance while meditating, and slowly heals for 20% of her missing HP._
actors.buffs.killevolution.name=kill counter
actors.buffs.killevolution.action=Kill Abilities
actors.buffs.killevolution.desc=As they defeat enemies, the hero gains energy that they can use on a variety of abilities. Most enemies grant 1 energy when defeated, and the hero does not lose energy over time.\n\n_However, unequipping a weapon associated with this buff associated with will lose all of this energy and you need to start killing enemies again_\n\nCurrent energy: %1$d/%2$d.
actors.buffs.killevolution.desc_cooldown=The hero has recently used an ability, and must wait before using another.\n\nCurrent cooldown: %d turns.
actors.buffs.killevolution$killevolutionability$invisibledash.name=invisible dash
actors.buffs.killevolution$killevolutionability$invisibledash.prompt=Choose a Location
actors.buffs.killevolution$killevolutionability$invisibledash.desc=An instant dash up to 4 tiles away with an additional turn of invisibility allowing the hero to surprise attack. This ability can go over hazards, but not through enemies or solid terrain.
actors.buffs.killevolution$killevolutionability$invisibledash.empower_desc=An instant dash up to _8 tiles_ away with an additional turn of invisibility allowing the hero to surprise attack. This ability can go over hazards, but not through enemies or solid terrain.
actors.buffs.killevolution$killevolutionability$physicallyempowered.name=physical empower
actors.buffs.killevolution$killevolutionability$physicallyempowered.desc=The hero grants itself +2 bonus damage for 10 hits.
actors.buffs.killevolution$killevolutionability$physicallyempowered.empower_desc=The hero grants itself _+4 bonus damage_ for 10 hits.
actors.buffs.killevolution$killevolutionability$weaponupgrade.name=weapon upgrade
actors.buffs.killevolution$killevolutionability$weaponupgrade.desc=The hero upgrades their weapon (and Duelist's second weapon if there's any) permanently.
actors.buffs.killevolution$killevolutionability$weaponupgrade.empower_desc=The hero upgrades their weapon (and Duelist's second weapon if there's any) _twice_ permanently.
actors.buffs.killevolution$killevolutionability$chain.name=chain enemy
actors.buffs.killevolution$killevolutionability$chain.desc=The hero chains an enemy to pull them in closer range.
actors.buffs.killevolution$killevolutionability$immortalize.name=immortalize
actors.buffs.killevolution$killevolutionability$immortalize.desc=The hero grants itself immortality against all sources of damage for 15 turns.
actors.buffs.killevolution$killevolutionability$immortalize.empower_desc=The hero grants itself immortality against all sources of damage for _~22 turns_.
actors.buffs.ooze.name=caustic ooze
actors.buffs.ooze.heromsg=Caustic ooze eats your flesh. Wash it away!
actors.buffs.ooze.ondeath=You melt away...
actors.buffs.ooze.rankings_desc=Dissolved
actors.buffs.ooze.desc=This sticky acid clings to flesh, slowly melting it away.\n\nOoze will deal consistent damage over time, but can be immediately washed off in water.\n\nTurns of ooze remaining: %s.
actors.buffs.paralysis.name=paralysed
actors.buffs.paralysis.heromsg=You are paralysed!
actors.buffs.paralysis.out=resisted paralysis
actors.buffs.paralysis.desc=Oftentimes the worst thing to do is nothing at all.\n\nParalysis completely halts all actions, forcing the target to wait until the effect wears off. The pain from taking damage can cause characters to resist paralysis, breaking them out of the effect.\n\nTurns of paralysis remaining: %s.
actors.buffs.physicalempower.name=physically empowered
actors.buffs.physicalempower.desc=Your blows have been empowered, increasing the amount of damage you can deal when you hit enemies with physical attacks.\n\nBonus damage: %1$d.\nHits remaining: %2$d.
actors.buffs.pincushion.name=pincushion
actors.buffs.pincushion.desc=The thrown weapons you have used against this character are currently stuck to them and will fall to the floor after they are defeated.\n\nThe following items are currently attached:
actors.buffs.poison.name=poisoned
actors.buffs.poison.heromsg=You are poisoned!
actors.buffs.poison.ondeath=You died from poison...
actors.buffs.poison.rankings_desc=Succumbed to Poison
actors.buffs.poison.desc=Poison works its way through the body, slowly impairing its internal functioning.\n\nPoison deals damage each turn proportional to how long until it expires.\n\nTurns of poison remaining: %s.
actors.buffs.preparation.name=preparation
actors.buffs.preparation.action_name=prepared strike
actors.buffs.preparation.desc=The Assassin is walking nervously, preparing to thurst knife into target.
actors.buffs.preparation.desc_dmg=His next attack will deal _%1$d%% bonus damage_, and will execute regular enemies below _%2$d%% health_, or bosses below _%3$d%% health_.
actors.buffs.preparation.desc_dmg_likely=The attack will also be more likely to deal a larger amount of damage.
actors.buffs.preparation.desc_blink=He is able to blink towards an enemy before striking them, with a max distance of _%d._
actors.buffs.preparation.desc_invis_time=The Assassin has been running for _%d turns._
actors.buffs.preparation.desc_invis_next=His attack will become stronger at _%d turns._
actors.buffs.preparation.prompt=Select a target to attack!\nMax blink distance: %d
actors.buffs.preparation.no_target=There's nothing to attack there.
actors.buffs.preparation.out_of_reach=That target is out of reach.
actors.buffs.preparation.assassinated=assassinated
actors.buffs.marked.name=Marked
actors.buffs.marked.desc=The Hunter is waiting patiently, preparing to strike while his bbat weakens enemies.
actors.buffs.marked.desc_dmg=The bbat deals %s%% more damage to this enemy. You will be able to jump to marked enemy at any moment, but more bonus damage means more debuffs.
actors.buffs.marked.prompt=Select a target to teleport!\nMax blink distance: your view distance
actors.buffs.marked.no_target=There's nothing to teleport there.
actors.buffs.marked.out_of_reach=That target is out of reach.
actors.buffs.marked.assassinated=assassinated
actors.buffs.marked.desc_poison=At this point, you will _poison_ a target, dealing damage over time.
actors.buffs.marked.desc_cripple=At this point, you will _cripple_ the legs of target, reducing its movement speed.
actors.buffs.marked.desc_blinding=At this point, you will also make target _blind_,reducing its field of view to 1 tile.
actors.buffs.marked.desc_bleeding=At this point, you will also make target _bleed_,dealing damage over time.
actors.buffs.marked.desc_vulnerable=At this point, you will also _increase physical damage_ to enemy.
actors.buffs.marked.desc_hexed=At this point, you will also stun target, _reducing its accuracy and dexterity_ for short time.
actors.buffs.marked.desc_slow=At this point, you will also disorientate target, _slowing_ its actions.
actors.buffs.marked.desc_ooze=At this point, you will also apply deadly _caustic ooze_ to target, dealing damage over time until target finds water.
actors.buffs.marked.desc_paralysis=At this point, you will completely _paralyse_ the enemy, rendering it unable to attack.
actors.buffs.marked.desc_doom=At this point, you will also curse the enemy, _significantly increasing any damage to it_.
actors.buffs.prismaticguard.name=prismatic Guard
actors.buffs.prismaticguard.desc=You are being guarded by a prismatic image which is currently inactive. When enemies are present the prismatic image will spring to action and protect you!\n\nWhile inactive, the prismatic image will steadily recover from any damage it has taken.\n\nCurrent HP: %d/%d.
actors.buffs.recharging.name=recharging
actors.buffs.recharging.desc=Energy is coursing through you, improving the rate that your wands and staffs charge.\n\nEach turn this buff will increase current charge by one quarter, in addition to regular recharge.\n\nTurns of recharging remaining: %s.
actors.buffs.revealedarea.name=revealed area
actors.buffs.revealedarea.desc=An area of the dungeon has been temporarily revealed to the hero, They will see it no matter where they are.\n\nTurns remaining: %s.
actors.buffs.revealedchar.name=revealed
actors.buffs.revealedchar.desc=This character is revealed to the hero, They will be visible no matter where they are.\n\nTurns remaining: %s.
actors.buffs.roots.name=rooted
actors.buffs.roots.heromsg=You can't move!
actors.buffs.roots.desc=Roots (magical or natural) grab at the feet, forcing them down to the ground.\n\nRoots lock a target in place, making movement and most movement abilities impossible. Other actions are not affected, including teleportation effects.\n\nTurns of root remaining: %s.
actors.buffs.scrollempower.name=scroll empower
actors.buffs.scrollempower.desc=The energy from the Mage's recently read scroll is empowering his wands!\n\nLevel Boost: +%1$d.\nZaps remaining: %2$d.
actors.buffs.shadows.name=shadowmelded
actors.buffs.shadows.desc=You are blended into the shadows around you, granting you invisibility and slowing your metabolism.\n\nWhile you are invisible enemies are unable to attack or follow you. Most physical attacks and magical effects (such as scrolls and wands) will immediately cancel invisibility. Additionally, while shadowmelded, your rate of hunger is slowed.\n\nYou will remain shadowmelded until you leave the shadows or an enemy comes into contact with you.
actors.buffs.slow.name=slowed
actors.buffs.slow.desc=Slowing magic affects the target's rate of time, to them everything is moving super-fast.\n\nA slowed character performs all actions in twice the amount of time they would normally take.\n\nTurns of slow remaining: %s.
actors.buffs.snipersmark.name=sniper's mark
actors.buffs.snipersmark.action_name_snapshot=snapshot
actors.buffs.snipersmark.action_name_volley=volley
actors.buffs.snipersmark.action_name_sniper=sniper shot
actors.buffs.snipersmark.desc=The Sniper is honed in on the target she most recently attacked. She is able to perform a special attack with her bow which will vary based on how the bow is augmented.\n\nAn unaugmented bow will fire a _snapshot,_ which deals reduced damage but does not take any time to fire.\n\nA bow augmented for speed will fire a _volley_ of three arrows. Each arrow will deal reduced damage, but can still activate enchantment. This volley takes 1 turn to shoot.\n\nA bow augmented for damage will fire a _sniper shot._ This shot is guaranteed to hit, deals bonus damage based on distance from the target, and takes 2 turns to fire.\n\nTurns remaining: %s.
actors.buffs.soulmark.name=soul marked
actors.buffs.soulmark.desc=The warlock has tapped into the soul of this creature, allowing him to heal as it takes physical damage.\n\nTurns of soul mark remaining: %s.
actors.buffs.stamina.name=stamina
actors.buffs.stamina.desc=You have unending stamina, allowing for faster movement!\n\nWhile under the effects of stamina you will run at +50%% speed, but will perform all other actions at normal speed.\n\nTurns of stamina remaining: %s.
actors.buffs.vulnerable.name=vulnerable
actors.buffs.vulnerable.heromsg=You feel fragile!
actors.buffs.vulnerable.desc=Vulnerability magic increases all physical damage that a character takes by 33%%, after that damage has been reduced by armor.\n\nTurns of vulnerable remaining: %s.
actors.buffs.terror.name=terrified
actors.buffs.terror.desc=Terror is manipulative magic which forces its target into an uncontrollable panic.\n\nTerrified characters are forced to run away from their opponent, trying to put as many doors and walls between them as possible. The shock of pain will lessen the duration of terror, however.\n\nTurns of terror remaining: %s.
actors.buffs.toxicimbue.name=imbued with toxicity
actors.buffs.toxicimbue.desc=You are imbued with poisonous energy!\n\nAs you move around toxic gas will constantly billow forth from you, damaging your enemies. You are immune to toxic gas and poison for the duration of the effect, as well as for a few turns afterward.\n\nTurns of toxic imbue remaining: %s.
actors.buffs.corrosion.name=corrosion
actors.buffs.corrosion.heromsg=You are melting!
actors.buffs.corrosion.ondeath=You melt away...
actors.buffs.corrosion.rankings_desc=Dissolved
actors.buffs.corrosion.desc=Powerful acid melts away flesh, metal, and bone at an alarming rate.\n\nCorrosion damage increases over time, as the target continues to melt away.\n\nTurns of corrosion remaining: %1$s.\nCurrent corrosion damage: %2$d.
actors.buffs.vertigo.name=vertigo
actors.buffs.vertigo.desc=Walking in a straight line can be difficult when the whole world is spinning.\n\nWhile under the effects of vertigo, characters who attempt to move will go in a random direction, instead of the one they intended to go in.\n\nTurns of vertigo remaining: %s.
actors.buffs.wandempower.name=wands empowered
actors.buffs.wandempower.desc=Your damage-dealing wands have been empowered, increasing the amount of damage they deal for a few hits.\n\nBonus damage: %1$d.\nHits remaining: %2$d.
actors.buffs.weakness.name=weakened
actors.buffs.weakness.heromsg=You feel weakened!
actors.buffs.weakness.desc=Everything suddenly seems much heavier.\n\nWeakening magic reduces a character's physical strength, causing them to deal 33%% reduced damage.\n\nTurns of weakness remaining: %s.
actors.buffs.wellfed.name=well fed
actors.buffs.wellfed.desc=You feel quite satisfied and full.\n\nWhile well fed, your hunger will not increase, and you will heal an additional amount of health over time.\n\nTurns remaining: %d.
actors.buffs.danceimmunebuff.name=immune to dance curse
actors.buffs.danceimmunebuff.desc=All dancing effects loses all its power for a short time, well extending the effect is not effective, you must wait for this effect to wear down before using the spell again.\n\nTurns of magic immunity remaining: %s.
actors.hero.abilities.armorability.self_target=You can't target yourself!
actors.hero.abilities.armorability.no_target=There's nothing to target there!
actors.hero.abilities.armorability.prompt=Choose a location to target
actors.hero.abilities.armorability.cost=Charge cost: _%d_
actors.hero.abilities.warrior.heroicleap.name=heroic leap
actors.hero.abilities.warrior.heroicleap.prompt=Choose direction to leap
actors.hero.abilities.warrior.heroicleap.short_desc=The Warrior performs a _Heroic Leap_ towards a targeted location, sailing above enemies and hazards.
actors.hero.abilities.warrior.heroicleap.desc=The Warrior leaps toward a targeted location, going over any enemies or hazards in the way. He cannot leap over walls or other solid terrain however.
actors.hero.abilities.warrior.shockwave.name=shockwave
actors.hero.abilities.warrior.shockwave.short_desc=The Warrior releases a _Shockwave_ in a conical AOE by slamming the ground. Enemies caught in the shockwave are damaged and crippled.
actors.hero.abilities.warrior.shockwave.desc=The Warrior slams the ground, producing a shockwave that travels up to 5 tiles in a 60 degree cone.\n\nEnemies caught in this shockwave are crippled for 5 turns. They also take 5-10 damage, plus an additional 1-2 damage for every point of strength the Warrior has above 10.
actors.hero.abilities.warrior.endure.name=endure
actors.hero.abilities.warrior.endure$enduretracker.name=endurance
actors.hero.abilities.warrior.endure$enduretracker.desc=The Warrior is now dealing bonus damage based on the damage he endured.\n\nBonus Damage: %1$d\nHits Left: %2$d
actors.hero.abilities.warrior.endure.short_desc=The Warrior _Endures_, skipping several turns but gaining high damage resistance. He then deals bonus damage based on what he endured.
actors.hero.abilities.warrior.endure.desc=The Warrior endures for 3 turns, taking half damage from all sources. This reduction is applied before damage resisting effects like armor.\n\nAfter enduring, the warrior's next hit within 10 turns gains bonus damage. This bonus damage is equal to half of all the damage inflicted on him while enduring, before any damage reduction effects!\n\nIf the Warrior has any combo, using this ability increases its remaining time by 3 turns.
actors.hero.abilities.mage.elementalblast.name=elemental blast
actors.hero.abilities.mage.elementalblast.no_staff=You can't use this ability without your staff.
actors.hero.abilities.mage.elementalblast.short_desc=The Mage emits an _Elemental Blast_ from his staff, covering a large area around him in an effect that varies based on the wand in his staff.
actors.hero.abilities.mage.elementalblast.desc=The Mage emits a blast of magic, which covers a circular region up to 4 tiles away and deals up to 15-25 damage. The specific effect of elemental blast will vary by the wand imbued in the Mage's staff.
actors.hero.abilities.mage.elementalblast.generic_desc=The effect of elemental blast will be similar to the effect of the wand when zapped at an enemy or ally.
actors.hero.abilities.mage.wildmagic.name=wild magic
actors.hero.abilities.mage.wildmagic.no_wands=You have no wands to zap with!
actors.hero.abilities.mage.wildmagic.short_desc=The Mage unleashes the _Wild Magic_ contained in his wands, randomly firing them multiple times at a chosen target over a single turn.
actors.hero.abilities.mage.wildmagic.desc=The Mage unleashes the power in his wands, randomly firing them up to 4 times in a single turn. The Mage's staff is not included in this effect.\n\nEach wand also has its level boosted by 2, up to +3. This ability uses half a wand charge for each zap, and no one wand can be fired more than 2 times.
actors.hero.abilities.mage.warpbeacon.name=warp beacon
actors.hero.abilities.mage.warpbeacon.depths=You can't warp between depths!
actors.hero.abilities.mage.warpbeacon.locked_floor=You cannot leave a locked floor!
actors.hero.abilities.mage.warpbeacon.too_far=That location is too far!
actors.hero.abilities.mage.warpbeacon.invalid_beacon=You can't place a beacon there!
actors.hero.abilities.mage.warpbeacon.window_desc=Your beacon is currently placed on floor %d.
actors.hero.abilities.mage.warpbeacon.window_tele=teleport to beacon
actors.hero.abilities.mage.warpbeacon.window_clear=clear beacon
actors.hero.abilities.mage.warpbeacon.window_cancel=cancel
actors.hero.abilities.mage.warpbeacon.short_desc=The Mage places a _Warping Beacon_ at his current location, which he can instantly teleport back to.
actors.hero.abilities.mage.warpbeacon.desc=The Mage places a beacon, which can then be warped to at will. Placing the beacon takes 1 turn, but warping to it is instantaneous.\n\nThe Mage cannot warp between floors by default, or use the beacon to reach inaccessible places such as locked rooms. The Mage can teleport into enemies, which will push them aside.
actors.hero.abilities.rogue.smokebomb.name=smoke bomb
actors.hero.abilities.rogue.smokebomb.fov=You can only jump to an empty location in your field of view
actors.hero.abilities.rogue.smokebomb.prompt=Choose a location to jump to
actors.hero.abilities.rogue.smokebomb$ninjalog.name=wooden decoy
actors.hero.abilities.rogue.smokebomb$ninjalog.desc=Somehow, enemies are easily convinced that this wooden decoy is the real Rogue!
actors.hero.abilities.rogue.smokebomb.short_desc=The Rogue throws down a _Smoke Bomb_ while blinking away. He blinds enemies near his old location.
actors.hero.abilities.rogue.smokebomb.desc=The Rogue throws down a smoke bomb and blinks up to 6 tiles away. He can blink through hazards and enemies, but not through solid terrain like walls.\n\nEnemies that are adjacent to the Rogue's old position will be blinded for 5 turns.
actors.hero.abilities.rogue.deathmark.name=death mark
actors.hero.abilities.rogue.deathmark.ally_target=You can only mark enemies
actors.hero.abilities.rogue.deathmark.short_desc=The Rogue places a _Death Mark_ on a chosen enemy. Marked enemies take bonus damage, but cannot die until the mark ends.
actors.hero.abilities.rogue.deathmark.desc=The Rogue places a mark on a chosen enemy, causing them to take 25% extra damage. The mark is applied instantly and lasts for 5 turns.\n\nMarked enemies take bonus damage but are unable to die until the mark expires. If an enemy has 0 HP when the mark ends, they will immediately die.
actors.hero.abilities.rogue.deathmark$deathmarktracker.name=marked for death
actors.hero.abilities.rogue.deathmark$deathmarktracker.desc=This enemy has been marked, causing them to take 25%% bonus damage, but also rendering them unable to die until the mark ends.\n\nTurns remaining: %s.
actors.hero.abilities.rogue.shadowclone.name=shadow clone
actors.hero.abilities.rogue.shadowclone.short_desc=The Rogue summons a _Shadow Clone_, which can be directed to aid him in combat.
actors.hero.abilities.rogue.shadowclone.desc=The Rogue summons a shadowy mimic of himself, which can be directed to aid him in combat. Directing the shadow clone does not cost any charge.\n\nThe clone has 80 HP, no armor, and deals 10-20 damage. All of these traits can be improved with talents, such that the clone benefits from weapons and armor the hero has.
actors.hero.abilities.rogue.shadowclone$shadowally.name=shadow rogue
actors.hero.abilities.rogue.shadowclone$shadowally.direct_defend=Your clone moves to that position.
actors.hero.abilities.rogue.shadowclone$shadowally.direct_follow=Your clone moves to follow you.
actors.hero.abilities.rogue.shadowclone$shadowally.direct_attack=Your clone moves to attack!
actors.hero.abilities.rogue.shadowclone$shadowally.desc=A copy of the Rogue, made from shadowy darkness. It stands stock still, with empty eyes and tiny wisps of darkness rising from it like steam.\n\nThe clone is not a perfect copy of the Rogue, but is still a decent fighter, and can benefit from the Rogue's equipment with the right talents.
actors.hero.abilities.huntress.spectralblades.name=spectral blades
actors.hero.abilities.huntress.spectralblades.short_desc=The Huntress throws _Spectral Blades_ at a target, inflicting damage depending on her currently equipped melee weapon.
actors.hero.abilities.huntress.spectralblades.desc=The Huntress throws out a spectral blade at an enemy, which acts like a ranged strike from her melee weapon. All of the normal effects of a melee weapon will activate, including enchantments.
actors.hero.abilities.huntress.naturespower.name=nature's power
actors.hero.abilities.huntress.naturespower.short_desc=The Huntress calls upon _Nature's Power_, increasing her movement speed and her bow's rate of fire for a short time.
actors.hero.abilities.huntress.naturespower.desc=The Huntress temporarily empowers herself and her bow with the power of nature! This lasts for 8 turns.\n\nDuring this time, the Huntress moves at 2x speed, and attacks 33% faster with her bow. The bonus bow effects do not trigger if the Sniper is using her special attacks.
actors.hero.abilities.huntress.naturespower$naturespowertracker.name=nature's power
actors.hero.abilities.huntress.naturespower$naturespowertracker.desc=The Huntress is briefly empowered, increasing her movement speed and attack speed with her bow.\n\nTurns remaining: %s.
actors.hero.abilities.huntress.spirithawk.name=spirit hawk
actors.hero.abilities.huntress.spirithawk.no_space=There is no free space near you.
actors.hero.abilities.huntress.spirithawk.short_desc=The Huntress summons a _Spirit Hawk_ familiar, which can help her scout locations and distract enemies.
actors.hero.abilities.huntress.spirithawk.desc=The Huntress summons a spirit hawk familiar, which can be directed by using the ability again while it is summoned. The hawk lasts for 100 turns, directing the hawk does not cost any charge.\n\nThe hawk has minimal health and attacking power, but is fast, evasive, and accurate. It shares its entire field of vision with the Huntress at all times. It is immune to all area-bound effects, such as fire and poison gas. It will not attack unless specifically directed to.
actors.hero.abilities.huntress.spirithawk$hawkally.name=spirit hawk
actors.hero.abilities.huntress.spirithawk$hawkally.direct_defend=Your hawk moves to that position.
actors.hero.abilities.huntress.spirithawk$hawkally.direct_follow=Your hawk moves to follow you.
actors.hero.abilities.huntress.spirithawk$hawkally.direct_attack=Your hawk moves to attack!
actors.hero.abilities.huntress.spirithawk$hawkally.desc=A magical hawk, summoned by the Huntress. It glows a bright ethereal blue, its head constantly shifts around as it surveys the area.\n\nWhile it isn't much of a fighter its speed and vision make it excellent for scouting and distracting enemies.
actors.hero.abilities.huntress.spirithawk$hawkally.desc_remaining=Turns remaining: %d.
actors.hero.abilities.huntress.spirithawk$hawkally.desc_dodges=Guaranteed dodges remaining: %d.
actors.hero.abilities.duelist.challenge.name=challenge
actors.hero.abilities.duelist.challenge.prompt=Choose an enemy to challenge
actors.hero.abilities.duelist.challenge.already_dueling=You can only be in one duel at a time.
actors.hero.abilities.duelist.challenge.ally_target=You can only challenge enemies.
actors.hero.abilities.duelist.challenge.unreachable_target=You must be able to reach your target.
actors.hero.abilities.duelist.challenge.distant_target=That enemy is too far away to challenge.
actors.hero.abilities.duelist.challenge.short_desc=The Duelist _Challenges_ a nearby enemy to a duel, temporarily freezing all other enemies.
actors.hero.abilities.duelist.challenge.desc=The Duelist challenges a nearby enemy to a duel. That enemy is compelled to fight her while all other enemies are temporarily frozen in time.\n\nThe target must be reachable and within 5 tiles of the Duelist. The duel lasts until 10 turns pass, the enemy dies, or the Duelist is more than 5 tiles away from the enemy.\n\nFrozen enemies are invulnerable. The Duelist's allies are not frozen by this ability, but if a boss is targeted its minions will not be frozen either.
actors.hero.abilities.duelist.challenge$duelparticipant.name=duel participant
actors.hero.abilities.duelist.challenge$duelparticipant.desc=This character is participating in a duel. They, and any of their allies or minions, are allowed to act normally while others are frozen.\n\nThe duel will last for a set amount of time, until one participant dies, or until the participants move more than 5 tiles away from eachother.\n\nTurns remaining: %d.
actors.hero.abilities.duelist.elementalstrike.name=elemental strike
actors.hero.abilities.duelist.elementalstrike.short_desc=The Duelist performs an _Elemental Strike_, spreading an effect in a conical AOE based on her weapon enchantment.
actors.hero.abilities.duelist.elementalstrike.desc=The Duelist strikes an enemy or location, performing a regular attack that's guaranteed to hit and spreading a magical effect that travels up to 4 tiles in a 65 degree cone. This magical effect varies based on the enchantment on the Duelist's primary weapon.
actors.hero.abilities.duelist.elementalstrike.generic_desc=An elemental strike with no enchantment will release a small burst of magic, dealing 6-12 damage to all enemies in range.
actors.hero.abilities.duelist.feint.name=feint
actors.hero.abilities.duelist.feint.prompt=Choose a location to dash to
actors.hero.abilities.duelist.feint.too_far=That location is not adjacent to you.
actors.hero.abilities.duelist.feint.bad_location=You can't move to that location.
actors.hero.abilities.duelist.feint.short_desc=The Duelist _Feints_, faking an attack while dashing to an adjacent tile. Enemies will attack her afterimage, leaving them open to a counterattack.
actors.hero.abilities.duelist.feint.desc=The Duelist fakes an attack while dashing to an adjacent tile, leaving behind a momentary afterimage of herself. Enemies that were attacking the Duelist will attack her afterimage instead.\n\nEnemies that attack the afterimage become confused, which cancels their next action and leaves them open to a surprise attack.
actors.hero.abilities.ratmogrify.name=ratmogrify
actors.hero.abilities.ratmogrify.cant_transform=You can't ratmogrify that!
actors.hero.abilities.ratmogrify.too_strong=That enemy is too strong to ratmogrify!
actors.hero.abilities.ratmogrify.short_desc=The hero _Ratmogrifies_ an enemy! This temporarily turns them into a rat with no abilities.
actors.hero.abilities.ratmogrify.desc=The hero transforms an enemy into a rat for 6 turns! Bosses, allies, and rats cannot be ratmogrified.\n\nRatmogrified enemies retain their original stats, but do not have any abilities.
actors.hero.abilities.ratmogrify$transmograt.name=ratmogrified %s
actors.hero.abilities.ratmogrify$transmograt.desc=This enemy has been transformed into a rat. A big improvement, if you ask me! - Rat King
actors.hero.abilities.ratmogrify$transmograt.rankings_desc=Slain by: ratmogrified enemy
actors.hero.abilities.ratking.legacywrath.name=divine fury
actors.hero.abilities.ratking.legacywrath.short_desc=I unleash my _Divine Fury_ upon my enemies. It leaves me exposed for a few turns and drains all my armor charge. Everything must come at price!
actors.hero.abilities.ratking.legacywrath.desc=I unlock the ability to channel overwhelming power. With it, I can blink to any nearby location no further than 6 tiles, blinding any enemies adjacent to my old location. Once there, I will cast a spell of magical earth on everyone I can see in 6 tiles area (the effect depends on talents) and create a fan of spectral blades targeting any mob within 6 tiles of me before turning invisible.\n\nThis ability takes 2 turns to leap, 1 turn to rooting earth, and one turn to spectral blades, though using this with no enemies in sight will skip the attacking.\n\nUnfortunately, _I have to use all of my armor charge or 33% of my current HP_ to get enough power for this ability.
actors.hero.hero.name=you
actors.hero.hero.leave=You can't leave yet, the rest of the dungeon awaits below!
actors.hero.hero.level_up=Level up!
actors.hero.hero.new_level=Level up! +Accuracy, +Evasion, +5 HP!
actors.hero.hero.new_talent=+1 Talent Point!
actors.hero.hero.unspent=You have unspent talent points!
actors.hero.hero.level_cap=You cannot grow stronger, but your experiences do give you a surge of power!
actors.hero.hero.you_now_have=you picked up: %s.
actors.hero.hero.you_cant_have=you can't carry: %s.
actors.hero.hero.locked_chest=This chest is locked and you don't have a matching key.
actors.hero.hero.locked_door=You don't have a matching key.
actors.hero.hero.noticed_smth=You noticed something.
actors.hero.hero.wait=...
actors.hero.hero.search=search
actors.hero.hero.search_distracted=It's hard to concentrate, searching is exhausting.
actors.hero.hero.pain_resist=The pain helps you resist the urge to sleep.
actors.hero.hero.revive=The ankh explodes with life-giving energy!
actors.hero.heroclass.warrior=warrior
actors.hero.heroclass.warrior_desc_short=The Warrior endures extra damage with shielding granted by his _broken seal._ The seal can be moved between armors and _transfers a single upgrade._
actors.hero.heroclass.warrior_desc=The Warrior starts with a _unique broken seal_ that generates shielding over his health. The seal can be moved between armors, and can _transfer a single upgrade_ with it.\n\nThe Warrior also starts with a _worn shortsword_, _three throwing stones_, cloth armor, a waterskin, and a velvet pouch.\n\nThe Warrior automatically identifies:\n_-_ Scrolls of Identify\n_-_ Potions of Healing\n_-_ Scrolls of Rage
actors.hero.heroclass.warrior_unlock=The Warrior is automatically unlocked.
actors.hero.heroclass.warrior_perk_desc=The Warrior gains _non-stackable 1 + (5% of current STR rounded down)_ temporary strength within _60 + (5 * current level) turns_ from eating and will be protected from taking any damage for duration of eating.\n\nThe Warrior can blind any enemy for _5 turns_ by throwing non-missiles at it. This ability has _40 turns_ cooldown.\n\nThe Warrior has _15%_ more strength, rounded down.\n\nThe Warrior can transfer any glyphs with his seal.\n\nThe Warrior regenerates his health and shielding _two times_ faster than usual.
actors.hero.heroclass.mage=mage
actors.hero.heroclass.mage_desc_short=The Mage is an arcane expert and carries a _magical staff_ that's stronger than a wand. The staff can be _imbued with any wand_ the Mage finds.
actors.hero.heroclass.mage_desc=The Mage starts with a _unique staff_, which recharges significantly faster than a wand and has 1 more charge. The staff _can be imbued with any wand_ the Mage finds in the dungeon.\n\nThe Mage also starts with a _wand of magic missile_ imbued in his staff, cloth armor, a waterskin, and a velvet pouch.\n\nThe Mage automatically identifies:\n_-_ Scrolls of Identify\n_-_ Potions of Liquid Flame\n_-_ Scrolls of Upgrade
actors.hero.heroclass.mage_unlock=To unlock the Mage _use a scroll of upgrade to make an item stronger._
actors.hero.heroclass.mage_perk_desc=The Mage gets _12 turns_ of recharging from eating.\n\nThe Mage instantly identifies any wands he picks up.\n\nThe Mage can self-target with a wand to convert all of its charges into shielding at a rate of _10.5% max HP per charge_.\n\nWhen the Mage zaps an enemy, he gains mind vision on them for _10 turns_.\n\nWhen the Mage reads a scroll, his next _3 wand zaps_ will get +(hero level/5) levels. He also has _33% chance_ to get scroll from the enemy.
actors.hero.heroclass.rogue=rogue
actors.hero.heroclass.rogue_desc_short=The Rogue can evade enemies and strike from invisibility using his _cloak of shadows._ He also _detects secrets and traps_ from a greater distance.
actors.hero.heroclass.rogue_desc=The Rogue starts with a _unique Cloak of Shadows_, which he can use to become invisible at will.\n\nThe Rogue can _detect secrets and traps_ from a greater distance.\n\nThe Rogue also starts with _a dagger_, _three throwing knives_, cloth armor, a waterskin, and a velvet pouch.\n\nThe Rogue automatically identifies:\n_-_ Scrolls of Identify\n_-_ Potions of Invisibility\n_-_ Scrolls of Magic Mapping
actors.hero.heroclass.rogue_unlock=To unlock the Rogue _perform 10 surprise attacks in one game._
actors.hero.heroclass.rogue_perk_desc=The Rogue will not wake sleeping enemies while he is _3 or more tiles away from them_.\n\nThe Rogue can search in _7x7_ area and will knock adjacent enemies away with chip damage while searching.\n\nThe Rogue can use Cloak of Shadows without equipping it but it will recharge at 66% speed.\n\nOn using Scroll of Upgrade, the Rogue will charge all his wands by _1_ charge and get _10 turns_ worth of artifact recharging.\n\nThe Rogue's bombs deal _150%_ more damage and drop from any enemy with 10% chance.
actors.hero.heroclass.huntress=huntress
actors.hero.heroclass.huntress_desc_short=The Huntress is a master of thrown weapons and has a _magical bow_ with infinite arrows. She also travels through tall grass _without trampling it._
actors.hero.heroclass.huntress_desc=The Huntress starts with a _unique spirit bow_, which can fire an infinite number of conjured arrows.\n\nThe Huntress can travel through tall grass _without trampling it_.\n\nThe Huntress also starts with _studded gloves_, cloth armor, a waterskin, and a velvet pouch.\n\nThe Huntress automatically identifies:\n_-_ Scrolls of Identify\n_-_ Potions of Mind Vision\n_-_ Scrolls of Lullaby
actors.hero.heroclass.huntress_unlock=To unlock the Huntress _hit enemies with thrown weapons 10 times in one game._
actors.hero.heroclass.huntress_perk_desc=The Huntress identifies equipment _3x_ faster.\n\nWhen the Huntress steps on short grass or embers, they spring up into tall grass which the Huntress immediately furrows. This has a _5 turn cooldown_. This talent will produce furrowed grass if passive regeneration effects are disabled or the hero has not gained exp in a long time.\n\nThe Huntress gains mind vision on any enemy within _3 tiles of her position_.\n\nThe Huntress gets _5 turns_ of adrenaline from eating.\n\nThe Huntress has 8% chance to get _1-3_ alchemical energy after killing the enemy.
actors.hero.heroclass.rat_king=rat king
actors.hero.heroclass.rat_king_desc_short=My short description is than I am awesome as king could possibly be!
actors.hero.heroclass.rat_king_desc=Why choose a class when I could just go as myself?\n\nAs myself, I take all the special class items I could find: an old seal, a staff made by some mage, a priceless cloak of shadows from my treasury, and a bow from my armory.\n\nI start with all my class items, obviously. Also I've already acquired all the bags, so I start with those too.\nI can also detect traps and secrets from a greater distance.\
actors.hero.heroclass.rat_king_perk_desc=What? I don't need any help! I am strong enough by myself!
actors.hero.heroclass.duelist=duelist
actors.hero.heroclass.duelist_desc_short=The Duelist is a weapons master who can use her weapon to trigger a _special weapon ability._ This special ability is _different for every weapon._
actors.hero.heroclass.duelist_desc=The Duelist starts with a _unique rapier_ with a special ability that recharges over time.\n\nEvery weapon in the game has a _different special ability_ that the Duelist can use.\n\nThe Duelist also starts with _two throwing spikes_, cloth armor, a waterskin, and a velvet pouch.\n\nThe Duelist automatically identifies:\n_-_ Scrolls of Identify\n_-_ Potions of Strength\n_-_ Scrolls of Mirror Image
actors.hero.heroclass.duelist_unlock=To unlock the Duelist _equip a tier 2 or higher weapon with no strength penalty._
actors.hero.heroclass.duelist_perk_desc=The Duelist gets _2 weapon charge_ and bonus melee damage equal to _level/2_ on eating.\n\nThe Duelist gains one weapon charge every _10 turns_ and deals _+8%_ melee damage when under the effect of wand or artifact recharging buffs.\n\nThe Duelist can switch her equipped weapon instantly _twice within 5 turns_, with a 20 turn cooldown.\nIf this ability is not on cooldown, quick-using an unequipped weapon will equip it.\n\nIf the Duelist's ability manages to kill any enemy, she will restore HP equal to _her level_.\n\nThe Duelist gets _+50%_ enchantment power for her attacks.
actors.hero.herosubclass.gladiator=gladiator
actors.hero.herosubclass.berserker=berserker
actors.hero.herosubclass.berserker_short_desc=The _Berserker_ builds rage as he takes damage. Rage increases his damage and can be activated at 100% for bonus shielding.
actors.hero.herosubclass.berserker_desc=The Berserker gains rage as he takes physical damage, including damage that gets blocked by his armor! Rage steadily fades away over time, but fades more slowly if he is at low HP.\n\nThe Berserker deals up to +50% damage at 100% rage. At 100% rage he can also go berserk, gaining 2-6x his seal's maximum shielding depending on his missing health and keeping his rage at 100% as long as he has shielding left. However, the Berserker needs time to recover after he goes berserk.\n\nHis rage will trigger enchantments and curses up to 60% more frequently and decay much slower.
actors.hero.herosubclass.gladiator_short_desc=The _Gladiator_ builds combo when he makes successful attacks. He can spend combo to use unique abilities.
actors.hero.herosubclass.gladiator_desc=The Gladiator builds one point of combo every time he makes a successful attack with a melee or thrown weapon. If the Gladiator does not make a successful attack within 5 turns, his combo is reset.\n\nAs combo builds it unlocks various abilities which he can spend his combo to use:\n2 Combo: knock enemy back, preserves combo; when combo is 7 or higher, knockback range increases to 3, it inflicts vertigo, and it can knock enemies into pits\n4 Combo: deal damage based on armor\n6 Combo: parry, preserves combo; when combo is 9 or higher, works on multiple attacks\n8 Combo: damage target and nearby enemies\n10 Combo: attack once for each combo\n\nWhen the Gladiator kills an enemy, the combo cooldown for his next hit is increased to _50 turns_.\n\nThe Gladiator can leap up to combo/3 tiles when using combo-spending attacks.
actors.hero.herosubclass.battlemage=battlemage
actors.hero.herosubclass.battlemage_short_desc=The _Battlemage_ conjures bonus effects when fighting in melee with his staff. These effects depend on the wand his staff is imbued with.
actors.hero.herosubclass.battlemage_desc=The Battlemage gains a bonus effect whenever he strikes in melee with his staff, as if his staff had an additional enchantment. These effects depend on the wand his staff is imbued with, every wand has its own effect. In addition to the wand effects, the Battlemage's staff will also gain 0.5 charges when he strikes with it.\n\nThe Battlemage's first melee strike with his staff after zapping with it deals double damage and staff's bonus effect gets +300% power.\n\nStriking with his staff grants the Battlemage _2 turns_ worth of artifact recharging.
actors.hero.herosubclass.warlock=warlock
actors.hero.herosubclass.warlock_short_desc=The _Warlock_ has a chance to soul mark enemies with his wands. He will heal whenever he deals physical damage to marked enemies.
actors.hero.herosubclass.warlock_desc=The Warlock has a chance to inflict a soul mark on characters when he uses wands on them. The chance to apply a soul mark and its duration increase with wand level.\n\nWhen an enemy is soul marked, the Warlock will heal 2 hp for every 5 damage he deals to them, but only with attacks from melee or thrown weapons, not from wands!\n\nWhen a soul marked enemy dies, the Warlock has a _50% chance_ to raise them as a corrupted wraith.\n\nSoul mark grants 1.5 turns of satiety for each physical damage dealt. Soul marked enemies have a 40% chance to trigger on-eat effects when they die.
actors.hero.herosubclass.assassin=hunter
actors.hero.herosubclass.assassin_short_desc=The _Hunter_ marks enemies with his bbat and inflicts debuffs with it.
actors.hero.herosubclass.assassin_desc=The _Hunter_ is trained to control darkness and use it to hunt targets with his bbat. His pet marks enemies and progressively does more damage. When any enemy is marked, the hunter can blink to it, inflicting debuffs and healing bbat depending on strength of mark.
actors.hero.herosubclass.freerunner=freerunner
actors.hero.herosubclass.freerunner_short_desc=The _Freerunner_ builds momentum as he runs, which can be used to start freerunning. This grants him bonus speed and evasion for a short while.
actors.hero.herosubclass.freerunner_desc=As the Freerunner moves he builds stacks of momentum. He can gain up to 10 momentum after running for 10 turns, but rapidly loses it if he stops moving. The freerunner can use up his momentum to start freerunning, for 2 turns per point of momentum.\n\nWhen freerunning the Freerunner moves at 2x speed, and gains bonus evasion in proportion to his level. Once freerunning ends there is a cooldown before momentum can be built again.\n\nWhile freerunning, the Freerunner gains 2x accuracy and +50% damage with thrown weapons.\n\nThe Freerunner moves at 2x speed while invisible, regardless of whether he is freerunning or not.
actors.hero.herosubclass.sniper=sniper
actors.hero.herosubclass.sniper_short_desc=The _Sniper_ can pierce armor with her ranged attacks. After striking with a thrown weapon she can follow up with a special attack from her bow.
actors.hero.herosubclass.sniper_desc=The Sniper is a master of ranged combat, whose ranged attacks pierce enemy armor. When she attacks an enemy with a thrown weapon, she places a sniper's mark on them, which lets her follow up with a special attack from her bow. This special attack varies based on how her bow is augmented.\n\nAn unaugmented bow will fire a snapshot which deals reduced damage but fires instantly. A speed bow will fire a volley of three arrows which deal reduced damage, can still activate enchantments, and take 1 turn to fire. A damage bow will fire a sniper shot which is guaranteed to hit, deals bonus damage based on distance, and takes 2 turns to fire.\n\nThrown weapons have a 100% chance to use the enchantment on the Sniper's bow.\nThis ability does not apply to darts shot from an enchanted crossbow, they already trigger the crossbow's enchantment.\n\nWhen the Sniper attacks with an upgraded thrown weapon, each level increases the duration of sniper's mark by 1 turn and the damage of her special attack by _33%_.
actors.hero.herosubclass.warden=warden
actors.hero.herosubclass.warden_short_desc=The _Warden_ can see through tall grass and gains bonus effects when she plants seeds and tramples plants.
actors.hero.herosubclass.warden_desc=The Warden has a strong connection to nature which grants her a variety of bonus effects relating to grass and plants. She is able to see through tall and furrowed grass as if it were empty space.\n\nThe Warden causes grass to sprout up around any seed she throws or plants, and gains special effects when trampling plants. These special effects replace the regular plant effects, meaning that no plant is harmful for her to step on.\n\nDewdrops can shield the Warden when her health is full, up to _100% of her max HP_.\n\nTipped darts have _5x durability_ when the Warden uses them.
actors.hero.herosubclass.king=rat king
actors.hero.herosubclass.king_short_desc=Choosing is so boring, I'd rather just pick _all the subclasses_...
actors.hero.herosubclass.king_desc=Rat King can use all subclasses at once!\n\nNot all perks are transferred to Rat King's subclass powers.
actors.hero.herosubclass.champion=champion
actors.hero.herosubclass.champion_short_desc=The _Champion_ can wield two weapons and gets more weapon charges. Her regular attacks use her primary weapon, but she can swap weapons and use either weapon's ability.
actors.hero.herosubclass.champion_desc=The Champion is a master of melee weapons who can equip a secondary weapon in addition to her primary one. Her regular attacks use her primary weapon, but she can swap her primary weapon instantly and use either weapon's ability.\n\nShe also gains 2 more max weapon ability charges and +50% weapon ability recharge speed.\n\nIf one of the Champion's two equipped weapons has a lower level and is _the same tier or lower_ than the other weapon, it will be boosted to the other weapon's level.\n\nIf the Champion uses two different weapon abilities successively, the second ability will execute any non-boss enemy left at _below 35% HP_.\n\nThe Champion instantly regains _1 weapon charge_ when she uses two different weapon abilities, with no time limit.
actors.hero.herosubclass.monk=monk
actors.hero.herosubclass.monk_short_desc=The _Monk_ builds energy while fighting. This energy can be spent on a variety of unique abilities.
actors.hero.herosubclass.monk_desc=The Monk is a master of physical technique. As she defeats enemies, she gains energy which can be used on a variety of defensive and utility-focused abilities. This energy does not fade over time, but has a cap based on the Monk's level.\n\n1 Energy: quickly strike with fists\n2 Energy: focus to dodge next attack\n3 Energy: instantly dash nearby\n4 Energy: kick an enemy away\n5 Energy: meditate to restore charges\n\nThe Monk gains _25% more energy_ for each piece of _natural tier 3_ equipment she is using.\nThe Monk gains _50% more energy_ for each piece of _natural tier 2_ equipment she is using.\nThe Monk gains _100%_ for each piece of _natural tier 1_ equipment she is using. She also gains _150% more energy_ if she has no weapon (or ring of force), and gains a free cloth armor and studded gloves.\n\nIf the Monk uses a weapon ability and a _2+ energy_ ability successively, she regains 50% of her spent energy and resets her ability cooldown.\n\nIf the Monk has _70% or more energy_, her abilities are empowered. When empowered:\n- Flurry applies enchantments at 75% power\n- Focus is instantaneous\n- Dash gains +2 range\n- Dragon Kick deals +33% damage and applies its knock back and stun effect to all adjacent enemies\n- Meditate slowly heals 20% of missing HP and grants 80% damage resistance.
actors.hero.talent$provokedangertracker.name=provoked anger
actors.hero.talent$provokedangertracker.desc=The Warrior has recently lost his shielding, his next physical attack will deal bonus damage.\n\nTurns remaining: %s.
actors.hero.talent$lingeringmagictracker.name=lingering magic
actors.hero.talent$lingeringmagictracker.desc=The Mage has recently used a staff or wand, his next physical attack will deal bonus damage.\n\nTurns remaining: %s.
actors.hero.talent$followupstriketracker.name=followup strike
actors.hero.talent$followupstriketracker.desc=The Huntress has recently attacked an enemy with a thrown weapon, her next melee attack against the same target will have boosted damage.\n\nTurns remaining: %s.
actors.hero.talent$patientstriketracker.name=patient strike
actors.hero.talent$patientstriketracker.desc=The Duelist has just spent a turn waiting, her next melee attack will deal bonus damage.
