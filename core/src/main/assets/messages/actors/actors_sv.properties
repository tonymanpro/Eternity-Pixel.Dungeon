###blobs
actors.blobs.blizzard.name=snöstorm
actors.blobs.blizzard.desc=Här virvlar en snöstorm.

actors.blobs.confusiongas.name=förvirringsgas
actors.blobs.confusiongas.desc=Här virvlar ett moln av förvirringsgas.

actors.blobs.electricity.name=elektricitet
actors.blobs.electricity.desc=Ett fält av elektricitet gnistrar starkt här.
actors.blobs.electricity.rankings_desc=Elektrifierad
actors.blobs.electricity.ondeath=Du dog av en elchock...

actors.blobs.fire.name=eld
actors.blobs.fire.desc=Här härjar en eld.

actors.blobs.foliage.name=lövverk
actors.blobs.foliage.desc=Här och var genomborrar ljusstrålar den underjordiska trädgårdens dunkel.

actors.blobs.freezing.name=frysande luft
actors.blobs.freezing.desc=Luften är onaturligt kylig här.

actors.blobs.goowarn.name=mörk energi
actors.blobs.goowarn.desc=Här myllrar det fläckar av mörk energi!

actors.blobs.inferno.name=inferno
actors.blobs.inferno.desc=Här rasar ett inferno.

actors.blobs.paralyticgas.name=förlamningsgas
actors.blobs.paralyticgas.desc=Här virvlar ett moln av förlamande gas.

actors.blobs.regrowth.name=återväxt

actors.blobs.sacrificialfire.name=offereld
actors.blobs.sacrificialfire.desc=Det finns ett altare här med en offereld som brinner ovanpå. Varje varelse som dödas här kommer att konsumeras som ett offer till fängelsehålans andar. \n\nKanske kommer en belöning att ges om tillräckligt många uppoffringar görs?
actors.blobs.sacrificialfire.worthy=Elden förtär din offring och växer sig starkare.
actors.blobs.sacrificialfire.unworthy=Elden förtär din offring, men förändras inte.
actors.blobs.sacrificialfire.reward=Elden flammar och försvinner, kvar finns det en belöning!

actors.blobs.smokescreen.name=rökridå
actors.blobs.smokescreen.desc=Här virvlar ett moln av tjock svart rök.

actors.blobs.stenchgas.name=stinkgas
actors.blobs.stenchgas.desc=Här virvlar ett moln av fruktansvärd stank.

actors.blobs.stormcloud.name=åskmoln
actors.blobs.stormcloud.desc=Här virvlar ett moln av böljande vattenånga.

actors.blobs.toxicgas.name=giftgas
actors.blobs.toxicgas.desc=Här virvlar ett moln av grönaktig giftgas.
actors.blobs.toxicgas.rankings_desc=Kvävd
actors.blobs.toxicgas.ondeath=Du dog av den giftiga gasen…

actors.blobs.corrosivegas.name=frätande gas
actors.blobs.corrosivegas.desc=Här virvlar ett moln av dödligt frätande gas.

actors.blobs.waterofawareness.name=vatten från vishetens brunn
actors.blobs.waterofawareness.procced=När du tar en klunk, känner du hur kunskap strömmar in i ditt sinne.
actors.blobs.waterofawareness.desc=Kunskapens kraft strålar ut från vattnet i den här brunnen. Dricker du från brunnen identifieras dina burna saker fullständigt. Om du bär på förbannade saker identifieras dem, samt om det finns några saker på den här nivån visas de för dig.

actors.blobs.waterofhealth.name=hälsovatten
actors.blobs.waterofhealth.procced=Du dricker en klunk och vips så läker alla dina skador.
actors.blobs.waterofhealth.desc=Hälsans kraft strålar ut från vattnet i den här brunnen. Dricker du från brunnen så läker dina sår, din hunger stillas och förbannelser lyfts från din utrustning.

actors.blobs.web.name=spindelnät
actors.blobs.web.desc=Ett tjockt nät täcker omgivningen. Allt som rör eller kastas igenom nätet förstör det, men kommer även fastna på plats.



###buffs
actors.buffs.adrenaline.name=adrenalin
actors.buffs.adrenaline.desc=Ett rus av fysisk kraft, adrenalinet förbättrade både attack och rörelsehastigheten.\n\nAdrenalin tillåter mottagaren att springa i 2x fart och attackera med 1,5x hastighet.\n\nAntal turer kvar: .%s

actors.buffs.adrenalinesurge.name=styrkeökning
actors.buffs.adrenalinesurge.desc=Ett rus av oerhörd styrka, tyvärr inte permanent.  \nStyrkeökning: +%d.\nTurer till effekten avtar %s.

actors.buffs.amok.name=amok
actors.buffs.amok.desc=Amok orsakar ett tillstånd av oerhört raseri och förvirring hos mottagaren.\n\nNär varelser löper amok anfaller de allt omkring sig, oavsett vän eller fiende.\n\nAmoklöpningen kommer att fortsätta i %s omgångar till.

actors.buffs.arcanearmor.name=magisk rustning
actors.buffs.arcanearmor.desc=En tunn sköld omger dig och blockerar en del skada från magiska attacker.\n\nDin magiska rustning är förstärkt med: 0-%d.\n\nAntal turer till skölden avtar: %s.

actors.buffs.artifactrecharge.name=uppladdning av artefakt
actors.buffs.artifactrecharge.desc=Energi strömmar genom dig och ökar laddhastigheten artefakterna du bär.\n\nVarje artefakt påverkas annorlunda, men de kommer alla att laddas mycket snabbare än normalt.\n\nAntal turer kvar: %s.

actors.buffs.ascensionchallenge.name=amulettens förbannelse
actors.buffs.ascensionchallenge.desc=På något vis bibehåller Yog-Dzewa inflytande över denna värld genom amuletten och försöker stoppa din uppgång!\n\nYogs kraft gör fängelsehålan mycket farligare, ökar antalet fiender och gör dem starkare! Kraften kommer att fortsätta byggas om den lämnas okontrollerad, den kan försvagas genom att besegra fiender som har förstärkts av Yogs kraft.
actors.buffs.ascensionchallenge.desc_clear=Den mörka energin som amuletten utstrålar har för tillfället blivit försvagad så mycket som möjligt.
actors.buffs.ascensionchallenge.desc_beckon=Amuletten _ropar just nu på avlägsna fiender_ och informerar dem om din position.
actors.buffs.ascensionchallenge.desc_haste=Amuletten _påskyndar avlägsna fiender,_ vilket låter dem nå dig snabbare!
actors.buffs.ascensionchallenge.desc_slow=Amuletten _saktar ner dig_ och motverkar hastighetsökande effekter!
actors.buffs.ascensionchallenge.desc_damage=Energin från amuletten har blivit så stark att den _skadar dig direkt!_
actors.buffs.ascensionchallenge.beckon=Amuletten börjar ropa på avlägsna fiender.
actors.buffs.ascensionchallenge.haste=Amuletten börjar påskynda avlägsna fiender!
actors.buffs.ascensionchallenge.slow=Amuletten börjar kännas som en vikt av bly i din packning!
actors.buffs.ascensionchallenge.damage=Amuletten börjar utstråla mörk energi. Det bränns!
actors.buffs.ascensionchallenge.weaken_info=Amulettens förbannelse kan försvagas genom att besegra fler fiender.
actors.buffs.ascensionchallenge.weaken_info_no_kills=Om du besegrar fiender kommer amulettens förbannelse att försvagas!
actors.buffs.ascensionchallenge.weaken=Du känner hur amulettens förbannelse försvagas något.
actors.buffs.ascensionchallenge.break=Du tar en stund och hämtar andan och känner hur dina sår börjar sluta sig!
actors.buffs.ascensionchallenge.almost=Du känner Yogs grepp om amuletten börja försvagas, du är nästan där!
actors.buffs.ascensionchallenge.on_kill=Den mörka energin förtär dig...

actors.buffs.barkskin.name=barkhud
actors.buffs.barkskin.desc=Din hud är härdad, den känns sträv och fast som bark.\n\nDen härdade huden ökar din effektiva rustning, vilket gör att du bättre kan försvara dig mot fysisk attack.\n\nDin rustning är för närvarande ökad med: 0-%d.\nAntal turer till barkhuden avtar: %s.\n\nOm du får barkhud från flera källor gäller bara den starkaste.

actors.buffs.barrier.name=barriär
actors.buffs.barrier.desc=En hållbar bubbla av kraft som blockerar all skada.\n\nBarriären kommer att ta skada för vad den än försvarar, så länge det finns skydd kvar. Skyddet kommer också sakta avta med tiden.\n\nSkydd kvar: %d.

actors.buffs.berserk.angered=förargad
actors.buffs.berserk.berserk=bärsärkar
actors.buffs.berserk.exhausted=utmattad
actors.buffs.berserk.recovering=återhämtar
actors.buffs.berserk.angered_desc=Bärsärkarens skador gör hans slag starkare. När bärsärkaren tar fysisk skada ökar hans raseri, vilket ger honom extra skada. Skada som blockeras av rustning räknas fortfarande som raseri.\n\nRaseri avtar med tiden. Ju lägre bärsärkarens HP är, desto längre varar raseriet.\n\nVid 100%%raseri kan bärsärkaren gå bärsärkargång, vilket ger honom sköld baserat på nivån på hans rustning och hans saknade HP. Vid bärsärkargång avtar hans sköld med tiden och när den tar slut måste han vila innan han kan bygga upp raseri igen.\n\nNuvarande raseri: _%1$.0f%%\n_+ %2$.0f%%_ skada\n\nBärsärkarsköld vid nuvarande rustning och HP: _%3$d_
actors.buffs.berserk.berserk_desc=Rädsla och osäkerhet försvinner och lämnar endast ilska kvar. I detta tillstånd är Bärsärkaren extremt kraftfull, _gör +50%% skada och får bonusskydd,_ men förlorar också sköld varje tur.\n\nNär allt hans sköld har minskat till 0 upphör bärsärkargången.\n\nEfter raseriet måste Bärsärkaren återhämta sig innan han kan bygga upp raseri igen.\n\nÅterstående sköld: %d
actors.buffs.berserk.recovering_desc=Inre styrka har sina gränser. Bärsärken måste vila innan han använder sitt raseri igen.\n\nNär bärsärkern återhämtar sig bygger han inte upp något raseri genom att ta skada.
actors.buffs.berserk.recovering_desc_turns=Turer tills återställd: _%d_
actors.buffs.berserk.recovering_desc_levels=Nivåer tills återställd: _%.2f_
actors.buffs.berserk.rankings_desc=Bärsärka till Döds
actors.buffs.berserk.action_name=Bärsärk
actors.buffs.berserk.no_seal=Du behöver ditt brustna sigill för att bärsärka!

actors.buffs.bleeding.name=blöder
actors.buffs.bleeding.ondeath=Du förblödde…
actors.buffs.bleeding.heromsg=Du blöder!
actors.buffs.bleeding.rankings_desc=Du förblödde…
actors.buffs.bleeding.desc=Blodet rinner oroande snabbt ur såret.\n\nBlödande orsakar skada varje tur. Varje tur minskar skadan en slumpmässig mängd, tills blödningen helt slutat.\n\nNuvarande blödningsskada : %d.

actors.buffs.bless.name=välsignad
actors.buffs.bless.desc=En stor explosion av fokus, vissa säger att det är inspirerat av gudarna.\n\nVälsignelse ökar precisionen och undvikandeförmågan med 25%%, vilket gör den välsignade mycket mer effektiv i strid.\n\nÅterstående turer av välsignelse: %s.

actors.buffs.blindness.name=bländad
actors.buffs.blindness.heromsg=Du är bländad!
actors.buffs.blindness.desc=Du är bländad och världen runtomkring är som en mörk dimma.\n\nEn bländad karaktär kan inte se mer än en ruta framför sig, vilket gör avståndsattacker lönlösa och gör det svårt att hålla koll på fiender längre bort. Förblindade hjältar kan dessutom inte läsa skriftrullar eller böcker.\n\nTurer till blindheten avtar: %s.

actors.buffs.buff.heromsg=

actors.buffs.burning.name=brinner
actors.buffs.burning.heromsg=Du fattar eld!
actors.buffs.burning.burnsup=%s brinner upp!
actors.buffs.burning.ondeath=Du brann ihjäl...
actors.buffs.burning.rankings_desc=Bränd till aska
actors.buffs.burning.desc=Få saker är mer plågsamma än att vara omgiven av lågor.\n\nElden orsakar skada varje tur tills den släckas med vatten eller upphör att gälla. Elden kan släckas genom att man går i vatten eller genom stänk från en krossad dryck.\n\nDessutom kan elden antända brandfarlig terräng eller föremål som den kommer i kontakt med.\n\nÅterstående brinnande turer: %s.

actors.buffs.championenemy.warn=Du känner en dödlig närvaro.
actors.buffs.championenemy$blazing.name=blossande kämpe
actors.buffs.championenemy$blazing.desc=Blossande kämpar gör 25% mer närstridsskada, antänder fiender de attackerar, är immuna mot eld och sprider eld runtomkring sig när de dör. De kan dock inte sprida eld på vatten.
actors.buffs.championenemy$projecting.name=projicerande kämpe
actors.buffs.championenemy$projecting.desc=Projicerande kämpar gör 25% mer närstridsskada och har +3 räckvidd.
actors.buffs.championenemy$antimagic.name=antimagisk kämpe
actors.buffs.championenemy$antimagic.desc=Antimagiska kämpar tar 50% mindre skada och är helt immuna mot magiska effekter.
actors.buffs.championenemy$giant.name=gigantkämpe
actors.buffs.championenemy$giant.desc=Gigantkämpar tar 80% mindre skada och har +1 räckvidd, men kan inte ta sig genom trånga utrymmen.
actors.buffs.championenemy$blessed.name=välsignad kämpe
actors.buffs.championenemy$blessed.desc=Välsignade kämpar har 4x träffsäkerhet och undvikande.
actors.buffs.championenemy$growing.name=växande kämpe
actors.buffs.championenemy$growing.desc=Växande kämpar har en stadigt ökande bonus för träffsäkerhet, undvikande, fysisk skada och skadereduktion.\n\nNuvarande träff/und/ska-ökning: %1$d%%\nNuvarande skadereduktion: %2$d%%

actors.buffs.charm.name=förtjust
actors.buffs.charm.heromsg=Du är tjusad!
actors.buffs.charm.cant_attack=Du är förtjusad i fienden och kan inte attackera den.
actors.buffs.charm.desc=En tjusning är en manipulativ magi som temporärt får levande ting att attraheras av varandra.\n\nDrabbade ting kan attackerar inte den som förtjuser. Det är dock möjligt att attackera andra. Förtjusningar försvagas av att ta skada.\n\nOmgångar förtjusningen består: %s.

actors.buffs.chill.name=nedkyld
actors.buffs.chill.freezes=%s fryser!
actors.buffs.chill.desc=Inte stelfrusen, men fortfarande alldeles för nedkyld.\n\nNedkylda mål gör sina handlingar långsammare, beroende på hur många omgångar effekten består. Som värst är det likställt med att vara förslöad.\n\nOmgångar nedkyldheten består: %1$s\nHastighetsreduktion: %2$s%%

actors.buffs.combo.name=kombination
actors.buffs.combo.action_name=kombinationsattack
actors.buffs.combo.combo=%d träffkombination!
actors.buffs.combo.bad_target=Du måste välja en fiende inom attackens räckvidd.
actors.buffs.combo.prompt=Välj en måltavla att attackera.
actors.buffs.combo.desc=Gladiatorn bygger upp fart när han landar framgångsrika slag. Varje attack ökar kombomätaren med ett, men om det tar för lång tid mellan slagen återställs kombomätaren till 0. Vid kombinationer kommer inte gladiatorns skydd från det brutna sigillet att börja avta.\n\nGenom att bygga upp kombinationer låses speciella kombinationer upp som inte kan missa! En ny attack låses upp vid 2, 4, 6, 8 och 10 kombinationer. Vissa rörelser återställer kombinationen och andra inte, men varje rörelse kan bara användas en gång per kombinationssession.\n\nAktuell kombination: %1$d.\n\nAntal turer tills kombinationen går förlorad: %2$s.
actors.buffs.combo$combomove.clobber.name=klamp
actors.buffs.combo$combomove.clobber.desc=Slår tillbaka en fiende 2 brickor, men ger ingen skada och kan inte slå ner i gropar. Ökar kombinationen med 1.
actors.buffs.combo$combomove.clobber.empower_desc=Slår tillbaka en fiende _3 brickor, ger yrsel och kan slå ner i gropar,_ men ger ingen skada. Ökar kombinationen med 1.
actors.buffs.combo$combomove.slam.name=dräm
actors.buffs.combo$combomove.slam.desc=Skadar %d%% (kombination*20%%) av din skadeblockeringskraft som bonusskada. Återställer kombination när den används.
actors.buffs.combo$combomove.slam.empower_desc=_Hoppar upp till %1$dplattor()_ och orsakar %2$d%% (kombination*20%%) av din skadeblockeringskraft som bonusskada. Återställer kombinationen när den används.
actors.buffs.combo$combomove.parry.name=parera
actors.buffs.combo$combomove.parry.desc=Blockerar nästa attack inom 1 tur när den aktiveras och ger omedelbart igen. Återställer kombinationen om ingenting pareras.
actors.buffs.combo$combomove.parry.empower_desc=Blockerar _alla attacker_ inom 1 tur när den aktiveras och ger omedelbart igen. Återställer kombinationen om inget pareras.
actors.buffs.combo$combomove.crush.name=krossa
actors.buffs.combo$combomove.crush.desc=Orsakar %d%% (kombination*25%%) skada på det primära målet och hälften av den skadan på alla andra fiender inom ett område på 7x7. Återställer kombinationen när den används.
actors.buffs.combo$combomove.crush.empower_desc=_Hoppar upp till %1$d plattor()_ och orsakar %2$d%% (kombination*25%%) skada på det primära målet och hälften av den skadan på alla andra fiender inom ett 7x7 AOE-område. Återställer kombinationen när den används.
actors.buffs.combo$combomove.fury.name=raseri
actors.buffs.combo$combomove.fury.desc=Träffar en fiende en gång för varje kombo du har, varje träff orsakar 60% skada och kan utlösa förtrollningar. Återställer kombon när den används.
actors.buffs.combo$combomove.fury.empower_desc=_Hoppar upp till %d plattor()_ och träffar en fiende en gång för varje kombo du har. Varje träff orsakar 60%% skada och kan utlösa förtrollningar. Återställer kombon när den används.

actors.buffs.corruption.name=korrupt
actors.buffs.corruption.desc=Korruption tränger sig in i varelses självaste väsen, och förvrider dem emot deras forna natur.\n\nKorrupta varelser attackerar sina allierade och ignorerar sina forna fiender. Korruption är även skadlig, och orsakar långsamt den utsatte att duka under.\n\nKorruption är permanent. Dess påverkan upphör endast i döden.

actors.buffs.cripple.name=förlamad
actors.buffs.cripple.heromsg=Du är förlamad!
actors.buffs.cripple.desc=Du är ganska säker att ben inte ska gå att böja åt det hållet.\n\nFörlamad halverar förflyttningshastighet, vilket gör förflyttning över en ruta vanligtvis ta två turer istället för en.\n\nTurer av förlamning som återstår: %s.

actors.buffs.daze.name=förvirrad
actors.buffs.daze.heromsg=Du är förvirrad!
actors.buffs.daze.desc=Öronringning och suddig syn gör det svårt att slåss.\n\nVid förvirring minskar träffsäkerhet och undvikande med 50%%, vilket gör det mycket svårare att landa och undvika slag.\n\nÅterstående förvirringsturer: %s.

actors.buffs.degrade.name=degraderad
actors.buffs.degrade.heromsg=Din utrustning känns svagare!
actors.buffs.degrade.desc=Kraftfull mörk magi tär på den styrka som uppgraderingsrullarna har gett din utrustning!\n\nVid försämring behandlas uppgraderad utrustning som om den vore av lägre nivå än den faktiskt är. Varje uppgradering efter +3 blir exponentiellt svagare än den föregående. Beskrivningarna av dina föremål ändras för att återspegla deras minskade effektnivå.\n\nFörsämringen påverkar inte styrkekrav, trollstavsladdningar, kastvapeners hållbarhet eller artefakter.\n\nÅterstående försämringsturer: %s. Användning av en uppgraderingsrulle eller en skriftrulle för att ta bort förbannelser avslutar försämringen omedelbart.

actors.buffs.doom.name=dömd
actors.buffs.doom.desc=Det är svårt att fortsätta när det känns som om hela universum vill se dig död.\n\nDömda karaktärer får +67 % skada från alla källor.\n\nDödsdom är permanent, dess effekter upphör först vid döden.

actors.buffs.dread.name=skräck
actors.buffs.dread.desc=En skräck så stor att den får målet att fly från fängelsehålan!\n\nVarelser som drabbas av skräck flyr från sin motståndare i hög hastighet och försvinner helt från fängelsehålan när de är utom synhåll. Fiender som besegras på detta sätt ger halva erfarenhetspoängen och släpper inga föremål. Smärtchocken minskar skräckens varaktighet.\n\nÅterstående skräckturer: %d.

actors.buffs.drowsy.name=sömnig
actors.buffs.drowsy.desc=En magisk kraft gör det svårt att hålla sig vaken, efter några turer faller målet in i en djup magisk sömn.\n\nHjälten kan motstå sömnighet genom att ta skada eller genom att ha full hälsa.\n\nTurer tills sömn: %s.

actors.buffs.earthimbue.name=genomsyrad av jord
actors.buffs.earthimbue.desc=Du är fylld av jordens kraft!\n\nAlla fysiska attacker kommer att flytta jorden under fienden och lamslå dem under en kort tid.\n\nÅterstående jordförflyttningar: %s.

actors.buffs.enhancedrings.name=förstärkta ringar
actors.buffs.enhancedrings.desc=Skurken har nyligen använt en artefakt som stärker hans ringar och ger dem +1 nivå.\n\nÅterstående turer: %s.

actors.buffs.fireimbue.name=genomsyrad av eld
actors.buffs.fireimbue.desc=Du är fylld av eldens kraft!\n\nAlla fysiska attacker har en chans att sätta eld på fiender. Dessutom är du helt immun mot eldens effekter.\n\nÅterstående eldturer: %s.

actors.buffs.foresight.name=framsynthet
actors.buffs.foresight.desc=Du kan på något sätt se hur terrängen ser ut omkring dig med ditt sinne.\n\nVid förutseende avslöjas alla rutor inom en stor radie för dig, inklusive hemliga fällor och dörrar.\n\nÅterstående förutseendeturer: %s.

actors.buffs.frost.name=frusen
actors.buffs.frost.freezes=%s fryser!
actors.buffs.frost.desc=Detta ska inte förväxlas med att frysa fast, utan är en mer ofarlig form av frysning som helt enkelt omsluter målet med is.\n\nFrysning fungerar på samma sätt som förlamning och gör det omöjligt för målet att agera. Till skillnad från förlamning upphör frysningen omedelbart om målet tar skada, eftersom isen då går sönder.\n\nÅterstående frysningsturer: %s.

actors.buffs.frostimbue.name=genomsyrad av frost
actors.buffs.frostimbue.desc=Du är genomsyrad av iskall kraft!\n\nAlla fysiska attacker kommer att stadigt ackumulera kyla på fiender. Dessutom är du helt immun mot kyla.\n\nÅterstående frostturer: %s.

actors.buffs.fury.name=rasande
actors.buffs.fury.heromsg=Du blir rasande!
actors.buffs.fury.desc=Du är arg, fiender gillar dig inte när du är arg.\n\nEn stor ilska brinner inom dig och ökar skadan du gör med fysiska attacker med 50%%.\n\nDenna ilska varar så länge du har mindre än 50%% hälsa.

actors.buffs.blobimmunity.name=reningsbarriär
actors.buffs.blobimmunity.desc=En märklig kraft omsluter dig i en tunn skyddande barriär som blockerar alla skadliga effekter i luften.\n\nDu är immun mot alla områdesbundna effekter vid denna barriär.\n\nÅterstående immunitetsturer: %s.

actors.buffs.gravitychaostracker.name=gravitetskaos
actors.buffs.gravitychaostracker.desc_intro=Varje gång det går några turer kastas alla karaktärer på den aktuella våningen i fängelsehålan i en slumpmässig riktning.
actors.buffs.gravitychaostracker.desc_positive=Du och dina allierade verkar dock vara immuna.
actors.buffs.gravitychaostracker.desc_duration=Det är oklart hur länge effekten kommer att vara, men den kan inte vara för evigt.

actors.buffs.greaterhaste.name=otrolig hastighet
actors.buffs.greaterhaste.desc=En otrolig hastighetsökning, för ett ögonblick känns det som om allt annat står stilla.\n\nUnder effekten av större hastighet tar rörelser ingen tid alls, men andra åtgärder utförs fortfarande i normal hastighet. Varje steg i rörelsen förbrukar en tur av större hastighet.\n\nÅterstående turer av större hastighet: %d.

actors.buffs.haste.name=snabbhet
actors.buffs.haste.desc=Energi strömmar genom dina muskler, vilket gör att du kan springa i otroliga hastigheter!\n\nMedan effekten av hastighet är aktiv springer du i 3x hastighet, men utför alla andra åtgärder i normal hastighet.\n\nÅterstående turer med hast: %s.

actors.buffs.healing.name=läkande
actors.buffs.healing.desc=Ett magiskt botemedel får sår att läka och kött att växa ihop.\n\nVarje tur regenereras hälsan stadigt tills läkningseffekten upphör. Mängden läkning kan avta med tiden.\n\nNästa läkning: %d.\n\nÅterstående läkning: %d.

actors.buffs.herodisguise.name=förklädnad
actors.buffs.herodisguise.desc=Illusionsmagi har förändrat ditt utseende! Effekten är rent kosmetisk, men känns ändå mycket konstig.\n\nÅterstående förvandlingar: %s.

actors.buffs.hex.name=förtrollad
actors.buffs.hex.heromsg=Du har blivit förtrollad!
actors.buffs.hex.desc=Mörk magi som försvagar koncentrationen och gör målet något desorienterat.\n\nFörbannelsen minskar träffsäkerheten och undvikandet med 20%%, vilket gör målet mindre effektivt i strid.\n\nÅterstående förbannelser: %s.

actors.buffs.holdfast.name=hållfast
actors.buffs.holdfast.desc=Krigaren behåller sin position, ökar sin rustning med %1$d-%2$d och saktar ned förfallshastigheten för vissa buffar med %3$d%%. Detta varar tills han rör sig.

actors.buffs.hunger.hungry=hungrig
actors.buffs.hunger.starving=svälter
actors.buffs.hunger.onhungry=Du är hungrig.
actors.buffs.hunger.onstarving=Du är utsvulten!
actors.buffs.hunger.ondeath=Du svalt till döds…
actors.buffs.hunger.cursedhorn=Det förbannade hornet stjäl en del av matenergin medan du äter.
actors.buffs.hunger.rankings_desc=Svalt till Döds
actors.buffs.hunger.desc_intro_hungry=Din mage har börjat kurra lite, men det är inte så farligt än.
actors.buffs.hunger.desc_intro_starving=Du är så hungrig att det gör ont.
actors.buffs.hunger.desc=\n\nAllteftersom du utforskar underjorden blir du hungrigare och hungrigare och till slut börjar du svälta. När du svälter förlorar du långsamt livspoäng istället för att regenerera dem.\n\nDet är viktigt att ransonera! Om du har livspoäng över kan det vara en bra idé att svälta ett tag för att spara på maten. Ordentlig ransonering kan få maten att räcka mycket längre!

actors.buffs.invisibility.name=osynlig
actors.buffs.invisibility.desc=Du smälter helt in i omgivningen, vilket gör dig omöjlig att se. \n\nMedan du är osynlig kan fiender inte attackera eller följa dig. Fysiska attacker och magiska effekter (som skriftrullar och trollstavar) upphäver omedelbart osynligheten. \n\nÅterstående osynlighetstider: %s.

actors.buffs.invulnerability.name=osårbar
actors.buffs.invulnerability.desc=Denna karaktär är genomsyrad av en stark skyddande kraft som ger dem en kort period av osårbarhet! \n\nÅterstående turer: %s.

actors.buffs.levitation.name=svävar
actors.buffs.levitation.desc=En magisk kraft får dig att sväva över marken, så att du känner dig viktlös.\n\nSvävande karaktärer rör sig ljudlöst och ignorerar alla markbaserade effekter. Fällor utlöses inte, vatten släcker inte eld, växter trampas inte ner, rötter missar och gropar svävar över. Var försiktig, eftersom alla dessa saker kan träda i kraft så fort levitationen upphör!\n\nÅterstående levitationsturer: %s.

actors.buffs.lifelink.name=livslänk
actors.buffs.lifelink.ondeath=Den livslänkade skadan dödade dig...
actors.buffs.lifelink.desc=Denna karaktärs livskraft är kopplad till en annan karaktär i närheten. All skada som tas delas mellan dem.\n\nNär denna karaktär tar skada kommer hälften av den istället att delas till livslänkmålet.\n\nÅterstående livslänksvarv: %s.

actors.buffs.light.name=upplyst
actors.buffs.light.desc=Det kanske inte riktigt var det här 1700-talets fransmän tänkte sig, men dagens underjordsutforskare bryr sig nog inte.\n\nTrots den beckmörka omgivningen gör ljuset att du nu kan se åtminstone en bit framför dig.\n\nUpplysningen kommer att vara i %s turer till.

actors.buffs.lockedfloor.name=våningen är låst
actors.buffs.lockedfloor.desc=Den aktuella våningen är låst och du kan inte lämna den! Dessutom, om du inte arbetar för att besegra bossen på detta våning, kommer passiva regenereringseffekter också att upphöra.\n\nDessutom, om du återupplivas av en oblessad ankh vid låst våning, kommer den att återställas.\n\nDöda bossen på denna våning för att bryta låset.

actors.buffs.lostinventory.name=förlorad packning
actors.buffs.lostinventory.desc=Din packning har förlorats någonstans i kryptan! Du kommer inte kunna plocka upp eller använda de flesta föremålen förrän du hämtat det.

actors.buffs.magicalsight.name=magisk syn
actors.buffs.magicalsight.desc=På något sätt kan du se med ditt sinne istället för med dina ögon.\n\nMedan magisk syn är aktiv kan du se genom all terräng inom en radie av 12 rutor.\n\nÅterstående turer med magisk syn: %s.

actors.buffs.magicalsleep.name=magisk sömn
actors.buffs.magicalsleep.toohealthy=Du är vid för god hälsa, och står emot suget att sova.
actors.buffs.magicalsleep.fallasleep=Du faller i en djup magisk sömn.
actors.buffs.magicalsleep.wakeup=Du vaknar uppfräschad och hälsosam.
actors.buffs.magicalsleep.desc=Denna karaktär har fallit i en djup magisk sömn som de inte kommer att vakna upp ur naturligt.\n\nMagisk sömn liknar vanlig sömn, förutom att endast skada kan väcka målet.\n\nFör hjälten och deras allierade har magisk sömn vissa återställande egenskaper, vilket gör att de snabbt kan läka vid vila.

actors.buffs.magicimmune.name=immun mot magi
actors.buffs.magicimmune.desc=Alla magiska effekter har förlorat sin verkan på dig, du är helt immun mot dem.\n\nMedan du är immun mot magi kommer inga skadliga eller hjälpsamma magiska effekter att påverka dig, inklusive förbannelser, förtrollningar, trollstavar, skriftrullar, ringar, artefakter etc. Hjältarnas rustningsförmågor är tillräckligt starka för att fungera oavsett denna effekt.\n\nÅterstående turer med immunitet mot magi: %s.

actors.buffs.mindvision.name=sinnesyn
actors.buffs.mindvision.desc=På något sätt har dina sinnen utökats så att du kan se andra varelsers sinnen. Det känns lite konstigt.\n\nMedan sinnessinnet varar kan du se alla varelser på planet. Magi som påverkar alla varelser som syns eller är i närheten påverkar också de som syns genom sinnessinnet. \n\nSinnessinnet kommer att vara i %s turer till.

actors.buffs.momentum.momentum=samlar fart
actors.buffs.momentum.running=frilöpning
actors.buffs.momentum.resting=återhämtar
actors.buffs.momentum.action_name=frilopp
actors.buffs.momentum.momentum_desc=När han rör sig bygger Frilöparen upp fart, som han kan använda för att börja frilöpning.\n\nVarje laddning av fart ger två turer av frilöpning, och Frilöparen kan bygga upp till 10 laddningar. Farten förloras snabbt när Frilöparen slutar röra sig.\n\nAktuell momentumladdning: %d.
actors.buffs.momentum.running_desc=När han rör sig bygger Frilöparen upp momentum, som han kan använda för att börja frilöpning.\n\nUnder frilöpning rör sig Frilöparen dubbelt så fort och får bonusundvikande baserat på sin nivå.\n\nÅterstående turer: %d.
actors.buffs.momentum.resting_desc=När han rör sig bygger Frilöparen upp momentum, som han kan använda för att börja frilöpa.\n\nFrilöparen behöver tid för att återfå sin uthållighet innan han kan bygga upp momentum igen.\n\nÅterstående turer: %d.

actors.buffs.monkenergy.name=energi
actors.buffs.monkenergy.action=Munk Förmågor
actors.buffs.monkenergy.desc=När hon besegrar fiender får munken energi som hon kan använda till olika förmågor. De flesta fiender ger 1 energi när de besegras, och munken förlorar inte energi med tiden.\n\nAktuell energi: %1$d/%2$d.
actors.buffs.monkenergy.desc_cooldown=Monken har nyligen använt en förmåga och måste vänta innan hen kan använda en annan.\n\nAktuell nedkylning: %d turer.
actors.buffs.monkenergy$monkability$flurry.name=mängder av slag
actors.buffs.monkenergy$monkability$flurry.desc=Två omedelbara slag som orsakar %1$d-%2$d skada och ignorerar rustning. Denna förmåga kan inte användas upprepade gånger.
actors.buffs.monkenergy$monkability$flurry.empower_desc=Två omedelbara slag som orsakar %1$d-%2$d skada, ignorerar rustning och använder ditt vapens förtrollning. Denna förmåga kan inte användas upprepade gånger.
actors.buffs.monkenergy$monkability$focus.name=fokus
actors.buffs.monkenergy$monkability$focus.desc=Munken tar en tur för att fokusera, vilket gör att hon kan parera nästa attack mot henne.
actors.buffs.monkenergy$monkability$focus.empower_desc=Munken fokuserar omedelbart, vilket gör att hon kan parera nästa attack mot henne.
actors.buffs.monkenergy$monkability$focus$focusbuff.name=fokuserad
actors.buffs.monkenergy$monkability$focus$focusbuff.desc=Munken är fokuserad på sin omgivning och förutser nästa attack mot henne. Vid fokusering är hon garanterad att parera nästa inkommande attack.
actors.buffs.monkenergy$monkability$dash.name=hopp
actors.buffs.monkenergy$monkability$dash.prompt=Välj en plats
actors.buffs.monkenergy$monkability$dash.desc=En omedelbar sprint upp till 4 rutor bort. Denna förmåga kan passera hinder, men inte fiender eller fast terräng.
actors.buffs.monkenergy$monkability$dash.empower_desc=En omedelbar sprint upp till _8 rutor_ bort. Denna förmåga kan passera hinder, men inte fiender eller fast terräng.
actors.buffs.monkenergy$monkability$dragonkick.name=drakspark
actors.buffs.monkenergy$monkability$dragonkick.desc=En förödande spark som orsakar %1$d-%2$d skada och ignorerar rustning. Sparken knuffar iväg måltavlan och paralyserar dem för varje ruta de korsar.
actors.buffs.monkenergy$monkability$dragonkick.empower_desc=En förödande spark som orsakar _%1$d-%2$d skada_ och ignorerar rustning. Sparkar iväg _alla intilliggande mål_ och förlamar dem för varje ruta de korsar.
actors.buffs.monkenergy$monkability$meditate.name=meditera
actors.buffs.monkenergy$monkability$meditate.desc=Munken fokuserar energi i sin kropp i 5 turer. Detta rensar de flesta negativa effekter och ger henne 8 turer av laddning av trollstav och artefakt.
actors.buffs.monkenergy$monkability$meditate.empower_desc=Munken fokuserar energi i sin kropp i 5 turer. Detta rensar bort de flesta negativa effekter och ger henne 8 turer av laddning av trollstav och artefakt. Hon får också 80% skaderesistens vid meditation och läker långsamt 20% av sin saknade HP.

actors.buffs.ooze.name=frätande gyttja
actors.buffs.ooze.heromsg=Frätande syra smälter dig. Skölj av den!
actors.buffs.ooze.ondeath=Du smälte bort…
actors.buffs.ooze.rankings_desc=Upplöst
actors.buffs.ooze.desc=Denna klibbiga syra fastnar på köttet och smälter det långsamt bort.\n\nOoze orsakar kontinuerlig skada över tid, men kan tvättas bort omedelbart med vatten.\n\nÅterstående ooze-turer: %s.

actors.buffs.paralysis.name=förlamad
actors.buffs.paralysis.heromsg=Du är paralyserad!
actors.buffs.paralysis.out=stod emot paralys
actors.buffs.paralysis.desc=Ofta är det värsta man kan göra att inte göra någonting alls. \n\nFörlamning stoppar alla åtgärder helt och tvingar målet att vänta tills effekten avtar. Smärtan från skadan kan få karaktärer att motstå förlamningen och bryta effekten. \n\nÅterstående förlamningsturer: %s.

actors.buffs.physicalempower.name=fysiskt stärkt
actors.buffs.physicalempower.desc=Dina slag har förstärkts, vilket ökar skadan du kan åstadkomma när du träffar fiender med fysiska attacker.\n\nBonusskada: %1$d.\nÅterstående träffar: %2$d.

actors.buffs.pincushion.name=nåldyna
actors.buffs.pincushion.desc=De kastvapen du har använt mot denna karaktär sitter fast på dem och faller till marken när de besegras.\n\nFöljande föremål sitter fast:

actors.buffs.poison.name=förgiftad
actors.buffs.poison.heromsg=Du är förgiftad!
actors.buffs.poison.ondeath=Du dog av giftet…
actors.buffs.poison.rankings_desc=Dukande under av förgiftning
actors.buffs.poison.desc=Giftet sprider sig i kroppen och försämrar långsamt dess inre funktioner.\n\nGift orsakar skada varje tur i proportion till hur lång tid det är kvar tills det upphör att verka.\n\nÅterstående turer med gift: %s.

actors.buffs.preparation.name=förberedelse
actors.buffs.preparation.action_name=förberett slag
actors.buffs.preparation.desc=Lönnmördaren väntar tålmodigt, beredd att slå från skuggorna.
actors.buffs.preparation.desc_dmg=Hans nästa attack kommer att orsaka _%1$d%% bonusskada_ och döda vanliga fiender med mindre än _%2$d%% hälsa_ eller bossar med mindre än _%3$d%% hälsa_.
actors.buffs.preparation.desc_dmg_likely=Attacken kommer också mer sannolikt göra en större mängd skada.
actors.buffs.preparation.desc_blink=Han kan blinka mot en fiende innan han slår till, med en maximal avstånd på _%d._
actors.buffs.preparation.desc_invis_time=Turer tillbringade som osynlig: _%d._
actors.buffs.preparation.desc_invis_next=Runder tills starkare attack: _%d._
actors.buffs.preparation.prompt=Välj ett mål att attackera!\nMax blinkavstånd: %d
actors.buffs.preparation.no_target=Det finns inget att attackera där.
actors.buffs.preparation.out_of_reach=Målet är utom räckhåll.
actors.buffs.preparation.assassinated=lönnmördad

actors.buffs.prismaticguard.name=prismatisk Gard
actors.buffs.prismaticguard.desc=Du skyddas av en prismatisk bild som för närvarande är inaktiv. När fiender är närvarande kommer den prismatiska bilden att träda i aktion och skydda dig!\n\nNär den är inaktiv återhämtar sig den prismatiska bilden stadigt från alla skador den har tagit.\n\nAktuell HP: %d/%d.
actors.buffs.prismaticguard.desc_many=Denna prismatiska bild drar också nytta av Power of Many. Återstående turer: %d.

actors.buffs.recharging.name=uppladdning
actors.buffs.recharging.desc=Energi strömmar genom dig och förbättrar laddningshastigheten för dina trollstavar och stavar.\n\nVarje tur ökar denna buff den aktuella laddningen med en fjärdedel, utöver den vanliga laddningen.\n\nÅterstående laddningsturer: %s.

actors.buffs.revealedarea.name=synliggjort område
actors.buffs.revealedarea.desc=Ett område i kryptan har tillfälligt blivit synligt för hjälten. De ser det oavsett var de är.\n\nÅterstående turer: %s.

actors.buffs.revealedchar.name=synliggjord
actors.buffs.revealedchar.desc=Denna karaktären är synliggjord för hjälten. De är synliga oavsett var de är.\n\nTurer återstående: %s.

actors.buffs.roots.name=fastrotad
actors.buffs.roots.heromsg=Du kan inte röra dig!
actors.buffs.roots.desc=Rötter (magiska eller naturliga) griper tag i fötterna och tvingar dem ner mot marken.\n\nRötter låser ett mål på plats, vilket gör rörelse och de flesta rörelseförmågor omöjliga. Andra åtgärder påverkas inte, inklusive teleporteringseffekter.\n\nÅterstående rötter: %s.

actors.buffs.scrollempower.name=skriftrulleförstärkning
actors.buffs.scrollempower.desc=Energin från Magikerns nyligen lästa skriftrulle ger hans trollstavar extra kraft!\n\nNivåhöjning: +%1$d.\nÅterstående zaps: %2$d.

actors.buffs.shadows.name=sammansmält med skuggorna
actors.buffs.shadows.desc=Du smälter samman med skuggorna omkring dig, vilket gör dig osynlig och saktar ner din ämnesomsättning.\n\nMedan du är osynlig kan fiender inte attackera eller följa efter dig. De flesta fysiska attacker och magiska effekter (såsom skriftrullar och trollstavar) upphäver omedelbart osynligheten. Dessutom saktas din hungertakt ned när du är skuggblandad.\n\nDu förblir skuggblandad tills du lämnar skuggorna eller en fiende kommer i kontakt med dig.

actors.buffs.slow.name=saktad
actors.buffs.slow.desc=Saktande magi påverkar målets tidsuppfattning, så att allt rör sig extremt snabbt för dem. \n\nEn saktad karaktär utför alla handlingar på dubbelt så lång tid som normalt. \n\nÅterstående turer med saktning: %s.

actors.buffs.snipersmark.name=prickskyttens märke
actors.buffs.snipersmark.action_name_snapshot=snabbskott
actors.buffs.snipersmark.action_name_volley=salva
actors.buffs.snipersmark.action_name_sniper=prickskytteskott
actors.buffs.snipersmark.desc=Prickskytten är inriktad på det mål hon senast attackerade. Hon kan utföra en specialattack med sin båge som varierar beroende på hur bågen är förstärkt.\n\nEn oförstärkt båge avfyrar en _snapshot_ som gör mindre skada men inte tar någon tid att avfyra.\n\nEn båge som är förstärkt för hastighet avfyrar en _volley_ med tre pilar. Varje pil gör mindre skada, men kan fortfarande aktivera förtrollningar. Denna volley tar 1 tur att avfyra.\n\nEn båge som är förstärkt för skada avfyrar ett _sniper shot._ Detta skott träffar garanterat, gör bonusskada baserat på avståndet till målet och tar 2 turer att avfyra.\n\nÅterstående turer: %s.

actors.buffs.soulmark.name=själmärkt
actors.buffs.soulmark.desc=Häxmästaren har tappat in sig på denna varelses själ, vilket gör att han kan läka sig själv när han tar fysisk skada.\n\nÅterstående turer för själsmärket: %s.

actors.buffs.stamina.name=uthållighet
actors.buffs.stamina.desc=Du har oändlig uthållighet, vilket gör att du kan röra dig snabbare!\n\nNär du är under påverkan av uthållighet springer du med +50%% hastighet, men utför alla andra åtgärder i normal hastighet.\n\nÅterstående turer med uthållighet: %s.

actors.buffs.vulnerable.name=sårbar
actors.buffs.vulnerable.heromsg=Du känner dig ömtålig!
actors.buffs.vulnerable.desc=Sårbarhetsmagi ökar all fysisk skada som en karaktär tar med 33%% efter att skadan har reducerats av rustning. \n\nÅterstående turer med sårbarhet: %s.

actors.buffs.terror.name=förskräckt
actors.buffs.terror.desc=Terror är manipulativ magi som tvingar sitt mål in i en okontrollerbar panik.\n\nSkräckslagna karaktärer tvingas fly från sin motståndare och försöker placera så många dörrar och väggar som möjligt mellan sig och motståndaren. Smärtan från chocken minskar dock terrorens varaktighet.\n\nÅterstående turer av terror: %s.

actors.buffs.toxicimbue.name=genomsyrad av gift
actors.buffs.toxicimbue.desc=Du är genomsyrad av giftig energi!\n\nNär du rör dig sprider giftig gas sig från dig och skadar dina fiender. Du är immun mot giftig gas och gift under effekten, samt några turer efteråt.\n\nÅterstående turer med giftig genomsyran: %s.

actors.buffs.corrosion.name=korrosion
actors.buffs.corrosion.heromsg=Du smälter!
actors.buffs.corrosion.ondeath=Du smälter bort…
actors.buffs.corrosion.rankings_desc=Upplöst
actors.buffs.corrosion.desc=Kraftig syra smälter bort kött, metall och ben i en alarmerande takt.\n\nKorrosionsskadan ökar med tiden, i takt med att målet fortsätter att smälta bort.\n\nÅterstående turer med korrosion: %1$s.\nAktuell korrosionsskada: %2$d.

actors.buffs.vertigo.name=yrsel
actors.buffs.vertigo.desc=Det kan vara svårt att gå rakt fram när hela världen snurrar.\n\nNär karaktärer är drabbade av yrsel kommer de att röra sig i slumpmässiga riktningar istället för i den riktning de avsåg att gå.\n\nÅterstående yrselturer: %s.

actors.buffs.wandempower.name=stavar stärkta
actors.buffs.wandempower.desc=Dina skadegörande trollstavar har förstärkts, vilket ökar skadan de gör under några träffar.\n\nBonusskada: %1$d.\nÅterstående träffar: %2$d.

actors.buffs.weakness.name=försvagad
actors.buffs.weakness.heromsg=Du känner dig helt plötsligt svag!
actors.buffs.weakness.desc=Allt känns plötsligt mycket tyngre.\n\nFörsvagande magi minskar en karaktärs fysiska styrka, vilket gör att de gör 33%% mindre skada.\n\nÅterstående svaghetsturer: %s.

actors.buffs.wellfed.name=proppmätt
actors.buffs.wellfed.desc=Du känner dig ganska mätt och belåten.\n\nNär du är mätt ökar inte din hunger och du återfår extra hälsa över tid.\n\nÅterstående turer: %d.



###hero

##abilities
actors.hero.abilities.armorability.self_target=Du kan inte sikta på dig själv!
actors.hero.abilities.armorability.no_target=Det finns inget att sikta på här!
actors.hero.abilities.armorability.prompt=Välj en plats att sikta på
actors.hero.abilities.armorability.cost=Laddningskostnad: _%d_

actors.hero.abilities.warrior.heroicleap.name=Hjältemodigt språng
actors.hero.abilities.warrior.heroicleap.prompt=Välj riktning att hoppa
actors.hero.abilities.warrior.heroicleap.short_desc=Krigaren utför ett _Heroiskt språng_ mot en vald plats och flyger över fiender och faror.
actors.hero.abilities.warrior.heroicleap.desc=Krigaren hoppar mot en vald plats och flyger över alla fiender och faror som finns i vägen. Han kan dock inte hoppa över murar eller annan fast terräng.
actors.hero.abilities.warrior.shockwave.name=tryckvåg
actors.hero.abilities.warrior.shockwave.short_desc=Krigaren utger en _chockvåg_ i ett koniskt område genom att slå i marken. Fiender som träffas av chockvågen skadas och förlamas.
actors.hero.abilities.warrior.shockwave.desc=Krigaren slår i marken och skapar en chockvåg som sprider sig upp till 5 rutor i en 60 graders kon.\n\nFiender som träffas av chockvågen blir handikappade i 5 turer. De får också 5-10 skada, plus 1-2 extra skada för varje styrkepunkt som krigaren har över 10.
actors.hero.abilities.warrior.endure.name=utstå
actors.hero.abilities.warrior.endure$enduretracker.name=uthållighet
actors.hero.abilities.warrior.endure$enduretracker.desc=Krigaren gör nu extra skada baserat på den skada han har uthärdat.\n\nExtra skada: %1$d\nÅterstående träffar: %2$d
actors.hero.abilities.warrior.endure.short_desc=Krigaren _uthärdar_, hoppar över flera turer men får hög skaderesistens. Han gör sedan bonusskada baserat på vad han uthärdat.
actors.hero.abilities.warrior.endure.desc=Krigaren uthärdar i 3 turer och tar hälften av skadan från alla källor. Denna minskning tillämpas före skaderesistenta effekter som rustning.\n\nEfter att ha uthärdat får krigarens nästa träff inom 10 turer bonusskada. Denna bonusskada är lika med hälften av all skada som han åsamkats vid uthärdandet, före eventuella skademinskande effekter!\n\nOm krigaren har någon kombo ökar användningen av denna förmåga dess återstående tid med 3 turer.

actors.hero.abilities.mage.elementalblast.name=elementärt skott
actors.hero.abilities.mage.elementalblast.no_staff=Du kan inte använda denna förmåga utan din stav.
actors.hero.abilities.mage.elementalblast.short_desc=Magikern avger en _Elemental Blast_ från sin stav, som täcker ett stort område runt honom med en effekt som varierar beroende på staven i hans stav.
actors.hero.abilities.mage.elementalblast.desc=Magikern avger en magisk explosion som täcker ett cirkulärt område upp till 4 rutor bort och orsakar upp till 15-25 skada. Den specifika effekten av elemental blast varierar beroende på vilken trollstav som är infogad i Magikerns stav.
actors.hero.abilities.mage.elementalblast.generic_desc=Effekten av elemental blast kommer att likna effekten av staven när den avfyras mot en fiende eller allierad.
actors.hero.abilities.mage.wildmagic.name=vild magi
actors.hero.abilities.mage.wildmagic.no_wands=Du har inga stavar att zappa med!
actors.hero.abilities.mage.wildmagic.short_desc=Magikern släpper lös den vilda magi som finns i hans stavar och avfyrar dem slumpmässigt flera gånger mot ett valt mål under en enda tur.
actors.hero.abilities.mage.wildmagic.desc=Magikern släpper loss kraften i sina trollstavar och avfyrar dem slumpmässigt upp till 4 gånger under en enda tur. Magikerns stav ingår inte i denna effekt.\n\nVarje trollstav får också sin nivå höjd med 2, upp till +3. Denna förmåga använder en halv trollstavsladdning för varje trollslag, och ingen trollstav kan avfyras mer än 2 gånger.
actors.hero.abilities.mage.warpbeacon.name=varpfyr
actors.hero.abilities.mage.warpbeacon.depths=Du kan inte varpa mellan olika djup!
actors.hero.abilities.mage.warpbeacon.locked_floor=Du kan inte lämna en låst våning!
actors.hero.abilities.mage.warpbeacon.too_far=Den platsen är för långt bort!
actors.hero.abilities.mage.warpbeacon.invalid_beacon=Du kan inte placera en fyr där!
actors.hero.abilities.mage.warpbeacon.window_desc=Din fyr står för tillfället på våning %d.
actors.hero.abilities.mage.warpbeacon.window_tele=teleportera till fyr
actors.hero.abilities.mage.warpbeacon.window_clear=töm fyr
actors.hero.abilities.mage.warpbeacon.window_cancel=avbryt
actors.hero.abilities.mage.warpbeacon.short_desc=Magikern placerar en _Warping Beacon_ på sin aktuella position, som han omedelbart kan teleportera sig tillbaka till.
actors.hero.abilities.mage.warpbeacon.desc=Magikern placerar en fyr som sedan kan användas för att teleportera sig till. Det tar 1 tur att placera fyren, men teleporteringen sker omedelbart.\n\nMagikern kan inte teleportera mellan våningar som standard, eller använda fyren för att nå otillgängliga platser som låsta rum. Magikern kan teleportera sig in i fiender, vilket kommer att knuffa dem åt sidan.

actors.hero.abilities.rogue.smokebomb.name=rökbomb
actors.hero.abilities.rogue.smokebomb.fov=Du kan bara hoppa till en tom plats i ditt synfält.
actors.hero.abilities.rogue.smokebomb.prompt=Välj en plats att hoppa till
actors.hero.abilities.rogue.smokebomb$ninjalog.name=träspärr
actors.hero.abilities.rogue.smokebomb$ninjalog.desc=På något sätt blir fiender helt övertygade att denna träbulvan är den riktiga Skurken!
actors.hero.abilities.rogue.smokebomb$ninjalog.discover_hint=Du kan hitta denna karaktär med en specifik hjälteförmåga.
actors.hero.abilities.rogue.smokebomb.short_desc=Skurken kastar ut en _rökbomb_ och skimrar bort. Han bländar fiender nära sin förra position.
actors.hero.abilities.rogue.smokebomb.desc=Skurken kastar en rökbomb och blinkar upp till 6 rutor bort. Han kan blinka genom faror och fiender, men inte genom fast terräng som väggar.\n\nFiender som är intill Skurkens gamla position blir bländade i 5 turer.
actors.hero.abilities.rogue.deathmark.name=dödsmärke
actors.hero.abilities.rogue.deathmark.ally_target=Du kan endast markera fiender
actors.hero.abilities.rogue.deathmark.short_desc=Skurken placerar ett _Dödsmärke_ på en vald fiende. Märkta fiender tar extra skada, men kan inte dö förrän märket upphör.
actors.hero.abilities.rogue.deathmark.desc=Skurken placerar ett märke på en vald fiende, vilket gör att de tar 25% extra skada. Märket appliceras omedelbart och varar i 5 turer.\n\nMärkta fiender tar bonusskada men kan inte dö förrän märket upphör. Om en fiende har 0 HP när märket upphör, dör de omedelbart.
actors.hero.abilities.rogue.deathmark$deathmarktracker.name=märkt för att dö
actors.hero.abilities.rogue.deathmark$deathmarktracker.desc=Denna fiende har märkts, vilket gör att den tar 25%% extra skada, men också att den inte kan dö förrän märket upphör.\n\nÅterstående turer: %s.
actors.hero.abilities.rogue.shadowclone.name=skuggklon
actors.hero.abilities.rogue.shadowclone.short_desc=Skurken frammanar en _skuggklon_, som kan dirigeras för att hjälpa honom i strid.
actors.hero.abilities.rogue.shadowclone.desc=Skurken frammanar en skuggig kopia av sig själv, som kan dirigeras för att hjälpa honom i strid. Det kostar inget att dirigera skuggklonen.\n\nKlonen har 80 HP, ingen rustning och gör 10-20 skada. Alla dessa egenskaper kan förbättras med talanger, så att klonen drar nytta av vapen och rustningar som hjälten har.
actors.hero.abilities.rogue.shadowclone$shadowally.name=skuggskurk
actors.hero.abilities.rogue.shadowclone$shadowally.direct_defend=Din klon rör sig till den platsen.
actors.hero.abilities.rogue.shadowclone$shadowally.direct_follow=Din klon rör sig för att följa efter dig.
actors.hero.abilities.rogue.shadowclone$shadowally.direct_attack=Din klon rör sig för att attackera!
actors.hero.abilities.rogue.shadowclone$shadowally.desc=En kopia av Skurken, skapad av skuggig mörker. Den står helt stilla, med tomma ögon och små slöjor av mörker som stiger upp från den som ånga.\n\nKlon är inte en perfekt kopia av Skurken, men är ändå en hyfsad kämpe och kan dra nytta av Skurkens utrustning med rätt talanger.
actors.hero.abilities.rogue.shadowclone$shadowally.discover_hint=Du kan hitta den här karaktären med en specifik hjälteförmåga.

actors.hero.abilities.huntress.spectralblades.name=spektralblad
actors.hero.abilities.huntress.spectralblades.short_desc=Jägaren kastar _Spectral Blades_ mot ett mål och orsakar skada beroende på hennes aktuella närstridsvapen.
actors.hero.abilities.huntress.spectralblades.desc=Jägaren kastar en spektralklinga mot en fiende, som fungerar som ett distansangrepp från hennes närstridsvapen. Alla normala effekter av ett närstridsvapen aktiveras, inklusive förtrollningar.
actors.hero.abilities.huntress.naturespower.name=naturens kraft
actors.hero.abilities.huntress.naturespower.short_desc=Jägaren anropar naturens kraft, vilket ökar hennes rörelsehastighet och bågens eldhastighet under en kort tid.
actors.hero.abilities.huntress.naturespower.desc=Jägaren ger sig själv och sin båge tillfällig kraft från naturen! Effekten varar i 8 turer.\n\nUnder denna tid rör sig jägarinnan dubbelt så fort och attackerar 33 % snabbare med sin båge. De extra bågeffekterna aktiveras inte om prickskytten använder sina specialattacker.
actors.hero.abilities.huntress.naturespower$naturespowertracker.name=naturens kraft
actors.hero.abilities.huntress.naturespower$naturespowertracker.desc=Jägaren får tillfälligt ökad styrka, vilket ökar hennes rörelsehastighet och attackhastighet med bågen.\n\nÅterstående turer: %s.
actors.hero.abilities.huntress.spirithawk.name=andehök
actors.hero.abilities.huntress.spirithawk.no_space=Det finns inget fritt utrymme nära dig.
actors.hero.abilities.huntress.spirithawk.short_desc=Jägaren kallar fram en _Spirit Hawk_-familjär, som kan hjälpa henne att spana och distrahera fiender.
actors.hero.abilities.huntress.spirithawk.desc=Jägaren kallar fram en ande-hök som kan styras genom att använda förmågan igen vid anrop. Hökarna varar i 100 turer, och det kostar ingen laddning att styra dem. Hökarna har minimal hälsa och attackkraft, men är snabba, undvikande och träffsäkra. De delar hela sitt synfält med Jägaren hela tiden. De är immuna mot alla områdesbundna effekter, såsom eld och giftgas. De attackerar inte om de inte får specifika order om det.
actors.hero.abilities.huntress.spirithawk$hawkally.name=andehök
actors.hero.abilities.huntress.spirithawk$hawkally.direct_defend=Din hök rör sig till den platsen.
actors.hero.abilities.huntress.spirithawk$hawkally.direct_follow=Din hök rör sig för att följa efter dig.
actors.hero.abilities.huntress.spirithawk$hawkally.direct_attack=Din hök rör sig för att attackera!
actors.hero.abilities.huntress.spirithawk$hawkally.desc=En magisk hök, frammanad av Jägaren. Den lyser i en klar, eterisk blå färg och dess huvud rör sig ständigt medan den övervakar området.\n\nDen är inte särskilt bra på att slåss, men dess snabbhet och syn gör den utmärkt för att spana och distrahera fiender.
actors.hero.abilities.huntress.spirithawk$hawkally.desc_remaining=Återstående turer: %d.
actors.hero.abilities.huntress.spirithawk$hawkally.desc_dodges=Garanterade undanflykter som återstår: %d.
actors.hero.abilities.huntress.spirithawk$hawkally.discover_hint=Du kan hitta den här karaktären med en specifik hjälteförmåga.

actors.hero.abilities.duelist.challenge.name=utmana
actors.hero.abilities.duelist.challenge.prompt=Välj en fiende att utmana
actors.hero.abilities.duelist.challenge.already_dueling=Du kan bara vara i en duell åt gången.
actors.hero.abilities.duelist.challenge.ally_target=Du kan endast utmana fiender.
actors.hero.abilities.duelist.challenge.unreachable_target=Du måste kunna nå din måltavla.
actors.hero.abilities.duelist.challenge.distant_target=Den fienden är för långt bort för att utmana.
actors.hero.abilities.duelist.challenge.short_desc=Duellanten utmanar en fiende i närheten till en duell och fryser tillfälligt alla andra fiender.
actors.hero.abilities.duelist.challenge.desc=Duellanten utmanar en fiende i närheten till en duell. Den fienden tvingas slåss mot henne vid att alla andra fiender tillfälligt fryses i tiden.\n\nMålet måste vara nåbart och inom 5 rutor från Duellanten. Duellen pågår tills 10 turer har gått, fienden dör eller duellanten befinner sig mer än 5 rutor från fienden. \n\nFrysta fiender är osårbara. Duellantens allierade fryses inte av denna förmåga, men om en boss är måltavla fryses inte heller dess underhuggare.
actors.hero.abilities.duelist.challenge$duelparticipant.name=duelldeltagare
actors.hero.abilities.duelist.challenge$duelparticipant.desc=Denna karaktär deltar i en duell. De och alla deras allierade eller underhuggare får agera normalt vid frysning av andra karaktärer.\n\nDuellen pågår under en viss tid, tills en deltagare dör eller tills deltagarna flyttar sig mer än 5 rutor från varandra.\n\nÅterstående turer: %d.
actors.hero.abilities.duelist.elementalstrike.name=elementärt slag
actors.hero.abilities.duelist.elementalstrike.short_desc=Duellanten utför ett _Elementärt slag_ som sprider en effekt i en konisk AOE baserat på hennes vapenförtrollning.
actors.hero.abilities.duelist.elementalstrike.desc=Duellanten slår mot en fiende eller plats och utför en vanlig attack som garanterat träffar och sprider en magisk effekt som når upp till 4 rutor i en 65 graders kon. Denna magiska effekt varierar beroende på förtrollningen på duellantens primära vapen.
actors.hero.abilities.duelist.elementalstrike.generic_desc=En elemental strike utan förtrollning utlöser en liten magisk explosion som gör 6-12 skada på alla fiender inom räckvidden.
actors.hero.abilities.duelist.feint.name=fint
actors.hero.abilities.duelist.feint.prompt=Välj en plats att sprinta till
actors.hero.abilities.duelist.feint.too_far=Den platsen ligger inte i närheten av dig.
actors.hero.abilities.duelist.feint.bad_location=Du kan inte flytta till den platsen.
actors.hero.abilities.duelist.feint.short_desc=Duellanten gör en finte och låtsas attackera vid en sprint till en intilliggande ruta. Fiender attackerar hennes efterbild och blir därmed utsatta för en kontring.
actors.hero.abilities.duelist.feint.desc=Duellanten fejkar en attack vid en snabb rörelse till en angränsande ruta och lämnar efter sig en kortvarig efterbild av sig själv. Fiender som attackerade Duellanten attackerar istället hennes efterbild. \n\nFiender som attackerar efterbilden blir förvirrade, vilket avbryter deras nästa handling och lämnar dem öppna för en överraskningsattack.

actors.hero.abilities.cleric.ascendedform.name=upphöjd form
actors.hero.abilities.cleric.ascendedform.short_desc=Prästen antar en _upphöjd form_ och får nya trollformler, attackräckvidd och skydd.
actors.hero.abilities.cleric.ascendedform.desc=Prästen projicerar helig energi från sig själv och antar en utsträckt strålande form i 10 turer. Vid denna form kan prästen kasta nya trollformler, får 2 attackräckvidd, 30 sköld och alla ytterligare trollformler som de kastar ger 10 sköld per helig bokladd som används. Skölden från upphöjd form och dess trollformler försvinner inte normalt, men försvinner omedelbart när upphöjd form upphör. Förmågan kan återanvändas för att uppdatera upphöjd forms varaktighet.
actors.hero.abilities.cleric.ascendedform$ascendbuff.name=upphöjd form
actors.hero.abilities.cleric.ascendedform$ascendbuff.desc=Strålande energi strålar ut från prästens kropp. Vid denna form får prästen 2 attackräckvidd (från den heliga energi som strålar ut från dem) och 10 sköld när de använder en helig bokladdning. De kan också kasta de trollformler som låses upp via den upphöjda formens talanger.\n\nSkölden som ges av den upphöjda formen och dess trollformler försvinner inte normalt, utan försvinner omedelbart när den upphöjda formen upphör.\n\nAktuell sköld: %1$d.\nÅterstående turer: %2$d.
actors.hero.abilities.cleric.trinity.name=treenighet
actors.hero.abilities.cleric.trinity.no_imbue=Treenighet har för närvarande ingen effekt inställd för någon av sina former, använd en av dess besvärjelser!
actors.hero.abilities.cleric.trinity.no_duplicate=Treenighet kan inte duplicera en effekt som du redan har utrustad!
actors.hero.abilities.cleric.trinity.ench_glyph_use=Treenighet kommer att tillämpa denna effekt i _%1$d turer_ till en kostnad av _%2$s laddning._
actors.hero.abilities.cleric.trinity.rare_ench_glyph_use=Treenighet kommer att tillämpa denna _kraftfulla_ effekt i _%1$d turer_ till en kostnad av _%2$s laddning._
actors.hero.abilities.cleric.trinity.wand_use=Treenighet kommer att zappa denna trollstav med _+%1$d_ till en kostnad av _%2$s laddning._
actors.hero.abilities.cleric.trinity.wand_multi_use=Trinity kommer att använda denna _multi-laddade_ trollstav med _+%1$d_ till en kostnad av _%2$s laddning._
actors.hero.abilities.cleric.trinity.thrown_use=Trinity kommer att kasta detta vapen för _+%1$d_ till en kostnad av _%2$s laddning.
actors.hero.abilities.cleric.trinity.ring_use=Trinity kommer att tillämpa denna rings effekt på _+%1$d_ i 20 turer, till en kostnad av _%2$s laddning._
actors.hero.abilities.cleric.trinity.alchemiststoolkit_use=Trinity tillämpar denna artefakts fjärralkemieffekt, till en kostnad av _%2$s laddning.
actors.hero.abilities.cleric.trinity.chaliceofblood_use=Trinity tillämpar denna artefakts passiva hälsogenereringseffekt med _+%1$d_ i 20 turer, till en kostnad av _%2$s laddning.
actors.hero.abilities.cleric.trinity.driedrose_use=Trinity använder denna artefakts effekt för att frammana en fördärvad vänlig vålnad med HP som en _+%1$d_-spöke, till en kostnad av _%2$s laddning.
actors.hero.abilities.cleric.trinity.etherealchains_use=Trinity tillämpar denna artefakts kedjekastningseffekt med räckvidd _+%1$d_, till en kostnad av _%2$s laddning.
actors.hero.abilities.cleric.trinity.hornofplenty_use=Trinity tillämpar denna artefakts snacking-effekt, till en kostnad av _%2$s laddning.
actors.hero.abilities.cleric.trinity.masterthievesarmband_use=Trinity tillämpar denna artefakts fiendestöldseffekt vid _+%1$d_, till en kostnad av _%2$s laddning._
actors.hero.abilities.cleric.trinity.sandalsofnature_use=Trinity tillämpar denna artefakts rotningseffekt med ett slumpmässigt skadligt frö, till en kostnad av _%2$s laddning.
actors.hero.abilities.cleric.trinity.skeletonkey_use=Treenigheten kommer att tillämpa denna artefakts insatseffekt, till en kostnad av _%2$s laddning._
actors.hero.abilities.cleric.trinity.talismanofforesight_use=Trinity tillämpar denna artefakts spådoms effekt vid _+%1$d_, till en kostnad av _%2$s laddning.
actors.hero.abilities.cleric.trinity.timekeepershourglass_use=Trinity tillämpar denna artefakts tidsfrysningseffekt med en varaktighet på _%1$d_ turer, till en kostnad av _%2$s laddning.
actors.hero.abilities.cleric.trinity.unstablespellbook_use=Trinity tillämpar denna artefakts slumpmässiga effekt för skriftrullen med en chans på _%1$d/10_ att erbjuda den exotiska versionen utan extra kostnad, till en kostnad av _%2$s laddning.
actors.hero.abilities.cleric.trinity.cost=Laddningskostnaden för denna förmåga varierar, men är oftast _%d._
actors.hero.abilities.cleric.trinity.short_desc=Prästen får en _Treenighet_ av förmågor som emulerar utrustning de har sett och kan tilldelas med hjälp av nya trollformler.
actors.hero.abilities.cleric.trinity.desc=Prästen får en _Treenighet_ av rustningsförmågor, som kan tilldelas olika föremålseffekter med hjälp av tre nya trollformler. Var och en av dessa trollformler fokuserar på att emulera effekterna av olika typer av utrustning som prästen har identifierat under denna omgång: kroppsform (vapen och rustningar), sinnesform (trollstavar och kastvapen) och andeform (ringar och artefakter).\n\nVarje treenighetsform kan förses med en effekt åt gången, och prästen väljer vilken som ska aktiveras när treenighet används. Treenighet duplicerar inte effekten av något du redan har utrustat dig med.
actors.hero.abilities.cleric.trinity$wndusetrinity.text=Välj vilken treenighetsform du vill använda. Effekterna av olika former kan vara aktiva samtidigt.
actors.hero.abilities.cleric.trinity$wndusetrinity.body=_Kroppsform: %s._
actors.hero.abilities.cleric.trinity$wndusetrinity.mind=_Sinnesform: %s._
actors.hero.abilities.cleric.trinity$wndusetrinity.spirit=_Andeform: %s._
actors.hero.abilities.cleric.trinity$wnditemtypeselect.text=Välj en effekt som ska ingå i treenigheten. Ytterligare information visas före bekräftelse.
actors.hero.abilities.cleric.trinity$wnditemconfirm.body=Tilldela till kroppsform
actors.hero.abilities.cleric.trinity$wnditemconfirm.mind=Tilldela till sinnesform
actors.hero.abilities.cleric.trinity$wnditemconfirm.spirit=Tilldela till andeform
actors.hero.abilities.cleric.powerofmany.name=många makter
actors.hero.abilities.cleric.powerofmany.prompt_default=Välj en allierad eller plats
actors.hero.abilities.cleric.powerofmany.prompt_ally=Rikta ditt ljus mot allierad
actors.hero.abilities.cleric.powerofmany.ally_exists=Du har redan en förstärkt allierad.
actors.hero.abilities.cleric.powerofmany.no_vision=Du kan inte välja en plats som du inte kan se.
actors.hero.abilities.cleric.powerofmany.only_allies=Du kan bara stärka allierade.
actors.hero.abilities.cleric.powerofmany.short_desc=Prästen kanaliserar _Mångas makt_ och ger en befintlig allierad förstärkning eller skapar en ny.
actors.hero.abilities.cleric.powerofmany.desc=Prästen kanaliserar _Mångas kraft_, som antingen ger en befintlig allierad kraft eller skapar en ny allierad med kraft i 100 turer. Om du riktar mot ett tomt fält skapas en ny allierad.\n\nMedan de är förstärkta av Många kraft gör alla allierade +25% skada, tar -25% skada och delar sin syn med prästen. De får också 25 i sköld när förmågan används.\n\nPrästen får också tre nya besvärjelser som bara kan användas med en förstärkt allierad. Många kraft upphör inte medan någon av dessa besvärjelser är aktiv.
actors.hero.abilities.cleric.powerofmany$powerbuff.name=power of many
actors.hero.abilities.cleric.powerofmany$powerbuff.desc=Denna allierade har förstärkts av Mångas kraft, vilket ger dem +25%% skada och -25%% skada. De delar också sitt synfält med prästen och kan dra nytta av Mångas kraft-besvärjelser. \n\nMångas kraft kvarstår när allierade som prismatiska bilder gömmer sig, men dess varaktighet räknas fortfarande ned. \n\nÅterstående turer: %s.
actors.hero.abilities.cleric.powerofmany$lightally.name=light ally
actors.hero.abilities.cleric.powerofmany$lightally.direct_defend=Din allierade flyttar sig till den positionen.
actors.hero.abilities.cleric.powerofmany$lightally.direct_follow=Din allierade flyttar sig för att följa dig.
actors.hero.abilities.cleric.powerofmany$lightally.direct_attack=Din allierade flyttar för att attackera!
actors.hero.abilities.cleric.powerofmany$lightally.desc=En kopia av en av prästens äventyrskompanjoner, gjord av fast ljus. Vid dess form har den inte någon av deras unika förmågor. Denna allierade kommer att finnas kvar så länge som Power of Many är tillämpad på dem. \n\nDenna allierade kan styras utan kostnad genom att återanvända rustningsförmågan Power of Many.
actors.hero.abilities.cleric.powerofmany$lightally.discover_hint=Du kan hitta denna karaktär med en specifik hjälte-rustningsförmåga.


actors.hero.abilities.ratmogrify.name=råttmogrifiera
actors.hero.abilities.ratmogrify.cant_transform=Du kan inte råttmogrifiera det där!
actors.hero.abilities.ratmogrify.too_strong=Den fienden är för stark för att råttmogrifiera!
actors.hero.abilities.ratmogrify.short_desc=Hjälten _Råttmogrifierar_ en fiende! Detta förvandlar dem tillfälligt till en råtta utan några förmågor.
actors.hero.abilities.ratmogrify.desc=Hjälten förvandlar en fiende till en råtta i 6 turer! Bossar, allierade och råttor kan inte råttmogrifieras.\n\nRåttmogrifierade fiender behåller sina ursprungliga statistik, men har inga förmågor.
actors.hero.abilities.ratmogrify$transmograt.name=råttmogrifierad %s
actors.hero.abilities.ratmogrify$transmograt.desc=Denna fiende har förvandlats till en råtta. En stor förbättring, om du frågar mig! - Råttkungen
actors.hero.abilities.ratmogrify$transmograt.rankings_desc=Dödad av: råttmogrifierad fiende

##Cleric Spells
actors.hero.spells.auraofprotection.name=skyddsaura
actors.hero.spells.auraofprotection.short_desc=Ökar försvaret för Paladin och närliggande allierade.
actors.hero.spells.auraofprotection.desc=Paladinen börjar utstråla skyddande energi i en glittrande aura runt sig själv i 20 turer. Alla allierade inom 2 rutor från paladinen (inklusive paladinen själv) tar %1$d%% mindre skada och får effekten av paladinens rustningsglyf med +%2$d%% kraft.n\nDenna skadereduktion sker före andra skadereducerande effekter (t.ex. rustning). Glyfkraftförstärkningen gäller alltid, men denna besvärjelse kan inte få Paladins glyf att gälla mer än en gång om en karaktär redan drar nytta av den (t.ex. Paladin själv eller en prismatisk bild).
actors.hero.spells.auraofprotection$aurabuff.name=aura of protection
actors.hero.spells.auraofprotection$aurabuff.desc=Paladinen utstrålar skyddande energi omkring sig.\n\nAlla allierade i närheten (inklusive paladinen själv) får minskad skada och får effekten av paladinens rustningsglyf med förstärkt kraft.\n\nÅterstående turer: %s.

actors.hero.spells.beamingray.name=strålande stråle
actors.hero.spells.beamingray.no_space=Det finns inget utrymme för din allierade att dyka upp där.
actors.hero.spells.beamingray.out_of_range=Den platsen är utanför räckvidden.
actors.hero.spells.beamingray.short_desc=Teleporterar din allierade och ger bonusskada.
actors.hero.spells.beamingray.desc=Prästen kanaliserar kraften från sin allierade till en ljusstråle som teleporterar dem till en plats. Om strålen kolliderar med en fiende placeras allierade i närheten och dirigeras mot fienden. Strålen har en maximal räckvidd på %1$d rutor och ökar bonusskadan från Power of Many till +%2$d%% i 10 turer mot närmaste fiende inom 4 rutor. Beaming ray kan även teleportera allierade som normalt är orörliga, men räckvidden halveras i dessa fall.
actors.hero.spells.beamingray$beamingrayboost.name=stråle
actors.hero.spells.beamingray$beamingrayboost.desc=Denna allierade har nyligen teleporterats av Beaming Ray, vilket ger dem bonusskada mot närmaste fiende efter teleporteringen. Power of Many upphör inte heller att gälla när denna buff är aktiv.\n\nÅterstående turer: %s.

actors.hero.spells.blessspell.name=bless
actors.hero.spells.blessspell.short_desc=Välsignar och skyddar präster, välsignar och läker andra.
actors.hero.spells.blessspell.desc=Prästen lägger en helig välsignelse på sig själv eller en annan karaktär som han kan se.\n\nNär den kastas på sig själv är effekten svagare och ger %1$d turer av välsignelse och %2$d barriär.\n\nNär den kastas på andra karaktärer är förtrollningen kraftfullare och ger %3$d turer av välsignelse och %4$d läkning. Överskott av läkning omvandlas till barriär.

actors.hero.spells.bodyform.name=kroppsform
actors.hero.spells.bodyform.short_desc=Tilldelar treenighet en förtrollning eller glyf.
actors.hero.spells.bodyform.desc=Prästen väljer en förtrollning eller glyf som de har identifierat under denna omgång och förser treenighet med dess effekt.\n\nNär treenighet används får prästen effekten av den valda förtrollningen eller glyfen i %d turer. Denna tillfälliga förtrollning eller glyf fungerar med alla effekter som en vanlig förtrollning eller glyf skulle ha.\n\nDenna besvärjelse ersätter alla andra kroppseffekter som treenigheten för närvarande är försedd med.
actors.hero.spells.bodyform$bodyformbuff.name=kroppsform
actors.hero.spells.bodyform$bodyformbuff.desc=Treenighetens kroppsform ger dig för närvarande kraften från en förtrollning eller glyf, som om du hade den utrustad på ditt nuvarande vapen eller rustning. \n\nObservera att kroppsform inte kan ge en kopia av en effekt som du redan har. \n\nNuvarande effekt: %1$s. \n\nÅterstående turer: %2$s.

actors.hero.spells.cleanse.name=cleanse
actors.hero.spells.cleanse.short_desc=Rensar debuffs och ger skydd.
actors.hero.spells.cleanse.desc=Prästen rensar alla skadliga statuseffekter på sig själv och synliga allierade. När förtrollningen upphör får alla berörda karaktärer också %1$d turer med immunitet mot debuffs och %2$d barriär.

actors.hero.spells.clericspell.prompt=Välj ett mål
actors.hero.spells.clericspell.no_target=Det finns inget mål där.
actors.hero.spells.clericspell.invalid_target=Du kan inte välja den platsen som mål.
actors.hero.spells.clericspell.invalid_enemy=Du kan inte rikta in dig på den fienden.
actors.hero.spells.clericspell.charge_cost=Laddningskostnad: %d

actors.hero.spells.divinesense.name=gudomlig känsla
actors.hero.spells.divinesense.short_desc=Få tillfällig tankesyn inom ett stort område.
actors.hero.spells.divinesense.desc=Prästen fokuserar sina sinnen på omgivningen och får mental syn med en räckvidd på %d rutor under 50 turer. Denna besvärjelse tar ingen tid att kasta.
actors.hero.spells.divinesense$divinesensetracker.name=gudomlig syn
actors.hero.spells.divinesense$divinesensetracker.desc=Denna karaktär kan tillfälligt se andra varelser i närheten med sitt sinne!\n\nÅterstående turer: %s.

actors.hero.spells.divineintervention.name=gudomlig ingripande
actors.hero.spells.divineintervention.short_desc=Massiv sköldförstärkning för präst och allierade.
actors.hero.spells.divineintervention.desc=Prästen häller en enorm mängd kraft från sin bok över sig själv och sina allierade, vilket ger alla %1$d sköldförstärkning och förlänger Ascended Form med %2$d turer. Denna besvärjelses otroliga defensiva kraft vägs mot dess mycket höga laddningskostnad. Precis som andra sköldar som ges av upphöjd form, försvinner inte denna sköld normalt, utan upphör omedelbart när upphöjd form upphör.

actors.hero.spells.flash.name=flash
actors.hero.spells.flash.prompt=Välj en plats
actors.hero.spells.flash.short_desc=Teleportera till en närliggande plats.
actors.hero.spells.flash.desc=Prästen kanaliserar sin upphöjda form till en närliggande plats och teleporterar sig dit. Flash kan teleportera prästen till vilken upptäckt plats som helst som ligger inom räckvidden och är obemannad. Denna besvärjelse kostar fler tomekostnader varje gång den används i samma upphöjda form.

actors.hero.spells.guidinglight.name=vägledande ljus
actors.hero.spells.guidinglight.short_desc=Orsakar magisk skada på avstånd och garanterar träff.
actors.hero.spells.guidinglight.desc=Prästen avfyrar en magisk energistråle som träffar ett mål, orsakar 2-8 skada och lyser upp det. Nästa obehindrade fysiska attack mot en upplyst fiende träffar garanterat.
actors.hero.spells.guidinglight.desc_priest=_Denna besvärjelse är kraftfullare när den kastas av Prästen._ Den första gången besvärjelsen kastas var 50:e tur kostar den inga bokavgifter, och belysningen kommer att förbrukas av strålglans, trollstavar, andra karaktärer och artefakter som direkt påverkar fiender. När belysningen används på detta sätt orsakar den bonusmagisk skada motsvarande prästens nivå + 5.
actors.hero.spells.guidinglight$guidinglightpriestcooldown.name=Guiding Light
actors.hero.spells.guidinglight$guidinglightpriestcooldown.desc=Prästen kan använda Guiding Light gratis igen efter 50 turer.\n\nÅterstående turer: %s.
actors.hero.spells.guidinglight$illuminated.name=Upplysning
actors.hero.spells.guidinglight$illuminated.desc=Denna karaktär lyser som ett resultat av att ha träffats av Guiding Light. Vid den här tiden är ljuset inte starkt nog för att lysa upp omgivningen, men den magiska effekten gör det mycket lättare för prästen att träffa karaktären.
actors.hero.spells.guidinglight$illuminated.desc_priest=Prästen kan dessutom konsumera illuminated med radiance, en trollstav, ett slag från en allierad eller effekter från vissa artefakter. Att använda illuminated på detta sätt ger bonusmagisk skada motsvarande prästens nivå + 5.
actors.hero.spells.guidinglight$illuminated.desc_generic=Andra hjältar kan fortfarande använda illuminated för att dra nytta av talangen searing light, men får inte någon ökad träffsäkerhet.

actors.hero.spells.hallowedground.name=hallowed ground
actors.hero.spells.hallowedground.prompt=Välj en plats
actors.hero.spells.hallowedground.short_desc=Läker allierade, saktar fiender och sprider gräs i ett AOE-område.
actors.hero.spells.hallowedground.desc=Prästen fokuserar sin gudomliga magi på marken i närheten och skapar ett %1$dx%1$d stort område med helig mark som varar i 20 turer.\n\nNär den kastas läker denna besvärjelse alla allierade med 15 HP (friska allierade och prästen får skydd), hindrar fiender från att röra sig under en kort stund och sprider kort gräs.\n\nDen heliga marken läker allierade för 1 HP per tur (friska allierade och prästen får sköld), förlamar fiender och får högt gräs att växa slumpmässigt.\n\nHelig mark förstörs av eld och ger upphov till upprivet gräs om passiva regenereringseffekter är inaktiverade eller prästen inte har fått erfarenhet på en stund.
actors.hero.spells.hallowedground$hallowedterrain.desc=Marken har helgats här. Helgad mark saktar ner fiender, läker allierade och får gräs att sprida sig.

actors.hero.spells.holyintuition.name=helig intuition
actors.hero.spells.holyintuition.prompt=välj ett föremål
actors.hero.spells.holyintuition.cursed=Du känner av ond magi i detta föremål.
actors.hero.spells.holyintuition.uncursed=Denna föremål är fri från ond magi.
actors.hero.spells.holyintuition.short_desc=identifierar om ett föremål är förbannat eller inte.
actors.hero.spells.holyintuition.desc=Prästen fokuserar sina sinnen på ett föremål och avgör om det är förbannat eller inte utan att behöva utrusta sig med det.

actors.hero.spells.holylance.name=helig lans
actors.hero.spells.holylance.short_desc=Orsakar kraftig magisk skada på avstånd.
actors.hero.spells.holylance.desc=Prästen koncentrerar en stor mängd energi till en förödande ljuslanse som han kastar. Lansen orsakar %1$d-%2$d skada och orsakar alltid maximal skada på odöda och demoniska mål.\n\nDenna besvärjelse är mycket dyr och har en nedkylningstid på 30 turer.
actors.hero.spells.holylance$lancecooldown.name=holy lance cooldown
actors.hero.spells.holylance$lancecooldown.desc=Prästen har nyligen kastat Helig lans och måste vänta innan han kan använda den igen.\n\nÅterstående turer: %s.

actors.hero.spells.holyward.name=helig skydd
actors.hero.spells.holyward.glyph_name=%s av ljus
actors.hero.spells.holyward.glyph_desc=Denna glyf ökar något mängden skada som rustningen kan blockera.
actors.hero.spells.holyward.short_desc=Åsidosätter tillfälligt glyfer för att öka rustningens blockeringsförmåga.
actors.hero.spells.holyward.desc=Prästen förser sin rustning med symboler av heligt ljus, vilket ökar rustningens skadesblockering med 1. Denna besvärjelse tar ingen tid att kasta. \n\nSymbolen varar i 50 turer och ersätter alla fördelaktiga symboler som rustningen har under den tiden. Prästen drar nytta av denna effekt även om han inte bär någon rustning.
actors.hero.spells.holyward.desc_paladin=_Denna besvärjelse är kraftfullare när den kastas av en paladin._ Den extra skadeavvärjningen ökar till 3, besvärjelsen åsidosätter inte längre befintliga glyfer, och om andra besvärjelser kastas vid aktiv helig skydd förlängs dess varaktighet med 10 turer per använd laddning.
actors.hero.spells.holyward$holyarmbuff.name=helig skydd
actors.hero.spells.holyward$holyarmbuff.desc=Prästen har genomsyrat sin rustning med helig energi, vilket tillfälligt åsidosätter alla befintliga glyfer och gör att rustningen blockerar 1 extra skadepunkt.\n\nÅterstående turer: %s.
actors.hero.spells.holyward$holyarmbuff.desc_paladin=Paladinen har genomsyrat sin rustning med helig energi, vilket gör att rustningen blockerar ytterligare 3 skadepoäng.\n\nOm du använder andra trollformler vid aktiv helig skydd förlängs dess varaktighet med 10 turer per förbrukad laddning.\n\nÅterstående turer: %s.

actors.hero.spells.holyweapon.name=heligt vapen
actors.hero.spells.holyweapon.ench_name=helig %s
actors.hero.spells.holyweapon.ench_desc=Fiender som träffas av ett heligt vapen får extra magisk skada.
actors.hero.spells.holyweapon.short_desc=Åsidosätter tillfälligt förtrollningar för att öka skadan.
actors.hero.spells.holyweapon.desc=Prästen förtrollar sitt vapen med helig energi, vilket gör att vapnet orsakar 2 extra magiska skador varje gång det träffar en fiende. Denna besvärjelse tar ingen tid att kasta.\n\nDenna förtrollning varar i 50 turer och åsidosätter alla fördelaktiga förtrollningar som vapnet har under den tiden. Obeväpnade attacker kan också dra nytta av denna effekt.
actors.hero.spells.holyweapon.desc_paladin=_Denna besvärjelse är kraftfullare när den kastas av en paladin._ Den extra magiska skadan ökar till 6, besvärjelsen åsidosätter inte längre befintliga förtrollningar, och om andra besvärjelser kastas vid aktiv heligt vapen förlängs dess varaktighet med 10 turer per använd laddning.
actors.hero.spells.holyweapon$holywepbuff.name=heligt vapen
actors.hero.spells.holyweapon$holywepbuff.desc=Prästen har ingjutit helig energi i sitt vapen, vilket tillfälligt åsidosätter alla befintliga förtrollningar och gör att vapnet orsakar 2 extra magiska skador vid varje attack.\n\nÅterstående turer: %s.
actors.hero.spells.holyweapon$holywepbuff.desc_paladin=Paladinen har ingjutit helig energi i sitt vapen, vilket gör att deras attacker orsakar 6 extra magiska skador.\n\nOm andra trollformler används vid aktiv heligt vapen förlängs dess varaktighet med 10 turer per förbrukad laddning.\n\nÅterstående turer: %s.

actors.hero.spells.judgement.name=dom
actors.hero.spells.judgement.short_desc=Skadar alla synliga fiender.
actors.hero.spells.judgement.desc=Prästen slår sin knytnäve i marken, vilket orsakar en ljusexplosion som skadar alla fiender som de kan se. Detta orsakar %1$d-%2$d skada som bas, men orsakar också ytterligare 33%% skada för varje besvärjelse som prästen har kastat sedan han gick in i upphöjd form (eller sedan han senast kastade Dom).\n\nFör närvarande orsakar Dom %3$d-%4$d skada.

actors.hero.spells.layonhands.name=lägga händerna på
actors.hero.spells.layonhands.short_desc=Läker omedelbart en intilliggande karaktär eller skyddar paladinen.
actors.hero.spells.layonhands.desc=Paladinen kanaliserar helig energi genom sina händer och läker eller skyddar allt de rör vid.\n\nPaladinen kan kasta denna besvärjelse på alla intilliggande karaktärer för att ge dem %1$d läkning, eller på sig själv för att få %1$d sköld. Överskott av läkning från denna besvärjelse omvandlas till skydd.\n\nDenna besvärjelse kastas omedelbart och kan kastas upprepade gånger, men kan inte ge mer än tre kast värde av skydd åt gången.

actors.hero.spells.lifelinkspell.name=livslänk
actors.hero.spells.lifelinkspell.short_desc=Delar skada med en allierad och minskar deras skada.
actors.hero.spells.lifelinkspell.desc=Prästen stärker bandet mellan sig själv och sin förstärkta allierade. Med detta förstärkta band delas all skada som tas mellan hjälten och deras allierade i %1$d turer, och Power of Many:s defensiva boost ökas till -%2$d%% av skadan som tas. Observera att skadan delas efter rustning, men före Power of Many:s skadereduktion. \n\nMedan denna effekt är aktiv kommer fördelaktiga prästbesvärjelser av T3 eller lägre att gälla både prästen och deras allierade om de bara skulle ha gällt en av dem.
actors.hero.spells.lifelinkspell$lifelinkspellbuff.name=livslänkskydd
actors.hero.spells.lifelinkspell$lifelinkspellbuff.desc=Prästen har nyligen använt Livslänk på denna allierade.\n\nUtöver Livslänks vanliga fördelar får denna karaktär också minskad skada, alla positiva prästbesvärjelser gäller både prästen och denna allierade istället för bara en, och Många makter upphör inte att gälla vid denna buff är aktiv.\n\nÅterstående turer: %s.

actors.hero.spells.mindform.name=sinnesform
actors.hero.spells.mindform.short_desc=Tilldelar treenighet till en trollstav eller ett kastvapen.
actors.hero.spells.mindform.desc=Prästen väljer en trollstav eller ett kastvapen som de har identifierat under denna omgång och förser treenigheten med dess effekt.n\nNär treenigheten används kan prästen göra en enda attack som om de använde det valda föremålet med +%d. Detta utlöser alla effekter som normalt skulle utlösas av att använda den typen av föremål.\n\nDenna besvärjelse ersätter alla andra sinnesförmågor som treenigheten för närvarande är försedd med.

actors.hero.spells.mnemonicprayer.name=mnemonic prayer
actors.hero.spells.mnemonicprayer.short_desc=Förlänger buffs/debuffs på en allierad/fiende och återanvänder illuminated.
actors.hero.spells.mnemonicprayer.desc=Prästen uttalar en bön som förlänger varaktigheten för alla buffar eller debuffar på ett specifikt mål med %1$d turer. Denna besvärjelse tar ingen tid att kasta. Positiva effekter varar längre på allierade (inklusive prästen själv), och skadliga effekter varar längre på fiender.\n\nMnemonic Prayer kan bara förlänga en specifik buff eller debuff en gång, och kan inte förlänga buffar som ges av rustningsförmågor.

actors.hero.spells.radiance.name=radiance
actors.hero.spells.radiance.short_desc=Belyser och bedövar synliga fiender kortvarigt.
actors.hero.spells.radiance.desc=Prästen lyser upp i heligt ljus och bedövar alla synliga fiender i 3 turer. Om en fiende redan är upplyst, utlöser Radiance bonusskadan från Illuminate och applicerar sedan debuffen Illuminate. Radiance får också prästen att lysa i 100 turer om det aktuella golvet är mörkt.

actors.hero.spells.recallinscription.name=återkalla inskription
actors.hero.spells.recallinscription.short_desc=Upprepar en nyligen använd runsten eller skriftrulle.
actors.hero.spells.recallinscription.desc=Prästen använder helig magi för att återanvända effekten av en magisk runa som finns på en runsten eller en skriftrulle som de använde under de senaste %s turerna.\n\nÅterkalla inskription kan inte användas för att replikera uppgraderingsrullar. Denna besvärjelses laddningskostnad varierar beroende på vilket föremål som nyligen använts: 2 för en runsten, 3 för en skriftrulle, 4 för en exotisk skriftrulle. Laddningskostnaden fördubblas också när du replikerar en transmutationsrulle eller alkemiföremål som måste tillverkas med hjälp av transmutation eller uppgradering.
actors.hero.spells.recallinscription$useditemtracker.name=recently used rune
actors.hero.spells.recallinscription$useditemtracker.desc=Prästen har nyligen använt ett föremål som fungerar med den inskrivna återkallningsbesvärjelsen. Prästen kan kasta besvärjelsen för att upprepa föremålets effekt.\n\nAnvänt föremål: %1$s.\n\nÅterstående turer: %2$s.

actors.hero.spells.shieldoflight.name=sköld av ljus
actors.hero.spells.shieldoflight.short_desc=Ger tillfällig rustning mot ett mål.
actors.hero.spells.shieldoflight.desc=Prästen skapar en tunn ljusbarriär mellan sig själv och en fiende, vilket ökar rustningens blockeringskraft mot den fienden med %1$d-%2$d i 5 turer.\n\nDenna besvärjelse tar ingen tid att kasta, men kan inte användas mot flera mål samtidigt.
actors.hero.spells.shieldoflight$shieldoflighttracker.name=ljussköld
actors.hero.spells.shieldoflight$shieldoflighttracker.desc=Ett tunt ljussköld står mellan denna karaktär och en fiende. Den är inte tillräckligt stark för att helt blockera attacker, men dämpar dem.\n\nÅterstående turer: %s

actors.hero.spells.spiritform.name=andeform
actors.hero.spells.spiritform.short_desc=Tilldelar treenigheten en ring eller artefakt.
actors.hero.spells.spiritform.desc=Prästen väljer en ring eller artefakt som de har identifierat under denna omgång (utom den heliga boken) och förser treenigheten med dess effekt.\n\nOm en ring väljs, ger treenigheten ringens effekt med +%1$d i 20 turer.\n\nOm en artefakt väljs, replikerar Trinity den artefaktens effekt med +%2$d. Varje artefakt har olika specifika beteenden och rustningskostnader när den används med Trinity.\n\nDenna besvärjelse ersätter alla andra andeeffekter som treenigheten för närvarande är förse
actors.hero.spells.spiritform$spiritformbuff.name=andeform
actors.hero.spells.spiritform$spiritformbuff.desc=Treenighetens andeform ger dig för närvarande kraften från ett föremål, som om du hade det utrustat.\n\nObservera att andeform inte kan ge dig ytterligare en kopia av en effekt som du redan har nytta av.\n\nNuvarande effekt: %1$s.\n\nÅterstående turer: %2$s.

actors.hero.spells.smite.name=smite
actors.hero.spells.smite.short_desc=Garanterar en träff med bonusskada och förtrollningskraft.
actors.hero.spells.smite.desc=Paladinen infunderar en närstridsattack med rättfärdig förstörelsekraft.n\nFörutom att orsaka normal närstridsskada gör Smite att icke-belastade attacker garanterat träffar, har +300%% förtrollningskraft och orsakar %1$d - %2$d bonusmagisk skada.\n\nSmites bonusmagiska skada skalar med Paladins nivå och orsakar alltid maximal bonusmagisk skada mot odöda eller demoniska fiender.

actors.hero.spells.stasis.name=stasis
actors.hero.spells.stasis.short_desc=Tar bort allierade från fängelsehålan och bevarar dem.
actors.hero.spells.stasis.desc=Prästen fokuserar sin koppling till sin allierade mot sig själv, vilket gör att allierade tillfälligt hålls i en sorts energistasis inom prästen. Allierade bevaras i upp till %d turer, och alla positiva effekter på dem påverkas inte av tiden i stasis. \n\nAllierade visas bredvid prästen när stasis upphör naturligt, eller så kan prästen omedelbart återanvända förtrollningen utan kostnad för att avsluta effekten i förtid. Stasis kan även flytta orörliga allierade, men kan inte flytta dem mellan våningar.
actors.hero.spells.stasis$stasisbuff.name=ally in stasis
actors.hero.spells.stasis$stasisbuff.left_behind=Din orörliga allierade blir kvar.
actors.hero.spells.stasis$stasisbuff.desc=Prästen har för närvarande en allierad lagrad i stasis. Alla positiva effekter på denna allierade bevaras, inklusive Power of Many, och de återkommer bredvid prästen när effekten upphör. Effekten kan också avslutas i förtid genom att Stasis kastas igen. \n\nAllierad i stasis: %1$s. \nÅterstående turer: %2$s.

actors.hero.spells.sunray.name=sunray
actors.hero.spells.sunray.short_desc=Orsakar magisk skada på avstånd och bländar ett mål en gång.
actors.hero.spells.sunray.desc=Prästen avfyrar en bländande ljusstråle mot ett mål, som orsakar %1$d-%2$d skada och förblindar målet i %3$d turer. Sunray orsakar alltid maximal skada på odöda och demoniska mål. \n\nEfter att ha träffats av denna besvärjelse anpassar fiendens syn, vilket förhindrar att de bländas av den igen. Om de dock träffas igen vid blindhet orsakad av denna besvärjelse blir ljuset överväldigande och förlamar dem istället.

actors.hero.spells.walloflight.name=ljusvägg
actors.hero.spells.walloflight.short_desc=Skapar en vägg som blockerar fiender.
actors.hero.spells.walloflight.desc=Paladinen skapar en vägg av solida ljuspaneler direkt framför sig som är 1 ruta tjock, %1$d rutor bred och varar i 20 turer.\n\nDenna vägg fungerar precis som en vanlig vägg, förutom att man kan se igenom den. Fiender som fastnar i väggen när den skapas blir tillfälligt bedövade och trycks tillbaka om möjligt. Allt som fastnar i väggen kan röra sig ut ur den.\n\nVäggen kan kastas i någon av de fyra huvudriktningarna eller de fyra diagonala riktningarna. Om en vägg redan är aktiv kan förtrollningen användas igen gratis för att omedelbart rensa väggen.
actors.hero.spells.walloflight.early_end=Du upplöser ljusväggen.
actors.hero.spells.walloflight$lightwall.desc=Skinnande ljuspaneler blockerar passagen här.

##main hero
actors.hero.hero.name=du
actors.hero.hero.leave=Du kan inte gå ännu, resten av fängelsehålan väntar nedanför!
actors.hero.hero.level_up=Nivå upp!
actors.hero.hero.new_level=Nivå upp! +Träffsäkerhet, +Undvikande, +5 HP!
actors.hero.hero.new_talent=+1 Talangpoäng!
actors.hero.hero.unspent=Du har talangpoäng att spendera!
actors.hero.hero.level_cap=Du kan inte bli starkare, men dina erfarenheter ger dig en kraftökning!
actors.hero.hero.you_now_have=du plockade upp: %s.
actors.hero.hero.you_cant_have=du kan inte bära: %s.
actors.hero.hero.locked_chest=Denna kista är låst och du har inte en nyckel som passar.
actors.hero.hero.locked_door=Du har ingen nyckel som passar.
actors.hero.hero.noticed_smth=Du märkte något.
actors.hero.hero.wait=…
actors.hero.hero.search=sök
actors.hero.hero.search_distracted=Det är svårt att koncentrera sig, sökandet är utmattande.
actors.hero.hero.key_distracted=Du kan inte riktigt få upp låset, du måste fortsätta försöka.
actors.hero.hero.pain_resist=Smärtan hjälper dig att motstå sömnen.
actors.hero.hero.revive=Ankhen exploderar med livs-givande energi!

##classes
actors.hero.heroclass.warrior=krigare
actors.hero.heroclass.warrior_desc_short=Krigaren tål extra skada tack vare skölden som han får genom sin _brutna sigill._ Sigillet kan flyttas mellan rustningar och _överför en enda uppgradering._
actors.hero.heroclass.warrior_desc=Krigaren börjar med en unik trasig sigill som ger honom en sköld när han har mindre än hälften av sin hälsa kvar. Sigillet kan flyttas mellan rustningar och kan _överföra en enda uppgradering_ med sig.\n\nKrigaren börjar också med ett _slitet kort svärd_, _tre kaststenar_, tygrustning, en vattenflaska och en sammetspåse.\n\nKrigaren identifierar automatiskt:\n_-_ Identifieringsrullar\n_-_ Helande drycker\n_-_ Raserirullar
actors.hero.heroclass.warrior_unlock=Krigaren är automatiskt upplåst.

actors.hero.heroclass.mage=magiker
actors.hero.heroclass.mage_desc_short=Magikern är en expert på det övernaturliga och bär på en _magisk stav_ som är starkare än en trollstav. Staven kan _laddas med vilken trollstav_ som helst som Magikern hittar.
actors.hero.heroclass.mage_desc=Magikern börjar med en unik stav som laddas betydligt snabbare än en trollstav och har 1 laddning mer. Staven kan laddas med vilken trollstav som helst som magikern hittar i fängelsehålan. \n\nMagikern börjar också med en _trollstav med magiska projektiler_ laddad i sin stav, tygrustning, en vattenflaska och en sammetspåse. \n\nMagikern identifierar automatiskt:\n_-_ Identifieringsrullar\n_-_ Flytande eldpotioner\n_-_ Uppgraderingsrullar
actors.hero.heroclass.mage_unlock=_Använd en upgraderingsrulle för att göra något starkare_ så låser du upp Magikern.

actors.hero.heroclass.rogue=skurk
actors.hero.heroclass.rogue_desc_short=Skurken kan undvika fiender och slå till från osynlighet med hjälp av sin _skuggmantel._ Han kan också _upptäcka hemligheter och fällor_ på längre avstånd.
actors.hero.heroclass.rogue_desc=Skurken börjar med en _unik skuggmantel_, som han kan använda för att bli osynlig när han vill.n\nSkurken kan _upptäcka hemligheter och fällor_ på längre avstånd.\n\nSkurken börjar också med _en dolk_, _tre kastknivar_, tygskydd, en vattenflaska och en sammetspåse.\n\nSkurken identifierar automatiskt:\n_-_ Identifieringsrullar\n_-_ Osynlighetsdrycker\n_-_ Magiska kartrullar
actors.hero.heroclass.rogue_unlock=_Genomför 10 överraskningsattacker under ett spel_ för att låsa upp Skurken.

actors.hero.heroclass.huntress=jägare
actors.hero.heroclass.huntress_desc_short=Jägaren är en mästare på kastvapen och har en _magisk båge_ med oändligt många pilar. Hon kan också springa genom högt gräs _utan att trampa ner det._
actors.hero.heroclass.huntress_desc=Jägaren börjar med en unik andebåge som kan avfyra ett oändligt antal trollade pilar.n\nJägaren kan ta sig fram genom högt gräs _utan att trampa ner det_.\n\nJägaren börjar också med _spikhandskar_, tygrustning, en vattenflaska och en sammetspåse.\n\nJägaren identifierar automatiskt:\n_-_ Identifieringsrullar\n_-_ Drycker för klarsyn\n_-_ Vaggvisrullar
actors.hero.heroclass.huntress_unlock=För att låsa upp Jägaren _träffa fiender med kastvapen 10 gånger i ett spel._

actors.hero.heroclass.duelist=duellanten
actors.hero.heroclass.duelist_desc_short=Duellanten är en vapenmästare som kan använda sitt vapen för att utlösa en _speciell vapenfärdighet._ Denna speciella färdighet är _olika för varje vapen._
actors.hero.heroclass.duelist_desc=Duellanten börjar med en unik rapir med en specialförmåga som laddas upp över tid.n\nVarje vapen i spelet har en _olika specialförmåga_ som duellisten kan använda.\n\nDuellanten börjar också med _två kastspikar_, tygrustning, en vattenflaska och en sammetspåse.\n\nDuellanten identifierar automatiskt:\n_-_ Identifieringsrullar\n_-_ Styrkedrycker\n_-_ Spegelbildsrullar
actors.hero.heroclass.duelist_unlock=_Utrusta dig med ett vapen av rank 2 eller högre utan något styrkestraff_ för att låsa upp Duellanten.

actors.hero.heroclass.cleric=cleric
actors.hero.heroclass.cleric_desc_short=Prästen är en gudomlig trollkarl som använder sin unika _heliga bok_ för att kanalisera gudomlig magi. De kan _lära sig och uppgradera trollformler_ via talanger.
actors.hero.heroclass.cleric_desc=Prästen börjar med en _unik helig bok_ som de kan använda för att kasta olika trollformler.\n\nDe flesta av prästens talanger är inriktade på att lära sig eller uppgradera trollformler.\n\nPrästen börjar också med _en klubba_, tygrustning, en vattenflaska och en sammetspåse.\n\nPrästen identifierar automatiskt:\n_-_ Identifieringsrullar\n_-_ Renhetsdrycker\n_-_ Skriftrullar för att ta bort förbannelser
actors.hero.heroclass.cleric_unlock=För att låsa upp prästen måste du helt rena alla förbannade utrustningsdelar från förbannelsen.

actors.hero.herosubclass.berserker=bärsärk
actors.hero.herosubclass.berserker_short_desc=_Bärsärkaren_ bygger ilska allteftersom han tar skada. Ilska ökar hans skada och kan aktiveras vid 100% för extra avskärmning.
actors.hero.herosubclass.berserker_desc=Berserkern får raseri när han tar fysisk skada, inklusive skada som blockeras av hans rustning! Raseriet avtar gradvis med tiden, men avtar långsammare om han har låg HP. Vid maximal raseri kan han bli berserk, få en sköld och behålla sitt raseri så länge han har sköld kvar. Skölden skalar med berserkerns rustningsnivå och kan förstärkas kraftigt om han har låg HP. Berserkern behöver tid för att återhämta sig efter att han blivit berserk.
actors.hero.herosubclass.gladiator=gladiator
actors.hero.herosubclass.gladiator_short_desc=Gladiatorn bygger kombination när han utför lyckade attacker. Han kan spendera kombination för att använda unika förmågor.
actors.hero.herosubclass.gladiator_desc=Gladiatorn bygger upp en kombo-poäng varje gång han lyckas med en attack med ett närstridsvapen eller ett kastvapen. Om gladiatorn inte lyckas med en attack inom 5 turer (15 turer efter en dödande attack) återställs hans kombo.\n\nNär han bygger upp kombinationer kan gladiatorn använda en rad olika förmågor som garanterat träffar:\n2 kombinationer: slå tillbaka fienden, behåller kombinationen\n4 kombinationer: orsaka skada baserat på rustning\n6 kombinationer: parera, behåller kombinationen\n8 kombinationer: skada målet och fiender i närheten\n10 kombinationer: attackera en gång för varje kombination
actors.hero.herosubclass.battlemage=stridsmagiker
actors.hero.herosubclass.battlemage_short_desc=_Stridsmagikern_ frammanar bonuseffekter när han slåss i närstrid med sin stav. Dessa effekter beror på vilken trollstav hans stav är förtrollad med.
actors.hero.herosubclass.battlemage_desc=Stridsmagikern får en bonuseffekt varje gång han slår i närstrid med sin stav, som om hans stav hade en extra förtrollning. Dessa effekter beror på den trollstav som hans stav är förtrollad med, varje trollstav har sin egen effekt. Utöver trollstavseffekterna får Stridsmagikerns stav också 0,5 laddningar när han slår med den.
actors.hero.herosubclass.warlock=häxmästare
actors.hero.herosubclass.warlock_short_desc=_Häxmästaren_ har en chans att själmärka fiender med sina trollstavar. Han helas närhelst han gör fysisk skada till märkta fiender.
actors.hero.herosubclass.warlock_desc=Häxmästaren har en chans att sätta ett själsmärke på karaktärer när han använder trollstavar på dem. Chansen att sätta ett själsmärke och dess varaktighet ökar med trollstavens nivå. \n\nNär en fiende är själsmärkt läker Häxmästaren 2 hp för varje 5 skada han gör på dem, men endast med attacker från närstridsvapen eller kastvapen, inte från trollstavar!
actors.hero.herosubclass.assassin=lönnmördare
actors.hero.herosubclass.assassin_short_desc=_Lönnmördaren_ kan förbereda ett dödligt slag medan han är osynlig. Ju längre han väntar, ju starkare är attacken.
actors.hero.herosubclass.assassin_desc=Lönnmördaren förbereder sitt nästa slag när han blir osynlig. Ju längre han förbereder sig, desto kraftfullare blir hans nästa attack. Förberedelsen pågår i upp till 9 turer.\n\nEfter förberedelsen gör Lönnmördaren bonusskada vid sin nästa attack, kan blinka till sitt mål och kan till och med omedelbart döda fiender som är tillräckligt svaga.
actors.hero.herosubclass.freerunner=frilöpare
actors.hero.herosubclass.freerunner_short_desc=Frilöparen bygger upp momentum när han springer, vilket kan användas för att starta frilöpning. Detta ger honom bonus i hastighet och undvikande under en kort stund.
actors.hero.herosubclass.freerunner_desc=När Frilöparen rör sig bygger han upp momentum. Han kan få upp till 10 momentum efter att ha sprungit i 10 turer, men förlorar det snabbt om han slutar röra sig. Frilöparen kan använda sin fart för att börja frilöpning, 2 turer per fartpoäng.\n\nNär han frilöper rör sig Frilöparen med 2x hastighet och får bonus undvikande i proportion till sin nivå. När frilöpningen slutar finns det en nedkylningstid innan fart kan byggas upp igen.
actors.hero.herosubclass.sniper=krypskytt
actors.hero.herosubclass.sniper_short_desc=Skytten kan genomtränga rustning med sina avståndsattacker. Hon kan även följa upp med en speciell attack från sin pilbåge efter en träff med kastvapen.
actors.hero.herosubclass.sniper_desc=Snipern är en mästare på distansstrid, vars distansattacker genomtränger fiendens rustning. När hon attackerar en fiende med ett kastvapen placerar hon en prickskyttemärke på dem, vilket låter henne följa upp med en specialattack från sin båge. Denna specialattack varierar beroende på hur hennes båge är förstärkt. En oförstärkt båge avfyrar ett skott som gör mindre skada men avfyras omedelbart. En snabb båge avfyrar en salva med tre pilar som gör mindre skada, men som fortfarande kan aktivera förtrollningar och tar 1 tur att avfyra. En skadebåge avfyrar ett prickskott som garanterat träffar, gör bonusskada baserat på avstånd och tar 2 turer att avfyra.
actors.hero.herosubclass.warden=väktare
actors.hero.herosubclass.warden_short_desc=_Väktaren_ kan se genom högt gräs och får bonuseffekter när hon planterar frön och trampar ner växter.
actors.hero.herosubclass.warden_desc=Väktaren har en stark koppling till naturen som ger henne en rad bonuseffekter relaterade till gräs och växter. Hon kan se genom högt och fuktigt gräs som om det vore tomt utrymme. \n\nVäktaren får gräs att gro runt alla frön hon kastar eller planterar och får specialeffekter när hon trampar på växter. Dessa specialeffekter ersätter de vanliga växteffekterna, vilket innebär att inga växter är skadliga för henne att trampa på.
actors.hero.herosubclass.champion=kämpe
actors.hero.herosubclass.champion_short_desc=_Kämpen_ kan använda två vapen och får fler vapenkontakter. Hennes vanliga attacker använder hennes primära vapen, men hon kan byta vapen och använda båda vapnens förmågor.
actors.hero.herosubclass.champion_desc=Kämpen är en mästare på närstridsvapen som kan utrusta sig med ett sekundärt vapen utöver sitt primära. Hennes vanliga attacker använder hennes primära vapen, men hon kan byta primärt vapen direkt och använda båda vapnens förmågor.
actors.hero.herosubclass.monk=munk
actors.hero.herosubclass.monk_short_desc=_Munken_ samlar energi under strid. Denna energi kan användas till en rad olika unika förmågor.
actors.hero.herosubclass.monk_desc=Munken är en mästare på fysisk teknik. När hon besegrar fiender får hon energi som kan användas till en rad olika defensiva och användbara förmågor. Denna energi försvinner inte med tiden, men har en övre gräns baserad på munkens nivå. \n\n1 energi: slå snabbt med nävarna \n2 energi: fokusera för att undvika nästa attack \n3 energi: spring snabbt till närheten \n4 energi: sparka bort en fiende \n5 energi: meditera för att rensa statusar och återställa trollstavens och artefaktens laddning
actors.hero.herosubclass.priest=präst
actors.hero.herosubclass.priest_short_desc=Prästen får nya långdistansbesvärjelser och en förstärkt version av vägledande ljus.
actors.hero.herosubclass.priest_desc=Prästen får en rad nya och uppgraderade besvärjelser som betonar distansstrid och synergi med magiska föremål.\n\nPrästen kan kasta Guiding Light gratis en gång var 50:e tur, vilket belyser fiender som direkt träffas av någon av deras besvärjelser, och kan konsumera belysningsdebuffen med allierade, trollstavar och vissa artefakter för bonusskada motsvarande deras nivå + 5.\n\nPrästen får också förtrollningen Radiance, som skingrar mörkret och påverkar alla synliga fiender, vilket utlöser och tillämpar belysning och kortvarigt bedövar dem till en kostnad av 2 laddningar.
actors.hero.herosubclass.paladin=paladin
actors.hero.herosubclass.paladin_short_desc=Paladinen får nya kortdistansbesvärjelser och förstärkta versioner av heliga vapen och skydd.
actors.hero.herosubclass.paladin_desc=Paladinen får en rad nya och uppgraderade trollformler som betonar närstrid och synergi med vapen och rustningar.\n\nPaladinens trollformler _Holy Weapon_ och _Holy Ward_ ger större bonusar, åsidosätter inte längre befintliga förtrollningar och glyfer och kan förlängas genom att kasta andra trollformler.\n\nPaladinen får också besvärjelsen _Smite_, som låter dem utföra en garanterad närstridsträff med bonusskada och förtrollningskraft.

##talents
actors.hero.talent$provokedangertracker.name=provoked anger
actors.hero.talent$provokedangertracker.desc=Krigaren har nyligen förlorat sitt skydd, hans nästa fysiska attack kommer att orsaka bonusskada.\n\nÅterstående turer: %s.
actors.hero.talent$lingeringmagictracker.name=kvarvarande magi
actors.hero.talent$lingeringmagictracker.desc=Magikern har nyligen använt en stav eller trollstav, hans nästa fysiska attack kommer att orsaka bonusskada.\n\nÅterstående turer: %s.
actors.hero.talent$followupstriketracker.name=uppföljande slag
actors.hero.talent$followupstriketracker.desc=Jägaren har nyligen attackerat en fiende med ett kastvapen, hennes nästa närstridsattack mot samma mål kommer att ha ökad skada. \n\nÅterstående turer: %s.
actors.hero.talent$patientstriketracker.name=tålmodigt slag
actors.hero.talent$patientstriketracker.desc=Duellanten har just väntat en tur, hennes nästa närstridsattack kommer att orsaka extra skada.
actors.hero.talent$improvisedprojectilecooldown.name=improviserade projektiler nedkylningsperiod
actors.hero.talent$improvisedprojectilecooldown.desc=Du har nyligen använt denna talang och måste vänta innan du kan använda den igen.\n\nÅterstående turer: %s.
actors.hero.talent$rejuvenatingstepscooldown.name=återhämtande fotsteg nedkylningsperiod
actors.hero.talent$rejuvenatingstepscooldown.desc=Du har nyligen använt denna talang och måste vänta innan du kan använda den igen.\n\nÅterstående turer: %s.
actors.hero.talent$seershotcooldown.name=siarskott nedkylningsperiod
actors.hero.talent$seershotcooldown.desc=Du har nyligen använt denna talang och måste vänta innan du kan använda den igen.\n\nÅterstående turer: %s.
actors.hero.talent$aggressivebarriercooldown.name=aggressiv barriär nedkylningsperiod
actors.hero.talent$aggressivebarriercooldown.desc=Du har nyligen använt denna talang och måste vänta innan du kan använda den igen.\n\nÅterstående turer: %s.
actors.hero.talent$liquidagilacctracker.name=flytande smidighet
actors.hero.talent$liquidagilacctracker.desc=Duellantens nästa vanliga närstridsattack får bonus i träffsäkerhet.\n\nÅterstående turer: %s.
actors.hero.talent$lethalhastecooldown.name=dödlig hast nedkylningsperiod
actors.hero.talent$lethalhastecooldown.desc=Du har nyligen använt denna talang och måste vänta innan du kan använda den igen.\n\nÅterstående turer: %s.
actors.hero.talent$swiftequipcooldown.name=kvickutrustande nedkylningsperiod
actors.hero.talent$swiftequipcooldown.desc=Du har nyligen använt denna talang och måste vänta innan du kan använda den igen.\n\nÅterstående turer: %s.
actors.hero.talent$preciseassaulttracker.name=precis attack
actors.hero.talent$preciseassaulttracker.desc=Duellantens nästa vanliga närstridsattack får bonus i träffsäkerhet.\n\nÅterstående turer: %s.
actors.hero.talent$deadlyfollowuptracker.name=dödlig uppföljning
actors.hero.talent$deadlyfollowuptracker.desc=Duellanten har nyligen attackerat en fiende med ett kastvapen, hennes närstridsattacker mot samma mål kommer att få ökad skada.\n\nÅterstående turer: %s.
actors.hero.talent$combinedlethalityabilitytracker.executed=executed
actors.hero.talent$satiatedspellstracker.name=Skyddande besvärjelse
actors.hero.talent$satiatedspellstracker.desc=Nästa besvärjelse som prästen kastar ger dem en liten sköld.
actors.hero.talent$searinglightcooldown.name=Searing Light
actors.hero.talent$searinglightcooldown.desc=Du har nyligen använt denna talang och måste vänta innan du kan använda den igen.\n\nÅterstående turer: %s.

#warrior
actors.hero.talent.hearty_meal.title=mättande måltid
actors.hero.talent.hearty_meal.desc=_+1:_ Att äta mat läker krigaren med _4 HP_ när han har 33 % eller mindre HP kvar.\n\n_+2:_ Att äta mat läker krigaren med _6 HP_ när han har 33 % eller mindre HP kvar.
actors.hero.talent.veterans_intuition.title=veteranens intuition
actors.hero.talent.veterans_intuition.desc=_+1:_ Krigaren identifierar vapen _1,75 gånger snabbare_ och rustningar _2,5 gånger snabbare_.\n\n_+2:_ Krigaren identifierar vapen _2,5 gånger snabbare_ och rustningar _när han utrustar sig med dem_.
actors.hero.talent.provoked_anger.title=provoked anger
actors.hero.talent.provoked_anger.desc=_+1:_ När en sköldbuff som applicerats på krigaren bryts av skada, kommer hans nästa fysiska attack att göra _3 bonusskada_.\n\n_+2:_ När en sköldbuff som applicerats på krigaren bryts av skada, kommer hans nästa fysiska attack att göra _5 bonusskada_.
actors.hero.talent.iron_will.title=vilja av stål
actors.hero.talent.iron_will.desc=_+1:_ Skölden som krigarens sigill ger _ökas med 1_.\n\n_+2:_ Skölden som krigarens sigill ger _ökas med 2_.
actors.hero.talent.iron_will.meta_desc=_Om denna talang erhålls av en annan hjälte_ kommer den passivt att ge en 1 eller 2 max sköldversion av krigarens trasiga sigilleffekt.

actors.hero.talent.iron_stomach.title=järnmage
actors.hero.talent.iron_stomach.desc=_+1:_ Att äta mat tar krigarens 1 tur och ger honom _75% skaderesistens_ vid ätande.\n\n_+2:_ Att äta mat tar krigarens 1 tur och ger honom _100% skaderesistens_ vid ätande.
actors.hero.talent.liquid_willpower.title=flytande viljestyrka
actors.hero.talent.liquid_willpower.desc=_+1:_ Krigaren får _6,5% av sin maximala HP i sköld_ när han dricker eller kastar en dryck, brygd eller elixir.\n\n_+2:_ Krigaren får _10% av sin maximala HP i sköld_ när han dricker eller kastar en dryck, brygd eller elixir.\n\nSköldens värde fördubblas när du använder styrkedrycker, erfarenhetsdrycker eller alkemiprodukter som måste tillverkas med hjälp av dessa drycker.\n\nFör alkemiprodukter med högre utgångsmängd (t.ex. vattenbrygd) har denna talang en chans att aktiveras beroende på hur många av den produkten som tillverkas.
actors.hero.talent.runic_transference.title=runöverföring
actors.hero.talent.runic_transference.desc=_+1:_ Krigarens brutna sigill kan överföra _vanliga glyfer_ på samma sätt som det överför en uppgradering.\n\n_+2:_ Krigarens brutna sigill kan överföra _vanliga, kraftfulla och förbannade glyfer_ på samma sätt som det överför en uppgradering.\n\nSigillet kan endast överföra glyfer om de var applicerade på rustningen när sigillet fästes.
actors.hero.talent.runic_transference.meta_desc=_Om denna talang erhålls av en annan hjälte_ kommer den istället att hjälpa glyfer på din rustning att motstå att tas bort av uppgraderingsrullar. Glyfer börjar gå förlorade när du uppgraderar från nivå 6 (upp från 4) vid +1 eller nivå 7 (upp från 4) vid +2. Nivån där glyfer garanterat går förlorade är oförändrad vid +8.
actors.hero.talent.lethal_momentum.title=dödlig drivkraft
actors.hero.talent.lethal_momentum.desc=_+1:_ När krigaren landar ett dödande slag på en fiende med ett fysiskt vapen har den _67% chans_ att ta 0 turer.\n\n_+2:_ När krigaren landar ett dödande slag på en fiende med ett fysiskt vapen har den _100% chans_ att ta 0 turer.
actors.hero.talent.improvised_projectiles.title=improviserade projektiler
actors.hero.talent.improvised_projectiles.desc=_+1:_ Krigaren kan blända en fiende över _2 turer_ genom att kasta något föremål som inte är ett kastvapen mot dem. Detta har en 50 turers nedkylningsperiod.\n\n_+1:_ Krigaren kan blända en fiende över _3 turer_ genom att kasta något föremål som inte är ett kastvapen mot dem. Detta har en 50 turers nedkylningsperiod.

actors.hero.talent.hold_fast.title=hållfast
actors.hero.talent.hold_fast.desc=_+1:_ När krigaren väntar får han _1-2 rustning_ och saktar ned nedbrytningen av kombo- och sköldförstärkningar med _50%_ tills han rör sig.\n\n_+2:_ När krigaren väntar får han _2-4 rustning_ och saktar ned nedbrytningen av kombo- och sköldförstärkningar med _75%_ tills han rör sig.\n\n_+3:_ När krigaren väntar får han _3-6 rustning_ och saktar ner avklingningen av kombo- och sköldförstärkningar med _100%_ tills han rör sig.
actors.hero.talent.strongman.title=starkman
actors.hero.talent.strongman.desc=_+1:_ Krigarens styrka _ökas med 8 %_, avrundat nedåt.\n\n_+2:_ Krigarens styrka _ökas med 13 %_, avrundat nedåt.\n\n_+3:_ Krigarens styrka _ökas med 18 %_, avrundat nedåt.

actors.hero.talent.endless_rage.title=oändligt raseri
actors.hero.talent.endless_rage.desc=_+1:_ Berserkern kan nå maximalt _116 % raseri_.\n\n_+2:_ Berserkern kan nå maximalt _133 % raseri_.\n\n_+3:_ Berserkern kan nå maximalt _150% raseri_.\n\nVarje raseripunkt över 100% ökar berserkerskölden med 1 % och minskar nedkylningstiden med 1 %, men ökar inte skadebonusen över +50%.
actors.hero.talent.deathless_fury.title=dödslöst ursinne
actors.hero.talent.deathless_fury.desc=_+1:_ Berserk aktiveras automatiskt om Berserkern är på väg att dö och raseriet är på eller över 100%, men det har en nedkylningstid på _3 hjältenivåer_ när detta inträffar.\n\n_+2:_ Berserk aktiveras automatiskt om berserkern är på väg att dö och raseriet är 100% eller högre, men har en nedkylningstid på _2 hjältenivåer_ när detta inträffar.\n\n_+3:_ Berserk aktiveras automatiskt om berserkern är på väg att dö och raseriet är 100% eller högre, men har en nedkylningstid på _1 hjältenivå_ när detta inträffar.\n\nObservera att Berserkern fortfarande dör om han har 0 HP när berserking upphör.
actors.hero.talent.enraged_catalyst.title=förargad katalyst
actors.hero.talent.enraged_catalyst.desc=_+1:_ Förtrollningar och förbannelser på Berserkerns vapen utlöses oftare ju mer raseri han har, upp till maximalt _15% oftare_ vid 100% raseri.n\n_+2:_ Förtrollningar och förbannelser på berserkerns vapen utlöses oftare ju mer raseri han har, upp till maximalt _30% oftare_ vid 100% raseri.\n\n_+3:_ Förtrollningar och förbannelser på berserkerns vapen utlöses oftare ju mer raseri han har, upp till maximalt _45% oftare_ vid 100% raseri.

actors.hero.talent.cleave.title=klyva
actors.hero.talent.cleave.desc=_+1:_ Den extra tid som Gladiator får vid en död ökas till _30 turer_, från 15.\n\n_+2:_ Den extra tid som Gladiator får vid en död ökas till _45 turer_, från 15.\n\n_+3:_ Den extra tid som Gladiator får vid en död ökas till _60 turer_, från 15.
actors.hero.talent.lethal_defense.title=dödligt försvar
actors.hero.talent.lethal_defense.desc=_+1:_ När Gladiator dödar en fiende med en kombination, minskas nedkylningstiden för hans brutna sigillskydd med 50 turer.\n\n_+2:_ När Gladiator dödar en fiende med en kombination, minskas nedkylningstiden för hans brutna sigillskydd med 100 turer.\n\n_+3:_ När Gladiatorn dödar en fiende med en kombination, minskas nedkylningstiden för hans brutna sigillskydd med 150 turer.\n\nNedkylningstiden för skölden kan minskas till så lågt som -150 turer med denna talang, vilket innebär att den omedelbart blir tillgänglig igen när den aktiveras.
actors.hero.talent.enhanced_combo.title=utökad kombination
actors.hero.talent.enhanced_combo.desc=_+1:_ När gladiatorns kombination är 7 eller högre ökar Clobbars knockback-räckvidd till 3, den orsakar yrsel och kan slå fiender i gropar.\n\n_+2:_ Utöver fördelarna med +1 fungerar Parry på flera attacker när Gladiatorns kombo är 9 eller högre.\n\n_+3:_ Utöver fördelarna med +1 och +2 kan Gladiator hoppa upp till kombo/3 rutor när han använder Slam, Crush eller Fury.

actors.hero.talent.body_slam.title=kropps smäll
actors.hero.talent.body_slam.desc=_+1:_ När krigaren landar efter ett hopp får alla fiender i närheten skada motsvarande _1-4 plus 25%_ av hans skadeblockeringskraft.\n\n_+2:_ När krigaren landar efter ett hopp får alla fiender i närheten skada motsvarande _2-8 plus 50%_ av hans skadeblockeringskraft.\n\n_+3:_ När krigaren landar efter ett hopp får alla fiender i närheten skada motsvarande _3-12 plus 75%_ av hans skadeblockeringskraft.\n\n_+4:_ När krigaren landar efter ett hopp får alla fiender i närheten skada motsvarande _4-16 plus 100%_ av hans skadeblockeringskraft.
actors.hero.talent.impact_wave.title=effektvåg
actors.hero.talent.impact_wave.desc=_+1:_ När Krigaren landar efter att ha hoppat knuffas alla angränsande fiender _2 rutor_ bakåt och har en _25% chans_ att bli sårbara i 5 turer.\n\n_+2:_ När Krigaren landar efter att ha hoppat knuffas alla angränsande fiender _3 rutor_ bakåt och har en _50% chans_ att bli sårbara i 5 turer.\n\n_+3:_ När krigaren landar efter att ha hoppat knuffas alla angränsande fiender _4 rutor_ bakåt och har en _75% chans_ att bli sårbara i 5 turer.\n\n_+4:_ När Krigaren landar efter att ha hoppat knuffas alla angränsande fiender _5 rutor_ bakåt och har en _100% chans_ att bli sårbara i 5 turer.
actors.hero.talent.double_jump.title=dubbelhopp
actors.hero.talent.double_jump.desc=_+1:_ Om krigaren utför ett andra hopp inom 3 turer har det hoppet en _16% minskad_ uppladdningskostnad.\n\n_+2:_ Om krigaren utför ett andra hopp inom 3 turer har det hoppet en _30% minskad_ uppladdningskostnad.\n\n_+3:_ Om krigaren utför ett andra hopp inom 3 turer har det hoppet en _40% minskad_ uppladdningskostnad.\n\n_+4:_ Om krigaren utför ett andra hopp inom 3 turer har det hoppet en _50% minskad_ uppladdningskostnad.

actors.hero.talent.expanding_wave.title=expanderande våg
actors.hero.talent.expanding_wave.desc=_+1:_ Shockwave's range is increased to _6 tiles_ from 5, and its width is increased to _75 degrees_ from 60.\n\n_+2:_ Shockwave's range is increased to _7 tiles_ from 5, and its width is increased to _90 degrees_ from 60.\n\n_+3:_ Chockvågens räckvidd ökar från 5 till _8 rutor_ och dess bredd ökar från 60 till _105 grader_. \n\n_+4:_ Chockvågens räckvidd ökar från 5 till _9 rutor_ och dess bredd ökar från 60 till _120 grader_.
actors.hero.talent.striking_wave.title=slagkraftig våg
actors.hero.talent.striking_wave.desc=_+1:_ Shockwave har _30% chans_ att även använda träffeffekter som förtrollningar och kombinationer.\n\n_+2:_ Shockwave har _60% chans_ att även använda träffeffekter som förtrollningar och kombinationer.\n\n_+3:_ Chockvåg har _90% chans_ att även använda träffeffekter som förtrollningar och kombinationer.\n\n_+4:_ Chockvåg har _100% chans_ att även använda träffeffekter som förtrollningar och kombinationer, och ger förtrollningar _+20% kraft_.
actors.hero.talent.shock_force.title=chockvåg
actors.hero.talent.shock_force.desc=_+1:_ Shockwave gör _20% mer skada_ och har _25% chans_ att bedöva istället för att förlama.\n\n_+2:_ Shockwave gör _40% mer skada_ och har _50% chans_ att bedöva istället för att förlama.\n\n_+3:_ Chockvåg orsakar _60% mer skada_ och har _75% chans_ att bedöva istället för att förlama.\n\n_+4:_ Chockvåg orsakar _80% mer skada_ och har _100% chans_ att bedöva istället för att förlama.

actors.hero.talent.sustained_retribution.title=sustained retribution
actors.hero.talent.sustained_retribution.desc=_+1:_ Krigaren gör _115% extra skada_ fördelat på _2 träffar_, istället för 100% extra skada i 1 träff.\n\n_+2:_ Krigaren gör _130% extra skada_ fördelat på _3 träffar_, istället för 100% extra skada i 1 träff.\n\n_+3:_ Krigaren gör _145% extra skada_ fördelat på _4 träffar_, istället för 100% extra skada i 1 träff.\n\n_+4:_ Krigaren gör _160% extra skada_ fördelat på _5 träffar_, istället för 100% extra skada i 1 träff.
actors.hero.talent.shrug_it_off.title=skaka av
actors.hero.talent.shrug_it_off.desc=_+1:_ Krigarens skadereduktion vid uthållighet _ökas till 60%_, från 50%.\n\n_+2:_ Krigarens skadereduktion vid uthållighet _ökas till 68%_, från 50%.\n\n_+3:_ Krigarens skadereduktion vid uthållighet _ökas till 74%_ från 50%.\n\n_+4:_ Krigarens skadereduktion vid uthållighet _ökas till 80%_ från 50%.
actors.hero.talent.even_the_odds.title=utjämna oddsen
actors.hero.talent.even_the_odds.desc=_+1:_ Krigaren gör ytterligare _5% bonusskada_ för varje fiende inom 2 rutor när uthålligheten upphör.\n\n_+2:_ Krigaren gör ytterligare _10% bonusskada_ för varje fiende inom 2 rutor när uthålligheten upphör.\n\n_+3:_ Krigaren gör ytterligare _15% bonusskada_ för varje fiende inom 2 rutor när uthålligheten upphör.\n\n_+4:_ Krigaren gör ytterligare _20% bonusskada_ för varje fiende inom 2 rutor när uthålligheten upphör.

#mage
actors.hero.talent.empowering_meal.title=förstärkande måltid
actors.hero.talent.empowering_meal.desc=_+1:_ Att äta mat ger Magikern _2 bonusskada_ de nästa 3 gångerna han gör skada med en trollstav.\n\n_+2:_ Att äta mat ger Magikern _3 bonusskada_ de nästa 3 gångerna han gör skada med en trollstav.
actors.hero.talent.scholars_intuition.title=den lärdes intuition
actors.hero.talent.scholars_intuition.desc=_+1:_ Magikern identifierar trollstavar _3x snabbare_.\n\n_+2:_ Magikern identifierar trollstavar _när han använder dem_.
actors.hero.talent.lingering_magic.title=kvarvarande magi
actors.hero.talent.lingering_magic.desc=_+1:_ När Magikern slår med en trollstav eller stav, gör hans nästa fysiska attack _1-2 bonusskada_.\n\n_+2:_ När Magikern slår med en trollstav eller stav, gör hans nästa fysiska attack _2 bonusskada_.
actors.hero.talent.backup_barrier.title=reservbarriär
actors.hero.talent.backup_barrier.desc=_+1:_ Magikern får _3 sköld_ varje gång han använder den sista laddningen i sin stav.\n\n_+2:_ Magikern får _5 sköld_ varje gång han använder den sista laddningen i sin stav.
actors.hero.talent.backup_barrier.meta_desc=_Om denna talang erhålls av en annan hjälte_ kommer den istället att aktiveras från hjälten med den högsta nivån på sin trollstav.

actors.hero.talent.energizing_meal.title=energigivande måltid
actors.hero.talent.energizing_meal.desc=_+1:_ Att äta mat tar 1 tur för Magikern och ger honom _5 turer för att ladda sin trollstav_.\n\n_+2:_ Att äta mat tar 1 tur för Magikern och ger honom _8 turer för att ladda sin trollstav_.
actors.hero.talent.inscribed_power.title=inskription
actors.hero.talent.inscribed_power.desc=_+1:_ När Magikern läser en skriftrulle eller använder ett trollformelsobjekt får hans _nästa 2 trollstavsslag_ +2 nivåer.\n\n_+2:_ När Magikern läser en skriftrulle eller använder ett trollformelsobjekt får hans _nästa 3 trollstavsslag_ +2 nivåer.\n\nAntalet förstärkta trollstavsslag fördubblas när du använder en uppgraderings-, transmutations- eller alkemiföremål som måste tillverkas med hjälp av dessa skriftrullar.\n\nFör alkemiföremål med högre utgångsmängder (t.ex. de flesta trollformler) har denna talang en chans att utlösas baserat på hur många av det föremålet som produceras.
actors.hero.talent.wand_preservation.title=stavbevarande
actors.hero.talent.wand_preservation.desc=_+1:_ När Magikern förlägger en ny trollstav i sin stav återfår han den gamla trollstaven med +0, _men detta kan endast göras en gång._\n\n_+2:_ När Magikern förlägger en ny trollstav i sin stav återfår han den gamla trollstaven med +0, _detta kan upprepas med en cooldown på en hjältenivå._
actors.hero.talent.wand_preservation.meta_desc=_Om denna talang erhålls av en annan hjälte_ kommer den istället att öka mängden arkan harts som erhålls när en trollstav placeras i en alkemikruka med 1 vid +1, eller med 2 vid +2.
actors.hero.talent.arcane_vision.title=magisk syn
actors.hero.talent.arcane_vision.desc=_+1:_ När Magikern träffar en fiende med en trollformel får han syn på fiendens tankar i _10 turer_.\n\n_+2:_ När Magikern träffar en fiende med en trollformel får han syn på fiendens tankar i _15 turer_.
actors.hero.talent.shield_battery.title=sköldsbatteri
actors.hero.talent.shield_battery.desc=_+1:_ Magikern kan rikta en trollstav mot sig själv för att omvandla alla sina laddningar till sköldar med en hastighet av _4 % max HP per laddning_.\n\n_+2:_ Magikern kan rikta en trollstav mot sig själv för att omvandla alla sina laddningar till sköldar med en hastighet av _6 % max HP per laddning_.

actors.hero.talent.desperate_power.title=desperat kraft
actors.hero.talent.desperate_power.desc=_+1:_ Magikerns trollstavar och stavar får _+1 nivå_ på sin sista zap när de är nere på sin sista laddning.\n\n_+2:_ Magikerns trollstavar och stavar får _+2 nivåer_ på sin sista zap när de är nere på sin sista laddning.\n\n_+3:_ Magikerns trollstavar och stavar får _+3 nivåer_ på sin sista zap när de är nere på sin sista laddning.
actors.hero.talent.ally_warp.title=ally warp
actors.hero.talent.ally_warp.desc=_+1:_ Magikern kan välja en allierad att omedelbart byta plats med, inom en _2 ruts radie_.\n\n_+2:_ Magikern kan välja en allierad att omedelbart byta plats med, inom en _4 ruts radie_.\n\n_+3:_ Magikern kan välja en allierad att omedelbart byta plats med, inom en _6 rutor_ radie.\n\nMagikern kan inte byta plats med orörliga allierade.

actors.hero.talent.empowered_strike.title=förstärkt slag
actors.hero.talent.empowered_strike.desc=_+1:_ Stridsmagikerns första närstridsattack med sin stav efter att ha använt den orsakar _+16 % skada_ och stavens bonuseffekt får _+50% kraft_.n\n_+2:_ Stridsmagikerns första närstridsattack med sin stav efter att ha använt den ger _+33 % skada_ och stavens bonuseffekt får _+100% kraft_.n\n_+3:_ Stridsmagikerns första närstridsattack med sin stav efter att ha använt den ger _+50% skada_ och stavens bonuseffekt får _+150% kraft_.
actors.hero.talent.mystical_charge.title=mystisk laddning
actors.hero.talent.mystical_charge.desc=_+1:_ Att slå med sin stav ger Stridsmagikern _0,5 turer_ i artefaktuppladdning.\n\n_+2:_ Att slå med sin stav ger Stridsmagikern _1 tur_ i artefaktuppladdning.\n\n_+3:_ Att slå med sin stav ger Stridsmagikern _1,5 turer_ värde av artefaktuppladdning.
actors.hero.talent.excess_charge.title=överbliven laddning
actors.hero.talent.excess_charge.desc=_+1:_ När Stridsmagikerns stav är fulladdad ger hans nästa zap honom _0,67 sköld_ per stavens nivå.n\n_+2:_ När Stridsmagikerns stav är fulladdad ger nästa stöt honom _1,33 sköld_ per stavens nivå.\n\n_+3:_ När Stridsmagikerns stav är fulladdad ger nästa stöt honom _2 sköld_ per stavens nivå.

actors.hero.talent.soul_siphon.title=själsutvinning
actors.hero.talent.soul_siphon.desc=_+1:_ Fysisk skada som andra karaktärer orsakar utlöser Häxmästarens själsmärke med _13 % effektivitet_.\n\n_+2:_ Fysisk skada som andra karaktärer orsakar utlöser Häxmästarens själsmärke med _27 % effektivitet_.n\n\n_+3:_ Fysisk skada som tillfogas av andra karaktärer aktiverar Häxmästarens själsmärke med _40% effektivitet_.
actors.hero.talent.soul_eater.title=själsslukare
actors.hero.talent.soul_eater.desc=_+1:_ Själsmärke ger _0,33 turer_ mättnad för varje fysisk skada som tillfogas. Fiender med själsmärke har _10% chans_ att utlösa effekter vid intag när de dör.\n\n_+2:_ Själsmärke ger _0,67 turer_ mättnad för varje fysisk skada som tillfogas. Själsmärkta fiender har _20% chans_ att utlösa effekter när de dör. \n\n_+3:_ Själsmärke ger _1 tur_ mättnad för varje fysisk skada som orsakas. Själsmärkta fiender har _30% chans_ att utlösa effekter när de dör.
actors.hero.talent.necromancers_minions.title=och besvärjares undersåtar
actors.hero.talent.necromancers_minions.desc=_+1:_ När en själsmärkt fiende dör har Häxmästaren _13 % chans_ att återuppväcka dem som en fördärvad vålnad.\n\n_+2:_ När en själsmärkt fiende dör har Häxmästaren _27 % chans_ att återuppväcka dem som en fördärvad vålnad.\n\n_+3:_ När en själsmärkt fiende dör har Häxmästaren _40% chans_ att återuppväcka dem som en fördärvad vålnad.

actors.hero.talent.blast_radius.title=sprängradie
actors.hero.talent.blast_radius.desc=_+1:_ Elemental blast's radius ökas till _5 rutor_, från 4.\n\n_+2:_ Elemental blast's radius ökas till _6 rutor_, från 4.n\n_+3:_ Elemental blast's radius ökas till _7 rutor_, från 4.\n\n_+4:_ Elemental blast's radius ökas till _8 rutor_, från 4.
actors.hero.talent.elemental_power.title=elementär kraft
actors.hero.talent.elemental_power.desc=_+1:_ Kraften av elementärt skott är _25%_ starkare.\n\n_+2:_ Kraften av elementärt skott är _50%_ starkare.\n\n_+3:_ Kraften av elementärt skott är _75%_ starkare.\n\n_+4:_ Kraften av elementärt skott är _100%_ starkare.
actors.hero.talent.reactive_barrier.title=reaktiv barriär
actors.hero.talent.reactive_barrier.desc=_+1:_ Magikern får _2,5 sköld_ för varje karaktär som påverkas av elementär explosion, upp till maximalt 5 karaktärer.\n\n_+2:_ Magikern får _5 sköld_ för varje karaktär som påverkas av elementär explosion, upp till maximalt 6 karaktärer.\n\n_+3:_ Magikern får _7,5 sköld_ för varje karaktär som påverkas av elemental blast, upp till maximalt 7 karaktärer.\n\n_+4:_ Magikern får _10 sköld_ för varje karaktär som påverkas av elemental blast, upp till maximalt 8 karaktärer.

actors.hero.talent.wild_power.title=vild kraft
actors.hero.talent.wild_power.desc=_+1:_ När vild magi används förstärks trollstavar med antingen _2 eller 3, upp till +4_.n\n_+2:_ När vild magi används förstärks trollstavar med _3, upp till +5_.\n\n_+3:_ När vild magi används förstärks trollstavar med antingen _3 eller 4, upp till +6_.\n\n_+4:_ När vild magi används förstärks trollstavar med _4, upp till +7_.
actors.hero.talent.fire_everything.title=skjut allt
actors.hero.talent.fire_everything.desc=_+1:_ Vild magi avfyras nu _5 gånger_ istället för 4, och varje trollstav har _25% chans_ att kunna användas 3 gånger.\n\n_+2:_ Vild magi avfyras nu _6 gånger_ istället för 4, och varje trollstav har _50% chans_ att kunna användas 3 gånger.\n\n_+3:_ Vild magi avfyras nu _7 gånger_ istället för 4, och varje trollstav har _75% chans_ att kunna användas 3 gånger.\n\n_+4:_ Vild magi avfyras nu _8 gånger_ istället för 4, och varje trollstav har _100% chans_ att kunna användas 3 gånger.
actors.hero.talent.conserved_magic.title=konserverad magi
actors.hero.talent.conserved_magic.desc=_+1:_ Varje zap från vild magi använder nu _0,33 laddningar_ istället för 0,5, och vild magi har _25% chans_ att inte använda en tur.n\n_+2:_ Varje zap från vild magi använder nu _0,225 laddningar_ istället för 0,5, och vild magi har _50% chans_ att inte använda en tur.\n\n_+3:_ Varje zap från vild magi använder nu _0,15 laddningar_ istället för 0,5, och vild magi har _75% chans_ att inte använda en tur.\n\n_+4:_ Varje zap från vild magi använder nu _0,1 laddningar_ istället för 0,5, och vild magi har _100% chans_ att inte spendera en tur.

actors.hero.talent.telefrag.title=Telefrag
actors.hero.talent.telefrag.desc=_+1:_ Om Magikern teleporterar sig till en annan karaktär gör han _10-15 skada_ på den, men tar också _5 skada_.\n\n_+2:_ Om Magikern teleporterar sig till en annan karaktär gör han _20-30 skada_ på den, men tar också _10 skada_.\n\n_+3:_ Om Magikern teleporterar sig till en annan karaktär, gör han _30-45 skada_ på den, men tar också _15 skada_.\n\n_+4:_ Om Magikern teleporterar sig till en annan karaktär, gör han _40-60 skada_ på den, men tar också _20 skada_.\n\nHjälten kan inte dödas av denna talang, självskadan kan reduceras av magiresistenta effekter.
actors.hero.talent.remote_beacon.title=Fjärrbeacon
actors.hero.talent.remote_beacon.desc=_+1:_ Magikern kan placera en fyr på valfri plats inom _4 rutor_.\n\n_+2:_ Magikern kan placera en fyr på valfri plats inom _8 rutor_.\n\n_+3:_ Magikern kan placera en fyr på valfri plats inom _12 rutor_.\n\n_+4:_ Magikern kan placera en fyr på valfri plats inom _16 rutor_.\n\nMagikern kan inte placera fyrar på platser som är otillgängliga.
actors.hero.talent.longrange_warp.title=Långdistansförflyttning
actors.hero.talent.longrange_warp.desc=_+1:_ Magikern kan nu förflytta sig mellan våningar, till en kostnad av _150% laddning_.\n\n_+2:_ Magikern kan nu förflytta sig mellan våningar, till en kostnad av _117 % laddning_.\n\n_+3:_ Magikern kan nu förflytta sig mellan våningar, till en kostnad av _83 % laddning_.\n\n_+4:_ Magikern kan nu förflytta sig mellan våningar, till en kostnad av _50% laddning_.\n\nMagikern kan inte använda långdistansförflyttning för att lämna en låst våning.

#rogue
actors.hero.talent.cached_rations.title=undangömda ransoner
actors.hero.talent.cached_rations.desc=_+1:_ Skurken kan hitta _2 proviantransoner_ placerade i kistor vid utforskning av de närmaste våningarna i fängelsehålan.\n\n_+2:_ Skurken kan hitta _3 proviantransoner_ placerade i kistor vid utforskning av de närmaste våningarna i fängelsehålan.\n\nFörrådsransoner äts snabbt, återställer en måttlig mättnadskänsla, läker 5 hp och återställer 1 laddning till skuggmanteln.
actors.hero.talent.thiefs_intuition.title=tjuvs intuition
actors.hero.talent.thiefs_intuition.desc=_+1:_ Skurken identifierar ringar _2x snabbare_ och identifierar typen av ring _när han sätter på den_.\n\n_+2:_ Skurken identifierar ringar _när han sätter på dem_ och identifierar typen av ring _när han plockar upp den_.
actors.hero.talent.sucker_punch.title=sucker punch
actors.hero.talent.sucker_punch.desc=_+1:_ Skurken gör _1-2 extra skada_ första gången han överraskar en fiende med en attack.\n\n_+2:_ Skurken gör _2 extra skada_ första gången han överraskar en fiende med en attack.
actors.hero.talent.protective_shadows.title=beskyddande skuggor
actors.hero.talent.protective_shadows.desc=_+1:_ Skurken får ett skydd _varannan tur_ han är osynlig, _upp till maximalt 3_.\n\n_+2:_ Skurken får ett skydd _varje tur_ han är osynlig, _upp till maximalt 5_.

actors.hero.talent.mystical_meal.title=mystisk måltid
actors.hero.talent.mystical_meal.desc=_+1:_ Att äta mat tar 1 tur för Skurken (proviant ransoneras omedelbart) och ger honom _3 turer av artefaktuppladdning_.\n\n_+2:_ Att äta mat tar 1 tur för Skurken (proviant ransoneras omedelbart) och ger honom _5 turer av artefaktuppladdning_.\n\nDenna talang kan inte användas för att låta hornet av överflöd ladda sig själv.
actors.hero.talent.inscribed_stealth.title=inscribed smygande
actors.hero.talent.inscribed_stealth.desc=_+1:_ Skurken får _3 turer_ av osynlighet efter att ha läst en skriftrulle eller använt ett trollformelsobjekt.\n\n_+2:_ Skurken får _5 turer_ av osynlighet efter att ha läst en skriftrulle eller använt ett trollformelsobjekt.\n\nOsynlighetsvaraktigheten fördubblas när du använder en uppgraderingsrulle, transmutationsrulle eller alkemiföremål som måste tillverkas med hjälp av dessa rullar.\n\nFör alkemiföremål med högre utgångsmängder (t.ex. de flesta trollformler) har denna talang en chans att utlösas baserat på hur många av det föremålet som produceras.
actors.hero.talent.wide_search.title=brett sökande
actors.hero.talent.wide_search.desc=_+1:_ Skurkens sökningsradie ökar från en 5x5-ruta till en _7x7-cirkel_.
actors.hero.talent.wide_search.meta_desc=_Om denna talang erhålls av en annan hjälte_ kommer den istället att öka deras sökområde från en 3x3 kvadrat till en 5x5 cirkel vid +1, eller en 5x5 kvadrat vid +2.
actors.hero.talent.silent_steps.title=tysta fotsteg
actors.hero.talent.silent_steps.desc=_+1:_ Skurken väcker inte sovande fiender vid _3 eller fler rutor från dem_.\n\n_+2:_ Skurken väcker inte sovande fiender när han _inte är intill dem_.
actors.hero.talent.rogues_foresight.title=skurkens framsynthet
actors.hero.talent.rogues_foresight.desc=_+1:_ När Skurken befinner sig på en nivå med ett hemligt rum har han _75% chans att upptäcka_ att nivån innehåller en hemlighet.\n\n_+2:_ När Skurken befinner sig på en nivå med ett hemligt rum har han _100% chans att upptäcka_ att nivån innehåller en hemlighet.

actors.hero.talent.light_cloak.title=lätt mantel
actors.hero.talent.light_cloak.desc=_+1:_ Skurken kan använda sin skuggmantel när den inte är utrustad, men den laddas upp med _25% hastighet_ när den inte är utrustad.\n\n_+2:_ Skurken kan använda sin skuggmantel när den inte är utrustad, men den laddas upp med _50% hastighet_ när den inte är utrustad.\n\n_+3:_ Skurken kan använda sin skuggmantel när den inte är utrustad, men den laddas upp med _75% hastighet_ när den inte är utrustad.
actors.hero.talent.light_cloak.meta_desc=_Om denna talang erhålls av en annan hjälte_ kommer den istället att öka laddningshastigheten för alla artefakter med 7/13/20% vid +1/+2/+3.
actors.hero.talent.enhanced_rings.title=förstärkta ringar
actors.hero.talent.enhanced_rings.desc=_+1:_ När Skurken använder en artefakt får hans ringar +1 uppgradering i _3 turer_.\n\n_+2:_ När Skurken använder en artefakt får hans ringar +1 uppgradering i _6 turer_.\n\n_+3:_ När Skurken använder en artefakt får hans ringar +1 uppgradering i _9 turer_.

actors.hero.talent.enhanced_lethality.title=förstärkt dödlighet
actors.hero.talent.enhanced_lethality.desc=_+1:_ Lönnmördaren kan mörda fiender som har mindre än _4/13/27/67% hälsa_ per förberedelsegrad, upp från 3/10/20/50%.\n\n_+2:_ Lönnmördaren kan mörda fiender som har mindre än _5/17/33/83 % hälsa_ per förberedelsegrad, upp från 3/10/20/50%.\n\n_+3:_ Lönnmördaren kan mörda fiender som har mindre än _6/20/40/100% hälsa_ per förberedelsegrad, upp från 3/10/20/50%.
actors.hero.talent.assassins_reach.title=lönnmördarens räckvidd
actors.hero.talent.assassins_reach.desc=_+1:_ Lönnmördarens blinkningsräckvidd per förberedelsegrad ökas till _1/3/4/6 rutor_, från 1/2/3/4.\n\n_+2:_ Lönnmördarens blinkningsräckvidd per förberedelsegrad ökas till _2/4/6/8 rutor_, från 1/2/3/4.\n\n_+3:_ Lönnmördarens blinkningsräckvidd per förberedelsegrad ökas till _2/5/7/10 rutor_, från 1/2/3/4.\n\nDenna blinkning kan passera faror och fiender, men inte genom fast terräng som väggar.
actors.hero.talent.bounty_hunter.title=bounty hunter
actors.hero.talent.bounty_hunter.desc=_+1:_ När Lönnmördaren dödar en fiende med ett förberett slag ökar deras chans att tappa föremål med _2/4/8/16 %_ per förberedelsegrad.\n\n_+2:_ När Lönnmördaren dödar en fiende med ett förberett slag ökar deras chans att tappa föremål med _4/8/16/32 %_ per förberedelsegrad.\n\n_+3:_ När Lönnmördaren dödar en fiende med ett förberett slag ökar deras chans att tappa föremål med _6/12/24/48 %_ per förberedelsegrad.

actors.hero.talent.evasive_armor.title=undvikande rustning
actors.hero.talent.evasive_armor.desc=_+1:_ Vid frilöpning får Frilöparen ytterligare _+1 undvikande_ per överskott av styrka på sin rustning.\n\n_+2:_ Vid frilöpning får Frilöparen ytterligare _+2 undvikande_ per överskott av styrka på sin rustning.\n\n_+3:_ Vid frilöpning får Frilöparen ytterligare _+3 undvikande_ per överskjutande styrkepunkt på sin rustning.
actors.hero.talent.projectile_momentum.title=projektilmomentum
actors.hero.talent.projectile_momentum.desc=_+1:_ Under frilöpning får Frilöparen _+50% träffsäkerhet och +15% skada_ med kastvapen.\n\n_+2:_ Under frilöpning får Frilöparen _+100% träffsäkerhet och +30% skada_ med kastvapen.\n\n_+3:_ Under frilöparen får Frilöparen _+150% träffsäkerhet och +45% skada_ med kastvapen.
actors.hero.talent.speedy_stealth.title=snabbt smygande
actors.hero.talent.speedy_stealth.desc=_+1:_ Frilöparen får 2 momentum per tur vid osynlighet.\n\n_+2:_ Utöver fördelarna med +1 räknas inte längre frilöpning ned vid osynlighet.\n\n_+3:_ Utöver fördelarna med +1 och +2 rör sig frilöparen med 2x hastighet när han är osynlig, oavsett om han frilöper eller inte.

actors.hero.talent.hasty_retreat.title=hastad reträtt
actors.hero.talent.hasty_retreat.desc=_+1:_ Efter att ha blinkat får Skurken _1 tur_ med hastighet och osynlighet.n\n\n_+2:_ Efter att ha blinkat får Skurken _2 turer_ av hastighet och osynlighet.\n\n_+3:_ Efter att ha blinkat får Skurken _3 turer_ av hastighet och osynlighet.\n\n_+4:_ Efter att ha blinkat får Skurken _4 turer_ av hastighet och osynlighet.
actors.hero.talent.body_replacement.title=kroppsersättning
actors.hero.talent.body_replacement.desc=_+1:_ Efter att ha blinkat lämnar Skurken en träattrapp efter sig som har _20 hälsa och 1-3 rustning_.\n\n_+2:_ Efter att ha blinkat lämnar Skurken en träattrapp efter sig som har _40 hälsa och 2-6 rustning_.\n\n_+3:_ Efter att ha blinkat lämnar Skurken en träattrapp efter sig som har _60 hälsa och 3-9 rustning_.\n\n_+4:_ Efter att ha blinkat lämnar Skurken en träattrapp efter sig som har _80 hälsa och 4-12 rustning_.\n\nEndast en attrapp kan vara aktiv åt gången.
actors.hero.talent.shadow_step.title=skuggsteg
actors.hero.talent.shadow_step.desc=_+1:_ Om Skurken använder rökbomb medan han är osynlig, inträffar den omedelbart och har en _16 % reducerad_ laddningskostnad, men den bländar inte heller fiender eller utlöser andra talanger.\n\n_+2:_ Om Skurken använder rökbomb vid osynlighet, utlöses den omedelbart och har en _30% reducerad_ laddningskostnad, men den bländar inte fiender och utlöser inte andra talanger.\n\n_+3:_ Om Skurken använder rökbomb vid osynlighet, utlöses den omedelbart och har en _41 % reducerad_ laddningskostnad, men den bländar inte fiender och utlöser inte andra talanger.\n\n_+4:_ Om Skurken använder rökbomb vid osynlighet, aktiveras den omedelbart och har en _50% reducerad_ laddningskostnad, men den förblindar inte fiender och utlöser inte andra talanger.

actors.hero.talent.fear_the_reaper.title=frukta skördemannen
actors.hero.talent.fear_the_reaper.desc=_+1:_ När en dödsmärkt fiende når 0 hp blir de _förlamade_.\n\n_+2:_ När en dödsmärkt fiende når 0 hp blir de _rädda och förlamade_.\n\n_+3:_ När en dödsmärkt fiende når 0 hp blir de _fruktade och förlamade_ och fiender inom 3 rutor blir _förlamade_.\n\n_+4:_ När en dödsmärkt fiende når 0 hp blir de _fruktade och förlamade_ och fiender inom 3 rutor blir _fruktade och förlamade_.
actors.hero.talent.deathly_durability.title=dödlig slitstyrka
actors.hero.talent.deathly_durability.desc=_+1:_ Fiender som dödas av dödstecken ger Skurken en sköld som motsvarar _13 %_ av deras hp när de var märkta.\n\n_+2:_ Fiender som dödas av dödstecken ger Skurken en sköld som motsvarar _25%_ av deras hp när de var märkta.\n\n_+3:_ Fiender som dödas av dödsmärket ger Skurken en sköld som motsvarar _38%_ av deras hp när de var märkta.\n\n_+4:_ Fiender som dödas av dödsmärket ger Skurken en sköld som motsvarar _50%_ av deras hp när de var märkta.
actors.hero.talent.double_mark.title=dubbelt märkt
actors.hero.talent.double_mark.desc=_+1:_ Att markera ett andra mål samtidigt som det första har en _30% reducerad_ laddningskostnad.\n\n_+2:_ Att markera ett andra mål samtidigt som det första har en _50% reducerad_ laddningskostnad.\n\n_+3:_ Att markera ett andra mål samtidigt som det första har en _65% reducerad_ laddningskostnad.\n\n_+4:_ Att markera ett andra mål samtidigt som det första har en _75% reducerad_ laddningskostnad.

actors.hero.talent.shadow_blade.title=skuggklinga
actors.hero.talent.shadow_blade.desc=_+1:_ Skuggklonen får _8%_ av hjältens skada per tur och har _25% chans_ att använda förtrollningen på hjältens vapen.\n\n_+2:_ Skuggklonen får _16 %_ av hjältens skada per tur och har _50% chans_ att använda förtrollningen på hjältens vapen.\n\n_+3:_ Skuggklonen får _24 %_ av hjältens skada per tur och har _75% chans_ att använda förtrollningen på hjältens vapen.\n\n_+4:_ Skuggklonen får _32 %_ av hjältens skada per tur och har _100% chans_ att använda förtrollningen på hjältens vapen.
actors.hero.talent.cloned_armor.title=klonad rustning
actors.hero.talent.cloned_armor.desc=_+1:_ Skuggklonen får _12 %_ av hjältens rustningsvärde och har _25% chans_ att använda glyfen på hjältens rustning.\n\n_+2:_ Skuggklonen får _24 %_ av hjältens rustningsvärde och har _50% chans_ att använda glyfen på hjältens rustning.\n\n_+3:_ Skuggklonen får _36 %_ av hjältens rustningsvärde och har _75% chans_ att använda glyfen på hjältens rustning.\n\n_+4:_ Skuggklonen får _48%_ av hjältens rustningsvärde och har _100% chans_ att använda glyfen på hjältens rustning.
actors.hero.talent.perfect_copy.title=perfekt kopia
actors.hero.talent.perfect_copy.desc=_+1:_ Skuggklonen får _10%_ av hjältens max-HP och kan omedelbart byta plats med hjälten upp till _1 ruta_ bort.\n\n_+2:_ Skuggklonen får _20%_ av hjältens max-HP och kan omedelbart byta plats med hjälten upp till _2 rutor_ bort.\n\n_+3:_ Skuggklonen får _30%_ av hjältens max-HP och kan omedelbart byta plats med hjälten upp till _3 rutor_ bort.\n\n_+4:_ Skuggklonen får _40%_ av hjältens max-HP och kan omedelbart byta plats med hjälten upp till _4 rutor_ bort.

#huntress
actors.hero.talent.natures_bounty.title=naturens gåvor
actors.hero.talent.natures_bounty.desc=_+1:_ Jägaren kan hitta _4 bär_ gömda i högt gräs när hon utforskar de nästa våningarna i fängelsehålan.\n\n_+2:_ Jägaren kan hitta _6 bär_ gömda i högt gräs när hon utforskar de nästa våningarna i fängelsehålan.\n\nBär äts snabbt, återställer en liten del av mättnadskänslan och kan innehålla användbara frön.
actors.hero.talent.survivalists_intuition.title=överlevnadssinn
actors.hero.talent.survivalists_intuition.desc=_+1:_ Jägaren identifierar kastvapen _3x snabbare_.\n\n_+2:_ Jägaren identifierar kastvapen _när hon träffar med dem_.
actors.hero.talent.followup_strike.title=uppföljande slag
actors.hero.talent.followup_strike.desc=_+1:_ När Jägaren träffar en fiende med sitt båge eller ett kastvapen, ger hennes nästa närstridsattack mot den fienden _2 bonusskada_.\n\n_+2:_ När Jägaren träffar en fiende med sitt båge eller ett kastvapen, ger hennes nästa närstridsattack mot den fienden _3 bonusskada_.
actors.hero.talent.natures_aid.title=naturens hjälp
actors.hero.talent.natures_aid.desc=_+1:_ Jägaren får 0-2 rustning av barkhud, som försvinner var _3 turer_ när en växts effekt aktiveras inom hennes synfält.\n\n_+2:_ Jägaren får 0-2 rustning av barkhud, som försvinner var _5 turer_ när en växts effekt aktiveras inom hennes synfält.

actors.hero.talent.invigorating_meal.title=uppfriskande måltid
actors.hero.talent.invigorating_meal.desc=_+1:_ Att äta mat tar 1 tur för Jägaren (bär äts direkt) och ger henne _1 tur med hastighet_.\n\n_+2:_ Att äta mat tar 1 tur för Jägaren (bär äts direkt) och ger henne _2 turer med hastighet_.
actors.hero.talent.liquid_nature.title=flytande natur
actors.hero.talent.liquid_nature.desc=_+1:_ När Jägaren dricker eller kastar en dryck, brygd eller elixir, växer _upp till 4 gräsplattor_ i omgivningen och närliggande fiender blir rotade i _1 tur_.n\n_+2:_ När Jägaren dricker eller kastar en dryck, brygd eller elixir, växer _upp till 6 gräsplattor_ i omgivningen och närliggande fiender blir fastrotade i _2 turer_.\n\nMängden gräs och rotningens varaktighet fördubblas när du använder styrkedrycker, erfarenhetsdrycker eller alkemiprodukter som måste tillverkas med hjälp av dessa drycker.\n\nFör alkemiföremål med högre utgångsmängd (t.ex. vattenbrygd) har denna talang en chans att utlösas baserat på hur många av det föremålet som produceras.
actors.hero.talent.rejuvenating_steps.title=återhämtande fotsteg
actors.hero.talent.rejuvenating_steps.desc=_+1:_ När Jägaren trampar på kort gräs eller glödande kol, reser det sig till högt gräs som Jägaren omedelbart plöjer. Detta har en nedkylningstid på _10 turer_.\n\n_+2:_ När Jägaren trampar på kort gräs eller glödande kol, reser det sig till högt gräs som Jägaren omedelbart plöjer upp. Detta har en nedkylningstid på _5 turer_.\n\nDenna talang producerar uppplöjt gräs om passiva regenereringseffekter är inaktiverade eller om hjälten inte har fått erfarenhet på länge.
actors.hero.talent.heightened_senses.title=förhöjda sinnen
actors.hero.talent.heightened_senses.desc=_+1:_ Jägaren får syn på karaktärer inom _2 rutor från sin position_.\n\n_+2:_ Jägaren får syn på karaktärer inom _3 rutor från sin position_.
actors.hero.talent.durable_projectiles.title=slitstarka projektiler
actors.hero.talent.durable_projectiles.desc=_+1:_ Kastvapen har _+50% hållbarhet_ när de används av Huntress.\n\n_+2:_ Kastvapen har _+75% hållbarhet_ när de används av Huntress.

actors.hero.talent.point_blank.title=på nära håll
actors.hero.talent.point_blank.desc=_+1:_ När Jägaren använder sin båge eller ett kastvapen på nära håll har det _-25% träffsäkerhet_ istället för -50%.\n\n_+2:_ När Jägaren använder sin båge eller ett kastvapen på nära håll har det _normal träffsäkerhet_ istället för -50%.\n\n_+3:_ När Jägaren använder sin båge eller ett kastvapen på nära håll har det _+25% träffsäkerhet_ istället för -50%.\n\nObservera att kastvapen eller andebågen alltid har +50% träffsäkerhet när de används på avstånd.
actors.hero.talent.seer_shot.title=seende skott
actors.hero.talent.seer_shot.desc=_+1:_ När Jägaren skjuter en pil mot marken ger den syn i ett 3x3-område runt den i _5 turer_. Detta har en nedkylningstid på 20 turer.\n\n_+2:_ När Jägaren skjuter en pil mot marken ger den syn i ett 3x3-område runt den i _10 turer_. Detta har en nedkylningstid på 20 turer.\n\n_+3:_ När Jägaren skjuter en pil mot marken ger den syn i ett område på 3x3 runt den i _15 turer_. Detta har en nedkylningstid på 20 turer.
actors.hero.talent.seer_shot.meta_desc=_Om denna talang erhålls av en annan hjälte_ aktiveras den av alla kastvapen.

actors.hero.talent.farsight.title=långsikt
actors.hero.talent.farsight.desc=_+1:_ Sniperens synfält _ökas med 25%_.\n\n_+2:_ Sniperens synfält _ökas med 50%_.\n\n_+3:_ Sniperens synfält _ökas med 75%_.
actors.hero.talent.shared_enchantment.title=delad förtrollning
actors.hero.talent.shared_enchantment.desc=_+1:_ Kastvapen har en _33 % chans_ att använda förtrollningen på prickskyttens båge.\n\n_+2:_ Kastvapen har en _67% chans_ att använda förtrollningen på prickskyttens båge.\n\n_+3:_ Kastvapen har _100% chans_ att använda förtrollningen på prickskyttens båge.\n\nBågens förtrollning kan utlösas utöver den förtrollning som kastvapnet redan har.
actors.hero.talent.shared_upgrades.title=delade uppgraderingar
actors.hero.talent.shared_upgrades.desc=_+1:_ När prickskytten attackerar med ett uppgraderat kastvapen ökar varje nivå varaktigheten för prickskyttens märke med 1 tur och skadan från hennes specialattack med 16 %, upp till maximalt _2 turer och +33 % skada vid +2_.\n\n_+2:_ När prickskytten attackerar med ett uppgraderat kastvapen ökar varje nivå varaktigheten för prickskyttens märke med 1 tur och skadan från hennes specialattack med 16 %, upp till maximalt _4 turer och +67% skada vid +4_.\n\n_+3:_ När prickskytten attackerar med ett uppgraderat kastvapen ökar varje nivå prickskyttens märkes varaktighet med 1 tur och skadan från hennes specialattack med 16 %, upp till max _6 turer och +100% skada vid +6_.

actors.hero.talent.durable_tips.title=slitstarka spetsar
actors.hero.talent.durable_tips.desc=_+1:_ Dartpilar med spets har _2x hållbarhet_ när Warden använder dem.\n\n_+2:_ Dartpilar med spets har _3x hållbarhet_ när Warden använder dem.\n\n_+3:_ Dartpilar med spets har _4x hållbarhet_ när Warden använder dem.
actors.hero.talent.barkskin.title=barkhud
actors.hero.talent.barkskin.desc=_+1:_ När Warden går på gräs får hon _0-50% av sin nivå_ i barkhudspansar som försvinner varje tur.\n\n_+2:_ När Warden går i gräs får hon _0-100% av sin nivå_ i barkhudspansar som försvinner varje tur.\n\n_+3:_ När Warden går i gräs får hon _0-150% av sin nivå_ i barkhudspansar som försvinner varje tur.
actors.hero.talent.shielding_dew.title=beskyddande dagg
actors.hero.talent.shielding_dew.desc=_+1:_ Dagdroppar kan skydda Warden när hennes HP är full, upp till _20% av hennes max HP_.n\n_+3:_ Dagdroppar kan skydda Warden när hennes HP är full, upp till _60% av hennes max HP_.

actors.hero.talent.fan_of_blades.title=fläkt av klingor
actors.hero.talent.fan_of_blades.desc=_+1:_ Spektrala blad kan träffa upp till _1 ytterligare mål_ för 50% skada. Målet måste vara synligt och inom en _30 graders_ konformad AOE.\n\n_+2:_ Spektrala blad kan träffa upp till _2 ytterligare mål_ för 50% skada. Målen måste vara synliga och inom en _60 graders_ konformad AOE.\n\n_+3:_ Spektrala blad kan träffa upp till _3 ytterligare mål_ för 50% skada. Målen måste vara synliga och befinna sig inom en _90 graders_ konformig AOE. \n\n_+4:_ Spektrala blad kan träffa upp till _4 ytterligare mål_ för 50% skada. Målen måste vara synliga och befinna sig inom en _120 graders_ konformig AOE.
actors.hero.talent.projecting_blades.title=framskjutande klingor
actors.hero.talent.projecting_blades.desc=_+1:_ Spektrala blad har _+25% träffsäkerhet_ och kan tränga igenom upp till _2 solida rutor_.\n\n_+2:_ Spektrala blad har _+50% träffsäkerhet_ och kan tränga igenom upp till _4 solida rutor_.\n\n_+3:_ Spektrala blad har _+75% träffsäkerhet_ och kan tränga igenom upp till _6 solida rutor_.\n\n_+4:_ Spektrala blad har _+100% träffsäkerhet_ och kan tränga igenom upp till _8 solida rutor_.
actors.hero.talent.spirit_blades.title=spirit blades
actors.hero.talent.spirit_blades.desc=_+1:_ Spektralblad har _30% chans_ att även använda förtrollningen på andebågen.\n\n_+2:_ Spektralblad har _60% chans_ att även använda förtrollningen på andebågen.\n\n_+3:_ Spektralblad har _90% chans_ att även använda förtrollningen på andebågen.\n\n_+4:_ Spektralblad har _100% chans_ att även använda förtrollningen på andebågen, och den ger varje förtrollning _+10% kraft_.

actors.hero.talent.growing_power.title=växande kraft
actors.hero.talent.growing_power.desc=_+1:_ Attack- och rörelsehastighetsförstärkningarna från naturens kraft ökas till _38% och 125%_, från 33 % och 100%.\n\n_+2:_ Attack- och rörelsehastighetsförstärkningarna från naturens kraft ökar till _42 % och 150%_, från 33 % och 100%.\n\n_+3:_ Attack- och rörelsehastighetsförstärkningarna från naturens kraft ökas till _46 % och 175%_, från 33 % och 100%.\n\n_+4:_ Attack- och rörelsehastighetsförstärkningarna från naturens kraft ökas till _50% och 200%_, från 33 % och 100%.
actors.hero.talent.natures_wrath.title=naturens ilska
actors.hero.talent.natures_wrath.desc=_+1:_ Vid aktiv naturkraft har skott från andebågen _8 % chans_ att utlösa en slumpmässig skadlig växteffekt.\n\n_+2:_ Vid aktiv naturkraft har skott från andebågen _17 % chans_ att utlösa en slumpmässig skadlig växteffekt.\n\n_+3:_ Vid aktiv naturkraft har skott från andebågen _25 % chans_ att utlösa en slumpmässig skadlig växteffekt.\n\n_+4:_ Vid aktiv naturkraft har skott från andebågen _33 % chans_ att utlösa en slumpmässig skadlig växteffekt.\n\nDe växter som kan utlösas är: blindweed, firebloom, icecap, sorrowmoss och stormvine.
actors.hero.talent.wild_momentum.title=vild drivkraft
actors.hero.talent.wild_momentum.desc=_+1:_ Att döda en fiende med andebågen förlänger naturens krafts varaktighet med _1 tur_. Varaktigheten kan förlängas med max _2 turer_.\n\n_+2:_ Att döda en fiende med andebågen förlänger naturens kraft med _2 turer_. Varaktigheten kan förlängas med max _4 turer_.\n\n_+3:_ Att döda en fiende med andebågen förlänger naturens kraft med _3 turer_. Varaktigheten kan förlängas med maximalt _6 turer_. \n\n_+4:_ Att döda en fiende med andebågen förlänger naturens kraft med _4 turer_. Varaktigheten kan förlängas med maximalt _8 turer_.

actors.hero.talent.eagle_eye.title=örnöga
actors.hero.talent.eagle_eye.desc=_+1:_ Ande-hökens synfält ökar från 6 till _7 rutor_.\n\n_+2:_ Ande-hökens synfält ökar från 6 till _8 rutor_.n\n_+3:_ Ande-hökens synfält ökar från 6 till _9 rutor_ och den får _2 rutor_ av tankesyn.\n\n_+4:_ Ande-hökens synfält ökar från 6 till _10 rutor_ och den får _3 rutor_ av tankesyn.
actors.hero.talent.go_for_the_eyes.title=gå för ögonen
actors.hero.talent.go_for_the_eyes.desc=_+1:_ Ande-hökens attacker förblindar fiender i _2 turer_.\n\n_+2:_ Ande-hökens attacker förblindar fiender i _5 turer_.\n\n_+3:_ Attacker från ande-hök bländar fiender i _5 turer_ och förlamar dem i _2 turer_.\n\n_+4:_ Attacker från ande-hök bländar fiender i _5 turer_ och förlamar dem i _5 turer_.
actors.hero.talent.swift_spirit.title=snabb ande
actors.hero.talent.swift_spirit.desc=_+1:_ Ande-hökens rörelsehastighet ökar från 2 till _2,5 rutor_ och den undviker garanterat de första _2 attackerna_ som riktas mot den.\n\n_+2:_ Ande-hökens rörelsehastighet ökar från 2 till _3 rutor_, och den undviker garanterat de första _4 attackerna_ som riktas mot den.\n\n_+3:_ Ande-hökens rörelsehastighet ökar från 2 till _3,5 rutor_, och den undviker garanterat de första _6 attackerna_ som riktas mot den.n\n_+4:_Ande-hökens rörelsehastighet ökas från 2 till _4 rutor_ och den undviker garanterat de första _8 attackerna_ som riktas mot den.

#duelist
actors.hero.talent.strengthening_meal.title=stärkande måltid
actors.hero.talent.strengthening_meal.desc=_+1:_ Att äta mat ger Duellanten 3 bonusskada de nästa _2 gångerna_ hon träffar en fiende med en fysisk attack.\n\n_+2:_ Att äta mat ger Duellanten 3 bonusskada de nästa _3 gångerna_ hon träffar en fiende med en fysisk attack.
actors.hero.talent.adventurers_intuition.title=äventyrares intuition
actors.hero.talent.adventurers_intuition.desc=_+1:_ Duellanten identifierar vapen _2,5 gånger snabbare_ och rustningar _1,75 gånger snabbare_. \n\n_+2:_ Duellanten identifierar vapen _när hon utrustar sig med dem_ och rustningar _2,5 gånger snabbare_.
actors.hero.talent.patient_strike.title=tålmodigt slag
actors.hero.talent.patient_strike.desc=_+1:_ Om Duellanten väntar innan hon utför en närstridsattack, gör hon _1-2 bonusskada_.\n\n_+2:_ Om Duellanten väntar innan hon utför en närstridsattack, gör hon _2 bonusskada_.
actors.hero.talent.aggressive_barrier.title=aggressiv barriär
actors.hero.talent.aggressive_barrier.desc=_+1:_ Duellanten får _3 sköld_ när hon använder en vapenförmåga och har 50% eller mindre hälsa.\n\n_+2:_ Duellanten får _5 sköld_ när hon använder en vapenförmåga och har 50% eller mindre hälsa.
actors.hero.talent.aggressive_barrier.meta_desc=_Om denna talang erhålls av en annan hjälte_ kommer den istället att ge sköld när en närstridsattack utförs vid låg hälsa, med en nedkylningstid på 50 turer.

actors.hero.talent.focused_meal.title=fokuserad måltid
actors.hero.talent.focused_meal.desc=_+1:_ Att äta mat tar 1 tur för Duellanten och ger henne _0,67 laddningar_ på hennes vapen.\n\n_+2:_ Att äta mat tar 1 tur för Duellanten och ger henne _1 laddning_ på hennes vapen.
actors.hero.talent.focused_meal.meta_desc=_Om denna talang erhålls av en annan hjälte_ ger den istället bonusskada till deras nästa träff motsvarande deras nivå/3 vid +1, eller nivå/2 vid +2.
actors.hero.talent.liquid_agility.title=flytande smidighet
actors.hero.talent.liquid_agility.desc=_+1:_ När du dricker eller kastar en dryck, brygd eller elixir får Duellanten _3x undvikande_ och _3x träffsäkerhet_ på din nästa närstridsattack inom 5 turer.n\n_+2:_ När du dricker eller kastar en dryck, brygd eller elixir får Duellanten _oändlig undvikande_ och _oändlig träffsäkerhet_ på din nästa närstridsattack inom 5 turer.\n\nDenna bonus varar i ytterligare en tur och attack när du använder styrkedrycker, erfarenhetsdrycker eller alkemiprodukter som måste tillverkas med hjälp av dessa drycker.\n\nFör alkemiprodukter med högre utgångsmängd (t.ex. vattenbrygd) har denna talang en chans att aktiveras baserat på hur många av den produkten som tillverkas.
actors.hero.talent.weapon_recharging.title=vapenuppladdning
actors.hero.talent.weapon_recharging.desc=_+1:_ Duellanten får en vapenladdning var 15:e tur när han är under påverkan av buffar som laddar trollstavar eller artefakter.\n\n_+2:_ Duellanten får en vapenladdning var 10:e tur när han är under påverkan av buffar som laddar trollstavar eller artefakter.
actors.hero.talent.weapon_recharging.meta_desc=_Om denna talang erhålls av en annan hjälte_ kommer den istället att orsaka +5 % närstridsskada vid +1, eller +7,5 % närstridsskada vid +2.
actors.hero.talent.lethal_haste.title=dödlig hast
actors.hero.talent.lethal_haste.desc=_+1:_ När Duellanten landar ett dödande slag på en fiende med en vapenförmåga får hon _3 turer_ omedelbar rörelse.\n\n_+2:_ När Duellanten landar ett dödande slag på en fiende med en vapenförmåga får hon _5 turer_ omedelbar rörelse.
actors.hero.talent.lethal_haste.meta_desc=_Om denna talang erhålls av en annan hjälte_ kommer den istället att aktiveras vid vanliga vapenattacker, med en nedkylningstid på 100 turer.
actors.hero.talent.swift_equip.title=kvick utrustning
actors.hero.talent.swift_equip.desc=_+1:_ Duellanten kan byta sitt utrustade vapen omedelbart _en gång_ var 20:e tur.\n\n_+2:_ Duellanten kan byta sitt utrustade vapen omedelbart _två gånger_ var 20:e tur.\n\nOm Duellanten har denna talang och den inte är på cooldown, kommer ett snabbt användande av ett orustat vapen att rusta det.

actors.hero.talent.precise_assault.title=precis attack
actors.hero.talent.precise_assault.desc=_+1:_ När Duellanten använder en vapenförmåga får hon _2x precision_ på sin nästa närstridsattack inom 5 turer.n\n_+2:_ När Duellanten använder en vapenförmåga får hon _5x precision_ på sin nästa närstridsattack inom 5 turer.\n\n_+3:_ När Duellanten använder en vapenförmåga får hon _oändlig precision_ på sin nästa närstridsattack inom 5 turer.
actors.hero.talent.precise_assault.meta_desc=_Om denna talang erhålls av en annan hjälte_ ökar istället närstrids precisionen med 10% vid +1, 20% vid +2 eller 30% vid +3.
actors.hero.talent.deadly_followup.title=dödlig uppföljning
actors.hero.talent.deadly_followup.desc=_+1:_ När Duellanten träffar en fiende med ett kastvapen, gör hon _10% mer närstridsskada_ på dem i 5 turer.\n\n_+2:_ När Duellanten träffar en fiende med ett kastvapen, gör hon _20% mer närstridsskada_ på dem i 5 turer.\n\n_+3:_ När Duellanten träffar en fiende med ett kastvapen, gör hon _30% mer närstridsskada_ på dem i 5 turer.

actors.hero.talent.varied_charge.title=varied charge
actors.hero.talent.varied_charge.desc=_+1:_ Kämpen återfår omedelbart _0,17 vapenladdningar_ när hon använder två olika vapenförmågor, utan tidsbegränsning.\n\n_+2:_ Kämpen återfår omedelbart _0,33 vapenladdningar_ när hon använder två olika vapenförmågor, utan tidsbegränsning.\n\n_+3:_ Kämpen återfår omedelbart _0,5 vapenladdningar_ när hon använder två olika vapenförmågor, utan tidsbegränsning.
actors.hero.talent.twin_upgrades.title=tvillinguppgraderingar
actors.hero.talent.twin_upgrades.desc=_+1:_ Om ett av kämpens två utrustade vapen har en lägre nivå och är _2 eller fler nivåer lägre_ än det andra vapnet, kommer det att uppgraderas till det andra vapnets nivå.n\n_+2:_ Om ett av kämpens två utrustade vapen har en lägre nivå och är _1 eller fler nivåer lägre_ än det andra vapnet, kommer det att uppgraderas till det andra vapnets nivå.\n\n_+3:_ Om ett av kämpens två utrustade vapen har en lägre nivå och är _samma nivå eller lägre_ än det andra vapnet, kommer det att uppgraderas till det andra vapnets nivå.
actors.hero.talent.combined_lethality.title=kombinerad dödlighet
actors.hero.talent.combined_lethality.desc=_+1:_ Om kämpen attackerar med ett närstridsvapen omedelbart efter att ha använt ett annat vapens förmåga, kommer den attacken att avrätta alla fiender som inte är bossar och som har _mindre än 13 % HP_ kvar.n\n_+2:_ Om kämpen attackerar med ett närstridsvapen direkt efter att ha använt en annan vapens förmåga, kommer den attacken att avliva alla fiender som inte är bossar och som har _mindre än 27 % HP_.\n\n_+3:_ Om kämpen attackerar med ett närstridsvapen direkt efter att ha använt en annan vapens förmåga, kommer den attacken att avliva alla fiender som inte är bossar och som har _mindre än 40% HP_.\n\nDenna attack kan vara en vanlig närstridsvapenattack eller en del av en vapenfunktion.

actors.hero.talent.unencumbered_spirit.title=obehindrad ande
actors.hero.talent.unencumbered_spirit.desc=_+1:_ Munken får _50% mer energi_ för varje utrustningsdel av _nivå 3 eller lägre_ som hon använder.\n\n_+2:_ Munken får _75% mer energi_ för varje utrustningsdel av _nivå 2 eller lägre_ som hon använder. Fördelen med nivå 3 är oförändrad.\n\n_+3:_ Munken får _100% mer energi_ för varje utrustningsdel av _nivå 1 eller lägre_ som hon använder. Fördelarna med nivå 2 och 3 är oförändrade. Hon får också en gratis tygrustning och spikhandskar.\n\nObservera att denna talang inte ger någon fördel om du är obeväpnad eller attackerar med en Ring of Force.
actors.hero.talent.monastic_vigor.title=monastic vigor
actors.hero.talent.monastic_vigor.desc=_+1:_ Om munken har _100% energi_ blir hennes förmågor förstärkta.\n\n_+2:_ Om munken har _80% eller mer energi_ blir hennes förmågor förstärkta.\n\n_+3:_ Om munken har _60% eller mer energi_ blir hennes förmågor förstärkta.\n\nNär förstärkt:\n- Flurry tillämpar ditt vapens förtrollning\n- Fokus är omedelbar\n- Dash får +4 räckvidd\n- Dragon Kick gör +50% skada och tillämpar sin knockback- och bedövningseffekt på alla intilliggande fiender\n- Meditate läker långsamt 20% av saknad HP och ger 80% skaderesistens.
actors.hero.talent.combined_energy.title=kombinerad energi
actors.hero.talent.combined_energy.desc=_+1:_ Om munken använder en vapenförmåga och en _4+ energi_förmåga inom 5 turer efter varandra återfår hon 1 förbrukad energi.\n\n_+2:_ Om munken använder en vapenförmåga och en _3+ energi_förmåga inom 5 turer efter varandra återfår hon 1 förbrukad energi.\n\n_+3:_ Om munken använder en vapenförmåga och en _2+ energi_förmåga inom 5 turer efter varandra, återfår hon 1 förbrukad energi.

actors.hero.talent.close_the_gap.title=close the gap
actors.hero.talent.close_the_gap.desc=_+1:_ Duellanten blinkar _upp till två rutor_ mot sitt mål när hon startar en duell.\n\n_+2:_ Duellanten blinkar _upp till tre rutor_ mot sitt mål när hon startar en duell.\n\n_+3:_ Duellanten blinkar _upp till fyra rutor_ mot sitt mål när hon startar en duell.\n\n_+4:_ Duellanten blinkar _upp till fem rutor_ mot sitt mål när hon startar en duell.\n\nDenna blinkning kan passera hinder och fiender, men inte fast terräng som väggar. Blinkningen tas med i beräkningen när det avgörs om en fiende är inom räckhåll för att utmanas.
actors.hero.talent.invigorating_victory.title=invigorating victory
actors.hero.talent.invigorating_victory.desc=_+1:_ Om Duellanten besegrar sitt mål innan duellen är över, läker hon _5 HP plus 30% av skadan_ hon tog under duellen.n\n\n_+2:_ Om Duellanten besegrar sitt mål innan duellen är över, läker hon _10 HP plus 50% av skadan_ hon tog under duellen.\n\n_+3:_ Om Duellanten besegrar sitt mål innan duellen är över, läker hon _15 HP plus 65% av skadan_ hon tog under duellen.n\n\n_+4:_ Om Duellanten besegrar sitt mål innan duellen är över, läker hon _20 HP plus 75% av den skada_ hon åsamkats under duellen.
actors.hero.talent.elimination_match.title=eliminationsmatch
actors.hero.talent.elimination_match.desc=_+1:_ Om Duellanten utmanar igen inom 3 turer efter att en duell har avslutats, har den utmaningen en _16 % reducerad_ laddningskostnad.\n\n_+2:_ Om Duellanten utmanar igen inom 3 turer efter att en duell har avslutats, har den utmaningen en _30% reducerad_ laddningskostnad.\n\n_+3:_ Om Duellanten utmanar igen inom 3 turer efter att en duell har avslutats, har den utmaningen en _40% reducerad_ laddningskostnad.\n\n_+4:_ Om Duellanten utmanar igen inom 3 turer efter att en duell har avslutats, har den utmaningen en _50% reducerad_ laddningskostnad.

actors.hero.talent.elemental_reach.title=elementär räckvidd
actors.hero.talent.elemental_reach.desc=_+1:_ Elemental strike's range is increased to _5 tiles_ from 4, and its width is increased to _75 degrees_ from 65.\n\n_+2:_ Elemental strike's range is increased to _6 tiles_ from 4, and its width is increased to _85 degrees_ from 65.\n\n_+3:_ Elemental strike's range is increased to _7 tiles_ from 4, and its width is increased to _95 degrees_ from 65.\n\n_+4:_ Elemental strike's range is increased to _8 tiles_ from 4, and its width is increased to _105 degrees_ from 65.
actors.hero.talent.striking_force.title=slagkraft
actors.hero.talent.striking_force.desc=_+1:_ Effekten av elemental strike ökar med _30%_.\n\n_+2:_ Effekten av elemental strike ökar med _60%_.\n\n_+3:_ Effekten av elemental strike ökar med _90%_.\n\n_+4:_ Effekten av elemental strike ökar med _120%_.
actors.hero.talent.directed_power.title=riktad kraft
actors.hero.talent.directed_power.desc=_+1:_ Den direkta attacken från elemental strike får _+30% förtrollningskraft_ för varje fiende inom räckvidden för elemental strikes effekt, inklusive attackmålet.\n\n_+2:_ Den direkta attacken från elemental strike får _+60% förtrollningskraft_ för varje fiende inom räckvidden för elemental strikes effekt, inklusive attackmålet.\n\n_+3:_ Den direkta attacken från elemental strike får _+90% förtrollningskraft_ för varje fiende inom räckvidden för elemental strikes effekt, inklusive attackmålet.\n\n_+4:_ Den direkta attacken från elemental strike får _+120% förtrollningskraft_ för varje fiende inom räckvidden för elemental strikes effekt, inklusive attackmålet.

actors.hero.talent.feigned_retreat.title=feigned retreat
actors.hero.talent.feigned_retreat.desc=_+1:_ Om en fiende attackerar Duellantens efterbild får hon _2 turer_ av hastighet.\n\n_+2:_ Om en fiende attackerar Duellantens efterbild får hon _4 turer_ av hastighet.\n\n_+3:_ Om en fiende attackerar Duellantens efterbild får hon _6 turer_ av hastighet.\n\n_+4:_ Om en fiende attackerar Duellantens efterbild får hon _8 turer_ av hastighet.
actors.hero.talent.expose_weakness.title=expose weakness
actors.hero.talent.expose_weakness.desc=_+1:_ Fiender som attackerar Duellantens efterbild blir svaga och sårbara i _2 turer_.\n\n_+2:_ Fiender som attackerar Duellantens efterbild blir svaga och sårbara i _4 turer_.\n\n_+3:_ Fiender som attackerar Duellantens efterbild blir svaga och sårbara i _6 turer_.\n\n_+4:_ Fiender som attackerar Duellantens efterbild blir svaga och sårbara i _8 turer_.
actors.hero.talent.counter_ability.title=motförmåga
actors.hero.talent.counter_ability.desc=_+1:_ Om Duellanten använder en vapenförmåga inom 3 turer efter att hennes efterbild har attackerats återfår hon omedelbart _0,38 laddningar_.\n\n_+2:_ Om Duellanten använder en vapenförmåga inom 3 turer efter att hennes efterbild har attackerats återfår hon omedelbart _0,77 laddningar_.\n\n_+3:_ Om Duellanten använder en vapenförmåga inom 3 turer efter att hennes efterbild har attackerats, återfår hon omedelbart _1,13 laddningar_.\n\n_+4:_ Om Duellanten använder en vapenförmåga inom 3 turer efter att hennes efterbild har attackerats, återfår hon omedelbart _1,5 laddningar_.

#cleric
actors.hero.talent.satiated_spells.title=Mättade trollformler
actors.hero.talent.satiated_spells.desc=_+1:_ Att äta mat gör att prästen får _3 sköldskydd_ nästa gång de kastar en besvärjelse.\n\n_+2:_ Att äta mat gör att prästen får _5 sköldskydd_ nästa gång de kastar en besvärjelse.
actors.hero.talent.satiated_spells.meta_desc=_Om denna talang erhålls av en annan hjälte_ kommer den istället att ge skydd omedelbart, vilket börjar avta normalt efter 10 turer.
actors.hero.talent.holy_intuition.title=helig intuition
actors.hero.talent.holy_intuition.desc=_+1:_ Prästen kan kasta _Holy Intuition,_ en besvärjelse som avslöjar om ett föremål är förhäxat till en kostnad av _3 laddningar._\n\n_+2:_ Prästen kan kasta _Holy Intuition,_ en besvärjelse som avslöjar om ett föremål är förhäxat till en kostnad av _2 laddningar._
actors.hero.talent.holy_intuition.meta_desc=_Om denna talang erhålls av en annan hjälte_ kommer den istället att låta hjälten identifiera förbannelsen på ett förbannat föremål precis innan det utrustas, 15 % av gångerna vid +1 eller 25 % av gångerna vid +2.
actors.hero.talent.searing_light.title=brännande ljus
actors.hero.talent.searing_light.desc=_+1:_ Prästen gör _+3 skada med sina fysiska attacker mot fiender som är upplysta av _Guiding Light_._\n\n_+2:_ Prästen gör _+5 skada med sina fysiska attacker mot fiender som är upplysta av _Guiding Light_.
actors.hero.talent.searing_light.meta_desc=_Om denna talang erhålls av en annan hjälte_ kommer den istället att ge sin bonusskada efter att en trollstav eller artefakt har använts på en fiende, med en nedkylningstid på 20 turer.
actors.hero.talent.shield_of_light.title=sköld av ljus
actors.hero.talent.shield_of_light.desc=_+1:_ Prästen kan kasta _Ljussköld,_ en besvärjelse som kastas omedelbart och ger dem _2-4 rustning_ mot ett mål i 5 turer till en kostnad av 1 laddning.n\n_+2:_ Prästen kan kasta _Ljussköld_, en besvärjelse som kastas omedelbart och ger dem _3-6 rustning_ mot ett mål i 5 turer till en kostnad av 1 laddning.
actors.hero.talent.shield_of_light.meta_desc=_Om denna talang erhålls av en annan hjälte_ kommer den istället att minska den fysiska skadan som din målfiende tar med 1, 33 % av tiden vid +1 eller 50% av tiden vid +2.

actors.hero.talent.enlightening_meal.title=Upplysande måltid
actors.hero.talent.enlightening_meal.desc=_+1:_ Att äta mat tar 1 tur för prästen och ger dem _0,67 laddningar_ på deras heliga bok.\n\n_+2:_ Att äta mat tar 1 tur för prästen och ger dem _1 laddning_ på deras heliga bok.
actors.hero.talent.enlightening_meal.meta_desc=_Om denna talang erhålls av en annan hjälte_ ger den istället 2 turer med +1 i laddning av trollstav och artefakt, eller 3 turer med +2. Detta kan inte användas för att låta hornet av överflöd ladda sig själv.
actors.hero.talent.recall_inscription.title=Återkalla inskription
actors.hero.talent.recall_inscription.refunded=Din artikel har återbetalats!
actors.hero.talent.recall_inscription.desc=_+1:_ Prästen kan kasta _Återkalla inskription,_ en besvärjelse som låter dem upprepa effekten av den senaste runstenen eller skriftrullen de använde inom _10 turer._\n\n_+2:_ Prästen kan kasta _Återkalla inskription,_ en besvärjelse som låter dem upprepa effekten av den senaste runstenen eller skriftrullen de använde inom _300 turer.n\nÅterkalla inskription kan inte användas med uppgraderingsrullar. Denna besvärjelses laddningskostnad varierar beroende på vilken föremål som nyligen använts: 2 för en runsten, 3 för en rulle, 4 för en exotisk rulle. Laddningskostnaden fördubblas också när den används med en transmutationsrulle eller alkemiföremål som måste tillverkas med transmutation eller uppgradering.
actors.hero.talent.recall_inscription.meta_desc=_Om denna talang erhålls av en annan hjälte_ återbetalas istället alla pergamentrullar eller runstenar 10% av tiden vid +1 eller 15% av tiden vid +2. Uppgraderingsskriftrullar är undantagna från denna effekt.
actors.hero.talent.sunray.title=Solstråle
actors.hero.talent.sunray.desc=_+1:_ Prästen kan kasta _Sunray,_ en besvärjelse som gör _4-8 skada_ och förblindar målet i _4 turer,_ till en kostnad av 1 laddning.\n\n_+2:_ Prästen kan kasta _Sunray,_ en besvärjelse som orsakar _6-12 skada_ och förblindar målet i _6 turer_, till en kostnad av 1 laddning.\n\nSunray kan bara förblinda varje mål en gång, men om målet redan är förblindat av Sunray förlamas det istället. Sunray orsakar alltid maximal skada på demoniska och odöda fiender.
actors.hero.talent.sunray.meta_desc=_Om denna talang erhålls av en annan hjälte_ kommer den istället att göra att trollstavar och artefakter förblindar fiender i 4 turer, 15 % av tiden vid +1 eller 25 % av tiden vid +2.
actors.hero.talent.divine_sense.title=Gudomlig känsla
actors.hero.talent.divine_sense.desc=_+1:_ Prästen kan kasta _Divine Sense_, en besvärjelse som ger dem _8 rutor_ Mind Vision i 50 turer och som inte tar någon tid att kasta, till en kostnad av 2 laddningar.\n\n_+2:_ Prästen kan kasta _Divine Sense_, en besvärjelse som ger dem _12 rutor_ Mind Vision i 50 turer och som inte tar någon tid att kasta, till en kostnad av 2 laddningar.
actors.hero.talent.divine_sense.meta_desc=_Om denna talang erhålls av en annan hjälte_ ger den istället mind vision under en kort stund efter att en trollstav eller artefakt med en räckvidd på 3 rutor vid +1 eller 5 rutor vid +2 har använts.
actors.hero.talent.bless.title=Välsigna
actors.hero.talent.bless.desc=_+1:_ Prästen kan kasta _Välsigna,_ en besvärjelse som ger _6 turer av välsignelse och 10 sköldar_ när den kastas på sig själv eller _10 turer av välsignelse och 10 läkning_ när den kastas på en annan karaktär, till en kostnad av 1 laddning.n\n_+2:_ Prästen kan kasta _Välsignelse_, en besvärjelse som ger _10 turers välsignelse och 15 sköldar_ när den kastas på sig själv eller _15 turers välsignelse och 15 läkning_ när den kastas på en annan karaktär, till en kostnad av 1 laddning.\n\nÖverskott av läkning från denna besvärjelse omvandlas till sköldar.
actors.hero.talent.bless.meta_desc=_Om denna talang erhålls av en annan hjälte_ kommer den istället att öka träffsäkerheten och undvikandet för hjälten och alla allierade med 3 % vid +1 eller 5 % vid +2.

actors.hero.talent.cleanse.title=Rensa
actors.hero.talent.cleanse.desc=_+1:_ Prästen kan kasta _Rensa,_ en besvärjelse som _tar bort negativa statuseffekter_ från prästen och alla allierade i närheten och ger dem _10 sköld,_ till en kostnad av 2 laddningar.\n\n_+2:_ Prästen kan kasta _Rensa_, en besvärjelse som ger prästen och alla allierade i närheten _3 turers immunitet mot negativa statuseffekter_ och ger dem _20 sköld_, till en kostnad av 2 laddningar.n\n_+3:_ Prästen kan kasta _Cleanse,_ en besvärjelse som _ger 5 turer av immunitet mot negativa statuseffekter_ till prästen och alla allierade i närheten, och ger dem _30 sköld,_ till en kostnad av 2 laddningar.
actors.hero.talent.cleanse.meta_desc=_Om denna talang erhålls av en annan hjälte_ kommer den istället att rensa negativa statuseffekter på hjälten efter användning av en trollstav eller artefakt, 10/20/30% av tiden vid +1/+2/+3.
actors.hero.talent.light_reading.title=Lätt läsning
actors.hero.talent.light_reading.desc=_+1:_ Prästen kan använda sin heliga bok när den inte är utrustad, men den laddas med _25% hastighet_ när den inte är utrustad.\n\n_+2:_ Prästen kan använda sin heliga bok när den inte är utrustad, men den laddas med _50% hastighet_ när den inte är utrustad.\n\n_+3:_ Prästen kan använda sin heliga bok när den inte är utrustad, men den laddas upp med _75% hastighet_ när den inte är utrustad.
actors.hero.talent.light_reading.meta_desc=_Om denna talang erhålls av en annan hjälte_ ökar istället laddningshastigheten för alla trollstavar med 7/13/20% vid +1/+2/+3.

actors.hero.talent.holy_lance.title=Heliga lans
actors.hero.talent.holy_lance.desc=_+1:_ Prästen kan kasta _Helig lans,_ en förödande besvärjelse som gör _30-55 skada_ till en kostnad av 4 laddningar.\n\n_+2:_ Prästen kan kasta _Helig lans,_ en förödande besvärjelse som gör _45-83 skada_ till en kostnad av 4 laddningar.\n\n_+3:_ Prästen kan kasta _Helig lans,_ en förödande besvärjelse som orsakar _60-110 skada_ till en kostnad av 4 laddningar.\n\nHoly Lance orsakar alltid maximal skada på demoniska och odöda fiender. Holy Lance har en nedkylningstid på 30 turer innan den kan kastas igen.
actors.hero.talent.hallowed_ground.title=Hallowed Ground
actors.hero.talent.hallowed_ground.desc=_+1:_ Prästen kan kasta _Hallowed Ground,_ en besvärjelse som helgar terrängen i ett _3x3-område_ i 20 turer, till en kostnad av 2 laddningar.n\n\n_+2:_ Prästen kan kasta _Hallowed Ground,_ en besvärjelse som helgar marken i ett _5x5-område_ i 20 turer, till en kostnad av 2 laddningar.\n\n_+3:_ Prästen kan kasta _Hallowed Ground,_ en besvärjelse som helgar marken i ett _7x7-område_ i 20 turer, till en kostnad av 2 laddningar.\n\nNär den kastas läker Hallowed Ground allierade för 15 HP, rotar fiender tillfälligt och sprider kort gräs. Därefter läker den långsamt allierade, förlamar fiender och får högt gräs att växa slumpmässigt. Hallowed Ground ger prästen skydd istället för läkning och förstörs av eld.
actors.hero.talent.mnemonic_prayer.title=Mnemonic Prayer
actors.hero.talent.mnemonic_prayer.desc=_+1:_ Prästen kan kasta _Mnemonic Prayer_, en besvärjelse som förlänger buffs/debuffs på en allierad/fiende i _3 turer_ till en kostnad av 1 laddning.\n\n_+2:_ Prästen kan kasta _Mnemonic Prayer_, en besvärjelse som förlänger buffs/debuffs på en allierad/fiende i _4 turer_ till en kostnad av 1 laddning.\n\n_+3:_ Prästen kan kasta _Mnemonic Prayer_, en besvärjelse som förlänger buffs/debuffs på en allierad/fiende i _5 turer_ till en kostnad av 1 laddning.\n\nMnemonic Prayer tar ingen tid att kasta. Mnemonic Prayer kan bara förlänga en viss buff/debuff en gång och kan inte förlänga buffs från rustningsförmågor.

actors.hero.talent.lay_on_hands.title=lägg händerna på
actors.hero.talent.lay_on_hands.desc=_+1:_ Paladinen kan kasta _Lay on Hands,_ en besvärjelse som omedelbart läker en närliggande karaktär med _15 HP,_ eller ger paladinen _15 sköld,_ till en kostnad av 1 laddning.n\n_+2:_ Paladinen kan använda _Lay on Hands,_ en besvärjelse som omedelbart läker en närliggande karaktär med _20 HP_ eller ger paladinen _20 i skydd_ till priset av 1 laddning.n\n_+3:_ Paladinen kan kasta _Lay on Hands_, en besvärjelse som omedelbart läker en närliggande karaktär med _25 HP_ eller ger paladinen _25 sköld_ till priset av 1 laddning.\n\nÖverskott av läkning från denna besvärjelse omvandlas till sköld. Lay on Hands kan kastas upprepade gånger, men kan inte applicera mer än tre kast värda sköld på en gång.
actors.hero.talent.aura_of_protection.title=aura of protection
actors.hero.talent.aura_of_protection.desc=_+1:_ Paladinen kan kasta _Aura of Protection_, en besvärjelse som ger paladinen och alla allierade inom 2 rutor _20% skaderesistens_ och effekten av paladinens rustningsglyf med _+50% kraft_ i 20 turer, till en kostnad av 2 laddningar.n\n_+2:_ Paladinen kan kasta _Skyddsaura_, en besvärjelse som ger paladinen och alla allierade inom 2 rutor _30% skaderesistens_ och effekten av paladinens rustningsglyf med _+75% kraft_ i 20 turer, till en kostnad av 2 laddningar.\n\n_+3:_ Paladinen kan kasta _Skyddsaura_, en besvärjelse som ger paladinen och alla allierade inom 2 rutor _40% skaderesistens_ och effekten av paladinens rustningsglyf med _+100% kraft_ i 20 turer, till en kostnad av 2 laddningar.
actors.hero.talent.wall_of_light.title=wall of light
actors.hero.talent.wall_of_light.desc=_+1:_ Paladinen kan kasta _Wall of Light,_ en besvärjelse som skapar en _3 rutor bred_ solid vägg framför Paladinen som stöter bort fiender och varar i 20 turer, till en kostnad av 3 laddningar.\n\n_+2:_ Paladinen kan kasta _Wall of Light,_ en besvärjelse som skapar en _5 rutor bred_ solid vägg framför paladinen som stöter bort fiender och varar i 20 turer, till en kostnad av 3 laddningar.\n\n_+3:_ Paladinen kan kasta _Wall of Light_, en besvärjelse som skapar en _7 rutor bred_ solid vägg framför paladinen som stöter bort fiender och varar i 20 turer, till en kostnad av 3 laddningar.\n\nVäggen kan placeras i kardinalriktningar eller diagonalt, och endast en vägg kan existera åt gången.

actors.hero.talent.divine_intervention.title=gudomlig ingripande
actors.hero.talent.divine_intervention.desc=_+1:_ Vid upphöjd form kan prästen kasta _Gudomlig ingripande_, som ger prästen och alla allierade upp till _150 sköld_ och förlänger upphöjd form med _3 turer._\n\n_+2:_ Vid upphöjd form kan prästen kasta _Gudomlig ingripande_, som ger prästen och alla allierade upp till _200 sköld_ och förlänger upphöjd form med _4 turer._\n\n_+3:_ I upphöjd form kan prästen kasta _Gudomlig ingripande_, som ger prästen och alla allierade upp till _250 sköld_ och förlänger upphöjd form med _5 turer._\n\n_+4:_ I upphöjd form kan prästen kasta _Gudomligt ingripande_, som ger prästen och alla allierade upp till _300 sköld_ och förlänger upphöjd form med _6 turer._\n\nGudomligt ingripande kostar hela 5 bokladdningar och kan bara kastas en gång i samma upphöjda form.
actors.hero.talent.judgement.title=judgement
actors.hero.talent.judgement.desc=_+1:_ I upphöjd form kan prästen kasta _Domen,_ som gör _10-20 skada_ på alla synliga fiender.\n\n_+2:_ I upphöjd form kan prästen kasta _Domen,_ som gör _15-30 skada_ på alla synliga fiender.\n\n_+3:_ I upphöjd form kan prästen kasta _Domen,_ som gör _20-40 skada_ på alla synliga fiender.\n\n_+4:_ I upphöjd form kan prästen kasta _Domen,_ som gör _25-50 skada_ på alla synliga fiender.\n\nDomen kostar 3 bokladdningar. Domen orsakar +33 % skada för varje besvärjelse som prästen har kastat sedan han gick in i upphöjd form eller sedan den senaste kastningen av Domen.
actors.hero.talent.flash.title=flash
actors.hero.talent.flash.desc=_+1:_ Vid upphöjd form kan prästen kasta _Blixt_ för att teleportera sig upp till _3 rutor_ bort.\n\n_+2:_ Vid upphöjd form kan prästen kasta _Blixt_ för att teleportera sig upp till _4 rutor_ bort.\n\n_+3:_ I upphöjd form kan prästen kasta _Blixt_ för att teleportera sig upp till _5 rutor_ bort.\n\n_+4:_ I upphöjd form kan prästen kasta _Blixt_ för att teleportera sig upp till _6 rutor_ bort.\n\nFlash kostar initialt 2 bokladdningar och 1 laddning för varje användning i samma upphöjda form.

actors.hero.talent.body_form.title=kroppsform
actors.hero.talent.body_form.desc=Prästen kan kasta _Kroppsform_, som ger treenigheten kraften från en förtrollning eller glyf som prästen har identifierat under denna omgång, till en kostnad av 2 laddningar.\n\n_+1:_ När treenigheten används får prästen den valda effekten i _20 turer._\n\n_+2:_ När treenigheten används får prästen den valda effekten i _27 turer._\n\n_+3:_ När treenigheten används får prästen den valda effekten i _33 turer._\n\n_+4:_ När treenigheten används får prästen den valda effekten i _40 turer._\n\nTreenigheten kan bara förses med en kroppseffekt åt gången. Treenighetens rustningskostnad är högre om den valda glyfen är sällsynt och kraftfull.
actors.hero.talent.mind_form.title=sinnesform
actors.hero.talent.mind_form.desc=Prästen kan kasta _Sinnesform_, som ger treenigheten kraften från en trollstav eller ett kastvapen som prästen har använt under denna omgång, till en kostnad av 3 laddningar.\n\n_+1:_ När treenigheten används använder prästen den valda föremålets zap- eller kasta-effekt, som om den vore _+3._\n\n_+2:_ När treenigheten används använder prästen den valda föremålets zap- eller kasta-effekt, som om den vore _+4._\n\n_+3:_ När treenigheten används använder prästen den valda föremålets zap- eller kasta-effekt som om den vore _+5._\n\n_+4:_ När treenigheten används använder prästen den valda föremålets zap- eller kasta-effekt som om den vore _+6._\n\nTreenigheten kan endast förses med en sinneseffekt åt gången.
actors.hero.talent.spirit_form.title=andeform
actors.hero.talent.spirit_form.desc=Prästen kan kasta _Andeform_, som förser treenigheten med kraften från en ring eller artefakt som prästen har identifierat under denna omgång (förutom den heliga boken), till en kostnad av 4 laddningar.\n\n_+1:_ När treenigheten används får prästen en rings effekt på _+1_ i 20 turer, eller utlöser en artefakts effekt på _+4._\n\n_+2:_ När treenigheten används får prästen en rings effekt på _+2_ i 20 turer, eller utlöser en artefakts effekt på _+6._\n\n_+3:_ När treenigheten används får prästen en ringeffekt på _+3_ i 20 turer, eller utlöser en artefakts effekt vid _+8._\n\n_+4:_ När treenigheten används får prästen en ringeffekt på _+4_ i 20 turer, eller utlöser en artefakts effekt vid _+10.n\n\nTreenigheten kan endast förses med en andeeffekt åt gången. Artefakter har olika effekter och rustningsladdningskostnader när de utlöses av treenigheten.

actors.hero.talent.beaming_ray.title=strålande stråle
actors.hero.talent.beaming_ray.desc=Prästen kan kasta _Strålande stråle_ från en förstärkt allierad till en kostnad av 1 laddning. Denna stråle kan gå igenom väggar och teleporterar allierade till en vald plats. Om en fiende befinner sig på den platsen, dyker allierade upp bredvid fienden och riktar in sig på denne. Strålande stråle kan även teleportera allierade som normalt är orörliga, men har då halva räckvidden.n\n_+1:_ Strålande stråle har en maximal räckvidd på _4 rutor_ och ökar bonusen från Många makter till _+35% skada_ mot närmaste fiende i 10 turer.\n\n_+2:_ Strålande stråle har en maximal räckvidd på _8 rutor_ och ökar bonusen från Mångas kraft till _+40% skada_ mot närmaste fiende i 10 turer.\n\n_+3:_ Strålande stråle har en maximal räckvidd på _12 rutor_ och ökar Mångas kraft-bonusen till _+45% skada_ mot närmaste fiende i 10 turer.\n\n_+4:_ Strålande stråle har en maximal räckvidd på _16 rutor_ och ökar Mångas kraft-bonusen till _+50% skada_ mot närmaste fiende i 10 turer.
actors.hero.talent.life_link.title=livslänk
actors.hero.talent.life_link.desc=Prästen kan kasta Livslänk mellan sig själv och en förstärkt allierad till en kostnad av 2 laddningar. Denna besvärjelse gör att skada delas mellan prästen och deras allierade, och gör att fördelaktiga prästbesvärjelser av nivå 3 eller lägre gäller för båda om någon av dem påverkas.n\n_+1:_ Livslänk varar i _10 turer_ och ökar bonusen från Många makt till _-35% skada som tas._\n\n_+2:_ Livslänk varar i _13 turer_ och ökar bonusen från Många makt till _-40% skada som tas._\n\n_+3:_ Livslänk varar i _17 turer_ och ökar bonusen från Många makter till _-45% skada som tas._\n\n_+4:_ Livslänk varar i _20 turer_ och ökar bonusen från Många makter till _-50% skada som tas._
actors.hero.talent.stasis.title=Stasis
actors.hero.talent.stasis.desc=Prästen kan kasta _Stasis_ på en förstärkt allierad till en kostnad av 2 laddningar. Stasis tar tillfälligt bort allierade från fängelsehålan och bevarar den återstående tiden på alla buffar, inklusive Power of Many. Allierade återkommer bredvid dig när effekten upphör. Stasis kan kastas omedelbart och utan kostnad för att avsluta effekten i förtid. Stasis fungerar på orörliga allierade, men kan inte flytta dem mellan fängelsehålor. \n\n_+1:_ Stasis varar i max _60 turer. \n\n_+2:_ Stasis varar i max _90 turer. \n\n_+3:_ Stasis varar i max _120 turer. \n\n_+4:_ Stasis varar i max _150 turer. \n\nn\nPrästen kan också kasta Beaming Ray när en allierad är i stasis för att återkalla dem, eller kasta Life Link för att förebyggande tillämpa dess effekt. Allierade drar dock inte nytta av Life Link vid stasis.


#universal
actors.hero.talent.heroic_energy.title=heroisk energi
actors.hero.talent.heroic_energy.rat_title=råtteroisk energi
actors.hero.talent.heroic_energy.desc=_+1:_ Hjältens rustningsförmåga har en _12 % reducerad_ laddningskostnad.\n\n_+2:_ Hjältens rustningsförmåga har en _23 % reducerad_ laddningskostnad.n\n_+3:_ Hjältens rustningsförmåga har en _32 % reducerad_ laddningskostnad.\n\n_+4:_ Hjältens rustningsförmåga har en _40% reducerad_ laddningskostnad.

actors.hero.talent.ratsistance.title=råttsistans
actors.hero.talent.ratsistance.desc=_+1:_ Fientliga fiender som har förvandlats till råttor gör _-10% skada_.\n\n_+2:_ Fientliga fiender som har förvandlats till råttor gör _-19 % skada_.n\n_+3:_ Fientliga fiender som har förvandlats till råttor gör _-27 % skada_.\n\n_+4:_ Fientliga fiender som har förvandlats till råttor gör _-35% skada_.
actors.hero.talent.ratlomacy.title=Råttomani
actors.hero.talent.ratlomacy.desc=_+1:_ Använd ratmogrify på en ratmogrifierad fiende för att göra dem vänliga och göra förvandlingen permanent.\n\n_+2:_ Använd ratmogrify på en ratmogrifierad fiende för att göra dem vänliga, göra förvandlingen permanent och ge dem _2 turer_ med adrenalin.\n\n_+3:_ Använda ratmogrify på en ratmogrifierad fiende gör dem vänliga, gör förvandlingen permanent och ger dem _4 turer_ med adrenalin.\n\n_+4:_ Använda ratmogrify på en ratmogrifierad fiende gör dem vänliga, gör förvandlingen permanent och ger dem _6 turer_ med adrenalin.
actors.hero.talent.ratforcements.title=Råttstärkningar
actors.hero.talent.ratforcements.desc=_+1:_ Använd ratmogrify på dig själv _spawns 1_ allierad kloakråtta bredvid dig.\n\n_+2:_ Använd ratmogrify på dig själv _spawnar 2_ allierade kloakråttor bredvid dig.\n\n_+3:_ Använd ratmogrify på dig själv _spawnar 3_ allierade kloakråttor bredvid dig.\n\n_+4:_ Använd ratmogrify på dig själv _spawnar 4_ allierade kloakråttor bredvid dig.



###npcs
actors.mobs.npcs.blacksmith.name=trollsmed
actors.mobs.npcs.blacksmith.intro_quest_warrior=Hej människa! Du ser tuff ut.
actors.mobs.npcs.blacksmith.intro_quest_mage=Hej människa! Du ser smart ut.
actors.mobs.npcs.blacksmith.intro_quest_rogue=Hej människa! Du ser ut att vara en lömska typ.
actors.mobs.npcs.blacksmith.intro_quest_huntress=Hej människa! Du ser snabb ut.
actors.mobs.npcs.blacksmith.intro_quest_duelist=Hej människa! Du ser modig ut.
actors.mobs.npcs.blacksmith.intro_quest_cleric=Hej människa! Du ser viktig ut.
actors.mobs.npcs.blacksmith.intro_quest_start=Vill du göra nytta? Ja, jag har något du kan göra. Jag har byggt den här verkstaden ovanpå en gammal gruva, den ligger precis nedför stegen. Ta den här hackan och bryt lite mörkt guldmalm åt mig. 40 stycken borde räcka. Berget där nere är mjukt, så du borde kunna bryta dig igenom väggarna med lite ansträngning._\n\nVad menar du med hur jag ska betala? Din giriga...\n\nOkej, okej, jag kan smida åt dig. Du kan skatta dig lycklig, jag är den enda smeden i trakten.
actors.mobs.npcs.blacksmith.intro_quest_crystal=Var försiktig, gruvan är farlig för en liten människa som du. Den har varit övergiven vid och en massa kristaller har börjat växa. De är glänsande, men för ömtåliga för att vara värda något, och de har magiska saker som skyddar dem. De är ganska starka, så var försiktig när du gräver, annars kommer de att observera dig. Det finns också en gigantisk kristall någonstans. Den är mycket hårdare, så var beredd på en kamp om du börjar bryta den. Jag slår vad om att om du krossar den kommer det att bromsa kristallernas tillväxt, så jag betalar extra om du klarar det.
actors.mobs.npcs.blacksmith.intro_quest_gnoll=Var försiktig, gruvan är farlig för en liten människa som du. Några gnoller vill också ha guldet och nu förstör de stället. De är dumma varelser, så deras gruvdrift har orsakat alla möjliga ras och inställningar. Du måste gräva dig igenom det, så leta efter nyligen rörda stenar. Jag tror att en av gnollerna orsakar det mesta av problemen, antagligen en geomancer-shaman eller något liknande. Jag betalar extra om du kan hitta och döda den, men jag är säker på att den kommer att slå tillbaka.
actors.mobs.npcs.blacksmith.intro_quest_fungi=Var försiktig, gruvan är farlig för en liten människa som du. Det finns någon sorts svampmonster som har vuxit där nere. Det har svampvakter som är dödliga om de ser dig, men de kan åtminstone inte resa sig och jaga dig. Håll dig utom synhåll om du vill överleva. Jag betalar extra om du lyckas döda den största svampen, men det kommer att kräva en hel del ansträngning. Den är kopplad till en massa mycelknutor som är gömda i väggarna. Du måste förstöra de flesta av dem innan du kan skada den ordentligt.
actors.mobs.npcs.blacksmith.reminder=Är du klar med att slösa min tid? Gruvingången är där borta.
actors.mobs.npcs.blacksmith.reminder_crystal=Ta med så mycket guld du kan och försök också att krossa den stora kristallen.
actors.mobs.npcs.blacksmith.reminder_gnoll=Ta med så mycket guld du kan och försök döda gnoll-geomancer också.
actors.mobs.npcs.blacksmith.reminder_fungi=Hämta så mycket guld du kan och försök också döda den gigantiska svampen.
actors.mobs.npcs.blacksmith.lost_pick=Skojar'u? Var är min hacka?!
actors.mobs.npcs.blacksmith.quest_start_prompt=Är du redo att gå ner? Se till att du har lite ledigt utrymme för guldet.\n\n_Jag släpper ner dig bara en gång!_
actors.mobs.npcs.blacksmith.enter_yes=Jag är redo
actors.mobs.npcs.blacksmith.enter_no=Inte än
actors.mobs.npcs.blacksmith.exit_warn_none=Är du redan klar? Du har knappt något guld alls! Du borde kunna få _40 stycken._\n\n_Kom ihåg, jag släpper inte in dig igen när du kommer upp._
actors.mobs.npcs.blacksmith.exit_warn_low=Är du redan klar? Det ser inte ut som om du har mycket guld. Du borde kunna få _40 stycken._\n\n_Kom ihåg att jag inte släpper in dig igen när du kommer upp._
actors.mobs.npcs.blacksmith.exit_warn_med=Är du klar? Du har åtminstone lite guld, men det finns definitivt mer i gruvan. Du borde kunna få _40 stycken._\n\n_Kom ihåg att jag inte släpper in dig igen när du kommer upp._
actors.mobs.npcs.blacksmith.exit_warn_high=Är du klar? Det ser ut som om du har fått en hel del guld, men jag skulle behöva lite mer. Du borde kunna få _40 stycken._\n\n_Kom ihåg att jag inte släpper in dig igen när du kommer upp._
actors.mobs.npcs.blacksmith.exit_warn_full=Är du klar? Du har mycket guld, men se till att du inte har glömt något av din utrustning.\n\n_Kom ihåg att jag inte släpper in dig igen när du kommer upp._
actors.mobs.npcs.blacksmith.exit_warn_crystal=Den där gigantiska kristallen är fortfarande där nere. Jag betalar extra om du förstör den.
actors.mobs.npcs.blacksmith.exit_warn_gnoll=Den där gnoll-geomancer är också kvar där nere. Jag betalar extra om du dödar den.
actors.mobs.npcs.blacksmith.exit_warn_fungi=Den där gigantiska svampen är också kvar där nere. Jag betalar extra om du dödar den.
actors.mobs.npcs.blacksmith.exit_yes=Jag är klar
actors.mobs.npcs.blacksmith.exit_no=Inte än
actors.mobs.npcs.blacksmith.get_lost=Jag är upptagen! Stick och brinn!
actors.mobs.npcs.blacksmith.entrance_blocked=Vägen ner är blockerad.
actors.mobs.npcs.blacksmith.cant_enter_old=Det området är inte tillgängligt i det här spelet. Spela ett nytt spel för att prova det nya uppdraget!
actors.mobs.npcs.blacksmith.def_verb=blockerat
actors.mobs.npcs.blacksmith.desc=Denna trollsmed ser ut som alla troll: han är lång och mager, och hans hud liknar sten både i färg och struktur. Trollsmeden pysslar med oproportionerligt små verktyg.

actors.mobs.npcs.ghost.name=sorgset spöke
actors.mobs.npcs.ghost.rat_1=Hej %s... En gång var jag som du – stark och självsäker... Men jag blev dödad av ett vidrigt odjur... Jag kan inte lämna denna plats... Inte förrän jag har hämnats... Döda den _stinkande råttan_ som tog mitt liv...\n\nDen smyger omkring på golvet... Sprider smuts överallt... _Akta dig för dess stinkande moln och frätande bett, syran löses upp i vatten..._
actors.mobs.npcs.ghost.rat_2=Snälla... Hjälp mig... Döda den avskyvärda varelsen...\n\n_Bekämpa den nära vatten... Undvik stanken..._
actors.mobs.npcs.ghost.gnoll_1=Hej %s... En gång var jag som du - stark och självsäker... Men jag blev dödad av en lömska fiende... Jag kan inte lämna denna plats... Inte förrän jag har hämnats... Döda _gnoll-bedragaren_ som tog mitt liv...\n\nDen är inte som de andra gnollerna... Den gömmer sig och använder kastvapen... _Akta dig för dess giftiga och brännande pilar, attackera inte på avstånd..._
actors.mobs.npcs.ghost.gnoll_2=Snälla... Hjälp mig... Döda trickstern...\n\n_Låt den inte träffa dig... Gå nära den..._
actors.mobs.npcs.ghost.crab_1=Hej %s... En gång var jag som du – stark och självsäker... Men jag blev dödad av en uråldrig varelse... Jag kan inte lämna denna plats... Inte förrän jag har hämnats... Döda den _stora krabban_ som tog mitt liv...\n\nDen är onaturligt gammal... Med en enorm klor och ett tjockt skal... _Akta dig för dess klor, du måste överraska krabban annars blockerar den med dem..._
actors.mobs.npcs.ghost.crab_2=Snälla... Hjälp mig... Döda kräftdjuret...\n\n_Den kommer alltid att blockera... När den ser dig komma..._
actors.mobs.npcs.ghost.find_me=Tack... kom och hitta mig...
actors.mobs.npcs.ghost.desc=Spöket är knappt synligt. Det ser ut som en formlös fläck av svagt ljus med ett sorgset ansikte.

actors.mobs.npcs.imp.name=ambitiös djävel
actors.mobs.npcs.imp.intro=Är du en äventyrare? Jag älskar äventyrare! Man kan alltid lita på dem om något behöver dödas, eller hur? Mot en belöning förstås ;)
actors.mobs.npcs.imp.golems_1=I mitt fall är det _golems_ som måste dödas. Du förstår, jag ska starta en liten verksamhet här, men de där dumma golems är dåliga för affärerna! Det är väldigt svårt att förhandla med vandrande granitklumpar, förbaskade varelser! Så snälla, döda... låt oss säga _4 av dem_ så får du en belöning.
actors.mobs.npcs.imp.monks_1=I mitt fall är det _munkar_ som måste dödas. Du förstår, jag ska starta en liten verksamhet här, men de där galningarna köper ingenting själva och skrämmer bort andra kunder. Så snälla, döda... låt oss säga _5 av dem_, så får du en belöning.
actors.mobs.npcs.imp.golems_2=Hur går din golemsafari? Glöm bara inte att ta med dig polletterna.
actors.mobs.npcs.imp.monks_2=Åh, du lever fortfarande! Jag visste att din kung-fu skulle vara starkare ;) Glöm bara inte att ta med dig polletterna.
actors.mobs.npcs.imp.cya=Vi ses, %s!
actors.mobs.npcs.imp.hey=Psst, %s!
actors.mobs.npcs.imp.desc=Imps är mindre demoner. De är inte kända för sin styrka eller magiska talang, men de är ganska smarta och sällskapliga. Många imps föredrar att leva bland icke-demoner.

actors.mobs.npcs.impshopkeeper.name=ambitiös djävul
actors.mobs.npcs.impshopkeeper.greetings=Hej, %s!
actors.mobs.npcs.impshopkeeper.greetings_ascent=Vad har du gjort, %s? Handla snabbt, jag måste härifrån!
actors.mobs.npcs.impshopkeeper.thief=Jag trodde jag kunde lita på dig!
actors.mobs.npcs.impshopkeeper.buyback=Impen ger dig glatt tillbaka din vara.
actors.mobs.npcs.impshopkeeper.desc=Impen har öppnat en liten butik vid gränsen till de inre salarna. Det är trevligt att se ett vänligt ansikte, men hans priser verkar inte särskilt vänliga.

actors.mobs.npcs.mirrorimage.name=spegelbild
actors.mobs.npcs.mirrorimage.desc=Denna illusion liknar dig mycket och verkar till och med använda ditt vapen och din rustning.\n\nSpegelbilder söker upp och attackerar fiender med sitt imiterade vapen, som fungerar på samma sätt som ditt, men gör mindre skada. De är nästan osynliga i början, men måste ta en form som är lättare att se för att kunna attackera. \n\nÄven om deras offensiva kraft kan vara stark, har spegelbilder ingen hållbarhet och försvinner så fort de tar skada.
actors.mobs.npcs.mirrorimage.discover_hint=Du kan hitta den här karaktären med en specifik skriftrulle.

actors.mobs.npcs.npc.discover_hint=Du kan hitta denna karaktär i en specifik region i fängelsehålan.

actors.mobs.npcs.prismaticimage.name=prismatisk bild
actors.mobs.npcs.prismaticimage.desc=Denna skimrande illusion liknar dig mycket och verkar till och med använda ditt nuvarande vapen och din rustning.\n\nPrismatiska bilder försöker söka upp och dra till sig fiendernas uppmärksamhet och använder sin förbättrade försvar och HP för att skydda dig. Vid de inte har samma offensiva kraft som spegelbilder har de förbättrad hållbarhet, inklusive fördelar från din rustning.\n\nNär de reduceras till 0 hp kommer prismatiska bilder att blekna under flera turer och kan fortfarande läkas under denna tid. När inga fiender är närvarande kommer prismatiska bilder att blekna och återförenas med sin mästare.
actors.mobs.npcs.prismaticimage.discover_hint=Du kan hitta denna karaktär med en specifik skriftrulle.

actors.mobs.npcs.ratking.name=råttkungen
actors.mobs.npcs.ratking.not_sleeping=Jag sov inte alls!
actors.mobs.npcs.ratking.what_is_it=Vad är det? Jag har inte tid med sådant här nonsens, mitt rike kommer inte att regera sig självt!
actors.mobs.npcs.ratking.confused=Va... Var är jag? Mitt kungarike behöver mig!
actors.mobs.npcs.ratking.crown_clothes=Ta på dig några kläder! Du är inte i stånd att tala med kungligheter!
actors.mobs.npcs.ratking.crown_desc=Oooh, är den kronan till mig!? Den ser mycket blankare ut än min, så jag tar den tacksamt emot!\n\nJag tror faktiskt att jag kan erbjuda dig något i utbyte mot kronan. En enorm kraft som passar en hjälte som du! Vill du ha den?
actors.mobs.npcs.ratking.crown_yes=Självklart!
actors.mobs.npcs.ratking.crown_info=Berätta mer först.
actors.mobs.npcs.ratking.crown_no=Jag vill helst inte...
actors.mobs.npcs.ratking.crown_thankyou=Hehehe, tack! Gå nu och gör din kung stolt!
actors.mobs.npcs.ratking.crown_fine=Okej! Jag ville ändå inte ha den...
actors.mobs.npcs.ratking.crown_after=Gillar du din nya rustning? Du får inte byta!
actors.mobs.npcs.ratking.desc_crown=Den här råttan är lite större än en vanlig kloakråtta. Den har en dvärgkungakrona på huvudet.
actors.mobs.npcs.ratking.desc_birthday=Den här råttan är lite större än en vanlig kloakråtta. Den har en liten grön festhatt istället för sin vanliga krona. Grattis på födelsedagen, Råttkungen!
actors.mobs.npcs.ratking.desc_winter=Den här kloakråttan är lite större än de andra. Istället för sin vanliga krona har den en tomteluva på sig. God jul!
actors.mobs.npcs.ratking.desc=Den här råttan är lite större än en vanlig kloakråtta. Den har en liten krona på huvudet.
actors.mobs.npcs.ratking.discover_hint=Du hittar den här karaktären i slutet av en specifik region i fängelsehålan.

actors.mobs.npcs.sheep.name=får
actors.mobs.npcs.sheep.baa!=Bä!
actors.mobs.npcs.sheep.baa?=Bä?
actors.mobs.npcs.sheep.baa.=Bä.
actors.mobs.npcs.sheep.baa...=Bä…
actors.mobs.npcs.sheep.def_verb=blockerat
actors.mobs.npcs.sheep.desc=Detta är ett magiskt får. Vad är det som är så magiskt med det? Du kan inte döda det. Det kommer att stå där tills det magiskt försvinner, medan det idisslar med en tom blick.
actors.mobs.npcs.sheep.discover_hint=Du kan hitta den här karaktären med ett specifikt föremål eller en fälla.

actors.mobs.npcs.shopkeeper.name=köpman
actors.mobs.npcs.shopkeeper.thief=Tjuv, tjuv!
actors.mobs.npcs.shopkeeper.warn=Se upp! Jag varnar dig inte igen.
actors.mobs.npcs.shopkeeper.flee=Butiksinnehavaren flyr!
actors.mobs.npcs.shopkeeper.sell=Sälj ett föremål
actors.mobs.npcs.shopkeeper.talk=Prata
actors.mobs.npcs.shopkeeper.buyback=Butiksinnehavaren återlämnar motvilligt din artikel.
actors.mobs.npcs.shopkeeper.talk_prison_intro=Jag har allt du behöver för ett lyckat äventyr!
actors.mobs.npcs.shopkeeper.talk_prison_warrior=Det är en intressant sigill du har där, de brukar vara hela. Är du en vanärad hjälte eller något? Tja, vad du än har gjort är det inte min sak, dina mynt är fortfarande giltiga.
actors.mobs.npcs.shopkeeper.talk_prison_mage=Hehe, jag tror jag har sett en efterlysningsaffisch med ditt namn på någonstans i staden. Är du på flykt? Åh, du är oskyldig, eller hur? Självklart, självklart... Oroa dig inte, jag har bättre saker att göra än att ange dig, men du kanske borde köpa något för att vara på den säkra sidan?
actors.mobs.npcs.shopkeeper.talk_prison_rogue=Kommer du från tjuvgillet för att rensa området? Nej, bara shopping? Döda några monster vid det här laget. Förvänta dig ingen rabatt, jag betalar bra skyddspengar till er och ni skyddar mig knappt här nere.
actors.mobs.npcs.shopkeeper.talk_prison_huntress=Du verkar vara på fel plats, fröken. Trånga fängelsekorridorer är inte lika rymliga som stora salar eller skogarna som omger staden, eller hur? Hehe, bry dig inte om mitt babbel, varför köper du inte något?
actors.mobs.npcs.shopkeeper.talk_prison_duelist=Jaha, är det inte den resande hjälten! Om du försöker rädda en annan stad så lycka till, farorna här är mycket värre än små banditgäng. Jag är säker på att du klarar det bättre än någon annan, försök bara att inte dö precis utanför min butik.
actors.mobs.npcs.shopkeeper.talk_prison_cleric=Hej där, Ers Höghet, eller är det Ers Helighet nu? Hehe, hur som helst är det här ingen plats för dig, många skulle bli ganska upprörda om du dog. Du har väl några mynt, varför inte köpa något för att förhindra det?
actors.mobs.npcs.shopkeeper.talk_caves=Spendera pengar, lev längre.\n\nÅh, och hälsa den där trollesmeden från mig om du ser honom. Påminn den där klumpiga typen att han fortfarande är skyldig mig pengar för hammaren jag sålde till honom förra veckan!
actors.mobs.npcs.shopkeeper.talk_city=Mina varor kan hålla dig säker här nere. \n\n...Och snälla, häng inte här. Det tog evigheter att få lokalbefolkningen att lämna mig ifred, jag vill inte att du drar till dig problem!
actors.mobs.npcs.shopkeeper.talk_halls=Hej där, jag har specialpriser för demonjägare! \n\nOch var försiktig där nere! Demoner där nere bryr sig inte om hur modig du är. Du kan inte komma tillbaka och spendera mer pengar om du är död! ;)\n\nÄr demonerna som jag? Hehe, inte alls. Jag är bara en liten kille, inte mycket till kämpe, och jag har lyckats behålla mitt förstånd. Demoner där nere är mycket starkare varelser, och de har alla förslavats av... ja... var bara försiktig där nere.
actors.mobs.npcs.shopkeeper.talk_ascent=Jag vet inte vad du tänker göra med den amuletten, men jag vill inte ha något med det att göra. Köp något och gå vidare, vi måste båda lämna det här stället!
actors.mobs.npcs.shopkeeper.desc=Denna kraftiga man passar bättre i ett handelsdistrikt i en storstad än i en fängelsehåla. Hans priser förklarar varför han föredrar att göra affärer här.

actors.mobs.npcs.wandmaker.name=gammal trollstavsmakare
actors.mobs.npcs.wandmaker.intro_warrior=Åh, hej där! Vilken trevlig överraskning att träffa en krigare från norr på en så deprimerande plats! Du måste ha rest långt för att komma hit. Om du är ute efter äventyr kanske jag har ett uppdrag åt dig.
actors.mobs.npcs.wandmaker.intro_rogue=Åh, du skrämde mig! Jag har inte träffat någon bandit från denna plats som fortfarande är vid sina sinnens fulla bruk, så du måste vara från ytan! Om du är villig att hjälpa en främling, kanske jag har ett uppdrag åt dig.
actors.mobs.npcs.wandmaker.intro_mage=Åh, hej %s! Jag hörde att det var bråk mellan dig och trollkarlarnas institut? Åh, strunt samma, jag har aldrig gillat de där trångsynta typerna ändå. Om du vill, kanske jag har ett uppdrag åt dig.
actors.mobs.npcs.wandmaker.intro_huntress=Åh, hej fröken! Ett vänligt ansikte är en trevlig överraskning här nere, eller hur? Jag är faktiskt säker på att jag har sett dig förut, men jag kommer inte på var... Åh, strunt samma, om du är här för äventyr har jag kanske en uppgift åt dig.
actors.mobs.npcs.wandmaker.intro_duelist=Åh, hej fröken! Vilken trevlig överraskning att träffa en hjälte på en så deprimerande plats! Om du vill hjälpa en gammal man har jag kanske en uppgift åt dig.
actors.mobs.npcs.wandmaker.intro_cleric=Åh, hej Ers Höghet! Vilken trevlig överraskning att träffa er på en så deprimerande plats! Jag vill inte besvära er, men jag har kanske en uppgift åt er.
actors.mobs.npcs.wandmaker.intro_1=\n\nJag kom hit för att hitta en sällsynt ingrediens till en trollstav, men jag har gått vilse och min magiska sköld försvagas. Jag måste snart ge mig av, men jag kan inte åka utan att få det jag kom för.
actors.mobs.npcs.wandmaker.intro_dust=Jag letar efter lite _likstoft._ Det är en speciell sorts förbannad benmjöl som brukar finnas på platser som denna. Det borde finnas ett barrikaderat rum någonstans här i närheten, jag är säker på att jag kan hitta lite stoft där. Var dock försiktig, dammet är mycket kraftigt förbannat. Kom tillbaka till mig så fort du kan så ska jag rena det åt dig.
actors.mobs.npcs.wandmaker.intro_ember=Jag letar efter lite _färsk glöd_ från en nyfödd eldvarelse. Varelser dyker oftast upp när en besvärjelse inte kontrolleras, så leta bara efter några ljus och en ritualplats så är jag säker på att du kan få en att dyka upp. Du bör dock _undvika att stänga in dig själv_ vid striden, eller ha _någon sorts frysande föremål till hands._ Nyfödda elementärer är ganska kraftfulla och kaotiska, men de tål inte kyla.
actors.mobs.npcs.wandmaker.intro_berry=Den gamla fängelsevakten hade en _rotbärsplanta_ och jag är ute efter ett av dess frön. Växten har nog vildvuxit vid det här laget, så det kan bli svårt att få tag på ett frö. Trädgården borde ligga någonstans här i närheten. Försök att hålla dig borta från dess slingrande rankor om du vill hålla dig hel. Det kan vara frestande att använda eld, men gör det inte, för då dödar du växten och förstör fröna.
actors.mobs.npcs.wandmaker.intro_2=\n\nOm du kan skaffa det åt mig betalar jag gärna med en av mina fint tillverkade trollstavar! Jag har två med mig, så du kan välja vilken du vill ha.
actors.mobs.npcs.wandmaker.reminder_dust=Har du haft tur med likstoft, %s? Leta efter några barrikader.
actors.mobs.npcs.wandmaker.reminder_ember=Har du haft någon tur med glöden, %s? Du måste hitta fyra ljus och ritualplatsen.
actors.mobs.npcs.wandmaker.reminder_berry=Har du hittat något ruttna bär, %s? Leta efter ett rum fyllt med växter.
actors.mobs.npcs.wandmaker.def_verb=blockerat
actors.mobs.npcs.wandmaker.desc=Denna gamla men pigga herre ser lite förvirrad ut. Han skyddas av en magisk sköld.



###mobs
actors.mobs.acidic.name=syra skorpion
actors.mobs.acidic.desc=Dessa enorma spindelliknande demoniska varelser undviker närstrid och föredrar att avfyra förlamande taggiga spikar från långa avstånd. Den här verkar droppa av frätande slem.

actors.mobs.albino.name=albinoråtta
actors.mobs.albino.desc=Den här kloakråttan tillhör en sällsynt ras med helvit päls och extra vassa tänder.
actors.mobs.albino.discover_hint=Du kan sällan hitta denna fiende i en specifik region i fängelsehålan.

actors.mobs.armoredstatue.name=pansarstaty
actors.mobs.armoredstatue.desc=Du skulle kunna tro att det bara är en av fängelsehålan andra livlösa statyer, men dess röda glödande ögon avslöjar den. \n\nDen verkar vara i mycket gott skick tack vare rustningen den bär, så den kan vara mycket svår att döda.
actors.mobs.armoredstatue.desc_arm_wep=Vid statyn är gjord av sten, ser _%1$s_ och _%2$s_ den bär ut som äkta.

actors.mobs.bandit.name=galen bandit
actors.mobs.bandit.desc=En elitstjuv som kännetecknas av sin mer påkostade lila mantel. Trots sin större skicklighet har de blivit lika tanklösa som vanliga tjuvar. \n\nFörutom att stjäla från dig kommer galna banditer att göra dig blind, förlama och förgifta dig! De är dock mycket mer benägna att ha extra byte än vanliga tjuvar.

actors.mobs.bat.name=vampyrfladdermus
actors.mobs.bat.desc=Dessa snabba och ihärdiga grottinvånare är mycket farligare än de ser ut. De återfår sin hälsa efter varje lyckad attack, vilket gör att de kan besegra mycket större motståndare.

actors.mobs.bee.name=golden bee
actors.mobs.bee.desc_honey=Trots sin ringa storlek tenderar guldbin att skydda sitt hem med näbb och klor. Den här har lugnats och verkar vilja följa efter dig.
actors.mobs.bee.desc=Trots sin ringa storlek tenderar guldbin att försvara sitt hem med näbbar och klor. Den här är mycket arg, så håll dig på avstånd.
actors.mobs.bee.discover_hint=Du kan hitta den här karaktären med ett specifikt föremål.

actors.mobs.brute.name=gnollbrute
actors.mobs.brute.enraged=förargad
actors.mobs.brute.def_verb=blockerat
actors.mobs.brute.desc=Brutes är de största, starkaste och tuffaste av alla gnolls. När de blir dödligt sårade blir de berserk och får tillfälligt skydd och en stor skadeboost.
actors.mobs.brute$bruterage.name=brute rage
actors.mobs.brute$bruterage.desc=Denna gnollbrute är döende, men vill ta dig med sig!\n\nBruten dör när dess skydd upphör, antingen på grund av tid eller om den skadas. Under tiden kommer den att orsaka enormt ökad skada, så se upp!\n\nÅterstående skydd: %d.

actors.mobs.causticslime.name=frätande slem
actors.mobs.causticslime.desc=Denna slem verkar ha förgiftats av den mörka magi som strömmar upp från underjorden. Den har förlorat sin vanliga gröna färg och droppar av frätande slem.
actors.mobs.causticslime.discover_hint=Du kan sällan hitta denna fiende i en specifik region i fängelsehålan.

actors.mobs.crab.name=kloakkrabba
actors.mobs.crab.desc=Dessa enorma krabbor står högst upp i näringskedjan i kloakerna. De är extremt snabba och deras tjocka skal tål kraftiga slag.

actors.mobs.crystalguardian.name=kristallväktare
actors.mobs.crystalguardian.def_verb=blockerat
actors.mobs.crystalguardian.desc=Dessa stora kristallvakter ser nästan ut som statyer, om det inte vore för deras lysande ögon. Det härdade kristallmaterialet de är gjorda av gör dem tröga men mycket tåliga, så det är bäst att låta dem sova i sitt kristallbo så länge som möjligt._\n\nPå grund av sin storlek rör sig kristallvakter mycket långsammare i slutna utrymmen. De är också så tåliga att det är omöjligt att döda dem direkt. De kan slås ner och tillfälligt inaktiveras, men de reser sig bara upp igen efter en stund.
actors.mobs.crystalguardian.discover_hint=Du kan hitta denna fiende under ett specifikt uppdrag.

actors.mobs.crystalmimic.name=kristallmimik
actors.mobs.crystalmimic.ate=Mimiken åt din %s!
actors.mobs.crystalmimic.escaped=Kristallmimiken har rymt!
actors.mobs.crystalmimic.desc=Mimics är magiska varelser som kan ta vilken form de vill. I fängelsehålor väljer de nästan alltid formen av en skattkista för att lura intet ont anande äventyrare. Kristallmimiker är listigare än sina vanliga kusiner och föredrar att undvika konflikter vid stöld. De försöker springa iväg när de upptäcks och har förmågan att flytta fiender när de attackerar.

actors.mobs.crystalspire.name=crystal spire
actors.mobs.crystalspire.warning=Kristallen vibrerar när du slår på den. Om du fortsätter kommer du att bli observerad...
actors.mobs.crystalspire.alert=Vibrationerna blir starkare och hörs i hela grottan!
actors.mobs.crystalspire.desc=Denna gigantiska spira av ultrahård kristall är troligen källan till alla de märkliga kristallvarelserna i grottan. Dina vanliga vapen är verkningslösa mot den, så du måste använda din hacka om du vill förstöra den.n\n_Se till att du är förberedd innan du börjar bryta den._ Det kommer troligen att ta en stund att bryta en så stor kristall, och du kommer förmodligen inte att kunna göra det ostört. Spiran kan till och med ha något sätt att försvara sig på. _Kanske kan spiran egna attacker användas mot dess underhuggare._
actors.mobs.crystalspire.discover_hint=Du kan hitta denna fiende under ett specifikt uppdrag.

actors.mobs.crystalwisp.name=crystal wisp
actors.mobs.crystalwisp.beam_kill=Ljusstrålen dödade dig...
actors.mobs.crystalwisp.desc=En liten arg flytande bit av härdat kristall som avger ett starkt sken. Vid inte särskilt starka, men kristallspöken skjuter en skadlig ljusstråle mot dig om de har fri sikt. \n\nSpöken är tillräckligt små för att lätt kunna röra sig genom de olika kristallformationerna, men de kan inte skjuta genom dem.
actors.mobs.crystalwisp.discover_hint=Du kan hitta denna fiende under ett specifikt uppdrag.

actors.mobs.demonspawner.name=demonframkallare
actors.mobs.demonspawner.on_death=Den demoniska energin här verkar avta när spawneren dör.
actors.mobs.demonspawner.desc=Denna vridna blandning av dvärgkött är ansvarig för att skapa rippardemoner från dvärgar som har dött i denna region. Demonerna ser uppenbarligen inga problem med att använda alla resurser de kan mot sina fiender. Demon-spawners är visuellt skrämmande, men de har inga möjligheter att röra sig eller försvara sig direkt. Deras betydande massa gör dem dock svåra att döda snabbt, och de spawnar ripper-demoner snabbare när de är hotade. Demon-spawners verkar vara kopplade till någon central källa av demonisk kraft. Att döda dem kan försvaga den.

actors.mobs.dm100.name=DM-100
actors.mobs.dm100.zap_kill=Blixten dödade dig...
actors.mobs.dm100.desc=DM-100 är en tidig modell av en dvärgsk "försvarsmaskin" som var avsedd att skydda dvärgarnas gruvarbetare i grottorna under detta fängelse. Deras elektriska stötar visade sig dock vara för svaga, så de skänktes till människornas stad ovanför. De stod oanvända i åratal och hamnade så småningom i fängelset, där fängelsedirektören först ansåg dem för grymma att använda. Men när fångarna blev mer och mer oroliga blev de en nödvändighet.

actors.mobs.dm200.name=DM-200
actors.mobs.dm200.vent=DM-200 avfyrar en stråle av giftiga avgaser!
actors.mobs.dm200.desc=DM-200 är den andra generationen av dvärgarnas "försvarsmaskin", som konstruerades för att skydda dvärgarnas gruvarbetare i grottorna och staden nedanför. De är mycket större och mer klumpiga än sina föregångare och attackerar med förödande hydrauliska nävar. \n\nDeras ökade storlek är också deras största svaghet, eftersom de inte får plats i de smala tunnlarna och dörröppningarna i fängelsehålorna. Dvärgarna kunde kompensera för DM-200:s bristande rörlighet genom att låta dem släppa ut sina giftiga avgaser mot fiender på avstånd eller fiender som de inte kan nå.

actors.mobs.dm201.name=DM-201
actors.mobs.dm201.vent=DM-201 kastar en frätande granat!
actors.mobs.dm201.desc=Dvärgarna experimenterade kort med att ytterligare betona DM-200:s brist på rörlighet och skapade några DM-modeller som är helt stationära. DM-201 är en ombyggd DM-200 som fungerar som en vaktpost utan rörelseförmåga. I utbyte mot bristen på rörlighet har DM-201 betydligt högre hållbarhet och attackkraft. Eftersom DM-201 inte har någon motor att släppa ut avgaser från, har dvärgarna istället utrustat dem med frätande gasgranater! DM-201 är dock försiktiga med dessa granater och kastar dem endast när de attackeras på avstånd.

actors.mobs.dm300.name=DM-300
actors.mobs.dm300.notice=OBEFÖRKLIG PERSONAL UPPTÄCKT!
actors.mobs.dm300.shield=DM-300 drar ström från de exponerade kablarna och skyddar sig själv!
actors.mobs.dm300.charging=FÅR SKADA! AKTIVERAR STRÖMSTOLPE!
actors.mobs.dm300.charging_hint=DM-300 är osårbar vid laddning från en pylon!
actors.mobs.dm300.supercharged=FÖRSTÖR! FÖRSTÖR! FÖRSTÖR!
actors.mobs.dm300.charge_lost=PYLON FÖRSTÖRD! ÅTERGÅR TILL LOKAL STRÖM!
actors.mobs.dm300.pylons_destroyed=VARNING! INSTABILITET UPPTÄCKT I ELNÄTET!
actors.mobs.dm300.rankings_desc=Kördes över av DM-300
actors.mobs.dm300.def_verb=blockerat
actors.mobs.dm300.defeated=KRITISK SKADA! FÖRSÖKER STÄNGA AV
actors.mobs.dm300.desc=DM-300 är den största och mest kraftfulla "försvarsmaskinen" som dvärgarna någonsin byggt. En så fantastisk maskin är svår att tillverka, så dvärgarna har bara byggt några få för att bevaka ingångarna till sin underjordiska metropol. Den är utrustad med ventiler för att spruta ut giftiga avgaser och en kraftfull borr som den kan använda både för att attackera och förstöra marken. DM-300 kan också anslutas till ett energinät, vilket ytterligare ökar dess kraft.
actors.mobs.dm300.desc_supercharged=DM-300 är för närvarande fulladdad med elektrisk energi. I detta tillstånd kan DM-300 inte skadas och rör sig dubbelt så fort! Dessutom snurrar borren nu tillräckligt snabbt för att den ska kunna _tunnla genom fast berg,_ även om den rör sig mycket långsammare när den gör detta.\n\nDet är meningslöst att attackera DM-300 direkt när den är superladdad, men _något i området måste förse den med denna energi,_ och att förstöra det kan försvaga den.

actors.mobs.dwarfking.name=Dvärgakungen
actors.mobs.dwarfking.notice=Hur vågar du! Du har ingen aning om vad du lägger dig i!
actors.mobs.dwarfking.lifelink_1=Jag behöver din essens, slav!
actors.mobs.dwarfking.lifelink_2=Blöd för mig, slav!
actors.mobs.dwarfking.teleport_1=Ta hand om dem, slav!
actors.mobs.dwarfking.teleport_2=Håll dem sysselsatta, slav!
actors.mobs.dwarfking.wave_1=Nu räcker det! Res er, mina slavar!
actors.mobs.dwarfking.wave_2=Fler! Blöd för er kung!
actors.mobs.dwarfking.wave_3=Värdelösa! DÖDA DEM NU!
actors.mobs.dwarfking.enraged=Du kan inte döda mig %s. JAG ÄR OUDÖDLIG!
actors.mobs.dwarfking.losing=Nej! Du kan inte göra det... du har ingen aning om vad som finns där nere...
actors.mobs.dwarfking.defeated=Du har... Dömt oss alla...
actors.mobs.dwarfking.rankings_desc=Föll inför dvärgarnas kung
actors.mobs.dwarfking.desc=För många år sedan upptäckte en av de högsta trollkarlarna i dvärgarnas hov hemligheter som gav honom enorm makt över liv och död. Han använde snart denna makt för att underkuva och korrumpera sina jämlikar, sin kung och så småningom alla dvärgarnas medborgare. Nu är han kung och härskar över en legion av odöda undersåtar. \n\nDvärgkungen är en aggressiv fiende som försöker omringa och överväldiga sina fiender med sin hord av odöda underhuggare.
actors.mobs.dwarfking$dkghoul.rankings_desc=Fell Before the King of Dwarves
actors.mobs.dwarfking$dkmonk.rankings_desc=Föll inför dvärgkungen
actors.mobs.dwarfking$dkwarlock.rankings_desc=Föll inför dvärgkungen
actors.mobs.dwarfking$dkgolem.rankings_desc=Stupade i dvärgakungens sal

actors.mobs.ebonymimic.name=Ebonymimic
actors.mobs.ebonymimic.reveal=Det var en mimare där!
actors.mobs.ebonymimic.hidden_name=misstänkt kontur
actors.mobs.ebonymimic.hidden_desc=Det verkar finnas något här, men det är nästan helt genomskinligt.
actors.mobs.ebonymimic.desc=Mimics är magiska varelser som kan ta vilken form de vill. I fängelsehålor väljer de nästan alltid formen av en skattkista för att lura intet ont anande äventyrare. Ebony mimics är smygande mimics med förmågan att göra sig nästan osynliga. De lurar på saker som äventyrare sannolikt kommer att interagera med, men innehåller också egna byten. De är inte tuffare än vanliga mimics när de väl upptäcks, men deras överraskande bett är förödande.
actors.mobs.ebonymimic.discover_hint=Du kan hitta denna fiende med hjälp av en specifik prydnadssak.

actors.mobs.elemental$fireelemental.name=eldelementar
actors.mobs.elemental$fireelemental.desc=Elementaler är kaotiska varelser som ofta skapas när kraftfull ockult magi inte kontrolleras ordentligt. Elementaler har minimal intelligens och är vanligtvis förknippade med en viss typ av magi.\n\nEldelementaler är en vanlig typ av elementaler som orsakar skada med eldig magi. De sätter eld på sitt mål med närstridsattacker och kan ibland även skjuta eldbollar.
actors.mobs.elemental$newbornfireelemental.name=nyfödd eldelementar
actors.mobs.elemental$newbornfireelemental.charging=Elementalen laddar!
actors.mobs.elemental$newbornfireelemental.desc=Elementärer är kaotiska varelser som ofta skapas när kraftfull ockult magi inte kontrolleras ordentligt. Elementärer har minimal intelligens och är vanligtvis förknippade med en viss typ av magi. Denna eldelementär är nyförkallad, men fortfarande ganska farlig!
actors.mobs.elemental$newbornfireelemental.desc_boss=På grund av den kaotiska naturen hos dess frammaning kan denna elementar bara sprida eld i oriktiga explosioner efter att ha laddat upp under en tur.
actors.mobs.elemental$newbornfireelemental.desc_ally=Eftersom denna elementar har frammanats med en besvärjelse har den lite bättre kontroll över sin eld. Den kan inte attackera på avstånd, men tänder eld på fiender som den attackerar i närstrid.
actors.mobs.elemental$newbornfireelemental.discover_hint=Du kan hitta denna fiende under ett specifikt uppdrag.
actors.mobs.elemental$frostelemental.name=frost elemental
actors.mobs.elemental$frostelemental.desc=Elementaler är kaotiska varelser som ofta skapas när kraftfull ockult magi inte kontrolleras ordentligt. Elementaler har minimal intelligens och är vanligtvis förknippade med en viss typ av magi.\n\nFrostelementaler är en vanlig typ av elementaler som försvagar fiender med kylig magi. De kyler ner sitt mål med närstrid och ibland med distansattacker. Deras magi är mycket effektivare i vatten.
actors.mobs.elemental$shockelemental.name=chockelemental
actors.mobs.elemental$shockelemental.desc=Elementaler är kaotiska varelser som ofta skapas när kraftfull ockult magi inte kontrolleras ordentligt. Elementaler har minimal intelligens och är vanligtvis förknippade med en viss typ av magi. Shock elementaler är en mindre vanlig typ av elemental som stör sina fiender med elektricitet och ljusblixtar. I närstrid slänger de elektricitet mot närliggande fiender och gör extra skada på sitt primära mål om det befinner sig i vatten. Ibland riktar de också en långdistansstråle av ljus mot sitt mål, vilket tillfälligt bländar det.
actors.mobs.elemental$chaoselemental.name=kaoselementar
actors.mobs.elemental$chaoselemental.desc=Elementaler är kaotiska varelser som ofta skapas när kraftfull ockult magi inte kontrolleras ordentligt. Elementaler har minimal intelligens och är vanligtvis förknippade med en viss typ av magi. \n\nKaoselementaler är sällsynta och farliga elementaler som inte har stabiliserats till ett visst element. De släpper lös vild och oförutsägbar magi när de attackerar.

actors.mobs.eye.name=evil eye
actors.mobs.eye.deathgaze_kill=Dödsblicken dödade dig...
actors.mobs.eye.desc=Evil Eyes är flytande bollar av uppdämd demonisk energi. Vid närstrid är de kapabla att slåss, men deras verkliga styrka kommer från deras magi.\n\nEfter att ha byggt upp energi under en kort tid släpper Evil Eye lös en förödande energistråle som kallas _deathgaze._ Allt inom Evil Eyes synfält kommer att ta enorm skada, så kloka äventyrare bör springa och ta skydd.

actors.mobs.fetidrat.name=fetig råtta
actors.mobs.fetidrat.desc=Det är uppenbart att något är fel med den här råttan. Dess feta svarta päls och ruttnande hud skiljer sig mycket från de friska råttor du sett tidigare. Dess blekgröna ögon gör den särskilt hotfull. \n\nRåttan avger en fruktansvärd stank som är överväldigande stark på nära håll. \n\nMörk slem rinner från råttans mun, den äter sig igenom golvet men verkar lösas upp i vatten.
actors.mobs.fetidrat.discover_hint=Du kan hitta denna fiende under ett specifikt uppdrag.

actors.mobs.fungalcore.name=svampkärna
actors.mobs.fungalcore.desc=Denna gigantiska svamp måste vara källan till all svampaktivitet i denna grotta.

actors.mobs.fungalsentry.name=svampvakt
actors.mobs.fungalsentry.desc=Denna särskilt höga svamp fungerar som en försvarsposition för det större svampnätverket som lever i denna grotta. Den är orörlig, men skjuter precisa giftstrålar mot allt som kommer inom dess synfält. Vid träff är strålarna relativt svaga, men de kan snabbt ackumulera dödliga mängder gift. Den kan dödas, men det är nog bäst att undvika den.

actors.mobs.fungalspinner.name=svampspinnare
actors.mobs.fungalspinner.desc=Denna grottspinner verkar styras av en parasitsvamp. Svampen har också förändrat dess förmågor och ersatt dess nät och giftsäckar med svampväxt. Svampspinnaren spottar växtdelar på dig istället för nät, vilket sprider svampväxt och kan göra att du rotar fast. Svampspinnaren kan inte förgifta, men får betydande skaderesistens om den befinner sig intill svampar.

actors.mobs.ghoul.name=dvärgghoul
actors.mobs.ghoul.desc=När dvärgsamhället långsamt började kollapsa och den nuvarande kungen av dvärgarna tog absolut makt, behandlades de som var svaga eller som motsatte sig honom illa. När kungen blev skickligare på att utöva mörk magi böjde han dessa dvärgar efter sin vilja, och nu utgör de fotfolket i hans armé. Ghouls är inte särskilt starka på egen hand, men de rör sig alltid i grupper och är mycket svårare att döda i stort antal. När en ghoul besegras reser den sig igen efter några turer så länge det finns en annan ghoul i närheten.

actors.mobs.gnoll.name=gnollscout
actors.mobs.gnoll.desc=Gnoller är hyenaliknande humanoider. De bor i kloaker och fängelsehålor och vågar sig upp till ytan för att plundra då och då. Gnollscouter är vanliga medlemmar i sin flock, de är inte lika starka som bruter och inte lika intelligenta som shamaner.

actors.mobs.gnollexile.name=gnoll exile
actors.mobs.gnollexile.desc=Denna gråhåriga gnoll har ett stort märke på axeln som visar att den är en exil. Gnoller blir vanligtvis förvisade från sitt samhälle för att ha ignorerat order eller brutit mot lagar. Exiler måste vara starka och sluga för att överleva, och den här ser ut att kunna hantera spjutet den håller i.
actors.mobs.gnollexile.desc_passive=_Den gnolliska exilen rör sig inte för att attackera._ Den verkar inte lika aggressiv som de andra gnollerna här och tycker nog inte att det är värt att slåss mot dig. Du kan låta den passera, men den har en ryggsäck som kan vara full av användbara föremål...
actors.mobs.gnollexile.desc_aggro=_Den gnolliska flyktingen ser sig ilsket omkring. Det verkar som om något har fått den att bestämma sig för att slåss trots allt. Se upp för spjutet!
actors.mobs.gnollexile.seen_passive=Den spjutbärande gnollen tittar misstänksamt på dig, men gör inga rörelser för att attackera.
actors.mobs.gnollexile.seen_aggro=Den spjutbärande gnollen går till attack!

actors.mobs.gnollgeomancer.name=gnoll geomancer
actors.mobs.gnollgeomancer.warning=Geomancer börjar röra på sig. Se till att du är redo innan du fortsätter!
actors.mobs.gnollgeomancer.alert=Geomancer vaknar! Hela grottan verkar skifta när den hoppar iväg vid skratt!
actors.mobs.gnollgeomancer.rock_kill=Den flygande stenbumlingen dödade dig...
actors.mobs.gnollgeomancer.rockfall_kill=De fallande stenarna dödade dig...
actors.mobs.gnollgeomancer.desc=Denna imponerande höga äldre gnoll måste vara källan till den olika jordförflyttande magin här omkring, och organisatören av all gnollaktivitet. Till skillnad från gnoll-sappers i området är geomanceren ganska skicklig med sin magi och kan inte skadas av kastade eller fallande stenar. Den har dock inget sätt att slåss i närstrid.
actors.mobs.gnollgeomancer.desc_armor=Geomancer är för närvarande innesluten i ett lager av stenrustning. _Du måste komma nära och bryta bort den med din hacka innan du kan skada geomancer._
actors.mobs.gnollgeomancer.desc_armor_sapper=_En närliggande gnoll-sappare håller i en apparat som ger geomancerens stenrustning kraft. Du kan inte skada den alls just nu!_
actors.mobs.gnollgeomancer.desc_sleeping=Denna imponerande höga gnollshaman är omgiven av ett lager av sten och ser nästan ut som en staty. Om du tittar noga kan du se att stenen rör sig magiskt i takt med den äldre gnollens andning. Den kan inte skadas vid denna stenbeläggning och verkar njuta av en bokstavlig jordvila.n\nDu kan antagligen bryta igenom stenlagren med din hacka, men _se till att du är redo för strid när du gör det._ Geomancer måste vara källan till den olika jordförflyttande magin här omkring och organisatören av all gnollaktivitet. _Det kan vara en bra idé att besegra de gnoller som är utspridda här innan du bekämpar den._
actors.mobs.gnollgeomancer.discover_hint=Du kan hitta denna fiende under ett specifikt uppdrag.

actors.mobs.gnollguard.name=gnollvakt
actors.mobs.gnollguard.def_verb=blockerat
actors.mobs.gnollguard.spear_warn=Gnollen landar ett brutalt slag med spjutspetsen!
actors.mobs.gnollguard.desc=En stor och tuff gnoll som bär ett spjut och en sköld, men ingen hjälm. Dessa vakter är troligen brutala soldater under utbildning, som tvingats hjälpa till att skydda gruvan från vilda djur. Den behöver ganska öppet utrymme för att attackera på avstånd och gör betydligt mindre skada om du kommer nära.
actors.mobs.gnollguard.desc_armor=_En gnoll-sapör i närheten håller i en apparat som ger denna vakt en jordrustning som kraftigt minskar skadan den tar.
actors.mobs.gnollguard.discover_hint=Du kan hitta denna fiende under ett specifikt uppdrag.

actors.mobs.gnollsapper.name=gnoll-sapör
actors.mobs.gnollsapper.desc=En liten och svag men intelligent gnoll med blek päls och en väska full av olika prylar. De är troligen här för att hjälpa till med prospektering och brytning av mörkt guld, och har en vakt i närheten för skydd. De kan slåss, men deras attacker är ynkligt svaga, inte starkare än en gnollscout. \n\nIstället för att slåss direkt föredrar sappers att använda sina olika prylar för att få den steniga miljön att attackera åt dem. De kan dock inte själva använda jordförflyttande magi, så de använder sina prylar ofta på ett vårdslöst sätt. _Det bör finnas många sätt att använda deras attacker mot dem eller deras vakt.
actors.mobs.gnollsapper.discover_hint=Du kan hitta denna fiende under ett specifikt uppdrag.

actors.mobs.gnolltrickster.name=gnoll trickster
actors.mobs.gnolltrickster.desc=En märklig varelse, även med gnoll-mått mätt. Den sitter framåtböjd med ett ondskefullt leende och håller nästan om väskan som hänger över axeln. Ögonen är vidöppna och uttrycker en märklig blandning av rädsla och spänning. \n\nI väskan finns en stor samling dåligt tillverkade pilar som alla verkar vara försedda med olika farliga ämnen.
actors.mobs.gnolltrickster.discover_hint=Du kan hitta denna fiende under ett specifikt uppdrag.

actors.mobs.goldenmimic.name=golden mimic
actors.mobs.goldenmimic.desc=Mimics är magiska varelser som kan ta vilken form de vill. I fängelsehålor väljer de nästan alltid formen av en skattkista för att locka till sig intet ont anande äventyrare.

actors.mobs.golem.name=golem
actors.mobs.golem.def_verb=blockerat
actors.mobs.golem.desc=Golems är ett försök att korrigera tidigare brister i dvärgarnas maskiner genom deras nyfunna användning av magi. De är mycket mer kompakta och effektiva jämfört med DM-300, men fortfarande mycket dödliga.\n\nEftersom golems fortfarande är för stora för att passa in i gångar har dvärgarna gett dem nya magiska förmågor som kompensation. Golems kan teleportera sig mellan rum och teleportera fiender till sig när de är utom räckhåll.

actors.mobs.goo.name=Klegget
actors.mobs.goo.notice=BLUBB BLUBB!
actors.mobs.goo.defeated=Blubb… blubb…
actors.mobs.goo.!!!=!!!
actors.mobs.goo.pumpup=Goo pumpar upp sig själv!
actors.mobs.goo.enraged=förargad
actors.mobs.goo.gluuurp=BLUUUUBB!
actors.mobs.goo.rankings_desc=Sögs upp av klegget
actors.mobs.goo.desc=Lite är känt om Goo. Det är mycket möjligt att det inte ens är en varelse, utan snarare en sammansättning av vidriga ämnen från kloakerna som på något sätt fått grundläggande intelligens. Oavsett vilket är det mörk magi som har gjort det möjligt för Goo att existera. Dess gelatinösa konsistens gör att den kan absorbera stora mängder mörk energi, och man känner en kyla bara av att vara i närheten. Om Goo kan attackera med denna energi kommer du inte att överleva länge.

actors.mobs.greatcrab.name=jättekrabba
actors.mobs.greatcrab.noticed=Krabban blockerar med sin massiva klo.
actors.mobs.greatcrab.def_verb=blockerat
actors.mobs.greatcrab.desc=Denna krabba är gigantisk, även jämfört med andra avloppskrabbor. Dess blå skal är täckt av sprickor och havstulpaner, vilket visar på hög ålder. Den rör sig långsamt och har svårt att hålla balansen med sin massiva klo. Krabban håller klon framför sig vid hot och skyddar sig bakom en ogenomtränglig vägg av skal. Krabban kan dock inte blockera attacker som den inte ser komma eller attacker från flera fiender samtidigt.
actors.mobs.greatcrab.discover_hint=Du kan hitta denna fiende under ett specifikt uppdrag.

actors.mobs.guard.name=fängelsevakt
actors.mobs.guard.scorpion=Kom hit med dig!
actors.mobs.guard.def_verb=blockerat
actors.mobs.guard.desc=Dessa vakter var en gång fängelsevakter, men har sedan länge blivit precis som fångarna. De hasar omkring som zombier och vandrar tanklöst genom korridorerna på jakt efter något som inte är på sin plats, som dig! \n\nDe bär kedjor runt höfterna, som de troligen använder för att dra in fiender på nära håll.

actors.mobs.hermitcrab.name=hermit crab
actors.mobs.hermitcrab.def_verb=blockerat
actors.mobs.hermitcrab.desc=Av någon anledning har denna kloakräka bestämt sig för att bära den trasiga övre delen av en tunna på huvudet! Den extra vikten har saktat ner den till normal hastighet, men har också gett den betydligt bättre försvar. Du tror dock att du hör något studsa runt inuti tunnan...

actors.mobs.mimic.name=mimare
actors.mobs.mimic.reveal=Den kistan är en mimare!
actors.mobs.mimic.hidden_hint=Något med den här kistan känns fel... Att gå fram och försöka öppna den är kanske ingen bra idé.
actors.mobs.mimic.desc=Mimiker är magiska varelser som kan ta vilken form de vill. I fängelsehålor väljer de nästan alltid formen av en skattkista för att lura intet ont anande äventyrare. Mimiker har en otäck bett, men innehåller ofta mer skatter än en vanlig kista.
actors.mobs.mimic.discover_hint=Du kan hitta denna fiende överallt i fängelsehålan.

actors.mobs.necromancer.name=andebesvärjare
actors.mobs.necromancer.desc=Dessa lärlingar till mörka magiker har flockats till fängelset, eftersom det är den perfekta platsen att öva sin onda konst. Necromancer kommer att kalla fram och ge skelett kraft att slåss för dem. Om du dödar necromancer kommer även skelettet den kallat fram att dö.
actors.mobs.necromancer$necroskeleton.name=andebesvärjares skelett
actors.mobs.necromancer$necroskeleton.desc=Detta skelett har frammanats av en nekromantiker. Det beter sig precis som ett vanligt skelett och dör när nekromantikern som frammanade det dödas.

actors.mobs.mob.died=Du hör något dö i fjärran.
actors.mobs.mob.rage=$%^
actors.mobs.mob.rankings_desc=Dödades av: %s
actors.mobs.mob.discover_hint=Du kan hitta denna fiende i en specifik region i fängelsehålan.

actors.mobs.monk.name=dvärgmunk
actors.mobs.monk.def_verb=blockerat
actors.mobs.monk.parried=parerat
actors.mobs.monk.desc=Dessa munkar är fanatiker som har ägnat sig åt att skydda sin kung med fysisk styrka. Deras hängivenhet är så stor att de helt har överlämnat sina sinnen till sin kung och nu vandrar omkring i dvärgstaden som tanklösa zombier. \n\nMunkar förlitar sig enbart på närstridskonst och kan använda sina obeväpnade nävar både för attack och försvar. När de blir fokuserade kommer munkar att parera nästa fysiska attack mot dem, även om den annars skulle ha träffat. Munkar bygger upp fokus snabbare vid rörelse och långsammare i direkt strid.
actors.mobs.monk$focus.name=fokuserad
actors.mobs.monk$focus.desc=Denna munk är helt fokuserad på sitt mål och verkar förutse deras rörelser innan de gör dem. \n\nNär de är fokuserade kommer nästa fysiska attack mot denna karaktär garanterat att missa, oavsett omständigheterna. Att parera denna attack kommer att förbruka munkens fokus, och de måste bygga upp det igen för att parera en annan attack. Munkar bygger upp fokus snabbare när de rör sig.

actors.mobs.phantompiranha.name=fantom piranha
actors.mobs.phantompiranha.teleport_away=Den fantomliknande pirayan teleporterar bort...
actors.mobs.phantompiranha.desc=Fantom-piranhas är en sällsynt art av piranhas med magiska förmågor och kusliga genomskinliga kroppar. De kan teleportera sig när de attackeras, antingen för att fly eller för att snabbt komma nära sin fiende!\n\nDe är irriterande att slåss mot, men deras kött är uppskattat för sina magiska egenskaper.

actors.mobs.piranha.name=jättepiraja
actors.mobs.piranha.desc=Dessa köttätande fiskar odlas specifikt för att skydda översvämmade områden. Deras bett är dödligt, så det är bäst att undvika att konfrontera dem direkt.
actors.mobs.piranha.discover_hint=Du kan hitta denna fiende överallt i fängelsehålan.

actors.mobs.pylon.name=ledningsstolpe
actors.mobs.pylon.desc_inactive=En kraftpylon som är avsedd att reglera elen som driver maskinerna i detta område.\n\nPylon är för närvarande inaktiv och immun mot skador.
actors.mobs.pylon.desc_active=En kraftpylon som är avsedd att reglera elen som driver maskinerna i detta område. Pylon är för närvarande överladdad med elektrisk energi, det måste vara detta som överladdar DM-300!\n\nI detta tillstånd är pyloner sårbara, men kommer att leda elektricitet till närliggande celler i ett mönster medurs. På grund av sin tunga metallkonstruktion är pyloner motståndskraftiga mot stora skador.

actors.mobs.rat.name=kloakråtta
actors.mobs.rat.desc=Kloakråttor är aggressiva men ganska svaga invånare i kloakerna. De har ett otäckt bett, men är bara livsfarliga i stora antal.

actors.mobs.ripperdemon.name=ripper demon
actors.mobs.ripperdemon.leap=Ripper-demonen förbereder sig för att hoppa!
actors.mobs.ripperdemon.desc=Dessa fasansfulla varelser är resultatet av att de många dvärglik som finns i denna region har utnyttjats av demoniska krafter. Rippers är utmärglade, ghoul-liknande varelser som liknar dvärgar, men med sönderslagna kroppar och långa, vassa klor av ben. \n\nRipper-demoner är inte särskilt tåliga, men de är smidiga och farliga. De kan hoppa långa sträckor för att snabbt nå sina mål innan de spetsar dem med sina klor.

actors.mobs.rotheart.name=röthjärta
actors.mobs.rotheart.desc=En rotbärsfrukt är mycket unik. Istället för att ruttna och ge näring växer frukten, hårdnar och omsluter fröet. Den skyddar de inre organen som växer inuti frukten. Denna gigantiska kula kallas hjärtat av en vuxen rotbärsplanta.
actors.mobs.rotheart.discover_hint=Du kan hitta denna fiende under ett specifikt uppdrag.

actors.mobs.rotlasher.name=rötpryglare
actors.mobs.rotlasher.desc=Rötpryglare är en del av en mogen rötbärsplants rotstruktur och även deras främsta försvarsmedel. Pryglare är blinda och fastsittande i marken, men attackerar våldsamt alla hot i närheten efter att ha upptäckt dem. När det inte finns några fiender i närheten står de stilla och försöker smälta in i omgivande vegetation.
actors.mobs.rotlasher.discover_hint=Du kan hitta denna fiende under ett specifikt uppdrag.

actors.mobs.scorpio.name=skorpio
actors.mobs.scorpio.desc=Dessa enorma spindelliknande demoniska varelser undviker närstrid och föredrar att avfyra förlamande taggiga spikar från långa avstånd.

actors.mobs.senior.name=äldre munk
actors.mobs.senior.desc=Dessa munkar är fanatiker som har ägnat sig åt att skydda sin kung med fysisk styrka. Deras hängivenhet är så stor att de helt har överlämnat sina sinnen till sin kung och nu vandrar omkring i dvärgstaden som tanklösa zombier. Denna munk har bemästrat konsten att slåss man mot man och kan fokusera vid rörelse mycket snabbare än vanliga munkar. När de blir fokuserade kommer munkarna att parera nästa fysiska attack mot dem, även om den annars garanterat skulle träffa. Munkar bygger upp fokus snabbare när de är i rörelse och långsammare när de är i direkt strid.

actors.mobs.shaman.name=gnoll shaman
actors.mobs.shaman.bolt_kill=Det magiska skottet dödade dig...
actors.mobs.shaman.desc=Gnollshamaner är intelligenta gnoller som använder stridsbesvärjelser för att kompensera för sin brist på styrka. De har en mycket respekterad ställning i gnollsamhället, trots sin svagare styrka.
actors.mobs.shaman$redshaman.spell_desc=Denna shaman bär en röd mask och använder magi som tillfälligt _försvagar din attackkraft._
actors.mobs.shaman$blueshaman.spell_desc=Denna shaman bär en blå mask och använder magi som tillfälligt _ökar skadan du tar._
actors.mobs.shaman$purpleshaman.spell_desc=Denna shaman bär en lila mask och använder magi som tillfälligt _minskar din träffsäkerhet och undvikandeförmåga._

actors.mobs.armoredbrute.name=armerad best
actors.mobs.armoredbrute.desc=De mest erfarna gnollbrutarna bär ofta kraftfull rustning för att visa sin status. Rustningen gör dessa brutare mycket mer motståndskraftiga mot fysisk skada, och deras större disciplin innebär att de kan rasa mycket längre innan de dukar under för sina skador.

actors.mobs.skeleton.name=skelett
actors.mobs.skeleton.explo_kill=Du dog av explosionen av ben...
actors.mobs.skeleton.def_verb=blockerat
actors.mobs.skeleton.desc=Skelett består av ben från olyckliga äventyrare och invånare i fängelset, som väcks till liv av ond magi från djupet under jorden. När de har skadats tillräckligt går skelett sönder i en explosion av ben. Splitter från explosionen är skadliga för allt i närheten, men rustningar är mycket effektiva för att mildra skadorna.

actors.mobs.slime.name=slem
actors.mobs.slime.def_verb=blockerat
actors.mobs.slime.desc=Slimes är märkliga, något magiska varelser med en gummiaktig yta och en flytande kärna. Stadens avlopp förser dem med rikligt med vatten och näringsämnen.\n\nPå grund av deras elastiska yttre membran är det svårt att åsamka slimes mer än _6 skada_ med en enda attack.

actors.mobs.snake.name=kloakorm
actors.mobs.snake.hint=Försök använda undersöka-knappen på en orm för att lära dig hur du kan bekämpa dem.
actors.mobs.snake.desc=Dessa överdimensionerade ormar kan snabbt slingra sig undan slag, vilket gör dem ganska svåra att träffa. Magiska attacker eller överraskningsattacker kan dock få dem på fel fot.\n\nDu kan utföra en överraskningsattack genom att attackera vid en dörröppning. Ett sätt är att låta ormen jaga dig genom en dörröppning och sedan _slå till precis när den kommer in genom dörren._

actors.mobs.spectralnecromancer.name=spektral nekromant
actors.mobs.spectralnecromancer.desc=Vid Skelett är en nekromantikers bröd och smör, men vissa föredrar att leta efter andra, mindre kroppsliga underhuggare. Spektrala nekromantikare har valt vålnader som sina underhuggare!

actors.mobs.spinner.name=grottspinnare
actors.mobs.spinner.desc=Dessa grönaktiga, håriga grottspindlar försöker undvika direkt strid. Istället föredrar de att vänta på avstånd medan deras offer kämpar i deras utsöndrade spindelnät och långsamt dör av deras giftiga bett. De kan skjuta sina nät långa sträckor och försöker blockera alla vägar som deras byte tar.

actors.mobs.statue.name=animerad staty
actors.mobs.statue.def_verb=blockerat
actors.mobs.statue.desc=Man skulle kunna tro att det bara är ännu en livlös staty i denna fängelsehåla, men dess glödande röda ögon avslöjar den.
actors.mobs.statue.desc_weapon=Vid statyn är gjord av sten, men _%s_ den håller i ser verklig ut.
actors.mobs.statue.discover_hint=Du kan hitta denna fiende överallt i fängelsehålan.

actors.mobs.succubus.name=succubus
actors.mobs.succubus.desc=Succubi är formskiftande demoner som manipulerar sina bytens sinnen. Den här har tagit formen av en blek gotisk humanoid, kanske för att locka dvärgiska häxmästare?\n\nSuccubi kan tillfälligt förtrolla sina fiender när de attackerar, vilket gör att fienderna inte kan attackera dem direkt. När succubi attackerar en förtrollad fiende stjäl de en del av deras livskraft.

actors.mobs.swarm.name=svärm av flugor
actors.mobs.swarm.desc=Den dödliga flugsvärmen surrar ilsket. Varje icke-magisk attack delar upp den i två mindre men lika farliga svärmar.

actors.mobs.tengu.name=Tengun
actors.mobs.tengu.notice_gotcha=Fick dig, %s!
actors.mobs.tengu.interesting=Låt oss göra detta mer intressant...
actors.mobs.tengu.notice_have=Nu har jag dig, %s!
actors.mobs.tengu.defeated=Äntligen fri...
actors.mobs.tengu.rankings_desc=Mördad av tengun
actors.mobs.tengu.desc=En berömd och gåtfull lönnmördare, uppkallad efter masken som är fastsatt på hans ansikte.\n\nTengu hålls fast med stora klämmor på handlederna och knäna, men han verkar ha gjort sig av med kedjorna för länge sedan.\n\nHan kommer att försöka använda fällor, bedräglig magi och precisa attacker för att eliminera det enda som hindrar honom från att fly: dig.

actors.mobs.tengu$bombability$bombblob.desc=Ett moln av supervärmd rök böljar här. Se upp, det kommer explodera!
actors.mobs.tengu$bombability$bombitem.name=Rökbomb
actors.mobs.tengu$bombability$bombitem.cant_pickup=Den är fast på marken. Du kan inte flytta den!
actors.mobs.tengu$bombability$bombitem.desc=Tengu har kastat en konstig rökbomb här, som sprider en tjock, het rök. Den avger ett högt tickande ljud, som om den räknar ner till en explosion!\n\nBomben har fastnat i marken, så du kan inte plocka upp den.

actors.mobs.tengu$fireability$fireblob.desc=Tengu har kastat ett fint pulver som verkar fånga ånga här, det är på väg att antändas!

actors.mobs.tengu$shockerability$shockerblob.desc=Elektrisk energi byggs upp här, allt som står på denna ruta kommer att få en stöt nästa tur!
actors.mobs.tengu$shockerability$shockeritem.name=Shockare
actors.mobs.tengu$shockerability$shockeritem.cant_pickup=Den pumpar ut för mycket elektricitet! Du kan inte ta tag i den!
actors.mobs.tengu$shockerability$shockeritem.desc=Tengu har kastat en märklig maskin här, som verkar vara gjord av DM-100-delar. Maskinen avger ständigt elektriska gnistor, men det verkar följa ett förutsägbart mönster.\n\nMed all elektricitet som avges runt den är det omöjligt att plocka upp den.

actors.mobs.thief.name=galen tjuv
actors.mobs.thief.stole=Tjuven stal %s från dig!
actors.mobs.thief.carries=\n\nTjuven bär en _%s._ Självklart stulen.
actors.mobs.thief.escapes=Tjuven kommer undan med din %s!
actors.mobs.thief.desc=Även om dessa fångar rör sig fritt utanför sina celler är detta fortfarande deras fängelse. Med tiden har denna plats tagit både deras sinnen och deras frihet. För länge sedan glömde dessa galna tjuvar och banditer vem de är och varför de stjäl.\n\nDessa fiender är mer benägna att stjäla och fly än att slåss. Se till att hålla dem i sikte, annars kanske du aldrig får tillbaka det du har stulit.

actors.mobs.tormentedspirit.name=plågad ande
actors.mobs.tormentedspirit.desc=Plågade andar är annars godmodiga andar som har drabbats av en förbannelse. Så länge de är förbannade kommer de att attackera precis som vålnader, och de är dessutom starkare! \n\nDet kan vara möjligt att rena förbannelsen genom att använda rätt föremål vid andens sida. Om förbannelsen hävs kommer anden säkert att vara tacksam...
actors.mobs.tormentedspirit.thank_you=Tack...

actors.mobs.vaultrat.desc=Denna råtta har några beteendeförändringar för att testa ny AI för fiender i valvet:\n_-_ Dess rörelser kan ”höras” genom väggar\n_-_ Den vandrar längs en förinställd patrullrutt\n_-_ När den vandrar har den kraftigt reducerad detektionsräckvidd bakom den riktning den rör sig i.\n_-_ När den sover minskar dess upptäcktsräckvidd också\n_-_ När den upptäcker dig kommer den att ”undersöka” innan den övergår till jakt. Undersökande fiender rör sig mot dig men attackerar inte och är lättare att skaka av sig bakom dörrar och hörn.

actors.mobs.npcs.vaultsentry.name=valvsökande vaktpost
actors.mobs.npcs.vaultsentry.desc=Denna vakt skannar området enligt ett mönster. Eftersom detta bara är ett testområde kommer vakten inte att göra något om den upptäcker dig.

actors.mobs.npcs.vaultlaser.name=valvlaservakt
actors.mobs.npcs.vaultlaser.desc=Denna vakt skjuter laserstrålar med jämna mellanrum. Eftersom detta bara är ett testområde kommer laserstrålarna inte att skada dig.

actors.mobs.warlock.name=häxmästardvärg
actors.mobs.warlock.bolt_kill=Skuggskottet dödade dig...
actors.mobs.warlock.desc=När dvärgarnas intressen skiftade från teknik till mystiska konster, tog häxmästare makten i staden. De började med elementärmagi, men övergick snart till demonologi och nekromanti. Den starkaste av dessa häxmästare tog över tronen i dvärgstaden, och hans anhängare fick fortsätta utöva sin mörka magi så länge de överlämnade sin fria vilja till honom. Dessa häxmästare besitter kraftfull störande magi och kan tillfälligt hindra uppgraderingsmagi som används på din utrustning. Ju mer uppgraderad en föremål är, desto starkare påverkas den.

actors.mobs.wraith.name=vålnad
actors.mobs.wraith.desc=En vålnad är en hämndlysten ande av en syndare vars grav eller gravplats har störts. Eftersom den är en eterisk varelse är den mycket svår att träffa med vanliga vapen.
actors.mobs.wraith.discover_hint=Du kan hitta denna fiende överallt i fängelsehålan.

actors.mobs.yogdzewa.name=Yog-Dzewa
actors.mobs.yogdzewa.notice=JAG. SER. DIG.
actors.mobs.yogdzewa.darkness=Mörkret drar sig närmare...
actors.mobs.yogdzewa.hope=DITT. HOPP. ÄR. EN. ILLUSION!
actors.mobs.yogdzewa.defeated=...
actors.mobs.yogdzewa.rankings_desc=Slukad av Yog-Dzewa
actors.mobs.yogdzewa.desc=Yog-Dzewa är en gammal gud, ett stort monster som sträcker sig in i dödliga världar och slukar dem för att driva sin oändliga tillväxt. Dvärgarna måste ha observerat denna kosmiska skräck vid sina experiment med svart magi och har sedan dess försökt hålla den instängd.\n\nYog-Dzewa härstammar från en dimension av rå magisk kaos och kan inte visa sin sanna form i denna värld. Istället har den skapat avatarer och kallat på demoniska tjänare som utför dess vilja här.\n\nDetta gigantiska öga är centrum för Yog-Dzewas makt i denna värld. Ögat är orörligt, men kan skjuta kraftfulla strålar av demonisk magi och kalla på en mängd olika tjänare som hjälper det.
actors.mobs.yogdzewa.desc_spawners=Du kan känna vågor av demonisk energi stråla mot ögat från våningarna ovanför. Något du lämnade vid liv där uppe måste leda tillbaka kraften till Yog-Dzewa. _Yog kommer att använda denna energi för att kalla fram ännu mäktigare tjänare!_
actors.mobs.yogdzewa$larva.name=guds larv
actors.mobs.yogdzewa$larva.rankings_desc=Slukad av Yog-Dzewa
actors.mobs.yogdzewa$larva.desc=Dessa små avkommor till Yog-Dzewa är enkla underhuggare som är lätta att framställa. Vid var för sig är de svaga, men de kan framkallas snabbt och bli överväldigande i stort antal.
actors.mobs.yogdzewa$yogripper.rankings_desc=Slukad av Yog-Dzewa
actors.mobs.yogdzewa$yogeye.rankings_desc=Slukades av Yog-Dzewa
actors.mobs.yogdzewa$yogscorpio.rankings_desc=Slukades av Yog-Dzewa

actors.mobs.yogfist.invuln_warn=Knytnäven är osårbar vid ögat!
actors.mobs.yogfist.rankings_desc=Slukad av Yog-Dzewa
actors.mobs.yogfist.desc=Denna näve är en aspekt av Yog-Dzewas makt. Nävarna är kopplade till Yog-Dzewas makt och skyddas från all skada när de är nära ögat.
actors.mobs.yogfist$burningfist.name=brinnande näve
actors.mobs.yogfist$burningfist.desc=Denna näve är formad av kaotisk eldmagik. När den rör sig sätter den ständigt eld på terrängen omkring sig. Den kan också skjuta ut eldstrålar som sprider lågor där de träffar.\n\nNävens förmåga att sprida lågor undertrycks när den är nära vatten, men dess hetta är så stor att allt vatten omkring den förångas vid en kortare tid!
actors.mobs.yogfist$soiledfist.name=smutsad näve
actors.mobs.yogfist$soiledfist.desc=Denna näve är formad av kaotisk jordmagi. När den rör sig får den vegetation att spira omkring sig. Den kan också skjuta koncentrerade jordskurar som snärjer sitt mål i snabbt växande rankor och rötter!\n\nNäven hämtar sin kraft från denna växtlighet och motstår skador baserat på mängden hög eller upprivet vegetation i närheten!
actors.mobs.yogfist$rottingfist.name=ruttnande näve
actors.mobs.yogfist$rottingfist.desc=Denna näve är bildad av levande förruttnelse. Den är en tornande massa av ruttnande kött som kan sprida frätande slem i närstrid och giftig gas på avstånd. Ännu värre är att nävens stora massa gör att den blöder istället för att ta direkt skada. Vatten kan användas för att tvätta bort slemmet, men näven kan också absorbera vatten för att läka sig själv! Dessutom kommer skador på näven vid blödning att återställa blödningen, men inte staplas!
actors.mobs.yogfist$rustedfist.name=rostande näve
actors.mobs.yogfist$rustedfist.desc=Denna näve är gjord av levande metall. Den är en tornande massa av rörlig metall som har kraftfulla närstridsattacker och kan lamslå sina mål på avstånd. På grund av sin enorma massa tar näven all skada som den utsätts för över tid, istället för omedelbart. \n\nNäven är dock oflexibel och kan inte röra sig i trånga passager. Dessutom, vid upprepade träffar, kommer den uppskjutna skadan att fortsätta öka även om den tar skada långsamt.
actors.mobs.yogfist$brightfist.name=lysande näve
actors.mobs.yogfist$brightfist.teleport=Näven teleporteras iväg i en blixt av ljus som bländar dig rejält!
actors.mobs.yogfist$brightfist.desc=Denna knytnäve är gjord av ren ljusenergi. Den kan skjuta kraftfulla strålar av brännande ljus varje tur! Dessa strålar gör dig tillfälligt blind och orsakar dessutom stor skada. Knytnäven kan också kortvarigt omsluta arenan i bländande ljus för att fly!\n\nKnytnäven har dock inga specialförmågor som den kan använda i närstrid.
actors.mobs.yogfist$darkfist.name=mörk näve
actors.mobs.yogfist$darkfist.teleport=Näven teleporterar iväg i en våg av mörker som släcker din ljuskälla!
actors.mobs.yogfist$darkfist.desc=Denna näve är formad av ren mörk energi. Den kan skjuta kraftfulla skurar av mörk magi varje tur! Dessa skurar försvagar din ljuskälla och orsakar dessutom stor skada. Näven kan också kortvarigt omsluta arenan i mörker för att fly!


actors.char.kill=%s dödade dig…
actors.char.defeat=du besegrade %s.
actors.char.def_verb=undvek
actors.char.invulnerable=osårbar
actors.char.immune=immun

# Eternity PD Fallback Keys
actors.blobs.blizzard.desc=A blizzard is swirling here.
actors.blobs.confusiongas.desc=A cloud of confusion gas is swirling here.
actors.blobs.dancefloor.desc=Dance dance dance!\n%s dancing tile: %s\nNext color: %s
actors.blobs.dancefloor.color_1_name=Red
actors.blobs.dancefloor.color_1_desc=Characters standing on this tile take direct damage (massively increased vs hero)
actors.blobs.dancefloor.color_2_name=Green
actors.blobs.dancefloor.color_2_desc=Characters standing on this tile act at 2x speed
actors.blobs.dancefloor.color_3_name=Blue
actors.blobs.dancefloor.color_3_desc=Characters standing on this tile are stunned
actors.blobs.dancefloor.color_4_name=White
actors.blobs.dancefloor.color_4_desc=Characters standing on this tile take defered damage (massively increased vs hero)
actors.blobs.dancefloor.color_5_name=Yellow
actors.blobs.dancefloor.color_5_desc=Mobs killed on this tile give double EXP and more loot
actors.blobs.dancefloor.color_6_name=Purple
actors.blobs.dancefloor.color_6_desc=Characters standing on this tile take double damage
actors.blobs.dancefloor.rankings_desc=Danced into a grave
actors.blobs.dancefloor.ondeath=You danced into your own grave
actors.blobs.dancefloor$dancingdefereddamage.name=Dancing with Death
actors.blobs.dancefloor$dancingdefereddamage.desc=This is the most dangerous dance you've ever performed, and you are absolutely _ROCKING_ it, disregarding the pain!\n\nDeferred damage remaining: %d.
actors.blobs.dancefloor$dancingdefereddamage.ondeath=You danced into your own grave
actors.blobs.dancefloor$dancingdefereddamage.rankings_desc=Danced into a grave
actors.blobs.dancefloor$dancingdoom.name=Dancing in a grave
actors.blobs.dancefloor$dancingdoom.desc=Grave isn't the best place to dance in, but no one is stopping you!\n\nCharacters who are brave enough to dance in a grave will receive double damage from all sources.
actors.blobs.dancefloor$dancespeed.name=Dancing with Time
actors.blobs.dancefloor$dancespeed.desc=Your perfect dance synchronized with a rhythm of the universe, and not even time gonna stop you from dancing!\n\nWhile you dance is perfect, you will perform all actions at double speed.
actors.blobs.dancefloor$dancingstun.name=Stunned
actors.blobs.dancefloor$dancingstun.heromsg=You are stunned!
actors.blobs.dancefloor$dancingstun.desc=Nothing feels worse than being stunned in a middle of a dance\n\nStun completely halts all actions, forcing the target to wait until the effect wears off.
actors.blobs.electricity.desc=A field of electricity is sparking brightly here.
actors.blobs.electricity.rankings_desc=Electrocuted
actors.blobs.electricity.ondeath=You were shocked to death...
actors.blobs.fire.desc=A fire is raging here.
actors.blobs.foliage.desc=Shafts of light pierce the gloom of the underground garden.
actors.blobs.freezing.desc=The air is unnaturally frigid here.
actors.blobs.goowarn.desc=Specks of dark energy are swarming here!
actors.blobs.inferno.desc=An inferno is raging here.
actors.blobs.paralyticgas.desc=A cloud of paralytic gas is swirling here.
actors.blobs.sacrificialfire.desc=There is an altar here with a sacrificial fire burning atop it. Any creature that's killed here will be consumed as an offering to the spirits of the dungeon.\n\nPerhaps a reward will be given if enough sacrifices are made?
actors.blobs.sacrificialfire.worthy=The fire consumes your offering and grows stronger.
actors.blobs.sacrificialfire.unworthy=The fire consumes your offering, but doesn't change.
actors.blobs.sacrificialfire.reward=The fire flares and then dissipates, leaving a reward behind!
actors.blobs.smokescreen.desc=A cloud of thick black smoke is swirling here.
actors.blobs.stenchgas.desc=A cloud of fetid stench is swirling here.
actors.blobs.stormcloud.desc=A cloud of billowing water vapor is swirling here.
actors.blobs.toxicgas.desc=A greenish cloud of toxic gas is swirling here.
actors.blobs.toxicgas.rankings_desc=Suffocated
actors.blobs.toxicgas.ondeath=You died from the toxic gas...
actors.blobs.corrosivegas.desc=A cloud of deadly caustic gas is swirling here.
actors.blobs.waterofawareness.procced=As you take a sip, you feel knowledge pour into your mind.
actors.blobs.waterofawareness.desc=Power of knowledge radiates from the water of this well. Take a sip from it to reveal all secrets of equipped items and reveal all items on the current floor.
actors.blobs.waterofhealth.procced=As you take a sip, you feel your wounds heal completely.
actors.blobs.waterofhealth.desc=Power of health radiates from the water of this well. Take a sip from it to heal your wounds and satisfy hunger.
actors.blobs.wateroftransmutation.desc=Power of change radiates from the water of this well. Throw an item into the well to turn it into something else.
actors.blobs.web.desc=A thick web is covering everything here. Anything that touches or is thrown through the web will break it, but will also be stuck in place.
actors.buffs.adrenaline.name=adrenaline
actors.buffs.adrenaline.desc=A surge of physical power, adrenaline enhanced both attack and movement speed.\n\nAdrenaline allows its target to run at 2x speed, and attack at 1.5x speed.\n\nTurns remaining: %s.
actors.buffs.adrenalinesurge.name=strength boost
actors.buffs.adrenalinesurge.desc=A surge of great might, but sadly not permanent.\n\nStrength boost: +%d.\nTurns until boost weakens: %s.
actors.buffs.amok.name=amok
actors.buffs.amok.desc=Amok causes a state of great rage and confusion in its target.\n\nWhen a creature is amoked, they will attack whatever is near them, whether they be friend or foe.\n\nTurns of amok remaining: %s.
actors.buffs.arcanearmor.name=arcane armor
actors.buffs.arcanearmor.desc=A thin shield is surrounding you, blocking some of the damage from magical attacks.\n\nYour magical armor is currently boosted by: 0-%d.\n\nTurns until arcane armor weakens: %s.
actors.buffs.artifactrecharge.name=artifact recharging
actors.buffs.artifactrecharge.desc=Energy is coursing through you, increasing the rate your equipped artifacts charge.\n\nEach artifact is affected a little differently, but they will all gain charge much faster than normal.\n\nTurns remaining: %s.
actors.buffs.ascensionchallenge.name=amulet's curse
actors.buffs.ascensionchallenge.desc=Somehow Yog-Dzewa is maintaining influence on this world through the amulet, and is trying to stop your ascent!\n\nYog's power is making the dungeon much more dangerous, increasing the number of enemies and making them stronger! This power will keep building if left unchecked, it can be weakened by defeating enemies that have been enhanced by Yog's power.
actors.buffs.ascensionchallenge.desc_clear=The dark energy radiating from the amulet has been weakened as much as possible for now.
actors.buffs.ascensionchallenge.desc_beckon=The amulet is currently _calling out to distant enemies,_ alerting them to your position.
actors.buffs.ascensionchallenge.desc_haste=The amulet is currently _hastening distant enemies,_ letting them reach you faster!
actors.buffs.ascensionchallenge.desc_slow=The amulet is currently _slowing you down,_ and negating speed boosting effects!
actors.buffs.ascensionchallenge.desc_damage=The energy from the amulet has gotten so strong that it's _directly harming you!_
actors.buffs.ascensionchallenge.beckon=The amulet begins calling out to distant enemies.
actors.buffs.ascensionchallenge.haste=The amulet begins hastening distant enemies!
actors.buffs.ascensionchallenge.slow=The amulet starts to feel like a lead weight in your inventory!
actors.buffs.ascensionchallenge.damage=The amulet begins radiating dark energy. It burns!
actors.buffs.ascensionchallenge.weaken_info=You must defeat enemies to weaken the amulet's curse!
actors.buffs.ascensionchallenge.weaken=You can feel the amulet's curse weaken slightly.
actors.buffs.ascensionchallenge.break=You take a moment to catch your breath and feel your wounds begin to close!
actors.buffs.ascensionchallenge.almost=You feel Yog's grip on the amulet begin to weaken, you're almost there!
actors.buffs.ascensionchallenge.on_kill=The dark energy consumes you...
actors.buffs.barkskin.name=barkskin
actors.buffs.barkskin.desc=Your skin is hardened, it feels rough and solid like bark.\n\nThe hardened skin increases your effective armor, allowing you to better defend against physical attack.\n\nYour armor is currently increased by: 0-%d.\nTurns until barkskin weakens: %s.\n\nIf you receive barkskin from multiple sources, only the strongest one will apply.
actors.buffs.barrier.name=barrier
actors.buffs.barrier.desc=A durable bubble of force which blocks all damage.\n\nThe barrier will take damage for whatever it is protecting so long as there is shielding left. The shielding will also slowly decay over time.\n\nShielding remaining: %d.
actors.buffs.rageshield.name=Determination Shield
actors.buffs.rageshield.heromsg=You are protected by your rage!
actors.buffs.rageshield.desc=A durable bubble of your sheer rage saps away life force from nearby enemies, if you are wounded.\n\nThe barrier will drain health from enemies in your sight, angering them and taking damage. The shielding will have bigger effect if enemy is in adjacent to host.\n\nShielding remaining: %d.
actors.buffs.berserk.angered=angered
actors.buffs.berserk.berserk=berserking
actors.buffs.berserk.exhausted=exhausted
actors.buffs.berserk.recovering=recovering
actors.buffs.berserk.angered_desc=The severity of the Berserker's injuries strengthen his blows. As the berserker takes physical damage, his rage will build, granting him bonus damage. Damage which is blocked by armor still counts towards building rage.\n\nRage will fade over time. The lower the berserker's health, the longer it will last.\n\nAt 100%% rage, the Berserker can go berserk, granting him 2x his seal's max shielding, increasing to 6x if he has very low health. This shielding decays over time and once it runs out the berserker will have to rest before building rage again.\n\nCurrent Rage: _%.0f%%_\n_+%.0f%%_ damage
actors.buffs.berserk.berserk_desc=Fear and uncertainty bleed away, leaving only anger. In this state the Berserker is extremely powerful, _dealing +50% damage and gaining bonus shielding._\n\nThis bonus shielding is equal to 2x his seal's max shielding, increasing to 6x if he has very low health. When this shielding is reduced to 0, berserking will end.\n\nAfter raging, the Berserker will need to recover before being able to build rage again.
actors.buffs.berserk.recovering_desc=Inner strength has its limits. The Berserker must rest before using his rage again.\n\nWhile recovering the Berserker does not build any rage from taking damage.
actors.buffs.berserk.recovering_desc_turns=Turns until recovered: _%d_
actors.buffs.berserk.recovering_desc_levels=Levels until recovered: _%.2f_
actors.buffs.berserk.rankings_desc=Berserked to Death
actors.buffs.berserk.action_name=Berserk
actors.buffs.berserk.no_seal=You need your broken seal to berserk!
actors.buffs.bleeding.name=bleeding
actors.buffs.bleeding.ondeath=You bled to death...
actors.buffs.bleeding.heromsg=You are bleeding!
actors.buffs.bleeding.rankings_desc=Bled to Death
actors.buffs.bleeding.desc=That wound is leaking a worrisome amount of blood.\n\nBleeding causes damage every turn. Each turn the damage decreases by a random amount, until the bleeding eventually stops.\n\nCurrent bleed damage: %d.
actors.buffs.bless.name=blessed
actors.buffs.bless.desc=A great burst of focus, some say it is inspired by the gods.\n\nBlessing increases accuracy and evasion by 25%%, making the blessed much more effective in combat.\nIt also increased experience gain by 2x for heroes and allows them to get more items.\n\nTurns of bless remaining: %s.
actors.buffs.blindness.name=blinded
actors.buffs.blindness.heromsg=You are blinded!
actors.buffs.blindness.desc=Blinding turns the surrounding world into a dark haze.\n\nWhile blinded, a character's vision range is reduced to one tile, rendering ranged attacks useless and making it very easy to lose track of distant enemies. Additionally, a blinded hero is unable to read scrolls or books.\n\nTurns of blindness remaining: %s.
actors.buffs.buff.heromsg=
actors.buffs.burning.name=burning
actors.buffs.burning.heromsg=You catch fire!
actors.buffs.burning.burnsup=%s burns up!
actors.buffs.burning.ondeath=You burned to death...
actors.buffs.burning.rankings_desc=Burned to Ash
actors.buffs.burning.desc=Few things are more distressing than being engulfed in flames.\n\nFire will deal damage every turn until it is put out by water or it expires. Fire can be extinquished by stepping into water, or from the splash of a shattering potion.\n\nAdditionally, the fire may ignite flammable terrain or items that it comes into contact with.\n\nTurns of burning remaining: %s.
actors.buffs.championenemy.warn=You sense a deadly presence.
actors.buffs.championenemy$blazing.name=blazing champion
actors.buffs.championenemy$blazing.desc=Blazing champions deal 25% more melee damage, ignite enemies they attack, are immune to fire, and spread fire around them as they die. They can't spread fire onto water however.
actors.buffs.championenemy$projecting.name=projecting champion
actors.buffs.championenemy$projecting.desc=Projecting champions deal 25% more melee damage and have +3 attack range.
actors.buffs.championenemy$antimagic.name=antimagic champion
actors.buffs.championenemy$antimagic.desc=Antimagic champions take 50% less damage and are completely immune to magical effects.
actors.buffs.championenemy$giant.name=giant champion
actors.buffs.championenemy$giant.desc=Giant champions take 80% less damage and have +1 attack range, but cannot move through enclosed spaces.
actors.buffs.championenemy$blessed.name=blessed champion
actors.buffs.championenemy$blessed.desc=Blessed champions have 4x accuracy and evasion.
actors.buffs.championenemy$growing.name=growing champion
actors.buffs.championenemy$growing.desc=Growing champions gain a steadily increasing bonus to accuracy, evasion, physical damage, and a reduction to damage taken.\n\nCurrent acc/eva/dmg boost: %1$d%%\nCurrent damage reduction: %2$d%%
actors.buffs.championenemy$tanky.name=tanky champion
actors.buffs.championenemy$tanky.desc=Tanky champions receives only 5% of the damage, but reduces their damage and speed by 25%.
actors.buffs.championenemy$speedy.name=speedy champion
actors.buffs.championenemy$speedy.desc=Speedy Champions will gain x4 speed and x1.5 evasion and accuracy.
actors.buffs.championenemy$frozen.name=frozen champion
actors.buffs.championenemy$frozen.desc=Frozen champions deal 25% more melee damage but they have -20% speed, chills enemies they attack and sometimes freezes them, are immune to cold gases or effects, and spread blizzard around them as they die.
actors.buffs.championenemy$blunt.name=blunt champion
actors.buffs.championenemy$blunt.desc=Blunt champions are expert for using their hands or something they use as a blunt weapons, they deal 75% more damage as well as inflicts vertigo when they attack and paralyzes you in rare cases.
actors.buffs.charm.name=charmed
actors.buffs.charm.heromsg=You are charmed!
actors.buffs.charm.cant_attack=You are charmed by that enemy and can't attack them.
actors.buffs.charm.desc=A charm is manipulative magic that can make enemies temporarily adore each other.\n\nCharacters affected by charm are unable to directly attack the enemy they are charmed by. Attacking other targets is still possible however. The shock of pain will lessen the duration of charm.\n\nTurns of charm remaining: %s.
actors.buffs.chill.name=chilled
actors.buffs.chill.freezes=%s freezes!
actors.buffs.chill.desc=Not quite frozen, but still much too cold.\n\nChilled targets perform all actions more slowly, depending on how many turns are left in the effect. At its worst, this is equivalent to being slowed.\n\nTurns of chill remaining: %1$s.\nSpeed is reduced by: %2$s%%
actors.buffs.combo.name=combo
actors.buffs.combo.action_name=combo attack
actors.buffs.combo.combo=%d hit combo!
actors.buffs.combo.bad_target=You must target an enemy in attack range.
actors.buffs.combo.prompt=Select a target to attack.
actors.buffs.combo.desc=The gladiator builds momentum as they land successful blows. Each attack increases the combo counter by one, but taking too long between hits will reset the combo counter to 0.\n\nBuilding combo unlocks special combo attacks that cannot miss! A different attack is unlocked at 2, 4, 6, 8, and 10 combo count. Some moves reset combo and some do not, but each move can only be used once per combo session.\n\nCurrent combo: %1$d.\n\nTurns until Combo is lost: %2$s.
actors.buffs.combo$combomove.clobber.name=clobber
actors.buffs.combo$combomove.clobber.desc=Knocks an enemy back 2 tiles, but deals no damage and cannot knock into pits. Increments combo by 1.
actors.buffs.combo$combomove.clobber.empower_desc=Knocks an enemy back _3 tiles, inflicts vertigo, and can knock into pits,_ but deals no damage. Increments combo by 1.
actors.buffs.combo$combomove.slam.name=slam
actors.buffs.combo$combomove.slam.desc=Deals %d%% (combo*20%%) of your damage blocking power as bonus damage. Resets combo when used.
actors.buffs.combo$combomove.slam.empower_desc=_Leaps up to %1$d tile(s)_ and deals %2$d%% (combo*20%%) of your damage blocking power as bonus damage. Resets combo when used.
actors.buffs.combo$combomove.parry.name=parry
actors.buffs.combo$combomove.parry.desc=Blocks the next attack within 1 turn when activated, and instantly retaliates to it. Resets combo if nothing is parried.
actors.buffs.combo$combomove.parry.empower_desc=Blocks _all attacks_ within 1 turn when activated, and instantly retaliates to them. Resets combo if nothing is parried.
actors.buffs.combo$combomove.crush.name=crush
actors.buffs.combo$combomove.crush.desc=Deals %d%% (combo*25%%) damage to the primary target, and half that damage to all other enemies in a 7x7 AOE. Resets combo when used.
actors.buffs.combo$combomove.crush.empower_desc=_Leaps up to %1$d tile(s)_ and deals %2$d%% (combo*25%%) damage to the primary target, and half that damage to all other enemies in a 7x7 AOE. Resets combo when used.
actors.buffs.combo$combomove.fury.name=fury
actors.buffs.combo$combomove.fury.desc=Hits an enemy once for each combo you have, each hit deals 60% damage and can trigger enchantments. Resets combo when used.
actors.buffs.combo$combomove.fury.empower_desc=_Leaps up to %d tile(s)_ and hits an enemy once for each combo you have, each hit deals 60%% damage and can trigger enchantments. Resets combo when used.
actors.buffs.corruption.name=corrupted
actors.buffs.corruption.desc=Corruption seeps into the essence of a being, twisting them against their former nature.\n\nCorrupted creatures will attack their allies, and ignore their former enemies. Corruption is damaging as well, and will slowly cause its target to succumb.\n\nCorruption is permanent, its effects only end in death.
actors.buffs.cripple.name=crippled
actors.buffs.cripple.heromsg=You are crippled!
actors.buffs.cripple.desc=You're pretty sure legs aren't meant to bend that way.\n\nCrippled halves movement speed, making moving a tile usually take two turns instead of one.\n\nTurns of cripple remaining: %s.
actors.buffs.daze.name=dazed
actors.buffs.daze.heromsg=You are dazed!
actors.buffs.daze.desc=Ringing ears and blurred vision make it difficult to fight.\n\nWhile dazed, accuracy and evasion are reduced by 50%%, making both landing and evading blows much harder.\n\nTurns of daze remaining: %s.
actors.buffs.degrade.name=degraded
actors.buffs.degrade.heromsg=Your equipment feels weaker!
actors.buffs.degrade.desc=Powerful dark magic is sapping the strength that scrolls of upgrade have applied to your equipment!\n\nWhile degraded, upgraded gear will be treated as if it is a lower level than it actually is. _Every upgrade after +3 becomes exponentially weaker than the last one._ The descriptions of your items will change to reflect their reduced power level.\n\nDegradation does not affect strength requirements, wand charges, durability of thrown weapons, or artifacts.\n\nTurns of degradation remaining: %s. Using a scroll of upgrade or remove curse will end degradation immediately.
actors.buffs.doom.name=doomed
actors.buffs.doom.desc=It's hard to keep going when it seems like the universe wants you dead.\n\nDoomed characters will receive +67% damage from all sources.\n\nDoom is permanent, its effects only end in death.
actors.buffs.dread.name=dread
actors.buffs.dread.desc=A terror so great that it will cause its target to flee the dungeon entirely!\n\nCreatures affected by dread will run from their opponent at high speed, and will disappear from the dungeon entirely once they are out of sight. Enemies that are defeated this way award half experience and drop no items. The shock of pain will lessen the duration of dread.\n\nTurns of dread remaining: %d.
actors.buffs.drowsy.name=drowsy
actors.buffs.drowsy.desc=A magical force is making it difficult to stay awake, after a few turns, the target will fall into a deep magical sleep.\n\nThe hero can resist drowsiness by taking damage or by being at full health.\n\nTurns until sleep: %s.
actors.buffs.earthimbue.name=imbued with earth
actors.buffs.earthimbue.desc=You are imbued with the power of earth!\n\nAll physical attacks will shift the earth under the enemy, crippling them for a short time.\n\nTurns of earth imbue remaining: %s.
actors.buffs.enhancedrings.name=enhanced rings
actors.buffs.enhancedrings.desc=The Rogue's recently used artifact is empowering his rings, granting them +1 level.\n\nTurns remaining: %s.
actors.buffs.fireimbue.name=imbued with fire
actors.buffs.fireimbue.desc=You are imbued with the power of fire!\n\nAll physical attacks will have a chance to light enemies ablaze. Additionally, you are completely immune to the effects of fire.\n\nTurns of fire imbue remaining: %s.
actors.buffs.foresight.name=foresight
actors.buffs.foresight.desc=You are somehow able to see the layout of surrounding terrain with your mind.\n\nWhile under the effect of foresight all tiles in a wide radius are revealed to you, including any secret traps or doors.\n\nTurns of foresight remaining: %s.
actors.buffs.frost.name=frozen
actors.buffs.frost.freezes=%s freezes!
actors.buffs.frost.desc=Not to be confused with freezing solid, this more benign freezing simply encases the target in ice.\n\nFreezing acts similarly to paralysis, making it impossible for the target to act. Unlike paralysis, freezing is immediately cancelled if the target takes damage, as the ice will shatter.\n\nTurns of freeze remaining: %s.
actors.buffs.frostimbue.name=imbued with frost
actors.buffs.frostimbue.desc=You are imbued with icy power!\n\nAll physical attacks will steadily stack chill on enemies. Additionally, you are completely immune to the cold.\n\nTurns of frost imbue remaining: %s.
actors.buffs.fury.name=furious
actors.buffs.fury.heromsg=You become furious!
actors.buffs.fury.desc=You are angry, enemies won't like you when you're angry.\n\nA great rage burns within you, increasing the damage you deal with physical attacks by 50%%.\n\nThis rage will last as long as you are injured below 50%% health.
actors.buffs.blobimmunity.name=purification barrier
actors.buffs.blobimmunity.desc=Some strange force is encasing you in a thin protective barrier, blocking out all harmful airborne effects.\n\nYou are immune to all area-bound effects while this barrier lasts.\n\nTurns of immunity remaining: %s.
actors.buffs.greaterhaste.name=greater haste
actors.buffs.greaterhaste.desc=An incredible boost of speed, for a moment it feels as if everything else is standing still.\n\nWhile under the effects of greater haste moving actions take no time at all, but other actions are still performed at normal speed. Each step of movement consumes a turn of greater haste.\n\nTurns of greater haste remaining: %d.
actors.buffs.godspeed.name=Godspeed
actors.buffs.godspeed.desc=Godly energy courses through your whole essence, allowing you to perform actions at incredible speeds!\n\nWhile under the effects of godspeed you will perform all actions at double speed.\n\nTurns of godspeed remaining: %s.
actors.buffs.haste.name=haste
actors.buffs.haste.desc=Energy courses through your muscles, allowing you to run at incredible speeds!\n\nWhile under the effects of haste you will run at 3x speed, but will perform all other actions at normal speed.\n\nTurns of haste remaining: %s.
actors.buffs.healing.name=healing
actors.buffs.healing.desc=A magical remedy is causing wounds to close and flesh to knit.\n\nEvery turn health will steadily regenerate until the healing effect expires. The amount of healing may fade over time.\n\nNext heal: %d.\n\nHealing remaining: %d.
actors.buffs.herodisguise.name=disguise
actors.buffs.herodisguise.desc=Illusory magic has altered your physical appearance! The effect is purely cosmetic, but feels very strange regardless.\n\nTurns of disguise remaining: %s.
actors.buffs.hex.name=hexed
actors.buffs.hex.heromsg=You have been hexed!
actors.buffs.hex.desc=Dark magic which saps focus, making the target slightly disoriented.\n\nHexing reduces accuracy and evasion by 20%%, making the target less effective in combat.\n\nTurns of hex remaining: %s.
actors.buffs.holdfast.name=hold fast
actors.buffs.holdfast.desc=The %s is holding his position, increasing their armor by %d-%d. This will last until they move.
actors.buffs.hunger.hungry=hungry
actors.buffs.hunger.starving=starving
actors.buffs.hunger.onhungry=You are hungry.
actors.buffs.hunger.onstarving=You are starving!
actors.buffs.hunger.ondeath=You starved to death...
actors.buffs.hunger.cursedhorn=The cursed horn steals some of the food energy as you eat.
actors.buffs.hunger.rankings_desc=Starved to Death
actors.buffs.hunger.desc_intro_hungry=You can feel your stomach calling out for food, but it's not too urgent yet.
actors.buffs.hunger.desc_intro_starving=You're so hungry it hurts.
actors.buffs.hunger.desc=\n\nHunger slowly increases as you spend time in the dungeon, eventually you will begin to starve. While starving you will slowly lose health instead of regenerating it.\n\nRationing is important! If you have health to spare starving isn't a bad idea if it means there will be more food later. Effective rationing can make food last a lot longer!
actors.buffs.invisibility.name=invisible
actors.buffs.invisibility.desc=You are completely blended into the surrounding terrain, making you impossible to see.\n\nWhile you are invisible enemies are unable to attack or follow you. Physical attacks and magical effects (such as scrolls and wands) will immediately cancel invisibility.\n\nTurns of invisibility remaining: %s.
actors.buffs.invulnerability.name=invulnerable
actors.buffs.invulnerability.desc=You are suffused with great protective power, granting you a brief period of invulnerability!\n\nTurns remaining: %s.
actors.buffs.levitation.name=levitating
actors.buffs.levitation.desc=A magical force is levitating you over the ground, making you feel weightless.\n\nLevitating characters move silently and ignore all ground-based effects. Traps won't trigger, water won't put out fire, plants won't be trampled, roots will miss, and pits will be hovered over. Be careful, as all these things can come into effect the second the levitation ends!\n\nTurns of levitation remaining: %s.
actors.buffs.lifelink.name=life link
actors.buffs.lifelink.desc=This character's life force is linked to another character nearby. Any damage taken is shared between them.\n\nWhenever this character takes damage, half of it will be dealt to the life link target instead.\n\nTurns of life link remaining: %s, or until the linked character dies.
actors.buffs.light.name=illuminated
actors.buffs.light.desc=Even in the Darkest Dungeon, a steady light at your side is always comforting.\n\nLight helps keep darkness at bay, allowing you to see a reasonable distance despite the environment.\n\nTurns of illumination remaining: %s.
actors.buffs.lockedfloor.name=floor is locked
actors.buffs.lockedfloor.desc=The current floor is locked, and you are unable to leave it!\n\nWhile a floor is locked, you will not gain hunger or take damage from starving. In addition, if you do not work towards defeating this floor's boss, passive regeneration effects will also stop.\n\nAdditionally, if you are revived by an unblessed ankh while the floor is locked, then it will reset.\n\nKill this floor's boss to break the lock.
actors.buffs.lostinventory.name=lost inventory
actors.buffs.lostinventory.desc=Your inventory has been lost somewhere in the dungeon! You won't be able to pick up or use most items until you retrieve it.
actors.buffs.magicalsight.name=magical sight
actors.buffs.magicalsight.desc=Somehow you are able to see with your mind, rather than your eyes.\n\nWhile magical sight is active you will be able to see through all terrain in a 12 tile radius.\n\nTurns of magical sight remaining: %s.
actors.buffs.magicalsleep.name=magical sleep
actors.buffs.magicalsleep.toohealthy=You are too healthy, and resist the urge to sleep.
actors.buffs.magicalsleep.fallasleep=You fall into a deep magical sleep.
actors.buffs.magicalsleep.wakeup=You wake up feeling refreshed and healthy.
actors.buffs.magicalsleep.desc=This character has fallen into a deep magical sleep which they will not wake from naturally.\n\nMagical sleep is similar to regular sleep, except that only damage will cause the target to wake up.\n\nFor the hero and their allies, magical sleep has some restorative properties, allowing them to rapidly heal while resting.
actors.buffs.magicimmune.name=immune to magic
actors.buffs.magicimmune.desc=All magical effects have lost their hold on you, you are completely impervious to them.\n\nWhile magic immune all harmful and helpful magical effects will not apply to you, including curses, enchants, wands, scrolls, rings, artifacts, etc. Heroic armor abilities are strong enough to work regardless of this effect.\n\nTurns of magic immunity remaining: %s.
actors.buffs.overload.name=Overload
actors.buffs.overload.desc=The reality is overloaded. Prepare to cry, suffer, kill and slaughter.\n\nThe death of any hostile creature triggers the spawn of other creature.\n\nTurns of overload remaining: %s.
actors.buffs.mindvision.name=mind vision
actors.buffs.mindvision.desc=Somehow you are able to see all creatures on this floor through your mind. It's a weird feeling.\n\nAll characters on this floor are visible to you as long as you have mind vision. Seeing a creature through mind vision counts as it being seen or nearby for the purposes of many magical effects.\n\nTurns of mind vision remaining: %s.
actors.buffs.momentum.momentum=building momentum
actors.buffs.momentum.running=freerunning
actors.buffs.momentum.resting=recovering
actors.buffs.momentum.action_name=freerun
actors.buffs.momentum.momentum_desc=As he moves, the Freerunner builds momentum, which he can spend to start freerunning.\n\nEach charge of momentum grants two turns of freerunning, and the Freerunner can build up to 10 charges. Momentum is rapidly lost when the Freerunner stops moving.\n\nCurrent momentum charge: %d.
actors.buffs.momentum.running_desc=As he moves, the Freerunner builds momentum, which he can spend to start freerunning.\n\nWhile freerunning, the Freerunner moves at double speed and gains bonus evasion based on his level.\n\nTurns remaining: %d.
actors.buffs.momentum.resting_desc=As he moves, the Freerunner builds momentum, which he can spend to start freerunning.\n\nThe Freerunner needs time to regain his stamina before building momentum again.\n\nTurns remaining: %d.
actors.buffs.monkenergy.name=energy
actors.buffs.monkenergy.action=Monk Abilities
actors.buffs.monkenergy.desc=As she defeats enemies, the Monk gains energy that she can use on a variety of abilities. Most enemies grant 1 energy when defeated, and the Monk does not lose energy over time.\n\nCurrent energy: %1$d/%2$d.
actors.buffs.monkenergy.desc_cooldown=The Monk has recently used an ability, and must wait before using another.\n\nCurrent cooldown: %d turns.
actors.buffs.monkenergy$monkability$flurry.name=flurry of blows
actors.buffs.monkenergy$monkability$flurry.desc=Two instant strikes that deal %1$d-%2$d damage and ignore armor. This ability cannot be used repeatedly.
actors.buffs.monkenergy$monkability$flurry.empower_desc=Two instant strikes that deal %1$d-%2$d damage, ignore armor, _and use your weapon's enchantment._ This ability cannot be used repeatedly.
actors.buffs.monkenergy$monkability$focus.name=focus
actors.buffs.monkenergy$monkability$focus.desc=The Monk takes a turn to focus, letting her parry the next attack made against her.
actors.buffs.monkenergy$monkability$focus.empower_desc=The Monk _instantly focuses,_ letting her parry the next attack made against her.
actors.buffs.monkenergy$monkability$focus$focusbuff.name=focused
actors.buffs.monkenergy$monkability$focus$focusbuff.desc=The Monk is focused on her surroundings, anticipating the next attack made against her. While focused, she is guaranteed to parry the next incoming attack.
actors.buffs.monkenergy$monkability$dash.name=dash
actors.buffs.monkenergy$monkability$dash.prompt=Choose a Location
actors.buffs.monkenergy$monkability$dash.desc=An instant dash up to 4 tiles away. This ability can go over hazards, but not through enemies or solid terrain.
actors.buffs.monkenergy$monkability$dash.empower_desc=An instant dash up to _8 tiles_ away. This ability can go over hazards, but not through enemies or solid terrain.
actors.buffs.monkenergy$monkability$dragonkick.name=dragon kick
actors.buffs.monkenergy$monkability$dragonkick.desc=A devastating kick that deals %1$d-%2$d damage and ignores armor. The kick knocks the target away and paralyzes them for each tile they travel.
actors.buffs.monkenergy$monkability$dragonkick.empower_desc=A devastating kick that deals _%1$d-%2$d damage_ and ignores armor. The kick knocks _all adjacent targets_ away and paralyzes them for each tile they travel.
actors.buffs.monkenergy$monkability$meditate.name=meditate
actors.buffs.monkenergy$monkability$meditate.desc=The Monk focuses energy into her body for 5 turns. This clears most negative effects and grants her 8 turns of wand and artifact recharging.
actors.buffs.monkenergy$monkability$meditate.empower_desc=The Monk focuses energy into her body for 5 turns. This clears most negative effects and grants her 8 turns of wand and artifact recharging. _She also gains 80% damage resistance while meditating, and slowly heals for 20% of her missing HP._
actors.buffs.killevolution.name=kill counter
actors.buffs.killevolution.action=Kill Abilities
actors.buffs.killevolution.desc=As they defeat enemies, the hero gains energy that they can use on a variety of abilities. Most enemies grant 1 energy when defeated, and the hero does not lose energy over time.\n\n_However, unequipping a weapon associated with this buff associated with will lose all of this energy and you need to start killing enemies again_\n\nCurrent energy: %1$d/%2$d.
actors.buffs.killevolution.desc_cooldown=The hero has recently used an ability, and must wait before using another.\n\nCurrent cooldown: %d turns.
actors.buffs.killevolution$killevolutionability$invisibledash.name=invisible dash
actors.buffs.killevolution$killevolutionability$invisibledash.prompt=Choose a Location
actors.buffs.killevolution$killevolutionability$invisibledash.desc=An instant dash up to 4 tiles away with an additional turn of invisibility allowing the hero to surprise attack. This ability can go over hazards, but not through enemies or solid terrain.
actors.buffs.killevolution$killevolutionability$invisibledash.empower_desc=An instant dash up to _8 tiles_ away with an additional turn of invisibility allowing the hero to surprise attack. This ability can go over hazards, but not through enemies or solid terrain.
actors.buffs.killevolution$killevolutionability$physicallyempowered.name=physical empower
actors.buffs.killevolution$killevolutionability$physicallyempowered.desc=The hero grants itself +2 bonus damage for 10 hits.
actors.buffs.killevolution$killevolutionability$physicallyempowered.empower_desc=The hero grants itself _+4 bonus damage_ for 10 hits.
actors.buffs.killevolution$killevolutionability$weaponupgrade.name=weapon upgrade
actors.buffs.killevolution$killevolutionability$weaponupgrade.desc=The hero upgrades their weapon (and Duelist's second weapon if there's any) permanently.
actors.buffs.killevolution$killevolutionability$weaponupgrade.empower_desc=The hero upgrades their weapon (and Duelist's second weapon if there's any) _twice_ permanently.
actors.buffs.killevolution$killevolutionability$chain.name=chain enemy
actors.buffs.killevolution$killevolutionability$chain.desc=The hero chains an enemy to pull them in closer range.
actors.buffs.killevolution$killevolutionability$immortalize.name=immortalize
actors.buffs.killevolution$killevolutionability$immortalize.desc=The hero grants itself immortality against all sources of damage for 15 turns.
actors.buffs.killevolution$killevolutionability$immortalize.empower_desc=The hero grants itself immortality against all sources of damage for _~22 turns_.
actors.buffs.ooze.name=caustic ooze
actors.buffs.ooze.heromsg=Caustic ooze eats your flesh. Wash it away!
actors.buffs.ooze.ondeath=You melt away...
actors.buffs.ooze.rankings_desc=Dissolved
actors.buffs.ooze.desc=This sticky acid clings to flesh, slowly melting it away.\n\nOoze will deal consistent damage over time, but can be immediately washed off in water.\n\nTurns of ooze remaining: %s.
actors.buffs.paralysis.name=paralysed
actors.buffs.paralysis.heromsg=You are paralysed!
actors.buffs.paralysis.out=resisted paralysis
actors.buffs.paralysis.desc=Oftentimes the worst thing to do is nothing at all.\n\nParalysis completely halts all actions, forcing the target to wait until the effect wears off. The pain from taking damage can cause characters to resist paralysis, breaking them out of the effect.\n\nTurns of paralysis remaining: %s.
actors.buffs.physicalempower.name=physically empowered
actors.buffs.physicalempower.desc=Your blows have been empowered, increasing the amount of damage you can deal when you hit enemies with physical attacks.\n\nBonus damage: %1$d.\nHits remaining: %2$d.
actors.buffs.pincushion.name=pincushion
actors.buffs.pincushion.desc=The thrown weapons you have used against this character are currently stuck to them and will fall to the floor after they are defeated.\n\nThe following items are currently attached:
actors.buffs.poison.name=poisoned
actors.buffs.poison.heromsg=You are poisoned!
actors.buffs.poison.ondeath=You died from poison...
actors.buffs.poison.rankings_desc=Succumbed to Poison
actors.buffs.poison.desc=Poison works its way through the body, slowly impairing its internal functioning.\n\nPoison deals damage each turn proportional to how long until it expires.\n\nTurns of poison remaining: %s.
actors.buffs.preparation.name=preparation
actors.buffs.preparation.action_name=prepared strike
actors.buffs.preparation.desc=The Assassin is walking nervously, preparing to thurst knife into target.
actors.buffs.preparation.desc_dmg=His next attack will deal _%1$d%% bonus damage_, and will execute regular enemies below _%2$d%% health_, or bosses below _%3$d%% health_.
actors.buffs.preparation.desc_dmg_likely=The attack will also be more likely to deal a larger amount of damage.
actors.buffs.preparation.desc_blink=He is able to blink towards an enemy before striking them, with a max distance of _%d._
actors.buffs.preparation.desc_invis_time=The Assassin has been running for _%d turns._
actors.buffs.preparation.desc_invis_next=His attack will become stronger at _%d turns._
actors.buffs.preparation.prompt=Select a target to attack!\nMax blink distance: %d
actors.buffs.preparation.no_target=There's nothing to attack there.
actors.buffs.preparation.out_of_reach=That target is out of reach.
actors.buffs.preparation.assassinated=assassinated
actors.buffs.marked.name=Marked
actors.buffs.marked.desc=The Hunter is waiting patiently, preparing to strike while his bbat weakens enemies.
actors.buffs.marked.desc_dmg=The bbat deals %s%% more damage to this enemy. You will be able to jump to marked enemy at any moment, but more bonus damage means more debuffs.
actors.buffs.marked.prompt=Select a target to teleport!\nMax blink distance: your view distance
actors.buffs.marked.no_target=There's nothing to teleport there.
actors.buffs.marked.out_of_reach=That target is out of reach.
actors.buffs.marked.assassinated=assassinated
actors.buffs.marked.desc_poison=At this point, you will _poison_ a target, dealing damage over time.
actors.buffs.marked.desc_cripple=At this point, you will _cripple_ the legs of target, reducing its movement speed.
actors.buffs.marked.desc_blinding=At this point, you will also make target _blind_,reducing its field of view to 1 tile.
actors.buffs.marked.desc_bleeding=At this point, you will also make target _bleed_,dealing damage over time.
actors.buffs.marked.desc_vulnerable=At this point, you will also _increase physical damage_ to enemy.
actors.buffs.marked.desc_hexed=At this point, you will also stun target, _reducing its accuracy and dexterity_ for short time.
actors.buffs.marked.desc_slow=At this point, you will also disorientate target, _slowing_ its actions.
actors.buffs.marked.desc_ooze=At this point, you will also apply deadly _caustic ooze_ to target, dealing damage over time until target finds water.
actors.buffs.marked.desc_paralysis=At this point, you will completely _paralyse_ the enemy, rendering it unable to attack.
actors.buffs.marked.desc_doom=At this point, you will also curse the enemy, _significantly increasing any damage to it_.
actors.buffs.prismaticguard.name=prismatic Guard
actors.buffs.prismaticguard.desc=You are being guarded by a prismatic image which is currently inactive. When enemies are present the prismatic image will spring to action and protect you!\n\nWhile inactive, the prismatic image will steadily recover from any damage it has taken.\n\nCurrent HP: %d/%d.
actors.buffs.recharging.name=recharging
actors.buffs.recharging.desc=Energy is coursing through you, improving the rate that your wands and staffs charge.\n\nEach turn this buff will increase current charge by one quarter, in addition to regular recharge.\n\nTurns of recharging remaining: %s.
actors.buffs.revealedarea.name=revealed area
actors.buffs.revealedarea.desc=An area of the dungeon has been temporarily revealed to the hero, They will see it no matter where they are.\n\nTurns remaining: %s.
actors.buffs.revealedchar.name=revealed
actors.buffs.revealedchar.desc=This character is revealed to the hero, They will be visible no matter where they are.\n\nTurns remaining: %s.
actors.buffs.roots.name=rooted
actors.buffs.roots.heromsg=You can't move!
actors.buffs.roots.desc=Roots (magical or natural) grab at the feet, forcing them down to the ground.\n\nRoots lock a target in place, making movement and most movement abilities impossible. Other actions are not affected, including teleportation effects.\n\nTurns of root remaining: %s.
actors.buffs.scrollempower.name=scroll empower
actors.buffs.scrollempower.desc=The energy from the Mage's recently read scroll is empowering his wands!\n\nLevel Boost: +%1$d.\nZaps remaining: %2$d.
actors.buffs.shadows.name=shadowmelded
actors.buffs.shadows.desc=You are blended into the shadows around you, granting you invisibility and slowing your metabolism.\n\nWhile you are invisible enemies are unable to attack or follow you. Most physical attacks and magical effects (such as scrolls and wands) will immediately cancel invisibility. Additionally, while shadowmelded, your rate of hunger is slowed.\n\nYou will remain shadowmelded until you leave the shadows or an enemy comes into contact with you.
actors.buffs.slow.name=slowed
actors.buffs.slow.desc=Slowing magic affects the target's rate of time, to them everything is moving super-fast.\n\nA slowed character performs all actions in twice the amount of time they would normally take.\n\nTurns of slow remaining: %s.
actors.buffs.snipersmark.name=sniper's mark
actors.buffs.snipersmark.action_name_snapshot=snapshot
actors.buffs.snipersmark.action_name_volley=volley
actors.buffs.snipersmark.action_name_sniper=sniper shot
actors.buffs.snipersmark.desc=The Sniper is honed in on the target she most recently attacked. She is able to perform a special attack with her bow which will vary based on how the bow is augmented.\n\nAn unaugmented bow will fire a _snapshot,_ which deals reduced damage but does not take any time to fire.\n\nA bow augmented for speed will fire a _volley_ of three arrows. Each arrow will deal reduced damage, but can still activate enchantment. This volley takes 1 turn to shoot.\n\nA bow augmented for damage will fire a _sniper shot._ This shot is guaranteed to hit, deals bonus damage based on distance from the target, and takes 2 turns to fire.\n\nTurns remaining: %s.
actors.buffs.soulmark.name=soul marked
actors.buffs.soulmark.desc=The warlock has tapped into the soul of this creature, allowing him to heal as it takes physical damage.\n\nTurns of soul mark remaining: %s.
actors.buffs.stamina.name=stamina
actors.buffs.stamina.desc=You have unending stamina, allowing for faster movement!\n\nWhile under the effects of stamina you will run at +50%% speed, but will perform all other actions at normal speed.\n\nTurns of stamina remaining: %s.
actors.buffs.vulnerable.name=vulnerable
actors.buffs.vulnerable.heromsg=You feel fragile!
actors.buffs.vulnerable.desc=Vulnerability magic increases all physical damage that a character takes by 33%%, after that damage has been reduced by armor.\n\nTurns of vulnerable remaining: %s.
actors.buffs.terror.name=terrified
actors.buffs.terror.desc=Terror is manipulative magic which forces its target into an uncontrollable panic.\n\nTerrified characters are forced to run away from their opponent, trying to put as many doors and walls between them as possible. The shock of pain will lessen the duration of terror, however.\n\nTurns of terror remaining: %s.
actors.buffs.toxicimbue.name=imbued with toxicity
actors.buffs.toxicimbue.desc=You are imbued with poisonous energy!\n\nAs you move around toxic gas will constantly billow forth from you, damaging your enemies. You are immune to toxic gas and poison for the duration of the effect, as well as for a few turns afterward.\n\nTurns of toxic imbue remaining: %s.
actors.buffs.corrosion.name=corrosion
actors.buffs.corrosion.heromsg=You are melting!
actors.buffs.corrosion.ondeath=You melt away...
actors.buffs.corrosion.rankings_desc=Dissolved
actors.buffs.corrosion.desc=Powerful acid melts away flesh, metal, and bone at an alarming rate.\n\nCorrosion damage increases over time, as the target continues to melt away.\n\nTurns of corrosion remaining: %1$s.\nCurrent corrosion damage: %2$d.
actors.buffs.vertigo.name=vertigo
actors.buffs.vertigo.desc=Walking in a straight line can be difficult when the whole world is spinning.\n\nWhile under the effects of vertigo, characters who attempt to move will go in a random direction, instead of the one they intended to go in.\n\nTurns of vertigo remaining: %s.
actors.buffs.wandempower.name=wands empowered
actors.buffs.wandempower.desc=Your damage-dealing wands have been empowered, increasing the amount of damage they deal for a few hits.\n\nBonus damage: %1$d.\nHits remaining: %2$d.
actors.buffs.weakness.name=weakened
actors.buffs.weakness.heromsg=You feel weakened!
actors.buffs.weakness.desc=Everything suddenly seems much heavier.\n\nWeakening magic reduces a character's physical strength, causing them to deal 33%% reduced damage.\n\nTurns of weakness remaining: %s.
actors.buffs.wellfed.name=well fed
actors.buffs.wellfed.desc=You feel quite satisfied and full.\n\nWhile well fed, your hunger will not increase, and you will heal an additional amount of health over time.\n\nTurns remaining: %d.
actors.buffs.danceimmunebuff.name=immune to dance curse
actors.buffs.danceimmunebuff.desc=All dancing effects loses all its power for a short time, well extending the effect is not effective, you must wait for this effect to wear down before using the spell again.\n\nTurns of magic immunity remaining: %s.
actors.hero.abilities.armorability.self_target=You can't target yourself!
actors.hero.abilities.armorability.no_target=There's nothing to target there!
actors.hero.abilities.armorability.prompt=Choose a location to target
actors.hero.abilities.armorability.cost=Charge cost: _%d_
actors.hero.abilities.warrior.heroicleap.name=heroic leap
actors.hero.abilities.warrior.heroicleap.prompt=Choose direction to leap
actors.hero.abilities.warrior.heroicleap.short_desc=The Warrior performs a _Heroic Leap_ towards a targeted location, sailing above enemies and hazards.
actors.hero.abilities.warrior.heroicleap.desc=The Warrior leaps toward a targeted location, going over any enemies or hazards in the way. He cannot leap over walls or other solid terrain however.
actors.hero.abilities.warrior.shockwave.name=shockwave
actors.hero.abilities.warrior.shockwave.short_desc=The Warrior releases a _Shockwave_ in a conical AOE by slamming the ground. Enemies caught in the shockwave are damaged and crippled.
actors.hero.abilities.warrior.shockwave.desc=The Warrior slams the ground, producing a shockwave that travels up to 5 tiles in a 60 degree cone.\n\nEnemies caught in this shockwave are crippled for 5 turns. They also take 5-10 damage, plus an additional 1-2 damage for every point of strength the Warrior has above 10.
actors.hero.abilities.warrior.endure.name=endure
actors.hero.abilities.warrior.endure$enduretracker.name=endurance
actors.hero.abilities.warrior.endure$enduretracker.desc=The Warrior is now dealing bonus damage based on the damage he endured.\n\nBonus Damage: %1$d\nHits Left: %2$d
actors.hero.abilities.warrior.endure.short_desc=The Warrior _Endures_, skipping several turns but gaining high damage resistance. He then deals bonus damage based on what he endured.
actors.hero.abilities.warrior.endure.desc=The Warrior endures for 3 turns, taking half damage from all sources. This reduction is applied before damage resisting effects like armor.\n\nAfter enduring, the warrior's next hit within 10 turns gains bonus damage. This bonus damage is equal to half of all the damage inflicted on him while enduring, before any damage reduction effects!\n\nIf the Warrior has any combo, using this ability increases its remaining time by 3 turns.
actors.hero.abilities.mage.elementalblast.name=elemental blast
actors.hero.abilities.mage.elementalblast.no_staff=You can't use this ability without your staff.
actors.hero.abilities.mage.elementalblast.short_desc=The Mage emits an _Elemental Blast_ from his staff, covering a large area around him in an effect that varies based on the wand in his staff.
actors.hero.abilities.mage.elementalblast.desc=The Mage emits a blast of magic, which covers a circular region up to 4 tiles away and deals up to 15-25 damage. The specific effect of elemental blast will vary by the wand imbued in the Mage's staff.
actors.hero.abilities.mage.elementalblast.generic_desc=The effect of elemental blast will be similar to the effect of the wand when zapped at an enemy or ally.
actors.hero.abilities.mage.wildmagic.name=wild magic
actors.hero.abilities.mage.wildmagic.no_wands=You have no wands to zap with!
actors.hero.abilities.mage.wildmagic.short_desc=The Mage unleashes the _Wild Magic_ contained in his wands, randomly firing them multiple times at a chosen target over a single turn.
actors.hero.abilities.mage.wildmagic.desc=The Mage unleashes the power in his wands, randomly firing them up to 4 times in a single turn. The Mage's staff is not included in this effect.\n\nEach wand also has its level boosted by 2, up to +3. This ability uses half a wand charge for each zap, and no one wand can be fired more than 2 times.
actors.hero.abilities.mage.warpbeacon.name=warp beacon
actors.hero.abilities.mage.warpbeacon.depths=You can't warp between depths!
actors.hero.abilities.mage.warpbeacon.locked_floor=You cannot leave a locked floor!
actors.hero.abilities.mage.warpbeacon.too_far=That location is too far!
actors.hero.abilities.mage.warpbeacon.invalid_beacon=You can't place a beacon there!
actors.hero.abilities.mage.warpbeacon.window_desc=Your beacon is currently placed on floor %d.
actors.hero.abilities.mage.warpbeacon.window_tele=teleport to beacon
actors.hero.abilities.mage.warpbeacon.window_clear=clear beacon
actors.hero.abilities.mage.warpbeacon.window_cancel=cancel
actors.hero.abilities.mage.warpbeacon.short_desc=The Mage places a _Warping Beacon_ at his current location, which he can instantly teleport back to.
actors.hero.abilities.mage.warpbeacon.desc=The Mage places a beacon, which can then be warped to at will. Placing the beacon takes 1 turn, but warping to it is instantaneous.\n\nThe Mage cannot warp between floors by default, or use the beacon to reach inaccessible places such as locked rooms. The Mage can teleport into enemies, which will push them aside.
actors.hero.abilities.rogue.smokebomb.name=smoke bomb
actors.hero.abilities.rogue.smokebomb.fov=You can only jump to an empty location in your field of view
actors.hero.abilities.rogue.smokebomb.prompt=Choose a location to jump to
actors.hero.abilities.rogue.smokebomb$ninjalog.name=wooden decoy
actors.hero.abilities.rogue.smokebomb$ninjalog.desc=Somehow, enemies are easily convinced that this wooden decoy is the real Rogue!
actors.hero.abilities.rogue.smokebomb.short_desc=The Rogue throws down a _Smoke Bomb_ while blinking away. He blinds enemies near his old location.
actors.hero.abilities.rogue.smokebomb.desc=The Rogue throws down a smoke bomb and blinks up to 6 tiles away. He can blink through hazards and enemies, but not through solid terrain like walls.\n\nEnemies that are adjacent to the Rogue's old position will be blinded for 5 turns.
actors.hero.abilities.rogue.deathmark.name=death mark
actors.hero.abilities.rogue.deathmark.ally_target=You can only mark enemies
actors.hero.abilities.rogue.deathmark.short_desc=The Rogue places a _Death Mark_ on a chosen enemy. Marked enemies take bonus damage, but cannot die until the mark ends.
actors.hero.abilities.rogue.deathmark.desc=The Rogue places a mark on a chosen enemy, causing them to take 25% extra damage. The mark is applied instantly and lasts for 5 turns.\n\nMarked enemies take bonus damage but are unable to die until the mark expires. If an enemy has 0 HP when the mark ends, they will immediately die.
actors.hero.abilities.rogue.deathmark$deathmarktracker.name=marked for death
actors.hero.abilities.rogue.deathmark$deathmarktracker.desc=This enemy has been marked, causing them to take 25%% bonus damage, but also rendering them unable to die until the mark ends.\n\nTurns remaining: %s.
actors.hero.abilities.rogue.shadowclone.name=shadow clone
actors.hero.abilities.rogue.shadowclone.short_desc=The Rogue summons a _Shadow Clone_, which can be directed to aid him in combat.
actors.hero.abilities.rogue.shadowclone.desc=The Rogue summons a shadowy mimic of himself, which can be directed to aid him in combat. Directing the shadow clone does not cost any charge.\n\nThe clone has 80 HP, no armor, and deals 10-20 damage. All of these traits can be improved with talents, such that the clone benefits from weapons and armor the hero has.
actors.hero.abilities.rogue.shadowclone$shadowally.name=shadow rogue
actors.hero.abilities.rogue.shadowclone$shadowally.direct_defend=Your clone moves to that position.
actors.hero.abilities.rogue.shadowclone$shadowally.direct_follow=Your clone moves to follow you.
actors.hero.abilities.rogue.shadowclone$shadowally.direct_attack=Your clone moves to attack!
actors.hero.abilities.rogue.shadowclone$shadowally.desc=A copy of the Rogue, made from shadowy darkness. It stands stock still, with empty eyes and tiny wisps of darkness rising from it like steam.\n\nThe clone is not a perfect copy of the Rogue, but is still a decent fighter, and can benefit from the Rogue's equipment with the right talents.
actors.hero.abilities.huntress.spectralblades.name=spectral blades
actors.hero.abilities.huntress.spectralblades.short_desc=The Huntress throws _Spectral Blades_ at a target, inflicting damage depending on her currently equipped melee weapon.
actors.hero.abilities.huntress.spectralblades.desc=The Huntress throws out a spectral blade at an enemy, which acts like a ranged strike from her melee weapon. All of the normal effects of a melee weapon will activate, including enchantments.
actors.hero.abilities.huntress.naturespower.name=nature's power
actors.hero.abilities.huntress.naturespower.short_desc=The Huntress calls upon _Nature's Power_, increasing her movement speed and her bow's rate of fire for a short time.
actors.hero.abilities.huntress.naturespower.desc=The Huntress temporarily empowers herself and her bow with the power of nature! This lasts for 8 turns.\n\nDuring this time, the Huntress moves at 2x speed, and attacks 33% faster with her bow. The bonus bow effects do not trigger if the Sniper is using her special attacks.
actors.hero.abilities.huntress.naturespower$naturespowertracker.name=nature's power
actors.hero.abilities.huntress.naturespower$naturespowertracker.desc=The Huntress is briefly empowered, increasing her movement speed and attack speed with her bow.\n\nTurns remaining: %s.
actors.hero.abilities.huntress.spirithawk.name=spirit hawk
actors.hero.abilities.huntress.spirithawk.no_space=There is no free space near you.
actors.hero.abilities.huntress.spirithawk.short_desc=The Huntress summons a _Spirit Hawk_ familiar, which can help her scout locations and distract enemies.
actors.hero.abilities.huntress.spirithawk.desc=The Huntress summons a spirit hawk familiar, which can be directed by using the ability again while it is summoned. The hawk lasts for 100 turns, directing the hawk does not cost any charge.\n\nThe hawk has minimal health and attacking power, but is fast, evasive, and accurate. It shares its entire field of vision with the Huntress at all times. It is immune to all area-bound effects, such as fire and poison gas. It will not attack unless specifically directed to.
actors.hero.abilities.huntress.spirithawk$hawkally.name=spirit hawk
actors.hero.abilities.huntress.spirithawk$hawkally.direct_defend=Your hawk moves to that position.
actors.hero.abilities.huntress.spirithawk$hawkally.direct_follow=Your hawk moves to follow you.
actors.hero.abilities.huntress.spirithawk$hawkally.direct_attack=Your hawk moves to attack!
actors.hero.abilities.huntress.spirithawk$hawkally.desc=A magical hawk, summoned by the Huntress. It glows a bright ethereal blue, its head constantly shifts around as it surveys the area.\n\nWhile it isn't much of a fighter its speed and vision make it excellent for scouting and distracting enemies.
actors.hero.abilities.huntress.spirithawk$hawkally.desc_remaining=Turns remaining: %d.
actors.hero.abilities.huntress.spirithawk$hawkally.desc_dodges=Guaranteed dodges remaining: %d.
actors.hero.abilities.duelist.challenge.name=challenge
actors.hero.abilities.duelist.challenge.prompt=Choose an enemy to challenge
actors.hero.abilities.duelist.challenge.already_dueling=You can only be in one duel at a time.
actors.hero.abilities.duelist.challenge.ally_target=You can only challenge enemies.
actors.hero.abilities.duelist.challenge.unreachable_target=You must be able to reach your target.
actors.hero.abilities.duelist.challenge.distant_target=That enemy is too far away to challenge.
actors.hero.abilities.duelist.challenge.short_desc=The Duelist _Challenges_ a nearby enemy to a duel, temporarily freezing all other enemies.
actors.hero.abilities.duelist.challenge.desc=The Duelist challenges a nearby enemy to a duel. That enemy is compelled to fight her while all other enemies are temporarily frozen in time.\n\nThe target must be reachable and within 5 tiles of the Duelist. The duel lasts until 10 turns pass, the enemy dies, or the Duelist is more than 5 tiles away from the enemy.\n\nFrozen enemies are invulnerable. The Duelist's allies are not frozen by this ability, but if a boss is targeted its minions will not be frozen either.
actors.hero.abilities.duelist.challenge$duelparticipant.name=duel participant
actors.hero.abilities.duelist.challenge$duelparticipant.desc=This character is participating in a duel. They, and any of their allies or minions, are allowed to act normally while others are frozen.\n\nThe duel will last for a set amount of time, until one participant dies, or until the participants move more than 5 tiles away from eachother.\n\nTurns remaining: %d.
actors.hero.abilities.duelist.elementalstrike.name=elemental strike
actors.hero.abilities.duelist.elementalstrike.short_desc=The Duelist performs an _Elemental Strike_, spreading an effect in a conical AOE based on her weapon enchantment.
actors.hero.abilities.duelist.elementalstrike.desc=The Duelist strikes an enemy or location, performing a regular attack that's guaranteed to hit and spreading a magical effect that travels up to 4 tiles in a 65 degree cone. This magical effect varies based on the enchantment on the Duelist's primary weapon.
actors.hero.abilities.duelist.elementalstrike.generic_desc=An elemental strike with no enchantment will release a small burst of magic, dealing 6-12 damage to all enemies in range.
actors.hero.abilities.duelist.feint.name=feint
actors.hero.abilities.duelist.feint.prompt=Choose a location to dash to
actors.hero.abilities.duelist.feint.too_far=That location is not adjacent to you.
actors.hero.abilities.duelist.feint.bad_location=You can't move to that location.
actors.hero.abilities.duelist.feint.short_desc=The Duelist _Feints_, faking an attack while dashing to an adjacent tile. Enemies will attack her afterimage, leaving them open to a counterattack.
actors.hero.abilities.duelist.feint.desc=The Duelist fakes an attack while dashing to an adjacent tile, leaving behind a momentary afterimage of herself. Enemies that were attacking the Duelist will attack her afterimage instead.\n\nEnemies that attack the afterimage become confused, which cancels their next action and leaves them open to a surprise attack.
actors.hero.abilities.ratmogrify.name=ratmogrify
actors.hero.abilities.ratmogrify.cant_transform=You can't ratmogrify that!
actors.hero.abilities.ratmogrify.too_strong=That enemy is too strong to ratmogrify!
actors.hero.abilities.ratmogrify.short_desc=The hero _Ratmogrifies_ an enemy! This temporarily turns them into a rat with no abilities.
actors.hero.abilities.ratmogrify.desc=The hero transforms an enemy into a rat for 6 turns! Bosses, allies, and rats cannot be ratmogrified.\n\nRatmogrified enemies retain their original stats, but do not have any abilities.
actors.hero.abilities.ratmogrify$transmograt.name=ratmogrified %s
actors.hero.abilities.ratmogrify$transmograt.desc=This enemy has been transformed into a rat. A big improvement, if you ask me! - Rat King
actors.hero.abilities.ratmogrify$transmograt.rankings_desc=Slain by: ratmogrified enemy
actors.hero.abilities.ratking.legacywrath.name=divine fury
actors.hero.abilities.ratking.legacywrath.short_desc=I unleash my _Divine Fury_ upon my enemies. It leaves me exposed for a few turns and drains all my armor charge. Everything must come at price!
actors.hero.abilities.ratking.legacywrath.desc=I unlock the ability to channel overwhelming power. With it, I can blink to any nearby location no further than 6 tiles, blinding any enemies adjacent to my old location. Once there, I will cast a spell of magical earth on everyone I can see in 6 tiles area (the effect depends on talents) and create a fan of spectral blades targeting any mob within 6 tiles of me before turning invisible.\n\nThis ability takes 2 turns to leap, 1 turn to rooting earth, and one turn to spectral blades, though using this with no enemies in sight will skip the attacking.\n\nUnfortunately, _I have to use all of my armor charge or 33% of my current HP_ to get enough power for this ability.
actors.hero.hero.name=you
actors.hero.hero.leave=You can't leave yet, the rest of the dungeon awaits below!
actors.hero.hero.level_up=Level up!
actors.hero.hero.new_level=Level up! +Accuracy, +Evasion, +5 HP!
actors.hero.hero.new_talent=+1 Talent Point!
actors.hero.hero.unspent=You have unspent talent points!
actors.hero.hero.level_cap=You cannot grow stronger, but your experiences do give you a surge of power!
actors.hero.hero.you_now_have=you picked up: %s.
actors.hero.hero.you_cant_have=you can't carry: %s.
actors.hero.hero.locked_chest=This chest is locked and you don't have a matching key.
actors.hero.hero.locked_door=You don't have a matching key.
actors.hero.hero.noticed_smth=You noticed something.
actors.hero.hero.wait=...
actors.hero.hero.search=search
actors.hero.hero.search_distracted=It's hard to concentrate, searching is exhausting.
actors.hero.hero.pain_resist=The pain helps you resist the urge to sleep.
actors.hero.hero.revive=The ankh explodes with life-giving energy!
actors.hero.heroclass.warrior=warrior
actors.hero.heroclass.warrior_desc_short=The Warrior endures extra damage with shielding granted by his _broken seal._ The seal can be moved between armors and _transfers a single upgrade._
actors.hero.heroclass.warrior_desc=The Warrior starts with a _unique broken seal_ that generates shielding over his health. The seal can be moved between armors, and can _transfer a single upgrade_ with it.\n\nThe Warrior also starts with a _worn shortsword_, _three throwing stones_, cloth armor, a waterskin, and a velvet pouch.\n\nThe Warrior automatically identifies:\n_-_ Scrolls of Identify\n_-_ Potions of Healing\n_-_ Scrolls of Rage
actors.hero.heroclass.warrior_unlock=The Warrior is automatically unlocked.
actors.hero.heroclass.warrior_perk_desc=The Warrior gains _non-stackable 1 + (5% of current STR rounded down)_ temporary strength within _60 + (5 * current level) turns_ from eating and will be protected from taking any damage for duration of eating.\n\nThe Warrior can blind any enemy for _5 turns_ by throwing non-missiles at it. This ability has _40 turns_ cooldown.\n\nThe Warrior has _15%_ more strength, rounded down.\n\nThe Warrior can transfer any glyphs with his seal.\n\nThe Warrior regenerates his health and shielding _two times_ faster than usual.
actors.hero.heroclass.mage=mage
actors.hero.heroclass.mage_desc_short=The Mage is an arcane expert and carries a _magical staff_ that's stronger than a wand. The staff can be _imbued with any wand_ the Mage finds.
actors.hero.heroclass.mage_desc=The Mage starts with a _unique staff_, which recharges significantly faster than a wand and has 1 more charge. The staff _can be imbued with any wand_ the Mage finds in the dungeon.\n\nThe Mage also starts with a _wand of magic missile_ imbued in his staff, cloth armor, a waterskin, and a velvet pouch.\n\nThe Mage automatically identifies:\n_-_ Scrolls of Identify\n_-_ Potions of Liquid Flame\n_-_ Scrolls of Upgrade
actors.hero.heroclass.mage_unlock=To unlock the Mage _use a scroll of upgrade to make an item stronger._
actors.hero.heroclass.mage_perk_desc=The Mage gets _12 turns_ of recharging from eating.\n\nThe Mage instantly identifies any wands he picks up.\n\nThe Mage can self-target with a wand to convert all of its charges into shielding at a rate of _10.5% max HP per charge_.\n\nWhen the Mage zaps an enemy, he gains mind vision on them for _10 turns_.\n\nWhen the Mage reads a scroll, his next _3 wand zaps_ will get +(hero level/5) levels. He also has _33% chance_ to get scroll from the enemy.
actors.hero.heroclass.rogue=rogue
actors.hero.heroclass.rogue_desc_short=The Rogue can evade enemies and strike from invisibility using his _cloak of shadows._ He also _detects secrets and traps_ from a greater distance.
actors.hero.heroclass.rogue_desc=The Rogue starts with a _unique Cloak of Shadows_, which he can use to become invisible at will.\n\nThe Rogue can _detect secrets and traps_ from a greater distance.\n\nThe Rogue also starts with _a dagger_, _three throwing knives_, cloth armor, a waterskin, and a velvet pouch.\n\nThe Rogue automatically identifies:\n_-_ Scrolls of Identify\n_-_ Potions of Invisibility\n_-_ Scrolls of Magic Mapping
actors.hero.heroclass.rogue_unlock=To unlock the Rogue _perform 10 surprise attacks in one game._
actors.hero.heroclass.rogue_perk_desc=The Rogue will not wake sleeping enemies while he is _3 or more tiles away from them_.\n\nThe Rogue can search in _7x7_ area and will knock adjacent enemies away with chip damage while searching.\n\nThe Rogue can use Cloak of Shadows without equipping it but it will recharge at 66% speed.\n\nOn using Scroll of Upgrade, the Rogue will charge all his wands by _1_ charge and get _10 turns_ worth of artifact recharging.\n\nThe Rogue's bombs deal _150%_ more damage and drop from any enemy with 10% chance.
actors.hero.heroclass.huntress=huntress
actors.hero.heroclass.huntress_desc_short=The Huntress is a master of thrown weapons and has a _magical bow_ with infinite arrows. She also travels through tall grass _without trampling it._
actors.hero.heroclass.huntress_desc=The Huntress starts with a _unique spirit bow_, which can fire an infinite number of conjured arrows.\n\nThe Huntress can travel through tall grass _without trampling it_.\n\nThe Huntress also starts with _studded gloves_, cloth armor, a waterskin, and a velvet pouch.\n\nThe Huntress automatically identifies:\n_-_ Scrolls of Identify\n_-_ Potions of Mind Vision\n_-_ Scrolls of Lullaby
actors.hero.heroclass.huntress_unlock=To unlock the Huntress _hit enemies with thrown weapons 10 times in one game._
actors.hero.heroclass.huntress_perk_desc=The Huntress identifies equipment _3x_ faster.\n\nWhen the Huntress steps on short grass or embers, they spring up into tall grass which the Huntress immediately furrows. This has a _5 turn cooldown_. This talent will produce furrowed grass if passive regeneration effects are disabled or the hero has not gained exp in a long time.\n\nThe Huntress gains mind vision on any enemy within _3 tiles of her position_.\n\nThe Huntress gets _5 turns_ of adrenaline from eating.\n\nThe Huntress has 8% chance to get _1-3_ alchemical energy after killing the enemy.
actors.hero.heroclass.rat_king=rat king
actors.hero.heroclass.rat_king_desc_short=My short description is than I am awesome as king could possibly be!
actors.hero.heroclass.rat_king_desc=Why choose a class when I could just go as myself?\n\nAs myself, I take all the special class items I could find: an old seal, a staff made by some mage, a priceless cloak of shadows from my treasury, and a bow from my armory.\n\nI start with all my class items, obviously. Also I've already acquired all the bags, so I start with those too.\nI can also detect traps and secrets from a greater distance.\
actors.hero.heroclass.rat_king_perk_desc=What? I don't need any help! I am strong enough by myself!
actors.hero.heroclass.duelist=duelist
actors.hero.heroclass.duelist_desc_short=The Duelist is a weapons master who can use her weapon to trigger a _special weapon ability._ This special ability is _different for every weapon._
actors.hero.heroclass.duelist_desc=The Duelist starts with a _unique rapier_ with a special ability that recharges over time.\n\nEvery weapon in the game has a _different special ability_ that the Duelist can use.\n\nThe Duelist also starts with _two throwing spikes_, cloth armor, a waterskin, and a velvet pouch.\n\nThe Duelist automatically identifies:\n_-_ Scrolls of Identify\n_-_ Potions of Strength\n_-_ Scrolls of Mirror Image
actors.hero.heroclass.duelist_unlock=To unlock the Duelist _equip a tier 2 or higher weapon with no strength penalty._
actors.hero.heroclass.duelist_perk_desc=The Duelist gets _2 weapon charge_ and bonus melee damage equal to _level/2_ on eating.\n\nThe Duelist gains one weapon charge every _10 turns_ and deals _+8%_ melee damage when under the effect of wand or artifact recharging buffs.\n\nThe Duelist can switch her equipped weapon instantly _twice within 5 turns_, with a 20 turn cooldown.\nIf this ability is not on cooldown, quick-using an unequipped weapon will equip it.\n\nIf the Duelist's ability manages to kill any enemy, she will restore HP equal to _her level_.\n\nThe Duelist gets _+50%_ enchantment power for her attacks.
actors.hero.herosubclass.gladiator=gladiator
actors.hero.herosubclass.berserker=berserker
actors.hero.herosubclass.berserker_short_desc=The _Berserker_ builds rage as he takes damage. Rage increases his damage and can be activated at 100% for bonus shielding.
actors.hero.herosubclass.berserker_desc=The Berserker gains rage as he takes physical damage, including damage that gets blocked by his armor! Rage steadily fades away over time, but fades more slowly if he is at low HP.\n\nThe Berserker deals up to +50% damage at 100% rage. At 100% rage he can also go berserk, gaining 2-6x his seal's maximum shielding depending on his missing health and keeping his rage at 100% as long as he has shielding left. However, the Berserker needs time to recover after he goes berserk.\n\nHis rage will trigger enchantments and curses up to 60% more frequently and decay much slower.
actors.hero.herosubclass.gladiator_short_desc=The _Gladiator_ builds combo when he makes successful attacks. He can spend combo to use unique abilities.
actors.hero.herosubclass.gladiator_desc=The Gladiator builds one point of combo every time he makes a successful attack with a melee or thrown weapon. If the Gladiator does not make a successful attack within 5 turns, his combo is reset.\n\nAs combo builds it unlocks various abilities which he can spend his combo to use:\n2 Combo: knock enemy back, preserves combo; when combo is 7 or higher, knockback range increases to 3, it inflicts vertigo, and it can knock enemies into pits\n4 Combo: deal damage based on armor\n6 Combo: parry, preserves combo; when combo is 9 or higher, works on multiple attacks\n8 Combo: damage target and nearby enemies\n10 Combo: attack once for each combo\n\nWhen the Gladiator kills an enemy, the combo cooldown for his next hit is increased to _50 turns_.\n\nThe Gladiator can leap up to combo/3 tiles when using combo-spending attacks.
actors.hero.herosubclass.battlemage=battlemage
actors.hero.herosubclass.battlemage_short_desc=The _Battlemage_ conjures bonus effects when fighting in melee with his staff. These effects depend on the wand his staff is imbued with.
actors.hero.herosubclass.battlemage_desc=The Battlemage gains a bonus effect whenever he strikes in melee with his staff, as if his staff had an additional enchantment. These effects depend on the wand his staff is imbued with, every wand has its own effect. In addition to the wand effects, the Battlemage's staff will also gain 0.5 charges when he strikes with it.\n\nThe Battlemage's first melee strike with his staff after zapping with it deals double damage and staff's bonus effect gets +300% power.\n\nStriking with his staff grants the Battlemage _2 turns_ worth of artifact recharging.
actors.hero.herosubclass.warlock=warlock
actors.hero.herosubclass.warlock_short_desc=The _Warlock_ has a chance to soul mark enemies with his wands. He will heal whenever he deals physical damage to marked enemies.
actors.hero.herosubclass.warlock_desc=The Warlock has a chance to inflict a soul mark on characters when he uses wands on them. The chance to apply a soul mark and its duration increase with wand level.\n\nWhen an enemy is soul marked, the Warlock will heal 2 hp for every 5 damage he deals to them, but only with attacks from melee or thrown weapons, not from wands!\n\nWhen a soul marked enemy dies, the Warlock has a _50% chance_ to raise them as a corrupted wraith.\n\nSoul mark grants 1.5 turns of satiety for each physical damage dealt. Soul marked enemies have a 40% chance to trigger on-eat effects when they die.
actors.hero.herosubclass.assassin=hunter
actors.hero.herosubclass.assassin_short_desc=The _Hunter_ marks enemies with his bbat and inflicts debuffs with it.
actors.hero.herosubclass.assassin_desc=The _Hunter_ is trained to control darkness and use it to hunt targets with his bbat. His pet marks enemies and progressively does more damage. When any enemy is marked, the hunter can blink to it, inflicting debuffs and healing bbat depending on strength of mark.
actors.hero.herosubclass.freerunner=freerunner
actors.hero.herosubclass.freerunner_short_desc=The _Freerunner_ builds momentum as he runs, which can be used to start freerunning. This grants him bonus speed and evasion for a short while.
actors.hero.herosubclass.freerunner_desc=As the Freerunner moves he builds stacks of momentum. He can gain up to 10 momentum after running for 10 turns, but rapidly loses it if he stops moving. The freerunner can use up his momentum to start freerunning, for 2 turns per point of momentum.\n\nWhen freerunning the Freerunner moves at 2x speed, and gains bonus evasion in proportion to his level. Once freerunning ends there is a cooldown before momentum can be built again.\n\nWhile freerunning, the Freerunner gains 2x accuracy and +50% damage with thrown weapons.\n\nThe Freerunner moves at 2x speed while invisible, regardless of whether he is freerunning or not.
actors.hero.herosubclass.sniper=sniper
actors.hero.herosubclass.sniper_short_desc=The _Sniper_ can pierce armor with her ranged attacks. After striking with a thrown weapon she can follow up with a special attack from her bow.
actors.hero.herosubclass.sniper_desc=The Sniper is a master of ranged combat, whose ranged attacks pierce enemy armor. When she attacks an enemy with a thrown weapon, she places a sniper's mark on them, which lets her follow up with a special attack from her bow. This special attack varies based on how her bow is augmented.\n\nAn unaugmented bow will fire a snapshot which deals reduced damage but fires instantly. A speed bow will fire a volley of three arrows which deal reduced damage, can still activate enchantments, and take 1 turn to fire. A damage bow will fire a sniper shot which is guaranteed to hit, deals bonus damage based on distance, and takes 2 turns to fire.\n\nThrown weapons have a 100% chance to use the enchantment on the Sniper's bow.\nThis ability does not apply to darts shot from an enchanted crossbow, they already trigger the crossbow's enchantment.\n\nWhen the Sniper attacks with an upgraded thrown weapon, each level increases the duration of sniper's mark by 1 turn and the damage of her special attack by _33%_.
actors.hero.herosubclass.warden=warden
actors.hero.herosubclass.warden_short_desc=The _Warden_ can see through tall grass and gains bonus effects when she plants seeds and tramples plants.
actors.hero.herosubclass.warden_desc=The Warden has a strong connection to nature which grants her a variety of bonus effects relating to grass and plants. She is able to see through tall and furrowed grass as if it were empty space.\n\nThe Warden causes grass to sprout up around any seed she throws or plants, and gains special effects when trampling plants. These special effects replace the regular plant effects, meaning that no plant is harmful for her to step on.\n\nDewdrops can shield the Warden when her health is full, up to _100% of her max HP_.\n\nTipped darts have _5x durability_ when the Warden uses them.
actors.hero.herosubclass.king=rat king
actors.hero.herosubclass.king_short_desc=Choosing is so boring, I'd rather just pick _all the subclasses_...
actors.hero.herosubclass.king_desc=Rat King can use all subclasses at once!\n\nNot all perks are transferred to Rat King's subclass powers.
actors.hero.herosubclass.champion=champion
actors.hero.herosubclass.champion_short_desc=The _Champion_ can wield two weapons and gets more weapon charges. Her regular attacks use her primary weapon, but she can swap weapons and use either weapon's ability.
actors.hero.herosubclass.champion_desc=The Champion is a master of melee weapons who can equip a secondary weapon in addition to her primary one. Her regular attacks use her primary weapon, but she can swap her primary weapon instantly and use either weapon's ability.\n\nShe also gains 2 more max weapon ability charges and +50% weapon ability recharge speed.\n\nIf one of the Champion's two equipped weapons has a lower level and is _the same tier or lower_ than the other weapon, it will be boosted to the other weapon's level.\n\nIf the Champion uses two different weapon abilities successively, the second ability will execute any non-boss enemy left at _below 35% HP_.\n\nThe Champion instantly regains _1 weapon charge_ when she uses two different weapon abilities, with no time limit.
actors.hero.herosubclass.monk=monk
actors.hero.herosubclass.monk_short_desc=The _Monk_ builds energy while fighting. This energy can be spent on a variety of unique abilities.
actors.hero.herosubclass.monk_desc=The Monk is a master of physical technique. As she defeats enemies, she gains energy which can be used on a variety of defensive and utility-focused abilities. This energy does not fade over time, but has a cap based on the Monk's level.\n\n1 Energy: quickly strike with fists\n2 Energy: focus to dodge next attack\n3 Energy: instantly dash nearby\n4 Energy: kick an enemy away\n5 Energy: meditate to restore charges\n\nThe Monk gains _25% more energy_ for each piece of _natural tier 3_ equipment she is using.\nThe Monk gains _50% more energy_ for each piece of _natural tier 2_ equipment she is using.\nThe Monk gains _100%_ for each piece of _natural tier 1_ equipment she is using. She also gains _150% more energy_ if she has no weapon (or ring of force), and gains a free cloth armor and studded gloves.\n\nIf the Monk uses a weapon ability and a _2+ energy_ ability successively, she regains 50% of her spent energy and resets her ability cooldown.\n\nIf the Monk has _70% or more energy_, her abilities are empowered. When empowered:\n- Flurry applies enchantments at 75% power\n- Focus is instantaneous\n- Dash gains +2 range\n- Dragon Kick deals +33% damage and applies its knock back and stun effect to all adjacent enemies\n- Meditate slowly heals 20% of missing HP and grants 80% damage resistance.
actors.hero.talent$provokedangertracker.name=provoked anger
actors.hero.talent$provokedangertracker.desc=The Warrior has recently lost his shielding, his next physical attack will deal bonus damage.\n\nTurns remaining: %s.
actors.hero.talent$lingeringmagictracker.name=lingering magic
actors.hero.talent$lingeringmagictracker.desc=The Mage has recently used a staff or wand, his next physical attack will deal bonus damage.\n\nTurns remaining: %s.
actors.hero.talent$followupstriketracker.name=followup strike
actors.hero.talent$followupstriketracker.desc=The Huntress has recently attacked an enemy with a thrown weapon, her next melee attack against the same target will have boosted damage.\n\nTurns remaining: %s.
actors.hero.talent$patientstriketracker.name=patient strike
actors.hero.talent$patientstriketracker.desc=The Duelist has just spent a turn waiting, her next melee attack will deal bonus damage.
actors.hero.talent$improvisedprojectilecooldown.name=improvised projectiles cooldown
actors.hero.talent$improvisedprojectilecooldown.desc=You have recently used this talent, and must wait before using it again.\n\nTurns remaining: %s.
actors.hero.talent$rejuvenatingstepscooldown.name=rejuvenating steps cooldown
actors.hero.talent$rejuvenatingstepscooldown.desc=You have recently used this talent, and must wait before using it again.\n\nTurns remaining: %s.
actors.hero.talent$seershotcooldown.name=seer shot cooldown
actors.hero.talent$seershotcooldown.desc=You have recently used this talent, and must wait before using it again.\n\nTurns remaining: %s.
actors.hero.talent$aggressivebarriercooldown.name=aggressive barrier cooldown
actors.hero.talent$aggressivebarriercooldown.desc=You have recently used this talent, and must wait before using it again.\n\nTurns remaining: %s.
actors.hero.talent$liquidagilacctracker.name=liquid agility
actors.hero.talent$liquidagilacctracker.desc=The Duelist's next regular melee attack will gain bonus accuracy.\n\nTurns remaining: %s.
actors.hero.talent$lethalhastecooldown.name=lethal haste cooldown
actors.hero.talent$lethalhastecooldown.desc=You have recently used this talent, and must wait before using it again.\n\nTurns remaining: %s.
actors.hero.talent$swiftequipcooldown.name=swift equip cooldown
actors.hero.talent$swiftequipcooldown.desc=You have recently used this talent, and must wait before using it again.\n\nTurns remaining: %s.
actors.hero.talent$preciseassaulttracker.name=precise assault
actors.hero.talent$preciseassaulttracker.desc=The Duelist's next regular melee attack will gain bonus accuracy.\n\nTurns remaining: %s.
actors.hero.talent$deadlyfollowuptracker.name=deadly followup
actors.hero.talent$deadlyfollowuptracker.desc=The Duelist has recently attacked an enemy with a thrown weapon, her melee attacks against the same target will have boosted damage.\n\nTurns remaining: %s.
actors.hero.talent$combinedlethalityabilitytracker.executed=executed
actors.hero.talent.hearty_meal.title=hearty meal
actors.hero.talent.hearty_meal.desc=_+1:_ Eating food heals the Warrior for _3 HP_ when he is at or below 30% health.\n\n_+2:_ Eating food heals the Warrior for _5 HP_ when he is at or below 30% health.
actors.hero.talent.veterans_intuition.title=veteran's intuition
actors.hero.talent.veterans_intuition.desc=_+1:_ The Warrior identifies weapons _1.75x faster_ and armor _2.5x faster_.\n\n_+2:_ The Warrior identifies weapons _2.5x faster_ and armor _when he equips it_.
actors.hero.talent.provoked_anger.title=provoked anger
actors.hero.talent.provoked_anger.desc=_+1:_ When the Warrior's shielding breaks, his next physical attack will deal _2 bonus damage_.\n\n_+2:_ When the Warrior's shielding breaks, his next physical attack will deal _3 bonus damage_.
actors.hero.talent.iron_will.title=iron will
actors.hero.talent.iron_will.desc=_+1:_ The max shield provided by the Warrior's seal is _increased by 1_.\n\n_+2:_ The max shield provided by the Warrior's seal is _increased by 2_.
actors.hero.talent.iron_will.meta_desc=_If this talent is gained by a different hero_ it will grant its shielding benefit without the broken seal.
actors.hero.talent.iron_stomach.title=iron stomach
actors.hero.talent.iron_stomach.desc=_+1:_ Eating food takes the Warrior 1 turn and grants him _75% damage resistance_ while eating.\n\n_+2:_ Eating food takes the Warrior 1 turn and grants him _100% damage resistance_ while eating.
actors.hero.talent.liquid_willpower.title=liquid willpower
actors.hero.talent.liquid_willpower.desc=_+1:_ The Warrior instantly regains _50% of the shielding_ from his broken seal when drinking or throwing a potion, brew, or elixir.\n\n_+2:_ The Warrior instantly regains _75% of the shielding_ from his broken seal when drinking or throwing a potion, brew, or elixir.\n\nThe shield regeneration effect is doubled when using potions of strength, experience, or alchemy items that must be crafted using those potions.\n\nFor alchemy items with higher output quantities (e.g. aqua brew), this talent has a chance to trigger based on how many of that item is produced.
actors.hero.talent.liquid_willpower.meta_desc=_If this talent is gained by a different hero_ it will instead grant shielding equal to 5% max hp at +1, or 7.5% max hp at +2.
actors.hero.talent.runic_transference.title=runic transference
actors.hero.talent.runic_transference.desc=_+1:_ The Warrior's broken seal can transfer _regular glyphs_ in the same way it transfers an upgrade.\n\n_+2:_ The Warrior's broken seal can transfer _regular, powerful, and curse glyphs_ in the same way it transfers an upgrade.\n\nThe seal can only transfer glyphs if they were applied to the armor when the seal was attached.
actors.hero.talent.runic_transference.meta_desc=_If this talent is gained by a different hero_ it will instead help glyphs on your armor resist being removed by scrolls of upgrade. Glyphs will begin to be lost when upgrading from level 6(up from 4) at +1, or level 7(up from 4) at +2. The level where glyphs are guaranteed to be lost is unchanged at +8.
actors.hero.talent.lethal_momentum.title=lethal momentum
actors.hero.talent.lethal_momentum.desc=_+1:_ When the Warrior lands a killing blow on an enemy with a physical weapon, it has a _67% chance_ to take 0 turns.\n\n_+2:_ When the Warrior lands a killing blow on an enemy with a physical weapon, it has a _100% chance_ to take 0 turns.
actors.hero.talent.improvised_projectiles.title=improvised projectiles
actors.hero.talent.improvised_projectiles.desc=_+1:_ The Warrior can blind an enemy for _2 turns_ by throwing any item that isn’t a thrown weapon at them. This has a 50 turn cooldown.\n\n_+2:_ The Warrior can blind an enemy for _3 turns_ by throwing any item that isn’t a thrown weapon at them. This has a 50 turn cooldown.
actors.hero.talent.hold_fast.title=hold fast
actors.hero.talent.hold_fast.desc=_+1:_ When the Warrior waits he gains _1-2 armor_ until he moves.\n\n_+2:_ When the Warrior waits he gains _2-4 armor_ until he moves.\n\n_+3:_ When the Warrior waits he gains _3-6 armor_ until he moves.
actors.hero.talent.strongman.title=strongman
actors.hero.talent.strongman.desc=_+1:_ The Warrior's strength is _increased by 8%_, rounded down.\n\n_+2:_ The Warrior's strength is _increased by 13%_, rounded down.\n\n_+3:_ The Warrior's strength is _increased by 18%_, rounded down.
actors.hero.talent.endless_rage.title=endless rage
actors.hero.talent.endless_rage.desc=_+1:_ The Berserker can reach a max of _116% rage_.\n\n_+2:_ The Berserker can reach a max of _133% rage_.\n\n_+3:_ The Berserker can reach a max of _150% rage_.\n\nEach point of rage above 100% increases berserk shielding by 1% and reduces cooldown by 1%, but does not increase the damage bonus beyond +50%.
actors.hero.talent.deathless_fury.title=deathless fury
actors.hero.talent.deathless_fury.desc=_+1:_ Berserk automatically triggers if the Berserker is about to die and rage is at or above 100%, but it has a cooldown of _3 hero levels_ when this happens.\n\n_+2:_ Berserk automatically triggers if the Berserker is about to die and rage is at or above 100%, but it has a cooldown of _2 hero levels_ when this happens.\n\n_+3:_ Berserk automatically triggers if the Berserker is about to die and rage is at or above 100%, but it has a cooldown of _1 hero level_ when this happens.\n\nNote that the Berserker will still die if he has 0 HP when berserking ends.
actors.hero.talent.enraged_catalyst.title=enraged catalyst
actors.hero.talent.enraged_catalyst.desc=_+1:_ Enchantments and curses on the Berserker's weapon trigger more often the more rage he has, to a maximum of _15% more often_ at 100% rage.\n\n_+2:_ Enchantments and curses on the Berserker's weapon trigger more often the more rage he has, to a maximum of _30% more often_ at 100% rage.\n\n_+3:_ Enchantments and curses on the Berserker's weapon trigger more often the more rage he has, to a maximum of _45% more often_ at 100% rage.
actors.hero.talent.cleave.title=cleave
actors.hero.talent.cleave.desc=_+1:_ When the Gladiator kills an enemy, the combo cooldown for his next hit is increased to _15 turns_.\n\n_+2:_ When the Gladiator kills an enemy, the combo cooldown for his next hit is increased to _30 turns_.\n\n_+3:_ When the Gladiator kills an enemy, the combo cooldown for his next hit is increased to _45 turns_.
actors.hero.talent.lethal_defense.title=lethal defense
actors.hero.talent.lethal_defense.desc=_+1:_ When the Gladiator kills an enemy with a combo move, he _regains 33%_ of the broken seal's shielding.\n\n_+2:_ When the Gladiator kills an enemy with a combo move, he _regains 67%_ of the broken seal's shielding.\n\n_+3:_ When the Gladiator kills an enemy with a combo move, he _regains 100%_ of the broken seal's shielding.
actors.hero.talent.enhanced_combo.title=enhanced combo
actors.hero.talent.enhanced_combo.desc=_+1:_ When the Gladiator's combo is 7 or higher, Clobber's knockback range increases to 3, it inflicts vertigo, and it can knock enemies into pits.\n\n_+2:_ In addition to the benefits of +1, when the Gladiator's combo is 9 or higher Parry works on multiple attacks.\n\n_+3:_ In addition to the benefits of +1 and +2, the Gladiator can leap up to combo/3 tiles when using Slam, Crush, or Fury.
actors.hero.talent.body_slam.title=body slam
actors.hero.talent.body_slam.desc=_+1:_ When the Warrior lands after jumping, all adjacent enemies take damage equal to _1-4 plus 25%_ of his damage blocking power.\n\n_+2:_ When the Warrior lands after jumping, all adjacent enemies take damage equal to _2-8 plus 50%_ of his damage blocking power.\n\n_+3:_ When the Warrior lands after jumping, all adjacent enemies take damage equal to _3-12 plus 75%_ of his damage blocking power.\n\n_+4:_ When the Warrior lands after jumping, all adjacent enemies take damage equal to _4-16 plus 100%_ of his damage blocking power.
actors.hero.talent.impact_wave.title=impact wave
actors.hero.talent.impact_wave.desc=_+1:_ When the Warrior lands after jumping, all adjacent enemies are knocked _2 tiles_ back and have a _25% chance_ of becoming vulnerable for 5 turns.\n\n_+2:_ When the Warrior lands after jumping, all adjacent enemies are knocked _3 tiles_ back and have a _50% chance_ of becoming vulnerable for 5 turns.\n\n_+3:_ When the Warrior lands after jumping, all adjacent enemies are knocked _4 tiles_ back and have a _75% chance_ of becoming vulnerable for 5 turns.\n\n_+4:_ When the Warrior lands after jumping, all adjacent enemies are knocked _5 tiles_ back and have a _100% chance_ of becoming vulnerable for 5 turns.
actors.hero.talent.double_jump.title=double jump
actors.hero.talent.double_jump.desc=_+1:_ If the Warrior performs a second leap within 3 turns, that leap has a _16% reduced_ charge cost.\n\n_+2:_ If the Warrior performs a second leap within 3 turns, that leap has a _30% reduced_ charge cost.\n\n_+3:_ If the Warrior performs a second leap within 3 turns, that leap has a _40% reduced_ charge cost.\n\n_+4:_ If the Warrior performs a second leap within 3 turns, that leap has a _50% reduced_ charge cost.
actors.hero.talent.expanding_wave.title=expanding wave
actors.hero.talent.expanding_wave.desc=_+1:_ Shockwave's range is increased to _6 tiles_ from 5, and its width is increased to _75 degrees_ from 60.\n\n_+2:_ Shockwave's range is increased to _7 tiles_ from 5, and its width is increased to _90 degrees_ from 60.\n\n_+3:_ Shockwave's range is increased to _8 tiles_ from 5, and its width is increased to _105 degrees_ from 60.\n\n_+4:_ Shockwave's range is increased to _9 tiles_ from 5, and its width is increased to _120 degrees_ from 60.
actors.hero.talent.striking_wave.title=striking wave
actors.hero.talent.striking_wave.desc=_+1:_ Shockwave has a _30% chance_ to also use on-hit effects like enchantments and combo.\n\n_+2:_ Shockwave has a _60% chance_ to also use on-hit effects like enchantments and combo.\n\n_+3:_ Shockwave has a _90% chance_ to also use on-hit effects like enchantments and combo.\n\n_+4:_ Shockwave has a _100% chance_ to also use on-hit effects like enchantments and combo, and it gives enchantments _+20% power_.
actors.hero.talent.shock_force.title=shock force
actors.hero.talent.shock_force.desc=_+1:_ Shockwave deals _20% more damage_ and has a _25% chance_ to stun instead of cripple.\n\n_+2:_ Shockwave deals _40% more damage_ and has a _50% chance_ to stun instead of cripple.\n\n_+3:_ Shockwave deals _60% more damage_ and has a _75% chance_ to stun instead of cripple.\n\n_+4:_ Shockwave deals _80% more damage_ and has a _100% chance_ to stun instead of cripple.
actors.hero.talent.sustained_retribution.title=sustained retribution
actors.hero.talent.sustained_retribution.desc=_+1:_ The Warrior deals _115% bonus damage_ spread over _2 hits_, instead of 100% bonus damage in 1 hit.\n\n_+2:_ The Warrior deals _130% bonus damage_ spread over _3 hits_, instead of 100% bonus damage in 1 hit.\n\n_+3:_ The Warrior deals _145% bonus damage_ spread over _4 hits_, instead of 100% bonus damage in 1 hit.\n\n_+4:_ The Warrior deals _160% bonus damage_ spread over _5 hits_, instead of 100% bonus damage in 1 hit.
actors.hero.talent.shrug_it_off.title=shrug it off
actors.hero.talent.shrug_it_off.desc=_+1:_ The Warrior's damage reduction while enduring is _increased to 60%_, from 50%.\n\n_+2:_ The Warrior's damage reduction while enduring is _increased to 68%_, from 50%.\n\n_+3:_ The Warrior's damage reduction while enduring is _increased to 74%_, from 50%.\n\n_+4:_ The Warrior's damage reduction while enduring is _increased to 80%_, from 50%.
actors.hero.talent.even_the_odds.title=even the odds
actors.hero.talent.even_the_odds.desc=_+1:_ The Warrior deals an additional _5% bonus damage_ for every enemy within 2 tiles when enduring ends.\n\n_+2:_ The Warrior deals an additional _10% bonus damage_ for every enemy within 2 tiles when enduring ends.\n\n_+3:_ The Warrior deals an additional _15% bonus damage_ for every enemy within 2 tiles when enduring ends.\n\n_+4:_ The Warrior deals an additional _20% bonus damage_ for every enemy within 2 tiles when enduring ends.
actors.hero.talent.empowering_meal.title=empowering meal
actors.hero.talent.empowering_meal.desc=_+1:_ Eating food grants the Mage _2 bonus damage_ on the next 3 times he deals damage with a wand.\n\n_+2:_ Eating food grants the Mage _3 bonus damage_ on the next 3 times he deals damage with a wand.
actors.hero.talent.scholars_intuition.title=scholar's intuition
actors.hero.talent.scholars_intuition.desc=_+1:_ The Mage identifies wands _3x faster_.\n\n_+2:_ The Mage identifies wands _when he uses them_.
actors.hero.talent.lingering_magic.title=lingering magic
actors.hero.talent.lingering_magic.desc=_+1:_ When the Mage zaps with a wand or staff, his next physical attack deals _1-2 bonus damage_.\n\n_+2:_ When the Mage zaps with a wand or staff, his next physical attack deals _2 bonus damage_.
actors.hero.talent.backup_barrier.title=backup barrier
actors.hero.talent.backup_barrier.desc=_+1:_ The Mage gains _3 shielding_ whenever he spends the last charge in his staff.\n\n_+2:_ The Mage gains _5 shielding_ whenever he spends the last charge in his staff.
actors.hero.talent.backup_barrier.meta_desc=_If this talent is gained by a different hero_ it will instead trigger from the hero's highest level wand.
actors.hero.talent.energizing_meal.title=energizing meal
actors.hero.talent.energizing_meal.desc=_+1:_ Eating food takes the Mage 1 turn and grants him _5 turns of wand recharging_.\n\n_+2:_ Eating food takes the Mage 1 turn and grants him _8 turns of wand recharging_.
actors.hero.talent.inscribed_power.title=inscribed power
actors.hero.talent.inscribed_power.desc=_+1:_ When the Mage reads a scroll or uses a spell item, his _next 2 wand zaps_ get +2 levels.\n\n_+2:_ When the Mage reads a scroll or uses a spell item, his _next 3 wand zaps_ get +2 levels.\n\nThe number of enhanced wand zaps is doubled when using a scroll of upgrade, transmutation, or alchemy items that must be crafted using those scrolls.\n\nFor alchemy items with higher output quantities (e.g. most spells), this talent has a chance to trigger based on how many of that item is produced.
actors.hero.talent.wand_preservation.title=wand preservation
actors.hero.talent.wand_preservation.desc=_+1:_ When the Mage imbues a new wand into his staff, the old wand is returned at +0, _but this can only be done once._\n\n_+2:_ When the Mage imbues a new wand into his staff, the old wand is returned at +0, _this can be done once per hero level._
actors.hero.talent.wand_preservation.meta_desc=_If this talent is gained by a different hero_ it will instead increase the amount of arcane resin gained when putting a wand into an alchemy pot by 1 at +1, or by 2 at +2.
actors.hero.talent.arcane_vision.title=arcane vision
actors.hero.talent.arcane_vision.desc=_+1:_ When the Mage zaps an enemy, he gains mind vision on them for _10 turns_.\n\n_+2:_ When the Mage zaps an enemy, he gains mind vision on them for _15 turns_.
actors.hero.talent.shield_battery.title=shield battery
actors.hero.talent.shield_battery.desc=_+1:_ The Mage can self-target with a wand to convert all of its charges into shielding at a rate of _4% max HP per charge_.\n\n_+2:_ The Mage can self-target with a wand to convert all of its charges into shielding at a rate of _6% max HP per charge_.
actors.hero.talent.desperate_power.title=desperate power
actors.hero.talent.desperate_power.desc=_+1:_ The Mage's wands and staff gain _+1 level_ on their final zap when they are down to their last charge.\n\n_+2:_ The Mage's wands and staff gain _+2 levels_ on their final zap when they are down to their last charge.\n\n_+3:_ The Mage's wands and staff gain _+3 levels_ on their final zap when they are down to their last charge.
actors.hero.talent.ally_warp.title=ally warp
actors.hero.talent.ally_warp.desc=_+1:_ The Mage can select an ally to instantly swap places with them, with a _2 tile range_.\n\n_+2:_ The Mage can select an ally to instantly swap places with them, with a _4 tile range_.\n\n_+3:_ The Mage can select an ally to instantly swap places with them, with a _6 tile range_.\n\nThe Mage cannot swap places with immobile allies.
actors.hero.talent.empowered_strike.title=empowered strike
actors.hero.talent.empowered_strike.desc=_+1:_ The Battlemage's first melee strike with his staff after zapping with it deals _+16% damage_ and the staff's bonus effect gets _+50% power_.\n\n_+2:_ The Battlemage's first melee strike with his staff after zapping with it deals _+33% damage_ and the staff's bonus effect gets _+100% power_.\n\n_+3:_ The Battlemage's first melee strike with his staff after zapping with it deals _+50% damage_ and the staff's bonus effect gets _+150% power_.
actors.hero.talent.mystical_charge.title=mystical charge
actors.hero.talent.mystical_charge.desc=_+1:_ Striking with his staff grants the Battlemage _0.5 turns_ worth of artifact recharging.\n\n_+2:_ Striking with his staff grants the Battlemage _1 turn_ worth of artifact recharging.\n\n_+3:_ Striking with his staff grants the Battlemage _1.5 turns_ worth of artifact recharging.
actors.hero.talent.excess_charge.title=excess charge
actors.hero.talent.excess_charge.desc=_+1:_ When the Battlemage's staff is fully charged, its next zap will grant him _0.67 shielding_ per level of the staff.\n\n_+2:_ When the Battlemage's staff is fully charged, its next zap will grant him _1.33 shielding_ per level of the staff.\n\n_+3:_ When the Battlemage's staff is fully charged, its next zap will grant him _2 shielding_ per level of the staff.
actors.hero.talent.soul_siphon.title=soul siphon
actors.hero.talent.soul_siphon.desc=_+1:_ Physical damage dealt by other characters triggers the Warlock's soul mark at _13% effectiveness_.\n\n_+2:_ Physical damage dealt by other characters triggers the Warlock's soul mark at _27% effectiveness_.\n\n_+3:_ Physical damage dealt by other characters triggers the Warlock's soul mark at _40% effectiveness_.
actors.hero.talent.soul_eater.title=soul eater
actors.hero.talent.soul_eater.desc=_+1:_ Soul mark grants _0.33 turns_ of satiety for each physical damage dealt. Soul marked enemies have a _10% chance_ to trigger on-eat effects when they die.\n\n_+2:_ Soul mark grants _0.67 turns_ of satiety for each physical damage dealt. Soul marked enemies have a _20% chance_ to trigger on-eat effects when they die.\n\n_+3:_ Soul mark grants _1 turn_ of satiety for each physical damage dealt. Soul marked enemies have a _30% chance_ to trigger on-eat effects when they die.
actors.hero.talent.necromancers_minions.title=necromancer's minions
actors.hero.talent.necromancers_minions.desc=_+1:_ When a soul marked enemy dies, the Warlock has a _13% chance_ to raise them as a corrupted wraith.\n\n_+2:_ When a soul marked enemy dies, the Warlock has a _27% chance_ to raise them as a corrupted wraith.\n\n_+3:_ When a soul marked enemy dies, the Warlock has a _40% chance_ to raise them as a corrupted wraith.
actors.hero.talent.blast_radius.title=blast radius
actors.hero.talent.blast_radius.desc=_+1:_ Elemental blast's radius is increased to _5 tiles_, from 4.\n\n_+2:_ Elemental blast's radius is increased to _6 tiles_, from 4.\n\n_+3:_ Elemental blast's radius is increased to _7 tiles_, from 4.\n\n_+4:_ Elemental blast's radius is increased to _8 tiles_, from 4.
actors.hero.talent.elemental_power.title=elemental power
actors.hero.talent.elemental_power.desc=_+1:_ The power of elemental blast is increased by _25%_.\n\n_+2:_ The power of elemental blast is increased by _50%_.\n\n_+3:_ The power of elemental blast is increased by _75%_.\n\n_+4:_ The power of elemental blast is increased by _100%_.
actors.hero.talent.reactive_barrier.title=reactive barrier
actors.hero.talent.reactive_barrier.desc=_+1:_ The Mage gains _2.5 shielding_ for every character affected by elemental blast, to a max of 5 characters.\n\n_+2:_ The Mage gains _5 shielding_ for every character affected by elemental blast, to a max of 6 characters.\n\n_+3:_ The Mage gains _7.5 shielding_ for every character affected by elemental blast, to a max of 7 characters.\n\n_+4:_ The Mage gains _10 shielding_ for every character affected by elemental blast, to a max of 8 characters.
actors.hero.talent.wild_power.title=wild power
actors.hero.talent.wild_power.desc=_+1:_ When using wild magic, wands will be boosted by either _2 or 3, up to +4_.\n\n_+2:_ When using wild magic, wands will be boosted by _3, up to +5_.\n\n_+3:_ When using wild magic, wands will be boosted by either _3 or 4, up to +6_.\n\n_+4:_ When using wild magic, wands will be boosted by _4, up to +7_.
actors.hero.talent.fire_everything.title=fire everything
actors.hero.talent.fire_everything.desc=_+1:_ Wild magic now fires _5 times_ up from 4, and each wand has a _25% chance_ to be usable 3 times.\n\n_+2:_ Wild magic now fires _6 times_ up from 4, and each wand has a _50% chance_ to be usable 3 times.\n\n_+3:_ Wild magic now fires _7 times_ up from 4, and each wand has a _75% chance_ to be usable 3 times.\n\n_+4:_ Wild magic now fires _8 times_ up from 4, and each wand has a _100% chance_ to be usable 3 times.
actors.hero.talent.conserved_magic.title=conserved magic
actors.hero.talent.conserved_magic.desc=_+1:_ Each zap from wild magic now uses _0.33 charges_ instead of 0.5, and wild magic has a _25% chance_ to not spend a turn.\n\n_+2:_ Each zap from wild magic now uses _0.225 charges_ instead of 0.5, and wild magic has a _50% chance_ to not spend a turn.\n\n_+3:_ Each zap from wild magic now uses _0.15 charges_ instead of 0.5, and wild magic has a _75% chance_ to not spend a turn.\n\n_+4:_ Each zap from wild magic now uses _0.1 charges_ instead of 0.5, and wild magic has a _100% chance_ to not spend a turn.
actors.hero.talent.telefrag.title=Telefrag
actors.hero.talent.telefrag.desc=_+1:_ If the Mage warps into another character he deals _10-15 damage_ to it, but also takes _5 damage_.\n\n_+2:_ If the Mage warps into another character he deals _20-30 damage_ to it, but also takes _10 damage_.\n\n_+3:_ If the Mage warps into another character he deals _30-45 damage_ to it, but also takes _15 damage_.\n\n_+4:_ If the Mage warps into another character he deals _40-60 damage_ to it, but also takes _20 damage_.\n\nThe hero cannot be killed by this talent, the self damage can be reduced by magic resisting effects.
actors.hero.talent.remote_beacon.title=Remote Beacon
actors.hero.talent.remote_beacon.desc=_+1:_ The Mage can place a beacon at any location within _4 tiles_.\n\n_+2:_ The Mage can place a beacon at any location within _8 tiles_.\n\n_+3:_ The Mage can place a beacon at any location within _12 tiles_.\n\n_+4:_ The Mage can place a beacon at any location within _16 tiles_.\n\nThe Mage cannot place beacons in locations that are inaccessible.
actors.hero.talent.longrange_warp.title=Longrange Warp
actors.hero.talent.longrange_warp.desc=_+1:_ The Mage can now warp between floors, at _150% charge cost_.\n\n_+2:_ The Mage can now warp between floors, at _117% charge cost_.\n\n_+3:_ The Mage can now warp between floors, at _83% charge cost_.\n\n_+4:_ The Mage can now warp between floors, at _50% charge cost_.\n\nThe Mage cannot use longrange warp to leave a locked floor.
actors.hero.talent.cached_rations.title=cached rations
actors.hero.talent.cached_rations.desc=_+1:_ The Rogue can find _2 supply rations_ placed in chests while he explores the next few floors of the dungeon.\n\n_+2:_ The Rogue can find _3 supply rations_ placed in chests while he explores the next few floors of the dungeon.\n\nSupply rations are eaten quickly, restore a moderate amount of satiety, heal 5 hp, and restore 1 charge to the cloak of shadows.
actors.hero.talent.thiefs_intuition.title=thief's intuition
actors.hero.talent.thiefs_intuition.desc=_+1:_ The Rogue identifies rings _2x faster_, and identifies the type of a ring _when he equips it_.\n\n_+2:_ The Rogue identifies rings _when he equips them_, and identifies the type of a ring _when he picks it up_.
actors.hero.talent.sucker_punch.title=sucker punch
actors.hero.talent.sucker_punch.desc=_+1:_ The Rogue deals _1-2 bonus damage_ the first time he surprise attacks an enemy.\n\n_+2:_ The Rogue deals _2 bonus damage_ the first time he surprise attacks an enemy.
actors.hero.talent.protective_shadows.title=protective shadows
actors.hero.talent.protective_shadows.desc=_+1:_ The Rogue gains one shielding _every other turn_ he is invisible, _to a max of 3_.\n\n_+2:_ The Rogue gains one shielding _every turn_ he is invisible, _to a max of 5_.
actors.hero.talent.mystical_meal.title=mystical meal
actors.hero.talent.mystical_meal.desc=_+1:_ Eating food takes the Rogue 1 turn (supply rations are eaten instantly) and grants him _3 turns of artifact recharging_.\n\n_+2:_ Eating food takes the Rogue 1 turn (supply rations are eaten instantly) and grants him _5 turns of artifact recharging_.\n\nThis talent cannot be used to let the horn of plenty recharge itself.
actors.hero.talent.inscribed_stealth.title=inscribed stealth
actors.hero.talent.inscribed_stealth.desc=_+1:_ The Rogue gains _3 turns_ of invisibility after reading a scroll or using a spell item.\n\n_+2:_ The Rogue gains _5 turns_ of invisibility after reading a scroll or using a spell item\n\nThe invisibility duration is doubled when using a scroll of upgrade, scroll of transmutation, or alchemy items that must be crafted using those scrolls.\n\nFor alchemy items with higher output quantities (e.g. most spells), this talent has a chance to trigger based on how many of that item is produced.
actors.hero.talent.wide_search.title=wide search
actors.hero.talent.wide_search.desc=_+1:_ The Rogue’s search radius is increased from a 5x5 square to a _7x7 circle_.\n\n_+2:_ The Rogue’s search radius is increased from a 5x5 square to a _7x7 square_.
actors.hero.talent.wide_search.meta_desc=_If this talent is gained by a different hero_ it will instead increase their search radius from a 3x3 square to a 5x5 circle at +1, or a 5x5 square at +2.
actors.hero.talent.silent_steps.title=silent steps
actors.hero.talent.silent_steps.desc=_+1:_ The Rogue will not wake sleeping enemies while he is _3 or more tiles away from them_.\n\n_+2:_ The Rogue will not wake sleeping enemies while he is _not adjacent to them_.
actors.hero.talent.rogues_foresight.title=rogue's foresight
actors.hero.talent.rogues_foresight.desc=_+1:_ When the Rogue is on a level with a secret room, he has a _75% chance to notice_ that the level contains a secret.\n\n_+2:_ When the Rogue is on a level with a secret room, he has a _100% chance to notice_ that the level contains a secret.
actors.hero.talent.light_cloak.title=light cloak
actors.hero.talent.light_cloak.desc=_+1:_ The Rogue can use his cloak of shadows when it is not equipped, but it recharges at _25% speed_.\n\n_+2:_ The Rogue can use his cloak of shadows when it is not equipped, but it recharges at _50% speed_.\n\n_+3:_ The Rogue can use his cloak of shadows when it is not equipped, but it recharges at _75% speed_.
actors.hero.talent.light_cloak.meta_desc=_If this talent is gained by a different hero_ it will instead increase the charging speed of all artifacts by 7/13/20% at +1/+2/+3.
actors.hero.talent.enhanced_rings.title=enhanced rings
actors.hero.talent.enhanced_rings.desc=_+1:_ When the Rogue uses an artifact, his rings gain +1 upgrade for _3 turns_.\n\n_+2:_ When the Rogue uses an artifact, his rings gain +1 upgrade for _6 turns_.\n\n_+3:_ When the Rogue uses an artifact, his rings gain +1 upgrade for _9 turns_.
actors.hero.talent.enhanced_lethality.title=enhanced lethality
actors.hero.talent.enhanced_lethality.desc=_+1:_ The Assassin can assassinate enemies left at below _4/13/27/67% health_ per level of preparation, up from 3/10/20/50%.\n\n_+2:_ The Assassin can assassinate enemies left at below _5/17/33/83% health_ per level of preparation, up from 3/10/20/50%.\n\n_+3:_ The Assassin can assassinate enemies left at below _6/20/40/100% health_ per level of preparation, up from 3/10/20/50%.
actors.hero.talent.assassins_reach.title=assassin's reach
actors.hero.talent.assassins_reach.desc=_+1:_ The Assassin's blink range per level of preparation is increased to _1/3/4/6 tiles_, from 1/2/3/4.\n\n_+2:_ The Assassin's blink range per level of preparation is increased to _2/4/6/8 tiles_, from 1/2/3/4.\n\n_+3:_ The Assassin's blink range per level of preparation is increased to _2/5/7/10 tiles_, from 1/2/3/4.\n\nThis blink can go through hazards and enemies, but not through solid terrain like walls.
actors.hero.talent.bounty_hunter.title=bounty hunter
actors.hero.talent.bounty_hunter.desc=_+1:_ When the Assassin kills an enemy with a prepared strike their item drop chance is increased by _2/4/8/16%_, per level of preparation.\n\n_+2:_ When the Assassin kills an enemy with a prepared strike their item drop chance is increased by _4/8/16/32%_, per level of preparation.\n\n_+3:_ When the Assassin kills an enemy with a prepared strike their item drop chance is increased by _6/12/24/48%_, per level of preparation.
actors.hero.talent.evasive_armor.title=evasive armor
actors.hero.talent.evasive_armor.desc=_+1:_ While freerunning, the Freerunner gains an additional _+1 evasion_ per excess point of strength on his armor.\n\n_+2:_ While freerunning, the Freerunner gains an additional _+2 evasion_ per excess point of strength on his armor.\n\n_+3:_ While freerunning, the Freerunner gains an additional _+3 evasion_ per excess point of strength on his armor.
actors.hero.talent.projectile_momentum.title=projectile momentum
actors.hero.talent.projectile_momentum.desc=_+1:_ While freerunning, the Freerunner gains _+20% accuracy and +15% damage_ with thrown weapons.\n\n_+2:_ While freerunning, the Freerunner gains _+40% accuracy and +30% damage_ with thrown weapons.\n\n_+3:_ While freerunning, the Freerunner gains _+60% accuracy and +45% damage_ with thrown weapons.
actors.hero.talent.speedy_stealth.title=speedy stealth
actors.hero.talent.speedy_stealth.desc=_+1:_ The Freerunner gains 2 stacks of momentum per turn while he is invisible.\n\n_+2:_ In addition to the benefits of +1, freerunning no longer counts down while the Freerunner is invisible.\n\n_+3:_ In addition to the benefits of +1 and +2, the Freerunner moves at 2x speed while invisible, regardless of whether he is freerunning or not.
actors.hero.talent.hasty_retreat.title=hasty retreat
actors.hero.talent.hasty_retreat.desc=_+1:_ After blinking the Rogue gains _1 turn_ of haste and invisibility.\n\n_+2:_ After blinking the Rogue gains _2 turns_ of haste and invisibility.\n\n_+3:_ After blinking the Rogue gains _3 turns_ of haste and invisibility.\n\n_+4:_ After blinking the Rogue gains _4 turns_ of haste and invisibility.
actors.hero.talent.body_replacement.title=body replacement
actors.hero.talent.body_replacement.desc=_+1:_ After blinking, the Rogue leaves a wooden decoy behind that has _20 health and 1-3 armor_.\n\n_+2:_ After blinking, the Rogue leaves a wooden decoy behind that has _40 health and 2-6 armor_.\n\n_+3:_ After blinking, the Rogue leaves a wooden decoy behind that has _60 health and 3-9 armor_.\n\n_+4:_ After blinking, the Rogue leaves a wooden decoy behind that has _80 health and 4-12 armor_.\n\nOnly one decoy can be active at a time.
actors.hero.talent.shadow_step.title=shadow step
actors.hero.talent.shadow_step.desc=_+1:_ If the rogue uses smoke bomb while invisible, it occurs instantly and has a _16% reduced_ charge cost, but it also doesn't blind enemies or trigger other talents.\n\n_+2:_ If the rogue uses smoke bomb while invisible, it occurs instantly and has a _30% reduced_ charge cost, but it also doesn't blind enemies or trigger other talents.\n\n_+3:_ If the rogue uses smoke bomb while invisible, it occurs instantly and has a _41% reduced_ charge cost, but it also doesn't blind enemies or trigger other talents.\n\n_+4:_ If the rogue uses smoke bomb while invisible, it occurs instantly and has a _50% reduced_ charge cost, but it also doesn't blind enemies or trigger other talents.
actors.hero.talent.fear_the_reaper.title=fear the reaper
actors.hero.talent.fear_the_reaper.desc=_+1:_ When a death marked enemy reaches 0 hp, they become _crippled_.\n\n_+2:_ When a death marked enemy reaches 0 hp, they become _feared and crippled_.\n\n_+3:_ When a death marked enemy reaches 0 hp, they become _feared and crippled_ and enemies within 3 tiles become _crippled_.\n\n_+4:_ When a death marked enemy reaches 0 hp, they become _feared and crippled_ and enemies within 3 tiles become _feared and crippled_.
actors.hero.talent.deathly_durability.title=deathly durability
actors.hero.talent.deathly_durability.desc=_+1:_ Enemies killed by death mark give the rogue shielding equal to _13%_ of their hp when they were marked.\n\n_+2:_ Enemies killed by death mark give the rogue shielding equal to _25%_ of their hp when they were marked.\n\n_+3:_ Enemies killed by death mark give the rogue shielding equal to _38%_ of their hp when they were marked.\n\n_+4:_ Enemies killed by death mark give the rogue shielding equal to _50%_ of their hp when they were marked.
actors.hero.talent.double_mark.title=double mark
actors.hero.talent.double_mark.desc=_+1:_ Marking a second target at the same time as the first one has a _30% reduced_ charge cost.\n\n_+2:_ Marking a second target at the same time as the first one has a _50% reduced_ charge cost.\n\n_+3:_ Marking a second target at the same time as the first one has a _65% reduced_ charge cost.\n\n_+4:_ Marking a second target at the same time as the first one has a _75% reduced_ charge cost.
actors.hero.talent.shadow_blade.title=shadow blade
actors.hero.talent.shadow_blade.desc=_+1:_ The shadow clone gains _8%_ of the hero's damage per turn, and has a _25% chance_ to use the enchantment on the hero's weapon.\n\n_+2:_ The shadow clone gains _16%_ of the hero's damage per turn, and has a _50% chance_ to use the enchantment on the hero's weapon.\n\n_+3:_ The shadow clone gains _24%_ of the hero's damage per turn, and has a _75% chance_ to use the enchantment on the hero's weapon.\n\n_+4:_ The shadow clone gains _32%_ of the hero's damage per turn, and has a _100% chance_ to use the enchantment on the hero's weapon.
actors.hero.talent.cloned_armor.title=cloned armor
actors.hero.talent.cloned_armor.desc=_+1:_ The shadow clone gains _12%_ of the hero's armor value, and has a _25% chance_ to use the glyph on the hero's armor.\n\n_+2:_ The shadow clone gains _24%_ of the hero's armor value, and has a _50% chance_ to use the glyph on the hero's armor.\n\n_+3:_ The shadow clone gains _36%_ of the hero's armor value, and has a _75% chance_ to use the glyph on the hero's armor.\n\n_+4:_ The shadow clone gains _48%_ of the hero's armor value, and has a _100% chance_ to use the glyph on the hero's armor.
actors.hero.talent.perfect_copy.title=perfect copy
actors.hero.talent.perfect_copy.desc=_+1:_ The shadow clone gains _10%_ of the hero's max HP, and can instantly swap places with the hero up to _1 tile_ away.\n\n_+2:_ The shadow clone gains _20%_ of the hero's max HP, and can instantly swap places with the hero up to _2 tiles_ away.\n\n_+3:_ The shadow clone gains _30%_ of the hero's max HP, and can instantly swap places with the hero up to _3 tiles_ away.\n\n_+4:_ The shadow clone gains _40%_ of the hero's max HP, and can instantly swap places with the hero up to _4 tiles_ away.
actors.hero.talent.natures_bounty.title=nature's bounty
actors.hero.talent.natures_bounty.desc=_+1:_ The Huntress can find _4 berries_ hidden in tall grass as she explores the next few floors of the dungeon.\n\n_+2:_ The Huntress can find _6 berries_ hidden in tall grass as she explores the next few floors of the dungeon.\n\nBerries are eaten quickly, restore a small amount of satiety, and might contain a usable seed.
actors.hero.talent.survivalists_intuition.title=survivalist's intuition
actors.hero.talent.survivalists_intuition.desc=_+1:_ The Huntress identifies all equipment _1.75x faster_.\n\n_+2:_ The Huntress identifies all equipment _2.5x faster_.
actors.hero.talent.followup_strike.title=followup strike
actors.hero.talent.followup_strike.desc=_+1:_ When the Huntress hits an enemy with her bow or a thrown weapon, her next melee attack against that enemy deals _2 bonus damage_.\n\n_+2:_ When the Huntress hits an enemy with her bow or a thrown weapon, her next melee attack against that enemy deals _3 bonus damage_.
actors.hero.talent.natures_aid.title=nature's aid
actors.hero.talent.natures_aid.desc=_+1:_ The Huntress gains 0-2 armor of barkskin, which fades every _3 turns_ when a plant's effect is activated in her vision.\n\n_+2:_ The Huntress gains 0-2 armor of barkskin, which fades every _5 turns_ when a plant's effect is activated in her vision.
actors.hero.talent.invigorating_meal.title=invigorating meal
actors.hero.talent.invigorating_meal.desc=_+1:_ Eating food takes the Huntress 1 turn (berries are eaten instantly) and grants her _1 turn of haste_.\n\n_+2:_ Eating food takes the Huntress 1 turn (berries are eaten instantly) and grants her _2 turns of haste_.
actors.hero.talent.liquid_nature.title=liquid nature
actors.hero.talent.liquid_nature.desc=_+1:_ When the Huntress drinks or throws a potion, brew, or elixir, _up to 4 grass tiles_ sprout in the surrounding area, and adjacent enemies are rooted for _1 turn_.\n\n_+2:_ When the Huntress drinks or throws a potion, brew, or elixir, _up to 6 grass tiles_ sprout in the surrounding area, and adjacent enemies are rooted for _2 turns_.\n\nThe amount of grass and root duration are doubled when using potions of strength, experience, or alchemy items that must be crafted using those potions.\n\nFor alchemy items with higher output quantities (e.g. aqua brew), this talent has a chance to trigger based on how many of that item is produced.
actors.hero.talent.rejuvenating_steps.title=rejuvenating steps
actors.hero.talent.rejuvenating_steps.desc=_+1:_ When the Huntress steps on short grass or embers, they spring up into tall grass which the Huntress immediately furrows. This has a _10 turn cooldown_.\n\n_+2:_ When the Huntress steps on short grass or embers, they spring up into tall grass which the Huntress immediately furrows. This has a _5 turn cooldown_.\n\nThis talent will produce furrowed grass if passive regeneration effects are disabled or the hero has not gained exp in a long time.
actors.hero.talent.heightened_senses.title=heightened senses
actors.hero.talent.heightened_senses.desc=_+1:_ The Huntress gains mind vision on any enemy within _2 tiles of her position_.\n\n_+2:_ The Huntress gains mind vision on any enemy within _3 tiles of her position_.
actors.hero.talent.durable_projectiles.title=durable projectiles
actors.hero.talent.durable_projectiles.desc=_+1:_ Thrown weapons have _+50% durability_ when used by the Huntress.\n\n_+2:_ Thrown weapons have _+75% durability_ when used by the Huntress.
actors.hero.talent.point_blank.title=point blank
actors.hero.talent.point_blank.desc=_+1:_ When the Huntress uses her bow or a thrown weapon at melee range it has _-30% accuracy,_ instead of -50%.\n\n_+2:_ When the Huntress uses her bow or a thrown weapon at melee range it has _-10% accuracy,_ instead of -50%.\n\n_+3:_ When the Huntress uses her bow or a thrown weapon at melee range it has _+10% accuracy,_ instead of -50%.\n\nNote that thrown weapons or the spirit bow always have +50% accuracy when used at a distance.
actors.hero.talent.seer_shot.title=seer shot
actors.hero.talent.seer_shot.desc=_+1:_ When the Huntress fires an arrow at the ground, it grants vision in a 3x3 area around it for _5 turns_. This has a 20 turn cooldown.\n\n_+2:_ When the Huntress fires an arrow at the ground, it grants vision in a 3x3 area around it for _10 turns_. This has a 20 turn cooldown.\n\n_+3:_ When the Huntress fires an arrow at the ground, it grants vision in a 3x3 area around it for _15 turns_. This has a 20 turn cooldown.
actors.hero.talent.seer_shot.meta_desc=_If this talent is gained by a different hero_ it will trigger from any thrown weapon.
actors.hero.talent.farsight.title=farsight
actors.hero.talent.farsight.desc=_+1:_ The Sniper's vision range is _increased by 25%_.\n\n_+2:_ The Sniper's vision range is _increased by 50%_.\n\n_+3:_ The Sniper's vision range is _increased by 75%_.
actors.hero.talent.shared_enchantment.title=shared enchantment
actors.hero.talent.shared_enchantment.desc=_+1:_ Thrown weapons have a _33% chance_ to use the enchantment on the Sniper's bow.\n\n_+2:_ Thrown weapons have a _67% chance_ to use the enchantment on the Sniper's bow.\n\n_+3:_ Thrown weapons have a _100% chance_ to use the enchantment on the Sniper's bow.\n\nThis talent does not apply to darts shot from an enchanted crossbow, they already trigger the crossbow's enchantment.
actors.hero.talent.shared_upgrades.title=shared upgrades
actors.hero.talent.shared_upgrades.desc=_+1:_ When the Sniper attacks with an upgraded thrown weapon, each level increases the duration of sniper's mark by 1 turn and the damage of her special attack by _10%_.\n\n_+2:_ When the Sniper attacks with an upgraded thrown weapon, each level increases the duration of sniper's mark by 1 turn and the damage of her special attack by _20%_.\n\n_+3:_ When the Sniper attacks with an upgraded thrown weapon, each level increases the duration of sniper's mark by 1 turn and the damage of her special attack by _30%_.
actors.hero.talent.durable_tips.title=durable tips
actors.hero.talent.durable_tips.desc=_+1:_ Tipped darts have _2x durability_ when the Warden uses them.\n\n_+2:_ Tipped darts have _3x durability_ when the Warden uses them.\n\n_+3:_ Tipped darts have _4x durability_ when the Warden uses them.
actors.hero.talent.barkskin.title=barkskin
actors.hero.talent.barkskin.desc=_+1:_ When stepping in grass, the Warden gains _0-50% of her level_ in barkskin armor which fades every turn.\n\n_+2:_ When stepping in grass, the Warden gains _0-100% of her level_ in barkskin armor which fades every turn.\n\n_+3:_ When stepping in grass, the Warden gains _0-150% of her level_ in barkskin armor which fades every turn.
actors.hero.talent.shielding_dew.title=shielding dew
actors.hero.talent.shielding_dew.desc=_+1:_ Dewdrops can shield the Warden when her health is full, up to _20% of her max HP_.\n\n_+2:_ Dewdrops can shield the Warden when her health is full, up to _40% of her max HP_.\n\n_+3:_ Dewdrops can shield the Warden when her health is full, up to _60% of her max HP_.
actors.hero.talent.fan_of_blades.title=fan of blades
actors.hero.talent.fan_of_blades.desc=_+1:_ Spectral blades can hit up to _1 additional target_ for 50% damage. The target must be visible and within a _30 degree_ cone AOE.\n\n_+2:_ Spectral blades can hit up to _2 additional targets_ for 50% damage. The targets must be visible and within a _60 degree_ cone AOE.\n\n_+3:_ Spectral blades can hit up to _3 additional targets_ for 50% damage. The targets must be visible and within a _90 degree_ cone AOE.\n\n_+4:_ Spectral blades can hit up to _4 additional targets_ for 50% damage. The targets must be visible and within a _120 degree_ cone AOE.
actors.hero.talent.projecting_blades.title=projecting blades
actors.hero.talent.projecting_blades.desc=_+1:_ Spectral blades has _+25% accuracy_, and can penetrate up to _2 solid tiles_.\n\n_+2:_ Spectral blades has _+50% accuracy_, and can penetrate up to _4 solid tiles_.\n\n_+3:_ Spectral blades has _+75% accuracy_, and can penetrate up to _6 solid tiles_.\n\n_+4:_ Spectral blades has _+100% accuracy_, and can penetrate up to _8 solid tiles_.
actors.hero.talent.spirit_blades.title=spirit blades
actors.hero.talent.spirit_blades.desc=_+1:_ Spectral blades has a _30% chance_ to also use the enchantment on the spirit bow.\n\n_+2:_ Spectral blades has a _60% chance_ to also use the enchantment on the spirit bow.\n\n_+3:_ Spectral blades has a _90% chance_ to also use the enchantment on the spirit bow.\n\n_+4:_ Spectral blades has a _100% chance_ to also use the enchantment on the spirit bow, and it gives each enchantment _+10% power_.
actors.hero.talent.growing_power.title=growing power
actors.hero.talent.growing_power.desc=_+1:_ The attack and movespeed boosts from nature's power are increased to _38% and 125%_, from 33% and 100%.\n\n_+2:_ The attack and movespeed boosts from nature's power are increased to _42% and 150%_, from 33% and 100%.\n\n_+3:_ The attack and movespeed boosts from nature's power are increased to _46% and 175%_, from 33% and 100%.\n\n_+4:_ The attack and movespeed boosts from nature's power are increased to _50% and 200%_, from 33% and 100%.
actors.hero.talent.natures_wrath.title=nature's wrath
actors.hero.talent.natures_wrath.desc=_+1:_ While nature's power is active, shots from the spirit bow have an _8% chance_ to trigger a random harmful plant effect.\n\n_+2:_ While nature's power is active, shots from the spirit bow have a _17% chance_ to trigger a random harmful plant effect.\n\n_+3:_ While nature's power is active, shots from the spirit bow have an _25% chance_ to trigger a random harmful plant effect.\n\n_+4:_ While nature's power is active, shots from the spirit bow have a _33% chance_ to trigger a random harmful plant effect.\n\nThe plants that can be triggered are: blindweed, firebloom, icecap, sorrowmoss, and stormvine.
actors.hero.talent.wild_momentum.title=wild momentum
actors.hero.talent.wild_momentum.desc=_+1:_ Killing an enemy with the spirit bow prolongs the duration of nature's power by _1 turn_. The duration can be extended by a max of _2 turns_.\n\n_+2:_ Killing an enemy with the spirit bow prolongs the duration of nature's power by _2 turns_. The duration can be extended by a max of _4 turns_.\n\n_+3:_ Killing an enemy with the spirit bow prolongs the duration of nature's power by _3 turns_. The duration can be extended by a max of _6 turns_.\n\n_+4:_ Killing an enemy with the spirit bow prolongs the duration of nature's power by _4 turns_. The duration can be extended by a max of _8 turns_.
actors.hero.talent.eagle_eye.title=eagle eye
actors.hero.talent.eagle_eye.desc=_+1:_ The spirit hawk's vision range is increased to _7 tiles_ from 6.\n\n_+2:_ The spirit hawk's vision range is increased to _8 tiles_ from 6.\n\n_+3:_ The spirit hawk's vision range is increased to _9 tiles_ from 6, and it gets _2 tiles_ of mind vision.\n\n_+4:_ The spirit hawk's vision range is increased to _10 tiles_ from 6, and it gets _3 tiles_ of mind vision.
actors.hero.talent.go_for_the_eyes.title=go for the eyes
actors.hero.talent.go_for_the_eyes.desc=_+1:_ Attacks from the spirit hawk blind enemies for _2 turns_.\n\n_+2:_ Attacks from the spirit hawk blind enemies for _5 turns_.\n\n_+3:_ Attacks from the spirit hawk blind enemies for _5 turns_ and cripple them for _2 turns_.\n\n_+4:_ Attacks from the spirit hawk blind enemies for _5 turns_ and cripple them for _5 turns_.
actors.hero.talent.swift_spirit.title=swift spirit
actors.hero.talent.swift_spirit.desc=_+1:_ The spirit hawk's movement speed is increased to _2.5 tiles_ from 2, and it is guaranteed to dodge the first _2 attacks_ made against it.\n\n_+2:_ The spirit hawk's movement speed is increased to _3 tiles_ from 2, and it is guaranteed to dodge the first _4 attacks_ made against it.\n\n_+3:_ The spirit hawk's movement speed is increased to _3.5 tiles_ from 2, and it is guaranteed to dodge the first _6 attacks_ made against it.\n\n_+4:_The spirit hawk's movement speed is increased to _4 tiles_ from 2, and it is guaranteed to dodge the first _8 attacks_ made against it.
actors.hero.talent.strengthening_meal.title=strengthening meal
actors.hero.talent.strengthening_meal.desc=_+1:_ Eating food grants the Duelist 3 bonus damage the next _2 times_ she hits an enemy with a physical attack.\n\n_+2:_ Eating food grants the Duelist 3 bonus damage the next _3 times_ she hits an enemy with a physical attack.
actors.hero.talent.adventurers_intuition.title=adventurer's intuition
actors.hero.talent.adventurers_intuition.desc=_+1:_ The Duelist identifies weapons _2.5x faster_ and armor _1.75x faster_.\n\n_+2:_ The Duelist identifies weapons _when she equips them_ and armor _2.5x faster_.
actors.hero.talent.patient_strike.title=patient strike
actors.hero.talent.patient_strike.desc=_+1:_ If the Duelist waits before performing a melee attack, she will deal _1-2 bonus damage_.\n\n_+2:_ If the Duelist waits before performing a melee attack, she will deal _2 bonus damage_.
actors.hero.talent.aggressive_barrier.title=aggressive barrier
actors.hero.talent.aggressive_barrier.desc=_+1:_ The Duelist gains _3 shielding_ when she uses a weapon ability and is at or below 50% health.\n\n_+2:_ The Duelist gains _5 shielding_ when she uses a weapon ability and is at or below 50% health.
actors.hero.talent.aggressive_barrier.meta_desc=_If this talent is gained by a different hero_ it will instead grant shielding when making a melee attack at low health, with a 50 turn cooldown.
actors.hero.talent.focused_meal.title=focused meal
actors.hero.talent.focused_meal.desc=_+1:_ Eating food takes the Duelist 1 turn and grants her _0.67 charges_ on her weapons.\n\n_+2:_ Eating food takes the Duelist 1 turn and grants her _1 charge_ on her weapons.
actors.hero.talent.focused_meal.meta_desc=_If this talent is gained by a different hero_ it will instead grant bonus damage to their next hit equal to their level/3 at +1, or level/2 at +2.
actors.hero.talent.liquid_agility.title=liquid agility
actors.hero.talent.liquid_agility.desc=_+1:_ When drinking or throwing a potion, brew, or elixir, the Duelist has _3x evasion_, and has _3x accuracy_ on her next melee attack within 5 turns.\n\n_+2:_ When drinking or throwing a potion, brew, or elixir, the Duelist has _infinite evasion_, and has _infinite accuracy_ on her next melee attack within 5 turns.\n\nThis bonus lasts for one additional turn and attack when using potions of strength, experience, or alchemy items that must be crafted using those potions.\n\nFor alchemy items with higher output quantities (e.g. aqua brew), this talent has a chance to trigger based on how many of that item is produced.
actors.hero.talent.weapon_recharging.title=weapon recharging
actors.hero.talent.weapon_recharging.desc=_+1:_ The Duelist gains one weapon charge every _15 turns_ when under the effect of wand or artifact recharging buffs.\n\n_+2:_ The Duelist gains one weapon charge every _10 turns_ when under the effect of wand or artifact recharging buffs.
actors.hero.talent.weapon_recharging.meta_desc=_If this talent is gained by a different hero_ it will instead cause them to deal +5% melee damage while recharging at +1, or +7.5% melee damage while recharging at +2.
actors.hero.talent.lethal_haste.title=lethal haste
actors.hero.talent.lethal_haste.desc=_+1:_ When the Duelist lands a killing blow on an enemy with a weapon ability, she gains _3 turns_ worth of instant movement.\n\n_+2:_ When the Duelist lands a killing blow on an enemy with a weapon ability, she gains _5 turns_ worth of instant movement.
actors.hero.talent.lethal_haste.meta_desc=_If this talent is gained by a different hero_ it will instead trigger with regular weapon attacks, with a 100 turn cooldown.
actors.hero.talent.swift_equip.title=swift equip
actors.hero.talent.swift_equip.desc=_+1:_ The Duelist can switch her equipped weapon instantly _one time_ every 20 turns.\n\n_+2:_ The Duelist can switch her equipped weapon instantly _two times_ every 20 turns.\n\nIf the Duelist has this talent and it is not on cooldown, quick-using an unequipped weapon will equip it.
actors.hero.talent.precise_assault.title=precise assault
actors.hero.talent.precise_assault.desc=_+1:_ When the Duelist uses a weapon ability, she gains _2x accuracy_ on her next melee attack within 5 turns.\n\n_+2:_ When the Duelist uses a weapon ability, she gains _5x accuracy_ on her next melee attack within 5 turns.\n\n_+3:_ When the Duelist uses a weapon ability, she gains _infinite accuracy_ on her next melee attack within 5 turns.
actors.hero.talent.precise_assault.meta_desc=_If this talent is gained by a different hero_ it will instead increase melee accuracy by 10% at +1, 20% at +2, or 30% at +3.
actors.hero.talent.deadly_followup.title=deadly followup
actors.hero.talent.deadly_followup.desc=_+1:_ When the Duelist hits an enemy with a thrown weapon, she will deal _10% more melee damage_ to them for 5 turns.\n\n_+2:_ When the Duelist hits an enemy with a thrown weapon, she will deal _20% more melee damage_ to them for 5 turns.\n\n_+3:_ When the Duelist hits an enemy with a thrown weapon, she will deal _30% more melee damage_ to them for 5 turns.
actors.hero.talent.varied_charge.title=varied charge
actors.hero.talent.varied_charge.desc=_+1:_ The Champion instantly regains _0.17 weapon charges_ when she uses two different weapon abilities, with no time limit.\n\n_+2:_ The Champion instantly regains _0.33 weapon charges_ when she uses two different weapon abilities, with no time limit.\n\n_+3:_ The Champion instantly regains _0.5 weapon charges_ when she uses two different weapon abilities, with no time limit.
actors.hero.talent.twin_upgrades.title=twin upgrades
actors.hero.talent.twin_upgrades.desc=_+1:_ If one of the Champion's two equipped weapons has a lower level and is _2 or more tiers lower_ than the other weapon, it will be boosted to the other weapon's level.\n\n_+2:_ If one of the Champion's two equipped weapons has a lower level and is _1 or more tiers lower_ than the other weapon, it will be boosted to the other weapon's level.\n\n_+3:_ If one of the Champion's two equipped weapons has a lower level and is _the same tier or lower_ than the other weapon, it will be boosted to the other weapon's level.
actors.hero.talent.combined_lethality.title=combined lethality
actors.hero.talent.combined_lethality.desc=_+1:_ If the Champion attacks with a melee weapon immediately after using a different weapon's ability, that attack will execute any non-boss enemy left at _below 13% HP_.\n\n_+2:_ If the Champion attacks with a melee weapon immediately after using a different weapon's ability, that attack will execute any non-boss enemy left at _below 27% HP_.\n\n_+3:_ If the Champion attacks with a melee weapon immediately after using a different weapon's ability, that attack will execute any non-boss enemy left at _below 40% HP_.\n\nThis attack can be a regular melee weapon attack, or part of a weapon ability.
actors.hero.talent.unencumbered_spirit.title=unencumbered spirit
actors.hero.talent.unencumbered_spirit.desc=_+1:_ The Monk gains _50% more energy_ for each piece of _tier 3 or lower_ equipment she is using.\n\n_+2:_ This talent's effect is increased to _75% more energy_ for each piece of _tier 2 or lower_ equipment the Monk is using.\n\n_+3:_ This talent's effect is increased to _100% more energy_ for each piece of _tier 1_ equipment the Monk is using. She also gains a free cloth armor and studded gloves.\n\nNote that this talent gives no benefit from being unarmed or attacking with a Ring of Force.
actors.hero.talent.monastic_vigor.title=monastic vigor
actors.hero.talent.monastic_vigor.desc=_+1:_ If the Monk has _100% energy_, her abilities are empowered.\n\n_+2:_ If the Monk has _80% or more energy_, her abilities are empowered.\n\n_+3:_ If the Monk has _60% or more energy_, her abilities are empowered.\n\nWhen empowered:\n- Flurry applies your weapon's enchantment\n- Focus is instantaneous\n- Dash gains +4 range\n- Dragon Kick deals +50% damage and applies its knock back and stun effect to all adjacent enemies\n- Meditate slowly heals 20% of missing HP and grants 80% damage resistance.
actors.hero.talent.combined_energy.title=combined energy
actors.hero.talent.combined_energy.desc=_+1:_ If the Monk uses a weapon ability and a _4+ energy_ ability within 5 turns of each other, she regains 1 spent energy.\n\n_+2:_ If the Monk uses a weapon ability and a _3+ energy_ ability within 5 turns of each other, she regains 1 spent energy.\n\n_+3:_ If the Monk uses a weapon ability and a _2+ energy_ ability within 5 turns of each other, she regains 1 spent energy.
actors.hero.talent.close_the_gap.title=close the gap
actors.hero.talent.close_the_gap.desc=_+1:_ The Duelist blinks _up to two tiles_ toward her target when starting a duel.\n\n_+2:_ The Duelist blinks _up to three tiles_ toward her target when starting a duel.\n\n_+3:_ The Duelist blinks _up to four tiles_ toward her target when starting a duel.\n\n_+4:_ The Duelist blinks _up to five tiles_ toward her target when starting a duel.\n\nThis blink can go through hazards and enemies, but not solid terrain like walls. The blink is taken into account when determining if an enemy is in range to be challenged.
actors.hero.talent.invigorating_victory.title=invigorating victory
actors.hero.talent.invigorating_victory.desc=_+1:_ If the Duelist defeats her target before the duel ends, she heals for _5 HP plus 30% of the damage_ she took during the duel.\n\n_+2:_ If the Duelist defeats her target before the duel ends, she heals for _10 HP plus 50% of the damage_ she took during the duel.\n\n_+3:_ If the Duelist defeats her target before the duel ends, she heals for _15 HP plus 65% of the damage_ she took during the duel.\n\n_+4:_ If the Duelist defeats her target before the duel ends, she heals for _20 HP plus 75% of the damage_ she took during the duel.
actors.hero.talent.elimination_match.title=elimination match
actors.hero.talent.elimination_match.desc=_+1:_ If the Duelist challenges again within 3 turns of a duel ending, that challenge has a _16% reduced_ charge cost.\n\n_+2:_ If the Duelist challenges again within 3 turns of a duel ending, that challenge has a _30% reduced_ charge cost.\n\n_+3:_ If the Duelist challenges again within 3 turns of a duel ending, that challenge has a _40% reduced_ charge cost.\n\n_+4:_ If the Duelist challenges again within 3 turns of a duel ending, that challenge has a _50% reduced_ charge cost.
actors.hero.talent.elemental_reach.title=elemental reach
actors.hero.talent.elemental_reach.desc=_+1:_ Elemental strike's range is increased to _5 tiles_ from 4, and its width is increased to _75 degrees_ from 65.\n\n_+2:_ Elemental strike's range is increased to _6 tiles_ from 4, and its width is increased to _85 degrees_ from 65.\n\n_+3:_ Elemental strike's range is increased to _7 tiles_ from 4, and its width is increased to _95 degrees_ from 65.\n\n_+4:_ Elemental strike's range is increased to _8 tiles_ from 4, and its width is increased to _105 degrees_ from 65.
actors.hero.talent.striking_force.title=striking force
actors.hero.talent.striking_force.desc=_+1:_ The power of elemental strike's effect is increased by _30%_.\n\n_+2:_ The power of elemental strike's effect is increased by _60%_.\n\n_+3:_ The power of elemental strike's effect is increased by _90%_.\n\n_+4:_ The power of elemental strike's effect is increased by _120%_.
actors.hero.talent.directed_power.title=directed power
actors.hero.talent.directed_power.desc=_+1:_ The direct attack from elemental strike gains _+30% enchantment power_ for each enemy in range of elemental strike's effect, including the attack target.\n\n_+2:_ The direct attack from elemental strike gains _+60% enchantment power_ for each enemy in range of elemental strike's effect, including the attack target.\n\n_+3:_ The direct attack from elemental strike gains _+90% enchantment power_ for each enemy in range of elemental strike's effect, including the attack target.\n\n_+4:_ The direct attack from elemental strike gains _+120% enchantment power_ for each enemy in range of elemental strike's effect, including the attack target.
actors.hero.talent.feigned_retreat.title=feigned retreat
actors.hero.talent.feigned_retreat.desc=_+1:_ If an enemy attacks the Duelist's afterimage, she gains _2 turns_ of haste.\n\n_+2:_ If an enemy attacks the Duelist's afterimage, she gains _4 turns_ of haste.\n\n_+3:_ If an enemy attacks the Duelist's afterimage, she gains _6 turns_ of haste.\n\n_+4:_ If an enemy attacks the Duelist's afterimage, she gains _8 turns_ of haste.
actors.hero.talent.expose_weakness.title=expose weakness
actors.hero.talent.expose_weakness.desc=_+1:_ Enemies that attack the Duelist's afterimage become weak and vulnerable for _2 turns_.\n\n_+2:_ Enemies that attack the Duelist's afterimage become weak and vulnerable for _4 turns_.\n\n_+3:_ Enemies that attack the Duelist's afterimage become weak and vulnerable for _6 turns_.\n\n_+4:_ Enemies that attack the Duelist's afterimage become weak and vulnerable for _8 turns_.
actors.hero.talent.counter_ability.title=counter ability
actors.hero.talent.counter_ability.desc=_+1:_ If the Duelist uses a weapon ability within 3 turns of her afterimage being attacked, she will instantly regain _0.38 charges_.\n\n_+2:_ If the Duelist uses a weapon ability within 3 turns of her afterimage being attacked, she will instantly regain _0.77 charges_.\n\n_+3:_ If the Duelist uses a weapon ability within 3 turns of her afterimage being attacked, she will instantly regain _1.13 charges_.\n\n_+4:_ If the Duelist uses a weapon ability within 3 turns of her afterimage being attacked, she will instantly regain _1.5 charges_.
actors.hero.talent.heroic_energy.title=heroic energy
actors.hero.talent.heroic_energy.rat_title=ratroic energy
actors.hero.talent.heroic_energy.desc=_+1:_ The hero's armor ability has a _12% reduced_ charge cost.\n\n_+2:_ The hero's armor ability has a _23% reduced_ charge cost.\n\n_+3:_ The hero's armor ability has a _32% reduced_ charge cost.\n\n_+4:_ The hero's armor ability has a _40% reduced_ charge cost.
actors.hero.talent.ratsistance.title=ratsistance
actors.hero.talent.ratsistance.desc=_+1:_ Hostile ratmogrified enemies deal _-10% damage_.\n\n_+2:_ Hostile ratmogrified enemies deal _-19% damage_.\n\n_+3:_ Hostile ratmogrified enemies deal _-27% damage_.\n\n_+4:_ Hostile ratmogrified enemies deal _-35% damage_.
actors.hero.talent.ratlomacy.title=ratlomacy
actors.hero.talent.ratlomacy.desc=_+1:_ Using ratmogrify on a ratmogrified enemy makes them friendly and makes the transformation permanent.\n\n_+2:_ Using ratmogrify on a ratmogrified enemy makes them friendly, makes the transformation permanent, and gives them _2 turns_ of adrenaline.\n\n_+3:_ Using ratmogrify on a ratmogrified enemy makes them friendly, makes the transformation permanent, and gives them _4 turns_ of adrenaline.\n\n_+4:_ Using ratmogrify on a ratmogrified enemy makes them friendly, makes the transformation permanent, and gives them _6 turns_ of adrenaline.
actors.hero.talent.ratforcements.title=ratforcements
actors.hero.talent.ratforcements.desc=_+1:_ Using ratmogrify on yourself _spawns 1_ ally marsupial rat next to you.\n\n_+2:_ Using ratmogrify on yourself _spawns 2_ ally marsupial rats next to you.\n\n_+3:_ Using ratmogrify on yourself _spawns 3_ ally marsupial rats next to you.\n\n_+4:_ Using ratmogrify on yourself _spawns 4_ ally marsupial rats next to you.
actors.hero.herosubclass.kingy=rat king
actors.hero.herosubclass.kingy_desc=Reading the book of Mastery grants Rat King the power of all subclasses!
actors.hero.perks.perk_obtain=You learned %s!
actors.hero.perks.sucker_punch.name=sucker punch
actors.hero.perks.sucker_punch.desc=First surprise attack deals 25% additional armor-piercing damage.
actors.hero.perks.directive.name=directive
actors.hero.perks.directive.desc=First surprise attack gives 1.5 turns of haste.
actors.hero.perks$directivemovingtracker.name=Instant Steps
actors.hero.perks$directivemovingtracker.desc=Your movement will take 0 tiles unless you stop moving.\n\nMoves left: %s.
actors.hero.perks.follow_up_strike.name=follow-up strike
actors.hero.perks.follow_up_strike.desc=After hitting enemy with a bow or throwing weapon, next melee attack will deal 25% additional armor-piercing damage.
actors.hero.perks.hold_fast.name=hold fast
actors.hero.perks.hold_fast.desc=While waiting in place, you get additional %s-%s armor.
actors.hero.perks.protein_infusion.name=protein infusion
actors.hero.perks.protein_infusion.desc=The hero gets up to 2x speed and 1.5x evasion depending on their satiety.
actors.hero.perks.fishing_pro.name=fishing proficiency
actors.hero.perks.fishing_pro.desc=With 25% chance the fishing loot will be doubled.
actors.hero.perks.wand_pro.name=recharge proficiency
actors.hero.perks.wand_pro.desc=Your wands recharge 25% faster.
actors.hero.perks.iron_will.name=iron reflection
actors.hero.perks.iron_will.desc=Below 50% HP taking damage from physical or magical attacks will release damaging shockwaves into enemies.
actors.hero.perks.mystical_meal.name=mystical meal
actors.hero.perks.mystical_meal.desc=Eating grants 6 turns of artifact recharge.
actors.hero.perks.additional_money.name=bounty hunter
actors.hero.perks.additional_money.desc=Killing enemies drops gold equivalent to 20% of regularly dropped gold.
actors.hero.perks.better_bartering.name=efficient bartering
actors.hero.perks.better_bartering.desc=Trading with Rat King has 33% chance to not consume an item.
actors.hero.perks.potions.name=lots of experience
actors.hero.perks.potions.desc=Potions of Overload and Potions of Experience last 2x longer.
actors.hero.perks.more_bag.name=bigger lootbags
actors.hero.perks.more_bag.desc=Treasure bags from shop contain roughly 50% more items.
actors.hero.perks.no_oneshots.name=steel skin
actors.hero.perks.no_oneshots.desc=If the incoming damage is going to kill you from full HP, it will be reduced by 50%.
actors.hero.perks.collect_everything.name=magnetic meal
actors.hero.perks.collect_everything.desc=Eating overpriced rations causes every top item in every heap on the map to be collected instantly.
actors.hero.perks.rat_summons.name=ratforcements
actors.hero.perks.rat_summons.desc=Searching in place will spawn several ally marsupial rats next to you, with 25 turns of adrenaline.
actors.hero.perks.grass_healing.name=restored nature
actors.hero.perks.grass_healing.desc=Drinking a potion of healing spawns 5x5 square of grass, centered around the hero, and roots every enemy inside it for 3 turns.
actors.hero.perks.friendly_bees.name=friendly bees
actors.hero.perks.friendly_bees.desc=All bees, spawned from shattered honeypots, will fight for hero.
actors.hero.perks.raritize_magic.name=Raritizing Magic
actors.hero.perks.raritize_magic.desc=Mobs will drop an item (artifacts, wands, weapons, rings, armors) with rarity (or nothing) at 7% chance.
actors.hero.perks.supply_rations.name=Cached Rations
actors.hero.perks.supply_rations.desc=You can now find cached rations in chests with _1/(25 + (5 * rations found))_ chance while you explore the next few floors in the dungeon.\n\nSupply rations are eaten quickly, restore a moderate amount of satiety, heal 5 hp, and restore 1 charge to the cloak of shadows (if you have the item).
actors.hero.perks.dungeon_berry.name=Nature's Bounty
actors.hero.perks.dungeon_berry.desc=You can now find berries in tall grass with _1/(15 + (5 * berries found))_ chance while you explore the next few floors in the dungeon.\n\nBerries are eaten quickly, restore a moderate amount of satiety, and might contain a usable seed.
actors.mobs.npcs.blacksmith.name=troll blacksmith
actors.mobs.npcs.blacksmith.intro_quest_ratking=Hello Our Majesty!
actors.mobs.npcs.blacksmith.intro_quest_warrior=Hey Human! You look like a tough one.
actors.mobs.npcs.blacksmith.intro_quest_mage=Hey Human! You look like a smart one.
actors.mobs.npcs.blacksmith.intro_quest_rogue=Hey Human! You look like a sneaky one.
actors.mobs.npcs.blacksmith.intro_quest_huntress=Hey Human! You look like a quick one.
actors.mobs.npcs.blacksmith.intro_quest_duelist=Hey Human! You look like a brave one.
actors.mobs.npcs.blacksmith.intro_quest_cleric=Hey Human! You look like an important one.
actors.mobs.npcs.blacksmith.intro_quest_start=Wanna be useful, eh? Yeah I got something you could do. I built dis workshop ontop of an old mine, it's just down dat ladder. Take dis pickaxe and mine me some _dark gold ore. 40 pieces_ should be enough. The rock down der is nice and soft so _you'll be able to mine through the walls with some effort._\n\nWhat do you mean, how am I gonna pay? You greedy...\n\nOk, ok, I can do some smithin' for you. Consider yourself lucky, I'm the only blacksmith around.
actors.mobs.npcs.blacksmith.intro_quest_crystal=Careful though, the mine's dangerous for a little human like you. It's been abandoned for a while, and bunch of crystals have started growing. They're shiny, but too fragile to be worth anythin', and they've got some magic things protecting 'em. They're pretty strong, so _be careful where you mine_ or you'll get their attention.\n\nThere's a _giant crystal_ somewhere too. It's a lot tougher, so be prepared for a fight if you start breakin' it. I'll bet smashing it will slow all the crystal growth down though, so I'll pay extra if you can do it.
actors.mobs.npcs.blacksmith.intro_quest_gnoll=Careful though, the mine's dangerous for a little human like you. Some gnolls want the gold too and now they're wreckin' the place. They're stupid things, so their mining has caused all sorts of collapses and cave-ins. You'll have to mine through it, so _look for recently disturbed rock._\n\nI think one of the gnolls is causing most of the trouble, probably a _geomancer shaman_ or somethin'. I'll pay extra, if you can find and kill it, but I'm sure it'll fight back.
actors.mobs.npcs.blacksmith.intro_quest_fungi=Careful though, the mine's dangerous for a little human like you. There's some sorta fungus monster that's been growing down there. It's got mushroom sentries that're really deadly if they see you, but they can't get up and chase you at least. _Keep out of sight_ if you want to stay alive.\n\nI'll pay extra if you can manage to take down the _biggest mushrom,_ but it'll take some real effort. It's connected to a bunch of mycelium nodes that're hidden in the walls. You'll have to break most of 'em before you can really damage it.
actors.mobs.npcs.blacksmith.reminder=You done wastin' my time? The mine entrance is over there.
actors.mobs.npcs.blacksmith.reminder_crystal=Bring me as much gold as you can, and try to break the big crystal too.
actors.mobs.npcs.blacksmith.reminder_gnoll=Bring me as much gold as you can, and try to kill the gnoll geomancer too.
actors.mobs.npcs.blacksmith.reminder_fungi=Bring me as much gold as you can, and try to kill the giant mushroom too.
actors.mobs.npcs.blacksmith.lost_pick=Are you kiddin' me? Where is my pickaxe?!
actors.mobs.npcs.blacksmith.quest_start_prompt=You ready to go down? Make sure you've got some free space for the gold.\n\n_I'm only lettin' you down der once!_
actors.mobs.npcs.blacksmith.enter_yes=I'm Ready
actors.mobs.npcs.blacksmith.enter_no=Not Yet
actors.mobs.npcs.blacksmith.exit_warn_none=You done already? You've hardly got any gold at all! You should be able to get _40 pieces._\n\n_Remember, I'm not lettin' you back in once you come up._
actors.mobs.npcs.blacksmith.exit_warn_low=You done already? Doesn't look like you've got a lot of gold. You should be able to get _40 pieces._\n\n_Remember, I'm not lettin' you back in once you come up._
actors.mobs.npcs.blacksmith.exit_warn_med=You done? You've got some gold at least, but there's definitely more in the mine. You should be able to get _40 pieces._\n\n_Remember, I'm not lettin' you back in once you come up._
actors.mobs.npcs.blacksmith.exit_warn_high=You done? Looks like you've got a good amount of gold, but I could use a bit more. You should be able to get _40 pieces._\n\n_Remember, I'm not lettin' you back in once you come up._
actors.mobs.npcs.blacksmith.exit_warn_full=You done? You've got lots of gold, but make sure you haven't left any of your gear behind.\n\n_Remember, I'm not lettin' you back in once you come up._
actors.mobs.npcs.blacksmith.exit_warn_crystal=That giant crystal's still down there too. I'll pay extra if you destroy it.
actors.mobs.npcs.blacksmith.exit_warn_gnoll=That gnoll geomancer's still down there too. I'll pay extra if you kill it.
actors.mobs.npcs.blacksmith.exit_warn_fungi=That giant mushroom's still down there too. I'll pay extra if you kill it.
actors.mobs.npcs.blacksmith.exit_yes=I'm Done
actors.mobs.npcs.blacksmith.exit_no=Not Yet
actors.mobs.npcs.blacksmith.entrance_blocked=The way down is blocked.
actors.mobs.npcs.blacksmith.cant_enter_old=That area is not accessible on this run. Play a new game to try the new quest!
actors.mobs.npcs.blacksmith.def_verb=blocked
actors.mobs.npcs.blacksmith.desc=This troll blacksmith looks like all trolls look: he is tall and lean, and his skin resembles stone in both color and texture. The troll blacksmith is tinkering with disproportionally small tools.
actors.mobs.npcs.blacksmith.gold_1=Hey human! Wanna be useful, eh? Take dis pickaxe and mine me some _dark gold ore, 15 pieces_ should be enough. What do you mean, how am I gonna pay? You greedy...\nOk, ok, I don't have money to pay, but I can do some smithin' for you. Consider yourself lucky, I'm the only blacksmith around.
actors.mobs.npcs.blacksmith.blood_1=Hey human! Wanna be useful, eh? Take dis pickaxe and _kill a bat_ wit' it, I need its blood on the head. What do you mean, how am I gonna pay? You greedy...\nOk, ok, I don't have money to pay, but I can do some smithin' for you. Consider yourself lucky, I'm the only blacksmith around.
actors.mobs.npcs.blacksmith.gold_2=Dark gold ore. 15 pieces. Seriously, is it dat hard?
actors.mobs.npcs.blacksmith.blood_2=I said I need bat blood on the pickaxe. Chop chop!
actors.mobs.npcs.blacksmith.completed=Oh, you have returned... Better late dan never.
actors.mobs.npcs.blacksmith.get_lost=I'm busy. Get lost!
actors.mobs.npcs.blacksmith.same_item=Select 2 different items, not the same item twice!
actors.mobs.npcs.blacksmith.diff_type=Select 2 items of the same type!
actors.mobs.npcs.blacksmith.un_ided=I need to know what I'm working with, identify them first!
actors.mobs.npcs.blacksmith.cursed=I don't work with cursed items!
actors.mobs.npcs.blacksmith.degraded=It's junk, the quality is too poor!
actors.mobs.npcs.blacksmith.cant_reforge=I can't reforge these items!
actors.mobs.npcs.blacksmith.key=Oh, you here. I never thought that you will actually finish this quest. It's quite embarrassing to get busted so easily... Did you know, than Wand of Fireblast had a brother? He is called Wand of Avalanche.\n\nThe people loved him more than his sister... That's why it was banished, to point of no return. Until now.\n\nI was really bored and decided to extract this wand from game files, but they were erased, as usual. But I have managed to program it back. It was quite glitchy, hehehe. But don't worry, this new wand is completely fixed and will work as designed!\n\n(Wand of Avalanche recipe has been added.)
actors.mobs.npcs.ghost.name=sad ghost
actors.mobs.npcs.ghost.rat_1=Hello %s... Once I was like you - strong and confident... But I was slain by a foul beast... I can't leave this place... Not until I have my revenge... Slay the _fetid rat,_ that has taken my life...\n\nIt stalks this floor... Spreading filth everywhere... _Beware its cloud of stink and corrosive bite, the acid dissolves in water..._
actors.mobs.npcs.ghost.rat_2=Please... Help me... Slay the abomination...\n\n_Fight it near water... Avoid the stench..._
actors.mobs.npcs.ghost.gnoll_1=Hello %s... Once I was like you - strong and confident... But I was slain by a devious foe... I can't leave this place... Not until I have my revenge... Slay the _gnoll trickster,_ that has taken my life...\n\nIt is not like the other gnolls... It hides and uses thrown weapons... _Beware its poisonous and incendiary darts, don't attack from a distance..._
actors.mobs.npcs.ghost.gnoll_2=Please... Help me... Slay the trickster...\n\n_Don't let it hit you... Get near to it..._
actors.mobs.npcs.ghost.crab_1=Hello %s... Once I was like you - strong and confident... But I was slain by an ancient creature... I can't leave this place... Not until I have my revenge... Slay the _great crab,_ that has taken my life...\n\nIt is unnaturally old... With a massive single claw and a thick shell... _Beware its claw, you must surprise the crab or it will block with it..._
actors.mobs.npcs.ghost.crab_2=Please... Help me... Slay the Crustacean...\n\n_It will always block... When it sees you coming..._
actors.mobs.npcs.ghost.find_me=Thank you... come find me...
actors.mobs.npcs.ghost.desc=The ghost is barely visible. It looks like a shapeless spot of faint light with a sorrowful face.
actors.mobs.npcs.imp.name=ambitious imp
actors.mobs.npcs.imp.intro=Are you an adventurer? I love adventurers! You can always rely on them if something needs to be killed, am I right? For a bounty of course ;)
actors.mobs.npcs.imp.golems_1=In my case it's _golems_ that need to be killed. You see, I'm going to start a little business here, but those stupid golems are bad for business! It's very hard to negotiate with wandering lumps of granite, damn them! So please kill... let's say _4 of them_ and a reward is yours.
actors.mobs.npcs.imp.monks_1=In my case it's _monks_ who need to be killed. You see, I'm going to start a little business here, but those lunatics don't buy anything themselves and will scare away other customers. So please kill... let's say _5 of them_ and a reward is yours.
actors.mobs.npcs.imp.golems_2=How is your golem safari going? Just don't forget to grab those tokens.
actors.mobs.npcs.imp.monks_2=Oh, you're still alive! I knew that your kung-fu would be stronger ;) Just don't forget to grab those tokens.
actors.mobs.npcs.imp.cya=See you, %s!
actors.mobs.npcs.imp.hey=Psst, %s!
actors.mobs.npcs.imp.desc=Imps are lesser demons. They are notable for neither their strength nor their magic talent, but they are quite smart and sociable. Many imps prefer to live among non-demons.
actors.mobs.npcs.impshopkeeper.name=ambitious imp
actors.mobs.npcs.impshopkeeper.greetings=Hello, %s!
actors.mobs.npcs.impshopkeeper.greetings_ascent=What did you do %s? Shop quickly, I've got to get out of here!
actors.mobs.npcs.impshopkeeper.thief=I thought I could trust you!
actors.mobs.npcs.impshopkeeper.buyback=The imp cheerily returns your item.
actors.mobs.npcs.impshopkeeper.desc=The imp has set up a little shop on the border of the inner halls. It's nice to see a friendly face, but his prices certainly don't seem friendly.
actors.mobs.npcs.mirrorimage.name=mirror image
actors.mobs.npcs.mirrorimage.desc=This illusion bears a close resemblance to you, even seeming to wield your current weapon and armor.\n\nMirror images will seek and attack enemies using their mimicked weapon, which behaves the same as yours, but deals less damage. They start out nearly invisible, but must take on a form that's more easily seen in order to attack.\n\nWhile their offensive power can be potent, mirror images have no durability, and will fade the moment they take damage.
actors.mobs.npcs.prismaticimage.name=prismatic image
actors.mobs.npcs.prismaticimage.desc=This shimmering illusion bears a close resemblance to you, even seeming to wield your current weapon and armor.\n\nPrismatic images will attempt to seek and draw focus from enemies, using their enhanced defense and health to protect you. While they do not have the same offensive power as mirror images, they have enhanced durability, including receiving benefits from your armor.\n\nWhen reduced to 0 hp, prismatic images will fade over several turns, and can still be healed during this time. When no enemies are present, prismatic images will fade and rejoin their master.
actors.mobs.npcs.ratking.name=rat king
actors.mobs.npcs.ratking.not_sleeping=I'm not sleeping!
actors.mobs.npcs.ratking.what_is_it=What is it? I have no time for this nonsense. My kingdom won't rule itself!
actors.mobs.npcs.ratking.confused=Wha... Where am I? My kingdom needs me!
actors.mobs.npcs.ratking.crown_clothes=Put some clothes on! You're in no state to talk to royalty!
actors.mobs.npcs.ratking.crown_desc=Oooh, is that crown for me!? It looks much shinier than mine, so I graciously accept!\n\nIn fact, I think I can offer you something as a reward for this crown. A tremendous power befitting a hero such as yourself! Would you like that?
actors.mobs.npcs.ratking.crown_yes=Of course!
actors.mobs.npcs.ratking.crown_info=Tell me more first.
actors.mobs.npcs.ratking.crown_no=I'd rather not...
actors.mobs.npcs.ratking.crown_thankyou=Hehehe, thank you! Now go and make your king proud!
actors.mobs.npcs.ratking.crown_fine=Fine! It's not like I wanted it anyway...
actors.mobs.npcs.ratking.crown_after=Enjoying your new armor? No take-backsies!
actors.mobs.npcs.ratking.desc_crown=This rat is a little bigger than a regular marsupial rat. It's wearing dwarf king's crown on its head.
actors.mobs.npcs.ratking.desc_birthday=This rat is a little bigger than a regular marsupial rat. It's wearing a tiny green party hat instead of its usual crown. Happy birthday Rat King!
actors.mobs.npcs.ratking.desc_winter=This rat is a little bigger than a regular marsupial rat. It's wearing a tiny festive hat instead of its usual crown. Happy Holidays!
actors.mobs.npcs.ratking.desc=This rat is a little bigger than a regular marsupial rat. It's wearing a tiny crown on its head.
actors.mobs.npcs.ratking.ghastly=This mirror image is the manifestation of the Rat King's will. It will not run away, but still trade with you when needed.
actors.mobs.npcs.sheep.name=sheep
actors.mobs.npcs.sheep.baa.=Baa.
actors.mobs.npcs.sheep.baa...=Baa...
actors.mobs.npcs.sheep.def_verb=blocked
actors.mobs.npcs.sheep.desc=This is a magic sheep. What's so magical about it? You can't kill it. It will stand there until it magically fades away, all the while chewing cud with a blank stare.
actors.mobs.npcs.shopkeeper.name=shopkeeper
actors.mobs.npcs.shopkeeper.thief=Thief, Thief!
actors.mobs.npcs.shopkeeper.warn=Watch it! I won't warn you again.
actors.mobs.npcs.shopkeeper.flee=The shopkeeper flees!
actors.mobs.npcs.shopkeeper.sell=Sell an item
actors.mobs.npcs.shopkeeper.talk=Talk
actors.mobs.npcs.shopkeeper.buyback=The shopkeeper reluctantly returns your item.
actors.mobs.npcs.shopkeeper.talk_prison_intro=I have everything you need for a successful adventure!
actors.mobs.npcs.shopkeeper.talk_prison_warrior=That's an interesting seal you've got there, they're usually in one piece. You a disgraced hero or something? Well whatever you've done is none of my business, your coins are still good.
actors.mobs.npcs.shopkeeper.talk_prison_mage=Hehe, I think I've seen a wanted poster with your name on it somewhere in the city. On the run are we? Oh you're innocent are you? Of course, of course... Don't fret, I've got better things to do than report on you, but perhaps you should buy something to be sure?
actors.mobs.npcs.shopkeeper.talk_prison_rogue=Have you come from the thieves guild to clear the area? No, just shopping? Well kill a few monsters while you're here anyway. Don't expect a discount either, I pay good protection money to you people and you're barely keeping me safe down here.
actors.mobs.npcs.shopkeeper.talk_prison_huntress=You seem to be out of your element miss. Tight dungeon corridors aren't as spacious as grand halls or the forests surrounding the city are they? Hehe, oh don't mind my rambling, why not buy something?
actors.mobs.npcs.shopkeeper.talk_prison_duelist=Well if it isn't the travelling hero! If you're trying to save another town then good luck, the dangers here are much worse than petty bandit gangs. I'm sure you'll do better than anyone else could, just try to not die right outside my store.
actors.mobs.npcs.shopkeeper.talk_prison_rat_king=Greetings, Your Majesty. Why you are here at all? You already have all the luxury and popularity in the world... Just for fun? Okay...
actors.mobs.npcs.shopkeeper.talk_caves=Spend money, live longer.\n\nOh and say hello to that Troll blacksmith for me if you see him. Remind the lug that he still owes me money for that hammer I sold him last week!
actors.mobs.npcs.shopkeeper.talk_city=My wares can keep you safe down here.\n\n...And don't loiter if you please. It took forever to get the locals down here to leave me alone, I don't want you attracting any trouble!
actors.mobs.npcs.shopkeeper.talk_halls=Hey there, I've got special prices for demon hunters!\n\nOh and be careful down there! The demons below won't care how courageous you are. You can't come back up and spend more money if you're dead! ;)\n\nAre the demons like me? Hehe, not at all. I'm just a small fellow, not much of a fighter, and I've managed to keep my mind intact. The demons below are much stronger things, and they've all been enslaved by... well... just be careful down there.
actors.mobs.npcs.shopkeeper.talk_ascent=I don't know what you're planning to do with that amulet but I want no part of it. Buy something and move on, we both need to leave this place!
actors.mobs.npcs.shopkeeper.desc=This stout guy looks more appropriate for a trade district in some large city than for a dungeon. His prices explain why he prefers to do business here.\n\nHave you wondered, how he reacts to clay?
actors.mobs.npcs.wandmaker.name=old wandmaker
actors.mobs.npcs.wandmaker.intro_warrior=Oh, hello there! What a pleasant surprise to meet a warrior from the north in such a depressing place! You must have travelled quite far to get here. If you're looking for adventure, I may have a task for you.
actors.mobs.npcs.wandmaker.intro_rogue=Oh Goodness, you startled me! I haven't met a bandit from this place that still has his sanity, so you must be from the surface! If you're up to helping a stranger out, I may have a task for you.
actors.mobs.npcs.wandmaker.intro_mage=Oh, hello %s! I heard there was some ruckus regarding you and the wizards institute? Oh never mind, I never liked those stick-in-the-muds anyway. If you're willing, I may have a task for you.
actors.mobs.npcs.wandmaker.intro_huntress=Oh, hello miss! A friendly face is a pleasant surprise down here isn't it? In fact, I swear I've seen your face before, but I can't put my finger on it... Oh never mind, if you're here for adventure, I may have a task for you.
actors.mobs.npcs.wandmaker.intro_duelist=Oh, hello miss! What a pleasant surprise to meet a hero in such a depressing place! If you're up to helping an old man out, I may have a task for you.
actors.mobs.npcs.wandmaker.intro_ratking=Oh, big greetings, Your Majesty! What a honor to meet your enlightening presence in such depressing place! If you're fine with helping an old man out, I may have a task for you.
actors.mobs.npcs.wandmaker.intro_1=\n\nI came here to find a rare ingredient for a wand, but I've gotten myself lost, and my magical shield is weakening. I'll need to leave soon, but can't bear to go without getting what I came for.
actors.mobs.npcs.wandmaker.intro_dust=I'm looking for some _corpse dust._ It's a special kind of cursed bone meal that usually shows up in places like this. There should be a barricaded room around here somewhere, I'm sure some dust will turn up there. Do be careful though, the curse the dust carries is quite potent, _get back to me as fast as you can_ and I'll cleanse it for you.
actors.mobs.npcs.wandmaker.intro_ember=I'm looking for some _fresh embers_ from a newborn fire elemental. Elementals usually pop up when a summoning ritual isn't controlled, so just find some candles and a ritual site and I'm sure you can get one to pop up. You'll want to _avoid boxing yourself in_ while fighting it though, or you could _keep some sort of freezing item handy._ Newborn Elementals are pretty powerful and chaotic, but they can't stand the cold.
actors.mobs.npcs.wandmaker.intro_berry=The old warden of this prison kept a _rotberry plant,_ and I'm after one of its seeds. The plant has probably gone wild by now though, so getting it to give up a seed might be tricky. Its garden should be somewhere around here. Try to _keep away from its vine lashers_ if you want to stay in one piece. Using fire might be tempting but please don't, you'll kill the plant and destroy its seeds.
actors.mobs.npcs.wandmaker.intro_2=\n\nIf you can get that for me, I'll be happy to pay you with one of my finely crafted wands! I brought two with me, so you can take whichever one you prefer.
actors.mobs.npcs.wandmaker.reminder_dust=Any luck with corpse dust, %s? Look for some barricades.
actors.mobs.npcs.wandmaker.reminder_ember=Any luck with those embers, %s? You'll need to find four candles and the ritual site.
actors.mobs.npcs.wandmaker.reminder_berry=Any luck with a Rotberry seed, %s? Look for a room filled with vegetation.
actors.mobs.npcs.wandmaker.def_verb=blocked
actors.mobs.npcs.wandmaker.desc=This old yet hale gentleman wears a slightly confused expression. He is protected by a magic shield.
actors.mobs.npcs.wandmaker.cheese=Oh god, cheese! You found it for me? Awesome! I will give you my most powerful wand in possession, although it's little unfinished.\n\nYou can try to kill that big slime again with it.
actors.mobs.npcs.hook.name=hook
actors.mobs.npcs.hook.desc=The hook from your cool fishing rod.
actors.mobs.npcs.expgenerator.name=power plant
actors.mobs.npcs.expgenerator.desc=This golden masterpiece gathers hidden sunlight and turns it into experience. You can damage to get the generator back.
actors.mobs.npcs.bbat.name=bbat
actors.mobs.npcs.bbat.desc=This bat is trained to hunt weak targets while the owner survives in battlefield. It has high dexterity, but pretty low offensive stats. 
actors.mobs.npcs.bbat$bbatrecharge.name=Bbat Recharge
actors.mobs.npcs.bbat$bbatrecharge.desc=Bbat needs %s turns to recover from damage and return to fight. You can summon it with your Cloak of Shadows
actors.mobs.acidic.name=acidic scorpio
actors.mobs.acidic.desc=These huge arachnid-like demonic creatures avoid close combat, preferring to fire crippling serrated spikes from long distances. This one appears to be dripping with corrosive ooze.
actors.mobs.albino.name=albino rat
actors.mobs.albino.desc=This is a rare breed of marsupial rat, with pure white fur and jagged teeth.
actors.mobs.armoredstatue.name=armored statue
actors.mobs.armoredstatue.desc=You would think that it's just another one of this dungeon's inanimate statues, but its red glowing eyes give it away.\n\nIt seems to be in great condition because of the armor it's wearing, it might be very hard to kill.
actors.mobs.armoredstatue.desc_arm_wep=While the statue itself is made of stone, the _%1$s_ and _%2$s_ it's wielding look real.
actors.mobs.bandit.name=crazy bandit
actors.mobs.bat.name=vampire bat
actors.mobs.bat.desc=These brisk and tenacious inhabitants of the caves are much more dangerous than they seem. They replenish their health with each successful attack, which allows them to defeat much larger opponents.
actors.mobs.bee.name=golden bee
actors.mobs.bee.desc_honey=Despite their small size, golden bees tend to protect their home fiercely. This one has been placated, and seems to want to follow you.
actors.mobs.bee.desc=Despite their small size, golden bees tend to protect their home fiercely. This one is very mad, better keep your distance.
actors.mobs.brute.name=gnoll brute
actors.mobs.brute.enraged=enraged
actors.mobs.brute.def_verb=blocked
actors.mobs.brute.desc=Brutes are the largest, strongest, and toughest of all gnolls. When mortally wounded, they go berserk, gaining temporary shielding and a large boost to damage.
actors.mobs.brute$bruterage.name=brute rage
actors.mobs.brute$bruterage.desc=This gnoll brute is dying, but wants to take you with it!\n\nThe brute will die when its shielding wears off, either due to time or if it is damaged. In the meantime, it will deal hugely increased damage, so watch out!\n\nShield remaining: %d.
actors.mobs.causticslime.name=caustic slime
actors.mobs.causticslime.desc=This slime seems to have been tainted by the dark magic emanating from below. It has lost its usual green color, and drips with caustic ooze.
actors.mobs.crab.name=sewer crab
actors.mobs.crab.desc=These huge crabs are at the top of the food chain in the sewers. They are extremely fast and their thick carapace can withstand heavy blows.
actors.mobs.crystalguardian.name=crystal guardian
actors.mobs.crystalguardian.def_verb=blocked
actors.mobs.crystalguardian.desc=These large crystalline guardians almost look like statues, if it weren't for their bright glowing eyes. The hardened crystal they're made out of causes them to be sluggish but very tough, so _it's best to leave them to sleep in their crystal nest for as long as possible._\n\nDue to their size, crystal guardians will move much more slowly in enclosed spaces. They're also so durable that they're impossible to kill outright. They can be beaten down and temporarily disabled, but they'll just get back up again after a little while.
actors.mobs.crystalmimic.name=crystal mimic
actors.mobs.crystalmimic.ate=The mimic ate your %s!
actors.mobs.crystalmimic.escaped=The crystal mimic has escaped!
actors.mobs.crystalmimic.desc=Mimics are magical creatures which can take any shape they wish. In dungeons they almost always choose a shape of a treasure chest, in order to lure in unsuspecting adventurers.\n\nCrystal mimics are trickier than their regular cousins, and prefer to avoid conflict while stealing loot. They will attempt to sprint away once discovered, and have the ability to reposition enemies when they attack.
actors.mobs.crystalspire.name=crystal spire
actors.mobs.crystalspire.warning=The crystal vibrates as you strike it. Keeping this up is bound to draw attention to you...
actors.mobs.crystalspire.alert=The vibration grows and rumbles through the whole cave!
actors.mobs.crystalspire.desc=This gigantic spire of ultra hard crystal is probably the source of all the strange crystalline creatures in this cave. Your regular weapons are ineffective against it, so you'll need to use your pickaxe if you want to destroy it.\n\n_Make sure you're prepared before you start breaking it._ Such a big crystal is likely to take a while to mine through, and you probably won't be able to do it undisturbed. The spire itself may even have some means of defending itself as well. _Perhaps the spire's own attacks could be used against its minions._
actors.mobs.crystalwisp.name=crystal wisp
actors.mobs.crystalwisp.beam_kill=The beam of light killed you...
actors.mobs.crystalwisp.desc=A small angry floating chunk of hardened crystal that's producing a bright glow. While not especially strong, crystal wisps will shoot a damaging beam of light at you if they have a clear shot.\n\nWisps are small enough to easily move through the various crystal outcroppings, but they aren't able to shoot through them.
actors.mobs.demonspawner.name=demon spawner
actors.mobs.demonspawner.on_death=The demonic energy here seems to lessen as the spawner dies.
actors.mobs.demonspawner.desc=This twisting amalgam of dwarven flesh is responsible for creating ripper demons from the dwarves that have died in this region. Clearly the demons see no issue with using every resource they can against their enemies.\n\nWhile visually terrifying, demon spawners have no means of moving or directly defending themselves. Their considerable mass makes them hard to kill quickly however, and they will spawn ripper demons more quickly when they are under threat.\n\n_Demon spawners seem to be connected to some central source of demonic power. Killing them may weaken it._
actors.mobs.dm100.name=DM-100
actors.mobs.dm100.zap_kill=The lightning bolt killed you...
actors.mobs.dm100.desc=The DM-100 is an early model of dwarven 'defense machine' which was designed to protect dwarven miners in the caves below this prison. Their electrical shocks proved too weak however, and so they were gifted to the human city above. They went unused for years and eventually found their way to the prison, where the warden initially deemed them too cruel to use. However, as the prisoners became more unruly they became a necessity.
actors.mobs.dm200.name=DM-200
actors.mobs.dm200.vent=The DM-200 fires a jet of toxic exhaust!
actors.mobs.dm200.desc=The DM-200 is the second generation of dwarven 'defense machine', which was designed to protect dwarven miners in the caves and city below. They are much larger and bulkier than their predecessors, and attack with devastating hydraulic fists.\n\nTheir increased size is also their primary weakness, as they are unable to fit into the narrow tunnels and doorways of the dungeon. The dwarves were able to compensate for the DM-200's lack of mobility by allowing them to vent their toxic exhaust fumes at distant enemies, or enemies they cannot reach.
actors.mobs.dm201.name=DM-201
actors.mobs.dm201.vent=The DM-201 lobs a corrosive grenade!
actors.mobs.dm201.desc=The dwarves briefly experimented with more heavily emphasizing the DM-200's lack of mobility and created some DM models that are entirely stationary. The DM-201 is a retrofitted DM-200 which acts as a sentry turret that has no movement ability. In exchange for the lack of mobility, DM-201s have significantly more durability and attacking power.\n\nAs DM-201s have no engine to vent exhaust from, the dwarves instead outfitted them with corrosive gas grenades! DM-201s are careful with these grenades however, and will only lob them when attacked from a distance.
actors.mobs.dm300.name=DM-300
actors.mobs.dm300.notice=UNAUTHORIZED PERSONNEL DETECTED!
actors.mobs.dm300.shield=DM-300 pulls power from the exposed wires and shields itself!
actors.mobs.dm300.charging=SUSTAINING DAMAGE! ACTIVATING POWER PYLON!
actors.mobs.dm300.charging_hint=DM-300 is invulnerable while it is being energized by a pylon!
actors.mobs.dm300.supercharged=DESTROY! DESTROY! DESTROY!
actors.mobs.dm300.charge_lost=PYLON DESTROYED! REVERTING TO LOCAL POWER!
actors.mobs.dm300.pylons_destroyed=ALERT! INSTABILITY DETECTED IN POWER GRID!
actors.mobs.dm300.rankings_desc=Crushed by the DM-300
actors.mobs.dm300.def_verb=blocked
actors.mobs.dm300.defeated=CRITICAL DAMAGE! ATTEMPTING SHUTDO-
actors.mobs.dm300.desc=The DM-300 is the largest and most powerful 'defense machine' that the dwarves ever built. Such an awesome machine is difficult to manufacture, so the dwarves only ever made a few to guard the entrances to their underground metropolis.\n\nIt is equipped with vents to jet its toxic exhaust fumes and a high power drill that it can use both to attack and disrupt the earth. DM-300 can also connect to an energy grid, further enhancing its power.
actors.mobs.dm300.desc_supercharged=DM-300 is currently charged full of electrical energy. In this form DM-300 cannot be damaged and moves at double speed! Additionally, its drill now spins fast enough for it to _tunnel through solid rock,_ though it moves much more slowly when doing this.\n\nAttacking DM-300 directly is pointless while it is supercharged, but _something in the area must be providing it with this energy,_ destroying that may weaken it.
actors.mobs.blackmimic.name=darkened mimic
actors.mobs.blackmimic.notice=Hey, you did go there.
actors.mobs.blackmimic.shield=I have powerfield for you!
actors.mobs.blackmimic.vent=How about some corrosive experience?
actors.mobs.blackmimic.rocks=Crush him, rocks!
actors.mobs.blackmimic.bomb=Explode!
actors.mobs.blackmimic.summon=TASTE THE MONSTERS
actors.mobs.blackmimic.charging=YOU FOOL
actors.mobs.blackmimic.charging_hint=Darkened Mimic is invulnerable while power pylon is there!
actors.mobs.blackmimic.supercharged=STOP RIGHT THERE YOU IDIOT
actors.mobs.blackmimic.charge_lost=WHHHHAAAAAT
actors.mobs.blackmimic.pylons_destroyed=HOW
actors.mobs.blackmimic.rankings_desc=Consumed by his own greed
actors.mobs.blackmimic.def_verb=blocked
actors.mobs.blackmimic.defeated=NOOOOOOOOOOOOOOOOOOOOOO-
actors.mobs.blackmimic.desc=The embodiment of your endless avaritia. It hopes to consume you alongside with Amulet, while using various gas based attacks and summoning monsters from dungeon.
actors.mobs.blackmimic.desc_clone=This is a clone of Darkened Mimic. It doesn't announce its attacks, is immune to any damage and has reduced chance to summon another clone.
actors.mobs.blackmimic.desc_supercharged=Darkened Mimic is currently charged full of frustration, In this form the mimic cannot be damaged and moves at triple speed! Additionally, its jaws now are strong enough for it to _tunnel through solid rock,_ though it moves much more slowly when doing this.\n\nAttacking Darkened Mimic directly is pointless while it is supercharged, but _something in the area must be providing it with this energy,_ destroying that may weaken it.
actors.mobs.blackmimic$fallingrocks.desc=Loose rocks are tumbling down from the ceiling here, it looks like its about to collapse!
actors.mobs.dwarfking.name=King of Dwarves
actors.mobs.dwarfking.notice=How dare you! You have no idea what you're interfering with!
actors.mobs.dwarfking.lifelink_1=I have need of your essence, slave!
actors.mobs.dwarfking.lifelink_2=Bleed for me, slave!
actors.mobs.dwarfking.teleport_1=Deal with them, slave!
actors.mobs.dwarfking.teleport_2=Keep them busy, slave!
actors.mobs.dwarfking.wave_1=Enough! Arise my slaves!
actors.mobs.dwarfking.wave_2=More! Bleed for your king!
actors.mobs.dwarfking.wave_3=Useless! KILL THEM NOW!
actors.mobs.dwarfking.enraged=You cannot kill me %s. I. AM. IMMORTAL!
actors.mobs.dwarfking.losing=No! You can't do this... you have no idea what lies below...
actors.mobs.dwarfking.defeated=You've... Doomed us all...
actors.mobs.dwarfking.rankings_desc=Fell Before the King of Dwarves
actors.mobs.dwarfking.desc=Many years ago one of the highest wizards in the dwarven court uncovered secrets which gave him tremendous power over life and death. He soon put this power to use, subjugating and corrupting his peers, his king, and eventually every dwarven citizen. Now he is king, ruler over a legion of undead subjects.\n\nThe King of Dwarves is an aggressive foe, who will attempt to surround and overwhelm his enemies with his horde of undead minions.
actors.mobs.dwarfking$dkghoul.rankings_desc=Fell Before the King of Dwarves
actors.mobs.dwarfking$dkmonk.rankings_desc=Fell Before the King of Dwarves
actors.mobs.dwarfking$dkwarlock.rankings_desc=Fell Before the King of Dwarves
actors.mobs.dwarfking$dkgolem.rankings_desc=Fell Before the King of Dwarves
actors.mobs.ebonymimic.name=ebony mimic
actors.mobs.ebonymimic.reveal=There was a mimic there!
actors.mobs.ebonymimic.hidden_name=suspicious outline
actors.mobs.ebonymimic.hidden_desc=There seems to be something here, but it's almost totally transparent.
actors.mobs.ebonymimic.desc=Mimics are magical creatures which can take any shape they wish. In dungeons they almost always choose a shape of a treasure chest, in order to lure in unsuspecting adventurers.\n\nEbony mimics are extremely tough mimics with the ability to make themselves almost invisible. They lurk on things that adventurers are likely to interact with, but do contain loot of their own as well.\n\nThere can't be anything even stronger, _right?_
actors.mobs.elemental$fireelemental.name=fire elemental
actors.mobs.elemental$fireelemental.desc=Elementals are chaotic creatures that are often created when powerful occult magic isn't properly controlled. Elementals have minimal intelligence, and are usually associated with a particular type of magic.\n\nFire elementals are a common type of elemental which deals damage with fiery magic. They will set their target ablaze with melee attacks, and can occasionally shoot bolts of fire as well.
actors.mobs.elemental$newbornfireelemental.name=newborn fire elemental
actors.mobs.elemental$newbornfireelemental.charging=The elemental is charging up!
actors.mobs.elemental$newbornfireelemental.desc=Elementals are chaotic creatures that are often created when powerful occult magic isn't properly controlled. Elementals have minimal intelligence, and are usually associated with a particular type of magic.\n\nThis fire elemental is freshly summoned, but still quite dangerous!
actors.mobs.elemental$newbornfireelemental.desc_boss=Because of the chaotic nature of its summoning, this elemental can only spread fire in inaccurate blasts after charging for a turn.
actors.mobs.elemental$newbornfireelemental.desc_ally=Because this elemental was summoned by a spell, it has a little more control over its flame. It's incapable of making ranged attacks, but will ignite enemies it attacks in melee.
actors.mobs.elemental$frostelemental.name=frost elemental
actors.mobs.elemental$frostelemental.desc=Elementals are chaotic creatures that are often created when powerful occult magic isn't properly controlled. Elementals have minimal intelligence, and are usually associated with a particular type of magic.\n\nFrost elementals are a common type of elemental which weakens enemies with chilling magic. They will chill their target with melee and occasional ranged attacks. Their magic is much more effective in water.
actors.mobs.elemental$shockelemental.name=shock elemental
actors.mobs.elemental$shockelemental.desc=Elementals are chaotic creatures that are often created when powerful occult magic isn't properly controlled. Elementals have minimal intelligence, and are usually associated with a particular type of magic.\n\nShock elementals are a less common type of elemental which disrupts its enemies with electricity and flashes of light. In melee they will arc electricity to nearby enemies, and deal bonus damage to their primary target if they are in water. They will also occasionally focus a ranged blast of light at their target, temporarily blinding them.
actors.mobs.elemental$chaoselemental.name=chaos elemental
actors.mobs.elemental$chaoselemental.desc=Elementals are chaotic creatures that are often created when powerful occult magic isn't properly controlled. Elementals have minimal intelligence, and are usually associated with a particular type of magic.\n\nChaos elementals are rare and dangerous elementals which haven't stabilized to a particular element. They will unleash wild unpredictable magic when they attack.
actors.mobs.eye.name=evil eye
actors.mobs.eye.deathgaze_kill=The deathgaze killed you...
actors.mobs.eye.desc=Evil Eyes are floating balls of pent up demonic energy. While they are capable of melee combat, their true strength comes from their magic.\n\nAfter building energy for a short time an Evil Eye will unleash a devastating beam of energy called the _deathgaze._ Anything within the Evil Eye's sights will take tremendous damage, wise adventurers will run for cover.
actors.mobs.fetidrat.name=fetid rat
actors.mobs.fetidrat.desc=Something is clearly wrong with this rat. Its greasy black fur and rotting skin are very different from the healthy rats you've seen previously. Its pale green eyes make it seem especially menacing.\n\nThe rat carries a cloud of horrible stench with it, it's overpoweringly strong up close.\n\nDark ooze dribbles from the rat's mouth, it eats through the floor but seems to dissolve in water.
actors.mobs.fungalcore.name=fungal core
actors.mobs.fungalcore.desc=This gigantic mushroom must be the source of all the fungal activity in this cave.
actors.mobs.fungalsentry.name=fungal sentry
actors.mobs.fungalsentry.desc=This especially tall mushroom acts as a point of defense for the larger fungal network living in this cave.\n\nIt is immobile, but will shoot precise blasts of poison at anything that gets within its line of sight. While the impact of these blasts is fairly weak, _they can stack up deadly amounts of poison very quickly._ While it can be killed, it's probably best to avoid it.
actors.mobs.fungalspinner.name=fungal spinner
actors.mobs.fungalspinner.desc=This cave spinner appears to be being controlled by a parasitic fungus. The fungus has also changed its abilities, replacing its web and venom sacks with fungal growth.\n\nThe fungal spinner will spit plant life at you instead of webs, spreading fungal vegetation and potentially rooting you. While it can't poison, the fungal spinner will gain substantial damage resistance if it is adjacent to any mushrooms.
actors.mobs.ghoul.name=dwarven ghoul
actors.mobs.ghoul.desc=As dwarven society slowly began to collapse, and the current king of the dwarves seized absolute power, those who were weak or who resisted him were not treated well. As the king grew more adept at wielding dark magic, he bent these dwarves to his will, and now they make up the footsoldiers of his army.\n\nGhouls are not especially strong on their own, but always travel in groups and are much harder to kill in large numbers. _When a ghoul is defeated, it will rise again after a few turns as long as another ghoul is nearby._
actors.mobs.gnoll.name=gnoll scout
actors.mobs.gnoll.desc=Gnolls are hyena-like humanoids. They dwell in sewers and dungeons, venturing up to raid the surface from time to time. Gnoll scouts are regular members of their pack, they are not as strong as brutes and not as intelligent as shamans.
actors.mobs.gnollgeomancer.name=gnoll geomancer
actors.mobs.gnollgeomancer.warning=The geomancer begins to stir. Make sure you're ready before you continue!
actors.mobs.gnollgeomancer.alert=The geomancer awakens! The entire cave seems to shift as it leaps away while laughing madly!
actors.mobs.gnollgeomancer.rock_kill=The flying boulder killed you...
actors.mobs.gnollgeomancer.rockfall_kill=The falling rocks killed you...
actors.mobs.gnollgeomancer.desc=This impressively tall senior gnoll must be the source of the various earth-moving magic around here, and the organizer of all the gnoll activity. Unlike the gnoll sappers in the area, the geomancer is quite adept with its magic, and cannot be damaged by thrown or falling rocks. It doesn't have any way to fight in melee combat though.
actors.mobs.gnollgeomancer.desc_armor=The geomancer is currently encased in a layer of rock armor. _You'll need to get up close and break it away with your pickaxe before you can damage the geomancer._
actors.mobs.gnollgeomancer.desc_armor_sapper=_A nearby gnoll sapper is holding a device that is empowering the geomancer's rock armor. You won't be able to damage it at all right now!_
actors.mobs.gnollgeomancer.desc_sleeping=This impressively tall gnoll shaman is surrounded by a layer of rock, and looks almost like a statue. Looking closely you can see the rock magically move in time with the senior gnoll's breathing. It can't be harmed while encased in rock like this, and it appears to be enjoying a literal dirt nap.\n\nYou can probably break through the layers of rock with your pickaxe, but _be sure you're ready for a fight when you do so._ The geomancer must be the source of the various earth-moving magic around here, and the organizer of all the gnoll activity. _Defeating the gnolls scattered around here before fighting it might be a good idea._
actors.mobs.gnollguard.name=gnoll guard
actors.mobs.gnollguard.spear_warn=The gnoll lands a vicious blow with the tip of its spear!
actors.mobs.gnollguard.desc=A large and tough looking gnoll wielding a spear and a shield, but no helmet. These guards are likely brutes in training, roped into helping protect the mine from encroaching wildlife.\n\nThe gnoll guard is strong enough to wield the spear in one hand, but can't use it very well. _It will need fairly open space to attack at a distance, and will do notably less damage to you if you get up close._
actors.mobs.gnollguard.desc_armor=_A nearby gnoll sapper is holding a device that is granting this guard earthen armor, heavily reducing the damage it takes._
actors.mobs.gnollsapper.name=gnoll sapper
actors.mobs.gnollsapper.desc=A small and weak but intelligent gnoll with pale fur and a satchel full of various gadgets. They are likely here to assist with prospecting and mining dark gold, and have a nearby guard for protection. They are capable of fighting, but their attacks are pitifully weak, no stronger than a gnoll scout.\n\nInstead of fighting directly, sappers prefer to use the various gadgets they have to make the rocky environment attack for them. They don't know earth-moving magic themselves though, and so are pretty likely to use their gadgets recklessly. _There should be lots of ways to use their attacks against them, or their guard._
actors.mobs.gnolltrickster.name=gnoll trickster
actors.mobs.gnolltrickster.desc=A strange looking creature, even by gnoll standards. It hunches forward with a wicked grin, almost cradling the satchel hanging over its shoulder. Its eyes are wide with a strange mix of fear and excitement.\n\nThere is a large collection of poorly made darts in its satchel, they all seem to be tipped with various harmful substances.
actors.mobs.goldenmimic.name=golden mimic
actors.mobs.goldenmimic.desc=Mimics are magical creatures which can take any shape they wish. In dungeons they almost always choose a shape of a treasure chest, in order to lure in unsuspecting adventurers.\n\nGolden mimics are tougher mimics which try to attract the strongest adventurers. They have better loot, but are also much stronger than regular mimics.
actors.mobs.golem.name=golem
actors.mobs.golem.def_verb=blocked
actors.mobs.golem.desc=Golems are an attempt to correct the previous flaws in dwarven machinery via the dwarves newfound use of magic. They are much more compact and efficient compared to the DM-300 while still being very deadly.\n\nWhile golems are still too large to fit into passageways, the dwarves have given them new magical abilities to compensate. Golems can teleport themselves between rooms, and teleport enemies to them when they are out of reach.
actors.mobs.goo.name=Goo
actors.mobs.goo.notice=GLURP-GLURP!
actors.mobs.goo.defeated=glurp... glurp...
actors.mobs.goo.pumpup=Goo is pumping itself up!
actors.mobs.goo.enraged=enraged
actors.mobs.goo.gluuurp=GLUUUURP!
actors.mobs.goo.rankings_desc=Absorbed by the Goo
actors.mobs.goo.desc=Little is known about The Goo. It's quite possible that it is not even a creature, but rather a conglomerate of vile substances from the sewers that somehow gained basic intelligence. Regardless, dark magic is certainly what has allowed Goo to exist.\n\nIts gelatinous nature has let it absorb lots of dark energy, you feel a chill just from being near. If Goo is able to attack with this energy you won't live for long.
actors.mobs.goldengoo.name=Golden Goo
actors.mobs.goldengoo.notice=SHINE-GLURP!
actors.mobs.goldengoo.defeated=glurp... shine...
actors.mobs.goldengoo.pumpup=Golden Goo is charging golden radiance!
actors.mobs.goldengoo.enraged=radiant rage
actors.mobs.goldengoo.gluuurp=GOLDEN GLUUUURP!
actors.mobs.goldengoo.rankings_desc=Absorbed by the Golden Goo
actors.mobs.goldengoo.desc=A legendary radiant variant of The Goo. Infused with pure golden essence, defeating it yields unimaginable class wealth!
actors.mobs.goldengoo.reward=The Golden Goo dropped a radiant +4 %s!
actors.mobs.greatcrab.name=great crab
actors.mobs.greatcrab.noticed=The crab blocks with its massive claw.
actors.mobs.greatcrab.def_verb=blocked
actors.mobs.greatcrab.desc=This crab is gigantic, even compared to other sewer crabs. Its blue shell is covered in cracks and barnacles, showing great age. It lumbers around slowly, barely keeping balance with its massive claw.\n\nWhile the crab only has one claw, its size easily compensates. The crab holds the claw in front of any threat, shielding itself behind an impenetrable wall of carapace. However, the crab cannot block attacks it doesn't see coming, or attacks from multiple enemies at once.
actors.mobs.guard.name=prison guard
actors.mobs.guard.scorpion=Get over here!
actors.mobs.guard.def_verb=blocked
actors.mobs.guard.desc=Once keepers of the prison, these guards have long since become no different than the inmates. They shamble like zombies, brainlessly roaming through the halls in search of anything out of place, like you!\n\nThey carry chains around their hip, possibly used to pull in enemies to close range.
actors.mobs.mimic.name=mimic
actors.mobs.mimic.reveal=That chest is a mimic!
actors.mobs.mimic.hidden_hint=Something about this chest feels off... Walking up and trying to open it might be a bad idea.
actors.mobs.mimic.desc=Mimics are magical creatures which can take any shape they wish. In dungeons they almost always choose a shape of a treasure chest, in order to lure in unsuspecting adventurers.\n\nMimics have a nasty bite, but often hold more treasure than a regular chest.
actors.mobs.necromancer.name=necromancer
actors.mobs.necromancer.desc=These apprentice dark mages have flocked to the prison, as it is the perfect place to practise their evil craft.\n\nNecromancers will summon and empower skeletons to fight for them. Killing the necromancer will also kill the skeleton it summons.
actors.mobs.necromancer$necroskeleton.name=necromancer's skeleton
actors.mobs.necromancer$necroskeleton.desc=This skeleton has been summoned by a necromancer. It behaves just like a regular skeleton, and will die when the necromancer which summoned it is slain.
actors.mobs.mob.died=You hear something die in the distance.
actors.mobs.mob.rage=#$%^
actors.mobs.mob.rankings_desc=Slain by: %s
actors.mobs.monk.name=dwarf monk
actors.mobs.monk.def_verb=blocked
actors.mobs.monk.parried=parried
actors.mobs.monk.desc=These monks are fanatics, who have devoted themselves to protecting their king through physical might. So great is their devotion that they have totally surrendered their minds to their king, and now roam the dwarvern city like mindless zombies.\n\nMonks rely solely on the art of hand-to-hand combat, and are able to use their unarmed fists both for offense and defense. When they become focused, monks will parry the next physical attack used against them, even if it was otherwise guaranteed to hit. Monks build focus more quickly while on the move, and more slowly when in direct combat.
actors.mobs.monk$focus.name=focused
actors.mobs.monk$focus.desc=This monk is perfectly honed in on their target, and seem to be anticipating their moves before they make them.\n\nWhile focused, the next physical attack made against this character is guaranteed to miss, no matter what circumstances there are. Parrying this attack will spend the monk's focus, and they will need to build it up again to parry another attack. Monks build focus more quickly while they are moving.
actors.mobs.phantompiranha.name=phantom piranha
actors.mobs.phantompiranha.teleport_away=The phantom piranha teleports away...
actors.mobs.phantompiranha.desc=Phantom piranhas are a rare breed of piranha with magical abilities and eerie translucent bodies. They are capable of teleporting as they are being attacked, either to escape or to quickly get close to their enemy!\n\nWhile they are annoying to fight, their meat is prized for its magical properties.
actors.mobs.piranha.name=giant piranha
actors.mobs.piranha.desc=These carnivorous fish are not natural inhabitants of underground pools. They were bred specifically to protect flooded treasure vaults.
actors.mobs.pylon.name=power pylon
actors.mobs.pylon.desc_inactive=A power pylon, meant to help regulate the electricity which powers the machinery in this area.\n\nThe pylon is currently inactive and immune to damage.
actors.mobs.pylon.desc_active=A power pylon, meant to help regulate the electricity which powers the machinery in this area. The pylon is currently surging with electrical energy, this must be what's supercharging DM-300!\n\nIn this state pylons are vulnerable, but will arc electricity to nearby cells in a clockwise pattern. Due to their heavy metal construction, pylons are resistant to large amounts of damage.
actors.mobs.rat.name=marsupial rat
actors.mobs.rat.desc=Marsupial rats are aggressive but rather weak denizens of the sewers. They have a nasty bite, but are only life threatening in large numbers.
actors.mobs.ripperdemon.name=ripper demon
actors.mobs.ripperdemon.leap=The ripper demon prepares to leap!
actors.mobs.ripperdemon.desc=These horrific creatures are the result of the many dwarven corpses in this region being put to use by demonic forces. Rippers are emaciated ghoulish creatures that resemble dwarves, but with broken bodies and long sharp claws made of bone.\n\nRipper demons are not particularly durable, but they are agile and dangerous. They are capable of leaping great distances to quickly reach targets before goring them with their claws.
actors.mobs.rotheart.name=rot heart
actors.mobs.rotheart.desc=A Rotberry's fruit is very unique. Instead of rotting away and providing nutrients, the fruit grows, hardens, and encompasses the seed. It provides protection for the internal organs which grow inside the fruit. This giant orb is referred to as the heart of an adult rotberry plant.
actors.mobs.rotlasher.name=rot lasher
actors.mobs.rotlasher.desc=The rot lasher is a part of a mature rotberry plant's root structure, and also their primary means of defense. Lashers are blind and stuck into the ground, but will violently assault any nearby threat after taking a moment to detect them. When there is no nearby enemies, they stand motionless, attempting to blend in with surrounding vegetation.
actors.mobs.scorpio.name=scorpio
actors.mobs.scorpio.desc=These huge arachnid-like demonic creatures avoid close combat, preferring to fire crippling serrated spikes from long distances.
actors.mobs.senior.name=senior monk
actors.mobs.senior.desc=These monks are fanatics, who have devoted themselves to protecting their king through physical might. So great is their devotion that they have totally surrendered their minds to their king, and now roam the dwarvern city like mindless zombies.\n\nThis monk has mastered the art of hand-to-hand combat, and is able to gain focus while moving much more quickly than regular monks. When they become focused, monks will parry the next physical attack used against them, even if it was otherwise guaranteed to hit. Monks build focus more quickly while on the move, and more slowly when in direct combat.
actors.mobs.shaman.name=gnoll shaman
actors.mobs.shaman.bolt_kill=The magic bolt killed you...
actors.mobs.shaman.desc=Gnoll shamans are intelligent gnolls who use battle spells to compensate for their lack of might. They have a very respected position in gnoll society, despite their weaker strength.
actors.mobs.shaman$redshaman.spell_desc=This shaman is wearing a red mask, and will use magic that temporarily _weakens your attacking power._
actors.mobs.shaman$blueshaman.spell_desc=This shaman is wearing a blue mask, and will use magic that temporarily _increases the damage you take._
actors.mobs.shaman$purpleshaman.spell_desc=This shaman is wearing a purple mask, and will use magic that temporarily _reduces your accuracy and evasion._
actors.mobs.armoredbrute.name=armored brute
actors.mobs.armoredbrute.desc=The most senior gnoll brutes often wear powerful armor to show their status. The armor makes these brutes much more resilient to physical damage, and their greater discipline means they can rage for much longer before succumbing to their wounds.
actors.mobs.skeleton.name=skeleton
actors.mobs.skeleton.explo_kill=You were killed by the explosion of bones...
actors.mobs.skeleton.def_verb=blocked
actors.mobs.skeleton.desc=Skeletons are composed of the bones of unlucky adventurers and inhabitants of the prison, animated by emanations of evil magic from the depths below. After they have been damaged enough, skeletons will disintegrate in an explosion of bones. The shrapnel from this explosion is harmful to anything nearby, but armor is very effective at mitigating it.
actors.mobs.slime.name=slime
actors.mobs.slime.def_verb=blocked
actors.mobs.slime.desc=Slimes are strange, slightly magical creatures with a rubbery outer body and a liquid core. The city sewers provide them with an ample supply of water and nutrients.\n\nBecause of their elastic outer membrane, it is difficult to deal more than _6 damage_ to slimes from any one attack.
actors.mobs.snake.name=sewer snake
actors.mobs.snake.hint=Try using the examine button on a snake to learn how to counter them.
actors.mobs.snake.desc=These oversized serpents are capable of quickly slithering around blows, making them quite hard to hit. Magical attacks or surprise attacks are capable of catching them off-guard however.\n\nYou can perform a surprise attack by attacking while out of the snake's vision. One way is to let a snake chase you through a doorway and then _strike just after it moves into the door._
actors.mobs.spectralnecromancer.name=spectral necromancer
actors.mobs.spectralnecromancer.desc=While Skeletons are a necromancer’s bread and butter, some prefer to look into other less corporeal minions. Spectral necromancers have chosen wraiths as their minion of choice!\n\nIndividual wraiths aren't as strong as skeletons, but these necromancers aren't afraid to summon a bunch of them!
actors.mobs.spinner.name=cave spinner
actors.mobs.spinner.desc=These greenish furry cave spiders try to avoid direct combat. Instead they prefer to wait in the distance while their victim struggles in their excreted cobweb, slowly dying from their venomous bite. They are capable of shooting their webs great distances, and will try to block whatever path their prey is taking.
actors.mobs.statue.name=animated statue
actors.mobs.statue.def_verb=blocked
actors.mobs.statue.desc=You would think that it's just another one of this dungeon's inanimate statues, but its red glowing eyes give it away.
actors.mobs.statue.desc_weapon=While the statue itself is made of stone, the _%s_ it's wielding looks real.
actors.mobs.succubus.name=succubus
actors.mobs.succubus.desc=Succubi are shapeshifting demons that manipulate the minds of their prey. This one has taken the form of a pale gothic humanoid, perhaps to attract dwarven warlocks?\n\nSuccubi may temporarily charm their enemy when they attack, making their enemy unable to directly attack them. When succubi attack a charmed enemy, they will steal some of their life essence.
actors.mobs.swarm.name=swarm of flies
actors.mobs.swarm.desc=The deadly swarm of flies buzzes angrily. Every non-magical attack will split it into two smaller but equally dangerous swarms.
actors.mobs.tengu.name=Tengu
actors.mobs.tengu.notice_gotcha=Gotcha, %s!
actors.mobs.tengu.interesting=Let's make this interesting...
actors.mobs.tengu.notice_have=I have you now, %s!
actors.mobs.tengu.defeated=Free at last...
actors.mobs.tengu.rankings_desc=Assassinated by the Tengu
actors.mobs.tengu.desc=A famous and enigmatic assassin, named for the mask grafted to his face.\n\nTengu is held down with large clasps on his wrists and knees, though he seems to have gotten rid of his chains long ago.\n\nHe will try to use traps, deceptive magic, and precise attacks to eliminate the only thing stopping his escape: you.
actors.mobs.tengu$bombability$bombblob.desc=A cloud of superheated smoke is billowing here. Watch out, it's going to explode!
actors.mobs.tengu$bombability$bombitem.name=Smoke Bomb
actors.mobs.tengu$bombability$bombitem.cant_pickup=It's stuck to the ground, you can't move it!
actors.mobs.tengu$bombability$bombitem.desc=Tengu has thrown a strange looking smoke bomb here, which is billowing a thick hot smoke. It's making a loud ticking noise, as if its counting down to an explosion!\n\nThe bomb has anchored itself to the ground, so you can't pick it up.
actors.mobs.tengu$fireability$fireblob.desc=Tengu has thrown a fine powder that seems to be catching into steam here, it's about to ignite!
actors.mobs.tengu$shockerability$shockerblob.desc=Electrical energy is building here, anything standing on this tile will be shocked next turn!
actors.mobs.tengu$shockerability$shockeritem.name=Shocker
actors.mobs.tengu$shockerability$shockeritem.cant_pickup=It's putting out too much electricity, you can't grab it!
actors.mobs.tengu$shockerability$shockeritem.desc=Tengu has thrown a curious machine here, which seems to be made of DM-100 parts. The machine is constantly arcing electricity around it, but it seems to be going in a predictable pattern.\n\nWith all the electricity arcing around it, there's no way you can pick this up.
actors.mobs.thief.name=crazy thief
actors.mobs.thief.stole=The thief stole %s from you!
actors.mobs.thief.carries=\n\nThe thief is carrying a _%s._ Stolen obviously.
actors.mobs.thief.escapes=The thief gets away with your %s!
actors.mobs.thief.desc=Though these inmates roam free of their cells, this place is still their prison. Over time, this place has taken their minds as well as their freedom. Long ago, these crazy thieves and bandits have forgotten who they are and why they steal.\n\nThese enemies are more likely to steal and run than they are to fight. Make sure to keep them in sight, or you might never see your stolen item again.
actors.mobs.oofthief.name=OOF thief
actors.mobs.oofthief.stole=The thief stole %s from you! You can recover it from resetting shop depths and buying %s from there!
actors.mobs.oofthief.escapes=The thief teleports away!
actors.mobs.oofthief.desc=Genetically engineered by tormented sparks of robots and funded by impossibly modified foxes, this variant of thief has been augmented to prevail above all its prison brothers.\n\nIt is roughly 2.5x times stronger than normal thieves in both resistance and accuracy, attacks 3 times in a row and sells all stolen loot to incredibly corrupted shop companies. It also has teleportation device to hide from its victims once enough property is stolen.\n\nOne of OOF thief's only weaknesses is its movement speed: it moves 3x faster than a normal human, but has _tendency to slip on a moss, or a rock, or a twig_ and make no progress in moving right to its target.\n\nOn the last breath, OOF thief will enter desperation mode, being immune to any damage for short time and moving significantly faster.
actors.mobs.tormentedspirit.name=tormented spirit
actors.mobs.tormentedspirit.desc=Tormented spirits are otherwise good-natured spirits that has been afflicted by a curse. So long as they are cursed they will attack just like a wraith, and are more powerful as well!\n\nIt may be possible to cleanse the curse by using the right item while next to the spirit. If the curse is lifted the spirit will surely be grateful...
actors.mobs.tormentedspirit.thank_you=Thank you...
actors.mobs.warlock.name=dwarf warlock
actors.mobs.warlock.bolt_kill=The shadow bolt killed you...
actors.mobs.warlock.desc=As the dwarves' interests shifted from engineering to arcane arts, warlocks came to power in the city. They started with elemental magic, but soon switched to demonology and necromancy. The strongest of these warlocks seized the throne of the dwarven city, and his cohorts were allowed to continue practising their dark magic, so long as they surrendered their free will to him.\n\nThese warlocks possess powerful disruptive magic, and are able to temporarily hinder the upgrade magic applied to your equipment. The more upgraded an item is, the more strongly it will be affected.
actors.mobs.wraith.name=wraith
actors.mobs.wraith.desc=A wraith is a vengeful spirit of a sinner, whose grave or tomb was disturbed. Being an ethereal entity, it is very hard to hit with a regular weapon.
actors.mobs.yogdzewa.name=Yog-Dzewa
actors.mobs.yogdzewa.notice=I. SEE. YOU.
actors.mobs.yogdzewa.darkness=The darkness pulls in closer...
actors.mobs.yogdzewa.hope=YOUR. HOPE. IS. AN. ILLUSION!
actors.mobs.yogdzewa.defeated=...
actors.mobs.yogdzewa.rankings_desc=Devoured by Yog-Dzewa
actors.mobs.yogdzewa.desc=Yog-Dzewa is an Old God; a great monstrosity which reaches into mortal worlds and devours them to fuel its endless growth. The dwarves must have attracted the attention of this cosmic horror while toying with dark magics, and have been trying to keep it contained ever since.\n\nYog-Dzewa originates from a dimension of raw magical chaos, and cannot bring its true form into this world. Instead it has created avatars and summoned demonic minions to do its bidding here.\n\nThis giant eye is the focal point of Yog-Dzewa's power in this world. While the eye itself is immobile, it is capable of shooting powerful beams of demonic magic and summoning a variety of minions to aid it.\n\nCan drop clay, if killed by Minecraft reference.
actors.mobs.yogdzewa.desc_spawners=You can feel waves of demonic energy radiating to the eye from the floors above. Something you left alive up there must be funneling power back into Yog-Dzewa. _Yog will use this energy to summon more powerful minions!_
actors.mobs.yogdzewa$larva.name=god's larva
actors.mobs.yogdzewa$larva.rankings_desc=Devoured by Yog-Dzewa
actors.mobs.yogdzewa$larva.desc=These tiny spawn of Yog-Dzewa are simple minions that are easy to produce. While individually weak, they are summoned quickly and can become overwhelming in large numbers.
actors.mobs.yogdzewa$yogripper.rankings_desc=Devoured by Yog-Dzewa
actors.mobs.yogdzewa$yogeye.rankings_desc=Devoured by Yog-Dzewa
actors.mobs.yogdzewa$yogscorpio.rankings_desc=Devoured by Yog-Dzewa
actors.mobs.yogfist.invuln_warn=The fist is invulnerable while near to the eye!
actors.mobs.yogfist.rankings_desc=Devoured by Yog-Dzewa
actors.mobs.yogfist.desc=This fist is an aspect of Yog-Dzewa's power. Fists are linked to the power of Yog-Dzewa, and will be protected from all damage when they are close to the eye.
actors.mobs.yogfist$burningfist.name=burning fist
actors.mobs.yogfist$burningfist.desc=This fist is formed out of chaotic fiery magic. As it moves it will constantly set terrain around it ablaze. It is also capable of shooting blasts of fiery power, which spread flames where they impact.\n\nThe fist's ability to spread flames is suppressed when near water, but its heat is so great that any water around it will evaporate after a short while!
actors.mobs.yogfist$soiledfist.name=soiled fist
actors.mobs.yogfist$soiledfist.desc=This fist is formed out of chaotic earthen magic. As it moves it will constantly cause vegetation to sprout around it. It can also shoot concentrated earthen blasts that will ensnare its target in rapidly growing vines and roots!\n\nThe fist derives power from this plant life, and will resist damage based on the amount of tall or furrowed vegetation near it!
actors.mobs.yogfist$rottingfist.name=rotting fist
actors.mobs.yogfist$rottingfist.desc=This fist is formed out of living corruption. It is a towering mass of decaying flesh that can spread caustic ooze in melee and toxic gas at range. Even worse, the fist's great mass causes it to bleed instead of taking damage directly.\n\nWater can be used to wash the ooze off, but the fist is also capable of absorbing water to heal itself! Additionally, damaging the fist while it is bleeding will cause the bleed to refresh, but not stack!
actors.mobs.yogfist$rustedfist.name=rusted fist
actors.mobs.yogfist$rustedfist.desc=This fist is formed out of living metal. It is a towering mass of shifting metal that has powerful melee attacks, and can cripple its targets at range. Because of its tremendous mass, the fist will take any damage dealt to it over time, instead of immediately.\n\nThe fist is inflexible however, and cannot move into tight passageways. Additionally, while it may take damage slowly, the deferred damage will continue to increase if the fist is hit multiple times.
actors.mobs.yogfist$brightfist.name=bright fist
actors.mobs.yogfist$brightfist.teleport=The fist teleports away in a flash of light that seriously blinds you!
actors.mobs.yogfist$brightfist.desc=This fist is formed out of pure light energy. It is capable of shooting powerful rays of searing light every turn! These beams will temporarily blind you in addition to dealing heavy damage. The fist is also capable of briefly engulfing the arena in blinding light in order to escape!\n\nThe fist has no special abilities which it can use in melee range however.
actors.mobs.yogfist$darkfist.name=dark fist
actors.mobs.yogfist$darkfist.teleport=The fist teleports away in a blast of darkness that extinguishes your light source!
actors.mobs.yogfist$darkfist.desc=This fist is formed out of pure dark energy. It is capable of shooting powerful blasts of dark magic every turn! These blasts will weaken your light source in addition to dealing heavy damage. The fist is also capable of briefly engulfing the arena in darkness in order to escape!\n\nThe fist has no special abilities which it can use in melee range however.
