###blobs
actors.blobs.blizzard.name=暴風雪
actors.blobs.blizzard.desc=此處正在遭受暴風雪肆掠。

actors.blobs.confusiongas.name=致眩氣體
actors.blobs.confusiongas.desc=此處充斥著致眩氣體。

actors.blobs.electricity.name=電場
actors.blobs.electricity.desc=此處充斥著高壓電力，火花從中爆出。
actors.blobs.electricity.rankings_desc=觸電
actors.blobs.electricity.ondeath=你因觸電身亡……

actors.blobs.fire.name=火焰
actors.blobs.fire.desc=此處正在遭受火焰肆虐。

actors.blobs.foliage.name=落葉
actors.blobs.foliage.desc=光柱劃破了地下花園中的黑暗。

actors.blobs.freezing.name=寒氣
actors.blobs.freezing.desc=這裡的空氣異常寒冷。

actors.blobs.goowarn.name=黑暗能量
actors.blobs.goowarn.desc=黑暗能量在此處湧動!

actors.blobs.inferno.name=獄火
actors.blobs.inferno.desc=此處正在遭受獄火肆虐。

actors.blobs.paralyticgas.name=麻痺氣體
actors.blobs.paralyticgas.desc=此處充斥著麻痹氣體。

actors.blobs.regrowth.name=再生養分

actors.blobs.sacrificialfire.name=獻祭烈焰
actors.blobs.sacrificialfire.desc=這座祭壇承載著祭祀之火。在這裡死亡的生物會化為祭品，獻給地下城中的亡靈。\n\n或許只要獻祭夠多，就能得到回報?
actors.blobs.sacrificialfire.worthy=火焰吞噬了你的祭品，燒得更旺盛了。
actors.blobs.sacrificialfire.unworthy=火焰吞噬了你的祭品，但火勢沒有任何變化。
actors.blobs.sacrificialfire.reward=火焰突然竄高，隨後消散在空中，並留下了回報!

actors.blobs.smokescreen.name=煙幕
actors.blobs.smokescreen.desc=烏黑的濃煙在此處飄浮。

actors.blobs.stenchgas.name=腐臭氣體
actors.blobs.stenchgas.desc=此處充斥著腐臭的氣味。

actors.blobs.stormcloud.name=暴雨
actors.blobs.stormcloud.desc=水氣在此處翻騰。

actors.blobs.toxicgas.name=毒氣
actors.blobs.toxicgas.desc=此處充斥著青綠色的毒氣。
actors.blobs.toxicgas.rankings_desc=窒息
actors.blobs.toxicgas.ondeath=你被毒氣毒死了……

actors.blobs.corrosivegas.name=腐蝕酸霧
actors.blobs.corrosivegas.desc=此處充斥著致命酸蝕氣體。

actors.blobs.waterofawareness.name=靈知之井
actors.blobs.waterofawareness.procced=在你小酌一口時，你感覺到知識湧入了你的頭腦。
actors.blobs.waterofawareness.desc=知識的力量從這口井的水中散發出來。喝下這口井的水可以完全辨識所有裝備物品、辨識你庫存中所有物品的詛咒，並顯示目前樓層的所有物品。

actors.blobs.waterofhealth.name=聖療之井
actors.blobs.waterofhealth.procced=當你小酌一口時，你感覺到你身上的痛苦完全消除了。
actors.blobs.waterofhealth.desc=純淨的力量從這口井的水中散發出來。喝下這口井的水可以完全治療你、使你完全飽腹，並淨化你裝備物品上的詛咒。

actors.blobs.web.name=蜘蛛網
actors.blobs.web.desc=這裡覆蓋著厚厚的蜘蛛網。蜘蛛網能被丟來或碰觸到的東西打破，但同時會把那些東西黏在原地。



###buffs
actors.buffs.adrenaline.name=激素湧動
actors.buffs.adrenaline.desc=激素湧動能引出角色的潛在體能，因而增強移動和攻擊速度。\n\n激素湧動使角色擁有2倍的移動速度和1.5倍的攻擊速度。\n\n效果剩餘:%s回合。

actors.buffs.adrenalinesurge.name=力量激發
actors.buffs.adrenalinesurge.desc=一股強大的力量，可惜只是暫時的。\n\n力量加成:+%d。\n距離效果衰减還剩:%s回合。

actors.buffs.amok.name=狂亂
actors.buffs.amok.desc=狂亂令生物心中燃起熊熊怒火，並讓他們陷入混亂。\n\n狂亂生物會不分敵我，攻擊任何靠近牠們的生物。\n\n狂亂效果剩餘:%s回合

actors.buffs.arcanearmor.name=秘法護甲
actors.buffs.arcanearmor.desc=一層淡薄的護甲輕貼著你，可為你抵擋一定的魔法傷害。\n\n魔法護甲加成:0~%d。\n\n距離護盾衰滅還剩:%s回合

actors.buffs.artifactrecharge.name=神器充能
actors.buffs.artifactrecharge.desc=魔力在你體內奔馳而過，提高你裝備的神器的充能速率。\n\n每件神器受到的影響都不盡相同，但它們的充能速率較之平時都會更高。\n\n效果剩餘:%s回合。

actors.buffs.ascensionchallenge.name=護符的詛咒
actors.buffs.ascensionchallenge.desc=不知為何Yog-Dzewa仍能藉護符影響這世界，祂正藉此設法阻止你回到地面!\n\n古神運用祂的力量使你的敵人變得更多、更強大，整座地下城因而變得更危險了!所幸你可以通過擊敗古神所加強過的敵人來削弱祂的力量，若是置之不理則只會讓古神之力更加強大。
actors.buffs.ascensionchallenge.desc_clear=護符散發出的黑暗能量暫時被消減到最弱了。
actors.buffs.ascensionchallenge.desc_beckon=護符正在_呼喚遠處的敵人_，向它們通報你的位置。
actors.buffs.ascensionchallenge.desc_haste=護符正_為遠處的敵人加速_，令它們能夠更快接近你!
actors.buffs.ascensionchallenge.desc_slow=該護符目前正在_減慢你的速度，_並使加速效果無效!
actors.buffs.ascensionchallenge.desc_damage=護符的能量變得過於強大，以至於它_正對你直接造成傷害!_
actors.buffs.ascensionchallenge.beckon=護符開始呼喚遠處的敵人前來。
actors.buffs.ascensionchallenge.haste=護符開始替遠處的敵人增加速度!
actors.buffs.ascensionchallenge.slow=護符變得如鉛錘般沉重!
actors.buffs.ascensionchallenge.damage=護符開始釋放出黑暗能量。它在灼燒你的肉體!
actors.buffs.ascensionchallenge.weaken_info=護符的詛咒可以透過擊敗敵人減弱。
actors.buffs.ascensionchallenge.weaken_info_no_kills=擊敗敵人後，護符的詛咒就會減弱!
actors.buffs.ascensionchallenge.weaken=你可以感受到護符的詛咒消退了一點。
actors.buffs.ascensionchallenge.break=你花點時間喘口氣。你感覺傷口正在癒合!
actors.buffs.ascensionchallenge.almost=你感覺到古神對護符的掌控開始轉弱，地面離你不遠了!
actors.buffs.ascensionchallenge.on_kill=黑暗能量將你吞噬……

actors.buffs.barkskin.name=樹膚
actors.buffs.barkskin.desc=你的皮膚硬化了，摸起來如同樹皮一樣既粗糙且堅固。\n\n硬化的皮膚增強了你的實際護甲，使你能更好地抵禦物理攻擊。\n\n護甲加成:0~%d。\n距離效果衰减還剩:%s回合。

actors.buffs.barrier.name=奧術護盾
actors.buffs.barrier.desc=一團可以抵擋全部傷害的能量護盾。\n\n只要奧術護盾的能量仍然存在，它將完全抵擋單位所受到的任何傷害。這種能量也會隨時間緩慢衰減。\n\n護盾能量剩餘:%d。

actors.buffs.berserk.angered=憤怒
actors.buffs.berserk.berserk=狂暴
actors.buffs.berserk.exhausted=精疲力竭
actors.buffs.berserk.recovering=恢復
actors.buffs.berserk.angered_desc=狂戰士身上有越多傷，攻擊的力道就越強。狂戰士受到物理傷害(包含護甲擋下的傷害)時會累積怒氣。怒氣越多，攻擊傷害越高。\n\n怒氣隨時間消散，但狂戰士生命值越低，怒氣就更不容易消散。\n\n怒氣累積至100%%時，狂戰士可進入狂暴狀態，並得到護盾，護盾量依護甲等級與缺失的生命值而定。此護盾隨時間消散，完全消散後，狂戰士需要恢復一陣子，才能再累積怒氣。\n\n目前累積怒氣_%1$.0f%%_\n_+%2$.0f%%_傷害\n\n現在進入狂暴會得到護盾_%3$d_點。
actors.buffs.berserk.berserk_desc=恐懼與不安隨著血液流出體外，現在狂戰士的體內充滿了怒火。現在他無可匹敵，_攻擊有+50%%傷害，並且得到額外護盾_，但此護盾每回合流失1點。\n\n護盾消散殆盡時，狂暴立即終止。\n\n狂暴結束後，狂戰士要恢復一陣子，才能再累積怒氣。\n\n護盾剩餘%d點。
actors.buffs.berserk.recovering_desc=內在潛力是有限的。狂戰士必須充分休息才能再次釋放他的怒火。\n\n恢復狀態下的狂戰士就算受到傷害也不會累積怒氣。
actors.buffs.berserk.recovering_desc_turns=恢復所需回合數:%d
actors.buffs.berserk.recovering_desc_levels=恢復所需等級:%.2f
actors.buffs.berserk.rankings_desc=暴走至死
actors.buffs.berserk.action_name=狂暴
actors.buffs.berserk.no_seal=你需要破損紋章才能進入狂暴狀態!

actors.buffs.bleeding.name=流血
actors.buffs.bleeding.ondeath=你因失血過多而死……
actors.buffs.bleeding.heromsg=你正在流血!
actors.buffs.bleeding.rankings_desc=流血至死
actors.buffs.bleeding.desc=傷口湧出大量血液，令人十分不安。 \n\n流血時每回合都會造成傷害。這種傷害值每回合都可能隨機減少，直到出血停止為止。 \n\n目前流血傷害:%d。

actors.buffs.bless.name=祝福
actors.buffs.bless.desc=你的集中力正在噴薄而出，有人說這是神賜的禮物。\n\n祝福狀態能夠提高自己25%%的命中率與閃避率，使被祝福者在戰鬥中勢如破竹。\n\n祝福效果剩餘:%s回合

actors.buffs.blindness.name=失明
actors.buffs.blindness.heromsg=你失明了!
actors.buffs.blindness.desc=失明使週遭陷入一片黑暗。 \n\n失明的單位的可視範圍被限制在一格以內、使遠程攻擊變得毫無作用、同時也很容易跟丟敵人。此外，英雄失明時無法閱讀書本或是卷軸。 \n\n失明效果剩餘:%s回合

actors.buffs.buff.heromsg=

actors.buffs.burning.name=燃燒
actors.buffs.burning.heromsg=你著火了!
actors.buffs.burning.burnsup=%s被燒毀了!
actors.buffs.burning.ondeath=你被燒死了……
actors.buffs.burning.rankings_desc=燒成灰燼
actors.buffs.burning.desc=沒什麼能比得上被火焰吞噬更令人感到痛苦。 \n\n在其被液體撲滅或自行熄滅之前，火焰會每回合都會造成傷害。火焰在你踏入水中時會熄滅，藥瓶打碎時所產生的水花也具有同樣效果。 \n\n此外，火焰會點燃所有接觸到的易燃地形以及其上所有可燃物。 \n\n燃燒效果剩餘:%s回合

actors.buffs.championenemy.warn=你感受到強敵的氣場。
actors.buffs.championenemy$blazing.name=烈焰精英
actors.buffs.championenemy$blazing.desc=烈焰精英免疫火焰，近戰攻擊傷害+25%，並使目標著火，死亡時還會引燃附近的非水地形。
actors.buffs.championenemy$projecting.name=索敵精英
actors.buffs.championenemy$projecting.desc=索敵精英擁有25%額外近戰傷害與+3近戰距離。
actors.buffs.championenemy$antimagic.name=敵法精英
actors.buffs.championenemy$antimagic.desc=敵法精英擁有50%的傷害減免，且完全免疫所有魔法效果。
actors.buffs.championenemy$giant.name=巨型精英
actors.buffs.championenemy$giant.desc=巨型精英擁有80%的傷害減免與一格額外的近戰範圍，但無法進入狹窄的空間。
actors.buffs.championenemy$blessed.name=天佑精英
actors.buffs.championenemy$blessed.desc=天佑精英擁有+300%額外精準與閃避。
actors.buffs.championenemy$growing.name=成長精英
actors.buffs.championenemy$growing.desc=成長精英擁有會持續增長的額外精準、閃避、物理傷害與傷害减免。\n\n目前精準、閃避、物理傷害加成:%1$d%%\n目前傷害减免:%2$d%%

actors.buffs.charm.name=魅惑
actors.buffs.charm.heromsg=你被魅惑了!
actors.buffs.charm.cant_attack=你被該敵人魅惑了，無法對其發動攻擊。
actors.buffs.charm.desc=魅惑魔法能控制心靈，暫時讓一對宿敵互相傾慕。\n\n受魅惑的角色無法對魅惑施行者進行直接攻擊，但依然可以攻擊其他敵人。傷痛會激醒被魅惑的角色，减少魅惑狀態的持續時間。\n\n魅惑效果剩餘:%s回合。

actors.buffs.chill.name=凍傷
actors.buffs.chill.freezes=%s凍住了!
actors.buffs.chill.desc=尚未完全凍結，但仍寒冷過度。\n\n凍傷的目標所有行動都會更加緩慢，减速程度取決於剩餘的凍傷效果時間。最嚴重的凍傷情况等同於遲緩效果。\n\n凍傷效果剩餘:%1$s回合\n目前减少的速度:%2$s%%

actors.buffs.combo.name=連擊數
actors.buffs.combo.action_name=連擊
actors.buffs.combo.combo=%d連擊!
actors.buffs.combo.bad_target=你必須攻擊近戰範圍之內的敵人。
actors.buffs.combo.prompt=選擇一位攻擊對象。
actors.buffs.combo.desc=角鬥士在連續攻擊對手的過程中漸入佳境，每次攻擊命中都會增加一連擊數，但長時間不進行攻擊會將連擊數歸零。在連擊持續的情況下，紋章所帶來的增益不會解除。\n\n累積連擊數可以獲得絕對命中的連擊戰技!連擊數到達2、4、6、8、10 時會分別獲得不同的技能。部分技能會重置你的連擊數。使出兩次相同戰技之間，連擊數必須歸零，並重新累積。\n\n目前的連擊數:%1$d。\n\n連擊效果將在%2$s回合後結束。
actors.buffs.combo$combomove.clobber.name=過肩摔
actors.buffs.combo$combomove.clobber.desc=將一名敵人擊退2格，但不造成傷害，也不能將其擊落深淵。提升1點連擊數。
actors.buffs.combo$combomove.clobber.empower_desc=將一名敵人擊退_3格，令其暈眩，能將其擊落深淵_，但不造成傷害。提升1點連擊數。
actors.buffs.combo$combomove.slam.name=衝撞
actors.buffs.combo$combomove.slam.desc=造成防禦值%d%%(連擊數x20%%)的額外傷害。使用後重置連擊數。
actors.buffs.combo$combomove.slam.empower_desc=_前躍最多%1$d格_並造成防禦值%2$d%%(連擊數x20%%)的額外傷害。使用後重置連擊數。
actors.buffs.combo$combomove.parry.name=招架
actors.buffs.combo$combomove.parry.desc=使用後，格擋下一回合內受到的第一次攻擊，並立即做出還擊。如果沒攻擊可招架，則重置連擊數。
actors.buffs.combo$combomove.parry.empower_desc=使用後，格擋下一回合內受到的_所有_攻擊，並立即做出還擊。如果沒攻擊可格擋，則重置連擊數。
actors.buffs.combo$combomove.crush.name=遁地
actors.buffs.combo$combomove.crush.desc=對目標造成%d%%(連擊數x25%%)點傷害，並對在7x7範圍內的其他敵人造成一半傷害。使用後重置連擊數。
actors.buffs.combo$combomove.crush.empower_desc=_前躍最多%1$d格_，然後對近戰範圍內的主要目標造成%2$d%%(連擊數x25%%)點傷害，並對在7x7範圍內的其他敵人造成50%%傷害。使用後重置連擊數。
actors.buffs.combo$combomove.fury.name=暴揍
actors.buffs.combo$combomove.fury.desc=攻擊一名敵人數次，攻擊次數等同於連擊數。每次攻擊造成60%傷害，並可以觸發武器附魔效果。使用後重置連擊數。
actors.buffs.combo$combomove.fury.empower_desc=_前躍最多%d格以靠近敵人_並攻擊其數次，攻擊次數等同於連擊數。每次攻擊造成60%%傷害，並可以觸發武器附魔效果。使用後重置連擊數。

actors.buffs.corruption.name=腐化
actors.buffs.corruption.desc=腐化魔法能滲透至生物的本質，扭曲其原本的意志。\n\n被腐化的生物會攻擊友方，忽略原有的敵人。腐化魔法也會傷害生物，讓他們緩慢走向死亡。\n\n遭腐化後就無法脫身，唯有死亡才能獲得解脫。

actors.buffs.cripple.name=殘廢
actors.buffs.cripple.heromsg=你殘廢了!
actors.buffs.cripple.desc=你很確定自己的腿折成那樣不太正常。 \n\n殘廢會將移動速度減半，通常會讓移動一格之時長，從一回合增至兩回合。 \n\n殘廢效果剩餘:%s回合

actors.buffs.daze.name=恍惚
actors.buffs.daze.heromsg=你感到頭暈目眩!
actors.buffs.daze.desc=耳畔的嗡鳴聲模糊的視覺使得戰鬥變得十分困難。\n\n在恍惚狀態下，精準和閃避都會減少 50%%，使得命中和躲避都變得更加困難。\n\n恍惚效果剩餘:%s回合

actors.buffs.degrade.name=降級
actors.buffs.degrade.heromsg=你的裝備被暫時弱化了!
actors.buffs.degrade.desc=強大的黑暗魔法正在吞噬升級卷軸注入你裝備的魔力!\n\n降級狀態下的裝備會被視作比起原有等級更低的狀態。_超過3級以後的每一級都會受到更嚴重的削弱_。物品的描述也會根據降級的影響而改變。\n\n不過，降級不會影響裝備的力量需求，法杖充能，投擲武器耐久，以及神器。\n\n降級效果剩餘:%s回合。使用一張升級卷軸或祛邪卷軸可以立即驅散這種黑暗魔法。

actors.buffs.doom.name=定命
actors.buffs.doom.desc=當整個世界都看起來想置你於死地時，繼續鬥爭還有什麼意義呢?\n\n被定命的單位受到的任何傷害都會提升67% 。\n\n遭定命後就無法脫身，唯有死亡才能獲得解脫。

actors.buffs.dread.name=魂飛魄散
actors.buffs.dread.desc=目標已被嚇至魂飛魄散，正在極度的恐慌下嘗試逃出這座地下城!\n\n魂飛魄散的生物將快速逃離它們的敵人，並且會在離開敵人可視範圍後立即消失在整座地下城中。逃離的敵人不會掉落道具，只會給予玩家減半的經驗值獎勵。傷害所造成的痛楚將促使其鎮定下來。\n\n魂飛魄散效果剩餘時長:%d 回合。

actors.buffs.drowsy.name=嗜睡
actors.buffs.drowsy.desc=一股魔法之力讓保持清醒變得艱難，在幾回合後，目標將會陷入深沉的魔法睡眠。\n\n英雄可以透過承受傷害或保持滿血來抵禦睡意。\n\n陷入沉睡倒數:%s回合。

actors.buffs.earthimbue.name=大地之力
actors.buffs.earthimbue.desc=你被灌注了大地之力! \n\n所有物理攻擊都會使敵人腳下的地面翻騰，使其在段時間內殘廢。 \n\n大地之力效果剩餘:%s回合

actors.buffs.enhancedrings.name=戒指強化
actors.buffs.enhancedrings.desc=盜賊在使用神器時強化了他裝備中的戒指，使它們獲得 +1 升級。\n\n效果剩餘:%s回合。

actors.buffs.fireimbue.name=烈焰之力
actors.buffs.fireimbue.desc=你被灌注了烈焰之力! \n\n所有物理攻擊都有機會點燃敵人。同時，火焰對你完全無效。 \n\n火焰之力效果剩餘:%s回合

actors.buffs.foresight.name=地形預知
actors.buffs.foresight.desc=不知為何，你的腦海中映射出了周遭的地形。\n\n地形預知狀態持續時，你周遭大範圍的地格都會被揭示，包括隱藏門與陷阱。\n\n地形預知效果剩餘:%s 回合。

actors.buffs.frost.name=凍結
actors.buffs.frost.freezes=%s凍住了!
actors.buffs.frost.desc=這種冰凍法只是將目標包覆在冰裡，而非將其凍成冰雕。\n\n凍結效果類似於麻痺，會致使目標無法行動。但與麻痺不同的是，在目標受到傷害時，冰會碎裂而凍結效果將隨之解除。\n\n凍結效果剩餘:%s回合

actors.buffs.frostimbue.name=寒霜之力
actors.buffs.frostimbue.desc=你被灌注了寒霜的力量!\n\n所有形式的物理攻擊都會在敵人身上累加凍傷效果。與此同時你對凍傷完全免疫。\n\n寒霜之力效果剩餘:%s回合

actors.buffs.fury.name=憤怒
actors.buffs.fury.heromsg=你已憤怒不已!
actors.buffs.fury.desc=你非常憤怒。對敵人來說，怒火中燒的你可不好惹。\n\n猛烈的怒火在你胸腔燃燒著，你造成的物理攻擊傷害增加50%%。\n\n這股怒火會在你的生命低於50%%以下時不斷延燒。

actors.buffs.blobimmunity.name=淨化屏障
actors.buffs.blobimmunity.desc=一股奇妙的力量環繞在你的周圍，為你阻擋有害的環境效果。\n\n在淨化屏障的持續時間內，你將免疫所有負面環境效果。\n\n淨化屏障效果剩餘:%s回合。

actors.buffs.gravitychaostracker.name=重力混亂
actors.buffs.gravitychaostracker.desc_intro=每過幾回合，在這層樓的所有生物都會被隨機拉向某個方向。
actors.buffs.gravitychaostracker.desc_positive=然而，你和盟友似乎不受此影響。
actors.buffs.gravitychaostracker.desc_duration=此效果總會有結束的時候。

actors.buffs.greaterhaste.name=風馳電掣
actors.buffs.greaterhaste.desc=一股驚人的速度加成，身邊的一切彷彿都在此刻靜止了。\n\n在風馳電掣作用期間，移動完全不會消耗時間，但其他動作依然維持普通的速度。每走一步都會消耗一回合的風馳電掣。\n\n風馳電掣效果剩餘:%d回合。

actors.buffs.haste.name=極速
actors.buffs.haste.desc=強大的能量灌入到你的雙腿肌肉上，使你能以不可思議的速度移動!\n\n當你擁有極速狀態時你將擁有3倍的移動速度，但是其他行動速度仍然和原來一樣。\n\n極速效果剩餘:%s回合。

actors.buffs.healing.name=治療
actors.buffs.healing.desc=一股治療魔力讓你的傷口開始癒合。你的生命將每回合穩定回復，直到治療效果結束。治療量將隨著時間逐漸減少。\n\n下一回合治療量:%d。\n\n剩餘治療量:%d。

actors.buffs.herodisguise.name=偽裝
actors.buffs.herodisguise.desc=幻術魔法改變了你的外貌!雖然這種效果純屬裝飾性質，但感覺起來果然還是很奇怪。\n\n偽裝效果剩餘:%s回合。

actors.buffs.hex.name=幻惑
actors.buffs.hex.heromsg=你的精神受到了魔法的干擾!
actors.buffs.hex.desc=干擾集中力的黑暗魔法，使目標無法準確地判斷方位。\n\n混亂狀態會降低目標20%%的精準與閃避屬性，使其在戰鬥中更容易處於下風。\n\n幻惑效果剩餘時長:%s回合。

actors.buffs.holdfast.name=不動如山
actors.buffs.holdfast.desc=戰士原地不動時會進入堅守狀態，讓他的護甲提升%1$d~%2$d點並將連擊與護盾的消散速度減低%3$d%%。該狀態將持續到他移動為止。

actors.buffs.hunger.hungry=飢餓
actors.buffs.hunger.starving=極度飢餓
actors.buffs.hunger.onhungry=你有點餓了。
actors.buffs.hunger.onstarving=你已經飢腸轆轆!
actors.buffs.hunger.ondeath=你餓昏了……
actors.buffs.hunger.cursedhorn=受詛咒的號角在你用餐時偷走了食物部份的能量。
actors.buffs.hunger.rankings_desc=飢餓致死
actors.buffs.hunger.desc_intro_hungry=你能感受到自己的五臟廟需要祭拜，不過還不算那麼急迫。
actors.buffs.hunger.desc_intro_starving=你的飢餓程度已經危及生命了。
actors.buffs.hunger.desc=\n\n饑餓會在你在地下城裡探索時緩慢累計，直到你飢餓難耐。在你極度饑餓時生命值會停止回復並且開始緩慢減少 。\n\n合理分配食物非常重要!如果你有足夠的生命值，挨餓直到食物更多的時候再進食也不失為一種策略。正確的配給可以讓食物更有效地發揮作用!

actors.buffs.invisibility.name=隱形
actors.buffs.invisibility.desc=你和周圍的地形完全融為一體，沒有生物看得見你。\n\n當你在隱形時敵人無法追蹤或攻擊你。物理攻擊和魔法(比如卷軸和法杖)會立即解除隱形效果。\n\n隱形效果剩餘:%s回合。

actors.buffs.invulnerability.name=無敵
actors.buffs.invulnerability.desc=強大的力量使這個單位堅不可摧，暫時使所有攻擊都對其沒輒!\n\n效果剩餘:%s回合。

actors.buffs.levitation.name=飄浮
actors.buffs.levitation.desc=一股魔力把你從地面托起，讓你覺得自己身輕如燕。\n\n在漂浮時角色會無視所有以地面為基礎的效果。陷阱不會被觸發、火焰不會被水灘撲滅、植物不會被踩踏、根系無法束縛你、並且能夠跨越深淵。當心，在結束漂浮的那一刻，上述效果都會失效!\n\n漂浮效果剩餘:%s回合。

actors.buffs.lifelink.name=生命聯結
actors.buffs.lifelink.ondeath=傷害經生命連結，殺死了你……
actors.buffs.lifelink.desc=這個單位的生命力與另一位緊密相連，它們將共同分擔所有受到的傷害。\n\n當其受到傷害時，半數的傷害將由另一方承擔。\n\n生命連結效果剩餘:%s回合。

actors.buffs.light.name=發光
actors.buffs.light.desc=即使是在最黑暗的地底下，身邊有一個穩定的光源也總是令人欣慰。\n\n光照能驅散黑暗，使你能夠無視周遭的黑暗環境並擁有一個合理的可視範圍。\n\n發光效果剩餘:%s回合。

actors.buffs.lockedfloor.name=背水一戰
actors.buffs.lockedfloor.desc=目前樓層被徹底封鎖，你無法離開這裡!\n\n封鎖持續期間，你不會更加饑餓，或因極度饑餓減少生命值。另外，如果你在樓層封鎖時被沒祝福過的重生十字架復活了，本層將被完全重置。\n\n擊殺本層頭目以解除封鎖。

actors.buffs.lostinventory.name=遺落行囊
actors.buffs.lostinventory.desc=你的背包被遺落在了地下城中的某處!在找回你的背包之前，你將無法撿起或使用大部分道具。

actors.buffs.magicalsight.name=魔能透視
actors.buffs.magicalsight.desc=不知為何，即使閉上眼睛你也可以用心靈洞察到周圍發生的一切。\n\n當處於魔能透視狀態時，你的可視範圍將能穿過牆體與地形，並且視距的半徑也會擴展為 12 格。\n\n魔能透視效果剩餘:%s 回合。

actors.buffs.magicalsleep.name=魔法睡眠
actors.buffs.magicalsleep.toohealthy=你非常健康，因此能抗拒強烈的嗜睡感。
actors.buffs.magicalsleep.fallasleep=你陷入深層的魔法睡眠。
actors.buffs.magicalsleep.wakeup=清醒後，你感到精神抖擻且健康。
actors.buffs.magicalsleep.desc=目標已深深陷入了魔法睡眠，不會自然醒來。\n\n魔法睡眠與一般的睡眠差不多，但只有受傷會致使目標醒來。\n\n對於英雄和他們的盟友，魔法睡眠有一些恢復性的效果，使他們能夠在睡眠中迅速癒合傷口。

actors.buffs.magicimmune.name=魔法免疫
actors.buffs.magicimmune.desc=任何魔法都奈何不了你，你對魔法完全免疫。\n\n在魔法免疫狀態下，所有魔法效果無論益害都無法影響你，包括但不限於詛咒、附魔、刻印、法杖、卷軸、戒指、神器等。但英雄護甲的能力足夠強大，能夠不受這種效果影響，正常發揮作用。\n\n魔法免疫效果剩餘:%s回合。

actors.buffs.mindvision.name=靈視
actors.buffs.mindvision.desc=你可以在腦海中以某種方式看到這一層的所有單位。這種感覺非常奇異。\n\n只要靈視效果依然存在，你就可以看見這一層的所有單位。通過靈視看到的單位同樣算作你的可視範圍，可以被很多魔法效果影響。\n\n靈視效果剩餘:%s回合。

actors.buffs.momentum.momentum=積蓄動量
actors.buffs.momentum.running=逸動
actors.buffs.momentum.resting=恢復中
actors.buffs.momentum.action_name=逸動
actors.buffs.momentum.momentum_desc=移動的時候，疾行者會逐漸積蓄動能。疾行者可以消耗動能以開啟逸動狀態。\n\n每一點動能可以支持兩回合的逸動，最多可以儲存10點動能。當疾行者停止移動時動能會快速消散。\n\n現有的動能:%d。
actors.buffs.momentum.running_desc=移動的時候，疾行者會逐漸積蓄動能。疾行者可以消耗動能以開啟逸動狀態。\n\n處於逸動狀態時，疾行者能夠以兩倍速移動，並且基於自身等級獲得額外的閃避屬性。\n\n效果剩餘:%d。
actors.buffs.momentum.resting_desc=移動的時候，疾行者會逐漸積蓄動能。疾行者可以消耗動能以開啟逸動狀態。\n\n疾行者現在需要休息一會才能重新積蓄動能。\n\n冷卻剩餘:%d回合。

actors.buffs.monkenergy.name=內力
actors.buffs.monkenergy.action=武術
actors.buffs.monkenergy.desc=每當武道者擊敗一個敵人，她就會獲得可用於施展多門武術的內力。擊敗大多數種類的敵人時只會獲得 1 點內力，武道者不會隨時間流失內力。\n\n現有內力:%1$d/%2$d。
actors.buffs.monkenergy.desc_cooldown=武道者剛剛施展過一次武術，再次施展前必須等待。\n\n剩餘冷卻時間:%d 回合。
actors.buffs.monkenergy$monkability$flurry.name=亂拳
actors.buffs.monkenergy$monkability$flurry.desc=兩次不耗回合的攻擊，每次造成 %1$d~%2$d 點傷害並且忽略護甲。這門武術不能連續使用。
actors.buffs.monkenergy$monkability$flurry.empower_desc=兩次不耗回合的攻擊，每次造成 %1$d~%2$d 點傷害，忽略護甲，_可以觸發武器的附魔_。這門武術不能連續使用。
actors.buffs.monkenergy$monkability$focus.name=凝神
actors.buffs.monkenergy$monkability$focus.desc=武道者消耗一回合來進入凝神狀態，招架下一次對她發動的攻擊。
actors.buffs.monkenergy$monkability$focus.empower_desc=武道者_立即_進入凝神狀態，招架下一次對她發動的攻擊。
actors.buffs.monkenergy$monkability$focus$focusbuff.name=凝神
actors.buffs.monkenergy$monkability$focus$focusbuff.desc=武道者正專注於她周圍的一切，可以預料到對她發動的下一次攻擊。 當處於凝神狀態時，她將必定招架下一次來襲的攻擊。
actors.buffs.monkenergy$monkability$dash.name=凌雲步
actors.buffs.monkenergy$monkability$dash.prompt=選擇一個位置
actors.buffs.monkenergy$monkability$dash.desc=立刻衝向一個最多 4 格遠的位置。這個技能能幫你越過危險地帶，但無法穿越敵人或是實體障礙物。
actors.buffs.monkenergy$monkability$dash.empower_desc=立刻飛向一個至多_8格_遠的位置。這一武術可以飛越危險的地形，但不能穿過敵人或高聳的障礙物。
actors.buffs.monkenergy$monkability$dragonkick.name=神龍擺尾
actors.buffs.monkenergy$monkability$dragonkick.desc=致命的踢擊，造成 %1$d~%2$d 點傷害，無視護甲，並將敵人擊退，也會對敵人施加與擊退距離相等回合數的麻痺。
actors.buffs.monkenergy$monkability$dragonkick.empower_desc=令人生畏的踼擊，造成_%1$d~%2$d_穿甲傷害，依擊退格數麻痹_所有在旁的目標_。
actors.buffs.monkenergy$monkability$meditate.name=冥思
actors.buffs.monkenergy$monkability$meditate.desc=武道者消耗 5 回合來運轉內力，將大部分的負面效果逼出體外，並獲得 8 回合的法杖和神器充能。
actors.buffs.monkenergy$monkability$meditate.empower_desc=武道者消耗 5 回合來運轉內力，將大部分的負面效果逼出體外，充能法杖與神器8回合。_運力時減傷80%，並緩慢恢復20%流失的生命值。_

actors.buffs.ooze.name=腐蝕淤泥
actors.buffs.ooze.heromsg=淤泥在腐蝕你的身體。洗掉它!
actors.buffs.ooze.ondeath=你被徹底融解掉了……
actors.buffs.ooze.rankings_desc=被溶解
actors.buffs.ooze.desc=這種黏稠的酸性淤泥正緊緊附著在你的骨肉上，並緩慢地將它們腐蝕融化。\n\n腐蝕淤泥會對受害者持續造成傷害，不過能夠立刻在水中洗掉。\n\n腐蝕淤泥效果剩餘:%s回合。

actors.buffs.paralysis.name=麻痹
actors.buffs.paralysis.heromsg=你被麻痹了!
actors.buffs.paralysis.out=脫離麻痹
actors.buffs.paralysis.desc=通常最壞的事就是什麼事都做不出來。\n\n麻痹會停止目標的一切動作，迫使目標原地不動直到效果消失。受傷導致的疼痛能夠幫助目標脫離麻痹。\n\n麻痹效果剩餘至多:%s回合。

actors.buffs.physicalempower.name=物理攻擊強化
actors.buffs.physicalempower.desc=你的攻擊已被強化，接下來的幾次物理攻擊命中後將會造成額外傷害。\n\n額外傷害:%1$d。\n剩餘攻擊次數:%2$d。

actors.buffs.pincushion.name=中矢
actors.buffs.pincushion.desc=你擊中這個單位的投擲武器正卡在他身上，打敗他們後投擲武器將會掉在地上。\n\n正卡在該單位身上的物品:

actors.buffs.poison.name=中毒
actors.buffs.poison.heromsg=你中毒了!
actors.buffs.poison.ondeath=你被毒死了……
actors.buffs.poison.rankings_desc=中毒致死
actors.buffs.poison.desc=毒素傳遍全身，緩慢地損傷著各個器官。\n\n毒素每回合造成的傷害與其剩餘的回合數成正比。\n\n中毒效果剩餘:%s回合。

actors.buffs.preparation.name=準備階段
actors.buffs.preparation.action_name=蓄力打擊
actors.buffs.preparation.desc=刺客正耐心地潛伏著，準備從暗影中給予致命一擊。
actors.buffs.preparation.desc_dmg=他的下一次攻擊會造成_%1$d%%_的額外傷害，並瞬間斬殺生命低於_%2$d%%_的普通敵人，或生命低於_%3$d%%_的頭目。
actors.buffs.preparation.desc_dmg_likely=這一擊更有可能造成巨大的傷害。
actors.buffs.preparation.desc_blink=他可以瞬間衝刺到敵人身邊再攻擊，最大衝刺距離為_%d_格。
actors.buffs.preparation.desc_invis_time=你已隱形 _%d回合_。
actors.buffs.preparation.desc_invis_next=再多隱身_%d回合_後將增強攻擊。
actors.buffs.preparation.prompt=選擇你的攻擊對象!\n最大閃躍距離:%d
actors.buffs.preparation.no_target=這裡沒有可攻擊的目標。
actors.buffs.preparation.out_of_reach=目標在你的所及範圍外。
actors.buffs.preparation.assassinated=處決

actors.buffs.prismaticguard.name=虹色替身
actors.buffs.prismaticguard.desc=你正在被一個目前看不見的分身所保護。當有敵人出現在這個分身時將會為你戰鬥!\n\n當分身未啟用時，它將逐漸恢復所受到的傷害。\n\n分身目前生命值:%d/%d。
actors.buffs.prismaticguard.desc_many=這位虹色替身已被眾人之力強化。 效果剩餘:%d回合。

actors.buffs.recharging.name=法杖充能
actors.buffs.recharging.desc=魔力在你體內奔騰而過，提高你的魔杖和法杖的充能速率。\n\n每回合這個效果都將給你的法杖/魔杖增加0.25點充能，這個效果的充能不同於正常充能並且能與之疊加。\n\n充能效果剩餘:%s回合。

actors.buffs.revealedarea.name=區域揭示
actors.buffs.revealedarea.desc=一片區域受到揭露，無論你身處這層中的何處都能對那裡一覽無遺。\n\n效果剩餘:%s回合。

actors.buffs.revealedchar.name=單位揭示
actors.buffs.revealedchar.desc=這個單位已被向英雄揭露，它無論身處何處都將保持可見。\n\n效果剩餘:%s回合。

actors.buffs.roots.name=束縛
actors.buffs.roots.heromsg=你不能動了!
actors.buffs.roots.desc=某種不知是自然產生還是魔法召喚的根系纏到了腳上，牢牢將它們縛在地面。\n\n根系會讓目標被困在當前區塊，使其不能移動或使用大部分移動技能。 其他行為不受干擾，例如傳送效果。\n\n纏繞效果剩餘:%s回合。

actors.buffs.scrollempower.name=卷軸賦能
actors.buffs.scrollempower.desc=法師閱讀卷軸時產生的能量會暫時強化他的法杖!\n\n法杖強化:+%1$d 級。\n剩餘有效施法次數:%2$d 。

actors.buffs.shadows.name=暗影融合
actors.buffs.shadows.desc=你和周圍的陰影融為一體，使你隱形並減緩你的新陳代謝。\n\n當你在隱形時敵人無法追蹤或攻擊你。大部分物理攻擊和魔法(比如卷軸和法杖)會立即解除隱形效果。此外，當你處於暗影融合狀態下時，饑餓值增加的速率會降低。\n\n暗影融合狀態會一直持續直到你離開陰影或與敵人直接接觸。

actors.buffs.slow.name=遲緩
actors.buffs.slow.desc=減速魔法影響了目標的時間流速，在目標眼中所有的事物都移動得飛快。\n\n遲緩狀態下的角色執行所有行動都需要花費兩倍時間。\n\n遲緩效果剩餘:%s回合。

actors.buffs.snipersmark.name=狙擊標記
actors.buffs.snipersmark.action_name_snapshot=速射
actors.buffs.snipersmark.action_name_volley=齊射
actors.buffs.snipersmark.action_name_sniper=狙擊
actors.buffs.snipersmark.desc=狙擊手會專注於最近射擊的目標，能夠用靈能弓進行一次特殊攻擊，攻擊方式取決於弓的改造方式。\n\n若持有未受強化符石影響的弓，狙擊手可發射_瞬發箭矢_，造成低於正常箭矢的傷害，但不消耗時間。\n\n若持有加強了速度的弓，狙擊手可進行_三箭連發_。每支箭造成低於正常箭矢的傷害，但能觸發附魔。消耗一回合。\n\n若持有加強了傷害的弓，狙擊手可發射_狙擊箭矢_。狙擊箭矢必定命中，造成基於與目標距離的額外傷害，消耗兩回合。\n\n有效時長:%s回合。

actors.buffs.soulmark.name=靈魂標記
actors.buffs.soulmark.desc=術士已經擊穿了目標的靈魂。他將會在對其造成物理傷害時回復生命並填補饑餓感。\n\n靈魂標記效果剩餘:%s回合。

actors.buffs.stamina.name=精力充沛
actors.buffs.stamina.desc=你感受到了體內無盡的精力，讓你可以用更快的速度移動!\n\n當你處於精力充沛狀態下你的移動速度將提升50%%，但是這不影響其他活動所消耗的時間。\n\n精力充沛效果剩餘:%s回合。

actors.buffs.vulnerable.name=易傷
actors.buffs.vulnerable.heromsg=你感到外界的傷害更加疼痛!
actors.buffs.vulnerable.desc=易傷魔法會使得目標受到所有被護甲減免過的物理傷害增加33%%。\n\n易傷效果剩餘:%s回合。

actors.buffs.terror.name=恐懼
actors.buffs.terror.desc=恐懼是使敵人陷入失控恐慌的操縱性魔法。\n\n恐懼中的單位會遠離自己的敵人，試圖用盡可能多的門或牆隔開他們。然而，疼痛的衝擊會減少恐懼的持續時間。\n\n恐懼效果剩餘:%s回合。

actors.buffs.toxicimbue.name=毒素之力
actors.buffs.toxicimbue.desc=毒素能量在你身體內流轉!\n\n在你移動時，毒氣會從你的毛細孔噴出，傷害你的敵人。效果期間與結束後數回合內，你免疫中毒效果與毒氣。\n\n毒素能量效果剩餘:%s回合。

actors.buffs.corrosion.name=酸蝕
actors.buffs.corrosion.heromsg=你正在被強酸溶解!
actors.buffs.corrosion.ondeath=你被徹底融化掉了……
actors.buffs.corrosion.rankings_desc=被溶解
actors.buffs.corrosion.desc=強酸能以驚人的速度腐蝕掉血肉、金屬和骨頭。\n\n目標被腐蝕的時間越長，酸蝕傷害越高。\n\n酸蝕效果剩餘:%1$s回合。\n目前酸蝕傷害:%2$d。

actors.buffs.vertigo.name=暈眩
actors.buffs.vertigo.desc=如果整個世界都在旋轉的話，想走直線會變得十分困難。\n\n眩暈效果持續時，目標的移動將會向一個隨機區域進行，而不是目標原本想到達的地方。\n\n眩暈效果剩餘:%s回合。

actors.buffs.wandempower.name=法杖盈能
actors.buffs.wandempower.desc=你的傷害型法杖已被強化，接下來的幾次施法將會造成額外傷害。\n\n額外傷害:%1$d。\n\n剩餘施法次數:%2$d。

actors.buffs.weakness.name=虛弱
actors.buffs.weakness.heromsg=你感到力量正在流失!
actors.buffs.weakness.desc=你感覺自己的裝備突然變得沉重起來。\n\n虛弱魔法會減弱受施加單位的物理力量，使其造成的傷害減少33%%。\n\n虛弱效果剩餘:%s回合。

actors.buffs.wellfed.name=飽腹
actors.buffs.wellfed.desc=你感覺自己吃的非常飽。\n\n當你處於飽腹狀態時，你的饑餓值不會增加，並且會隨著時間的推移恢復額外的生命值。\n\n狀態剩餘:%d回合。



###hero

##abilities
actors.hero.abilities.armorability.self_target=你不能瞄準你自己!
actors.hero.abilities.armorability.no_target=那裡沒有有效目標!
actors.hero.abilities.armorability.prompt=選擇一處作為目標
actors.hero.abilities.armorability.cost=充能消耗:_%d_

actors.hero.abilities.warrior.heroicleap.name=英勇飛躍
actors.hero.abilities.warrior.heroicleap.prompt=選擇要飛躍到的地方
actors.hero.abilities.warrior.heroicleap.short_desc=戰士能向指定地點使用_英勇飛躍_，越過所有的敵人與環境。
actors.hero.abilities.warrior.heroicleap.desc=戰士向指定地點跳躍，越過路徑上的所有敵人與環境。不過戰士無法越過牆壁或是其它實體地形。
actors.hero.abilities.warrior.shockwave.name=震地沖擊
actors.hero.abilities.warrior.shockwave.short_desc=戰士大力鎚擊地面，向一個錐形區域施以_震地衝擊_。被衝擊波擊中的敵人會受到傷害並陷入殘廢。
actors.hero.abilities.warrior.shockwave.desc=戰士大力錘擊地面產生衝擊波，衝擊波將震擊前方 60 度扇形範圍 5 格距離內的區域。\n\n被衝擊波擊中的敵人會陷入 5 回合殘廢並受到 5~10 點傷害。 戰士超過10的每點力量會使得該傷害增加 1~2 點。
actors.hero.abilities.warrior.endure.name=苦痛堅忍
actors.hero.abilities.warrior.endure$enduretracker.name=苦痛之怒
actors.hero.abilities.warrior.endure$enduretracker.desc=戰士將承受的原始傷害織成憤怒，於攻擊時增加額外傷害。\n\n額外傷害:%1$d\n剩餘攻擊次數:%2$d
actors.hero.abilities.warrior.endure.short_desc=戰士_苦痛堅忍_，跳過若干回合並大幅抵抗傷害。接下來戰士會根據承受的原始傷害造成額外傷害。
actors.hero.abilities.warrior.endure.desc=戰士苦痛堅忍3回合，在此期間，所有傷害來源的威力減半。\n\n堅忍完10回合內，戰士的第一次攻擊傷害會得到加成。此傷害加成等同於戰士在堅忍期間，所有傷害來源的原始威力之和。\n\n如果角鬥士有任何連擊，使用此能力會補償3回合連擊時間。

actors.hero.abilities.mage.elementalblast.name=元素爆發
actors.hero.abilities.mage.elementalblast.no_staff=你無法在不攜帶魔杖的情況下發動這項能力。
actors.hero.abilities.mage.elementalblast.short_desc=法師從魔杖中釋放_元素爆發_，襲捲自身周圍的一大片區域，並基於灌注的法杖施加不同的效果。
actors.hero.abilities.mage.elementalblast.desc=法師釋放出風暴般的魔力，席捲半徑為4格的圓形區域並對其中的目標造成15~25點傷害。元素爆發引發的特殊效果隨魔杖所灌注的法杖類型而變。
actors.hero.abilities.mage.elementalblast.generic_desc=元素爆發的效果與法杖向敵人或盟友施法的效果類似。
actors.hero.abilities.mage.wildmagic.name=狂野魔法
actors.hero.abilities.mage.wildmagic.no_wands=你沒有法杖可供施法!
actors.hero.abilities.mage.wildmagic.short_desc=法師引導出法杖中的_狂野魔法_，在單回合內對指定目標隨機釋放這些法杖多次。
actors.hero.abilities.mage.wildmagic.desc=法師引出法杖中的潛能，在一回合內隨機射四次法杖，不包含法師的魔杖。\n\n法師身上法杖的等級暫時+2，至多把法杖等級升到+3。法杖施法時，只使用半點充能，每枝法杖最多釋能兩次。
actors.hero.abilities.mage.warpbeacon.name=傳送信標
actors.hero.abilities.mage.warpbeacon.depths=你還無法跨樓層傳送!
actors.hero.abilities.mage.warpbeacon.locked_floor=你不能離開封鎖的樓層!
actors.hero.abilities.mage.warpbeacon.too_far=這個位置太遠了!
actors.hero.abilities.mage.warpbeacon.invalid_beacon=你不能在此處放置信標!
actors.hero.abilities.mage.warpbeacon.window_desc=你的信標位在第%d層。
actors.hero.abilities.mage.warpbeacon.window_tele=傳送至信標位置
actors.hero.abilities.mage.warpbeacon.window_clear=移除信標
actors.hero.abilities.mage.warpbeacon.window_cancel=取消
actors.hero.abilities.mage.warpbeacon.short_desc=法師在原地放置_傳送信標_，而他能瞬間傳送到信標所在地。
actors.hero.abilities.mage.warpbeacon.desc=法師放置可以隨時傳送返回的信標。設置信標耗時1回合，但傳送至信標不花時間。\n\n信標與法師間不能有特殊障礙物，如上鎖的門。沒有特殊天賦時，法師無法跨樓層傳送。傳送之後，法師會擠開在信標上的敵人。

actors.hero.abilities.rogue.smokebomb.name=煙幕彈
actors.hero.abilities.rogue.smokebomb.fov=你只能跳到可視範圍內的空格子裡。
actors.hero.abilities.rogue.smokebomb.prompt=選擇要跳到的位置
actors.hero.abilities.rogue.smokebomb$ninjalog.name=木樁替身
actors.hero.abilities.rogue.smokebomb$ninjalog.desc=敵人就這樣笨笨地相信這就是盜賊本體!
actors.hero.abilities.rogue.smokebomb$ninjalog.discover_hint=此盟友為某種英雄護甲能力可召喚出的角色。
actors.hero.abilities.rogue.smokebomb.short_desc=盜賊在丟下_煙幕彈_後閃身離去，並讓在煙彈旁的敵人失明。
actors.hero.abilities.rogue.smokebomb.desc=盜賊在丟下煙幕後，閃現到6格內的區域，可以穿過敵人與危險地形，但無法穿過高聳地形。\n\n在煙彈旁的敵人會失明5回合。
actors.hero.abilities.rogue.deathmark.name=奪命印記
actors.hero.abilities.rogue.deathmark.ally_target=你只能標記敵人
actors.hero.abilities.rogue.deathmark.short_desc=盜賊對選中的敵人施加_奪命印記_。遭標記的敵人會受到額外傷害，但在標記退去前無法死亡。
actors.hero.abilities.rogue.deathmark.desc=盜賊對目標敵人植下為期5回合的標記。被標記的敵人受25%額外傷害，但在標記期間無法死亡。生命值為0的敵人在標記退去後立即死亡。\n\n植標記不花時間，植下的標記立即生效。
actors.hero.abilities.rogue.deathmark$deathmarktracker.name=奪命印記
actors.hero.abilities.rogue.deathmark$deathmarktracker.desc=這名遭標記的敵人受25%%額外傷害，但在標記退去前無法死亡。\n\n效果剩餘:%s回合。
actors.hero.abilities.rogue.shadowclone.name=暗影分身
actors.hero.abilities.rogue.shadowclone.short_desc=盜賊召喚_暗影分身_依指令協助戰鬥。
actors.hero.abilities.rogue.shadowclone.desc=盜賊召喚如黑影的分身，可以接收指令幫助盜賊戰鬥。指揮分身不耗充能。\n\n分身有80點生命，沒有護甲，攻擊造成10~20點傷害。以上數據可以靠天賦增強，讓分身可以擁有英雄武器與護甲的部分力量。
actors.hero.abilities.rogue.shadowclone$shadowally.name=暗影盜賊
actors.hero.abilities.rogue.shadowclone$shadowally.direct_defend=你的分身正移動到該位置。
actors.hero.abilities.rogue.shadowclone$shadowally.direct_follow=你的分身正跟隨著你。
actors.hero.abilities.rogue.shadowclone$shadowally.direct_attack=你的分身對其發動攻擊!
actors.hero.abilities.rogue.shadowclone$shadowally.desc=盜賊的分身，以黑影般的幽暗組成。它紋絲不動地站著，眼神空洞，一縷縷黑霧自它身上升起。\n\n分身並沒有完美複製盜賊，但依然是個不錯的戰力。若它擁有適當的天賦，它將能夠從盜賊的裝備上取得增益效果。
actors.hero.abilities.rogue.shadowclone$shadowally.discover_hint=此盟友為某種英雄護甲能力可召喚出的角色。

actors.hero.abilities.huntress.spectralblades.name=魅影刃
actors.hero.abilities.huntress.spectralblades.short_desc=獵人朝一個目標擲出_魅影刃_，根據其裝備的近戰武器造成傷害。
actors.hero.abilities.huntress.spectralblades.desc=獵人朝一個敵人擲出魅影刃，效果就如使用她的近戰武器進行遠程攻擊一般。該攻擊將觸發包括附魔的所有近戰攻擊效果。
actors.hero.abilities.huntress.naturespower.name=自然之力
actors.hero.abilities.huntress.naturespower.short_desc=獵人召喚_自然之力_，短時間內提升她的移動速度與靈能弓的射擊速度。
actors.hero.abilities.huntress.naturespower.desc=獵人暫時以自然之力強化了她自身和她的弓!\n此效果持續8回合。\n\n效果發動期間，獵人能以2倍速度移動，且使用弓箭時的攻擊速度提升33%。這種力量不影響狙擊手專精的追加攻擊。
actors.hero.abilities.huntress.naturespower$naturespowertracker.name=自然之力
actors.hero.abilities.huntress.naturespower$naturespowertracker.desc=獵人的能力暫時受到增強，她的移動速度和弓箭攻擊速度獲得提升。\n\n效果剩餘回合:%s。
actors.hero.abilities.huntress.spirithawk.name=靈魂獵鷹
actors.hero.abilities.huntress.spirithawk.no_space=你附近沒有空地可供召喚。
actors.hero.abilities.huntress.spirithawk.short_desc=獵人召喚_靈魂獵鷹_使魔，用以偵查環境和分散敵人的注意。
actors.hero.abilities.huntress.spirithawk.desc=獵人召喚靈魂獵鷹使魔，獵鷹存在場上時使用能力可指引其行動。\n獵鷹可存在100回合，指引獵鷹不會耗充能。\n\n獵鷹有著非常低的血量和攻擊力，但其速度快、敏捷度高、且攻擊精準。獵鷹的可視範圍也能被獵人所用。牠免疫所有環境效果，例如火焰、毒氣等。在沒有明確指示的情況下，獵鷹不會攻擊。
actors.hero.abilities.huntress.spirithawk$hawkally.name=靈魂獵鷹
actors.hero.abilities.huntress.spirithawk$hawkally.direct_defend=你的獵鷹正移動到那個位置。
actors.hero.abilities.huntress.spirithawk$hawkally.direct_follow=你的獵鷹正跟隨著你。
actors.hero.abilities.huntress.spirithawk$hawkally.direct_attack=你的獵鷹對其發動攻擊!
actors.hero.abilities.huntress.spirithawk$hawkally.desc=由獵人所召喚的魔法獵鷹。牠全身散發著明亮而空靈的藍光，不斷地轉頭探查周圍環境。\n\n雖然牠的戰鬥能力不怎麼優秀，但其速度和可視範圍對於偵查或分散敵人注意力都很有幫助。
actors.hero.abilities.huntress.spirithawk$hawkally.desc_remaining=獵鷹存在剩餘時長:%d回合。
actors.hero.abilities.huntress.spirithawk$hawkally.desc_dodges=獵鷹將保證閃避接下來的%d次攻擊。
actors.hero.abilities.huntress.spirithawk$hawkally.discover_hint=此盟友為某種英雄護甲能力可召喚出的角色。

actors.hero.abilities.duelist.challenge.name=單挑
actors.hero.abilities.duelist.challenge.prompt=選擇單挑對象
actors.hero.abilities.duelist.challenge.already_dueling=你一次只能與一個人對決。
actors.hero.abilities.duelist.challenge.ally_target=你只能向敵人發起對決。
actors.hero.abilities.duelist.challenge.unreachable_target=你必須選擇能接近的目標。
actors.hero.abilities.duelist.challenge.distant_target=那個敵人離你太遠了，無法與之對決。
actors.hero.abilities.duelist.challenge.short_desc=決鬥者_單挑_附近的一個敵人，短時間內使周圍其他敵人無法行動。
actors.hero.abilities.duelist.challenge.desc=決鬥者對附近的一個敵人發起單挑。該敵人將被迫迎戰，而其他敵人將暫時陷入時間靜止。\n\n目標必須能夠接近並在決鬥者周邊5格範圍內。戰鬥將會持續 10 回合，但提前分出勝負或距離超過5格也會中止。\n\n時間靜止的敵人們處於無敵狀態。決鬥者的盟友們不會被這個技能影響，但同理，如果向頭目發起單挑，它的手下們也不會被靜止。
actors.hero.abilities.duelist.challenge$duelparticipant.name=對決參與者
actors.hero.abilities.duelist.challenge$duelparticipant.desc=這個單位正在參與對決。此單位、決鬥者以及雙方的盟友、手下都能夠正常活動，其他所有單位則陷入凍結。\n\n以下情形之一將終止對決:對決超過限制時間、其中一方死亡或雙方距離超過五格。\n\n對決剩餘:%d回合。
actors.hero.abilities.duelist.elementalstrike.name=元素斬擊
actors.hero.abilities.duelist.elementalstrike.short_desc=決鬥者施放_元素斬擊_，該扇形範圍攻擊效果根據主要武器而定。
actors.hero.abilities.duelist.elementalstrike.desc=決鬥者攻擊敵人或地點，施放保證命中的普通攻擊，並散發魔法效果，在 65 度的圓錐範圍內最多可傳達 4 磚格。這種魔法效果會根據決鬥者主要武器上的魔法而改變。
actors.hero.abilities.duelist.elementalstrike.generic_desc=如果武器沒有附魔，元素斬擊就只會釋放一小股純魔法，對範圍內的所有敵人造成 6~12 點傷害。
actors.hero.abilities.duelist.feint.name=假動作
actors.hero.abilities.duelist.feint.prompt=選擇要衝刺前往的位置。
actors.hero.abilities.duelist.feint.too_far=那個位置不與你相鄰。
actors.hero.abilities.duelist.feint.bad_location=你無法移動到那個位置。
actors.hero.abilities.duelist.feint.short_desc=決鬥者做出_假動作_，同時衝向鄰近的地格。敵人會攻擊她的殘影，使他們在下回合無法閃避攻擊。
actors.hero.abilities.duelist.feint.desc=決鬥者做出假攻擊後衝向鄰近地格，使得敵人攻擊她在原地留下的殘影。\n\n攻擊殘影的敵人會感到困惑，使其下一個動作被取消而且能被伏擊。

actors.hero.abilities.cleric.ascendedform.name=神聖化
actors.hero.abilities.cleric.ascendedform.short_desc=牧師將自己_神聖化_以獲得新法術、近戰範圍及特殊護盾。
actors.hero.abilities.cleric.ascendedform.desc=牧師將神聖能量釋放出來，散發強大的光輝10回合。使牧師獲得新法術、+2近戰範圍以及30點護盾，在生效期間使用每點聖典充能都會額外獲得10點護盾。\n\n施放神聖化及其相關法術的護盾不會正常衰減，但生效期結束後立即消失。該技能可以重新施放已用於用於刷新神聖化形態的持續時間。
actors.hero.abilities.cleric.ascendedform$ascendbuff.name=神聖化
actors.hero.abilities.cleric.ascendedform$ascendbuff.desc=神聖能量從牧師身上釋放出來。這種型態使牧師能透過光明能量獲得+2近戰範圍以及透過施放期間聖典消耗的每點充能獲得10點護盾。他也會獲得透過天賦取得的新法術。\n\n施放神聖化及其相關法術的護盾不會正常衰減，但生效期結束後立即消失。\n\n生效的護盾量:%1$d。\n效果剩餘:%2$d回合。
actors.hero.abilities.cleric.trinity.name=三位一體
actors.hero.abilities.cleric.trinity.no_imbue=三位一體的效果尚未設定，施放相關法術來設定它們!
actors.hero.abilities.cleric.trinity.no_duplicate=三位一體無法複製你正在裝備的裝備效果!
actors.hero.abilities.cleric.trinity.ench_glyph_use=三位一體會消耗_%1$d充能_以獲得這種效果_%2$s回合_。
actors.hero.abilities.cleric.trinity.rare_ench_glyph_use=三位一體會消耗_%1$d充能_以獲得這種_強力_效果_%2$s回合_。
actors.hero.abilities.cleric.trinity.wand_use=三位一體會消耗_%2$s充能_來以_%1$d級_的參數釋放該法杖。
actors.hero.abilities.cleric.trinity.wand_multi_use=三位一體會消耗_%2$s充能_來以_%1$d級_的參數釋放該_複充能_法杖。
actors.hero.abilities.cleric.trinity.thrown_use=三位一體會消耗_%2$s充能_來投出_%1$d級_的這種武器。
actors.hero.abilities.cleric.trinity.ring_use=三位一體會消耗_%1$d充能_以獲得這種效果_%2$s回合_。
actors.hero.abilities.cleric.trinity.alchemiststoolkit_use=三位一體會消耗_%2$s充能_來打開煉金介面。
actors.hero.abilities.cleric.trinity.chaliceofblood_use=三位一體會消耗_%2$s充能_以提升至相應於該神器_%1$d級_的自動再生速度20回合。
actors.hero.abilities.cleric.trinity.driedrose_use=三位一體會消耗_%2$s充能_召喚出生命值相應於該神器_%1$d級_時的幽靈的腐化怨靈。
actors.hero.abilities.cleric.trinity.etherealchains_use=三位一體會消耗_%2$s充能_以在_%1$d格_範圍內使用鎖鏈。
actors.hero.abilities.cleric.trinity.hornofplenty_use=三位一體會消耗_%2$s充能_以發動該神器的淺嚐。
actors.hero.abilities.cleric.trinity.masterthievesarmband_use=三位一體會消耗_%2$s充能_以_+%1$d級_發動該神器對敵人的竊取。
actors.hero.abilities.cleric.trinity.sandalsofnature_use=三位一體會消耗_%2$s充能_以將有害種子扎根於該神器可觸及的指定地點。
actors.hero.abilities.cleric.trinity.skeletonkey_use=三位一體會消耗_%2$s充能_以發動該神器的能力。
actors.hero.abilities.cleric.trinity.talismanofforesight_use=三位一體會消耗_%2$s充能_以_+%1$d級_發動該神器的探察。
actors.hero.abilities.cleric.trinity.timekeepershourglass_use=三位一體會消耗_%2$s充能_以獲得該神器持續_%1$d_回合的時間凍結效果。
actors.hero.abilities.cleric.trinity.unstablespellbook_use=三位一體會消耗_%2$s充能_使用隨機卷軸效果，有_%1$d/10_機率改以秘卷形式施放。
actors.hero.abilities.cleric.trinity.cost=該護甲技能的充能消耗不定，但通常為_%d_。
actors.hero.abilities.cleric.trinity.short_desc=牧師獲得一套_三位一體_的護甲技能，複製已鑑定裝備效果並可通過使用新法術選擇其一使用。
actors.hero.abilities.cleric.trinity.desc=牧師獲得一套_三位一體_的護甲技能，可通過三種新法術為其選擇各種道具效果。法術的每種位格都專用於複製牧師本局已鑑定的不同種類裝備的效果:本體位格(附魔與刻印)、心靈位格(法杖與投擲武器)與精神位格(戒指與神器)。\n\n每種三位一體的位格一次可以被灌注一種效果，而牧師在使用三位一體時會選擇啓動哪一種。三位一體不會複製你已裝備物品的效果。
actors.hero.abilities.cleric.trinity$wndusetrinity.text=選擇使用三位一體的哪一種位格。不同位格的效果可以同時生效。
actors.hero.abilities.cleric.trinity$wndusetrinity.body=_本體:%s_
actors.hero.abilities.cleric.trinity$wndusetrinity.mind=_意念: %s_
actors.hero.abilities.cleric.trinity$wndusetrinity.spirit=_精神: %s_
actors.hero.abilities.cleric.trinity$wnditemtypeselect.text=選擇一個效果以灌注到對應位格。附加資訊將在確認之前顯示。
actors.hero.abilities.cleric.trinity$wnditemconfirm.body=選擇本體型態
actors.hero.abilities.cleric.trinity$wnditemconfirm.mind=選擇意念型態
actors.hero.abilities.cleric.trinity$wnditemconfirm.spirit=選擇精神型態
actors.hero.abilities.cleric.powerofmany.name=眾人之力
actors.hero.abilities.cleric.powerofmany.prompt_default=選擇一個盟友或空位
actors.hero.abilities.cleric.powerofmany.prompt_ally=指揮你的明光戰友
actors.hero.abilities.cleric.powerofmany.ally_exists=你已經有強化的盟友了。
actors.hero.abilities.cleric.powerofmany.no_vision=你無法以可視範圍外的位置為目標。
actors.hero.abilities.cleric.powerofmany.only_allies=你只能強化盟友。
actors.hero.abilities.cleric.powerofmany.short_desc=牧師引導_眾人之力_，強化現存盟友或創造一個新盟友。
actors.hero.abilities.cleric.powerofmany.desc=牧師引導_眾人之力_，強化一個現存盟友或創造一個新強化盟友，持續100回合。對空位施放創造一個新盟友。\n\n被衆人之力強化時， 任何盟友都會獲得+25%傷害加成和-25%傷害減免，雙方的可視範圍也將被共用。使用護甲技能時盟友還會獲得25點護盾。\n\n牧師還會獲得三種僅能對強化盟友施放的新法術。衆人之力不會在這些法術生效時結束。
actors.hero.abilities.cleric.powerofmany$powerbuff.name=眾人之力
actors.hero.abilities.cleric.powerofmany$powerbuff.desc=該盟友已被衆人之力強化，獲得 +25%%傷害加成和 -25%% 傷害減免。雙方的可視範圍也會被共用， 並可獲益於衆人之力。\n\n棱鏡映像這類盟友消散時，眾人之力會持續，但其作用時間仍會倒計時。\n\n效果剩餘:%s回合。
actors.hero.abilities.cleric.powerofmany$lightally.name=明光戰友
actors.hero.abilities.cleric.powerofmany$lightally.direct_defend=你的盟友將會移動到那個位置。
actors.hero.abilities.cleric.powerofmany$lightally.direct_follow=你的盟友正在跟隨你。
actors.hero.abilities.cleric.powerofmany$lightally.direct_attack=你的盟友對目標發動攻擊!
actors.hero.abilities.cleric.powerofmany$lightally.desc=牧師的冒險夥伴們的複製品之一，由凝固的光製成。它擁有另一個英雄的外形，但沒有任何他們的特有技能。 只要"眾人之力"的效果仍在，此盟友就會持續存在。\n\n此盟友可通過重複使用"眾人之力"護甲技能無消耗地引導。
actors.hero.abilities.cleric.powerofmany$lightally.discover_hint=此盟友為某種英雄護甲能力可召喚出的角色。


actors.hero.abilities.ratmogrify.name=鼠化術
actors.hero.abilities.ratmogrify.cant_transform=這個目標無法被鼠化!
actors.hero.abilities.ratmogrify.too_strong=那個敵人太強大了，無法被鼠化!
actors.hero.abilities.ratmogrify.short_desc=英雄能對敵人施展_鼠化術_!這可以暫時將敵人變成沒有特殊能力的老鼠。
actors.hero.abilities.ratmogrify.desc=英雄能將敵人變成老鼠 6 回合!不過頭目、盟友和老鼠不能被鼠化。\n\n被鼠化的敵人擁有原屬性，但特殊效果及能力將遭封鎖。
actors.hero.abilities.ratmogrify$transmograt.name=鼠化 %s
actors.hero.abilities.ratmogrify$transmograt.desc=這位朋友被變成了一隻老鼠。對我來說，它比原本好太多了!一一鼠王
actors.hero.abilities.ratmogrify$transmograt.rankings_desc=死於:鼠化敵人

##Cleric Spells
actors.hero.spells.auraofprotection.name=防禦力場
actors.hero.spells.auraofprotection.short_desc=提升聖騎士及周遭盟友的防禦能力。
actors.hero.spells.auraofprotection.desc=聖騎士開始散發保護性能量形成環繞自身的閃耀光環，持續20回合。 聖騎士兩格範圍內的任何盟友(包括自身)都會獲得%1$d%%的傷害減免和+%2$d%%的聖騎士護甲刻印效果。\n\n此傷害減免優先於其他傷害減免效果(例如護甲)。刻印強化會一直生效，但如果某單位已經受益於此(例如聖騎士自身或者其鏡像)，則刻印效果不能進一步強化。
actors.hero.spells.auraofprotection$aurabuff.name=防禦力場
actors.hero.spells.auraofprotection$aurabuff.desc=聖騎士正在散發環繞自身的保護性能量。\n\n任何附近的盟友(包括聖騎士自身)都會獲得傷害減免和聖騎士的護甲符文強化效果。\n\n效果剩餘: %s回合。

actors.hero.spells.beamingray.name=呼神護衛
actors.hero.spells.beamingray.no_space=那裡沒有空間讓你的盟友出現。
actors.hero.spells.beamingray.out_of_range=那位置在範圍外。
actors.hero.spells.beamingray.short_desc=傳送你的盟友並使其獲得傷害加成。
actors.hero.spells.beamingray.desc=牧師引導力量將盟友化成一束照射到某處的光。如果光照射到敵人上，將會於附近放置盟友並安排他們攻擊敵人。\n\n光線最遠能照射到%1$d格外，並將在10回合內增加對4格內最近敵人的衆人之力傷害加成至+%2$d%%。 光線甚至能傳送通常不可移動的盟友，但在這些情況下其範圍減半。
actors.hero.spells.beamingray$beamingrayboost.name=呼神護衛
actors.hero.spells.beamingray$beamingrayboost.desc=這位盟友剛被呼神護衛的光束傳送，因此對最靠近的敵人有攻擊力加成。生效期間衆人之力的效果也不會消失。\n\n效果剩餘:%s回合。

actors.hero.spells.blessspell.name=祝福術
actors.hero.spells.blessspell.short_desc=使自己獲得護盾或治療他人。
actors.hero.spells.blessspell.desc=牧師可為自己或可視範圍所見的其他單位降福。\n\n降福對象為自己時效果遭到弱化，僅讓自己獲得%1$d回合祝福與%2$d護盾。\n\n為其它單位降福時效果會更加強大，讓受福者得到%3$d回合祝福並回復%4$d生命。多餘的回復效果會轉為護盾。

actors.hero.spells.bodyform.name=自身本質
actors.hero.spells.bodyform.short_desc=選擇三位一體的本體型態。
actors.hero.spells.bodyform.desc=此局遊戲中鑑定過的裝備上，帶有的附魔或刻印，牧師都可以選擇，把同種魔力灌入到本體位格中。\n\n使用三位一體時，牧師的護甲或武器上就會多出選中的附魔或刻印，維持%d回合。裝備上原有的附魔或刻印不會被覆蓋。\n\n此法術會取代三位一體先前灌入的本體位格。
actors.hero.spells.bodyform$bodyformbuff.name=展現本性
actors.hero.spells.bodyform$bodyformbuff.desc=你的本體位格法術正讓你身上的裝備多出額外的附魔或刻印效果。\n\n此法術無法複製身上裝備原有的效果。\n\n目前的效果:%1$s。\n\n效果剩餘:%2$s回合。

actors.hero.spells.cleanse.name=淨化術
actors.hero.spells.cleanse.short_desc=淨化負面效果並獲得護盾。
actors.hero.spells.cleanse.desc=牧師清除自己與盟友所受的負面效果。受淨化者還會得到%2$d點護盾，並免疫負面效果%1$d回合。

actors.hero.spells.clericspell.prompt=選擇一個目標
actors.hero.spells.clericspell.no_target=那裡沒有目標。
actors.hero.spells.clericspell.invalid_target=你無法以那個位置為目標。
actors.hero.spells.clericspell.invalid_enemy=你無法以那個敵人為目標。
actors.hero.spells.clericspell.charge_cost=充能消耗:%d

actors.hero.spells.divinesense.name=神聖感知
actors.hero.spells.divinesense.short_desc=短時間內獲得大範圍靈視。
actors.hero.spells.divinesense.desc=牧師聚精會神，感受敵人的氣息，得以靈視%d格內的敵人50回合。施放此法術不耗時間。
actors.hero.spells.divinesense$divinesensetracker.name=神聖感知
actors.hero.spells.divinesense$divinesensetracker.desc=此單位暫時能用心靈感知附近的生物。\n\n效果剩餘:%s回合。

actors.hero.spells.divineintervention.name=神力干預
actors.hero.spells.divineintervention.short_desc=大幅提升牧師與盟友的護盾。
actors.hero.spells.divineintervention.desc=牧師將大股能量從聖典引進自己與盟友的身軀，提升護盾至%1$d點，並且讓自己多神聖%2$d回合。此法術具有強大的防御能力，但也會消耗大筆能量。\n\n此法術給予的護盾不會自然消退，但會在神聖化結束時立即消失，與神聖化的其他能力相同。

actors.hero.spells.flash.name=閃現
actors.hero.spells.flash.prompt=選擇一個位置
actors.hero.spells.flash.short_desc=傳送至一個附近的位置。
actors.hero.spells.flash.desc=牧師利用神聖力量將自己傳送到附近的位置。牧師可用光明閃身將自己傳送到之前見過，空曠，且在範圍內的位置。在同一次神聖化生效期間，每次使用光明閃身，能量需求會遞增。

actors.hero.spells.guidinglight.name=神導明光
actors.hero.spells.guidinglight.short_desc=造成魔法傷害並穩定下次攻擊。
actors.hero.spells.guidinglight.desc=牧師利用光明魔彈攻擊目標，造成2~8點傷害並將其點亮。點亮的敵人對於下次力量值符合的物理攻擊無法閃避。
actors.hero.spells.guidinglight.desc_priest=_祭司施放此法術時，力量會更加強大。_每50回合，牧師能不耗聖典充能，施放此法術一次。此外，聖明光輝法術、法杖、其他角色，以及直接影響敵人的神器，都能對發光的敵人造成牧師等級+5的魔法傷害。
actors.hero.spells.guidinglight$guidinglightpriestcooldown.name=神導明光
actors.hero.spells.guidinglight$guidinglightpriestcooldown.desc=祭司能在50回合後不耗充能再施放神導明光一次。\n\n冷卻剩餘: %s回合。
actors.hero.spells.guidinglight$illuminated.name=發光
actors.hero.spells.guidinglight$illuminated.desc=這位單位被神導明光擊中，因此全身發出微光。此點光明無法照亮周遭，但會使牧師更容易擊中該單位。
actors.hero.spells.guidinglight$illuminated.desc_priest=祭司還能用聖明光輝法術、法杖、同伴的攻擊，與某些神器的效果，對發光的敵人迼成英雄等級+5的傷害，但同樣會解除發光效果。
actors.hero.spells.guidinglight$illuminated.desc_generic=其它英雄仍可利用炙熱之光天賦對敵人造成額外傷害，但無法獲得精準度加成。

actors.hero.spells.hallowedground.name=神聖領域
actors.hero.spells.hallowedground.prompt=選擇一個位置
actors.hero.spells.hallowedground.short_desc=在範圍內提升己方耐力、減慢敵方速度並使草叢生長。
actors.hero.spells.hallowedground.desc=祭司將意念集中在周遭的地面，創造出占地%1$dx%1$d的神聖領域，維持20回合。\n\n施法時，所有盟友恢復15生命(滿血的盟友與祭司本人則得到護盾)，暫時束縛敵人，地面上也會蔓延出短草。\n\n身在聖域的盟友每回合恢復1生命(滿血的盟友與祭司本人則得到護盾);身在聖域內的敵人則受殘疾。神聖領域內也會隨機茂出高草。\n\n火會毀掉聖域。若祭司有一段時間沒有得到經驗，或者目前祭司無法自然回血，聖域內就只會茂出枯草。
actors.hero.spells.hallowedground$hallowedterrain.desc=此地已化為神聖領域。聖域減速敵人，治療盟友，並使植被蔓延。

actors.hero.spells.holyintuition.name=穢物探測
actors.hero.spells.holyintuition.prompt=探測一件物品
actors.hero.spells.holyintuition.cursed=你能感覺到這件物品裡潛伏著一股充滿惡意的魔力。
actors.hero.spells.holyintuition.uncursed=這件物品沒有被詛咒。
actors.hero.spells.holyintuition.short_desc=確認物品是否詛咒。
actors.hero.spells.holyintuition.desc=牧師專注於感知物品上的邪氣，得以判定物品是否有受詛咒，而不必裝備此物品。

actors.hero.spells.holylance.name=聖光長矛
actors.hero.spells.holylance.short_desc=造成極為強大的遠程魔法傷害。
actors.hero.spells.holylance.desc=祭司將聖典大股能量集中到光製的長矛上。此投矛攻擊力為%1$d~%2$d，對不死族與惡魔則必定造成最大傷害。\n\n此法術耗能高，並且有30回合的冷卻時間。
actors.hero.spells.holylance$lancecooldown.name=聖光長矛冷卻
actors.hero.spells.holylance$lancecooldown.desc=祭司最近施放了聖光長矛，因此需等待一段時間後才能再次施放。\n\n冷卻剩餘:%s回合。

actors.hero.spells.holyward.name=神聖護甲
actors.hero.spells.holyward.glyph_name=光明%s
actors.hero.spells.holyward.glyph_desc=此刻印小幅增加護甲可抵擋的傷害。
actors.hero.spells.holyward.short_desc=臨時性的覆蓋原刻印以提升防禦。
actors.hero.spells.holyward.desc=牧師賦予身上的護甲光明刻印，使其可多抵擋1點傷害。施放此法術不耗時間。\n\n此刻印維持50回合，期間護甲原有的刻印無法發恢揮作用。牧師未著裝時也能受益。
actors.hero.spells.holyward.desc_paladin=_聖騎士施放此法術時，力量會更加強大。_額外防禦將增加至3點且不再覆蓋原刻印，生效期間每使用一點聖典充能將多生效10回合，封頂值為100回合。
actors.hero.spells.holyward$holyarmbuff.name=神聖護甲
actors.hero.spells.holyward$holyarmbuff.desc=牧師已將神聖力量灌注到身著的護甲內，暫時抑制原有的刻印效果，並使護甲能多抵擋1點傷害。\n\n效果剩餘:%s回合。
actors.hero.spells.holyward$holyarmbuff.desc_paladin=聖騎士已將神力注入身著的護甲內，使其可多抵擋3點傷害。\n\n若在神聖護甲生效期間，施放其他法術，則每點消耗的聖典能量，會延長此法術生效期10回合。\n\n效果剩餘:%s回合。

actors.hero.spells.holyweapon.name=神聖武器
actors.hero.spells.holyweapon.ench_name=神聖%s
actors.hero.spells.holyweapon.ench_desc=被神聖武器擊中的敵人會受到額外的魔法傷害。
actors.hero.spells.holyweapon.short_desc=臨時性的覆蓋原附魔以施加特殊的額外傷害。
actors.hero.spells.holyweapon.desc=牧師賦予使用的武器神聖附魔，使其在命中時先造成2點魔法傷害。施放此法術不耗時間。\n\n此附魔維持50回合，期間武器原有的附魔無法發揮作用。牧師使用拳擊時也能受益。
actors.hero.spells.holyweapon.desc_paladin=_聖騎士施放此法術時，力量會更加強大。_額外傷害將增加至6點且不再覆蓋原附魔，生效期間每使用一點聖典充能將多生效10回合，封頂值為100回合。
actors.hero.spells.holyweapon$holywepbuff.name=神聖武器
actors.hero.spells.holyweapon$holywepbuff.desc=牧師將神聖力量引入武器內，使武器的攻擊力+2，但會暫時抑制原有的武器附魔。\n\n效果剩餘:%s回合。
actors.hero.spells.holyweapon$holywepbuff.desc_paladin=聖騎士將神聖力量引入手持的武器中，使其多出額外6點魔法傷害。\n\n此法術生效期間，施放其他法術所耗的每一點能量都能使此法術生效期延長10回合。\n\n效果剩餘:%s回合。

actors.hero.spells.judgement.name=終末天譴
actors.hero.spells.judgement.short_desc=對可視範圍內的所有敵人造成傷害。
actors.hero.spells.judgement.desc=牧師手拳裂地，聖光從縫中閃矅而出，炙燒可視範圍內的敵人，造成%1$d~%2$d點基礎傷害。此外，牧師在此次神聖化期間，或者自從上次牧師使出終末天啟時，所施的每一次法，都會使此法術的傷害+33%%。\n\n目前終末天啟的攻擊力為%3$d~%4$d。

actors.hero.spells.layonhands.name=神聖之觸
actors.hero.spells.layonhands.short_desc=立即治療相鄰的單位，或給予聖騎士護盾。
actors.hero.spells.layonhands.desc=神聖力量流入聖騎士的雙手，使其具有治療或保護的效果。\n\n聖騎士可對相鄰的角色施法，恢復該角色%1$d點生命，剩餘的治療效果則轉化為護盾。聖騎士也可對自己施法，給予自己%1$d護盾。\n\n施放此法術不耗時間，並可重復施法。然而，在一瞬間施法，所給予的護盾，不會超過三次施法所能給予的量。

actors.hero.spells.lifelinkspell.name=生命聯結
actors.hero.spells.lifelinkspell.short_desc=減緩並與盟友分散傷害。
actors.hero.spells.lifelinkspell.desc=牧師強化自己與強化盟友之間的連結。在此連結%1$d回合生效期間，衆人之力的減傷提升至-%2$d%%，但任何角色所受到的傷害，由兩方共同承擔。衆人之力的減傷效果，在傷害分配完後，才會生效。\n\n此連結有效時，不超過三階，且具正面效果的法術，皆會對兩位角色生效。
actors.hero.spells.lifelinkspell$lifelinkspellbuff.name=血色羈絆
actors.hero.spells.lifelinkspell$lifelinkspellbuff.desc=牧師與此盟友間有生命連結。\n\n除了生命連結原有的好處之外，此角色得到傷害減免。若牧師施放帶正面效果的法術，則該法術也會對此盟友生效。生命連結期間，衆人之力不會失效。\n\n效果剩餘:%s回合。

actors.hero.spells.mindform.name=心之所向
actors.hero.spells.mindform.short_desc=選擇三位一體的心靈型態。
actors.hero.spells.mindform.desc=此局遊戲中鑑定過的投擲武器及法杖，牧師都可以選擇，把同種魔力灌入到心靈位格中。\n\n使用三位一體時，牧師能以+%d投射出一次選擇的物品。投射出的東西就跟原本應有的效果相同。\n\n此法術會取代三位一體先前灌入的意念位格。

actors.hero.spells.mnemonicprayer.name=祈禱詩篇
actors.hero.spells.mnemonicprayer.short_desc=延長盟友／敵人身上，所具有的正／負面效果，並再次點亮敵人。
actors.hero.spells.mnemonicprayer.desc=牧師誦念出經文，使目標盟友或牧師本人的正面效果，或者目標敵人的負面效果，延長%1$d回合。施放此法術不耗時間。\n\n對於一種正或負面效果，此法術只能延長生效期一次。祈禱詩篇亦不能延長護甲能力所帶來的效果。

actors.hero.spells.radiance.name=聖明光輝
actors.hero.spells.radiance.short_desc=麻痺並點亮可視範圍內的敵人。
actors.hero.spells.radiance.desc=祭司全身蹦出強光，且麻痹所見敵人3回合。如果敵人正在發光，此法術會觸發光明的額外傷害，並再次點亮該敵人。如果當層樓光照不佳，此法術也會使祭司獲得100回合的光明。

actors.hero.spells.recallinscription.name=符咒召回
actors.hero.spells.recallinscription.short_desc=重複最近使用的符石或卷軸效果。
actors.hero.spells.recallinscription.desc=牧師能用聖典的魔力，複製%s回合內用過的卷軸與符石所具的效果。\n\n此法術無法複製升級卷軸的效果，施法所耗的能量也隨複製的物品而變化:符石2點，卷軸3點，祕卷4點。複製轉化、升級卷軸製成的祕卷與符石，以及轉化卷軸本身，耗能會再加倍。
actors.hero.spells.recallinscription$useditemtracker.name=近期已使用符咒
actors.hero.spells.recallinscription$useditemtracker.desc=牧師最近用了一項可被符咒召回模仿的法術。牧師可施法再次觸發此物品的效果。\n\n可模仿的物品:%1$s。\n\n有效時長:%2$s回合。

actors.hero.spells.shieldoflight.name=光明屏障
actors.hero.spells.shieldoflight.short_desc=使自己獲得對於單一目標的臨時額外防護。
actors.hero.spells.shieldoflight.desc=牧師身上的光型成了一道屏障，使牧師在5回合內，對特定一位敵人的防禦力增加%1$d~%2$d點。\n\n施放此法術不耗時間，但無法同時對多個目標使用。
actors.hero.spells.shieldoflight$shieldoflighttracker.name=光明屏障
actors.hero.spells.shieldoflight$shieldoflighttracker.desc=牧師與這位敵人之間出現了一道屏障。屏障的防禦力能減輕敵人的傷害，但無法完全抵擋攻擊。\n\n效果剩餘:%s回合。

actors.hero.spells.spiritform.name=明曉真我
actors.hero.spells.spiritform.short_desc=選擇三位一體的精神型態。
actors.hero.spells.spiritform.desc=此局遊戲中除聖典外所有鑑定過的戒指及神器，牧師都可以選擇，把同種魔力灌入到精神位格中。\n\n對於戒指，牧師能獲得+%1$d的戒指效果20回合。\n\n對於神器，牧師將以+%2$d的神器為基準觸發某種效果。這種效果對於每種神器都有不同的充能消耗。\n\n此法術會取代三位一體先前灌入的精神位格。
actors.hero.spells.spiritform$spiritformbuff.name=悟性激發
actors.hero.spells.spiritform$spiritformbuff.desc=你的精神位格法術正讓你受到某物品的力量加持，就像你裝備了它一樣。\n\n此法術無法複製身上裝備原有的效果。\n\n目前的效果:%1$s。\n\n效果剩餘:%2$s回合。

actors.hero.spells.smite.name=神力斬擊
actors.hero.spells.smite.short_desc=具額外傷害、附魔威力，且必定命中的一次斬擊。
actors.hero.spells.smite.desc=聖騎士將正義之力與近戰攻擊融合，形成強大的破壞力。\n\n神力斬擊具+300%%附魔威力，並在原有的傷害上，外加%1$d~%2$d點魔法傷害。若滿足武器力量要求，此斬擊必能命中。\n\n此斬擊的魔法傷害隨聖騎士的等級增長，且對不死族與惡魔必定造成最大傷害。

actors.hero.spells.stasis.name=星界投射
actors.hero.spells.stasis.short_desc=將盟友移出地下城並加以保留。
actors.hero.spells.stasis.desc=牧師專注於他們與盟友間的連係，並將盟友化為能量，暫存在自己體內，最久%d回合。在此期間，盟友具有的正面效果不會受到影響。\n\n星界投射結束後，盟友會再從能量轉化為質量，出現在牧師的身旁。牧師也能在效果期間，不耗法典能量，再次施展此法術，以立即呼出盟友。此法術也能用來運送平時不移動的盟友，但不能在樓層間運送。
actors.hero.spells.stasis$stasisbuff.name=星界投射
actors.hero.spells.stasis$stasisbuff.left_behind=你沒能留住無法移動的盟友。
actors.hero.spells.stasis$stasisbuff.desc=牧師目前身存盟友化作的能量。包含衆人之力在內，此位盟友所受的正面效果皆不受影響。在星界投射結束之後，該盟友會出現在牧師的身旁。再施放星界投射一次能提早終止此效果。\n\n身存的盟友:%1$s。\n效果剩餘:%2$s回合。

actors.hero.spells.sunray.name=豔陽光束
actors.hero.spells.sunray.short_desc=造成遠程魔法傷害，並在首次攻擊致盲目標。
actors.hero.spells.sunray.desc=牧師從手中發出一道光束，使目標失明%3$d回合，並造成%1$d~%2$d點魔法傷害。若目標為不死族或惡魔，豔陽光束必造成最大傷害。\n\n敵人受擊後，視覺會重新調整，再次受擊後也不再失明。但是，若敵人因此法術而失明時，再遭此法術攻擊，就會被強光麻痹在原地。

actors.hero.spells.walloflight.name=硬光牆
actors.hero.spells.walloflight.short_desc=創造一種可視範圍能穿透的牆壁。
actors.hero.spells.walloflight.desc=聖騎士將強光發散為一道1格厚，%1$d格寛的光牆，維持20回合。\n\n這座牆與一般的牆大致相同，但是不阻擋可視範圍。在樹立光牆時且有空位時，卡在牆上的敵人會被向後推，並遭短暫眩暈。在牆上的角色能向牆的兩側移動。\n\n牆擺放的方向限於八方。有光牆聳立時，聖騎士可不耗能，再次施法把牆撤下。
actors.hero.spells.walloflight.early_end=你驅散了這面硬光牆。
actors.hero.spells.walloflight$lightwall.desc=硬光牆阻擋了此處的通路。

##main hero
actors.hero.hero.name=你
actors.hero.hero.leave=你還不能離開，尚未探索的地城秘境正呼喚著你!
actors.hero.hero.level_up=升級!
actors.hero.hero.new_level=升級! +準確度、+閃避率、+5 最大生命值!
actors.hero.hero.new_talent=+1 天賦點!
actors.hero.hero.unspent=你有未使用的天賦點!
actors.hero.hero.level_cap=你不能變得更強了，不過你的經驗給了你一股力量!
actors.hero.hero.you_now_have=你獲得了:%s。
actors.hero.hero.you_cant_have=你無法攜帶:%s。
actors.hero.hero.locked_chest=箱子鎖著而你沒有對應的鑰匙。
actors.hero.hero.locked_door=你沒有對應的鑰匙。
actors.hero.hero.noticed_smth=你注意到了些什麼。
actors.hero.hero.wait=...
actors.hero.hero.search=搜尋
actors.hero.hero.search_distracted=你沒辦法集中精力，探索周邊變得異常費力。
actors.hero.hero.key_distracted=你沒能解開這道鎖，必須再多試幾次。
actors.hero.hero.pain_resist=疼痛使你難以入睡。
actors.hero.hero.revive=重生十字架並裂出蘇生的能量!

##classes
actors.hero.heroclass.warrior=戰士
actors.hero.heroclass.warrior_desc_short=戰士的_破損紋章_可生成護盾減免傷害。紋章也可以護甲間轉移，並可以_轉移一級升級_。
actors.hero.heroclass.warrior_desc=戰士的獨特物品為一枚會在生命值剩下半數時生成護盾減免傷害的_破損紋章_。紋章可以在護甲間轉移，同時_攜帶一級升級_。\n\n其他的初始物品包括_破損的短劍_、_三塊石子_、布甲、水袋及絨布包。\n\n戰士在初始已識得:\n_-_鑑定卷軸\n_-_治療藥劑\n_-_盛怒卷軸
actors.hero.heroclass.warrior_unlock=戰士開局即被解鎖。

actors.hero.heroclass.mage=法師
actors.hero.heroclass.mage_desc_short=法師是位奧術專家，開局持有一根強於法杖的_魔杖_。魔杖可以灌注法師找到的_任何法杖_。
actors.hero.heroclass.mage_desc=法師的獨特物品為一根充能速度更快且最大充能比法杖高1的_魔杖_。這根魔杖可以灌注法師在地下城中找到的_任何法杖_。\n\n其他的初始物品包括已灌注於魔杖中的_魔彈法杖_、布甲、水袋及絨布包。\n\n法師在初始已識得:\n_-_鑑定卷軸\n_-_液火藥劑\n_-_升級卷軸
actors.hero.heroclass.mage_unlock=欲解鎖法師，請_使用升級卷軸強化任意物品。_

actors.hero.heroclass.rogue=盜賊
actors.hero.heroclass.rogue_desc_short=盜賊可以躲避敵人，並使用他的_暗影斗篷_ 從隱身處進行攻擊。他還能從更遠的距離_探測秘密及陷阱_。
actors.hero.heroclass.rogue_desc=盜賊的獨特物品為能使其隨時隱形的_暗影斗篷_。\n\n盜賊還能從更遠的距離_探測秘密及陷阱_。\n\n其他的初始物品包括_匕首_、布甲、水袋及絨布包。\n\n盜賊在初始已識得:\n_-_鑑定卷軸\n_-_隱形藥劑\n_-_探地卷軸
actors.hero.heroclass.rogue_unlock=欲解鎖盜賊，請_在一場遊戲中伏擊敵人10次_。

actors.hero.heroclass.huntress=獵人
actors.hero.heroclass.huntress_desc_short=獵人對於投擲武器特別拿手，並且持有一把能無限射擊的_靈能弓_。她也能夠穿梭在高草叢之中，不會將其踐踏為草地。
actors.hero.heroclass.huntress_desc=獵人的獨特物品為可以無限發射魔法箭矢的_靈能弓_。\n\n獵人可以在不踐踏草叢的情況下穿梭在高草叢之中。\n\n其它的初始物品包括_鑲釘手套_、布甲、水袋和絨布袋。\n\n獵人在初始已識得:\n_-_ 鑑定卷軸\n_-_ 靈視藥劑\n_-_ 催眠卷軸
actors.hero.heroclass.huntress_unlock=欲解鎖獵人，請_使用投擲武器命中敵人10次_。

actors.hero.heroclass.duelist=決鬥者
actors.hero.heroclass.duelist_desc_short=決鬥者是位武器大師，她能使用裝備的武器使出_根據裝備的武器而定的獨特武技_。
actors.hero.heroclass.duelist_desc=決鬥者能用不同種的武器，耗費自然恢復的能量，發動_獨特且絕對有效的武技_。\n\n她也能利用開局武器_刺劍_，發動獨門武技。\n\n其他的初始物品包括_兩條鐵刺_、布甲、水袋及絨布包。\n\n決鬥者在初始已識得:\n_-_ 鑑定卷軸\n_-_ 力量藥劑\n_-_ 分身卷軸
actors.hero.heroclass.duelist_unlock=欲解鎖決鬥者，請_在達到力量需求的情況下裝備一件2階以上的武器。_

actors.hero.heroclass.cleric=牧師
actors.hero.heroclass.cleric_desc_short=牧師是一位透過獨特的_神聖法典_來引導神聖的魔法的神聖施法者。這些法術會透過天賦_習得或強化。_
actors.hero.heroclass.cleric_desc=牧師的獨特物品為用以施展各種法術的_神聖法典_。\n\n牧師大部分的天賦皆用於習得或強化法術。\n\n其它的初始物品包括_權杖_、布甲、水袋及絨布包。\n\n牧師在初始已識得:\n_-_鑑定卷軸\n_-_淨化藥劑\n_-_祛邪卷軸
actors.hero.heroclass.cleric_unlock=欲解鎖牧師，請_完全淨化一件裝備的詛咒。_

actors.hero.herosubclass.berserker=狂戰士
actors.hero.herosubclass.berserker_short_desc=_狂戰士_在受到傷害的時候會積累怒氣，怒氣能提高狂戰士的攻擊力，並可在其達到100%時啟動以獲得額外護盾。
actors.hero.herosubclass.berserker_desc=狂戰士在受到物理傷害時會累積怒氣，就連被擋住的也算數!怒氣會隨時間消逝，但生命值越低就消失得越慢。\n\n狂戰士的怒氣能使他造成最高50%的傷害。在最高怒氣值下他將能以自己的意願狂暴化，這會提供他大量護盾，只要他還有護盾，他的怒氣就不會消失。護盾提供量基於狂戰士的護甲等級，且在生命值較低時會大幅提升。狂戰士狂暴結束後需要些時間來恢復。
actors.hero.herosubclass.gladiator=角鬥士
actors.hero.herosubclass.gladiator_short_desc=_角鬥士_在短時間命中對方越多次，就能根據連擊次數使用獨特的戰技。
actors.hero.herosubclass.gladiator_desc=角鬥士只要以近戰或遠程武器命中敵人，就能累積一點連擊數。但是在擊中敵人的五回合內，或在擊殺敵人的15回合內，沒有再次擊中敵人，連擊數就會重置。\n\n當連擊數累積到一定地步，他能在重置前能使用各種保證命中的戰技:\n2連擊(過肩摔):擊退敵人並累積連擊\n4連擊(衝撞):以防禦作為傷害攻擊\n6連擊(招架):格擋，反擊，累積連擊數\n8連擊(遁地):傷害目標及其附近敵人\n10連擊(暴揍):根據連擊數連續攻擊數次
actors.hero.herosubclass.battlemage=戰鬥法師
actors.hero.herosubclass.battlemage_short_desc=_戰鬥法師_用他的魔杖近戰時會附帶額外效果，這能力基於魔杖灌注的法杖種類。
actors.hero.herosubclass.battlemage_desc=每當戰鬥法師用他的魔杖進行近戰攻擊時，他都會獲得一種類似附的魔額外的效果。這些效果取決於他的法杖所灌注的魔杖，此外，戰鬥法師使用法杖進行近戰攻擊命中時也會獲得0.5充能。
actors.hero.herosubclass.warlock=術士
actors.hero.herosubclass.warlock_short_desc=_術士_能用法杖標記敵人的靈魂並用物理武器吸收對方的生命。
actors.hero.herosubclass.warlock_desc=當術士對目標使用法杖時，他有機會對其施加靈魂印記。施加靈魂標記的機率及其持續時間會根據法杖等級而提升。\n\n當敵人受到標記時，術士每對他們造成5點物理傷害就會使自身恢復2點生命值。
actors.hero.herosubclass.assassin=刺客
actors.hero.herosubclass.assassin_short_desc=_刺客_在隱形時能準備一次致命的攻擊，隱形的越久，該攻擊的威力就越強。
actors.hero.herosubclass.assassin_desc=刺客在隱身時為他的攻擊做了更充足的準備。準備得越久，下次攻擊就越強大。這在9回合後將完全準備充足。\n\n在他出手攻擊後，刺客的下次攻擊會使其傳送到目標附近、帶有額外傷害、並處決足夠虛弱的敵人。
actors.hero.herosubclass.freerunner=疾行者
actors.hero.herosubclass.freerunner_short_desc=_疾行者_在奔跑時累積動能，而動能可以讓他開始逸動，讓他擁有暫時的跑速與閃避加成。
actors.hero.herosubclass.freerunner_desc=疾行者每奔跑一回合就累積一點動能，最多累積10點。沒有在奔跑時，動能就會高速消散。疾行者可以用累積的動能來開始逸動。每點動能可供他逸動2回合。\n\n逸動時，疾行者有加倍跑速，閃避值也會跟據英雄等級獲得加成。逸動效果結束後，疾行者會有一段時間無法累積動能。
actors.hero.herosubclass.sniper=狙擊手
actors.hero.herosubclass.sniper_short_desc=_狙擊手_的遠程攻擊無視護甲，而且使用投擲武器後能再用靈能弓做出特殊攻擊。
actors.hero.herosubclass.sniper_desc=狙擊手為遠程戰鬥大師。她的遠程攻擊無視敵人護甲。用投擲武器擊中敵人後，敵人身上會留下記號，使狙擊手得以用靈能弓再作出特殊攻擊。此攻擊依弓的強化方式而有不同。\n\n未受強化符石強化的弓能不耗時間，射出威力較弱的箭矢。強化速度的弓能花一回合，射出多發威力較弱的箭矢，每一發都能觸發靈弓的附魔效果。強化威力的弓能花2回合，射出必定命中的箭矢，並造成額外傷害，其威力依敵人距離而定。
actors.hero.herosubclass.warden=守望者
actors.hero.herosubclass.warden_short_desc=_守望者_的可視範圍能穿透高草，當種植或踩踏植物時擁有額外效果。
actors.hero.herosubclass.warden_desc=守望者與自然有強大的聯結，這使她可以視穿高草與枯草，並且能在與植物與草互動時，得到額外的正面效果。\n\n守望者在播下或丟出種子之後，草會在新生的植物的周圍茂出。在她踩踏植物時，所觸發的效果有所變化，且皆無負面效果。
actors.hero.herosubclass.champion=勇士
actors.hero.herosubclass.champion_short_desc=_勇士_能雙持武器並獲得更多武技充能。她雖然只有主要武器能用於普通攻擊，但能隨時更換雙持的武器並使用兩者的武技。
actors.hero.herosubclass.champion_desc=勇士善於雙手運用近戰武器。她可以額外多拿一把武器作為副武器，並能使用任一武器施展其武技，並能不耗時間切換主副武器，但仍只用主武器攻擊。\n\n她武技的恢復速率+50%，最高充能+2。
actors.hero.herosubclass.monk=武道者
actors.hero.herosubclass.monk_short_desc=_武道者_在擊敗敵人時積累內力，並能被消耗用以施放多樣性的獨特能力。
actors.hero.herosubclass.monk_desc=武道者是武功高手。她會打倒敵人以獲得內力。而內力可以施展用來防身或輔助戰鬥的武術。內力不隨時間消散，但有上限，隨英雄等級提高。\n\n1點內力(亂拳):出拳打擊兩次\n2點內力(凝神):凝神準備招架攻擊\n3點內力(凌雲步):閃身至週遭\n4點內力(神龍擺尾):踼開敵人\n5點內力(冥思):運力恢復狀態與法杖及神器充能
actors.hero.herosubclass.priest=祭司
actors.hero.herosubclass.priest_short_desc=_祭司_專攻遠程法術，並能使神導明光更容易施放並擁有新用處。
actors.hero.herosubclass.priest_desc=祭司得到與加強的法術，可以有效進行遠程攻擊，並能與魔法道具相輔相成。\n\n祭司每50回合，可不耗能施放_神導明光_一次，並能用盟友、法杖的攻擊，以及直接影響敵人的神器，消耗點明效果，並對造成魔法傷害，威力等同於祭司等級+5。\n\n祭司也學到新法術_聖明光輝_:消耗聖典充能2點，觸發點亮的效果，再點亮並短暫麻痹可見的敵人，並祛除黑暗。
actors.hero.herosubclass.paladin=聖騎士
actors.hero.herosubclass.paladin_short_desc=_聖騎士_專司於近戰法術，並能更有效的使用神聖武器及護甲。
actors.hero.herosubclass.paladin_desc=聖騎士得到與加強的法術，可以有效輔助近戰，並能與護甲和武器相輔相成。\n\n_神聖武器_的攻擊力，以及_神聖護甲_的防禦力，得到了強化，並且不再覆蓋裝備上，原有的附魔或刻印。\n\n聖騎士也學到新法術_神力斬擊_:消耗聖典充能2點，斬擊一位目標，具額外附魔效果與傷害，且必定命中。

##talents
actors.hero.talent$provokedangertracker.name=受釁怒火
actors.hero.talent$provokedangertracker.desc=戰士失去了所有的護盾，他的下次物理攻擊將帶有額外傷害。\n\n有效時長:%s回合。
actors.hero.talent$lingeringmagictracker.name=魔能餘勢
actors.hero.talent$lingeringmagictracker.desc=法師剛使用了他的法杖，他的下次物理攻擊將帶有額外傷害。\n\n有效時長:%s回合。
actors.hero.talent$followupstriketracker.name=追加一擊
actors.hero.talent$followupstriketracker.desc=獵人剛以遠程攻擊命中敵人，她下次對於該敵人的近戰攻擊將帶有額外傷害。\n\n有效時長:%s回合。
actors.hero.talent$patientstriketracker.name=沉穩一擊
actors.hero.talent$patientstriketracker.desc=決鬥者剛等待了一回合，她下回合的近戰攻擊將帶有額外傷害。
actors.hero.talent$improvisedprojectilecooldown.name=率性投擲冷卻
actors.hero.talent$improvisedprojectilecooldown.desc=你剛發動這個天賦，你必須等待才能再次發動。\n\n冷卻剩餘:%s回合。
actors.hero.talent$rejuvenatingstepscooldown.name=回春步伐冷卻
actors.hero.talent$rejuvenatingstepscooldown.desc=你剛發動這個天賦，你必須等待才能再次發動。\n\n冷卻剩餘:%s回合。
actors.hero.talent$seershotcooldown.name=靈矢感知冷卻
actors.hero.talent$seershotcooldown.desc=你剛發動這個天賦，你必須等待才能再次發動。\n\n冷卻剩餘:%s回合。
actors.hero.talent$aggressivebarriercooldown.name=無畏屏障冷卻
actors.hero.talent$aggressivebarriercooldown.desc=你剛發動這個天賦，你必須等待才能再次發動。\n\n冷卻剩餘:%s回合。
actors.hero.talent$liquidagilacctracker.name=液蘊機敏
actors.hero.talent$liquidagilacctracker.desc=決鬥者下一次的普通近戰將擁有額外精準度。\n\n有效時長:%s回合。
actors.hero.talent$lethalhastecooldown.name=取命餘力冷卻
actors.hero.talent$lethalhastecooldown.desc=你剛發動這個天賦，你必須等待才能再次發動。\n\n冷卻剩餘:%s回合。
actors.hero.talent$swiftequipcooldown.name=疾速配裝泠卻
actors.hero.talent$swiftequipcooldown.desc=你剛發動這個天賦，你必須等待才能再次發動。\n\n冷卻剩餘:%s回合。
actors.hero.talent$preciseassaulttracker.name=精準打擊
actors.hero.talent$preciseassaulttracker.desc=決鬥者下一次的普通近戰將擁有額外精準度。\n\n有效時長:%s回合。
actors.hero.talent$deadlyfollowuptracker.name=奪命追擊
actors.hero.talent$deadlyfollowuptracker.desc=決鬥者剛以投擲武器命中敵人，她下次對於該敵人的近戰攻擊將帶有額外傷害。\n\n有效時長:%s回合。
actors.hero.talent$combinedlethalityabilitytracker.executed=處決
actors.hero.talent$satiatedspellstracker.name=額外護盾術
actors.hero.talent$satiatedspellstracker.desc=牧師下一次的施法將為其提供少量護盾。
actors.hero.talent$searinglightcooldown.name=灼熱強光
actors.hero.talent$searinglightcooldown.desc=你剛發動這個天賦，你必須等待才能再次發動。\n\n冷卻剩餘:%s回合。

#warrior
actors.hero.talent.hearty_meal.title=補氣膳食
actors.hero.talent.hearty_meal.desc=_+1:_英雄在生命值低於33%的時候進食會恢復_4點生命_。\n\n_+2:_英雄在生命值低於33%的時候進食會恢復_6點生命_。
actors.hero.talent.veterans_intuition.title=老兵常識
actors.hero.talent.veterans_intuition.desc=_+1:_武器鑑定速度提升_1.75倍_，而護甲提升_2.5倍_。\n\n_+2:_武器鑑定速度提升_2.5倍_，而護甲在_裝備時_立刻鑑定。
actors.hero.talent.provoked_anger.title=受釁怒火
actors.hero.talent.provoked_anger.desc=_+1:_當英雄的護盾增益被攻擊消除時，他的下次物理攻擊傷害_額外增加3點_。\n\n_+2:_當英雄的護盾增益被攻擊消除時，他的下次物理攻擊傷害_額外增加5點_。
actors.hero.talent.iron_will.title=鋼鐵意志
actors.hero.talent.iron_will.desc=_+1:_戰士的紋章提供的護盾量_增加1點_。\n\n_+2:_戰士的紋章提供的護盾量_增加2點_。
actors.hero.talent.iron_will.meta_desc=_如果其他英雄獲得此天賦_，該天賦會將其他英雄視為已貼上初始護盾提供量為0的破損紋章。

actors.hero.talent.iron_stomach.title=鐵鑄腸胃
actors.hero.talent.iron_stomach.desc=_+1:_英雄進食只需一回合(食用可快速食用的食物不耗回合)，進食過程擁有_75%傷害減免_。\n\n_+2:_英雄進食只需一回合(食用可快速食用的食物不耗回合)，進食過程擁有_100%傷害減免_。
actors.hero.talent.liquid_willpower.title=液使志鋼
actors.hero.talent.liquid_willpower.desc=_+1:_當戰士使用藥水時，他會獲得_最大生命值6.5%的護盾量_的護盾值。\n\n_+2:_當戰士使用藥水時，他會獲得_最大生命值10%的護盾量_的護盾值。\n\n如果使用的為力量、經驗藥劑或其製品，獲得的護盾量會加倍。\n\n至於使用多產量的物品(像是水爆魔藥)，此天賦會根據一次的產量來決定觸發機率。
actors.hero.talent.runic_transference.title=紋章刻印
actors.hero.talent.runic_transference.desc=_+1:_戰士的破損紋章可以攜帶_常見刻印_。\n\n_+2:_戰士的破損紋章可攜帶_常見、稀有刻印，以及詛咒效果_。\n\n在護甲附上紋章後，再施加刻印效果，紋章才能攜帶刻印。
actors.hero.talent.runic_transference.meta_desc=_如果其他英雄獲得此天賦_，此天賦將改為提升刻印會破壞的最低等級。原先為4級、+1為6級、+2為7級。而8級時仍必定消除。
actors.hero.talent.lethal_momentum.title=手起刀落
actors.hero.talent.lethal_momentum.desc=_+1:_英雄利用物理武器攻擊敵人時，致死的一擊有_67%_機率不耗時間。\n\n_+2:_英雄利用物理武器攻擊敵人時，致死的一擊_必定_不耗時間。
actors.hero.talent.improvised_projectiles.title=率性投擲
actors.hero.talent.improvised_projectiles.desc=_+1:_每_50回合_，戰士能向敵人丟出投擲武器以外的物品，以致盲該敵人_2回合_。\n\n_+2:_每_50回合_，戰士能向敵人丟出投擲武器以外的物品，以致盲該敵人_3回合_。

actors.hero.talent.hold_fast.title=不動如山
actors.hero.talent.hold_fast.desc=_+1:_英雄在原地等待之後，得到_1~2 護甲_，並將連擊與護盾的消散速度減低_50%_。該護甲在英雄移動後消失。\n\n_+2:_英雄在原地等待之後，得到_2~4 護甲_。並將連擊與護盾的消散速度減低_75%_。該護甲在英雄移動後消失。\n\n_+3:_英雄在原地等待之後，得到_3~6護甲_。並將連擊與護盾的消散_暫停_。該護甲在英雄移動後消失。
actors.hero.talent.strongman.title=力大無窮
actors.hero.talent.strongman.desc=_+1:_英雄的力量_增加8%_，向下取整。\n\n_+2:_英雄的力量_增加13%_，向下取整。\n\n_+3:_英雄的力量_增加18%_，向下取整。

actors.hero.talent.endless_rage.title=無盡狂怒
actors.hero.talent.endless_rage.desc=_+1:_狂戰士的怒氣上限提升至_116%_。\n\n_+2:_狂戰士的怒氣上限提升至_133%_。\n\n_+3:_狂戰士的怒氣上限提升至_150%_。\n\n超過100%恕氣後，每1%怒氣提升1%護盾，並使狂暴泠卻時間減少1%，但傷害提升效果不會超過50%。
actors.hero.talent.deathless_fury.title=氣焰不斷
actors.hero.talent.deathless_fury.desc=_+1:_狂戰士承受致命一擊時，如果具有100%以上的怒氣，則自動進入狂暴化。觸發之後，_英雄須升級3次_，才能再次觸發此效果。\n\n_+2:_狂戰士承受致命一擊時，如果具有100%以上的怒氣，則自動進入狂暴化。觸發之後，_英雄須升級2次_，才能再次觸發此效果。\n\n_+3:_狂戰士承受致命一擊時，如果具有100%以上的怒氣，則自動進入狂暴化。觸發之後，_英雄須升級1次_，才能再次觸發此效果。\n\n狂暴結束後，若狂戰士仍只有0生命，則立即死亡。\n\n譯注:此天賦效果優先於重生十字架。
actors.hero.talent.enraged_catalyst.title=怒氣激法
actors.hero.talent.enraged_catalyst.desc=_+1:_狂戰士有越多怒氣，手上武器的附魔與詛咒效果，就越容易觸發。在100%怒氣時，有最高加成_15%_。\n\n_+2:_狂戰士有越多怒氣，手上武器的附魔與詛咒效果，就越容易觸發。在100%怒氣時，有最高加成_30%_。\n\n_+3:_狂戰士有越多怒氣，手上武器的附魔與詛咒效果，就越容易觸發。在100%怒氣時，有最高加成_45%_。

actors.hero.talent.cleave.title=氣勢不散
actors.hero.talent.cleave.desc=_+1:_當角鬥士擊殺敵人，連擊維持的有效期間從15回合延長至_30回合_。\n\n_+2:_當角鬥士擊殺敵人，連擊維持的有效期間從15回合延長至_45回合_。\n\n_+3:_當角鬥士擊殺敵人，連擊維持的有效期間從15回合延長至_60回合_。
actors.hero.talent.lethal_defense.title=攻防並濟
actors.hero.talent.lethal_defense.desc=_+1:_角鬥士以戰技擊殺敵人會使紋章效果冷卻_減少50回合_。\n\n_+2:_角鬥士以戰技擊殺敵人會使紋章效果冷卻_減少100回合_。\n\n_+3:_角鬥士以戰技擊殺敵人會使紋章效果冷卻_減少150回合_。\n\n紋章冷卻時長如果以此方式會降至0以下，使得下次護盾增益被觸發後的冷卻時間被減少。
actors.hero.talent.enhanced_combo.title=強力釋能
actors.hero.talent.enhanced_combo.desc=_+1:_當角鬥士的連擊數達到7後，過肩摔擊退距離增至3、附帶眩暈、還能把敵人打進深淵。\n\n_+2:_除+1的增益外，當角鬥士的連擊數達到9後，招架在一回合內對所有攻擊接生效。\n\n_+3:_除+1、+2的增益外，施放其它戰技前可先跳躍最多連擊數/3格以接近目標。

actors.hero.talent.body_slam.title=肉彈衝擊
actors.hero.talent.body_slam.desc=_+1:_戰士英雄之躍落地之後，身旁敵人受到傷害，威力為_1~4_點，再加上戰士護甲值的_25%_。\n\n_+2:_戰士英雄之躍落地之後，身旁的敵人受到傷害，威力為_2~8_點，再加上戰士護甲值的_50%_。\n\n_+3:_戰士英雄之躍落地之後，身旁的敵人受到傷害，威力為_3~12_點，再加上戰士護甲值的_75%_。\n\n_+4:_戰士英雄之躍落地之後，身旁的敵人受到傷害，威力為_4~16_點，再加上戰士護甲值的_100%_。
actors.hero.talent.impact_wave.title=英勇遁地
actors.hero.talent.impact_wave.desc=_+1:_戰士英雄之躍落地後，身旁的敵人遭擊退_2格_，並有_25%_機率受到5回合易傷。\n\n_+2:_戰士英雄之躍落地後，身旁的敵人遭擊退_3格_，並有_50%_機率受到5回合易傷。\n\n_+3:_戰士英雄之躍落地後，身旁的敵人遭擊退_4格_，並有_75%_機率受到5回合易傷。\n\n_+4:_戰士英雄之躍落地後，身旁的敵人遭擊退_5格_，且_必定_受到5回合易傷。
actors.hero.talent.double_jump.title=二段跳
actors.hero.talent.double_jump.desc=_+1:_戰士英勇之躍落地後，若3回合內再次起跳，則耗能減少_16%_。\n\n_+2:_戰士英勇之躍落地後，若3回合內再次起跳，則耗能減少_30%_。\n\n_+3:_戰士英勇之躍落地後，若3回合內再次起跳，則耗能減少_40%_。\n\n_+4:_戰士英勇之躍落地後，若3回合內再次起跳，則耗能減少_50%_。

actors.hero.talent.expanding_wave.title=廣域衝擊
actors.hero.talent.expanding_wave.desc=_+1:_震地衝擊範圍的半徑從5提升至_6_，角度從60度提升至_75度_。\n\n_+2:_震地衝擊範圍的半徑從5提升至_7_，角度從60度提升至_90度_。\n\n_+3:_震地衝擊範圍的半徑從5提升至_8_，角度從60度提升至_105度_。\n\n_+4:_震地衝擊範圍的半徑從5提升至_9_，角度從60度提升至_120度_。
actors.hero.talent.striking_wave.title=復合震波
actors.hero.talent.striking_wave.desc=_+1:_受到震地衝擊的角色，也有_30%機率_受到附魔與連擊等攻擊效果。\n\n_+2:_受到震地衝擊的角色，也有_60%機率_受到附魔與連擊等攻擊效果。\n\n_+3:_受到震地衝擊的角色，也有_90%機率_受到附魔與連擊等攻擊效果。\n\n_+4:_受到震地衝擊的角色，也_必定_受到附魔與連擊等攻擊效果，且附魔有_+20%威力_。
actors.hero.talent.shock_force.title=震撼衝擊
actors.hero.talent.shock_force.desc=_+1:_震地衝擊傷害_+20%_，並有_25%機率_麻痹敵人。\n\n_+2:_震地衝擊傷害_+40%_，並有_50%機率_麻痹敵人。\n\n_+3:_震地衝擊傷害_+60%_，並有_75%機率_麻痹敵人。\n\n_+4:_震地衝擊傷害_+80%_，並_必定_麻痹敵人。

actors.hero.talent.sustained_retribution.title=分次反擊
actors.hero.talent.sustained_retribution.desc=_+1:_戰士額外的傷害加成提升至_115%_，並分_2_次攻擊釋出。\n\n_+2:_戰士額外的傷害加成提升至_130%_，並分_3_次攻擊釋出。\n\n_+3:_戰士額外的傷害加成提升至_145%_，並分_4_次攻擊釋出。\n\n_+4:_戰士額外的傷害加成提升至_160%_，並分_5_次攻擊釋出。
actors.hero.talent.shrug_it_off.title=厚皮無痛
actors.hero.talent.shrug_it_off.desc=_+1:_苦痛堅忍的減傷由50%提升至_60%_。\n\n_+2:_苦痛堅忍的減傷由50%提升至_68%_。\n\n_+3:_苦痛堅忍的減傷由50%提升至_74%_。\n\n_+4:_苦痛堅忍的減傷由50%提升至_80%_。
actors.hero.talent.even_the_odds.title=雄力掃敵
actors.hero.talent.even_the_odds.desc=_+1:_苦痛堅忍結束時，在格內每有一位敵人，戰士的額外傷害就_+5%_。\n\n_+2:_苦痛堅忍結束時，在格內每有一位敵人，戰士的額外傷害就_+10%_。\n\n_+3:_苦痛堅忍結束時，在格內每有一位敵人，戰士的額外傷害就_+15%_。\n\n_+4:_苦痛堅忍結束時，在格內每有一位敵人，戰士的額外傷害就_+20%_。

#mage
actors.hero.talent.empowering_meal.title=食能強魔
actors.hero.talent.empowering_meal.desc=_+1:_英雄進食後，後3次法杖釋能攻擊，得到_2點額外傷害_。\n\n_+2:_英雄進食後，後3次法杖釋能攻擊，得到_3點額外傷害_。
actors.hero.talent.scholars_intuition.title=活用所學
actors.hero.talent.scholars_intuition.desc=_+1:_鑑定法杖速度提升_3倍_。\n\n_+2:_法杖將於_使用時_鑑定。
actors.hero.talent.lingering_magic.title=魔能餘勢
actors.hero.talent.lingering_magic.desc=_+1_:英雄用法杖或魔杖施法後，他的下次物理攻擊傷害_額外增加1~2點_。\n\n_+2_:英雄用法杖或魔杖施法後，他的下次物理攻擊傷害_額外增加2點_。
actors.hero.talent.backup_barrier.title=備用屏障
actors.hero.talent.backup_barrier.desc=_+1:_法師用光魔杖充能時，獲得_3點護盾_。\n\n_+2:_法師用光魔杖充能時，獲得_5點護盾_。
actors.hero.talent.backup_barrier.meta_desc=_如果其他英雄獲得此天賦_，必須用光身上最高等級法杖的充能時，效果才會觸發。

actors.hero.talent.energizing_meal.title=充能一餐
actors.hero.talent.energizing_meal.desc=_+1:_英雄進食只需一回合(食用可快速食用的食物不耗回合)，完食後還獲得_5回合法杖充能_。\n\n_+2:_英雄進食只需一回合(食用可快速食用的食物不耗回合)，完食後還獲得_8回合法杖充能_。
actors.hero.talent.inscribed_power.title=咒術注能
actors.hero.talent.inscribed_power.desc=_+1:_當英雄使用卷軸、秘卷或法術結晶時，_下兩次_法杖釋放的等級+2。\n\n_+2:_當英雄使用卷軸、秘卷或法術結晶時，_下三次_法杖釋放的等級+2。\n\n如果使用的為升級、轉化卷軸或其製品，生效的施法次數會加倍。\n\n大多法術結晶都是多產量製品，這種情況下此天賦會根據一次的產量來決定觸發機率。
actors.hero.talent.wand_preservation.title=法杖留形
actors.hero.talent.wand_preservation.desc=_+1:_法師將新法杖注入魔杖後，能保存原先注入的法杖_一次_。原法杖以+0狀態重現。\n\n_+2:_法師將新法杖注入魔杖後，能保存原先注入的法杖_多次，但有 1 英雄等級冷卻_。原法杖以+0狀態重現。
actors.hero.talent.wand_preservation.meta_desc=_如果其他英雄獲得此天賦_，天賦將改為提升提煉法杖提供的奧術樹脂數量，每級天賦等級多一份。
actors.hero.talent.arcane_vision.title=奥術感知
actors.hero.talent.arcane_vision.desc=_+1:_被法杖命中的敵人在_10回合_內都會被英雄靈視。\n\n_+2:_被法杖命中的敵人在_15回合_內都會被英雄靈視。
actors.hero.talent.shield_battery.title=電勢護盾
actors.hero.talent.shield_battery.desc=_+1:_英雄對自己使用法杖或魔杖以將法杖的所有充能換成_4%最大生命x充能數_點護盾。\n\n_+2:_英雄對自己使用法杖或魔杖以將法杖的所有充能換成_6%最大生命x充能數_點護盾。

actors.hero.talent.desperate_power.title=孤注一擲
actors.hero.talent.desperate_power.desc=_+1:_英雄的法杖將以_額外+1級_的力量釋放最後一點充能。\n\n_+2:_英雄的法杖將以_額外+2級_的力量釋放最後一點充能。\n\n_+3:_英雄的法杖將以_額外+3級_的力量釋放最後一點充能。
actors.hero.talent.ally_warp.title=移形換影
actors.hero.talent.ally_warp.desc=_+1:_英雄能立即與_2格內_的盟友互換位置。\n\n_+2:_英雄能立即與_4格內_的盟友互換位置。\n\n_+3:_英雄能立即與_6格內_的盟友互換位置。\n\n此天賦不適用於無法移動的單位。

actors.hero.talent.empowered_strike.title=強化打擊
actors.hero.talent.empowered_strike.desc=_+1:_戰鬥法師施放法杖後的首次攻擊會有_+16%傷害加成_與_+50%魔杖額外效果加成_。\n\n_+2:_戰鬥法師施放法杖後的首次攻擊會有_+33%傷害加成_與_+100%魔杖額外效果加成_。\n\n_+3:_戰鬥法師施放法杖後的首次攻擊會有_+50%傷害加成_與_+150%魔杖額外效果加成_。
actors.hero.talent.mystical_charge.title=秘法充能
actors.hero.talent.mystical_charge.desc=_+1:_以魔杖攻擊會使戰鬥法師裝備的神器獲得_0.5回合_的神器充能。\n\n_+2:_以魔杖攻擊會使戰鬥法師裝備的神器獲得_1回合_的神器充能。\n\n_+3:_以魔杖攻擊會使戰鬥法師裝備的神器獲得_1.5回合_的神器充能。
actors.hero.talent.excess_charge.title=過載防護
actors.hero.talent.excess_charge.desc=_+1:_當戰鬥法師使用滿充能的魔杖，將使其獲得_法杖等級x0.67的護盾_。\n\n_+2:_當戰鬥法師使用滿充能的魔杖，將使其獲得_法杖等級x1.33的護盾_。\n\n_+3:_當戰鬥法師使用滿充能的魔杖，將使其獲得_法杖等級x2的護盾_。

actors.hero.talent.soul_siphon.title=靈魂分食
actors.hero.talent.soul_siphon.desc=_+1_: 其他角色所做出的物理攻擊也能因術士的靈魂標記而受益，效果為原先的_13%_。\n\n_+2_: 其他角色所做出的物理攻擊也能因術士的靈魂標記而受益，效果為原先的_27%_。\n\n_+3_: 其他角色所做出的物理攻擊也能因術士的靈魂標記而受益，效果為原先的_40%_。
actors.hero.talent.soul_eater.title=靈魂吞噬
actors.hero.talent.soul_eater.desc=_+1_:靈魂標記會在每次成功攻擊時賦予_0.33回合_的飢餓度。 受靈魂標記的敵人死亡時有_10%_機率觸發進食效果。\n\n_+2_:靈魂標記會在每次成功攻擊時賦予_0.67回合_的飢餓度。 受靈魂標記的敵人死亡時有_20%_機率觸發進食效果。\n\n_+3_:靈魂標記會在每次成功攻擊時賦予_1回合_的飢餓度。 受靈魂標記的敵人死亡時有_30%_機率觸發進食效果。
actors.hero.talent.necromancers_minions.title=靈魂操縱
actors.hero.talent.necromancers_minions.desc=_+1:_當受標記的敵人死亡時會有_13%機率_轉化成腐化怨靈。\n\n_+2:_當受標記的敵人死亡時會有_27%機率_轉化成腐化怨靈。\n\n_+1:_當受標記的敵人死亡時會有_40%機率_轉化成腐化怨靈。

actors.hero.talent.blast_radius.title=強力爆破
actors.hero.talent.blast_radius.desc=_+1:_元素爆發的施加半徑由4格升至_5格_。\n\n_+2:_元素爆發的施加半徑由4格升至_6格_。\n\n_+3:_元素爆發的施加半徑由4格升至_7格_。\n\n_+4:_元素爆發的施加半徑由4格升至_8格_。
actors.hero.talent.elemental_power.title=元素強化
actors.hero.talent.elemental_power.desc=_+1:_元素爆發效果提升_25%_。\n\n_+2:_元素爆發效果提升_50%_。\n\n_+3:_元素爆發效果提升_75%_。\n\n_+4:_元素爆發效果提升_100%_。
actors.hero.talent.reactive_barrier.title=屏障回饋
actors.hero.talent.reactive_barrier.desc=_+1:_每有一個單位受元素爆發影響，法師將獲得_2.5點護盾_，最多計入_5位_。\n\n_+2:_每有一個單位受元素爆發影響，法師將獲得_5點護盾_，最多計入_6位_。\n\n_+3:_每有一個單位受元素爆發影響，法師將獲得_7.5點護盾_，最多計入_7位_。\n\n_+4:_每有一個單位受元素爆發影響，法師將獲得_10點護盾_，最多計入_8位_。

actors.hero.talent.wild_power.title=潛能無量
actors.hero.talent.wild_power.desc=_+1:_以狂野魔法釋放的法杖等級效果將_提升2-3，最高4級_。\n\n_+2:_以狂野魔法釋放的法杖等級效果將_提升3，最高5級_。\n\n_+3:_以狂野魔法釋放的法杖等級效果將_提升3-4，最高6級_。\n\n_+4:_以狂野魔法釋放的法杖等級效果將_提升4，最高7級_。
actors.hero.talent.fire_everything.title=無情轟炸
actors.hero.talent.fire_everything.desc=_+1:_狂野魔法施放的次數從4次升至_5次_，且有_25%機率_釋放第三次。\n\n_+2:_狂野魔法施放的次數從4次升至_6次_，且有_50%機率_釋放第三次。\n\n_+3:_狂野魔法施放的次數從4次升至_7次_，且有_75%機率_釋放第三次。\n\n_+4:_狂野魔法施放的次數從4次升至_8次_，且有_100%機率_釋放第三次。
actors.hero.talent.conserved_magic.title=不負責任
actors.hero.talent.conserved_magic.desc=_+1:_透過狂野魔法施展的法杖消耗的充能從0.5_降至0.33_，且施放護甲技能有_25%機率_不耗回合。\n\n_+2:_透過狂野魔法施展的法杖消耗的充能從0.5_降至0.225_，且施放護甲技能有_50%機率_不耗回合。\n\n_+3:_透過狂野魔法施展的法杖消耗的充能從0.5_降至0.15_，且施放護甲技能有_75%機率_不耗回合。\n\n_+4:_透過狂野魔法施展的法杖消耗的充能從0.5_降至0.1_，且施放護甲技能有_100%機率_不耗回合。

actors.hero.talent.telefrag.title=傳送擠壓
actors.hero.talent.telefrag.desc=_+1:_法師傳送時，如果與其它單位產生碰撞，則對其造成_10~15_點傷害，但自身受到_5_點傷害。\n\n_+2:_法師傳送時，如果與其它單位產生碰撞，則對其造成_20~30_點傷害，但自身受到_10_點傷害。\n\n_+3:_法師傳送時，如果與其它單位產生碰撞，則對其造成_30~45_點傷害，但自身受到_15_點傷害。\n\n_+4:_法師傳送時，如果與其它單位產生碰撞，則對其造成_40~60_點傷害，但自身受到_20_點傷害。\n\n自傷無法殺死英雄，且威力能被魔法扺抗效果減弱。
actors.hero.talent.remote_beacon.title=遙置信標
actors.hero.talent.remote_beacon.desc=_+1_:法師可以在_4格_的區域內放置信標。\n\n_+2_:法師可以在_8格_的區域內放置信標。\n\n_+3_:法師可以在_12格_的區域內放置信標。\n\n_+4_:法師可以在_16格_的區域內放置信標。
actors.hero.talent.longrange_warp.title=跨層傳送
actors.hero.talent.longrange_warp.desc=_+1:_法師可跨層傳送，但消耗_150%_充能。\n\n_+2:_法師可跨層傳送，但消耗_117%_充能。\n\n_+3:_法師可跨層傳送，且僅消耗_83%_充能。\n\n_+4:_法師可跨層傳送，且僅消耗_50%_充能。\n\n法師無法借助此能力離開封鎖的樓層。

#rogue
actors.hero.talent.cached_rations.title=備用儲糧
actors.hero.talent.cached_rations.desc=_+1:_在之後的樓層中，英雄能在寶箱裡找到_2份備用儲糧_。\n\n_+2:_在之後的樓層中，英雄能在寶箱裡找到_3份備用儲糧_。\n\n備用儲糧進食只需一回合，能獲得少量飽食、恢復5點生命值、並使暗影斗篷獲得1點充能。
actors.hero.talent.thiefs_intuition.title=識貨好漢
actors.hero.talent.thiefs_intuition.desc=_+1:_鑑定戒指速度提升_2倍_，且能在_裝備時_鑑定戒指種類。\n\n_+2:_戒指將於_裝備時_立刻鑑定，並在_撿起戒指時_即鑑定其種類。
actors.hero.talent.sucker_punch.title=突襲
actors.hero.talent.sucker_punch.desc=_+1:_英雄對某敵人的首次伏擊傷害會_額外增加1~2點_。\n\n_+2:_英雄對某敵人的首次伏擊傷害會_額外增加2點_。
actors.hero.talent.protective_shadows.title=暗影守護
actors.hero.talent.protective_shadows.desc=_+1:_英雄每隱形_2回合_就會獲得1點護盾，最多_3點_。\n\n_+2:_英雄每隱形_1回合_就會獲得1點護盾，最多_5點_。

actors.hero.talent.mystical_meal.title= 祕法蓄食
actors.hero.talent.mystical_meal.desc=_+1:_英雄進食只需一回合(食用可快速食用的食物不耗回合)，並賦予_3回合_的神器充能。\n\n_+2:_英雄進食只需一回合(食用可快速食用的食物不耗回合)，並賦予_5回合_的神器充能。\n\n豐饒之角不能用這個天賦自行充能。
actors.hero.talent.inscribed_stealth.title=咒術偽裝
actors.hero.talent.inscribed_stealth.desc=_+1:_當英雄使用卷軸、秘卷或法術結晶時，將獲得_3回合_隱形。\n\n_+2:_當英雄使用卷軸、秘卷或法術結晶時，將獲得_5回合_隱形。\n\n如果使用的為升級、轉化卷軸或其製品，隱形回合數會加倍。\n\n大多法術結晶都是多產量製品，這種情況下此天賦會根據一次的產量來決定觸發機率。
actors.hero.talent.wide_search.title=廣域搜尋
actors.hero.talent.wide_search.desc=_+1:_盜賊的搜索範圍由方形5x5擴大至_圓形7x7_。\n\n_+2:_盜賊的搜索範圍由方形5x5擴大至_方形7x7_。
actors.hero.talent.wide_search.meta_desc=_如果其他英雄獲得此天賦_，由於他們的搜索範圍為方形3x3，所以在+1時只會變成圓形5x5、+2則為方形5x5。
actors.hero.talent.silent_steps.title=低調行事
actors.hero.talent.silent_steps.desc=_+1:_英雄不會吵醒_3格外_的敵人。\n\n_+2:_英雄不會吵醒_未與其相鄰_的敵人。
actors.hero.talent.rogues_foresight.title=盜竊本性
actors.hero.talent.rogues_foresight.desc=_+1:_在進入有秘密房間的樓層時，英雄有_75%的機率_得知。\n\n_+2:_在進入有秘密房間的樓層時，英雄_絕對會_得知。

actors.hero.talent.light_cloak.title=便捷披覆
actors.hero.talent.light_cloak.desc=_+1:_盜賊能在未裝備情況下使用斗篷，但充能速度只有_25%_。\n\n_+2:_盜賊能在未裝備情況下使用斗篷，但充能速度只有_50%_。\n\n_+3:_盜賊能在未裝備情況下使用斗篷，但充能速度只有_75%_。
actors.hero.talent.light_cloak.meta_desc=_如果其他英雄獲得此天賦_，此天賦會在相應等級提升7/13/20%的神器充能速度。
actors.hero.talent.enhanced_rings.title=戒指注能
actors.hero.talent.enhanced_rings.desc=_+1:_英雄使用神器後的_3回合_內，戒指的效果會+1級。\n\n_+2:_英雄使用神器後的_6回合_內，戒指的效果會+1級。\n\n_+3:_英雄使用神器後的_9回合_內，戒指的效果會+1級。

actors.hero.talent.enhanced_lethality.title=直擊要害
actors.hero.talent.enhanced_lethality.desc=_+1:_刺客能處決的敵人的生命百分比由3/10/20/50%提升至_4/13/27/67%_。\n\n_+2:_刺客能處決的敵人的生命百分比由3/10/20/50%提升至_5/17/33/83%_。\n\n_+3:_刺客能處決的敵人的生命百分比由3/10/20/50%提升至_6/20/40/100%_。
actors.hero.talent.assassins_reach.title=長距突刺
actors.hero.talent.assassins_reach.desc=_+1:_刺客行刺時能閃現的距離由1/2/3/4格提升至_1/3/4/6格_。\n\n_+2:_刺客行刺時能閃現的距離由1/2/3/4格提升至_2/4/6/8格_。\n\n_+3:_刺客行刺時能閃現的距離由1/2/3/4格提升至_2/5/7/10格_。
actors.hero.talent.bounty_hunter.title=賞金獵人
actors.hero.talent.bounty_hunter.desc=_+1:_根據準備程度，刺客成功刺殺的敵人掉落物品的機率提升_2/4/8/16%_。\n\n_+2:_根據準備程度，刺客成功刺殺的敵人掉落物品的機率提升_4/8/16/32%_。\n\n_+3:_根據準備程度，刺客成功刺殺的敵人掉落物品的機率提升_6/12/24/48%_。

actors.hero.talent.evasive_armor.title=迴避之鎧
actors.hero.talent.evasive_armor.desc=_+1:_在逸動時，如果疾行者的力量高於身上護甲要求，每點多餘的力量讓他獲得_1單位閃避_。\n\n_+2:_在逸動時，如果疾行者的力量高於身上護甲要求，每點多餘的力量讓他獲得_2單位閃避_。\n\n_+3:_在逸動時，如果疾行者的力量高於身上護甲要求，每點多餘的力量讓他獲得_3單位閃避_。
actors.hero.talent.projectile_momentum.title=致命動能
actors.hero.talent.projectile_momentum.desc=_+1:_在逸動時，疾行者的投擲武器攻擊有額外的_50%_精準度與_15%_傷害。\n\n_+2:_在逸動時，疾行者的投擲武器攻擊有額外的_100%_精準度與_30%_傷害。\n\n_+3:_在逸動時，疾行者的投擲武器攻擊有額外的_150%_精準度與_45%_傷害。
actors.hero.talent.speedy_stealth.title=極速潛行
actors.hero.talent.speedy_stealth.desc=_+1:_疾行者在隱形時，每回合獲得2點動能。\n\n_+2:_除+1的增益外，在隱形時，疾行者的逸動效果剩餘時間不會減少。\n\n_+3_:除了+1、+2的增益外，在隱形時，疾行者以雙倍速度移動。

actors.hero.talent.hasty_retreat.title=人間蒸發
actors.hero.talent.hasty_retreat.desc=_+1:_盜賊閃現後會獲得_1回合_的極速及隱形。\n\n_+2:_盜賊閃現會後獲得_2回合_的極速及隱形。\n\n_+3:_盜賊閃現會後獲得_3回合_的極速及隱形。\n\n_+4:_盜賊閃現會後獲得_4回合_的極速及隱形。
actors.hero.talent.body_replacement.title=替身掩體
actors.hero.talent.body_replacement.desc=_+1:_在閃現後，盜賊會在原地留下具有_20點生命與1~3點護甲_的木樁替身。\n\n_+2:_在閃現後，盜賊會在原地留下具有_40點生命與2~6點護甲_的木樁替身。\n\n_+3:_在閃現後，盜賊會在原地留下具有_60點生命與3~9點護甲_的木樁替身。\n\n_+4:_在閃現後，盜賊會在原地留下具有_80點生命與4~12點護甲_的木樁替身。
actors.hero.talent.shadow_step.title=預先計畫
actors.hero.talent.shadow_step.desc=_+1:_在隱形時使用煙幕爆炸所需護甲充能_減少16%_且不耗回合，但不會使敵人致盲及觸發其它天賦。\n\n_+2:_在隱形時使用煙幕爆炸所需護甲充能_減少30%_且不耗回合，但不會使敵人致盲及觸發其它天賦。\n\n_+3:_在隱形時使用煙幕爆炸所需護甲充能_減少41%_且不耗回合，但不會使敵人致盲及觸發其它天賦。\n\n_+4:_在隱形時使用煙幕爆炸所需護甲充能_減少50%_且不耗回合，但不會使敵人致盲及觸發其它天賦。

actors.hero.talent.fear_the_reaper.title=即死夢魘
actors.hero.talent.fear_the_reaper.desc=_+1:_當被標記的敵人生命值為零時，它們得到_殘廢_效果。\n\n_+2:_當被標記的敵人生命值為零時，它們得到_殘廢與恐惧_效果。\n\n_+3:_當被標記的敵人生命值為零時，它們得到_殘廢與恐惧_效果。周遭3格內的敵人則得到_殘廢_效果。\n\n_+4:_當被標記的敵人生命值為零時，它們與周遭3格內的敵人得到_殘廢與恐惧_效果。
actors.hero.talent.deathly_durability.title=獸皮大衣
actors.hero.talent.deathly_durability.desc=_+1:_因奪命印記而死的敵人會使盜賊獲得其受標記時的生命值_13%_的護盾。\n\n_+2:_因奪命印記而死的敵人會使盜賊獲得其受標記時的生命值_25%_的護盾。\n\n_+3:_因奪命印記而死的敵人會使盜賊獲得其受標記時的生命值_38%_的護盾。\n\n_+4:_因奪命印記而死的敵人會使盜賊獲得其受標記時的生命值_50%_的護盾。
actors.hero.talent.double_mark.title=雙重標記
actors.hero.talent.double_mark.desc=_+1:_連續標記目標消耗的護甲充能降低_30%_。\n\n_+2:_連續標記目標消耗的護甲充能降低_50%_。\n\n_+3:_連續標記目標消耗的護甲充能降低_65%_。\n\n_+4:_連續標記目標消耗的護甲充能降低_75%_。

actors.hero.talent.shadow_blade.title=暗影之刃
actors.hero.talent.shadow_blade.desc=_+1:_暗影分身每回合獲得英雄的_8%_傷害，且有_25%機率_會使用英雄的武器上的附魔。\n\n_+2:_暗影分身每回合獲得英雄的_16%_傷害，且有_50%機率_會使用英雄的武器上的附魔。\n\n_+3:_暗影分身每回合獲得英雄的_24%_傷害，且有_75%機率_會使用英雄的武器上的附魔。\n\n_+4:_暗影分身每回合獲得英雄的_32%_傷害，且有_100%機率_會使用英雄的武器上的附魔。
actors.hero.talent.cloned_armor.title=雙成之鎧
actors.hero.talent.cloned_armor.desc=_+1_:暗影分身獲得英雄身上的護甲的_12%_防禦力，且有_25%_機率使用該護甲上的刻印效果。\n\n_+2_:暗影分身獲得英雄身上的護甲的_24%_防禦力，且有_50%_機率使用該護甲上的刻印效果。\n\n_+3_:暗影分身獲得英雄身上的護甲的_36%_防禦力，且有_75%_機率使用該護甲上的刻印效果。\n\n_+4_:暗影分身獲得英雄身上的護甲的_48%_防禦力，且有_100%_機率使用該護甲上的刻印效果。
actors.hero.talent.perfect_copy.title=無暇分身
actors.hero.talent.perfect_copy.desc=_+1:_暗影分身獲得英雄_10%_的最大生命值，且可以和英雄在_1格_內立刻互換位置。\n\n_+2:_暗影分身獲得英雄_20%_的最大生命值，且可以和英雄在_2格_內立刻互換位置。\n\n_+3:_暗影分身獲得英雄_30%_的最大生命值，且可以和英雄在_3格_內立刻互換位置。\n\n_+4:_暗影分身獲得英雄_40%_的最大生命值，且可以和英雄在_4格_內立刻互換位置。

#huntress
actors.hero.talent.natures_bounty.title=自然之賞
actors.hero.talent.natures_bounty.desc=_+1:_在之後的樓層中，英雄能在高草中找到_4顆地城莓果_。\n\n_+2:_在之後的樓層中，英雄能在高草中找到_6顆地城莓果_。\n\n地城莓果進食只需一回合，能獲得極少量飽食、而且可能內含種子。
actors.hero.talent.survivalists_intuition.title=生存本能
actors.hero.talent.survivalists_intuition.desc=_+1_：鑑定投擲武器的速度_提升三倍_。\n\n_+2_：投擲武器在_用於攻擊時_立即鑑定。
actors.hero.talent.followup_strike.title=追加一擊
actors.hero.talent.followup_strike.desc=_+1:_受英雄的遠程物理手段傷害的敵人受到英雄的下次近戰傷害會_額外+2_。\n\n_+2:_受英雄的遠程物理手段傷害的敵人受到英雄的下次近戰傷害會_額外+3_。
actors.hero.talent.natures_aid.title=自然之援
actors.hero.talent.natures_aid.desc=+1:可視範圍內有植物效果觸發時，英雄將獲得0~2點樹膚，效果每_3回合_衰減一次。\n\n+2:可視範圍內有植物效果觸發時，英雄將獲得0~2點樹膚，效果每_5回合_衰減一次。

actors.hero.talent.invigorating_meal.title=振神之食
actors.hero.talent.invigorating_meal.desc=_+1:_英雄進食只需一回合(食用可快速食用的食物不耗回合)，並賦予_1回合_的極速。\n\n_+2:_英雄進食只需一回合(食用可快速食用的食物不耗回合)，並賦予_2回合_的極速。
actors.hero.talent.liquid_nature.title=液致繁茂
actors.hero.talent.liquid_nature.desc=_+1:_當英雄使用藥水時，作用點3x3範圍會產生的植被及_最多4格的高草_、並使作用範圍的敵人受到束縛_1回合_。\n\n_+2:_當英雄使用藥水時，作用點3x3範圍會產生的植被及_最多6格的高草_、並使作用範圍的敵人受到束縛_2回合_。\n\n如果使用的為力量、經驗藥劑或其製品，生長的高草量及纏繞回合數均會加倍。\n\n至於使用多產量的物品(像是水爆魔藥)，此天賦會根據一次的產量來決定觸發機率。
actors.hero.talent.rejuvenating_steps.title=回春步伐
actors.hero.talent.rejuvenating_steps.desc=_+1:_英雄踏上較矮的草或者餘燼時，它們將成長為高草並將會立刻被踩踏。此效果有_10回合的冷卻時間_。\n\n_+2:_英雄踏上較矮的草或者餘燼時，它們將成長為高草並將會立刻被踩踏。此效果有_5回合的冷卻時間_。\n\n此天賦在樓層被鎖定或者英雄長時間未獲取經驗時只會產生枯草。
actors.hero.talent.heightened_senses.title=敏銳感知
actors.hero.talent.heightened_senses.desc=_+1:_英雄能以靈視感測到_距離2格_的單位。\n\n_+2:_英雄能以靈視感測到_距離3格_的單位。
actors.hero.talent.durable_projectiles.title=堅固投物
actors.hero.talent.durable_projectiles.desc=_+1:_由英雄使用的投擲武器整體耐久_+50%_。\n\n_+2:_由英雄使用的投擲武器整體耐久_+75%_。

actors.hero.talent.point_blank.title=貼身射擊
actors.hero.talent.point_blank.desc=_+1:_當英雄對相鄰敵人使用弓或投擲武器時，其命中率為_-25%_而非-50%。\n\n_+2:_當英雄對相鄰敵人使用弓或投擲武器時，其命中率與使用近戰武器時相同。\n\n_+3:_當英雄對相鄰敵人使用弓或投擲武器時，其命中率為_+25%_而非-50%。\n\n投擲武器和靈能弓在遠距離使用時都具有+50%的命中率。
actors.hero.talent.seer_shot.title=靈矢感知
actors.hero.talent.seer_shot.desc=_+1:_當獵人以靈能弓射向地面，會使落點及附近範圍加入可視範圍_5回合_。擁有20回合冷卻。\n\n_+2:_當獵人以靈能弓射向地面，會使落點及附近範圍加入可視範圍_10回合_。擁有20回合冷卻。\n\n_+3:_當獵人以靈能弓射向地面，會使落點及附近範圍加入可視範圍_15回合_。擁有20回合冷卻。
actors.hero.talent.seer_shot.meta_desc=_如果其他英雄獲得此天賦_，此天賦改以任意投擲武器觸發。

actors.hero.talent.farsight.title=遠眺
actors.hero.talent.farsight.desc=_+1:_狙擊手的可視範圍_擴大25%_。\n\n_+2:_狙擊手的可視範圍_擴大50%_。\n\n_+3:_狙擊手的可視範圍_擴大75%_。
actors.hero.talent.shared_enchantment.title=共享附魔
actors.hero.talent.shared_enchantment.desc=_+1:_投擲武器有_33%機率_套用靈能弓的附魔。\n\n_+2:_投擲武器有_67%機率_套用靈能弓的附魔。\n\n_+3:_投擲武器將_絕對_會套用靈能弓的附魔。\n\n靈能弓的附魔可與投擲武器原用的附魔同時觸發。
actors.hero.talent.shared_upgrades.title=深印標記
actors.hero.talent.shared_upgrades.desc=_+1:_當狙擊手使用升級過的投擲武器進行攻擊時，不超過_+2_的每級升級，會提升狙擊標記生效時長1回合，並將特殊攻擊傷害提升16% (升級為_+2_時，傷害提升_33%_)。\n\n_+2:_當狙擊手使用升級過的投擲武器進行攻擊時，不超過_+4_的每級升級，會提升狙擊標記生效時長1回合，並將特殊攻擊傷害提升16% (升級為_+4_時，傷害提升_67%_)。\n\n_+3:_當狙擊手使用升級過的投擲武器進行攻擊時，不超過_+6_的每級升級，會提升狙擊標記生效時長1回合，並將特殊攻擊傷害提升16% (升級為_+6_時，傷害提升_100%_)。

actors.hero.talent.durable_tips.title=耐久鏢尖
actors.hero.talent.durable_tips.desc=_+1:_由守望者使用的飛鏢塗藥耐久_x2_。\n\n_+2:_由守望者使用的飛鏢塗藥耐久_x3_。\n\n_+3:_由守望者使用的飛鏢塗藥耐久_x4_。
actors.hero.talent.barkskin.title=樹膚韌甲
actors.hero.talent.barkskin.desc=_+1:_在草叢中，守望者獲得樹膚效果，其值為_0~50%_英雄等級，效果每回合衰減。\n\n_+2:_在草叢中，守望者獲得樹膚效果，其值為_0~100%_英雄等級，效果每回合衰減。\n\n_+3:_在草叢中，守望者獲得樹膚效果，其值為_0~150%_英雄等級，效果每回合衰減。
actors.hero.talent.shielding_dew.title=露水健體
actors.hero.talent.shielding_dew.desc=_+1:_超額的露水治療將以護盾形式提供，提供上限為_最大生命值的20%_。\n\n_+2:_超額的露水治療將以護盾形式提供，提供上限為_最大生命值的40%_。\n\n_+3:_超額的露水治療將以護盾形式提供，提供上限為_最大生命值的60%_。

actors.hero.talent.fan_of_blades.title=扇展飛刃
actors.hero.talent.fan_of_blades.desc=_+1:_魅影刃可以以50%傷害多命中_1個目標_。該目標需在可視範圍內且在_30度內的_扇形範圍內。\n\n_+2:_魅影刃可以以50%傷害多命中_2個目標_。該目標需在可視範圍內且在_60度內的_扇形範圍內。\n\n_+3:_魅影刃可以以50%傷害多命中_3個目標_。該目標需在可視範圍內且在_90度內的_扇形範圍內。\n\n_+4:_魅影刃可以以50%傷害多命中_4個目標_。該目標需在可視範圍內且在_120度內的_扇形範圍內。
actors.hero.talent.projecting_blades.title=鋒銳利刃
actors.hero.talent.projecting_blades.desc=_+1:_魅影刃獲得_+25%_命中率，且可以穿透最多_2層_實體地形。\n\n_+2:_魅影刃獲得_+50%_命中率，且可以穿透最多_4層_實體地形。\n\n_+3:_魅影刃獲得_+75%_命中率，且可以穿透最多_6層_實體地形。\n\n_+4:_魅影刃獲得_+100%_命中率，且可以穿透最多_8層_實體地形。
actors.hero.talent.spirit_blades.title=靈能影刃
actors.hero.talent.spirit_blades.desc=_+1:_魅影刃有_30%_機率使用靈能弓上的附魔效果。\n\n_+2:_魅影刃有_60%_機率使用靈能弓上的附魔效果。\n\n_+3:_魅影刃有_90%_機率使用靈能弓上的附魔效果。\n\n_+4:_魅影刃有_100%_機率使用靈能弓上的附魔效果，且兩者的附魔效果提升_10%_。

actors.hero.talent.growing_power.title=茁壯力量
actors.hero.talent.growing_power.desc=_+1:_自然之力的攻擊速度及移動速度加成從33%及100%增加至_38%及125%_。\n\n_+2:_自然之力的攻擊速度及移動速度加成從33%及100%增加至_42%及150%_。\n\n_+3:_自然之力的攻擊速度及移動速度加成從33%及100%增加至_46%及175%_。\n\n_+4:_自然之力的攻擊速度及移動速度加成從33%及100%增加至_50%及200%_。
actors.hero.talent.natures_wrath.title=自然之怒
actors.hero.talent.natures_wrath.desc=_+1:_自然之怒發動期間，每次使用靈能弓皆有_8%_機率觸發一種隨機的有害植物效果。\n\n_+2:_自然之怒發動期間，每次使用靈能弓皆有_17%_機率觸發一種隨機的有害植物效果。\n\n_+3:_自然之怒發動期間，每次使用靈能弓皆有_25%_機率觸發一種隨機的有害植物效果。\n\n_+4:_自然之怒發動期間，每次使用靈能弓皆有_33%_機率觸發一種隨機的有害植物效果。\n\n可以觸發的植物有:致盲草、綻焰花、霜冰冠、斷腸苔以及暴風藤。
actors.hero.talent.wild_momentum.title=野性衝勁
actors.hero.talent.wild_momentum.desc=_+1:_使用靈能弓擊殺敵人可以延長自然之力_1回合_，最多_2回合_。\n\n_+2:_使用靈能弓擊殺敵人可以延長自然之力_2回合_，最多_4回合_。\n\n_+3:_使用靈能弓擊殺敵人可以延長自然之力_3回合_，最多_6回合_。\n\n_+4:_使用靈能弓擊殺敵人可以延長自然之力_4回合_，最多_8回合_。

actors.hero.talent.eagle_eye.title=銳利鷹眼
actors.hero.talent.eagle_eye.desc=_+1:_靈魂獵鷹的可視範圍從6格提升至_7格_。\n\n_+2:_靈魂獵鷹的可視範圍從6格提升至_8格_。\n\n_+3:_靈魂獵鷹的可視範圍從6格提升至_9格_，且獲得_2格_範圍的靈視效果。\n\n_+4:_靈魂獵鷹的可視範圍從6格提升至_10格_，且獲得_3格_範圍的靈視效果。
actors.hero.talent.go_for_the_eyes.title=精準盲擊
actors.hero.talent.go_for_the_eyes.desc=_+1:_靈魂獵鷹攻擊會造成_2回合_的致盲。\n\n_+2:_靈魂獵鷹攻擊會造成_5回合_的致盲。\n\n_+3:_靈魂獵鷹攻擊會造成_5回合_的致盲以及_2回合_的殘廢。\n\n_+4:_靈魂獵鷹攻擊會造成_5回合_的致盲以及_5回合_的殘廢。
actors.hero.talent.swift_spirit.title=迅捷之靈
actors.hero.talent.swift_spirit.desc=_+1:_靈魂獵鷹移動速度從每回合2格增加至_2.5格_，並且絕對能閃躲前_2次_針對性攻擊。\n\n_+2:_靈魂獵鷹移動速度從每回合2格增加至_3格_，並且絕對能閃躲前_4次_針對性攻擊。\n\n_+3:_靈魂獵鷹移動速度從每回合2格增加至_3.5格_，並且絕對能閃躲前_6次_針對性攻擊。\n\n_+4:_靈魂獵鷹移動速度從每回合2格增加至_4格_，並且絕對能閃躲前_8次_針對性攻擊。

#duelist
actors.hero.talent.strengthening_meal.title=食以強身
actors.hero.talent.strengthening_meal.desc=_+1:_英雄進食後，_後2次_物理攻擊，得到額外3點傷害。\n\n_+2:_英雄進食後，_後3次_物理攻擊，得到額外3點傷害。
actors.hero.talent.adventurers_intuition.title=闖蕩經歷
actors.hero.talent.adventurers_intuition.desc=_+1:_護甲鑑定速度提升_1.75倍_，武器而提升_2.5倍_。_\n\n+2:_護甲鑑定速度提升_2.5倍_，而武器在_裝備時_立刻鑑定。
actors.hero.talent.patient_strike.title=沉穩一擊
actors.hero.talent.patient_strike.desc=_+1:_如果英雄在等待後立即進行近戰攻擊，傷害量額外_+1~2_。\n\n_+2:_如果英雄在等待後立即進行近戰攻擊，傷害量額外_+2_。
actors.hero.talent.aggressive_barrier.title=無畏屏障
actors.hero.talent.aggressive_barrier.desc=_+1:_決鬥者生命值在50%以下時使用武技會獲得_3點護盾_。\n\n_+2:_決鬥者生命值在50%以下時使用武技會獲得_5點護盾_。
actors.hero.talent.aggressive_barrier.meta_desc=_如果其他英雄獲得此天賦_，在符合條件下進行近戰攻擊即會觸發，擁有50回合冷卻。

actors.hero.talent.focused_meal.title=食能會神
actors.hero.talent.focused_meal.desc=_+1:_決鬥者進食只需一回合(食用可快速食用的食物不耗回合)，且完食後獲得_0.67點_武器充能。\n\n_+2:_決鬥者進食只需一回合(食用可快速食用的食物不耗回合)，且完食後獲得_1點_武器充能。
actors.hero.talent.focused_meal.meta_desc=_如果其他英雄獲得此天賦_，英雄完食後的下一次物理攻擊有額外傷害。此天賦為+1時，傷害威力為_33%_英雄等級;此天賦為+2時，傷害威力為_50%_英雄等級。
actors.hero.talent.liquid_agility.title=液蘊機敏
actors.hero.talent.liquid_agility.desc=_+1:_英雄使用藥水的期間擁有_3倍閃避_，且他在接下來5回合內的近戰攻擊擁有_3倍精準度_。\n\n_+2:_英雄使用藥水的期間擁有_無限閃避_，且他在接下來5回合內的近戰攻擊將_保證命中_。\n\n如果使用的為力量、經驗藥劑或其製品，加成有效回合數皆會+1。\n\n至於使用多產量的物品(像是水爆魔藥)，此天賦會根據一次的產量來決定觸發機率。
actors.hero.talent.weapon_recharging.title=武器充能
actors.hero.talent.weapon_recharging.desc=_+1:_在任意充能狀態下，決鬥者每_15回合_得到1點武器充能。\n\n_+2:_在任意充能狀態下，決鬥者每_10回合_得到1點武器充能。
actors.hero.talent.weapon_recharging.meta_desc=_若其他英雄獲得此天賦_，在充能狀態下，近戰攻擊有傷害加成，威力為+1:5%，+2:7.5%。
actors.hero.talent.lethal_haste.title=取命餘力
actors.hero.talent.lethal_haste.desc=_+1:_決鬥者用武技擊殺敵人後，得到_3回合_瞬間移動效果。\n\n_+2:_決鬥者用武技擊殺敵人後，得到_5回合_瞬間移動效果。
actors.hero.talent.lethal_haste.meta_desc=_如果其他英雄獲得此天賦_，此效果則會在近戰擊殺敵人時觸發，但有100回合冷卻時間。
actors.hero.talent.swift_equip.title=疾速配裝
actors.hero.talent.swift_equip.desc=_+1_決鬥者每20回合可不耗時間裝備武器_一次_。\n\n_+2_決鬥者每20回合可不耗時間裝備武器_兩次_。\n\n此天賦可用時，點擊快捷欄未裝備的武器，就會裝備該武器。

actors.hero.talent.precise_assault.title=精準打擊
actors.hero.talent.precise_assault.desc=_+1:_決鬥者使用武技後5回合內，下一次近戰攻擊的_精準度加倍_。\n\n_+2:_決鬥者使用武技後5回合內，下一次近戰攻擊的_精準度加三倍_。\n\n_+3:_決鬥者使用武技後5回合內，下一次近戰攻擊有_無限精準度_。
actors.hero.talent.precise_assault.meta_desc=_如果其他英雄獲得此天賦_，+1/+2/+3時近擊精準度分別提升10%/20%/30%。
actors.hero.talent.deadly_followup.title=奪命追擊
actors.hero.talent.deadly_followup.desc=_+1:_決鬥者用投擲武器擊中敵人後，在5回合內追加的近戰攻擊獲得_10%_額外傷害。\n\n_+2:_決鬥者用投擲武器擊中敵人後，在5回合內追加的近戰攻擊獲得_20%_額外傷害。\n\n_+3:_決鬥者用投擲武器擊中敵人後，在5回合內追加的近戰攻擊獲得_30%_額外傷害。

actors.hero.talent.varied_charge.title=多樣強攻
actors.hero.talent.varied_charge.desc=_+1:_勇士使用兩個不同的武技時，會獲得_0.17點武技充能_，時間間隔無限。\n\n_+2:_勇士使用兩個不同的武技時，會獲得_0.33點武技充能_，時間間隔無限。\n\n_+3:_勇士使用兩個不同的武技時，會獲得_0.5點武技充能_，時間間隔無限。
actors.hero.talent.twin_upgrades.title=雙武一體
actors.hero.talent.twin_upgrades.desc=_+1:_如果勇士裝備的武器比另一把武器_低兩階_且等級較低，則將其算作為與另一把武器相同的等級。\n\n_+2:_如果勇士裝備的武器比另一把武器_低一階_且等級較低，則將其算作為與另一把武器相同的等級。\n\n_+1:_如果勇士裝備的武器比另一把武器_階級相同或更低_且等級較低，則將其算作為與另一把武器相同的等級。
actors.hero.talent.combined_lethality.title=花式終結
actors.hero.talent.combined_lethality.desc=_+1:_如果勇士在使用武技之後立刻使用另一把武器攻擊，此攻擊將會處決_生命值低於13%_的非頭目敵人。\n\n_+2:_如果勇士在使用武技之後立刻使用另一把武器攻擊，此攻擊將會處決_生命值低於27%_的非頭目敵人。\n\n_+3:_如果勇士在使用武技之後立刻使用另一把武器攻擊，此攻擊將會處決_生命值低於40%_的非頭目敵人。\n\n只要使用另一把武器進行任意形式的攻擊，或作為武技的一部份展現即會生效。

actors.hero.talent.unencumbered_spirit.title=無羈靈魂
actors.hero.talent.unencumbered_spirit.desc=_+1:_武道者每身著一件不超過_3階_的裝備，獲得的內力就_+50%_。\n\n_+2:_武道者每身著一件不超過_2階_的裝備，獲得的內力就_+75%_。無符合條件的裝備時，+1的條件仍可適用。\n\n_+3:_武道者每身著一件_1階_的裝備，獲得的內力就_+100%_。她還會獲得一件布甲與一雙鑲釘手套。無符合條件的裝備時，+1、+2的條件仍可適用。\n\n注意:不做裝備及使用武力之戒不在適用條件內。
actors.hero.talent.monastic_vigor.title=道心盎然
actors.hero.talent.monastic_vigor.desc=_+1:_武道者有_100%_內力時，武功威力加強。\n\n_+2:_武道者有_80%_內力時，武功威力加強。\n\n_+3:_武道者有_60%_內力時，武功威力加強。\n\n武功加強後:\n- 亂拳可觸發武器附魔\n- 凝神不耗時間\n- 凌雲步可到達的距離+4\n- 神龍擺尾傷害+50%，並擊退、麻痹周遭的敵人\n- 冥思的減傷80%，結束後緩慢回復20%缺失的血量
actors.hero.talent.combined_energy.title=雙能合一
actors.hero.talent.combined_energy.desc=_+1:_當武道者在5回合內接連使用了武技以及需要_4點內力_及以上的武功時，會立刻回復1點內力。\n\n_+2:_當武道者在5回合內接連使用了武技以及需要_3點內力_及以上的武功時，會立刻回復1點內力。\n\n_+3:_當武道者在5回合內接連使用了武技以及需要_2點內力_及以上的武功時，會立刻回復1點內力。

actors.hero.talent.close_the_gap.title=近身開打
actors.hero.talent.close_the_gap.desc=_+1:_決鬥者在開始決鬥時，可以朝目標閃現_2格_。\n\n_+2:_決鬥者在開始決鬥時，可以朝目標閃現_3格_。\n\n_+3:_決鬥者在開始決鬥時，可以朝目標閃現_4格_。\n\n_+4:_決鬥者在開始決鬥時，可以朝目標閃現_5格_。\n\n閃現可以通過障礙物及敵人，但不能通過牆壁等實心地形。閃現的距離也算在決定能不能開始決鬥的條件裡。
actors.hero.talent.invigorating_victory.title=速戰速決
actors.hero.talent.invigorating_victory.desc=_+1:_如果決鬥目標在決鬥結束前擊倒敵人，決鬥者可恢復_5+決鬥過程損失生命30%_的生命。\n\n_+2:_如果決鬥目標在決鬥結束前擊倒敵人，決鬥者可恢復_10+決鬥過程損失生命50%_的生命。\n\n_+3:_如果決鬥目標在決鬥結束前擊倒敵人，決鬥者可恢復_15+決鬥過程損失生命65%_的生命。\n\n_+4:_如果決鬥目標在決鬥結束前擊倒敵人，決鬥者可恢復_20+決鬥過程損失生命75%_的生命。
actors.hero.talent.elimination_match.title=逐個殲滅
actors.hero.talent.elimination_match.desc=_+1:_如果決鬥者在前一場決鬥結束後三回合內再次發起決鬥，該次決鬥消耗能量會減少_16%_。\n\n_+2:_如果決鬥者在前一場決鬥結束後三回合內再次發起決鬥，該次決鬥消耗能量會減少_30%_。\n\n_+3:_如果決鬥者在前一場決鬥結束後三回合內再次發起決鬥，該次決鬥消耗能量會減少_40%_。\n\n_+4:_如果決鬥者在前一場決鬥結束後三回合內再次發起決鬥，該次決鬥消耗能量會減少_50%_。

actors.hero.talent.elemental_reach.title=元素延展
actors.hero.talent.elemental_reach.desc=_+1:_元素斬擊範圍從4格提升至_5格_，施放角度則由65度升至_75度_。\n\n_+2:_元素斬擊範圍從4格提升至_6格_，施放角度則由65度升至_85度_。\n\n_+3:_元素斬擊範圍從4格提升至_7格_，施放角度則由65度升至_95度_。\n\n_+4:_元素斬擊範圍從4格提升至_8格_，施放角度則由65度升至_105度_。
actors.hero.talent.striking_force.title=強能衝擊
actors.hero.talent.striking_force.desc=_+1:_元素斬擊效果提升_30%_。\n\n_+2:_元素斬擊效果提升_60%_。\n\n_+3:_元素斬擊效果提升_90%_。\n\n_+4:_元素斬擊效果提升_120%_。
actors.hero.talent.directed_power.title=能量制導
actors.hero.talent.directed_power.desc=_+1:_主要攻擊的附魔力量_+30%_，且元素斬擊作用範圍將包含主要目標。\n\n_+2:_主要攻擊的附魔力量_+60%_，且元素斬擊作用範圍將包含主要目標。\n\n_+3:_主要攻擊的附魔力量_+90%_，且元素斬擊作用範圍將包含主要目標。\n\n_+4:_主要攻擊的附魔力量_+120%_，且元素斬擊作用範圍將包含主要目標。

actors.hero.talent.feigned_retreat.title=以退為進
actors.hero.talent.feigned_retreat.desc=_+1:_如果敵人攻擊了決鬥者的殘影，決鬥者獲得_2回合_的極速。\n\n_+2:_如果敵人攻擊了決鬥者的殘影，決鬥者獲得_4回合_的極速。\n\n_+3:_如果敵人攻擊了決鬥者的殘影，決鬥者獲得_6回合_的極速。\n\n_+4:_如果敵人攻擊了決鬥者的殘影，決鬥者獲得_8回合_的極速。
actors.hero.talent.expose_weakness.title=看穿破綻
actors.hero.talent.expose_weakness.desc=_+1:_攻擊決鬥者的殘像的敵人會受到_2回合_的虛弱及易傷。\n\n_+2:_攻擊決鬥者的殘像的敵人會受到_4回合_的虛弱及易傷。\n\n_+3:_攻擊決鬥者的殘像的敵人會受到_6回合_的虛弱及易傷。\n\n_+4:_攻擊決鬥者的殘像的敵人會受到_8回合_的虛弱及易傷。
actors.hero.talent.counter_ability.title=反擊技
actors.hero.talent.counter_ability.desc=_+1:_如果決鬥者在殘像被攻擊後三回合內使用武技，則立刻恢復_0.38_點武技充能。\n\n_+2:_如果決鬥者在殘像被攻擊後三回合內使用武技，則立刻恢復_0.77_點武技充能。\n\n_+3:_如果決鬥者在殘像被攻擊後三回合內使用武技，則立刻恢復_1.13_點武技充能。\n\n_+4:_如果決鬥者在殘像被攻擊後三回合內使用武技，則立刻恢復_1.5_點武技充能。

#cleric
actors.hero.talent.satiated_spells.title=神賜食咒
actors.hero.talent.satiated_spells.desc=_+1:_牧師進食後的下一次施咒會額外提供_3點護盾_。\n\n_+2:_牧師進食後的下一次施咒會額外提供_5點護盾_。
actors.hero.talent.satiated_spells.meta_desc=_如果其他英雄獲得此天賦_，則會在進食後立刻獲得護盾，並在10回合後開始正常衰減。
actors.hero.talent.holy_intuition.title=穢物探測
actors.hero.talent.holy_intuition.desc=_+1:_習得法術_穢物探測_，可耗_3點_充能來得知物品是否被詛咒。\n\n_+2:_習得法術_穢物探測_，可耗_2點_充能來得知物品是否被詛咒。
actors.hero.talent.holy_intuition.meta_desc=_如果其他英雄獲得此天賦_，英雄將有機會在裝備前感測到其詛咒，+1為15%，+2為25%。
actors.hero.talent.searing_light.title=灼熱強光
actors.hero.talent.searing_light.desc=_+1:_牧師對於_發光_的敵人的物理攻擊_傷害+3_。\n\n_+2:_牧師對於_發光_的敵人的物理攻擊_傷害+5_。
actors.hero.talent.searing_light.meta_desc=_如果其他英雄獲得此天賦_，額外傷害將作用於剛受法杖或神器影響的敵人，擁有20回合的冷卻。
actors.hero.talent.shield_of_light.title=光明屏障
actors.hero.talent.shield_of_light.desc=_+1:_習得法術_光明屏障_，可耗1點充能使特定目標對牧師的物理傷害減免_2~4點_5回合。\n\n_+2:_習得法術_光明屏障_，可耗1點充能使特定目標對牧師的物理傷害減免_3~6點_5回合。
actors.hero.talent.shield_of_light.meta_desc=_如果其他英雄獲得此天賦_，來自敵人的物理攻擊將會額外減免1點，機率在+1為33%，+2為50%。

actors.hero.talent.enlightening_meal.title=食點迷津
actors.hero.talent.enlightening_meal.desc=_+1:_牧師進食只需一回合(食用可快速食用的食物不耗回合)，並獲得_0.67點_聖典充能。\n\n_+2:_牧師進食只需一回合(食用可快速食用的食物不耗回合)，並獲得_1點_聖典充能。
actors.hero.talent.enlightening_meal.meta_desc=_如果其他英雄獲得此天賦_，這會使法杖及神器在+1時獲得2回合充能，+2時改為3回合，豐饒之角除外。
actors.hero.talent.recall_inscription.title=符咒召回
actors.hero.talent.recall_inscription.refunded=你的物品奇蹟似的留在手上!
actors.hero.talent.recall_inscription.desc=_+1:_習得法術_符咒召回_，一個可以複製_10回合內_最後使用的卷軸或符石的效果的咒語。\n\n_+2:_習得法術_符咒召回_，一個可以複製_300回合內_最後使用的卷軸或符石的效果的咒語。\n\n不能複製升級卷軸的效果。消耗的充能會因召回的咒術種類而異:符石消耗2點、卷軸3點、秘卷則是4點。如果複製轉化卷軸或者需要用其或升級卷軸製作的道具，消耗量會加倍。
actors.hero.talent.recall_inscription.meta_desc=_如果其他英雄獲得此天賦_，則天賦為+1/+2時，有10%/15%機率返還使用的卷軸或符石。升級卷軸不會被返還。
actors.hero.talent.sunray.title=豔陽光束
actors.hero.talent.sunray.desc=_+1:_習得法術_豔陽光束_，可耗1點充能發射光束對敵人造成_4~8_點傷害並施加失明_4回合_。\n\n_+2:_習得法術_豔陽光束_，可耗1點充能發射光束對敵人造成_6~12_點傷害並施加失明_6回合_。\n\n每個敵人只會被此咒語施加失明一次，但在此技能所致的失明期間再次被擊中的敵人會被麻痺。豔陽光束對惡魔及不死敵人一定會造成最大傷害。
actors.hero.talent.sunray.meta_desc=_如果其他英雄獲得此天賦_，則會在+1/+2時分別使法杖及神器有15%/20%機率致盲目標4回合。
actors.hero.talent.divine_sense.title=神聖感知
actors.hero.talent.divine_sense.desc=_+1:_習得法術_神聖感知_，可耗2點充能以立即賦予自己_8格_內的靈視效果，維持50回合。\n\n_+2:_習得法術_神聖感知_，可耗2點充能以立即賦予自己_12格_內的靈視效果，維持50回合。
actors.hero.talent.divine_sense.meta_desc=_如果其他英雄獲得此天賦_，則會在+1/+2時分別在使用法杖及神器時賦予3/5格的靈視效果。
actors.hero.talent.bless.title=祝福術
actors.hero.talent.bless.desc=_+1:_習得法術_祝福術_，此法術消耗1點充能，對自己施放時賦予_6回合祝福及10點護盾_，對其他單位施放時則賦予_10回合祝福及10點治療_。\n\n_+2:_習得法術_祝福術_，此法術消耗1點充能，對自己施放時賦予_10回合祝福及15點護盾_，對其他單位施放時則賦予_15回合祝福及15點治療_。\n\n治療量溢出時將轉化為護盾。
actors.hero.talent.bless.meta_desc=_如果其他英雄獲得此天賦_，英雄與盟友的精準及閃避加成在+1時會提升3%，+2則為5%。

actors.hero.talent.cleanse.title=淨化術
actors.hero.talent.cleanse.desc=_+1:_習得法術_淨化術_，可耗2點充能消除自己與附近盟友所有的負面效果並給予_10點護盾_。\n\n_+2:_習得法術_淨化術_，可耗2點充能以使自己與附近盟友_對所有的負面效果免疫3回合_並給予_20點護盾_。\n\n_+3:_習得法術_淨化術_，可耗2點充能以使自己與附近盟友_對所有的負面效果免疫5回合_並給予_30點護盾_。
actors.hero.talent.cleanse.meta_desc=_如果其他英雄獲得此天賦_，此天賦改為在+1/+2/+3時使用神器或法杖時有10/20/30%消除所有負面效果。
actors.hero.talent.light_reading.title=咒法背誦
actors.hero.talent.light_reading.desc=_+1:_牧師能在未裝備情況下使用聖典，但充能速度只有_25%_。\n\n_+2:_牧師能在未裝備情況下使用聖典，但充能速度只有_50%_。\n\n_+3:_牧師能在未裝備情況下使用聖典，但充能速度只有_75%_。
actors.hero.talent.light_reading.meta_desc=_如果其他英雄獲得此天賦_，此天賦會在相應等級提升7/13/20%的法杖充能速度。

actors.hero.talent.holy_lance.title=聖光長矛
actors.hero.talent.holy_lance.desc=_+1:_習得法術_聖光長矛_，可耗4點充能投出致命的魔法長矛以對目標造成_30~55點傷害_。\n\n_+2:_習得法術_聖光長矛_，可耗4點充能投出致命的魔法長矛以對目標造成_45~83點傷害_。\n\n_+3:_習得法術_聖光長矛_，可耗4點充能投出致命的魔法長矛以對目標造成_60~110點傷害_。\n\n聖光長矛會對不死族與惡魔造成最高傷害。施放此法術後，有30回合冷卻時間。
actors.hero.talent.hallowed_ground.title=神聖領域
actors.hero.talent.hallowed_ground.desc=_+1:_習得法術_神聖領域_，可以2點充能指定一個位置為中心_3x3區域_化為聖域，維持20回合。\n\n_+2:_習得法術_神聖領域_，可以2點充能指定一個位置為中心_5x5區域_化為聖域，維持20回合。\n\n_+3:_習得法術_神聖領域_，可以2點充能指定一個位置為中心_7x7區域_化為聖域，維持20回合。\n\n施放此法術時，盟友恢復15生命，敵人暫時受到束縛，地面上蔓延出短草。身在神聖領域內的敵人會受到殘疾，身處聖域的盟友每回合恢復1生命。對盟友的恢復效果在祭司上只會化為護盾。神聖領域會被火摧毀，但內部會隨機茂出高草。
actors.hero.talent.mnemonic_prayer.title=祈禱詩篇
actors.hero.talent.mnemonic_prayer.desc=_+1:_習得法術_祈禱詩篇_，耗能1點以立即使可視範圍內的所有人身上的正/負面效果延長_3回合。_\n\n_+2:_習得法術_祈禱詩篇_，耗能1點以立即使可視範圍內的所有人身上的正/負面效果延長_3回合。_\n\n_+3:_習得法術_祈禱詩篇_，耗能1點以立即使可視範圍內的所有人身上的正/負面效果延長_3回合。_\n\n施放此法術不耗時間。此法術也能用於使施加過發光的單位重新發光。對於每個單位上的每種效果只能生效一次，且源於護甲技能的效果不會被延長。

actors.hero.talent.lay_on_hands.title=神聖之觸
actors.hero.talent.lay_on_hands.desc=_+1:_習得法術_神聖之觸_，耗能1點以立即治療附近盟友或給予自己護盾，獲得量為_15_。\n\n_+2:_習得法術_神聖之觸_，耗能1點以立即治療附近盟友或給予自己護盾，獲得量為_20_。\n\n_+3:_習得法術_神聖之觸_，耗能1點以立即治療附近盟友或給予自己護盾，獲得量為_25_。\n\n超額治療將以護盾形式提供。該法術能重複施放，但所給予的護盾，不會超過三次施法所能給予的量。
actors.hero.talent.aura_of_protection.title=防禦力場
actors.hero.talent.aura_of_protection.desc=_+1:_習得法術_防禦力場_，耗能2點以使自身及2格內盟友獲得_20%傷害抗性_及聖騎士護甲_50%刻印力量_20回合。\n\n_+2:_習得法術_防禦力場_，耗能2點以使自身及2格內盟友獲得_30%傷害抗性_及聖騎士護甲_75%刻印力量_20回合。\n\n_+3:_習得法術_防禦力場_，耗能2點以使自身及2格內盟友獲得_40%傷害抗性_及聖騎士護甲_100%刻印力量_20回合。\n\n刻印力量僅限於原先未受益於聖騎士護甲的盟友。
actors.hero.talent.wall_of_light.title=硬光牆
actors.hero.talent.wall_of_light.desc=_+1:_習得法術_硬光牆_，耗能3點以在面前建立一道_3格寬_存在20回合的堅實地形以推開並隔絕敵人。\n\n_+2:_習得法術_硬光牆_，耗能3點以在面前建立一道_5格寬_存在20回合的堅實地形以推開並隔絕敵人。\n\n_+3:_習得法術_硬光牆_，耗能3點以在面前建立一道_7格寬_存在20回合的堅實地形以推開並隔絕敵人。\n\n建置的牆壁能以相鄰的地格為中心放置，但一次只能有一道牆存在。

actors.hero.talent.divine_intervention.title=神力干預
actors.hero.talent.divine_intervention.desc=_+1:_習得法術_神力干預_。在神聖化期間，可施放此法術，把牧師和所有盟友的護盾_設至150_並延長_3回合_的神聖化。\n\n_+2:_習得法術_神力干預_。在神聖化期間，可施放此法術，把牧師和所有盟友的護盾_設至200_並延長_4回合_的神聖化。\n\n_+3:_習得法術_神力干預_。在神聖化期間，可施放此法術，把牧師和所有盟友的護盾_設至250_並延長_5回合_的神聖化。\n\n_+4:_習得法術_神力干預_。在神聖化期間，可施放此法術，把牧師和所有盟友的護盾_設至300_並延長_6回合_的神聖化。\n\n神力干預耗能5點，且在每次神聖化期間，只能施展一次。
actors.hero.talent.judgement.title=終末天譴
actors.hero.talent.judgement.desc=_+1:_習得法術_終末天譴_。神聖化期間，牧師可施放此法術，對可視範圍內敵人造成_10~20_點傷害。\n\n_+2:_習得法術_終末天譴_。神聖化期間，牧師可施放此法術，對可視範圍內敵人造成_15~30_點傷害。\n\n_+3:_習得法術_終末天譴_。神聖化期間，牧師可施放此法術，對可視範圍內敵人造成_20~40_點傷害。\n\n_+4:_習得法術_終末天譴_。神聖化期間，牧師可施放此法術，對可視範圍內敵人造成_25~50_點傷害。\n\n終末天譴耗能3點。牧師在該次神聖化，與自從前次施展終末天譴時，所施的每一次法術，都會使此法術傷害+33%。
actors.hero.talent.flash.title=閃現
actors.hero.talent.flash.desc=_+1:_習得法術_閃現_。神聖化期間，牧師可施放此法術，以傳送最多_3格遠_。\n\n_+2:_習得法術_閃現_。神聖化期間，牧師可施放此法術，以傳送最多_4格遠_。\n\n_+3:_習得法術_閃現_。神聖化期間，牧師可施放此法術，以傳送最多_5格遠_。\n\n_+4:_習得法術_閃現_。神聖化期間，牧師可施放此法術，以傳送最多_6格遠_。\n\n閃現初始耗能2點，在同次神聖化期間的每次施放耗能+1。

actors.hero.talent.body_form.title=自身本質
actors.hero.talent.body_form.desc=習得法術_自身本質_，可耗2點充能，為本體位格灌注已鑑定的武器或護甲上，曾有的附加魔法特性。\n\n_+1:_所選的魔法特性會在三位一體施放時持續生效_20回合。_\n\n_+2:_所選的魔法特性會在三位一體施放時持續生效_27回合。_\n\n_+3:_所選的魔法特性會在三位一體施放時持續生效_33回合。_\n\n_+4:_所選的魔法特性會在三位一體施放時持續生效_40回合。_\n\n本體位格在選擇新的效果時會覆蓋舊有效果。如果選擇的額外特性為強力特性(例如死神附魔)，所需的護甲充能會更高。
actors.hero.talent.mind_form.title=心之所向
actors.hero.talent.mind_form.desc=習得法術_心之所向_，可耗3點充能，為心靈位格灌注之前使用過的投擲武器或法杖。\n\n_+1:_三位一體施放時投射出相應於所選的遠程武器_+3的效果。_\n\n_+2:_三位一體施放時投射出相應於所選的遠程武器_+4的效果。_\n\n_+3:_三位一體施放時投射出相應於所選的遠程武器_+5的效果。_\n\n_+4:_三位一體施放時投射出相應於所選的遠程武器_+6的效果。_\n\n心靈位格在選擇新的效果時會覆蓋舊有遠程武器。
actors.hero.talent.spirit_form.title=明曉真我
actors.hero.talent.spirit_form.desc=習得法術_明曉真我_，可耗4點充能，為精神位格灌注除聖典外其他已鑑定的神器及戒指。\n\n_+1:_三位一體施放時，所選的戒指會以_+1_的等級生效持續20回合，或所選的神器會以_+4_的等級為基準施放相關效果。\n\n_+2:_三位一體施放時，所選的戒指會以_+2_的等級生效持續20回合，或所選的神器會以_+6_的等級為基準施放相關效果。\n\n_+3:_三位一體施放時，所選的戒指會以_+3_的等級生效持續20回合，或所選的神器會以_+8_的等級為基準施放相關效果。\n\n_+4:_三位一體施放時，所選的戒指會以_+4_的等級生效持續20回合，或所選的神器會以_+10_的等級為基準施放相關效果。\n\n精神位格在選擇新的效果時會覆蓋舊有效果。每種神器所需的護甲充能各異。

actors.hero.talent.beaming_ray.title=呼神護衛
actors.hero.talent.beaming_ray.desc=習得法術_呼神護衛_，可耗1點充能，從強化盟友發出可穿牆的光柱，並將盟友傳送至指定的位置。如果目的地有敵人佔據，盟友就會出現在該敵人身旁，並視其為攻擊目標。此法術還可傳送通常不可移動的盟友，但距離減半。\n\n_+1:_呼神護衛有效距離_4格_，並將衆人之力的攻擊加成強化至_+35%_，維持10回合，僅對最靠近該盟友的敵人有效。\n\n_+2:_呼神護衛有效距離_8格_，並將衆人之力的攻擊加成強化至_+40%_，維持10回合，僅對最靠近該盟友的敵人有效。\n\n_+3:_呼神護衛有效距離_12格_，並將衆人之力的攻擊加成強化至_+45%_，維持10回合，僅對最靠近該盟友的敵人有效。\n\n_+4:_呼神護衛有效距離_16格_，並將衆人之力的攻擊加成強化至_+50%_，維持10回合，僅對最靠近該盟友的敵人有效。
actors.hero.talent.life_link.title=生命聯結
actors.hero.talent.life_link.desc=習得法術_生命連結_，可耗2點充能，使牧師與強化的盟友，兩人共同承擔彼此的傷害，並讓不超過三階的法術，施放時也對該盟友有效。\n\n_+1:_生命連結生效_10回合_，並使衆人之力的減傷效果提升至_35%_。\n\n_+2:_生命連結生效_13回合_，並使衆人之力的減傷效果提升至_40%_。\n\n_+3:_生命連結生效_17回合_，並使衆人之力的減傷效果提升至_45%_。\n\n_+4:_生命連結生效_20回合_，並使衆人之力的減傷效果提升至_50%_。
actors.hero.talent.stasis.title=星界投射
actors.hero.talent.stasis.desc=習得法術_星界投射_，可耗2點充能暫時將強化的盟友化為能量，移動到牧師身內，並保留衆人之力與所受的正面效果。星界投射結束後，盟友會出現在自己身旁。在法術生效期間，再施放此法術，能不耗時間提早終止。星界投射可用來運送平時無法移動的盟友，但無法在樓層間運輸。\n\n_+1:_星界投射最久維持_60回合_。\n\n_+2:_星界投射最久維持_90回合_。\n\n_+3:_星界投射最久維持_120回合_。\n\n_+4:_星界投射最久維持_150回合_。\n\n在生效期間，牧師可施放呼神護衛來呼出該盟友，也可施出生命連結，使其在星界投射結束之後立即生效。


#universal
actors.hero.talent.heroic_energy.title=英氣威能
actors.hero.talent.heroic_energy.rat_title=鼠氣威能
actors.hero.talent.heroic_energy.desc=_+1:_英雄護甲的充能消耗量_減少12%_。\n\n_+2:_英雄護甲的充能消耗量_減少23%_。\n\n_+3:_英雄護甲的充能消耗量_減少32%_。\n\n_+4:_英雄護甲的充能消耗量_減少40%_。

actors.hero.talent.ratsistance.title=鼠族抗性
actors.hero.talent.ratsistance.desc=_+1:_敵方鼠化敵人傷害為原先的_90%_。\n\n_+2:_敵方鼠化敵人傷害為原先的_81%_。\n\n_+3:_敵方鼠化敵人傷害為原先的_73%_。\n\n_+4:_敵方鼠化敵人傷害為原先的_65%_。
actors.hero.talent.ratlomacy.title=鼠隻同化
actors.hero.talent.ratlomacy.desc=_+1:_對鼠化敵人再次使用鼠化術以使其成為友軍並固化型態。\n\n_+2:_對鼠化敵人再次使用鼠化術以使其成為友軍並固化型態，再使其獲得_2回合_的激素湧動。\n\n_+3:_對鼠化敵人再次使用鼠化術以使其成為友軍並固化型態，再使其獲得_4回合_的激素湧動。\n\n_+4:_對鼠化敵人再次使用鼠化術以使其成為友軍並固化型態，再使其獲得_6回合_的激素湧動。
actors.hero.talent.ratforcements.title=自備鼠窩
actors.hero.talent.ratforcements.desc=_+1:_對自身施展鼠化術能在周圍生成_1隻_友方老鼠。\n\n_+2:_對自身施展鼠化術能在周圍生成_2隻_友方老鼠。\n\n_+3:_對自身施展鼠化術能在周圍生成_3隻_友方老鼠。\n\n_+4:_對自身施展鼠化術能在周圍生成_4隻_友方老鼠。



###npcs
actors.mobs.npcs.blacksmith.name=巨魔鐵匠
actors.mobs.npcs.blacksmith.intro_quest_warrior=嘿!人類!看來你滿堅定的。
actors.mobs.npcs.blacksmith.intro_quest_mage=嘿!人類!看來你滿機智的。
actors.mobs.npcs.blacksmith.intro_quest_rogue=嘿!人類!看來你滿狡猾的。
actors.mobs.npcs.blacksmith.intro_quest_huntress=嘿!人類!看來妳滿矯捷的。
actors.mobs.npcs.blacksmith.intro_quest_duelist=嘿!人類!看來妳滿勇猛的。
actors.mobs.npcs.blacksmith.intro_quest_cleric=嘿!人類!看來你滿莊重的。
actors.mobs.npcs.blacksmith.intro_quest_start=不想當個沒用的廢物，嗯?我有個活能讓你幹。我在仄舊礦坑上建了仄個鐵匠鋪，再建了蠟梯子連通兩地。你給我拿著仄鎬子然後給我挖點在礦坑裡的_暗金礦，40塊_就夠了。蠟裏的岩石不太堅硬，_用些力甚至能挖牆_。\n\n怎麼?要我報答你?你仄貪婪的渾帳!……\n\n呃，好吧，我雖然沒錢付給你，但我可以給你打些鐵。想想你運氣有多好吧，我可是仄附近唯一的鐵匠。
actors.mobs.npcs.blacksmith.intro_quest_crystal=你也要小心點，這礦坑對你們仄種懦弱的種族來說太危險了。礦坑廢棄太久了，長了堆水晶出來。它們或許很閃亮，但太脆弱了，對我來說沒路用。還有些魔法造物守在蠟。它們非常難纏，所以_注意你挖礦的位置_，別讓它們從被壞的水晶牆縫隙發現你。\n\n底下_有塊水晶非常巨大_，它也更硬。想挖下它注定是場硬仗，但拆了它可以使水晶長慢些，我也會給你更多報酬。
actors.mobs.npcs.blacksmith.intro_quest_gnoll=你也要小心點，這礦坑對你們仄種懦弱的種族來說太危險了。一些豺狼人早搶了蠟礦坑，他們也想要蠟些暗金礦。蠟群不知道挖礦是什麼的笨蛋搞得礦坑嚴重崩塌，所以你得自己找路了，記住了，_崩塌地點附近絕對會有岩石落下_。\n\n我記得有隻領頭惹了最多麻煩，聽起來像是位_地動法師_吧。把它給宰了的話，我能給你更多報酬，但我肯定它會還手。
actors.mobs.npcs.blacksmith.intro_quest_fungi=你也要小心點。這礦坑對你們仄種懦弱的種族來說太危險了。有很多什麼蘑菇怪物的，在蠟底下生長。他們哨衛的攻擊很危險。被它們看到，開始攻擊你，你就差不多了。如果你想活著上來，_就不要被他們看到_。\n\n如果你能砍死_最大的蘑菇_，我就會多給報酬。但要砍蘑菇也不容易。蠟蘑菇與藏在牆內的菌絲節點相連。你要先把大部分的節點砍掉，對大蘑菇的攻擊才會有傷害。
actors.mobs.npcs.blacksmith.reminder=還想浪費我的時間?入口就在蠟邊。
actors.mobs.npcs.blacksmith.reminder_crystal=帶多點暗金礦回來，並試著把蠟巨型水晶給我拆了。
actors.mobs.npcs.blacksmith.reminder_gnoll=帶多點暗金礦回來，順便設法把蠟該死的渾帳地動師給斬了。
actors.mobs.npcs.blacksmith.reminder_fungi=帶多點暗金礦回來，再試著把蠟株巨型蘑菇連根拔起。
actors.mobs.npcs.blacksmith.lost_pick=開玩笑喔?阿我鎬子咧?!
actors.mobs.npcs.blacksmith.quest_start_prompt=準備好下去了?先檢查是否有留空間裝暗金礦。\n\n還有，_我只准你下去一次!_
actors.mobs.npcs.blacksmith.enter_yes=我準備好了
actors.mobs.npcs.blacksmith.enter_no=還沒
actors.mobs.npcs.blacksmith.exit_warn_none=仄麼快?我看你根本沒在挖!聽好了，暗金礦。_40塊_。說真的，有蠟麼難?!\n\n_別忘了，你上來後我可不會放你再下去。_
actors.mobs.npcs.blacksmith.exit_warn_low=仄麼快?總覺得你挖到的不是很多。至少也挖個_40塊_吧。\n\n_別忘了，你上來後我可不會放你再下去。_
actors.mobs.npcs.blacksmith.exit_warn_med=完成了?我看得出來你有努力在挖，但下面絕對有更多。而且我說過我要_40塊_。\n\n_別忘了，你上來後我可不會放你再下去。_
actors.mobs.npcs.blacksmith.exit_warn_high=完成了?雖然你的收穫不錯，但我相信你能再多挖一點，挖個_40塊_我就不跟你計較。\n\n_別忘了，你上來後我可不會放你再下去。_
actors.mobs.npcs.blacksmith.exit_warn_full=完成了?仄些暗金礦的確夠用了，但你千萬別在下面弄丟了些甚麼東西。\n\n_別忘了，你上來後我可不會放你再下去。_
actors.mobs.npcs.blacksmith.exit_warn_crystal=那巨型水晶似乎還在影響礦坑，把它給拆了，我會給你更多報酬。
actors.mobs.npcs.blacksmith.exit_warn_gnoll=那地動法師聽起來還在下面做亂，幫我宰了它，我會給你更多報酬。
actors.mobs.npcs.blacksmith.exit_warn_fungi=那巨型蘑菇還在下面。把它殺了，我會給你更多報酬。
actors.mobs.npcs.blacksmith.exit_yes=做完了
actors.mobs.npcs.blacksmith.exit_no=還沒
actors.mobs.npcs.blacksmith.get_lost=我很忙。給我滾!
actors.mobs.npcs.blacksmith.entrance_blocked=下去的路被堵死了。
actors.mobs.npcs.blacksmith.cant_enter_old=這個附加區域在這場遊戲不可用。創個新局以嘗試更新後的洞穴任務!
actors.mobs.npcs.blacksmith.def_verb=格擋
actors.mobs.npcs.blacksmith.desc=這隻巨魔鐵匠看起來和其他巨魔長的一樣:又高又瘦，而且皮膚的外觀和材質都和石頭非常類似。這隻巨魔鐵匠正拿著小得離譜的工具不停的敲敲打打。

actors.mobs.npcs.ghost.name=悲傷幽靈
actors.mobs.npcs.ghost.rat_1=你好，%s……曾經我像你一樣——既強大又自信……但我被一隻邪惡的野獸殺死了……在我完成我的復仇之前……我不能離開這個地方……殺死_腐臭老鼠_，就是牠奪走了我的生命……\n\n牠就在這層……四處散播污穢……_小心牠身邊的臭雲以及牠帶有腐蝕性的撕咬，牠產生的腐蝕黏液可溶於水……_
actors.mobs.npcs.ghost.rat_2=請幫助我……殺了那隻令人憎惡的東西……\n\n_在水附近與牠戰鬥……別吸入牠發出的臭氣……_
actors.mobs.npcs.ghost.gnoll_1=你好，%s……曾經我像你一樣——既強大又自信……但我被一位狡猾的敵人殺死了……在我完成我的復仇之前……我不能離開這個地方……殺死_豺狼詭術師_，就是牠奪走了我的生命……\n\n牠與其他豺狼不同……牠會隱藏自己並使用投擲武器……_小心牠的毒飛鏢和火飛鏢，盡可能以近戰為主……_
actors.mobs.npcs.ghost.gnoll_2=請幫助我……殺了那位狡詐的傢伙……\n\n_別讓牠打到你……離牠越近越好……_
actors.mobs.npcs.ghost.crab_1=你好，%s……，曾經我像你一樣——既強大又自信……但我被一隻古老的生物殺死了……在我完成我的復仇之前……我不能離開這個地方……殺死_巨鉗螃蟹_，就是它奪走了我的生命……\n\n牠經歷了無數歲月的洗禮……長了一支巨大的蟹鉗和非常厚重的蟹殼……_注意它的蟹鉗，你必須偷襲這隻巨蟹，否則它會用鉗子格擋你的攻擊……_
actors.mobs.npcs.ghost.crab_2=請幫助我……殺了那隻難纏甲殼類……\n\n_如果你的攻擊太明顯……牠就會擋住你所有的攻擊……_
actors.mobs.npcs.ghost.find_me=謝謝你……來找我吧……
actors.mobs.npcs.ghost.desc=這個幽靈幾乎不能被看見。它看起來像是由一片無形的昏暗光斑和一張悲痛的面孔所組成的。

actors.mobs.npcs.imp.name=野心勃勃的小惡魔
actors.mobs.npcs.imp.intro=你是一名冒險家嗎? 我最愛冒險家了! 在需要殺掉什麼的時候他們總是最可靠了，我說的沒錯吧? 報酬?當然有啦 ; )
actors.mobs.npcs.imp.golems_1=總之，我需要你殺一些_魔像_。 你看，我要在這裡開始搞點小本生意，但這些愚蠢的傀儡只會毀掉我的生意! 跟這些發著光的大個子花崗岩根本沒法交流，真是該死! 所以殺死……我想想，_4個魔像_，然後獎勵就是你的了。
actors.mobs.npcs.imp.monks_1=總之，我需要你殺一些_武僧_。 你看，我要在這裡開始搞點小本生意，但這些瘋子不買任何東西還會嚇跑顧客。 所以殺死……我想想，_5位武僧_，然後獎勵就是你的了。
actors.mobs.npcs.imp.golems_2=喔，你還活著!我就知道你的頭比它們更硬; ) 只要別忘了撿走它們的徽記就好。
actors.mobs.npcs.imp.monks_2=喔，你還活著!我就知道你的功夫比他們更強; ) 只要別忘了撿走他們的徽記就好。
actors.mobs.npcs.imp.cya=我們會再見面的，%s!
actors.mobs.npcs.imp.hey=喂喂喂，%s!
actors.mobs.npcs.imp.desc=小惡魔是一種低等惡魔。它們既沒有強大的力量也沒有魔法天賦，但他們相當聰明而且善於交際。許多小惡魔都喜歡生活在沒有其他惡魔存在的地方。

actors.mobs.npcs.impshopkeeper.name=野心勃勃的小惡魔
actors.mobs.npcs.impshopkeeper.greetings=你好啊，%s!
actors.mobs.npcs.impshopkeeper.greetings_ascent=你在樓下到底在搞了什麼鬼，%s? 快買些東西，我可不想待在這裡太久!
actors.mobs.npcs.impshopkeeper.thief=我以為我可以相信你!
actors.mobs.npcs.impshopkeeper.buyback=小惡魔爽快地退還了你的物品。
actors.mobs.npcs.impshopkeeper.desc=這小惡魔在大廳深處的入口擺了一個小商店。能看見友善的臉是不錯，但商品價格可是一點都不友好。

actors.mobs.npcs.mirrorimage.name=鏡像
actors.mobs.npcs.mirrorimage.desc=這個幻象看起來與你極度相似，看起來還和你有著一樣的武器和護甲。\n\n鏡像會自己尋找敵人並用你的武器的仿冒品攻擊它們。仿冒品的特性和你的一樣，只是威力較低。鏡相一開始是幾乎隱形的，但必須使用更容易被看見的型態才能攻擊。\n\n雖然鏡像的攻擊力相當不錯，但完全不能承受攻擊，會馬上消失。
actors.mobs.npcs.mirrorimage.discover_hint=此盟友為閱讀某種卷軸後產生的角色。

actors.mobs.npcs.npc.discover_hint=此敵人在地下城某一區現身。

actors.mobs.npcs.prismaticimage.name=虹彩幻影
actors.mobs.npcs.prismaticimage.desc=這個閃爍著虹彩的幻影和你非常相似，甚至還裝備著你目前的武器和護甲。\n\n虹彩幻影將通過吸引敵人的方式來利用它的護甲和生命保護你。雖然它沒有和鏡像一樣有攻擊性，但它有更高的生命值，以及和你一樣的護甲。\n\n當幻影生命降至0時，它在幾回合後才會消逝，在此期間仍能被治療。在周圍沒有敵人時，幻影便會回到主人身邊。
actors.mobs.npcs.prismaticimage.discover_hint=此盟友為閱讀某種卷軸後產生的角色。

actors.mobs.npcs.ratking.name=鼠王
actors.mobs.npcs.ratking.not_sleeping=我可不是在睡覺!
actors.mobs.npcs.ratking.what_is_it=現在又怎麼了?我可沒時間管這些破事。我的王國可不會自己運轉下去!
actors.mobs.npcs.ratking.confused=這……我這是在哪? 我的王國需要我!
actors.mobs.npcs.ratking.crown_clothes=把衣服穿上!我可不會批准你與我會面!
actors.mobs.npcs.ratking.crown_desc=哇喔!那王冠是給我的嗎?那看起來比我的閃亮多了，那我就好心好意的收下了!\n\n我正在想我能給你點獎賞……一種使你如同英雄的強大能力如何?
actors.mobs.npcs.ratking.crown_yes=當然!
actors.mobs.npcs.ratking.crown_info=什麼能力?
actors.mobs.npcs.ratking.crown_no=還是算了……
actors.mobs.npcs.ratking.crown_thankyou=嘿嘿嘿嘿，多謝了!現在就去使我以你為傲吧!
actors.mobs.npcs.ratking.crown_fine=好吧!反正我也不太想要那個閃閃發光的皇冠……
actors.mobs.npcs.ratking.crown_after=喜歡你的新衣服嗎? 別想提退貨!
actors.mobs.npcs.ratking.desc_crown=這隻老鼠比普通的大一點。牠戴著矮人國王的皇冠。
actors.mobs.npcs.ratking.desc_birthday=這隻老鼠比普通的大一點。牠戴著一頂很小的綠色派對帽，而不是它通常戴的皇冠。\n生日快樂!鼠王!
actors.mobs.npcs.ratking.desc_winter=這隻老鼠比普通的大一點。牠戴著一頂和節日很配的小號帽子，而不是它通常戴的皇冠。佳節愉快!
actors.mobs.npcs.ratking.desc=這隻老鼠比普通的大一點。牠戴著一頂很小的皇冠。
actors.mobs.npcs.ratking.discover_hint=此角色藏身於地下城某區的頭目樓層。

actors.mobs.npcs.sheep.name=綿羊
actors.mobs.npcs.sheep.baa!=咩!
actors.mobs.npcs.sheep.baa?=咩?
actors.mobs.npcs.sheep.baa.=咩。
actors.mobs.npcs.sheep.baa...=咩…
actors.mobs.npcs.sheep.def_verb=格擋
actors.mobs.npcs.sheep.desc=這是一隻魔法綿羊。為什麼叫牠魔法綿羊?因為你殺不死牠。牠只會站在那裡直到牠消失，牠會做的事情只有邊反芻邊對你翻白眼。
actors.mobs.npcs.sheep.discover_hint=此角色可被某種物品與陷阱召喚。

actors.mobs.npcs.shopkeeper.name=店主
actors.mobs.npcs.shopkeeper.thief=小偷，小偷!
actors.mobs.npcs.shopkeeper.warn=小心點!下次我可不原諒你!
actors.mobs.npcs.shopkeeper.flee=店主把店給關了!
actors.mobs.npcs.shopkeeper.sell=出售物品
actors.mobs.npcs.shopkeeper.talk=交談
actors.mobs.npcs.shopkeeper.buyback=店主不情願地退還了你的物品。
actors.mobs.npcs.shopkeeper.talk_prison_intro=我這裡有一切冒險的必需品!
actors.mobs.npcs.shopkeeper.talk_prison_warrior=你那紋章還真有趣，居然不是完整的。難道你受到了恥辱還是甚麼的……好啦，我對那沒興趣，我只想要你的錢。
actors.mobs.npcs.shopkeeper.talk_prison_mage=嘻嘻，我好像在城裡某處見過你的通緝令，看來我們都在逃亡，嗯?所以你說這是不實指控?當然了，我這位逃犯朋友……別緊張，比起舉報你，我還有更值得做的事，只要你買些東西作為封口費……
actors.mobs.npcs.shopkeeper.talk_prison_rogue=是盜賊公會叫你來清理這地方的嗎?不是?只是來買東西的?你是殺了幾隻怪。可不要指望我會給你算便宜點——我已經交了大筆的保護費，但我還是經常要自己動手!
actors.mobs.npcs.shopkeeper.talk_prison_huntress=這看起來不是您該待的地方啊，小姐。狹窄的地下空間可沒有長廊或都市外的森林寬廣，不是嗎? 哈哈，別理我，只是在碎碎念而已。何不買點什麼呢?
actors.mobs.npcs.shopkeeper.talk_prison_duelist=哦，這不是正在旅行的大英雄嗎!如果你要再來拯救另一個小鎮的話，那只能祝你好運了。這裡的危險跟地上的小土匪根本沒得比。我很確定你能做的比任何人都還要好，但拜託不要死在我店門口。
actors.mobs.npcs.shopkeeper.talk_prison_cleric=唉呦，是殿下啊，現在又升遷成聖下啦?嘻嘻，這裡有個更好的問題:你工作不好好做來這做啥?你應該知道你的死對那些信徒可是重大打擊吧。不如這樣吧:我相信你在上層絕對有撿到錢，你把那些對你沒用的穢物給我，我給你些能讓你活著出去的東西，意下如何?
actors.mobs.npcs.shopkeeper.talk_caves=花錢，是為了走更長遠的路。\n\n喔，還有，如果你在底下見到我那巨魔老友，替我向他問好。順便催那塊石頭把上禮拜槌子的錢給我結清!
actors.mobs.npcs.shopkeeper.talk_city=我的商品可以保證你在這裡的安全。\n\n但拜託不要在這裡閒晃。我不知道花了多久才讓這邊的"居民"不靠近我，我可不想要你帶來更多麻煩!
actors.mobs.npcs.shopkeeper.talk_halls=哈嘍!我為了獵魔人準備了特別的優惠!\n\n對了，下去時可要小心點!底下的惡魔可不管你有多勇敢。如果你死了就沒辦法回來花更多錢啦! ; )\n那些惡魔和我像嗎? 嘿嘿，當然不是。我只是一個小家伙，不會打架，還保住了我的意識。底下的惡魔都非常強，還被奴化了，是被……呃，總之下去時小心點。
actors.mobs.npcs.shopkeeper.talk_ascent=無論你想要拿護符做什麼，我可不想與你有所瓜葛。要買東西就快點，我們都該走人了!
actors.mobs.npcs.shopkeeper.desc=這位矮胖的傢伙看起來更適合在某些大城市裡做買賣而不是這種地下城。這些商品的價格解釋了為什麼他會喜歡在這地方做生意。

actors.mobs.npcs.wandmaker.name=老杖匠
actors.mobs.npcs.wandmaker.intro_warrior=啊，你好啊!能在這種令人憂愁的地方遇見來自北方的英雄可真是令人高興啊!來到這裡肯定要走很遠吧。如果你想要冒險的話，我可以交給你一個任務。
actors.mobs.npcs.wandmaker.intro_rogue=天哪，你嚇了我一跳!在這裡這麼久你是我見過的第一個尚有理智的強盜，所以你肯定是從地表下來的!如果你願意幫助我這樣一名陌生人的話，這有一個任務或許你能幫上忙。
actors.mobs.npcs.wandmaker.intro_mage=哦，你好啊%s!我好像聽說你在法師學院那裡搞了不少麻煩?算了這沒關係，反正我也不喜歡那些墨守成規的榆木腦袋。如果你願意的話，我這有個任務可以讓你幫忙。
actors.mobs.npcs.wandmaker.intro_huntress=啊，你好啊小姐!能在地下看到這樣一張友好的面孔真是個驚喜，不是嗎?事實上，我發誓我曾經見過你的臉，可惜我有點記不清你是誰了……哦算了，別在意。如果你要在這裡冒險的話，我有一個任務能交給你做。
actors.mobs.npcs.wandmaker.intro_duelist=啊，你好啊小姐!能在這片壓抑的地方遇見一位英雄可真是個驚喜!如果你願意幫助我這個老人家脫離苦海的話，你可以幫我做件事。
actors.mobs.npcs.wandmaker.intro_cleric=噢，高貴的聖下啊!能在這種令人沮喪的地方見到您真是我的榮幸!我可不想干擾一位聖人，但我現在真的需要您的幫忙。
actors.mobs.npcs.wandmaker.intro_1=\n\n我來這裡尋找一種製作法杖所需的稀有材料，但我迷路了，而且身上的魔法盾也在慢慢變弱。我必須馬上離開這裡，但我不想空手而出。
actors.mobs.npcs.wandmaker.intro_dust=我在尋找一些_屍骨灰燼_。這是一種通常出現在這種地方的特殊詛咒骨灰。它應該就在附近某個被隔住的房間裡，我很肯定你能在那裡找到一些灰燼。不過要小心，灰燼上的詛咒相當強大，_盡快將它帶回來_，我會淨化其中的詛咒。
actors.mobs.npcs.wandmaker.intro_ember=我在尋找從新生火元素上取得的_元素餘燼_。這種元素通常會在失控的招喚儀式中出現，要召喚它們，只需一些蠟燭與祭儀場地，就可以了。然而，_與它們近戰不是好主意——善用能冰涷的道具對付它們會更有用_。新生火元素混亂且強大，但耐不了冷。
actors.mobs.npcs.wandmaker.intro_berry=這個監獄的老典獄長養著一株_腐莓_，它的種子就是我一直要尋找的東西。經過如此長的時間這株植物很可能已經變異，所以要取得它的種子可能會很棘手。它的花園應該就在這裡的某個地方。如果你想活著回來的話，試著_遠離那些觸手_。放火燒死它聽起來很有用，但請別這麼做，種子會與腐苺一起燒掉。
actors.mobs.npcs.wandmaker.intro_2=\n\n如果你願意幫我拿到它，我很願意將自己的一把精製法杖交給你!我帶了兩把過來，所以你可以選擇自己想要的法杖。
actors.mobs.npcs.wandmaker.reminder_dust=灰燼找得怎麼樣了，%s?試著尋找一些_障礙物_。
actors.mobs.npcs.wandmaker.reminder_ember=餘燼找得怎麼樣了，%s?你需要找到_四根蠟燭_和一個_儀式場地_。
actors.mobs.npcs.wandmaker.reminder_berry=腐莓種子找得怎麼樣了，%s?它就在一個_充滿植被的房間_裡。
actors.mobs.npcs.wandmaker.def_verb=格擋
actors.mobs.npcs.wandmaker.desc=這位老先生的表情看起來十分困擾。他正被力場保護著。



###mobs
actors.mobs.acidic.name=酸液魔蠍
actors.mobs.acidic.desc=這些巨大的節肢類惡魔生物會盡可能避免一切近距離接觸，並且會在遠處射出能夠致殘的尖刺。牠的身上甚至還滴落著腐蝕淤泥。

actors.mobs.albino.name=白化老鼠
actors.mobs.albino.desc=這是一種稀有的老鼠，有著純白色的毛皮和鋸齒狀的牙齒。
actors.mobs.albino.discover_hint=此罕見敵人只在地下城某區域現身。

actors.mobs.armoredstatue.name=裝甲石像
actors.mobs.armoredstatue.desc=你以為這隻是地下城裡的另一尊靜止石像，但它發出紅光的眼睛讓你知道這可沒這麼簡單。\n\n雕像裝備著精良的護甲，看上去相當堅硬很難對付。
actors.mobs.armoredstatue.desc_arm_wep=儘管雕像本身是用石頭做的，但它裝備著的_%1$s_和_%2$s_看起來像是真的。

actors.mobs.bandit.name=瘋狂強盜
actors.mobs.bandit.desc=這種穿著顯眼紫色長袍的傢伙可謂是小偷中的精英。但就算他們技術高超，也仍像其他任何人一樣失去理智。\n\n在偷走財物的同時，他們也會弄瞎你、打殘你、然後再對你灌毒素!但他們身上絕對比其他小偷更有可能擁有些財物。

actors.mobs.bat.name=吸血蝙蝠
actors.mobs.bat.desc=這些敏捷且堅韌的洞穴穹頂生物比看上去可怕得多。牠們會通過每次成功的攻擊來恢復生命，從而擊敗比牠們大得多的對手。

actors.mobs.bee.name=金黄蜜蜂
actors.mobs.bee.desc_honey=儘管牠們體積小，但金色蜜蜂對牠們的家園有著強烈的保護慾。不過這一隻看起來十分平靜，而且還想跟著你。
actors.mobs.bee.desc=儘管它們體積小，但金色蜜蜂有著強烈的保護家園的慾望。這隻蜜蜂非常瘋狂，最好和它保持距離。
actors.mobs.bee.discover_hint=此角色可被某種物品召喚。

actors.mobs.brute.name=豺狼暴徒
actors.mobs.brute.enraged=激怒
actors.mobs.brute.def_verb=格擋
actors.mobs.brute.desc=暴徒是豺狼人中體型最龐大、力量最強壯且生命力最頑強的精英。在因傷致死前，他們會陷入瘋狂之中，獲得暫時的護盾和極高的傷害加成。
actors.mobs.brute$bruterage.name=豺狼狂暴
actors.mobs.brute$bruterage.desc=這位豺狼暴徒的死亡已經不可避免，但牠想拉你一起陪葬! \n\n時間的推移或是外界的傷害都會消磨護盾。在護盾消散殆盡之際，暴徒會徹底消亡。然而，一定要小心，在這一階段牠會造成巨額傷害!\n\n剩餘的護盾:%d。

actors.mobs.causticslime.name=蝕黑史萊姆
actors.mobs.causticslime.desc=這個史萊姆似乎已經被地底滲透的黑暗能量完全侵蝕了。它已經失去了體表原有的綠色光澤，並且在不斷滴落腐蝕淤泥。
actors.mobs.causticslime.discover_hint=此罕見敵人只在地下城某區域現身。

actors.mobs.crab.name=巨型螃蟹
actors.mobs.crab.desc=這些巨型的螃蟹位居下水道食物鏈的頂端。它們行動極其迅速且其厚重的甲殼能承受沉重的打擊。

actors.mobs.crystalguardian.name=水晶守衛
actors.mobs.crystalguardian.def_verb=格擋
actors.mobs.crystalguardian.desc=如果這些巨大的水晶守衛沒有發光的雙眼，你一定會把它們錯看成雕像。他們的水晶身體雖然不靈活，但十分堅固。所以，最好不要打擾它們在水晶巢內的酣眠。\n\n他們受制於龐人的身驅，在狹窄處的移動速度比平時慢了許多。但此身驅也使他們無法被擊殺。就算它們生命值歸零，在恢復一陣子之後，就會再次行動。
actors.mobs.crystalguardian.discover_hint=此敵人在特定任務中出現。

actors.mobs.crystalmimic.name=水晶寶箱怪
actors.mobs.crystalmimic.ate=水晶寶箱怪吃掉了你的%s!
actors.mobs.crystalmimic.escaped=水晶寶箱怪逃跑了!
actors.mobs.crystalmimic.desc=寶箱怪是一種能隨意改變外形的魔法生物。在地下城裡牠們幾乎總會以寶箱形態出現，因為這樣更能吸引毫無防備的冒險家。\n\n水晶寶箱怪相比於它們的近親更為狡猾，會奪取財寶並盡量避免爭鬥。牠們會在被發現後試圖迅速逃離，還能在攻擊時將敵人傳送到別處。

actors.mobs.crystalspire.name=水晶尖塔
actors.mobs.crystalspire.warning=這塊水晶在你攻擊的同時晃動。如果繼續下去，必將引起注意……
actors.mobs.crystalspire.alert=震動越來越大，並導致整個洞窟晃動!
actors.mobs.crystalspire.desc=這塊巨大又極為堅固的水晶大概就是這個洞窟內所有水晶化生物的來源了。 一般的武器對其完全沒有效果，所以只能用你的礦鎬將其擊碎。\n\n在開始破壞它之前最好先做好準備。要敲碎如此巨大的水晶會花上好一段時間，而且不太可能在過程中不被打擾。就連這個尖塔本身都可能有一定的防禦手段。_也許其攻擊可以用來對付它的造物?_
actors.mobs.crystalspire.discover_hint=此敵人在特定任務中出現。

actors.mobs.crystalwisp.name=水晶之靈
actors.mobs.crystalwisp.beam_kill=水晶的稜光將你照昏……
actors.mobs.crystalwisp.desc=一小塊在空中發著光芒的水晶，看起來有點生氣。雖然稱不上強，但它們可以對你發射能造成傷害的光束，只要路徑上沒有障礙物。\n\n水晶之靈的體積允許它們穿過地上長出來的水晶塊，但們的遠程攻擊無法穿過去。
actors.mobs.crystalwisp.discover_hint=此敵人在特定任務中出現。

actors.mobs.demonspawner.name=惡魔血巢
actors.mobs.demonspawner.on_death=此處的惡魔能量似乎隨著血巢的毀滅而有所減弱。
actors.mobs.demonspawner.desc=這一團蠕動著的矮人血肉在利用慘死於這一區域的矮人源源不斷地製造惡魔撕裂者。看來惡魔們為了對付入侵者可以不擇手段。\n\n惡魔血巢雖然看上去非常恐怖，但它本身不具備移動或攻擊能力。不過它龐大的體積使得它難以被迅速殺死，而且它在受到威脅時會加速產出惡魔撕裂者。\n\n_惡魔血巢似乎都與某個提供惡魔能量的源頭相連。殺死它們或許能夠弱化那個源頭。 _

actors.mobs.dm100.name=DM-100
actors.mobs.dm100.zap_kill=你因觸電身亡……
actors.mobs.dm100.desc=DM-100是一種矮人"防衛機械"的早期機型，用來保護下層礦洞中的矮人礦工。 然而由於電擊威力不足，它們之後被送給上層的人類住處。然後再閒置了數年後被送到了監獄，雖然典獄長起初認為DM-100太過殘忍而沒有啟用，但隨著時間推移，囚犯變得越來越難以控制，這使得DM-100成為了監獄的必備品。

actors.mobs.dm200.name=DM-200
actors.mobs.dm200.vent=DM-200噴射了一團有毒的廢氣!
actors.mobs.dm200.desc=DM-200 是矮人研發的第二代"防衛機械"，最初用來保護礦洞中的矮人礦工與下方的城市。比起第一代它們相當龐大笨重，並利用強力的液壓衝錘碾壓入侵者。 \n\n臃腫的體型是它們的一大缺陷: 它們無法進入狹窄的門與過道。為了彌補靈活性的缺陷，矮人們設計了另一種功能: DM-200 能向遠處的或是它們無法觸及的敵人噴射有毒的廢氣。

actors.mobs.dm201.name=DM-201
actors.mobs.dm201.vent=DM-201 投出了一枚腐蝕煙霧彈!
actors.mobs.dm201.desc=矮人們曾做過一些圍繞 DM-200 的機動性缺陷展開的實驗，並根據此設計製造了一批定點的 DM 系列機器。DM-201 是經過改裝的 DM-200，其作為哨戒炮塔完全沒有移動能力。作為交換，DM-201 們的堅固程度與攻擊能力都得到了顯著的提升。\n\n由於 DM-201 們並沒有引擎來排放廢氣，矮人給它們裝備了酸蝕煙霧彈投擲器!不過，DM-201 對煙霧彈的使用很謹慎，只有在受到來自遠處的攻擊時才會向敵人投擲煙霧彈。

actors.mobs.dm300.name=DM-300
actors.mobs.dm300.notice=偵測到未授權單位!
actors.mobs.dm300.shield=DM-300 從外露的管線中抽取能量，生成屏障裹住自身!
actors.mobs.dm300.charging=受到傷害! 正在啟動能源塔!
actors.mobs.dm300.charging_hint=DM-300 在接受能源塔供電時無法受到傷害!
actors.mobs.dm300.supercharged=毀滅! 毀滅! 毀滅!
actors.mobs.dm300.charge_lost=能源塔損毀! 正在切回自身電源!
actors.mobs.dm300.pylons_destroyed=警告! 檢測到電網故障!
actors.mobs.dm300.rankings_desc=被DM-300碾碎
actors.mobs.dm300.def_verb=格擋
actors.mobs.dm300.defeated=嚴重錯誤! 正在嘗試關 ——
actors.mobs.dm300.desc=DM-300 是矮人們有史以來發明的最強大的"防衛機械"。這樣一台令人生畏的機器是極難製造的，所以矮人們僅僅造出了幾台來守護他們地下大都會的入口。\n\n它配備了可以噴出劇毒廢氣的通風口，以及一個可以用來攻擊和破壞大地的高功率鑽頭。DM-300 還可以連接到能源電網，進一步增強它的力量。
actors.mobs.dm300.desc_supercharged=DM-300機體上充滿了電力。在此形態下，DM-300免疫一切傷害，並且移動速度加倍。它的電鑽轉速也_快到能鑽洞_，但移動速度會減慢。\n\n攻擊過載的DM-300毫無意義，但此地必定_有裝置提供其所需的電力_。摧毀此裝置也許能削弱它。

actors.mobs.dwarfking.name=矮人國王
actors.mobs.dwarfking.notice=好大的膽子! 你根本不知道自已在做甚麽!
actors.mobs.dwarfking.lifelink_1=把你的命交出來!奴隸!
actors.mobs.dwarfking.lifelink_2=奴隸，為我犧牲吧!
actors.mobs.dwarfking.teleport_1=奴隸，捉住這人!
actors.mobs.dwarfking.teleport_2=奴隸，給我包圍他!
actors.mobs.dwarfking.wave_1=夠了!挺身而戰!奴隸們!
actors.mobs.dwarfking.wave_2=輪到你們了! 統統給我上!
actors.mobs.dwarfking.wave_3=一群廢物!來人!把他的頭給我拿來!
actors.mobs.dwarfking.enraged=你休過我這關，%s，我! 是! 永生者!
actors.mobs.dwarfking.losing=不!你不可以這樣做……你不知道下面藏著什麼……
actors.mobs.dwarfking.defeated=你……把我們滅了會……
actors.mobs.dwarfking.rankings_desc=跪倒在矮人國王御前
actors.mobs.dwarfking.desc=許多年前，矮人議會中一名最強的巫師洞察了凌駕於生死之上的秘術。很快他就藉助這種強大的力量，控制、腐化了王室與整個議會，並將魔爪伸向王國中的每一名矮人。現在他成為了矮人都城的國王，統領著數量龐大的死靈。\n\n矮人國王是極度激進的強敵，他會試圖利用其手下的死靈大軍壓制入侵者。
actors.mobs.dwarfking$dkghoul.rankings_desc=跪倒在矮人國王御前
actors.mobs.dwarfking$dkmonk.rankings_desc=跪倒在矮人國王御前
actors.mobs.dwarfking$dkwarlock.rankings_desc=跪倒在矮人國王御前
actors.mobs.dwarfking$dkgolem.rankings_desc=跪倒在矮人國王御前

actors.mobs.ebonymimic.name=黑檀寶箱怪
actors.mobs.ebonymimic.reveal=那裡有個寶箱怪!
actors.mobs.ebonymimic.hidden_name=可疑的輪廓
actors.mobs.ebonymimic.hidden_desc=那裡似乎有些什麼，但它幾乎是完全透明的。
actors.mobs.ebonymimic.desc=寶箱怪是一種能隨意改變外形的魔法生物。在地下城裡牠們幾乎一直以寶箱形態出現，因為這樣總能吸引毫無防備的冒險家。\n\n黑檀寶箱怪是所有寶箱怪當中最狡猾的，他們的能力能將自己做到幾乎隱形。他們喜歡躲藏在冒險家可能會與之互動的東西上，但它裡面其實也有些東西。在其他方面上或許跟普通寶箱怪無異，但它的伏擊可比其它同類致命許多。
actors.mobs.ebonymimic.discover_hint=此敵人只在英雄持有某飾品時現身。

actors.mobs.elemental$fireelemental.name=烈火元素
actors.mobs.elemental$fireelemental.desc=元素生物是一種由於施放強大魔法時的失誤產生的混沌生物。元素生物缺乏智能，且通常與一種特定的魔法密切相關。\n\n火元素是一種藉助火焰之力攻擊的常見元素生物。在近戰時牠能使得目標燃起大火，對付遠處的敵人也能偶爾向目標發射火球。
actors.mobs.elemental$newbornfireelemental.name=新生火元素
actors.mobs.elemental$newbornfireelemental.charging=火元素正在蓄力!
actors.mobs.elemental$newbornfireelemental.desc=元素生物是一種由於施放強大魔法時的失誤產生的混沌生物。元素生物缺乏智能，且通常與一種特定的魔法密切相關。\n\n雖然此元素才剛被召喚，但仍非常危險!
actors.mobs.elemental$newbornfireelemental.desc_boss=由於其召喚方式的渾沌性質，這個元素只能在花時間蓄力後發射不太準確的攻擊，留下一小片火海。
actors.mobs.elemental$newbornfireelemental.desc_ally=此元素是由咒語召喚，較能掌控其火焰。雖然無法使用遠程攻擊，但其近戰攻擊能夠點燃命中的敵人。
actors.mobs.elemental$newbornfireelemental.discover_hint=此敵人在特定任務中出現。
actors.mobs.elemental$frostelemental.name=冰霜元素
actors.mobs.elemental$frostelemental.desc=元素生物是一種由於施放強大魔法時的失誤產生的混沌生物。元素生物缺乏智能，牠們通常與一種特定的魔法密切相關。\n\n冰霜元素是一種藉助冰霜魔法弱化敵人的常見元素生物。牠們近戰會使敵人陷入凍傷，也能偶爾遠端攻擊。在水面上冰霜魔法的效果會顯著加強。
actors.mobs.elemental$shockelemental.name=電擊元素
actors.mobs.elemental$shockelemental.desc=元素生物是一種由於施放強大魔法時的失誤產生的混沌生物。元素生物缺乏智能，並且通常與一種特定的魔法密切相關。\n\n電擊元素是一種較為少見的元素生物，利用電擊與閃光攻擊敵人。近戰時牠們會向周圍的敵人釋放跳躍的電弧，首要目標若身在水中將會受到額外傷害。對付遠處的敵人牠們會偶爾釋放使人失明的強烈閃光。
actors.mobs.elemental$chaoselemental.name=混沌元素
actors.mobs.elemental$chaoselemental.desc=元素生物是一種由於施放強大魔法時的失誤產生的混沌生物。元素生物缺乏智能，它們通常與一種特定的魔法密切相關。\n\n混沌元素是一種極其稀有的元素生物。牠們不僅僅局限於一種特定的魔法，而是藉助隨機的魔法進行強力的攻擊。

actors.mobs.eye.name=邪惡之眼
actors.mobs.eye.deathgaze_kill=死亡凝視奪取了你的生命……
actors.mobs.eye.desc=邪惡之眼是一種將惡魔能量壓抑在自己體內的漂浮球形生物。牠們擁有近戰能力，但其真正的力量蘊藏在它們的魔法之中。\n\n在短暫的蓄能過後，邪眼將會釋放一種名為_死亡凝視_的毀滅性能量射線。任何受到邪眼的這種凝視的生物都會受到極大的傷害，明智的冒險家都會及時尋求掩護。

actors.mobs.fetidrat.name=腐臭老鼠
actors.mobs.fetidrat.desc=這隻老鼠很不對勁。牠油膩的黑毛和腐爛的皮膚與你之前見過的健康老鼠很不同。淺綠色的眼睛讓牠顯得更具威脅性。 \n\n這隻老鼠周圍盤繞著一片可怕惡臭，靠近時臭氣尤為濃烈。\n\n黑色的淤泥從牠的嘴中流出。淤泥腐蝕掉了地磚，但遇水似乎就會溶解。
actors.mobs.fetidrat.discover_hint=此敵人在特定任務中出現。

actors.mobs.fungalcore.name=蘑菇菌核
actors.mobs.fungalcore.desc=這株碩大無比的蘑菇必定是泂穴中蕈類活力的源頭。

actors.mobs.fungalsentry.name=蘑菇哨衛
actors.mobs.fungalsentry.desc=這株高大的蘑菇定立在此抵禦外敵，保護內部的菌絲網路。\n\n此種蘑菇無法移動，但能精準地向入侵者噴射毒液。雖然噴射力道微弱，_但毒量能快速累加，足以致死_。雖然它可以被殺死，但最好離它遠一點。

actors.mobs.fungalspinner.name=真菌蜘蛛
actors.mobs.fungalspinner.desc=這隻蜘蛛遭真菌寄生、控制，因此，它再也噴不出蜘蛛網，產生不了毒液，改從嘴中吐出孢子。\n\n此種蜘蛛與衆不同，向你吐出孢子。孢子落地後形成植被，並有可能把你纏在原地。雖然它無毒，但它在螢光蘑菇旁會得到大量偒害抗性。

actors.mobs.ghoul.name=矮人屍群
actors.mobs.ghoul.desc=隨著矮人王國逐漸衰亡，現任的矮人國王掌握著絕對的權力，一些較為弱小的或是反抗國王的矮人受到不公的待遇。然而隨著矮人國王逐漸精通黑暗魔法，這些矮人逐漸屈從於他的意志，並最終淪為了其大軍中的傀儡棋子。\n\n矮人屍群中的個體本身沒有強大的戰鬥力，但他們總是結伴作戰，試圖利用數量優勢擊敗強大的對手。_一名矮人屍群成員被擊倒時，如果周圍仍有其他同類，他將會在幾回合後重生_。

actors.mobs.gnoll.name=豺狼偵查兵
actors.mobs.gnoll.desc=豺狼是鬣狗狀的類人生物。它們在下水道和地下城裡遊蕩，不時向上行動試圖向地表發起進攻。豺狼偵查兵是它們種群裡最普通的一員，它們力量不敵暴徒，智力也不及薩滿。

actors.mobs.gnollexile.name=豺狼流民
actors.mobs.gnollexile.desc=這隻灰毛豺狼人的肩上烙印著大型記號，顯然是遭流放了。這通常是它不守序，忽視法規的下埸。在外流亡必定是要身強體壯，身懷絕技，才可能存活，而這位看起來懂得利用手上的長矛。
actors.mobs.gnollexile.desc_passive=_豺狼流民目前沒有攻擊意圖。_牠似乎不像其他的豺狼人一樣好鬥，並且覺得攻擊你不值得。你可以就這樣忽視牠，但牠的背包內好像有很多實用的物品……
actors.mobs.gnollexile.desc_aggro=_豺狼流民看起來氣焰衝天。_似乎還是有什麼原因使牠決定跟你死鬥。小心那根長矛!
actors.mobs.gnollexile.seen_passive=持矛的豺狼人用雙眼緊盯著你，但沒有攻擊動作。
actors.mobs.gnollexile.seen_aggro=持矛的豺狼人要向你發動攻擊了!

actors.mobs.gnollgeomancer.name=豺狼地動法師
actors.mobs.gnollgeomancer.warning=地動法師的眼皮開始翻動了。在繼續前最好先做好準備!
actors.mobs.gnollgeomancer.alert=地動法師醒來了! 整個洞穴似乎伴隨著其跳走時的瘋狂笑聲變形!
actors.mobs.gnollgeomancer.rock_kill=你被飛行的巨石擊斃了……
actors.mobs.gnollgeomancer.rockfall_kill=你被掉落的岩石壓垮了……
actors.mobs.gnollgeomancer.desc=這位身材高大的老豺狼必定是這裡所有豺狼的領袖，還是地動魔法的來源。牠精通動地魔法，不像其他工兵，所以他不會被飛岩或落石傷害。不過，他沒有近戰能力。
actors.mobs.gnollgeomancer.desc_armor=牠目前被一層岩石護甲所包覆。在你能夠對其造成傷害前，你必須先靠近並用你的礦鎬將其護甲擊碎。
actors.mobs.gnollgeomancer.desc_armor_sapper=附近有一位工兵持有正在強化地動法師的岩石護甲的裝置。現在無論如何攻擊都不管用!
actors.mobs.gnollgeomancer.desc_sleeping=這隻身形高大的老豺狼人的身邊環繞著一層岩石，看起來就像是一尊雕像。如果注意看的話還能看到岩石隨著其呼吸移動。像這樣被岩石包覆時，牠不會受到傷害，而且看起來很享受像現在這樣"入土為安"。\n\n其周遭的岩石應該可以被你用礦鎬敲碎，_但務必先做好戰鬥的準備。_這隻地動法師大概就是這附近的魔法來源，同時也是所有豺狼人活動的規劃者。_在與其交手前先行除掉周遭的豺狼人應該會是不錯的選擇。_
actors.mobs.gnollgeomancer.discover_hint=此敵人在特定任務中出現。

actors.mobs.gnollguard.name=豺狼衛兵
actors.mobs.gnollguard.def_verb=格擋
actors.mobs.gnollguard.spear_warn=豺狼人用其長矛尖端擊出凶狠的一擊!
actors.mobs.gnollguard.desc=一隻長的又大又兇狠的豺狼人，兩手各拿著一隻長矛和一個盾牌，但沒帶頭盔。這些豺狼人大概是正在受訓中的暴徒，被派來幫忙自周遭的野生動物中保護礦坑。\n\n豺狼衛兵雖然強壯到能一隻手拿著長矛，但沒辦法好好使用。_牠需要夠空曠的地方才能遠距離攻擊，而且近戰時能造成的傷害會明顯減少。_
actors.mobs.gnollguard.desc_armor=附近有一位工兵持有能賦予這隻衛兵大地護甲的裝置，大幅減少其受到的傷害。
actors.mobs.gnollguard.discover_hint=此敵人在特定任務中出現。

actors.mobs.gnollsapper.name=豺狼工兵
actors.mobs.gnollsapper.desc=一隻體型較小且較弱但聰明的豺狼人，其毛髮蒼白，身上攜帶著各式各樣的裝置。他們大概是來幫忙尋找並開採黃金的，周遭有幾隻負責保護牠的衛兵。他們能夠戰鬥，但攻擊力低的可憐，和偵查兵差不多。\n\n比起直接作戰，工兵更喜歡透過牠們攜帶的裝置來讓周遭環境替他們攻擊。但他們並不了解背後的法術，所以經常亂用。_應該有非常多可以利用這些攻擊的方式。_
actors.mobs.gnollsapper.discover_hint=此敵人在特定任務中出現。

actors.mobs.gnolltrickster.name=豺狼詭術師
actors.mobs.gnolltrickster.desc=即使以豺狼人的標準來看，這隻生物也非常詭異。牠佝僂著腰，鬼鬼祟祟地行進著，咧開的大嘴掛著邪惡的笑容，肩上背著的挎包鼓得像搖籃一般。牠的瞳孔中混雜著恐懼與興奮。\n\n牠的挎包裡有一大批粗製濫造的飛鏢，它們的尖端似乎被各種有害物質包覆著。
actors.mobs.gnolltrickster.discover_hint=此敵人在特定任務中出現。

actors.mobs.goldenmimic.name=黃金寶箱怪
actors.mobs.goldenmimic.desc=寶箱怪是一種能隨意改變外形的魔法生物。在地下城裡牠們幾乎一直以寶箱形態出現，因為這樣總能吸引毫無防備的冒險家。\n\n金色寶箱怪是試圖吸引頂尖冒險家的強大寶箱怪。牠們擁有更豐厚的財寶，但相對通常的寶箱怪也更為強大。

actors.mobs.golem.name=魔像
actors.mobs.golem.def_verb=格擋
actors.mobs.golem.desc=魔像是矮人們的試造物，由於他們想藉由魔法的新應用來彌補機械設備長久以來的缺陷而將其發明。它們雖不似 DM-300 那樣龐大笨重，但仍具有不可小覷的破壞力。\n\n魔像因體型過大無法進入通道，但矮人們賦予了魔像魔力來彌補這一點——魔像能在各個房間之間傳送，並能將無法觸及的敵人從遠處拉回來。

actors.mobs.goo.name=黏咕
actors.mobs.goo.notice=咕-咕!
actors.mobs.goo.defeated=咕……咕……
actors.mobs.goo.!!!=!!!
actors.mobs.goo.pumpup=黏咕正在不斷地抽動!
actors.mobs.goo.enraged=激怒
actors.mobs.goo.gluuurp=咕——————!
actors.mobs.goo.rankings_desc=遭黏咕吸收
actors.mobs.goo.desc=人類對黏咕的所知甚少。 它甚至很有可能不是一種生物，而是下水道表面聚集的邪惡物質得到基本智慧而產生的實體。 不管怎樣，很明顯是個黑暗魔法造物。\n\n它的凝膠性質讓它吸收了很多黑暗能量，你光是靠近就感受到了一股寒意。 如果咕黏使用這種能量對你進行攻擊那你肯定撐不了多久。

actors.mobs.greatcrab.name=巨鉗螃蟹
actors.mobs.greatcrab.noticed=巨鉗螃蟹用它龐大的鉗子格擋了這次攻擊。
actors.mobs.greatcrab.def_verb=格擋
actors.mobs.greatcrab.desc=這隻螃蟹的塊頭相當大，甚至超過了其他的下水道螃蟹。牠的藍色甲殼上布滿了裂紋和藤壺，足以證明其經歷的無數歲月。牠爬行緩慢，那隻巨大的鉗子讓牠難以保持平衡。\n\n儘管這螃蟹只剩下一邊的鉗子，但鉗子的大小完全彌補了這點不足。螃蟹只要發現危險就會把爪子舉在身前，利用堅不可摧的甲殼進行防禦。不過螃蟹無法格擋未察覺的攻擊，也無法同時格擋多個敵人的進攻。
actors.mobs.greatcrab.discover_hint=此敵人在特定任務中出現。

actors.mobs.guard.name=監獄守衛
actors.mobs.guard.scorpion=給我過來!
actors.mobs.guard.def_verb=格擋
actors.mobs.guard.desc=作為曾經的監獄管理者，這些守衛和那些罪犯已經沒什麼區別了。他們蹣跚的步伐如同殭屍一般，毫無思緒地四處尋找不屬於這片區域的生物，比如你!\n\n他的鐵鏈纏在自己的胯部，也許可以用來將敵人拉扯到非常近的距離。

actors.mobs.hermitcrab.name=寄居蟹
actors.mobs.hermitcrab.def_verb=格擋
actors.mobs.hermitcrab.desc=出於某些原因，這隻螃蟹決定把破木桶套在頭上!木桶的重量使牠每回合只能移動一格，但厚實的木頭也給牠可觀的防御力。木桶內倒是好像有什麼東西撞來撞去……

actors.mobs.mimic.name=寶箱怪
actors.mobs.mimic.reveal=這是一個寶箱怪!
actors.mobs.mimic.hidden_hint=這個寶箱看上去有些不對勁……上前直接打開似乎是一個壞主意。
actors.mobs.mimic.desc=寶箱怪是一種能隨意改變外形的生物。在地下城裡牠們幾乎一直以寶箱形態出現，因為這樣總能吸引毫無防備的冒險家。\n\n寶箱怪具有相當強的攻擊力，但通常也擁有比普通箱子更多的財寶。
actors.mobs.mimic.discover_hint=此敵人在地下城各區皆有可能出現。

actors.mobs.necromancer.name=死靈法師
actors.mobs.necromancer.desc=這些黑暗魔法的學徒大量湧入監獄，因為這裡是他們磨練死靈法術的最佳地點。\n\n死靈法師通過召喚骷髏並賦予其增益效果作戰。死靈法師被擊殺後，其召喚的骷髏也會消散。
actors.mobs.necromancer$necroskeleton.name=死靈法師的骷髏
actors.mobs.necromancer$necroskeleton.desc=這個骷髏是被死靈法師召喚出來的。他的能力與習性和普通的骷髏一樣，只是會在召喚者被擊殺時跟著消逝。

actors.mobs.mob.died=你依稀聽到遠處有什麼東西死掉了。
actors.mobs.mob.rage=#$%^
actors.mobs.mob.rankings_desc=死於:%s
actors.mobs.mob.discover_hint=此敵人只在地下城某區域現身。

actors.mobs.monk.name=矮人武僧
actors.mobs.monk.def_verb=格擋
actors.mobs.monk.parried=招架
actors.mobs.monk.desc=這些僧侶皆是狂熱的信徒，傾其所能從一切異族手中保護國王的安全。 狂熱的信仰使得他們將自己的意志交給了國王，只剩下沒有思想的軀殼在城市中遊蕩。\n\n這些武僧完全精通肉搏戰的藝術，只需靠肉身就能進行進攻和防禦。精神集中的武僧會必定格擋住一次進攻，就算它是必中的攻擊。 武僧在移動時會更快的集中精神，在戰鬥中就相對慢些。
actors.mobs.monk$focus.name=精神集中
actors.mobs.monk$focus.desc=這位武僧已經完全集中於目標的一舉一動，似乎能預料到目標的下一步動作。 \n\n精神集中的武僧必定會格擋下一次的物理攻擊。 但格擋會分散武僧的注意力，使得他們需要一段時間重新集中精力來成功格擋攻擊。 在移動時武僧恢復地相對更快。

actors.mobs.phantompiranha.name=幻影食人魚
actors.mobs.phantompiranha.teleport_away=幻影食人魚在你面前消失了……
actors.mobs.phantompiranha.desc=幻影食人魚是一種稀有的食人魚，具有神奇的能力和怪異的半透明身體。它們在受到攻擊時能夠進行瞬間移動，以便逃跑或快速接近敵人!\n\n雖然與牠戰鬥是件棘手的事，但它們的肉卻因其神奇的功效而備受珍視。

actors.mobs.piranha.name=巨型食人魚
actors.mobs.piranha.desc=這些肉食性魚類是為了保護儲藏室而培育的，其咬合力足以將人骨粉碎，應避免與之正面交戰。
actors.mobs.piranha.discover_hint=此敵人在地下城各區皆有可能出現。

actors.mobs.pylon.name=能源塔
actors.mobs.pylon.desc_inactive=一座能源塔，用以管控為區域內機器供能的電力。
actors.mobs.pylon.desc_active=一座能源塔，用以管控為區域內機器供能的電力。 此刻電能湧動，就是它在為DM-300增壓吧! \n\n這時的能源塔可被摧毀，卻會順時針向四周釋放電弧。其加固的金屬結構，能抵抗高強度破壞造成的結構損傷。

actors.mobs.rat.name=老鼠
actors.mobs.rat.desc=雖說老鼠們具有攻擊性，可它們依舊是下水道裡的弱者。它們的齧咬非常煩人，但只有數量巨大時才會造成生命威脅。

actors.mobs.ripperdemon.name=惡魔撕裂者
actors.mobs.ripperdemon.leap=惡魔撕裂者正準備撲殺!
actors.mobs.ripperdemon.desc=這種恐怖的生物是惡魔利用這裡殘留的眾多矮人屍骸而組成的。 惡魔撕裂者外觀類似蒼白瘦弱的矮人，具有殘缺不全的軀幹與尖利修長的骨爪。\n\n惡魔撕裂者難以承受沉重的打擊，但它們行動迅捷並十分危險。 它們能夠瞬間撲過極遠的距離，再用自己的骨爪刺穿目標。

actors.mobs.rotheart.name=腐莓之心
actors.mobs.rotheart.desc=腐莓的果實很獨特。一般植物的果實會逐漸腐爛並給種子提供養分，但這種果實會生長，變硬，並把種子牢牢包裹在內。它為果實裡生長的內部器官提供保護。這種巨大的球狀物被視為成年的腐莓植物的心臟部分。
actors.mobs.rotheart.discover_hint=此敵人在特定任務中出現。

actors.mobs.rotlasher.name=腐莓觸手
actors.mobs.rotlasher.desc=腐莓觸手是成熟腐莓根部的一部分，也是其主要的防禦手段。 觸手不能移動且不具視力，但會在花一回合偵測周遭敵人後展開猛烈的攻擊。 如果周遭沒有敵人，它們就會站著不動，並嘗試融入周遭的環境中。
actors.mobs.rotlasher.discover_hint=此敵人在特定任務中出現。

actors.mobs.scorpio.name=魔蠍
actors.mobs.scorpio.desc=這些巨大的節肢類惡魔生物會盡可能避免一切近距離接觸，並且會在遠處射出能夠致殘的尖刺。

actors.mobs.senior.name=武僧大師
actors.mobs.senior.desc=這些僧侶皆是狂熱的信徒，傾其所能從一切異族手中保護國王的安全。 狂熱的信仰使得他們將自己的意志交給了國王，只剩下沒有思想的軀殼在城市中遊蕩。\n\n這隻武僧掌握了精深的格鬥技巧，相較於普通的武僧，他能在移動時更迅速恢復集中。 精神集中的武僧會必定格擋住一次進攻，哪怕是必中的攻擊。 武僧在移動時會更快地集中精神，在戰鬥中就相對慢些。

actors.mobs.shaman.name=豺狼薩滿
actors.mobs.shaman.bolt_kill=魔力的衝擊粉碎了你……
actors.mobs.shaman.desc=豺狼薩滿比大部分的豺狼更加聰明。牠們偏好用戰鬥法術攻擊敵人，掩蓋力量上的弱勢，並在族群中獲得崇高的地位。
actors.mobs.shaman$redshaman.spell_desc=這位薩滿戴着紅色面具，會施放暫時_削弱你攻擊力_的魔法。
actors.mobs.shaman$blueshaman.spell_desc=這位薩滿戴着藍色面具，會施放暫時_增加你所受傷害_的魔法。
actors.mobs.shaman$purpleshaman.spell_desc=這位薩滿戴着紫色面具，會施放暫時_削弱你的精準和閃避_的魔法。

actors.mobs.armoredbrute.name=重甲暴徒
actors.mobs.armoredbrute.desc=這些頂級的豺狼暴徒通常裝備著強力的護甲來體現它們的地位。 它們的護甲使得它們對物理傷害有著更高的防禦，它們堅強的意志使它們在彌留之際堅持更長的時間。

actors.mobs.skeleton.name=骷髏
actors.mobs.skeleton.explo_kill=你被濺射的骨頭刺穿了……
actors.mobs.skeleton.def_verb=格擋
actors.mobs.skeleton.desc=骷髏是從那些不幸的冒險家及待在監獄的人們屍骨的聚合物產生的，來自地下城下層的邪惡力量將它們從死亡中喚起。在吸收了足夠的傷害之後，它們就會在骨頭的爆炸中消解。這爆炸產生的碎片會四處濺射並傷害周遭的一切，但那東西能輕易被護甲擋掉。

actors.mobs.slime.name=史萊姆
actors.mobs.slime.def_verb=格擋
actors.mobs.slime.desc=史萊姆是一種具有膠質外形與液態內核的奇特魔法生物。 城市的下水道為它們提供了充分的水源和富足的養分。 \n\n史萊姆的外層膠膜具有極強的彈性，所以你的武器再好也很難在_三次攻擊_內擊敗它。

actors.mobs.snake.name=下水道蟒蛇
actors.mobs.snake.hint=試試點擊檢查按鈕再選擇蛇，以瞭解如何擊敗它們。
actors.mobs.snake.desc=這些體型龐大的蛇能通過快速滑行以閃避普通的攻擊，讓它們難以命中。 不過伏擊之類的必中攻擊會使它們措手不及。\n\n在敵人的可視範圍外攻擊它時可以觸發伏擊。 如果這條蛇已經在追擊你，你可以嘗試躲入一扇門後，然後在_在蛇進門的瞬間發動攻擊_。

actors.mobs.spectralnecromancer.name=怨靈法師
actors.mobs.spectralnecromancer.desc=雖然一般的死靈法師幾乎總是偏好骷髏，但少數更偏好比較"飄渺不定"的部下。幽魂法師們選擇了怨靈作為他們的召喚物!\n\n單一隻怨靈的力量可能比不上骷髏，但怨靈法師不會猶豫召喚出一大群!

actors.mobs.spinner.name=礦洞蜘蛛
actors.mobs.spinner.desc=綠色而多毛的洞穴蜘蛛們會試著去躲避直接的戰鬥，它們更喜歡在遠處等待其獵物捲入蜘蛛網，在劇毒中慢慢死去。 它們也能向遠處噴吐蜘蛛網，阻擋敵人的行動路線。

actors.mobs.statue.name=活化石像
actors.mobs.statue.def_verb=格擋
actors.mobs.statue.desc=你以為這隻是地下裡的另一尊靜止石像，但它發出紅光的眼睛讓你知道這可沒這麼簡單。
actors.mobs.statue.desc_weapon=儘管雕像本身是用石頭做的，但它裝備著的_%s_看起來像是真的。
actors.mobs.statue.discover_hint=此敵人在地下城各區皆有可能出現。

actors.mobs.succubus.name=魅魔
actors.mobs.succubus.desc=魅魔是一種善於操縱敵人的精神的變形惡魔。 這一隻化為了哥特風的蒼白人形，或許是為了吸引矮人術士? \n\n在攻擊時，魅魔能夠暫時魅惑目標，使其無法直接攻擊魅魔本身。 魅魔在攻擊被魅惑的目標時能吸取其生命精華。

actors.mobs.swarm.name=飛蠅群
actors.mobs.swarm.desc=致命的飛蠅群憤怒地發出嗡嗡聲。每次非魔法攻擊都會把它分割成兩群更小但同樣危險的飛蠅群。

actors.mobs.tengu.name=天狗
actors.mobs.tengu.notice_gotcha=抓到你了，%s!
actors.mobs.tengu.interesting=來讓這一切都變得更有趣吧…...
actors.mobs.tengu.notice_have=你的命歸我了，%s!
actors.mobs.tengu.defeated=最終還是解脫了……
actors.mobs.tengu.rankings_desc=被天狗暗殺
actors.mobs.tengu.desc=一位著名的神秘刺客，其名源於他臉上面具的蝕刻。\n\n天狗的手腕和膝下都帶著镣銬，但他似乎很久以前就擺脫掉了鎖鏈的束縛。 \n\n他將利用陷阱、欺騙性的魔法、精準致命的攻擊，來消滅唯一能阻止他逃脫的人:你。

actors.mobs.tengu$bombability$bombblob.desc=這裡翻滾著一片過熱的粉塵。 當心，要爆炸了!
actors.mobs.tengu$bombability$bombitem.name=粉塵炸彈
actors.mobs.tengu$bombability$bombitem.cant_pickup=它固定在地面上，你無法搬動它!
actors.mobs.tengu$bombability$bombitem.desc=天狗往這裡扔了一個奇形怪狀，不斷噴出滾燙濃煙的炸彈。 它在滴答作響，似乎是爆炸的計時! 炸彈嵌入了地面，你無法拾取它。

actors.mobs.tengu$fireability$fireblob.desc=天狗往這裡灑了一把開始起煙的細膩粉末，要燒起來了!

actors.mobs.tengu$shockerability$shockerblob.desc=這裡正積蓄著電能，站在這裡的任何單位都會在下回合受到電擊!
actors.mobs.tengu$shockerability$shockeritem.name=電擊裝置
actors.mobs.tengu$shockerability$shockeritem.cant_pickup=它放出電能太強了，你無法觸碰它!
actors.mobs.tengu$shockerability$shockeritem.desc=天狗往這裡扔了一個奇怪的裝置，好像是用DM-100的零件拼湊出來的。 裝置在持續地向周圍放出電弧，但是範圍好像有規律可循。 有這麼密集的高壓電弧環繞著，你無從下手去拾取它。

actors.mobs.thief.name=瘋狂小偷
actors.mobs.thief.stole=小偷偷走了你的%s!
actors.mobs.thief.carries=\n\n這位小偷攜帶著一個_%s_。 明顯是偷來的。
actors.mobs.thief.escapes=小偷帶著你的%s逃走了!
actors.mobs.thief.desc=這些囚犯逃出了他們的牢房，卻沒能逃出這座監獄。隨著時間流逝，這座監獄徹底摧毀了他們僅存的心智，以及對自由的嚮往。這些瘋狂的小偷和強盜很久以前就已經徹底忘記它們是誰，以及它們為何偷竊。\n\n這些敵人比起面對面地面戰鬥，更傾向於偷走你的財物隨後逃之夭夭。 一定要盯緊它們，否則你以後可能再也看不到到自己的被盜財物了。

actors.mobs.tormentedspirit.name=厄咒之靈
actors.mobs.tormentedspirit.desc=厄咒之靈是受到詛咒的善良幽靈。只要它們還受到詛咒影響就會像一般的怨靈一樣攻擊，而且它們的傷害比一般怨靈更高!\n\n也許它們身上的詛咒可以透過在他們附近使用對的道具解除。如果替他它們解除詛咒的話，它們肯定會很感激你的……
actors.mobs.tormentedspirit.thank_you=謝謝你……

actors.mobs.vaultrat.desc=這些老鼠在行為上有些不同，用以測試寶庫敵人的AI:\n_-_牠的移動行為能隔牆被"聽見"\n_-_牠們只會沿著預設的路線移動\n_-_牠們非移動方向的視野會大幅縮短\n_-_睡覺時的視野也會縮小\n_-_發現敵人時會先進入"搜查"模式:牠會向目標移動但不會攻擊，且只要你躲在角落或門後就很容易失去目標

actors.mobs.npcs.vaultsentry.name=寶庫哨衛
actors.mobs.npcs.vaultsentry.desc=這種哨衛會以特定模式掃描這個房間。\n_在測試期間，它在覺察到你後什麼也不會做。_

actors.mobs.npcs.vaultlaser.name=雷射裝置
actors.mobs.npcs.vaultlaser.desc=這種哨衛會定時向固定方向發射雷射。\n_在測試期間，射線不會造成傷害。_

actors.mobs.warlock.name=矮人術士
actors.mobs.warlock.bolt_kill=暗影能量使你的生命衰竭了……
actors.mobs.warlock.desc=當矮人的興趣從工程建設轉向奧秘學術時，術士們開始在城市中掌權。 它們從元素魔法起步，但很快就開始研究惡魔學和死靈術。 最強大的術士掌握了矮人王國的王權，其他術士如果想繼續練習黑暗魔法，就必須放棄精神的自由，將意志交給他控制。 \n\n這些術士擁有具有強大的干擾性魔法，能暫時抑制裝備的升級魔力。 裝備的等級越高，受降級魔法的影響就越嚴重。

actors.mobs.wraith.name=怨靈
actors.mobs.wraith.desc=怨靈是來自於墓穴中渴望復仇的罪人之魂。作為飄渺的非實體很難被正常武器擊中。
actors.mobs.wraith.discover_hint=此敵人在地下城各區皆有可能出現。

actors.mobs.yogdzewa.name=Yog-Dzewa
actors.mobs.yogdzewa.notice=我 。  看  。 見  。 你 。 了 。
actors.mobs.yogdzewa.darkness=黑暗正在逼近……
actors.mobs.yogdzewa.hope=你 。 的  。 希 。望 。 皆 。 為 。虛   !   無   !
actors.mobs.yogdzewa.defeated=…
actors.mobs.yogdzewa.rankings_desc=被Yog-Dzewa吞噬
actors.mobs.yogdzewa.desc=Yog-Dzewa 是一個古老的神;一個將自己的力量延伸向凡間世界並吞噬它們、以為自身無盡的成長提供養分的巨大怪物。矮人一定是在玩弄黑暗魔法的時候引起了這個巨大恐怖的注意，並且從那以後就一直試圖控制他，使之無法侵吞外界。\n\n這位古神起源於一個原始的、充滿魔法與混沌的維度，且無法將他的真實形態帶入這個世界。因此，他創造了自己的化身，並召喚了惡魔們作為他的僕從來完成他的命令。\n\n這隻巨眼是古神在這個世界上力量的焦點。雖然這隻眼睛本身是不可移動的，但它能夠射出強大的魔能光束，並召喚各種惡魔僕從來協助它。
actors.mobs.yogdzewa.desc_spawners=你感覺到惡魔能量正從上層湧向Yog-Dzewa。 你在上面活著留下的什麼東西正在給古神回饋著能量。 _古神會使用這股能量召喚更強大的手下! _
actors.mobs.yogdzewa$larva.name=古神幼蟲
actors.mobs.yogdzewa$larva.rankings_desc=被Yog-Dzewa吞噬
actors.mobs.yogdzewa$larva.desc=這些古神的小小造物是一種易於製造的簡陋生物。雖然單隻幼蟲十分脆弱，但牠們能夠被迅速地製造出來，當牠們的數量過於龐大，情況將會變得相當棘手。
actors.mobs.yogdzewa$yogripper.rankings_desc=被Yog-Dzewa吞噬
actors.mobs.yogdzewa$yogeye.rankings_desc=被Yog-Dzewa吞噬
actors.mobs.yogdzewa$yogscorpio.rankings_desc=被Yog-Dzewa吞噬

actors.mobs.yogfist.invuln_warn=這個拳頭待在古神之眼附近時無懈可擊!
actors.mobs.yogfist.rankings_desc=被Yog-Dzewa吞噬
actors.mobs.yogfist.desc=這些拳頭是古神的力量部分體現。它們與古神的力量相互聯繫，並且當它們靠近古神之眼時會免疫所有受到的傷害。
actors.mobs.yogfist$burningfist.name=燃燒之拳
actors.mobs.yogfist$burningfist.desc=燃燒之拳是由混沌的熾熱魔法形成的。 它在移動時會不斷地引燃周圍的環境。 它還可以發射火焰能量形成魔法衝擊，使目標地陷入一片熊熊烈火。 \n\n燃燒之拳引燃環境的能力在靠近水的時候會被抑制，但是其熱量實在太大，以至於周圍的水很快就會蒸發掉!
actors.mobs.yogfist$soiledfist.name=大地之拳
actors.mobs.yogfist$soiledfist.desc=大地之拳是由混沌的大地魔法形成的。當它移動時，它會不斷地使周圍長出植物。它還可以發射精準的大地衝擊，將它的目標困在迅速生長的藤蔓和根系間! \n\n大地之拳能從植物的生命中獲得力量，並能根據其周圍的植被數量來抵擋傷害!
actors.mobs.yogfist$rottingfist.name=腐爛之拳
actors.mobs.yogfist$rottingfist.desc=腐爛之拳是由活生生的腐敗所組成的。它是一團高塔般龐大的腐肉，可以在近戰中噴濺腐蝕淤泥，並噴射毒氣作為遠程攻擊。更糟糕的是，腐爛之拳的龐大質量導致它受到攻擊時只會進入流血狀態，而不會直接受到傷害。\n\n腐蝕淤泥可以被水洗去，但腐爛之拳也可以通過吸收水來治療自己!此外，在其流血時對腐爛之拳造成傷害只會刷新其流血狀態而不會加重效果!
actors.mobs.yogfist$rustedfist.name=鏽蝕之拳
actors.mobs.yogfist$rustedfist.desc=鏽蝕之拳是由一塊活的金屬形成的。 它是一個高塔般龐大的移動金屬塊，具有強大的近戰能力，並有在遠距離外使目標殘廢的能力。 由於其巨大的品質，鏽蝕之拳所受到的傷害都會被延緩，而非立即作用在其身上。 \n\n儘管如此，鏽蝕之拳那並不靈活的特性使得它無法通過較窄的走道。 另外，雖然鏽蝕之拳只會緩慢地受到傷害，但是延緩傷害還會在它受到多次攻擊時繼續疊加。
actors.mobs.yogfist$brightfist.name=輝耀之拳
actors.mobs.yogfist$brightfist.teleport=輝耀之拳在一道使你重度盲目的爆閃中傳送到了別處!
actors.mobs.yogfist$brightfist.desc=輝耀之拳是由純粹的光能量形成的。它能在每回合射出一道強烈的灼目光束!這些光束除了造成大量傷害外，還會暫時使你失明。輝耀之拳為了逃脫還能發出覆蓋全場的刺眼爆閃!\n\n輝耀之拳在近戰中並沒有特殊能力。
actors.mobs.yogfist$darkfist.name=暗影之拳
actors.mobs.yogfist$darkfist.teleport=暗影之拳在一片使你光源熄滅的漆黑中傳送到了別處!
actors.mobs.yogfist$darkfist.desc=暗影之拳是由純粹的暗能量形成的。它能在每回合射出強大的暗黑法術!這些法術除了造成大量傷害外，還會削弱你的光源。暗影之拳為了逃脫還能瞬間使全場陷入一片漆黑!\n\n暗影之拳在近戰中並沒有特殊能力。


actors.char.kill=%s殺害了你……
actors.char.defeat=你擊敗了%s。
actors.char.def_verb=閃避
actors.char.invulnerable=無敵
actors.char.immune=免疫

# Eternity PD Fallback Keys
actors.blobs.blizzard.desc=A blizzard is swirling here.
actors.blobs.confusiongas.desc=A cloud of confusion gas is swirling here.
actors.blobs.dancefloor.desc=Dance dance dance!\n%s dancing tile: %s\nNext color: %s
actors.blobs.dancefloor.color_1_name=Red
actors.blobs.dancefloor.color_1_desc=Characters standing on this tile take direct damage (massively increased vs hero)
actors.blobs.dancefloor.color_2_name=Green
actors.blobs.dancefloor.color_2_desc=Characters standing on this tile act at 2x speed
actors.blobs.dancefloor.color_3_name=Blue
actors.blobs.dancefloor.color_3_desc=Characters standing on this tile are stunned
actors.blobs.dancefloor.color_4_name=White
actors.blobs.dancefloor.color_4_desc=Characters standing on this tile take defered damage (massively increased vs hero)
actors.blobs.dancefloor.color_5_name=Yellow
actors.blobs.dancefloor.color_5_desc=Mobs killed on this tile give double EXP and more loot
actors.blobs.dancefloor.color_6_name=Purple
actors.blobs.dancefloor.color_6_desc=Characters standing on this tile take double damage
actors.blobs.dancefloor.rankings_desc=Danced into a grave
actors.blobs.dancefloor.ondeath=You danced into your own grave
actors.blobs.dancefloor$dancingdefereddamage.name=Dancing with Death
actors.blobs.dancefloor$dancingdefereddamage.desc=This is the most dangerous dance you've ever performed, and you are absolutely _ROCKING_ it, disregarding the pain!\n\nDeferred damage remaining: %d.
actors.blobs.dancefloor$dancingdefereddamage.ondeath=You danced into your own grave
actors.blobs.dancefloor$dancingdefereddamage.rankings_desc=Danced into a grave
actors.blobs.dancefloor$dancingdoom.name=Dancing in a grave
actors.blobs.dancefloor$dancingdoom.desc=Grave isn't the best place to dance in, but no one is stopping you!\n\nCharacters who are brave enough to dance in a grave will receive double damage from all sources.
actors.blobs.dancefloor$dancespeed.name=Dancing with Time
actors.blobs.dancefloor$dancespeed.desc=Your perfect dance synchronized with a rhythm of the universe, and not even time gonna stop you from dancing!\n\nWhile you dance is perfect, you will perform all actions at double speed.
actors.blobs.dancefloor$dancingstun.name=Stunned
actors.blobs.dancefloor$dancingstun.heromsg=You are stunned!
actors.blobs.dancefloor$dancingstun.desc=Nothing feels worse than being stunned in a middle of a dance\n\nStun completely halts all actions, forcing the target to wait until the effect wears off.
actors.blobs.electricity.desc=A field of electricity is sparking brightly here.
actors.blobs.electricity.rankings_desc=Electrocuted
actors.blobs.electricity.ondeath=You were shocked to death...
actors.blobs.fire.desc=A fire is raging here.
actors.blobs.foliage.desc=Shafts of light pierce the gloom of the underground garden.
actors.blobs.freezing.desc=The air is unnaturally frigid here.
actors.blobs.goowarn.desc=Specks of dark energy are swarming here!
actors.blobs.inferno.desc=An inferno is raging here.
actors.blobs.paralyticgas.desc=A cloud of paralytic gas is swirling here.
actors.blobs.sacrificialfire.desc=There is an altar here with a sacrificial fire burning atop it. Any creature that's killed here will be consumed as an offering to the spirits of the dungeon.\n\nPerhaps a reward will be given if enough sacrifices are made?
actors.blobs.sacrificialfire.worthy=The fire consumes your offering and grows stronger.
actors.blobs.sacrificialfire.unworthy=The fire consumes your offering, but doesn't change.
actors.blobs.sacrificialfire.reward=The fire flares and then dissipates, leaving a reward behind!
actors.blobs.smokescreen.desc=A cloud of thick black smoke is swirling here.
actors.blobs.stenchgas.desc=A cloud of fetid stench is swirling here.
actors.blobs.stormcloud.desc=A cloud of billowing water vapor is swirling here.
actors.blobs.toxicgas.desc=A greenish cloud of toxic gas is swirling here.
actors.blobs.toxicgas.rankings_desc=Suffocated
actors.blobs.toxicgas.ondeath=You died from the toxic gas...
actors.blobs.corrosivegas.desc=A cloud of deadly caustic gas is swirling here.
actors.blobs.waterofawareness.procced=As you take a sip, you feel knowledge pour into your mind.
actors.blobs.waterofawareness.desc=Power of knowledge radiates from the water of this well. Take a sip from it to reveal all secrets of equipped items and reveal all items on the current floor.
actors.blobs.waterofhealth.procced=As you take a sip, you feel your wounds heal completely.
actors.blobs.waterofhealth.desc=Power of health radiates from the water of this well. Take a sip from it to heal your wounds and satisfy hunger.
actors.blobs.wateroftransmutation.desc=Power of change radiates from the water of this well. Throw an item into the well to turn it into something else.
actors.blobs.web.desc=A thick web is covering everything here. Anything that touches or is thrown through the web will break it, but will also be stuck in place.
actors.buffs.adrenaline.name=adrenaline
actors.buffs.adrenaline.desc=A surge of physical power, adrenaline enhanced both attack and movement speed.\n\nAdrenaline allows its target to run at 2x speed, and attack at 1.5x speed.\n\nTurns remaining: %s.
actors.buffs.adrenalinesurge.name=strength boost
actors.buffs.adrenalinesurge.desc=A surge of great might, but sadly not permanent.\n\nStrength boost: +%d.\nTurns until boost weakens: %s.
actors.buffs.amok.name=amok
actors.buffs.amok.desc=Amok causes a state of great rage and confusion in its target.\n\nWhen a creature is amoked, they will attack whatever is near them, whether they be friend or foe.\n\nTurns of amok remaining: %s.
actors.buffs.arcanearmor.name=arcane armor
actors.buffs.arcanearmor.desc=A thin shield is surrounding you, blocking some of the damage from magical attacks.\n\nYour magical armor is currently boosted by: 0-%d.\n\nTurns until arcane armor weakens: %s.
actors.buffs.artifactrecharge.name=artifact recharging
actors.buffs.artifactrecharge.desc=Energy is coursing through you, increasing the rate your equipped artifacts charge.\n\nEach artifact is affected a little differently, but they will all gain charge much faster than normal.\n\nTurns remaining: %s.
actors.buffs.ascensionchallenge.name=amulet's curse
actors.buffs.ascensionchallenge.desc=Somehow Yog-Dzewa is maintaining influence on this world through the amulet, and is trying to stop your ascent!\n\nYog's power is making the dungeon much more dangerous, increasing the number of enemies and making them stronger! This power will keep building if left unchecked, it can be weakened by defeating enemies that have been enhanced by Yog's power.
actors.buffs.ascensionchallenge.desc_clear=The dark energy radiating from the amulet has been weakened as much as possible for now.
actors.buffs.ascensionchallenge.desc_beckon=The amulet is currently _calling out to distant enemies,_ alerting them to your position.
actors.buffs.ascensionchallenge.desc_haste=The amulet is currently _hastening distant enemies,_ letting them reach you faster!
actors.buffs.ascensionchallenge.desc_slow=The amulet is currently _slowing you down,_ and negating speed boosting effects!
actors.buffs.ascensionchallenge.desc_damage=The energy from the amulet has gotten so strong that it's _directly harming you!_
actors.buffs.ascensionchallenge.beckon=The amulet begins calling out to distant enemies.
actors.buffs.ascensionchallenge.haste=The amulet begins hastening distant enemies!
actors.buffs.ascensionchallenge.slow=The amulet starts to feel like a lead weight in your inventory!
actors.buffs.ascensionchallenge.damage=The amulet begins radiating dark energy. It burns!
actors.buffs.ascensionchallenge.weaken_info=You must defeat enemies to weaken the amulet's curse!
actors.buffs.ascensionchallenge.weaken=You can feel the amulet's curse weaken slightly.
actors.buffs.ascensionchallenge.break=You take a moment to catch your breath and feel your wounds begin to close!
actors.buffs.ascensionchallenge.almost=You feel Yog's grip on the amulet begin to weaken, you're almost there!
actors.buffs.ascensionchallenge.on_kill=The dark energy consumes you...
actors.buffs.barkskin.name=barkskin
actors.buffs.barkskin.desc=Your skin is hardened, it feels rough and solid like bark.\n\nThe hardened skin increases your effective armor, allowing you to better defend against physical attack.\n\nYour armor is currently increased by: 0-%d.\nTurns until barkskin weakens: %s.\n\nIf you receive barkskin from multiple sources, only the strongest one will apply.
actors.buffs.barrier.name=barrier
actors.buffs.barrier.desc=A durable bubble of force which blocks all damage.\n\nThe barrier will take damage for whatever it is protecting so long as there is shielding left. The shielding will also slowly decay over time.\n\nShielding remaining: %d.
actors.buffs.rageshield.name=Determination Shield
actors.buffs.rageshield.heromsg=You are protected by your rage!
actors.buffs.rageshield.desc=A durable bubble of your sheer rage saps away life force from nearby enemies, if you are wounded.\n\nThe barrier will drain health from enemies in your sight, angering them and taking damage. The shielding will have bigger effect if enemy is in adjacent to host.\n\nShielding remaining: %d.
actors.buffs.berserk.angered=angered
actors.buffs.berserk.berserk=berserking
actors.buffs.berserk.exhausted=exhausted
actors.buffs.berserk.recovering=recovering
actors.buffs.berserk.angered_desc=The severity of the Berserker's injuries strengthen his blows. As the berserker takes physical damage, his rage will build, granting him bonus damage. Damage which is blocked by armor still counts towards building rage.\n\nRage will fade over time. The lower the berserker's health, the longer it will last.\n\nAt 100%% rage, the Berserker can go berserk, granting him 2x his seal's max shielding, increasing to 6x if he has very low health. This shielding decays over time and once it runs out the berserker will have to rest before building rage again.\n\nCurrent Rage: _%.0f%%_\n_+%.0f%%_ damage
actors.buffs.berserk.berserk_desc=Fear and uncertainty bleed away, leaving only anger. In this state the Berserker is extremely powerful, _dealing +50% damage and gaining bonus shielding._\n\nThis bonus shielding is equal to 2x his seal's max shielding, increasing to 6x if he has very low health. When this shielding is reduced to 0, berserking will end.\n\nAfter raging, the Berserker will need to recover before being able to build rage again.
actors.buffs.berserk.recovering_desc=Inner strength has its limits. The Berserker must rest before using his rage again.\n\nWhile recovering the Berserker does not build any rage from taking damage.
actors.buffs.berserk.recovering_desc_turns=Turns until recovered: _%d_
actors.buffs.berserk.recovering_desc_levels=Levels until recovered: _%.2f_
actors.buffs.berserk.rankings_desc=Berserked to Death
actors.buffs.berserk.action_name=Berserk
actors.buffs.berserk.no_seal=You need your broken seal to berserk!
actors.buffs.bleeding.name=bleeding
actors.buffs.bleeding.ondeath=You bled to death...
actors.buffs.bleeding.heromsg=You are bleeding!
actors.buffs.bleeding.rankings_desc=Bled to Death
actors.buffs.bleeding.desc=That wound is leaking a worrisome amount of blood.\n\nBleeding causes damage every turn. Each turn the damage decreases by a random amount, until the bleeding eventually stops.\n\nCurrent bleed damage: %d.
actors.buffs.bless.name=blessed
actors.buffs.bless.desc=A great burst of focus, some say it is inspired by the gods.\n\nBlessing increases accuracy and evasion by 25%%, making the blessed much more effective in combat.\nIt also increased experience gain by 2x for heroes and allows them to get more items.\n\nTurns of bless remaining: %s.
actors.buffs.blindness.name=blinded
actors.buffs.blindness.heromsg=You are blinded!
actors.buffs.blindness.desc=Blinding turns the surrounding world into a dark haze.\n\nWhile blinded, a character's vision range is reduced to one tile, rendering ranged attacks useless and making it very easy to lose track of distant enemies. Additionally, a blinded hero is unable to read scrolls or books.\n\nTurns of blindness remaining: %s.
actors.buffs.buff.heromsg=
actors.buffs.burning.name=burning
actors.buffs.burning.heromsg=You catch fire!
actors.buffs.burning.burnsup=%s burns up!
actors.buffs.burning.ondeath=You burned to death...
actors.buffs.burning.rankings_desc=Burned to Ash
actors.buffs.burning.desc=Few things are more distressing than being engulfed in flames.\n\nFire will deal damage every turn until it is put out by water or it expires. Fire can be extinquished by stepping into water, or from the splash of a shattering potion.\n\nAdditionally, the fire may ignite flammable terrain or items that it comes into contact with.\n\nTurns of burning remaining: %s.
actors.buffs.championenemy.warn=You sense a deadly presence.
actors.buffs.championenemy$blazing.name=blazing champion
actors.buffs.championenemy$blazing.desc=Blazing champions deal 25% more melee damage, ignite enemies they attack, are immune to fire, and spread fire around them as they die. They can't spread fire onto water however.
actors.buffs.championenemy$projecting.name=projecting champion
actors.buffs.championenemy$projecting.desc=Projecting champions deal 25% more melee damage and have +3 attack range.
actors.buffs.championenemy$antimagic.name=antimagic champion
actors.buffs.championenemy$antimagic.desc=Antimagic champions take 50% less damage and are completely immune to magical effects.
actors.buffs.championenemy$giant.name=giant champion
actors.buffs.championenemy$giant.desc=Giant champions take 80% less damage and have +1 attack range, but cannot move through enclosed spaces.
actors.buffs.championenemy$blessed.name=blessed champion
actors.buffs.championenemy$blessed.desc=Blessed champions have 4x accuracy and evasion.
actors.buffs.championenemy$growing.name=growing champion
actors.buffs.championenemy$growing.desc=Growing champions gain a steadily increasing bonus to accuracy, evasion, physical damage, and a reduction to damage taken.\n\nCurrent acc/eva/dmg boost: %1$d%%\nCurrent damage reduction: %2$d%%
actors.buffs.championenemy$tanky.name=tanky champion
actors.buffs.championenemy$tanky.desc=Tanky champions receives only 5% of the damage, but reduces their damage and speed by 25%.
actors.buffs.championenemy$speedy.name=speedy champion
actors.buffs.championenemy$speedy.desc=Speedy Champions will gain x4 speed and x1.5 evasion and accuracy.
actors.buffs.championenemy$frozen.name=frozen champion
actors.buffs.championenemy$frozen.desc=Frozen champions deal 25% more melee damage but they have -20% speed, chills enemies they attack and sometimes freezes them, are immune to cold gases or effects, and spread blizzard around them as they die.
actors.buffs.championenemy$blunt.name=blunt champion
actors.buffs.championenemy$blunt.desc=Blunt champions are expert for using their hands or something they use as a blunt weapons, they deal 75% more damage as well as inflicts vertigo when they attack and paralyzes you in rare cases.
actors.buffs.charm.name=charmed
actors.buffs.charm.heromsg=You are charmed!
actors.buffs.charm.cant_attack=You are charmed by that enemy and can't attack them.
actors.buffs.charm.desc=A charm is manipulative magic that can make enemies temporarily adore each other.\n\nCharacters affected by charm are unable to directly attack the enemy they are charmed by. Attacking other targets is still possible however. The shock of pain will lessen the duration of charm.\n\nTurns of charm remaining: %s.
actors.buffs.chill.name=chilled
actors.buffs.chill.freezes=%s freezes!
actors.buffs.chill.desc=Not quite frozen, but still much too cold.\n\nChilled targets perform all actions more slowly, depending on how many turns are left in the effect. At its worst, this is equivalent to being slowed.\n\nTurns of chill remaining: %1$s.\nSpeed is reduced by: %2$s%%
actors.buffs.combo.name=combo
actors.buffs.combo.action_name=combo attack
actors.buffs.combo.combo=%d hit combo!
actors.buffs.combo.bad_target=You must target an enemy in attack range.
actors.buffs.combo.prompt=Select a target to attack.
actors.buffs.combo.desc=The gladiator builds momentum as they land successful blows. Each attack increases the combo counter by one, but taking too long between hits will reset the combo counter to 0.\n\nBuilding combo unlocks special combo attacks that cannot miss! A different attack is unlocked at 2, 4, 6, 8, and 10 combo count. Some moves reset combo and some do not, but each move can only be used once per combo session.\n\nCurrent combo: %1$d.\n\nTurns until Combo is lost: %2$s.
actors.buffs.combo$combomove.clobber.name=clobber
actors.buffs.combo$combomove.clobber.desc=Knocks an enemy back 2 tiles, but deals no damage and cannot knock into pits. Increments combo by 1.
actors.buffs.combo$combomove.clobber.empower_desc=Knocks an enemy back _3 tiles, inflicts vertigo, and can knock into pits,_ but deals no damage. Increments combo by 1.
actors.buffs.combo$combomove.slam.name=slam
actors.buffs.combo$combomove.slam.desc=Deals %d%% (combo*20%%) of your damage blocking power as bonus damage. Resets combo when used.
actors.buffs.combo$combomove.slam.empower_desc=_Leaps up to %1$d tile(s)_ and deals %2$d%% (combo*20%%) of your damage blocking power as bonus damage. Resets combo when used.
actors.buffs.combo$combomove.parry.name=parry
actors.buffs.combo$combomove.parry.desc=Blocks the next attack within 1 turn when activated, and instantly retaliates to it. Resets combo if nothing is parried.
actors.buffs.combo$combomove.parry.empower_desc=Blocks _all attacks_ within 1 turn when activated, and instantly retaliates to them. Resets combo if nothing is parried.
actors.buffs.combo$combomove.crush.name=crush
actors.buffs.combo$combomove.crush.desc=Deals %d%% (combo*25%%) damage to the primary target, and half that damage to all other enemies in a 7x7 AOE. Resets combo when used.
actors.buffs.combo$combomove.crush.empower_desc=_Leaps up to %1$d tile(s)_ and deals %2$d%% (combo*25%%) damage to the primary target, and half that damage to all other enemies in a 7x7 AOE. Resets combo when used.
actors.buffs.combo$combomove.fury.name=fury
actors.buffs.combo$combomove.fury.desc=Hits an enemy once for each combo you have, each hit deals 60% damage and can trigger enchantments. Resets combo when used.
actors.buffs.combo$combomove.fury.empower_desc=_Leaps up to %d tile(s)_ and hits an enemy once for each combo you have, each hit deals 60%% damage and can trigger enchantments. Resets combo when used.
actors.buffs.corruption.name=corrupted
actors.buffs.corruption.desc=Corruption seeps into the essence of a being, twisting them against their former nature.\n\nCorrupted creatures will attack their allies, and ignore their former enemies. Corruption is damaging as well, and will slowly cause its target to succumb.\n\nCorruption is permanent, its effects only end in death.
actors.buffs.cripple.name=crippled
actors.buffs.cripple.heromsg=You are crippled!
actors.buffs.cripple.desc=You're pretty sure legs aren't meant to bend that way.\n\nCrippled halves movement speed, making moving a tile usually take two turns instead of one.\n\nTurns of cripple remaining: %s.
actors.buffs.daze.name=dazed
actors.buffs.daze.heromsg=You are dazed!
actors.buffs.daze.desc=Ringing ears and blurred vision make it difficult to fight.\n\nWhile dazed, accuracy and evasion are reduced by 50%%, making both landing and evading blows much harder.\n\nTurns of daze remaining: %s.
actors.buffs.degrade.name=degraded
actors.buffs.degrade.heromsg=Your equipment feels weaker!
actors.buffs.degrade.desc=Powerful dark magic is sapping the strength that scrolls of upgrade have applied to your equipment!\n\nWhile degraded, upgraded gear will be treated as if it is a lower level than it actually is. _Every upgrade after +3 becomes exponentially weaker than the last one._ The descriptions of your items will change to reflect their reduced power level.\n\nDegradation does not affect strength requirements, wand charges, durability of thrown weapons, or artifacts.\n\nTurns of degradation remaining: %s. Using a scroll of upgrade or remove curse will end degradation immediately.
actors.buffs.doom.name=doomed
actors.buffs.doom.desc=It's hard to keep going when it seems like the universe wants you dead.\n\nDoomed characters will receive +67% damage from all sources.\n\nDoom is permanent, its effects only end in death.
actors.buffs.dread.name=dread
actors.buffs.dread.desc=A terror so great that it will cause its target to flee the dungeon entirely!\n\nCreatures affected by dread will run from their opponent at high speed, and will disappear from the dungeon entirely once they are out of sight. Enemies that are defeated this way award half experience and drop no items. The shock of pain will lessen the duration of dread.\n\nTurns of dread remaining: %d.
actors.buffs.drowsy.name=drowsy
actors.buffs.drowsy.desc=A magical force is making it difficult to stay awake, after a few turns, the target will fall into a deep magical sleep.\n\nThe hero can resist drowsiness by taking damage or by being at full health.\n\nTurns until sleep: %s.
actors.buffs.earthimbue.name=imbued with earth
actors.buffs.earthimbue.desc=You are imbued with the power of earth!\n\nAll physical attacks will shift the earth under the enemy, crippling them for a short time.\n\nTurns of earth imbue remaining: %s.
actors.buffs.enhancedrings.name=enhanced rings
actors.buffs.enhancedrings.desc=The Rogue's recently used artifact is empowering his rings, granting them +1 level.\n\nTurns remaining: %s.
actors.buffs.fireimbue.name=imbued with fire
actors.buffs.fireimbue.desc=You are imbued with the power of fire!\n\nAll physical attacks will have a chance to light enemies ablaze. Additionally, you are completely immune to the effects of fire.\n\nTurns of fire imbue remaining: %s.
actors.buffs.foresight.name=foresight
actors.buffs.foresight.desc=You are somehow able to see the layout of surrounding terrain with your mind.\n\nWhile under the effect of foresight all tiles in a wide radius are revealed to you, including any secret traps or doors.\n\nTurns of foresight remaining: %s.
actors.buffs.frost.name=frozen
actors.buffs.frost.freezes=%s freezes!
actors.buffs.frost.desc=Not to be confused with freezing solid, this more benign freezing simply encases the target in ice.\n\nFreezing acts similarly to paralysis, making it impossible for the target to act. Unlike paralysis, freezing is immediately cancelled if the target takes damage, as the ice will shatter.\n\nTurns of freeze remaining: %s.
actors.buffs.frostimbue.name=imbued with frost
actors.buffs.frostimbue.desc=You are imbued with icy power!\n\nAll physical attacks will steadily stack chill on enemies. Additionally, you are completely immune to the cold.\n\nTurns of frost imbue remaining: %s.
actors.buffs.fury.name=furious
actors.buffs.fury.heromsg=You become furious!
actors.buffs.fury.desc=You are angry, enemies won't like you when you're angry.\n\nA great rage burns within you, increasing the damage you deal with physical attacks by 50%%.\n\nThis rage will last as long as you are injured below 50%% health.
actors.buffs.blobimmunity.name=purification barrier
actors.buffs.blobimmunity.desc=Some strange force is encasing you in a thin protective barrier, blocking out all harmful airborne effects.\n\nYou are immune to all area-bound effects while this barrier lasts.\n\nTurns of immunity remaining: %s.
actors.buffs.greaterhaste.name=greater haste
actors.buffs.greaterhaste.desc=An incredible boost of speed, for a moment it feels as if everything else is standing still.\n\nWhile under the effects of greater haste moving actions take no time at all, but other actions are still performed at normal speed. Each step of movement consumes a turn of greater haste.\n\nTurns of greater haste remaining: %d.
actors.buffs.godspeed.name=Godspeed
actors.buffs.godspeed.desc=Godly energy courses through your whole essence, allowing you to perform actions at incredible speeds!\n\nWhile under the effects of godspeed you will perform all actions at double speed.\n\nTurns of godspeed remaining: %s.
actors.buffs.haste.name=haste
actors.buffs.haste.desc=Energy courses through your muscles, allowing you to run at incredible speeds!\n\nWhile under the effects of haste you will run at 3x speed, but will perform all other actions at normal speed.\n\nTurns of haste remaining: %s.
actors.buffs.healing.name=healing
actors.buffs.healing.desc=A magical remedy is causing wounds to close and flesh to knit.\n\nEvery turn health will steadily regenerate until the healing effect expires. The amount of healing may fade over time.\n\nNext heal: %d.\n\nHealing remaining: %d.
actors.buffs.herodisguise.name=disguise
actors.buffs.herodisguise.desc=Illusory magic has altered your physical appearance! The effect is purely cosmetic, but feels very strange regardless.\n\nTurns of disguise remaining: %s.
actors.buffs.hex.name=hexed
actors.buffs.hex.heromsg=You have been hexed!
actors.buffs.hex.desc=Dark magic which saps focus, making the target slightly disoriented.\n\nHexing reduces accuracy and evasion by 20%%, making the target less effective in combat.\n\nTurns of hex remaining: %s.
actors.buffs.holdfast.name=hold fast
actors.buffs.holdfast.desc=The %s is holding his position, increasing their armor by %d-%d. This will last until they move.
actors.buffs.hunger.hungry=hungry
actors.buffs.hunger.starving=starving
actors.buffs.hunger.onhungry=You are hungry.
actors.buffs.hunger.onstarving=You are starving!
actors.buffs.hunger.ondeath=You starved to death...
actors.buffs.hunger.cursedhorn=The cursed horn steals some of the food energy as you eat.
actors.buffs.hunger.rankings_desc=Starved to Death
actors.buffs.hunger.desc_intro_hungry=You can feel your stomach calling out for food, but it's not too urgent yet.
actors.buffs.hunger.desc_intro_starving=You're so hungry it hurts.
actors.buffs.hunger.desc=\n\nHunger slowly increases as you spend time in the dungeon, eventually you will begin to starve. While starving you will slowly lose health instead of regenerating it.\n\nRationing is important! If you have health to spare starving isn't a bad idea if it means there will be more food later. Effective rationing can make food last a lot longer!
actors.buffs.invisibility.name=invisible
actors.buffs.invisibility.desc=You are completely blended into the surrounding terrain, making you impossible to see.\n\nWhile you are invisible enemies are unable to attack or follow you. Physical attacks and magical effects (such as scrolls and wands) will immediately cancel invisibility.\n\nTurns of invisibility remaining: %s.
actors.buffs.invulnerability.name=invulnerable
actors.buffs.invulnerability.desc=You are suffused with great protective power, granting you a brief period of invulnerability!\n\nTurns remaining: %s.
actors.buffs.levitation.name=levitating
actors.buffs.levitation.desc=A magical force is levitating you over the ground, making you feel weightless.\n\nLevitating characters move silently and ignore all ground-based effects. Traps won't trigger, water won't put out fire, plants won't be trampled, roots will miss, and pits will be hovered over. Be careful, as all these things can come into effect the second the levitation ends!\n\nTurns of levitation remaining: %s.
actors.buffs.lifelink.name=life link
actors.buffs.lifelink.desc=This character's life force is linked to another character nearby. Any damage taken is shared between them.\n\nWhenever this character takes damage, half of it will be dealt to the life link target instead.\n\nTurns of life link remaining: %s, or until the linked character dies.
actors.buffs.light.name=illuminated
actors.buffs.light.desc=Even in the Darkest Dungeon, a steady light at your side is always comforting.\n\nLight helps keep darkness at bay, allowing you to see a reasonable distance despite the environment.\n\nTurns of illumination remaining: %s.
actors.buffs.lockedfloor.name=floor is locked
actors.buffs.lockedfloor.desc=The current floor is locked, and you are unable to leave it!\n\nWhile a floor is locked, you will not gain hunger or take damage from starving. In addition, if you do not work towards defeating this floor's boss, passive regeneration effects will also stop.\n\nAdditionally, if you are revived by an unblessed ankh while the floor is locked, then it will reset.\n\nKill this floor's boss to break the lock.
actors.buffs.lostinventory.name=lost inventory
actors.buffs.lostinventory.desc=Your inventory has been lost somewhere in the dungeon! You won't be able to pick up or use most items until you retrieve it.
actors.buffs.magicalsight.name=magical sight
actors.buffs.magicalsight.desc=Somehow you are able to see with your mind, rather than your eyes.\n\nWhile magical sight is active you will be able to see through all terrain in a 12 tile radius.\n\nTurns of magical sight remaining: %s.
actors.buffs.magicalsleep.name=magical sleep
actors.buffs.magicalsleep.toohealthy=You are too healthy, and resist the urge to sleep.
actors.buffs.magicalsleep.fallasleep=You fall into a deep magical sleep.
actors.buffs.magicalsleep.wakeup=You wake up feeling refreshed and healthy.
actors.buffs.magicalsleep.desc=This character has fallen into a deep magical sleep which they will not wake from naturally.\n\nMagical sleep is similar to regular sleep, except that only damage will cause the target to wake up.\n\nFor the hero and their allies, magical sleep has some restorative properties, allowing them to rapidly heal while resting.
actors.buffs.magicimmune.name=immune to magic
actors.buffs.magicimmune.desc=All magical effects have lost their hold on you, you are completely impervious to them.\n\nWhile magic immune all harmful and helpful magical effects will not apply to you, including curses, enchants, wands, scrolls, rings, artifacts, etc. Heroic armor abilities are strong enough to work regardless of this effect.\n\nTurns of magic immunity remaining: %s.
actors.buffs.overload.name=Overload
actors.buffs.overload.desc=The reality is overloaded. Prepare to cry, suffer, kill and slaughter.\n\nThe death of any hostile creature triggers the spawn of other creature.\n\nTurns of overload remaining: %s.
actors.buffs.mindvision.name=mind vision
actors.buffs.mindvision.desc=Somehow you are able to see all creatures on this floor through your mind. It's a weird feeling.\n\nAll characters on this floor are visible to you as long as you have mind vision. Seeing a creature through mind vision counts as it being seen or nearby for the purposes of many magical effects.\n\nTurns of mind vision remaining: %s.
actors.buffs.momentum.momentum=building momentum
actors.buffs.momentum.running=freerunning
actors.buffs.momentum.resting=recovering
actors.buffs.momentum.action_name=freerun
actors.buffs.momentum.momentum_desc=As he moves, the Freerunner builds momentum, which he can spend to start freerunning.\n\nEach charge of momentum grants two turns of freerunning, and the Freerunner can build up to 10 charges. Momentum is rapidly lost when the Freerunner stops moving.\n\nCurrent momentum charge: %d.
actors.buffs.momentum.running_desc=As he moves, the Freerunner builds momentum, which he can spend to start freerunning.\n\nWhile freerunning, the Freerunner moves at double speed and gains bonus evasion based on his level.\n\nTurns remaining: %d.
actors.buffs.momentum.resting_desc=As he moves, the Freerunner builds momentum, which he can spend to start freerunning.\n\nThe Freerunner needs time to regain his stamina before building momentum again.\n\nTurns remaining: %d.
actors.buffs.monkenergy.name=energy
actors.buffs.monkenergy.action=Monk Abilities
actors.buffs.monkenergy.desc=As she defeats enemies, the Monk gains energy that she can use on a variety of abilities. Most enemies grant 1 energy when defeated, and the Monk does not lose energy over time.\n\nCurrent energy: %1$d/%2$d.
actors.buffs.monkenergy.desc_cooldown=The Monk has recently used an ability, and must wait before using another.\n\nCurrent cooldown: %d turns.
actors.buffs.monkenergy$monkability$flurry.name=flurry of blows
actors.buffs.monkenergy$monkability$flurry.desc=Two instant strikes that deal %1$d-%2$d damage and ignore armor. This ability cannot be used repeatedly.
actors.buffs.monkenergy$monkability$flurry.empower_desc=Two instant strikes that deal %1$d-%2$d damage, ignore armor, _and use your weapon's enchantment._ This ability cannot be used repeatedly.
actors.buffs.monkenergy$monkability$focus.name=focus
actors.buffs.monkenergy$monkability$focus.desc=The Monk takes a turn to focus, letting her parry the next attack made against her.
actors.buffs.monkenergy$monkability$focus.empower_desc=The Monk _instantly focuses,_ letting her parry the next attack made against her.
actors.buffs.monkenergy$monkability$focus$focusbuff.name=focused
actors.buffs.monkenergy$monkability$focus$focusbuff.desc=The Monk is focused on her surroundings, anticipating the next attack made against her. While focused, she is guaranteed to parry the next incoming attack.
actors.buffs.monkenergy$monkability$dash.name=dash
actors.buffs.monkenergy$monkability$dash.prompt=Choose a Location
actors.buffs.monkenergy$monkability$dash.desc=An instant dash up to 4 tiles away. This ability can go over hazards, but not through enemies or solid terrain.
actors.buffs.monkenergy$monkability$dash.empower_desc=An instant dash up to _8 tiles_ away. This ability can go over hazards, but not through enemies or solid terrain.
actors.buffs.monkenergy$monkability$dragonkick.name=dragon kick
actors.buffs.monkenergy$monkability$dragonkick.desc=A devastating kick that deals %1$d-%2$d damage and ignores armor. The kick knocks the target away and paralyzes them for each tile they travel.
actors.buffs.monkenergy$monkability$dragonkick.empower_desc=A devastating kick that deals _%1$d-%2$d damage_ and ignores armor. The kick knocks _all adjacent targets_ away and paralyzes them for each tile they travel.
actors.buffs.monkenergy$monkability$meditate.name=meditate
actors.buffs.monkenergy$monkability$meditate.desc=The Monk focuses energy into her body for 5 turns. This clears most negative effects and grants her 8 turns of wand and artifact recharging.
actors.buffs.monkenergy$monkability$meditate.empower_desc=The Monk focuses energy into her body for 5 turns. This clears most negative effects and grants her 8 turns of wand and artifact recharging. _She also gains 80% damage resistance while meditating, and slowly heals for 20% of her missing HP._
actors.buffs.killevolution.name=kill counter
actors.buffs.killevolution.action=Kill Abilities
actors.buffs.killevolution.desc=As they defeat enemies, the hero gains energy that they can use on a variety of abilities. Most enemies grant 1 energy when defeated, and the hero does not lose energy over time.\n\n_However, unequipping a weapon associated with this buff associated with will lose all of this energy and you need to start killing enemies again_\n\nCurrent energy: %1$d/%2$d.
actors.buffs.killevolution.desc_cooldown=The hero has recently used an ability, and must wait before using another.\n\nCurrent cooldown: %d turns.
actors.buffs.killevolution$killevolutionability$invisibledash.name=invisible dash
actors.buffs.killevolution$killevolutionability$invisibledash.prompt=Choose a Location
actors.buffs.killevolution$killevolutionability$invisibledash.desc=An instant dash up to 4 tiles away with an additional turn of invisibility allowing the hero to surprise attack. This ability can go over hazards, but not through enemies or solid terrain.
actors.buffs.killevolution$killevolutionability$invisibledash.empower_desc=An instant dash up to _8 tiles_ away with an additional turn of invisibility allowing the hero to surprise attack. This ability can go over hazards, but not through enemies or solid terrain.
actors.buffs.killevolution$killevolutionability$physicallyempowered.name=physical empower
actors.buffs.killevolution$killevolutionability$physicallyempowered.desc=The hero grants itself +2 bonus damage for 10 hits.
actors.buffs.killevolution$killevolutionability$physicallyempowered.empower_desc=The hero grants itself _+4 bonus damage_ for 10 hits.
actors.buffs.killevolution$killevolutionability$weaponupgrade.name=weapon upgrade
actors.buffs.killevolution$killevolutionability$weaponupgrade.desc=The hero upgrades their weapon (and Duelist's second weapon if there's any) permanently.
actors.buffs.killevolution$killevolutionability$weaponupgrade.empower_desc=The hero upgrades their weapon (and Duelist's second weapon if there's any) _twice_ permanently.
actors.buffs.killevolution$killevolutionability$chain.name=chain enemy
actors.buffs.killevolution$killevolutionability$chain.desc=The hero chains an enemy to pull them in closer range.
actors.buffs.killevolution$killevolutionability$immortalize.name=immortalize
actors.buffs.killevolution$killevolutionability$immortalize.desc=The hero grants itself immortality against all sources of damage for 15 turns.
actors.buffs.killevolution$killevolutionability$immortalize.empower_desc=The hero grants itself immortality against all sources of damage for _~22 turns_.
actors.buffs.ooze.name=caustic ooze
actors.buffs.ooze.heromsg=Caustic ooze eats your flesh. Wash it away!
actors.buffs.ooze.ondeath=You melt away...
actors.buffs.ooze.rankings_desc=Dissolved
actors.buffs.ooze.desc=This sticky acid clings to flesh, slowly melting it away.\n\nOoze will deal consistent damage over time, but can be immediately washed off in water.\n\nTurns of ooze remaining: %s.
actors.buffs.paralysis.name=paralysed
actors.buffs.paralysis.heromsg=You are paralysed!
actors.buffs.paralysis.out=resisted paralysis
actors.buffs.paralysis.desc=Oftentimes the worst thing to do is nothing at all.\n\nParalysis completely halts all actions, forcing the target to wait until the effect wears off. The pain from taking damage can cause characters to resist paralysis, breaking them out of the effect.\n\nTurns of paralysis remaining: %s.
actors.buffs.physicalempower.name=physically empowered
actors.buffs.physicalempower.desc=Your blows have been empowered, increasing the amount of damage you can deal when you hit enemies with physical attacks.\n\nBonus damage: %1$d.\nHits remaining: %2$d.
actors.buffs.pincushion.name=pincushion
actors.buffs.pincushion.desc=The thrown weapons you have used against this character are currently stuck to them and will fall to the floor after they are defeated.\n\nThe following items are currently attached:
actors.buffs.poison.name=poisoned
actors.buffs.poison.heromsg=You are poisoned!
actors.buffs.poison.ondeath=You died from poison...
actors.buffs.poison.rankings_desc=Succumbed to Poison
actors.buffs.poison.desc=Poison works its way through the body, slowly impairing its internal functioning.\n\nPoison deals damage each turn proportional to how long until it expires.\n\nTurns of poison remaining: %s.
actors.buffs.preparation.name=preparation
actors.buffs.preparation.action_name=prepared strike
actors.buffs.preparation.desc=The Assassin is walking nervously, preparing to thurst knife into target.
actors.buffs.preparation.desc_dmg=His next attack will deal _%1$d%% bonus damage_, and will execute regular enemies below _%2$d%% health_, or bosses below _%3$d%% health_.
actors.buffs.preparation.desc_dmg_likely=The attack will also be more likely to deal a larger amount of damage.
actors.buffs.preparation.desc_blink=He is able to blink towards an enemy before striking them, with a max distance of _%d._
actors.buffs.preparation.desc_invis_time=The Assassin has been running for _%d turns._
actors.buffs.preparation.desc_invis_next=His attack will become stronger at _%d turns._
actors.buffs.preparation.prompt=Select a target to attack!\nMax blink distance: %d
actors.buffs.preparation.no_target=There's nothing to attack there.
actors.buffs.preparation.out_of_reach=That target is out of reach.
actors.buffs.preparation.assassinated=assassinated
actors.buffs.marked.name=Marked
actors.buffs.marked.desc=The Hunter is waiting patiently, preparing to strike while his bbat weakens enemies.
actors.buffs.marked.desc_dmg=The bbat deals %s%% more damage to this enemy. You will be able to jump to marked enemy at any moment, but more bonus damage means more debuffs.
actors.buffs.marked.prompt=Select a target to teleport!\nMax blink distance: your view distance
actors.buffs.marked.no_target=There's nothing to teleport there.
actors.buffs.marked.out_of_reach=That target is out of reach.
actors.buffs.marked.assassinated=assassinated
actors.buffs.marked.desc_poison=At this point, you will _poison_ a target, dealing damage over time.
actors.buffs.marked.desc_cripple=At this point, you will _cripple_ the legs of target, reducing its movement speed.
actors.buffs.marked.desc_blinding=At this point, you will also make target _blind_,reducing its field of view to 1 tile.
actors.buffs.marked.desc_bleeding=At this point, you will also make target _bleed_,dealing damage over time.
actors.buffs.marked.desc_vulnerable=At this point, you will also _increase physical damage_ to enemy.
actors.buffs.marked.desc_hexed=At this point, you will also stun target, _reducing its accuracy and dexterity_ for short time.
actors.buffs.marked.desc_slow=At this point, you will also disorientate target, _slowing_ its actions.
actors.buffs.marked.desc_ooze=At this point, you will also apply deadly _caustic ooze_ to target, dealing damage over time until target finds water.
actors.buffs.marked.desc_paralysis=At this point, you will completely _paralyse_ the enemy, rendering it unable to attack.
actors.buffs.marked.desc_doom=At this point, you will also curse the enemy, _significantly increasing any damage to it_.
actors.buffs.prismaticguard.name=prismatic Guard
actors.buffs.prismaticguard.desc=You are being guarded by a prismatic image which is currently inactive. When enemies are present the prismatic image will spring to action and protect you!\n\nWhile inactive, the prismatic image will steadily recover from any damage it has taken.\n\nCurrent HP: %d/%d.
actors.buffs.recharging.name=recharging
actors.buffs.recharging.desc=Energy is coursing through you, improving the rate that your wands and staffs charge.\n\nEach turn this buff will increase current charge by one quarter, in addition to regular recharge.\n\nTurns of recharging remaining: %s.
actors.buffs.revealedarea.name=revealed area
actors.buffs.revealedarea.desc=An area of the dungeon has been temporarily revealed to the hero, They will see it no matter where they are.\n\nTurns remaining: %s.
actors.buffs.revealedchar.name=revealed
actors.buffs.revealedchar.desc=This character is revealed to the hero, They will be visible no matter where they are.\n\nTurns remaining: %s.
actors.buffs.roots.name=rooted
actors.buffs.roots.heromsg=You can't move!
actors.buffs.roots.desc=Roots (magical or natural) grab at the feet, forcing them down to the ground.\n\nRoots lock a target in place, making movement and most movement abilities impossible. Other actions are not affected, including teleportation effects.\n\nTurns of root remaining: %s.
actors.buffs.scrollempower.name=scroll empower
actors.buffs.scrollempower.desc=The energy from the Mage's recently read scroll is empowering his wands!\n\nLevel Boost: +%1$d.\nZaps remaining: %2$d.
actors.buffs.shadows.name=shadowmelded
actors.buffs.shadows.desc=You are blended into the shadows around you, granting you invisibility and slowing your metabolism.\n\nWhile you are invisible enemies are unable to attack or follow you. Most physical attacks and magical effects (such as scrolls and wands) will immediately cancel invisibility. Additionally, while shadowmelded, your rate of hunger is slowed.\n\nYou will remain shadowmelded until you leave the shadows or an enemy comes into contact with you.
actors.buffs.slow.name=slowed
actors.buffs.slow.desc=Slowing magic affects the target's rate of time, to them everything is moving super-fast.\n\nA slowed character performs all actions in twice the amount of time they would normally take.\n\nTurns of slow remaining: %s.
actors.buffs.snipersmark.name=sniper's mark
actors.buffs.snipersmark.action_name_snapshot=snapshot
actors.buffs.snipersmark.action_name_volley=volley
actors.buffs.snipersmark.action_name_sniper=sniper shot
actors.buffs.snipersmark.desc=The Sniper is honed in on the target she most recently attacked. She is able to perform a special attack with her bow which will vary based on how the bow is augmented.\n\nAn unaugmented bow will fire a _snapshot,_ which deals reduced damage but does not take any time to fire.\n\nA bow augmented for speed will fire a _volley_ of three arrows. Each arrow will deal reduced damage, but can still activate enchantment. This volley takes 1 turn to shoot.\n\nA bow augmented for damage will fire a _sniper shot._ This shot is guaranteed to hit, deals bonus damage based on distance from the target, and takes 2 turns to fire.\n\nTurns remaining: %s.
actors.buffs.soulmark.name=soul marked
actors.buffs.soulmark.desc=The warlock has tapped into the soul of this creature, allowing him to heal as it takes physical damage.\n\nTurns of soul mark remaining: %s.
actors.buffs.stamina.name=stamina
actors.buffs.stamina.desc=You have unending stamina, allowing for faster movement!\n\nWhile under the effects of stamina you will run at +50%% speed, but will perform all other actions at normal speed.\n\nTurns of stamina remaining: %s.
actors.buffs.vulnerable.name=vulnerable
actors.buffs.vulnerable.heromsg=You feel fragile!
actors.buffs.vulnerable.desc=Vulnerability magic increases all physical damage that a character takes by 33%%, after that damage has been reduced by armor.\n\nTurns of vulnerable remaining: %s.
actors.buffs.terror.name=terrified
actors.buffs.terror.desc=Terror is manipulative magic which forces its target into an uncontrollable panic.\n\nTerrified characters are forced to run away from their opponent, trying to put as many doors and walls between them as possible. The shock of pain will lessen the duration of terror, however.\n\nTurns of terror remaining: %s.
actors.buffs.toxicimbue.name=imbued with toxicity
actors.buffs.toxicimbue.desc=You are imbued with poisonous energy!\n\nAs you move around toxic gas will constantly billow forth from you, damaging your enemies. You are immune to toxic gas and poison for the duration of the effect, as well as for a few turns afterward.\n\nTurns of toxic imbue remaining: %s.
actors.buffs.corrosion.name=corrosion
actors.buffs.corrosion.heromsg=You are melting!
actors.buffs.corrosion.ondeath=You melt away...
actors.buffs.corrosion.rankings_desc=Dissolved
actors.buffs.corrosion.desc=Powerful acid melts away flesh, metal, and bone at an alarming rate.\n\nCorrosion damage increases over time, as the target continues to melt away.\n\nTurns of corrosion remaining: %1$s.\nCurrent corrosion damage: %2$d.
actors.buffs.vertigo.name=vertigo
actors.buffs.vertigo.desc=Walking in a straight line can be difficult when the whole world is spinning.\n\nWhile under the effects of vertigo, characters who attempt to move will go in a random direction, instead of the one they intended to go in.\n\nTurns of vertigo remaining: %s.
actors.buffs.wandempower.name=wands empowered
actors.buffs.wandempower.desc=Your damage-dealing wands have been empowered, increasing the amount of damage they deal for a few hits.\n\nBonus damage: %1$d.\nHits remaining: %2$d.
actors.buffs.weakness.name=weakened
actors.buffs.weakness.heromsg=You feel weakened!
actors.buffs.weakness.desc=Everything suddenly seems much heavier.\n\nWeakening magic reduces a character's physical strength, causing them to deal 33%% reduced damage.\n\nTurns of weakness remaining: %s.
actors.buffs.wellfed.name=well fed
actors.buffs.wellfed.desc=You feel quite satisfied and full.\n\nWhile well fed, your hunger will not increase, and you will heal an additional amount of health over time.\n\nTurns remaining: %d.
actors.buffs.danceimmunebuff.name=immune to dance curse
actors.buffs.danceimmunebuff.desc=All dancing effects loses all its power for a short time, well extending the effect is not effective, you must wait for this effect to wear down before using the spell again.\n\nTurns of magic immunity remaining: %s.
actors.hero.abilities.armorability.self_target=You can't target yourself!
actors.hero.abilities.armorability.no_target=There's nothing to target there!
actors.hero.abilities.armorability.prompt=Choose a location to target
actors.hero.abilities.armorability.cost=Charge cost: _%d_
actors.hero.abilities.warrior.heroicleap.name=heroic leap
actors.hero.abilities.warrior.heroicleap.prompt=Choose direction to leap
actors.hero.abilities.warrior.heroicleap.short_desc=The Warrior performs a _Heroic Leap_ towards a targeted location, sailing above enemies and hazards.
actors.hero.abilities.warrior.heroicleap.desc=The Warrior leaps toward a targeted location, going over any enemies or hazards in the way. He cannot leap over walls or other solid terrain however.
actors.hero.abilities.warrior.shockwave.name=shockwave
actors.hero.abilities.warrior.shockwave.short_desc=The Warrior releases a _Shockwave_ in a conical AOE by slamming the ground. Enemies caught in the shockwave are damaged and crippled.
actors.hero.abilities.warrior.shockwave.desc=The Warrior slams the ground, producing a shockwave that travels up to 5 tiles in a 60 degree cone.\n\nEnemies caught in this shockwave are crippled for 5 turns. They also take 5-10 damage, plus an additional 1-2 damage for every point of strength the Warrior has above 10.
actors.hero.abilities.warrior.endure.name=endure
actors.hero.abilities.warrior.endure$enduretracker.name=endurance
actors.hero.abilities.warrior.endure$enduretracker.desc=The Warrior is now dealing bonus damage based on the damage he endured.\n\nBonus Damage: %1$d\nHits Left: %2$d
actors.hero.abilities.warrior.endure.short_desc=The Warrior _Endures_, skipping several turns but gaining high damage resistance. He then deals bonus damage based on what he endured.
actors.hero.abilities.warrior.endure.desc=The Warrior endures for 3 turns, taking half damage from all sources. This reduction is applied before damage resisting effects like armor.\n\nAfter enduring, the warrior's next hit within 10 turns gains bonus damage. This bonus damage is equal to half of all the damage inflicted on him while enduring, before any damage reduction effects!\n\nIf the Warrior has any combo, using this ability increases its remaining time by 3 turns.
actors.hero.abilities.mage.elementalblast.name=elemental blast
actors.hero.abilities.mage.elementalblast.no_staff=You can't use this ability without your staff.
actors.hero.abilities.mage.elementalblast.short_desc=The Mage emits an _Elemental Blast_ from his staff, covering a large area around him in an effect that varies based on the wand in his staff.
actors.hero.abilities.mage.elementalblast.desc=The Mage emits a blast of magic, which covers a circular region up to 4 tiles away and deals up to 15-25 damage. The specific effect of elemental blast will vary by the wand imbued in the Mage's staff.
actors.hero.abilities.mage.elementalblast.generic_desc=The effect of elemental blast will be similar to the effect of the wand when zapped at an enemy or ally.
actors.hero.abilities.mage.wildmagic.name=wild magic
actors.hero.abilities.mage.wildmagic.no_wands=You have no wands to zap with!
actors.hero.abilities.mage.wildmagic.short_desc=The Mage unleashes the _Wild Magic_ contained in his wands, randomly firing them multiple times at a chosen target over a single turn.
actors.hero.abilities.mage.wildmagic.desc=The Mage unleashes the power in his wands, randomly firing them up to 4 times in a single turn. The Mage's staff is not included in this effect.\n\nEach wand also has its level boosted by 2, up to +3. This ability uses half a wand charge for each zap, and no one wand can be fired more than 2 times.
actors.hero.abilities.mage.warpbeacon.name=warp beacon
actors.hero.abilities.mage.warpbeacon.depths=You can't warp between depths!
actors.hero.abilities.mage.warpbeacon.locked_floor=You cannot leave a locked floor!
actors.hero.abilities.mage.warpbeacon.too_far=That location is too far!
actors.hero.abilities.mage.warpbeacon.invalid_beacon=You can't place a beacon there!
actors.hero.abilities.mage.warpbeacon.window_desc=Your beacon is currently placed on floor %d.
actors.hero.abilities.mage.warpbeacon.window_tele=teleport to beacon
actors.hero.abilities.mage.warpbeacon.window_clear=clear beacon
actors.hero.abilities.mage.warpbeacon.window_cancel=cancel
actors.hero.abilities.mage.warpbeacon.short_desc=The Mage places a _Warping Beacon_ at his current location, which he can instantly teleport back to.
actors.hero.abilities.mage.warpbeacon.desc=The Mage places a beacon, which can then be warped to at will. Placing the beacon takes 1 turn, but warping to it is instantaneous.\n\nThe Mage cannot warp between floors by default, or use the beacon to reach inaccessible places such as locked rooms. The Mage can teleport into enemies, which will push them aside.
actors.hero.abilities.rogue.smokebomb.name=smoke bomb
actors.hero.abilities.rogue.smokebomb.fov=You can only jump to an empty location in your field of view
actors.hero.abilities.rogue.smokebomb.prompt=Choose a location to jump to
actors.hero.abilities.rogue.smokebomb$ninjalog.name=wooden decoy
actors.hero.abilities.rogue.smokebomb$ninjalog.desc=Somehow, enemies are easily convinced that this wooden decoy is the real Rogue!
actors.hero.abilities.rogue.smokebomb.short_desc=The Rogue throws down a _Smoke Bomb_ while blinking away. He blinds enemies near his old location.
actors.hero.abilities.rogue.smokebomb.desc=The Rogue throws down a smoke bomb and blinks up to 6 tiles away. He can blink through hazards and enemies, but not through solid terrain like walls.\n\nEnemies that are adjacent to the Rogue's old position will be blinded for 5 turns.
actors.hero.abilities.rogue.deathmark.name=death mark
actors.hero.abilities.rogue.deathmark.ally_target=You can only mark enemies
actors.hero.abilities.rogue.deathmark.short_desc=The Rogue places a _Death Mark_ on a chosen enemy. Marked enemies take bonus damage, but cannot die until the mark ends.
actors.hero.abilities.rogue.deathmark.desc=The Rogue places a mark on a chosen enemy, causing them to take 25% extra damage. The mark is applied instantly and lasts for 5 turns.\n\nMarked enemies take bonus damage but are unable to die until the mark expires. If an enemy has 0 HP when the mark ends, they will immediately die.
actors.hero.abilities.rogue.deathmark$deathmarktracker.name=marked for death
actors.hero.abilities.rogue.deathmark$deathmarktracker.desc=This enemy has been marked, causing them to take 25%% bonus damage, but also rendering them unable to die until the mark ends.\n\nTurns remaining: %s.
actors.hero.abilities.rogue.shadowclone.name=shadow clone
actors.hero.abilities.rogue.shadowclone.short_desc=The Rogue summons a _Shadow Clone_, which can be directed to aid him in combat.
actors.hero.abilities.rogue.shadowclone.desc=The Rogue summons a shadowy mimic of himself, which can be directed to aid him in combat. Directing the shadow clone does not cost any charge.\n\nThe clone has 80 HP, no armor, and deals 10-20 damage. All of these traits can be improved with talents, such that the clone benefits from weapons and armor the hero has.
actors.hero.abilities.rogue.shadowclone$shadowally.name=shadow rogue
actors.hero.abilities.rogue.shadowclone$shadowally.direct_defend=Your clone moves to that position.
actors.hero.abilities.rogue.shadowclone$shadowally.direct_follow=Your clone moves to follow you.
actors.hero.abilities.rogue.shadowclone$shadowally.direct_attack=Your clone moves to attack!
actors.hero.abilities.rogue.shadowclone$shadowally.desc=A copy of the Rogue, made from shadowy darkness. It stands stock still, with empty eyes and tiny wisps of darkness rising from it like steam.\n\nThe clone is not a perfect copy of the Rogue, but is still a decent fighter, and can benefit from the Rogue's equipment with the right talents.
actors.hero.abilities.huntress.spectralblades.name=spectral blades
actors.hero.abilities.huntress.spectralblades.short_desc=The Huntress throws _Spectral Blades_ at a target, inflicting damage depending on her currently equipped melee weapon.
actors.hero.abilities.huntress.spectralblades.desc=The Huntress throws out a spectral blade at an enemy, which acts like a ranged strike from her melee weapon. All of the normal effects of a melee weapon will activate, including enchantments.
actors.hero.abilities.huntress.naturespower.name=nature's power
actors.hero.abilities.huntress.naturespower.short_desc=The Huntress calls upon _Nature's Power_, increasing her movement speed and her bow's rate of fire for a short time.
actors.hero.abilities.huntress.naturespower.desc=The Huntress temporarily empowers herself and her bow with the power of nature! This lasts for 8 turns.\n\nDuring this time, the Huntress moves at 2x speed, and attacks 33% faster with her bow. The bonus bow effects do not trigger if the Sniper is using her special attacks.
actors.hero.abilities.huntress.naturespower$naturespowertracker.name=nature's power
actors.hero.abilities.huntress.naturespower$naturespowertracker.desc=The Huntress is briefly empowered, increasing her movement speed and attack speed with her bow.\n\nTurns remaining: %s.
actors.hero.abilities.huntress.spirithawk.name=spirit hawk
actors.hero.abilities.huntress.spirithawk.no_space=There is no free space near you.
actors.hero.abilities.huntress.spirithawk.short_desc=The Huntress summons a _Spirit Hawk_ familiar, which can help her scout locations and distract enemies.
actors.hero.abilities.huntress.spirithawk.desc=The Huntress summons a spirit hawk familiar, which can be directed by using the ability again while it is summoned. The hawk lasts for 100 turns, directing the hawk does not cost any charge.\n\nThe hawk has minimal health and attacking power, but is fast, evasive, and accurate. It shares its entire field of vision with the Huntress at all times. It is immune to all area-bound effects, such as fire and poison gas. It will not attack unless specifically directed to.
actors.hero.abilities.huntress.spirithawk$hawkally.name=spirit hawk
actors.hero.abilities.huntress.spirithawk$hawkally.direct_defend=Your hawk moves to that position.
actors.hero.abilities.huntress.spirithawk$hawkally.direct_follow=Your hawk moves to follow you.
actors.hero.abilities.huntress.spirithawk$hawkally.direct_attack=Your hawk moves to attack!
actors.hero.abilities.huntress.spirithawk$hawkally.desc=A magical hawk, summoned by the Huntress. It glows a bright ethereal blue, its head constantly shifts around as it surveys the area.\n\nWhile it isn't much of a fighter its speed and vision make it excellent for scouting and distracting enemies.
actors.hero.abilities.huntress.spirithawk$hawkally.desc_remaining=Turns remaining: %d.
actors.hero.abilities.huntress.spirithawk$hawkally.desc_dodges=Guaranteed dodges remaining: %d.
actors.hero.abilities.duelist.challenge.name=challenge
actors.hero.abilities.duelist.challenge.prompt=Choose an enemy to challenge
actors.hero.abilities.duelist.challenge.already_dueling=You can only be in one duel at a time.
actors.hero.abilities.duelist.challenge.ally_target=You can only challenge enemies.
actors.hero.abilities.duelist.challenge.unreachable_target=You must be able to reach your target.
actors.hero.abilities.duelist.challenge.distant_target=That enemy is too far away to challenge.
actors.hero.abilities.duelist.challenge.short_desc=The Duelist _Challenges_ a nearby enemy to a duel, temporarily freezing all other enemies.
actors.hero.abilities.duelist.challenge.desc=The Duelist challenges a nearby enemy to a duel. That enemy is compelled to fight her while all other enemies are temporarily frozen in time.\n\nThe target must be reachable and within 5 tiles of the Duelist. The duel lasts until 10 turns pass, the enemy dies, or the Duelist is more than 5 tiles away from the enemy.\n\nFrozen enemies are invulnerable. The Duelist's allies are not frozen by this ability, but if a boss is targeted its minions will not be frozen either.
actors.hero.abilities.duelist.challenge$duelparticipant.name=duel participant
actors.hero.abilities.duelist.challenge$duelparticipant.desc=This character is participating in a duel. They, and any of their allies or minions, are allowed to act normally while others are frozen.\n\nThe duel will last for a set amount of time, until one participant dies, or until the participants move more than 5 tiles away from eachother.\n\nTurns remaining: %d.
actors.hero.abilities.duelist.elementalstrike.name=elemental strike
actors.hero.abilities.duelist.elementalstrike.short_desc=The Duelist performs an _Elemental Strike_, spreading an effect in a conical AOE based on her weapon enchantment.
actors.hero.abilities.duelist.elementalstrike.desc=The Duelist strikes an enemy or location, performing a regular attack that's guaranteed to hit and spreading a magical effect that travels up to 4 tiles in a 65 degree cone. This magical effect varies based on the enchantment on the Duelist's primary weapon.
actors.hero.abilities.duelist.elementalstrike.generic_desc=An elemental strike with no enchantment will release a small burst of magic, dealing 6-12 damage to all enemies in range.
actors.hero.abilities.duelist.feint.name=feint
actors.hero.abilities.duelist.feint.prompt=Choose a location to dash to
actors.hero.abilities.duelist.feint.too_far=That location is not adjacent to you.
actors.hero.abilities.duelist.feint.bad_location=You can't move to that location.
actors.hero.abilities.duelist.feint.short_desc=The Duelist _Feints_, faking an attack while dashing to an adjacent tile. Enemies will attack her afterimage, leaving them open to a counterattack.
actors.hero.abilities.duelist.feint.desc=The Duelist fakes an attack while dashing to an adjacent tile, leaving behind a momentary afterimage of herself. Enemies that were attacking the Duelist will attack her afterimage instead.\n\nEnemies that attack the afterimage become confused, which cancels their next action and leaves them open to a surprise attack.
actors.hero.abilities.ratmogrify.name=ratmogrify
actors.hero.abilities.ratmogrify.cant_transform=You can't ratmogrify that!
actors.hero.abilities.ratmogrify.too_strong=That enemy is too strong to ratmogrify!
actors.hero.abilities.ratmogrify.short_desc=The hero _Ratmogrifies_ an enemy! This temporarily turns them into a rat with no abilities.
actors.hero.abilities.ratmogrify.desc=The hero transforms an enemy into a rat for 6 turns! Bosses, allies, and rats cannot be ratmogrified.\n\nRatmogrified enemies retain their original stats, but do not have any abilities.
actors.hero.abilities.ratmogrify$transmograt.name=ratmogrified %s
actors.hero.abilities.ratmogrify$transmograt.desc=This enemy has been transformed into a rat. A big improvement, if you ask me! - Rat King
actors.hero.abilities.ratmogrify$transmograt.rankings_desc=Slain by: ratmogrified enemy
actors.hero.abilities.ratking.legacywrath.name=divine fury
actors.hero.abilities.ratking.legacywrath.short_desc=I unleash my _Divine Fury_ upon my enemies. It leaves me exposed for a few turns and drains all my armor charge. Everything must come at price!
actors.hero.abilities.ratking.legacywrath.desc=I unlock the ability to channel overwhelming power. With it, I can blink to any nearby location no further than 6 tiles, blinding any enemies adjacent to my old location. Once there, I will cast a spell of magical earth on everyone I can see in 6 tiles area (the effect depends on talents) and create a fan of spectral blades targeting any mob within 6 tiles of me before turning invisible.\n\nThis ability takes 2 turns to leap, 1 turn to rooting earth, and one turn to spectral blades, though using this with no enemies in sight will skip the attacking.\n\nUnfortunately, _I have to use all of my armor charge or 33% of my current HP_ to get enough power for this ability.
actors.hero.hero.name=you
actors.hero.hero.leave=You can't leave yet, the rest of the dungeon awaits below!
actors.hero.hero.level_up=Level up!
actors.hero.hero.new_level=Level up! +Accuracy, +Evasion, +5 HP!
actors.hero.hero.new_talent=+1 Talent Point!
actors.hero.hero.unspent=You have unspent talent points!
actors.hero.hero.level_cap=You cannot grow stronger, but your experiences do give you a surge of power!
actors.hero.hero.you_now_have=you picked up: %s.
actors.hero.hero.you_cant_have=you can't carry: %s.
actors.hero.hero.locked_chest=This chest is locked and you don't have a matching key.
actors.hero.hero.locked_door=You don't have a matching key.
actors.hero.hero.noticed_smth=You noticed something.
