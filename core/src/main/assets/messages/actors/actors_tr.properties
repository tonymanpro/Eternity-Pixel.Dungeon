###blobs
actors.blobs.blizzard.name=Kar fırtınası
actors.blobs.blizzard.desc=Burada bir kar fırtınası hortum halinde bulunuyor.

actors.blobs.confusiongas.name=karışıklık gazı
actors.blobs.confusiongas.desc=Burada baş döndürücü bir gaz bulutu süzülüyor.

actors.blobs.electricity.name=elektrik
actors.blobs.electricity.desc=Burada bir elektrik alanı parlak bir şekilde kıvılcımlanıyor.
actors.blobs.electricity.rankings_desc=Elektrik çarptı
actors.blobs.electricity.ondeath=Elektrik şoku dolayısıyla öldün...

actors.blobs.fire.name=ateş
actors.blobs.fire.desc=Burada bir ateş yanıyor.

actors.blobs.foliage.name=yapraklar
actors.blobs.foliage.desc=Işık demetleri yeraltı bahçesinin kasvetini delip geçiyor.

actors.blobs.freezing.name=dondurucu hava
actors.blobs.freezing.desc=Buradaki hava anormal derecede soğuk.

actors.blobs.goowarn.name=karanlık enerji
actors.blobs.goowarn.desc=Kara enerji tanecikleri burada hızla yayılıyor!

actors.blobs.inferno.name=cehennem
actors.blobs.inferno.desc=Büyük bir ateş burada şiddetleniyor.

actors.blobs.paralyticgas.name=felç edici gaz
actors.blobs.paralyticgas.desc=Burada felç edici bir gaz bulutu süzülüyor.

actors.blobs.regrowth.name=yeniden büyüme

actors.blobs.sacrificialfire.name=kurban ateşi
actors.blobs.sacrificialfire.desc=Burada üzerinde kurban ateşi yanan bir sunak var. Burada öldürülen herhangi bir yaratık, zindanın ruhlarına bir adak olarak tüketilecek.\n\nBelki de yeterince kurban verilirse bir ödül verilecektir?
actors.blobs.sacrificialfire.worthy=Ateş kurbanını tüketerek güçlendi.
actors.blobs.sacrificialfire.unworthy=Ateş kurbanını tüketti, ama değişmedi.
actors.blobs.sacrificialfire.reward=Ateş geriye bir ödül bırakarak parladı ve kayboldu!

actors.blobs.smokescreen.name=sis perdesi
actors.blobs.smokescreen.desc=Burada kalın bi siyah duman bulutu süzülüyor.

actors.blobs.stenchgas.name=pis kokulu gaz
actors.blobs.stenchgas.desc=Burada kötü kokulu bir gaz bulutu süzülüyor.

actors.blobs.stormcloud.name=fırtına bulutları
actors.blobs.stormcloud.desc=Burada bir su buharı bulutu dalgalar halinde süzülüyor.

actors.blobs.toxicgas.name=zehirli gaz
actors.blobs.toxicgas.desc=Burada yeşilimsi bir zehirli gaz bulutu süzülüyor.
actors.blobs.toxicgas.rankings_desc=Boğuldu
actors.blobs.toxicgas.ondeath=Zehirli gazdan öldün...

actors.blobs.corrosivegas.name=aşındırıcı gaz
actors.blobs.corrosivegas.desc=Burada zehirli bir aşındırıcı çamur bulutu süzülüyor.

actors.blobs.waterofawareness.name=farkındalık suyu
actors.blobs.waterofawareness.procced=Bir yudum alırken zihnine bilgi aktığını hissediyorsun.
actors.blobs.waterofawareness.desc=Bu kuyunun suyundan bilginin gücü yayılır. Kuyudan su içmek tüm kuşanılan eşyaları tam olarak tanımlayacak, envanterinizdeki tüm eşyaların üzerindeki lanetleri belirleyecek ve mevcut kattaki tüm eşyaları ortaya çıkaracaktır.

actors.blobs.waterofhealth.name=sağlık suyu
actors.blobs.waterofhealth.procced=Bir yudum alırken yaralarının tamamen iyileştiğini hissediyorsun.
actors.blobs.waterofhealth.desc=Bu kuyunun suyundan sağlık gücü yayılır. Bu kuyudan su içmek yaralarınızı iyileştirir, açlığınızı giderir ve yıpranmış eşyaların üzerindeki lanetleri temizler.

actors.blobs.web.name=örümcek ağı
actors.blobs.web.desc=Kalın bir ağ buradaki her şeyi kaplıyor. Ağa takılan veya fırlatılan her şey onu bozacaktır fakat aynı zamanda yerinde sıkışıp kalacaktır.



###buffs
actors.buffs.adrenaline.name=adrenalin
actors.buffs.adrenaline.desc=Fiziksel bir güç akını olan adrenalin hem saldırı hem de hareket hızını arttırır.\n\nAdrenalin, hedefinin 2 kat daha hızlı koşmasına ve 1.5 kat daha hızlı saldırmasına olanak sağlar.\n\nKalan hamle: %s.

actors.buffs.adrenalinesurge.name=güç takviyesi
actors.buffs.adrenalinesurge.desc=Ani bir güç patlaması, ama ne yazık ki kalıcı değil.\n\nGüç takviyesi: +%d.\nTakviyenin geçmesine kalan sıra: %s.

actors.buffs.amok.name=cinnet
actors.buffs.amok.desc=Cinnet, etkilenen hedefi büyük bir öfke ve kafa karışıklığına sokar.\n\nCinnet geçiren bir yaratık, yakınında ne varsa dost düşman demeden saldırır.\n\nCinnetin geçmesine kalan sıra: %s.

actors.buffs.arcanearmor.name=gizemli zırh
actors.buffs.arcanearmor.desc=İnce bir kalkan seni çevreleyerek büyülü saldırılardan gelen hasarın bir kısmını engelliyor.\n\nBüyülü zırhın şimdilik şu kadar güçlendirildi: 0-%d.\n\nGizemli zırhın zayıflamasına kalan sıra: %s.

actors.buffs.artifactrecharge.name=eser reşarjı
actors.buffs.artifactrecharge.desc=İçinden akıp geçen enerji, kuşandığın eserlerin şarj olma hızı arttırıyor.\n\nHer eser farklı şekilde etkilenir ama hepsi normalden çok daha hızlı şarj olur.\n\nKalan sıra: %s.

actors.buffs.ascensionchallenge.name=muska'nın laneti
actors.buffs.ascensionchallenge.desc=Yog-Dzewa bir şekilde muska aracılığıyla bu dünya üzerindeki etkisini sürdürüyor ve yükselişini durdurmaya çalışıyor!\n\nYog'un gücü, zindanı çok daha tehlikeli hale getiriyor, düşman sayısını arttırıyor ve onları güçlendiriyor! Bu güç denetimsiz bırakılırsa artmaya devam edecek ama Yog'un gücüyle kuvvetlendirilmiş düşmanları yenerek zayıflatılabilir.
actors.buffs.ascensionchallenge.desc_clear=Muskadan yayılan karanlık enerji şimdilik mümkün olduğu kadar zayıflatıldı.
actors.buffs.ascensionchallenge.desc_beckon=Muska şu anda _uzaktaki düşmanlara sesleniyor,_ onlara senin konumunu bildiriyor.
actors.buffs.ascensionchallenge.desc_haste=Muska şu anda _uzaktaki düşmanları hızlandırıyor,_ onların sana daha hızlı ulaşmalarını sağlıyor!
actors.buffs.ascensionchallenge.desc_slow=Muska şu anda _seni yavaşlatıyor_ ve hız artırma etkilerini geçersiz kılıyor!
actors.buffs.ascensionchallenge.desc_damage=Muskadan gelen enerji o kadar güçlendi ki _sana doğrudan zarar veriyor!_
actors.buffs.ascensionchallenge.beckon=Muska uzaktaki düşmanlara seslenmeye başladı.
actors.buffs.ascensionchallenge.haste=Muska uzaktaki düşmanları hızlandırmaya başladı!
actors.buffs.ascensionchallenge.slow=Muska, envanterinde kurşundan bir ağırlık gibi hissettirmeye başladı!
actors.buffs.ascensionchallenge.damage=Muska karanlık enerji yaymaya başladı. Yakıyor!
actors.buffs.ascensionchallenge.weaken_info=Daha fazla düşmanı yenerek muska laneti zayıflatılabilir.
actors.buffs.ascensionchallenge.weaken_info_no_kills=Düşmanları yenerseniz, muska laneti zayıflayacaktır!
actors.buffs.ascensionchallenge.weaken=Muska'nın lanetinin biraz zayıfladığını hissedebiliyorsun.
actors.buffs.ascensionchallenge.break=Bir dakikanı ayırıp soluklanıyor ve yaralarının kapanmaya başladığını hissediyorsun!
actors.buffs.ascensionchallenge.almost=Yog'un muska üzerindeki hâkimiyetinin zayıflamaya başladığını hissediyorsun, neredeyse oradasın!
actors.buffs.ascensionchallenge.on_kill=Karanlık enerji seni tüketiyor...

actors.buffs.barkskin.name=kabuk derili
actors.buffs.barkskin.desc=Derin sertleşti, ağaç kabuğu gibi sert ve katı bir his veriyor.\n\nSertleşmiş deri, etkin zırhını artırarak fiziksel saldırılara karşı daha iyi savunma yapmanı sağlar.\n\nZırhının mevcut artışı: 0-%d.\nKabuk derisi zayıflayana kadar kalan sıra: %s.\n\nBirden fazla kaynaktan kabuk derisi alırsan, yalnızca en güçlü olanı geçerli olur.

actors.buffs.barrier.name=bariyer
actors.buffs.barrier.desc=Tüm hasarı engelleyen sağlam bir güç baloncuğu.\n\nBariyer, koruduğu şeyde kalkan kaldığı sürece hasar soğurur. Kalkan zaman geçtikçe yavaşça bozulur.\n\nKalan kalkan: %d.

actors.buffs.berserk.angered=öfkelendi
actors.buffs.berserk.berserk=çıldırmış
actors.buffs.berserk.exhausted=bitkin
actors.buffs.berserk.recovering=toparlanıyor
actors.buffs.berserk.angered_desc=Çılgın Savaşçı aldığı hasarla öfke kazanır, bu da saldırı gücünü artırır. Zırh tarafından engellenen hasar bile öfke biriktirir.\n\nÖfke zamanla azalır, ancak can azaldıkça daha uzun sürer.\n\nÖfke %%100 olduğunda Çılgın Savaşçı öfke patlamasına girerek, zırh seviyesi ve eksik canına göre bir kalkan kazanır. Kalkan zamanla azalır. Tamamen bittiğinde, tekrar öfke biriktirmeden önce dinlenmesi gerekir.\n\nMevcut Öfke: _%%%1$.0f_\nEk Hasar: _+%%%2$.0f_\nMevcut zırh ve cana göre öfke patlaması kalkanı: _%3$d_
actors.buffs.berserk.berserk_desc=Korku kaybolur, geriye sadece öfke kalır. Çılgın Savaşçı bu hâlde _%%50 ek hasar verir ve ek kalkan kazanır_, ancak her tur kalkan kaybeder.\n\nKalkan sıfırlandığında öfke patlaması sona erer.\n\nBu durumdan sonra yeniden öfke biriktirebilmesi için toparlanması gerekir.\n\nKalan Kalkan: %d
actors.buffs.berserk.recovering_desc=İçsel gücün sınırları vardır. Çılgın Savaşçı öfkesini tekrar kullanmadan önce dinlenmelidir.\n\nÇılgın Savaşçı iyileşirken aldığı hasardan dolayı öfke biriktirmez.
actors.buffs.berserk.recovering_desc_turns=Toparlanmaya kalan sıra: _%d_
actors.buffs.berserk.recovering_desc_levels=Toparlanmaya kalan seviye: _%.2f_
actors.buffs.berserk.rankings_desc=Ölümüne Çıldırdı
actors.buffs.berserk.action_name=Çılgın
actors.buffs.berserk.no_seal=Çıldırmak için kırık mührüne ihtiyacın var!

actors.buffs.bleeding.name=kanama
actors.buffs.bleeding.ondeath=Kanamadan öldün...
actors.buffs.bleeding.heromsg=Kanama geçiriyorsun!
actors.buffs.bleeding.rankings_desc=Kanamadan Öldü
actors.buffs.bleeding.desc=Bu yara endişe verici miktarda kan dökmene neden oluyor. \n\nKanama her sırada hasar almana neden olur. Her sıra aldığın hasar rastgele azalır, ta ki kanama durana kadar. \n\nŞu anki kanama hasarı: %d.

actors.buffs.bless.name=kutsanmış
actors.buffs.bless.desc=Odaklanmada müthiş bir artış, kimileri bunun tanrılardan gelen bir tesirle oluştuğunu söylüyor.\n\nKutsanma isabet ve savuşturmayı %%25 arttırır, bu da kutsananı savaşta daha etkili kılar.\n\nKutsanmanın geçmesine kalan sıra: %s.

actors.buffs.blindness.name=körlük
actors.buffs.blindness.heromsg=Kör oldun!
actors.buffs.blindness.desc=Körlük, çevredeki dünyayı karanlık bir sise dönüştürür.\n\nKör olan bir karakterin görüş mesafesi bir kareye düşer. Bu da uzaktaki düşmanların izini kaybetmeyi çok kolaylaştırır ve menzilli saldırıları işe yaramaz hale getirir. Ayrıca, kör olmuş bir kahraman parşömen veya kitap okuyamaz.\n\nKörlüğün geçmesine kalan sıra: %s.

actors.buffs.buff.heromsg=

actors.buffs.burning.name=yanıyor
actors.buffs.burning.heromsg=Yanmaya başladın!
actors.buffs.burning.burnsup=%s yanıp gitti!
actors.buffs.burning.ondeath=Yanarak öldün...
actors.buffs.burning.rankings_desc=Yanıp Kül Oldu
actors.buffs.burning.desc=Alevlerin içinde kalmaktan daha üzücü çok az şey vardır.\n\nAteş, suyla söndürülene veya süresi dolana kadar her turda hasar verir. Ateş, suya girerek veya parçalanan bir iksirin sıçramasıyla söndürülebilir.\n\nAyrıca ateş, temas ettiği yanıcı zeminleri veya öğeleri tutuşturabilir.\n\nKalan yanma turları: %s.

actors.buffs.championenemy.warn=Ölümcül bir varlık seziyorsun.
actors.buffs.championenemy$blazing.name=alevlenmiş şampiyon
actors.buffs.championenemy$blazing.desc=Alevlenmiş şampiyonlar %25 daha fazla yakın dövüş hasarı verir, saldırdıkları rakipleri tutuşturur, ateşe karşı bağışıklıkları vardır ve öldüklerinde etraflarına ateş saçarlar. Ancak ateşi suya yayamazlar.
actors.buffs.championenemy$projecting.name=izdüşüm şampiyon
actors.buffs.championenemy$projecting.desc=Erişen şampiyonlar %25 daha fazla yakın dövüş hasarı verir ve +3 saldırı menziline sahiptir.
actors.buffs.championenemy$antimagic.name=büyükıran şampiyon
actors.buffs.championenemy$antimagic.desc=Büyükıran şampiyonlar %50 daha az hasar alır ve büyü etkilerine karşı tamamen bağışıktır.
actors.buffs.championenemy$giant.name=dev şampiyon
actors.buffs.championenemy$giant.desc=Dev şampiyonlar %80 daha az hasar alır ve +1 saldırı menziline sahiptir ama kapalı alanlarda hareket edemez.
actors.buffs.championenemy$blessed.name=kutsanmış şampiyon
actors.buffs.championenemy$blessed.desc=Kutsanmış şampiyonlar 4 kat isabet ve kaçınma özelliğine sahiptir.
actors.buffs.championenemy$growing.name=büyüyen şampiyon
actors.buffs.championenemy$growing.desc=Büyüyen şampiyonlar isabet, kaçınma, fiziksel hasar ve alınan hasarda azalma için giderek artan bir bonus kazanır.\n\nŞu anki isabet/kaçınma/hasar artışı: %1$d%%\nŞu anki hasar azaltma: %2$d%%

actors.buffs.charm.name=tutulmuş
actors.buffs.charm.heromsg=Tutuldun!
actors.buffs.charm.cant_attack=O düşman seni etkisi altına aldığı için ona saldıramıyorsun.
actors.buffs.charm.desc=Tutulma, düşmanları birbirlerine kısa süreliğine hayran bırakan bir büyüdür. \n\nTutulmadan etkilenen karakterler tutuldukları düşmana saldıramaz. Fakat etraftaki diğer hedeflere hâlâ saldırabilir. Acının şokuyla büyünün süresi kısalacaktır.\n\nTutulmanın geçmesi için kalan sıra: %s.

actors.buffs.chill.name=üşümüş
actors.buffs.chill.freezes=%s dondu!
actors.buffs.chill.desc=Tam olarak donmamış, ama yine de çok soğuk. \n\nÜşümüş hedefler, etkinin geçmesine kaç sıra kaldığına bağlı olarak eylemlerini daha yavaş gerçekleştirir. En kötü hâlde, bu yavaşlamaya denktir.\n\nÜşümenin geçmesine kalan sıra: %1$s. \nHız şu kadar azaldı: %%%2$s

actors.buffs.combo.name=kombo
actors.buffs.combo.action_name=birleşik saldırı
actors.buffs.combo.combo=Art arda %d isabet!
actors.buffs.combo.bad_target=Saldırı menzilindeki bir düşmanı hedeflemelisin.
actors.buffs.combo.prompt=Saldırılacak bir hedef seç.
actors.buffs.combo.desc=Gladyatör başarılı darbeler indirdikçe ivme kazanır. Her saldırı kombo sayacını bir artırır, ancak vuruşlar arasında çok uzun süre geçmesi kombo sayacını 0'a sıfırlar. Gladyatör komboya sahipken, kırık mühründen sahip olduğu herhangi bir kalkan zayıflamaya başlamaz.\n\nKombo oluşturmak, ıskalamayan özel kombo saldırılarının kilidini açar! 2, 4, 6, 8 ve 10 kombo sayımında farklı bir saldırının kilidi açılır. Bazı hareketler komboyu sıfırlar ve bazıları sıfırlamaz, ancak her hareket kombo seansı başına yalnızca bir kez kullanılabilir.\n\nŞu anki kombo: %1$d.\n\nKombonun kaybedilmesine kalan hamle: %2$s.
actors.buffs.combo$combomove.clobber.name=döv
actors.buffs.combo$combomove.clobber.desc=Bir düşmanı 2 karo geriye düşürür, ancak hasar vermez ve çukurlara düşüremez. Kombo değerini 1 arttırır.
actors.buffs.combo$combomove.clobber.empower_desc=Bir düşmanı _3 karo geriye savurur, baş dönmesine neden olur ve çukurlara düşürebilir,_ ancak hasar vermez. Kombo değerini 1 arttırır.
actors.buffs.combo$combomove.slam.name=çarp
actors.buffs.combo$combomove.slam.desc=Hasar engelleme gücünüzün  %d%%'sini (kombo*20%%) ilave hasar olarak verir. Kullanıldığında komboyu sıfırlar.
actors.buffs.combo$combomove.slam.empower_desc=_%1$d karoya kadar sıçrar_ ve hasar engelleme gücünüzün %2$d%% (kombo*%%20) ilave hasar olarak verir. Kullanıldığında komboyu sıfırlar.
actors.buffs.combo$combomove.parry.name=savuştur
actors.buffs.combo$combomove.parry.desc=Etkinleştirildiğinde 1 tur içinde bir sonraki saldırıyı engeller ve anında karşılık verir. Hiçbir şey savuşturulmazsa komboyu sıfırlar.
actors.buffs.combo$combomove.parry.empower_desc=Etkinleştirildiğinde 1 tur içindeki _tüm saldırıları_ engeller ve onlara anında karşılık verir. Hiçbir şey savuşturulmazsa komboyu sıfırlar.
actors.buffs.combo$combomove.crush.name=ez
actors.buffs.combo$combomove.crush.desc=Birincil hedefe %%%d (kombo*%%25) hasar verir ve 7x7 etki alanındaki diğer tüm düşmanlara bunun yarısı kadar hasar verir. Kullanıldığında komboyu sıfırlar.
actors.buffs.combo$combomove.crush.empower_desc=_%1$d karoya kadar sıçrar_ ve birincil hedefe %2$d%% (kombo*%%25) hasar verir ve 7x7 etki alanındaki diğer tüm düşmanlara bunun yarısı kadar hasar verir. Kullanıldığında kombo sıfırlanır.
actors.buffs.combo$combomove.fury.name=öfke
actors.buffs.combo$combomove.fury.desc=Sahip olduğunuz her kombo için bir düşmana bir kez vurur, her vuruş %60 hasar verir ve büyüleri tetikleyebilir. Kullanıldığında komboyu sıfırlar.
actors.buffs.combo$combomove.fury.empower_desc=_%d karoya kadar sıçrar_ ve sahip olduğunuz her kombo için bir düşmana bir kez vurur, her vuruş %%60 hasar verir ve büyüleri tetikleyebilir. Kullanıldığında komboyu sıfırlar.

actors.buffs.corruption.name=yozlaşmış
actors.buffs.corruption.desc=Yozlaşma bir varlığın özüne sızarak onu eski doğasına aykırı bir hale getirir. \n\nYozlaşmış yaratıklar kendi müttefiklerine saldırır ve eski düşmanlarını görmezden gelir. Yozlaşma aynı zamanda yıkıcıdır ve hedefinin yavaş yavaş tükenmesine neden olur.\n\nYozlaşma kalıcıdır, etkileri yalnızca ölümle sona erer.

actors.buffs.cripple.name=sakatlanmış
actors.buffs.cripple.heromsg=Sakatlandın!
actors.buffs.cripple.desc=Bacaklarının bu şekilde eğilmemesi gerektiğine eminsin. \n\nSakatlanma hareket hızını yarıya indirir, yani bir kare ilerlemek için bir yerine iki sıra geçmesine neden olur. \n\nSakatlığın iyileşmesine kalan sıra: %s.

actors.buffs.daze.name=sersemlemiş
actors.buffs.daze.heromsg=Sersemlemişsin!
actors.buffs.daze.desc=Çınlayan kulaklar ve bulanık görüş savaşmayı zorlaştırır.\n\nSersemlemiş haldeyken isabet oranı ve kaçınma kabiliyeti 50%% azalır, bu da hem darbeleri indirmeyi hem de darbelerden kaçmayı çok daha zor hale getirir.\n\nKalan sersemlik turları: %s.

actors.buffs.degrade.name=indirgenmiş
actors.buffs.degrade.heromsg=Ekipmanın daha zayıf hissediliyor!
actors.buffs.degrade.desc=Güçlü kara büyü, yükseltme parşömenlerinin ekipmanınıza uyguladığı gücü emiyor!\n\nYükseltilmiş teçhizat, gücü düşürülürken gerçekte olduğundan daha düşük bir seviyedeymiş gibi muamele görecek. _3'ten sonraki her yükseltme bir öncekinden katlanarak daha zayıf hale gelir._ Eşyalarınızın açıklamaları, azaltılmış güç seviyelerini yansıtacak şekilde değişecektir.\n\nSeviye indirme güç gereksinimlerini, asa yüklerini, fırlatılan silahların dayanıklılığını veya eserleri etkilemez.\n\nKalan bozulma süresi: %s. Yükseltme veya laneti kaldırma parşömeni kullanmak bozulmayı derhal sonlandıracaktır.

actors.buffs.doom.name=lanetli
actors.buffs.doom.desc=Evren ölmenizi istiyormuş gibi göründüğünde devam etmek zordur.\n\nLanetli karakterler tüm kaynaklardan +%67 hasar alır.\n\nLanet kalıcıdır, etkileri yalnızca ölümle sona erer.

actors.buffs.dread.name=dehşet
actors.buffs.dread.desc=Hedefinin zindandan tamamen kaçmasına neden olacak kadar büyük bir korku!\n\nDehşetten etkilenen yaratıklar rakiplerinden hızla kaçar ve gözden kaybolduktan sonra zindandan tamamen kaybolurlar. Bu şekilde mağlup edilen düşmanlar yarım deneyim kazandırır ve hiçbir eşya düşürmez. Acı şoku dehşetin süresini kısaltır.\n\nKalan dehşet turları: %d.

actors.buffs.drowsy.name=uykulu
actors.buffs.drowsy.desc=Büyülü bir güç uyanık kalmayı zorlaştırıyor, birkaç tur sonra hedef derin bir büyülü uykuya dalacak.\n\nKahraman hasar alarak ya da canı tam olarak yerindeyken uyuşukluğa direnebilir.\n\nUykuya dalmaya kalan tur sayısı: %s.

actors.buffs.earthimbue.name=toprakla aşılanmış
actors.buffs.earthimbue.desc=Toprağın gücüyle dolusun!\n\nTüm fiziksel saldırılar düşmanın altındaki toprağı kaydırarak onu kısa süreliğine sakat bırakır.\n\nKalan toprak emdirme turları: %s.

actors.buffs.enhancedrings.name=geliştirilmiş yüzükler
actors.buffs.enhancedrings.desc=Düzenbazın yakın zamanda kullandığı nesne yüzüklerini güçlendiriyor, onlara +1 seviye veriyor.\n\nKalan sıra: %s.

actors.buffs.fireimbue.name=ateşle aşılanmış
actors.buffs.fireimbue.desc=Ateşin gücü ile sarıldın! \n\nTüm fiziksel saldırılarının düşmanı alevler içinde bırakma şansı var. Üstüne, alevlerin tüm negatif etkilerine karşı bağışıksın. \n\nAteş sarılmasının bitmesine kalan sıra: %s.

actors.buffs.foresight.name=öngörü
actors.buffs.foresight.desc=Zihninizle çevredeki arazinin düzenini bir şekilde görebiliyorsunuz.\n\nİleri görüşün etkisi altındayken, gizli tuzaklar veya kapılar da dahil olmak üzere geniş bir yarıçap içindeki tüm karolar size gösterilir.\n\nKalan ileri görüş sırası: %s.

actors.buffs.frost.name=donmuş
actors.buffs.frost.freezes=%s dondu!
actors.buffs.frost.desc=Donup katılaşmak ile karıştırılmamalıdır, bu iyi huylu dondurma daha ziyade hedefi buzla çevreler.\n\nDonma basit bir şekilde felç olma durumuna benzer şekilde işler, hedefin her hangi bir eylemde bulunmasına engel olur. Felç olmanın aksine, donma durumu hedefin hasar alması durumunda sonlanır, çünkü buz kırılacaktır.\n\nDonmanın geçmesine kalan sıra: %s.

actors.buffs.frostimbue.name=don ile aşılanmış
actors.buffs.frostimbue.desc=Buzul güçle sarıldın!\n\nTüm fiziksel saldırıların düşmanların üzerinde üşüme etkisi yaratacak ve bu etki her saldırıda üst üste gelecektir. Bunun yanında soğuğa tamamen bağışıklısın.\n\nSoğuk sarılmanın geçmesine kalan sıra: %s.

actors.buffs.fury.name=öfkeli
actors.buffs.fury.heromsg=Öfkelendin!
actors.buffs.fury.desc=Öfkelisin, düşmanlar senden öfkeliyken pek hoşlanmayacak. \n\nİçinde güçlü bir öfke alevi yanıyor ve fiziksel saldırılarının verdiği hasarı %%50 arttırıyor. \n\nBu öfke sağlığın %%50 'nin altında olduğu sürece devam edecek.

actors.buffs.blobimmunity.name=arıtma bariyeri
actors.buffs.blobimmunity.desc=Garip bir güç seni kalın bir koruma bariyeri içerisinde örterek havadaki zararlı maddeleri solumanı önlüyor.\n\nBu bariyer kaybolana kadar tüm bölgesel efektlere karşı bağışıklığa sahipsin.\n\nBağışıklığın bitmesine kalan sıra: %s.

actors.buffs.gravitychaostracker.name=yer çekimi kaosu
actors.buffs.gravitychaostracker.desc_intro=Her birkaç turda bir, mevcut zindan katındaki tüm karakterler rastgele bir yöne fırlatılır.
actors.buffs.gravitychaostracker.desc_positive=Ancak siz ve müttefikleriniz bağışıklık kazanmış gibi görünüyorsunuz.
actors.buffs.gravitychaostracker.desc_duration=Etkinin ne kadar süreceği belli değil, ancak sonsuza kadar süremez.

actors.buffs.greaterhaste.name=yüksek hız
actors.buffs.greaterhaste.desc=İnanılmaz bir hız artışı, bir an için sanki her şey duruyormuş gibi hissettirir.\n\nDaha büyük aceleciliğin etkisi altındayken hareket eylemleri hiç zaman almaz, ancak diğer eylemler yine de normal hızda gerçekleştirilir. Her bir hareket adımı bir tur daha fazla acelecilik tüketir.\n\nKalan yüksek hızlılık tur sayısı: %d.

actors.buffs.haste.name=acele
actors.buffs.haste.desc=Enerji kaslarından geçerek muhteşem hızlarda koşmana olanak sağlıyor!\n\nAcele etkisi altındayken 3 kat daha hızlı koşarsın, fakat diğer tüm davranışları yine normal hızda yaparsın.\n\nAcelenin bitmesine kalan sıra: %s.

actors.buffs.healing.name=iyileşme
actors.buffs.healing.desc=Sihirli bir ilaç yaralarının kapanmasına ve etinin dikilmesine sebep oluyor.\n\nİyileşmenin etkisi gidene kadar her tur hızlıca canın iyileşecek. İyileşme miktarı zamanla azalabilir.\n\nSonraki iyileşme miktarı: %d SP.\n\nKalan iyileşme: %dSP.

actors.buffs.herodisguise.name=kılık değiştirme
actors.buffs.herodisguise.desc=Yanıltıcı büyü senin fiziksel görünüşünü değiştirdi. Bu etki tamamen görünüşte ama yine de çok garip hissettiriyor.\n\nKılık değiştirme kalan tur sayısı: %s.

actors.buffs.hex.name=nazarlanmış
actors.buffs.hex.heromsg=Nazarlandın!
actors.buffs.hex.desc=Odaklanmayı azaltan kara büyü, hedefi hafifçe şaşırtır.\n\nBüyü, isabet oranını ve kaçmayı ,%%20 oranında azaltarak hedefin savaşta daha az etkili olmasını sağlar.\n\nKalan büyü turları: %s.

actors.buffs.holdfast.name=sıkı tutun
actors.buffs.holdfast.desc=Savaşçı pozisyonunu koruyor, zırhını %1$d-%2$d artırıyor ve bazı güçlendirmelerin azalma hızını %%%3$d oranında yavaşlatıyor.

actors.buffs.hunger.hungry=aç
actors.buffs.hunger.starving=çok aç
actors.buffs.hunger.onhungry=Acıktın.
actors.buffs.hunger.onstarving=Çok acıktın!
actors.buffs.hunger.ondeath=Açlıktan öldün...
actors.buffs.hunger.cursedhorn=Lanetli boru sen yemek yerken o yemeğin enerjisinden bir miktar çalıyor.
actors.buffs.hunger.rankings_desc=Açlıktan Öldü
actors.buffs.hunger.desc_intro_hungry=Midenin yemek beklediğini hissediyorsun, ama şimdilik o kadar da ciddi değil.
actors.buffs.hunger.desc_intro_starving=O kadar acıktın ki canın yanıyor.
actors.buffs.hunger.desc=\n\nAçlık, zindanda vakit geçirdiğin sürece yavaşça artar ve sonunda çok acıkmaya başlarsın. Aşırı bir açlık durumunda sağlığın yenilenmek yerine azalmaya başlar. \n\nSonraya saklamak önemlidir! Eğer açlık için harcayabileceğin sağlığın varsa açlıktan acı çekmek, sonra yiyebileceğin yemek olacağını bilerek ilerlemek iyi bir fikir olabilir. Etkili saklamak yiyeceğin çok daha uzun gitmesini sağlar!

actors.buffs.invisibility.name=görünmez
actors.buffs.invisibility.desc=Etrafındaki çevreyle iç içe girdin, bu da görünmeni imkansız kılıyor.\n\nGörünmez durumda iken düşmanların sana saldıramaz veya seni takip edemez. Fiziksel saldırılar ve büyüsel etkiler (parşömenler ve asalar) görünmezliği anında sonlandırır. \n\nGörünmezliğin geçmesine kalan sıra: %s.

actors.buffs.invulnerability.name=dokunulmaz
actors.buffs.invulnerability.desc=Bu karakter büyük bir koruyucu güçle donatılmıştır ve onlara kısa bir süre için zarar görmezlik sağlar!\n\nKalan tur sayısı: %s.

actors.buffs.levitation.name=havalanmak
actors.buffs.levitation.desc=Büyülü bir güç seni havalandırıyor, kendi ağırlığını bile hissetmiyorsun. \n\nHavalanmış karakterler sessizce hareket eder ve yer yüzeyi kaynaklı etkileri yok sayarlar. Tuzaklar tetiklenmez, su ateşi söndürmez, bitkiler ezilmez, kökler ıska geçer ve çukurların üzerinden süzülürsün. Ama dikkatli ol, havalanma sona erdiği anda bunlar gerçekleşebilir!\n\nHavalanma kalan tur sayısı: %s.

actors.buffs.lifelink.name=can bağı
actors.buffs.lifelink.ondeath=Can bağlantısından gelen hasar seni öldürdü...
actors.buffs.lifelink.desc=Bu karakterin yaşam gücü yakınlardaki başka bir karaktere bağlanmış. Alınan herhangi bir hasar aralarında paylaşılır. \n\nBu karakter hasar aldığında, bunun yarısı yaşam bağı hedefine verilir.\n\nKalan yaşam bağı sırası: %s.

actors.buffs.light.name=aydınlatılmış
actors.buffs.light.desc=En karanlık zindanda bile, senin tarafında sabit bir ışık her zaman ışıldıyor. \n\nIşık karanlığı aydinlatmanı sağlar, yani aynı noktadan daha fazla sey görebilirsin. \n\nAydinlatmanın geçmesine kalan sıra: %s.

actors.buffs.lockedfloor.name=kat kilitli
actors.buffs.lockedfloor.desc=Şu anki kat kilitlendi, ve onu terkedemezsin!\n\nBir kat kilitlendiğinde acıkmazsın ve açlık nedeni ile hasar almazsın. Üstüne, bu katın patronu ile bir an önce yüzleşmezsen pasif rejenerasyon etkileri de duracaktır. \n\nÜstelik, eğer kat kilitliyken kutsanmamış bir ankh ile dirilirsen ankh sıfırlanır. \n\nKilidi kırmak için bu katın patronunu öldür.

actors.buffs.lostinventory.name=kayıp envanter
actors.buffs.lostinventory.desc=Envanteriniz zindanda bir yerde kayboldu! Onu geri alana kadar çoğu eşyayı alamayacak veya kullanamayacaksınız.

actors.buffs.magicalsight.name=büyülü görüş
actors.buffs.magicalsight.desc=Bir şekilde gözleriniz yerine zihninizle görebiliyorsunuz.\n\nBüyülü görüş etkin durumdayken 12 karelik bir yarıçap içindeki tüm araziyi görebilirsiniz.\n\nKalan büyülü görüş turları: %s.

actors.buffs.magicalsleep.name=büyülü uyku
actors.buffs.magicalsleep.toohealthy=Fazla sağlıklı olduğundan uyuma isteğine direniyorsun.
actors.buffs.magicalsleep.fallasleep=Büyülü ve derin bir uykuya dalıyorsun.
actors.buffs.magicalsleep.wakeup=Kendini yenilenmiş ve sağlıklı hissederek uyanıyorsun.
actors.buffs.magicalsleep.desc=Bu karakter doğal olarak uyanamayacağı derin bir büyülü uykuya dalmıştır.\n\nBüyülü uyku normal uykuya benzer, ancak sadece hasar hedefin uyanmasına neden olur.\n\nKahraman ve müttefikleri için büyülü uyku, dinlenirken hızla iyileşmelerini sağlayan bazı onarıcı özelliklere sahiptir.

actors.buffs.magicimmune.name=büyüye karşı bağışık
actors.buffs.magicimmune.desc=Tüm büyüsel etkiler sana tutunamaz oldu, onlara karşı tamamen bağışıksın.\n\nBüyü bağışıklığının etkisi altındayken zararlı ya da yararlı olsun, hiçbir büyüsel etki sana işlemez, buna lanetler, efsunlar, asalar, parşömenler, yüzükler, eserler vb. de dahildir. Kahraman zırh yetenekleri bu etkiden bağımsız olarak çalışacak kadar güçlüdür.\n\nBüyüsel bağışıklığın geçmesine kalan sıra: %s.

actors.buffs.mindvision.name=zihin görüşü
actors.buffs.mindvision.desc=Bir şekilde bu kattaki tüm karakterleri zihninde görebiliyorsun. Bu garip bir his. \n\nAkıl görüşüne sahip olduğun sürece bu kattaki tüm karakterler sana görünür hale gelir. Bir yaratığı akıl görüşü ile görmek onun çoğu büyüsel etki için görünen veya yakınlarda sayılmasına neden olur.\n\nAkıl görüşünün bitmesine kalan sıra: %s.

actors.buffs.momentum.momentum=momentum oluşturma
actors.buffs.momentum.running=serbest koşu
actors.buffs.momentum.resting=toparlanıyor
actors.buffs.momentum.action_name=serbest koşu
actors.buffs.momentum.momentum_desc=Serbest Koşucu hareket ettikçe, serbest koşuya başlamak için harcayabileceği bir momentum biriktirir.\n\nHer momentum yükü iki tur serbest koşu sağlar ve Serbest Koşucu en fazla 10 şarj biriktirebilir. Serbest Koşucu hareket etmeyi bıraktığında momentum hızla kaybolur.\n\nMevcut momentum şarjı: %d.
actors.buffs.momentum.running_desc=Serbest Koşucu hareket ettikçe ivme kazanır ve bu ivmeyi serbest koşuya başlamak için harcayabilir.\n\nSerbest koşarken, Serbest Koşucu iki kat hızla hareket eder ve seviyesine bağlı olarak ilave kaçınma yeteneği kazanır.\n\nKalan tur: %d.
actors.buffs.momentum.resting_desc=Serbest Koşucu hareket ettikçe, serbest koşuya başlamak için harcayabileceği bir momentum kazanır.\n\n\nSerbest Koşucu tekrar ivme kazanmadan önce dayanıklılığını geri kazanmak için zamana ihtiyaç duyar.\n\nKalan tur: %d.

actors.buffs.monkenergy.name=enerji
actors.buffs.monkenergy.action=Keşiş Yetenekleri
actors.buffs.monkenergy.desc=Keşiş, düşmanları yendikçe çeşitli yeteneklerde kullanabileceği enerji kazanır. Çoğu düşman yenildiğinde 1 enerji verir ve Keşiş zamanla enerji kaybetmez.\n\nŞu anki enerji: %1$d/%2$d.
actors.buffs.monkenergy.desc_cooldown=Keşiş yakın zamanda bir yetenek kullandı ve başka bir yetenek kullanmadan önce beklemelidir.\n\nŞu anki bekleme süresi: %d tur.
actors.buffs.monkenergy$monkability$flurry.name=yumruk fırtınası
actors.buffs.monkenergy$monkability$flurry.desc=%1$d-%2$d hasar veren ve zırhı yok sayan iki anlık saldırı. Bu özellik üst üste kullanılamaz.
actors.buffs.monkenergy$monkability$flurry.empower_desc=%1$d-%2$d hasar veren, zırhı yok sayan _ve silahınızın büyüsünü kullanan_ iki anlık saldırı. Bu özellik üst üste kullanılamaz.
actors.buffs.monkenergy$monkability$focus.name=odaklanma
actors.buffs.monkenergy$monkability$focus.desc=Keşiş odaklanmak için bir tur atar ve kendisine yapılan bir sonraki saldırıyı savuşturmasını sağlar.
actors.buffs.monkenergy$monkability$focus.empower_desc=Keşiş _anında odaklanır,_ böylece kendisine yapılan bir sonraki saldırıyı savuşturur.
actors.buffs.monkenergy$monkability$focus$focusbuff.name=odaklanmış
actors.buffs.monkenergy$monkability$focus$focusbuff.desc=Keşiş çevresine odaklanır ve kendisine karşı yapılacak bir sonraki saldırıyı bekler. Odaklanmış durumdayken, gelen bir sonraki saldırıyı savuşturması garantidir.
actors.buffs.monkenergy$monkability$dash.name=atılma
actors.buffs.monkenergy$monkability$dash.prompt=Bir Konum Seçin
actors.buffs.monkenergy$monkability$dash.desc=En fazla 4 kare ileriye anında atılır. Bu yetenek tehlikelerin üzerinden geçebilir, ancak düşmanların veya geçilemez engellerin içinden geçemez.
actors.buffs.monkenergy$monkability$dash.empower_desc=Bir anda _8 kare_ kadar ilerleyebilir. Bu yetenek, tehlikelerin üzerinden geçebilir ancak düşmanların veya sert arazinin içinden geçemez.
actors.buffs.monkenergy$monkability$dragonkick.name=ejderha tekmesi
actors.buffs.monkenergy$monkability$dragonkick.desc=Zırhı yok sayan ve %1$d-%2$d hasar veren yıkıcı bir tekme. Tekme hedefi uzağa savurur ve gittiği her karo için felç eder.
actors.buffs.monkenergy$monkability$dragonkick.empower_desc=_%1$d-%2$d hasar_ veren ve zırhı yok sayan yıkıcı bir tekme. Tekme, _bitişikteki tüm hedefleri_ uzağa savurur ve gittikleri her karo için onları felç eder.
actors.buffs.monkenergy$monkability$meditate.name=meditasyon
actors.buffs.monkenergy$monkability$meditate.desc=Keşiş 5 tur boyunca bedenine enerji odaklar. Bu, çoğu olumsuz etkiyi temizler ve ona 8 turluk asa ve eser şarjı sağlar.
actors.buffs.monkenergy$monkability$meditate.empower_desc=Keşiş 5 tur boyunca bedenine enerji odaklar. Bu, çoğu olumsuz etkiyi temizler ve ona 8 turluk asa ve obje şarjı sağlar. _Ayrıca meditasyon yaparken %80 hasar direnci kazanır ve eksik HP'sinin %20'sini yavaşça iyileştirir._

actors.buffs.ooze.name=aşındırıcı sıvı
actors.buffs.ooze.heromsg=Aşındırıcı çamur derini yiyor. Yıkayarak temizle!
actors.buffs.ooze.ondeath=Eriyip gittin...
actors.buffs.ooze.rankings_desc=Eridi
actors.buffs.ooze.desc=Bu yapışkan asit deriye yapışır ve onu yavaşça eritir.\n\nÇamur, zamanla sürekli olarak hasar verse de su ile anında yıkanabilir.\n\nÇamurun geçmesine kalan sıra: %s.

actors.buffs.paralysis.name=felç olmuş
actors.buffs.paralysis.heromsg=Felç oldun!
actors.buffs.paralysis.out=felce karşı koyuldu
actors.buffs.paralysis.desc=Çoğu zaman en kötü şey hiçbir şey yapmamaktır.\n\nFelç, tüm davranışların durmasına neden olarak hedefini etkinin geçmesine beklemeye zorlar. Hasar almaktan kaynaklanan acı, karakterlerin felcin etkine karşı koymalarına neden olarak onları felç etkisinden çıkarabilir.\n\nFelcin geçmesine kalan sıra: %s.

actors.buffs.physicalempower.name=fiziksel olarak güçlendirilmiş
actors.buffs.physicalempower.desc=Darbeleriniz güçlendirildi, fiziksel saldırılarla vurduğunuz zaman verebileceğiniz hasar miktarı arttı.\n\nEk hasar: %1$d.\nKalan vuruşlar: %2$d.

actors.buffs.pincushion.name=iğnelik
actors.buffs.pincushion.desc=Bu karaktere karşı kullandığın fırlatma silahları ona saplı ve o yenildikten sonra yere düşecekler.\n\nSaplı eşyalar:

actors.buffs.poison.name=zehirlenmiş
actors.buffs.poison.heromsg=Zehirlendin!
actors.buffs.poison.ondeath=Zehirden öldün...
actors.buffs.poison.rankings_desc=Zehre Yenik Düştü
actors.buffs.poison.desc=Zehir vücuda yayılır ve etkisini yavaşça göstermeye başlar. \n\nZehir, her sıra geçmesine kalan zaman ile orantılı olarak hasar verir. \n\nZehrin geçmesine kalan sıra: %s.

actors.buffs.preparation.name=hazırlık
actors.buffs.preparation.action_name=hazırlıklı vuruş
actors.buffs.preparation.desc=Suikastçı, gölgelerden saldırmak için sabırla bekliyor.
actors.buffs.preparation.desc_dmg=Bir sonraki saldırısı _%1$d%% ilave hasar_ verir ve _%2$d%% canın_ altındaki normal rakipleri veya _%3$d%% canın_ altındaki bölüm sonu canavarlarını infaz eder.
actors.buffs.preparation.desc_dmg_likely=Saldırı ayrıca daha fazla hasar vermeye eğilimli olacak.
actors.buffs.preparation.desc_blink=Bir düşmana saldırmadan önce onun yanına maksimum _%d_ blok mesafeden atlayabilir.
actors.buffs.preparation.desc_invis_time=Görünmez geçirilen turlar: _%d._
actors.buffs.preparation.desc_invis_next=Daha güçlü saldırı için hamleler: _%d._
actors.buffs.preparation.prompt=Saldırmak için bir hedef seç!\nMaksimum atlama mesafesi: %d
actors.buffs.preparation.no_target=Burada saldıracak bir şey yok.
actors.buffs.preparation.out_of_reach=Bu hedef erişebileceğin mesafeden uzakta.
actors.buffs.preparation.assassinated=suikaste uğradı

actors.buffs.prismaticguard.name=prizmatik koruyucu
actors.buffs.prismaticguard.desc=Şu an aktif olmayan bir prizmatik görüntü tarafından korunuyorsun. Düşmanlar görünürde olduğunda prizmatik görüntü ortaya çıkacak ve seni koruyacak!\n\nAktif değilken prizmatik görüntü düzenli bir şekilde aldığı tüm hasarlardan iyileşecektir.\n\nŞu anki SP: %d/%d.
actors.buffs.prismaticguard.desc_many=Bu prizmatik görüntü de Çoğunluğun Gücü'nden yararlanıyor. Kalan Tur Sayısı: %d.

actors.buffs.recharging.name=şarj olma
actors.buffs.recharging.desc=İçinden bir enerji akıyor ve bu enerji asalarının ve değneklerinin şarj hızını arttırıyor. \n\nHer sıra, bu etki şu anki şarj etkisine bir çeyrek daha ekler. \n\nŞarj etkisinin geçmesine kalan sıra: %s.

actors.buffs.revealedarea.name=açığa çıkan alan
actors.buffs.revealedarea.desc=Zindanın bir alanı, kahramana geçici olarak açığa çıkarıldı. Nerede olursa olsun bu alanı görecektir.\n\nKalan hamle: %s.

actors.buffs.revealedchar.name=açığa çıkarılmış
actors.buffs.revealedchar.desc=Bu karakter kahramana gözüküyor, nerede olursa olsun gözükecek.\n\nKalan hamle: %s.

actors.buffs.roots.name=köklenmiş
actors.buffs.roots.heromsg=Hareket edemiyorsun!
actors.buffs.roots.desc=Kökler (büyülü ya da doğal) ayakları kavrayarak onları yere bastırır.\n\nKökler hedefi olduğu yerde kilitleyerek hareketi ve çoğu hareket yeteneğini imkansız hale getirir. Işınlanma etkileri de dahil olmak üzere diğer eylemler etkilenmez.\n\nKöklenmiş kalma süresi: %s.

actors.buffs.scrollempower.name=parşömeni güçlendirme
actors.buffs.scrollempower.desc=Büyücünün yeni okuduğu parşömenden gelen enerji, asalarını güçlendiriyor!\n\nSeviye Artışı: +%1$d.\nKalan şarj: %2$d.

actors.buffs.shadows.name=gölgeye karışmış
actors.buffs.shadows.desc=Etrafındaki gölgelerle iç içe girdin, bu metabolizmanı yavaşlatıyor ve sana görünmezlik sağlıyor. \n\nGörünmezken düşmanlar sana saldıramaz veya seni takip edemez. Çoğu fiziksel saldırılar veya büyüsel etkiler (parşömenler veya asalar gibi) görünmezliği anında sonlandırır. Üstelik gölgelerle iç içeyken acıkma oranın yavaşlar. \n\nBir düşman gelip seninle etkileşim kurana kadar veya gölgeleri terkedene kadar gölgelerle iç içe kalırsın.

actors.buffs.slow.name=yavaşlamış
actors.buffs.slow.desc=Yavaşlama büyüsü hedefin zaman hızını etkiler, onlara göre her şey süper-hızlı hareket eder.\n\nYavaşlamış bir karakter tüm eylemleri normalden iki kat uzun sürede yapar. \n\nYavaşlamanın geçmesine kalan sıra: %s.

actors.buffs.snipersmark.name=keskin nişancı işareti
actors.buffs.snipersmark.action_name_snapshot=anlık görüntü
actors.buffs.snipersmark.action_name_volley=salvo
actors.buffs.snipersmark.action_name_sniper=keskin nişancı atışı
actors.buffs.snipersmark.desc=Keskin nişancı, en son saldırdığı hedefe odaklanmıştır. Yayının nasıl güçlendirildiğine bağlı olarak özel bir saldırı yapabilir.\n\nGüçlendirilmemiş bir yay, zaman almayarak ancak hasarı azaltılmış bir _anlık görüntü_ atışı yapar.\n\nHız için güçlendirilmiş bir yay, üç okluk bir _salvo_ atışı yapar. Her ok azalmış hasar verir, ancak hala büyü etkilerini aktive edebilir. Bu salvo, 1 hamle alır.\n\nHasar için güçlendirilmiş bir yay, _keskin nişancı atışı_ yapar. Bu atış, hedefe kesinlikle isabet eder, mesafeye bağlı olarak fazladan hasar verir ve 2 hamle alır.\n\nKalan hamleler: %s.

actors.buffs.soulmark.name=ruh mührü
actors.buffs.soulmark.desc=Büyücü, bu yaratığın ruhuna dokunarak, fiziksel hasar aldıkça kendisini iyileştirmesini sağladı.\n\nRuh mühürlü kalma süresi: %s.

actors.buffs.stamina.name=dayanıklılık
actors.buffs.stamina.desc=Sonsuz kondisyona sahipsin ve bu daha hızlı hareket etmeni sağlıyor!\n\nBu kondisyon etkisi altındayken +50 %% hızında koşacaksın, fakat yaptığın diğer her etkinlik normal hızda olacaktır.\n\nBu kondisyon durumunun geçmesine kalan sıra: %s.

actors.buffs.vulnerable.name=savunmasız
actors.buffs.vulnerable.heromsg=Kırılgan hissediyorsun!
actors.buffs.vulnerable.desc=Savunmasızlık büyüsü, bir karakterin aldığı tüm fiziksel hasarı, bu hasar zırh tarafından azaltıldıktan sonra %%33 oranında artırır.\n\nKalan savunmasızlık süresi: %s.

actors.buffs.terror.name=korkmuş
actors.buffs.terror.desc=Terör, hedefini kontrol dışı bir paniğe sokan manipülatif bir büyüdür.\n\nKorkmuş karakterler düşmanlarından kaçmaya ve aralarında mümkün olduğunca çok kapı ve duvar açmaya zorlanırlar. Acıdan kaynaklanan hasar, bu korkunun süresini azaltacaktır.\n\nTerörün geçmesine kalan sıra: %s.

actors.buffs.toxicimbue.name=zehirle yoğrulmuş
actors.buffs.toxicimbue.desc=Zehirli enerjiyle dolusun!\n\nEtrafınızda hareket ettikçe zehirli gaz sürekli olarak sizden yayılacak ve düşmanlarınıza zarar verecek. Etki süresi boyunca ve sonrasında birkaç tur boyunca zehirli gaza ve zehre karşı bağışıklığınız vardır.\n\nKalan zehir enerjisi tur sayısı: %s.

actors.buffs.corrosion.name=Aşınma
actors.buffs.corrosion.heromsg=Eriyorsun!
actors.buffs.corrosion.ondeath=Eriyip gittin...
actors.buffs.corrosion.rankings_desc=Eridi
actors.buffs.corrosion.desc=Güçlü asit eti, metali ve kemiği endişelendirici bir hızda eritir.\n\nAşındırma hasarı hedef erimeye devam ettikçe zamanla artar.\n\nAşındırmanın geçmesine kalan sıra: %1$s.\nŞu anki aşınma hasarı:%2$d.

actors.buffs.vertigo.name=Baş Dönmesi
actors.buffs.vertigo.desc=Düz bir yolda yürümek tüm dünya dönerken zor olabilir.\n\nBaş dönmesinin etkisi altında olan bir karakter gitmeye çalıştığı yer yerine rastgele başka bir yere gidecektir.\n\nBaş dönmesinin geçmesine kalan sıra: %s.

actors.buffs.wandempower.name=Asalar Güçlendi
actors.buffs.wandempower.desc=Hasar veren asaların güçlendirildi, birkaç vuruş için verilen hasar miktarı arttı.\n\nEk hasar: %1$d.\nKalan vuruşlar: %2$d.

actors.buffs.weakness.name=Güçsüzleşmiş
actors.buffs.weakness.heromsg=Zayıflamış hissediyorsun!
actors.buffs.weakness.desc=Her şey bir anda daha ağır hissettirmeye başladı.\n\nGüçsüzleşme büyüsü karakterin fiziksel gücünü azaltır, ve 33%% daha az hasar vermelerine sebep olur.\n\nGüçsüzleşmenin geçmesine kalan tur.%s.

actors.buffs.wellfed.name=tok
actors.buffs.wellfed.desc=Gayet tatmin olmuş ve tok hissediyorsun.\n\nİyi beslenmişken açlığın artmaz, ve bunun yanında ekstra bir miktar sağlığa sahip olursun.\n\nKalan sıra: %d.



###hero

##abilities
actors.hero.abilities.armorability.self_target=Kendini hedef alamazsın!
actors.hero.abilities.armorability.no_target=Orada hedef alınacak bir şey yok!
actors.hero.abilities.armorability.prompt=Hedefleyeceğiniz bir konum seç
actors.hero.abilities.armorability.cost=Yük bedeli: _%d_

actors.hero.abilities.warrior.heroicleap.name=kahramanca atılma
actors.hero.abilities.warrior.heroicleap.prompt=Atlanacak yönü seç
actors.hero.abilities.warrior.heroicleap.short_desc=Savaşçı hedeflenen yere _Kahramanca Atlayış_ yapar,  düşmanların ve tehlikelerin üzerinden süzülür.
actors.hero.abilities.warrior.heroicleap.desc=Savaşçı hedeflenen yere atlayarak yolundaki tüm düşmanların ve tehlikelerin üstünden geçer. Duvarların ve diğer katı arazilerin üstünden atlayamaz.
actors.hero.abilities.warrior.shockwave.name=şok dalgası
actors.hero.abilities.warrior.shockwave.short_desc=Savaşçı yere vurarak koni şeklinde bir _Şok Dalgası_ oluşturur. Şok dalgasına yakalanan düşmanlar hasar alır ve sakatlanır.
actors.hero.abilities.warrior.shockwave.desc=Savaşçı yere vurur, bu en fazla 5 kare uzaklığa kadar ilerleyen 60 derecelik bir koni şeklinde ilerleyen bir şok dalgası oluşturur.\n\nBu şok dalgasına kapılan düşmanlar 5 tur için sakatlanır. Ayrıca 5-10 hasar alırlar, buna Savaşçı'nın 10'dan fazla sahip olduğu her güç puanı için 1-2 hasar eklenir.
actors.hero.abilities.warrior.endure.name=katlanmak
actors.hero.abilities.warrior.endure$enduretracker.name=dayanıklılık
actors.hero.abilities.warrior.endure$enduretracker.desc=Savaşçı şu an katlandığı hasara göre fazladan hasar veriyor.\n\nFazladan hasar: %1$d\nKalan vuruş: %2$d
actors.hero.abilities.warrior.endure.short_desc=Savaşçı _Katlanırken_, birkaç tur atlar ama fazladan hasar direnci kazanır. Sonra katlandığı hasara göre fazladan hasar verir.
actors.hero.abilities.warrior.endure.desc=Savaşçı, tüm kaynaklardan yarı hasar alarak 3 tur katlanır. Bu azalma, zırh gibi hasara dayanıklı etkilerden önce uygulanır.\n\nKatlandıktan sonra, savaşçının 10 sıra içindeki bir sonraki vuruşu ilave hasar kazanır. Bu fazlandan hasar, herhangi bir hasar azaltma etkisinden önce, ona verilen tüm hasarın yarısına eşittir!\n\nSavaşçının herhangi bir kombosu varsa, bu yeteneği kullanmak kombonun kalan süresini 3 tur artırır.

actors.hero.abilities.mage.elementalblast.name=Elemental Patlama
actors.hero.abilities.mage.elementalblast.no_staff=Bu yeteneği asanız olmadan kullanamazsınız.
actors.hero.abilities.mage.elementalblast.short_desc=Büyücü asasından bir _Elemental Patlama_ yayar, değneğindeki asaya bağlı olarak değişen bir etkiyle etrafındaki geniş bir alanı kaplar.
actors.hero.abilities.mage.elementalblast.desc=Büyücü, en fazla 4 kare uzağa kadar dairesel bir bölgeyi kaplayan ve 15-25'e kadar hasar veren bir büyü patlaması yayar. Elemental patlamanın özel etkisi, Büyücünün değneğine yerleştirilen asaya göre değişecektir.
actors.hero.abilities.mage.elementalblast.generic_desc=Elemental patlamanın etkisi, asanın kullanıldığında olan etkiye benzer olacaktır.
actors.hero.abilities.mage.wildmagic.name=vahşi büyü
actors.hero.abilities.mage.wildmagic.no_wands=Saldıracak bir asanız yok!
actors.hero.abilities.mage.wildmagic.short_desc=Büyücü, asalarında bulunan _Vahşi Büyü_'yü serbest bırakır ve bunları tek bir tur boyunca seçilen bir hedefe gelişigüzel olarak birden çok kez ateşler.
actors.hero.abilities.mage.wildmagic.desc=Büyücü asalarındaki gücü açığa çıkarır ve tek bir turda 4 defaya kadar gelişigüzel ateşler. Büyücünün asası bu etkiye dahil değildir.\n\nAyrıca her asanın seviyesi 2 artırılarak +3'e çıkarılır. Bu yetenek her bir vuruş için yarım asa şarjı kullanır ve hiçbir asa 2 kezden fazla ateşlenemez.
actors.hero.abilities.mage.warpbeacon.name=Işınlanma Feneri
actors.hero.abilities.mage.warpbeacon.depths=Katlar arası ışınlanamazsın!
actors.hero.abilities.mage.warpbeacon.locked_floor=Kilitli bir katı terk edemezsin!
actors.hero.abilities.mage.warpbeacon.too_far=O konum çok uzakta!
actors.hero.abilities.mage.warpbeacon.invalid_beacon=Oraya bir fener koyamazsın!
actors.hero.abilities.mage.warpbeacon.window_desc=Fenerin şu anda kat %d'de yerleştirilmiş.
actors.hero.abilities.mage.warpbeacon.window_tele=Fenere Işınlan
actors.hero.abilities.mage.warpbeacon.window_clear=Feneri Sıfırla
actors.hero.abilities.mage.warpbeacon.window_cancel=İptal Et
actors.hero.abilities.mage.warpbeacon.short_desc=Büyücü mevcut konumuna bir _Işınlanma Feneri_ koyar, daha sonra ona anında ışınlanabilir.
actors.hero.abilities.mage.warpbeacon.desc=Büyücü, istediği zaman ışınlanabileceği bir fener yerleştirir. Feneri yerleştirmek 1 tur alır, ama ışınlanmak anında gerçekleşir.\n\nBüyücü varsayılan olarak katlar arası ışınlanamaz, veya feneri ulaşılamaz yerlere, mesela kilitli odalara, ulaşmak için kullanamaz. Büyücü düşmanların içine ışınlanabilir, bu, düşmanları yana itecektir.

actors.hero.abilities.rogue.smokebomb.name=Sis Bombası
actors.hero.abilities.rogue.smokebomb.fov=Görüş alanındaki yalnızca boş bir yere atlayabilirsin.
actors.hero.abilities.rogue.smokebomb.prompt=Atlayacağın yeri seç
actors.hero.abilities.rogue.smokebomb$ninjalog.name=Tahta Kukla
actors.hero.abilities.rogue.smokebomb$ninjalog.desc=Her nasılsa, düşmanlar bu tahta kuklanın gerçek Haydut olduğuna kolayca ikna oluyor!
actors.hero.abilities.rogue.smokebomb$ninjalog.discover_hint=Bu karakteri, belirli bir kahraman zırh yeteneğiyle bulabilirsin.
actors.hero.abilities.rogue.smokebomb.short_desc=Haydut, bir _Sis Bombası_ atar ve bu sırada anında uzağa atılır. Eski yerine yakın düşmanları kör eder.
actors.hero.abilities.rogue.smokebomb.desc=Haydut bir sis bombası atar ve 6 kare uzaklığa kadar anında atılır. Tehlikelerin ve düşmanların içinden atılabilir, ama duvar gibi sağlam arazinin içinden geçemez\n\nHaydut'un eski konumuna yakın olan düşmanlar 5 tur boyunca kör olur.
actors.hero.abilities.rogue.deathmark.name=Ölüm İşareti
actors.hero.abilities.rogue.deathmark.ally_target=Sadece düşmanları işaretleyebilirsin
actors.hero.abilities.rogue.deathmark.short_desc=Haydut, seçilen bir düşmanın üzerine bir _Ölüm İşareti_ koyar. İşaretlenen düşmanlar ilave hasar alır, ama işaret sonlanana kadar ölemezler.
actors.hero.abilities.rogue.deathmark.desc=Haydut, seçilen bir düşmanın üzerine bir işaret koyar, onun %25 ilave hasar almasını sağlar. işaret anında koyulur ve 5 tur sürer.\n\nİşaretlenen düşmanlar ilave hasar alır ancak işaret sona erene kadar ölemezler. Eğer bir düşman 0 SP'de iken işaret sona ererse anında ölür.
actors.hero.abilities.rogue.deathmark$deathmarktracker.name=Ölüm İşaretli
actors.hero.abilities.rogue.deathmark$deathmarktracker.desc=Bu düşman işaretli. Bu, düşmanın 25%% ilave hasar almasına sebep olur, ama işaret sona erene kadar ölemez.\n\nKalan tur: %s
actors.hero.abilities.rogue.shadowclone.name=Gölge Klon
actors.hero.abilities.rogue.shadowclone.short_desc=Haydut, savaşta kendisine yardım etmesi için yönlendirilebilen bir _Gölge Klon_ çağırır.
actors.hero.abilities.rogue.shadowclone.desc=Haydut, savaşta kendisine yardım etmesi için yönlendirilebilen, kendisinin gölge klonunu çağırır. Gölge klonu yönlendirmek yük gerektirmez\n\nKlonun 80 HP'si vardır, zırhı yoktur ve 10-20 hasar verir. Tüm bu özellikler yeteneklerle geliştirilebilir, böylece klon kahramanın sahip olduğu zırh ve silahlardan faydalanabilir.
actors.hero.abilities.rogue.shadowclone$shadowally.name=Gölge Haydut
actors.hero.abilities.rogue.shadowclone$shadowally.direct_defend=Klonun bu konuma gidiyor.
actors.hero.abilities.rogue.shadowclone$shadowally.direct_follow=Klonun seni takip ediyor.
actors.hero.abilities.rogue.shadowclone$shadowally.direct_attack=Klonun saldırmak için hareket ediyor!
actors.hero.abilities.rogue.shadowclone$shadowally.desc=Haydut'un gölgeli karanlıktan yapılmış bir kopyası. Boş gözlerinin içinden buhar gibi yükselen ufak karanlık parçalarıyla, kımıldamadan duruyor.\n\nKlon, Haydut'un mükemmel bir koypası değildir, ama yine de iyi bir dövüşçüdür ve doğru yeteneklerle Haydut'un ekipmanından faydalanabilir.
actors.hero.abilities.rogue.shadowclone$shadowally.discover_hint=Bu karakteri, belirli bir kahraman zırh yeteneğiyle bulabilirsin.

actors.hero.abilities.huntress.spectralblades.name=hayalet bıçaklar
actors.hero.abilities.huntress.spectralblades.short_desc=Avcı, hedefe _Hayalet Bıçaklar_ atar ve mevcut yakın dövüş silahına bağlı olarak hasar verir.
actors.hero.abilities.huntress.spectralblades.desc=Avcı bir hedefe yakın dövüş silahından çıkmış menzilli bir saldırı gibi davranan hayalet bıçak atar.  Efsunlarda dahil olmak üzere, silahın tüm etkileri bu saldırıda mevcuttur.
actors.hero.abilities.huntress.naturespower.name=doğanın gücü
actors.hero.abilities.huntress.naturespower.short_desc=Avcı _Doğanın Gücünü_ çağırır ve hareket hızını ve yayının saldırı hızını kısa bir süre için artırır.
actors.hero.abilities.huntress.naturespower.desc=Avcı kendini ve yayını doğanın gücüyle geçici bir süreliğine güçlendirir! Bu 8 tur sürer.\n\nBu süre boyunca, Avcı 2x hızda hareket eder, ve yayıyla %33 daha hızlı saldırır. Eğer Keskin Nişancı özel saldırılarını kullanırsa bonus yay etkileri tetiklenmez.
actors.hero.abilities.huntress.naturespower$naturespowertracker.name=doğanın gücü
actors.hero.abilities.huntress.naturespower$naturespowertracker.desc=Avcı kısa bir süreliğine güçlendi, böylece hareket hızı ve yayının saldırı hızı arttı.\n\nKalan tur: %s
actors.hero.abilities.huntress.spirithawk.name=ruh şahini
actors.hero.abilities.huntress.spirithawk.no_space=Yakınında boş alan yok.
actors.hero.abilities.huntress.spirithawk.short_desc=Avcı, mekanları keşfetmesine ve düşmanların dikkatini dağıtmasına yardımcı olabilecek bir _Ruh Şahini_ çağırır.
actors.hero.abilities.huntress.spirithawk.desc=Avcı bir ruh şahini çağırır, çağrılmışken yeteneği tekrar kullanarak yönlendirilebilir. Şahin 100 tur boyunca sürer, şahini yönlendirmek yük harcamaz.\n\nŞahinin az canı ve saldırı gücü vardır ama hızlı, saldırılardan kolayca kaçınır, ve isabetlidir. Bütün görüş alanını her zaman Avcı ile paylaşır. Ateş, zehir gazı gibi herhangi alan sınırlı etki şahinin üzerine etki etmez. Özellikle yönlendirilmediyse hiç saldırmayacaktır.
actors.hero.abilities.huntress.spirithawk$hawkally.name=ruh şahini
actors.hero.abilities.huntress.spirithawk$hawkally.direct_defend=Şahinin bu konuma gidiyor.
actors.hero.abilities.huntress.spirithawk$hawkally.direct_follow=Şahinin seni takip ediyor.
actors.hero.abilities.huntress.spirithawk$hawkally.direct_attack=Şahinin saldırmak için hareket ediyor!
actors.hero.abilities.huntress.spirithawk$hawkally.desc=Avcı tarafından çağırılmış büyülü bir şahin. Parlak, semavi bir maviyle parıldıyor, kafası, alanı tararken sürekli hareket ediyor.\n\nPek iyi bir dövüşçü olmasa da hızı ve görüş yeteneği düşmanları gözetlemek ve dikkatlerini dağıtmak için mükemmel.
actors.hero.abilities.huntress.spirithawk$hawkally.desc_remaining=Kalan tur: %d
actors.hero.abilities.huntress.spirithawk$hawkally.desc_dodges=Kalan garanti kaçınmalar: %d
actors.hero.abilities.huntress.spirithawk$hawkally.discover_hint=Bu karakteri, belirli bir kahraman zırh yeteneğiyle bulabilirsin.

actors.hero.abilities.duelist.challenge.name=meydan okuma
actors.hero.abilities.duelist.challenge.prompt=Meydan okuyacağın bir düşman seç
actors.hero.abilities.duelist.challenge.already_dueling=Aynı anda sadece bir düelloda bulunabilirsin.
actors.hero.abilities.duelist.challenge.ally_target=Sadece düşmanlara meydan okuyabilirsin
actors.hero.abilities.duelist.challenge.unreachable_target=Hedefine ulaşabiliyor olmalısın.
actors.hero.abilities.duelist.challenge.distant_target=O düşman meydan okumak için çok uzakta.
actors.hero.abilities.duelist.challenge.short_desc=Düellocu yakındaki bir düşmana düello için _Meydan Okur_ ve diğer tüm düşmanları geçici olarak dondurur.
actors.hero.abilities.duelist.challenge.desc=Düellocu yakındaki bir düşmanı düelloya davet eder. Bu düşman onunla savaşmaya zorlanırken, diğer tüm düşmanlar geçici olarak zamanda dondurulur.\n\nHedef ulaşılabilir olmalı ve Düellocunun en fazla 5 kare uzağında olmalıdır. Düello, 10 tur geçene, düşman ölene veya Düellocu düşmandan 5 kareden fazla uzaklaşana kadar sürer.\n\nDonmuş düşmanlar zarar görmez. Düellocunun müttefikleri bu yetenek tarafından dondurulmaz, ama eğer bir baş düşman hedeflenirse onun köleleri dondurulmaz.
actors.hero.abilities.duelist.challenge$duelparticipant.name=düello katılımcısı
actors.hero.abilities.duelist.challenge$duelparticipant.desc=Bu karakter bir düelloya katılıyor. Diğerleri donmuş haldeyken kendilerinin ve müttefiklerinin ya da kölelerinin normal şekilde hareket etmesine izin verilir.\n\nDüello belirli bir süre boyunca, katılımcılardan biri ölene kadar veya katılımcılar birbirlerinden 5 kareden fazla uzaklaşana kadar sürecektir.\n\nKalan tur sayısı: %d.
actors.hero.abilities.duelist.elementalstrike.name=elemental darbe
actors.hero.abilities.duelist.elementalstrike.short_desc=Düellocu bir _Elemental Darbe_ gerçekleştirir, koni şeklindeki bir alana silah efsununa bağlı olarak değişen bir etki yayar.
actors.hero.abilities.duelist.elementalstrike.desc=Düellocu bir düşmana veya konuma saldırarak, isabet etmesi garanti olan normal bir saldırı gerçekleştirir ve 65 derecelik bir koni içinde 4 kareye kadar yayılan büyülü bir etki yayar. Bu büyülü etki, Düellocunun birincil silahındaki büyüye bağlı olarak değişir.
actors.hero.abilities.duelist.elementalstrike.generic_desc=Büyü içermeyen bir element saldırısı küçük bir büyü patlaması yaratarak menzildeki tüm düşmanlara 6-12 hasar verir.
actors.hero.abilities.duelist.feint.name=Şaşırtmaca
actors.hero.abilities.duelist.feint.prompt=Atlamak için bir konum seç
actors.hero.abilities.duelist.feint.too_far=Bu konum sana bitişik değil.
actors.hero.abilities.duelist.feint.bad_location=Bu bölgeye hareket edemezsin.
actors.hero.abilities.duelist.feint.short_desc=Düellocu _Şaşırtmaca Yapar_, bitişik bir kareye atılırken bir saldırı numarası yapar. Rakipler onun ardıl görüntüsüne saldırarak kendilerini saldırıya açık hale getirirler.
actors.hero.abilities.duelist.feint.desc=Düellocu bitişik bir kareye atılırken bir saldırı numarası yapar ve arkasında anlık bir ardıl görüntü bırakır. Düellocuya saldıran düşmanlar, onun yerine ardıl görüntüsüne saldırır.\n\nArt görüntüye saldıran düşmanların kafası karışır, bu da bir sonraki eylemlerini iptal eder ve onları sürpriz bir saldırıya açık bırakır.

actors.hero.abilities.cleric.ascendedform.name=yükselmiş biçim
actors.hero.abilities.cleric.ascendedform.short_desc=Ruhban _Yükselmiş Biçime_ bürünerek yeni büyüler, saldırı menzili ve kalkan kazanır.
actors.hero.abilities.cleric.ascendedform.desc=Ruhban kendisinden kutsal enerji yansıtarak 10 tur boyunca genişletilmiş bir ışıltılı forma bürünür. Bu formdayken Ruhban yeni büyüler yapabilir, 2 saldırı menzili ve 30 kalkan kazanır ve yaptığı her ek büyü, kullanılan her kutsal cisim şarjı başına 10 kalkan sağlar.\n\nYükselmiş formdan ve büyülerinden gelen kalkan normalde bozulmaz, ancak yükselmiş form sona erdiğinde hemen kaybolur. Bu yetenek, yükselmiş formun süresini yenilemek için yeniden kullanılabilir.
actors.hero.abilities.cleric.ascendedform$ascendbuff.name=yükselmiş biçim
actors.hero.abilities.cleric.ascendedform$ascendbuff.desc=Papaz'ın bedeninden ışıldayan bir enerji yayılır. Bu formdayken Papaz 2 saldırı menzili (kendisinden yayılan kutsal enerjiden dolayı) ve bir kutsal kitap şarjı harcadığında 10 kalkan kazanır. Ayrıca yükselmiş formun yetenekleri aracılığıyla açılan büyüleri de yapabilirler.\n\nYükselmiş form ve büyüleri tarafından verilen kalkan normal olarak bozulmaz, ancak yükselmiş form sona erdiğinde anında kaybolur.\n\nMevcut koruma: %1$d.\nKalan hamle sayısı: %2$d.
actors.hero.abilities.cleric.trinity.name=trinity
actors.hero.abilities.cleric.trinity.no_imbue=Trinity'nin şu anda hiçbir formu için belirlenmiş bir etkisi yok, büyülerinden birini kullan!
actors.hero.abilities.cleric.trinity.no_duplicate=Trinity zaten sahip olduğunuz bir efekti kopyalayamaz!
actors.hero.abilities.cleric.trinity.ench_glyph_use=Trinity, bu etkisini _ %1$d tur_ boyunca uygulayacak ve _%2$s şarj_ karşılığında yapılacaktır.
actors.hero.abilities.cleric.trinity.rare_ench_glyph_use=Trinity, bu _güçlü_ etkisini _%1$d tur_ boyunca uygulayacak ve karşılığında _%2$s şarj_ harcayacaktır.
actors.hero.abilities.cleric.trinity.wand_use=Trinity bu asayı _+%1$d_'ya _%2$s şarj pahasına_ çarptıracak.
actors.hero.abilities.cleric.trinity.wand_multi_use=Trinity bu _çok-şarjlı_ asayı _+%1$d_'ya _%2$s şarj pahasına_ çarptıracak.
actors.hero.abilities.cleric.trinity.thrown_use=Trinity bu silahı _%2$s şarj_ bedeli karşılığında _+%1$d_ değerinde fırlatır.
actors.hero.abilities.cleric.trinity.ring_use=Trinity bu yüzüğün etkisini 20 tur boyunca _+%1$d_ olarak uygular, bunun bedeli _%2$s şarjdır._
actors.hero.abilities.cleric.trinity.alchemiststoolkit_use=Trinity, bu artefaktın uzaktan simya etkisini _ %2$s şarj_ karşılığında uygular.
actors.hero.abilities.cleric.trinity.chaliceofblood_use=Trinity _ %2$s şarj_ karşılığında bu artifaktın pasif can yenileme etkisini 20 tur boyunca _+ %1$d_ olarak uygular.
actors.hero.abilities.cleric.trinity.driedrose_use=Trinity bu eserin etkisini kullanarak, _%2$s şarj_ karşılığında _+%1$d_ hayalet HP'sine sahip yozlaşmış bir dost hayalet çağırır.
actors.hero.abilities.cleric.trinity.etherealchains_use=Trinity, _%2$s şarj_ karşılığında bu eserin zincirleme atış etkisini _+%1$d_ erişimle uygular.
actors.hero.abilities.cleric.trinity.hornofplenty_use=Trinity, _%2$s şarj_ bedeli karşılığında bu eserin atıştırma etkisini uygular.
actors.hero.abilities.cleric.trinity.masterthievesarmband_use=Trinity, bu eserin düşman soyma etkisini _%2$s şarj_ karşılığında _+%1$d_ olarak uygular.
actors.hero.abilities.cleric.trinity.sandalsofnature_use=Trinity, bu eserin kök etkisini _%2$s şarj_ karşılığında rastgele bir zararlı tohumla uygular.
actors.hero.abilities.cleric.trinity.skeletonkey_use=Trinity, bu eserin ekleme etkisini _%2$s şarj_ karşılığında uygulayacaktır.
actors.hero.abilities.cleric.trinity.talismanofforesight_use=Trinity, bu eserin kehanet etkisini _+%1$d_ menzil ile uygulayacak, karşılığında _%2$s şarj_ harcayacaktır.
actors.hero.abilities.cleric.trinity.timekeepershourglass_use=Trinity, bu eserin zaman dondurma etkisini _%1$d_ tur süreyle uygulayacak, karşılığında _%2$s şarj_ harcayacaktır.
actors.hero.abilities.cleric.trinity.unstablespellbook_use=Trinity, bu eserin rastgele parşömen etkisini _%1$d/10_ ihtimalle egzotik versiyonu ek bir maliyet olmadan sunacak, karşılığında _%2$s şarj_ harcayacaktır.
actors.hero.abilities.cleric.trinity.cost=Bu yeteneğin şarj maliyeti değişir, ancak çoğunlukla _%d_ olur.
actors.hero.abilities.cleric.trinity.short_desc=Rahip, gördüğü ekipmanları taklit eden bir _Trinity_ yeteneği kazanır ve bu yetenek yeni büyüler kullanılarak atanabilir.
actors.hero.abilities.cleric.trinity.desc=Rahip, üç yeni büyü kullanarak farklı ekipman etkilerini taklit edebilen bir _Trinity_ zırh yeteneği kazanır. Bu büyüler, Rahip'in bu macera sırasında tanıdığı ekipman türlerine göre etkiler yaratır: beden formu (silahlar ve zırhlar), zihin formu (sihirli değnekler ve atılabilir silahlar) ve ruh formu (yüzükler ve eserler).\n\nHer Trinity formu yalnızca bir etkiyle doldurulabilir ve Rahip, hangi etkiyi aktive edeceğini seçer. Trinity, zaten takılı olan bir ekipmanın etkisini taklit etmez.
actors.hero.abilities.cleric.trinity$wndusetrinity.text=Hangi Trinity biçiminin kullanılacağını seçin. Farklı biçimlerin etkileri aynı anda etkin olabilir.
actors.hero.abilities.cleric.trinity$wndusetrinity.body=_Vücut Formu: %s._
actors.hero.abilities.cleric.trinity$wndusetrinity.mind=_Zihin Formu: %s._
actors.hero.abilities.cleric.trinity$wndusetrinity.spirit=_Ruh Formu: %s._
actors.hero.abilities.cleric.trinity$wnditemtypeselect.text=Trinity'ye aşılanacak bir etki seçin. Onaylamadan önce ek bilgi gösterilecektir.
actors.hero.abilities.cleric.trinity$wnditemconfirm.body=Gövde formuna geçti
actors.hero.abilities.cleric.trinity$wnditemconfirm.mind=Zihin formuna geçti
actors.hero.abilities.cleric.trinity$wnditemconfirm.spirit=Ruh formuna geçti
actors.hero.abilities.cleric.powerofmany.name=çoğunluğun gücü
actors.hero.abilities.cleric.powerofmany.prompt_default=Bir dost veya bir lokasyon seçin
actors.hero.abilities.cleric.powerofmany.prompt_ally=Işığınızı dostunuza yönlendirin
actors.hero.abilities.cleric.powerofmany.ally_exists=Zaten güçlendirilmiş bir dostun var.
actors.hero.abilities.cleric.powerofmany.no_vision=Görmediğin bir yeri hedef alamazsın.
actors.hero.abilities.cleric.powerofmany.only_allies=Sadece dostlarını güçlendirebilirsin.
actors.hero.abilities.cleric.powerofmany.short_desc=Rahip, _Çoğunluğun Gücünü_ kanalize ederek mevcut bir müttefiki güçlendirir veya yeni bir müttefik yaratır.
actors.hero.abilities.cleric.powerofmany.desc=Rahip, 100 tur boyunca mevcut bir müttefiki güçlendiren ya da yeni bir güçlendirilmiş müttefik yaratan _Çoğunluğun Gücü_'nü kanalize eder. Boş bir alan hedeflendiğinde yeni bir müttefik yaratılır.\n\nÇoğunluğun Gücü ile güçlendirilmiş herhangi bir müttefik +%25 hasar verir, -%25 hasar alır ve görüşünü Rahiple paylaşır. Ayrıca yetenek kullanıldığında 25 kalkan kazanırlar.\n\nRuhban ayrıca yalnızca güçlendirilmiş bir müttefikle birlikte kullanılabilen üç yeni büyü kazanır. Bu büyülerden biri etkin durumdayken Çoğunluğun Gücü sona ermez.
actors.hero.abilities.cleric.powerofmany$powerbuff.name=çoğunluğun gücü
actors.hero.abilities.cleric.powerofmany$powerbuff.desc=Bu müttefik Çoğunluğun Gücü tarafından güçlendirilerek +%%25 hasar vermesini ve -%%25 hasar almasını sağlar. Ayrıca görüş menzillerini Ruhban ile paylaşırlar ve Çoğunluğun Gücü büyülerinden faydalanabilirler.\n\nÇoğunluğun Gücü, prizmatik görüntüler gibi müttefikler saklandığında da devam eder, ancak süresi yine de azalır.\n\nKalan hamle sayısı: %s.
actors.hero.abilities.cleric.powerofmany$lightally.name=hafif müttefik
actors.hero.abilities.cleric.powerofmany$lightally.direct_defend=Müttefiğin o pozisyona hareket etti.
actors.hero.abilities.cleric.powerofmany$lightally.direct_follow=Dostun hemen arkanda.
actors.hero.abilities.cleric.powerofmany$lightally.direct_attack=Müttefiğin saldırı için harekete geçti!
actors.hero.abilities.cleric.powerofmany$lightally.desc=Ruhbanın macera arkadaşlarından birinin katı ışıktan yapılmış bir kopyası. Başka bir kahramanın şekline sahip olsa da, onun benzersiz yeteneklerinden hiçbirine sahip değildir. Bu müttefik, Çoğunluğun Gücü uygulandığı sürece varlığını sürdürecektir.\n\nBu dost, Çoğunluğun Gücü zırh yeteneği yeniden kullanılarak hiçbir ücret ödemeden yönlendirilebilir.
actors.hero.abilities.cleric.powerofmany$lightally.discover_hint=Bu karakteri, belirli bir kahraman zırh yeteneğiyle bulabilirsin.


actors.hero.abilities.ratmogrify.name=Fareleştirme
actors.hero.abilities.ratmogrify.cant_transform=Onu fareleştiremezsin
actors.hero.abilities.ratmogrify.too_strong=Bu düşman fareleştirmek için çok güçlü
actors.hero.abilities.ratmogrify.short_desc=Kahraman bir düşmanı _fareleştirir_. Fareleştirmek düşmanı zararsız bir fareye dönüştürür ama düşman ganimet düşürmez.
actors.hero.abilities.ratmogrify.desc=Kahraman bir düşmanı 6 tur boyunca bir sıçana dönüştürür! Bosslar, müttefikler ve sıçanlar sıçanlaştırılamaz.\n\nSıçanlaştırılmış düşmanlar orijinal özelliklerini korurlar, ancak herhangi bir yetenekleri yoktur.
actors.hero.abilities.ratmogrify$transmograt.name=Fareleştirilmiş %s
actors.hero.abilities.ratmogrify$transmograt.desc=Bu düşman bir fareye dönüştürüldü. Bana sorarsan büyük bir ilerleme! - Fare Kral
actors.hero.abilities.ratmogrify$transmograt.rankings_desc=Öldüren: fareye çevrilmiş düşman

##Cleric Spells
actors.hero.spells.auraofprotection.name=koruma halesi
actors.hero.spells.auraofprotection.short_desc=Şövalye ve yakındaki müttefikler için savunmayı güçlendirir.
actors.hero.spells.auraofprotection.desc=Şövalye 20 tur boyunca etrafına ışıltılı bir aura şeklinde koruyucu enerji yaymaya başlar. Şövalye'nin 2 karesi içindeki tüm dostları (kendileri de dahil) %%%1$d daha az hasar alır ve Şövalye'nin zırh glifinin etkisini +%%%2$d güçle kazanır.\n\nBu hasar azaltma, diğer hasar azaltıcı etkilerden (örneğin zırh) önce gerçekleşir. Glif gücü artışı her zaman geçerli olacaktır, ancak bu büyü, Şövalyenin glifinden zaten yararlanan bir karakter varsa (örneğin Şövalyenin kendisi veya prizmatik bir görüntü), bu glifin birden fazla kez uygulanmasına neden olamaz.
actors.hero.spells.auraofprotection$aurabuff.name=koruma halesi
actors.hero.spells.auraofprotection$aurabuff.desc=Şövalye kendi etrafına koruyucu enerji yayar.\n\nYakındaki herhangi bir dost ( Şövalyenin kendisi de dahil) daha az hasar alır ve arttırılmış güç ile Şövalyenin zırh glifinin etkisini kazanır.\n\nKalan hamle sayısı: %s.

actors.hero.spells.beamingray.name=ışınlama ışını
actors.hero.spells.beamingray.no_space=Müttefikinizin orada görünmesi için yer yok.
actors.hero.spells.beamingray.out_of_range=Konum menzil dışında.
actors.hero.spells.beamingray.short_desc=Müttefikinizi ışınlar ve ilave hasar verir.
actors.hero.spells.beamingray.desc=Rahip, müttefikinin gücünü bir ışınlanma ışınına dönüştürerek onu bir yere ışınlar. Işın bir düşmanla çarpışırsa müttefiki yakınına yerleştirir ve düşmana doğru yönlendirir.\n\nIşın en fazla %1$d karo menzile sahiptir ve 4 karo içindeki en yakın düşmana karşı 10 tur boyunca Çoğunluğun Gücü'nün ilave hasarını +%%%2$d kadar yükseltir. Işınlama normalde hareketsiz olan müttefikleri bile ışınlayabilir, ancak bu durumlarda menzili yarıya iner.
actors.hero.spells.beamingray$beamingrayboost.name=ışınlama ışını
actors.hero.spells.beamingray$beamingrayboost.desc=Bu müttefik kısa süre önce Işınlayan Işın tarafından ışınlandı ve ışınlandıktan sonra en yakındaki düşmana karşı ilave hasar verdi. Bu güçlendirme etkinken Çoğunluğun Gücü'nün süresi de dolmaz.\n\nKalan hamle sayısı: %s.

actors.hero.spells.blessspell.name=kutsa
actors.hero.spells.blessspell.short_desc=Papazı kutsar ve korur, diğerlerini kutsar ve iyileştirir.
actors.hero.spells.blessspell.desc=Papaz kendisine veya görebildiği başka bir karaktere kutsal bir kutsama yapar.\n\nKendilerine yapıldığında etkisi daha zayıftır, %1$d tur kutsama ve %2$d bariyer verir.\n\nDiğer karakterlere yapıldığında büyü daha güçlüdür, %3$d tur kutsama ve %4$d iyileşme sağlar. Fazla iyileştirme bariyere dönüştürülür.

actors.hero.spells.bodyform.name=Vücut Formu
actors.hero.spells.bodyform.short_desc=Trinity'yi bir büyü veya glif olarak atar.
actors.hero.spells.bodyform.desc=Rahip, bu turda belirlediği bir büyü veya glifi seçer ve Trinity'ye onun etkisini yükler.\n\nTrinity kullanıldığında, Ruhban seçilen büyü ya da glifin etkisini %d tur boyunca kazanır. Bu geçici büyü veya glif, normal bir büyü veya glifin yapacağı herhangi bir etkiyle çalışacaktır.\n\nBu büyü, Trinity'nin halihazırda sahip olduğu diğer tüm beden etkilerinin yerini alır.
actors.hero.spells.bodyform$bodyformbuff.name=Vücut Formu
actors.hero.spells.bodyform$bodyformbuff.desc=Trinity'nin beden biçimi şu anda size bir efsun veya glifin gücünü veriyor, sanki mevcut silahınızda veya zırhınızda varmış gibi.\n\nBeden biçiminin halihazırda yararlandığınız bir etkinin başka bir kopyasını sağlayamayacağını unutmayın.\n\nGeçerli Etki: %1$s.\n\nKalan hamle sayısı: %2$s.

actors.hero.spells.cleanse.name=arındır
actors.hero.spells.cleanse.short_desc=Zayıflatıcıları temizler ve kalkan sağlar.
actors.hero.spells.cleanse.desc=Rahip, kendisindeki ve görünen tüm dostlarındaki zararlı durum etkilerini temizler. Büyü sona erdikten sonra, etkilenen tüm karakterler ayrıca %1$d tur boyunca zayıflama bağışıklığı kazanır ve %2$d bariyeri elde eder.

actors.hero.spells.clericspell.prompt=Hedef seçin
actors.hero.spells.clericspell.no_target=Orada hedef falan yok.
actors.hero.spells.clericspell.invalid_target=O konumu hedef alamazsınız.
actors.hero.spells.clericspell.invalid_enemy=Bu düşmanı hedefleyemezsin
actors.hero.spells.clericspell.charge_cost=Şarj maliyeti: %d

actors.hero.spells.divinesense.name=ilahi duyu
actors.hero.spells.divinesense.short_desc=Geniş bir menzilde geçici zihin görüşü kazanın.
actors.hero.spells.divinesense.desc=Rahip, duyularını çevresine odaklayarak 50 tur boyunca %d karo menzilinde akıl görüşü kazanır. Bu büyüyu yapmak zaman almaz
actors.hero.spells.divinesense$divinesensetracker.name=ilahi duyu
actors.hero.spells.divinesense$divinesensetracker.desc=Bu karakter geçici olarak yakındaki diğer yaratıkları zihniyle görebilir!\n\nKalan hamle sayısı: %s.

actors.hero.spells.divineintervention.name=ilahi müdahale
actors.hero.spells.divineintervention.short_desc=Papaz ve müttefiklerine büyük kalkan desteği.
actors.hero.spells.divineintervention.desc=Rahip, kutsal kitabından kendisine ve müttefiklerine muazzam miktarda güç aktararak herkesi %1$d kalkan gücüne yükseltir ve Yükselmiş Biçim'i %2$d tur uzatır. Bu büyünün inanılmaz savunma gücü, çok yüksek şarj bedeli karşılığında gerçekleşir.\n\nYükselmiş Biçim tarafından verilen diğer kalkanlar gibi, bu kalkan da normal olarak bozulmaz, ancak Yükselmiş Biçim sona erdiğinde derhal sona erer.

actors.hero.spells.flash.name=flaş
actors.hero.spells.flash.prompt=Bir konum seç
actors.hero.spells.flash.short_desc=Yakındaki bir yere ışınlan.
actors.hero.spells.flash.desc=Papaz yükselmiş halini yakındaki bir konuma yönlendirir ve oraya ışınlanır. Flaş, Papazı menzil içinde bulunan ve boş olan herhangi bir yere ışınlayabilir. Bu büyü aynı yükselmiş formda her kullanıldığında daha fazla tome şarjına mal olur.

actors.hero.spells.guidinglight.name=kılavuz ışık
actors.hero.spells.guidinglight.short_desc=Menzilli büyü hasarı verir ve isabeti garantiler.
actors.hero.spells.guidinglight.desc=Rahip, hedefi vuran ve 2-8 hasar veren, aynı zamanda onu aydınlatan büyüsel bir ok fırlatır. Aydınlatılmış bir düşmana yapılan sonraki fiziksel saldırı, taşıma sınırına bakılmaksızın kesinlikle isabet eder
actors.hero.spells.guidinglight.desc_priest=_Bu büyü Rahip tarafından yapıldığında daha güçlüdür._ 50 turda bir büyünün ilk kez yapılması hiçbir kitap yüküne mal olmaz ve aydınlatma, ışıltı, asalar, diğer karakterler ve düşmanları doğrudan etkileyen eserler tarafından tüketilir. Aydınlatma bu şekilde kullanıldığında, Rahibin seviyesi + 5'e eşit ilave büyü hasarı verir.
actors.hero.spells.guidinglight$guidinglightpriestcooldown.name=Kılavuz Işık
actors.hero.spells.guidinglight$guidinglightpriestcooldown.desc=Rahip, 50 tur geçtikten sonra tekrar bedelsiz olarak Kılavuz Işık kullanabilecektir.\n\nKalan hamle sayısı: %s.
actors.hero.spells.guidinglight$illuminated.name=Aydınlanmış
actors.hero.spells.guidinglight$illuminated.desc=Bu karakter, kılavuz ışık tarafından vurulmasının sonucu olarak parlıyor. Parıltı etrafı aydınlatacak kadar güçlü olmasa da, büyülü etki onlara darbe indirmeyi Rahip için çok daha kolay hale getirecektir.
actors.hero.spells.guidinglight$illuminated.desc_priest=Rahip ayrıca aydınlatmayı ışıltıyla, bir asa darbesiyle, bir müttefikten gelen darbeyle veya bazı eserlerden gelen etkilerle kullanabilir. Aydınlatmayı bu şekilde kullanmak, Rahibin seviyesi + 5 kadar ilave büyü hasarı verir.
actors.hero.spells.guidinglight$illuminated.desc_generic=Diğer kahramanlar yakan ışık yeteneğinden faydalanmak için aydınlatılmışı kullanmaya devam edebilir, ancak herhangi bir isabetlilik kazanmazlar.

actors.hero.spells.hallowedground.name=kutsal toprak
actors.hero.spells.hallowedground.prompt=Bir konum seç
actors.hero.spells.hallowedground.short_desc=Takım arkadaşlarını iyileştirir, düşmanları yavaşlatır ve bir AOE içinde çim yayar.
actors.hero.spells.hallowedground.desc=Rahip ilahi büyüsünü yakındaki toprağa odaklayarak 20 tur boyunca %1$dx%1$d boyutunda kutsal bir alan oluşturur.\n\nBu büyü yapıldığında, tüm müttefikleri 15 HP iyileştirir (sağlıklı müttefikler ve Rahip kalkan kazanır), düşmanları kısa süreliğine kökler ve kısa otlar yayar.\n\nKutsal arazi müttefikleri tur başına 1 HP iyileştirir (sağlıklı müttefikler ve Rahip kalkan kazanır), düşmanları sakat bırakır ve rastgele uzun otların büyümesine neden olur.\n\nKutsal arazi ateşle yok edilir ve pasif yenilenme etkileri devre dışı bırakılırsa ya da Rahip bir süredir exp kazanmamışsa karık çimen üretir.
actors.hero.spells.hallowedground$hallowedterrain.desc=Toprak burada kutsanmıştır. Kutsanmış zemin düşmanları yavaşlatır, müttefikleri iyileştirir ve çimlerin yayılmasına neden olur.

actors.hero.spells.holyintuition.name=kutsal sezgi
actors.hero.spells.holyintuition.prompt=bir nesne seçin
actors.hero.spells.holyintuition.cursed=Bu nesnenin içinde kötü niyetli bir büyünün gizlendiğini hissediyorsun.
actors.hero.spells.holyintuition.uncursed=Bu nesne kötü niyetli büyüden arındırılmıştır.
actors.hero.spells.holyintuition.short_desc=Bir nesnenin lanetli olup olmadığını belirler.
actors.hero.spells.holyintuition.desc=Papaz duyularını bir nesneye odaklar ve onu kuşanmak zorunda kalmadan lanetli olup olmadığını belirler.

actors.hero.spells.holylance.name=kutsal mızrak
actors.hero.spells.holylance.short_desc=Ağır menzilli büyü hasarı verir.
actors.hero.spells.holylance.desc=Rahip büyük miktarda enerjiyi ışıktan yapılmış yıkıcı bir mızrağa yoğunlaştırır. Bu mızrak %1$d-%2$d hasar verir ve ölümsüz ve şeytani hedeflere her zaman en fazla hasarı verir.\n\nBu büyü çok pahalıdır ve 30 turluk bir bekleme süresine sahiptir.
actors.hero.spells.holylance$lancecooldown.name=kutsal mızrak bekleme süresi
actors.hero.spells.holylance$lancecooldown.desc=Rahip kısa süre önce Kutsal Mızrak'ı kullanmıştır ve tekrar kullanmadan önce beklemelidir.\n\nKalan hamle sayısı: %s.

actors.hero.spells.holyward.name=kutsal korunma
actors.hero.spells.holyward.glyph_name=ışığın %s
actors.hero.spells.holyward.glyph_desc=Bu sembol, zırhın engelleyebileceği hasar miktarını biraz artırır.
actors.hero.spells.holyward.short_desc=Geçici olarak sembollerini geçersiz kılarak zırh engellemesini artırır.
actors.hero.spells.holyward.desc=Ruhban, giydiği zırhı kutsal ışığın glifleriyle büyüleyerek zırhın hasar engelleme değerini 1 artırır. Bu büyü anında yapılır, zaman almaz.\n\nBu glif 50 tur boyunca etkili olur ve bu süre boyunca zırh üzerindeki diğer yararlı gliflerin etkisini geçersiz kılar. Ruhban, zırhı olmasa bile bu etkiden faydalanabilir.
actors.hero.spells.holyward.desc_paladin=Bu büyü Şövalye tarafından yapıldığında daha güçlüdür. Ek hasar engelleme 3 değerine yükseltilir, büyü artık mevcut glifleri geçersiz kılmaz ve kutsal muhafız etkinken başka büyüler yapmak, kullanılan her şarj başına süresini 10 tur uzatır.
actors.hero.spells.holyward$holyarmbuff.name=kutsal korunma
actors.hero.spells.holyward$holyarmbuff.desc=Rahip, giydiği zırhı kutsal enerjiyle kuşatarak mevcut sembolleri geçici olarak geçersiz kılar ve zırhın 1 ekstra hasar engellemesine neden olur.\n\nKalan hamle sayısı: %s.
actors.hero.spells.holyward$holyarmbuff.desc_paladin=Şövalye giydiği zırha kutsal enerji yükleyerek zırhın fazladan 3 puanlık hasarı engellemesini sağlar.\n\nKutsal korunma etkinken başka büyüler yapmak, süresini harcanan her şarj başına 10 tur uzatır.\n\nKalan tur sayısı: %s.

actors.hero.spells.holyweapon.name=kutsal silah
actors.hero.spells.holyweapon.ench_name=kutsal %s
actors.hero.spells.holyweapon.ench_desc=Kutsal bir silahla vurulan düşmanlar fazladan büyülü hasar alır.
actors.hero.spells.holyweapon.short_desc=Hasarı artırmak için büyüleri geçici olarak geçersiz kılar.
actors.hero.spells.holyweapon.desc=Ruhban, kuşandığı silahı kutsal enerjiyle büyüler. Bu büyü, silahın her saldırısında hedefe fazladan 2 büyü hasarı verir. Büyü anında yapılır, zaman almaz.\n\nBu büyü 50 tur boyunca sürer ve bu süre boyunca silah üzerindeki diğer yararlı büyülerin etkisini geçersiz kılar. Silahsız saldırılar da bu etkiden faydalanabilir.
actors.hero.spells.holyweapon.desc_paladin=_Bu büyü Şövalye tarafından yapıldığında daha güçlüdür._ Ek büyü hasarı 6'ya çıkarılır, büyü artık mevcut büyüleri geçersiz kılmaz ve kutsal silah etkinken başka büyüler yapmak, kullanılan şarj başına süresini 10 tur uzatır.
actors.hero.spells.holyweapon$holywepbuff.name=kutsal silah
actors.hero.spells.holyweapon$holywepbuff.desc=Ruhban giydiği silahı kutsal enerjiyle doldurarak mevcut büyüleri geçici olarak geçersiz kılar ve silahın her saldırıda fazladan 2 büyü hasarı vermesini sağlar.\n\nKalan hamle sayısı: %s.
actors.hero.spells.holyweapon$holywepbuff.desc_paladin=Şövalye, kuşandığı silaha kutsal enerji yükleyerek saldırılarının fazladan 6 büyülü hasar vermesini sağlar.\n\nKutsal silah etkinken başka büyüler yapmak, harcanan her şarj başına silahın süresini 10 tur uzatır.\n\nKalan hamle sayısı: %s.

actors.hero.spells.judgement.name=yargı
actors.hero.spells.judgement.short_desc=Görünür tüm düşmanlara hasar verir.
actors.hero.spells.judgement.desc=Ruhban, yumruğunu yere vurur ve görüş alanındaki tüm düşmanlara hasar veren bir ışık patlaması oluşturur. Bu yetenek taban olarak %1$d–%2$d hasar verir; ancak Ruhban’ın yücelmiş forma girdikten sonra (veya en son Yargı büyüsünü kullandıktan sonra) yaptığı her büyü için %%33 ek hasar uygulanır.\n\nŞu anda Yargı %3$d–%4$d hasar verecektir.

actors.hero.spells.layonhands.name=kutsal dokunuş
actors.hero.spells.layonhands.short_desc=Bitişikteki bir karakteri anında iyileştirir veya Şövalye'yi korur.
actors.hero.spells.layonhands.desc=Şövalye kutsal enerjiyi elleri aracılığıyla yönlendirerek dokunduğu her şeyi iyileştirir veya korur.\n\nŞövalye bu büyüyü bitişiğindeki herhangi bir karaktere yaparak ona %1$d iyileşme sağlayabilir veya kendi üzerine yaparak %1$d kalkan kazanabilir. Bu büyüden elde edilen fazla şifa, korumaya dönüştürülür.\n\nBu büyü anında yapılır ve tekrar tekrar yapılabilir, ancak bir seferde üç atış değerinden fazla kalkan sağlayamaz.

actors.hero.spells.lifelinkspell.name=can bağı
actors.hero.spells.lifelinkspell.short_desc=Alınan hasarı bir dostla paylaşır ve onların aldığı hasarı azaltır.
actors.hero.spells.lifelinkspell.desc=Rahip, kendisi ve güçlendirdiği dostu arasındaki bağı güçlendirir. Bu güçlendirilmiş bağla, alınan her hasar %1$d tur boyunca hem kahraman hem de dostu arasında paylaşılır ve Çoğunluğn Gücü'nün savunma desteği alınan hasarın -%%%2$d kadar yükseltilir. Hasarın zırhtan sonra, ancak Çoğunluğun Gücü'nün hasar azaltmasından önce paylaşıldığını unutmayın.\n\nBu etki etkinken, R3 veya altındaki yararlı Ruhban büyüleri, sadece birine uygulanacaksa hem Ruhbana hem de dostuna uygulanır.
actors.hero.spells.lifelinkspell$lifelinkspellbuff.name=can bağı koruması
actors.hero.spells.lifelinkspell$lifelinkspellbuff.desc=Ruhban kısa süre önce bu müttefike Can Bağı yaptı.\n\nCan Bağı'nın normal faydalarına ek olarak, bu karakter daha az hasar alır, olumlu Ruhban büyüleri sadece birine değil hem Ruhbana hem de bu müttefike uygulanır ve bu güçlendirme etkinken Çoğunluğun Gücü'nün süresi dolmaz.\n\nKalan hamle sayısı: %s.

actors.hero.spells.mindform.name=Zihin Formu
actors.hero.spells.mindform.short_desc=Trinity'yi bir asaya veya fırlatılan silaha atar.
actors.hero.spells.mindform.desc=Ruhban, bu oyunda belirlediği bir asayı ya da fırlatılan silahı seçer ve Trinity'ye onun etkisini yükler.\n\nTrinity kullanıldığında, Ruhban sanki seçtiği eşyayı +%d değerinde kullanıyormuş gibi tek bir saldırı yapabilir. Bu, o tür bir eşyayı kullanmanın normalde tetikleyeceği tüm etkileri tetikleyecektir.\n\nBu büyü, Trinity'nin halihazırda sahip olduğu diğer tüm zihin etkilerinin yerini alır.

actors.hero.spells.mnemonicprayer.name=anımsatıcı dua
actors.hero.spells.mnemonicprayer.short_desc=Bir müttefik/düşman üzerindeki güçlendirmeleri/zayıflatmaları uzatır ve aydınlatılmış olarak yeniden uygular.
actors.hero.spells.mnemonicprayer.desc=Rahip, belirli bir hedef üzerindeki tüm güçlendirmelerin veya zayıflatmaların süresini %1$d tur uzatan bir dua eder. Bu büyüyü yapmak zaman almaz. Olumlu etkiler müttefikler (Rahibin kendisi de dahil) üzerinde daha uzun sürer ve zararlı etkiler düşmanlar üzerinde daha uzun sürer.\n\nAnımsatıcı Dua, bir güçlendirme veya zayıflatmanın belirli bir örneğini yalnızca bir kez uzatabilir ve zırh yeteneklerinden verilen güçlendirmeleri uzatamaz.

actors.hero.spells.radiance.name=ışıltı
actors.hero.spells.radiance.short_desc=Görünür düşmanları aydınlatır ve kısa süreliğine sersemletir.
actors.hero.spells.radiance.desc=Rahip kutsal bir ışıkla patlayarak görünür tüm düşmanları 3 tur boyunca sersemletir. Bir düşman zaten aydınlatılmışsa, Parlaklık aydınlatmanın ilave hasarını tetikler ve ardından aydınlatma zayıflatıcısını uygular. Işıltı ayrıca, mevcut zemin karanlıksa Rahibin 100 tur boyunca parlamasına neden olur.

actors.hero.spells.recallinscription.name=yazıtı tekrar et
actors.hero.spells.recallinscription.short_desc=Son kullanılan bir rün taşını veya parşömeni yineler.
actors.hero.spells.recallinscription.desc=Rahip, son %s turda kullandığı taş yazıtı veya parşömende bulunan sihirli bir rünün etkisini yeniden oluşturmak için kutsal büyü kullanır.\n\nYazıtı Tekrar Et, yükseltme parşömenlerinin çoğaltılması için kullanılamaz. Bu büyünün şarj maliyeti, son kullanılan öğeye göre değişir: taş yazıtı için 2, parşömen için 3, egzotik parşömen için ise 4 şarj maliyeti vardır. Ayrıca, dönüşüm parşömeni veya dönüşüm ya da yükseltme kullanılarak üretilmesi gereken simya eşyaları çoğaltıldığında, bu şarj maliyeti iki katına çıkar.
actors.hero.spells.recallinscription$useditemtracker.name=son kullanılan rün
actors.hero.spells.recallinscription$useditemtracker.desc=Ruhban kısa süre önce yazıtı tekrar et büyüsü ile çalışan bir eşya kullanmıştır. Ruhban eşyanın etkisini tekrarlamak için büyü yapabilir.\n\nKullanılan eşya: %1$s.\n\nKalan hamle sayısı: %2$s.

actors.hero.spells.shieldoflight.name=ışık kalkanı
actors.hero.spells.shieldoflight.short_desc=Bir hedefe karşı geçici zırh sağlar.
actors.hero.spells.shieldoflight.desc=Rahip kendisiyle bir düşman arasında ince bir ışık engeli oluşturarak zırhının o düşmana karşı engelleme gücünü 5 tur boyunca %1$d-%2$d oranında artırır.\n\nBu büyünün yapılması zaman almaz, ancak aynı anda birden fazla hedefe karşı kullanılamaz.
actors.hero.spells.shieldoflight$shieldoflighttracker.name=ışık kalkanı
actors.hero.spells.shieldoflight$shieldoflighttracker.desc=Bu karakter ile düşman arasında ince bir ışık kalkanı durur. Saldırıları tamamen engelleyecek kadar güçlü değildir, ancak onları yumuşatır.\n\nKalan hamle sayısı: %s

actors.hero.spells.spiritform.name=Ruh Formu
actors.hero.spells.spiritform.short_desc=Trinity'yi bir yüzüğe veya esere atar.
actors.hero.spells.spiritform.desc=Ruhban bu turda belirlediği bir yüzük ya da eseri seçer (kutsal kitap hariç) ve Trinity'ye onun etkisini yükler.\n\nEğer bir yüzük seçilirse, Trinity o yüzüğün etkisini 20 tur boyunca +%1$d olarak verir.\n\nEğer bir eser seçilirse, Trinity o eserin etkisini +%2$d olarak kopyalar. Her eserin Trinity ile kullanıldığında farklı özel davranışları ve zırh şarj maliyetleri vardır.\n\nBu büyü, Trinity'nin halihazırda sahip olduğu diğer tüm ruh etkilerinin yerini alır.
actors.hero.spells.spiritform$spiritformbuff.name=Ruh Formu
actors.hero.spells.spiritform$spiritformbuff.desc=Trinity'nin ruh biçimi şu anda size bir eşyanın gücünü, sanki o eşyayı kuşanmışsınız gibi veriyor.\n\nRuh biçiminin halihazırda yararlandığınız bir etkinin başka bir kopyasını sağlayamayacağını unutmayın.\n\nGeçerli Etki: %1$s.\n\nKalan hamle sayısı: %2$s.

actors.hero.spells.smite.name=Saldır
actors.hero.spells.smite.short_desc=İlave hasar ve büyü gücü ile isabeti garanti eder.
actors.hero.spells.smite.desc=Şövalye yakın dövüş saldırısına kutsal yıkıcı güç katar.\n\nNormal yakın dövüş hasarı vermenin yanı sıra, Kutsal Vuruş engellenmemiş saldırıların isabet etmesini garantiler, +%%300 büyü gücüne sahiptir ve %1$d - %2$d ilave büyü hasarı verir.\n\nKutsal Vuruş'un fazladan büyü hasarı Şövalye'nin seviyesiyle ölçeklenir ve ölümsüz veya şeytani düşmanlara karşı her zaman en yüksek fazladan büyü hasarı verir.

actors.hero.spells.stasis.name=Durgunluk
actors.hero.spells.stasis.short_desc=Dostunu zindandan kaldırır ve onu korur.
actors.hero.spells.stasis.desc=Ruhban, dostuyla olan bağlantısını kendisine odaklar ve dostunun geçici olarak Ruhban'ın içinde bir tür enerji durağanlığında tutulmasına neden olur. Dost, %d tura kadar korunur ve üzerindeki tüm olumlu etkiler durağanlıkta geçirdiği süreden etkilenmez.\n\nDurağanlık doğal olarak sona erdiğinde müttefik, Ruhban'ın yanında belirir ya da Ruhban, etkiyi erken sona erdirmek için bedeli olmadan büyüyü anında yeniden yapabilir. Durağanlık hareketsiz müttefikleri bile hareket ettirebilir, ancak onları katlar arasında aktaramaz.
actors.hero.spells.stasis$stasisbuff.name=Dostun durağan gözüküyor
actors.hero.spells.stasis$stasisbuff.left_behind=Hareketsiz müttefikiniz geride kaldı.
actors.hero.spells.stasis$stasisbuff.desc=Ruhbanın şu anda durağanlıkta saklanan bir müttefiki var. Çoğunluğun Gücü de dahil olmak üzere bu müttefik üzerindeki tüm olumlu etkiler korunur ve etki sona erdiğinde müttefik, Ruhbanın yanında yeniden belirir. Bu etki, Durağanlık yeniden kullanılarak erken de sona erdirilebilir.\n\nDurağanlıktaki Müttefik: %1$s.\nKalan Hamle Sayısı: %2$s.

actors.hero.spells.sunray.name=güneş ışını
actors.hero.spells.sunray.short_desc=Menzilli büyü hasarı verir ve hedefi bir kez kör eder.
actors.hero.spells.sunray.desc=Rahip, bir hedefe kör edici ışık ışını gönderir, %1$d-%2$d hasar verir ve onları %3$d tur boyunca kör eder. Güneş ışını büyüsü, her zaman ölüler ve şeytani hedeflere en ağır hasarı verir.\n\nBu büyüyle vurulan bir düşmanın görüşü ayarlanır ve bir daha kör edilmesini engeller. Ancak, bu büyüyle kör edilmişken tekrar vurulurlarsa, ışık o kadar güçlüdür ki onları felç eder.

actors.hero.spells.walloflight.name=Işık Duvarı
actors.hero.spells.walloflight.short_desc=Rakipleri engelleyen bir duvar oluşturur.
actors.hero.spells.walloflight.desc=Şövalye doğrudan kendi önünde 1 karo kalınlığında, %1$d karo genişliğinde ve 20 tur süren katı ışık panellerinden oluşan bir duvar oluşturur.\n\nBu duvar, içinden görülebilmesi dışında normal bir duvar gibi davranır. Oluşturulduğunda duvara yakalanan düşmanlar anlık olarak sersemletilir ve mümkünse geri itilir. Duvarın içinde sıkışan herhangi bir şey duvarın dışına çıkabilir.\n\nDuvar, dört ana veya dört çapraz yönden herhangi birinde oluşturulabilir. Bir duvar zaten aktifse, duvarı anında temizlemek için büyü bedelsiz olarak yeniden kullanılabilir.
actors.hero.spells.walloflight.early_end=Işık duvarını ortadan kaldırıyorsun.
actors.hero.spells.walloflight$lightwall.desc=Parıldayan ışık panelleri buradan geçişi engelliyor.

##main hero
actors.hero.hero.name=sen
actors.hero.hero.leave=Henüz gidemezsiniz, zindanın geri kalanı aşağıda sizi bekliyor!
actors.hero.hero.level_up=Seviye atladın!
actors.hero.hero.new_level=Seviye atladın! +İsabet, +Savuşturma, +5 SP!
actors.hero.hero.new_talent=+1 Yetenek Puanı!
actors.hero.hero.unspent=Harcanmamış yetenek puanlarınız var!
actors.hero.hero.level_cap=Daha güçlü olamıyorsun, ama deneyimlerin sana bir çeşit güç veriyor!
actors.hero.hero.you_now_have=%s, aldın.
actors.hero.hero.you_cant_have=%s eşyasını taşıyamazsın.
actors.hero.hero.locked_chest=Bu sandık kilitli ve kilide uyan anahtarın yok.
actors.hero.hero.locked_door=Eşleşen bir anahtarın yok.
actors.hero.hero.noticed_smth=Bir şey fark ettin.
actors.hero.hero.wait=...
actors.hero.hero.search=ara
actors.hero.hero.search_distracted=Konsantre olamıyorsun, arama yapmak yorucu oluyor.
actors.hero.hero.key_distracted=Kilit tam olarak açılmıyor, denemeye devam etmelisin.
actors.hero.hero.pain_resist=Acı, uyuma isteğini bastırıyor.
actors.hero.hero.revive=Ankh iyileştiren enerji ile patlıyor!

##classes
actors.hero.heroclass.warrior=savaşçı
actors.hero.heroclass.warrior_desc_short=Savaşçı, _kırık mühür_ tarafından sağlanan kalkan ile ilave hasara karşı dayanıklıdır. Mühür, zırhlar arasında taşınabilir ve _yalnızca bir yükseltmeyi taşınan zırha aktarır._
actors.hero.heroclass.warrior_desc=Savaşçı, canı yarının altına düştüğünde kalkan veren _kırık bir mühür_ ile başlar. Bu mühür zırhlar arasında taşınabilir ve _bir yükseltmeyi_ de yanında götürür.\n\nSavaşçı ayrıca oyuna, _eskimiş bir kısa kılıç_, _üç adet fırlatma taşı_, kumaş zırh, bir kırba ve kadife bir kese ile başlar.\n\nSavaşçı şu öğeleri otomatik olarak tanır:\n_-_ Tanımlama Parşömeni\n_-_ İyileştirme İksiri\n_-_ Öfke Parşömeni
actors.hero.heroclass.warrior_unlock=Savaşçı kendiliğinden açıldı.

actors.hero.heroclass.mage=büyücü
actors.hero.heroclass.mage_desc_short=Büyücü, bir büyü ustasıdır ve herhangi asadan daha güçlü _büyülü bir değneği_ vardır. Değnek, Büyücü tarafından bulunan _herhangi bir asa ile birleştirilebilir._
actors.hero.heroclass.mage_desc=Büyücü, asalardan daha hızlı şarj olan ve 1 şarj daha fazla tutan _eşsiz asa_ ile başlar. Asa, büyücünün zindanda bulduğu _herhangi bir asa ile işlenebilir_.\n\nBüyücü ayrıca asasına işlenmiş _büyülü mermi asası_, kumaş zırh, kırba ve kadife kese ile başlar\n\nBüyücü otomatikman şunları tanımlar:\n_-_ Tanımlama Parşömeni\n_-_ Sıvı Ateş İksiri\n_-_ Yükseltme Parşömeni
actors.hero.heroclass.mage_unlock=Büyücüyü açmak için _eşyayı güçlendiren yükseltme parşömenini kullan._

actors.hero.heroclass.rogue=haydut
actors.hero.heroclass.rogue_desc_short=Düzenbaz, _gölge pelerinini_ kullanarak düşmanlardan kaçabilir ve görünmezlikten saldırabilir. Ayrıca _sırları ve tuzakları_ daha uzak mesafeden tespit eder.
actors.hero.heroclass.rogue_desc=Düzenbaz, istediği zaman görünmez olmak için kullanabileceği _benzersiz bir Gölgeler Pelerini_ ile başlar.\n\nDüzenbaz _sırları ve tuzakları_ daha uzak mesafeden tespit edebilir.\n\nDüzenbaz ayrıca _hançer_, _üç fırlatma bıçağı_, kumaş zırh, kırba ve kadife bir kese ile başlar.-\n\nDüzenbaz otomatik olarak tanımlar:\n_-_ Tanımlama Parşömeni\n_-_ Görünmezlik İksiri\n_-_ Büyülü Haritalama Parşömeni
actors.hero.heroclass.rogue_unlock=Düzenbaz'ın kilidini açmak için _bir oyunda 10 sürpriz saldırı gerçekleştirin._

actors.hero.heroclass.huntress=avcı
actors.hero.heroclass.huntress_desc_short=Avcı, fırlatma silahlarında uzmandır ve sonsuz oklu bir _sihirli yay_a sahiptir. Aynı zamanda uzun çimleri _çiğnemeden geçer_.
actors.hero.heroclass.huntress_desc=Avcı, sonsuz sayıda sihirli ok atabilen _eşsiz ruh yayı_ ile başlar.\n\nAvcı, uzun çimenlerin arasında _onları çiğnemeden_ seyahat edebilir.\n\nAvcı ayrıca _çivili eldivenler_, kumaş zırh, kırba ve kadife kese ile başlar.\n\nAvcı otomatikman şunları tanımlar:\n_-_ Tanımlama Parşömeni\n_-_ Akıl Görüşü İksiri\n_-_ Ninni Parşömeni
actors.hero.heroclass.huntress_unlock=Avcı'yı açmak için _bir oyunda düşmanlara fırlatma silahı ile 15 kere vur._

actors.hero.heroclass.duelist=düellocu
actors.hero.heroclass.duelist_desc_short=Düellocu silahını kullanarak _özel silah yeteneğini_ tetikleyebilen bir silah ustasıdır. Bu özel yetenek _her silah için farklıdır._
actors.hero.heroclass.duelist_desc=Düellocu, zamanla şarj olan ve özel bir yeteneğe sahip _eşsiz meç_ ile başlar.\n\nOyundaki her silahın, Düellocu'nun kullanabileceği _farklı bir özel yeteneği_ vardır.\n\nDüellocu ayrıca _iki fırlatma iğnesi_, kumaş zırh, kırba ve kadife kese ile başlar.\n\nDüellocu otomatikman şunları tanımlar:\n_-_ Tanımlama Parşömeni\n_-_ Güç İksiri\n_-_ Ayna Görüntü Parşömeni
actors.hero.heroclass.duelist_unlock=Düellocu'yu açmak için _2. kademe veya daha yüksek bir silahı güç cezası olmadan kuşan._

actors.hero.heroclass.cleric=Ruhban
actors.hero.heroclass.cleric_desc_short=Ruhban, ilahi büyüyü yönlendirmek için benzersiz _kutsal kitabını_ kullanan ilahi bir büyücüdür. Yetenekler aracılığıyla büyüleri _öğrenebilir ve geliştirebilirler._
actors.hero.heroclass.cleric_desc=Ruhban, çeşitli büyüler yapmak için kullanabileceği _benzersiz bir kutsal kitapla_ başlar.\n\nRuhban'ın yeteneklerinin çoğu büyü öğrenmeye veya geliştirmeye odaklanmıştır.\n\nRuhban ayrıca _bir sopa_, kumaş zırh, bir su tulumu ve kadife bir kese ile başlar.\n\nRuhban otomatik olarak tanımlar:\n_-_ Tanımlama Parşömenleri\n_-_ Arınma İksirleri\n_-_ Laneti Kaldırma Parşömenleri
actors.hero.heroclass.cleric_unlock=Ruhbanın kilidini açmak için _herhangi bir lanetli ekipman üzerindeki laneti tamamen temizleyin._

actors.hero.herosubclass.berserker=çılgın savaşçı
actors.hero.herosubclass.berserker_short_desc=_Çılgın Savaşçı_ hasar aldıkça öfke biriktirir. Öfke, verdiği hasarı artırır ve yedek kalkan için %100 oranında etkinleştirilebilir.
actors.hero.herosubclass.berserker_desc=Çılgın Savaşçı, fiziksel hasar aldıkça öfke kazanır. Bu, zırhıyla engellenen hasarı da kapsar! Öfke zamanla yavaşça azalır; ancak canı azsa bu azalma daha da yavaş olur.\n\nÖfke, Çılgın Savaşçı’nın verdiği hasarı %50’ye kadar artırabilir. Öfke tamamen dolduğunda çılgına döner; anında kalkan kazanır ve bu kalkan sürdükçe öfkesini korur. Kalkan miktarı zırh seviyesine bağlıdır ve canı azsa büyük ölçüde artar. Çılgın Savaşçı, bu hâlden sonra bir süre toparlanma sürecine girer.
actors.hero.herosubclass.gladiator=gladyatör
actors.hero.herosubclass.gladiator_short_desc=_Gladyatör_ başarılı saldırılarıyla kombo oluşturur. Kombolarını eşsiz yetenekler kullanmak için harcayabilir.
actors.hero.herosubclass.gladiator_desc=Gladyatör, yakın dövüş veya fırlatılan bir silahla her başarılı saldırı yaptığında bir kombo puanı oluşturur. Gladyatör 5 tur içinde başarılı bir saldırı yapmazsa (bir öldürmeden sonra 15 tur), kombo sıfırlanır.\n\nKombo oluşturdukça Gladyatör, isabet etmesi garanti olan çeşitli yetenekler kullanabilir:\n2 Kombo: düşmanı geri savurur, kombo korunur\n4 Kombo: zırha dayalı hasar verir\n6 Kombo: savuşturur, kombo korunur\n8 Kombo: hedefe ve yakındaki düşmanlara hasar verir\n10 Kombo: her kombo için bir kez saldırır
actors.hero.herosubclass.battlemage=savaş büyücüsü
actors.hero.herosubclass.battlemage_short_desc=_Savaş Büyücüsü_ değneğiyle yakın dövüşte savaşırken bonus etkiler gerçekleştirir. Bu etkiler değneğin aşılandığı asaya bağlıdır.
actors.hero.herosubclass.battlemage_desc=Savaş Büyücüsü değneğiyle yakın dövüşte her vuruşunda, sanki değneğinde ek bir büyü varmış gibi ilave bir etki kazanır. Bu etkiler, değneğinin aşılandığı asaya bağlıdır; her asanın kendi etkisi vardır. Asa etkilerine ek olarak, Savaş Büyücüsü'nün değneği, onunla vurduğunda 0,5 şarj da kazanır.
actors.hero.herosubclass.warlock=sihirbaz
actors.hero.herosubclass.warlock_short_desc=_Sihirbaz_'ın asalarıyla düşmanları ruhla işaretleme şansı vardır. İşaretli düşmanlara fiziksel hasar verdiğinde iyileşir.
actors.hero.herosubclass.warlock_desc=Kara Büyücü, karakterler üzerinde asa kullandığında onlara bir ruh işareti uygulama şansına sahiptir. Ruh işareti uygulama şansı ve süresi asa seviyesi ile artar.\n\nBir düşman ruhla işaretlendiğinde, Kara Büyücü ona verdiği her 5 hasar için 2 can iyileştirir, ancak sadece yakın dövüş veya fırlatılan silahlarla yapılan saldırılarda, asalarla yapılan saldırılarda değil!
actors.hero.herosubclass.assassin=suikastçı
actors.hero.herosubclass.assassin_short_desc=_Suikastçı_ görünmezken ölümcül bir saldırı hazırlayabilir. Ne kadar uzun süre beklerse, saldırısı o kadar güçlü olur.
actors.hero.herosubclass.assassin_desc=Suikastçı görünmez olduğunda bir sonraki saldırısına hazırlanır. Ne kadar uzun süre hazırlanırsa, bir sonraki saldırısı o kadar güçlü olur. Hazırlık 9 tura kadar devam eder.\n\nHazırlandıktan sonra Suikastçı bir sonraki saldırısında ilave hasar verir, hedefine göz kırpabilir ve hatta yeterince zayıf olan düşmanları anında öldürebilir.
actors.hero.herosubclass.freerunner=parkurcu
actors.hero.herosubclass.freerunner_short_desc=_Parkurcu_ koştukça parkur yapmak için kullanabileceği momentum kazanır. Parkur ona bir süre için fazladan hız ve kaçınma sağlar.
actors.hero.herosubclass.freerunner_desc=Parkurcu hareket ettikçe momentum yığınları oluşturur. 10 tur koştuktan sonra 10'a kadar momentum kazanabilir, ancak hareket etmeyi bırakırsa bunu hızla kaybeder. Parkurcu momentumunu serbest koşuya başlamak için kullanabilir, momentum puanı başına 2 tur.\n\nParkurcu serbest koşarken 2 kat hızla hareket eder ve seviyesiyle orantılı olarak bonus kaçınma kazanır. Serbest  koşu sona erdiğinde, momentumun yeniden inşa edilebilmesi için bir bekleme süresi vardır.
actors.hero.herosubclass.sniper=keskin nişancı
actors.hero.herosubclass.sniper_short_desc=_Keskin Nişancı_, menzilli saldırılarıyla zırhları delebilir. Fırlatılan bir silahla vurduktan sonra, yayından özel bir saldırı gerçekleştirebilir.
actors.hero.herosubclass.sniper_desc=Keskin Nişancı, menzilli saldırıları düşman zırhını delen bir menzilli savaş ustasıdır. Bir düşmana fırlatılan bir silahla saldırdığında, üzerine bir keskin nişancı işareti yerleştirir ve bu da yayından özel bir saldırı ile takip etmesini sağlar. Bu özel saldırı, yayının nasıl güçlendirildiğine bağlı olarak değişir.\n\n\nGüçlendirilmemiş bir yay, daha az hasar veren ancak anında ateş eden bir anlık atış yapar. Bir hız yayı, azaltılmış hasar veren, yine de büyüleri etkinleştirebilen ve ateşlemesi 1 tur süren üç okluk bir yaylım ateşi açar. Hasar yayı, isabet etmesi garanti olan, mesafeye bağlı olarak ilave hasar veren ve ateş etmesi 2 tur süren bir keskin nişancı atışı yapar.
actors.hero.herosubclass.warden=gardiyan
actors.hero.herosubclass.warden_short_desc=Uzun çimler _Gardiyan_'ın görüşünü engellemez ve _Gardiyan_ tohum ekerken ve bitki ezerken fazladan etkiler kazanır.
actors.hero.herosubclass.warden_desc=Gardiyan'ın doğayla güçlü bir bağı vardır ve bu da ona çimen ve bitkilerle ilgili çeşitli bonus etkiler kazandırır. Uzun ve karık çimenleri sanki boş bir alanmış gibi görebilir.\n\nGardiyan attığı veya ektiği tohumların etrafında çimlerin filizlenmesine neden olur ve bitkileri çiğnerken özel etkiler kazanır. Bu özel efektler normal bitki efektlerinin yerini alır, yani hiçbir bitkinin üzerine basması onun için zararlı değildir.
actors.hero.herosubclass.champion=Şampiyon
actors.hero.herosubclass.champion_short_desc=_Şampiyon_ iki silah kullanabilir ve daha fazla silah şarjı alır. Normal saldırılarında birincil silahını kullanır, ancak silah değiştirebilir ve her iki silahın da yeteneğini kullanabilir.
actors.hero.herosubclass.champion_desc=Şampiyon, birincil silahına ek olarak ikincil bir silah da kuşanabilen bir yakın dövüş silahları ustasıdır. Normal saldırılarında birincil silahını kullanır, ancak birincil silahını anında değiştirebilir ve her iki silahın da yeteneğini kullanabilir.\n\nAyrıca 2 adet daha fazla azami silah yeteneği şarjı ve +%50 silah yeteneği şarj hızı kazanır.
actors.hero.herosubclass.monk=Keşiş
actors.hero.herosubclass.monk_short_desc=_Keşiş_ dövüşürken enerji biriktirir. Bu enerji çeşitli benzersiz yetenekler için harcanabilir.
actors.hero.herosubclass.monk_desc=Keşiş bir fiziksel teknik ustasıdır. Düşman yendikçe, çeşitli savunma ve fayda odaklı yeteneklerde kullanabileceği enerji kazanır. Bu enerji zamanla azalmaz, ancak Keşiş'in seviyesine bağlı olarak bir sınırı vardır.\n\n1 Enerji: yumruklarla hızlıca saldır\n2 Enerji: bir sonraki saldırıdan kaçmak için odaklan\n3 Enerji: anında yakına atıl\n4 Enerji: düşmanı tekmeleyerek uzaklaştır\n5 Enerji: durumları temizlemek ve asa & eser yükünü yenilemek için meditasyon yap
actors.hero.herosubclass.priest=rahip
actors.hero.herosubclass.priest_short_desc=_Rahip_ yeni uzun menzilli büyüler ve kılavuz ışığın güçlendirilmiş bir sürümünü kazanır.
actors.hero.herosubclass.priest_desc=Rahip, menzilli savaşı ve büyülü eşyalarla sinerjiyi vurgulayan çeşitli yeni ve yükseltilmiş büyüler kazanır.\n\nRahip her 50 turda bir ücretsiz olarak _Kılavuz Işık_ büyüsünü yapabilir, herhangi bir büyüsünün doğrudan hedef aldığı düşmanları aydınlatabilir ve aydınlatma zayıflatıcısını müttefikleri, asaları ve bazı eserlerle seviye + 5'e eşit fazladan hasar için kullanabilir.\n\nRahip ayrıca karanlığı dağıtan ve görünen tüm düşmanları etkileyen _Işıltı_ büyüsünü kazanır ve 2 şarj karşılığında onları aydınlatır ve kısa süreliğine sersemletir.
actors.hero.herosubclass.paladin=şövalye
actors.hero.herosubclass.paladin_short_desc=_Şövalye_, yeni kısa menzilli büyüler ve kutsal silah ile koruma büyülerinin güçlendirilmiş versiyonlarını kazanır.
actors.hero.herosubclass.paladin_desc=Şövalye, yakın dövüşü ve silah ile zırhlarla sinerjiyi vurgulayan çeşitli yeni ve geliştirilmiş büyüler kazanır.\n\nŞövalyenin _Kutsal Silah_ ve _Kutsal Koruma_ büyüleri daha büyük bonuslar verir, artık mevcut büyüleri ve sembolleri geçersiz kılmaz ve başka büyüler yaparak genişletilebilir.\n\nŞövalye ayrıca, ilave hasar ve büyü gücüyle garantili bir yakın dövüş vuruşu yapmalarını sağlayan _ Kutsal Vuruş_ büyüsünü de kazanır.

##talents
actors.hero.talent$provokedangertracker.name=kışkırtılmış öfke
actors.hero.talent$provokedangertracker.desc=Savaşçı kısa süre önce kalkanını kaybetti, bir sonraki fiziksel saldırısı ilave hasar verecek.\n\nKalan hamle sayısı: %s.
actors.hero.talent$lingeringmagictracker.name=kalıcı büyü
actors.hero.talent$lingeringmagictracker.desc=Büyücü yakın zamanda bir asa veya değnek kullandıysa, bir sonraki fiziksel saldırısı ilave hasar verir.\n\nKalan turlar: %s.
actors.hero.talent$followupstriketracker.name=Ardışık Saldırı
actors.hero.talent$followupstriketracker.desc=Avcı kısa süre önce bir düşmana fırlatılan bir silahla saldırdı, aynı hedefe karşı yapacağı bir sonraki yakın dövüş saldırısının hasarı artar.\n\nKalan tur sayısı: %s.
actors.hero.talent$patientstriketracker.name=Sabır Vuruşu
actors.hero.talent$patientstriketracker.desc=Düellocu bir turunu bekleyerek geçirdi, bir sonraki yakın dövüş saldırısı ilave hasar verecek.
actors.hero.talent$improvisedprojectilecooldown.name=Göz kararı bekleme süresi
actors.hero.talent$improvisedprojectilecooldown.desc=Yakın zamanda bu yeteneği kullandın ve yeniden kullanmak için beklemen lazım.\n\nKalan tur: %s
actors.hero.talent$rejuvenatingstepscooldown.name=Yetiştiren adımlar bekleme süresi
actors.hero.talent$rejuvenatingstepscooldown.desc=Yakın zamanda bu kabiliyeti kullandın ve yeniden kullanmak için beklemen lazım.\n\nKalan turlar: %s
actors.hero.talent$seershotcooldown.name=gören atış beklemede
actors.hero.talent$seershotcooldown.desc=Yakın zamanda bu kabiliyeti kullandın ve yeniden kullanmak için beklemen lazım.\n\nKalan turlar: %s
actors.hero.talent$aggressivebarriercooldown.name=agresif bariyer bekleme süresi
actors.hero.talent$aggressivebarriercooldown.desc=Yakın zamanda bu kabiliyeti kullandın ve yeniden kullanmak için beklemen lazım.\n\nKalan turlar: %s
actors.hero.talent$liquidagilacctracker.name=Sıvı Çevikliği
actors.hero.talent$liquidagilacctracker.desc=Düellocunun bir sonraki normal yakın dövüş saldırısı ilave isabet kazanır.\n\nKalan tur sayısı: %s.
actors.hero.talent$lethalhastecooldown.name=ölümcül acele bekleme süresi
actors.hero.talent$lethalhastecooldown.desc=Yakın zamanda bu kabiliyeti kullandın ve yeniden kullanmak için beklemen lazım.\n\nKalan tur: %s
actors.hero.talent$swiftequipcooldown.name=el çabukluğu bekleme süresi
actors.hero.talent$swiftequipcooldown.desc=Yakın zamanda bu kabiliyeti kullandın ve yeniden kullanmak için beklemen lazım.\n\nKalan turlar: %s
actors.hero.talent$preciseassaulttracker.name=Kesin Saldırı
actors.hero.talent$preciseassaulttracker.desc=Düellocunun bir sonraki normal yakın dövüş saldırısı ilave isabet kazanır.\n\nKalan tur sayısı: %s.
actors.hero.talent$deadlyfollowuptracker.name=ölümcül takip
actors.hero.talent$deadlyfollowuptracker.desc=Düellocu kısa süre önce bir düşmana fırlatılan bir silahla saldırdı, aynı hedefe karşı yakın dövüş saldırıları artırılmış hasara sahip olacak.\n\nKalan tur sayısı: %s.
actors.hero.talent$combinedlethalityabilitytracker.executed=infaz edildi
actors.hero.talent$satiatedspellstracker.name=Kalkanlama Büyüsü
actors.hero.talent$satiatedspellstracker.desc=Ruhban'ın yapacağı bir sonraki büyü ona küçük bir miktar kalkan sağlar.
actors.hero.talent$searinglightcooldown.name=Yakan Işık
actors.hero.talent$searinglightcooldown.desc=Yakın zamanda bu kabiliyeti kullandın ve yeniden kullanmak için beklemen lazım.\n\nKalan turlar: %s

#warrior
actors.hero.talent.hearty_meal.title=Doyurucu Yemek
actors.hero.talent.hearty_meal.desc=_+1:_ Yemek yemek, Savaşçı'nın canı %33 veya altındayken onu _4 HP_ iyileştirir.\n\n_+2:_ Yemek yemek, Savaşçı'nın canı %33 veya altındayken onu _6 HP_ iyileştirir.
actors.hero.talent.veterans_intuition.title=Gazi'nin Sezgileri
actors.hero.talent.veterans_intuition.desc=_+1:_ Savaşçı silahları _1,75 kat_ ve zırhları _2,5 kat daha hızlı_ tanımlar.\n\n_+2_: Savaşçı silahları _2,5 kat daha hızlı_ tanır ve zırhı _kuşandığında zırhı da tanır_.
actors.hero.talent.provoked_anger.title=kışkırtılmış öfke
actors.hero.talent.provoked_anger.desc=_+1:_ Savaşçıya uygulanan herhangi bir kalkan güçlendirmesi hasarla kırıldığında, bir sonraki fiziksel saldırısı _3 ekstra hasar_ verir.\n\n_+2:_ Savaşçıya uygulanan herhangi bir kalkan güçlendirmesi hasarla kırıldığında, bir sonraki fiziksel saldırısı _5 ekstra hasar_ verir.
actors.hero.talent.iron_will.title=Demir İrade
actors.hero.talent.iron_will.desc=_+1:_ Savaşçının mührünün sağladığı kalkan _1 artar_.\n\n_+2:_ Savaşçının mührünün sağladığı kalkan _2 artar_.
actors.hero.talent.iron_will.meta_desc=_Bu yetenek farklı bir kahraman tarafından kazanılırsa_ pasif olarak Savaşçı'nın kırık mühür etkisinin 1 veya 2 en yüksek kalkan versiyonunu verir.

actors.hero.talent.iron_stomach.title=Demir Mide
actors.hero.talent.iron_stomach.desc=_+1:_ Savaşçının yemek yemesi 1 tur sürer ve yerken ona _%75 hasar direnci_ kazandırır.\n\n_+2:_ Savaşçının yemek yemesi 1 tur sürer ve yerken ona _%100 hasar direnci_ kazandırır.
actors.hero.talent.liquid_willpower.title=Sıvı İrade Gücü
actors.hero.talent.liquid_willpower.desc=_+1:_ Savaşçı, bir iksir, karışım veya öz içtiğinde ya da fırlattığında, maksimum canının _%6,5’i kadar kalkan_ kazanır.\n\n_+2:_ Savaşçı, bir iksir, karışım veya öz içtiğinde ya da fırlattığında, maksimum canının _%10’u kadar kalkan_ kazanır.\n\nGüç, deneyim iksirleri veya bu iksirlerle üretilen simya eşyaları kullanıldığında,kalkan miktarı iki katına çıkar.\n\nDaha fazla sayıda üretilen simya eşyaları (örneğin: su karışımı) için,bu yetenek, üretilen eşya miktarına bağlı olarak rastgele tetiklenebilir.
actors.hero.talent.runic_transference.title=rünik aktarım
actors.hero.talent.runic_transference.desc=_+1:_ Savaşçının kırık mührü, _sıradan glifleri_ bir yükseltmeyi aktardığı şekilde aktarabilir.\n\n_+2:_  Savaşçının kırık mührü _sıradan, güçlü ve lanetli glifleri_ bir yükseltmeyi aktardığı şekilde aktarabilir.\n\nMühür, glifleri yalnızca mühür takıldığında zırha uygulanmışlarsa aktarabilir.
actors.hero.talent.runic_transference.meta_desc=_Eğer bu yetenek farklı bir kahraman tarafından kazanılırsa_, bunun yerine zırhındaki gliflerin yükseltme parşömenleriyle kaldırılmaya karşı direnmesine yardımcı olur. Glifler, +1 seviyesinde 6. seviyeden (önceden 4), veya +2 seviyesinde 7. seviyeden (önceden 4) yükseltme yaparken kaybolmaya başlar. Gliflerin kesinlikle kaybolduğu seviye ise +8 olarak değişmemiştir.
actors.hero.talent.lethal_momentum.title=Ölümcül Momentum
actors.hero.talent.lethal_momentum.desc=_+1:_ Savaşçı fiziksel bir silahla bir düşmana ölüm darbesi indirdiğinde _%67 şans_ ile 0 tur alır.\n\n_+2:_ Savaşçı fiziksel bir silahla bir düşmana ölüm darbesi indirdiğinde _%100 şans_ ile 0 tur alır.
actors.hero.talent.improvised_projectiles.title=Göz Kararı
actors.hero.talent.improvised_projectiles.desc=_+1:_ Savaşçı normalde fırlatma silahı olarak kullanılmayan bir eşyayı bir düşmana fırlatarak _2 tur_ kör edebilir. 50 tur bekleme süresi vardır\n\n_+2:_ Savaşçı normalde fırlatma silahı olarak kullanılmayan bir eşyayı bir düşmana fırlatarak _3 tur_ kör edebilir. 50 tur bekleme süresi vardır.

actors.hero.talent.hold_fast.title=Dayan
actors.hero.talent.hold_fast.desc=_+1:_ Savaşçı beklediğinde _1-2 zırh_ kazanır ve hareket edene kadar kombo ve kalkan güçlendirmelerinin azalmasını _%50_ yavaşlatır.\n\n_+2:_ Savaşçı beklediğinde _2-4 zırh_ kazanır ve hareket edene kadar kombo ve kalkan güçlendirmelerinin azalmasını _%75_ yavaşlatır.\n\n_+3:_ Savaşçı beklediğinde _3-6 zırh_ kazanır ve hareket edene kadar kombo ve kalkan güçlendirmelerinin azalmasını %_100_ yavaşlatır.
actors.hero.talent.strongman.title=Güçlü Adam
actors.hero.talent.strongman.desc=_+1:_ Savaşçının gücü _%8 artar_ sayı aşağı doğru yuvarlanır.\n\n_+2:_ Savaşçının gücü _%13 artar_ sayı aşağı doğru yuvarlanır.\n\n_+3:_Savaşçının gücü _%18 artar_ sayı aşağı doğru yuvarlanır.

actors.hero.talent.endless_rage.title=Bitmeyen Hiddet
actors.hero.talent.endless_rage.desc=_+1:_ Çılgın Savaşçı, maksimum _116% öfke_ değerine ulaşabilir.  \n\n_+2:_ Çılgın Savaşçı, maksimum _%133 öfke_ değerine ulaşabilir.  \n\n_+3:_ Çılgın Savaşçı, maksimum _%150 öfke_ değerine ulaşabilir.  \n\n%100'ün üzerindeki her öfke kalkanı %1 arttırır ve bekleme süresini %1 azaltır, ama hasar bonusunu +50%'nin üzerinde arttırmaz.
actors.hero.talent.deathless_fury.title=Cinnet Kuvveti
actors.hero.talent.deathless_fury.desc=_+1:_ Çılgın Savaşçı'nın öfkesi ölmek üzere ise ve öfkesi 100% üzerinde ise kendiliğinden aktifleşir. ama _3 kahraman seviyesi_ kadar bekleme süresi vardır.\n\n_+2:_ Çılgın Savaşçı'nın öfkesi ölmek üzere ise ve öfkesi 100% üzerinde ise kendiliğinden aktifleşir. ama _2 kahraman seviyesi_ kadar bekleme süresi vardır.\n\n_+3:_ Çılgın Savaşçı'nın öfkesi ölmek üzere ise ve öfkesi 100% üzerinde ise kendiliğinden aktifleşir. ama _1 kahraman seviyesi_ kadar bekleme süresi vardır.\n\nUnutmayın ki Çılgın Savaşçının öfkelenmesi bittiğinde hala 0 canı varsa yine de ölecektir.
actors.hero.talent.enraged_catalyst.title=Öfkeli Katalizör
actors.hero.talent.enraged_catalyst.desc=_+1:_ Çılgın Savaşçı’nın silahındaki büyüler ve lanetler, sahip olduğu öfke arttıkça daha sık tetiklenir. %100 öfkeye ulaşıldığında _en fazla %15 daha sık_ tetiklenirler.\n\n_+2:_ Çılgın Savaşçı’nın silahındaki büyüler ve lanetler, sahip olduğu öfke arttıkça daha sık tetiklenir. %100 öfkeye ulaşıldığında _en fazla %30 daha sık_ tetiklenirler.\n\n_+3:_ Çılgın Savaşçı’nın silahındaki büyüler ve lanetler, sahip olduğu öfke arttıkça daha sık tetiklenir. %100 öfkeye ulaşıldığında _en fazla %45 daha sık_ tetiklenirler.

actors.hero.talent.cleave.title=Yar
actors.hero.talent.cleave.desc=_+1:_ Gladyatörün bir öldürme için kazandığı fazladan süre 15'ten _30 tura_ çıkarıldı.\n\n_+2:_ Gladyatörün bir öldürme için kazandığı fazladan süre 15'ten _45 tura_ çıkarıldı.\n\n_+3:_ Gladyatörün bir öldürme için kazandığı fazladan süre 15'ten _60 tura_ çıkarıldı.
actors.hero.talent.lethal_defense.title=Ölümcül Savunma
actors.hero.talent.lethal_defense.desc=_+1:_ Gladyatör bir düşmanı kombo hareketiyle öldürdüğünde, kırık mühür kalkanının bekleme süresi _50 tur azalır_.\n\n_+2:_ Gladyatör bir düşmanı kombo hareketiyle öldürdüğünde, kırık mühür kalkanının bekleme süresi _100 tur azalır_.\n\n_+3:_ Gladyatör bir düşmanı kombo hareketiyle öldürdüğünde, kırık mühür kalkanının bekleme süresi _150 tur azalır_.\n\nBu yetenek sayesinde kalkan bekleme süresi en az -150 tura kadar düşürülebilir, yani aktifleştirildiği anda tekrar kullanılabilir hale gelir.
actors.hero.talent.enhanced_combo.title=Geliştirilmiş Kombo
actors.hero.talent.enhanced_combo.desc=_+1:_ Gladyatörün kombosu 7 veya daha yüksek olduğunda, Darbe kombosunun geri itme aralığı 3'e çıkar, baş dönmesine neden olur ve düşmanları uçurumlara fırlatabilir.\n\n_+2:_ +1'in faydalarına ek olarak, Gladyatörün kombosu 9 veya daha yüksek olduğunda Savuşturma kombosu birden fazla saldırı üzerinde çalışır.\n\n_+3:_ +1 ve +2'nin faydalarına ek olarak, Gladyatör; Çarp, Parçala veya Öfke kullanırken kombo/3 karoya kadar atılabilir.

actors.hero.talent.body_slam.title=Vücut Çarpması
actors.hero.talent.body_slam.desc=_+1:_ Savaşçı zıpladıktan sonra yere indiğinde, bitişik tüm düşmanlar _1-4 hasara ek olarak engelleme gücünün %25'i kadar_ hasar alır.\n\n_+2:_ Savaşçı zıpladıktan sonra yere indiğinde, bitişik tüm düşmanlar _2-8 hasara ek olarak engelleme gücünün %50'si kadar_ hasar alır.\n\n_+3:_ Savaşçı zıpladıktan sonra yere indiğinde, bitişik tüm düşmanlar _3-12 hasara ek olarak engelleme gücünün %75'i kadar_ hasar alır.\n\n_+4:_ Savaşçı zıpladıktan sonra yere indiğinde, bitişik tüm düşmanlar _4-16 hasara ek olarak engelleme gücünün %100'ü kadar_ hasar alır.
actors.hero.talent.impact_wave.title=Darbe Dalgası
actors.hero.talent.impact_wave.desc=_+1:_ Savaşçı zıpladıktan sonra yere indiğinde, bitişik tüm düşmanlar _2 kare_ geri itilir ve 5 tur boyunca _%25 şansla_ savunmasız hale gelir.\n\n_+2:_ Savaşçı zıpladıktan sonra yere indiğinde, bitişik tüm düşmanlar _3 kare_ geri itilir ve 5 tur boyunca _%50 şansla_ savunmasız hale gelir.\n\n_+3:_ Savaşçı zıpladıktan sonra yere indiğinde, bitişik tüm düşmanlar _4 kare_ geri itilir ve 5 tur boyunca _%75 şansla_ savunmasız hale gelir.\n\n_+4:_ Savaşçı zıpladıktan sonra yere indiğinde, bitişik tüm düşmanlar _5 kare_ geri itilir ve 5 tur boyunca _%100 şansla_ savunmasız hale gelir.
actors.hero.talent.double_jump.title=Çekirge
actors.hero.talent.double_jump.desc=_+1:_ Savaşçı 3 tur içinde ikinci bir sıçrama gerçekleştirirse, bu sıçramanın şarj bedeli _%16 azalır_.\n\n_+2:_ Savaşçı 3 tur içinde ikinci bir sıçrama gerçekleştirirse, bu sıçramanın şarj bedeli _%30 azalır_.\n\n_+3:_ Savaşçı 3 tur içinde ikinci bir sıçrama gerçekleştirirse, bu sıçramanın şarj bedeli _%40 azalır_.\n\n_+4:_ Savaşçı 3 tur içinde ikinci bir sıçrama gerçekleştirirse, bu sıçramanın şarj bedeli _%50 azalır_.

actors.hero.talent.expanding_wave.title=Genişleyen Dalga
actors.hero.talent.expanding_wave.desc=_+1:_ Şok dalgasının menzili 5'ten _6 kareye_, genişliği ise 60'tan _75 dereceye_ yükseltildi.\n\n_+2:_ Şok dalgasının menzili 5'ten _7 karoya_ yükseltildi ve genişliği 60'tan _90 dereceye_ yükseltildi.\n\n_+3:_ Şok dalgasının menzili 5'ten _8 kareye_ yükseltildi ve genişliği 60'tan _105 dereceye_ yükseltildi.\n\n_+4:_ Şok dalgasının menzili 5'ten _9 kareye_ yükseltildi ve genişliği 60'tan _120 dereceye_ yükseltildi.
actors.hero.talent.striking_wave.title=Çarpıcı Dalga
actors.hero.talent.striking_wave.desc=_+1:_ Şok Dalgası'nın büyü ve kombinasyon gibi vuruş etkilerini de kullanma _şansı %30_'dur.\n\n_+2:_ Şok Dalgası'nın büyü ve kombinasyon gibi vuruş etkilerini de kullanma _şansı %60_'dur.\n\n_+3:_ Şok Dalgası'nın büyü ve kombinasyon gibi vuruş etkilerini de kullanma _şansı %90_'dur.\n\n_+4:_ Şok Dalgası'nın büyü ve kombinasyon gibi vuruş etkilerini de kullanma _şansı %100_'dur. ve büyülere _+%20 güç_ verir.
actors.hero.talent.shock_force.title=Şok Kuvveti
actors.hero.talent.shock_force.desc=_+1:_ Şok Dalgası _%20 daha fazla hasar_ verir ve sakatlanmak yerine sersemletme için _%25 şansa_ sahiptir.\n\n_+2:_ Şok Dalgası _%40 daha fazla hasar_ verir ve sakat bırakmak yerine sersemletme için _%50 şansa_ sahiptir.\n\n_+3:_ Şok Dalgası _60% daha fazla hasar_ verir ve sakatlanmak yerine sersemletme için _%75 şansa_ sahiptir.\n\n_+4:_ Şok Dalgası _%80 daha fazla hasar_ verir ve sakat bırakmak yerine sersemletme için _%100 şansa_ sahiptir.

actors.hero.talent.sustained_retribution.title=Sürekli Ceza
actors.hero.talent.sustained_retribution.desc=_+1:_ Savaşçı, 1 vuruşta %100 ilave hasar yerine, _2 vuruşa_ yayılan _%115 ilave hasar_ verir.\n\n_+2:_ Savaşçı, 1 vuruşta %100 ilave hasar yerine _3 vuruşa_ yayılan _%130 ilave hasar_ verir.\n\n_+3:_ Savaşçı, 1 vuruşta %100 ilave hasar yerine, _4 vuruşa_ yayılan _%145 ilave hasar_ verir.\n\n_+4:_ Savaşçı, 1 vuruşta %100 ilave hasar yerine, _5 vuruşa_ yayılan _%160 ilave hasar_ verir.
actors.hero.talent.shrug_it_off.title=Omuz Silkme
actors.hero.talent.shrug_it_off.desc=_+1:_ Savaşçının dayanıklılık sırasındaki hasar azaltma oranı %50'den _%60_'a yükseltilir.\n\n_+2:_ Savaşçının dayanıklılık sırasındaki hasar azaltma oranı %50'den _%68_'e yükseltilir.\n\n_+3:_ Savaşçının dayanıklılık sırasındaki hasar azaltma oranı %50'den _%74_'e yükseltilir.\n\n_+4:_ Savaşçının dayanıklılık sırasındaki hasar azaltma oranı %50'den _%80_'e yükseltilir.
actors.hero.talent.even_the_odds.title=İhtimaller Bile
actors.hero.talent.even_the_odds.desc=_+1:_ Savaşçı, dayanıklılık sona erdiğinde 2 karo içindeki her düşman için ek _%5 bonus hasar_ verir.\n\n_+2:_ Savaşçı, dayanıklılık sona erdiğinde 2 karo içindeki her düşman için ek _1%10 ilave hasar_ verir.\n\n_+3:_ Savaşçı, dayanıklılık sona erdiğinde 2 karo içindeki her düşman için ek _1%15 bonus hasar_ verir.\n\n_+4:_ Savaşçı, dayanıklılık sona erdiğinde 2 karo içindeki her düşman için _%20 ilave hasar_ verir.

#mage
actors.hero.talent.empowering_meal.title=Güçlendiren Yemek
actors.hero.talent.empowering_meal.desc=_+1:_ Yemek yemek, Büyücünün asasıyla yaptığı sıradaki 3 saldırısına _2 ilave hasar_ verir.\n\n_+2:_ Yemek yemek, Büyücünün asasıyla yaptığı sıradaki 3 saldırısına _3 ilave hasar_ verir.
actors.hero.talent.scholars_intuition.title=Âlimin Sezgisi
actors.hero.talent.scholars_intuition.desc=_+1:_  Büyücü asaları _3x daha hızlı_ tanımlar.\n\n_+2:_ Büyücü asaları _kullandığı anda_ tanımlar.
actors.hero.talent.lingering_magic.title=kalıcı büyü
actors.hero.talent.lingering_magic.desc=_+1:_ Büyücü bir değnek veya asa ile saldırdığında, bir sonraki fiziksel saldırısı _1-2 ilave hasar_ verir.\n\n_+2:_ Büyücü bir değnek veya asa ile saldırdığında, bir sonraki fiziksel saldırısı _2 ilave hasar_ verir.
actors.hero.talent.backup_barrier.title=Yedek Bariyer
actors.hero.talent.backup_barrier.desc=_+1:_ Büyücü, değneğinin son şarjını her harcadığında _3 kalkan_ kazanır.\n\n_+2:_ Büyücü, değneğinin son şarjını her harcadığında _5 kalkan_ kazanır.
actors.hero.talent.backup_barrier.meta_desc=_Bu yetenek farklı bir kahraman tarafından kazanılırsa_ bunun yerine kahramanın en yüksek seviyeli asasından tetiklenir.

actors.hero.talent.energizing_meal.title=Enerji Veren Yemek
actors.hero.talent.energizing_meal.desc=_+1:_ Büyücünün yemek yemesi 1 tur sürer ve ona _5 tur asa reşarjı_ verir.\n\n_+2:_ Büyücünün yemek yemesi 1 tur sürer ve ona _8 tur asa reşarjı_ verir.
actors.hero.talent.inscribed_power.title=Yazılı Güç
actors.hero.talent.inscribed_power.desc=_+1:_ Büyücü bir parşömen okuduğunda veya bir büyü öğesi kullandığında, sonraki 2 asa vuruşu +2 seviye alır.\n\n_+2:_ Büyücü bir parşömen okuduğunda veya bir büyü öğesi kullandığında, sonraki 3 asa vuruşu +2 seviye alır.\n\nBu parşömenler kullanılarak işlenmesi gereken yükseltme, dönüştürme veya simya öğelerinin bir parşömeni kullanıldığında, geliştirilmiş asa saldırılarının sayısı iki katına çıkar. \n\nDaha yüksek çıktı miktarlarına sahip simya öğeleri için (örneğin çoğu büyü), bu yeteneğin, o öğenin kaç tanesinin üretildiğine bağlı olarak tetiklenme şansı vardır.
actors.hero.talent.wand_preservation.title=Asa Koruma
actors.hero.talent.wand_preservation.desc=_+1:_ Büyücü asasına yeni bir asa aşıladığında, eski asa +0 olarak geri döner, _ancak bu yalnızca bir kez yapılabilir._\n\n_+2:_ Büyücü asasına yeni bir asa aşıladığında, eski asa +0 olarak geri döner, _bu bir kahraman seviyesi bekleme süresiyle tekrarlanabilir._
actors.hero.talent.wand_preservation.meta_desc=_Bu yetenek farklı bir kahraman tarafından kazanılırsa_ bunun yerine, bir simya kabına bir asa koyarken kazanılan gizemli reçine miktarını +1'de 1 veya +2'de 2 artırır.
actors.hero.talent.arcane_vision.title=Sihirli Görüş
actors.hero.talent.arcane_vision.desc=_+1:_ Büyücü bir düşmana asasıyla saldırdığında, o düşman üzerine _10 tur_ akıl görüşü kazanır.\n\n_+2:_ Büyücü bir düşmana asasıyla saldırdığında, o düşman üzerine _15 tur_ akıl görüşü kazanır.
actors.hero.talent.shield_battery.title=Batarya Kalkanı
actors.hero.talent.shield_battery.desc=_+1:_ Büyücü asası ile kendini hedef alarak asasının şarjını şarj başına azami canının _4%'ü oranında kalkan oluşturur_.\n\n_+2:_ üyücü asası ile kendini hedef alarak asasının şarjını şarj başına azami canının _6%'sı oranında kalkan oluşturur_.

actors.hero.talent.desperate_power.title=Çaresiz Güç
actors.hero.talent.desperate_power.desc=_+1:_ Büyücünün asa ve değnekleri, son şarjları bittiğinde son vuruşlarında _+1 seviye_ kazanır.\n\n_+2:_ Büyücünün asa ve değnekleri, son şarjları bittiğinde son vuruşlarında _+2 seviye_ kazanır.\n\n_+3:_ Büyücünün asa ve değnekleri, son şarjları bittiğinde son vuruşlarında _+3 seviye_ kazanır.
actors.hero.talent.ally_warp.title=Dost Çözgüsü
actors.hero.talent.ally_warp.desc=_+1:_ Büyücü bir müttefik seçerek onunla _2 karo menzile kadar_ anında yer değiştirebilir.\n\n_+2:_ Büyücü bir müttefik seçerek onunla _4 karo menzile kadar_ anında yer değiştirebilir.\n\n_+3:_ Büyücü bir müttefik seçerek onunla _6 karo menzile kadar_ anında yer değiştirebilir.\n\nBüyücü hareketsiz müttefiklerle yer değiştiremez.

actors.hero.talent.empowered_strike.title=Güçlendirilmiş Saldırı
actors.hero.talent.empowered_strike.desc=_+1:_ Savaş Büyücüsü'nün asası ile yakın vurduktan sonraki ilk vuruşu _+16% hasar_ vurur ve değneğin bonus etkisi _+50% güç_ kazanır. \n\n_+2:_ Savaş Büyücüsü'nün asası ile yakın vurduktan sonraki ilk vuruşu _+33% hasar_ vurur ve değneğin bonus etkisi _+100% güç_ kazanır. \n\n_+3:_ Savaş Büyücüsü'nün asası ile yakın vurduktan sonraki ilk vuruşu _+50% hasar_ vurur ve değneğin bonus etkisi _+150% güç_ kazanır.
actors.hero.talent.mystical_charge.title=Gizemli Şarj
actors.hero.talent.mystical_charge.desc=_+1:_ Asasıyla vurmak, Savaş Büyücüsüne _0,5 tur_ değerinde nesne şarjı kazandırır.\n\n_+2:_ Asasıyla vurmak, Savaş Büyücüsüne _1 tur_ değerinde nesne şarjı kazandırır.\n\n_+3:_ Asasıyla vurmak, Savaş Büyücüsüne _1,5 tur_ değerinde nesne şarjı kazandırır.
actors.hero.talent.excess_charge.title=Aşırı Şarj
actors.hero.talent.excess_charge.desc=_+1:_ Savaş Büyücü'sünün değneğinin şarjı tamamen dolu ise, sonraki vuruşu ona değneğin her seviyesi için _0.67 kalkan_ verir.\n\n_+2:_ Savaş Büyücü'sünün değneğinin şarjı tamamen dolu ise, sonraki vuruşu ona değneğin her seviyesi için _1.33 kalkan_ verir.\n\n_+3:_ Savaş Büyücü'sünün değneğinin şarjı tamamen dolu ise, sonraki vuruşu ona değneğin her seviyesi için _2 kalkan_ verir.

actors.hero.talent.soul_siphon.title=Ruh Sifonu
actors.hero.talent.soul_siphon.desc=_+1:_ Diğer karakterler tarafından verilen fiziksel hasar, Kara Büyücü'nün ruh işaretini _%13 etkinlikle tetikler_.\n\n_+2:_ Diğer karakterler tarafından verilen fiziksel hasar, Kara Büyücü'nün ruh işaretini _%27 etkinlikle tetikler_.\n\n_+3:_ Diğer karakterler tarafından verilen fiziksel hasar, Kara Büyücü'nün ruh işaretini _%40 etkinlikle tetikler_.
actors.hero.talent.soul_eater.title=Ruh Yiyici
actors.hero.talent.soul_eater.desc=_+1:_ Ruh işareti, verilen her fiziksel hasar için _0,33 tur_ tokluk sağlar. Ruh işaretli düşmanların öldüklerinde yeme etkilerini tetikleme _şansı %10_'dur.\n\n_+2:_ Ruh işareti, verilen her fiziksel hasar için _0,67 tur_ tokluk sağlar. Ruh işaretli düşmanların öldüklerinde yeme etkilerini tetikleme _şansı %20_'dir.\n\n_+3:_ Ruh işareti, verilen her fiziksel hasar için _1 tur_ tokluk verir. Ruh işaretli düşmanların öldüklerinde yeme etkilerini tetikleme _şansı %30_'dur.
actors.hero.talent.necromancers_minions.title=Sihirbazın Piyonları
actors.hero.talent.necromancers_minions.desc=_+1:_ Ruhu işaretlenmiş bir düşman öldüğünde, Kara Büyücü onu yozlaşmış bir hayalet olarak diriltmek için _%13 şansa_ sahiptir.\n\n_+2:_ Ruhu işaretlenmiş bir düşman öldüğünde, Kara Büyücü onu yozlaşmış bir hayalet olarak diriltmek için _%27 şansa_ sahiptir.\n\n_+3:_ Ruhu işaretlenmiş bir düşman öldüğünde, Kara Büyücü onu yozlaşmış bir hayalet olarak diriltmek için _%40 şansa_ sahiptir.

actors.hero.talent.blast_radius.title=Patlama Yarıçapı
actors.hero.talent.blast_radius.desc=_+1:_ Elemental patlamanın yarıçapı 4'ten _5 karoya_ yükseltildi.\n\n_+2:_ Elemental patlamanın yarıçapı 4'ten _6 karoya_ yükseltildi.\n\n_+3:_ Elemental patlamanın yarıçapı 4'ten _7 karoya_ yükseltildi.\n\n_+4:_ Elemental patlamanın yarıçapı 4'ten _8 karoya_ yükseltildi.
actors.hero.talent.elemental_power.title=Temel Güç
actors.hero.talent.elemental_power.desc=_+1:_ Element patlamasının gücü _%25_ artar.\n\n_+2:_ Element patlamasının gücü _%50_ artar.\n\n_+3:_ Element patlamasının gücü _%75_ artar.\n\n_+4:_ Element patlamasının gücü _%100_ artar.
actors.hero.talent.reactive_barrier.title=Ayıraç Bariyer
actors.hero.talent.reactive_barrier.desc=_+1:_ Büyücü, element patlamasından etkilenen maksimum 5 karakter olmak üzere her karakter için _2.5 kalkan_ kazanır.\n\n_+2:_ Büyücü, element patlamasından etkilenen maksimum 6 karakter olmak üzere her karakter için _5 kalkan_ kazanır.\n\n_+3:_ Büyücü, element patlamasından etkilenen maksimum 7 karakter olmak üzere her karakter için _7.5 kalkan_ kazanır.\n\n_+4:_ Büyücü, element patlamasından etkilenen maksimum 8 karakter olmak üzere her karakter için _10 kalkan_ kazanır.

actors.hero.talent.wild_power.title=Vahşi Güç
actors.hero.talent.wild_power.desc=_+1:_ Vahşi büyü kullanırken, asalar _+4'e kadar olmak üzere 2 veya 3_ artırılır.\n\n_+2:_ Vahşi büyü kullanırken, asalar _+5'e kadar olmak üzere 3_ artırılır.\n\n_+3:_ Vahşi büyü kullanırken, asalar _+6'e kadar olmak üzere 3 veya 4_ artırılır.\n\n_+4:_ Vahşi büyü kullanırken, asalar _+7'e kadar olmak üzere 4_ artırılır.
actors.hero.talent.fire_everything.title=Her Şeyi Ateşe Ver
actors.hero.talent.fire_everything.desc=_+1:_ Vahşi büyü artık 4 değil, _5 defa_ ateşleniyor ve her bir asanın 3 kez kullanılabilir olmak için _%25 şansı_ var.\n\n_+2:_ Vahşi büyü artık 4 değil, _6 defa_ ateşleniyor ve her bir asanın 3 kez kullanılabilir olmak için _%50 şansı_ var.\n\n_+3:_ Vahşi büyü artık 4 değil, _7 defa_ ateşleniyor ve her bir asanın 3 kez kullanılabilir olmak için _%75 şansı_ var.\n\n_+4:_ Vahşi büyü artık 4 değil, _8 defa_ ateşleniyor ve her bir asanın 3 kez kullanılabilir olmak için _%100 şansı_ var.
actors.hero.talent.conserved_magic.title=korunmuş büyü
actors.hero.talent.conserved_magic.desc=_+1:_ Vahşi büyüden gelen her bir vuruş artık 0,5 yerine _0,33 şarj_ kullanıyor ve vahşi büyünün bir tur harcamama _şansı %25_.\n\n_+2:_ Vahşi büyüden gelen her bir vuruş artık 0,5 yerine _0,225 şarj_ kullanıyor ve vahşi büyünün bir tur harcamama _şansı %50_.\n\n_+3:_ Vahşi büyüden gelen her bir vuruş artık 0,5 yerine _0,15 şarj_ kullanıyor ve vahşi büyünün bir tur harcamama _şansı %75_.\n\n_+4:_ Vahşi büyüden gelen her bir vuruş artık 0,5 yerine _0,1 şarj_ kullanıyor ve vahşi büyünün bir tur harcamama _şansı %100_.

actors.hero.talent.telefrag.title=Telefrag
actors.hero.talent.telefrag.desc=_+1:_ Büyücü başka bir karaktere dönüşürse ona _10-15 hasar_ verir, ancak aynı zamanda _5 hasar_ alır.\n\n_+2:_ Büyücü başka bir karaktere dönüşürse, ona _20-30 hasar_ verir, ancak aynı zamanda _10 hasar_ alır.\n\n_+3:_ Büyücü başka bir karaktere dönüşürse ona _30-45 hasar_ verir, ancak aynı zamanda _15 hasar_ alır.\n\n_+4:_ Büyücü başka bir karaktere dönüşürse ona _40-60 hasar_ verir, ama aynı zamanda _20 hasar_ alır.\n\nKahraman bu yetenek tarafından öldürülemez, büyü direnci etkileri ile kendine verdiği hasar azaltılabilir.
actors.hero.talent.remote_beacon.title=Uzak İşaret
actors.hero.talent.remote_beacon.desc=_+1:_ Büyücü _4 karo_ içindeki herhangi bir konuma bir işaret yerleştirebilir.\n\n_+2:_ Büyücü _8 karo_ içindeki herhangi bir konuma bir işaret yerleştirebilir.\n\n_+3:_ Büyücü _12 karo_ içindeki herhangi bir yere bir işaret yerleştirebilir.\n\n_+4:_ Büyücü _16 karo_ içindeki herhangi bir konuma bir işaret yerleştirebilir.\n\nBüyücü, erişilemeyen konumlara işaretçi yerleştiremez.
actors.hero.talent.longrange_warp.title=Uzun Menzilli Çarpıtma
actors.hero.talent.longrange_warp.desc=_+1:_ Büyücü artık _%150 şarj maliyetiyle_ katlar arasında ışınlanabilir.\n\n_+2:_ Büyücü artık _%117 şarj maliyetiyle_ katlar arasında ışınlanabilir.\n\n_+3:_ Büyücü artık _%83 şarj maliyetiyle_ katlar arasında ışınlanabilir.\n\n_+4:_ Büyücü artık _%50 şarj maliyetiyle_ katlar arasında ışınlanabilir.\n\nBüyücü kilitli bir kattan çıkmak için uzun menzilli ışınlanma kullanamaz.

#rogue
actors.hero.talent.cached_rations.title=Saklı Erzaklar
actors.hero.talent.cached_rations.desc=_+1:_ Düzenbaz, zindanın sonraki birkaç katını keşfederken sandıklara yerleştirilmiş _2 erzak_ bulabilir.\n\n_+2:_ Düzenbaz, zindanın sonraki birkaç katını keşfederken sandıklara yerleştirilmiş _3 erzak_ bulabilir.\n\nErzaklar çabucak yenir, orta derecede tokluk verir, 5 hp iyileştirir ve Gölgelerin Pelerini'ne 1 şarj yükler.
actors.hero.talent.thiefs_intuition.title=Hırsızın Sezgisi
actors.hero.talent.thiefs_intuition.desc=_+1:_ Haydut, yüzükleri _2x daha hızlı_ tanır ve _kuşandığında_ türünü belirler.\n\n_+2:_ Haydut, yüzükleri _kuşandığında_ tanımlar ve _eline aldığında_ türünü belirler.
actors.hero.talent.sucker_punch.title=Kalleş Yumruğu
actors.hero.talent.sucker_punch.desc=_+1:_ Düzenbaz, bir düşmana ilk kez sürpriz saldırı yaptığında _1-2 ilave hasar_ verir.\n\n_+2:_ Düzenbaz, bir düşmana ilk kez sürpriz saldırı yaptığında _2 ilave hasar_ verir.
actors.hero.talent.protective_shadows.title=Koruyucu Gölgeler
actors.hero.talent.protective_shadows.desc=_+1:_ Düzenbaz görünmez olduğu _her turda_ bir kalkan kazanır, _en fazla 3_'e kadar.\n\n_+2:_ Düzenbaz görünmez olduğu _her turda_ bir kalkan kazanır, _en fazla 5_'e kadar.

actors.hero.talent.mystical_meal.title=Mistik Yemek
actors.hero.talent.mystical_meal.desc=_+1:_ Yemek yemek Düzenbazın 1 turunu alır (erzaklar anında yenir) ve ona _3 turluk obje şarjı_ sağlar.\n\n_+2:_ Yemek yemek Düzenbazın 1 turunu alır (erzaklar anında yenir) ve ona _5 turluk obje şarjı_ sağlar.\n\nBu yetenek bolluk boynuzunun kendini yeniden şarj etmesi için kullanılamaz.
actors.hero.talent.inscribed_stealth.title=Yazılı Gizlilik
actors.hero.talent.inscribed_stealth.desc=_+1:_ Haydut, bir parşömen okuduktan veya bir büyü eşyası kullandıktan sonra _3 tur_ görünmezlik kazanır.\n\n_+2:_ Haydut bir parşömen okuduktan veya bir büyü eşyası kullandıktan sonra _5 tur_ görünmezlik kazanır.\n\nYükseltme parşömeni, dönüşüm parşömeni veya bu parşömenler kullanılarak üretilmesi gereken simya eşyaları kullanıldığında görünmezlik süresi iki katına çıkar.\n\nDaha yüksek üretim miktarlarına sahip simya nesneleri için (örneğin çoğu büyü), bu yeteneğin o nesneden kaç tane üretildiğine bağlı olarak tetiklenme şansı vardır.
actors.hero.talent.wide_search.title=Geniş Arama
actors.hero.talent.wide_search.desc=_+1:_ Düzenbaz'ın arama yarıçapı 5x5 kareden _7x7 çembere_ çıkarıldı.\n\n_+2:_ Düzenbaz'ın arama yarıçapı 5x5 kareden _7x7 kareye_ yükseltilir.
actors.hero.talent.wide_search.meta_desc=_Bu yetenek farklı bir kahraman tarafından kazanılırsa_ bunun yerine arama yarıçaplarını 3x3 kareden +1'de 5x5 daireye ya da +2'de 5x5 kareye yükseltir.
actors.hero.talent.silent_steps.title=Sessiz Adımlar
actors.hero.talent.silent_steps.desc=_+1:_ Düzenbaz, uyuyan düşmanlardan _3 veya daha fazla kare uzaktayken_ onları uyandırmaz.\n\n_+2:_ Düzenbaz, _yanlarında olmadığı_ sürece uyuyan düşmanları uyandırmaz.
actors.hero.talent.rogues_foresight.title=Düzenbazın Öngörüsü
actors.hero.talent.rogues_foresight.desc=_+1:_ Haydut gizli bir odanın olduğu seviyeye inerse, bu seviyenin bir sır içerdiğini fark etme şansı %75'tir. \n\n_+2:_ Haydut gizli bir odanın olduğu seviyeye inerse, bu seviyenin bir sır içerdiğini fark etme şansı %100'dür.

actors.hero.talent.light_cloak.title=hafif pelerin
actors.hero.talent.light_cloak.desc=_+1:_ Haydut, gölge pelerinini kuşanmadığında kullanabilir, ancak kuşanmadığında_ %25 hızla_ yeniden şarj olur.\n\n_+2:_ Haydut gölge pelerinini kuşanmadığında kullanabilir, ancak kuşanmadığında _%50 hızla_ şarj olur.\n\n_+3:_ Haydut gölge pelerinini kuşanmadığında kullanabilir, ancak kuşanmadığında _%75 hızla_ şarj olur.
actors.hero.talent.light_cloak.meta_desc=_Bu yetenek farklı bir kahraman tarafından kazanılırsa_ bunun yerine tüm eserlerin şarj hızını +1/+2/+3'te %7/13/20 oranında artıracaktır.
actors.hero.talent.enhanced_rings.title=Geliştirilmiş Yüzükler
actors.hero.talent.enhanced_rings.desc=_+1:_ Haydut bir eser kullandığında, yüzükleri _3 tur_ boyunca +1 yükseltme kazanır.\n\n_+2:_ Haydut bir eser kullandığında, yüzükleri _6 tur_ boyunca +1 yükseltme kazanır.\n\n_+3:_ Haydut bir eser kullandığında, yüzükleri _9 tur_ boyunca +1 yükseltme kazanır.

actors.hero.talent.enhanced_lethality.title=gelişmiş öldürücülük
actors.hero.talent.enhanced_lethality.desc=_+1:_ Suikastçı, hazırlık düzeyi başına %3/10/20/50 yerine _%4/13/27/67 sağlığın atındaki_ düşmanlara suikast düzenleyebilir.\n\n_+2:_ Suikastçı, hazırlık düzeyi başına %3/10/20/50 yerine _%5/17/33/83 sağlığın atındaki_ düşmanlara suikast düzenleyebilir.\n\n_+3:_ Suikastçı, hazırlık düzeyi başına %3/10/20/50 yerine _%6/20/40/100 sağlığın atındaki_ düşmanlara suikast düzenleyebilir.
actors.hero.talent.assassins_reach.title=suikastçının erişimi
actors.hero.talent.assassins_reach.desc=_+1:_ Suikastçı'nın hazırlık seviyesi başına ışınlanma menzili 1/2/3/4'ten _1/3/4/6 kareye_ yükseltilir.\n\n_+2:_ Suikastçı'nın hazırlık seviyesi başına ışınlanma menzili 1/2/3/4'ten _2/4/6/8 kareye_ yükseltilir.\n\n_+3:_ Suikastçı'nın hazırlık seviyesi başına ışınlanma menzili 1/2/3/4'ten _2/5/7/10 kareye_ yükseltilir.\n\nBu hareket tehlikelerin ve düşmanların içinden geçebilir, ancak duvar gibi katı arazilerden geçemez.
actors.hero.talent.bounty_hunter.title=ödül avcısı
actors.hero.talent.bounty_hunter.desc=_+1:_ Haydut bir düşmanı hazırlıklı vuruş öldürürse, düşmanın eşya düşürme şansı her hazırlanma düzeyi başına _2/4/8/16%_ ile artar\n\n_+2:_ Haydut bir düşmanı hazırlıklı vuruş öldürürse, düşmanın eşya düşürme şansı her hazırlanma düzeyi başına _4/8/16/34%_ ile artar\n\n_+3:_ Haydut bir düşmanı hazırlıklı vuruş öldürürse, düşmanın eşya düşürme şansı her hazırlanma düzeyi başına _6/12/24/48%_ ile artar

actors.hero.talent.evasive_armor.title=Yakalayamaz Ki
actors.hero.talent.evasive_armor.desc=_+1:_ Serbest koşarken, Serbest Koşucu, zırhındaki her fazla güç puanı başına ek _+1 kaçınma_ kazanır.\n\n_+2:_ Serbest koşarken, Serbest Koşucu, zırhındaki her fazla güç puanı başına ek _+2 kaçınma_ kazanır.\n\n_+3:_ Serbest koşarken, Serbest Koşucu, zırhındaki her fazla güç puanı başına ek _+3 kaçınma_ kazanır.
actors.hero.talent.projectile_momentum.title=atış momentumu
actors.hero.talent.projectile_momentum.desc=_+1:_ Serbest koşu sırasında, Serbest Koşucu fırlatma silahlarıyla _+%50 isabet ve +%15 hasar_ kazanır.\n\n_+2:_ Serbest koşu sırasında, Serbest Koşucu fırlatma silahlarıyla _+%100 isabet ve +%30 hasar_ kazanır.\n\n_+3:_ Serbest koşu sırasında, Serbest Koşucu fırlatma silahlarıyla _+%150 isabet ve +%45 hasar_ kazanır.
actors.hero.talent.speedy_stealth.title=hızlı gizlilik
actors.hero.talent.speedy_stealth.desc=_+1:_ Freerunner görünmezken tur başına 2 momentum yığını kazanır.\n\n_+2:_ +1'in faydalarına ek olarak, Freerunner görünmezken freerunning artık geri sayım yapmıyor.\n\n_+3:_ +1 ve +2'nin faydalarına ek olarak, Freerunner, serbest koşup koşmadığına bakılmaksızın görünmezken 2 kat hızla hareket eder.

actors.hero.talent.hasty_retreat.title=acele geri çekilme
actors.hero.talent.hasty_retreat.desc=_+1:_ Düzenbaz, göz kırptıktan sonra _1 tur_ acelecilik ve görünmezlik kazanır.\n\n_+2:_ Düzenbaz, göz kırptıktan sonra _2 tur_ acelecilik ve görünmezlik kazanır.\n\n_+3:_ Düzenbaz, göz kırptıktan sonra _3 tur_ acelecilik ve görünmezlik kazanır.\n\n_+4:_ Düzenbaz, göz kırptıktan sonra _4 tur_ acelecilik ve görünmezlik kazanır.
actors.hero.talent.body_replacement.title=vücut değişikliği
actors.hero.talent.body_replacement.desc=_+1:_ Düzenbaz, göz kırptıktan sonra arkasında _20 can ve 1-3 zırha_ sahip ahşap bir yem bırakır.\n\n_+2:_ Düzenbaz, göz kırptıktan sonra arkasında _40 can ve 2-6 zırha_ sahip ahşap bir yem bırakır.\n\n_+3:_ Düzenbaz, göz kırptıktan sonra arkasında _60 can ve 3-9 zırha_ sahip ahşap bir yem bırakır.\n\n_+4:_ Düzenbaz, göz kırptıktan sonra arkasında _90 can ve 4-12 zırha_ sahip ahşap bir yem bırakır.\n\nAynı anda sadece bir yem aktif olabilir.
actors.hero.talent.shadow_step.title=gölge adımı
actors.hero.talent.shadow_step.desc=_+1:_ Eğer düzenbaz görünmezken sis bombası kullanırsa, anında ortaya çıkar ve _%16 daha az_ şarj maliyeti vardır, ancak aynı zamanda düşmanları kör etmez veya diğer yetenekleri tetiklemez.\n\n_+2:_ Eğer düzenbaz görünmezken sis bombası kullanırsa, anında ortaya çıkar ve _%30 daha az_ şarj maliyeti vardır, ancak aynı zamanda düşmanları kör etmez veya diğer yetenekleri tetiklemez.\n\n_+3:_ Eğer düzenbaz görünmezken sis bombası kullanırsa, anında ortaya çıkar ve _%41 daha az_ şarj maliyeti vardır, ancak aynı zamanda düşmanları kör etmez veya diğer yetenekleri tetiklemez.\n\n_+4:_ Eğer düzenbaz görünmezken sis bombası kullanırsa, anında ortaya çıkar ve _%50 daha az_ şarj maliyeti vardır, ancak aynı zamanda düşmanları kör etmez veya diğer yetenekleri tetiklemez.

actors.hero.talent.fear_the_reaper.title=ormandan kork
actors.hero.talent.fear_the_reaper.desc=_+1:_ İnfazı Verili bir düşman 0 cana ulaştığında, _sakatlanır_.\n\n_+2:_ İnfazı Verili bir düşman 0 cana ulaştığında, _sakatlanır_ ve _korkar_.\n\n_+3:_ İnfazı Verili bir düşman 0 cana ulaştığında, _sakatanır_, _korkar_.ve 3 karo içindeki düşmanlar _sakatlanırlar_.\n\n_+4:_ İnfazı Verili bir düşman 0 cana ulaştığında, _sakatlanır_, _korkar_ ve 3 karo içindeki düşmanlar _sakatlanırlar_, _korkarlar_.
actors.hero.talent.deathly_durability.title=ölümcül dayanıklılık
actors.hero.talent.deathly_durability.desc=_+1:_ Ölüm işaretiyle öldürülen düşmanlar, Düzenbaz'a, işaretlendikleri zamanki hp'lerinin _%13_' ü kadar kalkan verir.\n\n_+2:_ Ölüm işaretiyle öldürülen düşmanlar, Düzenbaz'a işaretlendikleri zamanki hp'lerinin _%25_' i kadar kalkan verir.\n\n_+3:_ Ölüm işaretiyle öldürülen düşmanlar, Düzenbaz'a işaretlendikleri zamanki hp'lerinin _%38_'i kadar kalkan verir.\n\n_+4:_ Ölüm işaretiyle öldürülen düşmanlar, Düzenbaz'a işaretlendikleri zamanki hp'lerinin _%50_'si kadar kalkan verir.
actors.hero.talent.double_mark.title=çift işaret
actors.hero.talent.double_mark.desc=_+1:_ İlk hedefle aynı anda ikinci bir hedefi işaretlemek, _%30 daha az_ ücretlendirme maliyetine sahiptir.\n\n_+2:_ İlk hedefle aynı anda ikinci bir hedefi işaretlemek, _%50 azaltılmış_ ücret maliyetine sahiptir.\n\n_+3:_ İkinci bir hedefi birinciyle aynı anda işaretlemek, _%65 azaltılmış_ ücret maliyetine sahiptir.\n\n_+4:_ Birinci hedefle aynı anda ikinci bir hedefi işaretlemek, _%75 azaltılmış_ ücret maliyetine sahiptir.

actors.hero.talent.shadow_blade.title=gölge kılıcı
actors.hero.talent.shadow_blade.desc=_+1:_ Gölge klonu, kahramanın sıra başına verdiği hasarın _%8'ini_ kazanır ve kahramanın silahındaki efsunu kullanmak için _%25 şansa_ sahiptir.\n\n_+2:_ Gölge klonu, kahramanın sıra başına verdiği hasarın _%16'sını_ kazanır ve kahramanın silahındaki efsunu kullanmak için _%50 şansa_ sahiptir.\n\n_+3:_ Gölge klonu, kahramanın sıra başına verdiği hasarın _%24'ünü_ kazanır ve kahramanın silahındaki efsunu kullanmak için _%75 şansa_ sahiptir.\n\n_+4:_ Gölge klonu, kahramanın sıra başına verdiği hasarın _%32'sini_ kazanır ve kahramanın silahındaki efsunu kullanmak için _%100 şansa_ sahiptir.
actors.hero.talent.cloned_armor.title=klonlanmış zırh
actors.hero.talent.cloned_armor.desc=_+1:_ Gölge klonu, kahramanın zırh değerinin _%12'sini_ kazanır ve kahramanın zırhındaki rünü kullanmak için _%25 şansa_ sahiptir.\n\n_+2:_ Gölge klonu, kahramanın zırh değerinin _%36'sını_ kazanır ve kahramanın zırhındaki rünü kullanmak için _%75 şansa_ sahiptir.\n\n_+3:_ Gölge klonu, kahramanın zırh değerinin _%48'ini_ kazanır ve kahramanın zırhındaki rünü kullanmak için _%100 şansa_ sahiptir.
actors.hero.talent.perfect_copy.title=mükemmel kopya
actors.hero.talent.perfect_copy.desc=_+1:_ Gölge klon, kahramanın en fazla HP'sinin _%10_'unu kazanır ve kahramanla _1 karo_ uzaklığa kadar anında yer değiştirebilir.\n\n_+2:_ Gölge klon, kahramanın en fazla HP'sinin _%20_'sini kazanır ve kahramanla _2 karo_ uzaklığa kadar anında yer değiştirebilir.\n\n_+3:_ Gölge klon, kahramanın en fazla HP'sinin _%30_'unu kazanır ve kahramanla _3 karo_ uzaklığa kadar anında yer değiştirebilir.\n\n_+4:_ Gölge klon, kahramanın en fazla HP'sinin _%40_'ını kazanır ve kahramanla _4 karo_ uzaklığa kadar anında yer değiştirebilir.

#huntress
actors.hero.talent.natures_bounty.title=Doğanın ikramı
actors.hero.talent.natures_bounty.desc=_+1:_ Avcı, zindanın sonraki birkaç katını keşfederken uzun otların arasında gizlenmiş _4 meyveyi_ bulabilir.\n\n_+2:_ Avcı, zindanın sonraki birkaç katını keşfederken uzun otların arasında gizlenmiş _6 meyveyi_ bulabilir. \n\nMeyveler çabuk yenir, az miktarda tokluk hissi verir ve kullanılabilir bir tohum içerebilir.
actors.hero.talent.survivalists_intuition.title=Ormancının sezgisi
actors.hero.talent.survivalists_intuition.desc=_+1:_ Avcı fırlatılan silahları _3 kat daha hızlı_ tanımlar.\n\n_+2:_ Avcı fırlatılan silahları _onlarla vurduğunda_ tanımlar.
actors.hero.talent.followup_strike.title=Ardışık Saldırı
actors.hero.talent.followup_strike.desc=_+1:_ Avcı bir rakibe yayı veya fırlattığı bir silahla vurduğunda, o rakibe karşı bir sonraki yakın muharebe saldırısı _2 ilave hasar_ verir.\n\n_+2:_ Avcı, yayı veya fırlattığı bir silahla bir rakibe vurduğunda, o rakibe karşı yaptığı bir sonraki yakın muharebe saldırısı _3 ilave hasar_ verir.
actors.hero.talent.natures_aid.title=Doğanın desteği
actors.hero.talent.natures_aid.desc=_+1:_ Görüş alanında bir bitki aktifleştiğinde Avcı her _3 elde_ bir azalan 0-2 kabukderi zırhı kazanır.\n\n_+2:_ Görüş alanında bir bitki aktifleştiğinde Avcı her _5 elde_ bir azalan 0-2 kabukderi zırhı kazanır.

actors.hero.talent.invigorating_meal.title=Canlandıran Yemek
actors.hero.talent.invigorating_meal.desc=_+1:_ Yemek yemek sadece bir tur sürer (dutlar anında yenir) ve avcıya _1 tur acele_ verir.\n\n_+2:_ Yemek yemek sadece bir tur sürer (dutlar anında yenir) ve avcıya _2 tur acele_ verir.
actors.hero.talent.liquid_nature.title=sıvı doğa
actors.hero.talent.liquid_nature.desc=_+1:_ Avcı bir iksir, karışım, özüt içtiğinde veya fırlattığında, çevrede _4 karo çim'e kadar_ filizlenir ve bitişik düşmanlar _1 tur_ boyunca köklenir.\n\n_+2:_ Avcı bir iksir, karışım, özüt içtiğinde veya fırlattığında, çevrede _6 karo çim'e kadar_ filizlenir ve bitişik düşmanlar _2 tur_ boyunca köklenir.\n\nBu iksirleri kullanarak üretilmesi gereken güç, deneyim iksirleri ya da simya öğeleri kullanıldığında çim miktarı ve kök süresi iki katına çıkar.\n\nDaha yüksek üretim miktarlarına sahip simya öğeleri için (ö.r. su karışımı), bu yeteneğin o öğenin kaç tane üretildiğine bağlı olarak tetiklenme şansı vardır.
actors.hero.talent.rejuvenating_steps.title=Yetiştiren adımlar
actors.hero.talent.rejuvenating_steps.desc=_+1:_ Avcı kısa çimenlere veya közlere bastığında, Avcı'nın hemen kırdığı uzun otlara sıçrarlar. Bunun _10 dönüşlü bir bekleme süresi var_.\n\n_+2:_ Avcı kısa çimenlere veya közlere bastığında, Avcı'nın hemen kırdığı uzun otlara sıçrar. Bunun _5 dönüşlü bir bekleme süresi var_.\n\nBu yetenek, pasif yenilenme etkileri devre dışı bırakılırsa veya kahraman uzun süredir exp kazanmadıysa, karıklı çimen üretecektir.
actors.hero.talent.heightened_senses.title=Keskin Hisler
actors.hero.talent.heightened_senses.desc=_+1:_ Avcı, bulunduğu konumdan _2 karelik mesafe_ içindeki karakterler üzerinde zihin görüşü kazanır.\n\n_+2:_ Avcı, bulunduğu konumdan _3 karelik mesafe_ içindeki karakterler üzerinde zihin görüşü kazanır.
actors.hero.talent.durable_projectiles.title=Dayanıklı Fırlatma Silahları
actors.hero.talent.durable_projectiles.desc=_+1:_ Fırlatma silahları avcı tarafından kullanıldığında _+%50 dayanıklılık_ kazanır.\n\n_+2:_ Fırlatma silahları avcı tarafından kullanıldığında _+%75 dayanıklılık_ kazanır.

actors.hero.talent.point_blank.title=bitişik atış
actors.hero.talent.point_blank.desc=_+1:_ Avcı, yayını veya fırlatma silahını yakın mesafede kullandığında -%50 yerine _-%25 isabet_ cezası alır.\n\n_+2:_ Avcı, yayını veya fırlatma silahını yakın mesafede kullandığında -%50 yerine _normal isabet_ oranına sahip olur.\n\n_+3:_ Avcı, yayını veya fırlatma silahını yakın mesafede kullandığında -%50 yerine _+%25 isabet_ bonusu alır.\n\nFırlatma silahları veya ruh yayı uzak mesafeden kullanıldığında her zaman +%50 isabet bonusuna sahiptir.
actors.hero.talent.seer_shot.title=gören atış
actors.hero.talent.seer_shot.desc=_+1:_ Avcı zemine bir ok attığında, etrafındaki 3x3'lük bir alanı _5 sıra_ boyunca görür. Bunun 20 sıra bekleme süresi vardır.\n\n_+2:_ Avcı zemine bir ok attığında, etrafındaki 3x3'lük bir alanı _10 sıra_ boyunca görür. Bunun 20 sıra bekleme süresi vardır.\n\n_+3:_ Avcı zemine bir ok attığında, etrafındaki 3x3'lük bir alanı _15 sıra_ boyunca görür. Bunun 20 sıra bekleme süresi vardır.
actors.hero.talent.seer_shot.meta_desc=_Bu yetenek farklı bir kahraman tarafından kazanılırsa_ herhangi bir fırlatma silahından tetiklenir.

actors.hero.talent.farsight.title=ileri görüş
actors.hero.talent.farsight.desc=_+1:_ Sniper'ın görüş mesafesi _%25 artırıldı_.\n\n_+2:_ Sniper'ın görüş mesafesi _%50 artırıldı_.\n\n_+3:_ Sniper'ın görüş menzili _%75 artırıldı_.
actors.hero.talent.shared_enchantment.title=paylaşılmış efsun
actors.hero.talent.shared_enchantment.desc=_+1:_ Fırlatılan silahların, Keskin Nişancı'nın yayı üzerindeki büyüyü kullanma şansı _%33'tür.\n\n_+2:_ Fırlatılan silahların, Keskin Nişancı'nın yayı üzerindeki büyüyü kullanma şansı %67'dir.\n\n_+3:_ Fırlatılan silahların, Keskin Nişancı'nın yayı üzerindeki büyüyü kullanma şansı %100'dür.\n\nYayın büyüsü, fırlatılan silahın halihazırda sahip olduğu büyüye ek olarak tetiklenebilir.
actors.hero.talent.shared_upgrades.title=Paylaşılan geliştirmeler
actors.hero.talent.shared_upgrades.desc=_+1:_ Keskin Nişancı yükseltilmiş bir fırlatılan silahla saldırdığında, her seviye keskin nişancının işaretinin süresini 1 tur ve özel saldırısının hasarını %16 artırarak maksimum _2 tura çıkarır ve +2'de +%33 hasar verir_.\n\n_+2:_ Keskin Nişancı yükseltilmiş bir fırlatılan silahla saldırdığında, her seviye keskin nişancının işaretinin süresini 1 tur ve özel saldırısının hasarını %16 artırarak maksimum _4 tura çıkarır ve +4'te +%67 hasar verir_.\n\n_+3:_ Keskin Nişancı yükseltilmiş bir fırlatılan silahla saldırdığında, her seviye keskin nişancının işaretinin süresini 1 tur ve özel saldırısının hasarını %16 artırarak maksimum _6 tura çıkarır ve +6'da +%100 hasar verir_

actors.hero.talent.durable_tips.title=uzun süreli ipuçları
actors.hero.talent.durable_tips.desc=_+1:_ Uçlu dartlar, Gardiyan onları kullandığında _2 kat dayanıklılığa_ sahiptir.\n\n_+2:_ Uçlu dartlar, Gardiyan onları kullandığında _3 kat dayanıklılığa_ sahiptir.\n\n_+3:_ Uçlu dartlar, Gardiyan onları kullandığında _4 kat dayanıklılığa_ sahiptir.
actors.hero.talent.barkskin.title=kabuk derili
actors.hero.talent.barkskin.desc=_+1:_ Çimenlere basan Gardiyan, seviyesinin _%0-50'si_ kadar kabuk zırh kazanır ve bu zırh her turda azalır.\n\n_+2:_ Çimenlere basan Gardiyan, seviyesinin _%0-100'ü_ kadar kabuk zırh kazanır ve bu zırh her turda azalır.\n\n_+3:_ Çimenlere basan Gardiyan, seviyesinin _%0-150'si_ kadar kabuk zırh kazanır ve bu zırh her turda azalır.
actors.hero.talent.shielding_dew.title=koruyucu dew
actors.hero.talent.shielding_dew.desc=_+1:_ Çiy damlaları, sağlığı dolduğunda Gardiyan'a maksimum HP'sinin _%20'sine_ kadar koruyabilir.\n\n_+2:_ Çiy damlaları, sağlığı dolduğunda Gardiyan'a maksimum HP'sinin _%40'ına_ kadar koruyabilir.\n\n_+3:_ Çiy damlaları, sağlığı dolduğunda Gardiyan'a maksimum HP'sinin _%60'ına_ kadar koruyabilir.

actors.hero.talent.fan_of_blades.title=bıçak fanı
actors.hero.talent.fan_of_blades.desc=_+1:_ Hayali bıçaklar, %50 hasar için _1 ek hedefe_ vurabilir. Hedef görünür olmalı ve _30 derecelik_ bir etki  alanı içinde olmalıdır.\n\n_+2:_ Hayali bıçaklar, %50 hasar için _2 ek hedefe_ vurabilir. Hedefler görünür olmalı ve _60 derecelik_ bir etki alanı içinde olmalıdır.\n\n_+3:_ Hayali bıçaklar, %50 hasar için _3 ek hedefe_ vurabilir. Hedefler görünür olmalı ve _90 derecelik_ bir etki alanı içinde olmalıdır.\n\n_+4:_ Hayali bıçaklar, %50 hasar için _4 ek hedefe_ vurabilir. Hedefler görünür olmalı ve _120 derecelik_ bir etki alanı içinde olmalıdır.
actors.hero.talent.projecting_blades.title=çıkıntılı bıçaklar
actors.hero.talent.projecting_blades.desc=_+1:_ Spektral bıçakların _+%25 doğruluğu_ vardır ve _2 katı karoya kadar_ nüfuz edebilir.\n\n_+2:_ Spektral bıçaklar _+%50 doğruluğa_ sahiptir ve _4 katı karoya kadar_ nüfuz edebilir.\n\n_+3:_ Spektral bıçakların _+%75 doğruluğu_ vardır ve _6 katı karoya kadar_ nüfuz edebilir.\n\n_+4:_ Spektral bıçaklar _+%100 doğruluğa_ sahiptir ve _8 katı karoya kadar_ nüfuz edebilir.
actors.hero.talent.spirit_blades.title=ruh bıçakları
actors.hero.talent.spirit_blades.desc=_+1:_ Hayalet kılıçların ruh yayı üzerindeki büyüyü de kullanma _şansı %30_'dur.\n\n_+2:_ Hayalet kılıçların ruh yayı üzerindeki büyüyü de kullanma _şansı %60_'dır.\n\n_+3:_ Hayalet kılıçların ruh yayı üzerindeki büyüyü de kullanma _şansı %90_'dır.\n\n_+4:_ Hayalet kılıçların ruh yayı üzerindeki büyüyü de kullanma _şansı %100_'dür ve her büyüye _+%10 güç_ verir.

actors.hero.talent.growing_power.title=büyüyen güç
actors.hero.talent.growing_power.desc=_+1:_ Doğanın gücünden gelen saldırı ve hareket hızı artışları %33 ve %100'den _%38 ve %125_'e yükseltildi.\n\n_+2:_ Doğanın gücünden gelen saldırı ve hareket hızı artışları %33 ve %100'den _%42 ve %150'ye yükseltildi.\n\n_+3:_ Doğanın gücünden gelen saldırı ve hareket hızı artışları %33 ve %100'den _%46 ve %175'e yükseltildi.\n\n_+4:_ Doğanın gücünden gelen saldırı ve hareket hızı artışları, %33 ve %100'den _%50 ve %200_'e yükseltildi.
actors.hero.talent.natures_wrath.title=doğanın gazabı
actors.hero.talent.natures_wrath.desc=_+1:_ Doğanın gücü etkinken, ruh yayından yapılan atışların rastgele bir zararlı bitki etkisini tetikleme _şansı %8_'dir.\n\n_+2:_ Doğanın gücü etkinken, ruh yayından yapılan atışların rastgele bir zararlı bitki etkisi tetikleme _şansı %17_'dir.\n\n_+3:_ Doğanın gücü etkinken, ruh yayından yapılan atışların rastgele bir zararlı bitki etkisi tetikleme _şansı %25_'tir.\n\n_+4:_ Doğanın gücü etkinken, ruh yayından yapılan atışların rastgele bir zararlı bitki etkisini tetikleme _şansı %33_'tür.\n\nTetiklenebilecek bitkiler şunlardır: kör otu, ateş çiçeği, buz örtüsü, hüzün yosunu ve fırtına asması
actors.hero.talent.wild_momentum.title=vahşi momentum
actors.hero.talent.wild_momentum.desc=_+1:_ Ruh yayı ile bir düşmanı öldürmek, doğanın güç süresini _1 tur_ uzatır. Süre en fazla _2 tur_ uzatılabilir.\n\n_+2:_ Bir düşmanı ruh yayı ile öldürmek, doğanın güç süresini _2 tur_ uzatır. Süre maksimum _4 tur_ uzatılabilir.\n\n_+3:_ Bir düşmanı ruh yayı ile öldürmek, doğanın güç süresini _3 tur_ uzatır. Süre en fazla _6 tur_ uzatılabilir.\n\n_+4:_ Ruh yayı ile bir düşmanı öldürmek, doğanın güç süresini _4 tur_ uzatır. Süre maksimum _8 tur_ uzatılabilir.

actors.hero.talent.eagle_eye.title=Şahin Gözü
actors.hero.talent.eagle_eye.desc=_+1:_ Ruh şahininin görüş menzili 6'dan _7 kareye_ yükseltildi.\n\n_+2:_ Ruh şahininin görüş menzili 6'dan _8 kareye_ yükseltildi.\n\n_+3:_ Ruh şahininin görüş menzili 6'dan _9 kareye_ yükseltildi, ve 2 kare akıl görüşü kazandı.\n\n_+4:_ Ruh şahininin görüş menzili 6'dan _10 kareye_ yükseltildi, ve 3 kare akıl görüşü kazandı.
actors.hero.talent.go_for_the_eyes.title=gözler için git
actors.hero.talent.go_for_the_eyes.desc=_+1:_ Ruh şahininin saldırıları, _2 sıra_ boyunca düşmanları kör eder.\n\n_+2:_ Ruh şahininin saldırıları, _5 sıra_ boyunca düşmanları kör eder.\n\n_+3:_ Ruh şahininin saldırıları, _5 sıra_ boyunca düşmanları kör eder ve onları _2 sıra_ sakatlar.\n\n_+4:_ Ruh şahininin saldırıları, _5 sıra_ boyunca düşmanları kör eder ve onları _5 sıra_ sakatlar.
actors.hero.talent.swift_spirit.title=hızlı ruh
actors.hero.talent.swift_spirit.desc=_+1:_ Ruh şahininin hareket hızı 2'den _2.5 kareye_ yükseltildi ve ona karşı yapılan ilk _2 saldırıyı_ savuşturması garantilendi.\n\n_+2:_ Ruh şahininin hareket hızı 2'den _3 kareye_ yükseltildi ve ona karşı yapılan ilk _4 saldırıyı_ savuşturması garantilendi.\n\n_+3:_ Ruh şahininin hareket hızı 2'den _3.5 kareye_ yükseltildi ve ona karşı yapılan ilk _6 saldırıyı_ savuşturması garantilendi.\n\n_+4:_ Ruh şahininin hareket hızı 2'den _4 kareye_ yükseltildi ve ona karşı yapılan ilk _8 saldırıyı_ savuşturması garantilendi.

#duelist
actors.hero.talent.strengthening_meal.title=güçlendirici yemek
actors.hero.talent.strengthening_meal.desc=_+1:_ Yemek yemek, Düellocuya bir düşmana fiziksel saldırıyla vurduğu sonraki _2 seferde_ 3 ilave hasar verir.\n\n_+2:_ Yemek yemek, Düellocuya bir düşmana fiziksel saldırıyla vurduğu sonraki _3 seferde_ 3 ilave hasar verir.
actors.hero.talent.adventurers_intuition.title=maceracı sezgisi
actors.hero.talent.adventurers_intuition.desc=_+1:_ Düellocu silahları _2,5 kat_ ve zırhları _1,75 kat daha hızlı_ tanımlar.\n\n_+2_: Düellocu silahları _kuşandığında_ tanır ve zırhı _2,5 kat daha hızlı_ tanımlar.
actors.hero.talent.patient_strike.title=sabır vuruşu
actors.hero.talent.patient_strike.desc=_+1:_ Düellocu bir yakın dövüş saldırısı yapmadan önce beklerse, _1-2 ilave hasar_ verir.\n\n_+2:_ Düellocu bir yakın dövüş saldırısı yapmadan önce beklerse, _2 ilave hasar_ verir.
actors.hero.talent.aggressive_barrier.title=agresif bariyer
actors.hero.talent.aggressive_barrier.desc=_+1:_ Düellocu %50 sağlık altında silah yeteneği kullanırsa _3 kalkan_ kazanır.\n\n_+2:_ Düellocu %50 sağlık altında silah yeteneği kullanırsa _5 kalkan_ kazanır.
actors.hero.talent.aggressive_barrier.meta_desc=_Bu yetenek farklı bir kahraman tarafından kazanılırsa_ bunun yerine düşük sağlıkta yakın dövüş saldırısı yaparken, 50 sıra bekleme süresiyle kalkan sağlar.

actors.hero.talent.focused_meal.title=odaklayan yemek
actors.hero.talent.focused_meal.desc=_+1:_ Yemek yemek Düellocunun 1 turunu alır ve silahlarına _0.67 şarj_ verir.\n\n_+2:_ Yemek yemek Düellocunun 1 turunu alır ve silahlarına _1 şarj_ verir.
actors.hero.talent.focused_meal.meta_desc=_Bu yetenek farklı bir kahraman tarafından kazanılırsa_ bunun yerine bir sonraki vuruşuna +1'de seviye/3'e ya da +2'de seviye/2'ye eşit bonus hasar verir.
actors.hero.talent.liquid_agility.title=sıvı çevikliği
actors.hero.talent.liquid_agility.desc=_+1:_ Bir iksir, karışım veya öz içildiğinde ya da fırlatıldığında, Düellocu _3 kat kaçınma_ kazanır ve sonraki 5 tur içinde yapacağı ilk yakın dövüş saldırısında _3 kat isabet_ elde eder.\n\n_+2:_ Bir iksir, karışım veya öz içildiğinde ya da fırlatıldığında, Düellocu _sınırsız kaçınma_ kazanır ve sonraki 5 tur içinde yapacağı ilk yakın dövüş saldırısında _sınırsız isabet_ elde eder.\n\nBu bonus, güç, deneyim iksirleri veya bu iksirler kullanılarak üretilen simya eşyaları kullanıldığında bir ek tur ve saldırı daha sürer.\n\nDaha yüksek miktarlarda üretilen simya eşyalarında (örneğin su karışımı), bu yeteneğin tetiklenme olasılığı, üretilen eşya miktarına bağlıdır.
actors.hero.talent.weapon_recharging.title=silah şarjı
actors.hero.talent.weapon_recharging.desc=_+1:_ Düellocu, asa veya eser şarj etme güçlendirmelerinin etkisi altındayken her _15 turda_ bir birincil silah şarjı kazanır.\n\n_+2:_ Düellocu, asa veya eser şarj etme güçlendirmelerinin etkisi altındayken her _10 turda_ bir birincil silah şarjı kazanır.
actors.hero.talent.weapon_recharging.meta_desc=_Bu yetenek farklı bir kahraman tarafından kazanılırsa_ +1'de şarj olurken +%5 yakın dövüş hasarı veya +2'de şarj olurken +%7,5 yakın dövüş hasarı vermesine neden olur.
actors.hero.talent.lethal_haste.title=ölümcül acele
actors.hero.talent.lethal_haste.desc=_+1:_ Düellocu, silah yeteneği ile bir düşmana öldürücü bir darbe indirdiğinde, _3 tur_ değerinde anlık hareket kazanır.\n\n_+2:_ Düellocu, silah yeteneği ile  bir düşmana öldürücü bir darbe indirdiğinde, _5 tur_ değerinde anlık hareket kazanır.
actors.hero.talent.lethal_haste.meta_desc=_Bu yetenek farklı bir kahraman tarafından kazanılırsa_ bunun yerine 100 turluk bekleme süresiyle normal silah saldırılarıyla tetiklenir.
actors.hero.talent.swift_equip.title=el çabukluğu
actors.hero.talent.swift_equip.desc=_+1:_ Düellocu, kuşandığı silahını her 20 turda bir kez anında değiştirebilir.\n\n_+2:_ Düellocu, kuşandığı silahını her 20 turda anında iki kez değiştirebilir.\n\nEğer Düellocu bu yeteneğe sahipse ve bekleme süresinde değilse, kuşanılmamış bir silahı hızlıca kullanmak onu kuşandıracaktır.

actors.hero.talent.precise_assault.title=kesin saldırı
actors.hero.talent.precise_assault.desc=_+1:_ Düellocu bir silah yeteneği kullandığında, 5 tur içindeki bir sonraki yakın dövüş saldırısında _2x isabet_ kazanır. \n\n_+2:_ Düellocu bir silah yeteneği kullandığında, 5 tur içindeki bir sonraki yakın dövüş saldırısında _5x isabet_ kazanır. \n\n_+3:_ Düellocu bir silah yeteneği kullandığında, 5 tur içindeki sonraki yakın dövüş saldırısında _sonsuz isabet_ kazanır.
actors.hero.talent.precise_assault.meta_desc=_Bu yetenek farklı bir kahraman tarafından kazanılırsa_, bunun yerine yakın dövüş saldırı isabetini +1'de %10, +2'de %20 veya +3'te %30 artıracaktır.
actors.hero.talent.deadly_followup.title=ölümcül takip
actors.hero.talent.deadly_followup.desc=_+1:_ Düellocu fırlatılan bir silahla bir düşmana vurduğunda, 5 tur boyunca onlara _10% daha fazla yakın dövüş hasarı_ verir.\n\n_+2:_ Düellocu fırlatılan bir silahla bir düşmana vurduğunda, 5 tur boyunca onlara _20% daha fazla yakın dövüş hasarı_ verir. \n\n_+3:_ Düellocu fırlatılan bir silahla bir düşmana vurduğunda, 5 tur boyunca onlara _30% daha fazla yakın dövüş hasarı_ verir.

actors.hero.talent.varied_charge.title=çeşitli şarj
actors.hero.talent.varied_charge.desc=_+1:_ Şampiyon, iki farklı silah yeteneği kullandığında, zaman sınırlaması olmaksızın, anında _0,17 silah yükünü_ hemen kazanır.\n\n_+2:_ Şampiyon, iki farklı silah yeteneği kullandığında, zaman sınırlaması olmaksızın, anında _0,33 silah yükünü_ hemen kazanır.\n\n_+3:_ Şampiyon, iki farklı silah yeteneği kullandığında, zaman sınırlaması olmaksızın, anında _0,5 silah yükünü_ hemen kazanır.
actors.hero.talent.twin_upgrades.title=ikiz yükseltmeler
actors.hero.talent.twin_upgrades.desc=_+1:_ Şampiyon'un kuşandığı iki silahtan biri daha düşük bir seviyeye sahip olup, diğer silahtan _2 veya daha düşük bir düzeyde_ ise, diğer silahın seviyesine yükseltilir.\n\n_+2:_ Şampiyon'un kuşandığı iki silahtan biri daha düşük bir seviyeye sahip olup, diğer silahtan _1 veya daha düşük bir düzeyde_ ise, diğer silahın seviyesine yükseltilir.\n\n_+3:_ Şampiyon'un kuşandığı iki silahtan biri daha düşük bir seviyeye sahip olup, diğer silahla _aynı veya daha düşük bir düzeyde_ ise, diğer silahın seviyesine yükseltilir.
actors.hero.talent.combined_lethality.title=birleşik öldürücülük
actors.hero.talent.combined_lethality.desc=_+1:_ Şampiyon, farklı bir silahın yeteneğini kullandıktan hemen sonra bir yakın dövüş silahıyla saldırırsa, bu saldırı, HP'si %13'ün altında kalan patron olmayan tüm düşmanları infaz edecektir.\n\n_+2:_ Şampiyon, farklı bir silahın yeteneğini kullandıktan hemen sonra bir yakın dövüş silahıyla saldırırsa, bu saldırı, HP'si %27'nin altında kalan boss olmayan tüm düşmanları infaz edecektir. \n\n_+3:_ Şampiyon, farklı bir silahın yeteneğini kullandıktan hemen sonra bir yakın dövüş silahıyla saldırırsa, bu saldırı, HP'si %40'ın altında kalan boss olmayan tüm düşmanları infaz edecektir. \n\nBu saldırı normal bir yakın dövüş silahı saldırısı veya bir silah yeteneğinin parçası olabilir.

actors.hero.talent.unencumbered_spirit.title=serbest ruh
actors.hero.talent.unencumbered_spirit.desc=_+1:_ Keşiş, kullandığı her _kademe 3 veya daha düşük_ ekipman parçası için _%50 daha fazla enerji_ kazanır.\n\n_+2:_ Keşiş kullandığı her _kademe 2 veya daha düşük_ ekipman parçası için _%75 daha fazla enerji_ kazanır. 3. kademe avantajı değişmez.\n\n_+3:_ Keşiş kullandığı her _kademe 1 veya daha düşük_ ekipman parçası için %_100 daha fazla enerji_ kazanır. Kademe 2 ve 3 avantajları değişmez. Ayrıca ücretsiz bir kumaş zırh ve çivili eldiven kazanır. \n\nBu yeteneğin silahsız olmanın veya Güç Yüzüğü ile saldırmanın hiçbir faydası olmadığını unutmayın.
actors.hero.talent.monastic_vigor.title=manastır canlılığı
actors.hero.talent.monastic_vigor.desc=_+1:_ Keşişin _%100 enerjisi_ varsa, yetenekleri güçlendirilir. \n\n_+2:_ Keşişin _%80 veya daha fazla enerjisi_ varsa, yetenekleri güçlendirilir. \n\n_+3:_ Keşişin _%60 veya daha fazla enerjisi_ varsa, yetenekleri güçlendirilir. \n\nKullanıldığında: \n- Hızla silahlarınızın büyüsünü güçlendirir\n- Odaklanma anlıktır\n- Atılma +4 menzil kazanır\n- Dragon Kick +%50 hasar verir ve geri itme ve sersemletme etkisini yakındaki tüm düşmanlara uygular\n- Meditasyon, eksik HP'nin %20'sini yavaşça iyileştirir ve %80 hasar direnci sağlar.
actors.hero.talent.combined_energy.title=toplu enerji
actors.hero.talent.combined_energy.desc=_+1:_ Keşiş 5 tur arayla bir silah yeteneği ve _4+ enerji_ yeteneği kullanırsa harcanan 1 enerjiyi geri kazanır.\n_+2:_ Keşiş 5 tur arayla bir silah yeteneği ve _3+ enerji_ yeteneği kullanırsa harcanan 1 enerjiyi geri kazanır.\n_+3:_ Keşiş 5 tur arayla bir silah yeteneği ve _2+ enerji_ yeteneği kullanırsa harcanan 1 enerjiyi geri kazanır.

actors.hero.talent.close_the_gap.title=Mesafeyi Kapat
actors.hero.talent.close_the_gap.desc=_+1:_ Düellocu düelloya başlarken hedefine doğru _iki kareye kadar_ ışınlanır.\n\n_+2:_ Düellocu düelloya başlarken hedefine doğru _üç kareye kadar_ ışınlanır.\n\n_+3:_ Düellocu düelloya başlarken hedefine doğru _dört kareye kadar_ ışınlanır.\n\n_+4:_ Düellocu düelloya başlarken hedefine doğru _beş kareye kadar_ ışınlanır.\n\nBu hareket tehlikelerden ve düşmanlardan geçebilir, ancak duvar gibi katı arazilerden geçemez. Bir düşmanın meydan okunacak menzilde olup olmadığı belirlenirken ışınlanma dikkate alınır.
actors.hero.talent.invigorating_victory.title=hayat veren zafer
actors.hero.talent.invigorating_victory.desc=_+1:_ Düellocu düello sona ermeden önce hedefini yenerse, _5 HP artı düello sırasında aldığı hasarın %30'u_ kadar iyileşir.\n\n_+2:_ Düellocu düello sona ermeden önce hedefini yenerse, _10 HP artı düello sırasında aldığı hasarın %50'si_ kadar iyileşir.\n\n_+3:_ Düellocu düello sona ermeden önce hedefini yenerse, _15 HP artı düello sırasında aldığı hasarın %65'i_ kadar iyileşir.\n\n_+4:_ Düellocu düello sona ermeden önce hedefini yenerse, _20 HP artı düello sırasında aldığı hasarın %75'i_ kadar iyileşir.
actors.hero.talent.elimination_match.title=eleme maçı
actors.hero.talent.elimination_match.desc=_+1:_ Düellocu, düello bittikten sonraki 3 tur içinde tekrar meydan okursa, bu meydan okumanın şarj maliyeti _%16 azalır._\n\n_+2:_ Düellocu, düello bittikten sonraki 3 tur içinde tekrar meydan okursa, bu meydan okumanın şarj maliyeti _%30 azalır._\n\n_+3:_  Düellocu, düello bittikten sonraki 3 tur içinde tekrar meydan okursa, bu meydan okumanın şarj maliyeti _%40 azalır._\n\n_+4:_ Düellocu, düello bittikten sonraki 3 tur içinde tekrar meydan okursa, bu meydan okumanın şarj maliyeti _%50 azalır._

actors.hero.talent.elemental_reach.title=elementsel erişim
actors.hero.talent.elemental_reach.desc=_+1:_ Elemental vuruşun menzili 4 kareden _5 kareye_, genişliği ise 65 dereceden _75 dereceye_ çıkarıldı.\n\n_+2:_ Elemental vuruşun menzili 4 kareden _6 kareye_, genişliği ise 65 dereceden _85 dereceye_ çıkarıldı.\n\n_+3:_ Elemental vuruşun menzili 4 kareden _7 kareye_, genişliği ise 65 dereceden _95 dereceye_ çıkarıldı.\n\n_+4:_ Elemental vuruşun menzili 4 kareden _8 kareye_, genişliği ise 65 dereceden _105 dereceye_ çıkarıldı.
actors.hero.talent.striking_force.title=vurucu güç
actors.hero.talent.striking_force.desc=_+1:_ Elemental vuruşun etki gücü _%30_ artar.\n\n_+2:_ Elemental vuruşun etki gücü _%60_ artar.\n\n_+3:_ Elemental vuruşun etki gücü _%90_ artar.\n\n_+4:_ Elemental vuruşun etki gücü _%120_ artar.
actors.hero.talent.directed_power.title=yönlendirilmiş güç
actors.hero.talent.directed_power.desc=_+1:_ Elemental vuruşun doğrudan saldırısı, saldırı hedefi de dahil olmak üzere elemental vuruşun etki menzilindeki her düşman için _+%30 büyü gücü_ kazanır.\n\n_+2:_ Elemental vuruşun doğrudan saldırısı, saldırı hedefi de dahil olmak üzere elemental vuruşun etki menzilindeki her düşman için _+%60 büyü gücü_ kazanır.\n\n_+3:_ Elemental vuruşun doğrudan saldırısı, saldırı hedefi de dahil olmak üzere elemental vuruşun etki menzilindeki her düşman için _+%90 büyü gücü_ kazanır.\n\n_+4:_ Elemental vuruşun doğrudan saldırısı, saldırı hedefi de dahil olmak üzere elemental vuruşun etki menzilindeki her düşman için _+%120 büyü gücü_ kazanır.

actors.hero.talent.feigned_retreat.title=sahte geri çekilme
actors.hero.talent.feigned_retreat.desc=_+1:_ Eğer bir düşman Düellocu'nun ardıl görüntüsüne saldırırsa, Düellocu _2 tur_ acelecilik kazanır.\n\n_+2:_ Eğer bir düşman Düellocu'nun ardıl görüntüsüne saldırırsa, Düellocu _4 tur_ acelecilik kazanır.\n\n_+3:_ Eğer bir düşman Düellocu'nun ardıl görüntüsüne saldırırsa, Düellocu _6 tur_ acelecilik kazanır.\n\n_+4:_ Eğer bir düşman Düellocu'nun ardıl görüntüsüne saldırırsa, Düellocu _8 tur_ acelecilik kazanır.
actors.hero.talent.expose_weakness.title=zayıflığı ortaya çıkarmak
actors.hero.talent.expose_weakness.desc=_+1:_ Düellocunun sahte görüntüsüne saldıran düşmanlar, _2 tur_ boyunca zayıf ve savunmasız hale gelir. \n_+2:_ Düellocunun sahte görüntüsüne saldıran düşmanlar, _4 tur_ boyunca zayıf ve savunmasız hale gelir. \n_+3:_ Düellocunun sahte görüntüsüne saldıran düşmanlar, _6 tur_ boyunca zayıf ve savunmasız hale gelir.\n_+4:_ Düellocunun sahte görüntüsüne saldıran düşmanlar, _8 tur_ boyunca zayıf ve savunmasız hale gelir.
actors.hero.talent.counter_ability.title=karşı yetenek
actors.hero.talent.counter_ability.desc=_+1:_ Düellocu, ardıl görüntüsü saldırıya uğradıktan sonraki 3 tur içinde bir silah yeteneği kullanırsa, bu yetenek _0,38 şarj_ daha az tüketir.\n\n_+2:_ Düellocu, ardıl görüntüsü saldırıya uğradıktan sonraki 3 tur içinde bir silah yeteneği kullanırsa, bu yetenek _0.77 şarj_ daha az tüketir.\n\n_+3:_ Düellocu, ardıl görüntüsü saldırıya uğradıktan sonraki 3 tur içinde bir silah yeteneği kullanırsa, bu yetenek _1.13 şarj_ daha az tüketir.\n\n_+4:_ Düellocu, ardıl görüntüsü saldırıya uğradıktan sonraki 3 tur içinde bir silah yeteneği kullanırsa, bu yetenek _1.5 şarj_ daha az tüketir.

#cleric
actors.hero.talent.satiated_spells.title=Doymuş Büyüler
actors.hero.talent.satiated_spells.desc=_+1:_ Yemek yemek, Ruhban'ın bir sonraki büyü yapışında _3 kalkan_ kazanmasına neden olur.\n\n_+2:_ Yemek yemek, Ruhban'ın bir sonraki büyü yapışında _5 kalkan_ kazanmasına neden olur.
actors.hero.talent.satiated_spells.meta_desc=_Bu yetenek farklı bir kahraman tarafından kazanılırsa_, bunun yerine hemen kalkan verir ve 10 tur sonra normal şekilde bozulmaya başlar.
actors.hero.talent.holy_intuition.title=kutsal sezgi
actors.hero.talent.holy_intuition.desc=_+1:_ Ruhban, bir eşyanın lanetli olup olmadığını ortaya çıkaran bir büyü olan _Kutsal Sezgi_'yi _3 şarj_ karşılığında yapabilir.\n\n_+2:_ Ruhban, bir eşyanın lanetli olup olmadığını ortaya çıkaran bir büyü olan _Kutsal Sezgi_'yi _2 şarj_ karşılığında yapabilir.
actors.hero.talent.holy_intuition.meta_desc=_Bu yetenek farklı bir kahraman tarafından kazanılırsa_, bunun yerine kahramanın lanetli bir eşyayı kuşanmadan hemen önce, +1'de %15 veya +2'de %25 oranında lanet durumunu belirlemesini sağlar.
actors.hero.talent.searing_light.title=yakan ışık
actors.hero.talent.searing_light.desc=_+1:_ Ruhbanın _Kılavuz Işık_ tarafından aydınlatılan düşmanlara yaptığı fiziksel saldırılar _+3 hasar verir._\n\n_+2:_ Ruhbanın _Kılavuz Işık_ tarafından aydınlatılan düşmanlara yaptığı fiziksel saldırılar _+5 hasar verir._
actors.hero.talent.searing_light.meta_desc=_Bu yetenek farklı bir kahraman tarafından kazanılırsa_, bir düşman üzerinde bir asa veya eser kullanıldıktan sonra 20 tur bekleme süresiyle ek hasar verir.
actors.hero.talent.shield_of_light.title=ışık kalkanı
actors.hero.talent.shield_of_light.desc=_+1:_ Ruhban, anında yapılan ve 1 şarj karşılığında 5 tur boyunca bir hedefe karşı _2-4 zırh_ sağlayan bir büyü olan _Işık Kalkanı_'nı yapabilir.\n\n_+2:_ Ruhban, anında yapılan ve 1 şarj karşılığında 5 tur boyunca bir hedefe karşı _3-6 zırh_ kazandıran bir büyü olan _Işık Kalkanı_'nı yapabilir.
actors.hero.talent.shield_of_light.meta_desc=_Bu yetenek farklı bir kahraman tarafından kazanılırsa_, bunun yerine hedeflediğiniz düşmandan alınan fiziksel hasarı +1'de %33 veya +2'de %50 olmak üzere 1 azaltır.

actors.hero.talent.enlightening_meal.title=Aydınlatıcı Yemek
actors.hero.talent.enlightening_meal.desc=_+1:_ Yemek yemek Ruhban'ın 1 turunu alır ve kutsal kitabına _0.67 şarj_ verir.\n\n_+2:_ Yemek yemek Ruhban'ın 1 turunu alır ve kutsal kitabına _1 şarj_ verir.
actors.hero.talent.enlightening_meal.meta_desc=_Bu yetenek farklı bir kahraman tarafından kazanılırsa_, +1'de 2 tur veya +2'de 3 tur asa ve eser şarjı sağlar. Bu, bolluk boynuzunun kendini yeniden şarj etmesine izin vermek için kullanılamaz.
actors.hero.talent.recall_inscription.title=Yazıtı Tekrar Et
actors.hero.talent.recall_inscription.refunded=Ürününüz iade edildi!
actors.hero.talent.recall_inscription.desc=_+1:_ Ruhban, _10 tur_ içinde kullandıkları son rüntaşı veya parşömenin etkisini tekrarlamalarını sağlayan bir büyü olan _Yazıtı Tekrar Et_ büyüsünü yapabilir.\n\n\n+2: Ruhban, _300 tur_ içinde kullandığı son rüntaşı veya parşömenin etkisini tekrarlamasını sağlayan bir büyü olan _Yazıtı Tekrar Et_ büyüsünü yapabilir.\n\nYazıtı Tekrar Çağır yükseltme parşömenleri ile kullanılamaz. Bu büyünün şarj maliyeti, en son hangi öğenin kullanıldığına bağlı olarak değişir: bir rün taşı için 2, bir parşömen için 3, bir egzotik parşömen için 4. Ayrıca, dönüşüm parşömeni veya dönüşüm ya da yükseltme kullanılarak üretilmesi gereken simya eşyaları çoğaltıldığında, bu şarj maliyeti iki katına çıkar.
actors.hero.talent.recall_inscription.meta_desc=_Bu yetenek farklı bir kahraman tarafından kazanılırsa_, bunun yerine herhangi bir parşömen veya rün taşını +1'de %10 veya +2'de %15 oranında iade eder. Yükseltme Parşömenleri bu etkiden muaftır.
actors.hero.talent.sunray.title=Güneş Işını
actors.hero.talent.sunray.desc=_+1:_ Ruhban, 1 şarj karşılığında _4-8 hasar_ veren ve hedefi _4 tur_ boyunca kör eden bir büyü olan _Güneş Işınını_ yapabilir.\n\n_+2:_ Ruhban, 1 şarj karşılığında, _6-12 hasar_ veren ve hedefi _6 tur_ boyunca kör eden bir büyü olan _Güneş Işınını_ yapabilir.\n\nGüneş Işını her hedefi yalnızca bir kez kör edebilir, ancak hedef zaten Güneş Işını tarafından kör edilmişse, onun yerine felç eder. Güneş Işını şeytani ve ölümsüz düşmanlara her zaman en yüksek hasarı verir.
actors.hero.talent.sunray.meta_desc=_Eğer bu yetenek farklı bir kahraman tarafından kazanılırsa_, yerine asalar ve eserler düşmanları 4 tur boyunca kör eder. Bu etki, +1'de %15, +2'de ise %25 oranında gerçekleşir.
actors.hero.talent.divine_sense.title=İlahi Duyu
actors.hero.talent.divine_sense.desc=_+1:_ Ruhban, 50 tur boyunca _8 karo_ Zihin Görüşü sağlayan ve yapılması zaman almayan bir büyü olan _İlahi Duyu_'yu 2 şarj karşılığında yapabilir.\n\n_+2:_ Ruhban, 50 tur boyunca _12 karo_ Zihin Görüşü sağlayan ve yapılması zaman almayan bir büyü olan _İlahi Duyu_'yu 2 şarj karşılığında yapabilir.
actors.hero.talent.divine_sense.meta_desc=_Eğer bu yetenek farklı bir kahraman tarafından kazanılırsa_, yerine zihin görüşü sağlar. Bu etki, bir asa veya eser kullanıldıktan sonra kısa bir süreliğine etkinleşir ve +1'de 3 karoluk menzil, +2'de ise 5 karoluk menzil sağlar.
actors.hero.talent.bless.title=Kutsa
actors.hero.talent.bless.desc=_+1:_ Ruhban, kendisine yapıldığında _6 tur kutsama ve 10 kalkan_ ya da başka bir karaktere yapıldığında _10 tur kutsama ve 10 iyileştirme_ sağlayan _Kutsama_ büyüsünü 1 şarj karşılığında yapabilir.\n\n_+2:_ Ruhban, kendisine yapıldığında _10 tur kutsama ve 15 kalkan_ ya da başka bir karaktere yapıldığında _15 tur kutsama ve 15 iyileştirme_ sağlayan _Kutsama_ büyüsünü 1 şarj karşılığında yapabilir.\n\nBu büyüden elde edilen fazla iyileştirme kalkan olarak dönüştürülür.
actors.hero.talent.bless.meta_desc=_Bu yetenek farklı bir kahraman tarafından kazanılırsa_ bunun yerine kahraman ve tüm müttefikleri için isabet ve kaçınma oranını +1'de %3 veya +2'de %5 artırır.

actors.hero.talent.cleanse.title=Arındır
actors.hero.talent.cleanse.desc=_+1:_ Rahip, _Arındır_ büyüsünü yapabilir. Bu büyü, Rahip ve yakındaki müttefikler üzerindeki _olumsuz etkileri kaldırır_ ve onlara _10 birim kalkan_ sağlar. 2 yük harcar.\n\n_+2:_ Rahip, _Arındır_ büyüsünü yapabilir. Bu büyü, Rahip ve yakındaki müttefiklere _3 tur boyunca olumsuz etkilere bağışıklık kazandırı_r ve _20 birim kalkan_ sağlar. 2 yük harcar.\n\n_+3:_ Rahip, _Arındır_ büyüsünü yapabilir. Bu büyü, Rahip ve yakındaki müttefiklere _5 tur boyunca olumsuz etkilere bağışıklık kazandırır_ ve _30 birim kalkan_ sağlar. 2 yük harcar.
actors.hero.talent.cleanse.meta_desc=_Bu yetenek farklı bir kahraman tarafından kazanılırsa_ bunun yerine bir asa veya eser kullandıktan sonra kahramanın üzerindeki olumsuz durum etkilerini %10/20/30 oranında +1/+2/+3 oranında temizler.
actors.hero.talent.light_reading.title=Hafif Okuma
actors.hero.talent.light_reading.desc=_+1:_ Ruhban, kutsal kitabını kuşanmadığında kullanabilir, ancak kuşanmadığında _%25 hızda_ yeniden şarj olur.\n\n_+2:_ Ruhban kutsal kitabını kuşanmadığında kullanabilir, ancak kuşanmadığında _%50 hızda_ şarj olur.\n\n_+3:_ Ruhban kutsal kitabını kuşanmadığında kullanabilir, ancak kuşanmadığında _%75 hızda_ şarj olur.
actors.hero.talent.light_reading.meta_desc=_Bu yetenek farklı bir kahraman tarafından kazanılırsa_ bunun yerine tüm asaların şarj hızını +1/+2/+3 oranında %7/13/20 artırır.

actors.hero.talent.holy_lance.title=Kutsal Mızrak
actors.hero.talent.holy_lance.desc=_+1:_ Rahip, 4 şarj karşılığında _30-55 hasar_ veren yıkıcı bir büyü olan _Kutsal Mızrak_'ı yapabilir.\n\n_+2:_ Rahip, 4 şarj karşılığında _45-83 hasar_ veren yıkıcı bir büyü olan _Kutsal Mızrak_'ı yapabilir.\n\n_+3:_ Rahip, 4 şarj karşılığında _60-110 hasar_ veren yıkıcı bir büyü olan _Kutsal Mızrak_'ı yapabilir.\n\nKutsal Mızrak şeytani ve ölümsüz düşmanlara her zaman en yüksek hasarı verir. Kutsal Mızrak'ın tekrar kullanılabilmesi için 30 turluk bir bekleme süresi vardır.
actors.hero.talent.hallowed_ground.title=Kutsal Toprak
actors.hero.talent.hallowed_ground.desc=_+1:_ Rahip, 2 yük karşılığında 20 tur boyunca _3x3'lük bir alanda_ araziyi kutsayan bir büyü olan _Kutsal Toprağı_ yapabilir.\n\n_+2:_ Rahip, 2 yük karşılığında 20 tur boyunca _5x5'lik bir alanda_ araziyi kutsayan bir büyü olan _Kutsal Toprağı_ yapabilir.\n\n_+3:_ Rahip, 2 yük karşılığında 20 tur boyunca _7x7'lik bir alanda_ araziyi kutsayan bir büyü olan _Kutsal Toprağı_ yapabilir.\n\nBüyü yapıldığında, Kutsal Toprak müttefikleri 15 HP iyileştirir, düşmanları kısa süreliğine kökler ve kısa otlar yayar. Daha sonra yavaşça müttefikleri iyileştirir, düşmanları sakat bırakır ve rastgele uzun otların büyümesine neden olur. Kutsal Toprak, Rahip'e iyileştirme yerine kalkan sağlar ve ateşle yok edilir.
actors.hero.talent.mnemonic_prayer.title=Anımsatıcı Dua
actors.hero.talent.mnemonic_prayer.desc=_+1:_ Rahip, 1 şarj bedeliyle bir müttefik/düşman üzerindeki güçlendirmeleri/zayıflatmaları _3 tur_ boyunca uzatan bir büyü olan _Anımsatıcı Dua_yı yapabilir.\n\n_+2:_ Rahip, 1 şarj bedeliyle bir müttefik/düşman üzerindeki güçlendirmeleri/zayıflatmaları _4 tur_ boyunca uzatan bir büyü olan _Anımsatıcı Dua_yı yapabilir.\n\n_+3:_ Rahip, 1 şarj bedeliyle bir müttefik/düşman üzerindeki güçlendirmeleri/zayıflatmaları _5 tur_ boyunca uzatan bir büyü olan _Anımsatıcı Dua_yı yapabilir.\n\nAnımsatıcı dua yapmak zaman almaz. Anımsatıcı Dua, bir güçlendirmenin/zayıflatmanın belirli bir örneğini yalnızca bir kez uzatabilir ve zırh yeteneklerinden gelen güçlendirmeleri uzatamaz.

actors.hero.talent.lay_on_hands.title=kutsal dokunuş
actors.hero.talent.lay_on_hands.desc=_+1:_ Şövalye, _Kutsal Dokunuş_ adlı büyüyü kullanabilir. Bu büyü, yakındaki bir karakteri anında _15 Can Puanı_ iyileştirir ya da Şövalye’ye _15 kalkan_ kazandırır. Bu işlem, 1 yük harcar.\n\n_+2:_ Şövalye, _Kutsal Dokunuş_ adlı büyüyü kullanabilir. Bu büyü, yakındaki bir karakteri anında _20 Can Puanı_ iyileştirir ya da Şövalye’ye _20 kalkan_ kazandırır. Bu işlem, 1 yük harcar.\n\n_+3:_ Şövalye, _Kutsal Dokunuş_ adlı büyüyü kullanabilir. Bu büyü, yakındaki bir karakteri anında _25 Can Puanı_ iyileştirir ya da Şövalye’ye _25 kalkan_ kazandırır. Bu işlem, 1 yük harcar.\n\nBu büyüyle yapılan fazla iyileştirme, kalkan olarak dönüştürülür. Kutsal Dokunuş tekrar tekrar kullanılabilir, ancak aynı anda en fazla üç kullanımın oluşturduğu miktarda kalkan uygulanabilir.
actors.hero.talent.aura_of_protection.title=koruma halesi
actors.hero.talent.aura_of_protection.desc=_+1:_ Şövalye, kendisine ve 2 karo içindeki tüm müttefiklerine 20 tur boyunca _%20 hasar direnci_ ve Şövalyenin zırh glifinin etkisini _+%50 güç_ veren bir büyü olan _Koruma Halesi_ büyüsünü 2 şarj karşılığında yapabilir.\n\n_+2:_ Şövalye, kendisine ve 2 karo içindeki tüm müttefiklerine 20 tur boyunca _%30 hasar direnci_ ve Şövalyenin zırh glifinin etkisini _+%75 güç_ veren _Koruma Halesi_ büyüsünü 2 şarj karşılığında yapabilir.\n\n_+3:_ Şövalye, kendisine ve 2 karo içindeki tüm müttefiklerine 20 tur boyunca _%40 hasar direnci_ ve Şövalyenin zırh glifinin etkisini _+%100 güç_ veren bir büyü olan _Koruma Halesi_ büyüsünü 2 şarj karşılığında yapabilir..
actors.hero.talent.wall_of_light.title=Işık Duvarı
actors.hero.talent.wall_of_light.desc=_+1:_ Şövalye, _Işık Duvarı_ adlı büyüyü atabilir; bu büyü, Şövalye'nin önünde 3 kare genişliğinde sağlam bir duvar oluşturur, düşmanları iter ve 20 tur boyunca devam eder, 3 şarj karşılığında.\n\n_+2:_ Şövalye, _Işık Duvarı_ adlı büyüyü atabilir; bu büyü, Şövalye'nin önünde 5 kare genişliğinde sağlam bir duvar oluşturur, düşmanları iter ve 20 tur boyunca devam eder, 3 şarj karşılığında.\n\n_+3:_ Şövalye, _Işık Duvarı_ adlı büyüyü atabilir; bu büyü, Şövalye'nin önünde 7 kare genişliğinde sağlam bir duvar oluşturur, düşmanları iter ve 20 tur boyunca devam eder, 3 şarj karşılığında.\n\nDuvar, dört ana yön ya da diyagonal olarak yerleştirilebilir, ancak yalnızca bir duvar aynı anda var olabilir.

actors.hero.talent.divine_intervention.title=ilahi müdahale
actors.hero.talent.divine_intervention.desc=_+1:_ Ruhban, Yükselmiş Biçimdeyken, kendisini ve tüm müttefiklerini _150 kalkan gücüne_ kadar güçlendiren ve Yükselmiş Biçimi _3 tur_ uzatan _İlahi Müdahale,_ kullanabilir.\n\n_+2:_ Ruhban, Yükselmiş Biçimdeyken, kendisini ve tüm müttefiklerini _200 kalkan gücüne_ kadar güçlendiren ve Yükselmiş Biçimi _4 tur_ uzatan _İlahi Müdahale,_ kullanabilir.\n\n_+3:_ Ruhban, Yükselmiş Biçimdeyken, Ruhbanı ve tüm müttefiklerini _250 kalkan gücüne_ kadar güçlendiren ve Yükselmiş Biçimi _5 tur_ uzatan _İlahi Müdahale,_ kullanabilir.\n\n_+4:_ Ruhban, Yükselmiş Biçimdeyken, kendisini ve tüm müttefiklerini _300 kalkan gücüne_ kadar güçlendiren ve Yükselmiş Biçimi _6 tur_ uzatan _İlahi Müdahale,_ kullanabilir.\n\nİlahi Müdahale 5 kitap yüküne mal olur ve aynı yükselmiş biçimde yalnızca bir kez kullanılabilir.
actors.hero.talent.judgement.title=yargı
actors.hero.talent.judgement.desc=_+1:_ Ruhban, Yükselmiş Biçimdeyken, görünen tüm düşmanlara _10-20 hasar_ veren _Yargı,_ kullanabilir.\n\n_+2:_ Ruhban, Yükselmiş Biçimdeyken, görünen tüm düşmanlara _15-30 hasar_ veren _Yargı,_ kullanabilir.\n\n_+3:_ Ruhban, Yükselmiş Biçimdeyken, görünen tüm düşmanlara _20-40 hasar_ veren _Yargı,_ kullanabilir.\n\n_+4:_ Ruhban, Yükselmiş Biçimdeyken, görünür tüm düşmanlara _25-50 hasar_ veren _Yargı,_ kullanabilir.\n\nYargı 3 kitap yüküne mal olur. Yargı, Ruhban'ın Yükselmiş Biçim'e girdiğinden beri ya da Yargı'nın son kullanımından beri yaptığı her büyü için +%33 hasar verir.
actors.hero.talent.flash.title=Flaş
actors.hero.talent.flash.desc=_+1:_ Yükselmiş Biçim'deyken, Ruhban _3 karo_ uzağa ışınlanmak için _Flaş_ kullanabilir.\n\n_+2:_ Yükselmiş Biçim'deyken, Ruhban _4 karo_ uzağa ışınlanmak için _Flaş_ kullanabilir.\n\n_+3:_ Yükselmiş Biçim'deyken, Ruhban _5 karo_ uzağa ışınlanmak için _Flaş_ kullanabilir.\n\n_+4:_ Yükselmiş Biçim'deyken, Ruhban _6 karo_ uzağa ışınlanmak için _Flaş_ kullanabilir.\n\nFlaş başlangıçta 2 kitap şarjına mal olur ve aynı yükselmiş biçimde her kullanım için 1 şarj daha gerekir.

actors.hero.talent.body_form.title=Vücut Formu
actors.hero.talent.body_form.desc=Ruhban, _Beden Biçimi_ büyüsünü kullanarak Trinity’yi bu koşuda tanımladığı bir büyü veya rünle güçlendirir.\nBu işlem 2 yük harcar.\n\n_+1:_ Trinity kullanıldığında, Ruhban seçilen etkinin etkisini _20_ tur boyunca kazanır.\n_+2:_ Trinity kullanıldığında, Ruhban seçilen etkinin etkisini _27_ tur boyunca kazanır.\n_+3:_ Trinity kullanıldığında, Ruhban seçilen etkinin etkisini _33_ tur boyunca kazanır.\n_+4:_ Trinity kullanıldığında, Ruhban seçilen etkinin etkisini _40_ tur boyunca kazanır.\n\nTrinity aynı anda yalnızca bir beden etkisi ile güçlendirilebilir.\nSeçilen rün nadir ve güçlü ise Trinity’nin zırh yükü maliyeti daha yüksek olur.
actors.hero.talent.mind_form.title=Zihin Formu
actors.hero.talent.mind_form.desc=Ruhban, _Zihin Biçimi_ büyüsüyle Trinity’yi bu koşuda kullandığı bir asa veya fırlatmalı silahın gücüyle güçlendirir.\nBu işlem 3 yük harcar.\n\n_+1:_ Trinity kullanıldığında, Ruhban seçilen öğenin _+3_ seviyesindeki ışınlama veya fırlatma etkisini uygular.\n_+2:_ Trinity kullanıldığında, Ruhban seçilen öğenin _+4_ seviyesindeki ışınlama veya fırlatma etkisini uygular.\n_+3:_ Trinity kullanıldığında, Ruhban seçilen öğenin _+5_ seviyesindeki ışınlama veya fırlatma etkisini uygular.\n_+4:_ Trinity kullanıldığında, Ruhban seçilen öğenin _+6_ seviyesindeki ışınlama veya fırlatma etkisini uygular.\n\nTrinity aynı anda yalnızca bir zihin etkisi ile güçlendirilebilir.
actors.hero.talent.spirit_form.title=Ruh Formu
actors.hero.talent.spirit_form.desc=Ruhban, _Ruh Biçimi_ büyüsünü kullanarak Trinity’yi bu koşuda tanımladığı bir yüzük veya eser (kutsal kitap hariç) ile güçlendirir. Bu büyü 4 yük harcar.\n\n_+1:_ Trinity kullanıldığında, Ruhban 20 tur boyunca yüzüğün _+1_ seviyesindeki etkisini kazanır veya eserin _+4_ seviyesindeki etkisini tetikler.\n\n_+2:_ Trinity kullanıldığında, Ruhban 20 tur boyunca yüzüğün _+2_ seviyesindeki etkisini kazanır veya eserin _+6_ seviyesindeki etkisini tetikler.\n\n_+3:_ Trinity kullanıldığında, Ruhban 20 tur boyunca yüzüğün _+3_ seviyesindeki etkisini kazanır veya eserin _+8_ seviyesindeki etkisini tetikler.\n\n_+4:_ Trinity kullanıldığında, Ruhban 20 tur boyunca yüzüğün _+4_ seviyesindeki etkisini kazanır veya eserin _+10_ seviyesindeki etkisini tetikler.\n\nTrinity aynı anda yalnızca bir ruh etkisi taşıyabilir. Eserlerin etkileri ve zırh yük maliyetleri farklılık gösterir.

actors.hero.talent.beaming_ray.title=ışınlama ışını
actors.hero.talent.beaming_ray.desc=Ruhban, güçlendirilmiş bir müttefikten _Işınlayan Işın_ büyüsünü 1 yük harcayarak kullanabilir. Bu ışın duvarlardan geçebilir ve müttefiki hedeflenen konuma ışınlar. Eğer hedef konumda bir düşman varsa, müttefik düşmanın yanına çıkar ve ona saldırır. Işınlayan Işın, normalde hareket edemeyen müttefikleri bile ışınlayabilir ancak bu durumda menzili yarı yarıya azalır.\n\n_+1:_ Işınlayan Işın’ın maksimum menzili _4 karodur_ ve Çoğunluğun Gücü yeteneğinin en yakın düşmana verdiği hasar bonusunu 10 tur boyunca _%35 artırır_.\n\n_+2:_ Işınlayan Işın’ın maksimum menzili _8 karodur_ ve Çoğunluğun Gücü yeteneğinin en yakın düşmana verdiği hasar bonusunu 10 tur boyunca _%40 artırır_.\n\n_+3:_ Işınlayan Işın’ın maksimum menzili _12 karodur_ ve Çoğunluğun Gücü yeteneğinin en yakın düşmana verdiği hasar bonusunu 10 tur boyunca _%45 artırır_.\n\n_+4:_ Işınlayan Işın’ın maksimum menzili _16 karodur_ ve Çoğunluğun Gücü yeteneğinin en yakın düşmana verdiği hasar bonusunu 10 tur boyunca _%50 artırır_.
actors.hero.talent.life_link.title=can bağı
actors.hero.talent.life_link.desc=Rahip, kendisi ile güçlendirilmiş bir müttefiki arasında _Can Bağı_ kurabilir. Bu büyü, 2 yük karşılığında yapılır. Bu büyü, Rahip ile müttefiki arasındaki hasarın paylaşılmasına neden olur ve 3. seviye veya daha düşük yararlı rahip büyülerinin, taraflardan biri etkileniyorsa her ikisine de uygulanmasını sağlar.\n\n_+1:_ Can Bağı _10 tur_ sürer ve Çoğunluğun Gücü bonusu _%35 daha az hasar_ alınması olur.\n_+2:_ Can Bağı _13 tur_ sürer ve Çoğunluğun Gücü bonusu _%40 daha az hasar_ alınması olur.\n_+3:_ Can Bağı _17 tur_ sürer ve Çoğunluğun Gücü bonusu _%45 daha az hasar_ alınması olur.\n_+4:_ Can Bağı _20 tur_ sürer ve Çoğunluğun Gücü bonusu _%50 daha az hasar_ alınması olur.
actors.hero.talent.stasis.title=Durağanlık
actors.hero.talent.stasis.desc=Ruhban, güçlendirilmiş bir müttefik üzerinde 2 yük harcayarak _Durma_ büyüsünü kullanabilir. Durma, müttefiki geçici olarak zindandan çıkarır ve Çoğunluğun Gücü dahil tüm mevcut güçlendirmelerin kalan süresini korur. Etki sona erdiğinde müttefik senin yanına geri gelir. Durma büyüsü erken sonlandırılmak istenirse anında ve ücretsiz olarak tekrar kullanılabilir. Durma, hareket edemeyen müttefikler üzerinde de işe yarar ancak onları zindan katları arasında taşıyamaz.\n\n_+1:_ Durma büyüsü maksimum _60 tur_ sürer.\n\n_+2:_ Durma büyüsü maksimum _90 tur_ sürer.\n\n_+3:_ Durma büyüsü maksimum _120 tur_ sürer.\n\n_+4:_ Durma büyüsü maksimum _150 tur_ sürer.\n\nRuhban, müttefik Durma halindeyken onları tekrar çağırmak için Işınlayan Işın büyüsünü veya önceden etkisini uygulamak için Can Bağı büyüsünü kullanabilir. Ancak, müttefikler Durma halindeyken Can Bağı’nın etkisinden faydalanamazlar.


#universal
actors.hero.talent.heroic_energy.title=kahramanca enerji
actors.hero.talent.heroic_energy.rat_title=sıçansal enerji
actors.hero.talent.heroic_energy.desc=_+1:_ Kahramanın zırh yeteneği, _%12 azaltılmış_ şarj maliyetine sahiptir.\n\n_+2:_ Kahramanın zırh yeteneği, _%23 azaltılmış_ şarj maliyetine sahiptir.\n\n_+3:_ Kahramanın zırh yeteneği, _%32 azaltılmış_ şarj maliyetine sahiptir.\n\n_+4:_ Kahramanın zırh yeteneği, _%40 azaltılmış_ şarj maliyetine sahiptir.

actors.hero.talent.ratsistance.title=sıçan direnci
actors.hero.talent.ratsistance.desc=_+1:_ Düşmanca fareyle büyülenmiş düşmanlar _-10% hasar_ verir.\n\n_+2:_ Düşmanca, fareyle büyülenmiş düşmanlar _-19% hasar verir_.\n\n_+3:_ Düşmanca, fareyle büyülenmiş düşmanlar _-%27 hasar verir_.\n\n_+4:_ Sıçrayan düşmanlar %_-35 hasar_ verir.
actors.hero.talent.ratlomacy.title=sıçan mahremiyeti
actors.hero.talent.ratlomacy.desc=_+1:_ Ratmogrify'ı sıçan mogrifye edilmiş bir düşman üzerinde kullanmak onları dost yapar ve dönüşümü kalıcı kılar.\n\n_+2:_ Ratmogrify'ı fare mogrifye edilmiş bir düşman üzerinde kullanmak onları dostane yapar, dönüşümü kalıcı kılar ve onlara _2 tur_ adrenalin verir.\n\n_+3:_ Ratmogrify'ı fare mogrifye edilmiş bir düşman üzerinde kullanmak onları dost yapar,\ndönüşümü kalıcı kılar ve onlara _4 tur_ adrenalin verir.\n\n_+4:_ Ratmogrify'ı fare mogrifye edilmiş bir düşman üzerinde kullanmak onları dostça yapar, dönüşümü kalıcı kılar ve onlara _6 tur_ adrenalin verir.
actors.hero.talent.ratforcements.title=sıçan kuvvetleri
actors.hero.talent.ratforcements.desc=_+1:_ Ratmogrify'ı kendi üzerinizde kullanmak _yanınızda 1_ müttefik keseli sıçan yaratır.\n\n_+2:_ Ratmogrify'ı kendi üzerinizde kullanmak _yanınızda 2_ müttefik keseli sıçan yaratır.\n\n_+3:_ Ratmogrify'ı kendi üzerinizde kullanmak _yanınızda 3_ müttefik keseli sıçan yaratır.\n\n_+4:_ Kendi üzerinizde ratmogrify kullanmak _yanınızda 4_ müttefik keseli sıçanlar yaratır.



