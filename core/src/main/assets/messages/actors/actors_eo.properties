###blobs
actors.blobs.blizzard.name=neĝŝtormo
actors.blobs.blizzard.desc=Neĝŝtormo disvastiĝas tie ĉi.

actors.blobs.confusiongas.name=konfuza gaso
actors.blobs.confusiongas.desc=Nubeto de konfuziga gaso ĉirkaŭŝvebas tie ĉi.

actors.blobs.electricity.name=elektro
actors.blobs.electricity.desc=Elektra kampo hele fajreras tie ĉi.
actors.blobs.electricity.rankings_desc=Elektroŝokita
actors.blobs.electricity.ondeath=Vi mortis pro la elektroŝoko…

actors.blobs.fire.name=fajro
actors.blobs.fire.desc=Fajro brulegas tie ĉi.

actors.blobs.foliage.name=foliaro
actors.blobs.foliage.desc=Ekbriloj de lumo tralumigas la subteran ĝardenon.

actors.blobs.freezing.name=frosta aero
actors.blobs.freezing.desc=Aero estas nenature frosta tie ĉi.

actors.blobs.goowarn.name=malluma energio
actors.blobs.goowarn.desc=Eroj da malluma energio svarmas ĉi tie!

actors.blobs.inferno.name=incendio
actors.blobs.inferno.desc=Incendio disvastiĝas tie ĉi.

actors.blobs.paralyticgas.name=paraliza gaso
actors.blobs.paralyticgas.desc=Nubeto de paraliza gaso ĉirkaŭŝvebas tie ĉi.

actors.blobs.regrowth.name=rekreskado

actors.blobs.sacrificialfire.name=altaro de ofera fajro
actors.blobs.sacrificialfire.desc=Altaro sur kiu flamas blueta magia fajro. Ĉiu monstro senvivigita tie ĉi estos oferita al la spiritoj de la labirinto.\n\nEble iu rekompenco atendas pro fari sufiĉe da buĉoferoj?
actors.blobs.sacrificialfire.worthy=La fajro forbruligis vian buĉoferon kaj plifortiĝis.
actors.blobs.sacrificialfire.unworthy=La fajro forbruligis vian buĉoferon, sed ne ŝanĝiĝis.
actors.blobs.sacrificialfire.reward=La fajro ekbrilas kaj sekve disiĝas, forlasante post si rekompencon!

actors.blobs.smokescreen.name=fuma vualo
actors.blobs.smokescreen.desc=Nubeto de densa nigra fumo ĉirkaŭŝvebas tie ĉi.

actors.blobs.stenchgas.name=haladza gaso
actors.blobs.stenchgas.desc=Nubeto de haladza odoraĉo ĉirkaŭŝvebas tie ĉi.

actors.blobs.stormcloud.name=ŝtorma nubeto
actors.blobs.stormcloud.desc=Nubeto de saturita akva vaporo ĉirkaŭŝvebas tie ĉi.

actors.blobs.toxicgas.name=toksa gaso
actors.blobs.toxicgas.desc=Verdeta nubeto de toksa gaso ĉirkaŭŝvebas tie ĉi.
actors.blobs.toxicgas.rankings_desc=Gasumita
actors.blobs.toxicgas.ondeath=Vi mortis pro toksa gaso…

actors.blobs.corrosivegas.name=acidmorda gaso
actors.blobs.corrosivegas.desc=Nubeto de serioze acid-morda gaso ĉirkaŭŝvebas tie ĉi.

actors.blobs.waterofawareness.name=akvo de scio
actors.blobs.waterofawareness.procced=Tuj post trinki akvon el la puto, vi sentas, ke scio plenigas vian menson.
actors.blobs.waterofawareness.desc=Potenco de scio radias el akvo de tiu ĉi puto. Trinku el la puto por plene identigi ĉiujn surmetitajn aĵojn, identigi malbenojn de ĉiuj aĵoj en via dorsosako kaj malkaŝi ĉiujn aĵojn en la nuna keletaĝo.

actors.blobs.waterofhealth.name=akvo de sano
actors.blobs.waterofhealth.procced=Tuj post trinki akvon el la puto, vi sentas, ke viaj vundoj saniĝis tute.
actors.blobs.waterofhealth.desc=Potenco de sano radias el akvo de tiu ĉi puto. Trinku el la puto por sanigi viajn vundojn, satiĝi kaj forviŝi malbenojn de ĉiuj surmetitaj aĵoj.

actors.blobs.web.name=araneaĵo
actors.blobs.web.desc=Densa reto kovras ĉion tie ĉi. Ĉio, kio tuŝos ĝin aŭ estos ĵetita tien, rompos la reton kaj ankaŭ estos nemovebligita.



###buffs
actors.buffs.adrenaline.name=adrenalino
actors.buffs.adrenaline.desc=Pliiĝo de korpa forto, adrenalino plifortigas kaj rapidon de atako kaj de movado.\n\nAdrenalino ebligas al influato kuri je 2-obla rapido kaj ataki je 1,5-obla rapido.\n\nPliaj temperoj: %s.

actors.buffs.adrenalinesurge.name=plipovigo
actors.buffs.adrenalinesurge.desc=Alfluo de granda povo, bedaŭrinde sendaŭra.\n\nPliiĝo de povo: +%d.\nTemperoj ĝis pliiĝo etiĝos: %s.

actors.buffs.amok.name=murdemo
actors.buffs.amok.desc=Murdemo kaŭzas grandan furiozon kaj konfuzon por sia viktimo.\n\nKiam kreaĵo estas sub influo de mordemo, ĝi atakos kiun ajn proksimulon – kaj amikon kaj kontraŭulon.\n\nPliaj temperoj de murdemo: %s.

actors.buffs.arcanearmor.name=mistera ŝirmo
actors.buffs.arcanearmor.desc=Maldika ŝirmo ĉirkaŭas vin, blokante vundojn pro magiaj atakoj.\n\nVia magia ŝirmo estas nuntempe pliigita je 0-%d.\n\nTemperoj ĝis la mistera ŝirmo etiĝos: %s.

actors.buffs.artifactrecharge.name=antikvaĵa ŝargiĝado
actors.buffs.artifactrecharge.desc=Energio trafluas vin pliigante rapidon de ŝargado de viaj surmetitaj antikvaĵoj.\n\nĈiu antikvaĵo reagas malegale, sed ili ŝargiĝas pli rapide ol kutime.\n\nPliaj temperoj: %s.

actors.buffs.ascensionchallenge.name=malbeno de amuleto
actors.buffs.ascensionchallenge.desc=Iel Jog-Dzeva influas tiun ĉi mondon per la amuleto kaj malfaciligas al vi supreniri!\n\nLa malbona povo de Jog-Dzeva igas la labirinton signife pli danĝera per plimultigi kaj plifortigi monstrojn! Tiu povo plifortiĝos sen via atento, tamen vi povas malfortigi ĝin per venki kontraŭulojn plifortigitajn de Jog-Dzeva.
actors.buffs.ascensionchallenge.desc_clear=La malluma energio radiata de la amuleto estas nuntempe en sia minimuma intenseco.
actors.buffs.ascensionchallenge.desc_beckon=La amuleto nuntempe _alvokas malproksimajn monstrojn,_ sciigante ilin pri via pozicio.
actors.buffs.ascensionchallenge.desc_haste=La amuleto nuntempe _plirapidigas malproksimajn monstrojn,_ ebligante al ili atingi vin pli frue!
actors.buffs.ascensionchallenge.desc_slow=La amuleto nuntempe _malrapidigas vin_ kaj nuligas ĉiujn plirapidigajn efikojn.
actors.buffs.ascensionchallenge.desc_damage=La malluma energio de la amuleto tiel plifortiĝis, ke ĝi _senpere vundas vin!_
actors.buffs.ascensionchallenge.beckon=La amuleto ekigis alvoki malproksimajn monstrojn.
actors.buffs.ascensionchallenge.haste=La amuleto ekigis plirapidigi malproksimajn monstrojn!
actors.buffs.ascensionchallenge.slow=La amuleto en via dorsosako ekigis pezi kiel plumba balasto!
actors.buffs.ascensionchallenge.damage=La amuleto ekigis radii malluman energion. Ĝi ekflamis!
actors.buffs.ascensionchallenge.weaken_info=Eblas malfortigi la malbenon de la amuleto per venki pliajn monstrojn.
actors.buffs.ascensionchallenge.weaken_info_no_kills=Se vi venkos malamikojn, la malbeno de la amuleto malfortiĝos!
actors.buffs.ascensionchallenge.weaken=Vi sentas, ke malbeno de la amuleto iomete malfortiĝis.
actors.buffs.ascensionchallenge.break=Vi prenis profundan spiron kaj sentas, ke viaj vundoj komenciĝis saniĝi!
actors.buffs.ascensionchallenge.almost=Vi sentas, ke influo de Jog-Dzeva sur la amuleto malaperas, vi preskaŭ atingis la supraĵon!
actors.buffs.ascensionchallenge.on_kill=La malluma energio detruis vin…

actors.buffs.barkskin.name=ŝelhaŭto
actors.buffs.barkskin.desc=Via haŭto estas fortigita, ĝi ŝajnas dika kaj malmola kiel arboŝelo.\n\nLa fortigita haŭto pliigas vian efikan defendon, helpante al vi pli bone defendi kontraŭ korpa atako. \n\nVia defendo estas nuntempe pligrandiga je: 0-%d.\nTemperoj ĝis ŝelhaŭto etiĝos: %s.\n\nSe vi ricevos ŝelhaŭton de pluraj fontoj, nur la plej forta aplikiĝos.

actors.buffs.barrier.name=barilo
actors.buffs.barrier.desc=Rezista veziko de forto, kiu blokas ĉiujn atakojn.\n\nLa barilo sorbos atakojn ĝis protekta ŝirmo elĉerpiĝos. La ŝirmo ankaŭ malrapide perdiĝos kun tempo.\n\nPlia ŝirmo: %d.

actors.buffs.berserk.angered=kolerita
actors.buffs.berserk.berserk=berserkanta
actors.buffs.berserk.exhausted=lacega
actors.buffs.berserk.recovering=refortiĝanta
actors.buffs.berserk.angered_desc=Seriozeco de vundoj de Berserko plifortigas liajn frapojn. Kiam Berserko vundiĝas pro korpaj atakoj, li koleriĝas kaj tio pliigas lian vundpovon. Vundoj blokataj de defendaĵo plue enkalkuliĝas al pliiĝanta kolero.\n\nKolero malkreskas kun tempo. Ju malpli alta la sano de Berserko estas, des pli longe la kolero daŭros.\n\nJe 100%% kolero li “berserkas” akirante ŝirmon rilatan al nivelo de sia defendaĵo kaj al mankanta sano. Dum berserkado tiu ŝirmo etiĝas laŭtempe kaj kiam ĝi nuliĝos, Berserko devos ripozi antaŭ ol povi koleriĝi denove.\n\nNuna kolero: _%1$.0f%%_\n_+%2$.0f%%_ al vundpovo\n\nŜirmo de Berserko kun la nuna defendaĵo kaj sanpoentoj: _%3$d_
actors.buffs.berserk.berserk_desc=Timo kaj malcerteco elfluas kun sango, restas nur kolero. En tiu stato Berserko estas tre potenca _pliigante sian vundpovon je +50%% kaj akirante kroman ŝirmon,_ tamen tiu ŝirmo etiĝas kun ĉiu tempero.\n\nKiam tiu ŝirmo nuliĝos, la stato de “berserkado” finiĝos.\n\nKiam kolero finiĝos, Berserko devos refortiĝi antaŭ ol li povos koleriĝi ree.\n\nPlia ŝirmo: %d
actors.buffs.berserk.recovering_desc=Ena povo havas sian limigon. Berserko devas ripozi antaŭ li reuzos sian koleron.\n\nDum refortiĝado Berserko ne gajnas koleron pro ricevataj vundoj.
actors.buffs.berserk.recovering_desc_turns=Temperoj ĝis refortiĝo: _%d_
actors.buffs.berserk.recovering_desc_levels=Niveloj ĝis refortiĝo: _%.2f_
actors.buffs.berserk.rankings_desc=Berserkis ĝis morto
actors.buffs.berserk.action_name=berserkado
actors.buffs.berserk.no_seal=Vi devas porti vian rompitan sigelon por berserki!

actors.buffs.bleeding.name=sangadanta
actors.buffs.bleeding.ondeath=Vi sensangiĝis ĝis la morto…
actors.buffs.bleeding.heromsg=Vi sangadas!
actors.buffs.bleeding.rankings_desc=Sensangiĝis ĝis morto
actors.buffs.bleeding.desc=El tiu vundo sango ellasas minace.\n\nSangado vundas la viktimon kun ĉiu movo. Kun ĉiu movo tiu vundo hazarde plidoloriĝas, ĝis la sensangiĝado eventuale finiĝos\n\nAktuale perdataj vundpoentoj pro sangado: %d.

actors.buffs.bless.name=benita
actors.buffs.bless.desc=Ega ekbrilo da koncentrado, oni diras, ke ĝi estas inspirita de dioj.\n\nBenado pliigas lertecon kaj evitpovon je 25%%, igante la benatan pli efika en batalo.\n\nPliaj temperoj de benado: %s.

actors.buffs.blindness.name=blindumita
actors.buffs.blindness.heromsg=Vi estas blindumata!
actors.buffs.blindness.desc=Blindumo ŝanĝas la ĉirkaŭan mondon al senluma nebulo.\n\nDum blindumo, vidatingo de la viktimo etiĝas al unu kahelo, senutiligante forajn atakojn kaj plifaciligante al malamikoj perdi vian spuron. Krom tio, blindumata heroo ne povas legi skribrulaĵojn kaj librojn.\n\nPliaj temperoj de blindumo: %s.

actors.buffs.buff.heromsg=

actors.buffs.burning.name=brulanta
actors.buffs.burning.heromsg=Vi flamas!
actors.buffs.burning.burnsup=%s ekflamis!
actors.buffs.burning.ondeath=Vi flamadis ĝis la morto…
actors.buffs.burning.rankings_desc=Forbruligita ĝis cindro
actors.buffs.burning.desc=Nur kelkaj aferoj estas pli malplaĉaj ol esti brulanta kun flamo.\n\nFajro vundos vin ĉiumove ĝis ĝi estos estingita per akvo aŭ ĝi estingiĝos per si mem. Fajro povas esti estingita per enpaŝi akvon, aŭ per elŝpruco de disrompita eliksiro.\n\nKrom tio, la fajro povas ekbruligi bruligeblan teraĵon kaj aĵojn en kontakto kun ĝi.\n\nPliaj temperoj de flamado: %s.

actors.buffs.championenemy.warn=Vi sentas ĉeeston de morto.
actors.buffs.championenemy$blazing.name=majstro de fajro
actors.buffs.championenemy$blazing.desc=Majstroj de fajro kaŭzas je 25% pli da senpera vundpovo, bruligas atakatajn kontraŭulojn, estas rezistaj al fajro kaj disvastigas fajron je morto. Tamen ili ne povas disvastigi fajron sur akvon.
actors.buffs.championenemy$projecting.name=majstro de fora atako
actors.buffs.championenemy$projecting.desc=Majstroj de fora atako kaŭzas je 25% pli da senpera atako kaj ilia atakatingo estas pliigita je 3.
actors.buffs.championenemy$antimagic.name=majstro de malmagio
actors.buffs.championenemy$antimagic.desc=Majstroj de malmagio ricevas je 50% malpli da vundoj kaj estas tute rezistaj al magiaj efikoj.
actors.buffs.championenemy$giant.name=giganta majstro
actors.buffs.championenemy$giant.desc=Gigantaj majstroj ricevas je 80% malpli da vundoj kaj havas +1 por atakatingo, tamen ne povas moviĝi trans mallarĝaj koridoroj.
actors.buffs.championenemy$blessed.name=bena majstro
actors.buffs.championenemy$blessed.desc=Benaj majstroj havas 4-obligitajn precizon kaj evitpovon.
actors.buffs.championenemy$growing.name=kreskanta majstro
actors.buffs.championenemy$growing.desc=Kreskantaj majstroj gajnas daŭre kreskantan pliigon al precizo, evitpovo kaj korpa atako, kaj malpliigon al ricevataj vundoj.\n\nNuna pliigo al precizo/evitpovo/atako: %1$d%%\nNuna malpliigo al ricevataj vundoj: %2$d%%

actors.buffs.charm.name=ĉarmata
actors.buffs.charm.heromsg=Vi estas ĉarmata!
actors.buffs.charm.cant_attack=Tiu ĉi malamiko ĉarmis vin kaj pro tio vi ne povas lin ataki.
actors.buffs.charm.desc=Ĉarmo estas manipulanta magio, kiu povas igi kontraŭulojn dumtempe ami ilin reciproke.\n\nPersonoj sub la influo de ĉarmo ne poveblas ataki la kontraŭulon al kiu ili estas ĉarmataj. Ataki aliajn kontraŭuloj tamen estas ebla. Ŝoko pro doloro mallongigos daŭron de la ĉarmo.\n\nPliaj temperoj de ĉarmo: %s.

actors.buffs.chill.name=malvarmigita
actors.buffs.chill.freezes=%s malvarmiĝis!
actors.buffs.chill.desc=Ne tute frostigita, sed tro malvarma.\n\nMalvarmigitaj vivaĵoj agas pli malrapide, depende de kiom da temperoj la efiko plu daŭros. En la plej malbona okazo tio egalas esti malrapidigata.\n\nPliaj temperoj de malvarmigado: %1$s.\nRapido malpliigita je: %2$s%%

actors.buffs.combo.name=fraparo
actors.buffs.combo.action_name=fraparo
actors.buffs.combo.combo=%d-opa fraparo!
actors.buffs.combo.bad_target=Vi devas celi kontraŭulon en via atakatingo.
actors.buffs.combo.prompt=Elektu celon por ataki.
actors.buffs.combo.desc=Gladiatoro akiras impeton post ĉiu sukcesa frapo. Ĉiu frapo pliigas la frapar-numerilon je unu, sed tro longa paŭzo inter frapoj nuligos la numerilon. Kiam Gladiatoro akiras fraparon, ŝirmo pro lia rompita sigelo ne etiĝos.\n\nAkirado de fraparo ebligas specialajn neeviteblajn atakojn! Diversaj atakoj estas disponeblaj je 2, 4, 6, 8 kaj 10 frapar-numerilo. Iuj movoj nuligas la fraparon kaj aliaj ne, sed ĉiu movo povas esti uzita nur unufoje dum la frapar-serio.\n\nNuna fraparo: %1$d.\n\nTemperoj post kiuj la fraparo nuliĝos: %2$s.
actors.buffs.combo$combomove.clobber.name=surdigfrapo
actors.buffs.combo$combomove.clobber.desc=Forbatas malamikon je 2 kaheloj, ne vundas lin kaj ne povas forbati abismen. Pliigas fraparon je 1.
actors.buffs.combo$combomove.clobber.empower_desc=Forbatas malamikon je _3 kaheloj, igas lin “ebria” kaj povas forbati abismen_, tamen ne vundas lin. Pliigas fraparon je 1.
actors.buffs.combo$combomove.slam.name=krakigo
actors.buffs.combo$combomove.slam.desc=Vundas malamikon egale al %d%% (fraparo×20%%) de blokpovo de via defendaĵo. Nuligas fraparon post uzi.
actors.buffs.combo$combomove.slam.empower_desc=_Alsaltas maksimume %1$d kahelo(j)n_ kaj sekve vundas malamikon egale al %2$d%% (fraparo×20%%) de blokpovo de via defendaĵo. Nuligas fraparon post uzi.
actors.buffs.combo$combomove.parry.name=repuŝo
actors.buffs.combo$combomove.parry.desc=Blokas la sekvan atakon dum 1 tempero post aktivigo kaj tuj venĝas pro ĝi. Nuligas fraparon kiam nenio estas repuŝita.
actors.buffs.combo$combomove.parry.empower_desc=Blokas _ĉiujn atakojn_ dum 1 tempero post aktivigo kaj tuj venĝas pro ili. Nuligas fraparon kiam nenio estas repuŝita.
actors.buffs.combo$combomove.crush.name=frakaso
actors.buffs.combo$combomove.crush.desc=Vundas malamikon egale al %d%% (fraparo×25%%) de via permana vundpovo kontraŭ la ĉefa viktimo kaj duonon de tiu vundpovo kontraŭ ĉiuj aliaj malamikoj ene la areo 7×7. Nuligas fraparon post uzi.
actors.buffs.combo$combomove.crush.empower_desc=_Alsaltas maksimume %1$d kahelo(j)n_ kaj vundas malamikon egale al %2$d%% (fraparo×25%%) de via permana atako kontraŭ la ĉefa viktimo kaj duonon de tiu vundpovo kontraŭ ĉiuj aliaj malamikoj ene la areo 7×7. Nuligas fraparon post uzi.
actors.buffs.combo$combomove.fury.name=furiozo
actors.buffs.combo$combomove.fury.desc=Kaŭzas po unu frapo per ĉiu akirita frappoento, ĉiu frapo kaŭzas 60% de via vundpovo kaj povas ekigi ensorĉon. Nuligas fraparon post uzi.
actors.buffs.combo$combomove.fury.empower_desc=_Alsaltas maksimume %d kahelo(j)n_ kaj kaŭzas po unu frapo per ĉiu akirita frappoento, ĉiu frapo kaŭzas 60%% de via vundpovo kaj povas ekigi ensorĉon. Nuligas fraparon post uzi.

actors.buffs.corruption.name=koruptita
actors.buffs.corruption.desc=Korupto penetras en la ekzistaĵon kaj igas lin kontraŭ lia eksa naturo.\n\nKoruptitaj monstroj atakos siajn amikojn kaj ignoros siajn eksajn malamikojn. Korupto tamen detruiĝas kaj malrapide alkondukos la viktimon ĝis lia morto.\n\nKorupto estas ĉiamdaŭra, ĝi finiĝos nur je la morto.

actors.buffs.cripple.name=kripligita
actors.buffs.cripple.heromsg=Vi estas kripligita!
actors.buffs.cripple.desc=Vi certas, ke kruroj ne estu tiamaniere kurbigitaj.\n\nKriplo duonigas mov-rapidon farante movadon tra kahelo kutime du temperoj anstataŭ unu.\n\nPliaj temperoj de kriplo: %s.

actors.buffs.daze.name=konfuzita
actors.buffs.daze.heromsg=Vi estas konfuzita!
actors.buffs.daze.desc=Orelbruo kaj malklara vido ĝenas vin dum batalo.\n\nDum esti konfuzita via precizo kaj evitpovo malpliiĝas je 50%%, signife malfaciligante fari kaj eviti frapojn.\n\nPliaj temperoj de konfuzo: %s.

actors.buffs.degrade.name=degenerinta
actors.buffs.degrade.heromsg=Vi defendaĵo degeneris!
actors.buffs.degrade.desc=Potenca fimagio elsuĉas la povon, kiu devenas de skribrulaĵoj de plibonigo, kiujn vi uzis sur via armaĵo!\n\nKiam degenerinta, plibonigita armaĵo estos efektive je malpli alta nivelo. _Ĉiu plibonigo post +3 estos signife malpli forta ol la antaŭa._ Priskriboj de viaj armaĵoj ŝanĝiĝos konsiderante degeneron.\n\nDegenero ne efikas al postulata povo (por uzi armaĵon), ŝargoj de vergoj, firmeco de ĵetarmiloj kaj antikvaĵoj.\n\nPliaj temperoj de degenero: %s. Uzu skribrulaĵon de plibonigo aŭ de senmalbenigo por tuj fini degeneron.

actors.buffs.doom.name=pereigenda
actors.buffs.doom.desc=Estas malfacile kiam la ĉieo postulas vian morton.\n\nPereigendaj uloj ricevos je +67% pli da vundoj de ĉiuj fontoj.\n\nPereigo estas certega kaj finiĝos nur je la morto.

actors.buffs.dread.name=terurita
actors.buffs.dread.desc=Grandega timo, kiu instigas la viktimon forkuri tra la tuta labirinto!\n\nTeruritaj estaĵoj forkuros de malamiko je plena rapido kaj tute malaperos, kiam ĉesos esti videblaj. Monstroj forigitaj per tiu metodo ne faligos trezoron kaj rekompencos la heroon nur per duono de spert-poentoj. Ŝoko pro doloro povas malpliigi daŭron de tiu efiko.\n\nPliaj temperoj de teruro: %d.

actors.buffs.drowsy.name=dormema
actors.buffs.drowsy.desc=Sorĉa forto malfaciligas esti konscia, post kelkaj temperoj la viktimo falos en profundan magian dormon.\n\nLa heroo povas kontraŭstari dormon per vundiĝi aŭ per esti tutsana.\n\nTemperoj ĝis endormiĝo: %s.

actors.buffs.earthimbue.name=terplena
actors.buffs.earthimbue.desc=Vi estas plenigita per forto de la tero!\n\nĈiuj korpaj atakoj disŝovos la plankon sub la malamiko, kripligante ĝin por mallonga tempo.\n\nPliaj temperoj de terplenado: %s.

actors.buffs.enhancedrings.name=plibonigitaj ringoj
actors.buffs.enhancedrings.desc=La antaŭe uzita antikvaĵo de Fripono plifortigas liajn ringojn, pliigante iliajn nivelojn je 1.\n\nPliaj temperoj: %s.

actors.buffs.fireimbue.name=fajroplena
actors.buffs.fireimbue.desc=Vi estas plenigita per forto de fajro!\n\nĈiuj korpaj atakoj povos ekbruligi kontraŭulojn. Aldone vi estas tute fajrorezista.\n\nPliaj temperoj de fajroplenado: %s.

actors.buffs.foresight.name=antaŭvido
actors.buffs.foresight.desc=Iel vi povas senti per via menso aranĝon de la ĉirkaŭa tereno.\n\nDum esti sub la influo de antaŭvido, ĉiuj kaheloj ĉirkaŭ vi malkovriĝos, inkluzivante kaŝitajn pordojn kaj kaptilojn.\n\nPliaj temperoj de antaŭvido: %s.

actors.buffs.frost.name=frostigita
actors.buffs.frost.freezes=%s frostiĝis!
actors.buffs.frost.desc=Ne konfuzu tion ĉi kun peco de glacio, tiu ĉi nesuspektinda frostaĵego ordinare ĉirkaŭfermas la viktimon per glacio.\n\nFrostigo funkcias simile kiel paralizo, malebligante al la viktimo moviĝi. Kontraste al paralizo, frostigo senprokraste ĉesos se la viktimo estos vundita, kiam la glacio dispeciĝos.\n\nPliaj temperoj de frostigo: %s.

actors.buffs.frostimbue.name=frostplena
actors.buffs.frostimbue.desc=Vi estas plenigita per forto de frosto!\n\nĈiuj korpaj atakoj iomete malvarmigos kontraŭulojn. Krom tio, vi estas tute rezista kontraŭ frostiĝo.\n\nPliaj temperoj de frostplenado: %s.

actors.buffs.fury.name=furioza
actors.buffs.fury.heromsg=Vi furiozas!
actors.buffs.fury.desc=Vi furiozas, monstroj malŝatos vin kiam vi estas furioza.\n\nKolerego kondukas vin, pliigante vundpovon de viaj korpaj atakoj je 50%%.\n\nLa furiozo daŭros tiel longe, ĝis vi estas vundita kiel via sano malplias 50%%.

actors.buffs.blobimmunity.name=puriga barilo
actors.buffs.blobimmunity.desc=Iu stranga forto fermas vin en maldikan protektan barilon, blokante ĉiujn minacajn aerajn efikojn.\n\nVi estas rezista al ĉiuj aree-ligitaj efikoj kiam tiu ĉi barilo daŭras.\n\nPliaj temperoj de rezisto: %s.

actors.buffs.gravitychaostracker.name=gravita ĥaoso
actors.buffs.gravitychaostracker.desc_intro=Je ĉiuj kelkaj temperoj, ĉiuj uloj ene la nuna keletaĝo estos ĵetitaj hazard-direkten.
actors.buffs.gravitychaostracker.desc_positive=Tamen vi kaj viaj amikoj ŝajnas esti rezistaj al tiu efiko.
actors.buffs.gravitychaostracker.desc_duration=Estas malcerte kiel longe tiu ĉi efiko daŭros, sed ĝi ne povas daŭri senfine.

actors.buffs.greaterhaste.name=rapidemego
actors.buffs.greaterhaste.desc=Grandioza pliiĝo de rapido, por momente ĉio ŝajnas esti haltigita en tempo.\n\nSub la influo de rapidemego ĉiuj movoj daŭras neniun temperon, sed aliaj agoj plenumiĝas je norma rapido. Ĉiu paŝo uzas unu temperon da rapidemego.\n\nPliaj temperoj de rapidemego: %d.

actors.buffs.haste.name=rapidemo
actors.buffs.haste.desc=Energio trairas viajn muskolojn, ebligante al vi kuri je mirinda rapido!\n\nSub la influo de rapidemo vi kuros je la 3-obla rapido, sed faros aliajn agojn je norma rapido.\n\nPliaj temperoj de rapidemo: %s.

actors.buffs.healing.name=sanigado
actors.buffs.healing.desc=Magia forto igas viajn vundojn fermiĝi kaj cikatriĝi.\n\nJe ĉiu tempero via sano iom post iom repleniĝos, ĝis la efiko de sanigado finiĝos. Kvanto da sanigo povas malpliigi dum tempo.\n\nSekva sanigo: %d.\n\nPlia sanigo: %d.

actors.buffs.herodisguise.name=kamuflo
actors.buffs.herodisguise.desc=Iluzia magio influas al via fizika aspekto! La efiko estas plene ŝajna, tamen vi sentas vin nekutime.\n\nPliaj temperoj de kamuflo: %s.

actors.buffs.hex.name=fisorĉita
actors.buffs.hex.heromsg=Vi estas fisorĉita!
actors.buffs.hex.desc=Malluma povo malpliigas sinkoncentron, igante la viktimon iomete senorientigita.\n\nFisorĉo malpliigas precizon kaj evitpovon je 20%%, igante la viktimon malpli lerta dum batalo.\n\nPliaj temperoj de fisorĉo: %s.

actors.buffs.holdfast.name=firma pozicio
actors.buffs.holdfast.desc=Gladiatoro tenas sian pozicion, pliigante sian defendon je %1$d-%2$d kaj malrapidigante malaperan tempon de iuj bonaj efikoj je %3$d%%. La efiko ekzistos ĝis li moviĝos.

actors.buffs.hunger.hungry=malsata
actors.buffs.hunger.starving=malsatega
actors.buffs.hunger.onhungry=Vi malsatas.
actors.buffs.hunger.onstarving=Vi malsategas!
actors.buffs.hunger.ondeath=Vi malsategiĝis ĝis la morto…
actors.buffs.hunger.cursedhorn=La malbenita korno ŝtelas iom da via manĝ-energio kiam vi manĝas.
actors.buffs.hunger.rankings_desc=Malsategiĝis ĝis morto
actors.buffs.hunger.desc_intro_hungry=Vi sentas, ke via stomako postulas manĝaĵon, tamen tio ne urĝas ankoraŭ.
actors.buffs.hunger.desc_intro_starving=Vi suferas pro malsatego.
actors.buffs.hunger.desc=\n\nMalsato iom post iom pliiĝas kiam vi pasigas la tempon en la labirinto, finfine vi ekos malsatega. Dum malsatego vi malrapide perdos sanon anstataŭ regajni ĝin.\n\nPorciumado gravas! Se vi havas tro multe da sano, estado malsatega ne estas malbona ideo, ĉar tiel vi ŝparos nutraĵon por poste. Efika porciumado povas fari, ke via manĝaĵo sufiĉos pli longe!

actors.buffs.invisibility.name=nevidebla
actors.buffs.invisibility.desc=Vi tute similiĝas al la ĉirkaŭaĵo, oni ne povas vidi vin.\n\nKiam vi estas nevidebla, monstroj ne povas ataki kaj spuri vin. Korpaj atakoj kaj uzo de magiiloj (kiel skribrulaĵoj kaj vergoj) tuje ĉesigos nevideblecon.\n\nPliaj temperoj de nevidebleco: %s.

actors.buffs.invulnerability.name=nevundebla
actors.buffs.invulnerability.desc=Tiu ĉi ulo estas plenigita per potenca defenda forto, igante lin nevundebla por mallonga tempo!\n\nPliaj temperoj de nevundebleco: %s.

actors.buffs.levitation.name=aerportiĝado
actors.buffs.levitation.desc=Magia forto igas vin portiĝi super la tero sentigante vin senpeza.\n\nAeroportiĝantaj uloj silente moviĝas kaj ignoras ĉiujn terajn efikojn. Kaptiloj ne aktiviĝos, akvo ne estingos fajron, plantoj ne estos piedpremitaj, radikoj ne kaptos kaj ne eblos fali abismon. Estu singarda, ĉar la menciitaj efikoj finiĝos senprokraste kun la ĉeso de aerportiĝado!\n\nPliaj temperoj de aerportiĝado: %s.

actors.buffs.lifelink.name=vivligilo
actors.buffs.lifelink.ondeath=Vundoj de la vivligilo mortigis vin…
actors.buffs.lifelink.desc=Vivenergio de tiu estaĵo estas ligita al alia proksima ulo. Ĉiuj ricevataj vundoj dividiĝas inter ambaŭ ili.\n\nKiam tiu vivaĵo vundiĝos, duono de vundpoentoj transiĝos al la ligita viktimo.\n\nPliaj temperoj de vivligilo: %s.

actors.buffs.light.name=prilumata
actors.buffs.light.desc=Eĉ en la plej malluma labirinto senhalta lumo ĉe via flanko ĉiam oportunas.\n\nLumo helpas al vi vidi je la konforma distanco malgraŭ la ĉirkaŭaĵo.\n\nPliaj temperoj de prilumado: %s.

actors.buffs.lockedfloor.name=keletaĝo estas ŝlosita
actors.buffs.lockedfloor.desc=La nuna keletaĝo estas ŝlosita kaj vi ne poveblas ellasi ĝin!\n\nKiam keletaĝo estas ŝlosita, vi ne malsatiĝos aŭ suferos pro malsatego. Krom tio, se vi ne laboras pri venko kontraŭ supermonstro, pasiva resaniĝado ankaŭ ĉesos.\n\nAldone, se vi estas revivigita de ne-benita anĥo kiam la keletaĝo estas ŝlosita, tiam la keletaĝo rekomenciĝos.\n\nVenku la supermonstron de tiu ĉi keletaĝo por malŝlosi.

actors.buffs.lostinventory.name=perdita dorsosako
actors.buffs.lostinventory.desc=Vi perdis viajn havaĵojn ie en la labirinto! Vi ne povas kolekti aŭ uzi plejparton de aĵoj ĝis vi trovos vian perditan dorsosakon.

actors.buffs.magicalsight.name=magia vido
actors.buffs.magicalsight.desc=Iel vi povas vidi per via menso pli bone ol per viaj okuloj.\n\nDum daŭrado de la magia vido vi povas vidi trans ĉiu tereno ene la radiuso de 12 kaheloj.\n\nPliaj temperoj de magia vido: %s.

actors.buffs.magicalsleep.name=magia dormo
actors.buffs.magicalsleep.toohealthy=Vi estas tro sana kaj rezistas la deziron de dormo.
actors.buffs.magicalsleep.fallasleep=Vi falis en profundan magian dormon.
actors.buffs.magicalsleep.wakeup=Vi vekiĝis fartante bone kaj sane.
actors.buffs.magicalsleep.desc=Tiu ĉi vivaĵo falis en profundan magian dormon, el kiu li ne povas vekiĝi nature.\n\nMagia dormo similas kutiman dormon, kun escepto de nur vundiĝo kaŭzos la viktimon vekiĝi.\n\nPor la heroo kaj liaj amikoj, magia dormo posedas kelkan sanigan efikon, kiu ebligas ilin rapide saniĝi ripozante.

actors.buffs.magicimmune.name=magiorezista
actors.buffs.magicimmune.desc=Ĉiuj magiaj efikoj ne povas influi vin, vi estas tute rezista al ili.\n\nDum kiam rezisto al magio agas, ĉiuj helpaj kaj malhelpaj magiaj efikoj ne influas vin, ampleksante malbenojn, ensorĉojn, vergojn, skribrulaĵojn, ringojn, antikvaĵojn, ktp. Kapabloj de heroaj defendaĵoj estas sufiĉe fortaj por funkcii malgraŭ tiu efiko.\n\nPliaj temperoj de magiorezisto: %s.

actors.buffs.mindvision.name=mensvido
actors.buffs.mindvision.desc=Iumaniere vi povas vidi ĉiujn monstrojn en tiu ĉi keletaĝo per via menso. Tio estas stranga sento.\n\nĈiuj monstroj en tiu ĉi etaĝo estas videblaj tiel longe kiel vi havas mensvidon. Vido de monstro per mensvido traktas ĝin kiel vidantan aŭ proksiman por la okazo de uzo de magiaj efikoj.\n\nPliaj temperoj de mensvido: %s.

actors.buffs.momentum.momentum=gajnante movizon
actors.buffs.momentum.running=sprinto
actors.buffs.momentum.resting=refortiĝanta
actors.buffs.momentum.action_name=sprinto
actors.buffs.momentum.momentum_desc=Dum moviĝi la sprintisto gajnas “movizon”, kiun li povas uzi por sprinti.\n\nĈiu ŝargo de movizo ebligas al li sprinti por du temperoj, kaj la sprintisto povas maksimume gajni 10 ŝargojn de movizo. La movizo rapide perdiĝas kiam la sprintisto ĉesas moviĝi.\n\nNunaj ŝargoj de movizo: %d.
actors.buffs.momentum.running_desc=Dum moviĝi Sprintisto gajnas “movizon”, kiun li povas uzi por sprinti.\n\nDum sprinti Sprintisto moviĝas je duobla rapido kaj akiras aldonan evitpovon depende de lia nivelo.\n\nPliaj temperoj: %d.
actors.buffs.momentum.resting_desc=Dum moviĝi Sprintisto gajnas “movizon”, kiun li povas uzi por sprinti.\n\nSprintisto bezonas tempon por reakiri sian viglecon antaŭ li denove povos gajni movizon.\n\nPliaj temperoj: %d.

actors.buffs.monkenergy.name=energio
actors.buffs.monkenergy.action=kapabloj de Monaĥino
actors.buffs.monkenergy.desc=Pro ĉiu venkita malamiko Monaĥino akiras energion, kiun ŝi povas uzi por diversaj kapabloj. Venko de plejparto da malamikoj donas al ŝi po 1 energipoento kaj la energio ne perdiĝas kun fluo de tempo.\n\nNuna energio: %1$d/%2$d.
actors.buffs.monkenergy.desc_cooldown=Monaĥino lastatempe utiligis sian kapablon kaj devas atendi antaŭ la sekva uzo.\n\nTemperoj por atendi: %d.
actors.buffs.monkenergy$monkability$flurry.name=fluo da frapoj
actors.buffs.monkenergy$monkability$flurry.desc=Du sinsekvaj frapoj kaŭzantaj po %1$d-%2$d vundpoentoj kaj preterlasantaj defendaĵon. Ne eblas uzi tiun kapablon fojo post fojo.
actors.buffs.monkenergy$monkability$flurry.empower_desc=Du sinsekvaj frapoj kaŭzantaj po %1$d-%2$d vundpoentoj, preterpasantaj defendaĵon kaj _ekigantaj ensorĉon de via armilo_. Ne eblas uzi tiun kapablon fojo post fojo.
actors.buffs.monkenergy$monkability$focus.name=koncentro
actors.buffs.monkenergy$monkability$focus.desc=Monaĥino pasigas unu temperon por koncentriĝi, post kiu ŝi povos repuŝi la sekvan atakon.
actors.buffs.monkenergy$monkability$focus.empower_desc=Monaĥino _senprokraste koncentriĝas_ kaj povas repuŝi la sekvan atakon.
actors.buffs.monkenergy$monkability$focus$focusbuff.name=koncentro
actors.buffs.monkenergy$monkability$focus$focusbuff.desc=Monaĥino koncentriĝis sur la ĉirkaŭaĵo kaj atendas la sekvan atakon. Dum esti koncentrita ŝi certe repuŝos la sekvan ricevotan atakon.
actors.buffs.monkenergy$monkability$dash.name=alsalto
actors.buffs.monkenergy$monkability$dash.prompt=Elektu kien salti
actors.buffs.monkenergy$monkability$dash.desc=Senprokrasta salto je distanco de maksimume 4 kaheloj. Tiu ĉi kapablo ebligas transpasi danĝeraĵojn, sed ne kontraŭulojn aŭ murojn.
actors.buffs.monkenergy$monkability$dash.empower_desc=Senprokrasta salto je distanco de maksimume _8 kaheloj_. Tiu ĉi kapablo ebligas transpasi danĝeraĵojn, sed ne kontraŭulojn aŭ murojn.
actors.buffs.monkenergy$monkability$dragonkick.name=rondmova piedbato
actors.buffs.monkenergy$monkability$dragonkick.desc=Detruanta piedbato kaŭzanta %1$d-%2$d vundpoentojn kaj preterlasanta defendaĵon. Tiu piedbato forbatas la viktimon kaj paralizigas lin proporcie al forbatita distanco.
actors.buffs.monkenergy$monkability$dragonkick.empower_desc=Detruanta piedbato kaŭzanta _%1$d-%2$d vundpoentojn_ kaj preterlasanta defendaĵon. Tiu piedbato forbatas _ĉiujn apudajn malamikojn_ kaj paralizas ilin proporcie al forbatita distanco.
actors.buffs.monkenergy$monkability$meditate.name=medito
actors.buffs.monkenergy$monkability$meditate.desc=Monaĥino koncentras energion en sia korpo dum 5 temperoj. Medito nuligas plejparton da malbonaj efikoj kaj donas al ŝi 8 temperojn da ŝargado de vergoj kaj antikvaĵoj.
actors.buffs.monkenergy$monkability$meditate.empower_desc=Monaĥino koncentras energion en sia korpo dum 5 temperoj. Medito nuligas plejparton da malbonaj efikoj kaj donas al ŝi 8 temperojn da ŝargado de vergoj kaj antikvaĵoj. _Ŝi ankaŭ akiras 80% vund-reziston dum mediti kaj iom post iom resaniĝos al 20% de mankanta sano._

actors.buffs.ooze.name=mordata per acido
actors.buffs.ooze.heromsg=Morda ĥemiaĵo mordas vian karnon. Forlavu ĝin!
actors.buffs.ooze.ondeath=Vi estas dismordita…
actors.buffs.ooze.rankings_desc=Dismordita per acido
actors.buffs.ooze.desc=Tiu ĉi gluema acido suriĝas karnon kaj malrapidete dismordas ĝin.\n\nMorda ĥemiaĵo serioze vundos kun kreskado de tempo, sed tuj forlaviĝas per akvo.\n\nPliaj temperoj de acidmordado: %s.

actors.buffs.paralysis.name=paralizita
actors.buffs.paralysis.heromsg=Vi estas paralizita!
actors.buffs.paralysis.out=senparalizigita
actors.buffs.paralysis.desc=Ofte la plej malbona aĵo por fari estas fari nenion.\n\nParalizo komplete haltigas ĉiujn agojn devigante la viktimon atendi ĝis la efiko finiĝos. La sufero pro esti vundita ankaŭ povas kaŭzi la viktimon liberiĝi el paralizo.\n\nPliaj temperoj de paralizo: %s.

actors.buffs.physicalempower.name=korpe plifortigita
actors.buffs.physicalempower.desc=Viaj pugnobatoj estas plifortigitaj pliigante vian vundpovon per korpaj atakoj kontraŭ malamikoj.\n\nEkstra vundpovo: %1$d.\nPliaj frapoj: %2$d.

actors.buffs.pincushion.name=pinglokusenulo
actors.buffs.pincushion.desc=La ĵetarmiloj uzitaj kontraŭ tiu ĉi malamiko alkroĉiĝis al li kaj falos teren kiam la malamiko estos venkita.\n\nNune la jenaj ĵetarmiloj alkroĉiĝis:

actors.buffs.poison.name=venenita
actors.buffs.poison.heromsg=Vi estas venenita!
actors.buffs.poison.ondeath=Vi mortis pro veneno…
actors.buffs.poison.rankings_desc=Venenita
actors.buffs.poison.desc=Veneno saturas la korpon, iom post iom perturbante ĝian funkciadon.\n\nVeneno vundas je ĉiu tempero depende de kialonge ĝi daŭros.\n\nPliaj temperoj de venenado: %s.

actors.buffs.preparation.name=preparo
actors.buffs.preparation.action_name=preparita frapo
actors.buffs.preparation.desc=La kaŝmortigisto atendas kun pacienco, preparante frapi malantaŭ de ombroj.
actors.buffs.preparation.desc_dmg=Lia sekva atako kaŭzos _%1$d%% de ekstraj vundoj_ kaj senvivigos kutimajn monstrojn kun malpli ol _%2$d%% da sano_ aŭ supermonstrojn kun malpli ol _%3$d%% da sano._
actors.buffs.preparation.desc_dmg_likely=La sekva atako probable kaŭzos multege da vundoj.
actors.buffs.preparation.desc_blink=Li povas ekaperi ĉe malamiko antaŭ ol frapi ĝin, de maksimuma distanco da _%d._
actors.buffs.preparation.desc_invis_time=Temperoj dum esti nevidebla: _%d._
actors.buffs.preparation.desc_invis_next=Pli forta atako post _%d_ temperoj.
actors.buffs.preparation.prompt=Elektu celon por ataki!\nMaksimuma distanco por ekaperi: %d
actors.buffs.preparation.no_target=Tie estas nenio por ataki.
actors.buffs.preparation.out_of_reach=Tiu celo estas ekster atingo.
actors.buffs.preparation.assassinated=kaśmortigita

actors.buffs.prismaticguard.name=prisma gardisto
actors.buffs.prismaticguard.desc=Via estas gardata de prisma figuro, kiu nuntempe estas malaktiva. Kiam malamikoj alproksimigos vin, la prisma gardisto plenumos sian ŝuldon!\n\nKiam malaktiva, la prisma figuro iom post iom resaniĝos de akiritaj vundoj.\n\nNuna sano: %d/%d.
actors.buffs.prismaticguard.desc_many=Tiu prisma figuro ankaŭ profitas de la plurforto. Pliaj temperoj: %d.

actors.buffs.recharging.name=ŝargiĝado
actors.buffs.recharging.desc=Energio trafluas vin pliigante la rapidon kiel viaj vergoj kaj bastonegoj ŝargiĝas.\n\nJe ĉiu tempero tiu ĉi sorĉo pliigos vian aktualan ŝargon je kvarono aldone al norma ŝargiĝado.\n\nPliaj temperoj de ŝargiĝado: %s.

actors.buffs.revealedarea.name=malkovrita areo
actors.buffs.revealedarea.desc=Areo de la labirinto estas momente malkovrita al la heroo. Li povas vidi tiun areon de ajna loko.\n\nPliaj temperoj: %s.

actors.buffs.revealedchar.name=malkovrita estaĵo
actors.buffs.revealedchar.desc=Tiu ĉi ulo estas malkovrita al la heroo. Li estos videbla por vi de ĉie.\n\nPliaj temperoj: %s.

actors.buffs.roots.name=enradikigita
actors.buffs.roots.heromsg=Vi ne povas moviĝi!
actors.buffs.roots.desc=Radikoj (magiaj aŭ naturaj) kaptis la piedojn alfiksante ilin al la tero.\n\nRadikoj fiksas la viktimon en lia loko malebligante al li moviĝi. Alia agoj ne estas blokitaj, inkluzivante teleportadon.\n\nPliaj temperoj de enradikigado: %s.

actors.buffs.scrollempower.name=skribrulaĵa povigo
actors.buffs.scrollempower.desc=La energio de skribrulaĵo – kiun Magiisto laste legis – nun pliniveligas liajn vergojn!\n\nPliniveligo de vergoj: +%1$d.\nPliaj vergopafoj: %2$d.

actors.buffs.shadows.name=kunombrigita
actors.buffs.shadows.desc=Vi kunligis kun ombroj ĉirkaŭ vi, tio ĉi igas vin nevidebla kaj malrapidigas vian metabolon.\n\nKiam vi estas nevidebla, kontraŭuloj ne povas ataki kaj spuri vin. Plejparto de korpaj atakoj kaj uzo de magiiloj (kiel skribrulaĵoj kaj vergoj) tuje ĉesigos nevideblecon. Krom tio, kiam vi estas kunombrigita, vi malsatigas malpli rapide.\n\nVi restos kunombrigita ĝis vi forlasos la ombrojn aŭ kiam kontraŭulo tuŝos vin.

actors.buffs.slow.name=malrapidigata
actors.buffs.slow.desc=Magio de malrapidigado influas senton de tempo de la viktimo tiel, ke al li ĉio moviĝas rapidege.\n\nMalrapidigata persono faras ĉiujn agojn duoble pli malrapide ol normale.\n\nPliaj temperoj de malrapidigado: %s.

actors.buffs.snipersmark.name=celpafista marko
actors.buffs.snipersmark.action_name_snapshot=ekpafo
actors.buffs.snipersmark.action_name_volley=salvo
actors.buffs.snipersmark.action_name_sniper=celpafo
actors.buffs.snipersmark.desc=Celpafistino koncentriĝas sur la antaŭe atakita celo. Ŝi povas fari specialan atakon per sia pafarko, kiu dependos de maniero kiel la pafarko estas plivastigita.\n\nPer neplivastigita pafarko eblas fari _ekpafon,_ kiu ete vundos, sed ne necesos tempon por pafi.\n\nPer pafarko plivastigita por rapido eblas fari _salvon_ da tri sagoj. Ĉiu sago ete vundos, sed plue povos aktivigi ensorĉon. Okupas 1 temperon por pafi.\n\nPer pafarko plivastigita por vundpovo eblas fari _celpafon._ Tiu pafo certe trafos, kaŭzos kromajn vundojn surbaze de distanco al la celo kaj okupos 2 temperojn por pafi.\n\nPliaj temperoj: %s.

actors.buffs.soulmark.name=markita spirito
actors.buffs.soulmark.desc=Sorĉisto ekrigardis en la spiriton de tiu ĉi kreaĵo, ebligante al la heroo saniĝi kiam ĝi ricevas vundiĝas per korpaj atakoj.\n\nPliaj temperoj de spirit-markado: %s.

actors.buffs.stamina.name=vigleco
actors.buffs.stamina.desc=Vi havas senfinan viglecon, kiu ebligas al vi movi pli rapide!\n\nSub la influo de tiu efiko vi kuros je +50%% rapido, sed aliajn movojn vi faros je norma rapido.\n\nPliaj temperoj de vigleco: %s.

actors.buffs.vulnerable.name=vundebla
actors.buffs.vulnerable.heromsg=Vi sentas vin pli vundebla!
actors.buffs.vulnerable.desc=Vundebla magio pliigas ĉiun korpan atakon ricevitan de la viktimo je 33%%, kalkulita post vund-evito de defendaĵo.\n\nPliaj temperoj de vundeblo: %s.

actors.buffs.terror.name=timigita
actors.buffs.terror.desc=Timo estas manipulanta magio, kiu igas la viktimon paniki.\n\nTimigitaj kreaĵoj forkuras de siaj kontraŭuloj lasante kiel eble plej multe da pordoj kaj muroj malantaŭe. Tamen la ŝoko pro frapo mallongigos daŭron de la efiko.\n\n\nPliaj temperoj de timo: %s.

actors.buffs.toxicimbue.name=venenplena
actors.buffs.toxicimbue.desc=Vi estas plenigita per veneniga energio!\n\nKiam vi moviĝas, toksa gaso konstante eliĝas de vi, kaj vundas viajn kontraŭulojn. Vi estas imuna al toksa gaso kaj veneno dum la agado de tiu efiko kaj kelkaj temperoj poste.\n\nPliaj temperoj de venenplenado: %s.

actors.buffs.corrosion.name=korodo
actors.buffs.corrosion.heromsg=Vi dismordiĝas!
actors.buffs.corrosion.ondeath=Vi estas dismordita…
actors.buffs.corrosion.rankings_desc=Dismordita per acido
actors.buffs.corrosion.desc=Fortaj acidoj dissolvas karnon, metalon kaj ostojn je freneza rapido.\n\nVundado pro korodo pliiĝas kun tempo, do la viktimo pluas dismordiĝi.\n\nPliaj temperoj da korodo: %1$s.\nNuna vundado pro korodo: %2$d.

actors.buffs.vertigo.name=ebria
actors.buffs.vertigo.desc=Movado laŭ rekta linio povas esti malfacila kiam la tuta mondo turniĝas.\n\nEn la stato de ebrio, uloj provantaj moviĝi, iros en la hazarda direkto anstataŭ tien, kien ili intencis iri.\n\nPliaj temperoj de ebrio: %s.

actors.buffs.wandempower.name=plifortigitaj vergoj
actors.buffs.wandempower.desc=Viaj vundaj vergoj estas plifortigitaj, pliigante ilian vundpovon kaŭzotan pro kelkaj celaj pafoj.\n\nEkstra vundpovo: %1$d.\nPliaj celaj pafoj: %2$d.

actors.buffs.weakness.name=senfortigita
actors.buffs.weakness.heromsg=Vi sentas vin senfortigita!
actors.buffs.weakness.desc=Ĉio ŝajnas esti tre pli peza.\n\nSenfortiganta magio malpliigas korpan forton de la viktimo, malpliigante lian vundpovon je 33%%.\n\nPliaj temperoj de senfortigado: %s.

actors.buffs.wellfed.name=satmanĝinta
actors.buffs.wellfed.desc=Vi manĝadis ĝis esti sata.\n\nDum esti satmanĝinta, via malsato ne pliiĝos kaj vi saniĝos dum tempo.\n\nPliaj temperoj de satmanĝo: %d.



###hero

##abilities
actors.hero.abilities.armorability.self_target=Vi ne povas celi vin mem!
actors.hero.abilities.armorability.no_target=Tie estas nenio por celi!
actors.hero.abilities.armorability.prompt=Elektu kien celi
actors.hero.abilities.armorability.cost=Necesaj ŝargoj: _%d_

actors.hero.abilities.warrior.heroicleap.name=heroa salto
actors.hero.abilities.warrior.heroicleap.prompt=Elektu kiadirekten salti
actors.hero.abilities.warrior.heroicleap.short_desc=Batalisto povas fari _heroan salton_ al elektita loko, transsaltante malamikojn kaj danĝeraĵojn.
actors.hero.abilities.warrior.heroicleap.desc=Batalisto saltas al elektita loko trans malamikoj kaj danĝeraĵoj. Tamen li ne povas transsalti murojn aŭ firman terenon.
actors.hero.abilities.warrior.shockwave.name=ŝokondo
actors.hero.abilities.warrior.shockwave.short_desc=Batalisto povas ellasi konusforman _ŝokonodon_ per bati teren. Kontraŭuloj trafitaj de la ŝokondo vundiĝos kaj kripliĝos.
actors.hero.abilities.warrior.shockwave.desc=Batalisto batas la teron per sia pugno kaŭzante ŝokondon, kiu trairas maksimume 5 kahelojn formante 60° konuson.\n\nKontraŭuloj trafitaj per tiu ŝokondo estos kripligitaj por 5 temperoj. Ili ankaŭ ricevos 5-10 vundpoentojn kaj po 1-2 vundpoentoj por ĉiu povpoento de Batalisto super 10.
actors.hero.abilities.warrior.endure.name=sufero
actors.hero.abilities.warrior.endure$enduretracker.name=postsufera kolero
actors.hero.abilities.warrior.endure$enduretracker.desc=Batalisto nun kaŭzas ekstrajn vundojn rilatajn al la vundoj, kiun li trasuferis.\n\nEkstra vundpovo: %1$d\nPliaj frapoj: %2$d
actors.hero.abilities.warrior.endure.short_desc=Batalisto povas transatendi kaj _trasuferi_ kelkajn temperojn por ricevi vund-reziston. Post tiu periodo li akiros aldonan vundpovon surbaze de la vundoj ricevitaj dum atendi.
actors.hero.abilities.warrior.endure.desc=Batalisto transatendas 3 temperojn ricevante duonon de vundoj de ĉiuj fontoj. Tiu duonigo aplikiĝas al la originaj vundpoentoj – antaŭ ol esti reduktita de defendaĵo kaj aliaj efikoj.\n\nPost trasuferi, la sekva frapo de Batalisto dum 10 temperoj havos ekstran vundpovon. Tiu ekstra vundpovo egalos al la duono de ĉiuj ricevitaj (originaj) vundoj dum transatendi.\n\nSe Gladiatoro plenumos iun fraparon, uzo de tiu kapablo prokrastos nuliĝon de la fraparo je 3 temperoj.

actors.hero.abilities.mage.elementalblast.name=magia eksplodo
actors.hero.abilities.mage.elementalblast.no_staff=Vi ne povas uzi tiun ĉi kapablon sen via bastonego.
actors.hero.abilities.mage.elementalblast.short_desc=Magiisto povas ellasi _magian eksplodon_ per sia bastonego, kiu kovros vastan areon ĉirkaŭ li per efiko rilata al la vergo uzita por plenigi la bastonegon.
actors.hero.abilities.mage.elementalblast.desc=Magiisto ellasas magian eksplodon, kiu kovras cirklon kun la radiuso de 4 kaheloj kaj kaŭzas 15-25 vundpoentojn. La efiko de tiu kapablo dependas de vergo uzita por plenigi la bastonegon.
actors.hero.abilities.mage.elementalblast.generic_desc=Ĝi estas simila al la efiko, kiu aperas dum pafi monstron aŭ amikon per la vergo.
actors.hero.abilities.mage.wildmagic.name=sovaĝa magio
actors.hero.abilities.mage.wildmagic.no_wands=Vi havas neniun vergon por pafi!
actors.hero.abilities.mage.wildmagic.short_desc=Magiisto povas liberigi _sovaĝan magion_ dormantan en liaj vergoj per hazarde pluroble pripafi la elektitan celon dum unu tempero.
actors.hero.abilities.mage.wildmagic.desc=Magiisto liberigas la povon de liaj vergoj per hazarde uzi ilin maksimume kvaroble dum unu tempero. La bastonego de Magiisto ne estas uzata.\n\nNivelo de ĉiu vergo pliiĝas je 2, sed ĝia maksimuma nivelo povas esti +3. Tiu ĉi kapablo konsumas po duono de ŝargo por ĉiu pafo kaj neniu vergo povas pafi pli ol 2 foje.
actors.hero.abilities.mage.warpbeacon.name=teleport-marko
actors.hero.abilities.mage.warpbeacon.depths=Vi ne povas teleportiĝi inter keletaĝoj!
actors.hero.abilities.mage.warpbeacon.locked_floor=Vi ne povas forlasi ŝlositan keletaĝon!
actors.hero.abilities.mage.warpbeacon.too_far=La dezirata loko estas tro malproksime!
actors.hero.abilities.mage.warpbeacon.invalid_beacon=Vi ne povas loki teleport-markon tie!
actors.hero.abilities.mage.warpbeacon.window_desc=Via teleport-marko estas nune lokita en la %d-keletaĝo.
actors.hero.abilities.mage.warpbeacon.window_tele=teleportiĝi al marko
actors.hero.abilities.mage.warpbeacon.window_clear=nuligi markon
actors.hero.abilities.mage.warpbeacon.window_cancel=rezigni
actors.hero.abilities.mage.warpbeacon.short_desc=Magiisto povas loki _teleport-markon_ kaj poste li povas teleportiĝi al la markita loko.
actors.hero.abilities.mage.warpbeacon.desc=Magiisto lokas teleport-markon al kiu li poste povas laŭvole teleportiĝi. Lokado de marko okupas 1 temperon, tamen teleportiĝi al ĝi estas senprokrasta.\n\nMagiisto norme ne povas teleportiĝi inter keletaĝoj aŭ uzi la markon por aliri nealireblajn lokojn – kiel ŝlositajn ĉambrojn. La heroo povas teleportiĝi super kontraŭuloj kaj forpuŝi ilin.

actors.hero.abilities.rogue.smokebomb.name=fumbombo
actors.hero.abilities.rogue.smokebomb.fov=Vi nur povas salti al malplena loko en via vidatingo.
actors.hero.abilities.rogue.smokebomb.prompt=Elektu kien ensalti
actors.hero.abilities.rogue.smokebomb$ninjalog.name=ligna kvazaŭhomo
actors.hero.abilities.rogue.smokebomb$ninjalog.desc=Ial kontraŭuloj pensas, ke tiu ĉi ligna kvazaŭhomo estas la vera fripono!
actors.hero.abilities.rogue.smokebomb$ninjalog.discover_hint=Vi povas renkonti tian ulon uzante iun defendaĵan kapablon de heroo.
actors.hero.abilities.rogue.smokebomb.short_desc=Fripono povas ĵeti _fumbombon_ kaj samtempe malaperi. Li blindumos monstrojn, kiuj estos proksime de lia eksa pozicio.
actors.hero.abilities.rogue.smokebomb.desc=Fripono ĵetas fumbombon kaj ekaperas (maksimume) 6 kaheloj for. Li povas transsalti danĝeraĵojn kaj malamikojn, sed li ne povas transsalti firman terenon – kiel murojn.\n\nKontraŭuloj apudaj al la eksa pozicio de Fripono estas blindumitaj por 5 temperoj.
actors.hero.abilities.rogue.deathmark.name=marko de morto
actors.hero.abilities.rogue.deathmark.ally_target=Vi povas marki nur malamikojn
actors.hero.abilities.rogue.deathmark.short_desc=Fripono povas loki _markon de morto_ sur elektita monstro. Markitaj malamikoj ricevos ekstrajn vundojn, sed ne mortos kiam la marko estas aktiva.
actors.hero.abilities.rogue.deathmark.desc=Fripono lokas markon sur elektita kontraŭulo igante lin ricevi 25% de aldonaj vundoj. La marko aktiviĝas senprokraste kaj daŭras 5 temperojn.\n\nMarkitaj malamikoj ricevas aldonajn vundojn, sed ne povas morti kiam la marko agas. Se malamiko havas 0 sanpoentojn kiam la marko finis agi, li tuj mortos.
actors.hero.abilities.rogue.deathmark$deathmarktracker.name=markita por morto
actors.hero.abilities.rogue.deathmark$deathmarktracker.desc=Tiu ĉi malamiko estas markita, igante lin ricevi 25%% de aldonaj vundoj, sed ankaŭ li ne povos morti kiam la marko estas aktiva.\n\nPliaj temperoj: %s.
actors.hero.abilities.rogue.shadowclone.name=ombra klono
actors.hero.abilities.rogue.shadowclone.short_desc=Fripono povas alvoki _ombran klonon,_ kiu povas ricevi komandojn por asisti lin ĉe batalo.
actors.hero.abilities.rogue.shadowclone.desc=Fripono alvokas ombran imitanton de si mem, kiu povas ricevi komandojn por asisti lin ĉe batalo. Komandi la klonon uzas neniun ŝargon.\n\nLa klono havas 80 sanpoentojn, neniun defendaĵon kaj 10-20 vundpovon. Ĉiujn liajn ecojn vi povas pliigi uzante talentojn por ke la klono profitu de armilo kaj defendaĵo de la heroo.
actors.hero.abilities.rogue.shadowclone$shadowally.name=ombra fripono
actors.hero.abilities.rogue.shadowclone$shadowally.direct_defend=Via klono moviĝas al tiu loko.
actors.hero.abilities.rogue.shadowclone$shadowally.direct_follow=Via klono moviĝas por sekvi vin.
actors.hero.abilities.rogue.shadowclone$shadowally.direct_attack=Via klono moviĝas por ataki!
actors.hero.abilities.rogue.shadowclone$shadowally.desc=Klono de Fripono farita el ombra mallumo. Li staras senmove kun senpupilaj okuloj kaj etaj faskoj de mallumo leviĝas de li kiel vaporo.\n\nLa klono ne estas ideala kopio de Fripono, tamen plue estas boneta batalanto kaj povas profiti de la fripona armaĵo kun ceteraj talentoj.
actors.hero.abilities.rogue.shadowclone$shadowally.discover_hint=Vi povas renkonti tian ulon uzante iun defendaĵan kapablon de heroo.

actors.hero.abilities.huntress.spectralblades.name=rotaciaj akraĵoj
actors.hero.abilities.huntress.spectralblades.short_desc=Ĉasistino povas ĵeti al kontraŭulo _rotaciajn akraĵojn_, kies vundpovo dependas de ŝia nune tenata manarmilo.
actors.hero.abilities.huntress.spectralblades.desc=Ĉasistino ĵetas specialan akraĵon al kontraŭulo, kiu agas kiel etendita frapo de ŝia permana armilo. Ĉiuj efikoj de la permana armilo aktiviĝos – inkluzivante ensorĉojn.
actors.hero.abilities.huntress.naturespower.name=natura potenco
actors.hero.abilities.huntress.naturespower.short_desc=Ĉasistino povas alvoki _naturan potencon_ por pliigi sian movrapidon kaj pafrapidon de la spirita pafarko por mallonga tempo.
actors.hero.abilities.huntress.naturespower.desc=Ĉasistino portempe plenigas sin kaj sian pafarkon per potenco de la naturo! La efiko daŭras 8 temperojn.\n\nDum tiu tempo ŝi moviĝas kun duobla rapido kaj atakas per la spirita pafarko je 33% pli rapide. La ekstraj efikoj de spirita pafarko ne aktiviĝas kiam Celpafistino uzas siajn specialajn atakojn.
actors.hero.abilities.huntress.naturespower$naturespowertracker.name=natura potenco
actors.hero.abilities.huntress.naturespower$naturespowertracker.desc=Ĉasistino estas portempe plifortigita, pliigante sian movrapidon kaj atakrapidon de la spirita pafarko.\n\nPliaj temperoj %s.
actors.hero.abilities.huntress.spirithawk.name=spirita akcipitro
actors.hero.abilities.huntress.spirithawk.no_space=Libera loko mankas apud vi.
actors.hero.abilities.huntress.spirithawk.short_desc=Ĉasistino povas alvoki _spiritan akcipitron_, kiu povas helpi al ŝi esplori lokojn kaj malatentigi malamikojn.
actors.hero.abilities.huntress.spirithawk.desc=Ĉasistino alvokas amikan spiritan akcipitron, kiun ŝi povas gvidi. La akcipitro daŭros 100 temperojn, komandi la akcipitron uzas neniun ŝargon.\n\nLa akcipitro havas malmulte da sano kaj atakpovo, tamen estas rapida, evitpova kaj preciza. Ĉasistino vidas ĉion, kion la akcipitro vidas. La birdo estas rezista al ĉiuj aree-rilataj efikoj (fajro, toksa gaso, ktp.). Ĝi ne atakos, escepte se ĝi ricevos komandon por ataki.
actors.hero.abilities.huntress.spirithawk$hawkally.name=spirita akcipitro
actors.hero.abilities.huntress.spirithawk$hawkally.direct_defend=Via akcipitro moviĝas al tiu loko.
actors.hero.abilities.huntress.spirithawk$hawkally.direct_follow=Via akcipitro moviĝas por sekvi vin.
actors.hero.abilities.huntress.spirithawk$hawkally.direct_attack=Via akcipitro moviĝas por ataki!
actors.hero.abilities.huntress.spirithawk$hawkally.desc=Magia akcipitro, alvokita de Ĉasistino. La birdo briletas per efemera blua lumo, ĝia kapo senĉese ruliĝas flanken por observi la ĉirkaŭaĵon.\n\nMalgraŭ la fakto, ke ĝia atakpovo estas mizera, ĝiaj rapido kaj vidatingo estas utilaj por esplori la labirinton kaj malatentigi malamikojn.
actors.hero.abilities.huntress.spirithawk$hawkally.desc_remaining=Pliaj temperoj: %d.
actors.hero.abilities.huntress.spirithawk$hawkally.desc_dodges=Pliajn atakojn ĝi evitos: %d.
actors.hero.abilities.huntress.spirithawk$hawkally.discover_hint=Vi povas renkonti tian beston uzante iun defendaĵan kapablon de heroino.

actors.hero.abilities.duelist.challenge.name=defio
actors.hero.abilities.duelist.challenge.prompt=Elektu kontraŭulon por defii
actors.hero.abilities.duelist.challenge.already_dueling=Vi povas partopreni nur en unu duelo samtempe.
actors.hero.abilities.duelist.challenge.ally_target=Vi povas defii nur malamikojn.
actors.hero.abilities.duelist.challenge.unreachable_target=Defiato estu en via atakatingo.
actors.hero.abilities.duelist.challenge.distant_target=Tiu malamiko estas tro malproksime por defii.
actors.hero.abilities.duelist.challenge.short_desc=Duelistino povas _defii_ proksiman kontraŭulon provizore haltigante en la tempo ĉiujn aliajn kontraŭulojn.
actors.hero.abilities.duelist.challenge.desc=Duelistino defias proksiman malamikon pri duelo. La defiata kontraŭulo devas batali kontraŭ ŝi dum kiam ĉiuj aliaj malamikoj estas provizore haltigitaj en la tempo.\n\nLa viktimo estu atingebla kaj troviĝu ne pli ol 5 kaheloj for de Duelistino. La defio daŭras ne pli ol 10 temperoj, ĝis morto de la viktimo aŭ ĝis kiam Duelistino malproksimiĝos je 5 kaheloj de la kontraŭulo.\n\nLa haltigitaj malamikoj estas neatekeblaj. Amikoj de Duelistino ne estas haltigitaj kaj servantoj de defiata supermonstro ankaŭ ne estas haltigitaj..
actors.hero.abilities.duelist.challenge$duelparticipant.name=partoprenanto de duelo
actors.hero.abilities.duelist.challenge$duelparticipant.desc=Tiu ĉi ulo partoprenas en la duelo. Li kaj ĉiuj liaj amikoj/servantoj povas norme interagi dum kiam aliuloj estas haltigitaj.\n\nLa duelo daŭros aŭ difinitan nombron de temperoj aŭ ĝis iu partoprenanto mortos aŭ ĝis ili apartiĝos je pli ol 5 kaheloj.\n\nPliaj temperoj de duelo: %d.
actors.hero.abilities.duelist.elementalstrike.name=elementa frap-ondo
actors.hero.abilities.duelist.elementalstrike.short_desc=Duelistino plenumas konusforman _elementan frap-ondon_ disvastigante efikon dependan de ensorĉo sur ŝia armilo.
actors.hero.abilities.duelist.elementalstrike.desc=Duelistino frapas malamikon aŭ lokon, plenumante certe-trafan norman atakon kaj ellasante magian efikon, kiu penetras 4 kaheloj formante 65-gradan konuson. Tiu magia efiko dependas de ensorĉo sur la ĉefa armilo de Duelistino.
actors.hero.abilities.duelist.elementalstrike.generic_desc=Uzo de elementa frap-ondo per neensorĉita armilo ellasos malvastan magian eksplodon, kiu kaŭzos 6-12 vundpoentojn al ĉiuj malamikoj ene la konuso.
actors.hero.abilities.duelist.feint.name=finto
actors.hero.abilities.duelist.feint.prompt=Elektu kien alsalti
actors.hero.abilities.duelist.feint.too_far=Tiu loko ne apudas vin.
actors.hero.abilities.duelist.feint.bad_location=Vi ne povas moviĝi al tiu loko.
actors.hero.abilities.duelist.feint.short_desc=Duelistino _fintas_ kontraŭulon ŝajnigante atakon dum alsalto al apuda kahelo. Trompitaj kontraŭuloj atakos la postrestan figuron malkovriĝante al via atako.
actors.hero.abilities.duelist.feint.desc=Duelistino ŝajnigas atakon dum salti al apuda kahelo restigante kvazaŭan figuron de ŝi. Malamikoj, kiuj ŝin atakis, sekve atakos la postrestan figuron de Duelistino.\n\nKontraŭuloj atakantaj ŝian postrestan figuron iĝos konfuzitaj, perdos la sekvan atakon kaj malkovriĝos al surpriza atako.

actors.hero.abilities.cleric.ascendedform.name=ascendita formo
actors.hero.abilities.cleric.ascendedform.short_desc=Kleriko povas alpreni _ascenditan formon_, akirante novajn sorĉojn, pliigitan atakatingon kaj ŝirmon.
actors.hero.abilities.cleric.ascendedform.desc=Kleriko ellasas sanktan energion el si mem, alprenante pli altan luman formon por 10 temperoj. Estante en tiu ĉi formo Kleriko povas ĵeti novajn sorĉojn, akiras 2-kahelan atakatingon, 30 poentojn da ŝirmo kaj ĉiuj ĵetitaj sorĉoj donos al ri po 10 poentoj da ŝirmo por ĉiu uzita ŝargo de la sankta librego.\n\nLa ŝirmo pro ascendita formo kaj ĝiaj sorĉoj ne etiĝos, tamen ĝi subite malaperos je fino de daŭro de la ascendita formo. Reuzo de tiu ĉi kapablo refreŝigos daŭron de la ascendita formo.
actors.hero.abilities.cleric.ascendedform$ascendbuff.name=ascendita formo
actors.hero.abilities.cleric.ascendedform$ascendbuff.desc=Luma energio eliĝas el la korpo de Kleriko. Estante en tiu ĉi formo Kleriko akiras 2-kahelan atakatingon (danke al ellasata sankta energio) kaj po 10 poentoj da ŝirmo por ĉiu uzita ŝargo de la sankta librego. Ri ankaŭ povas ĵeti sorĉojn malŝlositajn de talentoj de la ascendita formo.\n\nLa ŝirmo pro ascendita formo kaj ĝiaj sorĉoj norme ne etiĝos, tamen ĝi subite malaperos je fino de daŭro de la ascendita formo.\n\nNuna ŝirmo: %1$d.\nPliaj temperoj: %2$d.
actors.hero.abilities.cleric.trinity.name=triunuo
actors.hero.abilities.cleric.trinity.no_imbue=Nuntempe la triunuo havas neniun efikon agorditan por iu ajn sia formo, uzu iun sorĉon de la triunuo!
actors.hero.abilities.cleric.trinity.no_duplicate=La triunuo ne povas duobligi efikon, kiun vi jam asignis!
actors.hero.abilities.cleric.trinity.ench_glyph_use=La triunuo aplikos tiun ĉi efikon por _%1$d temperoj,_ uzante _%2$s ŝargojn._
actors.hero.abilities.cleric.trinity.rare_ench_glyph_use=La triunuo aplikos tiun ĉi _potencan_ efikon por _%1$d temperoj,_ uzante _%2$s ŝargojn._
actors.hero.abilities.cleric.trinity.wand_use=La triunuo pafos per tiu ĉi vergo samkiel ĝi estus je nivelo _+%1$d_ uzante _%2$s ŝargojn._
actors.hero.abilities.cleric.trinity.wand_multi_use=La triunuo _plurpafos_ per tiu ĉi vergo samkiel ĝi estus je nivelo _+%1$d_ uzante _%2$s ŝargojn._
actors.hero.abilities.cleric.trinity.thrown_use=La triunuo atakos per tiu ĉi ĵetarmilo samkiel ĝi estus je nivelo _+%1$d_ uzante _%2$s ŝargojn._
actors.hero.abilities.cleric.trinity.ring_use=La triunuo utiligos efikon de tiu ĉi ringo samkiel ĝi estus je nivelo _+%1$d_ por 20 temperoj uzante _%2$s ŝargojn._
actors.hero.abilities.cleric.trinity.alchemiststoolkit_use=La triunuo utiligos foran alĥemian efikon de tiu ĉi antikvaĵo uzante _%2$s ŝargojn._
actors.hero.abilities.cleric.trinity.chaliceofblood_use=La triunuo utiligos pasivan sanigan efikon de tiu ĉi antikvaĵo je nivelo _+%1$d_ por 20 temperoj uzante _%2$s ŝargojn._
actors.hero.abilities.cleric.trinity.driedrose_use=La triunuo utiligos efikon de tiu ĉi antikvaĵo por alvoki koruptitan amikan fifantomon kun sanpoentoj je nivelo _+%1$d_ uzante _%2$s ŝargojn._
actors.hero.abilities.cleric.trinity.etherealchains_use=La triunuo utiligos efikon de tiu ĉi antikvaĵo por surĵeti katenojn kun atingo _+%1$d_ uzante _%2$s ŝargojn._
actors.hero.abilities.cleric.trinity.hornofplenty_use=La triunuo utiligos manĝetan efikon de tiu ĉi antikvaĵo uzante _%2$s ŝargojn._
actors.hero.abilities.cleric.trinity.masterthievesarmband_use=La triunuo utiligos malamik-priŝtelantan efikon de tiu ĉi antikvaĵo je nivelo _+%1$d_ uzante _%2$s ŝargojn._
actors.hero.abilities.cleric.trinity.sandalsofnature_use=La triunuo utiligos efikon de tiu ĉi antikvaĵo por enradikigi malamikon kun hazarda minaca semo uzante _%2$s ŝargojn._
actors.hero.abilities.cleric.trinity.skeletonkey_use=La triunuo utiligos ŝloshokan efikon de tiu ĉi antikvaĵo uzante _%2$s ŝargojn._
actors.hero.abilities.cleric.trinity.talismanofforesight_use=La triunuo utiligos antaŭvidan efikon de tiu ĉi antikvaĵo je nivelo _+%1$d_ uzante _%2$s ŝargojn._
actors.hero.abilities.cleric.trinity.timekeepershourglass_use=La triunuo utiligos temp-haltiigan efikon de tiu ĉi antikvaĵo por _%1$d temperoj_ uzante _%2$s ŝargojn._
actors.hero.abilities.cleric.trinity.unstablespellbook_use=La triunuo utiligos efikon de hazarda skribrulaĵo de tiu ĉi antikvaĵo – kun _%1$d/10_ ŝanco por ebligi ekzotan version – uzante _%2$s ŝargojn._
actors.hero.abilities.cleric.trinity.cost=Necesaj ŝargoj por tiu ĉi kapablo varias, sed kutime estas _%d._
actors.hero.abilities.cleric.trinity.short_desc=Kleriko akiras la _triunuon_ de kapabloj, kiu imitas antaŭe viditajn armaĵojn kaj ebligas asigni ilin per novaj sorĉoj.
actors.hero.abilities.cleric.trinity.desc=Kleriko akiras la _triunuon_ de armaĵaj kapabloj, kiu povas esti asignita al efikoj de diversaj aĵoj, uzante tri novajn sorĉojn. Ĉiu el tiuj sorĉoj koncentriĝas sur imiti efikojn de diversaj armaĵoj, kiujn Kleriko identigis dum tiu ĉi ludo: korpa formo por armiloj kaj defendaĵoj, mensa formo por vergoj kaj ĵetarmiloj, kaj spirita formo por ringoj kaj antikvaĵoj.\n\nĈiu formo povas esti plenigita per unu efiko samtempe kaj Kleriko elektas formon por aktivigi kun la triunuo. La triunuo ne povas imiti efikon de armaĵo, kiu jam estas surmetita.
actors.hero.abilities.cleric.trinity$wndusetrinity.text=Elektu formon por uzi kun la triunuo. Efikoj de pluraj formoj povas esti aktivigitaj samtempe.
actors.hero.abilities.cleric.trinity$wndusetrinity.body=_Korpa formo: %s._
actors.hero.abilities.cleric.trinity$wndusetrinity.mind=_Mensa formo: %s._
actors.hero.abilities.cleric.trinity$wndusetrinity.spirit=_Spirita formo: %s._
actors.hero.abilities.cleric.trinity$wnditemtypeselect.text=Elektu efikon per kiu vi volas plenigi la triunuon. Pliaj informoj montriĝos antaŭ ol konfirmi.
actors.hero.abilities.cleric.trinity$wnditemconfirm.body=Asigni al korpa formo
actors.hero.abilities.cleric.trinity$wnditemconfirm.mind=Asigni al mensa formo
actors.hero.abilities.cleric.trinity$wnditemconfirm.spirit=Asigni al spirita formo
actors.hero.abilities.cleric.powerofmany.name=plurforto
actors.hero.abilities.cleric.powerofmany.prompt_default=Elektu amikon aŭ lokon
actors.hero.abilities.cleric.powerofmany.prompt_ally=Direktu vian luman amikon
actors.hero.abilities.cleric.powerofmany.ally_exists=Vi jam havas plifortigitan amikon.
actors.hero.abilities.cleric.powerofmany.no_vision=Vi ne povas elekti lokon ekster via vidatingo.
actors.hero.abilities.cleric.powerofmany.only_allies=Vi povas plifortigi nur amikojn.
actors.hero.abilities.cleric.powerofmany.short_desc=Kleriko alidirektas la _plurforton_ por plifortigi ekzistan amikon aŭ krei novan.
actors.hero.abilities.cleric.powerofmany.desc=Kleriko alidirektas la _plurforton,_ kiu plifortigas ekzistan amikon aŭ kreas novan plifortigitan por 100 temperoj. Elekti malplenan kahelon kreas novan amikon.\n\nKiam plifortigita per la plurforto, ĉiu amiko havas vundpovon pliigitan je +25%, ricevas -25% de vundoj kaj kunhavigas vidon kun Kleriko. Krom tio, ili akiras 25 poentojn da ŝirmo dum uzi la kapablon.\n\nKleriko ankaŭ akiras tri novajn sorĉojn, kiujn ri povas ĵeti nur kun plifortigita amiko. La plurforto ne ĉesos, kiam iu el tiuj sorĉoj estos aktivaj.
actors.hero.abilities.cleric.powerofmany$powerbuff.name=plurforto
actors.hero.abilities.cleric.powerofmany$powerbuff.desc=Tiu ĉi amiko estas plifortigita per la plurforto, pliigante lian vundpovon je +25%% kaj malpliigante ricevitajn vundojn je -25%%. La amiko ankaŭ kunhavigas vidon kun Kleriko kaj povas profiti de diversaj sorĉoj.\n\nLa plurforto daŭros eĉ kiam amikoj kiel prismaj figuroj kaŝiĝos, sed plua tempo de la efiko daŭre malpliiĝos.\n\nPliaj temperoj: %s.
actors.hero.abilities.cleric.powerofmany$lightally.name=luma amiko
actors.hero.abilities.cleric.powerofmany$lightally.direct_defend=Via amiko moviĝas al tiu loko.
actors.hero.abilities.cleric.powerofmany$lightally.direct_follow=Via amiko moviĝas por sekvi vin.
actors.hero.abilities.cleric.powerofmany$lightally.direct_attack=Via amiko moviĝas por ataki!
actors.hero.abilities.cleric.powerofmany$lightally.desc=Kopio de iu el kunaventuristoj de Kleriko farita el solida lumo. Kvankam li alprenis formon de alia heroo, li havas neniun unikan kapablon de tiu heroo. Tiu ĉi amiko daŭros tiel longe kiel la plurforto estas aplikita al li.\n\nTiun ĉi amikon vi povas komandi uzante neniun ŝargon per reuzi la defendaĵan kapablon plurforto.
actors.hero.abilities.cleric.powerofmany$lightally.discover_hint=Vi povas renkonti tian ulon uzante iun defendaĵan kapablon de heroo.


actors.hero.abilities.ratmogrify.name=rattransformo
actors.hero.abilities.ratmogrify.cant_transform=Tio ĉi ne povas ŝanĝiĝi al rato!
actors.hero.abilities.ratmogrify.too_strong=Tiu ĉi monstro estas tro forta por ŝanĝiĝi al rato!
actors.hero.abilities.ratmogrify.short_desc=La heroo povas _rattransformi_ malamikon! La kontraŭulo portempe ŝanĝiĝos al rato kun neniu speciala povo.
actors.hero.abilities.ratmogrify.desc=La heroo transformas malamikon al rato por 6 temperoj! Supermonstroj, amikoj kaj ratoj ne povas esti rattransformitaj.\n\nMonstroj transformitaj al ratoj konservos siajn originalajn parametrojn, sed havos neniun specialan povon.
actors.hero.abilities.ratmogrify$transmograt.name=rattransformita %s
actors.hero.abilities.ratmogrify$transmograt.desc=Tiu ĉi kontraŭulo estas transformita al rato.\n\n“Bonega afero miaopinie!” – Ratreĝo
actors.hero.abilities.ratmogrify$transmograt.rankings_desc=Murdita de rattransformita malamiko

##Cleric Spells
actors.hero.spells.auraofprotection.name=aŭreolo de protekto
actors.hero.spells.auraofprotection.short_desc=Pliigas defendpovon de Paladino kaj proksimaj amikoj.
actors.hero.spells.auraofprotection.desc=Paladino komencas radii protektan energion en la formo de brila aŭreolo ĉirkaŭ ri por 20 temperoj. Ĉiu amiko ene la radio de 2 kaheloj de Paladino vundiĝas malpli je %1$d%% kaj akiras efikon de skribaĵo de la paladina defendaĵo plifortigitan je +%2$d%%.\n\nTiu ĉi redukto kalkuliĝas antaŭ aliaj vund-reduktaj efikoj (ekz. defendaĵo). Plipovigo de skribaĵo ĉiam okazos, tamen tiu ĉi sorĉo ne povas aktivigi skribaĵon plurfoje se ulo jam profitas de skribaĵo (ekz. Paladino mem aŭ prisma figuro).
actors.hero.spells.auraofprotection$aurabuff.name=aŭreolo de protekto
actors.hero.spells.auraofprotection$aurabuff.desc=Paladino elradias protektan energion ĉirkaŭ si.\n\nĈiu proksima amiko (inkluzivante Paladinon mem) malpli vundiĝas kaj akiras plifortigitan efikon de skribaĵo de la paladina defendaĵo.\n\nPliaj temperoj: %s.

actors.hero.spells.beamingray.name=teleport-fasko
actors.hero.spells.beamingray.no_space=Tie estas neniu spaco por via amiko.
actors.hero.spells.beamingray.out_of_range=Tiu loko estas ekster atingo.
actors.hero.spells.beamingray.short_desc=Teleportas vian amikon kaj liveras ekstran vundpovon.
actors.hero.spells.beamingray.desc=Kleriko alidirektas energion al sia amiko kreante lumradion, kiu teleportas la amikon al iu loko. Se teleport-fasko kolizios kun kontraŭulo, la amiko aperos apud kontraŭulo kaj direktiĝos kontraŭ ĝi.\n\nLa teleport-fasko havas maksimuman atingon de %1$d kaheloj kaj pliigos ekstran vundpovon de la plurforto al +%2$d%% por 10 temperoj kontraŭ la plej proksima malamiko ene 4 kaheloj. La teleport-fasko eĉ povas teleporti kutime nemoveblajn amikojn, tamen tiaokaze ĝia atingo duoniĝas.
actors.hero.spells.beamingray$beamingrayboost.name=teleport-fasko
actors.hero.spells.beamingray$beamingrayboost.desc=Tiu ĉi amiko antaŭ nelonga tempo estis teleportita per la teleport-fasko, liverante al li ekstran vundpovon kontraŭ la plej proksima kontraŭulo post teleportiĝi. Krom tio, la plurforto ne ĉesos kiam tiu efiko estas aktiva.\n\nPliaj temperoj: %s.

actors.hero.spells.blessspell.name=beno
actors.hero.spells.blessspell.short_desc=Benas kaj ŝirmas Klerikon aŭ benas kaj sanigas aliulojn.
actors.hero.spells.blessspell.desc=Kleriko donas sanktan benon al si mem aŭ al alia vidata ulo.\n\nKiam uzita sur si mem la efiko estas malpli forta, liverante %1$d temperojn de beno kaj %2$d poentojn da ŝirmo.\n\nKiam uzita sur alia ulo la efiko estas pli forta, liverante %3$d temperojn de beno kaj %4$d poentojn da sanigado. Superflua sanigado ŝanĝiĝos al ŝirmo.

actors.hero.spells.bodyform.name=korpa formo
actors.hero.spells.bodyform.short_desc=Asignas triunuon al ensorĉo aŭ skribaĵo.
actors.hero.spells.bodyform.desc=Kleriko elektas ensorĉon aŭ skribaĵon, kiun ri identigis dum tiu ĉi ludo kaj plenigas la triunuon per ĝia efiko.\n\nKiam Kleriko uzas la triunuon, ri akiras efikon de la elektita ensorĉo aŭ skribaĵo por %d temperoj. Tiu ĉi portempa ensorĉo/skribaĵo funkcios samkiel norma ensorĉo/skribaĵo.\n\nTiu ĉi sorĉo anstataŭigas ĉiun alian korp-forman efikon, kiu nuntempe plenigas la triunuon.
actors.hero.spells.bodyform$bodyformbuff.name=korpa formo
actors.hero.spells.bodyform$bodyformbuff.desc=La korpa formo de la triunuo nuntempe imitas povon de ensorĉo aŭ skribaĵo, samkiel ĝi estus sur via armilo aŭ defendaĵo.\n\nRimarku, ke la korpa formo ne povas imiti plian kopion de efiko, kies vi jam profitas.\n\nNuna efiko: %1$s.\n\nPliaj temperoj: %2$s.

actors.hero.spells.cleanse.name=purigo
actors.hero.spells.cleanse.short_desc=Purigas de minacaj efikoj kaj donas ŝirmon.
actors.hero.spells.cleanse.desc=Kleriko purigas sin kaj videblajn amikojn de ĉiuj minacaj efikoj. Post ĵeti la sorĉon ĉiuj trafitaj uloj ricevos %1$d temperojn da rezisto kontraŭ fiefikoj kaj %2$d da ŝirmo.

actors.hero.spells.clericspell.prompt=Elektu celon
actors.hero.spells.clericspell.no_target=Tie estas neniu celo.
actors.hero.spells.clericspell.invalid_target=Vi ne povas elekti tiun lokon.
actors.hero.spells.clericspell.invalid_enemy=Vi ne povas elekti tiun kontraŭulon.
actors.hero.spells.clericspell.charge_cost=Necesaj ŝargoj: %d

actors.hero.spells.divinesense.name=dia senco
actors.hero.spells.divinesense.short_desc=Liveras portempan ampleksan mensvidon.
actors.hero.spells.divinesense.desc=Kleriko streĉas siajn sencojn sur la ĉirkaŭaĵo, akirante %d-kahelan mensvidon por 50 temperoj. Ĵeti tiun sorĉon daŭras neniun temperon.
actors.hero.spells.divinesense$divinesensetracker.name=dia senco
actors.hero.spells.divinesense$divinesensetracker.desc=Tiu ĉi ulo povas portempe vidi aliajn proksimajn estaĵojn per sia menso!\n\n\nPliaj temperoj: %s.

actors.hero.spells.divineintervention.name=dia interveno
actors.hero.spells.divineintervention.short_desc=Signifa pliigo de ŝirmo al Kleriko kaj riaj amikoj.
actors.hero.spells.divineintervention.desc=Kleriko elverŝas grandiozan kvanton da energio el sia librego al si kaj siaj amikoj, plipovigante ĉiujn je %1$d poentoj da ŝirmo kaj plidaŭrigante la ascenditan formon je %2$d temperoj. Nekredebla defenda povo de tiu sorĉo estas kompensata per tre alta ŝargkosto.\n\nSamkiel alia ŝirmo akirata en ascendita formo, ĝi norme ne etiĝas, sed subite malaperas je fino de daŭro de ascendita formo.

actors.hero.spells.flash.name=fulmo
actors.hero.spells.flash.prompt=Elektu lokon
actors.hero.spells.flash.short_desc=Teleportas al proksima loko.
actors.hero.spells.flash.desc=Kleriko alidirektas sian ascenditan formon kaj teleportiĝas tien. Fulmo povas teleporti Klerikon al ĉiu malkovrita neokupata loko ene atingo de la efiko. Tiu ĉi sorĉo uzas ju pli da libregaj ŝargoj des pli foje ĝi estas uzita dum la sama ascendita formo.

actors.hero.spells.guidinglight.name=gvida lumo
actors.hero.spells.guidinglight.short_desc=Kaŭzas foran magian vundon kaj certe trafas.
actors.hero.spells.guidinglight.desc=Kleriko pafas kuglon de magia energio, kiu kaŭzas 2-8 vundpoentojn kaj igas la viktimon lumiĝi. La sekva korpa atako (neuzante tro pezan armilon) kontraŭ la lumiĝanta viktimo certe trafos.
actors.hero.spells.guidinglight.desc_priest=_Tiu ĉi sorĉo estas pli potenca kiam ĵetita de Pastro._ La unua ĵeto je ĉiuj 50 temperoj de tiu sorĉo uzos neniun libregan ŝargon kaj la lumiĝa efiko estos sorbita de glorbrilo, vergoj, aliaj uloj kaj antikvaĵoj, kiuj senpere influos kun la malamiko. Kiam lumiĝo estos uzita tiumaniere, la viktimo estos magie vundita egale al la nivelo de Pastro + 5.
actors.hero.spells.guidinglight$guidinglightpriestcooldown.name=Gvida lumo
actors.hero.spells.guidinglight$guidinglightpriestcooldown.desc=Pastro povos denove senpage ĵeti la gvidan lumon post atendi 50 temperojn.\n\nPliaj temperoj: %s.
actors.hero.spells.guidinglight$illuminated.name=Lumiĝanta
actors.hero.spells.guidinglight$illuminated.desc=Tiu ĉi estaĵo brilas pro esti frapita de gvida lumo. Kvankam la brilo ne estas sufiĉe forta por prilumi la ĉirkaŭaĵon, la magia efiko plifaciligos al Kleriko ataki ĝin.
actors.hero.spells.guidinglight$illuminated.desc_priest=Kleriko povas ankaŭ sorbi lumiĝon per glorbrilo, vergopafo, frapo de amiko aŭ per efikoj de iuj antikvaĵoj. Uloj perdantaj la staton “lumiĝanta” tiumaniere ricevos kroman vundon egalan al nivelo de Pastro + 5.
actors.hero.spells.guidinglight$illuminated.desc_generic=Aliaj herooj ankaŭ povas uzi la staton “lumiĝanta” por profiti de la talento brulanta lumo, se ili ne akiros aldonan precizon.

actors.hero.spells.hallowedground.name=benita tero
actors.hero.spells.hallowedground.prompt=Elektu lokon
actors.hero.spells.hallowedground.short_desc=Sanigas amikojn, malrapidigas malamikojn kaj kreskigas herbon ene areo de efiko.
actors.hero.spells.hallowedground.desc=Pastro alidirektas sian diecan magion al la proksima tero, kreante kvadraton %1$d×%1$d de benita tero por 20 temperoj.\n\nEn la momento de ĵeto tiu ĉi sorĉo sanigos ĉiujn amikojn je 15 sanpoentoj (plene sanaj amikoj kaj Pastro akiros ŝirmon), provizore enradikigos kontraŭulojn kaj disvastigos malaltan herbon.\n\nLa benita tero sanigos ĉiujn amikojn kun rapido 1 sanpoento/tempero (plene sanas amikoj kaj Pastro akiros ŝirmon), kripligos malamikojn kaj hazarde kreskigos altan herbon.\n\nBenita tero detruiĝas pro fajro. Kiam pasiva resaniĝado ne agas aŭ kiam Pastro ne akiros sperton por ioma tempo, la tero estos disŝovita.
actors.hero.spells.hallowedground$hallowedterrain.desc=La tero tie ĉi estas benita. Benita tero malrapidigos malamikojn, sanigos amikojn kaj kreskigos herbon.

actors.hero.spells.holyintuition.name=dieca intuicio
actors.hero.spells.holyintuition.prompt=Elektu aĵon
actors.hero.spells.holyintuition.cursed=Vi sentas fian magion insidantan de tiu ĉi aĵo.
actors.hero.spells.holyintuition.uncursed=Tiu ĉi aĵo estas libera de fia magio.
actors.hero.spells.holyintuition.short_desc=Identigas ĉu aĵo estas malbenita aŭ ne.
actors.hero.spells.holyintuition.desc=Kleriko streĉas siajn sensojn sur aĵo por determini ĉu ĝi estas malbenita aŭ ne, sen neceso por surmeti ĝin.

actors.hero.spells.holylance.name=sankta ĵetlanco
actors.hero.spells.holylance.short_desc=Kaŭzas seriozan foran magian vundon.
actors.hero.spells.holylance.desc=Pastro koncentras multan energion sur detruantan ĵetlancon faritan el lumo. Tiu ĵetlanco kaŭzas %1$d-%2$d vundpoentojn kaj ĉiam maksimume vundas nemortajn kaj demonajn kontraŭulojn.\n\nTiu ĉi sorĉo estas tre ŝargkosta kaj necesas atendi 30 temperojn antaŭ ol povi reuzi ĝin.
actors.hero.spells.holylance$lancecooldown.name=trankvil-tempo por sankta ĵetlanco
actors.hero.spells.holylance$lancecooldown.desc=Pastro lastatempe ĵetis sanktan ĵetlancon kaj devas atendi antaŭ ol povi ĵeti ĝin denove.\n\nPliaj temperoj por atendi: %s.

actors.hero.spells.holyward.name=sankta defendaĵo
actors.hero.spells.holyward.glyph_name=%s de lumo
actors.hero.spells.holyward.glyph_desc=Tiu ĉi skribaĵo igas vian defendaĵon bloki ete pli da vundoj.
actors.hero.spells.holyward.short_desc=Provizore superskribas skribaĵon por pliigi defendpovon de defendaĵo.
actors.hero.spells.holyward.desc=Kleriko plenigas la portatan surskribitan defendaĵon per sankta lumo, pliigante defendpovon de defendaĵo je 1 poento. Ĵeti tiun sorĉon daŭras neniun temperon.\n\nTiu ĉi skribaĵo daŭros por 50 temperoj kaj superskribos ĉiujn utilajn skribaĵojn sur la defendaĵo por tiu periodo. Kleriko eĉ povas profiti de tiu ĉi sorĉo kiam ri portas neniun defendaĵon.
actors.hero.spells.holyward.desc_paladin=_Tiu ĉi sorĉo estas pli potenca kiam ĵetita de Paladino._ La kroma defendpovo pliiĝas al 3 poentoj, la sorĉo ne plu superskribas ekzistajn skribaĵojn kaj ĵeti aliajn sorĉojn kiam sankta defendaĵo estas aktiva plidaŭrigos ĝin je 10 temperoj por ĉiu uzita ŝargo.
actors.hero.spells.holyward$holyarmbuff.name=sankta defendaĵo
actors.hero.spells.holyward$holyarmbuff.desc=Kleriko plenigis sian surmetitan defendaĵon per sankta energio, provizore superskribante la ekzistan skribaĵon kaj igante la defendaĵon bloki aldonan 1 vundpoenton.\n\nPliaj temperoj: %s.
actors.hero.spells.holyward$holyarmbuff.desc_paladin=Paladino plenigis sian surmetitan defendaĵon per sankta energio, igante ĝin bloki aldonajn 3 vundpoentojn.\n\nĴeti aliajn sorĉojn dum kiam sankta defendaĵo estas aktiva plidaŭrigos ĝin je 10 temperoj por ĉiu uzita ŝargo.\n\nPliaj temperoj: %s.

actors.hero.spells.holyweapon.name=sankta armilo
actors.hero.spells.holyweapon.ench_name=sankta %s
actors.hero.spells.holyweapon.ench_desc=Malamikoj frapitaj per sankta armilo ricevos kroman magian vundon.
actors.hero.spells.holyweapon.short_desc=Provizore superskribas ensorĉojn por pliigi vundpovon.
actors.hero.spells.holyweapon.desc=Kleriko plenigas sian tenatan armilon per sankta energio, igante la armilon kaŭzi pliajn 2 vundpoentojn per magio kun ĉiu frapo. Ĵeti tiun sorĉon daŭras neniun temperon.\n\nTiu ĉi ensorĉo daŭros por 50 temperoj kaj superskribos ĉiujn utilajn ensorĉojn sur la armilo por tiu periodo. Senarmilaj frapoj ankaŭ profitos de tiu sorĉo.
actors.hero.spells.holyweapon.desc_paladin=_Tiu ĉi sorĉo estas pli potenca kiam ĵetita de Paladino._ La kroma magia vundpovo pliiĝas al 6 poentoj, la sorĉo ne plu superskribas ekzistajn ensorĉojn kaj ĵeti aliajn sorĉojn kiam sankta armilo estas aktiva, plidaŭrigos ĝin je 10 temperoj por ĉiu uzita ŝargo.
actors.hero.spells.holyweapon$holywepbuff.name=sankta armilo
actors.hero.spells.holyweapon$holywepbuff.desc=Kleriko plenigis sian uzatan armilon per sankta energio, provizore superskribante la ekzistan ensorĉon kaj igante la armilon kaŭzi aldonajn 2 vundpoentojn per magio je ĉiu frapo.\n\nPliaj temperoj: %s.
actors.hero.spells.holyweapon$holywepbuff.desc_paladin=Paladino plenigis sian uzatan armilon per sankta energio, igante la armilon kaŭzi aldonajn 6 vundpoentojn per magio je ĉiu frapo.\n\nĴeti aliajn sorĉojn dum kiam sankta armilo estas aktiva plidaŭrigos ĝin je 10 temperoj por ĉiu uzita ŝargo.\n\nPliaj temperoj: %s.

actors.hero.spells.judgement.name=juĝo
actors.hero.spells.judgement.short_desc=Vundas ĉiujn videblajn kontraŭulojn.
actors.hero.spells.judgement.desc=Kleriko pugnbatas teron kaŭzante ellason de lumo, kiu vundas ĉiujn videblajn malamikojn. Fundamente tio ĉi kaŭzas %1$d-%2$d vundpoentojn kaj po 33%% aldonaj vundpoentoj por ĉiu sorĉo, kiun Kleriko ĵetis ekde alpreni ascenditan formon (aŭ ekde la antaŭa ĵeto de juĝo).\n\nNuntempe la juĝo kaŭzos %3$d-%4$d vundpoentojn.

actors.hero.spells.layonhands.name=mansurmeto
actors.hero.spells.layonhands.short_desc=Senprokraste sanigas apudan ulon aŭ ŝirmas Paladinon.
actors.hero.spells.layonhands.desc=Paladino alidirektas sanktan energion tra siaj manoj, sanigante aŭ ŝirmante ĉion, kion ri tuŝas.\n\nPaladino povas ĵeti tiun ĉi sorĉon al ĉiu apuda ulo por sanigi lin per %1$d sanpoentoj aŭ al si mem por akiri %1$d poentojn da ŝirmo. Troa sanigo de tiu ĉi sorĉo ŝanĝiĝos al ŝirmo.\n\nTiu ĉi sorĉo ĵetiĝas senprokraste kaj oni povas ĵeti ĝin pluroble, sed ne povas ĵeti ĝin akirante pli ol tri ŝirmoj samtempe.

actors.hero.spells.lifelinkspell.name=vivligilo
actors.hero.spells.lifelinkspell.short_desc=Kunhavigas vundojn kun amiko kaj etigas ricevitajn vundojn.
actors.hero.spells.lifelinkspell.desc=Kleriko plifortigas la ligilon inter si kaj plifortigita amiko. Kun tiu plifortigita ligilo, ĉiuj ricevataj vundoj estas dividitaj inter la heroo kaj ria amiko dum %1$d temperoj kaj vund-evito de la plurforto pliiĝos je %2$d%%. Rimarku, ke vundoj estas estas dividitaj post redukto pro defendaĵo, sed antaŭ redukto pro la plurforto.\n\nKiam tiu efiko estas aktiva, utilaj sorĉoj de maksimume 3-a nivelo aplikiĝos ambaŭ al Kleriko kaj al ria amiko, samkiel ili aplikiĝus nur al unu el ili.
actors.hero.spells.lifelinkspell$lifelinkspellbuff.name=vivligila protekto
actors.hero.spells.lifelinkspell$lifelinkspellbuff.desc=Kleriko antaŭnelonge kreis la vivligilon kun tiu amiko.\n\nAldone al normaj profitoj de la vivligilo, la amiko ricevas malpli da vundoj, ĉiuj utilaj sorĉoj ĵetataj de Kleriko aplikiĝas ambaŭ al Kleriko kaj al ria amiko, anstataŭ nur al unu el ili, kaj la plurforto ne ĉesos kiam tiu efiko estas aktiva.\n\nPliaj temperoj: %s.

actors.hero.spells.mindform.name=mensa formo
actors.hero.spells.mindform.short_desc=Asignas triunuon al vergo aŭ ĵetarmilo.
actors.hero.spells.mindform.desc=Kleriko elektas vergon aŭ jetarmilojn, kiun ri identigis dum tiu ĉi ludo kaj plenigas la triunuon per ĝia efiko.\n\nKiam Kleriko uzas la triunuon, ri povas fari unuoblan atakon per la elektita ĵetarmilo/sorĉbastono samkiel ĝi estus je la nivelo +%d. La sorĉo aktivigos ĉiujn efikojn de la elektita objekto.\n\nTiu ĉi sorĉo anstataŭigas ĉiun alian mensan efikon, kiu nuntempe plenigas la triunuon.

actors.hero.spells.mnemonicprayer.name=parkerigita preĝo
actors.hero.spells.mnemonicprayer.short_desc=Plidaŭrigas efikojn sur (mal)amiko kaj reaktivigas lumiĝon.
actors.hero.spells.mnemonicprayer.desc=Pastro eldiras preĝon, kiu plidaŭrigas ĉiujn utilajn kaj minacajn efikojn sur elektita celo je %1$d temperoj. Ĵeti tiun sorĉon daŭras neniun temperon. Utilaj efikoj daŭros pli longe sur amikoj (inkluzivante Pastron mem) kaj minacaj efikoj daŭros pli longe sur kontraŭuloj.\n\nLa parkerigita preĝo povas plidaŭrigi specifan efikon nur unufoje kaj ne povas plidaŭrigi efikojn akiritajn per defendaĵaj kapabloj.

actors.hero.spells.radiance.name=glorbrilo
actors.hero.spells.radiance.short_desc=Lumigas kaj provizore surdigas proksimajn kontraŭulojn.
actors.hero.spells.radiance.desc=Pastro eksplodas per sankta lumo, kiu surdigas ĉiujn videblajn malamikojn por 3 temperoj. Se kontraŭulo jam lumiĝas, la glorbrilo krome vundos lin kaj sekve aktivigos la staton “lumiĝanta”. La sorĉo ankaŭ igos Pastron brili por 100 temperoj, se la nuna keletaĝo estas malluma.

actors.hero.spells.recallinscription.name=relego de runoj
actors.hero.spells.recallinscription.short_desc=Ripetas antaŭe uzitan runŝtonon aŭ skribrulaĵon.
actors.hero.spells.recallinscription.desc=Kleriko uzas sanktan magion por denove relegi magiajn runojn trovitajn sur runŝtono aŭ skribrulaĵo, kiun ri uzis dum la antaŭaj %s temperoj.\n\nLa relegon de runoj oni ne povas uzi por ripeti skribrulaĵon de plibonigo. Necesaj ŝargoj dependas de antaŭe uzita aĵo: 2 por runŝtono, 3 por skribrulaĵo kaj 4 por ekzota skribrulaĵo. La ŝargkosto ankaŭ duobliĝas dum relegi skribrulaĵon de transformo aŭ allĥemiaĵojn, kiuj devas esti kuiritaj per transformo aŭ plibonigo.
actors.hero.spells.recallinscription$useditemtracker.name=antaŭe uzita runo
actors.hero.spells.recallinscription$useditemtracker.desc=Kleriko lastatempe uzis objekton, kiu povas agi kun la sorĉo “relego de runoj”. Nun Kleriko povas ĵeti sorĉon, kiu ripetos ĝian efikon.\n\nUzita aĵo: %1$s.\n\nPliaj temperoj: %2$s.

actors.hero.spells.shieldoflight.name=ŝildo de lumo
actors.hero.spells.shieldoflight.short_desc=Liveras portempan ŝirmon kontraŭ malamiko.
actors.hero.spells.shieldoflight.desc=Kleriko kreas maldikan luman muron inter si kaj kontraŭulo, pliigante defendpovon kontraŭ tiu kontraŭulo je %1$d-%2$d poentoj por 5 temperoj.\n\nTiu ĉi sorĉo ĵetiĝas senprokraste kaj ne povas esti ĵetita kontraŭ pluraj malamikoj samtempe.
actors.hero.spells.shieldoflight$shieldoflighttracker.name=ŝildo de lumo
actors.hero.spells.shieldoflight$shieldoflighttracker.desc=Maldika luma muro apartiganta tiun ulon kaj malamikon. Ĝi ne estas sufiĉe forta por tute bloki atakojn, sed malfortigos ilin.\n\nPliaj temperoj: %s

actors.hero.spells.spiritform.name=spirita formo
actors.hero.spells.spiritform.short_desc=Asignas triunuon al ringo aŭ antikvaĵo.
actors.hero.spells.spiritform.desc=Kleriko elektas ringon aŭ antikvaĵon, kiun ri identigis dum tiu ĉi ludo (escepte de la sankta librego) kaj plenigas la triunuon per ĝia efiko.\n\nSe ringo estas elektita, la triunuo liveras efikon de tiu ringo samkiel ĝi estus je nivelo +%1$d por 20 temperoj.\n\nSe antikvaĵo estas elektita, la triunuo imitas ĝian efikon samkiel ĝi estus je nivelo +%2$d. Ĉiu antikvaĵo havas sian distingan sintenon kaj ŝargkoston kiam uzata kun la triunuo.\n\nTiu ĉi sorĉo anstataŭigas ĉiun alian spiritan efikon, kiu nuntempe plenigas la triunuon.
actors.hero.spells.spiritform$spiritformbuff.name=spirita formo
actors.hero.spells.spiritform$spiritformbuff.desc=La spirita formo de la triunuo nuntempe imitas povon de armaĵo, samkiel ĝi estus surmetita de vi.\n\nRimarku, ke la spirita formo ne povas imiti plian kopion de efiko, kies vi jam profitas.\n\nNuna efiko: %1$s.\n\nPliaj efikoj: %2$s.

actors.hero.spells.smite.name=venkfrapo
actors.hero.spells.smite.short_desc=Garantiata frapo kun kroma vundo kaj plipovigita ensorĉo.
actors.hero.spells.smite.desc=Paladino strebas por plenumi detruantan frapon.\n\nKrom kaŭzi norman vundon, venkfrapo neuzante tro pezan armilon ĉiam trafos, ĝia ensorĉo plipoviĝos je +300%% kaj kaŭzos %1$d-%2$d vundpoentojn permagie.\n\nKroma magia vundo pro venkfrapo pliiĝas kun nivelo de Paladino, kaj nemortaj aŭ demonaj malamikoj ĉiam ricevos la maksimuman valoron.

actors.hero.spells.stasis.name=stazo
actors.hero.spells.stasis.short_desc=Forigas amikon el la labirinto kaj konservas lin.
actors.hero.spells.stasis.desc=Kleriko enfokusigas la konekton kun amiko direkte al si, igante la amikon esti portempe frostigita en ia energia dormo ene Kleriko. La amiko estos konservita por maksimume %d temperoj kaj resta tempo de ĉiuj utilaj efikoj estas haltigita en la stazo.\n\nLa amiko aperos ĉe Kleriko kiam la stazo norme finos aŭ kiam Kleriko senpage reĵetos la sorĉon stazo por pli frue fini la efikon. La sorĉo eĉ povas movi nemoveblajn amikojn, sed ne povas movi ilin inter keletaĝoj.
actors.hero.spells.stasis$stasisbuff.name=amiko en stazo
actors.hero.spells.stasis$stasisbuff.left_behind=Vi lasas vian nemoveblan amikon.
actors.hero.spells.stasis$stasisbuff.desc=Kleriko nuntempe havas amikon konservitan en la stazo. Ĉiuj utilaj efikoj sur tiu amiko estas konservitaj – inkluzivante la plurforton – kaj li reaperos ĉe Kleriko kiam la efiko finos. La efiko ankaŭ povas esti finita pli frue per reĵeti la sorĉon stazo.\n\nKonservita amiko: %1$s.\nPliaj temperoj: %2$s.

actors.hero.spells.sunray.name=sunradio
actors.hero.spells.sunray.short_desc=Fore permagie vundas viktimon kaj unufoje blindumas lin.
actors.hero.spells.sunray.desc=Kleriko elpafas radion de blinduma lumo kontraŭ viktimo, kaŭzante %1$d-%2$d vundpoentojn kaj blindumante lin por %3$d temperoj. Sunradio ĉiam maksimume vundas nemortajn kaj demonajn bestaĉojn.\n\nPost esti trafita de tiu ĉi sorĉo, vidsenso de la viktimo alkutimiĝos, do li ne blinumiĝos denove. Se kontraŭulo estos trafita denove dum esti blindumita de la sunradio, la troa lumo paralizigos lin.

actors.hero.spells.walloflight.name=luma muro
actors.hero.spells.walloflight.short_desc=Kreas muron, kiu blokas malamikojn.
actors.hero.spells.walloflight.desc=Paladino starigas muron faritan el paneloj de solida lumo tuj apud si. La muro estas larĝa je 1 kahelo, longa je %1$d kaheloj kaj daŭros por 20 temperoj.\n\nTiu ĉi muro funkcios kiel norma muro, tamen oni povas vidi trans ĝi. Malamikoj blokitaj dum kreado de muro estos surdigitaj kaj repuŝitaj malantaŭen (se tio eblas). Ĉiu senmovigita ene la muro povos liberiĝi el ĝi.\n\nLa muron oni povas starigi laŭ ĉiuj kvar ĉefaj aŭ ĉiuj kvar diagonalaj direktoj. Se muro jam ekzistas, oni povas senŝarge reĵeti la sorĉon por senprokraste forigi la muron.
actors.hero.spells.walloflight.early_end=Vi forigis la luman muron.
actors.hero.spells.walloflight$lightwall.desc=Brilaj paneloj de lumo blokas trapasejon tie ĉi.

##main hero
actors.hero.hero.name=vi
actors.hero.hero.leave=Vi ankoraŭ ne povas forlasi, la resto de la labirinto atendas vin!
actors.hero.hero.level_up=Nivelo pli!
actors.hero.hero.new_level=Nivelo pli: +precizo, +evitpovo, +5 sanpoentoj!
actors.hero.hero.new_talent=+1 talent-poento!
actors.hero.hero.unspent=Vi havas neuzatajn talent-poentojn!
actors.hero.hero.level_cap=Vi atingis pinton de via povo, sekve viajn spertojn donos al vi subitan pliigon de forto!
actors.hero.hero.you_now_have=Vi kolektis aĵon: %s.
actors.hero.hero.you_cant_have=Mankas spaco por %s.
actors.hero.hero.locked_chest=Tiu ĉi kofro estas ŝlosita kaj vi ne havas kongruan ŝlosilon.
actors.hero.hero.locked_door=Vi ne havas kongruan ŝlosilon.
actors.hero.hero.noticed_smth=Vi rimarkis ion.
actors.hero.hero.wait=…
actors.hero.hero.search=priserĉi
actors.hero.hero.search_distracted=Malfacilas koncentriĝi, priserĉado estas laciga.
actors.hero.hero.key_distracted=Vi malsukcesis malŝlosi la seruron nun, vi devas reprovi.
actors.hero.hero.pain_resist=La sufero kaŭzas vin rezisti la deziron de dormo.
actors.hero.hero.revive=La anĥo eksplodas ellasante vivigan energion!

##classes
actors.hero.heroclass.warrior=batalisto
actors.hero.heroclass.warrior_desc_short=Batalisto povas elteni pliajn vundojn danke al ŝirmo liverata de lia _rompita sigelo._ La sigelon oni povas movi inter defendaĵoj kaj eblas _transigi unu plibonigon_ kun ĝi.
actors.hero.heroclass.warrior_desc=Batalisto komencas kun _unika rompita sigelo_, kiu subite liveras ŝirmon, kiam li havas malpli ol duono de sano. La sigelon oni povas movi inter defendaĵoj kaj eblas _transigi unu plibonigon_ kun ĝi.\n\nLi eniras la labirinton posedante _eluzitan glaveton_, _tri ĵetŝtonojn_, ŝtofan defendaĵon, felsakon kaj veluran sakon.\n\nBatalisto dekomence povas identigi:\n_–_ skribrulaĵojn de identigo,\n_–_ eliksirojn de sano,\n_–_ skribrulaĵojn de kolero.
actors.hero.heroclass.warrior_unlock=Batalisto estas malŝlosita dekomence.

actors.hero.heroclass.mage=magiisto
actors.hero.heroclass.mage_desc_short=Magiisto estas profesiulo pri sorĉado kaj posedas _magian bastonegon_, kiu estas pli potenca ol vergoj. La bastonegon oni povas _plenigi per magio de ĉiu vergo_, kiun Magiisto trovos en la labirinto.
actors.hero.heroclass.mage_desc=Magiisto komencas kun _unika bastonego_, kiu ŝargiĝas signife pli rapide ol vergoj kaj havas je 1 pli maksimuma ŝargo. La bastonegon oni povas _plenigi per ĉiu vergo_ trovita en la labirinto.\n\nLi eniras la labirinton posedante _vergon de magia kuglo_ plenigitan al la bastonego, ŝtofan defendaĵon, felsakon kaj veluran sakon.\n\nMagiisto dekomence povas identigi:\n_–_ skribrulaĵojn de identigo,\n_–_ eliksirojn de likva fajro,\n_–_ skribrulaĵojn de plibonigo.
actors.hero.heroclass.mage_unlock=Por malŝlosi Magiiston, _uzu skribrulaĵon de plibonigo por plifortigi aĵon._

actors.hero.heroclass.rogue=fripono
actors.hero.heroclass.rogue_desc_short=Fripono povas ŝtelpaŝi preter kontraŭuloj kaj ataki ilin estante nevidebla uzante sian _mantelon de ombroj._ Li ankaŭ _trovas kaŝaĵojn kaj kaptilojn_ de pli malproksime.
actors.hero.heroclass.rogue_desc=Fripono komencas kun _unika mantelo de ombroj_, kiun li povas uzi por iĝi nevidebla laŭvole.\n\nFripono _trovas kaŝaĵojn kaj kaptilojn_ de pli malproksime.\n\nLi eniras la labirinton posedante _ponardon_, _tri ĵettranĉilojn_, ŝtofan defendaĵon, felsakon kaj veluran sakon.\n\nFripono dekomence povas identigi:\n_–_ skribrulaĵojn de identigo,\n_–_ eliksirojn de nevidebleco,\n_–_ skribrulaĵojn de magia mapado.
actors.hero.heroclass.rogue_unlock=Por malŝlosi Friponon, _plenumu 10 surprizajn atakojn dum unu ludo._

actors.hero.heroclass.huntress=ĉasistino
actors.hero.heroclass.huntress_desc_short=Ĉasistino estas lerta pri ĵetarmiloj kaj havas _magian pafarkon_ kun senlimaj sagoj. Ŝi ankaŭ povas trairi herbon _sen piedpremi ĝin._
actors.hero.heroclass.huntress_desc=Ĉasistino komencas kun _unika spirita pafarko_, kiu povas arkpafi senliman nombron da magiaj sagoj.\n\nĈasistino povas trairi altan herbon sen piedpremi ĝin.\n\nŜi eniras la labirinton posedante _pikilecajn gantojn_, ŝtofan defendaĵon, felsakon kaj veluran sakon.\n\nĈasistino dekomence povas identigi:\n_–_ skribrulaĵojn de identigo,\n_–_ eliksirojn de mensvido,\n_–_ skribrulaĵojn de lulkanto.
actors.hero.heroclass.huntress_unlock=Por malŝlosi Ĉasistinon, _trafu malamikojn per ĵetarmiloj 10-foje dum unu ludo._

actors.hero.heroclass.duelist=duelistino
actors.hero.heroclass.duelist_desc_short=Duelistino estas majstrino pri manarmiloj kaj povas ekigi _specialan armilan atakon._ Tiu speciala atako estas _malsama por ĉiu armilo._
actors.hero.heroclass.duelist_desc=Duelistino komencas kun _unika rapiro_ kun speciala atako, kiu ŝargiĝas laŭ tempo.\n\nĈiu manarmilo en la ludo havas _diferencan specialan atakon_, kiun Duelistino povas uzi.\n\nŜi eniras la labirinton posedante _du ĵetpikilojn_, ŝtofan defendaĵon, felsakon kaj veluran sakon.\n\nDuelistino dekomence povas identigi:\n_–_ skribrulaĵojn de identigo,\n_–_ eliksirojn de povo,\n_–_ skribrulaĵojn de spegula figuro.
actors.hero.heroclass.duelist_unlock=Por malŝlosi Duelistinon, _surmetu almenaŭ 2-supernivelan armilon havante sufiĉan povon._

actors.hero.heroclass.cleric=kleriko
actors.hero.heroclass.cleric_desc_short=Kleriko estas dieca sorĉisto, kiu uzas sian unikan _sanktan libregon_ por alidirekti diecan magion. Ri povas _lerni novajn kaj plibonigi sorĉaĵojn_ uzante talentojn.
actors.hero.heroclass.cleric_desc=Kleriko komencas kun _unika sankta librego_, kiun ri povas uzi por ĵeti diversajn sorĉojn.\n\nLa plejparto da talentoj de Kleriko koncentriĝas sur lerni aŭ plibonigi sorĉojn.\n\nRi eniras la labirinton posedante _madzon_, ŝtofan defendaĵon, veluran sakon kaj felsakon.\n\nKleriko dekomence povas identigi:\n_–_ skribrulaĵojn de identigo,\n_–_ eliksirojn de purigo,\n_–_ skribrulaĵojn de senmalbenigo.
actors.hero.heroclass.cleric_unlock=Por malŝlosi Klerikon, _plene forigu malbenon de iu malbenita armaĵo._

actors.hero.herosubclass.berserker=berserko
actors.hero.herosubclass.berserker_short_desc=_Berserko_ akiras “koleron” proporcie al ricevataj vundoj. Kolero igas lin pli forta kaj povas aktiviĝi je 100% donante kroman ŝirmon.
actors.hero.herosubclass.berserker_desc=Berserko akiras “koleron” dum vundiĝi pro korpaj atakoj, vundoj sorbitaj de defendaĵo ankaŭ al tio enkalkuliĝas! Kolero malaperas laŭtempe kaj malaperas malpli rapide je malmulte da sano.\n\nKolero pliigas vundpovon de Berserko maksimume je +50%. Je plena kolero li povas “berserki” – akirante subitan ŝirmon kaj estante kolera tiel longe, kiel tiu ŝirmo estas aktiva. La ŝirmo estas proporcia al nivelo de defendaĵo de Berserko kaj signife plipoviĝas je malmulte da sano. Berserko devos ripozi antaŭ ol li povos berserki ree.
actors.hero.herosubclass.gladiator=gladiatoro
actors.hero.herosubclass.gladiator_short_desc=_Gladiatoro_ pliigas “fraparon” post ĉiu sukcesa frapo. Li povas uzi akiritan fraparon por fari specialajn atakojn.
actors.hero.herosubclass.gladiator_desc=Gladiatoro akiras po unu poento da “fraparo” post ĉiu sukcesa atako per permana aŭ ĵeta armilo. Kiam Gladiatoro ne faras sukcesan atakon dum 5 temperoj (15 temperoj post mortigo), la fraparo perdiĝas.\n\nAkiritajn frapar-poentojn Gladiatoro povas uzi por plenumi diversajn neeviteblajn atakojn:\n2-obla fraparo: forpuŝas malamikon, konservas fraparon;\n4-obla fraparo: vundas proporcie al defendaĵo;\n6-bola fraparo: blokas kontraŭfrapon, konservas fraparon;\n8-obla fraparo: vundas viktimon kaj proksimajn malamikojn;\n10-obla fraparo: atakas po unu frapo por ĉiu frapar-poento.
actors.hero.herosubclass.battlemage=batalmagiisto
actors.hero.herosubclass.battlemage_short_desc=_Batalmagiisto_ akiras ekstrajn efikojn dum permane ataki per sia bastonego. Tiuj efikoj dependas de vergo, per kiu la bastonego estas plenigita.
actors.hero.herosubclass.battlemage_desc=Batalmagiisto akiras ekstran efikon, kiam li permane frapas malamikon per sia bastonego, samkiel la bastonego havus ensorĉon. Tiu ĉi efiko dependas de vergo, per kiu li plenigis la bastonego, do ĉiu vergo donas alian efikon. Aldone al la menciitaj efikoj, la bastonego gajnas 0,5 ŝargojn por frapo.
actors.hero.herosubclass.warlock=sorĉisto
actors.hero.herosubclass.warlock_short_desc=_Sorĉisto_ havas ŝancon por marki spiriton de monstro per uzi vergon. Li saniĝos kiam li perkorpe vundos markitajn kontraŭulojn.
actors.hero.herosubclass.warlock_desc=Sorĉisto havas ŝancon por marki spiriton de atakata monstro per uzi vergon. La ŝanco por marki spiriton kaj ĝia daŭro pliiĝas kun nivelo de vergo.\n\nKiam spirito de malamiko estas markita, Sorĉisto saniĝos je 2 sanpoentoj por ĉiuj 5 kaŭzataj vundpoentoj – sed nur vundpoentoj pro manarmiloj kaj ĵetarmilo enkalkuliĝas, ne pro vergoj!
actors.hero.herosubclass.assassin=kaŝmortigisto
actors.hero.herosubclass.assassin_short_desc=_Kaŝmortigisto_ povas prepari mortigan frapon dum esti nevidebla. Ju pli longe li atendas, des pli forta la atako estos.
actors.hero.herosubclass.assassin_desc=Kaŝmortigisto preparas sian sekvan atakon dum esti nevidebla. Ju pli longe li prepariĝas, des pli forta la sekva frapo estos. Preparo povas daŭri maksimume 9 temperojn.\n\nPost prepariĝi Kaŝmortigisto kaŭzas kroman vundon per sia sekva frapo, povas ekaperi ĉe la viktimo kaj eĉ povas senprokraste mortigi malfortajn kontraŭuloj.
actors.hero.herosubclass.freerunner=sprintisto
actors.hero.herosubclass.freerunner_short_desc=_Sprintisto_ akiras “movizon” dum kurado, kiun li povas uzi por komenci “sprinti”. Sprinto pliigas lian movrapidon kaj rapidpovon por mallonga tempo.
actors.hero.herosubclass.freerunner_desc=Dum moviĝi Sprintisto akiras “movizon”. Li povas akiri maksimume 10 poentojn da movizo kurante dum 10 temperoj, sed la movizo rapide perdiĝas post ĉesigi kuri. Sprintisto povas uzi akiritan movizon por “sprinti” – li uzos po 1 poeto da movizo por 2 temperoj de sprinto.\n\nDum sprinti Sprintisto moviĝas kun duobla rapido kaj ricevas aldonas evitpovon depende de lia nivelo. Post fini sprinti necesos atendi kelkajn temperojn antaŭ ol denove akiri movizon.
actors.hero.herosubclass.sniper=celpafistino
actors.hero.herosubclass.sniper_short_desc=_Celpafistino_ povas trapiki defendaĵon per atakoj je distanco. Post trafi malamikon per ĵetarmilo, ŝi povas pluigi per speciala atako per sia pafarko.
actors.hero.herosubclass.sniper_desc=Celpafistino estas majstro pri batalo je distanco kaj ŝiaj foraj atakoj povas trapiki defendaĵon de kontraŭulo. Kiam ŝi atakas monstron per ĵetarmilo, ŝi enmetas sur ĝi “celpafistinan markon”, kiu ebligas al ŝi pluigi per speciala atako per sia pafarko. La speciala atako dependas de maniero kiel ŝia pafarko estas plivastigita.\n\nNeplivastigita pafarko ellasas sagon kaŭzantan malgrandan vundon, sed ĝi pafas senprokraste. Rapide-plivastigita pafarko pafas salvon da tri sagoj, kiuj kaŭzas malgrandajn vundojn kaj plue povas aktivigi ensorĉojn kaj daŭras 1 temperon por pafi. Vundpove-plivastigita pafarko pafas sagon, kiu certe trafas la kontraŭulon, vundas proporcie al fluginta distanco kaj daŭras 2 temperojn por pafi.
actors.hero.herosubclass.warden=gardistino
actors.hero.herosubclass.warden_short_desc=_Gardistino_ povas vidi trans densa herbo kaj akiras ekstrajn efikojn dum planti semojn aŭ piedpremi vegetaĵojn.
actors.hero.herosubclass.warden_desc=Gardistino estas forte kunigita kun fortoj de la naturo, kiuj donas al ŝi ekstrajn efikojn rilataj al herbo kaj vegetaĵoj. Ŝi povas vidi trans alta kaj disŝovita herbo samkiel ĝi estus malplena tereno.\n\nGardistino igas al herbo kreski ĉe ĉiu ĵetita/plantita semo kaj akiras ekstrajn efikojn dum piedpremi vegetaĵojn. Tiuj specialaj efikoj anstataŭigas la normajn efikojn, do neniu vegetaĵo estas por ŝi malutila.
actors.hero.herosubclass.champion=majstrino
actors.hero.herosubclass.champion_short_desc=_Majstrino_ povas teni du armilojn kaj havas pli poentojn da specialaj armilaj atakoj. Ŝi norme atakas per sia ĉefa armilo, krom tio ŝi povas interŝanĝi armilojn kaj uzi specialajn atakojn de ambaŭ armiloj.
actors.hero.herosubclass.champion_desc=Majstrino estas lerta pri manarmiloj kaj povas teni du armilojn samtempe. Ŝi norme atakas per sia ĉefa armilo, krom tio ŝi povas senprokraste interŝanĝi armilojn kaj uzi specialajn atakojn de ambaŭ armiloj.\n\nLa heroino akiras 2 poentojn al maksimumo de speciala armila atako kaj +50% al rapido de ĝia ŝargado.
actors.hero.herosubclass.monk=monaĥino
actors.hero.herosubclass.monk_short_desc=_Monaĥino_ akiras energion dum batali. Tiun energion ŝi povas utiligi al diversaj unikaj kapabloj.
actors.hero.herosubclass.monk_desc=Monaĥino koncentriĝas sur batal-teĥniko. Kiam ŝi venkas malamikojn, ŝi akiras energion, kiun ŝi povas utiligi al diversaj kapabloj defendaj kaj objektaj. Tiu ĉi energio ne perdiĝas kun fluo de tempo, tamen havas limigon dependan de nivelo de Monaĥino.\n\n1 ŝargo: rapida pugnobataro;\n2 ŝargoj: koncentriĝi por eviti atakon;\n3 ŝargoj: senprokrasta alsalto;\n4 ŝargoj: forpiedbati malamikon;\n5 ŝargoj: mediti por nuligi efikojn kaj ŝargi vergojn kaj antikvaĵojn
actors.hero.herosubclass.priest=pastro
actors.hero.herosubclass.priest_short_desc=_Pastro_ akiras novajn forajn sorĉojn kaj plipovigitan version de la gvida lumo.
actors.hero.herosubclass.priest_desc=Pastro akiras diversajn novajn kaj plibonigitajn sorĉojn, kiuj koncentriĝas sur batalo je distanco kaj sur kunlaboro kun magiaj aĵoj.\n\nPastro povas ĵeti la _gvidan lumon_ sen uzi ŝargon unufoje je 50 temperoj, lumigi kontraŭulon per senpere trafi lin per iu sorĉo, kaj povas sorbi la efikon “lumiĝanta” per amikoj, vergopafoj aŭ per iuj antikvaĵoj kaŭzante kromajn vundpoentojn egalajn al sia nivelo + 5.\n\nPastro ankaŭ akiras la sorĉon _glorbrilo,_ kiu disigas mallumon, influas al ĉiuj videblaj kontraŭuloj, aktivigas kaj estigas la efikon “lumiĝanta” kaj provizore surdigas ĉiujn videblajn kontraŭulojn uzante 2 ŝargojn.
actors.hero.herosubclass.paladin=paladino
actors.hero.herosubclass.paladin_short_desc=_Paladino_ akiras novajn malforajn sorĉojn kaj plipovigitajn versiojn de la sanktaj armilo kaj defendaĵo.
actors.hero.herosubclass.paladin_desc=Paladino akiras diversajn novajn kaj plibonigitajn sorĉojn, kiuj koncentriĝas sur permana batalo kaj sur kunlaboro kun armiloj kaj defendaĵoj.\n\nLa sorĉoj _sankta armilo_ kaj _sankta defendaĵo_ estas plifortigitaj, ne plu superskribas la ekzistajn ensorĉojn/skribaĵojn kaj povas esti plivastigitaj per ĵeti aliajn sorĉojn.\n\nPaladino ankaŭ akiras la sorĉon _venkfrapo,_ ebligante al ri plenumi frapon, kiu certe trafas kaŭzante kromajn vundpoentojn kaj plipovigitan ensorĉon.

##talents
actors.hero.talent$provokedangertracker.name=provokita kolereto
actors.hero.talent$provokedangertracker.desc=Batalisto antaŭnelonge perdis sian ŝirmon, lia sekva korpa atako kaŭzos ekstrajn vundojn.\n\nPliaj temperoj: %s.
actors.hero.talent$lingeringmagictracker.name=tiriĝanta magio
actors.hero.talent$lingeringmagictracker.desc=Magiisto antaŭnelonge uzis sian bastonegon aŭ vergon, lia sekva korpa atako kaŭzos ekstrajn vundojn.\n\nPliaj temperoj: %s.
actors.hero.talent$followupstriketracker.name=sekva frapo
actors.hero.talent$followupstriketracker.desc=Ĉasistino antaŭe atakis malamikon per ĵetarmilo, ŝia sekva permana atako kontraŭ la sama malamiko estos plifortigita.\n\nPliaj temperoj: %s.
actors.hero.talent$patientstriketracker.name=pacienca frapo
actors.hero.talent$patientstriketracker.desc=Dualistino atendis temperon, do ŝia sekva permana atako estos plifortigita.
actors.hero.talent$improvisedprojectilecooldown.name=Trankvil-tempo por improvizitaj ĵetarmiloj
actors.hero.talent$improvisedprojectilecooldown.desc=Antaŭ nelonga tempo vi uzis tiun ĉi talenton kaj nun necesas atendi antaŭ ol reuzi ĝin.\n\nPliaj temperoj por atendi: %s.
actors.hero.talent$rejuvenatingstepscooldown.name=Trankvil-tempo por refreŝigaj paŝoj
actors.hero.talent$rejuvenatingstepscooldown.desc=Antaŭ nelonga tempo vi uzis tiun ĉi talenton kaj nun necesas atendi antaŭ ol reuzi ĝin.\n\nPliaj temperoj por atendi: %s.
actors.hero.talent$seershotcooldown.name=Trankvil-tempo por aŭgura pafo
actors.hero.talent$seershotcooldown.desc=Antaŭ nelonga tempo vi uzis tiun ĉi talenton kaj nun necesas atendi antaŭ ol reuzi ĝin.\n\nPliaj temperoj por atendi: %s.
actors.hero.talent$aggressivebarriercooldown.name=trankvil-tempo por ŝirmo de agreso
actors.hero.talent$aggressivebarriercooldown.desc=Antaŭ nelonga tempo vi uzis tiun ĉi talenton kaj nun necesas atendi antaŭ ol reuzi ĝin.\n\nPliaj temperoj por atendi: %s.
actors.hero.talent$liquidagilacctracker.name=malkorkita evitpovo
actors.hero.talent$liquidagilacctracker.desc=La sekva permana atako de Duelistino estos pli preciza.\n\nPliaj temperoj: %s.
actors.hero.talent$lethalhastecooldown.name=trankvil-tempo por mortiga rapidemo
actors.hero.talent$lethalhastecooldown.desc=Antaŭ nelonga tempo vi uzis tiun ĉi talenton kaj nun necesas atendi antaŭ ol reuzi ĝin.\n\nPliaj temperoj por atendi: %s.
actors.hero.talent$swiftequipcooldown.name=trankvil-tempo por interŝanĝi armilon
actors.hero.talent$swiftequipcooldown.desc=Antaŭ nelonga tempo vi uzis tiun ĉi talenton kaj nun necesas atendi antaŭ ol reuzi ĝin.\n\nPliaj temperoj por atendi: %s.
actors.hero.talent$preciseassaulttracker.name=preciza atenco
actors.hero.talent$preciseassaulttracker.desc=La sekva permana atako de Duelistino estos pli preciza.\n\nPliaj temperoj: %s.
actors.hero.talent$deadlyfollowuptracker.name=mortiga sinsekvo
actors.hero.talent$deadlyfollowuptracker.desc=Duelistino antaŭe atakis malamikon per ĵetarmilo, ŝiaj sekvaj permanaj atakoj kontraŭ la sama malamiko estos plifortigitaj.\n\nPliaj temperoj: %s.
actors.hero.talent$combinedlethalityabilitytracker.executed=preparita ekzekuto
actors.hero.talent$satiatedspellstracker.name=Sorĉo de ŝirmo
actors.hero.talent$satiatedspellstracker.desc=La sekva sorĉo ĵetita de Kleriko liveros al ri iom da ŝirmo.
actors.hero.talent$searinglightcooldown.name=Brulanta lumo
actors.hero.talent$searinglightcooldown.desc=Antaŭ nelonga tempo vi uzis tiun ĉi talenton kaj nun necesas atendi antaŭ ol reuzi ĝin.\n\nPliaj temperoj por atendi: %s.

#warrior
actors.hero.talent.hearty_meal.title=nutranta manĝaĵo
actors.hero.talent.hearty_meal.desc=_+1:_ manĝado sanigas Bataliston je _4 sanpoentoj_ kiam li havas malpli ol 33% de sano.\n\n_+2:_ manĝado sanigas Bataliston je _6 sanpoentoj_ kiam li havas malpli ol 33% de sano.
actors.hero.talent.veterans_intuition.title=intuicio de veterano
actors.hero.talent.veterans_intuition.desc=_+1:_ Batalisto identigas armilojn _1,75× pli rapide_ kaj defendaĵojn _2,5× pli rapide_\n\n_+2:_ Batalisto identigas armilojn _2,5× pli rapide_ kaj defendaĵojn _kiam li surmetas ilin._
actors.hero.talent.provoked_anger.title=provokita kolereto
actors.hero.talent.provoked_anger.desc=_+1:_ kiam ia ŝirma efiko aplikita al Batalisto malaperas pro ricevi vundon, lia sekva permana atako kaŭzos _3 kromajn vundpoentojn_.\n\n_+2:_ kiam ia ŝirma efiko aplikita al Batalisto malaperas pro ricevi vundon, lia sekva permana atako kaŭzos _5 kromajn vundpoentojn_.
actors.hero.talent.iron_will.title=fera volo
actors.hero.talent.iron_will.desc=_+1:_ ŝirmo generata de la sigelo de Batalisto _pliiĝas je 1 poento_.\n\n_+2:_ ŝirmo generata de la sigelo de Batalisto _pliiĝas je 2 poentoj_.
actors.hero.talent.iron_will.meta_desc=_Se tiu ĉi talento estos akirita de alia heroo_, li pasive akiros maksimume 1 aŭ 2 ŝirm-poentojn agantajn same kiel tiuj de la rompita sigelo de Batalisto.

actors.hero.talent.iron_stomach.title=fera stomako
actors.hero.talent.iron_stomach.desc=_+1:_ manĝado daŭras 1 temperon kaj donas al Batalisto _75% reziston kontraŭ vundoj_ dum manĝado.\n\n_+2:_ manĝado daŭras 1 temperon kaj donas al Batalisto _100% reziston kontraŭ vundoj_ dum manĝado.
actors.hero.talent.liquid_willpower.title=trinkebla forta volo
actors.hero.talent.liquid_willpower.desc=_+1:_ Batalisto regajnas _6,5% de sia maksimuma sano en formo de ŝirmo_ dum trinki aŭ ĵeti eliksiron, infuzaĵon aŭ miksturon.\n\n_+2:_ Batalisto regajnas _10% de sia maksimuma sano en formo de ŝirmo_ dum trinki aŭ ĵeti eliksiron, infuzaĵon aŭ miksturon.\n\nTiu ĉi efiko duobliĝas kiam Batalisto uzas eliksirojn de povo, sperto aŭ aĵojn akiritajn per alĥemio uzante la menciitajn eliksirojn.\n\nSe dum alĥemio kuiriĝas plurajn trinkaĵojn (ekzemplo: akva infuzaĵo), ŝanco por ekigi tiun ĉi efikon dependas de kvanto da kuiritaj trinkaĵoj.
actors.hero.talent.runic_transference.title=transigo de skribaĵo
actors.hero.talent.runic_transference.desc=_+1:_ la rompita sigelo de Batalisto povas transigi _kutimajn skribaĵojn_ en la sama maniero, kiel ĝi transigas plibonigon.\n\n_+2:_ la rompita sigelo de Batalisto povas transigi _kutimajn, potencajn kaj malbenajn skribaĵojn_ en la sama maniero, kiel ĝi transigas plibonigon.\n\nLa sigelo povas transigi nur tiun skribaĵon, kiu estis gravurita al la defendaĵo kun surmetita sigelo.
actors.hero.talent.runic_transference.meta_desc=_Se tiu ĉi talento estos akirita de alia heroo_, ĝi malfaciligos forviŝi skribaĵon de via defendaĵo dum uzi skribrulaĵon de plibonigo. Skribaĵoj povos forviŝiĝi dum plibonigi defendaĵon de nivelo +6 (implicite +4) – je talent-nivelo +1; aŭ komence de nivelo +7 je talent-nivelo +2. Skribaĵoj certe forviŝiĝos dum plibonigi defendaĵon de nivelo +8 (implicite la same).
actors.hero.talent.lethal_momentum.title=impeto de morto
actors.hero.talent.lethal_momentum.desc=_+1:_ kiam Batalisto mortigas kontraŭulon per permana armilo, la mortiga frapo havas _67% ŝancon_ por daŭri 0 tempero.\n\n_+2:_ kiam Batalisto mortigas kontraŭulon per permana armilo, la mortiga frapo havas _100% ŝancon_ por daŭri 0 tempero.
actors.hero.talent.improvised_projectiles.title=improvizitaj ĵetarmiloj
actors.hero.talent.improvised_projectiles.desc=_+1:_ Batalisto povas blindumi kontraŭulon por _2 temperoj_ per ĵeti al li ajnan aĵon, kiu ne estas ĵetarmilo. Necesas atendi 50 temperojn antaŭ ol reuzi tiun ĉi talenton.\n\n_+2:_ Batalisto povas blindumi kontraŭulon por _3 temperoj_ per ĵeti al li ajnan aĵon, kiu ne estas ĵetarmilo. Necesas atendi 50 temperojn antaŭ ol reuzi tiun ĉi talenton.

actors.hero.talent.hold_fast.title=firma pozicio
actors.hero.talent.hold_fast.desc=_+1:_ kiam Batalisto atendas, li akiras _1-2 ŝirm-poentojn_ kaj rapido de malapero de fraparo kaj utilaj efikoj etiĝas je _50%_, ĝis li moviĝos.\n\n_+2:_ kiam Batalisto atendas, li akiras _2-4 ŝirm-poentojn_ kaj rapido de malapero de fraparo kaj utilaj efikoj etiĝas je _75%_, ĝis li moviĝos.\n\n_+3:_ kiam Batalisto atendas, li akiras _3-6 ŝirm-poentojn_ kaj rapido de malapero de fraparo kaj utilaj efikoj etiĝas je _100%_, ĝis li moviĝos.
actors.hero.talent.strongman.title=fortulo
actors.hero.talent.strongman.desc=_+1:_ pliigas povon de Batalisto _je 8%_ (rondigita malsupren).\n\n_+2:_ pliigas povon de Batalisto _je 13%_ (rondigita malsupren).\n\n_+3:_ pliigas povon de Batalisto _je 18%_ (rondigita malsupren).

actors.hero.talent.endless_rage.title=senfina kolero
actors.hero.talent.endless_rage.desc=_+1:_ Berserko povas akiri maksimume _116% de kolero_.\n\n_+2:_ Berserko povas akiri maksimume _133% de kolero_.\n\n_+3:_ Berserko povas akiri maksimume _150% de kolero_.\n\nĈiu elcent-poento super 100% de kolero pliigas ŝirmon de Berserko je 1%, malpliigas trankvil-tempon je 1%, tamen aldona vundpovo ne pliiĝas super +50%.
actors.hero.talent.deathless_fury.title=senmorta kolero
actors.hero.talent.deathless_fury.desc=_+1:_ berserkado aŭtomate aktiviĝas kiam Berserko preskaŭmortas kaj lia kolero estas minimume 100%. La trankvil-tempo por reuzi tiun ĉi talenton estas _3 heroaj niveloj_.\n\n_+2:_ berserkado aŭtomate aktiviĝas kiam Berserko preskaŭmortas kaj lia kolero estas minimume 100%. La trankvil-tempo por reuzi tiun ĉi talenton estas _2 heroaj niveloj_.\n\n_+3:_ berserkado aŭtomate aktiviĝas kiam Berserko preskaŭmortas kaj lia kolero estas minimume 100%. La trankvil-tempo por reuzi tiun ĉi talenton estas _1 heroa nivelo_.\n\nRimarku ke Berserko mortos kiam li havos 0 sanpoentojn je fino de berserkado.
actors.hero.talent.enraged_catalyst.title=kolera katalizilo
actors.hero.talent.enraged_catalyst.desc=_+1:_ ensorĉoj kaj malbenoj sur armilo de Berserko aktiviĝas ju pli ofte des pli kolerigita li estas, maksimume _15% pli ofte_ je plena kolero.\n\n_+2:_ ensorĉoj kaj malbenoj sur armilo de Berserko aktiviĝas ju pli ofte des pli kolerigita li estas, maksimume _30% pli ofte_ je plena kolero.\n\n_+3:_ ensorĉoj kaj malbenoj sur armilo de Berserko aktiviĝas ju pli ofte des pli kolerigita li estas, maksimume _45% pli ofte_ je plena kolero.

actors.hero.talent.cleave.title=disrompigisto
actors.hero.talent.cleave.desc=_+1:_ tempo por pluigi fraparon post mortigi kontraŭulon pliiĝas al _30 temperoj_ (norme 15).\n\n_+2:_ tempo por pluigi fraparon post mortigi kontraŭulon pliiĝas al _45 temperoj_ (norme 15).\n\n_+3:_ tempo por pluigi fraparon post mortigi kontraŭulon pliiĝas al _60 temperoj_ (norme 15).
actors.hero.talent.lethal_defense.title=defendo de morto
actors.hero.talent.lethal_defense.desc=_+1:_ kiam Gladiatoro mortigas malamikon per fraparo, la tempo necesa por atendi ĝis reakiri ŝirmon de lia rompita sigelo estas _etigita je 50 temperoj_.\n\n_+2:_ kiam Gladiatoro mortigas malamikon per fraparo, la tempo necesa por atendi ĝis reakiri ŝirmon de lia rompita sigelo estas _etigita je 100 temperoj_.\n\n_+3:_ kiam Gladiatoro mortigas malamikon per fraparo, la tempo necesa por atendi ĝis reakiri ŝirmon de lia rompita sigelo estas _etigita je 150 temperoj_.\n\nTiu atenda tempo – por reuzi la rompitan sigelon – povas esti reduktita al 150 temperoj per tiu ĉi talento, tio signifas, ke ĝi estas reakirebla tuj post aktivigo.
actors.hero.talent.enhanced_combo.title=plilertigita fraparo
actors.hero.talent.enhanced_combo.desc=_+1:_ kiam Gladiatoro plenumas 7- aŭ pli-opan fraparon, la ”surdigfrapo” forbatas malamikon je 3 kaheloj, igas ĝin ebria kaj povas forbati ĝin abismen.\n\n_+2:_ aldone al efikoj de +1, kiam la fraparo estas 9- aŭ pli-opa la ”repuŝo“ agas dum pluraj frapoj.\n\n_+3:_ aldone al efikoj de +1 kaj +2, Gladiatoro povas salti trans 3 kaheloj post fari “krakigon”, “frakason” aŭ “furiozon”.

actors.hero.talent.body_slam.title=mortiga surteriĝo
actors.hero.talent.body_slam.desc=_+1:_ kiam Batalisto surteriĝas post salto, ĉiuj apudaj malamikoj ricevas vundojn egalajn al _1-4 plus 25%_ de lia maksimuma blokpovo.\n\n_+2:_ kiam Batalisto surteriĝas post salto, ĉiuj apudaj malamikoj ricevas vundojn egalajn al _2-8 plus 50%_ de lia maksimuma blokpovo.\n\n_+3:_ kiam Batalisto surteriĝas post salto, ĉiuj apudaj malamikoj ricevas vundojn egalajn al _3-12 plus 75%_ de lia maksimuma blokpovo.\n\n_+4:_ kiam Batalisto surteriĝas post salto, ĉiuj apudaj malamikoj ricevas vundojn egalajn al _4-16 plus 100%_ de lia maksimuma blokpovo.
actors.hero.talent.impact_wave.title=falondo
actors.hero.talent.impact_wave.desc=_+1:_ kiam Batalisto surteriĝas post salto, ĉiuj apudaj malamikoj estas forpuŝitaj je _2 kaheloj_ kun _25% probablo_ ricevi la staton “vundeblo” por 5 temperoj.\n\n_+2:_ kiam Batalisto surteriĝas post salto, ĉiuj apudaj malamikoj estas forpuŝitaj je _3 kaheloj_ kun _50% probablo_ ricevi la staton “vundeblo” por 5 temperoj.\n\n_+3:_ kiam Batalisto surteriĝas post salto, ĉiuj apudaj malamikoj estas forpuŝitaj je _4 kaheloj_ kun _75% probablo_ ricevi la staton “vundeblo” por 5 temperoj.\n\n_+4:_ kiam Batalisto surteriĝas post salto, ĉiuj apudaj malamikoj estas forpuŝitaj je _5 kaheloj_ kun _100% probablo_ ricevi la staton “vundeblo” por 5 temperoj.
actors.hero.talent.double_jump.title=duobla salto
actors.hero.talent.double_jump.desc=_+1:_ kiam Batalisto resaltas post 3 temperoj, la dua salto uzas je _16% malpli_ de ŝargoj.\n\n_+2:_ kiam Batalisto resaltas post 3 temperoj, la dua salto uzas je _30% malpli_ de ŝargoj.\n\n_+3:_ kiam Batalisto resaltas post 3 temperoj, la dua salto uzas je _40% malpli_ de ŝargoj.\n\n_+4:_ kiam Batalisto resaltas post 3 temperoj, la dua salto uzas je _50% malpli_ de ŝargoj.

actors.hero.talent.expanding_wave.title=etendita ŝokondo
actors.hero.talent.expanding_wave.desc=_+1:_ radiuso de ŝokondo pliiĝas al _6 kaheloj_ (el 5) kaj ĝia angula distanco pliiĝas al _75°_ (el 60°).\n\n_+2:_ radiuso de ŝokondo pliiĝas al _7 kaheloj_ (el 5) kaj ĝia angula distanco pliiĝas al _90°_ (el 60°).\n\n_+3:_ radiuso de ŝokondo pliiĝas al _8 kaheloj_ (el 5) kaj ĝia angula distanco pliiĝas al _105°_ (el 60°).\n\n_+4:_ radiuso de ŝokondo pliiĝas al _9 kaheloj_ (el 5) kaj ĝia angula distanco pliiĝas al _120°_ (el 60°).
actors.hero.talent.striking_wave.title=frapeca ŝokondo
actors.hero.talent.striking_wave.desc=_+1:_ estas _35% ŝanco_, ke vundo pro ŝokondo ankaŭ aktivigas efikojn rilatajn al frapoj: ensorĉojn kaj specialajn atakojn de fraparo.\n\n_+2:_ estas _60% ŝanco_, ke vundo pro ŝokondo ankaŭ aktivigas efikojn rilatajn al frapoj: ensorĉojn kaj specialajn atakojn de fraparo.\n\n_+3:_ estas _90% ŝanco_, ke vundo pro ŝokondo ankaŭ aktivigas efikojn rilatajn al frapoj: ensorĉojn kaj specialajn atakojn de fraparo.\n\n_+4:_ estas _100% ŝanco_, ke vundo pro ŝokondo ankaŭ aktivigas efikojn rilatajn al frapoj: ensorĉojn kaj specialajn atakojn de fraparo, kaj ensorĉoj estas je _+20% pli potencaj_.
actors.hero.talent.shock_force.title=surdiga ŝokondo
actors.hero.talent.shock_force.desc=_+1:_ ŝokondo _vundas je 20% pli_ kaj havas _25% ŝancon_ por surdigi malamikojn anstataŭ kripligi ilin.\n\n_+2:_ ŝokondo _vundas je 40% pli_ kaj havas _50% ŝancon_ por surdigi malamikojn anstataŭ kripligi ilin.\n\n_+3:_ ŝokondo _vundas je 60% pli_ kaj havas _75% ŝancon_ por surdigi malamikojn anstataŭ kripligi ilin.\n\n_+4:_ ŝokondo _vundas je 80% pli_ kaj havas _100% ŝancon_ por surdigi malamikojn anstataŭ kripligi ilin.

actors.hero.talent.sustained_retribution.title=daŭriĝanta venĝo
actors.hero.talent.sustained_retribution.desc=_+1:_ Batalisto havas _115% kroman vundpovon_ dividitan al _2 frapoj_ anstataŭ 100% kroman vundpovon en 1 frapo.\n\n_+2:_ Batalisto havas _130% kroman vundpovon_ dividitan al _3 frapoj_ anstataŭ 100% kroman vundpovon en 1 frapo.\n\n_+3:_ Batalisto havas _145% kroman vundpovon_ dividitan al _4 frapoj_ anstataŭ 100% kroman vundpovon en 1 frapo.\n\n_+4:_ Batalisto havas _160% kroman vundpovon_ dividitan al _5 frapoj_ anstataŭ 100% kroman vundpovon en 1 frapo.
actors.hero.talent.shrug_it_off.title=batu min pli forte!
actors.hero.talent.shrug_it_off.desc=_+1:_ redukto de ricevataj vundoj dum daŭro de la efiko “sufero” _pliiĝas al 60%_ (implicite 50%).\n\n_+2:_ redukto de ricevataj vundoj dum daŭro de la efiko “sufero” _pliiĝas al 68%_ (implicite 50%).\n\n_+3:_ redukto de ricevataj vundoj dum daŭro de la efiko “sufero” _pliiĝas al 74%_ (implicite 50%).\n\n_+4:_ redukto de ricevataj vundoj dum daŭro de la efiko “sufero” _pliiĝas al 80%_ (implicite 50%).
actors.hero.talent.even_the_odds.title=egalaj ŝancoj
actors.hero.talent.even_the_odds.desc=_+1:_ post trasuferi Batalisto havas _5% kroman vundpovon_ kontraŭ ĉiu kontraŭulo ene la distanco 2 kaheloj.\n\n_+2:_ post trasuferi Batalisto havas _10% kroman vundpovon_ kontraŭ ĉiu kontraŭulo ene la distanco 2 kaheloj.\n\n_+3:_ post trasuferi Batalisto havas _15% kroman vundpovon_ kontraŭ ĉiu kontraŭulo ene la distanco 2 kaheloj.\n\n_+4:_ post trasuferi Batalisto havas _20% kroman vundpovon_ kontraŭ ĉiu kontraŭulo ene la distanco 2 kaheloj.

#mage
actors.hero.talent.empowering_meal.title=fortiga manĝaĵo
actors.hero.talent.empowering_meal.desc=_+1:_ ĉiu manĝaĵo donas al Magiisto _po 2 kromaj vundpoentoj_ dum la 3 sekvaj fojoj, kiam li vundas malamikon per vergo.\n\n_+2:_ ĉiu manĝaĵo donas al Magiisto _po 3 kromaj vundpoentoj_ dum la 3 sekvaj fojoj, kiam li vundas malamikon per vergo.
actors.hero.talent.scholars_intuition.title=intuicio de klerulo
actors.hero.talent.scholars_intuition.desc=_+1:_ Magiisto identigas vergojn _3-foje pli rapide._\n\n_+2:_ Magiisto identigas vergojn _dum la unua uzo._
actors.hero.talent.lingering_magic.title=tiriĝanta magio
actors.hero.talent.lingering_magic.desc=_+1:_ kiam Magiisto pafas per vergo aŭ bastonego, lia sekva permana atako kaŭzos _1-2 kromajn vundpoentojn_.\n\n_+2:_ kiam Magiisto pafas per vergo aŭ bastonego, lia sekva permana atako kaŭzos _2 kromajn vundpoentojn_.
actors.hero.talent.backup_barrier.title=apoga barilo
actors.hero.talent.backup_barrier.desc=_+1:_ Magiisto gajnas _3 poentojn da ŝirmo_ kiam li uzis la lastan ŝargon de sia bastonego.\n\n_+2:_ Magiisto gajnas _5 poentojn da ŝirmo_ kiam li uzis la lastan ŝargon de sia bastonego.
actors.hero.talent.backup_barrier.meta_desc=_Se tiu ĉi talento estos akirita de alia heroo_, ĝi aktiviĝos post malŝargi la plej plibonigitan vergon de la heroo.

actors.hero.talent.energizing_meal.title=energiigaj manĝaĵoj
actors.hero.talent.energizing_meal.desc=_+1:_ manĝado daŭras 1 temperon kaj donas al Magiisto _5 temperojn da ŝargado de vergoj._\n\n_+2:_ manĝado daŭras 1 temperon kaj donas al Magiisto _8 temperojn da ŝargado de vergoj._
actors.hero.talent.inscribed_power.title=skribita potenco
actors.hero.talent.inscribed_power.desc=_+1:_ kiam Magiisto legas skribrulaĵon aŭ uzas sorĉkristalon, liaj _2 sekvaj vergopafoj_ estos je +2 niveloj pli fortaj.\n\n_+2:_ kiam Magiisto legas skribrulaĵon aŭ uzas sorĉkristalon, liaj _3 sekvaj vergopafoj_ estos je +2 niveloj pli fortaj.\n\nNombro de plifortigitaj vergopafoj duobliĝas post uzi skribrulaĵojn de plibonigo, transformo kaj aĵojn akiritajn per alĥemio uzante tiujn skribrulaĵojn.\n\nRilate al alĥemiaĵoj akirataj plurope (ekzemple plejparto da sorĉkristaloj), ŝanco por aktivigi tiun ĉi talenton dependas de kvanto de akiritaj alĥemiaĵoj.
actors.hero.talent.wand_preservation.title=konservo de vergo
actors.hero.talent.wand_preservation.desc=_+1:_ kiam Magiisto plenigas sian bastonegon per nova vergo, la malnova vergo revenos al lia dorsosako sen plibonigoj (+0), sed li _povas fari tion nur unufoje_.\n\n_+2:_ kiam Magiisto plenigas sian bastonegon per nova vergo, la malnova vergo revenos al lia dorsosako sen plibonigoj (+0), li _povas refari tion, kiam la heroo promociiĝos al sekva nivelo._
actors.hero.talent.wand_preservation.meta_desc=_Se tiu ĉi talento estos akirita de alia heroo_, ĝi pliigos kvanton da mistera rezino akirata dum detrui vergon en alĥemia kuirpoto je 1 (je talent-nivelo +1) kaj je 2 (je talent-nivelo +2).
actors.hero.talent.arcane_vision.title=mistera vido
actors.hero.talent.arcane_vision.desc=_+1:_ kiam Magiisto pafas al kontraŭulo, li gajnas mensvidon por _10 temperoj._\n\n_+2:_ kiam Magiisto pafas al kontraŭulo, li gajnas mensvidon por _15 temperoj._
actors.hero.talent.shield_battery.title=ŝirma baterio
actors.hero.talent.shield_battery.desc=_+1:_ Magiisto povas alceli sin per vergo por konverti ĉiujn ĝiajn ŝargojn al ŝirmo: _po 4% de maksimuma sano je 1 vergoŝargo_.\n\n_+2:_ Magiisto povas alceli sin per vergo por konverti ĉiujn ĝiajn ŝargojn al ŝirmo: _po 6% de maksimuma sano je 1 vergoŝargo_.

actors.hero.talent.desperate_power.title=drasta energio
actors.hero.talent.desperate_power.desc=_+1:_ povo de la fina ŝargo de vergoj aŭ bastonego de Magiisto pliiĝos je _1 nivelo_.\n\n_+2:_ povo de la fina ŝargo de vergoj aŭ bastonego de Magiisto pliiĝos je _2 niveloj_.\n\n_+3:_ povo de la fina ŝargo de vergoj aŭ bastonego de Magiisto pliiĝos je _3 niveloj_.
actors.hero.talent.ally_warp.title=amika interŝanĝo
actors.hero.talent.ally_warp.desc=_+1:_ Magiisto povas interŝanĝi sian pozicion kun amiko troviĝanta _maksimume 2 kaheloj for._\n\n_+2:_ Magiisto povas interŝanĝi sian pozicion kun amiko troviĝanta _maksimume 4 kaheloj for._\n\n_+3:_ Magiisto povas interŝanĝi sian pozicion kun amiko troviĝanta _maksimume 6 kaheloj for._\n\nNe eblas interŝanĝi pozicion kun nemoveblaj amikoj.

actors.hero.talent.empowered_strike.title=energigita frapo
actors.hero.talent.empowered_strike.desc=_+1:_ la unua frapo de Batalmagiisto per lia bastonego post verg-pafi (per ĝi) havos _+16% de vundpovo_ kaj la kroma bastonega efiko estos je _+50% pli potenca_.\n\n_+2:_ la unua frapo de Batalmagiisto per lia bastonego post verg-pafi (per ĝi) havos _+33% de vundpovo_ kaj la kroma bastonega efiko estos je _+100% pli potenca_.\n\n_+3:_ la unua frapo de Batalmagiisto per lia bastonego post verg-pafi (per ĝi) havos _+50% de vundpovo_ kaj la kroma bastonega efiko estos je _+150% pli potenca_.
actors.hero.talent.mystical_charge.title=mistera ŝargo
actors.hero.talent.mystical_charge.desc=_+1:_ frapo per bastonego donas al Batalmagiisto _0,5 temperojn_ da ŝargado de antikvaĵoj.\n\n_+2:_ frapo per bastonego donas al Batalmagiisto _1 temperon_ da ŝargado de antikvaĵoj.\n\n_+3:_ frapo per bastonego donas al Batalmagiisto _1,5 temperojn_ da ŝargado de antikvaĵoj.
actors.hero.talent.excess_charge.title=superflua ŝargo
actors.hero.talent.excess_charge.desc=_+1:_ kiam bastonego de Batalmagiisto estas plene ŝargita, la sekva frapo donos al li po _0,67 poentoj da ŝirmo_ por ĉiu nivelo de la bastonego.\n\n_+2:_ kiam bastonego de Batalmagiisto estas plene ŝargita, la sekva frapo donos al li po _1,33 poentoj da ŝirmo_ por ĉiu nivelo de la bastonego.\n\n_+3:_ kiam bastonego de Batalmagiisto estas plene ŝargita, la sekva frapo donos al li po _2 poentoj da ŝirmo_ por ĉiu nivelo de la bastonego.

actors.hero.talent.soul_siphon.title=spirit-sorbilo
actors.hero.talent.soul_siphon.desc=_+1:_ perkorpaj atakoj plenumataj de aliaj uloj markas iliajn spiritojn je la _13% efikeco_.\n\n_+2:_ perkorpaj atakoj plenumataj de aliaj uloj markas iliajn spiritojn je la _27% efikeco_.\n\n_+3:_ perkorpaj atakoj plenumataj de aliaj uloj markas iliajn spiritojn je la _40% efikeco_.
actors.hero.talent.soul_eater.title=spiritmanĝulo
actors.hero.talent.soul_eater.desc=_+1:_ ĉiu markita spirito donas _po 0,33 temperoj_ de sateco por ĉiu vundpoento kaŭzita per korpa atako. Spirit-markitaj monstroj havas _10% ŝancon_ por ekigi manĝ-rilataj efikoj je morto.\n\n_+2:_ ĉiu markita spirito donas _po 0,67 temperoj_ de sateco por ĉiu vundpoento kaŭzita per korpa atako. Spirit-markitaj monstroj havas _20% ŝancon_ por ekigi manĝ-rilataj efikoj je morto.\n\n_+3:_ ĉiu markita spirito donas _po 1 tempero_ de sateco por ĉiu vundpoento kaŭzita per korpa atako. Spirit-markitaj monstroj havas _30% ŝancon_ por ekigi manĝ-rilataj efikoj je morto.
actors.hero.talent.necromancers_minions.title=servistoj de nekromanciisto
actors.hero.talent.necromancers_minions.desc=_+1:_ kiam monstro kun markita spirito mortas, la sorĉisto havas _13% ŝancon_ por revivigi ĝin kiel koruptitan fifantomon.\n\n_+2:_ kiam monstro kun markita spirito mortas, la sorĉisto havas _27% ŝancon_ por revivigi ĝin kiel koruptitan fifantomon.\n\n_+3:_ kiam monstro kun markita spirito mortas, la sorĉisto havas _40% ŝancon_ por revivigi ĝin kiel koruptitan fifantomon.

actors.hero.talent.blast_radius.title=plivastigita eksplodo
actors.hero.talent.blast_radius.desc=_+1:_ radiuso de la magia eksplodo pliiĝas al _5 kaheloj_ (norme 4).\n\n_+2:_ radiuso de la magia eksplodo pliiĝas al _6 kaheloj_ (norme 4).\n\n_+3:_ radiuso de la magia eksplodo pliiĝas al _7 kaheloj_ (norme 4).\n\n_+4:_ radiuso de la magia eksplodo pliiĝas al _8 kaheloj_ (norme 4).
actors.hero.talent.elemental_power.title=plifortigita eksplodo
actors.hero.talent.elemental_power.desc=_+1:_ forto de la magia eksplodo pliiĝas je _25%_.\n\n_+2:_ forto de la magia eksplodo pliiĝas je _50%_.\n\n_+3:_ forto de la magia eksplodo pliiĝas je _75%_.\n\n_+4:_ forto de la magia eksplodo pliiĝas je _100%_.
actors.hero.talent.reactive_barrier.title=ŝirmo de eksplodo
actors.hero.talent.reactive_barrier.desc=_+1:_ Magiisto akiras _po 2,5 poentoj da ŝirmo_ por ĉiu (maksimume 5) kontraŭulo trafita per la magia eksplodo.\n\n_+2:_ Magiisto akiras _po 5 poentoj da ŝirmo_ por ĉiu (maksimume 6) kontraŭulo trafita per la magia eksplodo.\n\n_+3:_ Magiisto akiras _po 7,5 poentoj da ŝirmo_ por ĉiu (maksimume 7) kontraŭulo trafita per la magia eksplodo.\n\n_+4:_ Magiisto akiras _po 10 poentoj da ŝirmo_ por ĉiu (maksimume 8) kontraŭulo trafita per la magia eksplodo.

actors.hero.talent.wild_power.title=sovaĝa povo
actors.hero.talent.wild_power.desc=_+1:_ dum uzi la sovaĝan magion, nivelo de vergoj pliiĝos je _2 aŭ 3, maksimume al +4_.\n\n_+2:_ dum uzi la sovaĝan magion, nivelo de vergoj pliiĝos je _3, maksimume al +5_.\n\n_+3:_ dum uzi la sovaĝan magion, nivelo de vergoj pliiĝos je _3 aŭ 4, maksimume al +6_.\n\n_+4:_ dum uzi la sovaĝan magion, nivelo de vergoj pliiĝos je _4, maksimume al +7_.
actors.hero.talent.fire_everything.title=plena malŝargiĝo
actors.hero.talent.fire_everything.desc=_+1:_ sovaĝa povo pafas _5-foje_ (implicite 4) kaj ĉiu vergo havas _25% ŝancon_ por esti uzebla 3-foje.\n\n_+2:_ sovaĝa povo pafas _6-foje_ (implicite 4) kaj ĉiu vergo havas _50% ŝancon_ por esti uzebla 3-foje.\n\n_+3:_ sovaĝa povo pafas _7-foje_ (implicite 4) kaj ĉiu vergo havas _75% ŝancon_ por esti uzebla 3-foje.\n\n_+4:_ sovaĝa povo pafas _8-foje_ (implicite 4) kaj ĉiu vergo havas _100% ŝancon_ por esti uzebla 3-foje.
actors.hero.talent.conserved_magic.title=ŝparema magio
actors.hero.talent.conserved_magic.desc=_+1: dum uzi la sovaĝan magion, ĉiu vergopafo uzas _0,33 ŝargojn_ (anstataŭ 0,5) kaj estas _25% ŝanco_, ke ĝi daŭros neniun temperon.\n\n_+2: dum uzi la sovaĝan magion, ĉiu vergopafo uzas _0,225 ŝargojn_ (anstataŭ 0,5) kaj estas _50% ŝanco_, ke ĝi daŭros neniun temperon\n\n_+3: dum uzi la sovaĝan magion, ĉiu vergopafo uzas _0,15 ŝargojn_ (anstataŭ 0,5) kaj estas _75% ŝanco_, ke ĝi daŭros neniun temperon.\n\n_+4: dum uzi la sovaĝan magion, ĉiu vergopafo uzas _0,1 ŝargojn_ (anstataŭ 0,5) kaj estas _100% ŝanco_, ke ĝi daŭros neniun temperon.

actors.hero.talent.telefrag.title=telefrapo
actors.hero.talent.telefrag.desc=_+1:_ se Magiisto teleportiĝas super kontraŭulo, Magiisto kaŭzas _10-15 vundpoentojn_, tamen ankaŭ ricevas _5 vundpoentojn_.\n\n_+2:_ se Magiisto teleportiĝas super kontraŭulo, Magiisto kaŭzas _20-30 vundpoentojn_, tamen ankaŭ ricevas _10 vundpoentojn_.\n\n_+3:_ se Magiisto teleportiĝas super kontraŭulo, Magiisto kaŭzas _30-45 vundpoentojn_, tamen ankaŭ ricevas _15 vundpoentojn_.\n\n_+4:_ se Magiisto teleportiĝas super kontraŭulo, Magiisto kaŭzas _40-60 vundpoentojn_, tamen ankaŭ ricevas _20 vundpoentojn_.\n\nLa heroo ne povas morti pro tiu kapablo, la ricevata vundo povas esti etigita per kontraŭmagiaj efikoj.
actors.hero.talent.remote_beacon.title=fora marko
actors.hero.talent.remote_beacon.desc=_+1:_ Magiisto povas loki markon ĉie maksimume _4 kaheloj_ for de sia pozicio.\n\n_+2:_ Magiisto povas loki markon ĉie maksimume _8 kaheloj_ for de sia pozicio.\n\n_+3:_ Magiisto povas loki markon ĉie maksimume _12 kaheloj_ for de sia pozicio.\n\n_+4:_ Magiisto povas loki markon ĉie maksimume _16 kaheloj_ for de sia pozicio.\n\nMagiisto ne povas loki markon en nealireblaj lokoj.
actors.hero.talent.longrange_warp.title=interkeletaĝa teleportilo
actors.hero.talent.longrange_warp.desc=_+1:_ Magiisto povas teleportiĝi inter keletaĝoj por _150% de norma ŝarg-kosto_.\n\n_+2:_ Magiisto povas teleportiĝi inter keletaĝoj por _117% de norma ŝarg-kosto_.\n\n_+3:_ Magiisto povas teleportiĝi inter keletaĝoj por _83% de norma ŝarg-kosto_.\n\n_+4:_ Magiisto povas teleportiĝi inter keletaĝoj por _50% de norma ŝarg-kosto_.\n\nMagiisto ne povas uzi tiun ĉi kapablon por foriri ŝlositan keletaĝon.

#rogue
actors.hero.talent.cached_rations.title=kaŝitaj porcioj
actors.hero.talent.cached_rations.desc=_+1:_ Fripono povas trovi _2 manĝajn provizojn_ lokitaj en kofroj dum esplori la kelkaj sekvaj keletaĝoj de la labirinto.\n\n_+2:_ Fripono povas trovi _3 manĝajn provizojn_ lokitaj en kofroj dum esplori la kelkaj sekvaj keletaĝoj de la labirinto.\n\nManĝaj provizoj estas rapide manĝataj, modere satigas la heroon, restarigas 5 sanpoentojn kaj 1 ŝargon de la mantelo de ombroj.
actors.hero.talent.thiefs_intuition.title=intuicio de ruzulo
actors.hero.talent.thiefs_intuition.desc=_+1:_ Fripono identigas ringojn _duoble pli rapide_ kaj identigas specon de ringo _kiam li surmetas ĝin_.\n\n_+2:_ Fripono identigas ringojn _kiam li surmetas ilin_ kaj identigas specon de ringo _kiam li kolektas ĝin_.
actors.hero.talent.sucker_punch.title=preciza frapo
actors.hero.talent.sucker_punch.desc=_+1:_ Fripono kaŭzas _1-2 kromajn vundpoentojn_ la unuafoje kiam li surprize atakas malamikon.\n\n_+2_ Fripono kaŭzas _2 kromajn vundpoentojn_ la unuafoje kiam li surprize atakas malamikon.
actors.hero.talent.protective_shadows.title=protektaj ombroj
actors.hero.talent.protective_shadows.desc=_+1:_ Fripono gajnas po unu poento da ŝirmo _dum ĉiuj du temperoj_ kiam li estas nevidebla, la _maksimuma ŝirmo estas 3_.\n\n_+2:_ Fripono gajnas po unu poento da ŝirmo _dum ĉiu tempero_ kiam li estas nevidebla, la _maksimuma ŝirmo estas 5_.

actors.hero.talent.mystical_meal.title=mistera manĝaĵo
actors.hero.talent.mystical_meal.desc=_+1:_ manĝado daŭras 1 temperon (manĝaj provizoj estas manĝataj tuj) kaj donas al Fripono _3 temperojn de ŝargado de antikvaĵoj_.\n\n_+2:_ manĝado daŭras 1 temperon (manĝaj provizoj estas manĝataj tuj) kaj donas al Fripono _5 temperojn de ŝargado de antikvaĵoj_.\n\nTiu ĉi talento ne povas esti uzita por igi la kornon de abundo ŝargi sin mem.
actors.hero.talent.inscribed_stealth.title=skribita nevideblo
actors.hero.talent.inscribed_stealth.desc=_+1:_Fripono akiras _3 temperojn_ da nevideblo post legi skribrulaĵon aŭ uzi sorĉkristalon.\n\n_+2:_Fripono akiras _5 temperojn_ da nevideblo post legi skribrulaĵon aŭ uzi sorĉkristalon.\n\nDaŭro de nevideblo duobliĝas post uzi skribrulaĵon de plibonigo, skribrulaĵon de transformo aŭ alĥemiaĵojn bazitajn sur la menciitaj skribrulaĵoj.\n\nRilate al alĥemiaĵoj akirataj plurope (ekzemple plejparto da sorĉkristaloj), ŝanco por aktivigi tiun talenton dependas de kvanto de akiritaj alĥemiaĵoj.
actors.hero.talent.wide_search.title=vasta serĉo
actors.hero.talent.wide_search.desc=_+1:_ pliigas serĉan radiuson de Fripono el kvadrato 5×5 al _cirklo 7×7_.\n\n_+2:_ pliigas serĉan radiuson de Fripono el kvadrato 5×5 al _kvadrato 7×7_.
actors.hero.talent.wide_search.meta_desc=_Se tiu ĉi talento estos akirita de alia heroo_, ĝi pliigos lian serĉan radiuson (implicite kvadrato 3×3) al cirklo 5×5 je nivelo +1, aŭ al kvadrato 5×5 je nivelo +2.
actors.hero.talent.silent_steps.title=silentaj paŝoj
actors.hero.talent.silent_steps.desc=_+1:_ Fripono ne vekos dormantajn monstrojn dum esti _3 aŭ pli kaheloj proksime al ili_.\n\n_+2:_ Fripono ne vekos dormantajn monstrojn dum esti _ne apude al ili._
actors.hero.talent.rogues_foresight.title=fripona antaŭscio
actors.hero.talent.rogues_foresight.desc=_+1:_ kiam Fripono estas en keletaĝo kun kaŝita ĉambro, li havas _75% ŝancon por rimarki_, ke tiu keletaĝo enhavas kaŝitan ĉambron.\n\n_+2:_ kiam Fripono estas en keletaĝo kun kaŝita ĉambro, li havas _100% ŝancon por rimarki_, ke tiu keletaĝo enhavas kaŝitan ĉambron.

actors.hero.talent.light_cloak.title=malpeza mantelo
actors.hero.talent.light_cloak.desc=_+1:_ Fripono povas uzi sian mantelon de ombroj sen surmeti ĝin, sed dum tiu tempo la mantelo ŝargiĝas je _25% rapido_.\n\n_+2:_ Fripono povas uzi sian mantelon de ombroj sen surmeti ĝin, sed dum tiu tempo la mantelo ŝargiĝas je _50% rapido_.\n\n_+3:_ Fripono povas uzi sian mantelon de ombroj sen surmeti ĝin, sed dum tiu tempo la mantelo ŝargiĝas je _75% rapido_.
actors.hero.talent.light_cloak.meta_desc=_Se tiu ĉi talento estos akirita de alia heroo_, la rapido de ŝargado de ĉiuj antikvaĵoj pliiĝos je 7% (nivelo +1), 13% (nivelo +2) aŭ 20% (nivelo +3).
actors.hero.talent.enhanced_rings.title=plibonigitaj ringoj
actors.hero.talent.enhanced_rings.desc=_+1:_ kiam Fripono uzas antikvaĵon, nivelo de liaj ringoj pliiĝas je +1 por _3 temperoj_.\n\n_+2:_ kiam Fripono uzas antikvaĵon, nivelo de liaj ringoj pliiĝas je +1 por _6 temperoj_.\n\n_+3:_ kiam Fripono uzas antikvaĵon, nivelo de liaj ringoj pliiĝas je +1 por _9 temperoj_.

actors.hero.talent.enhanced_lethality.title=pliigita mortigeco
actors.hero.talent.enhanced_lethality.desc=_+1:_ Kaŝmortigisto povas kaŝmortigi kontraŭuloj kun malpli ol _4/13/27/67% de sano_ laŭ la nivelo de preparo (norme 3/10/20/50%).\n\n_+2:_ Kaŝmortigisto povas kaŝmortigi kontraŭuloj kun malpli ol _5/17/33/83% de sano_ laŭ la nivelo de preparo (norme 3/10/20/50%).\n\n_+3:_ Kaŝmortigisto povas kaŝmortigi kontraŭuloj kun malpli ol _6/20/40/100% de sano_ laŭ la nivelo de preparo (norme 3/10/20/50%).
actors.hero.talent.assassins_reach.title=surpriza morto
actors.hero.talent.assassins_reach.desc=_+1:_ pliigas atingon de la kaŝmortigista salto el 1/2/3/4 (laŭ la nivelo de preparo) al _1/3/4/6 kaheloj_.\n\n_+2:_ pliigas atingon de la kaŝmortigista salto el 1/2/3/4 (laŭ la nivelo de preparo) al _2/4/6/8 kaheloj_.\n\n_+3:_ pliigas atingon de la kaŝmortigista salto el 1/2/3/4 (laŭ la nivelo de preparo) al _2/5/7/10 kaheloj_.\n\nLa heroo povas salti trans kaptiloj kaj kontraŭuloj, sed ne trans firman terenon, kiel murojn.
actors.hero.talent.bounty_hunter.title=dungmortigisto
actors.hero.talent.bounty_hunter.desc=_+1:_ kiam Kaŝmortigisto mortigas kontraŭulon per preparita frapo, ŝanco por faligi aĵon pliiĝas je _2/4/8/16%_ (depende de nivelo de preparo).\n\n_+2:_ kiam Kaŝmortigisto mortigas kontraŭulon per preparita frapo, ŝanco por faligi aĵon pliiĝas je _4/8/16/32%_ (depende de nivelo de preparo).\n\n_+3:_ kiam Kaŝmortigisto mortigas kontraŭulon per preparita frapo, ŝanco por faligi aĵon pliiĝas je _6/12/24/48%_ (depende de nivelo de preparo).

actors.hero.talent.evasive_armor.title=lerta defendaĵo
actors.hero.talent.evasive_armor.desc=_+1:_ dum sprinti Sprintisto akiras _po 1 aldona poento da evito_ por ĉiu superflua poento da povo de lia defendaĵo.\n\n_+2:_ dum sprinti Sprintisto akiras _po 2 aldonaj poentoj da evito_ por ĉiu superflua poento da povo de lia defendaĵo.\n\n_+3:_ dum sprinti Sprintisto akiras _po 3 aldonaj poentoj da evito_ por ĉiu superflua poento da povo de lia defendaĵo.
actors.hero.talent.projectile_momentum.title=kuranta ĵetisto
actors.hero.talent.projectile_momentum.desc=_+1:_ dum sprinti Sprintisto akiras _+50% al precizo kaj +15% al vundpovo_ per ĵetarmiloj.\n\n_+2:_ dum sprinti Sprintisto akiras _+100% al precizo kaj +30% al vundpovo_ per ĵetarmiloj.\n\n_+3:_ dum sprinti Sprintisto akiras _+150% al precizo kaj +45% al vundpovo_ per ĵetarmiloj.
actors.hero.talent.speedy_stealth.title=rapida ŝteliro
actors.hero.talent.speedy_stealth.desc=_+1:_ Sprintisto akiras po 2 poentoj da movizo por tempero kiam li estas nevidebla.\n\n_+2:_ aldone al efikoj de +1, tempmezurilo de la efiko “sprinto” estas haltigita kiam Sprintisto estas nevidebla.\n\n_+3:_ aldone al efikoj de +1 kaj +2, Sprintisto moviĝas kun duobla rapido dum esti nevidebla – sendepende ĉu sprinti ĉu ne.

actors.hero.talent.hasty_retreat.title=baldaŭa forkuro
actors.hero.talent.hasty_retreat.desc=_+1:_ post ekaperi Fripono akiras rapidemon kaj nevideblon por _1 tempero_.\n\n_+2:_ post ekaperi Fripono akiras rapidemon kaj nevideblon por _2 temperoj_.\n\n_+3:_ post ekaperi Fripono akiras rapidemon kaj nevideblon por _3 temperoj_.\n\n_+4:_ post ekaperi Fripono akiras rapidemon kaj nevideblon por _4 temperoj_.
actors.hero.talent.body_replacement.title=ligna kvazaŭhomo
actors.hero.talent.body_replacement.desc=_+1:_ post ekaperi Fripono postlasas en la antaŭa loko lignan kvazaŭhomon, kiu havas _20 da sano kaj 1-3 da defendaĵo_.\n\n_+2:_ post ekaperi Fripono postlasas en la antaŭa loko lignan kvazaŭhomon, kiu havas _40 da sano kaj 2-6 da defendaĵo_.\n\n_+3:_ post ekaperi Fripono postlasas en la antaŭa loko lignan kvazaŭhomon, kiu havas _60 da sano kaj 3-9 da defendaĵo_.\n\n_+4:_ post ekaperi Fripono postlasas en la antaŭa loko lignan kvazaŭhomon, kiu havas _80 da sano kaj 4-12 da defendaĵo_.\n\nNur unu ligna kvazaŭhomo povas esti aktiva samtempe.
actors.hero.talent.shadow_step.title=ombraj paŝoj
actors.hero.talent.shadow_step.desc=_+!:_ kiam Fripono ĵetas fumbombon dum esti nevidebla, ĝi senprokraste eksplodas kaj uzas _je 16% ŝargoj malpli_, tamen ĝi ne blindumas malamikojn kaj ne aktivigas aliajn kapablojn.\n\n_+2:_ kiam Fripono ĵetas fumbombon dum esti nevidebla, ĝi senprokraste eksplodas kaj uzas _je 30% ŝargoj malpli_, tamen ĝi ne blindumas malamikojn kaj ne aktivigas aliajn kapablojn.\n\n_+3:_ kiam Fripono ĵetas fumbombon dum esti nevidebla, ĝi senprokraste eksplodas kaj uzas _je 41% ŝargoj malpli_, tamen ĝi ne blindumas malamikojn kaj ne aktivigas aliajn kapablojn.\n\n_+4:_ kiam Fripono ĵetas fumbombon dum esti nevidebla, ĝi senprokraste eksplodas kaj uzas _je 50% ŝargoj malpli_, tamen ĝi ne blindumas malamikojn kaj ne aktivigas aliajn kapablojn.

actors.hero.talent.fear_the_reaper.title=timo antaŭ morto
actors.hero.talent.fear_the_reaper.desc=_+1:_ kiam mort-markita monstro havas 0 sanpoentojn, ĝi iĝas _kripligita._\n\n_+2:_ kiam mort-markita monstro havas 0 sanpoentojn, ĝi iĝas _terurita kaj kripligita_.\n\n_+3:_ kiam mort-markita monstro havas 0 sanpoentojn ĝi iĝas _terurita kaj kripligita_ kaj aliaj monstroj troviĝantaj ne pli ol 3 kaheloj for iĝas _kripligitaj_.\n\n_+4:_ kiam mort-markita monstro havas 0 sanpoentojn ĝi iĝas _terurita kaj kripligita_ kaj aliaj monstroj troviĝantaj ne pli ol 3 kaheloj for iĝas _teruritaj kaj kripligitaj_.
actors.hero.talent.deathly_durability.title=ŝirmo de mortigo
actors.hero.talent.deathly_durability.desc=_+1:_ kontraŭulo mortigita per mort-marko donas al Fripono ŝirmon egalan al _13%_ de sano, de momento kiam ĝi estis markita.\n\n_+2:_ kontraŭulo mortigita per mort-marko donas al Fripono ŝirmon egalan al _25%_ de sano, de momento kiam ĝi estis markita.\n\n_+3:_ kontraŭulo mortigita per mort-marko donas al Fripono ŝirmon egalan al _38%_ de sano, de momento kiam ĝi estis markita.\n\n_+4:_ kontraŭulo mortigita per mort-marko donas al Fripono ŝirmon egalan al _50%_ de sano, de momento kiam ĝi estis markita.
actors.hero.talent.double_mark.title=duobla marko
actors.hero.talent.double_mark.desc=_+1:_ kiam Fripono markas per morto du monstrojn samtempe, la dua marko uzas je _30% malpli_  de ŝargoj.\n\n_+2:_ kiam Fripono markas per morto du monstrojn samtempe, la dua marko uzas je _50% malpli_  de ŝargoj.\n\n_+3:_ kiam Fripono markas per morto du monstrojn samtempe, la dua marko uzas je _65% malpli_  de ŝargoj.\n\n_+4:_ kiam Fripono markas per morto du monstrojn samtempe, la dua marko uzas je _75% malpli_  de ŝargoj.

actors.hero.talent.shadow_blade.title=ombra klingo
actors.hero.talent.shadow_blade.desc=_+1:_ la ombra klono povas kaŭzi kroman vundon egalan al _8%_ de la fripona vundpovo kaj havas _25% ŝancon_ por uzi ensorĉon de la heroa armilo.\n\n_+2:_ la ombra klono povas kaŭzi kroman vundon egalan al _16%_ de la fripona vundpovo kaj havas _50% ŝancon_ por uzi ensorĉon de la heroa armilo.\n\n_+3:_ la ombra klono povas kaŭzi kroman vundon egalan al _24%_ de la fripona vundpovo kaj havas _75% ŝancon_ por uzi ensorĉon de la heroa armilo.\n\n_+4:_ la ombra klono povas kaŭzi kroman vundon egalan al _32%_ de la fripona vundpovo kaj havas _100% ŝancon_ por uzi ensorĉon de la heroa armilo.
actors.hero.talent.cloned_armor.title=klonita defendaĵo
actors.hero.talent.cloned_armor.desc=_+1:_ la ombra klono akiras defendaĵon egalan al _12%_ de fripona defendaĵo kun _25% ŝanco_ por uzi skribaĵon de fripona defendaĵo.\n\n_+2:_ la ombra klono akiras defendaĵon egalan al _24%_ de fripona defendaĵo kun _50% ŝanco_ por uzi skribaĵon de fripona defendaĵo.\n\n_+3:_ la ombra klono akiras defendaĵon egalan al _36%_ de fripona defendaĵo kun _75% ŝanco_ por uzi skribaĵon de fripona defendaĵo.\n\n_+4:_ la ombra klono akiras defendaĵon egalan al _48%_ de fripona defendaĵo kun _100% ŝanco_ por uzi skribaĵon de fripona defendaĵo.
actors.hero.talent.perfect_copy.title=perfekta kopio
actors.hero.talent.perfect_copy.desc=_+1:_ la ombra klono akiras sanon egalan al _10%_ de maksimuma sano de Fripono kaj povas senprokraste anstataŭiĝi kun Fripono troviĝanta maksimume _1 kahelo_ for.\n\n_+2:_ la ombra klono akiras sanon egalan al _20%_ de maksimuma sano de Fripono kaj povas senprokraste anstataŭiĝi kun Fripono troviĝanta maksimume _2 kaheloj_ for.\n\n_+3:_ la ombra klono akiras sanon egalan al _30%_ de maksimuma sano de Fripono kaj povas senprokraste anstataŭiĝi kun Fripono troviĝanta maksimume _3 kaheloj_ for.\n\n_+4:_ la ombra klono akiras sanon egalan al _40%_ de maksimuma sano de Fripono kaj povas senprokraste anstataŭiĝi kun Fripono troviĝanta maksimume _4 kaheloj_ for.

#huntress
actors.hero.talent.natures_bounty.title=malavara naturo
actors.hero.talent.natures_bounty.desc=_+1:_ Ĉasistino povas trovi _4 berojn_ kaŝitajn en alta herbo dum esplori la kelkajn sekvajn keletaĝojn de la labirinto.\n\n_+2:_ Ĉasistino povas trovi _6 berojn_ kaŝitajn en alta herbo dum esplori la kelkajn sekvajn keletaĝojn de la labirinto.\n\nBeroj estas rapide manĝataj, modere satigas la heroon kaj povas enhavi uzeblan semon.
actors.hero.talent.survivalists_intuition.title=intuicio de persistemulo
actors.hero.talent.survivalists_intuition.desc=_+1:_ Ĉasistino identigas ĵetarmilojn _3-foje pli rapide_.\n\n_+2:_ Ĉasistino identigas ĵetarmilojn _dum la unua sukcesa atako_.
actors.hero.talent.followup_strike.title=sekva frapo
actors.hero.talent.followup_strike.desc=_+1:_ kiam Ĉasistino trafas malamikon per sia spirita pafarko aŭ per ĵetarmilo, ŝia sekva senpera atako kontraŭ la sama malamiko kaŭzos _2 kromajn vundpoentojn_.\n\n_+2:_ kiam Ĉasistino trafas malamikon per sia spirita pafarko aŭ per ĵetarmilo, ŝia sekva senpera atako kontraŭ la sama malamiko kaŭzos _3 kromajn vundpoentojn_.
actors.hero.talent.natures_aid.title=natura apogo
actors.hero.talent.natures_aid.desc=_+1:_ Ĉasistino akiras 0-2 poentojn da ŝelhaŭto etiĝantajn post _3 temperoj_ kiam kreskaĵ-rilata efiko aktiviĝas en ŝia vidatingo.\n\n_+2:_ Ĉasistino akiras 0-2 poentojn da ŝelhaŭto etiĝantajn post _5 temperoj_ kiam kreskaĵ-rilata efiko aktiviĝas en ŝia vidatingo.

actors.hero.talent.invigorating_meal.title=vigliga manĝaĵo
actors.hero.talent.invigorating_meal.desc=_+1:_ manĝado daŭras 1 temperon (beroj estas manĝataj tuj) kaj donas al Ĉasistino _1 temperon da rapidemo_.\n\n_+2:_ manĝado daŭras 1 temperon (beroj estas manĝataj tuj) kaj donas al la Ĉasistino _2 temperojn da rapidemo_.
actors.hero.talent.liquid_nature.title=likva naturo
actors.hero.talent.liquid_nature.desc=_+1:_ kiam Ĉasistino trinkas aŭ ĵetas eliksiron, infuzaĵon aŭ miksturon, herbo kreskiĝas _maksimume 4 kaheloj_ ĉirkaŭ ŝi kaj ĉiuj apudaj malamikoj enradikiĝas por _1 tempero_.\n\n_+2:_ kiam Ĉasistino trinkas aŭ ĵetas eliksiron, infuzaĵon aŭ miksturon, herbo kreskiĝas _maksimume 6 kaheloj_ ĉirkaŭ ŝi kaj ĉiuj apudaj malamikoj enradikiĝas por _2 temperoj_.\n\nKvanto da herbo kaj daŭro de enradikado duobliĝas post uzi eliksirojn de povo, sperto aŭ alĥemiaĵojn bazitajn sur la menciitaj eliksiroj.\n\nSe dum alĥemio kuiriĝas plurajn trinkaĵojn (ekzemplo: akva infuzaĵo), ŝanco por ekigi tiun ĉi efikon dependas de kvanto da kuiritaj trinkaĵoj.
actors.hero.talent.rejuvenating_steps.title=refreŝigaj paŝoj
actors.hero.talent.rejuvenating_steps.desc=_+1:_ kiam Ĉasistino enpaŝas malaltan herbon aŭ ardaĵon, el ili kreskas alta herbo, kiun Ĉasistino tuj disŝovas. Necesas atendi _10 temperojn antaŭ ol tiu ĉi efiko reokazos_.\n\n_+2:_ kiam Ĉasistino enpaŝas malaltan herbon aŭ ardaĵon, el ili kreskas alta herbo, kiun Ĉasistino tuj disŝovas. Necesas atendi _5 temperojn antaŭ ol tiu ĉi efiko reokazos_.\n\nTiu ĉi talento kreskigos disŝovitan herbon kiam pasivaj resanigantaj efikoj estas malaktivaj aŭ kiam la heroo ne akiris sperton por longa tempo.
actors.hero.talent.heightened_senses.title=akrigitaj sensoj
actors.hero.talent.heightened_senses.desc=_+1:_ Ĉasistino sentas mensojn de estaĵoj, kiuj estas _2 kaheloj for de ŝia pozicio_.\n\n_+2:_ Ĉasistino sentas mensojn de estaĵoj, kiuj estas _3 kaheloj for de ŝia pozicio_.
actors.hero.talent.durable_projectiles.title=firmaj ĵetarmiloj
actors.hero.talent.durable_projectiles.desc=_+1:_ ĵetarmiloj uzataj de Ĉasistino estas je _+50% pli firmaj_.\n\n_+2:_ ĵetarmiloj uzataj de Ĉasistino estas je _+75% pli firmaj_.

actors.hero.talent.point_blank.title=proksima celo
actors.hero.talent.point_blank.desc=_+1:_ kiam Ĉasistino uzas la spiritan pafarkon aŭ ĵetarmilon je permana atingo, ĝi havas _-30% al precizo_, anstataŭ -50%.\n\n_+2:_ kiam Ĉasistino uzas la spiritan pafarkon aŭ ĵetarmilon je permana atingo, ĝi havas _-20% al precizo_, anstataŭ -50%.\n\n_+3:_ kiam Ĉasistino uzas la spiritan pafarkon aŭ ĵetarmilon je permana atingo, ĝi havas _-10% al precizo_, anstataŭ -50%.\n\nRimarku, ke la spirita pafarko kaj ĵetarmiloj ĉiam havas +50% al precizo dum uzo je distanco.
actors.hero.talent.seer_shot.title=aŭgura pafo
actors.hero.talent.seer_shot.desc=_+1:_ kiam Ĉasistino pafas sagon teren, ŝi povas vidi la areon 3×3 ĉirkaŭ la pafloko por _5 temperoj_. Necesas atendi 20 temperoj antaŭ ol reuzi tiun ĉi artifikon.\n\n_+2:_ kiam Ĉasistino pafas sagon teren, ŝi povas vidi la areon 3×3 ĉirkaŭ la pafloko por _10 temperoj_. Necesas atendi 20 temperoj antaŭ ol reuzi tiun ĉi artifikon.\n\n_+3:_ kiam Ĉasistino pafas sagon teren, ŝi povas vidi la areon 3×3 ĉirkaŭ la pafloko por _15 temperoj_. Necesas atendi 20 temperoj antaŭ ol reuzi tiun ĉi artifikon.
actors.hero.talent.seer_shot.meta_desc=_Se tiu ĉi talento estos akirita de alia heroo_, ĝi aktiviĝos dum uzi ĉiun ĵetarmilon.

actors.hero.talent.farsight.title=falka vido
actors.hero.talent.farsight.desc=_+1:_ vidatingo de Celpafistino estas _pliigita je 25%_.\n\n_+2:_ vidatingo de Celpafistino estas _pliigita je 50%_.\n\n_+3:_ vidatingo de Celpafistino estas _pliigita je 75%_.
actors.hero.talent.shared_enchantment.title=komuna ensorĉo
actors.hero.talent.shared_enchantment.desc=_+1:_ estas _33% ŝanco_, ke ĵetarmiloj havos ensorĉon de la spirita pafarko.\n\n_+2:_ estas _67% ŝanco_, ke ĵetarmiloj havos ensorĉon de la spirita pafarko.\n\n_+3:_ estas _100% ŝanco_, ke ĵetarmiloj havos ensorĉon de la spirita pafarko.\n\nEnsorĉo de la spirita pafarko povas aktiviĝi aldone al ensorĉo de la ĵetarmilo.
actors.hero.talent.shared_upgrades.title=komunaj plibonigoj
actors.hero.talent.shared_upgrades.desc=_+1:_ kiam Celpafistino atakas per plibonigita ĵetarmilo, ĉiu poento da plibonigo pliigas daŭron de la efiko “celpafista marko” je 1 tempero kaj vundpovon de ŝia speciala atako je 16%, sed maksimume al _2 temperoj kaj +33% al vundpovo (kun ĵetarmilo +2)_.\n\n_+2:_ kiam Celpafistino atakas per plibonigita ĵetarmilo, ĉiu poento da plibonigo pliigas daŭron de la efiko “celpafista marko” je 1 tempero kaj vundpovon de ŝia speciala atako je 16%, sed maksimume al _4 temperoj kaj +67% al vundpovo (kun ĵetarmilo +4)_.\n\n_+3:_ kiam Celpafistino atakas per plibonigita ĵetarmilo, ĉiu poento da plibonigo pliigas daŭron de la efiko “celpafista marko” je 1 tempero kaj vundpovon de ŝia speciala atako je 16%, sed maksimume al _6 temperoj kaj +100% al vundpovo (kun ĵetarmilo +6)_.

actors.hero.talent.durable_tips.title=firmaj sagopintoj
actors.hero.talent.durable_tips.desc=_+1:_ trempitaj sagetoj distingiĝas per _2-obla firmeco_, kiam Gardistino ilin uzas.\n\n_+2:_ trempitaj sagetoj distingiĝas per _3-obla firmeco_, kiam Gardistino ilin uzas.\n\n_+3:_ trempitaj sagetoj distingiĝas per _4-obla firmeco_, kiam Gardistino ilin uzas.
actors.hero.talent.barkskin.title=ŝelhaŭto
actors.hero.talent.barkskin.desc=_+1:_ kiam Gardistino disŝovas herbon, ŝi akiras ŝelhaŭton egalan al _0-50% de ŝia nivelo_, kiu etiĝas je ĉiu tempero.\n\n_+2:_ kiam Gardistino disŝovas herbon, ŝi akiras ŝelhaŭton egalan al _0-100% de ŝia nivelo_, kiu etiĝas je ĉiu tempero.\n\n_+3:_ kiam Gardistino disŝovas herbon, ŝi akiras ŝelhaŭton egalan al _0-150% de ŝia nivelo_, kiu etiĝas je ĉiu tempero.
actors.hero.talent.shielding_dew.title=ŝirmanta roso
actors.hero.talent.shielding_dew.desc=_+1:_ roseroj donas al Gardistino ŝirmon, kiam ŝia sano estas plena kaj _maksimume al 20% da ŝia sanenhaveco_.\n\n_+2:_ roseroj donas al Gardistino ŝirmon, kiam ŝia sano estas plena kaj _maksimume al 40% da ŝia sanenhaveco_.\n\n_+3:_ roseroj donas al Gardistino ŝirmon, kiam ŝia sano estas plena kaj _maksimume al 60% da ŝia sanenhaveco_.

actors.hero.talent.fan_of_blades.title=cirklo de akraĵoj
actors.hero.talent.fan_of_blades.desc=_+1:_ rotaciaj akraĵoj povas frapi _1 kontraŭulon pli_ kun 50% vundpovo. Angulo inter la ĉefa viktimo, vi kaj la kontraŭulo devas esti maksimume _30°_.\n\n_+2:_ rotaciaj akraĵoj povas frapi _2 kontraŭulojn pli_ kun 50% vundpovo. Angulo inter la ĉefa viktimo, vi kaj la kontraŭulo devas esti maksimume _60°_.\n\n_+3:_ rotaciaj akraĵoj povas frapi _3 kontraŭulojn pli_ kun 50% vundpovo. Angulo inter la ĉefa viktimo, vi kaj la kontraŭulo devas esti maksimume _90°_.\n\n_+4:_ rotaciaj akraĵoj povas frapi _4 kontraŭulojn pli_ kun 50% vundpovo. Angulo inter la ĉefa viktimo, vi kaj la kontraŭulo devas esti maksimume _120°_.
actors.hero.talent.projecting_blades.title=plilongigitaj akraĵoj
actors.hero.talent.projecting_blades.desc=_+1:_ precizo de rotaciaj akraĵoj _pliiĝas je 25%_ kaj ili povas trapenetri maksimume _2 firmajn kahelojn_.\n\n_+2:_ precizo de rotaciaj akraĵoj _pliiĝas je 50%_ kaj ili povas trapenetri maksimume _4 firmajn kahelojn_.\n\n_+3:_ precizo de rotaciaj akraĵoj _pliiĝas je 75%_ kaj ili povas trapenetri maksimume _6 firmajn kahelojn_.\n\n_+4:_ precizo de rotaciaj akraĵoj _pliiĝas je 100%_ kaj ili povas trapenetri maksimume _8 firmajn kahelojn_.
actors.hero.talent.spirit_blades.title=spiritaj akraĵoj
actors.hero.talent.spirit_blades.desc=_+1:_ estas _35% ŝanco_, ke rotaciaj akraĵoj uzas ensorĉon de la spirita pafarko.\n\n_+2:_ estas _60% ŝanco_, ke rotaciaj akraĵoj uzas ensorĉon de la spirita pafarko.\n\n_+3:_ estas _90% ŝanco_, ke rotaciaj akraĵoj uzas ensorĉon de la spirita pafarko.\n\n_+4:_ estas _100% ŝanco_, ke rotaciaj akraĵoj uzas ensorĉon de la spirita pafarko, kaj _povo de ĉiu ensorĉo pliiĝas je 10%_.

actors.hero.talent.growing_power.title=kreskanta potenco
actors.hero.talent.growing_power.desc=_+1:_ dum uzi la talenton natura potenco, pafrapido pliiĝas je _38%_ (norme 33%) kaj pliigo de ŝia movrapido pliiĝas je _125%_.\n\n_+2:_ dum uzi la talenton natura potenco, pafrapido pliiĝas je _42%_ (norme 33%) kaj pliigo de ŝia movrapido pliiĝas je _150%_.\n\n_+3:_ dum uzi la talenton natura potenco, pafrapido pliiĝas je _46%_ (norme 33%) kaj pliigo de ŝia movrapido pliiĝas je _175%_.\n\n_+4:_ dum uzi la talenton natura potenco, pafrapido pliiĝas je _50%_ (norme 33%) kaj pliigo de ŝia movrapido pliiĝas je _200%_.
actors.hero.talent.natures_wrath.title=kolero de naturo
actors.hero.talent.natures_wrath.desc=_+1:_ dum uzi la talenton natura potenco, sagoj de la spirita pafarko havas _8% ŝancon_ por aktivigi hazardan efikon de danĝera vegetaĵo.\n\n_+2:_ dum uzi la talenton natura potenco, sagoj de la spirita pafarko havas _17% ŝancon_ por aktivigi hazardan efikon de danĝera vegetaĵo.\n\n_+3:_ dum uzi la talenton natura potenco, sagoj de la spirita pafarko havas _25% ŝancon_ por aktivigi hazardan efikon de danĝera vegetaĵo.\n\n_+4:_ dum uzi la talenton natura potenco, sagoj de la spirita pafarko havas _33% ŝancon_ por aktivigi hazardan efikon de danĝera vegetaĵo.\n\nEfikoj de la jenaj vegetaĵoj povas aktiviĝi: blindherbo, ĉagrenmusko, fajrofloro, glacibobelo kaj ŝtormplanto.
actors.hero.talent.wild_momentum.title=natura impeto
actors.hero.talent.wild_momentum.desc=_+1:_ post venki kontraŭulon per la spirita pafarko, la daŭro de la natura potenco pliiĝas je _1 tempero_. Maksimuma pliiĝo estas _2 temperoj_.\n\n_+2:_ post venki kontraŭulon per la spirita pafarko, la daŭro de la natura potenco pliiĝas je _2 temperoj_. Maksimuma pliiĝo estas _4 temperoj_.\n\n_+3:_ post venki kontraŭulon per la spirita pafarko, la daŭro de la natura potenco pliiĝas je _3 temperoj_. Maksimuma pliiĝo estas _6 temperoj_.\n\n_+4:_ post venki kontraŭulon per la spirita pafarko, la daŭro de la natura potenco pliiĝas je _4 temperoj_. Maksimuma pliiĝo estas _8 temperoj_.

actors.hero.talent.eagle_eye.title=falka vido
actors.hero.talent.eagle_eye.desc=_+1:_ vidatingo de la akcipitro pliiĝas al _7 kaheloj_ (norme 6).\n\n_+2:_ vidatingo de la akcipitro pliiĝas al _8 kaheloj_ (norme 6).\n\n_+3:_ vidatingo de la akcipitro pliiĝas al _9 kaheloj_ (norme 6) kaj ĝi akiras _2 kahelojn_ de mensvido.\n\n_+4:_ vidatingo de la akcipitro pliiĝas al _10 kaheloj_ (norme 6) kaj ĝi akiras _3 kahelojn_ de mensvido.
actors.hero.talent.go_for_the_eyes.title=ataku okulojn!
actors.hero.talent.go_for_the_eyes.desc=_+1:_ atakoj de la akcipitro blindumas malamikojn por _2 temperoj_.\n\n_+2:_ atakoj de la akcipitro blindumas malamikojn por _5 temperoj_.\n\n_+3:_ atakoj de la akcipitro blindumas malamikojn por _5 temperoj_ kaj kripligas ilin por _2 temperoj_.\n\n_+4:_ atakoj de la akcipitro blindumas malamikojn por _5 temperoj_ kaj kripligas ilin por _5 temperoj_.
actors.hero.talent.swift_spirit.title=apusa lerteco
actors.hero.talent.swift_spirit.desc=_+1:_ movrapido de la akcipitro pliiĝas al _2,5 kaheloj/tempero_ (norme 2) kaj la birdo certe evitas la _2 unuajn atakojn_ kontraŭ ĝi.\n\n_+2:_ movrapido de la akcipitro pliiĝas al _3 kaheloj/tempero_ (norme 2) kaj la birdo certe evitas la _4 unuajn atakojn_ kontraŭ ĝi.\n\n_+3:_ movrapido de la akcipitro pliiĝas al _3,5 kaheloj/tempero_ (norme 2) kaj la birdo certe evitas la _6 unuajn atakojn_ kontraŭ ĝi.\n\n_+4:_ movrapido de la akcipitro pliiĝas al _4 kaheloj/tempero_ (norme 2) kaj la birdo certe evitas la _8 unuajn atakojn_ kontraŭ ĝi.

#duelist
actors.hero.talent.strengthening_meal.title=plifortigita nutraĵo
actors.hero.talent.strengthening_meal.desc=_+1:_ manĝado donas al Duelistino po 3 kromaj poentoj da vundpovo dum la _2 sekvaj_ fojoj, kiam ŝi frapas malamikon per korpa atako.\n\n_+2:_ manĝado donas al Duelistino po 3 kromaj poentoj da vundpovo dum la _3 sekvaj_ fojoj, kiam ŝi frapas malamikon per korpa atako.
actors.hero.talent.adventurers_intuition.title=intuicio de aventuristo
actors.hero.talent.adventurers_intuition.desc=_+1:_ Duelistino identigas armilojn _2,5× pli rapide_ kaj defendaĵojn _1,75× pli rapide_.\n\n_+2:_ Duelistino identigas armilojn _je surmeto_ kaj defendaĵojn _2,5× pli rapide_.
actors.hero.talent.patient_strike.title=pacienca frapo
actors.hero.talent.patient_strike.desc=_+1:_ se Duelistino atendas antaŭ ol fari permanan atakon, ŝia atako kaŭzos _1-2 kromajn vundpoentojn_.\n\n_+2:_ se Duelistino atendas antaŭ ol fari permanan atakon, ŝia atako kaŭzos _2 kromajn vundpoentojn_.
actors.hero.talent.aggressive_barrier.title=ŝirmo de agreso
actors.hero.talent.aggressive_barrier.desc=_+1:_ Duelistino akiras _3 poentojn da ŝirmo_ post fari specialan armilan atakon havante malpli ol 50% de sano.\n\n_+2:_ Duelistino akiras _5 poentojn da ŝirmo_ post fari specialan armilan atakon havante malpli ol 50% de sano.
actors.hero.talent.aggressive_barrier.meta_desc=_Se tiu ĉi talento estos akirita de alia heroo_, li gajnos ŝirmon dum fari permanan atakon havante malmultan sanon kaj necesos atendi 50 temperojn antaŭ ol reuzi la talenton.

actors.hero.talent.focused_meal.title=manĝaĵo de sinkoncentro
actors.hero.talent.focused_meal.desc=_+1:_ manĝado daŭras 1 temperon kaj donas al Duelistino _0,67 ŝargojn_ por ŝiaj armiloj.\n\n_+2:_ manĝado daŭras 1 temperon kaj donas al Duelistino _1 ŝargon_ por ŝiaj armiloj.
actors.hero.talent.focused_meal.meta_desc=_Se tiu ĉi talento estos akirita de alia heroo_, la heroo kaŭzos kroman vundon dum la sekva frapo egalan al nivelo/3 (je +1) aŭ nivelo/2 (je +2).
actors.hero.talent.liquid_agility.title=malkorkita evitpovo
actors.hero.talent.liquid_agility.desc=_+1:_ post trinki aŭ ĵeti eliksiron, infuzaĵon aŭ miksturon, Duelistino havas _3-obligitan evitpovon_ kaj _3-obligitan precizon_ dum ŝia sekva permana atako dum 5 temperoj.\n\n_+2:_ post trinki aŭ ĵeti eliksiron, infuzaĵon aŭ miksturon, Duelistino havas _senliman evitpovon_ kaj _senliman precizon_ dum ŝia sekva permana atako dum 5 temperoj.\n\nTiu ĉi efiko daŭras 1 temperon pli kaj 1 atakon pli dum uzi eliksirojn de povo, sperto aŭ aĵojn akiritajn per alĥemio uzante la menciitajn eliksirojn.\n\nSe dum alĥemio kuiriĝas plurajn trinkaĵojn (ekzemplo: akva infuzaĵo), ŝanco por ekigi tiun ĉi efikon dependas de kvanto da kuiritaj trinkaĵoj.
actors.hero.talent.weapon_recharging.title=armila ŝargiĝado
actors.hero.talent.weapon_recharging.desc=_+1:_ Duelistino akiras unu armilan ŝargon dum _15 temperoj_ sub influo de la efiko “ŝargiĝado”.\n\n_+2:_ Duelistino akiras unu armilan ŝargon dum _15 temperoj_ sub influo de la efiko “ŝargiĝado”.
actors.hero.talent.weapon_recharging.meta_desc=_Se tiu ĉi talento estos akirita de alia heroo_, vundo kaŭzata de la heroo dum permana atako dum ŝargado pliiĝos je +5% (je nivelo +1) aŭ je +7.5% (je nivelo +2).
actors.hero.talent.lethal_haste.title=mortiga rapidemo
actors.hero.talent.lethal_haste.desc=_+1:_ kiam Duelistino mortigas malamikon per speciala armila atako, ŝi akiros _3 temperojn_ da senprokrastaj movoj.\n\n_+2:_ kiam Duelistino mortigas malamikon per speciala armila atako, ŝi akiros _5 temperojn_ da senprokrastaj movoj.
actors.hero.talent.lethal_haste.meta_desc=_Se tiu ĉi talento estos akirita de alia heroo_, ĝi aktiviĝos kun normaj frapoj ĉiu-100-tempere.
actors.hero.talent.swift_equip.title=rapida armigo
actors.hero.talent.swift_equip.desc=_+1:_ Duelistino povas momente ŝanĝi la tenatan armilon _unufoje_ dum 20 temperoj.\n\n_+2:_ Duelistino povas momente ŝanĝi la tenatan armilon _dufoje_ dum 20 temperoj.\n\nSe Duelistino posedas tiun ĉi talenton kaj ne necesas atendi ol antaŭ reuzi ĝin, rapidbutonigo de nesurmetita armilo surmetos ĝin.

actors.hero.talent.precise_assault.title=preciza atenco
actors.hero.talent.precise_assault.desc=_+1:_ kiam Duelistino uzas specialan armilan atakon, ŝi akiros _2-obligitan precizon_ dum la sekva permana atako dum 5 temperoj.\n\n_+2:_ kiam Duelistino uzas specialan armilan atakon, ŝi akiros _4-obligitan precizon_ dum la sekva permana atako dum 5 temperoj.\n\n_+3:_ kiam Duelistino uzas specialan armilan atakon, ŝi akiros _senliman precizon_ dum la sekva permana atako dum 5 temperoj.
actors.hero.talent.precise_assault.meta_desc=_Se tiu ĉi talento estos akirita de alia heroo_, permana precizo de la heroo pliiĝos je 10% (talent-nivelo +1), 20% (talent-nivelo +2) aŭ 30% (talent-nivelo +3).
actors.hero.talent.deadly_followup.title=mortiga sinsekvo
actors.hero.talent.deadly_followup.desc=_+1:_ kiam Duelistino frapas kontraŭulon per ĵetarmilo, ŝi havos je _10% pli da permana vundpovo_ kontraŭ tiu kontraŭulo dum la 5 sekvaj temperoj.\n\n_+2:_ kiam Duelistino frapas kontraŭulon per ĵetarmilo, ŝi havos je _20% pli da permana vundpovo_ kontraŭ tiu kontraŭulo dum la 5 sekvaj temperoj.\n\n_+3:_ kiam Duelistino frapas kontraŭulon per ĵetarmilo, ŝi havos je _30% pli da permana vundpovo_ kontraŭ tiu kontraŭulo dum la 5 sekvaj temperoj.

actors.hero.talent.varied_charge.title=diversa frapo
actors.hero.talent.varied_charge.desc=_+1:_ Majstrino tuj akiras _0,17 ŝargojn de speciala armila atako_ post uzi du malsamajn specialajn armilajn atakojn. Ne necesas atendi antaŭ ol reuzi tiun ĉi talenton.\n\n_+2:_ Majstrino tuj akiras _0,33 ŝargojn de speciala armila atako_ post uzi du malsamajn specialajn armilajn atakojn. Ne necesas atendi antaŭ ol reuzi tiun ĉi talenton.\n\n_+3:_ Majstrino tuj akiras _0,5 ŝargojn de speciala armila atako_ post uzi du malsamajn specialajn armilajn atakojn. Ne necesas atendi antaŭ ol reuzi tiun ĉi talenton.
actors.hero.talent.twin_upgrades.title=duobligitaj plibonigoj
actors.hero.talent.twin_upgrades.desc=_+1:_ se unu el du armiloj tenataj de Majstrino estas je malpli alta nivelo kaj ĝia supernivelo estas _almenaŭ 2 superniveloj malpli alta_ ol la alia, ĝia efektiva nivelo pliiĝos al la alia armilo.\n\n_+2:_ se unu el du armiloj tenataj de Majstrino estas je malpli alta nivelo kaj ĝia supernivelo estas _almenaŭ 1 supernivelo malpli alta_ ol la alia, ĝia efektiva nivelo pliiĝos al la alia armilo.\n\n_+3:_ se unu el du armiloj tenataj de Majstrino estas je malpli alta nivelo kaj ĝia supernivelo estas _la sama aŭ malpli alta_ ol la alia, ĝia efektiva nivelo pliiĝos al la alia armilo.
actors.hero.talent.combined_lethality.title=kunigita mortigebleco
actors.hero.talent.combined_lethality.desc=_+1:_ se Majstrino atakos uzante manarmilon tuj post kiam uzi specialan armilan atakon de alia armilo, tiu atako tuj mortigos ĉiun kontraŭulon –escepte de supermonstroj – kun _malpli ol 13% de sano._\n\n_+2:_ se Majstrino atakos uzante manarmilon tuj post kiam uzi specialan armilan atakon de alia armilo, tiu atako tuj mortigos ĉiun kontraŭulon –escepte de supermonstroj – kun _malpli ol 27% de sano._\n\n_+3:_ se Majstrino atakos uzante manarmilon tuj post kiam uzi specialan armilan atakon de alia armilo, tiu atako tuj mortigos ĉiun kontraŭulon –escepte de supermonstroj – kun _malpli ol 40% de sano._\n\nTiu ĉi atako povas esti norma permana atako aŭ speciala armila atako.

actors.hero.talent.unencumbered_spirit.title=libera spirito
actors.hero.talent.unencumbered_spirit.desc=_+1:_ Monaĥino akiras _je 50% de energio pli_ por ĉiu uzata armaĵo de _maksimume 3-a supernivelo_.\n\n_+2:_ Monaĥino akiras _je 75% de energio pli_ por ĉiu uzata armaĵo de _maksimume 2-a supernivelo_. Profito pro uzi 3-supernivelan armaĵojn ne ŝanĝiĝas.\n\n_+3:_ Monaĥino akiras _je 100% de energio pli_ por ĉiu uzata armaĵo de _supernivelo 1-a_. Profito pro uzi 2- aŭ 3-supernivelajn armaĵojn ne ŝanĝiĝas. Ŝi ankaŭ senpage ricevos ŝtofan defendaĵon kaj pikilecajn gantojn.\n\nRimarko: tiu ĉi talento ne utilas al senarmila batalo aŭ al uzo de ringo de forto.
actors.hero.talent.monastic_vigor.title=monaĥa vigleco
actors.hero.talent.monastic_vigor.desc=_+1:_ kapabloj de Monaĥino plipoviĝas kiam ŝi havas _100% de energio_.\n\n_+2:_ kapabloj de Monaĥino plipoviĝas kiam ŝi havas _almenaŭ 80% de energio_.\n\n_+3:_ kapabloj de Monaĥino plipoviĝas kiam ŝi havas _almenaŭ 60% de energio_.\n\nPlipovigitaj kapabloj:\n– fluo de frapoj uzas ensorĉon de via armilo;\n– koncentro estas senprokrasta;\n– atingo de senprokrasta alsalto pliiĝas je 4;\n– rondmova piedbato vundas je +50% pli, kaj forpiedbatas kaj paralizas ĉiujn apudajn kontraŭulojn;\n– medito malrapide resanigas 20% de mankanta sano kaj liveras 80% vund-reziston.
actors.hero.talent.combined_energy.title=kunigita energio
actors.hero.talent.combined_energy.desc=_+1:_ se Monaĥino plenumos specialan armilan atakon kaj kapablon postulatan _almenaŭ 4 ŝargojn_ dum 5 temperoj, ŝi reakiros 1 uzitan ŝargon de kapablo.\n\n_+2:_ se Monaĥino plenumos specialan armilan atakon kaj kapablon postulatan _almenaŭ 3 ŝargojn_ dum 5 temperoj, ŝi reakiros 1 uzitan ŝargon de kapablo.\n\n_+3:_ se Monaĥino plenumos specialan armilan atakon kaj kapablon postulatan _almenaŭ 2 ŝargojn_ dum 5 temperoj, ŝi reakiros 1 uzitan ŝargon de kapablo.

actors.hero.talent.close_the_gap.title=fermi interspacon
actors.hero.talent.close_the_gap.desc=_+:1_ komence de duelo Duelistino alsaltas al kontraŭulo je _maksimume du kaheloj_.\n\n_+:2_ komence de duelo Duelistino alsaltas al kontraŭulo je _maksimume tri kaheloj_.\n\n_+:3_ komence de duelo Duelistino alsaltas al kontraŭulo je _maksimume kvar kaheloj_.\n\n_+:4_ komence de duelo Duelistino alsaltas al kontraŭulo je _maksimume kvin kaheloj_.\n\nŜi povas salti trans kaptiloj kaj malamikoj, tamen ne trans firma tereno, kiel muroj. Salta distanco enkalkulas al atingo por defii malamikon pri duelo.
actors.hero.talent.invigorating_victory.title=vigliga venko
actors.hero.talent.invigorating_victory.desc=_+1:_ se Duelistino venkas kontraŭulon antaŭ fino de duelo, ŝi reakiros sanpoentojn egalajn al _5 plus 30% de vundpoentoj ricevitaj_ dum la duelo.\n\n_+2:_ se Duelistino venkas kontraŭulon antaŭ fino de duelo, ŝi reakiros sanpoentojn egalajn al _10 plus 50% de vundpoentoj ricevitaj_ dum la duelo.\n\n_+3:_ se Duelistino venkas kontraŭulon antaŭ fino de duelo, ŝi reakiros sanpoentojn egalajn al _15 plus 65% de vundpoentoj ricevitaj_ dum la duelo.\n\n_+4:_ se Duelistino venkas kontraŭulon antaŭ fino de duelo, ŝi reakiros sanpoentojn egalajn al _20 plus 75% de vundpoentoj ricevitaj_ dum la duelo.
actors.hero.talent.elimination_match.title=duelo post duelo
actors.hero.talent.elimination_match.desc=_+1:_ se Duelistino komencas alian duelon ne malpli frue ol 3 temperoj post fino de la antaŭa duelo, la necesa ŝarg-kosto _etiĝos je 16%._\n\n_+2:_ se Duelistino komencas alian duelon ne malpli frue ol 3 temperoj post fino de la antaŭa duelo, la necesa ŝarg-kosto _etiĝos je 30%._\n\n_+3:_ se Duelistino komencas alian duelon ne malpli frue ol 3 temperoj post fino de la antaŭa duelo, la necesa ŝarg-kosto _etiĝos je 40%._\n\n_+4:_ se Duelistino komencas alian duelon ne malpli frue ol 3 temperoj post fino de la antaŭa duelo, la necesa ŝarg-kosto _etiĝos je 50%._

actors.hero.talent.elemental_reach.title=plivastigita frap-ondo
actors.hero.talent.elemental_reach.desc=_+1:_ radiuso de elementa frap-ondo pliiĝas al _5 kaheloj_ (norme 4) kaj ĝia angula distanco pliiĝas al _75°_ (norme 65°).\n\n_+2:_ radiuso de elementa frap-ondo pliiĝas al _6 kaheloj_ (norme 4) kaj ĝia angula distanco pliiĝas al _85°_ (norme 65°).\n\n_+3:_ radiuso de elementa frap-ondo pliiĝas al _7 kaheloj_ (norme 4) kaj ĝia angula distanco pliiĝas al _95°_ (norme 65°).\n\n_+4:_ radiuso de elementa frap-ondo pliiĝas al _8 kaheloj_ (norme 4) kaj ĝia angula distanco pliiĝas al _105°_ (norme 65°).
actors.hero.talent.striking_force.title=majesta forto
actors.hero.talent.striking_force.desc=_+1:_ forto de efiko de elementa frap-ondo pliiĝas je _30%_..\n\n_+2:_ forto de efiko de elementa frap-ondo pliiĝas je _60%_..\n\n_+3:_ forto de efiko de elementa frap-ondo pliiĝas je _90%_..\n\n_+4:_ forto de efiko de elementa frap-ondo pliiĝas je _120%_..
actors.hero.talent.directed_power.title=alidirektita forto
actors.hero.talent.directed_power.desc=_+1:_ senpera atako de elementa frap-ondo gajnas po _+30% al ensorĉa efiko_ por ĉiu malamiko (inkluzivante la ĉefan celon) trafita per la ondo.\n\n_+2:_ senpera atako de elementa frap-ondo gajnas po _+60% al ensorĉa efiko_ por ĉiu malamiko (inkluzivante la ĉefan celon) trafita per la ondo.\n\n_+3:_ senpera atako de elementa frap-ondo gajnas po _+90% al ensorĉa efiko_ por ĉiu malamiko (inkluzivante la ĉefan celon) trafita per la ondo.\n\n_+4:_ senpera atako de elementa frap-ondo gajnas po _+120% al ensorĉa efiko_ por ĉiu malamiko (inkluzivante la ĉefan celon) trafita per la ondo.

actors.hero.talent.feigned_retreat.title=tempo por forkuro
actors.hero.talent.feigned_retreat.desc=_+1:_ se kontraŭulo atakos postrestan figuron de Duelistino, ŝi akiros _2 temperojn_ da rapidemo.\n\n_+2:_ se kontraŭulo atakos postrestan figuron de Duelistino, ŝi akiros _4 temperojn_ da rapidemo.\n\n_+3:_ se kontraŭulo atakos postrestan figuron de Duelistino, ŝi akiros _6 temperojn_ da rapidemo.\n\n_+4:_ se kontraŭulo atakos postrestan figuron de Duelistino, ŝi akiros _8 temperojn_ da rapidemo.
actors.hero.talent.expose_weakness.title=malkovri vundeblon
actors.hero.talent.expose_weakness.desc=_+1:_ malamikoj, kiuj atakos la postrestan figuron de Duelistino iĝos senfortigitaj kaj vundeblaj por _2 temperoj_.\n\n_+2:_ malamikoj, kiuj atakos la postrestan figuron de Duelistino iĝos senfortigitaj kaj vundeblaj por _4 temperoj_.\n\n_+3:_ malamikoj, kiuj atakos la postrestan figuron de Duelistino iĝos senfortigitaj kaj vundeblaj por _6 temperoj_.\n\n_+4:_ malamikoj, kiuj atakos la postrestan figuron de Duelistino iĝos senfortigitaj kaj vundeblaj por _8 temperoj_.
actors.hero.talent.counter_ability.title=forkuro kaj atako
actors.hero.talent.counter_ability.desc=_+1:_ se Duelistino plenumos specialan armilan atakon en la daŭro de 3 temperoj post kiam ŝia postresta figuro estos atakita, ŝi akiros _0,38 ŝargojn_.\n\n_+2:_ se Duelistino plenumos specialan armilan atakon en la daŭro de 3 temperoj post kiam ŝia postresta figuro estos atakita, ŝi akiros _0,77 ŝargojn_.\n\n_+3:_ se Duelistino plenumos specialan armilan atakon en la daŭro de 3 temperoj post kiam ŝia postresta figuro estos atakita, ŝi akiros _1,13 ŝargojn_.\n\n_+4:_ se Duelistino plenumos specialan armilan atakon en la daŭro de 3 temperoj post kiam ŝia postresta figuro estos atakita, ŝi akiros _1,5 ŝargojn_.

#cleric
actors.hero.talent.satiated_spells.title=Satigaj sorĉoj
actors.hero.talent.satiated_spells.desc=_+1:_ manĝado akirigas al Kleriko _3 poentojn da ŝirmo_ je la sekva fojo, kiam ri ĵetas sorĉon.\n\n_+2:_ manĝado akirigas al Kleriko _5 poentojn da ŝirmo_ je la sekva fojo, kiam ri ĵetas sorĉon.
actors.hero.talent.satiated_spells.meta_desc=_Se tiu ĉi talento estos akirita de alia heroo_, li senprokraste gajnos ŝirmon, kiu komencis malpliiĝi post 10 temperoj.
actors.hero.talent.holy_intuition.title=dieca intuicio
actors.hero.talent.holy_intuition.desc=_+1:_ Kleriko povas ĵeti la sorĉon _dieca intuicio,_ kiu malkaŝas ĉu aĵo estas malbenita, la sorĉo uzas _3 ŝargojn._\n\n_+2:_ Kleriko povas ĵeti la sorĉon _dieca intuicio,_ kiu malkaŝas ĉu aĵo estas malbenita, la sorĉo uzas _2 ŝargojn._
actors.hero.talent.holy_intuition.meta_desc=_Se tiu ĉi talento estos akirita de alia heroo_, ĝi ebligos al li sciiĝi ĉu aĵo estas malbenita tuj ankaŭ ol surmeti ĝin kun probablo 15% (je talent-nivelo +1) aŭ 25% (je talent-nivelo +2).
actors.hero.talent.searing_light.title=brulanta lumo
actors.hero.talent.searing_light.desc=_1:_ permanaj atakoj de Kleriko kontraŭ malamikoj lumiĝantaj pro la _gvida lumo_ kaŭzos _+3 vundpoentojn._\n\n_2:_ permanaj atakoj de Kleriko kontraŭ malamikoj lumiĝantaj pro la _gvida lumo_ kaŭzos _+5 vundpoentojn._
actors.hero.talent.searing_light.meta_desc=_Se tiu ĉi talento estos akirita de alia heroo_, ĝi liveros aldonan vundpovon post uzi vergon aŭ antikvaĵon sur malamiko. Necesos atendi 20 temperojn antaŭ ol reuzi la talenton.
actors.hero.talent.shield_of_light.title=ŝildo de lumo
actors.hero.talent.shield_of_light.desc=_+1:_ Kleriko povas ĵeti la sorĉon _ŝildo de lumo,_ kiu senprokraste donos al ri _2-4 poentojn da ŝirmo_ kontraŭ elektita celo por 5 temperoj, la sorĉo uzas 1 ŝargon.\n\n_+2:_ Kleriko povas ĵeti la sorĉon _ŝildo de lumo,_ kiu senprokraste donos al ri _3-6 poentojn da ŝirmo_ kontraŭ elektita celo por 5 temperoj, la sorĉo uzas 1 ŝargon.
actors.hero.talent.shield_of_light.meta_desc=_Se tiu ĉi talento estos akirita de alia heroo_, ĝi etigos vundon ricevitan de elektita kontraŭulo je 1 poento kun ŝanco 33% (je talent-nivelo +1) aŭ 50% (je talent-nivelo +2).

actors.hero.talent.enlightening_meal.title=Kleriga manĝaĵo
actors.hero.talent.enlightening_meal.desc=_+1:_ manĝado daŭras 1 temperon kaj donas al Kleriko _0,67 ŝargojn_ por ria sankta librego.\n\n_+2:_ manĝado daŭras 1 temperon kaj donas al Kleriko _1 ŝargon_ por ria sankta librego.
actors.hero.talent.enlightening_meal.meta_desc=_Se tiu ĉi talento estos akirita de alia heroo_, li gajnos 2 temperojn de ŝargado de antikvaĵoj kaj vergoj je talent-nivelo +1 aŭ 3 temperojn je talent-nivelo +2. Tiu ĉi talento ne povas esti uzita por igi la kornon de abundo ŝargi sin mem.
actors.hero.talent.recall_inscription.title=Relego de runoj
actors.hero.talent.recall_inscription.refunded=Via aĵo estis redonita!
actors.hero.talent.recall_inscription.desc=_+1:_ Kleriko povas ĵeti la sorĉon _relego de runoj,_ kiu ebligas al ri refari efikon de la laste uzita runŝtono aŭ skribrulaĵo, kiun ri uzis dum la antaŭaj _10 temperoj._\n\n_+2:_ Kleriko povas ĵeti la sorĉon _relego de runoj,_ kiu ebligas al ri refari efikon de la laste uzita runŝtono aŭ skribrulaĵo, kiun ri uzis dum la antaŭaj _300 temperoj._\n\nLa sorĉon oni ne povas uzi por refari skribrulaĵon de plibonigo. Necesaj ŝargoj dependas de antaŭe uzita aĵo: 2 por runŝtono, 3 por skribrulaĵo kaj 4 por ekzota skribrulaĵo. La ŝargkosto ankaŭ duobliĝas por refari skribrulaĵon de transformo aŭ allĥemiaĵojn, kiuj devas esti kuiritaj per transformo aŭ plibonigo.
actors.hero.talent.recall_inscription.meta_desc=_Se tiu ĉi talento estos akirita de alia heroo_, ĝi redonos ĉiun skribrulaĵon aŭ rulŝtonon kun probablo 10% (je talent-nivelo +1) aŭ 15% (je talent-nivelo +2). La talento ne povas redoni skribrulaĵojn de plibonigo.
actors.hero.talent.sunray.title=Sunradio
actors.hero.talent.sunray.desc=_+1:_ Kleriko povas ĵeti la sorĉon _sunradio,_ kiu kaŭzas _4-8 vundpoentojn_ kaj blindumas la viktimon por _4 temperoj_, la sorĉo uzas 1 ŝargon.\n\n_+2:_ Kleriko povas ĵeti la sorĉon _sunradio,_ kiu kaŭzas _6-12 vundpoentojn_ kaj blindumas la viktimon por _6 temperoj_, la sorĉo uzas 1 ŝargon.\n\nSunradio povas blindumi ĉiun kontraŭulon nur unufoje, je la sekva pafo viktimo blindumita de sunradio estos paralizigita. La sorĉo ĉiam maksimume vundas demonajn kaj nemortajn malamikojn.
actors.hero.talent.sunray.meta_desc=_Se tiu ĉi talento estos akirita de alia heroo_, ĝi igos vergojn blindumi kontraŭulojn por 4 temperoj kun probablo 15% (je talent-nivelo +1) aŭ 25% (je talent-nivelo +2).
actors.hero.talent.divine_sense.title=Dia senco
actors.hero.talent.divine_sense.desc=_+1:_ Kleriko povas ĵeti la sorĉon _dia senco,_ kiu donas al ri _8-kahelan_ mensvidon por 50 temperoj. Ĵeti tiun ĉi sorĉon daŭras neniun temperon kaj ĝi uzas 2 ŝargojn.\n\n_+2:_ Kleriko povas ĵeti la sorĉon _dia senco,_ kiu donas al ri _12-kahelan_ mensvidon por 50 temperoj. Ĵeti tiun ĉi sorĉon daŭras neniun temperon kaj ĝi uzas 2 ŝargojn.
actors.hero.talent.divine_sense.meta_desc=_Se tiu ĉi talento estos akirita de alia heroo_, li gajnos nedaŭran mensvidon post uzi vergon aŭ antikvaĵon kun atingo de 3 kaheloj (je talent-nivelo +1) aŭ 5 kaheloj (je talent-nivelo +2).
actors.hero.talent.bless.title=Beno
actors.hero.talent.bless.desc=_+1:_ Kleriko povas ĵeti la sorĉon _beno,_ kiu liveras _6 temperojn de beno kaj 10 poentojn da ŝirmo_ kiam ĵetita al si mem aŭ _10 temperojn de beno kaj 10 poentojn da sano_ kiam ĵetita al alia ulo, la sorĉo uzas 1 ŝargon.\n\n_+2:_ Kleriko povas ĵeti la sorĉon _beno,_ kiu liveras _10 temperojn de beno kaj 15 poentojn da ŝirmo_ kiam ĵetita al si mem aŭ _15 temperojn de beno kaj 15 poentojn da sano_ kiam ĵetita al alia ulo, la sorĉo uzas 1 ŝargon.\n\nTroa sanigo de tiu sorĉo ŝanĝiĝas al ŝirmo.
actors.hero.talent.bless.meta_desc=_Se tiu ĉi talento estos akirita de alia heroo_, ĝi pliigos precizon kaj evitpovon de la heroo kaj ĉiuj amikoj je 3% (je talent-nivelo +1) aŭ 5% (je talent-nivelo +2).

actors.hero.talent.cleanse.title=Puriĝo
actors.hero.talent.cleanse.desc=_+1:_ Kleriko povas ĵeti la sorĉon _puriĝo,_ kiu _forigas minacajn efikojn_ de Kleriko kaj de ĉiuj videblaj amikoj kaj donas al ili _10 poentojn da ŝirmo_, la sorĉo uzas 2 ŝargojn.\n\n_+2:_ Kleriko povas ĵeti la sorĉon _puriĝo,_ kiu donas al Kleriko kaj al ĉiuj videblaj amikoj _3 temperojn de rezisto kontraŭ minacaj efikoj_ kaj _20 poentojn da ŝirmo,_ la sorĉo uzas 2 ŝargojn.\n\n_+3:_ Kleriko povas ĵeti la sorĉon _puriĝo,_ kiu donas al Kleriko kaj al ĉiuj videblaj amikoj _5 temperojn de rezisto kontraŭ minacaj efikoj_ kaj _30 poentojn da ŝirmo,_ la sorĉo uzas 2 ŝargojn.
actors.hero.talent.cleanse.meta_desc=_Se tiu ĉi talento estos akirita de alia heroo_, ĝi forviŝos minacajn efikojn post kiam la heroo uzos vergon aŭ antikvaĵon kun probablo 10/20/30% je talent-nivelo +1/+2/+3.
actors.hero.talent.light_reading.title=Malpeza librego
actors.hero.talent.light_reading.desc=_+1:_ Kleriko povas uzi sian sanktan libregon sen surmeti ĝin, sed dum tiu tempo ĝi ŝargiĝas je _25% rapido._\n\n_+2:_ Kleriko povas uzi sian sanktan libregon sen surmeti ĝin, sed dum tiu tempo ĝi ŝargiĝas je _50% rapido._\n\n_+3:_ Kleriko povas uzi sian sanktan libregon sen surmeti ĝin, sed dum tiu tempo ĝi ŝargiĝas je _75% rapido._
actors.hero.talent.light_reading.meta_desc=_Se tiu ĉi talento estos akirita de alia heroo_, la rapido de ŝargado de ĉiuj vergoj pliiĝos je 7% (nivelo +1), 13% (nivelo +2) aŭ 20% (nivelo +3).

actors.hero.talent.holy_lance.title=Sankta ĵetlanco
actors.hero.talent.holy_lance.desc=_+1:_ Pastro povas ĵeti la sorĉon _sankta ĵetlanco,_ kiu kaŭzas _30-55 vundpoentojn_ kaj uzas 4 ŝargojn.\n\n_+2:_ Pastro povas ĵeti la sorĉon _sankta ĵetlanco,_ kiu kaŭzas _45-83 vundpoentojn_ kaj uzas 4 ŝargojn.\n\n_+3:_ Pastro povas ĵeti la sorĉon _sankta ĵetlanco,_ kiu kaŭzas _60-110 vundpoentojn_ kaj uzas 4 ŝargojn.\n\nLa sorĉo ĉiam maksimume vundas demonajn kaj nemortajn malamikojn. Pastro devas atendi 30 temperoj antaŭ ol povi ĵeti la sorĉon denove.
actors.hero.talent.hallowed_ground.title=Benita tero
actors.hero.talent.hallowed_ground.desc=_+1:_ Pastro povas ĵeti la sorĉon _benita tero,_ kiu benos la _kvadraton 3×3_ por 20 temperoj, la sorĉo uzas 2 ŝargojn.\n\n_+2:_ Pastro povas ĵeti la sorĉon _benita tero,_ kiu benos la _kvadraton 5×5_ por 20 temperoj, la sorĉo uzas 2 ŝargojn.\n\n_+3:_ Pastro povas ĵeti la sorĉon _benita tero,_ kiu benos la _kvadraton 7×7_ por 20 temperoj, la sorĉo uzas 2 ŝargojn.\n\nEn la momento de ĵeto tiu ĉi sorĉo sanigas amikojn je 15 sanpoentoj, provizore enradikigas malamikojn kaj disvastigas malaltan herbon. Sekve ĝi malrapide sanigas amikojn, kripligas malamikojn kaj hazarde kreskigas altan herbon. Por Pastro benita tero liveras ŝirmon anstataŭ sanigi. Fajro detruas benitan teron.
actors.hero.talent.mnemonic_prayer.title=Parkerigita preĝo
actors.hero.talent.mnemonic_prayer.desc=_+1:_ Pastro povas ĵeti la sorĉon _parkerigita preĝo,_ kiu plidaŭrigas utilajn/minacajn efikojn sur _amiko/malamiko_ por _3 temperoj,_ la sorĉo uzas 1 ŝargon.\n\n_+2:_ Pastro povas ĵeti la sorĉon _parkerigita preĝo,_ kiu plidaŭrigas utilajn/minacajn efikojn sur _amiko/malamiko_ por _4 temperoj,_ la sorĉo uzas 1 ŝargon.\n\n_+3:_ Pastro povas ĵeti la sorĉon _parkerigita preĝo,_ kiu plidaŭrigas utilajn/minacajn efikojn sur _amiko/malamiko_ por _5 temperoj,_ la sorĉo uzas 1 ŝargon.\n\nĴeti la sorĉon daŭras neniun temperon. La sorĉo povas plidaŭrigi specifan efikon nur unufoje kaj ne povas plidaŭrigi efikojn de defendaĵaj kapabloj.

actors.hero.talent.lay_on_hands.title=mansurmeto
actors.hero.talent.lay_on_hands.desc=_+1:_ Paladino povas ĵeti la sorĉon _mansurmeto,_ kiu senprokraste sanigas proksiman ulon je _50 sanpoentoj_ kaj liveras al ri _15 poentojn da ŝirmo,_ la sorĉo uzas 1 ŝargon.\n\n_+2:_ Paladino povas ĵeti la sorĉon _mansurmeto,_ kiu senprokraste sanigas proksiman ulon je _20 sanpoentoj_ kaj liveras al ri _20 poentojn da ŝirmo,_ la sorĉo uzas 1 ŝargon.\n\n_+3:_ Paladino povas ĵeti la sorĉon _mansurmeto,_ kiu senprokraste sanigas proksiman ulon je _25 sanpoentoj_ kaj liveras al ri _25 poentojn da ŝirmo,_ la sorĉo uzas 1 ŝargon.\n\nTroa sanigo de tiu sorĉo ŝanĝiĝas al ŝirmo. La sorĉon oni povas ĵeti pluroble, sed ne povas ĵeti ĝin akirante pli ol tri ŝirmoj samtempe.
actors.hero.talent.aura_of_protection.title=aŭreolo de protekto
actors.hero.talent.aura_of_protection.desc=_+1:_ Paladino povas ĵeti la sorĉon _aŭreolo de protekto,_ kiu donas al ri kaj al ĉiuj amikoj ene 2 kaheloj _20% vund-reziston_ kaj efikon de skribaĵo de la paladina defendaĵo _plifortigitan je +50%_ por 20 temperoj, la sorĉo uzas 2 ŝargojn.\n\n_+2:_ Paladino povas ĵeti la sorĉon _aŭreolo de protekto,_ kiu donas al ri kaj al ĉiuj amikoj ene 2 kaheloj _30% vund-reziston_ kaj efikon de skribaĵo de la paladina defendaĵo _plifortigitan je +75%_ por 20 temperoj, la sorĉo uzas 2 ŝargojn.\n\n_+3:_ Paladino povas ĵeti la sorĉon _aŭreolo de protekto,_ kiu donas al ri kaj al ĉiuj amikoj ene 2 kaheloj _40% vund-reziston_ kaj efikon de skribaĵo de la paladina defendaĵo _plifortigitan je +100%_ por 20 temperoj, la sorĉo uzas 2 ŝargojn.
actors.hero.talent.wall_of_light.title=muro de lumo
actors.hero.talent.wall_of_light.desc=_+1:_ Paladino povas ĵeti la sorĉon _muro de lumo,_ kiu starigas solidan muron _longan je 3 kaheloj_ tuj antaŭ Paladino, kiu repuŝas malamikojn kaj daŭras por 20 temperoj, la sorĉo uzas 3 ŝargojn.\n\n_+2:_ Paladino povas ĵeti la sorĉon _muro de lumo,_ kiu starigas solidan muron _longan je 5 kaheloj_ tuj antaŭ Paladino, kiu repuŝas malamikojn kaj daŭras por 20 temperoj, la sorĉo uzas 3 ŝargojn.\n\n_+3:_ Paladino povas ĵeti la sorĉon _muro de lumo,_ kiu starigas solidan muron _longan je 7 kaheloj_ tuj antaŭ Paladino, kiu repuŝas malamikojn kaj daŭras por 20 temperoj, la sorĉo uzas 3 ŝargojn.\n\nLa muron oni povas starigi vertikale, horizontale aŭ diagonale; nur unu muro povas ekzisti samtempe.

actors.hero.talent.divine_intervention.title=dia interveno
actors.hero.talent.divine_intervention.desc=_+1:_ estante en ascendita formo, Kleriko povas ĵeti la sorĉon _dia interveno,_ kiu liveras al Kleriko kaj ĉiuj amikoj maksimume _150 poentojn da ŝirmo_ kaj plidaŭridgas la ascenditan formon je _3 temperoj._\n\n_+2:_ estante en ascendita formo, Kleriko povas ĵeti la sorĉon _dia interveno,_ kiu liveras al Kleriko kaj ĉiuj amikoj maksimume _200 poentojn da ŝirmo_ kaj plidaŭridgas la ascenditan formon je _4 temperoj._\n\n_+3:_ estante en ascendita formo, Kleriko povas ĵeti la sorĉon _dia interveno,_ kiu liveras al Kleriko kaj ĉiuj amikoj maksimume _250 poentojn da ŝirmo_ kaj plidaŭridgas la ascenditan formon je _5 temperoj._\n\n_+4:_ estante en ascendita formo, Kleriko povas ĵeti la sorĉon _dia interveno,_ kiu liveras al Kleriko kaj ĉiuj amikoj maksimume _300 poentojn da ŝirmo_ kaj plidaŭridgas la ascenditan formon je _6 temperoj._\n\nDia interveno uzas eĉ 5 ŝargojn de la sankta librego kaj povas esti uzita nur unufoje dum la sama ascendita formo.
actors.hero.talent.judgement.title=juĝo
actors.hero.talent.judgement.desc=_+1:_ estante en ascendita formo Kleriko povas ĵeti la sorĉon _juĝo,_ kiu kaŭzas _10-20 vundpoentojn_ al ĉiuj videblaj malamikoj.\n\n_+2:_ estante en ascendita formo Kleriko povas ĵeti la sorĉon _juĝo,_ kiu kaŭzas _15-30 vundpoentojn_ al ĉiuj videblaj malamikoj.\n\n_+3:_ estante en ascendita formo Kleriko povas ĵeti la sorĉon _juĝo,_ kiu kaŭzas _20-40 vundpoentojn_ al ĉiuj videblaj malamikoj.\n\n_+4:_ estante en ascendita formo Kleriko povas ĵeti la sorĉon _juĝo,_ kiu kaŭzas _25-50 vundpoentojn_ al ĉiuj videblaj malamikoj.\n\nJuĝo uzas 3 ŝargojn de la sankta librego. La sorĉo kaŭzas po +33% kromaj vundpoentoj por ĉiu sorĉo ĵetita de Kleriko ekde alpreni ascenditan formon aŭ ekde antaŭe sorĉi la juĝon.
actors.hero.talent.flash.title=fulmo
actors.hero.talent.flash.desc=_+1:_ estante en ascendita formo Kleriko povas ĵeti la sorĉon _fulmo_ por teleportiĝi je maksimuma distanco de _3 kaheloj._\n\n_+2:_ estante en ascendita formo Kleriko povas ĵeti la sorĉon _fulmo_ por teleportiĝi je maksimuma distanco de _4 kaheloj._\n\n_+3:_ estante en ascendita formo Kleriko povas ĵeti la sorĉon _fulmo_ por teleportiĝi je maksimuma distanco de _5 kaheloj._\n\n_+4:_ estante en ascendita formo Kleriko povas ĵeti la sorĉon _fulmo_ por teleportiĝi je maksimuma distanco de _6 kaheloj._\n\nLa sorĉo uzas 2 ŝargojn dekomence kaj 1 plian ŝargon por ĉiu uzo en la sama ascendita formo.

actors.hero.talent.body_form.title=korpa formo
actors.hero.talent.body_form.desc=Kleriko povas sorĉi _korpan formon_, kiu plenigas la triunuon per povo de ensorĉo aŭ skribaĵo, kiun ri identigis dum tiu ĉi ludo. La sorĉo uzas 2 ŝargojn.\n\n_+1:_ kiam la triunuo estas uzata, Kleriko akiras la elektitan efikon por _20 temperoj._\n\n_+2:_ kiam la triunuo estas uzata, Kleriko akiras la elektitan efikon por _27 temperoj._\n\n_+3:_ kiam la triunuo estas uzata, Kleriko akiras la elektitan efikon por _33 temperoj._\n\n_+4:_ kiam la triunuo estas uzata, Kleriko akiras la elektitan efikon por _40 temperoj._\n\nLa triunuo povas esti plenigita nur per unu korpa efiko samtempe. Necesa ŝargkosto estas pli alta, se la elektita skribaĵo estas malofta kaj potenca.
actors.hero.talent.mind_form.title=mensa formo
actors.hero.talent.mind_form.desc=Kleriko povas sorĉi _mensan formon_, kiu plenigas la triunuon per povo de vergo aŭ ĵetarmilo, kiun ri identigis dum tiu ĉi ludo. La sorĉo uzas 3 ŝargojn.\n\n_+1:_ kiam la triunuo estas uzata, Kleriko povas aktivigi efikon de la elektita aĵo samkiel ĝi estus je nivelo _+3._\n\n_+2:_ kiam la triunuo estas uzata, Kleriko povas aktivigi efikon de la elektita aĵo samkiel ĝi estus je nivelo _+4._\n\n_+3:_ kiam la triunuo estas uzata, Kleriko povas aktivigi efikon de la elektita aĵo samkiel ĝi estus je nivelo _+5._\n\n_+4:_ kiam la triunuo estas uzata, Kleriko povas aktivigi efikon de la elektita aĵo samkiel ĝi estus je nivelo _+6._\n\nLa triunuo povas esti plenigita nur per unu mensa efiko samtempe.
actors.hero.talent.spirit_form.title=spirita formo
actors.hero.talent.spirit_form.desc=Kleriko povas sorĉi _spiritan formon_, kiu plenigas la triunuon per povo de ringo aŭ antikvaĵo (escepte de la sankta librego), kiun ri identigis dum tiu ĉi ludo. La sorĉo uzas 4 ŝargojn.\n\n_+1:_ kiam la triunuo estas uzata, Kleriko akiras la efikon de ringo kun nivelo _+1_ por 20 temperoj aŭ aktivigas efikon de antikvaĵo kun nivelo _+4._\n\n_+2:_ kiam la triunuo estas uzata, Kleriko akiras la efikon de ringo kun nivelo _+2_ por 20 temperoj aŭ aktivigas efikon de antikvaĵo kun nivelo _+6._\n\n_+3:_ kiam la triunuo estas uzata, Kleriko akiras la efikon de ringo kun nivelo _+3_ por 20 temperoj aŭ aktivigas efikon de antikvaĵo kun nivelo _+8._\n\n_+4:_ kiam la triunuo estas uzata, Kleriko akiras la efikon de ringo kun nivelo _+4_ por 20 temperoj aŭ aktivigas efikon de antikvaĵo kun nivelo _+10._\n\nLa triunuo povas esti plenigita nur per unu spirita efiko samtempe. Efikoj de antikvaĵoj estas modifitaj kaj necesaj defendaĵaj ŝargoj varias kiam aktivigitaj per la triunuo.

actors.hero.talent.beaming_ray.title=teleport-fasko
actors.hero.talent.beaming_ray.desc=Kleriko povas sorĉi _teleport-faskon_ el la plifortigita amiko uzante 1 ŝargon. La teleport-fasko povas transiri murojn kaj teleporti la amikon al elektita loko. Se kontraŭulo estos en tiu loko, la amiko aperos apud la kontraŭulo kaj direktos kontraŭ ĝi. La teleport-fasko eĉ povas teleporti kutime nemoveblajn amikojn, tamen tiaokaze ĝia atingo duoniĝos.\n\n_+1:_ la teleport-fasko havas atingon de _4 kaheloj_ kaj pliigas kroman vundpovon de la plurforto al _+35%_ kontraŭ la plej proksima malamiko por 10 temperoj.\n\n_+2:_ la teleport-fasko havas atingon de _8 kaheloj_ kaj pliigas kroman vundpovon de la plurforto al _+40%_ kontraŭ la plej proksima malamiko por 10 temperoj.\n\n_+3:_ la teleport-fasko havas atingon de _12 kaheloj_ kaj pliigas kroman vundpovon de la plurforto al _+45%_ kontraŭ la plej proksima malamiko por 10 temperoj.\n\n_+4:_ la teleport-fasko havas atingon de _16 kaheloj_ kaj pliigas kroman vundpovon de la plurforto al _+50%_ kontraŭ la plej proksima malamiko por 10 temperoj.
actors.hero.talent.life_link.title=vivligilo
actors.hero.talent.life_link.desc=Kleriko povas sorĉi _vivligilon_ inter si kaj la plifortigita amiko uzante 2 ŝargojn. Tiu sorĉo dividas vundojn inter Kleriko kaj ria amiko, kaj kaŭzas utilajn sorĉoj de la maksimuma 3-a nivelo aplikiĝos al ili ambaŭ.\n\n_+1:_ vivligilo daŭras _10 temperojn_ kaj pliigas la plurfortan redukton de ricevataj vundoj al _-35%._\n\n_+2:_ vivligilo daŭras _13 temperojn_ kaj pliigas la plurfortan redukton de ricevataj vundoj al _-40%._\n\n_+3:_ vivligilo daŭras _17 temperojn_ kaj pliigas la plurfortan redukton de ricevataj vundoj al _-45%._\n\n_+4:_ vivligilo daŭras _20 temperojn_ kaj pliigas la plurfortan redukton de ricevataj vundoj al _-50%._
actors.hero.talent.stasis.title=stazo
actors.hero.talent.stasis.desc=Kleriko povas ĵeti la sorĉon _stazo_ sur la plifortigita amiko uzante 2 ŝargojn. Stazo portempe forigas la amikon el la labirinto kaj konservas la restan tempon de ĉiuj utilaj efikoj, inkluzivante la plurforton. La amiko reaperos ĉu Kleriko je fino de la sorĉo. La sorĉon oni povas reĵeti neuzante ŝargojn por pli frue fini la efikon. La sorĉo ĵetiĝas sur nemoveblaj amikoj, sed ne povas movi ilin inter keletaĝoj.\n\n_+1:_ la sorĉo stazo daŭras por maksimume _60 temperoj._\n\n_+2:_ la sorĉo stazo daŭras por maksimume _90 temperoj._\n\n_+3:_ la sorĉo stazo daŭras por maksimume _120 temperoj._\n\n_+4:_ la sorĉo stazo daŭras por maksimume _150 temperoj._\n\nKleriko ankaŭ povas ĵeti la sorĉon teleport-fasko kiam amiko estas en la stazo por alvoki lin, aŭ la sorĉon vivligilo por antaŭzorge apliki ĝian efikon. Tamen amikoj en stazo ne profitas de la vivligilo.


#universal
actors.hero.talent.heroic_energy.title=heroa energio
actors.hero.talent.heroic_energy.rat_title=rata energio
actors.hero.talent.heroic_energy.desc=_+1:_ defendaĵa kapablo uzas je _12% malpli_ de ŝargoj.\n\n_+2:_ defendaĵa kapablo uzas je _23% malpli_ de ŝargoj.\n\n_+3:_ defendaĵa kapablo uzas je _32% malpli_ de ŝargoj.\n\n_+4:_ defendaĵa kapablo uzas je _40% malpli_ de ŝargoj.

actors.hero.talent.ratsistance.title=ratrezisto
actors.hero.talent.ratsistance.desc=_+1:_ minacaj rattransformitaj malamikoj vundas je _10% malpli forte._\n\n_+2:_ minacaj rattransformitaj malamikoj vundas je _19% malpli forte._\n\n_+3:_ minacaj rattransformitaj malamikoj vundas je _27% malpli forte._\n\n_+4:_ minacaj rattransformitaj malamikoj vundas je _35% malpli forte._
actors.hero.talent.ratlomacy.title=ratamikiĝo
actors.hero.talent.ratlomacy.desc=_+1:_ uzo de rattransformo sur jam-transformita malamiko igas ĝin esti amika kaj efiko de rattransformo daŭras por ĉiam.\n\n_+2:_ uzo de rattransformo sur jam-transformita malamiko igas ĝin esti amika, efiko de rattransformo daŭras por ĉiam kaj donas al ĝi _2 temperojn_ da adrenalino.\n\n_+2:_ uzo de rattransformo sur jam-transformita malamiko igas ĝin esti amika, efiko de rattransformo daŭras por ĉiam kaj donas al ĝi _4 temperojn_ da adrenalino.\n\n_+4:_ uzo de rattransformo sur jam-transformita malamiko igas ĝin esti amika, efiko de rattransformo daŭras por ĉiam kaj donas al ĝi _6 temperojn_ da adrenalino.
actors.hero.talent.ratforcements.title=ratsubteno
actors.hero.talent.ratforcements.desc=_+1:_ uzo de rettransformo sur vi mem _alvokas 1_ amikan kangurecan raton ĉe vi.\n\n_+2:_ uzo de rettransformo sur vi mem _alvokas 2_ amikajn kangurecajn ratojn ĉe vi.\n\n_+3:_ uzo de rettransformo sur vi mem _alvokas 3_ amikajn kangurecajn ratojn ĉe vi.\n\n_+4:_ uzo de rettransformo sur vi mem _alvokas 4_ amikajn kangurecajn ratojn ĉe vi.



###npcs
actors.mobs.npcs.blacksmith.name=trolo forĝisto
actors.mobs.npcs.blacksmith.intro_quest_warrior=He hom’! Vi shajnas esti hardita.
actors.mobs.npcs.blacksmith.intro_quest_mage=He hom’! Vi shajnas esti inteligenta.
actors.mobs.npcs.blacksmith.intro_quest_rogue=He hom’! Vi shajnas esti sagaca.
actors.mobs.npcs.blacksmith.intro_quest_huntress=He hom’! Vi shajnas esti rapida.
actors.mobs.npcs.blacksmith.intro_quest_duelist=He hom’! Vi shajnas esti kuragha.
actors.mobs.npcs.blacksmith.intro_quest_cleric=He hom’! Vi shajnas esti grava.
actors.mobs.npcs.blacksmith.intro_quest_start=Chu vi volas taugi, chu ne? Mi havas laboron por vi. Mi konstruis tiun chi metiejon super malnova minej’, malsupren lau tiu chi shtupetar’. Prenu tiun chi piochon kaj elfosu iom da _ombra or’, 40‧pecoj_ sufichos. Rok’ malsupre estas malmola, do _kun ioma pen’ vi povos fosi tra murojn._\n\nVi probable demandos pri honorari’. Avarul’…\n\nNu, mi povos forghi ion por vi. Rigardu vin bonshanca, mi estas l’ ununura forghist’ chirkaue.
actors.mobs.npcs.blacksmith.intro_quest_crystal=Estu singarda, l’ malsupra minej’ estas danghera por tiel malgranda hom’ kiel vi. Post forlas’ kristaloj ekkreskighis. Ili briletas, sed estas tro rompighemaj por utilighi kaj estas protektataj de magiaj estajhoj. Ili estas ech fortaj, do_ estus singarda dum mini_, au vi altiros ilian atenton.\n\nIe tie estas _giganta kristal’_. Ghi estas signife pli malfacile detruebla, do preparighu por batal’ antau ol komenci detrui ghin. Mi supozas, ke detrui ghin malrapidigos kreskadon de aliaj kristaloj, do mia rekompenc’ pro ghia detru’ estos pli granda.
actors.mobs.npcs.blacksmith.intro_quest_gnoll=Estu singarda, l’ malsupra minej’ estas danghera por tiel malgranda hom’ kiel vi. Iuj gnoloj ankau deziras ombran oron kaj nun ili detruas l’ minejon. Tiuj stultaj gnoloj kauzis multajn kolapsojn kaj terenfalojn. Malgrau chiujn malfacilajhojn vi devos mini, do _rigardu pri freshe rompitaj rokoj_.\n\nShajnas, ke l’ cetera gnol’ kauzas pli da problemoj ol aliaj gnoloj, li nomighas _geomanciisto shamano_ au simile. Mi pagos pli, se vi trovos kaj mortigos lin, sed mi certas, ke li ne kapitulacos sen batal’.
actors.mobs.npcs.blacksmith.intro_quest_fungi=Estu singarda, l’ malsupra minej’ estas danghera por tiel malgranda hom’ kiel vi. Tie kreskas kelkaj monstraj fungoj. Fungaj gardantoj povas esti vere dangheraj, kiam ili rigardos vin, tamen feliche ili ne patrolas koridorojn. _Estu ekster ilia vidating’_, se vi volas resti viva.\n\nMi honorarios pli, se vi eliminos l’ _gigantan fungon_, tamen tio chi ne estos facila. Ghi estas konektita kun micelioj kashitaj en l’ muroj. Detruu ilin antau ol provi mortigi l’ gigantan fungon.
actors.mobs.npcs.blacksmith.reminder=Chesu perdi mian tempon! Tie estas enirej’ al l’ minej’.
actors.mobs.npcs.blacksmith.reminder_crystal=Kolektu kiel eble plej multe da ombra or’ kaj provu ankau detrui l’ gigantan kristalon.
actors.mobs.npcs.blacksmith.reminder_gnoll=Kolektu kiel eble plej multe da ombra or’ kaj provu ankau mortigi l’ geomanciiston shamanon.
actors.mobs.npcs.blacksmith.reminder_fungi=Kolektu kiel eble plej multe da ombra or’ kaj provu ankau elimini l’ gigantan fungon.
actors.mobs.npcs.blacksmith.lost_pick=Chu vi mokas min? Kie estas mia pioch’?
actors.mobs.npcs.blacksmith.quest_start_prompt=Chu vi pretas iri malsupren? Certighu havi iom da libera spaco por ombra or’.\n\n_Mi permesos al vi esplori l’ minejon nur unufoje!_
actors.mobs.npcs.blacksmith.enter_yes=Mi pretas
actors.mobs.npcs.blacksmith.enter_no=Jam ne
actors.mobs.npcs.blacksmith.exit_warn_none=Chu vi finis vian laboron? Vi kolektis preskau neniom da oro! Vi devas povi akiri _40 pecojn_ da ombra or’.\n\n_Estu konscia, ke mi ne permesos al vi reveni al l’ minej’ post eliri._
actors.mobs.npcs.blacksmith.exit_warn_low=Chu vi finis vian laboron? Shajnas, ke vi ne havas multe da or’. Vi devas povi akiri _40 pecojn_ da ombra or’.\n\n_Estu konscia, ke mi ne permesos al vi reveni al l’ minej’ post eliri._
actors.mobs.npcs.blacksmith.exit_warn_med=Chu vi finis vian laboron? Shajnas, ke vi akiris kelkan oron, sed l’ minej’ entenas plian oron. Vi devas povi akiri _40 pecojn_ da ombra or’.\n\n_Estu konscia, ke mi ne permesos al vi reveni al l’ minej’ post eliri._
actors.mobs.npcs.blacksmith.exit_warn_high=Chu vi finis vian laboron? Shajnas, ke vi akiris multan oron, tamen mi bezonos iomete pli da ĝi. Vi devas povi akiri _40 pecojn_ da ombra or’.\n\n_Estu konscia, ke mi ne permesos al vi reveni al l’ minej’ post eliri._
actors.mobs.npcs.blacksmith.exit_warn_full=Chu vi finis vian laboron? Shajnas, ke vi akiris multan oron, tamen certighu, ke vi ne forlasis vian ekipajhon en l’ minej’.\n\n_Estu konscia, ke mi ne permesos al vi reveni al l’ minej’ post eliri._
actors.mobs.npcs.blacksmith.exit_warn_crystal=Tiu giganta kristal’ plue estas tie. Mi pagos pli, se vi forigos ghin.
actors.mobs.npcs.blacksmith.exit_warn_gnoll=Tiu gnol’ geomanciist’ plue spiras tie. Mi pagos pli, se vi mortigos lin.
actors.mobs.npcs.blacksmith.exit_warn_fungi=Tiu giganta fung’ plue kreskas tie. Mi pagos pli, se vi eliminos ghin.
actors.mobs.npcs.blacksmith.exit_yes=Mi finis
actors.mobs.npcs.blacksmith.exit_no=Jam ne
actors.mobs.npcs.blacksmith.get_lost=Mi laboras. Enpakighu kaj forighu!
actors.mobs.npcs.blacksmith.entrance_blocked=La koridoro malsupren estas blokita.
actors.mobs.npcs.blacksmith.cant_enter_old=Tiu ĉi areo ne estas disponebla dum tiu ĉi ludo. Komencu novan ludon por provi novan taskon!
actors.mobs.npcs.blacksmith.def_verb=blokita
actors.mobs.npcs.blacksmith.desc=Tiu ĉi trolo forĝisto aspektas kiel iu ajn alia trolo: li estas alta kaj maldika, kaj lia haŭto similas ŝtonon kaj kolore kaj tuŝaspekte. La trolo forĝisto umas ion per siaj neproporcie etaj iloj.

actors.mobs.npcs.ghost.name=trista fantomino
actors.mobs.npcs.ghost.rat_1=Bonvenon %s… Iam antaŭe mi estis tia sama kiel ci – forta kaj memfida… Tamen mi estis mortigita de fikreaĵo… Mi ne povas forlasi tiun ĉi ejon… Ne antaŭ ol mi venĝos min… Ekzekutu la _haladzan rataĉon,_ kiu senvivigis min…\n\nĜi vagas en tiu ĉi keletaĝo… Dissemante abomenaĵon ĉien… _Gardu cin kontraŭ ĝia nubeto de odoraĉo kaj acid-morda buŝego, la acido diskoncentriĝas en akvo…_
actors.mobs.npcs.ghost.rat_2=Bonvolu… Helpu min… Ekzekutu la fibeston…\n\n_Batalu proksime de akvo… Evitu la odoraĉon…_
actors.mobs.npcs.ghost.gnoll_1=Bonvenon %s… Iam antaŭe mi estis tia sama kiel ci – forta kaj memfida… Tamen mi estis murdita de ruza fiulo… Mi ne povas forlasi tiun ĉi ejon… Ne antaŭ ol mi venĝos min… Ekzekutu la _trompeman gnolon,_ kiu senvivigis min…\n\nLi ne estas tia sama kiel aliaj gnoloj… Li embuskas kaj uzas ĵetarmilojn… _Gardu cin kontraŭ liaj venenaj kaj flamigaj sagetoj, ne ataku lin de malproksime…_
actors.mobs.npcs.ghost.gnoll_2=Bonvolu… Helpu min… Ekzekutu la trompulon…\n\n_Li ne povas ĵetpafi cin… Proksimigu al li…_
actors.mobs.npcs.ghost.crab_1=Bonvenon %s… Iam antaŭe mi estis tia sama kiel ci – forta kaj memfida… Tamen mi estis mortigita de iu praa bestaĉo… Mi ne povas forlasi tiun ĉi ejon… Ne antaŭ ol mi venĝos min… Ekzekutu la _krabegon,_ kiu senvivigis min…\n\nĜi estas misnature maljuna… Posedante gigantan unuoblan pinĉilon kaj densan ŝirmon… _Gardu cin kontraŭ ĝia pinĉilo, ci devas surprizi la krabegon aŭ ĝi ŝirmos sin…_
actors.mobs.npcs.ghost.crab_2=Bonvolu… Helpu min… Ekzekutu la krustulon…\n\n_Ĝi ĉiam ŝimos sin… Kiam ĝi rigardos cin…_
actors.mobs.npcs.ghost.find_me=Dankon al ci… trovu min…
actors.mobs.npcs.ghost.desc=La fantomino estas preskaŭ nevidebla. Ŝi aspektas kiel senforma punkto de lumeto kun ĉagrenplena vizaĝo.

actors.mobs.npcs.imp.name=ambicia koboldo
actors.mobs.npcs.imp.intro=Ĉu vi estas aventuristo? Mi ŝategas aventuristojn! Oni ĉiam povas baziĝi sur ili se io devas esti mortigita, ĉu ne? Sendube por rekompenco ;)
actors.mobs.npcs.imp.golems_1=Mi bezonas por ke _golemoj_ estu forigitaj. Vi komprenas, mi planas fondi komercon tie ĉi, sed tiuj stultaj golemoj malhelpas komercon! Estas senespere negoci kun vagantaj pecegoj de granito, ili iru diablen! Nu, bonvolu mortigi… estu _4 el ili_ kaj la premio estos via.
actors.mobs.npcs.imp.monks_1=Mi bezonas por ke _monaĥoj_ estu forigitaj. Vi komprenas, mi planas fondi komercon tie ĉi, sed tiuj fanatikuloj aĉetos nenion kaj ĉagrenegos aliajn klientojn. Nu, bonvolu mortigi… estu _5 el ili_ kaj la premio estos via.
actors.mobs.npcs.imp.golems_2=Kiel via ĉasado kontraŭ golemoj progresas? Ne forgesu pri kolekti tiuj ĵetonoj.
actors.mobs.npcs.imp.monks_2=Ho, vi plue vivas! Mi fidas, ke vi estas lerta pri kungfuo ;) Memoru pri kolekti tiujn ĵetonojn de monaĥoj.
actors.mobs.npcs.imp.cya=Ĝis la revido, %s!
actors.mobs.npcs.imp.hey=Sss, %s!
actors.mobs.npcs.imp.desc=Koboldoj estas demonetoj. Ili estas konataj nek pro sia forto nek pro sia sorĉpovo, tamen ili estas eĉ sagacaj kaj amikemaj. Multaj koboldoj preferas loĝi inter ne-demonoj.

actors.mobs.npcs.impshopkeeper.name=ambicia koboldo
actors.mobs.npcs.impshopkeeper.greetings=Saluton, %s!
actors.mobs.npcs.impshopkeeper.greetings_ascent=Ho %s, kion vi faras tie ĉi? Aĉetu rapide, mi devos forlasi tiun ĉi ejon!
actors.mobs.npcs.impshopkeeper.thief=Mi certis, ke mi povis fidi vin!
actors.mobs.npcs.impshopkeeper.buyback=Koboldo kun rideto redonas vian aĵon.
actors.mobs.npcs.impshopkeeper.desc=Tiu ĉi koboldo starigis malgrandan vendejon ĉe enirejo al la internaj ĉambroj. Estas plezure vidi amikan vizaĝon, tamen prezoj en lia vendejo certege ne estas amikaj.

actors.mobs.npcs.mirrorimage.name=spegula figuro
actors.mobs.npcs.mirrorimage.desc=Tiu ĉi iluzio estas kvazaŭ ekzakta kopio de vi, ĝi eĉ portas vian nunan armilon kaj defendaĵon.\n\nSpegulaj figuroj sekvos kaj atakos malamikojn per siaj kvazaŭarmiloj, kiuj funkcias same kiel via armilo, sed malpli forte vundas. Ili komenciĝas estante preskaŭ nevideblaj, sed devas iĝi pli videblaj por ataki.\n\nKvankam ili povas dece defendi sin, spegulaj figuroj estas sendaŭraj kaj malestiĝos post esti vunditaj.
actors.mobs.npcs.mirrorimage.discover_hint=Vi povas renkonti tian ulon uzante la specifan skribrulaĵon.

actors.mobs.npcs.npc.discover_hint=Vi povas renkonti tiun ulon en la specifa regiono de la labirinto.

actors.mobs.npcs.prismaticimage.name=prisma figuro
actors.mobs.npcs.prismaticimage.desc=Tiu ĉi briletanta iluzio estas preskaŭ ekzakta kopio de vi, ĝi eĉ portas vian nunan armilon kaj defendaĵon.\n\nPrismaj figuroj provos sekvi kaj altiri atenton de malamikoj kaj uzi sian defendon kaj sanon por protekti vin. Kvankam ili ne havas la saman defendan povon kiel spegulaj figuroj, ili estas pli daŭraj kaj profitas de via defendaĵo.\n\nKiam ili havos 0 da sanpoentoj, prismaj figuroj malaperos post kelkaj temperoj, sed oni plue povos sanigi ilin. Kiam neniuj malamikoj ĉeestas, prismaj figuroj malaperos kaj kuniĝos kun sia originalo.
actors.mobs.npcs.prismaticimage.discover_hint=Vi povas renkonti tian ulon uzante la specifan skribrulaĵon.

actors.mobs.npcs.ratking.name=Ratreĝo
actors.mobs.npcs.ratking.not_sleeping=Mi ne dormas!
actors.mobs.npcs.ratking.what_is_it=Kio estas tio? Mi ne havas tempon por tiu ĉi absurdo. Mia reĝlando ne regos per si mem!
actors.mobs.npcs.ratking.confused=Ve! Kie mia estas? Mia reĝlando bezonas min!
actors.mobs.npcs.ratking.crown_clothes=Vestiĝu! En tiu ĉi stato vi ne povas stariĝi antaŭ la reĝo!
actors.mobs.npcs.ratking.crown_desc=Ho, ĉu tiu ĉi krono estas por mi? Ĝi aspektas pli brile ol mia, do mi akceptas vian donacon!\n\nEfektive, mi pensas, ke mi povas rekompenci vin por tiu ĉi krono – per la grandioza povo, kiu taŭgas por la heroo kiel vi! Ĉu vi volas ĝin?
actors.mobs.npcs.ratking.crown_yes=Jes ja!
actors.mobs.npcs.ratking.crown_info=Diru al mi pli.
actors.mobs.npcs.ratking.crown_no=Ne, mi ne volas.
actors.mobs.npcs.ratking.crown_thankyou=Hura, dankon! Nun iru por la gloro de via reĝo!
actors.mobs.npcs.ratking.crown_fine=Bone. Post detala pririgardo mi ne volas tiun ĉi kronaĉon…
actors.mobs.npcs.ratking.crown_after=Ĉu via nova defendaĵo plaĉas al vi? Mi ne akceptas redonojn!
actors.mobs.npcs.ratking.desc_crown=Tiu ĉi rato estas ete pli alta ol norma kangureca rato. Ĝi portas kronon de la Reĝo de Gnomoj sur sia kapo.
actors.mobs.npcs.ratking.desc_birthday=Tiu ĉi rato estas ete pli alta ol norma kangureca rato. Anstataŭ kronon, ĝi portas sur sia kapo etan verdan festĉapelon. Bondezirojn al Ratreĝo!
actors.mobs.npcs.ratking.desc_winter=Tiu ĉi rato estas ete pli alta ol norma kangureca rato. Ĝi portas malgrandan festan ĉapelon anstataŭ sian kutiman kronon. Gajan Kristnaskon!
actors.mobs.npcs.ratking.desc=Tiu ĉi rato estas ete pli alta ol norma kangureca rato. Ĝi portas malgrandan kronon sur sia kapo.
actors.mobs.npcs.ratking.discover_hint=Vi povas renkonti ĝin je la fino de certa regiono de la labirinto.

actors.mobs.npcs.sheep.name=ŝafo
actors.mobs.npcs.sheep.baa!=Be-e-e!
actors.mobs.npcs.sheep.baa?=Be-e-e?
actors.mobs.npcs.sheep.baa.=Be-e-e.
actors.mobs.npcs.sheep.baa...=Be-e-e…
actors.mobs.npcs.sheep.def_verb=blokita
actors.mobs.npcs.sheep.desc=Tio ĉi estas magia ŝafo. Kio estas tiel magia pri ĝi? Vi ne povas mortigi ĝin. Ĝi staros tie ĉi ĝis ĝi magie malŝafiĝos ordinare maĉante ion kun vana rigardo.
actors.mobs.npcs.sheep.discover_hint=Vi povas renkonti tian beston interagante kun la specifa aĵo aŭ kaptilo.

actors.mobs.npcs.shopkeeper.name=komercisto
actors.mobs.npcs.shopkeeper.thief=Ŝtelanta ŝtelulo!
actors.mobs.npcs.shopkeeper.warn=Eĉ ne provu! Mi ne avertos vin ree.
actors.mobs.npcs.shopkeeper.flee=La vendisto forkuras!
actors.mobs.npcs.shopkeeper.sell=Vendi aĵon
actors.mobs.npcs.shopkeeper.talk=Paroli
actors.mobs.npcs.shopkeeper.buyback=Vendisto malkontente redonas vian aĵon.
actors.mobs.npcs.shopkeeper.talk_prison_intro=Mi havas ĉion, kion vi bezonas por sukcesa aventuro!
actors.mobs.npcs.shopkeeper.talk_prison_warrior=Ho, vi portas tre interesan sigelon, ili kutime estas en unu peco. Ĉu vi estas misfamigita heroo? Aliflanke tute ne interesas min tio, kion vi faris; nur via mono interesas min.
actors.mobs.npcs.shopkeeper.talk_prison_mage=He, mi probable vidis persekut-afiŝon kun iu simila al vi en la urbo. Ĉu vi la serĉata homo? Oho, ĉu vi estas senkulpa? Sendube senkulpa… Ne timu, mi havas pli gravajn aferojn farendajn ol raporti, tamen eble aĉetu ion por certigi min pri tio…
actors.mobs.npcs.shopkeeper.talk_prison_rogue=Ĉu la gildo de ŝtelistoj sendis vin por sekurigi la zonon? Aŭ eble vi nur butikumas? Ne, se vi estas ĉi tie, bonvolu mortigi kelkajn monstrojn. Tamen ne esperu rabaton, mi pagas multon al viaj kamaradoj por protekto kaj mi ne sentas min sekura tie ĉi.
actors.mobs.npcs.shopkeeper.talk_prison_huntress=Ho fraŭlino, vi aspektas ne esti en via elemento. Mallarĝaj koridoroj de la labirinto ne estas tiel spacoplenaj kiel grandaj ĉambroj aŭ arbaroj apud la urbo, ĉu ne? Ne foriru, mi ĉesos enuigi vin, ĉu vi volas aĉeti ion?
actors.mobs.npcs.shopkeeper.talk_prison_duelist=Ho, vojaĝanta heroino! Bondeziron, se vi provas savi alian urbon, tamen minacoj tie ĉi estas pli seriozaj ol bandoj da rabistoj. Mi certas, ke vi helpos al vi pli bone ol ĉiu alia heroo, tamen bonvolu ne morti tuj post eliri mian vendejon.
actors.mobs.npcs.shopkeeper.talk_prison_cleric=Bonan tagon al via moŝto, aŭ eble al via beata moŝto? Nu, tio ne gravas, tiu ĉi loko ne estas por vi, multaj homoj funebrus pro via morto. Certe vi havas iom da mono, kial ne aĉeti ion por preventi tion?
actors.mobs.npcs.shopkeeper.talk_caves=Mono elspezita, vivo plilongigita.\n\nSe vi jam estas tie ĉi, bonvolu saluti la trolon forĝiston en mia nomo. Rememoru al tiu azeno, ke li ŝuldas al mi monon pro martelo, kiun mi vendis al li antaŭsemajne!
actors.mobs.npcs.shopkeeper.talk_city=Miaj varoj estas poliso vivasekura tie ĉi.\n\n…kaj bonvolu ne vagadi sencele tiu ĉi loko. Mi pasigis multegan tempon por konvinki lokanoj forlasi min. Ne altiru problemojn al mi!
actors.mobs.npcs.shopkeeper.talk_halls=He, mi havas specialajn prezojn por maldemonigistoj!\n\nKaj estu singarda tie ĉi! Demonoj en malsupraj keletaĝoj ne zorgas pri kiel brava vi estas. Vi ne revenos kaj ne elspezos pli da mono , se vi mortos… ;)\n\nĈu demonoj tie ĉi estas kiel mi? Tute ne. Mi estas malfortulo, ne emas batali kaj rezistis kontraŭ malliberigi mian spiriton. Demonoj sube estas pli potencaj estaĵoj sklavantaj al… ve… simple estu singarda tie sube.
actors.mobs.npcs.shopkeeper.talk_ascent=Mi ne scias, kion vi volas fari kun tiu ĉi amuleto kaj mi ne volas esti parto de tio. Aĉetu ion kaj foriru, ni ambaŭ devas forlasi tiun ĉi ejon!
actors.mobs.npcs.shopkeeper.desc=Tiu ĉi dikulo pli bone konvenus al komerca kvartalo de iu urbego ol al subteraĵa labirinto. Liaj prezoj klarigas kial li preferas komerci tie ĉi.

actors.mobs.npcs.wandmaker.name=maljuna vergisto
actors.mobs.npcs.wandmaker.intro_warrior=Ho, saluton! Renkonti bataliston el la nordo estas agrabla surprizo en tiel melankolia ejo! Vi sendube trapasis longan vojon… Se vi serĉas aventuron, mi eble havas taskon por vi.
actors.mobs.npcs.wandmaker.intro_rogue=Hu, vi konsternis min! Mi ne renkontis iun ajn banditon de tiu ĉi loko kiu ne frenezis, do vi sendube estas de la supraĵo! Se vi estas preta por helpi min iomete, mi eble havas taskon por vi.
actors.mobs.npcs.wandmaker.intro_mage=Ho, saluton %s! Mi aŭskultis pri iu disputo inter vi kaj la Magia Instituto? Ne gravas, mi neniam ja ŝatis tiujn senfervorulojn. Se vi volas, mi eble havas taskon por vi.
actors.mobs.npcs.wandmaker.intro_huntress=Ha, saluton junulino! Agrabla vizaĝo estas plezura surprizo tie ĉi subtere, ĉu ne? Efektive, mi certegas, ke mi vidis vian vizaĝeton antaŭe, tamen mi ne vetludus pri tio… Ne gravas, se vi estas tie ĉi por aventuro, mi eble havas taskon por vi.
actors.mobs.npcs.wandmaker.intro_duelist=Saluton fraŭlino! Kia agrabla surprizo renkonti heroinon en tiel melankolia ejo! Se vi estas preta por helpi al maljunulo, mi eblas havas mision por vi.
actors.mobs.npcs.wandmaker.intro_cleric=Ho, bonan tagon al via beata moŝto! Kia agrabla surprizo renkonti klerikon en tiel melankolia ejo! Mi ne ŝatas trudiĝi, sed eble mia havas taskon por via moŝto.
actors.mobs.npcs.wandmaker.intro_1=\n\nMi alvenis tien ĉi por trovi maloftan konsistaĵon por mia vergo, sed mi perdiĝis kaj mia magia ŝirmilo malfortiĝas. Mi devos foriri baldaŭ, sed mi ne povas foriri sen tio, pro kio mi alvenis.
actors.mobs.npcs.wandmaker.intro_dust=Mi serĉas ian _pulvoron kadavran._ Ĝi estas nekutima speco de manĝaĵo el malbenitaj ostoj kaj ĝi kutime aperas en lokoj kiel tiu ĉi. Povas esti ie proksime barikadita ĉambro, mi certas, ke tie troviĝas iom da kadavraĵo. Estu singarda, la malbeno ensorĉita en kadavraĵon estas eĉ potenca, _revenu al mi kiel eble plej rapide_ kaj mi senmalbenigos vin.
actors.mobs.npcs.wandmaker.intro_ember=Mi serĉas iun _freŝan ardaĵon_ el ĵusnaskita fajrido. Fajridoj kutime aperas dum neregata alvoka rito, do nur trovu kelkajn kandelojn kaj ritejon, kaj mi certas, ke iu fajrido aperos. Mi havas du konsilojn por vi: _ne lasu al fajrido ĉirkaŭmurigi vin_ kaj _prenu ajnan frostigan aĵon_. Ĵusnaskitaj fajridoj estas sufiĉe potencaj kaj ĥaosaj, sed ili ne povas rezisti malvarmon.
actors.mobs.npcs.wandmaker.intro_berry=La maljuna ĉefgardisto de tiu ĉi malliberejo prizorgis _vegetaĵon de putrobero,_ kaj mi alvenis tien ĉi por unu el ĝiaj semoj. La kreskaĵo probable sovaĝiĝis tra tempo, do fari ĝin elsemi bezonos scipovon. La gardista ĝardeno devos esti ie ĉi tie. Provu _esti fore de ĝiaj batantaj branĉoj,_ se vi ne volas dismembriĝi. Uzo de fajro ŝajnigas esti efika, sed ne faru tion, ĉar vi forbrulos la planton kaj detruos ĉiujn ĝiajn semojn.
actors.mobs.npcs.wandmaker.intro_2=\n\nSe vi akiros ĝin por mi, mi ĝoje pagos al vi per unu el miaj zorgeme faritaj vergoj! Mi prenis du kun mi, do vi povos elekti preferotan.
actors.mobs.npcs.wandmaker.reminder_dust=Ĉu vi havis sukceson trovi kadavraĵon, %s? Rigardu ĉirkaŭen pri iuj barikadoj.
actors.mobs.npcs.wandmaker.reminder_ember=Ĉu vi havis sukceson trovi tiujn ardaĵojn, %s? Vi devos trovi kvar kandelojn kaj la ritan lokon.
actors.mobs.npcs.wandmaker.reminder_berry=Ĉu vi havis sukceson trovi la semon de putrobero, %s? Rigardu ĉirkaŭen pri kreskaĵplena ĉambro.
actors.mobs.npcs.wandmaker.def_verb=blokita
actors.mobs.npcs.wandmaker.desc=Tiu ĉi maljuna kaj plue sana sinjoro surportas ete ĝenan vestaĵon. Li estas protektata per magia ŝirmilo.



###mobs
actors.mobs.acidic.name=acidoskorpio
actors.mobs.acidic.desc=Tiu ĉi giganta kvazaŭ-aranea demona bestaĉo ĉiel evitas proksiman batalon kaj perferas pafi per dentrandaj pikiloj je egaj distancoj. Tiu ĉi aspektas gutigi acidmordan ĥemiaĵon.

actors.mobs.albino.name=rato albina
actors.mobs.albino.desc=Ĝi estas nekutima dentobreĉa speco de kangureca rato kun blankegaj haregoj.
actors.mobs.albino.discover_hint=Vi povas malofte renkonti tian bestaĉon en la specifa regiono de la labirinto.

actors.mobs.armoredstatue.name=armita statuo
actors.mobs.armoredstatue.desc=Vi pensus, ke ĝi estas alia malviva statuo de la labirinto, sed ĝiaj ruĝaj briletaj okuloj malkaŝas ĝin.\n\nĜi ŝajnas esti en tre deca stato pro la portata armaĵo. Estos tre malfacile mortigi ĝin.
actors.mobs.armoredstatue.desc_arm_wep=Malgraŭ ke la statuo mem estas farita el ŝtono, la _%1$s_ kaj _%2$s_ tenataj de ĝi aspektas reale.

actors.mobs.bandit.name=freneza bandito
actors.mobs.bandit.desc=Elita ŝtelisto, distingebla danke al lia  pli precioza purpura robo. Malgraŭ esti pli lertaj, ili estas same sencerbaj kiel normaj ŝtelistoj.\n\nAldone al priŝteli vin, frenezaj banditoj pormomente blindumos, kripligos kaj venenos vin! Tamen estas granda ŝanco, ke ili portas ion pli preciozan ol normaj ŝtelistoj portas.

actors.mobs.bat.name=vampira vesperto
actors.mobs.bat.desc=Tiuj lertegaj kaj necedemaj loĝantoj de kavernoj estas pli danĝeraj ol ili aspektas. Ili replenigas sian sanon je ĉiu sukcesa frapo, ebligante al ili venki signife pli grandajn kontraŭulojn.

actors.mobs.bee.name=orkolora abelo
actors.mobs.bee.desc_honey=Malgraŭ iliaj malgrandecoj, orkoloraj abeloj kutimas protekti siajn domojn fervore. Tiu ĉi estas trankviligita kaj ŝajnas sekvi vin.
actors.mobs.bee.desc=Malgraŭ ĝia malgrandeco, orkoloraj abeloj kutimas protekti siajn domojn fervore. Tiu ĉi estas kolerega, estus pli bone foriĝi de ĝi.
actors.mobs.bee.discover_hint=Vi povas renkonti tian beston interagante kun la specifa aĵo.

actors.mobs.brute.name=bruta gnolo
actors.mobs.brute.enraged=kolera
actors.mobs.brute.def_verb=blokita
actors.mobs.brute.desc=Brutaj gnoloj estas la plej grandaj, fortaj kaj firmaj de ĉiuj gnoloj. Kiam ili estas preskaŭmorte vunditaj, ili “berserkas” kaj povas serioze vundi siajn malamikojn.
actors.mobs.brute$bruterage.name=kolero de bruta gnolo
actors.mobs.brute$bruterage.desc=Tiu ĉi bruta gnolo estas preskaŭ morta, tamen volas morti kun vi!\n\nTiu ĉi gnolo mortos kiam lia ŝirmo malaperos, aŭ pro tempo aŭ pro vundoj. Tamen intertempe lia vundpovo signife pliiĝis, do estu singarda!\n\nPlia ŝirmo: %d.

actors.mobs.causticslime.name=acidmorda ŝmiraĵo
actors.mobs.causticslime.desc=Tiu ĉi ŝmiraĵo aspektas esti kovrita per malluma energio, kiu emanas de malsupre. Ĝi perdis sian kutiman verdan koloron kaj gutas el ĝi acidmorda ĥemiaĵo.
actors.mobs.causticslime.discover_hint=Vi povas malofte renkonti tian bestaĉon en la specifa regiono de la labirinto.

actors.mobs.crab.name=kloakara krabo
actors.mobs.crab.desc=Tiuj egaj kraboj estas je supro de la kloakara nutroĉeno. Ili estas rapidegaj kaj ĝiaj densaj krustoj povas rezisti al fortaj batoj.

actors.mobs.crystalguardian.name=kristala gardisto
actors.mobs.crystalguardian.def_verb=blokita
actors.mobs.crystalguardian.desc=Tiuj ĉi grandaj kristalaj gardistoj similas statuojn, escepte de iliaj helaj brilaj okuloj. La hardita kristalo el kiu ili estas skulptitaj iĝas ilin tre malrapidaj kaj firmaj, do _estas konsilinde lasi ilin dormi en siaj kristalaj nestoj kiel eble plej longe._\n\nIlia grando kaŭzas ilin moviĝi tre malrapide en nefermitaj spacoj. La gardistoj estas tiel firmaj, ke ili estas nemortigeblaj. Oni povas ilin nur venki kaj provizore senmovigi, tamen post kelkaj temperoj la gardistoj removiĝos kaj reatakos.
actors.mobs.crystalguardian.discover_hint=Vi povas renkonti tian kontraŭulon dum la specifa misio.

actors.mobs.crystalmimic.name=kristala imitulo
actors.mobs.crystalmimic.ate=Via %s estas manĝita de la imitulo!
actors.mobs.crystalmimic.escaped=La kristala imitulo eskapis!
actors.mobs.crystalmimic.desc=Imituloj estas magiaj kreaĵoj kiuj povas preni iun ajn formon. En la labirinto ili preskaŭ ĉiam elektas formon de trezora kofro, ĉar ili scias kiel altiri atenton de aventuristoj.\n\nKristalaj imituloj estas pli ruzaj ol iliaj normaj parencoj kaj evitas batalon preferante ŝteli valoraĵojn. Ili provos fuĝi post esti malkovritaj kaj povas transloki atakantajn malamikojn.

actors.mobs.crystalspire.name=kristala spajro
actors.mobs.crystalspire.warning=La kristalo vibras pro via frapo. Se vi daŭrigos frapi ĝin, vi altiros ĉies atenton al vi…
actors.mobs.crystalspire.alert=La vibrado plifortiĝas sonas tra la tuta kaverno!
actors.mobs.crystalspire.desc=Tiu ĉi grandioza turpinto de malmolega kristalo probable estas la fonto de ĉiuj strangaj kristalaj estaĵoj en tiu ĉi kaverno. Viaj ordinaraj armiloj estas senefikaj kontraŭ ĝi, do vi uzu la ricevitan pioĉon por detrui ĝin.\n\n_Certiĝu por esti sufiĉe preparita antaŭ ol komenci la detruadon._ Minado de tia granda kristalo okupos iom da tempo dum kiu probable iu ĝenos vin. La turpinto mem povas posedi ian rimedon por defendi sin. _Povos esti, ke vi povos uzi atakojn de la spajro kontraŭ ĝiaj servantoj._
actors.mobs.crystalspire.discover_hint=Vi povas renkonti tiun kontraŭulon dum la specifa misio.

actors.mobs.crystalwisp.name=kristala floko
actors.mobs.crystalwisp.beam_kill=La lumfasko mortigis vin…
actors.mobs.crystalwisp.desc=Liliputa furioza ŝvebanta floko de malmoligita kristalo, ĉirkaŭata de hela lumo. Kvankam kristalaj flokoj ne estas fortaj, ili povas pripafi vin per detruantaj lumfaskoj kiam vi malkovros vin.\n\nKristalaj flokoj estas sufiĉe etaj por moviĝi trans diversaj fendoj en kristaloj, tamen ne povas pafi trans ili.
actors.mobs.crystalwisp.discover_hint=Vi povas renkonti tian kontraŭulon dum la specifa misio.

actors.mobs.demonspawner.name=demon-alvokisto
actors.mobs.demonspawner.on_death=La demona energio tie ĉi malpliiĝis post morto de la demon-alvokisto.
actors.mobs.demonspawner.desc=Tiu ĉi miksaĵo de karnoj de gnomoj respondumas pri krei demonojn murdistonj el korpopartoj de gnomoj mortigintaj en tiu ĉi regiono. Demonoj ne hezitas pri uzi ĉiun eblan rimedon kontraŭ iliaj malamikoj.\n\nKvankam ili aspektas terure, demon-alvokistoj ne povas moviĝi aŭ senpere defendi sin. Ilia distingebla maso igas, ke ili ne povas esti rapide mortigitaj, kaj ili alvokas demonojn murdistojn pli rapide kiam minacataj.\n\n_Demon-alvokistoj ŝajnas esti kunligitaj al iu centra fonto de demona energio. Verŝajne per mortigi ilin, tiu fonto malfortiĝos._

actors.mobs.dm100.name=DM-100
actors.mobs.dm100.zap_kill=La fulmopafaĵo mortigis vin…
actors.mobs.dm100.desc=DM-100 estas la pratipa versio de gnoma “defenda maŝino”, kiu estis projektita por defendi ministoj en la kavernoj sub tiu ĉi malliberejo. Ĝia elektroŝokilo estis tamen tro malforta, do ĝi estis donacita al la homa malliberejo supere. Neuzataj dum jaroj kaj definitive movitaj al la malliberejo, kie ĝia ĉefgardisto opiniis ĝin tro kruela por uzi. Tamen kiam malliberuloj iĝis pli kaj pli malobeaj, ĝia uzo estiĝis necesa.

actors.mobs.dm200.name=DM-200
actors.mobs.dm200.vent=DM-200 elspiras fluon de toksa gaso!
actors.mobs.dm200.desc=DM-200 estas la dua versio de gnoma “defenda maŝino”, kiu estis projektita por defendi ministoj en la kavernoj sube kaj en la metropolo. Ĝi estas signife pli masiva ol la antaŭa modelo kaj povas ataki per detruantaj hidraŭlikaj pugnoj.\n\nĜia pliigita grandeco ankaŭ estas ĝia malforteco, ĉar ĝi ne povas lokiĝi en mallarĝaj tuneloj kaj pordoj de la labirinto. Tiu manko de movebleco estas kompensita per ebleco de DM-200 por elŝpruci toksajn gasojn al malamikoj malproksimaj kaj neatingeblaj.

actors.mobs.dm201.name=DM-201
actors.mobs.dm201.vent=DM-201 ĵetis korod-gasan grenadon!
actors.mobs.dm201.desc=Gnomoj eksperimentis konstrui eĉ plene nemoveblan version de DM-200. La DM-201 estas modernigita roboto DM-200, kiu funkcias kvazaŭ gardoturo, sed kompense pri manko de moveblo, ĝi estas signife pli fortika kaj atakpova.\n\nKvankam DM-201 ne posedas meĥanismon por elspiri toksan gason, ili estas ekipitaj per grenadoj kun koroda gaso! Tamen DM-201 singarde procedas kun tiuj grandadoj kaj ĵetos ilin nur kiam estos atakitaj de malproksime.

actors.mobs.dm300.name=DM-300
actors.mobs.dm300.notice=NERAJTIGITA ULARO TROVITA!
actors.mobs.dm300.shield=DM-300 ĉerpas energion el eksteraj kabloj por ŝirmi sin!
actors.mobs.dm300.charging=RICEVANTE DIFEKTON! AKTIVIGANTE ELEKTROFOSTON!
actors.mobs.dm300.charging_hint=DM-300 estas nevundebla dum esti elektrizata per elektrofosto!
actors.mobs.dm300.supercharged=DETRUI! DETRUI! DETRUI!
actors.mobs.dm300.charge_lost=ELEKTROFOSTO DETRUITA! ŜALTANTE AL LOKA ENERGIFONTO!
actors.mobs.dm300.pylons_destroyed=AVERTO! TROVITA NESTABILECO DE ELEKTROENERIA RETO!
actors.mobs.dm300.rankings_desc=Dismembrigita de DM-300
actors.mobs.dm300.def_verb=blokita
actors.mobs.dm300.defeated=KRITIKA DIFEKTO! MALAKTIVIĜO…
actors.mobs.dm300.desc=DM-300 estas la plej granda kaj la plej potenca “defenda maŝino”, kiun gnomoj kiam ajn konstruis. Tia inĝenieraĵo estas tre malfacila por konstrui, do la gnomoj nur muntis kelkajn por gardi la enirejojn al ilia subtera metropolo.\n\nĜi estas ekipita per ellastuboj, kiuj elspiras toksajn brulgasojn kaj per firma borilo, kiun ĝi povas uzi kaj por ataki kaj por disrompi teron. DM-300 ankaŭ povas konekti al elektroenergia reto por pliigi siajn kapablojn.
actors.mobs.dm300.desc_supercharged=DM-300 aktuale estas plene ŝargita per elektra energio. En tiu ĉi kondiĉo ĝi estas nedifektebla kaj moviĝas je duobla rapido! Krom tio, ĝia borilo turniĝas sufiĉe rapide por _tuneli trans firma roko,_ tamen la roboto moviĝas signife malpli rapide dum fari tion.\n\nEstas sensence senpere ataki DM-300 kiam ĝi estas superŝargita, sed rimarku, ke _io ĉi tie provizas ĝin per tia energio,_ do provu detrui tion por malfortigi la maŝinon.

actors.mobs.dwarfking.name=Reĝo de Gnomoj
actors.mobs.dwarfking.notice=Kiel vi kuraĝas! Vi ne povas imagi pri kio vi enmiksas!
actors.mobs.dwarfking.lifelink_1=Ho sklavo, mi postulas vian vivesencon!
actors.mobs.dwarfking.lifelink_2=Ho sklavo, sangu por mi!
actors.mobs.dwarfking.teleport_1=Ho sklavo, detruu ilin!
actors.mobs.dwarfking.teleport_2=Ho sklavo, okupu ilin!
actors.mobs.dwarfking.wave_1=Sufiĉe! Miaj sklavoj vekiĝu!
actors.mobs.dwarfking.wave_2=Ho ve! Sangu por via reĝo!
actors.mobs.dwarfking.wave_3=MORTIGU ILIN NUN!
actors.mobs.dwarfking.enraged=Vi ne povas mortigi min, %s. Mi estas nemortigebla!
actors.mobs.dwarfking.losing=Ne! Vi ne povas iri antaŭen… Vi ne konscias pri kio troviĝas suben…
actors.mobs.dwarfking.defeated=Ni ĉiuj pereos pro vi…
actors.mobs.dwarfking.rankings_desc=Kliniĝis antaŭ la Reĝo de Gnomoj
actors.mobs.dwarfking.desc=Antaŭ multaj jaroj iu el la plej eminentaj magiistoj de la reĝa kortego malkaŝis sekretojn, kiuj donis al li grandegan regon super vivo kaj morto. Post nelonga tempo li ekigis uzi tiun povon por obeigi kaj korupti siajn kolegojn, sian reĝon kaj finfine ĉiun civitanon de la metropolo. Nun li estas la Reĝo kaj la estro de taĉmento de nemortaj soldatoj.\n\nLa Reĝo de Gnomoj estas agresema kontraŭulo, kiu provas ĉirkaŭi siajn malamikojn per bando da nemortaj servistoj.
actors.mobs.dwarfking$dkghoul.rankings_desc=Kliniĝis antaŭ la Reĝo de Gnomoj
actors.mobs.dwarfking$dkmonk.rankings_desc=Kliniĝis antaŭ la Reĝo de Gnomoj
actors.mobs.dwarfking$dkwarlock.rankings_desc=Kliniĝis antaŭ la Reĝo de Gnomoj
actors.mobs.dwarfking$dkgolem.rankings_desc=Kliniĝis antaŭ la Reĝo de Gnomoj

actors.mobs.ebonymimic.name=mahagona imitulo
actors.mobs.ebonymimic.reveal=Tie kaŝiĝis imitulo!
actors.mobs.ebonymimic.hidden_name=suspekta silueto
actors.mobs.ebonymimic.hidden_desc=Ŝajnas, ke io estas tie ĉi, sed ĝi estas preskaŭ plene travidebla.
actors.mobs.ebonymimic.desc=Imituloj estas magiaj kreaĵoj, kiuj povas preni iun ajn formon. En la labirinto ili preskaŭ ĉiam elektas formon de trezora kofro, ĉar ili scias kiel altiri atenton de aventuristoj.\n\nMahagonaj imituloj estas kaŝema specio de imiutuloj kun ebleco fari sin preskaŭ tute nevidebla. Ili embuskas ĉe objektoj, kun kiuj aventuristoj emas interagi kaj gardas siajn trezorojn. Ili ne estas pli fortaj ol normaj imituloj, sed ilia surpriza mordo povas esti detruanta.
actors.mobs.ebonymimic.discover_hint=Vi povas renkonti tian kontraŭulon posedante la specifan brilaĵon.

actors.mobs.elemental$fireelemental.name=fajrido
actors.mobs.elemental$fireelemental.desc=Elementidoj (fajridoj, frostidoj, elektridoj, ĥaosidoj) naskiĝas, kiam potenca okulta magio ne estas sufiĉe regata. Elementidoj preskaŭ ne havas inteligenton kaj kutime rilatas al specifa speco de magio.\n\nFajridoj vundas per fajra magio. Ili povas ekbruligi viktimon per siaj frapoj kaj malofte pafas per fajraj kugloj.
actors.mobs.elemental$newbornfireelemental.name=ĵusnaskita fajrido
actors.mobs.elemental$newbornfireelemental.charging=La fajrido ŝargiĝas!
actors.mobs.elemental$newbornfireelemental.desc=Elementidoj (fajridoj, frostidoj, elektridoj, ĥaosidoj) naskiĝas, kiam potenca okulta magio ne estas sufiĉe regata. Elementidoj preskaŭ ne havas inteligenton kaj kutime rilatas al specifa speco de magio.\n\nKvankam esti alvokita antaŭ nelonga tempo, tiu ĉi fajrido estas sufiĉe danĝera!
actors.mobs.elemental$newbornfireelemental.desc_boss=Pro la ĥaosa naturo de ĝia alvoko, tiu ĉi fajrido povas disvastigi flamojn nur per malprecizaj pafoj post unu tempero da ŝargado.
actors.mobs.elemental$newbornfireelemental.desc_ally=Pro esti alvokita per sorĉkristalo, tiu ĉi fajrido povas iome regi sian ellason de flamoj. Ĝi ne povas fore ataki kaj nur povas ekbruligi malamikojn dum proksimaj atakoj.
actors.mobs.elemental$newbornfireelemental.discover_hint=Vi povas renkonti tiun kontraŭulon dum la specifa misio.
actors.mobs.elemental$frostelemental.name=frostido
actors.mobs.elemental$frostelemental.desc=Elementidoj (fajridoj, frostidoj, elektridoj, ĥaosidoj) naskiĝas, kiam potenca okulta magio ne estas sufiĉe regata. Elementidoj preskaŭ ne havas inteligenton kaj kutime rilatas al specifa speco de magio.\n\nFrostidoj malplifortigas malamikojn uzante malvarmigan magion. Ili povas malvarmigi viktimon per siaj frapoj kaj iam per distancaj atakoj. Ilia magio estas la plej efika en akvo.
actors.mobs.elemental$shockelemental.name=elektrido
actors.mobs.elemental$shockelemental.desc=Elementidoj (fajridoj, frostidoj, elektridoj, ĥaosidoj) naskiĝas, kiam potenca okulta magio ne estas sufiĉe regata. Elementidoj preskaŭ ne havas inteligenton kaj kutime rilatas al specifa speco de magio.\n\nElektridoj estas maloftaj elementidoj, kiuj difektas siajn malamikojn per elektro kaj ekbriloj de lumo. Dum frapi ili povas eligi elektran arkon al siaj viktimoj kaj pli forte vundas, kiam la viktimo troviĝas en akvo. Ili ankaŭ povas ellasi ekbrulon de lumo por provizore blindumi la viktimon.
actors.mobs.elemental$chaoselemental.name=ĥaosido
actors.mobs.elemental$chaoselemental.desc=Elementidoj (fajridoj, frostidoj, elektridoj, ĥaosidoj) naskiĝas, kiam potenca okulta magio ne estas sufiĉe regata. Elementidoj preskaŭ ne havas inteligenton kaj kutime rilatas al specifa speco de magio.\n\nĤaosidoj estas tre maloftaj elementidoj, kiuj ne estas rilataj al specifa elemento. Ili povas ellasi ian neantaŭvideblan specon de magio dum ataki.

actors.mobs.eye.name=fiokulo
actors.mobs.eye.deathgaze_kill=La mortiga rigardo senvivigis vin…
actors.mobs.eye.desc=Fiokuloj estas aerportiĝantaj globoj enhavantaj demonan energion. Malgraŭ ke ili povas ataki permane, ilia efektiva povo rezultas el sia magio.\n\nPost kiam fiokulo ŝargos energion, ĝi ellasos detruan faskon de energio nomatan kiel la _mortiga rigardo._ Io ajn en vidatingo de fiokulo estos serioze vundita, saĝaj aventuristoj forkuros por ŝirmiĝi.

actors.mobs.fetidrat.name=haladza rataĉo
actors.mobs.fetidrat.desc=Io estas cetere malĝusta kun tiu ĉi rato. Ĝiaj grasaj nigraj haregoj kaj putranta felo malsamegas ol ties de sanaj ratoj, kiujn vi renkontis antaŭe. Ĝiaj blankverdaj okuloj igas ĝin ege minaca.\n\nLa rataĉo portas nubeton de terura odoraĉo kun si, ĝi estas monstre fortega ĉe proksimo.\n\nMalhela acidaĵo gutetas el buŝego de besto, ĝi mordas tra la plankon sed povas esti neŭtrigita per akvo.
actors.mobs.fetidrat.discover_hint=Vi povas renkonti tiun bestaĉon dum la specifa misio.

actors.mobs.fungalcore.name=funga kerno
actors.mobs.fungalcore.desc=Tiu ĉi grandioza fungo certe estas la fonto de ĉiu funga aktiveco en la kaverno.

actors.mobs.fungalsentry.name=funga gardanto
actors.mobs.fungalsentry.desc=Tiu ĉi nekutime alta fungo servas kiel defendanto por la pli ampleksa funga reto vivanta en tiu ĉi kaverno.\n\nĜi estas senmova, tamen povas elpafi precizajn blovojn de veneno al ĉiu entrudulo ene ĝia vidatingo. Kvankam vundpovo de la menciitaj blovoj estas bagatela, _ili tre rapide povas akumuli vivriskan kvanton da veneno._ Kvankam la gardisto povas esti mortigita, estas konsilinde eviti ĝin.

actors.mobs.fungalspinner.name=fungigita ŝpinisto
actors.mobs.fungalspinner.desc=Tiu ĉi kaverna ŝpinisto ŝajnas esti regata de parazita fungo. La parazito ankaŭ ŝanĝis ĝiajn kapablojn anstataŭigante ĝiajn fibrajn kaj venenajn glandojn per kreskantaj fungoj.\n\nAnstataŭ ĵeti aranean reton, ĝi priĵetos vin per fungaj kreskaĵoj kaj povas enradikigi vin. Kvankam ĝi ne povas veneni, la fungigita ŝpinisto akiros signifan vund-reziston estante apude al fungoj.

actors.mobs.ghoul.name=gnoma algulo
actors.mobs.ghoul.desc=Kiam societo de gnomoj iom post iom komencis degeneri kaj la tiama Reĝo de Gnomoj akiris absolutan regon, tiuj – kiuj estis tro malfortaj aŭ kiuj rezistis al li – ne estis bone traktitaj. Kiam la Reĝo iĝis pli lerta pri malluma magio, li instigis tiujn gnomojn al obei lian volon, kaj nun ili estas soldatoj servantaj en lia privata armeo.\n\nAlguloj (arabaj demonoj) ne estas precipe fortaj per si mem, tamen ili ĉiam moviĝas en bandoj kiuj ne estas tiel facilaj por venki. _Kiam gnoma algulo estas venkita, post kelkaj temperoj li reviviĝos se iu alia algulo troviĝos proksime._

actors.mobs.gnoll.name=skolta gnolo
actors.mobs.gnoll.desc=Gnoloj estas hienaj kvazaŭ-homaj bestoj. Ili loĝas en kloakaro kaj subteraĵo, hazarde riskas surprizataki la supraĵon. Skoltaj gnoloj estas ordinaraj anoj de gnolaroj, ili estas nek tiel fortaj kiel brutuloj nek tiel inteligentaj kiel ŝamanoj.

actors.mobs.gnollexile.name=gnolo ekzilito
actors.mobs.gnollexile.desc=Tiu ĉi grizhara gnolo havas grandan markon sur sia brako, kiu signifas, ke li estis forpelito. Gnoloj kutime estas forpelitaj de sia socio pro ignori ordonojn aŭ rompi leĝojn. Ekzilitoj devas esti fortaj kaj ruzaj por travivi, tiu ĉi ŝajnas lerti uzi la tenatan pikstangon.
actors.mobs.gnollexile.desc_passive=_La gnolo ekzilito ne moviĝas por ataki._ Li verŝajne ne estas tiel agresema kiel aliaj gnoloj tie ĉi kaj probable pensas, ke ne indas ataki vin. Vi povas simple preterlasi lin, tamen lia dorsosako povas esti plena je valoraĵoj…
actors.mobs.gnollexile.desc_aggro=_La gnolo ekzilito rigardas vin furiozplene._ Ŝajnas, ke io igis lin ataki vin. Atentu tian grandiozan pikstangon!
actors.mobs.gnollexile.seen_passive=La gnolo suspektinde observas vin tenante pikstangon, sed ne moviĝas por ataki vin.
actors.mobs.gnollexile.seen_aggro=La gnolo moviĝas al vi tenante pikstangon!

actors.mobs.gnollgeomancer.name=gnolo geomanciisto
actors.mobs.gnollgeomancer.warning=La gnolo geomanciisto komencas vekiĝi. Certiĝu, ke vi estas preta antaŭ ol pluigi!
actors.mobs.gnollgeomancer.alert=La geomanciisto vekiĝis! La tuta kaverno ŝajnas svingiĝi kiam li forsaltas de vi kun laŭta ridaĉo!
actors.mobs.gnollgeomancer.rock_kill=La fluganta ŝtonego mortigis vin…
actors.mobs.gnollgeomancer.rockfall_kill=La falantaj ŝtonegoj mortigis vin…
actors.mobs.gnollgeomancer.desc=Tiu ĉi impone alta supera gnolo certege estas la fonto de magio responduma pri movado de ŝtonegoj tie ĉi kaj la ĉefa rolulo de ĉiu gnola aktiveco. Male al ĉi-tieaj gnoloj sapeistoj, la geomanciisto estas lerta pri sia magio kaj ne vundiĝas pro ĵetitaj aŭ falantaj ŝtonegoj. Tamen li ne povas batali permane.
actors.mobs.gnollgeomancer.desc_armor=La geomanciisto estas nuntempe kovrita per ŝtona defendaĵo. _Vi devas alproksimiĝi al li kaj detrui la defendaĵon per pioĉo antaŭ ol vi povos vundi la geomanciiston._
actors.mobs.gnollgeomancer.desc_armor_sapper=_Proksima gnolo sapeisto tenas aparaton, kiu plipovigas la ŝtonan defendaĵon de geomanciisto. Via atako kontraŭ li estas nuntempe senefika!_
actors.mobs.gnollgeomancer.desc_sleeping=Tiu ĉi impone alta ŝamana gnolo estas kovrita per tavolo de ŝtonoj kaj aspektas preskaŭ kiel statuo. Pririgardante lin vi vidas, ke ŝtonoj magie moviĝas kune kun lia spiro. Li estas nedifektebla en la nuna stato kaj ĝuas sian ŝtonan dormeton.\n\nVi probable povas trarompi la ŝtonajn tavolojn per la pioĉo, sed _estu preparita por batalo antaŭ ol komenci fari tion._ La geomanciisto certege estas la fonto de magio responduma pri movado de ŝtonegoj tie ĉi kaj la ĉefa rolulo de ĉiu gnola aktiveco. _Estas konsilinde venki proksimajn gnolojn antaŭ ol komenci lukti la gnolon geomanciiston._
actors.mobs.gnollgeomancer.discover_hint=Vi povas renkonti tiun kontraŭulon dum la specifa misio.

actors.mobs.gnollguard.name=gnolo gardisto
actors.mobs.gnollguard.def_verb=blokita
actors.mobs.gnollguard.spear_warn=La gnolo serioze vundas vin per sia pikstango!
actors.mobs.gnollguard.desc=Granda kaj fortika gnolo tenanta pikstangon, ŝirmon, tamen neniun kaskon. La gardistoj verŝajne trejniĝas al brutaj gnoloj kaj nuntempe estas instigitaj por la helpi protekti la minejon kontraŭ invadantaj bestoj.\n\nLa gnolo gardisto estas sufiĉe forta por teni pikstangon unumane, sed ne povas uzi ĝin lerte. _Li bezonos iom da libera spaco por ataki je distanco kaj kaŭzos signife malpli doloran vundon, kiam vi alproksimiĝos al li._
actors.mobs.gnollguard.desc_armor=_Proksima gnolo sapeisto tenas aparaton, kiu liveras al tiu ĉi gardisto terecan kirason malpliigantan ricevatajn vundojn._
actors.mobs.gnollguard.discover_hint=Vi povas renkonti tian kontraŭulon dum la specifa misio.

actors.mobs.gnollsapper.name=gnolo sapeisto
actors.mobs.gnollsapper.desc=Malalta kaj malforta, sed inteligenta gnolo kun pala hararo kaj sako plena je diversaj eltrovaĵoj. Li probable asistas tie ĉi ĉe detektado kaj minado de ombra oro, kaj estas protektataj de proksimaj gnoloj gardistoj. Ili povas batali, tamen iliaj atakos estas tre malfortaj – same kiel atakoj de skoltaj gnoloj.\n\nAnstataŭ senpere enmiksimiĝi en batalo, sapeistoj preferas utiligi diversajn aparatojn, kiuj igas ŝtonegojn ataki iliajn malamikojn. Ili mem ne scipovas ter-movigantan magion, do ili senpripense uzas siajn aparatojn. _Probable estas multaj manieroj por alidirekti iliajn atakojn kontraŭ ilin aŭ gardistojn._
actors.mobs.gnollsapper.discover_hint=Vi povas renkonti tian kontraŭulon dum la specifa misio.

actors.mobs.gnolltrickster.name=trompema gnolo
actors.mobs.gnolltrickster.desc=Kurioze aspektanta kreaĵo, eĉ laŭ gnolaj normoj. Li ĝibiĝas kun fia rideto, balanciĝante kun la dorsosako ĉe sia ŝultro. Liaj okuloj estas larĝaj kun stranga miksaĵo el timo kaj ekscito.\n\nEstas plurnombra kolekto da fuŝe faritaj sagetoj en lia dorsosako, ili estas trempitaj en diversajn danĝerajn substancojn.
actors.mobs.gnolltrickster.discover_hint=Vi povas renkonti tiun kontraŭulon dum la specifa misio.

actors.mobs.goldenmimic.name=ora imitulo
actors.mobs.goldenmimic.desc=Imituloj estas magiaj kreaĵoj kiuj povas preni iun ajn formon. En la labirinto ili preskaŭ ĉiam elektas formon de trezora kofro, ĉar ili scias kiel altiri atenton de aventuristoj.\n\nOraj imituloj estas pli rezistaj imituloj, kiuj provas logi la plej fortajn aventuristojn. Ili enhavas pli valoran trezoron, sed ankaŭ estas pli fortaj ol kutimaj imituloj.

actors.mobs.golem.name=golemo
actors.mobs.golem.def_verb=blokita
actors.mobs.golem.desc=Golemoj rezultas el provo por korekti la antaŭajn difektojn en gnoma maŝinaro per la ĵus-akirita scio pri magio. Ili estas signife pli kompaktaj kaj efikaj kompare al DM-300 sed plue tre mortigaj.\n\nKvankam golemoj plue estas tro grandaj por lokiĝi en koridoroj, la gnomoj ekipis ilin per novaj magiaj kapabloj: golemoj povas teleportiĝi inter ĉambroj kaj teleporti malamikojn al si, kiam ili estas ekster atakatingo.

actors.mobs.goo.name=Ŝmiraĵego
actors.mobs.goo.notice=KLUK-KLUK!
actors.mobs.goo.defeated=kluk… kluk…
actors.mobs.goo.!!!=!!!
actors.mobs.goo.pumpup=Ŝmiraĵego pumpas sin mem!
actors.mobs.goo.enraged=kolera
actors.mobs.goo.gluuurp=KLUUUUK!
actors.mobs.goo.rankings_desc=Ensorbita de Ŝmiraĵego
actors.mobs.goo.desc=Oni ne scias multe pri Ŝmiraĵego. Povas esti, ke ĝi eĉ ne estas bestaĉo, sed kungluaĵo de diversaj substancaĉoj el la kloakaro kiuj iumaniere ekposedis elementan inteligenton. Iel aŭ alie, fia sorĉarto estas tio, kio permesis al Ŝmiraĵego ekzisti.\n\nĜia gelateneca esto igas ĝin ensorbi multe da malluma energio, vi estas konsternata nur pro esti proksime de ĝi. Se Ŝmiraĵego povas ataki per tiu ĉi fienergio, vi ne plivivos longe.

actors.mobs.greatcrab.name=krabego
actors.mobs.greatcrab.noticed=La krabego blokis la atakon per sia giganta pinĉilo.
actors.mobs.greatcrab.def_verb=blokita
actors.mobs.greatcrab.desc=Tiu ĉi krabo estas giganta eĉ komparante kun aliaj kloakaraj kraboj. Ĝia blua ŝirmo estas kovrata de krevaĵoj kaj grataĵoj, ĝi aspektas tre maljune. Ĝi paŝas malrapide, malfacile tenante sin en ekvilibro kun sia giganta pinĉilo.\n\nMalgraŭ tio, ke krabego posedas nur unu pinĉilon, tio estas rekompencata de ĝia grandeco. La krabego eligas la pinĉilon antaŭ ĉiu minaco, ŝirmante sin malantaŭ nepenetrebla krusto. Tamen la krabo ne povas ŝirmi sin kontraŭ atakojn, kiuj ĝi ne vidis kaj kontraŭ atakoj de pluraj direktoj samtempe.
actors.mobs.greatcrab.discover_hint=Vi povas renkonti tiun beston dum la specifa misio.

actors.mobs.guard.name=mallibereja gardisto
actors.mobs.guard.scorpion=Iru ĉi tien!
actors.mobs.guard.def_verb=blokita
actors.mobs.guard.desc=Eksaj zorgantoj de la malliberejo, tiuj gardistoj restadis ĝis ili ekestis ne diferencaj ol kaptitoj. Ili vagas sencele kiel zombioj kaj sensence patrolas el punĉambro al punĉambro kaj serĉas iun ajn, kiu ne estas surloke kiel vi!\n\nIli kunportas ĉenojn ĉe siaj zonoj, eble uzitaj por eltiri malliberulojn proksimen.

actors.mobs.hermitcrab.name=ermita krabo
actors.mobs.hermitcrab.def_verb=blokita
actors.mobs.hermitcrab.desc=Pro nekonata kialo tiu ĉi kloakara krabo portas supran parton de barelo sur sia kapo! La kroma pezo malplirapidigas ĝin al norma rapido, sed ankaŭ signife pliigas ĝian defendpovon. Vi misaŭdas ion klakantan ene la barelo…

actors.mobs.mimic.name=imitulo
actors.mobs.mimic.reveal=Tiu ĉi kofro estas imitulo!
actors.mobs.mimic.hidden_hint=Tiu ĉi kofro estas iel stranga, anomalia… Probable estus malprudente alpaŝi kaj malfermi ĝin.
actors.mobs.mimic.desc=Imituloj estas magiaj kreaĵoj kiuj povas preni iun ajn formon. En la labirinto ili preskaŭ ĉiam elektas formon de trezora kofro, ĉar ili scias kiel altiri atenton de aventuristoj.\n\nImituloj povas dolore mordi malamikojn, tamen ili kaŝas pli valorajn trezorojn ol kutimaj kofroj.
actors.mobs.mimic.discover_hint=Vi povas renkonti tian kontraŭulon ĉie en la labirinto.

actors.mobs.necromancer.name=nekromanciisto
actors.mobs.necromancer.desc=Tiuj ĉi profesiaj fimagiistoj amasiĝis en la malliberejo, ĉar tie ĉi estas la ideala loko por ekzerci sin en tia fia metio.\n\nNekromanciistoj alvokos kaj regos skeletojn por batali. Mortigu la nekromanciiston por forigi la alvokitajn skeletojn.
actors.mobs.necromancer$necroskeleton.name=skeleto de nekromanciisto
actors.mobs.necromancer$necroskeleton.desc=Tiu ĉi skeleto estis alvokita de nekromanciisto. Ĝi kondutas kiel kutima skeleto, tamen mortos kiam ĝia estra nekromanciisto estos venkita.

actors.mobs.mob.died=Vi aŭskultis, ke iu mortis ie tie.
actors.mobs.mob.rage=#$%^
actors.mobs.mob.rankings_desc=Murdita de %s
actors.mobs.mob.discover_hint=Vi povas renkonti tian kontraŭulon en la specifa regiono de la labirinto.

actors.mobs.monk.name=gnoma monaĥo
actors.mobs.monk.def_verb=blokita
actors.mobs.monk.parried=repuŝita
actors.mobs.monk.desc=Tiuj monaĥoj estas fanatikuloj, kiuj tute dediĉis sian vivon por protekti la reĝon de gnomoj. Ili estas tiel fidelaj, ke eĉ iliaj spiritoj apartenas al la reĝo kaj nun ili vagas en la metropolo de gnomoj kiel senpensaj zombioj.\n\nMonaĥoj nur baziĝas sur manbatalo kaj povas uzi siajn senarmaj pugnojn ambaŭ por defendi kaj por ataki. Kiam koncentriĝinta, monaĥo povas repuŝi la sekvan korpan atakon kontraŭ li, eĉ kiam ĝi estas garantiata. Monaĥoj akiras sinkoncentron pli rapide dum movi kaj malpli rapide dum senpera batalo.
actors.mobs.monk$focus.name=koncentro
actors.mobs.monk$focus.desc=Tiu ĉi monaĥo estas ideale koncentriĝinta pri la celo, kaj povas antaŭscii pri frapoj de la oponanto.\n\nDum sinkoncentro, la sekva korpa atako kontraŭ li estas garantiata por maltrafi, sendepende de okazo. Post tiu blokita atako, la monaĥo perdos sinkoncentron kaj li necesos regajni ĝin por bloki alian atakon. Monaĥoj gajnas sinkoncentron pli rapide dum moviĝi.

actors.mobs.phantompiranha.name=fantoma piranjo
actors.mobs.phantompiranha.teleport_away=La fantoma piranjo teleportiĝas for…
actors.mobs.phantompiranha.desc=Fantomaj piranjoj estas malofta specio de piranjoj kun magiaj kapabloj kaj nebule travideblaj korpoj. Dum esti atakita, ili teleprotiĝas for aŭ por eskapi aŭ por alproksimiĝi al la malamiko!\n\nKvankam batalo kontraŭ ili estas laciga, ilia viando valoras pro magiaj ecoj.

actors.mobs.piranha.name=piranjego
actors.mobs.piranha.desc=Tiuj ĉi karnomanĝulaj fiŝoj estas bredataj cele al protekti superakvitajn areojn. Ilia mordo kaŭzas seriozan vundon, do estas konsilinde eviti senperan interbatalon.
actors.mobs.piranha.discover_hint=Vi povas renkonti tian beston ĉie en la labirinto.

actors.mobs.pylon.name=elektrofosto
actors.mobs.pylon.desc_inactive=Elektrofosto starigita por elektrizi maŝinaron en tiu ĉi zono.\n\nLa elektrofosto estas nuntempe neaktiva kaj difekt-rezista.
actors.mobs.pylon.desc_active=Elektrofosto starigita por elektrizi maŝinaron en tiu ĉi zono. Elektra energio nuntempe fluas tra la fosto, ĝi certege superŝargas DM-300!\n\nEn tiu stato la fosto estas difektebla, sed eligas elektron arkon ĉirkaŭen horloĝdirekte. Pro esti konstruitaj el solida peza metalo, elektrofostoj estas rezistaj al signifa kvanto da difektoj.

actors.mobs.rat.name=kangureca rato
actors.mobs.rat.desc=Kangurecaj ratoj estas atakemaj sed ja malfortaj loĝantoj de la kloakaro. Ili povas mordaĉi malagrable, sed danĝeras nur multope.

actors.mobs.ripperdemon.name=demono murdisto
actors.mobs.ripperdemon.leap=La demono murdisto prepariĝas al salto!
actors.mobs.ripperdemon.desc=Tiuj teruraj bestaĉoj naskiĝis el kadavroj de gnomoj de tiu ĉi regiono vivigitaj per demonaj povoj. Demonoj murdistoj estas mizeraj fantomaj kreaĵoj similaj al gnomoj, sed kun frakasitaj korpoj kaj longaj akraj ungegoj faritaj el ostoj.\n\nDemonoj murdistoj ne estas precipe rezistaj, sed ili estas lertaj kaj danĝeraj. Ili povas alti tra granda distanco por rapide akiri kaj trapiki viktimon per siaj ungegoj.

actors.mobs.rotheart.name=putrokoro
actors.mobs.rotheart.desc=Frukto de putrobero estas tre unika. Anstataŭ forputri kaj eldoni semojn, la frukto kreskas, malmoliĝas kaj enigas la kernon. Ĝi provizas protekton por internaĵoj kiuj kreskas ene la frukto. Oni rigardas la gigantan globon kiel koron de matura putrobero.
actors.mobs.rotheart.discover_hint=Vi povas renkonti tiun kontraŭulon dum la specifa misio.

actors.mobs.rotlasher.name=putrobera batant-branĉo
actors.mobs.rotlasher.desc=La batanta branĉo estas parto de matura radik-strukturo de putrobero kaj ankaŭ ĝia ĉefa defendilo. Branĉoj estas blindaj kaj alfiksitaj al tero, sed post momento brute frapos ĉiun proksiman minacon. Kiam neniu malamiko ĉeestas, ili kuŝas senmove provante ŝajnigi al ĉirkaŭa vegetaĵaro.
actors.mobs.rotlasher.discover_hint=Vi povas renkonti tian kontraŭulon dum la specifa misio.

actors.mobs.scorpio.name=skorpio
actors.mobs.scorpio.desc=Tiu ĉi giganta kvazaŭ-aranea demona bestaĉo evitas proksiman batalon kaj preferas pafi kripligajn segil-formajn dornojn de distanco.

actors.mobs.senior.name=supera monaĥo
actors.mobs.senior.desc=Tiuj monaĥoj estas fanatikuloj, kiuj tute dediĉis sian vivon por protekti la Reĝon de Gnomoj. Ili estas tiel fidelaj, ke eĉ iliaj spiritoj apartenas al la Reĝo kaj nun ili vagas en la metropolo de gnomoj kiel senpensaj zombioj.\n\nTiu ĉi monaĥo iĝis profesiulo en manbatalo kaj povas akiri sinkoncentron pli rapide ol kutimaj monaĥoj. Kiam koncentriĝinta, monaĥo povas repuŝi la sekvan korpan atakon kontraŭ li, eĉ kiam ĝi estas garantiata. Monaĥoj akiras sinkoncentron pli rapide dum movi kaj malpli rapide dum senpera batalo.

actors.mobs.shaman.name=ŝamana gnolo
actors.mobs.shaman.bolt_kill=La magia kuglo mortigis vin…
actors.mobs.shaman.desc=Gnoloj ŝamanoj estas inteligentaj gnoloj, kiuj uzas batal-sorĉaĵojn por kompensi mankon de povo. Ili havas tre altan pozicion en la socio, malgraŭ ilia malalta forto.
actors.mobs.shaman$redshaman.spell_desc=Tiu ĉi ŝamano surportas ruĝan maskon kaj povas uzi magion, kiu sendaŭre _malplifortigas vian atakpovon._
actors.mobs.shaman$blueshaman.spell_desc=Tiu ĉi ŝamano surportas bluan maskon kaj povas uzi magion, kiu sendaŭre _pliigas vundojn, kiujn vi ricevas._
actors.mobs.shaman$purpleshaman.spell_desc=Tiu ĉi ŝamano surportas violkoloran maskon kaj povas uzi magion, kiu sendaŭre _malpliigas vian precizon kaj evitpovon._

actors.mobs.armoredbrute.name=armita bruta gnolo
actors.mobs.armoredbrute.desc=La plej maljunaj de brutaj gnoloj kutime portas potencan defendaĵon por distingigi sian statuson. La defendaĵo igas tiujn gnolojn pli rezistaj al korpaj atakoj kaj danke al sia sperto, ili povas koleri por pli longe antaŭ ol morti pro akiritaj vundoj.

actors.mobs.skeleton.name=skeleto
actors.mobs.skeleton.explo_kill=Vi estis mortigita de eksplodo de ostoj…
actors.mobs.skeleton.def_verb=blokita
actors.mobs.skeleton.desc=Skeletoj konsistas el ostoj de kadavroj de malbonsortaj aventuristoj kaj loĝintoj de la malliberejo, animitaj per emanaĵoj de fimagio de subteraĵo. Kiam ili estos sufiĉe difektitaj, ili disiĝos kun eksplodo de ostoj. Rompitaĵoj de tiu eksplodo vundos ĉiujn proksimulojn, sed defendaĵo tre efikas por eviti tion.

actors.mobs.slime.name=ŝmiraĵo
actors.mobs.slime.def_verb=blokita
actors.mobs.slime.desc=Ŝmiraĵoj estas strangaj, delikate magiaj kreaĵoj kun gumeca eksteraĵo kaj likva internaĵo. La urba kloakaro provizas al ili abundan kvanton da akvo kaj nutraĵoj.\n\nPro ilia elasta ekstera membrano, estas malfacile kaŭzi pli ol _6 vundpoentojn_ per unu frapo.

actors.mobs.snake.name=kloakara serpento
actors.mobs.snake.hint=Provu uzi la butonon de lupeo sur serpento por ekscii kiel venki ĝin.
actors.mobs.snake.desc=Tiuj ĉi trokreskintaj serpentoj povas rapide rampi evitante frapojn, igante ilin tre malfacile atakeblaj. Tamen ili ne estas rezistaj kontraŭ magiaj aŭ surprizaj atakoj.\n\nVi povas fari surprizan atakon per frapi ĝin tiel, por ke ĝi ne vidu vin. Permesu al serpento postkuri vin tra pordo kaj sekve _frapu ĝin tuj post kiam ĝi movos tra la pordo._

actors.mobs.spectralnecromancer.name=fifantoma nekromanciisto
actors.mobs.spectralnecromancer.desc=Kvankam nekromanciistoj ĉefe uzas skeletojn por iliaj eksperimentoj, iuj provas utiligi malpli korpajn estaĵojn. Fifantomaj nekromanciistoj devigis fifantomoj por esti iliaj servistoj!\n\nUnuopaj fifantomoj ne estas tiel fortaj kiel skeletoj, tamen fifantomaj nekromanciistoj ne hezitas pri alvoki ilin plurnombre!

actors.mobs.spinner.name=kaverna ŝpinisto
actors.mobs.spinner.desc=Tiuj verdetaj haregozaj araneoj kavernaj provas eviti senperan batalon, preferante atendi je la malproksimo kiam iliaj viktimoj ĉirkaŭvolvitaj per aranea reto, iom post iom mortetas pro ilia venena mordo. Ili povas ĵeti sian reton je rimarkinda distanco kaj provos bloki ĉiun vojon elektitan de la viktimo.

actors.mobs.statue.name=vivigita statuo
actors.mobs.statue.def_verb=blokita
actors.mobs.statue.desc=Vi pensus, ke ĝi estas alia malviva statuo de la labirinto, sed ĝiaj ruĝaj briletaj okuloj malkaŝas ĝin.
actors.mobs.statue.desc_weapon=Malgraŭ ke la statuo mem estas farita el ŝtono, la _%s_ tenata de ĝi aspektas reale.
actors.mobs.statue.discover_hint=Vi povas renkonti tian kontraŭulon ĉie en la labirinto.

actors.mobs.succubus.name=sukubo
actors.mobs.succubus.desc=Sukuboj estas demoninoj kapablaj ŝanĝi sian aspekton por manipuli mensojn de viktimoj. Tiu ĉi sukubo prenis formon de pala kvazaŭhomo, eble por logi proksimajn gnomaj sorĉistoj?\n\nSububoj povas portempe ĉarmi la atakatan malamikon, malebligante al li senpere ataki. Kiam sukubo atakas ĉarmitan kontraŭulon, ili povas ŝteli iom da esenco de vivo.

actors.mobs.swarm.name=muŝaro
actors.mobs.swarm.desc=La minaca araĉo da muŝoj zumas furioze. Ĉiu ne-magia atako disigos ĝin al du malpli nombraj sed egale danĝeraj muŝaroj.

actors.mobs.tengu.name=Tenguo
actors.mobs.tengu.notice_gotcha=Kompreneble %s!
actors.mobs.tengu.interesting=Tio ĉi estu interesa…
actors.mobs.tengu.notice_have=Mi kaptis vin %s!
actors.mobs.tengu.defeated=Almenaŭ mi liberiĝis…
actors.mobs.tengu.rankings_desc=Murdita de Tenguo
actors.mobs.tengu.desc=Fama kaj enigma murdisto, rekonata pro la masko sur sia vizaĝo.\n\nTenguo estis enkarcerigita kun pezegaj katenoj sur siaj piedoj kaj manoj, ja li senkateniĝis jam antaŭ longa tempo.\n\nLi provos uzi kaptilojn, trompan magion kaj precizajn atakojn por forigi la ununuran aferon, kiu malpermesas al li eskapi: vin.

actors.mobs.tengu$bombability$bombblob.desc=Nubeto de superhejtita fumo ĉirkaŭŝvebas tie ĉi. Atentu, ĝi baldaŭ eksplodos!
actors.mobs.tengu$bombability$bombitem.name=fumbombo
actors.mobs.tengu$bombability$bombitem.cant_pickup=Ĝi algluiĝis al la planko, vi ne povas movi ĝin!
actors.mobs.tengu$bombability$bombitem.desc=Tenguo ĵetis strange aspektantan fumbombon tien ĉi, kiu ellasas densan varman fumon. Ĝi eligas laŭtan tiktakan sonon, kiel ĝi retrokalkulus ĝis eksplodo!\n\nLa bombo algluiĝis al la planko, do vi ne povas preni ĝin.

actors.mobs.tengu$fireability$fireblob.desc=Tenguo ĵetis etgrajnan pulvoron, kiu propagiĝas kun ĉi tiea vaporo, ĝi tuj ekbrulos!

actors.mobs.tengu$shockerability$shockerblob.desc=Elektra energio kolektiĝas tie ĉi; ĉio, kio estos sur tiun ĉi kahelo estos elektroŝokita dum la sekva tempero!
actors.mobs.tengu$shockerability$shockeritem.name=elektroŝokilo
actors.mobs.tengu$shockerability$shockeritem.cant_pickup=Ĝi ellasas tro multe da elektra energio, vi ne povas preni ĝin!
actors.mobs.tengu$shockerability$shockeritem.desc=Tenguo ĵetis tien ĉi strangan maŝinon, kiu ŝajnas esti farita el partoj de DM-100. La maŝino senĉese eligas elektran arkon ĉirkaŭen, sed eligas ĝin laŭ antaŭvidebla strukturo.\n\nPro la elektra arko frapanta ĉirkaŭen, ne eblas tuŝi aŭ preni tiun ĉi maŝinon.

actors.mobs.thief.name=freneza ŝtelisto
actors.mobs.thief.stole=La ŝtelisto malhavigis na %s de vi!
actors.mobs.thief.carries=\n\nLa ŝtelisto prenas na _%s._ Sendube ŝtelita.
actors.mobs.thief.escapes=La ŝtelisto forkuris kun via %s!
actors.mobs.thief.desc=Kvankam tiuj ĉi malliberuloj vagas ekster siaj punĉambroj, tiu ĉi ejo plue estas ilia pundomo. Dum la tuta tempo tiu ĉi loko forprenis liajn mensojn kaj liberon. Jam delonge tiuj frenezaj ŝtelistoj kaj banditoj forgesis kiujn ili estas kaj kial ili ŝtelas.\n\nTiuj malamikoj tre inklinos ŝteli kaj forkuri ol batali. Certiĝu, ke ili estos en via vidatingo, aŭ vi probable ne vidos vian ŝtelitan aĵon ree.

actors.mobs.tormentedspirit.name=turmentita spirito
actors.mobs.tormentedspirit.desc=Turmentitaj spiritoj estas bonkoraj estaĵoj suferantaj pro malbeno. Tiel longe kiel ili estas malbenitaj, ili atakos eĉ pli draste ol fifantomoj.\n\nProbable eblas forigi la malbenon per uzi taŭgan aĵon tuj ĉe la spirito. Se la malbeno foriĝos, la spirito certe dankos al vi…
actors.mobs.tormentedspirit.thank_you=Dankon…

actors.mobs.vaultrat.desc=Kelkaj sintenoj de tiu ĉi rato estas provizore ŝanĝitaj:\n\n_–_ ĝia movado estas aŭdebla tra muroj;\n_–_ ĝi vagados laŭ difinita patrolvojo;\n_–_ dum vagadi ĝia sentemo estas pli bona laŭ ĝia movdirekto;\n_–_ dum dormi ĝia sent-atingo ankaŭ estas etigita;\n_–_ kiam ĝi sentos vin, la rato “priserĉos” antaŭ ol komenci ataki vin. Priserĉantaj kontraŭuloj moviĝos al vi, sed sen ataki vin kaj estante pli facile forkureblaj malantaŭ pordoj kaj anguloj.

actors.mobs.npcs.vaultsentry.name=priserĉanta gardisto de trezorejo
actors.mobs.npcs.vaultsentry.desc=Tiu ĉi gardisto priserĉas la areon laŭ iu skemo. _Ĉar tio ĉi estas nur testejo, la gardisto faros nenion, kiam ĝi vin ekrigardos._

actors.mobs.npcs.vaultlaser.name=laserpafanta gardisto de trezorejo
actors.mobs.npcs.vaultlaser.desc=Tiu ĉi gardisto regule pripafas terenon per laseroj. _Ĉar tio ĉi estas nur testejo, la laseroj ne vundos vin._

actors.mobs.warlock.name=gnoma sorĉisto
actors.mobs.warlock.bolt_kill=La ombropafaĵo mortigis vin…
actors.mobs.warlock.desc=Kiam gnomoj ekinteresiĝis pri fisorĉarto anstataŭ inĝenierarto, sorĉistoj komencis regi en la urbo. Ili komencis kun baza magio, sed post nelonge transinteresiĝis pri demonscienco kaj nekromancio. La plej potencaj de ili prenis regon en la metropolo, kaj iliaj kohortoj estas permesataj por pluigi ekzerci sin en fisorĉarto tiel longe, kiel ili obeis sian mastron.\n\nTiuj sorĉistoj estas lertaj pri potenca detruanta magio, kiu povas sendaŭre obstrukci magion de plibonigoj aplikitan al via armaĵo. Ju pli plibonigita armaĵo, des pli ĝi estos influebla al tiu magio.

actors.mobs.wraith.name=fifantomo
actors.mobs.wraith.desc=Fifantomo estas venĝema spirito de pekinto, kies tombo estis profanita. Estante ekstertera estaĵo, estas ege malfacile frapi ĝin per ordinara armilo.
actors.mobs.wraith.discover_hint=Vi povas renkonti tian kontraŭulon ĉie en la labirinto.

actors.mobs.yogdzewa.name=Jog-Dzeva
actors.mobs.yogdzewa.notice=WIDAMS TUIN…
actors.mobs.yogdzewa.darkness=La mallumo altiras vin…
actors.mobs.yogdzewa.hope=TUAM ESPEROM ESTAT ILUZIAM!
actors.mobs.yogdzewa.defeated=MORTAMS…
actors.mobs.yogdzewa.rankings_desc=Englutita de Jog-Dzeva
actors.mobs.yogdzewa.desc=Jog-Dzeva estas praa dio, neimagebla monstro, kiu esploras mondojn de mortuloj kaj detruas ilin por senfine plimultiĝi. La gnomoj altiris atenton de tiu ĉi terura estaĵo pro eksperimenti kun malluma magio kaj poste penis teni ĝin izolita.\n\nJog-Dzeva devenas de la dimensio de kruda magia ĥaoso kaj ne povas preni sian realan formon en tiu ĉi mondo. Ĝi nur povas krei sian enkorpiĝojn kaj alvoki demonajn servantojn laŭ sia ordono.\n\nTiu ĉi giganta okulo estas la centra punkto de Jog-Dzeva en tiu ĉi mondo. Kvankam la okulo mem ne eblas moviĝi, ĝi povas pafi mortigajn faskojn de demona energio kaj alvoki diversajn servantojn por batali.
actors.mobs.yogdzewa.desc_spawners=Vi sentas ondojn de demona energio radiantajn al la okulo el la pli superaj keletaĝoj. Vi certege preterlasis ion supere, kio transigas energion al Jog-Dzeva. _Jog-Dzeva uzos tiun ĉi energion por alvoki pliajn potencajn servantojn!_
actors.mobs.yogdzewa$larva.name=dia larvo
actors.mobs.yogdzewa$larva.rankings_desc=Larvumita de Jog-Dzeva
actors.mobs.yogdzewa$larva.desc=Tiuj ĉi etaj vermoj estas alvokataj de Jog-Dzeva sen granda peno. Kvankam ili aparte ne estas danĝeraj, ili estas rapide alvokataj kaj povas “superŝuti” la viktimon en granda nombro.
actors.mobs.yogdzewa$yogripper.rankings_desc=Detruita de Jog-Dzeva
actors.mobs.yogdzewa$yogeye.rankings_desc=Detruita de Jog-Dzeva
actors.mobs.yogdzewa$yogscorpio.rankings_desc=Detruita de Jog-Dzeva

actors.mobs.yogfist.invuln_warn=La pugno estas nevundebla proksime al la okulo!
actors.mobs.yogfist.rankings_desc=Dispremita de Jog-Dzeva
actors.mobs.yogfist.desc=Tiu ĉi pugno simbolas potencon de Jog-Dzeva. Pugnoj estas ligitaj al la dio kaj estos protektataj de ĉiu difekto dum esti proksime al la okulo.
actors.mobs.yogfist$burningfist.name=flamiga pugno
actors.mobs.yogfist$burningfist.desc=Tiu ĉi pugno naskiĝis el ĥaosa fajra magio. Dum movado ĝi senĉese ekbruligas la teron. Ĝi ankaŭ povas pafi kuglojn de fajra energio, kiuj disigas flamojn je trafo.\n\nEblo disigi flamojn estas nuligata proksime de akvo, sed ĝi estas tiel varmega, ke ĉiu proksima akvo vaporiĝos post mallonga tempo!
actors.mobs.yogfist$soiledfist.name=tereca pugno
actors.mobs.yogfist$soiledfist.desc=Tiu ĉi pugno naskiĝis el ĥaosa magio de tero. Dum movado ĝi senĉese kaŭzas kreskaĵojn vegeti ĉirkaŭe. Ĝi ankaŭ povas pafi kuglojn de koncentra tero, kiuj kaptos la viktimon per rapide kreskantaj grimpoplantojn kaj radikojn!\n\nLa pugno ĉerpas energion el vegetaĵa vivo kaj estas vund-rezista proporcie al la kvanto da proksimaj kreskaĵoj!
actors.mobs.yogfist$rottingfist.name=putriga pugno
actors.mobs.yogfist$rottingfist.desc=Tiu ĉi pugno naskiĝis el vivanta putrado. Ĝi konsistas el putrantaj kadavroj, kiuj disigas mordantan acidon je senpera atako kaj toksan gason je fora atako. La plej fia eco de la pugno estas, ke pro ĝia impona maso ĝi ne vundiĝas senpere, sed anstataŭ tio komenciĝas sangadi.\n\nOni povas uzi akvon por forlavi la acidon, sed la pugno ankaŭ povas ensorbi akvon por saniĝi! Krom tio, kiam vi atakos la sangantan pugnon, la sangada efiko ne intensiĝos, sed nur refreŝiĝos!
actors.mobs.yogfist$rustedfist.name=rusta pugno
actors.mobs.yogfist$rustedfist.desc=Tiu ĉi pugno naskiĝis el vivanta metalo. Tiu ĉi amaso da movanta metalo kaŭzas seriozajn senperajn frapojn kaj povas kripligi la viktimon je distanco. Pro ĝia grandega maso, la pugno perdos sanpoentojn malrapide kun tempo, anstataŭ tuje.\n\nLa pugno ne povas senprobleme moviĝi kaj ne povas lokiĝi en mallarĝaj koridoroj. Kvankam ĝi malrapide ricevos vundojn, la prokrastataj vundpoentoj pliiĝos, kiam la pugno estos frapita plurfoje.
actors.mobs.yogfist$brightfist.name=luma pugno
actors.mobs.yogfist$brightfist.teleport=La pugno teleportiĝis forlasante ekbrilon de lumo, kiu serioze blindumis vin!
actors.mobs.yogfist$brightfist.desc=Tiu ĉi pugno naskiĝis el energio de pura lumo. Ĝi kapablas pafi potencajn radiojn de brulvundanta lumo je ĉiu tempero! Tiuj radioj portempe blindumos kaj serioze vundos vin. La pugno ankaŭ povas plenigi la areon per blinduma lumo por eskapi!\n\nFeliĉe la pugno ne havas iujn ajn specialajn povojn uzeblajn en proksima batalo.
actors.mobs.yogfist$darkfist.name=malluma pugno
actors.mobs.yogfist$darkfist.teleport=La pugno teleportiĝis forlasante blovegon de mallumo, kiu elĉerpis vian lumfonton!
actors.mobs.yogfist$darkfist.desc=Tiu ĉi pugno naskiĝis el energio de pura mallumo. Ĝi kapablas pafi potencajn radiojn de malluma energio je ĉiu tempero! Tiuj radioj malfortigos vian lumfonton krome al serioze vundi viktimon. La pugno ankaŭ povas plenigi la areon per mallumo por eskapi!\n\nFeliĉe la pugno ne havas iujn ajn specialajn povojn uzeblajn en proksima batalo.


actors.char.kill=%s mortigis vin…
actors.char.defeat=%s estis venkita.
actors.char.def_verb=evitite
actors.char.invulnerable=nevundebla
actors.char.immune=rezista

# Eternity PD Fallback Keys
actors.blobs.blizzard.desc=A blizzard is swirling here.
actors.blobs.confusiongas.desc=A cloud of confusion gas is swirling here.
actors.blobs.dancefloor.desc=Dance dance dance!\n%s dancing tile: %s\nNext color: %s
actors.blobs.dancefloor.color_1_name=Red
actors.blobs.dancefloor.color_1_desc=Characters standing on this tile take direct damage (massively increased vs hero)
actors.blobs.dancefloor.color_2_name=Green
actors.blobs.dancefloor.color_2_desc=Characters standing on this tile act at 2x speed
actors.blobs.dancefloor.color_3_name=Blue
actors.blobs.dancefloor.color_3_desc=Characters standing on this tile are stunned
actors.blobs.dancefloor.color_4_name=White
actors.blobs.dancefloor.color_4_desc=Characters standing on this tile take defered damage (massively increased vs hero)
actors.blobs.dancefloor.color_5_name=Yellow
actors.blobs.dancefloor.color_5_desc=Mobs killed on this tile give double EXP and more loot
actors.blobs.dancefloor.color_6_name=Purple
actors.blobs.dancefloor.color_6_desc=Characters standing on this tile take double damage
actors.blobs.dancefloor.rankings_desc=Danced into a grave
actors.blobs.dancefloor.ondeath=You danced into your own grave
actors.blobs.dancefloor$dancingdefereddamage.name=Dancing with Death
actors.blobs.dancefloor$dancingdefereddamage.desc=This is the most dangerous dance you've ever performed, and you are absolutely _ROCKING_ it, disregarding the pain!\n\nDeferred damage remaining: %d.
actors.blobs.dancefloor$dancingdefereddamage.ondeath=You danced into your own grave
actors.blobs.dancefloor$dancingdefereddamage.rankings_desc=Danced into a grave
actors.blobs.dancefloor$dancingdoom.name=Dancing in a grave
actors.blobs.dancefloor$dancingdoom.desc=Grave isn't the best place to dance in, but no one is stopping you!\n\nCharacters who are brave enough to dance in a grave will receive double damage from all sources.
actors.blobs.dancefloor$dancespeed.name=Dancing with Time
actors.blobs.dancefloor$dancespeed.desc=Your perfect dance synchronized with a rhythm of the universe, and not even time gonna stop you from dancing!\n\nWhile you dance is perfect, you will perform all actions at double speed.
actors.blobs.dancefloor$dancingstun.name=Stunned
actors.blobs.dancefloor$dancingstun.heromsg=You are stunned!
actors.blobs.dancefloor$dancingstun.desc=Nothing feels worse than being stunned in a middle of a dance\n\nStun completely halts all actions, forcing the target to wait until the effect wears off.
actors.blobs.electricity.desc=A field of electricity is sparking brightly here.
actors.blobs.electricity.rankings_desc=Electrocuted
actors.blobs.electricity.ondeath=You were shocked to death...
actors.blobs.fire.desc=A fire is raging here.
actors.blobs.foliage.desc=Shafts of light pierce the gloom of the underground garden.
actors.blobs.freezing.desc=The air is unnaturally frigid here.
actors.blobs.goowarn.desc=Specks of dark energy are swarming here!
actors.blobs.inferno.desc=An inferno is raging here.
actors.blobs.paralyticgas.desc=A cloud of paralytic gas is swirling here.
actors.blobs.sacrificialfire.desc=There is an altar here with a sacrificial fire burning atop it. Any creature that's killed here will be consumed as an offering to the spirits of the dungeon.\n\nPerhaps a reward will be given if enough sacrifices are made?
actors.blobs.sacrificialfire.worthy=The fire consumes your offering and grows stronger.
actors.blobs.sacrificialfire.unworthy=The fire consumes your offering, but doesn't change.
actors.blobs.sacrificialfire.reward=The fire flares and then dissipates, leaving a reward behind!
actors.blobs.smokescreen.desc=A cloud of thick black smoke is swirling here.
actors.blobs.stenchgas.desc=A cloud of fetid stench is swirling here.
actors.blobs.stormcloud.desc=A cloud of billowing water vapor is swirling here.
actors.blobs.toxicgas.desc=A greenish cloud of toxic gas is swirling here.
actors.blobs.toxicgas.rankings_desc=Suffocated
actors.blobs.toxicgas.ondeath=You died from the toxic gas...
actors.blobs.corrosivegas.desc=A cloud of deadly caustic gas is swirling here.
actors.blobs.waterofawareness.procced=As you take a sip, you feel knowledge pour into your mind.
actors.blobs.waterofawareness.desc=Power of knowledge radiates from the water of this well. Take a sip from it to reveal all secrets of equipped items and reveal all items on the current floor.
actors.blobs.waterofhealth.procced=As you take a sip, you feel your wounds heal completely.
actors.blobs.waterofhealth.desc=Power of health radiates from the water of this well. Take a sip from it to heal your wounds and satisfy hunger.
actors.blobs.wateroftransmutation.desc=Power of change radiates from the water of this well. Throw an item into the well to turn it into something else.
actors.blobs.web.desc=A thick web is covering everything here. Anything that touches or is thrown through the web will break it, but will also be stuck in place.
actors.buffs.adrenaline.name=adrenaline
actors.buffs.adrenaline.desc=A surge of physical power, adrenaline enhanced both attack and movement speed.\n\nAdrenaline allows its target to run at 2x speed, and attack at 1.5x speed.\n\nTurns remaining: %s.
actors.buffs.adrenalinesurge.name=strength boost
actors.buffs.adrenalinesurge.desc=A surge of great might, but sadly not permanent.\n\nStrength boost: +%d.\nTurns until boost weakens: %s.
actors.buffs.amok.name=amok
actors.buffs.amok.desc=Amok causes a state of great rage and confusion in its target.\n\nWhen a creature is amoked, they will attack whatever is near them, whether they be friend or foe.\n\nTurns of amok remaining: %s.
actors.buffs.arcanearmor.name=arcane armor
actors.buffs.arcanearmor.desc=A thin shield is surrounding you, blocking some of the damage from magical attacks.\n\nYour magical armor is currently boosted by: 0-%d.\n\nTurns until arcane armor weakens: %s.
actors.buffs.artifactrecharge.name=artifact recharging
actors.buffs.artifactrecharge.desc=Energy is coursing through you, increasing the rate your equipped artifacts charge.\n\nEach artifact is affected a little differently, but they will all gain charge much faster than normal.\n\nTurns remaining: %s.
actors.buffs.ascensionchallenge.name=amulet's curse
actors.buffs.ascensionchallenge.desc=Somehow Yog-Dzewa is maintaining influence on this world through the amulet, and is trying to stop your ascent!\n\nYog's power is making the dungeon much more dangerous, increasing the number of enemies and making them stronger! This power will keep building if left unchecked, it can be weakened by defeating enemies that have been enhanced by Yog's power.
actors.buffs.ascensionchallenge.desc_clear=The dark energy radiating from the amulet has been weakened as much as possible for now.
actors.buffs.ascensionchallenge.desc_beckon=The amulet is currently _calling out to distant enemies,_ alerting them to your position.
actors.buffs.ascensionchallenge.desc_haste=The amulet is currently _hastening distant enemies,_ letting them reach you faster!
actors.buffs.ascensionchallenge.desc_slow=The amulet is currently _slowing you down,_ and negating speed boosting effects!
actors.buffs.ascensionchallenge.desc_damage=The energy from the amulet has gotten so strong that it's _directly harming you!_
actors.buffs.ascensionchallenge.beckon=The amulet begins calling out to distant enemies.
actors.buffs.ascensionchallenge.haste=The amulet begins hastening distant enemies!
actors.buffs.ascensionchallenge.slow=The amulet starts to feel like a lead weight in your inventory!
actors.buffs.ascensionchallenge.damage=The amulet begins radiating dark energy. It burns!
actors.buffs.ascensionchallenge.weaken_info=You must defeat enemies to weaken the amulet's curse!
actors.buffs.ascensionchallenge.weaken=You can feel the amulet's curse weaken slightly.
actors.buffs.ascensionchallenge.break=You take a moment to catch your breath and feel your wounds begin to close!
actors.buffs.ascensionchallenge.almost=You feel Yog's grip on the amulet begin to weaken, you're almost there!
actors.buffs.ascensionchallenge.on_kill=The dark energy consumes you...
actors.buffs.barkskin.name=barkskin
actors.buffs.barkskin.desc=Your skin is hardened, it feels rough and solid like bark.\n\nThe hardened skin increases your effective armor, allowing you to better defend against physical attack.\n\nYour armor is currently increased by: 0-%d.\nTurns until barkskin weakens: %s.\n\nIf you receive barkskin from multiple sources, only the strongest one will apply.
actors.buffs.barrier.name=barrier
actors.buffs.barrier.desc=A durable bubble of force which blocks all damage.\n\nThe barrier will take damage for whatever it is protecting so long as there is shielding left. The shielding will also slowly decay over time.\n\nShielding remaining: %d.
actors.buffs.rageshield.name=Determination Shield
actors.buffs.rageshield.heromsg=You are protected by your rage!
actors.buffs.rageshield.desc=A durable bubble of your sheer rage saps away life force from nearby enemies, if you are wounded.\n\nThe barrier will drain health from enemies in your sight, angering them and taking damage. The shielding will have bigger effect if enemy is in adjacent to host.\n\nShielding remaining: %d.
actors.buffs.berserk.angered=angered
actors.buffs.berserk.berserk=berserking
actors.buffs.berserk.exhausted=exhausted
actors.buffs.berserk.recovering=recovering
actors.buffs.berserk.angered_desc=The severity of the Berserker's injuries strengthen his blows. As the berserker takes physical damage, his rage will build, granting him bonus damage. Damage which is blocked by armor still counts towards building rage.\n\nRage will fade over time. The lower the berserker's health, the longer it will last.\n\nAt 100%% rage, the Berserker can go berserk, granting him 2x his seal's max shielding, increasing to 6x if he has very low health. This shielding decays over time and once it runs out the berserker will have to rest before building rage again.\n\nCurrent Rage: _%.0f%%_\n_+%.0f%%_ damage
actors.buffs.berserk.berserk_desc=Fear and uncertainty bleed away, leaving only anger. In this state the Berserker is extremely powerful, _dealing +50% damage and gaining bonus shielding._\n\nThis bonus shielding is equal to 2x his seal's max shielding, increasing to 6x if he has very low health. When this shielding is reduced to 0, berserking will end.\n\nAfter raging, the Berserker will need to recover before being able to build rage again.
actors.buffs.berserk.recovering_desc=Inner strength has its limits. The Berserker must rest before using his rage again.\n\nWhile recovering the Berserker does not build any rage from taking damage.
actors.buffs.berserk.recovering_desc_turns=Turns until recovered: _%d_
actors.buffs.berserk.recovering_desc_levels=Levels until recovered: _%.2f_
actors.buffs.berserk.rankings_desc=Berserked to Death
actors.buffs.berserk.action_name=Berserk
actors.buffs.berserk.no_seal=You need your broken seal to berserk!
actors.buffs.bleeding.name=bleeding
actors.buffs.bleeding.ondeath=You bled to death...
actors.buffs.bleeding.heromsg=You are bleeding!
actors.buffs.bleeding.rankings_desc=Bled to Death
actors.buffs.bleeding.desc=That wound is leaking a worrisome amount of blood.\n\nBleeding causes damage every turn. Each turn the damage decreases by a random amount, until the bleeding eventually stops.\n\nCurrent bleed damage: %d.
actors.buffs.bless.name=blessed
actors.buffs.bless.desc=A great burst of focus, some say it is inspired by the gods.\n\nBlessing increases accuracy and evasion by 25%%, making the blessed much more effective in combat.\nIt also increased experience gain by 2x for heroes and allows them to get more items.\n\nTurns of bless remaining: %s.
actors.buffs.blindness.name=blinded
actors.buffs.blindness.heromsg=You are blinded!
actors.buffs.blindness.desc=Blinding turns the surrounding world into a dark haze.\n\nWhile blinded, a character's vision range is reduced to one tile, rendering ranged attacks useless and making it very easy to lose track of distant enemies. Additionally, a blinded hero is unable to read scrolls or books.\n\nTurns of blindness remaining: %s.
actors.buffs.buff.heromsg=
actors.buffs.burning.name=burning
actors.buffs.burning.heromsg=You catch fire!
actors.buffs.burning.burnsup=%s burns up!
actors.buffs.burning.ondeath=You burned to death...
actors.buffs.burning.rankings_desc=Burned to Ash
actors.buffs.burning.desc=Few things are more distressing than being engulfed in flames.\n\nFire will deal damage every turn until it is put out by water or it expires. Fire can be extinquished by stepping into water, or from the splash of a shattering potion.\n\nAdditionally, the fire may ignite flammable terrain or items that it comes into contact with.\n\nTurns of burning remaining: %s.
actors.buffs.championenemy.warn=You sense a deadly presence.
actors.buffs.championenemy$blazing.name=blazing champion
actors.buffs.championenemy$blazing.desc=Blazing champions deal 25% more melee damage, ignite enemies they attack, are immune to fire, and spread fire around them as they die. They can't spread fire onto water however.
actors.buffs.championenemy$projecting.name=projecting champion
actors.buffs.championenemy$projecting.desc=Projecting champions deal 25% more melee damage and have +3 attack range.
actors.buffs.championenemy$antimagic.name=antimagic champion
actors.buffs.championenemy$antimagic.desc=Antimagic champions take 50% less damage and are completely immune to magical effects.
actors.buffs.championenemy$giant.name=giant champion
actors.buffs.championenemy$giant.desc=Giant champions take 80% less damage and have +1 attack range, but cannot move through enclosed spaces.
actors.buffs.championenemy$blessed.name=blessed champion
actors.buffs.championenemy$blessed.desc=Blessed champions have 4x accuracy and evasion.
actors.buffs.championenemy$growing.name=growing champion
actors.buffs.championenemy$growing.desc=Growing champions gain a steadily increasing bonus to accuracy, evasion, physical damage, and a reduction to damage taken.\n\nCurrent acc/eva/dmg boost: %1$d%%\nCurrent damage reduction: %2$d%%
actors.buffs.championenemy$tanky.name=tanky champion
actors.buffs.championenemy$tanky.desc=Tanky champions receives only 5% of the damage, but reduces their damage and speed by 25%.
actors.buffs.championenemy$speedy.name=speedy champion
actors.buffs.championenemy$speedy.desc=Speedy Champions will gain x4 speed and x1.5 evasion and accuracy.
actors.buffs.championenemy$frozen.name=frozen champion
actors.buffs.championenemy$frozen.desc=Frozen champions deal 25% more melee damage but they have -20% speed, chills enemies they attack and sometimes freezes them, are immune to cold gases or effects, and spread blizzard around them as they die.
actors.buffs.championenemy$blunt.name=blunt champion
actors.buffs.championenemy$blunt.desc=Blunt champions are expert for using their hands or something they use as a blunt weapons, they deal 75% more damage as well as inflicts vertigo when they attack and paralyzes you in rare cases.
actors.buffs.charm.name=charmed
actors.buffs.charm.heromsg=You are charmed!
actors.buffs.charm.cant_attack=You are charmed by that enemy and can't attack them.
actors.buffs.charm.desc=A charm is manipulative magic that can make enemies temporarily adore each other.\n\nCharacters affected by charm are unable to directly attack the enemy they are charmed by. Attacking other targets is still possible however. The shock of pain will lessen the duration of charm.\n\nTurns of charm remaining: %s.
actors.buffs.chill.name=chilled
actors.buffs.chill.freezes=%s freezes!
actors.buffs.chill.desc=Not quite frozen, but still much too cold.\n\nChilled targets perform all actions more slowly, depending on how many turns are left in the effect. At its worst, this is equivalent to being slowed.\n\nTurns of chill remaining: %1$s.\nSpeed is reduced by: %2$s%%
actors.buffs.combo.name=combo
actors.buffs.combo.action_name=combo attack
actors.buffs.combo.combo=%d hit combo!
actors.buffs.combo.bad_target=You must target an enemy in attack range.
actors.buffs.combo.prompt=Select a target to attack.
actors.buffs.combo.desc=The gladiator builds momentum as they land successful blows. Each attack increases the combo counter by one, but taking too long between hits will reset the combo counter to 0.\n\nBuilding combo unlocks special combo attacks that cannot miss! A different attack is unlocked at 2, 4, 6, 8, and 10 combo count. Some moves reset combo and some do not, but each move can only be used once per combo session.\n\nCurrent combo: %1$d.\n\nTurns until Combo is lost: %2$s.
actors.buffs.combo$combomove.clobber.name=clobber
actors.buffs.combo$combomove.clobber.desc=Knocks an enemy back 2 tiles, but deals no damage and cannot knock into pits. Increments combo by 1.
actors.buffs.combo$combomove.clobber.empower_desc=Knocks an enemy back _3 tiles, inflicts vertigo, and can knock into pits,_ but deals no damage. Increments combo by 1.
actors.buffs.combo$combomove.slam.name=slam
actors.buffs.combo$combomove.slam.desc=Deals %d%% (combo*20%%) of your damage blocking power as bonus damage. Resets combo when used.
actors.buffs.combo$combomove.slam.empower_desc=_Leaps up to %1$d tile(s)_ and deals %2$d%% (combo*20%%) of your damage blocking power as bonus damage. Resets combo when used.
actors.buffs.combo$combomove.parry.name=parry
actors.buffs.combo$combomove.parry.desc=Blocks the next attack within 1 turn when activated, and instantly retaliates to it. Resets combo if nothing is parried.
actors.buffs.combo$combomove.parry.empower_desc=Blocks _all attacks_ within 1 turn when activated, and instantly retaliates to them. Resets combo if nothing is parried.
actors.buffs.combo$combomove.crush.name=crush
actors.buffs.combo$combomove.crush.desc=Deals %d%% (combo*25%%) damage to the primary target, and half that damage to all other enemies in a 7x7 AOE. Resets combo when used.
actors.buffs.combo$combomove.crush.empower_desc=_Leaps up to %1$d tile(s)_ and deals %2$d%% (combo*25%%) damage to the primary target, and half that damage to all other enemies in a 7x7 AOE. Resets combo when used.
actors.buffs.combo$combomove.fury.name=fury
actors.buffs.combo$combomove.fury.desc=Hits an enemy once for each combo you have, each hit deals 60% damage and can trigger enchantments. Resets combo when used.
actors.buffs.combo$combomove.fury.empower_desc=_Leaps up to %d tile(s)_ and hits an enemy once for each combo you have, each hit deals 60%% damage and can trigger enchantments. Resets combo when used.
actors.buffs.corruption.name=corrupted
actors.buffs.corruption.desc=Corruption seeps into the essence of a being, twisting them against their former nature.\n\nCorrupted creatures will attack their allies, and ignore their former enemies. Corruption is damaging as well, and will slowly cause its target to succumb.\n\nCorruption is permanent, its effects only end in death.
actors.buffs.cripple.name=crippled
actors.buffs.cripple.heromsg=You are crippled!
actors.buffs.cripple.desc=You're pretty sure legs aren't meant to bend that way.\n\nCrippled halves movement speed, making moving a tile usually take two turns instead of one.\n\nTurns of cripple remaining: %s.
actors.buffs.daze.name=dazed
actors.buffs.daze.heromsg=You are dazed!
actors.buffs.daze.desc=Ringing ears and blurred vision make it difficult to fight.\n\nWhile dazed, accuracy and evasion are reduced by 50%%, making both landing and evading blows much harder.\n\nTurns of daze remaining: %s.
actors.buffs.degrade.name=degraded
actors.buffs.degrade.heromsg=Your equipment feels weaker!
actors.buffs.degrade.desc=Powerful dark magic is sapping the strength that scrolls of upgrade have applied to your equipment!\n\nWhile degraded, upgraded gear will be treated as if it is a lower level than it actually is. _Every upgrade after +3 becomes exponentially weaker than the last one._ The descriptions of your items will change to reflect their reduced power level.\n\nDegradation does not affect strength requirements, wand charges, durability of thrown weapons, or artifacts.\n\nTurns of degradation remaining: %s. Using a scroll of upgrade or remove curse will end degradation immediately.
actors.buffs.doom.name=doomed
actors.buffs.doom.desc=It's hard to keep going when it seems like the universe wants you dead.\n\nDoomed characters will receive +67% damage from all sources.\n\nDoom is permanent, its effects only end in death.
actors.buffs.dread.name=dread
actors.buffs.dread.desc=A terror so great that it will cause its target to flee the dungeon entirely!\n\nCreatures affected by dread will run from their opponent at high speed, and will disappear from the dungeon entirely once they are out of sight. Enemies that are defeated this way award half experience and drop no items. The shock of pain will lessen the duration of dread.\n\nTurns of dread remaining: %d.
actors.buffs.drowsy.name=drowsy
actors.buffs.drowsy.desc=A magical force is making it difficult to stay awake, after a few turns, the target will fall into a deep magical sleep.\n\nThe hero can resist drowsiness by taking damage or by being at full health.\n\nTurns until sleep: %s.
actors.buffs.earthimbue.name=imbued with earth
actors.buffs.earthimbue.desc=You are imbued with the power of earth!\n\nAll physical attacks will shift the earth under the enemy, crippling them for a short time.\n\nTurns of earth imbue remaining: %s.
actors.buffs.enhancedrings.name=enhanced rings
actors.buffs.enhancedrings.desc=The Rogue's recently used artifact is empowering his rings, granting them +1 level.\n\nTurns remaining: %s.
actors.buffs.fireimbue.name=imbued with fire
actors.buffs.fireimbue.desc=You are imbued with the power of fire!\n\nAll physical attacks will have a chance to light enemies ablaze. Additionally, you are completely immune to the effects of fire.\n\nTurns of fire imbue remaining: %s.
actors.buffs.foresight.name=foresight
actors.buffs.foresight.desc=You are somehow able to see the layout of surrounding terrain with your mind.\n\nWhile under the effect of foresight all tiles in a wide radius are revealed to you, including any secret traps or doors.\n\nTurns of foresight remaining: %s.
actors.buffs.frost.name=frozen
actors.buffs.frost.freezes=%s freezes!
actors.buffs.frost.desc=Not to be confused with freezing solid, this more benign freezing simply encases the target in ice.\n\nFreezing acts similarly to paralysis, making it impossible for the target to act. Unlike paralysis, freezing is immediately cancelled if the target takes damage, as the ice will shatter.\n\nTurns of freeze remaining: %s.
actors.buffs.frostimbue.name=imbued with frost
actors.buffs.frostimbue.desc=You are imbued with icy power!\n\nAll physical attacks will steadily stack chill on enemies. Additionally, you are completely immune to the cold.\n\nTurns of frost imbue remaining: %s.
actors.buffs.fury.name=furious
actors.buffs.fury.heromsg=You become furious!
actors.buffs.fury.desc=You are angry, enemies won't like you when you're angry.\n\nA great rage burns within you, increasing the damage you deal with physical attacks by 50%%.\n\nThis rage will last as long as you are injured below 50%% health.
actors.buffs.blobimmunity.name=purification barrier
actors.buffs.blobimmunity.desc=Some strange force is encasing you in a thin protective barrier, blocking out all harmful airborne effects.\n\nYou are immune to all area-bound effects while this barrier lasts.\n\nTurns of immunity remaining: %s.
actors.buffs.greaterhaste.name=greater haste
actors.buffs.greaterhaste.desc=An incredible boost of speed, for a moment it feels as if everything else is standing still.\n\nWhile under the effects of greater haste moving actions take no time at all, but other actions are still performed at normal speed. Each step of movement consumes a turn of greater haste.\n\nTurns of greater haste remaining: %d.
actors.buffs.godspeed.name=Godspeed
actors.buffs.godspeed.desc=Godly energy courses through your whole essence, allowing you to perform actions at incredible speeds!\n\nWhile under the effects of godspeed you will perform all actions at double speed.\n\nTurns of godspeed remaining: %s.
actors.buffs.haste.name=haste
actors.buffs.haste.desc=Energy courses through your muscles, allowing you to run at incredible speeds!\n\nWhile under the effects of haste you will run at 3x speed, but will perform all other actions at normal speed.\n\nTurns of haste remaining: %s.
actors.buffs.healing.name=healing
actors.buffs.healing.desc=A magical remedy is causing wounds to close and flesh to knit.\n\nEvery turn health will steadily regenerate until the healing effect expires. The amount of healing may fade over time.\n\nNext heal: %d.\n\nHealing remaining: %d.
actors.buffs.herodisguise.name=disguise
actors.buffs.herodisguise.desc=Illusory magic has altered your physical appearance! The effect is purely cosmetic, but feels very strange regardless.\n\nTurns of disguise remaining: %s.
actors.buffs.hex.name=hexed
actors.buffs.hex.heromsg=You have been hexed!
actors.buffs.hex.desc=Dark magic which saps focus, making the target slightly disoriented.\n\nHexing reduces accuracy and evasion by 20%%, making the target less effective in combat.\n\nTurns of hex remaining: %s.
actors.buffs.holdfast.name=hold fast
actors.buffs.holdfast.desc=The %s is holding his position, increasing their armor by %d-%d. This will last until they move.
actors.buffs.hunger.hungry=hungry
actors.buffs.hunger.starving=starving
actors.buffs.hunger.onhungry=You are hungry.
actors.buffs.hunger.onstarving=You are starving!
actors.buffs.hunger.ondeath=You starved to death...
actors.buffs.hunger.cursedhorn=The cursed horn steals some of the food energy as you eat.
actors.buffs.hunger.rankings_desc=Starved to Death
actors.buffs.hunger.desc_intro_hungry=You can feel your stomach calling out for food, but it's not too urgent yet.
actors.buffs.hunger.desc_intro_starving=You're so hungry it hurts.
actors.buffs.hunger.desc=\n\nHunger slowly increases as you spend time in the dungeon, eventually you will begin to starve. While starving you will slowly lose health instead of regenerating it.\n\nRationing is important! If you have health to spare starving isn't a bad idea if it means there will be more food later. Effective rationing can make food last a lot longer!
actors.buffs.invisibility.name=invisible
actors.buffs.invisibility.desc=You are completely blended into the surrounding terrain, making you impossible to see.\n\nWhile you are invisible enemies are unable to attack or follow you. Physical attacks and magical effects (such as scrolls and wands) will immediately cancel invisibility.\n\nTurns of invisibility remaining: %s.
actors.buffs.invulnerability.name=invulnerable
actors.buffs.invulnerability.desc=You are suffused with great protective power, granting you a brief period of invulnerability!\n\nTurns remaining: %s.
actors.buffs.levitation.name=levitating
actors.buffs.levitation.desc=A magical force is levitating you over the ground, making you feel weightless.\n\nLevitating characters move silently and ignore all ground-based effects. Traps won't trigger, water won't put out fire, plants won't be trampled, roots will miss, and pits will be hovered over. Be careful, as all these things can come into effect the second the levitation ends!\n\nTurns of levitation remaining: %s.
actors.buffs.lifelink.name=life link
actors.buffs.lifelink.desc=This character's life force is linked to another character nearby. Any damage taken is shared between them.\n\nWhenever this character takes damage, half of it will be dealt to the life link target instead.\n\nTurns of life link remaining: %s, or until the linked character dies.
actors.buffs.light.name=illuminated
actors.buffs.light.desc=Even in the Darkest Dungeon, a steady light at your side is always comforting.\n\nLight helps keep darkness at bay, allowing you to see a reasonable distance despite the environment.\n\nTurns of illumination remaining: %s.
actors.buffs.lockedfloor.name=floor is locked
actors.buffs.lockedfloor.desc=The current floor is locked, and you are unable to leave it!\n\nWhile a floor is locked, you will not gain hunger or take damage from starving. In addition, if you do not work towards defeating this floor's boss, passive regeneration effects will also stop.\n\nAdditionally, if you are revived by an unblessed ankh while the floor is locked, then it will reset.\n\nKill this floor's boss to break the lock.
actors.buffs.lostinventory.name=lost inventory
actors.buffs.lostinventory.desc=Your inventory has been lost somewhere in the dungeon! You won't be able to pick up or use most items until you retrieve it.
actors.buffs.magicalsight.name=magical sight
actors.buffs.magicalsight.desc=Somehow you are able to see with your mind, rather than your eyes.\n\nWhile magical sight is active you will be able to see through all terrain in a 12 tile radius.\n\nTurns of magical sight remaining: %s.
actors.buffs.magicalsleep.name=magical sleep
actors.buffs.magicalsleep.toohealthy=You are too healthy, and resist the urge to sleep.
actors.buffs.magicalsleep.fallasleep=You fall into a deep magical sleep.
actors.buffs.magicalsleep.wakeup=You wake up feeling refreshed and healthy.
actors.buffs.magicalsleep.desc=This character has fallen into a deep magical sleep which they will not wake from naturally.\n\nMagical sleep is similar to regular sleep, except that only damage will cause the target to wake up.\n\nFor the hero and their allies, magical sleep has some restorative properties, allowing them to rapidly heal while resting.
actors.buffs.magicimmune.name=immune to magic
actors.buffs.magicimmune.desc=All magical effects have lost their hold on you, you are completely impervious to them.\n\nWhile magic immune all harmful and helpful magical effects will not apply to you, including curses, enchants, wands, scrolls, rings, artifacts, etc. Heroic armor abilities are strong enough to work regardless of this effect.\n\nTurns of magic immunity remaining: %s.
actors.buffs.overload.name=Overload
actors.buffs.overload.desc=The reality is overloaded. Prepare to cry, suffer, kill and slaughter.\n\nThe death of any hostile creature triggers the spawn of other creature.\n\nTurns of overload remaining: %s.
actors.buffs.mindvision.name=mind vision
actors.buffs.mindvision.desc=Somehow you are able to see all creatures on this floor through your mind. It's a weird feeling.\n\nAll characters on this floor are visible to you as long as you have mind vision. Seeing a creature through mind vision counts as it being seen or nearby for the purposes of many magical effects.\n\nTurns of mind vision remaining: %s.
actors.buffs.momentum.momentum=building momentum
actors.buffs.momentum.running=freerunning
actors.buffs.momentum.resting=recovering
actors.buffs.momentum.action_name=freerun
actors.buffs.momentum.momentum_desc=As he moves, the Freerunner builds momentum, which he can spend to start freerunning.\n\nEach charge of momentum grants two turns of freerunning, and the Freerunner can build up to 10 charges. Momentum is rapidly lost when the Freerunner stops moving.\n\nCurrent momentum charge: %d.
actors.buffs.momentum.running_desc=As he moves, the Freerunner builds momentum, which he can spend to start freerunning.\n\nWhile freerunning, the Freerunner moves at double speed and gains bonus evasion based on his level.\n\nTurns remaining: %d.
actors.buffs.momentum.resting_desc=As he moves, the Freerunner builds momentum, which he can spend to start freerunning.\n\nThe Freerunner needs time to regain his stamina before building momentum again.\n\nTurns remaining: %d.
actors.buffs.monkenergy.name=energy
actors.buffs.monkenergy.action=Monk Abilities
actors.buffs.monkenergy.desc=As she defeats enemies, the Monk gains energy that she can use on a variety of abilities. Most enemies grant 1 energy when defeated, and the Monk does not lose energy over time.\n\nCurrent energy: %1$d/%2$d.
actors.buffs.monkenergy.desc_cooldown=The Monk has recently used an ability, and must wait before using another.\n\nCurrent cooldown: %d turns.
actors.buffs.monkenergy$monkability$flurry.name=flurry of blows
actors.buffs.monkenergy$monkability$flurry.desc=Two instant strikes that deal %1$d-%2$d damage and ignore armor. This ability cannot be used repeatedly.
actors.buffs.monkenergy$monkability$flurry.empower_desc=Two instant strikes that deal %1$d-%2$d damage, ignore armor, _and use your weapon's enchantment._ This ability cannot be used repeatedly.
actors.buffs.monkenergy$monkability$focus.name=focus
actors.buffs.monkenergy$monkability$focus.desc=The Monk takes a turn to focus, letting her parry the next attack made against her.
actors.buffs.monkenergy$monkability$focus.empower_desc=The Monk _instantly focuses,_ letting her parry the next attack made against her.
actors.buffs.monkenergy$monkability$focus$focusbuff.name=focused
actors.buffs.monkenergy$monkability$focus$focusbuff.desc=The Monk is focused on her surroundings, anticipating the next attack made against her. While focused, she is guaranteed to parry the next incoming attack.
actors.buffs.monkenergy$monkability$dash.name=dash
actors.buffs.monkenergy$monkability$dash.prompt=Choose a Location
actors.buffs.monkenergy$monkability$dash.desc=An instant dash up to 4 tiles away. This ability can go over hazards, but not through enemies or solid terrain.
actors.buffs.monkenergy$monkability$dash.empower_desc=An instant dash up to _8 tiles_ away. This ability can go over hazards, but not through enemies or solid terrain.
actors.buffs.monkenergy$monkability$dragonkick.name=dragon kick
actors.buffs.monkenergy$monkability$dragonkick.desc=A devastating kick that deals %1$d-%2$d damage and ignores armor. The kick knocks the target away and paralyzes them for each tile they travel.
actors.buffs.monkenergy$monkability$dragonkick.empower_desc=A devastating kick that deals _%1$d-%2$d damage_ and ignores armor. The kick knocks _all adjacent targets_ away and paralyzes them for each tile they travel.
actors.buffs.monkenergy$monkability$meditate.name=meditate
actors.buffs.monkenergy$monkability$meditate.desc=The Monk focuses energy into her body for 5 turns. This clears most negative effects and grants her 8 turns of wand and artifact recharging.
actors.buffs.monkenergy$monkability$meditate.empower_desc=The Monk focuses energy into her body for 5 turns. This clears most negative effects and grants her 8 turns of wand and artifact recharging. _She also gains 80% damage resistance while meditating, and slowly heals for 20% of her missing HP._
actors.buffs.killevolution.name=kill counter
actors.buffs.killevolution.action=Kill Abilities
actors.buffs.killevolution.desc=As they defeat enemies, the hero gains energy that they can use on a variety of abilities. Most enemies grant 1 energy when defeated, and the hero does not lose energy over time.\n\n_However, unequipping a weapon associated with this buff associated with will lose all of this energy and you need to start killing enemies again_\n\nCurrent energy: %1$d/%2$d.
actors.buffs.killevolution.desc_cooldown=The hero has recently used an ability, and must wait before using another.\n\nCurrent cooldown: %d turns.
actors.buffs.killevolution$killevolutionability$invisibledash.name=invisible dash
actors.buffs.killevolution$killevolutionability$invisibledash.prompt=Choose a Location
actors.buffs.killevolution$killevolutionability$invisibledash.desc=An instant dash up to 4 tiles away with an additional turn of invisibility allowing the hero to surprise attack. This ability can go over hazards, but not through enemies or solid terrain.
actors.buffs.killevolution$killevolutionability$invisibledash.empower_desc=An instant dash up to _8 tiles_ away with an additional turn of invisibility allowing the hero to surprise attack. This ability can go over hazards, but not through enemies or solid terrain.
actors.buffs.killevolution$killevolutionability$physicallyempowered.name=physical empower
actors.buffs.killevolution$killevolutionability$physicallyempowered.desc=The hero grants itself +2 bonus damage for 10 hits.
actors.buffs.killevolution$killevolutionability$physicallyempowered.empower_desc=The hero grants itself _+4 bonus damage_ for 10 hits.
actors.buffs.killevolution$killevolutionability$weaponupgrade.name=weapon upgrade
actors.buffs.killevolution$killevolutionability$weaponupgrade.desc=The hero upgrades their weapon (and Duelist's second weapon if there's any) permanently.
actors.buffs.killevolution$killevolutionability$weaponupgrade.empower_desc=The hero upgrades their weapon (and Duelist's second weapon if there's any) _twice_ permanently.
actors.buffs.killevolution$killevolutionability$chain.name=chain enemy
actors.buffs.killevolution$killevolutionability$chain.desc=The hero chains an enemy to pull them in closer range.
actors.buffs.killevolution$killevolutionability$immortalize.name=immortalize
actors.buffs.killevolution$killevolutionability$immortalize.desc=The hero grants itself immortality against all sources of damage for 15 turns.
actors.buffs.killevolution$killevolutionability$immortalize.empower_desc=The hero grants itself immortality against all sources of damage for _~22 turns_.
actors.buffs.ooze.name=caustic ooze
actors.buffs.ooze.heromsg=Caustic ooze eats your flesh. Wash it away!
actors.buffs.ooze.ondeath=You melt away...
actors.buffs.ooze.rankings_desc=Dissolved
actors.buffs.ooze.desc=This sticky acid clings to flesh, slowly melting it away.\n\nOoze will deal consistent damage over time, but can be immediately washed off in water.\n\nTurns of ooze remaining: %s.
actors.buffs.paralysis.name=paralysed
actors.buffs.paralysis.heromsg=You are paralysed!
actors.buffs.paralysis.out=resisted paralysis
actors.buffs.paralysis.desc=Oftentimes the worst thing to do is nothing at all.\n\nParalysis completely halts all actions, forcing the target to wait until the effect wears off. The pain from taking damage can cause characters to resist paralysis, breaking them out of the effect.\n\nTurns of paralysis remaining: %s.
actors.buffs.physicalempower.name=physically empowered
actors.buffs.physicalempower.desc=Your blows have been empowered, increasing the amount of damage you can deal when you hit enemies with physical attacks.\n\nBonus damage: %1$d.\nHits remaining: %2$d.
actors.buffs.pincushion.name=pincushion
actors.buffs.pincushion.desc=The thrown weapons you have used against this character are currently stuck to them and will fall to the floor after they are defeated.\n\nThe following items are currently attached:
actors.buffs.poison.name=poisoned
actors.buffs.poison.heromsg=You are poisoned!
actors.buffs.poison.ondeath=You died from poison...
actors.buffs.poison.rankings_desc=Succumbed to Poison
actors.buffs.poison.desc=Poison works its way through the body, slowly impairing its internal functioning.\n\nPoison deals damage each turn proportional to how long until it expires.\n\nTurns of poison remaining: %s.
actors.buffs.preparation.name=preparation
actors.buffs.preparation.action_name=prepared strike
actors.buffs.preparation.desc=The Assassin is walking nervously, preparing to thurst knife into target.
actors.buffs.preparation.desc_dmg=His next attack will deal _%1$d%% bonus damage_, and will execute regular enemies below _%2$d%% health_, or bosses below _%3$d%% health_.
actors.buffs.preparation.desc_dmg_likely=The attack will also be more likely to deal a larger amount of damage.
actors.buffs.preparation.desc_blink=He is able to blink towards an enemy before striking them, with a max distance of _%d._
actors.buffs.preparation.desc_invis_time=The Assassin has been running for _%d turns._
actors.buffs.preparation.desc_invis_next=His attack will become stronger at _%d turns._
actors.buffs.preparation.prompt=Select a target to attack!\nMax blink distance: %d
actors.buffs.preparation.no_target=There's nothing to attack there.
actors.buffs.preparation.out_of_reach=That target is out of reach.
actors.buffs.preparation.assassinated=assassinated
actors.buffs.marked.name=Marked
actors.buffs.marked.desc=The Hunter is waiting patiently, preparing to strike while his bbat weakens enemies.
actors.buffs.marked.desc_dmg=The bbat deals %s%% more damage to this enemy. You will be able to jump to marked enemy at any moment, but more bonus damage means more debuffs.
actors.buffs.marked.prompt=Select a target to teleport!\nMax blink distance: your view distance
actors.buffs.marked.no_target=There's nothing to teleport there.
actors.buffs.marked.out_of_reach=That target is out of reach.
actors.buffs.marked.assassinated=assassinated
actors.buffs.marked.desc_poison=At this point, you will _poison_ a target, dealing damage over time.
actors.buffs.marked.desc_cripple=At this point, you will _cripple_ the legs of target, reducing its movement speed.
actors.buffs.marked.desc_blinding=At this point, you will also make target _blind_,reducing its field of view to 1 tile.
actors.buffs.marked.desc_bleeding=At this point, you will also make target _bleed_,dealing damage over time.
actors.buffs.marked.desc_vulnerable=At this point, you will also _increase physical damage_ to enemy.
actors.buffs.marked.desc_hexed=At this point, you will also stun target, _reducing its accuracy and dexterity_ for short time.
actors.buffs.marked.desc_slow=At this point, you will also disorientate target, _slowing_ its actions.
actors.buffs.marked.desc_ooze=At this point, you will also apply deadly _caustic ooze_ to target, dealing damage over time until target finds water.
actors.buffs.marked.desc_paralysis=At this point, you will completely _paralyse_ the enemy, rendering it unable to attack.
actors.buffs.marked.desc_doom=At this point, you will also curse the enemy, _significantly increasing any damage to it_.
actors.buffs.prismaticguard.name=prismatic Guard
actors.buffs.prismaticguard.desc=You are being guarded by a prismatic image which is currently inactive. When enemies are present the prismatic image will spring to action and protect you!\n\nWhile inactive, the prismatic image will steadily recover from any damage it has taken.\n\nCurrent HP: %d/%d.
actors.buffs.recharging.name=recharging
actors.buffs.recharging.desc=Energy is coursing through you, improving the rate that your wands and staffs charge.\n\nEach turn this buff will increase current charge by one quarter, in addition to regular recharge.\n\nTurns of recharging remaining: %s.
actors.buffs.revealedarea.name=revealed area
actors.buffs.revealedarea.desc=An area of the dungeon has been temporarily revealed to the hero, They will see it no matter where they are.\n\nTurns remaining: %s.
actors.buffs.revealedchar.name=revealed
actors.buffs.revealedchar.desc=This character is revealed to the hero, They will be visible no matter where they are.\n\nTurns remaining: %s.
actors.buffs.roots.name=rooted
actors.buffs.roots.heromsg=You can't move!
actors.buffs.roots.desc=Roots (magical or natural) grab at the feet, forcing them down to the ground.\n\nRoots lock a target in place, making movement and most movement abilities impossible. Other actions are not affected, including teleportation effects.\n\nTurns of root remaining: %s.
actors.buffs.scrollempower.name=scroll empower
actors.buffs.scrollempower.desc=The energy from the Mage's recently read scroll is empowering his wands!\n\nLevel Boost: +%1$d.\nZaps remaining: %2$d.
actors.buffs.shadows.name=shadowmelded
actors.buffs.shadows.desc=You are blended into the shadows around you, granting you invisibility and slowing your metabolism.\n\nWhile you are invisible enemies are unable to attack or follow you. Most physical attacks and magical effects (such as scrolls and wands) will immediately cancel invisibility. Additionally, while shadowmelded, your rate of hunger is slowed.\n\nYou will remain shadowmelded until you leave the shadows or an enemy comes into contact with you.
actors.buffs.slow.name=slowed
actors.buffs.slow.desc=Slowing magic affects the target's rate of time, to them everything is moving super-fast.\n\nA slowed character performs all actions in twice the amount of time they would normally take.\n\nTurns of slow remaining: %s.
actors.buffs.snipersmark.name=sniper's mark
actors.buffs.snipersmark.action_name_snapshot=snapshot
actors.buffs.snipersmark.action_name_volley=volley
actors.buffs.snipersmark.action_name_sniper=sniper shot
actors.buffs.snipersmark.desc=The Sniper is honed in on the target she most recently attacked. She is able to perform a special attack with her bow which will vary based on how the bow is augmented.\n\nAn unaugmented bow will fire a _snapshot,_ which deals reduced damage but does not take any time to fire.\n\nA bow augmented for speed will fire a _volley_ of three arrows. Each arrow will deal reduced damage, but can still activate enchantment. This volley takes 1 turn to shoot.\n\nA bow augmented for damage will fire a _sniper shot._ This shot is guaranteed to hit, deals bonus damage based on distance from the target, and takes 2 turns to fire.\n\nTurns remaining: %s.
actors.buffs.soulmark.name=soul marked
actors.buffs.soulmark.desc=The warlock has tapped into the soul of this creature, allowing him to heal as it takes physical damage.\n\nTurns of soul mark remaining: %s.
actors.buffs.stamina.name=stamina
actors.buffs.stamina.desc=You have unending stamina, allowing for faster movement!\n\nWhile under the effects of stamina you will run at +50%% speed, but will perform all other actions at normal speed.\n\nTurns of stamina remaining: %s.
actors.buffs.vulnerable.name=vulnerable
actors.buffs.vulnerable.heromsg=You feel fragile!
actors.buffs.vulnerable.desc=Vulnerability magic increases all physical damage that a character takes by 33%%, after that damage has been reduced by armor.\n\nTurns of vulnerable remaining: %s.
actors.buffs.terror.name=terrified
actors.buffs.terror.desc=Terror is manipulative magic which forces its target into an uncontrollable panic.\n\nTerrified characters are forced to run away from their opponent, trying to put as many doors and walls between them as possible. The shock of pain will lessen the duration of terror, however.\n\nTurns of terror remaining: %s.
actors.buffs.toxicimbue.name=imbued with toxicity
actors.buffs.toxicimbue.desc=You are imbued with poisonous energy!\n\nAs you move around toxic gas will constantly billow forth from you, damaging your enemies. You are immune to toxic gas and poison for the duration of the effect, as well as for a few turns afterward.\n\nTurns of toxic imbue remaining: %s.
actors.buffs.corrosion.name=corrosion
actors.buffs.corrosion.heromsg=You are melting!
actors.buffs.corrosion.ondeath=You melt away...
actors.buffs.corrosion.rankings_desc=Dissolved
actors.buffs.corrosion.desc=Powerful acid melts away flesh, metal, and bone at an alarming rate.\n\nCorrosion damage increases over time, as the target continues to melt away.\n\nTurns of corrosion remaining: %1$s.\nCurrent corrosion damage: %2$d.
actors.buffs.vertigo.name=vertigo
actors.buffs.vertigo.desc=Walking in a straight line can be difficult when the whole world is spinning.\n\nWhile under the effects of vertigo, characters who attempt to move will go in a random direction, instead of the one they intended to go in.\n\nTurns of vertigo remaining: %s.
actors.buffs.wandempower.name=wands empowered
actors.buffs.wandempower.desc=Your damage-dealing wands have been empowered, increasing the amount of damage they deal for a few hits.\n\nBonus damage: %1$d.\nHits remaining: %2$d.
actors.buffs.weakness.name=weakened
actors.buffs.weakness.heromsg=You feel weakened!
actors.buffs.weakness.desc=Everything suddenly seems much heavier.\n\nWeakening magic reduces a character's physical strength, causing them to deal 33%% reduced damage.\n\nTurns of weakness remaining: %s.
actors.buffs.wellfed.name=well fed
actors.buffs.wellfed.desc=You feel quite satisfied and full.\n\nWhile well fed, your hunger will not increase, and you will heal an additional amount of health over time.\n\nTurns remaining: %d.
actors.buffs.danceimmunebuff.name=immune to dance curse
actors.buffs.danceimmunebuff.desc=All dancing effects loses all its power for a short time, well extending the effect is not effective, you must wait for this effect to wear down before using the spell again.\n\nTurns of magic immunity remaining: %s.
actors.hero.abilities.armorability.self_target=You can't target yourself!
actors.hero.abilities.armorability.no_target=There's nothing to target there!
actors.hero.abilities.armorability.prompt=Choose a location to target
actors.hero.abilities.armorability.cost=Charge cost: _%d_
actors.hero.abilities.warrior.heroicleap.name=heroic leap
actors.hero.abilities.warrior.heroicleap.prompt=Choose direction to leap
actors.hero.abilities.warrior.heroicleap.short_desc=The Warrior performs a _Heroic Leap_ towards a targeted location, sailing above enemies and hazards.
actors.hero.abilities.warrior.heroicleap.desc=The Warrior leaps toward a targeted location, going over any enemies or hazards in the way. He cannot leap over walls or other solid terrain however.
actors.hero.abilities.warrior.shockwave.name=shockwave
actors.hero.abilities.warrior.shockwave.short_desc=The Warrior releases a _Shockwave_ in a conical AOE by slamming the ground. Enemies caught in the shockwave are damaged and crippled.
actors.hero.abilities.warrior.shockwave.desc=The Warrior slams the ground, producing a shockwave that travels up to 5 tiles in a 60 degree cone.\n\nEnemies caught in this shockwave are crippled for 5 turns. They also take 5-10 damage, plus an additional 1-2 damage for every point of strength the Warrior has above 10.
actors.hero.abilities.warrior.endure.name=endure
actors.hero.abilities.warrior.endure$enduretracker.name=endurance
actors.hero.abilities.warrior.endure$enduretracker.desc=The Warrior is now dealing bonus damage based on the damage he endured.\n\nBonus Damage: %1$d\nHits Left: %2$d
actors.hero.abilities.warrior.endure.short_desc=The Warrior _Endures_, skipping several turns but gaining high damage resistance. He then deals bonus damage based on what he endured.
actors.hero.abilities.warrior.endure.desc=The Warrior endures for 3 turns, taking half damage from all sources. This reduction is applied before damage resisting effects like armor.\n\nAfter enduring, the warrior's next hit within 10 turns gains bonus damage. This bonus damage is equal to half of all the damage inflicted on him while enduring, before any damage reduction effects!\n\nIf the Warrior has any combo, using this ability increases its remaining time by 3 turns.
actors.hero.abilities.mage.elementalblast.name=elemental blast
actors.hero.abilities.mage.elementalblast.no_staff=You can't use this ability without your staff.
actors.hero.abilities.mage.elementalblast.short_desc=The Mage emits an _Elemental Blast_ from his staff, covering a large area around him in an effect that varies based on the wand in his staff.
actors.hero.abilities.mage.elementalblast.desc=The Mage emits a blast of magic, which covers a circular region up to 4 tiles away and deals up to 15-25 damage. The specific effect of elemental blast will vary by the wand imbued in the Mage's staff.
actors.hero.abilities.mage.elementalblast.generic_desc=The effect of elemental blast will be similar to the effect of the wand when zapped at an enemy or ally.
actors.hero.abilities.mage.wildmagic.name=wild magic
actors.hero.abilities.mage.wildmagic.no_wands=You have no wands to zap with!
actors.hero.abilities.mage.wildmagic.short_desc=The Mage unleashes the _Wild Magic_ contained in his wands, randomly firing them multiple times at a chosen target over a single turn.
actors.hero.abilities.mage.wildmagic.desc=The Mage unleashes the power in his wands, randomly firing them up to 4 times in a single turn. The Mage's staff is not included in this effect.\n\nEach wand also has its level boosted by 2, up to +3. This ability uses half a wand charge for each zap, and no one wand can be fired more than 2 times.
actors.hero.abilities.mage.warpbeacon.name=warp beacon
actors.hero.abilities.mage.warpbeacon.depths=You can't warp between depths!
actors.hero.abilities.mage.warpbeacon.locked_floor=You cannot leave a locked floor!
actors.hero.abilities.mage.warpbeacon.too_far=That location is too far!
actors.hero.abilities.mage.warpbeacon.invalid_beacon=You can't place a beacon there!
actors.hero.abilities.mage.warpbeacon.window_desc=Your beacon is currently placed on floor %d.
actors.hero.abilities.mage.warpbeacon.window_tele=teleport to beacon
actors.hero.abilities.mage.warpbeacon.window_clear=clear beacon
actors.hero.abilities.mage.warpbeacon.window_cancel=cancel
actors.hero.abilities.mage.warpbeacon.short_desc=The Mage places a _Warping Beacon_ at his current location, which he can instantly teleport back to.
actors.hero.abilities.mage.warpbeacon.desc=The Mage places a beacon, which can then be warped to at will. Placing the beacon takes 1 turn, but warping to it is instantaneous.\n\nThe Mage cannot warp between floors by default, or use the beacon to reach inaccessible places such as locked rooms. The Mage can teleport into enemies, which will push them aside.
actors.hero.abilities.rogue.smokebomb.name=smoke bomb
actors.hero.abilities.rogue.smokebomb.fov=You can only jump to an empty location in your field of view
actors.hero.abilities.rogue.smokebomb.prompt=Choose a location to jump to
actors.hero.abilities.rogue.smokebomb$ninjalog.name=wooden decoy
actors.hero.abilities.rogue.smokebomb$ninjalog.desc=Somehow, enemies are easily convinced that this wooden decoy is the real Rogue!
actors.hero.abilities.rogue.smokebomb.short_desc=The Rogue throws down a _Smoke Bomb_ while blinking away. He blinds enemies near his old location.
actors.hero.abilities.rogue.smokebomb.desc=The Rogue throws down a smoke bomb and blinks up to 6 tiles away. He can blink through hazards and enemies, but not through solid terrain like walls.\n\nEnemies that are adjacent to the Rogue's old position will be blinded for 5 turns.
actors.hero.abilities.rogue.deathmark.name=death mark
actors.hero.abilities.rogue.deathmark.ally_target=You can only mark enemies
actors.hero.abilities.rogue.deathmark.short_desc=The Rogue places a _Death Mark_ on a chosen enemy. Marked enemies take bonus damage, but cannot die until the mark ends.
actors.hero.abilities.rogue.deathmark.desc=The Rogue places a mark on a chosen enemy, causing them to take 25% extra damage. The mark is applied instantly and lasts for 5 turns.\n\nMarked enemies take bonus damage but are unable to die until the mark expires. If an enemy has 0 HP when the mark ends, they will immediately die.
actors.hero.abilities.rogue.deathmark$deathmarktracker.name=marked for death
actors.hero.abilities.rogue.deathmark$deathmarktracker.desc=This enemy has been marked, causing them to take 25%% bonus damage, but also rendering them unable to die until the mark ends.\n\nTurns remaining: %s.
actors.hero.abilities.rogue.shadowclone.name=shadow clone
actors.hero.abilities.rogue.shadowclone.short_desc=The Rogue summons a _Shadow Clone_, which can be directed to aid him in combat.
actors.hero.abilities.rogue.shadowclone.desc=The Rogue summons a shadowy mimic of himself, which can be directed to aid him in combat. Directing the shadow clone does not cost any charge.\n\nThe clone has 80 HP, no armor, and deals 10-20 damage. All of these traits can be improved with talents, such that the clone benefits from weapons and armor the hero has.
actors.hero.abilities.rogue.shadowclone$shadowally.name=shadow rogue
actors.hero.abilities.rogue.shadowclone$shadowally.direct_defend=Your clone moves to that position.
actors.hero.abilities.rogue.shadowclone$shadowally.direct_follow=Your clone moves to follow you.
actors.hero.abilities.rogue.shadowclone$shadowally.direct_attack=Your clone moves to attack!
actors.hero.abilities.rogue.shadowclone$shadowally.desc=A copy of the Rogue, made from shadowy darkness. It stands stock still, with empty eyes and tiny wisps of darkness rising from it like steam.\n\nThe clone is not a perfect copy of the Rogue, but is still a decent fighter, and can benefit from the Rogue's equipment with the right talents.
actors.hero.abilities.huntress.spectralblades.name=spectral blades
actors.hero.abilities.huntress.spectralblades.short_desc=The Huntress throws _Spectral Blades_ at a target, inflicting damage depending on her currently equipped melee weapon.
actors.hero.abilities.huntress.spectralblades.desc=The Huntress throws out a spectral blade at an enemy, which acts like a ranged strike from her melee weapon. All of the normal effects of a melee weapon will activate, including enchantments.
actors.hero.abilities.huntress.naturespower.name=nature's power
actors.hero.abilities.huntress.naturespower.short_desc=The Huntress calls upon _Nature's Power_, increasing her movement speed and her bow's rate of fire for a short time.
actors.hero.abilities.huntress.naturespower.desc=The Huntress temporarily empowers herself and her bow with the power of nature! This lasts for 8 turns.\n\nDuring this time, the Huntress moves at 2x speed, and attacks 33% faster with her bow. The bonus bow effects do not trigger if the Sniper is using her special attacks.
actors.hero.abilities.huntress.naturespower$naturespowertracker.name=nature's power
actors.hero.abilities.huntress.naturespower$naturespowertracker.desc=The Huntress is briefly empowered, increasing her movement speed and attack speed with her bow.\n\nTurns remaining: %s.
actors.hero.abilities.huntress.spirithawk.name=spirit hawk
actors.hero.abilities.huntress.spirithawk.no_space=There is no free space near you.
actors.hero.abilities.huntress.spirithawk.short_desc=The Huntress summons a _Spirit Hawk_ familiar, which can help her scout locations and distract enemies.
actors.hero.abilities.huntress.spirithawk.desc=The Huntress summons a spirit hawk familiar, which can be directed by using the ability again while it is summoned. The hawk lasts for 100 turns, directing the hawk does not cost any charge.\n\nThe hawk has minimal health and attacking power, but is fast, evasive, and accurate. It shares its entire field of vision with the Huntress at all times. It is immune to all area-bound effects, such as fire and poison gas. It will not attack unless specifically directed to.
actors.hero.abilities.huntress.spirithawk$hawkally.name=spirit hawk
actors.hero.abilities.huntress.spirithawk$hawkally.direct_defend=Your hawk moves to that position.
actors.hero.abilities.huntress.spirithawk$hawkally.direct_follow=Your hawk moves to follow you.
actors.hero.abilities.huntress.spirithawk$hawkally.direct_attack=Your hawk moves to attack!
actors.hero.abilities.huntress.spirithawk$hawkally.desc=A magical hawk, summoned by the Huntress. It glows a bright ethereal blue, its head constantly shifts around as it surveys the area.\n\nWhile it isn't much of a fighter its speed and vision make it excellent for scouting and distracting enemies.
actors.hero.abilities.huntress.spirithawk$hawkally.desc_remaining=Turns remaining: %d.
actors.hero.abilities.huntress.spirithawk$hawkally.desc_dodges=Guaranteed dodges remaining: %d.
actors.hero.abilities.duelist.challenge.name=challenge
actors.hero.abilities.duelist.challenge.prompt=Choose an enemy to challenge
actors.hero.abilities.duelist.challenge.already_dueling=You can only be in one duel at a time.
actors.hero.abilities.duelist.challenge.ally_target=You can only challenge enemies.
actors.hero.abilities.duelist.challenge.unreachable_target=You must be able to reach your target.
actors.hero.abilities.duelist.challenge.distant_target=That enemy is too far away to challenge.
actors.hero.abilities.duelist.challenge.short_desc=The Duelist _Challenges_ a nearby enemy to a duel, temporarily freezing all other enemies.
actors.hero.abilities.duelist.challenge.desc=The Duelist challenges a nearby enemy to a duel. That enemy is compelled to fight her while all other enemies are temporarily frozen in time.\n\nThe target must be reachable and within 5 tiles of the Duelist. The duel lasts until 10 turns pass, the enemy dies, or the Duelist is more than 5 tiles away from the enemy.\n\nFrozen enemies are invulnerable. The Duelist's allies are not frozen by this ability, but if a boss is targeted its minions will not be frozen either.
actors.hero.abilities.duelist.challenge$duelparticipant.name=duel participant
actors.hero.abilities.duelist.challenge$duelparticipant.desc=This character is participating in a duel. They, and any of their allies or minions, are allowed to act normally while others are frozen.\n\nThe duel will last for a set amount of time, until one participant dies, or until the participants move more than 5 tiles away from eachother.\n\nTurns remaining: %d.
actors.hero.abilities.duelist.elementalstrike.name=elemental strike
actors.hero.abilities.duelist.elementalstrike.short_desc=The Duelist performs an _Elemental Strike_, spreading an effect in a conical AOE based on her weapon enchantment.
actors.hero.abilities.duelist.elementalstrike.desc=The Duelist strikes an enemy or location, performing a regular attack that's guaranteed to hit and spreading a magical effect that travels up to 4 tiles in a 65 degree cone. This magical effect varies based on the enchantment on the Duelist's primary weapon.
actors.hero.abilities.duelist.elementalstrike.generic_desc=An elemental strike with no enchantment will release a small burst of magic, dealing 6-12 damage to all enemies in range.
actors.hero.abilities.duelist.feint.name=feint
actors.hero.abilities.duelist.feint.prompt=Choose a location to dash to
actors.hero.abilities.duelist.feint.too_far=That location is not adjacent to you.
actors.hero.abilities.duelist.feint.bad_location=You can't move to that location.
actors.hero.abilities.duelist.feint.short_desc=The Duelist _Feints_, faking an attack while dashing to an adjacent tile. Enemies will attack her afterimage, leaving them open to a counterattack.
actors.hero.abilities.duelist.feint.desc=The Duelist fakes an attack while dashing to an adjacent tile, leaving behind a momentary afterimage of herself. Enemies that were attacking the Duelist will attack her afterimage instead.\n\nEnemies that attack the afterimage become confused, which cancels their next action and leaves them open to a surprise attack.
actors.hero.abilities.ratmogrify.name=ratmogrify
actors.hero.abilities.ratmogrify.cant_transform=You can't ratmogrify that!
actors.hero.abilities.ratmogrify.too_strong=That enemy is too strong to ratmogrify!
actors.hero.abilities.ratmogrify.short_desc=The hero _Ratmogrifies_ an enemy! This temporarily turns them into a rat with no abilities.
actors.hero.abilities.ratmogrify.desc=The hero transforms an enemy into a rat for 6 turns! Bosses, allies, and rats cannot be ratmogrified.\n\nRatmogrified enemies retain their original stats, but do not have any abilities.
actors.hero.abilities.ratmogrify$transmograt.name=ratmogrified %s
actors.hero.abilities.ratmogrify$transmograt.desc=This enemy has been transformed into a rat. A big improvement, if you ask me! - Rat King
actors.hero.abilities.ratmogrify$transmograt.rankings_desc=Slain by: ratmogrified enemy
actors.hero.abilities.ratking.legacywrath.name=divine fury
actors.hero.abilities.ratking.legacywrath.short_desc=I unleash my _Divine Fury_ upon my enemies. It leaves me exposed for a few turns and drains all my armor charge. Everything must come at price!
actors.hero.abilities.ratking.legacywrath.desc=I unlock the ability to channel overwhelming power. With it, I can blink to any nearby location no further than 6 tiles, blinding any enemies adjacent to my old location. Once there, I will cast a spell of magical earth on everyone I can see in 6 tiles area (the effect depends on talents) and create a fan of spectral blades targeting any mob within 6 tiles of me before turning invisible.\n\nThis ability takes 2 turns to leap, 1 turn to rooting earth, and one turn to spectral blades, though using this with no enemies in sight will skip the attacking.\n\nUnfortunately, _I have to use all of my armor charge or 33% of my current HP_ to get enough power for this ability.
actors.hero.hero.name=you
actors.hero.hero.leave=You can't leave yet, the rest of the dungeon awaits below!
actors.hero.hero.level_up=Level up!
actors.hero.hero.new_level=Level up! +Accuracy, +Evasion, +5 HP!
actors.hero.hero.new_talent=+1 Talent Point!
actors.hero.hero.unspent=You have unspent talent points!
actors.hero.hero.level_cap=You cannot grow stronger, but your experiences do give you a surge of power!
actors.hero.hero.you_now_have=you picked up: %s.
actors.hero.hero.you_cant_have=you can't carry: %s.
actors.hero.hero.locked_chest=This chest is locked and you don't have a matching key.
actors.hero.hero.locked_door=You don't have a matching key.
actors.hero.hero.noticed_smth=You noticed something.
actors.hero.hero.wait=...
actors.hero.hero.search=search
actors.hero.hero.search_distracted=It's hard to concentrate, searching is exhausting.
actors.hero.hero.pain_resist=The pain helps you resist the urge to sleep.
actors.hero.hero.revive=The ankh explodes with life-giving energy!
actors.hero.heroclass.warrior=warrior
actors.hero.heroclass.warrior_desc_short=The Warrior endures extra damage with shielding granted by his _broken seal._ The seal can be moved between armors and _transfers a single upgrade._
actors.hero.heroclass.warrior_desc=The Warrior starts with a _unique broken seal_ that generates shielding over his health. The seal can be moved between armors, and can _transfer a single upgrade_ with it.\n\nThe Warrior also starts with a _worn shortsword_, _three throwing stones_, cloth armor, a waterskin, and a velvet pouch.\n\nThe Warrior automatically identifies:\n_-_ Scrolls of Identify\n_-_ Potions of Healing\n_-_ Scrolls of Rage
actors.hero.heroclass.warrior_unlock=The Warrior is automatically unlocked.
actors.hero.heroclass.warrior_perk_desc=The Warrior gains _non-stackable 1 + (5% of current STR rounded down)_ temporary strength within _60 + (5 * current level) turns_ from eating and will be protected from taking any damage for duration of eating.\n\nThe Warrior can blind any enemy for _5 turns_ by throwing non-missiles at it. This ability has _40 turns_ cooldown.\n\nThe Warrior has _15%_ more strength, rounded down.\n\nThe Warrior can transfer any glyphs with his seal.\n\nThe Warrior regenerates his health and shielding _two times_ faster than usual.
actors.hero.heroclass.mage=mage
actors.hero.heroclass.mage_desc_short=The Mage is an arcane expert and carries a _magical staff_ that's stronger than a wand. The staff can be _imbued with any wand_ the Mage finds.
actors.hero.heroclass.mage_desc=The Mage starts with a _unique staff_, which recharges significantly faster than a wand and has 1 more charge. The staff _can be imbued with any wand_ the Mage finds in the dungeon.\n\nThe Mage also starts with a _wand of magic missile_ imbued in his staff, cloth armor, a waterskin, and a velvet pouch.\n\nThe Mage automatically identifies:\n_-_ Scrolls of Identify\n_-_ Potions of Liquid Flame\n_-_ Scrolls of Upgrade
actors.hero.heroclass.mage_unlock=To unlock the Mage _use a scroll of upgrade to make an item stronger._
actors.hero.heroclass.mage_perk_desc=The Mage gets _12 turns_ of recharging from eating.\n\nThe Mage instantly identifies any wands he picks up.\n\nThe Mage can self-target with a wand to convert all of its charges into shielding at a rate of _10.5% max HP per charge_.\n\nWhen the Mage zaps an enemy, he gains mind vision on them for _10 turns_.\n\nWhen the Mage reads a scroll, his next _3 wand zaps_ will get +(hero level/5) levels. He also has _33% chance_ to get scroll from the enemy.
actors.hero.heroclass.rogue=rogue
actors.hero.heroclass.rogue_desc_short=The Rogue can evade enemies and strike from invisibility using his _cloak of shadows._ He also _detects secrets and traps_ from a greater distance.
actors.hero.heroclass.rogue_desc=The Rogue starts with a _unique Cloak of Shadows_, which he can use to become invisible at will.\n\nThe Rogue can _detect secrets and traps_ from a greater distance.\n\nThe Rogue also starts with _a dagger_, _three throwing knives_, cloth armor, a waterskin, and a velvet pouch.\n\nThe Rogue automatically identifies:\n_-_ Scrolls of Identify\n_-_ Potions of Invisibility\n_-_ Scrolls of Magic Mapping
actors.hero.heroclass.rogue_unlock=To unlock the Rogue _perform 10 surprise attacks in one game._
actors.hero.heroclass.rogue_perk_desc=The Rogue will not wake sleeping enemies while he is _3 or more tiles away from them_.\n\nThe Rogue can search in _7x7_ area and will knock adjacent enemies away with chip damage while searching.\n\nThe Rogue can use Cloak of Shadows without equipping it but it will recharge at 66% speed.\n\nOn using Scroll of Upgrade, the Rogue will charge all his wands by _1_ charge and get _10 turns_ worth of artifact recharging.\n\nThe Rogue's bombs deal _150%_ more damage and drop from any enemy with 10% chance.
actors.hero.heroclass.huntress=huntress
actors.hero.heroclass.huntress_desc_short=The Huntress is a master of thrown weapons and has a _magical bow_ with infinite arrows. She also travels through tall grass _without trampling it._
actors.hero.heroclass.huntress_desc=The Huntress starts with a _unique spirit bow_, which can fire an infinite number of conjured arrows.\n\nThe Huntress can travel through tall grass _without trampling it_.\n\nThe Huntress also starts with _studded gloves_, cloth armor, a waterskin, and a velvet pouch.\n\nThe Huntress automatically identifies:\n_-_ Scrolls of Identify\n_-_ Potions of Mind Vision\n_-_ Scrolls of Lullaby
actors.hero.heroclass.huntress_unlock=To unlock the Huntress _hit enemies with thrown weapons 10 times in one game._
actors.hero.heroclass.huntress_perk_desc=The Huntress identifies equipment _3x_ faster.\n\nWhen the Huntress steps on short grass or embers, they spring up into tall grass which the Huntress immediately furrows. This has a _5 turn cooldown_. This talent will produce furrowed grass if passive regeneration effects are disabled or the hero has not gained exp in a long time.\n\nThe Huntress gains mind vision on any enemy within _3 tiles of her position_.\n\nThe Huntress gets _5 turns_ of adrenaline from eating.\n\nThe Huntress has 8% chance to get _1-3_ alchemical energy after killing the enemy.
actors.hero.heroclass.rat_king=rat king
actors.hero.heroclass.rat_king_desc_short=My short description is than I am awesome as king could possibly be!
actors.hero.heroclass.rat_king_desc=Why choose a class when I could just go as myself?\n\nAs myself, I take all the special class items I could find: an old seal, a staff made by some mage, a priceless cloak of shadows from my treasury, and a bow from my armory.\n\nI start with all my class items, obviously. Also I've already acquired all the bags, so I start with those too.\nI can also detect traps and secrets from a greater distance.\
actors.hero.heroclass.rat_king_perk_desc=What? I don't need any help! I am strong enough by myself!
actors.hero.heroclass.duelist=duelist
actors.hero.heroclass.duelist_desc_short=The Duelist is a weapons master who can use her weapon to trigger a _special weapon ability._ This special ability is _different for every weapon._
actors.hero.heroclass.duelist_desc=The Duelist starts with a _unique rapier_ with a special ability that recharges over time.\n\nEvery weapon in the game has a _different special ability_ that the Duelist can use.\n\nThe Duelist also starts with _two throwing spikes_, cloth armor, a waterskin, and a velvet pouch.\n\nThe Duelist automatically identifies:\n_-_ Scrolls of Identify\n_-_ Potions of Strength\n_-_ Scrolls of Mirror Image
actors.hero.heroclass.duelist_unlock=To unlock the Duelist _equip a tier 2 or higher weapon with no strength penalty._
actors.hero.heroclass.duelist_perk_desc=The Duelist gets _2 weapon charge_ and bonus melee damage equal to _level/2_ on eating.\n\nThe Duelist gains one weapon charge every _10 turns_ and deals _+8%_ melee damage when under the effect of wand or artifact recharging buffs.\n\nThe Duelist can switch her equipped weapon instantly _twice within 5 turns_, with a 20 turn cooldown.\nIf this ability is not on cooldown, quick-using an unequipped weapon will equip it.\n\nIf the Duelist's ability manages to kill any enemy, she will restore HP equal to _her level_.\n\nThe Duelist gets _+50%_ enchantment power for her attacks.
actors.hero.herosubclass.gladiator=gladiator
actors.hero.herosubclass.berserker=berserker
actors.hero.herosubclass.berserker_short_desc=The _Berserker_ builds rage as he takes damage. Rage increases his damage and can be activated at 100% for bonus shielding.
actors.hero.herosubclass.berserker_desc=The Berserker gains rage as he takes physical damage, including damage that gets blocked by his armor! Rage steadily fades away over time, but fades more slowly if he is at low HP.\n\nThe Berserker deals up to +50% damage at 100% rage. At 100% rage he can also go berserk, gaining 2-6x his seal's maximum shielding depending on his missing health and keeping his rage at 100% as long as he has shielding left. However, the Berserker needs time to recover after he goes berserk.\n\nHis rage will trigger enchantments and curses up to 60% more frequently and decay much slower.
actors.hero.herosubclass.gladiator_short_desc=The _Gladiator_ builds combo when he makes successful attacks. He can spend combo to use unique abilities.
actors.hero.herosubclass.gladiator_desc=The Gladiator builds one point of combo every time he makes a successful attack with a melee or thrown weapon. If the Gladiator does not make a successful attack within 5 turns, his combo is reset.\n\nAs combo builds it unlocks various abilities which he can spend his combo to use:\n2 Combo: knock enemy back, preserves combo; when combo is 7 or higher, knockback range increases to 3, it inflicts vertigo, and it can knock enemies into pits\n4 Combo: deal damage based on armor\n6 Combo: parry, preserves combo; when combo is 9 or higher, works on multiple attacks\n8 Combo: damage target and nearby enemies\n10 Combo: attack once for each combo\n\nWhen the Gladiator kills an enemy, the combo cooldown for his next hit is increased to _50 turns_.\n\nThe Gladiator can leap up to combo/3 tiles when using combo-spending attacks.
actors.hero.herosubclass.battlemage=battlemage
actors.hero.herosubclass.battlemage_short_desc=The _Battlemage_ conjures bonus effects when fighting in melee with his staff. These effects depend on the wand his staff is imbued with.
actors.hero.herosubclass.battlemage_desc=The Battlemage gains a bonus effect whenever he strikes in melee with his staff, as if his staff had an additional enchantment. These effects depend on the wand his staff is imbued with, every wand has its own effect. In addition to the wand effects, the Battlemage's staff will also gain 0.5 charges when he strikes with it.\n\nThe Battlemage's first melee strike with his staff after zapping with it deals double damage and staff's bonus effect gets +300% power.\n\nStriking with his staff grants the Battlemage _2 turns_ worth of artifact recharging.
actors.hero.herosubclass.warlock=warlock
actors.hero.herosubclass.warlock_short_desc=The _Warlock_ has a chance to soul mark enemies with his wands. He will heal whenever he deals physical damage to marked enemies.
actors.hero.herosubclass.warlock_desc=The Warlock has a chance to inflict a soul mark on characters when he uses wands on them. The chance to apply a soul mark and its duration increase with wand level.\n\nWhen an enemy is soul marked, the Warlock will heal 2 hp for every 5 damage he deals to them, but only with attacks from melee or thrown weapons, not from wands!\n\nWhen a soul marked enemy dies, the Warlock has a _50% chance_ to raise them as a corrupted wraith.\n\nSoul mark grants 1.5 turns of satiety for each physical damage dealt. Soul marked enemies have a 40% chance to trigger on-eat effects when they die.
actors.hero.herosubclass.assassin=hunter
actors.hero.herosubclass.assassin_short_desc=The _Hunter_ marks enemies with his bbat and inflicts debuffs with it.
actors.hero.herosubclass.assassin_desc=The _Hunter_ is trained to control darkness and use it to hunt targets with his bbat. His pet marks enemies and progressively does more damage. When any enemy is marked, the hunter can blink to it, inflicting debuffs and healing bbat depending on strength of mark.
actors.hero.herosubclass.freerunner=freerunner
actors.hero.herosubclass.freerunner_short_desc=The _Freerunner_ builds momentum as he runs, which can be used to start freerunning. This grants him bonus speed and evasion for a short while.
actors.hero.herosubclass.freerunner_desc=As the Freerunner moves he builds stacks of momentum. He can gain up to 10 momentum after running for 10 turns, but rapidly loses it if he stops moving. The freerunner can use up his momentum to start freerunning, for 2 turns per point of momentum.\n\nWhen freerunning the Freerunner moves at 2x speed, and gains bonus evasion in proportion to his level. Once freerunning ends there is a cooldown before momentum can be built again.\n\nWhile freerunning, the Freerunner gains 2x accuracy and +50% damage with thrown weapons.\n\nThe Freerunner moves at 2x speed while invisible, regardless of whether he is freerunning or not.
actors.hero.herosubclass.sniper=sniper
actors.hero.herosubclass.sniper_short_desc=The _Sniper_ can pierce armor with her ranged attacks. After striking with a thrown weapon she can follow up with a special attack from her bow.
actors.hero.herosubclass.sniper_desc=The Sniper is a master of ranged combat, whose ranged attacks pierce enemy armor. When she attacks an enemy with a thrown weapon, she places a sniper's mark on them, which lets her follow up with a special attack from her bow. This special attack varies based on how her bow is augmented.\n\nAn unaugmented bow will fire a snapshot which deals reduced damage but fires instantly. A speed bow will fire a volley of three arrows which deal reduced damage, can still activate enchantments, and take 1 turn to fire. A damage bow will fire a sniper shot which is guaranteed to hit, deals bonus damage based on distance, and takes 2 turns to fire.\n\nThrown weapons have a 100% chance to use the enchantment on the Sniper's bow.\nThis ability does not apply to darts shot from an enchanted crossbow, they already trigger the crossbow's enchantment.\n\nWhen the Sniper attacks with an upgraded thrown weapon, each level increases the duration of sniper's mark by 1 turn and the damage of her special attack by _33%_.
actors.hero.herosubclass.warden=warden
actors.hero.herosubclass.warden_short_desc=The _Warden_ can see through tall grass and gains bonus effects when she plants seeds and tramples plants.
actors.hero.herosubclass.warden_desc=The Warden has a strong connection to nature which grants her a variety of bonus effects relating to grass and plants. She is able to see through tall and furrowed grass as if it were empty space.\n\nThe Warden causes grass to sprout up around any seed she throws or plants, and gains special effects when trampling plants. These special effects replace the regular plant effects, meaning that no plant is harmful for her to step on.\n\nDewdrops can shield the Warden when her health is full, up to _100% of her max HP_.\n\nTipped darts have _5x durability_ when the Warden uses them.
actors.hero.herosubclass.king=rat king
actors.hero.herosubclass.king_short_desc=Choosing is so boring, I'd rather just pick _all the subclasses_...
actors.hero.herosubclass.king_desc=Rat King can use all subclasses at once!\n\nNot all perks are transferred to Rat King's subclass powers.
actors.hero.herosubclass.champion=champion
actors.hero.herosubclass.champion_short_desc=The _Champion_ can wield two weapons and gets more weapon charges. Her regular attacks use her primary weapon, but she can swap weapons and use either weapon's ability.
actors.hero.herosubclass.champion_desc=The Champion is a master of melee weapons who can equip a secondary weapon in addition to her primary one. Her regular attacks use her primary weapon, but she can swap her primary weapon instantly and use either weapon's ability.\n\nShe also gains 2 more max weapon ability charges and +50% weapon ability recharge speed.\n\nIf one of the Champion's two equipped weapons has a lower level and is _the same tier or lower_ than the other weapon, it will be boosted to the other weapon's level.\n\nIf the Champion uses two different weapon abilities successively, the second ability will execute any non-boss enemy left at _below 35% HP_.\n\nThe Champion instantly regains _1 weapon charge_ when she uses two different weapon abilities, with no time limit.
actors.hero.herosubclass.monk=monk
actors.hero.herosubclass.monk_short_desc=The _Monk_ builds energy while fighting. This energy can be spent on a variety of unique abilities.
actors.hero.herosubclass.monk_desc=The Monk is a master of physical technique. As she defeats enemies, she gains energy which can be used on a variety of defensive and utility-focused abilities. This energy does not fade over time, but has a cap based on the Monk's level.\n\n1 Energy: quickly strike with fists\n2 Energy: focus to dodge next attack\n3 Energy: instantly dash nearby\n4 Energy: kick an enemy away\n5 Energy: meditate to restore charges\n\nThe Monk gains _25% more energy_ for each piece of _natural tier 3_ equipment she is using.\nThe Monk gains _50% more energy_ for each piece of _natural tier 2_ equipment she is using.\nThe Monk gains _100%_ for each piece of _natural tier 1_ equipment she is using. She also gains _150% more energy_ if she has no weapon (or ring of force), and gains a free cloth armor and studded gloves.\n\nIf the Monk uses a weapon ability and a _2+ energy_ ability successively, she regains 50% of her spent energy and resets her ability cooldown.\n\nIf the Monk has _70% or more energy_, her abilities are empowered. When empowered:\n- Flurry applies enchantments at 75% power\n- Focus is instantaneous\n- Dash gains +2 range\n- Dragon Kick deals +33% damage and applies its knock back and stun effect to all adjacent enemies\n- Meditate slowly heals 20% of missing HP and grants 80% damage resistance.
actors.hero.talent$provokedangertracker.name=provoked anger
actors.hero.talent$provokedangertracker.desc=The Warrior has recently lost his shielding, his next physical attack will deal bonus damage.\n\nTurns remaining: %s.
actors.hero.talent$lingeringmagictracker.name=lingering magic
actors.hero.talent$lingeringmagictracker.desc=The Mage has recently used a staff or wand, his next physical attack will deal bonus damage.\n\nTurns remaining: %s.
actors.hero.talent$followupstriketracker.name=followup strike
actors.hero.talent$followupstriketracker.desc=The Huntress has recently attacked an enemy with a thrown weapon, her next melee attack against the same target will have boosted damage.\n\nTurns remaining: %s.
actors.hero.talent$patientstriketracker.name=patient strike
actors.hero.talent$patientstriketracker.desc=The Duelist has just spent a turn waiting, her next melee attack will deal bonus damage.
