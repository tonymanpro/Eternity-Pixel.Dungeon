###blobs
actors.blobs.blizzard.name=bufera
actors.blobs.blizzard.desc=Qui sta turbinando una bufera.

actors.blobs.confusiongas.name=gas della confusione
actors.blobs.confusiongas.desc=Qui sta turbinando una nube di gas della confusione.

actors.blobs.electricity.name=elettricità
actors.blobs.electricity.desc=Un campo elettrico sta scintillando vivamente in questo punto.
actors.blobs.electricity.rankings_desc=Fulminato
actors.blobs.electricity.ondeath=Sei stato folgorato a morte...

actors.blobs.fire.name=fuoco
actors.blobs.fire.desc=Qui sta infuriando un incendio.

actors.blobs.foliage.name=fogliame
actors.blobs.foliage.desc=Raggi di luce perforano l'oscurità del giardino sotterraneo.

actors.blobs.freezing.name=aria gelida
actors.blobs.freezing.desc=L'aria è innaturalmente gelida in questo punto.

actors.blobs.goowarn.name=energia oscura
actors.blobs.goowarn.desc=Qui stanno sciamando particelle di energia oscura!

actors.blobs.inferno.name=inferno
actors.blobs.inferno.desc=Qui sta infuriando un inferno di fiamme.

actors.blobs.paralyticgas.name=gas paralizzante
actors.blobs.paralyticgas.desc=Qui sta turbinando una nube di gas paralizzante.

actors.blobs.regrowth.name=ricrescita

actors.blobs.sacrificialfire.name=fuoco sacrificale
actors.blobs.sacrificialfire.desc=Qui c'è un altare con una fiamma sacrificale. Ogni creatura uccisa qui verrà consumata come offerta agli spiriti del dungeon. Forse una ricompensa verrà garantita dopo abbastanza sacrifici?
actors.blobs.sacrificialfire.worthy=Il fuoco consuma la tua offerta e cresce.
actors.blobs.sacrificialfire.unworthy=Il fuoco consuma la tua offerta, ma non cambia.
actors.blobs.sacrificialfire.reward=Il fuoco si illumina e poi scompare, lasciando una ricompensa!

actors.blobs.smokescreen.name=Cortina fumogena
actors.blobs.smokescreen.desc=Qui sta turbinando una spessa nube di fumo nero.

actors.blobs.stenchgas.name=gas maleodorante
actors.blobs.stenchgas.desc=Qui sta turbinando una nube di tanfo fetido.

actors.blobs.stormcloud.name=nuvole di tempesta
actors.blobs.stormcloud.desc=Qui sta turbinando una nube di vapore acqueo tremolante.

actors.blobs.toxicgas.name=gas tossico
actors.blobs.toxicgas.desc=Qui sta turbinando una nube verdognola di gas tossico.
actors.blobs.toxicgas.rankings_desc=Soffocato
actors.blobs.toxicgas.ondeath=Sei morto per il gas tossico...

actors.blobs.corrosivegas.name=gas corrosivo
actors.blobs.corrosivegas.desc=Qui sta turbinando una nube di gas caustico letale.

actors.blobs.waterofawareness.name=acqua della conoscenza
actors.blobs.waterofawareness.procced=Appena bevi un sorso, avverti la conoscenza fluire nella tua mente.
actors.blobs.waterofawareness.desc=Il potere della conoscenza si irradia dall'acqua di questo pozzo. Bere dal pozzo identificherà immediatamente tutto l'equipaggiamento indossato, rivelerà le maledizioni su tutti gli oggetti nel tuo inventario e mostrerà tutti gli oggetti sul piano corrente.

actors.blobs.waterofhealth.name=acqua della salute
actors.blobs.waterofhealth.procced=Appena bevi un sorso, senti le tue ferite guarire completamente.
actors.blobs.waterofhealth.desc=Il potere della salute irradia dall'acqua di questo pozzo. Bere dal pozzo curerà le tue ferite, soddisferà la fame e purificherà le maledizioni su qualsiasi oggetto indossato.

actors.blobs.web.name=ragnatela
actors.blobs.web.desc=Qui tutto è coperto da una fitta ragnatela. Qualunque cosa tocchi o impatti la ragnatela la romperà, ma resterà a sua volta intrappolata e bloccata.



###buffs
actors.buffs.adrenaline.name=adrenalina
actors.buffs.adrenaline.desc=Un'ondata di potenza fisica, adrenalina migliora sia l'attacco che la velocità di movimento.\n\nAdrenalina permette al suo bersaglio di correre a 2x della velocità e attaccare a 1.5x della stessa.\n\nTurni rimanenti: %s.

actors.buffs.adrenalinesurge.name=bonus di forza
actors.buffs.adrenalinesurge.desc=Un'ondata di grande potenza, purtroppo non permanente.\n\nIncremento di forza: +%d.\nTurni rimanenti: %s.

actors.buffs.amok.name=frenesia
actors.buffs.amok.desc=La frenesia provoca uno stato di grande rabbia e confusione nell'obbiettivo.\n\nQuando una creatura è resa frenetica, attaccherà tutto ciò che le sta vicino, siano essi amici o nemici.\n\nTurni di frenesia rimanenti: %s.

actors.buffs.arcanearmor.name=armatura arcana
actors.buffs.arcanearmor.desc=Un esile scudo ti circonda, bloccando parte del danno proveniente da attacchi magici.\n\nLa tua armatura magica è attualmente incrementata di: 0-%d.\n\nTurni rimanenti prima che l'armatura arcana si indebolisca: %s.

actors.buffs.artifactrecharge.name=ricarica dell'artefatto
actors.buffs.artifactrecharge.desc=L'energia scorre dentro di te aumentando la velocità a cui gli artefatti equpaggiati si ricaricano.\n\nOgni artefatto è influenzato in modo leggermente diverso, ma tutti guadagneranno carica molto più velocemente del normale.\n\nTurni rimanenti: %s.

actors.buffs.ascensionchallenge.name=maledizione dell'amuleto
actors.buffs.ascensionchallenge.desc=In qualche modo Yog-Dzewa sta mantenendo l'influenza su questo mondo attraverso l'amuleto e sta cercando di fermare la tua ascesa!Il potere di Yog sta rendendo il dungeon molto più pericoloso, aumentando il numero di nemici e rendendoli più forti! Questo potere continuerà a crescere sempre di più, può essere indebolito solo sconfiggendo i nemici che sono stati potenziati dal potere di Yog.
actors.buffs.ascensionchallenge.desc_clear=L'energia oscura proveniente dall'amuleto è stata indebolita il più possibile per ora.
actors.buffs.ascensionchallenge.desc_beckon=L'amuleto ora sta _richiamando nemici distanti,_ rendendo nota la tua posizione.
actors.buffs.ascensionchallenge.desc_haste=L'amuleto ora sta _rendendo più rapidi i nemici distanti,_ in modo che ti raggiungano più in fretta!
actors.buffs.ascensionchallenge.desc_slow=L'amuleto ora ti sta _rendendo più lento,_ e negando ogni effetto di aumento della velocità!
actors.buffs.ascensionchallenge.desc_damage=L'energia dell'amuleto è diventata così forte che ti sta _danneggiando direttamente!_
actors.buffs.ascensionchallenge.beckon=L'amuleto inizia a richiamare i nemici distanti.
actors.buffs.ascensionchallenge.haste=L'amuleto inizia a rendere più rapidi i nemici distanti!
actors.buffs.ascensionchallenge.slow=L'amuleto inizia a pesare come piombo nel tuo inventario!
actors.buffs.ascensionchallenge.damage=L'amuleto inizia a irradiare energia oscura. Brucia!
actors.buffs.ascensionchallenge.weaken_info=La maledizione dell'amuleto può essere indebolita sconfiggendo più nemici.
actors.buffs.ascensionchallenge.weaken_info_no_kills=Sconfiggendo nemici, indebolirai la maledizione dell'amuleto!
actors.buffs.ascensionchallenge.weaken=Riesci a sentire la maledizione dell'amuleto diminuire leggermente.
actors.buffs.ascensionchallenge.break=Ti fermi un attimo per riprendere fiato e senti le tue ferite che si richiudono!
actors.buffs.ascensionchallenge.almost=Senti la presa di Yog sull'amuleto diminuire, ci sei quasi!
actors.buffs.ascensionchallenge.on_kill=L'energia oscura ti consuma...

actors.buffs.barkskin.name=pelle coriacea
actors.buffs.barkskin.desc=La tua pelle è indurita, sembra ruvida e solida come una corteccia.\n\nLa pelle indurita aumenta la tua armatura effettiva, permettendoti di difenderti meglio dagli attacchi fisici.\n\nLa tua armatura è attualmente aumentata di: 0-%d.\nTurni rimanenti: %s.\n\nSe ricevi pelle coriacea da più fonti, verrà applicata solo quella più forte.

actors.buffs.barrier.name=barriera
actors.buffs.barrier.desc=Una bolla di energia duratura che blocca tutti i danni.\n\nLa barriera assorbirà i danni per qualsiasi cosa stia proteggendo, fintanto che ci sarà scudo rimanente. Lo scudo decadrà lentamente nel tempo.\n\nScudo rimanente: %d.

actors.buffs.berserk.angered=arrabbiato
actors.buffs.berserk.berserk=furia
actors.buffs.berserk.exhausted=esausto
actors.buffs.berserk.recovering=recupero
actors.buffs.berserk.angered_desc=La gravità delle ferite del Berserker rafforza i suoi colpi. Mano a mano che il Berserker riceve danno fisico la sua rabbia si svilupperà, concedendogli danno bonus. I danni bloccati dall'armatura contano comunque al fine dello sviluppo di rabbia.\n\nLa rabbia si affievolirà nel tempo. Più bassa è la salute del Berserker, più a lungo durerà.\n\nAl 100 %% di rabbia, il Berserker può andare in furia, garantendogli scudo in base al livello della sua armatura e alla sua vita mancante. Mentre la furia è attiva, lo scudo decade nel tempo e quando si esaurisce dovrà riposarsi prima di sviluppare nuovamente rabbia.\n\nRabbia attuale: _%1$.0f%%_\n_+%2$.0f%%_ danni\n\nScudo della furia con l'attuale armatura e punti vita: _%3$d_
actors.buffs.berserk.berserk_desc=Paura ed incertezza svaniscono, lasciando solo rabbia. In questo stato il Berserker è incredibilmente potente, _arrecando +50%% punti danno e acquisendo scudo bonus,_ perdendo tuttavia scudo ogni turno. \n\nQuando tutto lo scudo è ridotto a zero, la furia terminerà. \n\nDopo la furia, il Berserker avrà bisogno di recuperare energia prima di poter accumulare rabbia di nuovo. \n\nScudo Rimanente: %d
actors.buffs.berserk.recovering_desc=La forza interiore ha i suoi limiti. Il Berserker deve riposare prima di poter usare la sua rabbia di nuovo.\n\nMentre recupera energia il Berserker non accumula nessuna rabbia ricevendo danni.
actors.buffs.berserk.recovering_desc_turns=Turni fino al recupero: _%d_
actors.buffs.berserk.recovering_desc_levels=Livelli fino al recupero: _%.2f_
actors.buffs.berserk.rankings_desc=Morto in Berserk
actors.buffs.berserk.action_name=Furia
actors.buffs.berserk.no_seal=Hai bisogno del tuo sigillo per la furia!

actors.buffs.bleeding.name=sanguinante
actors.buffs.bleeding.ondeath=Morte per dissanguamento...
actors.buffs.bleeding.heromsg=Stai sanguinando!
actors.buffs.bleeding.rankings_desc=Morto dissanguato
actors.buffs.bleeding.desc=Da quella ferita sta fuoriuscendo una quantità preoccupante di sangue.\n\nIl sanguinamento causa danno ad ogni turno. A ogni turno il danno cala di una quantità casuale finché il sanguinamento cessa.\n\nDanno da sanguinamento attuale: %d.

actors.buffs.bless.name=benedetto
actors.buffs.bless.desc=Una grande esplosione di concentrazione, alcuni dicono sia ispirata dagli dei.\n\nLa benedizione accresce notevolmente la precisione e l'evasività del 25%%, rendendo il benedetto molto più efficace in combattimento.\n\nTurni di benedizione rimasti: %s.

actors.buffs.blindness.name=accecato
actors.buffs.blindness.heromsg=Sei accecato!
actors.buffs.blindness.desc=Accecamento rende il mondo circostante una foschia oscura.\n\nMentre è accecato, la distanza di visione di un personaggio è ridotta ad una casella, rendendo inutili gli attacchi a distanza e rendendo molto facile il perdere traccia dei nemici distanti. In più, un eroe accecato non è in grado di leggere pergamene o libri.\n\nTurni di accecamento rimanenti: %s.

actors.buffs.buff.heromsg=

actors.buffs.burning.name=in fiamme
actors.buffs.burning.heromsg=Hai preso fuoco!
actors.buffs.burning.burnsup=%s brucia!
actors.buffs.burning.ondeath=Morte per ustione...
actors.buffs.burning.rankings_desc=Ridotto in cenere
actors.buffs.burning.desc=Poche cose sono più dolorose dell'essere avvolti dalle fiamme.\n\nIl fuoco ti danneggerà ad ogni turno finché non verrà spento dall'acqua o si estingue. Il fuoco può essere estinto passando sull'acqua o dallo spruzzo di di una pozione frantumata.\n\nInoltre il fuoco può bruciare il terreno infiammabile o oggetti con cui viene in contatto.\n\nTurni di fuoco rimasti: %s.

actors.buffs.championenemy.warn=Avverti una presenza mortale.
actors.buffs.championenemy$blazing.name=Campione ardente
actors.buffs.championenemy$blazing.desc=I Campioni ardenti infliggono il 25% di danni da mischia in più, incendiano i nemici che attaccano, sono immuni al fuoco, e spargono fiamme intorno a sé quando muoiono. Tuttavia non possono diffondere il fuoco sull'acqua.
actors.buffs.championenemy$projecting.name=Campione aggressivo
actors.buffs.championenemy$projecting.desc=I Campioni aggressivi infliggono il 25% di danni da mischia in più e hanno un raggio di attacco di +3.
actors.buffs.championenemy$antimagic.name=Campione antimagico
actors.buffs.championenemy$antimagic.desc=I Campioni antimagici subiscono il 50% di danni in meno e sono completamente immuni agli effetti magici.
actors.buffs.championenemy$giant.name=Campione gigante
actors.buffs.championenemy$giant.desc=I Campioni giganti subiscono il 80% di danni in meno e hanno una portata d'attacco di +1, ma non possono passare attraverso gli spazi ristretti.
actors.buffs.championenemy$blessed.name=Campione benedetto
actors.buffs.championenemy$blessed.desc=I Campioni benedetti hanno 4x di precisione ed evasione in più.
actors.buffs.championenemy$growing.name= Campione crescente
actors.buffs.championenemy$growing.desc=I Campioni crescenti ottengono un bonus in costante crescita di precisione, evasione, danno fisico, e una riduzione dei danni subiti.\n\nAttuale incremento di precisione/evasione/danni: %1$d%%\nAttuale riduzione dei danni subiti: %2$d%%

actors.buffs.charm.name=ammaliato
actors.buffs.charm.heromsg=Sei ammaliato!
actors.buffs.charm.cant_attack=Sei affascinato da quel nemico e non puoi attaccarlo.
actors.buffs.charm.desc=Una malia è una magia manipolativa che può far sì che i nemici si adorino temporaneamente l'un l'altro.\n\nI personaggi affetti da malia sono incapaci di attaccare direttamente il nemico da cui sono ammaliati. È comunque possibile attaccare altri bersagli. Lo shock del dolore diminuirà la durata della malia.\n\nTurni di malia rimanenti: %s.

actors.buffs.chill.name=freddo
actors.buffs.chill.freezes=%s congela!
actors.buffs.chill.desc=Non proprio congelato, ma comunque parecchio freddo. \n\nI bersagli ghiacciati compiono tutte le azioni più lentamente, a seconda di quanti turni rimangono all'effetto. Nel peggiore dei casi è equivalente ad essere rallentati. \n\nTurni di ghiaccio rimanenti: %1$s.\nVelocità ridotta di: %2$s%%

actors.buffs.combo.name=combo
actors.buffs.combo.action_name=Attacco combo
actors.buffs.combo.combo=Combo da %d colpi!
actors.buffs.combo.bad_target=Devi bersagliare un nemico a portata d'attacco.
actors.buffs.combo.prompt=Seleziona un bersaglio per attaccare.
actors.buffs.combo.desc=Il Gladiatore accumula slancio mettendo a segno colpi vincenti. Ogni attacco andato a segno aumenta i punti combo di uno, ma se passa troppo tempo tra i colpi i punti combo verranno resettati a 0. Finchè il Gladiatore ha punti combo, ogni punto scudo fornito dal sigillo rotto non decadrà. \n\nAccumulare punti combo sblocca attacchi speciali che non possono fallire! Un nuovo attacco diventa disponibile quando si raggiungono i 2, 4, 6, 8 e 10 punti combo. Alcune mosse resettano i punti combo, mentre altre no, ma ciascuna mossa può essere utilizzata solo una volta per sessione combo.\n\nPunti combo attuali:%1$d.\n\nTurni al reset dei punti combo:%2$s.
actors.buffs.combo$combomove.clobber.name=pestare
actors.buffs.combo$combomove.clobber.desc=Spinge un nemico indietro di 2 caselle, ma non infligge danno e non può spingere dentro le buche. Incrementa la combo di 1.
actors.buffs.combo$combomove.clobber.empower_desc=Respinge indietro un nemico di _3 caselle, provoca vertigini e può cadere nelle fosse_, ma non infligge danni. Incrementa la combo di 1.
actors.buffs.combo$combomove.slam.name=schianto
actors.buffs.combo$combomove.slam.desc=Infligge %d%%(combo*20%%) del tuo potere di blocco dei danni come danni bonus. Resetta la combo quando usata.
actors.buffs.combo$combomove.slam.empower_desc=_Salta fino a %1$d caselle_ e infligge %2$d%% (combo*20 %%) del tuo potere di blocco dei danni come danno bonus. Resetta la combo quando utilizzata.
actors.buffs.combo$combomove.parry.name=parata
actors.buffs.combo$combomove.parry.desc=Blocca il prossimo attacco entro un turno da quando attivata e contrattacca immediatamente. Resetta la combo se non viene parato nulla.
actors.buffs.combo$combomove.parry.empower_desc=Blocca _tutti gli attacchi_ entro 1 turno quando viene attivato e reagisce immediatamente ad essi. Reimposta la combo se non viene parato nulla.
actors.buffs.combo$combomove.crush.name=schiacciata
actors.buffs.combo$combomove.crush.desc=Infligge %d%% (combo*25%%) del tuo danno sul bersaglio primario e metà di quel danno a tutti gli altri nemici in un area di effetto 7x7. Resetta la combo quando usata.
actors.buffs.combo$combomove.crush.empower_desc=_Salta fino a %1$d caselle_ e infligge %2$d%% (combo*25%%) danni al bersaglio primario e metà del danno a tutti gli altri nemici in un'area di 7x7. Reimposta la combo quando utilizzata.
actors.buffs.combo$combomove.fury.name=furia
actors.buffs.combo$combomove.fury.desc=Colpisce un nemico una volta per ogni combo che hai, ogni colpo infligge il 60% di danno e può applicare gli incantamenti. Resetta la combo quando usata.
actors.buffs.combo$combomove.fury.empower_desc=_Salta fino a %d caselle_ e colpisce un nemico una volta per ogni combo che hai, ogni colpo infligge 60%% danni e può attivare incantesimi. Reimposta la combo quando utilizzata.

actors.buffs.corruption.name=corrotto
actors.buffs.corruption.desc=La corruzione penetra l'essenza di un essere, torcendoli contro la loro originaria natura.\n\nLe creature corrotte attaccheranno ed esaspereranno i loro alleati, ignorando i precedenti nemici. La corruzione è anche dannosa e causerà un lento deterioramento del bersaglio.\n\nLa corruzione è permanente, i suoi effetti terminano solo con la morte.

actors.buffs.cripple.name=azzoppato
actors.buffs.cripple.heromsg=Sei azzoppato!
actors.buffs.cripple.desc=Sei abbastanza sicuro che le gambe non debbano piegarsi in quel modo.\n\nEssere azzoppato dimezza la velocità di movimento, così spostarsi di una casella normalmente impiega due turni invece di uno.\n\nTurni di azzoppato rimanenti: %s.

actors.buffs.daze.name=confuso
actors.buffs.daze.heromsg=Sei confuso!
actors.buffs.daze.desc=Orecchie che fischiano e visione oscurata rendono difficile combattere.\n\nQuando confuso, accuratezza ed evasione sono ridotte di 50%%, rendendo sia colpire che evadere gli attacchi molto più difficile.\n\nTurni di confusione rimanenti: %s.

actors.buffs.degrade.name=deteriorato
actors.buffs.degrade.heromsg=Il tuo equipaggiamento sembra indebolito!
actors.buffs.degrade.desc=Potente magia oscura sta interferendo con la forza delle pergamene di miglioramento infuse nel tuo equipaggiamento!\n\nMentre sei deteriorato, l'attrezzatura migliorata verrà considerata come se fosse di un livello più basso di quello reale. _Ogni miglioramento dopo il +3 è reso esponenzialmente più debole del precedente._ Le descrizioni dei tuoi oggetti cambieranno per riflettere il loro ridotto livello di potere.\n\nLa degradazione non coinvolge i requisiti di forza, le cariche delle bacchette, la durevolezza delle armi da lancio o gli artefatti.\n\nTurni di degradazione rimanenti: %s. Usare una pergamena di miglioramento o di rimuovi maledizione fermerà la degradazione immediatamente.

actors.buffs.doom.name=condannato
actors.buffs.doom.desc=È arduo proseguire quando sembra che l'universo ti voglia morto.\n\nI personaggi condannati riceveranno +67% di danno da tutte le fonti.\n\nLa condanna è permanente, i suoi effetti cessano solo con la morte.

actors.buffs.dread.name=terrore
actors.buffs.dread.desc=Un terrore così grande che causerà la fuga del bersaglio dal dungeon! \n\nCreature affette da terrore scapperanno dal loro avversario a gran velocità, e scompariranno completamente dal dungeon una volta che saranno fuori dal campo visivo. Nemici sconfitti in questo modo daranno metà dell'esperienza e non lasceranno oggetti. Lo shock del dolore diminuirà la durata del terrore.\n\nTurno di terrore rimanenti: %d.

actors.buffs.drowsy.name=sonnolento
actors.buffs.drowsy.desc=Una forza magica rende difficile restare sveglio, dopo pochi turni il bersaglio cadrà in un sonno magico profondo.\n\nL'eroe può resistere alla sonnolenza subendo danni o rimanendo al massimo della salute.\n\nTurni fino al sonno: %s.

actors.buffs.earthimbue.name=impregnato con la terra
actors.buffs.earthimbue.desc=Sei impregnato del potere della terra!\n\nOgni attacco fisico sposterà la terra sotto i piedi del nemico, azzoppandolo per un breve periodo di tempo.\n\nTurni di impregnamento con la terra restanti: %s.

actors.buffs.enhancedrings.name=anelli potenziati
actors.buffs.enhancedrings.desc=L'artefatto usato di recente dal Ladro sta potenziando i suoi anelli, garantendo loro +1 livello.\n\nTurni rimanenti: %s.

actors.buffs.fireimbue.name=impregnato con il fuoco
actors.buffs.fireimbue.desc=Sei impregnato del potere del fuoco!\n\nTutti gli attacchi fisici hanno la probabilità di infiammare il nemico. Inoltre sei completamente immune agli effetti del fuoco.\n\nTurni di impregnamento del fuoco rimasti: %s.

actors.buffs.foresight.name=preveggenza
actors.buffs.foresight.desc=In qualche modo riesci a vedere nella tua mente la conformazione del terreno intorno a te.\n\nMentre sei sotto l'effetto della preveggenza, ti vengono rivelate tutte le mattonelle che si trovano entro un largo raggio, comprese le trappole e le porte nascoste.\n\nTurni di preveggenza rimanenti: %s

actors.buffs.frost.name=congelato
actors.buffs.frost.freezes=%s congela!
actors.buffs.frost.desc=Da non confondersi con il congelamento completo, questo congelamento più benigno racchiude semplicemente il bersaglio nel ghiaccio.\n\nCongelamento agisce in modo simile a paralisi, rendendo impossibile al bersaglio agire. A differenza di paralisi, congelamento viene immediatamente annullato se il bersaglio subisce danni, poiché il ghiaccio andrà in frantumi.\n\nTurni di congelamento rimanenti: %s.

actors.buffs.frostimbue.name=impregnato con il gelo
actors.buffs.frostimbue.desc=Sei impregnato del potere del ghiaccio!\n\nTutti gli attacchi fisici raffredderanno costantemente i nemici. Inoltre sei completamente immune al freddo.\n\nTurni di impregnamento del gelo rimanenti: %s.

actors.buffs.fury.name=furioso
actors.buffs.fury.heromsg=Sei diventato furioso!
actors.buffs.fury.desc=Sei arrabbiato, ai nemici non piaci quando sei arrabbiato.\n\nUna grande rabbia ti brucia dentro, aumentando il danno arrecato con attacchi fisici del 50%%\n\nQuesta rabbia durerà fintanto che sarai ferito sotto al 50%% di salute.

actors.buffs.blobimmunity.name=barriera della purificazione
actors.buffs.blobimmunity.desc=Qualche strana forza ti racchiude in una sottile barriera protettiva, bloccando ogni effetto gassoso dannoso.\n\nSei immune a tutti gli effetti attivi in zona finché questa barriera persiste.\n\nTurni di immunità rimanenti: %s.

actors.buffs.gravitychaostracker.name=caos gravitazionale
actors.buffs.gravitychaostracker.desc_intro=Durante qualche turno tutti i personaggi sul livello attuale del dungeon saranno lanciati in una direzione casuale.
actors.buffs.gravitychaostracker.desc_positive=Tuttavia, tu e i tuoi alleati sembrate esserne immuni.
actors.buffs.gravitychaostracker.desc_duration=Non è chiaro quanto durerà questo effetto, ma non durerà per sempre.

actors.buffs.greaterhaste.name=fretta maggiore
actors.buffs.greaterhaste.desc=Un incredibile aumento di velocità, per un attimo sembra che tutto il resto sia fermo.\n\nMentre si è sotto l'effetto della celerità maggiore, le azioni di movimento non richiedono alcun tempo, ma le altre azioni vengono comunque eseguite a velocità normale. Ogni passo di movimento consuma un turno di maggiore rapidità.\n\nTurni di maggiore fretta rimanenti: %d.

actors.buffs.haste.name=fretta
actors.buffs.haste.desc=L'energia scorre nei tuoi muscoli, permettendoti di correre a velocità incredibili!\n\nMentre sei sotto l'effetto di Fretta correrai a 3x della velocità, ma eseguirai ogni altra attività a velocità normale.\n\nTurni di Fretta rimanenti: %s.

actors.buffs.healing.name=guarigione
actors.buffs.healing.desc=Una medicazione magica rende possibile le ferite chiudersi e la carne ricucirsi.\n\nA ogni turno la salute si rigenererà costantemente fino a quando l'effetto svanisce. La quantità di guarigione può affievolirsi nel tempo.\n\nProssima cura: %d.\n\nGuarigione rimanente: %d.

actors.buffs.herodisguise.name=travestimento
actors.buffs.herodisguise.desc=La magia illusoria ha alterato il tuo aspetto fisico! L'effetto è puramente estetico, ma sembra molto strano a prescindere.\n\nTurni di travestimento rimanenti: %s.

actors.buffs.hex.name=maledetto
actors.buffs.hex.heromsg=Sei stato maledetto!
actors.buffs.hex.desc=Magia oscura che interferisce con la concentrazione, così da rendere il bersaglio piuttosto disorientato.\n\nMaledire riduce l'accuratezza e l'evasione di 20%%, rendendo il bersaglio meno efficace in combattimento.\n\nTurni di maleficio rimanenti: %s.

actors.buffs.holdfast.name=tener duro
actors.buffs.holdfast.desc=Il Guerriero mantiene la sua posizione, aumentando la sua armatura di %1$d-%2$de rallentando la velocità di decadimento di alcuni potenziamenti di %3$d%%. Questo durerà finché non si muoverà.

actors.buffs.hunger.hungry=affamato
actors.buffs.hunger.starving=morendo di fame
actors.buffs.hunger.onhungry=Hai fame...
actors.buffs.hunger.onstarving=Stai morendo di fame!
actors.buffs.hunger.ondeath=Morte per fame...
actors.buffs.hunger.cursedhorn=Il corno maledetto ruba un po' di energia dal cibo mentre lo stai mangiando.
actors.buffs.hunger.rankings_desc=Morto di fame
actors.buffs.hunger.desc_intro_hungry=Puoi sentire il tuo stomaco rumoreggiare chiedendo cibo ma non è troppo urgente per ora.
actors.buffs.hunger.desc_intro_starving=Hai così fame da sentirti male.
actors.buffs.hunger.desc=\n\nLa fame aumenta lentamente man mano che trascorri del tempo nel dungeon, alla fine comincerai a morire di fame. Mentre muori di fame perderai lentamente salute invece di rigenerarla.\n\nIl razionamento è importante! Se si dispone di salute da sacrificare, morire di fame non è una cattiva idea se ciò implica che ci sarà più cibo in seguito. Razionare efficacemente il cibo può significare farlo durare molto più a lungo!

actors.buffs.invisibility.name=invisibile
actors.buffs.invisibility.desc=Sei completamente mimetizzato con il terreno circostante, rendendoti impossibile da vedere.\n\nMentre sei invisibile i nemici non sono in grado di attaccarti o seguirti. Attacchi fisici ed effetti magici (come quelli di pergamene e bacchette magiche) cancelleranno immediatamente l'invisibilità.\n\nTurni di invisibilità rimanenti: %s.

actors.buffs.invulnerability.name=invincibile
actors.buffs.invulnerability.desc=Questo personaggio è pervaso da un grande potere protettivo, che gli conferisce un breve periodo di invulnerabilità!\n\nTurni rimanenti: %s

actors.buffs.levitation.name=levitazione
actors.buffs.levitation.desc=Una forza magica ti sta facendo levitare sul terreno, facendoti sentire senza peso.\n\nI personaggi in levitazione si muovono silenziosamente e ignorano tutti gli effetti a terra. Le trappole non si attiveranno, l'acqua non spegnerà il fuoco, le piante non verranno calpestate, le radici mancheranno e le fosse saranno sospese. Fai attenzione, poiché tutte queste cose possono entrare in vigore nel momento in cui termina la levitazione!\n\nTurni di levitazione rimanenti: %s.

actors.buffs.lifelink.name=connessione vitale
actors.buffs.lifelink.ondeath=Il danno di connessione vitale ti ha ucciso...
actors.buffs.lifelink.desc=La forza vitale di questo personaggio è connessa a un altro personaggio nelle vicinanze. Qualunque danno subito è condiviso tra loro.\n\nOgni volta che questo personaggio subisce un danno, metà di esso sarà invece inflitto alla vita del bersaglio connesso.\n\nTurni di connessione vitale rimanenti: %s.

actors.buffs.light.name=illuminato
actors.buffs.light.desc=Anche nel dungeon più oscuro, una luce salda al tuo fianco è sempre confortante.\n\nLa luce aiuta a tenere a bada le tenebre, permettendoti di vedere a una ragionevole distanza nonostante l'ambiente.\n\nTurni di illuminazione rimanenti: %s.

actors.buffs.lockedfloor.name=il piano è bloccato
actors.buffs.lockedfloor.desc=Il livello attuale è bloccato e non puoi lasciarlo!\n\nMentre un livello è bloccato, la fame non progredirà e non subirai danni da fame estrema. Inoltre, se non procederai nello sconfiggere il boss del livello, anche gli effetti passivi di rigenerazione cesseranno.\n\nPer di più, se vieni resuscitato da una ankh non benedetta mentre il livello è bloccato, esso verrà resettato.\n\nUccidi il boss del livello per rompere il lucchetto.

actors.buffs.lostinventory.name=zaino perduto
actors.buffs.lostinventory.desc=Il tuo zaino è andato perduto da qualche parte nel dungeon! Non potrai raccogliere né usare la maggior parte degli oggetti finché non lo ritrovi.

actors.buffs.magicalsight.name=vista magica
actors.buffs.magicalsight.desc=In qualche modo sei in grado di vedere con la tua mente, piuttosto che con i tuoi occhi.\n\nMentre la vista magica è attiva, sarai in grado di vedere attraverso tutto il terreno in un raggio di 12 tessere.\n\nGiri di vista magica rimanenti: %s.

actors.buffs.magicalsleep.name=sonno magico
actors.buffs.magicalsleep.toohealthy=Sei troppo in salute e resisti al desiderio di dormire.
actors.buffs.magicalsleep.fallasleep=Cadi in un profondo sonno magico.
actors.buffs.magicalsleep.wakeup=Ti risvegli sentendoti ristorato e in salute.
actors.buffs.magicalsleep.desc=Questo personaggio è caduto in un profondo sonno magico da cui non si sveglierà naturalmente.\n\nIl sonno magico è simile al sonno normale, eccetto che solo i danni saranno in grado di svegliare il bersaglio.\n\nPer l'eroe e i suoi alleati, il sonno magico ha proprietà ricostituenti, permettendogli di guarire rapidamente mentre si risposano.

actors.buffs.magicimmune.name=immune alla magia
actors.buffs.magicimmune.desc=Tutti gli effetti magici perdono la loro presa su di te, sei completamente indifferente ad essi.\n\nMentre sei immune alla magia tutti gli effetti magici maligni o benevoli non avranno effetto su di te, inclusi malefici, incantamenti, bacchette, pergamene, anelli, artefatti, ecc. Le abilità eroiche dell'armatura sono abbastanza forti da funzionare indipendentemente da questo effetto.\n\nTurni di immunità alla magia rimanenti: %s.

actors.buffs.mindvision.name=visione mentale
actors.buffs.mindvision.desc=In qualche modo sei in grado di vedere tutte le creature del piano nella tua mente. È una strana sensazione.\n\nTutti personaggi presenti nel piano sono a te visibili finché hai la visione mentale. Vedere una creatura attraverso visione mentale conta come vista o nelle vicinanze per le finalità di molti effetti magici.\n\nTurni di visione mentale rimanenti: %s.

actors.buffs.momentum.momentum=accumulare slancio
actors.buffs.momentum.running=corsa libera
actors.buffs.momentum.resting=recupero
actors.buffs.momentum.action_name=corsa libera
actors.buffs.momentum.momentum_desc=Quando si muove, il Corridore accumula slancio, che può spendere per iniziare una corsa libera.\n\nOgni punto di slancio garantisce due turni di corsa libera, e il Corrridore può accumulare fino a 10 punti. La quantità di slancio diminuisce rapidamente quando il Corridore smette di muoversi.\n\nPunti slancio attuali: %d
actors.buffs.momentum.running_desc=Quando si muove, il Corridore accumula slancio, che può spendere per iniziare una corsa libera.\n\nDurante una corsa libera, il Corridore si muove a velocità doppia e ottiene un bonus di evasione basato sul suo livello.\n\nTurni rimanenti: %d.
actors.buffs.momentum.resting_desc=Quando si muove, il Corridore accumula slancio, che può spendere per iniziare una corsa libera.\n\nIl Corridore ha bisogno di tempo per recuperare le energie, prima di poter accumulare nuovamente slancio.\n\nTurni rimanenti: %d.

actors.buffs.monkenergy.name=energia
actors.buffs.monkenergy.action=Abilità della Monaca
actors.buffs.monkenergy.desc=Quando sconfigge un nemico, la Monaca guadagna energia che può usare su varie abilità. La maggior parte dei nemici sconfitti fornisce 1 energia, e la Monaca non perde energia nel tempo.\n\nEnergia attuale: %1$d/%2$d.
actors.buffs.monkenergy.desc_cooldown=La monaca ha utilizzato recentemente un'abilità e deve aspettare prima di usarne un'altra.\n\nTurni rimanenti: %d turni.
actors.buffs.monkenergy$monkability$flurry.name=raffica di colpi
actors.buffs.monkenergy$monkability$flurry.desc=Due attacchi istantanei infliggono %1$d-%2$d danni e ignorano l'armatura. Questa capacità non può essere utilizzata ripetutamente.
actors.buffs.monkenergy$monkability$flurry.empower_desc=Due attacchi istantanei che infliggono %1$d-%2$d danni, ignorano l'armatura _e utilizzano l'incantesimo della tua arma._ Questa abilità non può essere utilizzata ripetutamente.
actors.buffs.monkenergy$monkability$focus.name=concentrazione
actors.buffs.monkenergy$monkability$focus.desc=La monaca si prende un turno di concentrazione, permettendole di parare il successivo attacco sferrato contro di lei.
actors.buffs.monkenergy$monkability$focus.empower_desc=La Monaca _si concentra istantaneamente_, permettendole di parare il successivo attacco sferrato contro di lei.
actors.buffs.monkenergy$monkability$focus$focusbuff.name=concentrata
actors.buffs.monkenergy$monkability$focus$focusbuff.desc=La Monaca si concentra sui suoi dintorni, così da anticipare il prossimo attacco sferrato contro di lei. Mentre è concentrata, è garantita di parare il prossimo attacco.
actors.buffs.monkenergy$monkability$dash.name=scatto
actors.buffs.monkenergy$monkability$dash.prompt=Scegli una Posizione
actors.buffs.monkenergy$monkability$dash.desc=Uno scatto istantaneo fino a 4 caselle di distanza. Questa abilità può oltrepassare i pericoli, ma non può attraversare nemici o terreni solidi.
actors.buffs.monkenergy$monkability$dash.empower_desc=Uno scatto istantaneo fino a _8 caselle_ di distanza. Questa abilità può superare i pericoli, ma non i nemici o il terreno solido.
actors.buffs.monkenergy$monkability$dragonkick.name=calcio del drago
actors.buffs.monkenergy$monkability$dragonkick.desc=Un calcio devastante che infligge %1$d-%2$d di danno e ignora l'armatura. Il calcio spinge via i bersagli e li paralizza per ogni casella che percorrono.
actors.buffs.monkenergy$monkability$dragonkick.empower_desc=Un calcio devastante che infligge _%1$d-%2$d danni_ e ignora l'armatura. Il calcio respinge _tutti i bersagli adiacenti_ e li paralizza per ogni tessera che percorrono.
actors.buffs.monkenergy$monkability$meditate.name=meditazione
actors.buffs.monkenergy$monkability$meditate.desc=La Monaca focalizza energia nel suo corpo per 5 turni. Questo libera dalla maggior parte degli effetti negativi e le fornisce 8 turni di ricarica per bacchette e artefatti.
actors.buffs.monkenergy$monkability$meditate.empower_desc=La Monaca concentra l'energia nel suo corpo per 5 turni. Questo elimina la maggior parte degli effetti negativi e le garantisce 8 turni di ricarica della bacchetta e degli artefatti. _Ottiene anche l'80% di resistenza ai danni mentre medita e guarisce lentamente per il 20% dei suoi HP mancanti._

actors.buffs.ooze.name=melma caustica
actors.buffs.ooze.heromsg=La melma caustica consuma le tue carni. Lavala via!
actors.buffs.ooze.ondeath=Ti sei squagliato...
actors.buffs.ooze.rankings_desc=Disciolto
actors.buffs.ooze.desc=Questo acido appiccicoso si aggrappa alla carne, sciogliendola lentamente via.\n\nLa melma infliggerà danno consistente nel tempo, ma può venire immediatamente lavata via dall'acqua.\n\nTurni di melma rimanenti: %s.

actors.buffs.paralysis.name=paralizzato
actors.buffs.paralysis.heromsg=Sei paralizzato!
actors.buffs.paralysis.out=resiste alla paralisi
actors.buffs.paralysis.desc=Spesso la peggior cosa da fare è nulla di nulla.\n\nParalisi ferma completamente tutte le azioni, forzando il bersaglio ad aspettare finché l'effetto svanisce. Il dolore causato dal subire danni può provocare ai personaggi l'uscita repentina dalla paralisi.\n\nTurni di paralisi rimanenti: %s.

actors.buffs.physicalempower.name=potenziato fisicamente
actors.buffs.physicalempower.desc=I tuoi colpi sono stati potenziati, aumentando la quantità di danni che puoi infliggere quando colpisci i nemici con gli attacchi fisici.\n\nDanni bonus: %1$d.\nColpi rimanenti: %2$d.

actors.buffs.pincushion.name=puntaspilli
actors.buffs.pincushion.desc=Le armi da lancio che hai usato contro questa creatura sono incastrate e cadranno a terra quando l'avrai sconfitta.\n\nI seguenti oggetti sono attaccati:

actors.buffs.poison.name=avvelenato
actors.buffs.poison.heromsg=Sei avvelenato!
actors.buffs.poison.ondeath=Morte per il veleno...
actors.buffs.poison.rankings_desc=Sopraffatto dal veleno
actors.buffs.poison.desc=Il veleno si fa strada nel corpo, compromettendo lentamente il suo funzionamento interno.\n\nIl veleno arreca danni ad ogni turno proporzionalmente al tempo mancante alla sua scadenza.\n\nTurni di veleno rimasti: %s.

actors.buffs.preparation.name=preparazione
actors.buffs.preparation.action_name=colpo preparato
actors.buffs.preparation.desc=L'Assassino aspetta pazientemente, preparandosi a colpire dalle ombre.
actors.buffs.preparation.desc_dmg=Il suo prossimo attacco infliggerà _%1$d%% danni bonus_, e giustizierà i nemici normali che hanno meno di _%2$d%% HP_ oppure boss che hanno meno di _%3$d%% HP_.
actors.buffs.preparation.desc_dmg_likely=L'attacco sarà anche più probabilmente capace di infliggere una maggiore quantità di danni.
actors.buffs.preparation.desc_blink=È in grado di scattare verso un nemico prima di colpirlo,  con distanza massima di _%d._
actors.buffs.preparation.desc_invis_time=L'eroe è invisibile da _%d_ turni.
actors.buffs.preparation.desc_invis_next=L'eroe eseguirà un attacco più violento tra _%d_ turni.
actors.buffs.preparation.prompt=Seleziona un bersaglio da attaccare!\nMassima distanza di scatto: %d
actors.buffs.preparation.no_target=Non c'è niente da attaccare in quel punto.
actors.buffs.preparation.out_of_reach=Quel bersaglio è fuori portata.
actors.buffs.preparation.assassinated=assassinato

actors.buffs.prismaticguard.name=guardia prismatica
actors.buffs.prismaticguard.desc=Sei protetto da un'immagine prismatica attualmente inattiva. Quando i nemici saranno presenti l'immagine prismatica entrerà in azione proteggendoti!\n\nMentre è inattiva, l'immagine prismatica guarirà costantemente da ogni danno ricevuto.\n\nSalute attuale: %d/%d.
actors.buffs.prismaticguard.desc_many=Anche l'immagine prismatica trae beneficio dal Potere di Molti. Turni Rimanenti: %d.

actors.buffs.recharging.name=ricarica
actors.buffs.recharging.desc=L'energia ti scorre attraverso, migliorando il tasso di ricarica di bacchette e bastoni.\n\nA ogni turno questo stato attivo aumenterà la carica attuale di un quarto, in aggiunta alla normale ricarica.\n\nTurni di ricarica rimanenti: %s.

actors.buffs.revealedarea.name=area rivelata
actors.buffs.revealedarea.desc=Un'area del sotterraneo è stata temporaneamente mostrata all'eroe. La vedrai in qualsiasi luogo ti troverai. \n\nTurni rimanenti: %s.

actors.buffs.revealedchar.name=rivelato
actors.buffs.revealedchar.desc=La posizione di questo personaggio è stata rivelata all'eroe. Lo vedrai in qualunque luogo si troverà.\n\nTurni rimanenti: %s.

actors.buffs.roots.name=radicato
actors.buffs.roots.heromsg=Non puoi muoverti!
actors.buffs.roots.desc=Radici (magiche o naturali) ti afferrano i piedi, costringendoli a terra.\n\nLe radici bloccano un bersaglio in posizione, rendendo impossibile il movimento e la maggior parte delle abilità di movimento. Altre azioni non sono influenzate, inclusi gli effetti di teletrasporto.\n\nTurni di radice rimanente: %s.

actors.buffs.scrollempower.name=rafforzamento delle pergamene
actors.buffs.scrollempower.desc=L'energia della pergamena appena letta potenzia le bacchette del Mago!\n\nAumento livello: +%1$d,\nColpi rimanenti: %2$d

actors.buffs.shadows.name=fuso con le ombre
actors.buffs.shadows.desc=Ti confondi con le ombre intorno a te, conferendoti invisibilità e il rallentamento del metabolismo.\n\nMentre sei invisibile i nemici sono incapaci di attaccarti o seguirti. La maggior parte degli attacchi fisici e degli effetti magici (come quelli di pergamene e bacchette magiche) annulleranno immediatamente l'invisibilità. Inoltre, mentre sei fuso con le ombre, la tua fame rallenta.\n\nRimarrai fuso con le ombre fino a quando non lascerai l'oscurità o se un nemico entra in contatto con te.

actors.buffs.slow.name=rallentato
actors.buffs.slow.desc=Una magia rallentante influisce sullo scorrere del tempo del bersaglio, per esso ogni cosa si muove velocissima.\n\nUn personaggio rallentato esegue tutte le azioni nel doppio del tempo che impiegherebbe normalmente.\n\nTurni di rallentamento rimanenti: %s.

actors.buffs.snipersmark.name=marchio del cecchino
actors.buffs.snipersmark.action_name_snapshot=colpo rapido
actors.buffs.snipersmark.action_name_volley=raffica
actors.buffs.snipersmark.action_name_sniper=colpo da cecchino
actors.buffs.snipersmark.desc=Il Cecchino si concentra sul bersaglio più recente. È in grado di eseguire un attacco speciale con il suo arco, che varierà in base a come esso verrà incrementato.\n\nUn arco non incrementato scoccherà uno _scatto,_ che infligge danni ridotti ma non impiega alcun tempo per essere lanciato.\n\nUn arco incrementato per la velocità scoccherà una _raffica_ di tre frecce. Ogni freccia infliggerà danni ridotti, ma potrà comunque attivare l'incantamento. Tale raffica impiega 1 turno per il lancio.\n\nUn arco incrementato per danno scoccherà un _tiro del cecchino._ Tale colpo va sempre a segno, infligge danni bonus in base alla distanza dal bersaglio e impiega 2 turni per il lancio.\n\nTurni rimanenti: %s.

actors.buffs.soulmark.name=marchio dell'anima
actors.buffs.soulmark.desc=Lo Stregone si è connesso all'anima di questa creatura; ciò gli permette di guarire quando la creatura subisce attacchi fisici. \n\nTurni di marchio dell'anima rimanenti: %s.

actors.buffs.stamina.name=energia
actors.buffs.stamina.desc=Possiedi una resistenza infinita, che ti permette movimenti più veloci!\n\nMentre sei sotto l'effetto di resistenza correrai +50%% più veloce, ma eseguirai ogni altra azione a velocità normale.\n\nTurni di resistenza rimanenti: %s.

actors.buffs.vulnerable.name=vulnerabile
actors.buffs.vulnerable.heromsg=Ti senti fragile!
actors.buffs.vulnerable.desc=La magia di vulnerabilità aumenta del 33%% tutti danni fisici che un personaggio riceve, al netto dei danni ridotti dall'armatura.\n\nTurni di vulnerabilità rimanenti: %s.

actors.buffs.terror.name=terrorizzato
actors.buffs.terror.desc=Terrore è una magia manipolativa che induce il suo bersaglio a un panico incontrollabile.\n\nI personaggi terrorizzati sono costretti a fuggire dai propri avversari, nel tentativo di mettere tra loro più porte e pareti possibile. Tuttavia lo shock del dolore diminuirà la durata dell'effetto.\n\nTurni di terrore rimanenti: %s.

actors.buffs.toxicimbue.name=impregnato con tossicità
actors.buffs.toxicimbue.desc=Sei impregnato di energia velenosa!\n\nCome ti muovi attorno ondate di gas tossico si alzeranno davanti a te, danneggiando i tuoi nemici. Sei immune al gas tossico e al veleno per tutta la durata dell'effetto e per alcuni turni successivi.\n\nTurni di impregnamento tossico rimanenti: %s.

actors.buffs.corrosion.name=corrosione
actors.buffs.corrosion.heromsg=Ti stai sciogliendo!
actors.buffs.corrosion.ondeath=Ti sei squagliato...
actors.buffs.corrosion.rankings_desc=Disciolto
actors.buffs.corrosion.desc=Il potente acido dissolve carne, metallo ed ossa ad un ritmo allarmante.\n\nIl danno da corrosione aumenta nel tempo, via via che il bersaglio continua a dissolversi.\n\nTurni di corrosione rimanenti: %1$s.\nDanno da corrosione attuale: %2$d.

actors.buffs.vertigo.name=confusione
actors.buffs.vertigo.desc=Camminare diritti può essere difficile quando il mondo intero sta vorticando.\n\nSotto l'effetto di vertigine, individui che tentano di muoversi procederanno in direzione casuale, al posto di quella che intendono intraprendere.\n\nTurni di vertigine rimanenti: %s.

actors.buffs.wandempower.name=bacchette potenziate
actors.buffs.wandempower.desc=Il danno inflitto dalle bacchette è stato potenziato, aumentando la quantità di danno che infliggono per alcuni colpi.\n\nDanno bonus: %1$d.\nColpi rimanenti: %2$d.

actors.buffs.weakness.name=indebolito
actors.buffs.weakness.heromsg=Ti senti indebolito!
actors.buffs.weakness.desc=Ogni cosa pare improvvisamente molto più pesante.\n\nLa magia indebolente riduce la forza fisica del personaggio, causandogli un decremento del 33%% dei danni inflitti.\n\nTurni di debolezza rimanenti: 2%s.

actors.buffs.wellfed.name=ben nutrito
actors.buffs.wellfed.desc=Ti senti davvero soddisfatto e sazio.\n\nFinché sei ben nutrito la tua fame non aumenterà e verrai guarito di un ammontare extra nel tempo.\n\nTurni restanti: %d.



###hero

##abilities
actors.hero.abilities.armorability.self_target=Non puoi puntarlo su te stesso!
actors.hero.abilities.armorability.no_target=Non c'è niente da prendere di mira lì!
actors.hero.abilities.armorability.prompt=Scegli un punto da prendere di mira
actors.hero.abilities.armorability.cost=Costa _%d_ cariche.

actors.hero.abilities.warrior.heroicleap.name=Balzo Eroico
actors.hero.abilities.warrior.heroicleap.prompt=Scegli la direzione verso cui balzare
actors.hero.abilities.warrior.heroicleap.short_desc=Il Guerriero esegue un _Balzo Eroico_ verso una destinazione specificata, volando al di sopra di nemici e pericoli.
actors.hero.abilities.warrior.heroicleap.desc=Il Guerriero balza verso una destinazione specificata, superando qualsiasi nemico o pericolo lungo la strada. Non può tuttavia attraversare muri o altri ostacoli solidi.
actors.hero.abilities.warrior.shockwave.name=onda d'urto
actors.hero.abilities.warrior.shockwave.short_desc=Il Guerriero, colpendo il suolo, genera un'_Onda d'urto_ in un'area conica. I nemici colpiti dall'onda d'urto vengono danneggiati e paralizzati.
actors.hero.abilities.warrior.shockwave.desc=Il Guerriero Colpisce il terreno con violenza, causando un'onda d'urto che percorre fino a  5 mattonelle in un cono di 60 gradi.\n\nI nemici colpiti dall'onda d'urto sono azzoppati per 5 turni; Inoltre ricevono 5-10 danni più 1-2 danni aggiuntivi per ogni punto di Forza del Guerriero superiore a 10.
actors.hero.abilities.warrior.endure.name=incassare
actors.hero.abilities.warrior.endure$enduretracker.name=resistenza
actors.hero.abilities.warrior.endure$enduretracker.desc=Il Guerriero ora infliggerà danni bonus basati sul danno che ha incassato.\n\nDanno Bonus: %1$d\nColpi rimanenti: %2$d
actors.hero.abilities.warrior.endure.short_desc=Il Guerriero _Incassa_, saltando diversi turni ma ottenendo un'elevata resistenza ai danni. Dopodiché, infligge danni bonus in base al danno incassato.
actors.hero.abilities.warrior.endure.desc=Il Guerriero sopporta i colpi per 3 turni, ricevendo metà dei danni qualunque sia la causa. Questa riduzione è applicata prima degli effetti di resistenza al danno come l'armatura.\n\nDopo aver sopportato, il primo colpo a segno entro 10 turni avrà un danno bonus pari a metà del danno ricevuto dal guerriero durante la sopportazione, prima di qualunque effetto di riduzione del danno!\n\nSe il Guerriero ha una combo, usare questa abilità prolungherà il suo tempo rimanente di 3 turni.

actors.hero.abilities.mage.elementalblast.name=Esplosione Elementale
actors.hero.abilities.mage.elementalblast.no_staff=Non puoi usare questa abilità senza la tua staffa.
actors.hero.abilities.mage.elementalblast.short_desc=Il Mago sprigiona un'_Esplosione Elementale_ dal suo bastone, investendo una vasta area intorno a lui con un effetto che varia in base alla bacchetta infusa nel bastone.
actors.hero.abilities.mage.elementalblast.desc=Il Mago emana un'esplosione di magia che copre un'area circolare avente raggio di 4 caselle e provoca 15-25 danni. L'effetto specifico dell'Esplosione Elementale varia a seconda della bacchetta instillata nel bastone del mago.
actors.hero.abilities.mage.elementalblast.generic_desc=L'effetto dell'Esplosione Elementale è simile all'effetto sprigionato dalla bacchetta quando viene utilizzata per colpire un nemico o  un alleato.
actors.hero.abilities.mage.wildmagic.name=magia selvaggia
actors.hero.abilities.mage.wildmagic.no_wands=Non hai alcuna bacchetta con cui attaccare!
actors.hero.abilities.mage.wildmagic.short_desc=Il mago scatena la _Magia Selvaggia_ contenuta nelle sue bacchette, colpendo più volte in un singolo turno un bersaglio scelto. Le bacchette vengono utilizzate casualmente.
actors.hero.abilities.mage.wildmagic.desc=Il Mago scatena il potere delle sue bacchette, sparandole casualmente fino a 4 volte in un solo turno. Il bastone del Mago non è incluso in questo effetto.\n\nOgni bacchetta ha il suo livello potenziato di 2, fino a +3. Questa abilità utilizza mezza carica della bacchetta per ogni colpo e nessuna bacchetta può essere sparata più di 2 volte.
actors.hero.abilities.mage.warpbeacon.name=tele-faro
actors.hero.abilities.mage.warpbeacon.depths=Non puoi spostarti tra piani diversi!
actors.hero.abilities.mage.warpbeacon.locked_floor=Non puoi abbandonare un piano bloccato!
actors.hero.abilities.mage.warpbeacon.too_far=La destinazione è troppo lontana!
actors.hero.abilities.mage.warpbeacon.invalid_beacon=Non puoi piazzare un faro qui!
actors.hero.abilities.mage.warpbeacon.window_desc=Il tuo faro al momento è piazzato al piano %d.
actors.hero.abilities.mage.warpbeacon.window_tele=teletrasportati al faro
actors.hero.abilities.mage.warpbeacon.window_clear=spegni il faro
actors.hero.abilities.mage.warpbeacon.window_cancel=annulla
actors.hero.abilities.mage.warpbeacon.short_desc=Il Mago piazza un _Tele-faro_ nella posizione attuale, e in seguito può teletrasportarsi lì istantaneamente.
actors.hero.abilities.mage.warpbeacon.desc=Il Mago piazza un faro, e potrà teletrasportarsi lì quando vorrà. Il posizionamento del faro occupa 1 turno, ma il teletrasporto è istantaneo.\n\nIl Mago di default non può teletrasportarsi tra piani diversi o utilizzare il faro per raggiungere luoghi inaccessibili come le stanze chiuse a chiave. Il Mago può teletrasportarsi sui nemici, e ciò li spingerà da una parte.

actors.hero.abilities.rogue.smokebomb.name=bomba fumogena
actors.hero.abilities.rogue.smokebomb.fov=Puoi saltare solo verso uno spazio libero all'interno del tuo campo visivo
actors.hero.abilities.rogue.smokebomb.prompt=Scegli un luogo in cui saltare
actors.hero.abilities.rogue.smokebomb$ninjalog.name=esca in legno
actors.hero.abilities.rogue.smokebomb$ninjalog.desc=In qualche modo, i nemici si convincono facilmente che questa esca di legno sia il vero Ladro!
actors.hero.abilities.rogue.smokebomb$ninjalog.discover_hint=Puoi trovare questo personaggio con un'abilità dell'armatura dell'eroe specifica.
actors.hero.abilities.rogue.smokebomb.short_desc=I Ladro getta a terra una _Bomba Fumogena_ e scompare. I nemici che si trovano vicini alla sua precedente posizione vengono accecati.
actors.hero.abilities.rogue.smokebomb.desc=Il Ladro getta una bomba fumogena e in un attimo si allontana di 6 caselle. Può superare pericoli e nemici ma non passare attraverso ostacoli spessi, come i muri.\n\nI nemici che si trovano nelle caselle adiacenti alla posizione originaria del Ladro rimangono accecati per 5 turni.
actors.hero.abilities.rogue.deathmark.name=marchio della morte
actors.hero.abilities.rogue.deathmark.ally_target=Puoi marchiare solo i nemici
actors.hero.abilities.rogue.deathmark.short_desc=Il Ladro pone un _Marchio della Morte_ su un nemico scelto. I nemici marchiati subiscono danni bonus, ma non possono morire finché il marchio non svanisce.
actors.hero.abilities.rogue.deathmark.desc=Il Ladro pone un marchio su un nemico, facendogli subire il 25% di danni extra. Il marchio viene applicato istantaneamente e dura 5 turni.\n\nI nemici marchiati subiscono danni bonus ma non possono morire finché il marchio non svanisce. Se un nemico ha 0 HP quando il marchio svanisce, morirà istantaneamente
actors.hero.abilities.rogue.deathmark$deathmarktracker.name=marchio della morte
actors.hero.abilities.rogue.deathmark$deathmarktracker.desc=Questo nemico è stato marchiato, perciò subirà 25 %% di danni bonus, ma non potrà morire finché il marchio non svanisce.\n\nTurni rimanenti:%s.
actors.hero.abilities.rogue.shadowclone.name=clone ombra
actors.hero.abilities.rogue.shadowclone.short_desc=Il Ladro evoca un _Clone Ombra_, che può essere controllato per fornire aiuto in combattimento.
actors.hero.abilities.rogue.shadowclone.desc=Il Ladro evoca un'imitazione oscura di se stesso, che può essere diretto per aiutarlo in combattimento. Dirigere il clone ombra non costa alcuna carica.\n\nIl clone ha 80 punti vita, nessuna armatura e infligge 10-20 danni. Tutti questi tratti possono essere migliorati con i talenti, in modo tale che il clone tragga vantaggio dalle armi e dall'armatura dell'eroe.
actors.hero.abilities.rogue.shadowclone$shadowally.name=ladro d'ombra
actors.hero.abilities.rogue.shadowclone$shadowally.direct_defend=Il tuo clone si muove in quella posizione.
actors.hero.abilities.rogue.shadowclone$shadowally.direct_follow=Il clone ti sta seguendo.
actors.hero.abilities.rogue.shadowclone$shadowally.direct_attack=Il clone sta andando ad attaccare un nemico!
actors.hero.abilities.rogue.shadowclone$shadowally.desc=Una copia del Ladro, composta di tenebrose oscurità. Resta in piedi, immobile, con occhi vuoti e con minuscoli lembi di oscurità che come vapore risalgono.\n\nIl clone non è una copia perfetta del Ladro, tuttavia è un discreto combattente e può trarre beneficio dall'equipaggiamento del Ladro, con i giusti talenti.
actors.hero.abilities.rogue.shadowclone$shadowally.discover_hint=Puoi trovare questo personaggio con un'abilità dell'armatura dell'eroe specifica.

actors.hero.abilities.huntress.spectralblades.name=lame spettrali
actors.hero.abilities.huntress.spectralblades.short_desc=La Cacciatrice lancia contro un bersaglio delle _Lame Spettrali_, e i danni inflitti dipendono dall'arma da mischia equipaggiata in quel momento.
actors.hero.abilities.huntress.spectralblades.desc=La Cacciatrice lancia contro un nemico una Lama Spettrale, che si comporta come se fosse un attacco a distanza fatto con un'armada mischia. Vengono attivati tutti i normali effetti di un attacco da mischia, inclusi gli incantamenti.
actors.hero.abilities.huntress.naturespower.name=potere della natura
actors.hero.abilities.huntress.naturespower.short_desc=La Cacciatrice evoca il _Potere della Natura_, che aumenta la sua velocità di movimento e la velocità di fuoco del suo arco per un breve lasso di tempo.
actors.hero.abilities.huntress.naturespower.desc=La Cacciatrice rinforza temporaneamente se stessa ed il suo arco grazie ai poteri della natura! Questo dura per 8 turni.\n\nDurante questo tempo, la Cacciatrice si muove a velocità 2x ed attacca il 33% più velocemente con il suo arco. Il bonus all'arco non si applica se la Tiratrice Scelta sta usando i suoi attacchi speciali.
actors.hero.abilities.huntress.naturespower$naturespowertracker.name=Potere della Natura
actors.hero.abilities.huntress.naturespower$naturespowertracker.desc=La Cacciatrice è potenziata per breve tempo. Incrementa la sua velocità di movimento e la velocità d'attacco del suo arco.\n\nTurni rimanenti: %s.
actors.hero.abilities.huntress.spirithawk.name=Spirito del Falco
actors.hero.abilities.huntress.spirithawk.no_space=Non c'è alcuno spazio libero attorno a te.
actors.hero.abilities.huntress.spirithawk.short_desc=La Cacciatrice evoca il familiare _Spirito del Falco_, che la può aiutare esplorando nuove aree e distraendo i nemici.
actors.hero.abilities.huntress.spirithawk.desc=La Cacciatrice evoca lo spirito famiglio di un falco, che si può  indirizzare usando di nuovo l'abilità dopo che è stato evocato. Il falco dura per 100 turni, comandarlo non costa alcuna carica.\n\nIl falco ha salute e potere d'attacco minimi, però è veloce, sfuggente e preciso; Condivide tutto il suo campo visivo con la Cacciatrice durante tutto il tempo in cui è attivo; E' immune a tutti gli effetti di area, come il fuoco ed il gas tossico. Non attacca, a meno che non gli sia espressamente ordinato di farlo.
actors.hero.abilities.huntress.spirithawk$hawkally.name=Spirito del Falco
actors.hero.abilities.huntress.spirithawk$hawkally.direct_defend=Il tuo falco si muove in quella posizione.
actors.hero.abilities.huntress.spirithawk$hawkally.direct_follow=Il falco ti sta seguendo.
actors.hero.abilities.huntress.spirithawk$hawkally.direct_attack=Il falco sta andando ad attaccare un nemico!
actors.hero.abilities.huntress.spirithawk$hawkally.desc=Un falco magico evocato dalla Cacciatrice. Emette un'etereo bagliore blu, e il suo capo si volge costantemente intorno per sorvegliare l'area circostante.\n\nNon è un valido combattente, ma la sua velocità e la vista acuta lo rendono un eccellente esploratore e gli permettono di distrarre facilmente i nemici.
actors.hero.abilities.huntress.spirithawk$hawkally.desc_remaining=Turni rimanenti: %d.
actors.hero.abilities.huntress.spirithawk$hawkally.desc_dodges=Il Falco schiverà di sicuro ancora %d attacchi.
actors.hero.abilities.huntress.spirithawk$hawkally.discover_hint=Puoi trovare questo personaggio con un'abilità dell'armatura dell'eroe specifica.

actors.hero.abilities.duelist.challenge.name=sfida
actors.hero.abilities.duelist.challenge.prompt=Scegli un nemico da sfidare
actors.hero.abilities.duelist.challenge.already_dueling=Puoi partecipare ad un solo duello alla volta.
actors.hero.abilities.duelist.challenge.ally_target=Puoi sfidare soltanto i nemici.
actors.hero.abilities.duelist.challenge.unreachable_target=Devi essere in grado di raggiungere il tuo bersaglio.
actors.hero.abilities.duelist.challenge.distant_target=Quel nemico è troppo lontano per essere sfidato.
actors.hero.abilities.duelist.challenge.short_desc=La Duellante _Sfida_ un nemico nelle vicinanze ad un duello, congelando temporaneamente tutti gli altri nemici.
actors.hero.abilities.duelist.challenge.desc=La Duellante sfida a duello un nemico vicino. Quel nemico è costretto a combatterla mentre tutti gli altri nemici sono temporaneamente congelati nel tempo.\n\nIl bersaglio deve essere raggiungibile ed entro 5 caselle dalla Duellante. Il duello dura fino a quando non passano 10 turni, il nemico muore o la Duellante si trova a più di 5 caselle dal nemico.\n\nI nemici congelati sono invulnerabili. Gli alleati della Duellante non vengono congelati da questa abilità, ma se un boss viene preso di mira, nemmeno i suoi servitori verranno congelati.
actors.hero.abilities.duelist.challenge$duelparticipant.name=partecipante al duello
actors.hero.abilities.duelist.challenge$duelparticipant.desc=Questo personaggio sta partecipando a un duello. Loro, e tutti i loro alleati o servitori, possono agire normalmente mentre gli altri sono congelati.\n\nIl duello durerà per un determinato periodo di tempo, fino alla morte di un partecipante o fino a quando i partecipanti non si allontaneranno di più di 5 caselle l'uno dall'altro.\n\nTurni rimasti: %d.
actors.hero.abilities.duelist.elementalstrike.name=colpo elementale
actors.hero.abilities.duelist.elementalstrike.short_desc=La Duellante esegue un _Colpo Elementale_, diffondendo un effetto in un'area ad effetto conica basata sull'incantamento della sua arma.
actors.hero.abilities.duelist.elementalstrike.desc=La Duellante colpisce un nemico o una posizione, eseguendo un attacco che ha la garanzia di colpire e diffondendo un effetto magico che colpisce fino a 4 caselle in un cono di 65 gradi. Questo effetto magico varia in base all'incantesimo sull'arma principale della Duellante.
actors.hero.abilities.duelist.elementalstrike.generic_desc=Un colpo elementale senza incantamento rilascerà una piccola esplosione di magia, infliggendo 6-12 danni a tutti i nemici nel raggio d'azione.
actors.hero.abilities.duelist.feint.name=finta
actors.hero.abilities.duelist.feint.prompt=Scegli un luogo in cui scattare
actors.hero.abilities.duelist.feint.too_far=Quella posizione non è adiacente a te.
actors.hero.abilities.duelist.feint.bad_location=Non puoi muoverti in quella posizione.
actors.hero.abilities.duelist.feint.short_desc=La Duellante _Finta_, simulando un attacco mentre scatta in una casella adiacente. I nemici attaccheranno la sua immagine, lasciandosi scoperti per un contrattacco.
actors.hero.abilities.duelist.feint.desc=La Duellante finge un attacco mentre si lancia in una casella confinante, lasciandosi dietro un'immagine riflessa di sé stessa. I nemici che stavano attaccando la Duellante attaccheranno l'immagine riflessa.\n\nI nemici che attaccano l'immagine riflessa diventano confusi, cancellando la loro prossima azione e li lascia scoperti per un attacco a sorpresa.

actors.hero.abilities.cleric.ascendedform.name=forma ascesa
actors.hero.abilities.cleric.ascendedform.short_desc=Il Chierico assume una _Forma Ascesa_, guadagnando nuovi incantesimi, raggio di attacco e protezione.
actors.hero.abilities.cleric.ascendedform.desc=Il Chierico proietta energia sacra da se stesso, assumendo una forma radiosa estesa per 10 turni. Mentre è in questa forma il Chierico può lanciare nuovi incantesimi, ottiene 2 di portata di attacco, 30 di scudo e qualsiasi incantesimo aggiuntivo lanciato garantirà 10 di scudo per carica del Tomo Sacro utilizzata.\n\nLa protezione dalla forma ascesa e i suoi incantesimi non decadono normalmente, ma svaniranno immediatamente una volta terminata la forma ascesa. L'abilità può essere riutilizzata per aggiornare la durata della forma ascesa.
actors.hero.abilities.cleric.ascendedform$ascendbuff.name=forma ascesa
actors.hero.abilities.cleric.ascendedform$ascendbuff.desc=L'energia radiante viene emanata dal corpo del Chierico. Mentre è in questa forma, il Chierico ottiene 2 di portata di attacco (dall'energia sacra che proietta da lui) e 10 di scudo ogni volta che spende una carica del Tomo Sacro. Sono anche in grado di lanciare gli incantesimi sbloccati tramite i talenti della forma ascesa.\n\nLo scudo concesso dalla forma ascesa e i suoi incantesimi non decadranno normalmente, ma svaniranno istantaneamente quando la forma ascesa termina.\n\nSchermatura attuale: %1$d.\nTurni rimanenti: %2$d.
actors.hero.abilities.cleric.trinity.name=Trinità
actors.hero.abilities.cleric.trinity.no_imbue=Trinità non ha attualmente alcun effetto impostato per nessuna delle sue forme, usa uno dei suoi incantesimi!
actors.hero.abilities.cleric.trinity.no_duplicate=Trinità non può duplicare un effetto che hai già equipaggiato!
actors.hero.abilities.cleric.trinity.ench_glyph_use=Trinità applicherà questo effetto per _%1$d turni_ al costo di _%2$s cariche._
actors.hero.abilities.cleric.trinity.rare_ench_glyph_use=Trinità applicherà questo _potente_ effetto per _%1$d turni_ al costo di _%2$s cariche.
actors.hero.abilities.cleric.trinity.wand_use=Trinità colpirà con questa bacchetta a _+%1$d_ al costo di _%2$s cariche._
actors.hero.abilities.cleric.trinity.wand_multi_use=Trinità colpirà con questa bacchetta _multi-carica_ a _+%1$d_ al costo di _%2$s cariche._
actors.hero.abilities.cleric.trinity.thrown_use=Trinità lancerà quest'arma a _+%1$d_ al costo di _%2$s cariche._
actors.hero.abilities.cleric.trinity.ring_use=Trinità applicherà l'effetto di questo anello a _+%1$d_ per 20 turni al costo di _%2$s cariche._
actors.hero.abilities.cleric.trinity.alchemiststoolkit_use=Trinità applicherà l'effetto alchemico a distanza di questo artefatto, al costo di _%2$s cariche._
actors.hero.abilities.cleric.trinity.chaliceofblood_use=Trinità applicherà l'effetto di rigenerazione passiva della vita di questo artefatto a _+%1$d_ per 20 turni al costo di _%2$s cariche._
actors.hero.abilities.cleric.trinity.driedrose_use=Trinità userà l'effetto di questo artefatto per evocare uno spettro corrotto amichevole con l'HP di un _+%1$d_ fantasma, al costo di _%2$s cariche._
actors.hero.abilities.cleric.trinity.etherealchains_use=Trinità applicherà l'effetto di evocazione delle catene di questo artefatto con distanza a _+%1$d_, al costo di _%2$s cariche._
actors.hero.abilities.cleric.trinity.hornofplenty_use=Trinità applicherà l'effetto di fare uno spuntino di questo artefatto, al costo di _%2$s cariche._
actors.hero.abilities.cleric.trinity.masterthievesarmband_use=Trinità applicherà l'effetto di rapina di questo artefatto  a _+%1$d_, al costo di _%2$s cariche._
actors.hero.abilities.cleric.trinity.sandalsofnature_use=Trinità applicherà l'effetto di radicamento con l'effetto di un seme nocivo casuale di questo artefatto, al costo di _%2$s cariche._
actors.hero.abilities.cleric.trinity.skeletonkey_use=Trinity applicherà l’effetto di inserimento di questo artefatto, al costo di %2$s di carica.
actors.hero.abilities.cleric.trinity.talismanofforesight_use=Trinità applicherà l'effetto di scrutamento di questo artefatto  a _+%1$d_, al costo di _%2$s cariche._
actors.hero.abilities.cleric.trinity.timekeepershourglass_use=Trinità applicherà l'effetto di congelamento del tempo di questo artefatto con una durata di _%1$d_ turni, al costo di _%2$s cariche._
actors.hero.abilities.cleric.trinity.unstablespellbook_use=Trinità applicherà l'effetto di una pergamena casuale di questo artefatto con una possibilità di _%1$d/10_ che venga utilizzata la versione esotica di essa senza costi aggiuntivi, al costo di _%2$s cariche._
actors.hero.abilities.cleric.trinity.cost=Il costo in cariche di questa abilità varia, ma è molto spesso di _%d._
actors.hero.abilities.cleric.trinity.short_desc=Il Chierico ottiene una _Trinità_ di abilità, che emulano equipaggiamenti già visti e che possono essere assegnati utilizzando nuovi incantesimi.
actors.hero.abilities.cleric.trinity.desc=Il Chierico ottiene una _Trinità_ di abilità dell'armatura, che possono essere aggiunte all'effetto di vari oggetti tramite l'uso di tre nuovi incantesimi. Ciascuno di questi incantesimi si focalizza ad emulare l'effetto di diversi tipi di equipaggiamento che il Chierico ha identificato durante la partita: forma corporea (armi e armature), forma mentale (bacchette e armi da lancio), e forma spiritica (anelli e artefatti).\n\nOgni forma di Trinità può essere infusa con un effetto alla volta, e il Chierico sceglie quale attivare quando usa Trinità. Trinità non duplicherà l'effetto di qualcosa che hai già equipaggiato.
actors.hero.abilities.cleric.trinity$wndusetrinity.text=Seleziona quale forma di Trinità usare. Gli effetti di forme differenti possono essere attivi simultaneamente.
actors.hero.abilities.cleric.trinity$wndusetrinity.body=_Forma Corporea: %s._
actors.hero.abilities.cleric.trinity$wndusetrinity.mind=_Forma Mentale: %s._
actors.hero.abilities.cleric.trinity$wndusetrinity.spirit=_Forma Spiritica: %s._
actors.hero.abilities.cleric.trinity$wnditemtypeselect.text=Seleziona un effetto da infondere in Trinità. Informazioni aggiuntive saranno mostrate prima della conferma.
actors.hero.abilities.cleric.trinity$wnditemconfirm.body=Assegna a forma corporea
actors.hero.abilities.cleric.trinity$wnditemconfirm.mind=Assegna a forma mentale
actors.hero.abilities.cleric.trinity$wnditemconfirm.spirit=Assegna a forma spiritica
actors.hero.abilities.cleric.powerofmany.name=potere di molti
actors.hero.abilities.cleric.powerofmany.prompt_default=Scegli un alleato o una posizione
actors.hero.abilities.cleric.powerofmany.prompt_ally=Direziona il tuo alleato di luce
actors.hero.abilities.cleric.powerofmany.ally_exists=Hai già un alleato potenziato
actors.hero.abilities.cleric.powerofmany.no_vision=Non puoi selezionare una posizione che non puoi vedere.
actors.hero.abilities.cleric.powerofmany.only_allies=Puoi solo potenziare gli alleati.
actors.hero.abilities.cleric.powerofmany.short_desc=Il Chierico canalizza il _Potere dei Molti_, potenziando un alleato esistente o creandone uno nuovo.
actors.hero.abilities.cleric.powerofmany.desc=Il Chierico canalizza il _Potere dei Molti_, che potenzia un alleato esistente oppure ne crea uno nuovo potenziato per 100 turni. Selezionare uno spazio vuoto crea un nuovo alleato.\n\nMentre è potenziato dal Potere dei Molti, qualsiasi alleato infligge +25% di danno, subisce -25% di danno, e condivide la sua visuale col Chierico. Inoltre, guadagna 25 punti di scudo quando l'abilità viene utilizzata.\n\nInoltre, il Chierico guadagna tre nuovi incantesimi che possono solo essere lanciati con un alleato potenziato. Il Potere dei Molti non terminerà mentre uno di questi incantesimi è attivo.
actors.hero.abilities.cleric.powerofmany$powerbuff.name=potere di molti
actors.hero.abilities.cleric.powerofmany$powerbuff.desc=Questo alleato è stato potenziato dal Potere dei Molti, ottenendo +25%% di danni inflitti e -25%% di danni subiti. Inoltre condividerà il suo raggio di visione col Chierico, e può essere influito dagli incantesimi del potere dei molti.\n\nIl Potere dei Molti persisterà anche quando alleati come le immagini prismatiche si nascondo, ma la sua durata si deteriora comunque.\n\nTurni rimanenti: %s.
actors.hero.abilities.cleric.powerofmany$lightally.name=illumina alleato
actors.hero.abilities.cleric.powerofmany$lightally.direct_defend=Il tuo alleato si muove verso quella posizione.
actors.hero.abilities.cleric.powerofmany$lightally.direct_follow=Il tuo alleato si muove per seguirti.
actors.hero.abilities.cleric.powerofmany$lightally.direct_attack=Il tuo alleato si sposta per attaccare!
actors.hero.abilities.cleric.powerofmany$lightally.desc=Una copia di uno dei compagni di avventura del Chierico, fatta di luce solida. Mentre ha la forma di un altro eroe, essa non ha nessuna delle sue abilità uniche. Questo alleato persisterà fino a quando gli sarà applicato Potere dei Molti.\n\nQuesto alleato può essere direzionato senza costo riutilizzando l'abilità Potere dei Molti dell'armatura.
actors.hero.abilities.cleric.powerofmany$lightally.discover_hint=Puoi trovare questo personaggio con un'abilità dell'armatura dell'eroe specifica.


actors.hero.abilities.ratmogrify.name=rattificazione
actors.hero.abilities.ratmogrify.cant_transform=Non puoi rattificarlo!
actors.hero.abilities.ratmogrify.too_strong=Quel nemico è troppo forte per essere rattificato!
actors.hero.abilities.ratmogrify.short_desc=L' eroe _Ratmogrifies_ un nemico! Questo lo trasforma temporaneamente in un ratto che non possiede alcuna abilità.
actors.hero.abilities.ratmogrify.desc=L'eroe trasforma un nemico in un ratto per 6 turni! Boss, alleati e ratti non possono essere trasformati.\n\nI nemici trasformati mantengono le loro statistiche originarie ma non hanno alcuna abilità.
actors.hero.abilities.ratmogrify$transmograt.name=%s rattificato
actors.hero.abilities.ratmogrify$transmograt.desc=Questo nemico si è trasformato in un ratto. Un grande miglioramento, se chiedi il mio parere! - Re dei Ratti
actors.hero.abilities.ratmogrify$transmograt.rankings_desc=Ucciso da un nemico trasmutato in ratto

##Cleric Spells
actors.hero.spells.auraofprotection.name=aura di protezione
actors.hero.spells.auraofprotection.short_desc=Aumenta la difesa del Paladino e degli alleati vicini.
actors.hero.spells.auraofprotection.desc=Il Paladino inizia a irradiarsi di energia protettiva, creando un'aura scintillante attorno a sé per 20 turni. Qualsiasi alleato entro 2 caselle dal Paladino (incluso il Paladino stesso) subisce %1$d%% meno danni e ottiene l'effetto del glifo della sua armatura con un potenziamento di +%2$d%% potere.\n\nQuesta riduzione del danno viene applicata prima di altri effetti di riduzione del danno (es. armatura). Il potenziamento del glifo sarà sempre attivo, ma questo incantesimo non può far sì che il glifo del Paladino si applichi più di una volta su un personaggio che ne sta già beneficiando (es. il Paladino stesso o un'immagine prismatica).
actors.hero.spells.auraofprotection$aurabuff.name=aura di protezione
actors.hero.spells.auraofprotection$aurabuff.desc=Il Paladino irradia energia protettiva attorno a sé.\n\nQualsiasi alleato vicino (incluso il Paladino stesso) subisce danni ridotti e ottiene l'effetto del glifo della sua armatura con potere potenziato.\n\nTurni rimanenti: %s.

actors.hero.spells.beamingray.name=raggio luminoso
actors.hero.spells.beamingray.no_space=Non c'è spazio perché il tuo alleato possa apparire lì.
actors.hero.spells.beamingray.out_of_range=Quel posto è troppo lontano.
actors.hero.spells.beamingray.short_desc=Teletrasporta il tuo alleato e garantisce danno bonus.
actors.hero.spells.beamingray.desc=Il Chierico canalizza il potere sul suo alleato in un raggio di luce che lo trasporta dove viene scagliato. Se il raggio colpisce un nemico posizionerà l'alleato vicino e lo direzionerà verso il nemico.\n\nIl raggio ha una portata di %1$d caselle, e incrementerà il danno bonus del Potere dei Molti a +%2$d%% per 10 turni contro il nemico più vicino con un raggio di 4 caselle. Raggio luminoso può teletrasportare anche alleati naturalmente immobili, ma la sua portata è dimezzata in questi casi.
actors.hero.spells.beamingray$beamingrayboost.name=raggio luminoso
actors.hero.spells.beamingray$beamingrayboost.desc=Questo alleato è stato recentemente teletrasportato da Raggio Luminoso, ottenendo danni bonus contro il nemico più vicino. L'effetto di Potere dei Molti non scadrà mentre questo potenziamento è attivo.\n\nTurni rimanenti: %s.

actors.hero.spells.blessspell.name=benedire
actors.hero.spells.blessspell.short_desc=Benedisce e protegge il Chierico, benedisce e cura gli altri.
actors.hero.spells.blessspell.desc=Il Chierico pone una santa benedizione su se stesso o su un altro personaggio che può vedere.\n\nQuando lanciato su se stessi, l'effetto è più debole, garantendo %1$d turni di benedizione e %2$d di scudo.\n\nQuando lanciato su altri personaggi, l'incantesimo è più potente, garantendo %3$d turni di benedizione e %4$d di guarigione. La guarigione in eccesso viene convertita in scudo.

actors.hero.spells.bodyform.name=forma corporea
actors.hero.spells.bodyform.short_desc=Assegna Trinità a un incanto o a un glifo.
actors.hero.spells.bodyform.desc=Il Chierico sceglie un incanto o un glifo identificato in questa partita e infonde Trinità con il suo effetto.\n\nQuando Trinità viene utilizzata, il Chierico ottiene l'effetto dell'incanto o del glifo scelto per %d turni. Questo incanto o glifo temporaneo funzionerà con qualsiasi effetto che un normale incanto o glifo potrebbe avere.\n\nQuesto incantesimo sostituisce qualsiasi altro effetto corporeo attualmente infuso in Trinità.
actors.hero.spells.bodyform$bodyformbuff.name=forma corporea
actors.hero.spells.bodyform$bodyformbuff.desc=La forma corporea di Trinità ti sta attualmente concedendo il potere di un incantamento o un glifo, come se lo avessi equipaggiato alla tua attuale arma o armatura.\n\nNota che la forma corporea non può concedere la copia di un potere di cui stai già beneficiando.\n\nEffetto corrente: %1$s.\n\nTurni rimanenti: %2$s.

actors.hero.spells.cleanse.name=purificare
actors.hero.spells.cleanse.short_desc=Cancella i debuff e garantisce la protezione.
actors.hero.spells.cleanse.desc=Il Chierico elimina tutti gli effetti dannosi su se stesso e sugli alleati visibili. Al termine dell'incantesimo, tutti i personaggi colpiti ottengono anche %1$d turni di immunità ai debuff e %2$d di barriera.

actors.hero.spells.clericspell.prompt=Scegli un bersaglio
actors.hero.spells.clericspell.no_target=Non c'è un bersaglio là.
actors.hero.spells.clericspell.invalid_target=Non puoi selezionare quella posizione.
actors.hero.spells.clericspell.invalid_enemy=Non puoi prendere di mira quel nemico.
actors.hero.spells.clericspell.charge_cost=Costo: %d

actors.hero.spells.divinesense.name=senso divino
actors.hero.spells.divinesense.short_desc=Acquisice temporaneamente una visione mentale con un grande raggio.
actors.hero.spells.divinesense.desc=Il Chierico concentra i propri sensi sull'ambiente circostante, ottenendo visione mentale con un raggio d'azione di %d caselle per 50 turni. Questo incantesimo non richiede tempo per essere lanciato.
actors.hero.spells.divinesense$divinesensetracker.name=senso divino
actors.hero.spells.divinesense$divinesensetracker.desc=Questo personaggio è temporaneamente capace di vedere le creature vicine con la sua mente!\n\nTurni rimanenti: %s.

actors.hero.spells.divineintervention.name=intervento divino
actors.hero.spells.divineintervention.short_desc=Grande aumento della protezione del Chierico e i suoi alleati.
actors.hero.spells.divineintervention.desc=Il Chierico riversa un'enorme quantità di potere dal proprio tomo su sé stesso e sugli alleati, garantendo a tutti %1$d di scudo e prolungando la Forma Ascendente di %2$d turni.\n\nL'incredibile potere difensivo di questo incantesimo è bilanciato dal suo elevato costo di carica.\n\nCome gli altri scudi concessi dalla Forma Ascendente, questo scudo non si deteriora normalmente, ma svanirà immediatamente alla fine della Forma Ascendente.

actors.hero.spells.flash.name=flash
actors.hero.spells.flash.prompt=Scegli un luogo
actors.hero.spells.flash.short_desc=Teletrasportati in un luogo vicino.
actors.hero.spells.flash.desc=Il Chierico canalizza la sua forma ascesa in un luogo vicino e si teletrasporta lì. Flash può teletrasportare il Chierico in qualsiasi luogo scoperto che sia nel raggio d'azione e non occupato. Questo incantesimo costa più cariche del tomo ogni volta che viene utilizzato nella stessa forma ascesa.

actors.hero.spells.guidinglight.name=luce guida
actors.hero.spells.guidinglight.short_desc=Infligge danni magici a distanza e garantisce un colpo.
actors.hero.spells.guidinglight.desc=Il Chierico scaglia un dardo di energia magica che colpisce un bersaglio, infliggendo 2-8 danni e illuminandolo. Il prossimo attacco fisico non impedito contro un nemico illuminato andrà a segno con certezza.
actors.hero.spells.guidinglight.desc_priest=_Questo incantesimo è più potente quando lanciato dal Sacerdote._ La prima volta che l'incantesimo viene lanciato ogni 50 turni non consuma cariche del tomo, e l'illuminazione sarà consumata dallo splendore, bacchette, altri personaggi e artefatti che influiscono direttamente sui nemici. Quando l'illuminazione viene usata in questa maniera, infligge danni magici bonus pari al livello del Sacerdote +5.
actors.hero.spells.guidinglight$guidinglightpriestcooldown.name=Luce Guida
actors.hero.spells.guidinglight$guidinglightpriestcooldown.desc=Il Sacerdote potrà lanciare nuovamente Luce Guida gratuitamente dopo 50 turni. Turni rimanenti:%s
actors.hero.spells.guidinglight$illuminated.name=Illuminato
actors.hero.spells.guidinglight$illuminated.desc=Questo personaggio emana una luce soffusa dopo essere stato colpito da un raggio guida. Anche se il bagliore non è abbastanza intenso da illuminare l'area circostante, l'effetto magico renderà molto più facile per il Chierico colpirlo.
actors.hero.spells.guidinglight$illuminated.desc_priest=Il Sacerdote può inoltre consumare lo stato di illuminato anche tramite splendore, una scarica magica della bacchetta, un attacco di un alleato, o l'effetto di alcuni manufatti. Usando lo stato di illuminato in questo modo, infliggerà danni magici bonus pari al livello del Sacerdote +5.
actors.hero.spells.guidinglight$illuminated.desc_generic=Altri eroi possono comunque usare illuminazione per beneficiare del talento luce bruciante, ma non otterranno alcuna accuratezza.

actors.hero.spells.hallowedground.name=terra consacrata
actors.hero.spells.hallowedground.prompt=Scegli un luogo
actors.hero.spells.hallowedground.short_desc=Cura gli alleati, rallenta i nemici e sparge l'erba in un'area d'effetto.
actors.hero.spells.hallowedground.desc=Il Sacerdote concentra la sua magia divina nel terreno vicino, creando un'area %1$dx%1$d di terreno consacrato per 20 turni. \n\nQuando viene lanciato, questo incantesimo cura tutti gli alleati per 15 HP (gli alleati sani e il prete ricevono uno scudo), radica brevemente i nemici e sparge l'erba corta. \n\nIl terreno sacro cura gli alleati per 1 HP per turno (gli alleati sani e il sacerdote ottengono scudi), paralizza i nemici e fa crescere casualmente l'erba alta. \n\nIl terreno consacrato viene distrutto dal fuoco e produrrà erba solcata se gli effetti di rigenerazione passiva sono disabilitati o se il sacerdote non ha guadagnato esperienza da un po'.
actors.hero.spells.hallowedground$hallowedterrain.desc=Qui il terreno è stato consacrato. Il terreno consacrato rallenta i nemici, cura gli alleati e fa diffondere l'erba.

actors.hero.spells.holyintuition.name=santa intuizione
actors.hero.spells.holyintuition.prompt=scegli un oggetto
actors.hero.spells.holyintuition.cursed=Percepisci la magia malevola in agguato all'interno di questo oggetto.
actors.hero.spells.holyintuition.uncursed=Questo oggetto è privo di magia malevola.
actors.hero.spells.holyintuition.short_desc=identifica se un oggetto è maledetto o meno.
actors.hero.spells.holyintuition.desc=Il Chierico concentra i propri sensi su un oggetto e determina se è maledetto o meno senza doverlo equipaggiare.

actors.hero.spells.holylance.name=lancia sacra
actors.hero.spells.holylance.short_desc=Infligge ingenti danni magici a distanza.
actors.hero.spells.holylance.desc=Il Sacerdote accumula un’enorme quantità di energia, plasmando una lancia luminosa di potenza devastante. Questo colpo infligge %1$d-%2$d danni e causa automaticamente il danno massimo a non morti e creature demoniache. \n\nQuesto incantesimo è molto costoso, e ha un tempo di ricarica di 30 turni.
actors.hero.spells.holylance$lancecooldown.name=tempo di recupero della Lancia Sacra
actors.hero.spells.holylance$lancecooldown.desc=Il Sacerdote ha appena evocato la Lancia Sacra e deve attendere prima di poterla utilizzare nuovamente.\nTurni rimanenti: %s.

actors.hero.spells.holyward.name=barriera sacra
actors.hero.spells.holyward.glyph_name=%s di luce
actors.hero.spells.holyward.glyph_desc=Questo glifo aumenta leggermente la quantità di danni che l'armatura può bloccare.
actors.hero.spells.holyward.short_desc=Sovrascrive temporaneamente i glifi per potenziare la capacità di blocco dell'armatura.
actors.hero.spells.holyward.desc=Il Chierico infonde l'armatura indossata con glifi di luce sacra, aumentando la riduzione dei danni dell'armatura di 1. Questo incantesimo non richiede tempo per essere lanciato. \n\nQuesto glifo dura 50 turni, e sostituirà qualunque altro glifo benefico presente sull'armatura per tutta la durata. Il Chierico beneficerà di questo effetto anche se non indossa un'armatura.
actors.hero.spells.holyward.desc_paladin=_Questo incantesimo è più potente quando lanciato dal Paladino._ La riduzione aggiuntiva dei danni viene aumentata a 3, l'incantesimo non sovrascrive più i glifi esistenti e lanciare altri incantesimi mentre Sacra Barriera è attiva ne estenderà la durata di 10 turni per carica utilizzata.
actors.hero.spells.holyward$holyarmbuff.name=barriera sacra
actors.hero.spells.holyward$holyarmbuff.desc=Il Chierico ha infuso la propria armatura indossata con energia sacra, sovrascrivendo temporaneamente qualsiasi glifo esistente e facendo sì che l'armatura blocchi 1 punto di danno aggiuntivo.\n\nTurni rimanenti: %s.
actors.hero.spells.holyward$holyarmbuff.desc_paladin=Il Paladino ha infuso la propria armatura indossata con energia sacra, facendo sì che l'armatura blocchi 3 punti di danno aggiuntivi.\n\nLanciare altri incantesimi durante Sacra Barriera ne estenderà la durata di 10 turni per carica spesa.\n\nTurni rimanenti: %s.

actors.hero.spells.holyweapon.name=arma sacra
actors.hero.spells.holyweapon.ench_name=Santo %s
actors.hero.spells.holyweapon.ench_desc=I nemici colpiti da un'arma sacra subiranno danni magici aggiuntivi.
actors.hero.spells.holyweapon.short_desc=Sovrascrive temporaneamente gli incantesimi per potenziare i danni.
actors.hero.spells.holyweapon.desc=Il Chierico infonde l'arma equipaggiata con energia sacra, facendo sì che l'arma infligga 2 danni magici aggiuntivi ogni volta che colpisce un nemico. Questo incantesimo non richiede tempo per essere lanciato. \n\nL'incantesimo dura 50 turni e sostituisce qualsiasi altro incantesimo beneficio presente sull'arma per tutta la durata. Anche gli attacchi a mani nude beneficiano di questo effetto.
actors.hero.spells.holyweapon.desc_paladin=_Questo incantesimo è più potente se lanciato dal Paladino._ Il danno magico aggiuntivo sale a 6, l'incantesimo non sostituisce più gli incantesimi esistenti e lanciare altri incantesimi finché Arma Sacra è attiva ne prolunga la durata di 10 turni per carica utilizzata.
actors.hero.spells.holyweapon$holywepbuff.name=arma sacra
actors.hero.spells.holyweapon$holywepbuff.desc=Il Chierico ha infuso la propria arma equipaggiata con energia sacra, sovrascrivendo temporaneamente qualsiasi incantesimo esistente e facendo sì che l'arma infligga 2 danni magici aggiuntivi per ogni attacco. \n\nTurni rimanenti:%s .
actors.hero.spells.holyweapon$holywepbuff.desc_paladin=Il Paladino ha infuso l'arma equipaggiata con energia sacra, facendo sì che i suoi attacchi infliggano 6 danni magici aggiuntivi. \n\nLanciare altri incantesimi mentre Arma Sacra è attiva ne estenderà la durata di 10 turni per carica spesa. \n\nTurni rimanenti: %s.

actors.hero.spells.judgement.name=giudizio
actors.hero.spells.judgement.short_desc=Infligge danni a tutti i nemici visibili.
actors.hero.spells.judgement.desc=Il Chierico schianta il pugno al suolo, provocando un'eruzione di luce che infligge danni a tutti i nemici in suo campo visivo. Questo attacco causa %1$d-%2$d danni base, più 33%% danni aggiuntivi per ogni incantesimo lanciato dal Chierico dopo l'entrata in *forma ascendente* (o dall'ultima attivazione di Giudizio). \n\nAttualmente, Giudizio infliggerà %3$d-%4$d danni.

actors.hero.spells.layonhands.name=Tocco Taumaturgico
actors.hero.spells.layonhands.short_desc=Cura istantaneamente un personaggio adiacente o fornisce protezione al Paladino.
actors.hero.spells.layonhands.desc=Il Paladino canalizza energia sacra attraverso le sue mani, curando o proteggendo qualsiasi cosa tocchi.\n\nIl Paladino può lanciare questo incantesimo a qualsiasi creatura adiacente per concedergli %1$d di cura, o su se stesso per ottenere %1$d di scudo. I punti cura in eccesso vengono convertiti in scudo.\n\nL'incantesimo viene lanciato istantaneamente e può essere lanciato ripetutamente, ma non può concedere più punti scudo di tre lanci complessivi al momento.

actors.hero.spells.lifelinkspell.name=connessione vitale
actors.hero.spells.lifelinkspell.short_desc=Condivide il danno subito con un alleato, e riduce il danno subito di esso.
actors.hero.spells.lifelinkspell.desc=Il Chierici rafforza il legame tra se stesso e il suo alleato potenziato. Con questo legame potenziato, qualsiasi danno subito verrà diviso tra l'eroe e il suo alleato per %1$d turni, e l'aumento della difesa del Potere dei Molti aumenterà a -%2$d%% danni subiti. Nota che il danno è diviso dopo l'applicazione dell'armatura, ma prima della riduzione dei danni del Potere dei Molti.\n\nMentre questo effetto è attivo, gli incantesimi benefici del Chierico dal T3 in giù saranno applicati sia al Chierico che al suo alleato, nel caso che venga applicato a uno dei due.
actors.hero.spells.lifelinkspell$lifelinkspellbuff.name=protezione della connessione vitale
actors.hero.spells.lifelinkspell$lifelinkspellbuff.desc=Il Chierico ha lanciato recentemente Connessione Vitale sul suo alleato.\n\nIn aggiunta ai normali benefici di Connessione Vitale, questo personaggio subisce anche danno ridotto, qualsiasi incantesimo positivo del Chierico viene applicato sia al Chierico stesso che al suo alleato, invece che solo a uno di essi, e il Potere dei Molti non terminerà mentre questo potenziamento è attivo.\n\nTurni rimanenti %s.

actors.hero.spells.mindform.name=Forma della Mente
actors.hero.spells.mindform.short_desc=Assegna Trinità ad una bacchetta o arma da lancio.
actors.hero.spells.mindform.desc=Il Chierico sceglie una bacchetta o arma da lancio che ha identificato in questa partita e instilla Trinità col suo effetto.\n\nQuando Trinità viene usata, il Chierico può effettuare un singolo attacco come se stessero usando l'oggetto scelto con un +%d. Questa azione attiverà tutti gli effetti che usare quel tipo di oggetto attiverebbe normalmente.\n\nQuesto incantesimo rimpiazza qualsiasi altro effetto mentale con cui Trinità è attualmente instillata.

actors.hero.spells.mnemonicprayer.name=Preghiera mnemonica
actors.hero.spells.mnemonicprayer.short_desc=Estende potenziamenti/depotenziamenti su un alleato/nemico, e riapplica lo stato illuminato.
actors.hero.spells.mnemonicprayer.desc=Il Sacerdote recita una preghiera che estende la durata di tutti i potenziamenti o depotenziamenti su un bersaglio specifico di %1$d turni. Questo incantesimo non richiede tempo per essere lanciato. Gli effetti positivi dureranno di più sugli alleati (incluso il Sacerdote stesso), e gli effetti dannosi dureranno di più sui nemici.\n\nPreghiera Mnemonica può solo estendere uno specifico potenziamento o depotenziamento una sola volta, e non può estendere gli effetti dati dalle abilità dell'armatura.

actors.hero.spells.radiance.name=splendore
actors.hero.spells.radiance.short_desc=Illumina e stordisce brevemente i nemici visibili.
actors.hero.spells.radiance.desc=Il Sacerdote erutta in una luce sacra, stordendo tutti i nemici visibili per 3 turni. Se un nemico è già illuminato, Splendore attiverà i danni bonus di illuminazione per poi applicare il depotenziamento illuminato. Splendore farà si che il Sacerdote diventi esso stesso luminoso per 100 turni se il piano attuale è buio.

actors.hero.spells.recallinscription.name=Richiama inscrizione
actors.hero.spells.recallinscription.short_desc=Ripete l'effetto di una pietra runica o di una pergamena recentemente utilizzata.
actors.hero.spells.recallinscription.desc=Il Chierico usa magia sacra per riapplicare l'effetto della runa magica di una pietra runica, o di una pergamena utilizzata negli ultimi %s turni.\n\nRichiama Inscrizione non può essere usato per replicare pergamene di miglioramento. Le cariche necessarie per lanciare questo incantesimo variano in base a quale oggetto è stato recentemente utilizzato: 2 per una pietra runica, 3 per una pergamena, 4 per una pergamena esotica. Il costo in cariche viene inoltre raddoppiato quando si replica una pergamena della trasmutazione, oppure oggetti alchemici che vengono creati usando trasmutazione o miglioramento.
actors.hero.spells.recallinscription$useditemtracker.name=runa recentemente utilizzata
actors.hero.spells.recallinscription$useditemtracker.desc=Il Chierico ha recentemente usato un oggetto compatibile con l'incantesimo di richiamo inscrizione. Il Chierico può lanciare l'incantesimo per replicare l'effetto dell'oggetto.\n\nOggetto Usato: %1$s.\n\nTurni Rimanenti: %2$s.

actors.hero.spells.shieldoflight.name=Scudo di luce
actors.hero.spells.shieldoflight.short_desc=Garantisce armatura temporanea contro un bersaglio.
actors.hero.spells.shieldoflight.desc=Il Chierico crea una sottile barriera di luce tra se stesso e un nemico, aumentando il potere di blocco dell'armatura di %1$d-%2$d per 5 turni.\n\nQuesto incantesimo non richiede alcun tempo per essere lanciato, ma non può essere usato contro più bersagli allo stesso tempo.
actors.hero.spells.shieldoflight$shieldoflighttracker.name=Scudo di luce
actors.hero.spells.shieldoflight$shieldoflighttracker.desc=Un sottile scudo di luce si contrappone tra il personaggio e un nemico. Non è abbastanza forte da bloccare completamente gli attacchi, ma li renderà meno duri.\n\nTurni Rimanenti: %s

actors.hero.spells.spiritform.name=Forma Spiritica
actors.hero.spells.spiritform.short_desc=Assegna Trinità ad un anello o artefatto.
actors.hero.spells.spiritform.desc=Il Chierico sceglie un anello o artefatto che ha identificato in questa partita (eccetto il tomo sacro) e instilla Trinità col suo effetto.\n\nSe viene scelto un anello, Trinità concede il suo effetto a +%1$d per 20 turni.\n\nSe viene scelto un artefatto, Trinità replica il suo effetto a +%2$d. Ciascun artefatto ha specifici comportamenti e costi in cariche dell'armatura differenti quando vengono utilizzati con Trinità.\n\nQuesto incantesimo rimpiazza qualsiasi altro effetto dell'anima con cui Trinità è stata instillata.
actors.hero.spells.spiritform$spiritformbuff.name=Forma Spiritica
actors.hero.spells.spiritform$spiritformbuff.desc=La forma spiritica di Trinità ti sta attualmente concedendo il potere di un oggetto, come se lo avessi equipaggiato.\n\nNota che la forma spiritica non può concedere un'altra copia di un effetto di cui stai già beneficiando.\n\nEffetto Attuale: %1$s.\n\nTurni Rimanenti: %2$s.

actors.hero.spells.smite.name=punizione divina
actors.hero.spells.smite.short_desc=Garantisce un colpo con danni e potere d'incantamento bonus.
actors.hero.spells.smite.desc=Il Paladino infonde un attacco corpo a corpo con un potere sacro distruttivo.\n\nIn aggiunta ai normali danni corpo a corpo, Punizione Divina fa si che gli attacchi non ostacolati siano garantiti a colpire, che abbiano +300%% potere di incantamento, e che causi %1$d - %2$d danni magici bonus.\n\nIl danno magico bonus di Punizione Divina scala col livello del Paladino, e infliggerà sempre danni magici bonus massimi contro nemici non morti o demoniaci.

actors.hero.spells.stasis.name=stasi
actors.hero.spells.stasis.short_desc=Rimuove l'alleato dal dungeon e lo conserva.
actors.hero.spells.stasis.desc=Il Chierico concentra la connessione col suo alleato verso se stesso, facendo si che l'alleato sia mantenuto temporaneamente in una sorta di stasi energetica col Chierico. L'alleato sarà conservato per un massimo di %d turni, senza influenzare gli effetti positivi dal loro tempo in stasi.\n\nL'alleato apparirà accanto al Chierico quando la stasi termina naturalmente oppure può rilanciare istantaneamente l'incantesimo senza costo per porre fine all'effetto prima. Stasi può anche muovere alleati immobili, ma non li può trasferire tra piani.
actors.hero.spells.stasis$stasisbuff.name=alleato in stasi
actors.hero.spells.stasis$stasisbuff.left_behind=Il tuo alleato immobile viene lasciato indietro.
actors.hero.spells.stasis$stasisbuff.desc=Il Chierico attualmente ha un alleato conservato in stasi. Tutti gli effetti positivi su questo alleato vengono conservati, incluso il Potere dei Molti, ed esso riapparirà vicino al Chierico quando termina l'effetto. L'effetto può anche essere terminato in anticipo rilanciando Stasi.\n\nAlleato in stasi: %1$s.\nTurni rimanenti: %2$s.

actors.hero.spells.sunray.name=Sprazzo
actors.hero.spells.sunray.short_desc=Infligge danno magico a distanza e acceca il bersaglio una volta.
actors.hero.spells.sunray.desc=Il Chierico emette un raggio di luce accecante verso il bersaglio, infliggendo %1$d-%2$d danni e accecandoli per %3$d turni. Raggio di sole infliggerà sempre danni massimi a bersagli non morti o demoniaci.\n\nDopo essere stato colpito da questo incantesimo, la visione del nemico si adeguerà, impedendo che vengano accecati nuovamente. Tuttavia, se viene colpito di nuovo mentre è accecato da questo incantesimo, allora la luce è travolgente e viene paralizzato.

actors.hero.spells.walloflight.name=Barriera di luce
actors.hero.spells.walloflight.short_desc=Crea una barriera che blocca nemici
actors.hero.spells.walloflight.desc=Il Paladino crea di fronte a se stesso un muro fatto di pannelli di luce solida spesso 1 casella e largo %1$d caselle, e dura per 20 turni.\n\nQuesto muro si comporta come uno normale, eccetto che si può vedere attraverso. I nemici che vengono colti nello spazio del muro quando esso viene creato saranno momentaneamente storditi e spinti indietro se possibile. Qualsiasi cosa incastrata nel muro potrà spostarsi da esso.\n\nIl muro può essere evocato verso uno qualsiasi dei punti cardinali o nelle quattro direzioni diagonali. Se un muro è già attivo, l'incantesimo può essere usato gratuitamente per dissipare istantaneamente il muro.
actors.hero.spells.walloflight.early_end=Dissipi il muro di luce.
actors.hero.spells.walloflight$lightwall.desc=Pannelli di luce bloccano la via

##main hero
actors.hero.hero.name=tu
actors.hero.hero.leave=Non puoi ancora andartene, il resto del dungeon ti aspetta di sotto!
actors.hero.hero.level_up=Level up!
actors.hero.hero.new_level=Sei salito di livello! +Precisione, +Evasione, +5 HP!
actors.hero.hero.new_talent=+1 Punto Talento!
actors.hero.hero.unspent=Hai Punti Talento da assegnare!
actors.hero.hero.level_cap=Non puoi diventare più forte, ma le tue esperienze ti donano una sferzata di potere!
actors.hero.hero.you_now_have=hai raccolto: %s.
actors.hero.hero.you_cant_have=non puoi portare: %s.
actors.hero.hero.locked_chest=Questo forziere è chiuso e tu non hai la chiave adatta.
actors.hero.hero.locked_door=Non hai una chiave adatta.
actors.hero.hero.noticed_smth=Hai notato qualcosa.
actors.hero.hero.wait=...
actors.hero.hero.search=ricerca
actors.hero.hero.search_distracted=È difficile concentrarti e cercare... è estenuante.
actors.hero.hero.key_distracted=Non riesci ancora ad aprire la serratura, dovrai continuare a provare.
actors.hero.hero.pain_resist=Il dolore ti aiuta a resistere al desiderio di dormire.
actors.hero.hero.revive=L'ankh esplode con un'energia rivitalizzante!

##classes
actors.hero.heroclass.warrior=guerriero
actors.hero.heroclass.warrior_desc_short=Il Guerriero può sopportare dei danni extra grazie allo scudo creato dal suo _sigillo rotto._ Il sigillo può essere spostato tra le armature e può _trasferire un singolo miglioramento._
actors.hero.heroclass.warrior_desc=Il Guerriero inizia con un _esclusivo sigillo rotto_ che genera uno scudo quando è ridotto a meno di metà vita. Il sigillo può essere spostato tra le armature, e può _trasferire un singolo miglioramento_ con sé.\n\nIl Guerriero inizia anche con una _spada corta usurata_, _tre pietre da lancio_, un'armatura di stoffa, un otre, e un sacchetto di velluto.\n\nIl Guerriero identifica automaticamente:\n_-_ Pergamena dell'identificazione\n_-_ Pozione di cura\n_-_ Pergamena della rabbia
actors.hero.heroclass.warrior_unlock=Il Guerriero è sbloccato automaticamente.

actors.hero.heroclass.mage=mago
actors.hero.heroclass.mage_desc_short=Il Mago è un esperto arcano e porta con sé un _bastone magico_ che è più potente di una bacchetta. Il bastone può essere _infuso con qualunque bacchetta_ trovata dal Mago.
actors.hero.heroclass.mage_desc=Il Mago inizia con un _bastone unico_, che si ricarica molto più velocemente di una bacchetta e ha 1 carica in più. Il bastone _può essere infuso con qualsiasi bacchetta_ il Mago trovi nel dungeon. Il Mago inizia anche con una _bacchetta del missile magico_ infusa nel suo bastone, un'armatura di stoffa, un otre e un sacchetto di velluto.\n\nIl Mago identifica automaticamente:\n_-_ Pergamena dell'Identificazione\n_-_ Pozione del Fuoco Liquido\n_-_ Pergamena del Miglioramento
actors.hero.heroclass.mage_unlock=Per sbloccare il Mago _utilizza una pergamena del miglioramento per rendere un oggetto più forte._

actors.hero.heroclass.rogue=ladro
actors.hero.heroclass.rogue_desc_short=Il Ladro può evitare i nemici e colpire dall'invisibilità usando il suo _mantello delle ombre._ Può anche _scovare segreti e trappole_ da una distanza maggiore.
actors.hero.heroclass.rogue_desc=Il Ladro inizia con un _unico Mantello delle Ombre_, che può usare per diventare invisibile a piacimento.\n\nIl Ladro può _rilevare segreti e trappole_ da una distanza maggiore.\n\nIl Ladro inizia anche con _un pugnale_, _tre coltelli da lancio_, un'armatura di stoffa, un otre e una borsa di velluto.\n\nIl Ladro identifica automaticamente:\n_-_ Pergamena dell'identificazione\n_-_ Pozione dell'invisibilità\n_-_ Pergamena di mappatura magica
actors.hero.heroclass.rogue_unlock=Per sbloccare il Ladro _esegui 10 attacchi a sorpresa in una partita._

actors.hero.heroclass.huntress=cacciatrice
actors.hero.heroclass.huntress_desc_short=La Cacciatrice è una maestra delle armi da lancio e possiede un _arco magico_ con frecce infinite. Può anche passare attraverso l'erba alta _senza calpestarla._
actors.hero.heroclass.huntress_desc=La Cacciatrice inizia con un _arco spirituale unico_, che può scoccare un numero infinito di frecce evocate.\n\nLa Cacciatrice può camminare attraverso l'erba alta _senza calpestarla_.\n\nLa Cacciatrice inizia anche con _guanti borchiati_, armatura di stoffa, un otre e una borsa di velluto.\n\nLa Cacciatrice identifica automaticamente:\n_-_ Pergamena dell'identificazione\n_-_ Pozione di visione mentale\n_-_ Pergamena della ninna nanna
actors.hero.heroclass.huntress_unlock=Per sbloccare la Cacciatrice _colpisci 10 nemici con armi da lancio in una partita._

actors.hero.heroclass.duelist=duellante
actors.hero.heroclass.duelist_desc_short=La Duellante è una maestra d'armi che può usare la sua arma per attivare un'_abilità speciale dell'arma._ Questa abilità speciale è _diversa per ogni arma._
actors.hero.heroclass.duelist_desc=La Duellante inizia con uno _stocco esclusivo_ con un'abilità speciale che si ricarica nel tempo.\n\nOgni arma nel gioco ha una _diversa abilità speciale_ che la Duellante può usare.\n\nLa Duellante inizia anche con _due punte da lancio_, un'armatura di stoffa, un otre e un sacchetto di velluto.\n\nLa Duellante identifica automaticamente:\n_-_ Pergamene di Identificazione\n_-_ Pozioni della Forza\n_-_ Pergamene dell'immagine speculare
actors.hero.heroclass.duelist_unlock=Per sbloccare la Duellante _devi equipaggiare un'arma di livello 2 o superiore senza penalità dovute alla forza._

actors.hero.heroclass.cleric=Chierico
actors.hero.heroclass.cleric_desc_short=Il Chierico è un incantatore divino che usa il suo _tomo sacro_ unico per canalizzare magia divina. Può _imparare e migliorare incantesimi_ attraverso i talenti.
actors.hero.heroclass.cleric_desc=Il Chierico inizia con un _tomo sacro unico_, che può usare per lanciare vari incantesimi.\n\nLa maggior parte dei talenti del Chierico si concentrano sull'imparare o migliorare incantesimi.\n\nIl Chierico inizia anche con _un randello_, un'armatura di stoffa, un'otre e un sacchetto di velluto.\n\nIl Chierico identifica automaticamente:\n_-_ Pergamena dell'Identificazione\n_-_ Pozione di Purificazione\n_-_ Pergamena di Rimuovi Maledizione
actors.hero.heroclass.cleric_unlock=Per sbloccare il Chierico _ripulisci completamente la maledizione da un qualsiasi pezzo di equipaggiamento maledetto._

actors.hero.herosubclass.berserker=berserker
actors.hero.herosubclass.berserker_short_desc=Il _Berserker_ accumula tanta furia quanti più danni subisce. La furia incrementa il suo danno e può essere attivata quando è al 100% per dello scudo bonus.
actors.hero.herosubclass.berserker_desc=Il Berserker ottiene rabbia quando subisce danno fisico, includendo danno bloccato dalla sua armatura! La rabbia diminuisce progressivamente nel tempo, ma diminuisce più lentamente se l'eroe ha pochi PS. \n\nIl Berserker ottiene fino a +50% di danni dalla rabbia. Al massimo della rabbia, l'eroe può andare in furia, ottenendo uno scudo e mantenendo la propria rabbia finché ha dello scudo rimanente. Lo scudo scala con il livello dell'armatura del Berserker, e può essere aumentato significativamente se l'eroe ha pochi PS. Il Berserker ha bisogno di tempo per riprendersi dopo la furia.
actors.hero.herosubclass.gladiator=gladiatore
actors.hero.herosubclass.gladiator_short_desc=Il _Gladiatore_ accumula punti combo quando i suoi attacchi vanno a segno. Può poi spendere i punti accumulati per eseguire mosse uniche.
actors.hero.herosubclass.gladiator_desc=Il Gladiatore accumula un punto di combo ogni volta che effettua un attacco con successo con un'arma da mischia o da lancio. Se il Gladiatore non manda a segno un'altro attacco entro 5 turni (15 turni dopo una uccisione), la sua combo si resetta.\n\nAccumulando punti combo, il Gladiatore ottiene accesso ad una varietà di abilità che sono garantite ad andare a segno:\n2 Combo: spingi indietro il nemico, mantiene la combo\n4 Combo: infliggi danno in base alla tua armatura\n6 Combo: parata, mantiene la combo\n8 Combo: danneggia il bersaglio e i nemici vicini\n10 Combo: attacca una volta per punto combo
actors.hero.herosubclass.battlemage=mago guerriero
actors.hero.herosubclass.battlemage_short_desc=Il _Mago Guerriero_ evoca effetti bonus quando combatte in mischia con il suo bastone. Questi effetti dipendono dal tipo di bacchetta infusa nel bastone.
actors.hero.herosubclass.battlemage_desc=Il Mago Guerriero ottiene effetti bonus quando attacca in mischia con il suo bastone, come se il bastone avesse un incantamento. Questi effetti dipendono dal tipo di bacchetta infusa nel bastone, ogni bacchetta produce un effetto diverso. Inoltre, il bastone guadagna 0.5 cariche quando il Mago Guerriero lo usa per attaccare in mischia.
actors.hero.herosubclass.warlock=stregone
actors.hero.herosubclass.warlock_short_desc=Lo _Stregone_ ha la possibilità di marchiare l'anima dei nemici con le sue bacchette. Guarirà ogni volta che infligge danni fisici ai nemici contrassegnati.
actors.hero.herosubclass.warlock_desc=Lo Stregone ha la possibilità di marchiare l'anima dei personaggi quando usa il potere delle bacchette su di loro. La probabilità di applicare un marchio e la sua durata aumentano con l'aumentare del livello della bacchetta.\n\nQuando un nemico ha l'anima marchiata, lo Stregone riceverà 2 HP per ogni 5 danni inflitti al nemico. Valgono solo i danni inflitti con armi da mischia o da lancio, non valgono i datti inflitti dalle bacchette!
actors.hero.herosubclass.assassin=assassino
actors.hero.herosubclass.assassin_short_desc=L'_Assassino_ può preparare un attacco mortale mentre è invisibile. Più tempo aspetta, più potente sarà l'attacco.
actors.hero.herosubclass.assassin_desc=L'Assassino prepara il suo prossimo attacco quando è invisibile. Più tempo lo prepara, più sarà potente l'attacco. La preparazione dura per un massimo di 9 turni.\n\nDopo la preparazione, l'Assassino arreca danni bonus sul suo prossimo attacco, può scattare verso il bersaglio, e può uccidere un nemico all'istante se è abbastanza debole.
actors.hero.herosubclass.freerunner=corridore
actors.hero.herosubclass.freerunner_short_desc=Il _Corridore_ accumula slancio correndo. Lo slancio può essere utilizzato per iniziare una corsa libera, che garantisce al Corridore velocità ed evasione bonus per un breve periodo.
actors.hero.herosubclass.freerunner_desc=Il Corridore accumula slancio muovendosi. Può accumulare fino a 10 punti slancio se si muove per 10 turni consecutivi, ma perde rapidamente lo slancio accumulato se si ferma. Il Corridore può utilizzare lo slancio per iniziare una corsa libera, che dura 2 turni per punto slancio.\n\nDurante una corsa libera il Corridore si muove a velocità doppia, e ottiene evasione bonus in proporzione al suo livello. Quando la corsa libera termina, sono richiesti alcuni turni prima di poter accumulare nuovamente lo slancio.
actors.hero.herosubclass.sniper=cecchino
actors.hero.herosubclass.sniper_short_desc=Il _Cecchino_ può perforare l'armatura con i suoi attacchi a distanza. Dopo aver attaccato con un'arma da lancio, può eseguire immediatamente un attacco speciale con il suo arco.
actors.hero.herosubclass.sniper_desc=Il Cecchino è un maestro del combattimento a distanza, i cui attacchi a distanza perforano l'armatura nemica. Quando attacca un nemico con un'arma da lancio, mette un marchio da cecchino su di loro, esso consente di eseguire un attacco speciale col suo arco. Questo attacco speciale varia in base a come viene potenziato il suo arco.\n\nUn arco non potenziato scaglierà un'istantanea che infligge danni ridotti ma spara istantaneamente. Un arco veloce scaglierà una raffica di tre frecce che infliggono danni ridotti, possono ancora attivare incantesimi e impiegare 1 turno per sparare. Un arco da danno sparerà un colpo di cecchino infallibile, infligge danni bonus in base alla distanza e impiega 2 turni per sparare.
actors.hero.herosubclass.warden=guardiano
actors.hero.herosubclass.warden_short_desc=Il _Guardiano_ può vedere attraverso l'erba alta e ottiene effetti bonus quando pianta i semi e calpesta le piante.
actors.hero.herosubclass.warden_desc=Il Guardiano possiede un forte legame con la natura, che gli garantisce diversi effetti bonus legati all'erba e alle piante. Ha la capacità di vedere attraverso l'erba alta e quella calpestata come se fossero spazi liberi.\n\nIl Guardiano fa germogliare l'erba attorno ai semi che lancia o che pianta, e ottiene speciali effetti quando calpenta le piante. Questi speciali effetti sostituiscono i regolari effetti delle piante; ciò significa che nessuna pianta è pericolosa per il Guardiano.
actors.hero.herosubclass.champion=campionessa
actors.hero.herosubclass.champion_short_desc=La _Campionessa_ può impugnare due armi e ottiene più cariche alle armi. I suoi attacchi regolari usano la sua arma principale, ma può scambiare armi e usare l'abilità di entrambe le armi.
actors.hero.herosubclass.champion_desc=La Campionessa è una maestra delle armi da mischia e può equipaggiare un'arma secondaria oltre a quella primaria. I suoi attacchi regolari usano la sua arma primaria, ma può scambiare la sua arma primaria istantaneamente.\n\nOttiene inoltre altre 2 cariche massime di abilità dell'arma e +50% di velocità di ricarica delle abilità dell'arma.
actors.hero.herosubclass.monk=monaca
actors.hero.herosubclass.monk_short_desc=La _Monaca_ accumula energia mentre combatte. Questa energia può essere spesa per una varietà di abilità uniche.
actors.hero.herosubclass.monk_desc=La Monaca è una maestra della tecnica fisica. Man mano che sconfigge i nemici, guadagna energia che può essere utilizzata su varie abilità difensive e focalizzate sull'utilità. Questa energia non svanisce nel tempo, ma ha un limite basato sul livello della Monaca.\n\n1 Energia: colpisci rapidamente con i pugni\n2 Energia: concentrati per schivare il prossimo attacco\n3 Energia: scatta istantaneamente nelle vicinanze\n4 Energia: caccia via un nemico\n5 Energia: meditare per pulire gli status e ripristinare le cariche di bacchette & artefatti
actors.hero.herosubclass.priest=Sacerdote
actors.hero.herosubclass.priest_short_desc=Il _Sacerdote_ ottiene nuovi incantesimi a lungo raggio e una versione potenziata di luce guida.
actors.hero.herosubclass.priest_desc=Il Sacerdote ottiene una varietà di incantesimi nuovi e migliorati che enfatizzano il combattimento a distanza e le sinergie con oggetti magici.\n\nIl Sacerdote può lanciare _Luce Guida_ gratuitamente una volta ogni 50 turni, illumina i nemici bersagliati da qualsiasi dei suoi incantesimi, e può consumare lo stato illuminato con alleati, bacchette e alcuni artefatti per applicare danno bonus equivalente al suo livello +5.\n\nInoltre il Sacerdote ottiene l'incantesimo _Splendore_, che dissipa l'oscurità e affligge tutti i nemici visibili, attivando e applicando lo stato illuminato e stordendoli brevemente al costo di 2 cariche.
actors.hero.herosubclass.paladin=Paladino
actors.hero.herosubclass.paladin_short_desc=Il _Paladino_ ottiene delle nuove magie a corto raggio e delle versioni migliorate dell'arma sacra e dello scudo.
actors.hero.herosubclass.paladin_desc=Il Paladino ottiene una varietà di incantesimi nuovi e potenziati che enfatizzano il combattimento corpo a corpo e la sinergia con armi e armature.\n\nGli incantesimi _Arma Sacra_ e _Scudo Sacro_ del Paladino garantiscono bonus maggiori, non sostituiscono più gli incantamenti e i glifi già presenti, e possono essere estesi lanciando altri incantesimi.\n\nIl Paladino ottiene anche l'incantesimo _Colpo_, che consente di effettuare un colpo corpo a corpo garantito con danni bonus e potenza d’incantamento.

##talents
actors.hero.talent$provokedangertracker.name=rabbia provocata
actors.hero.talent$provokedangertracker.desc=Il Guerriero ha recentemente perso i suoi scudi, il suo prossimo attacco fisico infliggerà danni bonus.\n\nTurni rimanenti: %s.
actors.hero.talent$lingeringmagictracker.name=magia persistente
actors.hero.talent$lingeringmagictracker.desc=Il Mago ha recentemente utilizzato un bastone o una bacchetta, il suo prossimo attacco fisico infliggerà danni bonus.\n\nTurni rimanenti: %s.
actors.hero.talent$followupstriketracker.name=colpo consecutivo
actors.hero.talent$followupstriketracker.desc=La Cacciatrice ha recentemente attaccato un nemico con un'arma da lancio, il suo prossimo attacco da mischia contro lo stesso bersaglio avrà il danno aumentato.\n\nTurni rimanenti: %s.
actors.hero.talent$patientstriketracker.name=colpo paziente
actors.hero.talent$patientstriketracker.desc=La Duellante ha appena speso un turno aspettando, il suo prossimo attacco in mischia infliggerà danni bonus.
actors.hero.talent$improvisedprojectilecooldown.name=Conto alla rovescia per i Proiettili improvvisati
actors.hero.talent$improvisedprojectilecooldown.desc=Hai usato questo talento di recente, devi attendere per usarlo di nuovo.\n\nTurni rimanenti:%s.
actors.hero.talent$rejuvenatingstepscooldown.name=Conto alla rovescia per i Passi rigenerativi
actors.hero.talent$rejuvenatingstepscooldown.desc=Hai usato questo talento di recente, devi attendere per usarlo di nuovo.\n\nTurni rimanenti:%s.
actors.hero.talent$seershotcooldown.name=Conto alla rovescia per il Colpo del veggente
actors.hero.talent$seershotcooldown.desc=Hai usato questo talento di recente, devi attendere per usarlo di nuovo.\n\nTurni rimanenti:%s.
actors.hero.talent$aggressivebarriercooldown.name=ricarica della barriera aggressiva
actors.hero.talent$aggressivebarriercooldown.desc=Hai usato questo talento di recente, devi attendere per usarlo di nuovo.\n\nTurni rimanenti:%s.
actors.hero.talent$liquidagilacctracker.name=agilità liquida
actors.hero.talent$liquidagilacctracker.desc=Il prossimo attacco in mischia della Duellante avrà maggiore accuratezza.\n\nTurni rimanenti: %s.
actors.hero.talent$lethalhastecooldown.name=ricarica di rapidità letale
actors.hero.talent$lethalhastecooldown.desc=Hai usato questo talento di recente, devi attendere per usarlo di nuovo.\n\nTurni rimanenti:%s.
actors.hero.talent$swiftequipcooldown.name=ricarica di equipaggiamento rapido
actors.hero.talent$swiftequipcooldown.desc=Hai usato questo talento di recente, devi attendere per usarlo di nuovo.\n\nTurni rimanenti:%s.
actors.hero.talent$preciseassaulttracker.name=assalto preciso
actors.hero.talent$preciseassaulttracker.desc=Il prossimo attacco in mischia della Duellante avrà maggiore accuratezza.\n\nTurni rimanenti: %s.
actors.hero.talent$deadlyfollowuptracker.name=seguito mortale
actors.hero.talent$deadlyfollowuptracker.desc=La Duellante ha recentemente attaccato un nemico con un'arma da lancio, i suoi attacchi in mischia contro lo stesso bersaglio avranno i danni aumentati.\n\nTurni rimanenti: %s.
actors.hero.talent$combinedlethalityabilitytracker.executed=giustiziato
actors.hero.talent$satiatedspellstracker.name=Incantesimo Protettivo
actors.hero.talent$satiatedspellstracker.desc=Il prossimo incantesimo lanciato dal Chierico gli garantirà una piccola quantità di scudo.
actors.hero.talent$searinglightcooldown.name=Luce bruciante
actors.hero.talent$searinglightcooldown.desc=Hai usato questo talento di recente, devi attendere per usarlo di nuovo.\n\nTurni rimanenti:%s.

#warrior
actors.hero.talent.hearty_meal.title=pasto abbondante
actors.hero.talent.hearty_meal.desc=_+1:_ Mangiare cibo guarisce il Guerriero per _4 HP_ quando ha il 33% della vita rimanente o di meno.\n\n_+2:_ Mangiare cibo guarisce il Guerriero per _6 HP_ quando ha il 33% della vita rimanente o di meno.
actors.hero.talent.veterans_intuition.title=l'intuizione del veterano
actors.hero.talent.veterans_intuition.desc=_+1:_ Il Guerriero identifica le armi _1,75 volte più velocemente_ e le armature _2,5 volte più velocemente_.\n\n_+2:_ Il Guerriero identifica le armi _2,5 volte più velocemente_ e le armature _quando le equipaggia_.
actors.hero.talent.provoked_anger.title=rabbia provocata
actors.hero.talent.provoked_anger.desc=_+1:_ Quando un qualunque bonus di scudo del Guerriero è distrutto da danni, il suo prossimo attacco fisico infliggerà _3 danni bonus_. \n\n_+2:_ Quando un qualunque bonus di scudo del Guerriero è distrutto da danni, il suo prossimo attacco fisico infliggerà _5 danni bonus_.
actors.hero.talent.iron_will.title=volontà di ferro
actors.hero.talent.iron_will.desc=_+1:_ Lo scudo generato dal sigillo del Guerriero è _aumentato di 1_. \n\n_+2:_ Lo scudo generato dal sigillo del Guerriero è _aumentato di 2_.
actors.hero.talent.iron_will.meta_desc=_Se questo talento viene ottenuto da un altro eroe_ garantirà passivamente una versione di massimo 1 o 2 scudo dell'effetto del sigillo rotto del Guerriero.

actors.hero.talent.iron_stomach.title=stomaco di ferro
actors.hero.talent.iron_stomach.desc=_+1:_ Il Guerriero mangia il cibo in 1 solo turno, e mentre sta mangiando ha il _75% di resistenza ai danni_.\n\n_+2:_ Il Guerriero mangia il cibo in 1 solo turno, e mentre sta mangiando ha il _100% di resistenza ai danni_.
actors.hero.talent.liquid_willpower.title=forza di volontà liquida
actors.hero.talent.liquid_willpower.desc=_+1:_ Il Guerriero ottiene _6.5% dei suoi PS massimi in forma di scudo_ quando beve o lancia una pozione, una miscela o un elisir. \n\n_+2:_ Il Guerriero ottiene _10% dei suoi PS massimi in forma di scudo_ quando beve o lancia una pozione, una miscela o un elisir. \n\nLa quantità di scudo è raddoppiata quando si utilizza una pozione di forza, esperienza o oggetti alchemici creati usando queste pozioni. \n\nPer gli oggetti alchemici con quantità di output più elevate (ad esempio infuso d'acqua), questo talento ha la possibilità di attivarsi in base alla quantità di quell'oggetto prodotta.
actors.hero.talent.runic_transference.title=trasferimento runico
actors.hero.talent.runic_transference.desc=_+1:_ Il sigillo rotto del Guerriero può trasferire i _glifi normali_ nello stesso modo in cui trasferisce un miglioramento.\n\n_+2:_ Il sigillo rotto del Guerriero può trasferire i _glifi normali, potenti e maledetti_ nello stesso modo in cui trasferisce un miglioramento.\n\nIl sigillo può trasferire glifi solo se questi sono stati applicati all'armatura quando il sigillo era apposto.
actors.hero.talent.runic_transference.meta_desc=_Se questo talento viene acquisito da un altro eroe_ aiuterà invece i glifi sulla tua armatura a resistere dall'essere rimossi dalle pergamene di miglioramento. I glifi inizieranno ad essere persi quando si migliora al livello 6 (da 4) a +1, o al livello 7 (da 4) a +2. Il livello dal quale è garantito che i glifi verranno persi è invariato a + 8.
actors.hero.talent.lethal_momentum.title=inerzia letale
actors.hero.talent.lethal_momentum.desc=_+1:_ Quando il Guerriero arreca un colpo mortale con un'arma fisica, l'attacco ha il _67% di probabilità_ di durare 0 turni.\n\n_+2:_ Quando il Guerriero arreca un colpo mortale con un'arma fisica, l'attacco ha _100% di probabilità_ di durare 0 turni.
actors.hero.talent.improvised_projectiles.title=proiettili improvvisati
actors.hero.talent.improvised_projectiles.desc=_+1:_ Il Guerriero può accecare un nemico per _2 turni_ lanciandogli contro un oggetto che non sia un'arma da lancio. Questa abilità torna disponibile dopo 50 turni.\n\n_+2:_ Il Guerriero può accecare un nemico per _3 turni_ lanciandogli contro un oggetto che non sia un'arma da lancio. Questa abilità torna disponibile dopo 50 turni.

actors.hero.talent.hold_fast.title=tener duro
actors.hero.talent.hold_fast.desc=_+1:_ Quando il Guerriero attende, ottiene _1-2 armatura_ e rallenta il decadimento della combo e degli effetti dello scudo del _50%_ fino a che non si muove di nuovo.\n\n_+2:_ Quando il Guerriero attende, ottiene _2-4 armatura_ e rallenta il decadimento della combo e degli effetti dello scudo del _75%_ fino a che non si muove di nuovo.\n\n_+3:_ Quando il Guerriero attende, ottiene _3-6 armatura_ e rallenta il decadimento della combo e degli effetti dello scudo del _100%_ fino a che non si muove di nuovo.
actors.hero.talent.strongman.title=uomo forzuto
actors.hero.talent.strongman.desc=_+1:_ La forza del Guerriero viene _aumentata dell'8%_, arrotondandola per difetto.\n\n_+2:_ La forza del Guerriero viene _aumentata del 13%_, arrotondandola per difetto.\n\n_+3:_ La forza del Guerriero viene _aumentata del 18%_, arrotondandola per difetto.

actors.hero.talent.endless_rage.title=furia senza fine
actors.hero.talent.endless_rage.desc=_+1:_ Il Berserker può raggiungere al massimo il _116% di rabbia_.\n\n_+2:_ Il Berserker può raggiungere al massimo il _133% di rabbia_.\n\n_+3:_ Il Berserker può raggiungere al massimo il _150% di rabbia_.\n\nOgni punto di rabbia oltre il 100% aumenta lo scudo ottenuto dalla furia di 1% e riduce il tempo di recupero di 1%, ma non aumenta il bonus di danno oltre +50%.
actors.hero.talent.deathless_fury.title=furia immortale
actors.hero.talent.deathless_fury.desc=_+1:_ La furia si attiva automaticamente se il Berserker sta per morire e la rabbia è al 100%, ma ha un tempo di recupero di _3 livelli di esperienza_ quando ciò accade.\n\n_+2:_ La furia si attiva automaticamente se il Berserker sta per morire e la rabbia è al 100%, ma ha un tempo di recupero di _2 livelli di esperienza_ quando ciò accade.\n\n_+3:_ La furia si attiva automaticamente se il Berserker sta per morire e la rabbia è al 100%, ma ha un tempo di recupero di _1 livello di esperienza_ quando ciò accade.\n\nNota che il Berserker morirà comunque se ha ancora 0 PS quando la furia finisce.
actors.hero.talent.enraged_catalyst.title=catalizzatore infuriato
actors.hero.talent.enraged_catalyst.desc=_+1:_ Gli incantesimi e le maledizioni dell'arma utilizzata dal Berserker si attivano tanto più di frequente quanta più furia ha accumulato, fino ad avere il _15% di attivazioni in più_ quando la furia raggiunge il 100%.\n\n_+2:_ Gli incantesimi e le maledizioni dell'arma utilizzata dal Berserker si attivano tanto più di frequente quanta più furia ha accumulato, fino ad avere il _30% di attivazioni in più_ quando la furia raggiunge il 100%.\n\n_+3:_ Gli incantesimi e le maledizioni dell'arma utilizzata dal Berserker si attivano tanto più di frequente quanta più furia ha accumulato, fino ad avere il _45% di attivazioni in più_ quando la furia raggiunge il 100%.

actors.hero.talent.cleave.title=fendere
actors.hero.talent.cleave.desc=_+1:_ Il tempo extra che il Gladiatore ottiene in seguito a una uccisione è aumentato a _30 turni_, da 15.\n\n_+2:_ Il tempo extra che il Gladiatore ottiene in seguito a una uccisione è aumentato a _45 turni_, da 15.\n\n_+3:_ Il tempo extra che il Gladiatore ottiene in seguito a una uccisione è aumentato a _60 turni_, da 15.
actors.hero.talent.lethal_defense.title=difesa letale
actors.hero.talent.lethal_defense.desc=_+1:_ Quando il Gladiatore uccide un nemico con una mossa combo, il tempo di recupero dello scudo del suo sigillo rotto è _ridotto di 50 turni_. \n\n_+2:_ Quando il Gladiatore uccide un nemico con una mossa combo, il tempo di recupero dello scudo del suo sigillo rotto è _ridotto di 100 turni_. \n\n_+3:_ Quando il Gladiatore uccide un nemico con una mossa combo, il tempo di recupero dello scudo del suo sigillo rotto è _ridotto di 150 turni_. \n\nIl tempio di recupero dello scudo può essere ridotto fino a -150 turni da questo talento, il che significa che sarà attivo subito dopo essere utilizzato.
actors.hero.talent.enhanced_combo.title=combo avanzate
actors.hero.talent.enhanced_combo.desc=_+1:_ Quando il Gladiatore ha almeno 7 punti combo, Spintone spinge indietro i nemici di 3 caselle in più, provoca vertigine, e può spingere i nemici nei fossi.\n\n_+2:_ Oltre ai benefici di +1, quando il Gladiatore ha almeno 9 punti combo, Parata può bloccare molteplici attacchi.\n\n_+3:_ Oltre ai benefici di +1 e +2, il Gladiatore può balzare di (punti combo)/3 caselle quando usa Assalto, Frana o Furore.

actors.hero.talent.body_slam.title=schianto a terra
actors.hero.talent.body_slam.desc=_+1:_ Quando il Guerriero atterra dopo essere saltato, tutti i nemici adiacenti subiscono danni pari a _1-4 più il 25%_ del suo potere di blocco dei danni.\n\n_+2:_ Quando il Guerriero atterra dopo essere saltato, tutti i nemici adiacenti subiscono danni pari a _2-8 più il 50%_ del suo potere di blocco dei danni.\n\n_+3:_ Quando il Guerriero atterra dopo essere saltato, tutti i nemici adiacenti subiscono danni pari a _3-12 più il 75%_ del suo potere di blocco dei danni.\n\n_+4:_ Quando il Guerriero atterra dopo essere saltato, tutti i nemici adiacenti subiscono danni pari a _4-16 più il 100%_ del suo potere di blocco dei danni.
actors.hero.talent.impact_wave.title=onda all'impatto
actors.hero.talent.impact_wave.desc=_+1:_ Quando il Guerriero atterra dopo aver saltato, tutti i nemici adiacenti vengono spinti indietro di _2 caselle_ e c'è una _probabilità del 25%_ che diventino vulnerabili per 5 turni.\n\n_+2:_ Quando il Guerriero atterra dopo aver saltato, tutti i nemici adiacenti vengono spinti indietro di _3 caselle_ e c'è una _probabilità del 50%_ che diventino vulnerabili per 5 turni.\n\n_+3:_ Quando il Guerriero atterra dopo aver saltato, tutti i nemici adiacenti vengono spinti indietro di _4 caselle_ e c'è una _probabilità del 75%_ che diventino vulnerabili per 5 turni.\n\n_+4:_ Quando il Guerriero atterra dopo aver saltato, tutti i nemici adiacenti vengono spinti indietro di _5 caselle_ e c'è una _probabilità del 100%_ che diventino vulnerabili per 5 turni.
actors.hero.talent.double_jump.title=doppio salto
actors.hero.talent.double_jump.desc=_+1:_ Se il Guerriero compie un secondo salto entro 3 turni, il costo di carica del salto è _ridotto del 16%_.\n\n_+2:_ Se il Guerriero compie un secondo salto entro 3 turni, il costo di carica del salto è _ridotto del 30%_.\n\n_+3:_ Se il Guerriero compie un secondo salto entro 3 turni, il costo di carica del salto è _ridotto del 40%_.\n\n_+4:_ Se il Guerriero compie un secondo salto entro 3 turni, il costo di carica del salto è _ridotto del 50%_.

actors.hero.talent.expanding_wave.title=onda amplificata
actors.hero.talent.expanding_wave.desc=_+1:_ Il raggio dell'Onda d'urto è incrementato a _6 caselle_, dalle 5 iniziali, e l'ampiezza del cono è incrementata a _75 gradi_, dai 60 iniziali.\n\n_+2:_ Il raggio dell'Onda d'urto è incrementato a _7 caselle_, dalle 5 iniziali, e l'ampiezza del cono è incrementata a _90 gradi_, dai 60 iniziali.\n\n_+3:_ Il raggio dell'Onda d'urto è incrementato a _8 caselle_, dalle 5 iniziali, e l'ampiezza del cono è incrementata a _105 gradi_, dai 60 iniziali.\n\n_+4:_ Il raggio dell'Onda d'urto è incrementato a _9 caselle_, dalle 5 iniziali, e l'ampiezza del cono è incrementata a _120 gradi_, dai 60 iniziali.
actors.hero.talent.striking_wave.title=onda sorprendente
actors.hero.talent.striking_wave.desc=_+1:_ L'onda d'urto ha un _probabilità del 30%_ di utilizzare anche effetti come incantesimi e combo.\n\n+2:_ L'onda d'urto ha un _probabilità del 60%_ di utilizzare anche effetti come incantesimi e combo.\n\n+3:_ L'onda d'urto ha un _probabilità del 90%_ di utilizzare anche effetti come incantesimi e combo.\n\n+4:_ L'onda d'urto ha un _probabilità del 100%_ di utilizzare anche effetti come incantesimi e combo e dona agli incantesimi _+20% di potenza_.
actors.hero.talent.shock_force.title=forza d'urto
actors.hero.talent.shock_force.desc=_+1:_ L'Onda d'urto infligge _20% danni in più_ e ha una _probabilità del 25%_ di stordire, al posto di azzoppare.\n\n_+2:_ L'Onda d'urto infligge _40% danni in più_ e ha una _probabilità del 50%_ di stordire, al posto di azzoppare.\n\n_+3:_ L'Onda d'urto infligge _60% danni in più_ e ha una _probabilità del 75%_ di stordire, al posto di azzoppare.\n\n_+4:_ L'Onda d'urto infligge _80% danni in più_ e ha una _probabilità del 100%_ di stordire, al posto di azzoppare.

actors.hero.talent.sustained_retribution.title=ricompensa persistente
actors.hero.talent.sustained_retribution.desc=_+1:_ Il Guerriero infligge il _115% di danno bonus_ distribuito in _2 attacchi_, al posto di infliggere il 100% di danno bonus in 1 attacco.\n\n_+2:_ Il Guerriero infligge il _130% di danno bonus_ distribuito in _3 attacchi_, al posto di infliggere il 100% di danno bonus in 1 attacco.\n\n_+3:_ Il Guerriero infligge il _145% di danno bonus_ distribuito in _4 attacchi_, al posto di infliggere il 100% di danno bonus in 1 attacco.\n\n_+4:_ Il Guerriero infligge il _160% di danno bonus_ distribuito in _5 attacchi_, al posto di infliggere il 100% di danno bonus in 1 attacco.
actors.hero.talent.shrug_it_off.title=fare spallucce
actors.hero.talent.shrug_it_off.desc=_+1:_ La riduzione del danno del Guerriero durante la resistenza è _aumentata al 60%_, dal 50%.\n\n_+2:_ La riduzione del danno del Guerriero durante la resistenza è _aumentata al 68%_, dal 50%.\n\n_+3:_ La riduzione del danno del Guerriero durante la resistenza è _aumentata al 74%_, dal 50%.\n\n_+4:_ La riduzione del danno del Guerriero durante la resistenza è _aumentata all'80%_, dal 50%.
actors.hero.talent.even_the_odds.title=pari opportunità
actors.hero.talent.even_the_odds.desc=_+1:_ Quando finisce di incassare, il Guerriero infligge un ulteriore _danno bonus del 5%_ per ogni nemico che si trova entro 2 caselle.\n\n_+2:_ Quando finisce di incassare, il Guerriero infligge un ulteriore _danno bonus del 10%_ per ogni nemico che si trova entro 2 caselle.\n\n_+3:_ Quando finisce di incassare, il Guerriero infligge un ulteriore _danno bonus del 15%_ per ogni nemico che si trova entro 2 caselle.\n\n_+4:_ Quando finisce di incassare, il Guerriero infligge un ulteriore _danno bonus del 20%_ per ogni nemico che si trova entro 2 caselle.

#mage
actors.hero.talent.empowering_meal.title=pasto energizzante
actors.hero.talent.empowering_meal.desc=_+1:_ Mangiare cibo garantisce al Mago _2 danni bonus_ le successive 3 volte in cui infligge danni con una bacchetta.\n\n_+2:_ Mangiare cibo garantisce al Mago _3 danni bonus_ le successive 3 volte in cui infligge danni con una bacchetta.
actors.hero.talent.scholars_intuition.title=intuito dello studioso
actors.hero.talent.scholars_intuition.desc=_+1:_ Il Mago identifica le bacchette _3 volte più veloce_.\n\n_+2:_ Il Mago identifica le bacchette _quando le usa_.
actors.hero.talent.lingering_magic.title=magia persistente
actors.hero.talent.lingering_magic.desc=_+1:_ Quando il Mago colpisce con una bacchetta o un bastone, il suo successivo attacco fisico infligge _1-2 danni bonus_.\n\n_+2:_ Quando il Mago colpisce con una bacchetta o un bastone, il suo successivo attacco fisico infligge _2 danni bonus_.
actors.hero.talent.backup_barrier.title=barriera di scorta
actors.hero.talent.backup_barrier.desc=_+1:_ Il Mago guadagna _3 punti scudo_ quando utilizza l'ultima carica del suo bastone.\n\n_+2:_ Il Mago guadagna _5 punti scudo_ quando utilizza l'ultima carica del suo bastone.
actors.hero.talent.backup_barrier.meta_desc=_Se questo talento viene ottenuto da un altro eroe_ verrà invece attivato dalla bacchetta di livello più alto.

actors.hero.talent.energizing_meal.title=pasto energizzante
actors.hero.talent.energizing_meal.desc=_+1:_ Il Mago mangia il cibo in 1 solo turno, e ottiene _5 turni di ricarica delle bacchette_.\n\n_+2:_ Il Mago mangia il cibo in 1 solo turno, e ottiene _8 turni di ricarica delle bacchette_.
actors.hero.talent.inscribed_power.title=potere inscritto
actors.hero.talent.inscribed_power.desc=_+1:_ Quando il Mago legge una pergamena o usa un oggetto incantesimo, i suoi _prossimi 2 colpi di bacchetta_ ottengono +2 livelli.\n\n_+2:_ Quando il Mago legge una pergamena o usa un oggetto incantesimo, i suoi _successivi 3 colpi di bacchetta_ ottengono +2 livelli.\n\nIl numero di colpi di bacchetta potenziati viene raddoppiato quando si utilizza una pergamena di oggetti di potenziamento, trasmutazione o alchimia che devono essere realizzati utilizzando tali pergamene.\n\nPer gli oggetti alchemici con quantità di output più elevate (ad esempio la maggior parte degli incantesimi), questo talento ha la possibilità di attivarsi in base alla quantità di quell'oggetto prodotta.
actors.hero.talent.wand_preservation.title=conservazione della bacchetta
actors.hero.talent.wand_preservation.desc=_+1:_ Quando il Mago infonde una nuova bacchetta nel suo bastone, la vecchia bacchetta viene restituita a +0, _ma questo può essere fatto solo una volta._\n\n_+2:_ Quando il Mago infonde una nuova bacchetta nel suo bastone, la vecchia bacchetta viene restituita a +0, _questo può essere ripetuto con un tempo di recupero di un livello dell'eroe._
actors.hero.talent.wand_preservation.meta_desc=_Se questo talento viene ottenuto da un altro eroe_ aumenterà invece la quantità di resina arcana ottenuta mettendo una bacchetta in un calderone alchemico di 1 a +1 o di 2 a +2.
actors.hero.talent.arcane_vision.title=visione arcana
actors.hero.talent.arcane_vision.desc=_+1:_ Quando il Mago colpisce un nemico con una bacchetta, guadagna _10 turni_ di visione mentale.\n\n_+2:_ Quando il Mago colpisce un nemico con una bacchetta, guadagna _15 turni_ di visione mentale.
actors.hero.talent.shield_battery.title=scudo a batteria
actors.hero.talent.shield_battery.desc=_+1:_ Il Mago può colpirsi da solo con una bacchetta per convertirne tutte le cariche in uno scudo con un tasso del _4% degli HP massimi per carica_.\n\n_+2:_ Il Mago può colpirsi da solo con una bacchetta per convertirne tutte le cariche in uno scudo con un tasso del _6% degli HP massimi per carica_.

actors.hero.talent.desperate_power.title=potere disperato
actors.hero.talent.desperate_power.desc=_+1:_ Le bacchette e il bastone del Mago guadagnano _+1 livello_ sull'ultima carica quando hanno raggiunto l'ultima carica.\n\n_+2:_ Le bacchette e il bastone del Mago guadagnano _+2 livelli_ sull'ultima carica quando hanno raggiunto l'ultima carica.\n\n_+3:_ Le bacchette e il bastone del Mago guadagnano _+3 livelli_ sull'ultima carica quando hanno raggiunto l'ultima carica.
actors.hero.talent.ally_warp.title=curvatura alleata
actors.hero.talent.ally_warp.desc=_+1:_ Il Mago può selezionare un alleato e scambiarsi di posto istantaneamente con lui, nel _raggio di 2 caselle_.\n\n_+2:_ Il Mago può selezionare un alleato e scambiarsi di posto istantaneamente con lui, nel _raggio di 4 caselle_.\n\n_+3:_ Il Mago può selezionare un alleato e scambiarsi di posto istantaneamente con lui, nel _raggio di 6 caselle_.\n\nIl Mago non può scambiarsi di posto con alleati immobili.

actors.hero.talent.empowered_strike.title=colpo energizzante
actors.hero.talent.empowered_strike.desc=_+1:_ Dopo aver sparato con il bastone, il Mago Guerriero ottiene _+16% di danno_ e l'effetto bonus del bastone ottiene _+50% di potenza_.\n\n_+2:_ Dopo aver sparato con il bastone, il Mago Guerriero ottiene _+33% di danno_ e l'effetto bonus del bastone ottiene _+100% di potenza_.\n\n_+3:_ Dopo aver sparato con il bastone, il Mago Guerriero ottiene _+50% di danno_ e l'effetto bonus del bastone ottiene _+150% di potenza_.
actors.hero.talent.mystical_charge.title=carica mistica
actors.hero.talent.mystical_charge.desc=_+1:_ Attaccare in mischia con il bastone garantisce al Mago Guerriero _0.5 turni_ di ricarica dell'artefatto.\n\n_+2:_ Attaccare in mischia con il bastone garantisce al Mago Guerriero _1 turno_ di ricarica dell'artefatto.\n\n_+3:_ Attaccare in mischia con il bastone garantisce al Mago Guerriero _1.5 turni_ di ricarica dell'artefatto.
actors.hero.talent.excess_charge.title=carica in eccesso
actors.hero.talent.excess_charge.desc=_+1:_ Sparando col bastone del Mago Guerriero quando esso è completamente carico gli garantirà _0,67 punti scudo_ per livello del bastone.\n\n_+2:_ Sparando col bastone del Mago Guerriero quando esso è completamente carico gli garantirà _1,33 punti scudo_ per livello del bastone.\n\n_+3:_ Sparando col bastone del Mago Guerriero quando esso è completamente carico gli garantirà _2 punti scudo_ per livello del bastone.

actors.hero.talent.soul_siphon.title=trasferimento di anime
actors.hero.talent.soul_siphon.desc=_+1:_ Il Marchio dell'anima si attiva al _13% della sua efficacia_ quando il nemico subisce danni fisici da altri personaggi.\n\n_+2:_ Il Marchio dell'anima si attiva al _27% della sua efficacia_ quando il nemico subisce danni fisici da altri personaggi.\n\n_+3:_ Il Marchio dell'anima si attiva al _40% della sua efficacia_ quando il nemico subisce danni fisici da altri personaggi.
actors.hero.talent.soul_eater.title=divoratore di anime
actors.hero.talent.soul_eater.desc=_+1:_ Il Marchio dell'anima garantisce _0.33 turni_ di sazietà per ogni danno fisico subito dal nemico. Quando tale nemico muore, c'è una _probabilità del 10%_ che si attivino i talenti relativi all'assunzione di cibo.\n\n_+2:_ Il Marchio dell'anima garantisce _0.67 turni_ di sazietà per ogni danno fisico subito dal nemico. Quando tale nemico muore, c'è una _probabilità del 20%_ che si attivino i talenti relativi all'assunzione di cibo.\n\n_+3:_ Il Marchio dell'anima garantisce _1 turno_ di sazietà per ogni danno fisico subito dal nemico. Quando tale nemico muore, c'è una _probabilità del 30%_ che si attivino i talenti relativi all'assunzione di cibo.
actors.hero.talent.necromancers_minions.title=servitori del necromante
actors.hero.talent.necromancers_minions.desc=_+1:_ Quando muore un nemico con il Marchio dell'anima, lo Stregone ha una _probabilità del 13%_ di riportarlo in vita come spettro corrotto.\n\n_+2:_ Quando muore un nemico con il Marchio dell'anima, lo Stregone ha una _probabilità del 27%_ di riportarlo in vita come spettro corrotto.\n\n_+3:_ Quando muore un nemico con il Marchio dell'anima, lo Stregone ha una _probabilità del 40%_ di riportarlo in vita come spettro corrotto.

actors.hero.talent.blast_radius.title=raggio dell'esplosione
actors.hero.talent.blast_radius.desc=_+1:_ Il raggio dell'Esplosione Elementale è incrementato a _5 caselle_, dalle 4 iniziali.\n\n_+2:_ Il raggio dell'Esplosione Elementale è incrementato a _6 caselle_, dalle 4 iniziali.\n\n_+3:_ Il raggio dell'Esplosione Elementale è incrementato a _7 caselle_, dalle 4 iniziali.\n\n_+4:_ Il raggio dell'Esplosione Elementale è incrementato a _8 caselle_, dalle 4 iniziali.
actors.hero.talent.elemental_power.title=potenza dell'elemento
actors.hero.talent.elemental_power.desc=_+1:_ La potenza dell'Esplosione Elementale è aumentata del _25%_.\n\n_+2:_ La potenza dell'Esplosione Elementale è aumentata del _50%_.\n\n_+3:_ La potenza dell'Esplosione Elementale è aumentata del _75%_.\n\n_+4:_ La potenza dell'Esplosione Elementale è aumentata del_100%_.
actors.hero.talent.reactive_barrier.title=barriera dinamica
actors.hero.talent.reactive_barrier.desc=_+1:_ Il Mago ottiene _2,5 punti scudo_ per ogni personaggio colpito dall'Esplosione Elementale, fino ad un massimo di 5 personaggi.\n\n_+2:_ Il Mago ottiene _5 punti scudo_ per ogni personaggio colpito dall'Esplosione Elementale, fino ad un massimo di 6 personaggi.\n\n_+3:_ Il Mago ottiene _7,5 punti scudo_ per ogni personaggio colpito dall'Esplosione Elementale, fino ad un massimo di 7 personaggi.\n\n_+4:_ Il Mago ottiene _10 punti scudo_ per ogni personaggio colpito dall'Esplosione Elementale, fino ad un massimo di 8 personaggi.

actors.hero.talent.wild_power.title=potenza selvaggia
actors.hero.talent.wild_power.desc=_+1:_ Utilizzando la magia selvaggia, le bacchette saranno migliorate di _2 o 3, fino a +4_.\n\n_+2:_ Utilizzando la magia selvaggia, le bacchette saranno migliorate di _3, fino a +5_.\n\n_+3:_ Utilizzando la magia selvaggia, le bacchette saranno migliorate di _3 o 4, fino a +6_.\n\n_+4:_ Utilizzando la magia selvaggia, le bacchette saranno migliorate di _4, fino a +7_..
actors.hero.talent.fire_everything.title=fino all'ultimo colpo
actors.hero.talent.fire_everything.desc=_+1:_ La Magia Selvaggia ora colpisce _5 volte_ in un turno, dalle 4 iniziali, e ogni bacchetta ha il _25% di possibilità_ di essere usabile 3 volte.\n\n+2:_ La Magia Selvaggia ora colpisce _6 volte_ in un turno, dalle 4 iniziali, e ogni bacchetta ha il _50% di possibilità_ di essere usabile 3 volte.\n\n_+3:_ La Magia Selvaggia ora colpisce _7 volte_ in un turno, dalle 4 iniziali, e ogni bacchetta ha il _75% di possibilità_ di essere usabile 3 volte.\n\n_+4:_ La Magia Selvaggia ora colpisce _8 volte_ in un turno, dalle 4 iniziali, e ogni bacchetta ha il _100% di possibilità_ di essere usabile 3 volte.
actors.hero.talent.conserved_magic.title=risparmio di energia
actors.hero.talent.conserved_magic.desc=_+1:_ Ogni colpo di bacchetta durante la Magia Selvaggia ora consuma _0.33 cariche_, invece di 0.5. E ha il _25% di probabilità_ di non consumare turni.\n\n_+2:_ Ogni colpo di bacchetta durante la Magia Selvaggia ora consuma _0.225 cariche_, invece di 0.5. E ha il _50% di probabilità_ di non consumare turni.\n\n_+3:_ Ogni colpo di bacchetta durante la Magia Selvaggia ora consuma _0.15 cariche_, invece di 0.5. E ha il _75% di probabilità_ di non consumare turni.\n\n_+4:_ Ogni colpo di bacchetta durante la Magia Selvaggia ora consuma _0.1 cariche_, invece di 0.5. E ha il _100% di probabilità_ di non consumare turni.

actors.hero.talent.telefrag.title=Teledistruzione
actors.hero.talent.telefrag.desc=_+1:_ Se il Mago si teletrasporta su un altro personaggio, infligge _10-15 danni_, ma subisce anche _5 danni_.\n\n_+2:_ Se il Mago si teletrasporta su un altro personaggio, infligge _20-30 danni_, ma subisce anche _10 danni_.\n\n_+3:_ Se il Mago si teletrasporta su un altro personaggio, infligge _30-45 danni_, ma subisce anche _15 danni_.\n\n_+4:_ Se il Mago si teletrasporta su un altro personaggio, infligge _40-60 danni_, ma subisce anche _20 danni_.\n\nL'eroe non può essere ucciso da questo talento, il danno che subisce può essere ridotto dagli effetti di resistenza magica.
actors.hero.talent.remote_beacon.title=faro remoto
actors.hero.talent.remote_beacon.desc=_+1:_ Il Mago può posizionare il faro in ogni luogo entro _4 caselle_.\n\n_+2:_ Il Mago può posizionare il faro in ogni luogo entro _8 caselle_.\n\n_+3:_ Il Mago può posizionare il faro in ogni luogo entro _12 caselle_.\n\n_+4:_ Il Mago può posizionare il faro in ogni luogo entro _16 caselle_.\n\nIl Mago non può posizionare il faro in luoghi inaccessibili.
actors.hero.talent.longrange_warp.title=teletrasporto a lungo raggio
actors.hero.talent.longrange_warp.desc=_+1:_ Il Mago ora può teletrasportarsi tra piani diversi, ma con un _costo del 150%_.\n\n_+2:_ Il Mago ora può teletrasportarsi tra piani diversi, ma con un _costo del 117%_.\n\n_+3:_ Il Mago ora può teletrasportarsi tra piani diversi, ma con un _costo del 83%_.\n\n_+4:_ Il Mago ora può teletrasportarsi tra piani diversi, ma con un _costo del 50%_.\n\nIl Mago non può utilizzare questo talento per lasciare un piano bloccato.

#rogue
actors.hero.talent.cached_rations.title=razioni nascoste
actors.hero.talent.cached_rations.desc=_+1:_ Il Ladro può trovare _2 razioni di rifornimento_ posizionate nei forzieri mentre esplora i prossimi piani del dungeon.\n\n_+2:_ Il Ladro può trovare _3 razioni di rifornimento_ poste nei forzieri mentre esplora i prossimi piani del dungeon.\n\nLe razioni di rifornimento vengono consumate rapidamente, ripristinano una moderata quantità di sazietà, curano 5 hp e ripristinano 1 carica al mantello delle ombre.
actors.hero.talent.thiefs_intuition.title=intuito del ladro
actors.hero.talent.thiefs_intuition.desc=_+1:_ Il ladro identifica gli anelli _2 volte più velocemente_, e identifica il tipo di anello _nel momento in cui lo equipaggia_.\n\n_+2:_ Il ladro identifica gli anelli _nel momento in cui li equipaggia_, e identifica il tipo di anello _nel momento in cui lo prende_.
actors.hero.talent.sucker_punch.title=colpo a sorpresa
actors.hero.talent.sucker_punch.desc=_+1:_ Il Ladro infligge _1-2 danni bonus_ la prima volta che attacca a sorpresa un nemico.\n\n_+2:_ Il Ladro infligge _2 danni bonus_ la prima volta che attacca a sorpresa un nemico.
actors.hero.talent.protective_shadows.title=ombre protettive
actors.hero.talent.protective_shadows.desc=_+1:_ Il Ladro guadagna un punto scudo _ogni due turni_ se è invisibile, _fino ad un massimo di 3 punti_.\n\n+_2:_ Il Ladro guadagna un punto scudo _ogni turno_ se è invisibile, _fino ad un massimo di 5 punti_.

actors.hero.talent.mystical_meal.title=pasto mistico
actors.hero.talent.mystical_meal.desc=_+1:_ Il Ladro mangia il cibo in 1 solo turno (le razioni di cibo vengono consumate all'istante), e ottiene _3 turni di ricarica dell'artefatto_.\n\n_+2_: Il Ladro mangia il cibo in 1 solo turno (le razioni di cibo vengono consumate all'istante), e ottiene _5 turni di ricarica dell'artefatto_.\n\nQuesto talento non può essere utilizzato per ricaricare la Cornucopia stessa.
actors.hero.talent.inscribed_stealth.title=furtività inscritta
actors.hero.talent.inscribed_stealth.desc=_+1:_ Il Ladro ottiene _3 turni_ di invisibilità dopo aver letto una pergamena o usato un incantesimo.\n\n_+2:_ Il Ladro ottiene _5 turni_ di invisibilità dopo aver letto una pergamena o usato un incantesimo.\n\nLa durata dell'invisibilità viene raddoppiata quando si utilizza una pergamena di potenziamento, una pergamena di trasmutazione o oggetti alchemici che devono essere realizzati utilizzando tali pergamene.\n\nPer gli oggetti alchemici con quantità di output più elevate (ad esempio la maggior parte degli incantesimi), questo talento ha la possibilità di attivarsi in base alla quantità di quell'oggetto prodotta.
actors.hero.talent.wide_search.title=ricerca estesa
actors.hero.talent.wide_search.desc=_+1:_ Il raggio di ricerca del Ladro aumenta da un quadrato 5x5 ad un _cerchio di raggio 7_.\n\n_+2:_ Il raggio di ricerca del Ladro aumenta da un cerchio di raggio 7 ad un _quadrato 7x7_.
actors.hero.talent.wide_search.meta_desc=_Se questo talento viene ottenuto da un altro eroe_ aumenterà il loro raggio di ricerca da un quadrato 3x3 a un cerchio 5x5 a +1, o a un quadrato 5x5 a +2.
actors.hero.talent.silent_steps.title=passi silenziosi
actors.hero.talent.silent_steps.desc=_+1_ Il Ladro non sveglierà i nemici addormentati finché non si trova a _meno di 3 caselle da loro_.\n\n_+2_ Il Ladro non sveglierà i nemici addormentati finché non si trova _adiacente a loro_.
actors.hero.talent.rogues_foresight.title=lungimiranza del Ladro
actors.hero.talent.rogues_foresight.desc=_+1_ Quando il Ladro raggiunge un piano con una stanza segreta, ha il _75% di probabilità di segnalare_ che quel piano contiene un segreto.\n\n_+2_ Quando il Ladro raggiunge un piano con una stanza segreta, ha il _100% di probabilità di segnalare_ che quel piano contiene un segreto.

actors.hero.talent.light_cloak.title=manto leggero
actors.hero.talent.light_cloak.desc=_+1_ Il Ladro può usare il suo mantello delle ombre mentre non è equipaggiato, ma si ricarica col _25% di velocità_ mentre non è equipaggiato.\n\n_+2_ Il Ladro può usare il suo mantello delle ombre mentre non è equipaggiato, ma si ricarica col _50% di velocità_ mentre non è equipaggiato.\n\n_+3_ Il Ladro può usare il suo mantello delle ombre mentre non è equipaggiato, ma si ricarica col _75% di velocità_ mentre non è equipaggiato.
actors.hero.talent.light_cloak.meta_desc=_Se questo talento viene ottenuto da un altro eroe_ aumenterà invece la velocità di ricarica degli artefatti di 7/13/20% a +1/+2/+3.
actors.hero.talent.enhanced_rings.title=anelli potenziati
actors.hero.talent.enhanced_rings.desc=_+1:_ Quando il Ladro utilizza un artefatto, i suoi anelli guadagnano +1 livello per _3 turni_.\n\n_+1:_ Quando il Ladro utilizza un artefatto, i suoi anelli guadagnano +1 livello per _6 turni_.\n\n_+1:_ Quando il Ladro utilizza un artefatto, i suoi anelli guadagnano +1 livello per _9 turni_.

actors.hero.talent.enhanced_lethality.title=letalità potenziata
actors.hero.talent.enhanced_lethality.desc=_+1:_ L'Assassino può assassinare i nemici rimasti con meno del _4/13/27/67% di vita_ in base al livello di preparazione. Le percentuali base sono 3/10/20/50%.\n\n_+2:_ L'Assassino può assassinare i nemici rimasti con meno del _5/17/33/83% di vita_ in base al livello di preparazione. Le percentuali base sono 3/10/20/50%.\n\n_+3:_ L'Assassino può assassinare i nemici rimasti con meno del _6/20/40/100% di vita_ in base al livello di preparazione. Le percentuali base sono 3/10/20/50%.
actors.hero.talent.assassins_reach.title=portata dell'assassino
actors.hero.talent.assassins_reach.desc=_+1:_ Il raggio per lo scatto dell'Assassino è incrementato a _1/3/4/6 caselle_ in base al livello di preparazione. Il raggio base è 1/2/3/4.\n\n_+2:_ Il raggio per lo scatto dell'Assassino è incrementato a _2/4/6/8 caselle_ in base al livello di preparazione. Il raggio base è 1/2/3/4.\n\n_+3:_ Il raggio per lo scatto dell'Assassino è incrementato a _2/5/7/10 caselle_ in base al livello di preparazione. Il raggio base è 1/2/3/4.\n\nQuesto scatto può passare attraverso pericoli e nemici, ma non attraverso terreni solidi come muri.
actors.hero.talent.bounty_hunter.title=cacciatore di taglie
actors.hero.talent.bounty_hunter.desc=_+1:_ Quando l'Assassino uccide un nemico con un attacco preparato la probabilità di rilasciare bottino è aumentata del _2/4/8/16%_, in base al livello di preparazione.\n\n_+2:_ Quando l'Assassino uccide un nemico con un attacco preparato la probabilità di rilasciare bottino è aumentata del _4/8/16/32%_, in base al livello di preparazione.\n\n_+3:_ Quando l'Assassino uccide un nemico con un attacco preparato la probabilità di rilasciare bottino è aumentata del _6/12/24/48%_, in base al livello di preparazione.

actors.hero.talent.evasive_armor.title=armatura evasiva
actors.hero.talent.evasive_armor.desc=_+1:_ Mentre è in corsa libera, il Corridore ottiene un ulteriore _+1 punto evasione_ per ogni punto forza in eccesso sulla sua armatura.\n\n_+2:_ Mentre è in corsa libera, il Corridore ottiene ulteriori _+2 punti evasione_ per ogni punto forza in eccesso sulla sua armatura.\n\n_+3:_ Mentre è in corsa libera, il Corridore ottiene ulteriori _+3 punti evasione_ per ogni punto forza in eccesso sulla sua armatura.
actors.hero.talent.projectile_momentum.title=slancio dei proiettili
actors.hero.talent.projectile_momentum.desc=_+1:_ Mentre è in corsa libera, il Corridore ottiene _+50% di precisione e +15% di danno_ con armi da lancio.\n\n_+2:_ Mentre è in corsa libera, il Corridore ottiene _+100% di precisione e +30% di danno_ con armi da lancio.\n\n_+3:_ Mentre è in corsa libera, il Corridore ottiene _+150% di precisione e +45% di danno_ con armi da lancio.
actors.hero.talent.speedy_stealth.title=rapida furtività
actors.hero.talent.speedy_stealth.desc=_+1:_ Il Corridore ottiene 2 punti slancio per ogni turno in cui è invisibile.\n\n_+2:_ Oltre ai benefici del livello +1, la corsa libera non si resetta mentre il Corridore è invisibile.\n\n_+3:_ Oltre ai benefici dei livelli +1 e +2, il Corridore si muove a velocità 2x mentre è invisibile, indipendentemente dal fatto che sia in corsa libera o meno.

actors.hero.talent.hasty_retreat.title=ritirata rapida
actors.hero.talent.hasty_retreat.desc=_+1:_ Dopo lo scatto, il Ladro ottiene _1 turno_ di fretta e invisibilità.\n\n_+2:_ Dopo lo scatto, il Ladro ottiene _2 turni_ di fretta e invisibilità.\n\n_+3:_ Dopo lo scatto, il Ladro ottiene _3 turni_ di fretta e invisibilità.\n\n_+4:_ Dopo lo scatto, il Ladro ottiene _4 turni_ di fretta e invisibilità.
actors.hero.talent.body_replacement.title=sostituzione del corpo
actors.hero.talent.body_replacement.desc=_+1:_ Dopo lo scatto, il Ladro rilascia un'esca di legno dietro di sé che ha _20 di vita e 1-3 armatura_.\n\n_+2:_ Dopo lo scatto, il Ladro rilascia un'esca di legno dietro di sé che ha _40 di vita e 2-6 armatura_.\n\n_+3:_ Dopo lo scatto, il Ladro rilascia un'esca di legno dietro di sé che ha _60 di vita e 3-9 armatura_.\n\n_+4:_ Dopo lo scatto, il Ladro rilascia un'esca di legno dietro di sé che ha _80 di vita e 4-12 armatura_.\n\nPuò essere attivata solo un'esca alla volta.
actors.hero.talent.shadow_step.title=passi nell'ombra
actors.hero.talent.shadow_step.desc=_+1:_ Se il Ladro usa la bomba fumogena mentre è invisibile, l'utilizzo è istantaneo e il costo in cariche è _ridotto del 16%_. Tuttavia non acceca i nemici, né attiva altri talenti.\n\n_+2:_ Se il Ladro usa la bomba fumogena mentre è invisibile, l'utilizzo è istantaneo e il costo in cariche è _ridotto del 30%_. Tuttavia non acceca i nemici, né attiva altri talenti.\n\n_+3:_ Se il Ladro usa la bomba fumogena mentre è invisibile, l'utilizzo è istantaneo e il costo in cariche è _ridotto del 41%_. Tuttavia non acceca i nemici, né attiva altri talenti.\n\n_+4:_ Se il Ladro usa la bomba fumogena mentre è invisibile, l'utilizzo è istantaneo e il costo in cariche è _ridotto del 50%_. Tuttavia non acceca i nemici, né attiva altri talenti.

actors.hero.talent.fear_the_reaper.title=paura del mietitore
actors.hero.talent.fear_the_reaper.desc=_+1:_ Quando un nemico marchiato raggiunge 0 hp,  diventa _paralizzato_.\n\n_+2:_ Quando un nemico marchiato raggiunge 0 hp, diventa _impaurito e paralizzato_.\n\n_+3:_ Quando un nemico marchiato raggiunge 0 hp, diventa _impaurito e paralizzato_ e i nemici entro 3 caselle diventano _paralizzati_.\n\n_+4:_ Quando un nemico marchiato raggiunge 0 hp, diventa _impaurito e paralizzato_ e i nemici entro 3 caselle diventano _impauriti e paralizzati_.
actors.hero.talent.deathly_durability.title=resistenza della morte
actors.hero.talent.deathly_durability.desc=_+1:_ I nemici uccisi dal Marchio della Morte forniscono al Ladro un numero di punti scudo uguale al _13%_ degli HP che avevano nel momento in cui erano stati marchiati.\n\n_+2:_ I nemici uccisi dal Marchio della Morte forniscono al Ladro un numero di punti scudo uguale al _25%_ degli HP che avevano nel momento in cui erano stati marchiati.\n\n_+3:_ I nemici uccisi dal Marchio della Morte forniscono al Ladro un numero di punti scudo uguale al _38%_ degli HP che avevano nel momento in cui erano stati marchiati.\n\n_+4:_ I nemici uccisi dal Marchio della Morte forniscono al Ladro un numero di punti scudo uguale al _50%_ degli HP che avevano nel momento in cui erano stati marchiati.
actors.hero.talent.double_mark.title=doppio marchio
actors.hero.talent.double_mark.desc=_+1:_ Marchiare un secondo bersaglio, mentre c'è già un nemico marchiato, richiede il _30% in meno_ di cariche.\n\n_+2:_ Marchiare un secondo bersaglio, mentre c'è già un nemico marchiato, richiede il _50% in meno_ di cariche.\n\n_+3:_ Marchiare un secondo bersaglio, mentre c'è già un nemico marchiato, richiede il _65% in meno_ di cariche.\n\n_+4:_ Marchiare un secondo bersaglio, mentre c'è già un nemico marchiato, richiede il _75% in meno_ di cariche.

actors.hero.talent.shadow_blade.title=lama ombra
actors.hero.talent.shadow_blade.desc=_+1:_ Il Clone Ombra guadagna l'_8%_ del danno dell'eroe per turno, e ha il _25% di probabilità_ di utilizzare l'incantamento dell'arma dell'eroe.\n\n_+2:_ Il Clone Ombra guadagna il _16%_ del danno dell'eroe per turno, e ha il _50% di probabilità_ di utilizzare l'incantamento dell'arma dell'eroe.\n\n_+3:_ Il Clone Ombra guadagna il _24%_ del danno dell'eroe per turno, e ha il _75% di probabilità_ di utilizzare l'incantamento dell'arma dell'eroe.\n\n_+4:_ Il Clone Ombra guadagna il _32%_ del danno dell'eroe per turno, e ha il _100% di probabilità_ di utilizzare l'incantamento dell'arma dell'eroe.
actors.hero.talent.cloned_armor.title=armatura clone
actors.hero.talent.cloned_armor.desc=_+1:_ Il Clone Ombra guadagna il _12%_ del valore dell'armatura dell'eroe, e ha il _25% di probabilità_ di utilizzare il glifo dell'armatura dell'eroe.\n\n_+2:_ Il Clone Ombra guadagna il _24%_ del valore dell'armatura dell'eroe, e ha il _50% di probabilità_ di utilizzare il glifo dell'armatura dell'eroe.\n\n_+3:_ Il Clone Ombra guadagna il _36%_ del valore dell'armatura dell'eroe, e ha il _75% di probabilità_ di utilizzare il glifo dell'armatura dell'eroe.\n\n_+4:_ Il Clone Ombra guadagna il _48%_ del valore dell'armatura dell'eroe, e ha il _100% di probabilità_ di utilizzare il glifo dell'armatura dell'eroe.
actors.hero.talent.perfect_copy.title=copia perfetta
actors.hero.talent.perfect_copy.desc=_+1:_ Il Clone Ombra guadagna il _10%_ degli HP massimi dell'eroe, e può istantaneamente scambiare la posizione con l'eroe se è ad una distanza massima di _1 casella_.\n\n_+2:_ Il Clone Ombra guadagna il _20%_ degli HP massimi dell'eroe, e può istantaneamente scambiare la posizione con l'eroe se è ad una distanza massima di _2 caselle_.\n\n_+3:_ Il Clone Ombra guadagna il _30%_ degli HP massimi dell'eroe, e può istantaneamente scambiare la posizione con l'eroe se è ad una distanza massima di _3 caselle_.\n\n_+4:_ Il Clone Ombra guadagna il _40%_ degli HP massimi dell'eroe, e può istantaneamente scambiare la posizione con l'eroe se è ad una distanza massima di _4 caselle_.

#huntress
actors.hero.talent.natures_bounty.title=doni della natura
actors.hero.talent.natures_bounty.desc=_+1:_ La Cacciatrice può trovare _4 bacche_ nascoste nell'erba alta mentre esplora i prossimi piani del dungeon.\n\n_+2:_ La Cacciatrice può trovare _6 bacche_ nascoste nell'erba alta mentre esplora i prossimi piani del dungeon.\n\nLe bacche vengono consumate rapidamente, ripristinano una piccola quantità di sazietà e potrebbero contenere un seme utilizzabile.
actors.hero.talent.survivalists_intuition.title=intuito del cacciatore
actors.hero.talent.survivalists_intuition.desc=_+1:_ La Cacciatrice identifica le armi da lancio _3 volte più velocemente_.\n\n_+2:_ La Cacciatrice identifica le armi da lancio _quando manda a segno un colpo con esse_.
actors.hero.talent.followup_strike.title=colpo consecutivo
actors.hero.talent.followup_strike.desc=_+1:_ Quando la Cacciatrice colpisce un nemico con il suo arco o con un'arma da lancio, il suo prossimo attacco da mischia contro quel nemico infligge _2 danni bonus_.\n\n_+2:_ Quando la cacciatrice colpisce un nemico con il suo arco o con un'arma da lancio, il suo prossimo attacco da mischia contro quel nemico infligge _3 danni bonus_.
actors.hero.talent.natures_aid.title=soccorso della natura
actors.hero.talent.natures_aid.desc=_+1:_ Grazie alla pelle coriacea, la Cacciatrice guadagna 0-2 armatura, che si indebolisce ogni _3 turni_ quando l'effetto di una pianta è attivato nel suo campo visivo.\n\n_+2:_ Grazie alla pelle coriacea, la Cacciatrice guadagna 0-2 armatura, che si indebolisce ogni _5 turni_ quando l'effetto di una pianta è attivato nel suo campo visivo.

actors.hero.talent.invigorating_meal.title=pasto tonificante
actors.hero.talent.invigorating_meal.desc=_+1:_ La Cacciatrice mangia il cibo in 1 solo turno (le bacche istantaneamente), e ottiene _1 turno di fretta_.\n\n_+2:_ La Cacciatrice mangia il cibo in 1 solo turno (le bacche istantaneamente), e ottiene _2 turni di fretta_.
actors.hero.talent.liquid_nature.title=natura liquida
actors.hero.talent.liquid_nature.desc=_+1:_ Quando la Cacciatrice beve o lancia una pozione, una miscela o un elisir, _fino a 4 tessere erba_ spuntano nell'area circostante e i nemici adiacenti rimangono immobilizzati per _1 turno_.\n\n_+2:_ Quando la Cacciatrice beve o lancia una pozione, una miscela o un elisir, _fino a 6 tessere erba_ spuntano nell'area circostante e i nemici adiacenti rimangono immobilizzati per _2 turni_.\n\nLa durata della quantità di erba e radice viene raddoppiata quando si utilizzano pozioni di forza, esperienza o oggetti alchemici che devono essere realizzati utilizzando tali pozioni.\n\nPer gli oggetti alchemici con quantità di output più elevate (ad esempio infuso d'acqua), questo talento ha la possibilità di attivarsi in base alla quantità di quell'oggetto prodotta.
actors.hero.talent.rejuvenating_steps.title=passi rigenerativi
actors.hero.talent.rejuvenating_steps.desc=_+1:_ Quando la Cacciatrice cammina su una casella di erba bassa o bruciata, la fa ricrescere in una casella di erba alta, che circonda immediatamente la Cacciatrice. Questo talento ha effetto _ogni 10 turni_.\n\n_+2:_ Quando la Cacciatrice cammina su una casella di erba bassa o bruciata, la fa ricrescere in una casella di erba alta, che circonda immediatamente la Cacciatrice. Questo talento ha effetto _ogni 5 turni_.\n\nQuesto talento produce una casella di erba calpestata, e non di erba alta, se gli effetti di rigenerazione passiva sono disabilitati o se l'eroe non guadagna esperienza da molto.
actors.hero.talent.heightened_senses.title=sensi amplificati
actors.hero.talent.heightened_senses.desc=_+1:_ La Cacciatrice ottiene visione mentale su ogni personaggio nel raggio di _2 posizioni_ rispetto alla sua.\n\n_+2:_ La Cacciatrice ottiene visione mentale su ogni personaggio nel raggio di _3 posizioni_ rispetto alla sua.
actors.hero.talent.durable_projectiles.title=proiettili durevoli
actors.hero.talent.durable_projectiles.desc=_+1:_ Le armi da lancio hanno _+50% di durevolezza_ quando sono usate dalla Cacciatrice.\n\n_+2:_ Le armi da lancio hanno _+75% di durevolezza_ quando sono usate dalla Cacciatrice.

actors.hero.talent.point_blank.title=a bruciapelo
actors.hero.talent.point_blank.desc=_+1:_ Quando la Cacciatrice utilizza il suo arco o delle armi da lancio in un combattimento in mischia, ha _-25% di precisione,_ invece del -50% iniziale.\n\n_+2:_ Quando la Cacciatrice utilizza il suo arco o delle armi da lancio in un combattimento in mischia, ha _-normale precisione,_ invece del -50% iniziale.\n\n_+3:_ Quando la Cacciatrice utilizza il suo arco o delle armi da lancio in un combattimento in mischia, ha _+25% di precisione,_ invece del -50% iniziale.\n\nNota che le armi da lancio e l'arco spirituale hanno +50% di precisione quando vengono utilizzate per attacchi a distanza.
actors.hero.talent.seer_shot.title=colpo del veggente
actors.hero.talent.seer_shot.desc=_+1:_ Quando la Cacciatrice scocca una freccia sul terreno, ottiene _5 turni_ di visione in un'area 3x3 intorno al punto d'impatto. Questo talento torna disponibile dopo 20 turni.\n\n_+2:_ Quando la Cacciatrice scocca una freccia sul terreno, ottiene _10 turni_ di visione in un'area 3x3 intorno al punto d'impatto. Questo talento torna disponibile dopo 20 turni.\n\n_+3:_ Quando la Cacciatrice scocca una freccia sul terreno, ottiene _15 turni_ di visione in un'area 3x3 intorno al punto d'impatto. Questo talento torna disponibile dopo 20 turni.
actors.hero.talent.seer_shot.meta_desc=_Se questo talento viene ottenuto da un altro eroe_ si attiverà con ogni arma da lancio.

actors.hero.talent.farsight.title=lungimiranza
actors.hero.talent.farsight.desc=_+1:_ Il raggio di visione del Cecchino _aumenta del 25%_.\n\n_+2:_ Il raggio di visione del Cecchino _aumenta del 50%_.\n\n_+3:_ Il raggio di visione del Cecchino _aumenta del 75%_.
actors.hero.talent.shared_enchantment.title=incanto condiviso
actors.hero.talent.shared_enchantment.desc=_+1:_ Le armi da lancio hanno una _possibilità del 33%_ di usare l'incantamento dell'arco del Cecchino.\n\n_+2:_ Le armi da lancio hanno una _possibilità del 67%_ di usare l'incantamento dell'arco del Cecchino.\n\n_+3:_ Le armi da lancio hanno una _possibilità del 100%_ di usare l'incantamento dell'arco del Cecchino.\n\nL'incantamento dell'arco può applicarsi in aggiunta a qualunque incantamento presente sull'arma da lancio.
actors.hero.talent.shared_upgrades.title=miglioramenti condivisi
actors.hero.talent.shared_upgrades.desc=_+1:_ Quando il Cecchino attacca con un'arma da lancio migliorata, ogni livello incrementa la durata del marchio del cecchino di 1 turno e il danno del suo attacco speciale del 16%, per un massimo di _2 turni e +33% di danno con un'arma +2_.\n\n_+2:_ Quando il Cecchino attacca con un'arma da lancio migliorata, ogni livello incrementa la durata del marchio del cecchino di 1 turno e il danno del suo attacco speciale del 16%, per un massimo di _4 turni e +67% di danno con un'arma +4_.\n\n_+3:_ Quando il Cecchino attacca con un'arma da lancio migliorata, ogni livello incrementa la durata del marchio del cecchino di 1 turno e il danno del suo attacco speciale del 16%, per un massimo di _6 turni e +100% di danno con un'arma +6_.

actors.hero.talent.durable_tips.title=punte resistenti
actors.hero.talent.durable_tips.desc=_+1:_ I dardi intinti hanno _2x durevolezza_ quando il Guardiano li usa.\n\n_+2:_ I dardi intinti hanno _3x durevolezza_ quando il Guardiano li usa.\n\n_+3:_ I dardi intinti hanno _4x durevolezza_ quando il Guardiano li usa.
actors.hero.talent.barkskin.title=pelle coriacea
actors.hero.talent.barkskin.desc=_+1:_ Quando cammina nell'erba, la Guardiana guadagna 0_50% del suo livello_ in armatura di pelle coriacea, che diminuisce ogni turno.\n\n_+2:_ Quando cammina nell'erba, la Guardiana guadagna 0_100% del suo livello_ in armatura di pelle coriacea, che diminuisce ogni turno.\n\n_+3:_ Quando cammina nell'erba, la Guardiana guadagna 0_150% del suo livello_ in armatura di pelle coriacea, che diminuisce ogni turno.
actors.hero.talent.shielding_dew.title=rugiada protettiva
actors.hero.talent.shielding_dew.desc=_+1:_ La rugiada fornisce punti scudo al Guardiano quando la sua salute è massima, fino al _20% degli HP massimi_.\n\n_+2:_ La rugiada fornisce punti scudo al Guardiano quando la sua salute è massima, fino al _40% degli HP massimi_.\n\n_+3:_ La rugiada fornisce punti scudo al Guardiano quando la sua salute è massima, fino al _60% degli HP massimi_.

actors.hero.talent.fan_of_blades.title=passione per le lame
actors.hero.talent.fan_of_blades.desc=_+1:_ Le Lame Spettrali possono colpire fino a _1 nemico in più_ infliggendo il 50% del danno. Il nemico deve essere visibile e deve trovarsi in un'area conica di _30 gradi_.\n\n_+2:_ Le Lame Spettrali possono colpire fino a _2 nemici in più_ infliggendo il 50% del danno. I nemici devono essere visibili e devono trovarsi in un'area conica di _60 gradi_.\n\n_+3:_ Le Lame Spettrali possono colpire fino a _3 nemici in più_ infliggendo il 50% del danno. I nemici devono essere visibili e devono trovarsi in un'area conica di _90 gradi_.\n\n_+4:_ Le Lame Spettrali possono colpire fino a _4 nemici in più_ infliggendo il 50% del danno. I nemici devono essere visibili e devono trovarsi in un'area conica di _120 gradi_.
actors.hero.talent.projecting_blades.title=lame sporgenti
actors.hero.talent.projecting_blades.desc=_+1:_ Le Lame Spettrali hanno _+25% di precisione_, e possono passare attraverso _2 caselle solide_.\n\n_+2:_ Le Lame Spettrali hanno _+50% di precisione_, e possono passare attraverso _4 caselle solide_.\n\n_+3:_ Le Lame Spettrali hanno _+75% di precisione_, e possono passare attraverso _6 caselle solide_.\n\n_+4:_ Le Lame Spettrali hanno _+100% di precisione_, e possono passare attraverso _8 caselle solide_.
actors.hero.talent.spirit_blades.title=lame spirituali
actors.hero.talent.spirit_blades.desc=_+1:_ Le Lame Spettrali hanno il _30% di probabilità_ di attivare l'incantamento dell'arco spirituale.\n\n_+2:_ Le Lame Spettrali hanno il _60% di probabilità_ di attivare l'incantamento dell'arco spirituale.\n\n_+3:_ Le Lame Spettrali hanno il _90% di probabilità_ di attivare l'incantamento dell'arco spirituale.\n\n_+4:_ Le Lame Spettrali hanno il _100% di probabilità_ di attivare l'incantamento dell'arco spirituale, e dona a ciascun incantesimo _+10% di potenza_.

actors.hero.talent.growing_power.title=forza crescente
actors.hero.talent.growing_power.desc=_+1:_ I bonus di attacco e di velocità di movimento assicurati dalla Forza della natura vengono incrementati rispettivamente a _38% e 125%_, dal valore iniziale di 33% e 100%.\n\n_+2:_ I bonus di attacco e di velocità di movimento assicurati dalla Forza della natura vengono incrementati rispettivamente a _42% e 150%_, dal valore iniziale di 33% e 100%.\n\n_+3:_ I bonus di attacco e di velocità di movimento assicurati dalla Forza della natura vengono incrementati rispettivamente a _46% e 175%_, dal valore iniziale di 33% e 100%.\n\n_+4:_ I bonus di attacco e di velocità di movimento assicurati dalla Forza della natura vengono incrementati rispettivamente a _50% e 200%_, dal valore iniziale di 33% e 100%.
actors.hero.talent.natures_wrath.title=ira della natura
actors.hero.talent.natures_wrath.desc=_+1:_ Quando è attivo l'effetto Potere della natura, le frecce scoccate dall'arco spirituale hanno l'_8% di probabilità_ di attivare l'effetto di una pianta nociva casuale.\n\n_+2:_ Quando è attivo l'effetto Potere della natura, le frecce scoccate dall'arco spirituale hanno il _17% di probabilità_ di attivare l'effetto di una pianta nociva casuale.\n\n_+3:_ Quando è attivo l'effetto Potere della natura, le frecce scoccate dall'arco spirituale hanno il _25% di probabilità_ di attivare l'effetto di una pianta nociva casuale.\n\n_+4:_ Quando è attivo l'effetto Potere della natura, le frecce scoccate dall'arco spirituale hanno il _33% di probabilità_ di attivare l'effetto di una pianta nociva casuale.\n\nLe piante nocive sono: Erbacieca, Fuocofiore, Calotta glaciale, Tristemischio, e Tempestavite.
actors.hero.talent.wild_momentum.title=slancio selvaggio
actors.hero.talent.wild_momentum.desc=_+1:_ Uccidere un nemico con l'arco spirituale prolunga la durata del Potere della natura di _1 turno_. Tale durata può essere estesa al massimo di _2 turni_.\n\n_+2:_ Uccidere un nemico con l'arco spirituale prolunga la durata del Potere della natura di _2 turni_. Tale durata può essere estesa al massimo di _4 turni_.\n\n_+3:_ Uccidere un nemico con l'arco spirituale prolunga la durata del Potere della natura di _3 turni_. Tale durata può essere estesa al massimo di _6 turni_.\n\n_+4:_ Uccidere un nemico con l'arco spirituale prolunga la durata del Potere della natura di _4 turni_. Tale durata può essere estesa al massimo di _8 turni_.

actors.hero.talent.eagle_eye.title=occhio di falco
actors.hero.talent.eagle_eye.desc=_+1:_ La visione dello Spirito del Falco è incrementata a _7 caselle_, dalle 6 iniziali.\n\n_+2:_ La visione dello Spirito del Falco è incrementata a _8 caselle_, dalle 6 iniziali.\n\n_+3:_ La visione dello Spirito del Falco è incrementata a _9 caselle_, dalle 6 iniziali, e guadagna _2 caselle_ di visione mentale.\n\n_+4:_ La visione dello Spirito del Falco è incrementata a _10 caselle_, dalle 6 iniziali, e guadagna _3 caselle_ di visione mentale.
actors.hero.talent.go_for_the_eyes.title=punta agli occhi
actors.hero.talent.go_for_the_eyes.desc=_+1:_ Gli attacchi dello Spirito del Falco accecano i nemici per _2 turni_\n\n_+2:_ Gli attacchi dello Spirito del Falco accecano i nemici per _5 turni_\n\n_+3:_ Gli attacchi dello Spirito del Falco accecano i nemici per _5 turni_ e li azzoppano per _2 turni_.\n\n_+4:_ Gli attacchi dello Spirito del Falco accecano i nemici per _5 turni_ e li azzoppano per _5 turni_.
actors.hero.talent.swift_spirit.title=spirito rapido
actors.hero.talent.swift_spirit.desc=_+1:_ La velocità di movimento dello Spirito del Falco è incrementata da 2 a _2,5 caselle_ per turno. Inoltre il Falco ha la certezza di schivare i primi _2 attacchi_ subìti.\n\n_+2:_ La velocità di movimento dello Spirito del Falco è incrementata da 2 a _3 caselle_ per turno. Inoltre il Falco ha la certezza di schivare i primi _4 attacchi_ subìti.\n\n_+3:_ La velocità di movimento dello Spirito del Falco è incrementata da 2 a _3,5 caselle_ per turno. Inoltre il Falco ha la certezza di schivare i primi _6 attacchi_ subìti.\n\n_+4:_ La velocità di movimento dello Spirito del Falco è incrementata da 2 a _4 caselle_ per turno. Inoltre il Falco ha la certezza di schivare i primi _8 attacchi_ subìti.

#duelist
actors.hero.talent.strengthening_meal.title=pasto rinforzante
actors.hero.talent.strengthening_meal.desc=_+1:_ Mangiare cibo garantisce alla Duellante 3 danni bonus le successive _2 volte_ che colpisce un nemico con un attacco fisico.\n\n_+2:_ Mangiare cibo garantisce alla Duellante 3 danni bonus le successive _3 volte_ che colpisce un nemico con un attacco fisico.
actors.hero.talent.adventurers_intuition.title=intuizione dell'avventuriero
actors.hero.talent.adventurers_intuition.desc=_+1:_ La Duellante identifica le armi _2,5 volte più velocemente_ e le armature _1,75 volte più velocemente_.\n\n_+2:_ La Duellante identifica le armi _quando le equipaggia_ e le armature _2,5 volte più velocemente_.
actors.hero.talent.patient_strike.title=colpo paziente
actors.hero.talent.patient_strike.desc=_+1:_ Se la Duellante attende prima di eseguire un attacco corpo a corpo, infliggerà _1-2 danni bonus_.\n\n_+2:_ Se la Duellante attende prima di eseguire un attacco corpo a corpo, infliggerà _2 danni bonus_.
actors.hero.talent.aggressive_barrier.title=barriera aggressiva
actors.hero.talent.aggressive_barrier.desc=_+1:_ La Duellante ottiene 3 scudi quando usa un'abilità dell'arma e ha il _50% di salute_ o meno.\n\n_+2:_ La Duellante guadagna 5 scudi quando usa un'abilità arma e ha il _50% di salute_ o meno.
actors.hero.talent.aggressive_barrier.meta_desc=_Se questo talento viene acquisito da un altro eroe_ garantirà invece scudi quando si effettua un attacco in mischia con poca salute, con un tempo di recupero di 50 turni.

actors.hero.talent.focused_meal.title=pasto concentrato
actors.hero.talent.focused_meal.desc=_+1:_ Mangiare cibo fa trascorrere al Duellante 1 turno e gli conferisce _0,67 cariche_ sulle sue armi.\n\n_+2:_ Mangiare cibo fa trascorrere al Duellante 1 turno e gli conferisce _1 carica_ sulle sue armi.
actors.hero.talent.focused_meal.meta_desc=_Se questo talento viene ottenuto da un altro eroe_, garantirà invece danni bonus al loro prossimo colpo pari al loro livello/3 a +1 o livello/2 a +2.
actors.hero.talent.liquid_agility.title=agilità liquida
actors.hero.talent.liquid_agility.desc=_+1:_ Quando beve o lancia una pozione, una miscela o un elisir, il Duellante ha _3 volte l'evasione_ e ha _3 volte la precisione_ al suo prossimo attacco in mischia entro 5 turni.\n\n_+2:_ Quando beve o lancia una pozione, una miscela o un elisir, il Duellante ha _evasione infinita_ e ha _precisione infinita_ sul suo prossimo attacco in mischia entro 5 turni.\n\nQuesto bonus dura per un turno e un attacco aggiuntivi quando si utilizzano pozioni di forza, esperienza o oggetti alchemici che devono essere realizzati utilizzando quelle pozioni.\n\nPer gli oggetti alchemici con quantità di output più elevate (ad esempio acqua brew), questo talento ha la possibilità di attivarsi in base alla quantità di quell'oggetto prodotta.
actors.hero.talent.weapon_recharging.title=ricarica dell'arma
actors.hero.talent.weapon_recharging.desc=_+1:_ La Duellante ottiene una carica dell'arma ogni _15 turni_ quando è sotto l'effetto di potenziamenti di ricarica di bacchette o artefatti.\n\n_+2:_ La Duellante ottiene una carica dell'arma primaria ogni _10 turni_ quando è sotto l'effetto di potenziamenti di ricarica di bacchette o artefatti.
actors.hero.talent.weapon_recharging.meta_desc=_Se questo talento viene acquisito da un altro eroe_, gli farà invece infliggere +5% di danno da mischia durante la ricarica a +1 o +7,5% di danno da mischia durante la ricarica a +2.
actors.hero.talent.lethal_haste.title=fretta letale
actors.hero.talent.lethal_haste.desc=_+1:_ Quando il Duellante sferra un colpo mortale a un nemico con l'abilità di un'arma, guadagna _3 turni_ di movimento istantaneo.\n\n_+2:_ Quando il Duellante sferra un colpo mortale a un nemico con l'abilità di un'arma, guadagna _5 turni_ di movimento istantaneo.
actors.hero.talent.lethal_haste.meta_desc=_Se questo talento viene acquisito da un altro eroe_ si attiverà invece con normali attacchi con armi, con un tempo di recupero di 100 turni.
actors.hero.talent.swift_equip.title=equipaggiamento rapido
actors.hero.talent.swift_equip.desc=_+1:_ Il Duellante può cambiare istantaneamente l'arma equipaggiata _una volta_ ogni 20 turni.\n\n_+2:_ Il Duellante può cambiare istantaneamente l'arma equipaggiata _due volte_ ogni 20 turni.\n\nSe il Duellante ha questo talento e non è in ricarica, l'uso rapido di un'arma non equipaggiata lo equipaggerà.

actors.hero.talent.precise_assault.title=assalto preciso
actors.hero.talent.precise_assault.desc=_+1:_ Quando la Duellante usa l'abilità di un'arma, ottiene _2x accuratezza_ sul suo prossimo attacco in mischia entro 5 turni.\n\n_+2:_ Quando la Duellante usa l'abilità di un'arma, ottiene _5x accuratezza_ sul suo prossimo attacco in mischia entro 5 turni.\n\n_+3:_ Quando la Duellante usa l'abilità di un'arma, ottiene _infinita accuratezza_ sul suo prossimo attacco in mischia entro 5 turni.
actors.hero.talent.precise_assault.meta_desc=_Se questo talento viene acquisito da un altro eroe_ aumenterà invece l'accuratezza in mischia del 10% a +1, 20% a +2, o 30% a +3.
actors.hero.talent.deadly_followup.title=seguito mortale
actors.hero.talent.deadly_followup.desc=_+1:_ Quando la Duellante colpisce un nemico con un'arma da lancio, gli infliggerà il _10% di danni corpo a corpo in più_ per 5 turni.\n\n_+2:_ Quando la Duellante colpisce un nemico con un'arma da lancio, gli infliggerà _20% di danno in mischia in più_ per 5 turni.\n\n_+3:_ Quando la Duellante colpisce un nemico con un'arma da lancio, gli infliggerà il _30% di danno in mischia in più_ per 5 turni.

actors.hero.talent.varied_charge.title=carica variata
actors.hero.talent.varied_charge.desc=_+1:_ La Campionessa recupera istantaneamente _0,17 cariche dell'arma_ quando usa due diverse abilità dell'arma, senza limiti di tempo.\n\n_+2:_ La Campionessa recupera istantaneamente _0,33 cariche dell'arma_ quando usa due diverse abilità dell'arma, senza limiti di tempo.\n\n_+3:_ La Campionessa recupera istantaneamente _0,5 cariche dell'arma_ quando usa due diverse abilità dell'arma, senza limiti di tempo.
actors.hero.talent.twin_upgrades.title=miglioramenti gemelli
actors.hero.talent.twin_upgrades.desc=_+1:_ Se una delle due armi equipaggiate dalla Campionessa ha un livello minore ed è _2 o più livelli inferiore_ rispetto all'altra arma, verrà incrementata al livello dell'altra arma.\n\n_+2:_ Se una delle due armi equipaggiate dalla Campionessa ha un livello minore ed è _1 o più livelli inferiore_ rispetto all'altra arma, verrà incrementata al livello dell'altra arma.\n\n_+3:_ Se una delle due armi equipaggiate dalla Campionessa ha un livello minore ed è _dello stesso livello o inferiore_ rispetto all'altra arma, verrà incrementata al livello dell'altra arma.
actors.hero.talent.combined_lethality.title=letalità combinata
actors.hero.talent.combined_lethality.desc=_+1:_ Se il Campione attacca con un'arma da mischia immediatamente dopo aver usato l'abilità di un'arma diversa, quell'attacco ucciderà qualsiasi nemico non boss rimasto con _sotto il 13% HP_.\n\n_+2:_ Se il Campione attacca con un'arma da mischia immediatamente dopo aver usato l'abilità di un'arma diversa, quell'attacco ucciderà qualsiasi nemico non boss rimasto con _sotto il 27% HP_.\n\n_+3:_ Se il Campione attacca con un'arma da mischia immediatamente dopo aver usato l'abilità di un'arma diversa, quell'attacco ucciderà qualsiasi nemico non boss rimasto con _sotto il 40% HP_.\n\nQuesto attacco può essere un normale attacco con arma da mischia o parte di un'abilità dell'arma.

actors.hero.talent.unencumbered_spirit.title=spirito libero
actors.hero.talent.unencumbered_spirit.desc=_+1:_ La Monaca ottiene il _50% di energia in più_ per ogni pezzo di equipaggiamento di _livello 3 o inferiore_ che sta utilizzando. \n\n_+2:_ La Monaca ottiene il _75% di energia in più_ per ogni pezzo di equipaggiamento di _livello 2 o inferiore_ che sta usando. Il beneficio del livello 3 non cambia. \n\n_+3:_ La Monaca ottiene il _100% di energia_ in più per ogni pezzo di equipaggiamento di _livello 1 o più basso_ che sta usando.  I benefici dei livelli 2 e 3 non cambiano. Inoltre riceve gratuitamente un'armatura di stoffa e dei guanti borchiati. \n\nNota che questo talento non fornisce alcun beneficio da disarmati o attaccando con un Anello di Forza.
actors.hero.talent.monastic_vigor.title=vigore monastico
actors.hero.talent.monastic_vigor.desc=_+1:_ Se la monaca ha il _100% d'energia_, le sue abilità sono potenziate.\n\n_+2:_ Se la monaca ha l'_80% o più d'energia_, le sue abilità sono potenziate.\n\n_+3:_ Se la monaca ha il _60% o più d'energia_, le sue abilità sono potenziate.\n\nQuando potenziata:\n- Turbinio applica gli incantamenti della tua arma\n- Concentrazione è istantanea\n- Scatto ottiene +4 distanza\n- Calcio del drago infligge +50% di danni e dà contraccolpo e stordimento a tutti i nemici adiacenti\n- Meditazione cura lentamente il 20% della salute mancante e conferisce l'80% di riduzione dei danni.
actors.hero.talent.combined_energy.title=energia combinata
actors.hero.talent.combined_energy.desc=_+1:_ Se il Monaco usa un'abilità dell'arma e un'abilità di _4+ energia_ entro 5 turni l'uno dall'altro, recupera 1 energia spesa.\n\n_+2:_ Se il Monaco usa un'abilità dell'arma e un'abilità di _3+ energia_ entro 5 turni l'uno dall'altro, recupera 1 energia spesa.\n\n_+3:_ Se il Monaco usa un'abilità arma e un'abilità _2+ energia_ entro 5 turni l'uno dall'altro, recupera 1 energia spesa.

actors.hero.talent.close_the_gap.title=colmare il divario
actors.hero.talent.close_the_gap.desc=_+1:_ La Duellante si sposta _fino a due caselle_ verso il suo bersaglio quando inizia un duello.\n\n_+2:_ La Duellante si sposta _fino a tre caselle_ verso il suo bersaglio quando inizia un duello.\n\n_+3:_ La Duellante si sposta _fino a quattro caselle_ verso il suo bersaglio quando inizia un duello.\n\n_+4:_ La Duellante si sposta _fino a cinque caselle_ verso il suo bersaglio quando inizia un duello.\n\nQuesto spostamento può passare attraverso ostacoli e nemici ma non attraverso terreni solidi come muri. Questo spostamento viene preso in considerazione per determinare se un nemico è nel raggio d'azione per essere sfidato.
actors.hero.talent.invigorating_victory.title=vittoria corroborante
actors.hero.talent.invigorating_victory.desc=_+1:_ Se la Duellante sconfigge il suo bersaglio prima della fine del duello, guarisce per _5 PS più il 30% del danno_ che ha subito durante il duello.\n\n_+2:_ Se la Duellante sconfigge il suo bersaglio prima della fine del duello, guarisce per _10 PS più il 50% del danno_ che ha subito durante il duello.\n\n_+3:_ Se la Duellante sconfigge il suo bersaglio prima della fine del duello, guarisce per _15 PS più il 65% del danno_ che ha subito durante il duello.\n\n_+4:_ Se la Duellante sconfigge il suo bersaglio prima della fine del duello, guarisce per _20 PS più il 75% del danno_ che ha subito durante il duello.
actors.hero.talent.elimination_match.title=partita ad eliminazione
actors.hero.talent.elimination_match.desc=_+1:_ Se la Duellante sfida di nuovo entro 3 turni dalla fine del duello, quella sfida ha un costo di carica _ridotto del 16%_.\n\n_+2:_ Se la Duellante sfida di nuovo entro 3 turni dalla fine del duello, quella sfida ha un costo di carica _ridotto del 30%_.\n\n_+3:_ Se la Duellante sfida di nuovo entro 3 turni dalla fine del duello, quella sfida ha un costo di carica _ridotto del 40%_.\n\n_+4:_ Se la Duellante sfida di nuovo entro 3 turni dalla fine del duello, quella sfida ha un costo di carica _ridotto del 50%_.

actors.hero.talent.elemental_reach.title=portata elementale
actors.hero.talent.elemental_reach.desc=_+1:_ La portata del colpo elementale è aumentata a _5 caselle_ da 4, e la sua ampiezza è aumentata a _75 gradi_ da 65.\n\n_+2:_ La portata del colpo elementale è aumentata a _6 caselle_ da 4, e la sua ampiezza è aumentata a _85 gradi_ da 65.\n\n_+3:_ La portata del colpo elementale è aumentata a _7 caselle_ da 4, e la sua ampiezza è aumentata a _95 gradi_ da 65.\n\n_+4:_ La portata del colpo elementale è aumentata a _8 caselle_ da 4, e la sua ampiezza è aumentata a _105 gradi_ da 65.
actors.hero.talent.striking_force.title=forza d'urto
actors.hero.talent.striking_force.desc=_+1:_ La potenza del colpo elementale è aumentata del _30%_.\n\n_+2:_ La potenza del colpo elementale è aumentata del _60%_.\n\n_+3:_ La potenza del colpo elementale è aumentata del _90%_.\n\n_+4:_ La potenza del colpo elementale è aumentata del _120%_.
actors.hero.talent.directed_power.title=potere diretto
actors.hero.talent.directed_power.desc=_+1:_ L'attacco diretto del colpo elementale ottiene _+30% potere di incantesimo_ per ogni nemico nel raggio d'azione del colpo elementale, incluso il bersaglio dell'attacco.\n\n_+2:_ L'attacco diretto del colpo elementale ottiene _+60% potere di incantesimo_ per ogni nemico nel raggio d'azione del colpo elementale, incluso il bersaglio dell'attacco.\n\n_+3:_ L'attacco diretto del colpo elementale ottiene _+90% potere di incantesimo_ per ogni nemico nel raggio d'azione del colpo elementale, incluso il bersaglio dell'attacco.\n\n_+4:_ L'attacco diretto del colpo elementale ottiene _+120% potere di incantesimo_ per ogni nemico nel raggio d'azione del colpo elementale, incluso il bersaglio dell'attacco.

actors.hero.talent.feigned_retreat.title=finta ritirata
actors.hero.talent.feigned_retreat.desc=_+1:_ Se un nemico attacca l'immagine riflessa della Duellante, lei ottiene _2 turni_ di fretta.\n\n_+2:_ Se un nemico attacca l'immagine riflessa della Duellante, lei ottiene _4 turni_ di fretta.\n\n_+3:_ Se un nemico attacca l'immagine riflessa della Duellante, lei ottiene  _6 turni_ di fretta.\n\n_+4:_ Se un nemico attacca l'immagine riflessa della Duellante, lei ottiene  _8 turni_ di fretta.
actors.hero.talent.expose_weakness.title=esporre debolezza
actors.hero.talent.expose_weakness.desc=_+1:_ I nemici che attaccano l'immagine riflessa della Duellante diventano deboli e vulnerabili per _2 turni_.\n\n_+2:_ I nemici che attaccano l'immagine riflessa della Duellante diventano deboli e vulnerabili per _4 turni_.\n\n_+3:_ I nemici che attaccano l'immagine riflessa della Duellante diventano deboli e vulnerabili per _6 turni_.\n\n_+4:_ I nemici che attaccano l'immagine riflessa della Duellante diventano deboli e vulnerabili per _8 turni_.
actors.hero.talent.counter_ability.title=contrattacco abilità
actors.hero.talent.counter_ability.desc=_+1:_ Se la Duellante usa un'abilità dell'arma entro 3 turni dall'attacco della sua immagine residua, recupererà immediatamente _0,38 cariche_.\n\n_+2:_ Se la Duellante usa l'abilità di un'arma entro 3 turni dall'attacco della sua immagine residua, recupererà immediatamente _0,77 cariche_.\n\n_+3:_ Se la Duellante usa l'abilità di un'arma entro 3 turni dall'attacco della sua immagine residua, recupererà immediatamente _1,13 cariche_.\n\n_+4:_ Se la Duellante usa l'abilità di un'arma entro 3 turni dall'attacco della sua immagine residua, recupererà immediatamente _1,5 cariche_.

#cleric
actors.hero.talent.satiated_spells.title=Incantesimi Finiti
actors.hero.talent.satiated_spells.desc=_+1_ Mangiare cibo fa si che il Chierico ottiene _3 punti scudo_ la prossima volta che lancia un incantesimo.\n\n_+2_ Mangiare cibo fa si che il Chierico ottiene _5 punti scudo_ la prossima volta che lancia un incantesimo.
actors.hero.talent.satiated_spells.meta_desc=_se questo talento viene ottenuto da un'eroe diverso_ garantirà invece lo scudo immediatamente, il quale comincerà a decadere normalmente dopo 10 turni.
actors.hero.talent.holy_intuition.title=santa intuizione
actors.hero.talent.holy_intuition.desc=_+1_ Il Chierico può lanciare _Intuizione Divina,_ un incantesimo che rivela se un oggetto è maledetto al costo di _3 cariche._\n\n_+2_ Il Chierico può lanciare _Intuizione Divina,_ un incantesimo che rivela se un oggetto è maledetto al costo di _2 cariche._
actors.hero.talent.holy_intuition.meta_desc=_Se questo talento viene ottenuto da un'altro eroe_ lascerà invece che l'eroe identifichi lo stato maledetto su un oggetto maledetto appena prima di equipaggiarlo, il 15% delle volte con +1, o il 25% delle volte con +2.
actors.hero.talent.searing_light.title=luce bruciante
actors.hero.talent.searing_light.desc=_+1:_ L'attacco fisico del Chierico sui nemici illuminati da _Luce Guida_ infligge _+3 danni._\n\n_+2:_ L'attacco fisico del Chierico sui nemici illuminati da _Luce Guida_ infligge _+5 danni._
actors.hero.talent.searing_light.meta_desc=_Se questo talento viene ottenuto da un altro eroe_ garantirà invece il suo danno bonus dopo che una bacchetta o un artefatto viene usato su un nemico, con 20 turni di ricarica.
actors.hero.talent.shield_of_light.title=Scudo di luce
actors.hero.talent.shield_of_light.desc=_+1:_ Il Chierico può lanciare _Scudo di Luce,_ un incantesimo che viene lanciato istantaneamente e garantisce _2-4 armatura_ contro un bersaglio per 5 turni al costo di 1 carica.\n\n_+2:_ Il Chierico può lanciare _Scudo di Luce,_ un incantesimo che viene lanciato istantaneamente e garantisce _3-6 armatura_ contro un bersaglio per 5 turni al costo di 1 carica.
actors.hero.talent.shield_of_light.meta_desc=_Se questo talento viene ottenuto da un altro eroe_ ridurrà invece il danno fisico subito dal tuo bersaglio di 1, il 33% delle volte a +1 o il 50% delle volte a +2.

actors.hero.talent.enlightening_meal.title=Pasto Illuminante
actors.hero.talent.enlightening_meal.desc=_+1:_ Mangiare cibo richiede 1 turno per il Chierico e concede _0.67 cariche_ sul suo tomo sacro.\n\n_+2:_ Mangiare cibo richiede 1 turno per il Chierico e concede _1 carica_ sul suo tomo sacro.
actors.hero.talent.enlightening_meal.meta_desc=_Se questo talento viene ottenuto da un altro eroe_ garantirà invece 2 turni di ricarica di bacchette e artefatti a +1, o 3 turni a +2. Non può essere usato per far sì che la Cornucopia si ricarichi da sola.
actors.hero.talent.recall_inscription.title=Richiama Inscrizione
actors.hero.talent.recall_inscription.refunded=Il tuo oggetto è stato rimborsato!
actors.hero.talent.recall_inscription.desc=_+1:_ Il Chierico può lanciare _Richiama Iscrizione,_ un incantesimo che gli permette di ripetere gli effetti dell'ultima pietra runica o pergamena usata negli ultimi _10 turni._ \n\n_+2:_ Il Chierico può lanciare _Richiama Iscrizione,_ un incantesimo che gli permette di ripetere gli effetti dell'ultima pietra runica o pergamena usata negli ultimi _300 turni._ \n\nRichiama Iscrizione non può essere utilizzato con pergamene del miglioramento. Le cariche di questo incantesimo variano in base al tipo di oggetto che è stato usato recentemente: 2 per una pietra runica, 3 per una pergamena, 4 per una pergamena esotica. Il costo in cariche è inoltre raddoppiato quando usato su una pergamena della trasmutazione, oppure su oggetti alchemici creati con trasmutazione o miglioramento.
actors.hero.talent.recall_inscription.meta_desc=_Se questo talento viene ottenuto da un altro eroe_ rimborserà ogni pergamena o pietra runica il 10% delle volte a +1 o il 15% delle volte a +2. Pergamene di Miglioramento sono esenti da questo effetto.
actors.hero.talent.sunray.title=Sprazzo
actors.hero.talent.sunray.desc=_+1:_ Il Chierico può lanciare _Sprazzo,_ un incantesimo che danneggia per _4-8 danni_ e acceca il bersaglio per _4 turni,_ al costo di 1 carica. \n\n_+2:_ Il Chierico può lanciare _Sprazzo,_ un incantesimo che danneggia per _6-12 danni_ e acceca il bersaglio per _6 turni,_ al costo di 1 carica. \n\nSprazzo può accecare ogni bersaglio solo una volta, ma se il bersaglio è già accecato da Sprazzo allora verrà invece paralizzato. Sprazzo farà sempre il massimo dei danni a nemici demoniaci e non morti.
actors.hero.talent.sunray.meta_desc=_Se questo talento viene ottenuto da un altro eroe_ farà invece in modo che bacchette e artefatti accechino i nemici per quattro turni, il 15% delle volte a +1 o il 25% delle volte a +2.
actors.hero.talent.divine_sense.title=Senso Divino
actors.hero.talent.divine_sense.desc=_+1:_ Il Chierico può lanciare _Senso Divino,_ un incantesimo che concede _8 caselle_ di Visione Mentale per 50 turni e può essere lanciato istantaneamente, al costo di 2 cariche.\n\n_+2:_ Il Chierico può lanciare _Senso Divino,_ un incantesimo che concede _12 caselle_ di Visione Mentale per 50 turni e può essere lanciato istantaneamente, al costo di 2 cariche.
actors.hero.talent.divine_sense.meta_desc=_Se questo talento viene ottenuto da un altro eroe_ garantirà invece visione mentale con un raggio di 3 caselle a +1 o 5 caselle a +2 per un breve momento dopo aver usato una bacchetta o artefatto.
actors.hero.talent.bless.title=Benedizione
actors.hero.talent.bless.desc=_+1:_ Il Chierico può lanciare _Benedizione,_ un incantesimo che conferisce _6 turni di benedizione e 10 di scudo_ quando lanciato su se stesso o _10 turni di benedizione e 10 di cura_ quando lanciato su un'altra creatura, al costo di 1 carica. \n\n_+2:_ Il Chierico può lanciare _Benedizione,_ un incantesimo che conferisce _10 turni di benedizione e 15 di scudo_ quando lanciato su se stesso o _15 turni di benedizione e 15 di cura_ quando lanciato su un'altra creatura, al costo di 1 carica. \n\nLa cura in eccesso di questo incantesimo è convertita in scudo.
actors.hero.talent.bless.meta_desc=_Se questo talento viene ottenuto da un altro eroe_ aumenterà invece la precisione dell'eroe e degli alleati del 3% a +1 o del 5% a +2.

actors.hero.talent.cleanse.title=Purifica
actors.hero.talent.cleanse.desc=_+1:_ Il Chierico può lanciare _Purifica,_ un incantesimo che _rimuove effetti negativi_ dal Chierico e alleati vicini, donandogli inoltre _10 punti di scudo,_ al costo di 2 cariche. \n\n_+2:_ Il Chierico può lanciare _Purifica,_ un incantesimo che _applica 3 turni di immunità dagli effetti negativi_ al Chierico e agli alleati vicini, donandogli inoltre _20 punti di scudo,_ al costo di 2 cariche. \n\n_+3:_ Il Chierico può lanciare _Purifica,_ un incantesimo che _applica 5 turni di immunità dagli effetti negativi_ al Chierico e agli alleati vicini, donandogli inoltre _30 punti di scudo,_ al costo di 2 cariche.
actors.hero.talent.cleanse.meta_desc=_Se questo talento viene ottenuto da un altro eroe_ rimuoverà invece effetti negativi dall'eroe dopo aver utilizzato una bacchetta o artefatto, il 10/20/30% delle volte a +1/+2/+3.
actors.hero.talent.light_reading.title=Lettura Veloce
actors.hero.talent.light_reading.desc=_+1:_ Il Chierico può usare il tomo sacro quando non è equipaggiato, ma si ricarica al _25% della velocità_ quando non equipaggiato. \n\n_+2:_ Il Chierico può usare il tomo sacro quando non è equipaggiato, ma si ricarica al _50% della velocità_ quando non equipaggiato. \n\n_+3:_ Il Chierico può usare il tomo sacro quando non è equipaggiato, ma si ricarica al _75% della velocità_ quando non equipaggiato.
actors.hero.talent.light_reading.meta_desc=_Se questo talento viene ottenuto da un altro eroe_ aumenterà invece la velocità di ricarica di tutte le bacchette di 7/13/20% a +1/+2/+3.

actors.hero.talent.holy_lance.title=Lancia Sacra
actors.hero.talent.holy_lance.desc=_+1:_ Il Prete può lanciare _Lancia Sacra,_ un incantesimo devastante che infligge _30-55 punti danno_ al costo di 4 cariche. \n\n_+2:_ Il Prete può lanciare _Lancia Sacra,_ un incantesimo devastante che infligge _45-83 punti danno_ al costo di 4 cariche. \n\n_+3:_ Il Prete può lanciare _Lancia Sacra,_ un incantesimo devastante che infligge _60-110 punti danno_ al costo di 4 cariche. \n\nLancia Sacra infliggerà sempre il danno massimo a nemici demoniaci e non morti. Questo incantesimo ha un tempo di recupero di 30 turni prima che possa essere lanciato nuovamente.
actors.hero.talent.hallowed_ground.title=Terra Consacrata
actors.hero.talent.hallowed_ground.desc=_+1:_ Il Prete può lanciare _Terra Consacrata,_ un incantesimo che consacra il terreno in _un'area 3x3_ per 20 turni, al costo di 2 cariche. \n\n_+2:_ Il Prete può lanciare _Terra Consacrata,_ un incantesimo che consacra il terreno in _un'area 5x5_ per 20 turni, al costo di 2 cariche. \n\n_+3:_ Il Prete può lanciare _Terra Consacrata,_ un incantesimo che consacra il terreno in _un'area 7x7_ per 20 turni, al costo di 2 cariche. \n\nQuando è lanciato, Terra Consacrata cura gli alleati per 15 PS, radica brevemente i nemici e fa crescere erba bassa. Dopodiché, cura lentamente gli alleati, paralizza i nemici, e fa sì che l'erba alta cresca casualmente. Terreno Consacrato dona scudo al Prete invece di guarigione ed è distrutto dal fuoco.
actors.hero.talent.mnemonic_prayer.title=Preghiera Mnemonica
actors.hero.talent.mnemonic_prayer.desc=_+1:_ Il Sacerdote può lanciare _Preghiera Mnemonica,_ un incantesimo che estende gli effetti positivi/negativi su un alleato/nemico per _3 turni_ al costo di 1 carica.\n\n_+2:_ Il Sacerdote può lanciare _Preghiera Mnemonica,_ un incantesimo che estende gli effetti positivi/negativi su un alleato/nemico per _4 turni_ al costo di 1 carica.\n\n_+3:_ Il Sacerdote può lanciare _Preghiera Mnemonica,_ un incantesimo che estende gli effetti positivi/negativi su un alleato/nemico per _5 turni_ al costo di 1 carica.\n\nPreghiera mnemonica non richiede tempo per essere lanciata. Preghiera Mnemonica può solo estendere uno specifico effetto positivo/negativo una sola volta, e non può estendere gli effetti dati dalle abilità dell'armatura.

actors.hero.talent.lay_on_hands.title=Tocco Taumaturgico
actors.hero.talent.lay_on_hands.desc=_+1:_ Il Paladino può lanciare _Tocco Taumaturgico,_ un incantesimo che guarisce istantaneamente un personaggio vicino per _15 PS,_ o dona al Paladino _15 punti scudo,_ al costo di 1 carica. \n\n_+2:_ Il Paladino può lanciare _Tocco Taumaturgico,_ un incantesimo che guarisce istantaneamente un personaggio vicino per _20 PS,_ o dona al Paladino _20 punti scudo,_ al costo di 1 carica. \n\n_+3:_ Il Paladino può lanciare _Tocco Taumaturgico,_ un incantesimo che guarisce istantaneamente un personaggio vicino per _25 PS,_ o dona al Paladino _25 punti scudo,_ al costo di 1 carica. \n\nGuarigione in eccesso fornita da questo incantesimo è convertita in scudo. Tocco Taumaturgico può essere lanciato più volte, ma non può applicare nello stesso momento una quantità di scudo superiore a tre lanci dell'incantesimo.
actors.hero.talent.aura_of_protection.title=aura di protezione
actors.hero.talent.aura_of_protection.desc=_+1:_ Il Paladino può lanciare _Aura di Protezione,_ un incantesimo che dona al Paladino e a tutti gli alleati entro due caselle di distanza _20% di resistenza ai danni_ e l'effetto del glifo dell'armatura del Paladino al _+50% della forza_ per 20 turni al costo di 2 cariche. \n\n_+2:_ Il Paladino può lanciare _Aura di Protezione,_ un incantesimo che dona al Paladino e a tutti gli alleati entro due caselle di distanza _30% di resistenza ai danni_ e l'effetto del glifo dell'armatura del Paladino al _+75% della forza_ per 20 turni al costo di 2 cariche. \n\n_+3:_ Il Paladino può lanciare _Aura di Protezione,_ un incantesimo che dona al Paladino e a tutti gli alleati entro due caselle di distanza _40% di resistenza ai danni_ e l'effetto del glifo dell'armatura del Paladino al _+100% della forza_ per 20 turni al costo di 2 cariche.
actors.hero.talent.wall_of_light.title=Barriera di luce
actors.hero.talent.wall_of_light.desc=_+1:_ Il Paladino può lanciare _Barriera di Luce,_ un incantesimo che crea un muro solido di _3 caselle di larghezza_ davanti al Paladino che spinge via i nemici e dura 20 turni, al costo di 3 cariche. \n\n_+2:_ Il Paladino può lanciare _Barriera di Luce,_ un incantesimo che crea un muro solido di _5 caselle di larghezza_ davanti al Paladino che spinge via i nemici e dura 20 turni, al costo di 3 cariche. \n\n_+3:_ Il Paladino può lanciare _Barriera di Luce,_ un incantesimo che crea un muro solido di _7 caselle di larghezza_ davanti al Paladino che spinge via i nemici e dura 20 turni, al costo di 3 cariche.

actors.hero.talent.divine_intervention.title=intervento divino
actors.hero.talent.divine_intervention.desc=_+1:_ Dopo essere entrato in Forma Ascendente, il Chierico può lanciare _Intervento Divino,_ che potenzia il Chierico e tutti gli alleati con _150 punti di scudo_ e allunga la Forma Ascendente di _3 turni._ \n\n_+2:_ Dopo essere entrato in Forma Ascendente, il Chierico può lanciare _Intervento Divino,_ che potenzia il Chierico e tutti gli alleati con _200 punti di scudo_ e allunga la Forma Ascendente di _4 turni._ \n\n_+3:_ Dopo essere entrato in Forma Ascendente, il Chierico può lanciare _Intervento Divino,_ che potenzia il Chierico e tutti gli alleati con _250 punti di scudo_ e allunga la Forma Ascendente di _5 turni._ \n\n_+4:_ Dopo essere entrato in Forma Ascendente, il Chierico può lanciare _Intervento Divino,_ che potenzia il Chierico e tutti gli alleati con _300 punti di scudo_ e allunga la Forma Ascendente di _6 turni._ \n\nIntervento Divino costa un'enorme 5 cariche del tomo e può essere lanciato solamente una volta nella stessa Forma Ascendente.
actors.hero.talent.judgement.title=giudizio
actors.hero.talent.judgement.desc=_+1:_ Mentre in Forma Ascendente, il Chierico può lanciare _Giudizio,_ che infligge _10-20 punti danno_ a tutti i nemici visibili. \n\n_+2:_ Mentre in Forma Ascendente, il Chierico può lanciare _Giudizio,_ che infligge _15-30 punti danno_ a tutti i nemici visibili. \n\n_+3:_ Mentre in Forma Ascendente, il Chierico può lanciare _Giudizio,_ che infligge _20-40 punti danno_ a tutti i nemici visibili. \n\n_+4:_ Mentre in Forma Ascendente, il Chierico può lanciare _Giudizio,_ che infligge _25-50 punti danno_ a tutti i nemici visibili. \n\nGiudizio costa 3 cariche del tomo. Giudizio infligge +33% dei fanni per ogni incantesimo lanciato dal Chierico dopo essere entrato in Forma Ascendente oppure dall'ultimo lancio di Giudizio.
actors.hero.talent.flash.title=flash
actors.hero.talent.flash.desc=_+1:_ Mentre in Forma Ascendente, il Chierico può lanciare _Flash_ per trasportarsi fino a _3 caselle_ di distanza. \n\n_+2:_ Mentre in Forma Ascendente, il Chierico può lanciare _Flash_ per trasportarsi fino a _4 caselle_ di distanza. \n\n_+3:_ Mentre in Forma Ascendente, il Chierico può lanciare _Flash_ per trasportarsi fino a _5 caselle_ di distanza. \n\n_+4:_ Mentre in Forma Ascendente, il Chierico può lanciare _Flash_ per trasportarsi fino a _6 caselle_ di distanza. \n\nFlash costa inizialmente 2 cariche del tomo, e poi 1 carica in più per ogni lancio dell'incantesimo nella stessa Forma Ascendente.

actors.hero.talent.body_form.title=forma corporea
actors.hero.talent.body_form.desc=Il Chierico può lanciare _Forma Corporea_, che infonde Trinità con il potere di un incantesimo o glifo identificato dal Cherico durante questa avventura, al costo di 2 cariche. \n\n_+1:_ Quando Trinità è usata, il Chierico ottiene l'effetto scelto per _20 turni._ \n\n_+2:_ Quando Trinità è usata, il Chierico ottiene l'effetto scelto per _27 turni._ \n\n_+3:_ Quando Trinità è usata, il Chierico ottiene l'effetto scelto per _33 turni._ \n\n_+4:_ Quando Trinità è usata, il Chierico ottiene l'effetto scelto per _40 turni._ \n\nTrinità può essere infusa con solo un effetto corporeo alla volta. il costo della carica dell'armatura di Trinità è tanto più alto quanto più raro e potente è il glifo scelto.
actors.hero.talent.mind_form.title=Forma della Mente
actors.hero.talent.mind_form.desc=Il Chierico può lanciare _Forma Mentale_, che infonde Trinità con il potere di una bacchetta o arma lanciabile che il Chierico ha usato in questa avventura, al costo di 3 cariche. \n\n_+1:_ Quando Trinità è usata, il Chierico usa l'attacco della bacchetta o arma scelta, come se fosse stata _+3._ \n\n_+2:_ Quando Trinità è usata, il Chierico usa l'attacco della bacchetta o arma scelta, come se fosse stata _+4._ \n\n_+3:_ Quando Trinità è usata, il Chierico usa l'attacco della bacchetta o arma scelta, come se fosse stata _+5._ \n\n_+4:_ Quando Trinità è usata, il Chierico usa l'attacco della bacchetta o arma scelta, come se fosse stata _+6._ \n\nTrinità può essere infusa con solo un effetto mentale alla volta.
actors.hero.talent.spirit_form.title=Forma Spiritica
actors.hero.talent.spirit_form.desc=Il Chierico può lanciare _Forma Spirituale_, che infonde Trinità con il potere di un anello o artefatto che il Chierico ha identificato in questa avventura (escluso il tomo sacro), al costo di 4 cariche. \n\n_+1:_ Quando Trinità è usata, il Chierico otterrà l'effetto di un anello a _+1_ per 20 turni, o attiverà l'effetto di un artefatto a _+4._ \n\n_+2:_ Quando Trinità è usata, il Chierico otterrà l'effetto di un anello a _+2_ per 20 turni, o attiverà l'effetto di un artefatto a _+6._ \n\n_+3:_ Quando Trinità è usata, il Chierico otterrà l'effetto di un anello a _+3_ per 20 turni, o attiverà l'effetto di un artefatto a _+8._ \n\n_+4:_ Quando Trinità è usata, il Chierico otterrà l'effetto di un anello a _+4_ per 20 turni, o attiverà l'effetto di un artefatto a _+10._ \n\nTrinità può essere infusa con solo un effetto spirituale alla volta. Gli artefatti hanno effetti e costi di cariche differenti quando attivati da Trinità.

actors.hero.talent.beaming_ray.title=raggio luminoso
actors.hero.talent.beaming_ray.desc=Il Chierico può lanciare _Raggio Luminoso_ da un alleato potenziato al costo di 1 carica. Questo raggio può attraversare pareti e trasportare l'alleato nella posizione scelta. Se in quella posizione è presente un nemico, l'alleato apparirà a fianco del nemico e lo attaccherà. Raggio Luminoso può anche trasportare alleati normalmente immobili, ma in tal caso ha metà della gittata. \n\n_+1:_ Raggio Luminoso ha una gittata massima di _4 caselle,_ e aumenta il bonus del Potere dei Molti a _+35% dei danni_ contro il nemico più vicino per 10 turni. \n\n_+2:_ Raggio Luminoso ha una gittata massima di _8 caselle,_ e aumenta il bonus del Potere dei Molti a _+40% dei danni_ contro il nemico più vicino per 10 turni. \n\n_+3:_ Raggio Luminoso ha una gittata massima di _12 caselle,_ e aumenta il bonus del Potere dei Molti a _+45% dei danni_ contro il nemico più vicino per 10 turni. \n\n_+4:_ Raggio Luminoso ha una gittata massima di _16 caselle,_ e aumenta il bonus del Potere dei Molti a _+50% dei danni_ contro il nemico più vicino per 10 turni.
actors.hero.talent.life_link.title=connessione vitale
actors.hero.talent.life_link.desc=Il Chierico può lanciare _Connessione Vitale_ tra se stesso e un alleato potenziato al costo di 2 cariche. Questo incantesimo fa in modo che il danno venga condiviso tra il Chierico e il suo alleato, e fa in modo che gli incantesimi benefici di livello 3 o più basso del Chierico vengano applicati a entrambi se l'uno o l'altro ne è soggetto. \n\n_+1:_ Connessione Vitale dura per _10 turni_ e aumenta il bonus del Potere dei Molti a _-35% dei danni subiti._ \n\n_+2:_ Connessione Vitale dura per _13 turni_ e aumenta il bonus del Potere dei Molti a _-40% dei danni subiti._ \n\n_+3:_ Connessione Vitale dura per _17 turni_ e aumenta il bonus del Potere dei Molti a _-45% dei danni subiti._ \n\n_+4:_ Connessione Vitale dura per _20 turni_ e aumenta il bonus del Potere dei Molti a _-50% dei danni subiti._
actors.hero.talent.stasis.title=Stasi
actors.hero.talent.stasis.desc=Il Chierico può lanciare _Stasi_ su un alleato potenziato al costo di 2 cariche. Stasi rimuove temporaneamente l'alleato dal dungeon e conserva la durata di tutti gli effetti positivi, incluso il Potere dei Molti. L'alleato riapparirà accanto a te quando l'effetto finisce. Stasi può essere rilanciato istantaneamente e senza costo per far terminate prima l'effetto. Stasi funziona con alleati immobili, ma non li può trasportare attraverso diversi piani del dungeon.\n\n_+1:_ Stasi ha una durata massima di _60 turni._\n\n_+2:_ Stasi ha una durata massima di _90 turni._\n\n_+3:_ Stasi ha una durata massima di _120 turni._\n\n_+4:_ Stasi ha una durata massima di _150 turni._\n\nInoltre, il Chierico può lanciare Raggio Luminoso mentre un alleato è in stasi per rievocarlo, oppure può lanciare Connessione Vitale per applicare preventivamente l'effetto. Nota che gli alleati non beneficiano da Connessione Vitale mentre sono in stasi.


#universal
actors.hero.talent.heroic_energy.title=energia eroica
actors.hero.talent.heroic_energy.rat_title=energia rattoica
actors.hero.talent.heroic_energy.desc=_+1:_ L'abilità dell'armatura dell'eroe costa il _12% di cariche in meno_.\n\n_+2:_ L'abilità dell'armatura dell'eroe costa il _23% di cariche in meno_.\n\n_+3:_ L'abilità dell'armatura dell'eroe costa il _32% di cariche in meno_.\n\n_+4:_ L'abilità dell'armatura dell'eroe costa il _40% di cariche in meno_.

actors.hero.talent.ratsistance.title=rattistenza
actors.hero.talent.ratsistance.desc=_+1:_ I nemici rattificati ostili infliggono _-10% di danno_.\n\n_+2:_ I nemici rattificati ostili infliggono _-19% di danno_.\n\n_+3:_ I nemici rattificati ostili infliggono _-27% di danno_.\n\n_+4:_ I nemici rattificati ostili infliggono _-35% di danno_.
actors.hero.talent.ratlomacy.title=rattomazia
actors.hero.talent.ratlomacy.desc=_+1:_ Usare la rattificazione su un nemico già rattificato lo rende amichevole e rende la trasformazione permanente.\n\n_+2:_ Usare la rattificazione su un nemico già rattificato lo rende amichevole, rende la trasformazione permanente e gli dona _2 turni_ di adrenalina.\n\n_+3_ Usare la rattificazione su un nemico già rattificato lo rende amichevole, rende la trasformazione permanente e gli dona _4 turni_ di adrenalina.\n\n_+4:_ Usare la rattificazione su un nemico già rattificato lo rende amichevole, rende la trasformazione permanente e gli dona _6 turni_ di adrenalina.
actors.hero.talent.ratforcements.title=ratforzamento
actors.hero.talent.ratforcements.desc=_+1:_ Usare rattificazione su te stesso _genera 1_ ratto marsupiale alleato accanto a te.\n\n_+2:_ Usare rattificazione su te stesso _genera 2_ ratti marsupiali alleati accanto a te.\n\n_+3:_ Usare rattificazione su te stesso _genera 3_ ratti marsupiali alleati accanto a te.\n\n_+4:_ Usare rattificazione su te stesso _genera 4_ ratti marsupiali alleati accanto a te.



###npcs
actors.mobs.npcs.blacksmith.name=fabbro troll
actors.mobs.npcs.blacksmith.intro_quest_warrior=Ehi umano! Sembri un duro.
actors.mobs.npcs.blacksmith.intro_quest_mage=Ehi umano! Sembri intelligente.
actors.mobs.npcs.blacksmith.intro_quest_rogue=Ehi umano! Sembri un tipo subdolo.
actors.mobs.npcs.blacksmith.intro_quest_huntress=Ehi umana! Sembri una veloce.
actors.mobs.npcs.blacksmith.intro_quest_duelist=Ehi umana! Sembri coraggiosa.
actors.mobs.npcs.blacksmith.intro_quest_cleric=Ehi umano! Sembri una persona importante.
actors.mobs.npcs.blacksmith.intro_quest_start=Vuoi essere utile, eh? Sì, ho qualcosa che potresti fare. Ho costruito questo laboratorio sopra una vecchia miniera, è proprio giù per quella scala. Prendi questo piccone ed estrai un po' di minerale d'oro scuro. 40 pezzi_ dovrebbero essere sufficienti. La roccia è bella e morbida, quindi _potrai scavare attraverso i muri con un po' di sforzo. _Cosa intendi con "come pagherò?" Sei avido...Ok, ok, posso fare qualche lavoro per te. Considerati fortunato, sono l'unico fabbro in circolazione.
actors.mobs.npcs.blacksmith.intro_quest_crystal=Attento però, la miniera è pericolosa per un piccolo umano come te. È stata abbandonata per un po' e un gruppo di cristalli ha iniziato a crescere. Sono lucenti, ma troppo fragili per valere qualcosa, e hanno alcune cose magiche che li proteggono. Sono piuttosto forti, quindi _fai attenzione a dove estrai_ o attirerai la loro attenzione.\n\nC'è anche un _cristallo gigante_ da qualche parte. È molto più duro, quindi preparati a combattere se inizi a romperlo. Scommetto che romperlo rallenterà la crescita dei cristalli, quindi pagherò un extra se puoi farlo.
actors.mobs.npcs.blacksmith.intro_quest_gnoll=Attento però, la miniera è pericolosa per un piccolo umano come te. Anche alcuni Gnoll vogliono l'oro e ora stanno distruggendo il posto. Sono esserii stupidi, quindi la loro attività mineraria ha causato ogni sorta di collassi e crolli. Dovrai scavare, quindi _cerca la roccia disturbata di recente._\n\nPenso che sia uno degli Gnoll a causare la maggior parte dei guai, probabilmente uno _sciamano geomante_ o qualcosa del genere. Pagherò un extra se riesci a trovarlo e ucciderlo, ma sono sicuro che reagirà.
actors.mobs.npcs.blacksmith.intro_quest_fungi=Attento però, la miniera è pericolosa per un piccolo umano come te. C'è una specie di mostro fungino che cresce laggiù. Ci sono sentinelle a forma di fungo che sono davvero letali se ti vedono, ma almeno non possono alzarsi e inseguirti. _Stai lontano dalla loro vista_ se vuoi restare in vita.\n\nPagherò un extra se riesci a eliminare il _fungo più grande_, ma ci vorrà un vero sforzo. È collegato a un gruppo di nodi di micelio nascosti nelle pareti. Dovrai romperne la maggior parte prima di poterlo davvero danneggiare.
actors.mobs.npcs.blacksmith.reminder=Hai finito di farmi perdere tempo? L'ingresso della miniera è laggiù.
actors.mobs.npcs.blacksmith.reminder_crystal=Portami il più oro possibile e cerca anche di rompere il grande cristallo.
actors.mobs.npcs.blacksmith.reminder_gnoll=Portami il più oro possibile e cerca anche di uccidere il geomante gnoll.
actors.mobs.npcs.blacksmith.reminder_fungi=Portami il più oro possibile e cerca anche di uccidere il fungo gigante.
actors.mobs.npcs.blacksmith.lost_pick=Mi stai prendendo in giro? Dov'è la mia piccozza?!
actors.mobs.npcs.blacksmith.quest_start_prompt=Sei pronto a scendere? Assicurati di avere dello spazio libero per l'oro.\n\n_Ti farò secndere laggiù una volta sola!_
actors.mobs.npcs.blacksmith.enter_yes=Sono Pronto
actors.mobs.npcs.blacksmith.enter_no=Non Ancora
actors.mobs.npcs.blacksmith.exit_warn_none=Hai già finito? Non hai quasi niente d'oro! Dovresti riuscire a ottenerne _40 pezzi._\n\n_Ricorda, non ti farò rientrare una volta salito._
actors.mobs.npcs.blacksmith.exit_warn_low=Hai già finito? Non sembra che tu abbia molto oro. Dovresti riuscire a ottenerne _40 pezzi._\n\n_Ricorda, non ti farò rientrare una volta salito._
actors.mobs.npcs.blacksmith.exit_warn_med=Ce l'hai fatta? Almeno hai un po' d'oro, ma ce n'è sicuramente di più nella miniera. Dovresti riuscire a ottenerne _40 pezzi._\n\n_Ricorda, non ti farò rientrare una volta salito._
actors.mobs.npcs.blacksmith.exit_warn_high=Ce l'hai fatta? Sembra che tu abbia una buona quantità di oro, ma mi servirebbe un po' di più. Dovresti riuscire a ottenerne _40 pezzi._\n\n_Ricorda, non ti farò rientrare una volta salito._
actors.mobs.npcs.blacksmith.exit_warn_full=Ce l'hai fatta? Hai un sacco di oro, ma assicurati di non aver dimenticato nessuno dei tuoi attrezzi.\n\n_Ricorda, non ti farò rientrare una volta salito._
actors.mobs.npcs.blacksmith.exit_warn_crystal=Anche quel cristallo gigante è ancora laggiù. Pagherò un extra se lo distruggi.
actors.mobs.npcs.blacksmith.exit_warn_gnoll=Anche quel geomante gnoll è ancora laggiù. Pagherò un extra se lo uccidi.
actors.mobs.npcs.blacksmith.exit_warn_fungi=Anche quel fungo gigante è ancora laggiù. Pagherò un extra se lo uccidi.
actors.mobs.npcs.blacksmith.exit_yes=Ho FInito
actors.mobs.npcs.blacksmith.exit_no=Non Ancora
actors.mobs.npcs.blacksmith.get_lost=Sono occupato. Vattene!
actors.mobs.npcs.blacksmith.entrance_blocked=La discesa è bloccata.
actors.mobs.npcs.blacksmith.cant_enter_old=Quell'area non è accessibile durante questa partita. Gioca a un nuovo gioco per provare la nuova missione!
actors.mobs.npcs.blacksmith.def_verb=bloccato
actors.mobs.npcs.blacksmith.desc=Questo fabbro troll somiglia a tutti i troll: è alto e magro e la sua pelle somiglia alla pietra sia nel colore che nella consistenza. Il fabbro troll sta armeggiando con strumenti sproporzionatamente piccoli.

actors.mobs.npcs.ghost.name=fantasma triste
actors.mobs.npcs.ghost.rat_1=Salve %s... Un tempo ero come te - forte e sicuro... Ma sono stato ucciso da una bestia schifosa... Non posso lasciare questo luogo... Non finché sarò vendicato... Uccidi il _ratto fetido,_ che ha preso la mia vita...\n\nPerseguita questo piano... Spargendo schifezza ovunque... _Sta' attento alla sua nuvola di fetore e al morso corrosivo, l'acido si dissolve nell'acqua..._
actors.mobs.npcs.ghost.rat_2=Ti prego... Aiutami... Uccidi l'abominio...\n\n_Combatti vicino all'acqua... Evita il fetore..._
actors.mobs.npcs.ghost.gnoll_1=Salve %s... Un tempo ero come te - forte e sicuro... Ma sono stato ucciso da una bestia infida... Non posso lasciare questo luogo... Non finché sarò vendicato... Uccidi lo _gnoll farabutto,_ che ha preso la mia vita...\n\nNon è come gli altri gnoll... Si nasconde e usa armi da lancio... _Sta' attento ai suoi dardi velenosi ed incendiari, non attaccare a distanza..._
actors.mobs.npcs.ghost.gnoll_2=Ti prego... Aiutami... Uccidi il farabutto...\n\n_Non farti colpire... Vagli vicino..._
actors.mobs.npcs.ghost.crab_1=Salve %s... Un tempo ero come te - forte e sicuro... Ma sono stato ucciso da un'antica creatura... Non posso lasciare questo luogo... Non finché sarò vendicato... Uccidi il _grande granchio,_ che ha preso la mia vita...\n\nÈ vecchio in maniera innaturale... Con una sola enorme chela ed un guscio robusto... _Attento alla sua chela, devi prenderlo di sorpresa o la userà per parare..._
actors.mobs.npcs.ghost.crab_2=Ti prego... Aiutami... Uccidi il Crostaceo...\n\n_Para ogni colpo... Quando ti vede arrivare..._
actors.mobs.npcs.ghost.find_me=Grazie... Vieni a cercarmi...
actors.mobs.npcs.ghost.desc=Il fantasma è appena visibile. Assomiglia ad un'informe macchia di luce tenue con una faccia dolente.

actors.mobs.npcs.imp.name=diavoletto ardito
actors.mobs.npcs.imp.intro=Sei un avventuriero? Adoro gli avventurieri! Puoi sempre fare affidamento su di loro se c'è bisogno di uccidere qualcosa, vero? Ovviamente per qualcosa in cambio ;)
actors.mobs.npcs.imp.golems_1=Nel mio caso sono i _golem_ che devono essere uccisi. Vedi, ho intenzione di avviare una piccola attività qui, ma quegli stupidi golem fanno male agli affari! È molto difficile negoziare con i pezzi di granito erranti, dannati! Quindi, per favore, uccidi... diciamo _4 di loro_ e la ricompensa sarà tua.
actors.mobs.npcs.imp.monks_1=Nel mio caso sono i _monaci_ che devono essere uccisi. Vedi, ho intenzione di avviare una piccola attività qui, ma quei pazzi non comprano nulla da soli e spaventeranno gli altri clienti. Quindi, per favore, uccidili... diciamo _5 di loro_ e la ricompensa sarà tua.
actors.mobs.npcs.imp.golems_2=Come sta andando il tuo safari di golem? Ma non dimenticare di prendere quei gettoni.
actors.mobs.npcs.imp.monks_2=Oh, sei ancora vivo! Sapevo che il tuo kung-fu sarebbe stato più forte ;) Non dimenticare di prendere quei gettoni.
actors.mobs.npcs.imp.cya=Ci vediamo, %s!
actors.mobs.npcs.imp.hey=Psst, %s!
actors.mobs.npcs.imp.desc=I diavoletti sono demoni minori. Non sono noti né per la loro forza né per il talento con la magia, ma sono piuttosto furbi e socievoli. Molti diavoletti preferiscono vivere fra i non-demoni.

actors.mobs.npcs.impshopkeeper.name=diavoletto ardito
actors.mobs.npcs.impshopkeeper.greetings=Salve, %s!
actors.mobs.npcs.impshopkeeper.greetings_ascent=Cosa hai fatto %s? Compra in fretta, devo andarmene via di qui!
actors.mobs.npcs.impshopkeeper.thief=Pensavo di potermi fidare di te!
actors.mobs.npcs.impshopkeeper.buyback=L'imp ti restituisce felicemente il tuo oggetto
actors.mobs.npcs.impshopkeeper.desc=L'imp ha messo su un piccolo negozio al confine delle sale interne. È bello vedere una faccia amica, ma i suoi prezzi non sono certamente amichevoli.

actors.mobs.npcs.mirrorimage.name=immagine speculare
actors.mobs.npcs.mirrorimage.desc=Questa illusione ha una stretta somiglianza con te, e sembra persino brandire la tua arma corrente e la tua armatura.\n\nLe immagini speculari cercheranno e attaccheranno i nemici usando la loro arma imitata, che si comporta come la tua, ma infligge meno danni. Iniziano quasi invisibili, ma devono assumere una forma più facilmente visibile per poter attaccare.\n\nMentre il loro potere offensivo può essere potente, le immagini speculari non hanno durata, e svaniranno nel momento in cui subiranno danni.
actors.mobs.npcs.mirrorimage.discover_hint=Puoi trovare questo personaggio con una pergamena specifica.

actors.mobs.npcs.npc.discover_hint=Puoi trovare questo personaggio in una regione specifica del dungeon.

actors.mobs.npcs.prismaticimage.name=immagine prismatica
actors.mobs.npcs.prismaticimage.desc=Questa scintillante illusione presenta una stretta somiglianza con te, pare perfino brandire la tua arma e armatura attuali.\n\nLe immagini prismatiche andranno alla ricerca e attrarranno l'attenzione dei nemici, usando la loro difesa potenziata per proteggerti. Anche se non posseggono lo stesso potere offensivo delle immagini speculari possiedono una resistenza incrementata, ricevendo inoltre beneficio dalla tua armatura.\n\nQuando ridotte a 0 hp, le immagini prismatiche svaniranno nel corso di alcuni turni e potranno comunque essere curate durante questo lasso di tempo. Quando non vi sono nemici presenti le immagini prismatiche svaniranno, ricongiungendosi con il loro padrone.
actors.mobs.npcs.prismaticimage.discover_hint=Puoi trovare questo personaggio con una pergamena specifica.

actors.mobs.npcs.ratking.name=re dei topi
actors.mobs.npcs.ratking.not_sleeping=Non sto dormendo!
actors.mobs.npcs.ratking.what_is_it=Che succede? Non ho tempo per queste sciocchezze. Il mio regno non si governa da solo!
actors.mobs.npcs.ratking.confused=Cos... Dove sono? Il mio regno mi vuole!
actors.mobs.npcs.ratking.crown_clothes=Mettiti dei vestiti! Non sei nelle condizioni di parlare con dei reali!
actors.mobs.npcs.ratking.crown_desc=Oooh, quella corona è per me !? Sembra molto più brillante della mia, quindi accetto gentilmente!\n\nIn effetti, penso di poterti offrire qualcosa come ricompensa per questa corona. Un potere tremendo che si addice a un eroe come te! Ti piacerebbe?
actors.mobs.npcs.ratking.crown_yes=Ovviamente!
actors.mobs.npcs.ratking.crown_info=Dimmi prima di più.
actors.mobs.npcs.ratking.crown_no=Preferirei di no...
actors.mobs.npcs.ratking.crown_thankyou=Hehehe, grazie! Ora vai e rendi orgoglioso il tuo re!
actors.mobs.npcs.ratking.crown_fine=Bene! Comunque non è come lo volevo io...
actors.mobs.npcs.ratking.crown_after=Ti piace la tua nuova armatura? Nessun rimborso!
actors.mobs.npcs.ratking.desc_crown=Questo ratto è leggermente più grande di un normale ratto marsupiale. Sulla testa porta la corona del re nano.
actors.mobs.npcs.ratking.desc_birthday=Questo ratto è leggermente più grande di un normale ratto marsupiale. Indossa un minuscolo cappellino verde da festa invece della solita corona. Buon compleanno Re Topo!
actors.mobs.npcs.ratking.desc_winter=Questo topo è un po' più grande di un normale ratto marsupiale. Indossa un piccolo cappellino da festa al posto della sua solita corona. Buone Feste!
actors.mobs.npcs.ratking.desc=Questo topo è un po' più grande di un normale topo marsupiale e indossa una piccola corona sulla testa.
actors.mobs.npcs.ratking.discover_hint=Puoi trovare questo personaggio al termine di una specifica regione del dungeon.

actors.mobs.npcs.sheep.name=pecora
actors.mobs.npcs.sheep.baa!=Bee!
actors.mobs.npcs.sheep.baa?=Bee?
actors.mobs.npcs.sheep.baa.=Bee.
actors.mobs.npcs.sheep.baa...=Bee...
actors.mobs.npcs.sheep.def_verb=bloccato
actors.mobs.npcs.sheep.desc=Questa è una pecora magica. Cos'ha di magico? Non puoi ucciderla, Starà qui finché non svanirà magicamente, masticando senza sosta con lo sguardo vacuo.
actors.mobs.npcs.sheep.discover_hint=Puoi trovare questo personaggio con un oggetto o una trappola specifica.

actors.mobs.npcs.shopkeeper.name=negoziante
actors.mobs.npcs.shopkeeper.thief=Ladro, Ladro!
actors.mobs.npcs.shopkeeper.warn=Smettila! Non ti avvertirò più.
actors.mobs.npcs.shopkeeper.flee=Il negoziante fugge!
actors.mobs.npcs.shopkeeper.sell=Vendi un oggetto
actors.mobs.npcs.shopkeeper.talk=Parla
actors.mobs.npcs.shopkeeper.buyback=Il commerciante ti restituisce riluttante l'oggetto
actors.mobs.npcs.shopkeeper.talk_prison_intro=Ho tutto quello di cui hai bisogno per un'avventura di successo!
actors.mobs.npcs.shopkeeper.talk_prison_warrior=Quello è un sigillo interessante, di solito sono interi. Sei un eroe in disgrazia o simile? Beh qualunque cosa tu abbia fatto non sono affari miei, le tue monete vanno comunque bene.
actors.mobs.npcs.shopkeeper.talk_prison_mage=Hehe, credo di aver visto un poster ricercato con il tuo nome sopra in giro per la città. Stai fuggendo, non è vero? Oh sei innocente dici? Certo, certo... Non agitarti, ho cose migliori da fare che segnalarti, ma per caso vuoi comprare qualcosa per esserne sicuro?
actors.mobs.npcs.shopkeeper.talk_prison_rogue=Sei venuto dalla gilda dei ladri per liberare l'area? No, solo per comprare? Beh uccidi qualche mostro intanto che sei qui. Non aspettarti uno sconto, pago una buona protezione da voi e mi stai a malapena tenendo al sicuro quaggiù.
actors.mobs.npcs.shopkeeper.talk_prison_huntress=Sembri spaesata. Gli stretti corridoi dei sotterranei non sono spaziosi come le grandi sale o le foreste che circondano la città, vero? Hehe, oh non far caso alle mie farneticazioni, perché non compri qualcosa?
actors.mobs.npcs.shopkeeper.talk_prison_duelist=Guarda te se non è l'eroe itinerante! Se stai cercando di salvare un'altra città allora buona fortuna, i pericoli qui sono molto peggio delle insignificanti gang di banditi. Sono sicuro che farai meglio di chiunque altro, cerca solo di non morire fuori dal mio negozio.
actors.mobs.npcs.shopkeeper.talk_prison_cleric=Buonsalve Sua Altezza, o è Sua Santità adesso? Hehe, in ogni caso questo non è posto per lei, molti sarebbero sconvolti se finisse morta. Certamente ha delle monete, quindi perché non compra qualcosa per prevenirla?
actors.mobs.npcs.shopkeeper.talk_caves=Spendi soldi, vivi più a lungo.\n\nOh e salutami quel fabbro Troll per me se lo vedi. Ricorda a quel testone che mi deve ancora dei soldi per quel martello che gli ho venduto la settimana scorsa!
actors.mobs.npcs.shopkeeper.talk_city=I miei beni ti terranno al sicuro laggiù.\n\n...E non bighellonare se non ti dispiace. Ci ho messo un sacco per convincere i locali a lasciarmi solo, non voglio che mi attiri problemi!
actors.mobs.npcs.shopkeeper.talk_halls=Hey, ho dei prezzi speciali per i cacciatori di demoni!\n\nOh e fai attenzione laggiù! Ai demoni là sotto non interessa quanto sei coraggioso. Non puoi tornare su e spendere altri soldi se sei morto! :)\n\nSe i demoni sono come me, dici? Hehe, non proprio. Io sono solo un piccolo essere, non proprio un combattente, e sono riuscito a mantenere la mia mente intatta. I demoni di sotto sono molto più forti e sono stati schiavizzati da... beh... stai attendo laggiù.
actors.mobs.npcs.shopkeeper.talk_ascent=Non so cosa stai pianificando di fare con quell'amuleto ma non voglio averne parte. Compra qualcosa e levati di torno, dobbiamo entrambi lasciare questo posto!
actors.mobs.npcs.shopkeeper.desc=Questo tizio robusto sarebbe più adatto a un distretto commerciale in qualche grande città che a un sotterraneo. I suoi prezzi spiegano come mai preferisce fare affari qui.

actors.mobs.npcs.wandmaker.name=vecchio fabbricante di bacchette
actors.mobs.npcs.wandmaker.intro_warrior=Oh, ciao! Che piacevole sorpresa incontrare un guerriero del nord in un posto così deprimente! Devi aver viaggiato abbastanza lontano per arrivare qui. Se cerchi l'avventura, potrei avere un compito per te.
actors.mobs.npcs.wandmaker.intro_rogue=Oh per gli dei, mi hai spaventato! In questo luogo non ho incontrato un bandito che sia ancora sano di mente, quindi devi venire dalla superficie! Se ti va di aiutare uno straniero, potrei avere un compito per te.
actors.mobs.npcs.wandmaker.intro_mage=Oh, salve %s! Ho sentito che c'è stato un putiferio riguardo te e l'istituto dei maghi? Oh, come non detto, in ogni caso non mi sono mai piaciuti quei parrucconi. Se sei disponibile potrei avere un compito per te.
actors.mobs.npcs.wandmaker.intro_huntress=Oh, salve signora! Un viso amichevole è una piacevole sorpresa quaggiù, non trova? In effetti giurerei di aver già visto il tuo viso prima, ma non riesco a ricordare... Oh come non detto, se sei qui per l'avventura, potrei avere un compito per te.
actors.mobs.npcs.wandmaker.intro_duelist=Oh, ciao signorina! Che piacevole sorpresa incontrare un eroe in un posto così deprimente! Se vuoi aiutare un vecchio, potrei avere un compito per te.
actors.mobs.npcs.wandmaker.intro_cleric=Oh, salve Sua Altezza! Che bella sorpresa incontrarla in un posto così deprimente! Non vorrei mica imporre, ma potrei avere un compito per lei.
actors.mobs.npcs.wandmaker.intro_1=\n\nSono venuto qui per trovare un raro ingrediente per una bacchetta, ma mi sono perso e il mio scudo magico si sta indebolendo. Presto dovrò lasciare questo luogo, ma non vorrei andarmene senza aver recuperato quello per cui sono venuto.
actors.mobs.npcs.wandmaker.intro_dust=Sto cercando della _polvere di cadavere._ È un tipo particolare di farina d'ossa maledette che solitamente si trova in posti come questo. Dovrebbe esserci una stanza barricata qui da qualche parte, sono certo che della polvere verrà fuori lì. Devi fare attenzione comunque, la maledizione della polvere è piuttosto potente, _torna qui da me il più velocemente possibile_ e la purificherò per te.
actors.mobs.npcs.wandmaker.intro_ember=Sto cercando delle _braci fresche_ da un elementale del fuoco neonato. Gli elementali di solito spuntano fuori quando un rituale di evocazione non è mantenuto sotto controllo, quindi basta trovare delle candele e il luogo del rituale e sono certo che riuscirai a richiamarne uno. Dovresti _evitare di intrappolarti_ mentre lo combatti, oppure potresti _tenere una sorta di oggetto congelante a portata di mano._ Gli Elementali appena nati sono piuttosto potenti e caotici, ma non sopportano il freddo.
actors.mobs.npcs.wandmaker.intro_berry=Il vecchio guardiano di questa prigione aveva una _pianta di baccamarcia_ e sono alla ricerca dei suoi semi. La pianta probabilmente è allo stato selvatico adesso, quindi recuperare un seme potrebbe essere difficile. Il suo giardino dovrebbe essere da qualche parte qui intorno. Cerca di _stare lontano dalle frustate dei suoi viticci_ se vuoi restare intero. Usare il fuoco potrebbe essere allettante ma per favore non farlo, uccideresti la pianta e distruggeresti i suoi semi.
actors.mobs.npcs.wandmaker.intro_2=\n\nSe puoi prenderlo per me, sarò felice di pagarti con una delle bacchette da me finemente costruite. Ne ho portate due con me, così potrai prendere quella che preferisci.
actors.mobs.npcs.wandmaker.reminder_dust=Hai trovato la polvere di cadavere, %s? Cerca delle barricate.
actors.mobs.npcs.wandmaker.reminder_ember=Hai trovato quelle braci, %s? Devi trovare quattro candele e il luogo del rituale.
actors.mobs.npcs.wandmaker.reminder_berry=Hai trovato il seme di Baccamarcia, %s? Cerca una stanza piena di vegetazione.
actors.mobs.npcs.wandmaker.def_verb=bloccato
actors.mobs.npcs.wandmaker.desc=Questo vecchio ma arzillo gentiluomo ha un'espressione leggermente confusa. È protetto da uno scudo magico.



###mobs
actors.mobs.acidic.name=scorpione acido
actors.mobs.acidic.desc=Questi grossi demoni a guisa di aracnide evitano il combattimento ravvicinato, preferendo ad esso lo sparo a distanza di punte seghettate paralizzanti. Questo qui pare sgocciolare melma corrosiva.

actors.mobs.albino.name=ratto albino
actors.mobs.albino.desc=Questa è una razza rara di ratto marsupiale, con pelliccia di un bianco puro e denti seghettati.
actors.mobs.albino.discover_hint=Puoi trovare raramente questo personaggio in una regione specifica del dungeon.

actors.mobs.armoredstatue.name=statua corazzata
actors.mobs.armoredstatue.desc=Potresti pensare che sia solo un'altra delle statue inanimate di questo dungeon, ma i suoi brillanti occhi rossi la tradiscono.\n\nPare sia in ottime condizioni grazie all'armatura che indossa, potrebbe dimostrarsi molto dura da sconfiggere.
actors.mobs.armoredstatue.desc_arm_wep=Sebbene la statua stessa sia fatta di pietra, _%1$s_ e _%2$s_ che brandisce sembrano reali.

actors.mobs.bandit.name=bandito pazzo
actors.mobs.bandit.desc=Un ladro d'élite, distinto dalla sua opulente veste porpora. Nonostante la loro maggiore abilità, hanno perso la testa come gli altri ladri normali. \n\nOltre a rubare da te, banditi pazzi ti accecheranno, paralizzeranno e avveleneranno brevemente! Tuttavia, è molto probabile che stiano portando più bottino di un ladro normale.

actors.mobs.bat.name=pipistrello vampiro
actors.mobs.bat.desc=Questi rapidi e tenaci abitanti delle caverne sono molto più pericolosi di quanto non sembri. Ripristinano la loro salute con ogni attacco a segno, il che permette loro di sconfiggere avversari molto più grandi.

actors.mobs.bee.name=ape dorata
actors.mobs.bee.desc_honey=Nonostante le loro piccole dimensioni, le api d'oro tendono a proteggere ferocemente la loro casa. Questa qui è stata resa docile e pare volerti seguire.
actors.mobs.bee.desc=Nonostante le loro piccole dimensioni, le api d'oro tendono a proteggere la loro casa ferocemente. Questa qui è proprio furiosa, meglio mantenere le distanze.
actors.mobs.bee.discover_hint=Puoi trovare questo personaggio con un oggetto specifico.

actors.mobs.brute.name=gnoll brutale
actors.mobs.brute.enraged=inferocito
actors.mobs.brute.def_verb=bloccato
actors.mobs.brute.desc=I bruti sono tra i più grossi, forti e resistenti di tutti gli gnoll. Quando vengono feriti seriamente vanno in berserk, acquisendo uno scudo temporaneo e un aumento nei danni considerevole.
actors.mobs.brute$bruterage.name=furia del bruto
actors.mobs.brute$bruterage.desc=Questo bruto sta morendo, ma vuole portarti con sé!\n\nIl bruto morirà quando il suo scudo si esaurirà: accade col passare del tempo o se viene danneggiato. Nel frattempo infliggerà un enorme quantitativo di danni, quindi stai attento!\n\nScudo rimanente: %d.

actors.mobs.causticslime.name=slime caustico
actors.mobs.causticslime.desc=Questo slime pare essere contaminato con magia oscura emanata dal profondo. Ha perso il suo usuale colore verde e sgocciola melma caustica.
actors.mobs.causticslime.discover_hint=Puoi trovare raramente questo personaggio in una regione specifica del dungeon.

actors.mobs.crab.name=granchio delle fogne
actors.mobs.crab.desc=Questi grossi granchi sono in cima alla catena alimentare delle fogne. Sono estremamente veloci e il loro duro carapace può resistere ai colpi più forti.

actors.mobs.crystalguardian.name=guardiano di cristallo
actors.mobs.crystalguardian.def_verb=bloccato
actors.mobs.crystalguardian.desc=Questi grandi guardiani cristallini sembrano quasi delle statue, se non fosse per i loro occhi luminosi. Il cristallo indurito di cui sono fatti li rende lenti ma molto resistenti, quindi _è meglio lasciarli dormire nel loro nido di cristallo il più a lungo possibile._\n\nA causa delle loro dimensioni, i guardiani di cristallo si muovono molto di più lentamente negli spazi ristretti. Sono anche così resistenti che è impossibile ucciderli del tutto. Possono essere abbattuti e temporaneamente disabilitati, ma dopo un po' si rialzeranno.
actors.mobs.crystalguardian.discover_hint=Puoi trovare questo nemico durante una missione specifica.

actors.mobs.crystalmimic.name=imitatore di cristallo
actors.mobs.crystalmimic.ate=L'imitatore divora il tuo %s!
actors.mobs.crystalmimic.escaped=L'imitatore di cristallo è fuggito!
actors.mobs.crystalmimic.desc=Gli imitatori sono creature magiche che possono assumere qualunque forma desiderata. Nei dungeon scelgono quasi sempre la forma di un forziere, al fine di adescare ignari avventurieri.\n\nGli imitatori di cristallo sono più ardui dei loro cugini comuni, preferiscono rubare bottini e nel contempo evitare i conflitti. Tenteranno di scappare via una volta scoperti, inoltre possiedono la capacità di riposizionare i nemici quando attaccano.

actors.mobs.crystalspire.name=guglia di cristallo
actors.mobs.crystalspire.warning=Il cristallo vibra quando lo colpisci. Continuare così attirerà sicuramente l'attenzione su di te...
actors.mobs.crystalspire.alert=La vibrazione cresce e rimbomba per tutta la grotta!
actors.mobs.crystalspire.desc=Questa gigantesca guglia di cristallo ultra duro è probabilmente la fonte di tutte le strane creature cristalline presenti in questa grotta. Le tue armi normali sono inefficaci contro di esso, quindi dovrai usare il piccone se vuoi distruggerlo.\n\n_Assicurati di essere preparato prima di iniziare a romperlo._ È probabile che un cristallo così grande richieda un po' di tempo per essere minato, e probabilmente non potrai farlo indisturbato. Anche la guglia stessa potrebbe avere dei mezzi per difendersi. _Forse gli attacchi della guglia potrebbero essere usati contro i suoi servitori._
actors.mobs.crystalspire.discover_hint=Puoi trovare questo nemico durante una missione specifica.

actors.mobs.crystalwisp.name=spirito di cristallo
actors.mobs.crystalwisp.beam_kill=Il raggio di luce ti ha ucciso...
actors.mobs.crystalwisp.desc=Un piccolo pezzo fluttuante di cristallo indurito che produce un bagliore luminoso. Sebbene non siano particolarmente forti, gli spiriti di cristallo ti spareranno un raggio di luce dannoso se hanno una linea di tiro.\n\nGli spiriti sono abbastanza piccoli da muoversi facilmente attraverso i vari affioramenti di cristalli, ma non sono in grado di spararvi attraverso.
actors.mobs.crystalwisp.discover_hint=Puoi trovare questo nemico durante una missione specifica.

actors.mobs.demonspawner.name=generatore di demoni
actors.mobs.demonspawner.on_death=L'energia demoniaca sembra calare alla morte del generatore.
actors.mobs.demonspawner.desc=Questo contorcente amalgama di carni naniche è in grado di creare demoni squartatori utilizzando i cadaveri dei nani morti in questo luogo. Evidentemente i demoni non si fanno problemi a usare ogni risorsa disponibile contro i loro nemici.\n\nSebbene visivamente terrificanti, i generatori di demoni non hanno modo di muoversi o di difendersi direttamente. La loro considerevole massa li rende tuttavia difficili da uccidere rapidamente, inoltre genereranno demoni squartatori molto più in fretta quando sono sotto attacco.\n\n_I generatori di demoni paiono connessi a una qualche sorgente centrale di potere demoniaco. Ucciderli potrebbe indebolirla._

actors.mobs.dm100.name=DM-100
actors.mobs.dm100.zap_kill=Il dardo fulminante ti ha ucciso...
actors.mobs.dm100.desc=Il DM-100 è un modello precedente della 'macchina da difesa' nanica, pensata per proteggere i nani minatori nelle caverne sottostanti. Le loro scosse elettriche tuttavia si sono rivelate troppo deboli e perciò furono donati alla città umana sovrastante. Sono rimasti inutilizzati per anni ed eventualmente sono finiti nella prigione, dove il direttore inizialmente li riteneva troppo crudeli da usare, tuttavia in seguito divennero necessari all'aumentare dell'insubordinatezza dei prigionieri.

actors.mobs.dm200.name=DM-200
actors.mobs.dm200.vent=Il DM-200 emette un getto di gas di scarico!
actors.mobs.dm200.desc=Il DM-200 è la seconda generazione di 'macchine da difesa' naniche, pensate per proteggere i nani minatori nelle caverne sottostanti. Sono molto più grandi e robusti dei loro predecessori e attaccano con devastanti pugni idraulici.\n\nLa loro taglia maggiorata rappresenta anche la loro debolezza primaria, dato che sono incapaci di passare nei tunnel stretti e nelle porte di accesso del dungeon. I nani furono in grado di compensare la mancanza di mobilità dei DM-200 con l'abilità di convogliare i fumi di scarico verso i nemici distanti o fuori portata.

actors.mobs.dm201.name=DM-201
actors.mobs.dm201.vent=DM-201 lancia una granata corrosiva!
actors.mobs.dm201.desc=Il nani sperimentarono brevemente con le carenze di mobilità dei DM-200 e crearono alcuni modelli di DM completamente stazionari. Il DM-201 è un DM-200 modificato che agisce come una torretta automatica senza alcuna capacità di movimento. In cambio della mancanza di mobilità, i DM-201 possiedono molta più resistenza e potere d'attacco.\n\nDato che i DM-201 non posseggono un motore con cui emettere gas di scarico, i nani li hanno dotati di granate corrosive! I DM-201 sono tuttavia accorti nell'uso di tali granate e le lanceranno solamente quando attaccati a distanza.

actors.mobs.dm300.name=DM-300
actors.mobs.dm300.notice=RILEVATO PERSONALE NON AUTORIZZATO!
actors.mobs.dm300.shield=DM-300 assorbe energia dai cavi esposti e se ne fa scudo!
actors.mobs.dm300.charging=RICEVUTO DANNO! ATTIVAZIONE TRALICCIO ELETTRICO!
actors.mobs.dm300.charging_hint=DM-300 è invulnerabile quando riceve energia da un traliccio!
actors.mobs.dm300.supercharged=DISTRUGGERE! DISTRUGGERE! DISTRUGGERE!
actors.mobs.dm300.charge_lost=TRALICCIO DANNEGGIATO, COMMUTAZIONE A RISORSE LOCALI!
actors.mobs.dm300.pylons_destroyed=ALLARME, RILEVATA INSTABILITÀ NELLA LINEA ELETTRICA!
actors.mobs.dm300.rankings_desc=Schiacciato da DM-300
actors.mobs.dm300.def_verb=bloccato
actors.mobs.dm300.defeated=DANNO CRITICO! TENTATIVO D'ARRES-
actors.mobs.dm300.desc=DM-300 è la più grande e potente 'macchina da difesa' che i nani abbiano mai creato. Tale grandiosa macchina è così difficile da costruire che i nani ne hanno realizzate solo alcune, poste a guardia delle entrate delle loro metropoli sotterranee.\n\nÈ equipaggiato con scarichi emettenti tossici gas di scarico e un potente trapano a percussione, in grado sia di attaccare che di distruggere il suolo. DM-300 può inoltre collegarsi alla linea elettrica, aumentando ulteriormente il suo potere.
actors.mobs.dm300.desc_supercharged=DM-300 è attualmente a piena carica elettrica. In questo stato DM-300 non può venire danneggiato e si muoverà al doppio della velocità! Inoltre, il suo trapano gira abbastanza veloce da _attraversare la roccia solida,_ anche se si sposterà molto più lentamente in questo caso.\n\nAttaccare DM-300 direttamente è inutile quando è a piena carica, ma _qualcosa in quest'area deve provvedere a questa energia,_ distruggerla potrebbe indebolirlo.

actors.mobs.dwarfking.name=Re dei Nani
actors.mobs.dwarfking.notice=Come osi! Non hai idea con cosa ti stai immischiando!
actors.mobs.dwarfking.lifelink_1=Ho bisogno della tua essenza, schiavo!
actors.mobs.dwarfking.lifelink_2=Sanguina per me, schiavo!
actors.mobs.dwarfking.teleport_1=Occupati di loro, schiavo!
actors.mobs.dwarfking.teleport_2=Tienili impegnati, schiavo!
actors.mobs.dwarfking.wave_1=Basta così! Sorgete, miei schiavi!
actors.mobs.dwarfking.wave_2=Di più! Sanguinate per il vostro Re!
actors.mobs.dwarfking.wave_3=Inutile! UCCIDETELI ORA!
actors.mobs.dwarfking.enraged=Non puoi uccidermi %s, IO. SONO. IMMORTALE!
actors.mobs.dwarfking.losing=No! Non puoi farlo... non hai idea di cosa si annidi laggiù...
actors.mobs.dwarfking.defeated=Ci hai... Condannati tutti...
actors.mobs.dwarfking.rankings_desc=Caduto Innanzi al Re dei Nani
actors.mobs.dwarfking.desc=Molti anni fa uno dei più potenti maghi della corte dei nani ha scoperto segreti che gli dettero un potere tremendo sulla vita e la morte. Presto egli mise il suo potere in uso, soggiogando e corrompendo i suoi pari, il suo re e, alla fine, ogni cittadino nanesco. Ora è il regnante di una legione di soggetti non-morti.\n\nIl Re dei Nani è un avversario aggressivo, cercherà di accerchiare e soggiogare i suoi nemici con la sua orda di servi non-morti.
actors.mobs.dwarfking$dkghoul.rankings_desc=Caduto Innanzi al Re dei Nani
actors.mobs.dwarfking$dkmonk.rankings_desc=Caduto Innanzi al Re dei Nani
actors.mobs.dwarfking$dkwarlock.rankings_desc=Caduto Innanzi al Re dei Nani
actors.mobs.dwarfking$dkgolem.rankings_desc=Caduto Innanzi al Re dei Nani

actors.mobs.ebonymimic.name=imitatore d'ebano
actors.mobs.ebonymimic.reveal=C'era un imitatore qui!
actors.mobs.ebonymimic.hidden_name=contorno sospetto
actors.mobs.ebonymimic.hidden_desc=Sembra esserci qualcosa qui, ma è quasi completamente trasparente.
actors.mobs.ebonymimic.desc=Gli imitatori sono creature magiche che possono assumere qualunque forma desiderata. Nei dungeon scelgono quasi sempre la forma di un forziere, al fine di adescare ignari avventurieri.\n\nGli imitatori d'ebano sono imitatori più forti con l'abilità di rendersi quasi completamente trasparenti. Si nascondo su cose con cui un avventuriero potrebbe interagire, ma contengono comunque del bottino. Non sono più resistenti di un normale mimico quando scoperti, ma il loro attacco a sorpresa è devastante.
actors.mobs.ebonymimic.discover_hint=Puoi trovare questo nemico con un gingillo specifico.

actors.mobs.elemental$fireelemental.name=elementale del fuoco
actors.mobs.elemental$fireelemental.desc=Gli elementali sono creature del caos che vengono creati perlopiù quando la potente magia occulta non viene propriamente controllata. Gli elementali hanno un'intelligenza minima e sono di solito associati con un determinato tipo di magia.\n\nGli elementali del fuoco rappresentano una tipologia comune e infliggono danni con la loro ardente magia. Manderanno in fiamme i loro bersagli con attacchi corpo a corpo e potranno inoltre sparare dardi infuocati, occasionalmente.
actors.mobs.elemental$newbornfireelemental.name=elementale del fuoco neonato
actors.mobs.elemental$newbornfireelemental.charging=L'elementale si sta caricando!
actors.mobs.elemental$newbornfireelemental.desc=Gli elementali sono creature del caos che vengono creati perlopiù quando la potente magia occulta non viene propriamente controllata. Gli elementali hanno un'intelligenza minima e sono di solito associati con un determinato tipo di magia.\n\nQuesto elementale del fuoco è stato appena evocato, ma è ancora piuttosto pericoloso!
actors.mobs.elemental$newbornfireelemental.desc_boss=A causa della natura caotica della sua evocazione, questo elementale può diffondere il fuoco solo con esplosioni imprecise dopo aver caricato per un turno.
actors.mobs.elemental$newbornfireelemental.desc_ally=Poiché questo elementale è stato evocato da un incantesimo, ha un po' più di controllo sulla sua fiamma. Non è in grado di effettuare attacchi a distanza, ma incendia i nemici che attacca in mischia.
actors.mobs.elemental$newbornfireelemental.discover_hint=Puoi trovare questo nemico durante una missione specifica.
actors.mobs.elemental$frostelemental.name=elementale del gelo
actors.mobs.elemental$frostelemental.desc=Gli elementali sono creature del caos che vengono creati perlopiù quando la potente magia occulta non viene propriamente controllata. Gli elementali hanno un'intelligenza minima e sono di solito associati con un determinato tipo di magia.\n\nGli elementali del gelo rappresentano una tipologia comune e indeboliscono i nemici con magia raffreddante. Raffredderanno il loro bersaglio con attacchi corpo a corpo e occasionalmente a distanza. La loro magia è molto più efficace nell'acqua.
actors.mobs.elemental$shockelemental.name=elementale della scossa
actors.mobs.elemental$shockelemental.desc=Gli elementali sono creature del caos che vengono creati perlopiù quando la potente magia occulta non viene propriamente controllata. Gli elementali hanno un'intelligenza minima e sono di solito associati con un determinato tipo di magia.\n\nGli elementali della scossa rappresentano una tipologia poco comune e distruggono i loro nemici con l'elettricità ed i flash luminosi. A distanza ravvicinata useranno l'elettricità sui nemici vicini, infliggendo danni aggiuntivi al loro bersaglio principale se si trova nell'acqua. Occasionalmente concentreranno un fascio di luce sui loro bersagli, accecandoli temporaneamente.
actors.mobs.elemental$chaoselemental.name=elementale del caos
actors.mobs.elemental$chaoselemental.desc=Gli elementali sono creature del caos che vengono creati perlopiù quando la potente magia occulta non viene propriamente controllata. Gli elementali hanno un'intelligenza minima e sono di solito associati con un determinato tipo di magia.\n\nGli elementali del caos sono rare e pericolose creature che non sono stabilizzate su un particolare tipo di elemento. Scateneranno un'imprevedibile e selvaggia magia durante l'attacco.

actors.mobs.eye.name=occhio maligno
actors.mobs.eye.deathgaze_kill=Lo sguardo mortale ti ha ucciso...
actors.mobs.eye.desc=Gli Occhi Maligni sono sfere fluttuanti di energia demoniaca confinata. Sebbene siano in grado di combattere corpo a corpo, la loro vera forza deriva dalla loro magia.\n\nDopo aver accumulato energia per un breve periodo un Occhio Maligno scatenerà un devastante raggio di energia chiamato lo _sguardo mortale._ Qualunque cosa compresa nella linea visiva dell'Occhio Maligno riceverà un danno enorme, gli avventurieri saggi correranno al riparo.

actors.mobs.fetidrat.name=ratto fetido
actors.mobs.fetidrat.desc=C'è chiaramente qualcosa di sbagliato in questo ratto. Il suo pelo nero unto e la sua pelle in decomposizione sono decisamente una novità rispetto ai ratti sani visti finora. I suoi occhi verde pallido lo fanno apparire particolarmente minaccioso. \n\nIl ratto si muove avvolto da una nube dal fetore tremendo, travolgente a distanza ravvicinata. \n\nUna bava nera che corrode il terreno cola dalla bocca del ratto, ma sembra dissolversi a contatto con l'acqua.
actors.mobs.fetidrat.discover_hint=Puoi trovare questo nemico durante una missione specifica.

actors.mobs.fungalcore.name=nucleo fungino
actors.mobs.fungalcore.desc=Questo gigantesco fungo deve essere la fonte di tutta l'attività fungina in questa grotta.

actors.mobs.fungalsentry.name=sentinella fungina
actors.mobs.fungalsentry.desc=Questo fungo particolarmente alto funge da punto di difesa per la ampia rete fungina che vive in questa grotta.\n\nÈ immobile, ma spara precisi colpi di veleno a tutto ciò che si trova nel suo campo visivo. Sebbene l'impatto di queste esplosioni sia piuttosto debole, _possono accumulare quantità mortali di veleno molto rapidamente._ Sebbene possano essere uccise, probabilmente è meglio evitarle.

actors.mobs.fungalspinner.name=filatore di funghi
actors.mobs.fungalspinner.desc=Sembra che questo spinner delle caverne sia controllato da un fungo parassita. Il fungo ha anche cambiato le sue abilità, sostituendo la sua tela e i sacchi di veleno con una crescita fungina.\n\nLo spinner fungino ti sputerà addosso la vita vegetale invece delle ragnatele, diffondendo la vegetazione fungina e potenzialmente radicandoti. Sebbene non possa avvelenare, lo spinner fungino otterrà una sostanziale resistenza ai danni se è adiacente a qualsiasi fungo.

actors.mobs.ghoul.name=ghoul nanesco
actors.mobs.ghoul.desc=All'inizio del collasso della società nanesca, quando l'attuale re dei nani si impadronì del potere assoluto, coloro troppo deboli o che gli resistettero non furono trattati bene. Al crescere delle capacità magiche del Re, egli piegò quei nani al suo volere e li rese la fanteria del suo esercito.\n\nI ghoul non sono particolarmente forti da soli, ma viaggiano sempre in gruppo e sono molto più duri da uccidere quando sono tanti. _Quando un ghoul viene sconfitto, risorgerà dopo qualche turno, purché un altro ghoul sia vicino._

actors.mobs.gnoll.name=gnoll esploratore
actors.mobs.gnoll.desc=Gli Gnoll sono degli uomini-iena. Dimorano nelle fogne e nei labirinti, avventurandosi in superficie di tanto in tanto. \nGli gnoll esploratori sono membri tipici del loro branco, tuttavia non sono forti come i bruti ne' intelligenti come gli sciamani.

actors.mobs.gnollexile.name=esule gnoll
actors.mobs.gnollexile.desc=Questo gnoll dal pelo grigio ha un grande marchio sulla sua spalla, identificandolo come un esule. Gli gnoll sono tipicamente esiliati dalla loro società per aver ignorato ordini o leggi. Gli esuli devono essere forti e scaltri per sopravvivere, questo sembra essere in grado di usare la lancia che ha in mano.
actors.mobs.gnollexile.desc_passive=_Lo gnoll esule non si muove per attaccare._ Non sembra aggressivo come gli altri gnoll, e probabilmente non pensa che combatterti ne valga la pena. Potresti lasciarlo andare, ma ha uno zaino che potrebbe essere pieno di oggetti utili...
actors.mobs.gnollexile.desc_aggro=_Lo gnoll esule ti osserva con rabbia._ Sembra che qualcosa lo abbia convinto a combattere dopotutto. Attento alla sua lancia!
actors.mobs.gnollexile.seen_passive=Lo gnoll armato di lancia ti osserva con cautela, ma non si muove per attaccare.
actors.mobs.gnollexile.seen_aggro=Lo gnoll armato di lancia si muove per attaccare!

actors.mobs.gnollgeomancer.name=geomante gnoll
actors.mobs.gnollgeomancer.warning=Il geomante comincia ad agitarsi. Assicurati di essere pronto prima di continuare!
actors.mobs.gnollgeomancer.alert=Il geomante si risveglia! L'intera grotta sembra spostarsi mentre salta via ridendo come un pazzo!
actors.mobs.gnollgeomancer.rock_kill=Il masso volante ti ha ucciso...
actors.mobs.gnollgeomancer.rockfall_kill=Le rocce cadenti ti hanno ucciso...
actors.mobs.gnollgeomancer.desc=Questo gnoll anziano straordinariamente alto deve essere la fonte delle varie magie di movimento della terra da queste parti e l'organizzatore di tutte le attività degli gnoll. A differenza dei genieri gnoll della zona, il geomante è piuttosto abile con la sua magia e non può essere danneggiato dal lancio o dalla caduta di rocce. Tuttavia non ha alcun modo di combattere corpo a corpo.
actors.mobs.gnollgeomancer.desc_armor=Il geomante è attualmente racchiuso in uno strato di armatura di roccia. _Dovrai avvicinarti e romperlo con il piccone prima di poter danneggiare il geomante._
actors.mobs.gnollgeomancer.desc_armor_sapper=_Un geniere gnoll nelle vicinanze tiene in mano un dispositivo che potenzia l'armatura rocciosa del geomante. Non potrai più danneggiarlo per ora!_
actors.mobs.gnollgeomancer.desc_sleeping=Questo gnoll sciamano impressionantemente alto è circondato da uno strato di roccia e sembra quasi una statua. Guardando da vicino, puoi vedere la roccia muoversi magicamente in sincronia con il respiro del gnoll anziano. Non può essere danneggiato mentre è racchiuso in questa roccia e sembra proprio dormire come sasso.\n\nProbabilmente puoi rompere gli strati di roccia con il tuo piccone, ma assicurati di essere pronto per una lotta quando lo fai. Il geomante deve essere la fonte della varia magia di movimento della terra qui intorno e l'organizzatore di tutta l'attività degli gnoll. Potrebbe essere una buona idea sconfiggere gli gnoll sparsi qui intorno prima di combatterlo.
actors.mobs.gnollgeomancer.discover_hint=Puoi trovare questo nemico durante una missione specifica.

actors.mobs.gnollguard.name=gnoll guardia
actors.mobs.gnollguard.def_verb=bloccato
actors.mobs.gnollguard.spear_warn=Il gnoll infligge un colpo violento con la punta della sua lancia!
actors.mobs.gnollguard.desc=Un grande gnoll dall'aspetto robusto che impugna una lancia e uno scudo, ma senza elmo. Queste guardie sono probabilmente bruti in addestramento, costretti ad aiutare a proteggere la miniera dagli animali selvaggi che si avvicinano.\n\nLa guardia gnoll è abbastanza forte da impugnare la lancia con una mano, ma non riesce ad usarla molto bene. Avrà bisogno di uno spazio abbastanza aperto per attaccare a distanza e ti causerà notevolmente meno danni se ti avvicini.
actors.mobs.gnollguard.desc_armor=Un vicino gnoll geniere sta tenendo un dispositivo che sta conferendo a questa guardia un'armatura terrestre, riducendo pesantemente il danno che subisce.
actors.mobs.gnollguard.discover_hint=Puoi trovare questo nemico durante una missione specifica.

actors.mobs.gnollsapper.name=gnoll geniere
actors.mobs.gnollsapper.desc=Un piccolo e debole, ma intelligente gnoll con pelo pallido e una sacca piena di vari gadget. Probabilmente sono qui per aiutare nella ricerca e nell'estrazione dell'oro oscuro, e hanno una guardia vicina per protezione. Sono capaci di combattere, ma i loro attacchi sono miseramente deboli, non più forti di uno scout gnoll.\n\nInvece di combattere direttamente, i genieri preferiscono usare i vari gadget che hanno per far sì che l'ambiente roccioso attacchi per loro. Non conoscono la magia di movimento della terra, però, e quindi è molto probabile che usino i loro gadget in modo sconsiderato. Ci dovrebbero essere molte possibilità di usare i loro attacchi contro di loro, o contro la loro guardia.
actors.mobs.gnollsapper.discover_hint=Puoi trovare questo nemico durante una missione specifica.

actors.mobs.gnolltrickster.name=gnoll imbroglione
actors.mobs.gnolltrickster.desc=Una creatura dall'aspetto strano, anche rispetto agli standard gnoll. È ingobbito in avanti con un ghigno perfido, quasi cullando la sacca che porta appesa alle spalle. I suoi grandi occhi trasmettono un mix di paura ed eccitazione. \n\nC'è una vasta collezione di dardi di scarsa qualità nella sua sacca, che paiono essere intinti con svariate sostanze nocive.
actors.mobs.gnolltrickster.discover_hint=Puoi trovare questo nemico durante una missione specifica.

actors.mobs.goldenmimic.name=imitatore dorato
actors.mobs.goldenmimic.desc=Gli imitatori sono creature magiche che possono assumere qualunque forma desiderata. Nei dungeon scelgono quasi sempre la forma di un forziere, al fine di adescare ignari avventurieri.\n\nGli imitatori dorati sono imitatori avanzati che tentano di attrarre gli avventurieri più forti. Hanno il migliore bottino, ma sono anche molto più forti degli imitatori comuni.

actors.mobs.golem.name=golem
actors.mobs.golem.def_verb=bloccato
actors.mobs.golem.desc=I golem rappresentano il tentativo di correggere i difetti precedenti dell'ingegneria nanesca tramite l'utilizzo della recentemente scoperta magia. Sono molto più compatti ed efficienti comparati al DM-300, ma altrettanto mortali.\n\nSebbene i golem siano comunque troppo grandi per entrare nei passaggi, in compenso i nani hanno donato loro nuove abilità magiche . I golem possono teletrasportarsi da una stanza all'altra e riservare lo stesso trattamento ai nemici fuori portata.

actors.mobs.goo.name=Goo
actors.mobs.goo.notice=GLURP-GLURP!
actors.mobs.goo.defeated=glurp... glurp...
actors.mobs.goo.!!!=!!!
actors.mobs.goo.pumpup=Goo si sta caricando!
actors.mobs.goo.enraged=inferocito
actors.mobs.goo.gluuurp=GLUUUURP!
actors.mobs.goo.rankings_desc=Assorbito da Goo
actors.mobs.goo.desc=Poco si sa di Goo. È possibile che non sia nemmeno una creatura, ma piuttosto un agglomerato di sostanze nauseabonde provenienti dalle fogne che in qualche modo ha ottenuto un'intelligenza elementare. In ogni caso, è magia nera quella che ha permesso a Goo di esistere.\n\nLa sua natura gelatinosa gli ha concesso di assorbire un sacco di energia oscura, avverti un brivido solo a stargli vicino. Se Goo è in grado di attaccare con tale energia non vivrai a lungo.

actors.mobs.greatcrab.name=grande granchio
actors.mobs.greatcrab.noticed=Il granchio blocca con la sua enorme chela.
actors.mobs.greatcrab.def_verb=bloccato
actors.mobs.greatcrab.desc=Questo granchio è gigantesco, anche rispetto agli altri granchi di fogna. Il suo guscio blu è ricoperto di spaccature e cirripedi, a dimostrazione della sua veneranda età. Si trascina  lentamente, reggendo a malapena la sua imponente chela. \n\nNonostante il granchio abbia una sola chela, la sua dimensione è tale da compensare la mancanza dell'altra. Il granchio tiene la chela in fronte a sé ogni qual volta scorge una minaccia, facendosi scudo dietro ad un impenetrabile muro di carapace. Tuttavia, non può bloccare attacchi che non vede arrivare o attacchi da molteplici nemici allo stesso tempo.
actors.mobs.greatcrab.discover_hint=Puoi trovare questo nemico durante una missione specifica.

actors.mobs.guard.name=guardia della prigione
actors.mobs.guard.scorpion=Vieni qui!
actors.mobs.guard.def_verb=bloccato
actors.mobs.guard.desc=Una volta custodi della prigione, queste guardie sono da tempo diventate nient'altro che detenuti. Si trascinano come zombi, vagando stupidamente per i corridoi alla ricerca di qualcosa di fuori posto, come te! \n\nPortano catene attorno al fianco, forse utilizzate per trascinare i nemici a distanza ravvicinata.

actors.mobs.hermitcrab.name=paguro
actors.mobs.hermitcrab.def_verb=bloccato
actors.mobs.hermitcrab.desc=Per qualche motivo, questo granchio delle fogne hq deciso di indossare la parte rotta superiore di un barile sulla sua testa! Il peso aggiunto lo ha rallentato a velocità normale, ma gli ha anche dato molta più difesa. Tuttavia, sembra che si possa sentire qualcosa rimbalzare nel barile...

actors.mobs.mimic.name=imitatore
actors.mobs.mimic.reveal=Quel forziere è un imitatore!
actors.mobs.mimic.hidden_hint=Qualcosa non va in questo forziere... Avvicinarsi ad esso e provare ad aprirlo potrebbe rivelarsi una cattiva idea.
actors.mobs.mimic.desc=Gli imitatori sono creature magiche che possono assumere qualunque forma desiderata. Nei dungeon scelgono quasi sempre la forma di un forziere, al fine di adescare ignari avventurieri.\n\nGli imitatori hanno un morso pericoloso, ma spesso contengono più tesori di un forziere comune.
actors.mobs.mimic.discover_hint=Puoi trovare questo nemico dappertutto nel dungeon.

actors.mobs.necromancer.name=necromante
actors.mobs.necromancer.desc=Questi apprendisti maghi oscuri si sono riversati nelle prigioni, poiché è il luogo perfetto per praticare la loro arte malvagia.\n\nI necromanti evocheranno e soggiogheranno gli scheletri affinché combattano per loro. Uccidere il necromante ucciderà anche gli scheletri evocati.
actors.mobs.necromancer$necroskeleton.name=scheletro del necromante
actors.mobs.necromancer$necroskeleton.desc=Questo scheletro è stato evocato da un necromante. Si comporta esattamente come uno scheletro normale e morirà quando il necromante che l'ha evocato viene ucciso.

actors.mobs.mob.died=Odi qualcosa morire in lontananza.
actors.mobs.mob.rage=#$%^
actors.mobs.mob.rankings_desc=Ucciso da: %s
actors.mobs.mob.discover_hint=Puoi trovare questo nemico in una regione specifica del dungeon.

actors.mobs.monk.name=nano monaco
actors.mobs.monk.def_verb=bloccato
actors.mobs.monk.parried=parato
actors.mobs.monk.desc=Questi monaci sono degli esaltati che hanno dedicato la loro vita a proteggere il loro re con l'ausilio del proprio vigore fisico. Così grande è la loro devozione che hanno ceduto le loro menti al re, così da vagare erraticamente come zombi per la città dei nani.\n\nI monaci contano esclusivamente sull'arte del combattimento corpo a corpo e sono in grado di usare i loro nudi pugni sia per l'offesa che per la difesa. Quando si concentrano i monaci pareranno il prossimo attacco fisico rivolto a loro, anche se si tratta di un colpo garantito altrimenti. I monaci accrescono la loro concentrazione più rapidamente quando sono in movimento, più lentamente in combattimento diretto.
actors.mobs.monk$focus.name=concentrato
actors.mobs.monk$focus.desc=Questo monaco è perfettamente puntato sul proprio bersaglio, e sembra anticipare le sue mosse prima che le faccia.\n\nFinché è concentrato, il successivo attacco verso questo personaggio è un colpo mancato assicurato, indipendentemente dalle circostanze. Parare questo attacco consumerà la concentrazione del monaco, che avrà bisogno di accumularne ancora per parare un altro attacco. I Monaci accumulano concentrazione più velocemente finché sono in movimento.

actors.mobs.phantompiranha.name=piranha fantasma
actors.mobs.phantompiranha.teleport_away=Il piranha fantasma si teletrasporta via...
actors.mobs.phantompiranha.desc=I piranha fantasma sono una razza rara di piranha con abilità magiche e un'inquietante corpo traslucido. Sono capaci di teletraspostarsi quando vengono attaccati, per scappare o per avvicinarsi velocemente al nemico!\n\nSono fastidiosi da combattere, ma la loro carne è pregiata per le sue proprietà magiche.

actors.mobs.piranha.name=piranha gigante
actors.mobs.piranha.desc=Questi pesci carnivori vengono specificatamente allevati per proteggere aree allagate. Il loro morso è letale, quindi è meglio evitare un confronto diretto.
actors.mobs.piranha.discover_hint=Puoi trovare questo nemico dappertutto nel dungeon.

actors.mobs.pylon.name=traliccio
actors.mobs.pylon.desc_inactive=Un traliccio, posto a regolare l'elettricità che alimenta i macchinari di quest'area.\n\nIl traliccio è attualmente inattivo e immune ai danni.
actors.mobs.pylon.desc_active=Un traliccio, posto a regolare l'elettricità che alimenta i macchinari di quest'area. Il traliccio è attualmente sovraccarico di energia elettrica, dev'essere questo che sovralimenta DM-300!\n\nIn questo stato i tralicci sono vulnerabili ma emettono archi elettrici alle celle vicine in un pattern a senso orario. Data la loro costituzione di metallo pesante, i tralicci sono resistenti a grandi quantità di danni.

actors.mobs.rat.name=ratto marsupiale
actors.mobs.rat.desc=I ratti marsupiali sono aggressivi ma deboli abitanti delle fogne. Hanno un morso fastidioso, ma sono una minaccia mortale solo in gran numero.

actors.mobs.ripperdemon.name=demone squartatore
actors.mobs.ripperdemon.leap=Il demone squartatore si prepara a un balzo!
actors.mobs.ripperdemon.desc=Queste orripilanti creature sono la conseguenza dei tanti cadaveri presenti in questa regione e messi in uso dalle forze demoniache. Gli squartatori sono macabre e macilenti creature che somigliano a nani, ma con corpi straziati e lunghi ed affilati artigli d'ossa.\n\nI demoni squartatori non sono particolarmente resistenti, ma sono veloci e pericolosi. Sono in grado di saltare lunghe distanze per ghermire i loro bersagli prima di straziarli con i loro artigli.

actors.mobs.rotheart.name=cuore putrido
actors.mobs.rotheart.desc=Un frutto di Baccamarcia è decisamente unico. Invece di maturare e fornire nutrimento, il frutto cresce, si indurisce e ingloba il seme. Fornisce protezione agli organi interni che crescono dentro al frutto. Ci si riferisce a questo globo gigante come al cuore di una pianta di Baccamarcia adulta.
actors.mobs.rotheart.discover_hint=Puoi trovare questo nemico durante una missione specifica.

actors.mobs.rotlasher.name=rovo putrido
actors.mobs.rotlasher.desc=Il rovo putrido è parte delle radici di una pianta di baccamarcia matura e costituisce il suo principale mezzo di difesa. I rovi sono cechi e piantati nel terreno, ma assalgono violentemente minaccia nelle vicinanze dopo aver impiegato un momento per rilevarla. Quando non c'è nessuna preda in zona rimangono immobili, tentando di mimetizzarsi con la vegetazione circostante.
actors.mobs.rotlasher.discover_hint=Puoi trovare questo nemico durante una missione specifica.

actors.mobs.scorpio.name=scorpione
actors.mobs.scorpio.desc=Questi enormi demoni aracniformi evitano il combattimento corpo a corpo, preferendo sparare i loro aculei seghettati paralizzanti da lontano.

actors.mobs.senior.name=monaco esperto
actors.mobs.senior.desc=Questi monaci sono fanatici che hanno dedicato la loro vita a proteggere il loro Re, con l'ausilio del loro vigore fisico. Così grande è la loro devozione da donare le loro menti al Re, vagando così come zombi per la città dei nani.\n\nQuesto monaco è un maestro dell'arte del corpo a corpo ed è in grado di acquisire concentrazione in movimento molto più rapidamente dei monaci normali. Quando si concentrano, i monaci pareranno il prossimo attacco fisico rivolto a loro, anche se si tratta di un colpo garantito altrimenti. I monaci accrescono la loro concentrazione più rapidamente quando sono in movimento e più lentamente in combattimento diretto.

actors.mobs.shaman.name=gnoll sciamano
actors.mobs.shaman.bolt_kill=Il dardo magico ti ha ucciso...
actors.mobs.shaman.desc=Gli sciamani sono gnoll intelligenti che compensano la loro scarsa prestanza con l'uso di magie marziali. Appartengono a una posizione molto rispettabile della società gnoll, a dispetto della loro scarsa forza fisica.
actors.mobs.shaman$redshaman.spell_desc=Lo sciamano sta indossando una maschera rossa e userà una magia che diminuirà _il tuo potere offensivo_ temporaneamente.
actors.mobs.shaman$blueshaman.spell_desc=Lo sciamano sta indossando una maschera blu e userà una magia che _aumenta i danni subiti_ temporaneamente.
actors.mobs.shaman$purpleshaman.spell_desc=Lo sciamano sta indossando una maschera color viola e userà una magia che temporaneamente _riduce l'accuratezza e l'evasione._

actors.mobs.armoredbrute.name=bruto corazzato
actors.mobs.armoredbrute.desc=I bruti più esperti spesso indossano una potente armatura per mostrare il loro prestigio. L'armatura rende questi bruti molto più resistenti ai danni fisici e la loro superiore disciplina permette loro di restare in stato di rabbia più a lungo prima di soccombere alle ferite.

actors.mobs.skeleton.name=scheletro
actors.mobs.skeleton.explo_kill=Sei stato ucciso da un'esplosione d'ossa...
actors.mobs.skeleton.def_verb=bloccato
actors.mobs.skeleton.desc=Gli scheletri sono composti dalle ossa di avventurieri sfortunati e abitanti della prigione, animati dalle emanazioni di magia malvagia provenienti dalle profondità sottostanti. Dopo che sono stati danneggiati abbastanza, gli scheletri si disintegreranno in un'esplosione di ossa. Gli schegge di questa esplosione sono dannose per qualsiasi cosa nelle vicinanze, ma l'armatura è molto efficace nel mitigarne gli effetti.

actors.mobs.slime.name=slime
actors.mobs.slime.def_verb=bloccato
actors.mobs.slime.desc=Gli slime sono strani, creature un po' magiche con un corpo esterno gommoso e un nucleo liquido. Le fogne li foraggiano con un'ampia riserva d'acqua e nutrienti.\n\nA causa della loro elastica membrana esterna, sarà difficile infliggere agli slime più di _6 punti danno_ con qualsiasi attacco.

actors.mobs.snake.name=serpente delle fogne
actors.mobs.snake.hint=Prova a usare il pulsante esamina su di un serpente per imparare come sorprenderli.
actors.mobs.snake.desc=Questi serpenti fuori misura sono capaci di fulminei attacchi striscianti, rendendoli piuttosto difficili da colpire. Attacchi magici o attacchi a sorpresa sono comunque in grado di coglierli impreparati.\n\nPuoi eseguire un attacco a sorpresa colpendo mentre sei al di fuori del raggio di visione del serpente. Uno dei modi è farti seguire attraverso una porta e quindi _attaccarlo dopo che lui la attraversa._

actors.mobs.spectralnecromancer.name=necromanti spettrali
actors.mobs.spectralnecromancer.desc=Mentre gli scheletri sono il pane e il burro di un necromante, alcuni preferiscono esaminare altri servitori meno corporei. I necromanti spettrali hanno scelto gli spettri come loro servitori preferiti!\n\nI singoli spettri non sono forti come gli scheletri, ma questi necromanti non hanno paura di evocarne un bel po'!

actors.mobs.spinner.name=filatore delle caverne
actors.mobs.spinner.desc=Questi verdognoli e pelosi ragni delle caverne cercano di evitare il combattimento diretto. Preferiscono piuttosto aspettare a distanza mentre le loro vittime si dibattono intrappolate nella loro ragnatela appiccicosa e infine muoiono lentamente a causa del morso velenoso. Sono capaci di sparare la loro ragnatela a distanze notevoli e tenteranno di bloccare il percorso della loro preda.

actors.mobs.statue.name=statua animata
actors.mobs.statue.def_verb=bloccato
actors.mobs.statue.desc=Si potrebbe pensare che sia solo un'altra statua inanimata del dungeon, ma la luce rossa che emana dai suoi occhi dice tutt'altro.
actors.mobs.statue.desc_weapon=Anche se la statua è fatta di pietra, l'arma che brandisce, _%s_, sembra reale.
actors.mobs.statue.discover_hint=Puoi trovare questo nemico dappertutto nel dungeon.

actors.mobs.succubus.name=succuba
actors.mobs.succubus.desc=Le succubi sono demoni mutaforma che manipolano le menti delle loro prede. Questa qui ha assunto le sembianze di un pallido e gotico umanoide; forse per attrarre gli stregoni nanici?\n\nLe succubi possono ammaliare il loro bersaglio, rendendolo incapace di attaccare direttamente. Quando le succubi attaccano un nemico ammaliato gli ruberanno un po' della sua essenza vitale.

actors.mobs.swarm.name=sciame di mosche
actors.mobs.swarm.desc=Il letale sciame di mosche ronza irosamenente. Ogni attacco non magico lo dividerà in due sciami più piccoli ma ugualmente pericolosi.

actors.mobs.tengu.name=Tengu
actors.mobs.tengu.notice_gotcha=Ti ho beccato, %s!
actors.mobs.tengu.interesting=Rendiamolo interessante...
actors.mobs.tengu.notice_have=Sei mio ora, %s!
actors.mobs.tengu.defeated=Finalmente libero...
actors.mobs.tengu.rankings_desc=Assassinato dal Tengu
actors.mobs.tengu.desc=Un famoso ed enigmatico assassino, noto per la maschera innestata sul suo volto.\n\nTengu è costretto con grosse fibbie ai polsi e alle ginocchia, anche se sembra essersi liberato dalle sue catene molto tempo fa.\n\nCercherà di utilizzare trappole, magia ingannevole e attacchi di precisione per eliminare l'unica cosa che impedisce la sua fuga: tu.

actors.mobs.tengu$bombability$bombblob.desc=Una nube di fumo surriscaldato sta tremolando qui. Stai attento, esploderà!
actors.mobs.tengu$bombability$bombitem.name=Bomba Fumogena
actors.mobs.tengu$bombability$bombitem.cant_pickup=È bloccata a terra, non puoi muoverla!
actors.mobs.tengu$bombability$bombitem.desc=Tengu ha lanciato qui una strana bomba fumogena, che sta esalando un fumo spesso e caldo. Sta emettendo un forte ticchettio, come se stesse per esplodere!\n\nLa bomba si è fissata a terra, perciò non puoi raccoglierla.

actors.mobs.tengu$fireability$fireblob.desc=Tengu ha lanciato una polvere finissima che sembra stia per incendiarsi!

actors.mobs.tengu$shockerability$shockerblob.desc=Si sta accumulando energia elettrica in questo luogo, qualunque cosa posta sopra questa mattonella verrà folgorata al prossimo turno!
actors.mobs.tengu$shockerability$shockeritem.name=Folgoratore
actors.mobs.tengu$shockerability$shockeritem.cant_pickup=Sta emettendo troppa elettricità, non puoi afferrarlo!
actors.mobs.tengu$shockerability$shockeritem.desc=Tengu ha lanciato qui un bizzarro macchinario, che pare fatto con parti di DM-100. La macchina emette continuamente elettricità attorno a sé, ma sembra segua un pattern prevedibile.\n\nCon tutta l'elettricità che gli sta attorno, non c'è modo tu possa raccoglierla.

actors.mobs.thief.name=ladro pazzo
actors.mobs.thief.stole=Il ladro ti ha rubato %s!
actors.mobs.thief.carries=\n\nIl ladro sta trasportando un _%s._ Rubato ovviamente.
actors.mobs.thief.escapes=Il ladro se ne va con %s!
actors.mobs.thief.desc=Anche se questi detenuti vagano fuori dalle loro celle, questo posto è ancora la loro prigione. Nel corso del tempo, questo luogo li ha privati delle loro menti oltre che della loro libertà. Molto tempo fa, questi folli ladri e banditi hanno dimenticato chi sono e perché rubano.\n\nQuesti nemici sono più propensi a rubare e fuggire di quanto lo siano a combattere. Assicurati di tenerli a vista o potresti non vedere mai più ciò che ti hanno rubato.

actors.mobs.tormentedspirit.name=spirito tormentato
actors.mobs.tormentedspirit.desc=Gli spiriti tormentati sono spiriti di natura buona che sono stati afflitti da una maledizione. Fino a quando rimangono maledetti attaccheranno come uno spettro e sono anche più potenti!\n\nÈ possibile purificare la maledizione usando il giusto oggetto stando di fianco allo spirito. Se la maledizione è rimossa lo spirito sarà sicuramente riconoscente...
actors.mobs.tormentedspirit.thank_you=Grazie...

actors.mobs.vaultrat.desc=Il ratto ha avuto dei cambiamenti nel comportamento per testare la nuova IA nemica del vault:\n_-_ Il suo movmento può essere 'ascoltato' attraverso i muri\n_-_ Vagherà secondo una pattuglia pre-impostata\n_-_ Mentre vaga ha un raggio di percezione decisamente ridotto dietro di sé rispetto alla direzione in cui si muove\n_-_ Mentre dorme il suo raggio di percezione è sempre ridotto\n_-_ Quando ti scopre verrà ad 'investigare' prima di passare alla caccia. I nemici che stanno investigando si spostano verso di te ma non attaccano ed è facile seminarli tra le porte e gli angoli.

actors.mobs.npcs.vaultsentry.name=Sentinella perlustratrice del vault.
actors.mobs.npcs.vaultsentry.desc=Questa sentinella sta perlustrando l'area secondo un pattern. _Siccome è un'area di test, la sentinella non farà nulla se ti scopre._

actors.mobs.npcs.vaultlaser.name=Sentinella laser del vault
actors.mobs.npcs.vaultlaser.desc=Questa sentinella sta sparando laser a intervalli regolari. _Siccome è un'area di test, i laser non ti danneggeranno._

actors.mobs.warlock.name=nano stregone
actors.mobs.warlock.bolt_kill=Il fulmine d'ombra ti ha ucciso...
actors.mobs.warlock.desc=Quando gli interessi dei nani mutarono dall'ingegneria alle arti arcane, i warlock hanno conquistato il potere nella città. Iniziarono con la magia elementale, ma ben presto passarono a demonologia e necromanzia. I più forti tra essi si impadronirono del trono della città nanica e le loro coorti continuarono a praticare la magia oscura così a lungo da cedere la loro volontà ad essa.\n\nTali warlock possiedono una potente magia distruttiva e sono capaci di ostacolare la magia di miglioramento applicata al tuo equipaggiamento. Più un oggetto è migliorato, più fortemente verrà coinvolto.

actors.mobs.wraith.name=spettro
actors.mobs.wraith.desc=Uno spettro è uno spirito vendicativo di un peccatore, la cui tomba o sepolcro sono stati disturbati. Essendo un'entità eterea, è molto difficile da colpire con un'arma normale.
actors.mobs.wraith.discover_hint=Puoi trovare questo nemico dappertutto nel dungeon.

actors.mobs.yogdzewa.name=Yog-Dzewa
actors.mobs.yogdzewa.notice=IO. TI. VEDO.
actors.mobs.yogdzewa.darkness=L'oscurità si avvicina...
actors.mobs.yogdzewa.hope=LA. TUA. SPERANZA. È. UNA. ILLUSIONE!
actors.mobs.yogdzewa.defeated=...
actors.mobs.yogdzewa.rankings_desc=Divorato da Yog-Dzewa
actors.mobs.yogdzewa.desc=Yog-Dzewa è un Dio Antico; un'enorme mostruosità che penetra nei mondi mortali e li divora per foraggiare la sua crescita infinita. I nani devono aver attirato l'attenzione di questo orrore cosmico durante la sperimentazione con la magia nera e hanno tentato di controllarlo sin da allora.\n\nYog-Dzewa proviene da una dimensione di puro caos magico e non può manifestare la sua vera forma in questo mondo. Piuttosto, ha qui creato personificazioni ed evocato servi demoniaci obbedienti al suo volere.\n\nQuesto grande occhio è il punto focale del potere di Yog-Dzewa in questo mondo. Sebbene l'occhio in sé sia immobile, è in grado di emettere potenti raggi di magia demoniaca e di evocare in suo aiuto una varietà di suoi servi.
actors.mobs.yogdzewa.desc_spawners=Puoi sentire le onde di energia demoniaca irradiarsi nell'occhio dai piani superiori. Qualcosa che hai lasciato in vita lassù alimenta il potere verso Yog-Dzewa. _Yog userà questa energia per evocare servi più potenti!_
actors.mobs.yogdzewa$larva.name=larva del dio
actors.mobs.yogdzewa$larva.rankings_desc=Divorato da Yog-Dzewa
actors.mobs.yogdzewa$larva.desc=La prole minuta di Yog-Dzewa è costituita da semplici servi facili da generare. Sebbene individualmente siano deboli, vengono evocati rapidamente e possono divenire travolgenti in grandi numeri.
actors.mobs.yogdzewa$yogripper.rankings_desc=Divorato da Yog-Dzewa
actors.mobs.yogdzewa$yogeye.rankings_desc=Divorato da Yog-Dzewa
actors.mobs.yogdzewa$yogscorpio.rankings_desc=Divorato da Yog-Dzewa

actors.mobs.yogfist.invuln_warn=Il pugno è invulnerabile quando è vicino all'occhio!
actors.mobs.yogfist.rankings_desc=Divorato da Yog-Dzewa
actors.mobs.yogfist.desc=Questo pugno è una manifestazione del potere di Yog-Dzewa. I pugni sono collegati al potere di Yog-Dzewa e saranno protetti da ogni danno quando sono vicini all'occhio.
actors.mobs.yogfist$burningfist.name=pugno ardente
actors.mobs.yogfist$burningfist.desc=Questo pugno è plasmato da ardente magia caotica. Al suo movimento incendierà costantemente il terreno circostante. È inoltre in grado di emettere getti di potere ardente, spargendo fiamme nel punto d'impatto.\n\nLa capacità nello spargere fiamme del pugno è soppressa quando si trova vicino all'acqua, ma il suo calore è così grande che tutta l'acqua intorno evaporerà in breve tempo!
actors.mobs.yogfist$soiledfist.name=pugno fangoso
actors.mobs.yogfist$soiledfist.desc=Questo pugno è plasmato dalla caotica magia della terra. Il suo movimento farà costantemente germogliare vegetazione intorno a sé. Può inoltre emettere raggi concentrati che intrappolano il suo bersaglio con liane e radici a crescita rapida!\n\nIl pugno riceve il suo potere dalla vita vegetale e resisterà al danno in base alla quantità della vegetazione presente vicino.
actors.mobs.yogfist$rottingfist.name=pugno in decomposizione
actors.mobs.yogfist$rottingfist.desc=Questo pugno è plasmato dalla corruzione della vita. È costituito di un'imponente massa di carne decomposta che può spargere melma caustica da vicino e gas tossico a distanza. Se ciò non bastasse, la grossa mole del pugno lo protegge dai danni diretti ma non dai sanguinamenti.\n\nL'acqua è efficace a lavare via la melma, ma il pugno è anche in grado di assorbirla per curarsi! In aggiunta, danneggiare il pugno mentre sta sanguinando prolungherà il sanguinamento ma l'effetto non si sommerà ai danni.
actors.mobs.yogfist$rustedfist.name=pugno arrugginito
actors.mobs.yogfist$rustedfist.desc=Questo pugno è plasmato dal metallo vivente. È una torreggiante massa di metallo cangiante dotata di potenti attacchi ravvicinati, mentre può azzoppare i suoi bersagli a distanza. Per via della sua tremenda massa il pugno riceverà qualunque sorta di danno nel corso del tempo, invece che immediatamente.\n\nIl pugno tuttavia è inflessibile e non può muoversi attraverso passaggi stretti. Inoltre, sebbene si danneggi lentamente, il danno differito continuerà ad aumentare se il pugno colpisce molteplici volte.
actors.mobs.yogfist$brightfist.name=pugno luminoso
actors.mobs.yogfist$brightfist.teleport=Il pugno si teletrasporta via in un bagliore di luce che ti acceca gravemente!
actors.mobs.yogfist$brightfist.desc=Questo pugno è plasmato da pura energia luminosa. È in grado di emettere potenti raggi di luce feroce a ogni turno! Questi raggi ti accecheranno temporaneamente oltre che arrecare danni pesanti. Il pugno è anche in grado di riempire l'arena di luce intensa per qualche istante, al fine di sfuggire!\n\nIl pugno tuttavia non possiede abilità particolari a tiro ravvicinato.
actors.mobs.yogfist$darkfist.name=pugno oscuro
actors.mobs.yogfist$darkfist.teleport=Il pugno si teletrasporta via in un'esplosione di oscurità che estingue la tua fonte di luce!
actors.mobs.yogfist$darkfist.desc=Questo pungo è plasmato di pura energia oscura. È in grado di emettere potenti esplosioni di energia oscura a ogni turno! Tali scòppi indeboliranno la tua fonte di luce oltre ad arrecare danni pesanti. Il pugno è inoltre in grado di riempire l'arena con l'oscurità per qualche istante, al fine di sfuggire!\n\nIl pugno tuttavia non possiede abilità particolari a tiro ravvicinato.


actors.char.kill=%s ti ha ucciso...
actors.char.defeat=hai sconfitto %s.
actors.char.def_verb=schivato
actors.char.invulnerable=invulnerabile
actors.char.immune=immune

# Eternity PD Fallback Keys
actors.blobs.blizzard.desc=A blizzard is swirling here.
actors.blobs.confusiongas.desc=A cloud of confusion gas is swirling here.
actors.blobs.dancefloor.desc=Dance dance dance!\n%s dancing tile: %s\nNext color: %s
actors.blobs.dancefloor.color_1_name=Red
actors.blobs.dancefloor.color_1_desc=Characters standing on this tile take direct damage (massively increased vs hero)
actors.blobs.dancefloor.color_2_name=Green
actors.blobs.dancefloor.color_2_desc=Characters standing on this tile act at 2x speed
actors.blobs.dancefloor.color_3_name=Blue
actors.blobs.dancefloor.color_3_desc=Characters standing on this tile are stunned
actors.blobs.dancefloor.color_4_name=White
actors.blobs.dancefloor.color_4_desc=Characters standing on this tile take defered damage (massively increased vs hero)
actors.blobs.dancefloor.color_5_name=Yellow
actors.blobs.dancefloor.color_5_desc=Mobs killed on this tile give double EXP and more loot
actors.blobs.dancefloor.color_6_name=Purple
actors.blobs.dancefloor.color_6_desc=Characters standing on this tile take double damage
actors.blobs.dancefloor.rankings_desc=Danced into a grave
actors.blobs.dancefloor.ondeath=You danced into your own grave
actors.blobs.dancefloor$dancingdefereddamage.name=Dancing with Death
actors.blobs.dancefloor$dancingdefereddamage.desc=This is the most dangerous dance you've ever performed, and you are absolutely _ROCKING_ it, disregarding the pain!\n\nDeferred damage remaining: %d.
actors.blobs.dancefloor$dancingdefereddamage.ondeath=You danced into your own grave
actors.blobs.dancefloor$dancingdefereddamage.rankings_desc=Danced into a grave
actors.blobs.dancefloor$dancingdoom.name=Dancing in a grave
actors.blobs.dancefloor$dancingdoom.desc=Grave isn't the best place to dance in, but no one is stopping you!\n\nCharacters who are brave enough to dance in a grave will receive double damage from all sources.
actors.blobs.dancefloor$dancespeed.name=Dancing with Time
actors.blobs.dancefloor$dancespeed.desc=Your perfect dance synchronized with a rhythm of the universe, and not even time gonna stop you from dancing!\n\nWhile you dance is perfect, you will perform all actions at double speed.
actors.blobs.dancefloor$dancingstun.name=Stunned
actors.blobs.dancefloor$dancingstun.heromsg=You are stunned!
actors.blobs.dancefloor$dancingstun.desc=Nothing feels worse than being stunned in a middle of a dance\n\nStun completely halts all actions, forcing the target to wait until the effect wears off.
actors.blobs.electricity.desc=A field of electricity is sparking brightly here.
actors.blobs.electricity.rankings_desc=Electrocuted
actors.blobs.electricity.ondeath=You were shocked to death...
actors.blobs.fire.desc=A fire is raging here.
actors.blobs.foliage.desc=Shafts of light pierce the gloom of the underground garden.
actors.blobs.freezing.desc=The air is unnaturally frigid here.
actors.blobs.goowarn.desc=Specks of dark energy are swarming here!
actors.blobs.inferno.desc=An inferno is raging here.
actors.blobs.paralyticgas.desc=A cloud of paralytic gas is swirling here.
actors.blobs.sacrificialfire.desc=There is an altar here with a sacrificial fire burning atop it. Any creature that's killed here will be consumed as an offering to the spirits of the dungeon.\n\nPerhaps a reward will be given if enough sacrifices are made?
actors.blobs.sacrificialfire.worthy=The fire consumes your offering and grows stronger.
actors.blobs.sacrificialfire.unworthy=The fire consumes your offering, but doesn't change.
actors.blobs.sacrificialfire.reward=The fire flares and then dissipates, leaving a reward behind!
actors.blobs.smokescreen.desc=A cloud of thick black smoke is swirling here.
actors.blobs.stenchgas.desc=A cloud of fetid stench is swirling here.
actors.blobs.stormcloud.desc=A cloud of billowing water vapor is swirling here.
actors.blobs.toxicgas.desc=A greenish cloud of toxic gas is swirling here.
actors.blobs.toxicgas.rankings_desc=Suffocated
actors.blobs.toxicgas.ondeath=You died from the toxic gas...
actors.blobs.corrosivegas.desc=A cloud of deadly caustic gas is swirling here.
actors.blobs.waterofawareness.procced=As you take a sip, you feel knowledge pour into your mind.
actors.blobs.waterofawareness.desc=Power of knowledge radiates from the water of this well. Take a sip from it to reveal all secrets of equipped items and reveal all items on the current floor.
actors.blobs.waterofhealth.procced=As you take a sip, you feel your wounds heal completely.
actors.blobs.waterofhealth.desc=Power of health radiates from the water of this well. Take a sip from it to heal your wounds and satisfy hunger.
actors.blobs.wateroftransmutation.desc=Power of change radiates from the water of this well. Throw an item into the well to turn it into something else.
actors.blobs.web.desc=A thick web is covering everything here. Anything that touches or is thrown through the web will break it, but will also be stuck in place.
actors.buffs.adrenaline.name=adrenaline
actors.buffs.adrenaline.desc=A surge of physical power, adrenaline enhanced both attack and movement speed.\n\nAdrenaline allows its target to run at 2x speed, and attack at 1.5x speed.\n\nTurns remaining: %s.
actors.buffs.adrenalinesurge.name=strength boost
actors.buffs.adrenalinesurge.desc=A surge of great might, but sadly not permanent.\n\nStrength boost: +%d.\nTurns until boost weakens: %s.
actors.buffs.amok.name=amok
actors.buffs.amok.desc=Amok causes a state of great rage and confusion in its target.\n\nWhen a creature is amoked, they will attack whatever is near them, whether they be friend or foe.\n\nTurns of amok remaining: %s.
actors.buffs.arcanearmor.name=arcane armor
actors.buffs.arcanearmor.desc=A thin shield is surrounding you, blocking some of the damage from magical attacks.\n\nYour magical armor is currently boosted by: 0-%d.\n\nTurns until arcane armor weakens: %s.
actors.buffs.artifactrecharge.name=artifact recharging
actors.buffs.artifactrecharge.desc=Energy is coursing through you, increasing the rate your equipped artifacts charge.\n\nEach artifact is affected a little differently, but they will all gain charge much faster than normal.\n\nTurns remaining: %s.
actors.buffs.ascensionchallenge.name=amulet's curse
actors.buffs.ascensionchallenge.desc=Somehow Yog-Dzewa is maintaining influence on this world through the amulet, and is trying to stop your ascent!\n\nYog's power is making the dungeon much more dangerous, increasing the number of enemies and making them stronger! This power will keep building if left unchecked, it can be weakened by defeating enemies that have been enhanced by Yog's power.
actors.buffs.ascensionchallenge.desc_clear=The dark energy radiating from the amulet has been weakened as much as possible for now.
actors.buffs.ascensionchallenge.desc_beckon=The amulet is currently _calling out to distant enemies,_ alerting them to your position.
actors.buffs.ascensionchallenge.desc_haste=The amulet is currently _hastening distant enemies,_ letting them reach you faster!
actors.buffs.ascensionchallenge.desc_slow=The amulet is currently _slowing you down,_ and negating speed boosting effects!
actors.buffs.ascensionchallenge.desc_damage=The energy from the amulet has gotten so strong that it's _directly harming you!_
actors.buffs.ascensionchallenge.beckon=The amulet begins calling out to distant enemies.
actors.buffs.ascensionchallenge.haste=The amulet begins hastening distant enemies!
actors.buffs.ascensionchallenge.slow=The amulet starts to feel like a lead weight in your inventory!
actors.buffs.ascensionchallenge.damage=The amulet begins radiating dark energy. It burns!
actors.buffs.ascensionchallenge.weaken_info=You must defeat enemies to weaken the amulet's curse!
actors.buffs.ascensionchallenge.weaken=You can feel the amulet's curse weaken slightly.
actors.buffs.ascensionchallenge.break=You take a moment to catch your breath and feel your wounds begin to close!
actors.buffs.ascensionchallenge.almost=You feel Yog's grip on the amulet begin to weaken, you're almost there!
actors.buffs.ascensionchallenge.on_kill=The dark energy consumes you...
actors.buffs.barkskin.name=barkskin
actors.buffs.barkskin.desc=Your skin is hardened, it feels rough and solid like bark.\n\nThe hardened skin increases your effective armor, allowing you to better defend against physical attack.\n\nYour armor is currently increased by: 0-%d.\nTurns until barkskin weakens: %s.\n\nIf you receive barkskin from multiple sources, only the strongest one will apply.
actors.buffs.barrier.name=barrier
actors.buffs.barrier.desc=A durable bubble of force which blocks all damage.\n\nThe barrier will take damage for whatever it is protecting so long as there is shielding left. The shielding will also slowly decay over time.\n\nShielding remaining: %d.
actors.buffs.rageshield.name=Determination Shield
actors.buffs.rageshield.heromsg=You are protected by your rage!
actors.buffs.rageshield.desc=A durable bubble of your sheer rage saps away life force from nearby enemies, if you are wounded.\n\nThe barrier will drain health from enemies in your sight, angering them and taking damage. The shielding will have bigger effect if enemy is in adjacent to host.\n\nShielding remaining: %d.
actors.buffs.berserk.angered=angered
actors.buffs.berserk.berserk=berserking
actors.buffs.berserk.exhausted=exhausted
actors.buffs.berserk.recovering=recovering
actors.buffs.berserk.angered_desc=The severity of the Berserker's injuries strengthen his blows. As the berserker takes physical damage, his rage will build, granting him bonus damage. Damage which is blocked by armor still counts towards building rage.\n\nRage will fade over time. The lower the berserker's health, the longer it will last.\n\nAt 100%% rage, the Berserker can go berserk, granting him 2x his seal's max shielding, increasing to 6x if he has very low health. This shielding decays over time and once it runs out the berserker will have to rest before building rage again.\n\nCurrent Rage: _%.0f%%_\n_+%.0f%%_ damage
actors.buffs.berserk.berserk_desc=Fear and uncertainty bleed away, leaving only anger. In this state the Berserker is extremely powerful, _dealing +50% damage and gaining bonus shielding._\n\nThis bonus shielding is equal to 2x his seal's max shielding, increasing to 6x if he has very low health. When this shielding is reduced to 0, berserking will end.\n\nAfter raging, the Berserker will need to recover before being able to build rage again.
actors.buffs.berserk.recovering_desc=Inner strength has its limits. The Berserker must rest before using his rage again.\n\nWhile recovering the Berserker does not build any rage from taking damage.
actors.buffs.berserk.recovering_desc_turns=Turns until recovered: _%d_
actors.buffs.berserk.recovering_desc_levels=Levels until recovered: _%.2f_
actors.buffs.berserk.rankings_desc=Berserked to Death
actors.buffs.berserk.action_name=Berserk
actors.buffs.berserk.no_seal=You need your broken seal to berserk!
actors.buffs.bleeding.name=bleeding
actors.buffs.bleeding.ondeath=You bled to death...
actors.buffs.bleeding.heromsg=You are bleeding!
actors.buffs.bleeding.rankings_desc=Bled to Death
actors.buffs.bleeding.desc=That wound is leaking a worrisome amount of blood.\n\nBleeding causes damage every turn. Each turn the damage decreases by a random amount, until the bleeding eventually stops.\n\nCurrent bleed damage: %d.
actors.buffs.bless.name=blessed
actors.buffs.bless.desc=A great burst of focus, some say it is inspired by the gods.\n\nBlessing increases accuracy and evasion by 25%%, making the blessed much more effective in combat.\nIt also increased experience gain by 2x for heroes and allows them to get more items.\n\nTurns of bless remaining: %s.
actors.buffs.blindness.name=blinded
actors.buffs.blindness.heromsg=You are blinded!
actors.buffs.blindness.desc=Blinding turns the surrounding world into a dark haze.\n\nWhile blinded, a character's vision range is reduced to one tile, rendering ranged attacks useless and making it very easy to lose track of distant enemies. Additionally, a blinded hero is unable to read scrolls or books.\n\nTurns of blindness remaining: %s.
actors.buffs.buff.heromsg=
actors.buffs.burning.name=burning
actors.buffs.burning.heromsg=You catch fire!
actors.buffs.burning.burnsup=%s burns up!
actors.buffs.burning.ondeath=You burned to death...
actors.buffs.burning.rankings_desc=Burned to Ash
actors.buffs.burning.desc=Few things are more distressing than being engulfed in flames.\n\nFire will deal damage every turn until it is put out by water or it expires. Fire can be extinquished by stepping into water, or from the splash of a shattering potion.\n\nAdditionally, the fire may ignite flammable terrain or items that it comes into contact with.\n\nTurns of burning remaining: %s.
actors.buffs.championenemy.warn=You sense a deadly presence.
actors.buffs.championenemy$blazing.name=blazing champion
actors.buffs.championenemy$blazing.desc=Blazing champions deal 25% more melee damage, ignite enemies they attack, are immune to fire, and spread fire around them as they die. They can't spread fire onto water however.
actors.buffs.championenemy$projecting.name=projecting champion
actors.buffs.championenemy$projecting.desc=Projecting champions deal 25% more melee damage and have +3 attack range.
actors.buffs.championenemy$antimagic.name=antimagic champion
actors.buffs.championenemy$antimagic.desc=Antimagic champions take 50% less damage and are completely immune to magical effects.
actors.buffs.championenemy$giant.name=giant champion
actors.buffs.championenemy$giant.desc=Giant champions take 80% less damage and have +1 attack range, but cannot move through enclosed spaces.
actors.buffs.championenemy$blessed.name=blessed champion
actors.buffs.championenemy$blessed.desc=Blessed champions have 4x accuracy and evasion.
actors.buffs.championenemy$growing.name=growing champion
actors.buffs.championenemy$growing.desc=Growing champions gain a steadily increasing bonus to accuracy, evasion, physical damage, and a reduction to damage taken.\n\nCurrent acc/eva/dmg boost: %1$d%%\nCurrent damage reduction: %2$d%%
actors.buffs.championenemy$tanky.name=tanky champion
actors.buffs.championenemy$tanky.desc=Tanky champions receives only 5% of the damage, but reduces their damage and speed by 25%.
actors.buffs.championenemy$speedy.name=speedy champion
actors.buffs.championenemy$speedy.desc=Speedy Champions will gain x4 speed and x1.5 evasion and accuracy.
actors.buffs.championenemy$frozen.name=frozen champion
actors.buffs.championenemy$frozen.desc=Frozen champions deal 25% more melee damage but they have -20% speed, chills enemies they attack and sometimes freezes them, are immune to cold gases or effects, and spread blizzard around them as they die.
actors.buffs.championenemy$blunt.name=blunt champion
actors.buffs.championenemy$blunt.desc=Blunt champions are expert for using their hands or something they use as a blunt weapons, they deal 75% more damage as well as inflicts vertigo when they attack and paralyzes you in rare cases.
actors.buffs.charm.name=charmed
actors.buffs.charm.heromsg=You are charmed!
actors.buffs.charm.cant_attack=You are charmed by that enemy and can't attack them.
actors.buffs.charm.desc=A charm is manipulative magic that can make enemies temporarily adore each other.\n\nCharacters affected by charm are unable to directly attack the enemy they are charmed by. Attacking other targets is still possible however. The shock of pain will lessen the duration of charm.\n\nTurns of charm remaining: %s.
actors.buffs.chill.name=chilled
actors.buffs.chill.freezes=%s freezes!
actors.buffs.chill.desc=Not quite frozen, but still much too cold.\n\nChilled targets perform all actions more slowly, depending on how many turns are left in the effect. At its worst, this is equivalent to being slowed.\n\nTurns of chill remaining: %1$s.\nSpeed is reduced by: %2$s%%
actors.buffs.combo.name=combo
actors.buffs.combo.action_name=combo attack
actors.buffs.combo.combo=%d hit combo!
actors.buffs.combo.bad_target=You must target an enemy in attack range.
actors.buffs.combo.prompt=Select a target to attack.
actors.buffs.combo.desc=The gladiator builds momentum as they land successful blows. Each attack increases the combo counter by one, but taking too long between hits will reset the combo counter to 0.\n\nBuilding combo unlocks special combo attacks that cannot miss! A different attack is unlocked at 2, 4, 6, 8, and 10 combo count. Some moves reset combo and some do not, but each move can only be used once per combo session.\n\nCurrent combo: %1$d.\n\nTurns until Combo is lost: %2$s.
actors.buffs.combo$combomove.clobber.name=clobber
actors.buffs.combo$combomove.clobber.desc=Knocks an enemy back 2 tiles, but deals no damage and cannot knock into pits. Increments combo by 1.
actors.buffs.combo$combomove.clobber.empower_desc=Knocks an enemy back _3 tiles, inflicts vertigo, and can knock into pits,_ but deals no damage. Increments combo by 1.
actors.buffs.combo$combomove.slam.name=slam
actors.buffs.combo$combomove.slam.desc=Deals %d%% (combo*20%%) of your damage blocking power as bonus damage. Resets combo when used.
actors.buffs.combo$combomove.slam.empower_desc=_Leaps up to %1$d tile(s)_ and deals %2$d%% (combo*20%%) of your damage blocking power as bonus damage. Resets combo when used.
actors.buffs.combo$combomove.parry.name=parry
actors.buffs.combo$combomove.parry.desc=Blocks the next attack within 1 turn when activated, and instantly retaliates to it. Resets combo if nothing is parried.
actors.buffs.combo$combomove.parry.empower_desc=Blocks _all attacks_ within 1 turn when activated, and instantly retaliates to them. Resets combo if nothing is parried.
actors.buffs.combo$combomove.crush.name=crush
actors.buffs.combo$combomove.crush.desc=Deals %d%% (combo*25%%) damage to the primary target, and half that damage to all other enemies in a 7x7 AOE. Resets combo when used.
actors.buffs.combo$combomove.crush.empower_desc=_Leaps up to %1$d tile(s)_ and deals %2$d%% (combo*25%%) damage to the primary target, and half that damage to all other enemies in a 7x7 AOE. Resets combo when used.
actors.buffs.combo$combomove.fury.name=fury
actors.buffs.combo$combomove.fury.desc=Hits an enemy once for each combo you have, each hit deals 60% damage and can trigger enchantments. Resets combo when used.
actors.buffs.combo$combomove.fury.empower_desc=_Leaps up to %d tile(s)_ and hits an enemy once for each combo you have, each hit deals 60%% damage and can trigger enchantments. Resets combo when used.
actors.buffs.corruption.name=corrupted
actors.buffs.corruption.desc=Corruption seeps into the essence of a being, twisting them against their former nature.\n\nCorrupted creatures will attack their allies, and ignore their former enemies. Corruption is damaging as well, and will slowly cause its target to succumb.\n\nCorruption is permanent, its effects only end in death.
actors.buffs.cripple.name=crippled
actors.buffs.cripple.heromsg=You are crippled!
actors.buffs.cripple.desc=You're pretty sure legs aren't meant to bend that way.\n\nCrippled halves movement speed, making moving a tile usually take two turns instead of one.\n\nTurns of cripple remaining: %s.
actors.buffs.daze.name=dazed
actors.buffs.daze.heromsg=You are dazed!
actors.buffs.daze.desc=Ringing ears and blurred vision make it difficult to fight.\n\nWhile dazed, accuracy and evasion are reduced by 50%%, making both landing and evading blows much harder.\n\nTurns of daze remaining: %s.
actors.buffs.degrade.name=degraded
actors.buffs.degrade.heromsg=Your equipment feels weaker!
actors.buffs.degrade.desc=Powerful dark magic is sapping the strength that scrolls of upgrade have applied to your equipment!\n\nWhile degraded, upgraded gear will be treated as if it is a lower level than it actually is. _Every upgrade after +3 becomes exponentially weaker than the last one._ The descriptions of your items will change to reflect their reduced power level.\n\nDegradation does not affect strength requirements, wand charges, durability of thrown weapons, or artifacts.\n\nTurns of degradation remaining: %s. Using a scroll of upgrade or remove curse will end degradation immediately.
actors.buffs.doom.name=doomed
actors.buffs.doom.desc=It's hard to keep going when it seems like the universe wants you dead.\n\nDoomed characters will receive +67% damage from all sources.\n\nDoom is permanent, its effects only end in death.
actors.buffs.dread.name=dread
actors.buffs.dread.desc=A terror so great that it will cause its target to flee the dungeon entirely!\n\nCreatures affected by dread will run from their opponent at high speed, and will disappear from the dungeon entirely once they are out of sight. Enemies that are defeated this way award half experience and drop no items. The shock of pain will lessen the duration of dread.\n\nTurns of dread remaining: %d.
actors.buffs.drowsy.name=drowsy
actors.buffs.drowsy.desc=A magical force is making it difficult to stay awake, after a few turns, the target will fall into a deep magical sleep.\n\nThe hero can resist drowsiness by taking damage or by being at full health.\n\nTurns until sleep: %s.
actors.buffs.earthimbue.name=imbued with earth
actors.buffs.earthimbue.desc=You are imbued with the power of earth!\n\nAll physical attacks will shift the earth under the enemy, crippling them for a short time.\n\nTurns of earth imbue remaining: %s.
actors.buffs.enhancedrings.name=enhanced rings
actors.buffs.enhancedrings.desc=The Rogue's recently used artifact is empowering his rings, granting them +1 level.\n\nTurns remaining: %s.
actors.buffs.fireimbue.name=imbued with fire
actors.buffs.fireimbue.desc=You are imbued with the power of fire!\n\nAll physical attacks will have a chance to light enemies ablaze. Additionally, you are completely immune to the effects of fire.\n\nTurns of fire imbue remaining: %s.
actors.buffs.foresight.name=foresight
actors.buffs.foresight.desc=You are somehow able to see the layout of surrounding terrain with your mind.\n\nWhile under the effect of foresight all tiles in a wide radius are revealed to you, including any secret traps or doors.\n\nTurns of foresight remaining: %s.
actors.buffs.frost.name=frozen
actors.buffs.frost.freezes=%s freezes!
actors.buffs.frost.desc=Not to be confused with freezing solid, this more benign freezing simply encases the target in ice.\n\nFreezing acts similarly to paralysis, making it impossible for the target to act. Unlike paralysis, freezing is immediately cancelled if the target takes damage, as the ice will shatter.\n\nTurns of freeze remaining: %s.
actors.buffs.frostimbue.name=imbued with frost
actors.buffs.frostimbue.desc=You are imbued with icy power!\n\nAll physical attacks will steadily stack chill on enemies. Additionally, you are completely immune to the cold.\n\nTurns of frost imbue remaining: %s.
actors.buffs.fury.name=furious
actors.buffs.fury.heromsg=You become furious!
actors.buffs.fury.desc=You are angry, enemies won't like you when you're angry.\n\nA great rage burns within you, increasing the damage you deal with physical attacks by 50%%.\n\nThis rage will last as long as you are injured below 50%% health.
actors.buffs.blobimmunity.name=purification barrier
actors.buffs.blobimmunity.desc=Some strange force is encasing you in a thin protective barrier, blocking out all harmful airborne effects.\n\nYou are immune to all area-bound effects while this barrier lasts.\n\nTurns of immunity remaining: %s.
actors.buffs.greaterhaste.name=greater haste
actors.buffs.greaterhaste.desc=An incredible boost of speed, for a moment it feels as if everything else is standing still.\n\nWhile under the effects of greater haste moving actions take no time at all, but other actions are still performed at normal speed. Each step of movement consumes a turn of greater haste.\n\nTurns of greater haste remaining: %d.
actors.buffs.godspeed.name=Godspeed
actors.buffs.godspeed.desc=Godly energy courses through your whole essence, allowing you to perform actions at incredible speeds!\n\nWhile under the effects of godspeed you will perform all actions at double speed.\n\nTurns of godspeed remaining: %s.
actors.buffs.haste.name=haste
actors.buffs.haste.desc=Energy courses through your muscles, allowing you to run at incredible speeds!\n\nWhile under the effects of haste you will run at 3x speed, but will perform all other actions at normal speed.\n\nTurns of haste remaining: %s.
actors.buffs.healing.name=healing
actors.buffs.healing.desc=A magical remedy is causing wounds to close and flesh to knit.\n\nEvery turn health will steadily regenerate until the healing effect expires. The amount of healing may fade over time.\n\nNext heal: %d.\n\nHealing remaining: %d.
actors.buffs.herodisguise.name=disguise
actors.buffs.herodisguise.desc=Illusory magic has altered your physical appearance! The effect is purely cosmetic, but feels very strange regardless.\n\nTurns of disguise remaining: %s.
actors.buffs.hex.name=hexed
actors.buffs.hex.heromsg=You have been hexed!
actors.buffs.hex.desc=Dark magic which saps focus, making the target slightly disoriented.\n\nHexing reduces accuracy and evasion by 20%%, making the target less effective in combat.\n\nTurns of hex remaining: %s.
actors.buffs.holdfast.name=hold fast
actors.buffs.holdfast.desc=The %s is holding his position, increasing their armor by %d-%d. This will last until they move.
actors.buffs.hunger.hungry=hungry
actors.buffs.hunger.starving=starving
actors.buffs.hunger.onhungry=You are hungry.
actors.buffs.hunger.onstarving=You are starving!
actors.buffs.hunger.ondeath=You starved to death...
actors.buffs.hunger.cursedhorn=The cursed horn steals some of the food energy as you eat.
actors.buffs.hunger.rankings_desc=Starved to Death
actors.buffs.hunger.desc_intro_hungry=You can feel your stomach calling out for food, but it's not too urgent yet.
actors.buffs.hunger.desc_intro_starving=You're so hungry it hurts.
actors.buffs.hunger.desc=\n\nHunger slowly increases as you spend time in the dungeon, eventually you will begin to starve. While starving you will slowly lose health instead of regenerating it.\n\nRationing is important! If you have health to spare starving isn't a bad idea if it means there will be more food later. Effective rationing can make food last a lot longer!
actors.buffs.invisibility.name=invisible
actors.buffs.invisibility.desc=You are completely blended into the surrounding terrain, making you impossible to see.\n\nWhile you are invisible enemies are unable to attack or follow you. Physical attacks and magical effects (such as scrolls and wands) will immediately cancel invisibility.\n\nTurns of invisibility remaining: %s.
actors.buffs.invulnerability.name=invulnerable
actors.buffs.invulnerability.desc=You are suffused with great protective power, granting you a brief period of invulnerability!\n\nTurns remaining: %s.
actors.buffs.levitation.name=levitating
actors.buffs.levitation.desc=A magical force is levitating you over the ground, making you feel weightless.\n\nLevitating characters move silently and ignore all ground-based effects. Traps won't trigger, water won't put out fire, plants won't be trampled, roots will miss, and pits will be hovered over. Be careful, as all these things can come into effect the second the levitation ends!\n\nTurns of levitation remaining: %s.
actors.buffs.lifelink.name=life link
actors.buffs.lifelink.desc=This character's life force is linked to another character nearby. Any damage taken is shared between them.\n\nWhenever this character takes damage, half of it will be dealt to the life link target instead.\n\nTurns of life link remaining: %s, or until the linked character dies.
actors.buffs.light.name=illuminated
actors.buffs.light.desc=Even in the Darkest Dungeon, a steady light at your side is always comforting.\n\nLight helps keep darkness at bay, allowing you to see a reasonable distance despite the environment.\n\nTurns of illumination remaining: %s.
actors.buffs.lockedfloor.name=floor is locked
actors.buffs.lockedfloor.desc=The current floor is locked, and you are unable to leave it!\n\nWhile a floor is locked, you will not gain hunger or take damage from starving. In addition, if you do not work towards defeating this floor's boss, passive regeneration effects will also stop.\n\nAdditionally, if you are revived by an unblessed ankh while the floor is locked, then it will reset.\n\nKill this floor's boss to break the lock.
actors.buffs.lostinventory.name=lost inventory
actors.buffs.lostinventory.desc=Your inventory has been lost somewhere in the dungeon! You won't be able to pick up or use most items until you retrieve it.
actors.buffs.magicalsight.name=magical sight
actors.buffs.magicalsight.desc=Somehow you are able to see with your mind, rather than your eyes.\n\nWhile magical sight is active you will be able to see through all terrain in a 12 tile radius.\n\nTurns of magical sight remaining: %s.
actors.buffs.magicalsleep.name=magical sleep
actors.buffs.magicalsleep.toohealthy=You are too healthy, and resist the urge to sleep.
actors.buffs.magicalsleep.fallasleep=You fall into a deep magical sleep.
actors.buffs.magicalsleep.wakeup=You wake up feeling refreshed and healthy.
actors.buffs.magicalsleep.desc=This character has fallen into a deep magical sleep which they will not wake from naturally.\n\nMagical sleep is similar to regular sleep, except that only damage will cause the target to wake up.\n\nFor the hero and their allies, magical sleep has some restorative properties, allowing them to rapidly heal while resting.
actors.buffs.magicimmune.name=immune to magic
actors.buffs.magicimmune.desc=All magical effects have lost their hold on you, you are completely impervious to them.\n\nWhile magic immune all harmful and helpful magical effects will not apply to you, including curses, enchants, wands, scrolls, rings, artifacts, etc. Heroic armor abilities are strong enough to work regardless of this effect.\n\nTurns of magic immunity remaining: %s.
actors.buffs.overload.name=Overload
actors.buffs.overload.desc=The reality is overloaded. Prepare to cry, suffer, kill and slaughter.\n\nThe death of any hostile creature triggers the spawn of other creature.\n\nTurns of overload remaining: %s.
actors.buffs.mindvision.name=mind vision
actors.buffs.mindvision.desc=Somehow you are able to see all creatures on this floor through your mind. It's a weird feeling.\n\nAll characters on this floor are visible to you as long as you have mind vision. Seeing a creature through mind vision counts as it being seen or nearby for the purposes of many magical effects.\n\nTurns of mind vision remaining: %s.
actors.buffs.momentum.momentum=building momentum
actors.buffs.momentum.running=freerunning
actors.buffs.momentum.resting=recovering
actors.buffs.momentum.action_name=freerun
actors.buffs.momentum.momentum_desc=As he moves, the Freerunner builds momentum, which he can spend to start freerunning.\n\nEach charge of momentum grants two turns of freerunning, and the Freerunner can build up to 10 charges. Momentum is rapidly lost when the Freerunner stops moving.\n\nCurrent momentum charge: %d.
actors.buffs.momentum.running_desc=As he moves, the Freerunner builds momentum, which he can spend to start freerunning.\n\nWhile freerunning, the Freerunner moves at double speed and gains bonus evasion based on his level.\n\nTurns remaining: %d.
actors.buffs.momentum.resting_desc=As he moves, the Freerunner builds momentum, which he can spend to start freerunning.\n\nThe Freerunner needs time to regain his stamina before building momentum again.\n\nTurns remaining: %d.
actors.buffs.monkenergy.name=energy
actors.buffs.monkenergy.action=Monk Abilities
actors.buffs.monkenergy.desc=As she defeats enemies, the Monk gains energy that she can use on a variety of abilities. Most enemies grant 1 energy when defeated, and the Monk does not lose energy over time.\n\nCurrent energy: %1$d/%2$d.
actors.buffs.monkenergy.desc_cooldown=The Monk has recently used an ability, and must wait before using another.\n\nCurrent cooldown: %d turns.
actors.buffs.monkenergy$monkability$flurry.name=flurry of blows
actors.buffs.monkenergy$monkability$flurry.desc=Two instant strikes that deal %1$d-%2$d damage and ignore armor. This ability cannot be used repeatedly.
actors.buffs.monkenergy$monkability$flurry.empower_desc=Two instant strikes that deal %1$d-%2$d damage, ignore armor, _and use your weapon's enchantment._ This ability cannot be used repeatedly.
actors.buffs.monkenergy$monkability$focus.name=focus
actors.buffs.monkenergy$monkability$focus.desc=The Monk takes a turn to focus, letting her parry the next attack made against her.
actors.buffs.monkenergy$monkability$focus.empower_desc=The Monk _instantly focuses,_ letting her parry the next attack made against her.
actors.buffs.monkenergy$monkability$focus$focusbuff.name=focused
actors.buffs.monkenergy$monkability$focus$focusbuff.desc=The Monk is focused on her surroundings, anticipating the next attack made against her. While focused, she is guaranteed to parry the next incoming attack.
actors.buffs.monkenergy$monkability$dash.name=dash
actors.buffs.monkenergy$monkability$dash.prompt=Choose a Location
actors.buffs.monkenergy$monkability$dash.desc=An instant dash up to 4 tiles away. This ability can go over hazards, but not through enemies or solid terrain.
actors.buffs.monkenergy$monkability$dash.empower_desc=An instant dash up to _8 tiles_ away. This ability can go over hazards, but not through enemies or solid terrain.
actors.buffs.monkenergy$monkability$dragonkick.name=dragon kick
actors.buffs.monkenergy$monkability$dragonkick.desc=A devastating kick that deals %1$d-%2$d damage and ignores armor. The kick knocks the target away and paralyzes them for each tile they travel.
actors.buffs.monkenergy$monkability$dragonkick.empower_desc=A devastating kick that deals _%1$d-%2$d damage_ and ignores armor. The kick knocks _all adjacent targets_ away and paralyzes them for each tile they travel.
actors.buffs.monkenergy$monkability$meditate.name=meditate
actors.buffs.monkenergy$monkability$meditate.desc=The Monk focuses energy into her body for 5 turns. This clears most negative effects and grants her 8 turns of wand and artifact recharging.
actors.buffs.monkenergy$monkability$meditate.empower_desc=The Monk focuses energy into her body for 5 turns. This clears most negative effects and grants her 8 turns of wand and artifact recharging. _She also gains 80% damage resistance while meditating, and slowly heals for 20% of her missing HP._
actors.buffs.killevolution.name=kill counter
actors.buffs.killevolution.action=Kill Abilities
actors.buffs.killevolution.desc=As they defeat enemies, the hero gains energy that they can use on a variety of abilities. Most enemies grant 1 energy when defeated, and the hero does not lose energy over time.\n\n_However, unequipping a weapon associated with this buff associated with will lose all of this energy and you need to start killing enemies again_\n\nCurrent energy: %1$d/%2$d.
actors.buffs.killevolution.desc_cooldown=The hero has recently used an ability, and must wait before using another.\n\nCurrent cooldown: %d turns.
actors.buffs.killevolution$killevolutionability$invisibledash.name=invisible dash
actors.buffs.killevolution$killevolutionability$invisibledash.prompt=Choose a Location
actors.buffs.killevolution$killevolutionability$invisibledash.desc=An instant dash up to 4 tiles away with an additional turn of invisibility allowing the hero to surprise attack. This ability can go over hazards, but not through enemies or solid terrain.
actors.buffs.killevolution$killevolutionability$invisibledash.empower_desc=An instant dash up to _8 tiles_ away with an additional turn of invisibility allowing the hero to surprise attack. This ability can go over hazards, but not through enemies or solid terrain.
actors.buffs.killevolution$killevolutionability$physicallyempowered.name=physical empower
actors.buffs.killevolution$killevolutionability$physicallyempowered.desc=The hero grants itself +2 bonus damage for 10 hits.
actors.buffs.killevolution$killevolutionability$physicallyempowered.empower_desc=The hero grants itself _+4 bonus damage_ for 10 hits.
actors.buffs.killevolution$killevolutionability$weaponupgrade.name=weapon upgrade
actors.buffs.killevolution$killevolutionability$weaponupgrade.desc=The hero upgrades their weapon (and Duelist's second weapon if there's any) permanently.
actors.buffs.killevolution$killevolutionability$weaponupgrade.empower_desc=The hero upgrades their weapon (and Duelist's second weapon if there's any) _twice_ permanently.
actors.buffs.killevolution$killevolutionability$chain.name=chain enemy
actors.buffs.killevolution$killevolutionability$chain.desc=The hero chains an enemy to pull them in closer range.
actors.buffs.killevolution$killevolutionability$immortalize.name=immortalize
actors.buffs.killevolution$killevolutionability$immortalize.desc=The hero grants itself immortality against all sources of damage for 15 turns.
actors.buffs.killevolution$killevolutionability$immortalize.empower_desc=The hero grants itself immortality against all sources of damage for _~22 turns_.
actors.buffs.ooze.name=caustic ooze
actors.buffs.ooze.heromsg=Caustic ooze eats your flesh. Wash it away!
actors.buffs.ooze.ondeath=You melt away...
actors.buffs.ooze.rankings_desc=Dissolved
actors.buffs.ooze.desc=This sticky acid clings to flesh, slowly melting it away.\n\nOoze will deal consistent damage over time, but can be immediately washed off in water.\n\nTurns of ooze remaining: %s.
actors.buffs.paralysis.name=paralysed
actors.buffs.paralysis.heromsg=You are paralysed!
actors.buffs.paralysis.out=resisted paralysis
actors.buffs.paralysis.desc=Oftentimes the worst thing to do is nothing at all.\n\nParalysis completely halts all actions, forcing the target to wait until the effect wears off. The pain from taking damage can cause characters to resist paralysis, breaking them out of the effect.\n\nTurns of paralysis remaining: %s.
actors.buffs.physicalempower.name=physically empowered
actors.buffs.physicalempower.desc=Your blows have been empowered, increasing the amount of damage you can deal when you hit enemies with physical attacks.\n\nBonus damage: %1$d.\nHits remaining: %2$d.
actors.buffs.pincushion.name=pincushion
actors.buffs.pincushion.desc=The thrown weapons you have used against this character are currently stuck to them and will fall to the floor after they are defeated.\n\nThe following items are currently attached:
actors.buffs.poison.name=poisoned
actors.buffs.poison.heromsg=You are poisoned!
actors.buffs.poison.ondeath=You died from poison...
actors.buffs.poison.rankings_desc=Succumbed to Poison
actors.buffs.poison.desc=Poison works its way through the body, slowly impairing its internal functioning.\n\nPoison deals damage each turn proportional to how long until it expires.\n\nTurns of poison remaining: %s.
actors.buffs.preparation.name=preparation
actors.buffs.preparation.action_name=prepared strike
actors.buffs.preparation.desc=The Assassin is walking nervously, preparing to thurst knife into target.
actors.buffs.preparation.desc_dmg=His next attack will deal _%1$d%% bonus damage_, and will execute regular enemies below _%2$d%% health_, or bosses below _%3$d%% health_.
actors.buffs.preparation.desc_dmg_likely=The attack will also be more likely to deal a larger amount of damage.
actors.buffs.preparation.desc_blink=He is able to blink towards an enemy before striking them, with a max distance of _%d._
actors.buffs.preparation.desc_invis_time=The Assassin has been running for _%d turns._
actors.buffs.preparation.desc_invis_next=His attack will become stronger at _%d turns._
actors.buffs.preparation.prompt=Select a target to attack!\nMax blink distance: %d
actors.buffs.preparation.no_target=There's nothing to attack there.
actors.buffs.preparation.out_of_reach=That target is out of reach.
actors.buffs.preparation.assassinated=assassinated
actors.buffs.marked.name=Marked
actors.buffs.marked.desc=The Hunter is waiting patiently, preparing to strike while his bbat weakens enemies.
actors.buffs.marked.desc_dmg=The bbat deals %s%% more damage to this enemy. You will be able to jump to marked enemy at any moment, but more bonus damage means more debuffs.
actors.buffs.marked.prompt=Select a target to teleport!\nMax blink distance: your view distance
actors.buffs.marked.no_target=There's nothing to teleport there.
actors.buffs.marked.out_of_reach=That target is out of reach.
actors.buffs.marked.assassinated=assassinated
actors.buffs.marked.desc_poison=At this point, you will _poison_ a target, dealing damage over time.
actors.buffs.marked.desc_cripple=At this point, you will _cripple_ the legs of target, reducing its movement speed.
actors.buffs.marked.desc_blinding=At this point, you will also make target _blind_,reducing its field of view to 1 tile.
actors.buffs.marked.desc_bleeding=At this point, you will also make target _bleed_,dealing damage over time.
actors.buffs.marked.desc_vulnerable=At this point, you will also _increase physical damage_ to enemy.
actors.buffs.marked.desc_hexed=At this point, you will also stun target, _reducing its accuracy and dexterity_ for short time.
actors.buffs.marked.desc_slow=At this point, you will also disorientate target, _slowing_ its actions.
actors.buffs.marked.desc_ooze=At this point, you will also apply deadly _caustic ooze_ to target, dealing damage over time until target finds water.
actors.buffs.marked.desc_paralysis=At this point, you will completely _paralyse_ the enemy, rendering it unable to attack.
actors.buffs.marked.desc_doom=At this point, you will also curse the enemy, _significantly increasing any damage to it_.
actors.buffs.prismaticguard.name=prismatic Guard
actors.buffs.prismaticguard.desc=You are being guarded by a prismatic image which is currently inactive. When enemies are present the prismatic image will spring to action and protect you!\n\nWhile inactive, the prismatic image will steadily recover from any damage it has taken.\n\nCurrent HP: %d/%d.
actors.buffs.recharging.name=recharging
actors.buffs.recharging.desc=Energy is coursing through you, improving the rate that your wands and staffs charge.\n\nEach turn this buff will increase current charge by one quarter, in addition to regular recharge.\n\nTurns of recharging remaining: %s.
actors.buffs.revealedarea.name=revealed area
actors.buffs.revealedarea.desc=An area of the dungeon has been temporarily revealed to the hero, They will see it no matter where they are.\n\nTurns remaining: %s.
actors.buffs.revealedchar.name=revealed
actors.buffs.revealedchar.desc=This character is revealed to the hero, They will be visible no matter where they are.\n\nTurns remaining: %s.
actors.buffs.roots.name=rooted
actors.buffs.roots.heromsg=You can't move!
actors.buffs.roots.desc=Roots (magical or natural) grab at the feet, forcing them down to the ground.\n\nRoots lock a target in place, making movement and most movement abilities impossible. Other actions are not affected, including teleportation effects.\n\nTurns of root remaining: %s.
actors.buffs.scrollempower.name=scroll empower
actors.buffs.scrollempower.desc=The energy from the Mage's recently read scroll is empowering his wands!\n\nLevel Boost: +%1$d.\nZaps remaining: %2$d.
actors.buffs.shadows.name=shadowmelded
actors.buffs.shadows.desc=You are blended into the shadows around you, granting you invisibility and slowing your metabolism.\n\nWhile you are invisible enemies are unable to attack or follow you. Most physical attacks and magical effects (such as scrolls and wands) will immediately cancel invisibility. Additionally, while shadowmelded, your rate of hunger is slowed.\n\nYou will remain shadowmelded until you leave the shadows or an enemy comes into contact with you.
actors.buffs.slow.name=slowed
actors.buffs.slow.desc=Slowing magic affects the target's rate of time, to them everything is moving super-fast.\n\nA slowed character performs all actions in twice the amount of time they would normally take.\n\nTurns of slow remaining: %s.
actors.buffs.snipersmark.name=sniper's mark
actors.buffs.snipersmark.action_name_snapshot=snapshot
actors.buffs.snipersmark.action_name_volley=volley
actors.buffs.snipersmark.action_name_sniper=sniper shot
actors.buffs.snipersmark.desc=The Sniper is honed in on the target she most recently attacked. She is able to perform a special attack with her bow which will vary based on how the bow is augmented.\n\nAn unaugmented bow will fire a _snapshot,_ which deals reduced damage but does not take any time to fire.\n\nA bow augmented for speed will fire a _volley_ of three arrows. Each arrow will deal reduced damage, but can still activate enchantment. This volley takes 1 turn to shoot.\n\nA bow augmented for damage will fire a _sniper shot._ This shot is guaranteed to hit, deals bonus damage based on distance from the target, and takes 2 turns to fire.\n\nTurns remaining: %s.
actors.buffs.soulmark.name=soul marked
actors.buffs.soulmark.desc=The warlock has tapped into the soul of this creature, allowing him to heal as it takes physical damage.\n\nTurns of soul mark remaining: %s.
actors.buffs.stamina.name=stamina
actors.buffs.stamina.desc=You have unending stamina, allowing for faster movement!\n\nWhile under the effects of stamina you will run at +50%% speed, but will perform all other actions at normal speed.\n\nTurns of stamina remaining: %s.
actors.buffs.vulnerable.name=vulnerable
actors.buffs.vulnerable.heromsg=You feel fragile!
actors.buffs.vulnerable.desc=Vulnerability magic increases all physical damage that a character takes by 33%%, after that damage has been reduced by armor.\n\nTurns of vulnerable remaining: %s.
actors.buffs.terror.name=terrified
actors.buffs.terror.desc=Terror is manipulative magic which forces its target into an uncontrollable panic.\n\nTerrified characters are forced to run away from their opponent, trying to put as many doors and walls between them as possible. The shock of pain will lessen the duration of terror, however.\n\nTurns of terror remaining: %s.
actors.buffs.toxicimbue.name=imbued with toxicity
actors.buffs.toxicimbue.desc=You are imbued with poisonous energy!\n\nAs you move around toxic gas will constantly billow forth from you, damaging your enemies. You are immune to toxic gas and poison for the duration of the effect, as well as for a few turns afterward.\n\nTurns of toxic imbue remaining: %s.
actors.buffs.corrosion.name=corrosion
actors.buffs.corrosion.heromsg=You are melting!
actors.buffs.corrosion.ondeath=You melt away...
actors.buffs.corrosion.rankings_desc=Dissolved
actors.buffs.corrosion.desc=Powerful acid melts away flesh, metal, and bone at an alarming rate.\n\nCorrosion damage increases over time, as the target continues to melt away.\n\nTurns of corrosion remaining: %1$s.\nCurrent corrosion damage: %2$d.
actors.buffs.vertigo.name=vertigo
actors.buffs.vertigo.desc=Walking in a straight line can be difficult when the whole world is spinning.\n\nWhile under the effects of vertigo, characters who attempt to move will go in a random direction, instead of the one they intended to go in.\n\nTurns of vertigo remaining: %s.
actors.buffs.wandempower.name=wands empowered
actors.buffs.wandempower.desc=Your damage-dealing wands have been empowered, increasing the amount of damage they deal for a few hits.\n\nBonus damage: %1$d.\nHits remaining: %2$d.
actors.buffs.weakness.name=weakened
actors.buffs.weakness.heromsg=You feel weakened!
actors.buffs.weakness.desc=Everything suddenly seems much heavier.\n\nWeakening magic reduces a character's physical strength, causing them to deal 33%% reduced damage.\n\nTurns of weakness remaining: %s.
actors.buffs.wellfed.name=well fed
actors.buffs.wellfed.desc=You feel quite satisfied and full.\n\nWhile well fed, your hunger will not increase, and you will heal an additional amount of health over time.\n\nTurns remaining: %d.
actors.buffs.danceimmunebuff.name=immune to dance curse
actors.buffs.danceimmunebuff.desc=All dancing effects loses all its power for a short time, well extending the effect is not effective, you must wait for this effect to wear down before using the spell again.\n\nTurns of magic immunity remaining: %s.
actors.hero.abilities.armorability.self_target=You can't target yourself!
actors.hero.abilities.armorability.no_target=There's nothing to target there!
actors.hero.abilities.armorability.prompt=Choose a location to target
actors.hero.abilities.armorability.cost=Charge cost: _%d_
actors.hero.abilities.warrior.heroicleap.name=heroic leap
actors.hero.abilities.warrior.heroicleap.prompt=Choose direction to leap
actors.hero.abilities.warrior.heroicleap.short_desc=The Warrior performs a _Heroic Leap_ towards a targeted location, sailing above enemies and hazards.
actors.hero.abilities.warrior.heroicleap.desc=The Warrior leaps toward a targeted location, going over any enemies or hazards in the way. He cannot leap over walls or other solid terrain however.
actors.hero.abilities.warrior.shockwave.name=shockwave
actors.hero.abilities.warrior.shockwave.short_desc=The Warrior releases a _Shockwave_ in a conical AOE by slamming the ground. Enemies caught in the shockwave are damaged and crippled.
actors.hero.abilities.warrior.shockwave.desc=The Warrior slams the ground, producing a shockwave that travels up to 5 tiles in a 60 degree cone.\n\nEnemies caught in this shockwave are crippled for 5 turns. They also take 5-10 damage, plus an additional 1-2 damage for every point of strength the Warrior has above 10.
actors.hero.abilities.warrior.endure.name=endure
actors.hero.abilities.warrior.endure$enduretracker.name=endurance
actors.hero.abilities.warrior.endure$enduretracker.desc=The Warrior is now dealing bonus damage based on the damage he endured.\n\nBonus Damage: %1$d\nHits Left: %2$d
actors.hero.abilities.warrior.endure.short_desc=The Warrior _Endures_, skipping several turns but gaining high damage resistance. He then deals bonus damage based on what he endured.
actors.hero.abilities.warrior.endure.desc=The Warrior endures for 3 turns, taking half damage from all sources. This reduction is applied before damage resisting effects like armor.\n\nAfter enduring, the warrior's next hit within 10 turns gains bonus damage. This bonus damage is equal to half of all the damage inflicted on him while enduring, before any damage reduction effects!\n\nIf the Warrior has any combo, using this ability increases its remaining time by 3 turns.
actors.hero.abilities.mage.elementalblast.name=elemental blast
actors.hero.abilities.mage.elementalblast.no_staff=You can't use this ability without your staff.
actors.hero.abilities.mage.elementalblast.short_desc=The Mage emits an _Elemental Blast_ from his staff, covering a large area around him in an effect that varies based on the wand in his staff.
actors.hero.abilities.mage.elementalblast.desc=The Mage emits a blast of magic, which covers a circular region up to 4 tiles away and deals up to 15-25 damage. The specific effect of elemental blast will vary by the wand imbued in the Mage's staff.
actors.hero.abilities.mage.elementalblast.generic_desc=The effect of elemental blast will be similar to the effect of the wand when zapped at an enemy or ally.
actors.hero.abilities.mage.wildmagic.name=wild magic
actors.hero.abilities.mage.wildmagic.no_wands=You have no wands to zap with!
actors.hero.abilities.mage.wildmagic.short_desc=The Mage unleashes the _Wild Magic_ contained in his wands, randomly firing them multiple times at a chosen target over a single turn.
actors.hero.abilities.mage.wildmagic.desc=The Mage unleashes the power in his wands, randomly firing them up to 4 times in a single turn. The Mage's staff is not included in this effect.\n\nEach wand also has its level boosted by 2, up to +3. This ability uses half a wand charge for each zap, and no one wand can be fired more than 2 times.
actors.hero.abilities.mage.warpbeacon.name=warp beacon
actors.hero.abilities.mage.warpbeacon.depths=You can't warp between depths!
actors.hero.abilities.mage.warpbeacon.locked_floor=You cannot leave a locked floor!
actors.hero.abilities.mage.warpbeacon.too_far=That location is too far!
actors.hero.abilities.mage.warpbeacon.invalid_beacon=You can't place a beacon there!
actors.hero.abilities.mage.warpbeacon.window_desc=Your beacon is currently placed on floor %d.
actors.hero.abilities.mage.warpbeacon.window_tele=teleport to beacon
actors.hero.abilities.mage.warpbeacon.window_clear=clear beacon
actors.hero.abilities.mage.warpbeacon.window_cancel=cancel
actors.hero.abilities.mage.warpbeacon.short_desc=The Mage places a _Warping Beacon_ at his current location, which he can instantly teleport back to.
actors.hero.abilities.mage.warpbeacon.desc=The Mage places a beacon, which can then be warped to at will. Placing the beacon takes 1 turn, but warping to it is instantaneous.\n\nThe Mage cannot warp between floors by default, or use the beacon to reach inaccessible places such as locked rooms. The Mage can teleport into enemies, which will push them aside.
actors.hero.abilities.rogue.smokebomb.name=smoke bomb
actors.hero.abilities.rogue.smokebomb.fov=You can only jump to an empty location in your field of view
actors.hero.abilities.rogue.smokebomb.prompt=Choose a location to jump to
actors.hero.abilities.rogue.smokebomb$ninjalog.name=wooden decoy
actors.hero.abilities.rogue.smokebomb$ninjalog.desc=Somehow, enemies are easily convinced that this wooden decoy is the real Rogue!
actors.hero.abilities.rogue.smokebomb.short_desc=The Rogue throws down a _Smoke Bomb_ while blinking away. He blinds enemies near his old location.
actors.hero.abilities.rogue.smokebomb.desc=The Rogue throws down a smoke bomb and blinks up to 6 tiles away. He can blink through hazards and enemies, but not through solid terrain like walls.\n\nEnemies that are adjacent to the Rogue's old position will be blinded for 5 turns.
actors.hero.abilities.rogue.deathmark.name=death mark
actors.hero.abilities.rogue.deathmark.ally_target=You can only mark enemies
actors.hero.abilities.rogue.deathmark.short_desc=The Rogue places a _Death Mark_ on a chosen enemy. Marked enemies take bonus damage, but cannot die until the mark ends.
actors.hero.abilities.rogue.deathmark.desc=The Rogue places a mark on a chosen enemy, causing them to take 25% extra damage. The mark is applied instantly and lasts for 5 turns.\n\nMarked enemies take bonus damage but are unable to die until the mark expires. If an enemy has 0 HP when the mark ends, they will immediately die.
actors.hero.abilities.rogue.deathmark$deathmarktracker.name=marked for death
actors.hero.abilities.rogue.deathmark$deathmarktracker.desc=This enemy has been marked, causing them to take 25%% bonus damage, but also rendering them unable to die until the mark ends.\n\nTurns remaining: %s.
actors.hero.abilities.rogue.shadowclone.name=shadow clone
actors.hero.abilities.rogue.shadowclone.short_desc=The Rogue summons a _Shadow Clone_, which can be directed to aid him in combat.
actors.hero.abilities.rogue.shadowclone.desc=The Rogue summons a shadowy mimic of himself, which can be directed to aid him in combat. Directing the shadow clone does not cost any charge.\n\nThe clone has 80 HP, no armor, and deals 10-20 damage. All of these traits can be improved with talents, such that the clone benefits from weapons and armor the hero has.
actors.hero.abilities.rogue.shadowclone$shadowally.name=shadow rogue
actors.hero.abilities.rogue.shadowclone$shadowally.direct_defend=Your clone moves to that position.
actors.hero.abilities.rogue.shadowclone$shadowally.direct_follow=Your clone moves to follow you.
actors.hero.abilities.rogue.shadowclone$shadowally.direct_attack=Your clone moves to attack!
actors.hero.abilities.rogue.shadowclone$shadowally.desc=A copy of the Rogue, made from shadowy darkness. It stands stock still, with empty eyes and tiny wisps of darkness rising from it like steam.\n\nThe clone is not a perfect copy of the Rogue, but is still a decent fighter, and can benefit from the Rogue's equipment with the right talents.
actors.hero.abilities.huntress.spectralblades.name=spectral blades
actors.hero.abilities.huntress.spectralblades.short_desc=The Huntress throws _Spectral Blades_ at a target, inflicting damage depending on her currently equipped melee weapon.
actors.hero.abilities.huntress.spectralblades.desc=The Huntress throws out a spectral blade at an enemy, which acts like a ranged strike from her melee weapon. All of the normal effects of a melee weapon will activate, including enchantments.
actors.hero.abilities.huntress.naturespower.name=nature's power
actors.hero.abilities.huntress.naturespower.short_desc=The Huntress calls upon _Nature's Power_, increasing her movement speed and her bow's rate of fire for a short time.
actors.hero.abilities.huntress.naturespower.desc=The Huntress temporarily empowers herself and her bow with the power of nature! This lasts for 8 turns.\n\nDuring this time, the Huntress moves at 2x speed, and attacks 33% faster with her bow. The bonus bow effects do not trigger if the Sniper is using her special attacks.
actors.hero.abilities.huntress.naturespower$naturespowertracker.name=nature's power
actors.hero.abilities.huntress.naturespower$naturespowertracker.desc=The Huntress is briefly empowered, increasing her movement speed and attack speed with her bow.\n\nTurns remaining: %s.
actors.hero.abilities.huntress.spirithawk.name=spirit hawk
actors.hero.abilities.huntress.spirithawk.no_space=There is no free space near you.
actors.hero.abilities.huntress.spirithawk.short_desc=The Huntress summons a _Spirit Hawk_ familiar, which can help her scout locations and distract enemies.
actors.hero.abilities.huntress.spirithawk.desc=The Huntress summons a spirit hawk familiar, which can be directed by using the ability again while it is summoned. The hawk lasts for 100 turns, directing the hawk does not cost any charge.\n\nThe hawk has minimal health and attacking power, but is fast, evasive, and accurate. It shares its entire field of vision with the Huntress at all times. It is immune to all area-bound effects, such as fire and poison gas. It will not attack unless specifically directed to.
actors.hero.abilities.huntress.spirithawk$hawkally.name=spirit hawk
actors.hero.abilities.huntress.spirithawk$hawkally.direct_defend=Your hawk moves to that position.
actors.hero.abilities.huntress.spirithawk$hawkally.direct_follow=Your hawk moves to follow you.
actors.hero.abilities.huntress.spirithawk$hawkally.direct_attack=Your hawk moves to attack!
actors.hero.abilities.huntress.spirithawk$hawkally.desc=A magical hawk, summoned by the Huntress. It glows a bright ethereal blue, its head constantly shifts around as it surveys the area.\n\nWhile it isn't much of a fighter its speed and vision make it excellent for scouting and distracting enemies.
actors.hero.abilities.huntress.spirithawk$hawkally.desc_remaining=Turns remaining: %d.
actors.hero.abilities.huntress.spirithawk$hawkally.desc_dodges=Guaranteed dodges remaining: %d.
actors.hero.abilities.duelist.challenge.name=challenge
actors.hero.abilities.duelist.challenge.prompt=Choose an enemy to challenge
actors.hero.abilities.duelist.challenge.already_dueling=You can only be in one duel at a time.
actors.hero.abilities.duelist.challenge.ally_target=You can only challenge enemies.
actors.hero.abilities.duelist.challenge.unreachable_target=You must be able to reach your target.
actors.hero.abilities.duelist.challenge.distant_target=That enemy is too far away to challenge.
actors.hero.abilities.duelist.challenge.short_desc=The Duelist _Challenges_ a nearby enemy to a duel, temporarily freezing all other enemies.
actors.hero.abilities.duelist.challenge.desc=The Duelist challenges a nearby enemy to a duel. That enemy is compelled to fight her while all other enemies are temporarily frozen in time.\n\nThe target must be reachable and within 5 tiles of the Duelist. The duel lasts until 10 turns pass, the enemy dies, or the Duelist is more than 5 tiles away from the enemy.\n\nFrozen enemies are invulnerable. The Duelist's allies are not frozen by this ability, but if a boss is targeted its minions will not be frozen either.
actors.hero.abilities.duelist.challenge$duelparticipant.name=duel participant
actors.hero.abilities.duelist.challenge$duelparticipant.desc=This character is participating in a duel. They, and any of their allies or minions, are allowed to act normally while others are frozen.\n\nThe duel will last for a set amount of time, until one participant dies, or until the participants move more than 5 tiles away from eachother.\n\nTurns remaining: %d.
actors.hero.abilities.duelist.elementalstrike.name=elemental strike
actors.hero.abilities.duelist.elementalstrike.short_desc=The Duelist performs an _Elemental Strike_, spreading an effect in a conical AOE based on her weapon enchantment.
actors.hero.abilities.duelist.elementalstrike.desc=The Duelist strikes an enemy or location, performing a regular attack that's guaranteed to hit and spreading a magical effect that travels up to 4 tiles in a 65 degree cone. This magical effect varies based on the enchantment on the Duelist's primary weapon.
actors.hero.abilities.duelist.elementalstrike.generic_desc=An elemental strike with no enchantment will release a small burst of magic, dealing 6-12 damage to all enemies in range.
actors.hero.abilities.duelist.feint.name=feint
actors.hero.abilities.duelist.feint.prompt=Choose a location to dash to
actors.hero.abilities.duelist.feint.too_far=That location is not adjacent to you.
actors.hero.abilities.duelist.feint.bad_location=You can't move to that location.
actors.hero.abilities.duelist.feint.short_desc=The Duelist _Feints_, faking an attack while dashing to an adjacent tile. Enemies will attack her afterimage, leaving them open to a counterattack.
actors.hero.abilities.duelist.feint.desc=The Duelist fakes an attack while dashing to an adjacent tile, leaving behind a momentary afterimage of herself. Enemies that were attacking the Duelist will attack her afterimage instead.\n\nEnemies that attack the afterimage become confused, which cancels their next action and leaves them open to a surprise attack.
actors.hero.abilities.ratmogrify.name=ratmogrify
actors.hero.abilities.ratmogrify.cant_transform=You can't ratmogrify that!
actors.hero.abilities.ratmogrify.too_strong=That enemy is too strong to ratmogrify!
actors.hero.abilities.ratmogrify.short_desc=The hero _Ratmogrifies_ an enemy! This temporarily turns them into a rat with no abilities.
actors.hero.abilities.ratmogrify.desc=The hero transforms an enemy into a rat for 6 turns! Bosses, allies, and rats cannot be ratmogrified.\n\nRatmogrified enemies retain their original stats, but do not have any abilities.
actors.hero.abilities.ratmogrify$transmograt.name=ratmogrified %s
actors.hero.abilities.ratmogrify$transmograt.desc=This enemy has been transformed into a rat. A big improvement, if you ask me! - Rat King
actors.hero.abilities.ratmogrify$transmograt.rankings_desc=Slain by: ratmogrified enemy
actors.hero.abilities.ratking.legacywrath.name=divine fury
actors.hero.abilities.ratking.legacywrath.short_desc=I unleash my _Divine Fury_ upon my enemies. It leaves me exposed for a few turns and drains all my armor charge. Everything must come at price!
actors.hero.abilities.ratking.legacywrath.desc=I unlock the ability to channel overwhelming power. With it, I can blink to any nearby location no further than 6 tiles, blinding any enemies adjacent to my old location. Once there, I will cast a spell of magical earth on everyone I can see in 6 tiles area (the effect depends on talents) and create a fan of spectral blades targeting any mob within 6 tiles of me before turning invisible.\n\nThis ability takes 2 turns to leap, 1 turn to rooting earth, and one turn to spectral blades, though using this with no enemies in sight will skip the attacking.\n\nUnfortunately, _I have to use all of my armor charge or 33% of my current HP_ to get enough power for this ability.
