###blobs
actors.blobs.blizzard.name=badai salju
actors.blobs.blizzard.desc=Badai salju berhembus di sini.

actors.blobs.confusiongas.name=gas mabuk
actors.blobs.confusiongas.desc=Awan gas memabukkan berterbangan di sini.

actors.blobs.electricity.name=listrik
actors.blobs.electricity.desc=Medan listrik memercik dengan terang di sini.
actors.blobs.electricity.rankings_desc=Kesetrum
actors.blobs.electricity.ondeath=Kamu tersetrum sampai mati...

actors.blobs.fire.name=api
actors.blobs.fire.desc=Api berkobar di sini.

actors.blobs.foliage.name=dedaunan
actors.blobs.foliage.desc=Berkas cahaya menyinari taman bawah tanah yang suram.

actors.blobs.freezing.name=udara beku
actors.blobs.freezing.desc=Udara di sini dingin secara tidak wajar.

actors.blobs.goowarn.name=energi gelap
actors.blobs.goowarn.desc=Bintik-bintik energi gelap berkerumun di sini!

actors.blobs.inferno.name=kobaran api
actors.blobs.inferno.desc=Api neraka berkobar di sini.

actors.blobs.paralyticgas.name=gas pelumpuh
actors.blobs.paralyticgas.desc=Awan gas pelumpuh berterbangan di sini.

actors.blobs.regrowth.name=pertumbuhan kembali

actors.blobs.sacrificialfire.name=api pengorbanan
actors.blobs.sacrificialfire.desc=Di sini terdapat sebuah altar dengan api pengorbanan yang menyala di atasnya. Makhluk apa pun yang dibunuh di tempat ini akan dimakan oleh api sebagai persembahan kepada roh-roh terungku.\n\nMungkin akan ada hadiah diberikan jika cukup pengorbanan dilakukan?
actors.blobs.sacrificialfire.worthy=Api melahap persembahan kamu dan makin membara.
actors.blobs.sacrificialfire.unworthy=Api melahap persembahan kamu, tapi tidak ada yang berubah.
actors.blobs.sacrificialfire.reward=Api semakin membara lalu menghilang, meninggalkan sebuah hadiah!

actors.blobs.smokescreen.name=kepulan asap
actors.blobs.smokescreen.desc=Asap hitam tebal berterbangan di sini.

actors.blobs.stenchgas.name=gas busuk
actors.blobs.stenchgas.desc=Awan bau busuk berterbangan di sini.

actors.blobs.stormcloud.name=awan badai
actors.blobs.stormcloud.desc=Awan uap air yang mengepul berterbangan di sini.

actors.blobs.toxicgas.name=gas beracun
actors.blobs.toxicgas.desc=Awan racun kehijauan berterbangan di sini.
actors.blobs.toxicgas.rankings_desc=Tercekik
actors.blobs.toxicgas.ondeath=Kamu mati karena gas beracun...

actors.blobs.corrosivegas.name=gas korosif
actors.blobs.corrosivegas.desc=Awan gas kaustik mematikan berterbangan di sini.

actors.blobs.waterofawareness.name=air pengetahuan
actors.blobs.waterofawareness.procced=Sesaat setelah kamu meneguknya, kamu merasa pengetahuan membanjiri pikiranmu.
actors.blobs.waterofawareness.desc=Kekuatan pengetahuan memancar dari air dalam sumur ini. Minum dari sumur ini bisa mengidentifikasi item yang dipakai, mengidentifikasi kutukan pada semua item di perlengkapanmu, dan mengungkap semua item yang berada di lantai ini.

actors.blobs.waterofhealth.name=air penyembuhan
actors.blobs.waterofhealth.procced=Ketika kamu meneguknya, kamu merasa lukamu sembuh total.
actors.blobs.waterofhealth.desc=Kekuatan kesehatan memancar dari air dalam sumur ini. Minum dari sumur ini bisa menyembuhkan lukamu, menghilangkan lapar, dan menghapus kutukan dari semua item yang sedang dipakai.

actors.blobs.web.name=jaring laba-laba
actors.blobs.web.desc=Jaring tebal menutupi semuanya di sini. Semua yang menyentuh jaring itu akan merusak jaringnya, dan juga akan terjebak di tempat.



###buffs
actors.buffs.adrenaline.name=adrenalin
actors.buffs.adrenaline.desc=Lonjakan kekuatan fisik, adrenalin meningkatkan kecepatan serangan dan gerakan.\n\nAdrenalin membuat target dapat berlari 2x lebih cepat, dan menyerang 1.5x lebih cepat.\n\nGiliran tersisa: %s.

actors.buffs.adrenalinesurge.name=tambahan kekuatan
actors.buffs.adrenalinesurge.desc=Lonjakan kekuatan yang besar, tetapi sayangnya tidak permanen.\n\nTambahan kekuatan: +%d.\nGiliran sampai tambahan melemah: %s.

actors.buffs.amok.name=amuk
actors.buffs.amok.desc=Amuk menyebabkan amarah hebat dan kebingungan pada targetnya.\n\nSaat musuh mengamuk, mereka akan menyerang siapapun, tak peduli apakah itu kawan atau lawan.\n\nGiliran amuk tersisa : %s.

actors.buffs.arcanearmor.name=armor sihir
actors.buffs.arcanearmor.desc=Pelindung tipis mengelilingimu, menahan beberapa damage dari serangan sihir.\n\nArmor magismu saat ini ditingkatkan sebesar: 0-%d.\n\nGiliran sampai armor sihir melemah: %s.

actors.buffs.artifactrecharge.name=mengisi ulang artefak
actors.buffs.artifactrecharge.desc=Energi mengalir di tubuhmu, meningkatkan kecepatan pengisian daya artefak yang kamu pakai.\n\nPengaruhnya akan berbeda-beda pada setiap artefak, tapi semuanya akan mendapat daya jauh lebih cepat dari biasanya..\n\nGiliran tersisa: %s.

actors.buffs.ascensionchallenge.name=kutukan jimat
actors.buffs.ascensionchallenge.desc=Entah bagaimana Yog-Dzewa mempertahankan pengaruhnya di dunia ini melalui jimat, dan berusaha untuk menghentikanmu naik!\n\nKekuatan Yog membuat terungku lebih berbahaya, memperbanyak musuh dan memperkuat mereka! Kekuatan ini akan semakin kuat jika dibiarkan, kekuatan ini bisa dilemahkan dengan mengalahkan musuh yang telah diperkuat kekuatan Yog.
actors.buffs.ascensionchallenge.desc_clear=Energi gelap yang terpancar dari jimat ini telah dilemahkan untuk sementara.
actors.buffs.ascensionchallenge.desc_beckon=Jimat tersebut saat ini _memanggil musuh yang jauh,_ mengingatkan mereka akan posisimu.
actors.buffs.ascensionchallenge.desc_haste=Jimat tersebut saat ini _meningkatkan kecepatan pada musuh yang jauh,_ memungkinkan mereka mengejarmu dengan lebih cepat!
actors.buffs.ascensionchallenge.desc_slow=Jimat tersebut saat ini  _memperlambatmu,_ dan meniadakan efek peningkatan kecepatan!
actors.buffs.ascensionchallenge.desc_damage=Energi dari jimat tersebut menjadi sangat kuat sehingga _langsung melukaimu!_
actors.buffs.ascensionchallenge.beckon=Jimat tersebut mulai memanggil musuh yang jauh.
actors.buffs.ascensionchallenge.haste=Jimat tersebut mulai menambah kecepatan musuh yang jauh!
actors.buffs.ascensionchallenge.slow=Jimat tersebut mulai terasa seperti beban di inventaris kamu!
actors.buffs.ascensionchallenge.damage=Jimat tersebut mulai memancarkan energi gelap. Itu membara!
actors.buffs.ascensionchallenge.weaken_info=Kutukan jimat dapat dilemahkan dengan mengalahkan lebih banyak musuh.
actors.buffs.ascensionchallenge.weaken_info_no_kills=Jika Kamu mengalahkan musuh, kutukan jimat akan melemah!
actors.buffs.ascensionchallenge.weaken=Kamu bisa merasakan kutukan jimat sedikit melemah.
actors.buffs.ascensionchallenge.break=Kamu meluangkan waktu untuk mengatur nafas dan merasakan bahwa lukamu mulai tertutup!
actors.buffs.ascensionchallenge.almost=Kamu merasa cengkraman Yog pada jimat mulai melemah, kamu hampir sampai!
actors.buffs.ascensionchallenge.on_kill=Energi gelap melahapmu...

actors.buffs.barkskin.name=kulit kayu
actors.buffs.barkskin.desc=Kulitmu mengeras, rasanya kasar dan padat seperti kulit kayu.\n\nKulit yang mengeras ini meningkatkan armor efektif kamu, membuatmu dapat pertahanan yang lebih baik dari serangan fisik.\n\nArmor kamu saat ini ditingkatkan sebesar: 0-%d.\nGiliran sampai kulit kayu melemah: %s.\n\nJika kamu mendapatkan kulit kayu dari berbagai sumber, hanya yang terkuat yang digunakan.

actors.buffs.barrier.name=penghalang
actors.buffs.barrier.desc=Gelembung kuat yang menahan semua damage.\n\nPenahan ini akan menyerap semua damage bagi sesuatu yang ada di dalamnya selama masih ada penahan yang tersisa. Perisai juga akan menghilang secara perlahan seiring waktu.\n\nPerisai tersisa: %d .

actors.buffs.berserk.angered=marah
actors.buffs.berserk.berserk=mengamuk
actors.buffs.berserk.exhausted=kelelahan
actors.buffs.berserk.recovering=pemulihan
actors.buffs.berserk.angered_desc=Parahnya luka Berserker memperkuat pukulannya. Saat berserker menerima damage fisik, kemarahannya akan meningkat, memberinya damage bonus. Damage yang ditahan oleh armor masih diperhitungkan dalam membangun kemarahan.\n\nKemarahan akan memudar seiring waktu. Semakin rendah kesehatan berserker, semakin lama bertahan.\n\nPada 100 %%kemarahan, Berserker akan mengamuk, memberinya perisai berdasarkan level armor dan HP yang hilang. Saat mengamuk, perisainya akan berkurang seiring waktu dan setelah habis, dia harus beristirahat sebelum membangun amarah lagi.\n\nKemarahan Saat Ini_%1$.0f%%_\n_+%2$.0f%%_damage\n\nPerisai mengamuk pada armor dan HP saat ini: _%3$d_
actors.buffs.berserk.berserk_desc=Rasa takut dan ketidakpastian hilang, hanya menyisakan kemarahan. Dalam keadaan ini Berserker sangat kuat, _memberikan+50%% damage dan mendapatkan perlindungan bonus,_ namun perisai akan hilang setiap giliran.\n\nKetika seluruh perisainya berkurang hingga 0, mengamuk akan berakhir.\n\nSetelah mengamuk, Berserker perlu pulih sebelum bisa membangun kemarahan lagi.\n\nPerisai tersisa: %d
actors.buffs.berserk.recovering_desc=Kekuatan dari dalam ada batasnya. Berserker harus beristirahat sebelum menggunakan kemarahannya lagi.\n\nSaat waktu pemulihan Berserker tidak akan membangun kemarahan apa pun dari menerima damage.
actors.buffs.berserk.recovering_desc_turns=Giliran hingga pulih: _%d_
actors.buffs.berserk.recovering_desc_levels=Level hingga pulih: _%.2f_
actors.buffs.berserk.rankings_desc=Mengamuk sampai Mati
actors.buffs.berserk.action_name=Mengamuk
actors.buffs.berserk.no_seal=Kamu membutuhkan segel rusakmu untuk mengamuk!

actors.buffs.bleeding.name=berdarah
actors.buffs.bleeding.ondeath=Kamu berdarah sampai mati...
actors.buffs.bleeding.heromsg=Kamu berdarah!
actors.buffs.bleeding.rankings_desc=Berdarah sampai Mati
actors.buffs.bleeding.desc=Luka itu mengakibatkan darah bercucuran dengan jumlah yang mengkhawatirkan.\n\nPendarahan mengakibatkan damage setiap giliran. Setiap giliran damage itu berkurang secara acak, sampai pendarahan benar-benar berhenti.\n\nDamage pendarahan sekarang: %d.

actors.buffs.bless.name=diberkati
actors.buffs.bless.desc=Ledakan fokus yang besar, konon ini terinspirasi dari para Dewa.\n\nBerkat meningkatkan akurasi dan hindaran sebesar 25%%, membuat berkat ini lebih efektif dalam serangan.\n\nGiliran berkat tersisa: %s.

actors.buffs.blindness.name=dibutakan
actors.buffs.blindness.heromsg=Kamu dibutakan!
actors.buffs.blindness.desc=Kebutaan mengubah dunia sekitar menjadi kabut gelap.\n\nSaat dibutakan, jarak penglihatan karakter berkurang menjadi satu petak, membuat serangan jarak jauh tidak berguna dan membuatnya sangat mudah kehilangan jejak musuh yang jauh. Selain itu, pahlawan yang buta tidak bisa membaca gulungan atau buku.\n\nGiliran kebutaan tersisa: %s.

actors.buffs.buff.heromsg=

actors.buffs.burning.name=terbakar
actors.buffs.burning.heromsg=Kamu terbakar!
actors.buffs.burning.burnsup=%s terbakar!
actors.buffs.burning.ondeath=Kamu terbakar sampai mati...
actors.buffs.burning.rankings_desc=Terbakar sampai menjadi Abu
actors.buffs.burning.desc=Hanya sedikit hal yang lebih memakan daripada dilalap api. \n\nApi akan memberikan kerusakan setiap putaran hingga padam oleh udara atau habis. Api dapat dipadamkan dengan melangkah ke dalam udara, atau dengan cipratan ramuan penghancur. \n\nSelain itu, api dapat menyulut medan atau benda mudah terbakar yang bersentuhan dengannya. \n\nGiliran pembakaran yang tersisa:1%s.

actors.buffs.championenemy.warn=Kamu merasakan keberadaan yang mematikan.
actors.buffs.championenemy$blazing.name=jagoan berkobar
actors.buffs.championenemy$blazing.desc=Jagoan berkobar menimbulkan 25% lebih banyak damage jarak dekat, membakar musuh yang diserang, kebal terhadap api, dan menyebarkan api ke sekeliling mereka saat mereka mati. Namun mereka tidak bisa menyebarkan api ke dalam air.
actors.buffs.championenemy$projecting.name=jagoan proyeksi
actors.buffs.championenemy$projecting.desc=Jagoan proyeksi menghasilkan 25% lebih banyak damage jarak dekat dan memiliki +3 jangkauan serangan.
actors.buffs.championenemy$antimagic.name=jagoan anti sihir
actors.buffs.championenemy$antimagic.desc=Jagoan anti sihir menerima 50% lebih sedikit damage dan sepenuhnya kebal terhadap efek sihir.
actors.buffs.championenemy$giant.name=jagoan raksasa
actors.buffs.championenemy$giant.desc=Jagoan raksasa menerima 80% lebih sedikit damage dan memiliki jangkauan serangan +1, namun tidak dapat bergerak melalui ruang tertutup.
actors.buffs.championenemy$blessed.name=jagoan suci
actors.buffs.championenemy$blessed.desc=Jagoan suci memiliki 4x akurasi dan penghindaran.
actors.buffs.championenemy$growing.name=jagoan pertumbuhan
actors.buffs.championenemy$growing.desc=Jagoan pertumbuhan secara berkala mendapatkan bonus akurasi, penghidaran, serangan fisik, dan pengurangan damage yang diterima.\n\nPeningkatan akurasi/penghindaran/tambahan damage saat ini:%1$d%%\nPengurangan damage saat ini: %2$d%%

actors.buffs.charm.name=terpesona
actors.buffs.charm.heromsg=Kamu terpesona!
actors.buffs.charm.cant_attack=Kamu terpesona oleh musuh itu dan tidak bisa menyerangnya.
actors.buffs.charm.desc=Terpesona adalah sihir manipulatif yang dapat membuat musuh mengagumi satu sama lain.\n\nKarakter yang terkena efek terpesona tidak dapat menyerang musuh yang membuat mereka terpesona secara langsung, sehingga menyerang target lain masih memungkinkan. Kejutan rasa sakit akan mengurangi durasi terpesona.\n\nGliran terpesona tersisa: %s.

actors.buffs.chill.name=kedinginan
actors.buffs.chill.freezes=%s membeku!
actors.buffs.chill.desc=Tidak membeku, tapi tetap saja sangat dingin.\n\nTarget yang kedinginan akan melakukan sesuatu lebih lambat, tergantung seberapa banyak giliran lagi efeknya. Seburuk-buruknya efek ini sama seperti perlambatan.\n\nGiliran kedinginan tersisa: %1$s.\nKecepatan berkurang sebanyak: %2$s%%

actors.buffs.combo.name=kombo
actors.buffs.combo.action_name=serangan kombo
actors.buffs.combo.combo=%d kali kombo
actors.buffs.combo.bad_target=Kamu harus menargetkan musuh dalam jarak serang.
actors.buffs.combo.prompt=Pilih target untuk diserang
actors.buffs.combo.desc=gladiator membangun momentum ketika dia berhasil memukul lawan. setiap serangan meningkatkan angka kombo sebanyak 1, tapi jeda yang terlalu lama diantara serangan akan mereset hitungan kombo menjadi 0. ketika gladiator mempunyai kombo setiap perisai yang dia dapat dari broken seal tidak akan perlahan hilang.\n\n\nmembangun kombo membuka serangan kombo spesial yang tidak bisa meleset! serangan yang berbeda dibuka ketika 2, 4, 6, 8, dan 10 kombo. beberapa gerakan mereset kombo dan beberapa tidak, tapi setiap gerakan hanya bisa digunakan selama sesi per-kombo.\n\nkombo saat ini: %1$d \n\naksi sampai kombo menghilang: %2$s
actors.buffs.combo$combomove.clobber.name=menyerang dari udara
actors.buffs.combo$combomove.clobber.desc=Mendorong musuh ke belakang sebanyak 2 petak, tetapi tidak menimbulkan damage dan tidak dapat menjatuhkan musuh ke dalam lubang. Menaikkan kombo sebesar 1.
actors.buffs.combo$combomove.clobber.empower_desc=Mendorong musuh sejauh _3 petak, menimbulkan efek pusing, dan bisa mendorong ke jurang,_ namun tidak menimbulkan damage.  Menambah kombo sebanyak 1.
actors.buffs.combo$combomove.slam.name=membanting
actors.buffs.combo$combomove.slam.desc=Menimbulkan %d %% (kombo*20%%) dari damage yang kamu tahan sebagai damage bonus. Mengulang kombo saat digunakan.
actors.buffs.combo$combomove.slam.empower_desc=_Melompat hingga %1$d petak_ dan menyebabkan %2$d%% (kombo*20%%) dengan pertahanan damage kamu sebagai damage bonus. Mengulang kombo saat digunakan.
actors.buffs.combo$combomove.parry.name=menangkis
actors.buffs.combo$combomove.parry.desc=Memblokir serangan berikutnya dalam 1 giliran ketika diaktifkan, dan langsung membalasnya. Mengulang kombo jika tidak ada yang ditangkis.
actors.buffs.combo$combomove.parry.empower_desc=Memblokir _semua serangan_ dalam 1 giliran saat diaktifkan, dan langsung membalasnya. Mengulang kombo jika tidak ada yang ditangkis.
actors.buffs.combo$combomove.crush.name=menghancurkan
actors.buffs.combo$combomove.crush.desc=Menimbulkan damage sebesar %d%% (kombo*25%%) pada target utama, dan setengah damage tersebut kepada semua musuh lainnya dalam efek area 7x7. Mengulang kombo saat digunakan.
actors.buffs.combo$combomove.crush.empower_desc=_Melompat hingga %1$d petak_ dan menimbulkan %2$d%% (kombo*25%%) damage pada target utama, dan setengah damage tersebut pada semua musuh lainnya dalam efek area 7x7. Mengulang kombo saat digunakan.
actors.buffs.combo$combomove.fury.name=mengamuk
actors.buffs.combo$combomove.fury.desc=Memukul musuh satu kali untuk setiap kombo yang kamu miliki, setiap pukulan menghasilkan 60% damage dan dapat memicu enchantment. Mengulang kombo saat digunakan.
actors.buffs.combo$combomove.fury.empower_desc=_Melompat hingga %d petak_ dan mengenai musuh satu kali untuk setiap kombo yang kamu miliki, setiap pukulan menimbulkan 60%% damage dan dapat memicu enchantment. Mengulang kombo saat digunakan.

actors.buffs.corruption.name=dirusak
actors.buffs.corruption.desc=Korupsi menyerap ke dalam inti makhluk hidup, memutarbalikkan sifat asli mereka.\n\nMakhluk yang dirusak akan menyerang teman mereka, dan mengabaikan musuh sebelumnya. Korupsi juga memberikan damage, dan akan perlahan membuat target tidak tahan.\n\nKorupsi ini permanen, efeknya hanya akan hilang saat mati.

actors.buffs.cripple.name=pincang
actors.buffs.cripple.heromsg=Kamu pincang!
actors.buffs.cripple.desc=Kamu cukup yakin kaki tidak dimaksudkan untuk ditekuk seperti itu.\n\nMelumpuhkan separuh kecepatan gerak, membuat berpindah petak biasanya membutuhkan dua giliran, bukan satu.\n\nSisa waktu pincang: %s giliran.

actors.buffs.daze.name=linglung
actors.buffs.daze.heromsg=Kamu linglung!
actors.buffs.daze.desc=Telinga berdenging dan pandangan kabur membuat pertarungan menjadi sulit.\n\nSaat linglung, akurasi dan penghindaran berkurang 50%%, membuat serangan mendarat dan menghindari pukulan menjadi lebih sulit.\n\nGiliran linglung tersisa:%s.

actors.buffs.degrade.name=terdegradasi
actors.buffs.degrade.heromsg=Peralatanmu terasa melemah!
actors.buffs.degrade.desc=Sihir hitam yang kuat telah melemahkan kekuatan yang telah diberikan oleh gulungan peningkatan di perlengkapanmu!.\n\nKetika terdegradasi, perlengkapan yang ditingkatkan akan dianggap seolah-olah mempunyai level lebih rendah dari biasanya. _Setiap peningkatan setelah +3 menjadi semakin lebih lemah dari sebelumnya._ Deskripsi barangmu akan berubah untuk mencerminkan pengurangan kekuatan levelnya.\n\nDegradasi tidak mempengaruhi kekuatan yang dibutuhkan, daya tongkat sihir, daya tahan senjata lempar, atau artefak.\n\nGiliran degradasi tersisa: %s. Menggunakan gulungan peningkatan atau penghapus kutukan akan langsung mengakhiri durasi degradasi.

actors.buffs.doom.name=ditakdirkan mati
actors.buffs.doom.desc=Sulit untuk terus berjalan ketika alam semesta sepertinya ingin kamu mati.\n\nKarakter yang ditakdirkan mati akan menerima +67% damage dari semua sumber\n\nEfek ini bersifat permanen, efeknya hanya berakhir dengan kematian.

actors.buffs.dread.name=ketakutan
actors.buffs.dread.desc=Teror maha dahsyat yang membuat targetnya kabur dari terungku!\n\nMakhluk yang ketakutan akan lari terbirit-birit dari lawan, dan akan kabur dari terungku saat mereka tak terlihat. Musuh yang dikalahkan dengan cara ini memberikan setengah pengalaman dan tidak menjatuhkan item. Kejutan dari rasa sakit akan mengurangi durasi ketakutan.\n\nGiliran ketakutan tersisa : %d

actors.buffs.drowsy.name=mengantuk
actors.buffs.drowsy.desc=Kekuatan sihir membuat sulit untuk tetap bangun,setelah beberapa giliran, target akan terjatuh dalam tidur lelap magis.\n\nPahlawan dapat menahan kantuk dengan menerima damage atau dengan memiliki kesehatan penuh.\n\nGiliran sampai tertidur: %s.

actors.buffs.earthimbue.name=dijiwai dengan tanah
actors.buffs.earthimbue.desc=Kamu dijiwai dengan kekuatan tanah!\n\nSemua serangan fisik akan menggeser tanah di bawah musuh, melumpuhkan mereka untuk waktu yang singkat.\n\nGiliran jiwa tanah tersisa: %s.

actors.buffs.enhancedrings.name=peningkatan cincin
actors.buffs.enhancedrings.desc=Artefak yang baru saja digunakan oleh Pengembara meningkatkan kekuatan cincin yang dipakai olehnya, memberikan tambahan level +1\n\nGiliran tersisa:%s.

actors.buffs.fireimbue.name=dijiwai dengan api
actors.buffs.fireimbue.desc=Kamu dijiwai dengan kekuatan api!\n\nSemua serangan fisik memiliki peluang untuk membuat musuhmu terbakar. Ditambah, kamu kebal terhadap api.\n\nGiliran jiwa api tersisa: %s.

actors.buffs.foresight.name=mata batin
actors.buffs.foresight.desc=Entah bagaimana kamu dapat melihat tata ruang di sekitarmu dengan kekuatan pikiranmu.\n\nKetika sedang dalam efek mata batin, semua petak dalam radius yang luas akan terlihat, termasuk segala jebakan dan pintu rahasia.\n\nGiliran mata batin tersisa: %s

actors.buffs.frost.name=membeku
actors.buffs.frost.freezes=%s membeku!
actors.buffs.frost.desc=Dia membeku, membeku dalam es yang padat dan dingin.\n\nMembeku mempunyai efek serupa dengan kelumpuhan, membuat target mustahil untuk bergerak. Tapi tak seperti kelumpuhan, membeku akan segera hilang jika terkena serangan karena esnya tentu akan pecah.\n\nGiliran membeku tersisa: %s.

actors.buffs.frostimbue.name=dijiwai dengan es
actors.buffs.frostimbue.desc=Kamu dijiwai dengan kekuatan es!\n\nSemua serangan fisik akan terus membuat musuh kedinginan. Selain itu, kamu benar-benar kebal dengan hawa dingin.\n\nGiliran jiwa es tersisa: %s.

actors.buffs.fury.name=sangat marah
actors.buffs.fury.heromsg=Kamu menjadi sangat marah!
actors.buffs.fury.desc=Kamu marah, musuh tidak akan suka saat kamu marah.\n\nKemarahan besar membara dalam dirimu, meningkatkan kekuatan fisikmu sebanyak 50%%.\n\nKemarahan ini akan bertahan selama kamu terluka di bawah 50%% darah.

actors.buffs.blobimmunity.name=penghalang pemurnian
actors.buffs.blobimmunity.desc=Kekuatan yang aneh menyelubungimu dengan penghalang tipis yang protektif, menahan semua efek berbahaya yang ada di udara.\n\nKamu kebal terhadap semua efek yang berarea selama penghalang ini ada.\n\nGiliran kekebalan tersisa: %s.

actors.buffs.gravitychaostracker.name=kekacauan gravitasi
actors.buffs.gravitychaostracker.desc_intro=Setiap beberapa giliran, semua karakter di lantai terungku saat ini akan dilempar ke arah acak.
actors.buffs.gravitychaostracker.desc_positive=Kamu dan sekutumu tampaknya kebal.
actors.buffs.gravitychaostracker.desc_duration=Tidak jelas berapa lama efeknya akan bertahan, tetapi tidak akan bertahan selamanya.

actors.buffs.greaterhaste.name=Kecepatan yang lebih besar
actors.buffs.greaterhaste.desc=Sebuah peningkatan kecepatan yang luar biasa, untuk sesaat rasanya seolah-olah segala hal telah berhenti.\n\nSaat dibawah efek kecepatan yang luar biasa, bergerak tidak akan memakan waktu sama sekali, namun aksi lainnya masih dilakukan pada kecepatan normal. Setiap langkah akan menghabiskan giliran dari kecepatan luar biasa.\n\nGiliran kecepatan luar biasa tersisa: %d.

actors.buffs.haste.name=kecepatan
actors.buffs.haste.desc=Energi mengalir dalam otot-ototmu, membuatmu dapat berlari dalam kecepatan yang luar biasa!\n\nSaat berada dalam efek kecepatan kamu akan berlari 3x kecepatan, tapi akan melakukan tindakan lain dengan kecepatan normal.\n\nGiliran kecepatan tersisa: %s.

actors.buffs.healing.name=penyembuhan
actors.buffs.healing.desc=Obat ajaib menyebabkan luka menutup dan daging menyatu.\n\nDarah akan terus beregenerasi setiap giliran sampai efek penyembuhan berakhir. Jumlah penyembuhan mungkin memudar seiring waktu.\n\nPenyembuhan berikutnya: %d\n\nPenyembuhan tersisa: %d.

actors.buffs.herodisguise.name=Penyamaran
actors.buffs.herodisguise.desc=Sebuah sihir ilusi telah merubah penampilan fisikmu! Efek ini hanyalah kosmetik, tapi rasanya tetap aneh.\n\nJumlah giliran penyamaran tersisa: %s.

actors.buffs.hex.name=dikutuk
actors.buffs.hex.heromsg=Kamu telah dikutuk!
actors.buffs.hex.desc=Sihir hitam yang melemahkan fokus, menyebabkan target sedikit bingung.\n\nKutukan mengurangi akurasi dan penghindaran sebanyak 20%%, menyebabkan target kurang efektif dalam pertarungan.\n\nGiliran kutukan tersisa: %s.

actors.buffs.holdfast.name=tahan posisi
actors.buffs.holdfast.desc=Pendekar sedang menahan posisinya, meningkatkan armornya sebesar %1$d-%2$d dan memperlambat laju peluruhan beberapa buff sebesar %3$d%%. Ini akan berlangsung hingga ia bergerak.

actors.buffs.hunger.hungry=lapar
actors.buffs.hunger.starving=kelaparan
actors.buffs.hunger.onhungry=Kamu lapar.
actors.buffs.hunger.onstarving=Kamu kelaparan!
actors.buffs.hunger.ondeath=Kamu mati kelaparan...
actors.buffs.hunger.cursedhorn=Terompet terkutuk mencuri sebagian energi makanan yang kamu makan.
actors.buffs.hunger.rankings_desc=Mati Kelaparan
actors.buffs.hunger.desc_intro_hungry=Kamu merasakan perutmu meminta makanan, tapi belum terlalu mendesak.
actors.buffs.hunger.desc_intro_starving=Kamu kelaparan sampai kesakitan.
actors.buffs.hunger.desc=\n\nRasa lapar lama-lama meningkat selama kamu menghabiskan waktu di terungku, pada akhirnya kamu mulai kelaparan. Saat kelaparan, kamu perlahan akan kehilangan darah alih-alih memulihkannya.\n\nPenjatahan makanan itu penting! Jika kamu memiliki darah yang tersisa kelaparan bukanlah ide yang buruk jika itu berarti akan ada lebih banyak makanan menanti. Penjatahan makanan yang efektif dapat membuat makanan bertahan lebih lama!

actors.buffs.invisibility.name=tembus pandang
actors.buffs.invisibility.desc=Kamu benar-benar berbaur dengan lingkungan sekitar, membuatmu mustahil terlihat.\n\nSaat kamu tembus pandang musuh tidak dapat menyerang atau mengikutimu. Serangan fisik atau efek sihir (seperti gulungan dan tongkat sihir) akan segera membatalkan tembus pandang.\n\nGiliran tembus pandang tersisa: %s.

actors.buffs.invulnerability.name=Kebal
actors.buffs.invulnerability.desc=Karakter ini telah diselimuti kekuatan pertahanan yang hebat, membuat mereka kebal dalam waktu yang singkat!\n\nGiliran tersisa: %s.

actors.buffs.levitation.name=melayang
actors.buffs.levitation.desc=Kekuatan magis melayangkanmu ke atas tanah, membuatmu merasa tanpa beban.\n\nKarakter melayang bergerak tanpa suara dan mengabaikan semua efek yang terjadi di tanah. Perangkap tidak akan terpicu, air tidak akan memadamkan api, tanaman tidak akan terinjak, tidak bisa tertanam, dan akan melayang di atas lubang. Berhati-hatilah, karena semua hal ini dapat terjadi saat melayang berakhir!\n\nGiliran melayang tersisa: %s.

actors.buffs.lifelink.name=ikatan kehidupan
actors.buffs.lifelink.ondeath=Damage dari ikatan kehidupan membunuhmu...
actors.buffs.lifelink.desc=Inti kehidupan karakter ini terikat pada karakter lain di dekatnya. Semua jenis damage yang diterima satu karakter akan diterima oleh karakter lain juga.\n\nSetiap kali karakter ini menerima damage, setengah damage-nya akan dibagikan kepada target yang terikat.\n\nDurasi ikatan kehidupan yang tersisa: %s.

actors.buffs.light.name=menerangkan
actors.buffs.light.desc=Bahkan di Terungku Paling Gelap, cahaya terang di sisimu selalu membuat nyaman.\n\nCahaya membantu menjauhkan kegelapan, memungkinkanmu melihat jarak yang lumayan terlepas dari lingkungan sekitar.\n\nGiliran penerangan tersisa: %s.

actors.buffs.lockedfloor.name=lantai terkunci
actors.buffs.lockedfloor.desc=Lantai saat ini terkunci, dan kamu tidak dapat meninggalkannya!\n\nSaat lantai terkunci, kamu takkan lapar atau menerima damage karena kelaparan. Selain itu, jika kamu tidak berusaha mengalahkan bos lantai ini, efek regenerasi pasif juga akan berhenti.\n\nSelain itu, jika kamu dihidupkan kembali oleh ankh yang tidak diberkati saat lantai terkunci, maka lantai tersebut akan diatur ulang.\n\nBunuh bos lantai ini untuk membuka kuncinya.

actors.buffs.lostinventory.name=perlengkapan yang hilang
actors.buffs.lostinventory.desc=Perlengkapanmu hilang di suatu tempat di terungku! Kamu takkan bisa mengambil atau menggunakan sebagian besar item sampai kamu mengambilnya kembali.

actors.buffs.magicalsight.name=Penglihatan magis
actors.buffs.magicalsight.desc=Entah bagaimana kamu dapat melihat menggunakan pikiran, bukan dengan matamu.\n\nKetika penglihatan magis aktif, kamu dapat melihat semua medan dalam radius 12 petak.\n\nGiliran penglihatan magis tersisa: %s.

actors.buffs.magicalsleep.name=tidur magis
actors.buffs.magicalsleep.toohealthy=Kamu terlalu sehat, dan menahan keinginan untuk tidur.
actors.buffs.magicalsleep.fallasleep=Kamu terjatuh dalam tidur lelap magis.
actors.buffs.magicalsleep.wakeup=Kamu bangun dan merasa segar dan sehat.
actors.buffs.magicalsleep.desc=Karakter ini telah jatuh ke dalam tidur lelap magis dan mereka tidak akan bangun secara alami. \n\nTidur magis mirip dengan tidur biasa, kecuali damage yang akan membuat target terbangun.\n\nBagi pahlawan dan sekutunya, tidur magis memiliki beberapa sifat memulihkan, memungkinkan mereka pulih dengan cepat saat beristirahat.

actors.buffs.magicimmune.name=kebal terhadap sihir
actors.buffs.magicimmune.desc=Semua efek magis telah kehilangan pengaruhnya padamu, kamu sepenuhnya kebal terhadapnya.\n\nMeskipun kekebalan sihir mencegah semua efek magis yang berbahaya dan bermanfaat, termasuk kutukan, enchantment, tongkat sihir, gulungan, cincin, artefak, dan lain lain. Kemampuan armor heroik cukup kuat untuk tetap berfungsi terlepas dari efek ini.\n\nGiliran kekebalan sihir tersisa: %s.

actors.buffs.mindvision.name=melihat pikiran
actors.buffs.mindvision.desc=Entah bagaimana kamu dapat melihat semua makhluk di lantai ini melalui pikiranmu. Perasaan yang aneh.\n\nSemua karakter di lantai ini dapat terlihat olehmu selama kamu mempunyai kemampuan melihat pikiran. Efek ini juga mungkin dapat digunakan untuk kepentingan efek sihir.\n\nGiliran melihat pikiran tersisa: %s.

actors.buffs.momentum.momentum=membangun momentum
actors.buffs.momentum.running=berlari bebas
actors.buffs.momentum.resting=memulihkan
actors.buffs.momentum.action_name=lari bebas
actors.buffs.momentum.momentum_desc=Saat dia bergerak, Pelari Bebas membangun momentum, yang bisa dia gunakan untuk memulai lari bebas.\n\nSetiap daya momentum memberikan dua giliran lari bebas, dan Pelari Bebas dapat membangun hingga 10 daya. Momentum dengan cepat hilang saat Pelari Bebas berhenti bergerak.\n\nDaya momentum saat ini: %d.
actors.buffs.momentum.running_desc=Saat ia bergerak, Pelari Bebas membangun momentum, yang dapat digunakan memulai lari bebas.\n\nKetika sedang lari bebas, Pelari Bebas bergerak dengan kecepatan ganda dan mendapat bonus penghindaran berdasar tingkat levelnya.\n\nGiliran tersisa :%d.
actors.buffs.momentum.resting_desc=Saat dia bergerak, pelari bebas membangun momentum, yang bisa dia gunakan untuk memulai lari bebas.\n\nPelari bebas membutuhkan waktu untuk memulihkan staminanya sebelum membangun momentum lagi.\n\nGiliran tersisa: %d.

actors.buffs.monkenergy.name=energi
actors.buffs.monkenergy.action=Kemampuan Biksu
actors.buffs.monkenergy.desc=Saat dia mengalahkan musuh, Biksu mendapatkan energi yang bisa dia gunakan pada berbagai kemampuan. Sebagian besar musuh memberikan 1 energi saat dikalahkan, dan Biksu tidak kehilangan energi seiring waktu.\n\nEnergi saat ini:%1$d/%2$d.
actors.buffs.monkenergy.desc_cooldown=Biksu baru saja menggunakan sebuah kemampuan, dia harus menunggu sebelum menggunakan kemampuan lainnya.\n\nCooldown saat ini: %d giliran.
actors.buffs.monkenergy$monkability$flurry.name=pukulan beruntun
actors.buffs.monkenergy$monkability$flurry.desc=Dua serangan langsung yang memberikan %1$d-%2$d damage dan mengabaikan pertahanan. Kemampuan ini tidak bisa digunakan secara berulang.
actors.buffs.monkenergy$monkability$flurry.empower_desc=Dua serangan instan yang menghasilkan %1$d-%2$d damage, mengabaikan armor, _dan menggunakan enchantment senjatamu._ Kemampuan ini tidak bisa digunakan berulang kali.
actors.buffs.monkenergy$monkability$focus.name=fokus
actors.buffs.monkenergy$monkability$focus.desc=Biksu mengambil giliran untuk fokus, membiarkannya menangkis serangan berikutnya yang mengarah padanya.
actors.buffs.monkenergy$monkability$focus.empower_desc=Biksu _langsung fokus,_ membiarkannya menangkis serangan berikutnya yang mengarah padanya.
actors.buffs.monkenergy$monkability$focus$focusbuff.name=terfokus
actors.buffs.monkenergy$monkability$focus$focusbuff.desc=Biksu terfokus pada area sekitarnya, mengantisipasi serangan berikutnya yang mengarah padanya. Selagi terfokus, dia dijamin dapat menangkis serangan berikutnya.
actors.buffs.monkenergy$monkability$dash.name=berlari
actors.buffs.monkenergy$monkability$dash.prompt=Pilih Lokasi
actors.buffs.monkenergy$monkability$dash.desc=Lari cepat hingga sejauh 4 petak. Kemampuan ini dapat melewati bahaya, tapi tidak bisa melewati musuh atau medan yang padat.
actors.buffs.monkenergy$monkability$dash.empower_desc=Lari cepat hingga _8 petak_ jauhnya. Kemampuan ini dapat melewati bahaya, namun tidak dapat menembus musuh atau medan yang padat.
actors.buffs.monkenergy$monkability$dragonkick.name=tendangan naga
actors.buffs.monkenergy$monkability$dragonkick.desc=Sebuah tendangan dahsyat yang menyebabkan %1$d-%2$d damage dan menembus armor. Tendangan itu mendorong jauh target dan melumpuhkan mereka dengan lama waktu sebanyak setiap ubin yang mereka lewati.
actors.buffs.monkenergy$monkability$dragonkick.empower_desc=Tendangan dahsyat yang menimbulkan _%1$d-%2$d damage_ dan mengabaikan armor. Tendangan tersebut menjatuhkan _semua target yang berdekatan_ dan melumpuhkan mereka untuk setiap ubin yang dilewatinya.
actors.buffs.monkenergy$monkability$meditate.name=meditasi
actors.buffs.monkenergy$monkability$meditate.desc=Biksu memfokuskan energi ke tubuhnya selama 5 giliran. Ini menghilangkan sebagian besar efek negatif dan memberinya 8 giliran tongkat sihir dan pengisian ulang artefak.
actors.buffs.monkenergy$monkability$meditate.empower_desc=Biksu memfokuskan energi ke tubuhnya selama 5 giliran. Ini menghilangkan sebagian besar efek negatif dan memberinya 8 giliran tongkat sihir dan artefak untuk mengisi ulang. _Dia juga memperoleh 80% ketahanan terhadap damage saat bermeditasi, dan menyembuhkan 20% HP yang hilang secara perlahan._

actors.buffs.ooze.name=cairan kaustik
actors.buffs.ooze.heromsg=Cairan kaustik memakan tubuhmu. Segera cuci!
actors.buffs.ooze.ondeath=Kamu mencair...
actors.buffs.ooze.rankings_desc=Larut
actors.buffs.ooze.desc=Asam lengket ini menempel pada daging, dan perlahan-lahan daging itu meleleh.\n\nCairan ini akan menghasilkan damage yang konstan dari waktu ke waktu, tetapi dapat hilang jika dicuci dalam air.\n\nGiliran mencair tersisa: %s.

actors.buffs.paralysis.name=lumpuh
actors.buffs.paralysis.heromsg=Kamu lumpuh!
actors.buffs.paralysis.out=melawan kelumpuhan
actors.buffs.paralysis.desc=Terkadang, hal yang paling buruk dilakukan adalah tidak melakukan apapun.\n\nKelumpuhan sepenuhnya menghentikan semua tindakan, memaksa target untuk menunggu sampai efeknya hilang. Rasa sakit karena menerima damage dapat membuat karakter menolak kelumpuhan itu sehingga efek lumpuh itu hilang.\n\nGiliran lumpuh tersisa: %s.

actors.buffs.physicalempower.name=dikuatkan secara fisik
actors.buffs.physicalempower.desc=Seranganmu telah diperkuat, meningkatkan jumlah damage yang dapat kamu berikan dengan serangan fisik.\n\nDamage bonus: %1$d.\nSerangan tersisa: %2$d.

actors.buffs.pincushion.name=tertancap
actors.buffs.pincushion.desc=Senjata lempar yang kamu gunakan untuk melawan karakter ini saat ini menempel padanya dan akan jatuh ke lantai setelah mereka dikalahkan..\n\nItem berikut yang saat ini tertancap:

actors.buffs.poison.name=keracunan
actors.buffs.poison.heromsg=Kamu keracunan!
actors.buffs.poison.ondeath=Kamu mati karena racun...
actors.buffs.poison.rankings_desc=Mati karena Racun
actors.buffs.poison.desc=Racun bekerja menyusuri tubuh, perlahan mematikan fungsi dalam tubuh.\n\nRacun memberi damage setiap giliran sampai efek itu hilang dengan sendirinya.\n\nGiliran racun tersisa: %s.

actors.buffs.preparation.name=persiapan
actors.buffs.preparation.action_name=menyiapkan serangan
actors.buffs.preparation.desc=Pembunuh menunggu dengan sabar, bersiap menyerang dari balik bayangan.
actors.buffs.preparation.desc_dmg=Serangan selanjutnya akan menghasilkan _%1$d%% damage tambahan_, dan akan mengeksekusi musuh biasa bila darahnya kurang dari _%2$d%%_, atau raja bila darahnya kurang dari _%3$d%%_.
actors.buffs.preparation.desc_dmg_likely=Serangannya juga mungkin akan lebih memberikan jumlah damage yang lebih besar.
actors.buffs.preparation.desc_blink=Ia dapat berpindah ke arah musuh sebelum ia menyerangnya, dengan jarak maksimal _%d._
actors.buffs.preparation.desc_invis_time=Telah tembus pandang selama: _%d giliran._
actors.buffs.preparation.desc_invis_next=Giliran serangan lebih kuat: _%d giliran._
actors.buffs.preparation.prompt=Pilih target untuk diserang!\nJarak perpindahan maksimal: %d
actors.buffs.preparation.no_target=Tidak ada yang dapat diserang di sana.
actors.buffs.preparation.out_of_reach=Target tersebut diluar jangkauan.
actors.buffs.preparation.assassinated=terbunuh

actors.buffs.prismaticguard.name=Penjaga Prismatik
actors.buffs.prismaticguard.desc=Kamu dilindungi oleh bayangan prismatik yang saat ini tidak aktif. Ketika ada musuh, bayangan prismatik akan bertindak dan melindungimu!\n\nSaat tidak aktif, bayangan prismatik akan terus pulih dari dari segala damage yang mereka dapatkan.\n\nDarah saat ini: %d/%d.
actors.buffs.prismaticguard.desc_many=Bayangan prismatik ini juga mendapat manfaat dari Kekuatan Banyak. Giliran Tersisa: %d.

actors.buffs.recharging.name=mengisi ulang
actors.buffs.recharging.desc=Energi mengalir dalam dirimu, meningkatkan kecepatan pengisian daya tongkat sihir dan tongkatmu.\n\nSetiap giliran, peningkatan ini akan meningkatkan daya saat ini sebesar seperempat, selain isi ulang biasa.\n\nGiliran isi ulang tersisa: %s.

actors.buffs.revealedarea.name=area terungkap
actors.buffs.revealedarea.desc=Sejumlah area di terungku diperlihatkan sementara kepada pahlawan, Mereka akan melihatnya dimanapun mereka berada.\n\nGiliran tersisa: %s.

actors.buffs.revealedchar.name=terungkap
actors.buffs.revealedchar.desc=Karakter ini diperlihatkan kepada sang pahlawan, Mereka akan terlihat di mana pun mereka berada.\n\nGiliran tersisa: %s.

actors.buffs.roots.name=tertanam
actors.buffs.roots.heromsg=Kamu tak bisa bergerak!
actors.buffs.roots.desc=Akar (dari sihir atau alami) mencengkeram kaki, membuatnya tertanam ke dalam tanah.\n\nAkar mengunci target di tempat, membuat pergerakan dan kebanyakan kemampuan yang memerlukan gerak mustahil untuk dilakukan. Aksi lain tidak berpengaruh, termasuk efek teleportasi.\n\nGiliran tertanam tersisa: %s.

actors.buffs.scrollempower.name=gulungan yang memperkuat
actors.buffs.scrollempower.desc=Energi dari gulungan yang baru saja dibaca oleh Penyihir memperkuat tongkat sihi miliknya!\n\nPeningkatan Level: +%1$d.\nSisa tembakan: %2$d.

actors.buffs.shadows.name=berbaur dengan bayangan
actors.buffs.shadows.desc=Kamu berbaur dengan bayangan di sekitarmu, membuatmu tembus pandang dan melambatkan metabolisme tubuhmu.\n\nSaat kamu tembus pandang musuh tak akan dapat menyerangmu atau mengikutimu. Serangan fisik ataupun efek sihir (seperti gulungan atau tongkat sihir) akan segera membatalkan tembus pandang. Ditambah, saat berbaur dengan bayangan, rasa laparmu juga sedikit tertahan.\n\nKau akan terus berbaur dengan bayangan sampai kau keluar ruangan atau mengadakan kontak dengan musuh.

actors.buffs.slow.name=melambat
actors.buffs.slow.desc=Sihir perlambatan memengaruhi jalannya waktu target, bagi mereka, semuanya bergerak super cepat.\n\nKarakter yang melambat melakulan segala aksi dua kali lebih lama dari biasanya.\n\nGiliran melambat tersisa: %s.

actors.buffs.snipersmark.name=tanda penembak jitu
actors.buffs.snipersmark.action_name_snapshot=serangan langsung
actors.buffs.snipersmark.action_name_volley=serangan cepat
actors.buffs.snipersmark.action_name_sniper=serangan jitu
actors.buffs.snipersmark.desc=Penembak Jitu terfokus pada targetnya yang baru diserang. Dia dapat melakukan serangan khusus yang bervariasi dengan busurnya berdasarkan pada bagaimana busur itu diaugmentasi.\n\nBusur yang tidak diaugmentasi akan menembakkan _serangan langsung,_ memberikan damage kecil tetapi tidak memakan waktu untuk menembak.\n\nBusur yang diaugmentasi kecepatan akan menembakkan _serangan cepat_ pada tiga panah. Setiap panah akan menghasilkan damage yang berkurang, tetapi masih dapat mengaktifkan enchantment. Serangan cepat ini memakan 1 giliran untuk menembak.\n\nBusur yang diaugmentasi damage akan melepaskan _serangan jitu._ Tembakan ini dijamin mengenai target, memberikan damage bonus berdasarkan jarak target, dan memakan 2 giliran untuk menembak.\n\nGiliran tersisa: %s.

actors.buffs.soulmark.name=tanda jiwa
actors.buffs.soulmark.desc=Sang dukun telah menandai jiwa dari karakter ini, memungkinkan dukun untuk menyembuhkan diri setiap kali karakter ini diserang secara fisik.\n\nGiliran tanda jiwa: %s.

actors.buffs.stamina.name=stamina
actors.buffs.stamina.desc=Kamu memiliki stamina yang tak terbatas, membuatmu bisa bergerak lebih cepat!\n\nSaat memiliki efek stamina, kamu akan berlari dengan kecepatan +50%%, tapi akan melakukan semua tindakan lain dengan kecepatan normal.\n\nGiliran stamina tersisa: %s.

actors.buffs.vulnerable.name=rentan
actors.buffs.vulnerable.heromsg=Kamu merasa rapuh!
actors.buffs.vulnerable.desc=Sihir kerentanan meningkatkan semua damage fisik yang diterima seseorang sebanyak 33%%, setelah damage itu dikurangi oleh armor.\n\nGiliran rentan tersisa: %s.

actors.buffs.terror.name=takut
actors.buffs.terror.desc=Teror adalah sihir manipulatif yang memaksa targetnya menjadi panik tak terkendali.\n\nKarakter yang takut dipaksa untuk melarikan diri dari lawan mereka, menjauh melewati pintu-pintu dan dinding-dinding sejauhnya. Namun begitu, kejutan dari rasa sakit akan mengurangi durasi teror.\n\nGiliran teror tersisa: %s.

actors.buffs.toxicimbue.name=dijiwai dengan racun
actors.buffs.toxicimbue.desc=Kamu dipenuhi dengan energi beracun!\n\nSaat kau bergerak, gas beracun akan terus mengepul darimu, menyakiti musuhmu. Kamu kebal terhadap gas beracun dan racun selama efeknya berlangsung, serta beberapa giliran setelahnya.\n\nGiliran jiwa racun tersisa: %s.

actors.buffs.corrosion.name=korosi
actors.buffs.corrosion.heromsg=Kamu meleleh!
actors.buffs.corrosion.ondeath=Kamu mencair...
actors.buffs.corrosion.rankings_desc=Larut
actors.buffs.corrosion.desc=Asam kuat melelehkan tubuh, logam, dan tulang dalam tingkat yang mengkhawatirkan.\n\nDamage korosi meningkat setiap waktunya, seiring dengan semakin melelehnya target.\n\nGiliran korosi tersisa: %1$s.\nDamage korosi saat ini: %2$d.

actors.buffs.vertigo.name=pusing
actors.buffs.vertigo.desc=Berjalan di garis lurus akan sangat sulit jika seluruh dunia berputar.\n\nSaat sedang dalam efek pusing, karakter akan berjalan menuju arah yang acak, bukannya tempat yang ingin mereka masuki.\n\nGiliran pusing tersisa: %s.

actors.buffs.wandempower.name=tongkat dikuatkan
actors.buffs.wandempower.desc=Tongkat penyerang kamu telah dikuatkan, meningkatkan jumlah damage yang ditimbulkannya untuk beberapa serangan.\n\nBonus damage: %1$d\nSerangan tersisa: %2$d

actors.buffs.weakness.name=melemah
actors.buffs.weakness.heromsg=Kamu merasa lemah!
actors.buffs.weakness.desc=Tiba-tiba semuanya terasa lebih berat.\n\nSihir pelemah mengurangi kekuatan fisik sebuah karakter, yang mengurangi damage yang ditimbulkannya sebesar 33%%.\n\nGiliran melemah tersisa: %s.

actors.buffs.wellfed.name=cukup makan
actors.buffs.wellfed.desc=Kamu merasa cukup puas dan kenyang.\n\nSaat cukup makan, rasa laparmu tidak akan meningkat, dan kamu akan mendapatan darah tambahan seiring waktu.\n\nGiliran tersisa: %d.



###hero

##abilities
actors.hero.abilities.armorability.self_target=Kamu tidak dapat menargetkan diri sendiri!
actors.hero.abilities.armorability.no_target=Tidak ada yang bisa ditargetkan di sana!
actors.hero.abilities.armorability.prompt=Pilih lokasi untuk ditarget.
actors.hero.abilities.armorability.cost=Biaya daya: _%d_

actors.hero.abilities.warrior.heroicleap.name=lompatan heroik
actors.hero.abilities.warrior.heroicleap.prompt=Pilih arah untuk melompat
actors.hero.abilities.warrior.heroicleap.short_desc=Pendekar melakukan _Lompatan Heroik_ ke lokasi yang ditargetkan, lompatan itu dapat melewati musuh dan hambatan berbahaya.
actors.hero.abilities.warrior.heroicleap.desc=Pendekar melompat ke lokasi yang ditargetkan, dapat melewati musuh atau hambatan berbahaya yang menghalangi. Namun ia tidak bisa melompati tembok atau medan padat lainnya.
actors.hero.abilities.warrior.shockwave.name=gelombang kejut
actors.hero.abilities.warrior.shockwave.short_desc=Pendekar mengantam tanah dan melepaskan _Gelombang Kejut_ dalam area berbentuk kerucut. Musuh yang terkena efek gelombang kejut akan menerima damage dan menjadi lumpuh.
actors.hero.abilities.warrior.shockwave.desc=Pendekar menghantam tanah, menghasilkan gelombang kejut yang bergerak hingga 5 petak dalam area kerucut 60 derajat.\n\nMusuh yang terkena gelombang kejut ini akan pincang selama 5 giliran. Mereka juga menerima 5-10 damage, ditambah 1-2 damage tambahan untuk setiap poin kekuatan yang dimiliki Pendekar di atas 10.
actors.hero.abilities.warrior.endure.name=tahan
actors.hero.abilities.warrior.endure$enduretracker.name=ketahanan
actors.hero.abilities.warrior.endure$enduretracker.desc=Pendekar sekarang memberikan damage bonus berdasarkan damage yang dia tahan.\n\nDamage Bonus: %1$d\nSerangan tersisa: %2$d
actors.hero.abilities.warrior.endure.short_desc=Pendekar _Bertahan_, melewati beberapa giliran tetapi mendapatkan ketahanan yang tinggi terhadap damage. Dia kemudian memberikan damage bonus berdasarkan seberapa besar yang dia tahan.
actors.hero.abilities.warrior.endure.desc=Pendekar bertahan selama 3 giliran, menerima setengah damage dari semua sumber. Pengurangan ini diterapkan sebelum efek penahan damage seperti armor.\n\nSetelah bertahan, serangan pendekar berikutnya selama 10 giliran akan mendapatkan bonus damage. Damage bonus ini sama dengan setengah dari semua damage yang diterimanya  saat bertahan, sebelum efek pengurangan damage apa pun!\n\nJika Pendekar memiliki kombo, menggunakan kemampuan ini akan menambah waktu tersisa sebanyak 3 giliran.

actors.hero.abilities.mage.elementalblast.name=ledakan elemental
actors.hero.abilities.mage.elementalblast.no_staff=Kamu tidak dapat memakai kemampuan ini tanpa tongkatmu.
actors.hero.abilities.mage.elementalblast.short_desc=Penyihir memancarkan _Ledakan Elemental_ dari tongkatnya, menutupi area yang luas di sekitarnya dengan efek yang bervariasi berdasarkan jenis sihir di tongkatnya.
actors.hero.abilities.mage.elementalblast.desc=Penyihir memancarkan ledakan sihir, yang mencakup wilayah melingkar hingga 4 petak jauhnya dan menghasilkan hingga 15-25 damage. Efek spesifik dari ledakan elemental akan berbeda-beda tergantung dari tongkat sihir apa yang dijiwai oleh tongkat Penyihir.
actors.hero.abilities.mage.elementalblast.generic_desc=Efek ledakan elemental akan serupa dengan efek tongkat sihir ketika menyerang musuh atau sekutu.
actors.hero.abilities.mage.wildmagic.name=sihir liar
actors.hero.abilities.mage.wildmagic.no_wands=Kamu tidak punya tongkat sihir untuk ditembakkan!
actors.hero.abilities.mage.wildmagic.short_desc=Penyihir melepaskan _Sihir Liar_ di dalam tongkatnya yang secara acak akan bertubi-tubi menembak target terpilih dalam satu giliran.
actors.hero.abilities.mage.wildmagic.desc=Penyihir melepaskan kekuatan di tongkat sihirnya, menembakkannya secara acak hingga 4 kali dalam satu giliran. Tongkat Penyihir tidak termasuk dalam efek ini.\n\nSetiap tongkat sihir juga ditingkatkan levelnya sebesar 2, hingga +3. Kemampuan ini menggunakan setengah daya tongkat sihir untuk setiap tembakan, dan tidak ada satu tongkat sihir pun yang dapat ditembakkan lebih dari 2 kali.
actors.hero.abilities.mage.warpbeacon.name=suar teleportasi
actors.hero.abilities.mage.warpbeacon.depths=Kamu tidak bisa teleportasi ke lantai yang berbeda!
actors.hero.abilities.mage.warpbeacon.locked_floor=Kamu tidak dapat meninggalkan lantai yang terkunci!
actors.hero.abilities.mage.warpbeacon.too_far=Lokasi itu terlalu jauh!
actors.hero.abilities.mage.warpbeacon.invalid_beacon=Kamu tidak bisa menempatkan suar di sana!
actors.hero.abilities.mage.warpbeacon.window_desc=Suarmu saat ini ditempatkan di lantai %d.
actors.hero.abilities.mage.warpbeacon.window_tele=teleport ke suar
actors.hero.abilities.mage.warpbeacon.window_clear=hapus suar
actors.hero.abilities.mage.warpbeacon.window_cancel=batal
actors.hero.abilities.mage.warpbeacon.short_desc=Penyihir menempatkan _Suar Transportasi_ di lokasinya saat ini, yang mana dia bisa langsung berpindah  kembali ke tempat ini.
actors.hero.abilities.mage.warpbeacon.desc=Penyihir dapat menempatkan sebuah suar, yang membuatnya dapat berteleportasi ke suar itu sesuka hati. Menempatkan suar itu membutuhkan 1 giliran, tapi teleportasinya itu sendiri tidak memakan waktu.\n\nPenyihir dapat berteleportasi antar lantai, atau bisa menggunakan suar itu untuk pergi tempat yang tidak bisa diraih seperti ruangan terkunci. Penyihir juga dapat teleportasi langsung ke musuh yang mana akan mendorong mereka ke belakang.

actors.hero.abilities.rogue.smokebomb.name=bom asap
actors.hero.abilities.rogue.smokebomb.fov=Kamu hanya dapat melompat ke lokasi kosong pada jarak pandanganmu.
actors.hero.abilities.rogue.smokebomb.prompt=Pilih lokasi untuk lompat
actors.hero.abilities.rogue.smokebomb$ninjalog.name=umpan kayu
actors.hero.abilities.rogue.smokebomb$ninjalog.desc=Entah bagaimana, musuh dengan mudah tertipu bahwa umpan kayu ini adalah Pengembara yang asli!
actors.hero.abilities.rogue.smokebomb$ninjalog.discover_hint=Kamu dapat menemukan karakter ini dengan kemampuan armor pahlawan tertentu.
actors.hero.abilities.rogue.smokebomb.short_desc=Pengembara melempar sebuah _Bom Asap_ seraya ia berpindah tempat. Dia menjadi tidak terlihat sementara dan membutakan musuh di dekat lokasi sebelumnya.
actors.hero.abilities.rogue.smokebomb.desc=Pengembara melempar bom asap dan berpindah posisi hingga 6 petak jauhnya. Dia bisa pindah menembus bahaya dan musuh, tetapi tidak dapat menembus benda yang kokoh seperti dinding.\n\nMusuh yang dekat dengan posisi awal Pengembara akan dibutakan selama 5 giliran.
actors.hero.abilities.rogue.deathmark.name=tanda maut
actors.hero.abilities.rogue.deathmark.ally_target=Kamu hanya bisa menandai musuh
actors.hero.abilities.rogue.deathmark.short_desc=Pengembara menempatkan _Tanda Maut_ pada musuh yang dipilih. Musuh yang ditandai akan menerima damage bonus, tetapi tidak bisa mati sampai tanda itu berakhir.
actors.hero.abilities.rogue.deathmark.desc=Pengembara menempelkan tanda pada musuh yang dipilih, menyebabkan musuh menerima 25% damage ekstra. Tanda diterapkan secara instan dan berlangsung selama 5 giliran. \n\nMusuh yang ditandai menerima damage bonus tetapi tidak dapat mati sampai tanda itu berakhir. Jika musuh memiliki 0 HP saat tanda berakhir, mereka akan langsung mati.
actors.hero.abilities.rogue.deathmark$deathmarktracker.name=ditandai untuk mati
actors.hero.abilities.rogue.deathmark$deathmarktracker.desc=Musuh ini telah ditandai, menyebabkan mereka menerima 25%% damage tambahan, tetapi juga membuat mereka tidak bisa mati sampai tanda itu berakhir.\n\nGiliran tersisa: %s.
actors.hero.abilities.rogue.shadowclone.name=tiruan bayangan
actors.hero.abilities.rogue.shadowclone.short_desc=Pengembara memanggil _Tiruan Bayangan_, yang dapat diarahkan untuk membantunya dalam pertempuran.
actors.hero.abilities.rogue.shadowclone.desc=Pengembara memanggil tiruan bayangan pada dirinya, yang mana dapat diarahkan untuk membantunya dalam pertarungan. Pengarahan tiruan bayangan tidak memakai daya apapun.\n\nTiruan itu memiliki darah sebanyak 80, tidak memiliki armor, dan menyerang dengan 10-20 damage. Semua sifat itu dapat ditingkatkan dengan bakat, seperti bagaimana tiruan itu mendapatkan manfaat dari senjata dan armor yang dimiliki pahlawan.
actors.hero.abilities.rogue.shadowclone$shadowally.name=bayangan pengembara
actors.hero.abilities.rogue.shadowclone$shadowally.direct_defend=Tiruanmu bergerak ke posisi itu.
actors.hero.abilities.rogue.shadowclone$shadowally.direct_follow=Tiruanmu bergerak mengikutimu.
actors.hero.abilities.rogue.shadowclone$shadowally.direct_attack=Tiruanmu bergerak menyerang!
actors.hero.abilities.rogue.shadowclone$shadowally.desc=Tiruan Pengembara, terbuat dari bayangan gelap. Tiruan itu berdiri diam, dengan mata kosong dan gumpalan kegelapan menyeruak darinya seperti uap.\n\nTiruan ini bukanlah tiruan sempurna dari Pengembara, tapi masih merupakan petarung yang tangguh, dan bisa mendapatkan keuntungan dari peralatan si Pengembara dikombinasikan dengan bakat yang tepat.
actors.hero.abilities.rogue.shadowclone$shadowally.discover_hint=Kamu dapat menemukan karakter ini dengan kemampuan armor pahlawan tertentu.

actors.hero.abilities.huntress.spectralblades.name=bilah spektral
actors.hero.abilities.huntress.spectralblades.short_desc=Pemburu melempar _Pisau Spektral_ ke target, memberikan sejumlah damage tergantung senjata jarak dekat yang sedang dipakainya sekarang.
actors.hero.abilities.huntress.spectralblades.desc=Pemburu melemparkan bilah spektral ke musuh, yang bertindak seperti serangan jarak jauh dari senjata jarak dekatnya. Semua efek normal senjata jarak dekat akan aktif, termasuk enchantment.
actors.hero.abilities.huntress.naturespower.name=kekuatan alam
actors.hero.abilities.huntress.naturespower.short_desc=Pemburu memanggil _Kekuatan Alam_, meningkatkan kecepatan gerak dan kecepatan tembakan busurnya untuk sementara waktu.
actors.hero.abilities.huntress.naturespower.desc=Pemburu untuk sementara memperkuat dirinya dan busurnya dengan kekuatan alam! Kekuatan ini berlangsung selama 8 giliran.\n\nSelama durasi ini, Pemburu bergerak dengan kecepatan 2x, dan menyerang 33% lebih cepat dengan busurnya. Efek bonus serangan busur tidak terpicu jika Penembak jitu menggunakan serangan khususnya.
actors.hero.abilities.huntress.naturespower$naturespowertracker.name=kekuatan alam
actors.hero.abilities.huntress.naturespower$naturespowertracker.desc=Pemburu secara singkat memperkuat dirinya, meningkatkan kecepatan gerak dan kecepatan serangan busurnya.\n\nGiliran tersisa: %s.
actors.hero.abilities.huntress.spirithawk.name=elang roh
actors.hero.abilities.huntress.spirithawk.no_space=Tidak ada ruang kosong di dekatmu.
actors.hero.abilities.huntress.spirithawk.short_desc=Pemburu memanggil _Elang Roh_ yang dapat membantunya mengeksplor lokasi dan mengalihkan perhatian musuh.
actors.hero.abilities.huntress.spirithawk.desc=Pemburu memanggil elang roh yang dikenalnya, yang dapat diarahkan dengan menggunakan kemampuannya lagi setelah dipanggil. Elang itu bertahan selama 100 giliran, mengarahkan elang itu tidak memakai daya apa pun.\n\nElang itu memiliki kesehatan dan kekuatan menyerang yang minimal, tetapi cepat, gesit, dan akurat. Ia berbagi seluruh bidang penglihatannya dengan Pemburu setiap saat. Ia kebal terhadap semua efek yang terikat area, seperti api dan gas beracun. Ia tidak akan menyerang kecuali diarahkan secara khusus.
actors.hero.abilities.huntress.spirithawk$hawkally.name=elang roh
actors.hero.abilities.huntress.spirithawk$hawkally.direct_defend=Elangmu bergerak ke posisi tersebut.
actors.hero.abilities.huntress.spirithawk$hawkally.direct_follow=Elangmu bergerak mengikutimu.
actors.hero.abilities.huntress.spirithawk$hawkally.direct_attack=Elangmu bergerak menyerang!
actors.hero.abilities.huntress.spirithawk$hawkally.desc=Seekor elang magis, dipanggil oleh Pemburu. Elang itu bersinar biru terang, kepalanya terus bergerak saat mengamati area tersebut.\n\nMeski bukan petarung yang tangguh, kecepatan dan penglihatan yang dimilikinya sempurna untuk mengintai dan mengalihkan perhatian musuh.
actors.hero.abilities.huntress.spirithawk$hawkally.desc_remaining=Giliran tersisa: %d.
actors.hero.abilities.huntress.spirithawk$hawkally.desc_dodges=Penghindaran yang dijamin tersisa: %d.
actors.hero.abilities.huntress.spirithawk$hawkally.discover_hint=Kamu dapat menemukan karakter ini dengan kemampuan armor pahlawan tertentu.

actors.hero.abilities.duelist.challenge.name=tantangan
actors.hero.abilities.duelist.challenge.prompt=Pilih musuh untuk ditantang
actors.hero.abilities.duelist.challenge.already_dueling=Kamu hanya bisa berada dalam satu duel pada satu waktu.
actors.hero.abilities.duelist.challenge.ally_target=Kamu hanya dapat menantang musuh.
actors.hero.abilities.duelist.challenge.unreachable_target=Kamu harus bisa menjangkau targetmu.
actors.hero.abilities.duelist.challenge.distant_target=Musuh itu terlalu jauh untuk bisa ditantang.
actors.hero.abilities.duelist.challenge.short_desc=Duelis _Menantang_ satu musuh di dekatnya untuk berduel, membekukan semua musuh lainnya untuk sementara.
actors.hero.abilities.duelist.challenge.desc=Duelis menantang musuh terdekat untuk berduel. Musuh itu terpaksa melawannya sementara semua musuh lainnya untuk sementara membeku dalam waktu.\n\nTarget harus dapat dijangkau dan dalam jarak 5 petak dari Duelis. Duel berlangsung hingga 10 giliran berlalu, musuh mati, atau Duelis berjarak lebih dari 5 petak dari musuh.\n\nMusuh beku kebal terhadap damage. Sekutu Duelis tidak dibekukan oleh kemampuan ini, tetapi jika bos menjadi target maka antek-anteknya juga tidak akan dibekukan.
actors.hero.abilities.duelist.challenge$duelparticipant.name=peserta duel
actors.hero.abilities.duelist.challenge$duelparticipant.desc=Karakter ini berpartisipasi dalam duel. Mereka, dan sekutu atau antek mereka, diizinkan untuk bertindak normal sementara yang lain dibekukan.\n\nDuel akan berlangsung selama waktu yang ditentukan, sampai salah satu peserta mati, atau sampai peserta saling menjauh lebih dari 5 petak.\n\nGiliran tersisa: %d
actors.hero.abilities.duelist.elementalstrike.name=serangan elemental
actors.hero.abilities.duelist.elementalstrike.short_desc=Duelis melakukan _Serangan Elemental_, menyebarkan efek dalam area berbentuk kerucut berdasarkan enchantment senjatanya.
actors.hero.abilities.duelist.elementalstrike.desc=Duelis menyerang musuh atau lokasi, melakukan serangan biasa yang dijamin kena dan menyebarkan efek magis yang menyebar hingga 4 ubin dalam kerucut 65 derajat. Efek magis ini bervariasi berdasarkan enchantment pada senjata utama Duelis.
actors.hero.abilities.duelist.elementalstrike.generic_desc=Sebuah serangan elemental tanpa adanya enchantment akan mengeluarkan ledakan kecil sihir, menyebabkan 6-12 damage kepada semua musuh dalam jangkauannya.
actors.hero.abilities.duelist.feint.name=serangan tipuan
actors.hero.abilities.duelist.feint.prompt=pilih lokasi untuk berlari kesana
actors.hero.abilities.duelist.feint.too_far=lokasi itu tidak berada disampingmu
actors.hero.abilities.duelist.feint.bad_location=Kamu tidak dapat bergerak ke lokasi tersebut.
actors.hero.abilities.duelist.feint.short_desc=Duelis melakukan _Serangan Tipuan_, memalsukan serangan sambil berlari ke ubin yang berdekatan. Musuh akan menyerang bayangannya, membuat mereka rentan terhadap serangan balik.
actors.hero.abilities.duelist.feint.desc=Duelis memalsukan serangan sambil berlari ke ubin yang berdekatan, meninggalkan bayangan sesaat tentang dirinya. Musuh yang menyerang Duelis akan menyerang bayangan belakangnya.\n\nMusuh yang menyerang bayangan belakang menjadi bingung, sehingga membatalkan tindakan selanjutnya dan membuat mereka rentan terhadap serangan mendadak.

actors.hero.abilities.cleric.ascendedform.name=kenaikan wujud
actors.hero.abilities.cleric.ascendedform.short_desc=Ulama mengambil _Kenaikan Wujud_, mendapat mantra baru, jangkauan serangan, dan perisai.
actors.hero.abilities.cleric.ascendedform.desc=Ulama memproyeksikan energi suci dari dirinya sendiri, mengambil bentuk cemerlang yang diperpanjang selama 10 giliran. Saat dalam bentuk ini, Ulama dapat mengeluarkan mantra baru, memperoleh 2 jangkauan serangan, 30 perisai, dan mantra tambahan apa pun yang mereka keluarkan akan memberikan 10 perisai per daya kitab suci yang digunakan.\n\nPerisai dari kenaikan wujud dan mantranya tidak berkurang secara normal, tapi akan segera memudar setelah kenaikan wujud berakhir. Kemampuan tersebut dapat digunakan kembali untuk menyegarkan durasi kenaikan wujud.
actors.hero.abilities.cleric.ascendedform$ascendbuff.name=kenaikan wujud
actors.hero.abilities.cleric.ascendedform$ascendbuff.desc=Energi cemerlang terpancar dari tubuh Ulama. Saat dalam wujud ini, Ulama mendapatkan 2 jangkauan serangan (dari energi suci yang terproyeksi darinya), dan 10 perisai setiap kali dia menghabiskan daya dari kitab suci. Dia juga mampu mengeluarkan mantra yang terbuka melalui bakat kenaikan wujud. \n\nPerisai yang diberikan oleh kenaikan wujud dan mantranya tidak akan memudar secara normal, tetapi akan langsung memudar saat kenaikan wujud berakhir. \n\nPerisai saat ini: %1$d. \nGiliran tersisa: %2$d.
actors.hero.abilities.cleric.trinity.name=trinitas
actors.hero.abilities.cleric.trinity.no_imbue=Trinitas tidak memiliki efek yang ditetapkan untuk bentuk apa pun saat ini, gunakan salah satu mantranya!
actors.hero.abilities.cleric.trinity.no_duplicate=Trinitas tidak dapat menduplikasi efek yang sudah kamu miliki!
actors.hero.abilities.cleric.trinity.ench_glyph_use=Trinitas akan menerapkan efek ini selama _%1$d giliran_ dengan biaya _%2$s daya._
actors.hero.abilities.cleric.trinity.rare_ench_glyph_use=Trinitas akan menerapkan efek _kuat_ ini selama _%1$d giliran_ dengan biaya _%2$s daya._
actors.hero.abilities.cleric.trinity.wand_use=Trinitas akan menembak dengan tongkat sihir ini pada _+%1$d_ dengan biaya _%2$s daya._
actors.hero.abilities.cleric.trinity.wand_multi_use=Trinitas akan menembak dengan _banyak charge_ tongkat sihir ini pada _+%1$d_ dengan biaya _%2$s daya._
actors.hero.abilities.cleric.trinity.thrown_use=Trinitas akan melempar senjata ini pada _+%1$d_ dengan biaya _%2$s daya._
actors.hero.abilities.cleric.trinity.ring_use=Trinitas akan menerapkan efek cincin ini pada _+%1$d_ selama 20 giliran, dengan biaya _%2$s daya._
actors.hero.abilities.cleric.trinity.alchemiststoolkit_use=Trinitas akan menerapkan efek pengendalian racikan di artefak ini dengan biaya _%2$s daya._
actors.hero.abilities.cleric.trinity.chaliceofblood_use=Trinitas akan menerapkan efek regenerasi pasif di artefak ini pada _+%1$d_ selama 20 giliran, dengan biaya _%2$s daya._
actors.hero.abilities.cleric.trinity.driedrose_use=Trinitas akan memakai efek artefak ini untuk memanggil hantu gentayangan yang dirusak dengan darah dari hantu _+%1$d_, dengan biaya _%2$s daya._
actors.hero.abilities.cleric.trinity.etherealchains_use=Trinitas akan menerapkan efek lemparan rantai di artefak ini dengan jangkauan pada _+%1$d_, dengan biaya _%2$s daya._
actors.hero.abilities.cleric.trinity.hornofplenty_use=Trinitas akan menerapkan efek camilan di artefak ini dengan biaya _%2$s daya._
actors.hero.abilities.cleric.trinity.masterthievesarmband_use=Trinitas akan menerapkan efek merampok musuh di artefak ini pada _+%1$d_, dengan biaya _%2$s daya._
actors.hero.abilities.cleric.trinity.sandalsofnature_use=Trinitas akan menerapkan efek mengakar di artefak ini dengan sebuah benih acak yang berbahaya, dengan biaya _%2$s daya._
actors.hero.abilities.cleric.trinity.skeletonkey_use=Trinitas akan menerapkan efek sisipan di artefak ini dengan biaya _%2$s daya._
actors.hero.abilities.cleric.trinity.talismanofforesight_use=Trinitas akan menerapkan efek mengintip di artefak ini pada _+%1$d_, dengan biaya _%2$s daya._
actors.hero.abilities.cleric.trinity.timekeepershourglass_use=Trinitas akan menerapkan efek bekukan waktu di artefak ini dengan _%1$d_ giliran durasi, dengan biaya _%2$s daya._
actors.hero.abilities.cleric.trinity.unstablespellbook_use=Trinitas akan menerapkan efek gulungan acak di artefak ini dengan _%1$d/10_ peluang untuk mendapat versi eksotis tanpa biaya tambahan, dengan biaya _%2$s daya._
actors.hero.abilities.cleric.trinity.cost=Biaya daya kemampuan ini bervariasi, tetapi paling sering adalah _%d._
actors.hero.abilities.cleric.trinity.short_desc=Ulama memperoleh _Trinitas_ kemampuan, yang meniru perlengkapan yang telah mereka lihat dan dapat ditetapkan dengan memakai mantra baru.
actors.hero.abilities.cleric.trinity.desc=Ulama memperoleh _Trinitas_ kemampuan armor, yang dapat menetapkan beragam efek item dengan menggunakan tiga mantra baru. Masing-masing mantra ini berfokus pada meniru beragam jenis efek dari peralatan yang telah diidentifikasi oleh Ulama selama permainan ini: bentuk tubuh (senjata dan armor), bentuk pikiran (tongkat sihir dan senjata lempar), dan bentuk roh (cincin dan artefak).\n\nSetiap bentuk Trinitas dapat disematkan dengan satu efek pada satu waktu, dan Ulama memilih salah satusaat memakai Trinitas. Trinitas tidak akan menggandakan efek dari sesuatu yang sudah kamu pakai.
actors.hero.abilities.cleric.trinity$wndusetrinity.text=Pilih bentuk Trinitas yang akan dipakai. Efek dari berbagai bentuk dapat aktif secara bersamaan.
actors.hero.abilities.cleric.trinity$wndusetrinity.body=_Bentuk Tubuh: %s._
actors.hero.abilities.cleric.trinity$wndusetrinity.mind=_Bentuk Pikiran: %s._
actors.hero.abilities.cleric.trinity$wndusetrinity.spirit=_Bentuk Roh: %s._
actors.hero.abilities.cleric.trinity$wnditemtypeselect.text=Pilih efek yang akan disematkan ke Trinitas. Info tambahan akan ditampilkan sebelum konfirmasi.
actors.hero.abilities.cleric.trinity$wnditemconfirm.body=Tetapkan ke bentuk tubuh
actors.hero.abilities.cleric.trinity$wnditemconfirm.mind=Tetapkan ke bentuk pikiran
actors.hero.abilities.cleric.trinity$wnditemconfirm.spirit=Tetapkan ke bentuk roh
actors.hero.abilities.cleric.powerofmany.name=kekuatan banyak
actors.hero.abilities.cleric.powerofmany.prompt_default=Pilih sekutu atau lokasi
actors.hero.abilities.cleric.powerofmany.prompt_ally=Arahkan sekutu cahayamu
actors.hero.abilities.cleric.powerofmany.ally_exists=Kamu sudah memiliki sekutu yang kuat.
actors.hero.abilities.cleric.powerofmany.no_vision=Kamu tidak bisa menargetkan lokasi yang tidak bisa kamu lihat.
actors.hero.abilities.cleric.powerofmany.only_allies=Kamu hanya bisa memperkuat sekutu.
actors.hero.abilities.cleric.powerofmany.short_desc=Ulama menyalurkan _Kekuatan Banyak_, memperkuat sekutu yang ada atau membuat sekutu baru.
actors.hero.abilities.cleric.powerofmany.desc=Ulama menyalurkan _Kekuatan Banyak_, yang memperkuat sekutu yang sudah ada atau menciptakan sekutu baru yang kuat selama 100 giliran. Menargetkan ruang kosong akan menciptakan sekutu baru. Saat diperkuat oleh Kekuatan Banyak, setiap sekutu memberikan +25% damage, menerima -25% damage, dan berbagi penglihatan dengan Ulama. Mereka juga memperoleh 25 perisai saat kemampuan tersebut digunakan. Ulama juga memperoleh tiga mantra baru yang hanya bisa digunakan dengan sekutu yang kuat. Kekuatan Banyak takkan berakhir saat salah satu mantra ini aktif.
actors.hero.abilities.cleric.powerofmany$powerbuff.name=kekuatan banyak
actors.hero.abilities.cleric.powerofmany$powerbuff.desc=Sekutu ini telah diperkuat oleh Kekuatan Banyak, memberi mereka +25%% damage yang diberikan dan -25%% damage yang diterima. Mereka juga akan berbagi jangkauan penglihatan dengan Ulama, dan bisa memperoleh manfaat dari mantra Kekuatan Banyak.\n\nKekuatan Banyak akan tetap ada saat sekutu seperti gambar prismatik bersembunyi, tetapi durasinya akan tetap dihitung mundur.\n\nGiliran Tersisa: %s.
actors.hero.abilities.cleric.powerofmany$lightally.name=sekutu cahaya
actors.hero.abilities.cleric.powerofmany$lightally.direct_defend=Sekutumu bergerak ke posisi itu.
actors.hero.abilities.cleric.powerofmany$lightally.direct_follow=Sekutumu bergerak mengikutimu.
actors.hero.abilities.cleric.powerofmany$lightally.direct_attack=Sekutumu bergerak menyerang!
actors.hero.abilities.cleric.powerofmany$lightally.desc=Salinan salah satu teman petualang Ulama, terbuat dari cahaya padat. Meskipun berbentuk seperti pahlawan lain, ia tidak memiliki kemampuan unik apa pun. Sekutu ini akan bertahan selama Kekuatan Banyak diterapkan pada mereka.\n\nSekutu ini dapat diarahkan tanpa charge dengan menggunakan kembali kemampuan armor Kekuatan Banyak.
actors.hero.abilities.cleric.powerofmany$lightally.discover_hint=Kamu dapat menemukan karakter ini dengan kemampuan armor pahlawan tertentu.


actors.hero.abilities.ratmogrify.name=tikusisasi
actors.hero.abilities.ratmogrify.cant_transform=Kamu tidak bisa mentikusisasi itu!
actors.hero.abilities.ratmogrify.too_strong=Musuh itu terlalu kuat untuk ditikusisasi!
actors.hero.abilities.ratmogrify.short_desc=Sang Pahlawan _Mentikusisasi_ musuh! Tikusisasi akan mengubah musuh menjadi tikus tanpa kemampuan apa pun.
actors.hero.abilities.ratmogrify.desc=Pahlawan mengubah musuh menjadi tikus selama 6 giliran! Bos, sekutu, dan tikus tidak bisa ditikusisasi.\n\nMusuh yang ditikusisasi tetap mempertahankan status aslinya, tetapi tidak akan memiliki kemampuan apa pun.
actors.hero.abilities.ratmogrify$transmograt.name=tikusisasi %s
actors.hero.abilities.ratmogrify$transmograt.desc=Musuh ini telah berubah menjadi tikus. Sebuah peningkatan besar, kalau kamu tanya saya! - Raja Tikus
actors.hero.abilities.ratmogrify$transmograt.rankings_desc=Dibunuh oleh: musuh yang ditikusisasi

##Cleric Spells
actors.hero.spells.auraofprotection.name=aura perlindungan
actors.hero.spells.auraofprotection.short_desc=Menambah pertahanan untuk Paladin dan sekutu terdekat.
actors.hero.spells.auraofprotection.desc=Paladin mulai memancarkan energi pelindung dalam aura berkilau di sekeliling mereka selama 20 giliran. Semua sekutu dalam jarak 2 petak dari Paladin (termasuk mereka sendiri) menerima %1$d%% lebih sedikit damage, dan memperoleh efek glyph armor Paladin pada daya +%2$d%%.\n\nPengurangan damage ini terjadi sebelum efek pengurangan damage lainnya (misalnya armor). Tambahan daya glyph akan selalu berlaku, tetapi mantra ini tidak dapat menyebabkan glyph Paladin berlaku lebih dari satu kali jika karakter sudah mendapatkan manfaat darinya (misalnya Paladin sendiri, atau patung prismatik).
actors.hero.spells.auraofprotection$aurabuff.name=aura perlindungan
actors.hero.spells.auraofprotection$aurabuff.desc=Paladin memancarkan energi pelindung di sekeliling mereka.\n\nSemua sekutu di sekitar (termasuk Paladin sendiri) menerima pengurangan damage dan mendapatkan efek glyph armor Paladin dengan kekuatan tambahan.\n\nGiliran tersisa: %s.

actors.hero.spells.beamingray.name=pancaran cahaya
actors.hero.spells.beamingray.no_space=Tidak ada ruang bagi sekutumu untuk muncul di sana.
actors.hero.spells.beamingray.out_of_range=Lokasi itu di luar jangkauan.
actors.hero.spells.beamingray.short_desc=Teleportasi sekutumu dan berikan bonus damage.
actors.hero.spells.beamingray.desc=Pendeta menyalurkan kekuatan pada sekutu mereka ke dalam pancaran cahaya yang mengarahkan mereka ke suatu lokasi. Jika cahaya tersebut bertabrakan dengan musuh, cahaya tersebut akan menempatkan sekutu di dekatnya dan mengarahkan mereka ke arah musuh.\n\nCahaya tersebut memiliki jangkauan maksimum %1$d petak, dan akan meningkatkan bonus damage Kekuatan Banyak menjadi +%2$d%% selama 10 giliran pada musuh terdekat dalam jarak 4 petak. Pancaran cahaya bahkan dapat memindahkan sekutu yang biasanya tidak bisa bergerak, tetapi jangkauannya berkurang setengah dalam kasus ini.
actors.hero.spells.beamingray$beamingrayboost.name=pancaran cahaya
actors.hero.spells.beamingray$beamingrayboost.desc=Sekutu ini baru saja diteleportasi oleh Pancaran Cahaya, yang memberi mereka bonus damage pada musuh terdekat setelah teleportasi. Kekuatan Banyak juga tidak akan berakhir saat peningkatan ini aktif.\n\nGiliran Tersisa: %s.

actors.hero.spells.blessspell.name=berkat
actors.hero.spells.blessspell.short_desc=Memberkati dan melindungi Ulama, memberkati dan menyembuhkan orang lain.
actors.hero.spells.blessspell.desc=Ulama memberikan berkat suci pada dirinya sendiri atau karakter lain yang dapat dia lihat.\n\nSaat diberikan pada dirinya sendiri, efeknya lebih lemah, memberikan %1$d giliran berkat dan %2$d penghalang.\n\nSaat diberikan pada karakter lain, mantranya lebih kuat, memberikan %3$d giliran berkat dan %4$d penyembuhan. Penyembuhan berlebih diubah menjadi penghalang.

actors.hero.spells.bodyform.name=bentuk tubuh
actors.hero.spells.bodyform.short_desc=Menetapkan Trinitas ke suatu enchant atau glyph.
actors.hero.spells.bodyform.desc=Ulama memilih enchantment atau glyph yang telah mereka identifikasi pada putaran ini dan memberikan efeknya pada Trinitas.\n\nSaat Trinitas digunakan, Ulama memperoleh efek dari enchantment atau glyph yang dipilih selama %d giliran. Enchant atau glyph sementara ini akan bekerja dengan efek apapun yang akan bekerja pada enchantment atau glyph biasa.\n\nMantra ini menggantikan efek tubuh lain yang saat ini diberikan pada Trinitas.
actors.hero.spells.bodyform$bodyformbuff.name=bentuk tubuh
actors.hero.spells.bodyform$bodyformbuff.desc=Bentuk tubuh Trinitas saat ini memberimu kekuatan dari sebuah enchantmen atau glyph, seolah-olah kamu telah melengkapinya pada senjata atau armormu saat ini.\n\nPerlu diingat bahwa bentuk tubuh tidak dapat memberikan salinan lain dari efek yang sudah kamu dapatkan manfaatnya.\n\nEfek Saat Ini: %1$s.\n\nGiliran Tersisa: %2$s.

actors.hero.spells.cleanse.name=menyucikan
actors.hero.spells.cleanse.short_desc=Bersihkan debuff dan memberi perisai
actors.hero.spells.cleanse.desc=Ulama menghilangkan semua status efek berbahaya pada dirinya sendiri dan sekutu yang terlihat. Setelah mantra berakhir, semua karakter yang terpengaruh juga mendapatkan kekebalan debuff selama %1$d giliran, dan penghalang %2$d penghalang.

actors.hero.spells.clericspell.prompt=Pilih target
actors.hero.spells.clericspell.no_target=Tidak ada musuh di sana.
actors.hero.spells.clericspell.invalid_target=Kamu tidak bisa menargetkan lokasi tersebut.
actors.hero.spells.clericspell.invalid_enemy=Kamu tidak bisa menargetkan musuh tersebut.
actors.hero.spells.clericspell.charge_cost=Biaya daya: %d

actors.hero.spells.divinesense.name=indera ilahi
actors.hero.spells.divinesense.short_desc=Mendapat penglihatan pikiran sementara dalam jangkauan luas.
actors.hero.spells.divinesense.desc=Ulama memfokuskan indra-nya pada lingkungan sekitar, mendapatkan penglihatan pikiran dengan jangkauan %d petak selama 50 Giliran. Mantra ini tidak memerlukan waktu untuk dirapalkan.
actors.hero.spells.divinesense$divinesensetracker.name=indera ilahi
actors.hero.spells.divinesense$divinesensetracker.desc=Karakter ini untuk sementara dapat melihat makhluk lain di dekatnya dengan pikirannya!\n\ngiliran tersisa: %s.

actors.hero.spells.divineintervention.name=intervensi ilahi
actors.hero.spells.divineintervention.short_desc=Peningkatan besar pada perisai untuk Ulama dan sekutunya.
actors.hero.spells.divineintervention.desc=Ulama menuangkan sejumlah besar kekuatan dari kitab suci nya ke dalam dirinya sendiri dan sekutu, meningkatkan setiap orang %1$d perisai dan memperluas Kenaikan Wujud sebanyak %2$d giliran. Mantra pelindung yang luar biasa ini ditimbang dengan biaya daya yang sangat tinggi.\n\nSama seperti perisai lain yang diberikan oleh kenaikan wujud, perisai ini tidak akan hilang secara normal, tetapi akan segera berakhir saat kenaikan wujud berakhir.

actors.hero.spells.flash.name=kilatan
actors.hero.spells.flash.prompt=Pilih lokasi
actors.hero.spells.flash.short_desc=teleport ke lokasi terdekat.
actors.hero.spells.flash.desc=Ulama menyalurkan kenaikan wujud mereka ke lokasi terdekat dan teleportasi ke sana. Kilatan dapat memindahkan Ulama ke lokasi yang ditemukan yang berada dalam jangkauan dan tidak berpenghuni. Mantra ini membutuhkan lebih banyak daya buku setiap kali digunakan dalam kenaikan wujud yang sama.

actors.hero.spells.guidinglight.name=cahaya penuntun
actors.hero.spells.guidinglight.short_desc=Memberikan jarak damage magis dan dijamin kena.
actors.hero.spells.guidinglight.desc=Ulama menembakkan energi magis yang menyerang target, menghasilkan 2-8 damage dan menerangi mereka. Serangan fisik tanpa beban berikutnya yang dilakukan terhadap musuh yang diterangi dijamin untuk mengenai mereka.
actors.hero.spells.guidinglight.desc_priest=_Mantra ini lebih kuat jika dirapalkan oleh Pendeta._ Mantra pertama yang dirapalkan setiap 50 giliran tidak memerlukan biaya daya dari kitab, dan penerangan akan dipakai oleh cahaya, tongkat sihir, karakter lain, dan artefak yang secara langsung memengaruhi musuh. Jika penerangan dipakai dengan cara ini, itu memberikan bonus damage sihir yang setara dengan level Pendeta +5.
actors.hero.spells.guidinglight$guidinglightpriestcooldown.name=Cahaya Penuntun
actors.hero.spells.guidinglight$guidinglightpriestcooldown.desc=Pendeta akan dapat mengeluarkan Cahaya Penuntun secara gratis lagi setelah 50 giliran berlalu.\n\nGiliran tersisa: %s.
actors.hero.spells.guidinglight$illuminated.name=Diterangi Cahaya
actors.hero.spells.guidinglight$illuminated.desc=Karakter ini bersinar karena terkena cahaya pemandu. Meskipun cahayanya tidak cukup kuat untuk menerangi area di sekitarnya, efek magisnya akan membuat serangan terhadap mereka menjadi lebih mudah bagi Ulama.
actors.hero.spells.guidinglight$illuminated.desc_priest=Pendeta juga dapat memakai penerangan dengan cahaya, tembakan tongkat sihir, serangan dari sekutu, atau efek dari beberapa artefak. Memakai penerangan dengan cara ini akan menghasilkan bonus damage sihir yang setara dengan level Pendeta level +5.
actors.hero.spells.guidinglight$illuminated.desc_generic=Pahlawan lain masih dapat menggunakan penerangan untuk mendapatkan keuntungan dari bakat searing cahaya, tetapi tidak akan mendapatkan akurasi apa pun.

actors.hero.spells.hallowedground.name=lantai yang disucikan
actors.hero.spells.hallowedground.prompt=Pilih lokasi
actors.hero.spells.hallowedground.short_desc=Menyembuhkan sekutu, memperlambat musuh, dan menyebarkan rumput dalam area tertentu.
actors.hero.spells.hallowedground.desc=Pendeta memfokuskan sihir suci mereka ke tanah di dekatnya, menciptakan area %1$dx%1$d dari medan suci selama 20 giliran.\n\nSaat dilemparkan, mantra ini menyembuhkan semua sekutu sebesar 15 HP (sekutu yang sehat dan Pendeta mendapatkan perisai), menanam musuh untuk sementara, dan menyebarkan rumput pendek.\n\nMedan suci menyembuhkan sekutu sebesar 1 HP per giliran (sekutu yang sehat dan Pendeta mendapatkan perisai), memincangkan musuh, dan secara acak menyebabkan rumput tinggi tumbuh.\n\nMedan suci dihancurkan oleh api, dan akan menghasilkan rumput berkerut jika efek regenerasi pasif dinonaktifkan atau Pendeta tidak mendapatkan pengalaman dalam beberapa saat.
actors.hero.spells.hallowedground$hallowedterrain.desc=Tanah di sini telah disucikan. Tanah yang disucikan memperlambat musuh, menyembuhkan sekutu, dan menyebabkan rumput menyebar.

actors.hero.spells.holyintuition.name=intuisi suci
actors.hero.spells.holyintuition.prompt=pilih sebuah item
actors.hero.spells.holyintuition.cursed=Kamu merasakan sihir jahat pada item ini.
actors.hero.spells.holyintuition.uncursed=Item ini bebas dari sihir jahat.
actors.hero.spells.holyintuition.short_desc=mengidentifikasi apakah sebuah item terkena kutukan atau tidak.
actors.hero.spells.holyintuition.desc=Ulama memfokuskan indranya pada suatu item dan menentukan apakah benda itu terkena kutukan atau tidak tanpa harus memakainya.

actors.hero.spells.holylance.name=tombak suci
actors.hero.spells.holylance.short_desc=Memberikan kerusakan jarak jauh magis yang dashyat.
actors.hero.spells.holylance.desc=Pendeta memusatkan sejumlah besar energi ke dalam tombak lempar penghancur yang terbuat dari cahaya. Tombak ini menghasilkan %1$d-%2$d damage dan selalu menghasilkan damage maksimum pada target mayat hidup dan iblis.\n\nMantra ini sangat mahal, dan memiliki cooldown selama 30 giliran.
actors.hero.spells.holylance$lancecooldown.name=cooldown tombak suci
actors.hero.spells.holylance$lancecooldown.desc=Pendeta baru saja melemparkan tombak suci, dan harus menunggu sebelum melemparkannya lagi.\n\nGiliran tersisa: %s.

actors.hero.spells.holyward.name=ward suci
actors.hero.spells.holyward.glyph_name=%s cahaya
actors.hero.spells.holyward.glyph_desc=Glyph ini sedikit meningkatkan jumlah damage yang dapat diblokir oleh armor.
actors.hero.spells.holyward.short_desc=Menggantikan glyph untuk sementara guna meningkatkan pemblokiran armor.
actors.hero.spells.holyward.desc=Ulama memberikan armor usang mereka dengan glyph cahaya suci, yang meningkatkan pemblokiran damage armor sebesar 1. Mantra ini tidak memerlukan waktu untuk dirapalkan. \n\nGlyph ini bertahan selama 50 giliran, dan akan menggantikan glyph bermanfaat apa pun yang dimiliki armor selama durasi tersebut. Ulama akan memperoleh keuntungan dari efek ini meskipun mereka tidak memiliki armor.
actors.hero.spells.holyward.desc_paladin=_Mantra ini lebih kuat jika dirapalkan oleh Paladin._ Pemblokiran damage tambahan ditingkatkan menjadi 3, mantra tidak lagi mengesampingkan glyph yang ada, dan mengucapkan mantra lain saat perlindungan suci aktif akan memperpanjang durasinya sebanyak 10 giliran per daya yang dipakai.
actors.hero.spells.holyward$holyarmbuff.name=ward suci
actors.hero.spells.holyward$holyarmbuff.desc=Ulama telah memberikan energi suci pada armor usang mereka, yang untuk sementara akan menggantikan semua glyph yang ada dan menyebabkan armor tersebut memblokir 1 poin damage tambahan.\n\nGiliran tersisa: %s.
actors.hero.spells.holyward$holyarmbuff.desc_paladin=Paladin telah memberikan energi suci pada armor usang mereka, yang menyebabkan armor tersebut memblokir 3 poin damage ekstra.\n\nMengucapkan mantra lain saat perlindungan suci aktif akan memperpanjang durasinya sebanyak 10 giliran per daya yang dipakai.\n\nGiliran tersisa: %s.

actors.hero.spells.holyweapon.name=senjata suci
actors.hero.spells.holyweapon.ench_name=%s suci
actors.hero.spells.holyweapon.ench_desc=Musuh yang terkena senjata suci akan menerima damage magis ekstra.
actors.hero.spells.holyweapon.short_desc=Menggantikan enchantment untuk sementara guna meningkatkan damage.
actors.hero.spells.holyweapon.desc=Ulama menyihir senjata usang mereka dengan energi suci, menyebabkan senjata tersebut memberikan tambahan 2 damage magis setiap kali mereka menyerang musuh dengannya. Mantra ini tidak memerlukan waktu untuk dirapalkan. \n\nSihir ini bertahan selama 50 giliran, dan akan menggantikan semua sihir bermanfaat yang dimiliki senjata tersebut selama durasi tersebut. Serangan tangan kosong juga mendapatkan keuntungan dari efek ini.
actors.hero.spells.holyweapon.desc_paladin=_Mantra ini lebih kuat jika dirapalkan oleh Paladin._ Damage sihir tambahan ditingkatkan menjadi 6, mantra tidak lagi mengesampingkan enchantment yang ada, dan merapalkan mantra lain saat senjata suci aktif akan memperpanjang durasinya sebanyak 10 giliran per daya yang dipakai.
actors.hero.spells.holyweapon$holywepbuff.name=senjata suci
actors.hero.spells.holyweapon$holywepbuff.desc=Ulama telah memberikan energi suci pada senjata usang mereka, yang untuk sementara akan menggantikan semua enchantment yang ada dan menyebabkan senjata tersebut memberikan 2 poin damage magis ekstra pada setiap serangan.\n\nGiliran tersisa: %s.
actors.hero.spells.holyweapon$holywepbuff.desc_paladin=Paladin telah memberikan energi suci pada senjata usang mereka, yang menyebabkan serangan mereka menimbulkan 6 damage sihir ekstra.\n\nMerapalkan mantra lain saat senjata suci aktif akan memperpanjang durasinya sebanyak 10 giliran per daya yang dipakai.\n\nGiliran tersisa: %s.

actors.hero.spells.judgement.name=keputusan
actors.hero.spells.judgement.short_desc=Menyerang semua musuh yang terlihat.
actors.hero.spells.judgement.desc=Ulama menghantamkan tinjunya ke tanah, menyebabkan semburan cahaya yang memberikan damage pada semua musuh yang dapat mereka lihat. Ini memberikan damage sebesar %1$d-%2$d di pusat, tetapi juga memberikan damage tambahan sebesar 33%% untuk setiap mantra yang telah dikeluarkan oleh Ulama sejak memasuki kenaikan wujud (atau sejak mereka terakhir kali mengeluarkan Keputusan).\n\nSaat ini Keputusan akan memberikan damage sebesar %3$d-%4$d.

actors.hero.spells.layonhands.name=berbaring di tangan
actors.hero.spells.layonhands.short_desc=Seketika menyembuhkan karakter di sekitar atau memberikan perisai kepada Paladin.
actors.hero.spells.layonhands.desc=Paladin menyalurkan energi suci melalui tangan mereka, menyembuhkan atau melindungi apa pun yang mereka sentuh.\n\nPaladin dapat merapal mantra ini pada karakter yang berdekatan untuk memberi mereka %1$d penyembuhan, atau pada diri mereka sendiri untuk mendapatkan %1$d perisai. Penyembuhan berlebih dari mantra ini diubah menjadi perisai.\n\nMantra ini dirapalkan secara instan dan dapat dirapalkan berulang kali, tetapi tidak dapat memberikan lebih dari tiga kali perisai sekaligus.

actors.hero.spells.lifelinkspell.name=ikatan kehidupan
actors.hero.spells.lifelinkspell.short_desc=Membagi damage dengan sekutu, dan mengurangi damage yang diterima.
actors.hero.spells.lifelinkspell.desc=Ulama memperkuat hubungan antara mereka dan sekutu mereka yang kuat. Dengan hubungan kuat ini, setiap damage yang diterima akan dibagi antara pahlawan dan sekutu mereka untuk %1$d giliran, dan peningkatan pertahanan Kekuatan Banyak akan ditingkatkan menjadi -%2$d%% damage yang diterima. Perhatikan bahwa damage dibagi setelah armor, tapi sebelum pengurangan damage Kekuatan Banyak.\n\nSaat efek ini aktif, mantra Ulama yang bermanfaat dari T3 atau di bawahnya akan berlaku untuk Ulama dan sekutu mereka jika mantra tersebut hanya berlaku untuk salah satu dari mereka.
actors.hero.spells.lifelinkspell$lifelinkspellbuff.name=perlindungan ikatan kehidupan
actors.hero.spells.lifelinkspell$lifelinkspellbuff.desc=Ulama baru saja mengeluarkan Ikatan Kehidupan pada sekutu ini.\n\nSelain manfaat biasa Life Link, karakter ini juga menerima damage yang lebih sedikit, mantra Ulama positif apa pun diterapkan pada Cleric dan sekutu ini, bukan hanya satu, dan Kekuatan Banyak tidak akan berakhir saat peningkatan ini aktif.\n\nGiliran Tersisa: %s.

actors.hero.spells.mindform.name=bentuk pikiran
actors.hero.spells.mindform.short_desc=Menetapkan Trinitas ke suatu tongkat sihir atau senjata lempar.
actors.hero.spells.mindform.desc=Ulama memilih tongkat sihir atau senjata lempar yang telah mereka identifikasi pada putaran ini dan memberikan efeknya pada Trinitas.\n\nSaat Trinitas digunakan, Ulama dapat melakukan satu serangan seolah-olah mereka menggunakan item yang dipilih pada +%d. Ini akan memicu semua efek yang biasanya dipicu oleh penggunaan jenis item tersebut.\n\nMantra ini menggantikan efek pikiran lain yang saat ini diberikan pada Trinitas.

actors.hero.spells.mnemonicprayer.name=doa pengingat
actors.hero.spells.mnemonicprayer.short_desc=Memperluas buff/debuff pada sekutu/musuh, & menerapkan kembali penerangan.
actors.hero.spells.mnemonicprayer.desc=Pendeta mengucapkan doa yang memperpanjang durasi semua buff atau debuff pada target tertentu sebanyak %1$d giliran. Mantra ini tidak memerlukan waktu untuk dirapalkan. Efek positif akan bertahan lebih lama pada sekutu (termasuk Pendeta itu sendiri), dan efek berbahaya akan bertahan lebih lama pada musuh. \n\nDia Pengingat hanya dapat memperpanjang efek buff atau debuff tertentu satu kali, dan tidak dapat memperpanjang efek buff yang diberikan dari kemampuan armor.

actors.hero.spells.radiance.name=cahaya
actors.hero.spells.radiance.short_desc=Menyinari dan melumpuhkan musuh yang terlihat untuk sementara.
actors.hero.spells.radiance.desc=Pendeta memancarkan cahaya suci, melumpuhkan semua musuh yang terlihat selama 3 giliran. Jika musuh sudah terkena Cahaya Pemandu, Cahaya akan memicu bonus damage cahaya dan lalu menerapkan debuff cahaya. Cahaya juga akan menyebabkan Pendeta bersinar selama 100 giliran jika lantai saat ini gelap.

actors.hero.spells.recallinscription.name=pemanggil kembali prasasti
actors.hero.spells.recallinscription.short_desc=Mengulang batu kuno atau gulungan yang baru saja digunakan.
actors.hero.spells.recallinscription.desc=Ulama menggunakan sihir suci untuk mengeluarkan kembali efek magis kuno yang ditemukan pada batu kuno atau gulungan yang mereka gunakan dalam %s giliran terakhir.\n\nPemanggil kembali prasasti tidak dapat digunakan untuk mereplikasi gulungan peningkatan. biaya daya mantra ini bervariasi berdasarkan item mana yang digunakan baru-baru ini: 2 untuk batu kuno, 3 untuk gulungan, 4 untuk gulungan eksotis. Biaya daya juga berlipat ganda saat mereplikasi gulungan pengubah, atau item racikan yang harus dibuat menggunakan pengubah atau peningkatan.
actors.hero.spells.recallinscription$useditemtracker.name=Penggunaan sihir kuno saat ini.
actors.hero.spells.recallinscription$useditemtracker.desc=Ulama baru saja menggunakan item yang berfungsi dengan mantra pemanggilan kembali yang tertulis. Ulama dapat mengucapkan mantra untuk mengulang efek item tersebut.\n\nItem yang Dipakai: %1$s.\n\nGiliran Tersisa: %2$s.

actors.hero.spells.shieldoflight.name=perisai cahaya
actors.hero.spells.shieldoflight.short_desc=Memberi perlindungan sementara kepada target.
actors.hero.spells.shieldoflight.desc=Ulama menciptakan penghalang tipis dari cahaya antara mereka dan musuh, meningkatkan daya blokir armor mereka terhadap musuh tersebut sebanyak %1$d-%2$d selama 5 giliran.\n\nMantra ini tidak memerlukan waktu untuk dirapalkan, tapi tidak dapat digunakan terhadap beberapa target secara bersamaan.
actors.hero.spells.shieldoflight$shieldoflighttracker.name=perisai cahaya
actors.hero.spells.shieldoflight$shieldoflighttracker.desc=Perisai cahaya tipis berdiri di antara karakter ini dan musuh. Perisai itu tidak cukup kuat untuk memblokir serangan secara langsung, tetapi akan melemahkannya.\n\nGiliran Tersisa: %s

actors.hero.spells.spiritform.name=bentuk roh
actors.hero.spells.spiritform.short_desc=Menetapkan Trinitas ke suatu cincin atau artefak.
actors.hero.spells.spiritform.desc=Ulama memilih cincin atau artefak yang telah mereka identifikasi pada putaran ini (kecuali kitab suci) dan memberikan efeknya kepada Trinitas.\n\nJika cincin dipilih, maka Trinitas memberikan efek cincin tersebut pada +%1$d selama 20 giliran.\n\nJika artefak dipilih, maka Trinitas mereplikasi efek Artefak tersebut pada +%2$d. Setiap artefak memiliki perilaku spesifik dan biaya daya armor yang berbeda saat digunakan dengan Trinitas.\n\nMantra ini menggantikan efek roh lain yang saat ini diberikan kepada Trinitas.
actors.hero.spells.spiritform$spiritformbuff.name=bentuk roh
actors.hero.spells.spiritform$spiritformbuff.desc=Bentuk roh Trinitas saat ini memberimu kekuatan dari sebuah item, seolah-olah kamu telah melengkapinya,\n\nPerlu diingat bahwa bentuk roh tidak dapat memberikan salinan lain dari efek yang sudah kamu dapatkan manfaatnya.\n\nEfek Saat Ini: %1$s.\n\nGiliran Tersisa: %2$s.

actors.hero.spells.smite.name=memukul
actors.hero.spells.smite.short_desc=Dijamin kena dengan bonus damage dan kekuatan enchantment.
actors.hero.spells.smite.desc=Paladin memasukkan kekuatan penghancur yang adil ke dalam serangan jarak dekat.\n\nSelain menghasilkan damage jarak dekat biasa, Memukul membuat serangan tanpa beban dijamin kena, memiliki +300%% kekuatan enchantment, dan menghasilkan %1$d - %2$d bonus damage sihir.\n\nBonus damage sihir saat memukul berskala dengan level Paladin, dan akan selalu menghasilkan bonus damage sihir maksimum terhadap musuh mayat hidup atau iblis.

actors.hero.spells.stasis.name=statis
actors.hero.spells.stasis.short_desc=Menghapus sekutu dari terungku dan melestarikannya.
actors.hero.spells.stasis.desc=Ulama memfokuskan koneksi mereka dengan sekutu mereka ke arah diri mereka sendiri, menyebabkan sekutu tersebut untuk sementara ditahan dalam semacam stasis energi di dalam Ulama. Sekutu tersebut akan dipertahankan hingga %d giliran, dengan semua efek positif pada mereka tidak terpengaruh oleh waktu mereka dalam stasis.\n\nSekutu tersebut akan muncul di sebelah Ulama ketika stasis berakhir secara alami atau mereka dapat langsung merapal ulang mantra tanpa biaya untuk mengakhiri efek lebih awal. Stasis bahkan dapat menggerakkan sekutu yang tidak bergerak, tetapi tidak dapat memindahkan mereka antar lantai.
actors.hero.spells.stasis$stasisbuff.name=sekutu dalam keadaan statis
actors.hero.spells.stasis$stasisbuff.left_behind=Sekutumu yang tak bisa bergerak tertinggal.
actors.hero.spells.stasis$stasisbuff.desc=Ulama saat ini memiliki sekutu yang tersimpan dalam stasis. Semua efek positif pada sekutu ini dipertahankan, termasuk Kekuatan Banyak, dan akan muncul kembali di samping Ulama saat efeknya berakhir. Efeknya juga dapat diakhiri lebih awal dengan menggunakan kembali Stasis.\n\nSekutu dalam stasis: %1$s.\nGiliran Tersisa: %2$s.

actors.hero.spells.sunray.name=sinar mentari
actors.hero.spells.sunray.short_desc=Memberikan damage sihir jarak jauh dan membutakan target sekali.
actors.hero.spells.sunray.desc=Ulama menembakkan sinar cahaya yang menyilaukan ke sasaran, memberikan %1$d-%2$d damage dan membutakan mereka selama %3$d giliran. Sinar Mentari selalu memberikan damage maksimum ke sasaran mayat hidup dan iblis.\n\nSetelah terkena mantra ini, penglihatan musuh akan menyesuaikan diri, mencegah mereka dibutakan lagi. Namun, jika mereka terkena lagi saat dibutakan oleh mantra ini, maka cahayanya akan sangat kuat dan melumpuhkan mereka.

actors.hero.spells.walloflight.name=dinding cahaya
actors.hero.spells.walloflight.short_desc=Membuat tembok yang menghalangi musuh.
actors.hero.spells.walloflight.desc=Paladin menciptakan dinding yang terbuat dari panel cahaya padat tepat di depan mereka yang tebalnya 1 petak, lebarnya %1$d petak, dan bertahan selama 20 giliran.\n\nDinding ini berfungsi seperti dinding biasa, kecuali dapat dilihat tembus pandang. Musuh yang terperangkap di dinding saat dinding dibuat akan lumpuh sesaat dan terdorong mundur jika memungkinkan. Apapun yang tersangkut di dinding akan dapat keluar darinya.\n\nDinding dapat dilemparkan ke salah satu dari empat arah mata angin atau empat arah diagonal. Jika dinding sudah aktif, mantra dapat digunakan kembali secara gratis untuk langsung membersihkan dinding.
actors.hero.spells.walloflight.early_end=Kamu menghilangkan dinding cahaya.
actors.hero.spells.walloflight$lightwall.desc=Panel cahaya yang berkilau menghalangi jalan ke sini.

##main hero
actors.hero.hero.name=kamu
actors.hero.hero.leave=Kamu belum bisa pergi, sisa terungku menunggu di bawah!
actors.hero.hero.level_up=Naik level!
actors.hero.hero.new_level=Naik level! +Akurasi, +Penghindaran, +5 Darah!
actors.hero.hero.new_talent=+1 Poin Talent!
actors.hero.hero.unspent=Kamu punya poin bakat yang belum digunakan!
actors.hero.hero.level_cap=Kamu tak bisa tumbuh lebih kuat, tapi pengalaman yang kamu dapat pasti memberimu lonjakan kekuatan!
actors.hero.hero.you_now_have=kamu mengambil: %s
actors.hero.hero.you_cant_have=kamu tidak bisa membawa: %s
actors.hero.hero.locked_chest=Peti ini terkunci dan kamu tidak memiliki kunci yang cocok.
actors.hero.hero.locked_door=Kamu tidak memiliki kunci yang cocok.
actors.hero.hero.noticed_smth=Kamu melihat sesuatu.
actors.hero.hero.wait=...
actors.hero.hero.search=mencari
actors.hero.hero.search_distracted=Sangat sulit berkonsentrasi, mencari itu melelahkan.
actors.hero.hero.key_distracted=Kamu tidak bisa membuka kuncinya, kamu harus terus mencoba.
actors.hero.hero.pain_resist=Rasa sakit membantumu menahan keinginan untuk tidur.
actors.hero.hero.revive=Ankh meledak dan memberikanmu energi kehidupan!

##classes
actors.hero.heroclass.warrior=pendekar
actors.hero.heroclass.warrior_desc_short=Pendekar menahan lebih banyak damage dengan perisai yang diberikan oleh _segel rusaknya._ Segel dapat dipindahkan di antara armor dan _mentransfer satu peningkatan._
actors.hero.heroclass.warrior_desc=Pendekar memulai dengan _segel rusak unik_ yang memberinya ledakan perisai saat kesehatannya dibawah setengah. Segel dapat dipindahkan di antara armor, dan dapat _mentransfer satu peningkatan_ dengan itu.\n\nPendekar juga memulai dengan sebuah _pedang pendek usang_, _tiga batu lempar_, armor kain, kantong air, dan kantong kecil.\n\nPendekar secara otomatis mengidentifikasi:\n_-_ Gulungan Identifikasi\n_-_ Ramuan Penyembuhan\n_-_ Gulungan Kemarahan
actors.hero.heroclass.warrior_unlock=Pendekar secara otomatis terbuka.

actors.hero.heroclass.mage=penyihir
actors.hero.heroclass.mage_desc_short=Penyihir adalah ahli sihir dan membawa _tongkat magis_ yang lebih kuat dari tongkat sihir. Tongkat dapat _dijiwai dengan tongkat sihir apa pun_ yang ditemukan Penyihir.
actors.hero.heroclass.mage_desc=Penyihir memulai dengan _tongkat unik_, yang mengisi ulang lebih cepat dari tongkat sihir biasa, dan memiliki 1 daya tambahan. Tongkat ini _dapat dijiwai dengan tongkat sihir apa pun_ yang ditemukan oleh penyihir di terungku.\n\nPenyihir juga memulai dengan sebuah _tongkat sihir misil magis_ yang dijiwai di tongkatnya, armor kain, kantong air, dan kantong kecil.\n\nPenyihir secara otomatis mengidentifikasi:\n_-_ Gulungan Identifikasi\n_-_ Ramuan Api Cair\n_-_ Gulungan Peningkatan
actors.hero.heroclass.mage_unlock=Untuk membuka Penyihir _gunakan gulungan peningkatan untuk membuat item lebih kuat._

actors.hero.heroclass.rogue=pengembara
actors.hero.heroclass.rogue_desc_short=Pengembara bisa menghindari serangan dan musuh dengan menjadi tak terlihat menggunakan _jubah bayangan,_ dia juga mampu _mendeteksi rahasia dan jebakan_ dengan jangkauan yang lebih luas.
actors.hero.heroclass.rogue_desc=Pengembara memulai dengan _Jubah Bayangan unik_, yang dapat ia pakai untuk menjadi tembus pandang kapan pun ia mau.\n\nPengembara dapat _mendeteksi rahasia dan jebakan_ dari jarak yang lebih jauh.\n\nPengembara juga memulai dengan _sebuah belati_, _tiga pisau lempar_, armor kain, kantong air, dan kantong kecil.\n\nPengembara secara otomatis sudah mengidentifikasi:\n_-_ Gulungan Identifikasi\n_-_ Ramuan Tembus Pandang\n_-_ Gulungan Peta Sihir
actors.hero.heroclass.rogue_unlock=Untuk membuka  Pengembara _lakukan 10 serangan mendadak dalam satu permainan._

actors.hero.heroclass.huntress=pemburu
actors.hero.heroclass.huntress_desc_short=Pemburu adalah ahli senjata lempar dan memiliki _busur ajaib_ dengan panah tak terbatas. Dia juga mampu melewati rumput tinggi _tanpa menginjaknya._
actors.hero.heroclass.huntress_desc=Pemburu memulai dengan _ busur roh unik _, yang dapat menembakkan anak panah ajaib dengan jumlah yang tak terbatas.\n\nPemburu dapat melewati rumput tinggi _tanpa menginjaknya_.\n\nPemburu juga memulai dengan _sarung tangan tajam_, armor kain, kantong air, dan kantong kecil.\n\nPemburu secara otomatis sudah mengindentifikasi:\n_-_ Gulungan Identifikasi\n_-_ Ramuan Melihat Pikiran\n_-_ Gulungan Nina Bobo
actors.hero.heroclass.huntress_unlock=Untuk membuka Pemburu _serang musuh dengan senjata lempar sebanyak 10 kali dalam satu permainan._

actors.hero.heroclass.duelist=duelis
actors.hero.heroclass.duelist_desc_short=Duelis adalah ahli senjata yang dapat menggunakan senjatanya untuk memicu _ kemampuan senjata khusus._ Kemampuan khusus ini berbeda untuk setiap senjata._
actors.hero.heroclass.duelist_desc=Duelis memulai dengan _rapier unik_ dengan kemampuan khusus yang mengisi ulang seiring waktu.\n\nSetiap senjata dalam game memiliki _kemampuan khusus yang berbeda_ yang dapat digunakan oleh Duelis.\n\nDuelis juga memulai dengan _dua duri lempar_, armor kain, kantong air, dan kantong kecil.\n\nDuelis secara otomatis mengidentifikasi:\n_-_ Gulungan Identifikasi\n_-_ Ramuan Kekuatan\n_-_ Gulungan Cerminan Diri
actors.hero.heroclass.duelist_unlock=Untuk membuka Duelis _gunakan senjata tingkat 2 atau lebih tinggi tanpa penalti kekuatan._

actors.hero.heroclass.cleric=ulama
actors.hero.heroclass.cleric_desc_short=Ulama adalah perapal mantra suci yang menggunakan _buku suci_ unik mereka untuk menyalurkan sihir suci. Mereka dapat _mempelajari dan meningkatkan mantra_ melalui bakat.
actors.hero.heroclass.cleric_desc=Ulama memulai dengan _kitab suci unik_, yang dapat mereka gunakan untuk merapal berbagai mantra.\n\nSebagian besar bakat Ulama difokuskan pada pembelajaran atau peningkatan mantra.\n\nUlama juga memulai dengan _pentungan_, armor kain, kantung air, dan kantong benih.\n\nUlama secara otomatis mengidentifikasi: \n_-_ Gulungan Identifikasi \n_-_ Ramuan Kemurnian \n_-_ Gulungan Penghapus Kutukan
actors.hero.heroclass.cleric_unlock=Untuk membuka ulama, _bersihkan sepenuhnya kutukan pada setiap perlengkapan yang terkena kutukan._

actors.hero.herosubclass.berserker=berserker
actors.hero.herosubclass.berserker_short_desc=_Berserker_ membangun amarah saat dia menerima damage. Kemarahan meningkatkan damage dan dapat diaktifkan pada 100% untuk bonus perisai.
actors.hero.herosubclass.berserker_desc=Berserker membangun kemarahan saat dia menerima damage fisik, termasuk damage yang ditahan oleh armornya! Kemarahan perlahan memudar dari waktu ke waktu, tetapi memudar lebih lambat jika HP-nya rendah.\n\nAmarah dapat menyebabkan Berserker memberikan damage hingga +50%. Pada tingkat amarah maksimal, ia dapat mengamuk, memperoleh ledakan perisai dan mempertahankan amarahnya selama perisainya masih tersisa. Perisai tersebut berskala dengan level armor Berserker, dan dapat ditingkatkan secara besar-besaran jika kesehatannya rendah. Berserker membutuhkan waktu untuk pulih setelah mengamuk.
actors.hero.herosubclass.gladiator=gladiator
actors.hero.herosubclass.gladiator_short_desc=_Gladiator_ membangun kombo saat dia berhasil melayangkan serangan. Dia bisa menggunakan kombo untuk menggunakan kemampuan unik.
actors.hero.herosubclass.gladiator_desc=Gladiator membangun satu titik kombo setiap kali dia berhasil melakukan serangan dengan senjata jarak dekat atau lempar. jika gladiator tidak berhasil melakukan serangan dalam 5 giliran (15 giliran setelah sekali membunuh), kombonya disetel ulang.\n\nSaat membangun kombo, Gladiator dapat menggunakan berbagai kemampuan yang dijamin kena:\n2 Kombo: memukul mundur musuh, mempertahankan kombo\n4 Kombo: memberikan damage berdasarkan armor\n6 Kombo: menangkis, mempertahankan kombo\n8 Kombo: damage ke target dan musuh di sekitarnya\n10 Kombo: menyerang satu kali untuk setiap kombo
actors.hero.herosubclass.battlemage=penyihir tarung
actors.hero.herosubclass.battlemage_short_desc=_Penyihir Tarung_ memunculkan efek bonus saat bertarung dalam jarak dekat dengan tongkatnya. Efek ini bergantung pada tongkat sihir yang menjiwai tongkatnya.
actors.hero.herosubclass.battlemage_desc=Penyihir Tarung mendapatkan efek bonus setiap kali dia menyerang dalam jarak dekat dengan tongkatnya, seolah-olah tongkatnya memiliki enchantment tambahan. Efek ini bergantung pada tongkat sihir yang dijiwai tongkatnya, setiap tongkat sihir memiliki efeknya sendiri-sendiri. Selain efek tongkat sihir, tongkat Penyihir Tarung juga akan mengisi 0,5 daya saat dia menyerang.
actors.hero.herosubclass.warlock=dukun
actors.hero.herosubclass.warlock_short_desc=_Dukun_ memiliki kesempatan untuk menandai jiwa musuh dengan tongkat sihirnya. Dia akan menyembuhkan setiap kali dia memberikan damage fisik pada musuh yang ditandai.
actors.hero.herosubclass.warlock_desc=Dukun memiliki kesempatan untuk memberikan tanda jiwa pada karakter ketika dia menggunakan tongkat sihir pada mereka. Peluang untuk menerapkan tanda jiwa dan durasinya meningkat seiring dengan level tongkat sihir.\n\nKetika musuh ditandai jiwa, Dukun akan menyembuhkan 2 darah untuk setiap 5 damage yang dia berikan kepada mereka, tetapi hanya dengan serangan dari jarak dekat atau senjata yang dilempar, bukan dari tongkat sihir!
actors.hero.herosubclass.assassin=pembunuh
actors.hero.herosubclass.assassin_short_desc=_Pembunuh_ dapat menyiapkan serangan mematikan saat dia tembus pandang. Semakin lama dia menunggu, semakin kuat serangannya.
actors.hero.herosubclass.assassin_desc=Pembunuh menyiapkan serangan berikutnya ketika dia menjadi tembus pandang. Semakin lama dia mempersiapkan serangannya, semakin kuat pula serangan berikutnya. Persiapan dapat dibangun sampai sebanyak 9 giliran.\n\nSetelah bersiap, Pembunuh memberikan bonus damage pada serangan berikutnya, dapat sekejap mata pindah ke sebelah targetnya, dan bahkan dapat membunuh musuh yang cukup lemah secara instan.
actors.hero.herosubclass.freerunner=pelari bebas
actors.hero.herosubclass.freerunner_short_desc=_Pelari Bebas_ membangun momentum saat ia berlari, yang dapat digunakan untuk memulai lari bebas. Kemampuan ini memberinya bonus kecepatan gerak dan penghindaran untuk sementara waktu.
actors.hero.herosubclass.freerunner_desc=Saat Pelari Bebas bergerak, dia membangun tumpukan momentum. Dia bisa mendapatkan hingga 10 momentum setelah berlari selama 10 giliran, tetapi akan dengan cepat hilang jika dia berhenti bergerak. Pelari Bebas dapat menggunakan momentumnya untuk memulai lari bebas, selama 2 giliran per poin momentum.\n\nSaat berlari bebas, Pelari Bebas bergerak dengan kecepatan 2x lipat, dan mendapatkan bonus penghindaran sebanding dengan levelnya. Setelah durasi lari bebas berakhir, akan ada cooldown sebelum momentum dapat dibangun kembali.
actors.hero.herosubclass.sniper=penembak jitu
actors.hero.herosubclass.sniper_short_desc=_Penembak Jitu_ bisa menembus armor dengan serangan jarak jauhnya. Setelah menyerang dengan senjata lempar, dia bisa melanjutkan dengan serangan khusus dari busurnya.
actors.hero.herosubclass.sniper_desc=Penembak Jitu adalah master dari serangan jarak jauh, yang mana serangan dia menembus armor musuh. Saat ia menyerang dengan senjata lempar, ia akan menempelkan tanda penembak jitu kepada musuh tersebut, yang mana pada serangan selanjutnya ia dapat  menyerang dengan serangan spesial dari busurnya. Serangan spesial ini bervariasi berdasarkan bagaimana busur itu diaugmentasi.\n\nBusur yang tidak diaugmentasi akan menembakkan serangan langsung yang mana akan mengurangi damage serangan, namun dapat digunakan tanpa menghabiskan giliran. Busur augmentasi cepat akan menembakkan serangan cepat yang damagenya dikurangi, dapat mengaktifkan enchantment, dan menghabiskan 1 giliran. Busur augmentasi damage akan menembakkan serangan jitu yang dijamin kena, memberikan bonus damage berdasarkan jarak serang, dan membutuhkan 2 giliran untuk menembaknya.
actors.hero.herosubclass.warden=penjaga
actors.hero.herosubclass.warden_short_desc=_Penjaga_ dapat melihat menembus rumput tinggi dan akan mendapat efek bonus saat ia menanam benih dan menginjak tanaman.
actors.hero.herosubclass.warden_desc=Penjaga memiliki hubungan yang kuat dengan alam memberinya berbagai efek bonus yang berkaitan dengan rumput dan tanaman. Ia dapat melihat menembus rumput tinggi dan berkerut seolah-olah itu adalah ruang kosong.\n\nPenjaga membuat rumput dapat tumbuh di sekitar benih yang ia lempar atau tanam, dan ia mendapatkan efek spesial ketika menginjak tanaman. Efek spesial itu akan menggantikan efek tanaman biasa, dengan kata lain tidak akan ada tanaman yang melukainya ketika diinjak.
actors.hero.herosubclass.champion=jagoan
actors.hero.herosubclass.champion_short_desc=_Jagoan_ dapat menggunakan dua senjata dan mendapat lebih banyak daya senjata. Serangan regulernya menggunakan senjata utamanya, tetapi dia dapat menukar senjata dan menggunakan kemampuan salah satu senjata tersebut.
actors.hero.herosubclass.champion_desc=Jagoan adalah ahli senjata jarak dekat yang dapat menggunakan senjata cadangan selain senjata utamanya. Serangan regulernya menggunakan senjata utamanya, tetapi dia dapat menukar senjata utamanya secara instan dan menggunakan kemampuan salah satu senjata tersebut.\n\nDia juga memperoleh 2 tambahan daya kemampuan senjata maksimal dan +50% kecepatan charge kemampuan senjata.
actors.hero.herosubclass.monk=biksu
actors.hero.herosubclass.monk_short_desc=_Biksu_ membangun energi saat bertarung. Energi ini bisa digunakan untuk berbagai kemampuan unik.
actors.hero.herosubclass.monk_desc=Biksu adalah ahli teknik fisik. Saat dia mengalahkan musuh, dia memperoleh energi yang dapat digunakan pada berbagai kemampuan bertahan dan berfokus pada utilitas. Energi ini tidak memudar seiring berjalannya waktu, tetapi memiliki batas berdasarkan level biksu.\n\n1 energi: serang cepat dengan tinju\n2 Energi: fokus untuk menghindari serangan berikutnya\n3 Energi: langsung berlari ke sekitar\n4 Energi: tendang musuh\n5 Energi: bermeditasi untuk membersihkan status dan memulihkan daya tongkat sihir & artefak
actors.hero.herosubclass.priest=pendeta
actors.hero.herosubclass.priest_short_desc=_Pendeta_ memperoleh mantra jarak jauh baru dan versi cahaya penuntun yang lebih kuat.
actors.hero.herosubclass.priest_desc=Pendeta mendapatkan berbagai mantra baru dan yang ditingkatkan yang menekankan pertarungan jarak jauh dan sinergi dengan item magis.\n\nPendeta dapat mengeluarkan _Cahaya Penuntun_ secara gratis sekali setiap 50 giliran, menerangi musuh yang menjadi target langsung salah satu mantra mereka, dan dapat memakai debuff penerangan dengan sekutu, tongkat sihir, dan beberapa artefak untuk bonus damage setara dengan level mereka + 5.\n\nPendeta juga mendapatkan mantra _Cahaya Penuntun_, yang menghilangkan kegelapan, dan memengaruhi semua musuh yang terlihat, memicu dan menerapkan penerangan, dan membuat mereka lumpuh sebentar dengan biaya 2 daya.
actors.hero.herosubclass.paladin=paladin
actors.hero.herosubclass.paladin_short_desc=_Paladin_ memperoleh mantra jarak pendek baru dan versi senjata suci dan perlindungan yang diperkuat.
actors.hero.herosubclass.paladin_desc=Paladin memperoleh berbagai mantra baru dan yang ditingkatkan yang menekankan pertarungan jarak dekat dan sinergi dengan senjata dan armor.\n\nMantra _Senjata Suci_ dan _Pelindung Suci_ milik Paladin memberikan bonus lebih besar, tidak lagi mengesampingkan enchantment dan glyph yang ada, dan dapat diperluas dengan merapal mantra lain.\n\nPaladin juga memperoleh mantra _Pemukul_, yang memungkinkan mereka melancarkan serangan jarak dekat yang dijamin dengan bonus damage dan kekuatan enchantment.

##talents
actors.hero.talent$provokedangertracker.name=kemarahan yang terprovokasi
actors.hero.talent$provokedangertracker.desc=Pendekar baru saja kehilangan perisainya, serangan fisik berikutnya akan menghasilkan damage bonus.\n\nGiliran tersisa: %s.
actors.hero.talent$lingeringmagictracker.name=sihir yang tersisa
actors.hero.talent$lingeringmagictracker.desc=Penyihir baru saja menggunakan tongkat atau tongkat sihir, serangan fisik berikutnya akan menghasilkan damage bonus.\n\nGiliran tersisa: %s.
actors.hero.talent$followupstriketracker.name=serangan lanjutan
actors.hero.talent$followupstriketracker.desc=Pemburu saat ini menyerang musuh dengan senjata lempar, serangan jarak dekat berikutnya terhadap target yang sama akan meningkatkan damage.\n\nGiliran tersisa: %s.
actors.hero.talent$patientstriketracker.name=serangan sabar
actors.hero.talent$patientstriketracker.desc=Duelis baru saja menghabiskan sebuah giliran untuk menunggu, serangan jarak dekat berikutnya akan menimbulkan damage tambahan.
actors.hero.talent$improvisedprojectilecooldown.name=cooldown improvisasi proyektil
actors.hero.talent$improvisedprojectilecooldown.desc=Kamu baru saja menggunakan bakat ini, dan harus menunggu sebelum dapat menggunakannya lagi.\n\nGiliran tersisa: %s.
actors.hero.talent$rejuvenatingstepscooldown.name=cooldown langkah pertumbuhan
actors.hero.talent$rejuvenatingstepscooldown.desc=Kamu baru saja menggunakan bakat ini, dan harus menunggu sebelum dapat menggunakannya lagi.\n\nGiliran tersisa: %s.
actors.hero.talent$seershotcooldown.name=cooldown tembakan penglihatan
actors.hero.talent$seershotcooldown.desc=Kamu baru saja menggunakan bakat ini, dan harus menunggu sebelum dapat menggunakannya lagi.\n\nGiliran tersisa: %s.
actors.hero.talent$aggressivebarriercooldown.name=cooldown penghalang agresif
actors.hero.talent$aggressivebarriercooldown.desc=Kamu baru saja menggunakan bakat ini, dan harus menunggu sebelum dapat menggunakannya lagi.\n\nGiliran tersisa: %s.
actors.hero.talent$liquidagilacctracker.name=cairan kelincahan
actors.hero.talent$liquidagilacctracker.desc=Serangan jarak dekat utama Duelis berikutnya akan mendapatkan bonus akurasi.\n\nGiliran tersisa: %s.
actors.hero.talent$lethalhastecooldown.name=cooldown pelarian mematikan
actors.hero.talent$lethalhastecooldown.desc=Kamu baru saja menggunakan bakat ini, dan harus menunggu sebelum dapat menggunakannya lagi.\n\nGiliran tersisa: %s.
actors.hero.talent$swiftequipcooldown.name=cooldown perlengkapan cepat
actors.hero.talent$swiftequipcooldown.desc=Kamu baru saja menggunakan bakat ini, dan harus menunggu sebelum dapat menggunakannya lagi.\n\nGiliran tersisa: %s.
actors.hero.talent$preciseassaulttracker.name=serangan tepat
actors.hero.talent$preciseassaulttracker.desc=Serangan jarak dekat utama Duelis berikutnya akan mendapatkan bonus akurasi.\n\nGiliran tersisa: %s.
actors.hero.talent$deadlyfollowuptracker.name=lanjutan mematikan
actors.hero.talent$deadlyfollowuptracker.desc=Duelis saat ini menyerang musuh dengan senjata lempar, serangan jarak dekat berikutnya terhadap target yang sama akan meningkatkan damage.\n\nGiliran tersisa: %s.
actors.hero.talent$combinedlethalityabilitytracker.executed=tereksekusi
actors.hero.talent$satiatedspellstracker.name=Mantra Pelindung
actors.hero.talent$satiatedspellstracker.desc=Mantra Ulama berikutnya akan memberi mereka sedikit perisai.
actors.hero.talent$searinglightcooldown.name=Cahaya Pembakar
actors.hero.talent$searinglightcooldown.desc=Kamu baru saja menggunakan bakat ini, dan harus menunggu sebelum dapat menggunakannya lagi.\n\nGiliran tersisa: %s.

#warrior
actors.hero.talent.hearty_meal.title=makanan yang sehat
actors.hero.talent.hearty_meal.desc=_+1:_ Memakan makanan akan menyembuhkan _4 HP_ Pendekar ketika darahnya berada pada atau di bawah 33%.\n\n_+2:_ Memakan makanan akan menyembuhkan  _6 HP_ Pendekar ketika darahnya berada pada atau di bawah 33%.
actors.hero.talent.veterans_intuition.title=naluri veteran
actors.hero.talent.veterans_intuition.desc=_+1:_ Pendekar mengidentifikasi senjata _1.75x lebih cepat_ dan armor _2.5x lebih cepat_.\n\n_+2:_ Pendekar mengidentifikasi senjata _2.5x lebih cepat_ dan armor _ketika dia menggunakannya_.
actors.hero.talent.provoked_anger.title=kemarahan yang terprovokasi
actors.hero.talent.provoked_anger.desc=_+1:_ Saat semua peningkatan perisai yang diberikan kepada Pendekar rusak karena damage, serangan fisik berikutnya akan memberikan _3 bonus damage_.\n\n_+2:_ Saat semua peningkatan perisai yang diberikan kepada Pendekar rusak karena damage, serangan fisik berikutnya akan memberikan _5 bonus damage_.
actors.hero.talent.iron_will.title=kemauan besi
actors.hero.talent.iron_will.desc=_ +1: _ Perisai yang diberikan oleh segel Pendekar _meningkat sebesar 1_.\n\n_ +2: _ Perisai yang diberikan oleh segel Pendekar _meningkat sebesar 2_.
actors.hero.talent.iron_will.meta_desc=_Jika bakat ini didapatkan oleh pahlawan yang berbeda,_ secara pasif akan memberikan versi perisai maksimal 1 atau 2 dari efek segel rusak Pendekar.

actors.hero.talent.iron_stomach.title=perut besi
actors.hero.talent.iron_stomach.desc=_+1:_  Pendekar hanya akan mengabiskan 1 giliran untuk makan dan akan memberinya _ketahanan damage sebesar 75%_ ketika sedang makan.\n\n_+2:_ Pendekar hanya akan mengabiskan 1 giliran untuk makan dan akan memberinya _ketahanan damage sebesar 100%_ ketika sedang makan.
actors.hero.talent.liquid_willpower.title=kemauan cair
actors.hero.talent.liquid_willpower.desc=_+1:_ Pendekar memperoleh _6,5% dari HP maksnya dalam perisai_ saat minum atau melempar ramuan, minuman, atau eliksir.\n\n_+2:_ Pendekar memperoleh _10% dari HP maksnya dalam perisai_ saat minum atau melempar ramuan, minuman, atau eliksir.\n\nJumlah perisai berlipat ganda saat menggunakan ramuan kekuatan, pengalaman, atau item racikan yang harus dibuat menggunakan ramuan tersebut.\n\nUntuk item racikan dengan jumlah keluaran yang lebih tinggi (misalnya seduhan air), bakat ini memiliki peluang terpicu berdasarkan berapa banyak item tersebut yang diproduksi.
actors.hero.talent.runic_transference.title=sihir pemindahan
actors.hero.talent.runic_transference.desc=_+1:_ Segel rusak Pendekar dapat mentransfer _glyph biasa_ sama seperti mentransfer peningkatan.\n\n_+2:_ Segel rusak Pendekar dapat mentransfer _glyph biasa, glyph kuat, dan glyph kutukan_ sama seperti mentransfer peningkatan.\n\nSegel tersebut hanya dapat mentransfer glyph jika diterapkan pada armor saat segel dipasang.
actors.hero.talent.runic_transference.meta_desc=_Jika bakat ini didapatkan oleh pahlawan yang berbeda_ itu akan membantu Glyph di armormu agar tidak dihilangkan oleh gulungan peningkatan. Glyph akan mulai hilang saat upgrade dari level 6 (naik dari 4) di +1, atau level 7 (naik dari 4) di +2. Level di mana Glyph dijamin akan hilang tidak berubah di +8.
actors.hero.talent.lethal_momentum.title=momentum mematikan
actors.hero.talent.lethal_momentum.desc=_+1:_ Saat Pendekar mengalahkan musuh dengan senjata fisik, ada _peluang sebesar 67%_ serangan itu tidak memakan giliran sama sekali.\n\n_+2:_ Saat Pendekar mengalahkan musuh dengan senjata fisik, ada _peluang sebesar 100%_ serangan itu tidak memakan giliran sama sekali.
actors.hero.talent.improvised_projectiles.title=improvisasi proyektil
actors.hero.talent.improvised_projectiles.desc=_+1:_ Pendekar dapat membutakan musuh selama _2 giliran_ dengan melempar barang apa pun yang bukan senjata jarak jauh ke arah mereka. Memiliki cooldown selama 50 giliran.\n\n_+2:_ Pendekar dapat membutakan musuh selama _3 giliran_ dengan melempar barang apa pun yang bukan senjata jarak jauh ke arah mereka. Memiliki cooldown selama 50 giliran.

actors.hero.talent.hold_fast.title=tahan posisi
actors.hero.talent.hold_fast.desc=_+1:_ Saat Pendekar menunggu, ia mendapatkan _1-2 armor_ dan memperlambat penurunan buff kombo dan perisai sebesar _50%_ hingga ia bergerak.\n\n_+2:_ Saat Pendekar menunggu, ia mendapatkan _2-4 armor_ dan memperlambat penurunan buff kombo dan perisai sebesar _75%_ hingga ia bergerak.\n\n_+3:_ Saat Pendekar menunggu, ia mendapatkan _3-6 armor_ dan memperlambat penurunan buff kombo dan perisai sebesar _100%_ hingga ia bergerak.
actors.hero.talent.strongman.title=orang kuat
actors.hero.talent.strongman.desc=_+1:_ Kekuatan Pendekar _meningkat sebesar 8%_, dibulatkan ke bawah.\n\n_+2:_ Kekuatan Pendekar _meningkat sebesar 13%_, dibulatkan ke bawah.\n\n_+3:_ Kekuatan Pendekar _meningkat sebesar 18%_, dibulatkan ke bawah.

actors.hero.talent.endless_rage.title=kemarahan tak berujung
actors.hero.talent.endless_rage.desc=_+1:_ Berserker bisa mencapai maksimal _116% kemarahan_.\n\n_+2:_ Berserker bisa mencapai maksimal _133% kemarahan_.\n\n_+3:_ Berserker bisa mencapai maksimal _150% kemarahan_.\n\nSetiap poin kemarahan di atas 100% meningkatkan perisai kemarahan sebesar 1% dan mengurangi cooldown sebesar 1%, tetapi tidak meningkatkan bonus damage melebihi +50%.
actors.hero.talent.deathless_fury.title=kemarahan tanpa kematian
actors.hero.talent.deathless_fury.desc=_+1:_ Kemarahan otomatis terpicu jika Berserker mati dan amarahnya berada pada atau di atas 100%, tetapi memiliki cooldown _3 level hero_ saat ini terjadi.\n\n_+2:_ Kemarahan secara otomatis terpicu jika Berserker  mati dan amarahnya berada pada atau di atas 100%, tetapi memiliki cooldown _2 level hero_ saat ini terjadi.\n\n_+3:_ Kemarahan secara otomatis terpicu jika Berserker mati dan amarahnya berada pada atau di atas 100%, tetapi memiliki cooldown _1 hero level_ saat ini terjadi.\n\nPerhatikan bahwa Berserker akan tetap mati jika dia memiliki 0 HP saat kemarahan berakhir.
actors.hero.talent.enraged_catalyst.title=katalis kemarahan
actors.hero.talent.enraged_catalyst.desc=_+1:_ Enchantment dan kutukan dari senjata Berserker akan lebih sering aktif saat kemarahannya semakin menumpuk, dengan batas maksimum sebesar _15% lebih sering aktif_ pada 100% kemarahan.\n\n_+2:_ Enchantment dan kutukan dari senjata Berserker akan lebih sering aktif saat kemarahannya semakin menumpuk, dengan batas maksimum sebesar _30% lebih sering aktif_ pada 100% kemarahan.\n\n_+3:_ Enchantment dan kutukan dari senjata Berserker akan lebih sering aktif saat kemarahannya semakin menumpuk, dengan batas maksimum sebesar _45% lebih sering aktif_ pada 100% kemarahan.

actors.hero.talent.cleave.title=membelah
actors.hero.talent.cleave.desc=_+1:_ Waktu tambahan Gladiator saat membunuh ditingkatkan menjadi _30 giliran_, dari 15.\n\n_+2:_ Waktu tambahan Gladiator saat membunuh ditingkatkan menjadi _45 giliran_, dari 15.\n\n_+3:_ Waktu tambahan Gladiator saat membunuh ditingkatkan menjadi _60 giliran_, dari 15.
actors.hero.talent.lethal_defense.title=pertahanan mematikan
actors.hero.talent.lethal_defense.desc=_+1:_ Saat Gladiator membunuh musuh dengan gerakan kombo, cooldown pada perisai segel rusaknya _dikurangi sebesar 50 giliran_.\n\n_+2:_ Saat Gladiator membunuh musuh dengan gerakan kombo, cooldown pada perisai segel rusaknya _dikurangi sebesar 100 giliran_.\n\n_+3:_ Saat Gladiator membunuh musuh dengan gerakan kombo, cooldown pada perisai segel rusaknya _dikurangi sebesar 150 giliran_.\n\nCooldown perisai dapat dikurangi hingga serendah 100 giliran oleh bakat ini, yang berarti akan segera tersedia lagi setelah diaktifkan.
actors.hero.talent.enhanced_combo.title=kombo yang ditingkatkan
actors.hero.talent.enhanced_combo.desc=_+1:_ Saat jumlah kombo Gladiator 7 atau lebih, jarak pukulan mundur saat menyerang dari udara meningkat menjadi 3 petak, menimbulkan efek pusing , dan bisa menjatuhkan musuh ke jurang.\n\n_+2:_ Selain keuntungan bakat +1, ketika kombo Gladiator 9 atau lebih, dapat Menangkis beberapa serangan. \n\n_+3:_ Selain keuntungan bakat +1 dan +2, Gladiator bisa melompat hingga kombo/3 petak saat  Membanting, Meremukkan, atau Mengamuk.

actors.hero.talent.body_slam.title=hantaman badan
actors.hero.talent.body_slam.desc=_+1:_ Saat Pendekar mendarat setelah melompat, semua musuh di sekelilingnya menerima damage sebesar _1-4 plus 25%_ dari kekuatan pertahanan damage miliknya.\n\n_+2:_ Saat Pendekar mendarat setelah melompat, semua musuh di sekelilingnya menerima damage sebesar _2-8 plus 50%_ dari kekuatan pertahanan damage miliknya.\n\n_+3:_ Saat Pendekar mendarat setelah melompat, semua musuh di sekelilingnya menerima damage sebesar _3-12 plus 75%_ dari kekuatan pertahanan damage miliknya.\n\n_+4:_ Saat Pendekar mendarat setelah melompat, semua musuh di sekelilingnya menerima damage sebesar _4-16 plus 100%_ dari kekuatan pertahanan damage miliknya.
actors.hero.talent.impact_wave.title=gelombang benturan
actors.hero.talent.impact_wave.desc=_+1:_ Saat Pendekar mendarat setelah melompat, semua musuh di sekeliling akan terlempar _2 petak_ ke belakang dan memiliki _peluang 25%_ untuk menjadi rentan selama 5 giliran.\n\n_+2:_ Saat Pendekar mendarat setelah melompat, semua musuh di sekeliling akan terlempar _3 petak_ ke belakang dan memiliki _peluang 50%_ untuk menjadi rentan selama 5 giliran.\n\n_+3:_ Saat Pendekar mendarat setelah melompat, semua musuh di sekeliling akan terlempar _4 petak_ ke belakang dan memiliki _peluang 75%_ untuk menjadi rentan selama 5 giliran.\n\n_+4:_ Saat Pendekar mendarat setelah melompat, semua musuh di sekeliling akan terlempar _5 petak_ ke belakang dan memiliki _peluang 100%_ untuk menjadi rentan selama 5 giliran.
actors.hero.talent.double_jump.title=lompatan ganda
actors.hero.talent.double_jump.desc=_+1:_ Jika Pendekar melakukan lompatan kedua dalam 3 giliran, lompatan tersebut akan _mengurangi 16%_ biaya daya.\n\n_+2:_ Jika Pendekar melakukan lompatan kedua dalam 3 giliran, lompatan tersebut akan _mengurangi 30%_ biaya daya.\n\n_+3:_ Jika Pendekar melakukan lompatan kedua dalam 3 giliran, lompatan tersebut akan _mengurangi 40%_ biaya daya.\n\n_+4:_ Jika Pendekar melakukan lompatan kedua dalam 3 giliran, lompatan tersebut akan _mengurangi 50%_ biaya daya.

actors.hero.talent.expanding_wave.title=gelombang yang meluas
actors.hero.talent.expanding_wave.desc=_+1:_ Jangkauan gelombang kejut ditingkatkan menjadi _6 petak_ dari 5, dan lebarnya ditingkatkan menjadi _75 derajat_ dari 60.\n\n_+2:_ Jangkauan gelombang kejut ditingkatkan menjadi _7 petak_ dari 5, dan lebarnya ditingkatkan menjadi _90 derajat_ dari 60.\n\n_+3:_ Jangkauan gelombang kejut ditingkatkan menjadi _8 petak_ dari 5, dan lebarnya ditingkatkan menjadi _105 derajat_ dari 60.\n\n_+4:_ Jangkauan gelombang kejut ditingkatkan menjadi _9 petak_ dari 5, dan lebarnya ditingkatkan menjadi _120 derajat_ dari 60.
actors.hero.talent.striking_wave.title=gelombang serangan
actors.hero.talent.striking_wave.desc=_+1:_ Gelombang kejut memiliki _30% peluang_ untuk juga menggunakan efek serangan seperti enchantment dan kombo.\n\n_+2:_Gelombang kejut  memiliki _60% peluang_ untuk juga menggunakan efek serangan seperti enchantment dan kombo.\n\n_+3:_Gelombang kejut  memiliki _90% peluang_ untuk juga menggunakan efek serangan seperti enchantment dan kombo.\n\n_+4:_ Gelombang kejut memiliki _100% peluang_ untuk juga menggunakan efek serangan seperti enchantment dan kombo, dan memberikan _+20% kekuatan_ enchantment.
actors.hero.talent.shock_force.title=tenaga kejut
actors.hero.talent.shock_force.desc=_+1:_Gelombang kejut memberikan _20% damage tambahan_ dan mempunyai _peluang 25%_ untuk melumpuhkan musuh.\n\n_+2:_Gelombang kejut memberikan _40% damage tambahan_ dan mempunyai _peluang 50%_ untuk melumpuhkan musuh.\n\n_+3:_Gelombang kejut memberikan _60% damage tambahan_ dan mempunyai _peluang 75%_ untuk melumpuhkan musuh.\n\n_+4:_Gelombang kejut memberikan _80% damage tambahan_ dan mempunyai _peluang 100%_ untuk melumpuhkan musuh.

actors.hero.talent.sustained_retribution.title=hukuman berkelanjutan
actors.hero.talent.sustained_retribution.desc=_+1:_ Pendekar memberikan _115% bonus damage_ yang tersebar di _2 serangan_, yang asalnya hanya 100% bonus damage dalam 1 serangan.\n\n_+2:_ Pendekar memberikan _130% bonus damage_ yang tersebar di _3 serangan_, yang asalnya hanya 100% bonus damage dalam 1 serangan.\n\n_+3:_ Pendekar memberikan _145% bonus damage_ yang tersebar di _4 serangan_, yang asalnya hanya 100% bonus damage dalam 1 serangan.\n\n_+4:_ Pendekar memberikan _160% bonus damage_ yang tersebar di _5 serangan_, yang asalnya hanya 100% bonus damage dalam 1 serangan.
actors.hero.talent.shrug_it_off.title=abaikan saja
actors.hero.talent.shrug_it_off.desc=_+1:_ Pengurangan damage Pendekar saat bertahan _meningkat menjadi 60%_, dari 50%.\n\n_+2:_ Pengurangan damage Pendekar saat bertahan _meningkat menjadi 68%_, dari 50%.\n\n_+3:_ Pengurangan damage Pendekar saat bertahan _meningkat menjadi 74%_, dari 50%.\n\n_+4:_ Pengurangan damage Pendekar saat bertahan _meningkat menjadi 80%_, dari 50%.
actors.hero.talent.even_the_odds.title=menggenapkan ganjil
actors.hero.talent.even_the_odds.desc=_+1:_ Pendekar memberikan tambahan _5% bonus damage_ untuk setiap musuh dalam 2 petak saat pertahanan berakhir.\n\n_+2:_ Pendekar memberikan tambahan _10% bonus damage_ untuk setiap musuh dalam 2 petak saat pertahanan berakhir.\n\n_+3:_ Pendekar memberikan tambahan _15% bonus damage_ untuk setiap musuh dalam 2 petak saat pertahanan berakhir.\n\n_+4:_ Pendekar memberikan tambahan _20% bonus damage_ untuk setiap musuh dalam 2 petak saat pertahanan berakhir.

#mage
actors.hero.talent.empowering_meal.title=makanan yang bertenaga
actors.hero.talent.empowering_meal.desc=_+1:_ Memakan makanan memberi Penyihir _2 tambahan damage_ pada 3 tembakan tongkat sihir berikutnya.\n\n_+2:_ Memakan makanan memberi Penyihir _3 tambahan damage_ pada 3 tembakan tongkat sihir berikutnya.
actors.hero.talent.scholars_intuition.title=naluri pelajar
actors.hero.talent.scholars_intuition.desc=_+1:_ Penyihir mengidentifikasi tongkat sihir _3x lebih cepat_.\n\n_+2:_ Penyihir mengidentifikasi tongkat sihir _saat dia menggunakannya_.
actors.hero.talent.lingering_magic.title=sihir yang tersisa
actors.hero.talent.lingering_magic.desc=_+1:_ Saat Penyihir menyerang dengan tongkat sihir atau tongkatnya, serangan fisik berikutnya menimbulkan _1-2 bonus damage_.\n\n_+2:_ Saat Mage menyerang dengan tongkat sihir atau tongkatnya, serangan fisik berikutnya menimbulkan _2 bonus damage_.
actors.hero.talent.backup_barrier.title=penghalang cadangan
actors.hero.talent.backup_barrier.desc=_+1:_ Penyihir mendapatkan _3 perisai_ setiap kali ia memakai daya terakhir di tongkatnya.\n\n_+2:_ Penyihir mendapatkan _5 perisai_ setiap kali ia memakai daya terakhir di tongkatnya.
actors.hero.talent.backup_barrier.meta_desc=_Jika bakat ini didapatkan oleh pahlawan lain_ bakat ini akan terpicu dari tongkat sihir level tertinggi milik pahlawan.

actors.hero.talent.energizing_meal.title=makanan yang berenergi
actors.hero.talent.energizing_meal.desc=_+1:_ Penyihir hanya membutuhkan 1 giliran untuk makan dan makan akan memberikan ia _5 giliran isi ulang tongkat sihir_.\n\n_+2:_ Penyihir hanya membutuhkan 1 giliran untuk makan dan makan akan memberikan ia _8 giliran isi ulang tongkat sihir_.
actors.hero.talent.inscribed_power.title=kekuatan tertulis
actors.hero.talent.inscribed_power.desc=_+1:_ Ketika Penyihir membaca sebuah gulungan atau menggunakan item mantra, _2 serangan tongkat sihir berikutnya_ mendapat +2 level. \n\n_+2:_ Ketika Penyihir membaca sebuah gulungan atau menggunakan item mantra, _3 serangan tongkat sihir berikutnya_ mendapat +2 level. \n\nJumlah serangan tongkat sihir menjadi dua kali lipat saat membaca gulungan peningkatan, pengubah, enchantment, atau metamorfosis.\n\nUntuk item racikan dengan jumlah keluaran lebih tinggi (misalnya sebagian besar mantra), bakat ini memiliki peluang terpicu berdasarkan berapa banyak item tersebut dibuat.
actors.hero.talent.wand_preservation.title=pelestarian tongkat sihir
actors.hero.talent.wand_preservation.desc=_+1:_ Saat Penyihir menjiwai tongkat baru ke tongkatnya, tongkat lama dikembalikan pada +0, _tapi ini hanya bisa dilakukan sekali._\n\n_+2:_ Ketika Penyihir menjiwai tongkat baru ke tongkatnya, tongkat lama dikembalikan pada +0, _ini dapat dilakukan berulang kali dengan cooldown satu level pahlawan._
actors.hero.talent.wand_preservation.meta_desc=_Jika bakat ini didapatkan oleh pahlawan yang berbeda _ akan meningkatkan jumlah getah sihir yang diperoleh saat memasukkan tongkat ke dalam panci peracik sebanyak 1 pada +1, atau sebanyak 2 pada +2.
actors.hero.talent.arcane_vision.title=penglihatan ajaib
actors.hero.talent.arcane_vision.desc=_+1:_ Ketika Penyihir menembak musuh, ia dapat melihat pikiran mereka selama _10 giliran_.\n\n_+2:_ Ketika Penyihir menembak musuh, ia dapat melihat pikiran mereka selama _15 giliran_.
actors.hero.talent.shield_battery.title=baterai perisai
actors.hero.talent.shield_battery.desc=_+1:_ Penyihir dapat menargetkan diri sendiri dengan tongkat sihir untuk mengubah semua daya menjadi perisai sebesar _4% max HP tiap daya-nya_.\n\n_+2:_ Penyihir dapat menargetkan diri sendiri dengan tongkat sihir untuk mengubah semua daya menjadi perisai sebesar _6% max HP tiap daya-nya_.

actors.hero.talent.desperate_power.title=kekuatan putus asa
actors.hero.talent.desperate_power.desc=_+1:_ Tongkat sihir dan tongkat Penyihir mendapat _+1 level_ pada tembakan terakhir mereka ketika mereka sampai pada daya terakhir. \n\n_+2:_ Tongkat sihir dan tongkat Penyihir mendapat _+2 level_ pada tembakan terakhir mereka ketika mereka sampai pada daya terakhir. \n\n_+3:_ Tongkat sihir dan tongkat Penyihir mendapat _+3 level_ pada tembakan terakhir mereka ketika mereka sampai pada daya terakhir.
actors.hero.talent.ally_warp.title=pemindahan sekutu
actors.hero.talent.ally_warp.desc=_+1:_ Penyihir dapat memilih sekutu untuk langsung bertukar tempat dengan mereka, dengan _2 rentang ubin_.\n\n_+2:_ Penyihir dapat memilih sekutu untuk langsung bertukar tempat dengan mereka, dengan _4 rentang ubin_.\n\n_+3:_ Penyihir dapat memilih sekutu untuk langsung bertukar tempat dengan mereka, dengan _6 rentang ubin_.

actors.hero.talent.empowered_strike.title=serangan yang dikuatkan
actors.hero.talent.empowered_strike.desc=_+1:_ Serangan jarak dekat pertama Penyihir Tarung setelah menembak dengan tongkatnya memberikan _+16% damage_ dan efek bonus tongkat mendapat _+50% kekuatan_.\n\n_+2:_ Serangan jarak dekat pertama Penyihir Tarung setelah menembak dengan tongkatnya memberikan _+33% damage_ dan efek bonus tongkat mendapat _+100% kekuatan_.\n\n_+3:_ Serangan jarak dekat pertama Penyihir Tarung setelah menembak dengan tongkatnya memberikan _+50% damage_ dan efek bonus tongkat mendapat _+150% kekuatan_.
actors.hero.talent.mystical_charge.title=daya mistis
actors.hero.talent.mystical_charge.desc=_+1:_ Ketika menyerang dengan tongkatnya, Penyihir Tarung mendapatkan isi ulang artefak setara dengan _0.5 giliran_.\n\n_+2:_ Ketika menyerang dengan tongkatnya, Penyihir Tarung mendapatkan isi ulang artefak setara dengan _1 giliran_.\n\n_+3:_ Ketika menyerang dengan tongkatnya, Penyihir Tarung mendapatkan isi ulang artefak setara dengan _1.5 giliran_.
actors.hero.talent.excess_charge.title=daya berlebih
actors.hero.talent.excess_charge.desc=_+1:_ Saat tongkat Penyihir Tarung terisi penuh, serangan berikutnya akan memberinya _0,67 perisai_ per level tongkat.\n\n_+2:_ Saat tongkat Penyihir Tarung terisi penuh, serangan berikutnya akan memberinya _1,33 perisai_ per level tongkat.\n\n_+3:_ Saat tongkat Penyihir Tarung terisi penuh, serangan berikutnya akan memberinya _2 perisai_ per level tongkat.

actors.hero.talent.soul_siphon.title=penyerap jiwa
actors.hero.talent.soul_siphon.desc=_+1:_ Serangan fisik yang ditimbulkan oleh karakter lain memicu tanda jiwa Dukun pada _13% efektivitas_.\n\n_+2:_ Serangan fisik yang ditimbulkan oleh karakter lain memicu tanda jiwa Dukun pada _27% efektivitas_.\n\n_+3:_ Serangan fisik yang ditimbulkan oleh karakter lain memicu tanda jiwa Dukun pada _40% efektivitas_.
actors.hero.talent.soul_eater.title=pemakan jiwa
actors.hero.talent.soul_eater.desc=_+1:_ Tanda jiwa memberikan _0.33 giliran_ rasa kenyang setiap kali ia memberikan damage pada musuh. Musuh yang ditandai jiwa memiliki _peluang 10%_ untuk mengaktifkan efek bakat yang berhubungan dengan makan saat mereka mati.\n\n_+2:_ Tanda jiwa memberikan _0.67 giliran_ rasa kenyang setiap kali ia memberikan damage pada musuh. Musuh yang ditandai jiwa memiliki _peluang 20%_ untuk mengaktifkan efek bakat yang berhubungan dengan makan saat mereka mati.\n\n_+3:_ Tanda jiwa memberikan _1 giliran_ rasa kenyang setiap kali ia memberikan damage pada musuh. Musuh yang ditandai jiwa memiliki _peluang 30%_ untuk mengaktifkan efek bakat yang berhubungan dengan makan saat mereka mati.
actors.hero.talent.necromancers_minions.title=anak buah necromancer
actors.hero.talent.necromancers_minions.desc=_+1:_ Saat musuh yang memiliki tanda jiwa mati, Dukun memilki _peluang 13%_ untuk membangkitkan mereka sebagai hantu yang dirusak.\n\n_+2:_ Saat musuh yang memiliki tanda jiwa mati, Dukun memilki _peluang 27%_ untuk membangkitkan mereka sebagai hantu yang dirusak.\n\n_+3:_ Saat musuh yang memiliki tanda jiwa mati, Dukun memilki _peluang 40%_ untuk membangkitkan mereka sebagai hantu yang dirusak.

actors.hero.talent.blast_radius.title=radius ledakan
actors.hero.talent.blast_radius.desc=_+1:_ Radius ledakan elemen ditingkatkan menjadi _5 petak_, dari 4.\n\n_+2:_ Radius ledakan elemen ditingkatkan menjadi _6 petak_, dari 4.\n\n_+3:_ Radius ledakan elemen ditingkatkan menjadi _7 petak_, dari 4.\n\n_+4:_ Radius ledakan elemen ditingkatkan menjadi _8 petak_, dari 4.
actors.hero.talent.elemental_power.title=kekuatan elemen
actors.hero.talent.elemental_power.desc=_+1:_ Kekuatan ledakan elemental meningkat sebesar _25%_.\n\n_+2:_ Kekuatan ledakan elemental meningkat sebesar _50%_.\n\n_+3:_ Kekuatan ledakan elemental meningkat sebesar _75%_.\n\n_+4:_ Kekuatan ledakan elemental meningkat sebesar _100%_.
actors.hero.talent.reactive_barrier.title=penghalang reaktif
actors.hero.talent.reactive_barrier.desc=_+1:_ Penyihir memperoleh _2.5 perisai_ untuk setiap karakter yang terkena efek ledakan elemental, dengan batas maksimal 5 karakter.\n\n_+2:_ Penyihir memperoleh _5 perisai_ untuk setiap karakter yang terkena efek ledakan elemental, dengan batas maksimal 6 karakter.\n\n_+3:_ Penyihir memperoleh _7.5 perisai_ untuk setiap karakter yang terkena efek ledakan elemental, dengan batas maksimal 7 karakter.\n\n_+4:_ Penyihir memperoleh _10 perisai_ untuk setiap karakter yang terkena efek ledakan elemental, dengan batas maksimal 8 karakter.

actors.hero.talent.wild_power.title=kekuatan liar
actors.hero.talent.wild_power.desc=_+1:_ Saat memakai sihir liar, tongkat sihir akan ditingkatkan sebesar _2 atau 3, hingga +4_.\n\n_+2:_ Saat memakai sihir liar, tongkat sihir akan ditingkatkan sebesar _3, hingga +5_.\n\n_+3:_ Saat memakai sihir liar, tongkat sihir akan ditingkatkan sebesar _3 atau 4, hingga +6_.\n\n_+4:_ Saat memakai sihir liar, tongkat sihir akan ditingkatkan sebesar _4, hingga +7_.
actors.hero.talent.fire_everything.title=membakar segalanya
actors.hero.talent.fire_everything.desc=_+1:_ Sihir liar sekarang menembak _5 kali_ dari yang asalnya 4 kali, dan setiap tongkat sihir memiliki _peluang 25%_ untuk dapat dipakai 3 kali.\n\n_+1:_ Sihir liar sekarang menembak _6 kali_ dari yang asalnya 4 kali, dan setiap tongkat sihir memiliki _peluang 50%_ untuk dapat dipakai 3 kali.\n\n_+1:_ Sihir liar sekarang menembak _7 kali_ dari yang asalnya 4 kali, dan setiap tongkat sihir memiliki _peluang 75%_ untuk dapat dipakai 3 kali.\n\n_+1:_ Sihir liar sekarang menembak _8 kali_ dari yang asalnya 4 kali, dan setiap tongkat sihir memiliki _peluang 100%_ untuk dapat dipakai 3 kali.
actors.hero.talent.conserved_magic.title=sihir yang disimpan
actors.hero.talent.conserved_magic.desc=_+1:_ Setiap tembakan dari sihir liar sekarang memakai _0,33 daya_ yang asalnya 0.5, dan sihir liar memiliki _peluang 25%_ untuk tidak menghabiskan satu giliran. \n\n_+2:_ Setiap tembakan dari sihir liar sekarang memakai _0,225 daya_ yang asalnya 0.5, dan sihir liar memiliki _peluang 50%_ untuk tidak menghabiskan satu giliran. \n\n_+3:_ Setiap tembakan dari sihir liar sekarang memakai _0,15 daya_ yang asalnya 0.5, dan sihir liar memiliki _peluang 75%_ untuk tidak menghabiskan satu giliran. \n\n_+1:_ Setiap tembakan dari sihir liar sekarang memakai _0,1 daya_ yang asalnya 0.5, dan sihir liar memiliki _peluang 100%_ untuk tidak menghabiskan satu giliran.

actors.hero.talent.telefrag.title=Telefrag
actors.hero.talent.telefrag.desc=_+1:_ Jika Penyihir berpindah kepada karakter lain, ia memberikan _10-15 damage_, namun ia sendiri juga menerima _5 damage_.\n\n_+2:_ Jika Penyihir berpindah kepada karakter lain, ia memberikan _20-30 damage_, namun ia sendiri juga menerima _10 damage_.\n\n_+3:_ Jika Penyihir berpindah kepada karakter lain, ia memberikan _30-45 damage_, namun ia sendiri juga menerima _15 damage_.\n\n_+4:_ Jika Penyihir berpindah kepada karakter lain, ia memberikan _40-60 damage_, namun ia sendiri juga menerima _20 damage_.\n\nPahlawan tidak dapat mati karena bakat ini, damage pada diri sendiri itu dapat dikurangi dengan efek ketahanan sihir.
actors.hero.talent.remote_beacon.title=Suar Jarak jauh
actors.hero.talent.remote_beacon.desc=_+1:_ Penyihir dapat menempatkan suar di lokasi mana pun sejauh _4 petak_.\n\n_+2:_ Penyihir dapat menempatkan suar di lokasi mana pun sejauh _8 petak_.\n\n_+3:_ Penyihir dapat menempatkan suar di lokasi mana pun sejauh _12 petak_.\n\n_+4:_ Penyihir dapat menempatkan suar di lokasi mana pun sejauh _16 petak_.\n\nPenyihir tidak dapat menempatkan suar di lokasi yang tidak dapat diakses.
actors.hero.talent.longrange_warp.title=Berpindah Jarak Jauh
actors.hero.talent.longrange_warp.desc=_+1:_ Penyihir sekarang dapat berpindah antar lantai, dengan biaya daya sebesar _150%_.\n\n_+2:_ Penyihir sekarang dapat berpindah antar lantai, dengan biaya daya sebesar _117%_.\n\n_+3:_ Penyihir sekarang dapat berpindah antar lantai, dengan biaya daya sebesar _83%_.\n\n_+4:_ Penyihir sekarang dapat berpindah antar lantai, dengan biaya daya sebesar _50%_.\n\nPenyihir tidak dapat menggunakan teleportasi jarak jauh saat didalam ruangan yang terkunci.

#rogue
actors.hero.talent.cached_rations.title=jatah tersembunyi
actors.hero.talent.cached_rations.desc=_+1:_ Pengembara dapat menemukan _2 jatah persediaan_ ditempatkan di peti saat dia menjelajahi beberapa lantai berikutnya di terungku.\n\n_+2:_ Pengembara dapat menemukan _3 jatah persediaan_ ditempatkan di peti saat dia menjelajahi beberapa lantai berikutnya di terungku.\n\nJatah persediaan dimakan dengan cepat, memulihkan rasa kenyang dalam jumlah sedang, menyembuhkan 5 hp, dan memulihkan 1 daya ke jubah bayangan.
actors.hero.talent.thiefs_intuition.title=naluri pencuri
actors.hero.talent.thiefs_intuition.desc=_+1:_ Pengembara mengidentifikasi cincin _2x lebih cepat_, dan mengidentifikasi jenis cincin _saat dia memakainya_.\n\n_+2:_ Pengembara mengidentifikasi cincin _saat dia memakainya_, dan mengidentifikasi jenis cincin _saat dia mengambilnya_.
actors.hero.talent.sucker_punch.title=serangan kejutan
actors.hero.talent.sucker_punch.desc=_+1:_ Pengembara memberi _1-2 bonus damage_ saat pertama kali dia memberi serangan kejutan ke musuh.\n\n_+2:_ Pengembara memberi _2 bonus damage_ saat pertama kali dia memberi serangan kejutan ke musuh.
actors.hero.talent.protective_shadows.title=bayangan pelindung
actors.hero.talent.protective_shadows.desc=_+1:_ Pengembara memperoleh satu perisai _setiap beberapa giliran sekali_ saat ia tembus pandang, _dengan batas 3 perisai._\n\n_+2:_ Pengembara memperoleh satu perisai _setiap giliran_ saat ia tembus pandang, _dengan batas 5 perisai._

actors.hero.talent.mystical_meal.title=makanan yang magis
actors.hero.talent.mystical_meal.desc=_+1:_ Pengembara menghabiskan 1 giliran untuk makan (persediaan makanan dimakan seketika) dan memberinya _3 giliran pengisian ulang artefak_.\n\n_+2:_  Pengembara menghabiskan 1 giliran untuk makan (persediaan makanan dimakan seketika) dan memberinya _5 giliran pengisian ulang artefak_.\n\nBakat ini tidak berlaku untuk mengisi ulang terompet kecukupan.
actors.hero.talent.inscribed_stealth.title=penyamaran tertulis
actors.hero.talent.inscribed_stealth.desc=_+1:_ Pengembara mendapatkan _3 giliran_ tembus pandang setelah membaca sebuah gulungan atau menggunakan item mantra.\n\n_+2:_ Pengembara mendapatkan _5 giliran_ tembus pandang setelah membaca sebuah gulungan menggunakan item mantra.\n\nDurasi tembus pandang menjadi dua kali lipat ketika membaca gulungan peningkatan, gulungan pengubah, atau item racikan yang harus dibuat menggunakan gulungan tersebut.\n\nUntuk item racikan dengan jumlah keluaran lebih tinggi (misalnya sebagian besar mantra), bakat ini memiliki peluang terpicu berdasarkan berapa banyak item tersebut dibuat.
actors.hero.talent.wide_search.title=pencarian luas
actors.hero.talent.wide_search.desc=_+1:_ Radius pencarian Pengembara meningkat dari kotak 5x5 ke _lingkaran 7x7_.\n\n_+2:_ Radius pencarian Pengembara meningkat dari kotak 5x5 ke _kotak 7x7_.
actors.hero.talent.wide_search.meta_desc=_Jika bakat ini didapatkan oleh pahlawan yang berbeda_ akan meningkatkan radius pencarian mereka dari 3x3 kotak menjadi 5x5 lingkaran pada +1, atau 5x5 kotak pada +2.
actors.hero.talent.silent_steps.title=langkah senyap
actors.hero.talent.silent_steps.desc=_+1:_ Pengembara tidak akan membangunkan musuh yang tertidur saat dia berada _3 atau lebih petak darinya_.\n\n_+2:_ Pengembara tidak akan membangunkan musuh yang tertidur saat dia _tidak bersebelahan dengan mereka_.
actors.hero.talent.rogues_foresight.title=mata batin pengembara
actors.hero.talent.rogues_foresight.desc=_+1:_ Ketika Pengembara berada pada level dengan ruangan rahasia, dia memiliki _peluang sebesar 75% untuk tahu_ bahwa level itu mengandung sebuah rahasia.\n\n_+2:_ Ketika Pengembara berada pada level dengan ruangan rahasia, dia memiliki _peluang sebesar 100% untuk tahu_ bahwa level itu mengandung sebuah rahasia.

actors.hero.talent.light_cloak.title=jubah ringan
actors.hero.talent.light_cloak.desc=_+1:_ Pengembara dapat menggunakan jubah bayangannya saat sedang tidak dipakai, tapi kecepatan isi ulangnya menjadi _25%_ saat tidak dipakai.\n\n_+2:_ Pengembara dapat menggunakan jubah bayangannya saat sedang tidak dipakai, tapi kecepatan isi ulangnya menjadi _50%_ saat tidak dipakai.\n\n_+3:_ Pengembara dapat menggunakan jubah bayangannya saat sedang tidak dipakai, tapi kecepatan isi ulangnya menjadi _75%_ saat tidak dipakai.
actors.hero.talent.light_cloak.meta_desc=_jika bakat ini didapatkan oleh pahlawan yang berbeda_ akan meningkatkan kecepatan pengisian dari seluruh artefak sebesar 7/13/20% pada +1/+2/+3
actors.hero.talent.enhanced_rings.title=peningkatan cincin
actors.hero.talent.enhanced_rings.desc=_+1:_ Ketika Pengembara menggunakan artefak, cincinnya mendapatkan +1 peningkatan untuk _3 giliran_.\n\n_+2:_ Ketika Pengembara menggunakan artefak, cincinnya mendapatkan +1 peningkatan untuk _6 giliran_.\n\n_+3:_ Ketika Pengembara menggunakan artefak, cincinnya mendapatkan +1 peningkatan untuk _9 giliran_.

actors.hero.talent.enhanced_lethality.title=peningkatan kematian
actors.hero.talent.enhanced_lethality.desc=_+1:_ Pembunuh dapat membunuh musuh yang _darahnya di bawah 4/13/27/67%_ per level persiapan, naik dari 3/10/20/50%.\n\n_+2:_ Pembunuh dapat membunuh musuh yang _darahnya di bawah 5/17/33/83%_ per level persiapan, naik dari 3/10/20/50%.\n\n_+3:_ Pembunuh dapat membunuh musuh yang _darahnya di bawah 6/20/40/100%_ per level persiapan, naik dari 3/10/20/50%.
actors.hero.talent.assassins_reach.title=jangkauan pembunuh
actors.hero.talent.assassins_reach.desc=_+1:_ Jarak lompatan Pembunuh per level persiapan ditingkatkan menjadi _1/3/4/6 petak_, asalnya dari 1/2/3/4.\n\n_+2:_ Jarak lompatan Pembunuh per level persiapan ditingkatkan menjadi _2/4/6/8 petak_, asalnya dari 1/2/3/4.\n\n_+3:_ Jarak lompatan Pembunuh per level persiapan ditingkatkan menjadi _2/5/7/10 petak_, asalnya dari 1/2/3/4.\n\nLompatan ini dapat menembus bahaya dan musuh, tetapi tidak dapat menembus medan yang padat seperti dinding.
actors.hero.talent.bounty_hunter.title=pemburu hadiah
actors.hero.talent.bounty_hunter.desc=_+1:_ Saat Pembunuh membunuh musuh dengan serangan yang telah disiapkan, peluang menjatuhkan item mereka meningkat sebesar _2/4/8/16%_, per level persiapan.\n\n_+2:_ Saat Pembunuh membunuh musuh dengan serangan yang telah disiapkan, peluang menjatuhkan item mereka meningkat sebesar _4/8/16/32%_, per level persiapan.\n\n_+3:_ Saat Pembunuh membunuh musuh dengan serangan yang telah disiapkan, peluang menjatuhkan item mereka meningkat sebesar _6/12/24/48%_, per level persiapan.

actors.hero.talent.evasive_armor.title=armor penghindaran
actors.hero.talent.evasive_armor.desc=_+1:_ Saat berlari bebas, Pelari Bebas mendapatkan _+1 penghindaran_ tambahan tiap lebihnya kekuatan di armor yang ia pakai.\n\n_+2:_ Saat berlari bebas, Pelari Bebas mendapatkan _+2 penghindaran_ tambahan tiap lebihnya kekuatan di armor yang ia pakai.\n\n_+3:_ Saat berlari bebas, Pelari Bebas mendapatkan _+3 penghindaran_ tambahan tiap lebihnya kekuatan di armor yang ia pakai.
actors.hero.talent.projectile_momentum.title=momentum proyektil
actors.hero.talent.projectile_momentum.desc=_+1:_ Saat berlari bebas, Pelari Bebas mendapatkan _+50% akurasi dan +15% damage_ dari senjata jarak jauh.\n\n_+2:_ Saat berlari bebas, Pelari Bebas mendapatkan _+100% akurasi dan +30% damage_ dari senjata jarak jauh.\n\n_+3:_ Saat berlari bebas, Pelari Bebas mendapatkan _+150% akurasi dan +45% damage_ dari senjata jarak jauh.
actors.hero.talent.speedy_stealth.title=penyamaran gesit
actors.hero.talent.speedy_stealth.desc=_+1:_ Pelari Bebas mendapatkan 2 tumpukan momentum tiap giliran saat dia tembus pandang.\n\n_+2:_ Selain kemampuan di +1, lari bebas tidak lagi dihitung selama Pelari Bebas tembus pandang.\n\n_+3:_ Selain kemampuan di +1 dan +2, Pelari Bebas bergerak dengan kecepatan 2x saat tembus pandang, terlepas dari apakah dia sedang lari bebas atau tidak.

actors.hero.talent.hasty_retreat.title=kabur dengan cepat
actors.hero.talent.hasty_retreat.desc=_+1:_ Setelah berpindah, Pengembara mendapatkan kecepatan dan tembus pandang selama _1 giliran_.\n\n_+2:_ Setelah berpindah, Pengembara mendapatkan kecepatan dan tembus pandang selama _2 giliran_.\n\n_+3:_ Setelah berpindah, Pengembara mendapatkan kecepatan dan tembus pandang selama _3 giliran_.\n\n_+4:_ Setelah berpindah, Pengembara mendapatkan kecepatan dan tembus pandang selama _4 giliran_.
actors.hero.talent.body_replacement.title=penggantian tubuh
actors.hero.talent.body_replacement.desc=_+1:_ Setelah berpindah, Pengembara meninggalkan umpan kayu yang memiliki _20 hp dan 1-3 armor_.\n\n_+2:_ Setelah berpindah, Pengembara meninggalkan umpan kayu yang memiliki _40 hp dan 2-6 armor_.\n\n_+3:_ Setelah berpindah, Pengembara meninggalkan umpan kayu yang memiliki _60 hp dan 3-9 armor_.\n\n_+4:_ Setelah berpindah, Pengembara meninggalkan umpan kayu yang memiliki _80 hp dan 4-12 armor_.\n\nHanya satu umpan yang bisa aktif pada satu waktu.
actors.hero.talent.shadow_step.title=langkah bayangan
actors.hero.talent.shadow_step.desc=_+1:_ Jika pengembara menggunakan bom asap saat tidak terlihat, hal ini terjadi secara instan dan biaya daya berkurang _16%_, namun juga tidak membutakan musuh atau memicu bakat lain.\n\n_+1:_ Jika pengembara menggunakan bom asap saat tidak terlihat, hal ini terjadi secara instan dan biaya daya berkurang _30%_, namun juga tidak membutakan musuh atau memicu bakat lain.\n\n_+3:_ Jika pengembara menggunakan bom asap saat tidak terlihat, hal ini terjadi secara instan dan biaya daya berkurang _41%_, namun juga tidak membutakan musuh atau memicu bakat lain.\n\n_+4:_ Jika pengembara menggunakan bom asap saat tidak terlihat, hal ini terjadi secara instan dan biaya daya berkurang _50%_, namun juga tidak membutakan musuh atau memicu bakat lain.

actors.hero.talent.fear_the_reaper.title=takut akan maut
actors.hero.talent.fear_the_reaper.desc=_+1:_ Ketika musuh yang memiliki tanda maut mencapai 0 hp, mereka menjadi _pincang_.\n\n_+2:_ Ketika musuh yang memiliki tanda maut mencapai 0 hp, mereka menjadi _takut dan pincang_.\n\n_+3:_ Ketika musuh yang memiliki tanda maut mencapai 0 hp, mereka menjadi _takut dan pincang_ dan musuh lain sejauh 3 petak juga akan menjadi _pincang_.\n\n_+4:_ Ketika musuh yang memiliki tanda maut mencapai 0 hp, mereka menjadi _takut dan pincang_ dan musuh lain sejauh 3 petak juga akan menjadi _takut dan pincang_.
actors.hero.talent.deathly_durability.title=daya tahan mematikan
actors.hero.talent.deathly_durability.desc=_+1:_ Musuh yang terbunuh oleh tanda maut akan memberikan Pengembara perisai setara dengan _13%_ dari darah mereka saat tertandai.\n\n_+2:_ Musuh yang terbunuh oleh tanda maut akan memberikan Pengembara perisai setara dengan _25%_ dari darah mereka saat tertandai.\n\n_+3:_ Musuh yang terbunuh oleh tanda maut akan memberikan Pengembara perisai setara dengan _38%_ dari darah mereka saat tertandai.\n\n_+4:_ Musuh yang terbunuh oleh tanda maut akan memberikan Pengembara perisai setara dengan _50%_ dari darah mereka saat tertandai.
actors.hero.talent.double_mark.title=tanda ganda
actors.hero.talent.double_mark.desc=_+1:_ Menandai target kedua pada saat yang bersamaan dengan target pertama akan _mengurangi 30%_ biaya daya.\n\n_+2:_ Menandai target kedua pada saat yang bersamaan dengan target pertama akan _mengurangi 50%_ biaya daya.\n\n_+3:_ Menandai target kedua pada saat yang bersamaan dengan target pertama akan _mengurangi 65%_ biaya daya.\n\n_+4:_ Menandai target kedua pada saat yang bersamaan dengan target pertama akan _mengurangi 75%_ biaya daya.

actors.hero.talent.shadow_blade.title=pedang bayangan
actors.hero.talent.shadow_blade.desc=_+1:_ Tiruan bayangan memperoleh _8%_ dari damage pahlawan per giliran, dan memiliki _peluang 25%_ untuk menggunakan enchantment pada senjata pahlawan.\n\n_+2:_ Tiruan bayangan memperoleh _16%_ dari damage pahlawan per giliran, dan memiliki _peluang 50%_ untuk menggunakan enchantment pada senjata pahlawan.\n\n_+3:_ Tiruan bayangan memperoleh _24%_ dari damage pahlawan per giliran, dan memiliki _peluang 75%_ untuk menggunakan enchantment pada senjata pahlawan.\n\n_+4:_ Tiruan bayangan memperoleh _32%_ dari damage pahlawan per giliran, dan memiliki _peluang 100%_ untuk menggunakan enchantment pada senjata pahlawan.
actors.hero.talent.cloned_armor.title=armor tiruan
actors.hero.talent.cloned_armor.desc=_+1:_ Tiruan bayangan memperoleh _12%_ dari nilai armor pahlawan, dan memiliki _peluang 25%_ untuk menggunakan glyph pada armor pahlawan.\n\n_+2:_ Tiruan bayangan memperoleh _24%_ dari nilai armor pahlawan, dan memiliki _peluang 50%_ untuk menggunakan glyph pada armor pahlawan.\n\n_+3:_ Tiruan bayangan memperoleh _36%_ dari nilai armor pahlawan, dan memiliki _peluang 75%_ untuk menggunakan glyph pada armor pahlawan.\n\n_+4:_ Tiruan bayangan memperoleh _48%_ dari nilai armor pahlawan, dan memiliki _100% peluang_ untuk menggunakan glyph pada armor pahlawan.
actors.hero.talent.perfect_copy.title=tiruan sempurna
actors.hero.talent.perfect_copy.desc=_+1:_ Tiruan bayangan memperoleh _10%_ darah maksimal dari pahlawan, dan dapat secara instan bergantian tempat dengan pahlawan dalam jarak _1 petak_.\n\n_+1:_ Tiruan bayangan memperoleh _20%_ darah maksimal dari pahlawan, dan dapat secara instan bergantian tempat dengan pahlawan dalam jarak _2 petak_.\n\n_+1:_ Tiruan bayangan memperoleh _30%_ darah maksimal dari pahlawan, dan dapat secara instan bergantian tempat dengan pahlawan dalam jarak _3 petak_.\n\n_+1:_ Tiruan bayangan memperoleh _40%_ darah maksimal dari pahlawan, dan dapat secara instan bergantian tempat dengan pahlawan dalam jarak _4 petak_.

#huntress
actors.hero.talent.natures_bounty.title=karunia alam
actors.hero.talent.natures_bounty.desc=_+1:_ Pemburu dapat menemukan _4 buah beri_ tersembunyi di rerumputan tinggi saat dia menjelajahi beberapa lantai berikutnya di terungku.\n\n_+2:_ Pemburu dapat menemukan _6 buah beri_ tersembunyi di rerumputan tinggi saat dia menjelajahi beberapa lantai berikutnya di terungku.\n\nBuah beri dimakan dengan cepat, mengembalikan sedikit rasa kenyang, dan mungkin mengandung benih yang dapat digunakan.
actors.hero.talent.survivalists_intuition.title=naluri bertahan hidup
actors.hero.talent.survivalists_intuition.desc=_+1:_ Pemburu mengidentifikasi senjata lempar _3x lebih cepat_.\n\n_+2:_ Pemburu mengidentifikasi senjata lempar _saat dia menyerangnya_.
actors.hero.talent.followup_strike.title=serangan lanjutan
actors.hero.talent.followup_strike.desc=_+1:_ Saat Pemburu menyerang musuh dengan busur atau senjata jarak jauh, serangan jarak dekat berikutnya pada musuh itu memberikan _2 bonus damage_.\n\n_+2:_ Saat Pemburu menyerang musuh dengan busur atau senjata jarak jauh, serangan jarak dekat berikutnya pada musuh itu memberikan _3 bonus damage_.
actors.hero.talent.natures_aid.title=bantuan alam
actors.hero.talent.natures_aid.desc=_+1:_ Pemburu mendapatkan 0-2 armor kulit kayu, yang memudar tiap _3 giliran_ ketika efek tanaman diaktifkan dalam jarak penglihatannya.\n\n_+2:_ Pemburu mendapatkan 0-2 armor kulit kayu, yang memudar tiap _5 giliran_ ketika efek tanaman diaktifkan dalam jarak penglihatannya.

actors.hero.talent.invigorating_meal.title=makanan yang menyegarkan
actors.hero.talent.invigorating_meal.desc=_+1+:_ Pemburu hanya akan mengabiskan 1 giliran untuk makan (buah beri tidak menghabiskan giliran sama sekali) dan akan memberinya _1 giliran kecepatan_.\n\n_+2:_ Pemburu hanya akan mengabiskan 1 giliran untuk makan (buah beri tidak menghabiskan giliran sama sekali) dan akan memberinya _2 giliran kecepatan_.
actors.hero.talent.liquid_nature.title=cairan alam
actors.hero.talent.liquid_nature.desc=_+1:_ Saat Pemburu meminum atau melempar ramuan, seduhan, atau eliksir, _hingga 4 ubin rumput_ tumbuh di area sekitar, dan musuh di dekatnya tertanam selama _1 giliran_.\n\n_+2:_ Saat Pemburu meminum atau melempar ramuan, seduhan, atau eliksir, _hingga 6 ubin rumput_ tumbuh di area sekitar, dan musuh di dekatnya tertanam selama _2 giliran_.\n\nJumlah rumput dan durasi tertanam menjadi dua kali lipat ketika menggunakan ramuan kekuatan, pengalaman, atau item racikan yang harus dibuat menggunakan ramuan tersebut.\n\nUntuk item racikan dengan jumlah keluaran lebih tinggi (misalnya seduhan air), bakat ini memiliki peluang terpicu berdasarkan berapa banyak item tersebut dibuat.
actors.hero.talent.rejuvenating_steps.title=langkah pertumbuhan
actors.hero.talent.rejuvenating_steps.desc=_+1:_ Saat Pemburu menginjak rumput pendek atau bara api, mereka akan tumbuh menjadi rumput tinggi yang segera berkerut oleh Pemburu. Memiliki _cooldown 10 giliran_.\n\n_+2:_ Saat Pemburu menginjak rumput pendek atau bara api, mereka akan tumbuh menjadi rumput tinggi yang segera berkerut oleh Pemburu. Memiliki _cooldown 5 giliran_.\n\nBakat ini akan menghasilkan rumput berkerut jika efek regenerasi pasif dinonaktifkan atau pahlawan sudah lama tidak memperoleh exp.
actors.hero.talent.heightened_senses.title=peningkatan indera
actors.hero.talent.heightened_senses.desc=_+1:_ Pemburu dapat melihat pikiran karakter lain yang berjarak _2 petak dari posisinya_.\n\n_+2:_ Pemburu dapat melihat pikiran karakter lain yang berjarak _3 petak dari posisinya_.
actors.hero.talent.durable_projectiles.title=proyektil tahan lama
actors.hero.talent.durable_projectiles.desc=_+1:_ Senjata jarak jauh _+50% lebih tahan lama_ ketika digunakan oleh Pemburu.\n\n_+2:_ Senjata jarak jauh _+75% lebih tahan lama_ ketika digunakan oleh Pemburu.

actors.hero.talent.point_blank.title=titik kosong
actors.hero.talent.point_blank.desc=_+1:_ Ketika pemburu menggunakan busur atau senjata lempar pada jarak serang dekat, serangan itu memiliki _-25% akurasi,_ yang mana asalnya adalah -50%.\n\n_+2:_ Ketika pemburu menggunakan busur atau senjata lempar pada jarak serang dekat, serangan itu memiliki _akurasi normal,_ yang mana asalnya adalah -50%.\n\n_+3:_ Ketika pemburu menggunakan busur atau senjata lempar pada jarak serang dekat, serangan itu memiliki _+25% akurasi,_ yang mana asalnya adalah -50%.\n\nPerlu diperhatikan bahwa senjatan lempar atau busur roh selalu memiliki +50% akurasi saat digunakan pada jarak jauh.
actors.hero.talent.seer_shot.title=tembakan penglihatan
actors.hero.talent.seer_shot.desc=_+1:_ Ketika Pemburu menembakkan panah ke tanah, panah itu memberikan penglihatan di area 3x3 di sekitarnya _5 giliran_. Memiliki cooldown 20 giliran.\n\n_+2:_ Ketika Pemburu menembakkan panah ke tanah, panah itu memberikan penglihatan di area 3x3 di sekitarnya _10 giliran_. Memiliki cooldown 20 giliran.\n\n_+3:_ Ketika Pemburu menembakkan panah ke tanah, panah itu memberikan penglihatan di area 3x3 di sekitarnya _15 giliran_. Memiliki cooldown 20 giliran.
actors.hero.talent.seer_shot.meta_desc=_Jika bakat ini didapatkan oleh pahlawan yang berbeda_ bakat ini akan dipicu dari senjata apa pun yang dilempar.

actors.hero.talent.farsight.title=penglihatan jauh
actors.hero.talent.farsight.desc=_+1:_ Jarak penglihatan Penembak Jitu _ditingkatkan 25%_.\n\n_+2:_ Jarak penglihatan Penembak Jitu _ditingkatkan 50%_.\n\n_+3:_ Jarak penglihatan Penembak Jitu _ditingkatkan 75%_.
actors.hero.talent.shared_enchantment.title=berbagai enchantment
actors.hero.talent.shared_enchantment.desc=_+1:_ Senjata lempar mempunyai _peluang sebesar 33%_ untuk menggunakan enchantment dari busur Penembak Jitu.\n\n_+2:_ Senjata lempar mempunyai _peluang sebesar 67%_ untuk menggunakan enchantment dari busur Penembak Jitu.\n\n_+3:_ Senjata lempar mempunyai _peluang sebesar 100%_ untuk menggunakan enchantment dari busur Penembak Jitu.\n\nEnchantment busur dapat dipicu sebagai tambahan terhadap enchantment apapun yang telah dimiliki senjata lempar.
actors.hero.talent.shared_upgrades.title=berbagi peningkatan
actors.hero.talent.shared_upgrades.desc=_+1:_ Saat Penembak Jitu menyerang dengan senjata lempar yang ditingkatkan, setiap level meningkatkan durasi tanda penembak jitu sebesar 1 giliran dan damage serangan khususnya sebesar 16%, hingga maksimum _2 giliran dan +33% damage pada +2_.\n\n_+2:_ Saat Penembak Jitu menyerang dengan senjata lempar yang ditingkatkan, setiap level meningkatkan durasi tanda penembak jitu sebesar 1 giliran dan damage serangan khususnya sebesar 16%, hingga maksimum _4 giliran dan +67% damage pada +4_.\n\n_+3:_ Saat Penembak Jitu menyerang dengan senjata lempar yang ditingkatkan, setiap level meningkatkan durasi tanda penembak jitu sebesar 1 giliran dan damage serangan khususnya sebesar 16%, hingga maksimum _6 giliran dan +100% damage pada +6_.

actors.hero.talent.durable_tips.title=lumuran tahan lama
actors.hero.talent.durable_tips.desc=_+1:_ Anak panah yang dilumuri memiliki _ketahanan 2x lipat_ saat Penjaga menggunakannya.\n\n_+2:_ Anak panah yang dilumuri memiliki _ketahanan 3x lipat_ saat Penjaga menggunakannya.\n\n_+3:_ Anak panah yang dilumuri memiliki _ketahanan 4x lipat_ saat Penjaga menggunakannya.
actors.hero.talent.barkskin.title=kulit kayu
actors.hero.talent.barkskin.desc=_+1:_ Saat menginjak rumput, Penjaga mendapatkan armor kulit kayu sebesar _0-50%_ dari levelnya saat ini yang akan memudar setiap giliran.\n\n_+2:_ Saat menginjak rumput, Penjaga mendapatkan armor kulit kayu sebesar _0-100%_ dari levelnya saat ini yang akan memudar setiap giliran.\n\n_+3:_ Saat menginjak rumput, Penjaga mendapatkan armor kulit kayu sebesar _0-150%_ dari levelnya saat ini yang akan memudar setiap giliran.
actors.hero.talent.shielding_dew.title=perisai embun
actors.hero.talent.shielding_dew.desc=_+1:_ Tetesan embun dapat memberikan Penjaga perisai saat darahnya penuh, hingga _20% dari HP maksimalnya_.\n\n_+2:_ Tetesan embun dapat memberikan Penjaga perisai saat darahnya penuh, hingga _40% dari HP maksimalnya_.\n\n_+3_ Tetesan embun dapat memberikan Penjaga perisai saat darahnya penuh, hingga _60% dari HP maksimalnya_.

actors.hero.talent.fan_of_blades.title=bilah kipas
actors.hero.talent.fan_of_blades.desc=_+1:_ Bilah spektral dapat mengenai hingga _1 target tambahan_ untuk 50% damage. Target harus terlihat dan dalam area kerucut _30 derajat_.\n\n_+2:_ Bilah spektral dapat mengenai hingga _2 target tambahan_ untuk 50% damage. Target harus terlihat dan dalam area kerucut _60 derajat_.\n\n_+3:_ Bilah spektral dapat mengenai hingga _3 target tambahan_ untuk 50% damage. Target harus terlihat dan dalam area kerucut _90 derajat_.\n\n_+4:_ Bilah spektral dapat mengenai hingga _4 target tambahan_ untuk 50% damage. Target harus terlihat dan dalam area kerucut _120 derajat_.
actors.hero.talent.projecting_blades.title=bilah proyeksi
actors.hero.talent.projecting_blades.desc=_+1:_ Bilah spektral memiliki _+25% akurasi_, dan dapat menembus hingga _2 petak padat_.\n\n_+2:_ Bilah spektral memiliki _+50% akurasi_, dan dapat menembus hingga _4 petak padat_.\n\n_+3:_ Bilah spektral memiliki _+75% akurasi_, dan dapat menembus hingga _6 petak padat_.\n\n_+4:_ Bilah spektral memiliki _+100% akurasi_, dan dapat menembus hingga _8 petak padat_.
actors.hero.talent.spirit_blades.title=bilah roh
actors.hero.talent.spirit_blades.desc=_+1:_ Bilah spektral memiliki _peluang 30%_ untuk dapat menggunakan enchantment pada busur roh.\n\n_+2:_ Bilah spektral memiliki _peluang 60%_ untuk dapat menggunakan enchantment pada busur roh. \n\n_+3:_ Bilah spektral memiliki _peluang 90%_ untuk dapat menggunakan enchantment pada busur roh.\n\n_+4:_ Bilah spektral memiliki _peluang 100%_ untuk dapat menggunakan enchantment pada busur roh, dan memberi setiap enchantment _10% kekuatan_.

actors.hero.talent.growing_power.title=kekuatan yang meningkat
actors.hero.talent.growing_power.desc=_+1:_ Peningkatan serangan dan kecepatan gerak dari kekuatan alam meningkat menjadi _38% dan 125%_, dari 33% dan 100%.\n\n_+2:_ Peningkatan serangan dan kecepatan gerak dari kekuatan alam meningkat menjadi _42% dan 150%_, dari 33% dan 100%.\n\n_+3:_ Peningkatan serangan dan kecepatan gerak dari kekuatan alam meningkat menjadi _46% dan 175%_, dari 33% dan 100%.\n\n_+4:_ Peningkatan serangan dan kecepatan gerak dari kekuatan alam meningkat menjadi _50% dan 200%_, dari 33% dan 100%.
actors.hero.talent.natures_wrath.title=amarah alam
actors.hero.talent.natures_wrath.desc=_+1:_ Saat kekuatan alam aktif, tembakan dari busur roh memiliki _peluang 8%_ untuk memicu salah satu efek tanaman yang berbahaya.\n\n_+2:_ Saat kekuatan alam aktif, tembakan dari busur roh memiliki _peluang 17%_ untuk memicu salah satu efek tanaman yang berbahaya.\n\n_+3:_ Saat kekuatan alam aktif, tembakan dari busur roh memiliki _peluang 25%_ untuk memicu salah satu efek tanaman yang berbahaya.\n\n_+4:_ Saat kekuatan alam aktif, tembakan dari busur roh memiliki _peluang 33%_ untuk memicu salah satu efek tanaman yang berbahaya.\n\nEfek tanaman yang dapat aktif antara lain: rumput buta, bunga api, kantong es, lumut kesedihan, dan jalar badai.
actors.hero.talent.wild_momentum.title=momentum liar
actors.hero.talent.wild_momentum.desc=_+1:_ Membunuh musuh dengan busur roh memperpanjang durasi kekuatan alam selama _1 giliran_. Durasi dapat diperpanjang sampai maksimal _2 giliran_.\n\n_+2:_ Membunuh musuh dengan busur roh memperpanjang durasi kekuatan alam selama _2 giliran_. Durasi dapat diperpanjang sampai maksimal _4 giliran_.\n\n_+3:_ Membunuh musuh dengan busur roh memperpanjang durasi kekuatan alam selama _3 giliran_. Durasi dapat diperpanjang sampai maksimal _6 giliran_.\n\n_+4:_ Membunuh musuh dengan busur roh memperpanjang durasi kekuatan alam selama _4 giliran_. Durasi dapat diperpanjang sampai maksimal _8 giliran_.

actors.hero.talent.eagle_eye.title=mata elang
actors.hero.talent.eagle_eye.desc=_+1:_ Jangkauan penglihatan elang roh ditingkatkan menjadi _7 ubin_ dari 6 ubin.\n\n_+2:_ Jangkauan penglihatan elang roh ditingkatkan menjadi _8 ubin_ dari 6 ubin.\n\n_+3:_ Jangkauan penglihatan elang roh ditingkatkan menjadi _9 ubin_ dari 6 ubin, dan mendapat _2 ubin_ penglihatan pikiran.\n\n_+4:_ Jangkauan penglihatan elang roh ditingkatkan menjadi _10 ubin_ dari 6 ubin, dan mendapat _3 ubin_ penglihatan pikiran.
actors.hero.talent.go_for_the_eyes.title=bidik matanya
actors.hero.talent.go_for_the_eyes.desc=_+1:_ Serangan dari elang roh membutakan musuh selama _2 giliran_.\n\n_+2:_ Serangan dari elang roh membutakan musuh selama _5 giliran_.\n\n_+3:_ Serangan dari elang roh membutakan musuh selama _5 putaran_ dan membuat mereka pincang selama _2 giliran_.\n\n_+4:_ Serangan dari elang roh membutakan musuh selama _5 putaran_ dan membuat  mereka picang selama _5 giliran_.
actors.hero.talent.swift_spirit.title=roh gesit
actors.hero.talent.swift_spirit.desc=_+1:_ Kecepatan gerak elang roh ditingkatkan jadi _2.5 petak_ dari yang asalnya 2, dan dijamin dapat menghindari _2 serangan_ berikutnya.\n\n_+2:_ Kecepatan gerak elang roh ditingkatkan jadi _3 petak_ dari yang asalnya 2, dan dijamin dapat menghindari _4 serangan_ berikutnya.\n\n_+3:_ Kecepatan gerak elang roh ditingkatkan jadi _3.5 petak_ dari yang asalnya 2, dan dijamin dapat menghindari _6 serangan_ berikutnya.\n\n_+4:_ Kecepatan gerak elang roh ditingkatkan jadi _4 petak_ dari yang asalnya 2, dan dijamin dapat menghindari _8 serangan_ berikutnya.

#duelist
actors.hero.talent.strengthening_meal.title=makanan yang memperkuat
actors.hero.talent.strengthening_meal.desc=_+1:_ Memakan makanan memberikan Duelis 3 damage tambahan untuk _2 serangan fisik_ berikutnya.\n\n_+2:_ Memakan makanan memberikan Duelis 3 damage tambahan untuk _3 serangan fisik_ berikutnya.
actors.hero.talent.adventurers_intuition.title=naluri petualang
actors.hero.talent.adventurers_intuition.desc=_+1:_ Duelis mengidentifikasi senjata _2.5x lebih cepat_ and armor _1.75x lebih cepat_.\n\n_+2:_ Duelis mengidentifikasi senjata _ketika ia menggunakannya_ dan armor _2.5x lebih cepat_.
actors.hero.talent.patient_strike.title=serangan sabar
actors.hero.talent.patient_strike.desc=_+1:_ Jika Duelis menunggu sebelum melakukan serangan jarak dekat, dia akan menimbulkan _1-2 damage tambahan_.\n\n_+2:_ Jika Duelis menunggu sebelum melakukan serangan jarak dekat, dia akan menimbulkan _2 damage tambahan_.
actors.hero.talent.aggressive_barrier.title=penghalang agresif
actors.hero.talent.aggressive_barrier.desc=_+1:_ Duelis mendapatkan _3 perisai_ ketika dia menggunakan kemampuan senjata dan memiliki darah pada atau di bawah 50%.\n\n_+2:_ Duelis mendapatkan _5 perisai_ ketika dia menggunakan kemampuan senjata dan memiliki darah pada atau di bawah 50%.
actors.hero.talent.aggressive_barrier.meta_desc=_Jika bakat ini didapatkan oleh karakter lain_ Bakat ini akan memberikan perlindungan ketika melakukan serangan jarak dekat saat darahnya sedikit, dengan cooldown 50 giliran.

actors.hero.talent.focused_meal.title=makanan yang terfokus
actors.hero.talent.focused_meal.desc=_+1:_ Duelis membutuhkan 1 giliran untuk makan dan mendapat _0,67 daya_ untuk senjatanya.\n\n_+2:_ Duelis membutuhkan 1 giliran untuk makan dan mendapat _1 daya_ untuk senjatanya.
actors.hero.talent.focused_meal.meta_desc=_Jika bakat ini didapatkan oleh pahlawan lain_ maka akan mendapatkan bonus damage pada serangan selanjutnya yang setara dengan level/3 pada +1, atau level/2 pada +2 mereka.
actors.hero.talent.liquid_agility.title=cairan kelincahan
actors.hero.talent.liquid_agility.desc=_+1:_ ketika meminum atau melempar ramuan,seduhan, atau eliksir, Duelis mendapatkan _3x penghindaran_ dan _3x akurasi_ pada serangan jarak dekat berikutnya dalam 5 putaran.\n\n_+2:_ ketika meminum atau melempar ramuan,seduhan, atau eliksir, Duelis mendapatkan _penghindaran tak terbatas_ dan _akurasi tak terbatas_ pada serangan jarak dekat berikutnya dalam 5 putaran. \n\nBonus penghindaran berlaku selama 1 giliran tambahan saat menggunakan ramuan kekuatan, pengalaman, atau item racikan yang harus dibuat menggunakan ramuan tersebut.\n\nUntuk item racikan dengan jumlah keluaran lebih tinggi (misalnya seduhan air), bakat ini memiliki peluang terpicu berdasarkan berapa banyak item tersebut yang diproduksi.
actors.hero.talent.weapon_recharging.title=mengisi ulang senjata
actors.hero.talent.weapon_recharging.desc=_+1:_ Duelis memperoleh satu daya senjata setiap _15 giliran_ saat berada di bawah pengaruh peningkatan pengisian ulang tongkat atau artefak.\n\n_+2:_ Duelis memperoleh satu daya senjata setiap _10 giliran_ saat berada di bawah pengaruh peningkatan pengisian ulang tongkat atau artefak.
actors.hero.talent.weapon_recharging.meta_desc=_Jika bakat ini didapatkan oleh pahlawan yang berbeda_ malah akan menyebabkan mereka menimbulkan +5% damage jarak dekat saat mengisi ulang pada +1, atau +7,5% damage jarak dekat saat mengisi ulang pada +2.
actors.hero.talent.lethal_haste.title=pelarian mematikan
actors.hero.talent.lethal_haste.desc=_+1:_ Saat Duelis mendaratkan pukulan mematikan pada musuh dengan kemampuan senjata, dia memperoleh _3 giliran_ pergerakan instan.\n\n_+1:_ Saat Duelis mendaratkan pukulan mematikan pada musuh dengan kemampuan senjata, dia memperoleh _5 giliran_ pergerakan instan.
actors.hero.talent.lethal_haste.meta_desc=_Jika bakat ini didapatkan oleh pahlawan lain_ bakat ini akan terpicu dengan serangan senjata biasa, dengan cooldown 100 giliran.
actors.hero.talent.swift_equip.title=mengambil cepat
actors.hero.talent.swift_equip.desc=_+1:_ Duelis dapat mengganti senjatanya secara instan _satu kali_, setiap 20 giliran.\n\n_+1:_ Duelis dapat mengganti senjatanya secara instan _dua kali dalam 5 giliran_, setiap 20 giliran.\n\nJika Duelis memiliki bakat ini dan tidak dalam masa cooldown, penggunaan cepat senjata yang tidak dilengkapi akan melengkapinya.

actors.hero.talent.precise_assault.title=serangan tepat
actors.hero.talent.precise_assault.desc=_+1:_ Saat Duelis menggunakan kemampuan senjata, dia memperoleh _2x akurasi_ pada serangan jarak dekat berikutnya dalam 5 giliran.\n\n_+2:_ Saat Duelis menggunakan kemampuan senjata, dia memperoleh _5x akurasi_ pada serangan jarak dekat berikutnya dalam 5 giliran .\n\n_+3:_ Saat Duelis menggunakan kemampuan senjata, dia memperoleh _akurasi tak terbatas_ pada serangan jarak dekat berikutnya dalam 5 giliran.
actors.hero.talent.precise_assault.meta_desc=_Jika bakat ini didapatkan oleh pahlawan yang berbeda_ maka akurasi jarak dekat akan meningkat sebesar 10% pada +1, 20% pada +2, atau 30% pada +3.
actors.hero.talent.deadly_followup.title=lanjutan mematikan
actors.hero.talent.deadly_followup.desc=_+1:_ Saat Duelis mengenai musuh dengan senjata lempar, dia akan menimbulkan _10% lebih banyak damage jarak dekat_ kepada mereka selama 5 giliran.\n\n_+2:_ Saat Duelis mengenai musuh dengan senjata lempar, dia akan menimbulkan _20% lebih banyak damage jarak dekat_ kepada mereka selama 5 giliran.\n\n_+3:_ Saat Duelis mengenai musuh dengan senjata lempar, dia akan menimbulkan _30% lebih banyak damage jarak dekat_ kepada mereka selama 5 giliran.

actors.hero.talent.varied_charge.title=variasi daya
actors.hero.talent.varied_charge.desc=_+1:_ Jagoan langsung mendapatkan kembali _0,17 daya senjata_ ketika dia menggunakan dua kemampuan senjata yang berbeda, tanpa batas waktu.\n\n_+2:_ Jagoan langsung mendapatkan kembali _0,33 daya senjata_ ketika dia menggunakan dua kemampuan senjata yang berbeda, tanpa batas waktu.\n\n_+3:_ Jagoan langsung mendapatkan kembali _0,5 daya senjata_ ketika dia menggunakan dua kemampuan senjata yang berbeda, tanpa batas waktu.
actors.hero.talent.twin_upgrades.title=peningkatan kembar
actors.hero.talent.twin_upgrades.desc=_+1:_ Jika salah satu dari dua senjata yang digunakan Jagoan memiliki level lebih rendah dan _2 tingkat atau lebih rendah_ dibandingkan senjata lainnya, senjata tersebut akan ditingkatkan ke level senjata lainnya.\n\n_+2:_ Jika salah satu dari dua senjata yang digunakan Jagoan memiliki level lebih rendah dan _1 tingkat atau lebih rendah_ dibandingkan senjata lainnya, senjata tersebut akan ditingkatkan ke level senjata lainnya.\n\n_+3:_ Jika salah satu dari dua senjata yang digunakan Jagoan memiliki level lebih rendah dan _tingkat yang sama atau lebih rendah_ dibandingkan senjata lainnya, senjata tersebut akan ditingkatkan ke level senjata lainnya.
actors.hero.talent.combined_lethality.title=kombinasi mematikan
actors.hero.talent.combined_lethality.desc=_+1:_ Jika Jagoan menyerang dengan senjata jarak dekat setelah menggunakan kemampuan senjata yang berbeda, serangan tersebut akan mengeksekusi musuh non-bos yang tersisa _di bawah 13% HP_.\n\n_+2:_ Jika Jagoan menyerang dengan senjata jarak dekat setelah menggunakan kemampuan senjata yang berbeda, serangan tersebut akan mengeksekusi musuh non-bos yang tersisa _di bawah 27% HP_.\n\n_+3:_ Jika Jagoan menyerang dengan senjata jarak dekat setelah menggunakan kemampuan senjata yang berbeda, serangan tersebut akan mengeksekusi musuh non-bos yang tersisa _di bawah 40% HP_.\n\nSerangan ini bisa berupa serangan senjata jarak dekat biasa, atau bagian dari kemampuan senjata.

actors.hero.talent.unencumbered_spirit.title=semangat tanpa beban
actors.hero.talent.unencumbered_spirit.desc=_+1:_ Biksu mendapatkan _ 50% lebih banyak energi_ untuk setiap peralatan _tingkat 3 atau lebih rendah_ yang dia gunakan.\n\n_+2:_ Biksu mendapatkan _ 75% lebih banyak energi_ untuk setiap peralatan _tingkat 2 atau lebih rendah_ yang dia gunakan. Manfaat tingkat 3 tidak berubah.\n\n_+3:_ Biksu mendapatkan _100% lebih banyak energi_ untuk setiap peralatan _tingkat 1 atau lebih rendah_ yang dia gunakan. Manfaat tingkat 2 dan 3 tidak berubah. Dia juga mendapatkan armor kain dan sarung tangan tajam secara gratis.\n\nPerhatikan bahwa bakat ini tidak memberikan manfaat jika tidak bersenjata atau menyerang dengan Cincin Pukulan.
actors.hero.talent.monastic_vigor.title=kekuatan biara
actors.hero.talent.monastic_vigor.desc=_+1:_ Jika Biksu memiliki _100% energi_, kemampuannya diperkuat.\n\n_+2:_ Jika Biksu memiliki _80% energi atau lebih_, kemampuannya diperkuat.\n\n_+3:_ Jika Biksu memiliki _60% energi atau lebih_, kemampuannya diperkuat.\n\nKetika diperkuat:\n- Pukulan Beruntun menerapkan enchantment senjatamu\n- Fokus dimulai secara instan\n- Berlari mendapatkan +4 jangkauan\n- Tendangan Naga menimbulkan +50% damage dan memberikan efek dorongan dan pelumpuhannya kepada semua musuh di sekelilingnya\n- Meditasi secara perlahan menyembuhkan 20% HP yang hilang dan memberikan ketahanan damage sebesar 80%.
actors.hero.talent.combined_energy.title=energi gabungan
actors.hero.talent.combined_energy.desc=_+1:_ Jika Biksu menggunakan kemampuan senjata dan kemampuan _4+ energi_ dalam 5 putaran satu sama lain, dia mendapatkan kembali 1 energi yang terpakai.\n\n_+2:_ Jika Biksu menggunakan kemampuan senjata dan kemampuan _3+ energi_ dalam 5 putaran satu sama lain, dia mendapatkan kembali 1 energi yang terpakai.\n\n_+3:_ Jika Biksu menggunakan kemampuan senjata dan kemampuan _2+ energi_ dalam 5 putaran satu sama lain, dia mendapatkan kembali 1 energi yang terpakai.

actors.hero.talent.close_the_gap.title=tutup celahnya
actors.hero.talent.close_the_gap.desc=_+1:_ Duelis berpindah _hingga dua ubin_ ke arah targetnya saat memulai duel.\n\n_+2:_ Duelis berpindah _hingga tiga ubin_ ke arah targetnya saat memulai duel.\n\n_+3:_ Duelis berpindah _hingga empat ubin_ ke arah targetnya saat memulai duel.\n\n_+4:_ Duelis berpindah _hingga lima ubin_ ke arah targetnya saat memulai duel. \n\nPerpindahan ini dapat menembus bahaya dan musuh, namun tidak dapat menembus medan padat seperti tembok. Perpindahan diperhitungkan saat menentukan apakah musuh berada dalam jangkauan yang akan ditantang.
actors.hero.talent.invigorating_victory.title=kemenangan yang menyegarkan
actors.hero.talent.invigorating_victory.desc=_+1:_ Jika Duelis mengalahkan targetnya sebelum duel berakhir, dia menyembuhkan _5 HP ditambah 30% damage_ yang diterimanya selama duel.\n\n_+2:_ Jika Duelis mengalahkan targetnya sebelum duel berakhir, dia menyembuhkan _10 HP ditambah 50% damage_ yang diterimanya selama duel.\n\n_+3:_ Jika Duelis mengalahkan targetnya sebelum duel berakhir, dia menyembuhkan _15 HP ditambah 65% damage_ yang diterimanya selama duel.\n\n_+4:_ Jika Duelis mengalahkan targetnya sebelum duel berakhir, dia menyembuhkan _20 HP ditambah 75% damage_ yang diterimanya selama duel.
actors.hero.talent.elimination_match.title=pertandingan eliminasi
actors.hero.talent.elimination_match.desc=_+1:_ Jika Duelis menantang lagi dalam 3 giliran setelah duel berakhir, tantangan tersebut memiliki _pengurangan 16%_ biaya daya.\n\n_+2:_ Jika Duelis menantang lagi dalam 3 giliran setelah duel berakhir, tantangan tersebut memiliki _pengurangan 30%_ biaya daya.\n\n_+3:_ Jika Duelis menantang lagi dalam 3 giliran setelah duel berakhir, tantangan tersebut memiliki _pengurangan 40%_ biaya daya.\n\n_+4:_ Jika Duelis menantang lagi dalam 3 giliran setelah duel berakhir, tantangan tersebut memiliki _pengurangan 50%_ biaya daya.

actors.hero.talent.elemental_reach.title=jangkauan elemental
actors.hero.talent.elemental_reach.desc=_+1:_ Jangkauan serangan elemen ditingkatkan menjadi _5 ubin_ dari 4, dan lebarnya ditingkatkan menjadi _75 derajat_ dari 65.\n\n_+2:_ Jangkauan serangan elemen ditingkatkan menjadi _6 ubin_ dari 4, dan lebarnya ditingkatkan menjadi _85 derajat_ dari 65.\n\n_+3:_ Jangkauan serangan elemen ditingkatkan menjadi _7 ubin_ dari 4, dan lebarnya ditingkatkan menjadi _95 derajat_ dari 65.\n\n_+4:_ Jangkauan serangan elemen ditingkatkan menjadi _8 ubin_ dari 4, dan lebarnya ditingkatkan menjadi _105 derajat_ dari 65.
actors.hero.talent.striking_force.title=kekuatan serangan
actors.hero.talent.striking_force.desc=_+1:_ Kekuatan efek serangan elemental meningkat sebesar _30%_.\n\n_+2:_ Kekuatan efek serangan elemental meningkat sebesar _60%_.\n\n_+3:_ Kekuatan efek serangan elemental meningkat sebesar _90%_.\n\n_+4:_ Kekuatan efek serangan elemental meningkat sebesar _120%_.
actors.hero.talent.directed_power.title=kekuatan terarah
actors.hero.talent.directed_power.desc=_+1:_ Serangan langsung dari serangan elemental memperoleh _+30% kekuatan enchantment _ untuk setiap musuh dalam jangkauan efek serangan elemental, termasuk target serangan.\n\n_+2:_ Serangan langsung dari serangan elemental memperoleh _+60% kekuatan enchantment _ untuk setiap musuh dalam jangkauan efek serangan elemental, termasuk target serangan.\n\n_+3:_ Serangan langsung dari serangan elemental memperoleh _+90% kekuatan enchantment _ untuk setiap musuh dalam jangkauan efek serangan elemental, termasuk target serangan.\n\n_+4:_ Serangan langsung dari serangan elemental memperoleh _+120% kekuatan enchantment _ untuk setiap musuh dalam jangkauan efek serangan elemental, termasuk target serangan.

actors.hero.talent.feigned_retreat.title=pura-pura mundur
actors.hero.talent.feigned_retreat.desc=_+1:_ Jika musuh menyerang bayangan belakang Duelist, dia mendapat _2 giliran_ kecepatan.\n\n_+2:_ Jika musuh menyerang bayangan belakang Duelist, dia mendapat _4 giliran_ kecepatan.\n\n_+3:_ Jika musuh menyerang bayangan belakang Duelis, dia mendapat _6 giliran_ kecepatan.\n\n_+4:_ Jika musuh menyerang bayangan belakang Duelis, dia mendapat _8 giliran_ kecepatan.
actors.hero.talent.expose_weakness.title=menampakkan kelemahan
actors.hero.talent.expose_weakness.desc=_+1:_ Musuh yang menyerang bayangan Duelis menjadi lemah dan rentan selama _2 giliran _.\n\n_+2:_ Musuh yang menyerang bayangan Duelis menjadi lemah dan rentan selama _4 giliran _.\n\n_+3:_ Musuh yang menyerang bayangan Duelis menjadi lemah dan rentan selama _6 giliran _.\n\n_+4:_ Musuh yang menyerang bayangan Duelis menjadi lemah dan rentan selama _8 giliran _.
actors.hero.talent.counter_ability.title=kemampuan melawan
actors.hero.talent.counter_ability.desc=_+1:_ Jika Duelis menggunakan kemampuan senjata dalam 3 giliran setelah bayangan belakangnya diserang, dia akan langsung mendapatkan kembali _0,38 daya_.\n\n_+2:_ Jika Duelis menggunakan kemampuan senjata dalam 3 giliran setelah bayangan belakangnya diserang, iadia akan langsung mendapatkan kembali _0,77 daya_.\n\n_+3:_ Jika Duelis menggunakan kemampuan senjata dalam 3 giliran setelah bayangan belakangnya diserang, iadia akan langsung mendapatkan kembali _1,33 daya_.\n\n_+4:_ Jika Duelis menggunakan kemampuan senjata dalam 3 giliran setelah bayangan belakangnya diserang, dia akan langsung mendapatkan kembali _1,5 daya_.

#cleric
actors.hero.talent.satiated_spells.title=Mantra Pemuas
actors.hero.talent.satiated_spells.desc=_+1:_ Memakan makanan menyebabkan Ulama memperoleh _3 perisai_ berikutnya saat mereka merapal mantra.\n\n_+2:_ Memakan makanan menyebabkan Ulama memperoleh _5 perisai_ berikutnya saat mereka merapal mantra.
actors.hero.talent.satiated_spells.meta_desc=_Jika bakat ini diperoleh pahlawan yang berbeda_, bakat ini akan segera memberikan perisai, yang akan mulai berkurang secara normal setelah 10 giliran.
actors.hero.talent.holy_intuition.title=intuisi suci
actors.hero.talent.holy_intuition.desc=_+1:_ Ulama dapat mengeluarkan _Intuisi Suci,_ mantra yang mengungkapkan apakah suatu barang dikutuk dengan biaya _3 daya._\n\n_+2:_ Ulama dapat mengeluarkan _Intuisi Suci,_ mantra yang mengungkapkan apakah suatu barang dikutuk dengan biaya _2 daya._
actors.hero.talent.holy_intuition.meta_desc=_Jika bakat ini diperoleh pahlawan yang berbeda_, bakat ini akan membiarkan pahlawan tersebut mengidentifikasi status kutukan pada item terkutuk sebelum memakainya, 15% dari waktu pada +1 atau 25% dari waktu pada +2.
actors.hero.talent.searing_light.title=Cahaya Pembakar
actors.hero.talent.searing_light.desc=_+1:_ Serangan fisik Ulama terhadap musuh yang diterangi oleh _Cahaya Pemandu_ memberikan _+3 damage._\n\n_+2:_ Serangan fisik Ulama terhadap musuh yang diterangi oleh _Cahaya Pemandu_ memberikan _+5 damage._
actors.hero.talent.searing_light.meta_desc=_Jika bakat ini diperoleh pahlawan yang berbeda_, bakat ini akan memberikan bonus damage setelah tongkat sihir atau artefak digunakan pada musuh, dengan cooldown 20 giliran.
actors.hero.talent.shield_of_light.title=perisai cahaya
actors.hero.talent.shield_of_light.desc=_+1:_ Ulama dapat mengeluarkan _Perisai Cahaya,_ mantra yang dikeluarkan secara instan dan memberi mereka _2-4 armor_ terhadap target selama 5 giliran dengan biaya 1 daya.\n\n_+2:_ Ulama dapat mengeluarkan _Perisai Cahaya,_ mantra yang dikeluarkan secara instan dan memberi mereka _3-6 armor_ terhadap target selama 5 giliran dengan biaya 1 daya.
actors.hero.talent.shield_of_light.meta_desc=_Jika bakat ini diperoleh pahlawan yang berbeda_, bakat ini akan mengurangi damage fisik yang diterima dari musuh yang menjadi targetmu sebesar 1, 33% dari waktu pada +1 atau 50% dari waktu pada +2.

actors.hero.talent.enlightening_meal.title=Makanan yang Mencerahkan
actors.hero.talent.enlightening_meal.desc=_+1:_ Memakan makanan akan memberikan 1 giliran kepada Ulama dan memberi mereka _0,67 daya_ pada kitab suci mereka.\n\n_+2:_ Memakan makanan akan memberikan 1 giliran kepada Ulama dan memberi mereka _1 daya_ pada kitab suci mereka.
actors.hero.talent.enlightening_meal.meta_desc=_Jika bakat ini diperoleh pahlawan yang berbeda_, maka akan memberikan 2 giliran charge tongkat sihir dan artefak pada +1, atau 3 giliran pada +2. Ini tidak dapat digunakan untuk mengisi ulang terompet kecukupan itu sendiri.
actors.hero.talent.recall_inscription.title=Pemanggil Kembali Prasasti
actors.hero.talent.recall_inscription.refunded=Item kamu telah dikembalikan!
actors.hero.talent.recall_inscription.desc=_+1:_ Ulama dapat mengeluarkan _Pemanggil Kembali Prasasti,_ mantra yang memungkinkan mereka mengulang efek dari batu kuno atau gulungan terakhir yang mereka gunakan dalam _10 giliran._\n\n_+2:_ Ulama dapat mengeluarkan _Pemanggil Kembali Prasasti,_ mantra yang memungkinkan mereka mengulang efek dari batu kuno atau gulungan terakhir yang mereka gunakan dalam _300 giliran._\n\nPemanggil Kembali Prasasti tidak dapat digunakan dengan gulungan peningkatan. Daya mantra ini bervariasi berdasarkan item mana yang baru saja digunakan: 2 untuk batu kuno, 3 untuk gulungan, 4 untuk gulungan eksotis. Biaya daya ini juga berlipat ganda saat digunakan dengan gulungan pengubah, atau item racikan yang harus dibuat menggunakan pengubah atau peningkatan.
actors.hero.talent.recall_inscription.meta_desc=_Jika bakat ini diperoleh pahlawan yang berbeda_, maka bakat ini akan mengembalikan gulungan atau batu kuno 10% dari waktu pada +1 atau 15% dari waktu pada +2. Gulungan Peningkatan dibebaskan dari efek ini.
actors.hero.talent.sunray.title=Sinar Mentari
actors.hero.talent.sunray.desc=_+1:_ Ulama dapat mengeluarkan _Sinar Mentari,_ mantra yang memberikan _4-8 damage_ dan membutakan target selama _4 giliran,_ dengan biaya 1 daya.\n\n_+2:_ Ulama dapat mengeluarkan _Sinar Mentari,_ mantra yang memberikan _6-12 damage_ dan membutakan target selama _6 giliran,_ dengan biaya 1 daya.\n\nSinar Mentari hanya dapat membutakan setiap target satu kali, tetapi jika target sudah dibutakan oleh Sinar Mentari maka ia akan lumpuh sebagai gantinya. Sinar Mentari selalu memberikan damage maksimum pada musuh iblis dan mayat hidup.
actors.hero.talent.sunray.meta_desc=_Jika bakat ini diperoleh pahlawan lain_, bakat ini akan menyebabkan tongkat sihir dan artefak membutakan musuh selama 4 giliran, 15% pada +1 atau 25% pada +2.
actors.hero.talent.divine_sense.title=Indera Ilahi
actors.hero.talent.divine_sense.desc=_+1:_ Ulama dapat mengeluarkan _Indera Ilahi,_ mantra yang memberi mereka _8 petak_ Penglihatan Pikiran selama 50 giliran dan tidak menghabiskan waktu untuk dirapalkan, dengan biaya 2 daya.\n\n_+2:_ Ulama dapat mengeluarkan _Indera Ilahi,_ mantra yang memberi mereka _12 petak_ Penglihatan Pikiran selama 50 giliran dan tidak menghabiskan waktu untuk dirapalkan, dengan biaya 2 daya.
actors.hero.talent.divine_sense.meta_desc=_Jika bakat ini diperoleh pahlawan yang berbeda_, bakat ini akan memberi mereka penglihatan pikiran untuk sesaat setelah menggunakan tongkat sihir atau artefak dengan jangkauan 3 petak pada +1 atau 5 petak pada +2.
actors.hero.talent.bless.title=Berkat
actors.hero.talent.bless.desc=_+1:_ Ulama dapat mengeluarkan _Berkat,_ mantra yang memberikan _6 giliran berkat dan 10 perisai_ saat dikeluarkan pada diri mereka sendiri atau _10 giliran berkat dan 10 penyembuhan_ saat dikeluarkan pada karakter lain, dengan biaya 1 daya.\n\n_+2:_ Ulama dapat mengeluarkan _Berkat,_ mantra yang memberikan _10 giliran berkat dan 15 perisai_ saat dikeluarkan pada diri mereka sendiri atau _15 giliran berkat dan 15 penyembuhan_ saat dikeluarkan pada karakter lain, dengan biaya 1 daya.\n\nKelebihan penyembuhan dari mantra ini diubah menjadi perisai.
actors.hero.talent.bless.meta_desc=_Jika bakat ini diperoleh pahlawan yang berbeda_, bakat ini akan meningkatkan akurasi dan penghindaran untuk pahlawan dan semua sekutu sebesar 3% pada +1 atau 5% pada +2.

actors.hero.talent.cleanse.title=Pembersih
actors.hero.talent.cleanse.desc=_+1:_ Ulama dapat mengeluarkan _Pembersih,_ mantra yang _menghilangkan efek negatif_ dari Ulama dan sekutu terdekat, dan memberi mereka _10 perisai,_ dengan biaya 2 daya.\n\n_+2:_ Ulama dapat mengeluarkan _Pembersih,_ mantra yang _memberikan 3 giliran kekebalan efek negatif_ kepada Ulama dan sekutu terdekat, dan memberi mereka _20 perisai,_ dengan biaya 2 daya.\n\n_+3:_ Ulama dapat mengeluarkan _Pembersih,_ mantra yang _memberikan 5 giliran kekebalan efek negatif_ kepada Ulama dan sekutu terdekat, dan memberi mereka _30 perisai,_ dengan biaya 2 daya.
actors.hero.talent.cleanse.meta_desc=_Jika bakat ini diperoleh pahlawan yang berbeda_, bakat ini akan membersihkan efek status negatif pada pahlawan setelah menggunakan tongkat sihir atau artefak, 10/20/30% dari waktu pada +1/+2/+3.
actors.hero.talent.light_reading.title=Bacaan Ringan
actors.hero.talent.light_reading.desc=_+1:_ Ulama dapat menggunakan kitab suci mereka saat tidak dipakai, tetapi terisi ulang pada _kecepatan 25%_ saat tidak dipakai.\n\n_+2:_ Ulama dapat menggunakan kitab suci mereka saat tidak dipakai, tetapi terisi ulang pada _kecepatan 50%_ saat tidak dipakai.\n\n_+3:_ Ulama dapat menggunakan kitab suci mereka saat tidak dipakai, tetapi terisi ulang pada _kecepatan 75%_ saat tidak dipakai.
actors.hero.talent.light_reading.meta_desc=_Jika bakat ini diperoleh pahlawan yang berbeda_, maka kecepatan pengisian ulang semua tongkat sihir akan meningkat sebesar 7/13/20% pada +1/+2/+3.

actors.hero.talent.holy_lance.title=Tombak Suci
actors.hero.talent.holy_lance.desc=_+1:_ Pendeta dapat mengeluarkan _Tombak Suci,_ mantra penghancur yang menghasilkan _30-55 damage_ dengan biaya 4 daya.\n\n_+2:_ Pendeta dapat mengeluarkan _Tombak Suci,_ mantra penghancur yang menghasilkan _45-83 damage_ dengan biaya 4 daya.\n\n_+3:_ Pendeta dapat mengeluarkan _Tombak Suci,_ mantra penghancur yang menghasilkan _60-110 damage_ dengan biaya 4 daya.\n\nTombak Suci selalu menghasilkan damage maksimum pada musuh iblis dan mayat hidup. Tombak Suci memiliki cooldown 30 giliran sebelum dapat dikeluarkan lagi.
actors.hero.talent.hallowed_ground.title=Tanah Suci
actors.hero.talent.hallowed_ground.desc= _+1:_ Pendeta dapat mengeluarkan _Tanah Suci,_ mantra yang menguduskan medan di _area 3x3_ selama 20 giliran, dengan biaya 2 daya.\n\n_+2:_ Pendeta dapat mengeluarkan _Tanah Suci,_ mantra yang menguduskan medan di _area 5x5_ selama 20 giliran, dengan biaya 2 daya.\n\n_+3:_ Priest dapat mengeluarkan _Tanah Suci,_ mantra yang menguduskan medan di area _7x7_ selama 20 giliran, dengan biaya 2 daya.\n\nSaat dikeluarkan, Tanah Suci menyembuhkan sekutu sebanyak 15 HP, menanam musuh sebentar, dan menyebarkan rumput pendek. Setelah itu, perlahan-lahan menyembuhkan sekutu, melumpuhkan musuh, dan menyebabkan rumput tinggi tumbuh secara acak. Tanah Suci memberikan perisai kepada Pendeta bukannya penyembuh dan dapat hancur oleh api.
actors.hero.talent.mnemonic_prayer.title=Doa Pengingat
actors.hero.talent.mnemonic_prayer.desc=_+1:_ Pendeta dapat mengeluarkan _Doa Pengingat,_ mantra yang memperpanjang buff/debuff pada sekutu/musuh selama _3 giliran_ dengan biaya 1 daya.\n\n_+2:_ Pendeta dapat mengeluarkan _Doa Pengingat,_ mantra yang memperpanjang buff/debuff pada sekutu/musuh selama _4 giliran_ dengan biaya 1 daya.\n\n_+3:_ Pendeta dapat mengeluarkan _Doa Pengingat,_ mantra yang memperpanjang buff/debuff pada sekutu/musuh selama _5 giliran_ dengan biaya 1 daya.\n\nDoa Pengingat tidak memerlukan waktu untuk dirapalkan. Doa Pengingat hanya dapat memperpanjang contoh buff/debuff tertentu satu kali, dan tidak dapat memperpanjang buff dari kemampuan armor.

actors.hero.talent.lay_on_hands.title=berbaring di tangan
actors.hero.talent.lay_on_hands.desc=_+1:_ Paladin dapat mengeluarkan _Berbaring di Tangan,_ mantra yang secara instan menyembuhkan karakter di sekitar sebesar _15 HP,_ atau memberi Paladin _15 perisai,_ dengan biaya 1 daya.\n\n_+2:_ Paladin dapat mengeluarkan _Berbaring di Tangan,_ mantra yang secara instan menyembuhkan karakter di sekitar sebesar _20 HP,_ atau memberi Paladin _20 perisai,_ dengan biaya 1 daya.\n\n_+3:_ Paladin dapat mengeluarkan _Berbaring di Tangan,_ mantra yang secara instan menyembuhkan karakter di sekitar sebesar _25 HP,_ atau memberi Paladin _25 perisai,_ dengan biaya 1 daya.\n\nPenyembuhan berlebih dari mantra ini diubah menjadi perisai. Berbaring di Tangan dapat dikeluarkan berulang kali, tetapi tidak dapat memberikan lebih dari tiga kali pengeluaran perisai sekaligus.
actors.hero.talent.aura_of_protection.title=aura perlindungan
actors.hero.talent.aura_of_protection.desc=_+1:_ Paladin dapat mengeluarkan _Aura Pelindung,_ mantra yang memberikan Paladin dan semua sekutu dalam radius 2 petak _20% ketahanan damage_ dan efek glyph armor Paladin pada kekuatan _+50%_ selama 20 giliran, dengan biaya 2 daya.\n\n_+2:_ Paladin dapat mengeluarkan _Aura Pelindung,_ mantra yang memberikan Paladin dan semua sekutu dalam radius 2 petak _30% ketahanan damage_ dan efek glyph armor Paladin pada kekuatan _+75%_ selama 20 giliran , dengan biaya 2 daya.\n\n_+3:_ Paladin dapat mengeluarkan _Aura Pelindung,_ mantra yang memberikan Paladin dan semua sekutu dalam radius 2 petak _40% ketahanan damage_ dan efek glyph armor Paladin pada kekuatan _+100%_ selama 20 giliran, dengan biaya 2 daya.
actors.hero.talent.wall_of_light.title=dinding cahaya
actors.hero.talent.wall_of_light.desc=_+1:_ Paladin dapat mengeluarkan _Dinding Cahaya,_ mantra yang menciptakan dinding kokoh selebar _3 petak_ di depan Paladin yang mendorong musuh dan bertahan selama 20 giliran, dengan biaya 3 daya.\n\n_+2:_ Paladin dapat mengeluarkan _Dinding Cahaya,_ mantra yang menciptakan dinding kokoh selebar _5 petak_ di depan Paladin yang mendorong musuh dan bertahan selama 20 giliran, dengan biaya 3 daya.\n\n_+3:_ Paladin dapat mengeluarkan _Dinding Cahaya,_ mantra yang menciptakan dinding kokoh selebar _7 petak_ di depan Paladin yang mendorong musuh dan bertahan selama 20 giliran, dengan biaya 3 daya.\n\nDinding dapat ditempatkan secara kardinal atau diagonal, hanya satu dinding yang dapat berdiri pada satu waktu.

actors.hero.talent.divine_intervention.title=intervensi ilahi
actors.hero.talent.divine_intervention.desc=_+1:_ Saat dalam Kenaikan Wujud, Ulama dapat mengeluarkan _Intervensi Ilahi,_ yang meningkatkan Ulama dan semua sekutu hingga _150 perisai_ dan memperpanjang Kenaikan Wujud sebanyak _3 giliran._\n\n_+2:_ Saat dalam Kenaikan Wujud, Ulama dapat mengeluarkan _Intervensi Ilahi,_ yang meningkatkan Ulama dan semua sekutu hingga _200 perisai_ dan memperpanjang Kenaikan Wujud sebanyak _4 giliran._\n\n_+3:_ Saat dalam Kenaikan Wujud, Ulama dapat mengeluarkan _Intervensi Ilahi,_ yang meningkatkan Ulama dan semua sekutu hingga _250 perisai_ dan memperpanjang Kenaikan Wujud sebanyak _5 giliran._\n\n_+4:_ Saat dalam Kenaikan Wujud, Ulama dapat mengeluarkan _Intervensi Ilahi,_ yang meningkatkan Ulama dan semua sekutu hingga  _300 perisai_ dan memperpanjang Kenaikan Wujud sebanyak _6 giliran._\n\nIntervensi Ilahi menghabiskan 5 daya buku, dan hanya dapat dilemparkan sekali dalam kenaikan wujud yang sama.
actors.hero.talent.judgement.title=keputusan
actors.hero.talent.judgement.desc=_+1:_ Saat dalam Kenaikan Wujud, Ulama dapat mengeluarkan _Keputusan,_ yang memberikan _10-20 damage_ ke semua musuh yang terlihat.\n\n_+2:_ Saat dalam Kenaikan Wujud, Ulama dapat mengeluarkan _Keputusan,_ yang memberikan _15-30 damage_ ke semua musuh yang terlihat.\n\n_+3:_ Saat dalam Kenaikan Wujud, Ulama dapat mengeluarkan _Keputusan,_ yang memberikan _20-40 damage_ ke semua musuh yang terlihat.\n\n_+4:_ Saat dalam Kenaikan Wujud, Ulama dapat mengeluarkan _Keputusan_, yang memberikan _25-50 damage_ ke semua musuh yang terlihat.\n\nKeputusan menghabiskan 3 daya buku. Keputusan memberikan 33% damage untuk setiap mantra yang telah dikeluarkan Ulama sejak memasuki kenaikan wujud atau sejak terakhir kali mengeluarkan Keputusan.
actors.hero.talent.flash.title=kilatan
actors.hero.talent.flash.desc=_+1:_ Saat dalam Kenaikan Wujud, Ulama dapat mengeluarkan _Kilat_ untuk berteleportasi hingga _3 petak_ jauhnya.\n\n_+2:_ Saat dalam Kenaikan Wujud, Ulama dapat mengeluarkan _Kilat_ untuk berteleportasi hingga _4 petak_ jauhnya.\n\n_+3:_ Saat dalam Kenaikan Wujud, Ulama dapat mengeluarkan _Kilat_ untuk berteleportasi hingga _5 petak_ jauhnya.\n\n_+4:_ Saat dalam Kenaikan Wujud, Ulama dapat mengeluarkan _Kilat_ untuk berteleportasi hingga _6 petak_ jauhnya.\n\nKilat awalnya memerlukan 2 daya buku, dan 1 daya lagi untuk setiap penggunaan dalam kenaikan wujud yang sama.

actors.hero.talent.body_form.title=bentuk tubuh
actors.hero.talent.body_form.desc=Ulama dapat mengeluarkan _bentuk tubuh_, yang menyematkan Trinitas dengan kekuatan dari enchantment atau glyph yang telah diidentifikasi Ulama dalam putaran ini, dengan biaya 2 daya.\n\n_+1:_ Saat Trinitas digunakan, Ulama mendapatkan efek yang dipilih selama _20 giliran._\n\n_+2:_ Saat Trinitas digunakan, Ulama mendapatkan efek yang dipilih selama _27 giliran._\n\n_+3:_ Saat Trinitas digunakan, Ulama mendapatkan efek yang dipilih selama _33 giliran._\n\n_+4:_ Saat Trinitas digunakan, Ulama mendapatkan efek yang dipilih selama _40 giliran._\n\nTrinitas hanya bisa menyematkan satu efek tubuh pada satu waktu. Biaya daya armor Trinitas lebih tinggi jika glyph yang dipilih langka dan kuat.
actors.hero.talent.mind_form.title=bentuk pikiran
actors.hero.talent.mind_form.desc=Ulama dapat mengeluarkan _bentuk pikiran_, yang menematkan trinitas dengan kekuatan tongkat sihir atau senjata lempar yang digunakan Ulama kali ini, dengan biaya 3 daya.\n\n_+1:_ Ketika Trinitas digunakan, Ulama menggunakan tembakan atau lemparan dari item yang dipilih, seolah-olah itu _+3._\n\n_+2:_ Ketika Trinitas digunakan, Ulama menggunakan tembakan atau lemparan dari item yang dipilih, seolah-olah itu _+4._\n\n_+3:_ Ketika Trinitas digunakan, Ulama menggunakan tembakan atau lemparan dari item yang dipilih, seolah-olah itu _+5._\n\n_+4:_ Ketika Trinitas digunakan, Ulama menggunakan tembakan atau lemparan dari item yang dipilih, seolah-olah itu _+6._\n\nTrinitas hanya bisa menyematkan satu efek pikiran dalam satu waktu.
actors.hero.talent.spirit_form.title=bentuk roh
actors.hero.talent.spirit_form.desc=Ulama dapat mengeluarkan _Bentuk Roh_, yang menyematkan Trinitas dengan kekuatan cincin atau artefak yang diidentifikasi Ulama dalam putaran ini (kecuali kitab suci), dengan biaya 4 daya.\n\n_+1:_ Ketika Trinitas digunakan, Ulama akan mendapatkan efek cincin pada _+1_ selama 20 giliran , atau akan memicu efek artefak pada _+4._\n\n_+2:_ Ketika Trinitas digunakan, Ulama akan mendapatkan efek cincin pada _+2_ selama 20 giliran, atau akan memicu efek artefak pada _+6._\n\n_+3:_ Ketika Trinitas digunakan, Ulama akan mendapatkan efek cincin pada _+3_ selama 20 giliran, atau akan memicu efek artefak pada _+8._\n\n_+4:_ Ketika Trinitas digunakan, Ulama akan mendapatkan efek cincin pada _+4_ selama 20 giliran, atau akan memicu efek artefak pada _+6._\n\nTrinitas hanya bisa menyematkan satu efek roh pada satu waktu. Artefak punya beragam efek dan biaya daya armor yang berbeda saat dipicu oleh Trinitas.

actors.hero.talent.beaming_ray.title=pancaran cahaya
actors.hero.talent.beaming_ray.desc=Ulama dapat mengeluarkan _Pancaran Cahaya_ dari sekutu yang kuat dengan biaya 1 daya. Cahaya ini dapat menembus dinding dan memindahkan sekutu ke lokasi yang ditargetkan. Jika musuh berada di lokasi tersebut, sekutu akan muncul di sebelah musuh dan akan menargetkan mereka. Pancaran Cahaya bahkan dapat memindahkan sekutu yang biasanya tidak bisa bergerak, tetapi memiliki setengah jangkauan saat melakukannya.\n\n_+1:_ Pancaran Cahaya punya jarak maksimal _4 petak,_ dan meningkatkan bonus Kekuatan Banyak menjadi _+35% damage_ terhadap musuh terdekat selama 10 giliran.\n\n_+2:_ Pancaran Cahaya punya jarak maksimal _8 petak,_ dan meningkatkan bonus Kekuatan Banyak menjadi _+40% damage_ terhadap musuh terdekat selama 10 giliran.\n\n_+3:_ Pancaran Cahaya punya jarak maksimal _12 petak,_ dan meningkatkan bonus Kekuatan Banyak menjadi _+45% damage_ terhadap musuh terdekat selama 10 giliran.\n\n_+4:_ Pancaran Cahaya punya jarak maksimal _16 petak,_ dan meningkatkan bonus Kekuatan Banyak menjadi _+50% damage_ terhadap musuh terdekat selama 10 giliran.
actors.hero.talent.life_link.title=ikatan kehidupan
actors.hero.talent.life_link.desc=Ulama dapat menggunakan _Ikatan Kehidupan_ antara mereka dan sekutu yang kuat dengan biaya 2 daya. Mantra ini menyebabkan damage dibagi antara Ulama dan sekutunya, dan menyebabkan mantra pendeta yang bermanfaat dari tingkat 3 atau lebih rendah berlaku untuk keduanya jika salah satu terpengaruh.\n\n_+1:_ Ikatan Kehidupan berlangsung selama _10 giliran_ dan meningkatkan bonus Kekuatan Banyak menjadi _-35% damage yang diterima._\n\n_+2:_ Ikatan Kehidupan berlangsung selama _13 giliran_ dan meningkatkan bonus Kekuatan Banyak menjadi _-40% damage yang diterima._\n\n_+3:_ Ikatan Kehidupan berlangsung selama _17 giliran_ dan meningkatkan bonus Kekuatan Banyak menjadi _-45% damage yang diterima._\n\n_+4:_ Ikatan Kehidupan berlangsung selama _20 giliran_ dan meningkatkan bonus Kekuatan Banyak menjadi _-50% damage yang diterima._
actors.hero.talent.stasis.title=Statis
actors.hero.talent.stasis.desc=Ulama dapat menggunakan _Stasis_ pada sekutu yang kuat dengan biaya 2 daya. Stasis akan mengeluarkan sekutu tersebut dari terungku untuk sementara dan mempertahankan sisa waktu pada semua peningkatan, termasuk Kekuatan Banyak. Sekutu akan muncul kembali di sampingmu saat efeknya berakhir. Stasis dapat digunakan kembali secara instan dan tanpa biaya untuk mengakhiri efek lebih awal. Stasis bekerja pada sekutu yang tidak bisa bergerak, tetapi tidak dapat memindahkan mereka di antara lantai terungku.\n\n_+1:_ Stasis berlangsung selama maksimal _60 giliran._\n\n_+2:_ Stasis berlangsung selama maksimal _90 giliran._\n\n_+3:_ Stasis berlangsung selama maksimal _120 giliran._\n\n_+4:_ Stasis berlangsung selama maksimal _150 giliran._\n\nUlama juga dapat menggunakan Pancaran Cahaya saat sekutu dalam keadaan statis untuk memanggil mereka kembali, atau menggunakan Ikatan Kehidupan untuk menerapkan efeknya terlebih dahulu. Namun, sekutu tidak mendapatkan manfaat dari Ikatan Kehidupan saat dalam keadaan statis.


#universal
actors.hero.talent.heroic_energy.title=energi heroik
actors.hero.talent.heroic_energy.rat_title=energi kejam
actors.hero.talent.heroic_energy.desc=_+1:_ Kemampuan armor pahlawan memiliki _Pengurangan 12%_ biaya daya. \n\n_+2:_ Kemampuan armor pahlawan memiliki _Pengurangan 23%_ biaya daya. \n\n_+3:_ Kemampuan armor pahlawan memiliki _Pengurangan 32%_ biaya daya. \n\n_+4:_ Kemampuan armor pahlawan memiliki _Pengurangan 40%_ biaya daya.

actors.hero.talent.ratsistance.title=daya tahan
actors.hero.talent.ratsistance.desc=_+1:_ Musuh yang diubah menjadi tikus memberikan _-10% damage_.\n\n_+2:_ Musuh yang diubah menjadi tikus memberikan _-19% damage_.\n\n_+3:_ Musuh yang diubah menjadi tikus memberikan _-27% damage_.\n\n_+4:_ Musuh yang diubah menjadi tikus memberikan _-35% damage_.
actors.hero.talent.ratlomacy.title=tikusomasi
actors.hero.talent.ratlomacy.desc=_+1:_ Menggunakan tikusisasi kepada musuh yang sudah berubah jadi tikus akan membuat mereka menjadi kawan dan perubahannya akan menjadi permanen.\n\n_+2:_ Menggunakan tikusisasi kepada musuh yang sudah sudah berubah jadi tiikus akan membuat mereka menjadi kawan dan perubahannya akan menjadi permanen, dan juga mereka akan mendapatkan adrenalin selama _2 giliran_.\n\n_+3:_ Menggunakan tikusisasi kepada musuh yang sudah sudah berubah jadi tiikus akan membuat mereka menjadi kawan dan perubahannya akan menjadi permanen, dan juga mereka akan mendapatkan adrenalin selama _4 giliran_.\n\n_+4:_ Menggunakan tikusisasi kepada musuh yang sudah sudah berubah jadi tiikus akan membuat mereka menjadi kawan dan perubahannya akan menjadi permanen, dan juga mereka akan mendapatkan adrenalin selama _6 giliran_.
actors.hero.talent.ratforcements.title=pasukan tikus
actors.hero.talent.ratforcements.desc=_+1:_ Menggunakan tikusisasi pada diri sendiri akan _memunculkan 1_ sekutu tikus marsupial di sebelahmu.\n\n_+2:_ Menggunakan tikusisasi pada diri sendiri akan _memunculkan 2_ sekutu tikus marsupial di sebelahmu.\n\n_+3:_ Menggunakan tikusisasi pada diri sendiri akan _memunculkan 3_ sekutu tikus marsupial di sebelahmu.\n\n_+4:_ Menggunakan tikusisasi pada diri sendiri akan _memunculkan 4_ sekutu tikus marsupial di sebelahmu.



###npcs
actors.mobs.npcs.blacksmith.name=pandai besi troll
actors.mobs.npcs.blacksmith.intro_quest_warrior=Hai Manusia! Kamu terlihat seperti orang yang tangguh.
actors.mobs.npcs.blacksmith.intro_quest_mage=Hai Manusia! Kamu terlihat seperti orang yang pintar.
actors.mobs.npcs.blacksmith.intro_quest_rogue=Hai Manusia! Kamu terlihat seperti orang yang licik.
actors.mobs.npcs.blacksmith.intro_quest_huntress=Hai Manusia! Kamu terlihat seperti orang yang cepat.
actors.mobs.npcs.blacksmith.intro_quest_duelist=Hai Manusia! Kamu terlihat seperti orang yang pemberani.
actors.mobs.npcs.blacksmith.intro_quest_cleric=Hai Manusia! Kamu terlihat seperti orang yang penting.
actors.mobs.npcs.blacksmith.intro_quest_start=Ingin berguna, ya?  Ya, saya punya sesuatu yang bisa kamu lakukan.  Saya membangun bengkel ini di atas sebuah tambang tua, letaknya di bawah tangga itu. Ambil beliung ini dan ambilkan saya beberapa _bijih emas gelap. 40 buah_ seharusnya cukup. Batuan di bawahnya bagus dan lembut sehingga _kamu akan dapat menembus dinding tanpa susah payah._\n\nApa maksudmu, bagaimana saya akan membayarnya? Kamu serakah... \n\nOke, oke, saya bisa melakukan sedikit pekerjaan untukmu.  Anggaplah dirimu beruntung, saya satu-satunya pandai besi yang ada.
actors.mobs.npcs.blacksmith.intro_quest_crystal=Namun hati-hati, tambang itu berbahaya bagi manusia kecil sepertimu. Itu telah ditinggalkan untuk sementara waktu, dan kumpulan kristal mulai tumbuh. Mereka berkilau, tapi terlalu rapuh untuk tidak bernilai apa pun, dan mereka punya benda ajaib yang melindunginya. Mereka cukup kuat, jadi _berhati-hatilah saat menambang_ atau kamu akan menarik perhatian mereka.\n\nAda juga _kristal raksasa_ di suatu tempat. Ini jauh lebih sulit, jadi bersiaplah untuk bertarung jika kau mulai memecahkannya. Saya yakin menghancurkannya akan memperlambat pertumbuhan kristal, jadi saya akan membayar lebih jika kamu bisa melakukannya.
actors.mobs.npcs.blacksmith.intro_quest_gnoll=Namun hati-hati, tambang itu berbahaya bagi manusia kecil sepertimu. Beberapa gnoll juga menginginkan emas itu dan sekarang mereka merusak tempatnya. Itu adalah hal-hal yang bodoh, jadi penambangan mereka telah menyebabkan berbagai macam keruntuhan dan longsor. Kamu harus menambangnya, jadi _carilah batu yang baru saja terganggu._\n\nSaya pikir salah satu gnoll yang menyebabkan sebagian besar masalah, mungkin _dukun geomancer_ atau semacamnya. Saya akan membayar lebih, jika kamu dapat menemukan dan membunuhnya, tapi saya yakin dia akan melawan.
actors.mobs.npcs.blacksmith.intro_quest_fungi=Namun hati-hati, tambang itu berbahaya bagi manusia kecil sepertimu. Ada semacam monster jamur yang tumbuh di bawah sana. Ada penjaga jamur yang sangat mematikan jika mereka melihatmu, tapi setidaknya mereka tidak bisa bangun dan mengejarmu. _Jauhkan dari pandangan_ jika kamu ingin tetap hidup.\n\nSaya akan membayar lebih jika kamu berhasil memusnahkan _jamur terbesar_, tetapi itu memerlukan usaha yang sungguh-sungguh. Itu terhubung ke sekelompok simpul miselium yang tersembunyi di dinding. Kamu harus menghancurkan sebagian besarnya sebelum kamu benar-benar dapat merusaknya.
actors.mobs.npcs.blacksmith.reminder=Kamu selesai membuang-buang waktuku?  Pintu masuk tambang ada di sana.
actors.mobs.npcs.blacksmith.reminder_crystal=Bawakan saya emas sebanyak yang kamu bisa, dan cobalah untuk memecahkan kristal besar itu juga.
actors.mobs.npcs.blacksmith.reminder_gnoll=Bawakan saya emas sebanyak yang kamu bisa, dan cobalah untuk membunuh gnoll geomancer itu juga.
actors.mobs.npcs.blacksmith.reminder_fungi=Bawakan saya emas sebanyak yang kamu bisa, dan cobalah untuk membunuh jamur raksasa itu juga.
actors.mobs.npcs.blacksmith.lost_pick=Apa kamu mempermainkanku? Mana beliungku?!
actors.mobs.npcs.blacksmith.quest_start_prompt=Kamu siap untuk turun? Pastikan kamu memiliki ruang kosong untuk emas.\n\n_Saya hanya membiarkanmu turun sekali saja!_
actors.mobs.npcs.blacksmith.enter_yes=Aku Siap
actors.mobs.npcs.blacksmith.enter_no=Belum
actors.mobs.npcs.blacksmith.exit_warn_none=Kamu sudah selesai? Kamu hampir tidak punya emas sama sekali! Kamu seharusnya bisa mendapatkan _40 buah._\n\n_Ingat, saya tidak akan membiarkanmu masuk kembali setelah kamu datang._
actors.mobs.npcs.blacksmith.exit_warn_low=Kamu sudah selesai? Sepertinya kamu tidak punya banyak emas. Kamu seharusnya bisa mendapatkan _40 buah._\n\n_Ingat, saya tidak akan membiarkanmu masuk kembali setelah kamu datang._
actors.mobs.npcs.blacksmith.exit_warn_med=Kamu sudah selesai? Setidaknya kamu punya emas, tapi pasti masih ada lagi di tambang. Kamu seharusnya bisa mendapatkan _40 buah._\n\n_Ingat, saya tidak akan membiarkanmu masuk kembali setelah kamu datang._
actors.mobs.npcs.blacksmith.exit_warn_high=Kamu sudah selesai? Sepertinya kamu punya banyak emas, tapi saya bisa menggunakan lebih banyak. Kamu seharusnya bisa mendapatkan _40 buah._\n\n_Ingat, saya tidak akan membiarkanmu masuk kembali setelah kamu datang._
actors.mobs.npcs.blacksmith.exit_warn_full=Kamu sudah selesai? Kamu memiliki banyak emas, tapi pastikan kamu tidak meninggalkan satu pun perlengkapanmu.\n\n_Ingat, saya tidak akan membiarkanmu masuk kembali setelah kamu datang._
actors.mobs.npcs.blacksmith.exit_warn_crystal=Kristal raksasa itu juga masih ada di bawah sana. Saya akan membayar lebih jika kamu menghancurkannya.
actors.mobs.npcs.blacksmith.exit_warn_gnoll=Gnoll geomancer itu juga masih ada di bawah sana. Saya akan membayar lebih jika kamu membunuhnya.
actors.mobs.npcs.blacksmith.exit_warn_fungi=Jamur raksasa itu juga masih ada di bawah sana. Saya akan membayar lebih jika kamu membunuhnya.
actors.mobs.npcs.blacksmith.exit_yes=Aku Selesai
actors.mobs.npcs.blacksmith.exit_no=Belum
actors.mobs.npcs.blacksmith.get_lost=Aku sibuk. Pergilah!
actors.mobs.npcs.blacksmith.entrance_blocked=Jalan ke bawah sudah ditutup.
actors.mobs.npcs.blacksmith.cant_enter_old=Area itu tidak dapat diakses dalam perjalanan ini. Mainkan game baru untuk mencoba misi baru!
actors.mobs.npcs.blacksmith.def_verb=ketahan
actors.mobs.npcs.blacksmith.desc=Pandai besi troll ini terlihat seperti troll biasanya: dia tinggi dan ramping, dan kulitnya menyerupai batu baik dalam segi warna maupun tekstur. Pandai besi troll sedang mengutak-atik peralatan kecil yang tidak proporsional.

actors.mobs.npcs.ghost.name=hantu sedih
actors.mobs.npcs.ghost.rat_1=Halo %s... Dulu saya seperti dirimu - kuat dan percaya diri... Tapi saya dibunuh makhluk buruk... Saya tak dapat meninggalkan tempat ini... Tidak sampai dendamku terbalaskan... Bunuh _tikus busuk,_ yang telah mengambil nyawaku...\n\nIa mengintai di lantai ini... Menyebarkan kotoran ke mana-mana... _Hati-hati dengan awan bau dan gigitan korosifnya, asamnya larut dalam air..._
actors.mobs.npcs.ghost.rat_2=Tolong... Tolong aku... Musnahkan kekejian...\n\n_Lawanlah makhluk itu di dekat air... Hindari bau busuknya..._
actors.mobs.npcs.ghost.gnoll_1=Halo %s... Dulu saya sepertimu - kuat dan percaya diri... Tapi saya dibunuh oleh musuh tersembunyi... Saya tidak bisa meninggalkan tempat ini... Tidak sampai dendamku terbalaskan... Bunuhlah _gnoll penipu_ yang telah mengambil nyawaku...\n\nDia tidak seperti gnoll lainnya... Dia bersembunyi dan memakai senjata jarak jauh... _Hati-hati terhadap panah racun dan panah api yang ia miliki, jangan menyerang dari jarak jauh..._
actors.mobs.npcs.ghost.gnoll_2=Tolong... Tolonglah saya... Bunuh penipu itu...\n\n_Jangan biarkan dia menyerangmu... Dekatilah..._
actors.mobs.npcs.ghost.crab_1=Halo %s... Dulu saya sepertimu - kuat dan percaya diri... Tapi saya dibunuh oleh makhluk keramat... Saya tidak bisa meninggalkan tempat ini... Tidak sampai dendamku terbalaskan... Bantai _kepiting raksasa_ yang telah mengambil nyawaku.\n\nUsianya sangat tua... Dengan cakar tunggal yang besar dan cangkang yang tebal... _Hati-hati dengan cakarnya, kamu harus mengejutkan kepiting itu atau dia akan menahan dengan itu..._
actors.mobs.npcs.ghost.crab_2=Tolong... Tolong saya... Bunuh krustasea itu...\n\n_Dia akan selalu menahan... Saat ia melihat kamu datang..._
actors.mobs.npcs.ghost.find_me=Terima kasih... carilah saya...
actors.mobs.npcs.ghost.desc=Hantu itu hampir tak terlihat. Dia terlihat seperti cahaya tak berbentuk dengan wajah sedih.

actors.mobs.npcs.imp.name=iblis kecil ambisius
actors.mobs.npcs.imp.intro=Apalah kau seorang petualang? Aku suka petualang! Kau selalu bisa mengandalkan mereka jika ada sesuatu yang harus dibunuh, benarkan? Tentunya untuk hadiah ;)
actors.mobs.npcs.imp.golems_1=Dalam kasus saya, _golem_ yang perlu dibunuh. Soalnya, saya akan memulai bisnis kecil-kecilan di sini, tapi golem bodoh itu buruk untuk bisnisku! Sangat sulit untuk bernegosiasi dengan bongkahan granit yang berkeliaran, sialan! Jadi tolong bunuh... kira-kira _4 dari mereka_ dan hadiah ini menjadi milikmu.
actors.mobs.npcs.imp.monks_1=Dalam kasus saya, _biksu_-lah yang harus dibunuh. Anda tahu, saya akan memulai bisnis kecil-kecilan di sini, tetapi orang-orang gila itu sendiri tidak membeli apa pun dan akan menakuti pelanggan lain. Jadi tolong bunuh... kira-kira _5 dari mereka_ dan hadiah ini menjadi milikmu.
actors.mobs.npcs.imp.golems_2=Bagaimana safari golemmu? Jangan lupa untuk mengambil token itu.
actors.mobs.npcs.imp.monks_2=Oh, kamu masih hidup! Saya tahu kung-fu kamu lebih kuat ;) Jangan lupa untuk mengambil token itu.
actors.mobs.npcs.imp.cya=Sampai jumpa, %s!
actors.mobs.npcs.imp.hey=Psst, %s!
actors.mobs.npcs.imp.desc=Iblis kecil adalah iblis yang lebih rendah. Mereka terkenal baik karena kekuatan maupun bakat sihirnya, namun mereka pintar dan mudah bergaul. Banyak iblis kecil yang lebih memilih hidup di antara non-iblis.

actors.mobs.npcs.impshopkeeper.name=iblis kecil ambisius
actors.mobs.npcs.impshopkeeper.greetings=Halo, %s!
actors.mobs.npcs.impshopkeeper.greetings_ascent=Apa yang kamu lakukan %s? Cepat belanja. Saya harus keluar dari sini!
actors.mobs.npcs.impshopkeeper.thief=Kukira aku bisa mempercayaimu!
actors.mobs.npcs.impshopkeeper.buyback=Iblis kecil itu dengan senang hati mengembalikan barangmu.
actors.mobs.npcs.impshopkeeper.desc=Iblis kecil membangun sebuah toko pada pinggir aula, dia memiliki wajah yang bersahabat namun dengan harga yang tidak bersahabat.

actors.mobs.npcs.mirrorimage.name=cerminan diri
actors.mobs.npcs.mirrorimage.desc=Ilusi ini mirip denganmu, bahkan ia memegang senjata dan memakai armor yang sama denganmu.\n\nCerminan diri akan mencari dan menyerang musuh menggunakan senjata tiruannya itu, yang mana mempunyai sifat yang sama denganmu, namun memberikan damage lebih sedikit. Awalnya mereka hampir tidak terlihat, namun mereka harus memadatkan diri agar dapat menyerang musuh.\n\nMemang serangan mereka dapat diandalkan, namun pertahannya sangat lemah, sekali saja terserang mereka akan langsung menghilang.
actors.mobs.npcs.mirrorimage.discover_hint=Kamu bisa menemukan karakter ini dengan suatu gulungan khusus.

actors.mobs.npcs.npc.discover_hint=Kamu bisa menemukan karakter ini di wilayah tertentu di terungku.

actors.mobs.npcs.prismaticimage.name=bayangan prismatik
actors.mobs.npcs.prismaticimage.desc=Ilusi berkilauan ini memiliki kemiripan yang dekat denganmu, bahkan tampaknya memegang senjata dan armor yang sama seperti milikmu saat ini.\n\nBayangan prismatik akan mencari dan fokus kepada musuh, menggunakan pertahanan dan kesehatan tingkat tinggi untuk melindungimu. Meskipun mereka tidak memiliki kekuatan serangan yang sama dengan cerminan diri, mereka memiliki daya tahan yang ditingkatkan, termasuk menerima manfaat dari armormu.\n\nKetika darahnya habis, bayangan prismatik akan memudar dalam beberapa giliran, dan masih dapat disembuhkan selama waktu ini. Ketika tidak ada musuh, gambar prismatik akan memudar dan bergabung kembali dengan tuannya.
actors.mobs.npcs.prismaticimage.discover_hint=Kamu bisa menemukan karakter ini dengan suatu gulungan khusus.

actors.mobs.npcs.ratking.name=raja tikus
actors.mobs.npcs.ratking.not_sleeping=Gua gak tidur!
actors.mobs.npcs.ratking.what_is_it=Apaan? Gua gak punya waktu buat omong kosong ni. Kerajaan gua gak bakal bisa ngaturin diri sendiri!
actors.mobs.npcs.ratking.confused=Apa... Di mana gua? Kerajaanku perlu gua!
actors.mobs.npcs.ratking.crown_clothes=Pake beberapa baju! Lu nggak dalam keadaan buat ngomong sama bangsawan!
actors.mobs.npcs.ratking.crown_desc=Oooh, apa mahkota itu untuk gua!? Itu terlihat jauh lebih bersinar dari mahkota punya gua, jadi gua dengan senang hati akan menerimanya!\n\nSebenarnya, kupikir gua bisa nawarin lu sesuatu sebagai hadiah untuk mahkota ini. Kekuatan luar biasa yang cocok buat pahlawan kayak lu! Apa lu mau?
actors.mobs.npcs.ratking.crown_yes=Tentu saja!
actors.mobs.npcs.ratking.crown_info=Beritahu informasi lebih lanjut.
actors.mobs.npcs.ratking.crown_no=Kurasa tidak...
actors.mobs.npcs.ratking.crown_thankyou=Hehehe, terima kasih! Sekarang pergi dan buat rajamu bangga!
actors.mobs.npcs.ratking.crown_fine=Ya udah! Lagipun aku gak begitu pengen...
actors.mobs.npcs.ratking.crown_after=Menikmati armor barumu? Gak bisa diubah kembali loh!
actors.mobs.npcs.ratking.desc_crown=Tikus ini sedikit lebih besar daripada tikus marsupial biasa. Dia memakai mahkota raja kurcaci di kepalanya.
actors.mobs.npcs.ratking.desc_birthday=Tikus ini sedikit lebih besar dari tikus marsupial biasanya. Ia memakai topi pesta kecil bewarna hijau, bukan sebuah mahkota seperti biasanya. Selamat ulang tahun Raja tikus!
actors.mobs.npcs.ratking.desc_winter=Tikus ini sedikit lebih besar dari pada tikus marsupial biasanya. Ia memakai topi pesta kecil, bukan sebuah mahkota biasanya. Selamat Berlibur!
actors.mobs.npcs.ratking.desc=Tikus ini sedikit lebih besar daripada tikus marsupial biasa. Dia memakai mahkota kecil di kepalanya.
actors.mobs.npcs.ratking.discover_hint=Kamu bisa menemukan karakter ini di akhir wilayah tertentu di terungku.

actors.mobs.npcs.sheep.name=domba
actors.mobs.npcs.sheep.baa!=Mbeek!
actors.mobs.npcs.sheep.baa?=Mbeek?
actors.mobs.npcs.sheep.baa.=Mbeek.
actors.mobs.npcs.sheep.baa...=Mbeek...
actors.mobs.npcs.sheep.def_verb=ketahan
actors.mobs.npcs.sheep.desc=Ini adalah domba ajaib. Apa yang membuat mereka ajaib? Kamu tak bisa membunuhnya. Mereka akan diam di sana sampai menghilang secara ajaib dengan sendirinya, selagi mengunyah rumput dengan tatapan kosong.
actors.mobs.npcs.sheep.discover_hint=Kamu bisa menemukan karakter ini dengan suatu item atau jebakan khusus.

actors.mobs.npcs.shopkeeper.name=penjaga toko
actors.mobs.npcs.shopkeeper.thief=Maling, Maling!
actors.mobs.npcs.shopkeeper.warn=Awas! Aku takkan mengingatkanmu lagi.
actors.mobs.npcs.shopkeeper.flee=Sang pemilik toko pergi!
actors.mobs.npcs.shopkeeper.sell=Jual sebuah item
actors.mobs.npcs.shopkeeper.talk=Bicara
actors.mobs.npcs.shopkeeper.buyback=Sang penjaga toko dengan enggan mengembalikan barangmu.
actors.mobs.npcs.shopkeeper.talk_prison_intro=Aku punya segala hal yang kamu butuhkan untuk petualangan yang sukses!
actors.mobs.npcs.shopkeeper.talk_prison_warrior=Itu segel menarik yang kamu dapatkan disana, mereka biasanya berada dalam keadaan utuh. Apakah kamu seorang pahlawan yang dipermalukan atau semacamnya? yah, apapun yang telah kamu lakukan bukanlah urusanku, koinmu tetaplah bagus.
actors.mobs.npcs.shopkeeper.talk_prison_mage=Hehe, saya sepertinya pernah melihat poster dicari dengan namamu disuatu tempat di kota. Dalam pelarian, ya? Oh kamu tidak bersalah ya? tentu, tentu... jangan khawatir, saya punya urusan yang lebih baik daripada melaporkanmu, tapi mungkin saja kamu perlu membeli sesuatu untuk memastikan?
actors.mobs.npcs.shopkeeper.talk_prison_rogue=Apakah kamu datang dari kumpulan pencuri untuk membersihkan area tersebut? Tidak, hanya berbelanja? Kami akan membunuh beberapa monster selagi kamu di sini. Jangan mengharapkan diskon juga, saya membayar uang perlindungan yang baik kepada kalian dan kalian hampir tidak bisa menjagaku tetap aman di sini.
actors.mobs.npcs.shopkeeper.talk_prison_huntress=Sepertinya kamu sudah keluar dari dasarmu, Nona. Lorong terungku yang sempit tidak seluas aula besar atau hutan di sekitar kota, bukan? Hehe, oh tidak keberatan saya mengoceh, kenapa tidak beli sesuatu?
actors.mobs.npcs.shopkeeper.talk_prison_duelist=Nah kalau itu bukanlah pahlawan pengembara! Jika kamu sedang mencoba menyelamatkan kota lain maka semoga berhasil, bahaya yang ada disini lebih buruk daripada geng bandit kecil. Aku yakin kamu lebih baik dalam hal ini daripada orang lain, cobalah untuk tidak mati tepat di luar tokoku.
actors.mobs.npcs.shopkeeper.talk_prison_cleric=Baiklah, halo Yang Mulia, atau sekarang Yang Agung? Hehe, bagaimanapun juga ini bukan tempat untukmu, banyak orang akan sangat sedih jika kamu akhirnya meninggal. Tentunya kamu punya beberapa koin, mengapa tidak membeli sesuatu untuk membantu mencegahnya?
actors.mobs.npcs.shopkeeper.talk_caves=Habiskan uang, hidup lebih lama. \n\nOh dan sapalah pandai besi Troll itu untukku jika kamu melihatnya.  Ingatkan si lug bahwa dia masih berhutang uang padaku untuk palu yang saya jual padanya minggu lalu!
actors.mobs.npcs.shopkeeper.talk_city=Barang daganganku bisa membuatmu aman dibawah sini\n\n...Dan jangan berkeliaran jika kamu mau. Butuh waktu lama untuk untuk membuat penduduk setempat disini meninggalkanku sendiri, aku tidak ingin kamu membuat masalah!
actors.mobs.npcs.shopkeeper.talk_halls=Hai, saya punya harga spesial untuk pemburu iblis! \n\nOh dan hati-hati di bawah sana! Iblis di bawah sana tidak akan peduli seberapa beraninya kamu. Kamu tidak dapat bangkit kembali dan mengeluarkan lebih banyak uang jika kamu mati!  ;)\n\nApakah iblis-iblis itu sama sepertiku? Hehe, tidak sama sekali. Saya hanyalah iblis kecil, bukan petarung yang hebat, dan saya berhasil menjaga pikiranku tetap utuh. Iblis-iblis di bawah sana jauh lebih kuat, dan mereka semua telah diperbudak oleh... yah... berhati-hatilah di bawah sana.
actors.mobs.npcs.shopkeeper.talk_ascent=Saya tidak tahu apa yang kamu rencanakan dengan jimat itu tapi saya tidak ingin terlibat dengan itu. Belilah sesuatu dan segera berjalan, kita berdua harus keluar dari tempat ini!
actors.mobs.npcs.shopkeeper.desc=Pria gemuk ini terlihat lebih cocok untuk distrik perdagangan di kota besar daripada terungku. Harganya menjelaskan mengapa dia lebih memilih berbisnis di sini.

actors.mobs.npcs.wandmaker.name=pembuat tongkat sihir
actors.mobs.npcs.wandmaker.intro_warrior=Oh, halo! Sungguh kejutan yang menyenangkan bertemu dengan seorang pendekar dari utara di tempat yang begitu menyedihkan! Kamu harus melakukan perjalanan yang cukup jauh untuk sampai ke sini. Jika kamu mencari sebuah petualangan, saya mungkin punya tugas untukmu.
actors.mobs.npcs.wandmaker.intro_rogue=Oh Tuhanku, kamu mengangetkanku! Saya tidak pernah menemui bandit disini yang masih waras, jadi kamu pasti dari permukaan! Jika kau bersedia membantu seseorang, saya disini punya tugas untukmu.
actors.mobs.npcs.wandmaker.intro_mage=Oh, halo %s!  Kudengar ada keributan antara kamu dan institut penyihir?  Oh sudahlah, lagipula saya tidak pernah menyukai hal-hal yang menempel di lumpur itu. Jika kamu bersedia, saya mungkin punya tugas untukmu.
actors.mobs.npcs.wandmaker.intro_huntress=Oh, halo nona! Wajah ramah adalah kejutan yang menyenangkan di sini bukan? Sebenarnya, saya bersumpah pernah melihat wajahmu sebelumnya, tapi saya tidak tahu pasti... Oh sudahlah, jika kamu di sini untuk berpetualang, saya mungkin punya tugas untukmu.
actors.mobs.npcs.wandmaker.intro_duelist=Oh, halo nona! Sungguh kejutan yang menyenangkan dapat bertemu dengan pahlawan di tempat yang buruk ini! Jika kamu berencana untuk membantu pria tua ini, saya punya sebuah tugas untukmu.
actors.mobs.npcs.wandmaker.intro_cleric=Oh, halo Yang Mulia! Sungguh kejutan yang menyenangkan bertemu Anda di tempat yang menyedihkan ini! Saya tidak suka memaksakan, tetapi saya mungkin punya tugas untukmu.
actors.mobs.npcs.wandmaker.intro_1=\n\nAku datang ke sini untuk mencari bahan langka untuk sebuah tongkat sihir, tapi aku sepertinya tersesat, dan pelindung sihirku sudah melemah. Aku harus segera pergi, tapi aku tidak bisa pergi sebelum aku mendapat apa yang kumau.
actors.mobs.npcs.wandmaker.intro_dust=Saya sedang mencari _abu mayat._ Itu ada di tulang terkutuk spesial yang memang biasanya ada di tempat seperti ini. Pasti di suatu tempat ada ruangan yang dibarikade, dan tulang itu pasti ada di sana. Hati-hati, kutukan dalam abu itu berbahaya, _kembali padaku secepatnya setelah mendapatkan abu itu_ dan saya akan membersihkan kutukannya.
actors.mobs.npcs.wandmaker.intro_ember=Saya sedang mencari _bara api segar_ dari elemental api yang baru lahir. Elemental biasanya muncul ketika ritual pemanggilan tidak terkendali, jadi cari saja beberapa lilin dan tempat ritual dan saya yakin kamu bisa mendapatkannya untuk muncul. Kamu sebaiknya _menghindari tinju_ saat melawannya, atau kamu bisa _menyediakan semacam benda beku._ Elemental yang baru lahir cukup kuat dan kacau, tapi mereka tidak tahan dingin.
actors.mobs.npcs.wandmaker.intro_berry=Dulu, sipir penjara menyimpan _tanaman rotberry_ di sini, dan benihnya yang sedang kucari. Tanaman itu sepertinya sekarang sudah liar, jadi agak susah untuk dapat mengambil benihnya. Taman tanaman itu pasti ada di sekitar sini. Cobalah untuk _menjauh dari cambuk tanaman itu_ jika kamu ingin selamat. Menggunakan api mungkin menggoda, tetapi jangan, kamu akan mematikan tanaman dan menghancurkan benihnya.
actors.mobs.npcs.wandmaker.intro_2=\n\nJika kamu dapat membawa itu untukku, saya dengan senang hati akan memberimu imbalan berupa tongkat sihir berkualitas milikku! Saya membawa dua, kamu dapat memilih satu yang mana yang kamu mau.
actors.mobs.npcs.wandmaker.reminder_dust=Sudah menemukan debu mayatnya, %s? Carilah barikade.
actors.mobs.npcs.wandmaker.reminder_ember=Sudah menemukan bara api itu, %s? Kamu harus mencari empat lilin dan sebuah tempat ritual.
actors.mobs.npcs.wandmaker.reminder_berry=Sudah menemukan benih Rotberry-nya, %s? Carilah ruangan yang di dalamnya banyak tanaman.
actors.mobs.npcs.wandmaker.def_verb=ketahan
actors.mobs.npcs.wandmaker.desc=Kakek tua ini terlihat kebingungan. Dia terlindungi pelindung sihir.



###mobs
actors.mobs.acidic.name=kalajengking asam
actors.mobs.acidic.desc=Makhluk iblis besar mirip arakhnida ini menghindari pertempuran jarak dekat, lebih memilih menembakkan jarum bergerigi yang melumpuhkan dari jarak jauh. Yang ini tampaknya meneteskan cairan korosif.

actors.mobs.albino.name=tikus albino
actors.mobs.albino.desc=Ini adalah tikus marsupial langka, dengan bulu putih bersih dan gigi yang tajam.
actors.mobs.albino.discover_hint=Kamu jarang bisa menemukan musuh ini di wilayah tertentu di terungku.

actors.mobs.armoredstatue.name=patung berarmor
actors.mobs.armoredstatue.desc=Kamu mungkin berpikir bahwa itu hanya salah satu dari patung mati di terungku ini, tetapi matanya yang merah menyala menunjukkan hal itu.\n\nTampaknya kondisinya bagus karena armor yang dipakainya, mungkin sangat sulit untuk dibunuh.
actors.mobs.armoredstatue.desc_arm_wep=Sementara patung itu sendiri terbuat dari batu, _%1$s_ dan _%2$s_ yang dipegang olehnya terlihat nyata.

actors.mobs.bandit.name=bandit gila
actors.mobs.bandit.desc=Pencuri elit, yang dibedakan dengan jubah ungu mereka yang lebih mewah. Meskipun keterampilan mereka lebih hebat, mereka menjadi sama tidak berakalnya dengan pencuri biasa.\n\nSelain mencuri darimu, bandit gila akan membutakan, melumpuhkan, dan meracunimu sebentar! Namun, mereka cenderung membawa barang jarahan ekstra daripada pencuri biasa.

actors.mobs.bat.name=kelelawar vampir
actors.mobs.bat.desc=Penghuni gua yang gesit dan ulet itu lebih berbahaya daripada kelihatannya. Mereka dapat menyerap darah setiap kali berhasil menyerang, yang membuat mereka dapat mengalahkan musuh yang jauh lebih besar darinya.

actors.mobs.bee.name=lebah emas
actors.mobs.bee.desc_honey=Meskipun ukurannya kecil, lebah emas cenderung melindungi rumah mereka dengan ganas. Yang ini sudah dijinakkan, dan sepertinya ingin mengikutimu.
actors.mobs.bee.desc=Meskipun ukurannya kecil, lebah emas ini melindungi rumah mereka dengan ganas. Yang satu ini sangat marah, lebih baik kamu menjauh darinya.
actors.mobs.bee.discover_hint=Kamu bisa menemukan karakter ini dengan suatu item khusus.

actors.mobs.brute.name=gnoll brutal
actors.mobs.brute.enraged=mengamuk
actors.mobs.brute.def_verb=ketahan
actors.mobs.brute.desc=Gnoll brutal adalah jenis gnoll yang terbesar, terkuat, dan terkeras. Saat sekarat, mereka akan mengamuk, yang memberi mereka pelindung sementara dan penambahan yang besar pada damage.
actors.mobs.brute$bruterage.name=kemarahan brutal
actors.mobs.brute$bruterage.desc=Gnoll brutal ini sedang sekarat, tapi ingin kamu mati bersamanya!\n\nGnoll brutal in ini akan mati jika ketahanannya habis, baik karena waktu atau terkena damage. Selama itu, mereka akan memberikan damage yang sangat besar, jadi waspadalah!\n\nKetahanan tersisa: %d.

actors.mobs.causticslime.name=slime kaustik
actors.mobs.causticslime.desc=Slime ini sepertinya telah tercemar oleh sihir hitam yang terpancar dari bawah. Slime itu telah kehilangan warna hijau biasanya, dan menetes dengan cairan kaustik.
actors.mobs.causticslime.discover_hint=Kamu jarang bisa menemukan musuh ini di wilayah tertentu di terungku.

actors.mobs.crab.name=kepiting selokan
actors.mobs.crab.desc=Kepiting yang besar itu adalah puncak dari rantai makanan di dalam selokan ini. Mereka sangat cepat dan cangkang tebal mereka dapat menahan pukulan keras.

actors.mobs.crystalguardian.name=penjaga kristal
actors.mobs.crystalguardian.def_verb=ketahan
actors.mobs.crystalguardian.desc=Penjaga kristal besar ini hampir terlihat seperti patung, jika bukan karena matanya yang bersinar terang. Kristal yang mengeras dari bahan pembuatnya menyebabkan mereka menjadi lamban namun sangat keras, jadi _sebaiknya biarkan mereka tidur di sarang kristal selama mungkin._\n\nKarena ukurannya, penjaga kristal akan bergerak lebih lambat di ruang tertutup. Mereka juga sangat tahan lama sehingga tidak mungkin dibunuh secara langsung. Mereka dapat dikalahkan dan dilumpuhkan untuk sementara waktu, namun mereka akan bangkit kembali setelah beberapa saat.
actors.mobs.crystalguardian.discover_hint=Kamu dapat menemukan musuh ini dalam misi tertentu.

actors.mobs.crystalmimic.name=mimik kristal
actors.mobs.crystalmimic.ate=Mimik memakan %s milikmu!
actors.mobs.crystalmimic.escaped=Mimik kristal telah kabur!
actors.mobs.crystalmimic.desc=Mimik adalah makhluk ajaib yang dapat mengambil bentuk apa pun yang mereka inginkan. Di terungku, mereka hampir selalu memilih bentuk peti harta karun, untuk memikat para petualang yang tidak menaruh curiga.\n\nMimik kristal lebih penuh tipu daya daripada sepupu biasa mereka, dan lebih memilih menghindari konflik saat mencuri barang rampasan. Mereka akan berusaha untuk berlari cepat setelah ditemukan, dan memiliki kemampuan untuk mengubah posisi musuh ketika mereka menyerang.

actors.mobs.crystalspire.name=menara kristal
actors.mobs.crystalspire.warning=Kristal itu bergetar saat kamu memukulnya. Meneruskan hal ini pasti akan menarik perhatian kepadamu...
actors.mobs.crystalspire.alert=Getarannya tumbuh dan bergemuruh ke seluruh gua!
actors.mobs.crystalspire.desc=Menara raksasa dari kristal yang sangat keras ini mungkin adalah sumber dari semua makhluk kristal aneh di gua ini. Senjata biasa kamu tidak efektif melawannya, jadi kamu harus menggunakan beliung jika ingin menghancurkannya.\n\n_Pastikan kamu sudah siap sebelum mulai memecahkannya._ Kristal sebesar itu mungkin memerlukan waktu cukup lama untuk ditambang, dan kamu mungkin tidak akan bisa melakukannya tanpa gangguan. Menara itu sendiri bahkan mungkin mempunyai beberapa cara untuk mempertahankan diri juga. _Mungkin serangan menara itu sendiri dapat digunakan untuk melawan antek-anteknya._
actors.mobs.crystalspire.discover_hint=Kamu dapat menemukan musuh ini dalam misi tertentu.

actors.mobs.crystalwisp.name=gumpalan kristal
actors.mobs.crystalwisp.beam_kill=Sinar cahaya itu membunuhmu...
actors.mobs.crystalwisp.desc=Sebongkah kecil kristal mengeras yang mengambang dan menghasilkan cahaya terang. Meskipun tidak terlalu kuat, gumpalan kristal akan menembakkan sinar cahaya yang merusak ke arahmu jika tembakannya jelas.\n\nGumpalan kristal cukup kecil untuk dengan mudah bergerak melalui berbagai singkapan kristal, tetapi mereka tidak dapat menembak menembus itu.
actors.mobs.crystalwisp.discover_hint=Kamu dapat menemukan musuh ini dalam misi tertentu.

actors.mobs.demonspawner.name=pemuncul iblis
actors.mobs.demonspawner.on_death=Energi iblis di sini tampaknya berkurang saat pemuncul itu mati.
actors.mobs.demonspawner.desc=Campuran daging kurcaci yang mengerikan ini bertanggung jawab atas terciptanya iblis pencabik dari para kurcaci yang telah mati di wilayah ini. Jelas iblis tidak mempunyai masalah dengan penggunaan sumber daya apapun yang bisa melawan musuh mereka.\n\nMeskipun secara visual mengerikan, pemuncul iblis tidak bisa bergerak dan tidak punya pertahanan diri. Namun bentuk mereka yang besar dan padat membuat mereka sulit untuk dibunuh dengan cepat, dan mereka akan menciptakan iblis pencabik lebih cepat ketika mereka berada di bawah ancaman.\n\n_Pemuncul iblis tampaknya terhubung ke beberapa sumber pusat kekuatan iblis. Membunuh pemuncul iblis ini mungkin melemahkan kekuatan iblis itu._

actors.mobs.dm100.name=DM-100
actors.mobs.dm100.zap_kill=Sengatan listrik membunuhmu...
actors.mobs.dm100.desc=DM-100 adalah model awal 'mesin pertahanan' kurcaci yang dirancang untuk melindungi kurcaci penambang di gua-gua yang berada di bawah penjara ini. Kejutan listrik mereka terbukti terlalu lemah, jadi mereka diberikan ke kota manusia yang berada di atas gua . Mereka tidak digunakan selama bertahun-tahun dan akhirnya menemukan jalan mereka ke penjara, di mana sipir awalnya menganggap mereka terlalu kejam untuk digunakan. Namun, karena para tahanan menjadi lebih sulit diatur, mereka menjadi kebutuhan.

actors.mobs.dm200.name=DM-200
actors.mobs.dm200.vent=DM-200 menembakkan semburan gas beracun!
actors.mobs.dm200.desc=DM-200 adalah 'mesin pertahanan' kurcaci generasi kedua, yang dirancang untuk melindungi kurcaci penambang di gua-gua dan kota di bawahnya. Mereka jauh lebih besar dan lebih kokoh dari pendahulunya, dan menyerang dengan tinju hidrolik yang mematikan.\n\nUkuran mereka yang bertambah juga merupakan kelemahan utama mereka, karena mereka tidak dapat masuk ke dalam terowongan sempit dan pintu masuk terungku. Para kurcaci mampu mengimbangi kurangnya mobilitas DM-200 dengan membiarkan mereka melepaskan asap pembuangan beracun mereka ke musuh yang jauh, atau musuh yang tidak dapat mereka jangkau.

actors.mobs.dm201.name=DM-201
actors.mobs.dm201.vent=DM-201 melempar granat korosif!
actors.mobs.dm201.desc=Para kurcaci secara singkat bereksperimen dengan lebih menekankan kurangnya mobilitas DM-200 dan menciptakan beberapa model DM yang seluruhnya tidak bergerak. DM-201 adalah DM-200 yang dipasang sebagai kubah penjaga yang tidak memiliki kemampuan bergerak. Sebagai imbalan atas kurangnya mobilitas, DM-201 memiliki daya tahan dan kekuatan serangan yang jauh lebih besar.\n\nKarena DM-201 tidak memiliki mesin untuk menembakkan gas, sebagai gantinya para kurcaci melengkapinya dengan granat gas korosif! Namun DM-201 berhati-hati dengan granat ini, dan hanya akan melontarkannya saat diserang dari jarak jauh.

actors.mobs.dm300.name=DM-300
actors.mobs.dm300.notice=PERSONIL TAK DIKENAL TERDETEKSI!
actors.mobs.dm300.shield=DM-300 menyerap energi dari kabel yang terbuka dan melindungi dirinya sendiri!
actors.mobs.dm300.charging=MENAHAN KERUSAKAN! MENGAKTIFKAN TIANG LISTRIK!
actors.mobs.dm300.charging_hint=DM-300 kebal saat diberi energi oleh tiang!
actors.mobs.dm300.supercharged=HANCURKAN! HANCURKAN! HANCURKAN!
actors.mobs.dm300.charge_lost=TIANG DIHANCURKAN! KEMBALI KE KEKUATAN LOKAL!
actors.mobs.dm300.pylons_destroyed=WASPADA! KETIDAKSTABILAN TERDETEKSI DI JARINGAN KEKUATAN!
actors.mobs.dm300.rankings_desc=Dihancurkan oleh DM-300
actors.mobs.dm300.def_verb=ketahan
actors.mobs.dm300.defeated=KERUSAKAN PARAH! MENCOBA MEMATIK-
actors.mobs.dm300.desc=DM-300 adalah 'mesin pertahanan' terbesar dan terkuat yang pernah dibuat para kurcaci. Mesin yang begitu mengagumkan sulit untuk dibuat, jadi para kurcaci hanya membuat sedikit untuk menjaga pintu masuk ke kota metropolis bawah tanah mereka.\n\nIa dilengkapi dengan ventilasi untuk memancarkan asap beracun dan bor berdaya tinggi yang dapat digunakan untuk menyerang dan menghancurkan tanah. DM-300 juga dapat terhubung ke jaringan energi, yang selanjutnya meningkatkan kekuatannya.
actors.mobs.dm300.desc_supercharged=DM-300 saat ini diisi penuh dengan energi listrik. Dalam wujud ini DM-300 tidak dapat rusak dan bergerak dengan kecepatan ganda! Selain itu, bornya sekarang berputar cukup cepat untuk dapat _menerobos melalui batuan padat,_ meskipun jadi bergerak jauh lebih lambat saat melakukannya.\n\nMenyerang DM-300 secara langsung tidak berguna saat sedang dalam keadaan 'serangan super' ini, tetapi _sesuatu di area ini pasti ada yang memberikannya energi,_ menghancurkan itu mungkin dapat melemahkannya.

actors.mobs.dwarfking.name=Raja Kurcaci
actors.mobs.dwarfking.notice=Beraninya kau! Kau tidak tahu sedang berhadapan dengan siapa!
actors.mobs.dwarfking.lifelink_1=Aku membutuhkan jiwamu, budak-budak!
actors.mobs.dwarfking.lifelink_2=Berdarah untukku, budakku!
actors.mobs.dwarfking.teleport_1=Atasi dia, budakku!
actors.mobs.dwarfking.teleport_2=Buat dia sibuk, budakku!
actors.mobs.dwarfking.wave_1=Cukup! Bangunlah budakku!
actors.mobs.dwarfking.wave_2=Lagi! Berdarah untuk rajamu!
actors.mobs.dwarfking.wave_3=Tidak berguna! BUNUH DIA SEKARANG JUGA!
actors.mobs.dwarfking.enraged=Kau tidak bisa membunuhku %s. AKU. ABADI!
actors.mobs.dwarfking.losing=Tidak! Kau tidak bisa melakukannya... kau tidak tahu apa yang menunggumu di bawah sana...
actors.mobs.dwarfking.defeated=Kau telah... Menghancurkan kita semua...
actors.mobs.dwarfking.rankings_desc=Jatuh Dihadapan Raja Kurcaci
actors.mobs.dwarfking.desc=Bertahun-tahun yang lalu salah satu penyihir tertinggi di istana kurcaci mengungkap rahasia yang memberinya kekuatan luar biasa atas hidup dan mati. Dia segera menggunakan kekuatan ini, menundukkan dan merusak rekan-rekannya, rajanya, dan akhirnya setiap warga negeri kurcaci. Sekarang dia adalah raja, penguasa atas pasukan mayat hidup.\n\nRaja Kurcaci adalah musuh yang agresif, yang akan mencoba untuk mengelilingi dan membanjiri musuh-musuhnya dengan gerombolan antek mayat hidup.
actors.mobs.dwarfking$dkghoul.rankings_desc=Jatuh Dihadapan Raja Kurcaci
actors.mobs.dwarfking$dkmonk.rankings_desc=Jatuh Dihadapan Raja Kurcaci
actors.mobs.dwarfking$dkwarlock.rankings_desc=Jatuh Dihadapan Raja Kurcaci
actors.mobs.dwarfking$dkgolem.rankings_desc=Jatuh Dihadapan Raja Kurcaci

actors.mobs.ebonymimic.name=mimik kayu hitam
actors.mobs.ebonymimic.reveal=Ada mimic di sana!
actors.mobs.ebonymimic.hidden_name=garis besar yang mencurigakan
actors.mobs.ebonymimic.hidden_desc=Sepertinya ada sesuatu di sini, tapi hampir seluruhnya transparan.
actors.mobs.ebonymimic.desc=Mimik adalah makhluk ajaib yang dapat mengambil bentuk apa pun yang mereka inginkan. Di terungku, mereka hampir selalu memilih bentuk peti harta karun, untuk memikat petualang yang tidak menaruh curiga.\n\nMimik kayu hitam adalah peniru yang tersembunyi dengan kemampuan membuat dirinya hampir tidak terlihat. Mereka mengintai hal-hal yang kemungkinan besar akan berinteraksi dengan para petualang, tetapi juga berisi jarahannya sendiri. Mereka tidak lebih tangguh daripada mimik biasa setelah ditemukan, tetapi gigitan mendadak mereka sangat menghancurkan.
actors.mobs.ebonymimic.discover_hint=Kamu dapat menemukan musuh ini dengan perhiasan tertentu.

actors.mobs.elemental$fireelemental.name=elemental api
actors.mobs.elemental$fireelemental.desc=Elemental adalah makhluk kacau yang seringkali tercipta saat sihir magis yang kuat tidak dikontrol dengan benar. Elemental memiliki kecerdasan minimal, dan biasanya dikaitkan dengan jenis sihir tertentu.\n\nElemen api adalah jenis elemen umum yang memberikan damage dengan sihir api. Mereka akan membakar target mereka dengan serangan jarak dekat, dan terkadang dapat menembakkan api dari jauh juga.
actors.mobs.elemental$newbornfireelemental.name=elemental api baru
actors.mobs.elemental$newbornfireelemental.charging=Elemental sedang mengisi daya!
actors.mobs.elemental$newbornfireelemental.desc=Elemental adalah makhluk kacau yang sering tercipta ketika sihir magis yang kuat tidak dikontrol dengan baik. Elemental memiliki kecerdasan minimal, dan biasanya dikaitkan dengan jenis sihir tertentu.\n\nElemental api ini baru dipanggil, tapi masih cukup berbahaya!
actors.mobs.elemental$newbornfireelemental.desc_boss=Karena sifat pemanggilannya yang kacau, elemental ini hanya dapat menyebarkan api dalam ledakan yang tidak akurat setelah melakukan serangan dalam satu giliran.
actors.mobs.elemental$newbornfireelemental.desc_ally=Karena elemental ini dipanggil dengan mantra, ia memiliki kontrol lebih besar terhadap apinya. Ia tidak mampu melakukan serangan jarak jauh, namun akan menyulut musuh yang diserangnya dalam jarak dekat.
actors.mobs.elemental$newbornfireelemental.discover_hint=Kamu dapat menemukan musuh ini dalam misi tertentu.
actors.mobs.elemental$frostelemental.name=elemental beku
actors.mobs.elemental$frostelemental.desc=Elemental adalah makhluk kacau yang seringkali tercipta saat sihir magis yang kuat tidak dikontrol dengan benar. Elemental memiliki kecerdasan minimal, dan biasanya dikaitkan dengan jenis sihir tertentu.\n\nElemental beku adalah jenis elemental umum yang melemahkan musuh dengan sihir dingin. Mereka akan membekukan target mereka dengan serangan jarak dekat dan jarak jauh. Sihir mereka jauh lebih efektif di atas air.
actors.mobs.elemental$shockelemental.name=elemental kejutan
actors.mobs.elemental$shockelemental.desc=Elemental adalah makhluk kacau yang seringkali tercipta saat sihir magis yang kuat tidak dikontrol dengan benar. Elemental memiliki kecerdasan minimal, dan biasanya dikaitkan dengan jenis sihir tertentu.\n\nElemental pengejut adalah jenis elemental kurang umum yang mengganggu musuhnya dengan listrik dan kilatan cahaya. Dalam jarak dekat mereka akan mengalirkan listrik ke musuh terdekat, dan memberikan bonus damage pada target utama jika mereka berada di atas air. Mereka juga kadang-kadang akan memfokuskan ledakan cahaya jarak jauh pada target mereka, yang membutakan untuk sementara.
actors.mobs.elemental$chaoselemental.name=elemental kekacauan
actors.mobs.elemental$chaoselemental.desc=Elemental adalah makhluk kacau yang seringkali tercipta saat sihir magis yang kuat tidak dikontrol dengan benar. Elemental memiliki kecerdasan minimal, dan biasanya dikaitkan dengan jenis sihir tertentu.\n\nElemental kekacauan adalah elemental langka dan berbahaya yang belum distabilkan ke elemen tertentu. Mereka akan melepaskan sihir liar yang tidak dapat diprediksi saat menyerang.

actors.mobs.eye.name=mata jahat
actors.mobs.eye.deathgaze_kill=tatapan kematian membunuhmu...
actors.mobs.eye.desc=Mata Jahat adalah bola melayang yang dipenuhi oleh energi iblis. Kekuatan jarak dekatnya tidak seberapa, kekuatan sebenarnya mereka adalah kekuatan sihirnya.\n\nSetelah mengumpulkan energi sejenak, Mata Jahat akan menembakkan sinar mematikan yang dinamakan _tatapan kematian._ Apa pun yang ada dalam jarak pandangnya akan menerima serangan yang hebat, petualang yang bijak akan mencari tempat untuk bersembunyi.

actors.mobs.fetidrat.name=tikus busuk
actors.mobs.fetidrat.desc=Ada hal yang salah pada tikus itu. Rambutnya yang hitam berminyak dan kulitnya yang busuk berbeda dengan tikus-tikus sehat lain yang kamu lihat sebelumnya. Matanya yang hijau pucat membuatnya terlihat mencekam.\n\nTikus itu mengeluarkan gas yang sangat berbahaya dalam jarak dekat.\n\nCairan gelap menetes dari mulutnya, cairan itu melelehkan lantai tapi nampaknya larut dalam air.
actors.mobs.fetidrat.discover_hint=Kamu dapat menemukan musuh ini dalam misi tertentu.

actors.mobs.fungalcore.name=inti jamur
actors.mobs.fungalcore.desc=Jamur raksasa ini pasti menjadi sumber dari segala aktivitas jamur di gua ini.

actors.mobs.fungalsentry.name=penjaga jamur
actors.mobs.fungalsentry.desc=Jamur yang sangat tinggi ini berfungsi sebagai titik pertahanan bagi jaringan jamur yang lebih besar yang hidup di gua ini. \n\nIa tidak dapat bergerak, namun akan menembakkan racun secara tepat pada apa pun yang berada dalam garis pandangnya.  Meskipun dampak ledakan ini cukup lemah, _ledakan dapat menumpuk racun dalam jumlah yang mematikan dengan sangat cepat._ Meskipun dapat dibunuh, sebaiknya dihindari.

actors.mobs.fungalspinner.name=pemintal jamur
actors.mobs.fungalspinner.desc=Laba-laba gua ini tampaknya sedang dikendalikan oleh sebuah jamur parasit. Fungi tersebut juga sepertinya mengubah kemampuannya, menggantikan jaring-jaring dan kantung racunnya menjadi pertumbuhan jamur.\n\nLaba-laba jamur akan meludahi tanaman ke arahmu alih-alih dari jaringannya, menyebarkan vegetasi jamur yang kemungkinan membuat anda tertanam. Walaupun tidak beracun, Laba-laba jamur akan mendapatkan pertahanan damage yang substansial jika bersebelahan dengan jamur apapun.

actors.mobs.ghoul.name=hantu kurcaci
actors.mobs.ghoul.desc=Ketika masyarakat kurcaci perlahan-lahan mulai runtuh, dan raja para kurcaci saat ini merebut kekuasaan mutlak, mereka yang lemah atau yang menentangnya tidak diperlakukan dengan baik. Ketika raja semakin mahir menggunakan ilmu hitam, dia membujuk para kurcaci ini sesuai keinginannya, dan sekarang mereka menjadi prajurit di pasukannya.\n\nHantu kurcaci tidak terlalu kuat jika sendirian, tetapi selalu bepergian dalam kelompok dan lebih sulit dibunuh dalam jumlah besar. _Ketika hantu kurcaci dikalahkan, ia akan bangkit kembali setelah beberapa giliran selama hantu kurcaci lain berada di dekatnya._

actors.mobs.gnoll.name=gnoll pengintai
actors.mobs.gnoll.desc=Gnoll adalah humanoid mirip hyena. Mereka berkelana di selokan dan terungku, berkelana untuk menyerang permukaan dari waktu ke waktu. Para gnoll pengintai adalah ras biasa dari gnoll, mereka tidak sekual gnoll brutal dan tidak sepintar dukun gnoll.

actors.mobs.gnollexile.name=gnoll pengasingan
actors.mobs.gnollexile.desc=Gnoll berbulu abu-abu ini memiliki tanda besar di bahunya, yang menandakannya sebagai orang buangan. Gnoll biasanya diasingkan dari masyarakat karena mengabaikan perintah atau melanggar hukum. Orang buangan harus kuat dan cerdik untuk bertahan hidup, yang satu ini sepertinya tahu cara menggunakan tombak yang dipegangnya.
actors.mobs.gnollexile.desc_passive=_Gnoll pengasingan itu tidak bergerak untuk menyerang._ Ia tidak tampak seagresif gnoll lain di sini, dan mungkin tidak menganggap bahwa melawanmu adalah hal yang sepadan. Kamu bisa membiarkannya lewat begitu saja, tetapi ia memiliki ransel yang mungkin penuh dengan barang-barang yang berguna...
actors.mobs.gnollexile.desc_aggro=_Gnoll pengasingan itu melihat sekeliling dengan marah._ Sepertinya ada sesuatu yang membuatnya memutuskan untuk bertarung. Hati-hati dengan tombak itu!
actors.mobs.gnollexile.seen_passive=Gnoll yang memegang tombak menatapmu dengan waspada, tetapi tidak bergerak untuk menyerang.
actors.mobs.gnollexile.seen_aggro=Gnoll yang memegang tombak bergerak untuk menyerang.

actors.mobs.gnollgeomancer.name=gnoll geomancer
actors.mobs.gnollgeomancer.warning=Sang geomancer mulai bergerak. Pastikan kamu siap sebelum melanjutkan!
actors.mobs.gnollgeomancer.alert=Sang geomancer terbangun! Seluruh gua tampak bergeser saat ia melompat sambil tertawa terbahak-bahak!
actors.mobs.gnollgeomancer.rock_kill=Batu terbang itu membunuhmu...
actors.mobs.gnollgeomancer.rockfall_kill=Batu longsor itu membunuhmu...
actors.mobs.gnollgeomancer.desc=Gnoll senior yang sangat tinggi ini pastilah sumber dari berbagai sihir penggerak bumi di sekitar sini, dan penyelenggara semua aktivitas gnoll. Berbeda dengan gnoll pencari ranjau di area tersebut, geomancer cukup mahir dengan sihirnya, dan tidak dapat terkena damage dari batu yang dilempar atau jatuh. Namun ia tidak memiliki cara untuk bertarung dalam pertarungan jarak dekat.
actors.mobs.gnollgeomancer.desc_armor=Geomancer tersebut saat ini terbungkus dalam lapisan armor batu. _Kamu harus mendekat dan menghancurkannya dengan beliungmu sebelum kamu bisa melukai geomancer tersebut._
actors.mobs.gnollgeomancer.desc_armor_sapper=_Gnoll pencari ranjau di dekatnya memegang perangkat yang memperkuat pelindung batu geomancer. Kamu tidak akan bisa memberi damage sama sekali sekarang!_
actors.mobs.gnollgeomancer.desc_sleeping=Dukun gnoll yang sangat tinggi ini dikelilingi oleh lapisan batu, dan terlihat hampir seperti patung. Melihat lebih dekat, kamu dapat melihat batu itu secara ajaib bergerak seiring dengan pernapasan gnoll senior. Ia tidak dapat dilukai ketika terbungkus dalam batu seperti ini, dan tampaknya ia benar-benar menikmati tidur siang yang kotor.\n\nKamu mungkin bisa menembus lapisan batu dengan beliungmu, tapi _pastikan Anda siap bertarung saat melakukannya._ Geomancer pasti menjadi sumber dari berbagai sihir penggerak bumi di sekitar sini, dan pengatur semua aktivitas gnoll.  _Kalahkan gnoll yang tersebar di sekitar sini sebelum bertarung mungkin merupakan ide yang bagus._
actors.mobs.gnollgeomancer.discover_hint=Kamu dapat menemukan musuh ini dalam misi tertentu.

actors.mobs.gnollguard.name=gnoll penjaga
actors.mobs.gnollguard.def_verb=ketahan
actors.mobs.gnollguard.spear_warn=Gnoll itu mendaratkan serangan ganas dengan ujung tombaknya!
actors.mobs.gnollguard.desc=Gnoll yang besar dan tampak tangguh memegang tombak dan perisai, namun tanpa helm. Para penjaga ini kemungkinan besar adalah gnoll brutal yang sedang menjalani pelatihan, terikat untuk membantu melindungi tambang dari perambahan satwa liar.\n\nGnoll penjaga cukup kuat untuk memegang tombak dengan satu tangan, tetapi tidak dapat menggunakannya dengan baik. Ia membutuhkan ruang yang cukup terbuka untuk menyerang dari jarak jauh, dan damage itu akan lebih kecil jika kamu mendekat.
actors.mobs.gnollguard.desc_armor=_Gnoll pencari ranjau di dekatnya memegang perangkat yang memberikan pelindung tanah pada penjaga ini, sangat mengurangi damage yang ditimbulkannya._
actors.mobs.gnollguard.discover_hint=Kamu dapat menemukan musuh ini dalam misi tertentu.

actors.mobs.gnollsapper.name=gnoll pencari ranjau
actors.mobs.gnollsapper.desc=Gnoll kecil dan lemah namun cerdas dengan bulu pucat dan tas penuh berbagai perangkat. Mereka kemungkinan besar berada di sini untuk membantu pencarian dan penambangan emas gelap, dan memiliki penjaga terdekat untuk perlindungan. Mereka mampu bertarung, tapi serangan mereka sangat lemah, tidak lebih kuat dari gnoll pengintai.\n\nDaripada bertarung secara langsung, gnoll pencari ranjau lebih memilih menggunakan berbagai perangkat yang mereka miliki untuk membuat lingkungan berbatu menyerang mereka. Namun, mereka sendiri tidak mengetahui sihir penggerak bumi, sehingga kemungkinan besar mereka menggunakan perangkat mereka sembarangan. _Seharusnya ada banyak cara untuk menggunakan serangan mereka terhadap mereka, atau penjagaan mereka._
actors.mobs.gnollsapper.discover_hint=Kamu dapat menemukan musuh ini dalam misi tertentu.

actors.mobs.gnolltrickster.name=gnoll penipu
actors.mobs.gnolltrickster.desc=Makhluk yang tampak aneh, bahkan menurut standar gnoll. Ia membungkuk ke depan sambil menyeringai jahat, hampir menggendong tas yang tergantung di bahunya. Matanya melebar dengan campuran ketakutan dan kegembiraan yang aneh.\n\nAda banyak koleksi anak panah yang dibuat dengan buruk di tasnya, semuanya sepertinya mengandung berbagai zat berbahaya.
actors.mobs.gnolltrickster.discover_hint=Kamu dapat menemukan musuh ini dalam misi tertentu.

actors.mobs.goldenmimic.name=mimik emas
actors.mobs.goldenmimic.desc=Mimik adalah makhluk ajaib yang dapat mengambil bentuk apa pun yang mereka inginkan. Di terungku, mereka hampir selalu memilih bentuk peti harta karun, untuk memikat para petualang yang tidak menaruh curiga.\n\nMimik emas adalah jenis mimik yang kuat yang mencoba memikat para petualang yang kuat. Mereka memiliki jarahan yang bagus, tetapi mereka juga lebih kuat daripada mimik biasa.

actors.mobs.golem.name=golem
actors.mobs.golem.def_verb=ketahan
actors.mobs.golem.desc=Golem adalah kelinci percobaan dari penggunaan sihir baru para kurcaci, bertujuan memperbaiki kekurangan pada mesin-mesin yang mereka pakai sebelumnya. Golem jauh lebih padat dan efisien dibandingkan DM-300, yang sebetulnya masih mematikan juga.\n\nGolem-golem ini terlalu besar untuk melewati lorong dan pintu, namun para kurcaci memberikan kekuatan sihir untuk mengimbanginya. Golem dapat berpindah antar ruang, dan dapat memanggil musuh ke hadapannya saat mereka di luar jangkauan.

actors.mobs.goo.name=Goo
actors.mobs.goo.notice=GLUBUK-GLUBUK!
actors.mobs.goo.defeated=glubuk... glubuk...
actors.mobs.goo.!!!=!!!
actors.mobs.goo.pumpup=Goo memompa dirinya sendiri!
actors.mobs.goo.enraged=mengamuk
actors.mobs.goo.gluuurp=GLUBUUUK!!!
actors.mobs.goo.rankings_desc=Terserap oleh Goo
actors.mobs.goo.desc=Sedikit yang diketahui tentang Goo. Kemungkinan itu bukanlah hanya sekedar makhluk, tapi itu adalah kumpulan zat berbahaya dari selokan yang entah bagaimana memperoleh kecerdasan dasar. Bagaimana pun juga, keberadaan Goo ini pasti ulah sihir gelap.\n\nBentuknya yang gel itu membuatnya dapat menyerap banyak sihir gelap, kamu langsung merinding jika berada di dekatnya. Jika Goo menyerang dengan energi itu, kamu tidak akan hidup lebih lama lagi.

actors.mobs.greatcrab.name=kepiting raksasa
actors.mobs.greatcrab.noticed=Kepiting itu menahan serangan dengan cakar besarnya.
actors.mobs.greatcrab.def_verb=ketahan
actors.mobs.greatcrab.desc=Kepiting ini sangat besar dibandingkan dengan kepiting selokan yang lain. Cangkangnya yang berwarna biru itu dipenuhi dengan retakan-retakan, menunjukkan usianya yang sudah tua. Kepiting itu berjalan dengan lambat, berusaha menyeimbangi cakar raksasanya.\n\nWalaupun kepiting itu memiliki satu cakar, itu sudah lebih dari cukup. Kepiting itu menempatkan cakarnya di hadapannya, melindungi dirinya dengan tempurung yang tidak dapat ditembus. Namun demikian, kepiting itu tidak dapat menghindari serangan tiba-tiba, atau serangan keroyokan.
actors.mobs.greatcrab.discover_hint=Kamu dapat menemukan musuh ini dalam misi tertentu.

actors.mobs.guard.name=penjaga penjara
actors.mobs.guard.scorpion=Kemari kau!
actors.mobs.guard.def_verb=ketahan
actors.mobs.guard.desc=Dulunya penjaga penjara normal, namun lama-lama mereka tak ada bedanya dengan makhluk mengerikan lain. Mereka berjalan seperti zombie, berjalan melewati lorong-lorong untuk mencari sesuatu yang tidak pada tempatnya, seperti dirimu!\n\nMereka membawa rantai di sekeliling tubuhnya, mungkin untuk menarik musuh dalam jarak dekat.

actors.mobs.hermitcrab.name=kelomang
actors.mobs.hermitcrab.def_verb=ketahan
actors.mobs.hermitcrab.desc=Karena satu atau alasan lain, kepiting selokan ini memutuskan untuk memakai bagian atas tong yang rusak di kepalanya! Berat tambahan itu memperlambatnya ke kecepatan normal, tetapi juga memberinya pertahanan yang jauh lebih baik. Kamu mungkin mendengar sesuatu memantul di dalam tong itu...

actors.mobs.mimic.name=mimik
actors.mobs.mimic.reveal=Harta karun itu adalah mimik!
actors.mobs.mimic.hidden_hint=Harta karun itu tampak aneh... Mendekati dan mencoba membukanya mungkin ide yang buruk.
actors.mobs.mimic.desc=Mimik adalah makhluk ajaib yang dapat mengambil bentuk apa pun yang mereka inginkan. Di terungku, mereka hampir selalu memilih bentuk peti harta karun, untuk memikat para petualang yang tidak menaruh curiga.\n\nMimik memiliki gigitan yang tidak enak, tetapi sering kali menyimpan lebih banyak harta daripada peti biasa.
actors.mobs.mimic.discover_hint=Kamu bisa menemukan musuh ini dimanapun di terungku.

actors.mobs.necromancer.name=necromancer
actors.mobs.necromancer.desc=Para penyihir gelap ini telah berbondong-bondong ke penjara, karena itu adalah tempat yang tepat untuk melatih keahlian jahat mereka.\n\nNecromancer akan memanggil dan memberdayakan tengkorak untuk bertarung demi mereka. Membunuh necromancer juga akan membunuh tengkorak yang dipanggilnya.
actors.mobs.necromancer$necroskeleton.name=tengkorak necromancer
actors.mobs.necromancer$necroskeleton.desc=Tengkorak ini dipanggil oleh necromancer. Mereka bertingkah seperti tengkorak biasa, dan akan mati ketika necromancer yang memanggilnya dibunuh.

actors.mobs.mob.died=Kamu mendengar sesuatu mati di kejauhan.
actors.mobs.mob.rage=#$%^
actors.mobs.mob.rankings_desc=Dibunuh oleh: %s
actors.mobs.mob.discover_hint=Kamu bisa menemukan musuh ini di wilayah tertentu di terungku.

actors.mobs.monk.name=biksu kurcaci
actors.mobs.monk.def_verb=ketahan
actors.mobs.monk.parried=tertangkis
actors.mobs.monk.desc=Para biksu ini adalah orang-orang fanatik, yang mengabdikan diri mereka untuk melindungi raja mereka melalui kekuatan fisik. Begitu besarnya pengabdian mereka sehingga mereka menyerahkan pikiran mereka sepenuhnya kepada raja mereka, dan sekarang berkeliaran di kota kurcaci seperti zombie yang tidak punya pikiran.\n\nPara biksu hanya mengandalkan seni pertarungan tangan kosong, dan mampu menggunakan tinju tak bersenjata mereka untuk menyerang dan bertahan. Ketika mereka menjadi terfokus, para biksu akan menangkis serangan fisik berikutnya yang digunakan terhadap mereka, bahkan jika serangan tersebut dijamin akan mengenai mereka. Para biksu membangun fokus lebih cepat saat bergerak, dan lebih lambat saat bertarung langsung.
actors.mobs.monk$focus.name=terfokus
actors.mobs.monk$focus.desc=Biksu ini tidak mengalihkan perhatiannya dari target mereka, dan tampaknya mengantisipasi gerakan mereka sebelum mereka melakukannya.\n\nSaat terfokus, serangan fisik berikutnya yang diberikan ke mereka dijamin akan meleset, apa pun situasinya. Menangkis serangan ini akan menghabiskan fokus biarawan, dan mereka perlu membangunnya lagi untuk bisa menangkis serangan yang lain. Biksu membangun fokus lebih cepat saat mereka bergerak.

actors.mobs.phantompiranha.name=piranha hantu
actors.mobs.phantompiranha.teleport_away=Piranha hantu itu berteleportasi...
actors.mobs.phantompiranha.desc=Piranha hantu adalah jenis piranha langka dengan kemampuan magis dan tubuh tembus pandang yang menakutkan. Mereka mampu berteleportasi saat diserang, baik untuk melarikan diri atau mendekati musuh dengan cepat! \n\nMeskipun mereka menjengkelkan untuk dilawan, daging mereka dihargai karena sifat magisnya.

actors.mobs.piranha.name=piranha raksasa
actors.mobs.piranha.desc=Ikan karnivora ini dibiakkan khusus untuk melindungi daerah banjir. Gigitannya sangat mematikan, jadi sebaiknya hindari berhadapan langsung dengan mereka.
actors.mobs.piranha.discover_hint=Kamu bisa menemukan musuh ini dimanapun di terungku.

actors.mobs.pylon.name=tiang listrik
actors.mobs.pylon.desc_inactive=Tiang listrik, dimaksudkan untuk membantu mengatur listrik yang menggerakkan mesin di area ini.\n\nTiang tersebut saat ini tidak aktif dan kebal terhadap kerusakan.
actors.mobs.pylon.desc_active=Tiang listrik, dimaksudkan untuk membantu mengatur listrik yang menggerakkan mesin di area ini. Tiang itu sedang melonjak dengan energi listrik, ini pasti yang mengisi daya super DM-300!\n\nDalam keadaan ini tiang sangat rentan, tetapi akan mengalirkan listrik ke sel-sel terdekat dengan pola searah jarum jam. Karena konstruksi logam beratnya, tiang tahan terhadap kerusakan dalam jumlah besar.

actors.mobs.rat.name=tikus marsupial
actors.mobs.rat.desc=Tikus marsupial sangat agresif namun merupakan penghuni selokan terlemah. Mereka menggigit, dan hanya berbahaya jika dalam jumlah yang banyak.

actors.mobs.ripperdemon.name=iblis pencabik
actors.mobs.ripperdemon.leap=Iblis pencabik bersiap untuk melompat!
actors.mobs.ripperdemon.desc=Makhluk mengerikan ini adalah hasil dari banyaknya mayat kurcaci di wilayah ini yang digunakan oleh kekuatan iblis. Pencabik adalah makhluk kurus kering yang menyerupai kurcaci, tetapi dengan tubuh rusak dan cakar tajam panjang yang terbuat dari tulang.\n\nPertahanan iblis pencabik tidak terlalu kuat, tetapi mereka gesit dan berbahaya. Mereka mampu melompat jauh untuk mencapai target dengan cepat sebelum mencabik-cabiknya dengan cakar mereka.

actors.mobs.rotheart.name=jantung rot
actors.mobs.rotheart.desc=Buah rotberry sangat unik. Bukannya membusuk dan memberi nutrisi, buah ini tumbuh, mengeras, dan menyelimuti benihnya. Buah itu melindungi organ dalam yang tumbuh di dalamnya. Bola yang besar ini sepertinya bagian dari jantung tanaman rotberry dewasa.
actors.mobs.rotheart.discover_hint=Kamu dapat menemukan musuh ini dalam misi tertentu.

actors.mobs.rotlasher.name=cambuk rot
actors.mobs.rotlasher.desc=Cambuk rot adalah bagian dari akar tumbuhan rotberry yang sudah dewasa, yang juga berperan sebagai pertahanan utamanya. Cambuk-cambuk tersebut merekat pada tanah, tapi siap menyerang segala bentuk ancaman yang mendekati mereka. Saat tidak ada musuh di sekitar mereka, mereka akan diam tak bergerak, berusaha menyatu dengan tumbuhan lain di sekitar mereka.
actors.mobs.rotlasher.discover_hint=Kamu dapat menemukan musuh ini dalam misi tertentu.

actors.mobs.scorpio.name=kalajengking
actors.mobs.scorpio.desc=Makhluk iblis besar mirip arakhnida ini menghindari pertempuran jarak dekat, lebih memilih menembakkan jarum bergerigi yang melumpuhkan dari jarak jauh.

actors.mobs.senior.name=biksu senior
actors.mobs.senior.desc=Para biksu ini adalah orang-orang fanatik, yang mengabdikan diri mereka untuk melindungi raja mereka melalui kekuatan fisik. Begitu besarnya pengabdian mereka sehingga mereka menyerahkan pikiran mereka sepenuhnya kepada raja mereka, dan sekarang berkeliaran di kota kurcaci seperti zombie yang tidak punya pikiran. \n\nBiksu ini telah menguasai seni pertarungan tangan kosong, dan mampu memperoleh fokus saat bergerak jauh lebih cepat dibandingkan biksu biasa. Ketika mereka menjadi terfokus, para biksu akan menangkis serangan fisik berikutnya yang digunakan terhadap mereka, bahkan jika serangan tersebut dijamin akan mengenai mereka. Para biksu membangun fokus lebih cepat saat bergerak, dan lebih lambat saat bertarung langsung.

actors.mobs.shaman.name=dukun gnoll
actors.mobs.shaman.bolt_kill=Listrik ajaib membunuhmu...
actors.mobs.shaman.desc=Dukun gnoll adalah gnoll cerdas yang memakai mantra sihir untuk mengimbangi kurangnya kekuatan fisik mereka. Mereka memiliki reputasi yang baik dalam tatanan masyarakat gnoll, walaupun mereka lemah.
actors.mobs.shaman$redshaman.spell_desc=Dukun ini memakai topeng merah, dan akan menggunakan sihir yang sementara _ melemahkan kekuatan seranganmu._
actors.mobs.shaman$blueshaman.spell_desc=Dukun ini memakai topeng biru, dan akan menggunakan sihir yang sementara _meningkatkan damage yang kamu terima._
actors.mobs.shaman$purpleshaman.spell_desc=Dukun ini memakai topeng ungu, dan akan menggunakan sihir yang sementara _mengurangi akurasi dan penghindaranmu._

actors.mobs.armoredbrute.name=gnoll brutal berarmor
actors.mobs.armoredbrute.desc=Gnoll brutal paling senior sering memakai armor yang kuat untuk menunjukkan status mereka. Armor ini membuat gnoll brutal ini jauh lebih tahan terhadap damage fisik, dan disiplin mereka yang lebih besar berarti mereka bisa mengamuk lebih lama sebelum mati karena luka mereka.

actors.mobs.skeleton.name=kerangka
actors.mobs.skeleton.explo_kill=Kamu terbunuh oleh ledakan kerangka...
actors.mobs.skeleton.def_verb=ketahan
actors.mobs.skeleton.desc=Kerangka terdiri dari tulang belulang petualang dan penghuni penjara yang tidak beruntung, dihidupkan oleh pancaran sihir jahat dari kedalaman bawah. Setelah cukup damage, kerangka akan hancur dalam ledakan tulang. Pecahan dari ledakan ini berbahaya bagi apa pun di dekatnya, tetapi armor sangat efektif untuk menguranginya.

actors.mobs.slime.name=slime
actors.mobs.slime.def_verb=ketahan
actors.mobs.slime.desc=Slime adalah makhluk aneh, sedikit ajaib dengan tubuh luar yang kenyal dan inti yang cair. Selokan kota memberi mereka persediaan air dan nutrisi yang cukup.\n\nKarena membran luarnya yang elastis, sulit untuk memberikan lebih dari _6 damage_ pada slime dari satu serangan.

actors.mobs.snake.name=ular selokan
actors.mobs.snake.hint=Coba gunakan tombol periksa pada ular tersebut untuk mempelajari bagaimana cara menghadapinya.
actors.mobs.snake.desc=Ular besar ini mampu dengan cepat meliuk-liuk untuk menghindari pukulan, membuatnya cukup sulit untuk diserang. Walau begitu, serangan sihir atau serangan mendadak mampu membuat mereka lengah.\n\nKamu dapat melakukan serangan mendadak dengan menyerang saat berada di luar penglihatan ular. Salah satu caranya adalah dengan membiarkan ular mengejarmu melalui pintu dan kemudian _menyerangnya setelah ia bergerak ke pintu._

actors.mobs.spectralnecromancer.name=necromancer spektral
actors.mobs.spectralnecromancer.desc=Meskipun Tengkorak adalah sumber daya utama bagi necromancer, beberapa lebih suka mencari budak yang tak berwujud. Necromancer spektral telah memilih hantu sebagai budak pilihan mereka!\n\nHantu sendiri tidaklah sekuat tengkorak, tapi necromancer tidak takut untuk memunculkan hantu dalam jumlah yang banyak!

actors.mobs.spinner.name=laba-laba gua
actors.mobs.spinner.desc=Laba-laba gua dengan bulu kehijauan itu menghindari pertarungan langsung, lebih memilih menunggu di kejauhan selagi mangsa mereka tertahan di jaring laba-labanya, perlahan melukai dengan gigitan beracun mereka. Mereka dapat menembakkan jaring laba-laba dari kejauhan, dan berusaha menghalangi jalan manapun yang akan diambil mangsanya.

actors.mobs.statue.name=patung animasi
actors.mobs.statue.def_verb=ketahan
actors.mobs.statue.desc=Kamu mungkin mengira itu hanyalah salah satu patung yang tidak bernyawa di terungku ini, tapi mata merahnya yang bersinar membuatmu ragu.
actors.mobs.statue.desc_weapon=Sementara patung itu sendiri terbuat dari batu, _%s_ yang dipegang olehnya terlihat nyata.
actors.mobs.statue.discover_hint=Kamu bisa menemukan musuh ini dimanapun di terungku.

actors.mobs.succubus.name=succubus
actors.mobs.succubus.desc=Succubi adalah iblis yang dapat berubah wujud untuk memanipulasi pikiran mangsanya. Yang ini berwujud humanoid gotic pucat, mungkin untuk menarik perhatian penyihir kurcaci?\n\nSuccubi mungkin akan membuat musuhnya terpesona saat menyerang dirinya, membuat musuhnya tidak dapat menyerang secara langsung. Saat succubi menyerang musuh yang sedang terpesona, succubi akan menyerap esensi kehidupan mereka.

actors.mobs.swarm.name=lalat rawa
actors.mobs.swarm.desc=Lalat rawa yang mematikan ini terbang dengan ganas. Setiap serangan non-sihir akan membuat lalat ini membelah diri menjadi lebih kecil, namun sama mematikannya.

actors.mobs.tengu.name=Tengu
actors.mobs.tengu.notice_gotcha=Dapat kau, %s!
actors.mobs.tengu.interesting=Ayo buat ini menarik...
actors.mobs.tengu.notice_have=Kena kamu sekarang, %s!
actors.mobs.tengu.defeated=Akhirnya bebas...
actors.mobs.tengu.rankings_desc=Dibunuh oleh Tengu
actors.mobs.tengu.desc=Seorang pembunuh terkenal dan penuh teka-teki, dinamai berdasarkan topeng yang dicangkokkan ke wajahnya.\n\nTengu ditahan dengan borgol besar di pergelangan tangan dan lututnya, meski sepertinya dia sudah melepaskan rantainya sejak lama.\n\nDia akan mencoba menggunakan jebakan, sihir tipu daya, dan serangan tepat untuk melenyapkan satu-satunya hal yang menghentikan pelariannya: Kamu.

actors.mobs.tengu$bombability$bombblob.desc=Awan asap super panas mengepul di sini. Awas, itu akan meledak!
actors.mobs.tengu$bombability$bombitem.name=Bom Asap
actors.mobs.tengu$bombability$bombitem.cant_pickup=Tertancap ke permukaan, kamu tidak dapat memindahkannya!
actors.mobs.tengu$bombability$bombitem.desc=Tengu telah melemparkan bom asap yang tampak aneh di sini, yang mengeluarkan asap panas tebal. Bom itu membuat suara detak keras, seolah-olah itu menghitung mundur sebuah ledakan!\n\nBom itu telah tertancap ke tanah, jadi kamu tidak bisa mengangkatnya.

actors.mobs.tengu$fireability$fireblob.desc=Tengu telah melemparkan bubuk halus yang sepertinya menguap di sini, dan itu akan segera terbakar!

actors.mobs.tengu$shockerability$shockerblob.desc=Energi listrik terbangun di sini, apapun yang berdiri di atas ubin ini akan tersengat listrik pada giliran berikutnya!
actors.mobs.tengu$shockerability$shockeritem.name=Pengejut
actors.mobs.tengu$shockerability$shockeritem.cant_pickup=Benda itu terlalu banyak mengeluarkan listrik, kamu tidak bisa mengambilnya!
actors.mobs.tengu$shockerability$shockeritem.desc=Tengu telah melempar mesin aneh di sini, yang tampaknya terbuat dari komponen DM-100. Mesin terus-menerus mengalirkan listrik di sekitarnya, tetapi tampaknya berfungsi dalam pola yang dapat diprediksi.\n\nDengan semua aliran listrik di sekitarnya, tidak mungkin kamu bisa mengambilnya.

actors.mobs.thief.name=pencuri gila
actors.mobs.thief.stole=Si pencuri mencuri %s darimu!
actors.mobs.thief.carries=\n\nSi pencuri membawa _%s._ Jelas Dicuri.
actors.mobs.thief.escapes=Si pencuri kabur bersama %s kamu!
actors.mobs.thief.desc=Walaupun mereka bebas berkelana dari sel satu sel lain, tempat ini tetaplah sebuah penjara bagi mereka. Seiring berjalannya waktu, tempat ini telah merenggut kewarasannya mereka bersamaan dengan terenggutnya kebebasan. Setelah sekian lama, para pencuri dan para bandit itu lupa akan jati diri mereka, dan lupa kenapa mereka mencuri.\n\nMusuh ini lebih cenderung mencuri dan lari daripada melawan.  Pastikan untuk selalu melihatnya, atau kamu mungkin tidak akan pernah melihat barang curianmu lagi.

actors.mobs.tormentedspirit.name=roh yang tersiksa
actors.mobs.tormentedspirit.desc=Roh yang tersiksa adalah roh baik hati yang telah tersiksa oleh kutukan. Selama mereka dikutuk, mereka akan menyerang seperti hantu, dan juga lebih kuat!\n\nAda kemungkinan untuk membersihkan kutukan dengan menggunakan benda yang tepat saat berada di dekat roh tersebut. Jika kutukan itu terangkat, roh tersebut pasti akan berterima kasih...
actors.mobs.tormentedspirit.thank_you=Terima kasih...

actors.mobs.vaultrat.desc=Tikus ini memiliki beberapa perubahan perilaku untuk menguji kubah AI musuh yang baru:\n_-_ Pergerakannya dapat 'terdengar' menembus dinding\n_-_ Ia akan berkeliaran di sepanjang jalur patroli yang telah ditentukan\n_-_ Saat berkeliaran, jangkauan deteksinya berkurang tajam di belakang arah pergerakannya.\n_-_ Saat tidur, jangkauan deteksinya juga berkurang\n_-_ Saat mendeteksi kamu, ia akan 'menyelidiki' sebelum beralih ke berburu. Musuh yang sedang menyelidiki bergerak ke arahmu tetapi tidak menyerang dan lebih mudah untuk dihindari di balik pintu dan pojokan.

actors.mobs.npcs.vaultsentry.name=penjaga pemindai brankas
actors.mobs.npcs.vaultsentry.desc=Penjaga ini sedang memindai area tersebut dengan pola tertentu. _Karena ini hanya area uji coba, penjaga tidak akan melakukan apa pun jika mendeteksi anda._

actors.mobs.npcs.vaultlaser.name=penjaga laser brankas
actors.mobs.npcs.vaultlaser.desc=Penjaga ini menembakkan laser secara berkala. _Karena ini hanya area uji coba, laser tersebut sebenarnya tidak akan membahayakan anda._

actors.mobs.warlock.name=penyihir kurcaci
actors.mobs.warlock.bolt_kill=Tembakan bayangan membunuhmu...
actors.mobs.warlock.desc=Ketika minat para kurcaci beralih dari teknik ke seni magis, para penyihir mulai berkuasa di kota. Mereka mulai dengan sihir elemen, tapi segera beralih ke demonologi dan nekromansi. Penyihir terkuat di antara para penyihir ini merebut takhta kota kurcaci, dan pengikutnya diizinkan untuk terus mempraktikkan sihir hitam mereka, selama mereka menyerahkan keinginan bebas mereka kepadanya.\n\nPenyihir ini memiliki sihir pengacau yang kuat, dan mampu menghalangi sementara sihir peningkatan yang diterapkan pada peralatanmu. Semakin tinggi peningkatan suatu item, semakin kuat pengaruhnya.

actors.mobs.wraith.name=hantu
actors.mobs.wraith.desc=Hantu adalah perwujudan roh yang berdosa, yang mana kuburannya telah diganggu. Karena mereka adalah makhluk gaib, maka akan sangat sulit menyerangnya memakai senjata biasa.
actors.mobs.wraith.discover_hint=Kamu bisa menemukan musuh ini dimanapun di terungku.

actors.mobs.yogdzewa.name=Yog-Dzewa
actors.mobs.yogdzewa.notice=AKU. MELIHAT. KAMU.
actors.mobs.yogdzewa.darkness=Kegelapan semakin mendekat...
actors.mobs.yogdzewa.hope=HARAPAN. KAMU. ADALAH. SEBUAH. ILUSI!
actors.mobs.yogdzewa.defeated=...
actors.mobs.yogdzewa.rankings_desc=Dilahap oleh Yog-Dzewa
actors.mobs.yogdzewa.desc=Yog-Dzewa adalah Dewa Kuno; monster besar yang menjangkau dunia kehidupan dan melahapnya untuk mendorong pertumbuhannya yang tak ada habisnya. Para kurcaci pasti telah menarik perhatian makhluk mengerikan ini sambil bermain-main dengan sihir hitam, dan ia berusaha menjaganya sejak saat itu.\n\nYog-Dzewa berasal dari dimensi magis yang kacau, dan tidak dapat membawa bentuk aslinya ke dunia ini. Ia menciptakan avatar dan memanggil antek iblis untuk melakukan perintahnya di sini.\n\nMata raksasa inilah yang menjadi titik fokus kekuatan Yog-Dzewa di dunia ini. Meskipun mata itu sendiri tidak bisa bergerak, ia mampu menembakkan sinar sihir iblis yang kuat dan memanggil berbagai antek untuk membantunya.
actors.mobs.yogdzewa.desc_spawners=Kamu bisa merasakan gelombang energi iblis memancar ke mata dari lantai atas. Sesuatu yang kamu tinggalkan hidup-hidup di sana pasti menyalurkan kekuatan kembali ke Yog-Dzewa. _Yog akan menggunakan energi ini untuk memanggil kaki tangan yang lebih kuat!_
actors.mobs.yogdzewa$larva.name=larva dewa
actors.mobs.yogdzewa$larva.rankings_desc=Dilahap oleh Yog-Dzewa
actors.mobs.yogdzewa$larva.desc=Bibit kecil Yog-Dzewa ini adalah antek sederhana yang mudah diproduksi. Meskipun lemah secara individu, mereka dapat dipanggil dengan cepat dan bisa membahayakan dalam jumlah banyak.
actors.mobs.yogdzewa$yogripper.rankings_desc=Dilahap oleh Yog-Dzewa
actors.mobs.yogdzewa$yogeye.rankings_desc=Dilahap oleh Yog-Dzewa
actors.mobs.yogdzewa$yogscorpio.rankings_desc=Dilahap oleh Yog-Dzewa

actors.mobs.yogfist.invuln_warn=Tinju itu kebal saat berada di dekat mata!
actors.mobs.yogfist.rankings_desc=Dilahap oleh Yog-Dzewa
actors.mobs.yogfist.desc=Tinju ini adalah salah satu aspek dari kekuatan Yog-Dzewa. Tinju terhubung dengan kekuatan Yog-Dzewa, dan akan terlindungi dari segala damage saat berada di dekat mata.
actors.mobs.yogfist$burningfist.name=tinju terbakar
actors.mobs.yogfist$burningfist.desc=Tinju ini terbentuk dari sihir api yang berkobar. Saat bergerak, ia akan terus-menerus membakar medan di sekitarnya. Ia juga mampu menembakkan ledakan kekuatan berapi-api, menyebarkan api di tempat yang terkena dampaknya.\n\nKemampuan tinju untuk menyebarkan api melemah saat berada di dekat air, tetapi panasnya sangat besar sehingga air di sekitarnya akan menguap setelah beberapa saat!
actors.mobs.yogfist$soiledfist.name=tinju kotor
actors.mobs.yogfist$soiledfist.desc=Tinju ini terbentuk dari sihir tanah yang kacau. Saat bergerak, ia akan terus-menerus menumbuhkan tumbuh-tumbuhan di sekitarnya. Ia juga dapat menembakkan ledakan yang akan menjerat targetnya pada tanaman merambat dan akar yang tumbuh dengan cepat!\n\nTinju ini memperoleh kekuatan dari kehidupan tanaman ini, dan akan menahan damage berdasarkan jumlah tumbuhan tinggi yang ada di dekatnya!
actors.mobs.yogfist$rottingfist.name=tinju busuk
actors.mobs.yogfist$rottingfist.desc=Tinju ini terbentuk dari korupsi yang hidup. Gumpalan daging busuk raksasa ini dapat menyebarkan cairan kaustik dan gas beracun dalam jaraknya serangnya. Lebih buruk lagi, massa tinju yang besar menyebabkannya berdarah alih-alih menerima damage secara langsung.\n\nAir dapat digunakan untuk membasuh cairan racun, tetapi tinju itu juga mampu menyerap air untuk menyembuhkan dirinya sendiri! Selain itu, memukul tinju saat sedang berdarah akan mengulang status berdarahnya, statusnya tidak dapat ditumpuk!
actors.mobs.yogfist$rustedfist.name=tinju berkarat
actors.mobs.yogfist$rustedfist.desc=Tinju ini terbuat dari logam hidup. Kumpulan logam bergerak yang besar itu memiliki serangan jarak dekat yang kuat, dan dapat melumpuhkan targetnya dari jarak jauh. Karena massanya yang luar biasa besar, tinju itu akan menerima damage secara berkala, tidak langsung semua.\n\nTinju itu tampaknya tidak fleksibel, dan tidak bisa bergerak melewati tempat yang sempit. Selain itu, meskipun ia dapat menerima damage dengan lambat, damage yang ditangguhkan akan terus meningkat jika tinju itu dipukul berkali-kali.
actors.mobs.yogfist$brightfist.name=tinju cahaya
actors.mobs.yogfist$brightfist.teleport=Tinju berteleportasi dalam kilatan cahaya yang membutakanmu!
actors.mobs.yogfist$brightfist.desc=Tinju ini terbentuk dari energi cahaya murni. Ia mampu menembakkan cahaya yang bersinar kuat setiap giliran! Sinar ini akan membutakan dirimu sementara, ditambah menimbulkan damage besar. Tinju ini juga mampu menyelimuti arena dalam cahaya yang menyilaukan untuk melarikan diri!\n\nTinju ini tidak memiliki kemampuan khusus yang dapat digunakan dalam jarak dekat.
actors.mobs.yogfist$darkfist.name=tinju kegelapan
actors.mobs.yogfist$darkfist.teleport=Tinju berteleportasi dalam ledakan kegelapan yang memadamkan sumber cahayamu!
actors.mobs.yogfist$darkfist.desc=Tinju ini terbentuk dari energi gelap yang murni. Ia mampu menembakkan ledakan sihir hitam yang kuat di setiap giliran! Ledakan ini akan melemahkan sumber cahayamu ditambah memberikan damage yang besar. Tinju ini juga mampu sementara menyelimuti arena dalam kegelapan untuk melarikan diri!\n\nTinju ini tidak memiliki kemampuan khusus yang dapat digunakan dalam jarak dekat.


actors.char.kill=%s membunuhmu...
actors.char.defeat=kau mengalahkan %s.
actors.char.def_verb=menghindar
actors.char.invulnerable=kebal
actors.char.immune=kebal

# Eternity PD Fallback Keys
actors.blobs.blizzard.desc=A blizzard is swirling here.
actors.blobs.confusiongas.desc=A cloud of confusion gas is swirling here.
actors.blobs.dancefloor.desc=Dance dance dance!\n%s dancing tile: %s\nNext color: %s
actors.blobs.dancefloor.color_1_name=Red
actors.blobs.dancefloor.color_1_desc=Characters standing on this tile take direct damage (massively increased vs hero)
actors.blobs.dancefloor.color_2_name=Green
actors.blobs.dancefloor.color_2_desc=Characters standing on this tile act at 2x speed
actors.blobs.dancefloor.color_3_name=Blue
actors.blobs.dancefloor.color_3_desc=Characters standing on this tile are stunned
actors.blobs.dancefloor.color_4_name=White
actors.blobs.dancefloor.color_4_desc=Characters standing on this tile take defered damage (massively increased vs hero)
actors.blobs.dancefloor.color_5_name=Yellow
actors.blobs.dancefloor.color_5_desc=Mobs killed on this tile give double EXP and more loot
actors.blobs.dancefloor.color_6_name=Purple
actors.blobs.dancefloor.color_6_desc=Characters standing on this tile take double damage
actors.blobs.dancefloor.rankings_desc=Danced into a grave
actors.blobs.dancefloor.ondeath=You danced into your own grave
actors.blobs.dancefloor$dancingdefereddamage.name=Dancing with Death
actors.blobs.dancefloor$dancingdefereddamage.desc=This is the most dangerous dance you've ever performed, and you are absolutely _ROCKING_ it, disregarding the pain!\n\nDeferred damage remaining: %d.
actors.blobs.dancefloor$dancingdefereddamage.ondeath=You danced into your own grave
actors.blobs.dancefloor$dancingdefereddamage.rankings_desc=Danced into a grave
actors.blobs.dancefloor$dancingdoom.name=Dancing in a grave
actors.blobs.dancefloor$dancingdoom.desc=Grave isn't the best place to dance in, but no one is stopping you!\n\nCharacters who are brave enough to dance in a grave will receive double damage from all sources.
actors.blobs.dancefloor$dancespeed.name=Dancing with Time
actors.blobs.dancefloor$dancespeed.desc=Your perfect dance synchronized with a rhythm of the universe, and not even time gonna stop you from dancing!\n\nWhile you dance is perfect, you will perform all actions at double speed.
actors.blobs.dancefloor$dancingstun.name=Stunned
actors.blobs.dancefloor$dancingstun.heromsg=You are stunned!
actors.blobs.dancefloor$dancingstun.desc=Nothing feels worse than being stunned in a middle of a dance\n\nStun completely halts all actions, forcing the target to wait until the effect wears off.
actors.blobs.electricity.desc=A field of electricity is sparking brightly here.
actors.blobs.electricity.rankings_desc=Electrocuted
actors.blobs.electricity.ondeath=You were shocked to death...
actors.blobs.fire.desc=A fire is raging here.
actors.blobs.foliage.desc=Shafts of light pierce the gloom of the underground garden.
actors.blobs.freezing.desc=The air is unnaturally frigid here.
actors.blobs.goowarn.desc=Specks of dark energy are swarming here!
actors.blobs.inferno.desc=An inferno is raging here.
actors.blobs.paralyticgas.desc=A cloud of paralytic gas is swirling here.
actors.blobs.sacrificialfire.desc=There is an altar here with a sacrificial fire burning atop it. Any creature that's killed here will be consumed as an offering to the spirits of the dungeon.\n\nPerhaps a reward will be given if enough sacrifices are made?
actors.blobs.sacrificialfire.worthy=The fire consumes your offering and grows stronger.
actors.blobs.sacrificialfire.unworthy=The fire consumes your offering, but doesn't change.
actors.blobs.sacrificialfire.reward=The fire flares and then dissipates, leaving a reward behind!
actors.blobs.smokescreen.desc=A cloud of thick black smoke is swirling here.
actors.blobs.stenchgas.desc=A cloud of fetid stench is swirling here.
actors.blobs.stormcloud.desc=A cloud of billowing water vapor is swirling here.
actors.blobs.toxicgas.desc=A greenish cloud of toxic gas is swirling here.
actors.blobs.toxicgas.rankings_desc=Suffocated
actors.blobs.toxicgas.ondeath=You died from the toxic gas...
actors.blobs.corrosivegas.desc=A cloud of deadly caustic gas is swirling here.
actors.blobs.waterofawareness.procced=As you take a sip, you feel knowledge pour into your mind.
actors.blobs.waterofawareness.desc=Power of knowledge radiates from the water of this well. Take a sip from it to reveal all secrets of equipped items and reveal all items on the current floor.
actors.blobs.waterofhealth.procced=As you take a sip, you feel your wounds heal completely.
actors.blobs.waterofhealth.desc=Power of health radiates from the water of this well. Take a sip from it to heal your wounds and satisfy hunger.
actors.blobs.wateroftransmutation.desc=Power of change radiates from the water of this well. Throw an item into the well to turn it into something else.
actors.blobs.web.desc=A thick web is covering everything here. Anything that touches or is thrown through the web will break it, but will also be stuck in place.
actors.buffs.adrenaline.name=adrenaline
actors.buffs.adrenaline.desc=A surge of physical power, adrenaline enhanced both attack and movement speed.\n\nAdrenaline allows its target to run at 2x speed, and attack at 1.5x speed.\n\nTurns remaining: %s.
actors.buffs.adrenalinesurge.name=strength boost
actors.buffs.adrenalinesurge.desc=A surge of great might, but sadly not permanent.\n\nStrength boost: +%d.\nTurns until boost weakens: %s.
actors.buffs.amok.name=amok
actors.buffs.amok.desc=Amok causes a state of great rage and confusion in its target.\n\nWhen a creature is amoked, they will attack whatever is near them, whether they be friend or foe.\n\nTurns of amok remaining: %s.
actors.buffs.arcanearmor.name=arcane armor
actors.buffs.arcanearmor.desc=A thin shield is surrounding you, blocking some of the damage from magical attacks.\n\nYour magical armor is currently boosted by: 0-%d.\n\nTurns until arcane armor weakens: %s.
actors.buffs.artifactrecharge.name=artifact recharging
actors.buffs.artifactrecharge.desc=Energy is coursing through you, increasing the rate your equipped artifacts charge.\n\nEach artifact is affected a little differently, but they will all gain charge much faster than normal.\n\nTurns remaining: %s.
actors.buffs.ascensionchallenge.name=amulet's curse
actors.buffs.ascensionchallenge.desc=Somehow Yog-Dzewa is maintaining influence on this world through the amulet, and is trying to stop your ascent!\n\nYog's power is making the dungeon much more dangerous, increasing the number of enemies and making them stronger! This power will keep building if left unchecked, it can be weakened by defeating enemies that have been enhanced by Yog's power.
actors.buffs.ascensionchallenge.desc_clear=The dark energy radiating from the amulet has been weakened as much as possible for now.
actors.buffs.ascensionchallenge.desc_beckon=The amulet is currently _calling out to distant enemies,_ alerting them to your position.
actors.buffs.ascensionchallenge.desc_haste=The amulet is currently _hastening distant enemies,_ letting them reach you faster!
actors.buffs.ascensionchallenge.desc_slow=The amulet is currently _slowing you down,_ and negating speed boosting effects!
actors.buffs.ascensionchallenge.desc_damage=The energy from the amulet has gotten so strong that it's _directly harming you!_
actors.buffs.ascensionchallenge.beckon=The amulet begins calling out to distant enemies.
actors.buffs.ascensionchallenge.haste=The amulet begins hastening distant enemies!
actors.buffs.ascensionchallenge.slow=The amulet starts to feel like a lead weight in your inventory!
actors.buffs.ascensionchallenge.damage=The amulet begins radiating dark energy. It burns!
actors.buffs.ascensionchallenge.weaken_info=You must defeat enemies to weaken the amulet's curse!
actors.buffs.ascensionchallenge.weaken=You can feel the amulet's curse weaken slightly.
actors.buffs.ascensionchallenge.break=You take a moment to catch your breath and feel your wounds begin to close!
actors.buffs.ascensionchallenge.almost=You feel Yog's grip on the amulet begin to weaken, you're almost there!
actors.buffs.ascensionchallenge.on_kill=The dark energy consumes you...
actors.buffs.barkskin.name=barkskin
actors.buffs.barkskin.desc=Your skin is hardened, it feels rough and solid like bark.\n\nThe hardened skin increases your effective armor, allowing you to better defend against physical attack.\n\nYour armor is currently increased by: 0-%d.\nTurns until barkskin weakens: %s.\n\nIf you receive barkskin from multiple sources, only the strongest one will apply.
actors.buffs.barrier.name=barrier
actors.buffs.barrier.desc=A durable bubble of force which blocks all damage.\n\nThe barrier will take damage for whatever it is protecting so long as there is shielding left. The shielding will also slowly decay over time.\n\nShielding remaining: %d.
actors.buffs.rageshield.name=Determination Shield
actors.buffs.rageshield.heromsg=You are protected by your rage!
actors.buffs.rageshield.desc=A durable bubble of your sheer rage saps away life force from nearby enemies, if you are wounded.\n\nThe barrier will drain health from enemies in your sight, angering them and taking damage. The shielding will have bigger effect if enemy is in adjacent to host.\n\nShielding remaining: %d.
actors.buffs.berserk.angered=angered
actors.buffs.berserk.berserk=berserking
actors.buffs.berserk.exhausted=exhausted
actors.buffs.berserk.recovering=recovering
actors.buffs.berserk.angered_desc=The severity of the Berserker's injuries strengthen his blows. As the berserker takes physical damage, his rage will build, granting him bonus damage. Damage which is blocked by armor still counts towards building rage.\n\nRage will fade over time. The lower the berserker's health, the longer it will last.\n\nAt 100%% rage, the Berserker can go berserk, granting him 2x his seal's max shielding, increasing to 6x if he has very low health. This shielding decays over time and once it runs out the berserker will have to rest before building rage again.\n\nCurrent Rage: _%.0f%%_\n_+%.0f%%_ damage
actors.buffs.berserk.berserk_desc=Fear and uncertainty bleed away, leaving only anger. In this state the Berserker is extremely powerful, _dealing +50% damage and gaining bonus shielding._\n\nThis bonus shielding is equal to 2x his seal's max shielding, increasing to 6x if he has very low health. When this shielding is reduced to 0, berserking will end.\n\nAfter raging, the Berserker will need to recover before being able to build rage again.
actors.buffs.berserk.recovering_desc=Inner strength has its limits. The Berserker must rest before using his rage again.\n\nWhile recovering the Berserker does not build any rage from taking damage.
actors.buffs.berserk.recovering_desc_turns=Turns until recovered: _%d_
actors.buffs.berserk.recovering_desc_levels=Levels until recovered: _%.2f_
actors.buffs.berserk.rankings_desc=Berserked to Death
actors.buffs.berserk.action_name=Berserk
actors.buffs.berserk.no_seal=You need your broken seal to berserk!
actors.buffs.bleeding.name=bleeding
actors.buffs.bleeding.ondeath=You bled to death...
actors.buffs.bleeding.heromsg=You are bleeding!
actors.buffs.bleeding.rankings_desc=Bled to Death
actors.buffs.bleeding.desc=That wound is leaking a worrisome amount of blood.\n\nBleeding causes damage every turn. Each turn the damage decreases by a random amount, until the bleeding eventually stops.\n\nCurrent bleed damage: %d.
actors.buffs.bless.name=blessed
actors.buffs.bless.desc=A great burst of focus, some say it is inspired by the gods.\n\nBlessing increases accuracy and evasion by 25%%, making the blessed much more effective in combat.\nIt also increased experience gain by 2x for heroes and allows them to get more items.\n\nTurns of bless remaining: %s.
actors.buffs.blindness.name=blinded
actors.buffs.blindness.heromsg=You are blinded!
actors.buffs.blindness.desc=Blinding turns the surrounding world into a dark haze.\n\nWhile blinded, a character's vision range is reduced to one tile, rendering ranged attacks useless and making it very easy to lose track of distant enemies. Additionally, a blinded hero is unable to read scrolls or books.\n\nTurns of blindness remaining: %s.
actors.buffs.buff.heromsg=
actors.buffs.burning.name=burning
actors.buffs.burning.heromsg=You catch fire!
actors.buffs.burning.burnsup=%s burns up!
actors.buffs.burning.ondeath=You burned to death...
actors.buffs.burning.rankings_desc=Burned to Ash
actors.buffs.burning.desc=Few things are more distressing than being engulfed in flames.\n\nFire will deal damage every turn until it is put out by water or it expires. Fire can be extinquished by stepping into water, or from the splash of a shattering potion.\n\nAdditionally, the fire may ignite flammable terrain or items that it comes into contact with.\n\nTurns of burning remaining: %s.
actors.buffs.championenemy.warn=You sense a deadly presence.
actors.buffs.championenemy$blazing.name=blazing champion
actors.buffs.championenemy$blazing.desc=Blazing champions deal 25% more melee damage, ignite enemies they attack, are immune to fire, and spread fire around them as they die. They can't spread fire onto water however.
actors.buffs.championenemy$projecting.name=projecting champion
actors.buffs.championenemy$projecting.desc=Projecting champions deal 25% more melee damage and have +3 attack range.
actors.buffs.championenemy$antimagic.name=antimagic champion
actors.buffs.championenemy$antimagic.desc=Antimagic champions take 50% less damage and are completely immune to magical effects.
actors.buffs.championenemy$giant.name=giant champion
actors.buffs.championenemy$giant.desc=Giant champions take 80% less damage and have +1 attack range, but cannot move through enclosed spaces.
actors.buffs.championenemy$blessed.name=blessed champion
actors.buffs.championenemy$blessed.desc=Blessed champions have 4x accuracy and evasion.
actors.buffs.championenemy$growing.name=growing champion
actors.buffs.championenemy$growing.desc=Growing champions gain a steadily increasing bonus to accuracy, evasion, physical damage, and a reduction to damage taken.\n\nCurrent acc/eva/dmg boost: %1$d%%\nCurrent damage reduction: %2$d%%
actors.buffs.championenemy$tanky.name=tanky champion
actors.buffs.championenemy$tanky.desc=Tanky champions receives only 5% of the damage, but reduces their damage and speed by 25%.
actors.buffs.championenemy$speedy.name=speedy champion
actors.buffs.championenemy$speedy.desc=Speedy Champions will gain x4 speed and x1.5 evasion and accuracy.
actors.buffs.championenemy$frozen.name=frozen champion
actors.buffs.championenemy$frozen.desc=Frozen champions deal 25% more melee damage but they have -20% speed, chills enemies they attack and sometimes freezes them, are immune to cold gases or effects, and spread blizzard around them as they die.
actors.buffs.championenemy$blunt.name=blunt champion
actors.buffs.championenemy$blunt.desc=Blunt champions are expert for using their hands or something they use as a blunt weapons, they deal 75% more damage as well as inflicts vertigo when they attack and paralyzes you in rare cases.
actors.buffs.charm.name=charmed
actors.buffs.charm.heromsg=You are charmed!
actors.buffs.charm.cant_attack=You are charmed by that enemy and can't attack them.
actors.buffs.charm.desc=A charm is manipulative magic that can make enemies temporarily adore each other.\n\nCharacters affected by charm are unable to directly attack the enemy they are charmed by. Attacking other targets is still possible however. The shock of pain will lessen the duration of charm.\n\nTurns of charm remaining: %s.
actors.buffs.chill.name=chilled
actors.buffs.chill.freezes=%s freezes!
actors.buffs.chill.desc=Not quite frozen, but still much too cold.\n\nChilled targets perform all actions more slowly, depending on how many turns are left in the effect. At its worst, this is equivalent to being slowed.\n\nTurns of chill remaining: %1$s.\nSpeed is reduced by: %2$s%%
actors.buffs.combo.name=combo
actors.buffs.combo.action_name=combo attack
actors.buffs.combo.combo=%d hit combo!
actors.buffs.combo.bad_target=You must target an enemy in attack range.
actors.buffs.combo.prompt=Select a target to attack.
actors.buffs.combo.desc=The gladiator builds momentum as they land successful blows. Each attack increases the combo counter by one, but taking too long between hits will reset the combo counter to 0.\n\nBuilding combo unlocks special combo attacks that cannot miss! A different attack is unlocked at 2, 4, 6, 8, and 10 combo count. Some moves reset combo and some do not, but each move can only be used once per combo session.\n\nCurrent combo: %1$d.\n\nTurns until Combo is lost: %2$s.
actors.buffs.combo$combomove.clobber.name=clobber
actors.buffs.combo$combomove.clobber.desc=Knocks an enemy back 2 tiles, but deals no damage and cannot knock into pits. Increments combo by 1.
actors.buffs.combo$combomove.clobber.empower_desc=Knocks an enemy back _3 tiles, inflicts vertigo, and can knock into pits,_ but deals no damage. Increments combo by 1.
actors.buffs.combo$combomove.slam.name=slam
actors.buffs.combo$combomove.slam.desc=Deals %d%% (combo*20%%) of your damage blocking power as bonus damage. Resets combo when used.
actors.buffs.combo$combomove.slam.empower_desc=_Leaps up to %1$d tile(s)_ and deals %2$d%% (combo*20%%) of your damage blocking power as bonus damage. Resets combo when used.
actors.buffs.combo$combomove.parry.name=parry
actors.buffs.combo$combomove.parry.desc=Blocks the next attack within 1 turn when activated, and instantly retaliates to it. Resets combo if nothing is parried.
actors.buffs.combo$combomove.parry.empower_desc=Blocks _all attacks_ within 1 turn when activated, and instantly retaliates to them. Resets combo if nothing is parried.
actors.buffs.combo$combomove.crush.name=crush
actors.buffs.combo$combomove.crush.desc=Deals %d%% (combo*25%%) damage to the primary target, and half that damage to all other enemies in a 7x7 AOE. Resets combo when used.
actors.buffs.combo$combomove.crush.empower_desc=_Leaps up to %1$d tile(s)_ and deals %2$d%% (combo*25%%) damage to the primary target, and half that damage to all other enemies in a 7x7 AOE. Resets combo when used.
actors.buffs.combo$combomove.fury.name=fury
actors.buffs.combo$combomove.fury.desc=Hits an enemy once for each combo you have, each hit deals 60% damage and can trigger enchantments. Resets combo when used.
actors.buffs.combo$combomove.fury.empower_desc=_Leaps up to %d tile(s)_ and hits an enemy once for each combo you have, each hit deals 60%% damage and can trigger enchantments. Resets combo when used.
actors.buffs.corruption.name=corrupted
actors.buffs.corruption.desc=Corruption seeps into the essence of a being, twisting them against their former nature.\n\nCorrupted creatures will attack their allies, and ignore their former enemies. Corruption is damaging as well, and will slowly cause its target to succumb.\n\nCorruption is permanent, its effects only end in death.
actors.buffs.cripple.name=crippled
actors.buffs.cripple.heromsg=You are crippled!
actors.buffs.cripple.desc=You're pretty sure legs aren't meant to bend that way.\n\nCrippled halves movement speed, making moving a tile usually take two turns instead of one.\n\nTurns of cripple remaining: %s.
actors.buffs.daze.name=dazed
actors.buffs.daze.heromsg=You are dazed!
actors.buffs.daze.desc=Ringing ears and blurred vision make it difficult to fight.\n\nWhile dazed, accuracy and evasion are reduced by 50%%, making both landing and evading blows much harder.\n\nTurns of daze remaining: %s.
actors.buffs.degrade.name=degraded
actors.buffs.degrade.heromsg=Your equipment feels weaker!
actors.buffs.degrade.desc=Powerful dark magic is sapping the strength that scrolls of upgrade have applied to your equipment!\n\nWhile degraded, upgraded gear will be treated as if it is a lower level than it actually is. _Every upgrade after +3 becomes exponentially weaker than the last one._ The descriptions of your items will change to reflect their reduced power level.\n\nDegradation does not affect strength requirements, wand charges, durability of thrown weapons, or artifacts.\n\nTurns of degradation remaining: %s. Using a scroll of upgrade or remove curse will end degradation immediately.
actors.buffs.doom.name=doomed
actors.buffs.doom.desc=It's hard to keep going when it seems like the universe wants you dead.\n\nDoomed characters will receive +67% damage from all sources.\n\nDoom is permanent, its effects only end in death.
actors.buffs.dread.name=dread
actors.buffs.dread.desc=A terror so great that it will cause its target to flee the dungeon entirely!\n\nCreatures affected by dread will run from their opponent at high speed, and will disappear from the dungeon entirely once they are out of sight. Enemies that are defeated this way award half experience and drop no items. The shock of pain will lessen the duration of dread.\n\nTurns of dread remaining: %d.
actors.buffs.drowsy.name=drowsy
actors.buffs.drowsy.desc=A magical force is making it difficult to stay awake, after a few turns, the target will fall into a deep magical sleep.\n\nThe hero can resist drowsiness by taking damage or by being at full health.\n\nTurns until sleep: %s.
actors.buffs.earthimbue.name=imbued with earth
actors.buffs.earthimbue.desc=You are imbued with the power of earth!\n\nAll physical attacks will shift the earth under the enemy, crippling them for a short time.\n\nTurns of earth imbue remaining: %s.
actors.buffs.enhancedrings.name=enhanced rings
actors.buffs.enhancedrings.desc=The Rogue's recently used artifact is empowering his rings, granting them +1 level.\n\nTurns remaining: %s.
actors.buffs.fireimbue.name=imbued with fire
actors.buffs.fireimbue.desc=You are imbued with the power of fire!\n\nAll physical attacks will have a chance to light enemies ablaze. Additionally, you are completely immune to the effects of fire.\n\nTurns of fire imbue remaining: %s.
actors.buffs.foresight.name=foresight
actors.buffs.foresight.desc=You are somehow able to see the layout of surrounding terrain with your mind.\n\nWhile under the effect of foresight all tiles in a wide radius are revealed to you, including any secret traps or doors.\n\nTurns of foresight remaining: %s.
actors.buffs.frost.name=frozen
actors.buffs.frost.freezes=%s freezes!
actors.buffs.frost.desc=Not to be confused with freezing solid, this more benign freezing simply encases the target in ice.\n\nFreezing acts similarly to paralysis, making it impossible for the target to act. Unlike paralysis, freezing is immediately cancelled if the target takes damage, as the ice will shatter.\n\nTurns of freeze remaining: %s.
actors.buffs.frostimbue.name=imbued with frost
actors.buffs.frostimbue.desc=You are imbued with icy power!\n\nAll physical attacks will steadily stack chill on enemies. Additionally, you are completely immune to the cold.\n\nTurns of frost imbue remaining: %s.
actors.buffs.fury.name=furious
actors.buffs.fury.heromsg=You become furious!
actors.buffs.fury.desc=You are angry, enemies won't like you when you're angry.\n\nA great rage burns within you, increasing the damage you deal with physical attacks by 50%%.\n\nThis rage will last as long as you are injured below 50%% health.
actors.buffs.blobimmunity.name=purification barrier
actors.buffs.blobimmunity.desc=Some strange force is encasing you in a thin protective barrier, blocking out all harmful airborne effects.\n\nYou are immune to all area-bound effects while this barrier lasts.\n\nTurns of immunity remaining: %s.
actors.buffs.greaterhaste.name=greater haste
actors.buffs.greaterhaste.desc=An incredible boost of speed, for a moment it feels as if everything else is standing still.\n\nWhile under the effects of greater haste moving actions take no time at all, but other actions are still performed at normal speed. Each step of movement consumes a turn of greater haste.\n\nTurns of greater haste remaining: %d.
actors.buffs.godspeed.name=Godspeed
actors.buffs.godspeed.desc=Godly energy courses through your whole essence, allowing you to perform actions at incredible speeds!\n\nWhile under the effects of godspeed you will perform all actions at double speed.\n\nTurns of godspeed remaining: %s.
actors.buffs.haste.name=haste
actors.buffs.haste.desc=Energy courses through your muscles, allowing you to run at incredible speeds!\n\nWhile under the effects of haste you will run at 3x speed, but will perform all other actions at normal speed.\n\nTurns of haste remaining: %s.
actors.buffs.healing.name=healing
actors.buffs.healing.desc=A magical remedy is causing wounds to close and flesh to knit.\n\nEvery turn health will steadily regenerate until the healing effect expires. The amount of healing may fade over time.\n\nNext heal: %d.\n\nHealing remaining: %d.
actors.buffs.herodisguise.name=disguise
actors.buffs.herodisguise.desc=Illusory magic has altered your physical appearance! The effect is purely cosmetic, but feels very strange regardless.\n\nTurns of disguise remaining: %s.
actors.buffs.hex.name=hexed
actors.buffs.hex.heromsg=You have been hexed!
actors.buffs.hex.desc=Dark magic which saps focus, making the target slightly disoriented.\n\nHexing reduces accuracy and evasion by 20%%, making the target less effective in combat.\n\nTurns of hex remaining: %s.
actors.buffs.holdfast.name=hold fast
actors.buffs.holdfast.desc=The %s is holding his position, increasing their armor by %d-%d. This will last until they move.
actors.buffs.hunger.hungry=hungry
actors.buffs.hunger.starving=starving
actors.buffs.hunger.onhungry=You are hungry.
actors.buffs.hunger.onstarving=You are starving!
actors.buffs.hunger.ondeath=You starved to death...
actors.buffs.hunger.cursedhorn=The cursed horn steals some of the food energy as you eat.
actors.buffs.hunger.rankings_desc=Starved to Death
actors.buffs.hunger.desc_intro_hungry=You can feel your stomach calling out for food, but it's not too urgent yet.
actors.buffs.hunger.desc_intro_starving=You're so hungry it hurts.
actors.buffs.hunger.desc=\n\nHunger slowly increases as you spend time in the dungeon, eventually you will begin to starve. While starving you will slowly lose health instead of regenerating it.\n\nRationing is important! If you have health to spare starving isn't a bad idea if it means there will be more food later. Effective rationing can make food last a lot longer!
actors.buffs.invisibility.name=invisible
actors.buffs.invisibility.desc=You are completely blended into the surrounding terrain, making you impossible to see.\n\nWhile you are invisible enemies are unable to attack or follow you. Physical attacks and magical effects (such as scrolls and wands) will immediately cancel invisibility.\n\nTurns of invisibility remaining: %s.
actors.buffs.invulnerability.name=invulnerable
actors.buffs.invulnerability.desc=You are suffused with great protective power, granting you a brief period of invulnerability!\n\nTurns remaining: %s.
actors.buffs.levitation.name=levitating
actors.buffs.levitation.desc=A magical force is levitating you over the ground, making you feel weightless.\n\nLevitating characters move silently and ignore all ground-based effects. Traps won't trigger, water won't put out fire, plants won't be trampled, roots will miss, and pits will be hovered over. Be careful, as all these things can come into effect the second the levitation ends!\n\nTurns of levitation remaining: %s.
actors.buffs.lifelink.name=life link
actors.buffs.lifelink.desc=This character's life force is linked to another character nearby. Any damage taken is shared between them.\n\nWhenever this character takes damage, half of it will be dealt to the life link target instead.\n\nTurns of life link remaining: %s, or until the linked character dies.
actors.buffs.light.name=illuminated
actors.buffs.light.desc=Even in the Darkest Dungeon, a steady light at your side is always comforting.\n\nLight helps keep darkness at bay, allowing you to see a reasonable distance despite the environment.\n\nTurns of illumination remaining: %s.
actors.buffs.lockedfloor.name=floor is locked
actors.buffs.lockedfloor.desc=The current floor is locked, and you are unable to leave it!\n\nWhile a floor is locked, you will not gain hunger or take damage from starving. In addition, if you do not work towards defeating this floor's boss, passive regeneration effects will also stop.\n\nAdditionally, if you are revived by an unblessed ankh while the floor is locked, then it will reset.\n\nKill this floor's boss to break the lock.
actors.buffs.lostinventory.name=lost inventory
actors.buffs.lostinventory.desc=Your inventory has been lost somewhere in the dungeon! You won't be able to pick up or use most items until you retrieve it.
actors.buffs.magicalsight.name=magical sight
actors.buffs.magicalsight.desc=Somehow you are able to see with your mind, rather than your eyes.\n\nWhile magical sight is active you will be able to see through all terrain in a 12 tile radius.\n\nTurns of magical sight remaining: %s.
actors.buffs.magicalsleep.name=magical sleep
actors.buffs.magicalsleep.toohealthy=You are too healthy, and resist the urge to sleep.
actors.buffs.magicalsleep.fallasleep=You fall into a deep magical sleep.
actors.buffs.magicalsleep.wakeup=You wake up feeling refreshed and healthy.
actors.buffs.magicalsleep.desc=This character has fallen into a deep magical sleep which they will not wake from naturally.\n\nMagical sleep is similar to regular sleep, except that only damage will cause the target to wake up.\n\nFor the hero and their allies, magical sleep has some restorative properties, allowing them to rapidly heal while resting.
actors.buffs.magicimmune.name=immune to magic
actors.buffs.magicimmune.desc=All magical effects have lost their hold on you, you are completely impervious to them.\n\nWhile magic immune all harmful and helpful magical effects will not apply to you, including curses, enchants, wands, scrolls, rings, artifacts, etc. Heroic armor abilities are strong enough to work regardless of this effect.\n\nTurns of magic immunity remaining: %s.
actors.buffs.overload.name=Overload
actors.buffs.overload.desc=The reality is overloaded. Prepare to cry, suffer, kill and slaughter.\n\nThe death of any hostile creature triggers the spawn of other creature.\n\nTurns of overload remaining: %s.
actors.buffs.mindvision.name=mind vision
actors.buffs.mindvision.desc=Somehow you are able to see all creatures on this floor through your mind. It's a weird feeling.\n\nAll characters on this floor are visible to you as long as you have mind vision. Seeing a creature through mind vision counts as it being seen or nearby for the purposes of many magical effects.\n\nTurns of mind vision remaining: %s.
actors.buffs.momentum.momentum=building momentum
actors.buffs.momentum.running=freerunning
actors.buffs.momentum.resting=recovering
actors.buffs.momentum.action_name=freerun
actors.buffs.momentum.momentum_desc=As he moves, the Freerunner builds momentum, which he can spend to start freerunning.\n\nEach charge of momentum grants two turns of freerunning, and the Freerunner can build up to 10 charges. Momentum is rapidly lost when the Freerunner stops moving.\n\nCurrent momentum charge: %d.
actors.buffs.momentum.running_desc=As he moves, the Freerunner builds momentum, which he can spend to start freerunning.\n\nWhile freerunning, the Freerunner moves at double speed and gains bonus evasion based on his level.\n\nTurns remaining: %d.
actors.buffs.momentum.resting_desc=As he moves, the Freerunner builds momentum, which he can spend to start freerunning.\n\nThe Freerunner needs time to regain his stamina before building momentum again.\n\nTurns remaining: %d.
actors.buffs.monkenergy.name=energy
actors.buffs.monkenergy.action=Monk Abilities
actors.buffs.monkenergy.desc=As she defeats enemies, the Monk gains energy that she can use on a variety of abilities. Most enemies grant 1 energy when defeated, and the Monk does not lose energy over time.\n\nCurrent energy: %1$d/%2$d.
actors.buffs.monkenergy.desc_cooldown=The Monk has recently used an ability, and must wait before using another.\n\nCurrent cooldown: %d turns.
actors.buffs.monkenergy$monkability$flurry.name=flurry of blows
actors.buffs.monkenergy$monkability$flurry.desc=Two instant strikes that deal %1$d-%2$d damage and ignore armor. This ability cannot be used repeatedly.
actors.buffs.monkenergy$monkability$flurry.empower_desc=Two instant strikes that deal %1$d-%2$d damage, ignore armor, _and use your weapon's enchantment._ This ability cannot be used repeatedly.
actors.buffs.monkenergy$monkability$focus.name=focus
actors.buffs.monkenergy$monkability$focus.desc=The Monk takes a turn to focus, letting her parry the next attack made against her.
actors.buffs.monkenergy$monkability$focus.empower_desc=The Monk _instantly focuses,_ letting her parry the next attack made against her.
actors.buffs.monkenergy$monkability$focus$focusbuff.name=focused
actors.buffs.monkenergy$monkability$focus$focusbuff.desc=The Monk is focused on her surroundings, anticipating the next attack made against her. While focused, she is guaranteed to parry the next incoming attack.
actors.buffs.monkenergy$monkability$dash.name=dash
actors.buffs.monkenergy$monkability$dash.prompt=Choose a Location
actors.buffs.monkenergy$monkability$dash.desc=An instant dash up to 4 tiles away. This ability can go over hazards, but not through enemies or solid terrain.
actors.buffs.monkenergy$monkability$dash.empower_desc=An instant dash up to _8 tiles_ away. This ability can go over hazards, but not through enemies or solid terrain.
actors.buffs.monkenergy$monkability$dragonkick.name=dragon kick
actors.buffs.monkenergy$monkability$dragonkick.desc=A devastating kick that deals %1$d-%2$d damage and ignores armor. The kick knocks the target away and paralyzes them for each tile they travel.
actors.buffs.monkenergy$monkability$dragonkick.empower_desc=A devastating kick that deals _%1$d-%2$d damage_ and ignores armor. The kick knocks _all adjacent targets_ away and paralyzes them for each tile they travel.
actors.buffs.monkenergy$monkability$meditate.name=meditate
actors.buffs.monkenergy$monkability$meditate.desc=The Monk focuses energy into her body for 5 turns. This clears most negative effects and grants her 8 turns of wand and artifact recharging.
actors.buffs.monkenergy$monkability$meditate.empower_desc=The Monk focuses energy into her body for 5 turns. This clears most negative effects and grants her 8 turns of wand and artifact recharging. _She also gains 80% damage resistance while meditating, and slowly heals for 20% of her missing HP._
actors.buffs.killevolution.name=kill counter
actors.buffs.killevolution.action=Kill Abilities
actors.buffs.killevolution.desc=As they defeat enemies, the hero gains energy that they can use on a variety of abilities. Most enemies grant 1 energy when defeated, and the hero does not lose energy over time.\n\n_However, unequipping a weapon associated with this buff associated with will lose all of this energy and you need to start killing enemies again_\n\nCurrent energy: %1$d/%2$d.
actors.buffs.killevolution.desc_cooldown=The hero has recently used an ability, and must wait before using another.\n\nCurrent cooldown: %d turns.
actors.buffs.killevolution$killevolutionability$invisibledash.name=invisible dash
actors.buffs.killevolution$killevolutionability$invisibledash.prompt=Choose a Location
actors.buffs.killevolution$killevolutionability$invisibledash.desc=An instant dash up to 4 tiles away with an additional turn of invisibility allowing the hero to surprise attack. This ability can go over hazards, but not through enemies or solid terrain.
actors.buffs.killevolution$killevolutionability$invisibledash.empower_desc=An instant dash up to _8 tiles_ away with an additional turn of invisibility allowing the hero to surprise attack. This ability can go over hazards, but not through enemies or solid terrain.
actors.buffs.killevolution$killevolutionability$physicallyempowered.name=physical empower
actors.buffs.killevolution$killevolutionability$physicallyempowered.desc=The hero grants itself +2 bonus damage for 10 hits.
actors.buffs.killevolution$killevolutionability$physicallyempowered.empower_desc=The hero grants itself _+4 bonus damage_ for 10 hits.
actors.buffs.killevolution$killevolutionability$weaponupgrade.name=weapon upgrade
actors.buffs.killevolution$killevolutionability$weaponupgrade.desc=The hero upgrades their weapon (and Duelist's second weapon if there's any) permanently.
actors.buffs.killevolution$killevolutionability$weaponupgrade.empower_desc=The hero upgrades their weapon (and Duelist's second weapon if there's any) _twice_ permanently.
actors.buffs.killevolution$killevolutionability$chain.name=chain enemy
actors.buffs.killevolution$killevolutionability$chain.desc=The hero chains an enemy to pull them in closer range.
actors.buffs.killevolution$killevolutionability$immortalize.name=immortalize
actors.buffs.killevolution$killevolutionability$immortalize.desc=The hero grants itself immortality against all sources of damage for 15 turns.
actors.buffs.killevolution$killevolutionability$immortalize.empower_desc=The hero grants itself immortality against all sources of damage for _~22 turns_.
actors.buffs.ooze.name=caustic ooze
actors.buffs.ooze.heromsg=Caustic ooze eats your flesh. Wash it away!
actors.buffs.ooze.ondeath=You melt away...
actors.buffs.ooze.rankings_desc=Dissolved
actors.buffs.ooze.desc=This sticky acid clings to flesh, slowly melting it away.\n\nOoze will deal consistent damage over time, but can be immediately washed off in water.\n\nTurns of ooze remaining: %s.
actors.buffs.paralysis.name=paralysed
actors.buffs.paralysis.heromsg=You are paralysed!
actors.buffs.paralysis.out=resisted paralysis
actors.buffs.paralysis.desc=Oftentimes the worst thing to do is nothing at all.\n\nParalysis completely halts all actions, forcing the target to wait until the effect wears off. The pain from taking damage can cause characters to resist paralysis, breaking them out of the effect.\n\nTurns of paralysis remaining: %s.
actors.buffs.physicalempower.name=physically empowered
actors.buffs.physicalempower.desc=Your blows have been empowered, increasing the amount of damage you can deal when you hit enemies with physical attacks.\n\nBonus damage: %1$d.\nHits remaining: %2$d.
actors.buffs.pincushion.name=pincushion
actors.buffs.pincushion.desc=The thrown weapons you have used against this character are currently stuck to them and will fall to the floor after they are defeated.\n\nThe following items are currently attached:
actors.buffs.poison.name=poisoned
actors.buffs.poison.heromsg=You are poisoned!
actors.buffs.poison.ondeath=You died from poison...
actors.buffs.poison.rankings_desc=Succumbed to Poison
actors.buffs.poison.desc=Poison works its way through the body, slowly impairing its internal functioning.\n\nPoison deals damage each turn proportional to how long until it expires.\n\nTurns of poison remaining: %s.
actors.buffs.preparation.name=preparation
actors.buffs.preparation.action_name=prepared strike
actors.buffs.preparation.desc=The Assassin is walking nervously, preparing to thurst knife into target.
actors.buffs.preparation.desc_dmg=His next attack will deal _%1$d%% bonus damage_, and will execute regular enemies below _%2$d%% health_, or bosses below _%3$d%% health_.
actors.buffs.preparation.desc_dmg_likely=The attack will also be more likely to deal a larger amount of damage.
actors.buffs.preparation.desc_blink=He is able to blink towards an enemy before striking them, with a max distance of _%d._
actors.buffs.preparation.desc_invis_time=The Assassin has been running for _%d turns._
actors.buffs.preparation.desc_invis_next=His attack will become stronger at _%d turns._
actors.buffs.preparation.prompt=Select a target to attack!\nMax blink distance: %d
actors.buffs.preparation.no_target=There's nothing to attack there.
actors.buffs.preparation.out_of_reach=That target is out of reach.
actors.buffs.preparation.assassinated=assassinated
actors.buffs.marked.name=Marked
actors.buffs.marked.desc=The Hunter is waiting patiently, preparing to strike while his bbat weakens enemies.
actors.buffs.marked.desc_dmg=The bbat deals %s%% more damage to this enemy. You will be able to jump to marked enemy at any moment, but more bonus damage means more debuffs.
actors.buffs.marked.prompt=Select a target to teleport!\nMax blink distance: your view distance
actors.buffs.marked.no_target=There's nothing to teleport there.
actors.buffs.marked.out_of_reach=That target is out of reach.
actors.buffs.marked.assassinated=assassinated
actors.buffs.marked.desc_poison=At this point, you will _poison_ a target, dealing damage over time.
actors.buffs.marked.desc_cripple=At this point, you will _cripple_ the legs of target, reducing its movement speed.
actors.buffs.marked.desc_blinding=At this point, you will also make target _blind_,reducing its field of view to 1 tile.
actors.buffs.marked.desc_bleeding=At this point, you will also make target _bleed_,dealing damage over time.
actors.buffs.marked.desc_vulnerable=At this point, you will also _increase physical damage_ to enemy.
actors.buffs.marked.desc_hexed=At this point, you will also stun target, _reducing its accuracy and dexterity_ for short time.
actors.buffs.marked.desc_slow=At this point, you will also disorientate target, _slowing_ its actions.
actors.buffs.marked.desc_ooze=At this point, you will also apply deadly _caustic ooze_ to target, dealing damage over time until target finds water.
actors.buffs.marked.desc_paralysis=At this point, you will completely _paralyse_ the enemy, rendering it unable to attack.
actors.buffs.marked.desc_doom=At this point, you will also curse the enemy, _significantly increasing any damage to it_.
actors.buffs.prismaticguard.name=prismatic Guard
actors.buffs.prismaticguard.desc=You are being guarded by a prismatic image which is currently inactive. When enemies are present the prismatic image will spring to action and protect you!\n\nWhile inactive, the prismatic image will steadily recover from any damage it has taken.\n\nCurrent HP: %d/%d.
actors.buffs.recharging.name=recharging
actors.buffs.recharging.desc=Energy is coursing through you, improving the rate that your wands and staffs charge.\n\nEach turn this buff will increase current charge by one quarter, in addition to regular recharge.\n\nTurns of recharging remaining: %s.
actors.buffs.revealedarea.name=revealed area
actors.buffs.revealedarea.desc=An area of the dungeon has been temporarily revealed to the hero, They will see it no matter where they are.\n\nTurns remaining: %s.
actors.buffs.revealedchar.name=revealed
actors.buffs.revealedchar.desc=This character is revealed to the hero, They will be visible no matter where they are.\n\nTurns remaining: %s.
actors.buffs.roots.name=rooted
actors.buffs.roots.heromsg=You can't move!
actors.buffs.roots.desc=Roots (magical or natural) grab at the feet, forcing them down to the ground.\n\nRoots lock a target in place, making movement and most movement abilities impossible. Other actions are not affected, including teleportation effects.\n\nTurns of root remaining: %s.
actors.buffs.scrollempower.name=scroll empower
actors.buffs.scrollempower.desc=The energy from the Mage's recently read scroll is empowering his wands!\n\nLevel Boost: +%1$d.\nZaps remaining: %2$d.
actors.buffs.shadows.name=shadowmelded
actors.buffs.shadows.desc=You are blended into the shadows around you, granting you invisibility and slowing your metabolism.\n\nWhile you are invisible enemies are unable to attack or follow you. Most physical attacks and magical effects (such as scrolls and wands) will immediately cancel invisibility. Additionally, while shadowmelded, your rate of hunger is slowed.\n\nYou will remain shadowmelded until you leave the shadows or an enemy comes into contact with you.
actors.buffs.slow.name=slowed
actors.buffs.slow.desc=Slowing magic affects the target's rate of time, to them everything is moving super-fast.\n\nA slowed character performs all actions in twice the amount of time they would normally take.\n\nTurns of slow remaining: %s.
actors.buffs.snipersmark.name=sniper's mark
actors.buffs.snipersmark.action_name_snapshot=snapshot
actors.buffs.snipersmark.action_name_volley=volley
actors.buffs.snipersmark.action_name_sniper=sniper shot
actors.buffs.snipersmark.desc=The Sniper is honed in on the target she most recently attacked. She is able to perform a special attack with her bow which will vary based on how the bow is augmented.\n\nAn unaugmented bow will fire a _snapshot,_ which deals reduced damage but does not take any time to fire.\n\nA bow augmented for speed will fire a _volley_ of three arrows. Each arrow will deal reduced damage, but can still activate enchantment. This volley takes 1 turn to shoot.\n\nA bow augmented for damage will fire a _sniper shot._ This shot is guaranteed to hit, deals bonus damage based on distance from the target, and takes 2 turns to fire.\n\nTurns remaining: %s.
actors.buffs.soulmark.name=soul marked
actors.buffs.soulmark.desc=The warlock has tapped into the soul of this creature, allowing him to heal as it takes physical damage.\n\nTurns of soul mark remaining: %s.
actors.buffs.stamina.name=stamina
actors.buffs.stamina.desc=You have unending stamina, allowing for faster movement!\n\nWhile under the effects of stamina you will run at +50%% speed, but will perform all other actions at normal speed.\n\nTurns of stamina remaining: %s.
actors.buffs.vulnerable.name=vulnerable
actors.buffs.vulnerable.heromsg=You feel fragile!
actors.buffs.vulnerable.desc=Vulnerability magic increases all physical damage that a character takes by 33%%, after that damage has been reduced by armor.\n\nTurns of vulnerable remaining: %s.
actors.buffs.terror.name=terrified
actors.buffs.terror.desc=Terror is manipulative magic which forces its target into an uncontrollable panic.\n\nTerrified characters are forced to run away from their opponent, trying to put as many doors and walls between them as possible. The shock of pain will lessen the duration of terror, however.\n\nTurns of terror remaining: %s.
actors.buffs.toxicimbue.name=imbued with toxicity
actors.buffs.toxicimbue.desc=You are imbued with poisonous energy!\n\nAs you move around toxic gas will constantly billow forth from you, damaging your enemies. You are immune to toxic gas and poison for the duration of the effect, as well as for a few turns afterward.\n\nTurns of toxic imbue remaining: %s.
actors.buffs.corrosion.name=corrosion
actors.buffs.corrosion.heromsg=You are melting!
actors.buffs.corrosion.ondeath=You melt away...
actors.buffs.corrosion.rankings_desc=Dissolved
actors.buffs.corrosion.desc=Powerful acid melts away flesh, metal, and bone at an alarming rate.\n\nCorrosion damage increases over time, as the target continues to melt away.\n\nTurns of corrosion remaining: %1$s.\nCurrent corrosion damage: %2$d.
actors.buffs.vertigo.name=vertigo
actors.buffs.vertigo.desc=Walking in a straight line can be difficult when the whole world is spinning.\n\nWhile under the effects of vertigo, characters who attempt to move will go in a random direction, instead of the one they intended to go in.\n\nTurns of vertigo remaining: %s.
actors.buffs.wandempower.name=wands empowered
actors.buffs.wandempower.desc=Your damage-dealing wands have been empowered, increasing the amount of damage they deal for a few hits.\n\nBonus damage: %1$d.\nHits remaining: %2$d.
actors.buffs.weakness.name=weakened
actors.buffs.weakness.heromsg=You feel weakened!
actors.buffs.weakness.desc=Everything suddenly seems much heavier.\n\nWeakening magic reduces a character's physical strength, causing them to deal 33%% reduced damage.\n\nTurns of weakness remaining: %s.
actors.buffs.wellfed.name=well fed
actors.buffs.wellfed.desc=You feel quite satisfied and full.\n\nWhile well fed, your hunger will not increase, and you will heal an additional amount of health over time.\n\nTurns remaining: %d.
actors.buffs.danceimmunebuff.name=immune to dance curse
actors.buffs.danceimmunebuff.desc=All dancing effects loses all its power for a short time, well extending the effect is not effective, you must wait for this effect to wear down before using the spell again.\n\nTurns of magic immunity remaining: %s.
actors.hero.abilities.armorability.self_target=You can't target yourself!
actors.hero.abilities.armorability.no_target=There's nothing to target there!
actors.hero.abilities.armorability.prompt=Choose a location to target
actors.hero.abilities.armorability.cost=Charge cost: _%d_
actors.hero.abilities.warrior.heroicleap.name=heroic leap
actors.hero.abilities.warrior.heroicleap.prompt=Choose direction to leap
actors.hero.abilities.warrior.heroicleap.short_desc=The Warrior performs a _Heroic Leap_ towards a targeted location, sailing above enemies and hazards.
actors.hero.abilities.warrior.heroicleap.desc=The Warrior leaps toward a targeted location, going over any enemies or hazards in the way. He cannot leap over walls or other solid terrain however.
actors.hero.abilities.warrior.shockwave.name=shockwave
actors.hero.abilities.warrior.shockwave.short_desc=The Warrior releases a _Shockwave_ in a conical AOE by slamming the ground. Enemies caught in the shockwave are damaged and crippled.
actors.hero.abilities.warrior.shockwave.desc=The Warrior slams the ground, producing a shockwave that travels up to 5 tiles in a 60 degree cone.\n\nEnemies caught in this shockwave are crippled for 5 turns. They also take 5-10 damage, plus an additional 1-2 damage for every point of strength the Warrior has above 10.
actors.hero.abilities.warrior.endure.name=endure
actors.hero.abilities.warrior.endure$enduretracker.name=endurance
actors.hero.abilities.warrior.endure$enduretracker.desc=The Warrior is now dealing bonus damage based on the damage he endured.\n\nBonus Damage: %1$d\nHits Left: %2$d
actors.hero.abilities.warrior.endure.short_desc=The Warrior _Endures_, skipping several turns but gaining high damage resistance. He then deals bonus damage based on what he endured.
actors.hero.abilities.warrior.endure.desc=The Warrior endures for 3 turns, taking half damage from all sources. This reduction is applied before damage resisting effects like armor.\n\nAfter enduring, the warrior's next hit within 10 turns gains bonus damage. This bonus damage is equal to half of all the damage inflicted on him while enduring, before any damage reduction effects!\n\nIf the Warrior has any combo, using this ability increases its remaining time by 3 turns.
actors.hero.abilities.mage.elementalblast.name=elemental blast
actors.hero.abilities.mage.elementalblast.no_staff=You can't use this ability without your staff.
actors.hero.abilities.mage.elementalblast.short_desc=The Mage emits an _Elemental Blast_ from his staff, covering a large area around him in an effect that varies based on the wand in his staff.
actors.hero.abilities.mage.elementalblast.desc=The Mage emits a blast of magic, which covers a circular region up to 4 tiles away and deals up to 15-25 damage. The specific effect of elemental blast will vary by the wand imbued in the Mage's staff.
actors.hero.abilities.mage.elementalblast.generic_desc=The effect of elemental blast will be similar to the effect of the wand when zapped at an enemy or ally.
actors.hero.abilities.mage.wildmagic.name=wild magic
actors.hero.abilities.mage.wildmagic.no_wands=You have no wands to zap with!
actors.hero.abilities.mage.wildmagic.short_desc=The Mage unleashes the _Wild Magic_ contained in his wands, randomly firing them multiple times at a chosen target over a single turn.
actors.hero.abilities.mage.wildmagic.desc=The Mage unleashes the power in his wands, randomly firing them up to 4 times in a single turn. The Mage's staff is not included in this effect.\n\nEach wand also has its level boosted by 2, up to +3. This ability uses half a wand charge for each zap, and no one wand can be fired more than 2 times.
actors.hero.abilities.mage.warpbeacon.name=warp beacon
actors.hero.abilities.mage.warpbeacon.depths=You can't warp between depths!
actors.hero.abilities.mage.warpbeacon.locked_floor=You cannot leave a locked floor!
actors.hero.abilities.mage.warpbeacon.too_far=That location is too far!
actors.hero.abilities.mage.warpbeacon.invalid_beacon=You can't place a beacon there!
actors.hero.abilities.mage.warpbeacon.window_desc=Your beacon is currently placed on floor %d.
actors.hero.abilities.mage.warpbeacon.window_tele=teleport to beacon
actors.hero.abilities.mage.warpbeacon.window_clear=clear beacon
actors.hero.abilities.mage.warpbeacon.window_cancel=cancel
actors.hero.abilities.mage.warpbeacon.short_desc=The Mage places a _Warping Beacon_ at his current location, which he can instantly teleport back to.
actors.hero.abilities.mage.warpbeacon.desc=The Mage places a beacon, which can then be warped to at will. Placing the beacon takes 1 turn, but warping to it is instantaneous.\n\nThe Mage cannot warp between floors by default, or use the beacon to reach inaccessible places such as locked rooms. The Mage can teleport into enemies, which will push them aside.
actors.hero.abilities.rogue.smokebomb.name=smoke bomb
actors.hero.abilities.rogue.smokebomb.fov=You can only jump to an empty location in your field of view
actors.hero.abilities.rogue.smokebomb.prompt=Choose a location to jump to
actors.hero.abilities.rogue.smokebomb$ninjalog.name=wooden decoy
actors.hero.abilities.rogue.smokebomb$ninjalog.desc=Somehow, enemies are easily convinced that this wooden decoy is the real Rogue!
actors.hero.abilities.rogue.smokebomb.short_desc=The Rogue throws down a _Smoke Bomb_ while blinking away. He blinds enemies near his old location.
actors.hero.abilities.rogue.smokebomb.desc=The Rogue throws down a smoke bomb and blinks up to 6 tiles away. He can blink through hazards and enemies, but not through solid terrain like walls.\n\nEnemies that are adjacent to the Rogue's old position will be blinded for 5 turns.
actors.hero.abilities.rogue.deathmark.name=death mark
actors.hero.abilities.rogue.deathmark.ally_target=You can only mark enemies
actors.hero.abilities.rogue.deathmark.short_desc=The Rogue places a _Death Mark_ on a chosen enemy. Marked enemies take bonus damage, but cannot die until the mark ends.
actors.hero.abilities.rogue.deathmark.desc=The Rogue places a mark on a chosen enemy, causing them to take 25% extra damage. The mark is applied instantly and lasts for 5 turns.\n\nMarked enemies take bonus damage but are unable to die until the mark expires. If an enemy has 0 HP when the mark ends, they will immediately die.
actors.hero.abilities.rogue.deathmark$deathmarktracker.name=marked for death
actors.hero.abilities.rogue.deathmark$deathmarktracker.desc=This enemy has been marked, causing them to take 25%% bonus damage, but also rendering them unable to die until the mark ends.\n\nTurns remaining: %s.
actors.hero.abilities.rogue.shadowclone.name=shadow clone
actors.hero.abilities.rogue.shadowclone.short_desc=The Rogue summons a _Shadow Clone_, which can be directed to aid him in combat.
actors.hero.abilities.rogue.shadowclone.desc=The Rogue summons a shadowy mimic of himself, which can be directed to aid him in combat. Directing the shadow clone does not cost any charge.\n\nThe clone has 80 HP, no armor, and deals 10-20 damage. All of these traits can be improved with talents, such that the clone benefits from weapons and armor the hero has.
actors.hero.abilities.rogue.shadowclone$shadowally.name=shadow rogue
actors.hero.abilities.rogue.shadowclone$shadowally.direct_defend=Your clone moves to that position.
actors.hero.abilities.rogue.shadowclone$shadowally.direct_follow=Your clone moves to follow you.
actors.hero.abilities.rogue.shadowclone$shadowally.direct_attack=Your clone moves to attack!
actors.hero.abilities.rogue.shadowclone$shadowally.desc=A copy of the Rogue, made from shadowy darkness. It stands stock still, with empty eyes and tiny wisps of darkness rising from it like steam.\n\nThe clone is not a perfect copy of the Rogue, but is still a decent fighter, and can benefit from the Rogue's equipment with the right talents.
actors.hero.abilities.huntress.spectralblades.name=spectral blades
actors.hero.abilities.huntress.spectralblades.short_desc=The Huntress throws _Spectral Blades_ at a target, inflicting damage depending on her currently equipped melee weapon.
actors.hero.abilities.huntress.spectralblades.desc=The Huntress throws out a spectral blade at an enemy, which acts like a ranged strike from her melee weapon. All of the normal effects of a melee weapon will activate, including enchantments.
actors.hero.abilities.huntress.naturespower.name=nature's power
actors.hero.abilities.huntress.naturespower.short_desc=The Huntress calls upon _Nature's Power_, increasing her movement speed and her bow's rate of fire for a short time.
actors.hero.abilities.huntress.naturespower.desc=The Huntress temporarily empowers herself and her bow with the power of nature! This lasts for 8 turns.\n\nDuring this time, the Huntress moves at 2x speed, and attacks 33% faster with her bow. The bonus bow effects do not trigger if the Sniper is using her special attacks.
actors.hero.abilities.huntress.naturespower$naturespowertracker.name=nature's power
actors.hero.abilities.huntress.naturespower$naturespowertracker.desc=The Huntress is briefly empowered, increasing her movement speed and attack speed with her bow.\n\nTurns remaining: %s.
actors.hero.abilities.huntress.spirithawk.name=spirit hawk
actors.hero.abilities.huntress.spirithawk.no_space=There is no free space near you.
actors.hero.abilities.huntress.spirithawk.short_desc=The Huntress summons a _Spirit Hawk_ familiar, which can help her scout locations and distract enemies.
actors.hero.abilities.huntress.spirithawk.desc=The Huntress summons a spirit hawk familiar, which can be directed by using the ability again while it is summoned. The hawk lasts for 100 turns, directing the hawk does not cost any charge.\n\nThe hawk has minimal health and attacking power, but is fast, evasive, and accurate. It shares its entire field of vision with the Huntress at all times. It is immune to all area-bound effects, such as fire and poison gas. It will not attack unless specifically directed to.
actors.hero.abilities.huntress.spirithawk$hawkally.name=spirit hawk
actors.hero.abilities.huntress.spirithawk$hawkally.direct_defend=Your hawk moves to that position.
actors.hero.abilities.huntress.spirithawk$hawkally.direct_follow=Your hawk moves to follow you.
actors.hero.abilities.huntress.spirithawk$hawkally.direct_attack=Your hawk moves to attack!
actors.hero.abilities.huntress.spirithawk$hawkally.desc=A magical hawk, summoned by the Huntress. It glows a bright ethereal blue, its head constantly shifts around as it surveys the area.\n\nWhile it isn't much of a fighter its speed and vision make it excellent for scouting and distracting enemies.
actors.hero.abilities.huntress.spirithawk$hawkally.desc_remaining=Turns remaining: %d.
actors.hero.abilities.huntress.spirithawk$hawkally.desc_dodges=Guaranteed dodges remaining: %d.
actors.hero.abilities.duelist.challenge.name=challenge
actors.hero.abilities.duelist.challenge.prompt=Choose an enemy to challenge
actors.hero.abilities.duelist.challenge.already_dueling=You can only be in one duel at a time.
actors.hero.abilities.duelist.challenge.ally_target=You can only challenge enemies.
actors.hero.abilities.duelist.challenge.unreachable_target=You must be able to reach your target.
actors.hero.abilities.duelist.challenge.distant_target=That enemy is too far away to challenge.
actors.hero.abilities.duelist.challenge.short_desc=The Duelist _Challenges_ a nearby enemy to a duel, temporarily freezing all other enemies.
actors.hero.abilities.duelist.challenge.desc=The Duelist challenges a nearby enemy to a duel. That enemy is compelled to fight her while all other enemies are temporarily frozen in time.\n\nThe target must be reachable and within 5 tiles of the Duelist. The duel lasts until 10 turns pass, the enemy dies, or the Duelist is more than 5 tiles away from the enemy.\n\nFrozen enemies are invulnerable. The Duelist's allies are not frozen by this ability, but if a boss is targeted its minions will not be frozen either.
actors.hero.abilities.duelist.challenge$duelparticipant.name=duel participant
actors.hero.abilities.duelist.challenge$duelparticipant.desc=This character is participating in a duel. They, and any of their allies or minions, are allowed to act normally while others are frozen.\n\nThe duel will last for a set amount of time, until one participant dies, or until the participants move more than 5 tiles away from eachother.\n\nTurns remaining: %d.
actors.hero.abilities.duelist.elementalstrike.name=elemental strike
actors.hero.abilities.duelist.elementalstrike.short_desc=The Duelist performs an _Elemental Strike_, spreading an effect in a conical AOE based on her weapon enchantment.
actors.hero.abilities.duelist.elementalstrike.desc=The Duelist strikes an enemy or location, performing a regular attack that's guaranteed to hit and spreading a magical effect that travels up to 4 tiles in a 65 degree cone. This magical effect varies based on the enchantment on the Duelist's primary weapon.
actors.hero.abilities.duelist.elementalstrike.generic_desc=An elemental strike with no enchantment will release a small burst of magic, dealing 6-12 damage to all enemies in range.
actors.hero.abilities.duelist.feint.name=feint
actors.hero.abilities.duelist.feint.prompt=Choose a location to dash to
actors.hero.abilities.duelist.feint.too_far=That location is not adjacent to you.
actors.hero.abilities.duelist.feint.bad_location=You can't move to that location.
actors.hero.abilities.duelist.feint.short_desc=The Duelist _Feints_, faking an attack while dashing to an adjacent tile. Enemies will attack her afterimage, leaving them open to a counterattack.
actors.hero.abilities.duelist.feint.desc=The Duelist fakes an attack while dashing to an adjacent tile, leaving behind a momentary afterimage of herself. Enemies that were attacking the Duelist will attack her afterimage instead.\n\nEnemies that attack the afterimage become confused, which cancels their next action and leaves them open to a surprise attack.
actors.hero.abilities.ratmogrify.name=ratmogrify
actors.hero.abilities.ratmogrify.cant_transform=You can't ratmogrify that!
actors.hero.abilities.ratmogrify.too_strong=That enemy is too strong to ratmogrify!
actors.hero.abilities.ratmogrify.short_desc=The hero _Ratmogrifies_ an enemy! This temporarily turns them into a rat with no abilities.
actors.hero.abilities.ratmogrify.desc=The hero transforms an enemy into a rat for 6 turns! Bosses, allies, and rats cannot be ratmogrified.\n\nRatmogrified enemies retain their original stats, but do not have any abilities.
actors.hero.abilities.ratmogrify$transmograt.name=ratmogrified %s
actors.hero.abilities.ratmogrify$transmograt.desc=This enemy has been transformed into a rat. A big improvement, if you ask me! - Rat King
actors.hero.abilities.ratmogrify$transmograt.rankings_desc=Slain by: ratmogrified enemy
actors.hero.abilities.ratking.legacywrath.name=divine fury
actors.hero.abilities.ratking.legacywrath.short_desc=I unleash my _Divine Fury_ upon my enemies. It leaves me exposed for a few turns and drains all my armor charge. Everything must come at price!
actors.hero.abilities.ratking.legacywrath.desc=I unlock the ability to channel overwhelming power. With it, I can blink to any nearby location no further than 6 tiles, blinding any enemies adjacent to my old location. Once there, I will cast a spell of magical earth on everyone I can see in 6 tiles area (the effect depends on talents) and create a fan of spectral blades targeting any mob within 6 tiles of me before turning invisible.\n\nThis ability takes 2 turns to leap, 1 turn to rooting earth, and one turn to spectral blades, though using this with no enemies in sight will skip the attacking.\n\nUnfortunately, _I have to use all of my armor charge or 33% of my current HP_ to get enough power for this ability.
actors.hero.hero.name=you
actors.hero.hero.leave=You can't leave yet, the rest of the dungeon awaits below!
actors.hero.hero.level_up=Level up!
actors.hero.hero.new_level=Level up! +Accuracy, +Evasion, +5 HP!
actors.hero.hero.new_talent=+1 Talent Point!
actors.hero.hero.unspent=You have unspent talent points!
actors.hero.hero.level_cap=You cannot grow stronger, but your experiences do give you a surge of power!
actors.hero.hero.you_now_have=you picked up: %s.
actors.hero.hero.you_cant_have=you can't carry: %s.
actors.hero.hero.locked_chest=This chest is locked and you don't have a matching key.
actors.hero.hero.locked_door=You don't have a matching key.
actors.hero.hero.noticed_smth=You noticed something.
actors.hero.hero.wait=...
actors.hero.hero.search=search
actors.hero.hero.search_distracted=It's hard to concentrate, searching is exhausting.
actors.hero.hero.pain_resist=The pain helps you resist the urge to sleep.
actors.hero.hero.revive=The ankh explodes with life-giving energy!
actors.hero.heroclass.warrior=warrior
actors.hero.heroclass.warrior_desc_short=The Warrior endures extra damage with shielding granted by his _broken seal._ The seal can be moved between armors and _transfers a single upgrade._
actors.hero.heroclass.warrior_desc=The Warrior starts with a _unique broken seal_ that generates shielding over his health. The seal can be moved between armors, and can _transfer a single upgrade_ with it.\n\nThe Warrior also starts with a _worn shortsword_, _three throwing stones_, cloth armor, a waterskin, and a velvet pouch.\n\nThe Warrior automatically identifies:\n_-_ Scrolls of Identify\n_-_ Potions of Healing\n_-_ Scrolls of Rage
actors.hero.heroclass.warrior_unlock=The Warrior is automatically unlocked.
actors.hero.heroclass.warrior_perk_desc=The Warrior gains _non-stackable 1 + (5% of current STR rounded down)_ temporary strength within _60 + (5 * current level) turns_ from eating and will be protected from taking any damage for duration of eating.\n\nThe Warrior can blind any enemy for _5 turns_ by throwing non-missiles at it. This ability has _40 turns_ cooldown.\n\nThe Warrior has _15%_ more strength, rounded down.\n\nThe Warrior can transfer any glyphs with his seal.\n\nThe Warrior regenerates his health and shielding _two times_ faster than usual.
actors.hero.heroclass.mage=mage
actors.hero.heroclass.mage_desc_short=The Mage is an arcane expert and carries a _magical staff_ that's stronger than a wand. The staff can be _imbued with any wand_ the Mage finds.
actors.hero.heroclass.mage_desc=The Mage starts with a _unique staff_, which recharges significantly faster than a wand and has 1 more charge. The staff _can be imbued with any wand_ the Mage finds in the dungeon.\n\nThe Mage also starts with a _wand of magic missile_ imbued in his staff, cloth armor, a waterskin, and a velvet pouch.\n\nThe Mage automatically identifies:\n_-_ Scrolls of Identify\n_-_ Potions of Liquid Flame\n_-_ Scrolls of Upgrade
actors.hero.heroclass.mage_unlock=To unlock the Mage _use a scroll of upgrade to make an item stronger._
actors.hero.heroclass.mage_perk_desc=The Mage gets _12 turns_ of recharging from eating.\n\nThe Mage instantly identifies any wands he picks up.\n\nThe Mage can self-target with a wand to convert all of its charges into shielding at a rate of _10.5% max HP per charge_.\n\nWhen the Mage zaps an enemy, he gains mind vision on them for _10 turns_.\n\nWhen the Mage reads a scroll, his next _3 wand zaps_ will get +(hero level/5) levels. He also has _33% chance_ to get scroll from the enemy.
actors.hero.heroclass.rogue=rogue
actors.hero.heroclass.rogue_desc_short=The Rogue can evade enemies and strike from invisibility using his _cloak of shadows._ He also _detects secrets and traps_ from a greater distance.
actors.hero.heroclass.rogue_desc=The Rogue starts with a _unique Cloak of Shadows_, which he can use to become invisible at will.\n\nThe Rogue can _detect secrets and traps_ from a greater distance.\n\nThe Rogue also starts with _a dagger_, _three throwing knives_, cloth armor, a waterskin, and a velvet pouch.\n\nThe Rogue automatically identifies:\n_-_ Scrolls of Identify\n_-_ Potions of Invisibility\n_-_ Scrolls of Magic Mapping
actors.hero.heroclass.rogue_unlock=To unlock the Rogue _perform 10 surprise attacks in one game._
actors.hero.heroclass.rogue_perk_desc=The Rogue will not wake sleeping enemies while he is _3 or more tiles away from them_.\n\nThe Rogue can search in _7x7_ area and will knock adjacent enemies away with chip damage while searching.\n\nThe Rogue can use Cloak of Shadows without equipping it but it will recharge at 66% speed.\n\nOn using Scroll of Upgrade, the Rogue will charge all his wands by _1_ charge and get _10 turns_ worth of artifact recharging.\n\nThe Rogue's bombs deal _150%_ more damage and drop from any enemy with 10% chance.
actors.hero.heroclass.huntress=huntress
actors.hero.heroclass.huntress_desc_short=The Huntress is a master of thrown weapons and has a _magical bow_ with infinite arrows. She also travels through tall grass _without trampling it._
actors.hero.heroclass.huntress_desc=The Huntress starts with a _unique spirit bow_, which can fire an infinite number of conjured arrows.\n\nThe Huntress can travel through tall grass _without trampling it_.\n\nThe Huntress also starts with _studded gloves_, cloth armor, a waterskin, and a velvet pouch.\n\nThe Huntress automatically identifies:\n_-_ Scrolls of Identify\n_-_ Potions of Mind Vision\n_-_ Scrolls of Lullaby
actors.hero.heroclass.huntress_unlock=To unlock the Huntress _hit enemies with thrown weapons 10 times in one game._
actors.hero.heroclass.huntress_perk_desc=The Huntress identifies equipment _3x_ faster.\n\nWhen the Huntress steps on short grass or embers, they spring up into tall grass which the Huntress immediately furrows. This has a _5 turn cooldown_. This talent will produce furrowed grass if passive regeneration effects are disabled or the hero has not gained exp in a long time.\n\nThe Huntress gains mind vision on any enemy within _3 tiles of her position_.\n\nThe Huntress gets _5 turns_ of adrenaline from eating.\n\nThe Huntress has 8% chance to get _1-3_ alchemical energy after killing the enemy.
actors.hero.heroclass.rat_king=rat king
actors.hero.heroclass.rat_king_desc_short=My short description is than I am awesome as king could possibly be!
actors.hero.heroclass.rat_king_desc=Why choose a class when I could just go as myself?\n\nAs myself, I take all the special class items I could find: an old seal, a staff made by some mage, a priceless cloak of shadows from my treasury, and a bow from my armory.\n\nI start with all my class items, obviously. Also I've already acquired all the bags, so I start with those too.\nI can also detect traps and secrets from a greater distance.\
actors.hero.heroclass.rat_king_perk_desc=What? I don't need any help! I am strong enough by myself!
actors.hero.heroclass.duelist=duelist
actors.hero.heroclass.duelist_desc_short=The Duelist is a weapons master who can use her weapon to trigger a _special weapon ability._ This special ability is _different for every weapon._
actors.hero.heroclass.duelist_desc=The Duelist starts with a _unique rapier_ with a special ability that recharges over time.\n\nEvery weapon in the game has a _different special ability_ that the Duelist can use.\n\nThe Duelist also starts with _two throwing spikes_, cloth armor, a waterskin, and a velvet pouch.\n\nThe Duelist automatically identifies:\n_-_ Scrolls of Identify\n_-_ Potions of Strength\n_-_ Scrolls of Mirror Image
actors.hero.heroclass.duelist_unlock=To unlock the Duelist _equip a tier 2 or higher weapon with no strength penalty._
actors.hero.heroclass.duelist_perk_desc=The Duelist gets _2 weapon charge_ and bonus melee damage equal to _level/2_ on eating.\n\nThe Duelist gains one weapon charge every _10 turns_ and deals _+8%_ melee damage when under the effect of wand or artifact recharging buffs.\n\nThe Duelist can switch her equipped weapon instantly _twice within 5 turns_, with a 20 turn cooldown.\nIf this ability is not on cooldown, quick-using an unequipped weapon will equip it.\n\nIf the Duelist's ability manages to kill any enemy, she will restore HP equal to _her level_.\n\nThe Duelist gets _+50%_ enchantment power for her attacks.
actors.hero.herosubclass.gladiator=gladiator
actors.hero.herosubclass.berserker=berserker
actors.hero.herosubclass.berserker_short_desc=The _Berserker_ builds rage as he takes damage. Rage increases his damage and can be activated at 100% for bonus shielding.
actors.hero.herosubclass.berserker_desc=The Berserker gains rage as he takes physical damage, including damage that gets blocked by his armor! Rage steadily fades away over time, but fades more slowly if he is at low HP.\n\nThe Berserker deals up to +50% damage at 100% rage. At 100% rage he can also go berserk, gaining 2-6x his seal's maximum shielding depending on his missing health and keeping his rage at 100% as long as he has shielding left. However, the Berserker needs time to recover after he goes berserk.\n\nHis rage will trigger enchantments and curses up to 60% more frequently and decay much slower.
actors.hero.herosubclass.gladiator_short_desc=The _Gladiator_ builds combo when he makes successful attacks. He can spend combo to use unique abilities.
actors.hero.herosubclass.gladiator_desc=The Gladiator builds one point of combo every time he makes a successful attack with a melee or thrown weapon. If the Gladiator does not make a successful attack within 5 turns, his combo is reset.\n\nAs combo builds it unlocks various abilities which he can spend his combo to use:\n2 Combo: knock enemy back, preserves combo; when combo is 7 or higher, knockback range increases to 3, it inflicts vertigo, and it can knock enemies into pits\n4 Combo: deal damage based on armor\n6 Combo: parry, preserves combo; when combo is 9 or higher, works on multiple attacks\n8 Combo: damage target and nearby enemies\n10 Combo: attack once for each combo\n\nWhen the Gladiator kills an enemy, the combo cooldown for his next hit is increased to _50 turns_.\n\nThe Gladiator can leap up to combo/3 tiles when using combo-spending attacks.
actors.hero.herosubclass.battlemage=battlemage
actors.hero.herosubclass.battlemage_short_desc=The _Battlemage_ conjures bonus effects when fighting in melee with his staff. These effects depend on the wand his staff is imbued with.
actors.hero.herosubclass.battlemage_desc=The Battlemage gains a bonus effect whenever he strikes in melee with his staff, as if his staff had an additional enchantment. These effects depend on the wand his staff is imbued with, every wand has its own effect. In addition to the wand effects, the Battlemage's staff will also gain 0.5 charges when he strikes with it.\n\nThe Battlemage's first melee strike with his staff after zapping with it deals double damage and staff's bonus effect gets +300% power.\n\nStriking with his staff grants the Battlemage _2 turns_ worth of artifact recharging.
actors.hero.herosubclass.warlock=warlock
actors.hero.herosubclass.warlock_short_desc=The _Warlock_ has a chance to soul mark enemies with his wands. He will heal whenever he deals physical damage to marked enemies.
actors.hero.herosubclass.warlock_desc=The Warlock has a chance to inflict a soul mark on characters when he uses wands on them. The chance to apply a soul mark and its duration increase with wand level.\n\nWhen an enemy is soul marked, the Warlock will heal 2 hp for every 5 damage he deals to them, but only with attacks from melee or thrown weapons, not from wands!\n\nWhen a soul marked enemy dies, the Warlock has a _50% chance_ to raise them as a corrupted wraith.\n\nSoul mark grants 1.5 turns of satiety for each physical damage dealt. Soul marked enemies have a 40% chance to trigger on-eat effects when they die.
actors.hero.herosubclass.assassin=hunter
actors.hero.herosubclass.assassin_short_desc=The _Hunter_ marks enemies with his bbat and inflicts debuffs with it.
actors.hero.herosubclass.assassin_desc=The _Hunter_ is trained to control darkness and use it to hunt targets with his bbat. His pet marks enemies and progressively does more damage. When any enemy is marked, the hunter can blink to it, inflicting debuffs and healing bbat depending on strength of mark.
actors.hero.herosubclass.freerunner=freerunner
actors.hero.herosubclass.freerunner_short_desc=The _Freerunner_ builds momentum as he runs, which can be used to start freerunning. This grants him bonus speed and evasion for a short while.
actors.hero.herosubclass.freerunner_desc=As the Freerunner moves he builds stacks of momentum. He can gain up to 10 momentum after running for 10 turns, but rapidly loses it if he stops moving. The freerunner can use up his momentum to start freerunning, for 2 turns per point of momentum.\n\nWhen freerunning the Freerunner moves at 2x speed, and gains bonus evasion in proportion to his level. Once freerunning ends there is a cooldown before momentum can be built again.\n\nWhile freerunning, the Freerunner gains 2x accuracy and +50% damage with thrown weapons.\n\nThe Freerunner moves at 2x speed while invisible, regardless of whether he is freerunning or not.
actors.hero.herosubclass.sniper=sniper
actors.hero.herosubclass.sniper_short_desc=The _Sniper_ can pierce armor with her ranged attacks. After striking with a thrown weapon she can follow up with a special attack from her bow.
actors.hero.herosubclass.sniper_desc=The Sniper is a master of ranged combat, whose ranged attacks pierce enemy armor. When she attacks an enemy with a thrown weapon, she places a sniper's mark on them, which lets her follow up with a special attack from her bow. This special attack varies based on how her bow is augmented.\n\nAn unaugmented bow will fire a snapshot which deals reduced damage but fires instantly. A speed bow will fire a volley of three arrows which deal reduced damage, can still activate enchantments, and take 1 turn to fire. A damage bow will fire a sniper shot which is guaranteed to hit, deals bonus damage based on distance, and takes 2 turns to fire.\n\nThrown weapons have a 100% chance to use the enchantment on the Sniper's bow.\nThis ability does not apply to darts shot from an enchanted crossbow, they already trigger the crossbow's enchantment.\n\nWhen the Sniper attacks with an upgraded thrown weapon, each level increases the duration of sniper's mark by 1 turn and the damage of her special attack by _33%_.
actors.hero.herosubclass.warden=warden
actors.hero.herosubclass.warden_short_desc=The _Warden_ can see through tall grass and gains bonus effects when she plants seeds and tramples plants.
actors.hero.herosubclass.warden_desc=The Warden has a strong connection to nature which grants her a variety of bonus effects relating to grass and plants. She is able to see through tall and furrowed grass as if it were empty space.\n\nThe Warden causes grass to sprout up around any seed she throws or plants, and gains special effects when trampling plants. These special effects replace the regular plant effects, meaning that no plant is harmful for her to step on.\n\nDewdrops can shield the Warden when her health is full, up to _100% of her max HP_.\n\nTipped darts have _5x durability_ when the Warden uses them.
actors.hero.herosubclass.king=rat king
actors.hero.herosubclass.king_short_desc=Choosing is so boring, I'd rather just pick _all the subclasses_...
actors.hero.herosubclass.king_desc=Rat King can use all subclasses at once!\n\nNot all perks are transferred to Rat King's subclass powers.
actors.hero.herosubclass.champion=champion
actors.hero.herosubclass.champion_short_desc=The _Champion_ can wield two weapons and gets more weapon charges. Her regular attacks use her primary weapon, but she can swap weapons and use either weapon's ability.
actors.hero.herosubclass.champion_desc=The Champion is a master of melee weapons who can equip a secondary weapon in addition to her primary one. Her regular attacks use her primary weapon, but she can swap her primary weapon instantly and use either weapon's ability.\n\nShe also gains 2 more max weapon ability charges and +50% weapon ability recharge speed.\n\nIf one of the Champion's two equipped weapons has a lower level and is _the same tier or lower_ than the other weapon, it will be boosted to the other weapon's level.\n\nIf the Champion uses two different weapon abilities successively, the second ability will execute any non-boss enemy left at _below 35% HP_.\n\nThe Champion instantly regains _1 weapon charge_ when she uses two different weapon abilities, with no time limit.
actors.hero.herosubclass.monk=monk
actors.hero.herosubclass.monk_short_desc=The _Monk_ builds energy while fighting. This energy can be spent on a variety of unique abilities.
actors.hero.herosubclass.monk_desc=The Monk is a master of physical technique. As she defeats enemies, she gains energy which can be used on a variety of defensive and utility-focused abilities. This energy does not fade over time, but has a cap based on the Monk's level.\n\n1 Energy: quickly strike with fists\n2 Energy: focus to dodge next attack\n3 Energy: instantly dash nearby\n4 Energy: kick an enemy away\n5 Energy: meditate to restore charges\n\nThe Monk gains _25% more energy_ for each piece of _natural tier 3_ equipment she is using.\nThe Monk gains _50% more energy_ for each piece of _natural tier 2_ equipment she is using.\nThe Monk gains _100%_ for each piece of _natural tier 1_ equipment she is using. She also gains _150% more energy_ if she has no weapon (or ring of force), and gains a free cloth armor and studded gloves.\n\nIf the Monk uses a weapon ability and a _2+ energy_ ability successively, she regains 50% of her spent energy and resets her ability cooldown.\n\nIf the Monk has _70% or more energy_, her abilities are empowered. When empowered:\n- Flurry applies enchantments at 75% power\n- Focus is instantaneous\n- Dash gains +2 range\n- Dragon Kick deals +33% damage and applies its knock back and stun effect to all adjacent enemies\n- Meditate slowly heals 20% of missing HP and grants 80% damage resistance.
actors.hero.talent$provokedangertracker.name=provoked anger
actors.hero.talent$provokedangertracker.desc=The Warrior has recently lost his shielding, his next physical attack will deal bonus damage.\n\nTurns remaining: %s.
actors.hero.talent$lingeringmagictracker.name=lingering magic
actors.hero.talent$lingeringmagictracker.desc=The Mage has recently used a staff or wand, his next physical attack will deal bonus damage.\n\nTurns remaining: %s.
actors.hero.talent$followupstriketracker.name=followup strike
actors.hero.talent$followupstriketracker.desc=The Huntress has recently attacked an enemy with a thrown weapon, her next melee attack against the same target will have boosted damage.\n\nTurns remaining: %s.
actors.hero.talent$patientstriketracker.name=patient strike
actors.hero.talent$patientstriketracker.desc=The Duelist has just spent a turn waiting, her next melee attack will deal bonus damage.
actors.hero.talent$improvisedprojectilecooldown.name=improvised projectiles cooldown
actors.hero.talent$improvisedprojectilecooldown.desc=You have recently used this talent, and must wait before using it again.\n\nTurns remaining: %s.
actors.hero.talent$rejuvenatingstepscooldown.name=rejuvenating steps cooldown
actors.hero.talent$rejuvenatingstepscooldown.desc=You have recently used this talent, and must wait before using it again.\n\nTurns remaining: %s.
actors.hero.talent$seershotcooldown.name=seer shot cooldown
actors.hero.talent$seershotcooldown.desc=You have recently used this talent, and must wait before using it again.\n\nTurns remaining: %s.
actors.hero.talent$aggressivebarriercooldown.name=aggressive barrier cooldown
actors.hero.talent$aggressivebarriercooldown.desc=You have recently used this talent, and must wait before using it again.\n\nTurns remaining: %s.
actors.hero.talent$liquidagilacctracker.name=liquid agility
actors.hero.talent$liquidagilacctracker.desc=The Duelist's next regular melee attack will gain bonus accuracy.\n\nTurns remaining: %s.
actors.hero.talent$lethalhastecooldown.name=lethal haste cooldown
actors.hero.talent$lethalhastecooldown.desc=You have recently used this talent, and must wait before using it again.\n\nTurns remaining: %s.
actors.hero.talent$swiftequipcooldown.name=swift equip cooldown
actors.hero.talent$swiftequipcooldown.desc=You have recently used this talent, and must wait before using it again.\n\nTurns remaining: %s.
actors.hero.talent$preciseassaulttracker.name=precise assault
actors.hero.talent$preciseassaulttracker.desc=The Duelist's next regular melee attack will gain bonus accuracy.\n\nTurns remaining: %s.
actors.hero.talent$deadlyfollowuptracker.name=deadly followup
actors.hero.talent$deadlyfollowuptracker.desc=The Duelist has recently attacked an enemy with a thrown weapon, her melee attacks against the same target will have boosted damage.\n\nTurns remaining: %s.
actors.hero.talent$combinedlethalityabilitytracker.executed=executed
actors.hero.talent.hearty_meal.title=hearty meal
actors.hero.talent.hearty_meal.desc=_+1:_ Eating food heals the Warrior for _3 HP_ when he is at or below 30% health.\n\n_+2:_ Eating food heals the Warrior for _5 HP_ when he is at or below 30% health.
actors.hero.talent.veterans_intuition.title=veteran's intuition
actors.hero.talent.veterans_intuition.desc=_+1:_ The Warrior identifies weapons _1.75x faster_ and armor _2.5x faster_.\n\n_+2:_ The Warrior identifies weapons _2.5x faster_ and armor _when he equips it_.
actors.hero.talent.provoked_anger.title=provoked anger
actors.hero.talent.provoked_anger.desc=_+1:_ When the Warrior's shielding breaks, his next physical attack will deal _2 bonus damage_.\n\n_+2:_ When the Warrior's shielding breaks, his next physical attack will deal _3 bonus damage_.
actors.hero.talent.iron_will.title=iron will
actors.hero.talent.iron_will.desc=_+1:_ The max shield provided by the Warrior's seal is _increased by 1_.\n\n_+2:_ The max shield provided by the Warrior's seal is _increased by 2_.
actors.hero.talent.iron_will.meta_desc=_If this talent is gained by a different hero_ it will grant its shielding benefit without the broken seal.
actors.hero.talent.iron_stomach.title=iron stomach
actors.hero.talent.iron_stomach.desc=_+1:_ Eating food takes the Warrior 1 turn and grants him _75% damage resistance_ while eating.\n\n_+2:_ Eating food takes the Warrior 1 turn and grants him _100% damage resistance_ while eating.
actors.hero.talent.liquid_willpower.title=liquid willpower
actors.hero.talent.liquid_willpower.desc=_+1:_ The Warrior instantly regains _50% of the shielding_ from his broken seal when drinking or throwing a potion, brew, or elixir.\n\n_+2:_ The Warrior instantly regains _75% of the shielding_ from his broken seal when drinking or throwing a potion, brew, or elixir.\n\nThe shield regeneration effect is doubled when using potions of strength, experience, or alchemy items that must be crafted using those potions.\n\nFor alchemy items with higher output quantities (e.g. aqua brew), this talent has a chance to trigger based on how many of that item is produced.
actors.hero.talent.liquid_willpower.meta_desc=_If this talent is gained by a different hero_ it will instead grant shielding equal to 5% max hp at +1, or 7.5% max hp at +2.
actors.hero.talent.runic_transference.title=runic transference
actors.hero.talent.runic_transference.desc=_+1:_ The Warrior's broken seal can transfer _regular glyphs_ in the same way it transfers an upgrade.\n\n_+2:_ The Warrior's broken seal can transfer _regular, powerful, and curse glyphs_ in the same way it transfers an upgrade.\n\nThe seal can only transfer glyphs if they were applied to the armor when the seal was attached.
actors.hero.talent.runic_transference.meta_desc=_If this talent is gained by a different hero_ it will instead help glyphs on your armor resist being removed by scrolls of upgrade. Glyphs will begin to be lost when upgrading from level 6(up from 4) at +1, or level 7(up from 4) at +2. The level where glyphs are guaranteed to be lost is unchanged at +8.
actors.hero.talent.lethal_momentum.title=lethal momentum
actors.hero.talent.lethal_momentum.desc=_+1:_ When the Warrior lands a killing blow on an enemy with a physical weapon, it has a _67% chance_ to take 0 turns.\n\n_+2:_ When the Warrior lands a killing blow on an enemy with a physical weapon, it has a _100% chance_ to take 0 turns.
actors.hero.talent.improvised_projectiles.title=improvised projectiles
actors.hero.talent.improvised_projectiles.desc=_+1:_ The Warrior can blind an enemy for _2 turns_ by throwing any item that isn’t a thrown weapon at them. This has a 50 turn cooldown.\n\n_+2:_ The Warrior can blind an enemy for _3 turns_ by throwing any item that isn’t a thrown weapon at them. This has a 50 turn cooldown.
actors.hero.talent.hold_fast.title=hold fast
actors.hero.talent.hold_fast.desc=_+1:_ When the Warrior waits he gains _1-2 armor_ until he moves.\n\n_+2:_ When the Warrior waits he gains _2-4 armor_ until he moves.\n\n_+3:_ When the Warrior waits he gains _3-6 armor_ until he moves.
actors.hero.talent.strongman.title=strongman
actors.hero.talent.strongman.desc=_+1:_ The Warrior's strength is _increased by 8%_, rounded down.\n\n_+2:_ The Warrior's strength is _increased by 13%_, rounded down.\n\n_+3:_ The Warrior's strength is _increased by 18%_, rounded down.
actors.hero.talent.endless_rage.title=endless rage
actors.hero.talent.endless_rage.desc=_+1:_ The Berserker can reach a max of _116% rage_.\n\n_+2:_ The Berserker can reach a max of _133% rage_.\n\n_+3:_ The Berserker can reach a max of _150% rage_.\n\nEach point of rage above 100% increases berserk shielding by 1% and reduces cooldown by 1%, but does not increase the damage bonus beyond +50%.
actors.hero.talent.deathless_fury.title=deathless fury
actors.hero.talent.deathless_fury.desc=_+1:_ Berserk automatically triggers if the Berserker is about to die and rage is at or above 100%, but it has a cooldown of _3 hero levels_ when this happens.\n\n_+2:_ Berserk automatically triggers if the Berserker is about to die and rage is at or above 100%, but it has a cooldown of _2 hero levels_ when this happens.\n\n_+3:_ Berserk automatically triggers if the Berserker is about to die and rage is at or above 100%, but it has a cooldown of _1 hero level_ when this happens.\n\nNote that the Berserker will still die if he has 0 HP when berserking ends.
actors.hero.talent.enraged_catalyst.title=enraged catalyst
actors.hero.talent.enraged_catalyst.desc=_+1:_ Enchantments and curses on the Berserker's weapon trigger more often the more rage he has, to a maximum of _15% more often_ at 100% rage.\n\n_+2:_ Enchantments and curses on the Berserker's weapon trigger more often the more rage he has, to a maximum of _30% more often_ at 100% rage.\n\n_+3:_ Enchantments and curses on the Berserker's weapon trigger more often the more rage he has, to a maximum of _45% more often_ at 100% rage.
actors.hero.talent.cleave.title=cleave
actors.hero.talent.cleave.desc=_+1:_ When the Gladiator kills an enemy, the combo cooldown for his next hit is increased to _15 turns_.\n\n_+2:_ When the Gladiator kills an enemy, the combo cooldown for his next hit is increased to _30 turns_.\n\n_+3:_ When the Gladiator kills an enemy, the combo cooldown for his next hit is increased to _45 turns_.
actors.hero.talent.lethal_defense.title=lethal defense
actors.hero.talent.lethal_defense.desc=_+1:_ When the Gladiator kills an enemy with a combo move, he _regains 33%_ of the broken seal's shielding.\n\n_+2:_ When the Gladiator kills an enemy with a combo move, he _regains 67%_ of the broken seal's shielding.\n\n_+3:_ When the Gladiator kills an enemy with a combo move, he _regains 100%_ of the broken seal's shielding.
actors.hero.talent.enhanced_combo.title=enhanced combo
actors.hero.talent.enhanced_combo.desc=_+1:_ When the Gladiator's combo is 7 or higher, Clobber's knockback range increases to 3, it inflicts vertigo, and it can knock enemies into pits.\n\n_+2:_ In addition to the benefits of +1, when the Gladiator's combo is 9 or higher Parry works on multiple attacks.\n\n_+3:_ In addition to the benefits of +1 and +2, the Gladiator can leap up to combo/3 tiles when using Slam, Crush, or Fury.
actors.hero.talent.body_slam.title=body slam
actors.hero.talent.body_slam.desc=_+1:_ When the Warrior lands after jumping, all adjacent enemies take damage equal to _1-4 plus 25%_ of his damage blocking power.\n\n_+2:_ When the Warrior lands after jumping, all adjacent enemies take damage equal to _2-8 plus 50%_ of his damage blocking power.\n\n_+3:_ When the Warrior lands after jumping, all adjacent enemies take damage equal to _3-12 plus 75%_ of his damage blocking power.\n\n_+4:_ When the Warrior lands after jumping, all adjacent enemies take damage equal to _4-16 plus 100%_ of his damage blocking power.
actors.hero.talent.impact_wave.title=impact wave
actors.hero.talent.impact_wave.desc=_+1:_ When the Warrior lands after jumping, all adjacent enemies are knocked _2 tiles_ back and have a _25% chance_ of becoming vulnerable for 5 turns.\n\n_+2:_ When the Warrior lands after jumping, all adjacent enemies are knocked _3 tiles_ back and have a _50% chance_ of becoming vulnerable for 5 turns.\n\n_+3:_ When the Warrior lands after jumping, all adjacent enemies are knocked _4 tiles_ back and have a _75% chance_ of becoming vulnerable for 5 turns.\n\n_+4:_ When the Warrior lands after jumping, all adjacent enemies are knocked _5 tiles_ back and have a _100% chance_ of becoming vulnerable for 5 turns.
actors.hero.talent.double_jump.title=double jump
actors.hero.talent.double_jump.desc=_+1:_ If the Warrior performs a second leap within 3 turns, that leap has a _16% reduced_ charge cost.\n\n_+2:_ If the Warrior performs a second leap within 3 turns, that leap has a _30% reduced_ charge cost.\n\n_+3:_ If the Warrior performs a second leap within 3 turns, that leap has a _40% reduced_ charge cost.\n\n_+4:_ If the Warrior performs a second leap within 3 turns, that leap has a _50% reduced_ charge cost.
actors.hero.talent.expanding_wave.title=expanding wave
actors.hero.talent.expanding_wave.desc=_+1:_ Shockwave's range is increased to _6 tiles_ from 5, and its width is increased to _75 degrees_ from 60.\n\n_+2:_ Shockwave's range is increased to _7 tiles_ from 5, and its width is increased to _90 degrees_ from 60.\n\n_+3:_ Shockwave's range is increased to _8 tiles_ from 5, and its width is increased to _105 degrees_ from 60.\n\n_+4:_ Shockwave's range is increased to _9 tiles_ from 5, and its width is increased to _120 degrees_ from 60.
actors.hero.talent.striking_wave.title=striking wave
actors.hero.talent.striking_wave.desc=_+1:_ Shockwave has a _30% chance_ to also use on-hit effects like enchantments and combo.\n\n_+2:_ Shockwave has a _60% chance_ to also use on-hit effects like enchantments and combo.\n\n_+3:_ Shockwave has a _90% chance_ to also use on-hit effects like enchantments and combo.\n\n_+4:_ Shockwave has a _100% chance_ to also use on-hit effects like enchantments and combo, and it gives enchantments _+20% power_.
actors.hero.talent.shock_force.title=shock force
actors.hero.talent.shock_force.desc=_+1:_ Shockwave deals _20% more damage_ and has a _25% chance_ to stun instead of cripple.\n\n_+2:_ Shockwave deals _40% more damage_ and has a _50% chance_ to stun instead of cripple.\n\n_+3:_ Shockwave deals _60% more damage_ and has a _75% chance_ to stun instead of cripple.\n\n_+4:_ Shockwave deals _80% more damage_ and has a _100% chance_ to stun instead of cripple.
actors.hero.talent.sustained_retribution.title=sustained retribution
actors.hero.talent.sustained_retribution.desc=_+1:_ The Warrior deals _115% bonus damage_ spread over _2 hits_, instead of 100% bonus damage in 1 hit.\n\n_+2:_ The Warrior deals _130% bonus damage_ spread over _3 hits_, instead of 100% bonus damage in 1 hit.\n\n_+3:_ The Warrior deals _145% bonus damage_ spread over _4 hits_, instead of 100% bonus damage in 1 hit.\n\n_+4:_ The Warrior deals _160% bonus damage_ spread over _5 hits_, instead of 100% bonus damage in 1 hit.
actors.hero.talent.shrug_it_off.title=shrug it off
actors.hero.talent.shrug_it_off.desc=_+1:_ The Warrior's damage reduction while enduring is _increased to 60%_, from 50%.\n\n_+2:_ The Warrior's damage reduction while enduring is _increased to 68%_, from 50%.\n\n_+3:_ The Warrior's damage reduction while enduring is _increased to 74%_, from 50%.\n\n_+4:_ The Warrior's damage reduction while enduring is _increased to 80%_, from 50%.
actors.hero.talent.even_the_odds.title=even the odds
actors.hero.talent.even_the_odds.desc=_+1:_ The Warrior deals an additional _5% bonus damage_ for every enemy within 2 tiles when enduring ends.\n\n_+2:_ The Warrior deals an additional _10% bonus damage_ for every enemy within 2 tiles when enduring ends.\n\n_+3:_ The Warrior deals an additional _15% bonus damage_ for every enemy within 2 tiles when enduring ends.\n\n_+4:_ The Warrior deals an additional _20% bonus damage_ for every enemy within 2 tiles when enduring ends.
actors.hero.talent.empowering_meal.title=empowering meal
actors.hero.talent.empowering_meal.desc=_+1:_ Eating food grants the Mage _2 bonus damage_ on the next 3 times he deals damage with a wand.\n\n_+2:_ Eating food grants the Mage _3 bonus damage_ on the next 3 times he deals damage with a wand.
actors.hero.talent.scholars_intuition.title=scholar's intuition
actors.hero.talent.scholars_intuition.desc=_+1:_ The Mage identifies wands _3x faster_.\n\n_+2:_ The Mage identifies wands _when he uses them_.
actors.hero.talent.lingering_magic.title=lingering magic
actors.hero.talent.lingering_magic.desc=_+1:_ When the Mage zaps with a wand or staff, his next physical attack deals _1-2 bonus damage_.\n\n_+2:_ When the Mage zaps with a wand or staff, his next physical attack deals _2 bonus damage_.
actors.hero.talent.backup_barrier.title=backup barrier
actors.hero.talent.backup_barrier.desc=_+1:_ The Mage gains _3 shielding_ whenever he spends the last charge in his staff.\n\n_+2:_ The Mage gains _5 shielding_ whenever he spends the last charge in his staff.
actors.hero.talent.backup_barrier.meta_desc=_If this talent is gained by a different hero_ it will instead trigger from the hero's highest level wand.
actors.hero.talent.energizing_meal.title=energizing meal
actors.hero.talent.energizing_meal.desc=_+1:_ Eating food takes the Mage 1 turn and grants him _5 turns of wand recharging_.\n\n_+2:_ Eating food takes the Mage 1 turn and grants him _8 turns of wand recharging_.
actors.hero.talent.inscribed_power.title=inscribed power
actors.hero.talent.inscribed_power.desc=_+1:_ When the Mage reads a scroll or uses a spell item, his _next 2 wand zaps_ get +2 levels.\n\n_+2:_ When the Mage reads a scroll or uses a spell item, his _next 3 wand zaps_ get +2 levels.\n\nThe number of enhanced wand zaps is doubled when using a scroll of upgrade, transmutation, or alchemy items that must be crafted using those scrolls.\n\nFor alchemy items with higher output quantities (e.g. most spells), this talent has a chance to trigger based on how many of that item is produced.
actors.hero.talent.wand_preservation.title=wand preservation
actors.hero.talent.wand_preservation.desc=_+1:_ When the Mage imbues a new wand into his staff, the old wand is returned at +0, _but this can only be done once._\n\n_+2:_ When the Mage imbues a new wand into his staff, the old wand is returned at +0, _this can be done once per hero level._
actors.hero.talent.wand_preservation.meta_desc=_If this talent is gained by a different hero_ it will instead increase the amount of arcane resin gained when putting a wand into an alchemy pot by 1 at +1, or by 2 at +2.
actors.hero.talent.arcane_vision.title=arcane vision
actors.hero.talent.arcane_vision.desc=_+1:_ When the Mage zaps an enemy, he gains mind vision on them for _10 turns_.\n\n_+2:_ When the Mage zaps an enemy, he gains mind vision on them for _15 turns_.
actors.hero.talent.shield_battery.title=shield battery
actors.hero.talent.shield_battery.desc=_+1:_ The Mage can self-target with a wand to convert all of its charges into shielding at a rate of _4% max HP per charge_.\n\n_+2:_ The Mage can self-target with a wand to convert all of its charges into shielding at a rate of _6% max HP per charge_.
actors.hero.talent.desperate_power.title=desperate power
actors.hero.talent.desperate_power.desc=_+1:_ The Mage's wands and staff gain _+1 level_ on their final zap when they are down to their last charge.\n\n_+2:_ The Mage's wands and staff gain _+2 levels_ on their final zap when they are down to their last charge.\n\n_+3:_ The Mage's wands and staff gain _+3 levels_ on their final zap when they are down to their last charge.
actors.hero.talent.ally_warp.title=ally warp
actors.hero.talent.ally_warp.desc=_+1:_ The Mage can select an ally to instantly swap places with them, with a _2 tile range_.\n\n_+2:_ The Mage can select an ally to instantly swap places with them, with a _4 tile range_.\n\n_+3:_ The Mage can select an ally to instantly swap places with them, with a _6 tile range_.\n\nThe Mage cannot swap places with immobile allies.
actors.hero.talent.empowered_strike.title=empowered strike
actors.hero.talent.empowered_strike.desc=_+1:_ The Battlemage's first melee strike with his staff after zapping with it deals _+16% damage_ and the staff's bonus effect gets _+50% power_.\n\n_+2:_ The Battlemage's first melee strike with his staff after zapping with it deals _+33% damage_ and the staff's bonus effect gets _+100% power_.\n\n_+3:_ The Battlemage's first melee strike with his staff after zapping with it deals _+50% damage_ and the staff's bonus effect gets _+150% power_.
actors.hero.talent.mystical_charge.title=mystical charge
actors.hero.talent.mystical_charge.desc=_+1:_ Striking with his staff grants the Battlemage _0.5 turns_ worth of artifact recharging.\n\n_+2:_ Striking with his staff grants the Battlemage _1 turn_ worth of artifact recharging.\n\n_+3:_ Striking with his staff grants the Battlemage _1.5 turns_ worth of artifact recharging.
actors.hero.talent.excess_charge.title=excess charge
actors.hero.talent.excess_charge.desc=_+1:_ When the Battlemage's staff is fully charged, its next zap will grant him _0.67 shielding_ per level of the staff.\n\n_+2:_ When the Battlemage's staff is fully charged, its next zap will grant him _1.33 shielding_ per level of the staff.\n\n_+3:_ When the Battlemage's staff is fully charged, its next zap will grant him _2 shielding_ per level of the staff.
actors.hero.talent.soul_siphon.title=soul siphon
actors.hero.talent.soul_siphon.desc=_+1:_ Physical damage dealt by other characters triggers the Warlock's soul mark at _13% effectiveness_.\n\n_+2:_ Physical damage dealt by other characters triggers the Warlock's soul mark at _27% effectiveness_.\n\n_+3:_ Physical damage dealt by other characters triggers the Warlock's soul mark at _40% effectiveness_.
actors.hero.talent.soul_eater.title=soul eater
actors.hero.talent.soul_eater.desc=_+1:_ Soul mark grants _0.33 turns_ of satiety for each physical damage dealt. Soul marked enemies have a _10% chance_ to trigger on-eat effects when they die.\n\n_+2:_ Soul mark grants _0.67 turns_ of satiety for each physical damage dealt. Soul marked enemies have a _20% chance_ to trigger on-eat effects when they die.\n\n_+3:_ Soul mark grants _1 turn_ of satiety for each physical damage dealt. Soul marked enemies have a _30% chance_ to trigger on-eat effects when they die.
actors.hero.talent.necromancers_minions.title=necromancer's minions
actors.hero.talent.necromancers_minions.desc=_+1:_ When a soul marked enemy dies, the Warlock has a _13% chance_ to raise them as a corrupted wraith.\n\n_+2:_ When a soul marked enemy dies, the Warlock has a _27% chance_ to raise them as a corrupted wraith.\n\n_+3:_ When a soul marked enemy dies, the Warlock has a _40% chance_ to raise them as a corrupted wraith.
actors.hero.talent.blast_radius.title=blast radius
actors.hero.talent.blast_radius.desc=_+1:_ Elemental blast's radius is increased to _5 tiles_, from 4.\n\n_+2:_ Elemental blast's radius is increased to _6 tiles_, from 4.\n\n_+3:_ Elemental blast's radius is increased to _7 tiles_, from 4.\n\n_+4:_ Elemental blast's radius is increased to _8 tiles_, from 4.
actors.hero.talent.elemental_power.title=elemental power
actors.hero.talent.elemental_power.desc=_+1:_ The power of elemental blast is increased by _25%_.\n\n_+2:_ The power of elemental blast is increased by _50%_.\n\n_+3:_ The power of elemental blast is increased by _75%_.\n\n_+4:_ The power of elemental blast is increased by _100%_.
actors.hero.talent.reactive_barrier.title=reactive barrier
actors.hero.talent.reactive_barrier.desc=_+1:_ The Mage gains _2.5 shielding_ for every character affected by elemental blast, to a max of 5 characters.\n\n_+2:_ The Mage gains _5 shielding_ for every character affected by elemental blast, to a max of 6 characters.\n\n_+3:_ The Mage gains _7.5 shielding_ for every character affected by elemental blast, to a max of 7 characters.\n\n_+4:_ The Mage gains _10 shielding_ for every character affected by elemental blast, to a max of 8 characters.
actors.hero.talent.wild_power.title=wild power
actors.hero.talent.wild_power.desc=_+1:_ When using wild magic, wands will be boosted by either _2 or 3, up to +4_.\n\n_+2:_ When using wild magic, wands will be boosted by _3, up to +5_.\n\n_+3:_ When using wild magic, wands will be boosted by either _3 or 4, up to +6_.\n\n_+4:_ When using wild magic, wands will be boosted by _4, up to +7_.
actors.hero.talent.fire_everything.title=fire everything
actors.hero.talent.fire_everything.desc=_+1:_ Wild magic now fires _5 times_ up from 4, and each wand has a _25% chance_ to be usable 3 times.\n\n_+2:_ Wild magic now fires _6 times_ up from 4, and each wand has a _50% chance_ to be usable 3 times.\n\n_+3:_ Wild magic now fires _7 times_ up from 4, and each wand has a _75% chance_ to be usable 3 times.\n\n_+4:_ Wild magic now fires _8 times_ up from 4, and each wand has a _100% chance_ to be usable 3 times.
actors.hero.talent.conserved_magic.title=conserved magic
actors.hero.talent.conserved_magic.desc=_+1:_ Each zap from wild magic now uses _0.33 charges_ instead of 0.5, and wild magic has a _25% chance_ to not spend a turn.\n\n_+2:_ Each zap from wild magic now uses _0.225 charges_ instead of 0.5, and wild magic has a _50% chance_ to not spend a turn.\n\n_+3:_ Each zap from wild magic now uses _0.15 charges_ instead of 0.5, and wild magic has a _75% chance_ to not spend a turn.\n\n_+4:_ Each zap from wild magic now uses _0.1 charges_ instead of 0.5, and wild magic has a _100% chance_ to not spend a turn.
actors.hero.talent.telefrag.title=Telefrag
actors.hero.talent.telefrag.desc=_+1:_ If the Mage warps into another character he deals _10-15 damage_ to it, but also takes _5 damage_.\n\n_+2:_ If the Mage warps into another character he deals _20-30 damage_ to it, but also takes _10 damage_.\n\n_+3:_ If the Mage warps into another character he deals _30-45 damage_ to it, but also takes _15 damage_.\n\n_+4:_ If the Mage warps into another character he deals _40-60 damage_ to it, but also takes _20 damage_.\n\nThe hero cannot be killed by this talent, the self damage can be reduced by magic resisting effects.
actors.hero.talent.remote_beacon.title=Remote Beacon
actors.hero.talent.remote_beacon.desc=_+1:_ The Mage can place a beacon at any location within _4 tiles_.\n\n_+2:_ The Mage can place a beacon at any location within _8 tiles_.\n\n_+3:_ The Mage can place a beacon at any location within _12 tiles_.\n\n_+4:_ The Mage can place a beacon at any location within _16 tiles_.\n\nThe Mage cannot place beacons in locations that are inaccessible.
actors.hero.talent.longrange_warp.title=Longrange Warp
actors.hero.talent.longrange_warp.desc=_+1:_ The Mage can now warp between floors, at _150% charge cost_.\n\n_+2:_ The Mage can now warp between floors, at _117% charge cost_.\n\n_+3:_ The Mage can now warp between floors, at _83% charge cost_.\n\n_+4:_ The Mage can now warp between floors, at _50% charge cost_.\n\nThe Mage cannot use longrange warp to leave a locked floor.
actors.hero.talent.cached_rations.title=cached rations
actors.hero.talent.cached_rations.desc=_+1:_ The Rogue can find _2 supply rations_ placed in chests while he explores the next few floors of the dungeon.\n\n_+2:_ The Rogue can find _3 supply rations_ placed in chests while he explores the next few floors of the dungeon.\n\nSupply rations are eaten quickly, restore a moderate amount of satiety, heal 5 hp, and restore 1 charge to the cloak of shadows.
actors.hero.talent.thiefs_intuition.title=thief's intuition
actors.hero.talent.thiefs_intuition.desc=_+1:_ The Rogue identifies rings _2x faster_, and identifies the type of a ring _when he equips it_.\n\n_+2:_ The Rogue identifies rings _when he equips them_, and identifies the type of a ring _when he picks it up_.
actors.hero.talent.sucker_punch.title=sucker punch
actors.hero.talent.sucker_punch.desc=_+1:_ The Rogue deals _1-2 bonus damage_ the first time he surprise attacks an enemy.\n\n_+2:_ The Rogue deals _2 bonus damage_ the first time he surprise attacks an enemy.
actors.hero.talent.protective_shadows.title=protective shadows
actors.hero.talent.protective_shadows.desc=_+1:_ The Rogue gains one shielding _every other turn_ he is invisible, _to a max of 3_.\n\n_+2:_ The Rogue gains one shielding _every turn_ he is invisible, _to a max of 5_.
actors.hero.talent.mystical_meal.title=mystical meal
actors.hero.talent.mystical_meal.desc=_+1:_ Eating food takes the Rogue 1 turn (supply rations are eaten instantly) and grants him _3 turns of artifact recharging_.\n\n_+2:_ Eating food takes the Rogue 1 turn (supply rations are eaten instantly) and grants him _5 turns of artifact recharging_.\n\nThis talent cannot be used to let the horn of plenty recharge itself.
actors.hero.talent.inscribed_stealth.title=inscribed stealth
actors.hero.talent.inscribed_stealth.desc=_+1:_ The Rogue gains _3 turns_ of invisibility after reading a scroll or using a spell item.\n\n_+2:_ The Rogue gains _5 turns_ of invisibility after reading a scroll or using a spell item\n\nThe invisibility duration is doubled when using a scroll of upgrade, scroll of transmutation, or alchemy items that must be crafted using those scrolls.\n\nFor alchemy items with higher output quantities (e.g. most spells), this talent has a chance to trigger based on how many of that item is produced.
actors.hero.talent.wide_search.title=wide search
actors.hero.talent.wide_search.desc=_+1:_ The Rogue’s search radius is increased from a 5x5 square to a _7x7 circle_.\n\n_+2:_ The Rogue’s search radius is increased from a 5x5 square to a _7x7 square_.
actors.hero.talent.wide_search.meta_desc=_If this talent is gained by a different hero_ it will instead increase their search radius from a 3x3 square to a 5x5 circle at +1, or a 5x5 square at +2.
actors.hero.talent.silent_steps.title=silent steps
actors.hero.talent.silent_steps.desc=_+1:_ The Rogue will not wake sleeping enemies while he is _3 or more tiles away from them_.\n\n_+2:_ The Rogue will not wake sleeping enemies while he is _not adjacent to them_.
actors.hero.talent.rogues_foresight.title=rogue's foresight
actors.hero.talent.rogues_foresight.desc=_+1:_ When the Rogue is on a level with a secret room, he has a _75% chance to notice_ that the level contains a secret.\n\n_+2:_ When the Rogue is on a level with a secret room, he has a _100% chance to notice_ that the level contains a secret.
actors.hero.talent.light_cloak.title=light cloak
actors.hero.talent.light_cloak.desc=_+1:_ The Rogue can use his cloak of shadows when it is not equipped, but it recharges at _25% speed_.\n\n_+2:_ The Rogue can use his cloak of shadows when it is not equipped, but it recharges at _50% speed_.\n\n_+3:_ The Rogue can use his cloak of shadows when it is not equipped, but it recharges at _75% speed_.
actors.hero.talent.light_cloak.meta_desc=_If this talent is gained by a different hero_ it will instead increase the charging speed of all artifacts by 7/13/20% at +1/+2/+3.
actors.hero.talent.enhanced_rings.title=enhanced rings
actors.hero.talent.enhanced_rings.desc=_+1:_ When the Rogue uses an artifact, his rings gain +1 upgrade for _3 turns_.\n\n_+2:_ When the Rogue uses an artifact, his rings gain +1 upgrade for _6 turns_.\n\n_+3:_ When the Rogue uses an artifact, his rings gain +1 upgrade for _9 turns_.
actors.hero.talent.enhanced_lethality.title=enhanced lethality
actors.hero.talent.enhanced_lethality.desc=_+1:_ The Assassin can assassinate enemies left at below _4/13/27/67% health_ per level of preparation, up from 3/10/20/50%.\n\n_+2:_ The Assassin can assassinate enemies left at below _5/17/33/83% health_ per level of preparation, up from 3/10/20/50%.\n\n_+3:_ The Assassin can assassinate enemies left at below _6/20/40/100% health_ per level of preparation, up from 3/10/20/50%.
actors.hero.talent.assassins_reach.title=assassin's reach
actors.hero.talent.assassins_reach.desc=_+1:_ The Assassin's blink range per level of preparation is increased to _1/3/4/6 tiles_, from 1/2/3/4.\n\n_+2:_ The Assassin's blink range per level of preparation is increased to _2/4/6/8 tiles_, from 1/2/3/4.\n\n_+3:_ The Assassin's blink range per level of preparation is increased to _2/5/7/10 tiles_, from 1/2/3/4.\n\nThis blink can go through hazards and enemies, but not through solid terrain like walls.
actors.hero.talent.bounty_hunter.title=bounty hunter
actors.hero.talent.bounty_hunter.desc=_+1:_ When the Assassin kills an enemy with a prepared strike their item drop chance is increased by _2/4/8/16%_, per level of preparation.\n\n_+2:_ When the Assassin kills an enemy with a prepared strike their item drop chance is increased by _4/8/16/32%_, per level of preparation.\n\n_+3:_ When the Assassin kills an enemy with a prepared strike their item drop chance is increased by _6/12/24/48%_, per level of preparation.
actors.hero.talent.evasive_armor.title=evasive armor
actors.hero.talent.evasive_armor.desc=_+1:_ While freerunning, the Freerunner gains an additional _+1 evasion_ per excess point of strength on his armor.\n\n_+2:_ While freerunning, the Freerunner gains an additional _+2 evasion_ per excess point of strength on his armor.\n\n_+3:_ While freerunning, the Freerunner gains an additional _+3 evasion_ per excess point of strength on his armor.
actors.hero.talent.projectile_momentum.title=projectile momentum
actors.hero.talent.projectile_momentum.desc=_+1:_ While freerunning, the Freerunner gains _+20% accuracy and +15% damage_ with thrown weapons.\n\n_+2:_ While freerunning, the Freerunner gains _+40% accuracy and +30% damage_ with thrown weapons.\n\n_+3:_ While freerunning, the Freerunner gains _+60% accuracy and +45% damage_ with thrown weapons.
actors.hero.talent.speedy_stealth.title=speedy stealth
actors.hero.talent.speedy_stealth.desc=_+1:_ The Freerunner gains 2 stacks of momentum per turn while he is invisible.\n\n_+2:_ In addition to the benefits of +1, freerunning no longer counts down while the Freerunner is invisible.\n\n_+3:_ In addition to the benefits of +1 and +2, the Freerunner moves at 2x speed while invisible, regardless of whether he is freerunning or not.
actors.hero.talent.hasty_retreat.title=hasty retreat
actors.hero.talent.hasty_retreat.desc=_+1:_ After blinking the Rogue gains _1 turn_ of haste and invisibility.\n\n_+2:_ After blinking the Rogue gains _2 turns_ of haste and invisibility.\n\n_+3:_ After blinking the Rogue gains _3 turns_ of haste and invisibility.\n\n_+4:_ After blinking the Rogue gains _4 turns_ of haste and invisibility.
actors.hero.talent.body_replacement.title=body replacement
actors.hero.talent.body_replacement.desc=_+1:_ After blinking, the Rogue leaves a wooden decoy behind that has _20 health and 1-3 armor_.\n\n_+2:_ After blinking, the Rogue leaves a wooden decoy behind that has _40 health and 2-6 armor_.\n\n_+3:_ After blinking, the Rogue leaves a wooden decoy behind that has _60 health and 3-9 armor_.\n\n_+4:_ After blinking, the Rogue leaves a wooden decoy behind that has _80 health and 4-12 armor_.\n\nOnly one decoy can be active at a time.
actors.hero.talent.shadow_step.title=shadow step
actors.hero.talent.shadow_step.desc=_+1:_ If the rogue uses smoke bomb while invisible, it occurs instantly and has a _16% reduced_ charge cost, but it also doesn't blind enemies or trigger other talents.\n\n_+2:_ If the rogue uses smoke bomb while invisible, it occurs instantly and has a _30% reduced_ charge cost, but it also doesn't blind enemies or trigger other talents.\n\n_+3:_ If the rogue uses smoke bomb while invisible, it occurs instantly and has a _41% reduced_ charge cost, but it also doesn't blind enemies or trigger other talents.\n\n_+4:_ If the rogue uses smoke bomb while invisible, it occurs instantly and has a _50% reduced_ charge cost, but it also doesn't blind enemies or trigger other talents.
actors.hero.talent.fear_the_reaper.title=fear the reaper
actors.hero.talent.fear_the_reaper.desc=_+1:_ When a death marked enemy reaches 0 hp, they become _crippled_.\n\n_+2:_ When a death marked enemy reaches 0 hp, they become _feared and crippled_.\n\n_+3:_ When a death marked enemy reaches 0 hp, they become _feared and crippled_ and enemies within 3 tiles become _crippled_.\n\n_+4:_ When a death marked enemy reaches 0 hp, they become _feared and crippled_ and enemies within 3 tiles become _feared and crippled_.
actors.hero.talent.deathly_durability.title=deathly durability
actors.hero.talent.deathly_durability.desc=_+1:_ Enemies killed by death mark give the rogue shielding equal to _13%_ of their hp when they were marked.\n\n_+2:_ Enemies killed by death mark give the rogue shielding equal to _25%_ of their hp when they were marked.\n\n_+3:_ Enemies killed by death mark give the rogue shielding equal to _38%_ of their hp when they were marked.\n\n_+4:_ Enemies killed by death mark give the rogue shielding equal to _50%_ of their hp when they were marked.
actors.hero.talent.double_mark.title=double mark
actors.hero.talent.double_mark.desc=_+1:_ Marking a second target at the same time as the first one has a _30% reduced_ charge cost.\n\n_+2:_ Marking a second target at the same time as the first one has a _50% reduced_ charge cost.\n\n_+3:_ Marking a second target at the same time as the first one has a _65% reduced_ charge cost.\n\n_+4:_ Marking a second target at the same time as the first one has a _75% reduced_ charge cost.
actors.hero.talent.shadow_blade.title=shadow blade
actors.hero.talent.shadow_blade.desc=_+1:_ The shadow clone gains _8%_ of the hero's damage per turn, and has a _25% chance_ to use the enchantment on the hero's weapon.\n\n_+2:_ The shadow clone gains _16%_ of the hero's damage per turn, and has a _50% chance_ to use the enchantment on the hero's weapon.\n\n_+3:_ The shadow clone gains _24%_ of the hero's damage per turn, and has a _75% chance_ to use the enchantment on the hero's weapon.\n\n_+4:_ The shadow clone gains _32%_ of the hero's damage per turn, and has a _100% chance_ to use the enchantment on the hero's weapon.
actors.hero.talent.cloned_armor.title=cloned armor
actors.hero.talent.cloned_armor.desc=_+1:_ The shadow clone gains _12%_ of the hero's armor value, and has a _25% chance_ to use the glyph on the hero's armor.\n\n_+2:_ The shadow clone gains _24%_ of the hero's armor value, and has a _50% chance_ to use the glyph on the hero's armor.\n\n_+3:_ The shadow clone gains _36%_ of the hero's armor value, and has a _75% chance_ to use the glyph on the hero's armor.\n\n_+4:_ The shadow clone gains _48%_ of the hero's armor value, and has a _100% chance_ to use the glyph on the hero's armor.
actors.hero.talent.perfect_copy.title=perfect copy
actors.hero.talent.perfect_copy.desc=_+1:_ The shadow clone gains _10%_ of the hero's max HP, and can instantly swap places with the hero up to _1 tile_ away.\n\n_+2:_ The shadow clone gains _20%_ of the hero's max HP, and can instantly swap places with the hero up to _2 tiles_ away.\n\n_+3:_ The shadow clone gains _30%_ of the hero's max HP, and can instantly swap places with the hero up to _3 tiles_ away.\n\n_+4:_ The shadow clone gains _40%_ of the hero's max HP, and can instantly swap places with the hero up to _4 tiles_ away.
actors.hero.talent.natures_bounty.title=nature's bounty
actors.hero.talent.natures_bounty.desc=_+1:_ The Huntress can find _4 berries_ hidden in tall grass as she explores the next few floors of the dungeon.\n\n_+2:_ The Huntress can find _6 berries_ hidden in tall grass as she explores the next few floors of the dungeon.\n\nBerries are eaten quickly, restore a small amount of satiety, and might contain a usable seed.
actors.hero.talent.survivalists_intuition.title=survivalist's intuition
actors.hero.talent.survivalists_intuition.desc=_+1:_ The Huntress identifies all equipment _1.75x faster_.\n\n_+2:_ The Huntress identifies all equipment _2.5x faster_.
actors.hero.talent.followup_strike.title=followup strike
actors.hero.talent.followup_strike.desc=_+1:_ When the Huntress hits an enemy with her bow or a thrown weapon, her next melee attack against that enemy deals _2 bonus damage_.\n\n_+2:_ When the Huntress hits an enemy with her bow or a thrown weapon, her next melee attack against that enemy deals _3 bonus damage_.
actors.hero.talent.natures_aid.title=nature's aid
actors.hero.talent.natures_aid.desc=_+1:_ The Huntress gains 0-2 armor of barkskin, which fades every _3 turns_ when a plant's effect is activated in her vision.\n\n_+2:_ The Huntress gains 0-2 armor of barkskin, which fades every _5 turns_ when a plant's effect is activated in her vision.
actors.hero.talent.invigorating_meal.title=invigorating meal
actors.hero.talent.invigorating_meal.desc=_+1:_ Eating food takes the Huntress 1 turn (berries are eaten instantly) and grants her _1 turn of haste_.\n\n_+2:_ Eating food takes the Huntress 1 turn (berries are eaten instantly) and grants her _2 turns of haste_.
actors.hero.talent.liquid_nature.title=liquid nature
actors.hero.talent.liquid_nature.desc=_+1:_ When the Huntress drinks or throws a potion, brew, or elixir, _up to 4 grass tiles_ sprout in the surrounding area, and adjacent enemies are rooted for _1 turn_.\n\n_+2:_ When the Huntress drinks or throws a potion, brew, or elixir, _up to 6 grass tiles_ sprout in the surrounding area, and adjacent enemies are rooted for _2 turns_.\n\nThe amount of grass and root duration are doubled when using potions of strength, experience, or alchemy items that must be crafted using those potions.\n\nFor alchemy items with higher output quantities (e.g. aqua brew), this talent has a chance to trigger based on how many of that item is produced.
actors.hero.talent.rejuvenating_steps.title=rejuvenating steps
actors.hero.talent.rejuvenating_steps.desc=_+1:_ When the Huntress steps on short grass or embers, they spring up into tall grass which the Huntress immediately furrows. This has a _10 turn cooldown_.\n\n_+2:_ When the Huntress steps on short grass or embers, they spring up into tall grass which the Huntress immediately furrows. This has a _5 turn cooldown_.\n\nThis talent will produce furrowed grass if passive regeneration effects are disabled or the hero has not gained exp in a long time.
actors.hero.talent.heightened_senses.title=heightened senses
actors.hero.talent.heightened_senses.desc=_+1:_ The Huntress gains mind vision on any enemy within _2 tiles of her position_.\n\n_+2:_ The Huntress gains mind vision on any enemy within _3 tiles of her position_.
actors.hero.talent.durable_projectiles.title=durable projectiles
actors.hero.talent.durable_projectiles.desc=_+1:_ Thrown weapons have _+50% durability_ when used by the Huntress.\n\n_+2:_ Thrown weapons have _+75% durability_ when used by the Huntress.
actors.hero.talent.point_blank.title=point blank
actors.hero.talent.point_blank.desc=_+1:_ When the Huntress uses her bow or a thrown weapon at melee range it has _-30% accuracy,_ instead of -50%.\n\n_+2:_ When the Huntress uses her bow or a thrown weapon at melee range it has _-10% accuracy,_ instead of -50%.\n\n_+3:_ When the Huntress uses her bow or a thrown weapon at melee range it has _+10% accuracy,_ instead of -50%.\n\nNote that thrown weapons or the spirit bow always have +50% accuracy when used at a distance.
actors.hero.talent.seer_shot.title=seer shot
actors.hero.talent.seer_shot.desc=_+1:_ When the Huntress fires an arrow at the ground, it grants vision in a 3x3 area around it for _5 turns_. This has a 20 turn cooldown.\n\n_+2:_ When the Huntress fires an arrow at the ground, it grants vision in a 3x3 area around it for _10 turns_. This has a 20 turn cooldown.\n\n_+3:_ When the Huntress fires an arrow at the ground, it grants vision in a 3x3 area around it for _15 turns_. This has a 20 turn cooldown.
actors.hero.talent.seer_shot.meta_desc=_If this talent is gained by a different hero_ it will trigger from any thrown weapon.
actors.hero.talent.farsight.title=farsight
actors.hero.talent.farsight.desc=_+1:_ The Sniper's vision range is _increased by 25%_.\n\n_+2:_ The Sniper's vision range is _increased by 50%_.\n\n_+3:_ The Sniper's vision range is _increased by 75%_.
actors.hero.talent.shared_enchantment.title=shared enchantment
actors.hero.talent.shared_enchantment.desc=_+1:_ Thrown weapons have a _33% chance_ to use the enchantment on the Sniper's bow.\n\n_+2:_ Thrown weapons have a _67% chance_ to use the enchantment on the Sniper's bow.\n\n_+3:_ Thrown weapons have a _100% chance_ to use the enchantment on the Sniper's bow.\n\nThis talent does not apply to darts shot from an enchanted crossbow, they already trigger the crossbow's enchantment.
actors.hero.talent.shared_upgrades.title=shared upgrades
actors.hero.talent.shared_upgrades.desc=_+1:_ When the Sniper attacks with an upgraded thrown weapon, each level increases the duration of sniper's mark by 1 turn and the damage of her special attack by _10%_.\n\n_+2:_ When the Sniper attacks with an upgraded thrown weapon, each level increases the duration of sniper's mark by 1 turn and the damage of her special attack by _20%_.\n\n_+3:_ When the Sniper attacks with an upgraded thrown weapon, each level increases the duration of sniper's mark by 1 turn and the damage of her special attack by _30%_.
actors.hero.talent.durable_tips.title=durable tips
actors.hero.talent.durable_tips.desc=_+1:_ Tipped darts have _2x durability_ when the Warden uses them.\n\n_+2:_ Tipped darts have _3x durability_ when the Warden uses them.\n\n_+3:_ Tipped darts have _4x durability_ when the Warden uses them.
actors.hero.talent.barkskin.title=barkskin
actors.hero.talent.barkskin.desc=_+1:_ When stepping in grass, the Warden gains _0-50% of her level_ in barkskin armor which fades every turn.\n\n_+2:_ When stepping in grass, the Warden gains _0-100% of her level_ in barkskin armor which fades every turn.\n\n_+3:_ When stepping in grass, the Warden gains _0-150% of her level_ in barkskin armor which fades every turn.
actors.hero.talent.shielding_dew.title=shielding dew
actors.hero.talent.shielding_dew.desc=_+1:_ Dewdrops can shield the Warden when her health is full, up to _20% of her max HP_.\n\n_+2:_ Dewdrops can shield the Warden when her health is full, up to _40% of her max HP_.\n\n_+3:_ Dewdrops can shield the Warden when her health is full, up to _60% of her max HP_.
actors.hero.talent.fan_of_blades.title=fan of blades
actors.hero.talent.fan_of_blades.desc=_+1:_ Spectral blades can hit up to _1 additional target_ for 50% damage. The target must be visible and within a _30 degree_ cone AOE.\n\n_+2:_ Spectral blades can hit up to _2 additional targets_ for 50% damage. The targets must be visible and within a _60 degree_ cone AOE.\n\n_+3:_ Spectral blades can hit up to _3 additional targets_ for 50% damage. The targets must be visible and within a _90 degree_ cone AOE.\n\n_+4:_ Spectral blades can hit up to _4 additional targets_ for 50% damage. The targets must be visible and within a _120 degree_ cone AOE.
actors.hero.talent.projecting_blades.title=projecting blades
actors.hero.talent.projecting_blades.desc=_+1:_ Spectral blades has _+25% accuracy_, and can penetrate up to _2 solid tiles_.\n\n_+2:_ Spectral blades has _+50% accuracy_, and can penetrate up to _4 solid tiles_.\n\n_+3:_ Spectral blades has _+75% accuracy_, and can penetrate up to _6 solid tiles_.\n\n_+4:_ Spectral blades has _+100% accuracy_, and can penetrate up to _8 solid tiles_.
actors.hero.talent.spirit_blades.title=spirit blades
actors.hero.talent.spirit_blades.desc=_+1:_ Spectral blades has a _30% chance_ to also use the enchantment on the spirit bow.\n\n_+2:_ Spectral blades has a _60% chance_ to also use the enchantment on the spirit bow.\n\n_+3:_ Spectral blades has a _90% chance_ to also use the enchantment on the spirit bow.\n\n_+4:_ Spectral blades has a _100% chance_ to also use the enchantment on the spirit bow, and it gives each enchantment _+10% power_.
actors.hero.talent.growing_power.title=growing power
actors.hero.talent.growing_power.desc=_+1:_ The attack and movespeed boosts from nature's power are increased to _38% and 125%_, from 33% and 100%.\n\n_+2:_ The attack and movespeed boosts from nature's power are increased to _42% and 150%_, from 33% and 100%.\n\n_+3:_ The attack and movespeed boosts from nature's power are increased to _46% and 175%_, from 33% and 100%.\n\n_+4:_ The attack and movespeed boosts from nature's power are increased to _50% and 200%_, from 33% and 100%.
actors.hero.talent.natures_wrath.title=nature's wrath
actors.hero.talent.natures_wrath.desc=_+1:_ While nature's power is active, shots from the spirit bow have an _8% chance_ to trigger a random harmful plant effect.\n\n_+2:_ While nature's power is active, shots from the spirit bow have a _17% chance_ to trigger a random harmful plant effect.\n\n_+3:_ While nature's power is active, shots from the spirit bow have an _25% chance_ to trigger a random harmful plant effect.\n\n_+4:_ While nature's power is active, shots from the spirit bow have a _33% chance_ to trigger a random harmful plant effect.\n\nThe plants that can be triggered are: blindweed, firebloom, icecap, sorrowmoss, and stormvine.
actors.hero.talent.wild_momentum.title=wild momentum
actors.hero.talent.wild_momentum.desc=_+1:_ Killing an enemy with the spirit bow prolongs the duration of nature's power by _1 turn_. The duration can be extended by a max of _2 turns_.\n\n_+2:_ Killing an enemy with the spirit bow prolongs the duration of nature's power by _2 turns_. The duration can be extended by a max of _4 turns_.\n\n_+3:_ Killing an enemy with the spirit bow prolongs the duration of nature's power by _3 turns_. The duration can be extended by a max of _6 turns_.\n\n_+4:_ Killing an enemy with the spirit bow prolongs the duration of nature's power by _4 turns_. The duration can be extended by a max of _8 turns_.
actors.hero.talent.eagle_eye.title=eagle eye
actors.hero.talent.eagle_eye.desc=_+1:_ The spirit hawk's vision range is increased to _7 tiles_ from 6.\n\n_+2:_ The spirit hawk's vision range is increased to _8 tiles_ from 6.\n\n_+3:_ The spirit hawk's vision range is increased to _9 tiles_ from 6, and it gets _2 tiles_ of mind vision.\n\n_+4:_ The spirit hawk's vision range is increased to _10 tiles_ from 6, and it gets _3 tiles_ of mind vision.
actors.hero.talent.go_for_the_eyes.title=go for the eyes
actors.hero.talent.go_for_the_eyes.desc=_+1:_ Attacks from the spirit hawk blind enemies for _2 turns_.\n\n_+2:_ Attacks from the spirit hawk blind enemies for _5 turns_.\n\n_+3:_ Attacks from the spirit hawk blind enemies for _5 turns_ and cripple them for _2 turns_.\n\n_+4:_ Attacks from the spirit hawk blind enemies for _5 turns_ and cripple them for _5 turns_.
actors.hero.talent.swift_spirit.title=swift spirit
actors.hero.talent.swift_spirit.desc=_+1:_ The spirit hawk's movement speed is increased to _2.5 tiles_ from 2, and it is guaranteed to dodge the first _2 attacks_ made against it.\n\n_+2:_ The spirit hawk's movement speed is increased to _3 tiles_ from 2, and it is guaranteed to dodge the first _4 attacks_ made against it.\n\n_+3:_ The spirit hawk's movement speed is increased to _3.5 tiles_ from 2, and it is guaranteed to dodge the first _6 attacks_ made against it.\n\n_+4:_The spirit hawk's movement speed is increased to _4 tiles_ from 2, and it is guaranteed to dodge the first _8 attacks_ made against it.
actors.hero.talent.strengthening_meal.title=strengthening meal
actors.hero.talent.strengthening_meal.desc=_+1:_ Eating food grants the Duelist 3 bonus damage the next _2 times_ she hits an enemy with a physical attack.\n\n_+2:_ Eating food grants the Duelist 3 bonus damage the next _3 times_ she hits an enemy with a physical attack.
actors.hero.talent.adventurers_intuition.title=adventurer's intuition
actors.hero.talent.adventurers_intuition.desc=_+1:_ The Duelist identifies weapons _2.5x faster_ and armor _1.75x faster_.\n\n_+2:_ The Duelist identifies weapons _when she equips them_ and armor _2.5x faster_.
actors.hero.talent.patient_strike.title=patient strike
actors.hero.talent.patient_strike.desc=_+1:_ If the Duelist waits before performing a melee attack, she will deal _1-2 bonus damage_.\n\n_+2:_ If the Duelist waits before performing a melee attack, she will deal _2 bonus damage_.
actors.hero.talent.aggressive_barrier.title=aggressive barrier
actors.hero.talent.aggressive_barrier.desc=_+1:_ The Duelist gains _3 shielding_ when she uses a weapon ability and is at or below 50% health.\n\n_+2:_ The Duelist gains _5 shielding_ when she uses a weapon ability and is at or below 50% health.
actors.hero.talent.aggressive_barrier.meta_desc=_If this talent is gained by a different hero_ it will instead grant shielding when making a melee attack at low health, with a 50 turn cooldown.
actors.hero.talent.focused_meal.title=focused meal
actors.hero.talent.focused_meal.desc=_+1:_ Eating food takes the Duelist 1 turn and grants her _0.67 charges_ on her weapons.\n\n_+2:_ Eating food takes the Duelist 1 turn and grants her _1 charge_ on her weapons.
actors.hero.talent.focused_meal.meta_desc=_If this talent is gained by a different hero_ it will instead grant bonus damage to their next hit equal to their level/3 at +1, or level/2 at +2.
actors.hero.talent.liquid_agility.title=liquid agility
actors.hero.talent.liquid_agility.desc=_+1:_ When drinking or throwing a potion, brew, or elixir, the Duelist has _3x evasion_, and has _3x accuracy_ on her next melee attack within 5 turns.\n\n_+2:_ When drinking or throwing a potion, brew, or elixir, the Duelist has _infinite evasion_, and has _infinite accuracy_ on her next melee attack within 5 turns.\n\nThis bonus lasts for one additional turn and attack when using potions of strength, experience, or alchemy items that must be crafted using those potions.\n\nFor alchemy items with higher output quantities (e.g. aqua brew), this talent has a chance to trigger based on how many of that item is produced.
actors.hero.talent.weapon_recharging.title=weapon recharging
actors.hero.talent.weapon_recharging.desc=_+1:_ The Duelist gains one weapon charge every _15 turns_ when under the effect of wand or artifact recharging buffs.\n\n_+2:_ The Duelist gains one weapon charge every _10 turns_ when under the effect of wand or artifact recharging buffs.
actors.hero.talent.weapon_recharging.meta_desc=_If this talent is gained by a different hero_ it will instead cause them to deal +5% melee damage while recharging at +1, or +7.5% melee damage while recharging at +2.
actors.hero.talent.lethal_haste.title=lethal haste
actors.hero.talent.lethal_haste.desc=_+1:_ When the Duelist lands a killing blow on an enemy with a weapon ability, she gains _3 turns_ worth of instant movement.\n\n_+2:_ When the Duelist lands a killing blow on an enemy with a weapon ability, she gains _5 turns_ worth of instant movement.
actors.hero.talent.lethal_haste.meta_desc=_If this talent is gained by a different hero_ it will instead trigger with regular weapon attacks, with a 100 turn cooldown.
actors.hero.talent.swift_equip.title=swift equip
actors.hero.talent.swift_equip.desc=_+1:_ The Duelist can switch her equipped weapon instantly _one time_ every 20 turns.\n\n_+2:_ The Duelist can switch her equipped weapon instantly _two times_ every 20 turns.\n\nIf the Duelist has this talent and it is not on cooldown, quick-using an unequipped weapon will equip it.
actors.hero.talent.precise_assault.title=precise assault
actors.hero.talent.precise_assault.desc=_+1:_ When the Duelist uses a weapon ability, she gains _2x accuracy_ on her next melee attack within 5 turns.\n\n_+2:_ When the Duelist uses a weapon ability, she gains _5x accuracy_ on her next melee attack within 5 turns.\n\n_+3:_ When the Duelist uses a weapon ability, she gains _infinite accuracy_ on her next melee attack within 5 turns.
actors.hero.talent.precise_assault.meta_desc=_If this talent is gained by a different hero_ it will instead increase melee accuracy by 10% at +1, 20% at +2, or 30% at +3.
actors.hero.talent.deadly_followup.title=deadly followup
actors.hero.talent.deadly_followup.desc=_+1:_ When the Duelist hits an enemy with a thrown weapon, she will deal _10% more melee damage_ to them for 5 turns.\n\n_+2:_ When the Duelist hits an enemy with a thrown weapon, she will deal _20% more melee damage_ to them for 5 turns.\n\n_+3:_ When the Duelist hits an enemy with a thrown weapon, she will deal _30% more melee damage_ to them for 5 turns.
actors.hero.talent.varied_charge.title=varied charge
actors.hero.talent.varied_charge.desc=_+1:_ The Champion instantly regains _0.17 weapon charges_ when she uses two different weapon abilities, with no time limit.\n\n_+2:_ The Champion instantly regains _0.33 weapon charges_ when she uses two different weapon abilities, with no time limit.\n\n_+3:_ The Champion instantly regains _0.5 weapon charges_ when she uses two different weapon abilities, with no time limit.
actors.hero.talent.twin_upgrades.title=twin upgrades
actors.hero.talent.twin_upgrades.desc=_+1:_ If one of the Champion's two equipped weapons has a lower level and is _2 or more tiers lower_ than the other weapon, it will be boosted to the other weapon's level.\n\n_+2:_ If one of the Champion's two equipped weapons has a lower level and is _1 or more tiers lower_ than the other weapon, it will be boosted to the other weapon's level.\n\n_+3:_ If one of the Champion's two equipped weapons has a lower level and is _the same tier or lower_ than the other weapon, it will be boosted to the other weapon's level.
actors.hero.talent.combined_lethality.title=combined lethality
actors.hero.talent.combined_lethality.desc=_+1:_ If the Champion attacks with a melee weapon immediately after using a different weapon's ability, that attack will execute any non-boss enemy left at _below 13% HP_.\n\n_+2:_ If the Champion attacks with a melee weapon immediately after using a different weapon's ability, that attack will execute any non-boss enemy left at _below 27% HP_.\n\n_+3:_ If the Champion attacks with a melee weapon immediately after using a different weapon's ability, that attack will execute any non-boss enemy left at _below 40% HP_.\n\nThis attack can be a regular melee weapon attack, or part of a weapon ability.
actors.hero.talent.unencumbered_spirit.title=unencumbered spirit
actors.hero.talent.unencumbered_spirit.desc=_+1:_ The Monk gains _50% more energy_ for each piece of _tier 3 or lower_ equipment she is using.\n\n_+2:_ This talent's effect is increased to _75% more energy_ for each piece of _tier 2 or lower_ equipment the Monk is using.\n\n_+3:_ This talent's effect is increased to _100% more energy_ for each piece of _tier 1_ equipment the Monk is using. She also gains a free cloth armor and studded gloves.\n\nNote that this talent gives no benefit from being unarmed or attacking with a Ring of Force.
actors.hero.talent.monastic_vigor.title=monastic vigor
actors.hero.talent.monastic_vigor.desc=_+1:_ If the Monk has _100% energy_, her abilities are empowered.\n\n_+2:_ If the Monk has _80% or more energy_, her abilities are empowered.\n\n_+3:_ If the Monk has _60% or more energy_, her abilities are empowered.\n\nWhen empowered:\n- Flurry applies your weapon's enchantment\n- Focus is instantaneous\n- Dash gains +4 range\n- Dragon Kick deals +50% damage and applies its knock back and stun effect to all adjacent enemies\n- Meditate slowly heals 20% of missing HP and grants 80% damage resistance.
actors.hero.talent.combined_energy.title=combined energy
actors.hero.talent.combined_energy.desc=_+1:_ If the Monk uses a weapon ability and a _4+ energy_ ability within 5 turns of each other, she regains 1 spent energy.\n\n_+2:_ If the Monk uses a weapon ability and a _3+ energy_ ability within 5 turns of each other, she regains 1 spent energy.\n\n_+3:_ If the Monk uses a weapon ability and a _2+ energy_ ability within 5 turns of each other, she regains 1 spent energy.
actors.hero.talent.close_the_gap.title=close the gap
actors.hero.talent.close_the_gap.desc=_+1:_ The Duelist blinks _up to two tiles_ toward her target when starting a duel.\n\n_+2:_ The Duelist blinks _up to three tiles_ toward her target when starting a duel.\n\n_+3:_ The Duelist blinks _up to four tiles_ toward her target when starting a duel.\n\n_+4:_ The Duelist blinks _up to five tiles_ toward her target when starting a duel.\n\nThis blink can go through hazards and enemies, but not solid terrain like walls. The blink is taken into account when determining if an enemy is in range to be challenged.
actors.hero.talent.invigorating_victory.title=invigorating victory
actors.hero.talent.invigorating_victory.desc=_+1:_ If the Duelist defeats her target before the duel ends, she heals for _5 HP plus 30% of the damage_ she took during the duel.\n\n_+2:_ If the Duelist defeats her target before the duel ends, she heals for _10 HP plus 50% of the damage_ she took during the duel.\n\n_+3:_ If the Duelist defeats her target before the duel ends, she heals for _15 HP plus 65% of the damage_ she took during the duel.\n\n_+4:_ If the Duelist defeats her target before the duel ends, she heals for _20 HP plus 75% of the damage_ she took during the duel.
actors.hero.talent.elimination_match.title=elimination match
actors.hero.talent.elimination_match.desc=_+1:_ If the Duelist challenges again within 3 turns of a duel ending, that challenge has a _16% reduced_ charge cost.\n\n_+2:_ If the Duelist challenges again within 3 turns of a duel ending, that challenge has a _30% reduced_ charge cost.\n\n_+3:_ If the Duelist challenges again within 3 turns of a duel ending, that challenge has a _40% reduced_ charge cost.\n\n_+4:_ If the Duelist challenges again within 3 turns of a duel ending, that challenge has a _50% reduced_ charge cost.
actors.hero.talent.elemental_reach.title=elemental reach
actors.hero.talent.elemental_reach.desc=_+1:_ Elemental strike's range is increased to _5 tiles_ from 4, and its width is increased to _75 degrees_ from 65.\n\n_+2:_ Elemental strike's range is increased to _6 tiles_ from 4, and its width is increased to _85 degrees_ from 65.\n\n_+3:_ Elemental strike's range is increased to _7 tiles_ from 4, and its width is increased to _95 degrees_ from 65.\n\n_+4:_ Elemental strike's range is increased to _8 tiles_ from 4, and its width is increased to _105 degrees_ from 65.
actors.hero.talent.striking_force.title=striking force
actors.hero.talent.striking_force.desc=_+1:_ The power of elemental strike's effect is increased by _30%_.\n\n_+2:_ The power of elemental strike's effect is increased by _60%_.\n\n_+3:_ The power of elemental strike's effect is increased by _90%_.\n\n_+4:_ The power of elemental strike's effect is increased by _120%_.
actors.hero.talent.directed_power.title=directed power
actors.hero.talent.directed_power.desc=_+1:_ The direct attack from elemental strike gains _+30% enchantment power_ for each enemy in range of elemental strike's effect, including the attack target.\n\n_+2:_ The direct attack from elemental strike gains _+60% enchantment power_ for each enemy in range of elemental strike's effect, including the attack target.\n\n_+3:_ The direct attack from elemental strike gains _+90% enchantment power_ for each enemy in range of elemental strike's effect, including the attack target.\n\n_+4:_ The direct attack from elemental strike gains _+120% enchantment power_ for each enemy in range of elemental strike's effect, including the attack target.
actors.hero.talent.feigned_retreat.title=feigned retreat
actors.hero.talent.feigned_retreat.desc=_+1:_ If an enemy attacks the Duelist's afterimage, she gains _2 turns_ of haste.\n\n_+2:_ If an enemy attacks the Duelist's afterimage, she gains _4 turns_ of haste.\n\n_+3:_ If an enemy attacks the Duelist's afterimage, she gains _6 turns_ of haste.\n\n_+4:_ If an enemy attacks the Duelist's afterimage, she gains _8 turns_ of haste.
actors.hero.talent.expose_weakness.title=expose weakness
actors.hero.talent.expose_weakness.desc=_+1:_ Enemies that attack the Duelist's afterimage become weak and vulnerable for _2 turns_.\n\n_+2:_ Enemies that attack the Duelist's afterimage become weak and vulnerable for _4 turns_.\n\n_+3:_ Enemies that attack the Duelist's afterimage become weak and vulnerable for _6 turns_.\n\n_+4:_ Enemies that attack the Duelist's afterimage become weak and vulnerable for _8 turns_.
actors.hero.talent.counter_ability.title=counter ability
actors.hero.talent.counter_ability.desc=_+1:_ If the Duelist uses a weapon ability within 3 turns of her afterimage being attacked, she will instantly regain _0.38 charges_.\n\n_+2:_ If the Duelist uses a weapon ability within 3 turns of her afterimage being attacked, she will instantly regain _0.77 charges_.\n\n_+3:_ If the Duelist uses a weapon ability within 3 turns of her afterimage being attacked, she will instantly regain _1.13 charges_.\n\n_+4:_ If the Duelist uses a weapon ability within 3 turns of her afterimage being attacked, she will instantly regain _1.5 charges_.
actors.hero.talent.heroic_energy.title=heroic energy
actors.hero.talent.heroic_energy.rat_title=ratroic energy
actors.hero.talent.heroic_energy.desc=_+1:_ The hero's armor ability has a _12% reduced_ charge cost.\n\n_+2:_ The hero's armor ability has a _23% reduced_ charge cost.\n\n_+3:_ The hero's armor ability has a _32% reduced_ charge cost.\n\n_+4:_ The hero's armor ability has a _40% reduced_ charge cost.
actors.hero.talent.ratsistance.title=ratsistance
actors.hero.talent.ratsistance.desc=_+1:_ Hostile ratmogrified enemies deal _-10% damage_.\n\n_+2:_ Hostile ratmogrified enemies deal _-19% damage_.\n\n_+3:_ Hostile ratmogrified enemies deal _-27% damage_.\n\n_+4:_ Hostile ratmogrified enemies deal _-35% damage_.
actors.hero.talent.ratlomacy.title=ratlomacy
actors.hero.talent.ratlomacy.desc=_+1:_ Using ratmogrify on a ratmogrified enemy makes them friendly and makes the transformation permanent.\n\n_+2:_ Using ratmogrify on a ratmogrified enemy makes them friendly, makes the transformation permanent, and gives them _2 turns_ of adrenaline.\n\n_+3:_ Using ratmogrify on a ratmogrified enemy makes them friendly, makes the transformation permanent, and gives them _4 turns_ of adrenaline.\n\n_+4:_ Using ratmogrify on a ratmogrified enemy makes them friendly, makes the transformation permanent, and gives them _6 turns_ of adrenaline.
actors.hero.talent.ratforcements.title=ratforcements
actors.hero.talent.ratforcements.desc=_+1:_ Using ratmogrify on yourself _spawns 1_ ally marsupial rat next to you.\n\n_+2:_ Using ratmogrify on yourself _spawns 2_ ally marsupial rats next to you.\n\n_+3:_ Using ratmogrify on yourself _spawns 3_ ally marsupial rats next to you.\n\n_+4:_ Using ratmogrify on yourself _spawns 4_ ally marsupial rats next to you.
actors.hero.herosubclass.kingy=rat king
actors.hero.herosubclass.kingy_desc=Reading the book of Mastery grants Rat King the power of all subclasses!
actors.hero.perks.perk_obtain=You learned %s!
actors.hero.perks.sucker_punch.name=sucker punch
actors.hero.perks.sucker_punch.desc=First surprise attack deals 25% additional armor-piercing damage.
actors.hero.perks.directive.name=directive
actors.hero.perks.directive.desc=First surprise attack gives 1.5 turns of haste.
actors.hero.perks$directivemovingtracker.name=Instant Steps
actors.hero.perks$directivemovingtracker.desc=Your movement will take 0 tiles unless you stop moving.\n\nMoves left: %s.
actors.hero.perks.follow_up_strike.name=follow-up strike
actors.hero.perks.follow_up_strike.desc=After hitting enemy with a bow or throwing weapon, next melee attack will deal 25% additional armor-piercing damage.
actors.hero.perks.hold_fast.name=hold fast
actors.hero.perks.hold_fast.desc=While waiting in place, you get additional %s-%s armor.
actors.hero.perks.protein_infusion.name=protein infusion
actors.hero.perks.protein_infusion.desc=The hero gets up to 2x speed and 1.5x evasion depending on their satiety.
actors.hero.perks.fishing_pro.name=fishing proficiency
actors.hero.perks.fishing_pro.desc=With 25% chance the fishing loot will be doubled.
actors.hero.perks.wand_pro.name=recharge proficiency
actors.hero.perks.wand_pro.desc=Your wands recharge 25% faster.
actors.hero.perks.iron_will.name=iron reflection
actors.hero.perks.iron_will.desc=Below 50% HP taking damage from physical or magical attacks will release damaging shockwaves into enemies.
actors.hero.perks.mystical_meal.name=mystical meal
actors.hero.perks.mystical_meal.desc=Eating grants 6 turns of artifact recharge.
actors.hero.perks.additional_money.name=bounty hunter
actors.hero.perks.additional_money.desc=Killing enemies drops gold equivalent to 20% of regularly dropped gold.
actors.hero.perks.better_bartering.name=efficient bartering
actors.hero.perks.better_bartering.desc=Trading with Rat King has 33% chance to not consume an item.
actors.hero.perks.potions.name=lots of experience
actors.hero.perks.potions.desc=Potions of Overload and Potions of Experience last 2x longer.
actors.hero.perks.more_bag.name=bigger lootbags
actors.hero.perks.more_bag.desc=Treasure bags from shop contain roughly 50% more items.
actors.hero.perks.no_oneshots.name=steel skin
actors.hero.perks.no_oneshots.desc=If the incoming damage is going to kill you from full HP, it will be reduced by 50%.
actors.hero.perks.collect_everything.name=magnetic meal
actors.hero.perks.collect_everything.desc=Eating overpriced rations causes every top item in every heap on the map to be collected instantly.
actors.hero.perks.rat_summons.name=ratforcements
actors.hero.perks.rat_summons.desc=Searching in place will spawn several ally marsupial rats next to you, with 25 turns of adrenaline.
actors.hero.perks.grass_healing.name=restored nature
actors.hero.perks.grass_healing.desc=Drinking a potion of healing spawns 5x5 square of grass, centered around the hero, and roots every enemy inside it for 3 turns.
actors.hero.perks.friendly_bees.name=friendly bees
actors.hero.perks.friendly_bees.desc=All bees, spawned from shattered honeypots, will fight for hero.
actors.hero.perks.raritize_magic.name=Raritizing Magic
actors.hero.perks.raritize_magic.desc=Mobs will drop an item (artifacts, wands, weapons, rings, armors) with rarity (or nothing) at 7% chance.
actors.hero.perks.supply_rations.name=Cached Rations
actors.hero.perks.supply_rations.desc=You can now find cached rations in chests with _1/(25 + (5 * rations found))_ chance while you explore the next few floors in the dungeon.\n\nSupply rations are eaten quickly, restore a moderate amount of satiety, heal 5 hp, and restore 1 charge to the cloak of shadows (if you have the item).
actors.hero.perks.dungeon_berry.name=Nature's Bounty
actors.hero.perks.dungeon_berry.desc=You can now find berries in tall grass with _1/(15 + (5 * berries found))_ chance while you explore the next few floors in the dungeon.\n\nBerries are eaten quickly, restore a moderate amount of satiety, and might contain a usable seed.
actors.mobs.npcs.blacksmith.name=troll blacksmith
actors.mobs.npcs.blacksmith.intro_quest_ratking=Hello Our Majesty!
actors.mobs.npcs.blacksmith.intro_quest_warrior=Hey Human! You look like a tough one.
actors.mobs.npcs.blacksmith.intro_quest_mage=Hey Human! You look like a smart one.
actors.mobs.npcs.blacksmith.intro_quest_rogue=Hey Human! You look like a sneaky one.
actors.mobs.npcs.blacksmith.intro_quest_huntress=Hey Human! You look like a quick one.
actors.mobs.npcs.blacksmith.intro_quest_duelist=Hey Human! You look like a brave one.
actors.mobs.npcs.blacksmith.intro_quest_cleric=Hey Human! You look like an important one.
actors.mobs.npcs.blacksmith.intro_quest_start=Wanna be useful, eh? Yeah I got something you could do. I built dis workshop ontop of an old mine, it's just down dat ladder. Take dis pickaxe and mine me some _dark gold ore. 40 pieces_ should be enough. The rock down der is nice and soft so _you'll be able to mine through the walls with some effort._\n\nWhat do you mean, how am I gonna pay? You greedy...\n\nOk, ok, I can do some smithin' for you. Consider yourself lucky, I'm the only blacksmith around.
actors.mobs.npcs.blacksmith.intro_quest_crystal=Careful though, the mine's dangerous for a little human like you. It's been abandoned for a while, and bunch of crystals have started growing. They're shiny, but too fragile to be worth anythin', and they've got some magic things protecting 'em. They're pretty strong, so _be careful where you mine_ or you'll get their attention.\n\nThere's a _giant crystal_ somewhere too. It's a lot tougher, so be prepared for a fight if you start breakin' it. I'll bet smashing it will slow all the crystal growth down though, so I'll pay extra if you can do it.
actors.mobs.npcs.blacksmith.intro_quest_gnoll=Careful though, the mine's dangerous for a little human like you. Some gnolls want the gold too and now they're wreckin' the place. They're stupid things, so their mining has caused all sorts of collapses and cave-ins. You'll have to mine through it, so _look for recently disturbed rock._\n\nI think one of the gnolls is causing most of the trouble, probably a _geomancer shaman_ or somethin'. I'll pay extra, if you can find and kill it, but I'm sure it'll fight back.
actors.mobs.npcs.blacksmith.intro_quest_fungi=Careful though, the mine's dangerous for a little human like you. There's some sorta fungus monster that's been growing down there. It's got mushroom sentries that're really deadly if they see you, but they can't get up and chase you at least. _Keep out of sight_ if you want to stay alive.\n\nI'll pay extra if you can manage to take down the _biggest mushrom,_ but it'll take some real effort. It's connected to a bunch of mycelium nodes that're hidden in the walls. You'll have to break most of 'em before you can really damage it.
actors.mobs.npcs.blacksmith.reminder=You done wastin' my time? The mine entrance is over there.
actors.mobs.npcs.blacksmith.reminder_crystal=Bring me as much gold as you can, and try to break the big crystal too.
actors.mobs.npcs.blacksmith.reminder_gnoll=Bring me as much gold as you can, and try to kill the gnoll geomancer too.
actors.mobs.npcs.blacksmith.reminder_fungi=Bring me as much gold as you can, and try to kill the giant mushroom too.
actors.mobs.npcs.blacksmith.lost_pick=Are you kiddin' me? Where is my pickaxe?!
actors.mobs.npcs.blacksmith.quest_start_prompt=You ready to go down? Make sure you've got some free space for the gold.\n\n_I'm only lettin' you down der once!_
actors.mobs.npcs.blacksmith.enter_yes=I'm Ready
actors.mobs.npcs.blacksmith.enter_no=Not Yet
actors.mobs.npcs.blacksmith.exit_warn_none=You done already? You've hardly got any gold at all! You should be able to get _40 pieces._\n\n_Remember, I'm not lettin' you back in once you come up._
actors.mobs.npcs.blacksmith.exit_warn_low=You done already? Doesn't look like you've got a lot of gold. You should be able to get _40 pieces._\n\n_Remember, I'm not lettin' you back in once you come up._
actors.mobs.npcs.blacksmith.exit_warn_med=You done? You've got some gold at least, but there's definitely more in the mine. You should be able to get _40 pieces._\n\n_Remember, I'm not lettin' you back in once you come up._
actors.mobs.npcs.blacksmith.exit_warn_high=You done? Looks like you've got a good amount of gold, but I could use a bit more. You should be able to get _40 pieces._\n\n_Remember, I'm not lettin' you back in once you come up._
actors.mobs.npcs.blacksmith.exit_warn_full=You done? You've got lots of gold, but make sure you haven't left any of your gear behind.\n\n_Remember, I'm not lettin' you back in once you come up._
actors.mobs.npcs.blacksmith.exit_warn_crystal=That giant crystal's still down there too. I'll pay extra if you destroy it.
actors.mobs.npcs.blacksmith.exit_warn_gnoll=That gnoll geomancer's still down there too. I'll pay extra if you kill it.
actors.mobs.npcs.blacksmith.exit_warn_fungi=That giant mushroom's still down there too. I'll pay extra if you kill it.
actors.mobs.npcs.blacksmith.exit_yes=I'm Done
actors.mobs.npcs.blacksmith.exit_no=Not Yet
actors.mobs.npcs.blacksmith.entrance_blocked=The way down is blocked.
actors.mobs.npcs.blacksmith.cant_enter_old=That area is not accessible on this run. Play a new game to try the new quest!
actors.mobs.npcs.blacksmith.def_verb=blocked
actors.mobs.npcs.blacksmith.desc=This troll blacksmith looks like all trolls look: he is tall and lean, and his skin resembles stone in both color and texture. The troll blacksmith is tinkering with disproportionally small tools.
actors.mobs.npcs.blacksmith.gold_1=Hey human! Wanna be useful, eh? Take dis pickaxe and mine me some _dark gold ore, 15 pieces_ should be enough. What do you mean, how am I gonna pay? You greedy...\nOk, ok, I don't have money to pay, but I can do some smithin' for you. Consider yourself lucky, I'm the only blacksmith around.
actors.mobs.npcs.blacksmith.blood_1=Hey human! Wanna be useful, eh? Take dis pickaxe and _kill a bat_ wit' it, I need its blood on the head. What do you mean, how am I gonna pay? You greedy...\nOk, ok, I don't have money to pay, but I can do some smithin' for you. Consider yourself lucky, I'm the only blacksmith around.
actors.mobs.npcs.blacksmith.gold_2=Dark gold ore. 15 pieces. Seriously, is it dat hard?
actors.mobs.npcs.blacksmith.blood_2=I said I need bat blood on the pickaxe. Chop chop!
actors.mobs.npcs.blacksmith.completed=Oh, you have returned... Better late dan never.
actors.mobs.npcs.blacksmith.get_lost=I'm busy. Get lost!
actors.mobs.npcs.blacksmith.same_item=Select 2 different items, not the same item twice!
actors.mobs.npcs.blacksmith.diff_type=Select 2 items of the same type!
actors.mobs.npcs.blacksmith.un_ided=I need to know what I'm working with, identify them first!
actors.mobs.npcs.blacksmith.cursed=I don't work with cursed items!
actors.mobs.npcs.blacksmith.degraded=It's junk, the quality is too poor!
actors.mobs.npcs.blacksmith.cant_reforge=I can't reforge these items!
actors.mobs.npcs.blacksmith.key=Oh, you here. I never thought that you will actually finish this quest. It's quite embarrassing to get busted so easily... Did you know, than Wand of Fireblast had a brother? He is called Wand of Avalanche.\n\nThe people loved him more than his sister... That's why it was banished, to point of no return. Until now.\n\nI was really bored and decided to extract this wand from game files, but they were erased, as usual. But I have managed to program it back. It was quite glitchy, hehehe. But don't worry, this new wand is completely fixed and will work as designed!\n\n(Wand of Avalanche recipe has been added.)
actors.mobs.npcs.ghost.name=sad ghost
actors.mobs.npcs.ghost.rat_1=Hello %s... Once I was like you - strong and confident... But I was slain by a foul beast... I can't leave this place... Not until I have my revenge... Slay the _fetid rat,_ that has taken my life...\n\nIt stalks this floor... Spreading filth everywhere... _Beware its cloud of stink and corrosive bite, the acid dissolves in water..._
actors.mobs.npcs.ghost.rat_2=Please... Help me... Slay the abomination...\n\n_Fight it near water... Avoid the stench..._
actors.mobs.npcs.ghost.gnoll_1=Hello %s... Once I was like you - strong and confident... But I was slain by a devious foe... I can't leave this place... Not until I have my revenge... Slay the _gnoll trickster,_ that has taken my life...\n\nIt is not like the other gnolls... It hides and uses thrown weapons... _Beware its poisonous and incendiary darts, don't attack from a distance..._
actors.mobs.npcs.ghost.gnoll_2=Please... Help me... Slay the trickster...\n\n_Don't let it hit you... Get near to it..._
actors.mobs.npcs.ghost.crab_1=Hello %s... Once I was like you - strong and confident... But I was slain by an ancient creature... I can't leave this place... Not until I have my revenge... Slay the _great crab,_ that has taken my life...\n\nIt is unnaturally old... With a massive single claw and a thick shell... _Beware its claw, you must surprise the crab or it will block with it..._
actors.mobs.npcs.ghost.crab_2=Please... Help me... Slay the Crustacean...\n\n_It will always block... When it sees you coming..._
actors.mobs.npcs.ghost.find_me=Thank you... come find me...
actors.mobs.npcs.ghost.desc=The ghost is barely visible. It looks like a shapeless spot of faint light with a sorrowful face.
actors.mobs.npcs.imp.name=ambitious imp
actors.mobs.npcs.imp.intro=Are you an adventurer? I love adventurers! You can always rely on them if something needs to be killed, am I right? For a bounty of course ;)
actors.mobs.npcs.imp.golems_1=In my case it's _golems_ that need to be killed. You see, I'm going to start a little business here, but those stupid golems are bad for business! It's very hard to negotiate with wandering lumps of granite, damn them! So please kill... let's say _4 of them_ and a reward is yours.
actors.mobs.npcs.imp.monks_1=In my case it's _monks_ who need to be killed. You see, I'm going to start a little business here, but those lunatics don't buy anything themselves and will scare away other customers. So please kill... let's say _5 of them_ and a reward is yours.
actors.mobs.npcs.imp.golems_2=How is your golem safari going? Just don't forget to grab those tokens.
actors.mobs.npcs.imp.monks_2=Oh, you're still alive! I knew that your kung-fu would be stronger ;) Just don't forget to grab those tokens.
actors.mobs.npcs.imp.cya=See you, %s!
actors.mobs.npcs.imp.hey=Psst, %s!
actors.mobs.npcs.imp.desc=Imps are lesser demons. They are notable for neither their strength nor their magic talent, but they are quite smart and sociable. Many imps prefer to live among non-demons.
actors.mobs.npcs.impshopkeeper.name=ambitious imp
actors.mobs.npcs.impshopkeeper.greetings=Hello, %s!
actors.mobs.npcs.impshopkeeper.greetings_ascent=What did you do %s? Shop quickly, I've got to get out of here!
actors.mobs.npcs.impshopkeeper.thief=I thought I could trust you!
actors.mobs.npcs.impshopkeeper.buyback=The imp cheerily returns your item.
actors.mobs.npcs.impshopkeeper.desc=The imp has set up a little shop on the border of the inner halls. It's nice to see a friendly face, but his prices certainly don't seem friendly.
actors.mobs.npcs.mirrorimage.name=mirror image
actors.mobs.npcs.mirrorimage.desc=This illusion bears a close resemblance to you, even seeming to wield your current weapon and armor.\n\nMirror images will seek and attack enemies using their mimicked weapon, which behaves the same as yours, but deals less damage. They start out nearly invisible, but must take on a form that's more easily seen in order to attack.\n\nWhile their offensive power can be potent, mirror images have no durability, and will fade the moment they take damage.
actors.mobs.npcs.prismaticimage.name=prismatic image
actors.mobs.npcs.prismaticimage.desc=This shimmering illusion bears a close resemblance to you, even seeming to wield your current weapon and armor.\n\nPrismatic images will attempt to seek and draw focus from enemies, using their enhanced defense and health to protect you. While they do not have the same offensive power as mirror images, they have enhanced durability, including receiving benefits from your armor.\n\nWhen reduced to 0 hp, prismatic images will fade over several turns, and can still be healed during this time. When no enemies are present, prismatic images will fade and rejoin their master.
actors.mobs.npcs.ratking.name=rat king
actors.mobs.npcs.ratking.not_sleeping=I'm not sleeping!
actors.mobs.npcs.ratking.what_is_it=What is it? I have no time for this nonsense. My kingdom won't rule itself!
actors.mobs.npcs.ratking.confused=Wha... Where am I? My kingdom needs me!
actors.mobs.npcs.ratking.crown_clothes=Put some clothes on! You're in no state to talk to royalty!
actors.mobs.npcs.ratking.crown_desc=Oooh, is that crown for me!? It looks much shinier than mine, so I graciously accept!\n\nIn fact, I think I can offer you something as a reward for this crown. A tremendous power befitting a hero such as yourself! Would you like that?
actors.mobs.npcs.ratking.crown_yes=Of course!
actors.mobs.npcs.ratking.crown_info=Tell me more first.
actors.mobs.npcs.ratking.crown_no=I'd rather not...
actors.mobs.npcs.ratking.crown_thankyou=Hehehe, thank you! Now go and make your king proud!
actors.mobs.npcs.ratking.crown_fine=Fine! It's not like I wanted it anyway...
actors.mobs.npcs.ratking.crown_after=Enjoying your new armor? No take-backsies!
actors.mobs.npcs.ratking.desc_crown=This rat is a little bigger than a regular marsupial rat. It's wearing dwarf king's crown on its head.
actors.mobs.npcs.ratking.desc_birthday=This rat is a little bigger than a regular marsupial rat. It's wearing a tiny green party hat instead of its usual crown. Happy birthday Rat King!
actors.mobs.npcs.ratking.desc_winter=This rat is a little bigger than a regular marsupial rat. It's wearing a tiny festive hat instead of its usual crown. Happy Holidays!
actors.mobs.npcs.ratking.desc=This rat is a little bigger than a regular marsupial rat. It's wearing a tiny crown on its head.
actors.mobs.npcs.ratking.ghastly=This mirror image is the manifestation of the Rat King's will. It will not run away, but still trade with you when needed.
actors.mobs.npcs.sheep.name=sheep
actors.mobs.npcs.sheep.baa.=Baa.
actors.mobs.npcs.sheep.baa...=Baa...
actors.mobs.npcs.sheep.def_verb=blocked
actors.mobs.npcs.sheep.desc=This is a magic sheep. What's so magical about it? You can't kill it. It will stand there until it magically fades away, all the while chewing cud with a blank stare.
actors.mobs.npcs.shopkeeper.name=shopkeeper
actors.mobs.npcs.shopkeeper.thief=Thief, Thief!
actors.mobs.npcs.shopkeeper.warn=Watch it! I won't warn you again.
actors.mobs.npcs.shopkeeper.flee=The shopkeeper flees!
actors.mobs.npcs.shopkeeper.sell=Sell an item
actors.mobs.npcs.shopkeeper.talk=Talk
actors.mobs.npcs.shopkeeper.buyback=The shopkeeper reluctantly returns your item.
actors.mobs.npcs.shopkeeper.talk_prison_intro=I have everything you need for a successful adventure!
actors.mobs.npcs.shopkeeper.talk_prison_warrior=That's an interesting seal you've got there, they're usually in one piece. You a disgraced hero or something? Well whatever you've done is none of my business, your coins are still good.
actors.mobs.npcs.shopkeeper.talk_prison_mage=Hehe, I think I've seen a wanted poster with your name on it somewhere in the city. On the run are we? Oh you're innocent are you? Of course, of course... Don't fret, I've got better things to do than report on you, but perhaps you should buy something to be sure?
actors.mobs.npcs.shopkeeper.talk_prison_rogue=Have you come from the thieves guild to clear the area? No, just shopping? Well kill a few monsters while you're here anyway. Don't expect a discount either, I pay good protection money to you people and you're barely keeping me safe down here.
actors.mobs.npcs.shopkeeper.talk_prison_huntress=You seem to be out of your element miss. Tight dungeon corridors aren't as spacious as grand halls or the forests surrounding the city are they? Hehe, oh don't mind my rambling, why not buy something?
actors.mobs.npcs.shopkeeper.talk_prison_duelist=Well if it isn't the travelling hero! If you're trying to save another town then good luck, the dangers here are much worse than petty bandit gangs. I'm sure you'll do better than anyone else could, just try to not die right outside my store.
actors.mobs.npcs.shopkeeper.talk_prison_rat_king=Greetings, Your Majesty. Why you are here at all? You already have all the luxury and popularity in the world... Just for fun? Okay...
actors.mobs.npcs.shopkeeper.talk_caves=Spend money, live longer.\n\nOh and say hello to that Troll blacksmith for me if you see him. Remind the lug that he still owes me money for that hammer I sold him last week!
actors.mobs.npcs.shopkeeper.talk_city=My wares can keep you safe down here.\n\n...And don't loiter if you please. It took forever to get the locals down here to leave me alone, I don't want you attracting any trouble!
actors.mobs.npcs.shopkeeper.talk_halls=Hey there, I've got special prices for demon hunters!\n\nOh and be careful down there! The demons below won't care how courageous you are. You can't come back up and spend more money if you're dead! ;)\n\nAre the demons like me? Hehe, not at all. I'm just a small fellow, not much of a fighter, and I've managed to keep my mind intact. The demons below are much stronger things, and they've all been enslaved by... well... just be careful down there.
actors.mobs.npcs.shopkeeper.talk_ascent=I don't know what you're planning to do with that amulet but I want no part of it. Buy something and move on, we both need to leave this place!
actors.mobs.npcs.shopkeeper.desc=This stout guy looks more appropriate for a trade district in some large city than for a dungeon. His prices explain why he prefers to do business here.\n\nHave you wondered, how he reacts to clay?
actors.mobs.npcs.wandmaker.name=old wandmaker
actors.mobs.npcs.wandmaker.intro_warrior=Oh, hello there! What a pleasant surprise to meet a warrior from the north in such a depressing place! You must have travelled quite far to get here. If you're looking for adventure, I may have a task for you.
actors.mobs.npcs.wandmaker.intro_rogue=Oh Goodness, you startled me! I haven't met a bandit from this place that still has his sanity, so you must be from the surface! If you're up to helping a stranger out, I may have a task for you.
actors.mobs.npcs.wandmaker.intro_mage=Oh, hello %s! I heard there was some ruckus regarding you and the wizards institute? Oh never mind, I never liked those stick-in-the-muds anyway. If you're willing, I may have a task for you.
actors.mobs.npcs.wandmaker.intro_huntress=Oh, hello miss! A friendly face is a pleasant surprise down here isn't it? In fact, I swear I've seen your face before, but I can't put my finger on it... Oh never mind, if you're here for adventure, I may have a task for you.
actors.mobs.npcs.wandmaker.intro_duelist=Oh, hello miss! What a pleasant surprise to meet a hero in such a depressing place! If you're up to helping an old man out, I may have a task for you.
actors.mobs.npcs.wandmaker.intro_ratking=Oh, big greetings, Your Majesty! What a honor to meet your enlightening presence in such depressing place! If you're fine with helping an old man out, I may have a task for you.
actors.mobs.npcs.wandmaker.intro_1=\n\nI came here to find a rare ingredient for a wand, but I've gotten myself lost, and my magical shield is weakening. I'll need to leave soon, but can't bear to go without getting what I came for.
actors.mobs.npcs.wandmaker.intro_dust=I'm looking for some _corpse dust._ It's a special kind of cursed bone meal that usually shows up in places like this. There should be a barricaded room around here somewhere, I'm sure some dust will turn up there. Do be careful though, the curse the dust carries is quite potent, _get back to me as fast as you can_ and I'll cleanse it for you.
actors.mobs.npcs.wandmaker.intro_ember=I'm looking for some _fresh embers_ from a newborn fire elemental. Elementals usually pop up when a summoning ritual isn't controlled, so just find some candles and a ritual site and I'm sure you can get one to pop up. You'll want to _avoid boxing yourself in_ while fighting it though, or you could _keep some sort of freezing item handy._ Newborn Elementals are pretty powerful and chaotic, but they can't stand the cold.
actors.mobs.npcs.wandmaker.intro_berry=The old warden of this prison kept a _rotberry plant,_ and I'm after one of its seeds. The plant has probably gone wild by now though, so getting it to give up a seed might be tricky. Its garden should be somewhere around here. Try to _keep away from its vine lashers_ if you want to stay in one piece. Using fire might be tempting but please don't, you'll kill the plant and destroy its seeds.
actors.mobs.npcs.wandmaker.intro_2=\n\nIf you can get that for me, I'll be happy to pay you with one of my finely crafted wands! I brought two with me, so you can take whichever one you prefer.
actors.mobs.npcs.wandmaker.reminder_dust=Any luck with corpse dust, %s? Look for some barricades.
actors.mobs.npcs.wandmaker.reminder_ember=Any luck with those embers, %s? You'll need to find four candles and the ritual site.
actors.mobs.npcs.wandmaker.reminder_berry=Any luck with a Rotberry seed, %s? Look for a room filled with vegetation.
actors.mobs.npcs.wandmaker.def_verb=blocked
actors.mobs.npcs.wandmaker.desc=This old yet hale gentleman wears a slightly confused expression. He is protected by a magic shield.
actors.mobs.npcs.wandmaker.cheese=Oh god, cheese! You found it for me? Awesome! I will give you my most powerful wand in possession, although it's little unfinished.\n\nYou can try to kill that big slime again with it.
actors.mobs.npcs.hook.name=hook
actors.mobs.npcs.hook.desc=The hook from your cool fishing rod.
actors.mobs.npcs.expgenerator.name=power plant
actors.mobs.npcs.expgenerator.desc=This golden masterpiece gathers hidden sunlight and turns it into experience. You can damage to get the generator back.
actors.mobs.npcs.bbat.name=bbat
actors.mobs.npcs.bbat.desc=This bat is trained to hunt weak targets while the owner survives in battlefield. It has high dexterity, but pretty low offensive stats. 
actors.mobs.npcs.bbat$bbatrecharge.name=Bbat Recharge
actors.mobs.npcs.bbat$bbatrecharge.desc=Bbat needs %s turns to recover from damage and return to fight. You can summon it with your Cloak of Shadows
actors.mobs.acidic.name=acidic scorpio
actors.mobs.acidic.desc=These huge arachnid-like demonic creatures avoid close combat, preferring to fire crippling serrated spikes from long distances. This one appears to be dripping with corrosive ooze.
actors.mobs.albino.name=albino rat
actors.mobs.albino.desc=This is a rare breed of marsupial rat, with pure white fur and jagged teeth.
actors.mobs.armoredstatue.name=armored statue
actors.mobs.armoredstatue.desc=You would think that it's just another one of this dungeon's inanimate statues, but its red glowing eyes give it away.\n\nIt seems to be in great condition because of the armor it's wearing, it might be very hard to kill.
actors.mobs.armoredstatue.desc_arm_wep=While the statue itself is made of stone, the _%1$s_ and _%2$s_ it's wielding look real.
actors.mobs.bandit.name=crazy bandit
actors.mobs.bat.name=vampire bat
actors.mobs.bat.desc=These brisk and tenacious inhabitants of the caves are much more dangerous than they seem. They replenish their health with each successful attack, which allows them to defeat much larger opponents.
actors.mobs.bee.name=golden bee
actors.mobs.bee.desc_honey=Despite their small size, golden bees tend to protect their home fiercely. This one has been placated, and seems to want to follow you.
actors.mobs.bee.desc=Despite their small size, golden bees tend to protect their home fiercely. This one is very mad, better keep your distance.
actors.mobs.brute.name=gnoll brute
actors.mobs.brute.enraged=enraged
actors.mobs.brute.def_verb=blocked
actors.mobs.brute.desc=Brutes are the largest, strongest, and toughest of all gnolls. When mortally wounded, they go berserk, gaining temporary shielding and a large boost to damage.
actors.mobs.brute$bruterage.name=brute rage
actors.mobs.brute$bruterage.desc=This gnoll brute is dying, but wants to take you with it!\n\nThe brute will die when its shielding wears off, either due to time or if it is damaged. In the meantime, it will deal hugely increased damage, so watch out!\n\nShield remaining: %d.
actors.mobs.causticslime.name=caustic slime
actors.mobs.causticslime.desc=This slime seems to have been tainted by the dark magic emanating from below. It has lost its usual green color, and drips with caustic ooze.
actors.mobs.crab.name=sewer crab
actors.mobs.crab.desc=These huge crabs are at the top of the food chain in the sewers. They are extremely fast and their thick carapace can withstand heavy blows.
actors.mobs.crystalguardian.name=crystal guardian
actors.mobs.crystalguardian.def_verb=blocked
actors.mobs.crystalguardian.desc=These large crystalline guardians almost look like statues, if it weren't for their bright glowing eyes. The hardened crystal they're made out of causes them to be sluggish but very tough, so _it's best to leave them to sleep in their crystal nest for as long as possible._\n\nDue to their size, crystal guardians will move much more slowly in enclosed spaces. They're also so durable that they're impossible to kill outright. They can be beaten down and temporarily disabled, but they'll just get back up again after a little while.
actors.mobs.crystalmimic.name=crystal mimic
actors.mobs.crystalmimic.ate=The mimic ate your %s!
actors.mobs.crystalmimic.escaped=The crystal mimic has escaped!
actors.mobs.crystalmimic.desc=Mimics are magical creatures which can take any shape they wish. In dungeons they almost always choose a shape of a treasure chest, in order to lure in unsuspecting adventurers.\n\nCrystal mimics are trickier than their regular cousins, and prefer to avoid conflict while stealing loot. They will attempt to sprint away once discovered, and have the ability to reposition enemies when they attack.
actors.mobs.crystalspire.name=crystal spire
actors.mobs.crystalspire.warning=The crystal vibrates as you strike it. Keeping this up is bound to draw attention to you...
actors.mobs.crystalspire.alert=The vibration grows and rumbles through the whole cave!
actors.mobs.crystalspire.desc=This gigantic spire of ultra hard crystal is probably the source of all the strange crystalline creatures in this cave. Your regular weapons are ineffective against it, so you'll need to use your pickaxe if you want to destroy it.\n\n_Make sure you're prepared before you start breaking it._ Such a big crystal is likely to take a while to mine through, and you probably won't be able to do it undisturbed. The spire itself may even have some means of defending itself as well. _Perhaps the spire's own attacks could be used against its minions._
actors.mobs.crystalwisp.name=crystal wisp
actors.mobs.crystalwisp.beam_kill=The beam of light killed you...
actors.mobs.crystalwisp.desc=A small angry floating chunk of hardened crystal that's producing a bright glow. While not especially strong, crystal wisps will shoot a damaging beam of light at you if they have a clear shot.\n\nWisps are small enough to easily move through the various crystal outcroppings, but they aren't able to shoot through them.
actors.mobs.demonspawner.name=demon spawner
actors.mobs.demonspawner.on_death=The demonic energy here seems to lessen as the spawner dies.
actors.mobs.demonspawner.desc=This twisting amalgam of dwarven flesh is responsible for creating ripper demons from the dwarves that have died in this region. Clearly the demons see no issue with using every resource they can against their enemies.\n\nWhile visually terrifying, demon spawners have no means of moving or directly defending themselves. Their considerable mass makes them hard to kill quickly however, and they will spawn ripper demons more quickly when they are under threat.\n\n_Demon spawners seem to be connected to some central source of demonic power. Killing them may weaken it._
actors.mobs.dm100.name=DM-100
actors.mobs.dm100.zap_kill=The lightning bolt killed you...
actors.mobs.dm100.desc=The DM-100 is an early model of dwarven 'defense machine' which was designed to protect dwarven miners in the caves below this prison. Their electrical shocks proved too weak however, and so they were gifted to the human city above. They went unused for years and eventually found their way to the prison, where the warden initially deemed them too cruel to use. However, as the prisoners became more unruly they became a necessity.
actors.mobs.dm200.name=DM-200
actors.mobs.dm200.vent=The DM-200 fires a jet of toxic exhaust!
actors.mobs.dm200.desc=The DM-200 is the second generation of dwarven 'defense machine', which was designed to protect dwarven miners in the caves and city below. They are much larger and bulkier than their predecessors, and attack with devastating hydraulic fists.\n\nTheir increased size is also their primary weakness, as they are unable to fit into the narrow tunnels and doorways of the dungeon. The dwarves were able to compensate for the DM-200's lack of mobility by allowing them to vent their toxic exhaust fumes at distant enemies, or enemies they cannot reach.
actors.mobs.dm201.name=DM-201
actors.mobs.dm201.vent=The DM-201 lobs a corrosive grenade!
actors.mobs.dm201.desc=The dwarves briefly experimented with more heavily emphasizing the DM-200's lack of mobility and created some DM models that are entirely stationary. The DM-201 is a retrofitted DM-200 which acts as a sentry turret that has no movement ability. In exchange for the lack of mobility, DM-201s have significantly more durability and attacking power.\n\nAs DM-201s have no engine to vent exhaust from, the dwarves instead outfitted them with corrosive gas grenades! DM-201s are careful with these grenades however, and will only lob them when attacked from a distance.
actors.mobs.dm300.name=DM-300
actors.mobs.dm300.notice=UNAUTHORIZED PERSONNEL DETECTED!
actors.mobs.dm300.shield=DM-300 pulls power from the exposed wires and shields itself!
actors.mobs.dm300.charging=SUSTAINING DAMAGE! ACTIVATING POWER PYLON!
actors.mobs.dm300.charging_hint=DM-300 is invulnerable while it is being energized by a pylon!
actors.mobs.dm300.supercharged=DESTROY! DESTROY! DESTROY!
actors.mobs.dm300.charge_lost=PYLON DESTROYED! REVERTING TO LOCAL POWER!
actors.mobs.dm300.pylons_destroyed=ALERT! INSTABILITY DETECTED IN POWER GRID!
actors.mobs.dm300.rankings_desc=Crushed by the DM-300
actors.mobs.dm300.def_verb=blocked
actors.mobs.dm300.defeated=CRITICAL DAMAGE! ATTEMPTING SHUTDO-
actors.mobs.dm300.desc=The DM-300 is the largest and most powerful 'defense machine' that the dwarves ever built. Such an awesome machine is difficult to manufacture, so the dwarves only ever made a few to guard the entrances to their underground metropolis.\n\nIt is equipped with vents to jet its toxic exhaust fumes and a high power drill that it can use both to attack and disrupt the earth. DM-300 can also connect to an energy grid, further enhancing its power.
actors.mobs.dm300.desc_supercharged=DM-300 is currently charged full of electrical energy. In this form DM-300 cannot be damaged and moves at double speed! Additionally, its drill now spins fast enough for it to _tunnel through solid rock,_ though it moves much more slowly when doing this.\n\nAttacking DM-300 directly is pointless while it is supercharged, but _something in the area must be providing it with this energy,_ destroying that may weaken it.
actors.mobs.blackmimic.name=darkened mimic
actors.mobs.blackmimic.notice=Hey, you did go there.
actors.mobs.blackmimic.shield=I have powerfield for you!
actors.mobs.blackmimic.vent=How about some corrosive experience?
actors.mobs.blackmimic.rocks=Crush him, rocks!
actors.mobs.blackmimic.bomb=Explode!
actors.mobs.blackmimic.summon=TASTE THE MONSTERS
actors.mobs.blackmimic.charging=YOU FOOL
actors.mobs.blackmimic.charging_hint=Darkened Mimic is invulnerable while power pylon is there!
actors.mobs.blackmimic.supercharged=STOP RIGHT THERE YOU IDIOT
actors.mobs.blackmimic.charge_lost=WHHHHAAAAAT
actors.mobs.blackmimic.pylons_destroyed=HOW
actors.mobs.blackmimic.rankings_desc=Consumed by his own greed
actors.mobs.blackmimic.def_verb=blocked
actors.mobs.blackmimic.defeated=NOOOOOOOOOOOOOOOOOOOOOO-
actors.mobs.blackmimic.desc=The embodiment of your endless avaritia. It hopes to consume you alongside with Amulet, while using various gas based attacks and summoning monsters from dungeon.
actors.mobs.blackmimic.desc_clone=This is a clone of Darkened Mimic. It doesn't announce its attacks, is immune to any damage and has reduced chance to summon another clone.
actors.mobs.blackmimic.desc_supercharged=Darkened Mimic is currently charged full of frustration, In this form the mimic cannot be damaged and moves at triple speed! Additionally, its jaws now are strong enough for it to _tunnel through solid rock,_ though it moves much more slowly when doing this.\n\nAttacking Darkened Mimic directly is pointless while it is supercharged, but _something in the area must be providing it with this energy,_ destroying that may weaken it.
actors.mobs.blackmimic$fallingrocks.desc=Loose rocks are tumbling down from the ceiling here, it looks like its about to collapse!
actors.mobs.dwarfking.name=King of Dwarves
actors.mobs.dwarfking.notice=How dare you! You have no idea what you're interfering with!
actors.mobs.dwarfking.lifelink_1=I have need of your essence, slave!
actors.mobs.dwarfking.lifelink_2=Bleed for me, slave!
actors.mobs.dwarfking.teleport_1=Deal with them, slave!
actors.mobs.dwarfking.teleport_2=Keep them busy, slave!
actors.mobs.dwarfking.wave_1=Enough! Arise my slaves!
actors.mobs.dwarfking.wave_2=More! Bleed for your king!
actors.mobs.dwarfking.wave_3=Useless! KILL THEM NOW!
actors.mobs.dwarfking.enraged=You cannot kill me %s. I. AM. IMMORTAL!
actors.mobs.dwarfking.losing=No! You can't do this... you have no idea what lies below...
actors.mobs.dwarfking.defeated=You've... Doomed us all...
actors.mobs.dwarfking.rankings_desc=Fell Before the King of Dwarves
actors.mobs.dwarfking.desc=Many years ago one of the highest wizards in the dwarven court uncovered secrets which gave him tremendous power over life and death. He soon put this power to use, subjugating and corrupting his peers, his king, and eventually every dwarven citizen. Now he is king, ruler over a legion of undead subjects.\n\nThe King of Dwarves is an aggressive foe, who will attempt to surround and overwhelm his enemies with his horde of undead minions.
actors.mobs.dwarfking$dkghoul.rankings_desc=Fell Before the King of Dwarves
actors.mobs.dwarfking$dkmonk.rankings_desc=Fell Before the King of Dwarves
actors.mobs.dwarfking$dkwarlock.rankings_desc=Fell Before the King of Dwarves
actors.mobs.dwarfking$dkgolem.rankings_desc=Fell Before the King of Dwarves
actors.mobs.ebonymimic.name=ebony mimic
actors.mobs.ebonymimic.reveal=There was a mimic there!
actors.mobs.ebonymimic.hidden_name=suspicious outline
actors.mobs.ebonymimic.hidden_desc=There seems to be something here, but it's almost totally transparent.
actors.mobs.ebonymimic.desc=Mimics are magical creatures which can take any shape they wish. In dungeons they almost always choose a shape of a treasure chest, in order to lure in unsuspecting adventurers.\n\nEbony mimics are extremely tough mimics with the ability to make themselves almost invisible. They lurk on things that adventurers are likely to interact with, but do contain loot of their own as well.\n\nThere can't be anything even stronger, _right?_
actors.mobs.elemental$fireelemental.name=fire elemental
actors.mobs.elemental$fireelemental.desc=Elementals are chaotic creatures that are often created when powerful occult magic isn't properly controlled. Elementals have minimal intelligence, and are usually associated with a particular type of magic.\n\nFire elementals are a common type of elemental which deals damage with fiery magic. They will set their target ablaze with melee attacks, and can occasionally shoot bolts of fire as well.
actors.mobs.elemental$newbornfireelemental.name=newborn fire elemental
actors.mobs.elemental$newbornfireelemental.charging=The elemental is charging up!
actors.mobs.elemental$newbornfireelemental.desc=Elementals are chaotic creatures that are often created when powerful occult magic isn't properly controlled. Elementals have minimal intelligence, and are usually associated with a particular type of magic.\n\nThis fire elemental is freshly summoned, but still quite dangerous!
actors.mobs.elemental$newbornfireelemental.desc_boss=Because of the chaotic nature of its summoning, this elemental can only spread fire in inaccurate blasts after charging for a turn.
actors.mobs.elemental$newbornfireelemental.desc_ally=Because this elemental was summoned by a spell, it has a little more control over its flame. It's incapable of making ranged attacks, but will ignite enemies it attacks in melee.
actors.mobs.elemental$frostelemental.name=frost elemental
actors.mobs.elemental$frostelemental.desc=Elementals are chaotic creatures that are often created when powerful occult magic isn't properly controlled. Elementals have minimal intelligence, and are usually associated with a particular type of magic.\n\nFrost elementals are a common type of elemental which weakens enemies with chilling magic. They will chill their target with melee and occasional ranged attacks. Their magic is much more effective in water.
actors.mobs.elemental$shockelemental.name=shock elemental
actors.mobs.elemental$shockelemental.desc=Elementals are chaotic creatures that are often created when powerful occult magic isn't properly controlled. Elementals have minimal intelligence, and are usually associated with a particular type of magic.\n\nShock elementals are a less common type of elemental which disrupts its enemies with electricity and flashes of light. In melee they will arc electricity to nearby enemies, and deal bonus damage to their primary target if they are in water. They will also occasionally focus a ranged blast of light at their target, temporarily blinding them.
actors.mobs.elemental$chaoselemental.name=chaos elemental
actors.mobs.elemental$chaoselemental.desc=Elementals are chaotic creatures that are often created when powerful occult magic isn't properly controlled. Elementals have minimal intelligence, and are usually associated with a particular type of magic.\n\nChaos elementals are rare and dangerous elementals which haven't stabilized to a particular element. They will unleash wild unpredictable magic when they attack.
actors.mobs.eye.name=evil eye
actors.mobs.eye.deathgaze_kill=The deathgaze killed you...
actors.mobs.eye.desc=Evil Eyes are floating balls of pent up demonic energy. While they are capable of melee combat, their true strength comes from their magic.\n\nAfter building energy for a short time an Evil Eye will unleash a devastating beam of energy called the _deathgaze._ Anything within the Evil Eye's sights will take tremendous damage, wise adventurers will run for cover.
actors.mobs.fetidrat.name=fetid rat
actors.mobs.fetidrat.desc=Something is clearly wrong with this rat. Its greasy black fur and rotting skin are very different from the healthy rats you've seen previously. Its pale green eyes make it seem especially menacing.\n\nThe rat carries a cloud of horrible stench with it, it's overpoweringly strong up close.\n\nDark ooze dribbles from the rat's mouth, it eats through the floor but seems to dissolve in water.
actors.mobs.fungalcore.name=fungal core
actors.mobs.fungalcore.desc=This gigantic mushroom must be the source of all the fungal activity in this cave.
actors.mobs.fungalsentry.name=fungal sentry
actors.mobs.fungalsentry.desc=This especially tall mushroom acts as a point of defense for the larger fungal network living in this cave.\n\nIt is immobile, but will shoot precise blasts of poison at anything that gets within its line of sight. While the impact of these blasts is fairly weak, _they can stack up deadly amounts of poison very quickly._ While it can be killed, it's probably best to avoid it.
actors.mobs.fungalspinner.name=fungal spinner
actors.mobs.fungalspinner.desc=This cave spinner appears to be being controlled by a parasitic fungus. The fungus has also changed its abilities, replacing its web and venom sacks with fungal growth.\n\nThe fungal spinner will spit plant life at you instead of webs, spreading fungal vegetation and potentially rooting you. While it can't poison, the fungal spinner will gain substantial damage resistance if it is adjacent to any mushrooms.
actors.mobs.ghoul.name=dwarven ghoul
actors.mobs.ghoul.desc=As dwarven society slowly began to collapse, and the current king of the dwarves seized absolute power, those who were weak or who resisted him were not treated well. As the king grew more adept at wielding dark magic, he bent these dwarves to his will, and now they make up the footsoldiers of his army.\n\nGhouls are not especially strong on their own, but always travel in groups and are much harder to kill in large numbers. _When a ghoul is defeated, it will rise again after a few turns as long as another ghoul is nearby._
actors.mobs.gnoll.name=gnoll scout
actors.mobs.gnoll.desc=Gnolls are hyena-like humanoids. They dwell in sewers and dungeons, venturing up to raid the surface from time to time. Gnoll scouts are regular members of their pack, they are not as strong as brutes and not as intelligent as shamans.
actors.mobs.gnollgeomancer.name=gnoll geomancer
actors.mobs.gnollgeomancer.warning=The geomancer begins to stir. Make sure you're ready before you continue!
actors.mobs.gnollgeomancer.alert=The geomancer awakens! The entire cave seems to shift as it leaps away while laughing madly!
actors.mobs.gnollgeomancer.rock_kill=The flying boulder killed you...
actors.mobs.gnollgeomancer.rockfall_kill=The falling rocks killed you...
actors.mobs.gnollgeomancer.desc=This impressively tall senior gnoll must be the source of the various earth-moving magic around here, and the organizer of all the gnoll activity. Unlike the gnoll sappers in the area, the geomancer is quite adept with its magic, and cannot be damaged by thrown or falling rocks. It doesn't have any way to fight in melee combat though.
actors.mobs.gnollgeomancer.desc_armor=The geomancer is currently encased in a layer of rock armor. _You'll need to get up close and break it away with your pickaxe before you can damage the geomancer._
actors.mobs.gnollgeomancer.desc_armor_sapper=_A nearby gnoll sapper is holding a device that is empowering the geomancer's rock armor. You won't be able to damage it at all right now!_
actors.mobs.gnollgeomancer.desc_sleeping=This impressively tall gnoll shaman is surrounded by a layer of rock, and looks almost like a statue. Looking closely you can see the rock magically move in time with the senior gnoll's breathing. It can't be harmed while encased in rock like this, and it appears to be enjoying a literal dirt nap.\n\nYou can probably break through the layers of rock with your pickaxe, but _be sure you're ready for a fight when you do so._ The geomancer must be the source of the various earth-moving magic around here, and the organizer of all the gnoll activity. _Defeating the gnolls scattered around here before fighting it might be a good idea._
actors.mobs.gnollguard.name=gnoll guard
actors.mobs.gnollguard.spear_warn=The gnoll lands a vicious blow with the tip of its spear!
actors.mobs.gnollguard.desc=A large and tough looking gnoll wielding a spear and a shield, but no helmet. These guards are likely brutes in training, roped into helping protect the mine from encroaching wildlife.\n\nThe gnoll guard is strong enough to wield the spear in one hand, but can't use it very well. _It will need fairly open space to attack at a distance, and will do notably less damage to you if you get up close._
actors.mobs.gnollguard.desc_armor=_A nearby gnoll sapper is holding a device that is granting this guard earthen armor, heavily reducing the damage it takes._
actors.mobs.gnollsapper.name=gnoll sapper
actors.mobs.gnollsapper.desc=A small and weak but intelligent gnoll with pale fur and a satchel full of various gadgets. They are likely here to assist with prospecting and mining dark gold, and have a nearby guard for protection. They are capable of fighting, but their attacks are pitifully weak, no stronger than a gnoll scout.\n\nInstead of fighting directly, sappers prefer to use the various gadgets they have to make the rocky environment attack for them. They don't know earth-moving magic themselves though, and so are pretty likely to use their gadgets recklessly. _There should be lots of ways to use their attacks against them, or their guard._
actors.mobs.gnolltrickster.name=gnoll trickster
actors.mobs.gnolltrickster.desc=A strange looking creature, even by gnoll standards. It hunches forward with a wicked grin, almost cradling the satchel hanging over its shoulder. Its eyes are wide with a strange mix of fear and excitement.\n\nThere is a large collection of poorly made darts in its satchel, they all seem to be tipped with various harmful substances.
actors.mobs.goldenmimic.name=golden mimic
actors.mobs.goldenmimic.desc=Mimics are magical creatures which can take any shape they wish. In dungeons they almost always choose a shape of a treasure chest, in order to lure in unsuspecting adventurers.\n\nGolden mimics are tougher mimics which try to attract the strongest adventurers. They have better loot, but are also much stronger than regular mimics.
actors.mobs.golem.name=golem
actors.mobs.golem.def_verb=blocked
actors.mobs.golem.desc=Golems are an attempt to correct the previous flaws in dwarven machinery via the dwarves newfound use of magic. They are much more compact and efficient compared to the DM-300 while still being very deadly.\n\nWhile golems are still too large to fit into passageways, the dwarves have given them new magical abilities to compensate. Golems can teleport themselves between rooms, and teleport enemies to them when they are out of reach.
actors.mobs.goo.name=Goo
actors.mobs.goo.notice=GLURP-GLURP!
actors.mobs.goo.defeated=glurp... glurp...
actors.mobs.goo.pumpup=Goo is pumping itself up!
actors.mobs.goo.enraged=enraged
actors.mobs.goo.gluuurp=GLUUUURP!
actors.mobs.goo.rankings_desc=Absorbed by the Goo
actors.mobs.goo.desc=Little is known about The Goo. It's quite possible that it is not even a creature, but rather a conglomerate of vile substances from the sewers that somehow gained basic intelligence. Regardless, dark magic is certainly what has allowed Goo to exist.\n\nIts gelatinous nature has let it absorb lots of dark energy, you feel a chill just from being near. If Goo is able to attack with this energy you won't live for long.
actors.mobs.goldengoo.name=Golden Goo
actors.mobs.goldengoo.notice=SHINE-GLURP!
actors.mobs.goldengoo.defeated=glurp... shine...
actors.mobs.goldengoo.pumpup=Golden Goo is charging golden radiance!
actors.mobs.goldengoo.enraged=radiant rage
actors.mobs.goldengoo.gluuurp=GOLDEN GLUUUURP!
actors.mobs.goldengoo.rankings_desc=Absorbed by the Golden Goo
actors.mobs.goldengoo.desc=A legendary radiant variant of The Goo. Infused with pure golden essence, defeating it yields unimaginable class wealth!
actors.mobs.goldengoo.reward=The Golden Goo dropped a radiant +4 %s!
actors.mobs.greatcrab.name=great crab
actors.mobs.greatcrab.noticed=The crab blocks with its massive claw.
actors.mobs.greatcrab.def_verb=blocked
actors.mobs.greatcrab.desc=This crab is gigantic, even compared to other sewer crabs. Its blue shell is covered in cracks and barnacles, showing great age. It lumbers around slowly, barely keeping balance with its massive claw.\n\nWhile the crab only has one claw, its size easily compensates. The crab holds the claw in front of any threat, shielding itself behind an impenetrable wall of carapace. However, the crab cannot block attacks it doesn't see coming, or attacks from multiple enemies at once.
actors.mobs.guard.name=prison guard
actors.mobs.guard.scorpion=Get over here!
actors.mobs.guard.def_verb=blocked
actors.mobs.guard.desc=Once keepers of the prison, these guards have long since become no different than the inmates. They shamble like zombies, brainlessly roaming through the halls in search of anything out of place, like you!\n\nThey carry chains around their hip, possibly used to pull in enemies to close range.
actors.mobs.mimic.name=mimic
actors.mobs.mimic.reveal=That chest is a mimic!
actors.mobs.mimic.hidden_hint=Something about this chest feels off... Walking up and trying to open it might be a bad idea.
actors.mobs.mimic.desc=Mimics are magical creatures which can take any shape they wish. In dungeons they almost always choose a shape of a treasure chest, in order to lure in unsuspecting adventurers.\n\nMimics have a nasty bite, but often hold more treasure than a regular chest.
actors.mobs.necromancer.name=necromancer
actors.mobs.necromancer.desc=These apprentice dark mages have flocked to the prison, as it is the perfect place to practise their evil craft.\n\nNecromancers will summon and empower skeletons to fight for them. Killing the necromancer will also kill the skeleton it summons.
actors.mobs.necromancer$necroskeleton.name=necromancer's skeleton
actors.mobs.necromancer$necroskeleton.desc=This skeleton has been summoned by a necromancer. It behaves just like a regular skeleton, and will die when the necromancer which summoned it is slain.
actors.mobs.mob.died=You hear something die in the distance.
actors.mobs.mob.rage=#$%^
actors.mobs.mob.rankings_desc=Slain by: %s
actors.mobs.monk.name=dwarf monk
actors.mobs.monk.def_verb=blocked
actors.mobs.monk.parried=parried
actors.mobs.monk.desc=These monks are fanatics, who have devoted themselves to protecting their king through physical might. So great is their devotion that they have totally surrendered their minds to their king, and now roam the dwarvern city like mindless zombies.\n\nMonks rely solely on the art of hand-to-hand combat, and are able to use their unarmed fists both for offense and defense. When they become focused, monks will parry the next physical attack used against them, even if it was otherwise guaranteed to hit. Monks build focus more quickly while on the move, and more slowly when in direct combat.
actors.mobs.monk$focus.name=focused
actors.mobs.monk$focus.desc=This monk is perfectly honed in on their target, and seem to be anticipating their moves before they make them.\n\nWhile focused, the next physical attack made against this character is guaranteed to miss, no matter what circumstances there are. Parrying this attack will spend the monk's focus, and they will need to build it up again to parry another attack. Monks build focus more quickly while they are moving.
actors.mobs.phantompiranha.name=phantom piranha
actors.mobs.phantompiranha.teleport_away=The phantom piranha teleports away...
actors.mobs.phantompiranha.desc=Phantom piranhas are a rare breed of piranha with magical abilities and eerie translucent bodies. They are capable of teleporting as they are being attacked, either to escape or to quickly get close to their enemy!\n\nWhile they are annoying to fight, their meat is prized for its magical properties.
actors.mobs.piranha.name=giant piranha
actors.mobs.piranha.desc=These carnivorous fish are not natural inhabitants of underground pools. They were bred specifically to protect flooded treasure vaults.
actors.mobs.pylon.name=power pylon
actors.mobs.pylon.desc_inactive=A power pylon, meant to help regulate the electricity which powers the machinery in this area.\n\nThe pylon is currently inactive and immune to damage.
actors.mobs.pylon.desc_active=A power pylon, meant to help regulate the electricity which powers the machinery in this area. The pylon is currently surging with electrical energy, this must be what's supercharging DM-300!\n\nIn this state pylons are vulnerable, but will arc electricity to nearby cells in a clockwise pattern. Due to their heavy metal construction, pylons are resistant to large amounts of damage.
actors.mobs.rat.name=marsupial rat
actors.mobs.rat.desc=Marsupial rats are aggressive but rather weak denizens of the sewers. They have a nasty bite, but are only life threatening in large numbers.
actors.mobs.ripperdemon.name=ripper demon
actors.mobs.ripperdemon.leap=The ripper demon prepares to leap!
actors.mobs.ripperdemon.desc=These horrific creatures are the result of the many dwarven corpses in this region being put to use by demonic forces. Rippers are emaciated ghoulish creatures that resemble dwarves, but with broken bodies and long sharp claws made of bone.\n\nRipper demons are not particularly durable, but they are agile and dangerous. They are capable of leaping great distances to quickly reach targets before goring them with their claws.
actors.mobs.rotheart.name=rot heart
actors.mobs.rotheart.desc=A Rotberry's fruit is very unique. Instead of rotting away and providing nutrients, the fruit grows, hardens, and encompasses the seed. It provides protection for the internal organs which grow inside the fruit. This giant orb is referred to as the heart of an adult rotberry plant.
actors.mobs.rotlasher.name=rot lasher
actors.mobs.rotlasher.desc=The rot lasher is a part of a mature rotberry plant's root structure, and also their primary means of defense. Lashers are blind and stuck into the ground, but will violently assault any nearby threat after taking a moment to detect them. When there is no nearby enemies, they stand motionless, attempting to blend in with surrounding vegetation.
actors.mobs.scorpio.name=scorpio
actors.mobs.scorpio.desc=These huge arachnid-like demonic creatures avoid close combat, preferring to fire crippling serrated spikes from long distances.
actors.mobs.senior.name=senior monk
actors.mobs.senior.desc=These monks are fanatics, who have devoted themselves to protecting their king through physical might. So great is their devotion that they have totally surrendered their minds to their king, and now roam the dwarvern city like mindless zombies.\n\nThis monk has mastered the art of hand-to-hand combat, and is able to gain focus while moving much more quickly than regular monks. When they become focused, monks will parry the next physical attack used against them, even if it was otherwise guaranteed to hit. Monks build focus more quickly while on the move, and more slowly when in direct combat.
actors.mobs.shaman.name=gnoll shaman
actors.mobs.shaman.bolt_kill=The magic bolt killed you...
actors.mobs.shaman.desc=Gnoll shamans are intelligent gnolls who use battle spells to compensate for their lack of might. They have a very respected position in gnoll society, despite their weaker strength.
actors.mobs.shaman$redshaman.spell_desc=This shaman is wearing a red mask, and will use magic that temporarily _weakens your attacking power._
actors.mobs.shaman$blueshaman.spell_desc=This shaman is wearing a blue mask, and will use magic that temporarily _increases the damage you take._
actors.mobs.shaman$purpleshaman.spell_desc=This shaman is wearing a purple mask, and will use magic that temporarily _reduces your accuracy and evasion._
actors.mobs.armoredbrute.name=armored brute
actors.mobs.armoredbrute.desc=The most senior gnoll brutes often wear powerful armor to show their status. The armor makes these brutes much more resilient to physical damage, and their greater discipline means they can rage for much longer before succumbing to their wounds.
actors.mobs.skeleton.name=skeleton
actors.mobs.skeleton.explo_kill=You were killed by the explosion of bones...
actors.mobs.skeleton.def_verb=blocked
actors.mobs.skeleton.desc=Skeletons are composed of the bones of unlucky adventurers and inhabitants of the prison, animated by emanations of evil magic from the depths below. After they have been damaged enough, skeletons will disintegrate in an explosion of bones. The shrapnel from this explosion is harmful to anything nearby, but armor is very effective at mitigating it.
actors.mobs.slime.name=slime
actors.mobs.slime.def_verb=blocked
actors.mobs.slime.desc=Slimes are strange, slightly magical creatures with a rubbery outer body and a liquid core. The city sewers provide them with an ample supply of water and nutrients.\n\nBecause of their elastic outer membrane, it is difficult to deal more than _6 damage_ to slimes from any one attack.
actors.mobs.snake.name=sewer snake
actors.mobs.snake.hint=Try using the examine button on a snake to learn how to counter them.
actors.mobs.snake.desc=These oversized serpents are capable of quickly slithering around blows, making them quite hard to hit. Magical attacks or surprise attacks are capable of catching them off-guard however.\n\nYou can perform a surprise attack by attacking while out of the snake's vision. One way is to let a snake chase you through a doorway and then _strike just after it moves into the door._
actors.mobs.spectralnecromancer.name=spectral necromancer
actors.mobs.spectralnecromancer.desc=While Skeletons are a necromancer’s bread and butter, some prefer to look into other less corporeal minions. Spectral necromancers have chosen wraiths as their minion of choice!\n\nIndividual wraiths aren't as strong as skeletons, but these necromancers aren't afraid to summon a bunch of them!
actors.mobs.spinner.name=cave spinner
actors.mobs.spinner.desc=These greenish furry cave spiders try to avoid direct combat. Instead they prefer to wait in the distance while their victim struggles in their excreted cobweb, slowly dying from their venomous bite. They are capable of shooting their webs great distances, and will try to block whatever path their prey is taking.
actors.mobs.statue.name=animated statue
actors.mobs.statue.def_verb=blocked
actors.mobs.statue.desc=You would think that it's just another one of this dungeon's inanimate statues, but its red glowing eyes give it away.
actors.mobs.statue.desc_weapon=While the statue itself is made of stone, the _%s_ it's wielding looks real.
actors.mobs.succubus.name=succubus
actors.mobs.succubus.desc=Succubi are shapeshifting demons that manipulate the minds of their prey. This one has taken the form of a pale gothic humanoid, perhaps to attract dwarven warlocks?\n\nSuccubi may temporarily charm their enemy when they attack, making their enemy unable to directly attack them. When succubi attack a charmed enemy, they will steal some of their life essence.
actors.mobs.swarm.name=swarm of flies
actors.mobs.swarm.desc=The deadly swarm of flies buzzes angrily. Every non-magical attack will split it into two smaller but equally dangerous swarms.
actors.mobs.tengu.name=Tengu
actors.mobs.tengu.notice_gotcha=Gotcha, %s!
actors.mobs.tengu.interesting=Let's make this interesting...
actors.mobs.tengu.notice_have=I have you now, %s!
actors.mobs.tengu.defeated=Free at last...
actors.mobs.tengu.rankings_desc=Assassinated by the Tengu
actors.mobs.tengu.desc=A famous and enigmatic assassin, named for the mask grafted to his face.\n\nTengu is held down with large clasps on his wrists and knees, though he seems to have gotten rid of his chains long ago.\n\nHe will try to use traps, deceptive magic, and precise attacks to eliminate the only thing stopping his escape: you.
actors.mobs.tengu$bombability$bombblob.desc=A cloud of superheated smoke is billowing here. Watch out, it's going to explode!
actors.mobs.tengu$bombability$bombitem.name=Smoke Bomb
actors.mobs.tengu$bombability$bombitem.cant_pickup=It's stuck to the ground, you can't move it!
actors.mobs.tengu$bombability$bombitem.desc=Tengu has thrown a strange looking smoke bomb here, which is billowing a thick hot smoke. It's making a loud ticking noise, as if its counting down to an explosion!\n\nThe bomb has anchored itself to the ground, so you can't pick it up.
actors.mobs.tengu$fireability$fireblob.desc=Tengu has thrown a fine powder that seems to be catching into steam here, it's about to ignite!
actors.mobs.tengu$shockerability$shockerblob.desc=Electrical energy is building here, anything standing on this tile will be shocked next turn!
actors.mobs.tengu$shockerability$shockeritem.name=Shocker
actors.mobs.tengu$shockerability$shockeritem.cant_pickup=It's putting out too much electricity, you can't grab it!
actors.mobs.tengu$shockerability$shockeritem.desc=Tengu has thrown a curious machine here, which seems to be made of DM-100 parts. The machine is constantly arcing electricity around it, but it seems to be going in a predictable pattern.\n\nWith all the electricity arcing around it, there's no way you can pick this up.
actors.mobs.thief.name=crazy thief
actors.mobs.thief.stole=The thief stole %s from you!
actors.mobs.thief.carries=\n\nThe thief is carrying a _%s._ Stolen obviously.
actors.mobs.thief.escapes=The thief gets away with your %s!
actors.mobs.thief.desc=Though these inmates roam free of their cells, this place is still their prison. Over time, this place has taken their minds as well as their freedom. Long ago, these crazy thieves and bandits have forgotten who they are and why they steal.\n\nThese enemies are more likely to steal and run than they are to fight. Make sure to keep them in sight, or you might never see your stolen item again.
actors.mobs.oofthief.name=OOF thief
actors.mobs.oofthief.stole=The thief stole %s from you! You can recover it from resetting shop depths and buying %s from there!
actors.mobs.oofthief.escapes=The thief teleports away!
actors.mobs.oofthief.desc=Genetically engineered by tormented sparks of robots and funded by impossibly modified foxes, this variant of thief has been augmented to prevail above all its prison brothers.\n\nIt is roughly 2.5x times stronger than normal thieves in both resistance and accuracy, attacks 3 times in a row and sells all stolen loot to incredibly corrupted shop companies. It also has teleportation device to hide from its victims once enough property is stolen.\n\nOne of OOF thief's only weaknesses is its movement speed: it moves 3x faster than a normal human, but has _tendency to slip on a moss, or a rock, or a twig_ and make no progress in moving right to its target.\n\nOn the last breath, OOF thief will enter desperation mode, being immune to any damage for short time and moving significantly faster.
actors.mobs.tormentedspirit.name=tormented spirit
actors.mobs.tormentedspirit.desc=Tormented spirits are otherwise good-natured spirits that has been afflicted by a curse. So long as they are cursed they will attack just like a wraith, and are more powerful as well!\n\nIt may be possible to cleanse the curse by using the right item while next to the spirit. If the curse is lifted the spirit will surely be grateful...
actors.mobs.tormentedspirit.thank_you=Thank you...
actors.mobs.warlock.name=dwarf warlock
actors.mobs.warlock.bolt_kill=The shadow bolt killed you...
actors.mobs.warlock.desc=As the dwarves' interests shifted from engineering to arcane arts, warlocks came to power in the city. They started with elemental magic, but soon switched to demonology and necromancy. The strongest of these warlocks seized the throne of the dwarven city, and his cohorts were allowed to continue practising their dark magic, so long as they surrendered their free will to him.\n\nThese warlocks possess powerful disruptive magic, and are able to temporarily hinder the upgrade magic applied to your equipment. The more upgraded an item is, the more strongly it will be affected.
actors.mobs.wraith.name=wraith
actors.mobs.wraith.desc=A wraith is a vengeful spirit of a sinner, whose grave or tomb was disturbed. Being an ethereal entity, it is very hard to hit with a regular weapon.
actors.mobs.yogdzewa.name=Yog-Dzewa
actors.mobs.yogdzewa.notice=I. SEE. YOU.
actors.mobs.yogdzewa.darkness=The darkness pulls in closer...
actors.mobs.yogdzewa.hope=YOUR. HOPE. IS. AN. ILLUSION!
actors.mobs.yogdzewa.defeated=...
actors.mobs.yogdzewa.rankings_desc=Devoured by Yog-Dzewa
actors.mobs.yogdzewa.desc=Yog-Dzewa is an Old God; a great monstrosity which reaches into mortal worlds and devours them to fuel its endless growth. The dwarves must have attracted the attention of this cosmic horror while toying with dark magics, and have been trying to keep it contained ever since.\n\nYog-Dzewa originates from a dimension of raw magical chaos, and cannot bring its true form into this world. Instead it has created avatars and summoned demonic minions to do its bidding here.\n\nThis giant eye is the focal point of Yog-Dzewa's power in this world. While the eye itself is immobile, it is capable of shooting powerful beams of demonic magic and summoning a variety of minions to aid it.\n\nCan drop clay, if killed by Minecraft reference.
actors.mobs.yogdzewa.desc_spawners=You can feel waves of demonic energy radiating to the eye from the floors above. Something you left alive up there must be funneling power back into Yog-Dzewa. _Yog will use this energy to summon more powerful minions!_
actors.mobs.yogdzewa$larva.name=god's larva
actors.mobs.yogdzewa$larva.rankings_desc=Devoured by Yog-Dzewa
actors.mobs.yogdzewa$larva.desc=These tiny spawn of Yog-Dzewa are simple minions that are easy to produce. While individually weak, they are summoned quickly and can become overwhelming in large numbers.
actors.mobs.yogdzewa$yogripper.rankings_desc=Devoured by Yog-Dzewa
actors.mobs.yogdzewa$yogeye.rankings_desc=Devoured by Yog-Dzewa
actors.mobs.yogdzewa$yogscorpio.rankings_desc=Devoured by Yog-Dzewa
actors.mobs.yogfist.invuln_warn=The fist is invulnerable while near to the eye!
actors.mobs.yogfist.rankings_desc=Devoured by Yog-Dzewa
actors.mobs.yogfist.desc=This fist is an aspect of Yog-Dzewa's power. Fists are linked to the power of Yog-Dzewa, and will be protected from all damage when they are close to the eye.
actors.mobs.yogfist$burningfist.name=burning fist
actors.mobs.yogfist$burningfist.desc=This fist is formed out of chaotic fiery magic. As it moves it will constantly set terrain around it ablaze. It is also capable of shooting blasts of fiery power, which spread flames where they impact.\n\nThe fist's ability to spread flames is suppressed when near water, but its heat is so great that any water around it will evaporate after a short while!
actors.mobs.yogfist$soiledfist.name=soiled fist
actors.mobs.yogfist$soiledfist.desc=This fist is formed out of chaotic earthen magic. As it moves it will constantly cause vegetation to sprout around it. It can also shoot concentrated earthen blasts that will ensnare its target in rapidly growing vines and roots!\n\nThe fist derives power from this plant life, and will resist damage based on the amount of tall or furrowed vegetation near it!
actors.mobs.yogfist$rottingfist.name=rotting fist
actors.mobs.yogfist$rottingfist.desc=This fist is formed out of living corruption. It is a towering mass of decaying flesh that can spread caustic ooze in melee and toxic gas at range. Even worse, the fist's great mass causes it to bleed instead of taking damage directly.\n\nWater can be used to wash the ooze off, but the fist is also capable of absorbing water to heal itself! Additionally, damaging the fist while it is bleeding will cause the bleed to refresh, but not stack!
actors.mobs.yogfist$rustedfist.name=rusted fist
actors.mobs.yogfist$rustedfist.desc=This fist is formed out of living metal. It is a towering mass of shifting metal that has powerful melee attacks, and can cripple its targets at range. Because of its tremendous mass, the fist will take any damage dealt to it over time, instead of immediately.\n\nThe fist is inflexible however, and cannot move into tight passageways. Additionally, while it may take damage slowly, the deferred damage will continue to increase if the fist is hit multiple times.
actors.mobs.yogfist$brightfist.name=bright fist
actors.mobs.yogfist$brightfist.teleport=The fist teleports away in a flash of light that seriously blinds you!
actors.mobs.yogfist$brightfist.desc=This fist is formed out of pure light energy. It is capable of shooting powerful rays of searing light every turn! These beams will temporarily blind you in addition to dealing heavy damage. The fist is also capable of briefly engulfing the arena in blinding light in order to escape!\n\nThe fist has no special abilities which it can use in melee range however.
actors.mobs.yogfist$darkfist.name=dark fist
actors.mobs.yogfist$darkfist.teleport=The fist teleports away in a blast of darkness that extinguishes your light source!
actors.mobs.yogfist$darkfist.desc=This fist is formed out of pure dark energy. It is capable of shooting powerful blasts of dark magic every turn! These blasts will weaken your light source in addition to dealing heavy damage. The fist is also capable of briefly engulfing the arena in darkness in order to escape!\n\nThe fist has no special abilities which it can use in melee range however.
