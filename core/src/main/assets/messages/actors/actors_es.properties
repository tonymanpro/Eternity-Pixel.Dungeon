actors.buffs.ascensionchallenge.weaken_info_no_kills=If you defeat enemies the amulet's curse will weaken!

actors.buffs.gravitychaostracker.name=gravity chaos

actors.buffs.gravitychaostracker.desc_intro=Every few turns all characters on the current dungeon floor will be thrown in a random direction.

actors.buffs.gravitychaostracker.desc_positive=You and your allies seem to be immune though.

actors.buffs.gravitychaostracker.desc_duration=It's not clear how long the effect will last for, but it can't last forever.

actors.buffs.lifelink.ondeath=El daño del enlace vital te ha matado...

actors.buffs.prismaticguard.desc_many=Esta imagen prismática también se beneficia del Poder de la Multitud. Turnos restantes: %d.

actors.hero.abilities.cleric.ascendedform.name=forma ascendida

actors.hero.abilities.cleric.ascendedform.short_desc=El Clérigo adopta una _Forma Ascendida_, obteniendo nuevos hechizos, alcance de ataque y escudos.

actors.hero.abilities.cleric.ascendedform.desc=El Clérigo proyecta energía sagrada, adoptando una forma radiante durante 10 turnos. En esta forma puede lanzar nuevos hechizos, gana 2 casillas de alcance de ataque, 30 de escudo y cualquier hechizo adicional otorgará 10 de escudo por carga gastada del tomo sagrado.\n\nEl escudo de la forma ascendida y sus hechizos no decae normalmente, pero desaparecerá de inmediato al terminar la forma ascendida. Se puede reutilizar para renovar su duración.

actors.hero.abilities.cleric.trinity.name=trinidad

actors.hero.abilities.cleric.trinity.no_imbue=¡Trinidad no tiene ningún efecto asignado actualmente, usa uno de sus hechizos!

actors.hero.abilities.cleric.trinity.no_duplicate=¡Trinidad no puede duplicar un efecto que ya tengas equipado!

actors.hero.abilities.cleric.trinity.ench_glyph_use=Trinidad aplicará este efecto durante _%1$d turnos_ al costo de _%2$s carga._

actors.hero.abilities.cleric.trinity.rare_ench_glyph_use=Trinidad aplicará este efecto _poderoso_ durante _%1$d turnos_ al costo de _%2$s carga._

actors.hero.abilities.cleric.trinity.wand_use=Trinidad disparará esta varita a _+%1$d_ al costo de _%2$s carga._

actors.hero.abilities.cleric.trinity.wand_multi_use=Trinidad disparará esta varita de _cargas múltiples_ a _+%1$d_ al costo de _%2$s carga._

actors.hero.abilities.cleric.trinity.thrown_use=Trinidad arrojará esta arma a _+%1$d_ al costo de _%2$s carga._

actors.hero.abilities.cleric.trinity.ring_use=Trinidad aplicará el efecto de este anillo a _+%1$d_ durante 20 turnos, al costo de _%2$s carga._

actors.hero.abilities.cleric.trinity.alchemiststoolkit_use=Trinidad aplicará el efecto de alquimia remota de este artefacto, al costo de _%2$s carga._

actors.hero.abilities.cleric.trinity.chaliceofblood_use=Trinidad aplicará la regeneración pasiva de salud a _+%1$d_ durante 20 turnos, al costo de _%2$s carga._

actors.hero.abilities.cleric.trinity.driedrose_use=Trinidad invocará a un espectro aliado corrompido con los PV de un fantasma _+%1$d_, al costo de _%2$s carga._

actors.hero.abilities.cleric.trinity.etherealchains_use=Trinidad aplicará el efecto de cadenas etéreas con alcance a _+%1$d_, al costo de _%2$s carga._

actors.hero.abilities.cleric.trinity.hornofplenty_use=Trinidad aplicará el efecto de aperitivo de este artefacto, al costo de _%2$s carga._

actors.hero.abilities.cleric.trinity.masterthievesarmband_use=Trinidad aplicará el efecto de robo a _+%1$d_, al costo de _%2$s carga._

actors.hero.abilities.cleric.trinity.sandalsofnature_use=Trinidad aplicará el efecto de enraizamiento con una semilla dañina aleatoria, al costo de _%2$s carga._

actors.hero.abilities.cleric.trinity.skeletonkey_use=Trinidad aplicará el efecto de inserción de este artefacto, al costo de _%2$s carga._

actors.hero.abilities.cleric.trinity.talismanofforesight_use=Trinidad aplicará el efecto de clarividencia a _+%1$d_, al costo de _%2$s carga._

actors.hero.abilities.cleric.trinity.timekeepershourglass_use=Trinidad aplicará el congelamiento temporal durante _%1$d_ turnos, al costo de _%2$s carga._

actors.hero.abilities.cleric.trinity.unstablespellbook_use=Trinidad aplicará un pergamino aleatorio con un _%1$d/10_ de probabilidad de versión exótica sin costo extra, al costo de _%2$s carga._

actors.hero.abilities.cleric.trinity.cost=El costo de carga de esta habilidad varía, pero suele ser de _%d._

actors.hero.abilities.cleric.trinity.short_desc=El Clérigo obtiene una _Trinidad_ de habilidades que emulan equipo descubierto y pueden asignarse mediante nuevos hechizos.

actors.hero.abilities.cleric.trinity.desc=El Clérigo obtiene una _Trinidad_ de habilidades de armadura asignables a efectos de objetos mediante tres nuevos hechizos. Cada hechizo emula equipo identificado en la partida: forma física (armas y armaduras), forma mental (varitas y armas arrojadizas) y forma espiritual (anillos y artefactos).\n\nCada forma puede imbuirse con un efecto a la vez. Trinidad no duplicará el efecto de equipo que ya lleves puesto.

actors.hero.abilities.cleric.powerofmany.name=poder de la multitud

actors.hero.abilities.cleric.powerofmany.prompt_default=Elige un aliado o ubicación

actors.hero.abilities.cleric.powerofmany.prompt_ally=Dirige a tu aliado de luz

actors.hero.abilities.cleric.powerofmany.ally_exists=Ya tienes un aliado potenciado.

actors.hero.abilities.cleric.powerofmany.no_vision=No puedes apuntar a una casilla fuera de tu vista.

actors.hero.abilities.cleric.powerofmany.only_allies=Solo puedes potenciar aliados.

actors.hero.abilities.cleric.powerofmany.short_desc=El Clérigo canaliza el _Poder de la Multitud_, potenciando a un aliado existente o creando uno nuevo.

actors.hero.abilities.cleric.powerofmany.desc=El Clérigo canaliza el _Poder de la Multitud_, potenciando a un aliado existente o creando uno nuevo durante 100 turnos. Apuntar a un espacio vacío crea un nuevo aliado.\n\nEl aliado potenciado inflige +25% de daño, recibe -25% de daño y comparte su visión con el Clérigo. También gana 25 de escudo al activarse.\n\nEl Clérigo obtiene tres nuevos hechizos exclusivos para aliados potenciados.

actors.hero.spells.auraofprotection.name=aura de protección

actors.hero.spells.auraofprotection.short_desc=Reduce el daño recibido para ti y tus aliados cercanos.

actors.hero.spells.auraofprotection.desc=El Paladín irradia energía protectora en un aura brillante a su alrededor durante 20 turnos. Cualquier aliado a menos de 2 casillas (incluyéndose a sí mismo) recibe %1$d%% menos de daño y obtiene el efecto del glifo de armadura del Paladín a +%2$d%% de potencia.\n\nEsta reducción se aplica antes de otras mitigaciones de daño.

actors.hero.spells.beamingray.name=rayo radiante

actors.hero.spells.beamingray.no_space=No hay espacio para que tu aliado aparezca allí.

actors.hero.spells.beamingray.out_of_range=Esa ubicación está fuera de alcance.

actors.hero.spells.beamingray.short_desc=Teletransporta a tu aliado y le otorga daño adicional.

actors.hero.spells.beamingray.desc=El Clérigo canaliza el poder de su aliado en un rayo de luz que lo transporta a una ubicación. Si colisiona con un enemigo, el aliado aparecerá cerca y lo atacará.\n\nEl rayo tiene un alcance máximo de %1$d casillas y aumenta el daño del Poder de la Multitud a +%2$d%% durante 10 turnos contra el enemigo más cercano dentro de 4 casillas.

actors.hero.spells.blessspell.name=bendición

actors.hero.spells.blessspell.short_desc=Otorga bendición y precisión sagrada.

actors.hero.spells.blessspell.desc=El Clérigo bendice a sí mismo o a otro personaje visible.\n\nAl lanzarse sobre sí mismo otorga %1$d turnos de bendición y %2$d de barrera.\n\nAl lanzarse sobre otros personajes otorga %3$d turnos de bendición y %4$d de curación. La curación excedente se convierte en barrera.

actors.hero.spells.bodyform.name=forma física

actors.hero.spells.bodyform.short_desc=Asigna Trinidad a un encantamiento o glifo.

actors.hero.spells.bodyform.desc=El Clérigo elige un encantamiento o glifo identificado en esta partida e imbuye Trinidad con su efecto durante %d turnos.

actors.hero.spells.cleanse.name=purificación

actors.hero.spells.cleanse.short_desc=Elimina efectos negativos y otorga escudo.

actors.hero.spells.cleanse.desc=El Clérigo purifica todos los efectos perjudiciales de sí mismo y aliados visibles. Tras el hechizo, los personajes afectados ganan %1$d turnos de inmunidad a debuffs y %2$d de barrera.

actors.hero.spells.clericspell.prompt=Elige un objetivo

actors.hero.spells.clericspell.no_target=No hay ningún objetivo allí.

actors.hero.spells.clericspell.invalid_target=No puedes apuntar a esa ubicación.

actors.hero.spells.clericspell.invalid_enemy=No puedes apuntar a ese enemigo.

actors.hero.spells.clericspell.charge_cost=Costo de carga: %d

actors.hero.spells.divinesense.name=sentido divino

actors.hero.spells.divinesense.short_desc=Otorga visión mental temporal en un amplio radio.

actors.hero.spells.divinesense.desc=El Clérigo enfoca sus sentidos en el entorno, ganando visión mental con un alcance de %d casillas durante 50 turnos. Se lanza instantáneamente.

actors.hero.spells.divineintervention.name=intervención divina

actors.hero.spells.divineintervention.short_desc=Protege contra la muerte y genera una barrera divina inquebrantable.

actors.hero.spells.divineintervention.desc=El Clérigo canaliza una enorme cantidad de poder en sí mismo y sus aliados, aumentando los escudos a %1$d y extendiendo la Forma Ascendida por %2$d turnos.

actors.hero.spells.flash.name=destello

actors.hero.spells.flash.prompt=Elige una ubicación

actors.hero.spells.flash.short_desc=Ciega y aturde a los enemigos cercanos al instante.

actors.hero.spells.flash.desc=El Clérigo se teletransporta instantáneamente a cualquier ubicación descubierta y desocupada dentro de su alcance. Cuesta más cargas cada vez que se usa en la misma Forma Ascendida.

actors.hero.spells.guidinglight.name=luz guía

actors.hero.spells.guidinglight.short_desc=Inflige daño mágico a distancia y garantiza un impacto certero.

actors.hero.spells.guidinglight.desc=El Clérigo dispara un proyectil de energía mágica que impacta a un objetivo infligiendo 2-8 de daño e iluminándolo. El siguiente ataque físico cuerpo a cuerpo contra el enemigo iluminado tiene impacto garantizado.

actors.hero.spells.guidinglight.desc_priest=_Este hechizo es más poderoso cuando lo lanza el Sacerdote._ El primer lanzamiento cada 50 turnos no cuesta cargas del tomo, y la iluminación puede consumirse con varitas, aliados o artefactos para infligir daño mágico extra igual al nivel del Sacerdote + 5.

actors.hero.spells.hallowedground.name=tierra consagrada

actors.hero.spells.hallowedground.prompt=Elige una ubicación

actors.hero.spells.hallowedground.short_desc=Cura aliados, ralentiza enemigos y crea vegetación sagrada.

actors.hero.spells.hallowedground.desc=El Sacerdote consagra el suelo cercano creando un área de %1$dx%1$d durante 20 turnos.\n\nAl lanzarse cura a todos los aliados por 15 PV (los aliados sanos y el Sacerdote reciben escudo), enraíza brevemente a los enemigos y hace brotar hierba corta.\n\nEl terreno consagrado cura 1 PV por turno a los aliados, ralentiza enemigos y hace crecer hierba alta aleatoriamente.

actors.hero.spells.holyintuition.name=intuición sagrada

actors.hero.spells.holyintuition.prompt=Elige un objeto

actors.hero.spells.holyintuition.cursed=Sientes una magia malévola acechando dentro de este objeto.

actors.hero.spells.holyintuition.uncursed=Este objeto está libre de magia malévola.

actors.hero.spells.holyintuition.short_desc=Identifica si un objeto está maldito sin tener que equiparlo.

actors.hero.spells.holyintuition.desc=El Clérigo enfoca sus sentidos en un objeto y determina si está maldito o no sin necesidad de equiparlo.

actors.hero.spells.holylance.name=lanza sagrada

actors.hero.spells.holylance.short_desc=Perfora a los enemigos en línea recta con luz penetrante.

actors.hero.spells.holylance.desc=El Sacerdote concentra energía en una devastadora lanza arrojadiza de luz que inflige %1$d-%2$d de daño (máximo contra no-muertos y demonios). Tiene un enfriamiento de 30 turnos.

actors.hero.spells.holyward.name=protección sagrada

actors.hero.spells.holyward.glyph_name=%s de luz

actors.hero.spells.holyward.glyph_desc=Este glifo aumenta ligeramente el daño bloqueado por la armadura.

actors.hero.spells.holyward.short_desc=Aumenta temporalmente el bloqueo de la armadura.

actors.hero.spells.holyward.desc=El Clérigo imbuye su armadura con glifos de luz sagrada, aumentando su bloqueo de daño en 1 durante 50 turnos. Se lanza instantáneamente.

actors.hero.spells.holyward.desc_paladin=_Más poderoso con el Paladín._ El bloqueo extra aumenta a 3, no anula glifos existentes y lanzar hechizos extiende su duración en 10 turnos por carga.

actors.hero.spells.holyweapon.name=arma sagrada

actors.hero.spells.holyweapon.ench_name=%s sagrado/a

actors.hero.spells.holyweapon.ench_desc=Los enemigos golpeados por un arma sagrada reciben daño mágico adicional.

actors.hero.spells.holyweapon.short_desc=Encanta temporalmente el arma para infligir daño sagrado.

actors.hero.spells.holyweapon.desc=El Clérigo encanta su arma con energía sagrada, infligiendo 2 de daño mágico adicional en cada golpe durante 50 turnos.

actors.hero.spells.holyweapon.desc_paladin=_Más poderoso con el Paladín._ El daño mágico extra aumenta a 6, no anula encantamientos existentes y lanzar hechizos extiende su duración.

actors.hero.spells.judgement.name=juicio

actors.hero.spells.judgement.short_desc=Daña a todos los enemigos visibles.

actors.hero.spells.judgement.desc=El Clérigo golpea el suelo causando una erupción de luz que inflige daño a todos los enemigos visibles. Inflige %1$d-%2$d de daño base, más un 33%% adicional por cada hechizo lanzado en Forma Ascendida.\n\nActualmente Juicio infligirá %3$d-%4$d de daño.

actors.hero.spells.layonhands.name=imposición de manos

actors.hero.spells.layonhands.short_desc=Cura instantáneamente o proporciona escudo a ti o a un aliado.

actors.hero.spells.layonhands.desc=El Paladín canaliza energía sagrada con sus manos. Puede curar a un personaje adyacente por %1$d PV o ganar %1$d de escudo para sí mismo. Se lanza instantáneamente.

actors.hero.spells.lifelinkspell.name=enlace vital

actors.hero.spells.lifelinkspell.short_desc=Comparte el daño con un aliado y reduce el daño recibido.

actors.hero.spells.lifelinkspell.desc=El Clérigo fortalece el vínculo con su aliado potenciado compartiendo el daño durante %1$d turnos y reduciendo el daño recibido en un -%2$d%%.

actors.hero.spells.mindform.name=forma mental

actors.hero.spells.mindform.short_desc=Asigna Trinidad a una varita o arma arrojadiza.

actors.hero.spells.mindform.desc=El Clérigo imbuye Trinidad con el efecto de una varita o arma arrojadiza a +%d.

actors.hero.spells.mnemonicprayer.name=plegaria mnemónica

actors.hero.spells.mnemonicprayer.short_desc=Extiende la duración de estados en un objetivo y reaplica iluminación.

actors.hero.spells.mnemonicprayer.desc=El Sacerdote extiende la duración de todos los estados en un objetivo por %1$d turnos. Se lanza instantáneamente.

actors.hero.spells.radiance.name=radiancia

actors.hero.spells.radiance.short_desc=Ilumina y aturde brevemente a todos los enemigos visibles.

actors.hero.spells.radiance.desc=El Sacerdote estalla en luz sagrada, aturdiendo a todos los enemigos visibles durante 3 turnos y activando el daño de iluminación.

actors.hero.spells.recallinscription.name=recordar inscripción

actors.hero.spells.recallinscription.short_desc=Repite el efecto de un pergamino o piedra rúnica reciente.

actors.hero.spells.recallinscription.desc=El Clérigo repite el efecto de una runa o pergamino usado en los últimos %s turnos.

actors.hero.spells.shieldoflight.name=escudo de luz

actors.hero.spells.shieldoflight.short_desc=Otorga armadura temporal contra un objetivo.

actors.hero.spells.shieldoflight.desc=El Clérigo crea una barrera de luz entre él y un enemigo, aumentando el bloqueo de armadura contra ese enemigo en %1$d-%2$d durante 5 turnos. Se lanza instantáneamente.

actors.hero.spells.spiritform.name=forma espiritual

actors.hero.spells.spiritform.short_desc=Asigna Trinidad a un anillo o artefacto.

actors.hero.spells.spiritform.desc=El Clérigo imbuye Trinidad con el poder de un anillo (+%1$d) o artefacto (+%2$d) identificado en la partida.

actors.hero.spells.smite.name=castigo divino

actors.hero.spells.smite.short_desc=Ataque certero garantizado con daño mágico extra y potencia de encantamiento.

actors.hero.spells.smite.desc=El Paladín infunde un golpe cuerpo a cuerpo con poder destructor sagrado. Garantiza el impacto, tiene +300%% de potencia de encantamiento y añade %1$d-%2$d de daño mágico adicional.

actors.hero.spells.stasis.name=estasis

actors.hero.spells.stasis.short_desc=Guarda temporalmente al aliado fuera de la mazmorra preservando sus estados.

actors.hero.spells.stasis.desc=El Clérigo resguarda a su aliado en estasis energética durante hasta %d turnos, preservando todos sus beneficios intactos.

actors.hero.spells.sunray.name=rayo solar

actors.hero.spells.sunray.short_desc=Dispara un rayo cegador de luz divina.

actors.hero.spells.sunray.desc=El Clérigo dispara un haz de luz cegadora que inflige %1$d-%2$d de daño y ciega al objetivo por %3$d turnos (máximo daño contra demonios y no-muertos).

actors.hero.spells.walloflight.name=muro de luz

actors.hero.spells.walloflight.short_desc=Crea un muro sólido de luz que bloquea el paso de los enemigos.

actors.hero.spells.walloflight.desc=El Paladín crea un muro sólido de luz de %1$d casillas de ancho durante 20 turnos que repele y bloquea a los enemigos.

actors.hero.spells.walloflight.early_end=Disipas el muro de luz.

actors.hero.hero.key_distracted=No logras abrir la cerradura, tendrás que seguir intentándolo.

actors.hero.heroclass.cleric=clérigo

actors.hero.heroclass.cleric_desc_short=El Clérigo es un lanzador de conjuros divinos que usa su _tomo sagrado_ para canalizar magia divina. Puede _aprender y mejorar hechizos_ mediante talentos.

actors.hero.heroclass.cleric_desc=El Clérigo comienza con un _tomo sagrado único_, que puede usar para lanzar varios hechizos.\n\nLa mayoría de los talentos del Clérigo se centran en aprender o mejorar hechizos.\n\nEl Clérigo también comienza con _un garrote_, armadura de tela, un pellejo de agua y una bolsa de terciopelo.\n\nEl Clérigo identifica automáticamente:\n_-_ Pergaminos de Identificación\n_-_ Pociones de Pureza\n_-_ Pergaminos de Eliminar Maldición

actors.hero.heroclass.cleric_unlock=Para desbloquear al Clérigo, _purifica completamente la maldición de cualquier pieza de equipamiento maldito._

actors.hero.heroclass.cleric_perk_desc=El Clérigo obtiene cargas de su tomo sagrado al comer alimentos.\n\nEl Clérigo puede usar Intuición Sagrada para discernir si los objetos están malditos.\n\nLos ataques y hechizos del Clérigo infligen daño sagrado adicional contra los no-muertos y demonios.\n\nEl Clérigo puede recordar inscripciones divinas al leer pergaminos.\n\nEl escudo sagrado del Clérigo lo protege contra daño letal y se regenera con el tiempo.

actors.hero.herosubclass.priest=sacerdote

actors.hero.herosubclass.priest_short_desc=El _Sacerdote_ obtiene nuevos hechizos de largo alcance y una versión potenciada de luz guía.

actors.hero.herosubclass.priest_desc=Los sacerdotes canalizan su poder sagrado en el combate a distancia y el apoyo táctico.\n\nEl Sacerdote puede lanzar _Luz Guía_ gratis una vez cada 50 turnos, ilumina a los enemigos objetivo de sus hechizos y puede consumir la iluminación con aliados o varitas para infligir daño extra igual a su nivel + 5.\n\nTambién obtiene el hechizo _Radiancia_, que disipa la oscuridad y aturde a los enemigos visibles.

actors.hero.herosubclass.paladin=paladín

actors.hero.herosubclass.paladin_short_desc=El _Paladín_ obtiene nuevos hechizos de corto alcance y versiones potenciadas de arma y protección sagrada.

actors.hero.herosubclass.paladin_desc=Los paladines combinan artes sagradas con el combate cuerpo a cuerpo y defensas resistentes. Protegen con su presencia a los aliados y castigan a los herejes con golpes imbuidos en luz destructiva.

actors.hero.heroclass.barbarian=bárbaro

actors.hero.heroclass.barbarian_desc_short=El Bárbaro es un guerrero feroz de combate cuerpo a cuerpo impulsado por la _furia salvaje_. Destaca blandiendo armas pesadas y comandando compañeros de batalla.

actors.hero.heroclass.barbarian_desc=El Bárbaro comienza con una _Hacha de Mano_, armadura de tela reforzada con un sello ancestral, piedras arrojadizas y un pellejo de agua.\n\nEl Bárbaro acumula furia en combate, aumentando su daño físico y reduciendo el daño recibido a medida que la batalla se intensifica.\n\nEl Bárbaro identifica automáticamente:\n_-_ Pociones de Fuerza\n_-_ Pergaminos de Furia\n_-_ Pergaminos de Identificación

actors.hero.heroclass.barbarian_unlock=El Bárbaro es un héroe exclusivo para _patrocinadores de Patreon, compradores de la edición de Steam y jugadores de Google Play Premium._

actors.hero.heroclass.barbarian_perk_desc=El Bárbaro convierte la adrenalina de batalla en poder físico adicional.\n\nEl Bárbaro obtiene armadura temporal e ímpetu al derrotar enemigos.\n\nEl Bárbaro comienza con durabilidad mejorada e instinto natural contra trampas.

actors.hero.herosubclass.warmonger=belicista

actors.hero.herosubclass.warmonger_short_desc=El _Belicista_ desata golpes de hendedura masivos y frenesí incesante en el combate cuerpo a cuerpo.

actors.hero.herosubclass.warmonger_desc=El Belicista domina técnicas ofensivas brutales, barriendo a múltiples enemigos adyacentes con fuerza abrumadora y acumulando catalizadores de furia en cascada con cada impacto.

actors.hero.herosubclass.beastmaster=señor de las bestias

actors.hero.herosubclass.beastmaster_short_desc=El _Señor de las Bestias_ comparte furia salvaje y sinergia táctica con compañeros animales.

actors.hero.herosubclass.beastmaster_desc=El Señor de las Bestias forja un vínculo profundo con las mascotas aliadas, otorgándoles mayor velocidad de ataque, mitigación de daño y compartiendo el frenesí heroico en todo el campo de batalla.

actors.hero.talent.satiated_spells.title=hechizos saciados

actors.hero.talent.satiated_spells.desc=_+1:_ Comer alimentos hace que el Clérigo gane _3 de escudo_ la próxima vez que lance un hechizo.\n\n_+2:_ Comer alimentos hace que el Clérigo gane _5 de escudo_ la próxima vez que lance un hechizo.

actors.hero.talent.satiated_spells.meta_desc=_Si este talento lo obtiene otro héroe_, en su lugar otorga escudo inmediatamente, que empezará a decaer normalmente tras 10 turnos.

actors.hero.talent.holy_intuition.title=intuición sagrada

actors.hero.talent.holy_intuition.desc=_+1:_ El Clérigo puede lanzar _Intuición Sagrada_, un hechizo que revela si un objeto está maldito al costo de _3 cargas._\n\n_+2:_ El Clérigo puede lanzar _Intuición Sagrada_, un hechizo que revela si un objeto está maldito al costo de _2 cargas._

actors.hero.talent.holy_intuition.meta_desc=_Si este talento lo obtiene otro héroe_, le permite identificar si un objeto está maldito justo antes de equiparlo (15% a +1 o 25% a +2).

actors.hero.talent.searing_light.title=luz abrasadora

actors.hero.talent.searing_light.desc=_+1:_ Los ataques físicos del Clérigo a enemigos iluminados por _Luz Guía_ infligen _+3 de daño._\n\n_+2:_ Los ataques físicos del Clérigo a enemigos iluminados por _Luz Guía_ infligen _+5 de daño._

actors.hero.talent.searing_light.meta_desc=_Si este talento lo obtiene otro héroe_, otorgará daño adicional tras usar una varita o artefacto contra un enemigo, con 20 turnos de enfriamiento.

actors.hero.talent.shield_of_light.title=escudo de luz

actors.hero.talent.shield_of_light.desc=_+1:_ El Clérigo puede lanzar _Escudo de Luz_, un hechizo instantáneo que le otorga _2-4 de armadura_ contra un objetivo durante 5 turnos por 1 carga.\n\n_+2:_ El Clérigo puede lanzar _Escudo de Luz_, otorgándole _3-6 de armadura_ contra un objetivo durante 5 turnos por 1 carga.

actors.hero.talent.shield_of_light.meta_desc=_Si este talento lo obtiene otro héroe_, reduce el daño físico recibido del enemigo objetivo en 1 (33% a +1 o 50% a +2).

actors.hero.talent.enlightening_meal.title=comida iluminadora

actors.hero.talent.enlightening_meal.desc=_+1:_ Comer alimentos le toma al Clérigo 1 turno y le otorga _0.67 cargas_ a su tomo sagrado.\n\n_+2:_ Comer alimentos le toma al Clérigo 1 turno y le otorga _1 carga_ a su tomo sagrado.

actors.hero.talent.enlightening_meal.meta_desc=_Si este talento lo obtiene otro héroe_, otorga 2 turnos de recarga de varitas y artefactos a +1, o 3 turnos a +2. No se puede usar para recargar el cuerno de la abundancia.

actors.hero.talent.recall_inscription.title=recordar inscripción

actors.hero.talent.recall_inscription.refunded=¡Tu objeto fue reembolsado!

actors.hero.talent.recall_inscription.desc=_+1:_ El Clérigo puede lanzar _Recordar Inscripción_, un hechizo que le permite repetir el efecto de la última piedra rúnica o pergamino usado dentro de _10 turnos._\n\n_+2:_ El Clérigo puede lanzar _Recordar Inscripción_, repitiendo el efecto dentro de _300 turnos._\n\nNo se puede usar con pergaminos de mejora. El costo de carga varía según el objeto: 2 para piedra rúnica, 3 para pergamino, 4 para pergamino exótico. Se duplica con pergaminos de transmutación o alquimia avanzada.

actors.hero.talent.recall_inscription.meta_desc=_Si este talento lo obtiene otro héroe_, reembolsa cualquier pergamino o piedra rúnica (10% a +1 o 15% a +2). Los pergaminos de mejora están exentos.

actors.hero.talent.sunray.title=rayo solar

actors.hero.talent.sunray.desc=_+1:_ El Clérigo puede lanzar _Rayo Solar_, infligiendo _4-8 de daño_ y cegando al objetivo durante _4 turnos_ al costo de 1 carga.\n\n_+2:_ Inflige _6-12 de daño_ y ciega por _6 turnos_ al costo de 1 carga.\n\nSiempre inflige daño máximo a no-muertos y demonios. Si el objetivo ya está cegado por Rayo Solar, lo paraliza.

actors.hero.talent.sunray.meta_desc=_Si este talento lo obtiene otro héroe_, hace que varitas y artefactos cieguen enemigos por 4 turnos (15% a +1 o 25% a +2).

actors.hero.talent.divine_sense.title=sentido divino

actors.hero.talent.divine_sense.desc=_+1:_ El Clérigo puede lanzar _Sentido Divino_, otorgándole _8 casillas_ de visión mental durante 50 turnos de forma instantánea por 2 cargas.\n\n_+2:_ Otorga _12 casillas_ de visión mental durante 50 turnos por 2 cargas.

actors.hero.talent.divine_sense.meta_desc=_Si este talento lo obtiene otro héroe_, otorga visión mental momentánea tras usar una varita o artefacto (radio de 3 casillas a +1 o 5 a +2).

actors.hero.talent.bless.title=bendición

actors.hero.talent.bless.desc=_+1:_ El Clérigo puede lanzar _Bendición_, otorgando _6 turnos de bendición y 10 de escudo_ sobre sí mismo, o _10 turnos de bendición y 10 de curación_ sobre otro personaje por 1 carga.\n\n_+2:_ Otorga _10 turnos de bendición y 15 de escudo_ sobre sí mismo, o _15 turnos de bendición y 15 de curación_ sobre otro personaje por 1 carga.\n\nLa curación excedente se convierte en escudo.

actors.hero.talent.bless.meta_desc=_Si este talento lo obtiene otro héroe_, aumenta la precisión y evasión del héroe y aliados en 3% a +1 o 5% a +2.

actors.hero.talent.cleanse.title=purificación

actors.hero.talent.cleanse.desc=_+1:_ El Clérigo puede lanzar _Purificación_, eliminando efectos de estado negativos del Clérigo y aliados cercanos, otorgándoles _10 de escudo_ por 2 cargas.\n\n_+2:_ Otorga _3 turnos de inmunidad a estados negativos_ y _20 de escudo_ por 2 cargas.\n\n_+3:_ Otorga _5 turnos de inmunidad a estados negativos_ y _30 de escudo_ por 2 cargas.

actors.hero.talent.cleanse.meta_desc=_Si este talento lo obtiene otro héroe_, purifica estados negativos del héroe tras usar una varita o artefacto (10/20/30% a +1/+2/+3).

actors.hero.talent.light_reading.title=lectura ligera

actors.hero.talent.light_reading.desc=_+1:_ El Clérigo puede usar su tomo sagrado sin equiparlo, recargándose al _25% de velocidad._\n\n_+2:_ Puede usarlo sin equipar recargándose al _50% de velocidad._\n\n_+3:_ Puede usarlo sin equipar recargándose al _75% de velocidad._

actors.hero.talent.light_reading.meta_desc=_Si este talento lo obtiene otro héroe_, aumenta la velocidad de recarga de todas las varitas en 7/13/20% a +1/+2/+3.

actors.hero.talent.holy_lance.title=lanza sagrada

actors.hero.talent.holy_lance.desc=_+1:_ El Sacerdote puede lanzar _Lanza Sagrada_, un devastador hechizo que inflige _30-55 de daño_ por 4 cargas.\n\n_+2:_ Inflige _45-83 de daño_ por 4 cargas.\n\n_+3:_ Inflige _60-110 de daño_ por 4 cargas.\n\nSiempre inflige daño máximo a no-muertos y demonios. Enfriamiento de 30 turnos.

actors.hero.talent.hallowed_ground.title=tierra consagrada

actors.hero.talent.hallowed_ground.desc=_+1:_ El Sacerdote consagra el terreno en un área de _3x3_ durante 20 turnos por 2 cargas.\n\n_+2:_ Consagra en un área de _5x5_ durante 20 turnos por 2 cargas.\n\n_+3:_ Consagra en un área de _7x7_ durante 20 turnos por 2 cargas.\n\nAl lanzarse cura 15 PV a aliados, enraíza brevemente enemigos y crea hierba corta. Luego cura lentamente a los aliados, ralentiza enemigos y hace brotar hierba alta. Otorga escudo al Sacerdote en lugar de curación y el fuego lo destruye.

actors.hero.talent.mnemonic_prayer.title=plegaria mnemónica

actors.hero.talent.mnemonic_prayer.desc=_+1:_ El Sacerdote extiende los efectos en un objetivo por _3 turnos_ por 1 carga.\n\n_+2:_ Extiende por _4 turnos_ por 1 carga.\n\n_+3:_ Extiende por _5 turnos_ por 1 carga.\n\nSe lanza instantáneamente. Solo puede extender cada efecto una vez.

actors.hero.talent.lay_on_hands.title=imposición de manos

actors.hero.talent.lay_on_hands.desc=_+1:_ El Paladín puede curar instantáneamente a un personaje cercano por _15 PV_, o ganar _15 de escudo_ para sí mismo por 1 carga.\n\n_+2:_ Cura por _20 PV_ o gana _20 de escudo_ por 1 carga.\n\n_+3:_ Cura por _25 PV_ o gana _25 de escudo_ por 1 carga.\n\nLa curación excedente se convierte en escudo. Se puede lanzar repetidamente hasta un máximo de tres acumulaciones.

actors.hero.talent.aura_of_protection.title=aura de protección

actors.hero.talent.aura_of_protection.desc=_+1:_ El Paladín otorga a sí mismo y aliados a 2 casillas _20% de resistencia al daño_ y el glifo de su armadura a _+50% de potencia_ por 20 turnos por 2 cargas.\n\n_+2:_ Otorga _30% de resistencia_ y glifo a _+75% de potencia_ por 2 cargas.\n\n_+3:_ Otorga _40% de resistencia_ y glifo a _+100% de potencia_ por 2 cargas.

actors.hero.talent.wall_of_light.title=muro de luz

actors.hero.talent.wall_of_light.desc=_+1:_ El Paladín crea un muro sólido de luz de _3 casillas de ancho_ que empuja enemigos y dura 20 turnos por 3 cargas.\n\n_+2:_ Crea un muro de _5 casillas de ancho_ por 3 cargas.\n\n_+3:_ Crea un muro de _7 casillas de ancho_ por 3 cargas.\n\nSe puede colocar en cruz o en diagonal. Solo puede existir un muro activo a la vez.

actors.hero.talent.divine_intervention.title=intervención divina

actors.hero.talent.divine_intervention.desc=_+1:_ En Forma Ascendida, el Clérigo eleva los escudos de todos hasta _150_ y extiende la Forma Ascendida por _3 turnos._\n\n_+2:_ Eleva escudos hasta _200_ y extiende por _4 turnos._\n\n_+3:_ Eleva escudos hasta _250_ y extiende por _5 turnos._\n\n_+4:_ Eleva escudos hasta _300_ y extiende por _6 turnos._\n\nCuesta 5 cargas del tomo y solo se puede lanzar una vez por Forma Ascendida.

actors.hero.talent.judgement.title=juicio

actors.hero.talent.judgement.desc=_+1:_ En Forma Ascendida, inflige _10-20 de daño_ a todos los enemigos visibles por 3 cargas.\n\n_+2:_ Inflige _15-30 de daño_ por 3 cargas.\n\n_+3:_ Inflige _20-40 de daño_ por 3 cargas.\n\n_+4:_ Inflige _25-50 de daño_ por 3 cargas.\n\nInflige +33% de daño adicional por cada hechizo lanzado en la Forma Ascendida actual.

actors.hero.talent.flash.title=destello

actors.hero.talent.flash.desc=_+1:_ En Forma Ascendida, teletransporta hasta _3 casillas_ de distancia.\n\n_+2:_ Teletransporta hasta _4 casillas._\n\n_+3:_ Teletransporta hasta _5 casillas._\n\n_+4:_ Teletransporta hasta _6 casillas._\n\nCuesta 2 cargas inicialmente y 1 carga adicional por cada uso sucesivo en la misma Forma Ascendida.

actors.hero.talent.body_form.title=forma física

actors.hero.talent.body_form.desc=El Clérigo puede lanzar _Forma Física_, imbuyendo Trinidad con un encantamiento o glifo identificado por 2 cargas.\n\n_+1:_ Otorga el efecto por _20 turnos._\n\n_+2:_ Otorga el efecto por _27 turnos._\n\n_+3:_ Otorga el efecto por _33 turnos._\n\n_+4:_ Otorga el efecto por _40 turnos._\n\nTrinidad solo puede contener un efecto físico a la vez.

actors.hero.talent.mind_form.title=forma mental

actors.hero.talent.mind_form.desc=El Clérigo puede lanzar _Forma Mental_, imbuyendo Trinidad con una varita o arma arrojadiza por 3 cargas.\n\n_+1:_ Usa el efecto del objeto como si fuera _+3._\n\n_+2:_ Usa el efecto como si fuera _+4._\n\n_+3:_ Usa el efecto como si fuera _+5._\n\n_+4:_ Usa el efecto como si fuera _+6._\n\nTrinidad solo puede contener un efecto mental a la vez.

actors.hero.talent.spirit_form.title=forma espiritual

actors.hero.talent.spirit_form.desc=El Clérigo puede lanzar _Forma Espiritual_, imbuyendo Trinidad con un anillo o artefacto por 4 cargas.\n\n_+1:_ Otorga efecto de anillo a _+1_ por 20 turnos o artefacto a _+4._\n\n_+2:_ Otorga efecto de anillo a _+2_ o artefacto a _+6._\n\n_+3:_ Otorga efecto de anillo a _+3_ o artefacto a _+8._\n\n_+4:_ Otorga efecto de anillo a _+4_ o artefacto a _+10._\n\nTrinidad solo puede contener un efecto espiritual a la vez.

actors.hero.talent.beaming_ray.title=rayo radiante

actors.hero.talent.beaming_ray.desc=El Clérigo lanza _Rayo Radiante_ desde un aliado potenciado por 1 carga, teletransportándolo hacia una posición objetivo.\n\n_+1:_ Alcance de _4 casillas_ y _+35% de daño_ contra el enemigo más cercano durante 10 turnos.\n\n_+2:_ Alcance de _8 casillas_ y _+40% de daño._\n\n_+3:_ Alcance de _12 casillas_ y _+45% de daño._\n\n_+4:_ Alcance de _16 casillas_ y _+50% de daño._

actors.hero.talent.life_link.title=enlace vital

actors.hero.talent.life_link.desc=El Clérigo enlaza su vida con un aliado potenciado por 2 cargas, compartiendo daño y aplicando hechizos benéficos a ambos.\n\n_+1:_ Dura _10 turnos_ y reduce daño recibido a _-35%._\n\n_+2:_ Dura _13 turnos_ y reduce daño a _-40%._\n\n_+3:_ Dura _17 turnos_ y reduce daño a _-45%._\n\n_+4:_ Dura _20 turnos_ y reduce daño a _-50%._

actors.hero.talent.stasis.title=estasis

actors.hero.talent.stasis.desc=El Clérigo pone en estasis a un aliado potenciado por 2 cargas, preservando todos sus efectos y protegiéndolo de todo peligro.\n\n_+1:_ Dura un máximo de _60 turnos._\n\n_+2:_ Dura un máximo de _90 turnos._\n\n_+3:_ Dura un máximo de _120 turnos._\n\n_+4:_ Dura un máximo de _150 turnos._\n\nEl Clérigo puede relanzarlo para terminar el efecto antes.

