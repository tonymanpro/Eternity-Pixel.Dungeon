actors.blobs.dancefloor.desc=¡A bailar, a bailar!
Casilla de baile %s: %s
Siguiente color: %s
actors.blobs.dancefloor.color_1_name=Rojo
actors.blobs.dancefloor.color_1_desc=Los personajes sobre esta casilla sufren daño directo (masivamente incrementado contra el héroe)
actors.blobs.dancefloor.color_2_name=Verde
actors.blobs.dancefloor.color_2_desc=Los personajes sobre esta casilla actúan al doble de velocidad
actors.blobs.dancefloor.color_3_name=Azul
actors.blobs.dancefloor.color_3_desc=Los personajes sobre esta casilla quedan aturdidos
actors.blobs.dancefloor.color_4_name=Blanco
actors.blobs.dancefloor.color_4_desc=Los personajes sobre esta casilla sufren daño diferido (masivamente incrementado contra el héroe)
actors.blobs.dancefloor.color_5_name=Amarillo
actors.blobs.dancefloor.color_5_desc=Los monstruos derrotados sobre esta casilla otorgan doble EXP y más botín
actors.blobs.dancefloor.color_6_name=Morado
actors.blobs.dancefloor.color_6_desc=Los personajes sobre esta casilla sufren doble daño
actors.blobs.dancefloor.rankings_desc=Bailó hasta la tumba
actors.blobs.dancefloor.ondeath=Bailaste hasta cavar tu propia tumba
actors.blobs.dancefloor$dancingdefereddamage.name=Bailando con la Muerte
actors.blobs.dancefloor$dancingdefereddamage.desc=¡Este es el baile más peligroso que jamás hayas hecho, y lo estás dominando ignorando el dolor!

Daño diferido restante: %d.
actors.blobs.dancefloor$dancingdefereddamage.ondeath=Bailaste hasta cavar tu propia tumba
actors.blobs.dancefloor$dancingdefereddamage.rankings_desc=Bailó hasta la tumba
actors.blobs.dancefloor$dancingdoom.name=Bailando en una tumba
actors.blobs.dancefloor$dancingdoom.desc=Una tumba no es el mejor lugar para bailar, ¡pero nadie te detiene!

Los personajes lo suficientemente valientes para bailar en una tumba recibirán el doble de daño de todas las fuentes.
actors.blobs.dancefloor$dancespeed.name=Bailando con el Tiempo
actors.blobs.dancefloor$dancespeed.desc=Tu baile perfecto se sincroniza con el ritmo del universo, ¡y ni siquiera el tiempo te detendrá!

Mientras tu baile sea perfecto, realizarás todas las acciones al doble de velocidad.
actors.blobs.dancefloor$dancingstun.name=Aturdido
actors.blobs.dancefloor$dancingstun.heromsg=¡Estás aturdido!
actors.blobs.dancefloor$dancingstun.desc=No hay nada peor que quedarse aturdido en mitad de un baile.

El aturdimiento detiene todas las acciones, obligando al objetivo a esperar a que termine el efecto.
actors.buffs.rageshield.name=Escudo de Determinación
actors.buffs.rageshield.heromsg=¡Estás protegido por tu furia!
actors.buffs.rageshield.desc=Una burbuja duradera de pura rabia drena la fuerza vital de los enemigos cercanos si estás herido.

La barrera drenará salud de los enemigos a la vista, enfureciéndolos y recibiendo daño. El escudo tendrá mayor efecto si el enemigo está adyacente.

Escudo restante: %d.
actors.buffs.championenemy$tanky.name=campeón tanque
actors.buffs.championenemy$tanky.desc=Los campeones tanque reciben solo el 5% del daño, pero su daño y velocidad se reducen un 25%.
actors.buffs.championenemy$speedy.name=campeón veloz
actors.buffs.championenemy$speedy.desc=Los campeones veloces obtienen x4 de velocidad y x1.5 de evasión y precisión.
actors.buffs.championenemy$frozen.name=campeón congelado
actors.buffs.championenemy$frozen.desc=Los campeones congelados infligen un 25% más de daño cuerpo a cuerpo pero tienen -20% de velocidad, enfrían a los enemigos que atacan y a veces los congelan, son inmunes al frío y esparcen una ventisca al morir.
actors.buffs.championenemy$blunt.name=campeón contundente
actors.buffs.championenemy$blunt.desc=Los campeones contundentes son expertos usando sus manos o armas contundentes, infligen un 75% más de daño, causan vértigo al atacar y paralizan en casos raros.
actors.buffs.godspeed.name=Velocidad Divina
actors.buffs.godspeed.desc=¡La energía divina recorre toda tu esencia, permitiéndote realizar acciones a velocidades increíbles!

Mientras estés bajo sus efectos, realizarás todas las acciones al doble de velocidad.

Turnos restantes de velocidad divina: %s.
actors.buffs.overload.name=Sobrecarga
actors.buffs.overload.desc=La realidad está sobrecargada. Prepárate para luchar y sobrevivir.

La muerte de cualquier criatura hostil provoca la aparición inmediata de otra criatura.

Turnos restantes de sobrecarga: %s.
actors.buffs.killevolution.name=contador de bajas
actors.buffs.killevolution.action=Habilidades de Baja
actors.buffs.killevolution.desc=Al derrotar enemigos, el héroe gana energía para usar en diversas habilidades. La mayoría de enemigos otorgan 1 de energía y no se pierde con el tiempo.

_Sin embargo, desequipar el arma asociada perderá toda esta energía y tendrás que comenzar a acumularla de nuevo._

Energía actual: %1$d/%2$d.
actors.buffs.killevolution.desc_cooldown=El héroe ha usado una habilidad recientemente y debe esperar antes de usar otra.

Enfriamiento actual: %d turnos.
actors.buffs.killevolution$killevolutionability$invisibledash.name=desplazamiento invisible
actors.buffs.killevolution$killevolutionability$invisibledash.prompt=Elige una Ubicación
actors.buffs.killevolution$killevolutionability$invisibledash.desc=Un desplazamiento instantáneo de hasta 4 casillas con un turno adicional de invisibilidad para realizar ataques sorpresa. Puede atravesar peligros, pero no enemigos ni terreno sólido.
actors.buffs.killevolution$killevolutionability$invisibledash.empower_desc=Un desplazamiento instantáneo de hasta _8 casillas_ con un turno adicional de invisibilidad para realizar ataques sorpresa. Puede atravesar peligros, pero no enemigos ni terreno sólido.
actors.buffs.killevolution$killevolutionability$physicallyempowered.name=potenciación física
actors.buffs.killevolution$killevolutionability$physicallyempowered.desc=El héroe se otorga +2 de daño adicional durante 10 golpes.
actors.buffs.killevolution$killevolutionability$physicallyempowered.empower_desc=El héroe se otorga _+4 de daño adicional_ durante 10 golpes.
actors.buffs.killevolution$killevolutionability$weaponupgrade.name=mejora de arma
actors.buffs.killevolution$killevolutionability$weaponupgrade.desc=El héroe mejora su arma (y la segunda arma de la Duelista si la hay) de forma permanente.
actors.buffs.killevolution$killevolutionability$weaponupgrade.empower_desc=El héroe mejora su arma (y la segunda arma de la Duelista si la hay) _dos veces_ de forma permanente.
actors.buffs.killevolution$killevolutionability$chain.name=encadenar enemigo
actors.buffs.killevolution$killevolutionability$chain.desc=El héroe encadena a un enemigo para arrastrarlo a corta distancia.
actors.buffs.killevolution$killevolutionability$immortalize.name=inmortalizar
actors.buffs.killevolution$killevolutionability$immortalize.desc=El héroe se vuelve inmune a todas las fuentes de daño durante 15 turnos.
actors.buffs.killevolution$killevolutionability$immortalize.empower_desc=El héroe se vuelve inmune a todas las fuentes de daño durante _~22 turnos_.
actors.buffs.marked.name=Marcado
actors.buffs.marked.desc=El Cazador espera pacientemente, preparándose para golpear mientras su bbat debilita a los enemigos.
actors.buffs.marked.desc_dmg=El bbat inflige %s%% más de daño a este enemigo. Podrás saltar hacia el enemigo marcado en cualquier momento; cuanto mayor sea el daño extra, más efectos negativos aplicará.
actors.buffs.marked.prompt=¡Selecciona un objetivo al que teletransportarte!
Distancia máxima: tu rango de visión
actors.buffs.marked.no_target=No hay nada a lo que teletransportarse allí.
actors.buffs.marked.out_of_reach=Ese objetivo está fuera de tu alcance.
actors.buffs.marked.assassinated=asesinado
actors.buffs.marked.desc_poison=En este punto, _envenenarás_ al objetivo, infligiéndole daño con el tiempo.
actors.buffs.marked.desc_cripple=En este punto, _tullirás_ las piernas del objetivo, reduciendo su velocidad de movimiento.
actors.buffs.marked.desc_blinding=En este punto, también _cegarás_ al objetivo, reduciendo su campo de visión a 1 casilla.
actors.buffs.marked.desc_bleeding=En este punto, también harás _sangrar_ al objetivo, infligiendo daño con el tiempo.
actors.buffs.marked.desc_vulnerable=En este punto, también _aumentarás el daño físico_ que recibe el enemigo.
actors.buffs.marked.desc_hexed=En este punto, también aturdirás al objetivo, _reduciendo su precisión y destreza_ por un corto tiempo.
actors.buffs.marked.desc_slow=En este punto, también desorientarás al objetivo, _ralentizando_ sus acciones.
actors.buffs.marked.desc_ooze=En este punto, también aplicarás _baba cáustica_ mortal al objetivo, infligiendo daño continuo hasta que encuentre agua.
actors.buffs.marked.desc_paralysis=En este punto, _paralizarás_ completamente al enemigo, impidiéndole atacar.
actors.buffs.marked.desc_doom=En este punto, también maldecirás al enemigo, _aumentando significativamente todo el daño que reciba_.
actors.buffs.danceimmunebuff.name=inmune a la maldición del baile
actors.buffs.danceimmunebuff.desc=Todos los efectos del baile pierden su poder por un corto tiempo. Debes esperar a que termine el efecto antes de volver a usar el hechizo.

Turnos restantes de inmunidad: %s.
actors.hero.abilities.ratking.legacywrath.name=furia divina
actors.hero.abilities.ratking.legacywrath.short_desc=Desato mi _Furia Divina_ sobre mis enemigos. ¡Me deja expuesto durante unos turnos y drena toda la carga de mi armadura!
actors.hero.abilities.ratking.legacywrath.desc=Desbloqueo la habilidad de canalizar un poder abrumador: teletransportarme a cualquier lugar a menos de 6 casillas, cegar a enemigos adyacentes, lanzar magia de tierra a todos los enemigos a la vista y disparar una ráfaga de cuchillas espectrales antes de volverme invisible.
actors.hero.heroclass.warrior_perk_desc=El Guerrero obtiene _1 + (5% de FUE actual) de fuerza temporal no acumulable_ durante _60 + (5 * nivel) turnos_ al comer y no recibe daño mientras come.
Puede cegar a cualquier enemigo por _5 turnos_ arrojándole objetos no arrojadizos.
Tiene _15%_ más de fuerza y regenera salud el doble de rápido.
actors.hero.heroclass.mage_perk_desc=El Mago obtiene _12 turnos_ de recarga al comer.
Identifica instantáneamente cualquier varita que recoja.
Puede apuntarse a sí mismo con una varita para convertir sus cargas en escudo a razón de _10.5% de PS máx por carga_.
actors.hero.heroclass.rogue_perk_desc=El Pícaro no despierta a enemigos dormidos a _3 o más casillas_.
Puede buscar en un área de _7x7_ empujando a enemigos adyacentes.
Puede usar la Capa de Sombras sin equiparla.
Sus bombas infligen _150%_ más de daño.
actors.hero.heroclass.huntress_perk_desc=La Cazadora identifica equipo _3 veces_ más rápido.
Al pisar hierba corta o brasas, brota hierba alta.
Obtiene visión mental de enemigos a _3 casillas_ y celeridad de _5 turnos_ al comer.
actors.hero.heroclass.rat_king=rey rata
actors.hero.heroclass.rat_king_desc_short=¡Soy tan increíble como un rey puede ser!
actors.hero.heroclass.rat_king_desc=¿Por qué elegir una clase si puedo jugar como yo mismo?
Empiezo con todos los objetos especiales de clase: sello, bastón, capa de sombras y arco.
Empiezo con todas las bolsas y puedo caminar por hierba alta sin pisotearla.
actors.hero.heroclass.rat_king_perk_desc=¿Qué? ¡No necesito ayuda! ¡Soy lo bastante fuerte por mí mismo!
actors.hero.heroclass.duelist_perk_desc=La Duelista obtiene _2 cargas de arma_ y daño extra al comer.
Gana 1 carga cada _10 turnos_ y puede cambiar de arma instantáneamente _dos veces en 5 turnos_.
actors.hero.herosubclass.king=rey rata
actors.hero.herosubclass.king_short_desc=Elegir es aburrido, prefiero elegir _todas las subclases_...
actors.hero.herosubclass.king_desc=¡El Rey Rata puede usar todas las subclases a la vez!
actors.hero.herosubclass.kingy=rey rata
actors.hero.herosubclass.kingy_desc=¡Leer el Tomo de Maestría otorga al Rey Rata el poder de todas las subclases!
actors.hero.perks.perk_obtain=¡Aprendiste %s!
actors.hero.perks.sucker_punch.name=golpe bajo
actors.hero.perks.sucker_punch.desc=El primer ataque sorpresa inflige un 25% de daño adicional que perfora armadura.
actors.hero.perks.directive.name=directiva
actors.hero.perks.directive.desc=El primer ataque sorpresa otorga 1.5 turnos de celeridad.
actors.hero.perks$directivemovingtracker.name=Pasos Instantáneos
actors.hero.perks$directivemovingtracker.desc=Tu movimiento no consumirá tiempo a menos que te detengas.

Movimientos restantes: %s.
actors.hero.perks.follow_up_strike.name=golpe consecutivo
actors.hero.perks.follow_up_strike.desc=Tras golpear con un arco o arma arrojadiza, el siguiente ataque cuerpo a cuerpo inflige un 25% de daño adicional que perfora armadura.
actors.hero.perks.hold_fast.name=resistencia firme
actors.hero.perks.hold_fast.desc=Al esperar en tu sitio, obtienes %s-%s de armadura adicional.
actors.hero.perks.protein_infusion.name=infusión de proteínas
actors.hero.perks.protein_infusion.desc=El héroe obtiene hasta 2x de velocidad y 1.5x de evasión según su nivel de saciedad.
actors.hero.perks.fishing_pro.name=pescador experto
actors.hero.perks.fishing_pro.desc=Con un 25% de probabilidad, el botín de pesca se duplica.
actors.hero.perks.wand_pro.name=maestría de recarga
actors.hero.perks.wand_pro.desc=Tus varitas se recargan un 25% más rápido.
actors.hero.perks.iron_will.name=reflejo de hierro
actors.hero.perks.iron_will.desc=Por debajo del 50% de PS, recibir daño físico o mágico liberará ondas de choque dañinas hacia los enemigos.
actors.hero.perks.mystical_meal.name=comida mística
actors.hero.perks.mystical_meal.desc=Comer otorga 6 turnos de recarga de artefactos.
actors.hero.perks.additional_money.name=cazarrecompensas
actors.hero.perks.additional_money.desc=Derrotar enemigos suelta oro equivalente al 20% del oro normalmente obtenido.
actors.hero.perks.better_bartering.name=trueque eficiente
actors.hero.perks.better_bartering.desc=Comerciar con el Rey Rata tiene un 33% de probabilidad de no consumir el objeto.
actors.hero.perks.potions.name=mucha experiencia
actors.hero.perks.potions.desc=Las Pociones de Sobrecarga y las Pociones de Experiencia duran el doble.
actors.hero.perks.more_bag.name=bolsas de botín más grandes
actors.hero.perks.more_bag.desc=Las bolsas de tesoro de la tienda contienen aproximadamente un 50% más de objetos.
actors.hero.perks.no_oneshots.name=piel de acero
actors.hero.perks.no_oneshots.desc=Si el daño recibido te mataría de un solo golpe teniendo la salud completa, se reducirá en un 50%.
actors.hero.perks.collect_everything.name=comida magnética
actors.hero.perks.collect_everything.desc=Comer raciones sobrevaloradas hace que todos los objetos superiores de cada montón en el mapa se recolecten instantáneamente.
actors.hero.perks.rat_summons.name=refuerzos de ratas
actors.hero.perks.rat_summons.desc=Buscar en el sitio generará varias ratas marsupiales aliadas a tu lado con 25 turnos de adrenalina.
actors.hero.perks.grass_healing.name=naturaleza restaurada
actors.hero.perks.grass_healing.desc=Beber una poción de curación genera un área de hierba de 5x5 alrededor del héroe y enraíza a los enemigos por 3 turnos.
actors.hero.perks.friendly_bees.name=abejas amistosas
actors.hero.perks.friendly_bees.desc=Todas las abejas generadas por tarros de miel lucharán del lado del héroe.
actors.hero.perks.raritize_magic.name=Magia de Rarezas
actors.hero.perks.raritize_magic.desc=Los monstruos pueden soltar objetos con rareza especial con un 7% de probabilidad.
actors.hero.perks.supply_rations.name=Raciones Almacenadas
actors.hero.perks.supply_rations.desc=Puedes encontrar raciones en cofres con una probabilidad de _1/(25 + (5 * raciones encontradas))_ mientras exploras.
Se comen rápido, curan 5 PS y recargan 1 uso de la capa de sombras.
actors.hero.perks.dungeon_berry.name=Generosidad de la Naturaleza
actors.hero.perks.dungeon_berry.desc=Puedes encontrar bayas en hierba alta con una probabilidad de _1/(15 + (5 * bayas encontradas))_.
Se comen rápido, restauran saciedad y pueden contener una semilla útil.
actors.mobs.npcs.blacksmith.intro_quest_ratking=¡Saludos Su Majestad!
actors.mobs.npcs.blacksmith.same_item=¡Selecciona 2 objetos diferentes, no el mismo dos veces!
actors.mobs.npcs.blacksmith.diff_type=¡Selecciona 2 objetos del mismo tipo!
actors.mobs.npcs.blacksmith.un_ided=¡Necesito saber con qué trabajo, identifícalos primero!
actors.mobs.npcs.blacksmith.cursed=¡No trabajo con objetos malditos!
actors.mobs.npcs.blacksmith.degraded=¡Es basura, la calidad es pésima!
actors.mobs.npcs.blacksmith.cant_reforge=¡No puedo reforjar estos objetos!
actors.mobs.npcs.blacksmith.key=Oh, estás aquí. ¿Sabías que la Varita de Ráfaga de Fuego tenía un hermano llamado Varita de Avalancha? La he reprogramado y añadido su receta.
actors.mobs.npcs.ratking.ghastly=Esta imagen ilusoria es la manifestación del Rey Rata. Comerciará contigo sin huir.
actors.mobs.npcs.shopkeeper.talk_prison_rat_king=Saludos, Su Majestad. ¿Qué hace usted por aquí?
actors.mobs.npcs.wandmaker.intro_ratking=¡Oh, gran saludo, Su Majestad! ¡Qué honor!
actors.mobs.npcs.wandmaker.cheese=¡Oh Dios mío, queso! ¡Te daré mi varita más poderosa en agradecimiento!
actors.mobs.npcs.hook.name=anzuelo
actors.mobs.npcs.hook.desc=El anzuelo de tu genial caña de pescar.
actors.mobs.npcs.expgenerator.name=planta de energía
actors.mobs.npcs.expgenerator.desc=Esta obra maestra dorada transforma la luz solar oculta en experiencia. Puedes dañarla para recogerla de nuevo.
actors.mobs.npcs.bbat.name=bbat
actors.mobs.npcs.bbat.desc=Este murciélago está entrenado para cazar objetivos débiles mientras su dueño sobrevive en combate.
actors.mobs.npcs.bbat$bbatrecharge.name=Recarga de Bbat
actors.mobs.npcs.bbat$bbatrecharge.desc=Bbat necesita %s turnos para recuperarse del daño y regresar al combate.
actors.mobs.blackmimic.name=mímico oscurecido
actors.mobs.blackmimic.notice=Vaya, fuiste allí.
actors.mobs.blackmimic.shield=¡Tengo un campo de fuerza!
actors.mobs.blackmimic.vent=¿Qué tal algo de experiencia corrosiva?
actors.mobs.blackmimic.rocks=¡Aplástalo, rocas!
actors.mobs.blackmimic.bomb=¡Explota!
actors.mobs.blackmimic.summon=¡PRUEBA A LOS MONSTRUOS!
actors.mobs.blackmimic.charging=¡NECIO!
actors.mobs.blackmimic.charging_hint=¡El Mímico Oscuro es invulnerable mientras la torre de energía esté activa!
actors.mobs.blackmimic.supercharged=¡ALTO AHÍ IDIOTA!
actors.mobs.blackmimic.charge_lost=¿QUÉÉÉÉÉ?
actors.mobs.blackmimic.pylons_destroyed=¿CÓMO?
actors.mobs.blackmimic.rankings_desc=Consumido por su propia codicia
actors.mobs.blackmimic.def_verb=bloqueado
actors.mobs.blackmimic.defeated=¡NOOOOOOOOOOOOOO!
actors.mobs.blackmimic.desc=La personificación de tu infinita avaricia. Busca devorarte junto con el Amuleto.
actors.mobs.blackmimic.desc_clone=Un clon del Mímico Oscuro. Inmune al daño.
actors.mobs.blackmimic.desc_supercharged=El Mímico Oscuro está supercargado y se mueve al triple de velocidad. Destruye las fuentes de energía cercanas para debilitarlo.
actors.mobs.blackmimic$fallingrocks.desc=¡Rocas sueltas caen del techo, parece a punto de colapsar!
actors.mobs.oofthief.name=ladrón OOF
actors.mobs.oofthief.stole=¡El ladrón te robó %s! ¡Puedes recuperarlo en las tiendas de pisos reiniciados!
actors.mobs.oofthief.escapes=¡El ladrón se teletransporta!
actors.mobs.oofthief.desc=Un ladrón mejorado genéticamente, 2.5 veces más fuerte que un ladrón común y con dispositivos de teletransporte.

