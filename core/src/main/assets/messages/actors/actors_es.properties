actors.mobs.hermitcrab.name=cangrejo ermitaño

actors.mobs.hermitcrab.def_verb=blocked

actors.mobs.hermitcrab.desc=Un crustáceo subterráneo que ha ocupado una pesada concha o armadura para protegerse. Su caparazón reduce enormemente el daño recibido.

actors.mobs.mimic.discover_hint=You can find this enemy anywhere in the dungeon.

