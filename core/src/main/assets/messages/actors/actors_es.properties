###blobs
actors.blobs.blizzard.desc=Una tormenta de nieve se arremolina aquí.

actors.blobs.confusiongas.desc=Una nube de gas de confusión se arremolina aquí.

actors.blobs.electricity.desc=Un campo de electricidad está chispeando intensamente aquí.
actors.blobs.electricity.rankings_desc=Electrocutado
actors.blobs.electricity.ondeath=Fuiste electrocutado a muerte...

actors.blobs.fire.desc=Un fuego está ardiendo aquí.

actors.blobs.foliage.desc=Rayos de luz atraviesan la penumbra del jardín subterráneo.

actors.blobs.freezing.desc=El aire está extrañamente gélido aquí.

actors.blobs.goowarn.desc=¡Partículas de energía oscura están revoloteando por aquí!

actors.blobs.inferno.desc=Un infierno está furioso aquí.

actors.blobs.paralyticgas.desc=Una nube de gas paralizante está arremolinándose aquí.

actors.blobs.sacrificialfire.desc=Aquí hay un altar con un fuego de sacrificio ardiendo encima. Cualquier criatura derrotada aquí será consumida como ofrenda a los espíritus de la mazmorra.\n\n¿Quizás otorgue una recompensa si se hacen suficientes sacrificios?
actors.blobs.sacrificialfire.worthy=El fuego consume tu ofrenda y se hace más fuerte.
actors.blobs.sacrificialfire.unworthy=El fuego consume tu ofrenda pero no ocurre nada.
actors.blobs.sacrificialfire.reward=El fuego arde y luego se disipa, dejando una recompensa.

actors.blobs.smokescreen.desc=Una nube de humo negro denso está arremolinándose aquí.

actors.blobs.stenchgas.desc=Una nube de hedor fétido se está arremolinando aquí.

actors.blobs.stormcloud.desc=Una nube de vapor de agua ondulante se arremolina aquí.

actors.blobs.toxicgas.desc=Una nube verdosa de gas tóxico se arremolina aquí.
actors.blobs.toxicgas.rankings_desc=Asfixiado
actors.blobs.toxicgas.ondeath=Has muerto por el gas tóxico...

actors.blobs.corrosivegas.desc=Una nube de gas cáustico mortal se está arremolinando aquí.

actors.blobs.waterofawareness.procced=Mientras tomas un sorbo, sientes que el conocimiento fluye por tu mente.
actors.blobs.waterofawareness.desc=El poder del conocimiento irradia del agua de este pozo. Bebe un sorbo para revelar los secretos de los ítems equipados y revelar todos los ítems del piso actual.

actors.blobs.waterofhealth.procced=Al tomar un trago, sientes que tus heridas se curan completamente.
actors.blobs.waterofhealth.desc=El poder de la salud irradia desde el agua de este pozo. Toma un sorbo para curar tus heridas y satisfacer el hambre.

actors.blobs.wateroftransmutation.desc=El poder de transformación irradia desde el agua de este pozo. Lanza un objeto en el pozo para convertirlo en otra cosa.

actors.blobs.web.desc=Una gruesa telaraña cubre todo el lugar. Todo lo que toca o es lanzado a través de la telaraña la romperá, pero también estará atascado en el lugar.



###buffs
actors.buffs.adrenaline.name=adrenalina
actors.buffs.adrenaline.desc=Una oleada de poder físico, la adrenalina aumentó la velocidad de ataque y de movimiento.\n\nLa adrenalina permite que su objetivo corra a 2x de velocidad, y ataque a 1.5x de velocidad.\n\nTurnos restantes: %s.

actors.buffs.adrenalinesurge.name=impulso de fuerza
actors.buffs.adrenalinesurge.desc=Una descarga de gran poderío, pero lamentablemente no es permanente.\n\nIncremento de fuerza: +%d.\nTurnos hasta que el incremento se debilite: %s.

actors.buffs.amok.name=locura
actors.buffs.amok.desc=La locura causa un estado de gran furia y confusión en el objetivo.\n\nCuando una criatura enloquece, atacará a cualquiera que esté cerca, sea aliado o enemigo.\n\nTurnos de locura restantes: %s.

actors.buffs.arcanearmor.name=armadura arcana
actors.buffs.arcanearmor.desc=Un delgado escudo te rodea, bloqueando parte del daño de ataques mágicos.\n\nTu armadura mágica está actualmente incrementada en: 0-%d\n\nTurnos hasta que la armadura arcana se debilite: %s.

actors.buffs.artifactrecharge.name=recarga de artefactos
actors.buffs.artifactrecharge.desc=Una ola de energía fluye a través de ti, incrementando la tasa de carga de los artefactos equipados.\n\nCada artefacto es afectado de una manera ligeramente diferente, pero todos ellos se cargan mucho más rápido de lo normal.\n\nTurnos restantes: %s.

actors.buffs.ascensionchallenge.name=maldición del amuleto
actors.buffs.ascensionchallenge.desc=De alguna manera Yog-Dzewa mantiene influencia sobre este mundo a través del amuleto, ¡intentando detener tu ascenso!\n\nEl poder de Yog vuelve la mazmorra mucho más peligrosa, ¡incrementando la cantidad de enemigos y haciéndolos más fuertes! Este poder continuará aumentando en caso de ser ignorado, el mismo puede ser debilitado derrotando enemigos potenciados por el poder de Yog.
actors.buffs.ascensionchallenge.desc_clear=La energía maligna emanando del amuleto ha sido debilitada lo máximo posible de momento.
actors.buffs.ascensionchallenge.desc_beckon=El amuleto está _llamando a enemigos distantes,_ advirtiéndoles de tu posición.
actors.buffs.ascensionchallenge.desc_haste=El amuleto está _acelerando a los enemigos distantes,_ ¡permitiéndoles alcanzarte más rápido!
actors.buffs.ascensionchallenge.desc_slow=El amuleto está _enlenteciéndote,_ ¡y negando efectos de aumento de velocidad!
actors.buffs.ascensionchallenge.desc_damage=¡La energía del amuleto se ha vuelto tan fuerte que está _causándote daño!_
actors.buffs.ascensionchallenge.beckon=El amuleto empieza a llamar enemigos distantes.
actors.buffs.ascensionchallenge.haste=¡El amuleto empieza a acelerar enemigos distantes!
actors.buffs.ascensionchallenge.slow=¡El amuleto empieza a sentirse como una carga en tu inventario!
actors.buffs.ascensionchallenge.damage=El amuleto empieza a emanar energía maligna. ¡Te quema!
actors.buffs.ascensionchallenge.weaken_info=¡Debes derrotar enemigos para debilitar la maldición del amuleto!
actors.buffs.ascensionchallenge.weaken=Puedes sentir que la maldición del amuleto se debilita un poco.
actors.buffs.ascensionchallenge.break=¡Te tomas un momento para recuperar el aliento y sientes que tus heridas comienzan a cerrarse!
actors.buffs.ascensionchallenge.almost=Sientes que la influencia de Yog sobre el amuleto comienza a debilitarse, ¡falta muy poco!
actors.buffs.ascensionchallenge.on_kill=La energía maligna te consume...

actors.buffs.barkskin.name=piel de roble
actors.buffs.barkskin.desc=Tu piel está endurecida, se siente áspera y sólida como la corteza.\n\nLa piel endurecida aumenta la efectividad de tu armadura, permitiendo defenderte mejor contra ataques físicos.\n\nTu armadura está incrementada en: 0-%d.\nTurnos hasta que la piel de roble se debilite: %s.\n\nSi recibes el efecto piel de roble de diferentes fuentes, solo el más fuerte surtirá efecto.

actors.buffs.barrier.name=barrera
actors.buffs.barrier.desc=Una resistente burbuja de fuerza bloquea todo el daño.\n\nLa barrera recibirá el daño en lugar de lo que sea que esté protegiendo siempre y cuando le quede blindaje. El blindaje también decaerá lentamente con el paso del tiempo.\n\nBlindaje restante: %d.

actors.buffs.berserk.angered=enfadado
actors.buffs.berserk.berserk=enfurecido
actors.buffs.berserk.exhausted=exhausto
actors.buffs.berserk.recovering=recuperándose
actors.buffs.berserk.angered_desc=La severidad de las heridas del Frenético potencia sus golpes. Mientras el frenético reciba daño físico, ganará furia, garantizando daño extra. El daño bloqueado por la armadura también cuenta para generar furia.\n\nLa furia se desvanecerá con el tiempo. Cuanto menor sea la salud del frenético, mayor será su duración.\n\nAl 100%% de furia, el Frenético puede enfurecer, obteniendo 2 veces el blindaje máximo de su sello, aumentando hasta 6 veces si tiene poca salud. Este blindaje se desvanece con el tiempo y una vez agotado el frenético deberá descansar antes de poder generar furia nuevamente.\n\nFuria actual: _%.0f%%_\n_+%.0f%%_ de daño
actors.buffs.berserk.berserk_desc=El miedo y la incertidumbre se desvanecen, dejando solo furia. En este estado el Frenético es extremadamente poderoso, _infligiendo 50% más daño y obteniendo blindaje adicional._\n\nEste blindaje adicional equivale a 2 veces el blindaje máximo de su sello, aumentando hasta 6 veces si tiene poca salud. Cuando este blindaje sea reducido a 0, dejará de estar enfurecido.\n\nDespués de enfurecer, el Frenético deberá recuperarse antes de poder generar furia nuevamente.
actors.buffs.berserk.recovering_desc=La fuerza interior tiene sus limites. El Frenético debe descansar antes de usar su furia de nuevo..\n\nMientras se recupera, el Frenético no puede generar furia al recibir daño.
actors.buffs.berserk.recovering_desc_turns=Turnos hasta recuperarse: _%d_
actors.buffs.berserk.recovering_desc_levels=Niveles hasta recuperarse: _%.2f_
actors.buffs.berserk.rankings_desc=Enfurecido hasta Morir
actors.buffs.berserk.action_name=Enfurecer
actors.buffs.berserk.no_seal=¡Necesitas tu sello roto para enfurecer!

actors.buffs.bleeding.name=sangrando
actors.buffs.bleeding.ondeath=Te has desangrado hasta morir...
actors.buffs.bleeding.heromsg=¡Estás sangrando!
actors.buffs.bleeding.rankings_desc=Desangrado hasta Morir
actors.buffs.bleeding.desc=Esa herida está derramando una cantidad preocupante de sangre.\n\nSangrar causa daño cada turno. Cada turno el daño se reduce en una cantidad aleatoria, hasta que eventualmente el sangrado se detiene.\n\nDaño actual del sangrado: %d.

actors.buffs.bless.name=bendecido
actors.buffs.bless.desc=Una gran ráfaga de concentración, algunos dicen que es inspirada por los dioses.\n\nLa bendición aumenta la precisión y evasión en 25%%, haciendo al bendecido mucho más efectivo en combate. \n\nTurnos de bendición restantes: %s.

actors.buffs.blindness.name=cegado
actors.buffs.blindness.heromsg=¡Estás cegado!
actors.buffs.blindness.desc=La ceguera convierte al espacio circundante en una oscura neblina.\n\nDurante la ceguera, el rango de visión un personaje es reducido a una casilla, convirtiendo en inservibles los ataques a distancia y haciendo más fácil perder el rastro de enemigos distantes. Adicionalmente, un héroe cegado no puede leer pergaminos o libros.\n\nTurnos de ceguera restantes: %s.

actors.buffs.buff.heromsg=

actors.buffs.burning.name=ardiendo
actors.buffs.burning.heromsg=¡Te quemas!
actors.buffs.burning.burnsup=¡%s se quema!
actors.buffs.burning.ondeath=Te has quemado hasta la muerte...
actors.buffs.burning.rankings_desc=Quemado en Cenizas
actors.buffs.burning.desc=Pocas cosas son más angustiosas que estar envuelto en llamas.\n\nEl fuego causará daño cada turno hasta que se apague con agua o expire. El fuego puede ser extinguido entrando en el agua, o con la salpicadura provocada al romper una poción.\n\nAdicionalmente, el fuego puede quemar el terreno flamable o ítems con los que tenga contacto.\n\nTurnos en llamas restantes: %s.

actors.buffs.championenemy.warn=Sientes una presencia mortal.
actors.buffs.championenemy$blazing.name=campeón flameante
actors.buffs.championenemy$blazing.desc=Los campeones flameantes infligen un 25% más de daño cuerpo a cuerpo, encienden a los enemigos que atacan, son inmunes al fuego y esparcen fuego a su alrededor cuando mueren. Aunque no podrán esparcir fuego sobre el agua.
actors.buffs.championenemy$projecting.name=campeón proyectante
actors.buffs.championenemy$projecting.desc=Los campeones proyectantes causan un 25% mas de daño cuerpo a cuerpo y tienen +3 de rango de ataque.
actors.buffs.championenemy$antimagic.name=campeón antimagia
actors.buffs.championenemy$antimagic.desc=Los campeones antimagia reciben un 50% menos de daño y son completamente inmunes a los efectos mágicos.
actors.buffs.championenemy$giant.name=campeón gigante
actors.buffs.championenemy$giant.desc=Los campeones gigantes reciben 80% menos daño y tienen +1 rango de ataque, pero no se pueden mover por espacios estrechos.
actors.buffs.championenemy$blessed.name=campeón bendecido
actors.buffs.championenemy$blessed.desc=Los campeones bendecidos tienen 4 veces más precisión y evasión.
actors.buffs.championenemy$growing.name=campeón creciente
actors.buffs.championenemy$growing.desc=Los campeones crecientes obtienen una bonificación cada vez mayor en precisión, evasión, daño físico y una reducción del daño recibido.\n\nIncremento actual de precisión/evasión/daño: %1$d%%\nReducción de daño recibido actual: %2$d%%

actors.buffs.charm.name=encantado
actors.buffs.charm.heromsg=¡Estás encantado!
actors.buffs.charm.cant_attack=Estás encantado por ese enemigo y no puedes atacarle.
actors.buffs.charm.desc=El encanto es magia manipuladora que puede hacer que los enemigos se adoren temporalmente.\n\nLos personajes afectados por el encanto no pueden atacar directamente al enemigo por el que están encantados. Sin embargo, todavía es posible atacar a otros objetivos. El impacto del dolor disminuirá la duración del encanto. \n\nTurnos de encanto restantes: %s.

actors.buffs.chill.name=enfriado
actors.buffs.chill.freezes=¡%s se congela!
actors.buffs.chill.desc=No del todo congelado, pero demasiado frío.\n\nLos personajes enfriados realizan todas las acciones más lentamente, dependiendo en cuántos turnos restan del efecto. En su peor momento, esto equivale a estar ralentizado.\n\nTurnos de frío restantes: %1$s.\nVelocidad reducida en %2$s%%

actors.buffs.combo.name=combo
actors.buffs.combo.action_name=ataque especial
actors.buffs.combo.combo=¡Combo de %d golpes!
actors.buffs.combo.bad_target=Debes elegir un enemigo en el rango de ataque.
actors.buffs.combo.prompt=Selecciona un objetivo a atacar.
actors.buffs.combo.desc=El Gladiador gana impulso mientras acierte ataques exitosamente. Cada golpe aumenta el contador de combo en uno, pero tardar demasiado en atacar restablecerá el contador a 0.\n\n¡Crear combos desbloquea ataques especiales los cuales no pueden fallar! Los diferentes ataques están disponible a los 2, 4, 6, 8 y 10 puntos de combo. Algunos ataques restablecerán el contador de combo y otros no, pero cada ataque solo puede ser usado una vez por sesión de combo.\n\nContador de combo: %1$d.\n\nTurnos para que el combo se pierda: %2$s.
actors.buffs.combo$combomove.clobber.name=derribar
actors.buffs.combo$combomove.clobber.desc=Empuja a un enemigo hacia atrás 2 casillas, pero no causa daño y no puede tirar enemigos en fosas. Incrementa el combo en 1.
actors.buffs.combo$combomove.clobber.empower_desc=Empuja a un enemigo hacia atrás _3 casillas, inflige vértigo y puede tirar enemigos en fosas,_ pero no causa daño. Incrementa el combo en 1.
actors.buffs.combo$combomove.slam.name=embate
actors.buffs.combo$combomove.slam.desc=Inflige %d%%(combo*20%%) de tu poder de bloqueo como daño adicional. Restablece el combo cuando se usa.
actors.buffs.combo$combomove.slam.empower_desc=_Salta hasta %1$d casilla(s)_ y causa %2$d%% (combo*20%%) de tu poder de bloqueo como daño adicional. Restablece el combo cuando se usa.
actors.buffs.combo$combomove.parry.name=desviar
actors.buffs.combo$combomove.parry.desc=Bloquea el próximo ataque dentro de 1 turno cuando se activa y lo devuelve instantáneamente. Restablece el combo si nada es desviado.
actors.buffs.combo$combomove.parry.empower_desc=Bloquea _todos los ataques_ dentro de 1 turno cuando se activa y los devuelve instantáneamente. Restablece el combo si nada es desviado.
actors.buffs.combo$combomove.crush.name=aplastar
actors.buffs.combo$combomove.crush.desc=Inflige %d%% (combo*25%%) de daño al objetivo principal y la mitad de ese daño a todos los enemigos en un área de 7x7 casillas. Restablece el combo cuando se usa.
actors.buffs.combo$combomove.crush.empower_desc=_Salta hasta %1$d casilla(s)_ y causa %2$d%% (combo*25%%) de daño al objetivo principal y la mitad de ese daño a todos los enemigos en un área de 7x7 casillas. Restablece el combo cuando se usa.
actors.buffs.combo$combomove.fury.name=furia
actors.buffs.combo$combomove.fury.desc=Golpea a un enemigo una vez por cada combo que tienes, cada golpe inflige un 60% de daño y puede activar encantamientos. Restablece el combo cuando se usa.
actors.buffs.combo$combomove.fury.empower_desc=_Salta hasta %d casilla(s)_ y golpea a un enemigo una vez por cada como que tienes, cada golpe inflige un 60%% de daño y puede activar encantamientos. Restablece el combo cuando se usa.

actors.buffs.corruption.name=corrupto
actors.buffs.corruption.desc=La corrupción se filtra dentro de la esencia de un ser, retorciéndolo contra su naturaleza previa.\n\nLas criaturas corrompidas atacan a sus aliados, e ignoran a sus antiguos enemigos. La corrupción también es dañina, y lentamente causará que su objetivo sucumba.\n\nLa corrupción es permanente, sus efectos solo cesan en la muerte.

actors.buffs.cripple.name=lisiado
actors.buffs.cripple.heromsg=¡Estás lisiado!
actors.buffs.cripple.desc=Estás bastante seguro de que las piernas no deberían doblarse de esa manera.\n\nLisiado reduce la velocidad de movimiento a la mitad, haciendo que moverse una casilla usualmente tome dos turnos en vez de uno.\n\nTurnos de lisiado restantes: %s.

actors.buffs.daze.name=mareado
actors.buffs.daze.heromsg=¡Estás mareado!
actors.buffs.daze.desc=El zumbido de oídos y la visión borrosa hacen que luchar sea más difícil.\n\nMientras estés mareado, la precisión y evasión son reducidas en 50%%, causando que acertar y evadir ataques sea más difícil.\n\nTurnos de mareo restantes: %s.

actors.buffs.degrade.name=degradado
actors.buffs.degrade.heromsg=¡Tu equipamiento se siente mas débil!
actors.buffs.degrade.desc=¡Una poderosa magia oscura está drenando la fuerza que los pergaminos de mejora otorgaban a tu equipamiento!\n\nMientras se encuentre degradado, el equipamiento mejorado se tratará como si fuera de un menor nivel del que realmente es. _Cada mejora después de +3 se vuelve exponencialmente más débil que la anterior._ Las descripciones de tus ítems cambiarán para reflejar su nivel de poder reducido.\n\nLa degradación no afecta los requisitos de fuerza, cargas de varita, durabilidad de armas arrojadizas ni artefactos.\n\nTurnos restantes de degradación: %s. Usar un pergamino de mejora o eliminar maldición terminará con la degradación inmediatamente.

actors.buffs.doom.name=condenado
actors.buffs.doom.desc=Es difícil seguir adelante cuando pareciera que el universo te quiere muerto.\n\nLos personajes condenados recibirán +67% de daño de todas las fuentes.\n\nLa condena es permanente, sus efectos solo cesan en la muerte.

actors.buffs.dread.name=pavor
actors.buffs.dread.desc=¡Un terror tan grande que hará que su objetivo huya de la mazmorra por completo!\n\nLas criaturas afectadas por pavor huirán de su oponente a gran velocidad y desaparecerán de la mazmorra una vez estén fuera de visión. Los enemigos derrotados de esta manera otorgan la mitad de experiencia y no dejan ningún ítem. El impacto del dolor reducirá la duración de pavor.\n\nTurnos de pavor restantes: %d.

actors.buffs.drowsy.name=somnoliento
actors.buffs.drowsy.desc=Una fuerza mágica te dificulta estar despierto, tras unos pocos turnos, el objetivo caerá en un profundo sueño mágico.\n\nEl héroe puede resistir la somnolencia recibiendo daño o estando con la salud completa.\n\nTurnos hasta quedar dormido: %s.

actors.buffs.earthimbue.name=imbuido con tierra
actors.buffs.earthimbue.desc=¡Estás imbuido con el poder de la tierra!\n\nTodos los ataques físicos cambiarán el terreno debajo del enemigo, paralizándolo por un corto tiempo.\n\nTurnos de imbuimiento de tierra restantes: %s.

actors.buffs.enhancedrings.name=anillos mejorados
actors.buffs.enhancedrings.desc=El artefacto usado recientemente por el Pícaro está potenciando sus anillos, otorgándoles +1 nivel.\n\nTurnos restantes: %s.

actors.buffs.fireimbue.name=imbuido con fuego
actors.buffs.fireimbue.desc=¡Estás imbuido con el poder del fuego!\n\nTodos los ataques físicos tienen una posibilidad de incendiar a los enemigos. También eres completamente inmune a los efectos del fuego.\n\nTurnos de imbuimiento de fuego restantes: %s.

actors.buffs.foresight.name=previsión
actors.buffs.foresight.desc=De alguna manera eres capaz de ver el mapeado del terreno cercano con tu mente.\n\nMientras estés bajo el efecto de previsión todas las casillas en un amplio radio serán reveladas, incluyendo cualquier trampa o puerta oculta.\n\nTurnos de previsión restantes: %s.

actors.buffs.frost.name=congelado
actors.buffs.frost.freezes=¡%s se congela!
actors.buffs.frost.desc=No debe confundirse con congelarse completamente, esta congelación más benigna simplemente envuelve al objetivo en hielo.\n\nLa congelación actúa similarmente al parálisis, haciendo imposible actuar al objetivo. A diferencia del parálisis, la congelación es cancelada inmediatamente si el objetivo sufre daño, ya que el hielo se destruirá.\n\nTurnos de congelación restantes: %s.

actors.buffs.frostimbue.name=imbuido con escarcha
actors.buffs.frostimbue.desc=¡Estás imbuido con el poder del hielo!\n\nTodos los ataques físicos enfriarán constantemente a los enemigos. Además, eres completamente inmune al frío.\n\nTurnos de imbuimiento de escarcha restantes: %s.

actors.buffs.fury.name=furioso
actors.buffs.fury.heromsg=¡Te pones furioso!
actors.buffs.fury.desc=Estás enfadado, a los enemigos no les gustarás cuando estés enfadado.\n\nUna gran furia arde en tu interior, incrementando el daño que haces con tus ataques físicos en un 50%%.\n\nEsta furia durará mientras estés dañado por debajo del 50%% de vida.

actors.buffs.blobimmunity.name=barrera de purificación
actors.buffs.blobimmunity.desc=Alguna fuerza extraña te encierra en una delgada barrera protectora, bloqueando todos los efectos dañinos del ambiente.\n\nEres inmune a todos los efectos del área mientras dure esta barrera.\n\nTurnos de inmunidad restantes: %s.

actors.buffs.greaterhaste.name=celeridad
actors.buffs.greaterhaste.desc=Un increíble impulso de velocidad, por un momento parece como si todo lo demás estuviera detenido.\n\nBajo los efectos de celeridad, las acciones de movimiento no toman nada de tiempo, pero el resto de acciones siguen realizándose a velocidad normal. Cada paso de movimiento consume un turno de celeridad.\n\nTurnos de celeridad restantes: %d.

actors.buffs.haste.name=velocidad
actors.buffs.haste.desc=¡La energía corre a través de tus músculos, permitiéndote correr a velocidades increíbles!\n\nMientras estés bajo los efectos de la velocidad, correrás a x3 de velocidad, pero realizarás todas las demás acciones a velocidad normal.\n\nTurnos de velocidad restantes: %s.

actors.buffs.healing.name=curación
actors.buffs.healing.desc=Un remedio mágico está causando que las heridas se cierren y la carne se una.\n\nCada turno, la salud se regenerará constantemente hasta que el efecto de curación expire. La cantidad de curación puede desvanecerse con el tiempo.\n\nSiguiente curación: %d.\n\nCuración restante: %d.

actors.buffs.herodisguise.name=disfraz
actors.buffs.herodisguise.desc=¡Magia ilusoria ha alterado tu apariencia física! El efecto es puramente cosmético, pero se siente muy extraño de todos modos.\n\nTurnos de disfraz restantes: %s.

actors.buffs.hex.name=hechizado
actors.buffs.hex.heromsg=¡Has sido hechizado!
actors.buffs.hex.desc=Magia oscura que drena la concentración, desorientando ligeramente al objetivo.\n\nHechizado reduce la precisión y la evasión en 20%%, haciendo al objetivo menos efectivo en combate.\n\nTurnos restantes hechizado: %s.

actors.buffs.holdfast.name=firmeza
actors.buffs.holdfast.desc=El Guerrero mantiene su posición, aumentando su armadura por %1$d-%2$d. Esto durará hasta que se mueva.

actors.buffs.hunger.hungry=hambriento
actors.buffs.hunger.starving=famélico
actors.buffs.hunger.onhungry=Estás hambriento.
actors.buffs.hunger.onstarving=¡Estás famélico!
actors.buffs.hunger.ondeath=Moriste de hambre...
actors.buffs.hunger.cursedhorn=El cuerno maldito te roba algo de la comida que comes.
actors.buffs.hunger.rankings_desc=Murió de Hambre
actors.buffs.hunger.desc_intro_hungry=Sientes que tu estomago te pide comida, pero no es demasiado urgente todavía.
actors.buffs.hunger.desc_intro_starving=Tienes tanta hambre que duele.
actors.buffs.hunger.desc=\n\nEl hambre aumenta lentamente mientras pasas tiempo en la mazmorra. Eventualmente comenzarás a perder vida por el hambre. Mientras eso pase tu salud mermará en vez de regenerarse.\n\n¡Racionar es importante! Si tienes salud suficiente, pasar hambre no es mala idea si eso significa que habrá más comida luego. \n¡Un racionamiento efectivo hace que la comida dure mucho más!

actors.buffs.invisibility.name=invisible
actors.buffs.invisibility.desc=Estás completamente camuflado con el terreno circundante, haciendo imposible verte.\n\nMientras permaneces invisible eres incapaz de ser atacado o seguido. Ataques físicos y efectos mágicos (como pergaminos y varitas) cancelarán inmediatamente la invisibilidad.\n\nTurnos de invisibilidad restantes: %s.

actors.buffs.invulnerability.name=invulnerable
actors.buffs.invulnerability.desc=Estás impregnado de un gran poder protector que te otorga un breve periodo de invulnerabilidad.\n\nTurnos restantes: %s.

actors.buffs.levitation.name=levitando
actors.buffs.levitation.desc=Una fuerza mágica te está haciendo levitar por encima del suelo, haciéndote sentir ligero.\n\nPersonajes que levitan se mueven silenciosamente e ignoran todos los efectos relacionados a estar en contacto con el suelo. Las trampas no se activarán, el agua no apagará el fuego, las plantas no serán pisoteadas, los enraizamientos fallarán, y flotarán sobre las fosas. Ten cuidado, ¡ya que todas estas cosas pueden entrar en efecto en cuanto la levitación termine!\n\nTurnos de levitación restantes: %s.

actors.buffs.lifelink.name=vinculo vital
actors.buffs.lifelink.desc=La fuerza vital de este personaje se encuentra vinculada a otro personaje cercano. Cualquier daño recibido se reparte entre ellos.\n\nSiempre que este personaje reciba daño, la mitad será redirigida al objetivo del vinculo vital en su lugar.\n\nTurnos de vínculo vital restantes: %s, o hasta que el personaje vinculado muera.

actors.buffs.light.name=iluminado
actors.buffs.light.desc=Incluso en la Mazmorra más oscura, una luz estable a tu lado es siempre alentadora.\n\nLa luz ayuda a mantener la oscuridad a raya, permiténdote ver una razonable distancia, a pesar del ambiente.\n\nTurnos de iluminación restantes: %s.

actors.buffs.lockedfloor.name=el nivel está cerrado
actors.buffs.lockedfloor.desc=¡El nivel actual está cerrado, y no eres capaz de salir!\n\nMientras el nivel está cerrado, el hambre no aumentará ni te causará daño. Además, si no intentas derrotar al jefe de este piso, los efectos pasivos de regeneración también se detendrán.\n\nAdicionalmente, si eres revivido por un Ankh no bendito, el piso volverá a su estado inicial.\n\nMata al jefe del piso para romper la cerradura.

actors.buffs.lostinventory.name=inventario perdido
actors.buffs.lostinventory.desc=¡Tu inventario se ha perdido en algún lugar de la mazmorra! No podrás recoger ni utilizar la mayoría de los ítems hasta que recuperes tu inventario.

actors.buffs.magicalsight.name=visión mágica
actors.buffs.magicalsight.desc=De alguna manera eres capaz de ver con tu mente, en lugar de con tus ojos.\n\nMientras visión mágica esté activa, podrás ver a través de todo tipo de terreno en un radio de 12 casillas.\n\nTurnos de visión mágica restantes: %s.

actors.buffs.magicalsleep.name=sueño mágico
actors.buffs.magicalsleep.toohealthy=Estas demasiado sano y resistes el impulso de dormir.
actors.buffs.magicalsleep.fallasleep=Caes en un profundo y magico sueño.
actors.buffs.magicalsleep.wakeup=Te despiertas sintiendote refrescado y saludable.
actors.buffs.magicalsleep.desc=Este personaje ha caído en un profundo sueño mágico del que no se despertará de forma natural.\n\nEl sueño mágico es similar al sueño normal, excepto que solo el daño hará que el objetivo se despierte.\n\nPara el héroe y sus aliados, el sueño mágico tiene algunas propiedades restauradoras, lo que les permite sanar rápidamente mientras descansan.

actors.buffs.magicimmune.name=inmunidad a la magia
actors.buffs.magicimmune.desc=Todos los efectos mágicos han perdido su control sobre ti, eres completamente impermeable a ellos\n\nMientras seas inmune a la magia, todos los efectos mágicos dañinos y útiles no se aplicarán a ti, incluyendo maldiciones, hechizos, varitas, pergaminos, anillos, artefactos, etc. Habilidades de armadura heróica son lo suficientemente fuerte para funcionar a pesar de este efecto.\n\nTurnos de inmunidad mágica restantes: %s.

actors.buffs.mindvision.name=visión mental
actors.buffs.mindvision.desc=De alguna manera puedes ver a todas las criaturas en este piso a través de tu mente. Es una sensación extraña.\n\nTodos los personajes en este nivel son visibles para ti mientras poseas visión mental. Ver a una criatura a través de tu mente cuenta como si estuviera cerca o dentro de tu campo visual para activar varios efectos mágicos.\n\nTurnos de visión mental restantes: %s

actors.buffs.momentum.momentum=ganando impulso
actors.buffs.momentum.running=en carrera
actors.buffs.momentum.resting=recuperándose
actors.buffs.momentum.action_name=carrera
actors.buffs.momentum.momentum_desc=Mientras se mueve, el Acróbata gana impulso, el cual puede gastar para entrar en carrera.\n\nCada carga de impulso otorga dos turnos de carrera, el Acróbata puede acumular hasta 10 cargas. El impulso se pierde rápidamente cuando el Acróbata deja de moverse.\n\nCargas de impulso: %d.
actors.buffs.momentum.running_desc=Mientras se mueve, el Acróbata gana impulso, el cual puede gastar para entrar en carrera.\n\nEstando en carrera, el Acróbata se mueve el doble de rápido y gana evasión adicional dependiendo de su nivel.\n\nTurnos restantes: %d.
actors.buffs.momentum.resting_desc=Mientras se mueve, el Acróbata gana impulso, el cual puede gastar para entrar en carrera.\n\nEl Acróbata necesita tiempo para recuperar su aliento antes de poder ganar impulso de nuevo.\n\nTurnos restantes: %d.

actors.buffs.monkenergy.name=energía
actors.buffs.monkenergy.action=Técnicas de Monje
actors.buffs.monkenergy.desc=A medida que derrota a los enemigos, la Monje gana energía que puede usar en una variedad de técnicas. La mayoría de los enemigos otorgan 1 de energía cuando son derrotados, y la Monje no pierde energía con el tiempo.\n\nEnergía actual: %1$d/%2$d.
actors.buffs.monkenergy.desc_cooldown=La Monje ha usado una técnica recientemente, y debe esperar antes de usar otra.\n\nTurnos de recarga: %d.
actors.buffs.monkenergy$monkability$flurry.name=ráfaga de golpes
actors.buffs.monkenergy$monkability$flurry.desc=Dos ataques instantáneos que infligen %1$d-%2$d de daño e ignoran la armadura. Esta técnica no puede usarse repetidamente.
actors.buffs.monkenergy$monkability$flurry.empower_desc=Dos ataques instantáneos que infligen %1$d-%2$d de daño, ignoran la armadura _y usan el encantamiento de tu arma._ Esta técnica no puede usarse repetidamente.
actors.buffs.monkenergy$monkability$focus.name=concentración
actors.buffs.monkenergy$monkability$focus.desc=La Monje toma un turno para concentrarse, permitiéndole detener el siguiente ataque que reciba.
actors.buffs.monkenergy$monkability$focus.empower_desc=La Monje _se concentra instantáneamente,_ permitiéndole detener el siguiente ataque que reciba.
actors.buffs.monkenergy$monkability$focus$focusbuff.name=concentrada
actors.buffs.monkenergy$monkability$focus$focusbuff.desc=La Monje se concentra en su entorno, anticipando el próximo ataque contra ella. Mientras está concentrada, tiene la garantía de parar el próximo ataque que reciba.
actors.buffs.monkenergy$monkability$dash.name=carrera
actors.buffs.monkenergy$monkability$dash.prompt=Elige una ubicación
actors.buffs.monkenergy$monkability$dash.desc=Una carrera instantánea de hasta 4 casillas de distancia. Esta técnica puede pasar por encima de peligros, pero no a través de enemigos o terreno solido.
actors.buffs.monkenergy$monkability$dash.empower_desc=Una carrera instantánea de hasta _8 casillas_ de distancia. Esta técnica puede pasar por encima de peligros, pero no a través de enemigos o terreno solido.
actors.buffs.monkenergy$monkability$dragonkick.name=patada de dragón
actors.buffs.monkenergy$monkability$dragonkick.desc=Una devastadora patada que inflige %1$d-%2$d de daño e ignora la armadura. La patada empuja al objetivo y lo paraliza por cada casilla que viaje.
actors.buffs.monkenergy$monkability$dragonkick.empower_desc=Una devastadora patada que inflige _%1$d-%2$d de daño_ e ignora la armadura. La patada empuja a _todos los objetivos adyacentes_ y los paraliza por cada casilla que viajen.
actors.buffs.monkenergy$monkability$meditate.name=meditar
actors.buffs.monkenergy$monkability$meditate.desc=La Monje concentra energía en su cuerpo por 5 turnos. Esto quita la mayoría de efectos negativos y otorga 8 turnos de recarga de varitas y artefactos.
actors.buffs.monkenergy$monkability$meditate.empower_desc=La Monje concentra energía en su cuerpo por 5 turnos. Esto quita la mayoría de efectos negativos y otorga 8 turnos de recarga de varitas y artefactos. _Además gana 80% de resistencia al daño mientras medita y se cura lentamente el 20% de sus PS faltantes._

actors.buffs.ooze.name=cieno cáustico
actors.buffs.ooze.heromsg=¡El cieno cáustico te quema la piel, lávalo!
actors.buffs.ooze.ondeath=Te derrites...
actors.buffs.ooze.rankings_desc=Disuelto
actors.buffs.ooze.desc=Este ácido pegajoso se aferra a tu piel, derritiéndola lentamente.\n\nEste cieno te hará daño constante a lo largo del tiempo, pero puede lavarse inmediatamente en agua.\n\nTurnos de cieno restantes: %s.

actors.buffs.paralysis.name=paralizado
actors.buffs.paralysis.heromsg=¡Estás paralizado!
actors.buffs.paralysis.out=parálisis resistida
actors.buffs.paralysis.desc=A menudo, lo peor que se puede hacer es nada en absoluto.\n\nLa parálisis detiene por completo todas las acciones, lo que obliga al objetivo a esperar hasta que el efecto desaparezca. El dolor del daño recibido puede hacer que los personajes se resistan a la parálisis, sacándolos del efecto.\n\nTurnos de parálisis restantes: %s

actors.buffs.physicalempower.name=físicamente empoderado
actors.buffs.physicalempower.desc=Tus golpes han sido potenciados, incrementando el daño que causas al golpear enemigos con ataques físicos.\n\nDaño adicional: %1$d.\nGolpes restantes: %2$d.

actors.buffs.pincushion.name=alfiletero
actors.buffs.pincushion.desc=Las armas arrojadizas que has usado contra este personaje se encuentran clavadas en él y caerán al suelo cuando sea derrotado.\n\nLos siguientes ítems se encuentran clavados:

actors.buffs.poison.name=envenenado
actors.buffs.poison.heromsg=¡Estás envenenado!
actors.buffs.poison.ondeath=Has muerto por envenenamiento...
actors.buffs.poison.rankings_desc=Sucumbió al Veneno
actors.buffs.poison.desc=El veneno se abre paso a través del cuerpo, impidiendo lentamente su funcionamiento normal.\n\nEl veneno ocasiona daño cada turno proporcionalmente al tiempo que le falta para expirar.\n\nTurnos de envenenamiento restantes: %s.

actors.buffs.preparation.name=preparación
actors.buffs.preparation.action_name=ataque preparado
actors.buffs.preparation.desc=El Asesino está esperando pacientemente, preparándose para golpear desde las sombras.
actors.buffs.preparation.desc_dmg=Su próximo ataque infligirá _%1$d%% de daño adicional_, y ejecutará enemigos regulares por debajo de _%2$d%% salud_, o jefes por debajo de _%3$d%% salud_.
actors.buffs.preparation.desc_dmg_likely=El ataque también será más probable que provoque una mayor cantidad de daño.
actors.buffs.preparation.desc_blink=Él puede destellar hacia un enemigo antes de golpearlo, con una distancia máxima de _%d_.
actors.buffs.preparation.desc_invis_time=Turnos estando invisible: _%d._
actors.buffs.preparation.desc_invis_next=Turnos para ataque más fuerte: _%d._
actors.buffs.preparation.prompt=¡Seleccione un objetivo a atacar!\nMáxima distancia de destello: %d
actors.buffs.preparation.no_target=Ahí no hay nada a qué atacar.
actors.buffs.preparation.out_of_reach=El objetivo está fuera de alcance.
actors.buffs.preparation.assassinated=asesinado

actors.buffs.prismaticguard.name=guardia prismático
actors.buffs.prismaticguard.desc=Estás siendo protegido por una imagen prismática que está actualmente inactiva. Cuando hay enemigos, ¡la imagen prismática se activará y te protegerá!\n\nMientras está inactiva, la imagen prismática se recuperará de cualquier daño que haya sufrido.\n\nPS actual: %d/%d.

actors.buffs.recharging.name=recargando
actors.buffs.recharging.desc=La energía recorre tu cuerpo, incrementando la velocidad a la que se cargan tus varitas y bastones.\n\nEste efecto incrementará la carga actual en un cuarto durante cada turno, además de la recarga regular.\n\nTurnos de recarga restantes: %s.

actors.buffs.revealedarea.name=área reveleada
actors.buffs.revealedarea.desc=Un área de la mazmorra ha sido revelada al héroe temporalmente, la cual verá sin importar dónde esté.\n\nTurnos restantes: %s.

actors.buffs.revealedchar.name=revelado
actors.buffs.revealedchar.desc=Este personaje ha sido revelado al héroe y será visible sin importar dónde se encuentre.\n\nTurnos restantes: %s.

actors.buffs.roots.name=enraizado
actors.buffs.roots.heromsg=¡No puedes moverte!
actors.buffs.roots.desc=Raices (mágicas o naturales) se agarran de los pies, forzándolos al suelo.\n\nLas raíces inmovilizan a un objetivo, imposibilitando el movimiento y la mayoría de las habilidades de movimiento. Otras acciones no se ven afectadas, incluidos los efectos de teletransporte.\n\nTurnos de enraizado restantes: %s.

actors.buffs.scrollempower.name=pergamino potenciador
actors.buffs.scrollempower.desc=¡La energía del pergamino leído recientemente por el Mago está potenciando sus varitas!\n\nAumento de nivel: +%1$d.\nDisparos restantes: %2$d.

actors.buffs.shadows.name=fundido con las sombras
actors.buffs.shadows.desc=Estás fundido con las sombras a tu alrededor, concediéndote invisibilidad y ralentizando tu metabolismo\n\nMientras seas invisible, los enemigos no pueden atacarte o seguirte. La mayoría de los ataques físicos y efectos mágicos (como pergaminos y varitas) cancelarán inmediatamente la invisibilidad. Además, mientras  estés fundido con las sombras, la velocidad a la que ganas hambre se reduce.\n\nQuedarás fundido con las sombras hasta que salgas de ellas o un enemigo entre en contacto contigo.

actors.buffs.slow.name=ralentizado
actors.buffs.slow.desc=La magia de ralentización afecta al ritmo del tiempo del objetivo; para ellos todo se mueve súper rápido.\n\nUn personaje ralentizado realiza todas las acciones en el doble de tiempo que le tomaría normalmente.\n\nTurnos de ralentización restantes: %s.

actors.buffs.snipersmark.name=marca de la francotiradora
actors.buffs.snipersmark.action_name_snapshot=tiro instantáneo
actors.buffs.snipersmark.action_name_volley=ráfaga
actors.buffs.snipersmark.action_name_sniper=disparo de francotirador
actors.buffs.snipersmark.desc=La Francotiradora se enfoca en el objetivo que atacó más recientemente. Es capaz de realizar un ataque especial con su arco que variará según cómo el arco fue aumentado.\n\nUn arco sin aumentar disparará un _tiro Instantáneo_, que causa un daño reducido pero no tarda ningún tiempo en dispararse.\n\nUn arco aumentado en velocidad disparará una _ráfaga_ de tres flechas. Cada flecha infligirá daño reducido, pero aún pueden activar encantamientos. Esta ráfaga toma 1 turno en dispararse.\n\nUn arco aumentado en daño disparará un _disparo de francotirador_. Este disparo está garantizado a impactar, infligiendo daño adicional según la distancia del objetivo y toma 2 turnos en dispararse.

actors.buffs.soulmark.name=alma marcada
actors.buffs.soulmark.desc=El brujo ha marcado el alma de esta criatura, permitiéndole curarse cuando la criatura reciba daño físico.\n\nTurnos de la marca restantes: %s.

actors.buffs.stamina.name=resistencia
actors.buffs.stamina.desc=¡Tienes resistencia interminable, lo que te permite moverte más rápido!\n\nMientras estés bajo los efectos de la resistencia correrás a +50%% de velocidad, pero realizarás todas las otras acciones a velocidad normal.\n\nTurnos de resistencia restantes: %s.

actors.buffs.vulnerable.name=vulnerable
actors.buffs.vulnerable.heromsg=¡Te sientes frágil!
actors.buffs.vulnerable.desc=La magia de vulnerabilidad incrementa todo el daño físico que un personaje recibe en 33%%, después de que ese daño haya sido reducido por la armadura.\n\nTurnos de vulnerabilidad restantes: %s.

actors.buffs.terror.name=aterrado
actors.buffs.terror.desc=El terror es una magia manipuladora que fuerza a su objetivo a un pánico incontrolable.\n\nLos personajes aterrorizados se ven obligados a huir de su oponente, tratando de poner tantas puertas y paredes entre ellos como sea posible. Sin embargo, el impacto del dolor disminuirá la duración del terror.\n\nTurnos de terror restantes: %s.

actors.buffs.toxicimbue.name=imbuido con toxicidad
actors.buffs.toxicimbue.desc=¡Estás imbuido con energía tóxica!\n\nA medida que te mueves, un gas tóxico emanará constantemente de tu cuerpo, dañando a tus enemigos. Eres inmune al gas tóxico y al veneno mientras dure este efecto, además de por unos pocos turnos cuando el efecto acabe.\n\nTurnos restantes: %s.

actors.buffs.corrosion.name=corrosión
actors.buffs.corrosion.heromsg=¡Te estás derritiendo!
actors.buffs.corrosion.ondeath=Te derrites...
actors.buffs.corrosion.rankings_desc=Disuelto
actors.buffs.corrosion.desc=Poderoso acido que derrite carne, metal y huesos a un ritmo alarmador.\n\nEl daño de corrosión incrementa con el paso del tiempo, mientras el objetivo siga derritiendose.\n\nTurnos de corrosión restantes: %1$s.\nDaño de corrosión: %2$d.

actors.buffs.vertigo.name=vértigo
actors.buffs.vertigo.desc=Caminar en línea recta puede ser difícil cuando todo te da vueltas.\n\nBajo los efectos del vértigo, personajes que intenten moverse irán en una dirección aleatoria, en vez de la que querían ir.\n\nTurnos de vértigo restantes: %s.

actors.buffs.wandempower.name=varitas potenciadas
actors.buffs.wandempower.desc=El daño de tus varitas ofensivas ha sido potenciado, incrementando la cantidad de daño que pueden infligir por unos cuantos golpes.\n\nDaño adicional: %1$d.\nGolpes restantes: %2$d.

actors.buffs.weakness.name=debilitado
actors.buffs.weakness.heromsg=¡Te sientes debilitado!
actors.buffs.weakness.desc=De repente todo se siente mucho más pesado.\n\nLa magia debilitante reduce la fuerza física de un personaje, causando que inflija 33%% de daño reducido.\n\nTurnos de debilidad restantes: %s.

actors.buffs.wellfed.name=bien alimentado
actors.buffs.wellfed.desc=Te sientes bastante satisfecho y lleno.\n\nMientras estás bien alimentado, tu apetito no aumentará y podrás sanar una cantidad adicional de salud con el tiempo.\n\nTurnos restantes: %d.



###hero

##abilities
actors.hero.abilities.armorability.self_target=¡No puedes apuntarte a ti mismo!
actors.hero.abilities.armorability.no_target=¡No hay nada que apuntar allí!
actors.hero.abilities.armorability.prompt=Elige un lugar al que apuntar
actors.hero.abilities.armorability.cost=Coste de carga: _%d_

actors.hero.abilities.warrior.heroicleap.name=salto heroico
actors.hero.abilities.warrior.heroicleap.prompt=Elige la dirección para saltar
actors.hero.abilities.warrior.heroicleap.short_desc=El Guerrero realiza un _Salto Heroico_ hacia una ubicación específica, atravesando enemigos y peligros.
actors.hero.abilities.warrior.heroicleap.desc=El Guerrero salta hacia una ubicación específica, por encima de cualquier enemigo o peligro en su camino. Sin embargo, no puede saltar paredes u otro terreno sólido.
actors.hero.abilities.warrior.shockwave.name=onda de choque
actors.hero.abilities.warrior.shockwave.short_desc=El Guerrero libera una _Onda de choque_ en un área cónica al golpear el suelo. Los enemigos alcanzados por la onda serán dañados y lisiados.
actors.hero.abilities.warrior.shockwave.desc=El Guerrero golpea el suelo, produciendo una onda de choque que viaja hasta 5 casillas en un cono de 60 grados.\n\nLos enemigos alcanzados por la onda de choque serán lisiados durante 5 turnos. También recibirán 5-10 de daño, más 1-2 de daño adicional por cada punto de fuerza que el Guerrero tenga por encima de 10.
actors.hero.abilities.warrior.endure.name=Aguantar
actors.hero.abilities.warrior.endure$enduretracker.name=aguante
actors.hero.abilities.warrior.endure$enduretracker.desc=El guerrero está infligiendo daño adicional en base al daño que aguantó.\n\nDaño adicional: %1$d\nGolpes restantes: %2$d
actors.hero.abilities.warrior.endure.short_desc=El Guerrero _Aguanta_, saltándose turnos pero ganando resistencia al daño. Luego inflige daño adicional en función de lo que aguantó.
actors.hero.abilities.warrior.endure.desc=El Guerrero aguanta 3 turnos y recibe la mitad del daño de todas las fuentes. Esta reducción se aplica antes de los efectos de resistencia al daño como la armadura.\n\nDespués de aguantar, el siguiente golpe del Guerrero dentro de los próximos 10 turnos gana daño adicional. Equivalente a la mitad de todo el daño recibido mientras aguantaba, ¡antes de que se aplique cualquier reducción!\n\nSi el Guerrero tiene puntos de combo, usar esta habilidad incrementa su duración en 3 turnos.

actors.hero.abilities.mage.elementalblast.name=explosión elemental
actors.hero.abilities.mage.elementalblast.no_staff=No puedes usar esta habilidad sin tu bastón.
actors.hero.abilities.mage.elementalblast.short_desc=El Mago emite una _Explosión Elemental_, cubriendo una gran área a su alrededor con un efecto basado en el de la varita imbuida en su bastón.
actors.hero.abilities.mage.elementalblast.desc=El Mago emite una explosión de magia, que cubre una región circular de hasta 4 casillas a su alrededor e inflige 15-25 de daño. El efecto específico de la explosión elemental variará según la varita imbuida en el bastón del Mago.
actors.hero.abilities.mage.elementalblast.generic_desc=El efecto de explosión elemental será similar al efecto de la varita cuando se dispara contra un enemigo o aliado.
actors.hero.abilities.mage.wildmagic.name=magia salvaje
actors.hero.abilities.mage.wildmagic.no_wands=¡No tienes ningún bastón con el cual disparar!
actors.hero.abilities.mage.wildmagic.short_desc=El Mago libera la _Magia Salvaje_ contenida en sus varitas, disparándolas al azar varias veces a un objetivo en un solo turno.
actors.hero.abilities.mage.wildmagic.desc=El Mago libera el poder de sus varitas, disparándolas al azar hasta 4 veces en un solo turno. El bastón del Mago no está incluido en este efecto.\n\nCada varita tiene su nivel potenciado en 2, hasta un máximo de +3. Esta habilidad gasta media carga de varita por cada disparo y ninguna varita puede dispararse más de 2 veces.
actors.hero.abilities.mage.warpbeacon.name=baliza de teletransporte
actors.hero.abilities.mage.warpbeacon.depths=¡No puedes teletransportare entre diferentes profundidades!
actors.hero.abilities.mage.warpbeacon.locked_floor=¡No puedes abandonar un nivel cerrado!
actors.hero.abilities.mage.warpbeacon.too_far=¡Esa ubicación está demasiado lejos!
actors.hero.abilities.mage.warpbeacon.invalid_beacon=¡No puedes colocar una baliza ahí!
actors.hero.abilities.mage.warpbeacon.window_desc=Tu baliza esta actualmente ubicada en el piso %d.
actors.hero.abilities.mage.warpbeacon.window_tele=Volver a la baliza
actors.hero.abilities.mage.warpbeacon.window_clear=quitar baliza
actors.hero.abilities.mage.warpbeacon.window_cancel=cancelar
actors.hero.abilities.mage.warpbeacon.short_desc=El Mago coloca una _Baliza de Teletransporte_ en su ubicación, a la que puede teletransportarse instantáneamente.
actors.hero.abilities.mage.warpbeacon.desc=El Mago coloca una baliza, a la que luego puede teletransportarse a voluntad. Colocar la baliza toma 1 turno, pero volver a esta es instantáneo.\n\nEl Mago no puede teletransportarse entre pisos de forma predeterminada, ni usar la baliza para llegar a lugares inaccesibles, como habitaciones cerradas. El Mago puede teletransportarse sobre enemigos, a los que hará a un lado.

actors.hero.abilities.rogue.smokebomb.name=bomba de humo
actors.hero.abilities.rogue.smokebomb.fov=Solo puedes saltar a una ubicación vacía en tu campo de visión
actors.hero.abilities.rogue.smokebomb.prompt=Elige una ubicación hacia donde saltar
actors.hero.abilities.rogue.smokebomb$ninjalog.name=señuelo de madera
actors.hero.abilities.rogue.smokebomb$ninjalog.desc=¡De alguna manera, los enemigos están convencidos de que este señuelo de madera es realmente el Pícaro!
actors.hero.abilities.rogue.smokebomb.short_desc=El Pícaro lanza una _Bomba de Humo_ mientras se retira en un destello. Cegando a los enemigos cercanos a su antigua ubicación.
actors.hero.abilities.rogue.smokebomb.desc=El Pícaro lanza una bomba de humo y se retira en un destello de hasta 6 casillas de distancia. Puede destellar a través de peligros y enemigos, pero no a través de terrenos sólidos como paredes.\n\nLos enemigos adyacentes a la antigua posición del Pícaro serán cegados por 5 turnos.
actors.hero.abilities.rogue.deathmark.name=marca de muerte
actors.hero.abilities.rogue.deathmark.ally_target=Solo puedes marcar enemigos
actors.hero.abilities.rogue.deathmark.short_desc=El Pícaro coloca una _Marca de Muerte_ en un enemigo. El cual recibe daño adicional, pero no puede morir hasta que la marca se desvanezca.
actors.hero.abilities.rogue.deathmark.desc=El Pícaro coloca una marca en un enemigo a elección, lo que hace que reciba un 25% de daño adicional. La marca se aplica instantáneamente y dura 5 turnos.\n\nLos enemigos marcados reciben daño adicional pero no pueden morir hasta que la marca expire. Si un enemigo tiene 0 PS cuando la marca se desvanezca, morirá inmediatamente.
actors.hero.abilities.rogue.deathmark$deathmarktracker.name=marcado por la muerte
actors.hero.abilities.rogue.deathmark$deathmarktracker.desc=Este enemigo ha sido marcado, lo que hace que reciba un 25%% de daño adicional, pero también lo hace incapaz de morir hasta que la marca se desvanezca.\n\nTurnos restantes: %s.
actors.hero.abilities.rogue.shadowclone.name=clon de sombra
actors.hero.abilities.rogue.shadowclone.short_desc=El Pícaro invoca un _Clon de Sombra_, al que puede dirigir para que lo ayude en combate.
actors.hero.abilities.rogue.shadowclone.desc=El Pícaro invoca una sombría copia de sí mismo, a la que puede dirigir para que lo ayude en combate. Dirigir al clon de sombra no cuesta ninguna carga.\n\nEl clon tiene 80 PS, no tiene armadura e inflige 10-20 de daño. Estos rasgos se pueden mejorar con los talentos, de modo que el clon se beneficie del arma y armadura que el héroe tenga.
actors.hero.abilities.rogue.shadowclone$shadowally.name=Pícaro de sombra
actors.hero.abilities.rogue.shadowclone$shadowally.direct_defend=Tu clon se mueve a esa posición.
actors.hero.abilities.rogue.shadowclone$shadowally.direct_follow=Tu clon te seguirá.
actors.hero.abilities.rogue.shadowclone$shadowally.direct_attack=¡Tu clon atacará!
actors.hero.abilities.rogue.shadowclone$shadowally.desc=Una copia del Pícaro, hecha de sombría oscuridad. Se mantiene inmóvil, con los ojos vacíos y desprende oscuridad que se eleva como vapor.\n\nEl clon no es una copia perfecta del Pícaro, pero sigue siendo un luchador decente y puede beneficiarse del equipamiento del Pícaro con los talentos adecuados.

actors.hero.abilities.huntress.spectralblades.name=cuchillas espectrales
actors.hero.abilities.huntress.spectralblades.short_desc=La Cazadora lanza _Cuchillas Espectrales_ a un objetivo, lo que inflige daño según el arma cuerpo a cuerpo que tenga equipada.
actors.hero.abilities.huntress.spectralblades.desc=La Cazadora lanza una cuchilla espectral a un enemigo, que actúa como un golpe a distancia de su arma cuerpo a cuerpo. Se activarán todos los efectos normales de esta, incluyendo encantamientos.
actors.hero.abilities.huntress.naturespower.name=poder de la naturaleza
actors.hero.abilities.huntress.naturespower.short_desc=La Cazadora invoca el _Poder de la Naturaleza_, aumentando su velocidad de movimiento y la cadencia de fuego de su arco por un corto tiempo.
actors.hero.abilities.huntress.naturespower.desc=¡La Cazadora se empodera temporalmente a sí misma y a su arco con el poder de la naturaleza! Esto tiene una duración de 8 turnos.\n\nDurante este tiempo, la Cazadora se mueve al doble de velocidad y ataca un 33% más rápido con su arco. Los efectos adicionales del arco no se activan si la Francotiradora está usando sus ataques especiales.
actors.hero.abilities.huntress.naturespower$naturespowertracker.name=poder de la naturaleza
actors.hero.abilities.huntress.naturespower$naturespowertracker.desc=La Cazadora se empodera brevemente, aumentando su velocidad de movimiento y velocidad de ataque con su arco.\n\nTurnos restantes: %s.
actors.hero.abilities.huntress.spirithawk.name=halcón espíritu
actors.hero.abilities.huntress.spirithawk.no_space=No hay espacio libre cerca de ti.
actors.hero.abilities.huntress.spirithawk.short_desc=La Cazadora invoca a un _Halcón Espíritu_ como familiar, que puede ayudarla a explorar ubicaciones y distraer a los enemigos.
actors.hero.abilities.huntress.spirithawk.desc=La Cazadora invoca a un halcón espíritu como familiar, al que puede dirigir usando nuevamente la habilidad cuando este ya invocado. El halcón dura 100 turnos y dirigirlo no cuesta ninguna carga.\n\nEl halcón tiene salud y poder de ataque mínimos, pero es rápido, evasivo y preciso. Comparte en todo momento su campo de visión con la Cazadora. Es inmune a todos los efectos de área, tales como el fuego y el gas venenoso. No atacará a menos que se le indique específicamente.
actors.hero.abilities.huntress.spirithawk$hawkally.name=halcón espíritu
actors.hero.abilities.huntress.spirithawk$hawkally.direct_defend=Tu halcón se mueve a esa posición.
actors.hero.abilities.huntress.spirithawk$hawkally.direct_follow=Tu halcón te seguirá.
actors.hero.abilities.huntress.spirithawk$hawkally.direct_attack=¡Tu halcón atacará!
actors.hero.abilities.huntress.spirithawk$hawkally.desc=Un halcón mágico, invocado por la Cazadora. Resplandece un brillante azul etéreo, su cabeza se mueve constantemente mientras inspecciona el área.\n\nSi bien no es un gran luchador, su velocidad y visión lo hacen excelente para explorar y distraer a los enemigos.
actors.hero.abilities.huntress.spirithawk$hawkally.desc_remaining=Turnos restantes: %d.
actors.hero.abilities.huntress.spirithawk$hawkally.desc_dodges=Esquives garantizados restantes: %d.

actors.hero.abilities.duelist.challenge.name=Desafío
actors.hero.abilities.duelist.challenge.prompt=Elige un enemigo a desafiar
actors.hero.abilities.duelist.challenge.already_dueling=Solo puedes estar en un duelo a la vez.
actors.hero.abilities.duelist.challenge.ally_target=Solo puedes desafiar a enemigos.
actors.hero.abilities.duelist.challenge.unreachable_target=Debes ser capaz de alcanzar tu objetivo.
actors.hero.abilities.duelist.challenge.distant_target=Ese enemigo está muy lejos para ser desafiado.
actors.hero.abilities.duelist.challenge.short_desc=La Duelista _Desafía_ a un enemigo cercano a un duelo, congelando temporalmente a los demás enemigos.
actors.hero.abilities.duelist.challenge.desc=La Duelista desafía a un enemigo cercano a un duelo. Ese enemigo se ve obligado a luchar contra ella mientras todos los demás enemigos quedan temporalmente congelados en el tiempo.\n\nEl objetivo debe ser alcanzable y estar a 5 casillas de la Duelista. El duelo dura hasta que pasen 10 turnos, el enemigo muere o la Duelista está a más de 5 casillas de distancia del enemigo.\n\nLos enemigos congelados son invulnerables. Los aliados de la Duelista no se congelarán por esta habilidad y si un jefe es el objetivo de la misma, tampoco se congelarán sus esbirros.
actors.hero.abilities.duelist.challenge$duelparticipant.name=duelista
actors.hero.abilities.duelist.challenge$duelparticipant.desc=Este personaje es participante de un duelo. Este, y cualquiera de sus aliados o esbirros, tiene permitido actuar normalmente mientras que los demás están congelados.\n\nEl duelo durará un tiempo determinado, hasta que uno de los participantes muera, o hasta que los participantes se alejen más de 5 casillas entre sí.\n\nTurnos restantes: %d.
actors.hero.abilities.duelist.elementalstrike.name=impacto elemental
actors.hero.abilities.duelist.elementalstrike.short_desc=La Duelista realiza un _Impacto Elemental_, extendiendo un efecto en un área cónica basado en el encantamiento de su arma.
actors.hero.abilities.duelist.elementalstrike.desc=La Duelista impacta a un enemigo o ubicación, realizando un ataque normal que está garantizado a impactar y extendiendo un efecto mágico que viaja hasta 4 casilla en un cono de 65 grados. Este efecto mágico varia en base al encantamiento del arma primaria de la Duelista.
actors.hero.abilities.duelist.elementalstrike.generic_desc=Un impacto elemental sin encantamiento liberará una pequeña explosión mágica, causando 6-12 de daño a todos los enemigos a su alcance.
actors.hero.abilities.duelist.feint.name=finta
actors.hero.abilities.duelist.feint.prompt=Elige la ubicación a desplazarte
actors.hero.abilities.duelist.feint.too_far=Esa ubicación no es adyacente a ti.
actors.hero.abilities.duelist.feint.bad_location=No puedes moverte a esa ubicación.
actors.hero.abilities.duelist.feint.short_desc=La Duelista realiza una _Finta_, fingiendo atacar mientras se desplaza a una casilla adyacente. Los enemigos atacarán a su imagen remanente, dejándoles expuestos al contrataque.
actors.hero.abilities.duelist.feint.desc=La Duelista finge un ataque mientras se desplaza hacia una casilla adyacente. dejando momentáneamente una imagen remanente de sí misma. Los enemigos que estaban atacando a la Duelista atacarán a dicha imagen en su lugar.\n\nLos enemigos que ataquen a la imagen remanente serán confundidos, lo que cancela su siguiente acción y les deja expuesto a un ataque sorpresa.

actors.hero.abilities.ratmogrify.name=enratuzar
actors.hero.abilities.ratmogrify.cant_transform=¡No puedes enratuzar eso!
actors.hero.abilities.ratmogrify.too_strong=¡Ese enemigo es muy poderoso para ser enratuzado!
actors.hero.abilities.ratmogrify.short_desc=¡El héroe _Enratuza_ a un enemigo! Esto los convertirá temporalmente en una rata sin habilidades.
actors.hero.abilities.ratmogrify.desc=¡El héroe convertirá a un enemigo en una rata por 6 turnos! Jefes, aliados y ratas no pueden ser enratuzados.\n\nLos enemigos enratuzados conservan sus estadísticas originales, pero no tienen ninguna habilidad.
actors.hero.abilities.ratmogrify$transmograt.name=%s enratuzado
actors.hero.abilities.ratmogrify$transmograt.desc=Este enemigo ha sido transformado en rata. ¡Un gran avance, si me lo preguntas! - Rey Rata
actors.hero.abilities.ratmogrify$transmograt.rankings_desc=Matado por: enemigo enratuzado

##main hero
actors.hero.hero.name=tú
actors.hero.hero.leave=Aún no puedes irte, ¡el resto de la mazmorra espera debajo!
actors.hero.hero.level_up=¡Subes de nivel!
actors.hero.hero.new_level=¡Has subido de nivel! +Precisión, +Evasión, +5 PS!
actors.hero.hero.new_talent=¡+1 Punto de Talento!
actors.hero.hero.unspent=¡Tienes puntos de talento sin gastar!
actors.hero.hero.level_cap=¡No puedes volverte más fuerte, pero tus experiencias te dan una oleada de poder!
actors.hero.hero.you_now_have=recogiste: %s.
actors.hero.hero.you_cant_have=no puedes llevar: %s.
actors.hero.hero.locked_chest=Este cofre está cerrado y no tienes una llave que encaje.
actors.hero.hero.locked_door=No tienes una llave que encaje.
actors.hero.hero.noticed_smth=Has notado algo.
actors.hero.hero.wait=...
actors.hero.hero.search=buscar
actors.hero.hero.search_distracted=Es difícil concentrarse, buscar es agotador.
actors.hero.hero.pain_resist=El dolor te ayuda a resistir la urgencia por dormir.
actors.hero.hero.revive=¡El ankh explota con energía revitalizante!

##classes
actors.hero.heroclass.warrior=guerrero
actors.hero.heroclass.warrior_desc_short=El Guerrero soporta daño adicional con el blindaje otorgado por su _sello roto._ El sello se puede mover entre armaduras y _transfiere una sola mejora._
actors.hero.heroclass.warrior_desc=El Guerrero comienza con un _sello roto único_, el cual genera blindaje sobre su salud. El sello se puede mover entre armaduras y puede _transferir una mejora_ con él.\n\nEl Guerrero también comienza con una _espada corta desgastada_, _tres piedras arrojadizas_, armadura de tela, un odre de agua y una bolsa de terciopelo.\n\nIdentifica automáticamente:\n_-_ Pergaminos de Identificación\n_-_ Pociones de Curación\n_-_ Pergaminos de Furia
actors.hero.heroclass.warrior_unlock=El Guerrero se desbloquea automáticamente.

actors.hero.heroclass.mage=mago
actors.hero.heroclass.mage_desc_short=El Mago es un experto arcano y lleva un _bastón mágico_ que es más fuerte que una varita. El bastón se puede _imbuir con cualquier varita_ que encuentre el Mago.
actors.hero.heroclass.mage_desc=El Mago comienza con un _bastón único_, el cual se recarga significativamente más rápido que una varita y tiene 1 carga más. El bastón _puede ser imbuido con cualquier varita_ que el Mago encuentre en la mazmorra.\n\nEl Mago también comienza con una _varita de proyectiles mágicos_ imbuida en su bastón, armadura de tela, un odre de agua y una bolsa de terciopelo.\n\nIdentifica automáticamente:\n_-_ Pergaminos de identificación\n_-_ Pociones de llama líquida\n_-_ Pergaminos de mejora
actors.hero.heroclass.mage_unlock=Para desbloquear el Mago, _usa un pergamino de mejora para fortalecer un ítem._

actors.hero.heroclass.rogue=pícaro
actors.hero.heroclass.rogue_desc_short=El Pícaro puede evadir enemigos y golpear desde la invisibilidad usando su _manto de sombras._ También _detecta secretos y trampas_ desde mayor distancia.
actors.hero.heroclass.rogue_desc=El Pícaro comienza con un _Manto de Sombras único_, el cual puede usar para volverse invisible a voluntad.\n\nEl Pícaro puede _detectar secretos y trampas_ desde una mayor distancia.\n\nEl Pícaro también comienza con una _daga_, _tres cuchillos arrojadizos_, armadura de tela, un odre de agua y una bolsa de terciopelo.\n\nIdentifica automáticamente:\n_-_ Pergaminos de identificación\n_-_ Pociones de invisibilidad\n_-_ Pergaminos de mapeo mágico
actors.hero.heroclass.rogue_unlock=Para desbloquear al Pícaro _realiza 10 ataques sorpresa en una partida._

actors.hero.heroclass.huntress=cazadora
actors.hero.heroclass.huntress_desc_short=La Cazadora es una maestra de las armas arrojadizas y tiene un _arco mágico_ con flechas infinitas. También se desplaza a través de la hierba alta _sin pisotearla._
actors.hero.heroclass.huntress_desc=La Cazadora empieza con un _arco espiritual único_, el cual puede disparar un numero infinito de flechas.\n\nLa Cazadora puede pasar a través de la hierba alta _sin pisotearla_.\n\nLa Cazadora comienza con unos _guantes tachonados_, armadura de tela, un odre de agua y una bolsa de terciopelo.\n\nIdentifica automáticamente:\n_-_ Pergaminos de identificación\n_-_ Pociones de visión mental\n_-_ Pergaminos de canción de cuna
actors.hero.heroclass.huntress_unlock=Para desbloquear a la Cazadora, _golpea enemigos con armas arrojadizas 10 veces en una partida._

actors.hero.heroclass.duelist=duelista
actors.hero.heroclass.duelist_desc_short=La Duelista es una maestra de armas que puede usar su arma para activar una _habilidad de arma especial._ Esta habilidad es _diferente para cada arma._
actors.hero.heroclass.duelist_desc=La Duelista comienza con un _estoque único_ con una habilidad especial que se recarga con el tiempo.\n\nCada arma en el juego tiene una _habilidad especial diferente_ que la Duelista puede usar.\n\nLa Duelista también empieza con _dos pinchos arrojadizos_, armadura de tela, un odre de agua y una bolsa de terciopelo.\n\nIdentifica automáticamente:\n_-_ Pergaminos de Identificación\n_-_ Pociones de Fuerza\n_-_ Pergaminos de Reflejo
actors.hero.heroclass.duelist_unlock=Para desbloquear a la Duelista _equipa un arma de tier 2 o superior sin penalización de fuerza._

actors.hero.herosubclass.berserker=frenético
actors.hero.herosubclass.berserker_short_desc=El _Frenético_ acumula furia cuando recibe daño. La furia aumenta su daño y puede activarse al 100% para obtener blindaje adicional.
actors.hero.herosubclass.berserker_desc=El Frenético acumula furia cuando recibe daño físico, ¡incluido el daño que bloquea su armadura! La furia se desvanece con el tiempo, pero lo hace más lentamente si tiene pocos PS.\n\nEl Frenético inflige hasta +50% de daño al 100% de furia. Al 100% de furia, este puede enfurecer, obteniendo 2-6 veces el blindaje máximo de su sello dependiendo de su salud faltante y mantendrá su furia al 100% siempre y cuando le quede blindaje. Sin embargo, el Frenético necesita tiempo para recuperarse después de enfurecer.
actors.hero.herosubclass.gladiator=gladiador
actors.hero.herosubclass.gladiator_short_desc=El _Gladiador_ gana puntos de combo cuando realiza ataques con éxito. Este puede gastar dichos puntos para usar habilidades únicas.
actors.hero.herosubclass.gladiator_desc=El Gladiador acumula un punto de combo cada vez que realiza un ataque exitoso con un arma cuerpo a cuerpo o arrojadiza. Si el Gladiador no realiza un ataque exitoso en 5 turnos, su combo se resetea.\n\nA medida que aumenta el combo desbloquea habilidades que puede usar a cambio de sus puntos de combo:\n2 Combo: empuja al enemigo, preserva el combo\n4 Combo: causa daño en base a la armadura\n6 Combo: desvía ataque, preserva el combo\n8 Combo: daña al objetivo y a enemigos cercanos\n10 Combo: ataca una vez por cada combo
actors.hero.herosubclass.battlemage=mago de batalla
actors.hero.herosubclass.battlemage_short_desc=El _Mago de Batalla_ conjura efectos adicionales cuando lucha cuerpo a cuerpo con su bastón. Estos efectos dependen de la varita con la que esté imbuido su bastón.
actors.hero.herosubclass.battlemage_desc=El Mago de Batalla obtiene un efecto adicional cada vez que ataca cuerpo a cuerpo con su bastón, como si este tuviera un encantamiento adicional. Estos efectos dependen de la varita con la que esté imbuido su bastón, cada varita tiene su propio efecto. Además de los efectos de la varita, el bastón del Mago de Batalla también obtendrá 0.5 cargas cuando golpee con él.
actors.hero.herosubclass.warlock=brujo
actors.hero.herosubclass.warlock_short_desc=El _Brujo_ tiene una probabilidad de marcar el alma de los enemigos con sus varitas. Este se curará cada vez que inflija daño físico a enemigos marcados.
actors.hero.herosubclass.warlock_desc=El Brujo tiene una probabilidad de marcar el alma de los personajes cuando usa varitas en ellos. La probabilidad de aplicar una marca de alma y su duración aumentan con el nivel de la varita.\n\nCuando el alma de un enemigo esta marcada, el Brujo se curará 2 PS por cada 5 puntos de daño que inflija sobre este, ¡pero solo con ataques cuerpo a cuerpo o armas arrojadizas, no con varitas!
actors.hero.herosubclass.assassin=asesino
actors.hero.herosubclass.assassin_short_desc=El _Asesino_ puede preparar un golpe mortal mientras este invisible. Cuanto más espere, más poderoso será el ataque.
actors.hero.herosubclass.assassin_desc=El Asesino prepara su próximo ataque cuando se vuelve invisible. Cuanto más se prepare, más poderoso será el ataque. La preparación se acumula hasta 9 turnos.\n\nDespués de prepararse, el Asesino inflige daño adicional en su próximo ataque, puede destellar hacia su objetivo e incluso matar instantáneamente a enemigos que sean lo suficientemente débiles.
actors.hero.herosubclass.freerunner=acróbata
actors.hero.herosubclass.freerunner_short_desc=El _Acróbata_ gana impulso mientras corre, el cual puede usar para entrar en carrera. Esto le otorga velocidad y evasión adicional por un corto tiempo.
actors.hero.herosubclass.freerunner_desc=A medida que el Acróbata se mueve, acumula cargas de impulso. Puede acumular hasta 10 cargas tras correr por 10 turnos, pero las pierde rápidamente si deja de moverse. El Acróbata puede usar sus cargas de impulso para entrar en carrera, obteniendo 2 turnos por cada carga.\n\nEstando en carrera, el Acróbata se mueve al doble de velocidad y obtiene evasión adicional en proporción a su nivel. Cuando el tiempo en carrera se acabe, deberá recuperarse antes de poder ganar impulso de nuevo.
actors.hero.herosubclass.sniper=francotiradora
actors.hero.herosubclass.sniper_short_desc=La _Francotiradora_ puede perforar la armadura con sus ataques a distancia. Después de golpear con un arma arrojadiza, puede continuar con un ataque especial de su arco.
actors.hero.herosubclass.sniper_desc=La Francotiradora es una maestra del combate a distancia, cuyos ataques a distancia perforan la armadura enemiga. Cuando ataca a un enemigo con un arma arrojadiza, coloca una marca de la francotiradora sobre ellos, lo que le permite continuar con un ataque especial de su arco. Este ataque especial varía según cómo se aumenta su arco.\n\nUn arco no aumentado disparará un tiro instantáneo que inflige daño reducido pero no toma ningún turno en dispararse. Un arco de velocidad disparará una ráfaga de tres flechas que infligen daño reducido, pueden activar encantamientos y toma 1 turno en dispararse. Un arco de daño disparará un disparo de francotirador que está garantizado a impactar, inflige daño adicional según la distancia y toma 2 turnos en dispararse.
actors.hero.herosubclass.warden=guardabosques
actors.hero.herosubclass.warden_short_desc=La _Guardabosques_ puede ver a través de la hierba alta y obtiene efectos adicionales cuando planta semillas y pisotea plantas.
actors.hero.herosubclass.warden_desc=La Guardabosques tiene una fuerte conexión con la naturaleza, lo que le otorga una variedad de efectos adicionales relacionados con la hierba y las plantas. Puede ver a través de la hierba alta y surcada como si fuera un espacio vacío.\n\nLa Guardabosques hace que brote hierba alrededor de cualquier semilla que arroje o plante, y obtiene efectos especiales al pisotear las plantas. Estos efectos especiales reemplazan los efectos normales de las plantas, lo que significa que ninguna planta es dañina para ella al pisotearla.
actors.hero.herosubclass.champion=Campeona
actors.hero.herosubclass.champion_short_desc=La _Campeona_ puede empuñar dos armas y obtiene cargas de arma. Su ataque normal usa su arma primaria pero puede intercambiar armas y usar cualquiera de sus habilidades.
actors.hero.herosubclass.champion_desc=La Campeona es una maestra de armas cuerpo a cuerpo que puede equipar un arma secundaria adicionalmente a su arma primaria. Sus ataques normales utilizan su arma primaria, esta puede cambiar de arma instantáneamente y utilizar la habilidad de cualquiera de las dos.\n\nAdemás obtiene 2 cargas de habilidad de arma máxima y +50% de velocidad de recarga de habilidad de arma.
actors.hero.herosubclass.monk=Monje
actors.hero.herosubclass.monk_short_desc=La _Monje_ acumula energía mientras lucha. Esta energía se puede gastar en una variedad de técnicas únicas.
actors.hero.herosubclass.monk_desc=La Monje es una maestra de la técnica física. A medida que derrota a los enemigos, obtiene energía que se puede usar en una variedad de técnicas defensivas y enfocadas en la utilidad. Esta energía no se desvanece con el tiempo, pero tiene un límite basado en el nivel de la Monje.\n\n1 Energía: rápidamente ataca con los puños\n2 Energía: se concentra para evadir el siguiente ataque\n3 Energía: corta carrera instantánea\n4 Energía: empuja a un enemigo de una patada\n5 Energía: medita para limpiar estados y recuperar cargas de varita y artefacto

##talents
actors.hero.talent$provokedangertracker.name=furia provocada
actors.hero.talent$provokedangertracker.desc=El Guerrero perdió su blindaje recientemente, su siguiente ataque causará daño adicional.\n\nTurnos restantes: %s.
actors.hero.talent$lingeringmagictracker.name=magia persistente
actors.hero.talent$lingeringmagictracker.desc=El Mago ha usado un bastón o varita recientemente, su siguiente ataque físico causará daño adicional.\n\nTurnos restantes: %s.
actors.hero.talent$followupstriketracker.name=golpe seguido
actors.hero.talent$followupstriketracker.desc=La Cazadora ha atacado recientemente a un enemigo con un arma arrojadiza, su próximo ataque cuerpo a cuerpo contra el mismo objetivo infligirá daño adicional.\n\nTurnos restantes: %s.
actors.hero.talent$patientstriketracker.name=golpe sereno
actors.hero.talent$patientstriketracker.desc=La Duelista acaba de esperar por un turno, su próximo ataque cuerpo a cuerpo infligirá daño adicional.
actors.hero.talent$improvisedprojectilecooldown.name=recarga de proyectil improvisado
actors.hero.talent$improvisedprojectilecooldown.desc=Has utilizado este talento recientemente y deberás esperar antes de volver a utilizarlo.\n\nTurnos restantes: %s.
actors.hero.talent$rejuvenatingstepscooldown.name=recarga de pasos rejuvenecedores
actors.hero.talent$rejuvenatingstepscooldown.desc=Has utilizado este talento recientemente y deberás esperar antes de volver a utilizarlo.\n\nTurnos restantes: %s.
actors.hero.talent$seershotcooldown.name=recarga de disparo vidente
actors.hero.talent$seershotcooldown.desc=Has utilizado este talento recientemente y deberás esperar antes de volver a utilizarlo.\n\nTurnos restantes: %s.
actors.hero.talent$aggressivebarriercooldown.name=recarga de barrera agresiva
actors.hero.talent$aggressivebarriercooldown.desc=Has utilizado este talento recientemente y deberás esperar antes de volver a utilizarlo.\n\nTurnos restantes: %s.
actors.hero.talent$liquidagilacctracker.name=agilidad líquida
actors.hero.talent$liquidagilacctracker.desc=El próximo ataque cuerpo a cuerpo normal de la Duelista obtendrá precisión adicional.\n\nTurnos restantes: %s.
actors.hero.talent$lethalhastecooldown.name=recarga de prisa letal
actors.hero.talent$lethalhastecooldown.desc=Has utilizado este talento recientemente y deberás esperar antes de volver a utilizarlo.\n\nTurnos restantes: %s.
actors.hero.talent$swiftequipcooldown.name=recarga de empuñe veloz
actors.hero.talent$swiftequipcooldown.desc=Has utilizado este talento recientemente y deberás esperar antes de volver a utilizarlo.\n\nTurnos restantes: %s.
actors.hero.talent$preciseassaulttracker.name=asalto preciso
actors.hero.talent$preciseassaulttracker.desc=El próximo ataque cuerpo a cuerpo normal de la Duelista obtendrá precisión adicional.\n\nTurnos restantes: %s.
actors.hero.talent$deadlyfollowuptracker.name=seguimiento mortal
actors.hero.talent$deadlyfollowuptracker.desc=La Duelista ha atacado recientemente a un enemigo con un arma arrojadiza, sus ataques cuerpo a cuerpo contra el mismo objetivo infligirán daño adicional.\n\nTurnos restantes: %s.
actors.hero.talent$combinedlethalityabilitytracker.executed=ejecutado

#warrior
actors.hero.talent.hearty_meal.title=comida saludable
actors.hero.talent.hearty_meal.desc=_+1:_ Comer comida cura al Guerrero por _3 PS_ cuando está por debajo del 30% de salud.\n\n_+2:_ Comer comida cura al Guerrero por _5 PS_ cuando está por debajo del 30% de salud.
actors.hero.talent.veterans_intuition.title=intuición de veterano
actors.hero.talent.veterans_intuition.desc=_+1:_ El Guerrero identifica armas _1.75 veces más rápido_ y armaduras _2.5 veces más rápido_.\n\n_+2:_ El Guerrero identifica armas _2.5 veces más rápido_ y armaduras _en cuanto las equipa_.
actors.hero.talent.provoked_anger.title=furia provocada
actors.hero.talent.provoked_anger.desc=_+1:_ Cuando se rompe el blindaje del Guerrero, su siguiente ataque físico causa _2 de daño adicional_.\n\n_+2:_ Cuando se rompe el blindaje del Guerrero, su siguiente ataque físico causa _3 de daño adicional_.
actors.hero.talent.iron_will.title=Voluntad de hierro
actors.hero.talent.iron_will.desc=_+1:_ El blindaje máximo proporcionado por el sello del Guerrero _aumenta en 1_.\n\n_+2:_ El blindaje máximo proporcionado por el sello del Guerrero _aumenta en 2_.
actors.hero.talent.iron_will.meta_desc=_Si este talento lo obtiene otro héroe_ le otorgará blindaje sin necesidad de tener el sello roto.

actors.hero.talent.iron_stomach.title=estómago de acero
actors.hero.talent.iron_stomach.desc=_+1:_ Comer le toma al Guerrero 1 turno y le otorga _75% de resistencia al daño_ mientras come.\n\n_+2:_ Comer le toma al Guerrero 1 turno y le otorga _100% de resistencia al daño_ mientras come.
actors.hero.talent.liquid_willpower.title=fuerza de voluntad líquida
actors.hero.talent.liquid_willpower.desc=_+1:_ El Guerrero recupera instantáneamente el _50% del blindaje_ de su sello roto cuando bebe o lanza una poción, infusión o elixir.\n\n_+2:_ El Guerrero recupera instantáneamente el _75% del blindaje_ de su sello roto cuando bebe o lanza una poción, infusión o elixir.\n\nEl efecto regenerador de blindaje es duplicado cuando se usa pociones de fuerza, experiencia o ítems creados mediante alquimia utilizando esas pociones.\n\nEn el caso de ítems de alquimia con mayores cantidades de producción (por ejemplo, la infusión acuática), este talento tiene una probabilidad de activarse en función a la cantidad que se produzca de dicho ítem.
actors.hero.talent.liquid_willpower.meta_desc=_Si este talento lo obtiene otro héroe_ otorgará en su lugar, blindaje equivalente al 5% de PS máximos en +1 o 7.5% de PS máximos en +2.
actors.hero.talent.runic_transference.title=Transferencia rúnica
actors.hero.talent.runic_transference.desc=_+1:_ El sello del Guerrero puede transferir _ glifos regulares_ de la misma manera que transfiere una mejora.\n\n_+2:_ El sello del Guerrero puede transferir _glifos regulares, poderosos y malditos_ de la misma manera que transfiere una mejora.\n\nEl sello solo puede transferir glifos que fueron aplicados a la armadura mientras esta tenga el sello fijado.
actors.hero.talent.runic_transference.meta_desc=_Si este talento lo obtiene otro héroe_, ayudará a que los glifos de tu armadura se resistan a ser eliminados por pergaminos de mejora. Los glifos comenzarán a perderse al mejorar desde el nivel 6 (en vez de 4) a +1, o el nivel 7 (en vez de 4) a +2. El nivel en el que se garantiza la pérdida de glifos permanece en +8.
actors.hero.talent.lethal_momentum.title=Impulso letal
actors.hero.talent.lethal_momentum.desc=_+1:_ Cuando el Guerrero mata a un enemigo con un arma física, tiene una _probabilidad del 67%_ de tomar 0 turnos.\n\n_+2:_ Cuando el Guerrero mata a un enemigo con un arma física, tiene una _probabilidad del 100%_ de tomar 0 turnos.
actors.hero.talent.improvised_projectiles.title=Proyectil improvisado
actors.hero.talent.improvised_projectiles.desc=_+1:_ El Guerrero puede cegar a un enemigo por _2 turnos_ lanzándole cualquier ítem que no sea un arma arrojadiza. Tiene un tiempo de recarga de 50 turnos.\n\n_+2:_ El guerrero puede cegar a un enemigo por _3 turnos_ lanzándoles cualquier ítem que no sea un arma arrojadiza. Tiene un tiempo de recarga de 50 turnos.

actors.hero.talent.hold_fast.title=firmeza
actors.hero.talent.hold_fast.desc=_+1:_ Cuando el Guerrero espera gana _1-2 de armadura_ hasta que se mueve.\n\n_+2:_ Cuando el Guerrero espera gana _2-4 de armadura_ hasta que se mueve.\n\n_+3:_ Cuando el Guerrero espera gana _3-6 de armadura_ hasta que se mueve.
actors.hero.talent.strongman.title=forzudo
actors.hero.talent.strongman.desc=_+1:_ La fuerza del Guerrero _aumenta un 8%_, redondeado hacia abajo.\n\n_+2:_ La fuerza del Guerrero _aumenta un 13%_, redondeado hacia abajo.\n\n_+3:_ La fuerza del Guerrero _aumenta un 18%_, redondeado hacia abajo.

actors.hero.talent.endless_rage.title=furia sin fin
actors.hero.talent.endless_rage.desc=_+1:_ El Frenético puede alcanzar un máximo de _116% de furia_.\n\n_+2:_ El Frenético puede alcanzar un máximo de _133% de furia_.\n\n_+3:_ El Frenético puede alcanzar un máximo de _150% de furia_.\n\nCada punto de furia por encima del 100% incrementa el blindaje al enfurecer en 1% y reduce el tiempo de recarga en 1%. Sin embargo, no incrementa el daño adicional por encima de +50%.
actors.hero.talent.deathless_fury.title=furia inmortal
actors.hero.talent.deathless_fury.desc=_+1:_ Enfurecer se activa automáticamente si el Frenético esta por morir y su furia esta por encima del 100%, pero tiene un tiempo de recarga de _3 niveles de héroe_ cuando esto sucede.\n\n_+2:_ Enfurecer se activa automáticamente si el Frenético esta por morir y su furia esta por encima del 100%, pero tiene un tiempo de recarga de _2 niveles de héroe_ cuando esto sucede.\n\n_+3:_ Enfurecer se activa automáticamente si el Frenético esta por morir y su furia esta por encima del 100%, pero tiene un tiempo de recarga de _1 nivel de héroe_ cuando esto sucede.\n\nTen en cuenta que el Frenético aún morirá si tiene 0 PS cuando este termina de enfurecer.
actors.hero.talent.enraged_catalyst.title=catalizador furioso
actors.hero.talent.enraged_catalyst.desc=_+1:_ Encantamientos y maldiciones en el arma del Frenético se activan con más frecuencia a mayor furia tenga, hasta un máximo de _15% más frecuente_ al 100% de furia.\n\n_+2:_ Encantamientos y maldiciones en el arma del Frenético se activan con más frecuencia a mayor furia tenga, hasta un máximo de _30% más frecuente_ al 100% de furia.\n\n_+3:_ Encantamientos y maldiciones en el arma del Frenético se activan con más frecuencia a mayor furia tenga, hasta un máximo de _45% más frecuente_ al 100% de furia.

actors.hero.talent.cleave.title=adherirse
actors.hero.talent.cleave.desc=_+1:_ Cuando el Gladiador mata a un enemigo, en su próximo golpe tendrá _15 turnos_ antes de que el contador de combo se restablezca.\n\n_+2:_ Cuando el Gladiador mata a un enemigo, en su próximo golpe tendrá _30 turnos_ antes de que el contador de combo se restablezca.\n\n_+3:_ Cuando el Gladiador mata a un enemigo, en su próximo golpe tendrá _45 turnos_ antes de que el contador de combo se restablezca.
actors.hero.talent.lethal_defense.title=defensa letal
actors.hero.talent.lethal_defense.desc=_+1:_ Cuando el Gladiador mata a un enemigo con un combo, _recupera un 33%_ de blindaje del sello del Guerrero.\n\n_+2:_ Cuando el Gladiador mata a un enemigo con un combo, _recupera un 67%_ de blindaje del sello del Guerrero.\n\n_+3:_ Cuando el Gladiador mata a un enemigo con un combo, _recupera el 100%_ de blindaje del sello del Guerrero.
actors.hero.talent.enhanced_combo.title=combo mejorado
actors.hero.talent.enhanced_combo.desc=_+1:_ Cuando el combo del Gladiador es de 7 o más, el rango de empuje de Derribar aumenta en 3, inflige vértigo y puede tirar enemigos en fosas.\n\n_+2:_ Además de los beneficios de +1, cuando el combo del Gladiador es de 9 o más, Desviar funciona en múltiples ataques.\n\n_+3:_ Además de los beneficios de +1 y +2, el Gladiador puede dar un salto de combo/3 casillas al usar Embate, Aplastar o Furia.

actors.hero.talent.body_slam.title=golpe de cuerpo
actors.hero.talent.body_slam.desc=_+1:_ Cuando el Guerrero aterriza después de saltar, todos los enemigos adyacentes reciben daño equivalente a _1-4 más 25%_ de su poder de bloqueo.\n\n_+2:_ Cuando el Guerrero aterriza después de saltar, todos los enemigos adyacentes reciben daño equivalente a _2-8 más 50%_ de su poder de bloqueo.\n\n_+3:_ Cuando el Guerrero aterriza después de saltar, todos los enemigos adyacentes reciben daño equivalente a _3-12 más 75%_ de su poder de bloqueo.\n\n_+4:_ Cuando el Guerrero aterriza después de saltar, todos los enemigos adyacentes reciben daño equivalente a _4-16 más 100%_ de su poder de bloqueo.
actors.hero.talent.impact_wave.title=onda de impacto
actors.hero.talent.impact_wave.desc=_+1:_ Cuando el Guerrero aterriza después de saltar, todos los enemigos adyacentes son empujados _2 casillas_ hacia atrás y tienen una _probabilidad del 25%_ de quedar vulnerables por 5 turnos.\n\n_+2:_ Cuando el Guerrero aterriza después de saltar, todos los enemigos adyacentes son empujados _3 casillas_ hacia atrás y tienen una _probabilidad del 50%_ de quedar vulnerables por 5 turnos.\n\n_+3:_ Cuando el Guerrero aterriza después de saltar, todos los enemigos adyacentes son empujados _4 casillas_ hacia atrás y tienen una _probabilidad del 75%_ de quedar vulnerables por 5 turnos.\n\n_+4:_ Cuando el Guerrero aterriza después de saltar, todos los enemigos adyacentes son empujados _5 casillas_ hacia atrás y tienen una _probabilidad del 100%_ de quedar vulnerables por 5 turnos.
actors.hero.talent.double_jump.title=doble salto
actors.hero.talent.double_jump.desc=_+1:_ Si el Guerrero realiza un segundo salto en 3 turnos, ese salto tiene un coste _reducido en un 16%_.\n\n_+2:_ Si el Guerrero realiza un segundo salto en 3 turnos, ese salto tiene un coste _reducido en un 30%_.\n\n_+3:_ Si el Guerrero realiza un segundo salto en 3 turnos, ese salto tiene un coste _reducido en un 40%_.\n\n_+4:_ Si el Guerrero realiza un segundo salto en 3 turnos, ese salto tiene un coste _reducido en un 50%_.

actors.hero.talent.expanding_wave.title=onda expansiva
actors.hero.talent.expanding_wave.desc=_+1:_ El alcance de la onda de choque incrementa de 5 a _6 casillas_ y su ancho aumenta de 60 a _75 grados_.\n\n_+2:_ El alcance de la onda de choque incrementa de 5 a _7 casillas_ y su ancho aumenta de 60 a _90 grados_.\n\n_+3:_ El alcance de la onda de choque incrementa de 5 a _8 casillas_ y su ancho aumenta de 60 a _105 grados_.\n\n_+4:_ El alcance de la onda de choque incrementa de 5 a _9 casillas_ y su ancho aumenta de 60 a _120 grados_.
actors.hero.talent.striking_wave.title=onda destructiva
actors.hero.talent.striking_wave.desc=_+1:_ Onda de choque tiene un _30% de probabilidad_ de activar efectos al-impacto como encantamientos y combo.\n\n_+2:_ Onda de choque tiene un _60% de probabilidad_ de activar efectos al-impacto como encantamientos y combo.\n\n_+3:_ Onda de choque tiene un _90% de probabilidad_ de activar efectos al-impacto como encantamientos y combo.\n\n_+4:_ Onda de choque tiene un _100% de probabilidad_ de activar efectos al-impacto como encantamientos y combo y otorga a encantamientos un _20% más de poder_.
actors.hero.talent.shock_force.title=fuerza de choque
actors.hero.talent.shock_force.desc=_+1:_ Onda de choque inflige un _20% más de daño_ y tiene un _25% de probabilidad_ de aturdir en lugar de lisiar.\n\n_+2:_ Onda de choque inflige un _40% más de daño_ y tiene un _50% de probabilidad_ de aturdir en lugar de lisiar.\n\n_+3:_ Onda de choque inflige un _60% más de daño_ y tiene un _75% de probabilidad_ de aturdir en lugar de lisiar.\n\n_+4:_ Onda de choque inflige un _80% más de daño_ y tiene un _100% de probabilidad_ de aturdir en lugar de lisiar.

actors.hero.talent.sustained_retribution.title=retribución sostenida
actors.hero.talent.sustained_retribution.desc=_+1:_ El Guerrero inflige _115% de daño adicional_ distribuido en 2 golpes, en lugar de 100% en 1 solo golpe.\n\n_+2:_ El Guerrero inflige _130% de daño adicional_ distribuido en 3 golpes, en lugar de 100% en 1 solo golpe.\n\n_+3:_ El Guerrero inflige _145% de daño adicional_ distribuido en 4 golpes, en lugar de 100% en 1 solo golpe.\n\n_+4:_ El Guerrero inflige _160% de daño adicional_ distribuido en 5 golpes, en lugar de 100% en 1 solo golpe.
actors.hero.talent.shrug_it_off.title=indiferencia
actors.hero.talent.shrug_it_off.desc=_+1:_ La reducción de daño del Guerrero al aguantar _incrementa hasta 60%_, desde el 50%.\n\n_+2:_ La reducción de daño del Guerrero al aguantar _incrementa hasta 68%_, desde el 50%.\n\n_+3:_ La reducción de daño del Guerrero al aguantar _incrementa hasta 74%_, desde el 50%.\n\n_+4:_ La reducción de daño del Guerrero al aguantar _incrementa hasta 80%_, desde el 50%.
actors.hero.talent.even_the_odds.title=equilibrar la balanza
actors.hero.talent.even_the_odds.desc=_+1:_ El Guerrero inflige un _5% de daño adicional_ por cada enemigo a 2 casillas de él cuando termina de aguantar.\n\n_+2:_ El Guerrero inflige un _10% de daño adicional_ por cada enemigo a 2 casillas de él cuando termina de aguantar.\n\n_+3:_ El Guerrero inflige un _15% de daño adicional_ por cada enemigo a 2 casillas de él cuando termina de aguantar.\n\n_+4:_ El Guerrero inflige un _20% de daño adicional_ por cada enemigo a 2 casillas de él cuando termina de aguantar.

#mage
actors.hero.talent.empowering_meal.title=comida potenciadora
actors.hero.talent.empowering_meal.desc=_+1:_ Comer le otorga al Mago _2 de daño adicional_ en las próximas 3 veces que cause daño con una varita.\n\n_+2:_ Comer le otorga al Mago _3 de daño adicional_ en las próximas 3 veces que cause daño con una varita.
actors.hero.talent.scholars_intuition.title=Intuición del erudito
actors.hero.talent.scholars_intuition.desc=_+1:_ El Mago identifica las varitas _el triple de rápido_.\n\n_+2:_ El Mago identifica las varitas _cuando las usa_.
actors.hero.talent.lingering_magic.title=magia persistente
actors.hero.talent.lingering_magic.desc=_+1:_ Cuando el Mago dispara con una varita o bastón, su siguiente ataque físico causa _1-2 de daño adicional_.\n\n_+2:_ Cuando el Mago dispara con una varita o bastón, su siguiente ataque físico causa _2 de daño adicional_.
actors.hero.talent.backup_barrier.title=barrera de respaldo
actors.hero.talent.backup_barrier.desc=_+1:_ El Mago obtiene _3 de blindaje_ cuando gasta la última carga de su bastón.\n\n_+2:_ El Mago obtiene _5 de blindaje_ cuando gasta la última carga de su bastón.
actors.hero.talent.backup_barrier.meta_desc=_Si este talento lo obtiene otro héroe_ se activará en su lugar, mediante su varita de mayor nivel.

actors.hero.talent.energizing_meal.title=comida energizante
actors.hero.talent.energizing_meal.desc=_+1:_ Comer le toma al Mago 1 turno y le otorga _5 turnos de recarga de varitas_.\n\n_+2:_ Comer le toma al Mago 1 turno y le otorga _8 turnos de recarga de varitas_.
actors.hero.talent.inscribed_power.title=poder inscrito
actors.hero.talent.inscribed_power.desc=_+1:_ Cuando el Mago lee un pergamino o usa un hechizo, sus _siguientes 2 disparos de varita_ ganan +2 niveles.\n\n_+2:_ Cuando el Mago lee un pergamino o usa un hechizo, sus _siguientes 3 disparos de varita_ ganan +2 niveles.\n\nEl número de disparos de varita potenciados se duplica cuando se usa un pergamino de mejora, transmutación, o ítems creados mediante alquimia utilizando esos pergaminos.\n\nEn el caso de ítems de alquimia con mayores cantidades de producción (por ejemplo, la mayoría de hechizos), este talento tiene una probabilidad de activarse en función a la cantidad que se produzca de dicho ítem.
actors.hero.talent.wand_preservation.title=Varita preservada
actors.hero.talent.wand_preservation.desc=_+1:_ Cuando el Mago imbuye una nueva varita en su bastón, la antigua varita es devuelta con nivel +0, _pero esto sólo se puede hacer una vez._\n\n_+2:_ Cuando el Mago imbuye una nueva varita en su bastón, la antigua varita es devuelta con nivel +0, _esto se puede hacer una vez por cada nivel de héroe._
actors.hero.talent.wand_preservation.meta_desc=_Si este talento lo obtiene otro héroe_ incrementará la cantidad de resina arcana recibida al colocar una varita en un caldero de alquimia en 1 en +1 o en 2 en +2.
actors.hero.talent.arcane_vision.title=visión arcana
actors.hero.talent.arcane_vision.desc=_+1:_ Cuando el Mago ataca con una varita a un enemigo, obtiene visión mental sobre este por _10 turnos_.\n\n_+2:_ Cuando el Mago ataca con una varita a un enemigo, obtiene visión mental sobre este por _15 turnos_.
actors.hero.talent.shield_battery.title=Carga defensiva
actors.hero.talent.shield_battery.desc=_+1:_ El Mago puede disparar su varita sobre sí mismo y convertir todas sus cargas en blindaje con un valor del _4% de sus PS máximos por carga_.\n\n_+2:_ El Mago puede disparar su varita sobre sí mismo y convertir todas sus cargas en blindaje con un valor del _6% de sus PS máximos por carga_.

actors.hero.talent.desperate_power.title=poder desesperado
actors.hero.talent.desperate_power.desc=_+1:_ Las varitas y el bastón del Mago ganan _+1 nivel_ en su último disparo cuando les queda una sola carga.\n\n_+2:_ Las varitas y el bastón del Mago ganan _+2 niveles_ en su último disparo cuando les queda una sola carga.\n\n_+3:_ Las varitas y el bastón del Mago ganan _+3 niveles_ en su último disparo cuando les queda una sola carga.
actors.hero.talent.ally_warp.title=reemplazo
actors.hero.talent.ally_warp.desc=_+1:_ El Mago puede seleccionar a un aliado para intercambiar de lugar con él instantáneamente en un rango de _2 casillas_.\n\n_+2:_ El Mago puede seleccionar a un aliado para intercambiar de lugar con él instantáneamente en un rango de _4 casillas_.\n\n_+3:_ El Mago puede seleccionar a un aliado para intercambiar de lugar con él instantáneamente en un rango de _6 casillas_.\n\nEl Mago no puede intercambiar de lugar con aliados inmóviles.

actors.hero.talent.empowered_strike.title=golpe potenciado
actors.hero.talent.empowered_strike.desc=_+1:_ El primer golpe cuerpo a cuerpo del Mago de batalla con su bastón después de disparar con él inflige _+16% de daño_ y el efecto del bastón obtiene _+50% de poder_.\n\n_+2:_ El primer golpe cuerpo a cuerpo del Mago de batalla con su bastón después de disparar con él inflige _+33% de daño_ y el efecto del bastón obtiene _+100% de poder_.\n\n_+3:_ El primer golpe cuerpo a cuerpo del Mago de batalla con su bastón después de disparar con él inflige _+50% de daño_ y el efecto del bastón obtiene _+150% de poder_.
actors.hero.talent.mystical_charge.title=carga mística
actors.hero.talent.mystical_charge.desc=_+1:_ Golpear con su bastón le otorga al Mago de batalla _0.5 turnos_ de recarga de artefactos.\n\n_+2_ Golpear con su bastón le otorga al Mago de batalla _1 turno_ de recarga de artefactos.\n\n_+3:_ Golpear con su bastón le otorga al Mago de batalla _1.5 turnos_ de recarga de artefactos.
actors.hero.talent.excess_charge.title=exceso de carga
actors.hero.talent.excess_charge.desc=_+1:_ Cuando el bastón del Mago de Batalla está completamente cargado, su siguiente disparo le otorgará _0.67 de blindaje_ por cada nivel del bastón.\n\n_+2:_ Cuando el bastón del Mago de Batalla está completamente cargado, su siguiente disparo le otorgará _1.33 de blindaje_ por cada nivel del bastón.\n\n_+3:_ Cuando el bastón del Mago de Batalla está completamente cargado, su siguiente disparo le otorgará _2 de blindaje_ por cada nivel del bastón.

actors.hero.talent.soul_siphon.title=sifón de almas
actors.hero.talent.soul_siphon.desc=_+1:_ Daño físico infligido por otros personajes activarán el alma marcada del Brujo con un _13% de efectividad_.\n\n_+2:_ Daño físico infligido por otros personajes activarán el alma marcada del Brujo con un _27% de efectividad_.\n\n_+3:_ Daño físico infligido por otros personajes activarán el alma marcada del Brujo con un _40% de efectividad_.
actors.hero.talent.soul_eater.title=devorador de almas
actors.hero.talent.soul_eater.desc=_+1:_ Alma marcada otorga _0.33 turnos_ de saciedad por cada daño físico infligido. Enemigos con el alma marcada tienen un _10% de probabilidad_ de activar efectos al-comer cuando mueren.\n\n_+2:_ Alma marcada otorga _0.67 turnos_ de saciedad por cada daño físico infligido. Enemigos con el alma marcada tienen un _20% de probabilidad_ de activar efectos al-comer cuando mueren.\n\n_+3:_ Alma marcada otorga _1 turno_ de saciedad por cada daño físico infligido. Enemigos con el alma marcada tienen un _30% de probabilidad_ de activar efectos al-comer cuando mueren.
actors.hero.talent.necromancers_minions.title=esbirros del nigromante
actors.hero.talent.necromancers_minions.desc=_+1:_ Cuando un enemigo con el alma marcada muere, el Brujo tiene un _13% de probabilidad_ de revivirlo como un espectro corrupto.\n\n_+2:_ Cuando un enemigo con el alma marcada muere, el Brujo tiene un _27% de probabilidad_ de revivirlo como un espectro corrupto.\n\n_+3:_ Cuando un enemigo con el alma marcada muere, el Brujo tiene un _40% de probabilidad_ de revivirlo como un espectro corrupto.

actors.hero.talent.blast_radius.title=radio de explosión
actors.hero.talent.blast_radius.desc=_+1:_ El radio de explosión elemental incrementa de 4 a _5 casillas_.\n\n_+2:_ El radio de explosión elemental incrementa de 4 a _6 casillas_.\n\n_+3:_ El radio de explosión elemental incrementa de 4 a _7 casillas_.\n\n_+4:_ El radio de explosión elemental incrementa de 4 a _8 casillas_.
actors.hero.talent.elemental_power.title=potencia elemental
actors.hero.talent.elemental_power.desc=_+1:_ La potencia de explosión elemental incrementa un _25%_.\n\n_+2:_ La potencia de explosión elemental incrementa un _50%_.\n\n_+3:_ La potencia de explosión elemental incrementa un _75%_.\n\n_+4:_ La potencia de explosión elemental incrementa un _100%_.
actors.hero.talent.reactive_barrier.title=reactivación de barrera
actors.hero.talent.reactive_barrier.desc=_+1:_ El Mago gana _2.5 de blindaje_ por cada personaje afectado por explosión elemental hasta un máximo de 5 personajes.\n\n_+2:_ El Mago gana _5 de blindaje_ por cada personaje afectado por explosión elemental hasta un máximo de 6 personajes.\n\n_+3:_ El Mago gana _7.5 de blindaje_ por cada personaje afectado por explosión elemental hasta un máximo de 7 personajes.\n\n_+4:_ El Mago gana _10 de blindaje_ por cada personaje afectado por explosión elemental hasta un máximo de 8 personajes.

actors.hero.talent.wild_power.title=poder salvaje
actors.hero.talent.wild_power.desc=_+1:_ Al usar magia salvaje, las varitas serán potenciadas en _2 o 3, hasta un máximo de +4_.\n\n_+2:_ Al usar magia salvaje, las varitas serán potenciadas en _3, hasta un máximo de +5_.\n\n_+3:_ Al usar magia salvaje, las varitas serán potenciadas en _3 o 4, hasta un máximo de +6_.\n\n_+4:_ Al usar magia salvaje, las varitas serán potenciadas en _4, hasta un máximo de +7_.
actors.hero.talent.fire_everything.title=dispara todo
actors.hero.talent.fire_everything.desc=_+1:_ Magia salvaje ahora dispara _5 veces_ en vez de 4 y cada varita tiene un _25% de probabilidad_ de ser usada 3 veces.\n\n_+2:_ Magia salvaje ahora dispara _6 veces_ en vez de 4 y cada varita tiene un _50% de probabilidad_ de ser usada 3 veces.\n\n_+3:_ Magia salvaje ahora dispara _7 veces_ en vez de 4 y cada varita tiene un _75% de probabilidad_ de ser usada 3 veces.\n\n_+4:_ Magia salvaje ahora dispara _8 veces_ en vez de 4 y cada varita tiene un _100% de probabilidad_ de ser usada 3 veces.
actors.hero.talent.conserved_magic.title=magia conservada
actors.hero.talent.conserved_magic.desc=_+1:_ Cada disparo de magia salvaje ahora usa _0.33 cargas_ en vez de 0.5 y magia salvaje tiene una _probabilidad del 25%_ de no tomar ningún turno.\n\n_+2:_ Cada disparo de magia salvaje ahora usa _0.225 cargas_ en vez de 0.5 y magia salvaje tiene una _probabilidad del 50%_ de no tomar ningún turno.\n\n_+3:_ Cada disparo de magia salvaje ahora usa _0.15 cargas_ en vez de 0.5 y magia salvaje tiene una _probabilidad del 75%_ de no tomar ningún turno.\n\n_+4:_ Cada disparo de magia salvaje ahora usa _0.1 cargas_ en vez de 0.5 y magia salvaje tiene una _probabilidad del 100%_ de no tomar ningún turno.

actors.hero.talent.telefrag.title=Telefragmentación
actors.hero.talent.telefrag.desc=_+1:_ Si el Mago se teletransporta sobre un personaje, le inflige _10-15 de daño_ pero recibe _5 de daño_.\n\n_+2:_ Si el Mago se teletransporta sobre un personaje, le inflige _20-30 de daño_ pero recibe _10 de daño_.\n\n_+3:_ Si el Mago se teletransporta sobre un personaje, le inflige _30-45 de daño_ pero recibe _15 de daño_.\n\n_+4:_ Si el Mago se teletransporta sobre un personaje, le inflige _40-60 de daño_ pero recibe _20 de daño_.\n\nEl héroe no puede morir a causa de este talento, el daño recibido puede reducirse mediante efectos de resistencia mágica.
actors.hero.talent.remote_beacon.title=Baliza remota
actors.hero.talent.remote_beacon.desc=_+1:_ El Mago puede colocar una baliza en cualquier ubicación hasta _4 casillas_ de distancia.\n\n_+2:_ El Mago puede colocar una baliza en cualquier ubicación hasta _8 casillas_ de distancia.\n\n_+3:_ El Mago puede colocar una baliza en cualquier ubicación hasta _12 casillas_ de distancia.\n\n_+4:_ El Mago puede colocar una baliza en cualquier ubicación hasta _16 casillas_ de distancia.\n\nEl Mago no puede colocar balizas en lugares inaccesibles.
actors.hero.talent.longrange_warp.title=Viaje de larga distancia
actors.hero.talent.longrange_warp.desc=_+1:_ El Mago ahora puede teletransportarse entre niveles a un coste de _150% de carga_.\n\n_+2:_ El Mago ahora puede teletransportarse entre niveles a un coste de _117% de carga_.\n\n_+3:_ El Mago ahora puede teletransportarse entre niveles a un coste de _83% de carga_.\n\n_+4:_ El Mago ahora puede teletransportarse entre niveles a un coste de _50% de carga_.\n\nEl Mago no puede abandonar niveles cerrados usando este talento.

#rogue
actors.hero.talent.cached_rations.title=raciones de reserva
actors.hero.talent.cached_rations.desc=_+1:_ El Pícaro puede encontrar _2 raciones de suministro_ en cofres mientras explora los siguientes niveles de la mazmorra.\n\n_+2:_ El Pícaro puede encontrar _3 raciones de suministro_ en cofres mientras explora los siguientes niveles de la mazmorra.\n\nLas raciones de suministro se comen rápidamente, restablecen una cantidad de saciedad moderada, curan 5 PS y recuperan 1 carga del manto de sombras.
actors.hero.talent.thiefs_intuition.title=intuición de ladrón
actors.hero.talent.thiefs_intuition.desc=_+1:_ El pícaro identifica anillos _el doble de rápido_ e identifica el tipo de anillo _cuando lo equipa_.\n\n_+2:_ El pícaro identifica anillos _cuando los equipa_ e identifica el tipo de anillo _cuando lo recoge_.
actors.hero.talent.sucker_punch.title=Golpe sorpresa
actors.hero.talent.sucker_punch.desc=_+1:_ El Pícaro inflige _1-2 de daño adicional_ la primera vez que ataca por sorpresa a un enemigo.\n\n_+2:_ El Pícaro inflige _2 de daño adicional_ la primera vez que ataca por sorpresa a un enemigo.
actors.hero.talent.protective_shadows.title=sombras protectoras
actors.hero.talent.protective_shadows.desc=_+1:_ El Pícaro gana uno de blindaje _cada dos turnos_ que esté invisible, _hasta un máximo de 3_.\n\n_+2:_ El Pícaro gana uno de blindaje _cada turno_ que esté invisible, _hasta un máximo de 5_.

actors.hero.talent.mystical_meal.title=comida mística
actors.hero.talent.mystical_meal.desc=_+1:_ Comer le toma al Pícaro 1 turno (las raciones de suministro son comidas instantáneamente) y le otorga _3 turnos de recarga de artefactos_.\n\n_+2:_ Comer le toma al Pícaro 1 turno (las raciones de suministro son comidas instantáneamente) y le otorga _5 turnos de recarga de artefactos_.\n\nEste talento no puede usarse para que el cuerno de la abundancia se recargue a sí mismo.
actors.hero.talent.inscribed_stealth.title=sigilo inscrito
actors.hero.talent.inscribed_stealth.desc=_+1:_ El Pícaro gana _3 turnos_ de invisibilidad después de leer un pergamino o usar un hechizo.\n\n_+2:_ El Pícaro gana _5 turnos_ de invisibilidad después de leer un pergamino o usar un hechizo.\n\nLa duración de la invisibilidad es duplicada cuando se usa un pergamino de mejora, transmutación o ítems creados mediante alquimia utilizando esos pergaminos.\n\nEn el caso de ítems de alquimia con mayores cantidades de producción (por ejemplo, la mayoría de hechizos), este talento tiene una probabilidad de activarse en función a la cantidad que se produzca de dicho ítem.
actors.hero.talent.wide_search.title=Búsqueda ampliada
actors.hero.talent.wide_search.desc=_+1:_ El radio de búsqueda del Pícaro incrementa de un cuadrado de 5x5 a un _circulo de 7x7_.\n\n_+2:_ El radio de búsqueda del Pícaro incrementa de un cuadrado de 5x5 a un _cuadrado de 7x7_.
actors.hero.talent.wide_search.meta_desc=_Si este talento lo obtiene otro héroe_ incrementará su radio de búsqueda de un cuadrado de 3x3 a un círculo de 5x5 en +1 o a un cuadrado de 5x5 en +2.
actors.hero.talent.silent_steps.title=Pasos silenciosos
actors.hero.talent.silent_steps.desc=_+1:_ El Pícaro no despertará a los enemigos mientras esté a_ 3 o más casillas de distancia de ellos_.\n\n_+2:_ El Pícaro no despertará a los enemigos mientras _no esté adyacente a ellos_.
actors.hero.talent.rogues_foresight.title=Previsión del Pícaro
actors.hero.talent.rogues_foresight.desc=_+1:_ Cuando el Pícaro está en un nivel con una habitación secreta, tiene un _75% de probabilidades de notar_ que el nivel contiene un secreto.\n\n_+2:_ Cuando el Pícaro está en un nivel con una habitación secreta, tiene un _100% de probabilidades de notar_ que el nivel contiene un secreto.

actors.hero.talent.light_cloak.title=manto ligero
actors.hero.talent.light_cloak.desc=_+1:_ El Pícaro puede usar su manto de sombras cuando no esté equipado, pero se recargará al _25% de velocidad_. \n\n_+2:_ El Pícaro puede usar su manto de sombras cuando no esté equipado, pero se recargará al _50% de velocidad_. \n\n_+3:_ El Pícaro puede usar su manto de sombras cuando no esté equipado, pero se recargará al _75% de velocidad_.
actors.hero.talent.light_cloak.meta_desc=_Si este talento lo obtiene otro héroe_ incrementará la velocidad de recarga de todos los artefactos en 7/13/20% en +1/+2/+3.
actors.hero.talent.enhanced_rings.title=anillos mejorados
actors.hero.talent.enhanced_rings.desc=_+1:_ Cuando el Pícaro usa un artefacto, sus anillos ganan +1 mejora por _3 turnos_.\n\n_+2:_ Cuando el Pícaro usa un artefacto, sus anillos ganan +1 mejora por _6 turnos_.\n\n_+3:_ Cuando el Pícaro usa un artefacto, sus anillos ganan +1 mejora por _9 turnos_.

actors.hero.talent.enhanced_lethality.title=letalidad mejorada
actors.hero.talent.enhanced_lethality.desc=_+1:_ El Asesino puede asesinar a los enemigos que queden por debajo del _4/13/27/67% de salud_ por nivel de preparación, en lugar de 3/10/20/50%.\n\n_+2:_ El Asesino puede asesinar a los enemigos que queden por debajo del _5/17/33/83% de salud_ por nivel de preparación, en lugar de 3/10/20/50%.\n\n_+3:_ El Asesino puede asesinar a los enemigos que queden por debajo del _6/20/40/100% de salud_ por nivel de preparación, en lugar de 3/10/20/50%.
actors.hero.talent.assassins_reach.title=alcance del Asesino
actors.hero.talent.assassins_reach.desc=_+1:_ El rango de destello del Asesino por nivel de preparación incrementa de 1/2/3/4 casillas a _1/3/4/6 casillas_.\n\n_+2:_ El rango de destello del Asesino por nivel de preparación incrementa de 1/2/3/4 casillas a _2/4/6/8 casillas_.\n\n_+3:_ El rango de destello del Asesino por nivel de preparación incrementa de 1/2/3/4 casillas a _2/5/7/10 casillas_.\n\nEste destello puede atravesar peligros y enemigos, pero no terrenos sólidos como paredes.
actors.hero.talent.bounty_hunter.title=cazarrecompensas
actors.hero.talent.bounty_hunter.desc=_+1:_ Cuando el Asesino mata a un enemigo con un ataque preparado las probabilidades de que dejen un ítem aumentan en _2/4/8/16%_ por nivel de preparación.\n\n_+2:_ Cuando el Asesino mata a un enemigo con un ataque preparado las probabilidades de que dejen un ítem aumentan en _4/8/16/32%_ por nivel de preparación.\n\n_+3:_ Cuando el Asesino mata a un enemigo con un ataque preparado las probabilidades de que dejen un ítem aumentan en _6/12/24/48%_ por nivel de preparación.

actors.hero.talent.evasive_armor.title=armadura evasiva
actors.hero.talent.evasive_armor.desc=_+1:_ Mientras esté en carrera, el Acróbata gana _+1 de evasión_ adicional por cada punto de fuerza que exceda al requerido por su armadura.\n\n_+2:_ Mientras esté en carrera, el Acróbata gana _+2 de evasión_ adicional por cada punto de fuerza que exceda al requerido por su armadura.\n\n_+3:_ Mientras esté en carrera, el Acróbata gana _+3 de evasión_ adicional por cada punto de fuerza que exceda al requerido por su armadura.
actors.hero.talent.projectile_momentum.title=impulso de proyectil
actors.hero.talent.projectile_momentum.desc=_+1:_ Mientras esté en carrera, el Acróbata gana _+20% de precisión y +15% de daño_ con armas arrojadizas.\n\n_+2:_ Mientras esté en carrera, el Acróbata gana _+40% de precisión y +30% de daño_ con armas arrojadizas.\n\n_+3:_ Mientras esté en carrera, el Acróbata gana _+60% de precisión y +45% de daño_ con armas arrojadizas.
actors.hero.talent.speedy_stealth.title=sigilo veloz
actors.hero.talent.speedy_stealth.desc=_+1:_ El Acróbata gana 2 cargas de impulso por cada turno que esté invisible.\n\n_+2:_ Además de los beneficios de +1, estar en carrera no disminuye mientras el Acróbata esté invisible.\n\n_+3:_ Además de los beneficios de +1 y +2, el Acróbata se mueve el doble de rápido mientras esté invisible, independientemente de si está en carrera o no.

actors.hero.talent.hasty_retreat.title=retirada veloz
actors.hero.talent.hasty_retreat.desc=_+1:_ Tras destellar, el Pícaro gana _1 turno_ de velocidad e invisibilidad.\n\n_+2:_ Tras destellar, el Pícaro gana _2 turnos_ de velocidad e invisibilidad.\n\n_+3:_ Tras destellar, el Pícaro gana _3 turnos_ de velocidad e invisibilidad.\n\n_+4:_ Tras destellar, el Pícaro gana _4 turnos_ de velocidad e invisibilidad.
actors.hero.talent.body_replacement.title=sustitución de cuerpo
actors.hero.talent.body_replacement.desc=_+1:_ Tras destellar, el Pícaro deja un señuelo de madera que tiene _20 de salud y 1-3 de armadura_.\n\n_+2:_ Tras destellar, el Pícaro deja un señuelo de madera que tiene _40 de salud y 2-6 de armadura_.\n\n_+3:_ Tras destellar, el Pícaro deja un señuelo de madera que tiene _60 de salud y 3-9 de armadura_.\n\n_+4:_ Tras destellar, el Pícaro deja un señuelo de madera que tiene _80 de salud y 4-12 de armadura_.\n\nSolo puede haber un señuelo activo a la vez.
actors.hero.talent.shadow_step.title=paso sombrío
actors.hero.talent.shadow_step.desc=_+1:_ Si el Pícaro usa bomba de humo estando invisible, esta ocurre instantáneamente y tiene un coste _reducido en un 16%_, pero no ciega a enemigos ni activa otros talentos.\n\n_+2:_ Si el Pícaro usa bomba de humo estando invisible, esta ocurre instantáneamente y tiene un coste _reducido en un 30%_, pero no ciega a enemigos ni activa otros talentos.\n\n_+3:_ Si el Pícaro usa bomba de humo estando invisible, esta ocurre instantáneamente y tiene un coste _reducido en un 41%_, pero no ciega a enemigos ni activa otros talentos.\n\n_+4:_ Si el Pícaro usa bomba de humo estando invisible, esta ocurre instantáneamente y tiene un coste _reducido en un 50%_, pero no ciega a enemigos ni activa otros talentos.

actors.hero.talent.fear_the_reaper.title=muerte aterradora
actors.hero.talent.fear_the_reaper.desc=_+1:_ Cuando un enemigo marcado por la muerte alcance los 0 PS, quedará _lisiado_.\n\n_+2:_ Cuando un enemigo marcado por la muerte alcance los 0 PS, quedará _aterrado y lisiado_.\n\n_+3:_ Cuando un enemigo marcado por la muerte alcance los 0 PS, quedará _aterrado y lisiado_ y los enemigos a 3 casillas de este serán _lisiados_.\n\n_+4:_ Cuando un enemigo marcado por la muerte alcance los 0 PS, quedará _aterrado y lisiado_ y los enemigos a 3 casillas de este serán _aterrados y lisiados_.
actors.hero.talent.deathly_durability.title=durabilidad mortal
actors.hero.talent.deathly_durability.desc=_+1:_ Los enemigos que mueran por la marca de la muerte le darán al Pícaro blindaje equivalente al _13%_ de la salud de dichos enemigos cuando fueron marcados.\n\n_+2:_ Los enemigos que mueran por la marca de la muerte le darán al Pícaro blindaje equivalente al _25%_ de la salud de dichos enemigos cuando fueron marcados.\n\n_+3:_ Los enemigos que mueran por la marca de la muerte le darán al Pícaro blindaje equivalente al _38%_ de la salud de dichos enemigos cuando fueron marcados.\n\n_+4:_ Los enemigos que mueran por la marca de la muerte le darán al Pícaro blindaje equivalente al _50%_ de la salud de dichos enemigos cuando fueron marcados.
actors.hero.talent.double_mark.title=doble marca
actors.hero.talent.double_mark.desc=_+1:_ Marcar a un segundo objetivo al mismo tiempo que el primero tiene un coste _reducido en un 30%_.\n\n_+2:_ Marcar a un segundo objetivo al mismo tiempo que el primero tiene un coste _reducido en un 50%_.\n\n_+3:_ Marcar a un segundo objetivo al mismo tiempo que el primero tiene un coste _reducido en un 65%_.\n\n_+4:_ Marcar a un segundo objetivo al mismo tiempo que el primero tiene un coste _reducido en un 75%_.

actors.hero.talent.shadow_blade.title=cuchilla sombría
actors.hero.talent.shadow_blade.desc=_+1:_ El clon de sombra gana _8%_ del daño del héroe por cada turno, y tiene un _25% de probabilidad_ de usar el encantamiento en el arma del héroe.\n\n_+2:_ El clon de sombra gana _16%_ del daño del héroe por cada turno, y tiene un _50% de probabilidad_ de usar el encantamiento en el arma del héroe.\n\n_+3:_ El clon de sombra gana _24%_ del daño del héroe por cada turno, y tiene un _75% de probabilidad_ de usar el encantamiento en el arma del héroe.\n\n_+4:_ El clon de sombra gana _32%_ del daño del héroe por cada turno, y tiene un _100% de probabilidad_ de usar el encantamiento en el arma del héroe.
actors.hero.talent.cloned_armor.title=armadura clonada
actors.hero.talent.cloned_armor.desc=_+1:_ El clon de sombra gana el _12%_ del valor de armadura del héroe y tiene una _probabilidad del 25%_ de usar el glifo en la armadura del héroe.\n\n_+2:_ El clon de sombra gana el _24%_ del valor de armadura del héroe y tiene una _probabilidad del 50%_ de usar el glifo en la armadura del héroe.\n\n_+3:_ El clon de sombra gana el _36%_ del valor de armadura del héroe y tiene una _probabilidad del 75%_ de usar el glifo en la armadura del héroe.\n\n_+4:_ El clon de sombra gana el _48%_ del valor de armadura del héroe y tiene una _probabilidad del 100%_ de usar el glifo en la armadura del héroe.
actors.hero.talent.perfect_copy.title=copia perfecta
actors.hero.talent.perfect_copy.desc=_+1:_ El clon de sombra gana un _10%_ de los PS máximos del héroe y puede intercambiar instantáneamente de lugar con el héroe hasta _1 casilla_ de distancia.\n\n_+2:_ El clon de sombra gana un _20%_ de los PS máximos del héroe y puede intercambiar instantáneamente de lugar con el héroe hasta _2 casillas_ de distancia.\n\n_+3:_ El clon de sombra gana un _30%_ de los PS máximos del héroe y puede intercambiar instantáneamente de lugar con el héroe hasta _3 casillas_ de distancia.\n\n_+4:_ El clon de sombra gana un _40%_ de los PS máximos del héroe y puede intercambiar instantáneamente de lugar con el héroe hasta _4 casillas_ de distancia.

#huntress
actors.hero.talent.natures_bounty.title=bondad de la naturaleza
actors.hero.talent.natures_bounty.desc=_+1:_ La Cazadora puede encontrar _4 bayas_ escondidas en la hierba alta mientras explora los siguientes niveles de la mazmorra.\n\n_+2:_ La Cazadora puede encontrar _6 bayas_ escondidas en la hierba alta mientras explora los siguientes niveles de la mazmorra.\n\nLas bayas se comen rápidamente, restablecen una cantidad de saciedad pequeña y puede que contengan una semilla utilizable.
actors.hero.talent.survivalists_intuition.title=intuición de supervivencia
actors.hero.talent.survivalists_intuition.desc=_+1:_ La Cazadora identifica todo el equipamiento _1.75 veces más rápido_.\n\n_+2:_ La Cazadora identifica todo el equipamiento _2.5 veces más rápido_.
actors.hero.talent.followup_strike.title=golpe seguido
actors.hero.talent.followup_strike.desc=_+1:_ Cuando la Cazadora golpea a un enemigo con su arco o un arma arrojadiza, su siguiente ataque cuerpo a cuerpo infligirá _2 de daño adicional_.\n\n_+2:_ Cuando la Cazadora golpea a un enemigo con su arco o un arma arrojadiza, su siguiente ataque cuerpo a cuerpo infligirá _3 de daño adicional_.
actors.hero.talent.natures_aid.title=ayuda de la naturaleza
actors.hero.talent.natures_aid.desc=_+1:_ La Cazadora gana 0-2 de armadura de piel de roble que se desvanece en _3 turnos_ cuando el efecto de una planta es activado en su visión.\n\n_+2:_ La Cazadora gana 0-2 de armadura de piel de roble que se desvanece en _5 turnos_ cuando el efecto de una planta es activado en su visión.

actors.hero.talent.invigorating_meal.title=comida vigorizante
actors.hero.talent.invigorating_meal.desc=_+1:_ Comer le toma a la Cazadora 1 turno (las bayas son comidas instantáneamente) y le otorga _1 turno de velocidad_.\n\n_+2:_ Comer le toma a la Cazadora 1 turno (las bayas son comidas instantáneamente) y le otorga _2 turnos de velocidad_.
actors.hero.talent.liquid_nature.title=naturaleza líquida
actors.hero.talent.liquid_nature.desc=_+1:_ Cuando la Cazadora bebe o lanza una poción, infusión o elixir, brota _hasta 4 casillas de hierba_ en el área y enemigos adyacentes son enraizados por _1 turno_.\n\n_+2:_ Cuando la Cazadora bebe o lanza una poción, infusión o elixir, brota _hasta 6 casillas de hierba_ en el área y enemigos adyacentes son enraizados por _2 turnos_.\n\nLa cantidad de hierba y duración del enraizado se duplica cuando se usan pociones de fuerza, experiencia o ítems creados mediante alquimia utilizando esas pociones.\n\nEn el caso de ítems de alquimia con mayores cantidades de producción (por ejemplo, la infusión acuática), este talento tiene una probabilidad de activarse en función a la cantidad que se produzca de dicho ítem.
actors.hero.talent.rejuvenating_steps.title=Pasos rejuvenecedores
actors.hero.talent.rejuvenating_steps.desc=_+1:_ Cuando la Cazadora pisa la hierba corta o las brasas, estas se convierten en hierba alta que la Cazadora surca inmediatamente. Tiene un tiempo de recarga de _10 turnos_.\n\n_+2:_ Cuando la Cazadora pisa la hierba corta o las brasas, estas se convierten en hierba alta que la Cazadora surca inmediatamente. Tiene un tiempo de recarga de _5 turnos_.\n\nEste talento producirá hierba surcada si los efectos de regeneración pasiva están deshabilitados o el héroe no ha ganado experiencia en mucho tiempo.
actors.hero.talent.heightened_senses.title=Sentidos agudizados
actors.hero.talent.heightened_senses.desc=_+1:_ La Cazadora obtiene visión mental sobre cualquier enemigo a _2 casillas de su posición._\n\n_+2:_ La Cazadora obtiene visión mental sobre cualquier enemigo a _3 casillas de su posición._
actors.hero.talent.durable_projectiles.title=Proyectiles duraderos
actors.hero.talent.durable_projectiles.desc=_+1:_ Las armas arrojadizas duran un _50% más_ cuando son usadas por la Cazadora.\n\n_+2:_ Las armas arrojadizas duran un _75% más_ cuando son usadas por la Cazadora.

actors.hero.talent.point_blank.title=a quema ropa
actors.hero.talent.point_blank.desc=_+1:_ Cuando la Cazadora usa su arco o armas arrojadizas cuerpo a cuerpo tienen _-30% de precisión_ en vez de -50%.\n\n_+2:_ Cuando la Cazadora usa su arco o armas arrojadizas cuerpo a cuerpo tienen _-10% de precisión_ en vez de -50%.\n\n_+3:_ Cuando la Cazadora usa su arco o armas arrojadizas cuerpo a cuerpo tienen _+10% de precisión_ en vez de -50%.\n\nTenga en cuenta que las armas arrojadizas o el arco espiritual siempre tienen +50% de precisión al ser usados a distancia.
actors.hero.talent.seer_shot.title=disparo vidente
actors.hero.talent.seer_shot.desc=_+1:_ Cuando la Cazadora dispara al suelo con su arco, obtiene visión alrededor de ese punto en un área de 3x3 durante _5 turnos_. Tiene un tiempo de recarga de 20 turnos.\n\n_+2:_ Cuando la Cazadora dispara al suelo con su arco, obtiene visión alrededor de ese punto en un área de 3x3 durante _10 turnos_. Tiene un tiempo de recarga de 20 turnos.\n\n_+3:_ Cuando la Cazadora dispara al suelo con su arco, obtiene visión alrededor de ese punto en un área de 3x3 durante _15 turnos_. Tiene un tiempo de recarga de 20 turnos.
actors.hero.talent.seer_shot.meta_desc=_Si este talento lo obtiene otro héroe_ se activará mediante cualquier arma arrojadiza.

actors.hero.talent.farsight.title=vista lejana
actors.hero.talent.farsight.desc=_+1:_ El rango de visión de la Francotiradora _incrementa un 25%_.\n\n_+2:_ El rango de visión de la Francotiradora _incrementa un 50%_.\n\n_+3:_ El rango de visión de la Francotiradora _incrementa un 75%_.
actors.hero.talent.shared_enchantment.title=encantamiento compartido
actors.hero.talent.shared_enchantment.desc=_+1:_ Las armas arrojadizas tienen un _33% de probabilidad_ de usar el encantamiento del arco de la Francotiradora.\n\n_+2:_ Las armas arrojadizas tienen un _67% de probabilidad_ de usar el encantamiento del arco de la Francotiradora.\n\n_+3:_ Las armas arrojadizas tienen un _100% de probabilidad_ de usar el encantamiento del arco de la Francotiradora.\n\nEste talento no se aplica a los dardos lanzados con una ballesta encantada, estos ya activan el encantamiento de la ballesta.
actors.hero.talent.shared_upgrades.title=mejoras compartidas
actors.hero.talent.shared_upgrades.desc=_+1:_ Cuando la Francotiradora ataca con un arma arrojadiza mejorada, incrementa la duración de la marca de la francotiradora en 1 turno y el daño de su ataque especial un _10%_ por cada nivel de mejora.\n\n_+2:_ Cuando la Francotiradora ataca con un arma arrojadiza mejorada, incrementa la duración de la marca de la francotiradora en 1 turno y el daño de su ataque especial un _20%_ por cada nivel de mejora.\n\n_+3:_ Cuando la Francotiradora ataca con un arma arrojadiza mejorada, incrementa la duración de la marca de la francotiradora en 1 turno y el daño de su ataque especial un _30%_ por cada nivel de mejora.

actors.hero.talent.durable_tips.title=puntas duraderas
actors.hero.talent.durable_tips.desc=_+1:_ Los dardos reforzados tienen _x2 de durabilidad_ cuando la Guardabosques los usa.\n\n_+2:_ Los dardos reforzados tienen _x3 de durabilidad_ cuando la Guardabosques los usa.\n\n_+3:_ Los dardos reforzados tienen _x4 de durabilidad_ cuando la Guardabosques los usa.
actors.hero.talent.barkskin.title=piel de roble
actors.hero.talent.barkskin.desc=_+1:_ Cuando esté sobre la hierba, la Guardabosques gana _0-50% de su nivel_ en armadura de piel de roble, que se desvanece cada turno.\n\n_+2:_ Cuando esté sobre la hierba, la Guardabosques gana _0-100% de su nivel_ en armadura de piel de roble, que se desvanece cada turno.\n\n_+3:_ Cuando esté sobre la hierba, la Guardabosques gana _0-150% de su nivel_ en armadura de piel de roble, que se desvanece cada turno.
actors.hero.talent.shielding_dew.title=rocío protector
actors.hero.talent.shielding_dew.desc=_+1:_ Las gotas de rocío pueden dar blindaje a la Guardabosques cuando su salud esté llena, hasta un _20% de sus PS máximos_.\n\n_+2:_ Las gotas de rocío pueden dar blindaje a la Guardabosques cuando su salud esté llena, hasta un _40% de sus PS máximos_.\n\n_+3:_ Las gotas de rocío pueden dar blindaje a la Guardabosques cuando su salud esté llena, hasta un _60% de sus PS máximos_.

actors.hero.talent.fan_of_blades.title=abanico de cuchillas
actors.hero.talent.fan_of_blades.desc=_+1:_ Cuchillas espectrales puede golpear hasta _1 objetivo adicional_ por el 50% de daño. Este debe estar visible y dentro de un área cónica de _30 grados_.\n\n_+2:_ Cuchillas espectrales puede golpear hasta _2 objetivos adicionales_ por el 50% de daño. Estos deben estar visible y dentro un área cónica de _60 grados_.\n\n_+3:_ Cuchillas espectrales puede golpear hasta _3 objetivos adicionales_ por el 50% de daño. Estos deben estar visible y dentro de un área cónica de _90 grados_.\n\n_+4:_ Cuchillas espectrales puede golpear hasta _4 objetivos adicionales_ por el 50% de daño. Estos deben estar visible y dentro de un área cónica de _120 grados_.
actors.hero.talent.projecting_blades.title=cuchillas proyectantes
actors.hero.talent.projecting_blades.desc=_+1:_ Cuchillas espectrales tiene _+25% de precisión_ y puede penetrar hasta _2 casillas sólidas_.\n\n_+2:_ Cuchillas espectrales tiene _+50% de precisión_ y puede penetrar hasta _4 casillas sólidas_.\n\n_+3:_ Cuchillas espectrales tiene _+75% de precisión_ y puede penetrar hasta _6 casillas sólidas_.\n\n_+4:_ Cuchillas espectrales tiene _+100% de precisión_ y puede penetrar hasta _8 casillas sólidas_.
actors.hero.talent.spirit_blades.title=cuchillas espirituales
actors.hero.talent.spirit_blades.desc=_+1:_ Cuchillas espectrales tiene una _probabilidad del 30%_ de usar también el encantamiento del arco espiritual.\n\n_+2:_ Cuchillas espectrales tiene una _probabilidad del 60%_ de usar también el encantamiento del arco espiritual.\n\n_+3:_ Cuchillas espectrales tiene una _probabilidad del 90%_ de usar también el encantamiento del arco espiritual.\n\n_+4:_ Cuchillas espectrales tiene una _probabilidad del 100%_ de usar también el encantamiento del arco espiritual y otorga a cada encantamiento un _10% más de poder_.

actors.hero.talent.growing_power.title=poder creciente
actors.hero.talent.growing_power.desc=_+1:_ Los aumentos de velocidad de ataque y de movimiento del poder de la naturaleza incrementan de 33% y 100% a _38% y 125%_ respectivamente.\n\n_+2:_ Los aumentos de velocidad de ataque y de movimiento del poder de la naturaleza incrementan de 33% y 100% a _42% y 150%_ respectivamente.\n\n_+3:_ Los aumentos de velocidad de ataque y de movimiento del poder de la naturaleza incrementan de 33% y 100% a _46% y 175%_ respectivamente.\n\n_+4:_ Los aumentos de velocidad de ataque y de movimiento del poder de la naturaleza incrementan de 33% y 100% a _50% y 200%_ respectivamente.
actors.hero.talent.natures_wrath.title=ira de la naturaleza
actors.hero.talent.natures_wrath.desc=_+1:_ Mientras poder de la naturaleza este activo, los disparos del arco espiritual tienen una _probabilidad del 8%_ de activar un efecto de planta dañino aleatorio.\n\n_+2:_ Mientras poder de la naturaleza este activo, los disparos del arco espiritual tienen una _probabilidad del 17%_ de activar un efecto de planta dañino aleatorio.\n\n_+3:_ Mientras poder de la naturaleza este activo, los disparos del arco espiritual tienen una _probabilidad del 25%_ de activar un efecto de planta dañino aleatorio.\n\n_+4:_ Mientras poder de la naturaleza este activo, los disparos del arco espiritual tienen una _probabilidad del 33%_ de activar un efecto de planta dañino aleatorio.\n\nLas plantas que pueden activarse son: ciegahierba, florígnea, hongohielo, musgopena y parratormenta.
actors.hero.talent.wild_momentum.title=impulso salvaje
actors.hero.talent.wild_momentum.desc=_+1:_ Matar a un enemigo con el arco espiritual prolonga la duración de poder de la naturaleza por _1 turno_. La duración se puede extender hasta un máximo de _2 turnos_.\n\n_+2:_ Matar a un enemigo con el arco espiritual prolonga la duración de poder de la naturaleza por _2 turnos_. La duración se puede extender hasta un máximo de _4 turnos_.\n\n_+3:_ Matar a un enemigo con el arco espiritual prolonga la duración de poder de la naturaleza por _3 turnos_. La duración se puede extender hasta un máximo de _6 turnos_.\n\n_+4:_ Matar a un enemigo con el arco espiritual prolonga la duración de poder de la naturaleza por _4 turnos_. La duración se puede extender hasta un máximo de _8 turnos_.

actors.hero.talent.eagle_eye.title=ojo de águila
actors.hero.talent.eagle_eye.desc=_+1:_ El rango de visión del halcón espíritu incrementa de 6 a _7 casillas_.\n\n_+2:_ El rango de visión del halcón espíritu incrementa de 6 a _8 casillas_.\n\n_+3:_ El rango de visión del halcón espíritu incrementa de 6 a _9 casillas_ y obtiene _2 casillas_ de visión mental.\n\n_+4:_ El rango de visión del halcón espíritu incrementa de 6 a _10 casillas_ y obtiene _3 casillas_ de visión mental.
actors.hero.talent.go_for_the_eyes.title=ve a por los ojos
actors.hero.talent.go_for_the_eyes.desc=_+1:_ Los ataques del halcón espíritu ciegan a los enemigos por _2 turnos_.\n\n_+2:_ Los ataques del halcón espíritu ciegan a los enemigos por _5 turnos_.\n\n_+3:_ Los ataques del halcón espíritu ciegan a los enemigos por _5 turnos_ y los lisia por _2 turnos_.\n\n_+4_ Los ataques del halcón espíritu ciegan a los enemigos por _5 turnos_ y los lisia por _5 turnos_.
actors.hero.talent.swift_spirit.title=espíritu veloz
actors.hero.talent.swift_spirit.desc=_+1:_ La velocidad de movimiento del halcón espíritu incrementa de 2 a _2.5 casillas_ y está garantizado que esquive los primeros _2 ataques_ realizados contra él.\n\n_+2:_ La velocidad de movimiento del halcón espíritu incrementa de 2 a _3 casillas_ y está garantizado que esquive los primeros _4 ataques_ realizados contra él.\n\n_+3:_ La velocidad de movimiento del halcón espíritu incrementa de 2 a _3.5 casillas_ y está garantizado que esquive los primeros _6 ataques_ realizados contra él.\n\n_+4:_ La velocidad de movimiento del halcón espíritu incrementa de 2 a _4 casillas_ y está garantizado que esquive los primeros _8 ataques_ realizados contra él.

#duelist
actors.hero.talent.strengthening_meal.title=comida fortalecedora
actors.hero.talent.strengthening_meal.desc=_+1:_ Comer le otorga a la Duelista 3 de daño adicional en las siguientes _2 veces_ que golpee a un enemigo con un ataque físico.\n\n_+2:_ Comer le otorga a la Duelista 3 de daño adicional en las siguientes _3 veces_ que golpee a un enemigo con un ataque físico.
actors.hero.talent.adventurers_intuition.title=intuición de aventurera
actors.hero.talent.adventurers_intuition.desc=_+1:_ La Duelista identifica armas _2.5 veces más rápido_ y armaduras _1.75 veces más rápido_.\n\n_+2:_ La Duelista identifica armas _en cuanto las equipa_ y armaduras _2.5 veces más rápido_.
actors.hero.talent.patient_strike.title=golpe sereno
actors.hero.talent.patient_strike.desc=_+1:_ Si la Duelista espera antes de realizar un ataque cuerpo a cuerpo, esta causará _1-2 de daño adicional_.\n\n_+2:_ Si la Duelista espera antes de realizar un ataque cuerpo a cuerpo, esta causará _2 de daño adicional_.
actors.hero.talent.aggressive_barrier.title=barrera agresiva
actors.hero.talent.aggressive_barrier.desc=_+1:_ La Duelista gana _3 de blindaje_ cuando usa una habilidad de arma estando a, o por debajo del 50% de salud.\n\n_+2:_ La Duelista gana _5 de blindaje_ cuando usa una habilidad de arma estando a, o por debajo del 50% de salud.
actors.hero.talent.aggressive_barrier.meta_desc=_Si este talento lo obtiene otro héroe_ otorgará blindaje al realizar un ataque cuerpo a cuerpo teniendo baja salud, con 50 turnos de recarga.

actors.hero.talent.focused_meal.title=comida focalizada
actors.hero.talent.focused_meal.desc=_+1:_ Comer comida le toma a la Duelista 1 turno y le otorga _0.67 cargas_ a sus armas.\n\n_+2:_ Comer comida le toma a la Duelista 1 turno y le otorga _1 carga_ a sus armas.
actors.hero.talent.focused_meal.meta_desc=_Si este talento lo obtiene otro héroe_ otorgará daño adicional en su siguiente golpe equivalente a su nivel/3 en +1 o su nivel/2 en +2.
actors.hero.talent.liquid_agility.title=agilidad líquida
actors.hero.talent.liquid_agility.desc=_+1:_ Cuando bebe o lanza una poción, infusión o elixir, la Duelista tiene _x3 de evasión_, además de _x3 de precisión_ en su siguiente ataque cuerpo a cuerpo dentro de 5 turnos.\n\n_+2:_ Cuando bebe o lanza una poción, infusión o elixir, la Duelista tiene _evasión infinita_, además de _precisión infinita_ en su siguiente ataque cuerpo a cuerpo dentro de 5 turnos.\n\nEste efecto dura un turno y un ataque adicional cuando se usan pociones de fuerza, experiencia o ítems creados mediante alquimia utilizando esas pociones.\n\nEn el caso de ítems de alquimia con mayores cantidades de producción (por ejemplo, la infusión acuática), este talento tiene una probabilidad de activarse en función a la cantidad que se produzca de dicho ítem.
actors.hero.talent.weapon_recharging.title=recarga de armas
actors.hero.talent.weapon_recharging.desc=_+1:_ La Duelista gana una carga de arma cada _15 turnos_ bajo el efecto de recarga de varitas o artefactos.\n\n_+2:_ La Duelista gana una carga de arma cada _10 turnos_ bajo el efecto de recarga de varitas o artefactos.
actors.hero.talent.weapon_recharging.meta_desc=_Si este talento lo obtiene otro héroe_ hará que cause +5% de daño cuerpo a cuerpo mientras este recargándose en +1 o +7.5% de daño cuerpo cuerpo en +2.
actors.hero.talent.lethal_haste.title=prisa letal
actors.hero.talent.lethal_haste.desc=_+1:_ Cuando la Duelista mata a un enemigo con una habilidad de arma, gana _3 turnos_ de movimiento instantáneo.\n\n_+2:_ Cuando la Duelista mata a un enemigo con una habilidad de arma, gana _5 turnos_ de movimiento instantáneo.
actors.hero.talent.lethal_haste.meta_desc=_Si este talento lo obtiene otro héroe_ se activará en su lugar, con ataques normales de su arma, con 100 turnos de recarga.
actors.hero.talent.swift_equip.title=empuñe veloz
actors.hero.talent.swift_equip.desc=_+1:_ La Duelista puede equipar armas instantáneamente _una vez_, cada 20 turnos.\n\n_+2:_ La Duelista puede equipar armas instantáneamente _dos veces_, cada 20 turnos.\n\nSi la Duelista tiene este talento y no está en recarga, usar un arma no equipada mediante un atajo la equipará.

actors.hero.talent.precise_assault.title=asalto preciso
actors.hero.talent.precise_assault.desc=_+1:_ Cuando la Duelista usa una habilidad de arma, gana _x2 de precisión_ en su próximo ataque cuerpo a cuerpo dentro de 5 turnos.\n\n_+2:_ Cuando la Duelista usa una habilidad de arma, gana _x5 de precisión_ en su próximo ataque cuerpo a cuerpo dentro de 5 turnos.\n\n_+3:_ Cuando la Duelista usa una habilidad de arma, gana _precisión infinita_ en su próximo ataque cuerpo a cuerpo dentro de 5 turnos.
actors.hero.talent.precise_assault.meta_desc=_Si este talento lo obtiene otro héroe_, aumentará la precisión cuerpo a cuerpo en un 10% a +1, un 20% a +2 o un 30% a +3.
actors.hero.talent.deadly_followup.title=seguimiento mortal
actors.hero.talent.deadly_followup.desc=_+1:_ Cuando la Duelista golpea a un enemigo con un arma arrojadiza, le causará _10% más de daño cuerpo a cuerpo_ por 5 turnos.\n\n_+2:_ Cuando la Duelista golpea a un enemigo con un arma arrojadiza, le causará _20% más de daño cuerpo a cuerpo_ por 5 turnos.\n\n_+3:_ Cuando la Duelista golpea a un enemigo con un arma arrojadiza, le causará _30% más de daño cuerpo a cuerpo_ por 5 turnos.

actors.hero.talent.varied_charge.title=carga variada
actors.hero.talent.varied_charge.desc=_+1:_ La Campeona recupera instantáneamente _0.17 cargas de arma_ cuando usa dos habilidades de arma diferentes, sin límite de tiempo.\n\n_+2:_ La Campeona recupera instantáneamente _0.33 cargas de arma_ cuando usa dos habilidades de arma diferentes, sin límite de tiempo.\n\n_+3:_ La Campeona recupera instantáneamente _0.5 cargas de arma_ cuando usa dos habilidades de arma diferentes, sin límite de tiempo.
actors.hero.talent.twin_upgrades.title=mejoras gemelas
actors.hero.talent.twin_upgrades.desc=_+1:_ Si una de las dos armas equipadas de la Campeona tiene un nivel más bajo y está _2 o más tier por debajo_ que la otra arma, será potenciada al nivel de ésta última.\n\n_+2:_ Si una de las dos armas equipadas de la Campeona tiene un nivel más bajo y está _1 o más tier por debajo_ que la otra arma, será potenciada al nivel de ésta última.\n\n_+3:_ Si una de las dos armas equipadas de la Campeona tiene un nivel más bajo y es _del mismo o menor tier_ que la otra arma, será potenciada al nivel de ésta última.
actors.hero.talent.combined_lethality.title=letalidad combinada
actors.hero.talent.combined_lethality.desc=_+1:_ Si la Campeona ataca con un arma cuerpo a cuerpo inmediatamente después de usar la habilidad de un arma diferente, ese ataque ejecutará a cualquier enemigo no sea un jefe que esté por _debajo del 13% de PS_.\n\n_+2:_ Si la Campeona ataca con un arma cuerpo a cuerpo inmediatamente después de usar la habilidad de un arma diferente, ese ataque ejecutará a cualquier enemigo no sea un jefe que esté por _debajo del 27% de PS_.\n\n_+3:_ Si la Campeona ataca con un arma cuerpo a cuerpo inmediatamente después de usar la habilidad de un arma diferente, ese ataque ejecutará a cualquier enemigo no sea un jefe que esté por _debajo del 40% de PS_.\n\nEste ataque puede ser un ataque cuerpo a cuerpo común, o parte de una habilidad de arma.

actors.hero.talent.unencumbered_spirit.title=espíritu libre de cargas
actors.hero.talent.unencumbered_spirit.desc=_+1:_ La Monje gana _50% más de energía_ por cada pieza de equipamiento de _tier 3 o menor_ que esté usando.\n\n_+2:_ El efecto de este talento incrementa a _75% más de energía_ por cada pieza de equipamiento de _tier 2 o menor_ que la Monje esté usando.\n\n_+3:_ El efecto de este talento incrementa a _100% más de energía_ por cada pieza de equipamiento de _tier 1_ que la Monje esté usando. Además obtiene una armadura de tela y unos guantes tachonados gratis.\n\nTenga en cuenta que este talento no otorga ningún beneficio por estar desarmado o atacar con un Anillo de Fuerza.
actors.hero.talent.monastic_vigor.title=vigor monástico
actors.hero.talent.monastic_vigor.desc=_+1:_ Si la Monje tiene _100% de energía_, sus técnicas se potencian.\n\n_+2:_ Si la Monje tiene _80% o más de energía_, sus técnicas se potencian.\n\n_+3:_ Si la Monje tiene _60% o más de energía_, sus técnicas se potencian.\n\nCuando están potenciadas:\n- Ráfaga aplica el encantamiento de tu arma\n- Concentración es instantánea\n- Carrera gana +4 de rango\n- Patada de Dragón inflige +50% de daño y aplica su efecto de empuje y aturdimiento a todos los enemigos adyacentes\n- Meditar cura lentamente el 20% de los PS faltantes y otorga un 80% de resistencia al daño.
actors.hero.talent.combined_energy.title=energía combinada
actors.hero.talent.combined_energy.desc=_+1:_ Si la Monje usa una habilidad de arma y una técnica de _4 o más de energía_ dentro de 5 turnos, recupera 1 de energía gastada.\n\n_+2:_ Si la Monje usa una habilidad de arma y una técnica de _3 o más de energía_ dentro de 5 turnos, recupera 1 de energía gastada.\n\n_+3:_ Si la Monje usa una habilidad de arma y una técnica de _2 o más de energía_ dentro de 5 turnos, recupera 1 de energía gastada.

actors.hero.talent.close_the_gap.title=acortar distancias
actors.hero.talent.close_the_gap.desc=_+1:_ La Duelista destella _hasta dos casillas_ hacia su objetivo al comenzar un duelo.\n\n_+2:_ La Duelista destella _hasta tres casillas_ hacia su objetivo al comenzar un duelo.\n\n_+3:_ La Duelista destella _hasta cuatro casillas_ hacia su objetivo al comenzar un duelo.\n\n_+4:_ La Duelista destella _hasta cinco casillas_ hacia su objetivo al comenzar un duelo.\n\nEste destello puede atravesar enemigos y peligros, pero no terrenos sólidos como paredes. El destello es tenido en cuenta al determinar si un enemigo esta al alcance para ser desafiado.
actors.hero.talent.invigorating_victory.title=triunfo vigorizante
actors.hero.talent.invigorating_victory.desc=_+1:_ Si la Duelista derrota a su objetivo antes de que el duelo acabe, se cura por _5 PS más 30% del daño_ recibido durante el duelo.\n\n_+2:_ Si la Duelista derrota a su objetivo antes de que el duelo acabe, se cura por _10 PS más 50% del daño_ recibido durante el duelo.\n\n_+3:_ Si la Duelista derrota a su objetivo antes de que el duelo acabe, se cura por _15 PS más 65% del daño_ recibido durante el duelo.\n\n_+4:_ Si la Duelista derrota a su objetivo antes de que el duelo acabe, se cura por _20 PS más 75% del daño_ recibido durante el duelo.
actors.hero.talent.elimination_match.title=eliminatoria
actors.hero.talent.elimination_match.desc=_+1:_ Si la Duelista desafía a 3 turnos de haber acabado un duelo, el mismo tiene un coste de carga _reducido en 16%_.\n\n_+2:_ Si la Duelista desafía a 3 turnos de haber acabado un duelo, el mismo tiene un coste de carga _reducido en 30%_.\n\n_+3:_ Si la Duelista desafía a 3 turnos de haber acabado un duelo, el mismo tiene un coste de carga _reducido en 40%_.\n\n_+4:_ Si la Duelista desafía a 3 turnos de haber acabado un duelo, el mismo tiene un coste de carga _reducido en 50%_.

actors.hero.talent.elemental_reach.title=alcance elemental
actors.hero.talent.elemental_reach.desc=_+1:_ El alcance de impacto elemental aumenta de 4 a _5 casillas_, y su ancho aumenta de 65 a _75 grados_.\n\n_+2:_ El alcance de impacto elemental aumenta de 4 a _6 casillas_, y su ancho aumenta de 65 a _85 grados_.\n\n_+3:_ El alcance de impacto elemental aumenta de 4 a _7 casillas_, y su ancho aumenta de 65 a _95 grados_.\n\n_+4:_ El alcance de impacto elemental aumenta de 4 a _8 casillas_, y su ancho aumenta de 65 a _105 grados_.
actors.hero.talent.striking_force.title=fuerza de impacto
actors.hero.talent.striking_force.desc=_+1:_ La potencia del efecto de impacto elemental incrementa en _30%_.\n\n_+2:_ La potencia del efecto de impacto elemental incrementa en _60%_.\n\n_+3:_ La potencia del efecto de impacto elemental incrementa en _90%_.\n\n_+4:_ La potencia del efecto de impacto elemental incrementa en _120%_.
actors.hero.talent.directed_power.title=poder orientado
actors.hero.talent.directed_power.desc=_+1:_ El ataque directo de impacto elemental gana _+30% de poder de encantamiento_ por cada enemigo al alcance del efecto de impacto elemental, incluido el objetivo del ataque.\n\n_+2:_ El ataque directo de impacto elemental gana _+60% de poder de encantamiento_ por cada enemigo al alcance del efecto de impacto elemental, incluido el objetivo del ataque.\n\n_+3:_ El ataque directo de impacto elemental gana _+90% de poder de encantamiento_ por cada enemigo al alcance del efecto de impacto elemental, incluido el objetivo del ataque.\n\n_+4:_ El ataque directo de impacto elemental gana _+120% de poder de encantamiento_ por cada enemigo al alcance del efecto de impacto elemental, incluido el objetivo del ataque.

actors.hero.talent.feigned_retreat.title=retirada fingida
actors.hero.talent.feigned_retreat.desc=_+1:_ Si un enemigo ataca a su imagen remanente, la Duelista gana _2 turnos_ de velocidad.\n\n_+2:_ Si un enemigo ataca a su imagen remanente, la Duelista gana _4 turnos_ de velocidad.\n\n_+3:_ Si un enemigo ataca a su imagen remanente, la Duelista gana _6 turnos_ de velocidad.\n\n_+4:_ Si un enemigo ataca a su imagen remanente, la Duelista gana _8 turnos_ de velocidad.
actors.hero.talent.expose_weakness.title=exponer debilidades
actors.hero.talent.expose_weakness.desc=_+1:_ Los enemigos que ataquen la imagen remanente de la Duelista se vuelven débiles y vulnerables por _2 turnos_.\n\n_+2:_ Los enemigos que ataquen la imagen remanente de la Duelista se vuelven débiles y vulnerables por _4 turnos_.\n\n_+3:_ Los enemigos que ataquen la imagen remanente de la Duelista se vuelven débiles y vulnerables por _6 turnos_.\n\n_+4:_ Los enemigos que ataquen la imagen remanente de la Duelista se vuelven débiles y vulnerables por _8 turnos_.
actors.hero.talent.counter_ability.title=contra habilidad
actors.hero.talent.counter_ability.desc=_+1:_ Si la Duelista usa una habilidad de arma dentro de 3 turnos después de que la imagen remanente haya sido atacada, recuperará instantáneamente _0.38 cargas_.\n\n_+2:_ Si la Duelista usa una habilidad de arma dentro de 3 turnos después de que la imagen remanente haya sido atacada, recuperará instantáneamente _0.77 cargas_.\n\n_+3:_ Si la Duelista usa una habilidad de arma dentro de 3 turnos después de que la imagen remanente haya sido atacada, recuperará instantáneamente _1.13 cargas_.\n\n_+4:_ Si la Duelista usa una habilidad de arma dentro de 3 turnos después de que la imagen remanente haya sido atacada, recuperará instantáneamente _1.5 cargas_.

#universal
actors.hero.talent.heroic_energy.title=energía heroica
actors.hero.talent.heroic_energy.rat_title=energía ratoica
actors.hero.talent.heroic_energy.desc=_+1:_ La habilidad de la armadura del héroe tiene un coste _reducido en un 12%_.\n\n_+2:_ La habilidad de la armadura del héroe tiene un coste _reducido en un 23%_.\n\n_+3:_ La habilidad de la armadura del héroe tiene un coste _reducido en un 32%_.\n\n_+4:_ La habilidad de la armadura del héroe tiene un coste _reducido en un 40%_.

actors.hero.talent.ratsistance.title=ratenacidad
actors.hero.talent.ratsistance.desc=_+1:_ Enemigos enratuzados hostiles causan _-10% de daño_.\n\n_+2:_ Enemigos enratuzados hostiles causan _-19% de daño_.\n\n_+3:_ Enemigos enratuzados hostiles causan _-27% de daño_.\n\n_+4:_ Enemigos enratuzados hostiles causan _-35% de daño_.
actors.hero.talent.ratlomacy.title=ratiplomacia
actors.hero.talent.ratlomacy.desc=_+1:_ Usar enratuzar sobre un enemigo enratuzado lo vuelve amistoso y la transformación es permanente.\n\n_+2:_ Usar enratuzar sobre un enemigo enratuzado lo vuelve amistoso, la transformación es permanente y le otorga _2 turnos_ de adrenalina.\n\n_+3:_ Usar enratuzar sobre un enemigo enratuzado lo vuelve amistoso, la transformación es permanente y le otorga _4 turnos_ de adrenalina.\n\n_+4:_ Usar enratuzar sobre un enemigo enratuzado lo vuelve amistoso, la transformación es permanente y le otorga _6 turnos_ de adrenalina.
actors.hero.talent.ratforcements.title=ratifuerzos
actors.hero.talent.ratforcements.desc=_+1:_ Usar enratuzar sobre ti mismo _invoca 1_ rata marsupial aliada a tu lado.\n\n_+2:_ Usar enratuzar sobre ti mismo _invoca 2_ ratas marsupiales aliadas a tu lado.\n\n_+3:_ Usar enratuzar sobre ti mismo _invoca 3_ ratas marsupiales aliadas a tu lado.\n\n_+4:_ Usar enratuzar sobre ti mismo _invoca 4_ ratas marsupiales aliadas a tu lado.



###npcs
actors.mobs.npcs.blacksmith.name=herrero troll
actors.mobs.npcs.blacksmith.intro_quest_warrior=¡Hey humano! Tienes pinta de ser un tipo duro.
actors.mobs.npcs.blacksmith.intro_quest_mage=¡Hey humano! Tienes pinta de ser un tipo listo.
actors.mobs.npcs.blacksmith.intro_quest_rogue=¡Hey humano! Tienes pinta de ser un tipo escurridizo.
actors.mobs.npcs.blacksmith.intro_quest_huntress=¡Hey humana! Tienes pinta de ser muy ágil.
actors.mobs.npcs.blacksmith.intro_quest_duelist=¡Hey humana! Tienes pinta de ser muy valiente.
actors.mobs.npcs.blacksmith.intro_quest_cleric=¡Hey humano! Tienes pinta de ser alguien importante.
actors.mobs.npcs.blacksmith.intro_quest_start=¿Quieres ser de ayuda, eh? Tengo una propuesta para ti. Construí este taller encima de una vieja mina, se baja por esa escalera. Toma este pico y tráeme algo de _oro oscuro, 40 piezas_ deberían ser suficientes. La roca ahí abajo es delicada por lo que _podrás minar a través de las paredes con algo de esfuerzo._\n\n¿A qué te refieres, cómo voy a pagar? Cuánta avaricia...\n\nEstá bien, puedo hacer algo de herrería para ti. Considérate con suerte, soy el único herrero en los alrededores.
actors.mobs.npcs.blacksmith.intro_quest_crystal=Pero cuidado, la mina es peligrosa para un pequeño humano como tú. Ha estado abandonada durante un tiempo y un montón de cristales han empezado a crecer. Son brillantes, pero demasiado frágiles para valer nada, y tienen algunas cosas mágicas que los protegen. Son bastante fuertes, así que _ten cuidado donde minas_ o llamarás su atención.\n\nTambién hay un _cristal gigante_ en alguna parte. Es mucho más duro, así que prepárate para una pelea si empiezas a romperlo. Apuesto a que destruirlo reducirá el crecimiento de los cristales, así que pagaré extra si puedes hacerlo.
actors.mobs.npcs.blacksmith.intro_quest_gnoll=Pero cuidado, la mina es peligrosa para un pequeño humano como tú. Algunos gnolls también quieren el oro y ahora están destrozando el lugar. Son estúpidos, tanto que su minería ha causado todo tipo de derrumbes. Tendrás que atravesar minando, así que _busca rocas recientemente removidas._\n\nCreo que uno de los gnolls está causando la mayoría de los problemas, probablemente sea un _geomancer shaman_. Pagaré extra si puedes encontrarlo y matarlo, aunque estoy seguro de que se defenderá.
actors.mobs.npcs.blacksmith.intro_quest_fungi=Pero cuidado, la mina es peligrosa para un pequeño humano como tú. Hay una especie de monstruo hongo que ha estado creciendo ahí abajo. Tiene hongos centinelas que son realmente mortales si te ven, pero al menos no pueden levantarse y perseguirte. _Mantente fuera de su vista_ si quieres seguir con vida.\n\nPagaré extra si consigues acabar con el _hongo más grande_, pero te costará más trabajo. Está conectado a un montón de nodos de micelio que están ocultos en las paredes. Tendrás que romper la mayoría de ellos antes de poder causarle daño.
actors.mobs.npcs.blacksmith.reminder=¿Terminaste de hacerme perder el tiempo? La entrada a la mina está por allí.
actors.mobs.npcs.blacksmith.reminder_crystal=Tráeme tanto oro como puedas, y también intenta destruir el gran cristal.
actors.mobs.npcs.blacksmith.reminder_gnoll=Tráeme tanto oro como puedas, y también intenta eliminar al gnoll geomancer.
actors.mobs.npcs.blacksmith.reminder_fungi=Tráeme tanto oro como puedas, y también intenta eliminar al hongo gigante.
actors.mobs.npcs.blacksmith.lost_pick=¡Dime que es una broma! ¡¿Dónde esta mi pico?!
actors.mobs.npcs.blacksmith.quest_start_prompt=¿Estás listo para bajar? Asegúrate de tener algo de espacio libre para el oro.\n\n_¡Te dejaré entrar ahí abajo una sola vez!_
actors.mobs.npcs.blacksmith.enter_yes=Estoy Listo
actors.mobs.npcs.blacksmith.enter_no=Aún No
actors.mobs.npcs.blacksmith.exit_warn_none=¿Ya terminaste? ¡Pero si no has conseguido nada de oro! Deberías ser capaz de conseguir _40 piezas._\n\n_Recuerda, no te dejaré volver una vez que subas._
actors.mobs.npcs.blacksmith.exit_warn_low=¿Ya terminaste? No parece que hayas conseguido mucho oro. Deberías ser capaz de conseguir _40 piezas._\n\n_Recuerda, no te dejaré volver una vez que subas._
actors.mobs.npcs.blacksmith.exit_warn_med=¿Ya terminaste? Al menos conseguiste algo de oro, pero definitivamente hay más en la mina. Deberías ser capaz de conseguir _40 piezas._\n\n_Recuerda, no te dejaré volver una vez que subas._
actors.mobs.npcs.blacksmith.exit_warn_high=¿Ya terminaste? Parece que conseguiste una buena cantidad de oro, aunque me vendría bien un poco más. Deberías ser capaz de conseguir _40 piezas._\n\n_Recuerda, no te dejaré volver una vez que subas._
actors.mobs.npcs.blacksmith.exit_warn_full=¿Ya terminaste? Has conseguido un montón de oro, pero asegúrate de que no te olvidas tu equipamiento.\n\n_Recuerda, no te dejaré volver una vez que subas._
actors.mobs.npcs.blacksmith.exit_warn_crystal=Ese cristal gigante aún está ahí abajo. pagaré extra si lo destruyes.
actors.mobs.npcs.blacksmith.exit_warn_gnoll=Ese gnoll geomancer aún está ahí abajo. pagaré extra si lo matas.
actors.mobs.npcs.blacksmith.exit_warn_fungi=Ese hongo gigante aún está ahí abajo. pagaré extra si lo matas.
actors.mobs.npcs.blacksmith.exit_yes=Ya Terminé
actors.mobs.npcs.blacksmith.exit_no=Aún No
actors.mobs.npcs.blacksmith.get_lost=Estoy ocupado. ¡Pierdete!
actors.mobs.npcs.blacksmith.entrance_blocked=La entrada está bloqueada.
actors.mobs.npcs.blacksmith.cant_enter_old=Esa área no es accesible en esta partida. ¡Comienza una nueva partida para probar la nueva misión!
actors.mobs.npcs.blacksmith.def_verb=bloqueado
actors.mobs.npcs.blacksmith.desc=Este herrero troll tiene el aspecto de todos los trolls: es alto y delgado, y su piel se parece a la piedra tanto en color como en textura. El trol herrero trabaja con herramientas desproporcionadamente pequeñas.

##old blacksmith quest dialogue from pre-v2.2.0
actors.mobs.npcs.blacksmith.gold_1=¡Hey humano! ¿Quieres ser de ayuda, eh? Toma 'ste pico y pica algo de _oro oscuro, 15 piezas_ deberían ser suficientes. ¿A qué te refieres, cómo voy a pagar? Cuánta avaricia...\nEstá bien, está bien, no tengo dinero pa' pagarte, pero puedo hacer algo de herrería pa' ti. Considérate con suerte, soy el único herrero en los alrededores.
actors.mobs.npcs.blacksmith.blood_1=¡Hey humano! ¿Quieres ser de ayuda, eh? Toma 'ste pico y _mata un murciélago_ con el, nehesito su sangre en la cabeza. ¿A qué te refieres, cómo voy a pagar? Cuánta avaricia...\nEstá bien, está bien, no tengo dinero pa' pagarte, pero puedo hacer algo de herrería pa' ti. Considérate con suerte, soy el único herrero en los alrededores.
actors.mobs.npcs.blacksmith.gold_2=Oro oscuro. 15 piezas. En serio, ¿es tan difícil?
actors.mobs.npcs.blacksmith.blood_2=Dije que necesito sangre de murciélago en el pico. ¡Picar picar!
actors.mobs.npcs.blacksmith.completed=Oh, has regresado... Mejor tarde que nunca.

actors.mobs.npcs.ghost.name=fantasma triste
actors.mobs.npcs.ghost.rat_1=Saludos, %s... Alguna vez fui como tú, fuerte y optimista... Pero una asquerosa bestia acabo conmigo... No puedo dejar este lugar... No hasta tener mi venganza... Acaba con la _rata fétida,_ que ha arrebatado mi vida...\n\nAsecha este piso... Esparciendo porquería por todas partes... _Cuidado con su nube apestosa y su mordida corrosiva, el ácido se disuelve en agua..._
actors.mobs.npcs.ghost.rat_2=Por favor... Ayúdame... Acaba con la abominación...\n\n_Combátela cerca del agua... Aléjate de su hedor..._
actors.mobs.npcs.ghost.gnoll_1=Saludos, %s... Alguna vez fui como tú, fuerte y optimista... Pero un astuto enemigo acabo conmigo... No puedo dejar este lugar... No hasta tener mi venganza... Acaba con el _gnoll embaucador,_ que ha arrebatado mi vida...\n\nNo es como los otros gnolls... Se esconde y utiliza armas arrojadizas... _Cuidado con sus dardos venenosos e incendiarios, no ataques a distancia..._
actors.mobs.npcs.ghost.gnoll_2=Por favor... Ayúdame... Asesina al embaucador...\n\n_No dejes que te golpee... Acércate a él..._
actors.mobs.npcs.ghost.crab_1=Saludos, %s... Alguna vez fui como tú, fuerte y optimista... Pero una antigua criatura acabo conmigo... No puedo dejar este lugar... No hasta tener mi venganza... Acaba con el _gran cangrejo,_ que ha arrebatado mi vida...\n\nEs anormalmente viejo... Con una pinza enorme y un grueso caparazón... _Cuidado con su pinza, sorprende al cangrejo o este bloqueará con ella..._
actors.mobs.npcs.ghost.crab_2=Por favor... Ayúdame... Asesina al Crustáceo...\n_Siempre bloqueará... Cuando te ve venir..._
actors.mobs.npcs.ghost.find_me=Gracias... ven a buscarme...
actors.mobs.npcs.ghost.desc=El fantasma es apenas visible. Parece como un punto amorfo de luz tenue con una cara triste.

actors.mobs.npcs.imp.name=diablillo ambicioso
actors.mobs.npcs.imp.intro=¿Eres un aventurero? ¡Me encantan los aventureros! Siempre puedes confiar en ellos si algo necesita ser asesinado. ¿Estoy en lo correcto? Por una recompensa, por supuesto ;)
actors.mobs.npcs.imp.golems_1=En mi caso son _golems_ los que necesitan ser asesinados. Ya ves, voy a iniciar un pequeño negocio aquí, ¡pero esos estúpidos golems son malos para el negocio! Es muy difícil negociar con trozos ambulantes de granito, ¡malditos sean! Así que por favor, mata a... Digamos _4 de ellos_ y una recompensa será tuya.
actors.mobs.npcs.imp.monks_1=En mi caso son _monjes_ los que necesitan ser asesinados. Ya ves, voy a iniciar un pequeño negocio aquí, pero esos lunáticos no compran nada y asustarán a otros clientes. Así que por favor, mata a... Digamos _5 de ellos_ y una recompensa será tuya.
actors.mobs.npcs.imp.golems_2=¿Cómo va tu safari de golems? No olvides recoger los tokens.
actors.mobs.npcs.imp.monks_2=Oh, ¡sigues vivo! Sabía que tu kung-fu sería el más fuerte ;) No olvides recoger los tokens.
actors.mobs.npcs.imp.cya=¡Nos vemos, %s!
actors.mobs.npcs.imp.hey=¡Psst, %s!
actors.mobs.npcs.imp.desc=Los diablillos son demonios menores. Son notables, no por su fuerza ni su magia, pero por ser sociables e inteligentes. Muchos diablillos prefieren vivir junto con no-demonios.

actors.mobs.npcs.impshopkeeper.name=diablillo ambicioso
actors.mobs.npcs.impshopkeeper.greetings=¡Hola, %s!
actors.mobs.npcs.impshopkeeper.greetings_ascent=¿Qué es lo que has hecho %s? Date prisa, ¡tengo que largarme de aquí!
actors.mobs.npcs.impshopkeeper.thief=¡Creí que podía contar contigo!
actors.mobs.npcs.impshopkeeper.buyback=El diablillo devuelve alegremente tu ítem.
actors.mobs.npcs.impshopkeeper.desc=El diablillo ha instalado una pequeña tienda en el borde de los salones interiores. Es bueno ver una cara amigable, pero sus precios ciertamente no parecen amigables.

actors.mobs.npcs.mirrorimage.name=reflejo
actors.mobs.npcs.mirrorimage.desc=Esta ilusión se parece mucho a ti, incluso parece empuñar tu arma y llevar tu armadura.\n\nLos reflejos buscarán y atacarán a los enemigos usando su arma imitada, que se comporta igual que la tuya, pero causa menos daño. Empiezan siendo casi invisibles, pero deberán adoptar una forma visible para poder atacar.\n\nSi bien su poder ofensivo puede ser potente, los reflejos no tienen durabilidad y se desvanecerán en el momento en que reciban daño.

actors.mobs.npcs.prismaticimage.name=imagen prismática
actors.mobs.npcs.prismaticimage.desc=Esta brillante ilusión tiene mucho parecido contigo, incluse pareciendo que lleva tu misma arma y armadura.\n\nLas imágenes prismáticas intentarán buscar y atraer el enfoque de los enemigos, utilizando su mejor defensa y salud para protegerte. Si bien no tienen el mismo poder ofensivo que las imágenes en espejo, tienen una mayor durabilidad, incluso reciben los beneficios de tu armadura.\n\nCuando se reducen a 0 PS, las imágenes prismáticas se desvanecerán durante varias turnos y aún pueden curarse durante este tiempo. Cuando no hay enemigos, las imágenes prismáticas se desvanecerán y se unirán a su maestro.

actors.mobs.npcs.ratking.name=rey rata
actors.mobs.npcs.ratking.not_sleeping=¡No estoy durmiendo!
actors.mobs.npcs.ratking.what_is_it=¿Qué? No tengo tiempo para este sinsentido. ¡Mi reino no se va a reinar solo!
actors.mobs.npcs.ratking.confused=¿Do... Donde estoy? ¡Mi reino me necesita!
actors.mobs.npcs.ratking.crown_clothes=¡Ponte algo de ropa! ¡No estás en condiciones de hablar con la realeza!
actors.mobs.npcs.ratking.crown_desc=Oooh, ¿esa corona es para mí? Se ve mucho más brillante que el mía, ¡así que acepto gentilmente!\n\nDe hecho, creo que puedo ofrecerte una recompensa por esta corona. ¡Un tremendo poder digno de un héroe como tú! ¿Te gustaría eso?
actors.mobs.npcs.ratking.crown_yes=¡Por supuesto!
actors.mobs.npcs.ratking.crown_info=Cuéntame más.
actors.mobs.npcs.ratking.crown_no=Preferiría que no...
actors.mobs.npcs.ratking.crown_thankyou=Jejeje, gracias. ¡Ahora ve y haz que tu rey se sienta orgulloso!
actors.mobs.npcs.ratking.crown_fine=¡Está bien! No es como si la quisiera de todos modos...
actors.mobs.npcs.ratking.crown_after=¿Disfrutando de tu nueva armadura? ¡No se aceptan devoluciones!
actors.mobs.npcs.ratking.desc_crown=Esta rata es un poco más grande que una rata marsupial normal. Lleva puesta la corona del rey rata sobre su cabeza.
actors.mobs.npcs.ratking.desc_birthday=Esta rata es un poco más grande que una rata marsupial normal. Lleva puesto un pequeño sombrero de fiestas en vez de su habitual corona. ¡Feliz cumpleaños Rey Rata!
actors.mobs.npcs.ratking.desc_winter=Esta rata es un poco mas grande que una rata marsupial normal. Lleva puesto un pequeño sombrero festivo en vez de su habitual corona. ¡Felices fiestas!
actors.mobs.npcs.ratking.desc=Esta rata es un poco más grande que una rata marsupial normal. Lleva puesta una pequeña corona sobre su cabeza.

actors.mobs.npcs.sheep.name=oveja
actors.mobs.npcs.sheep.baa!=¡Baa!
actors.mobs.npcs.sheep.baa?=¿Baa?
actors.mobs.npcs.sheep.baa.=Baa.
actors.mobs.npcs.sheep.baa...=Baa...
actors.mobs.npcs.sheep.def_verb=bloqueado
actors.mobs.npcs.sheep.desc=Es una oveja mágica. ¿Qué hay de mágico en ella? Que no puedes matarla. Se quedará allí hasta desvanecer mágicamente, todo mientras rumia con la mirada en blanco.

actors.mobs.npcs.shopkeeper.name=tendero
actors.mobs.npcs.shopkeeper.thief=¡Ladrón!, ¡Ladrón!
actors.mobs.npcs.shopkeeper.warn=¡Cuidado! Es tu última advertencia.
actors.mobs.npcs.shopkeeper.flee=¡El tendero huye!
actors.mobs.npcs.shopkeeper.sell=Vender un ítem
actors.mobs.npcs.shopkeeper.talk=Hablar
actors.mobs.npcs.shopkeeper.buyback=El tendero devuelve tu ítem a regañadientes.
actors.mobs.npcs.shopkeeper.talk_prison_intro=¡Tengo todo lo que necesitas para una aventura exitosa!
actors.mobs.npcs.shopkeeper.talk_prison_warrior=Vaya sello más interesante el que llevas, normalmente están de una pieza. ¿Eres un héroe deshonrado o algo así? Bueno, lo que hayas hecho no es de mi incumbencia, tus monedas siguen siendo valiosas.
actors.mobs.npcs.shopkeeper.talk_prison_mage=Jeje, creo que he visto un cartel de se busca con tu nombre en algún lugar de la ciudad. De fuga ¿cierto? Oh, ¿eres inocente? Ya, ya... No te agobies, tengo mejores cosas que hacer que delatarte, pero quizás deberías comprar algo por si las dudas.
actors.mobs.npcs.shopkeeper.talk_prison_rogue=¿Has venido del gremio de ladrones para limpiar la zona? No, ¿sólo de compras? Bueno, mata algunos monstruos mientras estás aquí de todos modos. Tampoco esperes un descuento, le pago un buen dinero por protección a tu gente y apenas me mantienen a salvo aquí abajo.
actors.mobs.npcs.shopkeeper.talk_prison_huntress=Parece que estás desorientada, señorita. Los estrechos pasillos de las mazmorras no son tan espaciosos como los grandes salones o los bosques que rodean la ciudad, ¿verdad? Jeje, oh no hagas caso a mis incoherencias, ¿por qué no compras algo?
actors.mobs.npcs.shopkeeper.talk_prison_duelist=¡Pero si es el héroe viajero! Si estás intentando salvar otra ciudad entonces buena suerte, los peligros aquí son mucho más grandes que simples bandas de bandidos. Estoy seguro de que lo harás mejor que nadie, sólo intenta no morir justo delante de mi tienda.
actors.mobs.npcs.shopkeeper.talk_caves=Gasta dinero y vivirás más.\n\nAh, y saluda a ese herrero Troll de mi parte si lo ves. ¡Recuérdale que aún me debe dinero por el martillo que le vendí la semana pasada!
actors.mobs.npcs.shopkeeper.talk_city=Mis mercancías pueden mantenerte a salvo aquí abajo.\n\n...Y no merodees, por favor. Me costó una eternidad conseguir que los lugareños me dejaran en paz, ¡no quiero que atraigas problemas!
actors.mobs.npcs.shopkeeper.talk_halls=¡Hola, tengo precios especiales para cazadores de demonios!\n\n¡Oh y ten cuidado ahí debajo! A los demonios de allí no les importará lo valiente que seas. ¡No puedes regresar y gastar más dinero si estás muerto! ;)\n\n¿Son esos demonios igual que yo? Jeje, en absoluto. Sólo soy un tipo pequeño, no muy luchador, que ha conseguido mantener su mente intacta. Los demonios de abajo son monstruos mucho más fuertes, y todos han sido esclavizados por... bueno... ten cuidado ahí abajo.
actors.mobs.npcs.shopkeeper.talk_ascent=No sé qué planeas hacer con ese amuleto, pero no quiero saber nada de él. ¡Compra algo y apresúrate, ambos necesitamos dejar este lugar!
actors.mobs.npcs.shopkeeper.desc=Este tipo gordo parece más apropiado para un distrito de intercambio en una gran ciudad que para una mazmorra. Sus precios explican por qué prefiere hacer negocios aquí.

actors.mobs.npcs.wandmaker.name=viejo artesano de varitas
actors.mobs.npcs.wandmaker.intro_warrior=Oh, ¡Saludos! ¡Que agradable sorpresa encontrar a un guerrero del norte en un lugar tan deprimente! Debes haber viajado bastante lejos para llegar aquí. Si buscas aventuras, puede que tenga una tarea para ti.
actors.mobs.npcs.wandmaker.intro_rogue=¡Oh Dios, me asustaste! No he conocido un bandido de este lugar que aún tenga cordura, ¡así que debes ser de la superficie! Si estás dispuesto a ayudar a un desconocido, podría tener una tarea para ti.
actors.mobs.npcs.wandmaker.intro_mage=Oh, ¡hola %s! He oído que hubo un lío entre ti y el instituto de magos... Oh, no hagas caso, nunca me gustaron esos anticuados después de todo. Si quieres, podría tener una tarea para ti.
actors.mobs.npcs.wandmaker.intro_huntress=Oh, ¡hola señorita! Una cara amigable es una agradable sorpresa aquí abajo, ¿no crees? De hecho, juro que he visto tu cara antes, pero no acabo de recordar... Oh, no hagas caso, si estás aquí por la aventura, podría tener una tarea para ti.
actors.mobs.npcs.wandmaker.intro_duelist=Oh, ¡Hola señorita! ¡Que agradable sorpresa encontrar a una heroína en un lugar tan deprimente! Si estás dispuesta a ayudar a un anciano, puede que tenga una tarea para ti.
actors.mobs.npcs.wandmaker.intro_1=\n\nVine aquí para encontrar un ingrediente poco común para una varita, pero me he perdido, y mi escudo mágico se está debilitando. Tendré que irme pronto, pero no soportaría irme sin lo que busco.
actors.mobs.npcs.wandmaker.intro_dust=Busco algo de _polvo cadavérico._ Es una especie de harina de hueso maldito que usualmente se encuentra en lugares como este. Debe haber una habitación barricada en los alrededores, estoy seguro de que algo de polvo se va a acumular allí. Ten cuidado, la maldición del polvo es muy potente, _vuelve a mi lo más rápido posible_ y lo purificaré para ti.
actors.mobs.npcs.wandmaker.intro_ember=Busco _ascuas frescas_ de una cría elemental de fuego. Los elementales usualmente aparecen cuando un ritual de invocación no está bajo control, tan sólo tienes que encontrar algunas velas y un lugar para el ritual y estoy seguro de que puedes hacer aparecer uno. Sin embargo, querrás evitar acorralarte a ti mismo mientras luchas contra él, o puedes tener a mano algún tipo de ítem congelante. Las crías elementales son bastante poderosas y caóticas, pero no soportan el frío.
actors.mobs.npcs.wandmaker.intro_berry=El viejo guardia de esta prisión tenía una _planta de putrebaya,_ y ando tras una de sus semillas. La planta probablemente se ha vuelto salvaje, así que convencerla para que entregue una semilla puede ser complicado. Su jardín debería estar en alguna parte en los alrededores. Intenta permanecer _alejado de sus látigos de vid_ si quieres mantenerte de una pieza. Usar fuego puede ser tentador pero por favor no, matarás la planta y destruirás sus semillas.
actors.mobs.npcs.wandmaker.intro_2=\n\nSi me puedes conseguir eso, ¡estaré encantado de pagarte con una de mis varitas finamente elaboradas! Traje dos conmigo, así que puedes tomar la que prefieras.
actors.mobs.npcs.wandmaker.reminder_dust=¿Has tenido suerte con el polvo cadavérico, %s? Busca barricadas.
actors.mobs.npcs.wandmaker.reminder_ember=¿Has tenido suerte con esas ascuas, %s? Necesitarás encontrar cuatro velas y el lugar para el ritual.
actors.mobs.npcs.wandmaker.reminder_berry=¿Has tenido suerte con la semilla de Putrebaya, %s? Busca una habitación llena de vegetación. ¡Oh, me salió verso!
actors.mobs.npcs.wandmaker.def_verb=bloqueado
actors.mobs.npcs.wandmaker.desc=El viejo pero aún sano caballero tiene una expresión un tanto confundida. Está protegido por un escudo mágico.



###mobs
actors.mobs.acidic.name=escorpión ácido
actors.mobs.acidic.desc=Estas enormes criaturas demoníacas de apariencia arácnida evitan el combate cercano, prefiriendo disparar espinas serradas e incapacitantes desde largas distancias. Esta parece estar goteando cieno corrosivo.

actors.mobs.albino.name=rata albina
actors.mobs.albino.desc=Esta es una rara raza de rata marsupial, con pelaje puramente blanco y dientes ásperos.

actors.mobs.armoredstatue.name=estatua blindada
actors.mobs.armoredstatue.desc=Pensarás que sólo es otra de las estatuas inanimadas de esta mazmorra, pero sus ojos rojos y brillantes la delatan.\n\nParece que está en estupendas condiciones por la armadura que lleva, puede que sea muy difícil de matar.
actors.mobs.armoredstatue.desc_arm_wep=Aunque la estatua en sí está hecha de piedra, su _%1$s_ y _%2$s_ que lleva parecen reales

actors.mobs.bandit.name=bandido loco

actors.mobs.bat.name=murciélago vampiro
actors.mobs.bat.desc=Estos energéticos y tenaces habitantes de las cuevas son mucho más peligrosos de lo que parecen. Ellos reponen su salud con cada ataque exitoso, lo cual les permite derrotar oponentes mucho más grandes.

actors.mobs.bee.name=abeja dorada
actors.mobs.bee.desc_honey=A pesar de su pequeño tamaño, las abejas doradas tienden a proteger su hogar ferozmente. Ésta ha sido aplacada, y parece querer seguirte.
actors.mobs.bee.desc=Aún siendo pequeñas, las abejas doradas tienden a proteger su casa fieramente. Esta está muy enojada, mejor quédate a distancia.

actors.mobs.brute.name=gnoll fiero
actors.mobs.brute.enraged=enfurecido
actors.mobs.brute.def_verb=bloqueado
actors.mobs.brute.desc=Los fieros son los más grandes, fuertes y resistentes de todos los gnolls. Cuando están heridos de gravedad, se ponen frenéticos, ganando temporalmente blindaje y un gran incremento al daño.
actors.mobs.brute$bruterage.name=furia fiera
actors.mobs.brute$bruterage.desc=Este gnoll fiero está muriendo, ¡pero quiere llevarte con él!\n\nEl fiero morirá cuando su blindaje desaparezca, ya sea por tiempo o si es dañado. Mientras tanto, infligirá daño inmensamente incrementado, ¡así que ten cuidado!\n\nEscudo restante: %d.

actors.mobs.causticslime.name=slime cáustico
actors.mobs.causticslime.desc=Este slime parece haber sido contaminado por la magia oscura que emana de abajo. Ha perdido su color verde habitual y gotea cieno cáustico.

actors.mobs.crab.name=cangrejo de alcantarilla
actors.mobs.crab.desc=Estos enormes cangrejos están al tope de la cadena alimenticia en las alcantarillas. Son extremadamente rápidos y su grueso caparazón puede soportar golpes fuertes.

actors.mobs.crystalguardian.name=guardia de cristal
actors.mobs.crystalguardian.def_verb=bloqueado
actors.mobs.crystalguardian.desc=Estos grandes guardias cristalinos casi parecen estatuas, si no fuera por sus brillantes ojos resplandecientes. El cristal endurecido del que están hechos los hace lentos pero muy resistentes, así que _es mejor dejarlos dormir en su nido de cristal el mayor tiempo posible._\n\nDebido a su tamaño, los guardias de cristal se moverán mucho más despacio en espacios cerrados. Además son tan resistentes que es imposible matarlos directamente. Se les puede derrotar e incapacitar temporalmente, pero volverán a levantarse al poco tiempo.

actors.mobs.crystalmimic.name=mímico de cristal
actors.mobs.crystalmimic.ate=¡El mímico se comió tu %s!
actors.mobs.crystalmimic.escaped=¡El mímico de cristal ha escapado!
actors.mobs.crystalmimic.desc=Los mímicos son criaturas mágicas que pueden tomar la forma que deseen. En mazmorras casi siempre eligen la forma de un cofre del tesoro, para atraer a aventureros desprevenidos.\n\nLos mímicos de cristal son más astutos que sus primos habituales, y prefieren evitar conflictos mientras roban un botín. Ellos intentarán huir una vez descubiertos, y tienen la habilidad de reposicionar enemigos cuando atacan.

actors.mobs.crystalspire.name=obelisco de cristal
actors.mobs.crystalspire.warning=El cristal vibra cuando lo golpeas. Si continúas haciéndolo, llamarás la atención...
actors.mobs.crystalspire.alert=¡La vibración aumenta y retumba por toda la cueva!
actors.mobs.crystalspire.desc=Este gigantesco obelisco de cristal súper duro es probablemente el origen de todas las extrañas criaturas cristalinas de esta cueva. Tus armas normales son ineficaces contra él, así que tendrás que usar tu pico si quieres destruirlo.\n\n_Asegúrate de estar preparado antes de empezar a romperlo._ Es probable que te lleve un tiempo minar un cristal tan grande, y probablemente no lo harás sin ser interrumpido. Es posible que el obelisco tenga algún medio de defensa. _Tal vez sus ataques podrían usarse contra sus propios esbirros._

actors.mobs.crystalwisp.name=fragmento de cristal
actors.mobs.crystalwisp.beam_kill=El rayo de luz te ha matado...
actors.mobs.crystalwisp.desc=Un pequeño trozo flotante y furioso de cristal endurecido que produce un resplandor brillante. Aunque no son especialmente potentes, los fragmentos de cristal te dispararán un rayo de luz dañino si estás en su campo de visión.\n\nLos fragmentos son lo bastante pequeños como para moverse con facilidad por los distintos afloramientos de cristal, pero no pueden disparar a través de ellos.

actors.mobs.demonspawner.name=invocador de demonios
actors.mobs.demonspawner.on_death=La energía demónica aquí parece disminuir al morir el invocador.
actors.mobs.demonspawner.desc=Esta retorcida amalgama de carne de enano es responsable de transformar en demonios destripadores a los enanos que murieron en esta región. Obviamente los demonios no ven problema en utilizar cualquier recurso que puedan contra sus enemigos.\n\nAunque se vean aterradores, los invocadores de demonios no tienen medios para moverse o defenderse por sí mismos. En cualquier caso, su considerable masa les hace difíciles de matar rápidamente e invocarán demonios destripadores más rápidamente cuando se sienten amenazados.\n\n_Los invocadores de demonios parecen estar conectados a alguna fuente central de poder demoníaco. Matarles podría debilitarlo._

actors.mobs.dm100.name=DM-100
actors.mobs.dm100.zap_kill=El relámpago te mató...
actors.mobs.dm100.desc=El DM-100 es un modelo inicial de 'máquina defensiva' enana que fue diseñado para proteger a los enanos mineros en las cuevas debajo de esta prisión. Sin embargo, sus descargas eléctricas demostraron ser muy débiles, por lo que fueron obsequiadas a la ciudad humana de la superficie. No se utilizaron durante años y acabaron llegando a la prisión, donde el director las consideró inicialmente demasiado crueles para su uso. Sin embargo, a medida que los presos se volvían más revoltosos, se convirtieron en una necesidad

actors.mobs.dm200.name=DM-200
actors.mobs.dm200.vent=¡El DM-200 dispara un chorro de gas tóxico!
actors.mobs.dm200.desc=El DM-200 es la segunda generación de 'máquina defensiva' enana que fue diseñado para proteger a los enanos mineros en las cuevas y la ciudad de abajo. Son mucho más grandes y pesados que sus predecesores, y atacan con devastadores puños hidráulicos.\n\nSu tamaño incrementado es también su mayor debilidad, ya que son incapaces de pasar a través de los estrechos túneles y entradas de la mazmorra. Los enanos fueron capaces de compensar la falta de movilidad en los DM-200 permitiéndoles expulsar sus desechos tóxicos hacia enemigos distantes, o enemigos a los que no puedan llegar.

actors.mobs.dm201.name=DM-201
actors.mobs.dm201.vent=¡DM-201 lanza una granada corrosiva!
actors.mobs.dm201.desc=Los enanos experimentaron recientemente enfatizando más en la falta de movilidad del DM-200 y crearon algunos modelos DM que son completamente estacionarios. El DM-201 es un DM-200 reconvertido que actúa como una torreta centinela sin capacidad de movimiento. A cambio de la falta de movilidad, los DM-201 tienen significativamente más durabilidad y poder de ataque.\n\nComo los DM-201 no tienen motores para ventilar el humo, en su lugar,  ¡los enanos los equiparon con granadas de gas corrosivo! En cualquier caso, los DM-201 son cuidadosos con esas granadas, y solo las lanzarán cuando sean atacados a distancia.

actors.mobs.dm300.name=DM-300
actors.mobs.dm300.notice=¡PERSONAL NO AUTORIZADO DETECTADO!
actors.mobs.dm300.shield=¡DM-300 extrae poder de los cables expuestos y se protege a sí mismo!
actors.mobs.dm300.charging=¡RETENIENDO DAÑO! ¡ACTIVANDO TORRE DE ENERGÍA!
actors.mobs.dm300.charging_hint=¡DM-300 es invulnerable mientras está siendo energizado por una torre de energía!
actors.mobs.dm300.supercharged=¡DESTRUIR! ¡DESTRUIR! ¡DESTRUIR!
actors.mobs.dm300.charge_lost=¡TORRE DE ENERGÍA DESTRUIDA! ¡REVIRTIENDO A PODER LOCAL!
actors.mobs.dm300.pylons_destroyed=¡ALERTA! ¡INESTABILIDAD DETECTADA EN RED DE ENERGÍA!
actors.mobs.dm300.rankings_desc=Aplastado por el DM-300
actors.mobs.dm300.def_verb=bloqueado
actors.mobs.dm300.defeated=¡DAÑO CRÍTICO! INTENTANDO APAGA-
actors.mobs.dm300.desc=DM-300 es la más grande y poderosa 'máquina defensiva' que los enanos jamás hayan creado. Una máquina tan asombrosa es difícil de manufacturar, por lo que los enanos solo construyeron unas pocas para proteger las entradas a su metrópolis subterránea.\n\nEstá equipada con válvulas para expulsar sus desechos tóxicos y un taladro de alta potencia que puede usar tanto para atacar como para quebrantar la tierra. DM-300 también puede conectarse a una red de energía, incrementando aún más su potencia.
actors.mobs.dm300.desc_supercharged=DM-300 se encuentra completamente cargado de energía eléctrica. En esta forma el DM-300 no puede ser dañado ¡y se mueve al doble de velocidad! Adicionalmente, su taladro ahora gira lo suficientemente rápido como para _perforar a través de la roca sólida._ Sin embargo, se mueve mucho más lento cuando hace esto.\n\nAtacar al DM-300 directamente es inútil mientras se encuentra sobrealimentado, pero _algo en el área debe estar proporcionándole esta energía._ Destruir eso puede que lo debilite.

actors.mobs.dwarfking.name=Rey de los Enanos
actors.mobs.dwarfking.notice=¡Cómo te atrevés! ¡No tienes ni idea de lo que estás interrumpiendo!
actors.mobs.dwarfking.lifelink_1=¡Necesito tu esencia, esclavo!
actors.mobs.dwarfking.lifelink_2=¡Sangra para mí, esclavo!
actors.mobs.dwarfking.teleport_1=¡Encárgate de ellos, esclavo!
actors.mobs.dwarfking.teleport_2=¡Mantenlo ocupado, esclavo!
actors.mobs.dwarfking.wave_1=¡Suficiente! ¡Surjan mis esclavos!
actors.mobs.dwarfking.wave_2=¡Más! ¡Sangren por su rey!
actors.mobs.dwarfking.wave_3=¡Inútiles! ¡MÁTENLO AHORA!
actors.mobs.dwarfking.enraged=No puedes matarme %s. ¡YO. SOY. INMORTAL!
actors.mobs.dwarfking.losing=¡No! No puedes hacer eso... no tienes ni idea de lo que hay debajo...
actors.mobs.dwarfking.defeated=Tú... nos has condenado a todos...
actors.mobs.dwarfking.rankings_desc=Caído Ante el Rey de los Enanos.
actors.mobs.dwarfking.desc=Hace mucho tiempo uno de los mayores magos de la corte de los enanos descubrió secretos que le dieron un tremendo poder sobre la vida y la muerte. Pronto puso su poder a prueba, dominando y corrompiendo a sus compañeros, su rey y finalmente a cada ciudadano enano. Ahora él es rey, gobernante de una legión de no-muertos.\n\nEl Rey de los Enanos es un enemigo agresivo, que intentará rodear y arrollar a sus enemigos con su horda de subordinados no-muertos.
actors.mobs.dwarfking$dkghoul.rankings_desc=Caído Ante el Rey de los Enanos.
actors.mobs.dwarfking$dkmonk.rankings_desc=Caído Ante el Rey de los Enanos.
actors.mobs.dwarfking$dkwarlock.rankings_desc=Caído Ante el Rey de los Enanos.
actors.mobs.dwarfking$dkgolem.rankings_desc=Caído Ante el Rey de los Enanos.

actors.mobs.ebonymimic.name=mímico de ébano
actors.mobs.ebonymimic.reveal=¡Ahí había un mímico!
actors.mobs.ebonymimic.hidden_name=contorno sospechoso
actors.mobs.ebonymimic.hidden_desc=Parece que hay algo aquí, pero es casi totalmente transparente.
actors.mobs.ebonymimic.desc=Los mímicos son criaturas mágicas que pueden tomar la forma que deseen. En mazmorras casi siempre eligen la forma de un cofre del tesoro, para atraer a aventureros desprevenidos.\n\nLos mímicos de ébano son mímicos extremadamente resistentes con la capacidad de hacerse casi invisibles. Acechan en cosas en las que es probable que interactúen los aventureros, pero también contienen botín dentro de ellos.

actors.mobs.elemental$fireelemental.name=elemental de fuego
actors.mobs.elemental$fireelemental.desc=Los elementales son criaturas caóticas que usualmente se crean cuando poderosa magia oculta es indebidamente controlada. Los elementales tienen mínima inteligencia, y son comúnmente asociados con un tipo de magia en particular.\n\nLos elementales de fuego son un tipo común de elemental que inflige daño con magia ardiente. Prenderán en llamas a sus objetivos con ataques cuerpo a cuerpo, además de poder disparar bolas de fuego ocasionalmente.
actors.mobs.elemental$newbornfireelemental.name=cría elemental de fuego
actors.mobs.elemental$newbornfireelemental.charging=¡El elemental se está recargando!
actors.mobs.elemental$newbornfireelemental.desc=Los elementales son criaturas caóticas que usualmente se crean cuando poderosa magia oculta es indebidamente controlada. Los elementales tienen mínima inteligencia, y son comúnmente asociados con un tipo de magia en particular.\n\nAunque este elemental de fuego apenas ha sido invocado, ¡es bastante peligroso!
actors.mobs.elemental$newbornfireelemental.desc_boss=Debido a la caótica naturaleza de su invocación, este elemental sólo puede esparcir fuego en disparos imprecisos tras recargarse durante un turno.
actors.mobs.elemental$newbornfireelemental.desc_ally=Como este elemental fue invocado por un hechizo, tiene un poco más de control sobre su llama. Es incapaz de realizar ataques a distancia, pero prenderá fuego a los enemigos a los que ataque cuerpo a cuerpo.
actors.mobs.elemental$frostelemental.name=elemental de hielo
actors.mobs.elemental$frostelemental.desc=Los elementales son criaturas caóticas que usualmente se crean cuando poderosa magia oculta es indebidamente controlada. Los elementales tienen mínima inteligencia, y son comúnmente asociados con un tipo de magia en particular.\n\nLos elementales de hielo son un tipo común de elemental que debilita a sus enemigos con magia enfriante. Enfriarán a sus objetivos con ataques cuerpo a cuerpo y ataques a distancia ocasionales. Su magia es mucho más efectiva en el agua.
actors.mobs.elemental$shockelemental.name=elemental eléctrico
actors.mobs.elemental$shockelemental.desc=Los elementales son unas criaturas caóticas, frecuentemente creados cuando una poderosa magia sobrenatural no se controla debidamente. Su inteligencia es mínima, y normalmente están asociados a un tipo de magia en concreto.\n\nLos elementales eléctricos son un tipo de elemental poco frecuente que aturde a sus enemigos mediante electricidad y rayos de luz. En cuerpo a cuerpo, rodearán con electricidad a enemigos cercanos, causando daño adicional a su objetivo principal si este se encuentra en el agua. Ocasionalmente, también concentrarán una explosión de luz a distancia hacia un único objetivo, cegándolo temporalmente.
actors.mobs.elemental$chaoselemental.name=elemental del caos
actors.mobs.elemental$chaoselemental.desc=Los elementales son unas criaturas caóticas, frecuentemente creados cuando una poderosa magia sobrenatural no se controla debidamente. Su inteligencia es mínima, y normalmente están asociados a un tipo de magia en concreto.\n\nLos elementales caóticos son elementales raros y peligrosos que no se han estabilizado a ningún elemento en particular. Desatarán magia salvaje e impredecible al atacar.

actors.mobs.eye.name=ojo del mal
actors.mobs.eye.deathgaze_kill=La mirada de la muerte te asesinó...
actors.mobs.eye.desc=Los Ojos Malignos son esferas flotantes de energía demoníaca reprimida. Aunque son capaces de combatir cuerpo a cuerpo, su verdadera fuerza proviene de su magia.\n\nDespués de acumular energía por un corto tiempo, el Ojo Maligno desatará un rayo devastador de energía llamado _mirada de la muerte._ Cualquier cosa dentro del rango de visión del Ojo Maligno, sufrirá un daño tremendo, los aventureros sabios correrán a esconderse.

actors.mobs.fetidrat.name=rata fétida
actors.mobs.fetidrat.desc=Definitivamente algo anda mal con esta rata. Su grasiento pelaje negro y piel putrefacta son muy diferentes de las ratas sanas que has visto anteriormente. Sus pálidos ojos verdes la hacen parecer especialmente amenazante.\n\nLa rata lleva consigo una nube de terrible hedor, es abrumador de cerca.\n\nCieno oscuro gotea de su boca derritiendo el suelo pero parece disolverse en agua.

actors.mobs.fungalcore.name=núcleo fúngico
actors.mobs.fungalcore.desc=Este gigantesco hongo debe ser la fuente de toda la actividad fúngica en esta cueva.

actors.mobs.fungalsentry.name=centinela fúngico
actors.mobs.fungalsentry.desc=Este hongo especialmente alto actúa como un punto de defensa de una gran red fúngica que vive en esta cueva.\n\nEs inmóvil, pero disparará ráfagas precisas de veneno a cualquier cosa que se encuentre dentro de su campo de visión. Si bien el impacto de estas ráfagas es bastante débil, _pueden acumular cantidades mortales de veneno muy rápidamente._ Aunque se puede matar, probablemente sea mejor evitarlo.

actors.mobs.fungalspinner.name=rueda cuevas fúngico
actors.mobs.fungalspinner.desc=Este rueda cuevas parece estar controlado por un hongo parásito. El hongo también ha cambiado sus habilidades, sustituyendo su telaraña y sacos de veneno por crecimiento fúngico.\n\nEl rueda cuevas fúngico te escupirá vida vegetal en lugar de telarañas, esparciendo vegetación fúngica y posiblemente enraizándote. Aunque no puede envenenar, este ganará una gran resistencia al daño si se encuentra junto a hongos.

actors.mobs.ghoul.name=enano necrófago
actors.mobs.ghoul.desc=Como sociedad enana comenzaron lentamente a desmoronarse, y el actual rey de los enanos se apoderó del poder absoluto, aquellos que eran débiles o que se le resistían no eran tratados bien. A medida que el rey se volvía más experto en el uso de la magia negra, manejaba a esos enanos a su voluntad, y ahora ellos son la infantería de su ejército.\n\nLos necrófagos no son especialmente fuertes por sí mismos, pero siempre viajan en grupos y son mucho más difíciles de matar en multitud. _Cuando un necrófago es abatido, se levantará de nuevo unos turnos después si hay otro necrófago cerca._

actors.mobs.gnoll.name=gnoll explorador
actors.mobs.gnoll.desc=Los gnolls son humanoides parecidos a las hienas. Se encuentran en las alcantarillas y las mazmorras, aventurándose a la superficie de vez en cuando. Los exploradores gnoll son miembros regulares de su manada, no son tan fuertes como los fieros ni tan inteligentes como los chamanes.

actors.mobs.gnollgeomancer.name=gnoll geomancer
actors.mobs.gnollgeomancer.warning=El geomancer comienza a moverse. ¡Asegúrate de estar listo antes de continuar!
actors.mobs.gnollgeomancer.alert=¡El geomancer despierta! ¡Toda la cueva parece moverse mientras este se aleja dando saltos y riendo a carcajadas!
actors.mobs.gnollgeomancer.rock_kill=La roca voladora te mató...
actors.mobs.gnollgeomancer.rockfall_kill=El desprendimiento de rocas te mató...
actors.mobs.gnollgeomancer.desc=Este gnoll superior impresionantemente alto debe ser la fuente de las diversas magias de desplazamiento de tierras que hay por aquí y el organizador de toda la actividad gnoll. A diferencia de los gnoll planeadores de la zona, el geomancer es bastante hábil con su magia y no puede sufrir daños por el arrojamiento o derrumbe de rocas. Sin embargo, no tiene ninguna forma de luchar en combate cuerpo a cuerpo.
actors.mobs.gnollgeomancer.desc_armor=El geomancer está actualmente envuelto en una capa de armadura de roca. _Tendrás que acercarte y romperla con tu pico antes de que puedas dañar al geomancer._
actors.mobs.gnollgeomancer.desc_armor_sapper=_Un gnoll planeador cercano sostiene un dispositivo que potencia la armadura de roca del geomancer. ¡No podrás dañarlo en absoluto ahora mismo!_
actors.mobs.gnollgeomancer.desc_sleeping=Este chamán gnoll de impresionante altura está rodeado por una capa de roca y casi parece una estatua. Mirando de cerca puedes ver la roca moverse mágicamente al ritmo de la respiración del gnoll superior. No puede sufrir daño mientras está envuelto en roca, y parece estar disfrutando de una siesta.\n\nProbablemente puedas atravesar las capas de roca con tu pico, pero asegúrate de estar listo para una pelea en cuanto lo hagas. El geomancer debe ser la fuente de las diversas magias de desplazamiento de tierras que hay por aquí, y el organizador de todas la actividad gnoll. _Derrotar a los gnolls de los alrededores antes de luchar contra él podría ser una buena idea._

actors.mobs.gnollguard.name=guardia gnoll
actors.mobs.gnollguard.spear_warn=¡El Gnoll asesta un golpe brutal con la punta de su lanza!
actors.mobs.gnollguard.desc=Un enorme gnoll de aspecto feroz blandiendo una lanza y un escudo, aunque no lleva casco. Estos guardias son probablemente brutos en entrenamiento, forzados a ayudar a proteger la mina de la invasión de animales silvestres.\n\nEl guardia gnoll es lo suficientemente fuerte como para llevar la lanza con una sola mano, aunque no puede usarla del todo bien. _Necesitará algo de espacio abierto para realizar ataques a distancia y te causará notablemente menos daño si estás cerca de él._
actors.mobs.gnollguard.desc_armor=_Un gnoll planeador cercano sostiene un dispositivo que le otorga a este guardia una armadura de tierra, reduciendo considerablemente el daño que recibe._

actors.mobs.gnollsapper.name= gnoll planeador
actors.mobs.gnollsapper.desc=Un gnoll pequeño y débil pero inteligente con pelaje pálido y una cartera llena de varios artilugios. Es probable que estén aquí para ayudar con la prospección y extracción de oro oscuro, y que tengan un guardia cerca como protección. Son capaces de luchar, pero sus ataques son terriblemente débiles, no más fuertes que los de un explorador gnoll.\n\nEn lugar de luchar directamente, los planeadores prefieren utilizar los distintos dispositivos que tienen para hacer que el entorno rocoso ataque por ellos. Sin embargo, estos no conocen la magia de desplazamiento de tierras, por lo que es muy probable que usen sus dispositivos de manera imprudente. _Debería haber muchas maneras de usar sus ataques contra sí mismos, o contra sus guardias._

actors.mobs.gnolltrickster.name=gnoll embaucador
actors.mobs.gnolltrickster.desc=Una criatura con aspecto extraño, incluso para ser un gnoll. Se acerca con una malvada sonrisa,  casi sosteniendo la bolsa colgando sobre sus hombros. Sus ojos son anchos con una extraña mezcla de miedo y emoción.\n\nHay una enorme colección de dardos mal hechos en su bolsa, todos parecen estar tipados con diversas sustancias dañinas.

actors.mobs.goldenmimic.name=mímico de oro
actors.mobs.goldenmimic.desc=Los mímicos son criaturas mágicas que pueden tomar cualquier forma que deseen. En las mazmorras, casi siempre eligen la apariencia de un cofre del tesoro, para atraer a aventureros desprevenidos.\n\nLos mímicos de oro son mímicos más duros que intentan atraer a los aventureros más fuertes. Tienen mejor botín, pero son mucho más fuertes que los mímicos normales.

actors.mobs.golem.name=golem
actors.mobs.golem.def_verb=bloqueado
actors.mobs.golem.desc=Los golems son un intento de corregir los defectos anteriores en la maquinaria enana a través del uso de magia recién descubierta por los enanos. Son mucho más compactos y eficientes comparados al DM-300, siendo aún igual de letales.\n\nSi bien los golems siguen siendo demasiado grandes para caber en pasillos, los enanos les han dado nuevas habilidades mágicas para compensar. Los golems pueden teletransportarse entre habitaciones y teletransportar a sus enemigos hacia ellos cuando estos están fuera de su alcance.

actors.mobs.goo.name=Gú
actors.mobs.goo.notice=¡GLURP-GLURP!
actors.mobs.goo.defeated=glurp... glurp...
actors.mobs.goo.!!!=!!!
actors.mobs.goo.pumpup=¡Gú se está bombeando a sí mismo!
actors.mobs.goo.enraged=enfurecido
actors.mobs.goo.gluuurp=¡GLUUUURP!
actors.mobs.goo.rankings_desc=Absorbido por el Gú
actors.mobs.goo.desc=Poco se sabe sobre El Gú. Es posible que no sea siquiera una criatura, sino un conglomerado de sustancias viles de las alcantarillas que de alguna manera ganó inteligencia básica. A pesar de esto, la magia oscura es ciertamente lo que ha dejado a Gú existir.\n\nSu naturaleza gelatinosa lo deja absorber un montón de energía negra, y sientes un escalofrío de solo estar cerca. si Gú puede atacarte con esta energía, no viviras por mucho.

actors.mobs.goldengoo.name=Limo Dorado
actors.mobs.goldengoo.notice=¡GLURP-DORADO!
actors.mobs.goldengoo.defeated=glurp... brillo...
actors.mobs.goldengoo.!!!=!!!
actors.mobs.goldengoo.pumpup=¡El Limo Dorado está cargando fulgor dorado!
actors.mobs.goldengoo.enraged=furia radiante
actors.mobs.goldengoo.gluuurp=¡GLUUUURP DORADO!
actors.mobs.goldengoo.rankings_desc=Absorbido por el Limo Dorado
actors.mobs.goldengoo.desc=Una variante mítica y radiante del Limo. Infundido con esencia pura de oro, ¡derrotarlo concede riqueza mística para tu clase!
actors.mobs.goldengoo.reward=¡El Limo Dorado soltó un radiante +4 %s!

actors.mobs.greatcrab.name=gran cangrejo
actors.mobs.greatcrab.noticed=El cangrejo bloquea con su enorme pinza.
actors.mobs.greatcrab.def_verb=bloqueado
actors.mobs.greatcrab.desc=Este cangrejo es enorme, incluso en comparación con otros cangrejos de alcantarilla. Su caparazón azúl está recubierto de grietas y percebes, demostrando su vejez. Tambalea despacio, apenas logrando balance con su enorme pinza.\n\nAún teniendo solo una pinza, su tamaño compensa fácilmente. El cangrejo pone su pinza en frente de cualquier amenaza, escudándose a sí mismo detrás de una impenetrable pared de caparazón. Sin embargo no puede bloquear ataques que no ve venir o si recibe ataques de múltiples enemigos al mismo tiempo.

actors.mobs.guard.name=guardia de prisión
actors.mobs.guard.scorpion=¡Ven aquí!
actors.mobs.guard.def_verb=bloqueado
actors.mobs.guard.desc=Alguna vez custodios de la prisión, estos guardias ya hace mucho tiempo no se diferencian de los prisioneros. Arrastrando sus pies como zombis, deambulan por los pasillos en busca de algo fuera de lugar, ¡como tú!\n\nLlevan cadenas alrededor de su cadera, posiblemente utilizadas para atraer a los enemigos a corta distancia.

actors.mobs.mimic.name=mímico
actors.mobs.mimic.reveal=¡Este cofre es un mímico!
actors.mobs.mimic.hidden_hint=Algo sobre este cofre no pinta bien... Ir y tratar de abrirlo puede que sea una mala idea.
actors.mobs.mimic.desc=Los mímicos son criaturas mágicas que pueden tomar cualquier forma que deseen. En las mazmorras, casi siempre eligen la apariencia de un cofre del tesoro, para atraer a aventureros desprevenidos.\n\nLos mímicos tienen una mordedura desagradable, pero suelen contener mejor tesoro que un cofre normal.

actors.mobs.necromancer.name=nigromante
actors.mobs.necromancer.desc=Estos aprendices de magos oscuros han acudido en masa a la prisión, ya que es el lugar perfecto para practicar su arte maligno.\n\nLos nigromantes convocarán y empoderarán a los esqueletos para que luchen por ellos. Matar al nigromante también matará al esqueleto que invoca.
actors.mobs.necromancer$necroskeleton.name=esqueleto de nigromante
actors.mobs.necromancer$necroskeleton.desc=Este esqueleto ha sido convocado por un nigromante. Se comporta como un esqueleto normal y morirá cuando el nigromante que lo invocó sea asesinado.

actors.mobs.mob.died=Oyes a lo lejos que algo muere.
actors.mobs.mob.rage=^%$#
actors.mobs.mob.rankings_desc=Matado por: %s

actors.mobs.monk.name=enano monje
actors.mobs.monk.def_verb=bloqueado
actors.mobs.monk.parried=desviado
actors.mobs.monk.desc=Estos monjes son fanáticos, que se han dedicado a proteger a su rey a través del poder físico. Su devoción es tan grande que han entregado totalmente sus mentes a su rey, y ahora vagan la ciudad enana como zombies inconscientes.\n\nLos monjes confían únicamente en el arte del combate cuerpo a cuerpo, y son capaces de usar sus puños desarmados tanto ofensiva como defensivamente. Cuando se concentran, los monjes detendrán el próximo ataque físico que reciban, aunque su precisión esté garantizada. Los monjes se concentrarán más rápidamente mientras estén en movimiento, y más lentamente cuando estén en combate directo.
actors.mobs.monk$focus.name=enfocado
actors.mobs.monk$focus.desc=Este monje está perfectamente concentrado en su objetivo, y parece estar anticipando sus movimientos antes de que los ejecuten.\n\nMientras está concentrado, el próximo ataque físico que reciba fallará, sin importar las circunstancias. Esto gastará la concentración del monje, y tendrá que volver a concentrarse para bloquear otro ataque. Los monjes se concentran más rápidamente mientras están en movimiento.

actors.mobs.phantompiranha.name=piraña fantasma
actors.mobs.phantompiranha.teleport_away=La piraña fantasma se teletransporta...
actors.mobs.phantompiranha.desc=Las pirañas fantasma son una raza rara de pirañas con habilidades mágicas y espeluznantes cuerpos translúcidos. ¡Son capaces de teletransportarse mientras son atacadas, ya sea para escapar o para acercarse rápidamente a su enemigo!\n\nSi bien son molestas para pelear, su carne es apreciada por sus propiedades mágicas.

actors.mobs.piranha.name=piraña gigante
actors.mobs.piranha.desc=Estos peces carnívoros no son habitantes naturales de los lagos subterráneos. Fueron criados específicamente para proteger cámaras del tesoro inundadas.

actors.mobs.pylon.name=torre de energía
actors.mobs.pylon.desc_inactive=Una torre de energía, destinada a ayudar a regular la electricidad que alimenta la maquinaria de esta zona.\n\nEsta torre está inactiva actualmente, por lo que es inmune al daño.
actors.mobs.pylon.desc_active=Una torre de energía, destinada a ayudar a regular la electricidad que alimenta la maquinaria de esta zona. Esta torre está desbordando energía eléctrica, ¡esto debe ser lo que sobrealimenta al DM-300!\n\nEn este estado las torres son vulnerables, pero arquearán electricidad a las casillas cercanas en el sentido de las agujas del reloj. Debido a que están construidas con metal pesado, las torres son resistentes a grandes cantidades de daño.

actors.mobs.rat.name=rata marsupial
actors.mobs.rat.desc=Las ratas marsupiales son agresivas pero débiles habitantes de las alcantarillas. Tienen una mordida asquerosa, pero solo ponen en peligro la vida en grandes cantidades.

actors.mobs.ripperdemon.name=demonio destripador
actors.mobs.ripperdemon.leap=¡El demonio destripador se prepara para saltar!
actors.mobs.ripperdemon.desc=Estas horribles criaturas son el resultado de los muchos cadáveres enanos en esta región que están siendo utilizados por las fuerzas demoníacas. Los destripadores son criaturas macabras y demacradas que se parecen a enanos, pero con cuerpos quebrantados y largas garras afiladas hechas de huesos.\n\nLos demonios destripadores no son particularmente duraderos, pero son ágiles y peligrosos. Son capaces de saltar grandes distancias para alcanzar rápidamente los objetivos antes de atacarlos con sus garras.

actors.mobs.rotheart.name=corazón podrido
actors.mobs.rotheart.desc=La fruta de Putrebaya es única. En vez de podrirse y dar nutrientes, la fruta crece, se endurece, y protege la semilla. Da protección a los órganos internos que crecen dentro de la fruta. Se dice que ésta enorme esfera es el corazón de una planta de rotberry adulta.

actors.mobs.rotlasher.name=látigo de vid podrido
actors.mobs.rotlasher.desc=El látigo de vid podrido es parte del sistema de raíces de una planta de putrebaya madura, y también su medio de defensa principal. Los látigos de vid son ciegos y están arraigados al suelo, pero atacarán violentamente a cualquier amenaza cercana tras tomarse un tiempo para detectarla. Cuando no hay enemigos cerca, permanecen inmóviles, intentando camuflarse en la vegetación que les rodea.

actors.mobs.scorpio.name=escorpión
actors.mobs.scorpio.desc=Estas criaturas arácnidas gigantes demoníacas evitan el combate cercano, prefiriendo disparar espinas dentadas desde una larga distancia.

actors.mobs.senior.name=monje mayor
actors.mobs.senior.desc=Estos monjes son fanáticos, que se han dedicado a proteger a su rey a través del poder físico. Su devoción es tan grande que han entregado totalmente sus mentes a su rey, y ahora vagan la ciudad enana como zombies inconscientes.\n\nEste monje ha perfeccionado el arte del combate cuerpo a cuerpo, y es capaz de concentrarse mientras se mueve mucho más rapido que los monjes normales. Cuando se concentran, los monjes detendrán el próximo ataque físico que reciban, aunque su precisión esté garantizada. Los monjes se concentrarán más rápidamente mientras estén en movimiento, y más lentamente cuando estén en combate directo.

actors.mobs.shaman.name=gnoll chamán
actors.mobs.shaman.bolt_kill=El rayo mágico te ha matado...
actors.mobs.shaman.desc=Los gnoll chamanes son gnolls inteligentes que usan hechizos de batalla para compensar su falta de fuerza. Tienen una posición muy respetada en la sociedad gnoll, a pesar de ser más débiles.
actors.mobs.shaman$redshaman.spell_desc=Este chamán está usando una máscara roja y usará magia que _debilita tu poder de ataque_ temporalmente.
actors.mobs.shaman$blueshaman.spell_desc=Este chamán está usando una máscara azul y usará magia que _incrementará el daño que recibas_ temporalmente.
actors.mobs.shaman$purpleshaman.spell_desc=Este chamán está usando una máscara morada y usará magia que _reduce tu precisión y evasión_ temporalmente.

actors.mobs.armoredbrute.name=fiero protegido
actors.mobs.armoredbrute.desc=Los gnolls fieros más veteranos suelen llevar una poderosa armadura para hacer gala de su estatus. La armadura les hace mucho más resistentes al daño físico, y su mayor disciplina significa que pueden enfurecerse por mucho más tiempo antes de sucumbir a sus heridas.

actors.mobs.skeleton.name=esqueleto
actors.mobs.skeleton.explo_kill=Fuiste asesinado por la explosión de huesos...
actors.mobs.skeleton.def_verb=bloqueado
actors.mobs.skeleton.desc=Los esqueletos se componen de huesos de aventureros desafortunados y habitantes de la prisión, animados por emanaciones de magia maligna desde las profundidades. Después de que han sido dañados lo suficiente, los esqueletos se desintegran en una explosión de huesos. Los fragmentos de esta explosión son dañinos contra todo lo que este cerca, aunque la armadura es muy efectiva en mitigar el daño.

actors.mobs.slime.name=slime
actors.mobs.slime.def_verb=bloqueado
actors.mobs.slime.desc=Los slimes son criaturas extrañas, ligeramente mágicas, con un cuerpo exterior de goma y un núcleo líquido. Las alcantarillas de la ciudad les proporcionan un amplio suministro de agua y nutrientes.\n\nDebido a su membrana externa elástica, es difícil hacer más de _6 de daño_ a los slimes con cualquier ataque.

actors.mobs.snake.name=serpiente de alcantarilla
actors.mobs.snake.hint=Prueba a usar el botón de examinar en una serpiente para aprender cómo contrarrestarlas.
actors.mobs.snake.desc=Estas serpientes de gran tamaño son capaces de deslizarse rápidamente alrededor de los golpes, lo que las hace bastante difíciles de golpear. Sin embargo, los ataques mágicos o los ataques sorpresa son capaces de atraparlas con la guardia baja.\n\nPuedes realizar un ataque sorpresa atacando mientras estás fuera de la visión de la serpiente. Una forma es dejar que una serpiente te persiga a través de una puerta y luego _atacarle justo después de que se mueva hacia la puerta._

actors.mobs.spectralnecromancer.name=nigromante espectral
actors.mobs.spectralnecromancer.desc=Si bien los esqueletos son el pan de cada día de un nigromante, algunos prefieren considerar con secuaces menos corpóreos. ¡Los nigromantes espectrales han elegido a los espectros como sus esbirros preferidos!\n\nLos espectros no son tan fuertes como los esqueletos por si solos, ¡pero estos nigromantes no temen invocar a muchos de ellos!

actors.mobs.spinner.name=rueda cuevas
actors.mobs.spinner.desc=Estas arañas de cueva peludas y verdosas intentan evitar el combate directo. En cambio, prefieren esperar a lo lejos mientras su víctima forcejea con su telaraña excretada, muriendo lentamente por su mordida venenosa. Son capaces de disparar sus redes a grandes distancias e intentarán bloquear cualquier camino que tome su presa.

actors.mobs.statue.name=estatua animada
actors.mobs.statue.def_verb=bloqueado
actors.mobs.statue.desc=Pensarás que sólo es otra de las estatuas inanimadas de esta mazmorra, pero sus ojos rojos y brillantes la delatan.
actors.mobs.statue.desc_weapon=Aunque la estatua en sí está hecha de piedra, su _%s_ parece real.

actors.mobs.succubus.name=súcubo
actors.mobs.succubus.desc=Los súcubos son demonios que cambian de forma y manipulan las mentes de su presa. Este ha tomado la forma de una humanoide gótica y pálida, ¿quizás para atraer a brujos enanos?\n\nLos súcubos pueden encantar temporalmente a sus enemigos cuando atacan, haciendo que su enemigo no pueda atacarlo directamente. Cuando atacan a un enemigo que ya está encantado, le robarán parte de su esencia vital.

actors.mobs.swarm.name=enjambre de moscas
actors.mobs.swarm.desc=El enjambre mortal de moscas zumba enojado. Cada ataque no mágico lo dividirá en dos enjambres más pequeños pero igualmente peligrosos.

actors.mobs.tengu.name=Tengu
actors.mobs.tengu.notice_gotcha=¡Te atrapé, %s!
actors.mobs.tengu.interesting=Hagamos esto más interesante...
actors.mobs.tengu.notice_have=¡Ahora sí te tengo, %s!
actors.mobs.tengu.defeated=Libre al fin...
actors.mobs.tengu.rankings_desc=Asesinado por Tengu
actors.mobs.tengu.desc=Un famoso y enigmático asesino, cuyo nombre se deriva de la máscara injertada a su cara.\n\nTengu está atrapado con grandes grilletes en sus muñecas y rodillas, aunque parece que se deshizo de sus cadenas hace mucho tiempo.\n\nIntentará usar trampas, magia engañosa y ataques precisos para eliminar lo único que evita su escape: tú.

actors.mobs.tengu$bombability$bombblob.desc=Una nube de humo sobrecalentado ondea aquí. ¡Cuidado, va a explotar!
actors.mobs.tengu$bombability$bombitem.name=Bomba de Humo
actors.mobs.tengu$bombability$bombitem.cant_pickup=Está pegado al suelo, ¡no puedes moverlo!
actors.mobs.tengu$bombability$bombitem.desc=Tengu ha arrojado una bomba de humo de aspecto extraño aquí, que despide un humo espeso y caliente. ¡Está haciendo un fuerte ruido de tictac, como si fuera una cuenta atrás para una explosión!\n\nLa bomba se ha anclado al suelo, por lo que no puedes levantarla.

actors.mobs.tengu$fireability$fireblob.desc=Tengu ha arrojado un polvo fino que parece estar atrapando vapor aquí, ¡está a punto de encenderse!

actors.mobs.tengu$shockerability$shockerblob.desc=Aquí se está acumulando energía eléctrica, ¡todo lo que se encuentre en esta casilla será electrocutado el próximo turno!
actors.mobs.tengu$shockerability$shockeritem.name=Shocker
actors.mobs.tengu$shockerability$shockeritem.cant_pickup=Está expulsando demasiada electricidad, ¡no puedes agarrarlo!
actors.mobs.tengu$shockerability$shockeritem.desc=Tengu ha lanzado un curioso aparato aquí, que parece estar hecho con partes del DM-100. El aparato arquea electricidad constantemente a su alrededor, pero parece seguir un patrón predecible.\n\nCon toda la electricidad que lo rodea, no hay forma de que puedas recoger esto.

actors.mobs.thief.name=ladrón loco
actors.mobs.thief.stole=¡El ladrón te robó %s!
actors.mobs.thief.carries=\n\nEl ladrón tiene una _%s._ Robado, obviamente.
actors.mobs.thief.escapes=¡El ladrón se escapa con tu %s!
actors.mobs.thief.desc=Aunque estos prisioneros escapen de sus celdas, este lugar sigue siendo su prisión. Con el tiempo, este lugar ha tomado tanto sus mentes como su libertad. Hace mucho, estos locos ladrones y bandidos han olvidado quiénes son y por qué roban.\n\nEstos enemigos son más propensos a robar y correr que a pelear. Asegúrate de mantenerlos a la vista, o podrías no volver a ver tu ítem robado jamás.

actors.mobs.tormentedspirit.name=espíritu atormentado
actors.mobs.tormentedspirit.desc=Los espíritus atormentados son espíritus bondadosos que han sido afligidos por una maldición. ¡Mientras estén malditos, atacarán tal como lo haría un espectro, aunque son más poderosos!\n\nPuede ser posible purificar la maldición usando el ítem correcto mientras estés al lado del espíritu. Si se quita la maldición el espíritu seguramente estará muy agradecido...
actors.mobs.tormentedspirit.thank_you=Gracias...

actors.mobs.warlock.name=enano brujo
actors.mobs.warlock.bolt_kill=La descarga de las sombras te mató...
actors.mobs.warlock.desc=A medida que los intereses de los enanos pasaron de la ingeniería a las artes arcanas, los brujos llegaron al poder en la ciudad. Comenzaron con magia elemental, pero pronto cambiaron a demonología y nigromancia. El más fuerte de estos brujos se apoderó del trono de la ciudad enana, y a sus cohortes se les permitió continuar practicando su magia oscura, siempre y cuando le entregaran su libre albedrío.\n\nEstos brujos poseen una poderosa magia disruptiva, y pueden deteriorar temporalmente la magia de mejora aplicada a tu equipamiento. Cuanto más mejorado esté un objeto, más fuertemente se verá afectado.

actors.mobs.wraith.name=espectro
actors.mobs.wraith.desc=Un espectro es un vengativo espíritu de un pecador, cuya tumba fue perturbada. Siendo una entidad etérea, es muy difícil golpearle con un arma regular.

actors.mobs.yogdzewa.name=Yog-Dzewa
actors.mobs.yogdzewa.notice=YO. TE. VEO.
actors.mobs.yogdzewa.darkness=La oscuridad se aproxima...
actors.mobs.yogdzewa.hope=TU. ESPERANZA. ES. UNA. ILUSIÓN.
actors.mobs.yogdzewa.defeated=...
actors.mobs.yogdzewa.rankings_desc=Devorado por Yog-Dzewa
actors.mobs.yogdzewa.desc=Yog-Dzewa es un dios Antiguo; una gran monstruosidad que llega a los mundos mortales y los devora para alimentar su ilimitado crecimiento. Los enanos deben haber atraído la atención de este terror cósmico mientras jugaban con magias oscuras, y han tratado de contenerlo desde entonces.\n\nYog-Dzewa procede de una dimensión de caos mágico en bruto, y no puede traer su auténtica forma a este mundo. En lugar de ello crea personificaciones y secuaces demoníacos invocados para hacer su voluntad aquí.\n\nEste ojo gigante es el punto focal del poder de Yog-Dzewa en este mundo. A pesar de que el propio ojo es inmóvil, es capaz de disparar poderosos rayos de magia demoníaca e invocar distintos secuaces para ayudarlo.
actors.mobs.yogdzewa.desc_spawners=Puedes sentir olas de energía demónica irradiando hacia el ojo desde los pisos superiores. Algo que quedó vivo arriba debe estar canalizando poder hacia Yog-Dzewa. _¡Yog utilizará esta energía para invocar secuaces más poderosos!_
actors.mobs.yogdzewa$larva.name=larva de dios
actors.mobs.yogdzewa$larva.rankings_desc=Devorado por Yog-Dzewa
actors.mobs.yogdzewa$larva.desc=Estos pequeños engendros de Yog-Dzewa son secuaces simples que son fáciles de producir. Aunque individualmente sean débiles, se invocan rápidamente y pueden volverse arrolladores en grandes cantidades.
actors.mobs.yogdzewa$yogripper.rankings_desc=Devorado por Yog-Dzewa
actors.mobs.yogdzewa$yogeye.rankings_desc=Devorado por Yog-Dzewa
actors.mobs.yogdzewa$yogscorpio.rankings_desc=Devorado por Yog-Dzewa

actors.mobs.yogfist.invuln_warn=¡El puño es invulnerable mientras esté cerca del ojo!
actors.mobs.yogfist.rankings_desc=Devorado por Yog-Dzewa
actors.mobs.yogfist.desc=Este puño es una faceta del poder de Yog-Dzewa. Los puños están unidos al poder de Yog-Dzewa, y estarán protegidos de todo daño mientras permanezcan cerca del ojo.
actors.mobs.yogfist$burningfist.name=puño ardiente
actors.mobs.yogfist$burningfist.desc=Este puño está formado por magia caótica ardiente. A medida que se mueve, incendiará constantemente el terreno a su alrededor. También es capaz de disparar explosiones de poder ardiente, que propagan llamas donde impactan.\n\nLa capacidad del puño para propagar las llamas se suprime cuando está cerca del agua, pero su calor es tan grande que cualquier agua a su alrededor se evaporará al poco tiempo.
actors.mobs.yogfist$soiledfist.name=puño de tierra
actors.mobs.yogfist$soiledfist.desc=Este puño está formado por magia caótica de tierra. A medida que se mueva provocará el crecimiento de vegetación a su alrededor. ¡También puede disparar bolas de tierra concentrada que atraparán a su objetivo en plantas y raíces de rápido crecimiento!\n\n¡El puño deriva poder de la vida de esta planta, y resistirá el daño en función de la cantidad de vegetación alta o surcada cerca de ella!
actors.mobs.yogfist$rottingfist.name=puño podrido
actors.mobs.yogfist$rottingfist.desc=Este puño está formado por corrupción viviente. Es una enorme masa de carne en descomposición que puede esparcir cieno cáustico cuerpo a cuerpo y gases tóxicos a distancia. Peor aún, la gran masa del puño hace que sangre en lugar de recibir daño directamente.\n\nSe puede usar agua para lavar el cieno, ¡pero el puño también es capaz de absorber agua para curarse! Adicionalmente, dañar el puño mientras está sangrando hará que el sangrado continúe, ¡pero no se acumulará el daño!
actors.mobs.yogfist$rustedfist.name=puño oxidado
actors.mobs.yogfist$rustedfist.desc=Este puño está formado de metal viviente. Es una masa apilada de metal cambiante que tiene poderosos ataques cuerpo a cuerpo, y puede lisiar a sus objetivos a distancia. Dada su tremenda masa, ¡el puño puede diferir el daño en el tiempo en lugar de recibirlo inmediatamente!\n\nComo el puño es rígido, no puede moverse por callejones estrechos. Además, aunque puede recibir el daño lentamente, este daño diferido se incrementará si se golpea al puño repetidas veces.
actors.mobs.yogfist$brightfist.name=puño luminoso
actors.mobs.yogfist$brightfist.teleport=¡El puño se teleporta con un destello de luz que te ciega gravemente!
actors.mobs.yogfist$brightfist.desc=Este puño está formado de energía de luz pura. ¡Es capaz de disparar poderosos rayos de abrasadora luz cada turno! Estos rayos te cegarán además de provocar un daño importante. ¡El puño también es capaz de sepultarse rápidamente en la arena para escapar!\n\nSin embargo, el puño no tiene habilidades especiales que pueda usar cuerpo a cuerpo.
actors.mobs.yogfist$darkfist.name=puño oscuro
actors.mobs.yogfist$darkfist.teleport=¡El puño se teleporta con una explosión de oscuridad que extingue tu fuente de luz!
actors.mobs.yogfist$darkfist.desc=Este puño está formado de energía oscura pura. ¡Es capaz de disparar poderosas explosiones de magia oscura cada turno! Estas explosiones debilitarán tu fuente de luz además de infligir mucho daño. ¡El puño también es capaz de envolver brevemente la arena en la oscuridad para escapar! \n\nSin embargo, el puño no tiene habilidades especiales que pueda usar en rango cuerpo a cuerpo.


actors.char.kill=%s te ha matado...
actors.char.defeat=has vencido a %s.
actors.char.def_verb=esquivado
actors.char.invulnerable=invulnerable
actors.char.immune=inmune


# --- Infinite / Experienced PD Translations ---
actors.blobs.dancefloor.desc=¡A bailar, a bailar!
Casilla de baile %s: %s
Siguiente color: %s
actors.blobs.dancefloor.color_1_name=Rojo
actors.blobs.dancefloor.color_1_desc=Los personajes sobre esta casilla sufren daño directo (masivamente incrementado contra el héroe)
actors.blobs.dancefloor.color_2_name=Verde
actors.blobs.dancefloor.color_2_desc=Los personajes sobre esta casilla actúan al doble de velocidad
actors.blobs.dancefloor.color_3_name=Azul
actors.blobs.dancefloor.color_3_desc=Los personajes sobre esta casilla quedan aturdidos
actors.blobs.dancefloor.color_4_name=Blanco
actors.blobs.dancefloor.color_4_desc=Los personajes sobre esta casilla sufren daño diferido (masivamente incrementado contra el héroe)
actors.blobs.dancefloor.color_5_name=Amarillo
actors.blobs.dancefloor.color_5_desc=Los monstruos derrotados sobre esta casilla otorgan doble EXP y más botín
actors.blobs.dancefloor.color_6_name=Morado
actors.blobs.dancefloor.color_6_desc=Los personajes sobre esta casilla sufren doble daño
actors.blobs.dancefloor.rankings_desc=Bailó hasta la tumba
actors.blobs.dancefloor.ondeath=Bailaste hasta cavar tu propia tumba
actors.blobs.dancefloor$dancingdefereddamage.name=Bailando con la Muerte
actors.blobs.dancefloor$dancingdefereddamage.desc=¡Este es el baile más peligroso que jamás hayas hecho, y lo estás dominando ignorando el dolor!

Daño diferido restante: %d.
actors.blobs.dancefloor$dancingdefereddamage.ondeath=Bailaste hasta cavar tu propia tumba
actors.blobs.dancefloor$dancingdefereddamage.rankings_desc=Bailó hasta la tumba
actors.blobs.dancefloor$dancingdoom.name=Bailando en una tumba
actors.blobs.dancefloor$dancingdoom.desc=Una tumba no es el mejor lugar para bailar, ¡pero nadie te detiene!

Los personajes lo suficientemente valientes para bailar en una tumba recibirán el doble de daño de todas las fuentes.
actors.blobs.dancefloor$dancespeed.name=Bailando con el Tiempo
actors.blobs.dancefloor$dancespeed.desc=Tu baile perfecto se sincroniza con el ritmo del universo, ¡y ni siquiera el tiempo te detendrá!

Mientras tu baile sea perfecto, realizarás todas las acciones al doble de velocidad.
actors.blobs.dancefloor$dancingstun.name=Aturdido
actors.blobs.dancefloor$dancingstun.heromsg=¡Estás aturdido!
actors.blobs.dancefloor$dancingstun.desc=No hay nada peor que quedarse aturdido en mitad de un baile.

El aturdimiento detiene todas las acciones, obligando al objetivo a esperar a que termine el efecto.
actors.buffs.rageshield.name=Escudo de Determinación
actors.buffs.rageshield.heromsg=¡Estás protegido por tu furia!
actors.buffs.rageshield.desc=Una burbuja duradera de pura rabia drena la fuerza vital de los enemigos cercanos si estás herido.

La barrera drenará salud de los enemigos a la vista, enfureciéndolos y recibiendo daño. El escudo tendrá mayor efecto si el enemigo está adyacente.

Escudo restante: %d.
actors.buffs.championenemy$tanky.name=campeón tanque
actors.buffs.championenemy$tanky.desc=Los campeones tanque reciben solo el 5% del daño, pero su daño y velocidad se reducen un 25%.
actors.buffs.championenemy$speedy.name=campeón veloz
actors.buffs.championenemy$speedy.desc=Los campeones veloces obtienen x4 de velocidad y x1.5 de evasión y precisión.
actors.buffs.championenemy$frozen.name=campeón congelado
actors.buffs.championenemy$frozen.desc=Los campeones congelados infligen un 25% más de daño cuerpo a cuerpo pero tienen -20% de velocidad, enfrían a los enemigos que atacan y a veces los congelan, son inmunes al frío y esparcen una ventisca al morir.
actors.buffs.championenemy$blunt.name=campeón contundente
actors.buffs.championenemy$blunt.desc=Los campeones contundentes son expertos usando sus manos o armas contundentes, infligen un 75% más de daño, causan vértigo al atacar y paralizan en casos raros.
actors.buffs.godspeed.name=Velocidad Divina
actors.buffs.godspeed.desc=¡La energía divina recorre toda tu esencia, permitiéndote realizar acciones a velocidades increíbles!

Mientras estés bajo sus efectos, realizarás todas las acciones al doble de velocidad.

Turnos restantes de velocidad divina: %s.
actors.buffs.overload.name=Sobrecarga
actors.buffs.overload.desc=La realidad está sobrecargada. Prepárate para luchar y sobrevivir.

La muerte de cualquier criatura hostil provoca la aparición inmediata de otra criatura.

Turnos restantes de sobrecarga: %s.
actors.buffs.killevolution.name=contador de bajas
actors.buffs.killevolution.action=Habilidades de Baja
actors.buffs.killevolution.desc=Al derrotar enemigos, el héroe gana energía para usar en diversas habilidades. La mayoría de enemigos otorgan 1 de energía y no se pierde con el tiempo.

_Sin embargo, desequipar el arma asociada perderá toda esta energía y tendrás que comenzar a acumularla de nuevo._

Energía actual: %1$d/%2$d.
actors.buffs.killevolution.desc_cooldown=El héroe ha usado una habilidad recientemente y debe esperar antes de usar otra.

Enfriamiento actual: %d turnos.
actors.buffs.killevolution$killevolutionability$invisibledash.name=desplazamiento invisible
actors.buffs.killevolution$killevolutionability$invisibledash.prompt=Elige una Ubicación
actors.buffs.killevolution$killevolutionability$invisibledash.desc=Un desplazamiento instantáneo de hasta 4 casillas con un turno adicional de invisibilidad para realizar ataques sorpresa. Puede atravesar peligros, pero no enemigos ni terreno sólido.
actors.buffs.killevolution$killevolutionability$invisibledash.empower_desc=Un desplazamiento instantáneo de hasta _8 casillas_ con un turno adicional de invisibilidad para realizar ataques sorpresa. Puede atravesar peligros, pero no enemigos ni terreno sólido.
actors.buffs.killevolution$killevolutionability$physicallyempowered.name=potenciación física
actors.buffs.killevolution$killevolutionability$physicallyempowered.desc=El héroe se otorga +2 de daño adicional durante 10 golpes.
actors.buffs.killevolution$killevolutionability$physicallyempowered.empower_desc=El héroe se otorga _+4 de daño adicional_ durante 10 golpes.
actors.buffs.killevolution$killevolutionability$weaponupgrade.name=mejora de arma
actors.buffs.killevolution$killevolutionability$weaponupgrade.desc=El héroe mejora su arma (y la segunda arma de la Duelista si la hay) de forma permanente.
actors.buffs.killevolution$killevolutionability$weaponupgrade.empower_desc=El héroe mejora su arma (y la segunda arma de la Duelista si la hay) _dos veces_ de forma permanente.
actors.buffs.killevolution$killevolutionability$chain.name=encadenar enemigo
actors.buffs.killevolution$killevolutionability$chain.desc=El héroe encadena a un enemigo para arrastrarlo a corta distancia.
actors.buffs.killevolution$killevolutionability$immortalize.name=inmortalizar
actors.buffs.killevolution$killevolutionability$immortalize.desc=El héroe se vuelve inmune a todas las fuentes de daño durante 15 turnos.
actors.buffs.killevolution$killevolutionability$immortalize.empower_desc=El héroe se vuelve inmune a todas las fuentes de daño durante _~22 turnos_.
actors.buffs.marked.name=Marcado
actors.buffs.marked.desc=El Cazador espera pacientemente, preparándose para golpear mientras su bbat debilita a los enemigos.
actors.buffs.marked.desc_dmg=El bbat inflige %s%% más de daño a este enemigo. Podrás saltar hacia el enemigo marcado en cualquier momento; cuanto mayor sea el daño extra, más efectos negativos aplicará.
actors.buffs.marked.prompt=¡Selecciona un objetivo al que teletransportarte!
Distancia máxima: tu rango de visión
actors.buffs.marked.no_target=No hay nada a lo que teletransportarse allí.
actors.buffs.marked.out_of_reach=Ese objetivo está fuera de tu alcance.
actors.buffs.marked.assassinated=asesinado
actors.buffs.marked.desc_poison=En este punto, _envenenarás_ al objetivo, infligiéndole daño con el tiempo.
actors.buffs.marked.desc_cripple=En este punto, _tullirás_ las piernas del objetivo, reduciendo su velocidad de movimiento.
actors.buffs.marked.desc_blinding=En este punto, también _cegarás_ al objetivo, reduciendo su campo de visión a 1 casilla.
actors.buffs.marked.desc_bleeding=En este punto, también harás _sangrar_ al objetivo, infligiendo daño con el tiempo.
actors.buffs.marked.desc_vulnerable=En este punto, también _aumentarás el daño físico_ que recibe el enemigo.
actors.buffs.marked.desc_hexed=En este punto, también aturdirás al objetivo, _reduciendo su precisión y destreza_ por un corto tiempo.
actors.buffs.marked.desc_slow=En este punto, también desorientarás al objetivo, _ralentizando_ sus acciones.
actors.buffs.marked.desc_ooze=En este punto, también aplicarás _baba cáustica_ mortal al objetivo, infligiendo daño continuo hasta que encuentre agua.
actors.buffs.marked.desc_paralysis=En este punto, _paralizarás_ completamente al enemigo, impidiéndole atacar.
actors.buffs.marked.desc_doom=En este punto, también maldecirás al enemigo, _aumentando significativamente todo el daño que reciba_.
actors.buffs.danceimmunebuff.name=inmune a la maldición del baile
actors.buffs.danceimmunebuff.desc=Todos los efectos del baile pierden su poder por un corto tiempo. Debes esperar a que termine el efecto antes de volver a usar el hechizo.

Turnos restantes de inmunidad: %s.
actors.hero.abilities.ratking.legacywrath.name=furia divina
actors.hero.abilities.ratking.legacywrath.short_desc=Desato mi _Furia Divina_ sobre mis enemigos. ¡Me deja expuesto durante unos turnos y drena toda la carga de mi armadura!
actors.hero.abilities.ratking.legacywrath.desc=Desbloqueo la habilidad de canalizar un poder abrumador: teletransportarme a cualquier lugar a menos de 6 casillas, cegar a enemigos adyacentes, lanzar magia de tierra a todos los enemigos a la vista y disparar una ráfaga de cuchillas espectrales antes de volverme invisible.
actors.hero.heroclass.warrior_perk_desc=El Guerrero obtiene _1 + (5% de FUE actual) de fuerza temporal no acumulable_ durante _60 + (5 * nivel) turnos_ al comer y no recibe daño mientras come.
Puede cegar a cualquier enemigo por _5 turnos_ arrojándole objetos no arrojadizos.
Tiene _15%_ más de fuerza y regenera salud el doble de rápido.
actors.hero.heroclass.mage_perk_desc=El Mago obtiene _12 turnos_ de recarga al comer.
Identifica instantáneamente cualquier varita que recoja.
Puede apuntarse a sí mismo con una varita para convertir sus cargas en escudo a razón de _10.5% de PS máx por carga_.
actors.hero.heroclass.rogue_perk_desc=El Pícaro no despierta a enemigos dormidos a _3 o más casillas_.
Puede buscar en un área de _7x7_ empujando a enemigos adyacentes.
Puede usar la Capa de Sombras sin equiparla.
Sus bombas infligen _150%_ más de daño.
actors.hero.heroclass.huntress_perk_desc=La Cazadora identifica equipo _3 veces_ más rápido.
Al pisar hierba corta o brasas, brota hierba alta.
Obtiene visión mental de enemigos a _3 casillas_ y celeridad de _5 turnos_ al comer.
actors.hero.heroclass.rat_king=rey rata
actors.hero.heroclass.rat_king_desc_short=¡Soy tan increíble como un rey puede ser!
actors.hero.heroclass.rat_king_desc=¿Por qué elegir una clase si puedo jugar como yo mismo?
Empiezo con todos los objetos especiales de clase: sello, bastón, capa de sombras y arco.
Empiezo con todas las bolsas y puedo caminar por hierba alta sin pisotearla.
actors.hero.heroclass.rat_king_perk_desc=¿Qué? ¡No necesito ayuda! ¡Soy lo bastante fuerte por mí mismo!
actors.hero.heroclass.duelist_perk_desc=La Duelista obtiene _2 cargas de arma_ y daño extra al comer.
Gana 1 carga cada _10 turnos_ y puede cambiar de arma instantáneamente _dos veces en 5 turnos_.
actors.hero.herosubclass.king=rey rata
actors.hero.herosubclass.king_short_desc=Elegir es aburrido, prefiero elegir _todas las subclases_...
actors.hero.herosubclass.king_desc=¡El Rey Rata puede usar todas las subclases a la vez!
actors.hero.herosubclass.kingy=rey rata
actors.hero.herosubclass.kingy_desc=¡Leer el Tomo de Maestría otorga al Rey Rata el poder de todas las subclases!
actors.hero.perks.perk_obtain=¡Aprendiste %s!
actors.hero.perks.sucker_punch.name=golpe bajo
actors.hero.perks.sucker_punch.desc=El primer ataque sorpresa inflige un 25% de daño adicional que perfora armadura.
actors.hero.perks.directive.name=directiva
actors.hero.perks.directive.desc=El primer ataque sorpresa otorga 1.5 turnos de celeridad.
actors.hero.perks$directivemovingtracker.name=Pasos Instantáneos
actors.hero.perks$directivemovingtracker.desc=Tu movimiento no consumirá tiempo a menos que te detengas.

Movimientos restantes: %s.
actors.hero.perks.follow_up_strike.name=golpe consecutivo
actors.hero.perks.follow_up_strike.desc=Tras golpear con un arco o arma arrojadiza, el siguiente ataque cuerpo a cuerpo inflige un 25% de daño adicional que perfora armadura.
actors.hero.perks.hold_fast.name=resistencia firme
actors.hero.perks.hold_fast.desc=Al esperar en tu sitio, obtienes %s-%s de armadura adicional.
actors.hero.perks.protein_infusion.name=infusión de proteínas
actors.hero.perks.protein_infusion.desc=El héroe obtiene hasta 2x de velocidad y 1.5x de evasión según su nivel de saciedad.
actors.hero.perks.fishing_pro.name=pescador experto
actors.hero.perks.fishing_pro.desc=Con un 25% de probabilidad, el botín de pesca se duplica.
actors.hero.perks.wand_pro.name=maestría de recarga
actors.hero.perks.wand_pro.desc=Tus varitas se recargan un 25% más rápido.
actors.hero.perks.iron_will.name=reflejo de hierro
actors.hero.perks.iron_will.desc=Por debajo del 50% de PS, recibir daño físico o mágico liberará ondas de choque dañinas hacia los enemigos.
actors.hero.perks.mystical_meal.name=comida mística
actors.hero.perks.mystical_meal.desc=Comer otorga 6 turnos de recarga de artefactos.
actors.hero.perks.additional_money.name=cazarrecompensas
actors.hero.perks.additional_money.desc=Derrotar enemigos suelta oro equivalente al 20% del oro normalmente obtenido.
actors.hero.perks.better_bartering.name=trueque eficiente
actors.hero.perks.better_bartering.desc=Comerciar con el Rey Rata tiene un 33% de probabilidad de no consumir el objeto.
actors.hero.perks.potions.name=mucha experiencia
actors.hero.perks.potions.desc=Las Pociones de Sobrecarga y las Pociones de Experiencia duran el doble.
actors.hero.perks.more_bag.name=bolsas de botín más grandes
actors.hero.perks.more_bag.desc=Las bolsas de tesoro de la tienda contienen aproximadamente un 50% más de objetos.
actors.hero.perks.no_oneshots.name=piel de acero
actors.hero.perks.no_oneshots.desc=Si el daño recibido te mataría de un solo golpe teniendo la salud completa, se reducirá en un 50%.
actors.hero.perks.collect_everything.name=comida magnética
actors.hero.perks.collect_everything.desc=Comer raciones sobrevaloradas hace que todos los objetos superiores de cada montón en el mapa se recolecten instantáneamente.
actors.hero.perks.rat_summons.name=refuerzos de ratas
actors.hero.perks.rat_summons.desc=Buscar en el sitio generará varias ratas marsupiales aliadas a tu lado con 25 turnos de adrenalina.
actors.hero.perks.grass_healing.name=naturaleza restaurada
actors.hero.perks.grass_healing.desc=Beber una poción de curación genera un área de hierba de 5x5 alrededor del héroe y enraíza a los enemigos por 3 turnos.
actors.hero.perks.friendly_bees.name=abejas amistosas
actors.hero.perks.friendly_bees.desc=Todas las abejas generadas por tarros de miel lucharán del lado del héroe.
actors.hero.perks.raritize_magic.name=Magia de Rarezas
actors.hero.perks.raritize_magic.desc=Los monstruos pueden soltar objetos con rareza especial con un 7% de probabilidad.
actors.hero.perks.supply_rations.name=Raciones Almacenadas
actors.hero.perks.supply_rations.desc=Puedes encontrar raciones en cofres con una probabilidad de _1/(25 + (5 * raciones encontradas))_ mientras exploras.
Se comen rápido, curan 5 PS y recargan 1 uso de la capa de sombras.
actors.hero.perks.dungeon_berry.name=Generosidad de la Naturaleza
actors.hero.perks.dungeon_berry.desc=Puedes encontrar bayas en hierba alta con una probabilidad de _1/(15 + (5 * bayas encontradas))_.
Se comen rápido, restauran saciedad y pueden contener una semilla útil.
actors.mobs.npcs.blacksmith.intro_quest_ratking=¡Saludos Su Majestad!
actors.mobs.npcs.blacksmith.same_item=¡Selecciona 2 objetos diferentes, no el mismo dos veces!
actors.mobs.npcs.blacksmith.diff_type=¡Selecciona 2 objetos del mismo tipo!
actors.mobs.npcs.blacksmith.un_ided=¡Necesito saber con qué trabajo, identifícalos primero!
actors.mobs.npcs.blacksmith.cursed=¡No trabajo con objetos malditos!
actors.mobs.npcs.blacksmith.degraded=¡Es basura, la calidad es pésima!
actors.mobs.npcs.blacksmith.cant_reforge=¡No puedo reforjar estos objetos!
actors.mobs.npcs.blacksmith.key=Oh, estás aquí. ¿Sabías que la Varita de Ráfaga de Fuego tenía un hermano llamado Varita de Avalancha? La he reprogramado y añadido su receta.
actors.mobs.npcs.ratking.ghastly=Esta imagen ilusoria es la manifestación del Rey Rata. Comerciará contigo sin huir.
actors.mobs.npcs.shopkeeper.talk_prison_rat_king=Saludos, Su Majestad. ¿Qué hace usted por aquí?
actors.mobs.npcs.wandmaker.intro_ratking=¡Oh, gran saludo, Su Majestad! ¡Qué honor!
actors.mobs.npcs.wandmaker.cheese=¡Oh Dios mío, queso! ¡Te daré mi varita más poderosa en agradecimiento!
actors.mobs.npcs.hook.name=anzuelo
actors.mobs.npcs.hook.desc=El anzuelo de tu genial caña de pescar.
actors.mobs.npcs.expgenerator.name=planta de energía
actors.mobs.npcs.expgenerator.desc=Esta obra maestra dorada transforma la luz solar oculta en experiencia. Puedes dañarla para recogerla de nuevo.
actors.mobs.npcs.bbat.name=bbat
actors.mobs.npcs.bbat.desc=Este murciélago está entrenado para cazar objetivos débiles mientras su dueño sobrevive en combate.
actors.mobs.npcs.bbat$bbatrecharge.name=Recarga de Bbat
actors.mobs.npcs.bbat$bbatrecharge.desc=Bbat necesita %s turnos para recuperarse del daño y regresar al combate.
actors.mobs.blackmimic.name=mímico oscurecido
actors.mobs.blackmimic.notice=Vaya, fuiste allí.
actors.mobs.blackmimic.shield=¡Tengo un campo de fuerza!
actors.mobs.blackmimic.vent=¿Qué tal algo de experiencia corrosiva?
actors.mobs.blackmimic.rocks=¡Aplástalo, rocas!
actors.mobs.blackmimic.bomb=¡Explota!
actors.mobs.blackmimic.summon=¡PRUEBA A LOS MONSTRUOS!
actors.mobs.blackmimic.charging=¡NECIO!
actors.mobs.blackmimic.charging_hint=¡El Mímico Oscuro es invulnerable mientras la torre de energía esté activa!
actors.mobs.blackmimic.supercharged=¡ALTO AHÍ IDIOTA!
actors.mobs.blackmimic.charge_lost=¿QUÉÉÉÉÉ?
actors.mobs.blackmimic.pylons_destroyed=¿CÓMO?
actors.mobs.blackmimic.rankings_desc=Consumido por su propia codicia
actors.mobs.blackmimic.def_verb=bloqueado
actors.mobs.blackmimic.defeated=¡NOOOOOOOOOOOOOO!
actors.mobs.blackmimic.desc=La personificación de tu infinita avaricia. Busca devorarte junto con el Amuleto.
actors.mobs.blackmimic.desc_clone=Un clon del Mímico Oscuro. Inmune al daño.
actors.mobs.blackmimic.desc_supercharged=El Mímico Oscuro está supercargado y se mueve al triple de velocidad. Destruye las fuentes de energía cercanas para debilitarlo.
actors.mobs.blackmimic$fallingrocks.desc=¡Rocas sueltas caen del techo, parece a punto de colapsar!
actors.mobs.oofthief.name=ladrón OOF
actors.mobs.oofthief.stole=¡El ladrón te robó %s! ¡Puedes recuperarlo en las tiendas de pisos reiniciados!
actors.mobs.oofthief.escapes=¡El ladrón se teletransporta!
actors.mobs.oofthief.desc=Un ladrón mejorado genéticamente, 2.5 veces más fuerte que un ladrón común y con dispositivos de teletransporte.

