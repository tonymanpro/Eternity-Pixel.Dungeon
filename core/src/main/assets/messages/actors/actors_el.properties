actors.blobs.blizzard.name=χιονοθύελλα
actors.blobs.blizzard.desc=Μια χιονοθύελλα στροβιλίζεται εδώ.

actors.blobs.confusiongas.name=αέριο σύγχυσης
actors.blobs.confusiongas.desc=Ένα νέφος αερίου σύγχυσης στροβιλίζεται εδώ.

actors.blobs.electricity.name=ηλεκτρισμός
actors.blobs.electricity.desc=Ένα ηλεκτρικό πεδίο σπινθηροβολεί ζωηρά.
actors.blobs.electricity.rankings_desc=Πέθανες από ηλεκτροπληξία
actors.blobs.electricity.ondeath=Πέθανες από ηλεκτροπληξία...

actors.blobs.fire.name=φωτιά
actors.blobs.fire.desc=Μία φωτιά μαίνεται εδώ.

actors.blobs.foliage.name=φυλλωσιές
actors.blobs.foliage.desc=Δέσμες φωτός διαπερνούν το μισοσκόταδο του υπογείου κήπου.

actors.blobs.freezing.name=παγωμένος αέρας
actors.blobs.freezing.desc=Ο αέρας είναι αφύσικα ψυχρός εδώ.

actors.blobs.goowarn.name=σκοτεινή ενέργεια
actors.blobs.goowarn.desc=Κηλίδες σκοτεινής ενέργειας συσσωρεύονται εδώ!

actors.blobs.inferno.name=πύρινη λαίλαπα
actors.blobs.inferno.desc=Μια πύρινη λαίλαπα μαίνεται εδώ.

actors.blobs.paralyticgas.name=παραλυτικό αέριο
actors.blobs.paralyticgas.desc=Ένα νέφος παραλυτικού αερίου στροβιλίζεται εδώ.

actors.blobs.regrowth.name=αναγέννηση

actors.blobs.sacrificialfire.name=θυσιαστική πυρά
actors.blobs.sacrificialfire.desc=Εδώ βρίσκεται ένας βωμός, και πάνω του είναι αναμμένη μια θυσιαστική πυρά. Κάθε πλάσμα που εξοντώνεται εδώ θα καταναλώνεται ως προσφορά στα πνεύματα της κατακόμβης.\n\nΊσως να δοθεί κάποια ανταμοιβή αν πραγματοποιηθούν αρκετές θυσίες;
actors.blobs.sacrificialfire.worthy=Η πυρά καταναλώνει την προσφορά σου και δυναμώνει.
actors.blobs.sacrificialfire.unworthy=Η πυρά καταναλώνει την προσφορά σου, μα δεν αλλάζει.
actors.blobs.sacrificialfire.reward=H πυρά λάμπει δυνατά κι έπειτα διασκορπίζεται, αφήνοντας πίσω μια ανταμοιβή!

actors.blobs.smokescreen.name=καπνός
actors.blobs.smokescreen.desc=Ένα νέφος πυκνού μαύρου καπνού στροβιλίζεται εδώ.

actors.blobs.stenchgas.name=αέριο μπόχας
actors.blobs.stenchgas.desc=Ένα νέφος βρομερής μπόχας στροβιλίζεται εδώ.

actors.blobs.stormcloud.name=μαύρα σύννεφα
actors.blobs.stormcloud.desc=Ένα νέφος αναδιδόμενων υδρατμών στροβιλίζεται εδώ.

actors.blobs.toxicgas.name=τοξικό αέριο
actors.blobs.toxicgas.desc=Ένα πρασινωπό νέφος τοξικού αερίου στροβιλίζεται εδώ.
actors.blobs.toxicgas.rankings_desc=Πέθανες από ασφυξία
actors.blobs.toxicgas.ondeath=Πέθανες από το τοξικό αέριο...

actors.blobs.corrosivegas.name=διαβρωτικό αέριο
actors.blobs.corrosivegas.desc=Ένα νέφος θανάσιμου καυστικού αερίου στροβιλίζεται εδώ.

actors.blobs.waterofawareness.name=ύδατα της επίγνωσης
actors.blobs.waterofawareness.procced=Πίνοντας μία γουλιά, νιώθεις τη γνώση να ξεχύνεται στο μυαλό σου.
actors.blobs.waterofawareness.desc=Η δύναμη της γνώσης ακτινοβολεί από το νερό αυτού του πηγαδιού. Πιες μια γουλιά για να αναγνωρίσεις όλα σου τα εξοπλισμένα εφόδια, να εντοπίσεις τις κατάρες σε όλα τα αντικείμενα που κουβαλάς, αλλά και να αποκαλυφθούν όλα τα αντικείμενα σε αυτόν τον όροφο.

actors.blobs.waterofhealth.name=ύδατα της ζωής
actors.blobs.waterofhealth.procced=Πίνοντας μία γουλιά, νιώθεις τις πληγές σου να γιατρεύονται πλήρως.
actors.blobs.waterofhealth.desc=Η δύναμη της ζωής ακτινοβολεί από το νερό αυτού του πηγαδιού. Πιες μια γουλιά για να γιατρέψεις τις πληγές σου, να κορέσεις την πείνα σου και να εξαγνίσεις  τις κατάρες από τα εξοπλισμένα εφόδια.

actors.blobs.web.name=αραχνοϊστός
actors.blobs.web.desc=Ένας παχύς ιστός καλύπτει τα πάντα. Οτιδήποτε τον αγγίξει ή πεταχτεί μέσα του θα τον σπάσει, αλλά θα κολλήσει σε εκείνο το σημείο.



###buffs
actors.buffs.adrenaline.name=αδρεναλίνη
actors.buffs.adrenaline.desc=Μια έκρηξη φυσικής δύναμης· η αδρεναλίνη ενισχύει την ταχύτητα επίθεσης και κίνησης.\n\nΗ αδρεναλίνη επιτρέπει στον στόχο να τρέχει με x2 ταχύτητα και να επιτίθεται με x1.5 ταχύτητα.\n\nΓύροι αδρεναλίνης που απομένουν: %s.

actors.buffs.adrenalinesurge.name=αύξηση δύναμης
actors.buffs.adrenalinesurge.desc=Ένα κύμα τεράστιας ισχύος· δυστυχώς όχι μόνιμο.\n\nΑύξηση της δύναμης: +%d.\nΓύροι μέχρι να εξασθενήσει η αύξηση: %s.

actors.buffs.amok.name=αμόκ
actors.buffs.amok.desc=Το αμόκ βάζει τον στόχο σε μια κατάσταση μεγάλης οργής και σύγχυσης.\n\nΈνα πλάσμα με αμόκ θα επιτεθεί σε οτιδήποτε βρίσκεται κοντά του, φίλο ή εχθρό.\n\nΓύροι με αμόκ που απομένουν: %s.

actors.buffs.arcanearmor.name=απόκρυφη πανοπλία
actors.buffs.arcanearmor.desc=Μια ισχνή ασπίδα σε περιβάλλει που εμποδίζει ένα μέρος της ζημιάς των μαγικών επιθέσεων.\n\nΗ μαγική σου άμυνα είναι ενισχυμένη κατά: 0-%d.\n\nΓύροι μέχρι να εξασθενήσει η απόκρυφη πανοπλία: %s.

actors.buffs.artifactrecharge.name=επαναφόρτιση τεχνουργημάτων
actors.buffs.artifactrecharge.desc=Μια ενέργεια κυλά μέσα σου που αυξάνει τον ρυθμό φόρτισης των εξοπλισμένων τεχνουργημάτων σου.\n\nΚάθε τεχνούργημα επηρεάζεται λίγο διαφορετικά, αλλά όλα φορτίζονται πολύ πιο γρήγορα.\n\nΓύροι που απομένουν: %s.

actors.buffs.ascensionchallenge.name=κατάρα του Φυλακτού
actors.buffs.ascensionchallenge.desc=Ο Yog-Dzewa κάπως διατηρεί την επιρροή του σε αυτόν τον κόσμο μέσω του φυλακτού. Προσπαθεί να σταματήσει την ανάβασή σου!\n\nΗ δύναμη του Yog κάνει την κατακόμβη πολύ πιο επικίνδυνη· αυξάνει τον αριθμό των εχθρών και τους κάνει ισχυρότερους! Η δύναμη αυτή θα συνεχίσει να αναπτύσσεται όσο δεν την ελέγχεις. Μπορεί να αποδυναμωθεί με την εξόντωση εχθρών που ενισχύονται από αυτήν.
actors.buffs.ascensionchallenge.desc_clear=Η σκοτεινή ενέργεια που εκπέμπεται από το φυλακτό έχει αποδυναμωθεί στον μέγιστο βαθμό για τώρα.
actors.buffs.ascensionchallenge.desc_beckon=Το φυλακτό _καλεί τους μακρινούς εχθρούς_ και τους ειδοποιεί για τη θέση σου.
actors.buffs.ascensionchallenge.desc_haste=Το φυλακτό _επιταχύνει τους μακρινούς εχθρούς_ και τους κάνει να σε φτάνουν γρηγορότερα!
actors.buffs.ascensionchallenge.desc_slow=Το φυλακτό _σε επιβραδύνει_ και ακυρώνει τις επιδράσεις αύξησης ταχύτητας!
actors.buffs.ascensionchallenge.desc_damage=Η ενέργεια του φυλακτού έχει γίνει τόσο ισχυρή που _σου προκαλεί απευθείας ζημιά!_
actors.buffs.ascensionchallenge.beckon=Το φυλακτό ξεκινά να ειδοποιεί τους μακρινούς εχθρούς.
actors.buffs.ascensionchallenge.haste=Το φυλακτό ξεκινά να επιταχύνει τους μακρινούς εχθρούς!
actors.buffs.ascensionchallenge.slow=Νιώθεις ότι το φυλακτό αρχίζει και γίνεται βαρύ σαν μολύβι!
actors.buffs.ascensionchallenge.damage=Το φυλακτό ξεκινά να εκπέμπει σκοτεινή ενέργεια. Καίει πολύ!
actors.buffs.ascensionchallenge.weaken_info=The amulets curse can be weakened by defeating more enemies.
actors.buffs.ascensionchallenge.weaken_info_no_kills=If you defeat enemies the amulet's curse will weaken!
actors.buffs.ascensionchallenge.weaken=Αισθάνεσαι την κατάρα του φυλακτού να αποδυναμώνεται ελαφρώς.
actors.buffs.ascensionchallenge.break=Παίρνεις μια ανάσα και νιώθεις ότι οι πληγές σου αρχίζουν να επουλώνονται!
actors.buffs.ascensionchallenge.almost=Νιώθεις την κατοχή του Yog στο φυλακτό να χαλαρώνει... είσαι κοντά!
actors.buffs.ascensionchallenge.on_kill=Η σκοτεινή ενέργεια σε απορροφά...

actors.buffs.barkskin.name=φλοιώδες δέρμα
actors.buffs.barkskin.desc=Το δέρμα σου σκληραίνει· το νιώθεις τραχύ και συμπαγές σαν κορμό δέντρου.\n\nΤο φλοιώδες δέρμα αυξάνει την άμυνα της πανοπλίας σου και σου επιτρέπει να αμύνεσαι καλύτερα στις φυσιολογικές επιθέσεις.\n\nΗ άμυνα είναι αυξημένη κατά: 0-%d.\nΓύροι μέχρι να εξασθενήσει το φλοιώδες δέρμα: %s.\n\nΑν λάβεις φλοιώδες δέρμα από πολλαπλές πηγές, μόνο το ισχυρότερο θα εφαρμοστεί.

actors.buffs.barrier.name=πεδίο προστασίας
actors.buffs.barrier.desc=Μια ανθεκτική ασπίδα ενέργειας που εμποδίζει κάθε ζημιά.\n\nΤο πεδίο απορροφά πλήρως τη ζημιά στη θέση αυτουνού που προστατεύει για όσο έχει ακόμα ενέργεια. Η ενέργεια μειώνεται αργά με το πέρασμα του χρόνου.\n\nΕνέργεια που απομένει: %d.

actors.buffs.berserk.angered=θυμός
actors.buffs.berserk.berserk=εξαγρίωση
actors.buffs.berserk.exhausted=εξάντληση
actors.buffs.berserk.recovering=ανάκαμψη
actors.buffs.berserk.angered_desc=Τα τραύματα του Βάρβαρου δυναμώνουν τα χτυπήματά του. Η οργή του μεγαλώνει όσο δέχεται φυσιολογική ζημιά και αυξάνει τη ζημιά των επιθέσεών του. Η ζημιά που εμποδίζεται από την πανοπλία συμβάλλει κι αυτή στην αύξηση της οργής.\n\nΗ οργή του Βάρβαρου καταλαγιάζει σταδιακά· όσο χαμηλότερη η ζωή του, τόσο περισσότερο διαρκεί η οργή.\n\nΣε 100%% οργή, μπορεί να εξαγριωθεί και να λάβει προστασία ανάλογη του επιπέδου της πανοπλίας και της χαμένης ζωής του. Κατά την εξαγρίωση, η προστασία αυτή φθίνει με τον χρόνο και, αφού τελειώσει, θα πρέπει να ξεκουραστεί προτού μαζέψει ξανά οργή.\n\nΤρέχουσα οργή:_ %1$.0f%%_\nΕπιπλέον ζημιά: _+%2$.0f%%_\n\nΠροστασία εξαγρίωσης στην τρέχουσα πανοπλία και ζωή:_%3$d_
actors.buffs.berserk.berserk_desc=Ο φόβος και η αβεβαιότητα χάνονται και παραμένει μόνο ο θυμός. Ο Βάρβαρος είναι ιδιαίτερα ισχυρός σε αυτήν την κατάσταση: _προκαλεί +50%% ζημιά και λαμβάνει επιπλέον προστασία,_αλλά χάνει προστασία κάθε γύρο.\n\nΌταν αυτή η προστασία φτάσει στο 0, η εξαγρίωση θα σταματήσει.\n\nΜετά την εξαγρίωση, Ο Βάρβαρος θα χρειαστεί να ανακάμψει προτού μπορέσει να μαζέψει ξανά οργή.\n\nΠροστασία που απομένει:%d
actors.buffs.berserk.recovering_desc=Η εσωτερική δύναμη έχει τα όριά της. Ο Βάρβαρος πρέπει να ξεκουραστεί πριν αξιοποιήσει ξανά την οργή του.\n\nΌσο ανακτά τις δυνάμεις του, ο Βάρβαρος δεν μαζεύει οργή από τη λήψη ζημιάς.
actors.buffs.berserk.recovering_desc_turns=Γύροι μέχρι την ανάκαμψη: _%d_
actors.buffs.berserk.recovering_desc_levels=Επίπεδα μέχρι την ανάκαμψη: _%.2f_
actors.buffs.berserk.rankings_desc=Εξαγριώθηκες μέχρι θανάτου
actors.buffs.berserk.action_name=Εξαγρίωση
actors.buffs.berserk.no_seal=Χρειάζεσαι τη σπασμένη σου σφραγίδα για να εξαγριωθείς!

actors.buffs.bleeding.name=αιμορραγία
actors.buffs.bleeding.ondeath=Πέθανες από αιμορραγία...
actors.buffs.bleeding.heromsg=Αιμορραγείς!
actors.buffs.bleeding.rankings_desc=Πέθανες από αιμορραγία
actors.buffs.bleeding.desc=Αυτή η πληγή στάζει αίμα με ανησυχητικό ρυθμό.\n\nΗ αιμορραγία προκαλεί ζημιά ανά γύρο. Η ζημιά μειώνεται κατά ένα τυχαίο ποσό κάθε γύρο, έως ότου σταματήσει η αιμορραγία.\n\nΤρέχουσα ζημιά αιμορραγίας: %d.

actors.buffs.bless.name=ευλογία
actors.buffs.bless.desc=Μια μεγάλη έκρηξη συγκέντρωσης· κάποιοι λένε ότι την εμπνέουν οι θεοί.\n\nΗ ευλογία αυξάνει την ακρίβεια και την αποφυγή κατά 25%%, καθιστώντας τον ευλογημένο πολύ πιο αποτελεσματικό στη μάχη.\n\nΓύροι ευλογίας που απομένουν: %s.

actors.buffs.blindness.name=τύφλωση
actors.buffs.blindness.heromsg=Τυφλώθηκες!
actors.buffs.blindness.desc=Η τύφλωση σκοτεινιάζει τα πάντα στο γύρω περιβάλλον.\n\nΈνας τυφλωμένος χαρακτήρας βλέπει μόνο ένα τετράγωνο μακριά. Αυτό καθιστά αναποτελεσματικές τις επιθέσεις απόστασης, και γίνεται πολύ εύκολο να χαθούν τα ίχνη των μακρινών εχθρών. Επιπλέον, ένας τυφλωμένος ήρωας είναι ανίκανος να διαβάσει παπύρους ή βιβλία.\n\nΓύροι τύφλωσης που απομένουν: %s.

actors.buffs.buff.heromsg=

actors.buffs.burning.name=κάψιμο
actors.buffs.burning.heromsg=Έπιασες φωτιά!
actors.buffs.burning.burnsup=Ένα αντικείμενο (%s) καίγεται!
actors.buffs.burning.ondeath=Κατακάηκες μέχρι θανάτου...
actors.buffs.burning.rankings_desc=Κάηκες ολοσχερώς
actors.buffs.burning.desc=Few things are more distressing than being engulfed in flames.\n\nFire will deal damage every turn until it is put out by water or it expires. Fire can be extinguished by stepping into water, or from the splash of a shattering potion.\n\nAdditionally, the fire may ignite flammable terrain or items that it comes into contact with.\n\nTurns of burning remaining: %s.

actors.buffs.championenemy.warn=Αισθάνεσαι μια θανατηφόρα παρουσία.
actors.buffs.championenemy$blazing.name=φλογερός μαχητής
actors.buffs.championenemy$blazing.desc=Οι φλογεροί μαχητές προκαλούν 25% επιπλέον ζημιά στη μάχη σώμα-με-σώμα, αναφλέγουν τους εχθρούς στους οποίους επιτίθενται, είναι απρόσβλητοι από τη φωτιά και εξαπλώνουν φλόγες τριγύρω όταν πεθαίνουν. Όμως, δεν αναφλέγουν εχθρούς που βρίσκονται σε νερό.
actors.buffs.championenemy$projecting.name=προβλητικός μαχητής
actors.buffs.championenemy$projecting.desc=Οι προβλητικοί μαχητές έχουν +3 εμβέλεια επίθεσης και προκαλούν 25% επιπλέον ζημιά σε μάχη σώμα-με-σώμα.
actors.buffs.championenemy$antimagic.name=αντι-μαγικός μαχητής
actors.buffs.championenemy$antimagic.desc=Οι αντι-μαγικοί μαχητές δέχονται 50% λιγότερη ζημιά και είναι πλήρως απρόσβλητοι από μαγικές επιθέσεις και μαγικές επιδράσεις.
actors.buffs.championenemy$giant.name=γιγάντιος μαχητής
actors.buffs.championenemy$giant.desc=Οι γιγάντιοι μαχητές δέχονται 80% λιγότερη ζημιά και οι επιθέσεις τους έχουν +1 εμβέλεια. Δεν μπορούν, όμως, να μετακινηθούν σε στενούς χώρους.
actors.buffs.championenemy$blessed.name=ευλογημένος μαχητής
actors.buffs.championenemy$blessed.desc=Οι ευλογημένοι μαχητές έχουν x4 ακρίβεια και αποφυγή.
actors.buffs.championenemy$growing.name=εξελισσόμενος μαχητής
actors.buffs.championenemy$growing.desc=Οι εξελισσόμενοι μαχητές αυξάνουν σταδιακά την ακρίβεια, την αποφυγή, και τη φυσιολογική τους ζημιά. Μειώνουν, επίσης, σταδιακά την ποσότητα ζημιάς που δέχονται.\n\nΤρέχουσα αύξηση σε ακρ/απφ/επθ: %1$d%%\nΤρέχουσα μείωση ζημιάς: %2$d%%

actors.buffs.charm.name=γοητεία
actors.buffs.charm.heromsg=Έχεις γοητευτεί!
actors.buffs.charm.cant_attack=Έχεις γοητευθεί από αυτόν τον εχθρό και δεν μπορείς να του επιτεθείς.
actors.buffs.charm.desc=Η γοητεία είναι μια χειριστική μαγεία που κάνει δύο εχθρούς να λατρεύονται προσωρινά.\n\nΟι γοητευμένοι χαρακτήρες δεν μπορούν να επιτεθούν άμεσα στον εχθρό που τους γοήτευσε. Μπορούν, φυσικά, να επιτεθούν σε άλλους στόχους. Το σοκ από πρόκληση πόνου μειώνει τη διάρκεια της γοητείας.\n\nΓύροι γοητείας που απομένουν: %s.

actors.buffs.chill.name=ψύχος
actors.buffs.chill.freezes=Ένα %s πάγωσε!
actors.buffs.chill.desc=Δεν το λες πάγωμα, αλλά είναι μεγάλο το κρύο.\n\nΟι κρυωμένοι χαρακτήρες εκτελούν ενέργειες πιο αργά, ανάλογα με τους γύρους που απομένουν στην επίδραση. Στη χειρότερη περίπτωση θα αντιστοιχεί με την επίδραση επιβράδυνσης.\n\nΓύροι ψύχους που απομένουν: %1$s.\nΗ ταχύτητα είναι μειωμένη κατά: %2$s%%

actors.buffs.combo.name=διαδοχή χτυπημάτων
actors.buffs.combo.action_name=επίθεση διαδοχής
actors.buffs.combo.combo=Διαδοχή %d χτυπημάτων!
actors.buffs.combo.bad_target=Ο στόχος πρέπει να είναι εχθρός εντός εμβέλειας.
actors.buffs.combo.prompt=Επίλεξε έναν στόχο για να επιτεθείς.
actors.buffs.combo.desc=Ο Μονομάχος ανεβάζει την ορμή του με κάθε του επιτυχημένο χτύπημα. Κάθε επίθεση αυξάνει τη διαδοχή χτυπημάτων κατά ένα. Αν αργήσει πολύ μεταξύ χτυπημάτων, ο μετρητής διαδοχής θα επανέλθει στο 0. Όσο ο Μονομάχος έχει διαδοχή, η προστασία από την σπασμένη σφραγίδα του δεν θα ξεκινήσει να μειώνεται.\n\nΗ αύξηση της διαδοχής ξεκλειδώνει ειδικές επιθέσεις που δεν αστοχούν ποτέ! Από μία διαφορετική επίθεση ξεκλειδώνεται στις διαδοχές 2, 4, 6, 8, και 10. Κάποιες ειδικές επιθέσεις επαναφέρουν τη διαδοχή και άλλες όχι – αλλά κάθε επίθεση μπορεί να χρησιμοποιηθεί μόνο μία φορά σε κάθε ακολουθία διαδοχών.\n\nΤρέχουσα διαδοχή: %1$d.\n\nΓύροι μέχρι να χαθεί η διαδοχή: %2$s.
actors.buffs.combo$combomove.clobber.name=σπρωξιά
actors.buffs.combo$combomove.clobber.desc=Στέλνει έναν εχθρό 2 τετράγωνα πίσω, αλλά δεν προκαλεί ζημιά και δεν μπορεί να σπρώξει σε χάσμα. Αυξάνει τη διαδοχή κατά 1.
actors.buffs.combo$combomove.clobber.empower_desc=Πετά έναν εχθρό _3 τετράγωνα πίσω, του προκαλεί ζαλάδα και μπορεί να τον ρίξει σε χάσμα,_ αλλά δεν προκαλεί ζημιά. Αυξάνει τη διαδοχή κατά 1.
actors.buffs.combo$combomove.slam.name=κοπάνημα
actors.buffs.combo$combomove.slam.desc=Προκαλεί %d%% (διαδοχή x 20%%) της αμυντικής σου ισχύος ως επιπλέον ζημιά. Μηδενίζει τη διαδοχή.
actors.buffs.combo$combomove.slam.empower_desc=_Κάνει άλμα σε έως %1$d τετράγωνο/α_ και προκαλεί %2$d%% (διαδοχή x 20%%) της αμυντικής σου ισχύος ως επιπλέον ζημιά. Μηδενίζει τη διαδοχή.
actors.buffs.combo$combomove.parry.name=αντεπίθεση
actors.buffs.combo$combomove.parry.desc=Αποκρούει την επόμενη επίθεση μέσα σε 1 γύρο και αντεπιτίθεται αμέσως. Η διαδοχή μηδενίζεται αν δεν αποκρουστεί κάτι.
actors.buffs.combo$combomove.parry.empower_desc=Αποκρούει _όλες τις επιθέσεις_ μέσα σε 1 γύρο και αντεπιτίθεται αμέσως σε αυτές. Η διαδοχή μηδενίζεται αν δεν αποκρουστεί κάτι.
actors.buffs.combo$combomove.crush.name=σύνθλιψη
actors.buffs.combo$combomove.crush.desc=Προκαλεί %d%% (διαδοχή x 25%%) ζημιά στον κύριο στόχο – συν το μισό αυτής της ζημιάς σε μια περιοχή 7x7. Μηδενίζει τη διαδοχή.
actors.buffs.combo$combomove.crush.empower_desc=_Κάνει άλμα σε έως %1$d τετράγωνο/α_ και προκαλεί %2$d%% (διαδοχή x 25%%) ζημιά στον κύριο στόχο – συν το μισό αυτής της ζημιάς σε μια περιοχή 7x7. Μηδενίζει τη διαδοχή.
actors.buffs.combo$combomove.fury.name=μανία
actors.buffs.combo$combomove.fury.desc=Χτυπά τον στόχο μία φορά για κάθε μονάδα διαδοχής σου· κάθε χτύπημα προκαλεί 60% ζημιά και μπορεί να ενεργοποιήσει τη μαγική ενίσχυση. Μηδενίζει τη διαδοχή.
actors.buffs.combo$combomove.fury.empower_desc=_Κάνει άλμα σε έως %d τετράγωνο/α_ και χτυπά έναν εχθρό μία φορά για κάθε διαδοχή που έχεις· κάθε χτύπημα προκαλεί 60%% ζημιά και μπορεί να ενεργοποιήσει τη μαγική ενίσχυση. Μηδενίζει τη διαδοχή.

actors.buffs.corruption.name=διαφθορά
actors.buffs.corruption.desc=Η διαφθορά εισχωρεί στην ουσία ενός πλάσματος και το στρέφει ενάντια στην προηγούμενη φύση του.\n\nΤα διεφθαρμένα πλάσματα επιτίθενται στους συμμάχους τους κι αγνοούν τους προηγούμενους εχθρούς τους. Η διαφθορά είναι επιζήμια για τον στόχο και θα καταλήξει στον θάνατό του.\n\nΗ διαφθορά είναι μόνιμη· η επίδρασή της τελειώνει μόνο με τον θάνατο.

actors.buffs.cripple.name=σακάτεμα
actors.buffs.cripple.heromsg=Έχεις σακατευτεί!
actors.buffs.cripple.desc=Έχεις την εντύπωση πως τα πόδια δε θα έπρεπε να λυγίζουν με αυτόν τον τρόπο.\n\nΤο σακάτεμα μειώνει την ταχύτητα κίνησης: η μετακίνηση σε ένα τετράγωνο συνήθως παίρνει δύο γύρους αντί για έναν.\n\nΓύροι σακατέματος που απομένουν: %s.

actors.buffs.daze.name=σάστισμα
actors.buffs.daze.heromsg=Έχεις σαστίσει!
actors.buffs.daze.desc=Το βουητό στα αυτιά και η θολή όραση δυσκολεύουν τη μάχη.\n\nΚατά το σάστισμα, η ακρίβεια και η αποφυγή του χαρακτήρα μειώνονται κατά 50%%, κάτι που καθιστά πολύ πιο δύσκολο το να πετυχαίνει και να αποφεύγει χτυπήματα.\n\nΓύροι σαστίσματος που απομένουν: %s.

actors.buffs.degrade.name=υποβάθμιση
actors.buffs.degrade.heromsg=Ο εξοπλισμός σου μοιάζει αποδυναμωμένος!
actors.buffs.degrade.desc=Ισχυρή σκοτεινή μαγεία απορροφά τη δύναμη που έχουν προσδώσει οι πάπυροι αναβάθμισης στον εξοπλισμό σου!\n\nΌσο ο εξοπλισμός είναι υποβαθμισμένος, θα αντιμετωπίζεται σαν χαμηλότερου επιπέδου από ό,τι είναι. _Κάθε αναβάθμιση μετά την +3 γίνεται εκθετικά πιο αδύναμη από την προηγούμενη._ Οι περιγραφές των αντικειμένων θα αλλάξουν ώστε να αποτυπώνουν τη μειωμένη δύναμή τους.\n\nΗ υποβάθμιση δεν επηρεάζει τις προϋποθέσεις δύναμης, τα φορτία ραβδιών, την ανθεκτικότητα των όπλων ρίψης και τα τεχνουργήματα.\n\nΓύροι υποβάθμισης που απομένουν: %s. Με τη χρήση ενός παπύρου αναβάθμισης ή αφαίρεσης κατάρας, η υποβάθμιση θα σταματήσει αμέσως.

actors.buffs.doom.name=καταδίκη
actors.buffs.doom.desc=Δύσκολο να τα βγάλεις πέρα, όταν όλο το σύμπαν συνωμοτεί εναντίον σου.\n\nΟι καταδικασμένοι χαρακτήρες δέχονται +67% ζημιά από όλες τις πηγές.\n\nΗ καταδίκη είναι μόνιμη· η επίδρασή της τελειώνει μόνο με τον θάνατο.

actors.buffs.dread.name=πανικός
actors.buffs.dread.desc=Ένας τρόμος τόσο ισχυρός, που ο στόχος εγκαταλείπει μια και καλή την κατακόμβη!\n\nΤα πανικόβλητα πλάσματα το σκάνε από τον εχθρό τους με μεγάλη ταχύτητα. Και μόλις είναι εκτός ορατού πεδίου, εξαφανίζονται εντελώς από την κατακόμβη. Οι εχθροί προσφέρουν τη μισή εμπειρία –και καθόλου λάφυρα– όταν τους ξεφορτώνεσαι με αυτόν τον τρόπο. Η πρόκληση πόνου μειώνει τη διάρκεια του πανικού.\n\nΓύροι πανικού που απομένουν: %d.

actors.buffs.drowsy.name=υπνηλία
actors.buffs.drowsy.desc=Μια μαγική δύναμη κάνει τον χαρακτήρα να δυσκολεύεται να παραμείνει ξύπνιος, και μετά από λίγους γύρους θα πέσει σε έναν βαθύ μαγικό ύπνο.\n\nΟ ήρωας μπορεί να αντισταθεί στην υπνηλία, δεχόμενος ζημιά ή με το να έχει πλήρη ζωή.\n\nΓύροι έως την αποκοίμηση: %s.

actors.buffs.earthimbue.name=γαιώδης εμποτισμός
actors.buffs.earthimbue.desc=Έχεις εμποτιστεί με τη δύναμη της γης!\n\nΌλες οι φυσιολογικές επιθέσεις μετατοπίζουν τη γη κάτω από τα πόδια του εχθρού, σακατεύοντάς τον για μικρό χρονικό διάστημα.\n\nΓύροι γαιώδους εμποτισμού που απομένουν: %s.

actors.buffs.enhancedrings.name=βελτιωμένα δαχτυλίδια
actors.buffs.enhancedrings.desc=Τα δαχτυλίδια του Κλέφτη ενδυναμώνονται από το πιο πρόσφατα χρησιμοποιημένο τεχνούργημα. Λαμβάνουν +1 επίπεδο. \nΓύροι που απομένουν: %s.

actors.buffs.fireimbue.name=πύρινος εμποτισμός
actors.buffs.fireimbue.desc=Έχεις εμποτιστεί με τη δύναμη του πυρός!\n\nΌλες οι φυσιολογικές επιθέσεις έχουν την πιθανότητα να κατακλύσουν τον εχθρό στις φλόγες. Επιπλέον, έχεις πλήρη ατρωσία από τις επιδράσεις της φωτιάς.\n\nΓύροι πύρινου εμποτισμού που απομένουν: %s.

actors.buffs.foresight.name=διορατικότητα
actors.buffs.foresight.desc=Με κάποιον τρόπο, μπορείς να αντιληφθείς τη διάταξη του γύρω εδάφους με το μυαλό σου.\n\nΌσο έχεις διορατικότητα, θα σου αποκαλύπτεται κάθε τετράγωνο σε μια ευρεία ακτίνα. Αυτό συμπεριλαμβάνει τις κρυφές πόρτες και παγίδες.\n\nΓύροι διορατικότητας που απομένουν: %s.

actors.buffs.frost.name=πάγωμα
actors.buffs.frost.freezes=Ένα %s πάγωσε!
actors.buffs.frost.desc=Δεν έχει παγώσει ο ίδιος ο στόχος, αλλά έχει περικλειστεί από ένα τεράστιο κομμάτι πάγου.\n\nΤο πάγωμα δρα παρόμοια με την παράλυση, αφού το θύμα δεν μπορεί να κάνει οποιαδήποτε ενέργεια. Η διαφορά είναι πως ο πάγος θα σπάσει αμέσως μόλις το θύμα λάβει ζημιά, και η επίδραση θα ακυρωθεί.\n\nΓύροι παγώματος που απομένουν: %s.

actors.buffs.frostimbue.name=εμποτισμός πάγου
actors.buffs.frostimbue.desc=Έχεις εμποτιστεί με τη δύναμη του πάγου!\n\nΌλες οι φυσιολογικές σου επιθέσεις θα ψύχουν τον εχθρό όλο και περισσότερο. Επιπλέον, έχεις απόλυτη ατρωσία από το κρύο.\n\nΓύροι εμποτισμού πάγου που απομένουν: %s.

actors.buffs.fury.name=μανία
actors.buffs.fury.heromsg=Έχεις οργιστεί!
actors.buffs.fury.desc=Έχεις εξαγριωθεί. Οι εχθροί δεν θέλουν να σε δουν έτσι.\n\nΜια μεγάλη οργή καίει μέσα σου, που αυξάνει τη ζημιά που προκαλείς με φυσιολογικές επιθέσεις κατά 50%%.\n\nΗ μανία διατηρείται όσο η ζωή σου είναι κάτω από 50%%.

actors.buffs.blobimmunity.name=φράγμα αγνότητας
actors.buffs.blobimmunity.desc=Μια άγνωστη δύναμη σε περικλείει με ένα λεπτό προστατευτικό πεδίο, το οποίο προστατεύει από αιωρούμενες επιβλαβείς επιδράσεις.\n\nΘα έχεις ατρωσία από όλες τις επιδράσεις που σχετίζονται με το περιβάλλον για όσο υπάρχει το πεδίο.\n\nΓύροι ατρωσίας που απομένουν: %s.

actors.buffs.gravitychaostracker.name=Βαρυτικό χάος
actors.buffs.gravitychaostracker.desc_intro=Κάθε μερικούς γύρους, όλοι οι χαρακτήρες του τρέχοντος επιπέδου θα εκτοξεύονται προς μια τυχαία κατεύθυνση.
actors.buffs.gravitychaostracker.desc_positive=Πάντως, εσύ και οι σύμμαχοί σου φαίνεται πως δεν επηρεάζεστε.
actors.buffs.gravitychaostracker.desc_duration=Δεν είναι ξεκάθαρο για πόσο θα κρατήσει η επίδραση, αλλά δεν μπορεί να κρατήσει για πάντα.

actors.buffs.greaterhaste.name=ανώτερη βιασύνη
actors.buffs.greaterhaste.desc=Μια απίστευτη αύξηση ταχύτητας. Για μια στιγμή είναι λες και τα πάντα γύρω σου έχουν ακινητοποιηθεί.\n\nΥπό την επίδραση της ανώτερης βιασύνης οι ενέργειες μετακίνησης δεν απαιτούν καθόλου χρόνο, αλλά οι άλλες ενέργειες εκτελούνται με κανονική ταχύτητα. Κάθε βημα κίνησης καταναλώνει έναν γύρο ανώτερης βιασύνης.\n\nΓύροι ανώτερης βιασύνης που απομένουν: %d.

actors.buffs.haste.name=βιασύνη
actors.buffs.haste.desc=Μια ενέργεια κυλά στους μυς σου που σου επιτρέπει να τρέχεις με ασύλληπτη ταχύτητα!\n\nΌσο έχεις βιασύνη, θα τρέχεις με τριπλάσια ταχύτητα από την κανονική. Όλες τις άλλες ενέργειες θα τις εκτελείς με φυσιολογική ταχύτητα.\n\nΓύροι βιασύνης που απομένουν: %s.

actors.buffs.healing.name=γιατρειά
actors.buffs.healing.desc=Μια μαγική ενέργεια επουλώνει τις πληγές σου.\n\nΘα αναπληρώνεις χαμένη ζωή κάθε γύρο, έως ότου εξαντληθεί η μαγική ενέργεια. Η απόδοση της θεραπείας μειώνεται με τον χρόνο.\n\nΕπόμενη θεραπεία: %d.\n\nΘεραπεία που απομένει: %d.

actors.buffs.herodisguise.name=μεταμφίεση
actors.buffs.herodisguise.desc=Μια μαγεία ψευδαισθήσεων έχει μετατρέψει την εμφάνισή σου! Η επίδραση είναι καθαρά αισθητική, αλλά και πάλι φαίνεται πολύ παράξενη.\n\nΓύροι μεταμφίεσης που απομένουν: %s.

actors.buffs.hex.name=κατάρα
actors.buffs.hex.heromsg=Έχεις καταραστεί!
actors.buffs.hex.desc=Μια σκοτεινή μαγεία που απορροφά τη συγκέντρωση και μπερδεύει κάπως το θύμα.\n\nΗ κατάρα μειώνει την ακρίβεια και την αποφυγή κατά 20%%, καθιστώντας τον στόχο λιγότερο αποτελεσματικό στη μάχη.\n\nΓύροι κατάρας που απομένουν: %s.

actors.buffs.holdfast.name=γερό κράτημα
actors.buffs.holdfast.desc=Ο Πολεμιστής διατηρεί τη θέση του, αυξάνοντας την πανοπλία του κατά %1$d-%2$d και επιβραδύνοντας τον ρυθμό μείωσης κάποιων θετικών επιδράσεων κατά %3$d%%. Αυτό θα διαρκέσει μέχρι να μετακινηθεί.

actors.buffs.hunger.hungry=πείνα
actors.buffs.hunger.starving=λιμοκτονία
actors.buffs.hunger.onhungry=Πεινάς.
actors.buffs.hunger.onstarving=Λιμοκτονείς!
actors.buffs.hunger.ondeath=Πέθανες από την πείνα...
actors.buffs.hunger.cursedhorn=Το καταραμένο κέρας κλέβει μέρος της τροφικής ενέργειας καθώς τρως.
actors.buffs.hunger.rankings_desc=Λιμοκτόνησες
actors.buffs.hunger.desc_intro_hungry=Νιώθεις το στομάχι σου να γουργουρίζει, αλλά δεν είναι άμεση ανάγκη ακόμα.
actors.buffs.hunger.desc_intro_starving=Πεινάς τόσο πολύ που είναι, πλέον, επώδυνο.
actors.buffs.hunger.desc=\n\nΗ πείνα σου αυξάνεται όσο περνάς χρόνο στην κατακόμβη, και κάποια στιγμή αρχίζεις να λιμοκτονείς. Όσο λιμοκτονείς, θα χάνεις ζωή με την πάροδο του χρόνου αντί να την ανακτάς.\n\nΗ διαχείριση των μερίδων είναι σημαντική! Αν έχεις ζωή να σπαταλήσεις, ίσως αξίζει να λιμοκτονήσεις για λίγο ώστε να κάνεις οικονομία στο φαγητό. Η σωστή διαχείριση θα κάνει το φαγητό σου να διαρκέσει πολύ περισσότερο!

actors.buffs.invisibility.name=αορατότητα
actors.buffs.invisibility.desc=Έχεις κρυφτεί τόσο καλά στο περιβάλλον που είναι αδύνατο να σε διακρίνει κανείς.\n\nΌσο έχεις αορατότητα, οι εχθροί δεν σου επιτίθενται ούτε σε ακολουθούν. Οι φυσιολογικές επιθέσεις, ή οι μαγικές επιδράσεις (όπως από πάπυρο ή ραβδί), θα ακυρώσουν αμέσως την αορατότητα.\n\nΓύροι αορατότητας που απομένουν: %s.

actors.buffs.invulnerability.name=ατρωσία
actors.buffs.invulnerability.desc=Αυτός ο χαρακτήρας έχει εμποτιστεί με μια ισχυρή προστατευτική δύναμη που του παρέχει μια μικρή περίοδο ατρωσίας!\n\nΓύροι που απομένουν: %s.

actors.buffs.levitation.name=αιώρηση
actors.buffs.levitation.desc=Μια μαγική δύναμη που σε ανυψώνει από το έδαφος· νιώθεις σαν να μην έχεις καθόλου βάρος.\n\nΟι χαρακτήρες που αιωρούνται κινούνται αθόρυβα και παρακάμπτουν όλες τις επιδράσεις που προέρχονται από το έδαφος. Οι παγίδες δεν ενεργοποιούνται, το νερό δεν σβήνει τη φωτιά τους, τα φυτά δεν ποδοπατιούνται, οι ρίζες δεν τους αγγίζουν, ίπτανται πάνω από τα χάσματα. Προσοχή, όμως, γιατί όλες αυτές οι επιδράσεις μπορεί να συμβούν όταν τελειώσει η επίδραση και πέσει ο χαρακτήρας στο έδαφος!\n\nΓύροι αιώρησης που απομένουν: %s.

actors.buffs.lifelink.name=σύνδεσμος ζωής
actors.buffs.lifelink.ondeath=Η ζημιά από τον σύνδεσμο ζωής σε εξόντωσε...
actors.buffs.lifelink.desc=Η ισχύς ζωής αυτού του χαρακτήρα είναι συνδεδεμένη με έναν άλλον κοντινό στόχο. Κάθε ληφθείσα ζημιά μοιράζεται μεταξύ τους.\n\nΌποτε αυτός ο χαρακτήρας λαμβάνει ζημιά, η μισή θα προκληθεί στον σύνδεσμο ζωής του αντί για τον ίδιο.\n\nΓύροι συνδέσμου ζωής που απομένουν: %s .

actors.buffs.light.name=φωτισμός
actors.buffs.light.desc=Ακόμα και στην σκοτεινότερη κατακόμβη, ένα σταθερό φως στο πλάι σου είναι πάντα μια καλή συντροφιά.\n\nΟ φωτισμός σού επιτρέπει να βλέπεις σε μια αξιοπρεπή ακτίνα γύρω σου παρά το σκοτεινό περιβάλλον.\n\nΓύροι φωτισμού που απομένουν: %s.

actors.buffs.lockedfloor.name=κλειδωμένο επίπεδο
actors.buffs.lockedfloor.desc=Το επίπεδο αυτό είναι κλειδωμένο· δεν μπορείς να φύγεις!\n\nΌσο το επίπεδο είναι κλειδωμένο, η πείνα σου δεν επιδεινώνεται και δεν χάνεις ζωή από λιμοκτονία. Επιπλέον, όσο δεν προσπαθείς να νικήσεις το αφεντικό, οι παθητικές αναπληρώσεις –όπως η αναπλήρωση ζωής και η επαναφόρτιση τεχνουργημάτων– σταματούν.\n\nΤέλος, εάν αναστηθείς από ένα μη ευλογημένο ανκχ κατά τη διάρκεια του κλειδώματος, το επίπεδο θα επανέλθει στην αρχική του κατάσταση.\n\nΕξόντωσε το αφεντικό του επιπέδου για να σπάσεις το κλείδωμα.

actors.buffs.lostinventory.name=χαμένα εφόδια
actors.buffs.lostinventory.desc=Ο αποθηκευτικός σου χώρος έχει χαθεί κάπου στην κατακόμβη! Δε θα μπορείς να μαζέψεις ή να χρησιμοποιήσεις τα περισσότερα αντικείμενα, μέχρι να τον ανακτήσεις.

actors.buffs.magicalsight.name=μαγική όραση
actors.buffs.magicalsight.desc=Με κάποιον τρόπο, μπορείς να βλέπεις με το μυαλό αντί για τα μάτια σου.\n\nΌσο η μαγική όραση είναι ενεργή, θα μπορείς να βλέπεις μέσα από κάθε συμπαγή περιοχή (π.χ. τοίχους) σε έκταση 12 τετραγώνων.\n\nΓύροι μαγικής όρασης που απομένουν: %s.

actors.buffs.magicalsleep.name=μαγικός ύπνος
actors.buffs.magicalsleep.toohealthy=Παραείσαι υγιής και αντιστέκεσαι στην υπνηλία.
actors.buffs.magicalsleep.fallasleep=Πέφτεις σε έναν βαθύ, μαγικό ύπνο.
actors.buffs.magicalsleep.wakeup=Ξυπνάς με μια αίσθηση φρεσκάδας κι ευεξίας.
actors.buffs.magicalsleep.desc=Ο χαρακτήρας έχει πέσει σε έναν βαθύ μαγικό ύπνο, από τον οποίο δεν πρόκειται να ξυπνήσει φυσιολογικά.\n\nΟ μαγικός ύπνος είναι σαν τον κανονικό, με τη διαφορά πως μόνο η λήψη ζημιάς μπορεί να κάνει τον χαρακτήρα να ξυπνήσει.\n\nΓια τον ήρωα και τους συμμάχους του, ο μαγικός ύπνος έχει αναζωογονητικές ιδιότητες: τους επιτρέπει να θεραπεύονται για όσο ξεκουράζονται.

actors.buffs.magicimmune.name=ανοσία στη μαγεία
actors.buffs.magicimmune.desc=Οι μαγικές επιδράσεις έχουν χάσει την ισχύ τους επάνω σου· έχεις πλήρη ατρωσία από αυτές.\n\nΌσο έχεις μαγική ανοσία, καμία μαγεία –είτε καλή είτε κακή– δεν σε επηρεάζει. Αυτό περιλαμβάνει κατάρες, μαγικές ενισχύσεις, ραβδιά, παπύρους, δαχτυλίδια, τεχνουργήματα κ.λπ. Οι ικανότητες των ηρωικών πανοπλιών είναι αρκετά ισχυρές ώστε να λειτουργούν παρά την επίδραση αυτή.\n\nΓύροι μαγικής ανοσίας που απομένουν: %s.

actors.buffs.mindvision.name=ενόραση
actors.buffs.mindvision.desc=Με κάποιον τρόπο, μπορείς να αντιληφθείς όλα τα πλάσματα στο τρέχον επίπεδο με τη δύναμη του μυαλού σου. Είναι περίεργο το συναίσθημα.\n\nΌλοι οι χαρακτήρες στο τρέχον επίπεδο είναι ορατοί για όσο έχεις ενόραση. Ένα πλάσμα ορατό μέσω της ενόρασης επηρεάζεται από κάποιες μαγικές επιδράσεις σαν να ήταν άμεσα ορατό, ή δίπλα σου.\n\nΓύροι ενόρασης που απομένουν: %s.

actors.buffs.momentum.momentum=ανάπτυξη ορμής
actors.buffs.momentum.running=ελεύθερο τρέξιμο
actors.buffs.momentum.resting=ανάκαμψη
actors.buffs.momentum.action_name=ελεύθερο τρέξιμο
actors.buffs.momentum.momentum_desc=Ο Δρομέας συσσωρεύει ορμή όσο κινείται, την οποία μπορεί να καταναλώσει για να ξεκινήσει ελεύθερο τρέξιμο.\n\nΚάθε 1 φορτίο ορμής παρέχει 2 γύρους ελεύθερου τρεξίματος, και ο Δρομέας μπορεί να συσσωρεύσει έως και 10 φορτίο. Η ορμή χάνεται γρήγορα αν ο Δρομέας σταματήσει να κινείται.\n\nΤρέχον φορτίο ορμής: %d.
actors.buffs.momentum.running_desc=Ο Δρομέας συσσωρεύει ορμή όσο κινείται, την οποία μπορεί να ξοδέψει για να ξεκινήσει ελεύθερο τρέξιμο.\n\nΟ Δρομέας κινείται με διπλάσια ταχύτητα στο ελεύθερο τρέξιμο και λαμβάνει επιπλέον αποφυγή ανάλογα με το επίπεδό του.\n\nΓύροι που απομένουν: %d.
actors.buffs.momentum.resting_desc=Ο Δρομέας συσσωρεύει ορμή όσο κινείται, και μπορεί να τη ξοδέψει για να αρχίσει ελεύθερο τρέξιμο.\n\nΟ Δρομέας χρειάζεται χρόνο για να αναπληρώσει την ενέργειά του πριν ξαναρχίσει να συσσωρεύει ορμή.\n\nΓύροι που απομένουν: %d.

actors.buffs.monkenergy.name=ενέργεια
actors.buffs.monkenergy.action=Μοναστικές ικανότητες
actors.buffs.monkenergy.desc=Όσο εξοντώνει εχθρούς, η Μοναχή αποκτά μια ενέργεια την οποία μπορεί να χρησιμοποιεί σε διάφορες ικανότητες. Οι περισσότεροι εχθροί δίνουν 1 ενέργεια όταν εξοντωθούν. Επιπλέον, η Μοναχή δεν χάνει ενέργεια με την πάροδο του χρόνου.\n\nΤρέχουσα ενέργεια: %1$d/%2$d.
actors.buffs.monkenergy.desc_cooldown=Η Μοναχή χρησιμοποίησε πρόσφατα μια ικανότητα και πρέπει να περιμένει πριν χρησιμοποιήσει κι άλλη.\n\nΤρέχουσα περίοδος αναπλήρωσης: %d γύροι.
actors.buffs.monkenergy$monkability$flurry.name=καταιγισμός χτυπημάτων
actors.buffs.monkenergy$monkability$flurry.desc=Δύο ακαριαία χτυπήματα που προκαλούν %1$d-%2$d ζημιά και παρακάμπτουν την πανοπλία. Η ικανότητα δεν μπορεί να χρησιμοποιηθεί επανειλημμένα.
actors.buffs.monkenergy$monkability$flurry.empower_desc=Δύο ακαριαία χτυπήματα που προκαλούν %1$d-%2$d ζημιά, παρακάμπτουν την πανοπλία _και χρησιμοποιούν τη μαγική ενίσχυση του όπλου._ Η ικανότητα δεν μπορεί να χρησιμοποιηθεί επανειλημμένα.
actors.buffs.monkenergy$monkability$focus.name=συγκέντρωση
actors.buffs.monkenergy$monkability$focus.desc=Η Μοναχή συγκεντρώνεται για έναν γύρο ώστε να αποκρούσει την επόμενη επίθεση εναντίον της.
actors.buffs.monkenergy$monkability$focus.empower_desc=Η Μοναχή _συγκεντρώνεται ακαριαία_ ώστε να αποκρούσει την επόμενη επίθεση εναντίον της.
actors.buffs.monkenergy$monkability$focus$focusbuff.name=συγκέντρωση
actors.buffs.monkenergy$monkability$focus$focusbuff.desc=Η Μοναχή έχει επικεντρωθεί στο γύρω περιβάλλον και αναμένει την επόμενη επίθεση εναντίον της. Όσο συγκεντρώνεται, είναι εγγυημένο ότι θα αποκρούσει την οποιαδήποτε επόμενη επίθεση.
actors.buffs.monkenergy$monkability$dash.name=αναπήδηση
actors.buffs.monkenergy$monkability$dash.prompt=Επίλεξε ένα σημείο
actors.buffs.monkenergy$monkability$dash.desc=Ακαριαία αναπήδηση σε ως 4 τετράγωνα. Μπορείς να πας πάνω από κακοτοπιές, αλλά όχι διαμέσω εχθρών ή συμπαγών περιοχών.
actors.buffs.monkenergy$monkability$dash.empower_desc=Ακαριαία αναπήδηση σε έως _8 τετράγωνα._ Μπορείς να πας πάνω από κακοτοπιές, αλλά όχι διαμέσω εχθρών ή συμπαγών περιοχών.
actors.buffs.monkenergy$monkability$dragonkick.name=λάκτισμα του δράκου
actors.buffs.monkenergy$monkability$dragonkick.desc=Ένα ισοπεδωτικό λάκτισμα που προκαλεί %1$d-%2$d ζημιά και παρακάμπτει την πανοπλία. Το λάκτισμα πετά τον στόχο μακριά και τον παραλύει για κάθε τετράγωνο που διέσχισε.
actors.buffs.monkenergy$monkability$dragonkick.empower_desc=Ένα ισοπεδωτικό λάκτισμα που προκαλεί _%1$d-%2$d ζημιά_ και παρακάμπτει την πανοπλία. Το λάκτισμα πετά τον στόχο μακριά και τον παραλύει για κάθε τετράγωνο που διέσχισε.
actors.buffs.monkenergy$monkability$meditate.name=διαλογισμός
actors.buffs.monkenergy$monkability$meditate.desc=Η Μοναχή συγκεντρώνει ενέργεια στο σώμα της για 5 γύρους. Εξαλείφει τις περισσότερες αρνητικές επιδράσεις και αποκτά 8 γύρους επαναφόρτισης ραβδιών & τεχνουργημάτων.
actors.buffs.monkenergy$monkability$meditate.empower_desc=Η Μοναχή συγκεντρώνει ενέργεια στο σώμα της για 5 γύρους. Εξαλείφει τις περισσότερες αρνητικές επιδράσεις και αποκτά 8 γύρους επαναφόρτισης ραβδιών & τεχνουργημάτων. _Αποκτά επίσης 80% αντοχή στη ζημιά ενώ διαλογίζεται και αναπληρώνει αργά το 20% της χαμένης ζωής._

actors.buffs.ooze.name=καυστική γλίτσα
actors.buffs.ooze.heromsg=Η καυστική γλίτσα σού καίει τη σάρκα. Ξέπλυνέ τη γρήγορα!
actors.buffs.ooze.ondeath=Έλιωσες...
actors.buffs.ooze.rankings_desc=Διαλύθηκες στην καυστική γλίτσα
actors.buffs.ooze.desc=Αυτό το κολλώδες οξύ προσκολλάται στη σάρκα, λιώνοντάς τη σιγά σιγά.\n\nΗ καυστική γλίτσα προκαλεί σταθερή ζημιά με το πέρασμα του χρόνου, αλλά μπορεί να ξεπλυθεί στο νερό αμέσως.\n\nΓύροι καυστικής γλίτσας που απομένουν: %s.

actors.buffs.paralysis.name=παράλυση
actors.buffs.paralysis.heromsg=Έχεις παραλύσει!
actors.buffs.paralysis.out=Αντίσταση στην παράλυση
actors.buffs.paralysis.desc=Κάποιες φορές, το χειρότερο πράγμα είναι να μην κάνεις τίποτα.\n\nΗ παράλυση σταματάει όλες τις ενέργειες, αναγκάζοντας τον στόχο να περιμένει μέχρι να εξασθενήσει η επίδραση. Ο πόνος από τη λήψη ζημιάς μπορεί να κάνει τον στόχο να αντισταθεί στην παράλυση, ελευθερώνοντάς τον από την επίδραση.\n\nΓύροι παράλυσης που απομένουν: %s.

actors.buffs.physicalempower.name=σωματική ενδυνάμωση
actors.buffs.physicalempower.desc=Τα χτυπήματά σου έχουν ενδυναμωθεί. Αυξάνεται το μέγεθος της ζημιάς που προκαλείς όταν χτυπάς εχθρούς με φυσιολογικές επιθέσεις.\n\nΕπιπλέον ζημιά: %1$d.\nΧτυπήματα που απομένουν: %2$d.

actors.buffs.pincushion.name=σουρωτήρι
actors.buffs.pincushion.desc=Τα όπλα ρίψης που έχεις πετάξει σε αυτόν τον χαρακτήρα έχουν προσκολληθεί επάνω του. Θα πέσουν στο έδαφος μόλις εξοντωθεί.\n\nΤα ακόλουθα αντικείμενα είναι προσκολλημένα:

actors.buffs.poison.name=δηλητηρίαση
actors.buffs.poison.heromsg=Έχεις δηλητηριαστεί!
actors.buffs.poison.ondeath=Πέθανες από δηλητήριο...
actors.buffs.poison.rankings_desc=Υπέκυψες στο δηλητήριο
actors.buffs.poison.desc=Το δηλητήριο βρίσκει τον δρόμο του στο σώμα και καταστρέφει αργά τις εσωτερικές του λειτουργίες.\n\nΗ δηλητηρίαση προκαλεί ζημιά ανά γύρο, αναλογική με τους γύρους που απομένουν μέχρι τη λήξη της.\n\nΓύροι δηλητηρίασης που απομένουν: %s.

actors.buffs.preparation.name=προετοιμασία
actors.buffs.preparation.action_name=προετοιμασμένο χτύπημα
actors.buffs.preparation.desc=Ο Δολοφόνος περιμένει υπομονετικά, έτοιμος να χτυπήσει από τις σκιές.
actors.buffs.preparation.desc_dmg=Η επόμενη επίθεσή του θα προκαλέσει _%1$d%% επιπλέον ζημιά._ Θα εκτελέσει κανονικούς εχθρούς με κάτω από _%2$d%% ζωή_ και αφεντικά με κάτω από _%3$d%% ζωή._
actors.buffs.preparation.desc_dmg_likely=Επίσης, η επίθεση έχει περισσότερες πιθανότητες να προκαλέσει μεγαλύτερη ζημιά.
actors.buffs.preparation.desc_blink=Μπορεί να αναπηδήσει αστραπιαία προς έναν εχθρό πριν τον χτυπήσει, με μέγιστη απόσταση _%d._
actors.buffs.preparation.desc_invis_time=Γύροι υπό αορατότητα: _%d._
actors.buffs.preparation.desc_invis_next=Γύροι για ισχυρότερη επίθεση: _%d._
actors.buffs.preparation.prompt=Διάλεξε έναν στόχο να επιτεθείς!\nΜέγιστη απόσταση αναπήδησης: %d
actors.buffs.preparation.no_target=Δεν υπάρχει στόχος για επίθεση εδώ.
actors.buffs.preparation.out_of_reach=Ο στόχος είναι εκτός εμβέλειας.
actors.buffs.preparation.assassinated=Εκτελέστηκε

actors.buffs.prismaticguard.name=πρισματικός φρουρός
actors.buffs.prismaticguard.desc=Προστατεύεσαι από μία πρισματική εικόνα που είναι προς το παρόν ανενεργή. Όταν υπάρχουν κοντινοί εχθροί, η πρισματική εικόνα ξεχύνεται να σε προστατεύσει!\n\nΌσο είναι ανενεργή, θα θεραπεύεται σταθερά από όση ζημιά έχει υποστεί.\n\nΤρέχουσα ζωή: %d/%d.
actors.buffs.prismaticguard.desc_many=Αυτή η πρισματική εικόνα επωφελείται κι αυτή από την ισχύ των πολλών. Γύροι που απομένουν: %d.

actors.buffs.recharging.name=επαναφόρτιση
actors.buffs.recharging.desc=Μέσα σου κυλά μια ενέργεια που αυξάνει τον ρυθμό φόρτισης των ραβδιών και της μαγικής ράβδου.\n\nΗ επίδραση αυξάνει το φορτίο κατά ένα τέταρτο ανά γύρο, προσθετικά με τον κανονικό ρυθμό φόρτισης.\n\nΓύροι επαναφόρτισης που απομένουν: %s.

actors.buffs.revealedarea.name=αποκαλυμμένη περιοχή
actors.buffs.revealedarea.desc=Μία περιοχή της κατακόμβης έχει αποκαλυφθεί προσωρινά στον ήρωα. Θα τη βλέπει ασχέτως από το πού βρίσκεται.\n\nΓύροι που απομένουν: %s.

actors.buffs.revealedchar.name=αποκάλυψη
actors.buffs.revealedchar.desc=Αυτός ο χαρακτήρας έχει αποκαλυφθεί στον ήρωα· θα είναι ορατός ανεξάρτητα από το πού βρίσκεται.\n\nΓύροι που απομένουν: %s.

actors.buffs.roots.name=ρίζωμα
actors.buffs.roots.heromsg=Δεν μπορείς να κινηθείς!
actors.buffs.roots.desc=Ρίζες (φυσικές ή μαγικές) γραπώνουν τα πόδια και τα κρατούν στο έδαφος.\n\nΟι ρίζες καθηλώνουν τον στόχο στο σημείο που βρίσκεται, κάνοντας αδύνατη τη μετακίνηση καθώς και τις περισσότερες ικανότητες μετακίνησης. Άλλες ενέργειες, όπως η τηλεμεταφορά, δεν επηρεάζονται.\n\nΓύροι ριζώματος που απομένουν: %s.

actors.buffs.scrollempower.name=παπυρική ενδυνάμωση
actors.buffs.scrollempower.desc=Η ενέργεια από τον πιο πρόσφατα διαβασμένο πάπυρο ενδυναμώνει τα ραβδιά του Μάγου! \n\nΑύξηση επιπέδου: +%1$d.\nΡιπές που απομένουν: %2$d.

actors.buffs.shadows.name=ένα με τις σκιές
actors.buffs.shadows.desc=Γίνεσαι ένα με τις σκιές γύρω σου· αποκτάς αορατότητα και ο μεταβολισμός σου χαμηλώνει.\n\nΌσο έχεις αορατότητα, οι εχθροί δεν μπορούν να σου επιτεθούν ή να σε ακολουθήσουν. Οι περισσότερες φυσιολογικές επιθέσεις και μαγικές επιδράσεις (όπως από παπύρους ή ραβδιά) θα ακυρώσουν αμέσως την αορατότητα. Επίσης, ο ρυθμός της πείνας σου μειώνεται όσο ενώνεσαι με τις σκιές.\n\nΘα μείνεις σε ανάμειξη με τις σκιές μέχρι να φύγεις από αυτές, ή μέχρι ένας εχθρός να έρθει σε επαφή μαζί σου.

actors.buffs.slow.name=επιβράδυνση
actors.buffs.slow.desc=Μια επιβραδυντική μαγεία επηρεάζει τη ροή του χρόνου· όλα φαίνονται πως κινούνται ταχύτατα.\n\nΈνας επιβραδυμένος χαρακτήρας εκτελεί όλες τις ενέργειες σε διπλάσιο χρόνο από αυτόν που θα χρειαζόταν φυσιολογικά.\n\nΓύροι επιβράδυνσης που απομένουν: %s.

actors.buffs.snipersmark.name=σημάδι της Σκοπεύτριας
actors.buffs.snipersmark.action_name_snapshot=ταχεία βολή
actors.buffs.snipersmark.action_name_volley=ομοβροντία
actors.buffs.snipersmark.action_name_sniper=στοχευμένη βολή
actors.buffs.snipersmark.desc=Η Σκοπεύτρια επικεντρώνεται στον στόχο που επιτέθηκε πιο πρόσφατα. Μπορεί να εκτελέσει μία ειδική επίθεση με το τόξο που ποικίλλει βάσει του πώς είναι ενδυναμωμένο.\n\nΈνα μη ενδυναμωμένο τόξο θα ρίξει μία _Ταχεία βολή_ που, παρότι προκαλεί μειωμένη ζημιά, δεν απαιτεί χρόνο να εκτελεστεί.\n\nΈνα τόξο ενδυναμωμένο για ταχύτητα θα ρίξει μία _Ομοβροντία_ τριών βελών. Το κάθε βέλος προκαλεί μειωμένη ζημιά, αλλά μπορεί να ενεργοποιήσει τη μαγική ενίσχυση. Η ομοβροντία απαιτεί 1 γύρο.\n\nΈνα τόξο ενδυναμωμένο για ζημιά θα ρίξει μία _Σκοπευτική βολή._ Αυτή η βολή χτυπά εγγυημένα, προκαλεί επιπλέον ζημιά ανάλογα με την απόσταση του στόχου και απαιτεί 2 γύρους.\n\nΓύροι που απομένουν: %s.

actors.buffs.soulmark.name=ψυχικό σημάδι
actors.buffs.soulmark.desc=Ο Αρχιμάγος ενώθηκε με την ψυχή αυτού του πλάσματος· θα θεραπεύεται όσο το πλάσμα λαμβάνει φυσιολογική ζημιά.\n\nΓύροι σημαδιού ψυχής που απομένουν: %s.

actors.buffs.stamina.name=αντοχή
actors.buffs.stamina.desc=Έχεις ατέρμονη αντοχή, που σου επιτρέπει ταχύτερη κίνηση!\n\nΥπό την επήρεια της αντοχής, θα μπορείς να τρέχεις με +50%% ταχύτητα. Όλες τις άλλες ενέργειες θα τις εκτελείς με φυσιολογική ταχύτητα.\n\nΓύροι αντοχής που απομένουν: %s.

actors.buffs.vulnerable.name=ευαλωτότητα
actors.buffs.vulnerable.heromsg=Νιώθεις ευθραυστότητα!
actors.buffs.vulnerable.desc=Η μαγεία ευαλωτότητας αυξάνει τη φυσιολογική ζημιά που λαμβάνει το θύμα κατά 33%% – αφού πρώτα αφαιρεθεί η τιμή της αρχικής ζημιάς από την τιμή άμυνας της πανοπλίας.\n\nΓύροι ευαλωτότητας που απομένουν: %s.

actors.buffs.terror.name=τρόμος
actors.buffs.terror.desc=Ο τρόμος είναι μια χειριστική μαγεία που προκαλεί ανεξέλεγκτο φόβο στον στόχο.\n\nΟι τρομαγμένοι χαρακτήρες αναγκάζονται να το σκάσουν από τον αντίπαλό τους, βάζοντας όσες περισσότερες πόρτες και τοίχους μπορούν ανάμεσά τους. Ο πόνος θα ελαττώσει τη διάρκεια του τρόμου.\n\nΓύροι τρόμου που απομένουν: %s.

actors.buffs.toxicimbue.name=τοξικός εμποτισμός
actors.buffs.toxicimbue.desc=Έχεις εμποτιστεί με δηλητηριώδη ενέργεια!\n\nΑναδίδεις συνεχώς τοξικό αέριο καθώς κινείσαι, προκαλώντας ζημιά στους εχθρούς σου. Θα έχεις ανοσία στο τοξικό αέριο και το δηλητήριο κατά τη διάρκεια αυτής της επίδρασης και για λίγους γύρους μετά.\n\nΓύροι τοξικού εμποτισμού που απομένουν: %s.

actors.buffs.corrosion.name=διάβρωση
actors.buffs.corrosion.heromsg=Λιώνεις!
actors.buffs.corrosion.ondeath=Έλιωσες...
actors.buffs.corrosion.rankings_desc=Διαλύθηκες στο οξύ
actors.buffs.corrosion.desc=Πανίσχυρο οξύ που λιώνει τη σάρκα, το μέταλλο και τα οστά με ανησυχητικό ρυθμό.\n\nΗ ζημιά διάβρωσης αυξάνεται σταδιακά όσο ο στόχος εξακολουθεί να λιώνει.\n\nΓύροι διάβρωσης που απομένουν: %1$s.\nΤρέχουσα ζημιά διάβρωσης: %2$d.

actors.buffs.vertigo.name=ζαλάδα
actors.buffs.vertigo.desc=Είναι δύσκολο να προχωράς ευθεία όταν τα πάντα στριφογυρίζουν.\n\nΈνας ζαλισμένος χαρακτήρας θα κατευθυνθεί σε μια τυχαία θέση, αντί εκείνης που προσπαθεί να μετακινηθεί.\n\nΓύροι ζαλάδας που απομένουν: %s

actors.buffs.wandempower.name=ενδυναμωμένα ραβδιά
actors.buffs.wandempower.desc=Τα ραβδιά σου που προκαλούν ζημιά έχουν ενδυναμωθεί. Η ζημιά που προκαλούν θα αυξηθεί για μερικές εξαπολύσεις.\n\nΕπιπλέον ζημιά: %1$d.\nΕξαπολύσεις που απομένουν: %2$d.

actors.buffs.weakness.name=αποδυνάμωση
actors.buffs.weakness.heromsg=Νιώθεις να αποδυναμώνεσαι!
actors.buffs.weakness.desc=Ξαφνικά, όλα γίνονται πολύ βαρύτερα.\n\nΗ αποδυναμωτική επίδραση μειώνει τη σωματική δύναμη του χαρακτήρα, κάνοντάς τον να προκαλεί 33%% λιγότερη ζημιά.\n\nΓύροι αποδυνάμωσης που απομένουν: %s.

actors.buffs.wellfed.name=χόρταση
actors.buffs.wellfed.desc=Το στομάχι σου είναι γεμάτο και νιώθεις ικανοποίηση.\n\nΌσο έχεις γεμάτο στομάχι, η πείνα σου δεν θα αυξάνεται. Επίσης, θα αναπληρώνεις επιπλέον ζωή με το πέρασμα του χρόνου.\n\nΓύροι χόρτασης που απομένουν: %d.



###hero

##abilities
actors.hero.abilities.armorability.self_target=Δεν μπορείς να στοχεύσεις τον εαυτό σου!
actors.hero.abilities.armorability.no_target=Δεν υπάρχει κάτι να στοχεύσεις εδώ!
actors.hero.abilities.armorability.prompt=Διάλεξε ένα σημείο να στοχεύσεις
actors.hero.abilities.armorability.cost=Κόστος φορτίου: _%d_

actors.hero.abilities.warrior.heroicleap.name=ηρωικό άλμα
actors.hero.abilities.warrior.heroicleap.prompt=Διάλεξε κατεύθυνση για να κάνεις άλμα
actors.hero.abilities.warrior.heroicleap.short_desc=Ο Πολεμιστής εκτελεί _Ηρωικό άλμα_ προς μια περιοχή, περνώντας πάνω από εχθρούς και κακοτοπιές.
actors.hero.abilities.warrior.heroicleap.desc=Ο Πολεμιστής κάνει άλμα προς την επιλεγμένη περιοχή, υπερπηδώντας εχθρούς και κακοτοπιές. Δεν μπορεί, όμως, να υπερπηδήσει τοίχους ή άλλες συμπαγείς περιοχές.
actors.hero.abilities.warrior.shockwave.name=ωστικό κύμα
actors.hero.abilities.warrior.shockwave.short_desc=Ο Πολεμιστής κοπανά το έδαφος και απελευθερώνει _Ωστικό κύμα_ σε κωνική περιοχή. Οι εχθροί που πιάνονται στο κύμα παίρνουν ζημιά και σακατεύονται.
actors.hero.abilities.warrior.shockwave.desc=Ο Πολεμιστής κοπανά το έδαφος. Αυτό παράγει ένα ωστικό κύμα που ταξιδεύει για έως 5 τετράγωνα, σε κώνο 60 μοιρών.\n\nΟι εχθροί που πιάνονται στο ωστικό κύμα σακατεύονται για 5 γύρους. Λαμβάνουν επίσης 5-10 ζημιά, συν 1-2 ζημιά για κάθε πόντο δύναμης του Πολεμιστή μετά τους πρώτους 10.
actors.hero.abilities.warrior.endure.name=υπομονή
actors.hero.abilities.warrior.endure$enduretracker.name=εκδίκηση
actors.hero.abilities.warrior.endure$enduretracker.desc=Ο Πολεμιστής προκαλεί επιπλέον ζημιά βάσει της ζημιάς που είχε δεχτεί όσο υπέμενε.\n\nΕπιπλέον ζημιά: %1$d\nΧτυπήματα που απομένουν: %2$d
actors.hero.abilities.warrior.endure.short_desc=Ο Πολεμιστής _Υπομένει:_ αδρανεί για αρκετούς γύρους αλλά με υψηλή αντοχή στη ζημιά. Έπειτα προκαλεί επιπλέον ζημιά βάσει του τι υπέμεινε.
actors.hero.abilities.warrior.endure.desc=Ο Πολεμιστής υπομένει για 3 γύρους και τρώει τη μισή ζημιά από κάθε πηγή. Η μείωση γίνεται πριν τις επιδράσεις αντοχής ζημιάς, όπως η πανοπλία.\n\nΤο επόμενό του χτύπημα εντός 10 γύρων προκαλεί μπόνους ζημιά ίση με το μισό της ζημιάς που του προκλήθηκε όσο υπέμενε – προτού εφαρμοστούν επιδράσεις μείωσης ζημιάς!\n\nΑν ο Πολεμιστής έχει διαδοχή, η χρήση της ικανότητας την παρατείνει για 3 γύρους.

actors.hero.abilities.mage.elementalblast.name=στοιχειακή έκρηξη
actors.hero.abilities.mage.elementalblast.no_staff=Δεν μπορείς να χρησιμοποιήσεις την ικανότητα χωρίς τη ράβδο.
actors.hero.abilities.mage.elementalblast.short_desc=Ο Μάγος προκαλεί μια _Στοιχειακή έκρηξη_ με τη ράβδο. Καλύπτει μεγάλη έκταση με μια επίδραση που ποικίλλει βάσει του εμποτισμένου ραβδιού.
actors.hero.abilities.mage.elementalblast.desc=Ο Μάγος προκαλεί μια έκρηξη μαγείας σε κυκλική περιοχή με ακτίνα έως 4 τετραγώνων και προκαλεί έως 15-25 ζημιά. Η επίδραση της στοιχειακής έκρηξης ποικίλλει ανάλογα με το ποιο ραβδί είναι εμποτισμένο στη ράβδο του Μάγου.
actors.hero.abilities.mage.elementalblast.generic_desc=Η επίδραση της στοιχειακής έκρηξης θα είναι παρόμοια με αυτής του ραβδιού, όταν εξαπολύει σε εχθρό ή σύμμαχο.
actors.hero.abilities.mage.wildmagic.name=ξέφρενη μαγεία
actors.hero.abilities.mage.wildmagic.no_wands=Δεν έχεις ραβδιά για να το κάνεις αυτό!
actors.hero.abilities.mage.wildmagic.short_desc=Ο Μάγος απελευθερώνει _Ξέφρενη μαγεία_ από τα ραβδιά του. Τα πυροδοτεί τυχαία και πολλαπλές φορές στον στόχο, σε έναν μόνο γύρο.
actors.hero.abilities.mage.wildmagic.desc=Ο Μάγος απελευθερώνει τη δύναμη των ραβδιών του και εξαπολύει με αυτά έως και 4 φορές σε έναν μόνο γύρο. Η ράβδος του Μάγου δεν συμπεριλαμβάνεται σε αυτήν την επίδραση.\n\nΚάθε ραβδί θα έχει το επίπεδό του ενισχυμένο κατά 2, μέχρι το +3. Η ικανότητα χρησιμοποιεί μισό φορτίο ραβδιού για κάθε εξαπόλυση, και κανένα ραβδί δεν μπορεί να πυροδοτηθεί πάνω από 2 φορές.
actors.hero.abilities.mage.warpbeacon.name=πομπός τηλεμεταφοράς
actors.hero.abilities.mage.warpbeacon.depths=Δεν μπορείς να τηλεμεταφερθείς μεταξύ επιπέδων!
actors.hero.abilities.mage.warpbeacon.locked_floor=Δεν μπορείς να φύγεις από ένα κλειδωμένο επίπεδο!
actors.hero.abilities.mage.warpbeacon.too_far=Εκείνη η θέση είναι πολύ μακρινή!
actors.hero.abilities.mage.warpbeacon.invalid_beacon=Δεν μπορείς να τοποθετήσεις πομπό εκεί!
actors.hero.abilities.mage.warpbeacon.window_desc=Ο πομπός σου είναι τοποθετημένος στο %dο επίπεδο.
actors.hero.abilities.mage.warpbeacon.window_tele=τηλεμεταφορά στον πομπό
actors.hero.abilities.mage.warpbeacon.window_clear=αποδέσμευση πομπού
actors.hero.abilities.mage.warpbeacon.window_cancel=Ακύρωση
actors.hero.abilities.mage.warpbeacon.short_desc=Ο Μάγος τοποθετεί έναν _Πομπό τηλεμεταφοράς_ στην τρέχουσα θέση, όπου μπορεί να τηλεμεταφερθεί ξανά ακαριαία.
actors.hero.abilities.mage.warpbeacon.desc=Ο Μάγος τοποθετεί έναν πομπό στον οποίο μπορεί να τηλεμεταφέρεται κατά βούληση. Η τοποθέτηση του πομπού απαιτεί έναν γύρο, αλλά η τηλεμεταφορά είναι ακαριαία.\n\nΟ Μάγος δεν μπορεί να τηλεμεταφερθεί μεταξύ επιπέδων, ούτε να καταλήξει σε απρόσιτα σημεία όπως τα κλειδωμένα δωμάτια. Μπορεί να τηλεμεταφερθεί και πάνω σε εχθρούς, σπρώχνοντάς τους παραδίπλα.

actors.hero.abilities.rogue.smokebomb.name=βόμβα καπνού
actors.hero.abilities.rogue.smokebomb.fov=You can only jump to an empty location in your field of view.
actors.hero.abilities.rogue.smokebomb.prompt=Διάλεξε την περιοχή άλματος
actors.hero.abilities.rogue.smokebomb$ninjalog.name=ξύλινο δόλωμα
actors.hero.abilities.rogue.smokebomb$ninjalog.desc=Παραδόξως, οι εχθροί δεν θέλουν πολύ για να πειστούν ότι αυτό το ξύλινο δόλωμα είναι ο Κλέφτης!
actors.hero.abilities.rogue.smokebomb$ninjalog.discover_hint=Μπορείς να βρεις αυτόν τον χαρακτήρα με την χρήση μια συγκεκριμένης ικανότητας πανοπλίας.
actors.hero.abilities.rogue.smokebomb.short_desc=Ο Κλέφτης ρίχνει κάτω μία _Βόμβα καπνού_ και αναπηδά μακριά. Τυφλώνει τους εχθρούς δίπλα στην παλιά του θέση.
actors.hero.abilities.rogue.smokebomb.desc=Ο Κλέφτης αφήνει κάτω μία βόμβα καπνού και αναπηδά μέχρι 6 τετράγωνα μακριά. Μπορεί να αναπηδήσει πάνω από εχθρούς και κακοτοπιές, αλλά όχι διαμέσω συμπαγών περιοχών όπως είναι οι τοίχοι.\n\nΟι διπλανοί εχθροί στην παλιά θέση του Κλέφτη τυφλώνονται για 5 γύρους.
actors.hero.abilities.rogue.deathmark.name=σημάδι θανάτου
actors.hero.abilities.rogue.deathmark.ally_target=Μπορείς να σημαδέψεις μόνο εχθρούς
actors.hero.abilities.rogue.deathmark.short_desc=Ο Κλέφτης βάζει _Σημάδι θανάτου_ στον στόχο. Οι σημαδεμένοι τρώνε επιπλέον ζημιά, αλλά δεν πεθαίνουν πριν φύγει το σημάδι.
actors.hero.abilities.rogue.deathmark.desc=Ο Κλέφτης σημαδεύει τον επιλεγμένο εχθρό και τον κάνει να λαμβάνει 25% επιπλέον ζημιά. Το σημάδι εφαρμόζεται αμέσως και διαρκεί 5 γύρους.\n\nΟι σημαδεμένοι εχθροί τρώνε επιπλέον ζημιά, αλλά δεν μπορούν να πεθάνουν έως ότου λήξει το σημάδι. Αν ο εχθρός έχει 0 ζωή όταν τελειώσει το σημάδι, θα πεθάνει αμέσως.
actors.hero.abilities.rogue.deathmark$deathmarktracker.name=σημάδι θανάτου
actors.hero.abilities.rogue.deathmark$deathmarktracker.desc=Αυτός ο εχθρός έχει σημαδευτεί. Θα λαμβάνει 25%% περισσότερη ζημιά, αλλά θα είναι ανίκανος να πεθάνει έως ότου τελειώσει το σημάδι.\n\nΓύροι που απομένουν: %s.
actors.hero.abilities.rogue.shadowclone.name=κλώνος-σκιά
actors.hero.abilities.rogue.shadowclone.short_desc=Ο Κλέφτης υλοποιεί έναν _Κλώνο-σκιά_ που μπορεί να κατευθύνεται και να βοηθά στη μάχη.
actors.hero.abilities.rogue.shadowclone.desc=Ο Κλέφτης υλοποιεί έναν σκιερό μίμο του εαυτού του, που μπορεί να κατευθύνεται και να βοηθά στη μάχη. Οι διαταγές στον κλώνο-σκιά δεν καταναλώνουν φορτίο.\n\nΟ κλώνος έχει 80 ζωή, καμία πανοπλία, και προκαλεί 10-20 ζημιά. Όλα αυτά μπορούν να βελτιωθούν με ταλέντα που επιτρέπουν στον κλώνο να ευνοείται από τα όπλα και την πανοπλία του ήρωα.
actors.hero.abilities.rogue.shadowclone$shadowally.name=κλέφτης-σκιά
actors.hero.abilities.rogue.shadowclone$shadowally.direct_defend=Ο κλώνος μετακινείται σε αυτήν τη θέση.
actors.hero.abilities.rogue.shadowclone$shadowally.direct_follow=Ο κλώνος σου ξεκινά να σε ακολουθεί.
actors.hero.abilities.rogue.shadowclone$shadowally.direct_attack=Ο κλώνος σου πάει για επίθεση!
actors.hero.abilities.rogue.shadowclone$shadowally.desc=Ένα αντίγραφο του Κλέφτη, φτιαγμένο από σκιώδες σκότος. Στέκεται εντελώς ακίνητο, με άδεια μάτια, και αναδίδει μικρές δέσμες σκότους σαν ατμό.\n\nΟ κλώνος δεν είναι τέλειο αντίγραφο του Κλέφτη, αλλά παραμένει ικανός μαχητής. Μπορεί να επωφεληθεί από τον εξοπλισμό του Κλέφτη με τα κατάλληλα ταλέντα.
actors.hero.abilities.rogue.shadowclone$shadowally.discover_hint=Μπορείς να βρεις αυτόν τον χαρακτήρα με την χρήση μια συγκεκριμένης ικανότητας πανοπλίας.

actors.hero.abilities.huntress.spectralblades.name=φασματικές λεπίδες
actors.hero.abilities.huntress.spectralblades.short_desc=Η Κυνηγός πετά _Φασματικές λεπίδες_ στον στόχο, προκαλώντας μια ποσότητα ζημιάς βάσει του όπλου που κρατά.
actors.hero.abilities.huntress.spectralblades.desc=Η Κυνηγός πετάει μία φασματική λεπίδα στον εχθρό. Αυτό δρα ως χτύπημα εξ αποστάσεως, προερχόμενο από το όπλο μάχης σώμα-με-σώμα της. Όλες οι επιδράσεις του όπλου μάχης σώμα-με-σώμα θα ενεργοποιηθούν, συμπεριλαμβανομένης της μαγικής ενίσχυσης.
actors.hero.abilities.huntress.naturespower.name=δύναμη της φύσης
actors.hero.abilities.huntress.naturespower.short_desc=Η Κυνηγός επικαλείται τη _Δύναμη της φύσης_. Η ταχύτητα κίνησής της και η ταχύτητα βολής του τόξου της αυξάνονται για ένα μικρό χρονικό διάστημα.
actors.hero.abilities.huntress.naturespower.desc=Η Κυνηγός ενδυναμώνει προσωρινά τον εαυτό της και το όπλο της με τη δύναμη της φύσης! Αυτό διαρκεί για 8 γύρους.\n\nΣε αυτόν τον χρόνο, η Κυνηγός κινείται με x2 ταχύτητα κι επιτίθεται 33% γρηγορότερα με το τόξο της. Οι επιπλέον επιδράσεις του τόξου δεν ενεργοποιούνται όταν η Σκοπεύτρια χρησιμοποιεί τις ειδικές της επιθέσεις.
actors.hero.abilities.huntress.naturespower$naturespowertracker.name=δύναμη της φύσης
actors.hero.abilities.huntress.naturespower$naturespowertracker.desc=Η Κυνηγός ενδυναμώνεται προσωρινά, αυξάνοντας την ταχύτητα κίνησης και την ταχύτητα επίθεσης με το τόξο της.\n\nΓύροι που απομένουν: %s.
actors.hero.abilities.huntress.spirithawk.name=πνευματικό γεράκι
actors.hero.abilities.huntress.spirithawk.no_space=Δεν υπάρχει ελεύθερος χώρος δίπλα σου.
actors.hero.abilities.huntress.spirithawk.short_desc=Η Κυνηγός καλεί το _Πνευματικό γεράκι·_ έναν σύμμαχο που ανιχνεύει περιοχές και αποσπά τους εχθρούς.
actors.hero.abilities.huntress.spirithawk.desc=Η Κυνηγός καλεί ένα συμμαχικό πνευματικό γεράκι. Μπορεί να κατευθύνεται με χρήση της ικανότητας ξανά, χωρίς κόστος φορτίου, και διαρκεί 100 γύρους.\n\nΈχει ελάχιστη ζωή κι επιθετική ισχύ, αλλά είναι γρήγορο, ευέλικτο κι ακριβές. Μοιράζεται συνεχώς το οπτικό του πεδίο με την Κυνηγό. Είναι άτρωτο από κάθε επίδραση που εκτείνεται στο περιβάλλον, όπως η φωτιά και τα αέρια. Δεν θα επιτεθεί, εκτός εάν διαταχθεί να το κάνει.
actors.hero.abilities.huntress.spirithawk$hawkally.name=πνευματικό γεράκι
actors.hero.abilities.huntress.spirithawk$hawkally.direct_defend=Το γεράκι μετακινείται σε αυτήν τη θέση.
actors.hero.abilities.huntress.spirithawk$hawkally.direct_follow=Το γεράκι σου ξεκινά να σε ακολουθεί.
actors.hero.abilities.huntress.spirithawk$hawkally.direct_attack=Το γεράκι σου πάει για επίθεση!
actors.hero.abilities.huntress.spirithawk$hawkally.desc=Ένα μαγικό γεράκι, επικαλεσμένο από την Κυνηγό. Λάμπει με ένα ζωηρό αιθέριο μπλε. Το κεφάλι του γυρίζει συνεχώς καθώς ελέγχει τη γύρω περιοχή.\n\nΑν και δεν είναι τρομερός μαχητής, η αντίληψη και η ταχύτητά του το κάνουν ιδανικό για ανίχνευση και αντιπερισπασμό εχθρών.
actors.hero.abilities.huntress.spirithawk$hawkally.desc_remaining=Γύροι που απομένουν: %d.
actors.hero.abilities.huntress.spirithawk$hawkally.desc_dodges=Εγγυημένες αποφυγές που απομένουν: %d.
actors.hero.abilities.huntress.spirithawk$hawkally.discover_hint=Μπορείς να βρεις αυτόν τον χαρακτήρα με την χρήση μια συγκεκριμένης ικανότητας πανοπλίας.

actors.hero.abilities.duelist.challenge.name=πρόκληση
actors.hero.abilities.duelist.challenge.prompt=Επίλεξε τον εχθρό που θα προκαλέσεις
actors.hero.abilities.duelist.challenge.already_dueling=Μπορείς να είσαι σε μία μόνο μονομαχία τη φορά.
actors.hero.abilities.duelist.challenge.ally_target=Μπορείς να προκαλείς μόνο εχθρούς.
actors.hero.abilities.duelist.challenge.unreachable_target=Πρέπει να μπορείς να φτάσεις τον στόχο.
actors.hero.abilities.duelist.challenge.distant_target=Αυτός ο εχθρός είναι πολύ μακριά για να προκληθεί.
actors.hero.abilities.duelist.challenge.short_desc=Η Ξιφομάχος _Προκαλεί_ έναν κοντινό εχθρό σε μονομαχία, παγώνοντας προσωρινά τους υπόλοιπους.
actors.hero.abilities.duelist.challenge.desc=Η Ξιφομάχος προκαλεί έναν κοντινό εχθρό σε μονομαχία. Αυτός αναγκάζεται να την πολεμήσει ενώ όλοι οι άλλοι εχθροί παγώνουν προσωρινά στον χρόνο.\n\nΟ στόχος πρέπει να είναι προσβάσιμος κι εντός 5 τετραγώνων από την Ξιφομάχο. Η μονομαχία διαρκεί έως ότου περάσουν 10 γύροι, εξοντωθεί ο εχθρός ή βρεθεί η Ξιφομάχος 6+ τετράγωνα μακριά.\n\nΟι παγωμένοι εχθροί είναι άτρωτοι. Οι σύμμαχοί σου δεν παγώνουν, αλλά ούτε και οι υπήκοοι αφεντικού που στοχοποιείται.
actors.hero.abilities.duelist.challenge$duelparticipant.name=συμμέτοχος μονομαχίας
actors.hero.abilities.duelist.challenge$duelparticipant.desc=Αυτός ο χαρακτήρας συμμετέχει σε μονομαχία. Τόσο αυτός όσο και οι σύμμαχοι/υπήκοοί του ενεργούν κανονικά, ενώ οι άλλοι χαρακτήρες παραμένουν παγωμένοι.\n\nΗ μονομαχία διαρκεί μέχρι να περάσει κάποιος χρόνος, μέχρι να εξοντωθεί ένας συμμέτοχος ή μέχρι να απομακρυνθεί ο ένας από τον άλλον για πάνω από 5 τετράγωνα.\n\nΓύροι που απομένουν: %d.
actors.hero.abilities.duelist.elementalstrike.name=στοιχειακό χτύπημα
actors.hero.abilities.duelist.elementalstrike.short_desc=Η Ξιφομάχος εκτελεί ένα _Στοιχειακό χτύπημα,_ απλώνοντας μια επίδραση σε κωνική περιοχή βάσει της ενίσχυσης του όπλου της.
actors.hero.abilities.duelist.elementalstrike.desc=Η Ξιφομάχος προκαλεί μια κανονική επίθεση σε εχθρό ή περιοχή, που πετυχαίνει εγγυημένα και εξαπλώνει μια μαγική επίδραση σε κώνο 65 μοιρών και ως 4 τετράγωνα μακριά. Η επίδραση ποικίλλει βάσει της μαγικής ενίσχυσης στο κύριο όπλο.
actors.hero.abilities.duelist.elementalstrike.generic_desc=Ένα στοιχειακό χτύπημα χωρίς μαγική ενίσχυση θα απελευθερώσει μια μικρή έκρηξη μαγείας, προκαλώντας 6-12 ζημιά σε όλους τους εχθρούς εντός εμβέλειας.
actors.hero.abilities.duelist.feint.name=προσποίηση
actors.hero.abilities.duelist.feint.prompt=Επίλεξε ένα σημείο για αναπήδηση
actors.hero.abilities.duelist.feint.too_far=Αυτό το σημείο δεν βρίσκεται δίπλα σου.
actors.hero.abilities.duelist.feint.bad_location=Δεν μπορείς να μετακινηθείς σε αυτό το σημείο.
actors.hero.abilities.duelist.feint.short_desc=Η Ξιφομάχος _Προσποιείται_ μια επίθεση και αναπηδά σε διπλανό τετράγωνο. Οι εχθροί θα επιτεθούν στην παλιά της θέση και θα μείνουν ανοιχτοί σε επίθεση.
actors.hero.abilities.duelist.feint.desc=Η Ξιφομάχος προσποιείται μια επίθεση και αναπηδά σε διπλανό τετράγωνο, αφήνοντας πίσω μια στιγμιαία εικόνα του εαυτού της. Οι εχθροί που επιτίθονταν στην Ξιφομάχο θα επιτεθούν αντ' αυτού στην εικόνα της.\n\nΟι εχθροί που επιτίθενται στην εικόνα αποσυντονίζονται, κάτι που ακυρώνει την επόμενή τους ενέργεια και τους αφήνει ανοιχτούς σε αιφνίδια επίθεση.

actors.hero.abilities.cleric.ascendedform.name=εξυψωμένη μορφή
actors.hero.abilities.cleric.ascendedform.short_desc=Ο Κληρικός υιοθετεί μια _Εξυψωμένη μορφή_ και λαμβάνει νέα ξόρκια, μεγάλη εμβέλεια επίθεσης και ασπίδα προστασίας.
actors.hero.abilities.cleric.ascendedform.desc=Ο Κληρικός εκπέμπει ιερή ενέργεια από τον εαυτό του και υιοθετεί μια λαμπερή μορφή για 10 γύρους. Σε αυτή τη μορφή, ο Κληρικός μπορεί να εκτελεί νέα ξόρκια και λαμβάνει 2 εμβέλεια επίθεσης και 30 ασπίδα προστασίας. Επιπλέον, κάθε ξόρκι που εκτελεί θα παρέχει 10 ασπίδα προστασίας για κάθε φορτίο ιερού τόμου που χρησιμοποιείται.\n\nΗ ασπίδα από την εξυψωμένη μορφή και τα ξόρκια της δεν μειώνονται φυσιολογικά, αλλά θα χαθούν αμέσως μόλις τελειώσει η εξυψωμένη μορφή. Η ικανότητα μπορεί να επαναχρησιμοποιηθεί για να ανανεωθεί η διάρκεια της εξυψωμένης μορφής.
actors.hero.abilities.cleric.ascendedform$ascendbuff.name=εξυψωμένη μορφή
actors.hero.abilities.cleric.ascendedform$ascendbuff.desc=Λαμπρή ενέργεια εκπέμπεται από το σώμα του Κληρικού. Σε αυτή τη μορφή ο Κληρικός λαμβάνει 2 εμβέλεια επίθεσης (από την ιερή ενέργεια που εκπέμπεται από αυτόν), καθώς και 10 ασπίδα για κάθε φορτίο ιερού τόμου που δαπανά. Μπορεί, επίσης, να εκτελεί τα ξόρκια που ξεκλειδώνονται από τα ταλέντα της εξυψωμένης μορφής.\n\nΗ ασπίδα της εξυψωμένης μορφής και τα ξόρκια της δεν μειώνονται φυσιολογικά, αλλά θα χαθούν αμέσως μόλις τελειώσει η εξυψωμένη μορφή.\n\nΤρέχουσα ασπίδα: %1$d.\nΓύροι που απομένουν: %2$d.
actors.hero.abilities.cleric.trinity.name=τριάδα
actors.hero.abilities.cleric.trinity.no_imbue=Η Τριάδα δεν έχει ορισμένη επίδραση για κάποια από τις μορφές της. Χρησιμοποίησε ένα από τα ξόρκια της!
actors.hero.abilities.cleric.trinity.no_duplicate=Η Τριάδα δεν μπορεί να διπλασιάσει μια επίδραση που έχεις ήδη εξοπλίσει!
actors.hero.abilities.cleric.trinity.ench_glyph_use=Η Τριάδα θα εφαρμόσει αυτήν την επίδραση για _%1$d γύρους_ με κόστος _%2$s φορτίο._
actors.hero.abilities.cleric.trinity.rare_ench_glyph_use=Η Τριάδα θα εφαρμόσει αυτήν την _ισχυρή_ επίδραση για _%1$d γύρους_ με κόστος _%2$s φορτίου._
actors.hero.abilities.cleric.trinity.wand_use=Η Τριάδα θα εξαπολύσει με αυτό το ραβδί στο _+%1$d,_ με κόστος _%2$s φορτίο._
actors.hero.abilities.cleric.trinity.wand_multi_use=Η Τριάδα θα εξαπολύσει με αυτό το ραβδί _πολλαπλών φορτίων_ στο _+%1$d,_ με κόστος _%2$s φορτίο._
actors.hero.abilities.cleric.trinity.thrown_use=Η τριάδα θα πετάξει αυτό το όπλο στο _+%1$d_ , με κόστος _%2$s φορτίο._
actors.hero.abilities.cleric.trinity.ring_use=Η Τριάδα θα εφαρμόσει την επίδραση αυτού του δαχτυλιδιού στο _+%1$d_ για 20 γύρους, με κόστος _%2$s φορτίο._
actors.hero.abilities.cleric.trinity.alchemiststoolkit_use=Η Τριάδα θα εφαρμόσει την ικανότητα απομακρυσμένης αλχημείας αυτού του τεχνουργήματος, με κόστος _%2$s φορτίο._
actors.hero.abilities.cleric.trinity.chaliceofblood_use=Η Τριάδα θα εφαρμόσει την παθητική επίδραση αναπλήρωσης ζωής αυτού του τεχνουργήματος στο _+%1$d_ για 20 γύρους, με κόστος _%2$s φορτίο._
actors.hero.abilities.cleric.trinity.driedrose_use=Η Τριάδα θα χρησιμοποιήσει την επίδραση αυτού του τεχνουργήματος ώστε να καλέσει ένα διεφθαρμένο φιλικό στοιχειό με την ζωή ενός _+%1$d_ φαντάσματος, με κόστος _%2$s φορτίο._
actors.hero.abilities.cleric.trinity.etherealchains_use=Trinity will apply this artifact's chain-casting effect with reach at _+%1$d_, at the cost of _%2$s charge._
actors.hero.abilities.cleric.trinity.hornofplenty_use=Trinity will apply this artifact's snacking effect, at the cost of _%2$s charge._
actors.hero.abilities.cleric.trinity.masterthievesarmband_use=Trinity will apply this artifact's enemy robbing effect at _+%1$d_, at the cost of _%2$s charge._
actors.hero.abilities.cleric.trinity.sandalsofnature_use=Trinity will apply this artifact's root effect with a random harmful seed, at the cost of _%2$s charge._
actors.hero.abilities.cleric.trinity.skeletonkey=Trinity will apply this artifact's insert effect, at the cost of _%2$s charge._
actors.hero.abilities.cleric.trinity.talismanofforesight_use=Trinity will apply this artifact's scry effect at _+%1$d_, at the cost of _%2$s charge._
actors.hero.abilities.cleric.trinity.timekeepershourglass_use=Trinity will apply this artifact's time freeze effect with a _%1$d_ turn duration, at the cost of _%2$s charge._
actors.hero.abilities.cleric.trinity.unstablespellbook_use=Trinity will apply this artifact's random scroll effect with a _%1$d/10_ chance to offer the exotic version at no additional cost, at the cost of _%2$s charge._
actors.hero.abilities.cleric.trinity.cost=Το κόστος φορτίου της ικανότητας ποικίλλει, αλλά συνήθως είναι _%d._
actors.hero.abilities.cleric.trinity.short_desc=Ο Κληρικός λαμβάνει μια _Τριάδα_ ικανοτήτων, οι οποίες προσομοιώνουν τα κομμάτια εξοπλισμού που έχει αντικρύσει και μπορούν να εφαρμοστούν χρησιμοποιώντας νέα ξόρκια.
actors.hero.abilities.cleric.trinity.desc=The Cleric gains a _Trinity_ of armor abilities, which can be assigned to various item effects by using three new spells. Each of these spells focuses on emulating the effects of different kinds of equipment that the Cleric has identified during this run: body form (weapons and armor), mind form (wands and thrown weapons), and spirit form (rings and artifacts).\n\nEach Trinity form can be imbued with one effect at a time, and the Cleric chooses which one to activate when using Trinity. Trinity will not duplicate the effect of something you already have equipped.
actors.hero.abilities.cleric.trinity$wndusetrinity.text=Select which form of Trinity to use. The effects of different forms can be active simultaneously.
actors.hero.abilities.cleric.trinity$wndusetrinity.body=_Σωματική Μορφή: %s._
actors.hero.abilities.cleric.trinity$wndusetrinity.mind=_Νοητική Μορφή: %s._
actors.hero.abilities.cleric.trinity$wndusetrinity.spirit=_Πνευματική Μορφή: %s._
actors.hero.abilities.cleric.trinity$wnditemtypeselect.text=Select an effect to be imbued into Trinity. Additional info will be shown before confirmation.
actors.hero.abilities.cleric.trinity$wnditemconfirm.body=Ανάθεση στη σωματική μορφή
actors.hero.abilities.cleric.trinity$wnditemconfirm.mind=Ανάθεση στη νοητική μορφή
actors.hero.abilities.cleric.trinity$wnditemconfirm.spirit=Ανάθεση στην πνευματική μορφή
actors.hero.abilities.cleric.powerofmany.name=ισχύς των πολλών
actors.hero.abilities.cleric.powerofmany.prompt_default=Επίλεξε σύμμαχο ή τοποθεσία
actors.hero.abilities.cleric.powerofmany.prompt_ally=Κατεύθυνε τον σύμμαχο φωτός
actors.hero.abilities.cleric.powerofmany.ally_exists=Έχεις ήδη ενδυναμωμένο σύμμαχο.
actors.hero.abilities.cleric.powerofmany.no_vision=Δεν μπορείς να στοχεύσεις θέση που δεν μπορείς να δεις.
actors.hero.abilities.cleric.powerofmany.only_allies=Μπορείς να ενδυναμώσεις μόνο συμμάχους.
actors.hero.abilities.cleric.powerofmany.short_desc=The Cleric channels the _Power of Many_, empowering an existing ally or creating a new one.
actors.hero.abilities.cleric.powerofmany.desc=The Cleric channels the _Power of Many_, which either empowers an existing ally or creates a new empowered one for 100 turns. Targeting an empty space creates a new ally.\n\nWhile empowered by Power of Many, any ally deals +25% damage, takes -25% damage, and shares their vision with the Cleric. They also gain 25 shielding when the ability is used.\n\nThe Cleric also gains three new spells that can only be cast with an empowered ally. Power of Many won't end while one of these spells is active.
actors.hero.abilities.cleric.powerofmany$powerbuff.name=ισχύς των πολλών
actors.hero.abilities.cleric.powerofmany$powerbuff.desc=This ally has been empowered by Power of Many, granting them +25%% damage dealt and -25%% damage taken. They will also share their vision range with the Cleric, and can benefit from power of many spells.\n\nPower of Many will persist when allies such as prismatic images hide away, but its duration will still count down.\n\nTurns Remaining: %s.
actors.hero.abilities.cleric.powerofmany$lightally.name=σύμμαχος φωτός
actors.hero.abilities.cleric.powerofmany$lightally.direct_defend=Ο σύμμαχος μετακινείται σε αυτή τη θέση.
actors.hero.abilities.cleric.powerofmany$lightally.direct_follow=Ο σύμμαχός σου ξεκινά να σε ακολουθεί.
actors.hero.abilities.cleric.powerofmany$lightally.direct_attack=Ο σύμμαχός σου πάει για επίθεση!
actors.hero.abilities.cleric.powerofmany$lightally.desc=Ένα αντίγραφο ενός από τους συμμάχους του Κληρικού, φτιαγμένο από συμπαγές φως. Παρότι έχει την μορφή ενός άλλου ήρωα, δεν έχει καμία από τις μοναδικές του ικανότητες. Αυτός ο σύμμαχος θα παραμείνει για όσο η Ισχύς των πολλών εφαρμόζεται σε αυτόν.\n\nΟ σύμμαχος μπορεί να κατευθυνθεί χωρίς κόστος, χρησιμοποιώντας ξανά την ικανότητα πανοπλίας.
actors.hero.abilities.cleric.powerofmany$lightally.discover_hint=Μπορείς να βρεις αυτόν τον χαρακτήρα με την χρήση μια συγκεκριμένης ικανότητας πανοπλίας.


actors.hero.abilities.ratmogrify.name=αρουραιοποίηση
actors.hero.abilities.ratmogrify.cant_transform=Δεν μπορείς να το αρουραιοποιήσεις αυτό!
actors.hero.abilities.ratmogrify.too_strong=Ο εχθρός είναι πολύ ισχυρός για να αρουραιοποιηθεί!
actors.hero.abilities.ratmogrify.short_desc=Ο ήρωας _Αρουραιοποιεί_ έναν εχθρό! Αυτό τον μετατρέπει προσωρινά σε αρουραίο χωρίς ειδικές ικανότητες.
actors.hero.abilities.ratmogrify.desc=Ο ήρωας μετατρέπει έναν εχθρό σε αρουραίο για 6 γύρους! Αφεντικά, σύμμαχοι, και αρουραίοι δεν μπορούν να αρουραιοποιηθούν.\n\nΟι αρουραιοποιημένοι εχθροί διατηρούν τα αρχικά τους χαρακτηριστικά, αλλά δεν έχουν ειδικές ικανότητες.
actors.hero.abilities.ratmogrify$transmograt.name=%s – υπό αρουραιοποίηση
actors.hero.abilities.ratmogrify$transmograt.desc=Ο εχθρός μεταμορφώθηκε σε αρουραίο. Μεγάλη βελτίωση αν θες τη γνώμη μου!\n- Αρουραίος βασιλιάς
actors.hero.abilities.ratmogrify$transmograt.rankings_desc=Εξοντώθηκες από: αρουραιοποιημένο εχθρό

##Cleric Spells
actors.hero.spells.auraofprotection.name=αύρα προστασίας
actors.hero.spells.auraofprotection.short_desc=Αυξάνει την άμυνα του Σταυροφόρου και των κοντινών συμμάχων.
actors.hero.spells.auraofprotection.desc=Ο Σταυροφόρος ξεκινά να εκπέμπει προστατευτική ενέργεια σε μια αστραφτερή αύρα γύρω του για 20 γύρους. Οποιοσδήποτε σύμμαχος εντός 2 τετραγώνων του Σταυροφόρου (συμπεριλαμβανομένου του ίδιου) δέχεται %1$d%% λιγότερη ζημιά και αποκτά την επίδραση του γλύφου του  με +%2$d%% ισχύ..\n\nΑυτή η μείωση της ζημιάς λαμβάνει χώρα πριν από άλλα αποτελέσματα μείωσης της ζημιάς (π.χ. πανοπλία). Η ενίσχυση της ισχύος του γλύφου θα εφαρμόζεται πάντα, αλλά αυτό το ξόρκι δεν μπορεί να προκαλέσει την εφαρμογή του γλύφου του Σταυροφόρου πάνω από μία φορά, εάν ένας χαρακτήρας επωφελείται ήδη από αυτό (π.χ. ο ίδιος ο Σταυροφόρου ή μια πρισματική εικόνα).
actors.hero.spells.auraofprotection$aurabuff.name=αύρα προστασίας
actors.hero.spells.auraofprotection$aurabuff.desc=Ο Σταυροφόρος εκπέμπει προστατευτική ενέργεια γύρω του.\n\nΚάθε κοντινός σύμμαχος (συμπεριλαμβανομένου του ίδιου του Σταυροφόρου) δέχεται μειωμένη ζημιά και αποκτά την επίδραση του γλύφου πανοπλίας του Σταυροφόρου με ενισχυμένη δύναμη.\n\nΓύροι που απομένουν: %s.

actors.hero.spells.beamingray.name=ακτίνα τηλεμεταφοράς
actors.hero.spells.beamingray.no_space=Δεν υπάρχει χώρος για τον σύμμαχό σου να εμφανιστεί εκεί.
actors.hero.spells.beamingray.out_of_range=Αυτή η περιοχή είναι εκτός εύρους.
actors.hero.spells.beamingray.short_desc=Τηλεμεταφέρει τον σύμμαχό σου και αυξάνει τη ζημιά των επιθέσεων.
actors.hero.spells.beamingray.desc=The Cleric channels the power on their ally into a ray of light that beams them to a location. If the ray collides with an enemy it will place the ally nearby and direct them towards the enemy.\n\nThe ray has a maximum range of %1$d tiles, and will increase Power of Many's bonus damage to +%2$d%% for 10 turns against the closest enemy within 4 tiles. Beaming ray can even teleport normally immobile allies, but its ranged is halved in these cases.
actors.hero.spells.beamingray$beamingrayboost.name=ακτίνα τηλεμεταφοράς
actors.hero.spells.beamingray$beamingrayboost.desc=This ally was recently teleported by Beaming Ray, giving them bonus damage against the nearest enemy after the teleport. Power of Many also won't expire when this buff is active.\n\nTurns Remaining: %s.

actors.hero.spells.blessspell.name=ευλογία
actors.hero.spells.blessspell.short_desc=Ευλογεί & προστατεύει τον Κληρικό. Ευλογεί & θεραπεύει τους άλλους.
actors.hero.spells.blessspell.desc=Ο Κληρικός θέτει μια ιερή ευλογία στον εαυτό του ή σε άλλον χαρακτήρα που του είναι ορατός.\n\nΌταν το κάνει στον εαυτό του, η επίδραση είναι πιο ανίσχυρη. Λαμβάνει %1$d γύρους ευλογίας και %2$d προστασία.\n\nΌταν το κάνει σε άλλον χαρακτήρα, το ξόρκι γίνεται πιο ισχυρό. Δίνει %3$d γύρους ευλογίας και %4$d πόντους θεραπείας. Η πλεονάζουσα θεραπεία μετατρέπεται σε ασπίδα προστασίας

actors.hero.spells.bodyform.name=σωματική μορφή
actors.hero.spells.bodyform.short_desc=Ανάθεση Τριάδας σε μαγική ενίσχυση ή γλύφο.
actors.hero.spells.bodyform.desc=The Cleric chooses an enchantment or glyph that they have identified this run and imbues Trinity with its effect.\n\nWhen Trinity is used, The Cleric gains the effect of the chosen enchantment or glyph for %d turns. This temporary enchant or glyph will work with any effect that a regular enchantment or glyph would.\n\nThis spell replaces any other body effect that Trinity is currently imbued with.
actors.hero.spells.bodyform$bodyformbuff.name=σωματική μορφή
actors.hero.spells.bodyform$bodyformbuff.desc=Trinity's body form is currently granting you the power of an enchantment or glyph, as if you had it equipped on your current weapon or armor.\n\nNote that body form cannot provide another copy of an effect that you're already benefitting from.\n\nCurrent Effect: %1$s.\n\nTurns Remaining: %2$s.

actors.hero.spells.cleanse.name=καθαγίαση
actors.hero.spells.cleanse.short_desc=Καθαρίζει τις αρνητικές επιδράσεις και παρέχει ασπίδα.
actors.hero.spells.cleanse.desc=The Cleric clears all harmful status effects on themselves and visible allies. After the spell ends all characters affected also gain %1$d turns of debuff immunity, and %2$d barrier.

actors.hero.spells.clericspell.prompt=Επίλεξε έναν στόχο
actors.hero.spells.clericspell.no_target=Δεν υπάρχει στόχος εκεί.
actors.hero.spells.clericspell.invalid_target=Δεν μπορείς να στοχεύσεις αυτή τη θέση.
actors.hero.spells.clericspell.invalid_enemy=Δεν μπορείς να στοχεύσεις αυτόν τον εχθρό.
actors.hero.spells.clericspell.charge_cost=Κόστος φορτίου: %d

actors.hero.spells.divinesense.name=θεϊκή αίσθηση
actors.hero.spells.divinesense.short_desc=Λαμβάνεις προσωρινά ενόραση σε ευρεία έκταση.
actors.hero.spells.divinesense.desc=The Cleric focuses their senses on their surroundings, gaining mind vision with a %d tile range for 50 turns. This spell takes no time to cast.
actors.hero.spells.divinesense$divinesensetracker.name=θεϊκή αίσθηση
actors.hero.spells.divinesense$divinesensetracker.desc=This character is temporarily able to see other nearby creatures with their mind!\n\nTurns remaining: %s.

actors.hero.spells.divineintervention.name=θεϊκή παρέμβαση
actors.hero.spells.divineintervention.short_desc=Μεγάλη αύξηση της άμυνας του Κληρικού και των συμμάχων.
actors.hero.spells.divineintervention.desc=Ο Κληρικός τραβά ασύλληπτη ισχύ από τον τόμο σε αυτόν και τους συμμάχους του, ανεβάζοντας την ασπίδα προστασίας όλων στο %1$d και παρατείνοντας την εξυψωμένη μορφή κατά %2$d γύρους. Η απίστευτη αμυντική ισχύς του ξορκιού αντισταθμίζεται από το πολύ υψηλό του κόστος.\n\nΌπως κάθε άλλη προστασία που παρέχεται από την εξυψωμένη μορφή, η προστασία αυτή δεν φθίνει φυσιολογικά, αλλά θα μηδενιστεί αμέσως μόλις τελειώσει η εξυψωμένη μορφή.

actors.hero.spells.flash.name=διακτινισμός
actors.hero.spells.flash.prompt=Επίλεξε ένα σημείο
actors.hero.spells.flash.short_desc=Τηλεμεταφορά σε κοντινό σημείο.
actors.hero.spells.flash.desc=Ο Κληρικός διοχετεύει την εξυψωμένη του μορφή σε μια κοντινή θέση και τηλεμεταφέρεται εκεί. Ο διακτινισμός τηλεμεταφέρει τον Κληρικό σε οποιαδήποτε ελεύθερη θέση εντός εμβέλειας εφόσον αυτή έχει ανακαλυφθεί. Το ξόρκι κοστίζει περισσότερο φορτίο κάθε φορά που χρησιμοποιείται στην ίδια εξυψωμένη μορφή.

actors.hero.spells.guidinglight.name=καθοδηγητικό φως
actors.hero.spells.guidinglight.short_desc=Προκαλεί μαγική ζημιά απόστασης και διασφαλίζει το επόμενο χτύπημα.
actors.hero.spells.guidinglight.desc=Ο Κληρικός εξαπολύει μια βολή μαγικής ενέργειας που προκαλεί 2-8 ζημιά και φωτίζει τον στόχο. Η επόμενη φυσιολογική επίθεση (χωρίς ποινή δύναμης) εναντίον του φωτισμένου εχθρού θα χτυπήσει εγγυημένα.
actors.hero.spells.guidinglight.desc_priest=_This spell is more powerful when cast by the Priest._ The first cast of the spell every 50 turns costs no tome charges, and illumination will be consumed by radiance, wands, other characters, and artifacts that directly affect enemies. When illuminated is used in this way, it deals bonus magic damage equal to the Priest's level + 5.
actors.hero.spells.guidinglight$guidinglightpriestcooldown.name=Καθοδηγητικό φως
actors.hero.spells.guidinglight$guidinglightpriestcooldown.desc=The Priest will be able to cast Guiding Light for free again after 50 turns elapse.\n\nTurns remaining: %s.
actors.hero.spells.guidinglight$illuminated.name=Φωτισμός
actors.hero.spells.guidinglight$illuminated.desc=Αυτός ο χαρακτήρας φωτίζει καθώς χτυπήθηκε με το καθοδηγητικό φως. Ενώ η λάμψη αυτή δεν είναι αρκετά δυνατή ώστε να φωτίσει την γύρω περιοχή, η μαγική επίδραση θα το κάνει πολύ πιο εύκολο για τον Κληρικό να πετύχει τα χτυπήματα εναντίον του.
actors.hero.spells.guidinglight$illuminated.desc_priest=Ο Ιερέας μπορεί επίσης να καταναλώσει τον φωτισμό με τη Λάμψη, την εξαπόλυση από ραβδί, το χτύπημα από σύμμαχο ή τις επιδράσεις από κάποια τεχνουργήματα. Αυτή η χρήση του φωτισμού θα προκαλέσει επιπλέον μαγική ζημιά ίση με το επίπεδο του Ιερέα +5.
actors.hero.spells.guidinglight$illuminated.desc_generic=Άλλοι ήρωες μπορούν να χρησιμοποιήσουν τον Φωτισμό ώστε να επωφεληθούν από το ταλέντο «Καυτό Φως», αλλά δεν θα αποκτήσουν επιπλέον ακρίβεια.

actors.hero.spells.hallowedground.name=γαία άγια
actors.hero.spells.hallowedground.prompt=Επίλεξε ένα σημείο
actors.hero.spells.hallowedground.short_desc=Θεραπεύει συμμάχους, επιβραδύνει εχθρούς και απλώνει γρασίδι σε μια περιοχή.
actors.hero.spells.hallowedground.desc=Ο Ιερέας συγκεντρώνει τη θεϊκή του μαγεία στο έδαφος και αγιάζει μια περιοχή %1$dx%1$d για 20 γύρους.\n\nΤο ξόρκι θεραπεύει κατά την εκτέλεση όλους τους συμμάχους για 15 ζωή (οι ήδη υγιείς σύμμαχοι και ο Ιερέας λαμβάνουν ασπίδα προστασίας), ριζώνει για λίγο τους εχθρούς και απλώνει κοντό γρασίδι.\n\nΤο αγιασμένο έδαφος θεραπεύει τους συμμάχους για 1 ζωή ανά γύρο (οι υγιείς σύμμαχοι και ο Ιερέας λαμβάνουν ασπίδα προστασίας), σακατεύει τους εχθρούς και κάνει το ψηλό γρασίδι να φυτρώσει τυχαία.\n\nΤο αγιασμένο έδαφος καταστρέφεται από τη φωτιά. Θα παραχθεί στραπατσαρισμένο γρασίδι αν οι παθητικές επιδράσεις αναπλήρωσης (όπως η παθητική αναπλήρωση ζωής και φορτίων σε επίπεδα αφεντικών) είναι απενεργοποιημένες ή αν ο Ιερέας δεν έχει λάβει εμπειρία για μεγάλο διάστημα.
actors.hero.spells.hallowedground$hallowedterrain.desc=Το έδαφος έχει καθαγιαστεί εδώ. Αυτό επιβραδύνει τους εχθρούς, θεραπεύει τους συμμάχους και κάνει το γρασίδι να εξαπλώνεται.

actors.hero.spells.holyintuition.name=ιερή διαίσθηση
actors.hero.spells.holyintuition.prompt=Επίλεξε ένα αντικείμενο
actors.hero.spells.holyintuition.cursed=Νιώθεις μια διαβολική μαγεία να ελλοχεύει στο εφόδιο.
actors.hero.spells.holyintuition.uncursed=Αυτό το εφόδιο είναι απαλλαγμένο από διαβολική μαγεία.
actors.hero.spells.holyintuition.short_desc=Διαπιστώνει αν ένα εφόδιο είναι καταραμένο ή όχι.
actors.hero.spells.holyintuition.desc=Ο Κληρικός συγκεντρώνει τις αισθήσεις του σε ένα εφόδιο και διαπιστώνει αν είναι καταραμένο ή όχι χωρίς να χρειαστεί να το εξοπλίσει.

actors.hero.spells.holylance.name=ιερή λόγχη
actors.hero.spells.holylance.short_desc=Προκαλεί βαριά μαγική ζημιά απόστασης.
actors.hero.spells.holylance.desc=Ο Ιερέας συγκεντρώνει μεγάλη ποσότητα ενέργειας σε μια καταστροφική πετούμενη λόγχη φτιαγμένη από φως. Η λόγχη προκαλεί %1$d-%2$d ζημιά και προκαλεί πάντα τη μέγιστη ζημιά σε απέθαντους ή δαιμονικούς εχθρούς.\n\nΤο ξόρκι είναι πολύ δαπανηρό και έχει αναπλήρωση 30 γύρων.
actors.hero.spells.holylance$lancecooldown.name=αναπλήρωση ιερής λόγχης
actors.hero.spells.holylance$lancecooldown.desc=Ο Ιερέας εκτέλεσε πρόσφατα την Ιερή λόγχη και πρέπει να περιμένει προτού την ξαναεκτελέσει.\n\nΓύροι που απομένουν: %s.

actors.hero.spells.holyward.name=ιερός φρουρός
actors.hero.spells.holyward.glyph_name=%s φωτός
actors.hero.spells.holyward.glyph_desc=Αυτός ο γλύφος αυξάνει ελαφρά την ποσότητα ζημιάς που αποκρούει η πανοπλία.
actors.hero.spells.holyward.short_desc=Παρακάμπτει προσωρινά τον γλύφο για να αυξήσει την απόκρουση της πανοπλίας.
actors.hero.spells.holyward.desc=Ο Κληρικός εμποτίζει την πανοπλία του με ιερό φως, αυξάνοντας την απόκρουση ζημιάς της πανοπλίας κατά 1. Αυτό το ξόρκι εκτελείται ακαριαία.\n\nΑυτός ο γλύφος διαρκεί για 50 γύρους και, κατά τη διάρκειά του, ακυρώνεται προσωρινά κάθε ωφέλιμος γλύφος που έχει ήδη η πανοπλία. Ο Κληρικός επωφελείται από αυτό το αποτέλεσμα ακόμη και αν δεν έχει πανοπλία.
actors.hero.spells.holyward.desc_paladin=_Αυτό το ξόρκι είναι πιο ισχυρό όταν το εκτελεί ο Σταυροφόρος._ Η πρόσθετη παρεμπόδιση ζημιάς αυξάνεται σε 3, το ξόρκι δεν παρακάμπτει πλέον τους υπάρχοντες γλύφους και η χρήση άλλων ξορκιών ενώ ο ιερός φρουρός είναι ενεργός θα παρατείνει τη διάρκειά του κατά 10 γύρους ανά φορτίο που χρησιμοποιείται.
actors.hero.spells.holyward$holyarmbuff.name=ιερός φρουρός
actors.hero.spells.holyward$holyarmbuff.desc=Ο Κληρικός έχει εμποτίσει την πανοπλία του με ιερή ενέργεια, ακυρώνοντας προσωρινά τον υπάρχοντα γλύφο και κάνοντάς τη να αποκρούει 1 επιπλέον πόντο ζημιάς.\n\nΓύροι που απομένουν: %s.
actors.hero.spells.holyward$holyarmbuff.desc_paladin=Ο Σταυροφόρος έχει εμποτίσει τη φορεμένη πανοπλία του με ιερή ενέργεια, κάνοντας την πανοπλία να μπλοκάρει επιπλέον 3 πόντους ζημιάς.\n\nΗ χρήση άλλων ξορκιών ενώ ο ιερός φρουρός είναι ενεργός, θα παρατείνει τη διάρκειά του κατά 10 γύρους για κάθε φορτίο που δαπανάται.\n\nΓύροι που απομένουν: %s.

actors.hero.spells.holyweapon.name=ιερό όπλο
actors.hero.spells.holyweapon.ench_name=%s ιεροσύνης
actors.hero.spells.holyweapon.ench_desc=Οι εχθροί που χτυπιούνται από ιερό όπλο θα λάβουν επιπλέον μαγική ζημιά.
actors.hero.spells.holyweapon.short_desc=Παρακάμπτει προσωρινά τη μαγική ενίσχυση του όπλου για να αυξήσει τη ζημιά.
actors.hero.spells.holyweapon.desc=Ο Κληρικός ενισχύει το φορεμένο όπλο του με ιερή ενέργεια, κάνοντας το όπλο να προκαλεί επιπλέον 2 μαγική ζημιά κάθε φορά που χτυπάει έναν εχθρό με αυτό. Αυτό το ξόρκι εκτελείται ακαριαία.\n\nΑυτή η μαγεία διαρκεί για 50 γύρους και παρακάμπτει κάθε ευεργετική μαγεία που έχει το όπλο κατά τη διάρκειά της. Τα άοπλα χτυπήματα μπορούν επίσης να επωφεληθούν από αυτήν την επίδραση.
actors.hero.spells.holyweapon.desc_paladin=_Αυτό το ξόρκι είναι πιο ισχυρό όταν το εκτελεί ο Σταυροφόρος._ Η πρόσθετη μαγική ζημιά αυξάνεται σε 6, το ξόρκι δεν παρακάμπτει πλέον τις υπάρχοουσες μαγ. ενισχύσεις, και η ρίψη άλλων ξορκιών ενώ το ιερό όπλο είναι ενεργό θα παρατείνει τη διάρκειά του κατά 10 γύρους για κάθε φορτίο που χρησιμοποιείται.
actors.hero.spells.holyweapon$holywepbuff.name=ιερό όπλο
actors.hero.spells.holyweapon$holywepbuff.desc=Ο Κληρικός έχει εμποτίσει το όπλο του με ιερή ενέργεια, ακυρώνοντας προσωρινά την υπάρχουσα μαγική ενίσχυση και κάνοντάς το να προκαλεί 2 επιπλέον πόντους μαγικής ζημιάς.\n\nΓύροι που απομένουν: %s.
actors.hero.spells.holyweapon$holywepbuff.desc_paladin=Ο Σταυροφόρος έχει εμποτίσει το φορεμένο όπλο του με ιερή ενέργεια, με αποτέλεσμα οι επιθέσεις του να προκαλούν επιπλέον 6 μαγική ζημιά.\n\nΗ χρήση άλλων ξορκιών ενώ το ιερό όπλο είναι ενεργό θα παρατείνει τη διάρκειά του κατά 10 γύρους για κάθε φορτίο που δαπανάται.\n\nΓύροι που απομένουν: %s.

actors.hero.spells.judgement.name=τελική κρίση
actors.hero.spells.judgement.short_desc=Προκαλεί ζημιά σε όλους τους ορατούς εχθρούς.
actors.hero.spells.judgement.desc=Ο Κληρικός χτυπά τη γροθιά του στο έδαφος, προκαλώντας μια έκρηξη φωτός που προκαλεί ζημιά σε όλους τους εχθρούς που μπορεί να δει. Αυτό προκαλεί %1$d-%2$d ζημιά, συν επιπλέον 33%% ζημιά για κάθε ξόρκι που έχει κάνει ο Κληρικός από τότε που μπήκε στην εξυψωμένη μορφή (ή από την τελευταία φορά που εκτέλεσε την τελική κρίση).\n\nΕπί του παρόντος, η Κρίση θα προκαλέσει %3$d-%4$d ζημιά.

actors.hero.spells.layonhands.name=ιερό άγγιγμα
actors.hero.spells.layonhands.short_desc=Θεραπεύει αμέσως έναν διπλανό χαρακτήρα ή δίνει προστασία στον Σταυροφόρο.
actors.hero.spells.layonhands.desc=Ο Σταυροφόρος διοχετεύει ιερή ενέργεια μέσω των χεριών του, θεραπεύοντας ή προστατεύοντας οτιδήποτε αγγίξει.\n\nΟ Σταυροφόρος μπορεί να εκτελεί αυτό το ξόρκι σε οποιονδήποτε γειτονικό χαρακτήρα για να του δώσει %1$d θεραπεία ή στον εαυτό του για να αποκτήσει %1$d προστασία. Η περίσσια θεραπεία από αυτό το ξόρκι μετατρέπεται σε προστασία.\n\nΑυτό το ξόρκι εκτελείται ακαριαία και μπορεί να εκτελεστεί επανειλημμένα, αλλά δεν μπορεί να παρέχει προστασία μεγαλύτερη των τριών ρίψεων κάθε φορά.

actors.hero.spells.lifelinkspell.name=σύνδεσμος ζωής
actors.hero.spells.lifelinkspell.short_desc=Shares damage with an ally, and reduces their damage taken.
actors.hero.spells.lifelinkspell.desc=The Cleric strengthens the link between themselves and their empowered ally. With this empowered link, any damage taken will be shared between both the hero and their ally for %1$d turns, and Power of Many's defensive boost will be increased to -%2$d%% damage taken. Note that the damage is shared after armor, but before Power of Many's damage reduction.\n\nWhile this effect is active, beneficial Cleric spells of T3 or below will apply to both the Cleric and their ally if they would have just applied to one of them.
actors.hero.spells.lifelinkspell$lifelinkspellbuff.name=προστασία συνδέσμου ζωής
actors.hero.spells.lifelinkspell$lifelinkspellbuff.desc=The Cleric recently cast Life Link on this ally.\n\nIn addition to Life Link's regular benefits, this character also takes reduced damage, any positive Cleric spells are applied to both the Cleric and this ally instead of just one, and Power of Many won't expire while this buff is active.\n\nTurns Remaining: %s.

actors.hero.spells.mindform.name=νοητική μορφή
actors.hero.spells.mindform.short_desc=Ανάθεση Τριάδας σε ραβδί ή όπλο ρίψης
actors.hero.spells.mindform.desc=The Cleric chooses a wand or thrown weapons that they have identified this run and imbues Trinity with its effect.\n\nWhen Trinity is used, The Cleric can make a single attack as if they were using the chosen item at +%d. This will trigger all effects that using that type of item would normally trigger.\n\nThis spell replaces any other mind effect that Trinity is currently imbued with.

actors.hero.spells.mnemonicprayer.name=μνημονική προσευχή
actors.hero.spells.mnemonicprayer.short_desc=Επεκτείνει ωφέλιμες/επιβλαβείς επιδράσεις σε έναν σύμμαχο/εχθρό & εφαρμόζει εκ νέου τον φωτισμό.
actors.hero.spells.mnemonicprayer.desc=Ο Ιερέας προφέρει μια προσευχή που παρατείνει τη διάρκεια όλων των θετικών ή αρνητικών επιδράσεων ενός συγκεκριμένου στόχου κατά %1$d γύρους. Αυτό το ξόρκι εκτελείται ακαριαία. Οι θετικές επιδράσεις θα διαρκούν περισσότερο στους συμμάχους (συμπεριλαμβανομένου του ίδιου του Ιερέα) και οι επιβλαβείς επιδράσεις θα διαρκούν περισσότερο στους εχθρούς.\n\nΗ μνημονική προσευχή μπορεί να παρατείνει  μόνο μία φορά την κάθε φάση μιας επίδρασης, και δεν μπορεί να παρατείνει θετικές επιδράσεις που παρέχονται από ικανότητες πανοπλίας.

actors.hero.spells.radiance.name=λάμψη
actors.hero.spells.radiance.short_desc=Φωτίζει και ακινητοποιεί προσωρινά τους ορατούς εχθρούς.
actors.hero.spells.radiance.desc=Ο Ιερέας ξεσπά σε μια λάμψη ιερού φωτός, ακινητοποιώντας όλους τους ορατούς εχθρούς για 3 γύρους. Αν ένας εχθρός είναι ήδη φωτισμένος, η Λάμψη θα ενεργοποιήσει την επιπλέον ζημιά της Φώτισης και ύστερα θα εφαρμόσει την επίδραση φωτισμού. Η Λάμψη θα κάνει επίσης τον Ιερέα να φωτιστεί για 100 γύρους, εφόσον ο τρέχων όροφος είναι σκοτεινός.

actors.hero.spells.recallinscription.name=ανάκληση εγγραφής
actors.hero.spells.recallinscription.short_desc=Επαναλαμβάνει τη χρήση ενός πρόσφατου ρουνικού λίθου ή παπύρου.
actors.hero.spells.recallinscription.desc=Ο Κληρικός χρησιμοποιεί ιερή μαγεία για να εκτελέσει ξανά την επίδραση ενός ρουνικού λίθου ή παπύρου που χρησιμοποίησε στους τελευταίους %s γύρους.\n\nΗ ανάκληση εγγραφής δεν μπορεί να αναπαράξει τους παπύρους αναβάθμισης. Το κόστος του ξορκιού ποικίλλει βάσει του τι αντικείμενο χρησιμοποιήθηκε πρόσφατα: 2 φορτίο για ρουνικό λίθο, 3 για πάπυρο, 4 για εξωτικό πάπυρο. Το κόστος διπλασιάζεται όταν αναπαράγεται πάπυρος μεταστοιχείωσης, καθώς και αντικείμενα που παράγονται αλχημικά από πάπυρο μεταστοιχείωσης ή αναβάθμισης.
actors.hero.spells.recallinscription$useditemtracker.name=πρόσφατα χρησιμοποιημένος ρούνος
actors.hero.spells.recallinscription$useditemtracker.desc=Ο Κληρικός χρησιμοποίησε πρόσφατα ένα αντικείμενο στο οποίο μπορεί να λειτουργήσει το ξόρκι «ανάκληση εγγραφής». Μπορεί να εκτελέσει το εν λόγω ξόρκι για να επαναλάβει την επίδραση αυτού του αντικειμένου.\n\nΑντικείμενο που χρησιμοποιήθηκε: %1$s.\n\nΓύροι που απομένουν: %2$s.

actors.hero.spells.shieldoflight.name=ασπίδα φωτός
actors.hero.spells.shieldoflight.short_desc=Παρέχει προσωρινή πανοπλία εναντίον ενός στόχου.
actors.hero.spells.shieldoflight.desc=Ο Κληρικός δημιουργεί ένα λεπτό φράγμα φωτός ανάμεσα σε αυτόν και έναν επιλεγμένο εχθρό. Αυτό αυξάνει την αμυντική ισχύ της πανοπλίας του εναντίον του συγκεκριμένου εχθρού κατά %1$d-%2$d για 5 γύρους.\n\nΤο ξόρκι δεν απαιτεί γύρους για να εκτελεστεί, αλλά δεν μπορεί να χρησιμοποιηθεί εναντίον πολλαπλών στόχων ταυτοχρόνως.
actors.hero.spells.shieldoflight$shieldoflighttracker.name=ασπίδα φωτός
actors.hero.spells.shieldoflight$shieldoflighttracker.desc=Μια λεπτή ασπίδα φωτός υψώνεται ανάμεσα σε αυτόν τον χαρακτήρα και έναν εχθρό. Δεν είναι αρκετά ισχυρή να αποκρούει εντελώς τις επιθέσεις, αλλά τις ελαφραίνει.\n\nΓύροι που απομένουν: %s.

actors.hero.spells.spiritform.name=πνευματική μορφή
actors.hero.spells.spiritform.short_desc=Ανάθεση Τριάδας σε δαχτυλίδι ή τεχνούργημα.
actors.hero.spells.spiritform.desc=The Cleric chooses a ring or artifact that they have identified this run (except the holy tome) and imbues Trinity with its effect.\n\nIf a ring is chosen, then Trinity grants that ring's effect at +%1$d for 20 turns.\n\nIf an artifact is chosen, then Trinity replicates that Artifact's effect at +%2$d. Each artifact has different specific behaviors and armor charge costs when used with Trinity.\n\nThis spell replaces any other spirit effect that Trinity is currently imbued with.
actors.hero.spells.spiritform$spiritformbuff.name=πνευματική μορφή
actors.hero.spells.spiritform$spiritformbuff.desc=Trinity's spirit form is currently granting you the power of an item, as if you had it equipped.\n\nNote that spirit form cannot provide another copy of an effect that you're already benefitting from.\n\nCurrent Effect: %1$s.\n\nTurns Remaining: %2$s.

actors.hero.spells.smite.name=πλήγμα
actors.hero.spells.smite.short_desc=Εγγυάται ένα χτύπημα με μπόνους στη ζημιά και στη μαγική ενίσχυση.
actors.hero.spells.smite.desc=Ο Σταυροφόρος ενδυναμώνει ένα χτύπημα μάχης σώμα-με-σώμα με μια καταστροφική ισχύ.\n\nΕκτός από το να προκαλεί ζημιά μάχης σώμα-με-σώμα, το Πλήγμα χτυπά εγγυημένα (εφόσον δεν έχεις ποινή δύναμης), έχει +300%% ισχύ στη μαγική ενίσχυση του όπλου και προκαλεί %1$d-%2$d επιπλέον μαγική ζημιά.\n\nΗ πρόσθετη μαγική ζημιά του Πλήγματος κλιμακώνεται με το επίπεδο του Σταυροφόρου και θα είναι πάντοτε η μέγιστη εναντίον απέθαντων ή δαιμονικών εχθρών.

actors.hero.spells.stasis.name=στασιμότητα
actors.hero.spells.stasis.short_desc=Απομακρύνει τον σύμμαχο από την κατακόμβη και τον διατηρεί.
actors.hero.spells.stasis.desc=The Cleric focuses their connection with their ally toward themselves, causing the ally to be temporarily held in a sort of energy stasis within the Cleric. The ally will be preserved for up to %d turns, with all positive effects on them being unaffected by their time in stasis.\n\nThe ally will appear next to the Cleric when stasis ends naturally or they can instantly re-cast the spell at no cost to end the effect early. Stasis can even move immobile allies, but cannot transfer them between floors.
actors.hero.spells.stasis$stasisbuff.name=σύμμαχος σε στασιμότητα
actors.hero.spells.stasis$stasisbuff.left_behind=Ο στάσιμος σύμμαχός σου έμεινε πίσω.
actors.hero.spells.stasis$stasisbuff.desc=The Cleric currently has an ally stored in stasis. All positive effects on this ally are preserved, including Power of Many, and they will reappear next to the Cleric when the effect ends. The effect can also be ended early by re-casting Stasis.\n\nAlly in stasis: %1$s.\nTurns Remaining: %2$s.

actors.hero.spells.sunray.name=ακτίνα ηλίου
actors.hero.spells.sunray.short_desc=Προκαλεί μαγική ζημιά απόστασης και τυφλώνει τον στόχο μία φορά.
actors.hero.spells.sunray.desc=Ο Κληρικός εκτοξεύει μια ακτίνα εκτυφλωτικού φωτός στον στόχο, προκαλώντας %1$d-%2$d ζημιά και τυφλώνοντάς τον για %3$d γύρους. Η ηλιακή ακτίνα προκαλεί πάντα τη μέγιστη ζημιά σε απέθαντους και δαιμονικούς στόχους.\n\nΑφού χτυπηθεί από το ξόρκι, η όραση του εχθρού θα προσαρμοστεί κι έτσι δεν θα μπορεί να τυφλωθεί ξανά από αυτό. Ωστόσο, αν χτυπηθεί ξανά ενώ είναι ήδη τυφλωμένος από το ξόρκι, το φως θα γίνει συντριπτικό και θα τον παραλύσει.

actors.hero.spells.walloflight.name=τείχος φωτός
actors.hero.spells.walloflight.short_desc=Δημιουργεί ένα τείχος που μπλοκάρει τους εχθρούς.
actors.hero.spells.walloflight.desc=Ο Σταυροφόρος δημιουργεί έναν τοίχο από συμπαγές φως ακριβώς μπροστά του, ο οποίος έχει πάχος 1 τετράγωνο, πλάτος %1$dτετράγωνων και διαρκεί για 20 γύρους.\n\nΑυτός ο τοίχος λειτουργεί ακριβώς όπως ένας κανονικός τοίχος, με τη διαφορά ότι είναι διαφανής. Οι εχθροί που παγιδεύονται στον τοίχο κατά τη δημιουργία του θα ζαλιστούν στιγμιαία και θα απωθηθούν προς τα πίσω αν είναι δυνατόν. Οτιδήποτε έχει κολλήσει στον τοίχο θα μπορεί να μετακινηθεί έξω από αυτόν.\n\nΟ τοίχος μπορεί να ριχτεί σε οποιαδήποτε από τις οκτώ κατευθύνσεις. Εάν ένας τοίχος είναι ήδη ενεργός, το ξόρκι μπορεί να ξαναχρησιμοποιηθεί χωρίς κόστος για να εξαφανίσει αμέσως τον τοίχο.
actors.hero.spells.walloflight.early_end=Διαλύεις τον τοίχο του φωτός.
actors.hero.spells.walloflight$lightwall.desc=Τρεμάμενο φως εμποδίζει τη μετακίνηση εδώ.

##main hero
actors.hero.hero.name=εσύ
actors.hero.hero.leave=Δεν μπορείς να φύγεις ακόμη. Η κατακόμβη σε περιμένει!
actors.hero.hero.level_up=Ανέβηκες επίπεδο!
actors.hero.hero.new_level=Ανέβηκες επίπεδο! +Ακρίβεια, +Αποφυγή, +5 Ζωή!
actors.hero.hero.new_talent=+1 πόντος ταλέντων!
actors.hero.hero.unspent=Έχεις αχρησιμοποίητους πόντους ταλέντων!
actors.hero.hero.level_cap=Δεν μπορείς να δυναμώσεις άλλο, αλλά οι εμπειρίες σου σου χαρίζουν μια έκρηξη ισχύος!
actors.hero.hero.you_now_have=μάζεψες: %s.
actors.hero.hero.you_cant_have=δεν μπορείς να κουβαλήσεις: %s.
actors.hero.hero.locked_chest=Αυτό το σεντούκι είναι κλειδωμένο και δεν έχεις το αντίστοιχο κλειδί.
actors.hero.hero.locked_door=Δεν έχεις το αντίστοιχο κλειδί.
actors.hero.hero.noticed_smth=Παρατήρησες κάτι.
actors.hero.hero.wait=...
actors.hero.hero.search=Αναζήτηση
actors.hero.hero.search_distracted=Δυσκολεύεσαι να συγκεντρωθείς· η αναζήτηση είναι κουραστική.
actors.hero.hero.key_distracted=You fiddle with the lock but can't quite open it this time.
actors.hero.hero.pain_resist=Ο πόνος σε βοηθάει να αντισταθείς στην υπνηλία.
actors.hero.hero.revive=Το ανκχ εκρήγνυται με ζωτική ενέργεια!

##classes
actors.hero.heroclass.warrior=Πολεμιστής
actors.hero.heroclass.warrior_desc_short=Ο Πολεμιστής αντέχει περισσότερο τις επιθέσεις χάρη στην προστασία της _σπασμένης σφραγίδας._ Η σφραγίδα μετακινείται μεταξύ πανοπλιών και _μεταφέρει μία αναβάθμιση._
actors.hero.heroclass.warrior_desc=Ο Πολεμιστής ξεκινά με μια μοναδική _σπασμένη σφραγίδα_ που του προσφέρει ένα ποσό προστασίας όταν έχει λιγότερη από την μισή του ζωή. Η σφραγίδα μπορεί να μετακινείται μεταξύ πανοπλιών και να _μεταφέρει μία αναβάθμιση_ μαζί.\n\nΟ Πολεμιστής ξεκινά επίσης με ένα _φθαρμένο ξίφος,_ _τρεις πέτρες ρίψης,_ υφασμάτινη πανοπλία, φλασκί νερού και βελούδινο πουγκί.\n\nΟ Πολεμιστής αναγνωρίζει αυτόματα:\n_-_ Παπύρους αναγνώρισης\n_-_ Φίλτρα γιατρειάς\n_-_ Παπύρους οργής
actors.hero.heroclass.warrior_unlock=Ο Πολεμιστής ξεκλειδώνεται αυτόματα.

actors.hero.heroclass.mage=Μάγος
actors.hero.heroclass.mage_desc_short=Ο Μάγος είναι ειδικός στην αρκάνα κι έχει μια _μαγική ράβδο_ που είναι ισχυρότερη από τα κοινά ραβδιά. Η ράβδος μπορεί να _εμποτιστεί με κάθε ραβδί_ που βρίσκει ο Μάγος.
actors.hero.heroclass.mage_desc=Ο Μάγος ξεκινά με μία μοναδική _μαγική ράβδο,_ που επαναφορτίζεται αισθητά γρηγορότερα από τα ραβδιά κι έχει 1  παραπάνω φορτίο. Η ράβδος _μπορεί να εμποτιστεί με κάθε ραβδί_ που βρίσκει ο Μάγος στην κατακόμβη.\n\nΟ Μάγος ξεκινά επίσης με ένα _ραβδί μαγικού βλήματος_ εμποτισμένο στη ράβδο, υφασμάτινη πανοπλία, φλασκί νερού και βελούδινο πουγκί.\n\nΟ Μάγος αναγνωρίζει αυτόματα:\n_-_ Παπύρους αναγνώρισης\n_-_ Φίλτρα υγρής φλόγας\n_-_ Παπύρους αναβάθμισης
actors.hero.heroclass.mage_unlock=Για να ξεκλειδώσεις τον Μάγο, _χρησιμοποίησε έναν πάπυρο αναβάθμισης για να κάνεις ένα αντικείμενο ισχυρότερο._

actors.hero.heroclass.rogue=Κλέφτης
actors.hero.heroclass.rogue_desc_short=Ο Κλέφτης ξεφεύγει από τους εχθρούς και χτυπά από αορατότητα με τον _μανδύα των σκιών._ Επιπλέον, _εντοπίζει μυστικά και παγίδες_ σε μεγάλη απόσταση.
actors.hero.heroclass.rogue_desc=Ο Κλέφτης ξεκινά με τον _μοναδικό μανδύα των σκιών,_ με τον οποίο μπορεί γίνει αόρατος κατά βούληση. \n\nΟ Κλέφτης _εντοπίζει μυστικά και παγίδες_ από μεγαλύτερη απόσταση.\n\nΟ Κλέφτης ξεκινά επίσης με _ένα στιλέτο, τρία μαχαίρια ρίψης,_ υφασμάτινη πανοπλία, φλασκί νερού και βελούδινο πουγκί.\n\nΟ Κλέφτης αναγνωρίζει αυτόματα:\n_-_ Παπύρους αναγνώρισης\n_-_ Φίλτρα αορατότητας\n_-_ Παπύρους μαγικής χαρτογράφησης
actors.hero.heroclass.rogue_unlock=Για να ξεκλειδώσεις τον Κλέφτη, _εκτέλεσε 10 αιφνίδιες επιθέσεις σε ένα παιχνίδι._

actors.hero.heroclass.huntress=Κυνηγός
actors.hero.heroclass.huntress_desc_short=Η Κυνηγός είναι ειδική στα όπλα ρίψης κι έχει ένα _μαγικό τόξο_ με άπειρα βέλη. Επιπλέον, περνά μέσα από ψηλό γρασίδι _χωρίς να το ποδοπατά._
actors.hero.heroclass.huntress_desc=Η Κυνηγός ξεκινά με ένα μοναδικό _πνευματικό τόξο_ που εξαπολύει έναν απεριόριστο αριθμό υλοποιήσιμων βελών.\n\nΗ Κυνηγός μπορεί να περνά μέσα από το ψηλό γρασίδι _χωρίς να το ποδοπατά._\n\nΗ Κυνηγός ξεκινά επίσης με ένα ζευγάρι _γάντια με καρφιά,_ υφασμάτινη πανοπλία, φλασκί νερού και βελούδινο πουγκί.\n\nΗ Κυνηγός αναγνωρίζει αυτόματα:\n_-_ Παπύρους αναγνώρισης\n_-_ Φίλτρα ενόρασης\n_-_ Παπύρους νανουρίσματος
actors.hero.heroclass.huntress_unlock=Για να ξεκλειδώσεις την Κυνηγό, _χτύπησε εχθρούς με όπλα ρίψης 10 φορές σε ένα παιχνίδι._

actors.hero.heroclass.duelist=Ξιφομάχος
actors.hero.heroclass.duelist_desc_short=Η Ξιφομάχος είναι ειδική στα όπλα και μπορεί να εκτελεί μια _ειδική ικανότητα_ με το όπλο της. Αυτή η ικανότητα είναι _διαφορετική για κάθε όπλο._
actors.hero.heroclass.duelist_desc=Η Ξιφομάχος ξεκινά με ένα _μοναδικό ξιφίδιο,_ με ειδική ικανότητα που επαναφορτίζεται με τον χρόνο.\n\nΚάθε όπλο του παιχνιδιού έχει μια _διαφορετική ειδική ικανότητα_ που μπορεί να χρησιμοποιεί η Ξιφομάχος.\n\nΗ Ξιφομάχος ξεκινά επίσης με _δύο καρφιά ρίψης,_ υφασμάτινη πανοπλία, φλασκί νερού και βελούδινο πουγκί.\n\nΗ Ξιφομάχος αναγνωρίζει αυτόματα:\n_-_ Παπύρους αναγνώρισης\n_-_ Φίλτρα δύναμης\n_-_ Παπύρους κατοπτρικής εικόνας
actors.hero.heroclass.duelist_unlock=Για να ξεκλειδώσεις την Ξιφομάχο, _εξόπλισε ένα όπλο 2ης και άνω βαθμίδας χωρίς ποινή δύναμης._

actors.hero.heroclass.cleric=Κληρικός
actors.hero.heroclass.cleric_desc_short=Ο Κληρικός διοχετεύει θεϊκή μαγεία μέσω του _ιερού τόμου_ του για να υλοποιεί θεϊκά ξόρκια. Μπορεί να _μαθαίνει και να αναβαθμίζει τα ξόρκια_ μέσω των ταλέντων.
actors.hero.heroclass.cleric_desc=Ο Κληρικός ξεκινά με τον _μοναδικό ιερό τόμο,_ με τον οποίο μπορεί να εκτελεί διάφορα ξόρκια.\n\nΤα περισσότερα ταλέντα του Κληρικού αφορούν την εκμάθηση και αναβάθμιση των ξορκιών αυτών.\n\nΟ Κληρικός ξεκινά επίσης με _ένα βαρδούκιο,_ υφασμάτινη πανοπλία, φλασκί νερού και βελούδινο πουγκί.\n\nΟ Κληρικός αναγνωρίζει αυτόματα:\n_-_ Παπύρους αναγνώρισης\n_-_ Φίλτρα κάθαρσης\n_-_ Παπύρους αφαίρεσης κατάρας
actors.hero.heroclass.cleric_unlock=Για να ξεκλειδώσεις τον Κληρικό, _καθάρισε πλήρως την κατάρα ενός καταραμένου εφοδίου._

actors.hero.herosubclass.berserker=Βάρβαρος
actors.hero.herosubclass.berserker_short_desc=Ο _Βάρβαρος_ συσσωρεύει οργή όσο δέχεται ζημιά. Η οργή ανεβάζει τη ζημιά που προκαλεί και μπορεί να ενεργοποιηθεί στο 100% για επιπλέον προστασία.
actors.hero.herosubclass.berserker_desc=Ο _Βάρβαρος_ συσσωρεύει οργή όσο λαμβάνει φυσιολογική ζημιά – συμπεριλαμβανομένης της ζημιάς που εμποδίζεται από την πανοπλία! Η οργή εξασθενεί με τον χρόνο, αλλά η μείωση είναι πιο αργή όταν έχει χαμηλή ζωή.\n\nΟ Βάρβαρος προκαλεί έως και +50% ζημιά. Στη μέγιστη οργή μπορεί να εξαγριωθεί, λαμβάνοντας ένα ποσό προστασίας και διατηρώντας την οργή του για όσο έχει ακόμα προστασία. Το ποσό της προστασίας αναλογεί στο επίπεδο της πανοπλίας του Βάρβαρου, και μπορεί να ενισχυθεί σημαντικά εάν έχει χαμηλή ζωή. Χρειάζεται, όμως, χρόνο για να ανακάμψει αφού εξαγριωθεί.
actors.hero.herosubclass.gladiator=Μονομάχος
actors.hero.herosubclass.gladiator_short_desc=Ο _Μονομάχος_ αυξάνει τη διαδοχή χτυπημάτων όταν κάνει επιτυχημένες επιθέσεις. Μπορεί να αξιοποιήσει τη διαδοχή του για να κάνει χρήση μοναδικών ικανοτήτων.
actors.hero.herosubclass.gladiator_desc=Ο Μονομάχος συγκεντρώνει έναν πόντο διαδοχής κάθε φορά που πετυχαίνει επίθεση με όπλο ρίψης ή μάχης σώμα-με-σώμα. Εάν ο Μονομάχος δεν πετύχει έστω μία επίθεση εντός 5 γύρων (ή 15 γύρων μετά την εξόντωση εχθρού), η διαδοχή μηδενίζεται.\n\nΌσο η διαδοχή μεγαλώνει, ο Μονομάχος μπορεί να χρησιμοποιήσει μια ποικιλία ικανοτήτων που χτυπούν εγγυημένα:\n2 διαδοχή: πετά τον εχθρό πίσω· διατηρεί τη διαδοχή\n4 διαδοχή: προκαλεί ζημιά βάσει της πανοπλίας\n6 διαδοχή: αντεπιτίθεται· διατηρεί τη διαδοχή\n8 διαδοχή: ζημιά σε στόχο και κοντινούς εχθρούς\n10 διαδοχή: επιτίθεται μία φορά ανά πόντο διαδοχής
actors.hero.herosubclass.battlemage=Μαγομαχητής
actors.hero.herosubclass.battlemage_short_desc=Ο _Μαγομαχητής_ ενεργοποιεί επιπλέον επιδράσεις όταν παλεύει σώμα-με-σώμα με τη ράβδο του. Οι επιδράσεις εξαρτώνται από το ραβδί που έχει εμποτιστεί στη ράβδο.
actors.hero.herosubclass.battlemage_desc=Ο Μαγομαχητής ενεργοποιεί μια επίδραση όποτε χτυπάει με τη ράβδο του σε μάχη σώμα-με-σώμα – σαν να είχε η ράβδος μία επιπλέον μαγική ενίσχυση. Οι επιδράσεις εξαρτώνται από το ραβδί που είναι εμποτισμένο στη ράβδο· κάθε ραβδί έχει τη δική του επίδραση. Εκτός από την επίδραση του ραβδιού, η ράβδος θα λαμβάνει και 0.5 φορτίο με κάθε χτύπημα.
actors.hero.herosubclass.warlock=Αρχιμάγος
actors.hero.herosubclass.warlock_short_desc=Ο _Αρχιμάγος_ έχει μια πιθανότητα να σημαδέψει τη ψυχή ενός εχθρού με τα ραβδιά του. Αναπληρώνει ζωή όποτε προκαλεί φυσιολογική ζημιά σε σημαδεμένους εχθρούς.
actors.hero.herosubclass.warlock_desc=Ο _Αρχιμάγος_ έχει την πιθανότητα να σημαδέψει την ψυχή ενός χαρακτήρα όταν χρησιμοποιεί ραβδί πάνω του. Η πιθανότητα πρόκλησης και η διάρκεια του ψυχικού σημαδιού αυξάνονται με το επίπεδο του ραβδιού.\n\nΌταν η ψυχή ενός εχθρού σημαδευτεί, ο Αρχιμάγος αναπληρώνει 2 ζωή για κάθε 5 ζημιά που του προκαλεί – αλλά μόνο από επιθέσεις μάχης σώμα-με-σώμα ή όπλων ρίψης, όχι από ραβδιά!
actors.hero.herosubclass.assassin=Δολοφόνος
actors.hero.herosubclass.assassin_short_desc=Ο _Δολοφόνος_ ετοιμάζει ένα θανάσιμο χτύπημα όσο είναι αόρατος. Όσο περισσότερο περιμένει, τόσο ισχυρότερη θα είναι η επίθεση.
actors.hero.herosubclass.assassin_desc=Ο Δολοφόνος ετοιμάζει το επόμενο χτύπημα όσο είναι αόρατος. Όσο περισσότερο προετοιμάζεται, τόσο πιο ισχυρή θα είναι η επόμενή του επίθεση. Η προετοιμασία διαρκεί έως 9 γύρους.\n\nΑφού προετοιμαστεί, θα προκαλέσει επιπλέον ζημιά στην επόμενη επίθεση. Μπορεί, επίσης, να αναπηδήσει προς τον στόχο αλλά και να εξοντώσει ακαριαία τους πολύ τραυματισμένους εχθρούς.
actors.hero.herosubclass.freerunner=Δρομέας
actors.hero.herosubclass.freerunner_short_desc=Ο _Δρομέας_ αποκτά ορμή ενώ τρέχει, η οποία μπορεί να χρησιμοποιηθεί για να ξεκινήσει ελεύθερο τρέξιμο. Αυτό του προσφέρει επιπλέον ταχύτητα και αποφυγή για μικρό χρονικό διάστημα.
actors.hero.herosubclass.freerunner_desc=Ο Δρομέας αυξάνει την ορμή του όσο κινείται. Μπορεί να λάβει έως 10 ορμή αφού κινηθεί για 10 γύρους - αλλά τη χάνει πολύ γρήγορα αν σταματήσει να κινείται. Μπορεί να ξοδέψει την ορμή του για να κάνει ελεύθερο τρέξιμο, για 2 γύρους ανά πόντο ορμής.\n\nΣτο ελεύθερο τρέξιμο, κινείται με x2 ταχύτητα και λαμβάνει αύξηση στην αποφυγή αναλογικά με το επίπεδό του. Αφού λήξει το ελεύθερο τρέξιμο, υπάρχει μια περίοδος αναπλήρωσης προτού αναπτύξει ξανά ορμή.
actors.hero.herosubclass.sniper=Σκοπεύτρια
actors.hero.herosubclass.sniper_short_desc=Η _Σκοπεύτρια_ μπορεί να διαπερνά πανοπλίες με επιθέσεις απόστασης. Αφού χτυπήσει με όπλο ρίψης, μπορεί να επακολουθήσει με μια ειδική επίθεση από το τόξο της.
actors.hero.herosubclass.sniper_desc=Η Σκοπεύτρια είναι ειδική στη μάχη απόστασης· οι μακρινές της επιθέσεις παρακάμπτουν την πανοπλία. Οι επιθέσεις με όπλα ρίψης τοποθετούν στον στόχο το Σημάδι της Σκοπεύτριας. Αυτό της επιτρέπει να επακολουθήσει με μια ειδική επίθεση με το τόξο, που ποικίλλει ανάλογα με το πώς είναι ενδυναμωμένο το τόξο.\n\nΈνα μη ενδυναμωμένο τόξο εξαπολύει μία Ταχεία βολή, που εκτελείται ακαριαία αλλά με μειωμένη ζημιά. Ένα τόξο ταχύτητας εξαπολύει μια Ομοβροντία τριών βελών, που κάνουν μειωμένη ζημιά, μπορούν να ενεργοποιήσουν τη μαγική ενίσχυση και απαιτούν 1 γύρο. Ένα τόξο ζημιάς εξαπολύει μία Σκοπευτική βολή, που χτυπά εγγυημένα, προκαλεί επιπλέον ζημιά αναλογικά με την απόσταση και απαιτεί 2 γύρους.
actors.hero.herosubclass.warden=Δασοφύλακας
actors.hero.herosubclass.warden_short_desc=Η _Δασοφύλακας_ μπορεί να βλέπει μέσα από το ψηλό γρασίδι, και λαμβάνει επιπλέον επιδράσεις όταν φυτεύει σπόρους ή ποδοπατά φυτά.
actors.hero.herosubclass.warden_desc=Η _Δασοφύλακας_ έχει ισχυρό δεσμό με τη φύση και λαμβάνει μια ποικιλία θετικών επιδράσεων σχετιζόμενων με το γρασίδι και τα φυτά. Βλέπει μέσα από ψηλό ή στραπατσαρισμένο γρασίδι σαν να ήταν κενός χώρος.\n\nΗ Δασοφύλακας κάνει το γρασίδι να βλαστήσει γύρω από το σημείο που πετά ή φυτεύει σπόρο. Ενεργοποιεί ειδικές επιδράσεις όταν πατά φυτά, οι οποίες αντικαθιστούν τις κανονικές τους επιδράσεις. Έτσι, κανένα φυτό δεν της είναι επιβλαβές κατά το πάτημα.
actors.hero.herosubclass.champion=Μαχήτρια
actors.hero.herosubclass.champion_short_desc=Η _Μαχήτρια_ μπορεί να κρατά δύο όπλα και έχει μεγαλύτερο οπλικό φορτίο. Οι κανονικές της επιθέσεις χρησιμοποιούν το κύριο όπλο, αλλά μπορεί να τα εναλλάσσει και να χρησιμοποιεί τις ικανότητες έκαστου.
actors.hero.herosubclass.champion_desc=Η Μαχήτρια είναι αυθεντία στα όπλα μάχης σώμα-με-σώμα και μπορεί να εξοπλίσει ένα δεύτερο όπλο μαζί με το κύριο. Οι κανονικές της επιθέσεις χρησιμοποιούν το κύριο όπλο, αλλά μπορεί να τα εναλλάσσει ακαριαία και να χρησιμοποιεί την οπλική ικανότητα οποιουδήποτε από τα δύο.\n\nΈχει επίσης 2 επιπλέον μέγιστο οπλικό φορτίο και +50% ταχύτητα επαναφόρτισης των οπλικών ικανοτήτων.
actors.hero.herosubclass.monk=Μοναχή
actors.hero.herosubclass.monk_short_desc=Η _Μοναχή_ αναπτύσσει ενέργεια ενώ πολεμά. Αυτή η ενέργεια μπορεί να αξιοποιηθεί σε μια ποικιλία μοναδικών ικανοτήτων.
actors.hero.herosubclass.monk_desc=Η Μοναχή είναι αυθεντία στη σωματική τεχνική. Όσο εξοντώνει εχθρούς, αποκτά μια ενέργεια που μπορεί να χρησιμοποιεί σε διάφορες αμυντικές και χρηστικές ικανότητες. Αυτή η ενέργεια δεν εξασθενεί με την πάροδο του χρόνου, αλλά έχει κάποιο όριο ανάλογα με το επίπεδο της Μοναχής.\n\n1 ενέργεια: γρήγορο χτύπημα με γροθιές\n2 ενέργεια: συγκέντρωση & αποφυγή 1 επίθεσης\n3 ενέργεια: ακαριαία αναπήδηση παραδίπλα\n4 ενέργεια: πέταγμα εχθρού μακριά με λάκτισμα\n5 ενέργεια: διαλογισμός για τον καθαρισμό επιδράσεων και την αναπλήρωση φορτίου ραβδιών & τεχνουργημάτων
actors.hero.herosubclass.priest=Ιερέας
actors.hero.herosubclass.priest_short_desc=Ο _Ιερέας_ λαμβάνει νέα ξόρκια μακρινής απόστασης και μια ενδυναμωμένη εκδοχή του καθοδηγητικού φωτός.
actors.hero.herosubclass.priest_desc=Ο Ιερέας λαμβάνει ποικίλα νέα και αναβαθμισμένα ξόρκια που δίνουν έμφαση στη μάχη απόστασης και τη συνέργεια με μαγικά αντικείμενα.\n\nΟ Ιερέας μπορεί να εκτελεί το _Καθοδηγητικό φως_ χωρίς κόστος ανά 50 γύρους, να φωτίζει τους έχθρους που στοχεύει απευθείας με οποιοδήποτε από τα ξόρκια του, και να καταναλώνει τον φωτισμό με χρήση συμμάχων, ραβδιών και κάποιων τεχνουργημάτων, για μπόνους ζημιά ίση με το επίπεδό του +5.\n\nΛαμβάνει επίσης το ξόρκι _Λάμψη,_ που διαλύει το σκοτάδι και επιδρά πάνω σε όλους τους ορατούς εχθρούς ενεργοποιώντας και εφαρμόζοντας φωτισμό και ακινητοποιώντας για λίγο, με κόστος 2 φορτίου.
actors.hero.herosubclass.paladin=Σταυροφόρος
actors.hero.herosubclass.paladin_short_desc=Ο _Σταυροφόρος_ λαμβάνει νέες ικανότητες κοντινής απόστασης και ενδυναμωμένες εκδοχές του ιερού όπλου και του ιερού φρουρού.
actors.hero.herosubclass.paladin_desc=Ο Σταυροφόρος αποκτά μια ποικιλία από νέα και αναβαθμισμένα ξόρκια που δίνουν έμφαση στη μάχη σώμα-με-σώμα και στη συνέργεια με όπλα και πανοπλίες.\n\nΤα ξόρκια _Ιερό όπλο_ και _Ιερός φρουρός_ παρέχουν μεγαλύτερα μπόνους, δεν παρακάμπτουν πλέον τα υπάρχοντα ξόρκια και γλύφους, και μπορούν να επεκταθούν εκτελώντας άλλα ξόρκια.\n\nΟ Σταυροφόρος αποκτά επίσης το ξόρκι _Πλήγμα,_ το οποίο του επιτρέπει να εκτελέσει ένα εγγυημένο χτύπημα μάχης σώμα-με-σώμα με μπόνους στη ζημιά και στη μαγική ενίσχυση.

##talents
actors.hero.talent$provokedangertracker.name=προκληθείσα οργή
actors.hero.talent$provokedangertracker.desc=Ο Πολεμιστής έχασε πρόσφατα την προστασία του. Η επόμενη φυσιολογική του επίθεση θα προκαλέσει επιπλέον ζημιά.\n\nΓύροι που απομένουν: %s.
actors.hero.talent$lingeringmagictracker.name=εναπομείνουσα μαγεία
actors.hero.talent$lingeringmagictracker.desc=Ο Μάγος χρησιμοποίησε πρόσφατα ραβδί ή τη ράβδο του. Η επόμενη φυσιολογική του επίθεση θα προκαλέσει επιπλέον ζημιά.\n\nΓύροι που απομένουν: %s.
actors.hero.talent$followupstriketracker.name=επακόλουθο χτύπημα
actors.hero.talent$followupstriketracker.desc=Η Κυνηγός επιτέθηκε πρόσφατα σε εχθρό με όπλο ρίψης. Η επόμενη επίθεση μάχης σώμα-με-σώμα εναντίον του ίδιου στόχου θα προκαλέσει επιπλέον ζημιά.\n\nΓύροι που απομένουν: %s.
actors.hero.talent$patientstriketracker.name=καρτερικό χτύπημα
actors.hero.talent$patientstriketracker.desc=Η Ξιφομάχος μόλις δαπάνησε έναν γύρο περιμένοντας· η επόμενή της επίθεση μάχης σώμα-με-σώμα θα προκαλέσει επιπλέον ζημιά.
actors.hero.talent$improvisedprojectilecooldown.name=Αναπλήρωση αυτοσχέδιων βλημάτων
actors.hero.talent$improvisedprojectilecooldown.desc=Έχεις χρησιμοποιήσει πρόσφατα το ταλέντο και πρέπει να περιμένεις πριν το χρησιμοποιήσεις ξανά.\n\nΓύροι που απομένουν: %s.
actors.hero.talent$rejuvenatingstepscooldown.name=Αναπλήρωση αναζωογονητικών βημάτων
actors.hero.talent$rejuvenatingstepscooldown.desc=Έχεις χρησιμοποιήσει πρόσφατα το ταλέντο και πρέπει να περιμένεις πριν το χρησιμοποιήσεις ξανά.\n\nΓύροι που απομένουν: %s.
actors.hero.talent$seershotcooldown.name=Αναπλήρωση μαντικής ρίψης
actors.hero.talent$seershotcooldown.desc=Έχεις χρησιμοποιήσει πρόσφατα το ταλέντο και πρέπει να περιμένεις πριν το χρησιμοποιήσεις ξανά.\n\nΓύροι που απομένουν: %s.
actors.hero.talent$aggressivebarriercooldown.name=αναπλήρωση επιθετικού πεδίου
actors.hero.talent$aggressivebarriercooldown.desc=Έχεις χρησιμοποιήσει πρόσφατα το ταλέντο και πρέπει να περιμένεις πριν το χρησιμοποιήσεις ξανά.\n\nΓύροι που απομένουν: %s.
actors.hero.talent$liquidagilacctracker.name=υγρή ευκινησία
actors.hero.talent$liquidagilacctracker.desc=Η επόμενη κανονική επίθεση μάχης σώμα-με-σώμα της Ξιφομάχου αποκτά επιπλέον ακρίβεια. \n\nΓύροι που απομένουν: %s.
actors.hero.talent$lethalhastecooldown.name=αναπλήρωση φονικής βιασύνης
actors.hero.talent$lethalhastecooldown.desc=Έχεις χρησιμοποιήσει πρόσφατα το ταλέντο και πρέπει να περιμένεις πριν το χρησιμοποιήσεις ξανά.\n\nΓύροι που απομένουν: %s.
actors.hero.talent$swiftequipcooldown.name=αναπλήρωση ταχείας εξόπλισης
actors.hero.talent$swiftequipcooldown.desc=Έχεις χρησιμοποιήσει πρόσφατα το ταλέντο και πρέπει να περιμένεις πριν το χρησιμοποιήσεις ξανά.\n\nΓύροι που απομένουν: %s.
actors.hero.talent$preciseassaulttracker.name=επίθεση ακριβείας
actors.hero.talent$preciseassaulttracker.desc=Η επόμενη κανονική επίθεση μάχης σώμα-με-σώμα της Ξιφομάχου αποκτά επιπλέον ακρίβεια. \n\nΓύροι που απομένουν: %s.
actors.hero.talent$deadlyfollowuptracker.name=θανάσιμο επακόλουθο
actors.hero.talent$deadlyfollowuptracker.desc=Η Ξιφομάχος επιτέθηκε πρόσφατα σε εχθρό με όπλο ρίψης. Οι επιθέσεις μάχης σώμα-με-σώμα εναντίον του ίδιου στόχου θα προκαλούν επιπλέον ζημιά.\n\nΓύροι που απομένουν: %s.
actors.hero.talent$combinedlethalityabilitytracker.executed=Εκτελέστηκε
actors.hero.talent$satiatedspellstracker.name=Προστατευτικό ξόρκι
actors.hero.talent$satiatedspellstracker.desc=Το επόμενο ξόρκι του Κληρικού θα του παράσχει λίγη ασπίδα.
actors.hero.talent$searinglightcooldown.name=Καυτό Φως
actors.hero.talent$searinglightcooldown.desc=Έχεις χρησιμοποιήσει πρόσφατα το ταλέντο και πρέπει να περιμένεις πριν το χρησιμοποιήσεις ξανά.\n\nΓύροι που απομένουν: %s.

#warrior
actors.hero.talent.hearty_meal.title=πλούσιο γεύμα
actors.hero.talent.hearty_meal.desc=_+1:_ Τρώγοντας, ο Πολεμιστής θεραπεύεται για _4 ζωή_ όταν έχει 33% ζωή και κάτω.\n\n_+2:_ Τρώγοντας, ο Πολεμιστής θεραπεύεται για _6 ζωή_ όταν έχει 33% ζωή και κάτω.
actors.hero.talent.veterans_intuition.title=διαίσθηση του βετεράνου
actors.hero.talent.veterans_intuition.desc=_+1:_ Ο Πολεμιστής αναγνωρίζει τα όπλα _x1.75 γρηγορότερα_ και την πανοπλία _x2.5 γρηγορότερα._ \n\n_+2:_ Ο Πολεμιστής αναγνωρίζει τα όπλα _x2.5 γρηγορότερα_ και την πανοπλία _μόλις την εξοπλίσει._
actors.hero.talent.provoked_anger.title=προκληθείσα οργή
actors.hero.talent.provoked_anger.desc=_+1:_ Όταν οποιαδήποτε επίδραση προστασίας του Πολεμιστή σπάσει εξαιτίας ζημιάς, η επόμενη φυσιολογική του επίθεση θα προκαλέσει _3 επιπλέον ζημιά_.\n\n_+2:_ Όταν οποιαδήποτε επίδραση προστασίας του Πολεμιστή σπάσει εξαιτίας ζημιάς, η επόμενη φυσιολογική του επίθεση θα προκαλέσει _5 επιπλέον ζημιά_.
actors.hero.talent.iron_will.title=σιδηρά θέληση
actors.hero.talent.iron_will.desc=_+1:_ Η ασπίδα που παρέχεται από τη σφραγίδα του Πολεμιστή _αυξάνεται κατά 1_.\n\n_+2:_ Η ασπίδα που παρέχεται από τη σφραγίδα του Πολεμιστή _αυξάνεται κατά 2_.
actors.hero.talent.iron_will.meta_desc=_Αν το ταλέντο παρθεί από διαφορετικό ήρωα,_ θα παρέχει μία παθητική εκδοχή της επίδρασης της σπασμένης σφραγίδας του Πολεμιστή, με μέγιστη ασπίδα 1 ή 2.

actors.hero.talent.iron_stomach.title=σιδερένιο στομάχι
actors.hero.talent.iron_stomach.desc=_+1:_ Ο Πολεμιστής ξοδεύει 1 γύρο για να καταναλώσει φαγητό, και λαμβάνει _75% αντίσταση στη ζημιά_ ενώ τρώει.\n\n_+2:_ Ο Πολεμιστής ξοδεύει 1 γύρο για να καταναλώνει φαγητό, και λαμβάνει _100% αντίσταση στη ζημιά_ ενώ τρώει.
actors.hero.talent.liquid_willpower.title=υγρή θέληση
actors.hero.talent.liquid_willpower.desc=_+1:_ Ο Πολεμιστής αποκτά το _6.5% της μέγιστης ζωής του σε μορφή προστασίας_ όποτε πίνει ή πετά φίλτρο, σκεύασμα ή ελιξίριο.\n\n_+2:_ Ο Πολεμιστής αποκτά το _10% της μέγιστης ζωής του σε μορφή προστασίας_ όποτε πίνει ή πετά φίλτρο, σκεύασμα ή ελιξίριο.\n\nΗ προστασία διπλασιάζεται με τη χρήση φίλτρου δύναμης ή εμπειρίας, καθώς και αντικείμενα που απαιτούν αυτά τα φίλτρα για να παρασκευαστούν αλχημικά.\n\nΓια αλχημικά αντικείμενα με μεγαλύτερη ποσότητα παραγωγής (π.χ. υδατικό σκεύασμα), το ταλέντο έχει πιθανότητα να ενεργοποιηθεί βάσει της ποσότητας του αντικειμένου που παράγεται.
actors.hero.talent.runic_transference.title=ρουνική μεταφορά
actors.hero.talent.runic_transference.desc=_+1:_ Η σπασμένη σφραγίδα του Πολεμιστή μπορεί να μεταφέρει _κανονικούς γλύφους_ με τον ίδιο τρόπο που μεταφέρει μία αναβάθμιση.\n\n_+2:_ Η σπασμένη σφραγίδα του Πολεμιστή μπορεί να μεταφέρει _κανονικούς, ισχυρούς, και καταραμένους γλύφους_ με τον ίδιο τρόπο που μεταφέρει μία αναβάθμιση.\n\nΗ σφραγίδα μπορεί να μεταφέρει μόνο τους γλύφους που είχαν εφαρμοστεί στην πανοπλία ενώ η σφραγίδα ήταν προσαρτημένη.
actors.hero.talent.runic_transference.meta_desc=_Αν το ταλέντο παρθεί από διαφορετικό ήρωα,_ θα κάνει τον γλύφο της πανοπλίας σου να αντιστέκεται στους παπύρους αναβάθμισης. Οι γλύφοι θα αρχίσουν να χάνονται με την αναβάθμιση από το 6ο επίπεδο στο +1 (αντί για το 4ο), και από το 7ο επίπεδο στο +2 (αντί για το 4ο). Το επίπεδο που οι γλύφοι χάνονται εγγυημένα παραμένει το 8ο.
actors.hero.talent.lethal_momentum.title=φονική ορμή
actors.hero.talent.lethal_momentum.desc=_+1:_ Όταν ο Πολεμιστής καταφέρει θανάσιμο χτύπημα σε εχθρό με όπλο φυσιολογικής ζημιάς, έχει _67% πιθανότητα_ να καταναλώσει 0 γύρους.\n\n_+2:_ Όταν ο Πολεμιστής καταφέρει θανάσιμο χτύπημα σε εχθρό με όπλο φυσιολογικής ζημιάς, έχει _100% πιθανότητα_ να καταναλώσει 0 γύρους.
actors.hero.talent.improvised_projectiles.title=αυτοσχέδια βλήματα
actors.hero.talent.improvised_projectiles.desc=_+1:_ Ο Πολεμιστής μπορεί να τυφλώσει έναν εχθρό για _2 γύρους,_ ρίχνοντάς του κάποιο αντικείμενο που δεν είναι όπλο ρίψης. Μπορεί να ξαναχρησιμοποιηθεί σε 50 γύρους.\n\n_+2:_ Ο Πολεμιστής μπορεί να τυφλώσει έναν εχθρό για _3 γύρους,_ ρίχνοντάς του κάποιο αντικείμενο που δεν είναι όπλο ρίψης. Μπορεί να ξαναχρησιμοποιηθεί σε 50 γύρους.

actors.hero.talent.hold_fast.title=γερό κράτημα
actors.hero.talent.hold_fast.desc=_+1:_ Όταν ο Πολεμιστής περιμένει, λαμβάνει _1-2 πανοπλία_ και επιβραδύνει την μείωση επιδράσεων διαδοχής και προστασίας κατά _50%_ μέχρι να μετακινηθεί.\n\n_+2:_ Όταν ο Πολεμιστής περιμένει, λαμβάνει _2-4 πανοπλία_ και επιβραδύνει την μείωση επιδράσεων διαδοχής και προστασίας κατά _75%_ μέχρι να μετακινηθεί.\n\n_+3:_ Όταν ο Πολεμιστής περιμένει, λαμβάνει _3-6 πανοπλία_ και επιβραδύνει την μείωση επιδράσεων διαδοχής και προστασίας κατά _100%_ μέχρι να μετακινηθεί.
actors.hero.talent.strongman.title=μασίστας
actors.hero.talent.strongman.desc=_+1:_ Η δύναμη του Πολεμιστή _αυξάνεται κατά 8%_, στρογγυλοποιημένη προς τα κάτω.\n\n_+2:_ Η δύναμη του Πολεμιστή _αυξάνεται κατά 13%_, στρογγυλοποιημένη προς τα κάτω.\n\n_+3:_ Η δύναμη του Πολεμιστή _αυξάνεται κατά 18%_, στρογγυλοποιημένη προς τα κάτω.

actors.hero.talent.endless_rage.title=ακόρεστη οργή
actors.hero.talent.endless_rage.desc=_+1:_ Ο Βάρβαρος μπορεί να συσσωρεύσει έως και _116% οργή._\n\n_+2:_ Ο Βάρβαρος μπορεί να συσσωρεύσει έως και _133% οργή._\n\n_+3:_ Ο Βάρβαρος μπορεί να συσσωρεύσει έως και _150% οργή._\n\nΚάθε μονάδα οργής άνω του 100% αυξάνει κατά 1% την προστασία της εξαγρίωσης, και μειώνει κατά 1% την περίοδο αναπλήρωσης, αλλά δεν θα αυξήσει τη ζημιά περισσότερο από το +50%.
actors.hero.talent.deathless_fury.title=αθάνατη οργή
actors.hero.talent.deathless_fury.desc=_+1:_ H εξαγρίωση ξεκινά αυτόματα τη στιγμή που ο Βάρβαρος πάει να πεθάνει με οργή 100% και άνω, μα έχει περίοδο αναπλήρωσης _3 επιπέδων του ήρωα_ όταν συμβεί αυτό.\n\n_+2:_ H εξαγρίωση ξεκινά αυτόματα τη στιγμή που ο Βάρβαρος πάει να πεθάνει με οργή 100% και άνω, μα έχει περίοδο αναπλήρωσης _2 επιπέδων του ήρωα_ όταν συμβεί αυτό.\n\n_+3:_ H εξαγρίωση ξεκινά αυτόματα τη στιγμή που ο Βάρβαρος πάει να πεθάνει με οργή 100% και άνω, μα έχει περίοδο αναπλήρωσης _1 επιπέδου του ήρωα_ όταν συμβεί αυτό.\n\nΈχε υπόψη ότι ο Βάρβαρος θα πεθάνει αν τελειώσει η εξαγρίωση με 0 ζωή.
actors.hero.talent.enraged_catalyst.title=εξαγριωτικός καταλύτης
actors.hero.talent.enraged_catalyst.desc=_+1:_ Οι μαγικές ενισχύσεις και οι κατάρες στο όπλο του Βάρβαρου ενεργοποιούνται συχνότερα, ανάλογα με την οργή του. Το μέγιστο είναι _15% συχνότερα_ σε 100% οργή.\n\n_+2:_ Οι μαγικές ενισχύσεις και οι κατάρες στο όπλο του Βάρβαρου ενεργοποιούνται συχνότερα, ανάλογα με την οργή του. Το μέγιστο είναι _30% συχνότερα_ σε 100% οργή.\n\n_+3:_ Οι μαγικές ενισχύσεις και οι κατάρες στο όπλο του Βάρβαρου ενεργοποιούνται συχνότερα, ανάλογα με την οργή του. Το μέγιστο είναι _45% συχνότερα_ σε 100% οργή.

actors.hero.talent.cleave.title=κοψιά
actors.hero.talent.cleave.desc=_+1:_ Ο επιπλέον χρόνος που κερδίζει ο Μονομάχος όταν σκοτώνει έναν εχθρό αυξάνεται σε _30 γύρους_, από 15.\n\n_+2:_ Ο επιπλέον χρόνος που κερδίζει ο Μονομάχος όταν σκοτώνει έναν εχθρό αυξάνεται σε _45 γύρους_, από 15.\n\n_+3:_ Ο επιπλέον χρόνος που κερδίζει ο Μονομάχος όταν σκοτώνει έναν εχθρό αυξάνεται σε _60 γύρους_, από 15.
actors.hero.talent.lethal_defense.title=φονική άμυνα
actors.hero.talent.lethal_defense.desc=_+1:_ When the Gladiator kills an enemy with a combo move, the cooldown on his broken seal shielding is _reduced by 50 turns_.\n\n_+2:_ When the Gladiator kills an enemy with a combo move, the cooldown on his broken seal shielding is _reduced by 100 turns_.\n\n_+3:_ When the Gladiator kills an enemy with a combo move, the cooldown on his broken seal shielding is _reduced by 150 turns_.\n\nThe shield cooldown can be reduced to as low as -150 turns by this talent, which means it will immediately be available again once it is activated.
actors.hero.talent.enhanced_combo.title=βελτιωμένη διαδοχή χτυπημάτων
actors.hero.talent.enhanced_combo.desc=_+1:_ Όταν η διαδοχή του Μονομάχου είναι 7 και άνω, η Σπρωξιά στέλνει τον στόχο πίσω στα 3 τετράγωνα, του προκαλεί ζαλάδα, και μπορεί να τον ρίξει σε χάσμα.\n\n_+2:_ Επιπρόσθετα στα οφέλη του +1, όταν η διαδοχή του Μονομάχου είναι 9 και άνω, η Αντεπίθεση λειτουργεί σε πολλαπλές επιθέσεις.\n\n_+3:_ Επιπρόσθετα στα οφέλη των +1 και +2, ο Μονομάχος μπορεί να πηδήξει έως και διαδοχή÷3 τετράγωνα όταν χρησιμοποιεί το Κοπάνημα, τη Σύνθλιψη ή τη Μανία.

actors.hero.talent.body_slam.title=κοπάνημα σώματος
actors.hero.talent.body_slam.desc=_+1:_ Όταν ο Πολεμιστής προσγειώνεται μετά το άλμα, όλοι οι διπλανοί εχθροί παίρνουν ζημιά ίση με _1-4 συν το 25%_ της αμυντικής ισχύος του.\n\n_+2:_ Όταν ο Πολεμιστής προσγειώνεται μετά το άλμα, όλοι οι διπλανοί εχθροί παίρνουν ζημιά ίση με _2-8 συν το 50%_ της αμυντικής ισχύος του.\n\n_+3:_ Όταν ο Πολεμιστής προσγειώνεται μετά το άλμα, όλοι οι διπλανοί εχθροί παίρνουν ζημιά ίση με _3-12 συν το 75%_ της αμυντικής ισχύος του.\n\n_+4:_ Όταν ο Πολεμιστής προσγειώνεται μετά το άλμα, όλοι οι διπλανοί εχθροί παίρνουν ζημιά ίση με _4-16 συν το 100%_ της αμυντικής ισχύος του.
actors.hero.talent.impact_wave.title=κύμα πρόσκρουσης
actors.hero.talent.impact_wave.desc=_+1:_ Με την προσγείωση μετά το άλμα, όλοι οι διπλανοί εχθροί πετώνται _2 τετράγωνα_ μακριά κι έχουν _25%_ πιθανότητα να γίνουν ευάλωτοι για 5 γύρους.\n\n_+2:_ Με την προσγείωση μετά το άλμα, όλοι οι διπλανοί εχθροί πετώνται _3 τετράγωνα_ μακριά κι έχουν _50%_ πιθανότητα να γίνουν ευάλωτοι για 5 γύρους.\n\n_+3:_ Με την προσγείωση μετά το άλμα, όλοι οι διπλανοί εχθροί πετώνται _4 τετράγωνα_ μακριά κι έχουν _75%_ πιθανότητα να γίνουν ευάλωτοι για 5 γύρους.\n\n_+4:_ Με την προσγείωση μετά το άλμα, όλοι οι διπλανοί εχθροί πετώνται _5 τετράγωνα_ μακριά κι έχουν _100%_ πιθανότητα να γίνουν ευάλωτοι για 5 γύρους.
actors.hero.talent.double_jump.title=διπλό άλμα
actors.hero.talent.double_jump.desc=_+1:_ Αν ο Πολεμιστής εκτελέσει δεύτερο άλμα εντός 3 γύρων, το άλμα αυτό θα έχει _16% μειωμένο_ κόστος φορτίου.\n\n_+2:_ Αν ο Πολεμιστής εκτελέσει δεύτερο άλμα εντός 3 γύρων, το άλμα αυτό θα έχει _30% μειωμένο_ κόστος φορτίου.\n\n_+3:_ Αν ο Πολεμιστής εκτελέσει δεύτερο άλμα εντός 3 γύρων, το άλμα αυτό θα έχει _40% μειωμένο_ κόστος φορτίου.\n\n_+4:_ Αν ο Πολεμιστής εκτελέσει δεύτερο άλμα εντός 3 γύρων, το άλμα αυτό θα έχει _50% μειωμένο_ κόστος φορτίου.

actors.hero.talent.expanding_wave.title=επεκτεινόμενο κύμα
actors.hero.talent.expanding_wave.desc=_+1:_ Το εύρος του ωστικού κύματος αυξάνεται στα _6 τετράγωνα_ από 5, και το πλάτος του στις _75 μοίρες_ από 60.\n\n_+2:_ Το εύρος του ωστικού κύματος αυξάνεται στα _7 τετράγωνα_ από 5, και το πλάτος του στις _90 μοίρες_ από 60.\n\n_+3:_ Το εύρος του ωστικού κύματος αυξάνεται στα _8 τετράγωνα_ από 5, και το πλάτος του στις _105 μοίρες_ από 60.\n\n_+4:_ Το εύρος του ωστικού κύματος αυξάνεται στα _9 τετράγωνα_ από 5, και το πλάτος του στις _120 μοίρες_ από 60.
actors.hero.talent.striking_wave.title=κρουστικό κύμα
actors.hero.talent.striking_wave.desc=_+1:_ Το ωστικό κύμα έχει _30% πιθανότητα_ να κάνει χρήση επιδράσεων χτυπήματος, όπως μαγικές ενισχύσεις και διαδοχή χτυπημάτων.\n\n_+2:_ Το ωστικό κύμα έχει _60% πιθανότητα_ να κάνει χρήση επιδράσεων χτυπήματος, όπως μαγικές ενισχύσεις και διαδοχή χτυπημάτων.\n\n_+3:_ Το ωστικό κύμα έχει _90% πιθανότητα_ να κάνει χρήση επιδράσεων χτυπήματος, όπως μαγικές ενισχύσεις και διαδοχή χτυπημάτων.\n\n_+4:_ Το ωστικό κύμα έχει _100% πιθανότητα_ να κάνει χρήση επιδράσεων χτυπήματος, όπως μαγικές ενισχύσεις και διαδοχή χτυπημάτων. Δίνει στις μαγικές ενισχύσεις _+20% ισχύ._
actors.hero.talent.shock_force.title=ωστική ισχύς
actors.hero.talent.shock_force.desc=_+1:_ Το ωστικό κύμα προκαλεί _20% περισσότερη ζημιά_, κι έχει _25% πιθανότητα_ να ακινητοποιήσει αντί να σακατέψει.\n\n_+2:_ Το ωστικό κύμα προκαλεί _40% περισσότερη ζημιά_, κι έχει _50% πιθανότητα_ να ακινητοποιήσει αντί να σακατέψει.\n\n_+3:_ Το ωστικό κύμα προκαλεί _60% περισσότερη ζημιά_, κι έχει _75% πιθανότητα_ να ακινητοποιήσει αντί να σακατέψει.\n\n_+4:_ Το ωστικό κύμα προκαλεί _80% περισσότερη ζημιά_, κι έχει _100% πιθανότητα_ να ακινητοποιήσει αντί να σακατέψει.

actors.hero.talent.sustained_retribution.title=διατηρημένη εκδίκηση
actors.hero.talent.sustained_retribution.desc=_+1:_ Ο Πολεμιστής προκαλεί _115% επιπλέον ζημιά_ διαμοιρασμένη σε _2 χτυπήματα,_ αντί για το 100% σε 1 χτύπημα.\n\n_+2:_ Ο Πολεμιστής προκαλεί _130% επιπλέον ζημιά_ διαμοιρασμένη σε _3 χτυπήματα,_ αντί για το 100% σε 1 χτύπημα.\n\n_+3:_ Ο Πολεμιστής προκαλεί _145% επιπλέον ζημιά_ διαμοιρασμένη σε _4 χτυπήματα,_ αντί για το 100% σε 1 χτύπημα.\n\n_+4:_ Ο Πολεμιστής προκαλεί _160% επιπλέον ζημιά_ διαμοιρασμένη σε _5 χτυπήματα,_ αντί για το 100% σε 1 χτύπημα.
actors.hero.talent.shrug_it_off.title=αγνόησέ το
actors.hero.talent.shrug_it_off.desc=_+1:_ Το ποσοστό μείωσης της προκληθείσας ζημιάς στον Πολεμιστή ενώ υπομένει _αυξάνεται στο 60%_ από 50%.\n\n_+2:_ Το ποσοστό μείωσης της προκληθείσας ζημιάς στον Πολεμιστή ενώ υπομένει _αυξάνεται στο 68%_ από 50%.\n\n_+3:_ Το ποσοστό μείωσης της προκληθείσας ζημιάς στον Πολεμιστή ενώ υπομένει _αυξάνεται στο 74%_ από 50%.\n\n_+4:_ Το ποσοστό μείωσης της προκληθείσας ζημιάς στον Πολεμιστή ενώ υπομένει _αυξάνεται στο 80%_ από 50%.
actors.hero.talent.even_the_odds.title=εξομάλυνση των δεινών
actors.hero.talent.even_the_odds.desc=_+1:_ Ο Πολεμιστής προκαλεί _+5% ζημιά_ για κάθε εχθρό εντός 2 τετραγώνων όταν ολοκληρώνεται η υπομονή.\n\n_+2:_ Ο Πολεμιστής προκαλεί _+10% ζημιά_ για κάθε εχθρό εντός 2 τετραγώνων όταν ολοκληρώνεται η υπομονή.\n\n_+3:_ Ο Πολεμιστής προκαλεί _+15% ζημιά_ για κάθε εχθρό εντός 2 τετραγώνων όταν ολοκληρώνεται η υπομονή.\n\n_+4:_ Ο Πολεμιστής προκαλεί _+20% ζημιά_ για κάθε εχθρό εντός 2 τετραγώνων όταν ολοκληρώνεται η υπομονή.

#mage
actors.hero.talent.empowering_meal.title=ενισχυτικό γεύμα
actors.hero.talent.empowering_meal.desc=_+1:_ Όταν ο Μάγος καταναλώνει φαγητό, θα προκαλέσει _2 επιπλέον ζημιά_ στις επόμενες 3 ρίψεις με ραβδί.\n\n_+2:_ Όταν ο Μάγος καταναλώνει φαγητό, θα προκαλέσει _3 επιπλέον ζημιά_ στις επόμενες 3 ρίψεις με ραβδί.
actors.hero.talent.scholars_intuition.title=διαίσθηση του λόγιου
actors.hero.talent.scholars_intuition.desc=_+1:_ Ο Μάγος αναγνωρίζει τα ραβδιά _3 φορές γρηγορότερα_.\n\n_+2:_ Ο Μάγος αναγνωρίζει τα ραβδιά _μόλις τα χρησιμοποιήσει_.
actors.hero.talent.lingering_magic.title=εναπομείνουσα μαγεία
actors.hero.talent.lingering_magic.desc=_+1:_ Όταν ο Μάγος εξαπολύει με ραβδί ή τη ράβδο του, η επόμενη φυσιολογική του επίθεση προκαλεί _1-2 επιπλέον ζημιά._\n\n_+2:_  Όταν ο Μάγος εξαπολύει με ραβδί ή τη ράβδο του, η επόμενη φυσιολογική του επίθεση προκαλεί _2 επιπλέον ζημιά._
actors.hero.talent.backup_barrier.title=εφεδρικό πεδίο
actors.hero.talent.backup_barrier.desc=_+1:_ Ο Μάγος λαμβάνει _3 προστασία_ όταν χρησιμοποιεί το τελευταίο φορτίο της ράβδου του.\n\n_+2:_ Ο Μάγος λαμβάνει _5 προστασία_ όταν χρησιμοποιεί το τελευταίο φορτίο της ράβδου του.
actors.hero.talent.backup_barrier.meta_desc=_Αν το ταλέντο παρθεί από διαφορετικό ήρωα,_ θα ενεργοποιείται από το ραβδί με το μεγαλύτερο επίπεδο.

actors.hero.talent.energizing_meal.title=ενεργητικό γεύμα
actors.hero.talent.energizing_meal.desc=_+1:_ Ο Μάγος χρειάζεται 1 γύρο για να φάει και λαμβάνει _5 γύρους επαναφόρτισης ραβδιών._\n\n_+2:_ Ο Μάγος χρειάζεται 1 γύρο για να φάει και λαμβάνει _8 γύρους επαναφόρτισης ραβδιών._
actors.hero.talent.inscribed_power.title=χαραγμένη ισχύς
actors.hero.talent.inscribed_power.desc=_+1:_ Όταν ο Μάγος διαβάζει έναν πάπυρο ή χρησιμοποιεί κρύσταλλο ξορκιού, οι _2 επόμενες ρίψεις του με ραβδί_ λαμβάνουν +2 επίπεδα.\n\n_+2:_ Όταν ο Μάγος διαβάζει έναν πάπυρο ή χρησιμοποιεί κρύσταλλο ξορκιού, οι _3 επόμενες ρίψεις του με ραβδί_ λαμβάνουν +2 επίπεδα.\n\nΟ αριθμός των βελτιωμένων ρίψεων διπλασιάζεται με τη χρήση παπύρου αναβάθμισης, μεταστοιχείωσης, ή αντικειμένων που παράγονται αλχημικά από αυτούς τους παπύρους.\n\nΓια αλχημικά αντικείμενα με μεγαλύτερη ποσότητα παραγωγής (π.χ. τα περισσότερα ξόρκια), το ταλέντο έχει πιθανότητα να ενεργοποιηθεί βάσει της ποσότητας του αντικειμένου που παράγεται.
actors.hero.talent.wand_preservation.title=διατήρηση ραβδιών
actors.hero.talent.wand_preservation.desc=_+1:_ Όταν ο Μάγος εμποτίζει ένα νέο ραβδί στη ράβδο του, το παλιό ραβδί επιστρέφει στο +0. _Αυτό μπορεί να γίνει μόνο μία φορά._\n\n_+2:_ Όταν ο Μάγος εμποτίζει ένα νέο ραβδί στη ράβδο του, το παλιό ραβδί επιστρέφει στο +0. _Αυτό μπορεί να γίνει μία φορά ανά επίπεδο του ήρωα._
actors.hero.talent.wand_preservation.meta_desc=_Αν το ταλέντο παρθεί από διαφορετικό ήρωα,_ θα αυξηθεί η ποσότητα απόκρυφης ρητίνης που αποκτάται από ραβδί στο αλχημικό τσουκάλι κατά 1 στο +1 και κατά 2 στο +2.
actors.hero.talent.arcane_vision.title=απόκρυφη όραση
actors.hero.talent.arcane_vision.desc=_+1:_ Όταν ο Μάγος εξαπολύει σε έναν εχθρό, λαμβάνει ενόραση πάνω του για _10 γύρους_.\n\n_+2:_ Όταν ο Μάγος εξαπολύει σε έναν εχθρό, λαμβάνει ενόραση πάνω του για _15 γύρους_.
actors.hero.talent.shield_battery.title=μπαταρία ασπίδας
actors.hero.talent.shield_battery.desc=_+1:_ Ο Μάγος μπορεί να αυτο-στοχευθεί με ραβδί για να μετατρέψει όλο του το φορτίο σε προστασία, με ρυθμό _4% της μέγιστης ζωής ανά μονάδα φορτίου._\n\n_+2:_ Ο Μάγος μπορεί να αυτο-στοχευθεί με ραβδί για να μετατρέψει όλο του το φορτίο σε προστασία, με ρυθμό _6% της μέγιστης ζωής ανά μονάδα φορτίου._

actors.hero.talent.desperate_power.title=απεγνωσμένη ισχύς
actors.hero.talent.desperate_power.desc=_+1:_ Τα ραβδιά και η ράβδος του Μάγου αποκτούν _+1 επίπεδο_ στην τελευταία εξαπόλυση, ενώ βρίσκονται στο τελευταίο φορτίο.\n\n_+2:_ Τα ραβδιά και η ράβδος του Μάγου αποκτούν _+2 επίπεδα_ στην τελευταία εξαπόλυση, ενώ βρίσκονται στο τελευταίο φορτίο.\n\n_+3:_ Τα ραβδιά και η ράβδος του Μάγου αποκτούν _+3 επίπεδα_ στην τελευταία εξαπόλυση, ενώ βρίσκονται στο τελευταίο φορτίο.
actors.hero.talent.ally_warp.title=συμμαχικός διακτινισμός
actors.hero.talent.ally_warp.desc=_+1:_ Ο Μάγος μπορεί να ανταλλάξει άμεσα τη θέση του με έναν σύμμαχο σε _εύρος 2 τετραγώνων._\n\n_+2:_ Ο Μάγος μπορεί να ανταλλάξει άμεσα τη θέση του με έναν σύμμαχο σε _εύρος 4 τετραγώνων._\n\n_+3:_ Ο Μάγος μπορεί να ανταλλάξει άμεσα τη θέση του με έναν σύμμαχο σε _εύρος 6 τετραγώνων._\n\nΟ Μάγος δεν μπορεί να ανταλλάξει θέσεις με στάσιμους συμμάχους.

actors.hero.talent.empowered_strike.title=ενδυναμωμένο χτύπημα
actors.hero.talent.empowered_strike.desc=_+1:_ Αφού εξαπολύσει ξόρκι από τη ράβδο του, ο Μαγομαχητής προκαλεί _+16% ζημιά_ στο επόμενο φυσιολογικό χτύπημα με αυτή και η μπόνους επίδραση της ράβδου λαμβάνει _+50% ισχύ._\n\n_+2:_ Αφού εξαπολύσει ξόρκι από τη ράβδο του, ο Μαγομαχητής προκαλεί _+33% ζημιά_ στο επόμενο φυσιολογικό χτύπημα με αυτή και η μπόνους επίδραση της ράβδου λαμβάνει _+100% ισχύ._\n\n_+3:_ Αφού εξαπολύσει ξόρκι από τη ράβδο του, ο Μαγομαχητής προκαλεί _+50% ζημιά_ στο επόμενο φυσιολογικό χτύπημα με αυτή και η μπόνους επίδραση της ράβδου λαμβάνει _+150% ισχύ._
actors.hero.talent.mystical_charge.title=απόκρυφο φορτίο
actors.hero.talent.mystical_charge.desc=_+1:_ Όταν ο Μαγομαχητής κοπανά με τη ράβδο του, λαμβάνει _0,5 γύρους_ επαναφόρτισης τεχνουργημάτων.\n\n_+2:_ Όταν ο Μαγομαχητής κοπανά με τη ράβδο του, λαμβάνει _1 γύρο_ επαναφόρτισης τεχνουργημάτων.\n\n_+3:_ Όταν ο Μαγομαχητής κοπανά με τη ράβδο του, λαμβάνει _1,5 γύρους_ επαναφόρτισης τεχνουργημάτων.
actors.hero.talent.excess_charge.title=περίσσιο φορτίο
actors.hero.talent.excess_charge.desc=_+1:_ Όταν η ράβδος του Μαγομαχητή είναι πλήρως φορτισμένη, η επόμενη εξαπόλυση με αυτή θα του προσδώσει _0.67 πόντους προστασίας_ ανά επίπεδο της ράβδου.\n\n_+2:_ Όταν η ράβδος του Μαγομαχητή είναι πλήρως φορτισμένη, η επόμενη εξαπόλυση με αυτή θα του προσδώσει _1.33 πόντους προστασίας_ ανά επίπεδο της ράβδου.\n\n_+3:_  Όταν η ράβδος του Μαγομαχητή είναι πλήρως φορτισμένη, η επόμενη εξαπόλυση με αυτή θα του προσδώσει _2 πόντους προστασίας_ ανά επίπεδο της ράβδου.

actors.hero.talent.soul_siphon.title=σίφωνας ψυχών
actors.hero.talent.soul_siphon.desc=_+1:_ Η φυσιολογική ζημιά που προκαλείται από άλλους χαρακτήρες ενεργοποιεί το σημάδι ψυχής του Αρχιμάγου με _13% αποτελεσματικότητα._\n\n_+2:_ Η φυσιολογική ζημιά που προκαλείται από άλλους χαρακτήρες ενεργοποιεί το σημάδι ψυχής του Αρχιμάγου με _27% αποτελεσματικότητα._\n\n_+3:_ Η φυσιολογική ζημιά που προκαλείται από άλλους χαρακτήρες ενεργοποιεί το σημάδι ψυχής του Αρχιμάγου με _40% αποτελεσματικότητα._
actors.hero.talent.soul_eater.title=καταναλωτής ψυχών
actors.hero.talent.soul_eater.desc=_+1:_ Το σημάδι ψυχής παρέχει _0,33 γύρους_ κορεσμού για κάθε σωματική ζημιά που προκαλείται. Οι εχθροί με σημαδεμένη ψυχή έχουν _10% πιθανότητα_ να ενεργοποιήσουν επιδράσεις κατάποσης φαγητού όταν πεθάνουν.\n\n_+2:_ Το σημάδι ψυχής παρέχει _0,67 γύρους_ κορεσμού για κάθε σωματική ζημιά που προκαλείται. Οι εχθροί με σημαδεμένη ψυχή έχουν _20% πιθανότητα_ να ενεργοποιήσουν επιδράσεις κατάποσης φαγητού όταν πεθάνουν.\n\n_+3:_ Το σημάδι ψυχής παρέχει _1 γύρο_ κορεσμού για κάθε σωματική ζημιά που προκαλείται. Οι εχθροί με σημαδεμένη ψυχή έχουν _30% πιθανότητα_ να ενεργοποιήσουν επιδράσεις κατάποσης φαγητού όταν πεθάνουν.
actors.hero.talent.necromancers_minions.title=ακόλουθοι νεκρομάντη
actors.hero.talent.necromancers_minions.desc=_+1:_ Όταν πεθαίνει ένας εχθρός με σημαδεμένη ψυχή, ο Αρχιμάγος έχει _13% πιθανότητα_ να τον αναστήσει ως διεφθαρμένο στοιχειό.\n\n_+2:_ Όταν πεθαίνει ένας εχθρός με σημαδεμένη ψυχή, ο Αρχιμάγος έχει _27% πιθανότητα_ να τον αναστήσει ως διεφθαρμένο στοιχειό.\n\n_+3:_ Όταν πεθαίνει ένας εχθρός με σημαδεμένη ψυχή, ο Αρχιμάγος έχει _40% πιθανότητα_ να τον αναστήσει ως διεφθαρμένο στοιχειό.

actors.hero.talent.blast_radius.title=ακτίνα έκρηξης
actors.hero.talent.blast_radius.desc=_+1:_ Η ακτίνα της στοιχειακής έκρηξης αυξάνεται στα _5 τετράγωνα_ από 4.\n\n_+2:_ Η ακτίνα της στοιχειακής έκρηξης αυξάνεται στα _6 τετράγωνα_ από 4.\n\n_+3:_ Η ακτίνα της στοιχειακής έκρηξης αυξάνεται στα _7 τετράγωνα_ από 4.\n\n_+4:_ Η ακτίνα της στοιχειακής έκρηξης αυξάνεται στα _8 τετράγωνα_ από 4.
actors.hero.talent.elemental_power.title=στοιχειακή ισχύς
actors.hero.talent.elemental_power.desc=_+1:_ Η ισχύς της στοιχειακής έκρηξης αυξάνεται κατά _25%._\n\n_+2:_ Η ισχύς της στοιχειακής έκρηξης αυξάνεται κατά _50%._\n\n_+3:_ Η ισχύς της στοιχειακής έκρηξης αυξάνεται κατά _75%._\n\n_+4:_ Η ισχύς της στοιχειακής έκρηξης αυξάνεται κατά _100%._
actors.hero.talent.reactive_barrier.title=αναδραστικό πεδίο
actors.hero.talent.reactive_barrier.desc=_+1:_ Ο Μάγος λαμβάνει _2.5 πόντους προστασίας_ για κάθε χαρακτήρα που επηρεάστηκε από τη στοιχειακή έκρηξη, με μέγιστους τους 5 χαρακτήρες.\n\n_+2:_ Ο Μάγος λαμβάνει _5 πόντους προστασίας_ για κάθε χαρακτήρα που επηρεάστηκε από τη στοιχειακή έκρηξη, με μέγιστους τους 6 χαρακτήρες.\n\n_+3:_ Ο Μάγος λαμβάνει _7.5 πόντους προστασίας_ για κάθε χαρακτήρα που επηρεάστηκε από τη στοιχειακή έκρηξη, με μέγιστους τους 7 χαρακτήρες.\n\n_+4:_ Ο Μάγος λαμβάνει _10 πόντους προστασίας_ για κάθε χαρακτήρα που επηρεάστηκε από τη στοιχειακή έκρηξη, με μέγιστους τους 8 χαρακτήρες.

actors.hero.talent.wild_power.title=ξέφρενη ισχύς
actors.hero.talent.wild_power.desc=_+1:_ Κατά τη χρήση ξέφρενης μαγείας, τα ραβδιά ενισχύονται κατά _είτε 2 είτε 3, μέχρι το +4._\n\n_+2:_ Κατά τη χρήση ξέφρενης μαγείας, τα ραβδιά ενισχύονται κατά _3, μέχρι το +5._\n\n_+3:_ Κατά τη χρήση ξέφρενης μαγείας, τα ραβδιά ενισχύονται κατά _είτε 3 είτε 4, μέχρι το +6._\n\n_+4:_ Κατά τη χρήση ξέφρενης μαγείας, τα ραβδιά ενισχύονται κατά _4, μέχρι το +7._
actors.hero.talent.fire_everything.title=πυρ κατά βούληση
actors.hero.talent.fire_everything.desc=_+1:_ Η ξέφρενη μαγεία πυροδοτείται _5 φορές_ αντί για 4. Κάθε ραβδί έχει _25% πιθανότητα_ να χρησιμοποιηθεί 3 φορές.\n\n_+2:_ Η ξέφρενη μαγεία πυροδοτείται _6 φορές_ αντί για 4. Κάθε ραβδί έχει _50% πιθανότητα_ να χρησιμοποιηθεί 3 φορές.\n\n_+3:_ Η ξέφρενη μαγεία πυροδοτείται _7 φορές_ αντί για 4. Κάθε ραβδί έχει _75% πιθανότητα_ να χρησιμοποιηθεί 3 φορές.\n\n_+4:_ Η ξέφρενη μαγεία πυροδοτείται _8 φορές_ αντί για 4. Κάθε ραβδί έχει _100% πιθανότητα_ να χρησιμοποιηθεί 3 φορές.
actors.hero.talent.conserved_magic.title=διατηρημένη μαγεία
actors.hero.talent.conserved_magic.desc=_+1:_ Κάθε ριπή ξέφρενης μαγείας χρησιμοποιεί _0.33 φορτίο_ αντί για 0.5. Υπάρχει _25% πιθανότητα_ να μην δαπανηθεί ένας γύρος.\n\n_+2:_ Κάθε ριπή ξέφρενης μαγείας χρησιμοποιεί _0.225 φορτίο_ αντί για 0.5. Υπάρχει _50% πιθανότητα_ να μην δαπανηθεί ένας γύρος.\n\n_+3:_ Κάθε ριπή ξέφρενης μαγείας χρησιμοποιεί _0.15 φορτίο_ αντί για 0.5. Υπάρχει _75% πιθανότητα_ να μην δαπανηθεί ένας γύρος.\n\n_+4:_ Κάθε ριπή ξέφρενης μαγείας χρησιμοποιεί _0.1 φορτίο_ αντί για 0.5. Υπάρχει _100% πιθανότητα_ να μην δαπανηθεί ένας γύρος.

actors.hero.talent.telefrag.title=Τηλε-φόνος
actors.hero.talent.telefrag.desc=_+1:_ Αν ο Μάγος τηλεμεταφερθεί πάνω σε άλλον χαρακτήρα, του προκαλεί _10-15 ζημιά_ – αλλά τρώει _5 ζημιά._\n\n_+2:_ Αν ο Μάγος τηλεμεταφερθεί πάνω σε άλλον χαρακτήρα, του προκαλεί _20-30 ζημιά_ – αλλά τρώει _10 ζημιά._\n\n_+3:_ Αν ο Μάγος τηλεμεταφερθεί πάνω σε άλλον χαρακτήρα, του προκαλεί _30-45 ζημιά_ – αλλά τρώει _15 ζημιά._\n\n_+4:_ Αν ο Μάγος τηλεμεταφερθεί πάνω σε άλλον χαρακτήρα, του προκαλεί _40-60 ζημιά_ – αλλά τρώει _20 ζημιά._\n\nΟ ήρωας δεν μπορεί να σκοτωθεί από αυτό το ταλέντο· η ζημιά στον εαυτό μειώνεται με επιδράσεις αντοχής στη μαγεία.
actors.hero.talent.remote_beacon.title=Μακρινός πομπός
actors.hero.talent.remote_beacon.desc=_+1:_ Ο Μάγος μπορεί να τοποθετήσει πομπό οπουδήποτε εντός _4 τετραγώνων._\n\n_+2:_ Ο Μάγος μπορεί να τοποθετήσει πομπό οπουδήποτε εντός _8 τετραγώνων._\n\n_+3:_ Ο Μάγος μπορεί να τοποθετήσει πομπό οπουδήποτε εντός _12 τετραγώνων._\n\n_+4:_ Ο Μάγος μπορεί να τοποθετήσει πομπό οπουδήποτε εντός _16 τετραγώνων._\n\nΟ Μάγος δεν μπορεί να τοποθετήσει πομπούς σε απρόσιτες περιοχές.
actors.hero.talent.longrange_warp.title=Τηλεμεταφορά μακράς εμβέλειας
actors.hero.talent.longrange_warp.desc=_+1:_ Ο Μάγος μπορεί πλέον να τηλεμεταφέρεται μεταξύ επιπέδων, με _150% κόστος φορτίου._\n\n_+2:_ Ο Μάγος μπορεί πλέον να τηλεμεταφέρεται μεταξύ επιπέδων, με _117% κόστος φορτίου._\n\n_+3:_ Ο Μάγος μπορεί πλέον να τηλεμεταφέρεται μεταξύ επιπέδων, με _83% κόστος φορτίου._\n\n_+4:_ Ο Μάγος μπορεί πλέον να τηλεμεταφέρεται μεταξύ επιπέδων, με _50% κόστος φορτίου._\n\nΟ Μάγος δεν μπορεί να διαφύγει από κλειδωμένο δωμάτιο με την τηλεμεταφορά μακράς εμβέλειας.

#rogue
actors.hero.talent.cached_rations.title=κρυφές μερίδες
actors.hero.talent.cached_rations.desc=_+1:_ Ο Κλέφτης μπορεί να βρει _2 μερίδες προμηθειών_ τοποθετημένες σε σεντούκια ενώ εξερευνεί κάποια επόμενα επίπεδα της κατακόμβης.\n\n_+2:_ Ο Κλέφτης μπορεί να βρει _3 μερίδες προμηθειών_ τοποθετημένες σε σεντούκια ενώ εξερευνεί κάποια επόμενα επίπεδα της κατακόμβης.\n\nΟι μερίδες προμηθειών τρώγονται ακαριαία και αναπληρώνουν μια μικρή ποσότητα κορεσμού, 5 ζωή και 1 φορτίο στον μανδύα των σκιών.
actors.hero.talent.thiefs_intuition.title=διαίσθηση του κλέφτη
actors.hero.talent.thiefs_intuition.desc=_+1:_ Ο Κλέφτης αναγνωρίζει τα δαχτυλίδια _2 φορές πιο γρήγορα,_ και αναγνωρίζει το είδος ενός δαχτυλιδιού _μόλις το φορέσει._\n\n_+2:_ Ο Κλέφτης αναγνωρίζει τα δαχτυλίδια _μόλις τα φορέσει,_ και αναγνωρίζει το είδος ενός δαχτυλιδιού _μόλις το μαζέψει._
actors.hero.talent.sucker_punch.title=ύπουλη γροθιά
actors.hero.talent.sucker_punch.desc=_+1:_ Ο Κλέφτης προκαλεί _1-2 επιπλέον ζημιά_ την πρώτη φορά που κάνει αιφνίδια επίθεση σε εχθρό.\n\n_+2:_ Ο Κλέφτης προκαλεί _2 επιπλέον ζημιά_ την πρώτη φορά που κάνει αιφνίδια επίθεση σε εχθρό.
actors.hero.talent.protective_shadows.title=προστατευτικές σκιές
actors.hero.talent.protective_shadows.desc=_+1:_ Ο Κλέφτης λαμβάνει έναν πόντο προστασίας _κάθε δεύτερο γύρο_ που είναι αόρατος, _με μέγιστους τους 3 πόντους._\n\n_+2:_ Ο Κλέφτης λαμβάνει έναν πόντο προστασίας _κάθε γύρο_ που είναι αόρατος, _με μέγιστους τους 5 πόντους._

actors.hero.talent.mystical_meal.title=μυστικιστικό γεύμα
actors.hero.talent.mystical_meal.desc=_+1:_ Ο Κλέφτης καταναλώνει 1 γύρο για να φάει (οι μερίδες προμηθειών τρώγονται ακαριαία) και λαμβάνει _3 γύρους επαναφόρτισης τεχνουργημάτων._\n\n_+2:_ Ο Κλέφτης καταναλώνει 1 γύρο για να φάει (οι μερίδες προμηθειών τρώγονται ακαριαία) και λαμβάνει _5 γύρους επαναφόρτισης τεχνουργημάτων._\n\nΤο κέρας της αφθονίας δεν επαναφορτίζει τον εαυτό του με αυτό το ταλέντο.
actors.hero.talent.inscribed_stealth.title=χαραγμένη κάλυψη
actors.hero.talent.inscribed_stealth.desc=_+1:_ Ο Κλέφτης λαμβάνει _3 γύρους_ αορατότητας όταν διαβάζει πάπυρο ή χρησιμοποιεί κρύσταλλο ξορκιού.\n\n_+2:_ Ο Κλέφτης λαμβάνει _5 γύρους_ αορατότητας όταν διαβάζει πάπυρο ή χρησιμοποιεί κρύσταλλο ξορκιού.\n\nΗ διάρκεια της αορατότητας διπλασιάζεται με τη χρήση παπύρου αναβάθμισης, μεταστοιχείωσης, καθώς και αντικείμενα που απαιτούν αυτούς τους παπύρους για να παρασκευαστούν αλχημικά.\n\nΓια αλχημικά αντικείμενα με μεγαλύτερη ποσότητα παραγωγής (π.χ. τα περισσότερα ξόρκια), το ταλέντο έχει πιθανότητα να ενεργοποιηθεί βάσει της ποσότητας του αντικειμένου που παράγεται.
actors.hero.talent.wide_search.title=ευρεία αναζήτηση
actors.hero.talent.wide_search.desc=_+1:_ Η ακτίνα αναζήτησης του Κλέφτη αυξάνεται από ένα τετράγωνο 5x5 σε έναν _κύκλο 7x7_.\n\n_+2:_ Η ακτίνα αναζήτησης του Κλέφτη αυξάνεται από ένα τετράγωνο 5x5 σε ένα _τετράγωνο 7x7_.
actors.hero.talent.wide_search.meta_desc=_Αν το ταλέντο παρθεί από διαφορετικό ήρωα,_ θα αυξήσει το εύρος αναζήτησης σε κύκλο 5x5 στο +1 και σε τετράγωνο 5x5 στο +2.
actors.hero.talent.silent_steps.title=σιγανά βήματα
actors.hero.talent.silent_steps.desc=_+1:_ Ο Κλέφτης δεν θα ξυπνήσει κοιμισμένους εχθρούς όταν είναι _3 ή περισσότερα τετράγωνα μακριά τους_.\n\n_+2:_ Ο Κλέφτης δεν θα ξυπνήσει κοιμισμένους εχθρούς όταν _δεν είναι δίπλα τους_.
actors.hero.talent.rogues_foresight.title=πρόβλεψη του Κλέφτη
actors.hero.talent.rogues_foresight.desc=_+1:_ Όταν ο Κλέφτης βρίσκεται σε επίπεδο με μυστικό δωμάτιο, έχει _75% πιθανότητα να παρατηρήσει_ ότι το επίπεδο κρύβει μυστικό.\n\n_+2:_ Όταν ο Κλέφτης βρίσκεται σε επίπεδο με μυστικό δωμάτιο, έχει _100% πιθανότητα να παρατηρήσει_ ότι το επίπεδο κρύβει μυστικό.

actors.hero.talent.light_cloak.title=ελαφρύς μανδύας
actors.hero.talent.light_cloak.desc=_+1:_ Ο Κλέφτης μπορεί να χρησιμοποιεί τον μανδύα των σκιών όταν δεν τον φοράει, αλλά τότε επαναφορτίζεται με _25% ταχύτητα._\n\n_+2:_ Ο Κλέφτης μπορεί να χρησιμοποιεί τον μανδύα των σκιών όταν δεν τον φοράει, αλλά τότε επαναφορτίζεται με _50% ταχύτητα._\n\n_+3:_ Ο Κλέφτης μπορεί να χρησιμοποιεί τον μανδύα των σκιών όταν δεν τον φοράει, αλλά τότε επαναφορτίζεται με _75% ταχύτητα._
actors.hero.talent.light_cloak.meta_desc=_Αν το ταλέντο παρθεί από διαφορετικό ήρωα,_ θα αυξήσει την ταχύτητα επαναφόρτισης όλων των τεχνουργημάτων κατά 7/13/20% στο +1/+2/+3.
actors.hero.talent.enhanced_rings.title=βελτιωμένα δαχτυλίδια
actors.hero.talent.enhanced_rings.desc=_+1:_ Όταν ο Κλέφτης χρησιμοποιεί ένα τεχνούργημα, τα δαχτυλίδια του λαμβάνουν +1 αναβάθμιση για _3 γύρους_.\n\n_+2:_ Όταν ο Κλέφτης χρησιμοποιεί ένα τεχνούργημα, τα δαχτυλίδια του λαμβάνουν +1 αναβάθμιση για _6 γύρους_.\n\n_+3:_ Όταν ο Κλέφτης χρησιμοποιεί ένα τεχνούργημα, τα δαχτυλίδια του λαμβάνουν +1 αναβάθμιση για _9 γύρους_.

actors.hero.talent.enhanced_lethality.title=αυξημένη φονικότητα
actors.hero.talent.enhanced_lethality.desc=_+1:_ Ο Δολοφόνος μπορεί να εκτελέσει εχθρούς που τους απομένει _4/13/27/67% ζωή_ ανά επίπεδο προετοιμασίας, αντί για 3/10/20/50%.\n\n_+2:_ Ο Δολοφόνος μπορεί να εκτελέσει εχθρούς που τους απομένει _5/17/33/83% ζωή_ ανά επίπεδο προετοιμασίας, αντί για 3/10/20/50%.\n\n_+3:_ Ο Δολοφόνος μπορεί να εκτελέσει εχθρούς που τους απομένει _6/20/40/100% ζωή_ ανά επίπεδο προετοιμασίας, αντί για 3/10/20/50%.
actors.hero.talent.assassins_reach.title=δολοφονικό πεδίο
actors.hero.talent.assassins_reach.desc=_+1:_ Το εύρος αναπήδησης του Δολοφόνου ανά επίπεδο προετοιμασίας αυξάνεται σε _1/3/4/6 τετράγωνα_, από 1/2/3/4.\n\n_+2:_ Το εύρος αναπήδησης του Δολοφόνου ανά επίπεδο προετοιμασίας αυξάνεται σε _2/4/6/8 τετράγωνα_, από 1/2/3/4.\n\n_+3:_ Το εύρος αναπήδησης του Δολοφόνου ανά επίπεδο προετοιμασίας αυξάνεται σε _2/5/7/10 τετράγωνα_, από 1/2/3/4.\n\nΜε την αναπήδηση μπορείς να πας πάνω από εχθρούς και κακοτοπιές, αλλά όχι διαμέσω συμπαγών περιοχών όπως είναι οι τοίχοι.
actors.hero.talent.bounty_hunter.title=κυνηγός κεφαλών
actors.hero.talent.bounty_hunter.desc=_+1:_ Όταν ο Δολοφόνος εκτελεί εχθρό με προετοιμασμένο χτύπημα, η πιθανότητα να πετάξει αντικείμενο αυξάνεται κατά _2/4/8/16%_ ανά επίπεδο προετοιμασίας.\n\n_+2:_ Όταν ο Δολοφόνος εκτελεί εχθρό με προετοιμασμένο χτύπημα, η πιθανότητα να πετάξει αντικείμενο αυξάνεται κατά _4/8/16/32%_ ανά επίπεδο προετοιμασίας.\n\n_+3:_ Όταν ο Δολοφόνος εκτελεί εχθρό με προετοιμασμένο χτύπημα, η πιθανότητα να πετάξει αντικείμενο αυξάνεται κατά _6/12/24/48%_ ανά επίπεδο προετοιμασίας.

actors.hero.talent.evasive_armor.title=πανοπλία αποφυγής
actors.hero.talent.evasive_armor.desc=_+1:_ Όταν κάνει ελεύθερο τρέξιμο, ο Δρομέας λαμβάνει _+1 επιπλέον αποφυγή_ για κάθε περίσσιο πόντο δύναμης στην πανοπλία του.\n\n_+2:_ Όταν κάνει ελεύθερο τρέξιμο, ο Δρομέας λαμβάνει _+2 επιπλέον αποφυγή_ για κάθε περίσσιο πόντο δύναμης στην πανοπλία του.\n\n_+3:_ Όταν κάνει ελεύθερο τρέξιμο, ο Δρομέας λαμβάνει _+3 επιπλέον αποφυγή_ για κάθε περίσσιο πόντο δύναμης στην πανοπλία του.
actors.hero.talent.projectile_momentum.title=ορμή βλήματος
actors.hero.talent.projectile_momentum.desc=_+1:_ While freerunning, the Freerunner gains _+50% accuracy and +15% damage_ with thrown weapons.\n\n_+2:_ While freerunning, the Freerunner gains _+100% accuracy and +30% damage_ with thrown weapons.\n\n_+3:_ While freerunning, the Freerunner gains _+150% accuracy and +45% damage_ with thrown weapons.
actors.hero.talent.speedy_stealth.title=ταχεία κάλυψη
actors.hero.talent.speedy_stealth.desc=_+1:_ Ο Δρομέας λαμβάνει 2 στοίβες ορμής ανά γύρο όσο είναι αόρατος.\n\n_+2:_ Μαζί με τα οφέλη του +1, το ελεύθερο τρέξιμο του Δρομέα δεν σταματάει πλέον όσο είναι αόρατος.\n\n_+3:_ Μαζί με τα οφέλη των +1 και +2, ο Δρομέας κινείται με x2 ταχύτητα όσο είναι αόρατος, άσχετα από το αν τρέχει ελεύθερα ή όχι.

actors.hero.talent.hasty_retreat.title=άτακτη υποχώρηση
actors.hero.talent.hasty_retreat.desc=_+1:_ Μόλις αναπηδήσει, ο Κλέφτης λαμβάνει _1 γύρο_ βιασύνης και αορατότητας.\n\n_+2:_ Μόλις αναπηδήσει, ο Κλέφτης λαμβάνει _2 γύρους_ βιασύνης και αορατότητας.\n\n_+3:_ Μόλις αναπηδήσει, ο Κλέφτης λαμβάνει _3 γύρους_ βιασύνης και αορατότητας.\n\n_+4:_ Μόλις αναπηδήσει, ο Κλέφτης λαμβάνει _4 γύρους_ βιασύνης και αορατότητας.
actors.hero.talent.body_replacement.title=Αντικατάσταση σώματος
actors.hero.talent.body_replacement.desc=_+1:_ Μόλις αναπηδήσει, ο Κλέφτης αφήνει πίσω του ένα ξύλινο δόλωμα με _20 ζωή και 1-3 πανοπλία_.\n\n_+2:_ Μόλις αναπηδήσει, ο Κλέφτης αφήνει πίσω του ένα ξύλινο δόλωμα με _40 ζωή και 2-6 πανοπλία_.\n\n_+3:_ Μόλις αναπηδήσει, ο Κλέφτης αφήνει πίσω του ένα ξύλινο δόλωμα με _60 ζωή και 3-9 πανοπλία_.\n\n_+4:_ Μόλις αναπηδήσει, ο Κλέφτης αφήνει πίσω του ένα ξύλινο δόλωμα με _80 ζωή και 4-12 πανοπλία_.\n\nΜόνο ένα δόλωμα μπορεί να είναι ενεργό τη φορά.
actors.hero.talent.shadow_step.title=βήμα-σκιά
actors.hero.talent.shadow_step.desc=_+1:_ Αν ο Κλέφτης ρίξει βόμβα καπνού ενώ είναι αόρατος, το κάνει ακαριαία και με _16% λιγότερο_ φορτίο – αλλά δεν τυφλώνει ούτε ενεργοποιεί άλλα ταλέντα.\n\n_+2:_ Αν ο Κλέφτης ρίξει βόμβα καπνού ενώ είναι αόρατος, το κάνει ακαριαία και με _30% λιγότερο_ φορτίο – αλλά δεν τυφλώνει ούτε ενεργοποιεί άλλα ταλέντα.\n\n_+3:_ Αν ο Κλέφτης ρίξει βόμβα καπνού ενώ είναι αόρατος, το κάνει ακαριαία και με _41% λιγότερο_ φορτίο – αλλά δεν τυφλώνει ούτε ενεργοποιεί άλλα ταλέντα.\n\n_+4:_ Αν ο Κλέφτης ρίξει βόμβα καπνού ενώ είναι αόρατος, το κάνει ακαριαία και με _50% λιγότερο_ φορτίο – αλλά δεν τυφλώνει ούτε ενεργοποιεί άλλα ταλέντα.

actors.hero.talent.fear_the_reaper.title=τρέμε τον Θεριστή
actors.hero.talent.fear_the_reaper.desc=_+1:_ Όταν ένας εχθρός με σημάδι θανάτου φτάσει σε 0 ζωή, _σακατεύεται._\n\n_+2:_ Όταν ένας εχθρός με σημάδι θανάτου φτάσει σε 0 ζωή, _τρομοκρατείται και σακατεύεται._\n\n_+3:_ Όταν ένας εχθρός με σημάδι θανάτου φτάσει σε 0 ζωή, _τρομοκρατείται και σακατεύεται·_ οι εχθροί μέχρι 3 τετράγωνα μακριά _σακατεύονται._\n\n_+4:_ Όταν ένας εχθρός με σημάδι θανάτου φτάσει σε 0 ζωή, _τρομοκρατείται και σακατεύεται·_ οι εχθροί μέχρι 3 τετράγωνα μακριά _τρομοκρατούνται και σακατεύονται._
actors.hero.talent.deathly_durability.title=θανατική αντοχή
actors.hero.talent.deathly_durability.desc=_+1:_ Οι εχθροί που σκοτώνονται από το σημάδι θανάτου προσδίδουν προστασία στον Κλέφτη, ίση με το _13%_ της ζωής που είχαν όταν σημαδεύτηκαν.\n\n_+2:_ Οι εχθροί που σκοτώνονται από το σημάδι θανάτου προσδίδουν προστασία στον Κλέφτη, ίση με το _25%_ της ζωής που είχαν όταν σημαδεύτηκαν.\n\n_+3:_ Οι εχθροί που σκοτώνονται από το σημάδι θανάτου προσδίδουν προστασία στον Κλέφτη, ίση με το _38%_ της ζωής που είχαν όταν σημαδεύτηκαν.\n\n_+4:_ Οι εχθροί που σκοτώνονται από το σημάδι θανάτου προσδίδουν προστασία στον Κλέφτη, ίση με το _50%_ της ζωής που είχαν όταν σημαδεύτηκαν.
actors.hero.talent.double_mark.title=διπλό σημάδι
actors.hero.talent.double_mark.desc=_+1:_ Το σημάδεμα ενός δεύτερου στόχου, αμέσως μετά τον πρώτο, έχει κατά _30% μειωμένο_ κόστος φορτίου.\n\n_+2:_ Το σημάδεμα ενός δεύτερου στόχου, αμέσως μετά τον πρώτο, έχει κατά _50% μειωμένο_ κόστος φορτίου.\n\n_+3:_ Το σημάδεμα ενός δεύτερου στόχου, αμέσως μετά τον πρώτο, έχει κατά _65% μειωμένο_ κόστος φορτίου.\n\n_+4:_ Το σημάδεμα ενός δεύτερου στόχου, αμέσως μετά τον πρώτο, έχει κατά _75% μειωμένο_ κόστος φορτίου.

actors.hero.talent.shadow_blade.title=λεπίδα-σκιά
actors.hero.talent.shadow_blade.desc=_+1:_ Ο κλώνος-σκιά λαμβάνει το _8%_ της ζημιάς-ανά-γύρο του ήρωα, και έχει _25% πιθανότητα_ να χρησιμοποιήσει τη μαγική ενίσχυση του όπλου του ήρωα.\n\n_+2:_ Ο κλώνος-σκιά λαμβάνει το _16%_ της ζημιάς-ανά-γύρο του ήρωα, και έχει _50% πιθανότητα_ να χρησιμοποιήσει τη μαγική ενίσχυση του όπλου του ήρωα.\n\n_+3:_ Ο κλώνος-σκιά λαμβάνει το _24%_ της ζημιάς-ανά-γύρο του ήρωα, και έχει _75% πιθανότητα_ να χρησιμοποιήσει τη μαγική ενίσχυση του όπλου του ήρωα.\n\n_+4:_ Ο κλώνος-σκιά λαμβάνει το _32%_ της ζημιάς-ανά-γύρο του ήρωα, και έχει _100% πιθανότητα_ να χρησιμοποιήσει τη μαγική ενίσχυση του όπλου του ήρωα.
actors.hero.talent.cloned_armor.title=κλωνοποιημένη πανοπλία
actors.hero.talent.cloned_armor.desc=_+1:_ Ο κλώνος-σκιά λαμβάνει το _12%_ της ισχύος της πανοπλίας του ήρωα, κι έχει _25% πιθανότητα_ να χρησιμοποιήσει τον γλύφο της πανοπλίας του ήρωα.\n\n_+2:_ Ο κλώνος-σκιά λαμβάνει το _24%_ της ισχύος της πανοπλίας του ήρωα, κι έχει _50% πιθανότητα_ να χρησιμοποιήσει τον γλύφο της πανοπλίας του ήρωα.\n\n_+3:_ Ο κλώνος-σκιά λαμβάνει το _36%_ της ισχύος της πανοπλίας του ήρωα, κι έχει _75% πιθανότητα_ να χρησιμοποιήσει τον γλύφο της πανοπλίας του ήρωα.\n\n_+4:_ Ο κλώνος-σκιά λαμβάνει το _48%_ της ισχύος της πανοπλίας του ήρωα, κι έχει _100% πιθανότητα_ να χρησιμοποιήσει τον γλύφο της πανοπλίας του ήρωα.
actors.hero.talent.perfect_copy.title=πιστό αντίγραφο
actors.hero.talent.perfect_copy.desc=_+1:_ Ο κλώνος-σκιά λαμβάνει το _10%_ της μέγιστης ζωής του ήρωα, και μπορεί να ανταλλάξει ακαριαία θέσεις μαζί του από μέχρι _1 τετράγωνο_ μακριά.\n\n_+2:_ Ο κλώνος-σκιά λαμβάνει το _20%_ της μέγιστης ζωής του ήρωα, και μπορεί να ανταλλάξει ακαριαία θέσεις μαζί του από μέχρι _2 τετράγωνα_ μακριά.\n\n_+3:_ Ο κλώνος-σκιά λαμβάνει το _30%_ της μέγιστης ζωής του ήρωα, και μπορεί να ανταλλάξει ακαριαία θέσεις μαζί του από μέχρι _3 τετράγωνα_ μακριά.\n\n_+4:_ Ο κλώνος-σκιά λαμβάνει το _40%_ της μέγιστης ζωής του ήρωα, και μπορεί να ανταλλάξει ακαριαία θέσεις μαζί του από μέχρι _4 τετράγωνα_ μακριά.

#huntress
actors.hero.talent.natures_bounty.title=αμοιβή της φύσης
actors.hero.talent.natures_bounty.desc=_+1:_ Η Κυνηγός μπορεί να βρει _4 μούρα_ κρυμμένα σε ψηλό γρασίδι ενώ εξερευνεί κάποια αμέσως επόμενα επίπεδα της κατακόμβης.\n\n_+2:_ Η Κυνηγός μπορεί να βρει _6 μούρα_ κρυμμένα σε ψηλό γρασίδι ενώ εξερευνεί κάποια αμέσως επόμενα επίπεδα της κατακόμβης.\n\nΤα μούρα φαγώνονται γρήγορα, επαναφέρουν μια μικρή ποσότητα κορεσμού και ίσως να περιέχουν έναν χρήσιμο σπόρο.
actors.hero.talent.survivalists_intuition.title=διαίσθηση του επιβιωτιστή
actors.hero.talent.survivalists_intuition.desc=_+1:_ Η Κυνηγός αναγνωρίζει τα όπλα ρίψης _3 φορές γρηγορότερα_.\n\n_+2:_ Η Κυνηγός αναγνωρίζει τα όπλα ρίψης _μόλις χτυπήσει με αυτά_.
actors.hero.talent.followup_strike.title=επακόλουθο χτύπημα
actors.hero.talent.followup_strike.desc=_+1:_ Όταν η Κυνηγός χτυπά έναν εχθρό με το τόξο της ή ένα όπλο ρίψης, η επόμενη επίθεση μάχης σώμα-με-σώμα εναντίον του θα προκαλέσει _2 επιπλέον ζημιά._\n\n_+2:_ Όταν η Κυνηγός χτυπά έναν εχθρό με το τόξο της ή ένα όπλο ρίψης, η επόμενη επίθεση μάχης σώμα-με-σώμα εναντίον του θα προκαλέσει _3 επιπλέον ζημιά._
actors.hero.talent.natures_aid.title=βοήθεια της φύσης
actors.hero.talent.natures_aid.desc=_+1:_ Η Κυνηγός λαμβάνει 0-2 πόντους προστασίας από φλοιώδες δέρμα, όταν η επίδραση ενός φυτού ενεργοποιείται στο οπτικό της πεδίο. Αυτό εξασθενεί κάθε _3 γύρους_.\n\n_+2:_ Η Κυνηγός λαμβάνει 0-2 πόντους προστασίας από φλοιώδες δέρμα, όταν η επίδραση ενός φυτού ενεργοποιείται στο οπτικό της πεδίο. Αυτό εξασθενεί κάθε _5 γύρους_.

actors.hero.talent.invigorating_meal.title=αναζωογονητικό γεύμα
actors.hero.talent.invigorating_meal.desc=_+1:_ Η Κυνηγός χρειάζεται 1 γύρο για να φάει (τα μούρα τρώγονται κατευθείαν) και λαμβάνει _1 γύρο βιασύνης._\n\n_+2:_ Η Κυνηγός χρειάζεται 1 γύρο για να φάει (τα μούρα τρώγονται κατευθείαν) και λαμβάνει _2 γύρους βιασύνης._
actors.hero.talent.liquid_nature.title=υγρή φύση
actors.hero.talent.liquid_nature.desc=_+1:_ Όταν η Κυνηγός πίνει ή πετά κάποιο φίλτρο, σκεύασμα, ή ελιξίριο, ξεφυτρώνει γρασίδι _σε έως και 4 τετράγωνα_ στη γύρω περιοχή και οι διπλανοί εχθροί ριζώνονται για _1 γύρο._\n\n_+2:_ Όταν η Κυνηγός πίνει ή πετά κάποιο φίλτρο, σκεύασμα, ή ελιξίριο,  ξεφυτρώνει γρασίδι σε _έως και 6 τετράγωνα_ στη γύρω περιοχή και οι διπλανοί εχθροί ριζώνονται για _2 γύρους._\n\nΗ ποσότητα του γρασιδιού και η διάρκεια του ριζώματος διπλασιάζονται με τη χρήση φίλτρου δύναμης, εμπειρίας, καθώς και αντικείμενα που απαιτούν αυτά τα φίλτρα για να παρασκευαστούν αλχημικά.\n\nΓια αλχημικά αντικείμενα με μεγαλύτερη ποσότητα παραγωγής (π.χ. υδατικό σκεύασμα), το ταλέντο έχει πιθανότητα να ενεργοποιηθεί βάσει της ποσότητας του αντικειμένου που παράγεται.
actors.hero.talent.rejuvenating_steps.title=αναζωογονητικά βήματα
actors.hero.talent.rejuvenating_steps.desc=_+1:_ Όταν η Κυνηγός πατά σε κοντό γρασίδι ή κάρβουνα, ξεπηδούν ως ψηλό γρασίδι που το στραπατσάρει αμέσως. Αυτό έχει περίοδο αναπλήρωσης _10 γύρων._\n\n_+2:_ Όταν η Κυνηγός πατά σε κοντό γρασίδι ή κάρβουνα, ξεπηδούν ως ψηλό γρασίδι που το στραπατσάρει αμέσως. Αυτό έχει περίοδο αναπλήρωσης _5 γύρων._\n\nΤο ταλέντο θα παράξει απευθείας στραπατσαρισμένο γρασίδι αν οι παθητικές αναπληρώσεις -όπως η αναπλήρωση ζωής και η επαναφόρτιση ραβδιών- είναι απενεργοποιημένες, ή αν η ηρωίδα δεν έχει λάβει εμπειρία για μεγάλο χρονικό διάστημα.
actors.hero.talent.heightened_senses.title=οξυμένες αισθήσεις
actors.hero.talent.heightened_senses.desc=_+1:_ Η Κυνηγός αποκτά ενόραση σε οποιονδήποτε χαρακτήρα μέχρι _2 τετράγωνα από τη θέση της_.\n\n_+2:_ Η Κυνηγός αποκτά ενόραση σε οποιονδήποτε χαρακτήρα μέχρι _3 τετράγωνα από τη θέση της_.
actors.hero.talent.durable_projectiles.title=ανθεκτικά βλήματα
actors.hero.talent.durable_projectiles.desc=_+1:_ Τα όπλα ρίψης έχουν _+50% ανθεκτικότητα_ όταν χρησιμοποιούνται από την Κυνηγό.\n\n_+2:_ Τα όπλα ρίψης έχουν _+75% ανθεκτικότητα_ όταν χρησιμοποιούνται από την Κυνηγό.

actors.hero.talent.point_blank.title=εξ επαφής
actors.hero.talent.point_blank.desc=_+1:_ When the Huntress uses her bow or a thrown weapon at melee range it has _-25% accuracy,_ instead of -50%.\n\n_+2:_ When the Huntress uses her bow or a thrown weapon at melee range it has _normal accuracy,_ instead of -50%.\n\n_+3:_ When the Huntress uses her bow or a thrown weapon at melee range it has _+25% accuracy,_ instead of -50%.\n\nNote that thrown weapons or the spirit bow always have +50% accuracy when used at a distance.
actors.hero.talent.seer_shot.title=μαντική ρίψη
actors.hero.talent.seer_shot.desc=_+1:_ Όποτε η Κυνηγός ρίχνει βέλος στο έδαφος, της παρέχεται όραση σε μια περιοχή 3x3 γύρω από αυτό για _5 γύρους._ Αυτό έχει περίοδο αναπλήρωσης 20 γύρων.\n\n_+2:_ Όποτε η Κυνηγός ρίχνει βέλος στο έδαφος, της παρέχεται όραση σε μια περιοχή 3x3 γύρω από αυτό για _10 γύρους._ Αυτό έχει περίοδο αναπλήρωσης 20 γύρων.\n\n_+3:_ Όποτε η Κυνηγός ρίχνει βέλος στο έδαφος, της παρέχεται όραση σε μια περιοχή 3x3 γύρω από αυτό για _15 γύρους._ Αυτό έχει περίοδο αναπλήρωσης 20 γύρων.
actors.hero.talent.seer_shot.meta_desc=_Αν το ταλέντο παρθεί από διαφορετικό ήρωα,_ θα ενεργοποιείται από κάθε όπλο ρίψης.

actors.hero.talent.farsight.title=μακρινή όραση
actors.hero.talent.farsight.desc=_+1:_ Το οπτικό πεδίο της Σκοπεύτριας _αυξάνεται κατά 25%._\n\n_+2:_ Το οπτικό πεδίο της Σκοπεύτριας _αυξάνεται κατά 50%._\n\n_+3:_ Το οπτικό πεδίο της Σκοπεύτριας _αυξάνεται κατά 75%._
actors.hero.talent.shared_enchantment.title=μοιρασμένη μαγική ενίσχυση
actors.hero.talent.shared_enchantment.desc=_+1:_ Τα όπλα ρίψης έχουν _33% πιθανότητα_ να ενεργοποιήσουν τη μαγική ενίσχυση του τόξου της Σκοπεύτριας.\n\n_+2:_ Τα όπλα ρίψης έχουν _67% πιθανότητα_ να ενεργοποιήσουν τη μαγική ενίσχυση του τόξου της Σκοπεύτριας.\n\n_+3:_ Τα όπλα ρίψης έχουν _100% πιθανότητα_ να ενεργοποιήσουν τη μαγική ενίσχυση του τόξου της Σκοπεύτριας.\n\nΗ μαγική ενίσχυση του τόξου μπορεί να εφαρμοστεί επιπρόσθετα με τη μαγική ενίσχυση που έχει ήδη το όπλο ρίψης.
actors.hero.talent.shared_upgrades.title=μοιρασμένες αναβαθμίσεις
actors.hero.talent.shared_upgrades.desc=_+1:_ Όταν η Σκοπεύτρια επιτίθεται με αναβαθμισμένο όπλο ρίψης, κάθε του επίπεδο αυξάνει τη διάρκεια του Σημαδιού της Σκοπεύτριας κατά 1 γύρο και τη ζημιά της ειδικής της επίθεσης κατά 16%, με μέγιστο _2 γύρους και +33% ζημιά στο +2._\n\n_+2:_ Όταν η Σκοπεύτρια επιτίθεται με αναβαθμισμένο όπλο ρίψης, κάθε του επίπεδο αυξάνει τη διάρκεια του Σημαδιού της Σκοπεύτριας κατά 1 γύρο και τη ζημιά της ειδικής της επίθεσης κατά   16%, με μέγιστο _ 4 γύρους και +67% ζημιά στο +4._\n\n_+3:_ Όταν η Σκοπεύτρια επιτίθεται με αναβαθμισμένο όπλο ρίψης, κάθε του επίπεδο αυξάνει τη διάρκεια του Σημαδιού της Σκοπεύτριας κατά 1 γύρο και τη ζημιά της ειδικής της επίθεσης κατά 16%, με μέγιστο _6 γύρους και +100% ζημιά στο +6._

actors.hero.talent.durable_tips.title=ανθεκτικές αιχμές
actors.hero.talent.durable_tips.desc=_+1:_ Τα εμποτισμένα βέλη έχουν _x2 ανθεκτικότητα_ όταν τα χρησιμοποιεί η Δασοφύλακας.\n\n_+2:_ Τα εμποτισμένα βέλη έχουν _x3 ανθεκτικότητα_ όταν τα χρησιμοποιεί η Δασοφύλακας.\n\n_+3:_ Τα εμποτισμένα βέλη έχουν _x4 ανθεκτικότητα_ όταν τα χρησιμοποιεί η Δασοφύλακας.
actors.hero.talent.barkskin.title=φλοιώδες δέρμα
actors.hero.talent.barkskin.desc=_+1:_ Όταν πατά σε γρασίδι, η Δασοφύλακας λαμβάνει φλοιώδες δέρμα ίσο με το _0-50% του επιπέδου της._ Το φλοιώδες δέρμα εξασθενεί κάθε γύρο.\n\n_+2:_ Όταν πατά σε γρασίδι, η Δασοφύλακας λαμβάνει φλοιώδες δέρμα ίσο με το _0-100% του επιπέδου της._ Το φλοιώδες δέρμα εξασθενεί κάθε γύρο.\n\n_+3:_ Όταν πατά σε γρασίδι, η Δασοφύλακας λαμβάνει φλοιώδες δέρμα ίσο με το _0-150% του επιπέδου της._ Το φλοιώδες δέρμα εξασθενεί κάθε γύρο.
actors.hero.talent.shielding_dew.title=προστατευτική δρόσος
actors.hero.talent.shielding_dew.desc=_+1:_ Οι δροσοσταλιές προσφέρουν προστασία στη Δασοφύλακα όταν έχει πλήρη ζωή, με όριο προστασίας ίσο με το _20% της μέγιστης ζωής της._ \n\n_+2:_ Οι δροσοσταλιές προσφέρουν προστασία στη Δασοφύλακα όταν έχει πλήρη ζωή, με όριο προστασίας ίσο με το _40% της μέγιστης ζωής της._\n\n_+3:_ Οι δροσοσταλιές προσφέρουν προστασία στη Δασοφύλακα όταν έχει πλήρη ζωή, με όριο προστασίας ίσο με το _60% της μέγιστης ζωής της._

actors.hero.talent.fan_of_blades.title=βεντάλια λεπίδων
actors.hero.talent.fan_of_blades.desc=_+1:_ Οι λεπίδες μπορούν να χτυπήσουν έως _1 ακόμα στόχο_ με 50% ζημιά. Ο στόχος πρέπει να είναι ορατός και μέσα σε κωνική περιοχή _30 μοιρών._\n\n_+2:_ Οι λεπίδες μπορούν να χτυπήσουν έως _2 ακόμα στόχους_ με 50% ζημιά. Οι στόχοι πρέπει να είναι ορατοί και μέσα σε κωνική περιοχή _60 μοιρών._\n\n_+3:_ Οι λεπίδες μπορούν να χτυπήσουν έως _3 ακόμα στόχους_ με 50% ζημιά. Οι στόχοι πρέπει να είναι ορατοί και μέσα σε κωνική περιοχή _90 μοιρών._\n\n_+4:_ Οι λεπίδες μπορούν να χτυπήσουν έως _4 ακόμα στόχους_ με 50% ζημιά. Οι στόχοι πρέπει να είναι ορατοί και μέσα σε κωνική περιοχή _120 μοιρών._
actors.hero.talent.projecting_blades.title=προβλητικές λεπίδες
actors.hero.talent.projecting_blades.desc=_+1:_ Οι φασματικές λεπίδες έχουν _+25% ακρίβεια,_ και μπορούν να διαπεράσουν έως και _2 συμπαγή τετράγωνα_.\n\n_+2:_ Οι φασματικές λεπίδες έχουν _+50% ακρίβεια,_ και μπορούν να διαπεράσουν έως και _4 συμπαγή τετράγωνα_.\n\n_+3:_ Οι φασματικές λεπίδες έχουν _+75% ακρίβεια,_ και μπορούν να διαπεράσουν έως και _6 συμπαγή τετράγωνα_.\n\n_+4:_ Οι φασματικές λεπίδες έχουν _+100% ακρίβεια,_ και μπορούν να διαπεράσουν έως και _8 συμπαγή τετράγωνα_.
actors.hero.talent.spirit_blades.title=πνευματικές λεπίδες
actors.hero.talent.spirit_blades.desc=_+1:_ Οι φασματικές λεπίδες έχουν _30% πιθανότητα_ να ενεργοποιήσουν και τη μαγική ενίσχυση του πνευματικού τόξου.\n\n_+2:_ Οι φασματικές λεπίδες  έχουν _60% πιθανότητα_ να ενεργοποιήσουν και τη μαγική ενίσχυση του πνευματικού τόξου.\n\n_+3:_ Οι φασματικές λεπίδες έχουν _90% πιθανότητα_ να ενεργοποιήσουν και τη μαγική ενίσχυση του πνευματικού τόξου.\n\n_+4:_ Οι φασματικές λεπίδες έχουν _100% πιθανότητα_ να ενεργοποιήσουν και τη μαγική ενίσχυση του πνευματικού τόξου. Επίσης, δίνουν σε κάθε μαγική ενίσχυση _+10% ισχύ._

actors.hero.talent.growing_power.title=αυξημένη ισχύς
actors.hero.talent.growing_power.desc=_+1:_ Τα μπόνους επίθεσης και ταχύτητας κίνησης από τη δύναμη της φύσης αυξάνονται σε _38% και 125%_, από 33% και 100%.\n\n_+2:_ Τα μπόνους επίθεσης και ταχύτητας κίνησης από τη δύναμη της φύσης αυξάνονται σε _42% και 150%_, από 33% και 100%.\n\n_+3:_ Τα μπόνους επίθεσης και ταχύτητας κίνησης από τη δύναμη της φύσης αυξάνονται σε _46% και 175%_, από 33% και 100%.\n\n_+4:_ Τα μπόνους επίθεσης και ταχύτητας κίνησης από τη δύναμη της φύσης αυξάνονται σε _50% και 200%_, από 33% και 100%.
actors.hero.talent.natures_wrath.title=οργή της φύσης
actors.hero.talent.natures_wrath.desc=_+1:_ Υπό τη δύναμη της φύσης, οι ριπές του πνευματικού τόξου ενεργοποιούν τυχαία επιβλαβή επίδραση φυτού με _8% πιθανότητα._\n\n_+2:_ Υπό τη δύναμη της φύσης, οι ριπές του πνευματικού τόξου ενεργοποιούν τυχαία επιβλαβή επίδραση φυτού με _17% πιθανότητα._\n\n_+3:_ Υπό τη δύναμη της φύσης, οι ριπές του πνευματικού τόξου ενεργοποιούν τυχαία επιβλαβή επίδραση φυτού με _25% πιθανότητα._\n\n_+4:_ Υπό τη δύναμη της φύσης, οι ριπές του πνευματικού τόξου ενεργοποιούν τυχαία επιβλαβή επίδραση φυτού με _33% πιθανότητα._\n\nΜπορούν να ενεργοποιηθούν τα: τυφλόχορτο, φλογανθός, παγολούλουδο, οδυνόβρυο, μπορέλι.
actors.hero.talent.wild_momentum.title=ξέφρενη ορμή
actors.hero.talent.wild_momentum.desc=_+1:_ Η εξόντωση εχθρού με το πνευματικό τόξο παρατείνει τη δύναμη της φύσης κατά _1 γύρο._ Μέγιστη αύξηση: _2 γύροι._\n\n_+2:_ Η εξόντωση εχθρού με το πνευματικό τόξο παρατείνει τη δύναμη της φύσης κατά _2 γύρους._ Μέγιστη αύξηση: _4 γύροι._\n\n_+3:_ Η εξόντωση εχθρού με το πνευματικό τόξο παρατείνει τη δύναμη της φύσης κατά _3 γύρους._ Μέγιστη αύξηση: _6 γύροι._\n\n_+4:_ Η εξόντωση εχθρού με το πνευματικό τόξο παρατείνει τη δύναμη της φύσης κατά _4 γύρους._ Μέγιστη αύξηση: _8 γύροι._

actors.hero.talent.eagle_eye.title=γερακίσιο βλέμμα
actors.hero.talent.eagle_eye.desc=_+1:_ Το οπτικό πεδίο του πνευματικού γερακιού αυξάνεται σε _7 τετράγωνα_ από 6.\n\n_+2:_ Το οπτικό πεδίο του πνευματικού γερακιού αυξάνεται σε _8 τετράγωνα_ από 6.\n\n_+3:_ Το οπτικό πεδίο του πνευματικού γερακιού αυξάνεται σε _9 τετράγωνα_ από 6, και λαμβάνει ενόραση σε _2 τετράγωνα._\n\n_+4:_ Το οπτικό πεδίο του πνευματικού γερακιού αυξάνεται σε _10 τετράγωνα_ από 6, και λαμβάνει ενόραση σε _3 τετράγωνα._
actors.hero.talent.go_for_the_eyes.title=χτύπα στα μάτια
actors.hero.talent.go_for_the_eyes.desc=_+1:_ Οι επιθέσεις του πνευματικού γερακιού τυφλώνουν τους εχθρούς για _2 γύρους._\n\n_+2:_ Οι επιθέσεις του πνευματικού γερακιού τυφλώνουν τους εχθρούς για _5 γύρους._\n\n_+3:_ Οι επιθέσεις του πνευματικού γερακιού τυφλώνουν τους εχθρούς για _5 γύρους_ και τους σακατεύουν για _2 γύρους._\n\n_+4:_ Οι επιθέσεις του πνευματικού γερακιού τυφλώνουν τους εχθρούς για _5 γύρους_ και τους σακατεύουν για _5 γύρους._
actors.hero.talent.swift_spirit.title=ταχύ πνεύμα
actors.hero.talent.swift_spirit.desc=_+1:_ Η ταχύτητα κίνησης του γερακιού αυξάνεται σε _2.5 τετράγωνα_ από 2, και αποφεύγει εγγυημένα τις _2 πρώτες επιθέσεις._\n\n_+2:_ Η ταχύτητα κίνησης του γερακιού αυξάνεται σε _3 τετράγωνα_ από 2, και αποφεύγει εγγυημένα τις _4 πρώτες επιθέσεις._\n\n_+3:_ Η ταχύτητα κίνησης του γερακιού αυξάνεται σε _3.5 τετράγωνα_ από 2, και αποφεύγει εγγυημένα τις _6 πρώτες επιθέσεις._\n\n_+4:_ Η ταχύτητα κίνησης του γερακιού αυξάνεται σε _4 τετράγωνα_ από 2, και αποφεύγει εγγυημένα τις _8 πρώτες επιθέσεις._

#duelist
actors.hero.talent.strengthening_meal.title=ενδυναμωτικό γεύμα
actors.hero.talent.strengthening_meal.desc=_+1:_ Η κατανάλωση φαγητού προσδίδει 3 επιπλέον ζημιά στις επόμενες _2 φυσιολογικές επιθέσεις_ της Ξιφομάχου εναντίον εχθρών.\n\n_+2:_ Η κατανάλωση φαγητού προσδίδει 3 επιπλέον ζημιά στις επόμενες _3 φυσιολογικές επιθέσεις_ της Ξιφομάχου εναντίον εχθρών.
actors.hero.talent.adventurers_intuition.title=διαίσθηση του εξερευνητή
actors.hero.talent.adventurers_intuition.desc=_+1:_ Η Ξιφομάχος αναγνωρίζει τα όπλα _x2.5 γρηγορότερα_ και την πανοπλία _x1.75 γρηγορότερα._\n\n_+2:_ Η Ξιφομάχος αναγνωρίζει τα όπλα _μόλις τα εξοπλίσει_ και την πανοπλία _x2.5 γρηγορότερα._
actors.hero.talent.patient_strike.title=καρτερικό χτύπημα
actors.hero.talent.patient_strike.desc=_+1:_ Αν η Μονομάχος περιμένει προτού εκτελέσει μια επίθεση σώμα-με-σώμα, θα προκαλέσει _1-2 επιπλέον ζημιά._\n\n_+2:_ Αν η Μονομάχος περιμένει προτού εκτελέσει μια επίθεση σώμα-με-σώμα, θα προκαλέσει _2 επιπλέον ζημιά._
actors.hero.talent.aggressive_barrier.title=επιθετικό πεδίο
actors.hero.talent.aggressive_barrier.desc=_+1:_ Η Ξιφομάχος αποκτά _3 προστασία_ όταν χρησιμοποιεί μια οπλική ικανότητα και έχει ζωή 50% και κάτω.\n\n_+2:_ Η Ξιφομάχος αποκτά _5 προστασία_ όταν χρησιμοποιεί μια οπλική ικανότητα και έχει ζωή 50% και κάτω.
actors.hero.talent.aggressive_barrier.meta_desc=_Αν το ταλέντο παρθεί από διαφορετικό ήρωα,_ θα παρέχει προστασία κάνοντας επίθεση σώμα-με-σώμα με χαμηλή ζωή, με περίοδο αναπλήρωσης 50 γύρων.

actors.hero.talent.focused_meal.title=συγκεντρωτικό γεύμα
actors.hero.talent.focused_meal.desc=_+1:_ Η κατανάλωση φαγητού απαιτεί 1 γύρο και προσδίδει _0.67 φορτίο_ στα όπλα της Ξιφομάχου.\n\n_+2:_ H κατανάλωση φαγητού απαιτεί 1 γύρο και προσδίδει _1 φορτίο_ στα όπλα της Ξιφομάχου.
actors.hero.talent.focused_meal.meta_desc=_Αν το ταλέντο παρθεί από διαφορετικό ήρωα,_ θα προσδώσει επιπλέον ζημιά στην επόμενη επίθεση ίση με το επίπεδο/3 στο +1 ή το επίπεδο/2 στο +2.
actors.hero.talent.liquid_agility.title=υγρή ευκινησία
actors.hero.talent.liquid_agility.desc=_+1:_ Όταν πίνει ή πετά κάποιο φίλτρο, σκεύασμα ή ελιξίριο, η Ξιφομάχος έχει _x3 αποφυγή,_ καθώς και _x3 ακρίβεια_ στην επόμενή της επίθεση μάχης σώμα-με-σώμα εντός 5 γύρων.\n\n_+2:_ Όταν πίνει ή πετά κάποιο φίλτρο, σκεύασμα ή ελιξίριο, η Ξιφομάχος έχει _άπειρη αποφυγή,_ καθώς και _άπειρη ακρίβεια_ στην επόμενή της επίθεση μάχης σώμα-με-σώμα εντός 5 γύρων.\n\nΑυτά τα μπόνους διαρκούν για 1 επιπλέον γύρο και 1 επιπλέον επίθεση με τη χρήση φίλτρου δύναμης, εμπειρίας, ή αλχημικών αντικειμένων που απαιτούν αυτά τα φίλτρα για να παρασκευαστούν.\n\nΓια αλχημικά αντικείμενα με μεγαλύτερη ποσότητα παραγωγής (π.χ. το υδατικό σκεύασμα), το ταλέντο έχει πιθανότητα να ενεργοποιηθεί βάσει της ποσότητας του αντικειμένου που παράγεται.
actors.hero.talent.weapon_recharging.title=οπλική επαναφόρτιση
actors.hero.talent.weapon_recharging.desc=_+1:_ Η Ξιφομάχος λαμβάνει 1 οπλικό φορτίο ανά _15 γύρους_ υπό την επίδραση επαναφόρτισης ραβδιών ή τεχνουργημάτων.\n\n_+2:_ Η Ξιφομάχος λαμβάνει 1 οπλικό φορτίο ανά _10 γύρους_ υπό την επίδραση επαναφόρτισης ραβδιών ή τεχνουργημάτων.
actors.hero.talent.weapon_recharging.meta_desc=_Αν το ταλέντο παρθεί από διαφορετικό ήρωα,_ θα τον κάνει να προκαλεί (υπό επιδράσεις επαναφόρτισης) +5% ζημιά μάχης σώμα-με-σώμα στο +1 και +7,5% στο +2.
actors.hero.talent.lethal_haste.title=φονική βιασύνη
actors.hero.talent.lethal_haste.desc=_+1:_ Όταν η Ξιφομάχος καταφέρνει θανάσιμο χτύπημα σε εχθρό με οπλική ικανότητα, λαμβάνει _3 γύρους_ ακαριαίας κίνησης.\n\n_+2:_ Όταν η Ξιφομάχος καταφέρνει θανάσιμο χτύπημα σε εχθρό με οπλική ικανότητα, λαμβάνει _5 γύρους_ ακαριαίας κίνησης.
actors.hero.talent.lethal_haste.meta_desc=_Αν το ταλέντο παρθεί από διαφορετικό ήρωα_ θα ενεργοποιείται από κανονικές επιθέσεις όπλων, με περίοδο αναπλήρωσης 100 γύρων.
actors.hero.talent.swift_equip.title=ταχεία εξόπλιση
actors.hero.talent.swift_equip.desc=_+1:_ Η Ξιφομάχος μπορεί να εναλλάξει ακαριαία το εξοπλισμένο όπλο της _μία φορά_ κάθε 20 γύρους.\n\n_+2:_ Η Ξιφομάχος μπορεί να εναλλάξει ακαριαία το εξοπλισμένο όπλο της _δύο φορές_ κάθε 20 γύρους.\n\nΑν η Ξιφομάχος έχει το ταλέντο και δεν είναι σε αναπλήρωση, η ταχεία χρήση ενός μη εξοπλισμένου όπλου θα το εξοπλίσει.

actors.hero.talent.precise_assault.title=επίθεση ακριβείας
actors.hero.talent.precise_assault.desc=_+1:_ Όταν η Ξιφομάχος χρησιμοποιεί μια οπλική ικανότητα, αποκτά _x2 ακρίβεια_ στην επόμενη επίθεση σώμα-με-σώμα εντός 5 γύρων.\n\n_+2:_ Όταν η Ξιφομάχος χρησιμοποιεί μια οπλική ικανότητα, αποκτά _x5 ακρίβεια_ στην επόμενη επίθεση σώμα-με-σώμα εντός 5 γύρων.\n\n_+3:_ Όταν η Ξιφομάχος χρησιμοποιεί μια οπλική ικανότητα, αποκτά _άπειρη ακρίβεια_ στην επόμενη επίθεση σώμα-με-σώμα εντός 5 γύρων.
actors.hero.talent.precise_assault.meta_desc=_Αν το ταλέντο παρθεί από διαφορετικό ήρωα,_ θα αυξήσει την ακρίβεια επίθεσης μάχης σώμα-με-σώμα κατά 10% στο +1, 20% στο +2 και 30% στο +3.
actors.hero.talent.deadly_followup.title=θανάσιμο επακόλουθο
actors.hero.talent.deadly_followup.desc=_+1:_ Αφού η Ξιφομάχος χτυπήσει έναν εχθρό με όπλο ρίψης, θα του προκαλεί _10% επιπλέον ζημιά στη μάχη σώμα-με-σώμα_ για 5 γύρους.\n\n_+2:_ Αφού η Ξιφομάχος χτυπήσει έναν εχθρό με όπλο ρίψης, θα του προκαλεί _20% επιπλέον ζημιά στη μάχη σώμα-με-σώμα_ για 5 γύρους.\n\n_+3:_ Αφού η Ξιφομάχος χτυπήσει έναν εχθρό με όπλο ρίψης, θα του προκαλεί _30% επιπλέον ζημιά στη μάχη σώμα-με-σώμα_ για 5 γύρους.

actors.hero.talent.varied_charge.title=πολυποίκιλο φορτίο
actors.hero.talent.varied_charge.desc=_+1:_ Η Μαχήτρια αναπληρώνει αμέσως _0.17 οπλικό φορτίο_ όταν χρησιμοποιεί δύο διαφορετικές οπλικές ικανότητες, χωρίς χρονικό περιορισμό.\n\n_+2:_ Η Μαχήτρια αναπληρώνει αμέσως _0.33 οπλικό φορτίο_ όταν χρησιμοποιεί δύο διαφορετικές οπλικές ικανότητες, χωρίς χρονικό περιορισμό.\n\n_+3:_ Η Μαχήτρια αναπληρώνει αμέσως _0.5 οπλικό φορτίο_ όταν χρησιμοποιεί δύο διαφορετικές οπλικές ικανότητες, χωρίς χρονικό περιορισμό.
actors.hero.talent.twin_upgrades.title=διπλές αναβαθμίσεις
actors.hero.talent.twin_upgrades.desc=_+1:_ Αν ένα από τα δύο εξοπλισμένα όπλα της Μαχήτριας είναι χαμηλότερου επιπέδου και _2+ βαθμίδες κάτω_ από το άλλο, θα εξισωθεί το επίπεδό του με του άλλου.\n\n_+2:_ Αν ένα από τα δύο εξοπλισμένα όπλα της Μαχήτριας είναι χαμηλότερου επιπέδου και _1+ βαθμίδες κάτω_ από το άλλο, θα εξισωθεί το επίπεδό του με του άλλου.\n\n_+3:_ Αν ένα από τα δύο εξοπλισμένα όπλα της Μαχήτριας είναι χαμηλότερου επιπέδου και _ίδιας ή χαμηλότερης βαθμίδας_ από το άλλο, θα εξισωθεί το επίπεδό του με του άλλου.
actors.hero.talent.combined_lethality.title=συνδυαστική φονικότητα
actors.hero.talent.combined_lethality.desc=_+1:_ Αν η Μαχήτρια επιτεθεί με όπλο μάχης σώμα-με-σώμα αμέσως αφού χρησιμοποιήσει μια οπλική ικανότητα από διαφορετικό όπλο, αυτή η επίθεση θα εκτελέσει οποιοδήποτε μη-αφεντικό που έχει _κάτω από 13% ζωή._\n\n_+2:_ Αν η Μαχήτρια επιτεθεί με όπλο μάχης σώμα-με-σώμα αμέσως αφού \nχρησιμοποιήσει μια οπλική ικανότητα από διαφορετικό όπλο, αυτή η \nεπίθεση θα εκτελέσει οποιοδήποτε μη-αφεντικό που έχει _κάτω από 27% ζωή._\n\n_+3:_ Αν η Μαχήτρια επιτεθεί με όπλο μάχης σώμα-με-σώμα αμέσως αφού \nχρησιμοποιήσει μια οπλική ικανότητα από διαφορετικό όπλο, αυτή η \nεπίθεση θα εκτελέσει οποιοδήποτε μη-αφεντικό που έχει _κάτω από 40% ζωή._\n\nΑυτή η επίθεση μπορεί να είναι κανονική επίθεση όπλου μάχης σώμα-με-σώμα ή και κομμάτι μιας οπλικής ικανότητας.

actors.hero.talent.unencumbered_spirit.title=ελεύθερο πνεύμα
actors.hero.talent.unencumbered_spirit.desc=_+1:_ The Monk gains _50% more energy_ for each piece of _tier 3 or lower_ equipment she is using.\n\n_+2:_ The Monk gains _75% more energy_ for each piece of _tier 2 or lower_ equipment she is using. The tier 3 benefit is unchanged.\n\n_+3:_ The Monk gains _100% more energy_ for each piece of _tier 1 or lower_ equipment she is using. The tier 2 and 3 benefits are unchanged. She also gains a free cloth armor and studded gloves.\n\nNote that this talent gives no benefit from being unarmed or attacking with a Ring of Force.
actors.hero.talent.monastic_vigor.title=μοναστική ρώμη
actors.hero.talent.monastic_vigor.desc=_+1:_ Αν η Μοναχή έχει _100% ενέργεια,_ οι μοναστικές ικανότητες ενδυναμώνονται.\n\n_+2:_ Αν η Μοναχή έχει _80%+ ενέργεια,_ οι μοναστικές ικανότητες ενδυναμώνονται.\n\n_+3:_ Αν η Μοναχή έχει _60%+ ενέργεια,_ οι μοναστικές ικανότητες ενδυναμώνονται.\n\nΌταν έχει ενδυναμωθεί:\n- Ο καταιγισμός εφαρμόζει τη μαγική ενίσχυση του όπλου\n- Η συγκέντρωση είναι ακαριαία\n- Η αναπήδηση αποκτά +4 εμβέλεια\n- Το λάκτισμα του δράκου προκαλεί +50% ζημιά· σπρώχνει και παραλύει όλους τους διπλανούς εχθρούς\n- Ο διαλογισμός αναπληρώνει αργά το 20% της χαμένης ζωής και προσδίδει 80% αντίσταση στη ζημιά
actors.hero.talent.combined_energy.title=συνδυαστική ενέργεια
actors.hero.talent.combined_energy.desc=_+1:_ Αν η Μοναχή εκτελέσει μια οπλική και μια μοναστική ικανότητα _4+ ενέργειας_ μέσα σε 5 γύρους, αναπληρώνει 1 δαπανημένη ενέργεια.\n\n_+2:_ Αν η Μοναχή εκτελέσει μια οπλική και μια μοναστική ικανότητα _3+ ενέργειας_ μέσα σε 5 γύρους, αναπληρώνει 1 δαπανημένη ενέργεια.\n\n_+3:_ Αν η Μοναχή εκτελέσει μια οπλική και μια μοναστική ικανότητα _2+ ενέργειας_ μέσα σε 5 γύρους, αναπληρώνει 1 δαπανημένη ενέργεια.

actors.hero.talent.close_the_gap.title=γεφύρωσε το χάσμα
actors.hero.talent.close_the_gap.desc=_+1:_ Η Ξιφομάχος αναπηδά _έως δύο τετράγωνα_ προς τον στόχο όταν ξεκινά μονομαχία.\n\n_+2:_ Η Ξιφομάχος αναπηδά _έως τρία τετράγωνα_ προς τον στόχο όταν ξεκινά μονομαχία.\n\n_+3:_ Η Ξιφομάχος αναπηδά _έως τέσσερα τετράγωνα_ προς τον στόχο όταν ξεκινά μονομαχία.\n\n_+4:_ Η Ξιφομάχος αναπηδά _έως πέντε τετράγωνα_ προς τον στόχο όταν ξεκινά μονομαχία.\n\nΗ αναπήδηση πάει πάνω από εχθρούς και κακοτοπιές, αλλά όχι διαμέσω συμπαγών περιοχών όπως οι τοίχοι. Η αναπήδηση λαμβάνεται υπόψη όταν προσδιορίζεται αν ένας εχθρός βρίσκεται σε εμβέλεια για να προκληθεί.
actors.hero.talent.invigorating_victory.title=αναζωογονητική νίκη
actors.hero.talent.invigorating_victory.desc=_+1:_ Αν η Ξιφομάχος εξοντώσει τον στόχο πριν τελειώσει η μονομαχία, θα αναπληρώσει _5 ζωή συν το 30% της ζημιάς_ που έλαβε κατά τη μονομαχία.\n\n_+2:_ Αν η Ξιφομάχος εξοντώσει τον στόχο πριν τελειώσει η μονομαχία, θα αναπληρώσει _10 ζωή συν το 50% της ζημιάς_ που έλαβε κατά τη μονομαχία.\n\n_+3:_ Αν η Ξιφομάχος εξοντώσει τον στόχο πριν τελειώσει η μονομαχία, θα αναπληρώσει _15 ζωή συν το 65% της ζημιάς_ που έλαβε κατά τη μονομαχία.\n\n_+4:_ Αν η Ξιφομάχος εξοντώσει τον στόχο πριν τελειώσει η μονομαχία, θα αναπληρώσει _20 ζωή συν το 75% της ζημιάς_ που έλαβε κατά τη μονομαχία.
actors.hero.talent.elimination_match.title=αγώνας εξόντωσης
actors.hero.talent.elimination_match.desc=_+1:_ Αν η Ξιφομάχος προκαλέσει ξανά εντός 3 γύρων από τη λήξη της μονομαχίας, η πρόκληση θα έχει _16% μειωμένο_ κόστος φορτίου.\n\n_+2:_ Αν η Ξιφομάχος προκαλέσει ξανά εντός 3 γύρων από τη λήξη της μονομαχίας, η πρόκληση θα έχει _30% μειωμένο_ κόστος φορτίου.\n\n_+3:_ Αν η Ξιφομάχος προκαλέσει ξανά εντός 3 γύρων από τη λήξη της μονομαχίας, η πρόκληση θα έχει _40% μειωμένο_ κόστος φορτίου.\n\n_+4:_ Αν η Ξιφομάχος προκαλέσει ξανά εντός 3 γύρων από τη λήξη της μονομαχίας, η πρόκληση θα έχει _50% μειωμένο_ κόστος φορτίου.

actors.hero.talent.elemental_reach.title=στοιχειακό εύρος
actors.hero.talent.elemental_reach.desc=_+1:_ Το εύρος του στοιχειακού χτυπήματος αυξάνεται στα _5 τετράγωνα_ από 4 και το πλάτος του στις _75 μοίρες_ από 65.\n\n_+2:_ Το εύρος του στοιχειακού χτυπήματος αυξάνεται στα _6 τετράγωνα_ από 4 και το πλάτος του στις _85 μοίρες_ από 65.\n\n_+3:_ Το εύρος του στοιχειακού χτυπήματος αυξάνεται στα _7 τετράγωνα_ από 4 και το πλάτος του στις _95 μοίρες_ από 65.\n\n_+4:_ Το εύρος του στοιχειακού χτυπήματος αυξάνεται στα _8 τετράγωνα_ από 4 και το πλάτος του στις _105 μοίρες_ από 65.
actors.hero.talent.striking_force.title=κρουστική ισχύς
actors.hero.talent.striking_force.desc=_+1:_ Η ισχύς της επίδρασης του στοιχειακού χτυπήματος αυξάνεται κατά _30%._\n\n_+2:_ Η ισχύς της επίδρασης του στοιχειακού χτυπήματος αυξάνεται κατά _60%._\n\n_+3:_ Η ισχύς της επίδρασης του στοιχειακού χτυπήματος αυξάνεται κατά _90%._\n\n_+4:_ Η ισχύς της επίδρασης του στοιχειακού χτυπήματος αυξάνεται κατά _120%._
actors.hero.talent.directed_power.title=κατευθυνόμενη ισχύς
actors.hero.talent.directed_power.desc=_+1:_ Η απευθείας επίθεση του στοιχειακού χτυπήματος λαμβάνει _+30% στην ισχύ της μαγικής ενίσχυσης_ για κάθε εχθρό στην εμβέλεια του στοιχειακού χτυπήματος (μαζί με τον κύριο στόχο).\n\n_+2:_ Η απευθείας επίθεση του στοιχειακού χτυπήματος λαμβάνει _+60% στην ισχύ της μαγικής ενίσχυσης_ για κάθε εχθρό στην εμβέλεια του στοιχειακού χτυπήματος (μαζί με τον κύριο στόχο).\n\n_+3:_ Η απευθείας επίθεση του στοιχειακού χτυπήματος λαμβάνει _+90% στην ισχύ της μαγικής ενίσχυσης_ για κάθε εχθρό στην εμβέλεια του στοιχειακού χτυπήματος (μαζί με τον κύριο στόχο).\n\n_+4:_ Η απευθείας επίθεση του στοιχειακού χτυπήματος λαμβάνει _+120% στην ισχύ της μαγικής ενίσχυσης_ για κάθε εχθρό στην εμβέλεια του στοιχειακού χτυπήματος (μαζί με τον κύριο στόχο).

actors.hero.talent.feigned_retreat.title=προσποιητή υποχώρηση
actors.hero.talent.feigned_retreat.desc=_+1:_ Αν ένας εχθρός επιτεθεί στην εικόνα της Ξιφομάχου, η Ξιφομάχος αποκτά _2 γύρους_ βιασύνης.\n\n_+2:_ Αν ένας εχθρός επιτεθεί στην εικόνα της Ξιφομάχου, η Ξιφομάχος αποκτά _4 γύρους_ βιασύνης.\n\n_+3:_ Αν ένας εχθρός επιτεθεί στην εικόνα της Ξιφομάχου, η Ξιφομάχος αποκτά _6 γύρους_ βιασύνης.\n\n_+4:_ Αν ένας εχθρός επιτεθεί στην εικόνα της Ξιφομάχου, η Ξιφομάχος αποκτά _8 γύρους_ βιασύνης.
actors.hero.talent.expose_weakness.title=εκτεθειμένη αδυναμία
actors.hero.talent.expose_weakness.desc=_+1:_ Οι εχθροί που επιτίθενται στην εικόνα της Ξιφομάχου γίνονται αδύναμοι και ευάλωτοι για _2 γύρους._\n\n_+2:_ Οι εχθροί που επιτίθενται στην εικόνα της Ξιφομάχου γίνονται αδύναμοι και ευάλωτοι για _4 γύρους._\n\n_+3:_ Οι εχθροί που επιτίθενται στην εικόνα της Ξιφομάχου γίνονται αδύναμοι και ευάλωτοι για _6 γύρους._\n\n_+4:_ Οι εχθροί που επιτίθενται στην εικόνα της Ξιφομάχου γίνονται αδύναμοι και ευάλωτοι για _8 γύρους._
actors.hero.talent.counter_ability.title=Ανταποδωτική ικανότητα
actors.hero.talent.counter_ability.desc=_+1:_ Αν η Ξιφομάχος χρησιμοποιήσει οπλική ικανότητα εντός 3 γύρων από όταν έγινε επίθεση στην εικόνα της, θα αναπληρηρώσει αμέσως _0.38 φορτίο._\n\n_+2:_ Αν η Ξιφομάχος χρησιμοποιήσει οπλική ικανότητα εντός 3 γύρων από όταν έγινε επίθεση στην εικόνα της, θα αναπληρηρώσει αμέσως _0.77 φορτίο._\n\n_+3:_ Αν η Ξιφομάχος χρησιμοποιήσει οπλική ικανότητα εντός 3 γύρων από όταν έγινε επίθεση στην εικόνα της, θα αναπληρηρώσει αμέσως _1.13 φορτίο._\n\n_+4:_ Αν η Ξιφομάχος χρησιμοποιήσει οπλική ικανότητα εντός 3 γύρων από όταν έγινε επίθεση στην εικόνα της, θα αναπληρηρώσει αμέσως _1.5 φορτίο._

#cleric
actors.hero.talent.satiated_spells.title=Σιτισμένα ξόρκια
actors.hero.talent.satiated_spells.desc=_+1:_ Η κατανάλωση τροφής κάνει τον Κληρικό να λάβει _3 ασπίδα προστασίας_ την επόμενη φορά που θα εκτελέσει ξόρκι.\n\n_+2:_ Η κατανάλωση τροφής κάνει τον Κληρικό να λάβει _5 ασπίδα προστασίας_ την επόμενη φορά που θα εκτελέσει ξόρκι.
actors.hero.talent.satiated_spells.meta_desc=_If this talent is gained by a different hero_ it will instead grant shielding immediately, which will start to decay normally after 10 turns.
actors.hero.talent.holy_intuition.title=ιερή διαίσθηση
actors.hero.talent.holy_intuition.desc=_+1:_ Ο Κληρικός μπορεί να εκτελέσει την _Ιερή διαίσθηση,_ ένα ξόρκι που αποκαλύπτει αν ένα εφόδιο είναι καταραμένο με κόστος _3 φορτίου._\n\n_+2:_ Ο Κληρικός μπορεί να εκτελέσει την _Ιερή διαίσθηση,_ ένα ξόρκι που αποκαλύπτει αν ένα εφόδιο είναι καταραμένο με κόστος _2 φορτίου._
actors.hero.talent.holy_intuition.meta_desc=_If this talent is gained by a different hero_ it will instead let the hero identify the curse status on a cursed item just before equipping it, 15% of the time at +1 or 25% of the time at +2.
actors.hero.talent.searing_light.title=καυστικό φως
actors.hero.talent.searing_light.desc=_+1:_ Οι φυσιολογικές επιθέσεις του Κληρικού  εναντίον εχθρών με _Καθοδηγητικό φως_ προκαλούν _+3 ζημιά._\n\n_+2:_ Οι φυσιολογικές επιθέσεις του Κληρικού εναντίον εχθρών με _Καθοδηγητικό φως_ προκαλούν _+5 ζημιά._
actors.hero.talent.searing_light.meta_desc=_If this talent is gained by a different hero_ it will instead grant its bonus damage after a wand or artifact is used on an enemy, with a 20 turn cooldown.
actors.hero.talent.shield_of_light.title=ασπίδα φωτός
actors.hero.talent.shield_of_light.desc=_+1:_ Ο Κληρικός μπορεί να εκτελέσει το ξόρκι _Ασπίδα φωτός,_ ένα ξόρκι που εκτελείται άμεσα και του δίνει _2-4 πανοπλία_ εναντίον ενός συγκεκριμένου στόχου για 4 γύρους με κόστος 1 φορτίου.\n\n_+2:_ Ο Κληρικός μπορεί να εκτελέσει το ξόρκι _Ασπίδα φωτός,_ ένα ξόρκι που εκτελείται άμεσα και του δίνει _3-6 πανοπλία_ εναντίον ενός συγκεκριμένου στόχου για 5 γύρους με κόστος 1 φορτίου.
actors.hero.talent.shield_of_light.meta_desc=_If this talent is gained by a different hero_ it will instead reduce physical damage taken from your targeted enemy by 1, 33% of the time at +1 or 50% of the time at +2.

actors.hero.talent.enlightening_meal.title=Διαφωτιστικό γεύμα
actors.hero.talent.enlightening_meal.desc=_+1:_ Η κατανάλωση τροφής απαιτεί από τον Κληρικό 1 γύρο και του παρέχει _0.67 φορτίο_ στον ιερό του τόμο.\n\n_+2:_ Η κατανάλωση τροφής απαιτεί από τον Κληρικό 1 γύρο και του παρέχει _1 φορτίο_ στον ιερό του τόμο.
actors.hero.talent.enlightening_meal.meta_desc=_If this talent is gained by a different hero_ it will instead grant 2 turns of wand and artifact recharging at +1, or 3 turns at +2. This cannot be used to let the horn of plenty recharge itself.
actors.hero.talent.recall_inscription.title=Ανάκληση εγγραφής
actors.hero.talent.recall_inscription.refunded=Το αντικείμενό σου επιστράφηκε!
actors.hero.talent.recall_inscription.desc=_+1:_ Ο Κληρικός μπορεί να εκτελέσει το ξόρκι _Ανάκληση εγγραφής,_ ένα ξόρκι που του επιτρέπει να επαναλάβει την επίδραση του τελευταίου ρουνικού λίθου ή παπύρου που χρησιμοποίησε εντός _10 γύρων._\n\n_+2:_ Ο Κληρικός μπορεί να εκτελέσει το ξόρκι _Ανάκληση εγγραφής,_ ένα ξόρκι που του επιτρέπει να επαναλάβει την επίδραση του τελευταίου ρουνικού λίθου ή παπύρου που χρησιμοποίησε εντός _300 γύρων._\n\nΗ Ανάκληση εγγραφής δεν μπορεί να χρησιμοποιηθεί με παπύρους αναβάθμισης. Το κόστος φορτίου αυτού του ξορκιού ποικίλλει ανάλογα με το αντικείμενο που χρησιμοποιήθηκε πρόσφατα: 2 για ρουνικό λίθο, 3 για πάπυρο, 4 για εξωτικό πάπυρο. Αυτό το κόστος φορτίου διπλασιάζεται επίσης όταν χρησιμοποιείται με πάπυρο μεταστοιχείωσης ή αντικείμενα αλχημείας που πρέπει να κατασκευαστούν με πάπυρο μεταστοιχείωσης ή αναβάθμισης.
actors.hero.talent.recall_inscription.meta_desc=_If this talent is gained by a different hero_ it will instead refund any scroll or runestone 10% of the time at +1 or 15% of the time at +2. Scrolls of Upgrade are exempt from this effect.
actors.hero.talent.sunray.title=Ηλιακή ακτίνα
actors.hero.talent.sunray.desc=Ο Κληρικός μπορεί να εκτελέσει την _Ηλιακή ακτίνα,_ ένα ξόρκι που προκαλεί _4-8 ζημιά_ και τυφλώνει τον στόχο για _4 γύρους_ με κόστος 1 φορτίου.\n\nΟ Κληρικός μπορεί να εκτελέσει την _Ηλιακή ακτίνα,_ ένα ξόρκι που προκαλεί _6-12 ζημιά_ και τυφλώνει τον στόχο για _6 γύρους_ με κόστος 1 φορτίου.\n\nΑφού χτυπηθεί από το ξόρκι, δεν θα μπορεί να τυφλωθεί ξανά από αυτό. Ωστόσο, αν χτυπηθεί ξανά ενώ είναι ήδη τυφλωμένος από το ξόρκι, το φως θα γίνει συντριπτικό και θα τον παραλύσει. Η ηλιακή ακτίνα προκαλεί πάντα τη μέγιστη ζημιά σε απέθαντους και δαιμονικούς στόχους.
actors.hero.talent.sunray.meta_desc=_If this talent is gained by a different hero_ it will instead cause wands and artifacts to blind enemies for 4 turns, 15% of the time at +1 or 25% of the time at +2.
actors.hero.talent.divine_sense.title=Θεϊκή αίσθηση
actors.hero.talent.divine_sense.desc=_+1:_ Ο Κληρικός μπορεί να εκτελέσει τη _Θεϊκή αίσθηση,_ ένα ξόρκι που εκτελείται ακαριαία και του δίνει ενόραση σε _8 τετράγωνα_ για 50 γύρους με κόστος 2 φορτίου.\n\n_+2:_ Ο Κληρικός μπορεί να εκτελέσει τη _Θεϊκή αίσθηση,_ ένα ξόρκι που εκτελείται ακαριαία και του δίνει ενόραση σε _12 τετράγωνα_ για 50 γύρους με κόστος 2 φορτίου.
actors.hero.talent.divine_sense.meta_desc=_If this talent is gained by a different hero_ it will instead grant them mind vision for a brief moment after using a wand or artifact with a range of 3 tiles at +1 or 5 tiles at +2.
actors.hero.talent.bless.title=Ευλογία
actors.hero.talent.bless.desc=_+1:_ Ο Κληρικός μπορεί να εκτελέσει το ξόρκι _Ευλογία,_ το οποίο δίνει _6 γύρους ευλογίας και 10 προστασία_ όταν το κάνει στον εαυτό του ή _10 γύρους ευλογίας και 10 θεραπεία_ όταν το κάνει σε άλλον χαρακτήρα με κόστος 1 φορτίου.\n\n_+2:_ Ο Κληρικός μπορεί να εκτελέσει το ξόρκι _Ευλογία,_ το οποίο δίνει _10 γύρους ευλογίας και 10 προστασία_ όταν το κάνει στον εαυτό του ή _15 γύρους ευλογίας και 15 θεραπεία_ όταν το κάνει σε άλλον χαρακτήρα με κόστος 1 φορτίου.\n\nΗ πλεονάζουσα θεραπεία από το ξόρκι μετατρέπεται σε προστασία.
actors.hero.talent.bless.meta_desc=_If this talent is gained by a different hero_ it will instead boost accuracy and evasion for the hero and all allies by 3% at +1 or 5% at +2.

actors.hero.talent.cleanse.title=Καθαγίαση
actors.hero.talent.cleanse.desc=_+1:_ Ο Κληρικός μπορεί να εκτελέσει την _Καθαγίαση,_ ένα ξόρκι που _αφαιρεί όλες τις αρνητικές επιδράσεις_ από τον Κληρικό και κάθε κοντινό σύμμαχο και τους παρέχει _10 προστασία_ με κόστος 2 φορτίου.\n\n_+2:_ Ο Κληρικός μπορεί να εκτελέσει την _Καθαγίαση,_ ένα ξόρκι που _παρέχει 3 γύρους ανοσίας σε κάθε αρνητική επίδραση_ καθώς και _20 προστασία_ στον Κληρικό και όλους τους κοντινούς συμμάχους, με κόστος 2 φορτίου.\n\n_+3:_ Ο Κληρικός μπορεί να εκτελέσει την _Καθαγίαση,_ ένα ξόρκι που _παρέχει 5 γύρους ανοσίας σε κάθε αρνητική επίδραση_ καθώς και _30 προστασία_ στον Κληρικό και όλους τους κοντινούς συμμάχους, με κόστος 2 φορτίου.
actors.hero.talent.cleanse.meta_desc=_If this talent is gained by a different hero_ it will instead cleanse negative status effects on the hero after using a wand or artifact, 10/20/30% of the time at +1/+2/+3.
actors.hero.talent.light_reading.title=Φωτεινό ανάγνωσμα
actors.hero.talent.light_reading.desc=_+1:_ Ο Κληρικός μπορεί να χρησιμοποιήσει τον ιερό του τόμο όταν δεν είναι εξοπλισμένος, αλλά τότε επαναφορτίζεται με ταχύτητα _25%._\n\n_+2:_ Ο Κληρικός μπορεί να χρησιμοποιήσει τον ιερό του τόμο όταν δεν είναι εξοπλισμένος, αλλά τότε επαναφορτίζεται με ταχύτητα _50%._\n\n_+3:_ Ο Κληρικός μπορεί να χρησιμοποιήσει τον ιερό του τόμο όταν δεν είναι εξοπλισμένος, αλλά τότε επαναφορτίζεται με ταχύτητα _75%._
actors.hero.talent.light_reading.meta_desc=_If this talent is gained by a different hero_ it will instead increase the recharging speed of all wands by 7/13/20% at +1/+2/+3.

actors.hero.talent.holy_lance.title=Ιερή λόγχη
actors.hero.talent.holy_lance.desc=_+1:_ Ο Ιερέας μπορεί να εκτελέσει την _Ιερή λόγχη,_ ένα καταστροφικό ξόρκι που προκαλεί _30-55 ζημιά_ με κόστος 4 φορτίο.\n\n_+2:_ Ο Ιερέας μπορεί να εκτελέσει την _Ιερή λόγχη,_ ένα καταστροφικό ξόρκι που προκαλεί _45-83 ζημιά_ με κόστος 4 φορτίο.\n\n_+3:_ Ο Ιερέας μπορεί να εκτελέσει την _Ιερή λόγχη,_ ένα καταστροφικό ξόρκι που προκαλεί _60-110 ζημιά_ με κόστος 4 φορτίο.\n\nΗ Ιερή λόγχη προκαλεί πάντα τη μέγιστη ζημιά σε δαιμονικούς και απέθαντους εχθρούς. Έχει περίοδο αναπλήρωσης 30 γύρων προτού μπορέσει να εκτελεστεί ξανά.
actors.hero.talent.hallowed_ground.title=Γαία άγια
actors.hero.talent.hallowed_ground.desc=_+1:_ Ο Ιερέας μπορεί να εκτελεί το ξόρκι _Γαία άγια,_ ένα ξόρκι που αγιάζει το έδαφος σε μια _περιοχή 3x3_ για 20 γύρους, με κόστος 2 φορτίου.\n\n_+2:_ Ο Ιερέας μπορεί να εκτελεί το ξόρκι _Γαία άγια,_ ένα ξόρκι που αγιάζει το έδαφος σε μια _περιοχή 5x5_ για 20 γύρους, με κόστος 2 φορτίου.\n\n_+3:_ Ο Ιερέας μπορεί να εκτελεί το ξόρκι _Γαία άγια,_ ένα ξόρκι που αγιάζει το έδαφος σε μια _περιοχή 7x7_ για 20 γύρους, με κόστος 2 φορτίου.\n\nΤο ξόρκι θεραπεύει κατά την εκτέλεση όλους τους συμμάχους για 15 ζωή, ριζώνει για λίγο τους εχθρούς και απλώνει κοντό γρασίδι. Στη συνέχεια, θεραπεύει αργά τους συμμάχους, σακατεύει τους εχθρούς και ξεπηδά τυχαία ψηλό γρασίδι. Το αγιασμένο έδαφος παρέχει προστασία στον Ιερέα αντί για θεραπεία και καταστρέφεται από τη φωτιά.
actors.hero.talent.mnemonic_prayer.title=Μνημονική προσευχή
actors.hero.talent.mnemonic_prayer.desc=_+1:_ Ο Ιερέας μπορεί να εκτελέσει τη _Μνημονική προσευχή,_ ένα ξόρκι που επεκτείνει τις θετικές/αρνητικές επιδράσεις σε έναν σύμμαχο/εχθρό για _3 γύρους_ με κόστος 1 φορτίου.\n\n_+2:_ Ο Ιερέας μπορεί να εκτελέσει τη _Μνημονική προσευχή,_ ένα ξόρκι που επεκτείνει τις θετικές/αρνητικές επιδράσεις σε έναν σύμμαχο/εχθρό για _4 γύρους_ με κόστος 1 φορτίου.\n\n_+3:_ Ο Ιερέας μπορεί να εκτελέσει τη _Μνημονική προσευχή,_ ένα ξόρκι που επεκτείνει τις θετικές/αρνητικές επιδράσεις σε έναν σύμμαχο/εχθρό για _5 γύρους_ με κόστος 1 φορτίου.\n\nΗ Μνημονική προσευχή εκτελείται ακαριαία. Μπορεί να παρατείνει μόνο μία φορά την κάθε φάση μιας θετικής/αρνητικής επίδρασης, και δεν μπορεί να παρατείνει θετικές επιδράσεις που παρέχονται από ικανότητες πανοπλίας.

actors.hero.talent.lay_on_hands.title=ιερό άγγιγμα
actors.hero.talent.lay_on_hands.desc=_+1:_ Ο Σταυροφόρος μπορεί να κάνει το ξόρκι _ιερό άγγιγμα,_ ένα ξόρκι που θεραπεύει άμεσα έναν κοντινό χαρακτήρα για _15 ζωή,_ ή χορηγεί στον Σταυροφόρο _15 προστασία,_ με κόστος 1 φορτίο.\n\n_+2:_ Ο Σταυροφόρος μπορεί να κάνει το ξόρκι _ιερό άγγιγμα,_ ένα ξόρκι που θεραπεύει άμεσα έναν κοντινό χαρακτήρα για _20 ζωή,_ ή χορηγεί στον Σταυροφόρο _20 προστασία,_ με κόστος 1 φορτίο.\n\n_+3:_ Ο Σταυροφόρος μπορεί να κάνει το ξόρκι _ιερό άγγιγμα,_ το οποίο θεραπεύει άμεσα έναν κοντινό χαρακτήρα για _25 ζωή,_ ή χορηγεί στον Σταυροφόρο _25 προστασία,_ με κόστος 1 φορτίο.\n\nΗ πλεονάζουσα θεραπεία από αυτό το ξόρκι μετατρέπεται σε προστασία. Το Ιερό άγγιγμα μπορεί να χρησιμοποιηθεί επανειλημμένα, αλλά δεν μπορεί να εφαρμόσει περισσότερα από τρία ξόρκια προστασίας ταυτόχρονα.
actors.hero.talent.aura_of_protection.title=αύρα προστασίας
actors.hero.talent.aura_of_protection.desc=_+1:_ Ο Σταυροφόρος μπορεί να εκτελέσει το ξόρκι _Αύρα προστασίας,_ που παρέχει στον Σταυροφόρο και σε όλους τους συμμάχους εντός 2 τετραγώνων _20% αντίσταση στη ζημιά_ και την επίδραση του γλύφου πανοπλίας του σε _+50% ισχύ_ για 20 γύρους, με κόστος 2 φορτίου.\n\n_+2:_ Ο Σταυροφόρος μπορεί να κάνει το ξόρκι _Αύρα προστασίας,_ που παρέχει στον Σταυροφόρο και σε όλους τους συμμάχους εντός 2 τετραγώνων _30% αντίσταση στη ζημιά_ και την επίδραση του γλύφου της πανοπλίας του σε _+75% ισχύ_ για 20 γύρους, με κόστος 2 φορτίου.\n\n_+1:_ Ο Σταυροφόρος μπορεί να κάνει _Αύρα προστασίας,_ που παρέχει στον Σταυροφόρο και σε όλους τους συμμάχους εντός 2 τετραγώνων _40% αντίσταση στη ζημιά_ και την επίδραση του γλύφου πανοπλίας σε _+100% ισχύ_ για 20 γύρους, με κόστος 2 φορτίου.
actors.hero.talent.wall_of_light.title=τείχος φωτός
actors.hero.talent.wall_of_light.desc=_+1:_ Ο Σταυροφόρος μπορεί να εκτελέσει το _Τείχος φωτός,_ ένα ξόρκι που υλοποιεί ένα συμπαγές τείχος πλάτους _3 τετραγώνων_ μπροστά από τον Σταυροφόρο το οποίο σπρώχνει μακριά τους εχθρούς και διαρκεί για 20 γύρους, με κόστος 3 φορτίου.\n\n_+2:_ Ο Σταυροφόρος μπορεί να εκτελέσει το _Τείχος φωτός,_ ένα ξόρκι που υλοποιεί ένα συμπαγές τείχος πλάτους _5 τετραγώνων_ μπροστά από τον Σταυροφόρο το οποίο σπρώχνει μακριά τους εχθρούς και διαρκεί για 20 γύρους, με κόστος 3 φορτίου.\n\n_+3:_ Ο Σταυροφόρος μπορεί να εκτελέσει το _Τείχος φωτός,_ ένα ξόρκι που υλοποιεί ένα συμπαγές τείχος πλάτους _7 τετραγώνων_ μπροστά από τον Σταυροφόρο το οποίο σπρώχνει μακριά τους εχθρούς και διαρκεί για 20 γύρους, με κόστος 3 φορτίου.\n\nΤο τείχος μπορεί να τοποθετηθεί είτε κάθετα είτε διαγώνια. Μόνο ένα τείχος μπορεί να είναι ενεργό τη φορά

actors.hero.talent.divine_intervention.title=θεϊκή παρέμβαση
actors.hero.talent.divine_intervention.desc=_+1:_ Ενώ βρίσκεται στην Εξυψωμένη μορφή, ο Κληρικός μπορεί να εκτελέσει τη _Θεϊκή παρέμβαση_ που ανεβάζει την ασπίδα προστασίας του Κληρικού και όλων των συμμάχων του έως το _150_ και παρατείνει την Εξυψωμένη μορφή κατά _3 γύρους._\n\n_+2:_ Ενώ βρίσκεται στην Εξυψωμένη μορφή, ο Κληρικός μπορεί να εκτελέσει τη _Θεϊκή παρέμβαση_ που ανεβάζει την ασπίδα προστασίας του Κληρικού και όλων των συμμάχων του έως το _200_ και παρατείνει την Εξυψωμένη μορφή κατά _4 γύρους._\n\n_+3:_ Ενώ βρίσκεται στην Εξυψωμένη μορφή, ο Κληρικός μπορεί να εκτελέσει τη _Θεϊκή παρέμβαση_ που ανεβάζει την ασπίδα προστασίας του Κληρικού και όλων των συμμάχων του έως το _250_ και παρατείνει την Εξυψωμένη μορφή κατά _5 γύρους._\n\n_+4:_ Ενώ βρίσκεται στην Εξυψωμένη μορφή, ο Κληρικός μπορεί να εκτελέσει τη _Θεϊκή παρέμβαση_ που ανεβάζει την ασπίδα προστασίας του Κληρικού και όλων των συμμάχων του έως το _300_ και παρατείνει την Εξυψωμένη μορφή κατά _6 γύρους._\n\nΗ Θεϊκή παρέμβαση κοστίζει 5 φορτίο και μπορεί να γίνει μόνο μία φορά στην ίδια Εξυψωμένη μορφή.
actors.hero.talent.judgement.title=τελική κρίση
actors.hero.talent.judgement.desc=_+1:_ Ενώ βρίσκεται στην εξυψωμένη μορφή ο Κληρικός μπορεί να εκτελέσει την _Τελική κρίση,_ που προκαλεί _10-20 ζημιά_ σε όλους τους ορατούς εχθρούς.\n\n_+2:_ Ενώ βρίσκεται στην εξυψωμένη μορφή ο Κληρικός μπορεί να εκτελέσει την _Τελική κρίση,_ που προκαλεί _15-30 ζημιά_ σε όλους τους ορατούς εχθρούς.\n\n_+3:_ Ενώ βρίσκεται στην εξυψωμένη μορφή ο Κληρικός μπορεί να εκτελέσει την _Τελική κρίση,_ που προκαλεί _20-40 ζημιά_ σε όλους τους ορατούς εχθρούς.\n\n_+4:_ Ενώ βρίσκεται στην εξυψωμένη μορφή ο Κληρικός μπορεί να εκτελέσει την _Τελική κρίση,_ που προκαλεί _25-50 ζημιά_ σε όλους τους ορατούς εχθρούς.\n\nΗ τελική κρίση απαιτεί 3 φορτίο. Προκαλεί +33% επιπλέον ζημιά για κάθε ξόρκι που έχει εκτελέσει ο Κληρικός από όταν μπήκε στην εξυψωμένη μορφή ή από την τελευταία φορά που εκτέλεσε την τελική κρίση.
actors.hero.talent.flash.title=διακτινισμός
actors.hero.talent.flash.desc=_+1:_ Στην εξυψωμένη μορφή, ο Κληρικός μπορεί να εκτελέσει Διακτινισμό για να τηλεμεταφερθεί έως και _3 τετράγωνα_ μακριά.\n\n_+2:_ Στην εξυψωμένη μορφή, ο Κληρικός μπορεί να εκτελέσει Διακτινισμό για να τηλεμεταφερθεί έως και _4 τετράγωνα_ μακριά.\n\n_+3:_ Στην εξυψωμένη μορφή, ο Κληρικός μπορεί να εκτελέσει Διακτινισμό για να τηλεμεταφερθεί έως και _5 τετράγωνα_ μακριά.\n\n_+4:_ Στην εξυψωμένη μορφή, ο Κληρικός μπορεί να εκτελέσει Διακτινισμό για να τηλεμεταφερθεί έως και _6 τετράγωνα_ μακριά.\n\nΟ Διακτινισμός κοστίζει αρχικά 2 φορτία, και έπειτα 1 επιπλέον φορτιο για κάθε χρήση του στην ίδια εξυψωμένη μορφή.

actors.hero.talent.body_form.title=σωματική μορφή
actors.hero.talent.body_form.desc=Ο Κληρικός μπορεί να εκτελέσει τη _Σωματική μορφή,_ η οποία κάνει την Τριάδα να υιοθετήσει τη δύναμη μιας μαγικής ενίσχυσης ή ενός γλύφου που ο Κληρικός έχει αναγνωρίσει σε αυτό το παιχνίδι με κόστος 2 φορτίου.\n\n_+1:_ Όταν χρησιμοποιείται η Τριάδα, ο Κληρικός αποκτά την επιλεγμένη επίδραση για _20 γύρους._\n\n_+2:_ Όταν χρησιμοποιείται η Τριάδα, ο Κληρικός αποκτά την επιλεγμένη επίδραση για _27 γύρους._\n\n_+3:_ Όταν χρησιμοποιείται η Τριάδα, ο Κληρικός αποκτά την επιλεγμένη επίδραση για _33 γύρους._\n\n_+4:_Όταν χρησιμοποιείται η Τριάδα, ο Κληρικός αποκτά την επιλεγμένη επίδραση για _40 γύρους._\n\nΗ Τριάδα μπορεί να υιοθετήσει μόνο μία σωματική επίδραση την φορά. Το κόστος φορτίου της Τριάδας είναι υψηλότερο αν ο επιλεγμένος γλύφος είναι σπάνιος και ισχυρός.
actors.hero.talent.mind_form.title=νοητική μορφή
actors.hero.talent.mind_form.desc=Ο Κληρικός μπορεί να εκτελέσει τη _Νοητική μορφή,_ η οποία κάνει την Τριάδα να υιοθετήσει τη δύναμη ενός ραβδιού ή όπλου ρίψης που ο Κληρικός έχει χρησιμοποιήσει σε αυτό το παιχνίδι, με κόστος 3 φορτίου.\n\n_+1:_ Όταν χρησιμοποιείται η Τριάδα, ο Κληρικός χρησιμοποιεί την επίδραση εξαπόλυσης ή ρίψης του επιλεγμένου αντικειμένου σαν να ήταν _+3._\n\n_+2:_ Όταν χρησιμοποιείται η Τριάδα, ο Κληρικός χρησιμοποιεί την επίδραση εξαπόλυσης ή ρίψης του επιλεγμένου αντικειμένου σαν να ήταν _+4._\n\n_+3:_ Όταν χρησιμοποιείται η Τριάδα, ο Κληρικός χρησιμοποιεί την επίδραση εξαπόλυσης ή ρίψης του επιλεγμένου αντικειμένου σαν να ήταν _+5._\n\n_+4:_ Όταν χρησιμοποιείται η Τριάδα, ο Κληρικός χρησιμοποιεί την επίδραση εξαπόλυσης ή ρίψης του επιλεγμένου αντικειμένου σαν να ήταν _+6._\n\nΗ Τριάδα μπορεί να υιοθετήσει μόνο μία νοητική επίδραση τη φορά.
actors.hero.talent.spirit_form.title=πνευματική μορφή
actors.hero.talent.spirit_form.desc=Ο Κληρικός μπορεί να εκτελέσει την _Πνευματική μορφή,_ η οποία κάνει την Τριάδα να υιοθετήσει την ισχύ ενός δαχτυλιδιού ή τεχνουργήματος που ο Κληρικός έχει αναγνωρίσει σε αυτό το παιχνίδι (εκτός από τον ιερό τόμο), με κόστος 4 φορτίου.\n\n_+1:_ Όταν χρησιμοποιείται η Τριάδα, ο Κληρικός θα αποκτήσει την επίδραση ενός δαχτυλιδιού στο _+1_ για 20 γύρους, ή θα ενεργοποιήσει την επίδραση ενός τεχνουργήματος στο _+4._\n\n_+2:_ Όταν χρησιμοποιείται η Τριάδα, ο Κληρικός θα αποκτήσει την επίδραση ενός δαχτυλιδιού στο _+2_ για 20 γύρους, ή θα ενεργοποιήσει την επίδραση ενός τεχνουργήματος στο _+6._\n\n_+3:_ Όταν χρησιμοποιείται η Τριάδα, ο Κληρικός θα αποκτήσει την επίδραση ενός δαχτυλιδιού στο _+3_ για 20 γύρους ή θα ενεργοποιήσει την επίδραση ενός τεχνουργήματος στο _+8._\n\n_+4:_ Όταν χρησιμοποιείται η Τριάδα, ο Κληρικός θα αποκτήσει την επίδραση ενός δαχτυλιδιού στο _+4_ για 20 γύρους ή θα ενεργοποιήσει την επίδραση ενός τεχνουργήματος στο _+10._\n\nΗ Τριάδα μπορεί να υιοθετήσει μόνο μια πνευματική επίδραση την φορά. Ορισμένα τεχνουργήματα έχουν διαφορετικές επιδράσεις ή κόστος φορτίου πανοπλίας όταν ενεργοποιούνται από την Τριάδα.

actors.hero.talent.beaming_ray.title=ακτίνα τηλεμεταφοράς
actors.hero.talent.beaming_ray.desc=The Cleric can cast _Beaming Ray_ from an empowered ally at the cost of 1 charge. This ray can go through walls and teleports the ally to a targeted location. If an enemy is at that location, the ally appears next to the enemy and will target them. Beaming Ray can even teleport normally immobile allies, but has half range when doing so.\n\n_+1:_ Beaming Ray has a max range of _4 tiles,_ and increases Power of Many's bonus to _+35% damage_ against the closest enemy for 10 turns.\n\n_+2:_ Beaming Ray has a max range of _8 tiles,_ and increases Power of Many's bonus to _+40% damage_ against the closest enemy for 10 turns.\n\n_+3:_ Beaming Ray has a max range of _12 tiles,_ and increases Power of Many's bonus to _+45% damage_ against the closest enemy for 10 turns.\n\n_+4:_ Beaming Ray has a max range of _16 tiles,_ and increases Power of Many's bonus to _+50% damage_ against the closest enemy for 10 turns.
actors.hero.talent.life_link.title=σύνδεσμος ζωής
actors.hero.talent.life_link.desc=The Cleric can cast _Life Link_ between themselves and an empowered ally at the cost of 2 charges. This spell causes damage to be shared between the Cleric and their ally, and causes beneficial cleric spells of tier 3 or lower to apply to both if either is being affected.\n\n_+1:_ Life Link lasts for _10 turns_ and increases Power of Many's bonus to _-35% damage taken._\n\n_+2:_ Life Link lasts for _13 turns_ and increases Power of Many's bonus to _-40% damage taken._\n\n_+3:_ Life Link lasts for _17 turns_ and increases Power of Many's bonus to _-45% damage taken._\n\n_+4:_ Life Link lasts for _20 turns_ and increases Power of Many's bonus to _-50% damage taken._
actors.hero.talent.stasis.title=στασιμότητα
actors.hero.talent.stasis.desc=The Cleric can cast _Stasis_ on an empowered ally at the cost of 2 charges. Stasis temporarily removes the ally from the dungeon and preserves the remaining time on all buffs, including Power of Many. The ally will reappear next to you when the effect ends. Stasis can be re-cast instantly and at no cost to end the effect early. Stasis works on immobile allies, but cannot move them between dungeon floors.\n\n_+1:_ Stasis lasts for a max of _60 turns._\n\n_+2:_ Stasis lasts for a max of _90 turns._\n\n_+3:_ Stasis lasts for a max of _120 turns._\n\n_+4:_ Stasis lasts for a max of _150 turns._\n\nThe Cleric can also cast Beaming Ray when an ally is in stasis to resummon them, or cast Life Link to pre-emptively apply its effect. Allies do not benefit from Life Link while in stasis however.


#universal
actors.hero.talent.heroic_energy.title=ηρωική ενέργεια
actors.hero.talent.heroic_energy.rat_title=αρουρωική ενέργεια
actors.hero.talent.heroic_energy.desc=_+1:_ Η ικανότητα της ηρωικής πανοπλίας έχει _12% μειωμένο_ κόστος φορτίου.\n\n_+2:_ Η ικανότητα της ηρωικής πανοπλίας έχει _23% μειωμένο_ κόστος φορτίου.\n\n_+3:_ Η ικανότητα της ηρωικής πανοπλίας έχει _32% μειωμένο_ κόστος φορτίου.\n\n_+4:_ Η ικανότητα της ηρωικής πανοπλίας έχει _40% μειωμένο_ κόστος φορτίου.

actors.hero.talent.ratsistance.title=αρουραιομαχία
actors.hero.talent.ratsistance.desc=_+1:_ Οι επιθετικοί αρουραιοποιημένοι εχθροί προκαλούν _-10% ζημιά._\n\n_+2:_ Οι επιθετικοί αρουραιοποιημένοι εχθροί προκαλούν _-19% ζημιά._\n\n_+3:_ Οι επιθετικοί αρουραιοποιημένοι εχθροί προκαλούν _-27% ζημιά._\n\n_+4:_ Οι επιθετικοί αρουραιοποιημένοι εχθροί προκαλούν _-35% ζημιά._
actors.hero.talent.ratlomacy.title=αρουραιοφιλία
actors.hero.talent.ratlomacy.desc=_+1:_ Η χρήση αρουραιοποίησης σε ήδη αρουραιοποιημένο εχθρό τον κάνει φιλικό και μονιμοποιεί τη μεταμόρφωση.\n\n_+2:_ Η χρήση αρουραιοποίησης σε ήδη αρουραιοποιημένο εχθρό τον κάνει φιλικό, μονιμοποιεί τη μεταμόρφωση και του δίνει _2 γύρους_ αδρεναλίνης.\n\n_+3:_ Η χρήση αρουραιοποίησης σε ήδη αρουραιοποιημένο εχθρό τον κάνει φιλικό, μονιμοποιεί τη μεταμόρφωση και του δίνει _4 γύρους_ αδρεναλίνης.\n\n_+4:_ Η χρήση αρουραιοποίησης σε ήδη αρουραιοποιημένο εχθρό τον κάνει φιλικό, μονιμοποιεί τη μεταμόρφωση και του δίνει _6 γύρους_ αδρεναλίνης.
actors.hero.talent.ratforcements.title=φανταρουραίοι
actors.hero.talent.ratforcements.desc=_+1:_ Με τη χρήση της αρουραιοποίησης στον εαυτό σου, _επικαλείται 1_ συμμαχικός μαρσιποφόρος αρουραίος δίπλα σου.\n\n_+2:_ Με τη χρήση της αρουραιοποίησης στον εαυτό σου, _επικαλούνται 2_ συμμαχικοί μαρσιποφόροι αρουραίοι δίπλα σου.\n\n_+3:_ Με τη χρήση της αρουραιοποίησης στον εαυτό σου, _επικαλούνται 3_ συμμαχικοί μαρσιποφόροι αρουραίοι δίπλα σου.\n\n_+4:_ Με τη χρήση της αρουραιοποίησης στον εαυτό σου, _επικαλούνται 4_ συμμαχικοί μαρσιποφόροι αρουραίοι δίπλα σου.



###npcs
actors.mobs.npcs.blacksmith.name=τρολ σιδηρουργός
actors.mobs.npcs.blacksmith.intro_quest_warrior=Ε, άνθρωπε! Σε κόβω για σκληρό καρύδι.
actors.mobs.npcs.blacksmith.intro_quest_mage=Ε, άνθρωπε! Σε κόβω για ξεφτέρι.
actors.mobs.npcs.blacksmith.intro_quest_rogue=Ε, άνθρωπε! Σε κόβω για πονηρή αλεπού.
actors.mobs.npcs.blacksmith.intro_quest_huntress=Ε, άνθρωπε! Σε κόβω για γρήγορο πιστόλι.
actors.mobs.npcs.blacksmith.intro_quest_duelist=Ε, άνθρωπε! Σε κόβω για θαρραλέα ψυχή.
actors.mobs.npcs.blacksmith.intro_quest_cleric=Ε, άνθρωπε! Σε κόβω για σημαντική φιγούρα.
actors.mobs.npcs.blacksmith.intro_quest_start=Θες να κάνεις ένα καλό; Έλα, έχω κάτι για σένα. Τούτο 'δω το εργαστήρι το 'φτιαξα πάνω από ένα παλιό ορυχείο, να εδώ χάμω απ' τη σκάλα είναι. Πάρε τούτη την αξίνα και φέρε λίγα _ψήγματα σκοτεινού χρυσού. 40 κομμάτια_ είναι καλά. Η πέτρα 'κει κάτω είναι ωραία και μαλακή, άρα _με λίγο κόπο θα μπορείς να σκάβεις μέσα απ' τους τοίχους._\n\nΤι εννοείς πώς θα σε πληρώσω; Παλιοτσιφούτ...\n\nΚαλά, καλά... μπορώ να σου κάνω λίγη σιδηρουργική. Να ευχαριστείς την τύχη σου, είμαι ο μόνος σιδεράς εδώ γύρω.
actors.mobs.npcs.blacksmith.intro_quest_crystal=Το νου σου, είναι επικίνδυνο το ορυχείο για ανθρωπάκους σαν του λόγου σου. Έχει παρατηθεί από καιρό και έχει αρχίσει και φυτρώνει ένας σκασμός κρύσταλλοι. Είναι λαμπεροί αλλά και πολύ εύθραυστοι και δεν αξίζουν τίποτα... έχουν και κάτι μαγικά πράγματα που τα προστατεύουν. Είναι δυνατά αυτά, _το νου σου πού σκάβεις_ μη τους τραβήξεις την προσοχή.\n\nΚάπου έχει κι έναν _γιγάντιο κρύσταλλο_ εκεί πέρα. Είναι πολύ σκληρός αυτός, ετοιμάσου για μάχη άμα αρχίσεις και τον κοπανάς. Βάζω στοίχημα πως άμα τον σπάσεις θα αργούν οι άλλοι κρύσταλλοι να φυτρώνουν... θα σε πληρώσω παραπάνω άμα το κάνεις.
actors.mobs.npcs.blacksmith.intro_quest_gnoll=Το νου σου, είναι επικίνδυνο το ορυχείο για ανθρωπάκους σαν του λόγου σου. Μερικά γκνολ θέλουν κι αυτά τον χρυσό και έχουν ρημάξει τον τόπο. Είναι ηλίθια όντα, και έτσι η εξόρυξη που κάνουν έχει προκαλέσει καταρρεύσεις παντού. Πρέπει να σκάψεις μέσα από αυτό, οπότε _ψάξε για βράχους που έχουν διαταραχθεί πρόσφατα._\n\nΜου φαίνεται πως ένα γκνολ κάνει τη μεγαλύτερη ζημιά, μάλλον ένας _γεωμάντης σαμάνος_ ή ξέρω 'γω τι. Θα σε πληρώσω παραπάνω άμα το βρεις και το σκοτώσεις, αλλά σίγουρα θα αντισταθεί.
actors.mobs.npcs.blacksmith.intro_quest_fungi=Το νου σου, είναι επικίνδυνο το ορυχείο για ανθρωπάκους σαν του λόγου σου. Έχει ένα πράμα σαν τερατώδη μύκητα που μεγαλώνει εκεί χάμω. Έχει κάτι μανιτάρια φρουρούς που την έβαψες άμα σε δουν... πάλι καλά να λες που δεν μπορούν να σηκωθούν για να σε κυνηγήσουν.\n\nΘα σε πληρώσω παραπάνω άμα εξοντώσεις το _μεγαλύτερο μανιτάρι,_ αλλά θα ζοριστείς πολύ. Είναι ενωμένο με κάτι κόμβους μυκηλίου κρυμμένους μες στους τοίχους. Θα πρέπει να γκρεμίσεις τους περισσότερους για να του κάνεις καλή ζημιά.
actors.mobs.npcs.blacksmith.reminder=Όλο θα μου τρως την ώρα; Εκεί πέρα είναι η είσοδος του ορυχείου.
actors.mobs.npcs.blacksmith.reminder_crystal=Φέρε όσο πιο πολύ χρυσό μπορείς, και αν μπορείς σπάσε και τον μεγάλο κρύσταλλο.
actors.mobs.npcs.blacksmith.reminder_gnoll=Φέρε όσο πιο πολύ χρυσό μπορείς, και αν μπορείς σκότωσε και τον γκνολ γεωμάντη.
actors.mobs.npcs.blacksmith.reminder_fungi=Φέρε όσο πιο πολύ χρυσό μπορείς, και αν μπορείς σκότωσε και το γιγάντιο μανιτάρι.
actors.mobs.npcs.blacksmith.lost_pick=Με δουλεύεις; Πού είναι η αξίνα μου;!
actors.mobs.npcs.blacksmith.quest_start_prompt=Πας να κατέβεις; Κοίτα να 'χεις χώρο για τον χρυσό.\n\n_Μόνο μια φορά θα σε αφήσω να πας εκεί χάμω!_
actors.mobs.npcs.blacksmith.enter_yes=Φύγαμε
actors.mobs.npcs.blacksmith.enter_no=Όχι ακόμη
actors.mobs.npcs.blacksmith.exit_warn_none=Τέλειωσες κιόλας; Δεν πήρες και τίποτα από χρυσό! Θα μπορούσες να φέρεις _40 κομμάτια._\n\n_Να ξέρεις ότι δε σε αφήνω να ξαναμπείς άμα ανέβεις._
actors.mobs.npcs.blacksmith.exit_warn_low=Τέλειωσες κιόλας; Δε βλέπω να πήρες και πολύ χρυσό. Θα μπορούσες να φέρεις _40 κομμάτια._\n\n_Να ξέρεις ότι δε σε αφήνω να ξαναμπείς άμα ανέβεις._
actors.mobs.npcs.blacksmith.exit_warn_med=Τέλειωσες; Όλο και κάτι πήρες, αλλά έχει πολύ ακόμα χρυσό στο ορυχείο. Θα μπορούσες να φέρεις _40 κομμάτια._\n\n_Να ξέρεις ότι δε σε αφήνω να ξαναμπείς άμα ανέβεις._
actors.mobs.npcs.blacksmith.exit_warn_high=Τέλειωσες; Πήρες καλή ποσότητα χρυσού, αλλά λίγος ακόμα καλός θα 'ταν. Θα μπορούσες να φέρεις _40 κομμάτια._\n\n_Να ξέρεις ότι δε σε αφήνω να ξαναμπείς άμα ανέβεις._
actors.mobs.npcs.blacksmith.exit_warn_full=Τέλειωσες; Πήρες μπόλικο χρυσό, μόνο κοίτα μην αφήσεις πράματα πίσω σου.\n\n_Να ξέρεις ότι δε σε αφήνω να ξαναμπείς άμα ανέβεις._
actors.mobs.npcs.blacksmith.exit_warn_crystal=Ο γιγάντιος κρύσταλλος ακόμα εκεί χάμω είναι. Θα σε πληρώσω παραπάνω αν τον καταστρέψεις.
actors.mobs.npcs.blacksmith.exit_warn_gnoll=Ο γκνολ γεωμάντης ακόμα εκεί χάμω είναι. Θα σε πληρώσω παραπάνω αν τον σκοτώσεις.
actors.mobs.npcs.blacksmith.exit_warn_fungi=Το γιγάντιο μανιτάρι ακόμα εκεί χάμω είναι. Θα σε πληρώσω παραπάνω αν το σκοτώσεις.
actors.mobs.npcs.blacksmith.exit_yes=Τελείωσα
actors.mobs.npcs.blacksmith.exit_no=Όχι ακόμα
actors.mobs.npcs.blacksmith.get_lost=Έχω δουλειά. Φεύγα!
actors.mobs.npcs.blacksmith.entrance_blocked=Ο δρόμος προς τα κάτω είναι μπλοκαρισμένος.
actors.mobs.npcs.blacksmith.cant_enter_old=Αυτή η περιοχή δεν είναι προσβάσιμη σε αυτό το παιχνίδι. Ξεκίνα νέο παιχνίδι για να δοκιμάσεις τη νέα αποστολή!
actors.mobs.npcs.blacksmith.def_verb=Απόκρουση
actors.mobs.npcs.blacksmith.desc=Αυτός ο τρολ σιδηρουργός μοιάζει όπως όλα τα τρολ: είναι ψηλόλιγνος και το δέρμα του παρομοιάζει πέτρα, τόσο σε χρώμα όσο και σε υφή. Ο σιδηρουργός μαστορεύει με δυσανάλογα μικρά εργαλεία.

actors.mobs.npcs.ghost.name=θλιμμένο φάντασμα
actors.mobs.npcs.ghost.rat_1=%s... Ελπίζω να είσαι καλά... Κάποτε ήμουν σαν εσένα... είχα δύναμη και σθένος... μα με σκότωσε ένα σιχαμερό κτήνος... Δεν μπορώ να φύγω... όχι πριν πάρω την εκδίκησή μου... Σκότωσε τον _βρομερό αρουραίο_ που μου στέρησε τη ζωή...\n\nΠαραμονεύει σε αυτό το επίπεδο... αναδίδοντας παντού δυσωδία... _Πρόσεχε το νέφος δυσοσμίας και το καυστικό του δάγκωμα... το οξύ διαλύεται στο νερό..._
actors.mobs.npcs.ghost.rat_2=Σε παρακαλώ... βοήθησέ με... Σκότωσε το έκτρωμα...\n\n_Πάλεψέ το κοντά σε νερό... Απόφυγε τη μπόχα..._
actors.mobs.npcs.ghost.gnoll_1=%s... Ελπίζω να είσαι καλά... Κάποτε ήμουν σαν εσένα... είχα δύναμη και σθένος... μέχρι που με σκότωσε ένας ύπουλος εχθρός... Δεν μπορώ να φύγω... όχι πριν πάρω την εκδίκησή μου... Σκότωσε το _υποχθόνιο γκνολ_ που μου στέρησε τη ζωή...\n\nΔεν είναι σαν τα άλλα γκνολ... Κρύβεται και χρησιμοποιεί όπλα ρίψης... _Πρόσεχε τα δηλητηριώδη και τα εμπρηστικά του βέλη... μην επιτίθεσαι από απόσταση..._
actors.mobs.npcs.ghost.gnoll_2=Σε παρακαλώ... βοήθησέ με... Σκότωσε το υποχθόνιο γκνολ...\n\n_Μην το αφήσεις να σε χτυπήσει... Πήγαινε κοντά του..._
actors.mobs.npcs.ghost.crab_1=%s... Ελπίζω να είσαι καλά... Κάποτε ήμουν σαν εσένα... είχα δύναμη και σθένος... μα με σκότωσε ένα αρχαίο πλάσμα... Δεν μπορώ να φύγω... όχι πριν πάρω την εκδίκησή μου... Σκότωσε τον _γιγάντιο κάβουρα_ που μου στέρησε τη ζωή...\n\nΕίναι αφύσικα γέρικος... με μια τεράστια δαγκάνα και παχύ καύκαλο... _Πρόσεχε τη δαγκάνα του... πρέπει να τον ξαφνιάσεις, αλλιώς θα αποκρούει με αυτήν..._
actors.mobs.npcs.ghost.crab_2=Σε παρακαλώ... βοήθησέ με... Σκότωσε  το οστρακοειδές...\n\n_Θα αποκρούει πάντοτε... όποτε σε βλέπει..._
actors.mobs.npcs.ghost.find_me=Σε ευχαριστώ... έλα να με βρεις...
actors.mobs.npcs.ghost.desc=Το φάντασμα είναι μετά βίας ορατό. Μοιάζει με άμορφο σημάδι αχνού φωτός με θλιμμένο πρόσωπο.

actors.mobs.npcs.imp.name=φιλόδοξο δαιμόνιο
actors.mobs.npcs.imp.intro=Είσαι απ' αυτούς τους εξερευνητές; Λατρεύω τους εξερευνητές! Μπορείς πάντα να βασιστείς επάνω τους όταν θέλεις κάτι να εξοντωθεί. Έχω δίκιο; Έναντι αμοιβής προφανώς ;-)
actors.mobs.npcs.imp.golems_1=Στην περίπτωσή μου έχω κάποια _γκόλεμ_ που θέλω να σκοτωθούν. Θα ξεκινήσω, βλέπεις, μια μικρή επιχείρηση εδώ... Αλλά αυτά τα ηλίθια γκόλεμ μού μπαίνουν εμπόδιο! Και πού να συνεννοηθείς με κινούμενα ντουβάρια... την κατάρα μου να' χουν! Γι' αυτό, σκότωσε σε παρακαλώ... ας πούμε _4 απ' αυτά_ και μια ανταμοιβή θα γίνει δική σου.
actors.mobs.npcs.imp.monks_1=Στην περίπτωσή μου έχω κάποιους _μοναχούς_ που θέλω να σκοτωθούν. Θα ξεκινήσω, βλέπεις, μια μικρή επιχείρηση εδώ... Αλλά αυτοί οι παλαβοί όχι μόνο δεν αγοράζουν τίποτα, αλλά θα τρομάξουν και τους πελάτες μου. Γι' αυτό σκότωσε σε παρακαλώ... ας πούμε _5 απ' αυτούς_ και μια ανταμοιβή θα γίνει δική σου.
actors.mobs.npcs.imp.golems_2=Πώς πάει το σαφάρι σου στα γκόλεμ; Μόνο μη ξεχάσεις να μαζέψεις και τα εμβλήματα.
actors.mobs.npcs.imp.monks_2=Α, ζεις ακόμα! Το ήξερα ότι το κουνγκ φου σου είναι καλύτερο ;-) Μόνο μη ξεχάσεις να μαζέψεις και τα εμβλήματα.
actors.mobs.npcs.imp.cya= %s! Τα λέμε!
actors.mobs.npcs.imp.hey=%s! Πσστ!
actors.mobs.npcs.imp.desc=Τα δαιμόνια είναι κατώτεροι δαίμονες. Δεν είναι φημισμένα για τη δύναμη ή το μαγικό τους ταλέντο, αλλά είναι αρκετά έξυπνα και κοινωνικά. Πολλά δαιμόνια προτιμούν να ζουν ανάμεσα σε μη δαίμονες.

actors.mobs.npcs.impshopkeeper.name=φιλόδοξο δαιμόνιο
actors.mobs.npcs.impshopkeeper.greetings=%s! Γεια σου!
actors.mobs.npcs.impshopkeeper.greetings_ascent=%s! Τι έκανες;! Ψώνισε γρήγορα... πρέπει να φύγω από εδώ!
actors.mobs.npcs.impshopkeeper.thief=Νόμιζα ότι μπορούσα να σε εμπιστευτώ!
actors.mobs.npcs.impshopkeeper.buyback=Το δαιμόνιο σου επιστρέφει χαρούμενα το αντικείμενο.
actors.mobs.npcs.impshopkeeper.desc=Το δαιμόνιο έχει στήσει ένα μικρό κατάστημα στο άκρο των ενδότερων αιθουσών. Είναι ωραίο να βλέπεις ένα φιλικό πρόσωπο, αλλά οι τιμές του δεν φαίνονται το ίδιο φιλικές.

actors.mobs.npcs.mirrorimage.name=κατοπτρική εικόνα
actors.mobs.npcs.mirrorimage.desc=Αυτή η ψευδαίσθηση έχει μεγάλη ομοιότητα με εσένα. Φαίνεται πως φέρει και τον ίδιο οπλισμό.\n\nΟι κατοπτρικές εικόνες θα αναζητούν και θα επιτίθενται στους εχθρούς με το αντιγραμμένο όπλο τους. Το όπλο συμπεριφέρεται όπως και το δικό σου, αλλά προκαλεί λιγότερη ζημιά. Ξεκινούν σχεδόν αόρατες, αλλά πρέπει να πάρουν μια πιο ορατή μορφή για να μπορέσουν να επιτεθούν.\n\nΑν και μπορεί να έχουν αξιόλογη επιθετική δύναμη, η ανθεκτικότητά τους είναι μηδενική: θα εξαφανιστούν αμέσως μόλις λάβουν ζημιά.
actors.mobs.npcs.mirrorimage.discover_hint=Αυτόν τον χαρακτήρα τον βρίσκεις με έναν συγκεκριμένο πάπυρο.

actors.mobs.npcs.npc.discover_hint=Αυτόν τον χαρακτήρα τον βρίσκεις σε μια συγκεκριμένη τοποθεσία της κατακόμβης.

actors.mobs.npcs.prismaticimage.name=πρισματική εικόνα
actors.mobs.npcs.prismaticimage.desc=Αυτή η λαμπερή ψευδαίσθηση έχει μεγάλη ομοιότητα με εσένα. Φαίνεται να κρατά το όπλο και την πανοπλία σου.\n\nΟι πρισματικές εικόνες προσπαθούν να εντοπίσουν και να προσελκύσουν τους εχθρούς σου, χρησιμοποιώντας την αυξημένη άμυνα και ζωή τους για να σε προστατέψουν. Αν και δεν έχουν την επιθετική ισχύ των κατοπτρικών εικόνων, έχουν αναβαθμισμένη ανθεκτικότητα και λαμβάνουν τα οφέλη της πανοπλίας σου.\n\nΌταν πέφτουν σε 0 ζωή, οι πρισματικές εικόνες εξασθενούν σε διάστημα αρκετών γύρων. Μπορούν ακόμη να θεραπευθούν μέσα σε αυτό το διάστημα. Όταν δεν υπάρχουν εχθροί, εξασθενούν κι επιστρέφουν στον αφέντη τους.
actors.mobs.npcs.prismaticimage.discover_hint=Αυτόν τον χαρακτήρα τον βρίσκεις με έναν συγκεκριμένο πάπυρο.

actors.mobs.npcs.ratking.name=αρουραίος βασιλιάς
actors.mobs.npcs.ratking.not_sleeping=Δεν κοιμάμαι!
actors.mobs.npcs.ratking.what_is_it=Τι θες; Δεν έχω χρόνο για ανοησίες. Το βασίλειό μου δε θα κυβερνηθεί από μόνο του!
actors.mobs.npcs.ratking.confused=Τι... πού είμαι; Το βασίλειό μου με χρειάζεται!
actors.mobs.npcs.ratking.crown_clothes=Βάλε ρούχα πάνω σου! Δεν είσαι σε θέση να απευθυνθείς στη βασιλεία!
actors.mobs.npcs.ratking.crown_desc=Ααα! Για μένα είναι αυτό το στέμμα!; Είναι πολύ πιο γυαλιστερό από το δικό μου... θα το δεχτώ ευχαρίστως!\n\nΛοιπόν, έχω να σου προσφέρω μια ανταμοιβή γι' αυτό το στέμμα. Μία εξωπραγματική δύναμη αντάξια μιας ηρωικής ψυχής όπως εσύ! Θα το ήθελες αυτό;
actors.mobs.npcs.ratking.crown_yes=Βεβαίως!
actors.mobs.npcs.ratking.crown_info=Πες μου περισσότερα πρώτα.
actors.mobs.npcs.ratking.crown_no=Καλύτερα όχι...
actors.mobs.npcs.ratking.crown_thankyou=Χε χε χε, σε ευχαριστώ! Τώρα πήγαινε, κάνε τον βασιλιά σου υπερήφανο!
actors.mobs.npcs.ratking.crown_fine=Καλά! Δεν το ήθελα έτσι κι αλλιώς...
actors.mobs.npcs.ratking.crown_after=Σου αρέσει η νέα σου πανοπλία; Δεν έχει επιστροφές!
actors.mobs.npcs.ratking.desc_crown=Αυτός ο αρουραίος είναι λίγο μεγαλύτερος από έναν κανονικό μαρσιποφόρο αρουραίο. Φορά το στέμμα του νάνου βασιλιά στο κεφάλι του.
actors.mobs.npcs.ratking.desc_birthday=Αυτός ο αρουραίος είναι λίγο μεγαλύτερος από έναν κοινό μαρσιποφόρο αρουραίο. Φορά ένα μικρό πράσινο εορταστικό καπέλο αντί για το συνηθισμένο του στέμμα. Χαρούμενα γενέθλια αρουραίε βασιλιά!
actors.mobs.npcs.ratking.desc_winter=Αυτός ο αρουραίος είναι λίγο μεγαλύτερος από έναν κοινό μαρσιποφόρο αρουραίο. Φοράει ένα μικρό εορταστικό καπέλο αντί για το συνηθισμένο του στέμμα. Καλά Χριστούγεννα!
actors.mobs.npcs.ratking.desc=Αυτός ο αρουραίος είναι λίγο μεγαλύτερος από έναν κανονικό μαρσιποφόρο αρουραίο. Φορά ένα μικροσκοπικό στέμμα στο κεφάλι του.
actors.mobs.npcs.ratking.discover_hint=Αυτόν τον χαρακτήρα τον βρίσκεις στο τέλος μιας συγκεκριμένης τοποθεσίας της κατακόμβης.

actors.mobs.npcs.sheep.name=πρόβατο
actors.mobs.npcs.sheep.baa!=Μπεε!
actors.mobs.npcs.sheep.baa?=Μπεε;
actors.mobs.npcs.sheep.baa.=Μπεε.
actors.mobs.npcs.sheep.baa...=Μπεε...
actors.mobs.npcs.sheep.def_verb=Απορρόφηση
actors.mobs.npcs.sheep.desc=Αυτό είναι ένα μαγικό πρόβατο. Τι το κάνει μαγικό; Το ότι δεν μπορείς να το σκοτώσεις. Θα μείνει εκεί μέχρι να εξαφανιστεί μαγικά, ενώ μασουλάει και σε κοιτάζει με κενό βλέμμα.
actors.mobs.npcs.sheep.discover_hint=Αυτόν τον χαρακτήρα τον βρίσκεις με ένα συγκεκριμένο αντικείμενο ή παγίδα.

actors.mobs.npcs.shopkeeper.name=μαγαζάτορας
actors.mobs.npcs.shopkeeper.thief=Κλέφτης, κλέφτης!
actors.mobs.npcs.shopkeeper.warn=Πρόσεχε! Δεν θα σε προειδοποιήσω ξανά.
actors.mobs.npcs.shopkeeper.flee=Ο καταστηματάρχης το σκάει!
actors.mobs.npcs.shopkeeper.sell=Πώληση αντικειμένου
actors.mobs.npcs.shopkeeper.talk=Διάλογος
actors.mobs.npcs.shopkeeper.buyback=Ο καταστηματάρχης σού επιστρέφει απρόθυμα το αντικείμενο.
actors.mobs.npcs.shopkeeper.talk_prison_intro=Έχω ό,τι σου χρειάζεται για μια επιτυχημένη περιπέτεια!
actors.mobs.npcs.shopkeeper.talk_prison_warrior=Ωραία η σφραγίδα που έχεις εκεί, αν και συνήθως βγαίνουν σε ένα κομμάτι. Μπας και είσαι κανένας ξεπεσμένος ήρωας; Κοίτα, ό,τι και να έχεις κάνει δεν με αφορά... τα κέρματά σου να είναι καλά.
actors.mobs.npcs.shopkeeper.talk_prison_mage=Χε χε, νομίζω έχω δει μια αφίσα καταζητούμενου στην πόλη με το όνομά σου πάνω. Τρέχουμε, ε; Α, είσαι αθώος λες, ε; Βέβαια, βέβαια... Μην ανησυχείς, έχω καλύτερα πράγματα να κάνω από το να σε καταδώσω. Αλλά δεν αγοράζεις και τίποτα για να είμαστε σίγουροι;
actors.mobs.npcs.shopkeeper.talk_prison_rogue=Ήρθες από τη συντεχνία των ληστών για να καθαρίσεις την περιοχή; Όχι; Μόνο για ψώνια; Σκότωσε τουλάχιστον μερικά τέρατα όσο είσαι εδώ. Και μην περιμένεις καμία έκπτωση... ήδη σας πληρώνω αδρά για προστασία και μετά βίας με προστατεύετε εδώ κάτω.
actors.mobs.npcs.shopkeeper.talk_prison_huntress=Φαίνεσαι να είσαι έξω απ' τα νερά σου δεσποινίς. Δεν τους λες κι ευρύχωρους τους στενούς διαδρόμους εδώ σαν τα δάση γύρω απ' την πόλη, ε; Χεχε έλα, μη μου δίνεις σημασία... τι θα έλεγες να αγοράσεις κάτι;
actors.mobs.npcs.shopkeeper.talk_prison_duelist=Α, να και η περιπλανώμενη ηρωίδα! Αν επιδιώκεις να σώσεις άλλη μια πόλη, καλή σου τύχη. Οι κίνδυνοι εδώ πέρα είναι πολύ μεγαλύτεροι από απλές συμμοριούλες ληστών. Ξέρω πως θα τα πας πολύ καλύτερα από τον οποιονδήποτε – μόνο μη μου πεθάνεις απ' έξω από το κατάστημα.
actors.mobs.npcs.shopkeeper.talk_prison_cleric=Ω, καλώς τον Υψηλότατο, ή Αγιώτατο σε λέμε τώρα; Χεχε, όπως και να 'χει δεν είναι μέρος εδώ για σένα. Τόσοι άνθρωποι θα θρηνήσουν αν πας και πεθάνεις. Αλλά εσύ από νομίσματα όλο και κάτι έχεις, δεν αγοράζεις τίποτα να μη συμβεί αυτό;
actors.mobs.npcs.shopkeeper.talk_caves=Ξόδεψε χρήμα, ζήσε περισσότερο.\n\nΑ, και πες ένα γεια στον τρολ σιδηρουργό αν τον δεις. Να του πεις του κρεμανταλά ότι ακόμα μου χρωστάει για το σφυρί που του πούλησα πριν μια βδομάδα!
actors.mobs.npcs.shopkeeper.talk_city=Το εμπόρευμά μου εγγυάται την ασφάλειά σου.\n\n...Και αν μπορείς μη χασομεράς εδώ. Μου πήρε πολύ για να κάνω τους ντόπιους να με αφήσουν ήσυχο και δεν θέλω να μου φέρεις φασαρίες!
actors.mobs.npcs.shopkeeper.talk_halls=Γεια σου! Κάνω ειδικές τιμές στους κυνηγούς δαιμόνων! \n\nΑ, και να προσέχεις εκεί κάτω! Οι δαίμονες δεν δίνουν δεκάρα για τη γενναιότητά σου. Δεν μπορείς να γυρίσεις και να ξοδέψεις χρήμα αν πεθάνεις! ;)\n\nΑν είναι οι δαίμονες σαν κι εμένα; Χε χε, καθόλου όμως. Εγώ δεν είμαι παρά ένας απλός τυπάκος, δεν με λες σπουδαίο μαχητή και απλά έχω το μυαλό μου στη θέση του. Οι δαίμονες εκεί κάτω είναι πολύ σκληρά καρύδια και έχουν υποδουλωθεί όλοι από... ε... εσύ κοίτα να προσέχεις εκεί κάτω.
actors.mobs.npcs.shopkeeper.talk_ascent=Δεν ξέρω τι σκοπεύεις να κάνεις με αυτό το φυλαχτό, αλλά δεν θέλω να έχω καμία σχέση. Αγόρασε κάτι και προχώρα... πρέπει να φύγουμε και οι δυο μας από εδώ!
actors.mobs.npcs.shopkeeper.desc=Αυτός ο εύσωμος τύπος δείχνει πιο ταιριαστός σε εμπορικό κατάστημα μεγαλούπολης παρά σε κατακόμβη. Οι τιμές του εξηγούν γιατί προτιμά να εμπορεύεται εδώ.

actors.mobs.npcs.wandmaker.name=γέρος ραβδοποιός
actors.mobs.npcs.wandmaker.intro_warrior=Ω, καλώς τον! Τι ευχάριστη έκπληξη να συναντώ έναν πολεμιστή του βορρά σε ένα τόσο καταθλιπτικό μέρος! Πρέπει να ταξίδεψες πολύ για να φτάσεις ως εδώ. Αν αναζητάς την περιπέτεια, έχω μια δουλειά για σένα.
actors.mobs.npcs.wandmaker.intro_rogue=Ω, με τρόμαξες! Δεν έχω δει ληστή εδώ που να έχει σώας τας φρένας, άρα πρέπει να έρχεσαι απ' την επιφάνεια! Αν δε σε πειράζει να βοηθήσεις έναν άγνωστο, έχω μια δουλειά για σένα.
actors.mobs.npcs.wandmaker.intro_mage=%s! Πώς τα πας; Άκουσα για μια φασαρία που έγινε ανάμεσα σε εσένα και το ινστιτούτο μάγων; Αλλά τέλος πάντων... ποτέ δεν τους συμπάθησα αυτούς τους μούχλες έτσι κι αλλιώς. Εάν είσαι πρόθυμος, έχω μια δουλειά για σένα.
actors.mobs.npcs.wandmaker.intro_huntress=Ω, γεια σου δεσποινίς! Μια φιλική παρουσία είναι πάντα ευχάριστη εδώ κάτω, έτσι δεν είναι; Βασικά εσένα κάπου σε έχω ξαναδεί, αλλά δεν μπορώ να θυμηθώ πού... Τέλος πάντων... αν έχεις έρθει για περιπέτεια, έχω μια δουλειά για σένα.
actors.mobs.npcs.wandmaker.intro_duelist=Ω! Χαίρετε κυρία μου! Τι ευχάριστη έκπληξη να συναντώ μια ηρωίδα σε ένα τόσο καταθλιπτικό μέρος! Αν θέλεις να βοηθήσεις έναν γέρο άνθρωπο, έχω μια δουλειά για σένα.
actors.mobs.npcs.wandmaker.intro_cleric=Ω, χαίρετε Υψηλότατε! Τι ευχάριστη έκπληξη να σας συναντώ σε ένα τόσο καταθλιπτικό μέρος! Χωρίς να θέλω να γίνω αδιάκριτος, ίσως έχω να σας αναθέσω μια αποστολή.
actors.mobs.npcs.wandmaker.intro_1=\n\nΉρθα για να βρω ένα σπάνιο συστατικό ενός ραβδιού. Αλλά έχω χαθεί, και η μαγική μου ασπίδα αποδυναμώνεται. Πρέπει να αποχωρήσω σύντομα, αλλά δεν θέλω να φύγω προτού βρω αυτό που ψάχνω.
actors.mobs.npcs.wandmaker.intro_dust=Ψάχνω λίγη _σκόνη σορού._ Είναι ένα είδος καταραμένου οστεάλευρου που εμφανίζεται, συνήθως, σε τέτοια μέρη. Κάπου εδώ πρέπει να υπάρχει ένα φραγμένο δωμάτιο· εκεί θα έχει και τη σκόνη. Να προσέχεις όμως, η κατάρα της σκόνης είναι ιδιαίτερα ισχυρή. _Γύρνα σε μένα, όσο πιο γρήγορα μπορείς,_ και θα την εξαγνίσω εγώ.
actors.mobs.npcs.wandmaker.intro_ember=Ψάχνω για μερικά _φρέσκα κάρβουνα_ από ένα νεογέννητο στοιχείο της φωτιάς. Τα στοιχεία συνήθως εμφανίζονται όταν ένα τελετουργικό επίκλησης δεν ελέγχεται επαρκώς. Αν βρεις μερικά κεριά κι έναν τελετουργικό χώρο, είμαι σίγουρος ότι θα το κάνεις να εμφανιστεί. Πρόσεχε _μην κλειστείς σε στενό χώρο_ όταν το πολεμάς και _να έχεις πρόχειρο ένα αντικείμενο παγώματος._ Τα νεογέννητα στοιχεία είναι ισχυρά και χαοτικά, αλλά δεν αντέχουν το κρύο.
actors.mobs.npcs.wandmaker.intro_berry=H παλιά αρχιφύλακας αυτής της φυλακής διατηρούσε ένα _φυτό σαπιόμουρου_ και θέλω τον σπόρο του. Το φυτό θα έχει αγριέψει πλέον, οπότε ίσως αποδειχτεί δύσκολο να του πάρεις τον σπόρο. Ο κήπος του θα πρέπει να είναι κάπου εδώ γύρω. _Μείνε μακριά από τα φυτικά μαστίγιά του,_ αν τη θες τη ζωή σου. Ίσως σου φανεί δελεαστική η ιδέα να χρησιμοποιήσεις φωτιά, αλλά μην το κάνεις... θα σκοτώσεις το φυτό και θα καταστρέψεις τους σπόρους έτσι.
actors.mobs.npcs.wandmaker.intro_2=\n\nΑν μου βρεις το συστατικό, χαρά μου να σε πληρώσω με ένα από τα καλοφτιαγμένα ραβδιά μου! Έφερα δύο μαζί μου, οπότε μπορείς να πάρεις όποιο προτιμάς.
actors.mobs.npcs.wandmaker.reminder_dust=%s! Έχουμε κάποιο νέο για τη σκόνη σορού; Ψάξε για κάποιο οχύρωμα.
actors.mobs.npcs.wandmaker.reminder_ember=%s! Έχουμε κάποιο νέο για τα κάρβουνα; Πρέπει να βρεις τέσσερα κεριά και τον τελετουργικό χώρο.
actors.mobs.npcs.wandmaker.reminder_berry=%s! Έχουμε κάποιο νέο για τον σπόρο σαπιόμουρου; Ψάξε για ένα δωμάτιο γεμάτο βλάστηση.
actors.mobs.npcs.wandmaker.def_verb=Απορρόφηση
actors.mobs.npcs.wandmaker.desc=Αυτός ο γέρικος αλλά υγιής κύριος έχει μια κάπως σαστισμένη έκφραση. Προστατεύεται από μια μαγική ασπίδα.



###mobs
actors.mobs.acidic.name=όξινος σκορπιός
actors.mobs.acidic.desc=Αυτά τα τεράστια δαιμονικά αραχνίδια αποφεύγουν την κοντινή μάχη. Προτιμούν να κρατούν μεγάλες αποστάσεις και να εκτοξεύουν οδοντωτά καρφιά που σακατεύουν. Το συγκεκριμένο φαίνεται να εκκρίνει καυστική γλίτσα.

actors.mobs.albino.name=αρουραίος αλμπίνο
actors.mobs.albino.desc=Αυτή είναι μια σπάνια ράτσα του μαρσιποφόρου αρουραίου, με αμιγώς λευκή γούνα και σουβλερά δόντια.
actors.mobs.albino.discover_hint=Αυτόν τον εχθρό τον βρίσκεις σπανίως σε μια συγκεκριμένη τοποθεσία της κατακόμβης.

actors.mobs.armoredstatue.name=πάνοπλο άγαλμα
actors.mobs.armoredstatue.desc=Θα έλεγες ότι είναι άλλο ένα άψυχο άγαλμα της κατακόμβης, αλλά τα λαμπερά του κόκκινα μάτια το προδίδουν.\n\nΒρίσκεται σε πλεονεκτική θέση χάρη στην πανοπλία που φορά... πρέπει να είναι πολύ δύσκολο να εξοντωθεί.
actors.mobs.armoredstatue.desc_arm_wep=Ενώ το ίδιο το άγαλμα είναι πέτρινο, ο εξοπλισμός του _(%1$s_ και _%2$s)_ φαίνεται αληθινός.

actors.mobs.bandit.name=τρελός κακοποιός
actors.mobs.bandit.desc=Ένας επίλεκτος ληστής που ξεχωρίζει από τον πορφυρό μανδύα του. Παρά τη μεγάλη τους ικανότητα, έχουν γίνει το ίδιο άμυαλοι με τους κανονικούς ληστές.\n\nΕκτός του ότι σε ληστεύει, ο τρελός κακοποιός θα σε τυφλώσει για λίγο, θα σε σακατέψει και θα σε δηλητηριάσει! Συνήθως όμως έχουν περισσότερη λεία από έναν κανονικό ληστή.

actors.mobs.bat.name=νυχτερίδα βαμπίρ
actors.mobs.bat.desc=Αυτοί οι ζωηροί και ανυποχώρητοι κάτοικοι των σπηλαίων είναι πολύ πιο επικίνδυνοι από όσο φαίνονται. Αναπληρώνουν την υγεία τους με κάθε επιτυχημένη επίθεση και μπορούν, έτσι, να εξοντώνουν μεγαλύτερους εχθρούς.

actors.mobs.bee.name=χρυσή μέλισσα
actors.mobs.bee.desc_honey=Παρά το μικρό τους μέγεθος, οι χρυσές μέλισσες προστατεύουν σθεναρά το σπίτι τους. Αυτή η μέλισσα έχει εξευμενιστεί· φαίνεται να θέλει να σε ακολουθήσει.
actors.mobs.bee.desc=Παρά το μικρό τους μέγεθος, οι χρυσές μέλισσες προστατεύουν σθεναρά το σπίτι τους. Αυτή η μέλισσα είναι αγριεμένη· καλύτερα να μείνεις σε απόσταση.
actors.mobs.bee.discover_hint=Αυτόν τον χαρακτήρα τον βρίσκεις με ένα συγκεκριμένο αντικείμενο.

actors.mobs.brute.name=κτηνώδες γκνολ
actors.mobs.brute.enraged=εξαγρίωση
actors.mobs.brute.def_verb=Απόκρουση
actors.mobs.brute.desc=Τα κτήνη είναι τα μεγαλύτερα, δυνατότερα, και σκληρότερα όλων των γκνολ. Εξαγριώνονται όταν πληγωθούν θανάσιμα, λαμβάνοντας προσωρινή προστασία και μια μεγάλη αναβάθμιση στις επιθέσεις τους.
actors.mobs.brute$bruterage.name=κτηνώδης οργή
actors.mobs.brute$bruterage.desc=Το κτηνώδες γκνολ πεθαίνει, αλλά θέλει να σε πάρει μαζί του!\n\nΤο κτήνος θα πεθάνει όταν η ασπίδα του εξασθενήσει, είτε λόγω χρόνου είτε λόγω ζημιάς. Σε αυτό το διάστημα προκαλεί τεράστια ζημιά, οπότε πρόσεχε!\n\nΑσπίδα που απομένει: %d.

actors.mobs.causticslime.name=καυστική χλαπάτσα
actors.mobs.causticslime.desc=Αυτή η χλαπάτσα φαίνεται να έχει μολυνθεί από τη σκοτεινή μαγεία που αναδύεται από κάτω. Έχει χάσει το συνηθισμένο πράσινο χρώμα της και στάζει καυστική γλίτσα.
actors.mobs.causticslime.discover_hint=Αυτόν τον εχθρό τον βρίσκεις σπανίως σε μια συγκεκριμένη τοποθεσία της κατακόμβης.

actors.mobs.crab.name=καβούρι υπονόμου
actors.mobs.crab.desc=Αυτά τα τεράστια καβούρια ανήκουν στην κορυφή της τροφικής αλυσίδας των υπονόμων. Είναι εξαιρετικά γρήγορα και το παχύ τους καύκαλο μπορεί να αντέξει βαριά χτυπήματα.

actors.mobs.crystalguardian.name=κρυστάλλινος φρουρός
actors.mobs.crystalguardian.def_verb=Απόκρουση
actors.mobs.crystalguardian.desc=Αυτοί οι μεγάλοι κρυστάλλινοι φρουροί θα ομοίαζαν με αγάλματα αν δεν ήταν τα λαμπερά, ζωηρά τους μάτια. Ο σκληροποιημένος κρύσταλλος από τον οποίο αποτελούνται τους καθιστά κάπως οκνηρούς αλλά και πολύ σκληρούς. _Είναι καλύτερα να τους αφήσεις να κοιμηθούν στην κρυστάλλινη φωλιά τους για όσο το δυνατόν περισσότερο._\n\nΟι κρυστάλλινοι φρουροί κινούνται πολύ βραδύτερα σε στενούς χώρους εξαιτίας του μεγέθους τους. Επιπλέον, είναι τόσο ανθεκτικοί που είναι αδύνατον να εξοντωθούν απευθείας. Μπορείς να τους υπερνικήσεις και να τους κλονίσεις προσωρινά, αλλά θα επανέλθουν έπειτα από λίγο.
actors.mobs.crystalguardian.discover_hint=Αυτόν τον εχθρό τον βρίσκεις σε μια συγκεκριμένη αποστολή.

actors.mobs.crystalmimic.name=κρυστάλλινος μίμος
actors.mobs.crystalmimic.ate=Ο μίμος έφαγε: %s!
actors.mobs.crystalmimic.escaped=Ο κρυστάλλινος μίμος ξέφυγε!
actors.mobs.crystalmimic.desc=Οι μίμοι είναι μαγικά πλάσματα που μπορούν να πάρουν όποια μορφή θέλουν. Στις κατακόμβες, διαλέγουν σχεδόν πάντα το σχήμα ενός σεντουκιού. Έτσι προσελκύουν τους ανυποψίαστους εξερευνητές.\n\nΟι κρυστάλλινοι μίμοι είναι πιο ύπουλοι από τους κανονικούς· προτιμούν να αποφεύγουν τις συγκρούσεις και να λεηλατούν τους εξερευνητές. Θα προσπαθήσουν να διαφύγουν μόλις γίνουν αντιληπτοί, κι έχουν τη δυνατότητα να μετατοπίζουν τον εχθρό όταν επιτίθενται.

actors.mobs.crystalspire.name=κρυστάλλινος στύλος
actors.mobs.crystalspire.warning=Ο κρύσταλλος πάλλεται όσο τον χτυπάς. Αν το συνεχίσεις, θα προσελκύσεις σίγουρα την προσοχή επάνω σου...
actors.mobs.crystalspire.alert=Η δόνηση γιγαντώνεται και αντηχεί σε ολόκληρο το σπήλαιο!
actors.mobs.crystalspire.desc=Αυτός ο γιγάντιος στύλος από σκληροποιημένο κρύσταλλο είναι πιθανώς η πηγή όλων των παράξενων κρυστάλλινων πλασμάτων του σπηλαίου. Τα κανονικά σου όπλα είναι αναποτελεσματικά εναντίον του, οπότε θα πρέπει να χρησιμοποιήσεις την αξίνα σου για να τον καταστρέψεις.\n\n_Βεβαιώσου ότι έχεις προετοιμαστεί προτού ξεκινήσεις να τον σπάζεις._ Ένας τόσο μεγάλος κρύσταλλος θα πάρει κάποια ώρα να σκαφτεί, και λογικά θα υπάρξει εξωτερική παρέμβαση. Ο ίδιος ο στύλος πρέπει να διαθέτει κι αυτός μηχανισμούς άμυνας. _Ίσως οι επιθέσεις του στύλου να μπορούν να χρησιμοποιηθούν εναντίον των υποτακτικών του._
actors.mobs.crystalspire.discover_hint=Αυτόν τον εχθρό τον βρίσκεις σε μια συγκεκριμένη αποστολή.

actors.mobs.crystalwisp.name=κρυστάλλινο θραύσμα
actors.mobs.crystalwisp.beam_kill=Η δέσμη φωτός σε εξόντωσε...
actors.mobs.crystalwisp.desc=Ένα μικρό και αγριεμένο ιπτάμενο κομμάτι σκληροποιημένου κρυστάλλου που εκπέμπει μια έντονη λάμψη. Αν και δεν είναι ιδιαίτερα δυνατά, τα κρυστάλλινα θραύσματα εξαπολύουν μια ζημιογόνα ακτίνα φωτός εφόσον έχουν καθαρό στόχο. \n\nΤα θραύσματα είναι αρκετά μικρά για να κινούνται άνετα μέσα από τις χαραμάδες των κρυστάλλων, αλλά δεν μπορούν να ρίχνουν μέσω αυτών.
actors.mobs.crystalwisp.discover_hint=Αυτόν τον εχθρό τον βρίσκεις σε μια συγκεκριμένη αποστολή.

actors.mobs.demonspawner.name=γεννήτωρ δαιμόνων
actors.mobs.demonspawner.on_death=Η δαιμονική ενέργεια δείχνει να ελαττώνεται καθώς ο γεννήτωρ πεθαίνει.
actors.mobs.demonspawner.desc=Αυτή η συστρεφόμενη μάζα από σάρκες νάνων γεννά τους δαίμονες αντεροβγάλτες, χρησιμοποιώντας τους νάνους που πέθαναν σε αυτήν την τοποθεσία. Φαίνεται πως οι δαίμονες δεν διστάζουν να χρησιμοποιήσουν κάθε μέσο κατά των εχθρών τους.\n\nΑν και φαίνονται τρομακτικοί, οι γεννήτορες δεν έχουν τρόπο να αμυνθούν ή να κινηθούν. Η μεγάλη τους μάζα, όμως, τους κάνει πολύ ανθεκτικούς. Δημιουργούν γρηγορότερα τους δαίμονες αντεροβγάλτες όταν απειλούνται.\n\n_Οι γεννήτορες δείχνουν να είναι συνδεδεμένοι σε μία κεντρική πηγή δαιμονικής ενέργειας. Ίσως αυτή να αποδυναμωθεί εξοντώνοντάς τους._

actors.mobs.dm100.name=DM-100
actors.mobs.dm100.zap_kill=Η ριπή αστραπής σε εξόντωσε...
actors.mobs.dm100.desc=Το DM-100 είναι ένα πρώιμο μοντέλο «αμυντικής μηχανής» των νάνων. Είχε σχεδιαστεί για να προστατεύει τους νάνους ανθρακωρύχους στα σπήλαια κάτω από τη φυλακή. Η ηλεκτροπληξία τους, όμως, αποδείχθηκε ανίσχυρη, οπότε και δωρίστηκαν στην πόλη των ανθρώπων από πάνω. Έμειναν αχρησιμοποίητα για χρόνια μέχρι που κατέληξαν στη φυλακή, όπου η αρχιφύλακας αρχικά τα θεώρησε απάνθρωπα. Εντέλει κρίθηκαν αναγκαία, καθώς οι κρατούμενοι γίνονταν όλο και πιο απείθαρχοι.

actors.mobs.dm200.name=DM-200
actors.mobs.dm200.vent=Το DM-200 εξαπολύει έναν πίδακα τοξικού αερίου!
actors.mobs.dm200.desc=Το DM-200 είναι η δεύτερη γενιά «αμυντικής μηχανής» των νάνων. Έχει σχεδιαστεί για να προστατεύει τους νάνους ανθρακωρύχους, τόσο στις σπηλιές όσο και στην πόλη από κάτω. Είναι πολύ πιο μεγάλα και ογκώδη από τους προκατόχους τους κι επιτίθενται με καταστροφικές υδραυλικές γροθιές.\n\nΤο μεγάλο μέγεθος αποτελεί και την κύρια αδυναμία των DM-200: δεν μπορούν να μπουν στις στενές πόρτες και σήραγγες της κατακόμβης. Οι νάνοι μπόρεσαν να εξισορροπήσουν την έλλειψη κινητικότητάς τους με το να τα κάνουν να εξαπολύουν τοξικά αέρια σε μακρινούς ή απρόσιτους εχθρούς.

actors.mobs.dm201.name=DM-201
actors.mobs.dm201.vent=Το DM-201 ρίχνει μία διαβρωτική χειροβομβίδα!
actors.mobs.dm201.desc=Οι νάνοι πειραματίστηκαν με το να δώσουν έμφαση στην έλλειψη κινητικότητας του DM-200 – κι έτσι έφτιαξαν κάποια πλήρως στάσιμα μοντέλα DM. Το DM-201 είναι ένα τροποποιημένο DM-200 που λειτουργεί ως αμυντική βάση, χωρίς τη δυνατότητα κίνησης. Σε αντάλλαγμα με την έλλειψη κινητικότητας, το DM-201 έχει σημαντικά ανεβασμένη ανθεκτικότητα και επιθετική ισχύ.\n\nΤα DM-201 δεν μπορούν να εκτοξεύουν καυσαέρια μιας και δεν έχουν κινητήρα. Γι' αυτό, οι νάνοι τα εφοδίασαν με βομβίδες διαβρωτικού αερίου! Τα DM-201 είναι προσεκτικά με αυτές τις βομβίδες· τις εξαπολύουν μόνο όταν δέχονται επίθεση εξ αποστάσεως.

actors.mobs.dm300.name=DM-300
actors.mobs.dm300.notice=ΕΝΤΟΠΙΣΤΗΚΕ ΜΗ ΕΞΟΥΣΙΟΔΟΤΗΜΕΝΟ ΠΡΟΣΩΠΙΚΟ!
actors.mobs.dm300.shield=Το DM-300 τραβά ενέργεια από τα εκτεθειμένα καλώδια και προστατεύεται!
actors.mobs.dm300.charging=ΥΦΙΣΤΑΜΑΙ ΖΗΜΙΑ! ΕΝΕΡΓΟΠΟΙΗΣΗ ΠΥΛΩΝΑ ΙΣΧΥΟΣ!
actors.mobs.dm300.charging_hint=Το DM-300 είναι άτρωτο όσο του παρέχεται ενέργεια από πυλώνα!
actors.mobs.dm300.supercharged=ΚΑΤΑΣΤΡΕΨΕ! ΚΑΤΑΣΤΡΕΨΕ! ΚΑΤΑΣΤΡΕΨΕ!
actors.mobs.dm300.charge_lost=Ο ΠΥΛΩΝΑΣ ΚΑΤΑΣΤΡΑΦΗΚΕ! ΕΠΙΣΤΡΟΦΗ ΣΕ ΤΟΠΙΚΗ ΕΝΕΡΓΕΙΑ!
actors.mobs.dm300.pylons_destroyed=ΠΡΟΣΟΧΗ! ΕΝΤΟΠΙΣΤΗΚΕ ΑΣΤΑΘΕΙΑ ΣΤΟ ΔΙΚΤΥΟ ΕΝΕΡΓΕΙΑΣ!
actors.mobs.dm300.rankings_desc=Συνθλίφθηκες από το DM-300
actors.mobs.dm300.def_verb=Απόκρουση
actors.mobs.dm300.defeated=ΚΡΙΣΙΜΗ ΖΗΜΙΑ! ΑΠΟΠΕΙΡΑ ΤΕΡΜΑΤΙΣΜ-
actors.mobs.dm300.desc=Το DM-300 είναι η μεγαλύτερη και ισχυρότερη «αμυντική μηχανή» που έφτιαξαν ποτέ οι νάνοι. Μία τόσο εκπληκτική μηχανή είναι δύσκολο να κατασκευαστεί· οι νάνοι είχαν φτιάξει ελάχιστες, μόνο και μόνο για να φυλούν τις εισόδους της υπόγειας μητρόπολης.\n\nΤο DM-300 είναι εξοπλισμένο με αεραγωγούς που εκτοξεύουν τοξικά αέρια, και με ένα τρυπάνι υψηλής ισχύος για να επιτίθεται και να τρυπά τη γη. Μπορεί επίσης να συνδεθεί σε ένα ενεργειακό δίκτυο, ενισχύοντας περαιτέρω τη δύναμή του.
actors.mobs.dm300.desc_supercharged=Το DM-300 είναι πλήρως φορτισμένο με ηλεκτρική ενέργεια. Στη μορφή αυτή δεν μπορεί να πάθει ζημιά και κινείται με διπλάσια ταχύτητα! Επίσης, το τρυπάνι του γυρίζει πιο γρήγορα ώστε να _τρυπάει συμπαγή βράχια·_ αν και κινείται πολύ πιο αργά όταν το κάνει αυτό.\n\nΗ απευθείας επίθεση στο DM-300 είναι ανούσια όσο είναι υπερφορτισμένο, αλλά _κάτι στην περιοχή πρέπει να του παρέχει ενέργεια_ – με την καταστροφή του μπορεί να αποδυναμωθεί το DM-300.

actors.mobs.dwarfking.name=Βασιλιάς των Νάνων
actors.mobs.dwarfking.notice=Πώς τολμάς! Δεν έχεις ιδέα σε τι παρεμβαίνεις!
actors.mobs.dwarfking.lifelink_1=Χρειάζομαι τη ζωτική σου ουσία, σκλάβε!
actors.mobs.dwarfking.lifelink_2=Μάτωσε για μένα, σκλάβε!
actors.mobs.dwarfking.teleport_1=Κανόνισε τον εχθρό, σκλάβε!
actors.mobs.dwarfking.teleport_2=Κράτα τον εχθρό απασχολημένο, σκλάβε!
actors.mobs.dwarfking.wave_1=Αρκετά! Σηκωθείτε σκλάβοι μου!
actors.mobs.dwarfking.wave_2=Κι άλλο! Ματώστε για τον βασιλιά σας!
actors.mobs.dwarfking.wave_3=Άχρηστοι! ΣΚΟΤΩΣΤΕ ΤΟΝ ΕΧΘΡΟ ΤΩΡΑ!
actors.mobs.dwarfking.enraged=%s! Δεν μπορείς να με σκοτώσεις! ΕΓΩ! ΕIΜΑΙ! ΑΘΑΝΑΤΟΣ!
actors.mobs.dwarfking.losing=Όχι! Δεν μπορείς να το κάνεις αυτό... δεν έχεις ιδέα τι βρίσκεται από κάτω...
actors.mobs.dwarfking.defeated=Μας... καταδίκασες όλους...
actors.mobs.dwarfking.rankings_desc=Έπεσες μπροστά στον Βασιλιά των Νάνων
actors.mobs.dwarfking.desc=Πριν από πολλά χρόνια, ένας από τους ανώτερους μάγους της αυλής των νάνων ξέθαψε κάποια μυστικά, τα οποία του χάρισαν τεράστια δύναμη πάνω στη ζωή και τον θάνατο. Δεν έχασε χρόνο κι έκανε άμεσα χρήση αυτής της δύναμης. Υπέταξε και διέφθειρε τους ομοίους του, τον βασιλιά του και, τελικά, τον κάθε νάνο πολίτη. Τώρα είναι βασιλιάς· ο ηγέτης μιας λεγεώνας απέθαντων υπηκόων.\n\nΟ βασιλιάς των νάνων είναι επιθετικός εχθρός. Περικυκλώνει και κατακυριεύει τους εχθρούς του με μια ορδή απέθαντων υπηκόων.
actors.mobs.dwarfking$dkghoul.rankings_desc=Έπεσες μπροστά στον Βασιλιά των Νάνων
actors.mobs.dwarfking$dkmonk.rankings_desc=Έπεσες μπροστά στον Βασιλιά των Νάνων
actors.mobs.dwarfking$dkwarlock.rankings_desc=Έπεσες μπροστά στον Βασιλιά των Νάνων
actors.mobs.dwarfking$dkgolem.rankings_desc=Έπεσες μπροστά στον Βασιλιά των Νάνων

actors.mobs.ebonymimic.name=μίμος εβένου
actors.mobs.ebonymimic.reveal=Υπήρχε μίμος εδώ!
actors.mobs.ebonymimic.hidden_name=ύποπτο περίγραμμα
actors.mobs.ebonymimic.hidden_desc=Φαίνεται σαν να υπάρχει κάτι εδώ, αλλά είναι σχεδόν ολοκληρωτικά διαφανές.
actors.mobs.ebonymimic.desc=Οι μίμοι είναι μαγικά πλάσματα που μπορούν να πάρουν όποια μορφή θέλουν. Στις κατακόμβες, διαλέγουν σχεδόν πάντα το σχήμα ενός σεντουκιού. Έτσι προσελκύουν τους ανυποψίαστους εξερευνητές.\n\nΟι μίμοι εβένου είναι εξαιρετικά ύπουλοι και έχουν τη δυνατότητα να γίνονται σχεδόν αόρατοι. Παραμονεύουν σε αντικείμενα που είναι πιθανό να αλληλεπιδράσουν οι εξερευνητές, αλλά περιέχουν και οι ίδιοι λάφυρα. Δεν είναι πιο σκληροί από έναν συνηθισμένο μίμο μόλις ανακαλυφθούν, αλλά το αιφνιδιαστικό τους δάγκωμα είναι καταστροφικό.
actors.mobs.ebonymimic.discover_hint=Αυτόν τον εχθρό τον βρίσκεις με ένα συγκεκριμένο μαραφέτι.

actors.mobs.elemental$fireelemental.name=στοιχείο της φωτιάς
actors.mobs.elemental$fireelemental.desc=Τα στοιχεία είναι χαοτικά πλάσματα που υλοποιούνται όταν μια ισχυρή, αποκρυφιστική μαγεία δεν ελέγχεται επαρκώς. Τα στοιχεία έχουν ελάχιστη νοημοσύνη και συνήθως σχετίζονται με έναν συγκεκριμένο τύπο μαγείας.\n\nΤο στοιχείο της φωτιάς είναι ένας συνηθισμένος τύπος στοιχείου που επιτίθεται με φλογερή μαγεία. Αναφλέγει τον στόχο με επιθέσεις εξ επαφής και, ενίοτε, εξαπολύει βλήματα φωτιάς.
actors.mobs.elemental$newbornfireelemental.name=νεογέννητο στοιχείο της φωτιάς
actors.mobs.elemental$newbornfireelemental.charging=Το στοιχείο φορτίζεται!
actors.mobs.elemental$newbornfireelemental.desc=Τα στοιχεία είναι χαοτικά πλάσματα που υλοποιούνται όταν μια ισχυρή, αποκρυφιστική μαγεία δεν ελέγχεται επαρκώς. Τα στοιχεία έχουν ελάχιστη νοημοσύνη και συνήθως σχετίζονται με έναν συγκεκριμένο τύπο μαγείας.\n\nΑυτό το στοιχείο της φωτιάς έχει επικαλεστεί πρόσφατα, αλλά παραμένει αρκετά επικίνδυνο!
actors.mobs.elemental$newbornfireelemental.desc_boss=Εξαιτίας της χαοτικής φύσης της επίκλησής του, το στοιχείο μπορεί να εξαπλώνει φλόγες μόνο με ανακριβείς εκρήξεις αφού φορτιστεί για έναν γύρο.
actors.mobs.elemental$newbornfireelemental.desc_ally=Καθώς αυτό το στοιχείο επικλήθηκε από ξόρκι, έχει λίγο παραπάνω έλεγχο της φλόγας του. Είναι ανίκανο να κάνει επίθεση από απόσταση, αλλά θα αναφλέξει τους εχθρούς σε μάχη σώμα-με-σώμα.
actors.mobs.elemental$newbornfireelemental.discover_hint=Αυτόν τον εχθρό τον βρίσκεις σε μια συγκεκριμένη αποστολή.
actors.mobs.elemental$frostelemental.name=στοιχείο του πάγου
actors.mobs.elemental$frostelemental.desc=Τα στοιχεία είναι χαοτικά πλάσματα που υλοποιούνται όταν μια ισχυρή, αποκρυφιστική μαγεία δεν ελέγχεται επαρκώς. Τα στοιχεία έχουν ελάχιστη νοημοσύνη και συνήθως σχετίζονται με έναν συγκεκριμένο τύπο μαγείας.\n\nΤο στοιχείο του πάγου είναι ένας συνηθισμένος τύπος στοιχείου που αποδυναμώνει τους εχθρούς με μαγεία ψύχους. Ψύχει τον στόχο με επιθέσεις εξ επαφής και, ενίοτε, με επιθέσεις απόστασης. Η μαγεία του είναι πολύ πιο αποτελεσματική στο νερό.
actors.mobs.elemental$shockelemental.name=στοιχείο του ηλεκτρισμού
actors.mobs.elemental$shockelemental.desc=Τα στοιχεία είναι χαοτικά πλάσματα που υλοποιούνται όταν μια ισχυρή, αποκρυφιστική μαγεία δεν ελέγχεται επαρκώς. Τα στοιχεία έχουν ελάχιστη νοημοσύνη και συνήθως σχετίζονται με έναν συγκεκριμένο τύπο μαγείας.\n\nΤο στοιχείο του ηλεκτρισμού είναι ένας λιγότερο συνηθισμένος τύπος στοιχείου που διαταράσσει τους εχθρούς με ηλεκτρισμό και λάμψεις φωτός. Ηλεκτρίζει όλους τους κοντινούς εχθρούς με επιθέσεις εξ επαφής, και προκαλεί επιπλέον ζημιά στον κύριο στόχο όταν αυτός βρίσκεται σε νερό. Ενίοτε, προκαλεί εκρήξεις φωτός στον στόχο από απόσταση και τον τυφλώνει προσωρινά.
actors.mobs.elemental$chaoselemental.name=στοιχείο του χάους
actors.mobs.elemental$chaoselemental.desc=Τα στοιχεία είναι χαοτικά πλάσματα που υλοποιούνται όταν μια ισχυρή, αποκρυφιστική μαγεία δεν ελέγχεται επαρκώς. Τα στοιχεία έχουν ελάχιστη νοημοσύνη και συνήθως σχετίζονται με έναν συγκεκριμένο τύπο μαγείας.\n\nΤο στοιχείο του χάους είναι ένα σπάνιο και επικίνδυνο στοιχείο που δεν έχει σταθεροποιηθεί σε συγκεκριμένο τύπο στοιχείου. Απελευθερώνει άγρια και απρόβλεπτη μαγεία όταν επιτίθεται.

actors.mobs.eye.name=μοχθηρό μάτι
actors.mobs.eye.deathgaze_kill=Το θανάσιμο βλέμμα σε εξόντωσε...
actors.mobs.eye.desc=Τα μοχθηρά μάτια είναι επιπλέουσες μπάλες συσσωρευμένης δαιμονικής ενέργειας. Ενώ είναι ικανά για μάχη σώμα με σώμα, η πραγματική τους δύναμη προέρχεται από τη μαγεία τους.\n\nΑφού συσσωρεύσει ενέργεια για λίγη ώρα, το μοχθηρό μάτι θα απελευθερώσει μία καταστροφική ακτίνα ενέργειας: το λεγόμενο _θανάσιμο βλέμμα._ Οτιδήποτε πιαστεί στο βλέμμα θα λάβει εξωπραγματική ζημιά· οι σοφοί εξερευνητές θα τρέξουν να καλυφθούν.

actors.mobs.fetidrat.name=βρομερός αρουραίος
actors.mobs.fetidrat.desc=Κάτι δεν πάει καθόλου καλά με αυτόν τον αρουραίο. Η λιγδωμένη μαύρη γούνα του και το σάπιο δέρμα του τον διαφοροποιούν από τους υγιείς αρουραίους που έχεις δει μέχρι τώρα. Τα χλωμά πράσινα μάτια του τον κάνουν να φαίνεται εξαιρετικά απειλητικός.\n\nΟ αρουραίος μεταφέρει ένα νέφος απαίσιας δυσωδίας μαζί του· είναι ακατανίκητα έντονη από κοντά.\n\nΣκοτεινή γλίτσα τρέχει από το στόμα του αρουραίου· διαβρώνει το έδαφος, αλλά δείχνει να διαλύεται στο νερό.
actors.mobs.fetidrat.discover_hint=Αυτόν τον εχθρό τον βρίσκεις σε μια συγκεκριμένη αποστολή.

actors.mobs.fungalcore.name=μυκητιακός πυρήνας
actors.mobs.fungalcore.desc=Αυτό το γιγάντιο μανιτάρι πρέπει να είναι η πηγή όλης της δραστηριότητας των μυκήτων αυτού του σπηλαίου.

actors.mobs.fungalsentry.name=μύκητας φρουρός
actors.mobs.fungalsentry.desc=Αυτό το εξαιρετικά ψηλό μανιτάρι λειτουργεί ως ένα σημείο άμυνας του ευρύτερου μυκητιακού δικτύου αυτού του σπηλαίου.\n\nΕίναι στάσιμο, αλλά εξαπολύει ακριβείς εκρήξεις δηλητηρίου σε οτιδήποτε μπαίνει στο ορατό του πεδίο. Αν και οι ίδιες οι εκρήξεις είναι σχετικά ανίσχυρες, _προσθέτουν θανάσιμες ποσότητες δηλητηρίου πολύ γρήγορα._ Μπορείς να το εξοντώσεις, αλλά είναι μάλλον καλύτερα να το αποφύγεις.

actors.mobs.fungalspinner.name=μύκητας υφαντουργός
actors.mobs.fungalspinner.desc=Αυτός ο υφαντουργός σπηλαίων φαίνεται να ελέγχεται από έναν παρασιτικό μύκητα. Ο μύκητας έχει ανταλλάξει τους αδένες ιστού και δηλητηρίου με μυκητιακές απολήξεις, αλλάζοντας και τις ικανότητες του υφαντουργού.\n\nΟ μύκητας υφαντουργός σού εκτοξεύει φυτική βλάστηση αντί για ιστό, η οποία μεταδίδει μυκητιακή βλάστηση και πιθανώς να σε ριζώσει. Αν και δεν μπορεί να δηλητηριάσει, ο μύκητας υφαντουργός λαμβάνει σημαντική αντοχή στη ζημιά όταν βρίσκεται δίπλα σε μανιτάρι.

actors.mobs.ghoul.name=νάνος βρυκόλακας
actors.mobs.ghoul.desc=Καθώς η κοινωνία των νάνων κατέρρεε, και αφού ο βασιλιάς απέκτησε την απόλυτη ισχύ, οι αδύναμοι και οι ανυπότακτοι δεν αντιμετωπίστηκαν καλά. Ο βασιλιάς γινόταν όλο και πιο ικανός στη χρήση της σκοτεινής μαγείας, μέχρι που υπέταξε όλους αυτούς τους νάνους στη θέληση του. Πλέον αποτελούν το απλό πεζικό του στρατού του.\n\nΟι βρυκόλακες δεν είναι ιδιαίτερα δυνατοί από μόνοι τους. Κινούνται, όμως, πάντα σε ομάδες, και εξοντώνονται δυσκολότερα σε μεγάλους αριθμούς. _Ένας εξοντωμένος βρυκόλακας θα ξανασηκωθεί μετά από λίγους γύρους, εφόσον υπάρχει κι άλλος κοντινός βρυκόλακας._

actors.mobs.gnoll.name= γκνολ ανιχνευτής
actors.mobs.gnoll.desc=Τα γκνολ είναι ανθρωποειδή που ομοιάζουν με ύαινες. Περιπλανώνται σε υπονόμους και κατακόμβες, ανεβαίνοντας κάπου-κάπου στην επιφάνεια για να λεηλατήσουν. Οι γκνολ ανιχνευτές είναι συνήθη μέλη του κοπαδιού: όχι τόσο δυνατά όσο τα κτηνώδη γκνολ κι όχι τόσο έξυπνα όσο οι σαμάνοι.

actors.mobs.gnollexile.name=εξόριστο γκνολ
actors.mobs.gnollexile.desc=Αυτό το γκνολ με το γκρίζο τρίχωμα έχει ένα μεγάλο σημάδι στον ώμο που χαρακτηρίζει έναν εξόριστο. Τα γκνολ συνήθως εξορίζονται από την κοινωνία τους όταν αγνοούν εντολές ή καταπατούν νόμους. Οι εξόριστοι γίνονται δυνατοί και ευφυείς για να επιβιώσουν, έτσι αυτό εδώ φαίνεται πως ξέρει να χρησιμοποιεί το δόρυ που κρατά.
actors.mobs.gnollexile.desc_passive=_Το εξόριστο γκνολ δεν κινείται για επίθεση._ Δεν φαίνεται τόσο επιθετικό όσο τα άλλα γκνολ και μάλλον δεν πιστεύει ότι αξίζει τον κόπο να σε πολεμήσει. Μπορείς και να το αφήσεις να φύγει, αλλά έχει ένα σακίδιο που μπορεί να είναι γεμάτο χρήσιμα αντικείμενα...
actors.mobs.gnollexile.desc_aggro=_Το εξόριστο γκνολ κοιτάζει τριγύρω αγριεμένο._ Φαίνεται πως κάτι το έκανε να αποφασίσει τελικά να παλέψει. Πρόσεχε το δόρυ του!
actors.mobs.gnollexile.seen_passive=Το γκνολ με το δόρυ σε κοιτάζει άγρια, αλλά δεν κινείται για επίθεση.
actors.mobs.gnollexile.seen_aggro=Το γκνολ με το δόρυ πάει να επιτεθεί!

actors.mobs.gnollgeomancer.name=γκνολ γεωμάντης
actors.mobs.gnollgeomancer.warning=Ο γεωμάντης αρχίζει να συνταράσσεται. Βεβαιώσου πως έχεις προετοιμαστεί πριν συνεχίσεις!
actors.mobs.gnollgeomancer.alert=Ο γεωμάντης ξυπνά! Ολόκληρο το σπήλαιο μοιάζει να τραντάζεται ενώ ξεφεύγει γελώντας τρελά!
actors.mobs.gnollgeomancer.rock_kill=Ο πετούμενος ογκόλιθος σε εξόντωσε...
actors.mobs.gnollgeomancer.rockfall_kill=Η κατολίσθηση βράχων σε εξόντωσε...
actors.mobs.gnollgeomancer.desc=Αυτό το επιβλητικά ψηλό ανώτερο γκνολ πρέπει να είναι η πηγή της γαιοκινητικής μαγείας εδώ γύρω, αλλά και αυτός που οργανώνει όλη τη δραστηριότητα των γκνολ. Σε αντίθεση με τους γκνολ σκαπανείς της περιοχής, ο γεωμάντης είναι πολύ επιδέξιος με τη μαγεία και δεν λαμβάνει ζημιά από πετούμενους βράχους. Όμως, δεν έχει κανέναν τρόπο να πολεμά σε μάχη σώμα-με-σώμα.
actors.mobs.gnollgeomancer.desc_armor=Ο γεωμάντης είναι καλυμμένος με μια στρώση πετρώδους πανοπλίας. _Θα χρειαστεί να τον πλησιάσεις και να την καταστρέψεις με την αξίνα προτού προκαλέσεις ζημιά στον γεωμάντη._
actors.mobs.gnollgeomancer.desc_armor_sapper=_Ένας κοντινός γκνολ σκαπανέας κρατά μια συσκευή που ενισχύει την πετρώδη πανοπλία του γεωμάντη. Δεν μπορείς να του προκαλέσεις καθόλου ζημιά αυτή τη στιγμή!_
actors.mobs.gnollgeomancer.desc_sleeping=Αυτός ο επιβλητικά ψηλός γκνολ σαμάνος περιβάλλεται από μια πέτρινη στρώση και σχεδόν ομοιάζει με άγαλμα. Κοιτώντας προσεκτικά, βλέπεις τις πέτρες να κινούνται μαγικά σε συντονισμό με την ανάσα του γκνολ. Δεν λαμβάνει ζημιά όσο είναι έτσι καλυμμένος και φαίνεται πως βρίσκεται σε κανονικό λήθαργο μες στις πέτρες.\n\nΠιθανώς να μπορείς να σπάσεις τα στρώματα πέτρας με την αξίνα σου, αλλά _ετοιμάσου για μάχη όταν το κάνεις._ Ο γεωμάντης πρέπει να είναι η πηγή κάθε γαιοκινητικής μαγείας εδώ γύρω αλλά και αυτός που οργανώνει όλη τη δραστηριότητα των γκνολ. _Θα ήταν καλή ιδέα να εξοντώσεις τα γκνολ που είναι διάσπαρτα εδώ γύρω προτού το παλέψεις._
actors.mobs.gnollgeomancer.discover_hint=Αυτόν τον εχθρό τον βρίσκεις σε μια συγκεκριμένη αποστολή.

actors.mobs.gnollguard.name=γκνολ φρουρός
actors.mobs.gnollguard.def_verb=Απόκρουση
actors.mobs.gnollguard.spear_warn=Το γκνολ καταφέρνει ένα καίριο χτύπημα με την αιχμή του δόρατός του!
actors.mobs.gnollguard.desc=Ένα σκληρό και μεγαλόσωμο γκνολ που φέρει δόρυ και ασπίδα αλλά όχι κράνος. Οι φρουροί αυτοί είναι μάλλον εκπαιδευόμενα κτηνώδη γκνολ που αποβλέπουν στην προστασία του ορυχείου από εισβολείς της άγριας φύσης.\n\nΟ γκνολ φρουρός είναι αρκετά δυνατός για να κρατά το δόρυ στο ένα χέρι, αλλά δεν το χειρίζεται πολύ καλά. _Χρειάζεται ανοιχτό χώρο για να επιτίθεται από απόσταση και σου προκαλεί σημαντικά μικρότερη ζημιά αν βρεθείς δίπλα του._
actors.mobs.gnollguard.desc_armor=_Ένας κοντινός γνολ σκαπανέας κρατά μια συσκευή που παρέχει γαιώδη πανοπλία στον φύλακα, μειώνοντας ριζικά τη ζημιά που λαμβάνει._
actors.mobs.gnollguard.discover_hint=Αυτόν τον εχθρό τον βρίσκεις σε μια συγκεκριμένη αποστολή.

actors.mobs.gnollsapper.name=γκνολ σκαπανέας
actors.mobs.gnollsapper.desc=Ένα μικρό, αδύναμο αλλά και ευφυές γκνολ, με χλωμή γούνα και μια τσάντα γεμάτη μικροσυσκευές. Λογικά είναι εδώ για να βοηθούν με τη διερεύνηση και την εξόρυξη σκοτεινού χρυσού, και έχουν κι έναν φρουρό κοντά για προστασία. Είναι ικανοί για μάχη, αλλά οι επιθέσεις τους είναι ταπεινωτικά αδύναμες· όχι ισχυρότερες από ενός γκνολ ανιχνευτή.\n\nΑντί να μάχονται απευθείας, οι σκαπανείς προτιμούν να χρησιμοποιούν διάφορες μικροσυσκευές που κάνουν το βραχώδες περιβάλλον να πολεμά γι' αυτούς. Δεν γνωρίζουν οι ίδιοι από γαιοκινητική μαγεία, οπότε είναι πολύ πιθανό να χρησιμοποιούν τις συσκευές τους απερίσκεπτα. _Θα πρέπει να υπάρχουν πολλοί τρόποι να χρησιμοποιήσεις τις επιθέσεις τους εναντίον τους ή εναντίον του φρουρού τους._
actors.mobs.gnollsapper.discover_hint=Αυτόν τον εχθρό τον βρίσκεις σε μια συγκεκριμένη αποστολή.

actors.mobs.gnolltrickster.name=υποχθόνιο γκνολ
actors.mobs.gnolltrickster.desc=Ένα πλάσμα με αλλόκοτη όψη, ακόμη και για τις προδιαγραφές των γκνολ. Προχωράει σκυφτά με ένα μοχθηρό χαμόγελο, σχεδόν αγκαλιάζοντας τη σάκα που κρέμεται από τον ώμο του. Τα μάτια του είναι ορθάνοιχτα, με μια περίεργη μείξη φόβου και ενθουσιασμού.\n\nΈχει μια μεγάλη συλλογή κακοφτιαγμένων βελών στη σάκα του· όλα δείχνουν να είναι εμποτισμένα με ποικίλες επιβλαβείς ουσίες.
actors.mobs.gnolltrickster.discover_hint=Αυτόν τον εχθρό τον βρίσκεις σε μια συγκεκριμένη αποστολή.

actors.mobs.goldenmimic.name=χρυσός μίμος
actors.mobs.goldenmimic.desc=Οι μίμοι είναι μαγικά πλάσματα που μπορούν να πάρουν όποια μορφή θέλουν. Στις κατακόμβες, διαλέγουν σχεδόν πάντα το σχήμα ενός σεντουκιού. Έτσι προσελκύουν τους ανυποψίαστους εξερευνητές.\n\nΟι χρυσοί μίμοι είναι σκληρότεροι και προσελκύουν τους δυνατούς εξερευνητές. Έχουν καλύτερη λεία, αλλά είναι πολύ ισχυρότεροι από τους κανονικούς μίμους.

actors.mobs.golem.name=γκόλεμ
actors.mobs.golem.def_verb=Απόκρουση
actors.mobs.golem.desc=Τα γκόλεμ είναι μια προσπάθεια διόρθωσης των προηγούμενων σφαλμάτων στις μηχανές των νάνων, μέσω της νεοανακαλυφθείσας χρήσης μαγείας. Είναι πολύ πιο συμπαγή και αποτελεσματικά σε σχέση με το DM-300, ενώ παραμένουν εξαιρετικά φονικά.\n\nΠαρόλο που τα γκόλεμ είναι ακόμη πολύ μεγάλα για να χωρέσουν σε διαδρόμους, οι νάνοι τούς έχουν δώσει νέες μαγικές δυνάμεις για να τα εξισορροπήσουν. Τα γκόλεμ μπορούν να τηλεμεταφέρονται μεταξύ δωματίων – καθώς και να τηλεμεταφέρουν τους εχθρούς σε αυτά, όταν δεν τους φτάνουν.

actors.mobs.goo.name=Γκου
actors.mobs.goo.notice=ΓΚΛΟΥΡΠ-ΓΚΛΟΥΡΠ!
actors.mobs.goo.defeated=γκλουρπ... γκλουρπ...
actors.mobs.goo.!!!=!!!
actors.mobs.goo.pumpup=Το Γκου φουσκώνει τον εαυτό του!
actors.mobs.goo.enraged=εξαγρίωση
actors.mobs.goo.gluuurp=ΓΚΛΟΥΥΥΡΠ!
actors.mobs.goo.rankings_desc=Απορροφήθηκες από το Γκου
actors.mobs.goo.desc=Ελάχιστα είναι γνωστά για το Γκου. Είναι πιθανό να μην είναι καν ζωντανό πλάσμα, αλλά μια μάζα κακοήθων ουσιών από τους υπονόμους που κάπως απέκτησε βασική νοημοσύνη. Όπως και να 'χει, η σκοτεινή μαγεία ήταν αυτή που επέτρεψε την ύπαρξη του Γκου.\n\nΗ ζελατινένια του φύση το έχει κάνει να απορροφήσει πολλή σκοτεινή ενέργεια· νιώθεις ρίγος και μόνο που είσαι κοντά του. Εάν το Γκου μπορέσει να επιτεθεί με αυτήν την ενέργεια, δεν θα ζήσεις για πολύ.

actors.mobs.greatcrab.name=γιγάντιος κάβουρας
actors.mobs.greatcrab.noticed=Ο κάβουρας αποκρούει με την τεράστια δαγκάνα του.
actors.mobs.greatcrab.def_verb=Απόκρουση
actors.mobs.greatcrab.desc=Αυτός ο κάβουρας είναι γιγαντιαίος, ακόμα και σε σύγκριση με τα άλλα καβούρια του υπονόμου. Το μπλε του κέλυφος είναι γεμάτο ρωγμές και στρείδια που φανερώνουν τη μεγάλη του ηλικία. Σέρνεται τριγύρω και ίσα που κρατά ισορροπία με την τεράστια δαγκάνα του.\n\nΑν και ο κάβουρας έχει μόνο μία δαγκάνα, το μέγεθός της εξισορροπεί την κατάσταση. Την υψώνει μπροστά σε κάθε απειλή και καλύπτεται, έτσι, από ένα απρόσβλητο τείχος κελύφους. Δεν μπορεί, όμως, να αποκρούσει αιφνίδιες επιθέσεις ή επιθέσεις από πολλούς εχθρούς ταυτόχρονα.
actors.mobs.greatcrab.discover_hint=Αυτόν τον εχθρό τον βρίσκεις σε μια συγκεκριμένη αποστολή.

actors.mobs.guard.name=δεσμοφύλακας
actors.mobs.guard.scorpion=Έλα εδώ!
actors.mobs.guard.def_verb=Απόκρουση
actors.mobs.guard.desc=Οι άλλοτε φρουροί της φυλακής έχουν γίνει ίδιοι με τους φυλακισμένους. Περιπλανώνται άσκοπα στις αίθουσες σαν τα ζόμπι, ψάχνοντας για οτιδήποτε δεν ανήκει εδώ – όπως εσύ!\n\nΦέρουν αλυσίδες τυλιγμένες στον μηρό, προφανώς για να τραβούν τους εχθρούς σε κοντινή απόσταση.

actors.mobs.hermitcrab.name=κάβουρας ερημίτης
actors.mobs.hermitcrab.def_verb=Απόκρουση
actors.mobs.hermitcrab.desc=Για τους δικούς του λόγους, αυτό το καβούρι υπονόμων έχει φορέσει το πάνω μέρος ενός σπασμένου βαρελιού στο κεφάλι του! Το επιπλέον βάρος το έχει επιβραδύνει σε μια φυσιολογική ταχύτητα, αλλά του χαρίζει και σημαντικά περισσότερη άμυνα. Σαν κάτι, όμως, να ακούγεται να χοροπηδά μες στο βαρέλι...

actors.mobs.mimic.name=μίμος
actors.mobs.mimic.reveal=Αυτό το σεντούκι είναι μίμος!
actors.mobs.mimic.hidden_hint=Κάτι δεν πάει καλά με αυτό το σεντούκι... Ίσως είναι κακή ιδέα να πας να το ανοίξεις.
actors.mobs.mimic.desc=Οι μίμοι είναι μαγικά πλάσματα που μπορούν να πάρουν όποια μορφή θέλουν. Στις κατακόμβες, διαλέγουν σχεδόν πάντα το σχήμα ενός σεντουκιού. Έτσι προσελκύουν τους ανυποψίαστους εξερευνητές.\n\nΟι μίμοι έχουν άσχημο δάγκωμα, αλλά συνήθως περιέχουν περισσότερο θησαυρό από ένα απλό σεντούκι.
actors.mobs.mimic.discover_hint=Αυτόν τον εχθρό τον βρίσκεις οπουδήποτε στην κατακόμβη.

actors.mobs.necromancer.name=νεκρομάντης
actors.mobs.necromancer.desc=Αυτοί οι μαθητευόμενοι σκοτεινοί μάγοι έχουν μαζευτεί στη φυλακή, αφού είναι το τέλειο μέρος για να εξασκήσουν τη διαβολική τους τέχνη.\n\nΟι νεκρομάντες υλοποιούν και ενδυναμώνουν σκελετούς για να πολεμούν στη θέση τους. Με τον θάνατο του νεκρομάντη, πεθαίνει και ο σκελετός που είχε υλοποιήσει.
actors.mobs.necromancer$necroskeleton.name=σκελετός του νεκρομάντη
actors.mobs.necromancer$necroskeleton.desc=Αυτός ο σκελετός έχει υλοποιηθεί από έναν νεκρομάντη. Συμπεριφέρεται σαν κανονικός σκελετός, και θα πεθάνει όταν σκοτωθεί ο νεκρομάντης που τον υλοποίησε.

actors.mobs.mob.died=Ακούς κάτι να πεθαίνει από μακριά.
actors.mobs.mob.rage=#$%^
actors.mobs.mob.rankings_desc=Εξοντώθηκες από: %s
actors.mobs.mob.discover_hint=Αυτόν τον εχθρό τον βρίσκεις σε μια συγκεκριμένη τοποθεσία της κατακόμβης.

actors.mobs.monk.name=νάνος μοναχός
actors.mobs.monk.def_verb=Απόκρουση
actors.mobs.monk.parried=Απόκρουση
actors.mobs.monk.desc=Αυτοί είναι φανατικοί μοναχοί που έχουν αφιερώσει τη σωματική τους ρώμη στην προστασία του βασιλιά τους. Τόσο μεγάλη είναι η αφοσίωσή τους, που έχουν παραδώσει πλήρως το πνεύμα τους στον βασιλιά. Πλέον περιφέρονται στην πόλη των νάνων σαν ανεγκέφαλα ζόμπι.\n\nΟι μοναχοί βασίζονται αποκλειστικά στη μάχη σώμα-με-σώμα, και μπορούν να χρησιμοποιούν τις γυμνές τους γροθιές για επίθεση και άμυνα. Όταν συγκεντρώνονται, αποκρούουν πάντα την επόμενη φυσιολογική επίθεση εναντίον τους – ακόμη κι αν ήταν εγγυημένη να επιτύχει. Οι μοναχοί συγκεντρώνονται πιο γρήγορα όταν κινούνται και πιο αργά στην άμεση μάχη.
actors.mobs.monk$focus.name=συγκέντρωση
actors.mobs.monk$focus.desc=Αυτός ο μοναχός έχει επικεντρωθεί στον στόχο του, και φαίνεται να αναμένει τις κινήσεις του προτού αυτός τις κάνει.\n\nΌσο ο μοναχός είναι συγκεντρωμένος, η επόμενη φυσιολογική επίθεση εναντίον του είναι εγγυημένη να αποτύχει – ανεξάρτητα από τις συνθήκες. Η συγκέντρωση του μοναχού θα εξαντληθεί μόλις αποκρούσει την επόμενη επίθεση· θα χρειαστεί να την αναπτύξει εκ νέου για να αποκρούσει κι άλλη επίθεση. Οι μοναχοί συγκεντρώνονται γρηγορότερα όταν κινούνται.

actors.mobs.phantompiranha.name=φασματικό πιράνχας
actors.mobs.phantompiranha.teleport_away=Το φασματικό πιράνχας τηλεμεταφέρεται μακριά...
actors.mobs.phantompiranha.desc=Τα φασματικά πιράνχας είναι μια σπάνια ράτσα με μαγικές ικανότητες και απόκοσμα ημιδιαφανή σώματα. Μπορούν να τηλεμεταφέρονται όταν δέχονται επίθεση, είτε για να ξεφύγουν είτε για να προσεγγίσουν γρήγορα τον εχθρό! \n\nΑν και εξοργιστικά στη μάχη, το κρέας τους αναγνωρίζεται για τις μαγικές του ιδιότητες.

actors.mobs.piranha.name=γιγαντιαίο πιράνχας
actors.mobs.piranha.desc=Αυτά τα σαρκοφάγα ψάρια έχουν αναθρεφτεί ειδικά για να προστατεύουν πλημμυρισμένες περιοχές. Το δάγκωμα τους είναι θανατηφόρο, άρα είναι καλύτερο κανείς να αποφύγει να τα αντιμετωπίσει ευθέως.
actors.mobs.piranha.discover_hint=Αυτόν τον εχθρό τον βρίσκεις οπουδήποτε στην κατακόμβη.

actors.mobs.pylon.name=πυλώνας ισχύος
actors.mobs.pylon.desc_inactive=Ένας πυλώνας ισχύος, προορισμένος να κατανέμει τον ηλεκτρισμό που τροφοδοτεί τις μηχανές της περιοχής.\n\nΟ πυλώνας είναι απενεργοποιημένος, προς το παρόν, κι απρόσβλητος από κάθε είδος ζημιάς.
actors.mobs.pylon.desc_active=Ένας πυλώνας ισχύος, προορισμένος να κατανέμει τον ηλεκτρισμό που τροφοδοτεί τις μηχανές της περιοχής. Ο πυλώνας εκτινάσσεται με ηλεκτρική ενέργεια· αυτός πρέπει να υπερφορτίζει το DM-300!\n\nΟι πυλώνες είναι ευάλωτοι σε αυτήν την κατάσταση, αλλά εκπέμπουν ηλεκτρικά τόξα στις διπλανές θέσεις με τη φορά των δεικτών του ρολογιού. Χάρη στη βαριά μεταλλική κατασκευή τους, οι πυλώνες είναι ανθεκτικοί σε μεγάλες ποσότητες ζημιάς.

actors.mobs.rat.name=μαρσιποφόρος αρουραίος
actors.mobs.rat.desc=Οι μαρσιποφόροι αρουραίοι είναι επιθετικοί αλλά σχετικά αδύναμοι κάτοικοι των υπονόμων. Το δάγκωμά τους είναι δυσάρεστο, αλλά γίνονται επικίνδυνοι μόνο σε μεγάλους αριθμούς.

actors.mobs.ripperdemon.name=δαίμονας αντεροβγάλτης
actors.mobs.ripperdemon.leap=Ο δαίμονας αντεροβγάλτης ετοιμάζεται να χυμήξει!
actors.mobs.ripperdemon.desc=Αυτά τα φρικιαστικά πλάσματα είναι το αποτέλεσμα της εκμετάλλευσης των πτωμάτων των νάνων από δαιμονικές δυνάμεις. Οι δαίμονες αντεροβγάλτες είναι αποσκελετωμένα και μακάβρια πλάσματα. Μοιάζουν με νάνους, αλλά έχουν σπασμένα σώματα και μακριά σουβλερά νύχια από κόκκαλo.\n\nΟι αντεροβγάλτες δεν είναι και πολύ ανθεκτικοί, αλλά είναι ευκίνητοι κι επικίνδυνοι. Είναι ικανοί να πηδούν σε μεγάλες αποστάσεις για να φτάνουν τους στόχους τους και να τους κατακρεουργούν με τα νύχια τους.

actors.mobs.rotheart.name=σαπιοκαρδιά
actors.mobs.rotheart.desc=Ο καρπός του σαπιόμουρου είναι πολύ ιδιαίτερος. Αντί να σαπίζει και να αποβάλλει θρεπτικά στοιχεία, ο καρπός μεγαλώνει, σκληραίνει και περιβάλλει τον σπόρο. Προσφέρει προστασία στα όργανα που μεγαλώνουν μέσα στον καρπό. Αυτή η γιγάντια σφαίρα είναι γνωστή ως η καρδιά του ενήλικου σαπιόμουρου.
actors.mobs.rotheart.discover_hint=Αυτόν τον εχθρό τον βρίσκεις σε μια συγκεκριμένη αποστολή.

actors.mobs.rotlasher.name=σαπιομαστιγωτής
actors.mobs.rotlasher.desc=Ο σαπιομαστιγωτής είναι τμήμα από τη ρίζα του ώριμου σαπιόμουρου, καθώς και ο βασικός του αμυντικός μηχανισμός. Οι μαστιγωτές είναι τυφλοί και κολλημένοι στο έδαφος, αλλά επιτίθενται βίαια σε οποιαδήποτε διπλανή απειλή αφού την εντοπίσουν μετά από μια στιγμή. Παραμένουν ακίνητοι όταν δεν υπάρχουν κοντινοί εχθροί και προσπαθούν να αναμειχθούν με την περιβάλλουσα βλάστηση.
actors.mobs.rotlasher.discover_hint=Αυτόν τον εχθρό τον βρίσκεις σε μια συγκεκριμένη αποστολή.

actors.mobs.scorpio.name=σκορπιός
actors.mobs.scorpio.desc=Αυτά τα τεράστια δαιμονικά αρθρόποδα αποφεύγουν την κοντινή μάχη. Προτιμούν να κρατούν μεγάλες αποστάσεις και να εκτοξεύουν οδοντωτά καρφιά που σακατεύουν.

actors.mobs.senior.name=ανώτερος μοναχός
actors.mobs.senior.desc=Αυτοί είναι φανατικοί μοναχοί που έχουν αφιερώσει τη σωματική τους ρώμη στην προστασία του βασιλιά τους. Τόσο μεγάλη είναι η αφοσίωσή τους, που έχουν παραδώσει πλήρως το πνεύμα τους στον βασιλιά. Πλέον περιφέρονται στην πόλη των νάνων σαν ανεγκέφαλα ζόμπι.\n\nΑυτός ο μοναχός είναι δεξιοτέχνης στη μάχη σώμα-με-σώμα. Συγκεντρώνεται πολύ πιο γρήγορα από τους κοινούς μοναχούς όταν κινείται. Όταν συγκεντρωθεί, θα αποκρούσει την επόμενη φυσιολογική επίθεση εναντίον του--ακόμη κι αν ήταν εγγυημένη να επιτύχει. Οι μοναχοί συγκεντρώνονται πιο γρήγορα όταν κινούνται, και πιο αργά στην άμεση μάχη.

actors.mobs.shaman.name=γκνολ σαμάνος
actors.mobs.shaman.bolt_kill=Η μαγική ριπή σε εξόντωσε...
actors.mobs.shaman.desc=Οι σαμάνοι είναι ευφυή γκνολ που χρησιμοποιούν πολεμικά ξόρκια στη μάχη, μιας και υστερούν στη σωματική ρώμη. Έχουν πολύ σεβαστή θέση στην κοινωνία των γκνολ παρά τη χαμηλή τους δύναμη.
actors.mobs.shaman$redshaman.spell_desc=Αυτός ο σαμάνος φορά μια κόκκινη μάσκα, και χρησιμοποιεί μαγεία που _αποδυναμώνει προσωρινά την επίθεσή σου._
actors.mobs.shaman$blueshaman.spell_desc=Αυτός ο σαμάνος φορά μια μπλε μάσκα, και χρησιμοποιεί μαγεία που _αυξάνει προσωρινά τη ζημιά που δέχεσαι._
actors.mobs.shaman$purpleshaman.spell_desc=Αυτός ο σαμάνος φορά μια μωβ μάσκα, και χρησιμοποιεί μαγεία που _μειώνει προσωρινά την ακρίβεια και την αποφυγή σου._

actors.mobs.armoredbrute.name=εξοπλισμένο κτήνος
actors.mobs.armoredbrute.desc=Τα ανώτερα κτηνώδη γκνολ φορούν ισχυρές πανοπλίες για να δείξουν το κύρος τους. Η πανοπλία κάνει αυτά τα κτήνη πολύ πιο ανθεκτικά σε φυσιολογικές επιθέσεις. Επίσης, χάρη στην αυστηρή πειθαρχία τους, μπορούν να εξαγριωθούν για περισσότερη ώρα προτού υποκύψουν στις πληγές τους.

actors.mobs.skeleton.name=σκελετός
actors.mobs.skeleton.explo_kill=Εξοντώθηκες από την έκρηξη οστών...
actors.mobs.skeleton.def_verb=Απόκρουση
actors.mobs.skeleton.desc=Οι σκελετοί αποτελούνται από οστά άτυχων εξερευνητών και κατοίκων της φυλακής. Κινούνται χάρη στη μοχθηρή μαγεία που αναδύεται από τα έγκατα. Αφού τραυματιστούν αρκετά, θα διαλυθούν σε μια έκρηξη οστών. Τα θραύσματα αυτής της έκρηξης είναι επιβλαβή για οτιδήποτε κοντινό, αλλά η πανοπλία είναι πολύ αποτελεσματική στον μετριασμό της.

actors.mobs.slime.name=χλαπάτσα
actors.mobs.slime.def_verb=Απορρόφηση
actors.mobs.slime.desc=Οι χλαπάτσες είναι παράξενα και ελαφρώς μαγικά πλάσματα, με ελαστικό εξωτερικό στρώμα και υγρό πυρήνα. Οι υπόνομοι τους παρέχουν άφθονο νερό και θρεπτικές ουσίες.\n\nΕξαιτίας της ελαστικής τους μεμβράνης, είναι δύσκολο να τους προκαλέσεις πάνω από _6 ζημιά_ με οποιαδήποτε επίθεση.

actors.mobs.snake.name=φίδι υπονόμου
actors.mobs.snake.hint=Χρησιμοποίησε το κουμπί εξέτασης σε ένα φίδι για να μάθεις πώς να τα αντιμετωπίζεις.
actors.mobs.snake.desc=Αυτά τα υπερμεγέθη ερπετά είναι ικανά να ελίσσονται στα χτυπήματα· αυτό το κάνει δύσκολο να τα πετύχεις. Οι μαγικές ή οι αιφνίδιες επιθέσεις, όμως, μπορούν να τα πιάσουν απροετοίμαστα.\n\nΘα εκτελέσεις αιφνίδια επίθεση αν το χτυπήσεις ενώ βρίσκεσαι εκτός του οπτικού του πεδίου. Ένας τρόπος είναι να αφήσεις το φίδι να σε κυνηγήσει μέσα από μια πόρτα και _να το χτυπήσεις αμέσως μόλις μπει στην πόρτα._

actors.mobs.spectralnecromancer.name=φασματικός νεκρομάντης
actors.mobs.spectralnecromancer.desc=Αν και ο σκελετός είναι το σήμα κατατεθέν του νεκρομάντη, κάποιοι έχουν τις βλέψεις τους σε λιγότερο σαρκικούς υπηκόους. Τα στοιχειά είναι οι επίλεκτοι υπήκοοι των φασματικών νεκρομάντεων!\n\nΕνα στοιχειό από μόνο του δεν είναι τόσο δυνατό όσο ο σκελετός – αλλά αυτοί οι νεκρομάντες δεν διστάζουν να υλοποιήσουν ένα τσούρμο από αυτά!

actors.mobs.spinner.name=υφαντουργός σπηλαίων
actors.mobs.spinner.desc=Αυτές οι τριχωτές πρασινωπές αράχνες αποφεύγουν την απευθείας μάχη. Προτιμούν να περιμένουν σε απόσταση ενώ το θύμα αγωνιά στον ιστό τους, αργοπεθαίνοντας από το δηλητηριώδες δάγκωμά τους. Είναι ικανές να εκτοξεύουν τον ιστό σε μεγάλες αποστάσεις. Θα προσπαθήσουν να εμποδίσουν τον δρόμο του θύματος πετώντας τον ιστό στο διάβα του.

actors.mobs.statue.name=κινούμενο άγαλμα
actors.mobs.statue.def_verb=Απόκρουση
actors.mobs.statue.desc=Θα έλεγες ότι είναι άλλο ένα άψυχο άγαλμα της κατακόμβης, αλλά τα λαμπερά του κόκκινα μάτια το προδίδουν.
actors.mobs.statue.desc_weapon=Ενώ το ίδιο το άγαλμα είναι πέτρινο, ο εξοπλισμός του _(%s)_ φαίνεται αληθινός.
actors.mobs.statue.discover_hint=Αυτόν τον εχθρό τον βρίσκεις οπουδήποτε στην κατακόμβη.

actors.mobs.succubus.name=σούκουμπους
actors.mobs.succubus.desc=Οι σούκουμπους είναι μεταμορφικοί δαίμονες που παραποιούν το μυαλό των θηραμάτων τους. Αυτή έχει πάρει τη μορφή ενός χλωμού γοτθικού ανθρωποειδούς... μήπως για να προσελκύει τους νάνους αρχιμάγους;\n\nΟι σούκουμπους μπορούν να γοητεύουν τον εχθρό τους όταν επιτίθενται, καθιστώντας τον ανίκανο να τους επιτεθεί απευθείας. Όταν επιτίθενται σε γοητευμένο εχθρό, του αποσπούν ένα μέρος της ζωτικής του ουσίας.

actors.mobs.swarm.name=σμήνος μυγών
actors.mobs.swarm.desc=Το θανατηφόρο σμήνος μυγών βουίζει άγρια. Κάθε μη μαγική επίθεση θα το χωρίσει σε δύο μικρότερα –αλλά εξίσου επικίνδυνα– σμήνη.

actors.mobs.tengu.name=Τένγκου
actors.mobs.tengu.notice_gotcha=%s! Σ' έπιασα!
actors.mobs.tengu.interesting=Ας το κάνουμε ενδιαφέρον...
actors.mobs.tengu.notice_have=%s! Τώρα να σε δω!
actors.mobs.tengu.defeated=Επιτέλους ελεύθερος...
actors.mobs.tengu.rankings_desc=Δολοφονήθηκες από τον Τένγκου
actors.mobs.tengu.desc=Ένας διάσημος και αινιγματικός δολοφόνος. Ονομάστηκε έτσι από τη μάσκα που είναι προσκολλημένη στο πρόσωπό του.\n\nΟ Τένγκου συγκρατείται με μεγάλα περιβραχιόνια στους καρπούς και τα γόνατα, αν και φαίνεται πως έχει ξεφορτωθεί τις αλυσίδες εδώ και καιρό.\n\nΘα χρησιμοποιήσει παγίδες, παραπλανητική μαγεία κι ακριβείς επιθέσεις για να εξοντώσει το μοναδικό πράγμα που τον αποτρέπει από το να διαφύγει: εσένα.

actors.mobs.tengu$bombability$bombblob.desc=Ένα νέφος υπέρθερμου καπνού αναδίδεται εδώ. Πρόσεχε, γιατί θα εκραγεί!
actors.mobs.tengu$bombability$bombitem.name=Βόμβα καπνού
actors.mobs.tengu$bombability$bombitem.cant_pickup=Είναι κολλημένη στο έδαφος... δεν μπορείς να τη μετακινήσεις!
actors.mobs.tengu$bombability$bombitem.desc=Εδώ ο Τένγκου έχει πετάξει μια παράξενη καπνοβομβίδα που αναδίδει έναν παχύ και καυτό καπνό. Ακούγεται ένα δυνατό τικ-τακ· λες και μετράει αντίστροφα πριν την έκρηξη!\n\nΗ βόμβα έχει αγκιστρωθεί στο έδαφος και δεν μπορείς να την πάρεις.

actors.mobs.tengu$fireability$fireblob.desc=Ο Τένγκου έχει πετάξει μια λεπτή σκόνη που μετατρέπεται σε ατμό· είναι έτοιμη να αναφλεχθεί!

actors.mobs.tengu$shockerability$shockerblob.desc=Εδώ συσσωρεύεται ηλεκτρική ενέργεια. Οτιδήποτε στέκεται σε αυτό το τετράγωνο θα ηλεκτριστεί στον επόμενο γύρο!
actors.mobs.tengu$shockerability$shockeritem.name=Ηλεκτριστής
actors.mobs.tengu$shockerability$shockeritem.cant_pickup=Εκπέμπει υπερβολικό ηλεκτρισμό... δεν μπορείς να τον πιάσεις!
actors.mobs.tengu$shockerability$shockeritem.desc=Εδώ ο Τένγκου έχει πετάξει μια περίεργη συσκευή· μοιάζει να είναι κατασκευασμένη από κομμάτια του DM-100. Η συσκευή διαχέει ηλεκτρικό ρεύμα γύρω της, το οποίο, όμως, φαίνεται να κινείται σε προβλεπόμενο μοτίβο.\n\nΜε τόσο ηλεκτρισμό γύρω της, είναι αδύνατο να την πάρεις.

actors.mobs.thief.name=τρελός ληστής
actors.mobs.thief.stole=Ο ληστής σού έκλεψε: %s!
actors.mobs.thief.carries=\n\nΟ ληστής κουβαλά: _%s._ Ένα προφανώς κλεμμένο αντικείμενο.
actors.mobs.thief.escapes=Ο ληστής ξεφεύγει με: %s!
actors.mobs.thief.desc=Παρότι οι κρατούμενοι περιφέρονται έξω από τα κελιά τους, το μέρος αυτό παραμένει η φυλακή τους. Με το πέρασμα του χρόνου έχουν χάσει τόσο τα μυαλά όσο και την ελευθερία τους. Οι τρελοί ληστές και κακοποιοί έχουν ξεχάσει ποιοι είναι και γιατί κλέβουν εδώ και πολύ καιρό.\n\nΑυτοί οι εχθροί είναι πιο πιθανό να κλέψουν και να το σκάσουν παρά να πολεμήσουν. Έχε τα μάτια σου πάνω τους, αλλιώς μπορεί να μην ξαναδείς το κλεμμένο σου αντικείμενο.

actors.mobs.tormentedspirit.name=βασανισμένο πνεύμα
actors.mobs.tormentedspirit.desc=Τα βασανισμένα πνεύματα είναι κατά τα άλλα καλοσυνάτα πνεύματα που όμως έχουν πληγεί από κατάρα. Επιτίθενται όπως τα στοιχειά ενόσω είναι καταραμένα, αλλά είναι και ισχυρότερά τους!\n\nΊσως να μπορείς να εξαγνίσεις την κατάρα αν χρησιμοποιήσεις το κατάλληλο αντικείμενο ενώ στέκεσαι δίπλα στο πνεύμα. Το πνεύμα θα είναι σίγουρα ευγνώμον αν αρθεί η κατάρα...
actors.mobs.tormentedspirit.thank_you=Ευχαριστώ...

actors.mobs.warlock.name=νάνος αρχιμάγος
actors.mobs.warlock.bolt_kill=Η ριπή σκότους σε εξόντωσε...
actors.mobs.warlock.desc=Όταν τα ενδιαφέροντα των νάνων μεταστράφηκαν, από τη μηχανική στις απόκρυφες τέχνες, οι αρχιμάγοι απέκτησαν δύναμη στην πόλη. Ξεκίνησαν με τη στοιχειακή μαγεία και σύντομα κατέληξαν στη δαιμονολογία και τη νεκρομαντεία. Τελικά, ο ισχυρότερος εξ αυτών κατέλαβε τον θρόνο της πόλης. Στους υπόλοιπους επιτράπηκε η εξάσκηση της σκοτεινής μαγείας, εφόσον παρέδιδαν τη θέλησή τους σε αυτόν.\n\nΟι αρχιμάγοι κατέχουν πανίσχυρη μαγεία που μπορεί να διαταράξει προσωρινά τη μαγεία αναβάθμισης του εξοπλισμού σου. Όσο πιο αναβαθμισμένο είναι ένα αντικείμενο, τόσο περισσότερο θα επηρεαστεί.

actors.mobs.wraith.name=στοιχειό
actors.mobs.wraith.desc=Το στοιχειό είναι το εκδικητικό πνεύμα ενός αμαρτωλού, του οποίου ο τάφος βεβηλώθηκε. Όντας αιθέριο, είναι πολύ δύσκολο να χτυπηθεί με κανονικό όπλο.
actors.mobs.wraith.discover_hint=Αυτόν τον εχθρό τον βρίσκεις οπουδήποτε στην κατακόμβη.

actors.mobs.yogdzewa.name=Yog-Dzewa
actors.mobs.yogdzewa.notice=ΣΕ. ΒΛΕΠΩ. ΤΩΡΑ.
actors.mobs.yogdzewa.darkness=Το σκότος πλησιάζει...
actors.mobs.yogdzewa.hope=Η. ΕΛΠΙΔΑ. ΣΟΥ. ΕΙΝΑΙ. ΜΙΑ. ΨΕΥΔΑΙΣΘΗΣΗ!
actors.mobs.yogdzewa.defeated=...
actors.mobs.yogdzewa.rankings_desc=Καταβροχθίστηκες από τον Yog-Dzewa
actors.mobs.yogdzewa.desc=Ο Yog-Dzewa είναι ένας Παλιός Θεός· ένα τερατούργημα που κατασπαράζει κόσμους θνητών για να τροφοδοτεί την ατέρμονη ανάπτυξή του. Οι νάνοι τράβηξαν την προσοχή του ενώ έπαιζαν με σκοτεινές μαγείες, και έκτοτε προσπαθούν να τον κρατούν υπό έλεγχο.\n\nΟ Yog-Dzewa προέρχεται από μια διάσταση ωμού μαγικού χάους, και δεν μπορεί να φέρει την πραγματική του μορφή σε αυτόν τον κόσμο. Αντ' αυτού, έχει δημιουργήσει είδωλα κι έχει υλοποιήσει δαιμονικούς υπηκόους που εκτελούν το διάταγμά του.\n\nΑυτό το γιγάντιο μάτι είναι το κεντρικό σημείο της ισχύος του Yog-Dzewa στον κόσμο αυτόν. Αν και είναι στάσιμο, μπορεί να εκτοξεύει ισχυρές δέσμες δαιμονικής μαγείας και να υλοποιεί υπηκόους που το υποστηρίζουν στη μάχη.
actors.mobs.yogdzewa.desc_spawners=Νιώθεις κύματα δαιμονικής ενέργειας να εκπέμπονται στο μάτι από τα πάνω επίπεδα. Κάτι που άφησες ζωντανό εκεί πάνω πρέπει να διοχετεύει δύναμη στον Yog-Dzewa. _Ο Yog χρησιμοποιεί αυτήν την ενέργεια για να υλοποιεί ισχυρότερους υποτακτικούς!_
actors.mobs.yogdzewa$larva.name=κάμπια του θεού
actors.mobs.yogdzewa$larva.rankings_desc=Καταβροχθίστηκες από τον Yog-Dzewa
actors.mobs.yogdzewa$larva.desc=Αυτά τα μικροσκοπικά δημιουργήματα του Yog-Dzewa είναι απλοί υποτακτικοί που παράγονται εύκολα. Αν και είναι ατομικά αδύναμοι, δημιουργούνται γρήγορα και γίνονται αποπνικτικοί σε μεγάλους αριθμούς.
actors.mobs.yogdzewa$yogripper.rankings_desc=Καταβροχθίστηκες από τον Yog-Dzewa
actors.mobs.yogdzewa$yogeye.rankings_desc=Καταβροχθίστηκες από τον Yog-Dzewa
actors.mobs.yogdzewa$yogscorpio.rankings_desc=Καταβροχθίστηκες από τον Yog-Dzewa

actors.mobs.yogfist.invuln_warn=Η γροθιά είναι άτρωτη όσο είναι κοντά στο μάτι!
actors.mobs.yogfist.rankings_desc=Καταβροχθίστηκες από τον Yog-Dzewa
actors.mobs.yogfist.desc=Αυτή η γροθιά είναι μια μορφή της δύναμης του Yog-Dzewa. Οι γροθιές συνδέονται με την ισχύ του Yog-Dzewa και προστατεύονται από κάθε είδους ζημιά όσο είναι κοντά στο μάτι.
actors.mobs.yogfist$burningfist.name=πύρινη γροθιά
actors.mobs.yogfist$burningfist.desc=Αυτή η γροθιά είναι φτιαγμένη από χαοτική φλογερή μαγεία. Θα αναφλέγει συνεχώς το έδαφος γύρω της ενώ κινείται. Προκαλεί, επίσης, εκρήξεις πύρινης ισχύος, οι οποίες εξαπλώνουν φλόγες στα σημεία πρόσκρουσης.\n\nΗ ικανότητα της γροθιάς να εξαπλώνει φλόγες καταπνίγεται όταν βρίσκεται κοντά σε νερό· αλλά η μεγάλη της θερμότητα θα το εξατμίσει μετά από λίγο!
actors.mobs.yogfist$soiledfist.name=γαιώδης γροθιά
actors.mobs.yogfist$soiledfist.desc=Αυτή η γροθιά είναι φτιαγμένη από χαοτική γαιώδη μαγεία. Θα κάνει τη βλάστηση να ξεπηδά διαρκώς γύρω της καθώς κινείται. Προκαλεί, επίσης, συγκεντρωμένες γαιώδεις εκρήξεις, οι οποίες παγιδεύουν τον στόχο με κλήματα και ρίζες!\n\nΗ γροθιά απορροφά δύναμη από αυτήν τη βλάστηση· θα αντιστέκεται στη ζημιά ανάλογα με την ποσότητα ψηλής ή στραπατσαρισμένης βλάστησης γύρω της!
actors.mobs.yogfist$rottingfist.name=σαπιογροθιά
actors.mobs.yogfist$rottingfist.desc=Αυτή η γροθιά έχει δημιουργηθεί από ζωντανή διαφθορά. Είναι μια επιβλητική μάζα σάπιας σάρκας, η οποία εξαπλώνει καυστική γλίτσα σε μάχη εξ επαφής και τοξικό αέριο από απόσταση. Ακόμα χειρότερα, εξ αιτίας της τεράστιας μάζας της, οι επιθέσεις απλώς τη ματώνουν αντί να της προκαλούν τη ζημιά απευθείας.\n\nΗ γλίτσα ξεπλένεται στο νερό, αλλά και η γροθιά μπορεί να απορροφά νερό για να θεραπεύεται! Αν της προκληθεί ζημιά ενώ ματώνει, η επίδραση της αιμορραγίας θα ανανεωθεί – αλλά δεν επιδεινώνεται!
actors.mobs.yogfist$rustedfist.name=σκουριασμένη γροθιά
actors.mobs.yogfist$rustedfist.desc=Αυτή η γροθιά έχει δημιουργηθεί από ζωντανό μέταλλο. Είναι μια επιβλητική μάζα κινούμενου μετάλλου με ισχυρές επιθέσεις εξ επαφής. Μπορεί, επίσης, να σακατεύει τους στόχους της από απόσταση. Χάρη στην τρομερή της μάζα, η γροθιά λαμβάνει όλη τη ζημιά σταδιακά αντί για ακαριαία.\n\nΗ γροθιά, όμως, είναι δυσκίνητη και δεν μπορεί να μπει σε στενά περάσματα. Επιπλέον, αν και λαμβάνει σταδιακά τη ζημιά, η ποσότητα της αναβεβλημένης ζημιάς συνεχίζει να αυξάνεται με κάθε νέο χτύπημα που δέχεται.
actors.mobs.yogfist$brightfist.name=φωτεινή γροθιά
actors.mobs.yogfist$brightfist.teleport=Η γροθιά τηλεμεταφέρεται με μια λάμψη φωτός που σε εκτυφλώνει!
actors.mobs.yogfist$brightfist.desc=Αυτή η γροθιά είναι δημιουργημένη από ενέργεια αγνού φωτός. Είναι ικανή να εξαπολύει ακτίνες αποπνικτικού φωτός κάθε γύρο! Αυτές οι ακτίνες τυφλώνουν προσωρινά και προκαλούν βαριά ζημιά. Επιπλέον, η γροθιά μπορεί να σκεπάζει την αρένα με εκτυφλωτικό φως για να ξεφεύγει!\n\nΗ γροθιά, όμως, δεν έχει ειδικές ικανότητες στη μάχη εξ επαφής.
actors.mobs.yogfist$darkfist.name=σκοτεινή γροθιά
actors.mobs.yogfist$darkfist.teleport=Η γροθιά τηλεμεταφέρεται με μια έκρηξη σκότους που σβήνει την πηγή φωτός σου!
actors.mobs.yogfist$darkfist.desc=Αυτή η γροθιά είναι φτιαγμένη από ενέργεια αμιγούς σκότους. Είναι ικανή να προκαλεί εκρήξεις σκοτεινής μαγείας κάθε γύρο! Αυτές οι εκρήξεις αποδυναμώνουν την πηγή φωτός σου και προκαλούν βαριά ζημιά. Επιπλέον, η γροθιά είναι ικανή να σκεπάζει την αρένα με σκοτάδι για να ξεφεύγει!\n\nΗ γροθιά, όμως, δεν έχει ειδικές ικανότητες στη μάχη εξ επαφής.


actors.char.kill=Εξοντώθηκες από: %s...
actors.char.defeat=εξόντωσες: %s.
actors.char.def_verb=Αποφυγή
actors.char.invulnerable=Ατρωσία
actors.char.immune=Ανοσία

# Eternity PD Fallback Keys
actors.blobs.blizzard.desc=A blizzard is swirling here.
actors.blobs.confusiongas.desc=A cloud of confusion gas is swirling here.
actors.blobs.dancefloor.desc=Dance dance dance!\n%s dancing tile: %s\nNext color: %s
actors.blobs.dancefloor.color_1_name=Red
actors.blobs.dancefloor.color_1_desc=Characters standing on this tile take direct damage (massively increased vs hero)
actors.blobs.dancefloor.color_2_name=Green
actors.blobs.dancefloor.color_2_desc=Characters standing on this tile act at 2x speed
actors.blobs.dancefloor.color_3_name=Blue
actors.blobs.dancefloor.color_3_desc=Characters standing on this tile are stunned
actors.blobs.dancefloor.color_4_name=White
actors.blobs.dancefloor.color_4_desc=Characters standing on this tile take defered damage (massively increased vs hero)
actors.blobs.dancefloor.color_5_name=Yellow
actors.blobs.dancefloor.color_5_desc=Mobs killed on this tile give double EXP and more loot
actors.blobs.dancefloor.color_6_name=Purple
actors.blobs.dancefloor.color_6_desc=Characters standing on this tile take double damage
actors.blobs.dancefloor.rankings_desc=Danced into a grave
actors.blobs.dancefloor.ondeath=You danced into your own grave
actors.blobs.dancefloor$dancingdefereddamage.name=Dancing with Death
actors.blobs.dancefloor$dancingdefereddamage.desc=This is the most dangerous dance you've ever performed, and you are absolutely _ROCKING_ it, disregarding the pain!\n\nDeferred damage remaining: %d.
actors.blobs.dancefloor$dancingdefereddamage.ondeath=You danced into your own grave
actors.blobs.dancefloor$dancingdefereddamage.rankings_desc=Danced into a grave
actors.blobs.dancefloor$dancingdoom.name=Dancing in a grave
actors.blobs.dancefloor$dancingdoom.desc=Grave isn't the best place to dance in, but no one is stopping you!\n\nCharacters who are brave enough to dance in a grave will receive double damage from all sources.
actors.blobs.dancefloor$dancespeed.name=Dancing with Time
actors.blobs.dancefloor$dancespeed.desc=Your perfect dance synchronized with a rhythm of the universe, and not even time gonna stop you from dancing!\n\nWhile you dance is perfect, you will perform all actions at double speed.
actors.blobs.dancefloor$dancingstun.name=Stunned
actors.blobs.dancefloor$dancingstun.heromsg=You are stunned!
actors.blobs.dancefloor$dancingstun.desc=Nothing feels worse than being stunned in a middle of a dance\n\nStun completely halts all actions, forcing the target to wait until the effect wears off.
actors.blobs.electricity.desc=A field of electricity is sparking brightly here.
actors.blobs.electricity.rankings_desc=Electrocuted
actors.blobs.electricity.ondeath=You were shocked to death...
actors.blobs.fire.desc=A fire is raging here.
actors.blobs.foliage.desc=Shafts of light pierce the gloom of the underground garden.
actors.blobs.freezing.desc=The air is unnaturally frigid here.
actors.blobs.goowarn.desc=Specks of dark energy are swarming here!
actors.blobs.inferno.desc=An inferno is raging here.
actors.blobs.paralyticgas.desc=A cloud of paralytic gas is swirling here.
actors.blobs.sacrificialfire.desc=There is an altar here with a sacrificial fire burning atop it. Any creature that's killed here will be consumed as an offering to the spirits of the dungeon.\n\nPerhaps a reward will be given if enough sacrifices are made?
actors.blobs.sacrificialfire.worthy=The fire consumes your offering and grows stronger.
actors.blobs.sacrificialfire.unworthy=The fire consumes your offering, but doesn't change.
actors.blobs.sacrificialfire.reward=The fire flares and then dissipates, leaving a reward behind!
actors.blobs.smokescreen.desc=A cloud of thick black smoke is swirling here.
actors.blobs.stenchgas.desc=A cloud of fetid stench is swirling here.
actors.blobs.stormcloud.desc=A cloud of billowing water vapor is swirling here.
actors.blobs.toxicgas.desc=A greenish cloud of toxic gas is swirling here.
actors.blobs.toxicgas.rankings_desc=Suffocated
actors.blobs.toxicgas.ondeath=You died from the toxic gas...
actors.blobs.corrosivegas.desc=A cloud of deadly caustic gas is swirling here.
actors.blobs.waterofawareness.procced=As you take a sip, you feel knowledge pour into your mind.
actors.blobs.waterofawareness.desc=Power of knowledge radiates from the water of this well. Take a sip from it to reveal all secrets of equipped items and reveal all items on the current floor.
actors.blobs.waterofhealth.procced=As you take a sip, you feel your wounds heal completely.
actors.blobs.waterofhealth.desc=Power of health radiates from the water of this well. Take a sip from it to heal your wounds and satisfy hunger.
actors.blobs.wateroftransmutation.desc=Power of change radiates from the water of this well. Throw an item into the well to turn it into something else.
actors.blobs.web.desc=A thick web is covering everything here. Anything that touches or is thrown through the web will break it, but will also be stuck in place.
actors.buffs.adrenaline.name=adrenaline
actors.buffs.adrenaline.desc=A surge of physical power, adrenaline enhanced both attack and movement speed.\n\nAdrenaline allows its target to run at 2x speed, and attack at 1.5x speed.\n\nTurns remaining: %s.
actors.buffs.adrenalinesurge.name=strength boost
actors.buffs.adrenalinesurge.desc=A surge of great might, but sadly not permanent.\n\nStrength boost: +%d.\nTurns until boost weakens: %s.
actors.buffs.amok.name=amok
actors.buffs.amok.desc=Amok causes a state of great rage and confusion in its target.\n\nWhen a creature is amoked, they will attack whatever is near them, whether they be friend or foe.\n\nTurns of amok remaining: %s.
actors.buffs.arcanearmor.name=arcane armor
actors.buffs.arcanearmor.desc=A thin shield is surrounding you, blocking some of the damage from magical attacks.\n\nYour magical armor is currently boosted by: 0-%d.\n\nTurns until arcane armor weakens: %s.
actors.buffs.artifactrecharge.name=artifact recharging
actors.buffs.artifactrecharge.desc=Energy is coursing through you, increasing the rate your equipped artifacts charge.\n\nEach artifact is affected a little differently, but they will all gain charge much faster than normal.\n\nTurns remaining: %s.
actors.buffs.ascensionchallenge.name=amulet's curse
actors.buffs.ascensionchallenge.desc=Somehow Yog-Dzewa is maintaining influence on this world through the amulet, and is trying to stop your ascent!\n\nYog's power is making the dungeon much more dangerous, increasing the number of enemies and making them stronger! This power will keep building if left unchecked, it can be weakened by defeating enemies that have been enhanced by Yog's power.
actors.buffs.ascensionchallenge.desc_clear=The dark energy radiating from the amulet has been weakened as much as possible for now.
actors.buffs.ascensionchallenge.desc_beckon=The amulet is currently _calling out to distant enemies,_ alerting them to your position.
actors.buffs.ascensionchallenge.desc_haste=The amulet is currently _hastening distant enemies,_ letting them reach you faster!
actors.buffs.ascensionchallenge.desc_slow=The amulet is currently _slowing you down,_ and negating speed boosting effects!
actors.buffs.ascensionchallenge.desc_damage=The energy from the amulet has gotten so strong that it's _directly harming you!_
actors.buffs.ascensionchallenge.beckon=The amulet begins calling out to distant enemies.
actors.buffs.ascensionchallenge.haste=The amulet begins hastening distant enemies!
actors.buffs.ascensionchallenge.slow=The amulet starts to feel like a lead weight in your inventory!
actors.buffs.ascensionchallenge.damage=The amulet begins radiating dark energy. It burns!
actors.buffs.ascensionchallenge.weaken_info=You must defeat enemies to weaken the amulet's curse!
actors.buffs.ascensionchallenge.weaken=You can feel the amulet's curse weaken slightly.
actors.buffs.ascensionchallenge.break=You take a moment to catch your breath and feel your wounds begin to close!
actors.buffs.ascensionchallenge.almost=You feel Yog's grip on the amulet begin to weaken, you're almost there!
actors.buffs.ascensionchallenge.on_kill=The dark energy consumes you...
actors.buffs.barkskin.name=barkskin
actors.buffs.barkskin.desc=Your skin is hardened, it feels rough and solid like bark.\n\nThe hardened skin increases your effective armor, allowing you to better defend against physical attack.\n\nYour armor is currently increased by: 0-%d.\nTurns until barkskin weakens: %s.\n\nIf you receive barkskin from multiple sources, only the strongest one will apply.
actors.buffs.barrier.name=barrier
actors.buffs.barrier.desc=A durable bubble of force which blocks all damage.\n\nThe barrier will take damage for whatever it is protecting so long as there is shielding left. The shielding will also slowly decay over time.\n\nShielding remaining: %d.
actors.buffs.rageshield.name=Determination Shield
actors.buffs.rageshield.heromsg=You are protected by your rage!
actors.buffs.rageshield.desc=A durable bubble of your sheer rage saps away life force from nearby enemies, if you are wounded.\n\nThe barrier will drain health from enemies in your sight, angering them and taking damage. The shielding will have bigger effect if enemy is in adjacent to host.\n\nShielding remaining: %d.
actors.buffs.berserk.angered=angered
actors.buffs.berserk.berserk=berserking
actors.buffs.berserk.exhausted=exhausted
actors.buffs.berserk.recovering=recovering
actors.buffs.berserk.angered_desc=The severity of the Berserker's injuries strengthen his blows. As the berserker takes physical damage, his rage will build, granting him bonus damage. Damage which is blocked by armor still counts towards building rage.\n\nRage will fade over time. The lower the berserker's health, the longer it will last.\n\nAt 100%% rage, the Berserker can go berserk, granting him 2x his seal's max shielding, increasing to 6x if he has very low health. This shielding decays over time and once it runs out the berserker will have to rest before building rage again.\n\nCurrent Rage: _%.0f%%_\n_+%.0f%%_ damage
actors.buffs.berserk.berserk_desc=Fear and uncertainty bleed away, leaving only anger. In this state the Berserker is extremely powerful, _dealing +50% damage and gaining bonus shielding._\n\nThis bonus shielding is equal to 2x his seal's max shielding, increasing to 6x if he has very low health. When this shielding is reduced to 0, berserking will end.\n\nAfter raging, the Berserker will need to recover before being able to build rage again.
actors.buffs.berserk.recovering_desc=Inner strength has its limits. The Berserker must rest before using his rage again.\n\nWhile recovering the Berserker does not build any rage from taking damage.
actors.buffs.berserk.recovering_desc_turns=Turns until recovered: _%d_
actors.buffs.berserk.recovering_desc_levels=Levels until recovered: _%.2f_
actors.buffs.berserk.rankings_desc=Berserked to Death
actors.buffs.berserk.action_name=Berserk
actors.buffs.berserk.no_seal=You need your broken seal to berserk!
actors.buffs.bleeding.name=bleeding
actors.buffs.bleeding.ondeath=You bled to death...
actors.buffs.bleeding.heromsg=You are bleeding!
actors.buffs.bleeding.rankings_desc=Bled to Death
actors.buffs.bleeding.desc=That wound is leaking a worrisome amount of blood.\n\nBleeding causes damage every turn. Each turn the damage decreases by a random amount, until the bleeding eventually stops.\n\nCurrent bleed damage: %d.
actors.buffs.bless.name=blessed
actors.buffs.bless.desc=A great burst of focus, some say it is inspired by the gods.\n\nBlessing increases accuracy and evasion by 25%%, making the blessed much more effective in combat.\nIt also increased experience gain by 2x for heroes and allows them to get more items.\n\nTurns of bless remaining: %s.
actors.buffs.blindness.name=blinded
actors.buffs.blindness.heromsg=You are blinded!
actors.buffs.blindness.desc=Blinding turns the surrounding world into a dark haze.\n\nWhile blinded, a character's vision range is reduced to one tile, rendering ranged attacks useless and making it very easy to lose track of distant enemies. Additionally, a blinded hero is unable to read scrolls or books.\n\nTurns of blindness remaining: %s.
actors.buffs.buff.heromsg=
actors.buffs.burning.name=burning
actors.buffs.burning.heromsg=You catch fire!
actors.buffs.burning.burnsup=%s burns up!
actors.buffs.burning.ondeath=You burned to death...
actors.buffs.burning.rankings_desc=Burned to Ash
actors.buffs.burning.desc=Few things are more distressing than being engulfed in flames.\n\nFire will deal damage every turn until it is put out by water or it expires. Fire can be extinquished by stepping into water, or from the splash of a shattering potion.\n\nAdditionally, the fire may ignite flammable terrain or items that it comes into contact with.\n\nTurns of burning remaining: %s.
actors.buffs.championenemy.warn=You sense a deadly presence.
actors.buffs.championenemy$blazing.name=blazing champion
actors.buffs.championenemy$blazing.desc=Blazing champions deal 25% more melee damage, ignite enemies they attack, are immune to fire, and spread fire around them as they die. They can't spread fire onto water however.
actors.buffs.championenemy$projecting.name=projecting champion
actors.buffs.championenemy$projecting.desc=Projecting champions deal 25% more melee damage and have +3 attack range.
actors.buffs.championenemy$antimagic.name=antimagic champion
actors.buffs.championenemy$antimagic.desc=Antimagic champions take 50% less damage and are completely immune to magical effects.
actors.buffs.championenemy$giant.name=giant champion
actors.buffs.championenemy$giant.desc=Giant champions take 80% less damage and have +1 attack range, but cannot move through enclosed spaces.
actors.buffs.championenemy$blessed.name=blessed champion
actors.buffs.championenemy$blessed.desc=Blessed champions have 4x accuracy and evasion.
actors.buffs.championenemy$growing.name=growing champion
actors.buffs.championenemy$growing.desc=Growing champions gain a steadily increasing bonus to accuracy, evasion, physical damage, and a reduction to damage taken.\n\nCurrent acc/eva/dmg boost: %1$d%%\nCurrent damage reduction: %2$d%%
actors.buffs.championenemy$tanky.name=tanky champion
actors.buffs.championenemy$tanky.desc=Tanky champions receives only 5% of the damage, but reduces their damage and speed by 25%.
actors.buffs.championenemy$speedy.name=speedy champion
actors.buffs.championenemy$speedy.desc=Speedy Champions will gain x4 speed and x1.5 evasion and accuracy.
actors.buffs.championenemy$frozen.name=frozen champion
actors.buffs.championenemy$frozen.desc=Frozen champions deal 25% more melee damage but they have -20% speed, chills enemies they attack and sometimes freezes them, are immune to cold gases or effects, and spread blizzard around them as they die.
actors.buffs.championenemy$blunt.name=blunt champion
actors.buffs.championenemy$blunt.desc=Blunt champions are expert for using their hands or something they use as a blunt weapons, they deal 75% more damage as well as inflicts vertigo when they attack and paralyzes you in rare cases.
actors.buffs.charm.name=charmed
actors.buffs.charm.heromsg=You are charmed!
actors.buffs.charm.cant_attack=You are charmed by that enemy and can't attack them.
actors.buffs.charm.desc=A charm is manipulative magic that can make enemies temporarily adore each other.\n\nCharacters affected by charm are unable to directly attack the enemy they are charmed by. Attacking other targets is still possible however. The shock of pain will lessen the duration of charm.\n\nTurns of charm remaining: %s.
actors.buffs.chill.name=chilled
actors.buffs.chill.freezes=%s freezes!
actors.buffs.chill.desc=Not quite frozen, but still much too cold.\n\nChilled targets perform all actions more slowly, depending on how many turns are left in the effect. At its worst, this is equivalent to being slowed.\n\nTurns of chill remaining: %1$s.\nSpeed is reduced by: %2$s%%
actors.buffs.combo.name=combo
actors.buffs.combo.action_name=combo attack
actors.buffs.combo.combo=%d hit combo!
actors.buffs.combo.bad_target=You must target an enemy in attack range.
actors.buffs.combo.prompt=Select a target to attack.
actors.buffs.combo.desc=The gladiator builds momentum as they land successful blows. Each attack increases the combo counter by one, but taking too long between hits will reset the combo counter to 0.\n\nBuilding combo unlocks special combo attacks that cannot miss! A different attack is unlocked at 2, 4, 6, 8, and 10 combo count. Some moves reset combo and some do not, but each move can only be used once per combo session.\n\nCurrent combo: %1$d.\n\nTurns until Combo is lost: %2$s.
actors.buffs.combo$combomove.clobber.name=clobber
actors.buffs.combo$combomove.clobber.desc=Knocks an enemy back 2 tiles, but deals no damage and cannot knock into pits. Increments combo by 1.
actors.buffs.combo$combomove.clobber.empower_desc=Knocks an enemy back _3 tiles, inflicts vertigo, and can knock into pits,_ but deals no damage. Increments combo by 1.
actors.buffs.combo$combomove.slam.name=slam
actors.buffs.combo$combomove.slam.desc=Deals %d%% (combo*20%%) of your damage blocking power as bonus damage. Resets combo when used.
actors.buffs.combo$combomove.slam.empower_desc=_Leaps up to %1$d tile(s)_ and deals %2$d%% (combo*20%%) of your damage blocking power as bonus damage. Resets combo when used.
actors.buffs.combo$combomove.parry.name=parry
actors.buffs.combo$combomove.parry.desc=Blocks the next attack within 1 turn when activated, and instantly retaliates to it. Resets combo if nothing is parried.
actors.buffs.combo$combomove.parry.empower_desc=Blocks _all attacks_ within 1 turn when activated, and instantly retaliates to them. Resets combo if nothing is parried.
actors.buffs.combo$combomove.crush.name=crush
actors.buffs.combo$combomove.crush.desc=Deals %d%% (combo*25%%) damage to the primary target, and half that damage to all other enemies in a 7x7 AOE. Resets combo when used.
actors.buffs.combo$combomove.crush.empower_desc=_Leaps up to %1$d tile(s)_ and deals %2$d%% (combo*25%%) damage to the primary target, and half that damage to all other enemies in a 7x7 AOE. Resets combo when used.
actors.buffs.combo$combomove.fury.name=fury
actors.buffs.combo$combomove.fury.desc=Hits an enemy once for each combo you have, each hit deals 60% damage and can trigger enchantments. Resets combo when used.
actors.buffs.combo$combomove.fury.empower_desc=_Leaps up to %d tile(s)_ and hits an enemy once for each combo you have, each hit deals 60%% damage and can trigger enchantments. Resets combo when used.
actors.buffs.corruption.name=corrupted
actors.buffs.corruption.desc=Corruption seeps into the essence of a being, twisting them against their former nature.\n\nCorrupted creatures will attack their allies, and ignore their former enemies. Corruption is damaging as well, and will slowly cause its target to succumb.\n\nCorruption is permanent, its effects only end in death.
actors.buffs.cripple.name=crippled
actors.buffs.cripple.heromsg=You are crippled!
actors.buffs.cripple.desc=You're pretty sure legs aren't meant to bend that way.\n\nCrippled halves movement speed, making moving a tile usually take two turns instead of one.\n\nTurns of cripple remaining: %s.
actors.buffs.daze.name=dazed
actors.buffs.daze.heromsg=You are dazed!
actors.buffs.daze.desc=Ringing ears and blurred vision make it difficult to fight.\n\nWhile dazed, accuracy and evasion are reduced by 50%%, making both landing and evading blows much harder.\n\nTurns of daze remaining: %s.
actors.buffs.degrade.name=degraded
actors.buffs.degrade.heromsg=Your equipment feels weaker!
actors.buffs.degrade.desc=Powerful dark magic is sapping the strength that scrolls of upgrade have applied to your equipment!\n\nWhile degraded, upgraded gear will be treated as if it is a lower level than it actually is. _Every upgrade after +3 becomes exponentially weaker than the last one._ The descriptions of your items will change to reflect their reduced power level.\n\nDegradation does not affect strength requirements, wand charges, durability of thrown weapons, or artifacts.\n\nTurns of degradation remaining: %s. Using a scroll of upgrade or remove curse will end degradation immediately.
actors.buffs.doom.name=doomed
actors.buffs.doom.desc=It's hard to keep going when it seems like the universe wants you dead.\n\nDoomed characters will receive +67% damage from all sources.\n\nDoom is permanent, its effects only end in death.
actors.buffs.dread.name=dread
actors.buffs.dread.desc=A terror so great that it will cause its target to flee the dungeon entirely!\n\nCreatures affected by dread will run from their opponent at high speed, and will disappear from the dungeon entirely once they are out of sight. Enemies that are defeated this way award half experience and drop no items. The shock of pain will lessen the duration of dread.\n\nTurns of dread remaining: %d.
actors.buffs.drowsy.name=drowsy
actors.buffs.drowsy.desc=A magical force is making it difficult to stay awake, after a few turns, the target will fall into a deep magical sleep.\n\nThe hero can resist drowsiness by taking damage or by being at full health.\n\nTurns until sleep: %s.
actors.buffs.earthimbue.name=imbued with earth
actors.buffs.earthimbue.desc=You are imbued with the power of earth!\n\nAll physical attacks will shift the earth under the enemy, crippling them for a short time.\n\nTurns of earth imbue remaining: %s.
actors.buffs.enhancedrings.name=enhanced rings
actors.buffs.enhancedrings.desc=The Rogue's recently used artifact is empowering his rings, granting them +1 level.\n\nTurns remaining: %s.
actors.buffs.fireimbue.name=imbued with fire
actors.buffs.fireimbue.desc=You are imbued with the power of fire!\n\nAll physical attacks will have a chance to light enemies ablaze. Additionally, you are completely immune to the effects of fire.\n\nTurns of fire imbue remaining: %s.
actors.buffs.foresight.name=foresight
actors.buffs.foresight.desc=You are somehow able to see the layout of surrounding terrain with your mind.\n\nWhile under the effect of foresight all tiles in a wide radius are revealed to you, including any secret traps or doors.\n\nTurns of foresight remaining: %s.
actors.buffs.frost.name=frozen
actors.buffs.frost.freezes=%s freezes!
actors.buffs.frost.desc=Not to be confused with freezing solid, this more benign freezing simply encases the target in ice.\n\nFreezing acts similarly to paralysis, making it impossible for the target to act. Unlike paralysis, freezing is immediately cancelled if the target takes damage, as the ice will shatter.\n\nTurns of freeze remaining: %s.
actors.buffs.frostimbue.name=imbued with frost
actors.buffs.frostimbue.desc=You are imbued with icy power!\n\nAll physical attacks will steadily stack chill on enemies. Additionally, you are completely immune to the cold.\n\nTurns of frost imbue remaining: %s.
actors.buffs.fury.name=furious
actors.buffs.fury.heromsg=You become furious!
actors.buffs.fury.desc=You are angry, enemies won't like you when you're angry.\n\nA great rage burns within you, increasing the damage you deal with physical attacks by 50%%.\n\nThis rage will last as long as you are injured below 50%% health.
actors.buffs.blobimmunity.name=purification barrier
actors.buffs.blobimmunity.desc=Some strange force is encasing you in a thin protective barrier, blocking out all harmful airborne effects.\n\nYou are immune to all area-bound effects while this barrier lasts.\n\nTurns of immunity remaining: %s.
actors.buffs.greaterhaste.name=greater haste
actors.buffs.greaterhaste.desc=An incredible boost of speed, for a moment it feels as if everything else is standing still.\n\nWhile under the effects of greater haste moving actions take no time at all, but other actions are still performed at normal speed. Each step of movement consumes a turn of greater haste.\n\nTurns of greater haste remaining: %d.
actors.buffs.godspeed.name=Godspeed
actors.buffs.godspeed.desc=Godly energy courses through your whole essence, allowing you to perform actions at incredible speeds!\n\nWhile under the effects of godspeed you will perform all actions at double speed.\n\nTurns of godspeed remaining: %s.
actors.buffs.haste.name=haste
actors.buffs.haste.desc=Energy courses through your muscles, allowing you to run at incredible speeds!\n\nWhile under the effects of haste you will run at 3x speed, but will perform all other actions at normal speed.\n\nTurns of haste remaining: %s.
actors.buffs.healing.name=healing
actors.buffs.healing.desc=A magical remedy is causing wounds to close and flesh to knit.\n\nEvery turn health will steadily regenerate until the healing effect expires. The amount of healing may fade over time.\n\nNext heal: %d.\n\nHealing remaining: %d.
actors.buffs.herodisguise.name=disguise
actors.buffs.herodisguise.desc=Illusory magic has altered your physical appearance! The effect is purely cosmetic, but feels very strange regardless.\n\nTurns of disguise remaining: %s.
actors.buffs.hex.name=hexed
actors.buffs.hex.heromsg=You have been hexed!
actors.buffs.hex.desc=Dark magic which saps focus, making the target slightly disoriented.\n\nHexing reduces accuracy and evasion by 20%%, making the target less effective in combat.\n\nTurns of hex remaining: %s.
actors.buffs.holdfast.name=hold fast
actors.buffs.holdfast.desc=The %s is holding his position, increasing their armor by %d-%d. This will last until they move.
actors.buffs.hunger.hungry=hungry
actors.buffs.hunger.starving=starving
actors.buffs.hunger.onhungry=You are hungry.
actors.buffs.hunger.onstarving=You are starving!
actors.buffs.hunger.ondeath=You starved to death...
actors.buffs.hunger.cursedhorn=The cursed horn steals some of the food energy as you eat.
actors.buffs.hunger.rankings_desc=Starved to Death
actors.buffs.hunger.desc_intro_hungry=You can feel your stomach calling out for food, but it's not too urgent yet.
actors.buffs.hunger.desc_intro_starving=You're so hungry it hurts.
actors.buffs.hunger.desc=\n\nHunger slowly increases as you spend time in the dungeon, eventually you will begin to starve. While starving you will slowly lose health instead of regenerating it.\n\nRationing is important! If you have health to spare starving isn't a bad idea if it means there will be more food later. Effective rationing can make food last a lot longer!
actors.buffs.invisibility.name=invisible
actors.buffs.invisibility.desc=You are completely blended into the surrounding terrain, making you impossible to see.\n\nWhile you are invisible enemies are unable to attack or follow you. Physical attacks and magical effects (such as scrolls and wands) will immediately cancel invisibility.\n\nTurns of invisibility remaining: %s.
actors.buffs.invulnerability.name=invulnerable
actors.buffs.invulnerability.desc=You are suffused with great protective power, granting you a brief period of invulnerability!\n\nTurns remaining: %s.
actors.buffs.levitation.name=levitating
actors.buffs.levitation.desc=A magical force is levitating you over the ground, making you feel weightless.\n\nLevitating characters move silently and ignore all ground-based effects. Traps won't trigger, water won't put out fire, plants won't be trampled, roots will miss, and pits will be hovered over. Be careful, as all these things can come into effect the second the levitation ends!\n\nTurns of levitation remaining: %s.
actors.buffs.lifelink.name=life link
actors.buffs.lifelink.desc=This character's life force is linked to another character nearby. Any damage taken is shared between them.\n\nWhenever this character takes damage, half of it will be dealt to the life link target instead.\n\nTurns of life link remaining: %s, or until the linked character dies.
actors.buffs.light.name=illuminated
actors.buffs.light.desc=Even in the Darkest Dungeon, a steady light at your side is always comforting.\n\nLight helps keep darkness at bay, allowing you to see a reasonable distance despite the environment.\n\nTurns of illumination remaining: %s.
actors.buffs.lockedfloor.name=floor is locked
actors.buffs.lockedfloor.desc=The current floor is locked, and you are unable to leave it!\n\nWhile a floor is locked, you will not gain hunger or take damage from starving. In addition, if you do not work towards defeating this floor's boss, passive regeneration effects will also stop.\n\nAdditionally, if you are revived by an unblessed ankh while the floor is locked, then it will reset.\n\nKill this floor's boss to break the lock.
actors.buffs.lostinventory.name=lost inventory
actors.buffs.lostinventory.desc=Your inventory has been lost somewhere in the dungeon! You won't be able to pick up or use most items until you retrieve it.
actors.buffs.magicalsight.name=magical sight
actors.buffs.magicalsight.desc=Somehow you are able to see with your mind, rather than your eyes.\n\nWhile magical sight is active you will be able to see through all terrain in a 12 tile radius.\n\nTurns of magical sight remaining: %s.
actors.buffs.magicalsleep.name=magical sleep
actors.buffs.magicalsleep.toohealthy=You are too healthy, and resist the urge to sleep.
actors.buffs.magicalsleep.fallasleep=You fall into a deep magical sleep.
actors.buffs.magicalsleep.wakeup=You wake up feeling refreshed and healthy.
actors.buffs.magicalsleep.desc=This character has fallen into a deep magical sleep which they will not wake from naturally.\n\nMagical sleep is similar to regular sleep, except that only damage will cause the target to wake up.\n\nFor the hero and their allies, magical sleep has some restorative properties, allowing them to rapidly heal while resting.
actors.buffs.magicimmune.name=immune to magic
actors.buffs.magicimmune.desc=All magical effects have lost their hold on you, you are completely impervious to them.\n\nWhile magic immune all harmful and helpful magical effects will not apply to you, including curses, enchants, wands, scrolls, rings, artifacts, etc. Heroic armor abilities are strong enough to work regardless of this effect.\n\nTurns of magic immunity remaining: %s.
actors.buffs.overload.name=Overload
actors.buffs.overload.desc=The reality is overloaded. Prepare to cry, suffer, kill and slaughter.\n\nThe death of any hostile creature triggers the spawn of other creature.\n\nTurns of overload remaining: %s.
actors.buffs.mindvision.name=mind vision
actors.buffs.mindvision.desc=Somehow you are able to see all creatures on this floor through your mind. It's a weird feeling.\n\nAll characters on this floor are visible to you as long as you have mind vision. Seeing a creature through mind vision counts as it being seen or nearby for the purposes of many magical effects.\n\nTurns of mind vision remaining: %s.
actors.buffs.momentum.momentum=building momentum
actors.buffs.momentum.running=freerunning
actors.buffs.momentum.resting=recovering
actors.buffs.momentum.action_name=freerun
actors.buffs.momentum.momentum_desc=As he moves, the Freerunner builds momentum, which he can spend to start freerunning.\n\nEach charge of momentum grants two turns of freerunning, and the Freerunner can build up to 10 charges. Momentum is rapidly lost when the Freerunner stops moving.\n\nCurrent momentum charge: %d.
actors.buffs.momentum.running_desc=As he moves, the Freerunner builds momentum, which he can spend to start freerunning.\n\nWhile freerunning, the Freerunner moves at double speed and gains bonus evasion based on his level.\n\nTurns remaining: %d.
actors.buffs.momentum.resting_desc=As he moves, the Freerunner builds momentum, which he can spend to start freerunning.\n\nThe Freerunner needs time to regain his stamina before building momentum again.\n\nTurns remaining: %d.
actors.buffs.monkenergy.name=energy
actors.buffs.monkenergy.action=Monk Abilities
actors.buffs.monkenergy.desc=As she defeats enemies, the Monk gains energy that she can use on a variety of abilities. Most enemies grant 1 energy when defeated, and the Monk does not lose energy over time.\n\nCurrent energy: %1$d/%2$d.
actors.buffs.monkenergy.desc_cooldown=The Monk has recently used an ability, and must wait before using another.\n\nCurrent cooldown: %d turns.
actors.buffs.monkenergy$monkability$flurry.name=flurry of blows
actors.buffs.monkenergy$monkability$flurry.desc=Two instant strikes that deal %1$d-%2$d damage and ignore armor. This ability cannot be used repeatedly.
actors.buffs.monkenergy$monkability$flurry.empower_desc=Two instant strikes that deal %1$d-%2$d damage, ignore armor, _and use your weapon's enchantment._ This ability cannot be used repeatedly.
actors.buffs.monkenergy$monkability$focus.name=focus
actors.buffs.monkenergy$monkability$focus.desc=The Monk takes a turn to focus, letting her parry the next attack made against her.
actors.buffs.monkenergy$monkability$focus.empower_desc=The Monk _instantly focuses,_ letting her parry the next attack made against her.
actors.buffs.monkenergy$monkability$focus$focusbuff.name=focused
actors.buffs.monkenergy$monkability$focus$focusbuff.desc=The Monk is focused on her surroundings, anticipating the next attack made against her. While focused, she is guaranteed to parry the next incoming attack.
actors.buffs.monkenergy$monkability$dash.name=dash
actors.buffs.monkenergy$monkability$dash.prompt=Choose a Location
actors.buffs.monkenergy$monkability$dash.desc=An instant dash up to 4 tiles away. This ability can go over hazards, but not through enemies or solid terrain.
actors.buffs.monkenergy$monkability$dash.empower_desc=An instant dash up to _8 tiles_ away. This ability can go over hazards, but not through enemies or solid terrain.
actors.buffs.monkenergy$monkability$dragonkick.name=dragon kick
actors.buffs.monkenergy$monkability$dragonkick.desc=A devastating kick that deals %1$d-%2$d damage and ignores armor. The kick knocks the target away and paralyzes them for each tile they travel.
actors.buffs.monkenergy$monkability$dragonkick.empower_desc=A devastating kick that deals _%1$d-%2$d damage_ and ignores armor. The kick knocks _all adjacent targets_ away and paralyzes them for each tile they travel.
actors.buffs.monkenergy$monkability$meditate.name=meditate
actors.buffs.monkenergy$monkability$meditate.desc=The Monk focuses energy into her body for 5 turns. This clears most negative effects and grants her 8 turns of wand and artifact recharging.
actors.buffs.monkenergy$monkability$meditate.empower_desc=The Monk focuses energy into her body for 5 turns. This clears most negative effects and grants her 8 turns of wand and artifact recharging. _She also gains 80% damage resistance while meditating, and slowly heals for 20% of her missing HP._
actors.buffs.killevolution.name=kill counter
actors.buffs.killevolution.action=Kill Abilities
actors.buffs.killevolution.desc=As they defeat enemies, the hero gains energy that they can use on a variety of abilities. Most enemies grant 1 energy when defeated, and the hero does not lose energy over time.\n\n_However, unequipping a weapon associated with this buff associated with will lose all of this energy and you need to start killing enemies again_\n\nCurrent energy: %1$d/%2$d.
actors.buffs.killevolution.desc_cooldown=The hero has recently used an ability, and must wait before using another.\n\nCurrent cooldown: %d turns.
actors.buffs.killevolution$killevolutionability$invisibledash.name=invisible dash
actors.buffs.killevolution$killevolutionability$invisibledash.prompt=Choose a Location
actors.buffs.killevolution$killevolutionability$invisibledash.desc=An instant dash up to 4 tiles away with an additional turn of invisibility allowing the hero to surprise attack. This ability can go over hazards, but not through enemies or solid terrain.
actors.buffs.killevolution$killevolutionability$invisibledash.empower_desc=An instant dash up to _8 tiles_ away with an additional turn of invisibility allowing the hero to surprise attack. This ability can go over hazards, but not through enemies or solid terrain.
actors.buffs.killevolution$killevolutionability$physicallyempowered.name=physical empower
actors.buffs.killevolution$killevolutionability$physicallyempowered.desc=The hero grants itself +2 bonus damage for 10 hits.
actors.buffs.killevolution$killevolutionability$physicallyempowered.empower_desc=The hero grants itself _+4 bonus damage_ for 10 hits.
actors.buffs.killevolution$killevolutionability$weaponupgrade.name=weapon upgrade
actors.buffs.killevolution$killevolutionability$weaponupgrade.desc=The hero upgrades their weapon (and Duelist's second weapon if there's any) permanently.
actors.buffs.killevolution$killevolutionability$weaponupgrade.empower_desc=The hero upgrades their weapon (and Duelist's second weapon if there's any) _twice_ permanently.
actors.buffs.killevolution$killevolutionability$chain.name=chain enemy
actors.buffs.killevolution$killevolutionability$chain.desc=The hero chains an enemy to pull them in closer range.
actors.buffs.killevolution$killevolutionability$immortalize.name=immortalize
actors.buffs.killevolution$killevolutionability$immortalize.desc=The hero grants itself immortality against all sources of damage for 15 turns.
actors.buffs.killevolution$killevolutionability$immortalize.empower_desc=The hero grants itself immortality against all sources of damage for _~22 turns_.
actors.buffs.ooze.name=caustic ooze
actors.buffs.ooze.heromsg=Caustic ooze eats your flesh. Wash it away!
actors.buffs.ooze.ondeath=You melt away...
actors.buffs.ooze.rankings_desc=Dissolved
actors.buffs.ooze.desc=This sticky acid clings to flesh, slowly melting it away.\n\nOoze will deal consistent damage over time, but can be immediately washed off in water.\n\nTurns of ooze remaining: %s.
actors.buffs.paralysis.name=paralysed
actors.buffs.paralysis.heromsg=You are paralysed!
actors.buffs.paralysis.out=resisted paralysis
actors.buffs.paralysis.desc=Oftentimes the worst thing to do is nothing at all.\n\nParalysis completely halts all actions, forcing the target to wait until the effect wears off. The pain from taking damage can cause characters to resist paralysis, breaking them out of the effect.\n\nTurns of paralysis remaining: %s.
actors.buffs.physicalempower.name=physically empowered
actors.buffs.physicalempower.desc=Your blows have been empowered, increasing the amount of damage you can deal when you hit enemies with physical attacks.\n\nBonus damage: %1$d.\nHits remaining: %2$d.
actors.buffs.pincushion.name=pincushion
actors.buffs.pincushion.desc=The thrown weapons you have used against this character are currently stuck to them and will fall to the floor after they are defeated.\n\nThe following items are currently attached:
actors.buffs.poison.name=poisoned
actors.buffs.poison.heromsg=You are poisoned!
actors.buffs.poison.ondeath=You died from poison...
actors.buffs.poison.rankings_desc=Succumbed to Poison
actors.buffs.poison.desc=Poison works its way through the body, slowly impairing its internal functioning.\n\nPoison deals damage each turn proportional to how long until it expires.\n\nTurns of poison remaining: %s.
actors.buffs.preparation.name=preparation
actors.buffs.preparation.action_name=prepared strike
actors.buffs.preparation.desc=The Assassin is walking nervously, preparing to thurst knife into target.
actors.buffs.preparation.desc_dmg=His next attack will deal _%1$d%% bonus damage_, and will execute regular enemies below _%2$d%% health_, or bosses below _%3$d%% health_.
actors.buffs.preparation.desc_dmg_likely=The attack will also be more likely to deal a larger amount of damage.
actors.buffs.preparation.desc_blink=He is able to blink towards an enemy before striking them, with a max distance of _%d._
actors.buffs.preparation.desc_invis_time=The Assassin has been running for _%d turns._
actors.buffs.preparation.desc_invis_next=His attack will become stronger at _%d turns._
actors.buffs.preparation.prompt=Select a target to attack!\nMax blink distance: %d
actors.buffs.preparation.no_target=There's nothing to attack there.
actors.buffs.preparation.out_of_reach=That target is out of reach.
actors.buffs.preparation.assassinated=assassinated
actors.buffs.marked.name=Marked
actors.buffs.marked.desc=The Hunter is waiting patiently, preparing to strike while his bbat weakens enemies.
actors.buffs.marked.desc_dmg=The bbat deals %s%% more damage to this enemy. You will be able to jump to marked enemy at any moment, but more bonus damage means more debuffs.
actors.buffs.marked.prompt=Select a target to teleport!\nMax blink distance: your view distance
actors.buffs.marked.no_target=There's nothing to teleport there.
actors.buffs.marked.out_of_reach=That target is out of reach.
actors.buffs.marked.assassinated=assassinated
actors.buffs.marked.desc_poison=At this point, you will _poison_ a target, dealing damage over time.
actors.buffs.marked.desc_cripple=At this point, you will _cripple_ the legs of target, reducing its movement speed.
actors.buffs.marked.desc_blinding=At this point, you will also make target _blind_,reducing its field of view to 1 tile.
actors.buffs.marked.desc_bleeding=At this point, you will also make target _bleed_,dealing damage over time.
actors.buffs.marked.desc_vulnerable=At this point, you will also _increase physical damage_ to enemy.
actors.buffs.marked.desc_hexed=At this point, you will also stun target, _reducing its accuracy and dexterity_ for short time.
actors.buffs.marked.desc_slow=At this point, you will also disorientate target, _slowing_ its actions.
actors.buffs.marked.desc_ooze=At this point, you will also apply deadly _caustic ooze_ to target, dealing damage over time until target finds water.
actors.buffs.marked.desc_paralysis=At this point, you will completely _paralyse_ the enemy, rendering it unable to attack.
actors.buffs.marked.desc_doom=At this point, you will also curse the enemy, _significantly increasing any damage to it_.
actors.buffs.prismaticguard.name=prismatic Guard
actors.buffs.prismaticguard.desc=You are being guarded by a prismatic image which is currently inactive. When enemies are present the prismatic image will spring to action and protect you!\n\nWhile inactive, the prismatic image will steadily recover from any damage it has taken.\n\nCurrent HP: %d/%d.
actors.buffs.recharging.name=recharging
actors.buffs.recharging.desc=Energy is coursing through you, improving the rate that your wands and staffs charge.\n\nEach turn this buff will increase current charge by one quarter, in addition to regular recharge.\n\nTurns of recharging remaining: %s.
actors.buffs.revealedarea.name=revealed area
actors.buffs.revealedarea.desc=An area of the dungeon has been temporarily revealed to the hero, They will see it no matter where they are.\n\nTurns remaining: %s.
actors.buffs.revealedchar.name=revealed
actors.buffs.revealedchar.desc=This character is revealed to the hero, They will be visible no matter where they are.\n\nTurns remaining: %s.
actors.buffs.roots.name=rooted
actors.buffs.roots.heromsg=You can't move!
actors.buffs.roots.desc=Roots (magical or natural) grab at the feet, forcing them down to the ground.\n\nRoots lock a target in place, making movement and most movement abilities impossible. Other actions are not affected, including teleportation effects.\n\nTurns of root remaining: %s.
actors.buffs.scrollempower.name=scroll empower
actors.buffs.scrollempower.desc=The energy from the Mage's recently read scroll is empowering his wands!\n\nLevel Boost: +%1$d.\nZaps remaining: %2$d.
actors.buffs.shadows.name=shadowmelded
actors.buffs.shadows.desc=You are blended into the shadows around you, granting you invisibility and slowing your metabolism.\n\nWhile you are invisible enemies are unable to attack or follow you. Most physical attacks and magical effects (such as scrolls and wands) will immediately cancel invisibility. Additionally, while shadowmelded, your rate of hunger is slowed.\n\nYou will remain shadowmelded until you leave the shadows or an enemy comes into contact with you.
actors.buffs.slow.name=slowed
actors.buffs.slow.desc=Slowing magic affects the target's rate of time, to them everything is moving super-fast.\n\nA slowed character performs all actions in twice the amount of time they would normally take.\n\nTurns of slow remaining: %s.
actors.buffs.snipersmark.name=sniper's mark
actors.buffs.snipersmark.action_name_snapshot=snapshot
actors.buffs.snipersmark.action_name_volley=volley
actors.buffs.snipersmark.action_name_sniper=sniper shot
actors.buffs.snipersmark.desc=The Sniper is honed in on the target she most recently attacked. She is able to perform a special attack with her bow which will vary based on how the bow is augmented.\n\nAn unaugmented bow will fire a _snapshot,_ which deals reduced damage but does not take any time to fire.\n\nA bow augmented for speed will fire a _volley_ of three arrows. Each arrow will deal reduced damage, but can still activate enchantment. This volley takes 1 turn to shoot.\n\nA bow augmented for damage will fire a _sniper shot._ This shot is guaranteed to hit, deals bonus damage based on distance from the target, and takes 2 turns to fire.\n\nTurns remaining: %s.
actors.buffs.soulmark.name=soul marked
actors.buffs.soulmark.desc=The warlock has tapped into the soul of this creature, allowing him to heal as it takes physical damage.\n\nTurns of soul mark remaining: %s.
actors.buffs.stamina.name=stamina
actors.buffs.stamina.desc=You have unending stamina, allowing for faster movement!\n\nWhile under the effects of stamina you will run at +50%% speed, but will perform all other actions at normal speed.\n\nTurns of stamina remaining: %s.
actors.buffs.vulnerable.name=vulnerable
actors.buffs.vulnerable.heromsg=You feel fragile!
actors.buffs.vulnerable.desc=Vulnerability magic increases all physical damage that a character takes by 33%%, after that damage has been reduced by armor.\n\nTurns of vulnerable remaining: %s.
actors.buffs.terror.name=terrified
actors.buffs.terror.desc=Terror is manipulative magic which forces its target into an uncontrollable panic.\n\nTerrified characters are forced to run away from their opponent, trying to put as many doors and walls between them as possible. The shock of pain will lessen the duration of terror, however.\n\nTurns of terror remaining: %s.
actors.buffs.toxicimbue.name=imbued with toxicity
actors.buffs.toxicimbue.desc=You are imbued with poisonous energy!\n\nAs you move around toxic gas will constantly billow forth from you, damaging your enemies. You are immune to toxic gas and poison for the duration of the effect, as well as for a few turns afterward.\n\nTurns of toxic imbue remaining: %s.
actors.buffs.corrosion.name=corrosion
actors.buffs.corrosion.heromsg=You are melting!
actors.buffs.corrosion.ondeath=You melt away...
actors.buffs.corrosion.rankings_desc=Dissolved
actors.buffs.corrosion.desc=Powerful acid melts away flesh, metal, and bone at an alarming rate.\n\nCorrosion damage increases over time, as the target continues to melt away.\n\nTurns of corrosion remaining: %1$s.\nCurrent corrosion damage: %2$d.
actors.buffs.vertigo.name=vertigo
actors.buffs.vertigo.desc=Walking in a straight line can be difficult when the whole world is spinning.\n\nWhile under the effects of vertigo, characters who attempt to move will go in a random direction, instead of the one they intended to go in.\n\nTurns of vertigo remaining: %s.
actors.buffs.wandempower.name=wands empowered
actors.buffs.wandempower.desc=Your damage-dealing wands have been empowered, increasing the amount of damage they deal for a few hits.\n\nBonus damage: %1$d.\nHits remaining: %2$d.
actors.buffs.weakness.name=weakened
actors.buffs.weakness.heromsg=You feel weakened!
actors.buffs.weakness.desc=Everything suddenly seems much heavier.\n\nWeakening magic reduces a character's physical strength, causing them to deal 33%% reduced damage.\n\nTurns of weakness remaining: %s.
actors.buffs.wellfed.name=well fed
actors.buffs.wellfed.desc=You feel quite satisfied and full.\n\nWhile well fed, your hunger will not increase, and you will heal an additional amount of health over time.\n\nTurns remaining: %d.
actors.buffs.danceimmunebuff.name=immune to dance curse
actors.buffs.danceimmunebuff.desc=All dancing effects loses all its power for a short time, well extending the effect is not effective, you must wait for this effect to wear down before using the spell again.\n\nTurns of magic immunity remaining: %s.
actors.hero.abilities.armorability.self_target=You can't target yourself!
actors.hero.abilities.armorability.no_target=There's nothing to target there!
actors.hero.abilities.armorability.prompt=Choose a location to target
actors.hero.abilities.armorability.cost=Charge cost: _%d_
actors.hero.abilities.warrior.heroicleap.name=heroic leap
actors.hero.abilities.warrior.heroicleap.prompt=Choose direction to leap
actors.hero.abilities.warrior.heroicleap.short_desc=The Warrior performs a _Heroic Leap_ towards a targeted location, sailing above enemies and hazards.
actors.hero.abilities.warrior.heroicleap.desc=The Warrior leaps toward a targeted location, going over any enemies or hazards in the way. He cannot leap over walls or other solid terrain however.
actors.hero.abilities.warrior.shockwave.name=shockwave
actors.hero.abilities.warrior.shockwave.short_desc=The Warrior releases a _Shockwave_ in a conical AOE by slamming the ground. Enemies caught in the shockwave are damaged and crippled.
actors.hero.abilities.warrior.shockwave.desc=The Warrior slams the ground, producing a shockwave that travels up to 5 tiles in a 60 degree cone.\n\nEnemies caught in this shockwave are crippled for 5 turns. They also take 5-10 damage, plus an additional 1-2 damage for every point of strength the Warrior has above 10.
actors.hero.abilities.warrior.endure.name=endure
actors.hero.abilities.warrior.endure$enduretracker.name=endurance
actors.hero.abilities.warrior.endure$enduretracker.desc=The Warrior is now dealing bonus damage based on the damage he endured.\n\nBonus Damage: %1$d\nHits Left: %2$d
actors.hero.abilities.warrior.endure.short_desc=The Warrior _Endures_, skipping several turns but gaining high damage resistance. He then deals bonus damage based on what he endured.
actors.hero.abilities.warrior.endure.desc=The Warrior endures for 3 turns, taking half damage from all sources. This reduction is applied before damage resisting effects like armor.\n\nAfter enduring, the warrior's next hit within 10 turns gains bonus damage. This bonus damage is equal to half of all the damage inflicted on him while enduring, before any damage reduction effects!\n\nIf the Warrior has any combo, using this ability increases its remaining time by 3 turns.
actors.hero.abilities.mage.elementalblast.name=elemental blast
actors.hero.abilities.mage.elementalblast.no_staff=You can't use this ability without your staff.
actors.hero.abilities.mage.elementalblast.short_desc=The Mage emits an _Elemental Blast_ from his staff, covering a large area around him in an effect that varies based on the wand in his staff.
actors.hero.abilities.mage.elementalblast.desc=The Mage emits a blast of magic, which covers a circular region up to 4 tiles away and deals up to 15-25 damage. The specific effect of elemental blast will vary by the wand imbued in the Mage's staff.
actors.hero.abilities.mage.elementalblast.generic_desc=The effect of elemental blast will be similar to the effect of the wand when zapped at an enemy or ally.
actors.hero.abilities.mage.wildmagic.name=wild magic
actors.hero.abilities.mage.wildmagic.no_wands=You have no wands to zap with!
actors.hero.abilities.mage.wildmagic.short_desc=The Mage unleashes the _Wild Magic_ contained in his wands, randomly firing them multiple times at a chosen target over a single turn.
actors.hero.abilities.mage.wildmagic.desc=The Mage unleashes the power in his wands, randomly firing them up to 4 times in a single turn. The Mage's staff is not included in this effect.\n\nEach wand also has its level boosted by 2, up to +3. This ability uses half a wand charge for each zap, and no one wand can be fired more than 2 times.
actors.hero.abilities.mage.warpbeacon.name=warp beacon
actors.hero.abilities.mage.warpbeacon.depths=You can't warp between depths!
actors.hero.abilities.mage.warpbeacon.locked_floor=You cannot leave a locked floor!
actors.hero.abilities.mage.warpbeacon.too_far=That location is too far!
actors.hero.abilities.mage.warpbeacon.invalid_beacon=You can't place a beacon there!
actors.hero.abilities.mage.warpbeacon.window_desc=Your beacon is currently placed on floor %d.
actors.hero.abilities.mage.warpbeacon.window_tele=teleport to beacon
actors.hero.abilities.mage.warpbeacon.window_clear=clear beacon
actors.hero.abilities.mage.warpbeacon.window_cancel=cancel
actors.hero.abilities.mage.warpbeacon.short_desc=The Mage places a _Warping Beacon_ at his current location, which he can instantly teleport back to.
actors.hero.abilities.mage.warpbeacon.desc=The Mage places a beacon, which can then be warped to at will. Placing the beacon takes 1 turn, but warping to it is instantaneous.\n\nThe Mage cannot warp between floors by default, or use the beacon to reach inaccessible places such as locked rooms. The Mage can teleport into enemies, which will push them aside.
actors.hero.abilities.rogue.smokebomb.name=smoke bomb
actors.hero.abilities.rogue.smokebomb.fov=You can only jump to an empty location in your field of view
actors.hero.abilities.rogue.smokebomb.prompt=Choose a location to jump to
actors.hero.abilities.rogue.smokebomb$ninjalog.name=wooden decoy
actors.hero.abilities.rogue.smokebomb$ninjalog.desc=Somehow, enemies are easily convinced that this wooden decoy is the real Rogue!
actors.hero.abilities.rogue.smokebomb.short_desc=The Rogue throws down a _Smoke Bomb_ while blinking away. He blinds enemies near his old location.
actors.hero.abilities.rogue.smokebomb.desc=The Rogue throws down a smoke bomb and blinks up to 6 tiles away. He can blink through hazards and enemies, but not through solid terrain like walls.\n\nEnemies that are adjacent to the Rogue's old position will be blinded for 5 turns.
actors.hero.abilities.rogue.deathmark.name=death mark
actors.hero.abilities.rogue.deathmark.ally_target=You can only mark enemies
actors.hero.abilities.rogue.deathmark.short_desc=The Rogue places a _Death Mark_ on a chosen enemy. Marked enemies take bonus damage, but cannot die until the mark ends.
actors.hero.abilities.rogue.deathmark.desc=The Rogue places a mark on a chosen enemy, causing them to take 25% extra damage. The mark is applied instantly and lasts for 5 turns.\n\nMarked enemies take bonus damage but are unable to die until the mark expires. If an enemy has 0 HP when the mark ends, they will immediately die.
actors.hero.abilities.rogue.deathmark$deathmarktracker.name=marked for death
actors.hero.abilities.rogue.deathmark$deathmarktracker.desc=This enemy has been marked, causing them to take 25%% bonus damage, but also rendering them unable to die until the mark ends.\n\nTurns remaining: %s.
actors.hero.abilities.rogue.shadowclone.name=shadow clone
actors.hero.abilities.rogue.shadowclone.short_desc=The Rogue summons a _Shadow Clone_, which can be directed to aid him in combat.
actors.hero.abilities.rogue.shadowclone.desc=The Rogue summons a shadowy mimic of himself, which can be directed to aid him in combat. Directing the shadow clone does not cost any charge.\n\nThe clone has 80 HP, no armor, and deals 10-20 damage. All of these traits can be improved with talents, such that the clone benefits from weapons and armor the hero has.
actors.hero.abilities.rogue.shadowclone$shadowally.name=shadow rogue
actors.hero.abilities.rogue.shadowclone$shadowally.direct_defend=Your clone moves to that position.
actors.hero.abilities.rogue.shadowclone$shadowally.direct_follow=Your clone moves to follow you.
actors.hero.abilities.rogue.shadowclone$shadowally.direct_attack=Your clone moves to attack!
actors.hero.abilities.rogue.shadowclone$shadowally.desc=A copy of the Rogue, made from shadowy darkness. It stands stock still, with empty eyes and tiny wisps of darkness rising from it like steam.\n\nThe clone is not a perfect copy of the Rogue, but is still a decent fighter, and can benefit from the Rogue's equipment with the right talents.
actors.hero.abilities.huntress.spectralblades.name=spectral blades
actors.hero.abilities.huntress.spectralblades.short_desc=The Huntress throws _Spectral Blades_ at a target, inflicting damage depending on her currently equipped melee weapon.
actors.hero.abilities.huntress.spectralblades.desc=The Huntress throws out a spectral blade at an enemy, which acts like a ranged strike from her melee weapon. All of the normal effects of a melee weapon will activate, including enchantments.
actors.hero.abilities.huntress.naturespower.name=nature's power
actors.hero.abilities.huntress.naturespower.short_desc=The Huntress calls upon _Nature's Power_, increasing her movement speed and her bow's rate of fire for a short time.
actors.hero.abilities.huntress.naturespower.desc=The Huntress temporarily empowers herself and her bow with the power of nature! This lasts for 8 turns.\n\nDuring this time, the Huntress moves at 2x speed, and attacks 33% faster with her bow. The bonus bow effects do not trigger if the Sniper is using her special attacks.
actors.hero.abilities.huntress.naturespower$naturespowertracker.name=nature's power
actors.hero.abilities.huntress.naturespower$naturespowertracker.desc=The Huntress is briefly empowered, increasing her movement speed and attack speed with her bow.\n\nTurns remaining: %s.
actors.hero.abilities.huntress.spirithawk.name=spirit hawk
actors.hero.abilities.huntress.spirithawk.no_space=There is no free space near you.
actors.hero.abilities.huntress.spirithawk.short_desc=The Huntress summons a _Spirit Hawk_ familiar, which can help her scout locations and distract enemies.
actors.hero.abilities.huntress.spirithawk.desc=The Huntress summons a spirit hawk familiar, which can be directed by using the ability again while it is summoned. The hawk lasts for 100 turns, directing the hawk does not cost any charge.\n\nThe hawk has minimal health and attacking power, but is fast, evasive, and accurate. It shares its entire field of vision with the Huntress at all times. It is immune to all area-bound effects, such as fire and poison gas. It will not attack unless specifically directed to.
actors.hero.abilities.huntress.spirithawk$hawkally.name=spirit hawk
actors.hero.abilities.huntress.spirithawk$hawkally.direct_defend=Your hawk moves to that position.
actors.hero.abilities.huntress.spirithawk$hawkally.direct_follow=Your hawk moves to follow you.
actors.hero.abilities.huntress.spirithawk$hawkally.direct_attack=Your hawk moves to attack!
actors.hero.abilities.huntress.spirithawk$hawkally.desc=A magical hawk, summoned by the Huntress. It glows a bright ethereal blue, its head constantly shifts around as it surveys the area.\n\nWhile it isn't much of a fighter its speed and vision make it excellent for scouting and distracting enemies.
actors.hero.abilities.huntress.spirithawk$hawkally.desc_remaining=Turns remaining: %d.
actors.hero.abilities.huntress.spirithawk$hawkally.desc_dodges=Guaranteed dodges remaining: %d.
actors.hero.abilities.duelist.challenge.name=challenge
actors.hero.abilities.duelist.challenge.prompt=Choose an enemy to challenge
actors.hero.abilities.duelist.challenge.already_dueling=You can only be in one duel at a time.
actors.hero.abilities.duelist.challenge.ally_target=You can only challenge enemies.
actors.hero.abilities.duelist.challenge.unreachable_target=You must be able to reach your target.
actors.hero.abilities.duelist.challenge.distant_target=That enemy is too far away to challenge.
actors.hero.abilities.duelist.challenge.short_desc=The Duelist _Challenges_ a nearby enemy to a duel, temporarily freezing all other enemies.
actors.hero.abilities.duelist.challenge.desc=The Duelist challenges a nearby enemy to a duel. That enemy is compelled to fight her while all other enemies are temporarily frozen in time.\n\nThe target must be reachable and within 5 tiles of the Duelist. The duel lasts until 10 turns pass, the enemy dies, or the Duelist is more than 5 tiles away from the enemy.\n\nFrozen enemies are invulnerable. The Duelist's allies are not frozen by this ability, but if a boss is targeted its minions will not be frozen either.
actors.hero.abilities.duelist.challenge$duelparticipant.name=duel participant
actors.hero.abilities.duelist.challenge$duelparticipant.desc=This character is participating in a duel. They, and any of their allies or minions, are allowed to act normally while others are frozen.\n\nThe duel will last for a set amount of time, until one participant dies, or until the participants move more than 5 tiles away from eachother.\n\nTurns remaining: %d.
actors.hero.abilities.duelist.elementalstrike.name=elemental strike
actors.hero.abilities.duelist.elementalstrike.short_desc=The Duelist performs an _Elemental Strike_, spreading an effect in a conical AOE based on her weapon enchantment.
actors.hero.abilities.duelist.elementalstrike.desc=The Duelist strikes an enemy or location, performing a regular attack that's guaranteed to hit and spreading a magical effect that travels up to 4 tiles in a 65 degree cone. This magical effect varies based on the enchantment on the Duelist's primary weapon.
actors.hero.abilities.duelist.elementalstrike.generic_desc=An elemental strike with no enchantment will release a small burst of magic, dealing 6-12 damage to all enemies in range.
actors.hero.abilities.duelist.feint.name=feint
actors.hero.abilities.duelist.feint.prompt=Choose a location to dash to
actors.hero.abilities.duelist.feint.too_far=That location is not adjacent to you.
actors.hero.abilities.duelist.feint.bad_location=You can't move to that location.
actors.hero.abilities.duelist.feint.short_desc=The Duelist _Feints_, faking an attack while dashing to an adjacent tile. Enemies will attack her afterimage, leaving them open to a counterattack.
actors.hero.abilities.duelist.feint.desc=The Duelist fakes an attack while dashing to an adjacent tile, leaving behind a momentary afterimage of herself. Enemies that were attacking the Duelist will attack her afterimage instead.\n\nEnemies that attack the afterimage become confused, which cancels their next action and leaves them open to a surprise attack.
actors.hero.abilities.ratmogrify.name=ratmogrify
actors.hero.abilities.ratmogrify.cant_transform=You can't ratmogrify that!
actors.hero.abilities.ratmogrify.too_strong=That enemy is too strong to ratmogrify!
actors.hero.abilities.ratmogrify.short_desc=The hero _Ratmogrifies_ an enemy! This temporarily turns them into a rat with no abilities.
actors.hero.abilities.ratmogrify.desc=The hero transforms an enemy into a rat for 6 turns! Bosses, allies, and rats cannot be ratmogrified.\n\nRatmogrified enemies retain their original stats, but do not have any abilities.
actors.hero.abilities.ratmogrify$transmograt.name=ratmogrified %s
actors.hero.abilities.ratmogrify$transmograt.desc=This enemy has been transformed into a rat. A big improvement, if you ask me! - Rat King
actors.hero.abilities.ratmogrify$transmograt.rankings_desc=Slain by: ratmogrified enemy
actors.hero.abilities.ratking.legacywrath.name=divine fury
actors.hero.abilities.ratking.legacywrath.short_desc=I unleash my _Divine Fury_ upon my enemies. It leaves me exposed for a few turns and drains all my armor charge. Everything must come at price!
actors.hero.abilities.ratking.legacywrath.desc=I unlock the ability to channel overwhelming power. With it, I can blink to any nearby location no further than 6 tiles, blinding any enemies adjacent to my old location. Once there, I will cast a spell of magical earth on everyone I can see in 6 tiles area (the effect depends on talents) and create a fan of spectral blades targeting any mob within 6 tiles of me before turning invisible.\n\nThis ability takes 2 turns to leap, 1 turn to rooting earth, and one turn to spectral blades, though using this with no enemies in sight will skip the attacking.\n\nUnfortunately, _I have to use all of my armor charge or 33% of my current HP_ to get enough power for this ability.
actors.hero.hero.name=you
actors.hero.hero.leave=You can't leave yet, the rest of the dungeon awaits below!
actors.hero.hero.level_up=Level up!
actors.hero.hero.new_level=Level up! +Accuracy, +Evasion, +5 HP!
actors.hero.hero.new_talent=+1 Talent Point!
actors.hero.hero.unspent=You have unspent talent points!
actors.hero.hero.level_cap=You cannot grow stronger, but your experiences do give you a surge of power!
actors.hero.hero.you_now_have=you picked up: %s.
actors.hero.hero.you_cant_have=you can't carry: %s.
actors.hero.hero.locked_chest=This chest is locked and you don't have a matching key.
actors.hero.hero.locked_door=You don't have a matching key.
actors.hero.hero.noticed_smth=You noticed something.
actors.hero.hero.wait=...
actors.hero.hero.search=search
actors.hero.hero.search_distracted=It's hard to concentrate, searching is exhausting.
actors.hero.hero.pain_resist=The pain helps you resist the urge to sleep.
actors.hero.hero.revive=The ankh explodes with life-giving energy!
actors.hero.heroclass.warrior=warrior
actors.hero.heroclass.warrior_desc_short=The Warrior endures extra damage with shielding granted by his _broken seal._ The seal can be moved between armors and _transfers a single upgrade._
actors.hero.heroclass.warrior_desc=The Warrior starts with a _unique broken seal_ that generates shielding over his health. The seal can be moved between armors, and can _transfer a single upgrade_ with it.\n\nThe Warrior also starts with a _worn shortsword_, _three throwing stones_, cloth armor, a waterskin, and a velvet pouch.\n\nThe Warrior automatically identifies:\n_-_ Scrolls of Identify\n_-_ Potions of Healing\n_-_ Scrolls of Rage
actors.hero.heroclass.warrior_unlock=The Warrior is automatically unlocked.
actors.hero.heroclass.warrior_perk_desc=The Warrior gains _non-stackable 1 + (5% of current STR rounded down)_ temporary strength within _60 + (5 * current level) turns_ from eating and will be protected from taking any damage for duration of eating.\n\nThe Warrior can blind any enemy for _5 turns_ by throwing non-missiles at it. This ability has _40 turns_ cooldown.\n\nThe Warrior has _15%_ more strength, rounded down.\n\nThe Warrior can transfer any glyphs with his seal.\n\nThe Warrior regenerates his health and shielding _two times_ faster than usual.
actors.hero.heroclass.mage=mage
actors.hero.heroclass.mage_desc_short=The Mage is an arcane expert and carries a _magical staff_ that's stronger than a wand. The staff can be _imbued with any wand_ the Mage finds.
actors.hero.heroclass.mage_desc=The Mage starts with a _unique staff_, which recharges significantly faster than a wand and has 1 more charge. The staff _can be imbued with any wand_ the Mage finds in the dungeon.\n\nThe Mage also starts with a _wand of magic missile_ imbued in his staff, cloth armor, a waterskin, and a velvet pouch.\n\nThe Mage automatically identifies:\n_-_ Scrolls of Identify\n_-_ Potions of Liquid Flame\n_-_ Scrolls of Upgrade
actors.hero.heroclass.mage_unlock=To unlock the Mage _use a scroll of upgrade to make an item stronger._
actors.hero.heroclass.mage_perk_desc=The Mage gets _12 turns_ of recharging from eating.\n\nThe Mage instantly identifies any wands he picks up.\n\nThe Mage can self-target with a wand to convert all of its charges into shielding at a rate of _10.5% max HP per charge_.\n\nWhen the Mage zaps an enemy, he gains mind vision on them for _10 turns_.\n\nWhen the Mage reads a scroll, his next _3 wand zaps_ will get +(hero level/5) levels. He also has _33% chance_ to get scroll from the enemy.
actors.hero.heroclass.rogue=rogue
actors.hero.heroclass.rogue_desc_short=The Rogue can evade enemies and strike from invisibility using his _cloak of shadows._ He also _detects secrets and traps_ from a greater distance.
actors.hero.heroclass.rogue_desc=The Rogue starts with a _unique Cloak of Shadows_, which he can use to become invisible at will.\n\nThe Rogue can _detect secrets and traps_ from a greater distance.\n\nThe Rogue also starts with _a dagger_, _three throwing knives_, cloth armor, a waterskin, and a velvet pouch.\n\nThe Rogue automatically identifies:\n_-_ Scrolls of Identify\n_-_ Potions of Invisibility\n_-_ Scrolls of Magic Mapping
actors.hero.heroclass.rogue_unlock=To unlock the Rogue _perform 10 surprise attacks in one game._
actors.hero.heroclass.rogue_perk_desc=The Rogue will not wake sleeping enemies while he is _3 or more tiles away from them_.\n\nThe Rogue can search in _7x7_ area and will knock adjacent enemies away with chip damage while searching.\n\nThe Rogue can use Cloak of Shadows without equipping it but it will recharge at 66% speed.\n\nOn using Scroll of Upgrade, the Rogue will charge all his wands by _1_ charge and get _10 turns_ worth of artifact recharging.\n\nThe Rogue's bombs deal _150%_ more damage and drop from any enemy with 10% chance.
actors.hero.heroclass.huntress=huntress
actors.hero.heroclass.huntress_desc_short=The Huntress is a master of thrown weapons and has a _magical bow_ with infinite arrows. She also travels through tall grass _without trampling it._
actors.hero.heroclass.huntress_desc=The Huntress starts with a _unique spirit bow_, which can fire an infinite number of conjured arrows.\n\nThe Huntress can travel through tall grass _without trampling it_.\n\nThe Huntress also starts with _studded gloves_, cloth armor, a waterskin, and a velvet pouch.\n\nThe Huntress automatically identifies:\n_-_ Scrolls of Identify\n_-_ Potions of Mind Vision\n_-_ Scrolls of Lullaby
actors.hero.heroclass.huntress_unlock=To unlock the Huntress _hit enemies with thrown weapons 10 times in one game._
actors.hero.heroclass.huntress_perk_desc=The Huntress identifies equipment _3x_ faster.\n\nWhen the Huntress steps on short grass or embers, they spring up into tall grass which the Huntress immediately furrows. This has a _5 turn cooldown_. This talent will produce furrowed grass if passive regeneration effects are disabled or the hero has not gained exp in a long time.\n\nThe Huntress gains mind vision on any enemy within _3 tiles of her position_.\n\nThe Huntress gets _5 turns_ of adrenaline from eating.\n\nThe Huntress has 8% chance to get _1-3_ alchemical energy after killing the enemy.
actors.hero.heroclass.rat_king=rat king
actors.hero.heroclass.rat_king_desc_short=My short description is than I am awesome as king could possibly be!
actors.hero.heroclass.rat_king_desc=Why choose a class when I could just go as myself?\n\nAs myself, I take all the special class items I could find: an old seal, a staff made by some mage, a priceless cloak of shadows from my treasury, and a bow from my armory.\n\nI start with all my class items, obviously. Also I've already acquired all the bags, so I start with those too.\nI can also detect traps and secrets from a greater distance.\
actors.hero.heroclass.rat_king_perk_desc=What? I don't need any help! I am strong enough by myself!
actors.hero.heroclass.duelist=duelist
actors.hero.heroclass.duelist_desc_short=The Duelist is a weapons master who can use her weapon to trigger a _special weapon ability._ This special ability is _different for every weapon._
actors.hero.heroclass.duelist_desc=The Duelist starts with a _unique rapier_ with a special ability that recharges over time.\n\nEvery weapon in the game has a _different special ability_ that the Duelist can use.\n\nThe Duelist also starts with _two throwing spikes_, cloth armor, a waterskin, and a velvet pouch.\n\nThe Duelist automatically identifies:\n_-_ Scrolls of Identify\n_-_ Potions of Strength\n_-_ Scrolls of Mirror Image
actors.hero.heroclass.duelist_unlock=To unlock the Duelist _equip a tier 2 or higher weapon with no strength penalty._
actors.hero.heroclass.duelist_perk_desc=The Duelist gets _2 weapon charge_ and bonus melee damage equal to _level/2_ on eating.\n\nThe Duelist gains one weapon charge every _10 turns_ and deals _+8%_ melee damage when under the effect of wand or artifact recharging buffs.\n\nThe Duelist can switch her equipped weapon instantly _twice within 5 turns_, with a 20 turn cooldown.\nIf this ability is not on cooldown, quick-using an unequipped weapon will equip it.\n\nIf the Duelist's ability manages to kill any enemy, she will restore HP equal to _her level_.\n\nThe Duelist gets _+50%_ enchantment power for her attacks.
actors.hero.herosubclass.gladiator=gladiator
actors.hero.herosubclass.berserker=berserker
actors.hero.herosubclass.berserker_short_desc=The _Berserker_ builds rage as he takes damage. Rage increases his damage and can be activated at 100% for bonus shielding.
actors.hero.herosubclass.berserker_desc=The Berserker gains rage as he takes physical damage, including damage that gets blocked by his armor! Rage steadily fades away over time, but fades more slowly if he is at low HP.\n\nThe Berserker deals up to +50% damage at 100% rage. At 100% rage he can also go berserk, gaining 2-6x his seal's maximum shielding depending on his missing health and keeping his rage at 100% as long as he has shielding left. However, the Berserker needs time to recover after he goes berserk.\n\nHis rage will trigger enchantments and curses up to 60% more frequently and decay much slower.
actors.hero.herosubclass.gladiator_short_desc=The _Gladiator_ builds combo when he makes successful attacks. He can spend combo to use unique abilities.
actors.hero.herosubclass.gladiator_desc=The Gladiator builds one point of combo every time he makes a successful attack with a melee or thrown weapon. If the Gladiator does not make a successful attack within 5 turns, his combo is reset.\n\nAs combo builds it unlocks various abilities which he can spend his combo to use:\n2 Combo: knock enemy back, preserves combo; when combo is 7 or higher, knockback range increases to 3, it inflicts vertigo, and it can knock enemies into pits\n4 Combo: deal damage based on armor\n6 Combo: parry, preserves combo; when combo is 9 or higher, works on multiple attacks\n8 Combo: damage target and nearby enemies\n10 Combo: attack once for each combo\n\nWhen the Gladiator kills an enemy, the combo cooldown for his next hit is increased to _50 turns_.\n\nThe Gladiator can leap up to combo/3 tiles when using combo-spending attacks.
actors.hero.herosubclass.battlemage=battlemage
actors.hero.herosubclass.battlemage_short_desc=The _Battlemage_ conjures bonus effects when fighting in melee with his staff. These effects depend on the wand his staff is imbued with.
actors.hero.herosubclass.battlemage_desc=The Battlemage gains a bonus effect whenever he strikes in melee with his staff, as if his staff had an additional enchantment. These effects depend on the wand his staff is imbued with, every wand has its own effect. In addition to the wand effects, the Battlemage's staff will also gain 0.5 charges when he strikes with it.\n\nThe Battlemage's first melee strike with his staff after zapping with it deals double damage and staff's bonus effect gets +300% power.\n\nStriking with his staff grants the Battlemage _2 turns_ worth of artifact recharging.
actors.hero.herosubclass.warlock=warlock
actors.hero.herosubclass.warlock_short_desc=The _Warlock_ has a chance to soul mark enemies with his wands. He will heal whenever he deals physical damage to marked enemies.
actors.hero.herosubclass.warlock_desc=The Warlock has a chance to inflict a soul mark on characters when he uses wands on them. The chance to apply a soul mark and its duration increase with wand level.\n\nWhen an enemy is soul marked, the Warlock will heal 2 hp for every 5 damage he deals to them, but only with attacks from melee or thrown weapons, not from wands!\n\nWhen a soul marked enemy dies, the Warlock has a _50% chance_ to raise them as a corrupted wraith.\n\nSoul mark grants 1.5 turns of satiety for each physical damage dealt. Soul marked enemies have a 40% chance to trigger on-eat effects when they die.
actors.hero.herosubclass.assassin=hunter
actors.hero.herosubclass.assassin_short_desc=The _Hunter_ marks enemies with his bbat and inflicts debuffs with it.
actors.hero.herosubclass.assassin_desc=The _Hunter_ is trained to control darkness and use it to hunt targets with his bbat. His pet marks enemies and progressively does more damage. When any enemy is marked, the hunter can blink to it, inflicting debuffs and healing bbat depending on strength of mark.
actors.hero.herosubclass.freerunner=freerunner
actors.hero.herosubclass.freerunner_short_desc=The _Freerunner_ builds momentum as he runs, which can be used to start freerunning. This grants him bonus speed and evasion for a short while.
actors.hero.herosubclass.freerunner_desc=As the Freerunner moves he builds stacks of momentum. He can gain up to 10 momentum after running for 10 turns, but rapidly loses it if he stops moving. The freerunner can use up his momentum to start freerunning, for 2 turns per point of momentum.\n\nWhen freerunning the Freerunner moves at 2x speed, and gains bonus evasion in proportion to his level. Once freerunning ends there is a cooldown before momentum can be built again.\n\nWhile freerunning, the Freerunner gains 2x accuracy and +50% damage with thrown weapons.\n\nThe Freerunner moves at 2x speed while invisible, regardless of whether he is freerunning or not.
actors.hero.herosubclass.sniper=sniper
actors.hero.herosubclass.sniper_short_desc=The _Sniper_ can pierce armor with her ranged attacks. After striking with a thrown weapon she can follow up with a special attack from her bow.
actors.hero.herosubclass.sniper_desc=The Sniper is a master of ranged combat, whose ranged attacks pierce enemy armor. When she attacks an enemy with a thrown weapon, she places a sniper's mark on them, which lets her follow up with a special attack from her bow. This special attack varies based on how her bow is augmented.\n\nAn unaugmented bow will fire a snapshot which deals reduced damage but fires instantly. A speed bow will fire a volley of three arrows which deal reduced damage, can still activate enchantments, and take 1 turn to fire. A damage bow will fire a sniper shot which is guaranteed to hit, deals bonus damage based on distance, and takes 2 turns to fire.\n\nThrown weapons have a 100% chance to use the enchantment on the Sniper's bow.\nThis ability does not apply to darts shot from an enchanted crossbow, they already trigger the crossbow's enchantment.\n\nWhen the Sniper attacks with an upgraded thrown weapon, each level increases the duration of sniper's mark by 1 turn and the damage of her special attack by _33%_.
actors.hero.herosubclass.warden=warden
actors.hero.herosubclass.warden_short_desc=The _Warden_ can see through tall grass and gains bonus effects when she plants seeds and tramples plants.
actors.hero.herosubclass.warden_desc=The Warden has a strong connection to nature which grants her a variety of bonus effects relating to grass and plants. She is able to see through tall and furrowed grass as if it were empty space.\n\nThe Warden causes grass to sprout up around any seed she throws or plants, and gains special effects when trampling plants. These special effects replace the regular plant effects, meaning that no plant is harmful for her to step on.\n\nDewdrops can shield the Warden when her health is full, up to _100% of her max HP_.\n\nTipped darts have _5x durability_ when the Warden uses them.
actors.hero.herosubclass.king=rat king
actors.hero.herosubclass.king_short_desc=Choosing is so boring, I'd rather just pick _all the subclasses_...
actors.hero.herosubclass.king_desc=Rat King can use all subclasses at once!\n\nNot all perks are transferred to Rat King's subclass powers.
actors.hero.herosubclass.champion=champion
actors.hero.herosubclass.champion_short_desc=The _Champion_ can wield two weapons and gets more weapon charges. Her regular attacks use her primary weapon, but she can swap weapons and use either weapon's ability.
actors.hero.herosubclass.champion_desc=The Champion is a master of melee weapons who can equip a secondary weapon in addition to her primary one. Her regular attacks use her primary weapon, but she can swap her primary weapon instantly and use either weapon's ability.\n\nShe also gains 2 more max weapon ability charges and +50% weapon ability recharge speed.\n\nIf one of the Champion's two equipped weapons has a lower level and is _the same tier or lower_ than the other weapon, it will be boosted to the other weapon's level.\n\nIf the Champion uses two different weapon abilities successively, the second ability will execute any non-boss enemy left at _below 35% HP_.\n\nThe Champion instantly regains _1 weapon charge_ when she uses two different weapon abilities, with no time limit.
actors.hero.herosubclass.monk=monk
actors.hero.herosubclass.monk_short_desc=The _Monk_ builds energy while fighting. This energy can be spent on a variety of unique abilities.
actors.hero.herosubclass.monk_desc=The Monk is a master of physical technique. As she defeats enemies, she gains energy which can be used on a variety of defensive and utility-focused abilities. This energy does not fade over time, but has a cap based on the Monk's level.\n\n1 Energy: quickly strike with fists\n2 Energy: focus to dodge next attack\n3 Energy: instantly dash nearby\n4 Energy: kick an enemy away\n5 Energy: meditate to restore charges\n\nThe Monk gains _25% more energy_ for each piece of _natural tier 3_ equipment she is using.\nThe Monk gains _50% more energy_ for each piece of _natural tier 2_ equipment she is using.\nThe Monk gains _100%_ for each piece of _natural tier 1_ equipment she is using. She also gains _150% more energy_ if she has no weapon (or ring of force), and gains a free cloth armor and studded gloves.\n\nIf the Monk uses a weapon ability and a _2+ energy_ ability successively, she regains 50% of her spent energy and resets her ability cooldown.\n\nIf the Monk has _70% or more energy_, her abilities are empowered. When empowered:\n- Flurry applies enchantments at 75% power\n- Focus is instantaneous\n- Dash gains +2 range\n- Dragon Kick deals +33% damage and applies its knock back and stun effect to all adjacent enemies\n- Meditate slowly heals 20% of missing HP and grants 80% damage resistance.
actors.hero.talent$provokedangertracker.name=provoked anger
actors.hero.talent$provokedangertracker.desc=The Warrior has recently lost his shielding, his next physical attack will deal bonus damage.\n\nTurns remaining: %s.
actors.hero.talent$lingeringmagictracker.name=lingering magic
actors.hero.talent$lingeringmagictracker.desc=The Mage has recently used a staff or wand, his next physical attack will deal bonus damage.\n\nTurns remaining: %s.
actors.hero.talent$followupstriketracker.name=followup strike
actors.hero.talent$followupstriketracker.desc=The Huntress has recently attacked an enemy with a thrown weapon, her next melee attack against the same target will have boosted damage.\n\nTurns remaining: %s.
actors.hero.talent$patientstriketracker.name=patient strike
actors.hero.talent$patientstriketracker.desc=The Duelist has just spent a turn waiting, her next melee attack will deal bonus damage.
actors.hero.talent$improvisedprojectilecooldown.name=improvised projectiles cooldown
actors.hero.talent$improvisedprojectilecooldown.desc=You have recently used this talent, and must wait before using it again.\n\nTurns remaining: %s.
actors.hero.talent$rejuvenatingstepscooldown.name=rejuvenating steps cooldown
actors.hero.talent$rejuvenatingstepscooldown.desc=You have recently used this talent, and must wait before using it again.\n\nTurns remaining: %s.
actors.hero.talent$seershotcooldown.name=seer shot cooldown
actors.hero.talent$seershotcooldown.desc=You have recently used this talent, and must wait before using it again.\n\nTurns remaining: %s.
actors.hero.talent$aggressivebarriercooldown.name=aggressive barrier cooldown
actors.hero.talent$aggressivebarriercooldown.desc=You have recently used this talent, and must wait before using it again.\n\nTurns remaining: %s.
actors.hero.talent$liquidagilacctracker.name=liquid agility
actors.hero.talent$liquidagilacctracker.desc=The Duelist's next regular melee attack will gain bonus accuracy.\n\nTurns remaining: %s.
actors.hero.talent$lethalhastecooldown.name=lethal haste cooldown
actors.hero.talent$lethalhastecooldown.desc=You have recently used this talent, and must wait before using it again.\n\nTurns remaining: %s.
actors.hero.talent$swiftequipcooldown.name=swift equip cooldown
actors.hero.talent$swiftequipcooldown.desc=You have recently used this talent, and must wait before using it again.\n\nTurns remaining: %s.
actors.hero.talent$preciseassaulttracker.name=precise assault
actors.hero.talent$preciseassaulttracker.desc=The Duelist's next regular melee attack will gain bonus accuracy.\n\nTurns remaining: %s.
actors.hero.talent$deadlyfollowuptracker.name=deadly followup
actors.hero.talent$deadlyfollowuptracker.desc=The Duelist has recently attacked an enemy with a thrown weapon, her melee attacks against the same target will have boosted damage.\n\nTurns remaining: %s.
actors.hero.talent$combinedlethalityabilitytracker.executed=executed
actors.hero.talent.hearty_meal.title=hearty meal
actors.hero.talent.hearty_meal.desc=_+1:_ Eating food heals the Warrior for _3 HP_ when he is at or below 30% health.\n\n_+2:_ Eating food heals the Warrior for _5 HP_ when he is at or below 30% health.
actors.hero.talent.veterans_intuition.title=veteran's intuition
actors.hero.talent.veterans_intuition.desc=_+1:_ The Warrior identifies weapons _1.75x faster_ and armor _2.5x faster_.\n\n_+2:_ The Warrior identifies weapons _2.5x faster_ and armor _when he equips it_.
actors.hero.talent.provoked_anger.title=provoked anger
actors.hero.talent.provoked_anger.desc=_+1:_ When the Warrior's shielding breaks, his next physical attack will deal _2 bonus damage_.\n\n_+2:_ When the Warrior's shielding breaks, his next physical attack will deal _3 bonus damage_.
actors.hero.talent.iron_will.title=iron will
actors.hero.talent.iron_will.desc=_+1:_ The max shield provided by the Warrior's seal is _increased by 1_.\n\n_+2:_ The max shield provided by the Warrior's seal is _increased by 2_.
actors.hero.talent.iron_will.meta_desc=_If this talent is gained by a different hero_ it will grant its shielding benefit without the broken seal.
actors.hero.talent.iron_stomach.title=iron stomach
actors.hero.talent.iron_stomach.desc=_+1:_ Eating food takes the Warrior 1 turn and grants him _75% damage resistance_ while eating.\n\n_+2:_ Eating food takes the Warrior 1 turn and grants him _100% damage resistance_ while eating.
actors.hero.talent.liquid_willpower.title=liquid willpower
actors.hero.talent.liquid_willpower.desc=_+1:_ The Warrior instantly regains _50% of the shielding_ from his broken seal when drinking or throwing a potion, brew, or elixir.\n\n_+2:_ The Warrior instantly regains _75% of the shielding_ from his broken seal when drinking or throwing a potion, brew, or elixir.\n\nThe shield regeneration effect is doubled when using potions of strength, experience, or alchemy items that must be crafted using those potions.\n\nFor alchemy items with higher output quantities (e.g. aqua brew), this talent has a chance to trigger based on how many of that item is produced.
actors.hero.talent.liquid_willpower.meta_desc=_If this talent is gained by a different hero_ it will instead grant shielding equal to 5% max hp at +1, or 7.5% max hp at +2.
actors.hero.talent.runic_transference.title=runic transference
actors.hero.talent.runic_transference.desc=_+1:_ The Warrior's broken seal can transfer _regular glyphs_ in the same way it transfers an upgrade.\n\n_+2:_ The Warrior's broken seal can transfer _regular, powerful, and curse glyphs_ in the same way it transfers an upgrade.\n\nThe seal can only transfer glyphs if they were applied to the armor when the seal was attached.
actors.hero.talent.runic_transference.meta_desc=_If this talent is gained by a different hero_ it will instead help glyphs on your armor resist being removed by scrolls of upgrade. Glyphs will begin to be lost when upgrading from level 6(up from 4) at +1, or level 7(up from 4) at +2. The level where glyphs are guaranteed to be lost is unchanged at +8.
actors.hero.talent.lethal_momentum.title=lethal momentum
actors.hero.talent.lethal_momentum.desc=_+1:_ When the Warrior lands a killing blow on an enemy with a physical weapon, it has a _67% chance_ to take 0 turns.\n\n_+2:_ When the Warrior lands a killing blow on an enemy with a physical weapon, it has a _100% chance_ to take 0 turns.
actors.hero.talent.improvised_projectiles.title=improvised projectiles
actors.hero.talent.improvised_projectiles.desc=_+1:_ The Warrior can blind an enemy for _2 turns_ by throwing any item that isn’t a thrown weapon at them. This has a 50 turn cooldown.\n\n_+2:_ The Warrior can blind an enemy for _3 turns_ by throwing any item that isn’t a thrown weapon at them. This has a 50 turn cooldown.
actors.hero.talent.hold_fast.title=hold fast
actors.hero.talent.hold_fast.desc=_+1:_ When the Warrior waits he gains _1-2 armor_ until he moves.\n\n_+2:_ When the Warrior waits he gains _2-4 armor_ until he moves.\n\n_+3:_ When the Warrior waits he gains _3-6 armor_ until he moves.
actors.hero.talent.strongman.title=strongman
actors.hero.talent.strongman.desc=_+1:_ The Warrior's strength is _increased by 8%_, rounded down.\n\n_+2:_ The Warrior's strength is _increased by 13%_, rounded down.\n\n_+3:_ The Warrior's strength is _increased by 18%_, rounded down.
actors.hero.talent.endless_rage.title=endless rage
actors.hero.talent.endless_rage.desc=_+1:_ The Berserker can reach a max of _116% rage_.\n\n_+2:_ The Berserker can reach a max of _133% rage_.\n\n_+3:_ The Berserker can reach a max of _150% rage_.\n\nEach point of rage above 100% increases berserk shielding by 1% and reduces cooldown by 1%, but does not increase the damage bonus beyond +50%.
actors.hero.talent.deathless_fury.title=deathless fury
actors.hero.talent.deathless_fury.desc=_+1:_ Berserk automatically triggers if the Berserker is about to die and rage is at or above 100%, but it has a cooldown of _3 hero levels_ when this happens.\n\n_+2:_ Berserk automatically triggers if the Berserker is about to die and rage is at or above 100%, but it has a cooldown of _2 hero levels_ when this happens.\n\n_+3:_ Berserk automatically triggers if the Berserker is about to die and rage is at or above 100%, but it has a cooldown of _1 hero level_ when this happens.\n\nNote that the Berserker will still die if he has 0 HP when berserking ends.
actors.hero.talent.enraged_catalyst.title=enraged catalyst
actors.hero.talent.enraged_catalyst.desc=_+1:_ Enchantments and curses on the Berserker's weapon trigger more often the more rage he has, to a maximum of _15% more often_ at 100% rage.\n\n_+2:_ Enchantments and curses on the Berserker's weapon trigger more often the more rage he has, to a maximum of _30% more often_ at 100% rage.\n\n_+3:_ Enchantments and curses on the Berserker's weapon trigger more often the more rage he has, to a maximum of _45% more often_ at 100% rage.
actors.hero.talent.cleave.title=cleave
actors.hero.talent.cleave.desc=_+1:_ When the Gladiator kills an enemy, the combo cooldown for his next hit is increased to _15 turns_.\n\n_+2:_ When the Gladiator kills an enemy, the combo cooldown for his next hit is increased to _30 turns_.\n\n_+3:_ When the Gladiator kills an enemy, the combo cooldown for his next hit is increased to _45 turns_.
actors.hero.talent.lethal_defense.title=lethal defense
actors.hero.talent.lethal_defense.desc=_+1:_ When the Gladiator kills an enemy with a combo move, he _regains 33%_ of the broken seal's shielding.\n\n_+2:_ When the Gladiator kills an enemy with a combo move, he _regains 67%_ of the broken seal's shielding.\n\n_+3:_ When the Gladiator kills an enemy with a combo move, he _regains 100%_ of the broken seal's shielding.
actors.hero.talent.enhanced_combo.title=enhanced combo
actors.hero.talent.enhanced_combo.desc=_+1:_ When the Gladiator's combo is 7 or higher, Clobber's knockback range increases to 3, it inflicts vertigo, and it can knock enemies into pits.\n\n_+2:_ In addition to the benefits of +1, when the Gladiator's combo is 9 or higher Parry works on multiple attacks.\n\n_+3:_ In addition to the benefits of +1 and +2, the Gladiator can leap up to combo/3 tiles when using Slam, Crush, or Fury.
actors.hero.talent.body_slam.title=body slam
actors.hero.talent.body_slam.desc=_+1:_ When the Warrior lands after jumping, all adjacent enemies take damage equal to _1-4 plus 25%_ of his damage blocking power.\n\n_+2:_ When the Warrior lands after jumping, all adjacent enemies take damage equal to _2-8 plus 50%_ of his damage blocking power.\n\n_+3:_ When the Warrior lands after jumping, all adjacent enemies take damage equal to _3-12 plus 75%_ of his damage blocking power.\n\n_+4:_ When the Warrior lands after jumping, all adjacent enemies take damage equal to _4-16 plus 100%_ of his damage blocking power.
actors.hero.talent.impact_wave.title=impact wave
actors.hero.talent.impact_wave.desc=_+1:_ When the Warrior lands after jumping, all adjacent enemies are knocked _2 tiles_ back and have a _25% chance_ of becoming vulnerable for 5 turns.\n\n_+2:_ When the Warrior lands after jumping, all adjacent enemies are knocked _3 tiles_ back and have a _50% chance_ of becoming vulnerable for 5 turns.\n\n_+3:_ When the Warrior lands after jumping, all adjacent enemies are knocked _4 tiles_ back and have a _75% chance_ of becoming vulnerable for 5 turns.\n\n_+4:_ When the Warrior lands after jumping, all adjacent enemies are knocked _5 tiles_ back and have a _100% chance_ of becoming vulnerable for 5 turns.
actors.hero.talent.double_jump.title=double jump
actors.hero.talent.double_jump.desc=_+1:_ If the Warrior performs a second leap within 3 turns, that leap has a _16% reduced_ charge cost.\n\n_+2:_ If the Warrior performs a second leap within 3 turns, that leap has a _30% reduced_ charge cost.\n\n_+3:_ If the Warrior performs a second leap within 3 turns, that leap has a _40% reduced_ charge cost.\n\n_+4:_ If the Warrior performs a second leap within 3 turns, that leap has a _50% reduced_ charge cost.
actors.hero.talent.expanding_wave.title=expanding wave
actors.hero.talent.expanding_wave.desc=_+1:_ Shockwave's range is increased to _6 tiles_ from 5, and its width is increased to _75 degrees_ from 60.\n\n_+2:_ Shockwave's range is increased to _7 tiles_ from 5, and its width is increased to _90 degrees_ from 60.\n\n_+3:_ Shockwave's range is increased to _8 tiles_ from 5, and its width is increased to _105 degrees_ from 60.\n\n_+4:_ Shockwave's range is increased to _9 tiles_ from 5, and its width is increased to _120 degrees_ from 60.
actors.hero.talent.striking_wave.title=striking wave
actors.hero.talent.striking_wave.desc=_+1:_ Shockwave has a _30% chance_ to also use on-hit effects like enchantments and combo.\n\n_+2:_ Shockwave has a _60% chance_ to also use on-hit effects like enchantments and combo.\n\n_+3:_ Shockwave has a _90% chance_ to also use on-hit effects like enchantments and combo.\n\n_+4:_ Shockwave has a _100% chance_ to also use on-hit effects like enchantments and combo, and it gives enchantments _+20% power_.
actors.hero.talent.shock_force.title=shock force
actors.hero.talent.shock_force.desc=_+1:_ Shockwave deals _20% more damage_ and has a _25% chance_ to stun instead of cripple.\n\n_+2:_ Shockwave deals _40% more damage_ and has a _50% chance_ to stun instead of cripple.\n\n_+3:_ Shockwave deals _60% more damage_ and has a _75% chance_ to stun instead of cripple.\n\n_+4:_ Shockwave deals _80% more damage_ and has a _100% chance_ to stun instead of cripple.
actors.hero.talent.sustained_retribution.title=sustained retribution
actors.hero.talent.sustained_retribution.desc=_+1:_ The Warrior deals _115% bonus damage_ spread over _2 hits_, instead of 100% bonus damage in 1 hit.\n\n_+2:_ The Warrior deals _130% bonus damage_ spread over _3 hits_, instead of 100% bonus damage in 1 hit.\n\n_+3:_ The Warrior deals _145% bonus damage_ spread over _4 hits_, instead of 100% bonus damage in 1 hit.\n\n_+4:_ The Warrior deals _160% bonus damage_ spread over _5 hits_, instead of 100% bonus damage in 1 hit.
actors.hero.talent.shrug_it_off.title=shrug it off
actors.hero.talent.shrug_it_off.desc=_+1:_ The Warrior's damage reduction while enduring is _increased to 60%_, from 50%.\n\n_+2:_ The Warrior's damage reduction while enduring is _increased to 68%_, from 50%.\n\n_+3:_ The Warrior's damage reduction while enduring is _increased to 74%_, from 50%.\n\n_+4:_ The Warrior's damage reduction while enduring is _increased to 80%_, from 50%.
actors.hero.talent.even_the_odds.title=even the odds
actors.hero.talent.even_the_odds.desc=_+1:_ The Warrior deals an additional _5% bonus damage_ for every enemy within 2 tiles when enduring ends.\n\n_+2:_ The Warrior deals an additional _10% bonus damage_ for every enemy within 2 tiles when enduring ends.\n\n_+3:_ The Warrior deals an additional _15% bonus damage_ for every enemy within 2 tiles when enduring ends.\n\n_+4:_ The Warrior deals an additional _20% bonus damage_ for every enemy within 2 tiles when enduring ends.
actors.hero.talent.empowering_meal.title=empowering meal
actors.hero.talent.empowering_meal.desc=_+1:_ Eating food grants the Mage _2 bonus damage_ on the next 3 times he deals damage with a wand.\n\n_+2:_ Eating food grants the Mage _3 bonus damage_ on the next 3 times he deals damage with a wand.
actors.hero.talent.scholars_intuition.title=scholar's intuition
actors.hero.talent.scholars_intuition.desc=_+1:_ The Mage identifies wands _3x faster_.\n\n_+2:_ The Mage identifies wands _when he uses them_.
actors.hero.talent.lingering_magic.title=lingering magic
actors.hero.talent.lingering_magic.desc=_+1:_ When the Mage zaps with a wand or staff, his next physical attack deals _1-2 bonus damage_.\n\n_+2:_ When the Mage zaps with a wand or staff, his next physical attack deals _2 bonus damage_.
actors.hero.talent.backup_barrier.title=backup barrier
actors.hero.talent.backup_barrier.desc=_+1:_ The Mage gains _3 shielding_ whenever he spends the last charge in his staff.\n\n_+2:_ The Mage gains _5 shielding_ whenever he spends the last charge in his staff.
actors.hero.talent.backup_barrier.meta_desc=_If this talent is gained by a different hero_ it will instead trigger from the hero's highest level wand.
actors.hero.talent.energizing_meal.title=energizing meal
actors.hero.talent.energizing_meal.desc=_+1:_ Eating food takes the Mage 1 turn and grants him _5 turns of wand recharging_.\n\n_+2:_ Eating food takes the Mage 1 turn and grants him _8 turns of wand recharging_.
actors.hero.talent.inscribed_power.title=inscribed power
actors.hero.talent.inscribed_power.desc=_+1:_ When the Mage reads a scroll or uses a spell item, his _next 2 wand zaps_ get +2 levels.\n\n_+2:_ When the Mage reads a scroll or uses a spell item, his _next 3 wand zaps_ get +2 levels.\n\nThe number of enhanced wand zaps is doubled when using a scroll of upgrade, transmutation, or alchemy items that must be crafted using those scrolls.\n\nFor alchemy items with higher output quantities (e.g. most spells), this talent has a chance to trigger based on how many of that item is produced.
actors.hero.talent.wand_preservation.title=wand preservation
actors.hero.talent.wand_preservation.desc=_+1:_ When the Mage imbues a new wand into his staff, the old wand is returned at +0, _but this can only be done once._\n\n_+2:_ When the Mage imbues a new wand into his staff, the old wand is returned at +0, _this can be done once per hero level._
actors.hero.talent.wand_preservation.meta_desc=_If this talent is gained by a different hero_ it will instead increase the amount of arcane resin gained when putting a wand into an alchemy pot by 1 at +1, or by 2 at +2.
actors.hero.talent.arcane_vision.title=arcane vision
actors.hero.talent.arcane_vision.desc=_+1:_ When the Mage zaps an enemy, he gains mind vision on them for _10 turns_.\n\n_+2:_ When the Mage zaps an enemy, he gains mind vision on them for _15 turns_.
actors.hero.talent.shield_battery.title=shield battery
actors.hero.talent.shield_battery.desc=_+1:_ The Mage can self-target with a wand to convert all of its charges into shielding at a rate of _4% max HP per charge_.\n\n_+2:_ The Mage can self-target with a wand to convert all of its charges into shielding at a rate of _6% max HP per charge_.
actors.hero.talent.desperate_power.title=desperate power
actors.hero.talent.desperate_power.desc=_+1:_ The Mage's wands and staff gain _+1 level_ on their final zap when they are down to their last charge.\n\n_+2:_ The Mage's wands and staff gain _+2 levels_ on their final zap when they are down to their last charge.\n\n_+3:_ The Mage's wands and staff gain _+3 levels_ on their final zap when they are down to their last charge.
actors.hero.talent.ally_warp.title=ally warp
actors.hero.talent.ally_warp.desc=_+1:_ The Mage can select an ally to instantly swap places with them, with a _2 tile range_.\n\n_+2:_ The Mage can select an ally to instantly swap places with them, with a _4 tile range_.\n\n_+3:_ The Mage can select an ally to instantly swap places with them, with a _6 tile range_.\n\nThe Mage cannot swap places with immobile allies.
actors.hero.talent.empowered_strike.title=empowered strike
actors.hero.talent.empowered_strike.desc=_+1:_ The Battlemage's first melee strike with his staff after zapping with it deals _+16% damage_ and the staff's bonus effect gets _+50% power_.\n\n_+2:_ The Battlemage's first melee strike with his staff after zapping with it deals _+33% damage_ and the staff's bonus effect gets _+100% power_.\n\n_+3:_ The Battlemage's first melee strike with his staff after zapping with it deals _+50% damage_ and the staff's bonus effect gets _+150% power_.
actors.hero.talent.mystical_charge.title=mystical charge
actors.hero.talent.mystical_charge.desc=_+1:_ Striking with his staff grants the Battlemage _0.5 turns_ worth of artifact recharging.\n\n_+2:_ Striking with his staff grants the Battlemage _1 turn_ worth of artifact recharging.\n\n_+3:_ Striking with his staff grants the Battlemage _1.5 turns_ worth of artifact recharging.
actors.hero.talent.excess_charge.title=excess charge
actors.hero.talent.excess_charge.desc=_+1:_ When the Battlemage's staff is fully charged, its next zap will grant him _0.67 shielding_ per level of the staff.\n\n_+2:_ When the Battlemage's staff is fully charged, its next zap will grant him _1.33 shielding_ per level of the staff.\n\n_+3:_ When the Battlemage's staff is fully charged, its next zap will grant him _2 shielding_ per level of the staff.
actors.hero.talent.soul_siphon.title=soul siphon
actors.hero.talent.soul_siphon.desc=_+1:_ Physical damage dealt by other characters triggers the Warlock's soul mark at _13% effectiveness_.\n\n_+2:_ Physical damage dealt by other characters triggers the Warlock's soul mark at _27% effectiveness_.\n\n_+3:_ Physical damage dealt by other characters triggers the Warlock's soul mark at _40% effectiveness_.
actors.hero.talent.soul_eater.title=soul eater
actors.hero.talent.soul_eater.desc=_+1:_ Soul mark grants _0.33 turns_ of satiety for each physical damage dealt. Soul marked enemies have a _10% chance_ to trigger on-eat effects when they die.\n\n_+2:_ Soul mark grants _0.67 turns_ of satiety for each physical damage dealt. Soul marked enemies have a _20% chance_ to trigger on-eat effects when they die.\n\n_+3:_ Soul mark grants _1 turn_ of satiety for each physical damage dealt. Soul marked enemies have a _30% chance_ to trigger on-eat effects when they die.
actors.hero.talent.necromancers_minions.title=necromancer's minions
actors.hero.talent.necromancers_minions.desc=_+1:_ When a soul marked enemy dies, the Warlock has a _13% chance_ to raise them as a corrupted wraith.\n\n_+2:_ When a soul marked enemy dies, the Warlock has a _27% chance_ to raise them as a corrupted wraith.\n\n_+3:_ When a soul marked enemy dies, the Warlock has a _40% chance_ to raise them as a corrupted wraith.
actors.hero.talent.blast_radius.title=blast radius
actors.hero.talent.blast_radius.desc=_+1:_ Elemental blast's radius is increased to _5 tiles_, from 4.\n\n_+2:_ Elemental blast's radius is increased to _6 tiles_, from 4.\n\n_+3:_ Elemental blast's radius is increased to _7 tiles_, from 4.\n\n_+4:_ Elemental blast's radius is increased to _8 tiles_, from 4.
actors.hero.talent.elemental_power.title=elemental power
actors.hero.talent.elemental_power.desc=_+1:_ The power of elemental blast is increased by _25%_.\n\n_+2:_ The power of elemental blast is increased by _50%_.\n\n_+3:_ The power of elemental blast is increased by _75%_.\n\n_+4:_ The power of elemental blast is increased by _100%_.
actors.hero.talent.reactive_barrier.title=reactive barrier
actors.hero.talent.reactive_barrier.desc=_+1:_ The Mage gains _2.5 shielding_ for every character affected by elemental blast, to a max of 5 characters.\n\n_+2:_ The Mage gains _5 shielding_ for every character affected by elemental blast, to a max of 6 characters.\n\n_+3:_ The Mage gains _7.5 shielding_ for every character affected by elemental blast, to a max of 7 characters.\n\n_+4:_ The Mage gains _10 shielding_ for every character affected by elemental blast, to a max of 8 characters.
actors.hero.talent.wild_power.title=wild power
actors.hero.talent.wild_power.desc=_+1:_ When using wild magic, wands will be boosted by either _2 or 3, up to +4_.\n\n_+2:_ When using wild magic, wands will be boosted by _3, up to +5_.\n\n_+3:_ When using wild magic, wands will be boosted by either _3 or 4, up to +6_.\n\n_+4:_ When using wild magic, wands will be boosted by _4, up to +7_.
actors.hero.talent.fire_everything.title=fire everything
actors.hero.talent.fire_everything.desc=_+1:_ Wild magic now fires _5 times_ up from 4, and each wand has a _25% chance_ to be usable 3 times.\n\n_+2:_ Wild magic now fires _6 times_ up from 4, and each wand has a _50% chance_ to be usable 3 times.\n\n_+3:_ Wild magic now fires _7 times_ up from 4, and each wand has a _75% chance_ to be usable 3 times.\n\n_+4:_ Wild magic now fires _8 times_ up from 4, and each wand has a _100% chance_ to be usable 3 times.
actors.hero.talent.conserved_magic.title=conserved magic
actors.hero.talent.conserved_magic.desc=_+1:_ Each zap from wild magic now uses _0.33 charges_ instead of 0.5, and wild magic has a _25% chance_ to not spend a turn.\n\n_+2:_ Each zap from wild magic now uses _0.225 charges_ instead of 0.5, and wild magic has a _50% chance_ to not spend a turn.\n\n_+3:_ Each zap from wild magic now uses _0.15 charges_ instead of 0.5, and wild magic has a _75% chance_ to not spend a turn.\n\n_+4:_ Each zap from wild magic now uses _0.1 charges_ instead of 0.5, and wild magic has a _100% chance_ to not spend a turn.
actors.hero.talent.telefrag.title=Telefrag
actors.hero.talent.telefrag.desc=_+1:_ If the Mage warps into another character he deals _10-15 damage_ to it, but also takes _5 damage_.\n\n_+2:_ If the Mage warps into another character he deals _20-30 damage_ to it, but also takes _10 damage_.\n\n_+3:_ If the Mage warps into another character he deals _30-45 damage_ to it, but also takes _15 damage_.\n\n_+4:_ If the Mage warps into another character he deals _40-60 damage_ to it, but also takes _20 damage_.\n\nThe hero cannot be killed by this talent, the self damage can be reduced by magic resisting effects.
actors.hero.talent.remote_beacon.title=Remote Beacon
actors.hero.talent.remote_beacon.desc=_+1:_ The Mage can place a beacon at any location within _4 tiles_.\n\n_+2:_ The Mage can place a beacon at any location within _8 tiles_.\n\n_+3:_ The Mage can place a beacon at any location within _12 tiles_.\n\n_+4:_ The Mage can place a beacon at any location within _16 tiles_.\n\nThe Mage cannot place beacons in locations that are inaccessible.
actors.hero.talent.longrange_warp.title=Longrange Warp
actors.hero.talent.longrange_warp.desc=_+1:_ The Mage can now warp between floors, at _150% charge cost_.\n\n_+2:_ The Mage can now warp between floors, at _117% charge cost_.\n\n_+3:_ The Mage can now warp between floors, at _83% charge cost_.\n\n_+4:_ The Mage can now warp between floors, at _50% charge cost_.\n\nThe Mage cannot use longrange warp to leave a locked floor.
actors.hero.talent.cached_rations.title=cached rations
actors.hero.talent.cached_rations.desc=_+1:_ The Rogue can find _2 supply rations_ placed in chests while he explores the next few floors of the dungeon.\n\n_+2:_ The Rogue can find _3 supply rations_ placed in chests while he explores the next few floors of the dungeon.\n\nSupply rations are eaten quickly, restore a moderate amount of satiety, heal 5 hp, and restore 1 charge to the cloak of shadows.
actors.hero.talent.thiefs_intuition.title=thief's intuition
actors.hero.talent.thiefs_intuition.desc=_+1:_ The Rogue identifies rings _2x faster_, and identifies the type of a ring _when he equips it_.\n\n_+2:_ The Rogue identifies rings _when he equips them_, and identifies the type of a ring _when he picks it up_.
actors.hero.talent.sucker_punch.title=sucker punch
actors.hero.talent.sucker_punch.desc=_+1:_ The Rogue deals _1-2 bonus damage_ the first time he surprise attacks an enemy.\n\n_+2:_ The Rogue deals _2 bonus damage_ the first time he surprise attacks an enemy.
actors.hero.talent.protective_shadows.title=protective shadows
actors.hero.talent.protective_shadows.desc=_+1:_ The Rogue gains one shielding _every other turn_ he is invisible, _to a max of 3_.\n\n_+2:_ The Rogue gains one shielding _every turn_ he is invisible, _to a max of 5_.
actors.hero.talent.mystical_meal.title=mystical meal
actors.hero.talent.mystical_meal.desc=_+1:_ Eating food takes the Rogue 1 turn (supply rations are eaten instantly) and grants him _3 turns of artifact recharging_.\n\n_+2:_ Eating food takes the Rogue 1 turn (supply rations are eaten instantly) and grants him _5 turns of artifact recharging_.\n\nThis talent cannot be used to let the horn of plenty recharge itself.
actors.hero.talent.inscribed_stealth.title=inscribed stealth
actors.hero.talent.inscribed_stealth.desc=_+1:_ The Rogue gains _3 turns_ of invisibility after reading a scroll or using a spell item.\n\n_+2:_ The Rogue gains _5 turns_ of invisibility after reading a scroll or using a spell item\n\nThe invisibility duration is doubled when using a scroll of upgrade, scroll of transmutation, or alchemy items that must be crafted using those scrolls.\n\nFor alchemy items with higher output quantities (e.g. most spells), this talent has a chance to trigger based on how many of that item is produced.
actors.hero.talent.wide_search.title=wide search
actors.hero.talent.wide_search.desc=_+1:_ The Rogue’s search radius is increased from a 5x5 square to a _7x7 circle_.\n\n_+2:_ The Rogue’s search radius is increased from a 5x5 square to a _7x7 square_.
actors.hero.talent.wide_search.meta_desc=_If this talent is gained by a different hero_ it will instead increase their search radius from a 3x3 square to a 5x5 circle at +1, or a 5x5 square at +2.
actors.hero.talent.silent_steps.title=silent steps
actors.hero.talent.silent_steps.desc=_+1:_ The Rogue will not wake sleeping enemies while he is _3 or more tiles away from them_.\n\n_+2:_ The Rogue will not wake sleeping enemies while he is _not adjacent to them_.
actors.hero.talent.rogues_foresight.title=rogue's foresight
actors.hero.talent.rogues_foresight.desc=_+1:_ When the Rogue is on a level with a secret room, he has a _75% chance to notice_ that the level contains a secret.\n\n_+2:_ When the Rogue is on a level with a secret room, he has a _100% chance to notice_ that the level contains a secret.
actors.hero.talent.light_cloak.title=light cloak
actors.hero.talent.light_cloak.desc=_+1:_ The Rogue can use his cloak of shadows when it is not equipped, but it recharges at _25% speed_.\n\n_+2:_ The Rogue can use his cloak of shadows when it is not equipped, but it recharges at _50% speed_.\n\n_+3:_ The Rogue can use his cloak of shadows when it is not equipped, but it recharges at _75% speed_.
actors.hero.talent.light_cloak.meta_desc=_If this talent is gained by a different hero_ it will instead increase the charging speed of all artifacts by 7/13/20% at +1/+2/+3.
actors.hero.talent.enhanced_rings.title=enhanced rings
actors.hero.talent.enhanced_rings.desc=_+1:_ When the Rogue uses an artifact, his rings gain +1 upgrade for _3 turns_.\n\n_+2:_ When the Rogue uses an artifact, his rings gain +1 upgrade for _6 turns_.\n\n_+3:_ When the Rogue uses an artifact, his rings gain +1 upgrade for _9 turns_.
actors.hero.talent.enhanced_lethality.title=enhanced lethality
actors.hero.talent.enhanced_lethality.desc=_+1:_ The Assassin can assassinate enemies left at below _4/13/27/67% health_ per level of preparation, up from 3/10/20/50%.\n\n_+2:_ The Assassin can assassinate enemies left at below _5/17/33/83% health_ per level of preparation, up from 3/10/20/50%.\n\n_+3:_ The Assassin can assassinate enemies left at below _6/20/40/100% health_ per level of preparation, up from 3/10/20/50%.
actors.hero.talent.assassins_reach.title=assassin's reach
actors.hero.talent.assassins_reach.desc=_+1:_ The Assassin's blink range per level of preparation is increased to _1/3/4/6 tiles_, from 1/2/3/4.\n\n_+2:_ The Assassin's blink range per level of preparation is increased to _2/4/6/8 tiles_, from 1/2/3/4.\n\n_+3:_ The Assassin's blink range per level of preparation is increased to _2/5/7/10 tiles_, from 1/2/3/4.\n\nThis blink can go through hazards and enemies, but not through solid terrain like walls.
actors.hero.talent.bounty_hunter.title=bounty hunter
actors.hero.talent.bounty_hunter.desc=_+1:_ When the Assassin kills an enemy with a prepared strike their item drop chance is increased by _2/4/8/16%_, per level of preparation.\n\n_+2:_ When the Assassin kills an enemy with a prepared strike their item drop chance is increased by _4/8/16/32%_, per level of preparation.\n\n_+3:_ When the Assassin kills an enemy with a prepared strike their item drop chance is increased by _6/12/24/48%_, per level of preparation.
actors.hero.talent.evasive_armor.title=evasive armor
actors.hero.talent.evasive_armor.desc=_+1:_ While freerunning, the Freerunner gains an additional _+1 evasion_ per excess point of strength on his armor.\n\n_+2:_ While freerunning, the Freerunner gains an additional _+2 evasion_ per excess point of strength on his armor.\n\n_+3:_ While freerunning, the Freerunner gains an additional _+3 evasion_ per excess point of strength on his armor.
actors.hero.talent.projectile_momentum.title=projectile momentum
actors.hero.talent.projectile_momentum.desc=_+1:_ While freerunning, the Freerunner gains _+20% accuracy and +15% damage_ with thrown weapons.\n\n_+2:_ While freerunning, the Freerunner gains _+40% accuracy and +30% damage_ with thrown weapons.\n\n_+3:_ While freerunning, the Freerunner gains _+60% accuracy and +45% damage_ with thrown weapons.
actors.hero.talent.speedy_stealth.title=speedy stealth
actors.hero.talent.speedy_stealth.desc=_+1:_ The Freerunner gains 2 stacks of momentum per turn while he is invisible.\n\n_+2:_ In addition to the benefits of +1, freerunning no longer counts down while the Freerunner is invisible.\n\n_+3:_ In addition to the benefits of +1 and +2, the Freerunner moves at 2x speed while invisible, regardless of whether he is freerunning or not.
actors.hero.talent.hasty_retreat.title=hasty retreat
actors.hero.talent.hasty_retreat.desc=_+1:_ After blinking the Rogue gains _1 turn_ of haste and invisibility.\n\n_+2:_ After blinking the Rogue gains _2 turns_ of haste and invisibility.\n\n_+3:_ After blinking the Rogue gains _3 turns_ of haste and invisibility.\n\n_+4:_ After blinking the Rogue gains _4 turns_ of haste and invisibility.
actors.hero.talent.body_replacement.title=body replacement
actors.hero.talent.body_replacement.desc=_+1:_ After blinking, the Rogue leaves a wooden decoy behind that has _20 health and 1-3 armor_.\n\n_+2:_ After blinking, the Rogue leaves a wooden decoy behind that has _40 health and 2-6 armor_.\n\n_+3:_ After blinking, the Rogue leaves a wooden decoy behind that has _60 health and 3-9 armor_.\n\n_+4:_ After blinking, the Rogue leaves a wooden decoy behind that has _80 health and 4-12 armor_.\n\nOnly one decoy can be active at a time.
actors.hero.talent.shadow_step.title=shadow step
actors.hero.talent.shadow_step.desc=_+1:_ If the rogue uses smoke bomb while invisible, it occurs instantly and has a _16% reduced_ charge cost, but it also doesn't blind enemies or trigger other talents.\n\n_+2:_ If the rogue uses smoke bomb while invisible, it occurs instantly and has a _30% reduced_ charge cost, but it also doesn't blind enemies or trigger other talents.\n\n_+3:_ If the rogue uses smoke bomb while invisible, it occurs instantly and has a _41% reduced_ charge cost, but it also doesn't blind enemies or trigger other talents.\n\n_+4:_ If the rogue uses smoke bomb while invisible, it occurs instantly and has a _50% reduced_ charge cost, but it also doesn't blind enemies or trigger other talents.
actors.hero.talent.fear_the_reaper.title=fear the reaper
actors.hero.talent.fear_the_reaper.desc=_+1:_ When a death marked enemy reaches 0 hp, they become _crippled_.\n\n_+2:_ When a death marked enemy reaches 0 hp, they become _feared and crippled_.\n\n_+3:_ When a death marked enemy reaches 0 hp, they become _feared and crippled_ and enemies within 3 tiles become _crippled_.\n\n_+4:_ When a death marked enemy reaches 0 hp, they become _feared and crippled_ and enemies within 3 tiles become _feared and crippled_.
actors.hero.talent.deathly_durability.title=deathly durability
actors.hero.talent.deathly_durability.desc=_+1:_ Enemies killed by death mark give the rogue shielding equal to _13%_ of their hp when they were marked.\n\n_+2:_ Enemies killed by death mark give the rogue shielding equal to _25%_ of their hp when they were marked.\n\n_+3:_ Enemies killed by death mark give the rogue shielding equal to _38%_ of their hp when they were marked.\n\n_+4:_ Enemies killed by death mark give the rogue shielding equal to _50%_ of their hp when they were marked.
actors.hero.talent.double_mark.title=double mark
actors.hero.talent.double_mark.desc=_+1:_ Marking a second target at the same time as the first one has a _30% reduced_ charge cost.\n\n_+2:_ Marking a second target at the same time as the first one has a _50% reduced_ charge cost.\n\n_+3:_ Marking a second target at the same time as the first one has a _65% reduced_ charge cost.\n\n_+4:_ Marking a second target at the same time as the first one has a _75% reduced_ charge cost.
actors.hero.talent.shadow_blade.title=shadow blade
actors.hero.talent.shadow_blade.desc=_+1:_ The shadow clone gains _8%_ of the hero's damage per turn, and has a _25% chance_ to use the enchantment on the hero's weapon.\n\n_+2:_ The shadow clone gains _16%_ of the hero's damage per turn, and has a _50% chance_ to use the enchantment on the hero's weapon.\n\n_+3:_ The shadow clone gains _24%_ of the hero's damage per turn, and has a _75% chance_ to use the enchantment on the hero's weapon.\n\n_+4:_ The shadow clone gains _32%_ of the hero's damage per turn, and has a _100% chance_ to use the enchantment on the hero's weapon.
actors.hero.talent.cloned_armor.title=cloned armor
actors.hero.talent.cloned_armor.desc=_+1:_ The shadow clone gains _12%_ of the hero's armor value, and has a _25% chance_ to use the glyph on the hero's armor.\n\n_+2:_ The shadow clone gains _24%_ of the hero's armor value, and has a _50% chance_ to use the glyph on the hero's armor.\n\n_+3:_ The shadow clone gains _36%_ of the hero's armor value, and has a _75% chance_ to use the glyph on the hero's armor.\n\n_+4:_ The shadow clone gains _48%_ of the hero's armor value, and has a _100% chance_ to use the glyph on the hero's armor.
actors.hero.talent.perfect_copy.title=perfect copy
actors.hero.talent.perfect_copy.desc=_+1:_ The shadow clone gains _10%_ of the hero's max HP, and can instantly swap places with the hero up to _1 tile_ away.\n\n_+2:_ The shadow clone gains _20%_ of the hero's max HP, and can instantly swap places with the hero up to _2 tiles_ away.\n\n_+3:_ The shadow clone gains _30%_ of the hero's max HP, and can instantly swap places with the hero up to _3 tiles_ away.\n\n_+4:_ The shadow clone gains _40%_ of the hero's max HP, and can instantly swap places with the hero up to _4 tiles_ away.
actors.hero.talent.natures_bounty.title=nature's bounty
actors.hero.talent.natures_bounty.desc=_+1:_ The Huntress can find _4 berries_ hidden in tall grass as she explores the next few floors of the dungeon.\n\n_+2:_ The Huntress can find _6 berries_ hidden in tall grass as she explores the next few floors of the dungeon.\n\nBerries are eaten quickly, restore a small amount of satiety, and might contain a usable seed.
actors.hero.talent.survivalists_intuition.title=survivalist's intuition
actors.hero.talent.survivalists_intuition.desc=_+1:_ The Huntress identifies all equipment _1.75x faster_.\n\n_+2:_ The Huntress identifies all equipment _2.5x faster_.
actors.hero.talent.followup_strike.title=followup strike
actors.hero.talent.followup_strike.desc=_+1:_ When the Huntress hits an enemy with her bow or a thrown weapon, her next melee attack against that enemy deals _2 bonus damage_.\n\n_+2:_ When the Huntress hits an enemy with her bow or a thrown weapon, her next melee attack against that enemy deals _3 bonus damage_.
actors.hero.talent.natures_aid.title=nature's aid
actors.hero.talent.natures_aid.desc=_+1:_ The Huntress gains 0-2 armor of barkskin, which fades every _3 turns_ when a plant's effect is activated in her vision.\n\n_+2:_ The Huntress gains 0-2 armor of barkskin, which fades every _5 turns_ when a plant's effect is activated in her vision.
actors.hero.talent.invigorating_meal.title=invigorating meal
actors.hero.talent.invigorating_meal.desc=_+1:_ Eating food takes the Huntress 1 turn (berries are eaten instantly) and grants her _1 turn of haste_.\n\n_+2:_ Eating food takes the Huntress 1 turn (berries are eaten instantly) and grants her _2 turns of haste_.
actors.hero.talent.liquid_nature.title=liquid nature
actors.hero.talent.liquid_nature.desc=_+1:_ When the Huntress drinks or throws a potion, brew, or elixir, _up to 4 grass tiles_ sprout in the surrounding area, and adjacent enemies are rooted for _1 turn_.\n\n_+2:_ When the Huntress drinks or throws a potion, brew, or elixir, _up to 6 grass tiles_ sprout in the surrounding area, and adjacent enemies are rooted for _2 turns_.\n\nThe amount of grass and root duration are doubled when using potions of strength, experience, or alchemy items that must be crafted using those potions.\n\nFor alchemy items with higher output quantities (e.g. aqua brew), this talent has a chance to trigger based on how many of that item is produced.
actors.hero.talent.rejuvenating_steps.title=rejuvenating steps
actors.hero.talent.rejuvenating_steps.desc=_+1:_ When the Huntress steps on short grass or embers, they spring up into tall grass which the Huntress immediately furrows. This has a _10 turn cooldown_.\n\n_+2:_ When the Huntress steps on short grass or embers, they spring up into tall grass which the Huntress immediately furrows. This has a _5 turn cooldown_.\n\nThis talent will produce furrowed grass if passive regeneration effects are disabled or the hero has not gained exp in a long time.
actors.hero.talent.heightened_senses.title=heightened senses
actors.hero.talent.heightened_senses.desc=_+1:_ The Huntress gains mind vision on any enemy within _2 tiles of her position_.\n\n_+2:_ The Huntress gains mind vision on any enemy within _3 tiles of her position_.
actors.hero.talent.durable_projectiles.title=durable projectiles
actors.hero.talent.durable_projectiles.desc=_+1:_ Thrown weapons have _+50% durability_ when used by the Huntress.\n\n_+2:_ Thrown weapons have _+75% durability_ when used by the Huntress.
actors.hero.talent.point_blank.title=point blank
actors.hero.talent.point_blank.desc=_+1:_ When the Huntress uses her bow or a thrown weapon at melee range it has _-30% accuracy,_ instead of -50%.\n\n_+2:_ When the Huntress uses her bow or a thrown weapon at melee range it has _-10% accuracy,_ instead of -50%.\n\n_+3:_ When the Huntress uses her bow or a thrown weapon at melee range it has _+10% accuracy,_ instead of -50%.\n\nNote that thrown weapons or the spirit bow always have +50% accuracy when used at a distance.
actors.hero.talent.seer_shot.title=seer shot
actors.hero.talent.seer_shot.desc=_+1:_ When the Huntress fires an arrow at the ground, it grants vision in a 3x3 area around it for _5 turns_. This has a 20 turn cooldown.\n\n_+2:_ When the Huntress fires an arrow at the ground, it grants vision in a 3x3 area around it for _10 turns_. This has a 20 turn cooldown.\n\n_+3:_ When the Huntress fires an arrow at the ground, it grants vision in a 3x3 area around it for _15 turns_. This has a 20 turn cooldown.
actors.hero.talent.seer_shot.meta_desc=_If this talent is gained by a different hero_ it will trigger from any thrown weapon.
actors.hero.talent.farsight.title=farsight
actors.hero.talent.farsight.desc=_+1:_ The Sniper's vision range is _increased by 25%_.\n\n_+2:_ The Sniper's vision range is _increased by 50%_.\n\n_+3:_ The Sniper's vision range is _increased by 75%_.
actors.hero.talent.shared_enchantment.title=shared enchantment
actors.hero.talent.shared_enchantment.desc=_+1:_ Thrown weapons have a _33% chance_ to use the enchantment on the Sniper's bow.\n\n_+2:_ Thrown weapons have a _67% chance_ to use the enchantment on the Sniper's bow.\n\n_+3:_ Thrown weapons have a _100% chance_ to use the enchantment on the Sniper's bow.\n\nThis talent does not apply to darts shot from an enchanted crossbow, they already trigger the crossbow's enchantment.
actors.hero.talent.shared_upgrades.title=shared upgrades
actors.hero.talent.shared_upgrades.desc=_+1:_ When the Sniper attacks with an upgraded thrown weapon, each level increases the duration of sniper's mark by 1 turn and the damage of her special attack by _10%_.\n\n_+2:_ When the Sniper attacks with an upgraded thrown weapon, each level increases the duration of sniper's mark by 1 turn and the damage of her special attack by _20%_.\n\n_+3:_ When the Sniper attacks with an upgraded thrown weapon, each level increases the duration of sniper's mark by 1 turn and the damage of her special attack by _30%_.
actors.hero.talent.durable_tips.title=durable tips
actors.hero.talent.durable_tips.desc=_+1:_ Tipped darts have _2x durability_ when the Warden uses them.\n\n_+2:_ Tipped darts have _3x durability_ when the Warden uses them.\n\n_+3:_ Tipped darts have _4x durability_ when the Warden uses them.
actors.hero.talent.barkskin.title=barkskin
actors.hero.talent.barkskin.desc=_+1:_ When stepping in grass, the Warden gains _0-50% of her level_ in barkskin armor which fades every turn.\n\n_+2:_ When stepping in grass, the Warden gains _0-100% of her level_ in barkskin armor which fades every turn.\n\n_+3:_ When stepping in grass, the Warden gains _0-150% of her level_ in barkskin armor which fades every turn.
actors.hero.talent.shielding_dew.title=shielding dew
actors.hero.talent.shielding_dew.desc=_+1:_ Dewdrops can shield the Warden when her health is full, up to _20% of her max HP_.\n\n_+2:_ Dewdrops can shield the Warden when her health is full, up to _40% of her max HP_.\n\n_+3:_ Dewdrops can shield the Warden when her health is full, up to _60% of her max HP_.
actors.hero.talent.fan_of_blades.title=fan of blades
actors.hero.talent.fan_of_blades.desc=_+1:_ Spectral blades can hit up to _1 additional target_ for 50% damage. The target must be visible and within a _30 degree_ cone AOE.\n\n_+2:_ Spectral blades can hit up to _2 additional targets_ for 50% damage. The targets must be visible and within a _60 degree_ cone AOE.\n\n_+3:_ Spectral blades can hit up to _3 additional targets_ for 50% damage. The targets must be visible and within a _90 degree_ cone AOE.\n\n_+4:_ Spectral blades can hit up to _4 additional targets_ for 50% damage. The targets must be visible and within a _120 degree_ cone AOE.
actors.hero.talent.projecting_blades.title=projecting blades
actors.hero.talent.projecting_blades.desc=_+1:_ Spectral blades has _+25% accuracy_, and can penetrate up to _2 solid tiles_.\n\n_+2:_ Spectral blades has _+50% accuracy_, and can penetrate up to _4 solid tiles_.\n\n_+3:_ Spectral blades has _+75% accuracy_, and can penetrate up to _6 solid tiles_.\n\n_+4:_ Spectral blades has _+100% accuracy_, and can penetrate up to _8 solid tiles_.
actors.hero.talent.spirit_blades.title=spirit blades
actors.hero.talent.spirit_blades.desc=_+1:_ Spectral blades has a _30% chance_ to also use the enchantment on the spirit bow.\n\n_+2:_ Spectral blades has a _60% chance_ to also use the enchantment on the spirit bow.\n\n_+3:_ Spectral blades has a _90% chance_ to also use the enchantment on the spirit bow.\n\n_+4:_ Spectral blades has a _100% chance_ to also use the enchantment on the spirit bow, and it gives each enchantment _+10% power_.
actors.hero.talent.growing_power.title=growing power
actors.hero.talent.growing_power.desc=_+1:_ The attack and movespeed boosts from nature's power are increased to _38% and 125%_, from 33% and 100%.\n\n_+2:_ The attack and movespeed boosts from nature's power are increased to _42% and 150%_, from 33% and 100%.\n\n_+3:_ The attack and movespeed boosts from nature's power are increased to _46% and 175%_, from 33% and 100%.\n\n_+4:_ The attack and movespeed boosts from nature's power are increased to _50% and 200%_, from 33% and 100%.
actors.hero.talent.natures_wrath.title=nature's wrath
actors.hero.talent.natures_wrath.desc=_+1:_ While nature's power is active, shots from the spirit bow have an _8% chance_ to trigger a random harmful plant effect.\n\n_+2:_ While nature's power is active, shots from the spirit bow have a _17% chance_ to trigger a random harmful plant effect.\n\n_+3:_ While nature's power is active, shots from the spirit bow have an _25% chance_ to trigger a random harmful plant effect.\n\n_+4:_ While nature's power is active, shots from the spirit bow have a _33% chance_ to trigger a random harmful plant effect.\n\nThe plants that can be triggered are: blindweed, firebloom, icecap, sorrowmoss, and stormvine.
actors.hero.talent.wild_momentum.title=wild momentum
actors.hero.talent.wild_momentum.desc=_+1:_ Killing an enemy with the spirit bow prolongs the duration of nature's power by _1 turn_. The duration can be extended by a max of _2 turns_.\n\n_+2:_ Killing an enemy with the spirit bow prolongs the duration of nature's power by _2 turns_. The duration can be extended by a max of _4 turns_.\n\n_+3:_ Killing an enemy with the spirit bow prolongs the duration of nature's power by _3 turns_. The duration can be extended by a max of _6 turns_.\n\n_+4:_ Killing an enemy with the spirit bow prolongs the duration of nature's power by _4 turns_. The duration can be extended by a max of _8 turns_.
actors.hero.talent.eagle_eye.title=eagle eye
actors.hero.talent.eagle_eye.desc=_+1:_ The spirit hawk's vision range is increased to _7 tiles_ from 6.\n\n_+2:_ The spirit hawk's vision range is increased to _8 tiles_ from 6.\n\n_+3:_ The spirit hawk's vision range is increased to _9 tiles_ from 6, and it gets _2 tiles_ of mind vision.\n\n_+4:_ The spirit hawk's vision range is increased to _10 tiles_ from 6, and it gets _3 tiles_ of mind vision.
actors.hero.talent.go_for_the_eyes.title=go for the eyes
actors.hero.talent.go_for_the_eyes.desc=_+1:_ Attacks from the spirit hawk blind enemies for _2 turns_.\n\n_+2:_ Attacks from the spirit hawk blind enemies for _5 turns_.\n\n_+3:_ Attacks from the spirit hawk blind enemies for _5 turns_ and cripple them for _2 turns_.\n\n_+4:_ Attacks from the spirit hawk blind enemies for _5 turns_ and cripple them for _5 turns_.
actors.hero.talent.swift_spirit.title=swift spirit
actors.hero.talent.swift_spirit.desc=_+1:_ The spirit hawk's movement speed is increased to _2.5 tiles_ from 2, and it is guaranteed to dodge the first _2 attacks_ made against it.\n\n_+2:_ The spirit hawk's movement speed is increased to _3 tiles_ from 2, and it is guaranteed to dodge the first _4 attacks_ made against it.\n\n_+3:_ The spirit hawk's movement speed is increased to _3.5 tiles_ from 2, and it is guaranteed to dodge the first _6 attacks_ made against it.\n\n_+4:_The spirit hawk's movement speed is increased to _4 tiles_ from 2, and it is guaranteed to dodge the first _8 attacks_ made against it.
actors.hero.talent.strengthening_meal.title=strengthening meal
actors.hero.talent.strengthening_meal.desc=_+1:_ Eating food grants the Duelist 3 bonus damage the next _2 times_ she hits an enemy with a physical attack.\n\n_+2:_ Eating food grants the Duelist 3 bonus damage the next _3 times_ she hits an enemy with a physical attack.
actors.hero.talent.adventurers_intuition.title=adventurer's intuition
actors.hero.talent.adventurers_intuition.desc=_+1:_ The Duelist identifies weapons _2.5x faster_ and armor _1.75x faster_.\n\n_+2:_ The Duelist identifies weapons _when she equips them_ and armor _2.5x faster_.
actors.hero.talent.patient_strike.title=patient strike
actors.hero.talent.patient_strike.desc=_+1:_ If the Duelist waits before performing a melee attack, she will deal _1-2 bonus damage_.\n\n_+2:_ If the Duelist waits before performing a melee attack, she will deal _2 bonus damage_.
actors.hero.talent.aggressive_barrier.title=aggressive barrier
actors.hero.talent.aggressive_barrier.desc=_+1:_ The Duelist gains _3 shielding_ when she uses a weapon ability and is at or below 50% health.\n\n_+2:_ The Duelist gains _5 shielding_ when she uses a weapon ability and is at or below 50% health.
actors.hero.talent.aggressive_barrier.meta_desc=_If this talent is gained by a different hero_ it will instead grant shielding when making a melee attack at low health, with a 50 turn cooldown.
actors.hero.talent.focused_meal.title=focused meal
actors.hero.talent.focused_meal.desc=_+1:_ Eating food takes the Duelist 1 turn and grants her _0.67 charges_ on her weapons.\n\n_+2:_ Eating food takes the Duelist 1 turn and grants her _1 charge_ on her weapons.
actors.hero.talent.focused_meal.meta_desc=_If this talent is gained by a different hero_ it will instead grant bonus damage to their next hit equal to their level/3 at +1, or level/2 at +2.
actors.hero.talent.liquid_agility.title=liquid agility
actors.hero.talent.liquid_agility.desc=_+1:_ When drinking or throwing a potion, brew, or elixir, the Duelist has _3x evasion_, and has _3x accuracy_ on her next melee attack within 5 turns.\n\n_+2:_ When drinking or throwing a potion, brew, or elixir, the Duelist has _infinite evasion_, and has _infinite accuracy_ on her next melee attack within 5 turns.\n\nThis bonus lasts for one additional turn and attack when using potions of strength, experience, or alchemy items that must be crafted using those potions.\n\nFor alchemy items with higher output quantities (e.g. aqua brew), this talent has a chance to trigger based on how many of that item is produced.
actors.hero.talent.weapon_recharging.title=weapon recharging
actors.hero.talent.weapon_recharging.desc=_+1:_ The Duelist gains one weapon charge every _15 turns_ when under the effect of wand or artifact recharging buffs.\n\n_+2:_ The Duelist gains one weapon charge every _10 turns_ when under the effect of wand or artifact recharging buffs.
actors.hero.talent.weapon_recharging.meta_desc=_If this talent is gained by a different hero_ it will instead cause them to deal +5% melee damage while recharging at +1, or +7.5% melee damage while recharging at +2.
actors.hero.talent.lethal_haste.title=lethal haste
actors.hero.talent.lethal_haste.desc=_+1:_ When the Duelist lands a killing blow on an enemy with a weapon ability, she gains _3 turns_ worth of instant movement.\n\n_+2:_ When the Duelist lands a killing blow on an enemy with a weapon ability, she gains _5 turns_ worth of instant movement.
actors.hero.talent.lethal_haste.meta_desc=_If this talent is gained by a different hero_ it will instead trigger with regular weapon attacks, with a 100 turn cooldown.
actors.hero.talent.swift_equip.title=swift equip
actors.hero.talent.swift_equip.desc=_+1:_ The Duelist can switch her equipped weapon instantly _one time_ every 20 turns.\n\n_+2:_ The Duelist can switch her equipped weapon instantly _two times_ every 20 turns.\n\nIf the Duelist has this talent and it is not on cooldown, quick-using an unequipped weapon will equip it.
actors.hero.talent.precise_assault.title=precise assault
actors.hero.talent.precise_assault.desc=_+1:_ When the Duelist uses a weapon ability, she gains _2x accuracy_ on her next melee attack within 5 turns.\n\n_+2:_ When the Duelist uses a weapon ability, she gains _5x accuracy_ on her next melee attack within 5 turns.\n\n_+3:_ When the Duelist uses a weapon ability, she gains _infinite accuracy_ on her next melee attack within 5 turns.
actors.hero.talent.precise_assault.meta_desc=_If this talent is gained by a different hero_ it will instead increase melee accuracy by 10% at +1, 20% at +2, or 30% at +3.
actors.hero.talent.deadly_followup.title=deadly followup
actors.hero.talent.deadly_followup.desc=_+1:_ When the Duelist hits an enemy with a thrown weapon, she will deal _10% more melee damage_ to them for 5 turns.\n\n_+2:_ When the Duelist hits an enemy with a thrown weapon, she will deal _20% more melee damage_ to them for 5 turns.\n\n_+3:_ When the Duelist hits an enemy with a thrown weapon, she will deal _30% more melee damage_ to them for 5 turns.
actors.hero.talent.varied_charge.title=varied charge
actors.hero.talent.varied_charge.desc=_+1:_ The Champion instantly regains _0.17 weapon charges_ when she uses two different weapon abilities, with no time limit.\n\n_+2:_ The Champion instantly regains _0.33 weapon charges_ when she uses two different weapon abilities, with no time limit.\n\n_+3:_ The Champion instantly regains _0.5 weapon charges_ when she uses two different weapon abilities, with no time limit.
actors.hero.talent.twin_upgrades.title=twin upgrades
actors.hero.talent.twin_upgrades.desc=_+1:_ If one of the Champion's two equipped weapons has a lower level and is _2 or more tiers lower_ than the other weapon, it will be boosted to the other weapon's level.\n\n_+2:_ If one of the Champion's two equipped weapons has a lower level and is _1 or more tiers lower_ than the other weapon, it will be boosted to the other weapon's level.\n\n_+3:_ If one of the Champion's two equipped weapons has a lower level and is _the same tier or lower_ than the other weapon, it will be boosted to the other weapon's level.
actors.hero.talent.combined_lethality.title=combined lethality
actors.hero.talent.combined_lethality.desc=_+1:_ If the Champion attacks with a melee weapon immediately after using a different weapon's ability, that attack will execute any non-boss enemy left at _below 13% HP_.\n\n_+2:_ If the Champion attacks with a melee weapon immediately after using a different weapon's ability, that attack will execute any non-boss enemy left at _below 27% HP_.\n\n_+3:_ If the Champion attacks with a melee weapon immediately after using a different weapon's ability, that attack will execute any non-boss enemy left at _below 40% HP_.\n\nThis attack can be a regular melee weapon attack, or part of a weapon ability.
actors.hero.talent.unencumbered_spirit.title=unencumbered spirit
actors.hero.talent.unencumbered_spirit.desc=_+1:_ The Monk gains _50% more energy_ for each piece of _tier 3 or lower_ equipment she is using.\n\n_+2:_ This talent's effect is increased to _75% more energy_ for each piece of _tier 2 or lower_ equipment the Monk is using.\n\n_+3:_ This talent's effect is increased to _100% more energy_ for each piece of _tier 1_ equipment the Monk is using. She also gains a free cloth armor and studded gloves.\n\nNote that this talent gives no benefit from being unarmed or attacking with a Ring of Force.
actors.hero.talent.monastic_vigor.title=monastic vigor
actors.hero.talent.monastic_vigor.desc=_+1:_ If the Monk has _100% energy_, her abilities are empowered.\n\n_+2:_ If the Monk has _80% or more energy_, her abilities are empowered.\n\n_+3:_ If the Monk has _60% or more energy_, her abilities are empowered.\n\nWhen empowered:\n- Flurry applies your weapon's enchantment\n- Focus is instantaneous\n- Dash gains +4 range\n- Dragon Kick deals +50% damage and applies its knock back and stun effect to all adjacent enemies\n- Meditate slowly heals 20% of missing HP and grants 80% damage resistance.
actors.hero.talent.combined_energy.title=combined energy
actors.hero.talent.combined_energy.desc=_+1:_ If the Monk uses a weapon ability and a _4+ energy_ ability within 5 turns of each other, she regains 1 spent energy.\n\n_+2:_ If the Monk uses a weapon ability and a _3+ energy_ ability within 5 turns of each other, she regains 1 spent energy.\n\n_+3:_ If the Monk uses a weapon ability and a _2+ energy_ ability within 5 turns of each other, she regains 1 spent energy.
actors.hero.talent.close_the_gap.title=close the gap
actors.hero.talent.close_the_gap.desc=_+1:_ The Duelist blinks _up to two tiles_ toward her target when starting a duel.\n\n_+2:_ The Duelist blinks _up to three tiles_ toward her target when starting a duel.\n\n_+3:_ The Duelist blinks _up to four tiles_ toward her target when starting a duel.\n\n_+4:_ The Duelist blinks _up to five tiles_ toward her target when starting a duel.\n\nThis blink can go through hazards and enemies, but not solid terrain like walls. The blink is taken into account when determining if an enemy is in range to be challenged.
actors.hero.talent.invigorating_victory.title=invigorating victory
actors.hero.talent.invigorating_victory.desc=_+1:_ If the Duelist defeats her target before the duel ends, she heals for _5 HP plus 30% of the damage_ she took during the duel.\n\n_+2:_ If the Duelist defeats her target before the duel ends, she heals for _10 HP plus 50% of the damage_ she took during the duel.\n\n_+3:_ If the Duelist defeats her target before the duel ends, she heals for _15 HP plus 65% of the damage_ she took during the duel.\n\n_+4:_ If the Duelist defeats her target before the duel ends, she heals for _20 HP plus 75% of the damage_ she took during the duel.
actors.hero.talent.elimination_match.title=elimination match
actors.hero.talent.elimination_match.desc=_+1:_ If the Duelist challenges again within 3 turns of a duel ending, that challenge has a _16% reduced_ charge cost.\n\n_+2:_ If the Duelist challenges again within 3 turns of a duel ending, that challenge has a _30% reduced_ charge cost.\n\n_+3:_ If the Duelist challenges again within 3 turns of a duel ending, that challenge has a _40% reduced_ charge cost.\n\n_+4:_ If the Duelist challenges again within 3 turns of a duel ending, that challenge has a _50% reduced_ charge cost.
actors.hero.talent.elemental_reach.title=elemental reach
actors.hero.talent.elemental_reach.desc=_+1:_ Elemental strike's range is increased to _5 tiles_ from 4, and its width is increased to _75 degrees_ from 65.\n\n_+2:_ Elemental strike's range is increased to _6 tiles_ from 4, and its width is increased to _85 degrees_ from 65.\n\n_+3:_ Elemental strike's range is increased to _7 tiles_ from 4, and its width is increased to _95 degrees_ from 65.\n\n_+4:_ Elemental strike's range is increased to _8 tiles_ from 4, and its width is increased to _105 degrees_ from 65.
actors.hero.talent.striking_force.title=striking force
actors.hero.talent.striking_force.desc=_+1:_ The power of elemental strike's effect is increased by _30%_.\n\n_+2:_ The power of elemental strike's effect is increased by _60%_.\n\n_+3:_ The power of elemental strike's effect is increased by _90%_.\n\n_+4:_ The power of elemental strike's effect is increased by _120%_.
actors.hero.talent.directed_power.title=directed power
actors.hero.talent.directed_power.desc=_+1:_ The direct attack from elemental strike gains _+30% enchantment power_ for each enemy in range of elemental strike's effect, including the attack target.\n\n_+2:_ The direct attack from elemental strike gains _+60% enchantment power_ for each enemy in range of elemental strike's effect, including the attack target.\n\n_+3:_ The direct attack from elemental strike gains _+90% enchantment power_ for each enemy in range of elemental strike's effect, including the attack target.\n\n_+4:_ The direct attack from elemental strike gains _+120% enchantment power_ for each enemy in range of elemental strike's effect, including the attack target.
actors.hero.talent.feigned_retreat.title=feigned retreat
actors.hero.talent.feigned_retreat.desc=_+1:_ If an enemy attacks the Duelist's afterimage, she gains _2 turns_ of haste.\n\n_+2:_ If an enemy attacks the Duelist's afterimage, she gains _4 turns_ of haste.\n\n_+3:_ If an enemy attacks the Duelist's afterimage, she gains _6 turns_ of haste.\n\n_+4:_ If an enemy attacks the Duelist's afterimage, she gains _8 turns_ of haste.
actors.hero.talent.expose_weakness.title=expose weakness
actors.hero.talent.expose_weakness.desc=_+1:_ Enemies that attack the Duelist's afterimage become weak and vulnerable for _2 turns_.\n\n_+2:_ Enemies that attack the Duelist's afterimage become weak and vulnerable for _4 turns_.\n\n_+3:_ Enemies that attack the Duelist's afterimage become weak and vulnerable for _6 turns_.\n\n_+4:_ Enemies that attack the Duelist's afterimage become weak and vulnerable for _8 turns_.
actors.hero.talent.counter_ability.title=counter ability
actors.hero.talent.counter_ability.desc=_+1:_ If the Duelist uses a weapon ability within 3 turns of her afterimage being attacked, she will instantly regain _0.38 charges_.\n\n_+2:_ If the Duelist uses a weapon ability within 3 turns of her afterimage being attacked, she will instantly regain _0.77 charges_.\n\n_+3:_ If the Duelist uses a weapon ability within 3 turns of her afterimage being attacked, she will instantly regain _1.13 charges_.\n\n_+4:_ If the Duelist uses a weapon ability within 3 turns of her afterimage being attacked, she will instantly regain _1.5 charges_.
actors.hero.talent.heroic_energy.title=heroic energy
actors.hero.talent.heroic_energy.rat_title=ratroic energy
actors.hero.talent.heroic_energy.desc=_+1:_ The hero's armor ability has a _12% reduced_ charge cost.\n\n_+2:_ The hero's armor ability has a _23% reduced_ charge cost.\n\n_+3:_ The hero's armor ability has a _32% reduced_ charge cost.\n\n_+4:_ The hero's armor ability has a _40% reduced_ charge cost.
actors.hero.talent.ratsistance.title=ratsistance
actors.hero.talent.ratsistance.desc=_+1:_ Hostile ratmogrified enemies deal _-10% damage_.\n\n_+2:_ Hostile ratmogrified enemies deal _-19% damage_.\n\n_+3:_ Hostile ratmogrified enemies deal _-27% damage_.\n\n_+4:_ Hostile ratmogrified enemies deal _-35% damage_.
actors.hero.talent.ratlomacy.title=ratlomacy
actors.hero.talent.ratlomacy.desc=_+1:_ Using ratmogrify on a ratmogrified enemy makes them friendly and makes the transformation permanent.\n\n_+2:_ Using ratmogrify on a ratmogrified enemy makes them friendly, makes the transformation permanent, and gives them _2 turns_ of adrenaline.\n\n_+3:_ Using ratmogrify on a ratmogrified enemy makes them friendly, makes the transformation permanent, and gives them _4 turns_ of adrenaline.\n\n_+4:_ Using ratmogrify on a ratmogrified enemy makes them friendly, makes the transformation permanent, and gives them _6 turns_ of adrenaline.
actors.hero.talent.ratforcements.title=ratforcements
actors.hero.talent.ratforcements.desc=_+1:_ Using ratmogrify on yourself _spawns 1_ ally marsupial rat next to you.\n\n_+2:_ Using ratmogrify on yourself _spawns 2_ ally marsupial rats next to you.\n\n_+3:_ Using ratmogrify on yourself _spawns 3_ ally marsupial rats next to you.\n\n_+4:_ Using ratmogrify on yourself _spawns 4_ ally marsupial rats next to you.
actors.hero.herosubclass.kingy=rat king
actors.hero.herosubclass.kingy_desc=Reading the book of Mastery grants Rat King the power of all subclasses!
actors.hero.perks.perk_obtain=You learned %s!
actors.hero.perks.sucker_punch.name=sucker punch
actors.hero.perks.sucker_punch.desc=First surprise attack deals 25% additional armor-piercing damage.
actors.hero.perks.directive.name=directive
actors.hero.perks.directive.desc=First surprise attack gives 1.5 turns of haste.
actors.hero.perks$directivemovingtracker.name=Instant Steps
actors.hero.perks$directivemovingtracker.desc=Your movement will take 0 tiles unless you stop moving.\n\nMoves left: %s.
actors.hero.perks.follow_up_strike.name=follow-up strike
actors.hero.perks.follow_up_strike.desc=After hitting enemy with a bow or throwing weapon, next melee attack will deal 25% additional armor-piercing damage.
actors.hero.perks.hold_fast.name=hold fast
actors.hero.perks.hold_fast.desc=While waiting in place, you get additional %s-%s armor.
actors.hero.perks.protein_infusion.name=protein infusion
actors.hero.perks.protein_infusion.desc=The hero gets up to 2x speed and 1.5x evasion depending on their satiety.
actors.hero.perks.fishing_pro.name=fishing proficiency
actors.hero.perks.fishing_pro.desc=With 25% chance the fishing loot will be doubled.
actors.hero.perks.wand_pro.name=recharge proficiency
actors.hero.perks.wand_pro.desc=Your wands recharge 25% faster.
actors.hero.perks.iron_will.name=iron reflection
actors.hero.perks.iron_will.desc=Below 50% HP taking damage from physical or magical attacks will release damaging shockwaves into enemies.
actors.hero.perks.mystical_meal.name=mystical meal
actors.hero.perks.mystical_meal.desc=Eating grants 6 turns of artifact recharge.
actors.hero.perks.additional_money.name=bounty hunter
actors.hero.perks.additional_money.desc=Killing enemies drops gold equivalent to 20% of regularly dropped gold.
actors.hero.perks.better_bartering.name=efficient bartering
actors.hero.perks.better_bartering.desc=Trading with Rat King has 33% chance to not consume an item.
actors.hero.perks.potions.name=lots of experience
actors.hero.perks.potions.desc=Potions of Overload and Potions of Experience last 2x longer.
actors.hero.perks.more_bag.name=bigger lootbags
actors.hero.perks.more_bag.desc=Treasure bags from shop contain roughly 50% more items.
actors.hero.perks.no_oneshots.name=steel skin
actors.hero.perks.no_oneshots.desc=If the incoming damage is going to kill you from full HP, it will be reduced by 50%.
actors.hero.perks.collect_everything.name=magnetic meal
actors.hero.perks.collect_everything.desc=Eating overpriced rations causes every top item in every heap on the map to be collected instantly.
actors.hero.perks.rat_summons.name=ratforcements
actors.hero.perks.rat_summons.desc=Searching in place will spawn several ally marsupial rats next to you, with 25 turns of adrenaline.
actors.hero.perks.grass_healing.name=restored nature
actors.hero.perks.grass_healing.desc=Drinking a potion of healing spawns 5x5 square of grass, centered around the hero, and roots every enemy inside it for 3 turns.
actors.hero.perks.friendly_bees.name=friendly bees
actors.hero.perks.friendly_bees.desc=All bees, spawned from shattered honeypots, will fight for hero.
actors.hero.perks.raritize_magic.name=Raritizing Magic
actors.hero.perks.raritize_magic.desc=Mobs will drop an item (artifacts, wands, weapons, rings, armors) with rarity (or nothing) at 7% chance.
actors.hero.perks.supply_rations.name=Cached Rations
actors.hero.perks.supply_rations.desc=You can now find cached rations in chests with _1/(25 + (5 * rations found))_ chance while you explore the next few floors in the dungeon.\n\nSupply rations are eaten quickly, restore a moderate amount of satiety, heal 5 hp, and restore 1 charge to the cloak of shadows (if you have the item).
actors.hero.perks.dungeon_berry.name=Nature's Bounty
actors.hero.perks.dungeon_berry.desc=You can now find berries in tall grass with _1/(15 + (5 * berries found))_ chance while you explore the next few floors in the dungeon.\n\nBerries are eaten quickly, restore a moderate amount of satiety, and might contain a usable seed.
actors.mobs.npcs.blacksmith.name=troll blacksmith
actors.mobs.npcs.blacksmith.intro_quest_ratking=Hello Our Majesty!
actors.mobs.npcs.blacksmith.intro_quest_warrior=Hey Human! You look like a tough one.
actors.mobs.npcs.blacksmith.intro_quest_mage=Hey Human! You look like a smart one.
actors.mobs.npcs.blacksmith.intro_quest_rogue=Hey Human! You look like a sneaky one.
actors.mobs.npcs.blacksmith.intro_quest_huntress=Hey Human! You look like a quick one.
actors.mobs.npcs.blacksmith.intro_quest_duelist=Hey Human! You look like a brave one.
actors.mobs.npcs.blacksmith.intro_quest_cleric=Hey Human! You look like an important one.
actors.mobs.npcs.blacksmith.intro_quest_start=Wanna be useful, eh? Yeah I got something you could do. I built dis workshop ontop of an old mine, it's just down dat ladder. Take dis pickaxe and mine me some _dark gold ore. 40 pieces_ should be enough. The rock down der is nice and soft so _you'll be able to mine through the walls with some effort._\n\nWhat do you mean, how am I gonna pay? You greedy...\n\nOk, ok, I can do some smithin' for you. Consider yourself lucky, I'm the only blacksmith around.
actors.mobs.npcs.blacksmith.intro_quest_crystal=Careful though, the mine's dangerous for a little human like you. It's been abandoned for a while, and bunch of crystals have started growing. They're shiny, but too fragile to be worth anythin', and they've got some magic things protecting 'em. They're pretty strong, so _be careful where you mine_ or you'll get their attention.\n\nThere's a _giant crystal_ somewhere too. It's a lot tougher, so be prepared for a fight if you start breakin' it. I'll bet smashing it will slow all the crystal growth down though, so I'll pay extra if you can do it.
actors.mobs.npcs.blacksmith.intro_quest_gnoll=Careful though, the mine's dangerous for a little human like you. Some gnolls want the gold too and now they're wreckin' the place. They're stupid things, so their mining has caused all sorts of collapses and cave-ins. You'll have to mine through it, so _look for recently disturbed rock._\n\nI think one of the gnolls is causing most of the trouble, probably a _geomancer shaman_ or somethin'. I'll pay extra, if you can find and kill it, but I'm sure it'll fight back.
actors.mobs.npcs.blacksmith.intro_quest_fungi=Careful though, the mine's dangerous for a little human like you. There's some sorta fungus monster that's been growing down there. It's got mushroom sentries that're really deadly if they see you, but they can't get up and chase you at least. _Keep out of sight_ if you want to stay alive.\n\nI'll pay extra if you can manage to take down the _biggest mushrom,_ but it'll take some real effort. It's connected to a bunch of mycelium nodes that're hidden in the walls. You'll have to break most of 'em before you can really damage it.
actors.mobs.npcs.blacksmith.reminder=You done wastin' my time? The mine entrance is over there.
actors.mobs.npcs.blacksmith.reminder_crystal=Bring me as much gold as you can, and try to break the big crystal too.
actors.mobs.npcs.blacksmith.reminder_gnoll=Bring me as much gold as you can, and try to kill the gnoll geomancer too.
actors.mobs.npcs.blacksmith.reminder_fungi=Bring me as much gold as you can, and try to kill the giant mushroom too.
actors.mobs.npcs.blacksmith.lost_pick=Are you kiddin' me? Where is my pickaxe?!
actors.mobs.npcs.blacksmith.quest_start_prompt=You ready to go down? Make sure you've got some free space for the gold.\n\n_I'm only lettin' you down der once!_
actors.mobs.npcs.blacksmith.enter_yes=I'm Ready
actors.mobs.npcs.blacksmith.enter_no=Not Yet
actors.mobs.npcs.blacksmith.exit_warn_none=You done already? You've hardly got any gold at all! You should be able to get _40 pieces._\n\n_Remember, I'm not lettin' you back in once you come up._
actors.mobs.npcs.blacksmith.exit_warn_low=You done already? Doesn't look like you've got a lot of gold. You should be able to get _40 pieces._\n\n_Remember, I'm not lettin' you back in once you come up._
actors.mobs.npcs.blacksmith.exit_warn_med=You done? You've got some gold at least, but there's definitely more in the mine. You should be able to get _40 pieces._\n\n_Remember, I'm not lettin' you back in once you come up._
actors.mobs.npcs.blacksmith.exit_warn_high=You done? Looks like you've got a good amount of gold, but I could use a bit more. You should be able to get _40 pieces._\n\n_Remember, I'm not lettin' you back in once you come up._
actors.mobs.npcs.blacksmith.exit_warn_full=You done? You've got lots of gold, but make sure you haven't left any of your gear behind.\n\n_Remember, I'm not lettin' you back in once you come up._
actors.mobs.npcs.blacksmith.exit_warn_crystal=That giant crystal's still down there too. I'll pay extra if you destroy it.
actors.mobs.npcs.blacksmith.exit_warn_gnoll=That gnoll geomancer's still down there too. I'll pay extra if you kill it.
actors.mobs.npcs.blacksmith.exit_warn_fungi=That giant mushroom's still down there too. I'll pay extra if you kill it.
actors.mobs.npcs.blacksmith.exit_yes=I'm Done
actors.mobs.npcs.blacksmith.exit_no=Not Yet
actors.mobs.npcs.blacksmith.entrance_blocked=The way down is blocked.
actors.mobs.npcs.blacksmith.cant_enter_old=That area is not accessible on this run. Play a new game to try the new quest!
actors.mobs.npcs.blacksmith.def_verb=blocked
actors.mobs.npcs.blacksmith.desc=This troll blacksmith looks like all trolls look: he is tall and lean, and his skin resembles stone in both color and texture. The troll blacksmith is tinkering with disproportionally small tools.
actors.mobs.npcs.blacksmith.gold_1=Hey human! Wanna be useful, eh? Take dis pickaxe and mine me some _dark gold ore, 15 pieces_ should be enough. What do you mean, how am I gonna pay? You greedy...\nOk, ok, I don't have money to pay, but I can do some smithin' for you. Consider yourself lucky, I'm the only blacksmith around.
actors.mobs.npcs.blacksmith.blood_1=Hey human! Wanna be useful, eh? Take dis pickaxe and _kill a bat_ wit' it, I need its blood on the head. What do you mean, how am I gonna pay? You greedy...\nOk, ok, I don't have money to pay, but I can do some smithin' for you. Consider yourself lucky, I'm the only blacksmith around.
actors.mobs.npcs.blacksmith.gold_2=Dark gold ore. 15 pieces. Seriously, is it dat hard?
actors.mobs.npcs.blacksmith.blood_2=I said I need bat blood on the pickaxe. Chop chop!
actors.mobs.npcs.blacksmith.completed=Oh, you have returned... Better late dan never.
actors.mobs.npcs.blacksmith.get_lost=I'm busy. Get lost!
actors.mobs.npcs.blacksmith.same_item=Select 2 different items, not the same item twice!
actors.mobs.npcs.blacksmith.diff_type=Select 2 items of the same type!
actors.mobs.npcs.blacksmith.un_ided=I need to know what I'm working with, identify them first!
actors.mobs.npcs.blacksmith.cursed=I don't work with cursed items!
actors.mobs.npcs.blacksmith.degraded=It's junk, the quality is too poor!
actors.mobs.npcs.blacksmith.cant_reforge=I can't reforge these items!
actors.mobs.npcs.blacksmith.key=Oh, you here. I never thought that you will actually finish this quest. It's quite embarrassing to get busted so easily... Did you know, than Wand of Fireblast had a brother? He is called Wand of Avalanche.\n\nThe people loved him more than his sister... That's why it was banished, to point of no return. Until now.\n\nI was really bored and decided to extract this wand from game files, but they were erased, as usual. But I have managed to program it back. It was quite glitchy, hehehe. But don't worry, this new wand is completely fixed and will work as designed!\n\n(Wand of Avalanche recipe has been added.)
actors.mobs.npcs.ghost.name=sad ghost
actors.mobs.npcs.ghost.rat_1=Hello %s... Once I was like you - strong and confident... But I was slain by a foul beast... I can't leave this place... Not until I have my revenge... Slay the _fetid rat,_ that has taken my life...\n\nIt stalks this floor... Spreading filth everywhere... _Beware its cloud of stink and corrosive bite, the acid dissolves in water..._
actors.mobs.npcs.ghost.rat_2=Please... Help me... Slay the abomination...\n\n_Fight it near water... Avoid the stench..._
actors.mobs.npcs.ghost.gnoll_1=Hello %s... Once I was like you - strong and confident... But I was slain by a devious foe... I can't leave this place... Not until I have my revenge... Slay the _gnoll trickster,_ that has taken my life...\n\nIt is not like the other gnolls... It hides and uses thrown weapons... _Beware its poisonous and incendiary darts, don't attack from a distance..._
actors.mobs.npcs.ghost.gnoll_2=Please... Help me... Slay the trickster...\n\n_Don't let it hit you... Get near to it..._
actors.mobs.npcs.ghost.crab_1=Hello %s... Once I was like you - strong and confident... But I was slain by an ancient creature... I can't leave this place... Not until I have my revenge... Slay the _great crab,_ that has taken my life...\n\nIt is unnaturally old... With a massive single claw and a thick shell... _Beware its claw, you must surprise the crab or it will block with it..._
actors.mobs.npcs.ghost.crab_2=Please... Help me... Slay the Crustacean...\n\n_It will always block... When it sees you coming..._
actors.mobs.npcs.ghost.find_me=Thank you... come find me...
actors.mobs.npcs.ghost.desc=The ghost is barely visible. It looks like a shapeless spot of faint light with a sorrowful face.
actors.mobs.npcs.imp.name=ambitious imp
actors.mobs.npcs.imp.intro=Are you an adventurer? I love adventurers! You can always rely on them if something needs to be killed, am I right? For a bounty of course ;)
actors.mobs.npcs.imp.golems_1=In my case it's _golems_ that need to be killed. You see, I'm going to start a little business here, but those stupid golems are bad for business! It's very hard to negotiate with wandering lumps of granite, damn them! So please kill... let's say _4 of them_ and a reward is yours.
actors.mobs.npcs.imp.monks_1=In my case it's _monks_ who need to be killed. You see, I'm going to start a little business here, but those lunatics don't buy anything themselves and will scare away other customers. So please kill... let's say _5 of them_ and a reward is yours.
actors.mobs.npcs.imp.golems_2=How is your golem safari going? Just don't forget to grab those tokens.
actors.mobs.npcs.imp.monks_2=Oh, you're still alive! I knew that your kung-fu would be stronger ;) Just don't forget to grab those tokens.
actors.mobs.npcs.imp.cya=See you, %s!
actors.mobs.npcs.imp.hey=Psst, %s!
actors.mobs.npcs.imp.desc=Imps are lesser demons. They are notable for neither their strength nor their magic talent, but they are quite smart and sociable. Many imps prefer to live among non-demons.
actors.mobs.npcs.impshopkeeper.name=ambitious imp
actors.mobs.npcs.impshopkeeper.greetings=Hello, %s!
actors.mobs.npcs.impshopkeeper.greetings_ascent=What did you do %s? Shop quickly, I've got to get out of here!
actors.mobs.npcs.impshopkeeper.thief=I thought I could trust you!
actors.mobs.npcs.impshopkeeper.buyback=The imp cheerily returns your item.
actors.mobs.npcs.impshopkeeper.desc=The imp has set up a little shop on the border of the inner halls. It's nice to see a friendly face, but his prices certainly don't seem friendly.
actors.mobs.npcs.mirrorimage.name=mirror image
actors.mobs.npcs.mirrorimage.desc=This illusion bears a close resemblance to you, even seeming to wield your current weapon and armor.\n\nMirror images will seek and attack enemies using their mimicked weapon, which behaves the same as yours, but deals less damage. They start out nearly invisible, but must take on a form that's more easily seen in order to attack.\n\nWhile their offensive power can be potent, mirror images have no durability, and will fade the moment they take damage.
actors.mobs.npcs.prismaticimage.name=prismatic image
actors.mobs.npcs.prismaticimage.desc=This shimmering illusion bears a close resemblance to you, even seeming to wield your current weapon and armor.\n\nPrismatic images will attempt to seek and draw focus from enemies, using their enhanced defense and health to protect you. While they do not have the same offensive power as mirror images, they have enhanced durability, including receiving benefits from your armor.\n\nWhen reduced to 0 hp, prismatic images will fade over several turns, and can still be healed during this time. When no enemies are present, prismatic images will fade and rejoin their master.
actors.mobs.npcs.ratking.name=rat king
actors.mobs.npcs.ratking.not_sleeping=I'm not sleeping!
actors.mobs.npcs.ratking.what_is_it=What is it? I have no time for this nonsense. My kingdom won't rule itself!
actors.mobs.npcs.ratking.confused=Wha... Where am I? My kingdom needs me!
actors.mobs.npcs.ratking.crown_clothes=Put some clothes on! You're in no state to talk to royalty!
actors.mobs.npcs.ratking.crown_desc=Oooh, is that crown for me!? It looks much shinier than mine, so I graciously accept!\n\nIn fact, I think I can offer you something as a reward for this crown. A tremendous power befitting a hero such as yourself! Would you like that?
actors.mobs.npcs.ratking.crown_yes=Of course!
actors.mobs.npcs.ratking.crown_info=Tell me more first.
actors.mobs.npcs.ratking.crown_no=I'd rather not...
actors.mobs.npcs.ratking.crown_thankyou=Hehehe, thank you! Now go and make your king proud!
actors.mobs.npcs.ratking.crown_fine=Fine! It's not like I wanted it anyway...
actors.mobs.npcs.ratking.crown_after=Enjoying your new armor? No take-backsies!
actors.mobs.npcs.ratking.desc_crown=This rat is a little bigger than a regular marsupial rat. It's wearing dwarf king's crown on its head.
actors.mobs.npcs.ratking.desc_birthday=This rat is a little bigger than a regular marsupial rat. It's wearing a tiny green party hat instead of its usual crown. Happy birthday Rat King!
actors.mobs.npcs.ratking.desc_winter=This rat is a little bigger than a regular marsupial rat. It's wearing a tiny festive hat instead of its usual crown. Happy Holidays!
actors.mobs.npcs.ratking.desc=This rat is a little bigger than a regular marsupial rat. It's wearing a tiny crown on its head.
actors.mobs.npcs.ratking.ghastly=This mirror image is the manifestation of the Rat King's will. It will not run away, but still trade with you when needed.
actors.mobs.npcs.sheep.name=sheep
actors.mobs.npcs.sheep.baa.=Baa.
actors.mobs.npcs.sheep.baa...=Baa...
actors.mobs.npcs.sheep.def_verb=blocked
actors.mobs.npcs.sheep.desc=This is a magic sheep. What's so magical about it? You can't kill it. It will stand there until it magically fades away, all the while chewing cud with a blank stare.
actors.mobs.npcs.shopkeeper.name=shopkeeper
actors.mobs.npcs.shopkeeper.thief=Thief, Thief!
actors.mobs.npcs.shopkeeper.warn=Watch it! I won't warn you again.
actors.mobs.npcs.shopkeeper.flee=The shopkeeper flees!
actors.mobs.npcs.shopkeeper.sell=Sell an item
actors.mobs.npcs.shopkeeper.talk=Talk
actors.mobs.npcs.shopkeeper.buyback=The shopkeeper reluctantly returns your item.
actors.mobs.npcs.shopkeeper.talk_prison_intro=I have everything you need for a successful adventure!
actors.mobs.npcs.shopkeeper.talk_prison_warrior=That's an interesting seal you've got there, they're usually in one piece. You a disgraced hero or something? Well whatever you've done is none of my business, your coins are still good.
actors.mobs.npcs.shopkeeper.talk_prison_mage=Hehe, I think I've seen a wanted poster with your name on it somewhere in the city. On the run are we? Oh you're innocent are you? Of course, of course... Don't fret, I've got better things to do than report on you, but perhaps you should buy something to be sure?
actors.mobs.npcs.shopkeeper.talk_prison_rogue=Have you come from the thieves guild to clear the area? No, just shopping? Well kill a few monsters while you're here anyway. Don't expect a discount either, I pay good protection money to you people and you're barely keeping me safe down here.
actors.mobs.npcs.shopkeeper.talk_prison_huntress=You seem to be out of your element miss. Tight dungeon corridors aren't as spacious as grand halls or the forests surrounding the city are they? Hehe, oh don't mind my rambling, why not buy something?
actors.mobs.npcs.shopkeeper.talk_prison_duelist=Well if it isn't the travelling hero! If you're trying to save another town then good luck, the dangers here are much worse than petty bandit gangs. I'm sure you'll do better than anyone else could, just try to not die right outside my store.
actors.mobs.npcs.shopkeeper.talk_prison_rat_king=Greetings, Your Majesty. Why you are here at all? You already have all the luxury and popularity in the world... Just for fun? Okay...
actors.mobs.npcs.shopkeeper.talk_caves=Spend money, live longer.\n\nOh and say hello to that Troll blacksmith for me if you see him. Remind the lug that he still owes me money for that hammer I sold him last week!
actors.mobs.npcs.shopkeeper.talk_city=My wares can keep you safe down here.\n\n...And don't loiter if you please. It took forever to get the locals down here to leave me alone, I don't want you attracting any trouble!
actors.mobs.npcs.shopkeeper.talk_halls=Hey there, I've got special prices for demon hunters!\n\nOh and be careful down there! The demons below won't care how courageous you are. You can't come back up and spend more money if you're dead! ;)\n\nAre the demons like me? Hehe, not at all. I'm just a small fellow, not much of a fighter, and I've managed to keep my mind intact. The demons below are much stronger things, and they've all been enslaved by... well... just be careful down there.
actors.mobs.npcs.shopkeeper.talk_ascent=I don't know what you're planning to do with that amulet but I want no part of it. Buy something and move on, we both need to leave this place!
actors.mobs.npcs.shopkeeper.desc=This stout guy looks more appropriate for a trade district in some large city than for a dungeon. His prices explain why he prefers to do business here.\n\nHave you wondered, how he reacts to clay?
actors.mobs.npcs.wandmaker.name=old wandmaker
actors.mobs.npcs.wandmaker.intro_warrior=Oh, hello there! What a pleasant surprise to meet a warrior from the north in such a depressing place! You must have travelled quite far to get here. If you're looking for adventure, I may have a task for you.
actors.mobs.npcs.wandmaker.intro_rogue=Oh Goodness, you startled me! I haven't met a bandit from this place that still has his sanity, so you must be from the surface! If you're up to helping a stranger out, I may have a task for you.
actors.mobs.npcs.wandmaker.intro_mage=Oh, hello %s! I heard there was some ruckus regarding you and the wizards institute? Oh never mind, I never liked those stick-in-the-muds anyway. If you're willing, I may have a task for you.
actors.mobs.npcs.wandmaker.intro_huntress=Oh, hello miss! A friendly face is a pleasant surprise down here isn't it? In fact, I swear I've seen your face before, but I can't put my finger on it... Oh never mind, if you're here for adventure, I may have a task for you.
actors.mobs.npcs.wandmaker.intro_duelist=Oh, hello miss! What a pleasant surprise to meet a hero in such a depressing place! If you're up to helping an old man out, I may have a task for you.
actors.mobs.npcs.wandmaker.intro_ratking=Oh, big greetings, Your Majesty! What a honor to meet your enlightening presence in such depressing place! If you're fine with helping an old man out, I may have a task for you.
actors.mobs.npcs.wandmaker.intro_1=\n\nI came here to find a rare ingredient for a wand, but I've gotten myself lost, and my magical shield is weakening. I'll need to leave soon, but can't bear to go without getting what I came for.
actors.mobs.npcs.wandmaker.intro_dust=I'm looking for some _corpse dust._ It's a special kind of cursed bone meal that usually shows up in places like this. There should be a barricaded room around here somewhere, I'm sure some dust will turn up there. Do be careful though, the curse the dust carries is quite potent, _get back to me as fast as you can_ and I'll cleanse it for you.
actors.mobs.npcs.wandmaker.intro_ember=I'm looking for some _fresh embers_ from a newborn fire elemental. Elementals usually pop up when a summoning ritual isn't controlled, so just find some candles and a ritual site and I'm sure you can get one to pop up. You'll want to _avoid boxing yourself in_ while fighting it though, or you could _keep some sort of freezing item handy._ Newborn Elementals are pretty powerful and chaotic, but they can't stand the cold.
actors.mobs.npcs.wandmaker.intro_berry=The old warden of this prison kept a _rotberry plant,_ and I'm after one of its seeds. The plant has probably gone wild by now though, so getting it to give up a seed might be tricky. Its garden should be somewhere around here. Try to _keep away from its vine lashers_ if you want to stay in one piece. Using fire might be tempting but please don't, you'll kill the plant and destroy its seeds.
actors.mobs.npcs.wandmaker.intro_2=\n\nIf you can get that for me, I'll be happy to pay you with one of my finely crafted wands! I brought two with me, so you can take whichever one you prefer.
actors.mobs.npcs.wandmaker.reminder_dust=Any luck with corpse dust, %s? Look for some barricades.
actors.mobs.npcs.wandmaker.reminder_ember=Any luck with those embers, %s? You'll need to find four candles and the ritual site.
actors.mobs.npcs.wandmaker.reminder_berry=Any luck with a Rotberry seed, %s? Look for a room filled with vegetation.
actors.mobs.npcs.wandmaker.def_verb=blocked
actors.mobs.npcs.wandmaker.desc=This old yet hale gentleman wears a slightly confused expression. He is protected by a magic shield.
actors.mobs.npcs.wandmaker.cheese=Oh god, cheese! You found it for me? Awesome! I will give you my most powerful wand in possession, although it's little unfinished.\n\nYou can try to kill that big slime again with it.
actors.mobs.npcs.hook.name=hook
actors.mobs.npcs.hook.desc=The hook from your cool fishing rod.
actors.mobs.npcs.expgenerator.name=power plant
actors.mobs.npcs.expgenerator.desc=This golden masterpiece gathers hidden sunlight and turns it into experience. You can damage to get the generator back.
actors.mobs.npcs.bbat.name=bbat
actors.mobs.npcs.bbat.desc=This bat is trained to hunt weak targets while the owner survives in battlefield. It has high dexterity, but pretty low offensive stats. 
actors.mobs.npcs.bbat$bbatrecharge.name=Bbat Recharge
actors.mobs.npcs.bbat$bbatrecharge.desc=Bbat needs %s turns to recover from damage and return to fight. You can summon it with your Cloak of Shadows
actors.mobs.acidic.name=acidic scorpio
actors.mobs.acidic.desc=These huge arachnid-like demonic creatures avoid close combat, preferring to fire crippling serrated spikes from long distances. This one appears to be dripping with corrosive ooze.
actors.mobs.albino.name=albino rat
actors.mobs.albino.desc=This is a rare breed of marsupial rat, with pure white fur and jagged teeth.
actors.mobs.armoredstatue.name=armored statue
actors.mobs.armoredstatue.desc=You would think that it's just another one of this dungeon's inanimate statues, but its red glowing eyes give it away.\n\nIt seems to be in great condition because of the armor it's wearing, it might be very hard to kill.
actors.mobs.armoredstatue.desc_arm_wep=While the statue itself is made of stone, the _%1$s_ and _%2$s_ it's wielding look real.
actors.mobs.bandit.name=crazy bandit
actors.mobs.bat.name=vampire bat
actors.mobs.bat.desc=These brisk and tenacious inhabitants of the caves are much more dangerous than they seem. They replenish their health with each successful attack, which allows them to defeat much larger opponents.
actors.mobs.bee.name=golden bee
actors.mobs.bee.desc_honey=Despite their small size, golden bees tend to protect their home fiercely. This one has been placated, and seems to want to follow you.
actors.mobs.bee.desc=Despite their small size, golden bees tend to protect their home fiercely. This one is very mad, better keep your distance.
actors.mobs.brute.name=gnoll brute
actors.mobs.brute.enraged=enraged
actors.mobs.brute.def_verb=blocked
actors.mobs.brute.desc=Brutes are the largest, strongest, and toughest of all gnolls. When mortally wounded, they go berserk, gaining temporary shielding and a large boost to damage.
actors.mobs.brute$bruterage.name=brute rage
actors.mobs.brute$bruterage.desc=This gnoll brute is dying, but wants to take you with it!\n\nThe brute will die when its shielding wears off, either due to time or if it is damaged. In the meantime, it will deal hugely increased damage, so watch out!\n\nShield remaining: %d.
actors.mobs.causticslime.name=caustic slime
actors.mobs.causticslime.desc=This slime seems to have been tainted by the dark magic emanating from below. It has lost its usual green color, and drips with caustic ooze.
actors.mobs.crab.name=sewer crab
actors.mobs.crab.desc=These huge crabs are at the top of the food chain in the sewers. They are extremely fast and their thick carapace can withstand heavy blows.
actors.mobs.crystalguardian.name=crystal guardian
actors.mobs.crystalguardian.def_verb=blocked
actors.mobs.crystalguardian.desc=These large crystalline guardians almost look like statues, if it weren't for their bright glowing eyes. The hardened crystal they're made out of causes them to be sluggish but very tough, so _it's best to leave them to sleep in their crystal nest for as long as possible._\n\nDue to their size, crystal guardians will move much more slowly in enclosed spaces. They're also so durable that they're impossible to kill outright. They can be beaten down and temporarily disabled, but they'll just get back up again after a little while.
actors.mobs.crystalmimic.name=crystal mimic
actors.mobs.crystalmimic.ate=The mimic ate your %s!
actors.mobs.crystalmimic.escaped=The crystal mimic has escaped!
actors.mobs.crystalmimic.desc=Mimics are magical creatures which can take any shape they wish. In dungeons they almost always choose a shape of a treasure chest, in order to lure in unsuspecting adventurers.\n\nCrystal mimics are trickier than their regular cousins, and prefer to avoid conflict while stealing loot. They will attempt to sprint away once discovered, and have the ability to reposition enemies when they attack.
actors.mobs.crystalspire.name=crystal spire
actors.mobs.crystalspire.warning=The crystal vibrates as you strike it. Keeping this up is bound to draw attention to you...
actors.mobs.crystalspire.alert=The vibration grows and rumbles through the whole cave!
actors.mobs.crystalspire.desc=This gigantic spire of ultra hard crystal is probably the source of all the strange crystalline creatures in this cave. Your regular weapons are ineffective against it, so you'll need to use your pickaxe if you want to destroy it.\n\n_Make sure you're prepared before you start breaking it._ Such a big crystal is likely to take a while to mine through, and you probably won't be able to do it undisturbed. The spire itself may even have some means of defending itself as well. _Perhaps the spire's own attacks could be used against its minions._
actors.mobs.crystalwisp.name=crystal wisp
actors.mobs.crystalwisp.beam_kill=The beam of light killed you...
actors.mobs.crystalwisp.desc=A small angry floating chunk of hardened crystal that's producing a bright glow. While not especially strong, crystal wisps will shoot a damaging beam of light at you if they have a clear shot.\n\nWisps are small enough to easily move through the various crystal outcroppings, but they aren't able to shoot through them.
actors.mobs.demonspawner.name=demon spawner
actors.mobs.demonspawner.on_death=The demonic energy here seems to lessen as the spawner dies.
actors.mobs.demonspawner.desc=This twisting amalgam of dwarven flesh is responsible for creating ripper demons from the dwarves that have died in this region. Clearly the demons see no issue with using every resource they can against their enemies.\n\nWhile visually terrifying, demon spawners have no means of moving or directly defending themselves. Their considerable mass makes them hard to kill quickly however, and they will spawn ripper demons more quickly when they are under threat.\n\n_Demon spawners seem to be connected to some central source of demonic power. Killing them may weaken it._
actors.mobs.dm100.name=DM-100
actors.mobs.dm100.zap_kill=The lightning bolt killed you...
actors.mobs.dm100.desc=The DM-100 is an early model of dwarven 'defense machine' which was designed to protect dwarven miners in the caves below this prison. Their electrical shocks proved too weak however, and so they were gifted to the human city above. They went unused for years and eventually found their way to the prison, where the warden initially deemed them too cruel to use. However, as the prisoners became more unruly they became a necessity.
actors.mobs.dm200.name=DM-200
actors.mobs.dm200.vent=The DM-200 fires a jet of toxic exhaust!
actors.mobs.dm200.desc=The DM-200 is the second generation of dwarven 'defense machine', which was designed to protect dwarven miners in the caves and city below. They are much larger and bulkier than their predecessors, and attack with devastating hydraulic fists.\n\nTheir increased size is also their primary weakness, as they are unable to fit into the narrow tunnels and doorways of the dungeon. The dwarves were able to compensate for the DM-200's lack of mobility by allowing them to vent their toxic exhaust fumes at distant enemies, or enemies they cannot reach.
actors.mobs.dm201.name=DM-201
actors.mobs.dm201.vent=The DM-201 lobs a corrosive grenade!
actors.mobs.dm201.desc=The dwarves briefly experimented with more heavily emphasizing the DM-200's lack of mobility and created some DM models that are entirely stationary. The DM-201 is a retrofitted DM-200 which acts as a sentry turret that has no movement ability. In exchange for the lack of mobility, DM-201s have significantly more durability and attacking power.\n\nAs DM-201s have no engine to vent exhaust from, the dwarves instead outfitted them with corrosive gas grenades! DM-201s are careful with these grenades however, and will only lob them when attacked from a distance.
actors.mobs.dm300.name=DM-300
actors.mobs.dm300.notice=UNAUTHORIZED PERSONNEL DETECTED!
actors.mobs.dm300.shield=DM-300 pulls power from the exposed wires and shields itself!
actors.mobs.dm300.charging=SUSTAINING DAMAGE! ACTIVATING POWER PYLON!
actors.mobs.dm300.charging_hint=DM-300 is invulnerable while it is being energized by a pylon!
actors.mobs.dm300.supercharged=DESTROY! DESTROY! DESTROY!
actors.mobs.dm300.charge_lost=PYLON DESTROYED! REVERTING TO LOCAL POWER!
actors.mobs.dm300.pylons_destroyed=ALERT! INSTABILITY DETECTED IN POWER GRID!
actors.mobs.dm300.rankings_desc=Crushed by the DM-300
actors.mobs.dm300.def_verb=blocked
actors.mobs.dm300.defeated=CRITICAL DAMAGE! ATTEMPTING SHUTDO-
actors.mobs.dm300.desc=The DM-300 is the largest and most powerful 'defense machine' that the dwarves ever built. Such an awesome machine is difficult to manufacture, so the dwarves only ever made a few to guard the entrances to their underground metropolis.\n\nIt is equipped with vents to jet its toxic exhaust fumes and a high power drill that it can use both to attack and disrupt the earth. DM-300 can also connect to an energy grid, further enhancing its power.
actors.mobs.dm300.desc_supercharged=DM-300 is currently charged full of electrical energy. In this form DM-300 cannot be damaged and moves at double speed! Additionally, its drill now spins fast enough for it to _tunnel through solid rock,_ though it moves much more slowly when doing this.\n\nAttacking DM-300 directly is pointless while it is supercharged, but _something in the area must be providing it with this energy,_ destroying that may weaken it.
actors.mobs.blackmimic.name=darkened mimic
actors.mobs.blackmimic.notice=Hey, you did go there.
actors.mobs.blackmimic.shield=I have powerfield for you!
actors.mobs.blackmimic.vent=How about some corrosive experience?
actors.mobs.blackmimic.rocks=Crush him, rocks!
actors.mobs.blackmimic.bomb=Explode!
actors.mobs.blackmimic.summon=TASTE THE MONSTERS
actors.mobs.blackmimic.charging=YOU FOOL
actors.mobs.blackmimic.charging_hint=Darkened Mimic is invulnerable while power pylon is there!
actors.mobs.blackmimic.supercharged=STOP RIGHT THERE YOU IDIOT
actors.mobs.blackmimic.charge_lost=WHHHHAAAAAT
actors.mobs.blackmimic.pylons_destroyed=HOW
actors.mobs.blackmimic.rankings_desc=Consumed by his own greed
actors.mobs.blackmimic.def_verb=blocked
actors.mobs.blackmimic.defeated=NOOOOOOOOOOOOOOOOOOOOOO-
actors.mobs.blackmimic.desc=The embodiment of your endless avaritia. It hopes to consume you alongside with Amulet, while using various gas based attacks and summoning monsters from dungeon.
actors.mobs.blackmimic.desc_clone=This is a clone of Darkened Mimic. It doesn't announce its attacks, is immune to any damage and has reduced chance to summon another clone.
actors.mobs.blackmimic.desc_supercharged=Darkened Mimic is currently charged full of frustration, In this form the mimic cannot be damaged and moves at triple speed! Additionally, its jaws now are strong enough for it to _tunnel through solid rock,_ though it moves much more slowly when doing this.\n\nAttacking Darkened Mimic directly is pointless while it is supercharged, but _something in the area must be providing it with this energy,_ destroying that may weaken it.
actors.mobs.blackmimic$fallingrocks.desc=Loose rocks are tumbling down from the ceiling here, it looks like its about to collapse!
actors.mobs.dwarfking.name=King of Dwarves
actors.mobs.dwarfking.notice=How dare you! You have no idea what you're interfering with!
actors.mobs.dwarfking.lifelink_1=I have need of your essence, slave!
actors.mobs.dwarfking.lifelink_2=Bleed for me, slave!
actors.mobs.dwarfking.teleport_1=Deal with them, slave!
actors.mobs.dwarfking.teleport_2=Keep them busy, slave!
actors.mobs.dwarfking.wave_1=Enough! Arise my slaves!
actors.mobs.dwarfking.wave_2=More! Bleed for your king!
actors.mobs.dwarfking.wave_3=Useless! KILL THEM NOW!
actors.mobs.dwarfking.enraged=You cannot kill me %s. I. AM. IMMORTAL!
actors.mobs.dwarfking.losing=No! You can't do this... you have no idea what lies below...
actors.mobs.dwarfking.defeated=You've... Doomed us all...
actors.mobs.dwarfking.rankings_desc=Fell Before the King of Dwarves
actors.mobs.dwarfking.desc=Many years ago one of the highest wizards in the dwarven court uncovered secrets which gave him tremendous power over life and death. He soon put this power to use, subjugating and corrupting his peers, his king, and eventually every dwarven citizen. Now he is king, ruler over a legion of undead subjects.\n\nThe King of Dwarves is an aggressive foe, who will attempt to surround and overwhelm his enemies with his horde of undead minions.
actors.mobs.dwarfking$dkghoul.rankings_desc=Fell Before the King of Dwarves
actors.mobs.dwarfking$dkmonk.rankings_desc=Fell Before the King of Dwarves
actors.mobs.dwarfking$dkwarlock.rankings_desc=Fell Before the King of Dwarves
actors.mobs.dwarfking$dkgolem.rankings_desc=Fell Before the King of Dwarves
actors.mobs.ebonymimic.name=ebony mimic
actors.mobs.ebonymimic.reveal=There was a mimic there!
actors.mobs.ebonymimic.hidden_name=suspicious outline
actors.mobs.ebonymimic.hidden_desc=There seems to be something here, but it's almost totally transparent.
actors.mobs.ebonymimic.desc=Mimics are magical creatures which can take any shape they wish. In dungeons they almost always choose a shape of a treasure chest, in order to lure in unsuspecting adventurers.\n\nEbony mimics are extremely tough mimics with the ability to make themselves almost invisible. They lurk on things that adventurers are likely to interact with, but do contain loot of their own as well.\n\nThere can't be anything even stronger, _right?_
actors.mobs.elemental$fireelemental.name=fire elemental
actors.mobs.elemental$fireelemental.desc=Elementals are chaotic creatures that are often created when powerful occult magic isn't properly controlled. Elementals have minimal intelligence, and are usually associated with a particular type of magic.\n\nFire elementals are a common type of elemental which deals damage with fiery magic. They will set their target ablaze with melee attacks, and can occasionally shoot bolts of fire as well.
actors.mobs.elemental$newbornfireelemental.name=newborn fire elemental
actors.mobs.elemental$newbornfireelemental.charging=The elemental is charging up!
actors.mobs.elemental$newbornfireelemental.desc=Elementals are chaotic creatures that are often created when powerful occult magic isn't properly controlled. Elementals have minimal intelligence, and are usually associated with a particular type of magic.\n\nThis fire elemental is freshly summoned, but still quite dangerous!
actors.mobs.elemental$newbornfireelemental.desc_boss=Because of the chaotic nature of its summoning, this elemental can only spread fire in inaccurate blasts after charging for a turn.
actors.mobs.elemental$newbornfireelemental.desc_ally=Because this elemental was summoned by a spell, it has a little more control over its flame. It's incapable of making ranged attacks, but will ignite enemies it attacks in melee.
actors.mobs.elemental$frostelemental.name=frost elemental
actors.mobs.elemental$frostelemental.desc=Elementals are chaotic creatures that are often created when powerful occult magic isn't properly controlled. Elementals have minimal intelligence, and are usually associated with a particular type of magic.\n\nFrost elementals are a common type of elemental which weakens enemies with chilling magic. They will chill their target with melee and occasional ranged attacks. Their magic is much more effective in water.
actors.mobs.elemental$shockelemental.name=shock elemental
actors.mobs.elemental$shockelemental.desc=Elementals are chaotic creatures that are often created when powerful occult magic isn't properly controlled. Elementals have minimal intelligence, and are usually associated with a particular type of magic.\n\nShock elementals are a less common type of elemental which disrupts its enemies with electricity and flashes of light. In melee they will arc electricity to nearby enemies, and deal bonus damage to their primary target if they are in water. They will also occasionally focus a ranged blast of light at their target, temporarily blinding them.
actors.mobs.elemental$chaoselemental.name=chaos elemental
actors.mobs.elemental$chaoselemental.desc=Elementals are chaotic creatures that are often created when powerful occult magic isn't properly controlled. Elementals have minimal intelligence, and are usually associated with a particular type of magic.\n\nChaos elementals are rare and dangerous elementals which haven't stabilized to a particular element. They will unleash wild unpredictable magic when they attack.
actors.mobs.eye.name=evil eye
actors.mobs.eye.deathgaze_kill=The deathgaze killed you...
actors.mobs.eye.desc=Evil Eyes are floating balls of pent up demonic energy. While they are capable of melee combat, their true strength comes from their magic.\n\nAfter building energy for a short time an Evil Eye will unleash a devastating beam of energy called the _deathgaze._ Anything within the Evil Eye's sights will take tremendous damage, wise adventurers will run for cover.
actors.mobs.fetidrat.name=fetid rat
actors.mobs.fetidrat.desc=Something is clearly wrong with this rat. Its greasy black fur and rotting skin are very different from the healthy rats you've seen previously. Its pale green eyes make it seem especially menacing.\n\nThe rat carries a cloud of horrible stench with it, it's overpoweringly strong up close.\n\nDark ooze dribbles from the rat's mouth, it eats through the floor but seems to dissolve in water.
actors.mobs.fungalcore.name=fungal core
actors.mobs.fungalcore.desc=This gigantic mushroom must be the source of all the fungal activity in this cave.
actors.mobs.fungalsentry.name=fungal sentry
actors.mobs.fungalsentry.desc=This especially tall mushroom acts as a point of defense for the larger fungal network living in this cave.\n\nIt is immobile, but will shoot precise blasts of poison at anything that gets within its line of sight. While the impact of these blasts is fairly weak, _they can stack up deadly amounts of poison very quickly._ While it can be killed, it's probably best to avoid it.
actors.mobs.fungalspinner.name=fungal spinner
actors.mobs.fungalspinner.desc=This cave spinner appears to be being controlled by a parasitic fungus. The fungus has also changed its abilities, replacing its web and venom sacks with fungal growth.\n\nThe fungal spinner will spit plant life at you instead of webs, spreading fungal vegetation and potentially rooting you. While it can't poison, the fungal spinner will gain substantial damage resistance if it is adjacent to any mushrooms.
actors.mobs.ghoul.name=dwarven ghoul
actors.mobs.ghoul.desc=As dwarven society slowly began to collapse, and the current king of the dwarves seized absolute power, those who were weak or who resisted him were not treated well. As the king grew more adept at wielding dark magic, he bent these dwarves to his will, and now they make up the footsoldiers of his army.\n\nGhouls are not especially strong on their own, but always travel in groups and are much harder to kill in large numbers. _When a ghoul is defeated, it will rise again after a few turns as long as another ghoul is nearby._
actors.mobs.gnoll.name=gnoll scout
actors.mobs.gnoll.desc=Gnolls are hyena-like humanoids. They dwell in sewers and dungeons, venturing up to raid the surface from time to time. Gnoll scouts are regular members of their pack, they are not as strong as brutes and not as intelligent as shamans.
actors.mobs.gnollgeomancer.name=gnoll geomancer
actors.mobs.gnollgeomancer.warning=The geomancer begins to stir. Make sure you're ready before you continue!
actors.mobs.gnollgeomancer.alert=The geomancer awakens! The entire cave seems to shift as it leaps away while laughing madly!
actors.mobs.gnollgeomancer.rock_kill=The flying boulder killed you...
actors.mobs.gnollgeomancer.rockfall_kill=The falling rocks killed you...
actors.mobs.gnollgeomancer.desc=This impressively tall senior gnoll must be the source of the various earth-moving magic around here, and the organizer of all the gnoll activity. Unlike the gnoll sappers in the area, the geomancer is quite adept with its magic, and cannot be damaged by thrown or falling rocks. It doesn't have any way to fight in melee combat though.
actors.mobs.gnollgeomancer.desc_armor=The geomancer is currently encased in a layer of rock armor. _You'll need to get up close and break it away with your pickaxe before you can damage the geomancer._
actors.mobs.gnollgeomancer.desc_armor_sapper=_A nearby gnoll sapper is holding a device that is empowering the geomancer's rock armor. You won't be able to damage it at all right now!_
actors.mobs.gnollgeomancer.desc_sleeping=This impressively tall gnoll shaman is surrounded by a layer of rock, and looks almost like a statue. Looking closely you can see the rock magically move in time with the senior gnoll's breathing. It can't be harmed while encased in rock like this, and it appears to be enjoying a literal dirt nap.\n\nYou can probably break through the layers of rock with your pickaxe, but _be sure you're ready for a fight when you do so._ The geomancer must be the source of the various earth-moving magic around here, and the organizer of all the gnoll activity. _Defeating the gnolls scattered around here before fighting it might be a good idea._
actors.mobs.gnollguard.name=gnoll guard
actors.mobs.gnollguard.spear_warn=The gnoll lands a vicious blow with the tip of its spear!
actors.mobs.gnollguard.desc=A large and tough looking gnoll wielding a spear and a shield, but no helmet. These guards are likely brutes in training, roped into helping protect the mine from encroaching wildlife.\n\nThe gnoll guard is strong enough to wield the spear in one hand, but can't use it very well. _It will need fairly open space to attack at a distance, and will do notably less damage to you if you get up close._
actors.mobs.gnollguard.desc_armor=_A nearby gnoll sapper is holding a device that is granting this guard earthen armor, heavily reducing the damage it takes._
actors.mobs.gnollsapper.name=gnoll sapper
actors.mobs.gnollsapper.desc=A small and weak but intelligent gnoll with pale fur and a satchel full of various gadgets. They are likely here to assist with prospecting and mining dark gold, and have a nearby guard for protection. They are capable of fighting, but their attacks are pitifully weak, no stronger than a gnoll scout.\n\nInstead of fighting directly, sappers prefer to use the various gadgets they have to make the rocky environment attack for them. They don't know earth-moving magic themselves though, and so are pretty likely to use their gadgets recklessly. _There should be lots of ways to use their attacks against them, or their guard._
actors.mobs.gnolltrickster.name=gnoll trickster
actors.mobs.gnolltrickster.desc=A strange looking creature, even by gnoll standards. It hunches forward with a wicked grin, almost cradling the satchel hanging over its shoulder. Its eyes are wide with a strange mix of fear and excitement.\n\nThere is a large collection of poorly made darts in its satchel, they all seem to be tipped with various harmful substances.
actors.mobs.goldenmimic.name=golden mimic
actors.mobs.goldenmimic.desc=Mimics are magical creatures which can take any shape they wish. In dungeons they almost always choose a shape of a treasure chest, in order to lure in unsuspecting adventurers.\n\nGolden mimics are tougher mimics which try to attract the strongest adventurers. They have better loot, but are also much stronger than regular mimics.
actors.mobs.golem.name=golem
actors.mobs.golem.def_verb=blocked
actors.mobs.golem.desc=Golems are an attempt to correct the previous flaws in dwarven machinery via the dwarves newfound use of magic. They are much more compact and efficient compared to the DM-300 while still being very deadly.\n\nWhile golems are still too large to fit into passageways, the dwarves have given them new magical abilities to compensate. Golems can teleport themselves between rooms, and teleport enemies to them when they are out of reach.
actors.mobs.goo.name=Goo
actors.mobs.goo.notice=GLURP-GLURP!
actors.mobs.goo.defeated=glurp... glurp...
actors.mobs.goo.pumpup=Goo is pumping itself up!
actors.mobs.goo.enraged=enraged
actors.mobs.goo.gluuurp=GLUUUURP!
actors.mobs.goo.rankings_desc=Absorbed by the Goo
actors.mobs.goo.desc=Little is known about The Goo. It's quite possible that it is not even a creature, but rather a conglomerate of vile substances from the sewers that somehow gained basic intelligence. Regardless, dark magic is certainly what has allowed Goo to exist.\n\nIts gelatinous nature has let it absorb lots of dark energy, you feel a chill just from being near. If Goo is able to attack with this energy you won't live for long.
actors.mobs.goldengoo.name=Golden Goo
actors.mobs.goldengoo.notice=SHINE-GLURP!
actors.mobs.goldengoo.defeated=glurp... shine...
actors.mobs.goldengoo.pumpup=Golden Goo is charging golden radiance!
actors.mobs.goldengoo.enraged=radiant rage
actors.mobs.goldengoo.gluuurp=GOLDEN GLUUUURP!
actors.mobs.goldengoo.rankings_desc=Absorbed by the Golden Goo
actors.mobs.goldengoo.desc=A legendary radiant variant of The Goo. Infused with pure golden essence, defeating it yields unimaginable class wealth!
actors.mobs.goldengoo.reward=The Golden Goo dropped a radiant +4 %s!
actors.mobs.greatcrab.name=great crab
actors.mobs.greatcrab.noticed=The crab blocks with its massive claw.
actors.mobs.greatcrab.def_verb=blocked
actors.mobs.greatcrab.desc=This crab is gigantic, even compared to other sewer crabs. Its blue shell is covered in cracks and barnacles, showing great age. It lumbers around slowly, barely keeping balance with its massive claw.\n\nWhile the crab only has one claw, its size easily compensates. The crab holds the claw in front of any threat, shielding itself behind an impenetrable wall of carapace. However, the crab cannot block attacks it doesn't see coming, or attacks from multiple enemies at once.
actors.mobs.guard.name=prison guard
actors.mobs.guard.scorpion=Get over here!
actors.mobs.guard.def_verb=blocked
actors.mobs.guard.desc=Once keepers of the prison, these guards have long since become no different than the inmates. They shamble like zombies, brainlessly roaming through the halls in search of anything out of place, like you!\n\nThey carry chains around their hip, possibly used to pull in enemies to close range.
actors.mobs.mimic.name=mimic
actors.mobs.mimic.reveal=That chest is a mimic!
actors.mobs.mimic.hidden_hint=Something about this chest feels off... Walking up and trying to open it might be a bad idea.
actors.mobs.mimic.desc=Mimics are magical creatures which can take any shape they wish. In dungeons they almost always choose a shape of a treasure chest, in order to lure in unsuspecting adventurers.\n\nMimics have a nasty bite, but often hold more treasure than a regular chest.
actors.mobs.necromancer.name=necromancer
actors.mobs.necromancer.desc=These apprentice dark mages have flocked to the prison, as it is the perfect place to practise their evil craft.\n\nNecromancers will summon and empower skeletons to fight for them. Killing the necromancer will also kill the skeleton it summons.
actors.mobs.necromancer$necroskeleton.name=necromancer's skeleton
actors.mobs.necromancer$necroskeleton.desc=This skeleton has been summoned by a necromancer. It behaves just like a regular skeleton, and will die when the necromancer which summoned it is slain.
actors.mobs.mob.died=You hear something die in the distance.
actors.mobs.mob.rage=#$%^
actors.mobs.mob.rankings_desc=Slain by: %s
actors.mobs.monk.name=dwarf monk
actors.mobs.monk.def_verb=blocked
actors.mobs.monk.parried=parried
actors.mobs.monk.desc=These monks are fanatics, who have devoted themselves to protecting their king through physical might. So great is their devotion that they have totally surrendered their minds to their king, and now roam the dwarvern city like mindless zombies.\n\nMonks rely solely on the art of hand-to-hand combat, and are able to use their unarmed fists both for offense and defense. When they become focused, monks will parry the next physical attack used against them, even if it was otherwise guaranteed to hit. Monks build focus more quickly while on the move, and more slowly when in direct combat.
actors.mobs.monk$focus.name=focused
actors.mobs.monk$focus.desc=This monk is perfectly honed in on their target, and seem to be anticipating their moves before they make them.\n\nWhile focused, the next physical attack made against this character is guaranteed to miss, no matter what circumstances there are. Parrying this attack will spend the monk's focus, and they will need to build it up again to parry another attack. Monks build focus more quickly while they are moving.
actors.mobs.phantompiranha.name=phantom piranha
actors.mobs.phantompiranha.teleport_away=The phantom piranha teleports away...
actors.mobs.phantompiranha.desc=Phantom piranhas are a rare breed of piranha with magical abilities and eerie translucent bodies. They are capable of teleporting as they are being attacked, either to escape or to quickly get close to their enemy!\n\nWhile they are annoying to fight, their meat is prized for its magical properties.
actors.mobs.piranha.name=giant piranha
actors.mobs.piranha.desc=These carnivorous fish are not natural inhabitants of underground pools. They were bred specifically to protect flooded treasure vaults.
actors.mobs.pylon.name=power pylon
actors.mobs.pylon.desc_inactive=A power pylon, meant to help regulate the electricity which powers the machinery in this area.\n\nThe pylon is currently inactive and immune to damage.
actors.mobs.pylon.desc_active=A power pylon, meant to help regulate the electricity which powers the machinery in this area. The pylon is currently surging with electrical energy, this must be what's supercharging DM-300!\n\nIn this state pylons are vulnerable, but will arc electricity to nearby cells in a clockwise pattern. Due to their heavy metal construction, pylons are resistant to large amounts of damage.
actors.mobs.rat.name=marsupial rat
actors.mobs.rat.desc=Marsupial rats are aggressive but rather weak denizens of the sewers. They have a nasty bite, but are only life threatening in large numbers.
actors.mobs.ripperdemon.name=ripper demon
actors.mobs.ripperdemon.leap=The ripper demon prepares to leap!
actors.mobs.ripperdemon.desc=These horrific creatures are the result of the many dwarven corpses in this region being put to use by demonic forces. Rippers are emaciated ghoulish creatures that resemble dwarves, but with broken bodies and long sharp claws made of bone.\n\nRipper demons are not particularly durable, but they are agile and dangerous. They are capable of leaping great distances to quickly reach targets before goring them with their claws.
actors.mobs.rotheart.name=rot heart
actors.mobs.rotheart.desc=A Rotberry's fruit is very unique. Instead of rotting away and providing nutrients, the fruit grows, hardens, and encompasses the seed. It provides protection for the internal organs which grow inside the fruit. This giant orb is referred to as the heart of an adult rotberry plant.
actors.mobs.rotlasher.name=rot lasher
actors.mobs.rotlasher.desc=The rot lasher is a part of a mature rotberry plant's root structure, and also their primary means of defense. Lashers are blind and stuck into the ground, but will violently assault any nearby threat after taking a moment to detect them. When there is no nearby enemies, they stand motionless, attempting to blend in with surrounding vegetation.
actors.mobs.scorpio.name=scorpio
actors.mobs.scorpio.desc=These huge arachnid-like demonic creatures avoid close combat, preferring to fire crippling serrated spikes from long distances.
actors.mobs.senior.name=senior monk
actors.mobs.senior.desc=These monks are fanatics, who have devoted themselves to protecting their king through physical might. So great is their devotion that they have totally surrendered their minds to their king, and now roam the dwarvern city like mindless zombies.\n\nThis monk has mastered the art of hand-to-hand combat, and is able to gain focus while moving much more quickly than regular monks. When they become focused, monks will parry the next physical attack used against them, even if it was otherwise guaranteed to hit. Monks build focus more quickly while on the move, and more slowly when in direct combat.
actors.mobs.shaman.name=gnoll shaman
actors.mobs.shaman.bolt_kill=The magic bolt killed you...
actors.mobs.shaman.desc=Gnoll shamans are intelligent gnolls who use battle spells to compensate for their lack of might. They have a very respected position in gnoll society, despite their weaker strength.
actors.mobs.shaman$redshaman.spell_desc=This shaman is wearing a red mask, and will use magic that temporarily _weakens your attacking power._
actors.mobs.shaman$blueshaman.spell_desc=This shaman is wearing a blue mask, and will use magic that temporarily _increases the damage you take._
actors.mobs.shaman$purpleshaman.spell_desc=This shaman is wearing a purple mask, and will use magic that temporarily _reduces your accuracy and evasion._
actors.mobs.armoredbrute.name=armored brute
actors.mobs.armoredbrute.desc=The most senior gnoll brutes often wear powerful armor to show their status. The armor makes these brutes much more resilient to physical damage, and their greater discipline means they can rage for much longer before succumbing to their wounds.
actors.mobs.skeleton.name=skeleton
actors.mobs.skeleton.explo_kill=You were killed by the explosion of bones...
actors.mobs.skeleton.def_verb=blocked
actors.mobs.skeleton.desc=Skeletons are composed of the bones of unlucky adventurers and inhabitants of the prison, animated by emanations of evil magic from the depths below. After they have been damaged enough, skeletons will disintegrate in an explosion of bones. The shrapnel from this explosion is harmful to anything nearby, but armor is very effective at mitigating it.
actors.mobs.slime.name=slime
actors.mobs.slime.def_verb=blocked
actors.mobs.slime.desc=Slimes are strange, slightly magical creatures with a rubbery outer body and a liquid core. The city sewers provide them with an ample supply of water and nutrients.\n\nBecause of their elastic outer membrane, it is difficult to deal more than _6 damage_ to slimes from any one attack.
actors.mobs.snake.name=sewer snake
actors.mobs.snake.hint=Try using the examine button on a snake to learn how to counter them.
actors.mobs.snake.desc=These oversized serpents are capable of quickly slithering around blows, making them quite hard to hit. Magical attacks or surprise attacks are capable of catching them off-guard however.\n\nYou can perform a surprise attack by attacking while out of the snake's vision. One way is to let a snake chase you through a doorway and then _strike just after it moves into the door._
actors.mobs.spectralnecromancer.name=spectral necromancer
actors.mobs.spectralnecromancer.desc=While Skeletons are a necromancer’s bread and butter, some prefer to look into other less corporeal minions. Spectral necromancers have chosen wraiths as their minion of choice!\n\nIndividual wraiths aren't as strong as skeletons, but these necromancers aren't afraid to summon a bunch of them!
actors.mobs.spinner.name=cave spinner
actors.mobs.spinner.desc=These greenish furry cave spiders try to avoid direct combat. Instead they prefer to wait in the distance while their victim struggles in their excreted cobweb, slowly dying from their venomous bite. They are capable of shooting their webs great distances, and will try to block whatever path their prey is taking.
actors.mobs.statue.name=animated statue
actors.mobs.statue.def_verb=blocked
actors.mobs.statue.desc=You would think that it's just another one of this dungeon's inanimate statues, but its red glowing eyes give it away.
actors.mobs.statue.desc_weapon=While the statue itself is made of stone, the _%s_ it's wielding looks real.
actors.mobs.succubus.name=succubus
actors.mobs.succubus.desc=Succubi are shapeshifting demons that manipulate the minds of their prey. This one has taken the form of a pale gothic humanoid, perhaps to attract dwarven warlocks?\n\nSuccubi may temporarily charm their enemy when they attack, making their enemy unable to directly attack them. When succubi attack a charmed enemy, they will steal some of their life essence.
actors.mobs.swarm.name=swarm of flies
actors.mobs.swarm.desc=The deadly swarm of flies buzzes angrily. Every non-magical attack will split it into two smaller but equally dangerous swarms.
actors.mobs.tengu.name=Tengu
actors.mobs.tengu.notice_gotcha=Gotcha, %s!
actors.mobs.tengu.interesting=Let's make this interesting...
actors.mobs.tengu.notice_have=I have you now, %s!
actors.mobs.tengu.defeated=Free at last...
actors.mobs.tengu.rankings_desc=Assassinated by the Tengu
actors.mobs.tengu.desc=A famous and enigmatic assassin, named for the mask grafted to his face.\n\nTengu is held down with large clasps on his wrists and knees, though he seems to have gotten rid of his chains long ago.\n\nHe will try to use traps, deceptive magic, and precise attacks to eliminate the only thing stopping his escape: you.
actors.mobs.tengu$bombability$bombblob.desc=A cloud of superheated smoke is billowing here. Watch out, it's going to explode!
actors.mobs.tengu$bombability$bombitem.name=Smoke Bomb
actors.mobs.tengu$bombability$bombitem.cant_pickup=It's stuck to the ground, you can't move it!
actors.mobs.tengu$bombability$bombitem.desc=Tengu has thrown a strange looking smoke bomb here, which is billowing a thick hot smoke. It's making a loud ticking noise, as if its counting down to an explosion!\n\nThe bomb has anchored itself to the ground, so you can't pick it up.
actors.mobs.tengu$fireability$fireblob.desc=Tengu has thrown a fine powder that seems to be catching into steam here, it's about to ignite!
actors.mobs.tengu$shockerability$shockerblob.desc=Electrical energy is building here, anything standing on this tile will be shocked next turn!
actors.mobs.tengu$shockerability$shockeritem.name=Shocker
actors.mobs.tengu$shockerability$shockeritem.cant_pickup=It's putting out too much electricity, you can't grab it!
actors.mobs.tengu$shockerability$shockeritem.desc=Tengu has thrown a curious machine here, which seems to be made of DM-100 parts. The machine is constantly arcing electricity around it, but it seems to be going in a predictable pattern.\n\nWith all the electricity arcing around it, there's no way you can pick this up.
actors.mobs.thief.name=crazy thief
actors.mobs.thief.stole=The thief stole %s from you!
actors.mobs.thief.carries=\n\nThe thief is carrying a _%s._ Stolen obviously.
actors.mobs.thief.escapes=The thief gets away with your %s!
actors.mobs.thief.desc=Though these inmates roam free of their cells, this place is still their prison. Over time, this place has taken their minds as well as their freedom. Long ago, these crazy thieves and bandits have forgotten who they are and why they steal.\n\nThese enemies are more likely to steal and run than they are to fight. Make sure to keep them in sight, or you might never see your stolen item again.
actors.mobs.oofthief.name=OOF thief
actors.mobs.oofthief.stole=The thief stole %s from you! You can recover it from resetting shop depths and buying %s from there!
actors.mobs.oofthief.escapes=The thief teleports away!
actors.mobs.oofthief.desc=Genetically engineered by tormented sparks of robots and funded by impossibly modified foxes, this variant of thief has been augmented to prevail above all its prison brothers.\n\nIt is roughly 2.5x times stronger than normal thieves in both resistance and accuracy, attacks 3 times in a row and sells all stolen loot to incredibly corrupted shop companies. It also has teleportation device to hide from its victims once enough property is stolen.\n\nOne of OOF thief's only weaknesses is its movement speed: it moves 3x faster than a normal human, but has _tendency to slip on a moss, or a rock, or a twig_ and make no progress in moving right to its target.\n\nOn the last breath, OOF thief will enter desperation mode, being immune to any damage for short time and moving significantly faster.
actors.mobs.tormentedspirit.name=tormented spirit
actors.mobs.tormentedspirit.desc=Tormented spirits are otherwise good-natured spirits that has been afflicted by a curse. So long as they are cursed they will attack just like a wraith, and are more powerful as well!\n\nIt may be possible to cleanse the curse by using the right item while next to the spirit. If the curse is lifted the spirit will surely be grateful...
actors.mobs.tormentedspirit.thank_you=Thank you...
actors.mobs.warlock.name=dwarf warlock
actors.mobs.warlock.bolt_kill=The shadow bolt killed you...
actors.mobs.warlock.desc=As the dwarves' interests shifted from engineering to arcane arts, warlocks came to power in the city. They started with elemental magic, but soon switched to demonology and necromancy. The strongest of these warlocks seized the throne of the dwarven city, and his cohorts were allowed to continue practising their dark magic, so long as they surrendered their free will to him.\n\nThese warlocks possess powerful disruptive magic, and are able to temporarily hinder the upgrade magic applied to your equipment. The more upgraded an item is, the more strongly it will be affected.
actors.mobs.wraith.name=wraith
actors.mobs.wraith.desc=A wraith is a vengeful spirit of a sinner, whose grave or tomb was disturbed. Being an ethereal entity, it is very hard to hit with a regular weapon.
actors.mobs.yogdzewa.name=Yog-Dzewa
actors.mobs.yogdzewa.notice=I. SEE. YOU.
actors.mobs.yogdzewa.darkness=The darkness pulls in closer...
actors.mobs.yogdzewa.hope=YOUR. HOPE. IS. AN. ILLUSION!
actors.mobs.yogdzewa.defeated=...
actors.mobs.yogdzewa.rankings_desc=Devoured by Yog-Dzewa
actors.mobs.yogdzewa.desc=Yog-Dzewa is an Old God; a great monstrosity which reaches into mortal worlds and devours them to fuel its endless growth. The dwarves must have attracted the attention of this cosmic horror while toying with dark magics, and have been trying to keep it contained ever since.\n\nYog-Dzewa originates from a dimension of raw magical chaos, and cannot bring its true form into this world. Instead it has created avatars and summoned demonic minions to do its bidding here.\n\nThis giant eye is the focal point of Yog-Dzewa's power in this world. While the eye itself is immobile, it is capable of shooting powerful beams of demonic magic and summoning a variety of minions to aid it.\n\nCan drop clay, if killed by Minecraft reference.
actors.mobs.yogdzewa.desc_spawners=You can feel waves of demonic energy radiating to the eye from the floors above. Something you left alive up there must be funneling power back into Yog-Dzewa. _Yog will use this energy to summon more powerful minions!_
actors.mobs.yogdzewa$larva.name=god's larva
actors.mobs.yogdzewa$larva.rankings_desc=Devoured by Yog-Dzewa
actors.mobs.yogdzewa$larva.desc=These tiny spawn of Yog-Dzewa are simple minions that are easy to produce. While individually weak, they are summoned quickly and can become overwhelming in large numbers.
actors.mobs.yogdzewa$yogripper.rankings_desc=Devoured by Yog-Dzewa
actors.mobs.yogdzewa$yogeye.rankings_desc=Devoured by Yog-Dzewa
actors.mobs.yogdzewa$yogscorpio.rankings_desc=Devoured by Yog-Dzewa
actors.mobs.yogfist.invuln_warn=The fist is invulnerable while near to the eye!
actors.mobs.yogfist.rankings_desc=Devoured by Yog-Dzewa
actors.mobs.yogfist.desc=This fist is an aspect of Yog-Dzewa's power. Fists are linked to the power of Yog-Dzewa, and will be protected from all damage when they are close to the eye.
actors.mobs.yogfist$burningfist.name=burning fist
actors.mobs.yogfist$burningfist.desc=This fist is formed out of chaotic fiery magic. As it moves it will constantly set terrain around it ablaze. It is also capable of shooting blasts of fiery power, which spread flames where they impact.\n\nThe fist's ability to spread flames is suppressed when near water, but its heat is so great that any water around it will evaporate after a short while!
actors.mobs.yogfist$soiledfist.name=soiled fist
actors.mobs.yogfist$soiledfist.desc=This fist is formed out of chaotic earthen magic. As it moves it will constantly cause vegetation to sprout around it. It can also shoot concentrated earthen blasts that will ensnare its target in rapidly growing vines and roots!\n\nThe fist derives power from this plant life, and will resist damage based on the amount of tall or furrowed vegetation near it!
actors.mobs.yogfist$rottingfist.name=rotting fist
actors.mobs.yogfist$rottingfist.desc=This fist is formed out of living corruption. It is a towering mass of decaying flesh that can spread caustic ooze in melee and toxic gas at range. Even worse, the fist's great mass causes it to bleed instead of taking damage directly.\n\nWater can be used to wash the ooze off, but the fist is also capable of absorbing water to heal itself! Additionally, damaging the fist while it is bleeding will cause the bleed to refresh, but not stack!
actors.mobs.yogfist$rustedfist.name=rusted fist
actors.mobs.yogfist$rustedfist.desc=This fist is formed out of living metal. It is a towering mass of shifting metal that has powerful melee attacks, and can cripple its targets at range. Because of its tremendous mass, the fist will take any damage dealt to it over time, instead of immediately.\n\nThe fist is inflexible however, and cannot move into tight passageways. Additionally, while it may take damage slowly, the deferred damage will continue to increase if the fist is hit multiple times.
actors.mobs.yogfist$brightfist.name=bright fist
actors.mobs.yogfist$brightfist.teleport=The fist teleports away in a flash of light that seriously blinds you!
actors.mobs.yogfist$brightfist.desc=This fist is formed out of pure light energy. It is capable of shooting powerful rays of searing light every turn! These beams will temporarily blind you in addition to dealing heavy damage. The fist is also capable of briefly engulfing the arena in blinding light in order to escape!\n\nThe fist has no special abilities which it can use in melee range however.
actors.mobs.yogfist$darkfist.name=dark fist
actors.mobs.yogfist$darkfist.teleport=The fist teleports away in a blast of darkness that extinguishes your light source!
actors.mobs.yogfist$darkfist.desc=This fist is formed out of pure dark energy. It is capable of shooting powerful blasts of dark magic every turn! These blasts will weaken your light source in addition to dealing heavy damage. The fist is also capable of briefly engulfing the arena in darkness in order to escape!\n\nThe fist has no special abilities which it can use in melee range however.
