###blobs
actors.blobs.blizzard.name=метель
actors.blobs.blizzard.desc=Здесь кружится ледяной буран.

actors.blobs.confusiongas.name=дезориентирующий газ
actors.blobs.confusiongas.desc=Здесь клубится дезориентирующий газ.

actors.blobs.electricity.name=электричество
actors.blobs.electricity.desc=Здесь сверкают электрические разряды.
actors.blobs.electricity.rankings_desc=Электрошок
actors.blobs.electricity.ondeath=Вы умерли от шокера...

actors.blobs.fire.name=огонь
actors.blobs.fire.desc=Здесь бушует пламя.

actors.blobs.foliage.name=листва
actors.blobs.foliage.desc=Потоки света пронзают мрак подземного сада.

actors.blobs.freezing.name=морозный воздух
actors.blobs.freezing.desc=Воздух здесь неестественно холоден.

actors.blobs.goowarn.name=тёмная энергия
actors.blobs.goowarn.desc=Здесь кружатся частицы тёмной энергии!

actors.blobs.inferno.name=адское пламя
actors.blobs.inferno.desc=Здесь бушует адское пламя.

actors.blobs.paralyticgas.name=парализующий газ
actors.blobs.paralyticgas.desc=Здесь клубится парализующий газ.

actors.blobs.regrowth.name=восстановление

actors.blobs.sacrificialfire.name=жертвенный огонь
actors.blobs.sacrificialfire.desc=Здесь стоит алтарь, на котором горит жертвенный огонь. Любое существо, убитое на нем, будет поглощено в качестве подношения духам подземелья.\n\nМожет быть, после достаточного количества жертвоприношений появится награда?
actors.blobs.sacrificialfire.worthy=Огонь поглощает ваше подношение и становится сильнее.
actors.blobs.sacrificialfire.unworthy=Огонь поглощает ваше подношение, но не изменяется.
actors.blobs.sacrificialfire.reward=Огонь вспыхивает, а затем рассеивается, оставляя после себя награду!

actors.blobs.smokescreen.name=дымовая завеса
actors.blobs.smokescreen.desc=Здесь клубится густой чёрный дым.

actors.blobs.stenchgas.name=зловонный газ
actors.blobs.stenchgas.desc=Здесь клубится облако жуткой вони.

actors.blobs.stormcloud.name=грозовые облака
actors.blobs.stormcloud.desc=Здесь клубятся облака водяного пара.

actors.blobs.toxicgas.name=токсичный газ
actors.blobs.toxicgas.desc=Здесь клубится зеленоватый ядовитый газ.
actors.blobs.toxicgas.rankings_desc=Задохнулся
actors.blobs.toxicgas.ondeath=Вы умерли от ядовитого газа...

actors.blobs.corrosivegas.name=коррозийный газ
actors.blobs.corrosivegas.desc=Здесь клубится облако разъедающего газа.

actors.blobs.waterofawareness.name=вода знаний
actors.blobs.waterofawareness.procced=Как только вы делаете глоток, вы чувствуете, как знания наполняют ваш разум.
actors.blobs.waterofawareness.desc=Вода в этом колодце излучает силу знаний. Глоток из этого колодца откроет все секреты экипированных вещей, опознает проклятия на всех предметах в инвентаре, и раскроет все предметы на текущем этаже.

actors.blobs.waterofhealth.name=вода здоровья
actors.blobs.waterofhealth.procced=Едва вы сделали глоток, ваши раны полностью затянулись.
actors.blobs.waterofhealth.desc=Вода в этом источнике излучает здоровье. Глоток этой воды исцелит раны, утолит голод и очистит проклятия любых носимых предметов.

actors.blobs.web.name=паутина
actors.blobs.web.desc=Здесь всё покрыто толстой паутиной. Всё, что коснётся паутины или будет брошено в неё, сломает паутину, но также застрянет на этом месте.



###buffs
actors.buffs.adrenaline.name=адреналин
actors.buffs.adrenaline.desc=Выброс адреналина увеличивает ваши физические возможности, ускоряя вашу атаку и скорость передвижения.\n\nАдреналин увеличивает скорость бега в два раза, а скорость атаки - в полтора.\n\nХодов осталось: %s.

actors.buffs.adrenalinesurge.name=увеличение силы
actors.buffs.adrenalinesurge.desc=Вы чувствуете значительный прилив сил. Но, к сожалению, это только временный эффект.\n\nБонус к силе: +%d.\nХодов до ослабления эффекта: %s.

actors.buffs.amok.name=буйство
actors.buffs.amok.desc=Буйство - это состояние лютой ненависти и дезориентации.\n\nКогда существо находится в этом состоянии, оно атакует любого, кто окажется рядом с ним, будь то друг или враг.\n\nХодов с буйством осталось: %s.

actors.buffs.arcanearmor.name=магическая броня
actors.buffs.arcanearmor.desc=Вас окружает едва заметный щит, уменьшающий урон от магических атак.\n\nВаша магическая защита увеличена на: 0-%d.\n\nХодов до ослабления защиты: %s.

actors.buffs.artifactrecharge.name=перезарядка артефакта
actors.buffs.artifactrecharge.desc=Энергия течет внутри вас, заряжая надетые артефакты.\n\nЭффект влияет на каждый артефакт по-своему, но они будут заряжаться гораздо быстрее чем обычно.\n\nХодов осталось: %s.

actors.buffs.ascensionchallenge.name=проклятие амулета
actors.buffs.ascensionchallenge.desc=Каким-то образом Йог-Джева оказывает влияние на этот мир через амулет и пытается остановить ваше восхождение!\n\nСила Йога делает подземелье более опасным, увеличивая количество врагов и делая их сильнее! Эта сила будет продолжать расти, если её не остановить. Её можно ослабить, победив врагов, усиленных силой Йога.
actors.buffs.ascensionchallenge.desc_clear=Темная энергия, исходящая от амулета, сейчас ослаблена настолько, насколько это возможно.
actors.buffs.ascensionchallenge.desc_beckon=Амулет сейчас _обращается к отдаленным врагам_, предупреждая их о вашем местонахождении.
actors.buffs.ascensionchallenge.desc_haste=Амулет сейчас _ускоряет дальних врагов_, позволяя им быстрее добраться до вас!
actors.buffs.ascensionchallenge.desc_slow=Амулет сейчас _замедляет вас_ и отрицает эффекты, увеличивающие скорость!
actors.buffs.ascensionchallenge.desc_damage=Энергия исходящая из амулета оказалась настолько сильной, что она напрямую вредит вам!
actors.buffs.ascensionchallenge.beckon=Амулет начинает подзывать противников издалека.
actors.buffs.ascensionchallenge.haste=Амулет начинает подгонять противников вдалеке!
actors.buffs.ascensionchallenge.slow=Амулет стал весить как гиря в вашем инвентаре!
actors.buffs.ascensionchallenge.damage=Амулет начал испускать тёмную энергию. Горячо!
actors.buffs.ascensionchallenge.weaken_info=Убийство врагов ослабит проклятие амулета.
actors.buffs.ascensionchallenge.weaken_info_no_kills=При убийстве врагов проклятие амулета будет слабеть!
actors.buffs.ascensionchallenge.weaken=Вы чувствуете, что проклятие амулета стало ослабевать.
actors.buffs.ascensionchallenge.break=Вы находите время перевести дыхание, и чувствуете, как ваши раны начинают заживать!
actors.buffs.ascensionchallenge.almost=Хватка Йога за амулет начинает ослабевать, вы практически добрались.
actors.buffs.ascensionchallenge.on_kill=Мрачная энергия поглотила вас...

actors.buffs.barkskin.name=дубовая кожа
actors.buffs.barkskin.desc=Ваша кожа затвердела и стала грубой и твердой, как кора.\n\nДанный эффект увеличивает вашу текущую броню, повышая защиту от физических атак.\n\nТекущий бонус к броне: 0-%d.\nХодов до ослабления эффекта: %s.\n\nЕсли вы получите эффект из нескольких источников, только сильнейших из них будет применен.

actors.buffs.barrier.name=барьер
actors.buffs.barrier.desc=Прозрачное силовое поле блокирует весь урон.\n\nБарьер будет получать урон вместо того, кого он защищает, пока остаётся. Защита со временем также будет медленно разрушаться.\n\nОсталось силы: %d.

actors.buffs.berserk.angered=разгневан
actors.buffs.berserk.berserk=в неистовстве
actors.buffs.berserk.exhausted=истощен
actors.buffs.berserk.recovering=восстановление
actors.buffs.berserk.angered_desc=Тяжесть травм Берсерка усиливает его удары. Когда берсерк получает физические повреждения, его ярость растет, даруя ему бонус к урону. Урон, блокируемый броней, также увеличивает ярость.\n\nСо временем, ярость спадает. Чем меньше у Берсерка здоровья, тем дольше она будет длиться.\n\nПри 100%% ярости Берсерк может впасть в неистовство, дарующее ему щит в зависимости от уровня его брони и недостающего здоровья. В неистовстве защита со временем разрушается, и как только она иссякнет, Берсерку придется отдохнуть, прежде чем снова набраться ярости.\n\nТекущая ярость: _%1$.0f%%_\n_+%2$.0f%%_ урона\n\nЩит Берсерка с текущей бронёй и ОЗ: _%3$d_
actors.buffs.berserk.berserk_desc=Страх и неуверенность исчезают, оставляя чистый гнев. В этом состоянии Берсерк предельно силен, _нанося на 50%% больше урона и получая дополнительную защиту_, но также теряя защиту каждый ход.\n\nКогда защита достигнет нуля, неистовство прекращается.\n\nПосле того как завершается время ярости, Берсерку нужно отдохнуть, чтобы вновь набираться ярости.\n\nОсталось щита: %d
actors.buffs.berserk.recovering_desc=У внутренней мощи есть свои пределы. Берсерку надо передохнуть, прежде чем снова использовать ярость.\n\nПока Берсерк восстанавливается, от получения урона его ярость не накапливается.
actors.buffs.berserk.recovering_desc_turns=Ходов до восстановления: _%d_
actors.buffs.berserk.recovering_desc_levels=Уровней до восстановления: _%.2f_
actors.buffs.berserk.rankings_desc=Умер от неистовства
actors.buffs.berserk.action_name=Неистовствует
actors.buffs.berserk.no_seal=Тебе нужна твоя сломанная печать, чтобы войти в неистовство!

actors.buffs.bleeding.name=кровотечение
actors.buffs.bleeding.ondeath=Вы умерли от потери крови...
actors.buffs.bleeding.heromsg=У вас кровотечение!
actors.buffs.bleeding.rankings_desc=Умер от потери крови
actors.buffs.bleeding.desc=Эта рана что-то слишком сильно кровоточит...\n\nКровотечение наносит урон каждый ход. С каждым ходом урон уменьшается на случайную величину, пока не иссякнет.\n\nТекущий урон кровотечения: %d.

actors.buffs.bless.name=вдохновлен
actors.buffs.bless.desc=Большой всплеск сосредоточенности, некоторые даже говорят, что это вдохновение богов.\n\nБлагословение увеличивает точность и уклонение на 25%% и, таким образом, значительно повышает эффективность бойца.\n\nХодов осталось: %s.

actors.buffs.blindness.name=ослеплен
actors.buffs.blindness.heromsg=Вас ослепили!
actors.buffs.blindness.desc=Слепота окутывает окружающий мир темной дымкой.\n\nОслеплённый персонаж не видит дальше одной клетки перед собой, из-за чего дальний бой становится невозможным, а враги могут с лёгкостью скрыться. К тому же, ослеплённый герой не может читать свитки и книги.\n\nХодов осталось: %s.

actors.buffs.buff.heromsg=

actors.buffs.burning.name=горит
actors.buffs.burning.heromsg=Вы загорелись!
actors.buffs.burning.burnsup=%s сгорает!
actors.buffs.burning.ondeath=Вы сгорели заживо...
actors.buffs.burning.rankings_desc=Сгорел
actors.buffs.burning.desc=Мало что приносит страдания большие, чем горение заживо.\n\nОгонь будет наносить урон каждый ход, пока не будет потушен водой или не потухнет сам. Потушить огонь можно зайдя в воду, или разбив зелье с жидкостью.\n\nК тому же, огонь может воспламенить огнеопасное окружение или предметы, с которыми контактирует.\n\nХодов горения осталось: %s.

actors.buffs.championenemy.warn=Вы ощущаете наличие смертельной опасности.
actors.buffs.championenemy$blazing.name=Пылающий чемпион
actors.buffs.championenemy$blazing.desc=Пылающие чемпионы наносят на 25% больше урона в ближнем бою, поджигают при атаке, неуязвимы к огню и поджигают местность вокруг себя после смерти. Однако они не могут распространять огонь, где есть вода.
actors.buffs.championenemy$projecting.name=Проецирующий чемпион
actors.buffs.championenemy$projecting.desc=Проецирующие чемпионы наносят на 25% больше урона в ближнем бою и имеют увеличенный на 3 радиус атаки.
actors.buffs.championenemy$antimagic.name=Антимагический чемпион
actors.buffs.championenemy$antimagic.desc=Антимагические чемпионы получают на 50% меньше урона и совершенно неуязвимы к магии.
actors.buffs.championenemy$giant.name=Гигантский чемпион
actors.buffs.championenemy$giant.desc=Гигантские чемпионы получают на 80% меньше урона и увеличенный на 1 радиус атаки, но не могут проходить в узкие пространства.
actors.buffs.championenemy$blessed.name=благословенный чемпион
actors.buffs.championenemy$blessed.desc=Благословенные чемпионы имеют 4-кратную меткость и уклонение.
actors.buffs.championenemy$growing.name=Растущий чемпион
actors.buffs.championenemy$growing.desc=Растущие чемпионы получают непрерывно возрастающий бонус меткости, уклонения, физической атаки и сопротивления урону.\n\nТекущий бонус метк/укл/атк: %1$d%%\nТекущее сопротивление урону: %2$d%%

actors.buffs.charm.name=зачарован
actors.buffs.charm.heromsg=Вы очарованы!
actors.buffs.charm.cant_attack=Вы очарованы этим врагом и не можете атаковать его.
actors.buffs.charm.desc=Очарование - контролирующая магия, которая временно делает немыслимой любую явную агрессию против того, кто сотворил эти чары.\n\nЭтот эффект запрещает напрямую атаковать того, кто наложил его. Любые другие цели всё ещё можно атаковать. Боль от получения урона уменьшает время очарования.\n\nХодов осталось: %s.

actors.buffs.chill.name=окоченел
actors.buffs.chill.freezes=%s замерзает!
actors.buffs.chill.desc=Вам очень холодно, но вы пока ещё можете двигаться.\n\nОкоченевшая цель совершает все свои действия медленнее обычного, в зависимости от оставшегося времени действия эффекта. В худшем случае это эквивалентно замедлению.\n\nХодов осталось: %1$s. \nСнижение скорости: %2$s%%.

actors.buffs.combo.name=комбо
actors.buffs.combo.action_name=комбо атака
actors.buffs.combo.combo=Комбо из %d ударов!
actors.buffs.combo.bad_target=Цель должна быть в радиусе атаки.
actors.buffs.combo.prompt=Выберите цель для атаки.
actors.buffs.combo.desc=Гладиатор специализируется на проведении комбо. Каждое попадание увеличивает счётчик комбо-ударов, но если слишком долго не атаковать или промахнуться несколько раз подряд, счётчик сбросится до 0. Пока у гладиатора есть очки комбо, щит, полученный от сломанной печати, не будет уменьшаться.\n\nКомбо даёт доступ к завершающим приёмам: особым атакам, которые всегда попадают в цель! Особые приёмы доступны на комбо из 2, 4, 6, 8 и 10 ударов. Завершающий приём прерывает комбо.\n\nТекущее комбо: %1$d.\n\nХодов до конца комбо: %2$s.
actors.buffs.combo$combomove.clobber.name=таран
actors.buffs.combo$combomove.clobber.desc=Отбрасывает врагов на две клетки назад, но не наносит им урона и не может скинуть их в пропасть. Увеличивает комбо на 1.
actors.buffs.combo$combomove.clobber.empower_desc=Отталкивает врага назад на _3 клетки_ и накалывает эффект головокружения, но не наносит урон. Эта способность позволяет сталкивать противников в ямы и пропасти. Увеличивает комбо на 1.
actors.buffs.combo$combomove.slam.name=натиск
actors.buffs.combo$combomove.slam.desc=Наносит %d%% (комбо умноженное на 20%%) от защиты вашей брони в качестве бонусного урона. Сбрасывает комбо при использовании.
actors.buffs.combo$combomove.slam.empower_desc=_Переносит на %1$d клетки_ и наносит %2$d%% (комбо умноженное на 20%%) от защиты вашей брони в качестве бонусного урона. Сбрасывает комбо при использовании.
actors.buffs.combo$combomove.parry.name=парирование
actors.buffs.combo$combomove.parry.desc=Блокирует следующую атаку в течение 1 хода и мгновенно атакует. Сбрасывает комбо, если никакая атака не была блокирована.
actors.buffs.combo$combomove.parry.empower_desc=Блокирует _все атаки_ в течение 1 хода после активации и позволяет мгновенно контратаковать противников. Сбрасывает комбо, если парирование не сработало.
actors.buffs.combo$combomove.crush.name=обрушение
actors.buffs.combo$combomove.crush.desc=Наносит %d%% (комбо умноженное на 25%%) вашего урона главной цели, и половину этого урона всем врагам в районе 7x7. Сбрасывает комбо при использовании.
actors.buffs.combo$combomove.crush.empower_desc=_Переносит на %1$d клетки_ и наносит %2$d%% (комбо умноженное на 25%%) вашего урона главной цели, и половину этого урона всем врагам в районе 7x7. Сбрасывает комбо при использовании.
actors.buffs.combo$combomove.fury.name=неистовство
actors.buffs.combo$combomove.fury.desc=Бьёт врага один раз за каждое имеющееся у вас комбо. Каждый удар наносит 60% от вашего урона и может активировать зачарования. Сбрасывает комбо при использовании.
actors.buffs.combo$combomove.fury.empower_desc=_Переносит на %d клетки__ и ударяет врага один раз за каждое имеющиеся у вас комбо, каждый удар наносит 60%% от вашего урона и может активировать зачарования. Сбрасывает комбо при использовании.

actors.buffs.corruption.name=проклят
actors.buffs.corruption.desc=Порча проникает в саму суть существ, извращая их истинную природу.\n\nСущества под воздействием порчи будут атаковать своих бывших союзников, игнорируя настоящего врага. К тому же, порча наносит урон, приближая смерть жертвы.\n\nПорчу невозможно снять, только смерть остановит её.

actors.buffs.cripple.name=покалечен
actors.buffs.cripple.heromsg=Вы покалечены!
actors.buffs.cripple.desc=Вы почти уверены, что ноги не должны так гнуться.\n\nХромота вдвое снижает скорость передвижения, поэтому передвижение на одну клетку обычно занимает два хода, вместо одного.\n\nХодов осталось: %s.

actors.buffs.daze.name=ошеломлён
actors.buffs.daze.heromsg=Вы ошеломлены!
actors.buffs.daze.desc=Звон в ушах и пелена перед глазами мешают вам сражаться.\n\nПока вы ошеломлены, точность и уклонение снижены на 50%%, что значительно усложняет попадание по противнику и уворот от атак.\n\nХодов ошеломления осталось: %s.

actors.buffs.degrade.name=потрепан
actors.buffs.degrade.heromsg=Ваша экипировка выглядит дряхлой!
actors.buffs.degrade.desc=Мощная, темная магия высасывает силу, которой Свитки улучшения наделили вашу экипировку!\n\nВо время, пока ваша экипировка деградирована, ее фактический уровень ниже действительного. _Любое улучшение после +3 становится порядком слабее предыдущего._ Описание ваших предметов будет изменяться с учетом его сниженного уровня силы.\n\nДеградация не влияет на требования силы, заряды палочек, прочность метательного оружия или на артефакты.\n\nОсталось ходов с деградацией: %s. Использование Свитка улучшения или рассеяния немедленно снимет эффект деградации.

actors.buffs.doom.name=обречен
actors.buffs.doom.desc=Тяжело двигаться вперёд, когда кажется, что вся Вселенная желает вам смерти.\n\nВесь урон, получаемый обречённым на гибель персонажем, увеличивается на 67%.\n\nДанный эффект длится до самой смерти.

actors.buffs.dread.name=боязнь
actors.buffs.dread.desc=Ужас настолько сильный, что напуганный сбежит из подземелья навсегда.\n\nПораженные ужасом будут убегать от противника во весь дух, и полностью исчезнут, как только скроются из виду. Такое избавление, конечно, не даст вам вещей монстра, и наградит лишь половиной опыта. Боль сокращает продолжительность эффекта.\n\nХодов до окончания эффекта: %d.

actors.buffs.drowsy.name=сонливый
actors.buffs.drowsy.desc=Магическая сила мешает бодрствовать, и через несколько ходов цель погружается в глубокий магический сон.\n\nГерой может противостоять сонливости, получая урон или сохраняя полное здоровье.\n\nХодов до засыпания: %s.

actors.buffs.earthimbue.name=пропитан землей
actors.buffs.earthimbue.desc=Вы наделены силой Земли! \n\nВсе физические атаки сотрясают землю под ногами врагов, калеча их на небольшое время. \n\nХодов осталось: %s.

actors.buffs.enhancedrings.name=улучшенные кольца
actors.buffs.enhancedrings.desc=Недавно использованный Разбойником артефакт усиливает кольца, улучшая их на +1.\n\nХодов осталось: %s.

actors.buffs.fireimbue.name=пропитан огнем
actors.buffs.fireimbue.desc=Вы наделены силой Огня!\n\nВсе ваши физические атаки имеют шанс поджечь цель. К тому же вы абсолютно невосприимчивы к огню.\n\nХодов осталось: %s.

actors.buffs.foresight.name=предвидение
actors.buffs.foresight.desc=Ваши чувства обострены, позволяя моментально обнаружать любые странности.\n\nВо время действия эффекта прозрения любой секрет, находящийся в вашем радиусе поиска, будет немедленно раскрыт.\n\nХодов осталось: %s.

actors.buffs.frost.name=заморожен
actors.buffs.frost.freezes=%s замерзает!
actors.buffs.frost.desc=Это не полная заморозка тела, а скорее просто слой льда, делающий любые движения невозможными.\n\nЗаморозка действует как паралич, не позволяя жертве действовать. В отличие от паралича, заморозка будет снята сразу же при получении урона, так как лёд расколется.\n\nХодов осталось: %s.

actors.buffs.frostimbue.name=пропитан холодом
actors.buffs.frostimbue.desc=Вы наделены силой Льда!\n\nВсе ваши физические атаки накладывают эффект окоченения на врагов. К тому же, этот эффект обеспечивает абсолютную невосприимчивость к холоду.\n\nХодов осталось: %s.

actors.buffs.fury.name=ожесточен
actors.buffs.fury.heromsg=Вы в ярости!
actors.buffs.fury.desc=Вы злитесь, и вашим врагам не понравится, когда вы злитесь.\n\nДикая ярость пылает внутри вас, увеличивая наносимый физическими атаками урон на 50%%.\n\nВы будете в ярости, пока уровень здоровья превышает 50%%.

actors.buffs.blobimmunity.name=очищающий барьер
actors.buffs.blobimmunity.desc=Какая-то загадочная сила окружает вас тонким защитным барьером, ограждая вас от любых вредных испарений.\n\nВо время действия этого барьера, вы неуязвимы для любых эффектов, действующих по площади.\n\nХодов осталось: %s.

actors.buffs.gravitychaostracker.name=гравитационный хаос
actors.buffs.gravitychaostracker.desc_intro=Каждые несколько ходов все персонажи на текущем этаже подземелья будут подброшены в случайном направлении.
actors.buffs.gravitychaostracker.desc_positive=Однако вы и ваши союзники, похоже, невосприимчивы.
actors.buffs.gravitychaostracker.desc_duration=Нельзя сказать сколько будет продолжаться эффект, но он не может длиться вечно.

actors.buffs.greaterhaste.name=Повышенная спешка
actors.buffs.greaterhaste.desc=Невероятный прирост в скорости, на мгновение кажется, что всё остальное стоит на месте.\n\nВ то время как в условиях повышенной спешки перемещение не занимает много времени, другие действия по-прежнему выполняются с нормальной скоростью. Каждый шаг движения потребляет ход повышенной спешки.\n\nХодов осталось: %d.

actors.buffs.haste.name=спешка
actors.buffs.haste.desc=Энергия пронизывает ваши мышцы, позволяя вам передвигаться с невероятной скоростью!\n\nПод действием ускорения вы будете передвигаться втрое быстрее, но на скорость выполнения других действий этот эффект не влияет.\n\nХодов осталось: %s.

actors.buffs.healing.name=лечение
actors.buffs.healing.desc=Исцеляющие чары восстанавливают плоть и останавливают боль в вашем теле.\n\nКаждый ход, данный эффект будет возвращать часть потерянного здоровья. Сила лечения может снижаться со временем.\n\nСила эффекта: %d.\n\nОсталось лечения: %d.

actors.buffs.herodisguise.name=маскировка
actors.buffs.herodisguise.desc=Иллюзорная магия изменила ваш физический вид! Эффект чисто косметический, но всё равно ощущается очень странно.\n\nХодов осталось: %s.

actors.buffs.hex.name=заколдован
actors.buffs.hex.heromsg=Вас сглазили!
actors.buffs.hex.desc=От темной дезориентирующей магии сложнее сосредоточиться на цели и уклоняться.\n\nСглаз снижает меткость и уклонение на 20%%, и, таким образом, снижает эффективность цели в бою.\n\nОсталось ходов со сглазом: %s.

actors.buffs.holdfast.name=защитная стойка
actors.buffs.holdfast.desc=Воин удерживает свою позицию, увеличивая свою защиту на %1$d-%2$d и замедляя скорость исчезновения некоторых эффектов на %3$d%%. Защита длится, пока он не начнет двигаться.

actors.buffs.hunger.hungry=голоден
actors.buffs.hunger.starving=истощен
actors.buffs.hunger.onhungry=Вы слегка голодны.
actors.buffs.hunger.onstarving=Вы очень голодны!
actors.buffs.hunger.ondeath=Вы умерли от голода...
actors.buffs.hunger.cursedhorn=Проклятый рог крадёт часть энергии у еды, которую вы едите.
actors.buffs.hunger.rankings_desc=Умер от голода
actors.buffs.hunger.desc_intro_hungry=Вы слышите, как от голода урчит живот, но пока не сильно.
actors.buffs.hunger.desc_intro_starving=Вы голодны настолько, что это причиняет вам боль.
actors.buffs.hunger.desc=\n\nГолод постепенно усиливается, пока вы находитесь в подземелье, со временем вы начнёте сильно голодать. В этом состоянии вы начнёте терять здоровье, а не восстанавливать его.\n\nПравильное питание - это важно! Если есть лишнее здоровье, то можно немного поголодать, чтобы сохранить еду. Правильное питание позволит сохранить еду на больший срок.

actors.buffs.invisibility.name=невидим
actors.buffs.invisibility.desc=Вы полностью сливаетесь с окружением, вас невозможно заметить.\n\nПока вы в этом состоянии, враги не атакуют и не преследуют вас. Атака или использование магии (например, свитка или палочки) немедленно рассеет невидимость.\n\nХодов осталось: %s.

actors.buffs.invulnerability.name=неуязвимый
actors.buffs.invulnerability.desc=Этот персонаж наполнен огромной защитной силой, дарующей ему неуязвимость на короткое время!\n\nХодов осталось: %s.

actors.buffs.levitation.name=парит
actors.buffs.levitation.desc=Магическая сила поднимает вас над землей, заставляя чувствовать себя невесомым.\n\nЛевитирующие герои передвигаются бесшумно и игнорируют все наземные эффекты. Ловушки не будут срабатывать, вода не потушит огонь, растения не будут растоптаны, корни не оплетут вас и вы сможете парить над пропастью. Будьте осторожнее: всё это может произойти в ту же секунду, когда эффект закончится!\n\nХодов осталось: %s.

actors.buffs.lifelink.name=узы жизни
actors.buffs.lifelink.ondeath=Вы погибли от урона уз жизни...
actors.buffs.lifelink.desc=Жизненная сила этого персонажа связана с другим, находящемся недалеко персонажем. Любой урон разделяется между ними.\n\nКогда этому персонажу наносится урон, половина достается связанному с ним Узами жизни\n\nОсталось ходов с Узами жизни: %s.

actors.buffs.light.name=освещен
actors.buffs.light.desc=Как свет набирает силу, так крепнет храбрость в душах и становятся ясными предстоящие цели. Даже в глубине темнейшего подземелья источник света способен вселить уверенность в ваше сердце. \n\nСвет разгоняет тьму, позволяя видеть достаточно далеко, несмотря на окружающий вас мрак.\n\nХодов осталось: %s.

actors.buffs.lockedfloor.name=уровень закрыт
actors.buffs.lockedfloor.desc=Текущий уровень закрыт, вы не сможете покинуть его!\n\nПока уровень закрыт, голод не усиливается и вы не получаете урона от голодания. К тому же, если вы не пытаетесь победить босса, пассивная регенерация также перестает действовать.\n\nВдобавок, если вы воскреснете с использованием неосвященного анха, уровень восстановится.\n\nУбейте босса, чтобы пройти дальше.

actors.buffs.lostinventory.name=утерянный инвентарь
actors.buffs.lostinventory.desc=Ваш инвентарь был потерян где-то в подземелье! Вы не сможете подобрать или использовать большинство предметов, пока не восстановите его.

actors.buffs.magicalsight.name=магический взор
actors.buffs.magicalsight.desc=Каким-то образом вы видите умом, а не глазами.\n\nПока волшебное зрение активно, на вас не действуют местность и эффекты, блокирующие поле зрения, а дальность обзора увеличивается до 12 клеток.\n\nХодов осталось: %s.

actors.buffs.magicalsleep.name=волшебный сон
actors.buffs.magicalsleep.toohealthy=Вы слишком здоровы и смогли устоять перед желанием уснуть.
actors.buffs.magicalsleep.fallasleep=Вы падаете в глубокий магический сон.
actors.buffs.magicalsleep.wakeup=Вы просыпаетесь бодрым и здоровым.
actors.buffs.magicalsleep.desc=Этот персонаж оказался в глубоком магическом сне и не может проснуться сам.\n\nМагический сон похож на обычный, однако теперь только получение урона способно разбудить уснувшего.\n\nМагический сон героя и его союзников обладает целебными свойствами, позволяя им быстро восстанавливаться.

actors.buffs.magicimmune.name=иммунитет к магии
actors.buffs.magicimmune.desc=Любые чары потеряли над вами всякую власть, вы совершенно неуязвимы для магии.\n\nДанный эффект подавляет действие любых вредных или полезных магических эффектов, включая проклятия, зачарования, палочки, свитки, кольца, артефакты и т. д. Способности героической брони достаточно сильные, чтобы работать, несмотря на эффект антимагии.\n\nХодов осталось: %s.

actors.buffs.mindvision.name=ментальное зрение
actors.buffs.mindvision.desc=Каким-то образом вы способны чувствовать присутствие чужого сознания сквозь стены. Это очень странное ощущение.\n\nВо время действия Ментального зрения вы видите всех существ на данном этаже. Очень полезно в сочетании с теми магическими эффектами, которые воздействуют на всех врагов в поле зрения.\n\nХодов осталось: %s.

actors.buffs.momentum.momentum=накопление импульса
actors.buffs.momentum.running=бег
actors.buffs.momentum.resting=восстановление
actors.buffs.momentum.action_name=бег
actors.buffs.momentum.momentum_desc=При движении Бродяга накапливает импульс, который может тратить для бега.\n\nКаждый заряд импульса дарит два хода бега, и Бродяга может накопить до 10 зарядов. Импульс быстро теряется, когда Бродяга стоит на месте.\n\nТекущий заряд импульса: %d.
actors.buffs.momentum.running_desc=Когда Бродяга двигается, он накапливает инерцию, которую он может использовать, чтобы начать бежать.\n\nПока Бродяга бежит, он двигается с удвоенной скоростью и получает бонус к уклонению, рассчитанный на его уровне.\n\nХодов осталось: %d.
actors.buffs.momentum.resting_desc=Когда Бродяга двигается, он накапливает инерцию, которую он может использовать, чтобы начать бежать.\n\nБродяге нужно время, чтобы восстановить выносливость, прежде чем снова начать копить инерцию.\n\nХодов осталось: %d.

actors.buffs.monkenergy.name=энергия
actors.buffs.monkenergy.action=Умения Монаха
actors.buffs.monkenergy.desc=Побеждая противников, Монах получает энергию, которую она может использовать для активации способностей. Большинство из врагов дают 1 единицу энергии при поражении. \n\nЗарядов энергии: %1$d/%2$d.
actors.buffs.monkenergy.desc_cooldown=Монах недавно использовала способность и должна подождать, прежде чем активировать ещё одну. \n\nПерезарядка: %d ходов.
actors.buffs.monkenergy$monkability$flurry.name=шквал ударов
actors.buffs.monkenergy$monkability$flurry.desc=Два мгновенных удара, которые наносят %1$d-%2$d урона и игнорируют броню. Эту способность нельзя использовать повторно.
actors.buffs.monkenergy$monkability$flurry.empower_desc=Два мгновенных удара, которые наносят %1$d-%2$d урона, игнорируют броню и _используют чары вашего оружия._ Эту способность нельзя использовать повторно.
actors.buffs.monkenergy$monkability$focus.name=фокусировка
actors.buffs.monkenergy$monkability$focus.desc=Монах тратит ход, чтобы сосредоточиться, позволяя ей парировать следующую атаку, направленную против нее.
actors.buffs.monkenergy$monkability$focus.empower_desc=Монах _мгновенно сосредотачивается,_ позволяя ей парировать следующую атаку, направленную против нее.
actors.buffs.monkenergy$monkability$focus$focusbuff.name=сфокусирована
actors.buffs.monkenergy$monkability$focus$focusbuff.desc=Монах сосредоточен на своем окружении, ожидая следующей атаки, направленной против него. Пока он сосредоточен, он гарантированно отразит следующую приближающуюся атаку.
actors.buffs.monkenergy$monkability$dash.name=рывок
actors.buffs.monkenergy$monkability$dash.prompt=Выберите Место
actors.buffs.monkenergy$monkability$dash.desc=Мгновенный рывок на расстояние до 4 клеток. Эта способность позволяет преодолевать препятствия, но не врагов или стены.
actors.buffs.monkenergy$monkability$dash.empower_desc=Мгновенный рывок на расстояние до _8 клеток_. Эта способность позволяет преодолевать препятствия, но не врагов или стены.
actors.buffs.monkenergy$monkability$dragonkick.name=удар дракона
actors.buffs.monkenergy$monkability$dragonkick.desc=Монах совершает сокрушительный удар, наносящий %1$d-%2$d урона и игнорирующий броню. Удар отбрасывает цель и парализует её. Длительность эффекта зависит от расстояния.
actors.buffs.monkenergy$monkability$dragonkick.empower_desc=Монах совершает сокрушительный удар, наносящий %1$d-%2$d урона и игнорирующий броню. Удар отбрасывает _всех вблизи цели_ и парализует их. Длительность эффекта зависит от расстояния.
actors.buffs.monkenergy$monkability$meditate.name=медитация
actors.buffs.monkenergy$monkability$meditate.desc=Монах концентрирует энергию в своём теле в течение 5 ходов. По завершению она очищается от большинства негативных эффектов и увеличивает скорость перезарядки артефактов и палочек на 8 ходов.
actors.buffs.monkenergy$monkability$meditate.empower_desc=Монах концентрирует энергию в своём теле в течение 5 ходов. По завершению она очищается от большинства негативных эффектов и увеличивает скорость перезарядки артефактов и палочек на 8 ходов. _Когда проходит медитация, она также получает 80% сопротивления урону и медленно восстанавливает 20% от недостающего здоровья._

actors.buffs.ooze.name=едкая слизь
actors.buffs.ooze.heromsg=Ядовитая слизь разъедает вашу плоть. Надо её смыть!
actors.buffs.ooze.ondeath=Вы растаяли...
actors.buffs.ooze.rankings_desc=Растворился
actors.buffs.ooze.desc=Этот липкий яд въедается в кожу, медленно растворяя её.\n\nСлизь наносит постоянный урон каждый ход, но её легко можно смыть водой.\n\nХодов осталось: %s.

actors.buffs.paralysis.name=парализован
actors.buffs.paralysis.heromsg=Вы парализованы!
actors.buffs.paralysis.out=вырывается из паралича
actors.buffs.paralysis.desc=Зачастую, самое худшее - это потерять контроль над ситуацией.\n\nПаралич вынуждает цель ждать окончания эффекта. Боль от получения урона может заставить персонажей сопротивляться параличу, выводя их из-под действия эффекта.\n\nХодов осталось: %s.

actors.buffs.physicalempower.name=физически усилен
actors.buffs.physicalempower.desc=Ваши удары были усилены, что увеличивает количество урона, который вы можете нанести, поражая врагов физическими атаками.\n\nДополнительный урон: %1$d.\nУдаров осталось: %2$d.

actors.buffs.pincushion.name=мишень
actors.buffs.pincushion.desc=Орудие, брошенное в этого персонажа, застряло в нем и выпадет только после того, как он будет убит.\n\nВ настоящее время в нём воткнуты следующие предметы:

actors.buffs.poison.name=отравлен
actors.buffs.poison.heromsg=Вы отравлены!
actors.buffs.poison.ondeath=Вы умерли от отравления...
actors.buffs.poison.rankings_desc=Умер от яда
actors.buffs.poison.desc=Яд проникает в вашу кровь, медленно убивая вас изнутри.\n\nОтравление наносит урон в зависимости от оставшегося времени действия.\n\nХодов осталось: %s.

actors.buffs.preparation.name=коварство
actors.buffs.preparation.action_name=подготовленный удар
actors.buffs.preparation.desc=Ассасин затаился, продумывая свою следующую атаку.
actors.buffs.preparation.desc_dmg=Его следующая атака нанесёт _%1$d%% дополнительного урона_, и уничтожит обычных врагов, здоровье которых ниже _%2$d%%_, или боссов со здоровьем ниже _%3$d%%_.
actors.buffs.preparation.desc_dmg_likely=Также урон от данной атаки будет ближе к максимальному возможному значению.
actors.buffs.preparation.desc_blink=Он способен перенестись к своей цели перед ударом. Максимальная дистанция - _%d_ клеток.
actors.buffs.preparation.desc_invis_time=Ходов в состоянии невидимости: _%d._
actors.buffs.preparation.desc_invis_next=Ходов до усиления атаки: _%d._
actors.buffs.preparation.prompt=Выберите цель!\nМакс. дистанция: %d
actors.buffs.preparation.no_target=Здесь нечего атаковать.
actors.buffs.preparation.out_of_reach=Эта цель вне досягаемости.
actors.buffs.preparation.assassinated=убит

actors.buffs.prismaticguard.name=радужный Страж
actors.buffs.prismaticguard.desc=Вас охраняет радужная копия. В данный момент она находится в пассивном режиме, но при встрече с врагами она вернётся к жизни, чтобы защитит вас!\n\nРадужная копия постепенно восстанавливает своё здоровье, пока бездействует.\n\nТекущие ОЗ: %d/%d.
actors.buffs.prismaticguard.desc_many=Эта радужная копия также получает бонус от силы многих. Ходов осталось: %d.

actors.buffs.recharging.name=перезарядка
actors.buffs.recharging.desc=Энергия течёт сквозь вас, увеличивая скорость перезарядки палочек и посохов.\n\nС каждым ходом текущий заряд будет увеличиваться на четверть, вдобавок к обычному восстановлению.\n\nХодов осталось: %s.

actors.buffs.revealedarea.name=выявленная область
actors.buffs.revealedarea.desc=Область подземелья была временно открыта герою, и он будет видеть ее, где бы не находился.\n\nХодов осталось: %s.

actors.buffs.revealedchar.name=обнаруженный
actors.buffs.revealedchar.desc=Этот персонаж открыт герою, и он будет виден, где бы ни находился.\n\nХодов сталось: %s.

actors.buffs.roots.name=укоренен
actors.buffs.roots.heromsg=Вы не можете двигаться!
actors.buffs.roots.desc=Корни (магические или естественные) оплетают ваши ноги, приковывая их к земле.\n\nОплетение не позволяет передвигаться, делая ходьбу и другие передвижения невозможными. Все остальные действия всё ещё остаются доступными, в том числе телепортация.\n\nХодов осталось: %s.

actors.buffs.scrollempower.name=усиление свитка
actors.buffs.scrollempower.desc=Энергия свитка, который Маг недавно прочёл, усиливает его палочки!\n\nПовышение уровня: +%1$d.\nВыстрелов осталось: %2$d.

actors.buffs.shadows.name=в тени
actors.buffs.shadows.desc=Вы растворились в тенях. Вас не видно, а ваш метаболизм замедлен.\n\nВ этом состоянии враги не атакуют и не преследуют вас. Атака или использование магии (например, свитка или палочки) немедленно развеет невидимость. Вдобавок, вы можете дольше обходиться без еды.\n\nВы останетесь в тенях, пока не покинете их или враг не наткнётся на вас.

actors.buffs.slow.name=замедлен
actors.buffs.slow.desc=Замедляющая магия влияет на восприятие времени целью. Для неё всё происходит очень быстро.\n\nЗамедленный персонаж действует вдвое медленнее, чем обычно.\n\nХодов осталось: %s.

actors.buffs.snipersmark.name=метка снайпера
actors.buffs.snipersmark.action_name_snapshot=мгновенный выстрел
actors.buffs.snipersmark.action_name_volley=залп
actors.buffs.snipersmark.action_name_sniper=снайперский выстрел
actors.buffs.snipersmark.desc=Снайпер может сделать специальный выстрел по цели, которую только что атаковала. Эффект выстрела будет различаться в зависимости от того, на что сбалансирован её лук.\n\nВ нормальном состоянии, лук совершит _мгновенный выстрел,_ который нанесёт меньше урона, но не потребует времени.\n\nУскоренный лук совершит _залп_ из трёх стрел. Каждая стрела нанесёт меньше урона, но шанс срабатывания зачарований останется прежним. Залп потратит 1 ход.\n\nУсиленный лук совершит _снайперский выстрел._ Этот выстрел гарантированно попадает в цель, и наносит дополнительный урон, зависящий от расстояния до цели. Это потратит 2 хода.\n\nХодов осталось: %s.

actors.buffs.soulmark.name=душа отмечена
actors.buffs.soulmark.desc=Чернокнижник завладел душой этого существа, что позволяет ему исцелять себя, когда оно получает физический урон.\n\nХодов осталось: %s.

actors.buffs.stamina.name=выносливость
actors.buffs.stamina.desc=Ваша выносливость не знает границ, позволяя двигаться быстрее!\n\nДанный эффект увеличивает вашу скорость перемещения на 50%%.\n\nХодов осталось: %s.

actors.buffs.vulnerable.name=уязвимый
actors.buffs.vulnerable.heromsg=Вы чувствуете себя хрупким!
actors.buffs.vulnerable.desc=Магия уязвимости повышает физический урон, причиняемый персонажу. Весь входящий физический урон, оставшийся после блокирования броней, увеличен на 33%%. \n\nОсталось ходов с уязвимостью: %s.

actors.buffs.terror.name=в ужасе
actors.buffs.terror.desc=Ужас - контролирующая магия, повергающая цель в неконтролируемую панику.\n\nПерепуганные персонажи вынуждены убегать от своего противника, стараясь оставить между собой как можно больше дверей и стен. Однако болевой шок способен ослабить этот эффект.\n\nХодов осталось: %s.

actors.buffs.toxicimbue.name=пропитан токсичностью
actors.buffs.toxicimbue.desc=Вы наделены силой Яда!\n\nВо время движения вы распространяете отравляющий газ, наносящий урон вашим врагам. Во время действия эффекта вы невосприимчивы к отравлению и отравляющему газу, и даже на несколько ходов после эффекта.\n\nХодов осталось: %s.

actors.buffs.corrosion.name=коррозия
actors.buffs.corrosion.heromsg=Кислота разъедает вашу кожу!
actors.buffs.corrosion.ondeath=Кислота убила вас...
actors.buffs.corrosion.rankings_desc=Растворился
actors.buffs.corrosion.desc=Сильная кислота разъедает плоть, металл и кости с ужасающей скоростью.\n\nУрон от коррозии увеличивается, пока кислота продолжает разъедать цель.\n\nХодов осталось: %1$s.\n\nТекущий урон: %2$d.

actors.buffs.vertigo.name=головокружение
actors.buffs.vertigo.desc=Сложно идти в правильном направлении, когда весь мир вращается перед глазами.\n\nВ этом состоянии персонаж при ходьбе будет перемещаться в случайном направлении.\n\nХодов осталось: %s.

actors.buffs.wandempower.name=усиленные палочки
actors.buffs.wandempower.desc=Ваши боевые палочки были усилены, увеличивая количество наносимого ими урона на несколько выстрелов.\n\nДополнительный урон: %1$d.\nВыстрелов осталось: %2$d.

actors.buffs.weakness.name=ослабление
actors.buffs.weakness.heromsg=Вы чувствуете слабость!
actors.buffs.weakness.desc=Всё внезапно кажется намного тяжелее.\n\nМагия ослабления снижает физическую силу персонажа и приводит к тому, что он наносит на 33%% меньше урона.\n\nХодов осталось: %s.

actors.buffs.wellfed.name=сытость
actors.buffs.wellfed.desc=Вы наелись до отвала и полностью довольны жизнью.\n\nВо время действия данного эффекта ваше здоровье будет постепенно восстанавливаться. Кроме того, голод не будет увеличиваться.\n\nХодов осталось: %d.



###hero

##abilities
actors.hero.abilities.armorability.self_target=Нельзя выбрать себя в качестве цели!
actors.hero.abilities.armorability.no_target=Там не на что нацеливаться!
actors.hero.abilities.armorability.prompt=Выберите расположение цели
actors.hero.abilities.armorability.cost=Стоимость заряда: _%d_

actors.hero.abilities.warrior.heroicleap.name=героический прыжок
actors.hero.abilities.warrior.heroicleap.prompt=Выберите направление для прыжка
actors.hero.abilities.warrior.heroicleap.short_desc=Воин совершает _Героический прыжок_ к указанному месту, перепрыгивая врагов и опасности.
actors.hero.abilities.warrior.heroicleap.desc=Воин совершает прыжок в указанное место, преодолевая любых врагов или опасности на пути. Однако он не может перепрыгивать через стены или другую твердую местность.
actors.hero.abilities.warrior.shockwave.name=ударная волна
actors.hero.abilities.warrior.shockwave.short_desc=Воин выпускает конусовидную _Ударную волну_, хлопнув по земле. Враги, попавшие в ударную волну, получают повреждения и хромоту.
actors.hero.abilities.warrior.shockwave.desc=Воин ударяет по земле, создавая ударную волну, которая распространяется до 5 клеток в пределах 60 градусного конуса.\n\nВраги, попавшие в эту ударную волну, получают эффект хромоты на 5 ходов. Также они получают 5-10 урона, плюс дополнительные 1-2 урона за каждое очко силы воина выше 10.
actors.hero.abilities.warrior.endure.name=выжидание
actors.hero.abilities.warrior.endure$enduretracker.name=выдержка
actors.hero.abilities.warrior.endure$enduretracker.desc=Теперь Воин наносит бонусный урон, основанный на уроне, который он перенес.\n\nБонусный Урон: %1$d\nУдаров осталось: %2$d
actors.hero.abilities.warrior.endure.short_desc=Воин _Выжидает_, пропуская несколько ходов, но получая высокую устойчивость к урону. Затем он наносит бонусный урон, основанный на том, что он вытерпел.
actors.hero.abilities.warrior.endure.desc=Воин выжидает 3 хода, получая половину урона от всех источников. Это снижение срабатывает перед эффектами сопротивления урону, такими как броня.\n\nПосле выжидания следующий удар воина нанесет дополнительный урон в течение 10 ходов. Этот урон равен половине всего урона, нанесенного ему во время выжидания, полученного до любых эффектов уменьшения урона!\n\nЕсли воин в процессе комбо, использование этой способности увеличит их длительность на 3 хода.

actors.hero.abilities.mage.elementalblast.name=стихийный взрыв
actors.hero.abilities.mage.elementalblast.no_staff=Вы не можете использовать эту способность без своего посоха.
actors.hero.abilities.mage.elementalblast.short_desc=Маг испускает _Стихийный взрыв_ из своего посоха, покрывая большую площадь вокруг себя с эффектом, который варьируется в зависимости от палочки в его посохе.
actors.hero.abilities.mage.elementalblast.desc=Маг испускает магический взрыв, который покрывает круглую область на расстоянии до 4 клеток и наносит до 15-25 урона. Эффект стихийного взрыва будет зависеть от палочки, влитой в посох мага.
actors.hero.abilities.mage.elementalblast.generic_desc=Эффект стихийного взрыва будет схож с эффектом палочки при использовании на врага или союзника.
actors.hero.abilities.mage.wildmagic.name=дикая магия
actors.hero.abilities.mage.wildmagic.no_wands=У тебя нет палочек, чтобы выстрелить ими!
actors.hero.abilities.mage.wildmagic.short_desc=Маг высвобождает _Дикую Магию_, содержащуюся в его палочках, беспорядочно стреляя ими несколько раз в выбранную цель за один ход.
actors.hero.abilities.mage.wildmagic.desc=Маг высвобождает силу в своих палочках, случайным образом стреляя ими до 4 раз за один ход. Посох мага при этом не учитывается.\n\nУровень каждой палочки усилен на 2, максимум до +3. Эта способность расходует половину одного заряда палочек, при этом ни одна палочка не может быть использована более 2 раз.
actors.hero.abilities.mage.warpbeacon.name=варп-маяк
actors.hero.abilities.mage.warpbeacon.depths=Вы не можете перемещаться между пропастями!
actors.hero.abilities.mage.warpbeacon.locked_floor=Вы не можете покинуть закрытый этаж!
actors.hero.abilities.mage.warpbeacon.too_far=Это место слишком далеко!
actors.hero.abilities.mage.warpbeacon.invalid_beacon=Вы не можете разместить маяк здесь!
actors.hero.abilities.mage.warpbeacon.window_desc=Ваш маяк расположен на %d этаже.
actors.hero.abilities.mage.warpbeacon.window_tele=Телепортироваться к маяку
actors.hero.abilities.mage.warpbeacon.window_clear=Сбросить маяк
actors.hero.abilities.mage.warpbeacon.window_cancel=Отменить
actors.hero.abilities.mage.warpbeacon.short_desc=Маг размещает _Варп-Маяк_ в свое текущее местоположение, куда он может мгновенно телепортироваться обратно.
actors.hero.abilities.mage.warpbeacon.desc=Маг размещает маяк, который затем может быть убран по желанию. Установка маяка занимает 1 ход, но перемещение к нему происходит мгновенно.\n\nМаг не может перемещаться между этажами или использовать маяк для достижения недоступных мест, таких как запертые комнаты. Маг может телепортироваться на клетку с врагами, тем самым оттолкнув их.

actors.hero.abilities.rogue.smokebomb.name=дымовая бомба
actors.hero.abilities.rogue.smokebomb.fov=Прыгнуть можно только на пустую клетку в поле зрения.
actors.hero.abilities.rogue.smokebomb.prompt=Выберите клетку для прыжка
actors.hero.abilities.rogue.smokebomb$ninjalog.name=деревянная приманка
actors.hero.abilities.rogue.smokebomb$ninjalog.desc=Каким-то образом враги легко убеждаются, что эта деревянная приманка - настоящий Разбойник!
actors.hero.abilities.rogue.smokebomb$ninjalog.discover_hint=Вы можете найти этого персонажа с помощью определённой способности брони героя.
actors.hero.abilities.rogue.smokebomb.short_desc=Разбойник бросает _Дымовую Бомбу_, совершая скачок. Он становится временно невидимым и ослепляет врагов рядом со своим старым местоположением.
actors.hero.abilities.rogue.smokebomb.desc=Разбойник бросает дымовую шашку и совершает скачок на расстояние до 6 клеток. Он может перескакивать сквозь ловушки и врагов, но не сквозь твердую местность, такую как стены.\n\nВраги, которые находятся рядом со старой позицией разбойника, будут ослеплены на 5 ходов.
actors.hero.abilities.rogue.deathmark.name=метка смерти
actors.hero.abilities.rogue.deathmark.ally_target=Вы можете отмечать только врагов
actors.hero.abilities.rogue.deathmark.short_desc=Разбойник ставит _Метку Смерти_ на выбранного врага. Отмеченные враги получают дополнительный урон, но не могут умереть, пока отметка не закончится.
actors.hero.abilities.rogue.deathmark.desc=Разбойник ставит метку на выбранного врага, заставляя его получать 25% дополнительного урона. Метка ставится мгновенно и действует 5 ходов.\n\nПомеченные враги получают дополнительный урон, но не могут умереть, пока не истечет срок действия метки. Если у врага останется 0 ОЗ, когда действие метки закончится, он немедленно умрет.
actors.hero.abilities.rogue.deathmark$deathmarktracker.name=приговорен к смерти
actors.hero.abilities.rogue.deathmark$deathmarktracker.desc=Этот враг был помечен, в результате чего он получает 25%% бонусного урона, но он не может умереть до тех пор, пока метка не исчезнет.\n\nХодов осталось: %s.
actors.hero.abilities.rogue.shadowclone.name=теневой клон
actors.hero.abilities.rogue.shadowclone.short_desc=Разбойник призывает _Теневого клона_, который может быть направлен, чтобы помочь ему в бою.
actors.hero.abilities.rogue.shadowclone.desc=Разбойник призывает теневую копию самого себя, которая может быть направлена, чтобы помочь ему в бою. Направление теневого клона не требует никаких затрат.\n\nКлон имеет 80 ОЗ, не носит броню и наносит 10-20 урона. Все это можно улучшить с помощью талантов, таким образом клон будет получать выгоду от оружия и брони, которые есть у героя.
actors.hero.abilities.rogue.shadowclone$shadowally.name=теневой разбойник
actors.hero.abilities.rogue.shadowclone$shadowally.direct_defend=Ваш клон идет на выбранную позицию.
actors.hero.abilities.rogue.shadowclone$shadowally.direct_follow=Ваш клон следует за вами.
actors.hero.abilities.rogue.shadowclone$shadowally.direct_attack=Ваш клон идет в атаку!
actors.hero.abilities.rogue.shadowclone$shadowally.desc=Копия разбойника, созданная из темноты. Она стоит неподвижно, с пустыми глазницами и крошечными облачками тьмы, исходящими от нее, словно пар.\n\nЭто не идеальная копия разбойника, однако она по-прежнему является достойным бойцом, который может извлекать выгоду из экипировки разбойника при прокачке нужных талантов.
actors.hero.abilities.rogue.shadowclone$shadowally.discover_hint=Вы можете найти этого персонажа с помощью определённой способности брони героя.

actors.hero.abilities.huntress.spectralblades.name=спектральные клинки
actors.hero.abilities.huntress.spectralblades.short_desc=Охотница швыряет _Спектральные Клинки_ в цель, нанося урон в зависимости от ее текущего экипированного оружия ближнего боя.
actors.hero.abilities.huntress.spectralblades.desc=Охотница бросает во врага спектральный клинок, который равносилен удару оружием ближнего боя. Работают все обычные эффекты оружия ближнего боя, включая чары.
actors.hero.abilities.huntress.naturespower.name=сила природы
actors.hero.abilities.huntress.naturespower.short_desc=Охотница призывает _Силу Природы_, на короткое время увеличивая скорость движения и скорострельность своего лука.
actors.hero.abilities.huntress.naturespower.desc=Охотница на время наделяет себя и свой лук силой природы! Этот эффект длится 8 ходов.\n\nВ течение этого времени охотница движется с удвоенной скоростью и атакует из лука на 33% быстрее. Эффект усиленной атаки из лука не срабатывает, если снайпер использует свои специальные атаки.
actors.hero.abilities.huntress.naturespower$naturespowertracker.name=сила природы
actors.hero.abilities.huntress.naturespower$naturespowertracker.desc=Охотница усиливается на короткое время, увеличивая скорость своего передвижения и атаки с помощью лука.\n\nХодов осталось: %s.
actors.hero.abilities.huntress.spirithawk.name=дух ястреба
actors.hero.abilities.huntress.spirithawk.no_space=Рядом с вами нет свободного места.
actors.hero.abilities.huntress.spirithawk.short_desc=Охотница вызывает фамильяра _Духа Ястреба_, который может помочь ей разведать места и отвлечь врагов.
actors.hero.abilities.huntress.spirithawk.desc=Охотница призывает фамильяра ястреба-духа, которым можно управлять, повторно используя способность, пока он призван. Ястреб живет 100 ходов, управление ястребом не требует заряда или времени.\n\nУ ястреба очень низкое здоровье и сила атаки, но он быстр, ловок и точен. Он разделяет с охотницей свое поле зрения. Он невосприимчив ко всем связанным с областью эффектам, таким как огонь и ядовитый газ. Он не будет атаковать без приказа.
actors.hero.abilities.huntress.spirithawk$hawkally.name=дух ястреба
actors.hero.abilities.huntress.spirithawk$hawkally.direct_defend=Ваш ястреб идет на выбранную позицию.
actors.hero.abilities.huntress.spirithawk$hawkally.direct_follow=Ваш ястреб следует за вами.
actors.hero.abilities.huntress.spirithawk$hawkally.direct_attack=Ваш ястреб идет в атаку!
actors.hero.abilities.huntress.spirithawk$hawkally.desc=Волшебный ястреб, призванный Охотницей. Он светится ярким синим эфирным цветом, он постоянно крутит головой, осматривая местность\n\nХоть он и не лучший боец, его скорость и зрение делают его превосходным в разведке и отвлечении врагов.
actors.hero.abilities.huntress.spirithawk$hawkally.desc_remaining=Ходов осталось: %d.
actors.hero.abilities.huntress.spirithawk$hawkally.desc_dodges=Осталось гарантированных уворотов: %d.
actors.hero.abilities.huntress.spirithawk$hawkally.discover_hint=Вы можете найти этого персонажа с помощью определённой способности брони героя.

actors.hero.abilities.duelist.challenge.name=вызов
actors.hero.abilities.duelist.challenge.prompt=Выберите врага, которому хотите бросить вызов
actors.hero.abilities.duelist.challenge.already_dueling=Вы можете находиться только в одной дуэли одновременно.
actors.hero.abilities.duelist.challenge.ally_target=Вы можете бросать вызов только врагам.
actors.hero.abilities.duelist.challenge.unreachable_target=Цель должна быть достижима для вызова.
actors.hero.abilities.duelist.challenge.distant_target=Этот враг слишком далеко, чтобы бросить ему вызов.
actors.hero.abilities.duelist.challenge.short_desc=Дуэлянт _Вызывает_ соперника на дуэль, временно погружая в стазис всех остальных врагов.
actors.hero.abilities.duelist.challenge.desc=Дуэлянт может вызвать ближайшего врага на дуэль. Этот враг будет сражаться с ней, пока все другие враги будут временно заморожены во времени. \n\nЦель должна находиться в 5 клетках от Дуэлянта. Дуэль завершится, когда пройдёт 10 ходов, враг погибнет или Дуэлянт отойдёт от врага на 5 клеток.\n\nЗамороженные враги неуязвимы. Союзники Дуэлянта не поддаются заморозке, но если способность использована на боссе, его приспешники также не будут заморожены.
actors.hero.abilities.duelist.challenge$duelparticipant.name=участник дуэли
actors.hero.abilities.duelist.challenge$duelparticipant.desc=Этот персонаж участвует в дуэли. Он и все его союзники или приспешники могут свободно двигаться, пока другие заморожены.\n\nДуэль продлится определенное количество времени или завершится, когда один из участников погибнет или отойдет от другого на 5 клеток.\n\nОсталось ходов: %d.
actors.hero.abilities.duelist.elementalstrike.name=стихийный удар
actors.hero.abilities.duelist.elementalstrike.short_desc=Дуэлянт наносит _Стихийный удар_, распределяя эффект, зависимый от зачарования на её оружии, по области действия в форме конуса.
actors.hero.abilities.duelist.elementalstrike.desc=Дуэлянт не промахиваясь наносит удар по врагу или клетке, распределяя магический эффект в области конуса 65 градусов на расстоянии до 4 клеток. Этот эффект зависит от зачарования на её оружии.
actors.hero.abilities.duelist.elementalstrike.generic_desc=Стихийный удар без зачарования на оружии создаст небольшой всплеск магии, наносящий 6-12 урона всем врагам в зоне поражения.
actors.hero.abilities.duelist.feint.name=ложный выпад
actors.hero.abilities.duelist.feint.prompt=Выберите клетку для рывка
actors.hero.abilities.duelist.feint.too_far=Это место далеко от вас.
actors.hero.abilities.duelist.feint.bad_location=Вы не можете попасть сюда.
actors.hero.abilities.duelist.feint.short_desc=Дуэлянт совершает _Ложный выпад_, имитируя атаку, и делает рывок на соседнюю клетку. Враги будут атаковать послеобраз Дуэлянта. Следующая атака против таких врагов будет внезапной.
actors.hero.abilities.duelist.feint.desc=Дуэлянт имитирует атаку и совершет рывок на соседнюю клетку, оставляя послеобраз. Враги будут атаковать послеобраз вместо Дуэлянта.\n\nВраги, атакующие послеобраз, приходят в замешательство, что отменяет их следующее действие. Следующая атака против таких врагов будет внезапной.

actors.hero.abilities.cleric.ascendedform.name=Вознесённая форма
actors.hero.abilities.cleric.ascendedform.short_desc=Клирик принимает _Вознесённую форму_, получая новые заклинания, дальность атаки и щит.
actors.hero.abilities.cleric.ascendedform.desc=Клирик излучает святую энергию из себя, принимая улучшенную светлую форму на 10 ходов. Пока в этой форме, Клирик может применять новые заклинания, получает 2 к дальности атаки, 30 единиц щита и любые заклинания будут давать 10 единиц щита за каждый потраченный заряд священного тома.\n\nЩит, полученный от вознесённой формы и её заклинаний, не исчезает постепенно, но моментально пропадёт, как только закончится действие формы. Способность может быть использована повторно, чтобы обновить время действия формы.
actors.hero.abilities.cleric.ascendedform$ascendbuff.name=Вознесённая форма
actors.hero.abilities.cleric.ascendedform$ascendbuff.desc=Светлая энергия изучается телом Клирика. Пока в этой форме, Клирик может применять новые заклинания, получает 2 к дальности атаки (от излучаемой святой энергии), и 10 единиц щита за каждый потраченный заряд священного тома. Он также способен применять заклинания, которые открываются с помощью талантов вознесённой формы.\n\nЩит, полученный от вознесённой формы и её заклинаний, не исчезает постепенно, но моментально пропадёт, как только закончится действие формы.\n\nТекущий щит: %1$d.\nХодов осталось: %2$d.
actors.hero.abilities.cleric.trinity.name=Троица
actors.hero.abilities.cleric.trinity.no_imbue=Троица пока что не имеет эффекта для этой формы, используйте какие-нибудь её заклинание!
actors.hero.abilities.cleric.trinity.no_duplicate=Троица не может удвоить эффект который уже есть!
actors.hero.abilities.cleric.trinity.ench_glyph_use=Троица применит этот эффект на _%1$d ходов_, используя _%2$s заряда._
actors.hero.abilities.cleric.trinity.rare_ench_glyph_use=Троица применит этот _мощный_ эффект на _%1$d ходов_, используя _%2$s заряда._
actors.hero.abilities.cleric.trinity.wand_use=Троица выстрелит из этой палочки _+%1$d_ уровня, используя _%2$s заряда._
actors.hero.abilities.cleric.trinity.wand_multi_use=Троица выстрелит из многозарядной палочки _+%1$d_ уровня, используя _%2$s заряда._
actors.hero.abilities.cleric.trinity.thrown_use=Троица кинет оружие _+%1$d_ уровня, используя _%2$s заряда._
actors.hero.abilities.cleric.trinity.ring_use=Троица применит эффект кольца _+%1$d_ уровня на 20 ходов, используя _%2$s заряда._
actors.hero.abilities.cleric.trinity.alchemiststoolkit_use=Троица применит эффект переносной алхимии этого артефакта, используя _%2$s заряда._
actors.hero.abilities.cleric.trinity.chaliceofblood_use=Троица применит эффект пассивного восстановления здоровья этого артефакта _+%1$d_ уровня на 20 ходов, используя _%2$s заряда._
actors.hero.abilities.cleric.trinity.driedrose_use=Троица воспользуется эффектом призыва порченного дружественного призрака с ОЗ, как у этого артефакта _+%1$d_ уровня, используя _%2$s заряда._
actors.hero.abilities.cleric.trinity.etherealchains_use=Троица применит эффект цепей с досягаемостью, как у этого артефакта _+%1$d_ уровня, используя _%2$s заряда._
actors.hero.abilities.cleric.trinity.hornofplenty_use=Троица применит эффект перекуса этого артефакта, используя _%2$s заряда._
actors.hero.abilities.cleric.trinity.masterthievesarmband_use=Троица применит эффект обкрадывающий врага, как у этого артефакта _+%1$d_ уровня, используя _%2$s заряда._
actors.hero.abilities.cleric.trinity.sandalsofnature_use=Троица применит эффект опутывания со случайным вредоносным семенем, как у этого артефакта, используя _%2$s заряда._
actors.hero.abilities.cleric.trinity.skeletonkey_use=Троица применит эффект отмычки, как у этого артефакта, используя _%2$s заряда._
actors.hero.abilities.cleric.trinity.talismanofforesight_use=Троица применит эффект предвидения, как у этого артефакта _+%1$d_ уровня, используя _%2$s заряда._
actors.hero.abilities.cleric.trinity.timekeepershourglass_use=Троица применит эффект заморозки времени, как у этого артефакта с длительностью в _%1$d_ ходов, используя _%2$s заряда._
actors.hero.abilities.cleric.trinity.unstablespellbook_use=Троица применит эффект случайного свитка или с _%1$d/10_ шансом предложить особый вариант свитка, как у этого артефакта, используя _%2$s заряда._
actors.hero.abilities.cleric.trinity.cost=Стоимость заряда способности варьируется, но чаще всего равна _%d_.
actors.hero.abilities.cleric.trinity.short_desc=Клирик получает _Троицу_ способностей, которые имитируют увиденное им снаряжение и могут быть присвоены с помощью новых заклинаний.
actors.hero.abilities.cleric.trinity.desc=Клирик получает Троицу способностей брони, которые можно назначать на различные предметные эффекты с помощью трёх новых заклинаний. Каждое из этих заклинаний фокусируется на имитации эффектов разных видов экипировки, которые Клирик обнаружил во время этого прохождения: форма тела (оружие и броня), форма разума (палочки и метательное оружие) и форма духа (кольца и артефакты).\n\nКаждая форма Троицы может быть наделена только одним эффектом одновременно, и Клирик выбирает, какой из них активировать при использовании Троицы. Троица не будет дублировать эффект предмета, который уже экипирован.
actors.hero.abilities.cleric.trinity$wndusetrinity.text=Выберите, какую форму Троицы использовать. Эффекты от разных форм могут действовать одновременно.
actors.hero.abilities.cleric.trinity$wndusetrinity.body=_Телесная форма: %s._
actors.hero.abilities.cleric.trinity$wndusetrinity.mind=_Ментальная форма: %s._
actors.hero.abilities.cleric.trinity$wndusetrinity.spirit=_Духовная форма: %s._
actors.hero.abilities.cleric.trinity$wnditemtypeselect.text=Выберите эффект, который будет вложен в Троицу. Перед подтверждением будет показана дополнительная информация.
actors.hero.abilities.cleric.trinity$wnditemconfirm.body=Присвоить телесную форму
actors.hero.abilities.cleric.trinity$wnditemconfirm.mind=Присвоить ментальную форму
actors.hero.abilities.cleric.trinity$wnditemconfirm.spirit=Присвоить духовную форму
actors.hero.abilities.cleric.powerofmany.name=сила многих
actors.hero.abilities.cleric.powerofmany.prompt_default=Выберите союзника или место
actors.hero.abilities.cleric.powerofmany.prompt_ally=Направьте своего союзника
actors.hero.abilities.cleric.powerofmany.ally_exists=У вас уже есть усиленный союзник.
actors.hero.abilities.cleric.powerofmany.no_vision=Вы не можете нацелиться на место, которое не видите.
actors.hero.abilities.cleric.powerofmany.only_allies=Вы можете усиливать только союзников.
actors.hero.abilities.cleric.powerofmany.short_desc=Клирик направляет _Силу Многих_, усиливая существующего союзника или создавая нового.
actors.hero.abilities.cleric.powerofmany.desc=Клирик направляет _Силу Многих_, которая либо усиливает существующего союзника, либо создаёт нового усиленного союзника на 100 ходов. Если способность применяется на пустое пространство, создаётся новый союзник.\n\nПод воздействием Силы Многих любой союзник наносит на 25% больше урона, получает на 25% меньше урона и делится своим обзором с Клириком. Кроме того, при активации способности он получает 25 единиц щита.\n\nКлирик также получает три новых заклинания, которые можно использовать только при наличии усиленного союзника. Сила Многих не исчезнет, пока одно из этих заклинаний активно.
actors.hero.abilities.cleric.powerofmany$powerbuff.name=сила многих
actors.hero.abilities.cleric.powerofmany$powerbuff.desc=Этот союзник был усилен Силой многих, что даёт ему +25 %% наносимого урона и -25 %% получаемого. Также союзник будет делить поле зрения с Клириком и может получать полезные эффекты от заклинаний Силы многих. \nСила многих сохраняется, когда союзники, такие как радужная копия скрываются, но её время действия всё равно будет считаться.\n\nХодов осталось: %s.
actors.hero.abilities.cleric.powerofmany$lightally.name=световой союзник
actors.hero.abilities.cleric.powerofmany$lightally.direct_defend=Ваш союзник идет на выбранную позицию.
actors.hero.abilities.cleric.powerofmany$lightally.direct_follow=Ваш союзник следует за вами.
actors.hero.abilities.cleric.powerofmany$lightally.direct_attack=Ваш союзник идет в атаку!
actors.hero.abilities.cleric.powerofmany$lightally.desc=Копия одного из спутников клирика по приключениям, созданная из сплошного света. Хотя он имеет форму другого героя, у него нет ни одной из его уникальных способностей. Этот союзник будет существовать до тех пор, пока к нему применяется Сила Многих.\n\nЭтот союзник может быть направлен без затрат, если вы повторно используете способность доспехов Сила многих.
actors.hero.abilities.cleric.powerofmany$lightally.discover_hint=Вы можете найти этого персонажа с помощью определённой способности брони героя.


actors.hero.abilities.ratmogrify.name=крысоморфоз
actors.hero.abilities.ratmogrify.cant_transform=Ты не можешь крысоморфизировать это!
actors.hero.abilities.ratmogrify.too_strong=Этот враг слишком силен, чтобы крысоморфизировать его!
actors.hero.abilities.ratmogrify.short_desc=Герой _Крысоморфизирует_ врага! Это временно превращает его в крысу без способностей.
actors.hero.abilities.ratmogrify.desc=Герой превращает врага в крысу на 6 ходов! Боссы, союзники и крысы не могут быть превращены в крыс.\n\nКрысоморфизированные враги сохраняют свою первоначальную статистику, но не имеют никаких способностей.
actors.hero.abilities.ratmogrify$transmograt.name=Крысоморфизирован %s
actors.hero.abilities.ratmogrify$transmograt.desc=Этот враг превратился в крысу. Существенное улучшение, я бы сказал! - Крысиный Король
actors.hero.abilities.ratmogrify$transmograt.rankings_desc=Убит крысоморфизированным врагом

##Cleric Spells
actors.hero.spells.auraofprotection.name=Аура защиты
actors.hero.spells.auraofprotection.short_desc=Повышает защиту Паладина и ближайших союзников.
actors.hero.spells.auraofprotection.desc=Паладин начинает источать оберегающую энергию сверкающей аурой вокруг себя в течении 20 ходов. Любой союзник в пределах 2 клеток от Паладина (в том числе и он сам) получают на %1$d%% меньше урона, а также перенимают эффект руны на доспех Паладина с %2$d%% мощностью.\n\nЭто уменьшение урона срабатывает перед любыми другими эффектами сопротивления урона (например броня). Временное усиление с эффектом руны срабатывает всегда, только если персонаж до этого не был под этим эффектом (например сам Паладин или его Радужная копия).
actors.hero.spells.auraofprotection$aurabuff.name=Аура защиты
actors.hero.spells.auraofprotection$aurabuff.desc=Паладин испускает защитную энергию вокруг себя.\n\nЛюбой ближайший союзник (включая самого Паладина) получает уменьшенный урон и усиливающий эффект руны брони Паладина с повышенной мощностью.\n\nХодов осталось:%s.

actors.hero.spells.beamingray.name=сияющий луч
actors.hero.spells.beamingray.no_space=Не хватает места для появления вашего союзника.
actors.hero.spells.beamingray.out_of_range=Это место вне досягаемости.
actors.hero.spells.beamingray.short_desc=Телепортирует вашего союзника и наносит дополнительный урон.
actors.hero.spells.beamingray.desc=Клирик превращает силу союзника в луч света, который направляет его в нужное место. Если луч столкнется с врагом, он поместит союзника поблизости и направит его на врага.\n\nМаксимальный радиус действия луча составляет %1$d клеток, и он увеличивает бонусный урон от Силы многих до +%2$d%% на 10 ходов против ближайшего врага в пределах 4 клеток. Луч может даже телепортировать обычно неподвижных союзников, но его дальность в этом случае уменьшается вдвое.
actors.hero.spells.beamingray$beamingrayboost.name=сияющий луч
actors.hero.spells.beamingray$beamingrayboost.desc=Этот союзник недавно был телепортирован Лучами, что дает ему бонус к урону против ближайшего врага после телепортации. Сила многих также не истекает, когда этот эффект активен.\n\nОставшиеся ходы: %s.

actors.hero.spells.blessspell.name=благоcловление
actors.hero.spells.blessspell.short_desc=Благословляет и даёт щит Клирику или вдохновляет и исцеляет других.
actors.hero.spells.blessspell.desc=Клирик благословляет себя или другого персонажа, которого он видит.\n\nКогда применено на себя, эффект слабее, даруя %1$dходов вдохновения и %2$dщита.\n\nКогда применяется на других персонажей, эффект становится сильнее, даруя %3$dхода вдохновения и %4$d исцеления. Излишнее лечение превращается в щит.

actors.hero.spells.bodyform.name=телесная форма
actors.hero.spells.bodyform.short_desc=Присваивает Троицу заклинанию или руне.
actors.hero.spells.bodyform.desc=Клирик выбирает зачарование или руну, которую он обнаружил в этом ходу, и накладывает на Троицу ее эффект.\n\nКогда Троица используется, клирик получает эффект выбранного зачарования или руны на %d ходов. Это временное заклинание или глиф будет работать с любым эффектом, который действует на обычное заклинание или руна.\n\nЭто заклинание заменяет любой другой эффект тела, которым в данный момент наделена Тринити.
actors.hero.spells.bodyform$bodyformbuff.name=телесная форма
actors.hero.spells.bodyform$bodyformbuff.desc=Телесная форма Троицы сейчас наделяет вас зачарованием или руной, как будто вы носите ее как оружие или броню.\n\nОбратите внимание, что телесная форма не дает еще одной копии эффекта, который вы уже используете. \n\nТекущий эффект: %1$s.\n\nОсталось ходов: %2$s.

actors.hero.spells.cleanse.name=очищение
actors.hero.spells.cleanse.short_desc=Снимает негативные эффекты и дарует щит.
actors.hero.spells.cleanse.desc=Клирик очищает все негативные эффекты на себе и союзниках в поле зрения. После окончания заклинания все задетые персонажи также получают %1$d ходов невосприимчивости к негативным эффектам и %2$d щита.

actors.hero.spells.clericspell.prompt=Выберите цель
actors.hero.spells.clericspell.no_target=Там нет цели.
actors.hero.spells.clericspell.invalid_target=Вы не можете выбрать это место.
actors.hero.spells.clericspell.invalid_enemy=Вы не можете выбрать этого врага.
actors.hero.spells.clericspell.charge_cost=Стоимость заряда: %d

actors.hero.spells.divinesense.name=божественное чутьё
actors.hero.spells.divinesense.short_desc=Временно получает ментальное зрение в большом радиусе.
actors.hero.spells.divinesense.desc=Клирик фокусирует свое восприятие на окружении, получая ментальное зрение радиусом %d клеток на 50 ходов. Это заклинание не требует времени на применение.
actors.hero.spells.divinesense$divinesensetracker.name=божественное чутьё
actors.hero.spells.divinesense$divinesensetracker.desc=Этот персонаж способен временно видеть других существ поблизости с помощью своего разума!\n\nХодов осталось: %s.

actors.hero.spells.divineintervention.name=божественное вмешательство
actors.hero.spells.divineintervention.short_desc=Огромный прирост щита Клирику и союзникам.
actors.hero.spells.divineintervention.desc=Клирик направляет огромное количество энергии из своего тома в себя и союзников, даруя всем %1$d единиц щита и продлевает Вознесённую Форму на %2$d ходов. Огромная защитная сила этого заклинания требует очень много зарядов тома.\n\nКак и любой другой щит, полученный от вознесённой формы, этот щит не исчезнет со временем, но моментально пропадёт, как только закончится действие формы.

actors.hero.spells.flash.name=вспышка
actors.hero.spells.flash.prompt=Выберите место
actors.hero.spells.flash.short_desc=Телепортирует на небольшое расстояние.
actors.hero.spells.flash.desc=Клирик направляет свою вознесённую форму на место неподалёку и телепортируется туда. Вспышка способна телепортировать Клирика в любое открытое место, которое в радиусе и не занято. Заклинание требует больше зарядов при применении каждый раз, когда используется в течение времени действия одной и той же формы.

actors.hero.spells.guidinglight.name=путеводный свет
actors.hero.spells.guidinglight.short_desc=Наносит магический урон на расстоянии и гарантирует попадание.
actors.hero.spells.guidinglight.desc=Клирик стреляет зарядом магической энергии, которая поражает цель, нанося 2-8 магического урона и освещая её. Следующая не обессиленная физическая атака по освещённому врагу гарантированно попадёт по нему.
actors.hero.spells.guidinglight.desc_priest=_Это заклинание сильнее, когда применяется Жрецом._ Первое применение заклинания каждые 50 ходов не расходует зарядов тома, и освещение потребляться от сияния, палочек, других персонажей и артефактов, которые напрямую воздействуют на врагов. Когда освещение действует так, оно наносит бонусный магический урон, равный уровню Жреца + 5.
actors.hero.spells.guidinglight$guidinglightpriestcooldown.name=Путеводный свет
actors.hero.spells.guidinglight$guidinglightpriestcooldown.desc=Жрец сможет снова применить Путеводный свет без затрат спустя 50 ходов.\n\nХодов осталось: %s.
actors.hero.spells.guidinglight$illuminated.name=Освещение
actors.hero.spells.guidinglight$illuminated.desc=Этот персонаж светится в результате попадания в него путеводного света. Хотя свечение не настолько сильное, чтобы осветить окружающее пространство, магический эффект значительно облегчит клирику нанесение ударов.
actors.hero.spells.guidinglight$illuminated.desc_priest=Жрец может дополнительно расходовать осветление с помощью сияния, заклинания палочки, удара союзника или эффектов от некоторых артефактов. При использовании осветления таким образом наносится бонусный магический урон, равный уровню Жреца + 5.
actors.hero.spells.guidinglight$illuminated.desc_generic=Другие герои по-прежнему могут использовать Освещенный, чтобы воспользоваться талантом Жгучий свет, но при этом не получат никакой точности.

actors.hero.spells.hallowedground.name=священная земля
actors.hero.spells.hallowedground.prompt=Выберите место
actors.hero.spells.hallowedground.short_desc=Исцеляет союзников, замедляет врагов и выращивает траву в зоне действия.
actors.hero.spells.hallowedground.desc=Жрец фокусирует свою божественную магию на области неподалёку, создавая область святых земель, размером %1$d на %1$d на 20 ходов.\n\nКогда применено, это заклинание исцеляет всех союзников на 15 здоровья (здоровые союзники и Жрец получают щит), ненадолго опутывает врагов и выращивает короткую траву.\n\nСвятая земля исцеляет союзников на 1 здоровье за ход (здоровые союзники и Жрец получают щит), калечит врагов, и случайно выращивает высокую траву.\n\nСвятая земля уничтожается огнём и будет выращивать примятую траву, если эффект пассивной регенерации отключён или Жрец давно не получал опыт.
actors.hero.spells.hallowedground$hallowedterrain.desc=Земля здесь священна. Святая земля замедляет врагов, лечит союзников и проращивает траву.

actors.hero.spells.holyintuition.name=интуиция святого
actors.hero.spells.holyintuition.prompt=выберите предмет
actors.hero.spells.holyintuition.cursed=Вы чувствуете недобрую магию, таящуюся в этом предмете.
actors.hero.spells.holyintuition.uncursed=Этот предмет не проклят.
actors.hero.spells.holyintuition.short_desc=Определяет, является ли предмет проклятым или нет.
actors.hero.spells.holyintuition.desc=Клирик фокусирует свои чувства на предмете и определяет, проклят ли тот, без нужды экипировать его.

actors.hero.spells.holylance.name=священное копьё
actors.hero.spells.holylance.short_desc=Наносит крупный дальнобойный магический урон.
actors.hero.spells.holylance.desc=Жрец концентрирует большое количество энергии в разрушительное метательное копьё, сделанное из света. Это копьё наносит %1$d-%2$d урона и всегда наносит максимальный урон нежити и демоническим целям.\n\nЭто заклинание очень дорогое и имеет время восстановления 30 ходов.
actors.hero.spells.holylance$lancecooldown.name=перезарядка священного копья
actors.hero.spells.holylance$lancecooldown.desc=Жрец недавно использовал Священное Копьё и должен подождать перед его следующим использованием.\n\nХодов осталось: %s.

actors.hero.spells.holyward.name=священный оберег
actors.hero.spells.holyward.glyph_name=%s света
actors.hero.spells.holyward.glyph_desc=Эта руна слегка повышает то количество урона, которое может выдержать ваша броня
actors.hero.spells.holyward.short_desc=Временно изменяет руну чтобы повысить защиту вашей брони
actors.hero.spells.holyward.desc=Клирик наполняет свою надетую броню рунами святого света, увеличивая блокировку урона этой брони на 1. Это заклинание не требует времени для использования.\n\nЭта руна действует в течение 50 ходов и на время своей длительности заменяет любую другую положительную руну на броне. Клирик в любом случае получает бонус от этого эффекта, даже если у него нет брони.
actors.hero.spells.holyward.desc_paladin=_Это заклинание становится мощнее, когда его произносит Паладин._ Дополнительное блокирование урона увеличено до 3, заклинание больше не отменяет существующие руны, а произнесение других заклинаний во время действия священного оберега увеличивает его продолжительность на 10 ходов за каждый использованный заряд.
actors.hero.spells.holyward$holyarmbuff.name=священный оберег
actors.hero.spells.holyward$holyarmbuff.desc=Клирик наполнил свою надетую броню святой энергией, временно заменив любую существующую руну и увеличив блокировку урона брони на 1 единицу.\n\nХодов осталось: %s.
actors.hero.spells.holyward$holyarmbuff.desc_paladin=Паладин напитал свои доспехи святой энергией, благодаря чему доспехи блокируют дополнительные 3 очка урона.\n\nНаложение других заклинаний во время активного священного оберега увеличивает его продолжительность на 10 ходов за каждый потраченный заряд.\n\nХодов осталось: %s.

actors.hero.spells.holyweapon.name=священное оружие
actors.hero.spells.holyweapon.ench_name=%s святости
actors.hero.spells.holyweapon.ench_desc=Враги, пораженные святым оружием получат дополнительный магический урон
actors.hero.spells.holyweapon.short_desc=Временно изменяет зачарование чтобы повысить урон оружия
actors.hero.spells.holyweapon.desc=Клирик зачаровывает своё надетое оружие святой энергией, заставляя его наносить дополнительный магический урон в размере 2 единиц при каждом ударе по врагу. Это заклинание не требует времени для использования.\n\nЭто зачарование действует в течение 50 ходов и на время своей длительности заменяет любое другое положительное зачарование на оружии. Этот эффект также полезен при безоружных атаках.
actors.hero.spells.holyweapon.desc_paladin=_Это заклинание более мощное, когда его использует Паладин._ Дополнительный магический урон увеличен до 6, заклинание больше не отменяет существующие зачарования и использование других заклинаний, пока Святое Оружие активно продлит его продолжительность на 10 шагов за 1 использованный заряд.
actors.hero.spells.holyweapon$holywepbuff.name=священное оружие
actors.hero.spells.holyweapon$holywepbuff.desc=Клирик наполнил своё надетое оружие святой энергией, временно заменив любое существующее зачарование и заставив оружие наносить дополнительный магический урон в размере 2 единиц при каждом атаке.\n\nХодов осталось: %s.
actors.hero.spells.holyweapon$holywepbuff.desc_paladin=Паладин наполнил свое надетое оружие святой энергией, добавляя к своим атакам 6 дополнительного магического урона.\n\nИспользование других заклинаний, пока святое оружие активно, продлит его на 10 ходов за каждый потраченный заряд.\n\nХодов осталось: %s.

actors.hero.spells.judgement.name=приговор
actors.hero.spells.judgement.short_desc=Наносит урон всем врагам, находящимся в поле зрения
actors.hero.spells.judgement.desc=Клирик ударяет кулаком по земле, вызывая извержение света, которое наносит урон всем врагам, которых он может видеть. Это наносит %1$d-%2$d урона, а также дополнительно 33%% урона за каждое заклинание, которое Клирик использовал с момента вступления в Вознесённую форму (или с последнего использования Приговора).\n\nВ данный момент Приговор нанесет %3$d-%4$d урона.

actors.hero.spells.layonhands.name=Наложение рук
actors.hero.spells.layonhands.short_desc=Мгновенно исцеляет соседнего персонажа или защищает Паладина.
actors.hero.spells.layonhands.desc=Паладин проводит священную энергию через свои ладони, исцеляя или защищая всё чего коснётся. \n\nПаладин может наложить заклинание на любого персонажа смежного с ним, чтобы излечить на %1$d, или на себя, чтобы получить %1$dщита. Излишнее лечение превращается в щит.\n\nЗаклинание используется мгновенно и может быть использовано повторно, но но не может даровать щит свыше значения равного трём использованиям.

actors.hero.spells.lifelinkspell.name=узы жизни
actors.hero.spells.lifelinkspell.short_desc=Разделяет урон между союзником и снижает получаемый им урон.
actors.hero.spells.lifelinkspell.desc=Клирик укрепляет связь между собой и союзником, получившим силу. Благодаря этой связи любой полученный урон будет делиться между героем и его союзником в течение %1$d ходов, а прибавка к защите от Силы многих будет увеличена до -%2$d%% полученного урона. Обратите внимание, что урон делится после брони, но до снижения урона от Силы многих.\n\nПока действует этот эффект, полезные заклинания клирика уровня T3 или ниже будут применяться и к клирику, и к его союзнику, если бы они применялись только к одному из них.
actors.hero.spells.lifelinkspell$lifelinkspellbuff.name=оберегающие узы жизни
actors.hero.spells.lifelinkspell$lifelinkspellbuff.desc=Клирик недавно наложил на этого союзника заклинание Связь с жизнью.\n\nВ дополнение к обычным преимуществам Связи жизни этот персонаж получает уменьшенный урон, все положительные заклинания клирика применяются к клирику и союзнику, а не только к одному из них, и Сила многих не истекает, пока действует этот эффект.\n\nХодов осталось: %s.

actors.hero.spells.mindform.name=ментальная форма
actors.hero.spells.mindform.short_desc=Присваивает Троицу волшебной палочке или метательному оружию.
actors.hero.spells.mindform.desc=Клирик выбирает палочку или метательное оружие, которое он нашел в этом ходу, и накладывает на него эффект Троицы.\n\nКогда Троица используется, клирик может совершить одну атаку, как если бы он использовал выбранный предмет на уровне +%d. При этом срабатывают все эффекты, которые обычно вызывает использование этого предмета.\n\nЭто заклинание заменяет любой другой эффект разума, которым в данный момент наделена Троица.

actors.hero.spells.mnemonicprayer.name=мнемоническая молитва
actors.hero.spells.mnemonicprayer.short_desc=Продлевает положительные/отрицательные эффекты на союзнике/враге и повторно применяет эффект освещения.
actors.hero.spells.mnemonicprayer.desc=Жрец произносит молитву, которая продлевает длительность всех положительных и отрицательных эффектов на определённой цели на %1$d ходов. Это заклинание не требует времени для использования. Положительные эффекты будут действовать дольше на союзников (включая самого Жреца), а отрицательные эффекты будут действовать дольше на врагов.\n\nМнемоническая Молитва может продлить конкретный положительный или отрицательный эффект только один раз и не может продлевать положительные эффекты, полученные от способностей брони.

actors.hero.spells.radiance.name=сияние
actors.hero.spells.radiance.short_desc=Освещает и кратковременно оглушает видимых врагов.
actors.hero.spells.radiance.desc=Жрец излучает священный свет, оглушая всех видимых врагов на 3 хода. Если враг уже был освещен, Сияние активирует дополнительный урон освещения и повторно накладывает отрицательный эффект освещения. Сияние также заставляет Жреца светиться в течение 100 ходов, если текущий этаж находится во тьме.

actors.hero.spells.recallinscription.name=воспоминание начертания
actors.hero.spells.recallinscription.short_desc=Повторяет эффект недавно использованного рунного камня или свитка.
actors.hero.spells.recallinscription.desc=Клирик использует святую магию, чтобы повторно наложить эффект магической руны, найденной на рунном камне или свитке, которые были использованы за последние %s ходов.\n\nВоспоминание Начертания не может быть использовано со свитками улучшений. Стоимость заряда этого заклинания варьируется в зависимости от того, какой предмет был использован недавно: 2 за рунный камень, 3 за свиток, 4 за особый свиток. Эта стоимость заряда также удваивается при использовании свитка превращения или алхимических предметов, которые были созданы с помощью превращения или улучшения.
actors.hero.spells.recallinscription$useditemtracker.name=недавно использованная руна
actors.hero.spells.recallinscription$useditemtracker.desc=Клирик недавно использовал предмет, который работает с заклинанием воспоминания начертания. Клирик может использовать заклинание, чтобы повторить эффект предмета.\n\nИспользованный предмет: %1$s.\n\nОсталось ходов: %2$s.

actors.hero.spells.shieldoflight.name=Щит света
actors.hero.spells.shieldoflight.short_desc=Дарует временную броню против цели.
actors.hero.spells.shieldoflight.desc=Клирик создает тонкую преграду света между собой и врагом, увеличивая защиту брони против этого врага на %1$d-%2$d на 5 ходов.\n\nЭто заклинание не требует времени для использования, но не может быть использовано против нескольких целей одновременно.
actors.hero.spells.shieldoflight$shieldoflighttracker.name=щит света
actors.hero.spells.shieldoflight$shieldoflighttracker.desc=Тонкий щит света стоит между героем и врагом. Он недостаточно силен, чтобы полностью блокировать атаки, но смягчит их урон.\n\nХодов осталось: %s.

actors.hero.spells.spiritform.name=духовная форма
actors.hero.spells.spiritform.short_desc=Присваивает Троицу кольцу или артефакту.
actors.hero.spells.spiritform.desc=Клирик выбирает кольцо или артефакт, который они уже опознали в этом забеге (кроме святого тома), и наполняет Троицу этим эффектом.\n\nЕсли выбрано кольцо, то Троица дает эффект этого кольца силой + %1$d на 20 шагов.\n\nЕсли выбран артефакт, то Троица повторяет эффект этого артефакта силой +%2$d. У каждого артефакта разное поведение и цена, когда использовано Троицей.\n\nЭто заклинание повторяет любой другой эффект, которым наполнена Троица в данный момент.
actors.hero.spells.spiritform$spiritformbuff.name=духовная форма
actors.hero.spells.spiritform$spiritformbuff.desc=Святая форма Троицы прямо сейчас дает вам силу предмета, как если он сейчас надет у вас.\n\nЗапомните, что дух не может дать копию эффекта, которая у вас есть в этот момент.\n\nЭффект: %1$s\n\nХодов осталось: %2$s

actors.hero.spells.smite.name=Божественная кара
actors.hero.spells.smite.short_desc=Гарантирует попадание с бонусным уроном и силой заклинания.
actors.hero.spells.smite.desc=Паладин наделяет рукопашный удар разрушительной праведной мощью. \n\nВ дополнение к обычному рукопашный урону, атаки оружием, которым вы можете эффективно владеть, с использованием _Божественная Кары_ будут гарантированно попадать, получат +300%%к силе зачарования, а также дополнительно наносят %1$d - %2$d магического урона.\n\nДополнительный магический урон от Кары зависит от уровня Паладин и всегда наносит максимальный дополнительный магический урон по нежити или демоническим силам.

actors.hero.spells.stasis.name=стазис
actors.hero.spells.stasis.short_desc=Извлекает союзника из подземелья сохраняя его в себе.
actors.hero.spells.stasis.desc=Клирик фокусирует связь с союзником на себе, заставляя союзника временно находиться в своеобразном энергетическом стазисе внутри клирика. Союзник сохраняется до %d ходов, при этом все положительные эффекты, наложенные на него, не зависят от времени пребывания в стазисе.\n\nСоюзник появится рядом с клириком, когда стазис закончится естественным образом, или же он может мгновенно повторно сотворить заклинание без затрат, чтобы завершить эффект раньше. Стазис может перемещать даже неподвижных союзников, но не может переносить их между этажами.
actors.hero.spells.stasis$stasisbuff.name=союзник в стазисе
actors.hero.spells.stasis$stasisbuff.left_behind=Ваш неподвижный союзник остался позади.
actors.hero.spells.stasis$stasisbuff.desc=У клирика в настоящее время есть союзник, находящийся в стазисе. Все положительные эффекты на этом союзнике сохраняются, включая «Силу многих», и они снова появятся рядом с клириком, когда эффект закончится. Эффект также можно закончить раньше, повторно применив Стазис.\n\nСоюзников в стазисе: %1$s.\nХодов осталось: %2$s.

actors.hero.spells.sunray.name=солнечный луч
actors.hero.spells.sunray.short_desc=Наносит дальный магический урон и ослепляет цель один раз.
actors.hero.spells.sunray.desc=Клирик выпускает луч ослепляющего света по цели, нанося ей %1$d-%2$d урона и ослепляя на %3$d ходов. Солнечный Луч всегда наносит максимальный урон нежити и демоническим целям.\n\nПосле того как враг был поражён этим заклинанием, его зрение адаптируется, что предотвратит повторное ослепление. Однако, если враг будет поражён снова, будучи уже ослеплённым этим заклинанием, свет окажется слишком сильным и парализует его.

actors.hero.spells.walloflight.name=стена света
actors.hero.spells.walloflight.short_desc=Создает стену, которая блокирует врагов.
actors.hero.spells.walloflight.desc=Паладин создаёт прямо перед собой стену из пластин твёрдого света, которая с толщиной в 1 клетку, %1$d клеток в ширину, и существует в течение 20 ходов.\n\nЭта стена имеет те же свойства что и обычная. кроме того что она полностью прозрачна. Противники, которые оказались внутри стены на момент её создания, будут на мгновение парализованы и, если возможно, отброшены назад. Все, что застряло в стене, сможет из неё выйти. \n\nСтена может быть сотворена в любом направлении из четырёх сторон или четырёх диагоналей. Если стена уже существует, заклинание может быть использовано заново, чтобы мгновенно рассеять стену.
actors.hero.spells.walloflight.early_end=Вы рассеивайте стену света.
actors.hero.spells.walloflight$lightwall.desc=Мерцающие пластины света загораживают проход сюда.

##main hero
actors.hero.hero.name=вы
actors.hero.hero.leave=Ещё рано уходить, оставшееся подземелье ждёт впереди!
actors.hero.hero.level_up=Уровень повышен!
actors.hero.hero.new_level=Новый уровень! +Меткость, +Уклонение, +5 ОЗ!
actors.hero.hero.new_talent=+1 очко талантов!
actors.hero.hero.unspent=У вас остались нераспределённые очки талантов!
actors.hero.hero.level_cap=Вы не можете стать сильнее, но ваш опыт прибавляет вам сил!
actors.hero.hero.you_now_have=вы подобрали: %s.
actors.hero.hero.you_cant_have=Вы не можете унести: %s.
actors.hero.hero.locked_chest=Сундук закрыт, а у вас нет подходящего ключа.
actors.hero.hero.locked_door=У вас нет подходящего ключа.
actors.hero.hero.noticed_smth=Вы что-то заметили.
actors.hero.hero.wait=...
actors.hero.hero.search=поиск
actors.hero.hero.search_distracted=Вам сложно сосредоточиться, поэтому поиск занял больше времени.
actors.hero.hero.key_distracted=Вам не получается отпереть замок, поэтому придётся продолжать попытки.
actors.hero.hero.pain_resist=Боль помогает преодолеть тягу ко сну.
actors.hero.hero.revive=Анх взрывается дарующей жизнь энергией!

##classes
actors.hero.heroclass.warrior=воин
actors.hero.heroclass.warrior_desc_short=Воин - стойкий боец с сильной выдержкой в бою, благодаря щиту, дарованному _сломанной печатью_. Печать можно перемещать с одной брони на другую и она может _переносить одно улучшение_ на ней.
actors.hero.heroclass.warrior_desc=Воин начинает с _уникальной сломанной печатью_, которая создает вспелски защиты, пока его здоровье меньше половины. Печать можно снимать с одной брони и переносить на другую, и вместе с тем можно _переносить одно улучшение_ на ней.\n\nВоин также начинает с _изношенным коротким мечом_, _тремя метательными камнями_, тканой бронёй, бурдюком и бархатным мешочком.\n\nВоин автоматически опознаёт:\n_-_ Свиток Опознания\n_-_ Зелье Исцеления\n_-_ Свиток Ярости
actors.hero.heroclass.warrior_unlock=Воин автоматически разблокирован.

actors.hero.heroclass.mage=маг
actors.hero.heroclass.mage_desc_short=Маг - специалист по волшебным делам и носит с собой _уникальный магический посох,_ который сильнее палочек. Посох может быть наделен силой любой палочки, которую можно найти в подземелье.
actors.hero.heroclass.mage_desc=Маг начинает с _уникальным посохом_, который заряжается значительно быстрее, чем палочка, и имеет на 1 заряд больше. Посох может быть наделен силой любой палочки, которую он найдет в подземелье.\n\nМаг начинает с _посохом магической стрелы_, тканой бронёй, бурдюком и бархатным мешочком.\n\nМаг автоматически опознаёт:\n_-_ Свиток Опознания\n_-_ Зелье Алхимического Огня\n_-_ Свиток Улучшения
actors.hero.heroclass.mage_unlock=Чтобы разблокировать Мага, _используйте свиток улучшения, чтобы сделать предмет сильнее._

actors.hero.heroclass.rogue=разбойник
actors.hero.heroclass.rogue_desc_short=Разбойник - мастер скрытого боя, способен уклоняться от атак врагов и бить исподтишка, используя свой _уникальный Плащ Теней._ Он также _замечает секреты и ловушки_ на большем расстоянии.
actors.hero.heroclass.rogue_desc=Разбойник начинает с уникальным _Плащом Теней_, который он может использовать, чтобы стать невидимым по своему желанию.\n\nРазбойник _замечает секреты и ловушки_ на большем расстоянии.\n\nРазбойник также начинает с _кинжалом_, _тремя метательными ножами_, тканой бронёй, бурдюком и бархатным мешочком.\n\nРазбойник автоматически опознаёт:\n_-_ Свиток Опознания\n_-_ Зелье Невидимости\n_-_ Свиток Магической Карты
actors.hero.heroclass.rogue_unlock=Чтобы разблокировать Разбойника, _совершите 10 неожиданных атак в одном забеге._

actors.hero.heroclass.huntress=охотница
actors.hero.heroclass.huntress_desc_short=Охотница - эксперт дальнего боя, а также владеет своим _уникальным магическим луком_ с бесконечными стрелами. Она также может ходить в высокой траве, _не вытаптывая её._
actors.hero.heroclass.huntress_desc=Охотница начинает с уникальным _Луком Духов_, который может стрелять бесконечным количеством колдовских стрел.\n\nОхотница может ходить в высокой траве, _не вытаптывая её_.\n\nОхотница также начинает с парой _шипованных перчаток_, тканой броней, бурдюком, и бархатным мешочком.\n\nОхотница автоматически опознаёт:\n_-_ Свиток Опознания\n_-_ Зелье Ментального Зрения\n_-_ Свиток Колыбельной
actors.hero.heroclass.huntress_unlock=Чтобы разблокировать Охотницу, _ударьте 10 раз по противникам с помощью метательного оружия._

actors.hero.heroclass.duelist=дуэлянт
actors.hero.heroclass.duelist_desc_short=Дуэлянт — мастер оружий. Она может использовать _особую способность_ своего оружия, _уникальную для каждого его вида_.
actors.hero.heroclass.duelist_desc=Дуэлянт начинает с _уникальной рапирой_, у которой есть способность, заряжающаяся со временем.\n\nДуэлянт может использовать _особую способность_ каждого оружия в игре.\n\nДуэлянт также начинает с _двумя метательными шипами_, тканой бронёй, бурдюком и бархатным мешочком.\n\nДуэлянт автоматически опознаёт:\n_-_ Свиток Опознания\n_-_ Зелье Силы\n_-_ Свиток Зеркальных копий
actors.hero.heroclass.duelist_unlock=Чтобы разблокировать Дуэлянта, _экипируйте оружие с редкостью 2-го уровня или выше без штрафа за нехватку силы._

actors.hero.heroclass.cleric=клирик
actors.hero.heroclass.cleric_desc_short=Клирик — божественный маг, который использует свой уникальный _Священный Том_ для направления божественной магии. Он может _изучать и улучшать заклинания_ с помощью талантов.
actors.hero.heroclass.cleric_desc=Клирик начинает с _уникальным священным томом_, который он может использовать, чтобы сотворять различные заклинания.\n\nБольшинство талантов Клирика сосредоточены на изучении или улучшении заклинаний.\n\nКлирик также начинает с _палицей_, тканой броней, бурдюком, и бархатным мешочком.\n\nКлирик автоматически опознаёт: \n_-_ Свиток Опознания \n_-_ Зелье Очищения \n_-_ Свиток Рассеяния проклятия
actors.hero.heroclass.cleric_unlock=Чтобы разблокировать Клирика, _полностью очистите проклятие с любого проклятого предмета снаряжения._

actors.hero.herosubclass.berserker=берсерк
actors.hero.herosubclass.berserker_short_desc=_Берсерк_ накапливает ярость, когда получает урон. Ярость увеличивает наносимый им урон и при 100% может быть активирована для получения дополнительного щита.
actors.hero.herosubclass.berserker_desc=Берсерк погружается в ярость, когда он получает физический урон, включая урон, который блокируется его броней! Ярость постепенно угасает с течением времени, но она угасает медленнее, если у него мало ОЗ.\n\nВ зависимости от уровня ярости Берсерк наносит до 50% дополнительного урона. При максимальной ярости Берсерк также может впасть в неистовство, получая всплеск защиты и удерживая ярость, пока у него остается щит. Защита растёт с уровнем брони Берсерка, и сильно поднимается, если у него мало ОЗ. Берсерку нужно время, чтобы прийти в себя после того, как он впал в неистовство.
actors.hero.herosubclass.gladiator=гладиатор
actors.hero.herosubclass.gladiator_short_desc=Успешные атаки в ближнем бою позволяют _Гладиатору_ начать комбо, которое откроет доступ к особым завершающим ударам.
actors.hero.herosubclass.gladiator_desc=Гладиатор получает одно очко комбо каждый раз, когда он совершает успешную атаку с помощью оружия ближнего боя или метательного оружия. Если Гладиатор не проводит успешную атаку в течение 5 ходов (15 ходов после убийства), его комбо сбрасывается.\n\nПо мере накопления им комбо Гладиатор открывает различные приёмы, которые гарантировано попадают в цель:\n2 очка: оттолкнуть противника, сохраняет комбо\n4 очка: нанести урон, зависящий от брони Гладиатора\n6 очков: парировать следующую атаку, сохраняет комбо\n8 очков: нанести урон цели и ближайшим противникам\n10 очков: атаковать столько раз, сколько накоплено очков комбо
actors.hero.herosubclass.battlemage=боевой маг
actors.hero.herosubclass.battlemage_short_desc=_Боевой маг_ получает бонусные эффекты, когда сражается в ближнем бою со своим посохом. Эти эффекты зависят от палочки, которой наделён его посох.
actors.hero.herosubclass.battlemage_desc=Боевой маг получает бонусный эффект всякий раз, когда он наносит удар в ближнем бою своим посохом, будто дополнительное зачарование. Эти эффекты зависят от палочки, которой наделён его посох, каждая палочка имеет свой собственный эффект. В дополнение к эффектам палочки, посох Боевого мага также получит 0,5 заряда каждый раз, когда маг бьет им вблизи
actors.hero.herosubclass.warlock=чернокнижник
actors.hero.herosubclass.warlock_short_desc=У _Чернокнижника_ есть шанс пометить врагов меткой души с помощью своих палочек. Он исцеляется всякий раз, когда наносит физический урон помеченным врагам.
actors.hero.herosubclass.warlock_desc=У Чернокнижника есть шанс пометить меткой души персонажей на которых он использует свои палочки. Шанс применить метку души и ее продолжительность увеличиваются с уровнем палочки.\n\nКогда враг помечен меткой души, Чернокнижник исцеляет 2 ОЗ за каждые 5 урона, которые он наносит им, но только при атаках из оружия ближнего боя или метательного оружия, а не из палочек!
actors.hero.herosubclass.assassin=убийца
actors.hero.herosubclass.assassin_short_desc=_Убийца_ может подготовить смертоносный удар, пока он невидим. Чем дольше он ждет, тем мощнее будет атака.
actors.hero.herosubclass.assassin_desc=Убийца готовит свой следующий удар, когда становится невидимым. Чем дольше он готовится, тем мощнее будет его следующая атака. Подготовка длится до 9 ходов.\n\nПосле подготовки Убийца наносит дополнительный урон при следующей атаке, может подскочить к своей цели и даже может мгновенно убивать врагов, которые достаточно слабы.
actors.hero.herosubclass.freerunner=бродяга
actors.hero.herosubclass.freerunner_short_desc=_Бродяга_ накапливает импульс во время передвижения, который можно использовать для бега. Это дает ему бонусную скорость и уклонение на короткое время.
actors.hero.herosubclass.freerunner_desc=По мере того, как Бродяга движется, он накапливает импульс. Он может набрать до 10 очков импульса, пройдя 10 ходов, но быстро теряет их, если перестает двигаться. Бродяга может использовать свой импульс, чтобы побежать, по 2 хода на очко импульса.\n\nПри беге Бродяга движется с удвоенной скоростью и получает бонус к уклонению пропорционально своему уровню. Как только бег заканчивается, начинается перезарядка, не позволяющая копить импульс.
actors.hero.herosubclass.sniper=снайпер
actors.hero.herosubclass.sniper_short_desc=_Снайпер_ может пробить броню своими дальнобойными атаками. После удара метательным оружием она может применить специальную атаку с помощью своего лука.
actors.hero.herosubclass.sniper_desc=Снайпер - это мастер дальнего боя, чьи дальние атаки пробивают вражескую броню. Когда она попадает во врага метательным оружием, она ставит на них метку снайпера, которая позволяет ей активировать специальную атаку с помощью своего лука. Эта особая атака варьируется в зависимости от того, как сбалансирован её лук.\n\nНесбалансированный лук выстрелит одной стрелой, которая наносит сниженный урон, но выстреливает мгновенно. Лук, сбалансированный на скорость, выпустит залп из трех стрел, которые наносят меньший урон, но могут активировать зачарования и тратит 1 ход для выстрела. Лук, сбалансированный на урон, выстрелит снайперским выстрелом, который гарантированно попадает, наносит бонусный урон в зависимости от расстояния и требует 2 хода для выстрела.
actors.hero.herosubclass.warden=хранительница
actors.hero.herosubclass.warden_short_desc=_Хранительница_ может видеть сквозь высокую траву и получает бонусные эффекты, когда она сажает семена и топчет растения.
actors.hero.herosubclass.warden_desc=Хранительница имеет сильную связь с природой, которая даёт ей множество бонусных эффектов, связанных с травой и растениями. Она способна видеть сквозь высокую и примятую траву, как если бы это было пустое пространство.\n\nХранительница заставляет траву прорастать вокруг любого семени, которое она бросает или сажает, и получает специальные эффекты, когда вытаптывает растения. Эти специальные эффекты заменяют обычные эффекты растений, а это означает, что ни одно растение не причинит ей вреда, если она наступит на него.
actors.hero.herosubclass.champion=чемпион
actors.hero.herosubclass.champion_short_desc=_Чемпион_ может использовать сразу два оружия и накапливать заряды способностей. Для обычных ударов будет использовано основное оружие, но она может использовать способность каждого или сменить оружия в любой момент.
actors.hero.herosubclass.champion_desc=Чемпион — мастер рукопашных оружий. Она может экипировать дополнительное оружие вдобавок к основному. Для обычных ударов будет использовано основное оружие, но она может мгновенно сменить его на дополнительное.\n\nЕё максимальное количество зарядов увеличено на 2, а скорость перезарядки на 50%.
actors.hero.herosubclass.monk=монах
actors.hero.herosubclass.monk_short_desc=_Монах_ копит энергию во время боя. Эта энергия может быть потрачена на множество уникальных способностей.
actors.hero.herosubclass.monk_desc=Монах — мастер ближнего боя. Когда она побеждает врагов, она получает энергию, которая может быть потрачена на множество защитных и полезных способностей. Эта энергия не рассеивается спустя время, но имеет предел, основанный на уровне Монаха.\n\n1 энергия: быстрое нанесение ударов кулаками\n2 энергии: фокусировка для уклонения от следующей атаки.\n3 энергии: совершить мгновенный рывок поблизости\n4 энергии: оттолкнуть противника от себя\n5 энергии: очистка эффектов и восстановление зарядов палочек и артефактов с помощью медитации
actors.hero.herosubclass.priest=жрец
actors.hero.herosubclass.priest_short_desc=_Жрец_ получает новые дальнобойные заклинания и усиленную версию Путеводного света.
actors.hero.herosubclass.priest_desc=Жрец получает различные новые и улучшенные заклинания, которые сосредоточены на дальнем бою и синергии с магическими предметами.\n\nЖрец может бесплатно использовать _Путеводный свет_ раз в 50 ходов, освещать врагов, на которых направлено любое из его заклинаний, и поглощать негативное освещение с помощью союзников, палочек и некоторых артефактов для дополнительного урона равного его уровню + 5.\n\nКроме того, он получает заклинание _Сияние_, которое развеивает тьму и воздействует на всех видимых противников, активируя и нанося освещение, и на короткое время оглушая их за счет 2 зарядов.
actors.hero.herosubclass.paladin=паладин
actors.hero.herosubclass.paladin_short_desc=_Паладин_ получает новые заклинания ближнего действия и усиленные версии священного оружия и оберега.
actors.hero.herosubclass.paladin_desc=Паладин имеет разнообразие новых заклинаний, которые улучшают его способности в ближнем бою и имеют синергию с его оружием и бронёй. \n\nЗаклинания _Священное оружие_ и _Священный оберег_ дают больше бонусов для Паладина, больше не замещают уже существующие чары и руны, а также продлевают своё действие при сотворении других заклинаний. \n\nПаладин также имеет заклинание _Божественная Кара_, которое позволяет ему увеличивать мощность чар и с большим уроном гарантированно попадать по противнику.

##talents
actors.hero.talent$provokedangertracker.name=провокация
actors.hero.talent$provokedangertracker.desc=Воин недавно лишился своего щита, следующая физическая атака нанесет дополнительный урон.\n\nХодов до окончания эффекта: %s.
actors.hero.talent$lingeringmagictracker.name=подспудная магия
actors.hero.talent$lingeringmagictracker.desc=Маг недавно использовал палочку или посох, поэтому его следующая физическая атака нанесет дополнительный урон.\n\nХодов до окончания эффекта: %s.
actors.hero.talent$followupstriketracker.name=добивающий удар
actors.hero.talent$followupstriketracker.desc=Охотница только что атаковала врага метательным оружием, поэтому урон следующей физической атаки против той же цели повышен.\n\nХодов осталось: %s.
actors.hero.talent$patientstriketracker.name=выжидающий удар
actors.hero.talent$patientstriketracker.desc=Дуэлянт выждала один ход, поэтому следующая физическая атака нанесёт больше урона.
actors.hero.talent$improvisedprojectilecooldown.name=перезарядка импровизированных снарядов
actors.hero.talent$improvisedprojectilecooldown.desc=Вы недавно использовали этот талант и должны подождать, прежде чем использовать его снова.\n\nХодов осталось: %s.
actors.hero.talent$rejuvenatingstepscooldown.name=перезарядка восстанавливающих шагов
actors.hero.talent$rejuvenatingstepscooldown.desc=Вы недавно использовали этот талант и должны подождать, прежде чем использовать его снова.\n\nХодов осталось: %s.
actors.hero.talent$seershotcooldown.name=перезарядка всевидящего выстрела
actors.hero.talent$seershotcooldown.desc=Вы недавно использовали этот талант и должны подождать, прежде чем использовать его снова.\n\nХодов осталось: %s.
actors.hero.talent$aggressivebarriercooldown.name=перезарядка отчаянного барьера
actors.hero.talent$aggressivebarriercooldown.desc=Вы недавно использовали этот талант и должны подождать, прежде чем использовать его снова.\n\nХодов осталось: %s.
actors.hero.talent$liquidagilacctracker.name=жидкая гибкость
actors.hero.talent$liquidagilacctracker.desc=Следующая обычная атака Дуэлянта получит бонус к точности.\n\nХодов осталось: %s.
actors.hero.talent$lethalhastecooldown.name=перезарядка смертельной спешки
actors.hero.talent$lethalhastecooldown.desc=Вы недавно использовали этот талант и должны подождать, прежде чем использовать его снова.\n\nХодов осталось: %s.
actors.hero.talent$swiftequipcooldown.name=перезарядка быстрой экипировки
actors.hero.talent$swiftequipcooldown.desc=Вы недавно использовали этот талант и должны подождать, прежде чем использовать его снова.\n\nХодов осталось: %s.
actors.hero.talent$preciseassaulttracker.name=расчётливое нападение
actors.hero.talent$preciseassaulttracker.desc=Следующая обычная атака Дуэлянта получит бонус к точности.\n\nХодов осталось: %s.
actors.hero.talent$deadlyfollowuptracker.name=смертельное добивание
actors.hero.talent$deadlyfollowuptracker.desc=Дуэлянт только что атаковала метательным оружием, поэтому урон от физических атак по той же цели повышен.\n\nХодов осталось: %s.
actors.hero.talent$combinedlethalityabilitytracker.executed=добит
actors.hero.talent$satiatedspellstracker.name=Щитовое Заклинание
actors.hero.talent$satiatedspellstracker.desc=Следующее заклинание, которое Клирик использует, дарует ему небольшое количество защиты.
actors.hero.talent$searinglightcooldown.name=слепящий свет
actors.hero.talent$searinglightcooldown.desc=Вы недавно использовали этот талант и должны подождать, прежде чем использовать его снова.\n\nХодов осталось: %s.

#warrior
actors.hero.talent.hearty_meal.title=ешь на здоровье
actors.hero.talent.hearty_meal.desc=_+1:_ Перекус восстанавливает Воину _4 ОЗ_, когда его здоровье равно или ниже 33%.\n\n_+2:_ Перекус восстанавливает Воину _6 ОЗ_, когда его здоровье равно или ниже 33%.
actors.hero.talent.veterans_intuition.title=интуиция ветерана
actors.hero.talent.veterans_intuition.desc=_+1:_ Воин опознаёт оружия в _1.75 раз_ быстрее и броню в _2.5 раза_ быстрее.\n\n_+2:_ Воин опознаёт оружия в _2.5 раз_ быстрее и броню, _когда надевает её_.
actors.hero.talent.provoked_anger.title=провокатор
actors.hero.talent.provoked_anger.desc=_+1:_ Когда любой эффект щита, наложенный на Воина, разрушается, его следующая физическая атака нанесет _дополнительные 3 урона_.\n\n_+2:_ Когда любой эффект щита, наложенный на Воина, разрушается, его следующая физическая атака нанесет _дополнительные 5 урона_.
actors.hero.talent.iron_will.title=Стальная воля
actors.hero.talent.iron_will.desc=_+1:_ Щит, предоставляемый печатью Воина, _увеличивается на 1_.\n\n_+2:_ Щит, предоставляемый печатью Воина, _увеличивается на 2_.
actors.hero.talent.iron_will.meta_desc=_Если этот талант получен другим героем_, вместо этого он пассивно даёт вариант эффекта печати Воина в 1 или 2 щита.

actors.hero.talent.iron_stomach.title=Железный желудок
actors.hero.talent.iron_stomach.desc=_+1:_ Перекус занимает у Воина 1 ход и даёт ему _75% сопротивления урону_, пока он ест.\n\n_+2:_ Перекус занимает у Воина 1 ход и даёт ему _100% сопротивления урону_, пока он ест.
actors.hero.talent.liquid_willpower.title=жидкая сила воли
actors.hero.talent.liquid_willpower.desc=_+1:_ Воин мгновенно получает _6.5% от его макисмального здоровья в виде щита_, когда выпивает или кидает зелье, экстракт или эликсир.\n\n_+12_ Воин мгновенно получает _10% от его макисмального здоровья в виде щита_, когда выпивает или кидает зелье, экстракт или эликсир.\n\nЭффект восстановления щита удваивается после использования зелий силы, опыта или алхимических предметов, изготовленных из них.\n\nДля алхимических предметов, которые создаются сразу в большом количестве (например, Экстракт Водянистости), у этого таланта есть определённый шанс сработать, зависящий от количества получаемых предметов.
actors.hero.talent.runic_transference.title=Перенос рун
actors.hero.talent.runic_transference.desc=_+1:_ Сломанная печать Воина может переносить _обычные руны_ так же, как и улучшение.\n\n_+2:_ Сломанная печать Воина может переносить _обычные, мощные и проклятые руны_ так же, как и улучшение.\n\nПечать может переносить только те руны, которые были начертаны на броню с уже прилепленной печатью.
actors.hero.talent.runic_transference.meta_desc=_Если этот талант получен другим героем_, он увеличит сопротивление рун к стиранию Свитками Улучшения. При улучшении руны могут быть стерты с 6 уровня (вместо 4) при +1 или с 7 уровня (вместо 4) при +2. Начиная с 8 уровня руна гарантированно сотрётся при улучшении предмета.
actors.hero.talent.lethal_momentum.title=Смертельный импульс
actors.hero.talent.lethal_momentum.desc=_+1:_ Когда Воин убивает врага оружием ближнего боя, его атака имеет _67% шанс_ быть мгновенной.\n\n_+2:_ Когда Воин убивает врага оружием ближнего боя, его атака имеет _100% шанс_ быть мгновенной.
actors.hero.talent.improvised_projectiles.title=Импровизированные снаряды
actors.hero.talent.improvised_projectiles.desc=_+1:_ Воин может ослепить врага на _2 хода_, кинув в него любой предмет, не являющийся метательным оружием. Талант перезаряжается 50 ходов.\n\n_+2:_ Воин может ослепить врага на _3 хода_, кинув в него любой предмет, не являющийся метательным оружием. Талант перезаряжается 50 ходов.

actors.hero.talent.hold_fast.title=Защитная стойка
actors.hero.talent.hold_fast.desc=_+1:_ Когда Воин ждёт, он получает _1-2 брони_ и замедляет спад комбо и усилений щита на _50%_ пока не двинется.\n\n_+2:_ Когда Воин ждёт, он получает _2-4 брони_ и замедляет спад комбо и усилений щита на _75%_ пока не двинется.\n\n_+3:_ Когда Воин ждёт, он получает _3-6 брони_ и замедляет спад комбо и усилений щита на _100%_ пока не двинется.
actors.hero.talent.strongman.title=Силач
actors.hero.talent.strongman.desc=_+1:_ Сила Воина_ увеличивается на 8%_, и округляется в меньшую сторону.\n\n_+2:_ Сила Воина_ увеличивается на 13%_, и округляется в меньшую сторону.\n\n_+3:_ Сила Воина_ увеличивается на 18%_, и округляется в меньшую сторону.

actors.hero.talent.endless_rage.title=бесконечная ярость
actors.hero.talent.endless_rage.desc=_+1:_ Берсерк может достигнуть максимум _116% ярости_.\n\n_+2:_ Берсерк может достигнуть максимум _133% ярости_.\n\n_+3:_ Берсерк может достигнуть максимум _150% ярости_.\n\nКаждое очко ярости выше 100% увеличивает щит Берсерка на 1% и снижает время на перезарядку на 1%, но не повышает дополнительный урон выше +50%.
actors.hero.talent.deathless_fury.title=бессмертная ярость
actors.hero.talent.deathless_fury.desc=_+1:_ Неистовство включается автоматически, когда Берсерк вот-вот погибнет, а ярость находится на уровне 100% или больше, но перезарядка составляет _3 уровня героя_, когда это происходит.\n\n_+2:_ Неистовство включается автоматически, когда Берсерк вот-вот погибнет, а ярость находится на уровне 100% или больше, но перезарядка составляет _2 уровня героя_, когда это происходит.\n\n_+3:_ Неистовство включается автоматически, когда Берсерк вот-вот погибнет, а ярость находится на уровне 100% или больше, но перезарядка составляет _1 уровень героя_, когда это происходит.\n\nОбратите внимание, что Берсерк все равно погибнет, если в конце неистовства у него будет 0 ОЗ.
actors.hero.talent.enraged_catalyst.title=катализатор ярости
actors.hero.talent.enraged_catalyst.desc=_+1:_ Зачарования и проклятия на оружии Берсерка активируются тем чаще, чем больше его ярость, вплоть до _15%_ при 100% ярости.\n\n_+2:_ Зачарования и проклятия на оружии Берсерка активируются тем чаще, чем больше его ярость, вплоть до _30%_ при 100% ярости.\n\n_+3:_ Зачарования и проклятия на оружии Берсерка активируются тем чаще, чем больше его ярость, вплоть до _45%_ при 100% ярости.

actors.hero.talent.cleave.title=Черепная реакция
actors.hero.talent.cleave.desc=_+1:_ Когда Гладиатор убивает врага, перезарядка комбо до следующего удара увеличивается до _30 ходов_, вместо 15.\n\n_+2:_ Когда Гладиатор убивает врага, перезарядка комбо до следующего удара увеличивается до _45 ходов_, вместо 15.\n\n_+3:_ Когда Гладиатор убивает врага, перезарядка комбо до следующего удара увеличивается до _60 ходов_, вместо 15.
actors.hero.talent.lethal_defense.title=Летальная защита
actors.hero.talent.lethal_defense.desc=_+1:_ Когда Гладиатор убивает врага комбо-приёмом, перезарядка щита сломанной печати _уменьшается на 50 ходов_.\n\n_+2:_ Когда Гладиатор убивает врага комбо-приёмом, перезарядка щита сломанной печати _уменьшается на 100 ходов_.\n\n_+3:_ Когда Гладиатор убивает врага комбо-приёмом, перезарядка щита сломанной печати _уменьшается на 150 ходов_.\n\nЭтот талант может уменьшить перезарядку щита вплоть до -150 ходов, что означает, что он будет готов вновь сразу после активации.
actors.hero.talent.enhanced_combo.title=Улучшенное комбо
actors.hero.talent.enhanced_combo.desc=_+1:_ Когда комбо Гладиатора 7 или выше, увеличивает расстояние отталкивания Тарана на 3, Таран накладывает головокружение и может столкнуть врага в яму.\n\n_+2:_ Вдобавок к бонусам от +1. когда комбо Гладиатора 9 и выше, Парирование работает на нескольких атаках.\n\n_+3:_ Вдобавок к бонусам от +1 и +2, Гладиатор может прыгать на расстояние вплоть до комбо/3, когда использует Натиск, Обрушение, или Неистовство.

actors.hero.talent.body_slam.title=твёрдая посадка
actors.hero.talent.body_slam.desc=_+1:_ Когда Воин приземляется после прыжка, все соседние враги получают урон, равный _1-4 плюс 25%_ урона, равного защитной силе брони.\n\n_+2:_ Когда Воин приземляется после прыжка, все соседние враги получают урон, равный _2-8 плюс 50%_ урона, равного защитной силе брони.\n\n_+3:_ Когда Воин приземляется после прыжка, все соседние враги получают урон, равный _3-12 плюс 75%_ урона, равного защитной силе брони.\n\n_+4:_ Когда Воин приземляется после прыжка, все соседние враги получают урон, равный _4-16 плюс 100%_ урона, равного защитной силе брони.
actors.hero.talent.impact_wave.title=ударная волна
actors.hero.talent.impact_wave.desc=_+1:_ Когда Воин приземляется после прыжка, все соседние враги отбрасываются на _2 клетки_ назад и имеют _25% шанс_ получить уязвимость на 5 хода.\n\n_+2:_ Когда Воин приземляется после прыжка, все соседние враги отбрасываются на _3 клетки_ назад и имеют _50% шанс_ получить уязвимость на 5 хода.\n\n_+3:_ Когда Воин приземляется после прыжка, все соседние враги отбрасываются на _4 клетки_ назад и имеют _75% шанс_ получить уязвимость на 5 хода.\n\n_+4:_ Когда Воин приземляется после прыжка, все соседние враги отбрасываются на _5 клеток_ назад и имеют _100% шанс_ получить уязвимость на 5 хода.
actors.hero.talent.double_jump.title=двойной прыжок
actors.hero.talent.double_jump.desc=_+1:_ Если Воин выполняет второй прыжок в течение 3 ходов после первого, стоимость этого прыжка _снижается на 16%_.\n\n_+2:_ Если Воин выполняет второй прыжок в течение 3 ходов после первого, стоимость этого прыжка _снижается на 30%_.\n\n_+3:_ Если Воин выполняет второй прыжок в течение 3 ходов после первого, стоимость этого прыжка _снижается на 40%_.\n\n_+4:_ Если Воин выполняет второй прыжок в течение 3 ходов после первого, стоимость этого прыжка _снижается на 50%_.

actors.hero.talent.expanding_wave.title=увеличивающаяся волна
actors.hero.talent.expanding_wave.desc=_+1:_ Диапазон ударной волны увеличен до _6 клеток_ с 5, а её ширина увеличена до _75 градусов_ с 60.\n\n_+2:_ Диапазон ударной волны увеличен до _7 клеток_ с 5, а её ширина увеличена до _90 градусов_ с 60.\n\n_+3:_ Диапазон ударной волны увеличен до _8 клеток_ с 5, а её ширина увеличена до _105 градусов_ с 60.\n\n_+4:_ Диапазон ударной волны увеличен до _9 клеток_ с 5, а её ширина увеличена до _120 градусов_ с 60.
actors.hero.talent.striking_wave.title=ударная волна
actors.hero.talent.striking_wave.desc=_+1:_ Ударная волна также имеет _шанс 30%_ применить эффекты атаки, такие как чары и комбо.\n\n_+2:_ Ударная волна также имеет _шанс 60%_ применить эффекты, такие как чары и комбо.\n\n_+3:_ Ударная волна также имеет _шанс 90%_ применить эффекты, такие как чары и комбо.\n\n_+4:_ Ударная волна также имеет _шанс 100%_ применить эффекты, такие как чары и комбо, а также усиливает чары на _20%_.
actors.hero.talent.shock_force.title=ударная сила
actors.hero.talent.shock_force.desc=_+1:_ Ударная волна наносит _на 20% больше_ урона и имеет _шанс 25%_ оглушить, а не наложить хромоту.\n\n_+2:_ Ударная волна наносит _на 40% больше_ урона и имеет _шанс 50%_ оглушить, а не наложить хромоту.\n\n_+3:_ Ударная волна наносит _на 60% больше_ урона и имеет _шанс 75%_ оглушить, а не наложить хромоту.\n\n_+4:_ Ударная волна наносит _на 80% больше_ урона и имеет _шанс 100%_ оглушить, а не наложить хромоту.

actors.hero.talent.sustained_retribution.title=устойчивое возмездие
actors.hero.talent.sustained_retribution.desc=_+1:_ Воин наносит _115% бонусного урона_ распределенного между _2 ударами_, вместо 100% за 1 удар.\n\n_+2:_ Воин наносит _130% бонусного урона_ распределенного между _3 ударами_, вместо 100% за 1 удар.\n\n_+3:_ Воин наносит _145% бонусного урона_ распределенного между _4 ударами_, вместо 100% за 1 удар.\n\n_+4:_ Воин наносит _160% бонусного урона_ распределенного между _5 ударов_, вместо 100% за 1 удар.
actors.hero.talent.shrug_it_off.title=не обращая внимания
actors.hero.talent.shrug_it_off.desc=_+1:_ Сопротивление урону Воина во время выжидания _увеличивается до 60%_, вместо 50%.\n\n_+2:_ Сопротивление урону Воина во время выжидания _увеличивается до 68%_, вместо 50%.\n\n_+3:_ Сопротивление урону Воина во время выжидания _увеличивается до 74%_, вместо 50%.\n\n_+4:_ Сопротивление урону Воина во время выжидания _увеличивается до 80%_, вместо 50%.
actors.hero.talent.even_the_odds.title=уравнение шансов
actors.hero.talent.even_the_odds.desc=_+1:_ Воин наносит дополнительные _5% бонусного урона_ за каждого врага в пределах 2 клеток по окончании выжидания.\n\n_+2:_ Воин наносит дополнительные _10% бонусного урона_ за каждого врага в пределах 2 клеток по окончании выжидания.\n\n_+3:_ Воин наносит дополнительные _15% бонусного урона_ за каждого врага в пределах 2 клеток по окончании выжидания.\n\n_+4:_ Воин наносит дополнительные _20% бонусного урона_ за каждого врага в пределах 2 клеток по окончании выжидания.

#mage
actors.hero.talent.empowering_meal.title=Тонизирующий обед
actors.hero.talent.empowering_meal.desc=_+1:_ Еда дарует Магу _2 дополнительных единицы урона_ на следующие 3 раза, когда урон наносится палочкой.\n\n_+2:_ Еда дарует Магу _3 дополнительных единицы урона_ на следующие 3 раза, когда урон наносится палочкой.
actors.hero.talent.scholars_intuition.title=Интуиция знатока
actors.hero.talent.scholars_intuition.desc=_+1:_ Маг опознаёт палочки в _3 раза быстрее_.\n\n_+2:_ Маг опознаёт палочки _при первом использовании_.
actors.hero.talent.lingering_magic.title=подспудная магия
actors.hero.talent.lingering_magic.desc=_+1:_ Когда Маг использует магию палочки или посоха, его следующая физическая атака нанесет _дополнительные 1-2 урона_.\n\n_+2:_ Когда Маг использует магию палочки или посоха, его следующая физическая атака нанесет _дополнительные 2 урона_.
actors.hero.talent.backup_barrier.title=Резервный барьер
actors.hero.talent.backup_barrier.desc=_+1:_ Маг получает _3 заряда щита_, когда тратит последний заряд своего посоха.\n\n_+2:_ Маг получает _5 зарядов щита_, когда тратит последний заряд своего посоха.
actors.hero.talent.backup_barrier.meta_desc=_Если этот талант получен другим героем_, вместо этого он сработает от палочки самого высокого уровня героя.

actors.hero.talent.energizing_meal.title=Возбуждающий обед
actors.hero.talent.energizing_meal.desc=_+1:_ Перекус занимает у Мага 1 ход и даёт ему _5 ходов перезарядки палочек_.\n\n_+2:_ Перекус занимает у Мага 1 ход и даёт ему _8 ходов перезарядки палочек_.
actors.hero.talent.inscribed_power.title=начертанная сила
actors.hero.talent.inscribed_power.desc=_+1:_ Когда Маг использует свиток или предмет заклинания, его следующие _2 выстрела из палочки_ получат +2 уровня.\n\n_+2:_ Когда Маг использует свиток или предмет заклинания, его следующие _3 выстрела из палочки_ получат +2 уровня.\n\nКоличество улучшенных выстрелов палочки удваиваются после использования свитка улучшения и превращения, а так же всех алхимических предметов на их основе.\n\nДля алхимических предметов, которые создаются сразу в большом количестве (например, большинство заклинаний), у этого таланта есть определённый шанс сработать, зависящий от количества получаемых предметов.
actors.hero.talent.wand_preservation.title=Сохранение палочки
actors.hero.talent.wand_preservation.desc=_+1:_ Когда Маг сливает новую палочку со своим посохом, то предыдущая возвращается как +0, _но только 1 раз._\n\n_+2:_ Когда Маг сливает новую палочку со своим посохом, то предыдущая возвращается как +0, _и это можно повторить с промежутком в 1 уровень героя._
actors.hero.talent.wand_preservation.meta_desc=_Если этот талант получен другим героем_, вместо этого он увеличит количество магической смолы, получаемой из каждой палочки в алхимическом котле, на 1 при уровне таланта +1 или на 2 при +2.
actors.hero.talent.arcane_vision.title=Магическое зрение
actors.hero.talent.arcane_vision.desc=_+1:_ Всякий раз, когда Маг попадает по врагу из палочки, этот враг становится виден Магу Ментальным зрением следующие _10 ходов_.\n\n_+2:_ Всякий раз, когда Маг попадает по врагу из палочки, этот враг становится виден Магу Ментальным зрением следующие _15 ходов_.
actors.hero.talent.shield_battery.title=Защитная батарея
actors.hero.talent.shield_battery.desc=_+1:_ Маг может нацелиться на себя палочкой, чтобы преобразовать её заряды в щит величиной _4% от максимального ОЗ за заряд_.\n\n_+2:_ Маг может нацелиться на себя палочкой, чтобы преобразовать её заряды в щит величиной _6% от максимального ОЗ за заряд_.

actors.hero.talent.desperate_power.title=отчаянная сила
actors.hero.talent.desperate_power.desc=_+1:_ Палочки и посох Мага получают _+1 уровень_ во время выстрела последним зарядом.\n\n_+2:_ Палочки и посох Мага получают _+2 уровня_ во время выстрела последним зарядом.\n\n_+3:_ Палочки и посох Мага получают _+3 уровня_ во время выстрела последним зарядом.
actors.hero.talent.ally_warp.title=Рокировка
actors.hero.talent.ally_warp.desc=_+1:_ Маг может выбрать союзника, чтобы моментально поменяться с ним местами на расстоянии до _2-х клеток_.\n\n_+2:_ Маг может выбрать союзника, чтобы моментально поменяться с ним местами на расстоянии до _4-х клеток_.\n\n_+3:_ Маг может выбрать союзника, чтобы моментально поменяться с ним местами на расстоянии до _6-ти клеток_.\n\nМаг не может поменяться местами со неподвижным союзником.

actors.hero.talent.empowered_strike.title=Усиленный удар
actors.hero.talent.empowered_strike.desc=_+1:_ Ближняя атака посохом Боевого мага после выстрела им нанесёт _+16% урона_ и накладывает бонусный эффект на _+50% силу_ посоха.\n\n_+2:_ Ближняя атака посохом Боевого мага после выстрела им нанесёт _+33% урона_ и накладывает бонусный эффект на _+100% силу_ посоха.\n\n_+3:_ Ближняя атака посохом Боевого мага после выстрела им нанесёт _+50% урона_ и накладывает бонусный эффект на _+150% силу_ посоха.
actors.hero.talent.mystical_charge.title=Мистический заряд
actors.hero.talent.mystical_charge.desc=_+1:_ Удар посохом дает Боевому магу _0.5 ходов_ перезарядки артефакта.\n\n_+2:_ Удар посохом дает Боевому магу _1 ход_ перезарядки артефакта.\n\n_+3:_ Удар посохом дает Боевому магу _1.5 хода_ перезарядки артефакта.
actors.hero.talent.excess_charge.title=Избыточный заряд
actors.hero.talent.excess_charge.desc=_+1:_ Когда посох Боевого мага полностью заряжен, его следующее использование дает владельцу _0.67 щита_ за уровень посоха.\n\n_+2:_ Когда посох Боевого мага полностью заряжен, его следующее использование дает владельцу _1.33 щита_ за уровень посоха.\n\n_+3:_ Когда посох Боевого мага полностью заряжен, его следующее использование дает владельцу _2 щита_ за уровень посоха.

actors.hero.talent.soul_siphon.title=Переносчики порчи
actors.hero.talent.soul_siphon.desc=_+1:_ Физический урон, нанесённый другими персонажами, способен активировать метку души Чернокнижника с _эффективностью 13%_.\n\n_+2:_ Физический урон, нанесённый другими персонажами, способен активировать метку души Чернокнижника с _эффективностью 27%_.\n\n_+3:_ Физический урон, нанесённый другими персонажами, способен активировать метку души Чернокнижника с _эффективностью 40%_.
actors.hero.talent.soul_eater.title=Пожиратель душ
actors.hero.talent.soul_eater.desc=_+1:_ Метка души дает _0.33 хода_ насыщения за каждый нанесенный физический урон. Враги отмеченные меткой души имеют _шанс 10%_ вызвать эффекты насыщения, когда они умирают.\n\n_+2:_ Метка души дает _0.67 хода_ насыщения за каждый нанесенный физический урон. Враги отмеченные меткой души имеют _шанс 20%_ вызвать эффекты насыщения, когда они умирают.\n\n_+3:_ Метка души дает _1 ход_ насыщения за каждый нанесенный физический урон. Враги отмеченные меткой души имеют _шанс 30%_ вызвать эффекты насыщения, когда они умирают.
actors.hero.talent.necromancers_minions.title=Миньоны некроманта
actors.hero.talent.necromancers_minions.desc=_+1:_ Когда враг с меткой души умирает, Чернокнижник имеет _шанс 13%_ воскресить врага в виде призрака с порчей.\n\n_+2:_ Когда враг с меткой души умирает, Чернокнижник имеет _шанс 27%_ воскресить врага в виде призрака с порчей.\n\n_+3:_ Когда враг с меткой души умирает, Чернокнижник имеет _шанс 40%_ воскресить врага в виде призрака с порчей.

actors.hero.talent.blast_radius.title=радиус взрыва
actors.hero.talent.blast_radius.desc=_+1:_ Радиус стихийного взрыва увеличен с 4 до _5 клеток_.\n\n_+2:_ Радиус стихийного взрыва увеличен с 4 до _6 клеток_.\n\n_+3:_ Радиус стихийного взрыва увеличен с 4 до _7 клеток_.\n\n_+4:_ Радиус стихийного взрыва увеличен с 4 до _8 клеток_.
actors.hero.talent.elemental_power.title=сила стихии
actors.hero.talent.elemental_power.desc=_+1:_ Сила стихийного взрыва увеличивается на _25%_.\n\n_+2:_ Сила стихийного взрыва увеличивается на _50%_.\n\n_+3:_ Сила стихийного взрыва увеличивается на _75%_.\n\n_+4:_ Сила стихийного взрыва увеличивается на _100%_.
actors.hero.talent.reactive_barrier.title=реактивный барьер
actors.hero.talent.reactive_barrier.desc=_+1:_ Маг получает _2.5 защиты_ за каждого персонажа, пострадавшего от стихийного взрыва, максимум до 5 персонажей.\n\n_+2:_ Маг получает _5 защиты_ за каждого персонажа, пострадавшего от стихийного взрыва, максимум до 6 персонажей.\n\n_+3:_ Маг получает _7.5 защиты_ за каждого персонажа, пострадавшего от стихийного взрыва, максимум до 7 персонажей.\n\n_+4:_ Маг получает _10 защиты_ за каждого персонажа, пострадавшего от стихийного взрыва, максимум до 8 персонажей.

actors.hero.talent.wild_power.title=дикая сила
actors.hero.talent.wild_power.desc=_+1:_ При использовании дикой магии палочки будут улучшены на _2 или 3, до +4_.\n\n_+2:_ При использовании дикой магии палочки будут улучшены на _3, до +5_.\n\n_+3:_ При использовании дикой магии палочки будут улучшены на _3 или 4, до +6_.\n\n_+4:_ При использовании дикой магии палочки будут улучшены на _4, до +7_.
actors.hero.talent.fire_everything.title=огонь из всех орудий
actors.hero.talent.fire_everything.desc=_+1:_ Дикая магия теперь срабатывает _5 раз_ вместо 4 и у каждой палочки есть _шанс 25%_ использовать её 3 раза.\n\n_+2:_ Дикая магия теперь срабатывает _6 раз_ вместо 4 и у каждой палочки есть _шанс 50%_ использовать её 3 раза.\n\n_+3:_ Дикая магия теперь срабатывает _7 раз_ вместо 4 и у каждой палочки есть _шанс 75%_ использовать её 3 раза.\n\n_+4:_ Дикая магия теперь срабатывает _8 раз_ вместо 4 и у каждой палочки есть _шанс 100%_ использовать её 3 раза.
actors.hero.talent.conserved_magic.title=сохранённая магия
actors.hero.talent.conserved_magic.desc=_+1:_ Каждый выстрел дикой магии теперь использует _0.33 зарядов_ вместо 0.5 и имеет _25% шанс_ не потратить ход.\n\n_+2:_ Каждый выстрел дикой магии теперь использует _0.225 зарядов_ вместо 0.5 и имеет _шанс 50%_ не потратить ход.\n\n_+3:_ Каждый выстрел дикой магии теперь использует _0.15 зарядов_ вместо 0.5 и имеет _шанс 75%_ не потратить ход.\n\n_+4:_ Каждый выстрел дикой магии теперь использует _0.1 зарядов_ вместо 0.5 и имеет _шанс 100%_ не потратить ход.

actors.hero.talent.telefrag.title=Телепорт-урон
actors.hero.talent.telefrag.desc=_+1:_ Если Маг телепортируется в другого персонажа, он наносит ему _10-15 урона_, но также получает _5 урона_.\n\n_+2:_ Если Маг телепортируется в другого персонажа, он наносит ему _20-30 урона_, но также получает _10 урона_.\n\n_+3:_ Если Маг телепортируется в другого персонажа, он наносит ему _30-45 урона_, но также получает _15 урона_.\n\n_+4:_ Если Маг телепортируется в другого персонажа, он наносит ему _40-60 урона_, но также получает _20 урона_.\n\nГерой не может быть убит этим талантом, урон может быть уменьшен эффектами сопротивления магии.
actors.hero.talent.remote_beacon.title=Дистанционный Маяк
actors.hero.talent.remote_beacon.desc=_+1:_ Маг может разместить маяк в любом месте в пределах _4 клеток_.\n\n_+2:_ Маг может разместить маяк в любом месте в пределах _8 клеток_.\n\n_+3:_ Маг может разместить маяк в любом месте в пределах _12 клеток_.\n\n_+4:_ Маг может разместить маяк в любом месте в пределах _16 клеток_.\n\nМаг не может размещать маяки в недоступных местах
actors.hero.talent.longrange_warp.title=Перенос дальнего действия
actors.hero.talent.longrange_warp.desc=_+1:_ Теперь Маг может перемещаться между этажами за плату в размере _150% заряда_.\n\n_+2:_ Теперь Маг может перемещаться между этажами за плату в размере _117% заряда_.\n\n_+3:_ Теперь Маг может перемещаться между этажами за плату в размере _83% заряда_.\n\n_+4:_ Теперь Маг может перемещаться между этажами за плату в размере _50% заряда_.\n\nМаг не может использовать перенос дальнего действия, чтобы покинуть запертый этаж.

#rogue
actors.hero.talent.cached_rations.title=Спрятанные пайки
actors.hero.talent.cached_rations.desc=_+1:_ Разбойник может найти _2 урезанных пайка_ в сундуках, пока он исследует ранние этапы подземелья.\n\n_+2:_ Разбойник может найти _3 урезанных пайков_ в сундуках, пока он исследует ранние этапы подземелья.\n\nУрезанные пайки можно съесть быстрее обычных рационов. Также они умеренно утоляют голод, восстанавливают 5 ОЗ и добавляют 1 заряд Плаща Теней.
actors.hero.talent.thiefs_intuition.title=Интуиция вора
actors.hero.talent.thiefs_intuition.desc=_+1:_ Разбойник опознаёт кольца в _2 раза быстрее_, и опознаёт тип кольца, _когда надевает его_.\n\n_+2:_ Разбойник опознаёт кольца, _когда он их экипирует_, и опознаёт тип кольца, _когда подбирает его_.
actors.hero.talent.sucker_punch.title=Удар исподтишка
actors.hero.talent.sucker_punch.desc=_+1:_ Разбойник наносит _1-2 бонусных урона_ при первой неожиданной атаке врага.\n\n_+2:_ Разбойник наносит _2 бонусных урона_ при первой неожиданной атаке врага.
actors.hero.talent.protective_shadows.title=Защитные тени
actors.hero.talent.protective_shadows.desc=_+1:_ Разбойник получает один заряд щита _каждый второй ход_, пока он невидим, _вплоть до 3_.\n\n_+2:_ Разбойник получает один заряд щита _каждый второй ход_, пока он невидим, _вплоть до 5_.

actors.hero.talent.mystical_meal.title=Мистический обед
actors.hero.talent.mystical_meal.desc=_+1:_ Перекус занимает у Разбойника 1 ход (урезанные пайки съедаются мгновенно), и даёт ему _перезарядку артефактов на 3 хода_.\n\n_+2:_ Перекус занимает у Разбойника 1 ход (урезанные пайки съедаются мгновенно) и даёт ему _перезарядку артефактов на 5 ходов_.\n\nЭтот талант не позволяет рогу изобилия перезаряжать самого себя
actors.hero.talent.inscribed_stealth.title=начертанная скрытность
actors.hero.talent.inscribed_stealth.desc=_+1:_ После использования свитка или предмета заклинания, Разбойник получает _3 хода_ невидимости.\n\n_+2:_ После использования свитка или предмета заклинания, Разбойник получает _5 ходов_ невидимости.\n\nПродолжительность невидимости удваивается после использования свитка улучшения, превращения, зачарования, метаморфозы или алхимических предметов, изготовленных из них.\n\nДля алхимических предметов, которые создаются сразу в большом количестве (например, большинство заклинаний), у этого таланта есть определённый шанс сработать, зависящий от количества получаемых предметов.
actors.hero.talent.wide_search.title=Широкий поиск
actors.hero.talent.wide_search.desc=_+1:_ Радиус поиска Разбойника изменен с квадрата 5x5 на _круг 7x7_. \n\n_+2:_ Радиус поиска Разбойника изменен с квадрата 5x5 на _квадрат 7x7_.
actors.hero.talent.wide_search.meta_desc=_Если этот талант получен другим героем_, вместо этого он увеличивает его радиус поиска с квадрата 3x3 до круга 5x5 при +1 или квадрата 5x5 при +2.
actors.hero.talent.silent_steps.title=Бесшумные шаги
actors.hero.talent.silent_steps.desc=_+1:_ Разбойник не разбудит спящих врагов, пока он на расстоянии _3 или более клеток от них_.\n\n_+2:_ Разбойник не разбудит спящих врагов, пока _не подойдёт вплотную к ним_.
actors.hero.talent.rogues_foresight.title=Разбойничья чуйка
actors.hero.talent.rogues_foresight.desc=_+1:_ Когда Разбойник впервые спускается на этаж с секретной комнатой, у него есть _75% шанс почувствовать это_.\n\n_+2:_ Когда Разбойник впервые спускается на этаж с секретной комнатой, у него есть _100% шанс почувствовать это_.

actors.hero.talent.light_cloak.title=Лёгкий плащ
actors.hero.talent.light_cloak.desc=_+1:_ Разбойник может использовать Плащ Теней, не экипировав его, но будучи неэкипированным он перезаряжается со _скоростью 25%_.\n\n_+2:_ Разбойник может использовать Плащ Теней, не экипировав его, но будучи неэкипированным он перезаряжается со _скоростью 50%_.\n\n_+3:_ Разбойник может использовать Плащ Теней, не экипировав его, но будучи неэкипированным он перезаряжается со _скоростью 75%_.
actors.hero.talent.light_cloak.meta_desc=_Если этот талант получен другим героем_, вместо этого он увеличит скорость зарядки всех артефактов на 7/13/20% при +1/+2/+3.
actors.hero.talent.enhanced_rings.title=Улучшенные кольца
actors.hero.talent.enhanced_rings.desc=_+1:_ Когда Разбойник использует артефакты, его кольца получают улучшение +1 на _3 ходов_. \n\n_+2:_ Когда Разбойник использует артефакты, его кольца получают улучшение +1 на _6 ходов_. \n\n_+3:_ Когда Разбойник использует артефакты, его кольца получают улучшение +1 на _9 ходов_.

actors.hero.talent.enhanced_lethality.title=Улучшенная летальность
actors.hero.talent.enhanced_lethality.desc=_+1:_ Убийца может убить врага с показателем здоровья ниже _4/13/27/67%_ за уровень готовности, вместо 3/10/20/50%.\n\n_+2:_ Убийца может убить врага с показателем здоровья ниже _5/17/33/83%_ за уровень готовности, вместо 3/10/20/50%.\n\n_+3:_ Убийца может убить врага с показателем здоровья ниже _6/20/40/100%_ за уровень готовности, вместо 3/10/20/50%.
actors.hero.talent.assassins_reach.title=Убийственный размах
actors.hero.talent.assassins_reach.desc=_+1:_ Диапазон удара Убийцы за уровень подготовки увеличен до _1/3/4/6 клеток,_ вместо 1/2/3/4.\n\n_+2:_ Диапазон удара Убийцы за уровень подготовки увеличен до _2/4/6/8 клеток_, вместо 1/2/3/4.\n\n_+3:_ Диапазон удара Убийцы за уровень подготовки увеличен до _2/5/7/10 клеток_, вместо 1/2/3/4.\n\nРывок позволяет проходить через врагов, ловушки и ямы, но не через стены.
actors.hero.talent.bounty_hunter.title=Охотник за головами
actors.hero.talent.bounty_hunter.desc=_+1:_ Когда Убийца убивает врага подготовленным ударом, шанс выпадения с него предмета увеличивается на _2/4/8/16%_, в зависимости от уровня подготовки.\n\n_+2:_ Когда Убийца убивает врага подготовленным ударом, шанс выпадения с него предмета увеличивается на _4/8/16/32%_, в зависимости от уровня подготовки.\n\n_+3:_ Когда Убийца убивает врага подготовленным ударом, шанс выпадения с него предмета увеличивается на _6/12/24/48%_, в зависимости от уровня подготовки.

actors.hero.talent.evasive_armor.title=Лёгкая броня
actors.hero.talent.evasive_armor.desc=_+1:_ Во время бега Бродяга получает _+1 уклонение_ за каждое лишнее очко силы на вашей броне.\n\n_+2:_ Во время бега Бродяга получает _+2 уклонения_ за каждое лишнее очко силы на вашей броне.\n\n_+3:_ Во время бега Бродяга получает _+3 уклонения_ за каждое лишнее очко силы на вашей броне.
actors.hero.talent.projectile_momentum.title=Инерция снаряда
actors.hero.talent.projectile_momentum.desc=_+1:_ Во время свободного бега Бродяга получает _+50% точности и +15% урона_ метательным оружием. \n\n_+2:_ Во время свободного бега Бродяга получает _+100% точности и +30% урона_ метательным оружием.\n\n_+3:_ Во время свободного бега Бродяга получает _+150% точности и +45% урона_ метательным оружием.
actors.hero.talent.speedy_stealth.title=Быстрая скрытность
actors.hero.talent.speedy_stealth.desc=_+1:_ Бродяга получает 2 стака импульса за ход, пока он невидим.\n\n_+2:_ В дополнение к преимуществам +1, время в бегу больше не считается, пока Бродяга невидим.\n\n_+3:_ В дополнение к преимуществам +1 и +2, Бродяга движется с удвоенной скоростью, пока он невидим, независимо от того, бежит он или нет.

actors.hero.talent.hasty_retreat.title=поспешное отступление
actors.hero.talent.hasty_retreat.desc=_+1:_ После скачка Разбойник получает _1 ход_ ускорения и невидимости.\n\n_+2:_ После скачка Разбойник получает _2 хода_ ускорения и невидимости.\n\n_+3:_ После скачка Разбойник получает _3 хода_ ускорения и невидимости.\n\n_+4:_ После скачка Разбойник получает _4 хода_ ускорения и невидимости.
actors.hero.talent.body_replacement.title=подмена тела
actors.hero.talent.body_replacement.desc=_+1:_ После скачка, Разбойник оставляет за собой деревянную приманку, которая имеет _20 здоровья и 1-3 брони_.\n\n_+2:_ После скачка, Разбойник оставляет за собой деревянную приманку, которая имеет _40 здоровья и 2-6 брони_.\n\n_+3:_ После скачка, Разбойник оставляет за собой деревянную приманку, которая имеет _60 здоровья и 3-9 брони_.\n\n_+4:_ После скачка, Разбойник оставляет за собой деревянную приманку, которая имеет _80 здоровья и 4-12 брони_.\n\nОдновременно может быть активна только одна приманка.
actors.hero.talent.shadow_step.title=теневой шаг
actors.hero.talent.shadow_step.desc=_+1:_ Если Разбойник использует дымовую бомбу, будучи невидимым, это происходит мгновенно и расходует на _16% меньше_ заряда, но при этом он не ослепляет врагов и не активирует другие таланты.\n\n_+2:_ Если Разбойник использует дымовую бомбу, будучи невидимым, это происходит мгновенно и расходует на _30% меньше_ заряда, но при этом он не ослепляет врагов и не активирует другие таланты.\n\n_+3:_ Если Разбойник использует дымовую бомбу, будучи невидимым, это происходит мгновенно и расходует на _41% меньше_ заряда, но при этом он не ослепляет врагов и не активирует другие таланты.\n\n_+4:_ Если Разбойник использует дымовую бомбу, будучи невидимым, это происходит мгновенно и расходует на _50% меньше_ заряда, но при этом он не ослепляет врагов и не активирует другие таланты.

actors.hero.talent.fear_the_reaper.title=страх смерти
actors.hero.talent.fear_the_reaper.desc=_+1:_ Когда здоровье врага, отмеченного меткой смерти достигает 0 ОЗ, он получает _хромоту_.\n\n_+2:_ Когда здоровье врага, отмеченного меткой смерти достигает 0 ОЗ, он получает _испуг и хромоту_.\n\n_+3:_ Когда здоровье врага, отмеченного меткой смерти достигает 0 ОЗ, он получает _испуг и хромоту_, и враги в пределах 3 клеток получают _хромоту_.\n\n_+4:_ Когда здоровье врага, отмеченного меткой смерти достигает 0 ОЗ, он получает _испуг и хромоту_, и враги в пределах 3 клеток получают _испуг и хромоту_.
actors.hero.talent.deathly_durability.title=смертельная стойкость
actors.hero.talent.deathly_durability.desc=_+1:_ Враги, убитые меткой смерти, дают Разбойнику щит, равный _13%_ от их здоровья в момент нанесения метки.\n\n_+2:_ Враги, убитые меткой смерти, дают Разбойнику щит, равный _25%_ от их здоровья в момент нанесения метки.\n\n_+3:_ Враги, убитые меткой смерти, дают Разбойнику щит, равный _38%_ от их здоровья в момент нанесения метки.\n\n_+4:_ Враги, убитые меткой смерти, дают Разбойнику щит, равный _50%_ от их здоровья в момент нанесения метки.
actors.hero.talent.double_mark.title=двойная отметка
actors.hero.talent.double_mark.desc=_+1:_ Маркировка двух целей одновременно приводит к снижению стоимости заряда на _30%_.\n\n_+2:_ Маркировка двух целей одновременно приводит к снижению стоимости заряда на _50%_.\n\n_+3:_ Маркировка двух целей одновременно приводит к снижению стоимости заряда на _65%_.\n\n_+4:_ Маркировка двух целей одновременно приводит к снижению стоимости заряда на _75%_.

actors.hero.talent.shadow_blade.title=клинок теней
actors.hero.talent.shadow_blade.desc=_+1:_ Теневой клон получает _8%_ урона героя за ход и имеет _25% шанс_ использовать зачарование, наложенное на оружие героя.\n\n_+2:_ Теневой клон получает _16%_ урона героя за ход и имеет _50% шанс_ использовать зачарование, наложенное на оружие героя.\n\n_+3:_ Теневой клон получает _24%_ урона героя за ход и имеет _75% шанс_ использовать зачарование, наложенное на оружие героя.\n\n_+4:_ Теневой клон получает _32%_ урона героя за ход и имеет _100% шанс_ использовать зачарование, наложенное на оружие героя.
actors.hero.talent.cloned_armor.title=скопированная броня
actors.hero.talent.cloned_armor.desc=_+1:_ Теневой клон получает _12%_ от значения брони героя и имеет _25% шанс_ использовать руну на броне героя.\n\n_+2:_ Теневой клон получает _24%_ от значения брони героя и имеет _50% шанс_ использовать руну на броне героя.\n\n_+3:_ Теневой клон получает _36%_ от значения брони героя и имеет _75% шанс_ использовать руну на броне героя.\n\n_+4:_ Теневой клон получает _48%_ от значения брони героя и имеет _100% шанс_ использовать руну на броне героя.
actors.hero.talent.perfect_copy.title=идеальная копия
actors.hero.talent.perfect_copy.desc=_+1:_ Теневой клон получает _10%_ от максимального ОЗ героя и может постоянно меняться с героем местами на расстоянии до _1 клетки_.\n\n_+2:_ Теневой клон получает _20%_ от максимального ОЗ героя и может постоянно меняться с героем местами на расстоянии до _2 клеток_.\n\n_+3:_ Теневой клон получает _30%_ от максимального ОЗ героя и может постоянно меняться с героем местами на расстоянии до _3 клеток_.\n\n_+4:_ Теневой клон получает _40%_ от максимального ОЗ героя и может постоянно меняться с героем местами на расстоянии до _4 клеток_.

#huntress
actors.hero.talent.natures_bounty.title=щедрость природы
actors.hero.talent.natures_bounty.desc=_+1:_ Охотница может найти _4 ягоды_ спрятанных в высокой траве, когда она исследует несколько следующих этажей подземелья.\n\n_+2:_ Охотница может найти _6 ягод_ спрятанных в высокой траве, когда она исследует несколько следующих этажей подземелья.\n\nСами ягоды съедаются быстро, восстанавливают немного сытости и иногда содержат полезные семена.
actors.hero.talent.survivalists_intuition.title=Интуиция выживальщика
actors.hero.talent.survivalists_intuition.desc=_+1:_ Охотница опознаёт метательное оружие в _3 раза быстрее_.\n\n_+2:_ Охотница опознаёт метательное оружие _при первом попадании_.
actors.hero.talent.followup_strike.title=Добивающий удар
actors.hero.talent.followup_strike.desc=_+1:_ Когда Охотница попадает во врага из своего лука или метательным оружием, ее следующая рукопашная атака против этого врага нанесёт _2 бонусных урона_. \n\n_+2:_ Когда Охотница попадает во врага из своего лука или метательным оружием, ее следующая рукопашная атака против этого врага нанесёт _3 бонусных урона_.
actors.hero.talent.natures_aid.title=Помощь природы
actors.hero.talent.natures_aid.desc=_+1:_ Охотница получает 0-2 защиты Дубовой кожи на _3 хода_, когда растение вытоптано в её поле зрения.\n\n_+2:_ Охотница получает 0-2 защиты Дубовой кожи на _5 ходов_, когда растение вытоптано в её поле зрения.

actors.hero.talent.invigorating_meal.title=Бодрящий обед
actors.hero.talent.invigorating_meal.desc=_+1:_ Перекус занимает у Охотницы 1 ход (ягоды съедаются мгновенно) и _ускоряет на 1 ход_.\n\n_+2:_ Перекус занимает у Охотницы 1 ход (ягоды съедаются мгновенно) и _ускоряет на 2 хода_.
actors.hero.talent.liquid_nature.title=жидкая природа
actors.hero.talent.liquid_nature.desc=_+1:_ Когда Охотница выпивает или кидает зелье, экстракт или эликсир, в окружающей местности прорастет _до 4 трав_, а соседние враги обездвижутся на _1 ход_.\n\n_+2:_ Когда Охотница выпивает или кидает зелье, экстракт или эликсир, в окружающей местности прорастет _до 6 трав_, а соседние враги обездвижутся на _2 хода_.\n\nКоличество травы и продолжительность обездвиживания удваиваются после использования зелий силы, опыта или алхимических предметов, изготовленных из них.\n\nДля алхимических предметов, которые создаются сразу в большом количестве (например, Экстракт Водянистости), у этого таланта есть определённый шанс сработать, зависящий от количества получаемых предметов.
actors.hero.talent.rejuvenating_steps.title=восстанавливающие шаги
actors.hero.talent.rejuvenating_steps.desc=_+1:_ Когда Охотница наступает на траву или тлеющие угли, они вырастают в высокую траву, которую Охотница сразу приминает. Талант _перезаряжается 10 ходов_.\n\n_+2:_ Когда Охотница наступает на траву или тлеющие угли, они вырастают в высокую траву, которую Охотница сразу приминает. Талант _перезаряжается 5 ходов_.\n\nЭтот талант будет производить примятую траву, если эффекты пассивной регенерации отключены или герой долгое время не набирал опыта.
actors.hero.talent.heightened_senses.title=усиленное восприятие
actors.hero.talent.heightened_senses.desc=_+1:_ Охотница получает Ментальное зрение в радиусе _2 клеток от неё_.\n\n_+2:_ Охотница получает Ментальное зрение в радиусе _3 клеток от неё_.
actors.hero.talent.durable_projectiles.title=прочные снаряды
actors.hero.talent.durable_projectiles.desc=_+1:_ Метательное оружие, используемое Охотницей, имеет _+50% к прочности_. \n\n_+2:_ Метательное оружие, используемое Охотницей, имеет _+75% к прочности_.

actors.hero.talent.point_blank.title=Cтрельба в упор
actors.hero.talent.point_blank.desc=_+1:_ Когда Охотница использует её лук или метательное оружие в ближнем бою, оно имеет _-25% точности_ вместо -50%.\n\n_+2:_ Когда Охотница использует её лук или метательное оружие в ближнем бою, оно имеет _нормальную точность_ вместо -50%.\n\n_+3:_ Когда Охотница использует её лук или метательное оружие в ближнем бою, оно имеет _+25% точности_ вместо -50%.\n\nМетательное оружие или Лук Духов всегда имеют +50% точности, когда использованы на дистанции.
actors.hero.talent.seer_shot.title=Всевидящий выстрел
actors.hero.talent.seer_shot.desc=_+1:_ Когда Охотница выпускает стрелу в землю, она открывает местность в области 3х3 вокруг нее на _5 ходов_. Талант перезаряжается 20 ходов.\n\n_+2:_ Когда Охотница выпускает стрелу в землю, она открывает местность в области 3х3 вокруг нее на _10 ходов_. Талант перезаряжается 20 ходов.\n\n_+3:_ Когда Охотница выпускает стрелу в землю, она открывает местность в области 3х3 вокруг нее на _15 ходов_. Талант перезаряжается 20 ходов.
actors.hero.talent.seer_shot.meta_desc=_Если этот талант получен другим героем_, он сработает от любого метательного оружия.

actors.hero.talent.farsight.title=Орлиный глаз
actors.hero.talent.farsight.desc=_+1:_ Дальность обзора Снайпера увеличивается _на 25%_.\n\n_+2:_ Дальность обзора Снайпера увеличивается _на 50%_.\n\n_+3:_ Дальность обзора Снайпера увеличивается _на 75%_.
actors.hero.talent.shared_enchantment.title=Общее зачарование
actors.hero.talent.shared_enchantment.desc=_+1:_ Метательное оружие имеет _шанс 33%_ активировать зачарование на луке Снайпера.\n\n_+2:_ Метательное оружие имеет _шанс 67%_ активировать зачарование на луке Снайпера.\n\n_+3:_ Метательное оружие имеет _шанс 100%_ активировать зачарование на луке Снайпера.\n\nЗачарование от лука может активироваться в дополнение к уже имеющемуся на метательном оружии.
actors.hero.talent.shared_upgrades.title=Общие улучшения
actors.hero.talent.shared_upgrades.desc=_+1:_ Когда Снайпер атакует улучшенным метательным оружием, каждый его уровень увеличивает продолжительность метки снайпера на 1 ход и урон от её специальной атаки на 16%, впредь до максимального в _2 хода и +33% к урону при +2 уровне_.\n\n_+2:_ Когда Снайпер атакует улучшенным метательным оружием, каждый его уровень увеличивает продолжительность метки снайпера на 1 ход и урон от её специальной атаки на 16%, впредь до максимального в _4 хода и +67% к урону при +4 уровне_.\n\n_+3:_ Когда Снайпер атакует улучшенным метательным оружием, каждый его уровень увеличивает продолжительность метки снайпера на 1 ход и урон от её специальной атаки на 16%, впредь до максимального в _6 ходов и +100% к урону при +6 уровне_.

actors.hero.talent.durable_tips.title=Прочные наконечники
actors.hero.talent.durable_tips.desc=_+1:_ Дротики становятся в _2 раза_ прочнее когда Хранительница использует их.\n\n_+2:_ Дротики становятся в _3 раза_ прочнее когда Хранительница использует их.\n\n_+3:_ Дротики становятся в _4 раза_ прочнее когда Хранительница использует их.
actors.hero.talent.barkskin.title=Дубовая кожа
actors.hero.talent.barkskin.desc=_+1:_ Когда Хранительница наступает на траву, она получает дубовую кожу эквивалентную _0-50% от её уровня_, которая исчезает каждый ход.\n\n_+2:_ Когда Хранительница наступает на траву, она получает дубовую кожу эквивалентную _0-100% от её уровня_, которая исчезает каждый ход.\n\n_+3:_ Когда Хранительница наступает на траву, она получает дубовую кожу эквивалентную _0-150% от её уровня_, которая исчезает каждый ход.
actors.hero.talent.shielding_dew.title=Защитная роса
actors.hero.talent.shielding_dew.desc=_+1:_ Когда здоровье Хранительницы полно, капли росы могут дать ей защиту на _20% от её максимального здоровья_.\n\n_+2:_ Когда здоровье Хранительницы полно, капли росы могут дать ей защиту на _40% от её максимального здоровья_.\n\n_+3:_ Когда здоровье Хранительницы полно, капли росы могут дать ей защиту на _60% от её максимального здоровья_.

actors.hero.talent.fan_of_blades.title=веер клинков
actors.hero.talent.fan_of_blades.desc=_+1:_ Спектральные клинки могут поразить _до 1 дополнительной цели_ на 50% урона. Цель должна быть видна и находиться в пределе конуса с углом _30 градусов_.\n\n_+2:_ Спектральные клинки могут поразить _до 2 дополнительных целей_ на 50% урона. Цели должны быть видны и находиться в пределе конуса с углом _60 градусов_.\n\n_+3:_ Спектральные клинки могут поразить _до 3 дополнительных целей_ на 50% урона. Цели должны быть видны и находиться в пределе конуса с углом _90 градусов_.\n\n_+4:_ Спектральные клинки могут поразить _до 4 дополнительных целей_ на 50% урона. Цели должны быть видны и находиться в пределе конуса с углом _120 градусов_.
actors.hero.talent.projecting_blades.title=проецирующиеся клинки
actors.hero.talent.projecting_blades.desc=_+1:_ Спектральные клинки имеют _+25% точности_ и проходят сквозь _2 сплошные клетки_.\n\n_+2:_ Спектральные клинки имеют _+50% точности_ и проходят сквозь _4 сплошные клетки_.\n\n_+3:_ Спектральные клинки имеют _+75% точности_ и проходят сквозь _6 сплошных клеток_.\n\n_+4:_ Спектральные клинки имеют _+100% точности_ и проходят сквозь _8 сплошных клеток_.
actors.hero.talent.spirit_blades.title=клинки духов
actors.hero.talent.spirit_blades.desc=_+1:_ Спектральные клинки имеют _шанс 30%_ также использовать зачарование на луке духов.\n\n_+2:_ Спектральные клинки имеют _шанс 60%_ также использовать зачарование на луке духов.\n\n_+3:_ Спектральные клинки имеют _шанс 90%_ также использовать зачарование на луке духов.\n\n_+4:_ Спектральные клинки имеют _шанс 100%_ также использовать зачарование на луке духов, а также усиливают каждое зачарование _на 10%_.

actors.hero.talent.growing_power.title=растущая мощь
actors.hero.talent.growing_power.desc=_+1:_ Атака и скорость передвижения от силы природы увеличивается до _38% и 125%_, с 33% и 100%.\n\n_+2:_ Атака и скорость передвижения от силы природы увеличивается до _42% и 150%_, с 33% и 100%.\n\n_+3:_ Атака и скорость передвижения от силы природы увеличивается до _46% и 175%_, с 33% и 100%.\n\n_+4:_ Атака и скорость передвижения от силы природы увеличивается до _50% и 200%_, с 33% и 100%.
actors.hero.talent.natures_wrath.title=гнев природы
actors.hero.talent.natures_wrath.desc=_+1:_ Пока сила природы активна, выстрелы из лука духа имеют _шанс 8%_ вызвать случайный вредный эффект растения.\n\n_+2:_ Пока сила природы активна, выстрелы из лука духа имеют _шанс 17%_ вызвать случайный вредный эффект растения.\n\n_+3:_ Пока сила природы активна, выстрелы из лука духа имеют _шанс 25%_ вызвать случайный вредный эффект растения.\n\n_+4:_ Пока сила природы активна, выстрелы из лука духа имеют _шанс 33%_ вызвать случайный вредный эффект растения.\n\nРастения, эффект которых может быть вызван: слепняк, огнецвет, ледяная лилия, грустномох и штормовая лоза.
actors.hero.talent.wild_momentum.title=дикий импульс
actors.hero.talent.wild_momentum.desc=_+1:_ Убийство врага луком духов продлевает срок действия силы природы на _1 ход_. Продолжительность может быть увеличена максимум на _2 хода_.\n\n_+2:_ Убийство врага луком духов продлевает срок действия силы природы на _2 хода_. Продолжительность может быть увеличена максимум на _4 хода_.\n\n_+3:_ Убийство врага луком духов продлевает срок действия силы природы на _3 хода_. Продолжительность может быть увеличена максимум на _6 ходов_.\n\n_+4:_ Убийство врага луком духов продлевает срок действия силы природы на _4 хода_. Продолжительность может быть увеличена максимум на _8 ходов_.

actors.hero.talent.eagle_eye.title=орлиный глаз
actors.hero.talent.eagle_eye.desc=_+1:_ Дальность обзора призрачного ястреба увеличена с 6 до _7 клеток_.\n\n_+2:_ Дальность обзора призрачного ястреба увеличена с 6 до _8 клеток_.\n\n_+3:_ Дальность обзора призрачного ястреба увеличена с 6 до _9 клеток_, и он получает ментальное зрение в радиусе _2 клеток_.\n\n_+4:_ Дальность обзора призрачного ястреба увеличена с 6 до _10 клеток_, и он получает ментальное зрение в радиусе _3 клеток_.
actors.hero.talent.go_for_the_eyes.title=целься в глаза
actors.hero.talent.go_for_the_eyes.desc=_+1:_ Атаки призрачного ястреба ослепляют врагов на _2 хода_.\n\n_+2:_ Атаки призрачного ястреба ослепляют врагов на _5 ходов_.\n\n_+3:_ Атаки призрачного ястреба ослепляют врагов на _5 ходов_ и калечат их на _2 хода_.\n\n_+4:_ Атаки призрачного ястреба ослепляют врагов на _5 ходов_ и калечат их на _5 ходов_.
actors.hero.talent.swift_spirit.title=стремительный дух
actors.hero.talent.swift_spirit.desc=_+1:_ Скорость передвижения призрачного ястреба увеличена с 2 до _2.5 клеток_, и он гарантированно уклонится от первых _2 атак_, нанесенных ему.\n\n_+2:_ Скорость передвижения призрачного ястреба увеличена с 2 до _3 клеток_, и он гарантированно уклонится от первых _4 атак_, нанесенных ему.\n\n_+3:_ Скорость передвижения призрачного ястреба увеличена с 2 до _3.5 клеток_, и он гарантированно уклонится от первых _6 атак_, нанесенных ему.\n\n_+4:_ Скорость передвижения призрачного ястреба увеличена с 2 до _4 клеток_, и он гарантированно уклонится от первых _8 атак_, нанесенных ему.

#duelist
actors.hero.talent.strengthening_meal.title=Усиляющий обед
actors.hero.talent.strengthening_meal.desc=_+1:_ Перекус даёт Дуэлянту +3 урона на её следующие _2 раза_ нанесения урона противнику физической атакой.\n\n_+2:_ Перекус даёт Дуэлянту +3 урона на её следующие _3 раза_ нанесения урона противнику физической атакой.
actors.hero.talent.adventurers_intuition.title=Интуиция приключенца
actors.hero.talent.adventurers_intuition.desc=_+1:_ Дуэлянт опознаёт оружия в _2.5 раз_ быстрее и броню в _1.75 раза_ быстрее.\n\n_+2:_ Дуэлянт опознаёт оружия, _когда экипирует их_ и броню в _2.5 раза_ быстрее.
actors.hero.talent.patient_strike.title=выжидающий удар
actors.hero.talent.patient_strike.desc=_+1:_ Если Дуэлянт ждёт перед совершением ближней атаки, она нанесёт _1-2 бонусного урона_.\n\n_+2:_ Если Дуэлянт ждёт перед совершением ближней атаки, она нанесёт _2 бонусного урона_.
actors.hero.talent.aggressive_barrier.title=отчаянный барьер
actors.hero.talent.aggressive_barrier.desc=_+1:_ Дуэлянт получает _3 единицы щита_, когда она использует способности оружия и её здоровье равно или меньше 50%.\n\n_+2:_ Дуэлянт получает _5 единицы щита_, когда она использует способности оружия и её здоровье равно или меньше 50%.
actors.hero.talent.aggressive_barrier.meta_desc=_Если этот талант получен другим героем_, то герой будет получать щит при совершении ближней атаки при низком уровне здоровья, с перезарядкой в 50 ходов.

actors.hero.talent.focused_meal.title=медитационный обед
actors.hero.talent.focused_meal.desc=_+1:_ Перекус занимает у Дуэлянта 1 ход и дает ей _0.67 заряда_ к её оружиям.\n\n_+2:_ Перекус занимает у Дуэлянта 1 ход и дает ей _1 заряд_ к её оружиям.
actors.hero.talent.focused_meal.meta_desc=_Если этот талант получен другим героем_, то герой получит бонус к урону следующей атаки равный уровню героя/3 на 1-ом уровне таланта, или уровню героя/2 на 2-ом уровне таланта.
actors.hero.talent.liquid_agility.title=жидкая гибкость
actors.hero.talent.liquid_agility.desc=_+1:_ Пока Дуэлянт выпивает или кидает зелье, экстракт или эликсир, её уклонение _увеличивается в 3 раза_, а точность _увеличивается в 3 раза_ на следующие 5 рукопашных атак.\n\n_+2:_ Пока Дуэлянт выпивает или кидает зелье, экстракт или эликсир, её уклонение _бесконечно_, а точность _бесконечна_ на следующие 5 рукопашных атак.\n\nЭти эффекты продлеваются ещё на 1 ход после использования зелий силы, опыта или алхимических предметов, изготовленных из них.\n\nДля алхимических предметов, которые создаются сразу в большом количестве (например, Экстракт Водянистости), у этого таланта есть определённый шанс сработать, зависящий от количества получаемых предметов.
actors.hero.talent.weapon_recharging.title=перезарядка оружия
actors.hero.talent.weapon_recharging.desc=_+1:_ Дуэлянт получает один заряд оружия каждые _15 ходов_, пока находится под действием перезарядки или перезарядки артефактов.\n\n_+2:_ Дуэлянт получает один заряд оружия каждые _10 ходов_, пока находится под действием перезарядки или перезарядки артефактов.
actors.hero.talent.weapon_recharging.meta_desc=_Если этот талант получен другим героем_, то под действием перезарядки герой будет наносить на 5% больше урона в ближнем бою на 1-ом уровне таланта, или на 7.5% больше на 2-ом уровне.
actors.hero.talent.lethal_haste.title=смертельная спешка
actors.hero.talent.lethal_haste.desc=_+1:_ Если Дуэлянт убивает врага при помощи способности оружия, то она получает _3 хода_ мгновенного движения.\n\n_+2:_ Если Дуэлянт убивает врага при помощи способности оружия, то она получает _5 ходов_ мгновенного движения.
actors.hero.talent.lethal_haste.meta_desc=_Если этот талант получен другим героем_, то он будет срабатывать с обычными атаками, с перезарядкой в 100 ходов.
actors.hero.talent.swift_equip.title=быстрая экипировка
actors.hero.talent.swift_equip.desc=_+1:_ Дуэлянт может моментально менять её экипированное оружие _1 раз_ каждые 20 ходов.\n\n_+2:_ Дуэлянт может моментально менять её экипированное оружие _2 раза_ каждые 20 ходов.\n\nЕсли этот талант не на перезарядке, Дуэлянт может поменять оружие из слота быстрого доступа.

actors.hero.talent.precise_assault.title=расчётливое нападение
actors.hero.talent.precise_assault.desc=_+1:_ Когда Дуэлянт использует способность оружия, она увеличивает точность следующего удара (в течение 5 ходов) в _2 раза_.\n\n_+2:_ Когда Дуэлянт использует способность оружия, она увеличивает точность следующего удара (в течение 5 ходов) в _5 раз_.\n\n_+3:_ Когда Дуэлянт использует способность оружия, точность следующего удара (в течение 5 ходов) становится _бесконечной_.
actors.hero.talent.precise_assault.meta_desc=_Если этот талант получен другим героем_, вместо этого он увеличит точность рукопашных атак героя на 10% при +1, 20% при +2, 30% при +3.
actors.hero.talent.deadly_followup.title=смертельное добивание
actors.hero.talent.deadly_followup.desc=_+1:_ Когда Дуэлянт попадает по врагу метательным оружием, она наносит ему на _10% больше урона в ближнем бою_ в течение 5 ходов.\n\n_+2:_ Когда Дуэлянт попадает по врагу метательным оружием, она наносит ему на _20% больше урона в ближнем бою_ в течение 5 ходов.\n\n_+3:_ Когда Дуэлянт попадает по врагу метательным оружием, она наносит ему на _30% больше урона в ближнем бою_ в течение 5 ходов.

actors.hero.talent.varied_charge.title=переменный заряд
actors.hero.talent.varied_charge.desc=_+1:_ Чемпион мгновенно восстанавливает _0,17 зарядов оружия_, когда использует две разные способности оружия, вне зависимости от времени между атаками.\n\n_+2:_ Чемпион мгновенно восстанавливает _0,33 заряда оружия_, когда использует две разные способности оружия, вне зависимости от времени между атаками.\n\n_+3:_ Чемпион мгновенно восстанавливает _0,5 заряда оружия_, когда она использует две разные способности оружия, вне зависимости от времени между атаками.
actors.hero.talent.twin_upgrades.title=взаимные улучшения
actors.hero.talent.twin_upgrades.desc=_+1:_ Если экипированное оружие Чемпиона отличается редкостью на _2 или больше уровней_, то более слабое оружие будет улучшено до уровня более сильного.\n\n_+2:_ Если экипированное оружие Чемпиона отличается редкостью на _1 или больше уровней_, то более слабое оружие будет улучшено до уровня более сильного.\n\n_+3:_ Если экипированное оружие Чемпиона с редкостью _такого же уровня или выше_, то более слабое оружие будет улучшено до уровня более сильного.
actors.hero.talent.combined_lethality.title=двойная летальность
actors.hero.talent.combined_lethality.desc=_+1:_ Если Чемпион атакует рукопашным оружием сразу после использования способности другого, то эта атака добьёт любого врага, у которого _меньше 13% здоровья_. Не работает против боссов.\n\n_+2:_ Если Чемпион атакует рукопашным оружием сразу после использования способности другого, то эта атака добьёт любого врага, у которого _меньше 27% здоровья_. Не работает против боссов.\n\n_+3:_ Если Чемпион атакует рукопашным оружием сразу после использования способности другого, то эта атака добьёт любого врага, у которого _здоровье меньше 40%_. Не работает против боссов.\n\nЭта атака может быть обычной, а может и частью способности оружия.

actors.hero.talent.unencumbered_spirit.title=cвободный дух
actors.hero.talent.unencumbered_spirit.desc=_+1:_ Монах получает на _50% больше энергии_ за каждый предмет снаряжения с редкостью _уровня 3 и ниже_, который она использует.\n\n_+2:_ Монах получает на _75% больше энергии_ за каждый предмет снаряжения с редкостью _уровня 2 и ниже_, который она использует. Бонус для снаряжения с редкостью уровня 3 не изменён.\n\n_+3:_ Монах получает на _100% больше энергии_ за каждый предмет снаряжения с редкостью _уровня 1 или ниже_, который она использует. Бонус для снаряжения с редкостью уровней 2 и 3 не изменён. Она также получает тканевую броню и перчатки с шипами.\n\nЭтот талант не даёт преимущества при отсутствии брони или при атаке с кольцом урона.
actors.hero.talent.monastic_vigor.title=искусство отшельника
actors.hero.talent.monastic_vigor.desc=_+1:_ Если у Монаха _100% энергии_, её способности усиливаются. \n\n_+2:_ Если у Монаха _80% или больше энергии_, её способности усиливаются. \n\n_+3:_ Если у Монаха _60% или больше энергии_, её способности усиливаются.\n\nПри усилении:\n- Шквал ударов применяет зачарование оружия.\n- Фокусировка происходит мгновенно.\n- Дальность рывка увеличена на 4 клетки.\n- Удар дракона наносит на 50% больше урона, отбрасывает и оглушает всех соседних врагов.\n- Медитация медленно восстанавливает 20% от недостающего здоровья и дает 80% сопротивления урону.
actors.hero.talent.combined_energy.title=гармоничные потоки
actors.hero.talent.combined_energy.desc=_+1:_ Если за 5 ходов Монах успешно использует способность оружия и свою способность, требующую _4+ энергии_, то она восстанавливает 1 потраченную энергию.\n\n_+2:_ Если за 5 ходов Монах успешно использует способность оружия и свою способность, требующую _3+ энергии_, то она восстанавливает 1 потраченную энергию.\n\n_+3:_ Если за 5 ходов Монах успешно использует способность оружия и свою способность, требующую _2+ энергии_, то она восстанавливает 1 потраченную энергию.

actors.hero.talent.close_the_gap.title=тактическое сближение
actors.hero.talent.close_the_gap.desc=_+1:_ Дуэлянт совершает скачок до _2 клеток_ к её цели, когда начинает дуэль.\n\n_+2:_ Дуэлянт совершает скачок до _3 клеток_ к её цели, когда начинает дуэль.\n\n_+3:_ Дуэлянт совершает скачок до _4 клеток_ к её цели, когда начинает дуэль.\n\n_+4:_ Дуэлянт совершает скачок до _5 клеток_ к её цели, когда начинает дуэль.\n\nСкачок может проходить через врагов, ловушки и ямы, но не через стены. Скачок учитывается при расчёте радиуса для дуэли.
actors.hero.talent.invigorating_victory.title=сладость победы
actors.hero.talent.invigorating_victory.desc=_+1:_ Если Дуэлянт побеждает врага до конца дуэли, она исцеляется на _5 ОЗ плюс 30% от урона_ полученного в дуэли.\n\n_+2:_ Если Дуэлянт побеждает врага до конца дуэли, она исцеляется на _10 ОЗ плюс 50% от урона_ полученного в дуэли.\n\n_+3:_ Если Дуэлянт побеждает врага до конца дуэли, она исцеляется на _15 ОЗ плюс 65% от урона_ полученного в дуэли.\n\n_+4:_ Если Дуэлянт побеждает врага до конца дуэли, она исцеляется на _20 ОЗ плюс 75% от урона_ полученного в дуэли.
actors.hero.talent.elimination_match.title=дуэль не на жизнь
actors.hero.talent.elimination_match.desc=_+1:_ Если Дуэлянт бросает вызов в течение 3-ёх ходов после конца дуэли, активация способности расходует на _16% меньше_ заряда.\n\n_+2:_ Если Дуэлянт бросает вызов в течение 3-ёх ходов после конца дуэли, активация способности расходует на _30% меньше_ заряда.\n\n_+3:_ Если Дуэлянт бросает вызов в течение 3-ёх ходов после конца дуэли, активация способности расходует на _40% меньше_ заряда.\n\n_+4:_ Если Дуэлянт бросает вызов в течение 3-ёх ходов после конца дуэли, активация способности расходует на _50% меньше_ заряда.

actors.hero.talent.elemental_reach.title=дальность стихии
actors.hero.talent.elemental_reach.desc=_+1:_ Дальность стихийного удара увеличена с 4 до _5 клеток_, а его ширина с 65 до _75 градусов_.\n\n_+2:_ Дальность стихийного удара увеличена с 4 до _6 клеток_, а его ширина с 65 до _85 градусов_.\n\n_+3:_ Дальность стихийного удара увеличена с 4 до _7 клеток_, а его ширина с 65 до _95 градусов_.\n\n_+4:_ Дальность стихийного удара увеличена с 4 до _8 клеток_, а его ширина с 65 до _105 градусов_.
actors.hero.talent.striking_force.title=сила волны
actors.hero.talent.striking_force.desc=_+1:_ Сила стихийного удара увеличена на _30%_.\n\n_+2:_ Сила стихийного удара увеличена на _60%_.\n\n_+3:_ Сила стихийного удара увеличена на _90%_.\n\n_+4:_ Сила стихийного удара увеличена на _120%_.
actors.hero.talent.directed_power.title=направленная сила
actors.hero.talent.directed_power.desc=_+1:_ Прямая атака стихийного удара увеличивает силу зачарований на _30%_ за каждого врага в её радиусе.\n\n_+2:_ Прямая атака стихийного удара увеличивает силу зачарований на _60%_ за каждого врага в её радиусе.\n\n_+3:_ Прямая атака стихийного удара увеличивает силу зачарований на _90%_ за каждого врага в её радиусе.\n\n_+4:_ Прямая атака стихийного удара увеличивает силу зачарований на _120%_ за каждого врага в её радиусе.

actors.hero.talent.feigned_retreat.title=притворное отступление
actors.hero.talent.feigned_retreat.desc=_+1:_ Если враг атакует послеобраз Дуэлянта, она получает _2 хода_ ускорения.\n\n_+2:_ Если враг атакует послеобраз Дуэлянта, она получает _4 хода_ ускорения.\n\n_+3:_ Если враг атакует послеобраз Дуэлянта, она получает _6 ходов_ ускорения.\n\n_+4:_ Если враг атакует послеобраз Дуэлянта, она получает _8 ходов_ ускорения.
actors.hero.talent.expose_weakness.title=слабое место
actors.hero.talent.expose_weakness.desc=_+1:_ Враги, атакующие послеобраз Дуэлянта, становятся слабыми и уязвимыми на _2 хода_.\n\n_+2:_ Враги, атакующие послеобраз Дуэлянта, становятся слабыми и уязвимыми на _4 хода_.\n\n_+3:_ Враги, атакующие послеобраз Дуэлянта, становятся слабыми и уязвимыми на _6 ходов_.\n\n_+4:_ Враги, атакующие послеобраз Дуэлянта, становятся слабыми и уязвимыми на _8 ходов_.
actors.hero.talent.counter_ability.title=контрудар
actors.hero.talent.counter_ability.desc=_+1:_ Если Дуэлянт использует способность оружия в течение 3 ходов после того, как ее послеобраз был атакован, она мгновенно восстанавливает _0,38 зарядов_.\n\n_+2:_ Если Дуэлянт использует способность оружия в течение 3 ходов после того, как ее послеобраз был атакован, она мгновенно восстанавливает _0,77 зарядов_.\n\n_+3:_ Если Дуэлянт использует способность оружия в течение 3 ходов после того, как ее послеобраз был атакован, она мгновенно восстанавливает _1,13 зарядов_.\n\n_+4:_ Если Дуэлянт использует способность оружия в течение 3 ходов после того, как ее послеобраз был атакован, она мгновенно восстанавливает _1,5 зарядов_.

#cleric
actors.hero.talent.satiated_spells.title=Пресыщающие заклинания
actors.hero.talent.satiated_spells.desc=_+1:_ Перекус даёт Клирику _3 щита_ при следующем использовании заклинания.\n\n_+2:_ Перекус даёт Клирику _5 щита_ при следующем использовании заклинания.
actors.hero.talent.satiated_spells.meta_desc=_Если этот талант получен другим героем_, вместо этого он мгновенно дает щит, который начнет ослабевать через 10 ходов.
actors.hero.talent.holy_intuition.title=интуиция святого
actors.hero.talent.holy_intuition.desc=_+1:_ Клирик может использовать заклинание _Интуиция святого_, которое показывает, проклят ли предмет, за _3 заряда_.\n\n_+2:_ Клирик может использовать заклинание _Интуиция святого_, которое показывает, проклят ли предмет, за _2 заряда_.
actors.hero.talent.holy_intuition.meta_desc=_Если этот талант получен другим героем_, вместо этого он позволит герою выявить проклятие на предмете перед тем, как экипирует его, в 15% случаев при +1 или в 25% случаев при +2.
actors.hero.talent.searing_light.title=слепящий свет
actors.hero.talent.searing_light.desc=_+1:_ Физические атаки Клирика по врагам, освещённым _Путеводным Светом_, наносят _+3 урона._\n\n_+2:_ Физические атаки Клирика по врагам, освещённым _Путеводным Светом_, наносят _+5 урона._
actors.hero.talent.searing_light.meta_desc=_Если этот талант получен другим героем_, вместо этого он будет давать бонусный урон при использовании палочки или артефакта на враге, с перезарядкой в 20 ходов.
actors.hero.talent.shield_of_light.title=щит света
actors.hero.talent.shield_of_light.desc=_+1:_ Клирик может использовать заклинание _Щит света_, которое накладывается мгновенно и дарует ему _2-4 брони_ против цели на 5 ходов за 1 заряд.\n\n_+2:_ Клирик может использовать заклинание _Щит света_, которое накладывается мгновенно и дарует ему _3-6 брони_ против цели на 5 ходов за 1 заряд.
actors.hero.talent.shield_of_light.meta_desc=_Если этот талант получен другим героем_, вместо этого он уменьшит получаемый от врага физический урон до 1, в 33% случаев при +1 или 50% случаев при +2.

actors.hero.talent.enlightening_meal.title=Освещающий обед
actors.hero.talent.enlightening_meal.desc=_+1:_ Перекус занимает у Клирика 1 ход и дарует ему _0.67 заряда_ к священному тому.\n\n_+2:_ Перекус занимает у Клирика 1 ход и дарует ему _1 заряд_ к священному тому.
actors.hero.talent.enlightening_meal.meta_desc=_Если этот талант получен другим героем_, вместо этого он дает 2 хода перезарядки палочек и артефактов при +1 или 3 хода при +2. Этот талант не позволяет рогу изобилия перезаряжать самого себя.
actors.hero.talent.recall_inscription.title=Воспоминание начертания
actors.hero.talent.recall_inscription.refunded=Ваш предмет был возвращен!
actors.hero.talent.recall_inscription.desc=_+1:_ Клирик может использовать заклинание _Воспоминание начертания_, которое позволяет повторить эффект последнего использованного рунного камня или свитка в течение _10 ходов._\n\n_+2:_ Клирик может использовать заклинание _Воспоминание начертания_, которое позволяет повторить эффект последнего использованного рунного камня или свитка в течение _300 ходов._\n\nВоспоминание начертания не может быть использовано со свитками улучшений. Стоимость заряда этого заклинания варьируется в зависимости от того, какой предмет был использован недавно: 2 за рунный камень, 3 за свиток, 4 за особый свиток. Эта стоимость заряда также удваивается при использовании свитка превращения или алхимических предметов, которые были созданы с помощью превращения или улучшения.
actors.hero.talent.recall_inscription.meta_desc=_Если этот талант получен другим героем_, вместо этого он вернет любой свиток или рунный камень в 10% случаев при +1 или в 15% случаев при +2. Этот эффект не распространяется на свитки улучшения.
actors.hero.talent.sunray.title=Солнечный луч
actors.hero.talent.sunray.desc=_+1:_ Клирик может использовать заклинание _Солнечный луч_, которое наносит _4-8 урона_ и ослепляет цель на _4 хода_ за стоимость 1 заряда.\n\n_+2:_ Клирик может использовать заклинание _Солнечный луч_, которое наносит _6-12 урона_ и ослепляет цель на _6 ходов_ за стоимость 1 заряда.\n\nСолнечный луч может ослепить каждую цель только один раз, но если цель уже ослеплена этим заклинанием, то оно вместо этого парализует. Солнечный луч всегда наносит максимальный урон демоническим и неживым врагам.
actors.hero.talent.sunray.meta_desc=_Если этот талант получен другим героем_, вместо этого он позволит иногда палочкам и артефакты ослеплять врагов на 4 хода, в 15% случаев при +1 или 25% случаев при +2.
actors.hero.talent.divine_sense.title=Божественное чувство
actors.hero.talent.divine_sense.desc=_+1:_ Клирик может использовать заклинание _Божественное чувство,_ которое дарует ему Ментальное зрение в радиусе _8 клеток_ на 50 ходов и не требует времени для использования, за стоимость 2 зарядов.\n\n_+2:_ Клирик может использовать заклинание _Божественное чувство,_ которое дарует ему Ментальное зрение в радиусе _12 клеток_ на 50 ходов и не требует времени для использования, за стоимость 2 зарядов.
actors.hero.talent.divine_sense.meta_desc=_Если этот талант получен другим героем_, вместо этого он дает Ментальное зрение на короткое время после использования палочки или артефакта в пределах 3 клеток при +1 или 5 клеток при +2.
actors.hero.talent.bless.title=Благословение
actors.hero.talent.bless.desc=_+1:_ Клирик может использовать заклинание _Благословение_, которое дарует _6 ходов благословения и 10 защиты_ при применении на себя или _10 ходов благословения и 10 исцеления_ при применении на другого персонажа, за стоимость 1 заряда.\n\n_+2:_ Клирик может использовать заклинание _Благословение_, которое дарует _10 ходов благословения и 15 защиты_ при применении на себя или _15 ходов благословения и 15 исцеления_ при применении на другого персонажа, за стоимость 1 заряда.\n\nИзлишнее исцеление от этого заклинания преобразуется в защиту.
actors.hero.talent.bless.meta_desc=_Если этот талант получен другим героем_, вместо этого он увеличит точность и уклонение героя и всех союзников на 3% при +1 или на 5% при +2.

actors.hero.talent.cleanse.title=Очищение
actors.hero.talent.cleanse.desc=_+1:_ Клирик может использовать заклинание _Очищение_, которое накладывается мгновенно, _удаляет негативные эффекты_ с Клирика и всех ближайших союзников и даёт им _10 щита_, за стоимость 2 зарядов.\n\n_+2:_ Клирик может использовать заклинание _Очищение_, которое накладывается мгновенно, _даёт 3 хода иммунитета к негативным эффектам_ Клирику и всем ближайшим союзникам и даёт им _20 щита_, за стоимость 2 зарядов.\n\n_+3:_ Клирик может использовать заклинание _Очищение_, которое накладывается мгновенно, _даёт 5 ходов иммунитета к негативным эффектам_ Клирику и всем ближайшим союзникам и даёт им _30 защиты_, за стоимость 2 зарядов.
actors.hero.talent.cleanse.meta_desc=_Если этот талант получен другим героем_, вместо этого он при использовании палочки или артефакта, может очистит героя от негативных эффектов, в 10/20/30% случаев при +1/+2/+3.
actors.hero.talent.light_reading.title=Светлое чтение
actors.hero.talent.light_reading.desc=_+1:_ Клирик может использовать Священный том, не экипировав его, но будучи неэкипированным он перезаряжается со _скоростью 25%_.\n\n_+2:_ Клирик может использовать Священный том, не экипировав его, но будучи неэкипированным он перезаряжается со _скоростью 50%_.\n\n_+3:_ Клирик может использовать Священный том, не экипировав его, но будучи неэкипированным он перезаряжается со _скоростью 75%_.
actors.hero.talent.light_reading.meta_desc=_Если этот талант получен другим героем_, вместо этого он увеличит скорость зарядки всех палочек на 7/13/20% при +1/+2/+3.

actors.hero.talent.holy_lance.title=Священное копьё
actors.hero.talent.holy_lance.desc=_+1:_ Жрец может использовать заклинание _Священное копьё_, разрушительное заклинание, которое наносит _30-55 урона_ за стоимость 4 зарядов.\n\n_+2:_ Жрец может использовать заклинание _Священное копьё_, разрушительное заклинание, которое наносит _45-83 урона_ за стоимость 4 зарядов.\n\n_+3:_ Жрец может использовать заклинание _Священное копьё_, разрушительное заклинание, которое наносит _60-110 урона_ за стоимость 4 зарядов.\n\nСвященное копьё всегда наносит максимальный урон демоническим и неживым врагам. Священное копьё имеет время восстановления 30 ходов перед тем, как его можно будет использовать снова.
actors.hero.talent.hallowed_ground.title=Священная земля
actors.hero.talent.hallowed_ground.desc=_+1:_ Жрец может использовать заклинание _Священная земля_, которое освящает территорию в _области 3x3_ на 20 ходов за стоимость 2 зарядов.\n\n_+2:_ Жрец может использовать заклинание _Священная земля_, которое освящает территорию в _области 5x5_ на 20 ходов за стоимость 2 зарядов.\n\n_+3:_ Жрец может использовать заклинание _Священная земля_, которое освящает территорию в _области 7x7_ на 20 ходов за стоимость 2 зарядов.\n\nПри использовании, Священная земля лечит союзников на 15 ОЗ, временно опутывает врагов и распространяет короткую траву. Затем она медленно лечит союзников, ослабляет врагов и вызывает рост высокой травы. Священная земля дарует Клирику защиту вместо лечения и уничтожается огнём.
actors.hero.talent.mnemonic_prayer.title=Мнемоническая молитва
actors.hero.talent.mnemonic_prayer.desc=_+1:_ Жрец может использовать заклинание _Мнемоническую молитву_, которое продлевает положительные или негативные эффекты на союзнике/враге на _3 хода_ за 1 заряд.\n\n_+2:_ Жрец может использовать заклинание _Мнемоническую молитву_, которое продлевает положительные или негативные эффекты на союзнике/враге на _4 хода_ за 1 заряд.\n\n_+3:_ Жрец может использовать заклинание _Мнемоническую молитву_, которое продлевает положительные или негативные эффекты на союзнике/враге на _5 ходов_ за 1 заряд.\n\nМнемоническая молитва не тратит время на применение. Мнемоническая молитва может продлить определенный положительный/негативный эффект и не может продлить положительные эффекты, полученные от способностей брони.

actors.hero.talent.lay_on_hands.title=Наложение рук
actors.hero.talent.lay_on_hands.desc=_+1:_ Паладин может использовать заклинание _Наложение рук,_ которое мгновенно лечит ближайшего персонажа на _15 ОЗ,_ или дарует Паладину _15 щита,_ за 1 заряд.\n\n_+2:_ Паладин может использовать заклинание _Наложение рук,_ которое мгновенно лечит ближайшего персонажа на _20 ОЗ,_ или дарует Паладину _20 щита,_ за 1 заряд.\n\n_+3:_ Паладин может использовать заклинание _Наложение рук,_ которое мгновенно лечит ближайшего персонажа на _25 ОЗ,_ или дарует Паладину _25 щита,_ за 1 заряд.\n\nИзлишнее лечение от этого заклинания будет обращено в щит. Наложение рук может быть использовано подряд неоднократно, но не может даровать щит свыше значения равного трём использованиям.
actors.hero.talent.aura_of_protection.title=Аура защиты
actors.hero.talent.aura_of_protection.desc=_+1:_ Паладин может использовать заклинание _Аура защиты,_ которое дарует Паладину и всем его союзникам в пределах 2 клеток _20% сопротивления урону_ и эффект руны на доспех Паладина с _+50%_ мощностью на 20 ходов, за 2 заряда.\n\n_+2:_ Паладин может использовать заклинание _Аура защиты,_ которое дарует Паладину и всем его союзникам в пределах 2 клеток _30% сопротивления урону_ и эффект руны на доспех Паладина с _+75%_ мощностью на 20 ходов, за 2 заряда.\n\n_+3:_ Паладин может использовать заклинание _Аура защиты,_ которое дарует Паладину и всем его союзникам в пределах 2 клеток _40% сопротивления урону_ и эффект руны на доспех Паладина с _+100%_ мощностью на 20 ходов, за 2 заряда.
actors.hero.talent.wall_of_light.title=стена света
actors.hero.talent.wall_of_light.desc=_+1:_ Паладин может использовать заклинание _Стена света,_ которое создает перед Паладином сплошную стену с шириной в _3 клетки_, отталкивающую врагов на 20 ходов, за 3 заряда.\n\n_+2:_ Паладин может использовать заклинание _Стена света,_ которое создает перед Паладином сплошную стену с шириной в _5 клеток_, отталкивающую врагов на 20 ходов, за 3 заряда.\n\n_+3:_ Паладин может использовать заклинание _Стена света,_ которое создает перед Паладином сплошную стену с шириной в _7 клеток_, отталкивающую врагов на 20 ходов, за 3 заряда.\n\nСтена света может быть размещена по сторонам или по диагонали, и одновременно может существовать только одна стена света.

actors.hero.talent.divine_intervention.title=божественное вмешательство
actors.hero.talent.divine_intervention.desc=_+1:_ Клирик, находясь в Вознесённой форме, может применять _Божественное вмешательство,_ которое дает Клирику и всем союзникам до _150 щита_ и продлевает Вознесённую форму на _3 хода._\n\n_+2:_ Клирик, находясь в Вознесённой форме, может применять _Божественное вмешательство,_ которое дает Клирику и всем союзникам до _200 щита_ и продлевает Вознесённую форму на _4 хода._\n\n_+3:_ Клирик, находясь в Вознесённой форме, может применять _Божественное вмешательство,_ которое дает Клирику и всем союзникам до _250 щита_ и продлевает Вознесённую форму на _5 ходов._\n\n_+4:_ Клирик, находясь в Вознесённой форме, может применять _Божественное вмешательство,_ которое дает Клирику и всем союзникам до _300 щита_ и продлевает Вознесённую форму на _6 ходов._\n\nБожественное вмешательство стоит 5 зарядов тома и может быть использовано только один раз, когда действует та же Вознесённая форма.
actors.hero.talent.judgement.title=приговор
actors.hero.talent.judgement.desc=_+1:_ Клирик находясь в Вознесённой форме может применять _Приговор_, который нанесёт _10-20 урона_ всем видимым врагам.\n\n_+2:_ Клирик находясь в Вознесённой форме может применять _Приговор_, который нанесёт _15-30 урона_ всем видимым врагам.\n\n_+3:_ Клирик находясь в Вознесённой форме может применять _Приговор_, который нанесёт _20-40 урона_ всем видимым врагам.\n\n_+4:_ Клирик находясь в Вознесённой форме может применять _Приговор_, который нанесёт _25-50 урона_ всем видимым врагам.\n\nПриговор стоит 3 заряда тома и наносит дополнительно +33% урона за каждое заклинание, которое Клирик применил после входа в Вознесённую форму или после последнего использования Приговора.
actors.hero.talent.flash.title=вспышка
actors.hero.talent.flash.desc=_+1:_ Клирик находясь в Вознесённой форме может применять _Вспышку_, чтобы переместиться на расстояние до _3 клеток._\n\n_+2:_ Клирик находясь в Вознесённой форме может применять _Вспышку_, чтобы переместиться на расстояние до _4 клеток._\n\n_+3:_ Клирик находясь в Вознесённой форме может применять _Вспышку_, чтобы переместиться на расстояние до _5 клеток._\n\n_+4:_ Клирик находясь в Вознесённой форме может применять _Вспышку_, чтобы переместиться на расстояние до _6 клеток._\n\nВспышка изначально стоит 2 заряда тома, и каждый последующий её запуск в той же Вознесённой форме требует на 1 заряд больше.

actors.hero.talent.body_form.title=телесная форма
actors.hero.talent.body_form.desc=Клирик может использовать заклинание _Телесная форма_, наделяя Троицу силой зачарований и рун, которые Клирик обнаружил в своем путешествии, затрачивая на это 2 заряда.\n\n_+1:_ Когда Клирик применяет Троицу, он получает выбранный эффект на _20 ходов_.\n\n_+2:_ Когда Клирик применяет Троицу, он получает выбранный эффект на _27 ходов_.\n\n_+3:_ Когда Клирик применяет Троицу, он получает выбранный эффект на _33 хода_.\n\n_+4:_ Когда Клирик применяет Троицу, он получает выбранный эффект на _40 ходов_.\n\nТроица может быть одновременно наделена только одним эффектом Телесной формы. Стоимость заряда брони с Троицей становится выше, если выбранная руна была редкая и мощная.
actors.hero.talent.mind_form.title=ментальная форма
actors.hero.talent.mind_form.desc=Клирик может использовать заклинание _Ментальная форма_, наделяя Троицу силой палочки или метательного оружия, которое Клирик использовал в своем путешествии, затрачивая на это 3 заряда.\n\n_+1:_ Когда Клирик применяет Троицу, он использует эффект выстрела или броска у выбранного предмета, как если бы оно было _+3._\n\n_+2:_ Когда Клирик применяет Троицу, он использует эффект выстрела или броска у выбранного предмета, как если бы оно было _+4._\n\n_+3:_ Когда Клирик применяет Троицу, он использует эффект выстрела или броска у выбранного предмета, как если бы оно было _+5._\n\n_+4:_ Когда Клирик применяет Троицу, он использует эффект выстрела или броска у выбранного предмета, как если бы оно было _+6._\n\nТроица может быть одновременно наделена только одним эффектом Ментальной формы.
actors.hero.talent.spirit_form.title=духовная форма
actors.hero.talent.spirit_form.desc=Клирик может использовать заклинание _Духовная форма_, наделяя Троицу силой кольца или артефакта, которые Клирик опознал (кроме священного тома) в своем путешествии, затрачивая на это 3 заряда.\n\n_+1:_ Когда Клирик применяет Троицу, он получает эффект кольца _+1_ уровня на 20 ходов или активирует эффект артефакта _+4_ уровня.\n\n_+2:_ Когда Клирик применяет Троицу, он получает эффект кольца _+2_ уровня на 20 ходов или активирует эффект артефакта _+6_ уровня.\n\n_+3:_ Когда Клирик применяет Троицу, он получает эффект кольца _+3_ уровня на 20 ходов или активирует эффект артефакта _+8_ уровня.\n\n_+4:_ Когда Клирик применяет Троицу, он получает эффект кольца _+4_ уровня на 20 ходов или активирует эффект артефакта _+10_ уровня.\n\nТроица может быть одновременно наделена только одним эффектом Духовной формы. Артефакты содержат различные эффекты и затрачивают заряд брони при активации Троицы.

actors.hero.talent.beaming_ray.title=сияющий луч
actors.hero.talent.beaming_ray.desc=Клирик может использовать заклинание _Сияющий луч_ от усиленного союзника за 1 заряд. Этот луч способен проходить сквозь стены и телепортировать союзника в указанное место. Если в данном месте находится враг, союзник появляется рядом и нападает на него. Такой луч даже способен телепортировать обычного неподвижного союзника, но тогда имеет в два раза урезанную дальность.\n\n_+1:_ Сияющий луч имеет максимальную дальность действия до 4-х клеток и увеличивает бонус от Силы многих на _35% больше урона_ против ближайшего врага на 10 ходов.\n\n_+2:_ Сияющий луч имеет максимальную дальность действия до 8-х клеток и увеличивает бонус от Силы многих на _40% больше урона_ против ближайшего врага на 10 ходов.\n\n_+3:_ Сияющий луч имеет максимальную дальность действия до 12-ти клеток и увеличивает бонус от Силы многих на _45% больше урона_ против ближайшего врага на 10 ходов.\n\n_+4:_ Сияющий луч имеет максимальную дальность действия до 16-ти клеток и увеличивает бонус от Силы многих на _50% больше урона_ против ближайшего врага на 10 ходов.
actors.hero.talent.life_link.title=узы жизни
actors.hero.talent.life_link.desc=Клирик может наложить _Узы жизни_ между собой и усиленным союзником за счет 2 зарядов. Это заклинание распределяет урон между Клириком и его союзником, и позволяет полезным заклинаниям (3-го уровня или ниже) Клирика распространятся на обоих, если кто-то один из них находится под их воздействием.\n\n_+1:_ Узы жизни действуют в течение _10 ходов_ и увеличивает бонус от Силы многих на _35% меньше получаемого урона._\n\n_+2:_ Узы жизни действуют в течение _13 ходов_ и увеличивает бонус от Силы многих на _40% меньше получаемого урона._\n\n_+3:_ Узы жизни действуют в течение _17 ходов_ и увеличивает бонус от Силы многих на _45% меньше получаемого урона._\n\n_+3:_ Узы жизни действуют в течение _20 ходов_ и увеличивает бонус от Силы многих на _50% меньше получаемого урона._
actors.hero.talent.stasis.title=Стазис
actors.hero.talent.stasis.desc=Клирик может использовать заклинание _Стазис_ на усиленного союзника за счет 2 зарядов. Стазис временно удаляет союзника из подземелья, сохраняя при этом все действующие на нем эффекты, включая Силу многих.\nКогда действие стазиса заканчивается, союзник снова появляется рядом с Клириком. Стазис можно мгновенно и без затрат использовать повторно, чтобы преждевременно прекратить действие эффекта, и действует на неподвижных союзников, но не позволяет перемещать их между этажами.\n\n_+1:_ Стазис действует максимум до _60 ходов._\n\n_+2:_ Стазис действует максимум до _80 ходов._\n\n_+3:_ Стазис действует максимум до _100 ходов._\n\n_+4:_ Стазис действует максимум до _120 ходов._\n\nКлирик также может использовать Сияющий луч, когда союзник находится в стазисе, чтобы повторно призвать его, или использовать Узы жизни, чтобы заранее применить его эффект. Однако союзники в стазисе не получают бонус от Уз жизни.


#universal
actors.hero.talent.heroic_energy.title=героическая энергия
actors.hero.talent.heroic_energy.rat_title=крысоическая энергия
actors.hero.talent.heroic_energy.desc=_+1:_ Способность брони героя имеет сниженную стоимость заряда _на 12%_.\n\n_+2:_ Способность брони героя имеет сниженную стоимость заряда _на 23%_.\n\n_+3:_ Способность брони героя имеет сниженную стоимость заряда _на 32%_.\n\n_+4:_ Способность брони героя имеет сниженную стоимость заряда _на 40%_.

actors.hero.talent.ratsistance.title=крысопротивление
actors.hero.talent.ratsistance.desc=_+1:_ Враждебные крысоморфизированные враги наносят на _-10% меньше урона_.\n\n_+2:_ Враждебные крысоморфизированные враги наносят на _-19% меньше урона_.\n\n_+3:_ Враждебные крысоморфизированные враги наносят на _-27% меньше урона_.\n\n_+4:_ Враждебные крысоморфизированные враги наносят на _-35% меньше урона_.
actors.hero.talent.ratlomacy.title=крысоматия
actors.hero.talent.ratlomacy.desc=_+1:_ Использование крысоморфоза на крысоморфизированном враге делает его дружелюбным и делает трансформацию постоянной.\n\n_+2:_ Использование крысоморфоза на крысоморфизированном враге делает его дружелюбным, делает трансформацию постоянной и дает ему адреналин на _2 хода_.\n\n_+3:_ Использование крысоморфоза на крысоморфизированном враге делает его дружелюбным, делает трансформацию постоянной и дает ему адреналин на _4 хода_.\n\n_+4:_ Использование крысоморфоза на крысоморфизированном враге делает его дружелюбным, делает трансформацию постоянной и дает ему адреналин на _6 ходов_.
actors.hero.talent.ratforcements.title=крысокрепление
actors.hero.talent.ratforcements.desc=_+1:_ При использовании крысоморфоза на себе _появляется 1_ союзная сумчатая крыса рядом с вами.\n\n_+2:_ При использовании крысоморфоза на себе _появляются 2_ союзные сумчатые крысы рядом с вами.\n\n_+3:_ При использовании крысоморфоза на себе _появляются 3_ союзные сумчатые крысы рядом с вами.\n\n_+4:_ При использовании крысоморфоза на себе _появляются 4_ союзные сумчатые крысы рядом с вами.



###npcs
actors.mobs.npcs.blacksmith.name=тролль-кузнец
actors.mobs.npcs.blacksmith.intro_quest_warrior=Привет, человек! Ты, похоже, сильный.
actors.mobs.npcs.blacksmith.intro_quest_mage=Привет, человек! Ты, похоже, умный.
actors.mobs.npcs.blacksmith.intro_quest_rogue=Привет, человек! Ты, похоже, коварный.
actors.mobs.npcs.blacksmith.intro_quest_huntress=Привет, человек! Ты, похоже, быстренький.
actors.mobs.npcs.blacksmith.intro_quest_duelist=Привет, человек! Ты, похоже, храбрый.
actors.mobs.npcs.blacksmith.intro_quest_cleric=Привет, человек! Ты, похоже, важный.
actors.mobs.npcs.blacksmith.intro_quest_start=Слушь, хошь быть полезным, а? Ага, я мог бы те кое-чё поручить сделать. Я сколотил эту мастерскую поверх старой шахты, вон она, вниз по той стремянке. Возьми вон кирку и раздобудь-ка мне _руду тёмного золота. Штук 40_ будет нормально. Порода там внизу довольно мягкая, так что _ты сможешь, поднатужившись, копать себе свои собственные ходы._\n\nЧего-чего, типа, как я платить буду? Вот жадюга...\n\nЛадно, давай, я могу те что-нибудь такое сковать. Считай, тебе повезло, тут окромя меня кузнецов нету.
actors.mobs.npcs.blacksmith.intro_quest_crystal=Ты только осторожно там, а то шахта опасна для человечков вроде тебя. Она уже какое-то время брошена, и там начали расти эти, типа, кристаллы. Они прямо сияют, но слишком уж хрупки, чтобы представлять какую-то ценность, и там эти, типа, магические штуки их защищают. А те уже покрепче будут, так что _осторожно, когда будешь копать,_ а то привлечешь их внимание.\n\nЕсть там где-то и _кристалл-гигант_. Вот он намного серьезнее, так что будь готов к сражению, как только начнешь его ломать. Спорю, что как только его сломать, то и рост всех этих кристаллов замедлится. Так что доплачу, если с этим справишься.
actors.mobs.npcs.blacksmith.intro_quest_gnoll=Ты только осторожно там, а то шахта опасна для человечков вроде тебя. Некоторым из гноллей тоже, похоже, нужно это золото, и вот они там крушат все вокруг да около. Они тупые, так что их, де, горные работы привели ко множеству обвалов и обрушений. Тебе придется прорывать себе дорогу, так что _аккуратно там, где есть свежие заколы._\n\nКажись, там один из гноллей - главный по цеху, скорее всего _шаман-геомант_ или что-то типа того. Я доплачу, если сможешь отыскать и убить его, но я просто уверен, что он будет рьяно отбиваться.
actors.mobs.npcs.blacksmith.intro_quest_fungi=Ты только осторожно там, а то шахта опасна для человечков вроде тебя. Есть там такой, типа, гриб-монстр, который там вырос. Так у него в распоряжении эти грибы-стражи, и они как тебя увидят, так тебе крышка. Ну, хотя бы они не могут за тобой погнаться, и то хорошо. _Не попадайся им на глаза,_ если дорожишь жизнью.\n\nЯ доплачу, если сможешь разобрать _крупнейший из грибов,_ однако это потребует настоящих усилий. К нему подключены такие, типа, мицелевые узлы, которые спрятаны в стенах. Вот их-то и надо сперва раскромсать, иначе никакого урона особо ему не нанесешь.
actors.mobs.npcs.blacksmith.reminder=Хорош отвлекать меня! Вход в шахту вон там.
actors.mobs.npcs.blacksmith.reminder_crystal=Принеси-ка мне золота столько, сколько вообще сможешь набрать, и разберись с громадным кристаллом, лады?
actors.mobs.npcs.blacksmith.reminder_gnoll=Принеси-ка мне золота столько, сколько вообще сможешь набрать и расправься с геомантом, лады?
actors.mobs.npcs.blacksmith.reminder_fungi=Принеси-ка мне золота столько, сколько вообще сможешь набрать и избавься от гигантского гриба, лады?
actors.mobs.npcs.blacksmith.lost_pick=Ты издеваешься? Где кирка моя?!
actors.mobs.npcs.blacksmith.quest_start_prompt=Готов спуститься? Смотри, чтоб у тебя осталось немного места для золота.\n\n_Вниз я тебя пущу всего один раз!_
actors.mobs.npcs.blacksmith.enter_yes=Готов
actors.mobs.npcs.blacksmith.enter_no=Погоди
actors.mobs.npcs.blacksmith.exit_warn_none=Уже все? Да у тебя золота-то вовсе и нет! Хотя бы _штук 40_ ты ведь сможешь запросто достать!\n\n_Смотри, я больше тебя туда не пущу, раз ты уж вылез обратно._
actors.mobs.npcs.blacksmith.exit_warn_low=Уже все? Не похоже на то, будто у тебя там особо много золота. Хотя бы _штук 40_ ты ведь сможешь запросто достать!\n\n_Смотри, я больше тебя туда не пущу, раз ты уж вылез обратно._
actors.mobs.npcs.blacksmith.exit_warn_med=Уже все? Ну, золото-то у тебя вроде есть, но в шахте там наверняка есть еще! Хотя бы _штук 40_ ты ведь сможешь запросто достать!\n\n_Смотри, я больше тебя туда не пущу, раз ты уж вылез обратно._
actors.mobs.npcs.blacksmith.exit_warn_high=Уже все? Похоже, с золотом у тебя уже ничего, но мне бы его побольше. Хотя бы _штук 40_ ты ведь сможешь запросто достать!\n\n_Смотри, я больше тебя туда не пущу, раз ты уж вылез обратно._
actors.mobs.npcs.blacksmith.exit_warn_full=Уже все? Золота у тебя куча, но смотри, чтобы там не осталось чего-нибудь из твоих принадлежностей.\n\n_Смотри, я больше тебя туда не пущу, раз ты уж вылез обратно._
actors.mobs.npcs.blacksmith.exit_warn_crystal=Кристалл-гигант тоже еще там прозябает. Я доплачу, если сможешь его поломать.
actors.mobs.npcs.blacksmith.exit_warn_gnoll=А тот гнолл-геомант тоже еще там прозябает. Я доплачу, если сможешь его убить.
actors.mobs.npcs.blacksmith.exit_warn_fungi=Гриб-гигант тоже еще там прозябает. Я доплачу, если сможешь его убить.
actors.mobs.npcs.blacksmith.exit_yes=Довольно
actors.mobs.npcs.blacksmith.exit_no=Погоди
actors.mobs.npcs.blacksmith.get_lost=Я занят. Исчезни!
actors.mobs.npcs.blacksmith.entrance_blocked=Спуск заблокирован.
actors.mobs.npcs.blacksmith.cant_enter_old=Эта область недоступна в настоящем забеге. Начните новую игру, чтобы попробовать новое задание!
actors.mobs.npcs.blacksmith.def_verb=блокирует
actors.mobs.npcs.blacksmith.desc=Тролль-кузнец выглядит как и все тролли: высокий и тощий, а кожа похожа на камень и цветом, и фактурой. Тролль-кузнец работает непропорционально маленькими инструментами.

actors.mobs.npcs.ghost.name=печальный призрак
actors.mobs.npcs.ghost.rat_1=Здравствуй, %s... Когда-то и я был таким, как ты - сильным и уверенным в себе... Но я погиб от ужасного зверя... Я не могу покинуть это место... Не раньше, чем свершится месть... Убей _вонючую крысу,_ что забрала мою жизнь...\n\nОна бродит по этому уровню... Распространяя вонь повсюду... _Остерегайся облака вони и разъедающего укуса, кислота смывается водой..._
actors.mobs.npcs.ghost.rat_2=Прошу... Помоги мне... Убей чудовище...\n\n_Сражайся в воде... Избегай вони..._
actors.mobs.npcs.ghost.gnoll_1=Здравствуй, %s... Когда-то и я был таким, как ты - сильным и уверенным в себе... Но я погиб от дьявольского отродья... Я не могу покинуть это место... Не раньше, чем свершится месть... Убей _гнолла-трикстера,_ что забрал мою жизнь...\n\nОн не похож на остальных гноллов... Он прячется и использует метательное оружие... _Остерегайся его отравляющих и воспламеняющих дротиков, не сражайся на расстоянии..._
actors.mobs.npcs.ghost.gnoll_2=Прошу... Помоги мне... Убей трикстера...\n\n_Не позволяй ему попасть в тебя... Старайся бить вблизи..._
actors.mobs.npcs.ghost.crab_1=Здравствуй, %s... Когда-то и я был таким, как ты - сильным и уверенным в себе... Но я погиб от древнего существа... Я не могу покинуть это место... Не раньше, чем свершится месть... Убей _древнего краба,_ что забрал мою жизнь...\n\nОн невероятно стар... С огромной клешнёй и толстым панцирем... _Остерегайся его клешни, тебе придется атаковать неожиданно, или он заблокирует атаку..._
actors.mobs.npcs.ghost.crab_2=Прошу... Помоги мне... Убей древнего краба...\n\n_Он может заблокировать любую атаку... Если видит, что ты атакуешь..._
actors.mobs.npcs.ghost.find_me=Спасибо тебе... Найди меня...
actors.mobs.npcs.ghost.desc=Призрак еле виден. Он похож на бесформенный источник слабого света с грустным лицом.

actors.mobs.npcs.imp.name=предприимчивый бес
actors.mobs.npcs.imp.intro=Ты путешественник? Я люблю путешественников! На них всегда можно положиться, если надо кого-то убить, правда же? Естественно, за вознаграждение ;)
actors.mobs.npcs.imp.golems_1=В моем случае надо убить _големов._ Понимаешь, я тут бизнес небольшой открыть хочу, но эти тупые големы мешают продажам! Очень сложно спорить с бродячими гранитными бандурами, бес их побери! Пожалуйста, убей хотя бы _4 голема_, и награда твоя.
actors.mobs.npcs.imp.monks_1=В моем случае надо убить _монахов._ Понимаешь, я тут бизнес небольшой открыть хочу, но эти сумасшедшие сами ничего не покупают, и покупателей всех распугивают. Пожалуйста, убей... на вскидку _5 монахов_, и награда твоя.
actors.mobs.npcs.imp.golems_2=Как там твоё сафари на големов, м? Не забывай жетоны собирать.
actors.mobs.npcs.imp.monks_2=Ого, да ты живее всех живых! Я знал, в кунг-фу им до тебя далеко ;) Не забывай только собирать жетоны.
actors.mobs.npcs.imp.cya=Увидимся, %s!
actors.mobs.npcs.imp.hey=Псст, %s!
actors.mobs.npcs.imp.desc=Бесы - младшие демоны. Примечательны они не силой или магическим мастерством, а умом и социализированностью. Многие бесы предпочитают жить среди недемонов.

actors.mobs.npcs.impshopkeeper.name=предприимчивый бес
actors.mobs.npcs.impshopkeeper.greetings=Привет, %s!
actors.mobs.npcs.impshopkeeper.greetings_ascent=Что ты сделал, %s? Быстрее покупай, мне нужно выбираться отсюда!
actors.mobs.npcs.impshopkeeper.thief=Я думал, что могу доверять тебе!
actors.mobs.npcs.impshopkeeper.buyback=Бес с радостью возвращает ваш товар.
actors.mobs.npcs.impshopkeeper.desc=Этот бес открыл маленький магазинчик на границе внутренних залов. Приятно видеть дружелюбное лицо, но его цены определенно не кажутся такими же дружелюбными.

actors.mobs.npcs.mirrorimage.name=зеркальная копия
actors.mobs.npcs.mirrorimage.desc=Эта иллюзия является вашей точной копией, и даже вооружена теми же оружием и доспехами, что и вы.\n\nЗеркальные копии бесплотны, и принимают материальную форму только при атаке. Их оружие ведет себя так же, как и ваше, но наносит меньше урона. \n\nИллюзии способны атаковать и уклоняться, но исчезнут сразу же при получении любого урона.
actors.mobs.npcs.mirrorimage.discover_hint=Вы можете найти этого персонажа с помощью определённого свитка.

actors.mobs.npcs.npc.discover_hint=Вы можете найти этого персонажа в определённом регионе подземелья.

actors.mobs.npcs.prismaticimage.name=радужная копия
actors.mobs.npcs.prismaticimage.desc=Эта мерцающая иллюзия имеет с вами близкое сходство, вплоть до вашего оружия и брони.\n\nРадужные копии попытаются оттянуть на себя внимание врагов. Хотя они и не так хороши в атаке, как зеркальные копии, зато они имеют повышенную прочность и получают преимущества вашей брони.\n\nЕсли здоровье копии упадёт до нуля, она исчезнет в течение нескольких ходов. В это время её всё ещё можно исцелить. Когда поблизости не остаётся врагов, радужные копии исчезают и воссоединяются со своим хозяином.
actors.mobs.npcs.prismaticimage.discover_hint=Вы можете найти этого персонажа с помощью определённого свитка.

actors.mobs.npcs.ratking.name=крысиный король
actors.mobs.npcs.ratking.not_sleeping=Я не сплю!
actors.mobs.npcs.ratking.what_is_it=Ну что ещё? У меня нет времени на эти глупости. Королевство само собой не будет управлять!
actors.mobs.npcs.ratking.confused=Чт... Где я? Моё королевство нуждается во мне!
actors.mobs.npcs.ratking.crown_clothes=Оденься! Не подобает простолюдину в таком виде разговаривать с членами королевской семьи!
actors.mobs.npcs.ratking.crown_desc=Оооо, эта корона для меня?! Она выглядит гораздо более блестящей, чем моя, поэтому я милостиво её принимаю!\n\nНа самом деле, я думаю, что могу предложить тебе кое-что в качестве награды за эту корону. Огромная сила, подобающая такому герою, как ты! Тебе бы это понравилось?
actors.mobs.npcs.ratking.crown_yes=Конечно!
actors.mobs.npcs.ratking.crown_info=Сперва расскажи, о чем это.
actors.mobs.npcs.ratking.crown_no=Нет, не надо...
actors.mobs.npcs.ratking.crown_thankyou=Хе-хе-хе, спасибо! А теперь иди и сделай так, чтобы твой король гордился тобой!
actors.mobs.npcs.ratking.crown_fine=Ладно! Не то, чтобы я этого хотел...
actors.mobs.npcs.ratking.crown_after=Наслаждаешься своей новой броней? Никаких возвратов!
actors.mobs.npcs.ratking.desc_crown=Эта крыса немного больше, чем обычная сумчатая крыса. Она носит на голове корону Короля Дворфов.
actors.mobs.npcs.ratking.desc_birthday=Эта крыса немного больше, чем обычная сумчатая крыса. Она носит небольшой зеленый праздничный колпак, вместо обычно короны. Счастливого дня рождения, Крысиному королю!
actors.mobs.npcs.ratking.desc_winter=Эта крыса немного больше, чем обычная сумчатая крыса. Она носит небольшой праздничный колпак, вместо обычно короны. Счастливых праздников!
actors.mobs.npcs.ratking.desc=Эта крыса немного больше, чем обычная сумчатая крыса. Она носит на голове небольшую корону.
actors.mobs.npcs.ratking.discover_hint=Вы можете найти этого персонажа в конце определённого региона подземелья.

actors.mobs.npcs.sheep.name=овца
actors.mobs.npcs.sheep.baa!=Бээ!
actors.mobs.npcs.sheep.baa?=Мээ?
actors.mobs.npcs.sheep.baa.=Бээ.
actors.mobs.npcs.sheep.baa...=Мээ...
actors.mobs.npcs.sheep.def_verb=блокирует
actors.mobs.npcs.sheep.desc=Это волшебная овца. Что в ней волшебного? Её нельзя убить. Она будет тут стоять, пока волшебным образом не исчезнет, жуя жвачку с пустым взглядом.
actors.mobs.npcs.sheep.discover_hint=Вы можете найти этого персонажа с помощью определённого предмета или ловушки.

actors.mobs.npcs.shopkeeper.name=торговец
actors.mobs.npcs.shopkeeper.thief=Вор, Вор!
actors.mobs.npcs.shopkeeper.warn=А ну руки! Последнее предупреждение.
actors.mobs.npcs.shopkeeper.flee=Торговец сбегает!
actors.mobs.npcs.shopkeeper.sell=Продать предмет
actors.mobs.npcs.shopkeeper.talk=Поговорить
actors.mobs.npcs.shopkeeper.buyback=Владелец магазина неохотно возвращает ваш товар.
actors.mobs.npcs.shopkeeper.talk_prison_intro=У меня есть все необходимое для приключения!
actors.mobs.npcs.shopkeeper.talk_prison_warrior=У тебя интересная печать. Обычно их носят целыми. Ты обесчестенный герой или что-то в этом роде? Что ж, что бы ты не натворил, это явно не мое дело. Деньги не пахнут.
actors.mobs.npcs.shopkeeper.talk_prison_mage=Хе-хе, мне кажется, где-то в городе я видел объявление о розыске с твоим именем. Ты что, в бегах? О, ты невиновен? Конечно, конечно... Не беспокойся, у меня есть дела поважнее, чем звать стражу. Но, может быть, тебе стоит что-то купить, чтобы я не передумал?
actors.mobs.npcs.shopkeeper.talk_prison_rogue=Ты пришел из Гильдии воров, чтобы прогнать монстров? Нет, просто закупиться? Тогда убей хотя бы пару чудищ, раз уж ты здесь. На скидку тоже не рассчитывай. Я плачу вам хорошие деньги за защиту, а вы едва обеспечиваете мою безопасность здесь.
actors.mobs.npcs.shopkeeper.talk_prison_huntress=Вы, кажется, не в своей тарелке, мисс. Узкие коридоры подземелий не так просторны, как большие королевские залы или леса, окружающие город, не так ли? Хе-хе, о, не обращайте внимания на мою болтовню, почему бы вам что-нибудь не купить?
actors.mobs.npcs.shopkeeper.talk_prison_duelist=О, это же странствующий герой! Пытаешься спасти очередной город? Что ж, удачи. Опасности подземелья гораздо ужаснее, чем стычки с бандитами. Я уверен, ты справишься лучше остальных бедолаг, но постарайся не умереть прямо возле моего магазина. Это распугивает посетителей.
actors.mobs.npcs.shopkeeper.talk_prison_cleric=Добро пожаловать, Ваше Высочество, или, может быть, уже Ваше Святейшество? Хе-хе, в любом случае, это не место для вас, многие будут очень расстроены, если вы погибните. Но у вас наверняка есть немного монет, так почему бы не купить что-то, что поможет этого избежать?
actors.mobs.npcs.shopkeeper.talk_caves=Трать деньги - живи дольше.\n\nО, и передай от меня привет троллю-кузнецу, если увидишь его. Напомни ему, что кое-кто все еще должен мне деньги за тот молоток, который я продал на прошлой неделе!
actors.mobs.npcs.shopkeeper.talk_city=Мои товары не раз спасут тебя.\n\n...И не мешкай, пожалуйста. Потребовалась целая вечность, чтобы местные оставили меня в покое. Я не хочу, чтобы ты навлек какие-либо неприятности!
actors.mobs.npcs.shopkeeper.talk_halls=Эй ты, у меня есть особые скидки для охотников за головами демонов!\n\nО, и будь осторожен там! Демонам плевать, насколько ты самоуверен. Если умрёшь - не сможешь вернуться и потратить свои деньги! ;)\n\nНравлюсь ли я демонам? Хе-хе, ну, не совсем. Я просто малый парень. Не то, что бы боец, но мне удалось сохранить разум ясным. Демоны снизу намного сильнее, но всех их поработил... ну, в общем... просто будь аккуратен.
actors.mobs.npcs.shopkeeper.talk_ascent=Я без понятия, что ты собираешься делать с этим амулетом, и даже знать не хочу. Купи чего-нибудь и поторапливайся, нам обоим надо уходить отсюда!
actors.mobs.npcs.shopkeeper.desc=Этот полный парень лучше смотрелся бы в торговом районе крупного города, чем в подземелье. Его цены объясняют, почему он решил обосноваться здесь.

actors.mobs.npcs.wandmaker.name=старый чародей
actors.mobs.npcs.wandmaker.intro_warrior=О, приветствую тебя! Как приятно встретить воина с севера в столь гнетущем месте! Ты, должно быть, длинный проделал путь, чтобы добраться сюда. Если ты не против помочь пожилому человеку, у меня есть для тебя задание.
actors.mobs.npcs.wandmaker.intro_rogue=О Боже, ты меня напугал! В этих местах я не встречал бандита, сохранившего свой разум, так что ты, видать, с поверхности! Если ты не прочь помочь незнакомцу, у меня есть для тебя задание.
actors.mobs.npcs.wandmaker.intro_mage=О, здравствуй, %s! Я слышал, ты навел шума в институте чародеев? О, неважно, я все равно никогда не любил этих напыщенных снобов. Если хочешь, у меня есть для тебя задание.
actors.mobs.npcs.wandmaker.intro_huntress=О, здравствуй, мисс! Дружелюбное лицо в этом месте - настоящий сюрприз, не так ли? Если честно, готов поспорить, что уже видел твое лицо где-то, но никак не могу вспомнить... А, неважно, если ты ищешь приключений, у меня есть задание.
actors.mobs.npcs.wandmaker.intro_duelist=О, здравствуй, Мисс! Какой невероятно приятный сюрприз встретить прекрасную героиню с непомутнённым рассудком в столь мрачном и гнетущем месте! Если вы согласны помочь старику, то у меня есть для вас просьба.
actors.mobs.npcs.wandmaker.intro_cleric=О, здравствуйте, Ваше Высочество! Как приятно встретить вас в таком унылом месте! Не хотел бы навязываться, но у меня есть для вас задание.
actors.mobs.npcs.wandmaker.intro_1=\n\nЯ пришел сюда, чтобы найти редкий ингредиент для палочки, но заблудился, а мой магический щит постепенно ослабевает. Вскоре мне придется покинуть это место, но я очень не хочу возвращаться с пустыми руками.
actors.mobs.npcs.wandmaker.intro_dust=Я ищу _прах мертвеца._ Это особый вид измельченных проклятых костей, обычно встречающийся в подобных местах. Где-то здесь должна находиться заваленная комната, в которой есть пыль. Однако будь осторожнее, проклятие, лежащее на пыли, достаточно мощное. _Вернись ко мне как можно быстрее_ и я сниму его.
actors.mobs.npcs.wandmaker.intro_ember=Мне нужен _пепел элементаля,_ который получают из молодых огненных элементалей. Они обычно появляются, когда ритуал призыва не контролируется, так что найди свечи и место для ритуала, и я уверен, у тебя получится его вызвать. Смотри, не _поставь сам себя в стесненные обстоятельства_ в момент поединка с ним, либо _имей при себе что-нибудь замораживающее._ Новорожденные элементали очень сильны и хаотичны, но холод они просто не переносят.
actors.mobs.npcs.wandmaker.intro_berry=Бывшая хранительница этой тюрьмы выращивала _гнилоягоду,_ и я ищу её семена. Растение, скорее всего, совсем одичало, так что достать семена может оказаться сложнее. Сад должен быть где-то здесь. Постарайся _держаться подальше от его плёточников,_ если не хочешь потерять голову. Возможно, тебе захочется поджечь сад, но, прошу, не делай этого - так ты уничтожишь семена.
actors.mobs.npcs.wandmaker.intro_2=\n\nЕсли ты справишься, я буду рад отблагодарить тебя одной из своих замечательных палочек! У меня две есть с собой, выберешь, какая тебе по душе.
actors.mobs.npcs.wandmaker.reminder_dust=Как успехи с прахом, %s? Ищи забаррикадированные проходы, она должна быть где-то там.
actors.mobs.npcs.wandmaker.reminder_ember=Как успехи с пеплом, %s? Тебе надо найти свечи и точку призыва.
actors.mobs.npcs.wandmaker.reminder_berry=Как успехи с семенами Гнилоягоды, %s? Поищи комнату, полную растительности.
actors.mobs.npcs.wandmaker.def_verb=блокирует
actors.mobs.npcs.wandmaker.desc=Этот пожилой мужчина в расцвете сил слегка обеспокоен. Его защищает магический щит.



###mobs
actors.mobs.acidic.name=кислотный скорпид
actors.mobs.acidic.desc=Эти огромные, паукообразные демонические существа избегают ближний бой, и вместо этого предпочитают стрелять издалека зазубренными шипами. А с этого прямо капает едкая кислота.

actors.mobs.albino.name=крыса-альбинос
actors.mobs.albino.desc=Это редкая разновидность сумчатой крысы с абсолютно белым мехом и зазубренными зубами.
actors.mobs.albino.discover_hint=Вы можете изредка найти этого противника в определённом регионе подземелья.

actors.mobs.armoredstatue.name=бронированная статуя
actors.mobs.armoredstatue.desc=На первый взгляд это всего лишь одна из неподвижных статуй этого подземелья, но ее выдают красные светящиеся глаза.\n\nПохоже, она в прекрасной форме, судя по броне, которую она носит, и, вероятно, будет чрезвычайно трудно ее убить.
actors.mobs.armoredstatue.desc_arm_wep=Хотя сама статуя сделана из камня, но _%1$s_ и _%2$s_ в её руках выглядят настоящими.

actors.mobs.bandit.name=безумный бандит
actors.mobs.bandit.desc=Элитный вор, отличающийся более роскошной пурпурной мантией. Несмотря на более высокое мастерство, они стали такими же безумными, как обычные воры.\n\nПомимо того, что они крадут у вас вещи, безумные бандиты временно ослепляют, калечат и отравляют вас! Однако они гораздо чаще носят с собой дополнительные сокровища, чем обычные воры.

actors.mobs.bat.name=летучая мышь-вампир
actors.mobs.bat.desc=Эти шустрые и выносливые обитатели пещер куда более опасны, чем кажется. Они восстанавливают свое здоровье с каждой успешной атакой, что позволяет им преодолевать гораздо более крупных противников.

actors.mobs.bee.name=золотая пчела
actors.mobs.bee.desc_honey=Несмотря на свой малый размер, золотые пчелы обычно очень яростно защищают свое жилище. Но эта пчела задобрена и, похоже, хочет следовать за вами.
actors.mobs.bee.desc=Несмотря на небольшой размер, золотые пчелы будут яростно защищать свой дом. Эта совсем с ума сошла, лучше держаться подальше.
actors.mobs.bee.discover_hint=Вы можете найти этого персонажа с помощью определённого предмета.

actors.mobs.brute.name=гнолл-громила
actors.mobs.brute.enraged=в ярости
actors.mobs.brute.def_verb=блокирует
actors.mobs.brute.desc=Громилы - самые крупные, сильные и крепкие из гноллов. Получив смертельное ранение, они впадают в неистовство и получают временный щит, и наносят больше урона своим врагам.
actors.mobs.brute$bruterage.name=ярость громилы
actors.mobs.brute$bruterage.desc=Этот гнолл-громила умирает, но хочет забрать вас с собой!\n\nЭтот гнолл умрет, когда закончится действие его щита, либо по истечении времени, либо от нанесенного урона. До этого он наносит гораздо более сильный урон, так что будьте бдительны!\n\nХодов со щитом осталось: %d.

actors.mobs.causticslime.name=темный слизень
actors.mobs.causticslime.desc=Этот слизень, должно быть, был заражён тёмной магией, которая излучается из глубин. Он потерял свой обычный зелёный цвет и с него капает едкая слизь.
actors.mobs.causticslime.discover_hint=Вы можете изредка найти этого противника в определённом регионе подземелья.

actors.mobs.crab.name=сточный краб
actors.mobs.crab.desc=Эти крупные крабы находятся на вершине пищевой цепи в канализации. Они очень быстрые, а их толстый панцирь позволяет им пережить мощные удары.

actors.mobs.crystalguardian.name=кристалл-страж
actors.mobs.crystalguardian.def_verb=блокирует
actors.mobs.crystalguardian.desc=Эти крупные кристаллические стражи выглядят почти как статуи, если бы не яркое свечение их глаз. Закаленный кристалл, из которого они состоят, делает их весьма неповоротливыми, но очень выносливыми, так что _лучше не тревожить их во сне в своих кристаллических гнездах как можно дольше._\n\nИз-за своих размеров кристаллы-стражи в закрытых пространствах передвигаются гораздо медленнее. Кроме того, они слишком крепки, чтобы их полностью убить. Их можно побить и, таким образом, на время отключить, но через короткое время они просто опять встанут.
actors.mobs.crystalguardian.discover_hint=Вы можете найти этого противника во время определённого задания.

actors.mobs.crystalmimic.name=хрустальный мимик
actors.mobs.crystalmimic.ate=Мимик съел ваш %s!
actors.mobs.crystalmimic.escaped=Хрустальный мимик убежал!
actors.mobs.crystalmimic.desc=Мимики - волшебные существа, способные принимать любой облик. В подземельях они почти всегда принимают облик сундука, чтобы заманить ничего не подозревающих путешественников.\n\nХрустальные мимики - сложнее своих обычных собратьев, они стараются избегать конфликтов, но крадут сокровища. Когда их обнаруживают, они пытаются скрыться, и, кроме того, они способны сдвигать врагов с места, когда они атакуют.

actors.mobs.crystalspire.name=кристалл-шпиль
actors.mobs.crystalspire.warning=Кристалл вибрирует, когда вы ударяете по нему. Если будете так продолжать, это наверняка привлечет внимание...
actors.mobs.crystalspire.alert=Вибрации усиливаются и раскатываются по всей пещере!
actors.mobs.crystalspire.desc=Этот гигантский шпиль из сверхпрочного кристалла, вероятно, является истоком всех этих странных созданий из кристалла в этой пещере. Ваше обычное оружие бессильно против него, так что придется воспользоваться киркой, если хотите его сломать.\n\n_Убедитесь, что вы готовы перед тем, как начать его ломать._ Потребуется довольно времени для того, чтобы завершить работу, и вряд ли она пройдет без внешнего вмешательства. Сам шпиль, возможно, тоже имеет какие-то средства самозащиты. _Может как-то использовать атаки самого шпиля против его же приспешников?_
actors.mobs.crystalspire.discover_hint=Вы можете найти этого противника во время определённого задания.

actors.mobs.crystalwisp.name=кристалл-пучок
actors.mobs.crystalwisp.beam_kill=Луч света убил вас...
actors.mobs.crystalwisp.desc=Маленький и злой летучий кусок закаленного кристалла, излучающий светлое сияние. С одной стороны, кристаллы-пучки не особенно сильные, но, с другой, они будут атаковать вас вредоносным лучом света, как только возникнет чистая линия выстрела.\n\nПучки достаточно маленькие, чтобы свободно передвигаться через различные выступы из кристалла, но через них стрелять они не могут.
actors.mobs.crystalwisp.discover_hint=Вы можете найти этого противника во время определённого задания.

actors.mobs.demonspawner.name=рассадник демонов
actors.mobs.demonspawner.on_death=Со смертью рассадника ослабевает демоническая энергия этого места.
actors.mobs.demonspawner.desc=Этот вихрь сплавов из плоти дворфов производит демонов-потрошителей из частей дворфовких тел. Очевидно, демоны не брезгают использованием любого подручного материала против своих врагов.\n\nИмея ужасающий вид, эти производители демонов, с другой стороны, не имеют средств для передвижения или для прямой обороны. Все же, их внушительная масса препятствует их быстрому уничтожению, а при опасности они будут быстрее производить демонов-потрошителей.\n\n_Рассадники демонов, похоже, связаны с каким-то центральным источником демонической силы. Их уничтожение может привести к его ослабеванию._

actors.mobs.dm100.name=DM-100
actors.mobs.dm100.zap_kill=Вы были убиты молнией...
actors.mobs.dm100.desc=DM-100 - ранняя модель дворфовского 'оборонного оборудования', было создано для защиты шахтеров-дворфов в пещерах под этой тюрьмой. Удары электрическим током этих устройств, однако, оказались слишком слабыми, так что их подарили человеческому городу выше. Но в городе им не нашли применение и через несколько лет их отправили в тюрьму, где стражи изначально считали, что применять их - слишком жестоко. Но заключенные становились все менее управляемыми, так что они стали необходимы.

actors.mobs.dm200.name=DM-200
actors.mobs.dm200.vent=DM-200 совершает выброс токсичных выхлопных газов!
actors.mobs.dm200.desc=DM-200 - второе поколение 'оборонного оборудования' дворфов, создан для защиты дворфовских шахтеров в пещерах и городе, который находится под ними. Оно гораздо больше и более громоздко чем предшественники и атакует сокрушительными гидравлическими кулаками.\n\nБолее крупный размер DM-200 - их главная уязвимость, т.к. они не помещаются в узкие тоннели и дверные проемы подземелий. Но дворфы смогли компенсировать неповоротливость DM-200 тем, что эти машины могут направлять свои токсичные выхлопы на отдаленных врагов или врагов, которых им не достать.

actors.mobs.dm201.name=DM-201
actors.mobs.dm201.vent=DM-201 бросает кислотную гранату!
actors.mobs.dm201.desc=Дворфы какое-то время экспериментировали и далее развивали модели с низкой мобильностью, как у DM-200, и создали несколько моделей DM, которые были полностью стационарны. DM-201 - укомплектованный DM-200, служащий сторожевой башней без возможности передвижения. Компенсируя невозможностью передвигаться, у DM-201 значительно повышена выносливость и мощность атаки.\n\nТак как у DM-201 нет двигателя, из которого выходили бы выхлопные газы, дворфы вместо этого снабдили эту модель гранатами с разъедающим газом. DM-201, однако, очень осторожно пользуется этими гранатами и стреляет ими только в том случае, если его атакуют издалека.

actors.mobs.dm300.name=DM-300
actors.mobs.dm300.notice=ОБНАРУЖЕН НЕАВТОРИЗОВАННЫЙ ПЕРСОНАЛ!
actors.mobs.dm300.shield=DM-300 подключается к току от открытых проводов и создает себе щит!
actors.mobs.dm300.charging=ПОЛУЧАЮ ПОВРЕЖДЕНИЯ! АКТИВИРУЮ ВЫСОКОВОЛЬТНУЮ ОПОРУ!
actors.mobs.dm300.charging_hint=DM-300 неуязвим, пока он подпитывается от высоковольтной опоры!
actors.mobs.dm300.supercharged=УНИЧТОЖИТЬ! УНИЧТОЖИТЬ! УНИЧТОЖИТЬ!
actors.mobs.dm300.charge_lost=ОПОРА УНИЧТОЖЕНА! ПЕРЕХОЖУ НА ЛОКАЛЬНОЕ ПИТАНИЕ!
actors.mobs.dm300.pylons_destroyed=ТРЕВОГА! ОБНАРУЖЕНА НЕСТАБИЛЬНОСТЬ ЭЛЕКТРОСЕТИ!
actors.mobs.dm300.rankings_desc=Раздавлен DM-300
actors.mobs.dm300.def_verb=блокирует
actors.mobs.dm300.defeated=КРИТИЧЕСКИЕ ПОВРЕЖДЕНИЯ! ПОПЫТКА ОТКЛЮЧЕ-
actors.mobs.dm300.desc=DM-300 - самое крупное и сильное 'оборонное оборудование', когда-либо созданное дворфами. Такую великолепную машину чрезвычайно трудно создать, так что дворфы сделали их всего несколько штук для стражи входов в их подземную столицу.\n\nМашина оснащена выхлопной трубой для выброса токсичных газов и сверхмощной дрелью, которой она может и атаковать, и разрывать грунт. DM-300 также способен подключаться к сети питания, что еще более повышает его силу.
actors.mobs.dm300.desc_supercharged=В данный момент, DM-300 полностью заряжен электроэнергией. В таком состоянии DM-300 невозможно нанести урон, и он передвигается с двойной скоростью! Кроме того, его дрель теперь вертится достаточно быстро, чтобы _пробить тоннели сквозь скальной массив,_ хотя двигаться при этом будет намного медленнее.\n\nПока DM-300 сверх-заряжен, нет смысла атаковать его напрямую, _но что-то в этом месте, очевидно, снабжает его энергией,_ и если найти это и разрушить, возможно, это его ослабит.

actors.mobs.dwarfking.name=Король Дворфов
actors.mobs.dwarfking.notice=Как ты смеешь! Ты не имеешь никакого представления, с чем связался!
actors.mobs.dwarfking.lifelink_1=Мне нужна твоя жизненная сила, раб!
actors.mobs.dwarfking.lifelink_2=Кровь за короля, раб!
actors.mobs.dwarfking.teleport_1=Займись ими, раб!
actors.mobs.dwarfking.teleport_2=Не оставляй их без дела, раб!
actors.mobs.dwarfking.wave_1=Довольно! Восстаньте, мои рабы!
actors.mobs.dwarfking.wave_2=Еще! Кровь за короля!
actors.mobs.dwarfking.wave_3=Тщетно! УБЕЙТЕ ИХ!
actors.mobs.dwarfking.enraged=Ты не можешь убить меня, %s. Я БЕССМЕРТЕН!
actors.mobs.dwarfking.losing=Нет! Ты не можешь этого сделать... ты и понятия не имеешь, что там, в глубине...
actors.mobs.dwarfking.defeated=Ты... обрек нас всех...
actors.mobs.dwarfking.rankings_desc=Пал ниц пред Королем Дворфов
actors.mobs.dwarfking.desc=Много лет тому назад, один из высочайших придворных чародеев дворфов открыл тайны, которые наделили его чрезвычайной властью над жизнью и смертью. В скором он использовал эту власть, подчинил и растлил своих сверстников, своего короля, и, в итоге, всех граждан-дворфов. Ныне он - король, повелитель легиона подчиненных ему нежитей.\n\nКороль дворфов - очень агрессивный противник, он постарается сразить своих врагов ордой подчиненной ему нежити.
actors.mobs.dwarfking$dkghoul.rankings_desc=Пал ниц пред Королем Дворфов
actors.mobs.dwarfking$dkmonk.rankings_desc=Пал ниц пред Королем Дворфов
actors.mobs.dwarfking$dkwarlock.rankings_desc=Пал ниц пред Королем Дворфов
actors.mobs.dwarfking$dkgolem.rankings_desc=Пал ниц пред Королем Дворфов

actors.mobs.ebonymimic.name=эбонитовый мимик
actors.mobs.ebonymimic.reveal=Здесь прятался мимик!
actors.mobs.ebonymimic.hidden_name=подозрительное очертание
actors.mobs.ebonymimic.hidden_desc=Похоже, здесь что-то кроется, но оно почти полностью прозрачно.
actors.mobs.ebonymimic.desc=Мимики - волшебные существа, способные принимать любой облик. В подземельях они почти всегда принимают облик сундука, чтобы заманить ничего не подозревающих путешественников.\n\nЭбонитовые мимики - необычайно скрытные мимики, которые способны становиться почти невидимыми. Они обычно прячутся в вещах, которые могут подобрать путешественники, но при этом содержат и свои сокровища. Однако, они не такие сильные как обычные мимики, но их неожиданный укус сокрушителен.
actors.mobs.ebonymimic.discover_hint=Вы можете найти этого противника с помощью определённого аксессуара.

actors.mobs.elemental$fireelemental.name=огненный элементаль
actors.mobs.elemental$fireelemental.desc=Элементали - хаотичные существа, которых часто производят на свет при плохо контролируемых ритуалах. У элементалей имеется минимальный разум, и обычно их связывают с определенным видом магии.\n\nОгненные элементали - часто встречаемый вид, они причиняют урон огненной магией. Они приводят к возгоранию своей цели, которую они атакуют в ближнем бою, и порой они также могут выстрелить огненным зарядом.
actors.mobs.elemental$newbornfireelemental.name=новорожденный огненный элементаль
actors.mobs.elemental$newbornfireelemental.charging=Элементаль заряжается!
actors.mobs.elemental$newbornfireelemental.desc=Элементали - хаотичные существа, которых часто производят на свет тогда, когда сильная оккультная магия не достаточно контролируется. У элементалей имеется минимальный разум, и обычно их связывают с определенным видом магии.\n\nХотя этот огненный элементаль и был только что призван, он также опасен как и другие!
actors.mobs.elemental$newbornfireelemental.desc_boss=Из-за хаотичной натуры заклинания, с помощью которого был призван этот элементаль, он способен только очень неточно пускать огневые выстрели после того, как заряжался один ход.
actors.mobs.elemental$newbornfireelemental.desc_ally=Так как этот элементаль был призван с помощью заклинания, он имеет больший контроль над своим пламенем. Он не способен на дальнобойные атаки, но может зажигать противников в ближнем бою.
actors.mobs.elemental$newbornfireelemental.discover_hint=Вы можете найти этого противника во время определённого задания.
actors.mobs.elemental$frostelemental.name=морозный элементаль
actors.mobs.elemental$frostelemental.desc=Элементали - хаотичные существа, которых часто производят на свет при плохо контролируемых ритуалах. У элементалей имеется минимальный разум, и обычно их связывают с определенным видом магии.\n\nМорозные элементали - часто встречаемый вид, они ослабляют своих противников замораживающей магией. Они замораживают свою цель в ближнем бою, и, порой, атаками издалека. Их магия намного эффективнее в воде.
actors.mobs.elemental$shockelemental.name=электрический элементаль
actors.mobs.elemental$shockelemental.desc=Элементали - хаотичные существа, которых часто производят на свет при плохо контролируемых ритуалах. У элементалей имеется минимальный разум, и обычно их связывают с определенным видом магии.\n\nЭлектрический элементаль - нечасто встречаемый вид, они разрывают своих противников электрическими ударами и вспышками света. В ближнем бою от них исходят электрические удары по находящимся близко врагам, и дополнительный урон причиняется их главной цели, если та находится в воде. Они также способны время от времени издалека направлять вспышку света на свою цель, которая тогда на время слепнет.
actors.mobs.elemental$chaoselemental.name=элементаль хаоса
actors.mobs.elemental$chaoselemental.desc=Элементали - хаотичные существа, которых часто производят на свет при плохо контролируемых ритуалах. У элементалей имеется минимальный разум, и обычно их связывают с определенным видом магии.\n\nЭлементали хаоса - редкий и опасный вид, они не стабилизировались в определенном элементе. При атаке они разражаются дикой и непредсказуемой магией.

actors.mobs.eye.name=злобоглаз
actors.mobs.eye.deathgaze_kill=Вы умерли от смертоносного взгляда...
actors.mobs.eye.desc=Злобоглазы похожи на парящие в воздухе шары, переполненные демонической энергией. Они не слишком опасны в ближнем бою, их истинная сила заключается в их магических способностях.\n\nНакопив достаточно энергии, злобоглазы способны испустить луч разрушительной силы, называемый _смертоносным взглядом._ Этот луч нанесет огромный урон всему, что не успеет спрятаться от него.

actors.mobs.fetidrat.name=вонючая крыса
actors.mobs.fetidrat.desc=Что-то определенно не так с этой крысой. Её засаленный черный мех и гниющая шкура совсем не похожи на здоровых крыс, которых вы видели ранее. А тусклые зелёные глаза придают ей совсем уж пугающий вид.\n\nЗа крысой следует жуткое облако вони, невероятно сильное вблизи.\n\nТемная слизь капает изо рта крысы, разъедая пол, но растворяясь в воде.
actors.mobs.fetidrat.discover_hint=Вы можете найти этого противника во время определённого задания.

actors.mobs.fungalcore.name=сердце гриба
actors.mobs.fungalcore.desc=Этот огромный гриб, очевидно, является источником грибной активности в этой пещере.

actors.mobs.fungalsentry.name=грибной страж
actors.mobs.fungalsentry.desc=Этот невероятно высокий гриб является точкой обороны большой грибницы, живущей в этой пещере.\n\nОн неподвижен, но может выпускать точные удары яда по всему, что возникнет в его поле зрения. Сами эти удары довольно слабы, _но они быстро накапливаются в смертельные дозы яда._ Гриб, конечно, можно убить, но лучше бы его как-то обойти.

actors.mobs.fungalspinner.name=грибной прядильщик
actors.mobs.fungalspinner.desc=Этот грибной прядильщик контролируется грибом-паразитом. Гриб также изменил его способности и заменил паутинные и ядовитые железы на рассадники грибницы.\n\nВместо паутины, грибной прядильщик распространяет грибную растительность, которая может вас обездвижить своими корнями. Он не может вас отравить, но грибной прядильщик получает существенную устойчивость к урону, когда по соседству произрастает любой вид грибов.

actors.mobs.ghoul.name=дворфский вурдалак
actors.mobs.ghoul.desc=Когда дворфское общество начало постепенно распадаться, а нынешний король дворфов захватил абсолютную власть, с теми, кто были слабы или сопротивлялись ему, обращались не особо ласково. Когда король преуспел в искусстве темной магии, они подчинил этих дворфов своей воле, а теперь они стали пехотинцами его армии.\n\nВурдалаки, сами по себе, не особо сильны, но они всегда бродят группами и их непросто убить, когда их много. _Когда вурдалак побежден, через несколько ходов он поднимется вновь, если вблизи есть еще хотя бы один вурдалак._

actors.mobs.gnoll.name=гнолл-разведчик
actors.mobs.gnoll.desc=Гноллы - гиеноподобные гуманоиды. Они обитают в канализации и подземельях, периодически собираясь для рейдов на поверхность. Гноллы-разведчики - обычные члены стаи, не такие сильные, как громилы, и не такие умные, как шаманы.

actors.mobs.gnollexile.name=гнолл-изгой
actors.mobs.gnollexile.desc=Этот гнолл с серой шерстью имеет большое клеймо на плече, что показывает его изгнание. Гноллов обычно изгоняют из своего общества за неповиновение приказам или нарушение законов. Изгои должны быть сильны и смекалисты, чтобы выжить. Этот, похоже, знает, как использовать копьё, которое он держит.
actors.mobs.gnollexile.desc_passive=_Гнолл-изгой не спешит атаковать._ Он не выглядит таким же агрессивным, как остальные гноллы здесь, и скорее всего считает, что нападать на вас не стоит того. Вы можете просто дать ему пройти, но у него есть рюкзак, который может быть полон полезных вещей.
actors.mobs.gnollexile.desc_aggro=_Гнолл-изгой гневно озирается по сторонам._ Похоже, что-то всё же заставило его сражаться. Берегитесь его копья!
actors.mobs.gnollexile.seen_passive=Носящий копьё гнолл смотрит на вас с опаской, но не спешит атаковать.
actors.mobs.gnollexile.seen_aggro=Гнолл с копьём направляется в атаку!

actors.mobs.gnollgeomancer.name=гнолл-геомант
actors.mobs.gnollgeomancer.warning=Геомант пробуждается. Перед тем, как продолжить, удостоверьтесь, что вы готовы!
actors.mobs.gnollgeomancer.alert=Геомант пробуждается! Вся пещера будто бы изменяется, пока он скачет и безумно смеётся!
actors.mobs.gnollgeomancer.rock_kill=Вас убил летящий валун...
actors.mobs.gnollgeomancer.rockfall_kill=Вас убил обвал камней...
actors.mobs.gnollgeomancer.desc=Невероятно длинный высший гнолл является источником витающей здесь магии земли и руководителем всей активности гноллов в этой пещере. В отличие от гноллов-сапёров, геомант весьма искусен в своей магии и не может получить увечья от летящих или падающих камней. Впрочем, он никак не может сражаться в рукопашном бою.
actors.mobs.gnollgeomancer.desc_armor=Геомант покрыт слоем каменной брони. _Вам нужно сблизиться и разрушить её при помощи кирки, чтобы продолжить атаковать геоманта._
actors.mobs.gnollgeomancer.desc_armor_sapper=_Гнолл-сапёр неподалёку держит устройство, которое усиливает каменную броню геоманта. Сейчас вы не сможете его атаковать!_
actors.mobs.gnollgeomancer.desc_sleeping=Этот невероятно длинный гнолл-шаман окружён слоем камня и выглядит почти как статуя. Приглядевшись, вы можете заметить, как камень магически движется в такт дыхания высшего гнолла. Сейчас он не может быть атакован, пока заключён в камень и, видимо, наслаждается глубочайшим сном.\n\nВы можете пробиться сквозь слои камня с помощью кирки, но _удостоверьтесь, что вы готовы перед тем, как делать это._ Геомант, вероятно, является источником витающей здесь магии земли и руководителем всей активности гноллов в этой пещере. _Зачистить это место от гноллов перед боем — отличная идея._
actors.mobs.gnollgeomancer.discover_hint=Вы можете найти этого противника во время определённого задания.

actors.mobs.gnollguard.name=гнолл-страж
actors.mobs.gnollguard.def_verb=блокирует
actors.mobs.gnollguard.spear_warn=Гнолл наносит жестокий удар наконечником своего копья!
actors.mobs.gnollguard.desc=Большой и с виду крепкий гнолл, вооруженный копьем и щитом, но без шлема. Эти стражи, вероятно, громилы на боевой подготовке, призванные защищать шахту от проникающей живности.\n\nГнолл-страж достаточно сильный и может держать копье в одной руке, но не слишком хорошо им владеет. _Для дальнобойной атаки ему потребуется большое открытое пространство, и причиняемый им урон значительно снизится, если подобраться поближе._
actors.mobs.gnollguard.desc_armor=_Гнолл-сапёр неподалёку держит устройство, которое наделяет этого стража земляной бронёй, значительно снижая урон, который он получает._
actors.mobs.gnollguard.discover_hint=Вы можете найти этого противника во время определённого задания.

actors.mobs.gnollsapper.name=гнолл-сапёр
actors.mobs.gnollsapper.desc=Маленький и слабый, но сообразительный гнолл с бледной шерстью и мешком, заполненным различными устройствами. Они здесь чтобы помогать с геологоразведками и добычей тёмного золота, у них есть страж поблизости для защиты. Они способны сражаться, но их атаки ничтожно слабы, не сильнее гнолла-разведчика.\n\nВместо сражения напрямую, сапёры предпочитают использовать имеющиеся у них различные гаджеты, чтобы атаковать каменистой породой. Однако, они не обладают магией земли и пользуются своими гаджетами безрассудно. _Есть множество способов использовать эти атаки против них самих или же их стражей._
actors.mobs.gnollsapper.discover_hint=Вы можете найти этого противника во время определённого задания.

actors.mobs.gnolltrickster.name=гнолл-трикстер
actors.mobs.gnolltrickster.desc=Даже на фоне присущей всем гноллам странности, этот кажется особенно странным. Чуть склонившись вперед с дикой ухмылкой, он едва ли не баюкает перекинутую через плечо сумку. Его глаза полны странной смеси страха и наслаждения.\n\nВ его сумке внушительная коллекция самодельных дротиков, явно покрытых какой-то гадостью.
actors.mobs.gnolltrickster.discover_hint=Вы можете найти этого противника во время определённого задания.

actors.mobs.goldenmimic.name=золотой мимик
actors.mobs.goldenmimic.desc=Мимики - волшебные существа, способные принимать любой облик. В подземельях они почти всегда принимают облик сундука, чтобы заманить ничего не подозревающих путешественников.\n\nЗолотые мимики - более сильные мимики, которые стараются привлечь самых сильных путешественников. У них бывают сокровища получше, но они намного сильнее обычных мимиков.

actors.mobs.golem.name=голем
actors.mobs.golem.def_verb=блокирует
actors.mobs.golem.desc=Големы - попытка исправить изъяны дворфского оборудования путем новооткрытого использования магии. Они намного более компактны и эффективны по сравнению с DM-300, и, в то же время, все еще весьма смертельны.\n\nГолемы, все же, слишком велики, чтобы поместиться в переходы, но дворфы компенсировали это, наделив их новыми магиескими способностями. Големы способны телепортироваться из одного помещения в другое, а также могут телепортировать врагов к себе, если те находятся вне зоны досягаемости.

actors.mobs.goo.name=Слизень
actors.mobs.goo.notice=БУЛЬК-БУЛЬК!
actors.mobs.goo.defeated=бульк... бульк...
actors.mobs.goo.!!!=!!!
actors.mobs.goo.pumpup=Слизень накачивается жижей!
actors.mobs.goo.enraged=в ярости
actors.mobs.goo.gluuurp=БУУУУЛЬК!
actors.mobs.goo.rankings_desc=Поглощён Слизнем
actors.mobs.goo.desc=Мало что известно о Слизне. Возможно, это даже не существо, а сборище мерзких субстанций из канализации, каким-то образом развивших примитивный интеллект. В любом случае, темная магия - вот причина существования Слизня.\n\nЕго желейная субстанция позволяет ему поглощать так много темной энергии, что вы чувствуете озноб, просто находясь рядом. Если Слизень атакует вас этой энергией, долго вам не прожить.

actors.mobs.greatcrab.name=древний краб
actors.mobs.greatcrab.noticed=Краб защищается своей огромной клешнёй.
actors.mobs.greatcrab.def_verb=блокирует
actors.mobs.greatcrab.desc=Этот краб огромен, даже по сравнению с другими сточными крабами. Его синий панцирь покрыт трещинами и прилипалами, выдавая его древний возраст. Он медленно шатается, еле удерживая равновесие со своей гигантской клешнёй.\n\nХоть у краба всего одна клешня, её размер это с лихвой компенсирует. Краб держит клешню перед любой угрозой, защищая себя от атак непробиваемым щитом. Однако, краб не может блокировать атаки, которые он не видит или атаки сразу от нескольких врагов.
actors.mobs.greatcrab.discover_hint=Вы можете найти этого противника во время определённого задания.

actors.mobs.guard.name=тюремный страж
actors.mobs.guard.scorpion=А ну, иди сюда!
actors.mobs.guard.def_verb=блокирует
actors.mobs.guard.desc=Когда-то смотрители тюрьмы, эти стражи давно стали такими же, как заключенные. Как зомби, они бессмысленно бродят по коридорам в поисках того, чего здесь не должно быть - например, вас!\n\nОни носят цепь на поясе, возможно, чтобы притягивать к себе врагов.

actors.mobs.hermitcrab.name=краб-отшельник
actors.mobs.hermitcrab.def_verb=блокирует
actors.mobs.hermitcrab.desc=По какой-то причине этот сточный краб решил носить сломанную верхушку бочки у себя на голове! Дополнительная нагрузка замедлила его до обычной скорости, но также и добавила заметную защиту. Вам слышится, как что-то гремит в бочке...

actors.mobs.mimic.name=мимик
actors.mobs.mimic.reveal=Этот сундук оказался мимиком!
actors.mobs.mimic.hidden_hint=Что-то с этим сундуком не так... Кажется, подойти и попытаться открыть его - не лучшая из идей.
actors.mobs.mimic.desc=Мимики - волшебные существа, способные принимать любой облик. В подземельях они почти всегда принимают облик сундука, чтобы заманить ничего не подозревающих путешественников.\n\nМимики очень больно кусаются, но зато у них, обычно, больше сокровищ чем в нормальных сундуках.
actors.mobs.mimic.discover_hint=Вы можете найти этого противника где угодно в подземелье.

actors.mobs.necromancer.name=некромант
actors.mobs.necromancer.desc=Эти начинающие тёмные маги стеклись в тюрьму, так как это - лучшее место для практикования их тёмного ремесла.\n\nНекроманты будут призывать и улучшать скелетов, которые дерутся на его стороне. Эти скелеты будут существовать только пока жив поднявший их некромант.
actors.mobs.necromancer$necroskeleton.name=скелет некроманта
actors.mobs.necromancer$necroskeleton.desc=Этот скелет был призван некромантом. Он ведет себя как обычный скелет и умрет, когда некромант, вызвавший его, будет убит.

actors.mobs.mob.died=Вы слышите, как вдали кто-то умер.
actors.mobs.mob.rage=#$%^
actors.mobs.mob.rankings_desc=Убит (убийца - %s)
actors.mobs.mob.discover_hint=Вы можете найти этого противника в определённом регионе подземелья.

actors.mobs.monk.name=дворф-монах
actors.mobs.monk.def_verb=блокирует
actors.mobs.monk.parried=парирует
actors.mobs.monk.desc=Эти монахи - фанатики, посвятившие себя защите своего короля физической силой. Их преданность настолько велика, что они полностью предали свое сознание своему королю, и теперь они бродят по городу дворфов как безмозглые зомби.\n\nМонахи полагаются исключительно на рукопашный бой, они используют свои невооруженные кулаки как для атаки, так и для защиты. Когда они сфокусируются, они смогут отразить следующую физическую атаку, направленную против них, даже если та в обычных условиях обязательно попала бы. Монахи быстрее фокусируются в движении и медленнее в прямом бою.
actors.mobs.monk$focus.name=сфокусирован
actors.mobs.monk$focus.desc=Этот монах отлично изучил свою цель и, кажется, предугадывает движения врага прежде, чем он их совершит.\n\nПока он сфокусирован, следующая физическая атака, против этого персонажа гарантированно промахнется, независимо от обстоятельств. Парирование этой атаки потратит фокус монаха, и ему нужно будет снова набрать его, чтобы парировать еще одну атаку. Монахи быстрее фокусируются во время движения.

actors.mobs.phantompiranha.name=призрачная пиранья
actors.mobs.phantompiranha.teleport_away=призрачная пиранья исчезла...
actors.mobs.phantompiranha.desc=Призрачная пиранья - редкая порода пираний с магическими способностями и жуткими полупрозрачными телами. В случае опасности они способны телепортироваться, чтобы убежать или быстро сблизиться со своим врагом!\n\nХоть драться с ними неприятно, мясо призрачных пираний ценится за волшебные свойства.

actors.mobs.piranha.name=гигантская пиранья
actors.mobs.piranha.desc=Этих хищный рыб специально развели для защиты затопленных мест. Их укусы опасны, так что лучше избегать прямого столкновения с ними.
actors.mobs.piranha.discover_hint=Вы можете найти этого противника где угодно в подземелье.

actors.mobs.pylon.name=высоковольтная опора
actors.mobs.pylon.desc_inactive=Высоковольтная опора для управления электричеством, снабжающим местное оборудование.\n\nВ данный момент опора неактивна и невосприимчива к урону.
actors.mobs.pylon.desc_active=Высоковольтная опора для управления электричеством, снабжающим местное оборудование. Опора потрескивает от напряжения - наверняка именно от нее заряжается DM-300!\n\nВ таком состоянии опора уязвима, но выпускает разряды электричества по соседним квадратам по часовой стрелке. Обладая тяжелой металлической конструкцией, опоры выносят большое количество урона.

actors.mobs.rat.name=сумчатая крыса
actors.mobs.rat.desc=Сумчатые крысы - агрессивные, но слабые обитатели канализации. У них противный укус, но опасны они только в больших количествах.

actors.mobs.ripperdemon.name=демон-потрошитель
actors.mobs.ripperdemon.leap=Демон-потрошитель готовится к прыжку!
actors.mobs.ripperdemon.desc=Эти страшные существа - то, для чего демонические силы употребили множество трупов дворфов в этом регионе. Потрошители - чахнущие существа-вурдалаки, похожие на дворфов, но с изломленными телами и длинными, острыми клешнями, сделанными из кости.\n\nДемоны-потрошители не особо выносливы, но они быстры и опасны. Они способны прыгать на длинное расстояние, чтобы быстро добраться до своей цели перед тем, как растерзать ее своими клешнями.

actors.mobs.rotheart.name=сердце гнилоягоды
actors.mobs.rotheart.desc=Плод гнилоягоды уникален. Вместо разложения и образования питательных веществ, плод растет, твердеет и хранит в себе семя. Он обеспечивает защиту органов, растущих внутри фрукта. Эта гигантская сфера обычно и называется сердцем гнилоягоды.
actors.mobs.rotheart.discover_hint=Вы можете найти этого противника во время определённого задания.

actors.mobs.rotlasher.name=плёточник
actors.mobs.rotlasher.desc=Плёточники - часть корневой системы проросшей гнилоягоды, а также её основное средство защиты. Они слепы и не могут перемещаться, но когда они чуют угрозу, атакуют любого, кто окажется рядом. В остальное время они не двигаются, стараясь слиться с окружающей растительностью.
actors.mobs.rotlasher.discover_hint=Вы можете найти этого противника во время определённого задания.

actors.mobs.scorpio.name=скорпид
actors.mobs.scorpio.desc=Эти огромные, паукообразные демонические существа избегают ближний бой, предпочитая стрелять издалека калечащими, зазубренными шипами.

actors.mobs.senior.name=монах-наставник
actors.mobs.senior.desc=Эти монахи - фанатики, посвятившие себя защите своего короля физической силой. Их преданность настолько велика, что они полностью предали свое сознание своему королю, и теперь они бродят по городу дворфов как безмозглые зомби.\n\nЭтот монах полностью освоил искусство рукопашного боя и может сфокусироваться в движении гораздо быстрее, чем обычные монахи. Как только он сфокусируется, он отразит следующую физическую атаку, направленную против него, даже, если та в обычных условиях обязательно попала бы. Монахи быстрее фокусируются в движении и медленнее в прямом бою.

actors.mobs.shaman.name=гнолл-шаман
actors.mobs.shaman.bolt_kill=Вас убила магическая стрела...
actors.mobs.shaman.desc=Гнолл-шаманы - умные гноллы, которые используют боевую магию, компенсируя таким образом недостаток физической силы. В обществе гноллов их почитают несмотря на их выраженную слабость.
actors.mobs.shaman$redshaman.spell_desc=Этот шаман надел красную маску и использует магию, которая временно _ослабит вашу силу атаки._
actors.mobs.shaman$blueshaman.spell_desc=Этот шаман надел синюю маску и использует магию, которая временно _увеличит наносимый вам урон._
actors.mobs.shaman$purpleshaman.spell_desc=Этот шаман надел багряную маску и использует магию, которая временно _снизит вашу меткость и способность уклонения._

actors.mobs.armoredbrute.name=бронированный громила
actors.mobs.armoredbrute.desc=Самые влиятельные гноллы-громилы часто носят мощную броню, чтобы демонстрировать свой статус. Благодаря ей они гораздо более выносливы по отношению к физическому урону, а их более высокий уровень дисциплины означает, что они могут пребывать в ярости гораздо дольше, прежде чем скончаться от своих ран.

actors.mobs.skeleton.name=скелет
actors.mobs.skeleton.explo_kill=Вас убило костяными осколками...
actors.mobs.skeleton.def_verb=блокирует
actors.mobs.skeleton.desc=Скелеты состоят из костей неудачливых путешественников и узников тюрьмы, оживленные влиянием темной магии из глубин. Получив достаточное количество урона, они взрываются костяными осколками. Осколки опасны для всего поблизости, но броня весьма эффективна в снижении урона от осколков.

actors.mobs.slime.name=слизень
actors.mobs.slime.def_verb=блокирует
actors.mobs.slime.desc=Слизни - странные, отчасти магические существа. Они эластичные снаружи и жидкие внутри. Канализация города обеспечивает их водой и питательными веществами.\n\nБлагодаря их растяжимой анатомии, крайне сложно нанести слизню больше чем _6 единиц урона_ за один удар.

actors.mobs.snake.name=сточная змея
actors.mobs.snake.hint=Попробуй использовать кнопку поиска на змеи, чтобы узнать, как с ними бороться.
actors.mobs.snake.desc=Эти огромные змеи способны легко ускользать от ударов, из-за чего по ним сложно попасть. Однако, магические или внезапные атаки застанут их врасплох.\n\nВы можете совершить внезапную атаку, пока змея вас ещё не заметила. Попробуйте заманить ее за собой в дверь и затем _атаковать в момент, когда змея окажется в дверном проёме_.

actors.mobs.spectralnecromancer.name=заклинатель призраков
actors.mobs.spectralnecromancer.desc=В то время как скелеты - основа некромантии, некоторые предпочитают использовать других, менее телесных приспешников. Заклинатели призраков выбрали призраков в качестве своих фаворитов!\n\nОтдельные призраки не так сильны, как скелеты, но эти некроманты не боятся вызывать их целую кучу!

actors.mobs.spinner.name=пещерный прядильщик
actors.mobs.spinner.desc=Эти зеленые и мохнатые пещерные пауки избегают прямой схватки, оставаясь на расстоянии, пока запутавшаяся в их паутине жертва медленно умирает от ядовитого укуса. Они способны выстреливать паутину на большое расстояние и будут пытаться блокировать путь, по которому двигается их жертва.

actors.mobs.statue.name=живая статуя
actors.mobs.statue.def_verb=блокирует
actors.mobs.statue.desc=На первый взгляд это всего лишь одна из неподвижных статуй этого подземелья, но её выдают красные светящиеся глаза.
actors.mobs.statue.desc_weapon=Хотя сама статуя сделана из камня, но _%s_ в её руках выглядит настоящим.
actors.mobs.statue.discover_hint=Вы можете найти этого противника где угодно в подземелье.

actors.mobs.succubus.name=суккуб
actors.mobs.succubus.desc=Суккубы - демоны-оборотни, манипулирующие сознание своей жертвы. Этот принял образ бледного готичного гуманоида, возможно, чтобы привлечь дворфов-чернокнижников?\n\nСуккубы могут временно очаровать противника при атаке, лишая противника способности нанести прямую ответную атаку. Когда суккубы атакуют очарованного врага, они крадут немного его жизненной силы.

actors.mobs.swarm.name=рой мух
actors.mobs.swarm.desc=Смертоносный рой жужжащих мух. Любая немагическая атака разделит его на два не менее опасных роя поменьше.

actors.mobs.tengu.name=Тенгу
actors.mobs.tengu.notice_gotcha=Ну вот я и поймал тебя, %s!
actors.mobs.tengu.interesting=Давай-ка сделаем битву интереснее...
actors.mobs.tengu.notice_have=Словил я наконец тебя, %s!
actors.mobs.tengu.defeated=Наконец-то свободен...
actors.mobs.tengu.rankings_desc=Ликвидирован Тенгу
actors.mobs.tengu.desc=Знаменитый и загадочный убийца, названный по имени той маски, что скрывает его лицо.\n\nТенгу скован большими кандалами на запястьях и ногах, хотя, видимо, от самих цепей он уже давно освободился.\n\nОн попытается использовать ловушки, иллюзии и смертоносные атаки, чтобы убрать единственное препятствие на пути к свободе: вас.

actors.mobs.tengu$bombability$bombblob.desc=Здесь клубится облако обжигающего дыма. Осторожнее, оно скоро взорвётся!
actors.mobs.tengu$bombability$bombitem.name=Дымовая шашка
actors.mobs.tengu$bombability$bombitem.cant_pickup=Оно как будто прибито к земле, вы не можете сдвинуть это!
actors.mobs.tengu$bombability$bombitem.desc=Тенгу бросил сюда странно выглядящую шашку, которая испускает густой горячий дым. Она громко тикает, как будто отсчитывая время для взрыва!\n\nШашка, похоже, приклеилась к полу, поэтому вы не сможете подобрать её.

actors.mobs.tengu$fireability$fireblob.desc=Тенгу распылил здесь какой-то порошок, который собирается воспламениться!

actors.mobs.tengu$shockerability$shockerblob.desc=Воздух здесь искрится от электрических разрядов. Похоже, что на следующий ход здесь ударит молния!
actors.mobs.tengu$shockerability$shockeritem.name=Шокер
actors.mobs.tengu$shockerability$shockeritem.cant_pickup=Слишком опасно поднимать с пола работающий шокер!
actors.mobs.tengu$shockerability$shockeritem.desc=Тенгу бросил сюда любопытное устройство, явно собранное из частей роботов DM-100. Устройство постоянно искрится от электрического заряда, но передвигается только по заданному пути.\n\nУчитывая, что это устройство столь наэлектризовано, вы никак не можете его подобрать.

actors.mobs.thief.name=безумный вор
actors.mobs.thief.stole=Вор украл у вас %s!
actors.mobs.thief.carries=\n\nВор несёт _%s._ Очевидно, украл где-то.
actors.mobs.thief.escapes=Вор скрылся от вас, стащив %s!
actors.mobs.thief.desc=Хотя заключенные свободно ходят вне камер, это место - всё равно их тюрьма. Со временем, помимо свободы, оно забрало и их рассудок. Эти воры и бандиты уже давно забыли, кто они и что они здесь делают.\n\nЭти подлецы предпочитают что-то украсть и убежать, чем сражаться до смерти. Не упускайте их из виду, иначе вы можете никогда больше не увидеть украденное.

actors.mobs.tormentedspirit.name=измученный призрак
actors.mobs.tormentedspirit.desc=Измученные призраки - это добрые духи, которые страдают от проклятия. Они будут атаковать как обычные призраки, но сильнее!\n\nВозможно, получится снять проклятие, использовав правильный предмет рядом с призраком? Если проклятие отступит, то дух будет крайне благодарен...
actors.mobs.tormentedspirit.thank_you=Спасибо тебе...

actors.mobs.vaultrat.desc=Эта крыса претерпела некоторые изменения в поведении, чтобы протестировать новый ИИ противников в подземелье:\n_-_ Ее передвижение может быть "слышно" через стены\n_-_ Она будет бродить по заранее установленному маршруту\n_-_ Во время блужданий ее дальность обнаружения за пределами направления, в котором она движется.\n_-_ Во время сна дальность обнаружения также уменьшается\n_-_ Когда она обнаружит вас, она начинает "исследовать", прежде чем переключиться на охоту. Враги, которые следят за вами, движутся к вам, но не атакуют, и от них легче скрыться за дверями и углами.

actors.mobs.npcs.vaultsentry.name=сканирующий страж хранилища
actors.mobs.npcs.vaultsentry.desc=Этот часовой осматривает местность по заданному пути. _Поскольку это всего лишь тестовая место, если вас обнаружит страж, он ничего не предпримет._

actors.mobs.npcs.vaultlaser.name=лазерный страж хранилища
actors.mobs.npcs.vaultlaser.desc=Этот часовой периодически стреляет лазерами. _Поскольку это всего лишь тестовая место, лазер стража не несет опасность._

actors.mobs.warlock.name=дворф-чернокнижник
actors.mobs.warlock.bolt_kill=Вас убила стрела тьмы...
actors.mobs.warlock.desc=Когда интерес дворфов перешел от инженерии к чародейству, чернокнижники обрели власть в городе. Они начинали со стихийной магии, но вскоре перешли к демонологии и некромантии. Самый сильный из этих чернокнижников захватил престол в городе дворфов, и его пособникам позволили продолжать занятия темной магией, пока они покоряют ему свою свободную волю.\n\nЭти чернокнижники обладают сильной разрушительной магией, они способны временно блокировать магию улучшения, примененную в отношении ваших предметов. Чем более предмет улучшен, тем сильнее на нем скажется это влияние.

actors.mobs.wraith.name=призрак
actors.mobs.wraith.desc=Призрак - это мстительный дух грешника, чья могила была потревожена. Будучи нематериальной сущностью, призрак легко избегает атаки простым оружием.
actors.mobs.wraith.discover_hint=Вы можете найти этого противника где угодно в подземелье.

actors.mobs.yogdzewa.name=Йог-Джева
actors.mobs.yogdzewa.notice=Я. ВИЖУ. ТЕБЯ.
actors.mobs.yogdzewa.darkness=Темнота сгущается вокруг вас...
actors.mobs.yogdzewa.hope=ТВОЯ. НАДЕЖДА. ЭТО. ИЛЛЮЗИЯ!
actors.mobs.yogdzewa.defeated=...
actors.mobs.yogdzewa.rankings_desc=Поглощен богом Йог-Джева
actors.mobs.yogdzewa.desc=Йог-Джева - древний бог; великое чудовище, досягающее до миров смертных и пожирающее их для поддержания своего бесконечного роста. Дворфы, видимо, привлекли внимание этого космического ужаса, когда игрались с темной магией, и с тех пор старались как-то ограничить его влияние.\n\nЙог-Джева обитает в измерении безформенного магического хаоса и не способен воплотить свой истинный облик в настоящем миру. Вместо этого, божество создало своих аватаров и демонических слуг, которые подчиняются его приказам.\n\nЭтот огромный глаз является точкой фокуса силы Йог-Джева в нашем мире. Сам глаз неподвижен, но он способен излучать мощнейшие лучи демонической магии и призывать разные виды слуг на помощь.
actors.mobs.yogdzewa.desc_spawners=Вы чувствуете волны демонической энергии, излучаемые в сторону глаза с этажей выше. Очевидно, что-то, что вы оставили живым там, направляет энергию обратно в Йог-Джеву. _Йог использует эту энергию для призыва более мощных приспешников!_
actors.mobs.yogdzewa$larva.name=личинка бога
actors.mobs.yogdzewa$larva.rankings_desc=Поглощен богом Йог-Джева
actors.mobs.yogdzewa$larva.desc=Эти маленькие отродья Йог-Джевы - простые приспешники, которых легко производить. В одиночку они слабые, но они быстро призываются и могут стать непреодолимыми в большом количестве.
actors.mobs.yogdzewa$yogripper.rankings_desc=Поглощен богом Йог-Джева
actors.mobs.yogdzewa$yogeye.rankings_desc=Поглощен богом Йог-Джева
actors.mobs.yogdzewa$yogscorpio.rankings_desc=Поглощен богом Йог-Джева

actors.mobs.yogfist.invuln_warn=Длань неуязвима, пока находится возле глаза!
actors.mobs.yogfist.rankings_desc=Поглощен богом Йог-Джева
actors.mobs.yogfist.desc=Эта длань является аспектом мощи Йог-Джевы. Длани подвязаны к силе Йог-Джевы, и будут защищены от любого урона, когда находятся возле глаза.
actors.mobs.yogfist$burningfist.name=пылающая длань
actors.mobs.yogfist$burningfist.desc=Эта длань сформирована из хаотичной огненной магии. Пока она передвигается, она постоянно воспламеняет свое окружение. Она также способна стрелять зарядами огненной мощи, которые распространяют пламя на тех местах, куда они попадают.\n\nСпособность длани воспламенять окружение подавлена вблизи воды, но жар, исходящий от нее, заставит воду испариться за короткое время!
actors.mobs.yogfist$soiledfist.name=земляная длань
actors.mobs.yogfist$soiledfist.desc=Эта длань сформирована из хаотической магии земли. Когда она движется, вокруг нее произрастает вегетация. Она также способна стрелять концентрированными земельными зарядами, которые связывают цель быстрорастущими вьюнками и корнями!\n\nЭта длань получает свою силу из этой флоры и выдержит урон в соответствии с тем, сколько высокой или бороздчатой вегетации находится близко от нее!
actors.mobs.yogfist$rottingfist.name=гнилостная длань
actors.mobs.yogfist$rottingfist.desc=Эта длань сформирована из живой порчи. Это огромная масса разлагающейся плоти, способная разбрасывать едкую слизь в ближнем, и отравляющий газ в дальнем бою. Что еще хуже, вместо того, чтобы получать урон напрямую, она получает лишь эффект кровотечения.\n\nС помощью воды можно смыть слизь, однако длань способна поглощать воду и, таким образом, исцелять себя! Кроме того, когда она получает урон во время кровотечения, старый эффект обновляется, но новый притом не накладывается!
actors.mobs.yogfist$rustedfist.name=ржавая длань
actors.mobs.yogfist$rustedfist.desc=Эта длань сформирована из живого металла. Это взгромоздение движущейся массы металла способно мощно атаковать в ближнем бою и калечит свои цели в дальнем. Из-за огромной массы эта длань способна распределить нанесенный ей урон по времени.\n\nЭта длань, однако, негибкая и не помещается в узкие проходы. Кроме того, что она, конечно, несет урон не сразу, отложенный урон увеличивается, если длань терпит попадание несколько раз.
actors.mobs.yogfist$brightfist.name=яркая длань
actors.mobs.yogfist$brightfist.teleport=Длань телепортируется подальше, создавая световую вспышку, которая сильно ослепляет вас!
actors.mobs.yogfist$brightfist.desc=Эта длань сформирована из чистой световой энергии. Она способна каждый ход излучать мощные лучи слепящего света! Эти лучи временно ослепляют и, кроме того, наносят тяжелый урон. Длань также способна на короткое время заливать арену слепящим светом, чтобы скрыться.\n\nУ этой длани, однако, нет особых способностей, которые она могла бы применить в ближнем бою.
actors.mobs.yogfist$darkfist.name=тёмная длань
actors.mobs.yogfist$darkfist.teleport=Длань телепортируется подальше, создавая тёмную вспышку, которая тушит ваш источник света!
actors.mobs.yogfist$darkfist.desc=Эта длань сформирована из чистой темной энергии. Она способна каждый ход излучать мощные лучи темной магии! Эти лучи ослабляют ваш источник света и причиняют тяжелый урон. Длань также способна на короткое время заливать арену темнотой, чтобы скрыться.\n\nУ этой длани, однако, нет особых способностей, которые она могла бы применить в ближнем бою.


actors.char.kill=%s убивает вас...
actors.char.defeat=%s погибает.
actors.char.def_verb=уклоняется
actors.char.invulnerable=неуязвимый
actors.char.immune=устойчивый

# Eternity PD Fallback Keys
actors.blobs.blizzard.desc=A blizzard is swirling here.
actors.blobs.confusiongas.desc=A cloud of confusion gas is swirling here.
actors.blobs.dancefloor.desc=Dance dance dance!\n%s dancing tile: %s\nNext color: %s
actors.blobs.dancefloor.color_1_name=Red
actors.blobs.dancefloor.color_1_desc=Characters standing on this tile take direct damage (massively increased vs hero)
actors.blobs.dancefloor.color_2_name=Green
actors.blobs.dancefloor.color_2_desc=Characters standing on this tile act at 2x speed
actors.blobs.dancefloor.color_3_name=Blue
actors.blobs.dancefloor.color_3_desc=Characters standing on this tile are stunned
actors.blobs.dancefloor.color_4_name=White
actors.blobs.dancefloor.color_4_desc=Characters standing on this tile take defered damage (massively increased vs hero)
actors.blobs.dancefloor.color_5_name=Yellow
actors.blobs.dancefloor.color_5_desc=Mobs killed on this tile give double EXP and more loot
actors.blobs.dancefloor.color_6_name=Purple
actors.blobs.dancefloor.color_6_desc=Characters standing on this tile take double damage
actors.blobs.dancefloor.rankings_desc=Danced into a grave
actors.blobs.dancefloor.ondeath=You danced into your own grave
actors.blobs.dancefloor$dancingdefereddamage.name=Dancing with Death
actors.blobs.dancefloor$dancingdefereddamage.desc=This is the most dangerous dance you've ever performed, and you are absolutely _ROCKING_ it, disregarding the pain!\n\nDeferred damage remaining: %d.
actors.blobs.dancefloor$dancingdefereddamage.ondeath=You danced into your own grave
actors.blobs.dancefloor$dancingdefereddamage.rankings_desc=Danced into a grave
actors.blobs.dancefloor$dancingdoom.name=Dancing in a grave
actors.blobs.dancefloor$dancingdoom.desc=Grave isn't the best place to dance in, but no one is stopping you!\n\nCharacters who are brave enough to dance in a grave will receive double damage from all sources.
actors.blobs.dancefloor$dancespeed.name=Dancing with Time
actors.blobs.dancefloor$dancespeed.desc=Your perfect dance synchronized with a rhythm of the universe, and not even time gonna stop you from dancing!\n\nWhile you dance is perfect, you will perform all actions at double speed.
actors.blobs.dancefloor$dancingstun.name=Stunned
actors.blobs.dancefloor$dancingstun.heromsg=You are stunned!
actors.blobs.dancefloor$dancingstun.desc=Nothing feels worse than being stunned in a middle of a dance\n\nStun completely halts all actions, forcing the target to wait until the effect wears off.
actors.blobs.electricity.desc=A field of electricity is sparking brightly here.
actors.blobs.electricity.rankings_desc=Electrocuted
actors.blobs.electricity.ondeath=You were shocked to death...
actors.blobs.fire.desc=A fire is raging here.
actors.blobs.foliage.desc=Shafts of light pierce the gloom of the underground garden.
actors.blobs.freezing.desc=The air is unnaturally frigid here.
actors.blobs.goowarn.desc=Specks of dark energy are swarming here!
actors.blobs.inferno.desc=An inferno is raging here.
actors.blobs.paralyticgas.desc=A cloud of paralytic gas is swirling here.
actors.blobs.sacrificialfire.desc=There is an altar here with a sacrificial fire burning atop it. Any creature that's killed here will be consumed as an offering to the spirits of the dungeon.\n\nPerhaps a reward will be given if enough sacrifices are made?
actors.blobs.sacrificialfire.worthy=The fire consumes your offering and grows stronger.
actors.blobs.sacrificialfire.unworthy=The fire consumes your offering, but doesn't change.
actors.blobs.sacrificialfire.reward=The fire flares and then dissipates, leaving a reward behind!
actors.blobs.smokescreen.desc=A cloud of thick black smoke is swirling here.
actors.blobs.stenchgas.desc=A cloud of fetid stench is swirling here.
actors.blobs.stormcloud.desc=A cloud of billowing water vapor is swirling here.
actors.blobs.toxicgas.desc=A greenish cloud of toxic gas is swirling here.
actors.blobs.toxicgas.rankings_desc=Suffocated
actors.blobs.toxicgas.ondeath=You died from the toxic gas...
actors.blobs.corrosivegas.desc=A cloud of deadly caustic gas is swirling here.
actors.blobs.waterofawareness.procced=As you take a sip, you feel knowledge pour into your mind.
actors.blobs.waterofawareness.desc=Power of knowledge radiates from the water of this well. Take a sip from it to reveal all secrets of equipped items and reveal all items on the current floor.
actors.blobs.waterofhealth.procced=As you take a sip, you feel your wounds heal completely.
actors.blobs.waterofhealth.desc=Power of health radiates from the water of this well. Take a sip from it to heal your wounds and satisfy hunger.
actors.blobs.wateroftransmutation.desc=Power of change radiates from the water of this well. Throw an item into the well to turn it into something else.
actors.blobs.web.desc=A thick web is covering everything here. Anything that touches or is thrown through the web will break it, but will also be stuck in place.
actors.buffs.adrenaline.name=adrenaline
actors.buffs.adrenaline.desc=A surge of physical power, adrenaline enhanced both attack and movement speed.\n\nAdrenaline allows its target to run at 2x speed, and attack at 1.5x speed.\n\nTurns remaining: %s.
actors.buffs.adrenalinesurge.name=strength boost
actors.buffs.adrenalinesurge.desc=A surge of great might, but sadly not permanent.\n\nStrength boost: +%d.\nTurns until boost weakens: %s.
actors.buffs.amok.name=amok
actors.buffs.amok.desc=Amok causes a state of great rage and confusion in its target.\n\nWhen a creature is amoked, they will attack whatever is near them, whether they be friend or foe.\n\nTurns of amok remaining: %s.
actors.buffs.arcanearmor.name=arcane armor
actors.buffs.arcanearmor.desc=A thin shield is surrounding you, blocking some of the damage from magical attacks.\n\nYour magical armor is currently boosted by: 0-%d.\n\nTurns until arcane armor weakens: %s.
actors.buffs.artifactrecharge.name=artifact recharging
actors.buffs.artifactrecharge.desc=Energy is coursing through you, increasing the rate your equipped artifacts charge.\n\nEach artifact is affected a little differently, but they will all gain charge much faster than normal.\n\nTurns remaining: %s.
actors.buffs.ascensionchallenge.name=amulet's curse
actors.buffs.ascensionchallenge.desc=Somehow Yog-Dzewa is maintaining influence on this world through the amulet, and is trying to stop your ascent!\n\nYog's power is making the dungeon much more dangerous, increasing the number of enemies and making them stronger! This power will keep building if left unchecked, it can be weakened by defeating enemies that have been enhanced by Yog's power.
actors.buffs.ascensionchallenge.desc_clear=The dark energy radiating from the amulet has been weakened as much as possible for now.
actors.buffs.ascensionchallenge.desc_beckon=The amulet is currently _calling out to distant enemies,_ alerting them to your position.
actors.buffs.ascensionchallenge.desc_haste=The amulet is currently _hastening distant enemies,_ letting them reach you faster!
actors.buffs.ascensionchallenge.desc_slow=The amulet is currently _slowing you down,_ and negating speed boosting effects!
actors.buffs.ascensionchallenge.desc_damage=The energy from the amulet has gotten so strong that it's _directly harming you!_
actors.buffs.ascensionchallenge.beckon=The amulet begins calling out to distant enemies.
actors.buffs.ascensionchallenge.haste=The amulet begins hastening distant enemies!
actors.buffs.ascensionchallenge.slow=The amulet starts to feel like a lead weight in your inventory!
actors.buffs.ascensionchallenge.damage=The amulet begins radiating dark energy. It burns!
actors.buffs.ascensionchallenge.weaken_info=You must defeat enemies to weaken the amulet's curse!
actors.buffs.ascensionchallenge.weaken=You can feel the amulet's curse weaken slightly.
actors.buffs.ascensionchallenge.break=You take a moment to catch your breath and feel your wounds begin to close!
actors.buffs.ascensionchallenge.almost=You feel Yog's grip on the amulet begin to weaken, you're almost there!
actors.buffs.ascensionchallenge.on_kill=The dark energy consumes you...
actors.buffs.barkskin.name=barkskin
actors.buffs.barkskin.desc=Your skin is hardened, it feels rough and solid like bark.\n\nThe hardened skin increases your effective armor, allowing you to better defend against physical attack.\n\nYour armor is currently increased by: 0-%d.\nTurns until barkskin weakens: %s.\n\nIf you receive barkskin from multiple sources, only the strongest one will apply.
actors.buffs.barrier.name=barrier
actors.buffs.barrier.desc=A durable bubble of force which blocks all damage.\n\nThe barrier will take damage for whatever it is protecting so long as there is shielding left. The shielding will also slowly decay over time.\n\nShielding remaining: %d.
actors.buffs.rageshield.name=Determination Shield
actors.buffs.rageshield.heromsg=You are protected by your rage!
actors.buffs.rageshield.desc=A durable bubble of your sheer rage saps away life force from nearby enemies, if you are wounded.\n\nThe barrier will drain health from enemies in your sight, angering them and taking damage. The shielding will have bigger effect if enemy is in adjacent to host.\n\nShielding remaining: %d.
actors.buffs.berserk.angered=angered
actors.buffs.berserk.berserk=berserking
actors.buffs.berserk.exhausted=exhausted
actors.buffs.berserk.recovering=recovering
actors.buffs.berserk.angered_desc=The severity of the Berserker's injuries strengthen his blows. As the berserker takes physical damage, his rage will build, granting him bonus damage. Damage which is blocked by armor still counts towards building rage.\n\nRage will fade over time. The lower the berserker's health, the longer it will last.\n\nAt 100%% rage, the Berserker can go berserk, granting him 2x his seal's max shielding, increasing to 6x if he has very low health. This shielding decays over time and once it runs out the berserker will have to rest before building rage again.\n\nCurrent Rage: _%.0f%%_\n_+%.0f%%_ damage
actors.buffs.berserk.berserk_desc=Fear and uncertainty bleed away, leaving only anger. In this state the Berserker is extremely powerful, _dealing +50% damage and gaining bonus shielding._\n\nThis bonus shielding is equal to 2x his seal's max shielding, increasing to 6x if he has very low health. When this shielding is reduced to 0, berserking will end.\n\nAfter raging, the Berserker will need to recover before being able to build rage again.
actors.buffs.berserk.recovering_desc=Inner strength has its limits. The Berserker must rest before using his rage again.\n\nWhile recovering the Berserker does not build any rage from taking damage.
actors.buffs.berserk.recovering_desc_turns=Turns until recovered: _%d_
actors.buffs.berserk.recovering_desc_levels=Levels until recovered: _%.2f_
actors.buffs.berserk.rankings_desc=Berserked to Death
actors.buffs.berserk.action_name=Berserk
actors.buffs.berserk.no_seal=You need your broken seal to berserk!
actors.buffs.bleeding.name=bleeding
actors.buffs.bleeding.ondeath=You bled to death...
actors.buffs.bleeding.heromsg=You are bleeding!
actors.buffs.bleeding.rankings_desc=Bled to Death
actors.buffs.bleeding.desc=That wound is leaking a worrisome amount of blood.\n\nBleeding causes damage every turn. Each turn the damage decreases by a random amount, until the bleeding eventually stops.\n\nCurrent bleed damage: %d.
actors.buffs.bless.name=blessed
actors.buffs.bless.desc=A great burst of focus, some say it is inspired by the gods.\n\nBlessing increases accuracy and evasion by 25%%, making the blessed much more effective in combat.\nIt also increased experience gain by 2x for heroes and allows them to get more items.\n\nTurns of bless remaining: %s.
actors.buffs.blindness.name=blinded
actors.buffs.blindness.heromsg=You are blinded!
actors.buffs.blindness.desc=Blinding turns the surrounding world into a dark haze.\n\nWhile blinded, a character's vision range is reduced to one tile, rendering ranged attacks useless and making it very easy to lose track of distant enemies. Additionally, a blinded hero is unable to read scrolls or books.\n\nTurns of blindness remaining: %s.
actors.buffs.buff.heromsg=
actors.buffs.burning.name=burning
actors.buffs.burning.heromsg=You catch fire!
actors.buffs.burning.burnsup=%s burns up!
actors.buffs.burning.ondeath=You burned to death...
actors.buffs.burning.rankings_desc=Burned to Ash
actors.buffs.burning.desc=Few things are more distressing than being engulfed in flames.\n\nFire will deal damage every turn until it is put out by water or it expires. Fire can be extinquished by stepping into water, or from the splash of a shattering potion.\n\nAdditionally, the fire may ignite flammable terrain or items that it comes into contact with.\n\nTurns of burning remaining: %s.
actors.buffs.championenemy.warn=You sense a deadly presence.
actors.buffs.championenemy$blazing.name=blazing champion
actors.buffs.championenemy$blazing.desc=Blazing champions deal 25% more melee damage, ignite enemies they attack, are immune to fire, and spread fire around them as they die. They can't spread fire onto water however.
actors.buffs.championenemy$projecting.name=projecting champion
actors.buffs.championenemy$projecting.desc=Projecting champions deal 25% more melee damage and have +3 attack range.
actors.buffs.championenemy$antimagic.name=antimagic champion
actors.buffs.championenemy$antimagic.desc=Antimagic champions take 50% less damage and are completely immune to magical effects.
actors.buffs.championenemy$giant.name=giant champion
actors.buffs.championenemy$giant.desc=Giant champions take 80% less damage and have +1 attack range, but cannot move through enclosed spaces.
actors.buffs.championenemy$blessed.name=blessed champion
actors.buffs.championenemy$blessed.desc=Blessed champions have 4x accuracy and evasion.
actors.buffs.championenemy$growing.name=growing champion
actors.buffs.championenemy$growing.desc=Growing champions gain a steadily increasing bonus to accuracy, evasion, physical damage, and a reduction to damage taken.\n\nCurrent acc/eva/dmg boost: %1$d%%\nCurrent damage reduction: %2$d%%
actors.buffs.championenemy$tanky.name=tanky champion
actors.buffs.championenemy$tanky.desc=Tanky champions receives only 5% of the damage, but reduces their damage and speed by 25%.
actors.buffs.championenemy$speedy.name=speedy champion
actors.buffs.championenemy$speedy.desc=Speedy Champions will gain x4 speed and x1.5 evasion and accuracy.
actors.buffs.championenemy$frozen.name=frozen champion
actors.buffs.championenemy$frozen.desc=Frozen champions deal 25% more melee damage but they have -20% speed, chills enemies they attack and sometimes freezes them, are immune to cold gases or effects, and spread blizzard around them as they die.
actors.buffs.championenemy$blunt.name=blunt champion
actors.buffs.championenemy$blunt.desc=Blunt champions are expert for using their hands or something they use as a blunt weapons, they deal 75% more damage as well as inflicts vertigo when they attack and paralyzes you in rare cases.
actors.buffs.charm.name=charmed
actors.buffs.charm.heromsg=You are charmed!
actors.buffs.charm.cant_attack=You are charmed by that enemy and can't attack them.
actors.buffs.charm.desc=A charm is manipulative magic that can make enemies temporarily adore each other.\n\nCharacters affected by charm are unable to directly attack the enemy they are charmed by. Attacking other targets is still possible however. The shock of pain will lessen the duration of charm.\n\nTurns of charm remaining: %s.
actors.buffs.chill.name=chilled
actors.buffs.chill.freezes=%s freezes!
actors.buffs.chill.desc=Not quite frozen, but still much too cold.\n\nChilled targets perform all actions more slowly, depending on how many turns are left in the effect. At its worst, this is equivalent to being slowed.\n\nTurns of chill remaining: %1$s.\nSpeed is reduced by: %2$s%%
actors.buffs.combo.name=combo
actors.buffs.combo.action_name=combo attack
actors.buffs.combo.combo=%d hit combo!
actors.buffs.combo.bad_target=You must target an enemy in attack range.
actors.buffs.combo.prompt=Select a target to attack.
actors.buffs.combo.desc=The gladiator builds momentum as they land successful blows. Each attack increases the combo counter by one, but taking too long between hits will reset the combo counter to 0.\n\nBuilding combo unlocks special combo attacks that cannot miss! A different attack is unlocked at 2, 4, 6, 8, and 10 combo count. Some moves reset combo and some do not, but each move can only be used once per combo session.\n\nCurrent combo: %1$d.\n\nTurns until Combo is lost: %2$s.
actors.buffs.combo$combomove.clobber.name=clobber
actors.buffs.combo$combomove.clobber.desc=Knocks an enemy back 2 tiles, but deals no damage and cannot knock into pits. Increments combo by 1.
actors.buffs.combo$combomove.clobber.empower_desc=Knocks an enemy back _3 tiles, inflicts vertigo, and can knock into pits,_ but deals no damage. Increments combo by 1.
actors.buffs.combo$combomove.slam.name=slam
actors.buffs.combo$combomove.slam.desc=Deals %d%% (combo*20%%) of your damage blocking power as bonus damage. Resets combo when used.
actors.buffs.combo$combomove.slam.empower_desc=_Leaps up to %1$d tile(s)_ and deals %2$d%% (combo*20%%) of your damage blocking power as bonus damage. Resets combo when used.
actors.buffs.combo$combomove.parry.name=parry
actors.buffs.combo$combomove.parry.desc=Blocks the next attack within 1 turn when activated, and instantly retaliates to it. Resets combo if nothing is parried.
actors.buffs.combo$combomove.parry.empower_desc=Blocks _all attacks_ within 1 turn when activated, and instantly retaliates to them. Resets combo if nothing is parried.
actors.buffs.combo$combomove.crush.name=crush
actors.buffs.combo$combomove.crush.desc=Deals %d%% (combo*25%%) damage to the primary target, and half that damage to all other enemies in a 7x7 AOE. Resets combo when used.
actors.buffs.combo$combomove.crush.empower_desc=_Leaps up to %1$d tile(s)_ and deals %2$d%% (combo*25%%) damage to the primary target, and half that damage to all other enemies in a 7x7 AOE. Resets combo when used.
actors.buffs.combo$combomove.fury.name=fury
actors.buffs.combo$combomove.fury.desc=Hits an enemy once for each combo you have, each hit deals 60% damage and can trigger enchantments. Resets combo when used.
actors.buffs.combo$combomove.fury.empower_desc=_Leaps up to %d tile(s)_ and hits an enemy once for each combo you have, each hit deals 60%% damage and can trigger enchantments. Resets combo when used.
actors.buffs.corruption.name=corrupted
actors.buffs.corruption.desc=Corruption seeps into the essence of a being, twisting them against their former nature.\n\nCorrupted creatures will attack their allies, and ignore their former enemies. Corruption is damaging as well, and will slowly cause its target to succumb.\n\nCorruption is permanent, its effects only end in death.
actors.buffs.cripple.name=crippled
actors.buffs.cripple.heromsg=You are crippled!
actors.buffs.cripple.desc=You're pretty sure legs aren't meant to bend that way.\n\nCrippled halves movement speed, making moving a tile usually take two turns instead of one.\n\nTurns of cripple remaining: %s.
actors.buffs.daze.name=dazed
actors.buffs.daze.heromsg=You are dazed!
actors.buffs.daze.desc=Ringing ears and blurred vision make it difficult to fight.\n\nWhile dazed, accuracy and evasion are reduced by 50%%, making both landing and evading blows much harder.\n\nTurns of daze remaining: %s.
actors.buffs.degrade.name=degraded
actors.buffs.degrade.heromsg=Your equipment feels weaker!
actors.buffs.degrade.desc=Powerful dark magic is sapping the strength that scrolls of upgrade have applied to your equipment!\n\nWhile degraded, upgraded gear will be treated as if it is a lower level than it actually is. _Every upgrade after +3 becomes exponentially weaker than the last one._ The descriptions of your items will change to reflect their reduced power level.\n\nDegradation does not affect strength requirements, wand charges, durability of thrown weapons, or artifacts.\n\nTurns of degradation remaining: %s. Using a scroll of upgrade or remove curse will end degradation immediately.
actors.buffs.doom.name=doomed
actors.buffs.doom.desc=It's hard to keep going when it seems like the universe wants you dead.\n\nDoomed characters will receive +67% damage from all sources.\n\nDoom is permanent, its effects only end in death.
actors.buffs.dread.name=dread
actors.buffs.dread.desc=A terror so great that it will cause its target to flee the dungeon entirely!\n\nCreatures affected by dread will run from their opponent at high speed, and will disappear from the dungeon entirely once they are out of sight. Enemies that are defeated this way award half experience and drop no items. The shock of pain will lessen the duration of dread.\n\nTurns of dread remaining: %d.
actors.buffs.drowsy.name=drowsy
actors.buffs.drowsy.desc=A magical force is making it difficult to stay awake, after a few turns, the target will fall into a deep magical sleep.\n\nThe hero can resist drowsiness by taking damage or by being at full health.\n\nTurns until sleep: %s.
actors.buffs.earthimbue.name=imbued with earth
actors.buffs.earthimbue.desc=You are imbued with the power of earth!\n\nAll physical attacks will shift the earth under the enemy, crippling them for a short time.\n\nTurns of earth imbue remaining: %s.
actors.buffs.enhancedrings.name=enhanced rings
actors.buffs.enhancedrings.desc=The Rogue's recently used artifact is empowering his rings, granting them +1 level.\n\nTurns remaining: %s.
actors.buffs.fireimbue.name=imbued with fire
actors.buffs.fireimbue.desc=You are imbued with the power of fire!\n\nAll physical attacks will have a chance to light enemies ablaze. Additionally, you are completely immune to the effects of fire.\n\nTurns of fire imbue remaining: %s.
actors.buffs.foresight.name=foresight
actors.buffs.foresight.desc=You are somehow able to see the layout of surrounding terrain with your mind.\n\nWhile under the effect of foresight all tiles in a wide radius are revealed to you, including any secret traps or doors.\n\nTurns of foresight remaining: %s.
actors.buffs.frost.name=frozen
actors.buffs.frost.freezes=%s freezes!
actors.buffs.frost.desc=Not to be confused with freezing solid, this more benign freezing simply encases the target in ice.\n\nFreezing acts similarly to paralysis, making it impossible for the target to act. Unlike paralysis, freezing is immediately cancelled if the target takes damage, as the ice will shatter.\n\nTurns of freeze remaining: %s.
actors.buffs.frostimbue.name=imbued with frost
actors.buffs.frostimbue.desc=You are imbued with icy power!\n\nAll physical attacks will steadily stack chill on enemies. Additionally, you are completely immune to the cold.\n\nTurns of frost imbue remaining: %s.
actors.buffs.fury.name=furious
actors.buffs.fury.heromsg=You become furious!
actors.buffs.fury.desc=You are angry, enemies won't like you when you're angry.\n\nA great rage burns within you, increasing the damage you deal with physical attacks by 50%%.\n\nThis rage will last as long as you are injured below 50%% health.
actors.buffs.blobimmunity.name=purification barrier
actors.buffs.blobimmunity.desc=Some strange force is encasing you in a thin protective barrier, blocking out all harmful airborne effects.\n\nYou are immune to all area-bound effects while this barrier lasts.\n\nTurns of immunity remaining: %s.
actors.buffs.greaterhaste.name=greater haste
actors.buffs.greaterhaste.desc=An incredible boost of speed, for a moment it feels as if everything else is standing still.\n\nWhile under the effects of greater haste moving actions take no time at all, but other actions are still performed at normal speed. Each step of movement consumes a turn of greater haste.\n\nTurns of greater haste remaining: %d.
actors.buffs.godspeed.name=Godspeed
actors.buffs.godspeed.desc=Godly energy courses through your whole essence, allowing you to perform actions at incredible speeds!\n\nWhile under the effects of godspeed you will perform all actions at double speed.\n\nTurns of godspeed remaining: %s.
actors.buffs.haste.name=haste
actors.buffs.haste.desc=Energy courses through your muscles, allowing you to run at incredible speeds!\n\nWhile under the effects of haste you will run at 3x speed, but will perform all other actions at normal speed.\n\nTurns of haste remaining: %s.
actors.buffs.healing.name=healing
actors.buffs.healing.desc=A magical remedy is causing wounds to close and flesh to knit.\n\nEvery turn health will steadily regenerate until the healing effect expires. The amount of healing may fade over time.\n\nNext heal: %d.\n\nHealing remaining: %d.
actors.buffs.herodisguise.name=disguise
actors.buffs.herodisguise.desc=Illusory magic has altered your physical appearance! The effect is purely cosmetic, but feels very strange regardless.\n\nTurns of disguise remaining: %s.
actors.buffs.hex.name=hexed
actors.buffs.hex.heromsg=You have been hexed!
actors.buffs.hex.desc=Dark magic which saps focus, making the target slightly disoriented.\n\nHexing reduces accuracy and evasion by 20%%, making the target less effective in combat.\n\nTurns of hex remaining: %s.
actors.buffs.holdfast.name=hold fast
actors.buffs.holdfast.desc=The %s is holding his position, increasing their armor by %d-%d. This will last until they move.
actors.buffs.hunger.hungry=hungry
actors.buffs.hunger.starving=starving
actors.buffs.hunger.onhungry=You are hungry.
actors.buffs.hunger.onstarving=You are starving!
actors.buffs.hunger.ondeath=You starved to death...
actors.buffs.hunger.cursedhorn=The cursed horn steals some of the food energy as you eat.
actors.buffs.hunger.rankings_desc=Starved to Death
actors.buffs.hunger.desc_intro_hungry=You can feel your stomach calling out for food, but it's not too urgent yet.
actors.buffs.hunger.desc_intro_starving=You're so hungry it hurts.
actors.buffs.hunger.desc=\n\nHunger slowly increases as you spend time in the dungeon, eventually you will begin to starve. While starving you will slowly lose health instead of regenerating it.\n\nRationing is important! If you have health to spare starving isn't a bad idea if it means there will be more food later. Effective rationing can make food last a lot longer!
actors.buffs.invisibility.name=invisible
actors.buffs.invisibility.desc=You are completely blended into the surrounding terrain, making you impossible to see.\n\nWhile you are invisible enemies are unable to attack or follow you. Physical attacks and magical effects (such as scrolls and wands) will immediately cancel invisibility.\n\nTurns of invisibility remaining: %s.
actors.buffs.invulnerability.name=invulnerable
actors.buffs.invulnerability.desc=You are suffused with great protective power, granting you a brief period of invulnerability!\n\nTurns remaining: %s.
actors.buffs.levitation.name=levitating
actors.buffs.levitation.desc=A magical force is levitating you over the ground, making you feel weightless.\n\nLevitating characters move silently and ignore all ground-based effects. Traps won't trigger, water won't put out fire, plants won't be trampled, roots will miss, and pits will be hovered over. Be careful, as all these things can come into effect the second the levitation ends!\n\nTurns of levitation remaining: %s.
actors.buffs.lifelink.name=life link
actors.buffs.lifelink.desc=This character's life force is linked to another character nearby. Any damage taken is shared between them.\n\nWhenever this character takes damage, half of it will be dealt to the life link target instead.\n\nTurns of life link remaining: %s, or until the linked character dies.
actors.buffs.light.name=illuminated
actors.buffs.light.desc=Even in the Darkest Dungeon, a steady light at your side is always comforting.\n\nLight helps keep darkness at bay, allowing you to see a reasonable distance despite the environment.\n\nTurns of illumination remaining: %s.
actors.buffs.lockedfloor.name=floor is locked
actors.buffs.lockedfloor.desc=The current floor is locked, and you are unable to leave it!\n\nWhile a floor is locked, you will not gain hunger or take damage from starving. In addition, if you do not work towards defeating this floor's boss, passive regeneration effects will also stop.\n\nAdditionally, if you are revived by an unblessed ankh while the floor is locked, then it will reset.\n\nKill this floor's boss to break the lock.
actors.buffs.lostinventory.name=lost inventory
actors.buffs.lostinventory.desc=Your inventory has been lost somewhere in the dungeon! You won't be able to pick up or use most items until you retrieve it.
actors.buffs.magicalsight.name=magical sight
actors.buffs.magicalsight.desc=Somehow you are able to see with your mind, rather than your eyes.\n\nWhile magical sight is active you will be able to see through all terrain in a 12 tile radius.\n\nTurns of magical sight remaining: %s.
actors.buffs.magicalsleep.name=magical sleep
actors.buffs.magicalsleep.toohealthy=You are too healthy, and resist the urge to sleep.
actors.buffs.magicalsleep.fallasleep=You fall into a deep magical sleep.
actors.buffs.magicalsleep.wakeup=You wake up feeling refreshed and healthy.
actors.buffs.magicalsleep.desc=This character has fallen into a deep magical sleep which they will not wake from naturally.\n\nMagical sleep is similar to regular sleep, except that only damage will cause the target to wake up.\n\nFor the hero and their allies, magical sleep has some restorative properties, allowing them to rapidly heal while resting.
actors.buffs.magicimmune.name=immune to magic
actors.buffs.magicimmune.desc=All magical effects have lost their hold on you, you are completely impervious to them.\n\nWhile magic immune all harmful and helpful magical effects will not apply to you, including curses, enchants, wands, scrolls, rings, artifacts, etc. Heroic armor abilities are strong enough to work regardless of this effect.\n\nTurns of magic immunity remaining: %s.
actors.buffs.overload.name=Overload
actors.buffs.overload.desc=The reality is overloaded. Prepare to cry, suffer, kill and slaughter.\n\nThe death of any hostile creature triggers the spawn of other creature.\n\nTurns of overload remaining: %s.
actors.buffs.mindvision.name=mind vision
actors.buffs.mindvision.desc=Somehow you are able to see all creatures on this floor through your mind. It's a weird feeling.\n\nAll characters on this floor are visible to you as long as you have mind vision. Seeing a creature through mind vision counts as it being seen or nearby for the purposes of many magical effects.\n\nTurns of mind vision remaining: %s.
actors.buffs.momentum.momentum=building momentum
actors.buffs.momentum.running=freerunning
actors.buffs.momentum.resting=recovering
actors.buffs.momentum.action_name=freerun
actors.buffs.momentum.momentum_desc=As he moves, the Freerunner builds momentum, which he can spend to start freerunning.\n\nEach charge of momentum grants two turns of freerunning, and the Freerunner can build up to 10 charges. Momentum is rapidly lost when the Freerunner stops moving.\n\nCurrent momentum charge: %d.
actors.buffs.momentum.running_desc=As he moves, the Freerunner builds momentum, which he can spend to start freerunning.\n\nWhile freerunning, the Freerunner moves at double speed and gains bonus evasion based on his level.\n\nTurns remaining: %d.
actors.buffs.momentum.resting_desc=As he moves, the Freerunner builds momentum, which he can spend to start freerunning.\n\nThe Freerunner needs time to regain his stamina before building momentum again.\n\nTurns remaining: %d.
actors.buffs.monkenergy.name=energy
actors.buffs.monkenergy.action=Monk Abilities
actors.buffs.monkenergy.desc=As she defeats enemies, the Monk gains energy that she can use on a variety of abilities. Most enemies grant 1 energy when defeated, and the Monk does not lose energy over time.\n\nCurrent energy: %1$d/%2$d.
actors.buffs.monkenergy.desc_cooldown=The Monk has recently used an ability, and must wait before using another.\n\nCurrent cooldown: %d turns.
actors.buffs.monkenergy$monkability$flurry.name=flurry of blows
actors.buffs.monkenergy$monkability$flurry.desc=Two instant strikes that deal %1$d-%2$d damage and ignore armor. This ability cannot be used repeatedly.
actors.buffs.monkenergy$monkability$flurry.empower_desc=Two instant strikes that deal %1$d-%2$d damage, ignore armor, _and use your weapon's enchantment._ This ability cannot be used repeatedly.
actors.buffs.monkenergy$monkability$focus.name=focus
actors.buffs.monkenergy$monkability$focus.desc=The Monk takes a turn to focus, letting her parry the next attack made against her.
actors.buffs.monkenergy$monkability$focus.empower_desc=The Monk _instantly focuses,_ letting her parry the next attack made against her.
actors.buffs.monkenergy$monkability$focus$focusbuff.name=focused
actors.buffs.monkenergy$monkability$focus$focusbuff.desc=The Monk is focused on her surroundings, anticipating the next attack made against her. While focused, she is guaranteed to parry the next incoming attack.
actors.buffs.monkenergy$monkability$dash.name=dash
actors.buffs.monkenergy$monkability$dash.prompt=Choose a Location
actors.buffs.monkenergy$monkability$dash.desc=An instant dash up to 4 tiles away. This ability can go over hazards, but not through enemies or solid terrain.
actors.buffs.monkenergy$monkability$dash.empower_desc=An instant dash up to _8 tiles_ away. This ability can go over hazards, but not through enemies or solid terrain.
actors.buffs.monkenergy$monkability$dragonkick.name=dragon kick
actors.buffs.monkenergy$monkability$dragonkick.desc=A devastating kick that deals %1$d-%2$d damage and ignores armor. The kick knocks the target away and paralyzes them for each tile they travel.
actors.buffs.monkenergy$monkability$dragonkick.empower_desc=A devastating kick that deals _%1$d-%2$d damage_ and ignores armor. The kick knocks _all adjacent targets_ away and paralyzes them for each tile they travel.
actors.buffs.monkenergy$monkability$meditate.name=meditate
actors.buffs.monkenergy$monkability$meditate.desc=The Monk focuses energy into her body for 5 turns. This clears most negative effects and grants her 8 turns of wand and artifact recharging.
actors.buffs.monkenergy$monkability$meditate.empower_desc=The Monk focuses energy into her body for 5 turns. This clears most negative effects and grants her 8 turns of wand and artifact recharging. _She also gains 80% damage resistance while meditating, and slowly heals for 20% of her missing HP._
actors.buffs.killevolution.name=kill counter
actors.buffs.killevolution.action=Kill Abilities
actors.buffs.killevolution.desc=As they defeat enemies, the hero gains energy that they can use on a variety of abilities. Most enemies grant 1 energy when defeated, and the hero does not lose energy over time.\n\n_However, unequipping a weapon associated with this buff associated with will lose all of this energy and you need to start killing enemies again_\n\nCurrent energy: %1$d/%2$d.
actors.buffs.killevolution.desc_cooldown=The hero has recently used an ability, and must wait before using another.\n\nCurrent cooldown: %d turns.
actors.buffs.killevolution$killevolutionability$invisibledash.name=invisible dash
actors.buffs.killevolution$killevolutionability$invisibledash.prompt=Choose a Location
actors.buffs.killevolution$killevolutionability$invisibledash.desc=An instant dash up to 4 tiles away with an additional turn of invisibility allowing the hero to surprise attack. This ability can go over hazards, but not through enemies or solid terrain.
actors.buffs.killevolution$killevolutionability$invisibledash.empower_desc=An instant dash up to _8 tiles_ away with an additional turn of invisibility allowing the hero to surprise attack. This ability can go over hazards, but not through enemies or solid terrain.
actors.buffs.killevolution$killevolutionability$physicallyempowered.name=physical empower
actors.buffs.killevolution$killevolutionability$physicallyempowered.desc=The hero grants itself +2 bonus damage for 10 hits.
actors.buffs.killevolution$killevolutionability$physicallyempowered.empower_desc=The hero grants itself _+4 bonus damage_ for 10 hits.
actors.buffs.killevolution$killevolutionability$weaponupgrade.name=weapon upgrade
actors.buffs.killevolution$killevolutionability$weaponupgrade.desc=The hero upgrades their weapon (and Duelist's second weapon if there's any) permanently.
actors.buffs.killevolution$killevolutionability$weaponupgrade.empower_desc=The hero upgrades their weapon (and Duelist's second weapon if there's any) _twice_ permanently.
actors.buffs.killevolution$killevolutionability$chain.name=chain enemy
actors.buffs.killevolution$killevolutionability$chain.desc=The hero chains an enemy to pull them in closer range.
actors.buffs.killevolution$killevolutionability$immortalize.name=immortalize
actors.buffs.killevolution$killevolutionability$immortalize.desc=The hero grants itself immortality against all sources of damage for 15 turns.
actors.buffs.killevolution$killevolutionability$immortalize.empower_desc=The hero grants itself immortality against all sources of damage for _~22 turns_.
actors.buffs.ooze.name=caustic ooze
actors.buffs.ooze.heromsg=Caustic ooze eats your flesh. Wash it away!
actors.buffs.ooze.ondeath=You melt away...
actors.buffs.ooze.rankings_desc=Dissolved
actors.buffs.ooze.desc=This sticky acid clings to flesh, slowly melting it away.\n\nOoze will deal consistent damage over time, but can be immediately washed off in water.\n\nTurns of ooze remaining: %s.
actors.buffs.paralysis.name=paralysed
actors.buffs.paralysis.heromsg=You are paralysed!
actors.buffs.paralysis.out=resisted paralysis
actors.buffs.paralysis.desc=Oftentimes the worst thing to do is nothing at all.\n\nParalysis completely halts all actions, forcing the target to wait until the effect wears off. The pain from taking damage can cause characters to resist paralysis, breaking them out of the effect.\n\nTurns of paralysis remaining: %s.
actors.buffs.physicalempower.name=physically empowered
actors.buffs.physicalempower.desc=Your blows have been empowered, increasing the amount of damage you can deal when you hit enemies with physical attacks.\n\nBonus damage: %1$d.\nHits remaining: %2$d.
actors.buffs.pincushion.name=pincushion
actors.buffs.pincushion.desc=The thrown weapons you have used against this character are currently stuck to them and will fall to the floor after they are defeated.\n\nThe following items are currently attached:
actors.buffs.poison.name=poisoned
actors.buffs.poison.heromsg=You are poisoned!
actors.buffs.poison.ondeath=You died from poison...
actors.buffs.poison.rankings_desc=Succumbed to Poison
actors.buffs.poison.desc=Poison works its way through the body, slowly impairing its internal functioning.\n\nPoison deals damage each turn proportional to how long until it expires.\n\nTurns of poison remaining: %s.
actors.buffs.preparation.name=preparation
actors.buffs.preparation.action_name=prepared strike
actors.buffs.preparation.desc=The Assassin is walking nervously, preparing to thurst knife into target.
actors.buffs.preparation.desc_dmg=His next attack will deal _%1$d%% bonus damage_, and will execute regular enemies below _%2$d%% health_, or bosses below _%3$d%% health_.
actors.buffs.preparation.desc_dmg_likely=The attack will also be more likely to deal a larger amount of damage.
actors.buffs.preparation.desc_blink=He is able to blink towards an enemy before striking them, with a max distance of _%d._
actors.buffs.preparation.desc_invis_time=The Assassin has been running for _%d turns._
actors.buffs.preparation.desc_invis_next=His attack will become stronger at _%d turns._
actors.buffs.preparation.prompt=Select a target to attack!\nMax blink distance: %d
actors.buffs.preparation.no_target=There's nothing to attack there.
actors.buffs.preparation.out_of_reach=That target is out of reach.
actors.buffs.preparation.assassinated=assassinated
actors.buffs.marked.name=Marked
actors.buffs.marked.desc=The Hunter is waiting patiently, preparing to strike while his bbat weakens enemies.
actors.buffs.marked.desc_dmg=The bbat deals %s%% more damage to this enemy. You will be able to jump to marked enemy at any moment, but more bonus damage means more debuffs.
actors.buffs.marked.prompt=Select a target to teleport!\nMax blink distance: your view distance
actors.buffs.marked.no_target=There's nothing to teleport there.
actors.buffs.marked.out_of_reach=That target is out of reach.
actors.buffs.marked.assassinated=assassinated
actors.buffs.marked.desc_poison=At this point, you will _poison_ a target, dealing damage over time.
actors.buffs.marked.desc_cripple=At this point, you will _cripple_ the legs of target, reducing its movement speed.
actors.buffs.marked.desc_blinding=At this point, you will also make target _blind_,reducing its field of view to 1 tile.
actors.buffs.marked.desc_bleeding=At this point, you will also make target _bleed_,dealing damage over time.
actors.buffs.marked.desc_vulnerable=At this point, you will also _increase physical damage_ to enemy.
actors.buffs.marked.desc_hexed=At this point, you will also stun target, _reducing its accuracy and dexterity_ for short time.
actors.buffs.marked.desc_slow=At this point, you will also disorientate target, _slowing_ its actions.
actors.buffs.marked.desc_ooze=At this point, you will also apply deadly _caustic ooze_ to target, dealing damage over time until target finds water.
actors.buffs.marked.desc_paralysis=At this point, you will completely _paralyse_ the enemy, rendering it unable to attack.
actors.buffs.marked.desc_doom=At this point, you will also curse the enemy, _significantly increasing any damage to it_.
actors.buffs.prismaticguard.name=prismatic Guard
actors.buffs.prismaticguard.desc=You are being guarded by a prismatic image which is currently inactive. When enemies are present the prismatic image will spring to action and protect you!\n\nWhile inactive, the prismatic image will steadily recover from any damage it has taken.\n\nCurrent HP: %d/%d.
actors.buffs.recharging.name=recharging
actors.buffs.recharging.desc=Energy is coursing through you, improving the rate that your wands and staffs charge.\n\nEach turn this buff will increase current charge by one quarter, in addition to regular recharge.\n\nTurns of recharging remaining: %s.
actors.buffs.revealedarea.name=revealed area
actors.buffs.revealedarea.desc=An area of the dungeon has been temporarily revealed to the hero, They will see it no matter where they are.\n\nTurns remaining: %s.
actors.buffs.revealedchar.name=revealed
actors.buffs.revealedchar.desc=This character is revealed to the hero, They will be visible no matter where they are.\n\nTurns remaining: %s.
actors.buffs.roots.name=rooted
actors.buffs.roots.heromsg=You can't move!
actors.buffs.roots.desc=Roots (magical or natural) grab at the feet, forcing them down to the ground.\n\nRoots lock a target in place, making movement and most movement abilities impossible. Other actions are not affected, including teleportation effects.\n\nTurns of root remaining: %s.
actors.buffs.scrollempower.name=scroll empower
actors.buffs.scrollempower.desc=The energy from the Mage's recently read scroll is empowering his wands!\n\nLevel Boost: +%1$d.\nZaps remaining: %2$d.
actors.buffs.shadows.name=shadowmelded
actors.buffs.shadows.desc=You are blended into the shadows around you, granting you invisibility and slowing your metabolism.\n\nWhile you are invisible enemies are unable to attack or follow you. Most physical attacks and magical effects (such as scrolls and wands) will immediately cancel invisibility. Additionally, while shadowmelded, your rate of hunger is slowed.\n\nYou will remain shadowmelded until you leave the shadows or an enemy comes into contact with you.
actors.buffs.slow.name=slowed
actors.buffs.slow.desc=Slowing magic affects the target's rate of time, to them everything is moving super-fast.\n\nA slowed character performs all actions in twice the amount of time they would normally take.\n\nTurns of slow remaining: %s.
actors.buffs.snipersmark.name=sniper's mark
actors.buffs.snipersmark.action_name_snapshot=snapshot
actors.buffs.snipersmark.action_name_volley=volley
actors.buffs.snipersmark.action_name_sniper=sniper shot
actors.buffs.snipersmark.desc=The Sniper is honed in on the target she most recently attacked. She is able to perform a special attack with her bow which will vary based on how the bow is augmented.\n\nAn unaugmented bow will fire a _snapshot,_ which deals reduced damage but does not take any time to fire.\n\nA bow augmented for speed will fire a _volley_ of three arrows. Each arrow will deal reduced damage, but can still activate enchantment. This volley takes 1 turn to shoot.\n\nA bow augmented for damage will fire a _sniper shot._ This shot is guaranteed to hit, deals bonus damage based on distance from the target, and takes 2 turns to fire.\n\nTurns remaining: %s.
actors.buffs.soulmark.name=soul marked
actors.buffs.soulmark.desc=The warlock has tapped into the soul of this creature, allowing him to heal as it takes physical damage.\n\nTurns of soul mark remaining: %s.
actors.buffs.stamina.name=stamina
actors.buffs.stamina.desc=You have unending stamina, allowing for faster movement!\n\nWhile under the effects of stamina you will run at +50%% speed, but will perform all other actions at normal speed.\n\nTurns of stamina remaining: %s.
actors.buffs.vulnerable.name=vulnerable
actors.buffs.vulnerable.heromsg=You feel fragile!
actors.buffs.vulnerable.desc=Vulnerability magic increases all physical damage that a character takes by 33%%, after that damage has been reduced by armor.\n\nTurns of vulnerable remaining: %s.
actors.buffs.terror.name=terrified
actors.buffs.terror.desc=Terror is manipulative magic which forces its target into an uncontrollable panic.\n\nTerrified characters are forced to run away from their opponent, trying to put as many doors and walls between them as possible. The shock of pain will lessen the duration of terror, however.\n\nTurns of terror remaining: %s.
actors.buffs.toxicimbue.name=imbued with toxicity
actors.buffs.toxicimbue.desc=You are imbued with poisonous energy!\n\nAs you move around toxic gas will constantly billow forth from you, damaging your enemies. You are immune to toxic gas and poison for the duration of the effect, as well as for a few turns afterward.\n\nTurns of toxic imbue remaining: %s.
actors.buffs.corrosion.name=corrosion
actors.buffs.corrosion.heromsg=You are melting!
actors.buffs.corrosion.ondeath=You melt away...
actors.buffs.corrosion.rankings_desc=Dissolved
actors.buffs.corrosion.desc=Powerful acid melts away flesh, metal, and bone at an alarming rate.\n\nCorrosion damage increases over time, as the target continues to melt away.\n\nTurns of corrosion remaining: %1$s.\nCurrent corrosion damage: %2$d.
actors.buffs.vertigo.name=vertigo
actors.buffs.vertigo.desc=Walking in a straight line can be difficult when the whole world is spinning.\n\nWhile under the effects of vertigo, characters who attempt to move will go in a random direction, instead of the one they intended to go in.\n\nTurns of vertigo remaining: %s.
actors.buffs.wandempower.name=wands empowered
actors.buffs.wandempower.desc=Your damage-dealing wands have been empowered, increasing the amount of damage they deal for a few hits.\n\nBonus damage: %1$d.\nHits remaining: %2$d.
actors.buffs.weakness.name=weakened
actors.buffs.weakness.heromsg=You feel weakened!
actors.buffs.weakness.desc=Everything suddenly seems much heavier.\n\nWeakening magic reduces a character's physical strength, causing them to deal 33%% reduced damage.\n\nTurns of weakness remaining: %s.
actors.buffs.wellfed.name=well fed
actors.buffs.wellfed.desc=You feel quite satisfied and full.\n\nWhile well fed, your hunger will not increase, and you will heal an additional amount of health over time.\n\nTurns remaining: %d.
actors.buffs.danceimmunebuff.name=immune to dance curse
actors.buffs.danceimmunebuff.desc=All dancing effects loses all its power for a short time, well extending the effect is not effective, you must wait for this effect to wear down before using the spell again.\n\nTurns of magic immunity remaining: %s.
actors.hero.abilities.armorability.self_target=You can't target yourself!
actors.hero.abilities.armorability.no_target=There's nothing to target there!
actors.hero.abilities.armorability.prompt=Choose a location to target
actors.hero.abilities.armorability.cost=Charge cost: _%d_
actors.hero.abilities.warrior.heroicleap.name=heroic leap
actors.hero.abilities.warrior.heroicleap.prompt=Choose direction to leap
actors.hero.abilities.warrior.heroicleap.short_desc=The Warrior performs a _Heroic Leap_ towards a targeted location, sailing above enemies and hazards.
actors.hero.abilities.warrior.heroicleap.desc=The Warrior leaps toward a targeted location, going over any enemies or hazards in the way. He cannot leap over walls or other solid terrain however.
actors.hero.abilities.warrior.shockwave.name=shockwave
actors.hero.abilities.warrior.shockwave.short_desc=The Warrior releases a _Shockwave_ in a conical AOE by slamming the ground. Enemies caught in the shockwave are damaged and crippled.
actors.hero.abilities.warrior.shockwave.desc=The Warrior slams the ground, producing a shockwave that travels up to 5 tiles in a 60 degree cone.\n\nEnemies caught in this shockwave are crippled for 5 turns. They also take 5-10 damage, plus an additional 1-2 damage for every point of strength the Warrior has above 10.
actors.hero.abilities.warrior.endure.name=endure
actors.hero.abilities.warrior.endure$enduretracker.name=endurance
actors.hero.abilities.warrior.endure$enduretracker.desc=The Warrior is now dealing bonus damage based on the damage he endured.\n\nBonus Damage: %1$d\nHits Left: %2$d
actors.hero.abilities.warrior.endure.short_desc=The Warrior _Endures_, skipping several turns but gaining high damage resistance. He then deals bonus damage based on what he endured.
actors.hero.abilities.warrior.endure.desc=The Warrior endures for 3 turns, taking half damage from all sources. This reduction is applied before damage resisting effects like armor.\n\nAfter enduring, the warrior's next hit within 10 turns gains bonus damage. This bonus damage is equal to half of all the damage inflicted on him while enduring, before any damage reduction effects!\n\nIf the Warrior has any combo, using this ability increases its remaining time by 3 turns.
actors.hero.abilities.mage.elementalblast.name=elemental blast
actors.hero.abilities.mage.elementalblast.no_staff=You can't use this ability without your staff.
actors.hero.abilities.mage.elementalblast.short_desc=The Mage emits an _Elemental Blast_ from his staff, covering a large area around him in an effect that varies based on the wand in his staff.
actors.hero.abilities.mage.elementalblast.desc=The Mage emits a blast of magic, which covers a circular region up to 4 tiles away and deals up to 15-25 damage. The specific effect of elemental blast will vary by the wand imbued in the Mage's staff.
actors.hero.abilities.mage.elementalblast.generic_desc=The effect of elemental blast will be similar to the effect of the wand when zapped at an enemy or ally.
actors.hero.abilities.mage.wildmagic.name=wild magic
actors.hero.abilities.mage.wildmagic.no_wands=You have no wands to zap with!
actors.hero.abilities.mage.wildmagic.short_desc=The Mage unleashes the _Wild Magic_ contained in his wands, randomly firing them multiple times at a chosen target over a single turn.
actors.hero.abilities.mage.wildmagic.desc=The Mage unleashes the power in his wands, randomly firing them up to 4 times in a single turn. The Mage's staff is not included in this effect.\n\nEach wand also has its level boosted by 2, up to +3. This ability uses half a wand charge for each zap, and no one wand can be fired more than 2 times.
actors.hero.abilities.mage.warpbeacon.name=warp beacon
actors.hero.abilities.mage.warpbeacon.depths=You can't warp between depths!
actors.hero.abilities.mage.warpbeacon.locked_floor=You cannot leave a locked floor!
actors.hero.abilities.mage.warpbeacon.too_far=That location is too far!
actors.hero.abilities.mage.warpbeacon.invalid_beacon=You can't place a beacon there!
actors.hero.abilities.mage.warpbeacon.window_desc=Your beacon is currently placed on floor %d.
actors.hero.abilities.mage.warpbeacon.window_tele=teleport to beacon
actors.hero.abilities.mage.warpbeacon.window_clear=clear beacon
actors.hero.abilities.mage.warpbeacon.window_cancel=cancel
actors.hero.abilities.mage.warpbeacon.short_desc=The Mage places a _Warping Beacon_ at his current location, which he can instantly teleport back to.
actors.hero.abilities.mage.warpbeacon.desc=The Mage places a beacon, which can then be warped to at will. Placing the beacon takes 1 turn, but warping to it is instantaneous.\n\nThe Mage cannot warp between floors by default, or use the beacon to reach inaccessible places such as locked rooms. The Mage can teleport into enemies, which will push them aside.
actors.hero.abilities.rogue.smokebomb.name=smoke bomb
actors.hero.abilities.rogue.smokebomb.fov=You can only jump to an empty location in your field of view
actors.hero.abilities.rogue.smokebomb.prompt=Choose a location to jump to
actors.hero.abilities.rogue.smokebomb$ninjalog.name=wooden decoy
actors.hero.abilities.rogue.smokebomb$ninjalog.desc=Somehow, enemies are easily convinced that this wooden decoy is the real Rogue!
actors.hero.abilities.rogue.smokebomb.short_desc=The Rogue throws down a _Smoke Bomb_ while blinking away. He blinds enemies near his old location.
actors.hero.abilities.rogue.smokebomb.desc=The Rogue throws down a smoke bomb and blinks up to 6 tiles away. He can blink through hazards and enemies, but not through solid terrain like walls.\n\nEnemies that are adjacent to the Rogue's old position will be blinded for 5 turns.
actors.hero.abilities.rogue.deathmark.name=death mark
actors.hero.abilities.rogue.deathmark.ally_target=You can only mark enemies
actors.hero.abilities.rogue.deathmark.short_desc=The Rogue places a _Death Mark_ on a chosen enemy. Marked enemies take bonus damage, but cannot die until the mark ends.
actors.hero.abilities.rogue.deathmark.desc=The Rogue places a mark on a chosen enemy, causing them to take 25% extra damage. The mark is applied instantly and lasts for 5 turns.\n\nMarked enemies take bonus damage but are unable to die until the mark expires. If an enemy has 0 HP when the mark ends, they will immediately die.
actors.hero.abilities.rogue.deathmark$deathmarktracker.name=marked for death
actors.hero.abilities.rogue.deathmark$deathmarktracker.desc=This enemy has been marked, causing them to take 25%% bonus damage, but also rendering them unable to die until the mark ends.\n\nTurns remaining: %s.
actors.hero.abilities.rogue.shadowclone.name=shadow clone
actors.hero.abilities.rogue.shadowclone.short_desc=The Rogue summons a _Shadow Clone_, which can be directed to aid him in combat.
actors.hero.abilities.rogue.shadowclone.desc=The Rogue summons a shadowy mimic of himself, which can be directed to aid him in combat. Directing the shadow clone does not cost any charge.\n\nThe clone has 80 HP, no armor, and deals 10-20 damage. All of these traits can be improved with talents, such that the clone benefits from weapons and armor the hero has.
actors.hero.abilities.rogue.shadowclone$shadowally.name=shadow rogue
actors.hero.abilities.rogue.shadowclone$shadowally.direct_defend=Your clone moves to that position.
actors.hero.abilities.rogue.shadowclone$shadowally.direct_follow=Your clone moves to follow you.
actors.hero.abilities.rogue.shadowclone$shadowally.direct_attack=Your clone moves to attack!
actors.hero.abilities.rogue.shadowclone$shadowally.desc=A copy of the Rogue, made from shadowy darkness. It stands stock still, with empty eyes and tiny wisps of darkness rising from it like steam.\n\nThe clone is not a perfect copy of the Rogue, but is still a decent fighter, and can benefit from the Rogue's equipment with the right talents.
actors.hero.abilities.huntress.spectralblades.name=spectral blades
actors.hero.abilities.huntress.spectralblades.short_desc=The Huntress throws _Spectral Blades_ at a target, inflicting damage depending on her currently equipped melee weapon.
actors.hero.abilities.huntress.spectralblades.desc=The Huntress throws out a spectral blade at an enemy, which acts like a ranged strike from her melee weapon. All of the normal effects of a melee weapon will activate, including enchantments.
actors.hero.abilities.huntress.naturespower.name=nature's power
actors.hero.abilities.huntress.naturespower.short_desc=The Huntress calls upon _Nature's Power_, increasing her movement speed and her bow's rate of fire for a short time.
actors.hero.abilities.huntress.naturespower.desc=The Huntress temporarily empowers herself and her bow with the power of nature! This lasts for 8 turns.\n\nDuring this time, the Huntress moves at 2x speed, and attacks 33% faster with her bow. The bonus bow effects do not trigger if the Sniper is using her special attacks.
actors.hero.abilities.huntress.naturespower$naturespowertracker.name=nature's power
actors.hero.abilities.huntress.naturespower$naturespowertracker.desc=The Huntress is briefly empowered, increasing her movement speed and attack speed with her bow.\n\nTurns remaining: %s.
actors.hero.abilities.huntress.spirithawk.name=spirit hawk
actors.hero.abilities.huntress.spirithawk.no_space=There is no free space near you.
actors.hero.abilities.huntress.spirithawk.short_desc=The Huntress summons a _Spirit Hawk_ familiar, which can help her scout locations and distract enemies.
actors.hero.abilities.huntress.spirithawk.desc=The Huntress summons a spirit hawk familiar, which can be directed by using the ability again while it is summoned. The hawk lasts for 100 turns, directing the hawk does not cost any charge.\n\nThe hawk has minimal health and attacking power, but is fast, evasive, and accurate. It shares its entire field of vision with the Huntress at all times. It is immune to all area-bound effects, such as fire and poison gas. It will not attack unless specifically directed to.
actors.hero.abilities.huntress.spirithawk$hawkally.name=spirit hawk
actors.hero.abilities.huntress.spirithawk$hawkally.direct_defend=Your hawk moves to that position.
actors.hero.abilities.huntress.spirithawk$hawkally.direct_follow=Your hawk moves to follow you.
actors.hero.abilities.huntress.spirithawk$hawkally.direct_attack=Your hawk moves to attack!
actors.hero.abilities.huntress.spirithawk$hawkally.desc=A magical hawk, summoned by the Huntress. It glows a bright ethereal blue, its head constantly shifts around as it surveys the area.\n\nWhile it isn't much of a fighter its speed and vision make it excellent for scouting and distracting enemies.
actors.hero.abilities.huntress.spirithawk$hawkally.desc_remaining=Turns remaining: %d.
actors.hero.abilities.huntress.spirithawk$hawkally.desc_dodges=Guaranteed dodges remaining: %d.
actors.hero.abilities.duelist.challenge.name=challenge
actors.hero.abilities.duelist.challenge.prompt=Choose an enemy to challenge
actors.hero.abilities.duelist.challenge.already_dueling=You can only be in one duel at a time.
actors.hero.abilities.duelist.challenge.ally_target=You can only challenge enemies.
actors.hero.abilities.duelist.challenge.unreachable_target=You must be able to reach your target.
actors.hero.abilities.duelist.challenge.distant_target=That enemy is too far away to challenge.
actors.hero.abilities.duelist.challenge.short_desc=The Duelist _Challenges_ a nearby enemy to a duel, temporarily freezing all other enemies.
actors.hero.abilities.duelist.challenge.desc=The Duelist challenges a nearby enemy to a duel. That enemy is compelled to fight her while all other enemies are temporarily frozen in time.\n\nThe target must be reachable and within 5 tiles of the Duelist. The duel lasts until 10 turns pass, the enemy dies, or the Duelist is more than 5 tiles away from the enemy.\n\nFrozen enemies are invulnerable. The Duelist's allies are not frozen by this ability, but if a boss is targeted its minions will not be frozen either.
actors.hero.abilities.duelist.challenge$duelparticipant.name=duel participant
actors.hero.abilities.duelist.challenge$duelparticipant.desc=This character is participating in a duel. They, and any of their allies or minions, are allowed to act normally while others are frozen.\n\nThe duel will last for a set amount of time, until one participant dies, or until the participants move more than 5 tiles away from eachother.\n\nTurns remaining: %d.
actors.hero.abilities.duelist.elementalstrike.name=elemental strike
actors.hero.abilities.duelist.elementalstrike.short_desc=The Duelist performs an _Elemental Strike_, spreading an effect in a conical AOE based on her weapon enchantment.
actors.hero.abilities.duelist.elementalstrike.desc=The Duelist strikes an enemy or location, performing a regular attack that's guaranteed to hit and spreading a magical effect that travels up to 4 tiles in a 65 degree cone. This magical effect varies based on the enchantment on the Duelist's primary weapon.
actors.hero.abilities.duelist.elementalstrike.generic_desc=An elemental strike with no enchantment will release a small burst of magic, dealing 6-12 damage to all enemies in range.
actors.hero.abilities.duelist.feint.name=feint
actors.hero.abilities.duelist.feint.prompt=Choose a location to dash to
actors.hero.abilities.duelist.feint.too_far=That location is not adjacent to you.
actors.hero.abilities.duelist.feint.bad_location=You can't move to that location.
actors.hero.abilities.duelist.feint.short_desc=The Duelist _Feints_, faking an attack while dashing to an adjacent tile. Enemies will attack her afterimage, leaving them open to a counterattack.
actors.hero.abilities.duelist.feint.desc=The Duelist fakes an attack while dashing to an adjacent tile, leaving behind a momentary afterimage of herself. Enemies that were attacking the Duelist will attack her afterimage instead.\n\nEnemies that attack the afterimage become confused, which cancels their next action and leaves them open to a surprise attack.
actors.hero.abilities.ratmogrify.name=ratmogrify
actors.hero.abilities.ratmogrify.cant_transform=You can't ratmogrify that!
actors.hero.abilities.ratmogrify.too_strong=That enemy is too strong to ratmogrify!
actors.hero.abilities.ratmogrify.short_desc=The hero _Ratmogrifies_ an enemy! This temporarily turns them into a rat with no abilities.
actors.hero.abilities.ratmogrify.desc=The hero transforms an enemy into a rat for 6 turns! Bosses, allies, and rats cannot be ratmogrified.\n\nRatmogrified enemies retain their original stats, but do not have any abilities.
actors.hero.abilities.ratmogrify$transmograt.name=ratmogrified %s
actors.hero.abilities.ratmogrify$transmograt.desc=This enemy has been transformed into a rat. A big improvement, if you ask me! - Rat King
actors.hero.abilities.ratmogrify$transmograt.rankings_desc=Slain by: ratmogrified enemy
actors.hero.abilities.ratking.legacywrath.name=divine fury
actors.hero.abilities.ratking.legacywrath.short_desc=I unleash my _Divine Fury_ upon my enemies. It leaves me exposed for a few turns and drains all my armor charge. Everything must come at price!
actors.hero.abilities.ratking.legacywrath.desc=I unlock the ability to channel overwhelming power. With it, I can blink to any nearby location no further than 6 tiles, blinding any enemies adjacent to my old location. Once there, I will cast a spell of magical earth on everyone I can see in 6 tiles area (the effect depends on talents) and create a fan of spectral blades targeting any mob within 6 tiles of me before turning invisible.\n\nThis ability takes 2 turns to leap, 1 turn to rooting earth, and one turn to spectral blades, though using this with no enemies in sight will skip the attacking.\n\nUnfortunately, _I have to use all of my armor charge or 33% of my current HP_ to get enough power for this ability.
actors.hero.hero.name=you
actors.hero.hero.leave=You can't leave yet, the rest of the dungeon awaits below!
actors.hero.hero.level_up=Level up!
actors.hero.hero.new_level=Level up! +Accuracy, +Evasion, +5 HP!
actors.hero.hero.new_talent=+1 Talent Point!
actors.hero.hero.unspent=You have unspent talent points!
actors.hero.hero.level_cap=You cannot grow stronger, but your experiences do give you a surge of power!
actors.hero.hero.you_now_have=you picked up: %s.
actors.hero.hero.you_cant_have=you can't carry: %s.
actors.hero.hero.locked_chest=This chest is locked and you don't have a matching key.
actors.hero.hero.locked_door=You don't have a matching key.
actors.hero.hero.noticed_smth=You noticed something.
actors.hero.hero.wait=...
actors.hero.hero.search=search
actors.hero.hero.search_distracted=It's hard to concentrate, searching is exhausting.
actors.hero.hero.pain_resist=The pain helps you resist the urge to sleep.
actors.hero.hero.revive=The ankh explodes with life-giving energy!
actors.hero.heroclass.warrior=warrior
actors.hero.heroclass.warrior_desc_short=The Warrior endures extra damage with shielding granted by his _broken seal._ The seal can be moved between armors and _transfers a single upgrade._
actors.hero.heroclass.warrior_desc=The Warrior starts with a _unique broken seal_ that generates shielding over his health. The seal can be moved between armors, and can _transfer a single upgrade_ with it.\n\nThe Warrior also starts with a _worn shortsword_, _three throwing stones_, cloth armor, a waterskin, and a velvet pouch.\n\nThe Warrior automatically identifies:\n_-_ Scrolls of Identify\n_-_ Potions of Healing\n_-_ Scrolls of Rage
actors.hero.heroclass.warrior_unlock=The Warrior is automatically unlocked.
actors.hero.heroclass.warrior_perk_desc=The Warrior gains _non-stackable 1 + (5% of current STR rounded down)_ temporary strength within _60 + (5 * current level) turns_ from eating and will be protected from taking any damage for duration of eating.\n\nThe Warrior can blind any enemy for _5 turns_ by throwing non-missiles at it. This ability has _40 turns_ cooldown.\n\nThe Warrior has _15%_ more strength, rounded down.\n\nThe Warrior can transfer any glyphs with his seal.\n\nThe Warrior regenerates his health and shielding _two times_ faster than usual.
actors.hero.heroclass.mage=mage
actors.hero.heroclass.mage_desc_short=The Mage is an arcane expert and carries a _magical staff_ that's stronger than a wand. The staff can be _imbued with any wand_ the Mage finds.
actors.hero.heroclass.mage_desc=The Mage starts with a _unique staff_, which recharges significantly faster than a wand and has 1 more charge. The staff _can be imbued with any wand_ the Mage finds in the dungeon.\n\nThe Mage also starts with a _wand of magic missile_ imbued in his staff, cloth armor, a waterskin, and a velvet pouch.\n\nThe Mage automatically identifies:\n_-_ Scrolls of Identify\n_-_ Potions of Liquid Flame\n_-_ Scrolls of Upgrade
actors.hero.heroclass.mage_unlock=To unlock the Mage _use a scroll of upgrade to make an item stronger._
actors.hero.heroclass.mage_perk_desc=The Mage gets _12 turns_ of recharging from eating.\n\nThe Mage instantly identifies any wands he picks up.\n\nThe Mage can self-target with a wand to convert all of its charges into shielding at a rate of _10.5% max HP per charge_.\n\nWhen the Mage zaps an enemy, he gains mind vision on them for _10 turns_.\n\nWhen the Mage reads a scroll, his next _3 wand zaps_ will get +(hero level/5) levels. He also has _33% chance_ to get scroll from the enemy.
actors.hero.heroclass.rogue=rogue
actors.hero.heroclass.rogue_desc_short=The Rogue can evade enemies and strike from invisibility using his _cloak of shadows._ He also _detects secrets and traps_ from a greater distance.
actors.hero.heroclass.rogue_desc=The Rogue starts with a _unique Cloak of Shadows_, which he can use to become invisible at will.\n\nThe Rogue can _detect secrets and traps_ from a greater distance.\n\nThe Rogue also starts with _a dagger_, _three throwing knives_, cloth armor, a waterskin, and a velvet pouch.\n\nThe Rogue automatically identifies:\n_-_ Scrolls of Identify\n_-_ Potions of Invisibility\n_-_ Scrolls of Magic Mapping
actors.hero.heroclass.rogue_unlock=To unlock the Rogue _perform 10 surprise attacks in one game._
actors.hero.heroclass.rogue_perk_desc=The Rogue will not wake sleeping enemies while he is _3 or more tiles away from them_.\n\nThe Rogue can search in _7x7_ area and will knock adjacent enemies away with chip damage while searching.\n\nThe Rogue can use Cloak of Shadows without equipping it but it will recharge at 66% speed.\n\nOn using Scroll of Upgrade, the Rogue will charge all his wands by _1_ charge and get _10 turns_ worth of artifact recharging.\n\nThe Rogue's bombs deal _150%_ more damage and drop from any enemy with 10% chance.
actors.hero.heroclass.huntress=huntress
actors.hero.heroclass.huntress_desc_short=The Huntress is a master of thrown weapons and has a _magical bow_ with infinite arrows. She also travels through tall grass _without trampling it._
actors.hero.heroclass.huntress_desc=The Huntress starts with a _unique spirit bow_, which can fire an infinite number of conjured arrows.\n\nThe Huntress can travel through tall grass _without trampling it_.\n\nThe Huntress also starts with _studded gloves_, cloth armor, a waterskin, and a velvet pouch.\n\nThe Huntress automatically identifies:\n_-_ Scrolls of Identify\n_-_ Potions of Mind Vision\n_-_ Scrolls of Lullaby
actors.hero.heroclass.huntress_unlock=To unlock the Huntress _hit enemies with thrown weapons 10 times in one game._
actors.hero.heroclass.huntress_perk_desc=The Huntress identifies equipment _3x_ faster.\n\nWhen the Huntress steps on short grass or embers, they spring up into tall grass which the Huntress immediately furrows. This has a _5 turn cooldown_. This talent will produce furrowed grass if passive regeneration effects are disabled or the hero has not gained exp in a long time.\n\nThe Huntress gains mind vision on any enemy within _3 tiles of her position_.\n\nThe Huntress gets _5 turns_ of adrenaline from eating.\n\nThe Huntress has 8% chance to get _1-3_ alchemical energy after killing the enemy.
actors.hero.heroclass.rat_king=rat king
actors.hero.heroclass.rat_king_desc_short=My short description is than I am awesome as king could possibly be!
actors.hero.heroclass.rat_king_desc=Why choose a class when I could just go as myself?\n\nAs myself, I take all the special class items I could find: an old seal, a staff made by some mage, a priceless cloak of shadows from my treasury, and a bow from my armory.\n\nI start with all my class items, obviously. Also I've already acquired all the bags, so I start with those too.\nI can also detect traps and secrets from a greater distance.\
actors.hero.heroclass.rat_king_perk_desc=What? I don't need any help! I am strong enough by myself!
actors.hero.heroclass.duelist=duelist
actors.hero.heroclass.duelist_desc_short=The Duelist is a weapons master who can use her weapon to trigger a _special weapon ability._ This special ability is _different for every weapon._
actors.hero.heroclass.duelist_desc=The Duelist starts with a _unique rapier_ with a special ability that recharges over time.\n\nEvery weapon in the game has a _different special ability_ that the Duelist can use.\n\nThe Duelist also starts with _two throwing spikes_, cloth armor, a waterskin, and a velvet pouch.\n\nThe Duelist automatically identifies:\n_-_ Scrolls of Identify\n_-_ Potions of Strength\n_-_ Scrolls of Mirror Image
actors.hero.heroclass.duelist_unlock=To unlock the Duelist _equip a tier 2 or higher weapon with no strength penalty._
actors.hero.heroclass.duelist_perk_desc=The Duelist gets _2 weapon charge_ and bonus melee damage equal to _level/2_ on eating.\n\nThe Duelist gains one weapon charge every _10 turns_ and deals _+8%_ melee damage when under the effect of wand or artifact recharging buffs.\n\nThe Duelist can switch her equipped weapon instantly _twice within 5 turns_, with a 20 turn cooldown.\nIf this ability is not on cooldown, quick-using an unequipped weapon will equip it.\n\nIf the Duelist's ability manages to kill any enemy, she will restore HP equal to _her level_.\n\nThe Duelist gets _+50%_ enchantment power for her attacks.
actors.hero.herosubclass.gladiator=gladiator
actors.hero.herosubclass.berserker=berserker
actors.hero.herosubclass.berserker_short_desc=The _Berserker_ builds rage as he takes damage. Rage increases his damage and can be activated at 100% for bonus shielding.
actors.hero.herosubclass.berserker_desc=The Berserker gains rage as he takes physical damage, including damage that gets blocked by his armor! Rage steadily fades away over time, but fades more slowly if he is at low HP.\n\nThe Berserker deals up to +50% damage at 100% rage. At 100% rage he can also go berserk, gaining 2-6x his seal's maximum shielding depending on his missing health and keeping his rage at 100% as long as he has shielding left. However, the Berserker needs time to recover after he goes berserk.\n\nHis rage will trigger enchantments and curses up to 60% more frequently and decay much slower.
actors.hero.herosubclass.gladiator_short_desc=The _Gladiator_ builds combo when he makes successful attacks. He can spend combo to use unique abilities.
actors.hero.herosubclass.gladiator_desc=The Gladiator builds one point of combo every time he makes a successful attack with a melee or thrown weapon. If the Gladiator does not make a successful attack within 5 turns, his combo is reset.\n\nAs combo builds it unlocks various abilities which he can spend his combo to use:\n2 Combo: knock enemy back, preserves combo; when combo is 7 or higher, knockback range increases to 3, it inflicts vertigo, and it can knock enemies into pits\n4 Combo: deal damage based on armor\n6 Combo: parry, preserves combo; when combo is 9 or higher, works on multiple attacks\n8 Combo: damage target and nearby enemies\n10 Combo: attack once for each combo\n\nWhen the Gladiator kills an enemy, the combo cooldown for his next hit is increased to _50 turns_.\n\nThe Gladiator can leap up to combo/3 tiles when using combo-spending attacks.
actors.hero.herosubclass.battlemage=battlemage
actors.hero.herosubclass.battlemage_short_desc=The _Battlemage_ conjures bonus effects when fighting in melee with his staff. These effects depend on the wand his staff is imbued with.
actors.hero.herosubclass.battlemage_desc=The Battlemage gains a bonus effect whenever he strikes in melee with his staff, as if his staff had an additional enchantment. These effects depend on the wand his staff is imbued with, every wand has its own effect. In addition to the wand effects, the Battlemage's staff will also gain 0.5 charges when he strikes with it.\n\nThe Battlemage's first melee strike with his staff after zapping with it deals double damage and staff's bonus effect gets +300% power.\n\nStriking with his staff grants the Battlemage _2 turns_ worth of artifact recharging.
actors.hero.herosubclass.warlock=warlock
actors.hero.herosubclass.warlock_short_desc=The _Warlock_ has a chance to soul mark enemies with his wands. He will heal whenever he deals physical damage to marked enemies.
actors.hero.herosubclass.warlock_desc=The Warlock has a chance to inflict a soul mark on characters when he uses wands on them. The chance to apply a soul mark and its duration increase with wand level.\n\nWhen an enemy is soul marked, the Warlock will heal 2 hp for every 5 damage he deals to them, but only with attacks from melee or thrown weapons, not from wands!\n\nWhen a soul marked enemy dies, the Warlock has a _50% chance_ to raise them as a corrupted wraith.\n\nSoul mark grants 1.5 turns of satiety for each physical damage dealt. Soul marked enemies have a 40% chance to trigger on-eat effects when they die.
actors.hero.herosubclass.assassin=hunter
actors.hero.herosubclass.assassin_short_desc=The _Hunter_ marks enemies with his bbat and inflicts debuffs with it.
actors.hero.herosubclass.assassin_desc=The _Hunter_ is trained to control darkness and use it to hunt targets with his bbat. His pet marks enemies and progressively does more damage. When any enemy is marked, the hunter can blink to it, inflicting debuffs and healing bbat depending on strength of mark.
actors.hero.herosubclass.freerunner=freerunner
actors.hero.herosubclass.freerunner_short_desc=The _Freerunner_ builds momentum as he runs, which can be used to start freerunning. This grants him bonus speed and evasion for a short while.
actors.hero.herosubclass.freerunner_desc=As the Freerunner moves he builds stacks of momentum. He can gain up to 10 momentum after running for 10 turns, but rapidly loses it if he stops moving. The freerunner can use up his momentum to start freerunning, for 2 turns per point of momentum.\n\nWhen freerunning the Freerunner moves at 2x speed, and gains bonus evasion in proportion to his level. Once freerunning ends there is a cooldown before momentum can be built again.\n\nWhile freerunning, the Freerunner gains 2x accuracy and +50% damage with thrown weapons.\n\nThe Freerunner moves at 2x speed while invisible, regardless of whether he is freerunning or not.
actors.hero.herosubclass.sniper=sniper
actors.hero.herosubclass.sniper_short_desc=The _Sniper_ can pierce armor with her ranged attacks. After striking with a thrown weapon she can follow up with a special attack from her bow.
actors.hero.herosubclass.sniper_desc=The Sniper is a master of ranged combat, whose ranged attacks pierce enemy armor. When she attacks an enemy with a thrown weapon, she places a sniper's mark on them, which lets her follow up with a special attack from her bow. This special attack varies based on how her bow is augmented.\n\nAn unaugmented bow will fire a snapshot which deals reduced damage but fires instantly. A speed bow will fire a volley of three arrows which deal reduced damage, can still activate enchantments, and take 1 turn to fire. A damage bow will fire a sniper shot which is guaranteed to hit, deals bonus damage based on distance, and takes 2 turns to fire.\n\nThrown weapons have a 100% chance to use the enchantment on the Sniper's bow.\nThis ability does not apply to darts shot from an enchanted crossbow, they already trigger the crossbow's enchantment.\n\nWhen the Sniper attacks with an upgraded thrown weapon, each level increases the duration of sniper's mark by 1 turn and the damage of her special attack by _33%_.
actors.hero.herosubclass.warden=warden
actors.hero.herosubclass.warden_short_desc=The _Warden_ can see through tall grass and gains bonus effects when she plants seeds and tramples plants.
actors.hero.herosubclass.warden_desc=The Warden has a strong connection to nature which grants her a variety of bonus effects relating to grass and plants. She is able to see through tall and furrowed grass as if it were empty space.\n\nThe Warden causes grass to sprout up around any seed she throws or plants, and gains special effects when trampling plants. These special effects replace the regular plant effects, meaning that no plant is harmful for her to step on.\n\nDewdrops can shield the Warden when her health is full, up to _100% of her max HP_.\n\nTipped darts have _5x durability_ when the Warden uses them.
actors.hero.herosubclass.king=rat king
actors.hero.herosubclass.king_short_desc=Choosing is so boring, I'd rather just pick _all the subclasses_...
actors.hero.herosubclass.king_desc=Rat King can use all subclasses at once!\n\nNot all perks are transferred to Rat King's subclass powers.
actors.hero.herosubclass.champion=champion
actors.hero.herosubclass.champion_short_desc=The _Champion_ can wield two weapons and gets more weapon charges. Her regular attacks use her primary weapon, but she can swap weapons and use either weapon's ability.
actors.hero.herosubclass.champion_desc=The Champion is a master of melee weapons who can equip a secondary weapon in addition to her primary one. Her regular attacks use her primary weapon, but she can swap her primary weapon instantly and use either weapon's ability.\n\nShe also gains 2 more max weapon ability charges and +50% weapon ability recharge speed.\n\nIf one of the Champion's two equipped weapons has a lower level and is _the same tier or lower_ than the other weapon, it will be boosted to the other weapon's level.\n\nIf the Champion uses two different weapon abilities successively, the second ability will execute any non-boss enemy left at _below 35% HP_.\n\nThe Champion instantly regains _1 weapon charge_ when she uses two different weapon abilities, with no time limit.
actors.hero.herosubclass.monk=monk
actors.hero.herosubclass.monk_short_desc=The _Monk_ builds energy while fighting. This energy can be spent on a variety of unique abilities.
actors.hero.herosubclass.monk_desc=The Monk is a master of physical technique. As she defeats enemies, she gains energy which can be used on a variety of defensive and utility-focused abilities. This energy does not fade over time, but has a cap based on the Monk's level.\n\n1 Energy: quickly strike with fists\n2 Energy: focus to dodge next attack\n3 Energy: instantly dash nearby\n4 Energy: kick an enemy away\n5 Energy: meditate to restore charges\n\nThe Monk gains _25% more energy_ for each piece of _natural tier 3_ equipment she is using.\nThe Monk gains _50% more energy_ for each piece of _natural tier 2_ equipment she is using.\nThe Monk gains _100%_ for each piece of _natural tier 1_ equipment she is using. She also gains _150% more energy_ if she has no weapon (or ring of force), and gains a free cloth armor and studded gloves.\n\nIf the Monk uses a weapon ability and a _2+ energy_ ability successively, she regains 50% of her spent energy and resets her ability cooldown.\n\nIf the Monk has _70% or more energy_, her abilities are empowered. When empowered:\n- Flurry applies enchantments at 75% power\n- Focus is instantaneous\n- Dash gains +2 range\n- Dragon Kick deals +33% damage and applies its knock back and stun effect to all adjacent enemies\n- Meditate slowly heals 20% of missing HP and grants 80% damage resistance.
actors.hero.talent$provokedangertracker.name=provoked anger
actors.hero.talent$provokedangertracker.desc=The Warrior has recently lost his shielding, his next physical attack will deal bonus damage.\n\nTurns remaining: %s.
actors.hero.talent$lingeringmagictracker.name=lingering magic
actors.hero.talent$lingeringmagictracker.desc=The Mage has recently used a staff or wand, his next physical attack will deal bonus damage.\n\nTurns remaining: %s.
actors.hero.talent$followupstriketracker.name=followup strike
actors.hero.talent$followupstriketracker.desc=The Huntress has recently attacked an enemy with a thrown weapon, her next melee attack against the same target will have boosted damage.\n\nTurns remaining: %s.
actors.hero.talent$patientstriketracker.name=patient strike
actors.hero.talent$patientstriketracker.desc=The Duelist has just spent a turn waiting, her next melee attack will deal bonus damage.
actors.hero.talent$improvisedprojectilecooldown.name=improvised projectiles cooldown
actors.hero.talent$improvisedprojectilecooldown.desc=You have recently used this talent, and must wait before using it again.\n\nTurns remaining: %s.
actors.hero.talent$rejuvenatingstepscooldown.name=rejuvenating steps cooldown
actors.hero.talent$rejuvenatingstepscooldown.desc=You have recently used this talent, and must wait before using it again.\n\nTurns remaining: %s.
actors.hero.talent$seershotcooldown.name=seer shot cooldown
actors.hero.talent$seershotcooldown.desc=You have recently used this talent, and must wait before using it again.\n\nTurns remaining: %s.
actors.hero.talent$aggressivebarriercooldown.name=aggressive barrier cooldown
actors.hero.talent$aggressivebarriercooldown.desc=You have recently used this talent, and must wait before using it again.\n\nTurns remaining: %s.
actors.hero.talent$liquidagilacctracker.name=liquid agility
actors.hero.talent$liquidagilacctracker.desc=The Duelist's next regular melee attack will gain bonus accuracy.\n\nTurns remaining: %s.
actors.hero.talent$lethalhastecooldown.name=lethal haste cooldown
actors.hero.talent$lethalhastecooldown.desc=You have recently used this talent, and must wait before using it again.\n\nTurns remaining: %s.
actors.hero.talent$swiftequipcooldown.name=swift equip cooldown
actors.hero.talent$swiftequipcooldown.desc=You have recently used this talent, and must wait before using it again.\n\nTurns remaining: %s.
actors.hero.talent$preciseassaulttracker.name=precise assault
actors.hero.talent$preciseassaulttracker.desc=The Duelist's next regular melee attack will gain bonus accuracy.\n\nTurns remaining: %s.
actors.hero.talent$deadlyfollowuptracker.name=deadly followup
actors.hero.talent$deadlyfollowuptracker.desc=The Duelist has recently attacked an enemy with a thrown weapon, her melee attacks against the same target will have boosted damage.\n\nTurns remaining: %s.
actors.hero.talent$combinedlethalityabilitytracker.executed=executed
actors.hero.talent.hearty_meal.title=hearty meal
actors.hero.talent.hearty_meal.desc=_+1:_ Eating food heals the Warrior for _3 HP_ when he is at or below 30% health.\n\n_+2:_ Eating food heals the Warrior for _5 HP_ when he is at or below 30% health.
actors.hero.talent.veterans_intuition.title=veteran's intuition
actors.hero.talent.veterans_intuition.desc=_+1:_ The Warrior identifies weapons _1.75x faster_ and armor _2.5x faster_.\n\n_+2:_ The Warrior identifies weapons _2.5x faster_ and armor _when he equips it_.
actors.hero.talent.provoked_anger.title=provoked anger
actors.hero.talent.provoked_anger.desc=_+1:_ When the Warrior's shielding breaks, his next physical attack will deal _2 bonus damage_.\n\n_+2:_ When the Warrior's shielding breaks, his next physical attack will deal _3 bonus damage_.
actors.hero.talent.iron_will.title=iron will
actors.hero.talent.iron_will.desc=_+1:_ The max shield provided by the Warrior's seal is _increased by 1_.\n\n_+2:_ The max shield provided by the Warrior's seal is _increased by 2_.
actors.hero.talent.iron_will.meta_desc=_If this talent is gained by a different hero_ it will grant its shielding benefit without the broken seal.
actors.hero.talent.iron_stomach.title=iron stomach
actors.hero.talent.iron_stomach.desc=_+1:_ Eating food takes the Warrior 1 turn and grants him _75% damage resistance_ while eating.\n\n_+2:_ Eating food takes the Warrior 1 turn and grants him _100% damage resistance_ while eating.
actors.hero.talent.liquid_willpower.title=liquid willpower
actors.hero.talent.liquid_willpower.desc=_+1:_ The Warrior instantly regains _50% of the shielding_ from his broken seal when drinking or throwing a potion, brew, or elixir.\n\n_+2:_ The Warrior instantly regains _75% of the shielding_ from his broken seal when drinking or throwing a potion, brew, or elixir.\n\nThe shield regeneration effect is doubled when using potions of strength, experience, or alchemy items that must be crafted using those potions.\n\nFor alchemy items with higher output quantities (e.g. aqua brew), this talent has a chance to trigger based on how many of that item is produced.
actors.hero.talent.liquid_willpower.meta_desc=_If this talent is gained by a different hero_ it will instead grant shielding equal to 5% max hp at +1, or 7.5% max hp at +2.
actors.hero.talent.runic_transference.title=runic transference
actors.hero.talent.runic_transference.desc=_+1:_ The Warrior's broken seal can transfer _regular glyphs_ in the same way it transfers an upgrade.\n\n_+2:_ The Warrior's broken seal can transfer _regular, powerful, and curse glyphs_ in the same way it transfers an upgrade.\n\nThe seal can only transfer glyphs if they were applied to the armor when the seal was attached.
actors.hero.talent.runic_transference.meta_desc=_If this talent is gained by a different hero_ it will instead help glyphs on your armor resist being removed by scrolls of upgrade. Glyphs will begin to be lost when upgrading from level 6(up from 4) at +1, or level 7(up from 4) at +2. The level where glyphs are guaranteed to be lost is unchanged at +8.
actors.hero.talent.lethal_momentum.title=lethal momentum
actors.hero.talent.lethal_momentum.desc=_+1:_ When the Warrior lands a killing blow on an enemy with a physical weapon, it has a _67% chance_ to take 0 turns.\n\n_+2:_ When the Warrior lands a killing blow on an enemy with a physical weapon, it has a _100% chance_ to take 0 turns.
actors.hero.talent.improvised_projectiles.title=improvised projectiles
actors.hero.talent.improvised_projectiles.desc=_+1:_ The Warrior can blind an enemy for _2 turns_ by throwing any item that isn’t a thrown weapon at them. This has a 50 turn cooldown.\n\n_+2:_ The Warrior can blind an enemy for _3 turns_ by throwing any item that isn’t a thrown weapon at them. This has a 50 turn cooldown.
actors.hero.talent.hold_fast.title=hold fast
actors.hero.talent.hold_fast.desc=_+1:_ When the Warrior waits he gains _1-2 armor_ until he moves.\n\n_+2:_ When the Warrior waits he gains _2-4 armor_ until he moves.\n\n_+3:_ When the Warrior waits he gains _3-6 armor_ until he moves.
actors.hero.talent.strongman.title=strongman
actors.hero.talent.strongman.desc=_+1:_ The Warrior's strength is _increased by 8%_, rounded down.\n\n_+2:_ The Warrior's strength is _increased by 13%_, rounded down.\n\n_+3:_ The Warrior's strength is _increased by 18%_, rounded down.
actors.hero.talent.endless_rage.title=endless rage
actors.hero.talent.endless_rage.desc=_+1:_ The Berserker can reach a max of _116% rage_.\n\n_+2:_ The Berserker can reach a max of _133% rage_.\n\n_+3:_ The Berserker can reach a max of _150% rage_.\n\nEach point of rage above 100% increases berserk shielding by 1% and reduces cooldown by 1%, but does not increase the damage bonus beyond +50%.
actors.hero.talent.deathless_fury.title=deathless fury
actors.hero.talent.deathless_fury.desc=_+1:_ Berserk automatically triggers if the Berserker is about to die and rage is at or above 100%, but it has a cooldown of _3 hero levels_ when this happens.\n\n_+2:_ Berserk automatically triggers if the Berserker is about to die and rage is at or above 100%, but it has a cooldown of _2 hero levels_ when this happens.\n\n_+3:_ Berserk automatically triggers if the Berserker is about to die and rage is at or above 100%, but it has a cooldown of _1 hero level_ when this happens.\n\nNote that the Berserker will still die if he has 0 HP when berserking ends.
actors.hero.talent.enraged_catalyst.title=enraged catalyst
actors.hero.talent.enraged_catalyst.desc=_+1:_ Enchantments and curses on the Berserker's weapon trigger more often the more rage he has, to a maximum of _15% more often_ at 100% rage.\n\n_+2:_ Enchantments and curses on the Berserker's weapon trigger more often the more rage he has, to a maximum of _30% more often_ at 100% rage.\n\n_+3:_ Enchantments and curses on the Berserker's weapon trigger more often the more rage he has, to a maximum of _45% more often_ at 100% rage.
actors.hero.talent.cleave.title=cleave
actors.hero.talent.cleave.desc=_+1:_ When the Gladiator kills an enemy, the combo cooldown for his next hit is increased to _15 turns_.\n\n_+2:_ When the Gladiator kills an enemy, the combo cooldown for his next hit is increased to _30 turns_.\n\n_+3:_ When the Gladiator kills an enemy, the combo cooldown for his next hit is increased to _45 turns_.
actors.hero.talent.lethal_defense.title=lethal defense
actors.hero.talent.lethal_defense.desc=_+1:_ When the Gladiator kills an enemy with a combo move, he _regains 33%_ of the broken seal's shielding.\n\n_+2:_ When the Gladiator kills an enemy with a combo move, he _regains 67%_ of the broken seal's shielding.\n\n_+3:_ When the Gladiator kills an enemy with a combo move, he _regains 100%_ of the broken seal's shielding.
actors.hero.talent.enhanced_combo.title=enhanced combo
actors.hero.talent.enhanced_combo.desc=_+1:_ When the Gladiator's combo is 7 or higher, Clobber's knockback range increases to 3, it inflicts vertigo, and it can knock enemies into pits.\n\n_+2:_ In addition to the benefits of +1, when the Gladiator's combo is 9 or higher Parry works on multiple attacks.\n\n_+3:_ In addition to the benefits of +1 and +2, the Gladiator can leap up to combo/3 tiles when using Slam, Crush, or Fury.
actors.hero.talent.body_slam.title=body slam
actors.hero.talent.body_slam.desc=_+1:_ When the Warrior lands after jumping, all adjacent enemies take damage equal to _1-4 plus 25%_ of his damage blocking power.\n\n_+2:_ When the Warrior lands after jumping, all adjacent enemies take damage equal to _2-8 plus 50%_ of his damage blocking power.\n\n_+3:_ When the Warrior lands after jumping, all adjacent enemies take damage equal to _3-12 plus 75%_ of his damage blocking power.\n\n_+4:_ When the Warrior lands after jumping, all adjacent enemies take damage equal to _4-16 plus 100%_ of his damage blocking power.
actors.hero.talent.impact_wave.title=impact wave
actors.hero.talent.impact_wave.desc=_+1:_ When the Warrior lands after jumping, all adjacent enemies are knocked _2 tiles_ back and have a _25% chance_ of becoming vulnerable for 5 turns.\n\n_+2:_ When the Warrior lands after jumping, all adjacent enemies are knocked _3 tiles_ back and have a _50% chance_ of becoming vulnerable for 5 turns.\n\n_+3:_ When the Warrior lands after jumping, all adjacent enemies are knocked _4 tiles_ back and have a _75% chance_ of becoming vulnerable for 5 turns.\n\n_+4:_ When the Warrior lands after jumping, all adjacent enemies are knocked _5 tiles_ back and have a _100% chance_ of becoming vulnerable for 5 turns.
actors.hero.talent.double_jump.title=double jump
actors.hero.talent.double_jump.desc=_+1:_ If the Warrior performs a second leap within 3 turns, that leap has a _16% reduced_ charge cost.\n\n_+2:_ If the Warrior performs a second leap within 3 turns, that leap has a _30% reduced_ charge cost.\n\n_+3:_ If the Warrior performs a second leap within 3 turns, that leap has a _40% reduced_ charge cost.\n\n_+4:_ If the Warrior performs a second leap within 3 turns, that leap has a _50% reduced_ charge cost.
actors.hero.talent.expanding_wave.title=expanding wave
actors.hero.talent.expanding_wave.desc=_+1:_ Shockwave's range is increased to _6 tiles_ from 5, and its width is increased to _75 degrees_ from 60.\n\n_+2:_ Shockwave's range is increased to _7 tiles_ from 5, and its width is increased to _90 degrees_ from 60.\n\n_+3:_ Shockwave's range is increased to _8 tiles_ from 5, and its width is increased to _105 degrees_ from 60.\n\n_+4:_ Shockwave's range is increased to _9 tiles_ from 5, and its width is increased to _120 degrees_ from 60.
actors.hero.talent.striking_wave.title=striking wave
actors.hero.talent.striking_wave.desc=_+1:_ Shockwave has a _30% chance_ to also use on-hit effects like enchantments and combo.\n\n_+2:_ Shockwave has a _60% chance_ to also use on-hit effects like enchantments and combo.\n\n_+3:_ Shockwave has a _90% chance_ to also use on-hit effects like enchantments and combo.\n\n_+4:_ Shockwave has a _100% chance_ to also use on-hit effects like enchantments and combo, and it gives enchantments _+20% power_.
actors.hero.talent.shock_force.title=shock force
actors.hero.talent.shock_force.desc=_+1:_ Shockwave deals _20% more damage_ and has a _25% chance_ to stun instead of cripple.\n\n_+2:_ Shockwave deals _40% more damage_ and has a _50% chance_ to stun instead of cripple.\n\n_+3:_ Shockwave deals _60% more damage_ and has a _75% chance_ to stun instead of cripple.\n\n_+4:_ Shockwave deals _80% more damage_ and has a _100% chance_ to stun instead of cripple.
actors.hero.talent.sustained_retribution.title=sustained retribution
actors.hero.talent.sustained_retribution.desc=_+1:_ The Warrior deals _115% bonus damage_ spread over _2 hits_, instead of 100% bonus damage in 1 hit.\n\n_+2:_ The Warrior deals _130% bonus damage_ spread over _3 hits_, instead of 100% bonus damage in 1 hit.\n\n_+3:_ The Warrior deals _145% bonus damage_ spread over _4 hits_, instead of 100% bonus damage in 1 hit.\n\n_+4:_ The Warrior deals _160% bonus damage_ spread over _5 hits_, instead of 100% bonus damage in 1 hit.
actors.hero.talent.shrug_it_off.title=shrug it off
actors.hero.talent.shrug_it_off.desc=_+1:_ The Warrior's damage reduction while enduring is _increased to 60%_, from 50%.\n\n_+2:_ The Warrior's damage reduction while enduring is _increased to 68%_, from 50%.\n\n_+3:_ The Warrior's damage reduction while enduring is _increased to 74%_, from 50%.\n\n_+4:_ The Warrior's damage reduction while enduring is _increased to 80%_, from 50%.
actors.hero.talent.even_the_odds.title=even the odds
actors.hero.talent.even_the_odds.desc=_+1:_ The Warrior deals an additional _5% bonus damage_ for every enemy within 2 tiles when enduring ends.\n\n_+2:_ The Warrior deals an additional _10% bonus damage_ for every enemy within 2 tiles when enduring ends.\n\n_+3:_ The Warrior deals an additional _15% bonus damage_ for every enemy within 2 tiles when enduring ends.\n\n_+4:_ The Warrior deals an additional _20% bonus damage_ for every enemy within 2 tiles when enduring ends.
actors.hero.talent.empowering_meal.title=empowering meal
actors.hero.talent.empowering_meal.desc=_+1:_ Eating food grants the Mage _2 bonus damage_ on the next 3 times he deals damage with a wand.\n\n_+2:_ Eating food grants the Mage _3 bonus damage_ on the next 3 times he deals damage with a wand.
actors.hero.talent.scholars_intuition.title=scholar's intuition
actors.hero.talent.scholars_intuition.desc=_+1:_ The Mage identifies wands _3x faster_.\n\n_+2:_ The Mage identifies wands _when he uses them_.
actors.hero.talent.lingering_magic.title=lingering magic
actors.hero.talent.lingering_magic.desc=_+1:_ When the Mage zaps with a wand or staff, his next physical attack deals _1-2 bonus damage_.\n\n_+2:_ When the Mage zaps with a wand or staff, his next physical attack deals _2 bonus damage_.
actors.hero.talent.backup_barrier.title=backup barrier
actors.hero.talent.backup_barrier.desc=_+1:_ The Mage gains _3 shielding_ whenever he spends the last charge in his staff.\n\n_+2:_ The Mage gains _5 shielding_ whenever he spends the last charge in his staff.
actors.hero.talent.backup_barrier.meta_desc=_If this talent is gained by a different hero_ it will instead trigger from the hero's highest level wand.
actors.hero.talent.energizing_meal.title=energizing meal
actors.hero.talent.energizing_meal.desc=_+1:_ Eating food takes the Mage 1 turn and grants him _5 turns of wand recharging_.\n\n_+2:_ Eating food takes the Mage 1 turn and grants him _8 turns of wand recharging_.
actors.hero.talent.inscribed_power.title=inscribed power
actors.hero.talent.inscribed_power.desc=_+1:_ When the Mage reads a scroll or uses a spell item, his _next 2 wand zaps_ get +2 levels.\n\n_+2:_ When the Mage reads a scroll or uses a spell item, his _next 3 wand zaps_ get +2 levels.\n\nThe number of enhanced wand zaps is doubled when using a scroll of upgrade, transmutation, or alchemy items that must be crafted using those scrolls.\n\nFor alchemy items with higher output quantities (e.g. most spells), this talent has a chance to trigger based on how many of that item is produced.
actors.hero.talent.wand_preservation.title=wand preservation
actors.hero.talent.wand_preservation.desc=_+1:_ When the Mage imbues a new wand into his staff, the old wand is returned at +0, _but this can only be done once._\n\n_+2:_ When the Mage imbues a new wand into his staff, the old wand is returned at +0, _this can be done once per hero level._
actors.hero.talent.wand_preservation.meta_desc=_If this talent is gained by a different hero_ it will instead increase the amount of arcane resin gained when putting a wand into an alchemy pot by 1 at +1, or by 2 at +2.
actors.hero.talent.arcane_vision.title=arcane vision
actors.hero.talent.arcane_vision.desc=_+1:_ When the Mage zaps an enemy, he gains mind vision on them for _10 turns_.\n\n_+2:_ When the Mage zaps an enemy, he gains mind vision on them for _15 turns_.
actors.hero.talent.shield_battery.title=shield battery
actors.hero.talent.shield_battery.desc=_+1:_ The Mage can self-target with a wand to convert all of its charges into shielding at a rate of _4% max HP per charge_.\n\n_+2:_ The Mage can self-target with a wand to convert all of its charges into shielding at a rate of _6% max HP per charge_.
actors.hero.talent.desperate_power.title=desperate power
actors.hero.talent.desperate_power.desc=_+1:_ The Mage's wands and staff gain _+1 level_ on their final zap when they are down to their last charge.\n\n_+2:_ The Mage's wands and staff gain _+2 levels_ on their final zap when they are down to their last charge.\n\n_+3:_ The Mage's wands and staff gain _+3 levels_ on their final zap when they are down to their last charge.
actors.hero.talent.ally_warp.title=ally warp
actors.hero.talent.ally_warp.desc=_+1:_ The Mage can select an ally to instantly swap places with them, with a _2 tile range_.\n\n_+2:_ The Mage can select an ally to instantly swap places with them, with a _4 tile range_.\n\n_+3:_ The Mage can select an ally to instantly swap places with them, with a _6 tile range_.\n\nThe Mage cannot swap places with immobile allies.
actors.hero.talent.empowered_strike.title=empowered strike
actors.hero.talent.empowered_strike.desc=_+1:_ The Battlemage's first melee strike with his staff after zapping with it deals _+16% damage_ and the staff's bonus effect gets _+50% power_.\n\n_+2:_ The Battlemage's first melee strike with his staff after zapping with it deals _+33% damage_ and the staff's bonus effect gets _+100% power_.\n\n_+3:_ The Battlemage's first melee strike with his staff after zapping with it deals _+50% damage_ and the staff's bonus effect gets _+150% power_.
actors.hero.talent.mystical_charge.title=mystical charge
actors.hero.talent.mystical_charge.desc=_+1:_ Striking with his staff grants the Battlemage _0.5 turns_ worth of artifact recharging.\n\n_+2:_ Striking with his staff grants the Battlemage _1 turn_ worth of artifact recharging.\n\n_+3:_ Striking with his staff grants the Battlemage _1.5 turns_ worth of artifact recharging.
actors.hero.talent.excess_charge.title=excess charge
actors.hero.talent.excess_charge.desc=_+1:_ When the Battlemage's staff is fully charged, its next zap will grant him _0.67 shielding_ per level of the staff.\n\n_+2:_ When the Battlemage's staff is fully charged, its next zap will grant him _1.33 shielding_ per level of the staff.\n\n_+3:_ When the Battlemage's staff is fully charged, its next zap will grant him _2 shielding_ per level of the staff.
actors.hero.talent.soul_siphon.title=soul siphon
actors.hero.talent.soul_siphon.desc=_+1:_ Physical damage dealt by other characters triggers the Warlock's soul mark at _13% effectiveness_.\n\n_+2:_ Physical damage dealt by other characters triggers the Warlock's soul mark at _27% effectiveness_.\n\n_+3:_ Physical damage dealt by other characters triggers the Warlock's soul mark at _40% effectiveness_.
actors.hero.talent.soul_eater.title=soul eater
actors.hero.talent.soul_eater.desc=_+1:_ Soul mark grants _0.33 turns_ of satiety for each physical damage dealt. Soul marked enemies have a _10% chance_ to trigger on-eat effects when they die.\n\n_+2:_ Soul mark grants _0.67 turns_ of satiety for each physical damage dealt. Soul marked enemies have a _20% chance_ to trigger on-eat effects when they die.\n\n_+3:_ Soul mark grants _1 turn_ of satiety for each physical damage dealt. Soul marked enemies have a _30% chance_ to trigger on-eat effects when they die.
actors.hero.talent.necromancers_minions.title=necromancer's minions
actors.hero.talent.necromancers_minions.desc=_+1:_ When a soul marked enemy dies, the Warlock has a _13% chance_ to raise them as a corrupted wraith.\n\n_+2:_ When a soul marked enemy dies, the Warlock has a _27% chance_ to raise them as a corrupted wraith.\n\n_+3:_ When a soul marked enemy dies, the Warlock has a _40% chance_ to raise them as a corrupted wraith.
actors.hero.talent.blast_radius.title=blast radius
actors.hero.talent.blast_radius.desc=_+1:_ Elemental blast's radius is increased to _5 tiles_, from 4.\n\n_+2:_ Elemental blast's radius is increased to _6 tiles_, from 4.\n\n_+3:_ Elemental blast's radius is increased to _7 tiles_, from 4.\n\n_+4:_ Elemental blast's radius is increased to _8 tiles_, from 4.
actors.hero.talent.elemental_power.title=elemental power
actors.hero.talent.elemental_power.desc=_+1:_ The power of elemental blast is increased by _25%_.\n\n_+2:_ The power of elemental blast is increased by _50%_.\n\n_+3:_ The power of elemental blast is increased by _75%_.\n\n_+4:_ The power of elemental blast is increased by _100%_.
actors.hero.talent.reactive_barrier.title=reactive barrier
actors.hero.talent.reactive_barrier.desc=_+1:_ The Mage gains _2.5 shielding_ for every character affected by elemental blast, to a max of 5 characters.\n\n_+2:_ The Mage gains _5 shielding_ for every character affected by elemental blast, to a max of 6 characters.\n\n_+3:_ The Mage gains _7.5 shielding_ for every character affected by elemental blast, to a max of 7 characters.\n\n_+4:_ The Mage gains _10 shielding_ for every character affected by elemental blast, to a max of 8 characters.
actors.hero.talent.wild_power.title=wild power
actors.hero.talent.wild_power.desc=_+1:_ When using wild magic, wands will be boosted by either _2 or 3, up to +4_.\n\n_+2:_ When using wild magic, wands will be boosted by _3, up to +5_.\n\n_+3:_ When using wild magic, wands will be boosted by either _3 or 4, up to +6_.\n\n_+4:_ When using wild magic, wands will be boosted by _4, up to +7_.
actors.hero.talent.fire_everything.title=fire everything
actors.hero.talent.fire_everything.desc=_+1:_ Wild magic now fires _5 times_ up from 4, and each wand has a _25% chance_ to be usable 3 times.\n\n_+2:_ Wild magic now fires _6 times_ up from 4, and each wand has a _50% chance_ to be usable 3 times.\n\n_+3:_ Wild magic now fires _7 times_ up from 4, and each wand has a _75% chance_ to be usable 3 times.\n\n_+4:_ Wild magic now fires _8 times_ up from 4, and each wand has a _100% chance_ to be usable 3 times.
actors.hero.talent.conserved_magic.title=conserved magic
actors.hero.talent.conserved_magic.desc=_+1:_ Each zap from wild magic now uses _0.33 charges_ instead of 0.5, and wild magic has a _25% chance_ to not spend a turn.\n\n_+2:_ Each zap from wild magic now uses _0.225 charges_ instead of 0.5, and wild magic has a _50% chance_ to not spend a turn.\n\n_+3:_ Each zap from wild magic now uses _0.15 charges_ instead of 0.5, and wild magic has a _75% chance_ to not spend a turn.\n\n_+4:_ Each zap from wild magic now uses _0.1 charges_ instead of 0.5, and wild magic has a _100% chance_ to not spend a turn.
actors.hero.talent.telefrag.title=Telefrag
actors.hero.talent.telefrag.desc=_+1:_ If the Mage warps into another character he deals _10-15 damage_ to it, but also takes _5 damage_.\n\n_+2:_ If the Mage warps into another character he deals _20-30 damage_ to it, but also takes _10 damage_.\n\n_+3:_ If the Mage warps into another character he deals _30-45 damage_ to it, but also takes _15 damage_.\n\n_+4:_ If the Mage warps into another character he deals _40-60 damage_ to it, but also takes _20 damage_.\n\nThe hero cannot be killed by this talent, the self damage can be reduced by magic resisting effects.
actors.hero.talent.remote_beacon.title=Remote Beacon
actors.hero.talent.remote_beacon.desc=_+1:_ The Mage can place a beacon at any location within _4 tiles_.\n\n_+2:_ The Mage can place a beacon at any location within _8 tiles_.\n\n_+3:_ The Mage can place a beacon at any location within _12 tiles_.\n\n_+4:_ The Mage can place a beacon at any location within _16 tiles_.\n\nThe Mage cannot place beacons in locations that are inaccessible.
actors.hero.talent.longrange_warp.title=Longrange Warp
actors.hero.talent.longrange_warp.desc=_+1:_ The Mage can now warp between floors, at _150% charge cost_.\n\n_+2:_ The Mage can now warp between floors, at _117% charge cost_.\n\n_+3:_ The Mage can now warp between floors, at _83% charge cost_.\n\n_+4:_ The Mage can now warp between floors, at _50% charge cost_.\n\nThe Mage cannot use longrange warp to leave a locked floor.
actors.hero.talent.cached_rations.title=cached rations
actors.hero.talent.cached_rations.desc=_+1:_ The Rogue can find _2 supply rations_ placed in chests while he explores the next few floors of the dungeon.\n\n_+2:_ The Rogue can find _3 supply rations_ placed in chests while he explores the next few floors of the dungeon.\n\nSupply rations are eaten quickly, restore a moderate amount of satiety, heal 5 hp, and restore 1 charge to the cloak of shadows.
actors.hero.talent.thiefs_intuition.title=thief's intuition
actors.hero.talent.thiefs_intuition.desc=_+1:_ The Rogue identifies rings _2x faster_, and identifies the type of a ring _when he equips it_.\n\n_+2:_ The Rogue identifies rings _when he equips them_, and identifies the type of a ring _when he picks it up_.
actors.hero.talent.sucker_punch.title=sucker punch
actors.hero.talent.sucker_punch.desc=_+1:_ The Rogue deals _1-2 bonus damage_ the first time he surprise attacks an enemy.\n\n_+2:_ The Rogue deals _2 bonus damage_ the first time he surprise attacks an enemy.
actors.hero.talent.protective_shadows.title=protective shadows
actors.hero.talent.protective_shadows.desc=_+1:_ The Rogue gains one shielding _every other turn_ he is invisible, _to a max of 3_.\n\n_+2:_ The Rogue gains one shielding _every turn_ he is invisible, _to a max of 5_.
actors.hero.talent.mystical_meal.title=mystical meal
actors.hero.talent.mystical_meal.desc=_+1:_ Eating food takes the Rogue 1 turn (supply rations are eaten instantly) and grants him _3 turns of artifact recharging_.\n\n_+2:_ Eating food takes the Rogue 1 turn (supply rations are eaten instantly) and grants him _5 turns of artifact recharging_.\n\nThis talent cannot be used to let the horn of plenty recharge itself.
actors.hero.talent.inscribed_stealth.title=inscribed stealth
actors.hero.talent.inscribed_stealth.desc=_+1:_ The Rogue gains _3 turns_ of invisibility after reading a scroll or using a spell item.\n\n_+2:_ The Rogue gains _5 turns_ of invisibility after reading a scroll or using a spell item\n\nThe invisibility duration is doubled when using a scroll of upgrade, scroll of transmutation, or alchemy items that must be crafted using those scrolls.\n\nFor alchemy items with higher output quantities (e.g. most spells), this talent has a chance to trigger based on how many of that item is produced.
actors.hero.talent.wide_search.title=wide search
actors.hero.talent.wide_search.desc=_+1:_ The Rogue’s search radius is increased from a 5x5 square to a _7x7 circle_.\n\n_+2:_ The Rogue’s search radius is increased from a 5x5 square to a _7x7 square_.
actors.hero.talent.wide_search.meta_desc=_If this talent is gained by a different hero_ it will instead increase their search radius from a 3x3 square to a 5x5 circle at +1, or a 5x5 square at +2.
actors.hero.talent.silent_steps.title=silent steps
actors.hero.talent.silent_steps.desc=_+1:_ The Rogue will not wake sleeping enemies while he is _3 or more tiles away from them_.\n\n_+2:_ The Rogue will not wake sleeping enemies while he is _not adjacent to them_.
actors.hero.talent.rogues_foresight.title=rogue's foresight
actors.hero.talent.rogues_foresight.desc=_+1:_ When the Rogue is on a level with a secret room, he has a _75% chance to notice_ that the level contains a secret.\n\n_+2:_ When the Rogue is on a level with a secret room, he has a _100% chance to notice_ that the level contains a secret.
actors.hero.talent.light_cloak.title=light cloak
actors.hero.talent.light_cloak.desc=_+1:_ The Rogue can use his cloak of shadows when it is not equipped, but it recharges at _25% speed_.\n\n_+2:_ The Rogue can use his cloak of shadows when it is not equipped, but it recharges at _50% speed_.\n\n_+3:_ The Rogue can use his cloak of shadows when it is not equipped, but it recharges at _75% speed_.
actors.hero.talent.light_cloak.meta_desc=_If this talent is gained by a different hero_ it will instead increase the charging speed of all artifacts by 7/13/20% at +1/+2/+3.
actors.hero.talent.enhanced_rings.title=enhanced rings
actors.hero.talent.enhanced_rings.desc=_+1:_ When the Rogue uses an artifact, his rings gain +1 upgrade for _3 turns_.\n\n_+2:_ When the Rogue uses an artifact, his rings gain +1 upgrade for _6 turns_.\n\n_+3:_ When the Rogue uses an artifact, his rings gain +1 upgrade for _9 turns_.
actors.hero.talent.enhanced_lethality.title=enhanced lethality
actors.hero.talent.enhanced_lethality.desc=_+1:_ The Assassin can assassinate enemies left at below _4/13/27/67% health_ per level of preparation, up from 3/10/20/50%.\n\n_+2:_ The Assassin can assassinate enemies left at below _5/17/33/83% health_ per level of preparation, up from 3/10/20/50%.\n\n_+3:_ The Assassin can assassinate enemies left at below _6/20/40/100% health_ per level of preparation, up from 3/10/20/50%.
actors.hero.talent.assassins_reach.title=assassin's reach
actors.hero.talent.assassins_reach.desc=_+1:_ The Assassin's blink range per level of preparation is increased to _1/3/4/6 tiles_, from 1/2/3/4.\n\n_+2:_ The Assassin's blink range per level of preparation is increased to _2/4/6/8 tiles_, from 1/2/3/4.\n\n_+3:_ The Assassin's blink range per level of preparation is increased to _2/5/7/10 tiles_, from 1/2/3/4.\n\nThis blink can go through hazards and enemies, but not through solid terrain like walls.
actors.hero.talent.bounty_hunter.title=bounty hunter
actors.hero.talent.bounty_hunter.desc=_+1:_ When the Assassin kills an enemy with a prepared strike their item drop chance is increased by _2/4/8/16%_, per level of preparation.\n\n_+2:_ When the Assassin kills an enemy with a prepared strike their item drop chance is increased by _4/8/16/32%_, per level of preparation.\n\n_+3:_ When the Assassin kills an enemy with a prepared strike their item drop chance is increased by _6/12/24/48%_, per level of preparation.
actors.hero.talent.evasive_armor.title=evasive armor
actors.hero.talent.evasive_armor.desc=_+1:_ While freerunning, the Freerunner gains an additional _+1 evasion_ per excess point of strength on his armor.\n\n_+2:_ While freerunning, the Freerunner gains an additional _+2 evasion_ per excess point of strength on his armor.\n\n_+3:_ While freerunning, the Freerunner gains an additional _+3 evasion_ per excess point of strength on his armor.
actors.hero.talent.projectile_momentum.title=projectile momentum
actors.hero.talent.projectile_momentum.desc=_+1:_ While freerunning, the Freerunner gains _+20% accuracy and +15% damage_ with thrown weapons.\n\n_+2:_ While freerunning, the Freerunner gains _+40% accuracy and +30% damage_ with thrown weapons.\n\n_+3:_ While freerunning, the Freerunner gains _+60% accuracy and +45% damage_ with thrown weapons.
actors.hero.talent.speedy_stealth.title=speedy stealth
actors.hero.talent.speedy_stealth.desc=_+1:_ The Freerunner gains 2 stacks of momentum per turn while he is invisible.\n\n_+2:_ In addition to the benefits of +1, freerunning no longer counts down while the Freerunner is invisible.\n\n_+3:_ In addition to the benefits of +1 and +2, the Freerunner moves at 2x speed while invisible, regardless of whether he is freerunning or not.
actors.hero.talent.hasty_retreat.title=hasty retreat
actors.hero.talent.hasty_retreat.desc=_+1:_ After blinking the Rogue gains _1 turn_ of haste and invisibility.\n\n_+2:_ After blinking the Rogue gains _2 turns_ of haste and invisibility.\n\n_+3:_ After blinking the Rogue gains _3 turns_ of haste and invisibility.\n\n_+4:_ After blinking the Rogue gains _4 turns_ of haste and invisibility.
actors.hero.talent.body_replacement.title=body replacement
actors.hero.talent.body_replacement.desc=_+1:_ After blinking, the Rogue leaves a wooden decoy behind that has _20 health and 1-3 armor_.\n\n_+2:_ After blinking, the Rogue leaves a wooden decoy behind that has _40 health and 2-6 armor_.\n\n_+3:_ After blinking, the Rogue leaves a wooden decoy behind that has _60 health and 3-9 armor_.\n\n_+4:_ After blinking, the Rogue leaves a wooden decoy behind that has _80 health and 4-12 armor_.\n\nOnly one decoy can be active at a time.
actors.hero.talent.shadow_step.title=shadow step
actors.hero.talent.shadow_step.desc=_+1:_ If the rogue uses smoke bomb while invisible, it occurs instantly and has a _16% reduced_ charge cost, but it also doesn't blind enemies or trigger other talents.\n\n_+2:_ If the rogue uses smoke bomb while invisible, it occurs instantly and has a _30% reduced_ charge cost, but it also doesn't blind enemies or trigger other talents.\n\n_+3:_ If the rogue uses smoke bomb while invisible, it occurs instantly and has a _41% reduced_ charge cost, but it also doesn't blind enemies or trigger other talents.\n\n_+4:_ If the rogue uses smoke bomb while invisible, it occurs instantly and has a _50% reduced_ charge cost, but it also doesn't blind enemies or trigger other talents.
actors.hero.talent.fear_the_reaper.title=fear the reaper
actors.hero.talent.fear_the_reaper.desc=_+1:_ When a death marked enemy reaches 0 hp, they become _crippled_.\n\n_+2:_ When a death marked enemy reaches 0 hp, they become _feared and crippled_.\n\n_+3:_ When a death marked enemy reaches 0 hp, they become _feared and crippled_ and enemies within 3 tiles become _crippled_.\n\n_+4:_ When a death marked enemy reaches 0 hp, they become _feared and crippled_ and enemies within 3 tiles become _feared and crippled_.
actors.hero.talent.deathly_durability.title=deathly durability
actors.hero.talent.deathly_durability.desc=_+1:_ Enemies killed by death mark give the rogue shielding equal to _13%_ of their hp when they were marked.\n\n_+2:_ Enemies killed by death mark give the rogue shielding equal to _25%_ of their hp when they were marked.\n\n_+3:_ Enemies killed by death mark give the rogue shielding equal to _38%_ of their hp when they were marked.\n\n_+4:_ Enemies killed by death mark give the rogue shielding equal to _50%_ of their hp when they were marked.
actors.hero.talent.double_mark.title=double mark
actors.hero.talent.double_mark.desc=_+1:_ Marking a second target at the same time as the first one has a _30% reduced_ charge cost.\n\n_+2:_ Marking a second target at the same time as the first one has a _50% reduced_ charge cost.\n\n_+3:_ Marking a second target at the same time as the first one has a _65% reduced_ charge cost.\n\n_+4:_ Marking a second target at the same time as the first one has a _75% reduced_ charge cost.
actors.hero.talent.shadow_blade.title=shadow blade
actors.hero.talent.shadow_blade.desc=_+1:_ The shadow clone gains _8%_ of the hero's damage per turn, and has a _25% chance_ to use the enchantment on the hero's weapon.\n\n_+2:_ The shadow clone gains _16%_ of the hero's damage per turn, and has a _50% chance_ to use the enchantment on the hero's weapon.\n\n_+3:_ The shadow clone gains _24%_ of the hero's damage per turn, and has a _75% chance_ to use the enchantment on the hero's weapon.\n\n_+4:_ The shadow clone gains _32%_ of the hero's damage per turn, and has a _100% chance_ to use the enchantment on the hero's weapon.
actors.hero.talent.cloned_armor.title=cloned armor
actors.hero.talent.cloned_armor.desc=_+1:_ The shadow clone gains _12%_ of the hero's armor value, and has a _25% chance_ to use the glyph on the hero's armor.\n\n_+2:_ The shadow clone gains _24%_ of the hero's armor value, and has a _50% chance_ to use the glyph on the hero's armor.\n\n_+3:_ The shadow clone gains _36%_ of the hero's armor value, and has a _75% chance_ to use the glyph on the hero's armor.\n\n_+4:_ The shadow clone gains _48%_ of the hero's armor value, and has a _100% chance_ to use the glyph on the hero's armor.
actors.hero.talent.perfect_copy.title=perfect copy
actors.hero.talent.perfect_copy.desc=_+1:_ The shadow clone gains _10%_ of the hero's max HP, and can instantly swap places with the hero up to _1 tile_ away.\n\n_+2:_ The shadow clone gains _20%_ of the hero's max HP, and can instantly swap places with the hero up to _2 tiles_ away.\n\n_+3:_ The shadow clone gains _30%_ of the hero's max HP, and can instantly swap places with the hero up to _3 tiles_ away.\n\n_+4:_ The shadow clone gains _40%_ of the hero's max HP, and can instantly swap places with the hero up to _4 tiles_ away.
actors.hero.talent.natures_bounty.title=nature's bounty
actors.hero.talent.natures_bounty.desc=_+1:_ The Huntress can find _4 berries_ hidden in tall grass as she explores the next few floors of the dungeon.\n\n_+2:_ The Huntress can find _6 berries_ hidden in tall grass as she explores the next few floors of the dungeon.\n\nBerries are eaten quickly, restore a small amount of satiety, and might contain a usable seed.
actors.hero.talent.survivalists_intuition.title=survivalist's intuition
actors.hero.talent.survivalists_intuition.desc=_+1:_ The Huntress identifies all equipment _1.75x faster_.\n\n_+2:_ The Huntress identifies all equipment _2.5x faster_.
actors.hero.talent.followup_strike.title=followup strike
actors.hero.talent.followup_strike.desc=_+1:_ When the Huntress hits an enemy with her bow or a thrown weapon, her next melee attack against that enemy deals _2 bonus damage_.\n\n_+2:_ When the Huntress hits an enemy with her bow or a thrown weapon, her next melee attack against that enemy deals _3 bonus damage_.
actors.hero.talent.natures_aid.title=nature's aid
actors.hero.talent.natures_aid.desc=_+1:_ The Huntress gains 0-2 armor of barkskin, which fades every _3 turns_ when a plant's effect is activated in her vision.\n\n_+2:_ The Huntress gains 0-2 armor of barkskin, which fades every _5 turns_ when a plant's effect is activated in her vision.
actors.hero.talent.invigorating_meal.title=invigorating meal
actors.hero.talent.invigorating_meal.desc=_+1:_ Eating food takes the Huntress 1 turn (berries are eaten instantly) and grants her _1 turn of haste_.\n\n_+2:_ Eating food takes the Huntress 1 turn (berries are eaten instantly) and grants her _2 turns of haste_.
actors.hero.talent.liquid_nature.title=liquid nature
actors.hero.talent.liquid_nature.desc=_+1:_ When the Huntress drinks or throws a potion, brew, or elixir, _up to 4 grass tiles_ sprout in the surrounding area, and adjacent enemies are rooted for _1 turn_.\n\n_+2:_ When the Huntress drinks or throws a potion, brew, or elixir, _up to 6 grass tiles_ sprout in the surrounding area, and adjacent enemies are rooted for _2 turns_.\n\nThe amount of grass and root duration are doubled when using potions of strength, experience, or alchemy items that must be crafted using those potions.\n\nFor alchemy items with higher output quantities (e.g. aqua brew), this talent has a chance to trigger based on how many of that item is produced.
actors.hero.talent.rejuvenating_steps.title=rejuvenating steps
actors.hero.talent.rejuvenating_steps.desc=_+1:_ When the Huntress steps on short grass or embers, they spring up into tall grass which the Huntress immediately furrows. This has a _10 turn cooldown_.\n\n_+2:_ When the Huntress steps on short grass or embers, they spring up into tall grass which the Huntress immediately furrows. This has a _5 turn cooldown_.\n\nThis talent will produce furrowed grass if passive regeneration effects are disabled or the hero has not gained exp in a long time.
actors.hero.talent.heightened_senses.title=heightened senses
actors.hero.talent.heightened_senses.desc=_+1:_ The Huntress gains mind vision on any enemy within _2 tiles of her position_.\n\n_+2:_ The Huntress gains mind vision on any enemy within _3 tiles of her position_.
actors.hero.talent.durable_projectiles.title=durable projectiles
actors.hero.talent.durable_projectiles.desc=_+1:_ Thrown weapons have _+50% durability_ when used by the Huntress.\n\n_+2:_ Thrown weapons have _+75% durability_ when used by the Huntress.
actors.hero.talent.point_blank.title=point blank
actors.hero.talent.point_blank.desc=_+1:_ When the Huntress uses her bow or a thrown weapon at melee range it has _-30% accuracy,_ instead of -50%.\n\n_+2:_ When the Huntress uses her bow or a thrown weapon at melee range it has _-10% accuracy,_ instead of -50%.\n\n_+3:_ When the Huntress uses her bow or a thrown weapon at melee range it has _+10% accuracy,_ instead of -50%.\n\nNote that thrown weapons or the spirit bow always have +50% accuracy when used at a distance.
actors.hero.talent.seer_shot.title=seer shot
actors.hero.talent.seer_shot.desc=_+1:_ When the Huntress fires an arrow at the ground, it grants vision in a 3x3 area around it for _5 turns_. This has a 20 turn cooldown.\n\n_+2:_ When the Huntress fires an arrow at the ground, it grants vision in a 3x3 area around it for _10 turns_. This has a 20 turn cooldown.\n\n_+3:_ When the Huntress fires an arrow at the ground, it grants vision in a 3x3 area around it for _15 turns_. This has a 20 turn cooldown.
actors.hero.talent.seer_shot.meta_desc=_If this talent is gained by a different hero_ it will trigger from any thrown weapon.
actors.hero.talent.farsight.title=farsight
actors.hero.talent.farsight.desc=_+1:_ The Sniper's vision range is _increased by 25%_.\n\n_+2:_ The Sniper's vision range is _increased by 50%_.\n\n_+3:_ The Sniper's vision range is _increased by 75%_.
actors.hero.talent.shared_enchantment.title=shared enchantment
actors.hero.talent.shared_enchantment.desc=_+1:_ Thrown weapons have a _33% chance_ to use the enchantment on the Sniper's bow.\n\n_+2:_ Thrown weapons have a _67% chance_ to use the enchantment on the Sniper's bow.\n\n_+3:_ Thrown weapons have a _100% chance_ to use the enchantment on the Sniper's bow.\n\nThis talent does not apply to darts shot from an enchanted crossbow, they already trigger the crossbow's enchantment.
actors.hero.talent.shared_upgrades.title=shared upgrades
actors.hero.talent.shared_upgrades.desc=_+1:_ When the Sniper attacks with an upgraded thrown weapon, each level increases the duration of sniper's mark by 1 turn and the damage of her special attack by _10%_.\n\n_+2:_ When the Sniper attacks with an upgraded thrown weapon, each level increases the duration of sniper's mark by 1 turn and the damage of her special attack by _20%_.\n\n_+3:_ When the Sniper attacks with an upgraded thrown weapon, each level increases the duration of sniper's mark by 1 turn and the damage of her special attack by _30%_.
actors.hero.talent.durable_tips.title=durable tips
actors.hero.talent.durable_tips.desc=_+1:_ Tipped darts have _2x durability_ when the Warden uses them.\n\n_+2:_ Tipped darts have _3x durability_ when the Warden uses them.\n\n_+3:_ Tipped darts have _4x durability_ when the Warden uses them.
actors.hero.talent.barkskin.title=barkskin
actors.hero.talent.barkskin.desc=_+1:_ When stepping in grass, the Warden gains _0-50% of her level_ in barkskin armor which fades every turn.\n\n_+2:_ When stepping in grass, the Warden gains _0-100% of her level_ in barkskin armor which fades every turn.\n\n_+3:_ When stepping in grass, the Warden gains _0-150% of her level_ in barkskin armor which fades every turn.
actors.hero.talent.shielding_dew.title=shielding dew
actors.hero.talent.shielding_dew.desc=_+1:_ Dewdrops can shield the Warden when her health is full, up to _20% of her max HP_.\n\n_+2:_ Dewdrops can shield the Warden when her health is full, up to _40% of her max HP_.\n\n_+3:_ Dewdrops can shield the Warden when her health is full, up to _60% of her max HP_.
actors.hero.talent.fan_of_blades.title=fan of blades
actors.hero.talent.fan_of_blades.desc=_+1:_ Spectral blades can hit up to _1 additional target_ for 50% damage. The target must be visible and within a _30 degree_ cone AOE.\n\n_+2:_ Spectral blades can hit up to _2 additional targets_ for 50% damage. The targets must be visible and within a _60 degree_ cone AOE.\n\n_+3:_ Spectral blades can hit up to _3 additional targets_ for 50% damage. The targets must be visible and within a _90 degree_ cone AOE.\n\n_+4:_ Spectral blades can hit up to _4 additional targets_ for 50% damage. The targets must be visible and within a _120 degree_ cone AOE.
actors.hero.talent.projecting_blades.title=projecting blades
actors.hero.talent.projecting_blades.desc=_+1:_ Spectral blades has _+25% accuracy_, and can penetrate up to _2 solid tiles_.\n\n_+2:_ Spectral blades has _+50% accuracy_, and can penetrate up to _4 solid tiles_.\n\n_+3:_ Spectral blades has _+75% accuracy_, and can penetrate up to _6 solid tiles_.\n\n_+4:_ Spectral blades has _+100% accuracy_, and can penetrate up to _8 solid tiles_.
actors.hero.talent.spirit_blades.title=spirit blades
actors.hero.talent.spirit_blades.desc=_+1:_ Spectral blades has a _30% chance_ to also use the enchantment on the spirit bow.\n\n_+2:_ Spectral blades has a _60% chance_ to also use the enchantment on the spirit bow.\n\n_+3:_ Spectral blades has a _90% chance_ to also use the enchantment on the spirit bow.\n\n_+4:_ Spectral blades has a _100% chance_ to also use the enchantment on the spirit bow, and it gives each enchantment _+10% power_.
actors.hero.talent.growing_power.title=growing power
actors.hero.talent.growing_power.desc=_+1:_ The attack and movespeed boosts from nature's power are increased to _38% and 125%_, from 33% and 100%.\n\n_+2:_ The attack and movespeed boosts from nature's power are increased to _42% and 150%_, from 33% and 100%.\n\n_+3:_ The attack and movespeed boosts from nature's power are increased to _46% and 175%_, from 33% and 100%.\n\n_+4:_ The attack and movespeed boosts from nature's power are increased to _50% and 200%_, from 33% and 100%.
actors.hero.talent.natures_wrath.title=nature's wrath
actors.hero.talent.natures_wrath.desc=_+1:_ While nature's power is active, shots from the spirit bow have an _8% chance_ to trigger a random harmful plant effect.\n\n_+2:_ While nature's power is active, shots from the spirit bow have a _17% chance_ to trigger a random harmful plant effect.\n\n_+3:_ While nature's power is active, shots from the spirit bow have an _25% chance_ to trigger a random harmful plant effect.\n\n_+4:_ While nature's power is active, shots from the spirit bow have a _33% chance_ to trigger a random harmful plant effect.\n\nThe plants that can be triggered are: blindweed, firebloom, icecap, sorrowmoss, and stormvine.
actors.hero.talent.wild_momentum.title=wild momentum
actors.hero.talent.wild_momentum.desc=_+1:_ Killing an enemy with the spirit bow prolongs the duration of nature's power by _1 turn_. The duration can be extended by a max of _2 turns_.\n\n_+2:_ Killing an enemy with the spirit bow prolongs the duration of nature's power by _2 turns_. The duration can be extended by a max of _4 turns_.\n\n_+3:_ Killing an enemy with the spirit bow prolongs the duration of nature's power by _3 turns_. The duration can be extended by a max of _6 turns_.\n\n_+4:_ Killing an enemy with the spirit bow prolongs the duration of nature's power by _4 turns_. The duration can be extended by a max of _8 turns_.
actors.hero.talent.eagle_eye.title=eagle eye
actors.hero.talent.eagle_eye.desc=_+1:_ The spirit hawk's vision range is increased to _7 tiles_ from 6.\n\n_+2:_ The spirit hawk's vision range is increased to _8 tiles_ from 6.\n\n_+3:_ The spirit hawk's vision range is increased to _9 tiles_ from 6, and it gets _2 tiles_ of mind vision.\n\n_+4:_ The spirit hawk's vision range is increased to _10 tiles_ from 6, and it gets _3 tiles_ of mind vision.
actors.hero.talent.go_for_the_eyes.title=go for the eyes
actors.hero.talent.go_for_the_eyes.desc=_+1:_ Attacks from the spirit hawk blind enemies for _2 turns_.\n\n_+2:_ Attacks from the spirit hawk blind enemies for _5 turns_.\n\n_+3:_ Attacks from the spirit hawk blind enemies for _5 turns_ and cripple them for _2 turns_.\n\n_+4:_ Attacks from the spirit hawk blind enemies for _5 turns_ and cripple them for _5 turns_.
actors.hero.talent.swift_spirit.title=swift spirit
actors.hero.talent.swift_spirit.desc=_+1:_ The spirit hawk's movement speed is increased to _2.5 tiles_ from 2, and it is guaranteed to dodge the first _2 attacks_ made against it.\n\n_+2:_ The spirit hawk's movement speed is increased to _3 tiles_ from 2, and it is guaranteed to dodge the first _4 attacks_ made against it.\n\n_+3:_ The spirit hawk's movement speed is increased to _3.5 tiles_ from 2, and it is guaranteed to dodge the first _6 attacks_ made against it.\n\n_+4:_The spirit hawk's movement speed is increased to _4 tiles_ from 2, and it is guaranteed to dodge the first _8 attacks_ made against it.
actors.hero.talent.strengthening_meal.title=strengthening meal
actors.hero.talent.strengthening_meal.desc=_+1:_ Eating food grants the Duelist 3 bonus damage the next _2 times_ she hits an enemy with a physical attack.\n\n_+2:_ Eating food grants the Duelist 3 bonus damage the next _3 times_ she hits an enemy with a physical attack.
actors.hero.talent.adventurers_intuition.title=adventurer's intuition
actors.hero.talent.adventurers_intuition.desc=_+1:_ The Duelist identifies weapons _2.5x faster_ and armor _1.75x faster_.\n\n_+2:_ The Duelist identifies weapons _when she equips them_ and armor _2.5x faster_.
actors.hero.talent.patient_strike.title=patient strike
actors.hero.talent.patient_strike.desc=_+1:_ If the Duelist waits before performing a melee attack, she will deal _1-2 bonus damage_.\n\n_+2:_ If the Duelist waits before performing a melee attack, she will deal _2 bonus damage_.
actors.hero.talent.aggressive_barrier.title=aggressive barrier
actors.hero.talent.aggressive_barrier.desc=_+1:_ The Duelist gains _3 shielding_ when she uses a weapon ability and is at or below 50% health.\n\n_+2:_ The Duelist gains _5 shielding_ when she uses a weapon ability and is at or below 50% health.
actors.hero.talent.aggressive_barrier.meta_desc=_If this talent is gained by a different hero_ it will instead grant shielding when making a melee attack at low health, with a 50 turn cooldown.
actors.hero.talent.focused_meal.title=focused meal
actors.hero.talent.focused_meal.desc=_+1:_ Eating food takes the Duelist 1 turn and grants her _0.67 charges_ on her weapons.\n\n_+2:_ Eating food takes the Duelist 1 turn and grants her _1 charge_ on her weapons.
actors.hero.talent.focused_meal.meta_desc=_If this talent is gained by a different hero_ it will instead grant bonus damage to their next hit equal to their level/3 at +1, or level/2 at +2.
actors.hero.talent.liquid_agility.title=liquid agility
actors.hero.talent.liquid_agility.desc=_+1:_ When drinking or throwing a potion, brew, or elixir, the Duelist has _3x evasion_, and has _3x accuracy_ on her next melee attack within 5 turns.\n\n_+2:_ When drinking or throwing a potion, brew, or elixir, the Duelist has _infinite evasion_, and has _infinite accuracy_ on her next melee attack within 5 turns.\n\nThis bonus lasts for one additional turn and attack when using potions of strength, experience, or alchemy items that must be crafted using those potions.\n\nFor alchemy items with higher output quantities (e.g. aqua brew), this talent has a chance to trigger based on how many of that item is produced.
actors.hero.talent.weapon_recharging.title=weapon recharging
actors.hero.talent.weapon_recharging.desc=_+1:_ The Duelist gains one weapon charge every _15 turns_ when under the effect of wand or artifact recharging buffs.\n\n_+2:_ The Duelist gains one weapon charge every _10 turns_ when under the effect of wand or artifact recharging buffs.
actors.hero.talent.weapon_recharging.meta_desc=_If this talent is gained by a different hero_ it will instead cause them to deal +5% melee damage while recharging at +1, or +7.5% melee damage while recharging at +2.
actors.hero.talent.lethal_haste.title=lethal haste
actors.hero.talent.lethal_haste.desc=_+1:_ When the Duelist lands a killing blow on an enemy with a weapon ability, she gains _3 turns_ worth of instant movement.\n\n_+2:_ When the Duelist lands a killing blow on an enemy with a weapon ability, she gains _5 turns_ worth of instant movement.
actors.hero.talent.lethal_haste.meta_desc=_If this talent is gained by a different hero_ it will instead trigger with regular weapon attacks, with a 100 turn cooldown.
actors.hero.talent.swift_equip.title=swift equip
actors.hero.talent.swift_equip.desc=_+1:_ The Duelist can switch her equipped weapon instantly _one time_ every 20 turns.\n\n_+2:_ The Duelist can switch her equipped weapon instantly _two times_ every 20 turns.\n\nIf the Duelist has this talent and it is not on cooldown, quick-using an unequipped weapon will equip it.
actors.hero.talent.precise_assault.title=precise assault
actors.hero.talent.precise_assault.desc=_+1:_ When the Duelist uses a weapon ability, she gains _2x accuracy_ on her next melee attack within 5 turns.\n\n_+2:_ When the Duelist uses a weapon ability, she gains _5x accuracy_ on her next melee attack within 5 turns.\n\n_+3:_ When the Duelist uses a weapon ability, she gains _infinite accuracy_ on her next melee attack within 5 turns.
actors.hero.talent.precise_assault.meta_desc=_If this talent is gained by a different hero_ it will instead increase melee accuracy by 10% at +1, 20% at +2, or 30% at +3.
actors.hero.talent.deadly_followup.title=deadly followup
actors.hero.talent.deadly_followup.desc=_+1:_ When the Duelist hits an enemy with a thrown weapon, she will deal _10% more melee damage_ to them for 5 turns.\n\n_+2:_ When the Duelist hits an enemy with a thrown weapon, she will deal _20% more melee damage_ to them for 5 turns.\n\n_+3:_ When the Duelist hits an enemy with a thrown weapon, she will deal _30% more melee damage_ to them for 5 turns.
actors.hero.talent.varied_charge.title=varied charge
actors.hero.talent.varied_charge.desc=_+1:_ The Champion instantly regains _0.17 weapon charges_ when she uses two different weapon abilities, with no time limit.\n\n_+2:_ The Champion instantly regains _0.33 weapon charges_ when she uses two different weapon abilities, with no time limit.\n\n_+3:_ The Champion instantly regains _0.5 weapon charges_ when she uses two different weapon abilities, with no time limit.
actors.hero.talent.twin_upgrades.title=twin upgrades
actors.hero.talent.twin_upgrades.desc=_+1:_ If one of the Champion's two equipped weapons has a lower level and is _2 or more tiers lower_ than the other weapon, it will be boosted to the other weapon's level.\n\n_+2:_ If one of the Champion's two equipped weapons has a lower level and is _1 or more tiers lower_ than the other weapon, it will be boosted to the other weapon's level.\n\n_+3:_ If one of the Champion's two equipped weapons has a lower level and is _the same tier or lower_ than the other weapon, it will be boosted to the other weapon's level.
actors.hero.talent.combined_lethality.title=combined lethality
actors.hero.talent.combined_lethality.desc=_+1:_ If the Champion attacks with a melee weapon immediately after using a different weapon's ability, that attack will execute any non-boss enemy left at _below 13% HP_.\n\n_+2:_ If the Champion attacks with a melee weapon immediately after using a different weapon's ability, that attack will execute any non-boss enemy left at _below 27% HP_.\n\n_+3:_ If the Champion attacks with a melee weapon immediately after using a different weapon's ability, that attack will execute any non-boss enemy left at _below 40% HP_.\n\nThis attack can be a regular melee weapon attack, or part of a weapon ability.
actors.hero.talent.unencumbered_spirit.title=unencumbered spirit
actors.hero.talent.unencumbered_spirit.desc=_+1:_ The Monk gains _50% more energy_ for each piece of _tier 3 or lower_ equipment she is using.\n\n_+2:_ This talent's effect is increased to _75% more energy_ for each piece of _tier 2 or lower_ equipment the Monk is using.\n\n_+3:_ This talent's effect is increased to _100% more energy_ for each piece of _tier 1_ equipment the Monk is using. She also gains a free cloth armor and studded gloves.\n\nNote that this talent gives no benefit from being unarmed or attacking with a Ring of Force.
actors.hero.talent.monastic_vigor.title=monastic vigor
actors.hero.talent.monastic_vigor.desc=_+1:_ If the Monk has _100% energy_, her abilities are empowered.\n\n_+2:_ If the Monk has _80% or more energy_, her abilities are empowered.\n\n_+3:_ If the Monk has _60% or more energy_, her abilities are empowered.\n\nWhen empowered:\n- Flurry applies your weapon's enchantment\n- Focus is instantaneous\n- Dash gains +4 range\n- Dragon Kick deals +50% damage and applies its knock back and stun effect to all adjacent enemies\n- Meditate slowly heals 20% of missing HP and grants 80% damage resistance.
actors.hero.talent.combined_energy.title=combined energy
actors.hero.talent.combined_energy.desc=_+1:_ If the Monk uses a weapon ability and a _4+ energy_ ability within 5 turns of each other, she regains 1 spent energy.\n\n_+2:_ If the Monk uses a weapon ability and a _3+ energy_ ability within 5 turns of each other, she regains 1 spent energy.\n\n_+3:_ If the Monk uses a weapon ability and a _2+ energy_ ability within 5 turns of each other, she regains 1 spent energy.
actors.hero.talent.close_the_gap.title=close the gap
actors.hero.talent.close_the_gap.desc=_+1:_ The Duelist blinks _up to two tiles_ toward her target when starting a duel.\n\n_+2:_ The Duelist blinks _up to three tiles_ toward her target when starting a duel.\n\n_+3:_ The Duelist blinks _up to four tiles_ toward her target when starting a duel.\n\n_+4:_ The Duelist blinks _up to five tiles_ toward her target when starting a duel.\n\nThis blink can go through hazards and enemies, but not solid terrain like walls. The blink is taken into account when determining if an enemy is in range to be challenged.
actors.hero.talent.invigorating_victory.title=invigorating victory
actors.hero.talent.invigorating_victory.desc=_+1:_ If the Duelist defeats her target before the duel ends, she heals for _5 HP plus 30% of the damage_ she took during the duel.\n\n_+2:_ If the Duelist defeats her target before the duel ends, she heals for _10 HP plus 50% of the damage_ she took during the duel.\n\n_+3:_ If the Duelist defeats her target before the duel ends, she heals for _15 HP plus 65% of the damage_ she took during the duel.\n\n_+4:_ If the Duelist defeats her target before the duel ends, she heals for _20 HP plus 75% of the damage_ she took during the duel.
actors.hero.talent.elimination_match.title=elimination match
actors.hero.talent.elimination_match.desc=_+1:_ If the Duelist challenges again within 3 turns of a duel ending, that challenge has a _16% reduced_ charge cost.\n\n_+2:_ If the Duelist challenges again within 3 turns of a duel ending, that challenge has a _30% reduced_ charge cost.\n\n_+3:_ If the Duelist challenges again within 3 turns of a duel ending, that challenge has a _40% reduced_ charge cost.\n\n_+4:_ If the Duelist challenges again within 3 turns of a duel ending, that challenge has a _50% reduced_ charge cost.
actors.hero.talent.elemental_reach.title=elemental reach
actors.hero.talent.elemental_reach.desc=_+1:_ Elemental strike's range is increased to _5 tiles_ from 4, and its width is increased to _75 degrees_ from 65.\n\n_+2:_ Elemental strike's range is increased to _6 tiles_ from 4, and its width is increased to _85 degrees_ from 65.\n\n_+3:_ Elemental strike's range is increased to _7 tiles_ from 4, and its width is increased to _95 degrees_ from 65.\n\n_+4:_ Elemental strike's range is increased to _8 tiles_ from 4, and its width is increased to _105 degrees_ from 65.
actors.hero.talent.striking_force.title=striking force
actors.hero.talent.striking_force.desc=_+1:_ The power of elemental strike's effect is increased by _30%_.\n\n_+2:_ The power of elemental strike's effect is increased by _60%_.\n\n_+3:_ The power of elemental strike's effect is increased by _90%_.\n\n_+4:_ The power of elemental strike's effect is increased by _120%_.
actors.hero.talent.directed_power.title=directed power
actors.hero.talent.directed_power.desc=_+1:_ The direct attack from elemental strike gains _+30% enchantment power_ for each enemy in range of elemental strike's effect, including the attack target.\n\n_+2:_ The direct attack from elemental strike gains _+60% enchantment power_ for each enemy in range of elemental strike's effect, including the attack target.\n\n_+3:_ The direct attack from elemental strike gains _+90% enchantment power_ for each enemy in range of elemental strike's effect, including the attack target.\n\n_+4:_ The direct attack from elemental strike gains _+120% enchantment power_ for each enemy in range of elemental strike's effect, including the attack target.
actors.hero.talent.feigned_retreat.title=feigned retreat
actors.hero.talent.feigned_retreat.desc=_+1:_ If an enemy attacks the Duelist's afterimage, she gains _2 turns_ of haste.\n\n_+2:_ If an enemy attacks the Duelist's afterimage, she gains _4 turns_ of haste.\n\n_+3:_ If an enemy attacks the Duelist's afterimage, she gains _6 turns_ of haste.\n\n_+4:_ If an enemy attacks the Duelist's afterimage, she gains _8 turns_ of haste.
actors.hero.talent.expose_weakness.title=expose weakness
actors.hero.talent.expose_weakness.desc=_+1:_ Enemies that attack the Duelist's afterimage become weak and vulnerable for _2 turns_.\n\n_+2:_ Enemies that attack the Duelist's afterimage become weak and vulnerable for _4 turns_.\n\n_+3:_ Enemies that attack the Duelist's afterimage become weak and vulnerable for _6 turns_.\n\n_+4:_ Enemies that attack the Duelist's afterimage become weak and vulnerable for _8 turns_.
actors.hero.talent.counter_ability.title=counter ability
actors.hero.talent.counter_ability.desc=_+1:_ If the Duelist uses a weapon ability within 3 turns of her afterimage being attacked, she will instantly regain _0.38 charges_.\n\n_+2:_ If the Duelist uses a weapon ability within 3 turns of her afterimage being attacked, she will instantly regain _0.77 charges_.\n\n_+3:_ If the Duelist uses a weapon ability within 3 turns of her afterimage being attacked, she will instantly regain _1.13 charges_.\n\n_+4:_ If the Duelist uses a weapon ability within 3 turns of her afterimage being attacked, she will instantly regain _1.5 charges_.
actors.hero.talent.heroic_energy.title=heroic energy
actors.hero.talent.heroic_energy.rat_title=ratroic energy
actors.hero.talent.heroic_energy.desc=_+1:_ The hero's armor ability has a _12% reduced_ charge cost.\n\n_+2:_ The hero's armor ability has a _23% reduced_ charge cost.\n\n_+3:_ The hero's armor ability has a _32% reduced_ charge cost.\n\n_+4:_ The hero's armor ability has a _40% reduced_ charge cost.
actors.hero.talent.ratsistance.title=ratsistance
actors.hero.talent.ratsistance.desc=_+1:_ Hostile ratmogrified enemies deal _-10% damage_.\n\n_+2:_ Hostile ratmogrified enemies deal _-19% damage_.\n\n_+3:_ Hostile ratmogrified enemies deal _-27% damage_.\n\n_+4:_ Hostile ratmogrified enemies deal _-35% damage_.
actors.hero.talent.ratlomacy.title=ratlomacy
actors.hero.talent.ratlomacy.desc=_+1:_ Using ratmogrify on a ratmogrified enemy makes them friendly and makes the transformation permanent.\n\n_+2:_ Using ratmogrify on a ratmogrified enemy makes them friendly, makes the transformation permanent, and gives them _2 turns_ of adrenaline.\n\n_+3:_ Using ratmogrify on a ratmogrified enemy makes them friendly, makes the transformation permanent, and gives them _4 turns_ of adrenaline.\n\n_+4:_ Using ratmogrify on a ratmogrified enemy makes them friendly, makes the transformation permanent, and gives them _6 turns_ of adrenaline.
actors.hero.talent.ratforcements.title=ratforcements
actors.hero.talent.ratforcements.desc=_+1:_ Using ratmogrify on yourself _spawns 1_ ally marsupial rat next to you.\n\n_+2:_ Using ratmogrify on yourself _spawns 2_ ally marsupial rats next to you.\n\n_+3:_ Using ratmogrify on yourself _spawns 3_ ally marsupial rats next to you.\n\n_+4:_ Using ratmogrify on yourself _spawns 4_ ally marsupial rats next to you.
actors.hero.herosubclass.kingy=rat king
actors.hero.herosubclass.kingy_desc=Reading the book of Mastery grants Rat King the power of all subclasses!
actors.hero.perks.perk_obtain=You learned %s!
actors.hero.perks.sucker_punch.name=sucker punch
actors.hero.perks.sucker_punch.desc=First surprise attack deals 25% additional armor-piercing damage.
actors.hero.perks.directive.name=directive
actors.hero.perks.directive.desc=First surprise attack gives 1.5 turns of haste.
actors.hero.perks$directivemovingtracker.name=Instant Steps
actors.hero.perks$directivemovingtracker.desc=Your movement will take 0 tiles unless you stop moving.\n\nMoves left: %s.
actors.hero.perks.follow_up_strike.name=follow-up strike
actors.hero.perks.follow_up_strike.desc=After hitting enemy with a bow or throwing weapon, next melee attack will deal 25% additional armor-piercing damage.
actors.hero.perks.hold_fast.name=hold fast
actors.hero.perks.hold_fast.desc=While waiting in place, you get additional %s-%s armor.
actors.hero.perks.protein_infusion.name=protein infusion
actors.hero.perks.protein_infusion.desc=The hero gets up to 2x speed and 1.5x evasion depending on their satiety.
actors.hero.perks.fishing_pro.name=fishing proficiency
actors.hero.perks.fishing_pro.desc=With 25% chance the fishing loot will be doubled.
actors.hero.perks.wand_pro.name=recharge proficiency
actors.hero.perks.wand_pro.desc=Your wands recharge 25% faster.
actors.hero.perks.iron_will.name=iron reflection
actors.hero.perks.iron_will.desc=Below 50% HP taking damage from physical or magical attacks will release damaging shockwaves into enemies.
actors.hero.perks.mystical_meal.name=mystical meal
actors.hero.perks.mystical_meal.desc=Eating grants 6 turns of artifact recharge.
actors.hero.perks.additional_money.name=bounty hunter
actors.hero.perks.additional_money.desc=Killing enemies drops gold equivalent to 20% of regularly dropped gold.
actors.hero.perks.better_bartering.name=efficient bartering
actors.hero.perks.better_bartering.desc=Trading with Rat King has 33% chance to not consume an item.
actors.hero.perks.potions.name=lots of experience
actors.hero.perks.potions.desc=Potions of Overload and Potions of Experience last 2x longer.
actors.hero.perks.more_bag.name=bigger lootbags
actors.hero.perks.more_bag.desc=Treasure bags from shop contain roughly 50% more items.
actors.hero.perks.no_oneshots.name=steel skin
actors.hero.perks.no_oneshots.desc=If the incoming damage is going to kill you from full HP, it will be reduced by 50%.
actors.hero.perks.collect_everything.name=magnetic meal
actors.hero.perks.collect_everything.desc=Eating overpriced rations causes every top item in every heap on the map to be collected instantly.
actors.hero.perks.rat_summons.name=ratforcements
actors.hero.perks.rat_summons.desc=Searching in place will spawn several ally marsupial rats next to you, with 25 turns of adrenaline.
actors.hero.perks.grass_healing.name=restored nature
actors.hero.perks.grass_healing.desc=Drinking a potion of healing spawns 5x5 square of grass, centered around the hero, and roots every enemy inside it for 3 turns.
actors.hero.perks.friendly_bees.name=friendly bees
actors.hero.perks.friendly_bees.desc=All bees, spawned from shattered honeypots, will fight for hero.
actors.hero.perks.raritize_magic.name=Raritizing Magic
actors.hero.perks.raritize_magic.desc=Mobs will drop an item (artifacts, wands, weapons, rings, armors) with rarity (or nothing) at 7% chance.
actors.hero.perks.supply_rations.name=Cached Rations
actors.hero.perks.supply_rations.desc=You can now find cached rations in chests with _1/(25 + (5 * rations found))_ chance while you explore the next few floors in the dungeon.\n\nSupply rations are eaten quickly, restore a moderate amount of satiety, heal 5 hp, and restore 1 charge to the cloak of shadows (if you have the item).
actors.hero.perks.dungeon_berry.name=Nature's Bounty
actors.hero.perks.dungeon_berry.desc=You can now find berries in tall grass with _1/(15 + (5 * berries found))_ chance while you explore the next few floors in the dungeon.\n\nBerries are eaten quickly, restore a moderate amount of satiety, and might contain a usable seed.
actors.mobs.npcs.blacksmith.name=troll blacksmith
actors.mobs.npcs.blacksmith.intro_quest_ratking=Hello Our Majesty!
actors.mobs.npcs.blacksmith.intro_quest_warrior=Hey Human! You look like a tough one.
actors.mobs.npcs.blacksmith.intro_quest_mage=Hey Human! You look like a smart one.
actors.mobs.npcs.blacksmith.intro_quest_rogue=Hey Human! You look like a sneaky one.
actors.mobs.npcs.blacksmith.intro_quest_huntress=Hey Human! You look like a quick one.
actors.mobs.npcs.blacksmith.intro_quest_duelist=Hey Human! You look like a brave one.
actors.mobs.npcs.blacksmith.intro_quest_cleric=Hey Human! You look like an important one.
actors.mobs.npcs.blacksmith.intro_quest_start=Wanna be useful, eh? Yeah I got something you could do. I built dis workshop ontop of an old mine, it's just down dat ladder. Take dis pickaxe and mine me some _dark gold ore. 40 pieces_ should be enough. The rock down der is nice and soft so _you'll be able to mine through the walls with some effort._\n\nWhat do you mean, how am I gonna pay? You greedy...\n\nOk, ok, I can do some smithin' for you. Consider yourself lucky, I'm the only blacksmith around.
actors.mobs.npcs.blacksmith.intro_quest_crystal=Careful though, the mine's dangerous for a little human like you. It's been abandoned for a while, and bunch of crystals have started growing. They're shiny, but too fragile to be worth anythin', and they've got some magic things protecting 'em. They're pretty strong, so _be careful where you mine_ or you'll get their attention.\n\nThere's a _giant crystal_ somewhere too. It's a lot tougher, so be prepared for a fight if you start breakin' it. I'll bet smashing it will slow all the crystal growth down though, so I'll pay extra if you can do it.
actors.mobs.npcs.blacksmith.intro_quest_gnoll=Careful though, the mine's dangerous for a little human like you. Some gnolls want the gold too and now they're wreckin' the place. They're stupid things, so their mining has caused all sorts of collapses and cave-ins. You'll have to mine through it, so _look for recently disturbed rock._\n\nI think one of the gnolls is causing most of the trouble, probably a _geomancer shaman_ or somethin'. I'll pay extra, if you can find and kill it, but I'm sure it'll fight back.
actors.mobs.npcs.blacksmith.intro_quest_fungi=Careful though, the mine's dangerous for a little human like you. There's some sorta fungus monster that's been growing down there. It's got mushroom sentries that're really deadly if they see you, but they can't get up and chase you at least. _Keep out of sight_ if you want to stay alive.\n\nI'll pay extra if you can manage to take down the _biggest mushrom,_ but it'll take some real effort. It's connected to a bunch of mycelium nodes that're hidden in the walls. You'll have to break most of 'em before you can really damage it.
actors.mobs.npcs.blacksmith.reminder=You done wastin' my time? The mine entrance is over there.
actors.mobs.npcs.blacksmith.reminder_crystal=Bring me as much gold as you can, and try to break the big crystal too.
actors.mobs.npcs.blacksmith.reminder_gnoll=Bring me as much gold as you can, and try to kill the gnoll geomancer too.
actors.mobs.npcs.blacksmith.reminder_fungi=Bring me as much gold as you can, and try to kill the giant mushroom too.
actors.mobs.npcs.blacksmith.lost_pick=Are you kiddin' me? Where is my pickaxe?!
actors.mobs.npcs.blacksmith.quest_start_prompt=You ready to go down? Make sure you've got some free space for the gold.\n\n_I'm only lettin' you down der once!_
actors.mobs.npcs.blacksmith.enter_yes=I'm Ready
actors.mobs.npcs.blacksmith.enter_no=Not Yet
actors.mobs.npcs.blacksmith.exit_warn_none=You done already? You've hardly got any gold at all! You should be able to get _40 pieces._\n\n_Remember, I'm not lettin' you back in once you come up._
actors.mobs.npcs.blacksmith.exit_warn_low=You done already? Doesn't look like you've got a lot of gold. You should be able to get _40 pieces._\n\n_Remember, I'm not lettin' you back in once you come up._
actors.mobs.npcs.blacksmith.exit_warn_med=You done? You've got some gold at least, but there's definitely more in the mine. You should be able to get _40 pieces._\n\n_Remember, I'm not lettin' you back in once you come up._
actors.mobs.npcs.blacksmith.exit_warn_high=You done? Looks like you've got a good amount of gold, but I could use a bit more. You should be able to get _40 pieces._\n\n_Remember, I'm not lettin' you back in once you come up._
actors.mobs.npcs.blacksmith.exit_warn_full=You done? You've got lots of gold, but make sure you haven't left any of your gear behind.\n\n_Remember, I'm not lettin' you back in once you come up._
actors.mobs.npcs.blacksmith.exit_warn_crystal=That giant crystal's still down there too. I'll pay extra if you destroy it.
actors.mobs.npcs.blacksmith.exit_warn_gnoll=That gnoll geomancer's still down there too. I'll pay extra if you kill it.
actors.mobs.npcs.blacksmith.exit_warn_fungi=That giant mushroom's still down there too. I'll pay extra if you kill it.
actors.mobs.npcs.blacksmith.exit_yes=I'm Done
actors.mobs.npcs.blacksmith.exit_no=Not Yet
actors.mobs.npcs.blacksmith.entrance_blocked=The way down is blocked.
actors.mobs.npcs.blacksmith.cant_enter_old=That area is not accessible on this run. Play a new game to try the new quest!
actors.mobs.npcs.blacksmith.def_verb=blocked
actors.mobs.npcs.blacksmith.desc=This troll blacksmith looks like all trolls look: he is tall and lean, and his skin resembles stone in both color and texture. The troll blacksmith is tinkering with disproportionally small tools.
actors.mobs.npcs.blacksmith.gold_1=Hey human! Wanna be useful, eh? Take dis pickaxe and mine me some _dark gold ore, 15 pieces_ should be enough. What do you mean, how am I gonna pay? You greedy...\nOk, ok, I don't have money to pay, but I can do some smithin' for you. Consider yourself lucky, I'm the only blacksmith around.
actors.mobs.npcs.blacksmith.blood_1=Hey human! Wanna be useful, eh? Take dis pickaxe and _kill a bat_ wit' it, I need its blood on the head. What do you mean, how am I gonna pay? You greedy...\nOk, ok, I don't have money to pay, but I can do some smithin' for you. Consider yourself lucky, I'm the only blacksmith around.
actors.mobs.npcs.blacksmith.gold_2=Dark gold ore. 15 pieces. Seriously, is it dat hard?
actors.mobs.npcs.blacksmith.blood_2=I said I need bat blood on the pickaxe. Chop chop!
actors.mobs.npcs.blacksmith.completed=Oh, you have returned... Better late dan never.
actors.mobs.npcs.blacksmith.get_lost=I'm busy. Get lost!
actors.mobs.npcs.blacksmith.same_item=Select 2 different items, not the same item twice!
actors.mobs.npcs.blacksmith.diff_type=Select 2 items of the same type!
actors.mobs.npcs.blacksmith.un_ided=I need to know what I'm working with, identify them first!
actors.mobs.npcs.blacksmith.cursed=I don't work with cursed items!
actors.mobs.npcs.blacksmith.degraded=It's junk, the quality is too poor!
actors.mobs.npcs.blacksmith.cant_reforge=I can't reforge these items!
actors.mobs.npcs.blacksmith.key=Oh, you here. I never thought that you will actually finish this quest. It's quite embarrassing to get busted so easily... Did you know, than Wand of Fireblast had a brother? He is called Wand of Avalanche.\n\nThe people loved him more than his sister... That's why it was banished, to point of no return. Until now.\n\nI was really bored and decided to extract this wand from game files, but they were erased, as usual. But I have managed to program it back. It was quite glitchy, hehehe. But don't worry, this new wand is completely fixed and will work as designed!\n\n(Wand of Avalanche recipe has been added.)
actors.mobs.npcs.ghost.name=sad ghost
actors.mobs.npcs.ghost.rat_1=Hello %s... Once I was like you - strong and confident... But I was slain by a foul beast... I can't leave this place... Not until I have my revenge... Slay the _fetid rat,_ that has taken my life...\n\nIt stalks this floor... Spreading filth everywhere... _Beware its cloud of stink and corrosive bite, the acid dissolves in water..._
actors.mobs.npcs.ghost.rat_2=Please... Help me... Slay the abomination...\n\n_Fight it near water... Avoid the stench..._
actors.mobs.npcs.ghost.gnoll_1=Hello %s... Once I was like you - strong and confident... But I was slain by a devious foe... I can't leave this place... Not until I have my revenge... Slay the _gnoll trickster,_ that has taken my life...\n\nIt is not like the other gnolls... It hides and uses thrown weapons... _Beware its poisonous and incendiary darts, don't attack from a distance..._
actors.mobs.npcs.ghost.gnoll_2=Please... Help me... Slay the trickster...\n\n_Don't let it hit you... Get near to it..._
actors.mobs.npcs.ghost.crab_1=Hello %s... Once I was like you - strong and confident... But I was slain by an ancient creature... I can't leave this place... Not until I have my revenge... Slay the _great crab,_ that has taken my life...\n\nIt is unnaturally old... With a massive single claw and a thick shell... _Beware its claw, you must surprise the crab or it will block with it..._
actors.mobs.npcs.ghost.crab_2=Please... Help me... Slay the Crustacean...\n\n_It will always block... When it sees you coming..._
actors.mobs.npcs.ghost.find_me=Thank you... come find me...
actors.mobs.npcs.ghost.desc=The ghost is barely visible. It looks like a shapeless spot of faint light with a sorrowful face.
actors.mobs.npcs.imp.name=ambitious imp
actors.mobs.npcs.imp.intro=Are you an adventurer? I love adventurers! You can always rely on them if something needs to be killed, am I right? For a bounty of course ;)
actors.mobs.npcs.imp.golems_1=In my case it's _golems_ that need to be killed. You see, I'm going to start a little business here, but those stupid golems are bad for business! It's very hard to negotiate with wandering lumps of granite, damn them! So please kill... let's say _4 of them_ and a reward is yours.
actors.mobs.npcs.imp.monks_1=In my case it's _monks_ who need to be killed. You see, I'm going to start a little business here, but those lunatics don't buy anything themselves and will scare away other customers. So please kill... let's say _5 of them_ and a reward is yours.
actors.mobs.npcs.imp.golems_2=How is your golem safari going? Just don't forget to grab those tokens.
actors.mobs.npcs.imp.monks_2=Oh, you're still alive! I knew that your kung-fu would be stronger ;) Just don't forget to grab those tokens.
actors.mobs.npcs.imp.cya=See you, %s!
actors.mobs.npcs.imp.hey=Psst, %s!
actors.mobs.npcs.imp.desc=Imps are lesser demons. They are notable for neither their strength nor their magic talent, but they are quite smart and sociable. Many imps prefer to live among non-demons.
actors.mobs.npcs.impshopkeeper.name=ambitious imp
actors.mobs.npcs.impshopkeeper.greetings=Hello, %s!
actors.mobs.npcs.impshopkeeper.greetings_ascent=What did you do %s? Shop quickly, I've got to get out of here!
actors.mobs.npcs.impshopkeeper.thief=I thought I could trust you!
actors.mobs.npcs.impshopkeeper.buyback=The imp cheerily returns your item.
actors.mobs.npcs.impshopkeeper.desc=The imp has set up a little shop on the border of the inner halls. It's nice to see a friendly face, but his prices certainly don't seem friendly.
actors.mobs.npcs.mirrorimage.name=mirror image
actors.mobs.npcs.mirrorimage.desc=This illusion bears a close resemblance to you, even seeming to wield your current weapon and armor.\n\nMirror images will seek and attack enemies using their mimicked weapon, which behaves the same as yours, but deals less damage. They start out nearly invisible, but must take on a form that's more easily seen in order to attack.\n\nWhile their offensive power can be potent, mirror images have no durability, and will fade the moment they take damage.
actors.mobs.npcs.prismaticimage.name=prismatic image
actors.mobs.npcs.prismaticimage.desc=This shimmering illusion bears a close resemblance to you, even seeming to wield your current weapon and armor.\n\nPrismatic images will attempt to seek and draw focus from enemies, using their enhanced defense and health to protect you. While they do not have the same offensive power as mirror images, they have enhanced durability, including receiving benefits from your armor.\n\nWhen reduced to 0 hp, prismatic images will fade over several turns, and can still be healed during this time. When no enemies are present, prismatic images will fade and rejoin their master.
actors.mobs.npcs.ratking.name=rat king
actors.mobs.npcs.ratking.not_sleeping=I'm not sleeping!
actors.mobs.npcs.ratking.what_is_it=What is it? I have no time for this nonsense. My kingdom won't rule itself!
actors.mobs.npcs.ratking.confused=Wha... Where am I? My kingdom needs me!
actors.mobs.npcs.ratking.crown_clothes=Put some clothes on! You're in no state to talk to royalty!
actors.mobs.npcs.ratking.crown_desc=Oooh, is that crown for me!? It looks much shinier than mine, so I graciously accept!\n\nIn fact, I think I can offer you something as a reward for this crown. A tremendous power befitting a hero such as yourself! Would you like that?
actors.mobs.npcs.ratking.crown_yes=Of course!
actors.mobs.npcs.ratking.crown_info=Tell me more first.
actors.mobs.npcs.ratking.crown_no=I'd rather not...
actors.mobs.npcs.ratking.crown_thankyou=Hehehe, thank you! Now go and make your king proud!
actors.mobs.npcs.ratking.crown_fine=Fine! It's not like I wanted it anyway...
actors.mobs.npcs.ratking.crown_after=Enjoying your new armor? No take-backsies!
actors.mobs.npcs.ratking.desc_crown=This rat is a little bigger than a regular marsupial rat. It's wearing dwarf king's crown on its head.
actors.mobs.npcs.ratking.desc_birthday=This rat is a little bigger than a regular marsupial rat. It's wearing a tiny green party hat instead of its usual crown. Happy birthday Rat King!
actors.mobs.npcs.ratking.desc_winter=This rat is a little bigger than a regular marsupial rat. It's wearing a tiny festive hat instead of its usual crown. Happy Holidays!
actors.mobs.npcs.ratking.desc=This rat is a little bigger than a regular marsupial rat. It's wearing a tiny crown on its head.
actors.mobs.npcs.ratking.ghastly=This mirror image is the manifestation of the Rat King's will. It will not run away, but still trade with you when needed.
actors.mobs.npcs.sheep.name=sheep
actors.mobs.npcs.sheep.baa.=Baa.
actors.mobs.npcs.sheep.baa...=Baa...
actors.mobs.npcs.sheep.def_verb=blocked
actors.mobs.npcs.sheep.desc=This is a magic sheep. What's so magical about it? You can't kill it. It will stand there until it magically fades away, all the while chewing cud with a blank stare.
actors.mobs.npcs.shopkeeper.name=shopkeeper
actors.mobs.npcs.shopkeeper.thief=Thief, Thief!
actors.mobs.npcs.shopkeeper.warn=Watch it! I won't warn you again.
actors.mobs.npcs.shopkeeper.flee=The shopkeeper flees!
actors.mobs.npcs.shopkeeper.sell=Sell an item
actors.mobs.npcs.shopkeeper.talk=Talk
actors.mobs.npcs.shopkeeper.buyback=The shopkeeper reluctantly returns your item.
actors.mobs.npcs.shopkeeper.talk_prison_intro=I have everything you need for a successful adventure!
actors.mobs.npcs.shopkeeper.talk_prison_warrior=That's an interesting seal you've got there, they're usually in one piece. You a disgraced hero or something? Well whatever you've done is none of my business, your coins are still good.
actors.mobs.npcs.shopkeeper.talk_prison_mage=Hehe, I think I've seen a wanted poster with your name on it somewhere in the city. On the run are we? Oh you're innocent are you? Of course, of course... Don't fret, I've got better things to do than report on you, but perhaps you should buy something to be sure?
actors.mobs.npcs.shopkeeper.talk_prison_rogue=Have you come from the thieves guild to clear the area? No, just shopping? Well kill a few monsters while you're here anyway. Don't expect a discount either, I pay good protection money to you people and you're barely keeping me safe down here.
actors.mobs.npcs.shopkeeper.talk_prison_huntress=You seem to be out of your element miss. Tight dungeon corridors aren't as spacious as grand halls or the forests surrounding the city are they? Hehe, oh don't mind my rambling, why not buy something?
actors.mobs.npcs.shopkeeper.talk_prison_duelist=Well if it isn't the travelling hero! If you're trying to save another town then good luck, the dangers here are much worse than petty bandit gangs. I'm sure you'll do better than anyone else could, just try to not die right outside my store.
actors.mobs.npcs.shopkeeper.talk_prison_rat_king=Greetings, Your Majesty. Why you are here at all? You already have all the luxury and popularity in the world... Just for fun? Okay...
actors.mobs.npcs.shopkeeper.talk_caves=Spend money, live longer.\n\nOh and say hello to that Troll blacksmith for me if you see him. Remind the lug that he still owes me money for that hammer I sold him last week!
actors.mobs.npcs.shopkeeper.talk_city=My wares can keep you safe down here.\n\n...And don't loiter if you please. It took forever to get the locals down here to leave me alone, I don't want you attracting any trouble!
actors.mobs.npcs.shopkeeper.talk_halls=Hey there, I've got special prices for demon hunters!\n\nOh and be careful down there! The demons below won't care how courageous you are. You can't come back up and spend more money if you're dead! ;)\n\nAre the demons like me? Hehe, not at all. I'm just a small fellow, not much of a fighter, and I've managed to keep my mind intact. The demons below are much stronger things, and they've all been enslaved by... well... just be careful down there.
actors.mobs.npcs.shopkeeper.talk_ascent=I don't know what you're planning to do with that amulet but I want no part of it. Buy something and move on, we both need to leave this place!
actors.mobs.npcs.shopkeeper.desc=This stout guy looks more appropriate for a trade district in some large city than for a dungeon. His prices explain why he prefers to do business here.\n\nHave you wondered, how he reacts to clay?
actors.mobs.npcs.wandmaker.name=old wandmaker
actors.mobs.npcs.wandmaker.intro_warrior=Oh, hello there! What a pleasant surprise to meet a warrior from the north in such a depressing place! You must have travelled quite far to get here. If you're looking for adventure, I may have a task for you.
actors.mobs.npcs.wandmaker.intro_rogue=Oh Goodness, you startled me! I haven't met a bandit from this place that still has his sanity, so you must be from the surface! If you're up to helping a stranger out, I may have a task for you.
actors.mobs.npcs.wandmaker.intro_mage=Oh, hello %s! I heard there was some ruckus regarding you and the wizards institute? Oh never mind, I never liked those stick-in-the-muds anyway. If you're willing, I may have a task for you.
actors.mobs.npcs.wandmaker.intro_huntress=Oh, hello miss! A friendly face is a pleasant surprise down here isn't it? In fact, I swear I've seen your face before, but I can't put my finger on it... Oh never mind, if you're here for adventure, I may have a task for you.
actors.mobs.npcs.wandmaker.intro_duelist=Oh, hello miss! What a pleasant surprise to meet a hero in such a depressing place! If you're up to helping an old man out, I may have a task for you.
actors.mobs.npcs.wandmaker.intro_ratking=Oh, big greetings, Your Majesty! What a honor to meet your enlightening presence in such depressing place! If you're fine with helping an old man out, I may have a task for you.
actors.mobs.npcs.wandmaker.intro_1=\n\nI came here to find a rare ingredient for a wand, but I've gotten myself lost, and my magical shield is weakening. I'll need to leave soon, but can't bear to go without getting what I came for.
actors.mobs.npcs.wandmaker.intro_dust=I'm looking for some _corpse dust._ It's a special kind of cursed bone meal that usually shows up in places like this. There should be a barricaded room around here somewhere, I'm sure some dust will turn up there. Do be careful though, the curse the dust carries is quite potent, _get back to me as fast as you can_ and I'll cleanse it for you.
actors.mobs.npcs.wandmaker.intro_ember=I'm looking for some _fresh embers_ from a newborn fire elemental. Elementals usually pop up when a summoning ritual isn't controlled, so just find some candles and a ritual site and I'm sure you can get one to pop up. You'll want to _avoid boxing yourself in_ while fighting it though, or you could _keep some sort of freezing item handy._ Newborn Elementals are pretty powerful and chaotic, but they can't stand the cold.
actors.mobs.npcs.wandmaker.intro_berry=The old warden of this prison kept a _rotberry plant,_ and I'm after one of its seeds. The plant has probably gone wild by now though, so getting it to give up a seed might be tricky. Its garden should be somewhere around here. Try to _keep away from its vine lashers_ if you want to stay in one piece. Using fire might be tempting but please don't, you'll kill the plant and destroy its seeds.
actors.mobs.npcs.wandmaker.intro_2=\n\nIf you can get that for me, I'll be happy to pay you with one of my finely crafted wands! I brought two with me, so you can take whichever one you prefer.
actors.mobs.npcs.wandmaker.reminder_dust=Any luck with corpse dust, %s? Look for some barricades.
actors.mobs.npcs.wandmaker.reminder_ember=Any luck with those embers, %s? You'll need to find four candles and the ritual site.
actors.mobs.npcs.wandmaker.reminder_berry=Any luck with a Rotberry seed, %s? Look for a room filled with vegetation.
actors.mobs.npcs.wandmaker.def_verb=blocked
actors.mobs.npcs.wandmaker.desc=This old yet hale gentleman wears a slightly confused expression. He is protected by a magic shield.
actors.mobs.npcs.wandmaker.cheese=Oh god, cheese! You found it for me? Awesome! I will give you my most powerful wand in possession, although it's little unfinished.\n\nYou can try to kill that big slime again with it.
actors.mobs.npcs.hook.name=hook
actors.mobs.npcs.hook.desc=The hook from your cool fishing rod.
actors.mobs.npcs.expgenerator.name=power plant
actors.mobs.npcs.expgenerator.desc=This golden masterpiece gathers hidden sunlight and turns it into experience. You can damage to get the generator back.
actors.mobs.npcs.bbat.name=bbat
actors.mobs.npcs.bbat.desc=This bat is trained to hunt weak targets while the owner survives in battlefield. It has high dexterity, but pretty low offensive stats. 
actors.mobs.npcs.bbat$bbatrecharge.name=Bbat Recharge
actors.mobs.npcs.bbat$bbatrecharge.desc=Bbat needs %s turns to recover from damage and return to fight. You can summon it with your Cloak of Shadows
actors.mobs.acidic.name=acidic scorpio
actors.mobs.acidic.desc=These huge arachnid-like demonic creatures avoid close combat, preferring to fire crippling serrated spikes from long distances. This one appears to be dripping with corrosive ooze.
actors.mobs.albino.name=albino rat
actors.mobs.albino.desc=This is a rare breed of marsupial rat, with pure white fur and jagged teeth.
actors.mobs.armoredstatue.name=armored statue
actors.mobs.armoredstatue.desc=You would think that it's just another one of this dungeon's inanimate statues, but its red glowing eyes give it away.\n\nIt seems to be in great condition because of the armor it's wearing, it might be very hard to kill.
actors.mobs.armoredstatue.desc_arm_wep=While the statue itself is made of stone, the _%1$s_ and _%2$s_ it's wielding look real.
actors.mobs.bandit.name=crazy bandit
actors.mobs.bat.name=vampire bat
actors.mobs.bat.desc=These brisk and tenacious inhabitants of the caves are much more dangerous than they seem. They replenish their health with each successful attack, which allows them to defeat much larger opponents.
actors.mobs.bee.name=golden bee
actors.mobs.bee.desc_honey=Despite their small size, golden bees tend to protect their home fiercely. This one has been placated, and seems to want to follow you.
actors.mobs.bee.desc=Despite their small size, golden bees tend to protect their home fiercely. This one is very mad, better keep your distance.
actors.mobs.brute.name=gnoll brute
actors.mobs.brute.enraged=enraged
actors.mobs.brute.def_verb=blocked
actors.mobs.brute.desc=Brutes are the largest, strongest, and toughest of all gnolls. When mortally wounded, they go berserk, gaining temporary shielding and a large boost to damage.
actors.mobs.brute$bruterage.name=brute rage
actors.mobs.brute$bruterage.desc=This gnoll brute is dying, but wants to take you with it!\n\nThe brute will die when its shielding wears off, either due to time or if it is damaged. In the meantime, it will deal hugely increased damage, so watch out!\n\nShield remaining: %d.
actors.mobs.causticslime.name=caustic slime
actors.mobs.causticslime.desc=This slime seems to have been tainted by the dark magic emanating from below. It has lost its usual green color, and drips with caustic ooze.
actors.mobs.crab.name=sewer crab
actors.mobs.crab.desc=These huge crabs are at the top of the food chain in the sewers. They are extremely fast and their thick carapace can withstand heavy blows.
actors.mobs.crystalguardian.name=crystal guardian
actors.mobs.crystalguardian.def_verb=blocked
actors.mobs.crystalguardian.desc=These large crystalline guardians almost look like statues, if it weren't for their bright glowing eyes. The hardened crystal they're made out of causes them to be sluggish but very tough, so _it's best to leave them to sleep in their crystal nest for as long as possible._\n\nDue to their size, crystal guardians will move much more slowly in enclosed spaces. They're also so durable that they're impossible to kill outright. They can be beaten down and temporarily disabled, but they'll just get back up again after a little while.
actors.mobs.crystalmimic.name=crystal mimic
actors.mobs.crystalmimic.ate=The mimic ate your %s!
actors.mobs.crystalmimic.escaped=The crystal mimic has escaped!
actors.mobs.crystalmimic.desc=Mimics are magical creatures which can take any shape they wish. In dungeons they almost always choose a shape of a treasure chest, in order to lure in unsuspecting adventurers.\n\nCrystal mimics are trickier than their regular cousins, and prefer to avoid conflict while stealing loot. They will attempt to sprint away once discovered, and have the ability to reposition enemies when they attack.
actors.mobs.crystalspire.name=crystal spire
actors.mobs.crystalspire.warning=The crystal vibrates as you strike it. Keeping this up is bound to draw attention to you...
actors.mobs.crystalspire.alert=The vibration grows and rumbles through the whole cave!
actors.mobs.crystalspire.desc=This gigantic spire of ultra hard crystal is probably the source of all the strange crystalline creatures in this cave. Your regular weapons are ineffective against it, so you'll need to use your pickaxe if you want to destroy it.\n\n_Make sure you're prepared before you start breaking it._ Such a big crystal is likely to take a while to mine through, and you probably won't be able to do it undisturbed. The spire itself may even have some means of defending itself as well. _Perhaps the spire's own attacks could be used against its minions._
actors.mobs.crystalwisp.name=crystal wisp
actors.mobs.crystalwisp.beam_kill=The beam of light killed you...
actors.mobs.crystalwisp.desc=A small angry floating chunk of hardened crystal that's producing a bright glow. While not especially strong, crystal wisps will shoot a damaging beam of light at you if they have a clear shot.\n\nWisps are small enough to easily move through the various crystal outcroppings, but they aren't able to shoot through them.
actors.mobs.demonspawner.name=demon spawner
actors.mobs.demonspawner.on_death=The demonic energy here seems to lessen as the spawner dies.
actors.mobs.demonspawner.desc=This twisting amalgam of dwarven flesh is responsible for creating ripper demons from the dwarves that have died in this region. Clearly the demons see no issue with using every resource they can against their enemies.\n\nWhile visually terrifying, demon spawners have no means of moving or directly defending themselves. Their considerable mass makes them hard to kill quickly however, and they will spawn ripper demons more quickly when they are under threat.\n\n_Demon spawners seem to be connected to some central source of demonic power. Killing them may weaken it._
actors.mobs.dm100.name=DM-100
actors.mobs.dm100.zap_kill=The lightning bolt killed you...
actors.mobs.dm100.desc=The DM-100 is an early model of dwarven 'defense machine' which was designed to protect dwarven miners in the caves below this prison. Their electrical shocks proved too weak however, and so they were gifted to the human city above. They went unused for years and eventually found their way to the prison, where the warden initially deemed them too cruel to use. However, as the prisoners became more unruly they became a necessity.
actors.mobs.dm200.name=DM-200
actors.mobs.dm200.vent=The DM-200 fires a jet of toxic exhaust!
actors.mobs.dm200.desc=The DM-200 is the second generation of dwarven 'defense machine', which was designed to protect dwarven miners in the caves and city below. They are much larger and bulkier than their predecessors, and attack with devastating hydraulic fists.\n\nTheir increased size is also their primary weakness, as they are unable to fit into the narrow tunnels and doorways of the dungeon. The dwarves were able to compensate for the DM-200's lack of mobility by allowing them to vent their toxic exhaust fumes at distant enemies, or enemies they cannot reach.
actors.mobs.dm201.name=DM-201
actors.mobs.dm201.vent=The DM-201 lobs a corrosive grenade!
actors.mobs.dm201.desc=The dwarves briefly experimented with more heavily emphasizing the DM-200's lack of mobility and created some DM models that are entirely stationary. The DM-201 is a retrofitted DM-200 which acts as a sentry turret that has no movement ability. In exchange for the lack of mobility, DM-201s have significantly more durability and attacking power.\n\nAs DM-201s have no engine to vent exhaust from, the dwarves instead outfitted them with corrosive gas grenades! DM-201s are careful with these grenades however, and will only lob them when attacked from a distance.
actors.mobs.dm300.name=DM-300
actors.mobs.dm300.notice=UNAUTHORIZED PERSONNEL DETECTED!
actors.mobs.dm300.shield=DM-300 pulls power from the exposed wires and shields itself!
actors.mobs.dm300.charging=SUSTAINING DAMAGE! ACTIVATING POWER PYLON!
actors.mobs.dm300.charging_hint=DM-300 is invulnerable while it is being energized by a pylon!
actors.mobs.dm300.supercharged=DESTROY! DESTROY! DESTROY!
actors.mobs.dm300.charge_lost=PYLON DESTROYED! REVERTING TO LOCAL POWER!
actors.mobs.dm300.pylons_destroyed=ALERT! INSTABILITY DETECTED IN POWER GRID!
actors.mobs.dm300.rankings_desc=Crushed by the DM-300
actors.mobs.dm300.def_verb=blocked
actors.mobs.dm300.defeated=CRITICAL DAMAGE! ATTEMPTING SHUTDO-
actors.mobs.dm300.desc=The DM-300 is the largest and most powerful 'defense machine' that the dwarves ever built. Such an awesome machine is difficult to manufacture, so the dwarves only ever made a few to guard the entrances to their underground metropolis.\n\nIt is equipped with vents to jet its toxic exhaust fumes and a high power drill that it can use both to attack and disrupt the earth. DM-300 can also connect to an energy grid, further enhancing its power.
actors.mobs.dm300.desc_supercharged=DM-300 is currently charged full of electrical energy. In this form DM-300 cannot be damaged and moves at double speed! Additionally, its drill now spins fast enough for it to _tunnel through solid rock,_ though it moves much more slowly when doing this.\n\nAttacking DM-300 directly is pointless while it is supercharged, but _something in the area must be providing it with this energy,_ destroying that may weaken it.
actors.mobs.blackmimic.name=darkened mimic
actors.mobs.blackmimic.notice=Hey, you did go there.
actors.mobs.blackmimic.shield=I have powerfield for you!
actors.mobs.blackmimic.vent=How about some corrosive experience?
actors.mobs.blackmimic.rocks=Crush him, rocks!
actors.mobs.blackmimic.bomb=Explode!
actors.mobs.blackmimic.summon=TASTE THE MONSTERS
actors.mobs.blackmimic.charging=YOU FOOL
actors.mobs.blackmimic.charging_hint=Darkened Mimic is invulnerable while power pylon is there!
actors.mobs.blackmimic.supercharged=STOP RIGHT THERE YOU IDIOT
actors.mobs.blackmimic.charge_lost=WHHHHAAAAAT
actors.mobs.blackmimic.pylons_destroyed=HOW
actors.mobs.blackmimic.rankings_desc=Consumed by his own greed
actors.mobs.blackmimic.def_verb=blocked
actors.mobs.blackmimic.defeated=NOOOOOOOOOOOOOOOOOOOOOO-
actors.mobs.blackmimic.desc=The embodiment of your endless avaritia. It hopes to consume you alongside with Amulet, while using various gas based attacks and summoning monsters from dungeon.
actors.mobs.blackmimic.desc_clone=This is a clone of Darkened Mimic. It doesn't announce its attacks, is immune to any damage and has reduced chance to summon another clone.
actors.mobs.blackmimic.desc_supercharged=Darkened Mimic is currently charged full of frustration, In this form the mimic cannot be damaged and moves at triple speed! Additionally, its jaws now are strong enough for it to _tunnel through solid rock,_ though it moves much more slowly when doing this.\n\nAttacking Darkened Mimic directly is pointless while it is supercharged, but _something in the area must be providing it with this energy,_ destroying that may weaken it.
actors.mobs.blackmimic$fallingrocks.desc=Loose rocks are tumbling down from the ceiling here, it looks like its about to collapse!
actors.mobs.dwarfking.name=King of Dwarves
actors.mobs.dwarfking.notice=How dare you! You have no idea what you're interfering with!
actors.mobs.dwarfking.lifelink_1=I have need of your essence, slave!
actors.mobs.dwarfking.lifelink_2=Bleed for me, slave!
actors.mobs.dwarfking.teleport_1=Deal with them, slave!
actors.mobs.dwarfking.teleport_2=Keep them busy, slave!
actors.mobs.dwarfking.wave_1=Enough! Arise my slaves!
actors.mobs.dwarfking.wave_2=More! Bleed for your king!
actors.mobs.dwarfking.wave_3=Useless! KILL THEM NOW!
actors.mobs.dwarfking.enraged=You cannot kill me %s. I. AM. IMMORTAL!
actors.mobs.dwarfking.losing=No! You can't do this... you have no idea what lies below...
actors.mobs.dwarfking.defeated=You've... Doomed us all...
actors.mobs.dwarfking.rankings_desc=Fell Before the King of Dwarves
actors.mobs.dwarfking.desc=Many years ago one of the highest wizards in the dwarven court uncovered secrets which gave him tremendous power over life and death. He soon put this power to use, subjugating and corrupting his peers, his king, and eventually every dwarven citizen. Now he is king, ruler over a legion of undead subjects.\n\nThe King of Dwarves is an aggressive foe, who will attempt to surround and overwhelm his enemies with his horde of undead minions.
actors.mobs.dwarfking$dkghoul.rankings_desc=Fell Before the King of Dwarves
actors.mobs.dwarfking$dkmonk.rankings_desc=Fell Before the King of Dwarves
actors.mobs.dwarfking$dkwarlock.rankings_desc=Fell Before the King of Dwarves
actors.mobs.dwarfking$dkgolem.rankings_desc=Fell Before the King of Dwarves
actors.mobs.ebonymimic.name=ebony mimic
actors.mobs.ebonymimic.reveal=There was a mimic there!
actors.mobs.ebonymimic.hidden_name=suspicious outline
actors.mobs.ebonymimic.hidden_desc=There seems to be something here, but it's almost totally transparent.
actors.mobs.ebonymimic.desc=Mimics are magical creatures which can take any shape they wish. In dungeons they almost always choose a shape of a treasure chest, in order to lure in unsuspecting adventurers.\n\nEbony mimics are extremely tough mimics with the ability to make themselves almost invisible. They lurk on things that adventurers are likely to interact with, but do contain loot of their own as well.\n\nThere can't be anything even stronger, _right?_
actors.mobs.elemental$fireelemental.name=fire elemental
actors.mobs.elemental$fireelemental.desc=Elementals are chaotic creatures that are often created when powerful occult magic isn't properly controlled. Elementals have minimal intelligence, and are usually associated with a particular type of magic.\n\nFire elementals are a common type of elemental which deals damage with fiery magic. They will set their target ablaze with melee attacks, and can occasionally shoot bolts of fire as well.
actors.mobs.elemental$newbornfireelemental.name=newborn fire elemental
actors.mobs.elemental$newbornfireelemental.charging=The elemental is charging up!
actors.mobs.elemental$newbornfireelemental.desc=Elementals are chaotic creatures that are often created when powerful occult magic isn't properly controlled. Elementals have minimal intelligence, and are usually associated with a particular type of magic.\n\nThis fire elemental is freshly summoned, but still quite dangerous!
actors.mobs.elemental$newbornfireelemental.desc_boss=Because of the chaotic nature of its summoning, this elemental can only spread fire in inaccurate blasts after charging for a turn.
actors.mobs.elemental$newbornfireelemental.desc_ally=Because this elemental was summoned by a spell, it has a little more control over its flame. It's incapable of making ranged attacks, but will ignite enemies it attacks in melee.
actors.mobs.elemental$frostelemental.name=frost elemental
actors.mobs.elemental$frostelemental.desc=Elementals are chaotic creatures that are often created when powerful occult magic isn't properly controlled. Elementals have minimal intelligence, and are usually associated with a particular type of magic.\n\nFrost elementals are a common type of elemental which weakens enemies with chilling magic. They will chill their target with melee and occasional ranged attacks. Their magic is much more effective in water.
actors.mobs.elemental$shockelemental.name=shock elemental
actors.mobs.elemental$shockelemental.desc=Elementals are chaotic creatures that are often created when powerful occult magic isn't properly controlled. Elementals have minimal intelligence, and are usually associated with a particular type of magic.\n\nShock elementals are a less common type of elemental which disrupts its enemies with electricity and flashes of light. In melee they will arc electricity to nearby enemies, and deal bonus damage to their primary target if they are in water. They will also occasionally focus a ranged blast of light at their target, temporarily blinding them.
actors.mobs.elemental$chaoselemental.name=chaos elemental
actors.mobs.elemental$chaoselemental.desc=Elementals are chaotic creatures that are often created when powerful occult magic isn't properly controlled. Elementals have minimal intelligence, and are usually associated with a particular type of magic.\n\nChaos elementals are rare and dangerous elementals which haven't stabilized to a particular element. They will unleash wild unpredictable magic when they attack.
actors.mobs.eye.name=evil eye
actors.mobs.eye.deathgaze_kill=The deathgaze killed you...
actors.mobs.eye.desc=Evil Eyes are floating balls of pent up demonic energy. While they are capable of melee combat, their true strength comes from their magic.\n\nAfter building energy for a short time an Evil Eye will unleash a devastating beam of energy called the _deathgaze._ Anything within the Evil Eye's sights will take tremendous damage, wise adventurers will run for cover.
actors.mobs.fetidrat.name=fetid rat
actors.mobs.fetidrat.desc=Something is clearly wrong with this rat. Its greasy black fur and rotting skin are very different from the healthy rats you've seen previously. Its pale green eyes make it seem especially menacing.\n\nThe rat carries a cloud of horrible stench with it, it's overpoweringly strong up close.\n\nDark ooze dribbles from the rat's mouth, it eats through the floor but seems to dissolve in water.
actors.mobs.fungalcore.name=fungal core
actors.mobs.fungalcore.desc=This gigantic mushroom must be the source of all the fungal activity in this cave.
actors.mobs.fungalsentry.name=fungal sentry
actors.mobs.fungalsentry.desc=This especially tall mushroom acts as a point of defense for the larger fungal network living in this cave.\n\nIt is immobile, but will shoot precise blasts of poison at anything that gets within its line of sight. While the impact of these blasts is fairly weak, _they can stack up deadly amounts of poison very quickly._ While it can be killed, it's probably best to avoid it.
actors.mobs.fungalspinner.name=fungal spinner
actors.mobs.fungalspinner.desc=This cave spinner appears to be being controlled by a parasitic fungus. The fungus has also changed its abilities, replacing its web and venom sacks with fungal growth.\n\nThe fungal spinner will spit plant life at you instead of webs, spreading fungal vegetation and potentially rooting you. While it can't poison, the fungal spinner will gain substantial damage resistance if it is adjacent to any mushrooms.
actors.mobs.ghoul.name=dwarven ghoul
actors.mobs.ghoul.desc=As dwarven society slowly began to collapse, and the current king of the dwarves seized absolute power, those who were weak or who resisted him were not treated well. As the king grew more adept at wielding dark magic, he bent these dwarves to his will, and now they make up the footsoldiers of his army.\n\nGhouls are not especially strong on their own, but always travel in groups and are much harder to kill in large numbers. _When a ghoul is defeated, it will rise again after a few turns as long as another ghoul is nearby._
actors.mobs.gnoll.name=gnoll scout
actors.mobs.gnoll.desc=Gnolls are hyena-like humanoids. They dwell in sewers and dungeons, venturing up to raid the surface from time to time. Gnoll scouts are regular members of their pack, they are not as strong as brutes and not as intelligent as shamans.
actors.mobs.gnollgeomancer.name=gnoll geomancer
actors.mobs.gnollgeomancer.warning=The geomancer begins to stir. Make sure you're ready before you continue!
actors.mobs.gnollgeomancer.alert=The geomancer awakens! The entire cave seems to shift as it leaps away while laughing madly!
actors.mobs.gnollgeomancer.rock_kill=The flying boulder killed you...
actors.mobs.gnollgeomancer.rockfall_kill=The falling rocks killed you...
actors.mobs.gnollgeomancer.desc=This impressively tall senior gnoll must be the source of the various earth-moving magic around here, and the organizer of all the gnoll activity. Unlike the gnoll sappers in the area, the geomancer is quite adept with its magic, and cannot be damaged by thrown or falling rocks. It doesn't have any way to fight in melee combat though.
actors.mobs.gnollgeomancer.desc_armor=The geomancer is currently encased in a layer of rock armor. _You'll need to get up close and break it away with your pickaxe before you can damage the geomancer._
actors.mobs.gnollgeomancer.desc_armor_sapper=_A nearby gnoll sapper is holding a device that is empowering the geomancer's rock armor. You won't be able to damage it at all right now!_
actors.mobs.gnollgeomancer.desc_sleeping=This impressively tall gnoll shaman is surrounded by a layer of rock, and looks almost like a statue. Looking closely you can see the rock magically move in time with the senior gnoll's breathing. It can't be harmed while encased in rock like this, and it appears to be enjoying a literal dirt nap.\n\nYou can probably break through the layers of rock with your pickaxe, but _be sure you're ready for a fight when you do so._ The geomancer must be the source of the various earth-moving magic around here, and the organizer of all the gnoll activity. _Defeating the gnolls scattered around here before fighting it might be a good idea._
actors.mobs.gnollguard.name=gnoll guard
actors.mobs.gnollguard.spear_warn=The gnoll lands a vicious blow with the tip of its spear!
actors.mobs.gnollguard.desc=A large and tough looking gnoll wielding a spear and a shield, but no helmet. These guards are likely brutes in training, roped into helping protect the mine from encroaching wildlife.\n\nThe gnoll guard is strong enough to wield the spear in one hand, but can't use it very well. _It will need fairly open space to attack at a distance, and will do notably less damage to you if you get up close._
actors.mobs.gnollguard.desc_armor=_A nearby gnoll sapper is holding a device that is granting this guard earthen armor, heavily reducing the damage it takes._
actors.mobs.gnollsapper.name=gnoll sapper
actors.mobs.gnollsapper.desc=A small and weak but intelligent gnoll with pale fur and a satchel full of various gadgets. They are likely here to assist with prospecting and mining dark gold, and have a nearby guard for protection. They are capable of fighting, but their attacks are pitifully weak, no stronger than a gnoll scout.\n\nInstead of fighting directly, sappers prefer to use the various gadgets they have to make the rocky environment attack for them. They don't know earth-moving magic themselves though, and so are pretty likely to use their gadgets recklessly. _There should be lots of ways to use their attacks against them, or their guard._
actors.mobs.gnolltrickster.name=gnoll trickster
actors.mobs.gnolltrickster.desc=A strange looking creature, even by gnoll standards. It hunches forward with a wicked grin, almost cradling the satchel hanging over its shoulder. Its eyes are wide with a strange mix of fear and excitement.\n\nThere is a large collection of poorly made darts in its satchel, they all seem to be tipped with various harmful substances.
actors.mobs.goldenmimic.name=golden mimic
actors.mobs.goldenmimic.desc=Mimics are magical creatures which can take any shape they wish. In dungeons they almost always choose a shape of a treasure chest, in order to lure in unsuspecting adventurers.\n\nGolden mimics are tougher mimics which try to attract the strongest adventurers. They have better loot, but are also much stronger than regular mimics.
actors.mobs.golem.name=golem
actors.mobs.golem.def_verb=blocked
actors.mobs.golem.desc=Golems are an attempt to correct the previous flaws in dwarven machinery via the dwarves newfound use of magic. They are much more compact and efficient compared to the DM-300 while still being very deadly.\n\nWhile golems are still too large to fit into passageways, the dwarves have given them new magical abilities to compensate. Golems can teleport themselves between rooms, and teleport enemies to them when they are out of reach.
actors.mobs.goo.name=Goo
actors.mobs.goo.notice=GLURP-GLURP!
actors.mobs.goo.defeated=glurp... glurp...
actors.mobs.goo.pumpup=Goo is pumping itself up!
actors.mobs.goo.enraged=enraged
actors.mobs.goo.gluuurp=GLUUUURP!
actors.mobs.goo.rankings_desc=Absorbed by the Goo
actors.mobs.goo.desc=Little is known about The Goo. It's quite possible that it is not even a creature, but rather a conglomerate of vile substances from the sewers that somehow gained basic intelligence. Regardless, dark magic is certainly what has allowed Goo to exist.\n\nIts gelatinous nature has let it absorb lots of dark energy, you feel a chill just from being near. If Goo is able to attack with this energy you won't live for long.
actors.mobs.goldengoo.name=Golden Goo
actors.mobs.goldengoo.notice=SHINE-GLURP!
actors.mobs.goldengoo.defeated=glurp... shine...
actors.mobs.goldengoo.pumpup=Golden Goo is charging golden radiance!
actors.mobs.goldengoo.enraged=radiant rage
actors.mobs.goldengoo.gluuurp=GOLDEN GLUUUURP!
actors.mobs.goldengoo.rankings_desc=Absorbed by the Golden Goo
actors.mobs.goldengoo.desc=A legendary radiant variant of The Goo. Infused with pure golden essence, defeating it yields unimaginable class wealth!
actors.mobs.goldengoo.reward=The Golden Goo dropped a radiant +4 %s!
actors.mobs.greatcrab.name=great crab
actors.mobs.greatcrab.noticed=The crab blocks with its massive claw.
actors.mobs.greatcrab.def_verb=blocked
actors.mobs.greatcrab.desc=This crab is gigantic, even compared to other sewer crabs. Its blue shell is covered in cracks and barnacles, showing great age. It lumbers around slowly, barely keeping balance with its massive claw.\n\nWhile the crab only has one claw, its size easily compensates. The crab holds the claw in front of any threat, shielding itself behind an impenetrable wall of carapace. However, the crab cannot block attacks it doesn't see coming, or attacks from multiple enemies at once.
actors.mobs.guard.name=prison guard
actors.mobs.guard.scorpion=Get over here!
actors.mobs.guard.def_verb=blocked
actors.mobs.guard.desc=Once keepers of the prison, these guards have long since become no different than the inmates. They shamble like zombies, brainlessly roaming through the halls in search of anything out of place, like you!\n\nThey carry chains around their hip, possibly used to pull in enemies to close range.
actors.mobs.mimic.name=mimic
actors.mobs.mimic.reveal=That chest is a mimic!
actors.mobs.mimic.hidden_hint=Something about this chest feels off... Walking up and trying to open it might be a bad idea.
actors.mobs.mimic.desc=Mimics are magical creatures which can take any shape they wish. In dungeons they almost always choose a shape of a treasure chest, in order to lure in unsuspecting adventurers.\n\nMimics have a nasty bite, but often hold more treasure than a regular chest.
actors.mobs.necromancer.name=necromancer
actors.mobs.necromancer.desc=These apprentice dark mages have flocked to the prison, as it is the perfect place to practise their evil craft.\n\nNecromancers will summon and empower skeletons to fight for them. Killing the necromancer will also kill the skeleton it summons.
actors.mobs.necromancer$necroskeleton.name=necromancer's skeleton
actors.mobs.necromancer$necroskeleton.desc=This skeleton has been summoned by a necromancer. It behaves just like a regular skeleton, and will die when the necromancer which summoned it is slain.
actors.mobs.mob.died=You hear something die in the distance.
actors.mobs.mob.rage=#$%^
actors.mobs.mob.rankings_desc=Slain by: %s
actors.mobs.monk.name=dwarf monk
actors.mobs.monk.def_verb=blocked
actors.mobs.monk.parried=parried
actors.mobs.monk.desc=These monks are fanatics, who have devoted themselves to protecting their king through physical might. So great is their devotion that they have totally surrendered their minds to their king, and now roam the dwarvern city like mindless zombies.\n\nMonks rely solely on the art of hand-to-hand combat, and are able to use their unarmed fists both for offense and defense. When they become focused, monks will parry the next physical attack used against them, even if it was otherwise guaranteed to hit. Monks build focus more quickly while on the move, and more slowly when in direct combat.
actors.mobs.monk$focus.name=focused
actors.mobs.monk$focus.desc=This monk is perfectly honed in on their target, and seem to be anticipating their moves before they make them.\n\nWhile focused, the next physical attack made against this character is guaranteed to miss, no matter what circumstances there are. Parrying this attack will spend the monk's focus, and they will need to build it up again to parry another attack. Monks build focus more quickly while they are moving.
actors.mobs.phantompiranha.name=phantom piranha
actors.mobs.phantompiranha.teleport_away=The phantom piranha teleports away...
actors.mobs.phantompiranha.desc=Phantom piranhas are a rare breed of piranha with magical abilities and eerie translucent bodies. They are capable of teleporting as they are being attacked, either to escape or to quickly get close to their enemy!\n\nWhile they are annoying to fight, their meat is prized for its magical properties.
actors.mobs.piranha.name=giant piranha
actors.mobs.piranha.desc=These carnivorous fish are not natural inhabitants of underground pools. They were bred specifically to protect flooded treasure vaults.
actors.mobs.pylon.name=power pylon
actors.mobs.pylon.desc_inactive=A power pylon, meant to help regulate the electricity which powers the machinery in this area.\n\nThe pylon is currently inactive and immune to damage.
actors.mobs.pylon.desc_active=A power pylon, meant to help regulate the electricity which powers the machinery in this area. The pylon is currently surging with electrical energy, this must be what's supercharging DM-300!\n\nIn this state pylons are vulnerable, but will arc electricity to nearby cells in a clockwise pattern. Due to their heavy metal construction, pylons are resistant to large amounts of damage.
actors.mobs.rat.name=marsupial rat
actors.mobs.rat.desc=Marsupial rats are aggressive but rather weak denizens of the sewers. They have a nasty bite, but are only life threatening in large numbers.
actors.mobs.ripperdemon.name=ripper demon
actors.mobs.ripperdemon.leap=The ripper demon prepares to leap!
actors.mobs.ripperdemon.desc=These horrific creatures are the result of the many dwarven corpses in this region being put to use by demonic forces. Rippers are emaciated ghoulish creatures that resemble dwarves, but with broken bodies and long sharp claws made of bone.\n\nRipper demons are not particularly durable, but they are agile and dangerous. They are capable of leaping great distances to quickly reach targets before goring them with their claws.
actors.mobs.rotheart.name=rot heart
actors.mobs.rotheart.desc=A Rotberry's fruit is very unique. Instead of rotting away and providing nutrients, the fruit grows, hardens, and encompasses the seed. It provides protection for the internal organs which grow inside the fruit. This giant orb is referred to as the heart of an adult rotberry plant.
actors.mobs.rotlasher.name=rot lasher
actors.mobs.rotlasher.desc=The rot lasher is a part of a mature rotberry plant's root structure, and also their primary means of defense. Lashers are blind and stuck into the ground, but will violently assault any nearby threat after taking a moment to detect them. When there is no nearby enemies, they stand motionless, attempting to blend in with surrounding vegetation.
actors.mobs.scorpio.name=scorpio
actors.mobs.scorpio.desc=These huge arachnid-like demonic creatures avoid close combat, preferring to fire crippling serrated spikes from long distances.
actors.mobs.senior.name=senior monk
actors.mobs.senior.desc=These monks are fanatics, who have devoted themselves to protecting their king through physical might. So great is their devotion that they have totally surrendered their minds to their king, and now roam the dwarvern city like mindless zombies.\n\nThis monk has mastered the art of hand-to-hand combat, and is able to gain focus while moving much more quickly than regular monks. When they become focused, monks will parry the next physical attack used against them, even if it was otherwise guaranteed to hit. Monks build focus more quickly while on the move, and more slowly when in direct combat.
actors.mobs.shaman.name=gnoll shaman
actors.mobs.shaman.bolt_kill=The magic bolt killed you...
actors.mobs.shaman.desc=Gnoll shamans are intelligent gnolls who use battle spells to compensate for their lack of might. They have a very respected position in gnoll society, despite their weaker strength.
actors.mobs.shaman$redshaman.spell_desc=This shaman is wearing a red mask, and will use magic that temporarily _weakens your attacking power._
actors.mobs.shaman$blueshaman.spell_desc=This shaman is wearing a blue mask, and will use magic that temporarily _increases the damage you take._
actors.mobs.shaman$purpleshaman.spell_desc=This shaman is wearing a purple mask, and will use magic that temporarily _reduces your accuracy and evasion._
actors.mobs.armoredbrute.name=armored brute
actors.mobs.armoredbrute.desc=The most senior gnoll brutes often wear powerful armor to show their status. The armor makes these brutes much more resilient to physical damage, and their greater discipline means they can rage for much longer before succumbing to their wounds.
actors.mobs.skeleton.name=skeleton
actors.mobs.skeleton.explo_kill=You were killed by the explosion of bones...
actors.mobs.skeleton.def_verb=blocked
actors.mobs.skeleton.desc=Skeletons are composed of the bones of unlucky adventurers and inhabitants of the prison, animated by emanations of evil magic from the depths below. After they have been damaged enough, skeletons will disintegrate in an explosion of bones. The shrapnel from this explosion is harmful to anything nearby, but armor is very effective at mitigating it.
actors.mobs.slime.name=slime
actors.mobs.slime.def_verb=blocked
actors.mobs.slime.desc=Slimes are strange, slightly magical creatures with a rubbery outer body and a liquid core. The city sewers provide them with an ample supply of water and nutrients.\n\nBecause of their elastic outer membrane, it is difficult to deal more than _6 damage_ to slimes from any one attack.
actors.mobs.snake.name=sewer snake
actors.mobs.snake.hint=Try using the examine button on a snake to learn how to counter them.
actors.mobs.snake.desc=These oversized serpents are capable of quickly slithering around blows, making them quite hard to hit. Magical attacks or surprise attacks are capable of catching them off-guard however.\n\nYou can perform a surprise attack by attacking while out of the snake's vision. One way is to let a snake chase you through a doorway and then _strike just after it moves into the door._
actors.mobs.spectralnecromancer.name=spectral necromancer
actors.mobs.spectralnecromancer.desc=While Skeletons are a necromancer’s bread and butter, some prefer to look into other less corporeal minions. Spectral necromancers have chosen wraiths as their minion of choice!\n\nIndividual wraiths aren't as strong as skeletons, but these necromancers aren't afraid to summon a bunch of them!
actors.mobs.spinner.name=cave spinner
actors.mobs.spinner.desc=These greenish furry cave spiders try to avoid direct combat. Instead they prefer to wait in the distance while their victim struggles in their excreted cobweb, slowly dying from their venomous bite. They are capable of shooting their webs great distances, and will try to block whatever path their prey is taking.
actors.mobs.statue.name=animated statue
actors.mobs.statue.def_verb=blocked
actors.mobs.statue.desc=You would think that it's just another one of this dungeon's inanimate statues, but its red glowing eyes give it away.
actors.mobs.statue.desc_weapon=While the statue itself is made of stone, the _%s_ it's wielding looks real.
actors.mobs.succubus.name=succubus
actors.mobs.succubus.desc=Succubi are shapeshifting demons that manipulate the minds of their prey. This one has taken the form of a pale gothic humanoid, perhaps to attract dwarven warlocks?\n\nSuccubi may temporarily charm their enemy when they attack, making their enemy unable to directly attack them. When succubi attack a charmed enemy, they will steal some of their life essence.
actors.mobs.swarm.name=swarm of flies
actors.mobs.swarm.desc=The deadly swarm of flies buzzes angrily. Every non-magical attack will split it into two smaller but equally dangerous swarms.
actors.mobs.tengu.name=Tengu
actors.mobs.tengu.notice_gotcha=Gotcha, %s!
actors.mobs.tengu.interesting=Let's make this interesting...
actors.mobs.tengu.notice_have=I have you now, %s!
actors.mobs.tengu.defeated=Free at last...
actors.mobs.tengu.rankings_desc=Assassinated by the Tengu
actors.mobs.tengu.desc=A famous and enigmatic assassin, named for the mask grafted to his face.\n\nTengu is held down with large clasps on his wrists and knees, though he seems to have gotten rid of his chains long ago.\n\nHe will try to use traps, deceptive magic, and precise attacks to eliminate the only thing stopping his escape: you.
actors.mobs.tengu$bombability$bombblob.desc=A cloud of superheated smoke is billowing here. Watch out, it's going to explode!
actors.mobs.tengu$bombability$bombitem.name=Smoke Bomb
actors.mobs.tengu$bombability$bombitem.cant_pickup=It's stuck to the ground, you can't move it!
actors.mobs.tengu$bombability$bombitem.desc=Tengu has thrown a strange looking smoke bomb here, which is billowing a thick hot smoke. It's making a loud ticking noise, as if its counting down to an explosion!\n\nThe bomb has anchored itself to the ground, so you can't pick it up.
actors.mobs.tengu$fireability$fireblob.desc=Tengu has thrown a fine powder that seems to be catching into steam here, it's about to ignite!
actors.mobs.tengu$shockerability$shockerblob.desc=Electrical energy is building here, anything standing on this tile will be shocked next turn!
actors.mobs.tengu$shockerability$shockeritem.name=Shocker
actors.mobs.tengu$shockerability$shockeritem.cant_pickup=It's putting out too much electricity, you can't grab it!
actors.mobs.tengu$shockerability$shockeritem.desc=Tengu has thrown a curious machine here, which seems to be made of DM-100 parts. The machine is constantly arcing electricity around it, but it seems to be going in a predictable pattern.\n\nWith all the electricity arcing around it, there's no way you can pick this up.
actors.mobs.thief.name=crazy thief
actors.mobs.thief.stole=The thief stole %s from you!
actors.mobs.thief.carries=\n\nThe thief is carrying a _%s._ Stolen obviously.
actors.mobs.thief.escapes=The thief gets away with your %s!
actors.mobs.thief.desc=Though these inmates roam free of their cells, this place is still their prison. Over time, this place has taken their minds as well as their freedom. Long ago, these crazy thieves and bandits have forgotten who they are and why they steal.\n\nThese enemies are more likely to steal and run than they are to fight. Make sure to keep them in sight, or you might never see your stolen item again.
actors.mobs.oofthief.name=OOF thief
actors.mobs.oofthief.stole=The thief stole %s from you! You can recover it from resetting shop depths and buying %s from there!
actors.mobs.oofthief.escapes=The thief teleports away!
actors.mobs.oofthief.desc=Genetically engineered by tormented sparks of robots and funded by impossibly modified foxes, this variant of thief has been augmented to prevail above all its prison brothers.\n\nIt is roughly 2.5x times stronger than normal thieves in both resistance and accuracy, attacks 3 times in a row and sells all stolen loot to incredibly corrupted shop companies. It also has teleportation device to hide from its victims once enough property is stolen.\n\nOne of OOF thief's only weaknesses is its movement speed: it moves 3x faster than a normal human, but has _tendency to slip on a moss, or a rock, or a twig_ and make no progress in moving right to its target.\n\nOn the last breath, OOF thief will enter desperation mode, being immune to any damage for short time and moving significantly faster.
actors.mobs.tormentedspirit.name=tormented spirit
actors.mobs.tormentedspirit.desc=Tormented spirits are otherwise good-natured spirits that has been afflicted by a curse. So long as they are cursed they will attack just like a wraith, and are more powerful as well!\n\nIt may be possible to cleanse the curse by using the right item while next to the spirit. If the curse is lifted the spirit will surely be grateful...
actors.mobs.tormentedspirit.thank_you=Thank you...
actors.mobs.warlock.name=dwarf warlock
actors.mobs.warlock.bolt_kill=The shadow bolt killed you...
actors.mobs.warlock.desc=As the dwarves' interests shifted from engineering to arcane arts, warlocks came to power in the city. They started with elemental magic, but soon switched to demonology and necromancy. The strongest of these warlocks seized the throne of the dwarven city, and his cohorts were allowed to continue practising their dark magic, so long as they surrendered their free will to him.\n\nThese warlocks possess powerful disruptive magic, and are able to temporarily hinder the upgrade magic applied to your equipment. The more upgraded an item is, the more strongly it will be affected.
actors.mobs.wraith.name=wraith
actors.mobs.wraith.desc=A wraith is a vengeful spirit of a sinner, whose grave or tomb was disturbed. Being an ethereal entity, it is very hard to hit with a regular weapon.
actors.mobs.yogdzewa.name=Yog-Dzewa
actors.mobs.yogdzewa.notice=I. SEE. YOU.
actors.mobs.yogdzewa.darkness=The darkness pulls in closer...
actors.mobs.yogdzewa.hope=YOUR. HOPE. IS. AN. ILLUSION!
actors.mobs.yogdzewa.defeated=...
actors.mobs.yogdzewa.rankings_desc=Devoured by Yog-Dzewa
actors.mobs.yogdzewa.desc=Yog-Dzewa is an Old God; a great monstrosity which reaches into mortal worlds and devours them to fuel its endless growth. The dwarves must have attracted the attention of this cosmic horror while toying with dark magics, and have been trying to keep it contained ever since.\n\nYog-Dzewa originates from a dimension of raw magical chaos, and cannot bring its true form into this world. Instead it has created avatars and summoned demonic minions to do its bidding here.\n\nThis giant eye is the focal point of Yog-Dzewa's power in this world. While the eye itself is immobile, it is capable of shooting powerful beams of demonic magic and summoning a variety of minions to aid it.\n\nCan drop clay, if killed by Minecraft reference.
actors.mobs.yogdzewa.desc_spawners=You can feel waves of demonic energy radiating to the eye from the floors above. Something you left alive up there must be funneling power back into Yog-Dzewa. _Yog will use this energy to summon more powerful minions!_
actors.mobs.yogdzewa$larva.name=god's larva
actors.mobs.yogdzewa$larva.rankings_desc=Devoured by Yog-Dzewa
actors.mobs.yogdzewa$larva.desc=These tiny spawn of Yog-Dzewa are simple minions that are easy to produce. While individually weak, they are summoned quickly and can become overwhelming in large numbers.
actors.mobs.yogdzewa$yogripper.rankings_desc=Devoured by Yog-Dzewa
actors.mobs.yogdzewa$yogeye.rankings_desc=Devoured by Yog-Dzewa
actors.mobs.yogdzewa$yogscorpio.rankings_desc=Devoured by Yog-Dzewa
actors.mobs.yogfist.invuln_warn=The fist is invulnerable while near to the eye!
actors.mobs.yogfist.rankings_desc=Devoured by Yog-Dzewa
actors.mobs.yogfist.desc=This fist is an aspect of Yog-Dzewa's power. Fists are linked to the power of Yog-Dzewa, and will be protected from all damage when they are close to the eye.
actors.mobs.yogfist$burningfist.name=burning fist
actors.mobs.yogfist$burningfist.desc=This fist is formed out of chaotic fiery magic. As it moves it will constantly set terrain around it ablaze. It is also capable of shooting blasts of fiery power, which spread flames where they impact.\n\nThe fist's ability to spread flames is suppressed when near water, but its heat is so great that any water around it will evaporate after a short while!
actors.mobs.yogfist$soiledfist.name=soiled fist
actors.mobs.yogfist$soiledfist.desc=This fist is formed out of chaotic earthen magic. As it moves it will constantly cause vegetation to sprout around it. It can also shoot concentrated earthen blasts that will ensnare its target in rapidly growing vines and roots!\n\nThe fist derives power from this plant life, and will resist damage based on the amount of tall or furrowed vegetation near it!
actors.mobs.yogfist$rottingfist.name=rotting fist
actors.mobs.yogfist$rottingfist.desc=This fist is formed out of living corruption. It is a towering mass of decaying flesh that can spread caustic ooze in melee and toxic gas at range. Even worse, the fist's great mass causes it to bleed instead of taking damage directly.\n\nWater can be used to wash the ooze off, but the fist is also capable of absorbing water to heal itself! Additionally, damaging the fist while it is bleeding will cause the bleed to refresh, but not stack!
actors.mobs.yogfist$rustedfist.name=rusted fist
actors.mobs.yogfist$rustedfist.desc=This fist is formed out of living metal. It is a towering mass of shifting metal that has powerful melee attacks, and can cripple its targets at range. Because of its tremendous mass, the fist will take any damage dealt to it over time, instead of immediately.\n\nThe fist is inflexible however, and cannot move into tight passageways. Additionally, while it may take damage slowly, the deferred damage will continue to increase if the fist is hit multiple times.
actors.mobs.yogfist$brightfist.name=bright fist
actors.mobs.yogfist$brightfist.teleport=The fist teleports away in a flash of light that seriously blinds you!
actors.mobs.yogfist$brightfist.desc=This fist is formed out of pure light energy. It is capable of shooting powerful rays of searing light every turn! These beams will temporarily blind you in addition to dealing heavy damage. The fist is also capable of briefly engulfing the arena in blinding light in order to escape!\n\nThe fist has no special abilities which it can use in melee range however.
actors.mobs.yogfist$darkfist.name=dark fist
actors.mobs.yogfist$darkfist.teleport=The fist teleports away in a blast of darkness that extinguishes your light source!
actors.mobs.yogfist$darkfist.desc=This fist is formed out of pure dark energy. It is capable of shooting powerful blasts of dark magic every turn! These blasts will weaken your light source in addition to dealing heavy damage. The fist is also capable of briefly engulfing the arena in darkness in order to escape!\n\nThe fist has no special abilities which it can use in melee range however.
