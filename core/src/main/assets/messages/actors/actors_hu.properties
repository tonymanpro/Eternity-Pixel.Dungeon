###blobs
actors.blobs.blizzard.name=hóvihar
actors.blobs.blizzard.desc=Hóvihar örvénylik ezen a helyen.

actors.blobs.confusiongas.name=zavarógáz
actors.blobs.confusiongas.desc=Zavarógáz felhője örvénylik ezen a helyen.

actors.blobs.electricity.name=elektromosság
actors.blobs.electricity.desc=Fényes elektromos mező szikrázik ezen a helyen.
actors.blobs.electricity.rankings_desc=Áramütést szenvedtél
actors.blobs.electricity.ondeath=Halálos áramütés ért…

actors.blobs.fire.name=tűz
actors.blobs.fire.desc=Tűz tombol ezen a helyen.

actors.blobs.foliage.name=lombozat
actors.blobs.foliage.desc=Fénysugarak hatolnak a föld alatti kert homályába.

actors.blobs.freezing.name=fagyos levegő
actors.blobs.freezing.desc=Rendellenesen fagyos itt a levegő.

actors.blobs.goowarn.name=sötét energia
actors.blobs.goowarn.desc=Sötét energiaszemcsék hemzsegnek ezen a helyen!

actors.blobs.inferno.name=tűzvihar
actors.blobs.inferno.desc=Tűzvihar tombol ezen a helyen.

actors.blobs.paralyticgas.name=bénítógáz
actors.blobs.paralyticgas.desc=Bénítógáz kavarog ezen a helyen.

actors.blobs.regrowth.name=sarjadás

actors.blobs.sacrificialfire.name=áldozati tűz
actors.blobs.sacrificialfire.desc=Van itt egy oltár, amelynek tetején áldozati tűz ég. Minden itt megölt lényt áldozatként fogadnak el a kazamata szellemei.\n\nTalán megjutalmaznak, ha elég áldozatot kapnak?
actors.blobs.sacrificialfire.worthy=A tűz felemészti a felajánlásodat, és egyre erősebbé válik.
actors.blobs.sacrificialfire.unworthy=A tűz felemészti a felajánlásodat, de nem változik.
actors.blobs.sacrificialfire.reward=A tűz fellángol, majd kialszik, jutalmat hagyva maga után!

actors.blobs.smokescreen.name=füstfüggöny
actors.blobs.smokescreen.desc=Sűrű fekete füst kavarog ezen a helyen.

actors.blobs.stenchgas.name=fullasztó gáz
actors.blobs.stenchgas.desc=Fullasztó bűzfelhő kavarog ezen a helyen.

actors.blobs.stormcloud.name=viharfelhő
actors.blobs.stormcloud.desc=Gomolygó vízpára kavarog ezen a helyen.

actors.blobs.toxicgas.name=mérgező gáz
actors.blobs.toxicgas.desc=Mérgező gáz zöldes felhője kavarog ezen a helyen.
actors.blobs.toxicgas.rankings_desc=Megfulladtál
actors.blobs.toxicgas.ondeath=Meghaltál a mérgező gáztól...

actors.blobs.corrosivegas.name=maró gáz
actors.blobs.corrosivegas.desc=Halálos marógáz kavarog ezen a helyen.

actors.blobs.waterofawareness.name=éberség vize
actors.blobs.waterofawareness.procced=Amint belekortyolsz, érzed, hogy új tudás járja át az elmédet.
actors.blobs.waterofawareness.desc=A tudás ereje sugárzik a kút vizéből. Ha iszol a kútból, teljesen azonosítja a rajtad lévő felszereléseket, azonosítja az átkokat a hátizsákodban lévő összes tárgyon, továbbá felfedi az emeleten lévő összes tárgyat.

actors.blobs.waterofhealth.name=gyógyvíz
actors.blobs.waterofhealth.procced=Belekortyolva érzed, hogy a sebeid teljesen begyógyulnak.
actors.blobs.waterofhealth.desc=Az élet ereje sugárzik a kút vizéből. Ha iszol a kútból, begyógyulnak a sebeid, elmúlik az éhséged, továbbá megtisztulnak a rajtad lévő felszerelések az átkoktól.

actors.blobs.web.name=pókháló
actors.blobs.web.desc=Itt mindent vastag pókháló fed. Bármi, amit nekidobnak, vagy aki megérinti, elszakítja ugyan, de oda is ragad.



###buffs
actors.buffs.adrenaline.name=adrenalin
actors.buffs.adrenaline.desc=Az adrenalin hirtelen fizikai erőt ad, és fokozza a támadási és mozgási sebességet is.\n\nAz adrenalin a célpontja mozgási sebességét 2x-esére, a támadási sebességét 1,5x-esére növeli.\n\nHátralévő körök: %s.

actors.buffs.adrenalinesurge.name=erőnövelés
actors.buffs.adrenalinesurge.desc=Hatalmas erőlöket, de sajnos nem végleges.\n\nErőnövekedés: +%d.\nAz erőnövekedés %s kör múlva gyengül.

actors.buffs.amok.name=ámok
actors.buffs.amok.desc=Az ámok óriási dühöt és zavartságot kelt a célpontjában.\n\nA hatása alá kerülő lény bármit megtámad a közelében, legyen az akár ellenség, akár barát.\n\nAz ámok még %s körig tart.

actors.buffs.arcanearmor.name=misztikus páncél
actors.buffs.arcanearmor.desc=Vékony védőburok ölel körbe, amely megvéd a mágikus támadások okozta sérülés egy részétől.\n\nA mágikus páncélod ennyivel erősödött: 0-%d.\n\nA misztikus páncél %s kör múlva gyengülni kezd.

actors.buffs.artifactrecharge.name=ereklyefeltöltés
actors.buffs.artifactrecharge.desc=Energia áramlik át rajtad, amely megnöveli a viselt ereklyéid töltési sebességét.\n\nMinden ereklyére kicsit máshogy hat, de a töltődés sokkal gyorsabban végbemegy, mint normál esetben.\n\nHátralévő körök: %s.

actors.buffs.ascensionchallenge.name=az amulett átka
actors.buffs.ascensionchallenge.desc=Yog-Dzewa befolyása erre a világra valahogyan megmaradt az amuletten keresztül, aki megpróbálja meggátolni, hogy feljuss!\n\nYog hatalma sokkal veszélyesebbé teszi a kazamatákat, növeli az ellenségek számát és erősebbé teszi őket! Ez a hatalom tovább fog erősödni, ha nem tartod ellenőrzés alatt, de gyengítheted, ha legyőzöd a Yog hatalma által felerősített ellenségeket.
actors.buffs.ascensionchallenge.desc_clear=Az amulettből sugárzó sötét energiát egyelőre a lehető legjobban legyengítetted.
actors.buffs.ascensionchallenge.desc_beckon=Az amulett jelenleg _hívja a távoli ellenséget,_ és odariasztja őket hozzád.
actors.buffs.ascensionchallenge.desc_haste=Az amulett jelenleg _sürgeti a távoli ellenséget,_ így gyorsabban elérhetnek téged!
actors.buffs.ascensionchallenge.desc_slow=Az amulett jelenleg _lassít téged,_ és érvényteleníti a sebességnövelő hatásokat!
actors.buffs.ascensionchallenge.desc_damage=Az amulett energiája olyan erőssé vált, hogy _közvetlenül árt neked!_
actors.buffs.ascensionchallenge.beckon=Az amulett nekiáll hívogatni a távoli ellenségeket.
actors.buffs.ascensionchallenge.haste=Az amulett nekiáll sürgetni a távoli ellenségeket!
actors.buffs.ascensionchallenge.slow=Az amulett kezd ólomsúlynak tűnni a hátizsákodban!
actors.buffs.ascensionchallenge.damage=Az amulett nekiáll sötét energiát sugározni. Éget!
actors.buffs.ascensionchallenge.weaken_info=Ahhoz, hogy gyengítsd az amulett átkát, ellenfeleket kell legyőznöd!
actors.buffs.ascensionchallenge.weaken_info_no_kills=Ha legyőzöd az ellenségeket, az amulett átka gyengülni fog!
actors.buffs.ascensionchallenge.weaken=Érzed, hogy az amulett átka kissé gyengül.
actors.buffs.ascensionchallenge.break=Egy pillanatra megállsz, hogy kifújd magad, és érzed, hogy a sebeid kezdenek összezáródni!
actors.buffs.ascensionchallenge.almost=Érzed, hogy Yog szorítása az amuletten kezd gyengülni, már majdnem kint vagy!
actors.buffs.ascensionchallenge.on_kill=A sötét energia felemészt téged...

actors.buffs.barkskin.name=kéregbőr
actors.buffs.barkskin.desc=A bőröd megkeményedett, durva és szilárd, mint a fakéreg.\n\nA kemény bőr nagyobb páncélzatot biztosít, így jobban tudsz védekezni a fizikai támadások ellen.\n\nA páncélzatod jelenleg ennyivel erősebb: 0-%d.\nA kéregbőr gyengüléséig hátralévő körök: %s.\n\nHa több forrásból is kaptál kéregbőrt, csak a legerősebb lesz érvényes.

actors.buffs.barrier.name=védőréteg
actors.buffs.barrier.desc=Tartós erőbuborék, amely megvéd minden sérüléstől.\n\nAmíg tart a védőburok, a védőréteg szenvedi el a sérülést a helyett, amit védelmez. A védőburok ugyanakkor lassacskán szétesik. \n\nHátralévő védőburok: %d.

actors.buffs.berserk.angered=dühödt
actors.buffs.berserk.berserk=vérengzés
actors.buffs.berserk.exhausted=kimerült
actors.buffs.berserk.recovering=pihen
actors.buffs.berserk.angered_desc=A vérengző sérüléseinek súlyossága erősíti az ütéseit. Ahogy a vérengző fizikai sebzést szenved el, a dühe növekszik, ami bónusz sebzést biztosít neki. A páncél által blokkolt sebzés továbbra is beleszámít a dühösebbé válásban.\n\nA düh idővel csökken. Minél alacsonyabb a vérengző életereje, annál tovább tart.\n\n100%% dühpontnál a vérengző dühönghet, ami a páncélja szintje és a hiányzó életereje alapján pajzsot biztosít neki. Dühöngés közben a pajzsa idővel csökken, és ha elfogy, pihennie kell, mielőtt újra dühöngeni kezdene.\n\nJelenlegi düh: _%1$.0f%%_\n_+%2$.0f%%_ sebzés\n\nA védőburok a jelenlegi páncél és életerő mellett: _%3$d_
actors.buffs.berserk.berserk_desc=A félelem és a bizonytalanság elillan, csak a haragot hagyva maga után. Ebben az állapotban a vérengző rendkívül erős, _+50%% sebzést okoz és bónuszvédőburkot kap,_ de minden körben veszít a védőburkából.\n\nAmikor az összes pajzsa 0-ra csökken, a vérengzés véget ér.\n\nA dühöngés után a vérengzőnek regenerálódnia kell, mielőtt újra egyre dühösebbé válna.\n\nMegmaradt védőburok: %d
actors.buffs.berserk.recovering_desc=A belülről fakadó erő nem korlátlan. A vérengzőnek pihennie kell, mielőtt újra erőt meríthetne a dühéből.\n\nPihenés közben a vérengző nem lesz dühösebb, ha megsérül.
actors.buffs.berserk.recovering_desc_turns=A kipihentségig hátralévő körök: _%d_
actors.buffs.berserk.recovering_desc_levels=A kipihentségig hátralévő szintek: _%.2f_
actors.buffs.berserk.rankings_desc=Vérengzés közben meghalt
actors.buffs.berserk.action_name=Vérengzik
actors.buffs.berserk.no_seal=A vérengzéshez szükséged van a törött pecsétedre!

actors.buffs.bleeding.name=vérzés
actors.buffs.bleeding.ondeath=Elvéreztél...
actors.buffs.bleeding.heromsg=Vérzel!
actors.buffs.bleeding.rankings_desc=Elvérzett
actors.buffs.bleeding.desc=Ebből a sebből aggasztóan sok vér folyik.\n\nA vérzés minden körben sérülést okoz. Minden körben véletlen mennyiséggel csökken a sérülés, amíg a vérzés egyszer csak el nem áll.\n\nA vérzés miatt most %d a sebzés mértéke.

actors.buffs.bless.name=áldott
actors.buffs.bless.desc=Erős koncentrálóképesség, mely némelyek szerint az istenektől származik.\n\nAz áldás 25%%-kal növeli a pontosságot és a kijátszást, így az áldott karakter sokkal hatékonyabb a harcban.\n\nAz áldás még %s körig tart.

actors.buffs.blindness.name=elvakított
actors.buffs.blindness.heromsg=Elvakítottak!
actors.buffs.blindness.desc=A vakság sötét homállyá változtatja körülötted a világot.\n\nAz elvakított karakter csak egy mező távolságra lát maga körül, emiatt nincs értelme távolsági fegyvereket használnia, és könnyen szem elől téveszti a távolabbi ellenségeket. Ezen felül az elvakított hős képtelen elolvasni a tekercseket és könyveket.\n\nA vakság még %s körig tart.

actors.buffs.buff.heromsg=

actors.buffs.burning.name=lángol
actors.buffs.burning.heromsg=Meggyulladtál!
actors.buffs.burning.burnsup=Meggyulladt egy %s!
actors.buffs.burning.ondeath=Halálra égtél...
actors.buffs.burning.rankings_desc=Hamuvá égett
actors.buffs.burning.desc=Kevés borzasztóbb dolog van annál, mint amikor az embert elborítják a lángok.\n\nA tűz minden körben sebez, amíg ki nem alszik, vagy vízzel el nem oltják. A tüzet elolthatod úgy is, hogy vízbe lépsz, vagy széttörsz egy varázsitalt úgy, hogy lefröcsköld magad vele.\n\nEzen kívül a tűz a közelében lévő éghető térelemeket és tárgyakat is meggyújthatja.\n\nAz égés még %s körig tart.

actors.buffs.championenemy.warn=Halálos lény jelenlétét érzed.
actors.buffs.championenemy$blazing.name=lángoló bajnok
actors.buffs.championenemy$blazing.desc=A lángoló bajnokok 25%-kal nagyobb sérülést okoznak. Lángra lobbantják az ellenfelüket, immunisak a tűzre, továbbá lángra lobbantják a környezetüket is amint elpusztulnak. A vízet azonban nem tudják lángra lobbantani.
actors.buffs.championenemy$projecting.name=kivetüléses bajnok
actors.buffs.championenemy$projecting.desc=A kivetüléses bajnokok 25%-kal nagyobb sérülést okoznak közelharcban, és +3 mezővel távolabbra elér a támadásuk.
actors.buffs.championenemy$antimagic.name=mágiaellenes bajnok
actors.buffs.championenemy$antimagic.desc=A mágiaellenes bajnokok 50%-kal kevesebbet sérülnek, és teljesen immunisak a varázslatokra.
actors.buffs.championenemy$giant.name=óriás bajnok
actors.buffs.championenemy$giant.desc=Az óriás bajnokok 80%-kal kevesebbet sérülnek és +1 támadási hatókörrel rendelkeznek, de nem férnek el kis helyeken.
actors.buffs.championenemy$blessed.name=áldott bajnok
actors.buffs.championenemy$blessed.desc=Az áldott bajnokoknak 4-szer nagyobb a pontosságuk és a kijátszásuk.
actors.buffs.championenemy$growing.name=erősödő bajnok
actors.buffs.championenemy$growing.desc=Az erősödő bajnokok pontossága, kijátszása és fizikai sebzése fokozatosan emelkedik, továbbá az elszenvedett sérülése fokozatosan csökken. \n\nJelenlegi pontosság-, kijátszás-, sebzésnövekedés: %1$d%%\nJelenlegi sérüléscsökkenés: %2$d%%

actors.buffs.charm.name=elbájolt
actors.buffs.charm.heromsg=Elbájoltak!
actors.buffs.charm.cant_attack=Ez az ellenség elbájolt téged, így nem tudod megtámadni.
actors.buffs.charm.desc=A báj manipulatív varázslat, amelytől az ellenfelek átmenetileg rajongani fognak egymásért.\n\nAz elbájolt karakterek nem tudnak közvetlen támadást indítani az őket elbájoló ellenség ellen. Más célpontokat viszont megtámadhatnak. A fájdalmi sokk csökkenti a báj időtartamát.\n\nA báj még %s körig tart.

actors.buffs.chill.name=dermedtség
actors.buffs.chill.freezes=Megfagyott egy %s!
actors.buffs.chill.desc=Még éppen nem fagyás, de azért így is súlyos kihűlés.\n\nA megdermedt célpontok mindent sokkal lassabban tesznek, attól függően, hogy még mennyi ideig tart a hatás. Mikor a legsúlyosabb a hatása, akkor ugyanolyan, mint a lassúságé.\n\nA dermedtség még %1$s körig tart.\nA sebesség %2$s%%-kal csökkent.

actors.buffs.combo.name=kombó
actors.buffs.combo.action_name=kombótámadás
actors.buffs.combo.combo=%d ütéses kombó!
actors.buffs.combo.bad_target=Támadótávolságon belül válassz célpontot!
actors.buffs.combo.prompt=Válassz célpontot!
actors.buffs.combo.desc=A gladiátor a sikeresen bevitt ütésektől egyre inkább lendületbe jön. Minden támadás növeli a kombószámlálót eggyel, de ha két támadás közt túl sok idő telik el, a kombószámláló visszaáll nullára. Amíg a gladiátornak van kombója, a törött pecsétjéből származó védőburok nem kezd elhalványulni.\n\nA kombópontok gyűjtése speciális kombótámadásokat tesz lehetővé, amelyek biztosan betalálnak! A különböző támadások a 2., 4., 6., 8., és a 10. kombópont után válnak elérhetővé. Egyes mozdulatok lenullázzák a kombópontokat, mások nem, de minden mozdulatot csak egyszer használhatsz egy kombómenet alatt.\n\nJelenlegi kombópontok: %1$d.\n\nKörök a kombópontok nullázásáig: %2$s.
actors.buffs.combo$combomove.clobber.name=maflás
actors.buffs.combo$combomove.clobber.desc=Az ellenséget 2 mezővel hátralöki, de nem okoz sérülést neki, és nem tudja verembe lökni. A kombószámlálót 1-el növeli.
actors.buffs.combo$combomove.clobber.empower_desc=Az ellenséget _3 mezővel hátralöki, szédülést okoz, és verembe tudja lökni,_ de nem okoz sérülést neki. A kombószámlálót 1-gyel növeli.
actors.buffs.combo$combomove.slam.name=lecsapás
actors.buffs.combo$combomove.slam.desc=A sérülésblokkoló erőd %d%%-ának (kombópontok*20%%) megfelelő bónuszsebzést okoz. Használat után lenulláza a kombópontokat.
actors.buffs.combo$combomove.slam.empower_desc=_Átugrik legfeljebb %1$d mezőt_, és a sérülésblokkoló erőd %2$d%%-ának (kombópontok*20%%) megfelelő bónuszsebzést okoz. Használat után lenulláza a kombópontokat.
actors.buffs.combo$combomove.parry.name=hárítás
actors.buffs.combo$combomove.parry.desc=A kombó végrehajtásától számított 1 körön belül blokkolja a következő támadást, és azonnal megtorolja azt. Lenulláza a kombópontokat, ha semmit sem kellett hárítani.
actors.buffs.combo$combomove.parry.empower_desc=A kombó végrehajtásától számított 1 körön belül blokkol _minden támadást_, és azonnal megtorolja azokat. Lenulláza a kombópontokat, ha semmit sem kellett hárítani.
actors.buffs.combo$combomove.crush.name=zúzás
actors.buffs.combo$combomove.crush.desc=%d%% (kombópontok*25%%) sérülést okoz az elsődleges célpontnak, és ennek felét az összes többi ellenségnek egy 7x7 mezőnyi területen. Használat után lenulláza a kombópontokat.
actors.buffs.combo$combomove.crush.empower_desc=_Átugrik legfeljebb %1$d mezőt_, és %2$d%% (kombópontok*25%%) sérülést okoz az elsődleges célpontnak, továbbá ennek felét a többi ellenségnek 7x7 mező nagyságú területen belül. Használat után lenulláza a kombópontokat.
actors.buffs.combo$combomove.fury.name=dühöngés
actors.buffs.combo$combomove.fury.desc=Annyiszor megüti az ellenséget, ahány kombópontot gyűjtöttél, és minden egyes találat 60%-os sebzést okoz, és kiválthatja a bűvöletek hatását. Használat után lenulláza a kombópontokat.
actors.buffs.combo$combomove.fury.empower_desc=_Átugrik legfeljebb %d mezőt_, és egy ellenséget annyiszor eltalál, ahány kombópontot összegyűjtöttél, minden egyes találat 60%% sebzést okoz, és kiválthatja a bűvöletek hatását. Használat után lenulláza a kombópontokat.

actors.buffs.corruption.name=züllött
actors.buffs.corruption.desc=A züllöttség beszivárog az ember lényegébe és kiforgatja a korábbi jelleméből.\n\nA züllött lények megtámadják a szövetségeseiket, és nem foglalkoznak a korábbi ellenségeikkel. A züllöttség pusztít is, a célpontját lassan felemészti.\n\nA züllöttség nem múlik el, hatásai csak a halállal érnek véget.

actors.buffs.cripple.name=lerokkant
actors.buffs.cripple.heromsg=Lerokkantál!
actors.buffs.cripple.desc=Majdnem biztos vagy benne, hogy a lábaknak így nem szabadna hajolniuk.\n\nA rokkant karakter sebessége megfeleződik, egy mező megtétele egy kör helyett kettőbe telik.\n\nA rokkantság még %s körig tart.

actors.buffs.daze.name=kábult
actors.buffs.daze.heromsg=Elkábultál!
actors.buffs.daze.desc=A fülcsengés és a homályos látás megnehezíti a küzdelmet.\n\nKábult állapotban a pontosság és a kijátszás 50%%-kal csökken, ami sokkal nehezebbé teszi az ütések célba juttatását és a kitérést.\n\nA kábulat még %s körig tart.

actors.buffs.degrade.name=lefokozott
actors.buffs.degrade.heromsg=A felszerelésedet gyengébbnek érzed!
actors.buffs.degrade.desc=Erős sötét mágia csapolja a felszereléseden használt fejlesztéstekercsek erejét!\n\nA lefokozás alatt a fejlettebb felszerelés úgy tekintendő, mintha a ténylegesnél alacsonyabb szintű volna. _Minden +3 utáni fejlesztés exponenciálisan gyengébb, mint az előző._ A tárgyaid leírásában a csökkentett szintű pontok szerepelnek ilyenkor.\n\nA lefokozás nem hat az erőnléti követelményekre, a varázspálcák töltésére, a dobófegyverek tartósságára vagy az ereklyékre.\n\nA hátrelévő körök száma: %s. Egy fejlesztéstekercset, vagy átoklevétel-tekercset felhasználva azonnal elmúlik a lefokozás.

actors.buffs.doom.name=kudarcra ítélt
actors.buffs.doom.desc=Nehéz folytatni, ha úgy tűnik, a világ holtan szeretne látni.\n\nA kudarcra ítélt karakterek +67% sérülést szenvednek minden forrásból.\n\nAz ítélet végleges, csak a halállal múlik el a hatása.

actors.buffs.dread.name=rettegés
actors.buffs.dread.desc=A rémület olyan nagy, hogy a célpont teljesen elmenekül a kazamatából!\n\nA rettegés hatása alá kerülő lények nagy sebességgel menekülnek az ellenfelük elől, és teljesen eltűnnek a kazamatából, amint látótávolságon kívülre kerülnek. Az így legyőzött ellenségek fele annyi tapasztalatot adnak, és nem hagynak hátra tárgyakat. A fájdalom sokkja csökkenti a rettegés időtartamát.\n\nMég %d körig tart a rettegés.

actors.buffs.drowsy.name=álmosság
actors.buffs.drowsy.desc=Egy mágikus erő miatt alig tudsz ébren maradni. Néhány kör után a célpont mély, bűvös álomba zuhan.\n\nA hős ellenállhat az álmosságnak, ha megsebesül vagy ha teljesen egészséges.\n\nKörök az elalvásig: %s.

actors.buffs.earthimbue.name=földerővel telve
actors.buffs.earthimbue.desc=A föld ereje jár át téged!\n\nMinden fizikai támadás kimozdítja a földet az ellenség alatt, kis időre lerokkantva őt.\n\nA földtől kapott erő még %s körig tart.

actors.buffs.enhancedrings.name=fokozott hatású gyűrűk
actors.buffs.enhancedrings.desc=A zsivány nemrégiben használt ereklyéje erősíti a gyűrűit, és +1-gyel megemeli a fejlettségi szintjüket.\n\nHátralévő körök: %s.

actors.buffs.fireimbue.name=tűzzel telve
actors.buffs.fireimbue.desc=Átjár a tűz ereje!\n\nAkármelyik fizikai támadásod lángba boríthatja az ellenséget. Ezen felül teljesen immunis vagy a tűz által okozott hatásokra.\n\nA tűztől kapott erő még %s körig tart.

actors.buffs.foresight.name=betekintés
actors.buffs.foresight.desc=Valahogyan képes vagy látni a környező terület elrendezését az elméddel.\n\nAmíg a betekintés hatása alatt állsz, széles sugarú körben minden mező feltárul előtted, beleértve a titkos csapdákat és ajtókat is.\n\nMég %s körig tart a betekintés.

actors.buffs.frost.name=megfagyva
actors.buffs.frost.freezes=Megfagyott egy %s!
actors.buffs.frost.desc=Nem válik szilárd halmazállapotúvá a célpont, ez a fajta fagyás csak kímletesen jégpáncélba zárja őt.\n\nA fagyottság hasonlít a bénultsághoz abban, hogy a célpont nem tud tenni semmit. A különbség az, hogy a fagyottság azonnal véget ér, ha a célpont sérülést szenved, mivel a jég széttörik rajta.\n\nA fagyottság még %s körig tart.

actors.buffs.frostimbue.name=faggyal telve
actors.buffs.frostimbue.desc=Jeges erő jár át!\n\nMinden fizikai támadás fokozatosan megdermeszti az ellenségeket. Ezen kívül teljesen immunissá válsz a hidegre.\n\nMég %s körig maradsz faggyal telve.

actors.buffs.fury.name=őrjöngő
actors.buffs.fury.heromsg=Őrjöngésbe kezdtél!
actors.buffs.fury.desc=Mérges vagy, és az ellenségeknek nincs abban köszönet, ha te mérges vagy.\n\nÓriási düh tombol benned, és ez a fizikai támadásaid sebzését 50%%-kal megnöveli.\n\nEz a düh mindaddig tart, amíg az életerőd 50%% alatt van.

actors.buffs.blobimmunity.name=tisztítóréteg
actors.buffs.blobimmunity.desc=Valami különös erő vékony védőrétegbe burkol, amely megvéd minden káros légi hatástól.\n\nImmunis vagy minden, adott területen érvényesülő hatással szemben, amíg ez a védőréteg tart.\n\nMég %s körig maradsz immunis.

actors.buffs.gravitychaostracker.name=gravitációs káosz
actors.buffs.gravitychaostracker.desc_intro=Néhány fordulónként az összes karaktert a kazamata jelenlegi szintjén egy véletlenszerű irányba dobják.
actors.buffs.gravitychaostracker.desc_positive=Te és a szövetségeseid azonban úgy tűnik, immunisak vagytok.
actors.buffs.gravitychaostracker.desc_duration=Nem világos, hogy a hatás meddig tart, de nem tarthat örökké.

actors.buffs.greaterhaste.name=fokozott sietség
actors.buffs.greaterhaste.desc=Hihetetlen sebességnövekedés, amely először olyan érzést kelt, mintha minden más mozdulatlanul állna.\n\nA fokozott sietség hatása alatt a mozgás egyáltalán nem vesz igénybe időt, viszont más cselekvések ugyanúgy a megszokott sebességgel hajthatók végre. Minden mozgási lépés egy környi fokozott sietséget használ fel.\n\nMég %d környi fokozott sietség maradt.

actors.buffs.haste.name=sietség
actors.buffs.haste.desc=Energia áramlik az izmaidba, ami lehetővé teszi, hogy hihetetlen sebességgel fuss!\n\nA sietség hatása alatt 3x sebességgel futsz, de minden mást ugyanolyan gyorsan csinálsz, mint máskor.\n\nMég %s körig tart a sietség.

actors.buffs.healing.name=gyógyulás
actors.buffs.healing.desc=Egy mágikus orvosság hatására a sebek beforrnak, a hús összegyúgyul.\n\nAmeddig a gyógyító hatás tart, minden körben fokozatosan visszanyered az életerőd. A gyógyulás mértéke idővel csökken. \n\nGyógyulás a következő körben: %d.\n\nMég %d körig gyógyulsz.

actors.buffs.herodisguise.name=álcázva
actors.buffs.herodisguise.desc=Kápráztató mágia változtatta el a tested alakját! A hatás teljes egészében kozmetikai, de akkor is nagyon furcsa érzés.\n\nAz álca még %s körig tart.

actors.buffs.hex.name=megboszorkányozott
actors.buffs.hex.heromsg=Megboszorkányoztak!
actors.buffs.hex.desc=Sötét mágia, mely zavarja a koncentrálást, és megkeveri a célpontot.\n\nA megboszorkányozás csökkenti a pontosságot és a kijátszást 20%%-kal. A célpont kevésbé lesz eredményes a harcban.\n\nA megboszorkányozás még %s körig tart.

actors.buffs.holdfast.name=megerősített védelem
actors.buffs.holdfast.desc=A harcos tartja a pozícióját, %1$d-%2$d egységgel növeli a páncélzatát és %3$d%% egységgel lassítja néhány pozitív hatás megszűnési sebességét . Ez addig tart, amíg meg nem mozdul.

actors.buffs.hunger.hungry=éhség
actors.buffs.hunger.starving=éhezés
actors.buffs.hunger.onhungry=Megéheztél.
actors.buffs.hunger.onstarving=Éhezel!
actors.buffs.hunger.ondeath=Éhen haltál...
actors.buffs.hunger.cursedhorn=A megátkozott bőségszaru ellopja az elfogyasztott étel energiájának egy részét.
actors.buffs.hunger.rankings_desc=Éhen halt
actors.buffs.hunger.desc_intro_hungry=Érzed, hogy üres a hasad, de még kibírható.
actors.buffs.hunger.desc_intro_starving=Kínzó éhség gyötör.
actors.buffs.hunger.desc=\n\nAhogy telik az idő a kazamatákban, lassan egyre éhesebb leszel, végül éhezni kezdesz. Ha éhezel, gyógyulás helyett az életerőd lassan fogyni kezd.\n\nFontos a tartalékolás! Ha van elég életerőd, nem rossz ötlet éhezni, mert ezzel későbbre tudsz ételt félretenni. Ha ügyesen beosztod, sokkal tovább kitart az élelmed!

actors.buffs.invisibility.name=láthatatlan
actors.buffs.invisibility.desc=Teljesen beleolvadsz a környezetedbe, képtelenség meglátni téged.\n\nAmíg láthatatlan vagy, az ellenségek nem tudnak megtámadni vagy követni. Amikor fizikai támadást indítasz vagy mágikus hatásokat idézel elő (például tekerccsel vagy varázspálcával), azonnal megtörik a láthatatlanság.\n\nA láthatatlanság még %s körig tart.

actors.buffs.invulnerability.name=sebezhetetlen
actors.buffs.invulnerability.desc=Ezt a karaktert hatalmas védelmező erő veszi körbe, amely rövid ideig sebezhetetlenséget biztosít számára!\n\nHátralévő körök: %s.

actors.buffs.levitation.name=lebegés
actors.buffs.levitation.desc=Mágikus erő emel a föld fölé, súlytalannak érzed magad.\n\nA lebegő karakterek hangtalanul mozognak és elkerüli őket minden, talajon érvényesülő hatás. A csapdák nem lépnek működésbe, a víz nem olt el, ha égsz, a növényeket nem taposod le, a gyökerek nem kapnak el, és átszállsz a szakadékok fölött. Vigyázz azonban, mert minden hatás, ami alól mentesültél, azonnal újra érvényesül rád, amint a lebegés véget ér!\n\nA lebegés még %s körig tart.

actors.buffs.lifelink.name=életerőkapocs
actors.buffs.lifelink.ondeath=Az életerőkapocs-sérülés megölt téged…
actors.buffs.lifelink.desc=Ennek a karakternek az életereje egy közelben lévő másik karakterrel van összekapcsolva. Az okozott sérülések megoszlanak kettejük között.\n\nAmikor ezt a karaktert sérülés éri, a felét az életerőkapocs célpontja szenvedi el.\n\nAz életerőkapocs még %s körig él.

actors.buffs.light.name=megvilágított
actors.buffs.light.desc=Még a legsötétebb kazamatában is jó, ha van az embernél egy megbízható fényforrás.\n\nA fény segít távol tartani a sötétséget, így még rossz látási körülmények között is elég messzire ellátsz.\n\nA megvilágítás még %s körig tart.

actors.buffs.lockedfloor.name=az emelet le van zárva
actors.buffs.lockedfloor.desc=Ez az emelet le van zárva, és nem tudsz elmenni innen!\n\nA lezárt emeleteken nem nő az éhséged, és nem sérülsz az éhezéstől. Viszont, ha nem igyekszel legyőzni az emelet főellenségét, az életerőd sem fog gyógyulni magától.\n\nRáadásul, ha egy meg nem áldott ankh újraélesztene, mikor az emelet le van zárva, akkor az emelet visszaállna az eredeti állapotába.\n\nÖld meg az emelet főellenségét, hogy feloldd a zárat!

actors.buffs.lostinventory.name=elveszett hátizsák
actors.buffs.lostinventory.desc=A hátizsákod elveszett valahol a kazamatában! Nem tudod majd a legtöbb tárgyat felvenni, vagy használni, amíg vissza nem szerzed.

actors.buffs.magicalsight.name=mágikus látás
actors.buffs.magicalsight.desc=Valahogyan képes vagy a szemed helyett az elméddel látni.\n\nAmíg a mágikus látás tart, képes leszel átlátni minden térelemen 12 mező sugarú körben.\n\nA mágikus látás még %s körig tart.

actors.buffs.magicalsleep.name=mágikus álom
actors.buffs.magicalsleep.toohealthy=Teljesen egészséges vagy, és ellenállsz az álmosító kényszernek.
actors.buffs.magicalsleep.fallasleep=Mély, mágikus álomba merülsz.
actors.buffs.magicalsleep.wakeup=Kipihenten és egészségesen ébredsz.
actors.buffs.magicalsleep.desc=Ez a karakter mély mágikus álomba merült, amelyből természetes módon nem fog felébredni.\n\nA mágikus alvás hasonló a közönséges alváshoz, azzal a különbséggel, hogy csak sérülés hatására ébred fel a célpont.\n\nA hősre és szövetségeseire a mágikus alvás üdítő hatással is van, lehetővé téve számukra, hogy pihenés közben gyorsan gyógyuljanak.

actors.buffs.magicimmune.name=immunitás a mágiára
actors.buffs.magicimmune.desc=Semmilyen mágikus hatás nem fog rajtad, teljesen ellenálló vagy a mágiával szemben.\n\nAmíg immunis vagy a mágiára, addig semmilyen mágikus hatás nem érhet, legyen az káros vagy hasznos, beleértve az átkok, bűvöletek, varázspálcák, tekercsek, gyűrűk, ereklyék stb. hatását. A hősi páncél képességei elég erősek ahhoz, hogy ettől a hatástól függetlenül is működjenek.\n\nA mágiaimmunitás még %s körig tart.

actors.buffs.mindvision.name=belső látás
actors.buffs.mindvision.desc=Valahogyan az elméddel képes vagy látni az emeleten lévő élőlényeket. Furcsa érzés.\n\nAmíg a belső látás tart, minden karaktert látsz ezen az emeleten. A legtöbb mágikus hatás számára a lények belső szemeddel való látása ugyanolyannak számít, mintha azokat közvetlenül látnád, és a közeledben lennének.\n\nA belső látás még %s körig tart.

actors.buffs.momentum.momentum=belendül
actors.buffs.momentum.running=szerfutás
actors.buffs.momentum.resting=gyógyul
actors.buffs.momentum.action_name=szerfutás
actors.buffs.momentum.momentum_desc=A szerfutó mozgása közben egyre több lendületre tesz szert, amivel szerfutásba kezdhet.\n\nMinden egyes lendülettöltés két kör szerfutást tesz lehetővé. A szerfutó 10 töltést tud felhalmozni. A lendület rögtön elveszik, amint a szerfutó megáll.\n\nA lendület jelenlegi töltöttségi szintje: %d.
actors.buffs.momentum.running_desc=A szerfutó mozgása közben egyre több lendületre tesz szert, amivel szerfutásba kezdhet.\n\nA szerfutás során kétszer olyan gyorsan mozog és a szintjétől függően megnövekedik a kijátszása.\n\nHátralévő körök: %d.
actors.buffs.momentum.resting_desc=A szerfutó mozgása közben egyre több lendületre tesz szert, amivel szerfutásba kezdhet.\n\nA szerfutónak időre van szüksége, hogy az erőnlétét visszanyerje, mielőtt ismét lendületbe jönne.\n\nHátralévő körök: %d.

actors.buffs.monkenergy.name=energia
actors.buffs.monkenergy.action=Szerzetes képességei
actors.buffs.monkenergy.desc=A szerzetes az ellenségek legyőzésével energiát nyer, amelyet különböző képességekre használhat fel. A szerzetes a legtöbb ellenség legyőzésével 1 energiát kap, és nem veszíti el az energiát, ahogy telik az idő.\n\nJelenlegi energia: %1$d/%2$d.
actors.buffs.monkenergy.desc_cooldown=A szerzetes nemrég használt egy képességet, és várnia kell, mielőtt egy másikat használna.\n\nMég %d kört kell várni.
actors.buffs.monkenergy$monkability$flurry.name=pofoneső
actors.buffs.monkenergy$monkability$flurry.desc=Két azonnali csapás, amelyek %1$d-%2$d sebzést okoznak, amit a páncélzat nem csökkent. Ez a képesség nem használható rögtön újra.
actors.buffs.monkenergy$monkability$flurry.empower_desc=Két azonnali csapás, amelyek %1$d-%2$d sebzést okoznak, amit a páncélzat nem csökkent, _és kiváltják a fegyvered bűvöletének hatását._ Ezt a képességet nem lehet azonnal újra használni.
actors.buffs.monkenergy$monkability$focus.name=összpontosítás
actors.buffs.monkenergy$monkability$focus.desc=A szerzetes egy körön keresztül összpontosít, ami által el tudja hárítani a következő ellene irányuló támadást.
actors.buffs.monkenergy$monkability$focus.empower_desc=A szerzetes _azonnal összpontosít,_ ami által el tudja hárítani a következő ellene irányuló támadást.
actors.buffs.monkenergy$monkability$focus$focusbuff.name=összpontosított
actors.buffs.monkenergy$monkability$focus$focusbuff.desc=A szerzetes a környezetére összpontosít, és előre látja a következő ellene irányuló támadást. Amíg koncentrál, garantáltan hárítja a következő ellene irányuló támadást.
actors.buffs.monkenergy$monkability$dash.name=vetődés
actors.buffs.monkenergy$monkability$dash.prompt=Helyszín kiválasztása
actors.buffs.monkenergy$monkability$dash.desc=Azonnali vetődés legfeljebb 4 mező távolságra. Ezzel a képességgel át tudsz jutni a veszélyforrások fölött, de ellenségeken vagy szilárd térelemeken nem.
actors.buffs.monkenergy$monkability$dash.empower_desc=Azonnali vetődés legfeljebb _8 mező_ távolságra. Ezzel a képességgel át tudsz jutni a veszélyforrások fölött, de ellenségeken vagy szilárd térelemeken nem.
actors.buffs.monkenergy$monkability$dragonkick.name=sárkányrúgás
actors.buffs.monkenergy$monkability$dragonkick.desc=Egy pusztító rúgás, amely %1$d-%2$d sebzést okoz, amit a páncélzat nem csökkent. A rúgás hátralöki a célpontot, és annyi körre lebénítja, ahány mezőt hátrarepült.
actors.buffs.monkenergy$monkability$dragonkick.empower_desc=Egy pusztító rúgás, amely %1$d-%2$d sebzést okoz, amit a páncélzat nem csökkent. A rúgás hátralök _minden szomszédos célpontot_, és annyi körre lebénítja őket, ahány mezőt hátrarepültek.
actors.buffs.monkenergy$monkability$meditate.name=meditáció
actors.buffs.monkenergy$monkability$meditate.desc=A szerzetes 5 körig energiát összpontosít a testébe. Ez eltünteti a legtöbb negatív hatást, és 8 körig tartó pálca- és ereklyetöltést biztosít neki.
actors.buffs.monkenergy$monkability$meditate.empower_desc=A szerzetes 5 körig energiát összpontosít a testébe. Ez eltünteti a legtöbb negatív hatást, és 8 körig tartó pálca- és ereklyetöltést biztosít neki. _Meditálás közben 80% sérülésellenállást is szerez, és a hiányzó életerejének 20%-ának megfelelő lassú gyógyulásban részesül._

actors.buffs.ooze.name=maró váladék
actors.buffs.ooze.heromsg=A maró váladék a húsodat emészti. Mosd le!
actors.buffs.ooze.ondeath=Szétmart a sav...
actors.buffs.ooze.rankings_desc=Ártalmatlanítva
actors.buffs.ooze.desc=Ez a ragadós sav hozzátapad a húshoz, lassan szétmarva azt.\n\nA váladék folyamatos és egyenletes sérülést okoz, de vízzel azonnal lemosható.\n\nMég %s körig mar a váladék.

actors.buffs.paralysis.name=bénult
actors.buffs.paralysis.heromsg=Lebénultál!
actors.buffs.paralysis.out=bénulás leküzdve
actors.buffs.paralysis.desc=Gyakran az a legrosszabb, amikor semmit sem tudunk tenni.\n\nA bénulás minden mozdulatot gátol, az áldozat kénytelen kivárni, amíg el nem múlik. Ha a karakter ilyenkor sérülést szenved, a fájdalom segíthet neki leküzdeni a bénultságot, és kikerülhet a hatása alól.\n\nA bénultság még %s körön át tart.

actors.buffs.physicalempower.name=felerősített fizikum
actors.buffs.physicalempower.desc=Az ütéseid erősebbek lettek, és a fizikai támadásokkal nagyobb sebzést tudsz okozni az ellenségeknek.\n\nBónuszsebzés: %1$d.\nHátralévő ütések: %2$d.

actors.buffs.pincushion.name=tűpárna
actors.buffs.pincushion.desc=A dobófegyverek, amelyeket erre a karakterre dobtál, pillanatnyilag csak beléfúródnak, és csak azután esnek a padlóra, miután legyőzted.\n\nJelenleg ezek a tárgyak fúródtak bele:

actors.buffs.poison.name=mérgezett
actors.buffs.poison.heromsg=Megmérgeztek!
actors.buffs.poison.ondeath=Méreg végzett veled...
actors.buffs.poison.rankings_desc=Belehalt a mérgezésbe
actors.buffs.poison.desc=A méreg szétáramlik a testben, lassan károsítva a belső működését.\n\nA méreg a még hátralévő idővel arányosan, körönként sebez.\n\nA méreg még %s körig hat.

actors.buffs.preparation.name=felkészülés
actors.buffs.preparation.action_name=rajtaütés
actors.buffs.preparation.desc=Az orgyilkos türelmesen vár, az árnyékból készül lecsapni.
actors.buffs.preparation.desc_dmg=A következő támadása _%1$d%% bónuszsebzést fog okozni_, és kivégez minden _%2$d%% egészségszint_ alatti közönséges ellenséget, vagy _%3$d%% egészségszint_ alatti főellenséget.
actors.buffs.preparation.desc_dmg_likely=Nagyobb a valószínűsége, hogy a támadás nagyobb sebzést is fog okozni.
actors.buffs.preparation.desc_blink=Ütés előtt képes legfeljebb _%d_ mező távolságból az ellenfél felé cikázni.
actors.buffs.preparation.desc_invis_time=A láthatatlanságban eltöltött körök: _%d._
actors.buffs.preparation.desc_invis_next=Az erősebb támadáshoz szükséges körök: _%d._
actors.buffs.preparation.prompt=Válassz célpontot a támadáshoz!\nAz átcikázás maximális hossza: %d
actors.buffs.preparation.no_target=Nincs mit megtámadni ott.
actors.buffs.preparation.out_of_reach=A célpont nem érhető el.
actors.buffs.preparation.assassinated=megmerényelt

actors.buffs.prismaticguard.name=prizmaképőr
actors.buffs.prismaticguard.desc=Egy prizmakép védelmez téged, mely jelenleg tétlen. Ha ellenségek jelennek meg, a prizmakép akcióba lendül és megvéd téged!\n\nAmíg tétlen, a prizmakép fokozatosan gyógyul az elszenvedett sérüléseiből.\n\nJelenlegi életerő: %d/%d.
actors.buffs.prismaticguard.desc_many=Ez a prizmakép is részesül a közösség erejének előnyeiből. Hátralévő körök: %d.

actors.buffs.recharging.name=feltöltődik
actors.buffs.recharging.desc=Energia áramlik át rajtad, amitől a varázspálcáid és varázsbotjaid gyorsabban töltődnek fel.\n\nEz a pozitív hatás a normál újratöltődésen felül minden körben negyednyivel növeli az éppen meglévő töltésszintet.\n\nA feltöltődés még %s körig tart.

actors.buffs.revealedarea.name=feltárt terület
actors.buffs.revealedarea.desc=Átmenetileg feltárult a hősödnek a kazamata egy területe. Látni fogja, nem számít, épp hol tartózkodik.\n\nHátralévő körök: %s.

actors.buffs.revealedchar.name=feltárult
actors.buffs.revealedchar.desc=A hősöd érzékeli ezt a karaktert, aki látható lesz, bárhol is van.\n\nHátralévő körök: %s.

actors.buffs.roots.name=meggyökerezett
actors.buffs.roots.heromsg=Nem tudsz mozogni!
actors.buffs.roots.desc=A gyökerek (mágikus vagy természetes) megragadják a lábakat, és a földhöz szorítják őket.\n\nA gyökerek helyhez kötik a célpontot, lehetetlenné téve a mozgást és a legtöbb mozgási képességet. Más tevékenységet nem befolyásol, még a teleportációs képességeket sem.\n\nA gyökerek még %s körön át szorítanak.

actors.buffs.scrollempower.name=a tekercs ereje
actors.buffs.scrollempower.desc=A mágus nemrég olvasott tekercsének energiája erőt ad a pálcáinak! \n\nSzintnövelés: +%1$d.\nMég %2$d pálcalövés van hátra.

actors.buffs.shadows.name=beárnyékolt
actors.buffs.shadows.desc=Beolvadsz a körülötted lévő árnyak közé, ami láthatatlanságot ad és lelassítja az anyagcserédet.\n\nAmíg láthatatlan vagy, az ellenségek nem tudnak megtámadni vagy követni. A legtöbb fizikai támadás és varázslat (tekercsek és varázspálcák) azonnal véget vetnek a láthatatlanságnak. Beárnyékolt állapotban lassabban is éhezel meg.\n\nA beárnyékoltság addig tart, amíg el nem hagyod az árnyakat, vagy egy ellenség hozzád nem ér.

actors.buffs.slow.name=lelassított
actors.buffs.slow.desc=A lelassítás mágiája megváltoztatja a célpont idejének folyását, amitől mindent nagyon gyorsnak érez.\n\nA lelassított karakter mindent kétszer annyi idő alatt tesz meg, mint egyébként.\n\nA lelassítás még %s körig tart.

actors.buffs.snipersmark.name=orvlövész jele
actors.buffs.snipersmark.action_name_snapshot=kapáslövés
actors.buffs.snipersmark.action_name_volley=sorozatlövés
actors.buffs.snipersmark.action_name_sniper=orvlövés
actors.buffs.snipersmark.desc=Az orvlövész az utoljára megtámadott célpontra összpontosít. Képes különleges támadást intézni az íjával, amelynek típusa az íj bővítésétől függ.\n\nEgy bővítés nélküli íjjal _kapáslövést_ lehet leadni, mely kevesebb sebzést okoz, viszont időveszteség nélkül ellőhető.\n\nEgy sebesség felé bővített íjjal háromnyilas _sortűz_ adható le. Minden nyíl kevesebbet sebez ugyan, de mindegyik aktiválhat bűvöletet. A sortűz egy kört vesz igénybe.\n\nEgy sebzés felé bővített íjjal _orvlövést_ lehet leadni. Ez a lövés garantáltan célba talál, a céltól való távolság alapján megnöveli az okozott sebzést, és két kört vesz igénybe.\n\nHátralévő körök: %s.

actors.buffs.soulmark.name=megbélyegzett lelkű
actors.buffs.soulmark.desc=A boszorkánymester beférkőzött ennek a lénynek a lelkébe, amitől a boszorkánymester gyógyul, ha a lény fizikai sérülést szenved el.\n\nA lélek megbélyegzése még %s körig tart.

actors.buffs.stamina.name=állóképesség
actors.buffs.stamina.desc=Kimeríthetetlen állóképességed van, ami gyorsabb mozgást tesz lehetővé!\n\nAz állóképesség hatása alatt +50%% sebességgel fogsz futni, de minden más a megszokott sebességen zajlik.\n\nAz állóképesség még %s körig tart.

actors.buffs.vulnerable.name=sérülékeny
actors.buffs.vulnerable.heromsg=Törékenynek érzed magad!
actors.buffs.vulnerable.desc=Miután a sérülést enyhítette a páncél, a sérülékenységet okozó mágia 33%%-kal megnövel minden fizikai sérülést, amit a karakter elszenved.\n\nMég %s kör sérülékenység van hátra.

actors.buffs.terror.name=rémült
actors.buffs.terror.desc=A rémület egy manipulációs mágia, amely kontrollálhatatlan pánikba taszítja a célpontját.\n\nA mágia arra készteti a rémült karaktereket, hogy rohanjanak az ellenfelük elől, hogy lehetőleg minél több ajtó és fal válassza el őket tőle. Ugyanakkor a fájdalom sokkja csökkenti a rémület időtartamát.\n\nA rémület még %s körön át tart.

actors.buffs.toxicimbue.name=mérget árasztó erővel telve
actors.buffs.toxicimbue.desc=Mérgező energiával vagy telve!\n\nAhogy mozogsz, folyamatosan mérgező gázok áramlanak ki belőled, amelyek sérülést okoznak az ellenségeidnek. Ellenállsz a mérges gáznak és a méregnek, amíg tart a hatás, valamint még néhány körrel utána is.\n\nA mérget árasztó erő még %s körig tart.

actors.buffs.corrosion.name=maró égés
actors.buffs.corrosion.heromsg=Valami marja a húsod!
actors.buffs.corrosion.ondeath=Szétmart a sav...
actors.buffs.corrosion.rankings_desc=Ártalmatlanítva
actors.buffs.corrosion.desc=Az erős sav riasztó ütemben marja szét a húst, fémet és csontot.\n\nA marás okozta sérülés egyre erősebb lesz, ahogyan a célpont folyamatosan roncsolódik.\n\nMég %1$s körig tart a maró égés.\nJelenleg %2$d sérülést okoz a marás.

actors.buffs.vertigo.name=szédülés
actors.buffs.vertigo.desc=Nem könnyű egyenesen menni, amikor az egész világ forog veled.\n\nA szédülés hatása alatt a karakter, aki mozogni próbál, a tervezetthez képest kiszámíthatatlan irányba megy.\n\nA szédülés még %s körig tart.

actors.buffs.wandempower.name=pálcák felerősítve
actors.buffs.wandempower.desc=A sérülést okozó pálcáid felerősödtek, megnövelve az okozott sebzés erejét pár találatig.\n\nBónuszsebzés: %1$d.\nMég %2$d találat van hátra.

actors.buffs.weakness.name=legyengítve
actors.buffs.weakness.heromsg=Gyengébbnek érzed magad!
actors.buffs.weakness.desc=Hirtelen minden sokkal nehezebbnek tűnik.\n\nGyengítő varázslat csökkenti a karakter testi erejét, ami azt eredményezi, hogy 33%%-kal kevesebb sebzést tud okozni.\n\nA gyengeség még %s körig tart.

actors.buffs.wellfed.name=jóllakott
actors.buffs.wellfed.desc=Egészen kielégültnek és jóllakottnak érzed magad.\n\nAmikor jól vagy lakva, nem nő az étvágyad, és nagyobb ütemben fogsz gyógyulni.\n\nHátralévő körök: %d.



###hero

##abilities
actors.hero.abilities.armorability.self_target=Magadat nem célozhatod!
actors.hero.abilities.armorability.no_target=Nincs mire célozni ott!
actors.hero.abilities.armorability.prompt=Célozz valahová
actors.hero.abilities.armorability.cost=Töltési költség: _%d_

actors.hero.abilities.warrior.heroicleap.name=hősi ugrás
actors.hero.abilities.warrior.heroicleap.prompt=Válaszd meg az ugrás irányát
actors.hero.abilities.warrior.heroicleap.short_desc=A harcos _hősi ugrást_ hajt végre egy célterület irányába, és közben átsuhan az ellenségek és a veszélyforrások fölött.
actors.hero.abilities.warrior.heroicleap.desc=A harcos a célterület felé ugrik, és közben átjut az útjába kerülő ellenségek és veszélyforrások fölött. Falakat vagy más szilárd térelemeket azonban nem tud átugrani.
actors.hero.abilities.warrior.shockwave.name=lökéshullám
actors.hero.abilities.warrior.shockwave.short_desc=A harcos a földre csap, aminek hatására _lökéshullám_ keletkezik egy kúp alakú területen. Az ellenfelek akiket eltalált a hullám, sérülnek és lerokkannak.
actors.hero.abilities.warrior.shockwave.desc=A harcos a földre csap, amitől 60 fok kiterjedésű kúpon belül 5 mező távolságig terjedő lökéshullám keletkezik.\n\nAz ellenfelek, akiket elér a hullám, 5 körig lerokkannak, továbbá 1-2 bónuszsérülést szenvednek a harcos minden 10-en felüli erőpontjáért.
actors.hero.abilities.warrior.endure.name=tűr
actors.hero.abilities.warrior.endure$enduretracker.name=tűrőképesség
actors.hero.abilities.warrior.endure$enduretracker.desc=A harcos mostantól bónuszsebzést ejt a tűrés közben elszenvedett sérülése alapján.\n\nBónuszsebzés: %1$d\nMég %2$d találat maradt.
actors.hero.abilities.warrior.endure.short_desc=A harcos _tűr_, több kört kihagy, de nagyon ellenállóvá válik a sérülésekkel szemben. Ez után bónuszsebzést okoz az eltűrt sérülés alapján.
actors.hero.abilities.warrior.endure.desc=A harcos 3 körön keresztül tűr, és minden forrásból fele annyi sérülést szenved el. Ez a sérüléscsökkentés még a páncélzathoz hasonló sérülésellenállást biztosító hatások előtt érvényesül.\n\nA tűrés utáni 10 körön belül a harcos következő találata bónuszsebzést kap. Ez a bónuszsebzés egyenlő a tűrés alatt rá iranyuló sérülés felével, mielőtt azt bármilyen sérüléscsökkentő hatás mérsékelte volna!\n\nHa a harcosnak van kombópontja, e képesség használata 3 körrel növeli annak hátralévő felhasználhatósági idejét.

actors.hero.abilities.mage.elementalblast.name=elemi robbanás
actors.hero.abilities.mage.elementalblast.no_staff=Nem használhatod ezt a képességed a varázsbotod nélkül.
actors.hero.abilities.mage.elementalblast.short_desc=A mágus körül nagy területet beborító _elemi robbanás_ tör elő a botjából, aminek hatása a botjába oltott pálcától függ.
actors.hero.abilities.mage.elementalblast.desc=A mágus egy mágikus robbanást idéz elő, amely legfeljebb 4 mező sugarú körön belül fejti ki hatását, és legfeljebb 15-25 sebzést okoz. Az elemi robbanás éppen érvényes hatása a mágus botjába oltott pálcától függően változik.
actors.hero.abilities.mage.elementalblast.generic_desc=Az elemi robbanás hatása hasonló lesz, mint a pálca hatása, amikor egy ellenségre vagy egy szövetségesre lőnek vele.
actors.hero.abilities.mage.wildmagic.name=vad mágia
actors.hero.abilities.mage.wildmagic.no_wands=Nincs varázspálcád, amivel lőhetnél!
actors.hero.abilities.mage.wildmagic.short_desc=A mágus szabadjára engedi a pálcáiban lévő _vad mágiát_, és egy kör alatt véletlenszerűen többször is lő velük egy kiválasztott célpontra.
actors.hero.abilities.mage.wildmagic.desc=A mágus szabadjára engedi a pálcáiban rejlő erőt, és egy körön belül akár négyszer is véletlenszerűen elsüti őket. A mágus botjára nem vonatkozik ez a hatás.\n\nEzen kívül minden pálcának a szintje megemelkedik 2-vel, de csak +3-ig. Ez a képesség csak fél töltést használ fel minden egyes pálcalövéshez, és egy pálcát nem lehet 2-nél többször elsütni.
actors.hero.abilities.mage.warpbeacon.name=térváltó jelzőfény
actors.hero.abilities.mage.warpbeacon.depths=Emeletek között nem tudsz teret váltani!
actors.hero.abilities.mage.warpbeacon.locked_floor=Lezárt emeletet nem hagyhatsz el!
actors.hero.abilities.mage.warpbeacon.too_far=Ez a hely túl messze van!
actors.hero.abilities.mage.warpbeacon.invalid_beacon=Nem tudsz jelzőfényt helyezni ide!
actors.hero.abilities.mage.warpbeacon.window_desc=A jelzőfényed jelenleg a kazamata %d. emeletén van.
actors.hero.abilities.mage.warpbeacon.window_tele=teleportálás a jelzőfényhez
actors.hero.abilities.mage.warpbeacon.window_clear=jelzőfény törlése
actors.hero.abilities.mage.warpbeacon.window_cancel=mégse
actors.hero.abilities.mage.warpbeacon.short_desc=A mágus egy _térváltó jelzőfényt_ helyez el a jelenlegi helyére, ahová egy szempillantás alatt vissza tud teleportálni.
actors.hero.abilities.mage.warpbeacon.desc=A mágus elhelyez egy jelzőfényt, amelyhez tetszés szerint visszatérhet. A jelzőfény elhelyezése 1 kört vesz igénybe, de a visszatérés azonnal megtörténik.\n\nA mágus eredendően nem tud másik emeletre ugrani, sem elérhetetlen helyekre, például zárt kamrákba jutni a jelzőfény segítségével. A mágus teleportálhat olyan mezőre, amelyen ellenség áll, akit ez félrelök.

actors.hero.abilities.rogue.smokebomb.name=füstbomba
actors.hero.abilities.rogue.smokebomb.fov=Csak üres helyre ugorhatsz, látótávolságon belül.
actors.hero.abilities.rogue.smokebomb.prompt=Válaszd ki, hova ugrasz
actors.hero.abilities.rogue.smokebomb$ninjalog.name=fa hasonmás
actors.hero.abilities.rogue.smokebomb$ninjalog.desc=Valamiért az ellenséget könnyedén becsapja ez a fából készült hasonmás, amiről azt gondolják, hogy az igazi zsivány!
actors.hero.abilities.rogue.smokebomb$ninjalog.discover_hint=Ezt a karaktert egy bizonyos hős páncéljának képességének segítségével találhatod meg.
actors.hero.abilities.rogue.smokebomb.short_desc=A zsivány _füstbombát_ dob, és közben elcikázik. A korábbi helyéhez közeli ellenfeleket elvakítja.
actors.hero.abilities.rogue.smokebomb.desc=A zsivány ledob egy füstbombát, és legfeljebb 6 mezőnyi távolságra elcikázik. Keresztül tud cikázni a veszélyforrásokon és az ellenségeken, de szilárd térelemeken, például falakon, nem.\n\nAzok az ellenségek, amelyek a zsivány régi helyével szomszédos mezőn vannak, 5 körre megvakulnak.
actors.hero.abilities.rogue.deathmark.name=halálbélyeg
actors.hero.abilities.rogue.deathmark.ally_target=Csak ellenségeket bélyegezhetsz meg
actors.hero.abilities.rogue.deathmark.short_desc=A zsivány _halálbélyeget_ helyez egy kiválasztott ellenségre. A megbélyegzett ellenség megnövekedett sérülést szenved el, de nem halhat meg, amíg a bélyeg el nem tűnik.
actors.hero.abilities.rogue.deathmark.desc=A zsivány megbélyegez egy kiválasztott ellenséget, ami miatt az 25%-kal több sérülést szenved. A bélyeg azonnal kifejti hatását, és 5 körig tart.\n\nA megbélyegzett ellenségek bónuszsérülést szenvednek, de nem tudnak meghalni, amíg a bélyeg meg nem szűnik. Ha egy ellenségnek 0 életereje van, amikor a bélyeg eltűnik, azonnal meghal.
actors.hero.abilities.rogue.deathmark$deathmarktracker.name=halálbélyeget visel
actors.hero.abilities.rogue.deathmark$deathmarktracker.desc=Ez az ellenség megbélyegződött, ami miatt 25%% bónuszsérülést szenved, ugyanakkor lehetetlenné teszi, hogy meghaljon, amíg a bélyeg meg nem szűnik.\n\nHátralévő körök: %s.
actors.hero.abilities.rogue.shadowclone.name=árnyékklón
actors.hero.abilities.rogue.shadowclone.short_desc=A zsivány megidéz egy _árnyékklónt_, amelyet irányíthat, hogy segítsen neki a harcban.
actors.hero.abilities.rogue.shadowclone.desc=A zsivány megidézi saját árnyékmását, amelyet irányíthat, hogy segítse őt a harcban. Az árnyékklón irányítása nem kerül töltésbe.\n\nA klónnak 80 életpontja van, nincs páncélja, és 10-20 sebzést okoz. Mindezek a tulajdonságok tehetségekkel javíthatók, melyekből a klón a hős fegyverei és páncélja által részesül.
actors.hero.abilities.rogue.shadowclone$shadowally.name=Árnyékzsivány
actors.hero.abilities.rogue.shadowclone$shadowally.direct_defend=A klónod a megadott helyre megy.
actors.hero.abilities.rogue.shadowclone$shadowally.direct_follow=A klónod téged követve mozog.
actors.hero.abilities.rogue.shadowclone$shadowally.direct_attack=A klónod támadni megy!
actors.hero.abilities.rogue.shadowclone$shadowally.desc=A zsivány sötét árnyakból készült másolata. Mozdulatlanul áll, tekintete üres, és a sötétség apró foszlányok formájában párolog ki belőle.\n\nA klón nem tökéletes másolata a zsiványnak, de még így sem utolsó harcos, és a megfelelő tehetségek révén a zsivány felszereléseinek hozadékaiból is részesülhet.
actors.hero.abilities.rogue.shadowclone$shadowally.discover_hint=Ezt a karaktert egy bizonyos hős páncéljának képességének segítségével találhatod meg.

actors.hero.abilities.huntress.spectralblades.name=kísértetpengék
actors.hero.abilities.huntress.spectralblades.short_desc=A vadásznő _kísértetpengéket_ dob a célpont felé, és az éppen viselt közelharci fegyverétől függő sebzést okoz velük.
actors.hero.abilities.huntress.spectralblades.desc=A vadásznő kísértetpengét dob egy ellenfelére, ami úgy működik, mintha a közelharci fegyverével távolra csapott volna le. A közelharci fegyver minden hatása aktiválódik, beleértve a bűvöleteket is.
actors.hero.abilities.huntress.naturespower.name=természet ereje
actors.hero.abilities.huntress.naturespower.short_desc=A vadásznő a _természet erejét_ hívja segítségül, ami rövid időre megnöveli a mozgási sebességét és az íja tűzgyorsaságát.
actors.hero.abilities.huntress.naturespower.desc=A vadásznő ideiglenesen felruházza magát és íját a természet erejével! Ez 8 körig tart.\n\nEz idő alatt a vadásznő 2x gyorsabban mozog, és 33%-kal gyorsabban támad az íjával. Az íj bónuszhatásai nem érvényesülnek, mikor az orvlövész a különleges támadásait használja.
actors.hero.abilities.huntress.naturespower$naturespowertracker.name=természet ereje
actors.hero.abilities.huntress.naturespower$naturespowertracker.desc=A vadásznő rövid időre megerősödik, megnő a mozgási sebessége és az íjjal való támadási sebessége.\n\nHátralévő körök: %s
actors.hero.abilities.huntress.spirithawk.name=léleksólyom
actors.hero.abilities.huntress.spirithawk.no_space=Nincs szabad hely a közeledben.
actors.hero.abilities.huntress.spirithawk.short_desc=A vadásznő megidéz egy _léleksólymot_, amely segít neki felderíteni a helyszíneket, és elterelni az ellenség figyelmét.
actors.hero.abilities.huntress.spirithawk.desc=A vadásznő megidéz egy léleksólymot, amelyet a képesség ismételt használatával lehet irányítani, amíg az ebben a világban van. A sólyom 100 körig marad a vadásznő mellett, és a sólyom irányításához nem kell töltést felhasználni.\n\nA sólyomnak csekély élet- és támadóereje van, de gyors, ügyesen kitér és pontos. Mindig megosztja a teljes látóterét a vadásznővel. Immunis minden területhez kötött hatásra, például tűzre és mérges gázra. Csak akkor támad, ha kifejezetten erre utasítják.
actors.hero.abilities.huntress.spirithawk$hawkally.name=léleksólyom
actors.hero.abilities.huntress.spirithawk$hawkally.direct_defend=A sólymod a megadott helyre repül.
actors.hero.abilities.huntress.spirithawk$hawkally.direct_follow=A sólymod téged követve mozog.
actors.hero.abilities.huntress.spirithawk$hawkally.direct_attack=A sólymod támadni megy!
actors.hero.abilities.huntress.spirithawk$hawkally.desc=Mágikus sólyom, amelyet a vadásznő idézett meg. Élénk éteri kék színben ragyog, feje folyamatosan ide-oda mozog, miközben pásztázza a környéket.\n\nBár nem túl jó harcos, sebessége és látása miatt kiválóan alkalmas felderítésre, és az ellenség figyelmének elterelésére.
actors.hero.abilities.huntress.spirithawk$hawkally.desc_remaining=Hátralévő körök: %d.
actors.hero.abilities.huntress.spirithawk$hawkally.desc_dodges=Hátralévő garantált kitérések : %d.
actors.hero.abilities.huntress.spirithawk$hawkally.discover_hint=Ezt a karaktert egy bizonyos hős páncéljának képességének segítségével találhatod meg.

actors.hero.abilities.duelist.challenge.name=kihívás
actors.hero.abilities.duelist.challenge.prompt=Válaszd ki az ellenfelet, akit kihívsz
actors.hero.abilities.duelist.challenge.already_dueling=Egyszerre csak egy párbajban vehetsz részt.
actors.hero.abilities.duelist.challenge.ally_target=Csak ellenségeket lehet kihívni.
actors.hero.abilities.duelist.challenge.unreachable_target=A célpontodnak elérhető távolságban kell lenni.
actors.hero.abilities.duelist.challenge.distant_target=Az ellenfél túl távol van a kihíváshoz.
actors.hero.abilities.duelist.challenge.short_desc=A párbajhős _kihív_ egy közeli ellenfelet párbajozni, és közben átmenetileg megdermeszt minden közeli ellenséget.
actors.hero.abilities.duelist.challenge.desc=A párbajhős párbajra hív ki egy közelben lévő ellenséget. Ez az ellenség kénytelen harcolni vele, míg az összes többi ellenség számára ideiglenesen megdermed az idő.\n\nA célpontnak a párbajhőstől nézve elérhetőnek és 5 mezőn belül kell lennie. A párbaj addig tart, amíg 10 kör el nem telik, az ellenség meg nem hal, vagy a párbajhős több, mint 5 mező távolságra kerül az ellenségtől.\n\nA dermedt idejű ellenségek sebezhetetlenek. A párbajhős szövetségeseit nem dermeszti meg ez a képesség, de ha egy főellenség a célpont, akkor annak csatlósai sem fognak megdermedni.
actors.hero.abilities.duelist.challenge$duelparticipant.name=párbajrésztvevő
actors.hero.abilities.duelist.challenge$duelparticipant.desc=Ez a karakter párbajban vesz részt. Ő és bármelyik szövetségese vagy csatlósa a szokott módon cselekedhet, mások viszont megdermednek.\n\nA párbaj vagy egy meghatározott ideig tart, vagy amíg az egyik résztvevő meg nem hal, vagy amíg a résztvevők 5 mezőnél nagyobb távolságra nem kerülnek egymástól.\n\nHátralévő körök: %d.
actors.hero.abilities.duelist.elementalstrike.name=elemi csapás
actors.hero.abilities.duelist.elementalstrike.short_desc=A párbajhős _elemi csapást_ hajt végre, amitől egy kúp alakú területen a fegyverén lévő bűvöleten alapuló hatás söpör végig.
actors.hero.abilities.duelist.elementalstrike.desc=A párbajhős lecsap egy ellenségre vagy helyszínre, és egy közönséges támadást hajt végre, amely mindenképpen talál, és egy mágikus hatást terjeszt, amely legfeljebb 4 mező távolságra jut el 65 fokos kúp alakban. Ez a mágikus hatás a párbajhős elsődleges fegyverén lévő bűvölettől függően változik.
actors.hero.abilities.duelist.elementalstrike.generic_desc=Egy bűvölet nélküli elemi csapás kis mágikus robajjal jár, amely 6-12 sebzést okoz minden ellenségnek a hatósugarában.
actors.hero.abilities.duelist.feint.name=színlelés
actors.hero.abilities.duelist.feint.prompt=Válassz egy helyet, ahová vetődni szeretnél
actors.hero.abilities.duelist.feint.too_far=Ez a hely nem szomszédos veled.
actors.hero.abilities.duelist.feint.bad_location=Nem tudsz arra a helyre menni.
actors.hero.abilities.duelist.feint.short_desc=A párbajhős _színleléskor_ támadást tettet, és közben egy szomszédos mezőre vetődik. Az ellenségek az utóképét támadják, így védtelenek lesznek az ellentámadással szemben.
actors.hero.abilities.duelist.feint.desc=A párbajhős támadást színlelve egy szomszédos mezőre vetődik, és hátrahagy magáról egy gyorsan múló utóképet. Az addig a párbajhőst támadó ellenségek az utóképet támadják helyette.\n\nAz utóképet támadó ellenségek zavartságukban nem hajtják végre a következő cselekvésüket, és védtelenek lesznek egy meglepő támadással szemben.

actors.hero.abilities.cleric.ascendedform.name=magasztos forma
actors.hero.abilities.cleric.ascendedform.short_desc=A térítő _magasztos formát_ ölt, miáltal új varázsigéket ismer meg, megnő a támadási hatósugara és a védőburka.
actors.hero.abilities.cleric.ascendedform.desc=A térítő szent erőt sugároz magából, és 10 körig emelkedett szintű, ragyogó formát ölt. Amíg a térítő ebben a formában van, új varázsigéket tud mondani, 2-vel megnő a támadási hatósugara, 30 védőburkot kap, és minden egyes varázsige, amit mond, 10 védőburkot ad neki a szentkönyv minden egyes felhasznált töltése után.\n\nA magasztos formában kapott védőburok és varázsigék nem a szokásos ideig tartanak, hanem azonnal megszűnnek, amint a magasztos forma elmúlik. A képesség ismételt használatával a magasztos forma időtartama meghosszabbítható.
actors.hero.abilities.cleric.ascendedform$ascendbuff.name=magasztos forma
actors.hero.abilities.cleric.ascendedform$ascendbuff.desc=Ragyogó energia árad ki a térítő testéből. Míg a térítő ebben a formában van, 2-vel megnő a támadási hatósugara (a belőle áradó szent energia által), és 10 védőburkot kap minden alkalommal, amikor felhasználja a szentkönyv egy töltését. Képes továbbá a magasztos formához tartozó tehetségekkel elérhetővé váló varázsigék elmondására is.\n\nA magasztos forma által biztosított védőburok és a varázsigék nem a szokásos ideig tartanak, hanem azonnal megszűnnek, amint a magasztos forma elmúlik.\n\nJelenlegi védőburok: %1$d.\nHátralévő körök: %2$d.
actors.hero.abilities.cleric.trinity.name=szentháromság
actors.hero.abilities.cleric.trinity.no_imbue=Jelenleg semmilyen hatás sincs beállítva a szentháromság egyik alakjához sem. Mondd el valamelyik varázsigéjét!
actors.hero.abilities.cleric.trinity.no_duplicate=A szentháromság nem képes lemásolni olyan hatást, amelyet jelenleg is viselsz.
actors.hero.abilities.cleric.trinity.ench_glyph_use=A szentháromság ezt a hatást _%1$d körig_ fogja érvényesíteni, _%2$s töltés_ árán.
actors.hero.abilities.cleric.trinity.rare_ench_glyph_use=A szentháromság ezt az erőteljes hatást _%1$d körig_ fogja érvényesíteni, _%2$s töltés_ árán.
actors.hero.abilities.cleric.trinity.wand_use=A szentháromság egy _+%1$d_ szintű lövést fog leadni ezzel a varázspálcával, _%2$s töltés_ árán.
actors.hero.abilities.cleric.trinity.wand_multi_use=A szentháromság _+%1$d_ szintű _lövéseket_ fog leadni ezzel a varázspálcával, _%2$s töltés_ árán.
actors.hero.abilities.cleric.trinity.thrown_use=A szentháromság egy _+%1$d_ szintű dobást fog véghez vinni ezzel a dobófegyverrel, _%2$s töltés_ árán.
actors.hero.abilities.cleric.trinity.ring_use=A szentháromság ennek a gyűrűnek a hatását _+%1$d_ szinten fogja érvényesíteni 20 körig, _%2$s töltés_ árán.
actors.hero.abilities.cleric.trinity.alchemiststoolkit_use=A szentháromság ennek az ereklyének a terepen való alkímiahasználatot biztostó hatását fogja érvényesíteni, _%2$s töltés_ árán.
actors.hero.abilities.cleric.trinity.chaliceofblood_use=A szentháromság ennek az ereklyének a _+%1$d_ szintű természetes gyógító hatását fogja érvényesíteni 20 körig, _%2$s töltés_ árán.
actors.hero.abilities.cleric.trinity.driedrose_use=A szentháromság ennek az ereklyének a hatásával _+%1$d_ szintű kísértet életerejével egyenértékű szövetséges züllött lidércet fog megidézni, _%2$s töltés_ árán.
actors.hero.abilities.cleric.trinity.etherealchains_use=A szentháromság ennek az ereklyének a _+%1$d_ hatósugarú lánc kivetését lehetővé tévő hatását fogja érvényesíteni, _%2$s töltés_ árán.
actors.hero.abilities.cleric.trinity.hornofplenty_use=A szentháromság ennek az ereklyének a majszolást lehetővé tevő hatását fogja érvényesíteni, _%2$s töltés_ árán.
actors.hero.abilities.cleric.trinity.masterthievesarmband_use=A szentháromság ennek az ereklyének az ellenségek _+%1$d_ töltéssel való kirablását biztosító hatását fogja érvényesíteni, _%2$s töltés_ árán.
actors.hero.abilities.cleric.trinity.sandalsofnature_use=A szentháromság ennek az ereklyének valamilyen ártalmas maggal kiváltott meggyökerezési hatását fogja érvényesíteni, _%2$s töltés_ árán.
actors.hero.abilities.cleric.trinity.skeletonkey_use=A szentháromság ennek az ereklyének a behelyezési hatását fogja érvényesíteni, _%2$s töltés_ árán.
actors.hero.abilities.cleric.trinity.talismanofforesight_use=A szentháromság ennek az ereklyének a _+%1$d_ töltéssel való fürkészési hatását fogja érvényesíteni, _%2$s töltés_ árán.
actors.hero.abilities.cleric.trinity.timekeepershourglass_use=A szentháromság ennek az ereklyének _%1$d_ körig tartó időmegállító hatását fogja érvényesíteni, _%2$s töltés_ árán.
actors.hero.abilities.cleric.trinity.unstablespellbook_use=A szentháromság ennek az ereklyének egy véletlenszerű tekercset, illetve _%1$d/10_ eséllyel annak egzotikus változatát kiváltó hatását fogja érvényesíteni, _%2$s töltés_ árán.
actors.hero.abilities.cleric.trinity.cost=Ennek a képességnek a töltésköltsége ugyan nem állandó, de általában _%d._
actors.hero.abilities.cleric.trinity.short_desc=A térítő új képességek _szentháromságát_ tanulja meg, amelyek olyan felszereléseket utánoznak, amelyeket látott, és ezeket új varázsigék elmondásával rendelheti hozzá.
actors.hero.abilities.cleric.trinity.desc=A térítő páncélképességek _szentháromságát_ tanulja meg,  amelyet különböző tárgyak hatásához rendelhet hozzá három új varázsige elmondásával. E varázsigék mindegyike eltérő típusú felszerelések képességeit utánozza, amelyeket a térítő a futama során azonosított: testi alak (fegyverek és páncélok), tudati alak (pálcák és dobófegyverek) és lelki alak (gyűrűk és ereklyék).\n\nA szentháromság minden alakja egyszerre csak egy hatással lehet beoltva, és a térítő eldöntheti, hogy melyik érvényesüljön, mikor a szentháromságot használja. A szentháromság nem másolhatja le olyan tárgyak hatását, amelyeket már viselsz.
actors.hero.abilities.cleric.trinity$wndusetrinity.text=Válaszd ki, hogy a szentháromság melyik alakját szeretnéd használni. A különböző alakok hatásai egyidejűleg is érvényesülhetnek.
actors.hero.abilities.cleric.trinity$wndusetrinity.body=_Testi alak: %s._
actors.hero.abilities.cleric.trinity$wndusetrinity.mind=_Tudati alak: %s._
actors.hero.abilities.cleric.trinity$wndusetrinity.spirit=_Lelki alak: %s._
actors.hero.abilities.cleric.trinity$wnditemtypeselect.text=Válaszd ki, melyik hatást szeretnéd a szentháromságba oltani. További tudnivalókat a megerősítés előtt fogsz látni.
actors.hero.abilities.cleric.trinity$wnditemconfirm.body=Hozzárendelés a testi alakhoz
actors.hero.abilities.cleric.trinity$wnditemconfirm.mind=Hozzárendelés a tudati alakhoz
actors.hero.abilities.cleric.trinity$wnditemconfirm.spirit=Hozzárendelés a lelki alakhoz
actors.hero.abilities.cleric.powerofmany.name=közösség ereje
actors.hero.abilities.cleric.powerofmany.prompt_default=Válassz egy szövetségest vagy egy helyet.
actors.hero.abilities.cleric.powerofmany.prompt_ally=Irányítsd a fény szövetségesed
actors.hero.abilities.cleric.powerofmany.ally_exists=Már van egy felerősített szövetségesed.
actors.hero.abilities.cleric.powerofmany.no_vision=Nem tudsz olyan helyet célba venni, amelyet nem látsz.
actors.hero.abilities.cleric.powerofmany.only_allies=Csak szövetségeseket tudsz felerősíteni.
actors.hero.abilities.cleric.powerofmany.short_desc=A térítő a _közösség erejét_ felhasználva erőt ad egy meglévő szövetségesnek, vagy teremt egy újat.
actors.hero.abilities.cleric.powerofmany.desc=A térítő a _közösség erejét_ használja, amely vagy egy meglévő szövetségest erősít fel, vagy egy új szövetségest hoz létre 100 körre. Egy üres hely célbavételével egy új szövetségest hoz létre.\n\nAmíg a közösség ereje által felerősödik, addig bármelyik szövetséges +25% sebzést okoz és -25% sebzést szenved el, és megosztja a látókörét a térítővel. A képesség használatakor 25 pajzsot is kapnak.\n\nA térítő három új varázslatot is kap, amelyeket csak egy felerősített szövetségessel együtt tud használni. A közösség ereje nem szűnik meg, amíg ezen varázslatok egyike aktív.
actors.hero.abilities.cleric.powerofmany$powerbuff.name=közösség ereje
actors.hero.abilities.cleric.powerofmany$powerbuff.desc=Ezt a szövetségest a közösség ereje erősítette fel, ami +25%% sebzést és -25%%-al csökkenti a sérülését. A látókörét is megosztja a térítővel, és részesül a közösség erejének előnyeiből.\n\nA közösség ereje akkor is fennmarad, amikor a szövetségesek, úgy mint a prizmaképek elrejtőznek, de az időtartama továbbra is visszaszámlálódik.\n\nHátralévő körök: %s.
actors.hero.abilities.cleric.powerofmany$lightally.name=fény szövetséges
actors.hero.abilities.cleric.powerofmany$lightally.direct_defend=A szövetségesed arra a helyre megy.
actors.hero.abilities.cleric.powerofmany$lightally.direct_follow=A szövetségesed követ téged.
actors.hero.abilities.cleric.powerofmany$lightally.direct_attack=A szövetségesed támadni megy!
actors.hero.abilities.cleric.powerofmany$lightally.desc=A térítő egyik kalandozó társának másolata, szilárd fényből. Bár egy másik hős alakját viseli, nem rendelkezik annak egyedi képességeivel. Ez a szövetsége nem tűnik el mindaddig, amíg a közösség ereje hat rá.\n\nEz a szövetséges költség nélkül irányítható a közösség ereje páncélképesség újbóli alkalmazásával.
actors.hero.abilities.cleric.powerofmany$lightally.discover_hint=Ezt a karaktert egy bizonyos hős páncéljának képességének segítségével találhatod meg.


actors.hero.abilities.ratmogrify.name=patkányosítás
actors.hero.abilities.ratmogrify.cant_transform=Azt nem tudod patkányosítani.
actors.hero.abilities.ratmogrify.too_strong=Ez az ellenfél túl erős a patkányosításhoz!
actors.hero.abilities.ratmogrify.short_desc=A hős _patkányosít_ egy ellenséget! Ez átmenetileg képességek nélküli patkánnyá változtatja.
actors.hero.abilities.ratmogrify.desc=A hős 6 körre patkánnyá változtat egy ellenséget! Főellenségek, szövetségesek és patkányok nem patkányosíthatók.\n\nA patkányosított ellenségek megtartják eredeti támadó- és védekezőértékeiket, de nem rendelkeznek semmilyen képességgel.
actors.hero.abilities.ratmogrify$transmograt.name=patkányosított %s
actors.hero.abilities.ratmogrify$transmograt.desc=Ez az ellenség patkánnyá változott. Azt kell mondjam, ez egy hatalmas javulás! - Patkánykirály
actors.hero.abilities.ratmogrify$transmograt.rankings_desc=Megölt egy patkányosított ellenfél

##Cleric Spells
actors.hero.spells.auraofprotection.name=védelemaura
actors.hero.spells.auraofprotection.short_desc=Megnöveli a rendlovag és a közeli szövetségesek védelmét.
actors.hero.spells.auraofprotection.desc=A rendlovag körül védelmező energiát sugárzó, szikrázó aura jön létre 20 körig. A rendlovagtól 2 mezőn belül található szövetségesek (beleértve önmagát is) %1$d%%-kal kevesebb sérülést szenvednek, és részesülnek a rendlovag páncélján lévő varázsjel +%2$d%%-kal felerősített hatásából .\n\nEz a sérüléscsökkentés még azelőtt érvényesül, hogy más hatások (pl. páncél) csökkentenék a sérülést. A varázsjel erejének fokozása mindig érvényesül, de e varázsige által a rendlovag varázsjele nem érvényesíthető többször, ha egy karakter már részesült belőle (pl. maga a rendlovag vagy egy prizmakép).
actors.hero.spells.auraofprotection$aurabuff.name=védelemaura
actors.hero.spells.auraofprotection$aurabuff.desc=A rendlovag védelmező energiát sugároz maga köré.\n\nA közeli szövetségesek (beleértve magát a rendlovagot is) kevesebb sérülést szenvednek el, és részesülnek a rendlovag páncélján lévő varázsjel fokozott erejű hatásából.\n\nHátralévő körök: %s.

actors.hero.spells.beamingray.name=sugárnyaláb
actors.hero.spells.beamingray.no_space=Nincs hely, ahol a szövetségesed megjelenhetne.
actors.hero.spells.beamingray.out_of_range=Ez a hely hatótávolságon kívül van.
actors.hero.spells.beamingray.short_desc=Teleportálja a szövetségesedet, és bónusz sebzést biztosít neki.
actors.hero.spells.beamingray.desc=A térítő a szövetségesén lévő erőt egy fénysugárrá alakítja, amely egy adott helyre sugározza. Ha a sugár egy ellenséggel ütközik, a szövetségest a közelébe helyezi, és az ellenség felé irányítja.\n\nA fénysugár maximális hatótávolsága %1$d mezőig terjed, és 10 körön keresztül +%2$d%%-ra növeli a közösség erejének bónusz sebzését 4 mezőn belül a legközelebbi ellenség ellen. A sugárnyaláb még az általában mozdulatlan szövetségeseket is teleportálhatja, de a hatótávolsága ilyenkor a felére csökken.
actors.hero.spells.beamingray$beamingrayboost.name=sugárnyaláb
actors.hero.spells.beamingray$beamingrayboost.desc=Ez a szövetséges nemrégiben teleportálva lett a sugárnyalábbal, és ez bónusz sebzést adott neki a teleportálás után a legközelebbi ellenség ellen. A közösség ereje akkor sem szűnik meg, ha ez a hatás aktív.\n\nHátralévő körök: %s.

actors.hero.spells.blessspell.name=áldás
actors.hero.spells.blessspell.short_desc=Megáldja és védőburkot ad a térítőnek, vagy megáld és gyógyít másokat.
actors.hero.spells.blessspell.desc=A térítő szent áldásban részesíti magát vagy egy másik karaktert, amelyet lát.\n\nAmikor önmagára mondja az áldást, a hatása gyengébb lesz, így %1$d körig tartó áldást és %2$d védőburkot kap.\n\nAmikor másik karakterre mondja a varázsigét, a hatása erősebb lesz, így az %3$d körig tartó áldást és %4$d életerőpontot kap. A hiányzó életerőn felüli pontok védőburokká alakulnak.

actors.hero.spells.bodyform.name=testi alak
actors.hero.spells.bodyform.short_desc=A szentháromságot hozzárendeli egy bűvölethez vagy egy varázsjelhez.
actors.hero.spells.bodyform.desc=A térítő választ egy olyan bűvöletet vagy varázsjelet, amelyet ebben a futamban azonosított, és beoltja a hatásával a szentháromságot.\n\nA szentháromság használatakor a térítő %d körig részesül a választott bűvölet vagy varázsjel hatásából. Ez az ideiglenes bűvölet vagy varázsjel bármely hatással működik, amellyel egy közönséges bűvölet vagy varázsjel is működne.\n\nEz a varázsige lecserél minden más testi hatást, amellyel a szentháromság jelenleg be van oltva.
actors.hero.spells.bodyform$bodyformbuff.name=testi alak
actors.hero.spells.bodyform$bodyformbuff.desc=A szentháromság testi alakja jelenleg egy bűvölet vagy varázsjel erejét biztosítja számodra, mintha csak a jelenlegi fegyvereden vagy páncélodon volna.\n\nNe feledd, hogy a testi alak nem tud lemásolni olyan hatást, amelyből már részesülsz.\n\nJelenlegi hatás: %1$s.\n\nHátralévő körök: %2$s.

actors.hero.spells.cleanse.name=megtisztítás
actors.hero.spells.cleanse.short_desc=Megtisztít a negatív hatásoktól, és védőburkot ad.
actors.hero.spells.cleanse.desc=A térítő megtisztítja magát és a látható szövetségeseket minden káros állapothatástól. Miután elmúlik a varázsige hatása, minden érintett karakter %1$d körig immunis lesz a negatív hatásokkal szemben, és %2$d védőburkot is kap.

actors.hero.spells.clericspell.prompt=Válassz célpontot
actors.hero.spells.clericspell.no_target=Itt nincs célpont.
actors.hero.spells.clericspell.invalid_target=Arra a helyre nem tudod a varázserődet irányítani.
actors.hero.spells.clericspell.invalid_enemy=Arra az ellenségre nem tudod a varázserődet irányítani.
actors.hero.spells.clericspell.charge_cost=%d töltésbe kerül

actors.hero.spells.divinesense.name=isteni sugallat
actors.hero.spells.divinesense.short_desc=Átmenetileg nagy hatósugarú belső látásod lesz.
actors.hero.spells.divinesense.desc=A térítő a környezetére összpontosítja az érzékeit, amitől 50 körig %d mező hatósugarú belső látása lesz. Ennek a varázsigének az elmondása nem vesz igénybe időt.
actors.hero.spells.divinesense$divinesensetracker.name=isteni sugallat
actors.hero.spells.divinesense$divinesensetracker.desc=Ez a karakter átmenetileg képes lett a közelében lévő lényeket érzékelni az elméjével!\n\nHátralévő körök: %s.

actors.hero.spells.divineintervention.name=isteni közbenjárás
actors.hero.spells.divineintervention.short_desc=Jelentős védőburoktöltet a térítőnek és a szövetségeseinek.
actors.hero.spells.divineintervention.desc=A térítő tetemes mennyiségű energiát juttat magának és szövetségeseinek a könyvéből, ami mindannyiukat %1$d védőburokkal erősíti, és meghosszabbítja a magasztos formát %2$d körrel. E varázsige hihetetlen védőerejét a nagyon magas töltésigénye ellensúlyozza.\n\nA magasztos formában szerzett egyéb védőburkokhoz hasonlóan, ez a védőburok sem a szokásos ideig tart, hanem azonnal megszűnik, amint a magasztos forma elmúlik.

actors.hero.spells.flash.name=villanás
actors.hero.spells.flash.prompt=Válassz egy helyet
actors.hero.spells.flash.short_desc=Teleportálj valahova a közeledben.
actors.hero.spells.flash.desc=A térítő a magasztos formáját egy közeli helyre küldi, és odateleportál. A villanás bármely felfedezett helyre odateleportálhatja a térítőt, amely hatótávon belül van és nem foglalt. E varázsige minden alkalommal egyre több töltést igényel a könyvtől, amikor ugyanabban a magasztos formában használják.

actors.hero.spells.guidinglight.name=vezérfény
actors.hero.spells.guidinglight.short_desc=Távolsági mágikus sebzést okoz, és garantált találatot segít elő.
actors.hero.spells.guidinglight.desc=A térítő mágikus energianyalábot lő ki, amely 2-8 sebzést okoz a célpontnak, és megvilágítja azt. A megvilágított ellenség ellen az erőkövetelményeknek megfelelő fegyverrel indított következő fizikai támadás garantáltan betalál.
actors.hero.spells.guidinglight.desc_priest=_Ez a varázsige sokkal erősebb, ha a pap mondja el._ 50 körönként egyszer mondható el ez a varázsige úgy, hogy az nem használ el egy töltést sem a szentkönyvből, és a megvilágítás hatását a ragyogás, a varázspálcák, más karakterek és az ellenségekre közvetlenül ható ereklyék is kiválthatják. Az így kiváltott megvilágítás a pap szintjének megfelelő + 5 mágikus bónuszsebzést okoz.
actors.hero.spells.guidinglight$guidinglightpriestcooldown.name=Vezérfény
actors.hero.spells.guidinglight$guidinglightpriestcooldown.desc=A pap ismét elmondhatja költségmentesen a vezérfény varázsigét, ha letelik az 50 kör.\n\nHátralévő körök: %s.
actors.hero.spells.guidinglight$illuminated.name=Megvilágított
actors.hero.spells.guidinglight$illuminated.desc=Ez a karakter fénylik, mivel vezérfény találta el. A fény ugyan nem olyan erős, hogy megvilágítsa a környező területet, de a mágikus hatása miatt sokkal könnyebben eltalálja őt a térítő.
actors.hero.spells.guidinglight$illuminated.desc_priest=A pap a ragyogással, a pálcalövéseivel, egy szövetséges általi ütéssel vagy bizonyos ereklyék hatásával kiváltja a megvilágítást is. Az ilyen módon kiváltott megvilágítás a pap szintjével megegyező + 5 mágikus sebzést okoz.
actors.hero.spells.guidinglight$illuminated.desc_generic=Más hősök továbbra is használhatják a megvilágítást, hogy kihasználják a perzselő fény tehetség előnyeit, de nem lesznek pontosak.

actors.hero.spells.hallowedground.name=megszentelt föld
actors.hero.spells.hallowedground.prompt=Válassz egy helyet
actors.hero.spells.hallowedground.short_desc=Gyógyítja a szövetségeseket, lelassítja az ellenségeket, és füvet növeszt a hatósugarában.
actors.hero.spells.hallowedground.desc=A pap a körülötte lévő földbe vezeti az isteni mágiáját, amivel %1$dx%1$d mezőnyi területen megszentelt földet hoz létre 20 körig.\n\nA varázsige elmondásakor minden szövetséges 15 életponttal gyógyul (a teljesen egészséges szövetségesek és a pap védőburkot kapnak), kis időre meggyökereznek az ellenségek, és rövid fű sarjad.\n\nA megszentelt föld minden szövetségest 1 életponttal gyógyít körönként (a teljesen egészséges szövetségesek és a pap védőburkot kapnak), az ellenségek lerokkannak, és magas fű nő véletlenszerűen.\n\nA megszentelt földet elpusztítja a tűz, és ösvényekkel barázdált füvet hoz létre, ha a passzív regenerációs képesség nem működik, vagy a pap már régóta nem szerzett tapasztalatpontot.
actors.hero.spells.hallowedground$hallowedterrain.desc=Ezt a földet megszentelték. A megszentelt föld lelassítja az ellenségeket, gyógyítja a szövetségeseket, és füvet sarjaszt.

actors.hero.spells.holyintuition.name=szent megérzés
actors.hero.spells.holyintuition.prompt=válassz valamit
actors.hero.spells.holyintuition.cursed=Rosszindulatú mágiát érzel megbújni ebben a tárgyban.
actors.hero.spells.holyintuition.uncursed=Ez a tárgy rosszindulatú mágiától mentes.
actors.hero.spells.holyintuition.short_desc=Azonosítja, hogy a tárgy átkozott-e vagy sem.
actors.hero.spells.holyintuition.desc=A térítő érzékelését egy adott tárgyra összpontosítja, és meghatározza, hogy az átkozott-e vagy sem anélkül, hogy viselnie kellene azt.

actors.hero.spells.holylance.name=szent lándzsa
actors.hero.spells.holylance.short_desc=Súlyos távolsági mágikus sebzést okoz.
actors.hero.spells.holylance.desc=A pap nagy mennyiségű energiát összpontosít egy pusztító, fényből álló dobólándzsába. E lándzsa %1$d-%2$d sebzést okoz, és mindig a legmagasabb sebzést okozza az élőhalott és démoni célpontoknak.\n\nEz a varázsige nagyon sok töltésbe kerül, és 30 kört kell várni, amíg újra el lehet mondani.
actors.hero.spells.holylance$lancecooldown.name=szent lándzsa várakozási ideje
actors.hero.spells.holylance$lancecooldown.desc=A pap a közelmúltban mondta el a szent lándzsa varázsigéjét, és most várnia kell, mielőtt újra elmondhatja.\n\nHátralévő körök: %s.

actors.hero.spells.holyward.name=szent oltalom
actors.hero.spells.holyward.glyph_name=fényes %s
actors.hero.spells.holyward.glyph_desc=Ez a varázsjel kissé megnöveli a páncél által kivédhető sérülés mértékét.
actors.hero.spells.holyward.short_desc=Átmenetileg felülírja a varázsjeleket, hogy megnövelje a páncél által nyújtott védelmet.
actors.hero.spells.holyward.desc=A térítő a szent fény varázsjelét vési a viselt páncéljára, amivel megnöveli a páncél sérülésblokkolását 1-gyel. Ennek a varázsigének az elmondása nem vesz igénybe időt.\n\nA varázsjel 50 körig tart, és ezalatt felülírja a páncél jótékony varázsjeleit. A térítő akkor is részesül ebből az előnyös hatásból, ha nincs páncélja.
actors.hero.spells.holyward.desc_paladin=_Ez a varázsige erősebb, ha a rendlovag mondja el._ A megnövelt sérülésblokkolás 3-mal nagyobb lesz, a varázsige nem írja felül a meglévő varázsjeleket, és a szent oltalom időtartama alatt más varázsigék elmondásakor a felhasznált töltésenként 10 körrel meghosszabbodik az időtartama.
actors.hero.spells.holyward$holyarmbuff.name=szent oltalom
actors.hero.spells.holyward$holyarmbuff.desc=A térítő szent energiát vezetett a viselt páncéljába, ami átmenetileg felülírta a meglévő varázsjeleket, és 1-gyel több sérülés kivédését teszi lehetővé.\n\nHátralévő körök: %s.
actors.hero.spells.holyward$holyarmbuff.desc_paladin=A rendlovag szent energiát vezetett a páncélba, amelyet visel, aminek következtében a páncél 3 ponttal több sérülést véd ki.\n\nA szent oltalom hatása alatt elmondott egyéb varázsigék töltésenként 10 körrel meghosszabbítják az időtartamát.\n\nHátralévő körök: %s.

actors.hero.spells.holyweapon.name=szent fegyver
actors.hero.spells.holyweapon.ench_name=szent %s
actors.hero.spells.holyweapon.ench_desc=A szent fegyverrel megütött ellenségek további mágikus sebzést is elszenvednek.
actors.hero.spells.holyweapon.short_desc=Átmenetileg felülírja a bűvöleteket, hogy megnövelje a sebzést.
actors.hero.spells.holyweapon.desc=A térítő szent energiával bűvöli meg a viselt fegyverét, ami miatt a fegyver további 2 mágikus sebzést okoz valahányszor megüt vele egy ellenséget. Ennek a varázsigének az elmondása nem vesz igénybe időt.\n\nE bűvölet 50 körig tart, és ezalatt felülírja a fegyver jótékony bűvöleteit. A pusztakézi ütések is részesülhetnek ebből az előnyös hatásból.
actors.hero.spells.holyweapon.desc_paladin=_Ez a varázsige erősebb, ha a rendlovag mondja el._ A megnövelt mágikus sebzés 6-tal nagyobb lesz, a varázsige nem írja felül a meglévő bűvöleteket, és a szent fegyver időtartama alatt más varázsigék elmondásakor a felhasznált töltésenként 10 körrel meghosszabbodik az időtartama.
actors.hero.spells.holyweapon$holywepbuff.name=szent fegyver
actors.hero.spells.holyweapon$holywepbuff.desc=A térítő szent energiát vezetett a viselt fegyverébe, ami átmenetileg felülírta a meglévő bűvöleteket, és ezáltal a fegyver további 2 mágikus sebzést okoz minden támadás alkalmával.\n\nHátralévő körök: %s.
actors.hero.spells.holyweapon$holywepbuff.desc_paladin=A rendlovag szent energiát vezetett a fegyverébe, amelyet visel, aminek következtében a fegyver 6 ponttal több mágikus sebzést okoz.\n\nA szent fegyver hatása alatt elmondott egyéb varázsigék töltésenként 10 körrel meghosszabbítják az időtartamát.\n\nHátralévő körök: %s.

actors.hero.spells.judgement.name=végítélet
actors.hero.spells.judgement.short_desc=Minden látható ellenséget sebez.
actors.hero.spells.judgement.desc=A térítő öklével a földre csap, minek hatására fény tör elő, amely minden ellenségnek sérülést okoz, akit lát. Az alapsebzés mértéke %1$d-%2$d, de további 33%% sebzést is okoz minden olyan varázsige után, amelyet azóta mondott el a térítő, hogy magasztos formát öltött (vagy mióta utoljára elmondta a végítélet varázsigéjét).\n\nMost éppen %3$d-%4$d sebzést okoz a végítélet.

actors.hero.spells.layonhands.name=kézrátétel
actors.hero.spells.layonhands.short_desc=Időveszteség nélkül gyógyítja az egyik szomszédos karaktert, vagy védőburkot ad a rendlovagnak.
actors.hero.spells.layonhands.desc=A rendlovag szent energiát küld a kezén keresztül, amely meggyógyít vagy védelmez bármit, amihez hozzáér.\n\nA rendlovag ezt a varázsigét bármelyik szomszédos karakterre irányíthatja, hogy %1$d ponttal gyógyítsa, vagy irányíthatja saját magára, hogy %1$d védőburkot kapjon. A varázsigéből származó gyógyulás fölösleges része védőburokká alakul.\n\nEz a varázsige időveszteség nélkül és többször is elmondható, de nem adhat egyszerre több, mint három elmondásnak megfelelő értékű védőburkot.

actors.hero.spells.lifelinkspell.name=életerőkapocs
actors.hero.spells.lifelinkspell.short_desc=Megosztja a sebzést egy szövetségesével, és csökkenti a sérülést.
actors.hero.spells.lifelinkspell.desc=A térítő megerősíti a kapcsolatot önmaga és a felerősített szövetségese között. Ezzel a megerősített kapcsolattal minden elszenvedett sebzés megoszlik a hős és a szövetségese között %1$d körön keresztül, és a közösség erejének védekező erősítése -%2$d%% elszenvedett sebzésre nő. Vedd figyelembe, hogy a sebzés a páncélzat után, de a közösség erejének sebzéscsökkentése előtt oszlik meg.\n\nAmíg ez a hatás aktív, a jótékony 3-as követelményszintű vagy annál alacsonyabb térítői varázslatok, mind a térítőre, mind a szövetségesre vonatkoznak, úgy, mintha csak az egyikükre alkalmazták volna.
actors.hero.spells.lifelinkspell$lifelinkspellbuff.name=életerőkapocs-védelem
actors.hero.spells.lifelinkspell$lifelinkspellbuff.desc=A térítő nemrég életerőkapcsot varázsolt erre a szövetségesre.\n\nAz életerőkapocs szokásos előnyei mellett ez a karakter csökkentett sebzést szenved el, minden pozitív térítői varázslat a térítőre és a szövetségesre is vonatkozik, nem csak az egyikre, és a közösség ereje nem szűnik meg, amíg ez a hatás aktív.\n\nHátralévő körök: %s.

actors.hero.spells.mindform.name=tudati alak
actors.hero.spells.mindform.short_desc=A szentháromságot hozzárendeli egy varázspálcához vagy egy dobófegyverhez.
actors.hero.spells.mindform.desc=A térítő választ egy olyan varázspálcát vagy dobófegyvert, amelyet ebben a futamban azonosított, és beoltja a hatásával a szentháromságot.\n\nA szentháromság használatakor a térítő képes lesz egy olyan támadást intézni, mint amilyet egy ilyen,  +%d szintű tárggyal intézhetne. Ez minden hatást kivált, amelyet az adott típusú tárgy használata egyébként kiváltana.\n\nEz a varázsige lecserél minden más tudati hatást, amellyel a szentháromság jelenleg be van oltva.

actors.hero.spells.mnemonicprayer.name=felidéző imádság
actors.hero.spells.mnemonicprayer.short_desc=Meghosszabbítja a szövetségesre vagy ellenségre ható jótékony vagy káros hatásokat, és ismét megvilágítja őt.
actors.hero.spells.mnemonicprayer.desc=A pap elmond egy imát, amely a célpontot befolyásoló minden jótékony vagy káros hatás időtartamát meghosszabbítja %1$d körrel. Ennek a varázsigének az elmondása nem vesz igénybe időt. A kedvező hatások hosszabb ideig fognak tartani a szövetségesek esetén (beleértve a papot magát is), és a káros hatások hosszabb ideig fognak tartani az ellenségek esetén.\n\nA felidéző imádság csak egyszer képes meghosszabbítani egy adott jótékony vagy káros hatást, és nem képes meghosszabbítani a páncélképességek által kiváltott kedvező hatásokat.

actors.hero.spells.radiance.name=ragyogás
actors.hero.spells.radiance.short_desc=Megvilágítja és rövid ideig elkábítja a látható ellenségeket.
actors.hero.spells.radiance.desc=A papból szent fény árad szét, 3 körre elkábítva az összes látható ellenfelet.  Ha egy ellenfél már meg van világítva, a ragyogás aktiválja a megvilágítás bónusz sebzését, és alkalmazza a megvilágított erejű gyengítést. Továbbá, ha a jelenlegi emelet sötét, akkor a ragyogástól a pap 100 körig izzó fényt bocsájt ki magából.

actors.hero.spells.recallinscription.name=jelismétlés
actors.hero.spells.recallinscription.short_desc=Megismétli egy közelmúltban használt rúnakő vagy tekercs hatását.
actors.hero.spells.recallinscription.desc=A térítő szent mágiáját használja, hogy újra előidézze egy, az utóbbi %s körben használt rúnakövön vagy tekercsen lévő mágikus rúna hatását.\n\nA jelismétlés nem használható a fejlesztéstekercs hatásának előidézéséhez. E varázsige eltérő mennyiségű töltésbe kerül, attól függően, hogy milyen tárgyat használtál utoljára: rúnakő esetén 2, tekercs esetén 3, egzotikus tekercs esetén 4. A töltésfelhasználása kétszer akkora, ha átváltoztatótekercs vagy olyan alkímiával előállítható tárgy hatását másolja, amelynek az elkészítéséhez átváltoztató- vagy fejlesztéstekercsre van szükség.
actors.hero.spells.recallinscription$useditemtracker.name=utoljára használt rúna
actors.hero.spells.recallinscription$useditemtracker.desc=A térítő a közelmúltban olyan tárgyat használt, amely a jelismétlés varázsige követelményeinek megfelel. A térítő elmondhatja a varázsigét, hogy megismételje a tárgy hatását.\n\nA tárgy, amelyet használt: %1$s.\n\nHátralévő körök: %2$s.

actors.hero.spells.shieldoflight.name=fénypajzs
actors.hero.spells.shieldoflight.short_desc=Ideiglenes páncélzatot biztosít egy célponttal szemben.
actors.hero.spells.shieldoflight.desc=A térítő vékony fénypajzsot képez ő és egy ellenség közé, ami %1$d-%2$d egységgel megnöveli a páncélja sérülésblokkoló erejét az adott az ellenséggel szemben 5 körig.\n\nE varázsige elmondásának nincs időigénye, de egyszerre csak egy célpont ellen használható.
actors.hero.spells.shieldoflight$shieldoflighttracker.name=fénypajzs
actors.hero.spells.shieldoflight$shieldoflighttracker.desc=Vékony fénypajzs feszül e karakter és egy ellenség között. Nem olyan erős, hogy teljesen kivédje a támadásokat, de le tudja gyengíteni azokat.\n\nHátralévő körök: %s

actors.hero.spells.spiritform.name=lelki alak
actors.hero.spells.spiritform.short_desc=A szentháromságot hozzárendeli egy gyűrűhöz vagy egy ereklyéhez.
actors.hero.spells.spiritform.desc=A térítő választ egy olyan gyűrűt vagy ereklyét, amelyet ebben a futamban azonosított (a szentkönyv kivételével), és beoltja a hatásával a szentháromságot.\n\nHa a választott tárgy egy gyűrű, akkor a szentháromság egy ugyanolyan, +%1$d szintű gyűrű hatását biztosítja 20 körig.\n\nHa a választott tárgy egy ereklye, akkor a szentháromság egy ugyanolyan, +%2$d szintű ereklye hatását utánozza 20 körig. Minden szentháromsággal használt ereklye különbözőképpen viselkedik, és eltérő a páncéltöltésköltségük is.\n\nEz a varázsige lecserél minden más lelki hatást, amellyel a szentháromság jelenleg be van oltva.
actors.hero.spells.spiritform$spiritformbuff.name=lelki alak
actors.hero.spells.spiritform$spiritformbuff.desc=A szentháromság lelki alakja jelenleg egy tárgy erejét biztosítja számodra, mintha csak az a felszerelésedben volna.\n\nNe feledd, hogy a lelki alak nem tud lemásolni olyan hatást, amelyből már részesülsz.\n\nJelenlegi hatás: %1$s.\n\nHátralévő körök: %2$s.

actors.hero.spells.smite.name=lesújtás
actors.hero.spells.smite.short_desc=Garantálja, hogy az ütés betalál, bónuszsebzést okoz, és nagyobb erejű lesz a bűvöletete.
actors.hero.spells.smite.desc=A rendlovag az igazak pusztító erejével erősíti meg egy közelharci csapását.\n\nA  lesújtás a szokásos közelharci sebzésen túl gondoskodik arról, hogy az erőkövetelményeknek megfelelő fegyverrel indított támadás garantáltan betaláljon, +300%%-kal megnöveli a bűvölet erejét, és további %1$d - %2$d mágikus sebzést okoz.\n\nA lesújtás által gerjesztett mágikus többletsebzés a rendlovag szintjével arányosan nő, és az élőhalott vagy démoni ellenségek ellen mindig a lehető legnagyobb mágikus többletsebzést okozza.

actors.hero.spells.stasis.name=sztázis
actors.hero.spells.stasis.short_desc=Eltávolítja a szövetségeseket a kazamatából és megtartja őket.
actors.hero.spells.stasis.desc=A térítő saját magára összpontosítja a kapcsolatot a szövetségeséről, ami azt eredményezi, hogy a szövetséges ideiglenesen egyfajta energiasztázisba kerül a térítőben. A szövetséges legfeljebb %d körön át marad meg, és minden pozitív hatás, amely rajtuk van, hatástalan marad a sztázis ideje alatt.\n\nA szövetséges a térítő mellett jelenik meg, amikor a sztázis természetes módon véget ér, vagy a térítő azonnal, költség nélkül újra elmondja a varázsigét, hogy korábban megszüntesse a hatást. A sztázis mozdíthatatlan szövetségeseket is mozgathat, de nem viheti át őket a katakomba más szintjeire.
actors.hero.spells.stasis$stasisbuff.name=a szövetséges sztázisban van
actors.hero.spells.stasis$stasisbuff.left_behind=Mozdulatlan szövetségesed hátrahagytad.
actors.hero.spells.stasis$stasisbuff.desc=A térítő jelenleg egy szövetségest tárol sztázisban. Az összes pozitív hatás, úgy mint a közösség ereje, megmarad ezen szövetségesen, és a hatás elmúltával a térítő mellett jelenik meg újra. A hatás korábban is megszüntethető, ha újra használja a sztázist.\n\nSzövetséges sztázisban: %1$s.\nHátralévő körök: %2$s.

actors.hero.spells.sunray.name=napsugár
actors.hero.spells.sunray.short_desc=Távolsági mágikus sebzést okoz, és egy alkalommal elvakítja a célpontot.
actors.hero.spells.sunray.desc=A térítő vakító fénysugarat lő a célpontra, amely %1$d-%2$d sebzést okoz neki, és %3$d körig elvakítja. A napsugár varázsige mindig a legmagasabb sebzést okozza az élőhalott és démoni célpontoknak.\n\nMiután az ellenséget eltalálta ez a varázsige, hozzászokik a látása, és többször már nem fogja elvakítani. Ha azonban még egyszer eltalálja, amíg a varázsige miatti vakság tart, a fény olyan letaglózó, hogy lebénítja őt.

actors.hero.spells.walloflight.name=fényfal
actors.hero.spells.walloflight.short_desc=Falat képez, amely az ellenségek útjába áll.
actors.hero.spells.walloflight.desc=A rendlovag áthatolhatatlan fénytáblákból álló, 1 mező vastagságú, %1$d mező szélességű, és 20 körig tartó falat hoz létre közvetlenül maga előtt.\n\nEz a fal ugyanolyan, mint egy közönséges fal, csak átlátszó. Azok az ellenségek, amelyek a fal alá szorulnak, amikor létrejön, rövid időre elkábulnak, és ha lehetséges, hátralökődnek. Bármi szoruljon a falba, ki tud jönni belőle.\n\nA fal létrehozható a négy fő oldal vagy a négy átlós oldal  bármelyike felől. Ha van már egy fal, akkor a varázsige költségmentesen újra elmondható a fal időveszteség nélküli megtisztása érdekében.
actors.hero.spells.walloflight.early_end=Eloszlatod a fényfalat.
actors.hero.spells.walloflight$lightwall.desc=Csillogó fénytáblák akadályozzák itt a keresztülhaladást.

##main hero
actors.hero.hero.name=a hős
actors.hero.hero.leave=Még nem mehetsz el! Lent vár rád a kazamata többi része!
actors.hero.hero.level_up=Szintet léptél!
actors.hero.hero.new_level=Szintlépés! +pontosság, +kijátszás, +5 életpont!
actors.hero.hero.new_talent=+1 tehetségpont!
actors.hero.hero.unspent=Van felhasználható tehetségpontod!
actors.hero.hero.level_cap=Ennél erősebb már nem lehetsz, de a tapasztalatod tengernyi hatalmat ad!
actors.hero.hero.you_now_have=egy %s került a hátizsákodba.
actors.hero.hero.you_cant_have=egy %s nem fér bele a hátizsákodba.
actors.hero.hero.locked_chest=Ez a láda le van zárva, és nincs hozzá kulcsod.
actors.hero.hero.locked_door=Nincs hozzá kulcsod.
actors.hero.hero.noticed_smth=Észrevettél valamit.
actors.hero.hero.wait=...
actors.hero.hero.search=keresés
actors.hero.hero.search_distracted=Nehezen koncentrálsz, így fárasztó a keresés.
actors.hero.hero.key_distracted=Nem tudtad teljesen kinyitni a zárat, tovább kell próbálkoznod.
actors.hero.hero.pain_resist=A fájdalom segít, hogy ellenállj az álmosságnak.
actors.hero.hero.revive=Az ankh éltető energiával robban szét!

##classes
actors.hero.heroclass.warrior=harcos
actors.hero.heroclass.warrior_desc_short=A harcos több sérülést képes elviselni a _törött pecsétje_ által biztosított védőburoknak köszönhetően. A pecsétet át lehet helyezni egyik páncélról a másikra, és _egy fejlesztést is magával visz._
actors.hero.heroclass.warrior_desc=A harcos egy _egyedi, törött pecséttel_ kezd, ami védőburkot ad neki, amikor a harcos életereje a felénél kevesebbre csökken. A pecsétet át lehet helyezni egyik páncélról a másikra, és _egyetlen fejlesztést magával tud vinni_.\n\nEzen kívül a játék elején van a harcosnak egy _viseltes rövidkardja_, _három dobóköve_, egy szövetpáncélja, egy vizestömlője és egy bársonyzacskója.\n\nA harcos magától felismeri:\n_-_ az azonosítótekercset\n_-_ a gyógyitalt\n_-_ a dühtekercset
actors.hero.heroclass.warrior_unlock=A harcos eredendően fel van oldva.

actors.hero.heroclass.mage=mágus
actors.hero.heroclass.mage_desc_short=A mágus a misztikumok ismerője, és egy _mágikus botot_ visel, amely erősebb, mint egy pálca. A botot a mágus bármilyen pálcával _beolthatja_, amit csak talál.
actors.hero.heroclass.mage_desc=A mágus egy _saját varázsbottal_ kezdi a játékot, amely lényegesen gyorsabban töltődik fel, mint a varázspálca, és eggyel több töltéssel rendelkezik. A botot _bármelyik pálcával be lehet oltani_, amelyiket a mágus a kazamatában talál.\n\nA mágusnak a játék kezdetén van még egy _varázslövedék-pálcája_, amely a botjába van oltva, egy szövetpáncélja, egy vizestömlője és egy bársonyzacskója.\n\nA mágus magától felismeri:\n_-_ Az azonosítótekercset\n_-_ A folyékony tűz italát\n_-_ A fejlesztéstekercset
actors.hero.heroclass.mage_unlock=A mágus feloldásához _olvass fel egy fejlesztéstekercset, és tégy erősebbé egy tárgyat._

actors.hero.heroclass.rogue=zsivány
actors.hero.heroclass.rogue_desc_short=A zsivány az _árnyékköpenyével_ képes kitérni az ellenség elől, és láthatatlanul megütni az ellenfelet. Nagyobb távolságból is _észreveszi a titkokat és a csapdákat_.
actors.hero.heroclass.rogue_desc=A zsivány _saját árnyékköpennyel_ kezdi a játékot, amellyel tetszés szerint láthatatlanná válhat.\n\nA zsivány nagyobb távolságból is képes _észrevenni a titkokat és csapdákat_.\n\nA zsiványnak ezen kívül _egy tőre_, _három dobókése_, szövetpáncélja, egy vizestömlője és egy bársonyzacskója van kezdetben.\n\nA zsivány magától felismeri: \n_-_ Az azonosítótekercset\n_-_ A láthatatlanság italát\n_-_ A varázstérképtekercset
actors.hero.heroclass.rogue_unlock=A zsivány feloldásához _támadj 10-szer egy játékon belül az ellenséget meglepve!_

actors.hero.heroclass.huntress=vadásznő
actors.hero.heroclass.huntress_desc_short=A vadásznő a dobófegyverek mestere, és van egy _mágikus íja_ korlátlan számú nyíllal. A magas fűben pedig úgy közlekedik, hogy _nem tapossa le azt._
actors.hero.heroclass.huntress_desc=A vadásznő _saját lélekíjjal_ kezdi a játékot, amely korlátlan számú nyílvesszőt képes megidézni és kilőni.\n\nA vadásznő képes a magas fűben úgy közlekedni, _hogy nem tapossa le_.\n\nA vadásznőnek van még _szegecses kesztyűje_, szövetpáncélja, vizestömlője és egy bársonyzacskója is a játék elején.\n\nA vadásznő magától felismeri:\n_-_ Az azonosítótekercset\n_-_ A belső látás italát\n_-_ Az altatódal-tekercset
actors.hero.heroclass.huntress_unlock=A vadásznő feloldásához _találj el 10-szer egy játékon belül ellenséget dobófegyverrel!_

actors.hero.heroclass.duelist=párbajhős
actors.hero.heroclass.duelist_desc_short=A párbajhős a fegyverek mestere, aki _egyedi fegyveres képességet_ tud használni a fegyverével. Ez az egyedi képesség _fegyverenként különböző_.
actors.hero.heroclass.duelist_desc=A párbajhős _saját tőrrel_ kezdi a játékot, amelynek idővel feltöltődő különleges képessége van.\n\nMinden fegyvernek a játékban _más-más különleges képessége_ van, amelyet a párbajhős használhat.\n\nA párbajhősnek _két dobótüskéje_, szövetpáncélja, egy vizestömlője és egy bársonyzacskója is van a játék elején.\n\nA párbajhős magától felismeri:\n_-_ Az azonosítótekercset\n_-_ Az erőitalt\n_-_ A tükörképtekercset
actors.hero.heroclass.duelist_unlock=A párbajhős feloldásához _viselj egy legalább 2-es követelményszintű fegyvert úgy, hogy megvan a hozzá szükséges erőd._

actors.hero.heroclass.cleric=térítő
actors.hero.heroclass.cleric_desc_short=A térítő isteni varázsigék tudója, aki a saját _szentkönyvét_ használja az isteni mágia irányítására. Tehetségei által képes _varázsigéket megtanulni és fejleszteni_.
actors.hero.heroclass.cleric_desc=A térítő _saját szentkönyvvel_ kezdi a játékot, amelyből különböző varázsigéket tud felolvasni.\n\nA térítő legtöbb tehetsége varázsigék megtanulására és fejlesztésére vonatkozik.\n\nA térítőnek ezen kívül van _egy jogara_, egy szövetpáncélja, egy vizestömlője és egy bársonyzacskója a játék elején.\n\nA térítő magától felismeri:\n_-_ Az azonosítótekercset\n_-_ A tisztaság italát\n_-_ Az átoklevétel-tekercset
actors.hero.heroclass.cleric_unlock=A térítő feloldásához _vedd le teljesen az átkot egy átkozott felszerelésről._

actors.hero.herosubclass.berserker=vérengző
actors.hero.herosubclass.berserker_short_desc=A _vérengző_ egyre dühösebbé válik, ahogy sérül. A düh növeli a sebzését, és ha a szintje eléri a 100%-ot, bónuszvédőburokra váltható.
actors.hero.herosubclass.berserker_desc=A vérengző egyre dühösebbé válik, ahogy fizikai sérülés éri, még akkor is, ha a páncélja blokkolja a sérülést! A düh idővel fokozatosan elmúlik, de ha alacsony a vérengző életereje, akkor lassabban.\n\nA dühtől a vérengző akár +50% sebzést is okozhat. Maximális dühöngésnél vérengzésbe kezdhet, ami egy védőburkot eredményez, és a dühét addig tartja fenn, amíg meg van a védőburok. A védőburok a vérengző páncéljának szintjével arányos, és jelentősen megnőhet, ha a vérengzőnek alacsony az életereje. A vérengzőnek időre van szüksége a regenerálódáshoz a vérengzést követően.
actors.hero.herosubclass.gladiator=gladiátor
actors.hero.herosubclass.gladiator_short_desc=A _gladiátor_ sikeres támadások esetén kombópontokat gyűjt. A kombópontokat egyedi képességei használatára fordíthatja.
actors.hero.herosubclass.gladiator_desc=A gladiátor minden egyes sikeres közelharci vagy dobófegyveres támadás alkalmával egy kombópontot kap. Ha a gladiátor 5 körön belül (15 körrel egy gyilkosság után) nem hajt végre sikeres támadást, a kombópontjai lenullázódnak.\n\nAhogy a gladiátor gyűjti a kombópontjait, számos olyan képességet használhat, amelyek garantáltan betalálnak:\n2 kombópont: ellenség visszalökése, megmaradnak a kombópontok.\n4 kombópont: páncélzat erősségén alapuló sebzést okoz.\n6 kombópont: hárítás, megmaradnak a kombópontok.\n8 kombópont: a célpont és a közelben lévő ellenségek sebzése.\n10 kombópont: minden kombópontot egy-egy támadásra vált.
actors.hero.herosubclass.battlemage=harci mágus
actors.hero.herosubclass.battlemage_short_desc=A _harci mágus_ bónuszhatásokat varázsol a botjával, amikor közelharcban harcol. Ezek a hatások attól függenek, hogy milyen pálcával van beoltva a botja.
actors.hero.herosubclass.battlemage_desc=A harci mágus bónuszhatásokat idéz elő, amikor közelharcban a botjával üt, mintha csak a botja még meg is lenne bűvölve. Ezek a hatások attól függenek, hogy milyen pálcával van beoltva a botja. Minden pálcának megvan a maga hatása. A pálcahatásokon kívül a harci mágus botja 0,5 töltést is kap, amikor lecsap vele.
actors.hero.herosubclass.warlock=boszorkánymester
actors.hero.herosubclass.warlock_short_desc=A _boszorkánymester_ pálcáit használva lélekbélyegzést okozhat az ellenfeleknek. Gyógyulni fog minden alkalommal, amikor fizikai sérülést okoz a megjelölt ellenségeknek.
actors.hero.herosubclass.warlock_desc=A boszorkánymester lélekbélyegzést okozhat karaktereknek, amikor pálcával lő rájuk.  A lélekbélyeg megjelenésének esélye és időtartama növekszik a pálca fejlettségi szintjével.\n\nHa egy ellenségen lelke meg van bélyegezve, a boszorkánymester minden 5 sebzés után 2 életpontot gyógyul, de csak akkor, ha közelharci vagy dobófegyverrel támadott, nem pálcával!
actors.hero.herosubclass.assassin=orgyilkos
actors.hero.herosubclass.assassin_short_desc=Az _orgyilkos_ láthatatlanul fel tud készülni, hogy halálos csapást mérjen. Minél tovább vár, annál erősebb lesz a támadás.
actors.hero.herosubclass.assassin_desc=Az orgyilkos a következő csapás előkészítése közben láthatatlanná válik. Minél tovább tart az előkészület, annál erősebb lesz a következő támadása. A felkészülés legfeljebb 9 körig tarthat.\n\nA felkészülés után az orgyilkos bónuszsebzést okoz a következő támadásával, képes a célpontja mellé cikázni, és akár azonnal meg is ölheti a kellőképpen gyenge ellenségeket.
actors.hero.herosubclass.freerunner=szerfutó
actors.hero.herosubclass.freerunner_short_desc=A _szerfutó_ futás közben lendületet gyűjt, amivel szerfutásba kezdhet. Ez egy rövid ideig bónuszsebességet és -kijátszást biztosít neki.
actors.hero.herosubclass.freerunner_desc=A szerfutó mozogása közben egyre több lendületegységre tesz szert. 10 körön keresztül tartó futással akár 10 lendületegységet is gyűjthet, de ezt gyorsan elveszíti, ha megáll. A szerfutó a lendületét felhasználva szerfutásba kezdhet, lendületpontonként 2 körig.\n\nSzerfutás közben a szerfutó 2x-es sebességgel mozog, és szintjével arányosan megnövekedik a kijátszása. Miután a szerfutás véget ér, egy ideig várni kell, amíg a szerfutó újra lendületet gyűjthet.
actors.hero.herosubclass.sniper=orvlövész
actors.hero.herosubclass.sniper_short_desc=Az _orvlövész_ távolsági támadásai keresztülhatolnak a páncélon. Dobófegyveres támadása után rögtön különleges támadást intézhet az íjával.
actors.hero.herosubclass.sniper_desc=Az orvlövész a távolsági harc mestere, akinek távolsági támadásai átütik az ellenség páncélzatát. Amikor dobófegyverrel támad egy ellenséget, orvlövészjelet helyez rá, ami lehetővé teszi számára, hogy különleges támadást intézzen az íjával. A különleges támadás típusa az íjának a bővítésétől függ.\n\nA nem bővített íjjal kapáslövést lehet leadni, amely kisebb sebzést okoz, viszont azonnal ellőhető. A sebesség íja háromvesszős sortüzet lő, nyilanként kisebb sebzést okoz, de bármelyik képes kiváltani a bűvöleteket, valamint 1 körbe telik a lövés. A sebzés íja orvlövést ad le, amely garantáltan talál, a távolságtól függően bónuszsebzést okoz, és 2 körbe telik a lövés.
actors.hero.herosubclass.warden=vadőr
actors.hero.herosubclass.warden_short_desc=A _vadőr_ átlát a magas füvön, és bónuszhatásokat idéz elő, amikor magokat ültet és növényeket tapos el.
actors.hero.herosubclass.warden_desc=A vadőrnek erős kapcsolata van a természettel, ami számos, fűvel és növényekkel kapcsolatos bónuszhatást biztosít neki. Képes átlátni a magas és ösvényekkel barázdált füvön, mintha ott se lenne.\n\nA vadőr által elvetett vagy elültetett magok körül fű hajt ki, és különleges hatások érik, amikor letapossa a növényeket. Ezek a különleges hatások felülírják a növények eredeti hatását, ami azt jelenti, hogy egyetlen növény sem ártalmas számára, amelyikre rátapos.
actors.hero.herosubclass.champion=bajnok
actors.hero.herosubclass.champion_short_desc=A _bajnok_ két fegyvert használhat, és több fegyvertöltést kap. Közönséges támadásaihoz az elsődleges fegyverét használja, de fegyvert cserélhet, és bármelyik fegyver képességét használhatja.
actors.hero.herosubclass.champion_desc=A bajnok a közelharci fegyverek mestere, aki az elsődleges fegyvere mellett egy másodlagos fegyvert is viselhet. Közönséges támadásaihoz az elsődleges fegyverét használja, de az elsődleges fegyvert azonnal kicserélheti, és bármelyik fegyver képességét használhatja.\n\nEmellett 2 további maximális fegyverképesség-töltést és +50% fegyverképesség-újratöltési sebességet kap.
actors.hero.herosubclass.monk=szerzetes
actors.hero.herosubclass.monk_short_desc=A _szerzetes_ harc közben energiát gyűjt. Ezt az energiát számos egyedi képességre használhatja.
actors.hero.herosubclass.monk_desc=A szerzetes a test test elleni harctechnika mestere. Az ellenségek legyőzése által energiát nyer, amelyet különféle védekező jellegű és más hasznos képességekre fordíthat. Ez az energia nem apad le idővel, de van a szerzetes szintje által meghatározott felső korlátja.\n\n1 energia: gyors ütés ököllel\n2 energia: összpontosítás a következő támadás kikerülésére\n3 energia: azonnali vetődés a közelbe\n4 Energia: elrúgja az ellenséget\n5 Energia: meditáció, amely megtisztít a különböző hatásoktól és visszaállít némi pálca- és ereklyetöltést
actors.hero.herosubclass.priest=pap
actors.hero.herosubclass.priest_short_desc=A _pap_ új nagy hatótávú varázsigéket és a vezérfény felerősített változatát tudja használni.
actors.hero.herosubclass.priest_desc=A pap több új és fejlesztett varázsigét tud elmondani, amelyek a távolsági harcban és a varázstárgyakkal együttműködve különösen hasznosak.\n\nA pap 50 körönként költségmentesen elmondhatja a _vezérfény_ varázsigét, bármelyik varázslatuk által közvetlenül megcélzott ellenséget megvilágítja, és a megvilágítás a pap szintjének + 5 megfelelő sérülésnövelő hatását a szövetségesek, a varázspálcák és bizonyos ereklyék révén is kiválthatja.\n\nEzen kívül a pap a _ragyogás_ varázsigét is elmondhatja, amely elűzi a sötétséget, és minden látható ellenségre hat, és alkalmazza a megvilágítást, valamint rövid időre elkábítja őket, 2 töltés árán.
actors.hero.herosubclass.paladin=rendlovag
actors.hero.herosubclass.paladin_short_desc=A _rendlovag_ új közelharci varázsigéket ismer meg, és a szent fegyver és szent oltalom felerősített változatait használja.
actors.hero.herosubclass.paladin_desc=A rendlovag több új és fejlesztett varázsigét tud elmondani, amelyek a közelharcban és a fegyverekkel és páncélokkal együttműködve különösen hasznosak.\n\nA rendlovag _szent fegyver_ és _szent oltalom_ varázsigéinek a hatása nagyobb, nem írják felül a meglévő bűvöleteket és varázsjeleket, és más varázsigék elmondásával meghosszabbíthatók.\n\nEzen kívül a rendlovag a _lesújtás_ varázsigét is elmondhatja, amely egy megnövelt sebzésű és bűvöletű közelharci támadást tesz lehetővé, amely garantáltan betalál.

##talents
actors.hero.talent$provokedangertracker.name=kiprovokált düh
actors.hero.talent$provokedangertracker.desc=A harcos az imént vesztette el a védőburkát, és a következő fizikai támadása bónuszsebzést okoz.\n\nHátralévő körök: %s.
actors.hero.talent$lingeringmagictracker.name=tartós varázslat
actors.hero.talent$lingeringmagictracker.desc=A mágus nemrég használt botot vagy pálcát, a következő fizikai támadása bónuszsebzést okoz.\n\nHátralévő körök: %s.
actors.hero.talent$followupstriketracker.name=követő csapás
actors.hero.talent$followupstriketracker.desc=A vadásznő nemrég megtámadott egy ellenséget egy dobófegyverrel, a következő közelharci támadása ugyanezen célpont ellen fokozott sebzést fog okozni.\n\nHátralévő körök: %s.
actors.hero.talent$patientstriketracker.name=türelmes csapás
actors.hero.talent$patientstriketracker.desc=A párbajhős az imént várakozott egy körig, így a következő közelharci támadása bónuszsebzést okoz.
actors.hero.talent$improvisedprojectilecooldown.name=rögtönzött dobófegyver várakozási ideje
actors.hero.talent$improvisedprojectilecooldown.desc=Nemrég használtad ezt a tehetséget, és várnod kell, mielőtt újra használnád.\n\nHátralévő körök: %s.
actors.hero.talent$rejuvenatingstepscooldown.name=fiatalító lépések várakozási ideje
actors.hero.talent$rejuvenatingstepscooldown.desc=Nemrég használtad ezt a tehetséget, és várnod kell, mielőtt újra használnád.\n\nHátralévő körök: %s.
actors.hero.talent$seershotcooldown.name=látnoki lövés várakozási ideje
actors.hero.talent$seershotcooldown.desc=Nemrég használtad ezt a tehetséget, és várnod kell, mielőtt újra használnád.\n\nHátralévő körök: %s.
actors.hero.talent$aggressivebarriercooldown.name=agresszív védekezés várakozási ideje
actors.hero.talent$aggressivebarriercooldown.desc=Nemrég használtad ezt a tehetséget, és várnod kell, mielőtt újra használnád.\n\nHátralévő körök: %s.
actors.hero.talent$liquidagilacctracker.name=folyékony ügyesség
actors.hero.talent$liquidagilacctracker.desc=A párbajhős következő közönséges közelharci támadása bónuszpontosságot kap.\n\nHátralévő körök: %s.
actors.hero.talent$lethalhastecooldown.name=végzetes sietség várakozási ideje
actors.hero.talent$lethalhastecooldown.desc=Nemrég használtad ezt a tehetséget, és várnod kell, mielőtt újra használnád.\n\nHátralévő körök: %s.
actors.hero.talent$swiftequipcooldown.name=gyors fegyvercsere várakozási ideje
actors.hero.talent$swiftequipcooldown.desc=Nemrég használtad ezt a tehetséget, és várnod kell, mielőtt újra használnád.\n\nHátralévő körök: %s.
actors.hero.talent$preciseassaulttracker.name=pontos támadás
actors.hero.talent$preciseassaulttracker.desc=A párbajhős következő közönséges közelharci támadása bónuszpontosságot kap.\n\nHátralévő körök: %s.
actors.hero.talent$deadlyfollowuptracker.name=halálos kísérőcsapás
actors.hero.talent$deadlyfollowuptracker.desc=A párbajhős nemrég megtámadott egy ellenséget egy dobófegyverrel, a következő közelharci támadása ugyanezen célpont ellen fokozott sebzést fog okozni.\n\nHátralévő körök: %s.
actors.hero.talent$combinedlethalityabilitytracker.executed=végrehajtva
actors.hero.talent$satiatedspellstracker.name=Védőburok-varázsige
actors.hero.talent$satiatedspellstracker.desc=A következő varázsige, amelyet a térítő elmond, egy kis védőburkot fog biztosítani neki.
actors.hero.talent$searinglightcooldown.name=Perzselő fény
actors.hero.talent$searinglightcooldown.desc=Nemrég használtad ezt a tehetséget, és várnod kell, mielőtt újra használnád.\n\nHátralévő körök: %s.

#warrior
actors.hero.talent.hearty_meal.title=kiadós étkezés
actors.hero.talent.hearty_meal.desc=_+1:_ Az étel elfogyasztása _4 életponttal_ gyógyítja a harcost, ha 33% életerőn vagy az alatt van.\n\n_+2:_ Az étel elfogyasztása _6 életponttal_ gyógyítja a harcost, ha 33% életerőn vagy az alatt van.
actors.hero.talent.veterans_intuition.title=veterán megérzése
actors.hero.talent.veterans_intuition.desc=_+1:_ A harcos _1,75x gyorsabban_ azonosítja a fegyvereket és _2,5x gyorsabban_ a páncélokat.\n\n_+2:_ A harcos _2,5x gyorsabban_ azonosítja a fegyvereket, a páncélzatot pedig rögtön, _amint viseli_.
actors.hero.talent.provoked_anger.title=kiprovokált düh
actors.hero.talent.provoked_anger.desc=_+1:_ Amikor a harcosra alkalmazott védőburokerősítés sebzést szenved, a harcos következő fizikai támadása _3 bónusz sebzést_ okoz.\n\n_+2:_ Amikor a harcosra alkalmazott védőburokerősítés sebzést szenved, a harcos következő fizikai támadása _5 bónusz sebzést_ okoz.
actors.hero.talent.iron_will.title=vasakarat
actors.hero.talent.iron_will.desc=_+1:_ A harcos pecsétje által biztosított védőburok _1-gyel növekszik_.\n\n_+2:_ A harcos pecsétje által biztosított védőburok _2-vel növekszik_.
actors.hero.talent.iron_will.meta_desc=_Ha ezt a tehetséget egy másik hős kapja meg_, passzívan garantálja a harcos törött pecsétjének hatásának 1 vagy max. 2-es szintű védőburkának változatát.

actors.hero.talent.iron_stomach.title=vasbendő
actors.hero.talent.iron_stomach.desc=_+1:_ Az étkezés 1 körbe telik a harcosnak, és közben _75% sérülés-ellenállást_ biztosít számára.\n\n_+2:_ Az étkezés 1 körbe telik a harcosnak, és közben _100% sérülés-ellenállást_ biztosít számára.
actors.hero.talent.liquid_willpower.title=folyékony akaraterő
actors.hero.talent.liquid_willpower.desc=_+1:_ A harcos a max. életerejének _6,5%-át kapja védőburokként_, amikor iszik vagy eldob egy főzetet, italt vagy elixírt.\n\n_+2:_ A harcos a max. életerejének _10%-át kapja védőburokként_, amikor iszik vagy eldob egy főzetet, italt vagy elixírt.\n\nA védőburok mennyisége megduplázódik, ha olyan erő-, tapasztalati vagy alkímiai tárgyakat használ, amelyeket ezekkel a főzetekkel kell elkészíteni.\n\nHa olyan alkímiával előállítható tárgyról van szó, amelyiknek az elkészítésekor több darab készül egyszerre (pl. vizes főzet), e tehetség véletlenszerűen fejti ki hatását, aminek valószínűsége függ az adott tárgyból előállított mennyiségtől.
actors.hero.talent.runic_transference.title=rúnaátvitel
actors.hero.talent.runic_transference.desc=_+1:_ A harcos törött pecsétje képes magával vinni a _közönséges varázsjeleket_ éppúgy, ahogy magával visz egy fejlesztést.\n\n_+2:_ A harcos törött pecsétje képes magával vinni a _közönséges, erőteljes és átkozott varázsjeleket_ éppúgy, ahogy magával visz egy fejlesztést.\n\nA pecsét csak akkor képes átvinni a varázsjeleket, ha azok a pecsét felhelyezését követően kerültek a páncélra.
actors.hero.talent.runic_transference.meta_desc=_Ha ezt a tehetséget egy másik hős kapja meg_, akkor abban segít inkább, hogy a páncélodon lévő varázsjelet nehogy eltávolítsa a fejlesztéstekercs. A varázsjelek +1-es tehetségszint esetén csak a 6. szintről való felfejlesztéskor tűnhetnek el először (a 4. helyett), míg +2-es tehetségszint esetén csak a 7. szintről való felfejlesztéskor (a 4. helyett). Az a szint, amelytől kezdve a varázsjelek mindenképpen elvesznek, változatlanul a 8. szint.
actors.hero.talent.lethal_momentum.title=halálos lendület
actors.hero.talent.lethal_momentum.desc=_+1:_ Amikor a harcos fizikai fegyverrel gyilkos csapást mér egy ellenségre, _67% esélye_ van arra, hogy ez 0 kör alatt lejátszódik.\n\n_+2:_ Amikor a harcos fizikai fegyverrel gyilkos csapást mér egy ellenségre, _100% esélye_ van arra, hogy ez 0 kör alatt lejátszódik.
actors.hero.talent.improvised_projectiles.title=rögtönzött dobófegyver
actors.hero.talent.improvised_projectiles.desc=_+1:_ A harcos _2 körre_ megvakíthat egy ellenséget, ha bármilyen tárgyat, ami nem dobófegyver, hozzávág. Ez után 50 kört kell várni, hogy újra használhasd ezt a képességet.\n\n_+2:_ A harcos _3 körre_ megvakíthat egy ellenséget, ha bármilyen tárgyat, ami nem dobófegyver, hozzávág. Ez után 50 kört kell várni, hogy újra használhasd ezt a képességet.

actors.hero.talent.hold_fast.title=védekezőpozíció
actors.hero.talent.hold_fast.desc=_+1:_ Amikor a harcos várakozik, _páncélzata 1-2-vel_ erősödik és _50%-kal_ lassítja a kombók és a pajzsok pozitív hatásainak megszűnését., míg meg nem mozdul.\n\n_+2:_ Amikor a harcos várakozik, _páncélzata 2-4-gyel_ erősödik és _75%-kal_ lassítja a kombók és a pajzsok pozitív hatásainak megszűnését., míg meg nem mozdul.\n\n_+3:_ Amikor a harcos várakozik, _páncélzata 3-6-tal_ erősödik és _100%-kal_ lassítja a kombók és a pajzsok pozitív hatásainak megszűnését., míg meg nem mozdul.
actors.hero.talent.strongman.title=erőember
actors.hero.talent.strongman.desc=_+1:_ A harcos ereje _8%-kal_ nő, lefelé kerekítve.\n\n_+2:_ A harcos ereje _13%-kal_ nő, lefelé kerekítve.\n\n_+3:_ A harcos ereje _18%-kal_ nő, lefelé kerekítve.

actors.hero.talent.endless_rage.title=vég nélküli düh
actors.hero.talent.endless_rage.desc=_+1:_ A vérengző elérheti a _116%-os dühszintet_.\n\n_+2:_ A vérengző elérheti a _133%-os dühszintet_.\n\n_+3:_ A vérengző elérheti a _150%-os dühszintet_.\n\nMinden 100% feletti dühpont 1%-kal növeli a vérengző védőburkát és 1%-kal csökkenti a várakozási időt, amíg újra használható lesz ez a képesség, de nem növeli a sebzési bónuszt +50% fölé.
actors.hero.talent.deathless_fury.title=halhatatlan dühöngés
actors.hero.talent.deathless_fury.desc=_+1:_ A vérengzés magától elkezdődik, ha a vérengző közel áll a halálhoz, és a dühe legalább 100%-os szinten van, de hogy ez újra megismétlődhessen, a _hősnek 3 szintlépést_ kell várni.\n\n_+2:_ A vérengzés magától elkezdődik, ha a vérengző közel áll a halálhoz, és a dühe legalább 100%-os szinten van, de hogy ez újra megismétlődhessen, a _hősnek 2 szintlépést_ kell várni.\n\n_+3:_ A vérengzés magától elkezdődik, ha a vérengző közel áll a halálhoz, és a dühe legalább 100%-os szinten van, de hogy ez újra megismétlődhessen, a _hősnek 1 szintlépést_ kell várni.\n\nÜgyelj arra, hogy a vérengző még így is meghal, ha a vérengzés befejezésekor 0 életpontja van!
actors.hero.talent.enraged_catalyst.title=bőszült gerjesztés
actors.hero.talent.enraged_catalyst.desc=_+1:_ Minél dühösebb a vérengző, annál gyakrabban lépnek működésbe a fegyverén lévő bűvöletek és átkok, 100%-os dühszint esetén legfeljebb _15%-kal gyakrabban_.\n\n_+2:_ Minél dühösebb a vérengző, annál gyakrabban lépnek működésbe a fegyverén lévő bűvöletek és átkok, 100%-os dühszint esetén legfeljebb _30%-kal gyakrabban_.\n\n_+3:_ Minél dühösebb a vérengző, annál gyakrabban lépnek működésbe a fegyverén lévő bűvöletek és átkok, 100%-os dühszint esetén legfeljebb _45%-kal gyakrabban_.

actors.hero.talent.cleave.title=hasítás
actors.hero.talent.cleave.desc=_+1:_ A gladiátornak a gyilkosság után járó extra idő 15-ről _30 körre_ nő.\n\n_+2:_ A gladiátornak a gyilkosság után járó extra idő 15-rőll _45 körre_ nő.\n\n_+3:_ A gladiátornak a gyilkosság után járó extra idő 15-ről _60 körre_ nő.
actors.hero.talent.lethal_defense.title=halálos védelem
actors.hero.talent.lethal_defense.desc=_+1:_ Amikor a gladiátor egy kombómozdulattal megöl egy ellenséget, a törött pecsét védőburkának várakozási ideje _50%-kal_ csökken.\n\n_+1:_ Amikor a gladiátor egy kombómozdulattal megöl egy ellenséget, a törött pecsét védőburkának várakozási ideje _100%-kal_ csökken.\n\n_+1:_ Amikor a gladiátor egy kombómozdulattal megöl egy ellenséget, a törött pecsét védőburkának várakozási ideje _150%-kal_ csökken.\n\nA védőburok várakozási ideje akár -150%-ra is csökkenthető ezzel a tehetséggel, ami azt jelenti, hogy azonnal újra elérhető lesz, amint aktiválják.
actors.hero.talent.enhanced_combo.title=fokozott kombó
actors.hero.talent.enhanced_combo.desc=_+1:_ amikor a gladiátor 7 vagy több kombópontot gyűjtött, a Maflás hátralökésének hossza 3 mezőre nő, szédülést okoz és vermekbe is taszíthatja az ellenfelet.\n\n_+2:_ a +1 szint hozadékai mellett, amikor a gladiátor 9 vagy több kombópontot gyűjtött, a Hárítás több támadás ellen is véd.\n\n_+3:_ a +1 és +2 szintek hozadékai mellett, a gladiátor képes kombó/3 mezőt ugrani a Lecsapás, a Zúzás vagy a Dühöngés használatakor.

actors.hero.talent.body_slam.title=földhöz vágás
actors.hero.talent.body_slam.desc=_+1:_ Amikor a harcos ugrás után földet ér, minden szomszédos ellenség megsérül, melynek mértéke _1-4 plusz 25%-a_ a harcos sérülésblokkoló erejének.\n\n_+2:_ Amikor a harcos ugrás után földet ér, minden szomszédos ellenség megsérül, melynek mértéke _2-8 plusz 50%-a_ a harcos sérülésblokkoló erejének.\n\n_+3:_ Amikor a harcos ugrás után földet ér, minden szomszédos ellenség megsérül, melynek mértéke _3-12 plusz 75%-a_ a harcos sérülésblokkoló erejének.\n\n_+4:_ Amikor a harcos ugrás után földet ér, minden szomszédos ellenség megsérül, melynek mértéke _4-16 plusz 100%-a_ a harcos sérülésblokkoló erejének.
actors.hero.talent.impact_wave.title=becsapódási lökéshullám
actors.hero.talent.impact_wave.desc=_+1:_ Amikor a harcos ugrás után földet ér, minden szomszédos ellenség _2 mezővel_ hátralökődik, és _25% eséllyel_ 5 körig sebezhetővé válik.\n\n_+2:_ Amikor a harcos ugrás után földet ér, minden szomszédos ellenség _3 mezővel_ hátralökődik, és _50% eséllyel_ 5 körig sebezhetővé válik.\n\n_+3:_ Amikor a harcos ugrás után földet ér, minden szomszédos ellenség _4 mezőt_ hátralökődik, és _75% eséllyel_ 5 körig sebezhetővé válik.\n\n_+4:_ Amikor a harcos ugrás után földet ér, minden szomszédos ellenség _5 mezőt_ hátralökődik, és _100% eséllyel_ 5 körig sebezhetővé válik.
actors.hero.talent.double_jump.title=dupla ugrás
actors.hero.talent.double_jump.desc=_+1:_ Ha a harcos 3 körön belül egy második ugrást hajt végre, annak az ugrásnak _16%-kal kisebb_ töltésköltsége van.\n\n_+2:_ Ha a harcos 3 körön belül egy második ugrást hajt végre, annak az ugrásnak _30%-kal kisebb_ töltésköltsége van.\n\n_+3:_ Ha a harcos 3 körön belül egy második ugrást hajt végre, annak az ugrásnak _40%-kal kisebb_ töltésköltsége van.\n\n_+4:_ Ha a harcos 3 körön belül egy második ugrást hajt végre, annak az ugrásnak _50%-kal kisebb_ töltésköltsége van.

actors.hero.talent.expanding_wave.title=táguló hullám
actors.hero.talent.expanding_wave.desc=_+1:_ A lökéshullám hatótávolsága 5 mezőről _6 mezőre_, szélessége pedig 60-ról _75 fokra_ nő.\n\n_+2:_ A lökéshullám hatótávolsága 5 mezőről _7 mezőre_, szélessége pedig 60-ról _90 fokra_ nő.\n\n_+3:_ A lökéshullám hatótávolsága 5 mezőről _8 mezőre_, szélessége pedig 60-ról _105 fokra_nő.\n\n_+4:_ A lökéshullám hatótávolsága 5 mezőről _9 mezőre_, szélessége pedig 60-ról _120 fokra_ nő.
actors.hero.talent.striking_wave.title=lehengerlő hullám
actors.hero.talent.striking_wave.desc=_+1:_ A lökéshullám _30% eséllyel_ kiváltja a találatkor érvényesülő hatásokat, például a bűvöleteket és a kombókat.\n\n_+2:_ A lökéshullám _60% eséllyel_ kiváltja a találatkor érvényesülő hatásokat, például a bűvöleteket és a kombókat.\n\n_+3:_ A lökéshullám _90% eséllyel_ kiváltja a találatkor érvényesülő hatásokat, például a bűvöleteket és a kombókat.\n\n_+4:_ A lökéshullám _100% eséllyel_ kiváltja a találatkor érvényesülő hatásokat, például a bűvöleteket és a kombókat, továbbá a bűvöleteket _+20%-kal erősíti_.
actors.hero.talent.shock_force.title=lökőerő
actors.hero.talent.shock_force.desc=_+1:_ A lökéshullám _20%-kal több sebzést_ okoz, és _25% eséllyel_ kábulást okoz rokkantság helyett.\n\n_+2:_ A lökéshullám _40%-kal több sebzést_ okoz, és _50% eséllyel_ kábulást okoz rokkantság helyett.\n\n_+3:_ A lökéshullám _60%-kal több sebzést_ okoz és _75% eséllyel_ kábulást okoz rokkantság helyett.\n\n_+4:_ A lökéshullám _80%-kal több sebzést_ okoz és _100% eséllyel_ kábulást okoz rokkantság helyett.

actors.hero.talent.sustained_retribution.title=hosszantartó megtorlás
actors.hero.talent.sustained_retribution.desc=_+1:_ A harcos _115% bónuszsebzést_ okoz _2 találatra_ elnyújtva, ahelyett, hogy 100% bónuszsebzést okozna 1 találat alatt.\n\n_+2:_ A harcos _130% bónuszsebzést_ okoz _3 találatra_ elnyújtva, ahelyett, hogy 100% bónuszsebzést okozna 1 találat alatt.\n\n_+3:_ A harcos _145% bónuszsebzést_ okoz _4 találatra_ elnyújtva, ahelyett, hogy 100% bónuszsebzést okozna 1 találat alatt.\n\n_+4:_ A harcos _160% bónuszsebzést_ okoz _5 találatra_ elnyújtva, ahelyett, hogy 100% bónuszsebzést okozna 1 találat alatt.
actors.hero.talent.shrug_it_off.title=vállvonás
actors.hero.talent.shrug_it_off.desc=_+1:_ A harcos tűrés közbeni sérüléscsökkenése 50%-ról _60%-ra nő_.\n\n_+2:_ A harcos tűrés közbeni sérüléscsökkenése 50%-ról _68%-ra nő_.\n\n_+3:_ A harcos tűrés közbeni sérüléscsökkenése 50%-ról _74%-ra nő_.\n\n_+4:_ A harcos tűrés közbeni sérüléscsökkenése 50%-ról _80%-ra nő_.
actors.hero.talent.even_the_odds.title=esélyegyenlítés
actors.hero.talent.even_the_odds.desc=_+1:_ A harcos további _5% bónuszsebzést_ okoz minden 2 mezőn belüli ellenségnek, amikor a tűrés véget ér.\n\n_+2:_ A harcos további _10% bónuszsebzést_ okoz minden 2 mezőn belüli ellenségnek, amikor a tűrés véget ér.\n\n_+3:_ A harcos további _15% bónuszsebzést_ okoz minden 2 mezőn belüli ellenségnek, amikor a tűrés véget ér.\n\n_+4:_ A harcos további _20% bónuszsebzést_ okoz minden 2 mezőn belüli ellenségnek, amikor a tűrés véget ér.

#mage
actors.hero.talent.empowering_meal.title=erősítő étel
actors.hero.talent.empowering_meal.desc=_+1:_ Az étkezés _2 bónuszsebzést_ biztosít a mágusnak a következő 3 alkalommal, amikor sebzést okoz egy pálcájával.\n\n_+2:_ Az étkezés _3 bónuszsebzést_ biztosít a mágusnak a következő 3 alkalommal, amikor sebzést okoz egy pálcájával.
actors.hero.talent.scholars_intuition.title=tudós megérzése
actors.hero.talent.scholars_intuition.desc=_+1:_ A mágus _3x gyorsabban_ azonosítja a pálcákat.\n\n_+2:_ A mágus _használatkor_ azonosítja a pálcákat.
actors.hero.talent.lingering_magic.title=tartós varázslat
actors.hero.talent.lingering_magic.desc=_+1:_ Amikor a mágus pálcával vagy bottal lő, a következő fizikai támadása _1-2 bónuszsebzést_ okoz.\n\n_+2:_ Amikor a mágus pálcával vagy bottal lő, a következő fizikai támadása _2 bónuszsebzést_ okoz.
actors.hero.talent.backup_barrier.title=tartalék védelem
actors.hero.talent.backup_barrier.desc=_+1:_ A mágus _3 védőburkot_ kap, amikor a botja utolsó töltését is elhasználja.\n\n_+2:_ A mágus _5 védőburkot_ kap, amikor a botja utolsó töltését is elhasználja.
actors.hero.talent.backup_barrier.meta_desc=_Ha ezt a tehetséget egy másik hős kapja meg_, akkor ehelyett a hős legmagasabb szintű pálcája hozza működésbe.

actors.hero.talent.energizing_meal.title=energizáló étel
actors.hero.talent.energizing_meal.desc=_+1:_ Az étkezés 1 körbe telik a mágusnak, és _5 körig töltődik a varázspálcája_.\n\n_+2:_ Az étkezés 1 körbe telik a mágusnak, és _8 körig töltődik a varázspálcája_.
actors.hero.talent.inscribed_power.title=lejegyzett erő
actors.hero.talent.inscribed_power.desc=_+1:_ Amikor a mágus elolvas egy tekercset vagy használ egy varázslat tárgyat, a _következő 2 pálcalövése_ +2 szinttel erősebb lesz.\n\n_+2:_ Amikor a mágus elolvas egy tekercset vagy használ egy varázslat tárgyat, a _következő 3 pálcalövése_ +2 szinttel erősebb lesz.\n\nA fokozott erejű pálcalövések száma megduplázódik fejlesztés- vagy átváltoztatótekercs olvasásakor, vagy az ezekből a tekercsekből alkímia segítségével előállítható tárgyak használatakor.\n\nHa olyan alkímiával előállítható tárgyról van szó, amelyiknek az elkészítésekor több darab készül egyszerre (pl. a legtöbb varázslat), e tehetség véletlenszerűen fejti ki hatását, aminek valószínűsége függ az adott tárgyból előállított mennyiségtől.
actors.hero.talent.wand_preservation.title=megóvott varázspálca
actors.hero.talent.wand_preservation.desc=_+1:_ Amikor a mágus új pálcát olt a botjába, a régi pálcát +0-ás szinten kapja vissza, _de csak egyszer képes erre._\n\n_+2:_ Amikor a mágus új pálcát olt a botjába, a régi pálcát +0-ás szinten kapja vissza, _de két szintlépés között csak egyszer képes erre._
actors.hero.talent.wand_preservation.meta_desc=_Ha ezt a tehetséget egy másik hős szerzi meg_, az alkimista üstbe helyezett varázspálcából kinyert misztikus gyanta mennyiségét +1 szinten megnöveli 1-gyel, +2 szinten pedig 2-vel.
actors.hero.talent.arcane_vision.title=misztikus látás
actors.hero.talent.arcane_vision.desc=_+1:_ Amikor a mágus pálcával lő egy ellenségre, _10 körön keresztül_ látni fogja azt a belső szemével.\n\n_+2:_ Amikor a mágus pálcával lő egy ellenségre, _15 körön keresztül_ látni fogja azt a belső szemével.
actors.hero.talent.shield_battery.title=védőburoktöltet
actors.hero.talent.shield_battery.desc=_+1:_ A mágus önmagát is célba veheti egy pálcával, hogy annak minden töltését védőburokká alakítsa át. _Töltésenként a maximális életerő 4%-ának megfelelő_ védőburok képződik.\n\n_+2:_ A mágus önmagát is célba veheti egy pálcával, hogy annak minden töltését védőburokká alakítsa át. _Töltésenként a maximális életerő 6%-ának megfelelő_ védőburok képződik.

actors.hero.talent.desperate_power.title=végső kétségbeesés ereje
actors.hero.talent.desperate_power.desc=_+1:_ A mágus pálcáinak és botjának utolsó lövése _+1 szinttel_ erősebb lesz, mikor már csak egy töltésük maradt.\n\n_+2:_ A mágus pálcáinak és botjának utolsó lövése _+2 szinttel_ erősebb lesz, mikor már csak egy töltésük maradt.\n\n_+3:_ A mágus pálcáinak és botjának utolsó lövése _+3 szinttel_ erősebb lesz, mikor már csak egy töltésük maradt.
actors.hero.talent.ally_warp.title=szövetségesi térváltás
actors.hero.talent.ally_warp.desc=_+1:_ A mágus kiválaszthat egy _2 mezőn belüli_ szövetségest, hogy azonnal helyet cseréljen vele. \n\n_+2:_ A mágus kiválaszthat egy _4 mezőn belüli_ szövetségest, hogy azonnal helyet cseréljen vele.\n\n_+3:_ A mágus kiválaszthat egy _6 mezőn belüli_ szövetségest, hogy azonnal helyet cseréljen vele.\n\nA mágus nem tud helyet cserélni mozdíthatatlan szövetségesekkel.

actors.hero.talent.empowered_strike.title=felerősített csapás
actors.hero.talent.empowered_strike.desc=_+1:_ Miután a harci mágus elsütötte a varázsbotját, első közelharci támadása vele _+16% sebzést_ okoz, és a varázsbot bónuszhatása _+50%-kal erősebb_ lesz.\n\n_+2:_ Miután a harci mágus elsütötte a varázsbotját, első közelharci támadása vele _+33% sebzést_ okoz, és a varázsbot bónuszhatása _+100%-kal erősebb_ lesz.\n\n_+3:_ Miután a harci mágus elsütötte a varázsbotját, első közelharci támadása vele _+50% sebzést_ okoz, és a varázsbot bónuszhatása _+150%-kal erősebb_ lesz.
actors.hero.talent.mystical_charge.title=misztikus töltés
actors.hero.talent.mystical_charge.desc=_+1:_ Miután a harci mágus a varázsbotjával ütött, _0,5 körig_ töltődnek az ereklyéi.\n\n_+2:_ Miután a harci mágus a varázsbotjával ütött, _1 körig_ töltődnek az ereklyéi.\n\n_+3:_ Miután a harci mágus a varázsbotjával ütött, _1,5 körig_ töltődnek az ereklyéi.
actors.hero.talent.excess_charge.title=töltésfelesleg
actors.hero.talent.excess_charge.desc=_+1:_ Ha a harci mágus varázsbotja teljesen töltött, a következő lövése _0,67 védőburkot_ ad neki a botja minden egyes fejlettségi szintje után.\n\n_+2:_ Ha a harci mágus varázsbotja teljesen töltött, a következő lövése _1,33 védőburkot_ ad neki a botja minden egyes fejlettségi szintje után.\n\n_+3:_ Ha a harci mágus varázsbotja teljesen töltött, a következő lövése _2 védőburkot_ ad neki a botja minden egyes fejlettségi szintje után.

actors.hero.talent.soul_siphon.title=lélekszifon
actors.hero.talent.soul_siphon.desc=_+1:_ A más karakterek által okozott fizikai sebzés _13%-os hatékonysággal_ kiváltja a boszorkánymester lélekbélyegét.\n\n_+2:_ A más karakterek által okozott fizikai sebzés _27%-os hatékonysággal_ kiváltja a boszorkánymester lélekbélyegét.\n\n_+3:_ A más karakterek által okozott fizikai sebzés _40%-os hatékonysággal_ kiváltja a boszorkánymester lélekbélyegét.
actors.hero.talent.soul_eater.title=lélekfaló
actors.hero.talent.soul_eater.desc=_+1:_ A lélek bélyegzése _0,33 körig_ jóllakottságot okoz minden egyes fizikai sebzésnél. A megbélyegzett lelkű ellenfelek halálakor _10% esély_ van az étkezéskor működésbe lépő hatások kiváltására.\n\n_+2:_ A lélek bélyegzése _0,67 körig_ jóllakottságot okoz minden egyes fizikai sebzésnél. A megbélyegzett lelkű ellenfelek halálakor _20% esély_ van az étkezéskor működésbe lépő hatások kiváltására.\n\n_+3:_ A lélek bélyegzése _1 körig_ jóllakottságot okoz minden egyes fizikai sebzésnél. A megbélyegzett lelkű ellenfelek halálakor _30% esély_ van az étkezéskor működésbe lépő hatások kiváltására.
actors.hero.talent.necromancers_minions.title=halottidéző csatlósai
actors.hero.talent.necromancers_minions.desc=_+1:_ a boszorkánymester a megbélyegzett lelkű ellenfeleket halálukkor _13% eséllyel_ lidérccé züllesztve támasztja fel.\n\n_+2:_ a boszorkánymester a megbélyegzett lelkű ellenfeleket halálukkor _27% eséllyel_ lidérccé züllesztve támasztja fel.\n\n_+3:_ a boszorkánymester a megbélyegzett lelkű ellenfeleket halálukkor _40% eséllyel_ lidérccé züllesztve támasztja fel.

actors.hero.talent.blast_radius.title=robbanás hatósugara
actors.hero.talent.blast_radius.desc=_+1:_ Az elemi robbanás hatósugara 4 mezőről _5 mezőre_ nő.\n\n_+2:_ Az elemi robbanás hatósugara 4 mezőről _6 mezőre_ nő.\n\n_+3:_ Az elemi robbanás hatósugara 4 mezőről _7 mezőre_ nő.\n\n_+4:_ Az elemi robbanás hatósugara 4 mezőről _8 mezőre_ nő.
actors.hero.talent.elemental_power.title=elemi energia
actors.hero.talent.elemental_power.desc=_+1:_ Az elemi robbanás ereje _25%_-kal növekszik.\n\n_+2:_ Az elemi robbanás ereje _50%_-kal növekszik.\n\n_+3:_ Az elemi robbanás ereje _75%_-kal növekszik.\n\n_+4:_ Az elemi robbanás ereje _100%_-kal növekszik.
actors.hero.talent.reactive_barrier.title=visszacsatolt védelem
actors.hero.talent.reactive_barrier.desc=_+1:_ A mágus _2,5 védőburkot_ kap minden elemi robbanás által érintett karakter után, maximum 5 karakterig.\n\n_+2:_ A mágus _5 védőburkot_ kap minden elemi robbanás által érintett karakter után, maximum 6 karakterig.\n\n_+3:_ A mágus _7,5 védőburkot_ kap minden elemi robbanás által érintett karakter után, maximum 7 karakterig.\n\n_+4:_ A mágus _10 védőburkot_ kap minden elemi robbanás által érintett karakter után, maximum 8 karakterig.

actors.hero.talent.wild_power.title=vad erő
actors.hero.talent.wild_power.desc=_+1:_ A vad mágia használatakor a pálcák szintje _2-vel vagy 3-mal megnő, de +4-es szintnél nem lesz nagyobb_.\n\n_+2:_ A vad mágia használatakor a pálcák szintje _3-mal megnő, de +5-ös szintnél nem lesz nagyobb_.\n\n_+3:_ A vad mágia használatakor a pálcák szintje _3-mal vagy 4-gyel megnő, de +6-os szintnél nem lesz nagyobb_.\n\n_+4:_ A vad mágia használatakor a pálcák szintje _4-gyel megnő, de +7-es szintnél nem lesz nagyobb_.
actors.hero.talent.fire_everything.title=össztűz
actors.hero.talent.fire_everything.desc=_+1:_ A vad mágia mostantól 4 helyett _5-ször_ tüzel, és minden pálcát _25% eséllyel_ 3-szor lehet használni.\n\n_+2:_ A vad mágia mostantól 4 helyett _6-szor_ tüzel, és minden pálcát _50% eséllyel_ 3-szor lehet használni.\n\n_+3:_ A vad mágia mostantól 4 helyett _7-szer_ tüzel, és minden pálcát _75% eséllyel_ 3-szor lehet használni.\n\n_+4:_ A vad mágia mostantól 4 helyett _8-szor_ tüzel, és minden pálcát _100% eséllyel_ 3-szor lehet használni.
actors.hero.talent.conserved_magic.title=megőrzött mágia
actors.hero.talent.conserved_magic.desc=_+1:_ A vad mágia lövései mostantól _0,33 töltést_ használnak el 0,5 helyett, és _25% esélye_ van annak, hogy a vad mágia közben nem telik el egy kör sem.\n\n_+2:_ A vad mágia lövései mostantól _0,225 töltést_ használnak el 0,5 helyett, és _50% esélye_ van annak, hogy a vad mágia közben nem telik el egy kör sem.\n\n_+3:_ A vad mágia lövései mostantól _0,15 töltést_ használnak el 0,5 helyett, és _75% esélye_ van annak, hogy a vad mágia közben nem telik el egy kör sem.\n\n_+4:_ A vad mágia lövései mostantól _0,1 töltést_ használnak el 0,5 helyett, és _100% esélye_ van annak, hogy a vad mágia közben nem telik el egy kör sem.

actors.hero.talent.telefrag.title=Teleport-merénylet
actors.hero.talent.telefrag.desc=_+1:_ Ha a mágus egy másik karakterre teleportál, akkor _10-15 sebzést_ okoz neki, de _5 sérülést_ is elszenved.\n\n_+2:_ Ha a mágus egy másik karakterre teleportál, akkor _20-30 sebzést_ okoz neki, de _10 sérülést_ is elszenved.\n\n_+3:_ Ha a mágus egy másik karakterre teleportál, akkor _30-45 sebzést_ okoz neki, de _15 sérülést_ is elszenved.\n\n_+4:_ Ha a mágus egy másik karakterre teleportál, akkor _40-60 sebzést_ okoz neki, de _20 sérülést_ is elszenved.\n\nA hős nem halhat meg emiatt a tehetség miatt, a saját sérülést csökkentik a mágikus ellenállást biztosító hatások.
actors.hero.talent.remote_beacon.title=Távoli jelzőfény
actors.hero.talent.remote_beacon.desc=_+1:_ A mágus _4 mezőn_ belül bárhová el tud helyezni egy jelzőfényt.\n\n_+2:_ A mágus _8 mezőn_ belül bárhová el tud helyezni egy jelzőfényt.\n\n_+3:_ A mágus _12 mezőn_ belül bárhová el tud helyezni egy jelzőfényt.\n\n_+4:_ A mágus _16 mezőn_ belül bárhová el tud helyezni egy jelzőfényt.\n\nA mágus nem tud lerakni jelzőfényt olyan helyre, amely nem megközelíthető.
actors.hero.talent.longrange_warp.title=Nagy hatótávú térváltás
actors.hero.talent.longrange_warp.desc=_+1:_ A mágus ezentúl _150% töltés árán_ képes emeletek közti térugrásra.\n\n_+2:_ A mágus ezentúl _117% töltés árán_ képes emeletek közti térugrásra.\n\n_+3:_ A mágus ezentúl _83% töltés árán_ képes emeletek közti térugrásra.\n\n_+4:_ A mágus ezentúl _50% töltés árán_ képes emeletek közti térugrásra.\n\nA mágus nem tudja elhagyni a lezárt emeleteket a nagy hatótávú térváltással.

#rogue
actors.hero.talent.cached_rations.title=rejtett fejadagok
actors.hero.talent.cached_rations.desc=_+1:_ A zsivány ládákban elhelyezve találhat _2 ellátmányadagot_ a kazamata következő néhány emeletének felfedezése közben.\n\n_+2:_ A zsivány ládákban elhelyezve találhat _3 ellátmányadagot_ a kazamata következő néhány emeletének felfedezése közben.\n\nAz ellátmányadagok gyorsan elfogyaszthatók, mérsékelt jóllakottságot adnak, 5 életerőt gyógyítanak, és 1 töltést adnak az árnyékköpenynek.
actors.hero.talent.thiefs_intuition.title=tolvaj megérzése
actors.hero.talent.thiefs_intuition.desc=_+1:_ A zsivány _2x gyorsabban_ azonosítja a gyűrűket, és azonosítja a típusukat, _amint felhúzza_.\n\n_+2:_ A zsivány azonosítja a gyűrűket, _amint felhúzza_, és azonosítja a típusukat, _amint a felveszi a földről_.
actors.hero.talent.sucker_punch.title=váratlan ütés
actors.hero.talent.sucker_punch.desc=_+1:_ A zsivány _1-2 bónuszsebzést_ okoz, amikor az első alkalommal meglepi az ellenfelét.\n\n_+2:_ A zsivány _2 bónuszsebzést_ okoz, amikor az első alkalommal meglepi az ellenfelét.
actors.hero.talent.protective_shadows.title=védelmező árnyak
actors.hero.talent.protective_shadows.desc=_+1:_ A zsivány egy-egy védőburkot kap _minden második körben_, amikor láthatatlan, de _legfeljebb 3-at_.\n\n_+2:_ A zsivány egy-egy védőburkot kap _minden körben_, amikor láthatatlan, de _legfeljebb 5-öt_.

actors.hero.talent.mystical_meal.title=misztikus étel
actors.hero.talent.mystical_meal.desc=_+1:_ Az élelem elfogyasztása 1 körig tart a zsiványnak (az ellátmányadagokat azonnal elfogyasztja), és _3 körig ereklyetöltést biztosít neki._\n\n_+2:_ Az étel elfogyasztása 1 körig tart a zsiványnak (az ellátmányadagokat azonnal elfogyasztja), és _5 körig ereklyetöltést biztosít neki._\n\nEz a tehetség nem használható arra, hogy a bőségszaru feltöltse magát.
actors.hero.talent.inscribed_stealth.title=lejegyzett rejtek
actors.hero.talent.inscribed_stealth.desc=_+1:_ A zsivány _3 körre_ láthatatlanná válik, miután elolvasott egy tekercset vagy használt egy varázslat tárgyat.\n\n_+2:_ A zsivány _5 körre_ láthatatlanná válik, miután elolvasott egy tekercset vagy használt egy varázslat tárgyat.\n\nA láthatatlanság időtartama megduplázódik, ha fejlesztéstekercset, átváltoztatótekercset vagy olyan alkímiával előállítható tárgyakat használ, amelyeket ezekből a tekercsekből lehet elkészíteni.\n\nHa olyan alkímiával előállítható tárgyról van szó, amelyiknek az elkészítésekor több darab készül egyszerre (pl. a legtöbb varázslat), e tehetség véletlenszerűen fejti ki hatását, aminek valószínűsége függ az adott tárgyból előállított mennyiségtől.
actors.hero.talent.wide_search.title=nagy hatótávú keresés
actors.hero.talent.wide_search.desc=_+1:_ A zsivány keresési hatótávja megnő, és 5x5-ös négyzet helyett _7x7-es kör_ alakja lesz.\n\n_+2:_ A zsivány keresési hatótávja megnő, és 5x5-ös négyzet helyett _7x7-es négyzet_ alakja lesz.
actors.hero.talent.wide_search.meta_desc=_Ha ezt a tehetséget egy másik hős kapja meg_, akkor ehelyett a keresési hatótávja megnő, és 3x3-as négyzet helyett 5x5-ös kör lesz +1-es szinten, vagy 5x5-ös négyzet lesz +2-es szinten.
actors.hero.talent.silent_steps.title=csendes léptek
actors.hero.talent.silent_steps.desc=_+1:_ A zsivány nem ébreszti fel az alvó ellenségeket, amíg _3 vagy több mezőre van tőlük_.\n\n_+1:_ A zsivány nem ébreszti fel az alvó ellenségeket, amíg _nincs közvetlenül mellettük_.
actors.hero.talent.rogues_foresight.title=zsiványbetekintés
actors.hero.talent.rogues_foresight.desc=_+1:_ Amennyiben a zsivány titkos kamrával rendelkező szintre lép, _75% eséllyel megérzi_, hogy a szint tartalmaz ilyet.\n\n_+2:_ Amennyiben a zsivány titkos kamrával rendelkező szintre lép, _100% eséllyel megérzi_, hogy a szint tartalmaz ilyet.

actors.hero.talent.light_cloak.title=könnyű köpeny
actors.hero.talent.light_cloak.desc=_+1:_ Akkor is használhatja a zsivány az árnyékköpenyét, amikor nem is viseli azt, de ilyenkor csak _25%-os sebességgel_ töltődik újra.\n\n_+2:_ Akkor is használhatja a zsivány az árnyékköpenyét, amikor nem is viseli azt, de ilyenkor csak _50%-os sebességgel_ töltődik újra.\n\n_+3:_ Akkor is használhatja a zsivány az árnyékköpenyét, amikor nem is viseli azt, de ilyenkor csak _75%-os sebességgel_ töltődik újra.
actors.hero.talent.light_cloak.meta_desc=_Ha ezt a tehetséget egy másik hős kapja meg_, akkor ehelyett az összes ereklye töltési sebességét 7/13/20%-kal növeli +1/+2/+3 szint esetén.
actors.hero.talent.enhanced_rings.title=fokozott hatású gyűrűk
actors.hero.talent.enhanced_rings.desc=_+1:_ Amikor a zsivány ereklyét használ, a gyűrűi _3 körig_ +1-gyel nagyobb fejlettségi szintűek lesznek.\n\n_+2:_ Amikor a zsivány ereklyét használ, a gyűrűi _6 körig_ +1-gyel nagyobb fejlettségi szintűek lesznek.\n\n_+3:_ Amikor a zsivány ereklyét használ, gyűrűi _9 körig_ +1-gyel nagyobb fejlettségi szintűek lesznek.

actors.hero.talent.enhanced_lethality.title=fokozott halálosság
actors.hero.talent.enhanced_lethality.desc=_+1:_ Az orgyilkos az előkészületi szintjétől függően képes merényletet elkövetni a _4/13/27/67% egészségszint_ alatti ellenfelek ellen az eredeti 3/10/20/50% helyett.\n\n_+2:_ Az orgyilkos az előkészületi szintjétől függően képes merényletet elkövetni az _5/17/33/83% egészségszint_ alatti ellenfelek ellen az eredeti 3/10/20/50% helyett.\n\n_+3:_ Az orgyilkos az előkészületi szintjétől függően képes merényletet elkövetni a _6/20/40/100% egészségszint_ alatti ellenfelek ellen az eredeti 3/10/20/50% helyett.
actors.hero.talent.assassins_reach.title=orgyilkos hatótávja
actors.hero.talent.assassins_reach.desc=_+1:_ Az orgyilkos felkészülési szintjétől függő cikázási hatósugara _1/3/4/6 mezőre_ emelkedik az eredeti 1/2/3/4-ről.\n\n_+2:_ Az orgyilkos felkészülési szintjétől függő cikázási hatósugara _2/4/6/8 mezőre_ emelkedik az eredeti 1/2/3/4-ről.\n\n_+3:_ Az orgyilkos felkészülési szintjétől függő cikázási hatósugara _2/5/7/10 mezőre_ emelkedik az eredeti 1/2/3/4-ről.\n\nCikázás közben át tud jutni a veszélyforrásokon és az ellenségeken, de szilárd térelemeken, például falakon, nem.
actors.hero.talent.bounty_hunter.title=fejvadász
actors.hero.talent.bounty_hunter.desc=_+1:_ Amikor az orgyilkos rajtaütéssel öl meg egy ellenséget, akkor a felkészülési szintjétől függően _2/4/8/16%-kal_ magasabb lesz annak az esélye, hogy az ellenség hátrahagy egy tárgyat.\n\n_+2:_ Amikor az orgyilkos rajtaütéssel öl meg egy ellenséget, akkor a felkészülési szintjétől függően _4/8/16/32%-kal_ magasabb lesz annak az esélye, hogy az ellenség hátrahagy egy tárgyat.\n\n_+3:_ Amikor az orgyilkos rajtaütéssel öl meg egy ellenséget, akkor a felkészülési szintjétől függően _6/12/24/48%-kal_ magasabb lesz annak az esélye, hogy az ellenség hátrahagy egy tárgyat.

actors.hero.talent.evasive_armor.title=kijátszásnövelő páncél
actors.hero.talent.evasive_armor.desc=_+1:_ Szerfutás közben a szerfutó további _+1 kijátszást_ kap minden erőpontja után, amellyel a páncéljához szükséges erőszinten túl rendelkezik.\n\n_+2:_ Szerfutás közben a szerfutó további _+2 kijátszást_ kap minden erőpontja után, amellyel a páncéljához szükséges erőszinten túl rendelkezik.\n\n_+3:_ Szerfutás közben a szerfutó további _+3 kijátszást_ kap minden erőpontja után, amellyel a páncéljához szükséges erőszinten túl rendelkezik.
actors.hero.talent.projectile_momentum.title=dobófegyver-lendület
actors.hero.talent.projectile_momentum.desc=_+1:_ Szerfutás közben a szerfutó _+50% pontossággal és +15% sebzéssel_ használhatja a dobófegyvereket.\n\n_+2:_ Szerfutás közben a szerfutó _+100% pontossággal és +30% sebzéssel_ használhatja a dobófegyvereket.\n\n_+3:_ Szerfutás közben a szerfutó _+150% pontossággal és +45% sebzéssel_ használhatja a dobófegyvereket.
actors.hero.talent.speedy_stealth.title=sebes lopakodás
actors.hero.talent.speedy_stealth.desc=_+1:_ Ha a szerfutó láthatatlan, 2 egység lendületet szerez körönként.\n\n_+2:_ A +1 szint hozadékai mellett a szerfutás nem csillapodik, amíg a szerfutó láthatatlan.\n\n_+3:_ A +1 és +2 szintek hozadékai mellett a szerfutó 2x olyan gyorsan mozog, amíg láthatatlan, függetlenül attól, hogy szerfutás közben van-e vagy nem.

actors.hero.talent.hasty_retreat.title=gyors visszavonulás
actors.hero.talent.hasty_retreat.desc=_+1:_ Cikázás után a zsivány _1 kör_ sietséget és láthatatlanságot nyer.\n\n_+2:_ Cikázás után a zsivány _2 kör_ sietséget és láthatatlanságot nyer.\n\n_+3:_ Cikázás után a zsivány _3 kör_ sietséget és láthatatlanságot nyer.\n\n_+4:_ Cikázás után a zsivány _4 kör_ sietséget és láthatatlanságot nyer.
actors.hero.talent.body_replacement.title=testcsere
actors.hero.talent.body_replacement.desc=_+1:_ Cikázás után a zsivány egy fa hasonmást hagy maga után, amelynek _20 egészsége és 1-3 páncélja van_.\n\n_+2:_ Cikázás után a zsivány egy fa hasonmást hagy maga után, amelynek _40 egészsége és 2-6 páncélja van_.\n\n_+3:_ Cikázás után a zsivány egy fa hasonmást hagy maga után, amelynek _60 egészsége és 3-9 páncélja van_.\n\n_+4:_ Cikázás után a zsivány egy fa hasonmást hagy maga után, amelynek _80 egészsége és 4-12 páncélja van_.\n\nEgyszerre csak egy hasonmás lehet a kazamatában.
actors.hero.talent.shadow_step.title=árnylépés
actors.hero.talent.shadow_step.desc=_+1:_ Ha a zsivány füstbombát használ láthatatlansága alatt, azonnali hatása lesz, illetve _16%-kal kevesebb_ töltésbe kerül, azonban nem vakítja el az ellenfeleket és nem hoz működésbe más tehetségeket.\n\n_+2:_ Ha a zsivány füstbombát használ láthatatlansága alatt, azonnali hatása lesz, illetve _30%-kal kevesebb_ töltésbe kerül, azonban nem vakítja el az ellenfeleket és nem hoz működésbe más tehetségeket.\n\n_+3:_ Ha a zsivány füstbombát használ láthatatlansága alatt, azonnali hatása lesz, illetve _41%-kal kevesebb_ töltésbe kerül, azonban nem vakítja el az ellenfeleket és nem hoz működésbe más tehetségeket.\n\n_+4:_ Ha a zsivány füstbombát használ láthatatlansága alatt, azonnali hatása lesz, illetve _50%-kal kevesebb_ töltésbe kerül, azonban nem vakítja el az ellenfeleket és nem hoz működésbe más tehetségeket.

actors.hero.talent.fear_the_reaper.title=félj a kaszástól
actors.hero.talent.fear_the_reaper.desc=_+1:_ Amikor egy halálbélyeget viselő ellenfél életereje 0-ra csökken, _lerokkan_.\n\n_+2:_ Amikor egy halálbélyeget viselő ellenfél életereje 0-ra csökken, _lerokkan és megrémül_.\n\n_+3:_ Amikor egy halálbélyeget viselő ellenfél életereje 0-ra csökken, _lerokkan és megrémül_, továbbá a 3 mezőn belüli ellenségek is _lerokkannak_.\n\n_+4:_ Amikor egy halálbélyeget viselő ellenfél életereje 0-ra csökken, _lerokkan és megrémül_, továbbá a 3 nezőn belüli ellenségek is _lerokkannak és megrémülnek_.
actors.hero.talent.deathly_durability.title=halálos állóképesség
actors.hero.talent.deathly_durability.desc=_+1:_ A halálbélyeget viselő ellenfél legyőzésekor a zsivány védőburkot kap, amelynek tartóssága az ellenfél megbélyegzéskori életerejének _13%-ával_ egyezik meg.\n\n_+2:_ A halálbélyeget viselő ellenfél legyőzésekor a zsivány védőburkot kap, amelynek tartóssága az ellenfél megbélyegzéskori életerejének _25%-ával_ egyezik meg.\n\n_+3:_ A halálbélyeget viselő ellenfél legyőzésekor a zsivány védőburkot kap, amelynek tartóssága az ellenfél megbélyegzéskori életerejének _38%-ával_ egyezik meg.\n\n_+4:_ A halálbélyeget viselő ellenfél legyőzésekor a zsivány védőburkot kap, amelynek tartóssága az ellenfél megbélyegzéskori életerejének _50%-ával_ egyezik meg.
actors.hero.talent.double_mark.title=páros bélyeg
actors.hero.talent.double_mark.desc=_+1:_ A második célpontnak az elsővel egyidőben való megbélyegzése _30%-kal kevesebb_ töltésbe kerül.\n\n_+2:_ A második célpontnak az elsővel egyidőben való megbélyegzése _50%-kal kevesebb_ töltésbe kerül.\n\n_+3:_ A második célpontnak az elsővel egyidőben való megbélyegzése _65%-kal kevesebb_ töltésbe kerül.\n\n_+4:_ A második célpontnak az elsővel egyidőben való megbélyegzése _75%-kal kevesebb_ töltésbe kerül.

actors.hero.talent.shadow_blade.title=árnyékpenge
actors.hero.talent.shadow_blade.desc=_+1:_ Az árnyékklón körönként a hős sebzésének _8%_-át nyeri el, és _25% esélye_ van arra, hogy a hős fegyverének bűvöletét használja.\n\n_+2:_ Az árnyékklón körönként a hős sebzésének _16%_-át nyeri el, és _50% esélye_ van arra, hogy a hős fegyverének bűvöletét használja.\n\n_+3:_ Az árnyékklón körönként a hős sebzésének _24%_-át nyeri el, és _75% esélye_ van arra, hogy a hős fegyverének bűvöletét használja.\n\n_+4:_ Az árnyékklón körönként a hős sebzésének _32%_-át kapja, és _100% esélye_ van arra, hogy a hős fegyverének bűvöletét használja.
actors.hero.talent.cloned_armor.title=klónozott vért
actors.hero.talent.cloned_armor.desc=_+1:_ Az árnyékklón megkapja a hős páncélértékének _12%_-át, és _25% esélye_ van arra, hogy használja a hős páncéljára vésett varázsjelet.\n\n_+2:_ Az árnyékklón megkapja a hős páncélértékének _24%_-át_, és _50% esélye_ van arra, hogy használja a hős páncéljára vésett varázsjelet.\n\n_+3:_ Az árnyékklón megkapja a hős páncélértékének _36%_-át, és _75% esélye_ van arra, hogy használja a hős páncéljára vésett varázsjelet.\n\n_+4:_ Az árnyékklón megkapja a hős páncélértékének _48%_-át, és _100% esélye_ van arra, hogy használja a hős páncéljára vésett varázsjelet.
actors.hero.talent.perfect_copy.title=tökéletes másolat
actors.hero.talent.perfect_copy.desc=_+1:_ Az árnyékklón a hős maximális életerejének _10%-át_ kapja meg, és azonnal helyet tud cserélni a hőssel _1 mező_ távolságból.\n\n_+2:_ Az árnyékklón a hős maximális életerejének _20%-át_ kapja meg, és azonnal helyet tud cserélni a hőssel _2 mező_ távolságból.\n\n_+3:_ Az árnyékklón a hős maximális életerejének _30%-át_ kapja meg, és azonnal helyet tud cserélni a hőssel _3 mező_ távolságból.\n\n_+4:_ Az árnyékklón a hős maximális életerejének _40%-át_ kapja meg, és azonnal helyet tud cserélni a hőssel _4 mező_ távolságból.

#huntress
actors.hero.talent.natures_bounty.title=természet ajándéka
actors.hero.talent.natures_bounty.desc=_+1:_ A vadásznő a magas fűben elrejtve _4 bogyót_ találhat  a kazamata következő néhány emeletének felfedezése közben.\n\n_+2:_ A vadásznő a magas fűben elrejtve _6 bogyót_ találhat a kazamata következő néhány emletének felfedezése közben.\n\nA bogyók gyorsan elfogyaszthatók, egy kis jóllakottságot adnak, és tartalmazhatnak egy használható magot.
actors.hero.talent.survivalists_intuition.title=túlélő megérzése
actors.hero.talent.survivalists_intuition.desc=_+1:_ A vadásznő _3x gyorsabban_ azonosítja a dobófegyvereket.\n\n_+2:_ A vadásznő _azonnal_ azonosítja a dobófegyvereket, ha csapást mér velük.
actors.hero.talent.followup_strike.title=követő csapás
actors.hero.talent.followup_strike.desc=_+1:_ Amikor a vadásznő az íjával vagy dobófegyverrel eltalál egy ellenséget, a következő közelharci támadása _2 bónuszsebzést_ okoz annak az ellenfélnek.\n\n_+2:_ Amikor a vadásznő az íjával vagy dobófegyverrel eltalál egy ellenséget, a következő közelharci támadása _3 bónuszsebzést_ okoz annak az ellenfélnek.
actors.hero.talent.natures_aid.title=oltalmazó természet
actors.hero.talent.natures_aid.desc=_+1:_ Amikor a vadásznő látókörében valami kiváltja egy növény hatását, a vadásznő 0-2 kéregbőrpáncélt kap, amely _3 körönként_ gyengül.\n\n_+2:_ Amikor a vadásznő látókörében valami kiváltja egy növény hatását, a vadásznő 0-2 kéregbőrpáncélt kap, amely _5 körönként_ gyengül.

actors.hero.talent.invigorating_meal.title=élénkítő étel
actors.hero.talent.invigorating_meal.desc=_+1:_ Az étkezés 1 körbe telik a vadásznőnek (a bogyók azonnal elfogyasztásra kerülnek), és _1 kör sietséget_ is biztosít. \n\n_+2:_ Az étkezés 1 körbe telik a vadásznőnek (a bogyók azonnal elfogyasztásra kerülnek), és _2 kör sietséget_ is biztosít.
actors.hero.talent.liquid_nature.title=folyékony természet
actors.hero.talent.liquid_nature.desc=_+1:_ Amikor a vadásznő megiszik vagy eldob egy varázsitalt, főzetet vagy elixírt, _legfeljebb 4 mezőn fű_ hajt ki a környező területen, és a szomszédos ellenségek _1 körre_ meggyökereznek.\n\n_+2:_ Amikor a vadásznő megiszik vagy eldob egy varázsitalt, főzetet vagy elixírt, _legfeljebb 6 mezőn fű_ hajt ki a környező területen, és a szomszédos ellenségek _2 körre_ meggyökereznek.\n\nA fű mennyisége és a meggyökerezés időtartama megduplázódik, ha erő- vagy tapasztalatitalokat, illetve, ha ezekből alkímiával előállítható tárgyakat használ.\n\nHa olyan alkímiával előállítható tárgyról van szó, amelyiknek az elkészítésekor több darab készül egyszerre (pl. vizes főzet), e tehetség véletlenszerűen fejti ki hatását, aminek valószínűsége függ az adott tárgyból előállított mennyiségtől.
actors.hero.talent.rejuvenating_steps.title=éltető léptek
actors.hero.talent.rejuvenating_steps.desc=_+1:_ Ahol a vadásznő felperzselt vagy rövid fűre lép, magas fű szökken szárba, amelybe a vadásznő rögtön ösvényt barázdál. Ezt a képességet _10 kör múlva használhatod ismét_.\n\n_+2:_ Ahol a vadásznő felperzselt vagy rövid fűre lép, magas fű szökken szárba, amelybe a vadásznő rögtön ösvényt barázdál. Ezt a képességet _5 kör múlva használhatod ismét_.\n\nEz a tehetség ösvényekkel barázdált füvet növeszt, ha a természetes gyógyító hatások nem engedélyezettek, vagy a hős már régóta nem szerzett tapasztalatpontot.
actors.hero.talent.heightened_senses.title=felfokozott érzékek
actors.hero.talent.heightened_senses.desc=_+1:_ A vadásznő belső szemével lát minden karaktert _2 mezőre a pozíciójától_.\n\n_+2:_ A vadásznő belső szemével lát minden karaktert _3 mezőre a pozíciójától_.
actors.hero.talent.durable_projectiles.title=tartós dobófegyverek
actors.hero.talent.durable_projectiles.desc=_+1:_ A dobófegyverek _+50%-kal tartósabbak_, ha a vadásznő használja.\n\n_+2:_ A dobófegyverek _+75%-kal tartósabbak_, ha a vadásznő használja.

actors.hero.talent.point_blank.title=közvetlen közeli célpont
actors.hero.talent.point_blank.desc=_+1:_ Ha a vadásznő az íját vagy egy dobófegyvert használ közelharci hatótávolságban, akkor -50% helyett _-25% lesz annak pontossága_.\n\n_+2:_ Ha a vadásznő az íját vagy egy dobófegyvert használ közelharci hatótávolságban, akkor -50% helyett _normál lesz annak pontossága_.\n\n_+3:_ Ha a vadásznő az íját vagy egy dobófegyvert használ közelharci hatótávolságban, akkor -50% helyett _+25% lesz annak pontossága_.\n\nNe feledd, hogy a dobófegyverek és a lélekíj pontossága +50%, ha nagyobb távolságból használod.
actors.hero.talent.seer_shot.title=látnoki lövés
actors.hero.talent.seer_shot.desc=_+1:_ Amikor a vadásznő nyilat lő a földbe, akkor a becsapódás helye körüli 3x3 területet _5 körig_ látni fogja. 20 kör múlva használhatod újra ezt a képességet.\n\n_+2:_ Amikor a vadásznő nyilat lő a földbe, akkor a becsapódás helye körüli 3x3 területet _10 körig_ látni fogja. 20 kör múlva használhatod újra ezt a képességet.\n\n_+3:_ Amikor a vadásznő nyilat lő a földbe, akkor a becsapódás helye körüli 3x3 területet _15 körig_ látni fogja. 20 kör múlva használhatod újra ezt a képességet.
actors.hero.talent.seer_shot.meta_desc=_Ha ezt a tehetséget egy másik hős kapja meg_, akkor bármelyik dobófegyverrel kiváltható.

actors.hero.talent.farsight.title=messzelátás
actors.hero.talent.farsight.desc=_+1:_ Az orvlövész látótávolsága _25%-kal nő_.\n\n_+2:_ Az orvlövész látótávolsága _50%-kal nő_.\n\n_+3:_ Az orvlövész látótávolsága _75%-kal nő_.
actors.hero.talent.shared_enchantment.title=megosztott bűvölet
actors.hero.talent.shared_enchantment.desc=_+1:_ A dobófegyverek _33% eséllyel_ kiváltják az orvlövész íjának bűvöletét.\n\n_+2:_ A dobófegyverek _67% eséllyel_ kiváltják az orvlövész íjának bűvöletét.\n\n_+3:_ A dobófegyverek _100% eséllyel_ kiváltják az orvlövész íjának bűvöletét.\n\nAz íj bűvölete a dobófegyver már meglévő bűvölete mellett is aktiválódhat.
actors.hero.talent.shared_upgrades.title=megosztott fejlesztések
actors.hero.talent.shared_upgrades.desc=_+1:_ Amikor az orvlövész fejlesztett dobófegyverrel támad, minden fejlettségi szint 1 körrel növeli az orvlövész jelének időtartamát 1 körrel, és a különleges támadásának sebzését _16%-kal_ maximum _2 körön át és +33% sebzésig +2 szinten_.\n\n_+2:_ Amikor az orvlövész fejlesztett dobófegyverrel támad, minden fejlettségi szint 1 körrel növeli az orvlövész jelének időtartamát 1 körrel, és a különleges támadásának sebzését _16%-kal_ maximum _4 körön át és +67% sebzésig +4 szinten_.\n\n_+3:_ Amikor az orvlövész fejlesztett dobófegyverrel támad, minden fejlettségi szint 1 körrel növeli az orvlövész jelének időtartamát 1 körrel, és a különleges támadásának sebzését _16%-kal_ maximum _6 körön át és +100% sebzésig +6 szinten_.

actors.hero.talent.durable_tips.title=tartós hegyek
actors.hero.talent.durable_tips.desc=_+1:_ A vadőr által használt bevonatos dárdák _2x tartósabbak_.\n\n_+2:_ A vadőr által használt bevonatos dárdák _3x tartósabbak_.\n\n_+3:_ A vadőr által használt bevonatos dárdák _4x tartósabbak_.
actors.hero.talent.barkskin.title=kéregbőr
actors.hero.talent.barkskin.desc=_+1:_ A vadőr _a szintje 0-50%-ának_ megfelelő kéregbőrt szerez, amikor fűre lép, amely minden körben gyengül.\n\n_+2:_ A vadőr _a szintje 0-100%-ának_ megfelelő kéregbőrt szerez, amikor fűre lép, amely minden körben gyengül.\n\n_+3:_ A vadőr _a szintje 0-150%-ának_ megfelelő kéregbőrt szerez, amikor fűre lép, amely minden körben gyengül.
actors.hero.talent.shielding_dew.title=védelmező harmat
actors.hero.talent.shielding_dew.desc=_+1:_ A harmatcseppek védőburkot adhatnak a vadőrnek, amikor teljesen egészséges, legfeljebb _a maximális életerejének 20%-áig_.\n\n_+2:_ A harmatcseppek védőburkot adhatnak a vadőrnek, amikor teljesen egészséges, legfeljebb _a maximális életerejének 40%-áig_.\n\n_+3:_ A harmatcseppek védőburkot adhatnak a vadőrnek, amikor teljesen egészséges, legfeljebb _a maximális életerejének 60%-áig_.

actors.hero.talent.fan_of_blades.title=pengelegyező
actors.hero.talent.fan_of_blades.desc=_+1:_ A kísértetpengék legfeljebb _1 további célpontot_ is eltalálhatnak 50%-os sebzést okozva. A célpontnak _30 fokos_ kúp alakú támadási területen belül láthatónak kell lennie.\n\n_+2:_ A kísértetpengék legfeljebb _2 további célpontot_ is eltalálhatnak 50%-os sebzést okozva. A célpontoknak _60 fokos_ kúp alakú támadási területen belül láthatónak kell lenniük.\n\n_+3:_ A kísértetpengék legfeljebb _3 további célpontot_ is eltalálhatnak 50%-os sebzést okozva. A célpontoknak _90 fokos_ kúp alakú támadási területen belül láthatónak kell lenniük.\n\n_+4:_ A kísértetpengék legfeljebb _4 további célpontot_ is eltalálhatnak 50%-os sebzést okozva. A célpontoknak _120 fokos_ kúp alakú támadási területen belül láthatónak kell lenniük.
actors.hero.talent.projecting_blades.title=kivetüléses pengék
actors.hero.talent.projecting_blades.desc=_+1:_ A kísértetpengék _+25%-os pontossággal_ rendelkeznek, és legfeljebb _2 szilárd mezőn_ is át tudnak hatolni.\n\n_+2:_ A kísértetpengék _+50%-os pontossággal_ rendelkeznek, és legfeljebb _4 szilárd mezőn_ is át tudnak hatolni.\n\n_+3:_ A kísértetpengék _+75%-os pontossággal_ rendelkeznek, és legfeljebb _6 szilárd mezőn_ is át tudnak hatolni.\n\n_+4:_ A kísértetpengék _+100%-os pontossággal_ rendelkeznek, és legfeljebb _8 szilárd mezőn_ is át tudnak hatolni.
actors.hero.talent.spirit_blades.title=lélekpengék
actors.hero.talent.spirit_blades.desc=_+1:_ A kísértetpengék _30%-os eséllyel_ kiválthatják a lélekíj bűvöletét is.\n\n_+2:_ A kísértetpengék _60%-os eséllyel_ kiválthatják a lélekíj bűvöletét is.\n\n_+3:_ A kísértetpengék _90%-os eséllyel_ kiválthatják a lélekíj bűvöletét is.\n\n_+4:_ A kísértetpengék _100%-os eséllyel_ kiválthatják a lélekíj bűvöletét is, és a bűvöleteket _+10%-kal felerősítik_.

actors.hero.talent.growing_power.title=növekvő erő
actors.hero.talent.growing_power.desc=_+1:_ A természet erejéből származó támadási- és mozgásisebesség-fokozás _38% és 125%_ az eredeti 33% és 100% helyett.\n\n_+2:_ A természet erejéből származó támadási- és mozgásisebesség-fokozás _42% és 150%_ az eredeti 33% és 100% helyett.\n\n_+3:_ A természet erejéből származó támadási- és mozgásisebesség-fokozás _46% és 175%_ az eredeti 33% és 100% helyett.\n\n_+4:_ A természet erejéből származó támadási- és mozgásisebesség-fokozás _50% és 200%_ az eredeti 33% és 100% helyett.
actors.hero.talent.natures_wrath.title=természet haragja
actors.hero.talent.natures_wrath.desc=_+1:_ Amíg a természet ereje tart, a lélekíjjal leadott lövések _8%-os eséllyel_ kiváltanak egy véletlenszerű káros növényi hatást.\n\n_+2:_ Amíg a természet ereje tart, a lélekíjjal leadott lövések _17%-os eséllyel_ kiváltanak egy véletlenszerű káros növényi hatást.\n\n_+3:_ Amíg a természet ereje tart, a lélekíjjal leadott lövések _25%-os eséllyel_ kiváltanak egy véletlenszerű káros növényi hatást.\n\n_+4:_ Amíg a természet ereje tart, a lélekíjjal leadott lövések _33%-os eséllyel_ kiváltanak egy véletlenszerű káros növényi hatást.\n\nA növények, melyek hatása kiváltható: vakgyom, tűzvirág, jégsüveg, szomorúmoha és vihartő.
actors.hero.talent.wild_momentum.title=vad lendület
actors.hero.talent.wild_momentum.desc=_+1:_ Ha megölsz egy ellenséget a lélekíjjal, _1 körrel_ meghosszabbodik a természet erejének időtartama. Az időtartam legfeljebb _2 körrel_ hosszabbítható meg.\n\n_+2:_ Ha megölsz egy ellenséget a lélekíjjal, _2 körrel_ meghosszabbodik a természet erejének időtartama. Az időtartam legfeljebb _4 körrel_ hosszabbítható meg.\n\n_+3:_ Ha megölsz egy ellenséget a lélekíjjal, _3 körrel_ meghosszabbodik a természet erejének időtartama. Az időtartam legfeljebb _6 körrel_ hosszabbítható meg.\n\n_+4:_ Ha megölsz egy ellenséget a lélekíjjal, _4 körrel_ meghosszabbodik a természet erejének időtartama. Az időtartam legfeljebb _8 körrel_ hosszabbítható meg.

actors.hero.talent.eagle_eye.title=sasszem
actors.hero.talent.eagle_eye.desc=_+1:_ A léleksólyom látótávolsága 6 mezőről _7 mezőre_ növekszik.\n\n_+2:_ A léleksólyom látótávolsága 6 mezőről _8 mezőre_ növekszik.\n\n_+3:_ A léleksólyom látótávolsága 6 mezőről _9 mezőre_ növekszik, és _2 mezőre_ kiterjedő belső látása lesz.\n\n_+4:_ A léleksólyom látótávolsága 6 mezőről _10 mezőre_ növekszik, és _3 mezőre_ kiterjedő belső látása lesz.
actors.hero.talent.go_for_the_eyes.title=a szemére célozz
actors.hero.talent.go_for_the_eyes.desc=_+1:_ A léleksólyom támadásai _2 körre_ megvakítják az ellenséget.\n\n_+2:_ A léleksólyom támadásai _5 körre_ megvakítják az ellenséget.\n\n_+3:_ A léleksólyom támadásai _5 körre_ megvakítják, és _2 körre_ lerokkantják az ellenséget.\n\n_+4:_ A léleksólyom támadásai _5 körre_ megvakítják, és _5 körre_ lerokkantják az ellenséget.
actors.hero.talent.swift_spirit.title=fürge lélek
actors.hero.talent.swift_spirit.desc=_+1:_ A léleksólyom mozgási sebessége 2-ről _2,5 mezőre_ nő, és garantáltan kitér az ellene irányuló első _2 támadás_ elől.\n\n_+2:_ A léleksólyom mozgási sebessége 2-ről _3 mezőre_ nő, és garantáltan kitér az ellene irányuló első _4 támadás_ elől.\n\n_+3:_ A léleksólyom mozgási sebessége 2-ről _3,5 mezőre_ nő, és garantáltan kitér az ellene irányuló első _6 támadás_ elől.\n\n_+4:_ A léleksólyom mozgási sebessége 2-ről _4 mezőre_ nő, és garantáltan kitér az ellene irányuló első _8 támadás_ elől.

#duelist
actors.hero.talent.strengthening_meal.title=erőt adó étek
actors.hero.talent.strengthening_meal.desc=_+1:_  Az étkezés 3 bónuszsebzést ad a párbajhősnek a következő _2_ fizikai támadással okozott ütéséhez.\n\n_+2:_ Az étkezés 3 bónuszsebzést ad a párbajhősnek a következő _3_ fizikai támadással okozott ütéséhez.
actors.hero.talent.adventurers_intuition.title=kalandor megérzése
actors.hero.talent.adventurers_intuition.desc=_+1:_ A párbajhős _2,5x gyorsabban_ azonosítja a fegyvereket, és _1,75x gyorsabban_ a páncélokat.\n\n_+2:_ A párbajhős azonosítja a fegyvereket, _amint viseli őket_, és _2,5x gyorsabban_ azonosítja a páncélokat.
actors.hero.talent.patient_strike.title=türelmes csapás
actors.hero.talent.patient_strike.desc=_+1:_ Ha a párbajhős vár, mielőtt közelharci támadást hajtana végre, _1-2 bónuszsebzést_ okoz.\n\n_+1:_ Ha a párbajhős vár, mielőtt közelharci támadást hajtana végre, _2 bónuszsebzést_ okoz.
actors.hero.talent.aggressive_barrier.title=agresszív védőburok
actors.hero.talent.aggressive_barrier.desc=_+1:_ A párbajhős _3 védőburkot_ kap, amikor fegyveres képességet használ, és 50% életerőn vagy az alatt van.\n\n_+2:_ A párbajhős _5 védőburkot_ kap, amikor fegyveres képességet használ, és 50% életerőn vagy az alatt van.
actors.hero.talent.aggressive_barrier.meta_desc=_Ha ezt a tehetséget egy másik hős kapja meg_, akkor neki ehelyett akkor ad védőburkot, amikor közelharci támadást hajt végre alacsony életerő mellett, azonban 50 kört kell várnia, amíg újra használhatja ezt a tehetséget.

actors.hero.talent.focused_meal.title=koncentrált étkezés
actors.hero.talent.focused_meal.desc=_+1:_ Az étel elfogyasztása 1 körig tart a párbajhősnek, és _0,67 töltést_ ad a fegyvereinek.\n\n_+2:_ Az étel elfogyasztása 1 körig tart a párbajhősnek, és _1 töltést_ ad a fegyvereinek.
actors.hero.talent.focused_meal.meta_desc=_Ha ezt a tehetséget egy másik hős kapja meg_, ehelyett a következő találatkor garantált bónuszsebzést ad, amely +1 szintnél egyenlő a hős szintje/3, +2 szintnél pedig a hős szintje/2 értékkel.
actors.hero.talent.liquid_agility.title=folyékony ügyesség
actors.hero.talent.liquid_agility.desc=_+1:_ Miután varázsitalt, főzetet vagy elixírt iszik vagy dobál, a párbajozónak _3x-osára nő a kijátszása_, és _3x-osára nő a pontossága_ a következő közelharci támadásakor, ha arra 5 körön belül kerül sor.\n\n_+2:_ Miután varázsitalt, főzetet vagy elixírt iszik vagy dobál, a párbajozónak _korlátlan kijátszása_ és _korlátlan pontossága_ lesz a következő közelharci támadásakor, ha arra 5 körön belül kerül sor.\n\nEz a hatás további 1 körig és 1 támadásig tart, ha erő- vagy tapasztalatitalokat, illetve olyan alkímiával előállítható tárgyakat használ, amelyeket ezekből az italokból lehet elkészíteni.\n\nHa olyan alkímiával előállítható tárgyról van szó, amelyiknek az elkészítésekor több darab készül egyszerre (pl. vizes főzet), e tehetség véletlenszerűen fejti ki hatását, aminek valószínűsége függ az adott tárgyból előállított mennyiségtől.
actors.hero.talent.weapon_recharging.title=fegyverújratöltés
actors.hero.talent.weapon_recharging.desc=_+1:_ A párbajhős _15 körönként_ kap egy fegyvertöltést, amikor pálca- vagy ereklyetöltő hatások alatt áll.\n\n_+2:_ A párbajhős _10 körönként_ kap egy fegyvertöltést, amikor pálca- vagy ereklyetöltő hatások alatt áll.
actors.hero.talent.weapon_recharging.meta_desc=_Ha ezt a tehetséget egy másik hős kapja meg_, ehelyett +5% közelharci sebzést fog okozni újratöltéskor +1 szint esetén, vagy +7,5% közelharci sebzést +2 szint esetén.
actors.hero.talent.lethal_haste.title=végzetes sietség
actors.hero.talent.lethal_haste.desc=_+1:_ Amikor a párbajhős egy fegyveres képességgel gyilkos csapást mér egy ellenségre, _3 kör_ azonnali mozgás lesz a jutalma.\n\n_+2:_ Amikor a párbajhős egy fegyveres képességgel gyilkos csapást mér egy ellenségre, _5 kör_ azonnali mozgás lesz a jutalma.
actors.hero.talent.lethal_haste.meta_desc=_Ha ezt a tehetséget egy másik hős kapja meg_, akkor ő ehelyett a közönséges fegyveres támadásokkal váltja ki a hatást, azonban 100 kört kell várnia, amíg újra használhatja ezt a tehetséget.
actors.hero.talent.swift_equip.title=fürge felszerelkezés
actors.hero.talent.swift_equip.desc=_+1:_ A párbajhős _egy alkalommal_ azonnal kézbe tud venni egy másik fegyvert, de 20 kört kell várnia, amíg újra használhatja ezt a tehetséget.\n\n_+2:_ A párbajhős _két alkalommal_ azonnal kézbe tud venni egy másik fegyvert, de 20 kört kell várnia, amíg újra használhatja ezt a tehetséget.\n\nHa a párbajhős rendelkezik ezzel a tehetséggel, és éppen nem tart a várakozási ideje, akkor egy nem viselt fegyver gyorsrekeszen keresztüli használatakor a párbajhős azonnal kézbe veszi azt a fegyvert.

actors.hero.talent.precise_assault.title=pontos támadás
actors.hero.talent.precise_assault.desc=_+1:_ Amikor a párbajhős fegyveres képességet használ, 5 körön belül a következő közelharci támadása _2x pontosságú_ lesz.\n\n_+2:_ Amikor a párbajhős fegyveres képességet használ, 5 körön belül a következő közelharci támadása _5x pontosságú_ lesz.\n\n_+3:_ Amikor a párbajhős fegyveres képességet használ, 5 körön belül a következő közelharci támadása _korlátlan pontosságú_ lesz.
actors.hero.talent.precise_assault.meta_desc=_Ha ezt a tehetséget egy másik hős kapja meg_, akkor +1-nél 10%-kal, +2-nél 20%-kal, +3-nál 30%-kal növeli a közelharci pontosságot.
actors.hero.talent.deadly_followup.title=halálos utócsapás
actors.hero.talent.deadly_followup.desc=_+1:_ Amikor a párbajhős dobófegyverrel eltalál egy ellenséget, 5 körön keresztül _10%-kal több közelharci sebzést_ okoz neki.\n\n_+2:_ Amikor a párbajhős dobófegyverrel eltalál egy ellenséget, 5 körön keresztül _20%-kal több közelharci sebzést_ okoz neki.\n\n_+3:_ Amikor a párbajhős dobófegyverrel eltalál egy ellenséget, 5 körön keresztül _30%-kal több közelharci sebzést_ okoz neki.

actors.hero.talent.varied_charge.title=változatossági töltés
actors.hero.talent.varied_charge.desc=_+1:_ A bajnok azonnal visszanyer _0,17 fegyvertöltést_, ha két különböző fegyveres képességet használ, időkorlátozás nélkül.\n\n_+2:_ A bajnok azonnal visszanyer _0,33 fegyvertöltést_, ha két különböző fegyveres képességet használ, időkorlátozás nélkül.\n\n_+3:_ A bajnok azonnal visszanyer _0,5 fegyvertöltést_, ha két különböző fegyveres képességet használ, időkorlátozás nélkül.
actors.hero.talent.twin_upgrades.title=kettős fejlesztés
actors.hero.talent.twin_upgrades.desc=_+1:_ Ha a bajnok két viselt fegyvere közül az egyiknek alacsonyabb a fejlettségi szintje, és _a követelményszintje 2 vagy több szinttel alacsonyabb_, mint a másik fegyveré, akkor a fejlettségi szintje a másik fegyver fejlettségi szintjére emelkedik.\n\n_+2:_ Ha a bajnok két viselt fegyvere közül az egyiknek alacsonyabb a fejlettségi szintje, és _a követelményszintje 1 vagy több szinttel alacsonyabb_, mint a másik fegyveré, akkor a fejlettségi szintje a másik fegyver fejlettségi szintjére emelkedik.\n\n_+3:_ Ha a bajnok két viselt fegyvere közül az egyiknek alacsonyabb a fejlettségi szintje, és _a követelményszintje azonos vagy alacsonyabb_, mint a másik fegyveré, akkor a fejlettségi szintje a másik fegyver fejlettségi szintjére emelkedik.
actors.hero.talent.combined_lethality.title=halálos kombináció
actors.hero.talent.combined_lethality.desc=_+1:_ Ha a bajnok közelharci fegyverrel támad rögtön valamilyen más fegyver képességének használata után, akkor ez a támadás kivégez minden olyan nem főellenfelet, amelynek az _életpontja kevesebb, mint 13%_.\n\n_+2:_ Ha a bajnok közelharci fegyverrel támad rögtön valamilyen más fegyver képességének használata után, akkor ez a támadás kivégez minden olyan nem főellenfelet, amelynek az _életpontja kevesebb, mint 27%_.\n\n_+3:_ Ha a bajnok közelharci fegyverrel támad rögtön valamilyen más fegyver képességének használata után, akkor ez a támadás kivégez minden olyan nem főellenfelet, amelynek az _életpontja kevesebb, mint 40%_.\n\nA támadás lehet közönséges közelharci fegyveres támadás vagy egy fegyveres képességgel végrehajtott támadás.

actors.hero.talent.unencumbered_spirit.title=megkönnyebbült lélek
actors.hero.talent.unencumbered_spirit.desc=_+1:_ A szerzetes _50%-kal több energiát_ nyer minden _3-mas vagy alacsonyabb_ követelményszintű felszerelés után, amelyet visel.\n\n_+2:_ A szerzetes _75%-kal több energiát_ nyer minden _2-es vagy alacsonyabb_ követelményszintű felszerelés után, amelyet visel. A 3-as követelményszintű felszerelések előnyei nem változnak.\n\n_+3:_ A szerzetes _100%-kal több energiát_ nyer minden _1-es vagy alacsonyabb_ követelményszintű felszerelés után, amelyet visel. A 2-es és 3-as követelményszintű felszerelések előnyei nem változnak. Ezen kívül kap egy szövetpáncélt és szegecselt kesztyűt ingyen.\n\nNe feledd, hogy ez a tehetség nem jár semmilyen előnnyel, ha fegyvertelen vagy, illetve ha az Erő gyűrűjével támadsz.
actors.hero.talent.monastic_vigor.title=szerzetesi erély
actors.hero.talent.monastic_vigor.desc=_+1:_ Ha a szerzetes _100% energiával_ rendelkezik, képességei felerősödnek.\n\n_+2:_ Ha a szerzetes _legalább 80% energiával_ rendelkezik, a képességei felerősödnek.\n\n_+3:_ Ha a szerzetes _legalább 60% energiával_ rendelkezik, a képességei felerősödnek.\n\nFelerősödött állapotban:\n- A Pofonesőnél érvényesül a fegyvered bűvölete\n- Az Összpontosítás azonnali\n- A Vetődés hatótávolsága +4-gyel nő\n- A Sárkányrúgás +50% sebzést okoz, és a visszalökő és kábító hatását minden szomszédos ellenségre kiterjeszti\n- A Meditáció lassan visszagyógyítja a hiányzó életerő 20%-át, és 80%-os sérülés-ellenállást biztosít.
actors.hero.talent.combined_energy.title=kombinált energia
actors.hero.talent.combined_energy.desc=_+1:_ Ha a szerzetes 5 körön belül használ egy fegyveres képességet és egy _legalább 4 energiát_ igénylő képességet, akkor 1 elhasznált energiát visszanyer.\n\n_+2:_ Ha a szerzetes 5 körön belül használ egy fegyveres képességet és egy _legalább 3 energiát_ igénylő képességet, akkor 1 elhasznált energiát visszanyer.\n\n_+3:_ Ha a szerzetes 5 körön belül használ egy fegyveres képességet és egy _legalább 2 energiát_ igénylő képességet, akkor 1 elhasznált energiát visszanyer.

actors.hero.talent.close_the_gap.title=közelbe férkőzés
actors.hero.talent.close_the_gap.desc=_+1:_ A párbajhős a párbaj kezdetekor _legfeljebb két mező távolságot_ keresztülcikázik a célpontja felé.\n\n_+2:_ A párbajhős a párbaj kezdetekor _legfeljebb három mező távolságot_ keresztülcikázik a célpontja felé.\n\n_+3:_ A párbajhős a párbaj kezdetekor _legfeljebb négy mező távolságot_ keresztülcikázik a célpontja felé.\n\n_+4:_ A párbajhős a párbaj kezdetekor _legfeljebb öt mező távolságot_ keresztülcikázik a célpontja felé.\n\nCikázás közben át tud jutni a veszélyforásokon és az ellenségeken, de szilárd térelemeken, például falakon, nem. A cikázás figyelembe vételével kerül meghatározásra, hogy egy ellenség elég közel van-e ahhoz, hogy kihívd.
actors.hero.talent.invigorating_victory.title=élénkítő győzelem
actors.hero.talent.invigorating_victory.desc=_+1:_ Ha a párbajhős a párbaj vége előtt legyőzi célpontját, akkor _5 plusz a párbaj során elszenvedett sebzés 30%-ának megfelelő életerőt_ gyógyul.\n\n_+2:_ Ha a párbajhős a párbaj vége előtt legyőzi célpontját, akkor _10 plusz a párbaj során elszenvedett sebzés 50%-ának megfelelő életerőt_ gyógyul.\n\n_+3:_ Ha a párbajhős a párbaj vége előtt legyőzi célpontját, akkor _15 plusz a párbaj során elszenvedett sebzés 65%-ának megfelelő életerőt_ gyógyul.\n\n_+4:_ Ha a párbajhős a párbaj vége előtt legyőzi célpontját, akkor _20 plusz a párbaj során elszenvedett sebzés 75%-ának megfelelő életerőt_ gyógyul.
actors.hero.talent.elimination_match.title=kieséses mérkőzés
actors.hero.talent.elimination_match.desc=_+1:_ Ha a párbajhős a párbaj végét követő 3 körön belül újabb kihívást intéz, az a kihívás _16%-kal kevesebb_ töltést használ el.\n\n_+2:_ Ha a párbajhős a párbaj végét követő 3 körön belül újabb kihívást intéz, az a kihívás _30%-kal kevesebb_ töltést használ el.\n\n_+3:_ Ha a párbajhős a párbaj végét követő 3 körön belül újabb kihívást intéz, az a kihívás _40%-kal kevesebb_ töltést használ el.\n\n_+4:_ Ha a párbajhős a párbaj végét követő 3 körön belül újabb kihívást intéz, az a kihívás _50%-kal kevesebb_ töltést használ el.

actors.hero.talent.elemental_reach.title=elemi hatótáv
actors.hero.talent.elemental_reach.desc=_+1:_ Az elemi csapás hatótávolsága 4-ről _5 mezőre_ növekszik, szélessége pedig 65-ről _75 fokra_ növekszik.\n\n_+2:_ Az elemi csapás hatótávolsága 4-ről _6 mezőre_ növekszik, szélessége pedig 65-ről _85 fokra_ növekszik.\n\n_+3:_ Az elemi csapás hatótávolsága 4-ről _7 mezőre_ növekszik, szélessége pedig 65-ről _95 fokra_ növekszik.\n\n_+4:_ Az elemi csapás hatótávolsága 4-ről _8 mezőre_ növekszik, szélessége pedig 65-ről _105 fokra_ növekszik.
actors.hero.talent.striking_force.title=csapáserő
actors.hero.talent.striking_force.desc=_+1:_ Az elemi csapás hatásának ereje _30%-kal_ növekszik.\n\n_+2:_ Az elemi csapás hatásának ereje _60%-kal_ növekszik.\n\n_+3:_ Az elemi csapás hatásának ereje _90%-kal_ növekszik.\n\n_+4:_ Az elemi csapás hatásának ereje _120%-kal_ növekszik.
actors.hero.talent.directed_power.title=irányított energia
actors.hero.talent.directed_power.desc=_+1:_ Az elemi csapás célzott támadása _+30% bűverőt_ kap minden egyes ellenség után, aki az elemi csapás hatásának hatósugarában van, beleértve a támadás célpontját is.\n\n_+2:_ Az elemi csapás célzott támadása _+60% bűverőt_ kap minden egyes ellenség után, aki az elemi csapás hatásának hatósugarában van, beleértve a támadás célpontját is.\n\n_+3:_ Az elemi csapás célzott támadása _+90% bűverőt_ kap minden egyes ellenség után, aki az elemi csapás hatásának hatósugarában van, beleértve a támadás célpontját is.\n\n_+4:_ Az elemi csapás célzott támadása _+120% bűverőt_ kap minden egyes ellenség után, aki az elemi csapás hatásának hatósugarában van, beleértve a támadás célpontját is.

actors.hero.talent.feigned_retreat.title=színlelt visszavonulás
actors.hero.talent.feigned_retreat.desc=_+1:_ Ha egy ellenség megtámadja a párbajhős utóképét, akkor _2 kör_ sietség lesz a párbajhős jutalma.\n\n_+2:_ Ha egy ellenség megtámadja a párbajhős utóképét, akkor _4 kör_ sietség lesz a párbajhős jutalma.\n\n_+3:_ Ha egy ellenség megtámadja a párbajhős utóképét, akkor _6 kör_ sietség lesz a párbajhős jutalma.\n\n_+4:_ Ha egy ellenség megtámadja a párbajhős utóképét, akkor _8 kör_ sietség lesz a párbajhős jutalma.
actors.hero.talent.expose_weakness.title=gyenge pont kiderítése
actors.hero.talent.expose_weakness.desc=_+1:_ Azok az ellenségek, amelyek megtámadják a párbajhős utóképét, _2 körig_ gyengévé és sebezhetővé válnak.\n\n_+2:_ Azok az ellenségek, amelyek megtámadják a párbajhős utóképét, _4 körig_ gyengévé és sebezhetővé válnak.\n\n_+3:_ Azok az ellenségek, amelyek megtámadják a párbajhős utóképét, _6 körig_ gyengévé és sebezhetővé válnak.\n\n_+4:_ Azok az ellenségek, amelyek megtámadják a párbajhős utóképét, _8 körig_ gyengévé és sebezhetővé válnak.
actors.hero.talent.counter_ability.title=viszonzóképesség
actors.hero.talent.counter_ability.desc=_+1:_ Ha a párbajhős az utóképét ért támadást követő 3 körön belül fegyveres képességet használ, azonnal visszakap _0,38 töltést_.\n\n_+2:_ Ha a párbajhős az utóképét ért támadást követő 3 körön belül fegyveres képességet használ, azonnal visszakap _0,77 töltést_.\n\n_+3:_ Ha a párbajhős az utóképét ért támadást követő 3 körön belül fegyveres képességet használ, azonnal visszakap _1,13 töltést_.\n\n_+4:_ Ha a párbajhős az utóképét ért támadást követő 3 körön belül fegyveres képességet használ, azonnal visszakap _1,5 töltést_.

#cleric
actors.hero.talent.satiated_spells.title=Laktató varázsigék
actors.hero.talent.satiated_spells.desc=_+1:_ Miután a térítő evett, a következő varázsige elmondásakor _3 védőburkot_ kap.\n\n_+2:_ Miután a térítő evett, a következő varázsige elmondásakor _5 védőburkot_ kap.
actors.hero.talent.satiated_spells.meta_desc=_Ha ezt a tehetséget egy másik hős kapja meg_, akkor azonnal pajzsot biztosít, amely 10 kör után természetes módon véget ér.
actors.hero.talent.holy_intuition.title=szent megérzés
actors.hero.talent.holy_intuition.desc=_+1:_ A térítő elmondhatja a _szent megérzés_ varázsigéjét, amely _3 töltés_ árán felfedi, ha egy tárgy átkozott.\n\n_+2:_ A térítő elmondhatja a _szent megérzés_ varázsigéjét, amely _2 töltés_ árán felfedi, ha egy tárgy átkozott.
actors.hero.talent.holy_intuition.meta_desc=_Ha ezt a tehetséget egy másik hős kapja meg_, akkor lehetővé teszi a hős számára, hogy az elátkozott tárgyakat közvetlenül a viselésük előtt azonosítsa, az esetek 15%-ában +1 szinten, illetve az esetek 25%-ában +2 szinten.
actors.hero.talent.searing_light.title=perzselő fény
actors.hero.talent.searing_light.desc=_+1:_ A térítő fizikai támadásai a _vezérfény_ által megvilágított ellenségek ellen _+3 sebzést_ okoznak.\n\n_+2:_ A térítő fizikai támadásai a _vezérfény_ által megvilágított ellenségek ellen _+5 sebzést_ okoznak.
actors.hero.talent.searing_light.meta_desc=_Ha ezt a tehetséget egy másik hős kapja meg_, akkor bónusz sebzést biztosít, miután egy pálcát vagy egy ereklyét használnak egy ellenségen, 20 körös lehűlési idővel.
actors.hero.talent.shield_of_light.title=fénypajzs
actors.hero.talent.shield_of_light.desc=_+1:_ A térítő elmondhatja a _fénypajzs_ varázsigét, amelynek nincs időigénye, és _2-4 páncélzatot_ biztosít egy ellenséggel szemben 5 körig 1 töltés árán.\n\n_+2:_ A térítő elmondhatja a _fénypajzs_ varázsigét, amelynek nincs időigénye, és _3-6 páncélzatot_ biztosít egy ellenséggel szemben 5 körig 1 töltés árán.
actors.hero.talent.shield_of_light.meta_desc=_Ha ezt a tehetséget egy másik hős kapja meg_, akkor a megcélzott ellenség által okozott fizikai sebzést csökkenti 1-gyel, az esetek 33%-ában +1 szinten, illetve az esetek 50%-ában +2 szinten.

actors.hero.talent.enlightening_meal.title=Megvilágosodás étke
actors.hero.talent.enlightening_meal.desc=_+1:_ Az étel elfogyasztása 1 körig tart a térítőnek, és _0,67 töltést_ ad a szentkönyvének.\n\n_+2:_ Az étel elfogyasztása 1 körig tart a térítőnek, és _1 töltést_ ad a szentkönyvének.
actors.hero.talent.enlightening_meal.meta_desc=_Ha ezt a tehetséget egy másik hős kapja meg_, akkor 2 kör pálca- és ereklyetöltést biztosít +1 szinten, illetve 3 körre +2 szinten. Ez nem használható arra, hogy a bőségszaru újratöltődjön.
actors.hero.talent.recall_inscription.title=Jelismétlés
actors.hero.talent.recall_inscription.refunded=A tárgyad ára megtérült!
actors.hero.talent.recall_inscription.desc=_+1:_ A térítő elmondhatja a _jelismétlés_ varázsigéjét, amely lehetővé teszi számára, hogy megismételje az elmúlt _10 körben_ utoljára használt rúnakő vagy tekercs hatását.\n\n_+2:_ A térítő elmondhatja a _jelismétlés_ varázsigéjét, amely lehetővé teszi számára, hogy megismételje az elmúlt _300 körben_ utoljára használt rúnakő vagy tekercs hatását.\n\nA jelismétlés varázsige nem használható a fejlesztéstekercshez. E varázsige eltérő mennyiségű töltésbe kerül, attól függően, hogy milyen tárgyat használtál utoljára: rúnakő esetén 2, tekercs esetén 3, egzotikus tekercs esetén 4. A töltésfelhasználása kétszer akkora, ha átváltoztatótekercs vagy olyan alkímiával előállítható tárgy hatását másolja, amelynek az elkészítéséhez átváltoztató- vagy fejlesztéstekercsre van szükség.
actors.hero.talent.recall_inscription.meta_desc=_Ha ezt a tehetséget egy másik hős kapja meg_, akkor bármilyen tekercset vagy rúnakövet az esetek 10%-ában +1 szinten, illetve 15%-ában +2 szinten. A fejlesztéstekercsekre ez a hatás nem érvényes.
actors.hero.talent.sunray.title=Napsugár
actors.hero.talent.sunray.desc=_+1:_ A térítő elmondhatja a _napsugár_ varázsigét, amely _4-8 sebzést_ okoz, és _4 körig_ elvakítja a célpontot, 1 töltés árán.\n\n_+2:_ A térítő elmondhatja a _napsugár_ varázsigét, amely _6-12 sebzést_ okoz, és _6 körig_ elvakítja a célpontot, 1 töltés árán.\n\nA napsugár varázsigéje minden célpontot csak egyszer képes elvakítani, de ha már a napsugár által el van vakítva a célpont, akkor viszont lebénítja. A napsugár varázsige mindig a legmagasabb sebzést okozza a démoni és élőhalott célpontoknak.
actors.hero.talent.sunray.meta_desc=_Ha ezt a tehetséget egy másik hős kapja meg_, akkor a pálcák és az ereklyék 4 körre megvakítják az ellenséget, az esetek 15%-ában +1 szinten, illetve 25%-ában +2 szinten.
actors.hero.talent.divine_sense.title=Isteni sugallat
actors.hero.talent.divine_sense.desc=_+1:_ A térítő elmondhatja az _isteni sugallat_ varázsigét, amely 50 körig _8 mező_ hatósugarú belső látást biztosít neki, 2 töltés árán, és nem vesz igénybe időt az elmondása.\n\n_+2:_ A térítő elmondhatja az _isteni sugallat_ varázsigét, amely 50 körig _12 mező_ hatósugarú belső látást biztosít neki, 2 töltés árán, és nem vesz igénybe időt az elmondása.
actors.hero.talent.divine_sense.meta_desc=_Ha ezt a tehetséget egy másik hős kapja meg_, akkor egy rövid pillanatra belső látást biztosít neki egy pálca vagy ereklye használata után, amelynek hatótávolsága 3 mező +1 szinten, illetve 5 mező +2 szinten.
actors.hero.talent.bless.title=Áldás
actors.hero.talent.bless.desc=_+1:_ A térítő elmondhatja az _áldás_ varázsigét, amely _6 körig áldást és 10 védőburkot_ biztosít számára, amikor önmagán használja, vagy _10 körig áldást és 10 életpontos gyógyítást_ ad egy másik karakternek, 1 töltés árán.\n\n_+2:_ A térítő elmondhatja az _áldás_ varázsigét, amely _10 körig áldást és 15 védőburkot_ biztosít számára, amikor önmagán használja, vagy _15 körig áldást és 15 életpontos gyógyítást_ ad egy másik karakternek, 1 töltés árán.\n\nA hiányzó életerőn felüli pontok védőburokká alakulnak.
actors.hero.talent.bless.meta_desc=_Ha ezt a tehetséget egy másik hős kapja meg_, akkor a pontosságot és a kitérést növeli a hős és az összes szövetségese számára 3%-kal +1 szinten, illetve 5%-kal +2 szinten.

actors.hero.talent.cleanse.title=Megtisztítás
actors.hero.talent.cleanse.desc=_+1:_ A térítő elmondhatja a _megtisztítás_ varázsigét, _eltávolítja a káros hatásokat_ a térítőről és a közelében lévő szövetségesekről, _10 védőburkot_ biztosít neki, 2 töltés árán.\n\n_+2:_ A térítő elmondhatja a _megtisztítás_ varázsigét, _3 körig tartó immunitást biztosít a káros hatások ellen_ a térítőnek és a közelében lévő szövetségeseknek, _20 védőburkot_ biztosít neki, 2 töltés árán.\n\n_+3:_  A térítő elmondhatja a _megtisztítás_ varázsigét, _5 körig tartó immunitást biztosít a káros hatások ellen_ a térítőnek és a közelében lévő szövetségeseknek, _30 védőburkot_ biztosít neki, 2 töltés árán.
actors.hero.talent.cleanse.meta_desc=_Ha ezt a tehetséget egy másik hős kapta meg_, akkor a pálca vagy az ereklye használata után a hősre gyakorolt negatív állapothatásokat 10/20/30%-ban megtisztítja +1/+2/+3 szint esetén.
actors.hero.talent.light_reading.title=Könnyű olvasmány
actors.hero.talent.light_reading.desc=_+1:_ Akkor is használhatja a térítő a szentkönyvét, amikor az nincs is kéznél, de ilyenkor csak _25%-os sebességgel_ töltődik újra.\n\n_+2:_ Akkor is használhatja a térítő a szentkönyvét, amikor az nincs is kéznél, de ilyenkor csak _50%-os sebességgel_ töltődik újra.\n\n_+3:_ Akkor is használhatja a térítő a szentkönyvét, amikor az nincs is kéznél, de ilyenkor csak _75%-os sebességgel_ töltődik újra.
actors.hero.talent.light_reading.meta_desc=_Ha ezt a tehetséget egy másik hős kapja meg_, akkor az összes pálca újratöltési sebességét 7/13/20%-kal növeli +1/+2/+3 szint esetén.

actors.hero.talent.holy_lance.title=Szent lándzsa
actors.hero.talent.holy_lance.desc=_+1:_ A pap elmondhatja a pusztító _szent lándzsa_ varázsigét, amely _30-55 sebzést_ okoz 4 töltés árán.\n\n_+2:_ A pap elmondhatja a pusztító _szent lándzsa_ varázsigét, amely _45-83 sebzést_ okoz 4 töltés árán.\n\n_+3:_ A pap elmondhatja a pusztító _szent lándzsa_ varázsigét, amely _60-110 sebzést_ okoz 4 töltés árán.\n\nA szent lándzsa varázsigéje mindig a legmagasabb sebzést okozza a démoni és élőhalott ellenségeknek. 30 kört kell várni a szent lándzsa varázsige ismételt elmondásai között.
actors.hero.talent.hallowed_ground.title=Megszentelt föld
actors.hero.talent.hallowed_ground.desc=_+1:_ A pap elmondhatja a _megszentelt föld_ varázsigét, amely 20 körig megszentel egy _3x3-as területet_, 2 töltés árán.\n\n_+2:_ A pap elmondhatja a _megszentelt föld_ varázsigét, amely 20 körig megszentel egy _5x5-ös területet_, 2 töltés árán.\n\n_+3:_ A pap elmondhatja a _megszentelt föld_ varázsigét, amely 20 körig megszentel egy _7x7-es területet_, 2 töltés árán.\n\nA megszentelt föld varázsigéjének elmondása után 15 életponttal gyógyulnak a szövetségesek, rövid időre meggyökereznek az ellenségek, és rövid fű sarjad. Később lassan gyógyítja a szövetségeseket, lerokkantja az ellenségeket, és a rövid fű véletlenszerűen nőni kezd. A megszentelt föld varázsige gyógítás helyett védőburkot ad a papnak. A tűz megtöri a megszentelést.
actors.hero.talent.mnemonic_prayer.title=Felidéző imádság
actors.hero.talent.mnemonic_prayer.desc=_+1:_ A pap elmondhatja a _felidéző imádság_ varázsigét, amely _3 körrel_ meghosszabbítja egy jótékony vagy káros hatás időtartamát egy szövetségesen vagy ellenségen, 1 töltés árán.\n\n_+2:_ A pap elmondhatja a _felidéző imádság_ varázsigét, amely _4 körrel_ meghosszabbítja egy jótékony vagy káros hatás időtartamát egy szövetségesen vagy ellenségen, 1 töltés árán.\n\n_+3:_ A pap elmondhatja a _felidéző imádság_ varázsigét, amely _5 körrel_ meghosszabbítja egy jótékony vagy káros hatás időtartamát egy szövetségesen vagy ellenségen, 1 töltés árán.\n\nA felidéző imádság varázsige elmondása nem kerül időbe. Ezen kívül a felidéző imádság egy éppen érvényes pozitív vagy negatív hatást csak egyszer képes meghosszabbítani, és nem képes meghosszabbítani a páncélképességek hatásait.

actors.hero.talent.lay_on_hands.title=kézrátétel
actors.hero.talent.lay_on_hands.desc=_+1:_ A rendlovag elmondhatja a _kézrátétel_ varázsigéjét, amely 1 töltés árán egy közeli karaktert azonnal _15 életponttal_ gyógyít, vagy _15 védőburkot_ ad a rendlovagnak.\n\n_+2:_ A rendlovag elmondhatja a _kézrátétel_ varázsigéjét, amely 1 töltés árán egy közeli karaktert azonnal _20 életponttal_ gyógyít, vagy _20 védőburkot_ ad a rendlovagnak.\n\n_+3:_ A rendlovag elmondhatja a _kézrátétel_ varázsigéjét, amely 1 töltés árán egy közeli karaktert azonnal _25 életponttal_ gyógyít, vagy _25 védőburkot_ ad a rendlovagnak.\n\nAz ebből a varázsigéből származó gyógyulás fölösleges része védőburokká alakul. A kézrátétel többször is elmondható,  de nem adhat egyszerre több, mint három elmondásnak megfelelő értékű védőburkot.
actors.hero.talent.aura_of_protection.title=védelemaura
actors.hero.talent.aura_of_protection.desc=_+1:_ A rendlovag elmondhatja a _védelemaura_ varázsigéjét, amely 2 töltés árán _20%-os sebzésellenállást_ biztosít a rendlovagnak és minden 2 mezőn belül lévő szövetségesének, valamint a rendlovag varázsjelének _+50%-kal megnövelt erejű_ hatását biztosítja nekik 20 körön keresztül.\n\n_+2:_ A rendlovag elmondhatja a _védelemaura_ varázsigéjét, amely 2 töltés árán _30%-os sebzésellenállást_ biztosít a rendlovagnak és minden 2 mezőn belül lévő szövetségesének, valamint a rendlovag varázsjelének _+75%-kal megnövelt erejű_ hatását biztosítja nekik 20 körön keresztül.\n\n_+3:_ A rendlovag elmondhatja a _védelemaura_ varázsigéjét, amely 2 töltés árán _40%-os sebzésellenállást_ biztosít a rendlovagnak és minden 2 mezőn belül lévő szövetségesének, valamint a rendlovag varázsjelének _+100%-kal megnövelt erejű_ hatását biztosítja nekik 20 körön keresztül.
actors.hero.talent.wall_of_light.title=fényfal
actors.hero.talent.wall_of_light.desc=_+1:_ A rendlovag elmondhatja a _fényfal_ varázsigéjét, amely 3 töltés árán egy _3 mezű szélességű_ tömör falat hoz létre a rendlovag előtt, amely eltaszítja az ellenségeket, és 20 körig tart.\n\n_+2:_ A rendlovag elmondhatja a _fényfal_ varázsigéjét, amely 3 töltés árán egy _5 mezű szélességű_ tömör falat hoz létre a rendlovag előtt, amely eltaszítja az ellenségeket, és 20 körig tart.\n\n_+3:_ A rendlovag elmondhatja a _fényfal_ varázsigéjét, amely 3 töltés árán egy _7 mezű szélességű_ tömör falat hoz létre a rendlovag előtt, amely eltaszítja az ellenségeket, és 20 körig tart.\n\nA fal létrehozható a négy fő oldal vagy a négy átlós oldal bármelyike felől. Egyszerre csak egy fal létezhet.

actors.hero.talent.divine_intervention.title=isteni közbenjárás
actors.hero.talent.divine_intervention.desc=_+1:_ Magasztos formájában a térítő elmondhatja az _isteni közbenjárás_ varázsigét, amely legfeljebb _150 védőburkot_ ad a térítőnek és minden szövetségesének, és meghosszabbítja a magasztos formát _3 körrel_.\n\n_+2:_ Magasztos formájában a térítő elmondhatja az _isteni közbenjárás_ varázsigét, amely legfeljebb _200 védőburkot_ ad a térítőnek és minden szövetségesének, és meghosszabbítja a magasztos formát _4 körrel_.\n\n_+3:_ Magasztos formájában a térítő elmondhatja az _isteni közbenjárás_ varázsigét, amely legfeljebb _250 védőburkot_ ad a térítőnek és minden szövetségesének, és meghosszabbítja a magasztos formát _5 körrel_.\n\n_+4:_ Magasztos formájában a térítő elmondhatja az _isteni közbenjárás_ varázsigét, amely legfeljebb _300 védőburkot_ ad a térítőnek és minden szövetségesének, és meghosszabbítja a magasztos formát _6 körrel_.\n\nAz isteni közbenjárás varázsigéje a szentkönyv tetemes mennyiségű, 5 töltését veszi igénybe, és csak egyszer mondható el ugyanabban a magasztos állapotban.
actors.hero.talent.judgement.title=végítélet
actors.hero.talent.judgement.desc=_+1:_ Magasztos formájában a térítő elmondhatja a _végítélet_ varázsigét, amely _10-20 sebzést_ okoz minden látható ellenségnek.\n\n_+2:_ Magasztos formájában a térítő elmondhatja a _végítélet_ varázsigét, amely _15-30 sebzést_ okoz minden látható ellenségnek.\n\n_+3:_ Magasztos formájában a térítő elmondhatja a _végítélet_ varázsigét, amely _20-40 sebzést_ okoz minden látható ellenségnek.\n\n_+4:_ Magasztos formájában a térítő elmondhatja a _végítélet_ varázsigét, amely _25-50 sebzést_ okoz minden látható ellenségnek.\n\nA végítélet varázsigéje a szentkönyv 3 töltésébe kerül. A végítélet varázsige 33% sebzést okoz minden további varázsige után, amelyet a térítő azután mondott el, hogy felvette a magasztos formáját, vagy a végítélet varázsigét legutóbbi használta.
actors.hero.talent.flash.title=villanás
actors.hero.talent.flash.desc=_+1:_ Magasztos formájában a térítő elmondhatja a _villanás_ varázsigét, amellyel legfeljebb _3 mező_ távolságra teleportálhat.\n\n_+2:_ Magasztos formájában a térítő elmondhatja a _villanás_ varázsigét, amellyel legfeljebb _4 mező_ távolságra teleportálhat.\n\n_+3:_ Magasztos formájában a térítő elmondhatja a _villanás_ varázsigét, amellyel legfeljebb _5 mező_ távolságra teleportálhat.\n\n_+4:_ Magasztos formájában a térítő elmondhatja a _villanás_ varázsigét, amellyel legfeljebb _6 mező_ távolságra teleportálhat.\n\nA villanás varázsigéje a szentkönyv 2 töltésébe kerül, amikor először mondják el ugyanabban a magasztos állapotban, majd minden használatkor 1 töltéssel nő az ára.

actors.hero.talent.body_form.title=testi alak
actors.hero.talent.body_form.desc=A térítő elmondhatja a _testi alak_ varázsigéjét, amivel 2 töltés árán a szentháromságba olthatja egy olyan bűvölet vagy varázsjel erejét, amelyet a térítő ebben a futamban azonosított.\n\n_+1:_ A szentháromság elmondásakor a térítő _20 körig_ részesül a választott hatásból.\n\n_+2:_ A szentháromság elmondásakor a térítő _27 körig_ részesül a választott hatásból.\n\n_+3:_ A szentháromság elmondásakor a térítő _33 körig_ részesül a választott hatásból.\n\n_+4:_ A szentháromság elmondásakor a térítő _40 körig_ részesül a választott hatásból.\n\nA szentháromságba egyszerre csak egy testi hatás oltható. A szentháromság páncéltöltésigénye magasabb, ha a választott varázsjel ritka és erőteljes.
actors.hero.talent.mind_form.title=tudati alak
actors.hero.talent.mind_form.desc=A térítő elmondhatja a _tudati alak_ varázsigéjét, amivel 3 töltés árán a szentháromságba olthatja egy olyan varázspálca vagy dobófegyver erejét, amelyet a térítő ebben a futamban használt.\n\n_+1:_ A szentháromság elmondásakor a térítő a választott tárgy _+3_ szintűnek megfelelő, lövéskor vagy dobáskor érvényesülő hatását használhatja.\n\n_+2:_ A szentháromság elmondásakor a térítő a választott tárgy _+4_ szintűnek megfelelő, lövéskor vagy dobáskor érvényesülő hatását használhatja.\n\n_+3:_ A szentháromság elmondásakor a térítő a választott tárgy _+5_ szintűnek megfelelő, lövéskor vagy dobáskor érvényesülő hatását használhatja.\n\n_+4:_ A szentháromság elmondásakor a térítő a választott tárgy _+6_ szintűnek megfelelő, lövéskor vagy dobáskor érvényesülő hatását használhatja.\n\nA szentháromságba egyszerre csak egy tudati hatás oltható.
actors.hero.talent.spirit_form.title=lelki alak
actors.hero.talent.spirit_form.desc=A térítő elmondhatja a _szellemi alak_ varázsigéjét, amivel 4 töltés árán a szentháromságba olthatja egy olyan gyűrű vagy ereklye erejét, amelyet a térítő ebben a futamban azonosított (a szentkönyv kivételével).\n\n_+1:_ A szentháromság elmondásakor a térítő a gyűrű _+1_ szintűnek megfelelő hatását élvezheti 20 körig, vagy kiválthatja egy ereklye _+4_ szintűnek megfelelő hatását.\n\n_+2:_ A szentháromság elmondásakor a térítő a gyűrű _+2_ szintűnek megfelelő hatását élvezheti 20 körig, vagy kiválthatja egy ereklye _+6_ szintűnek megfelelő hatását.\n\n_+3:_ A szentháromság elmondásakor a térítő a gyűrű _+3_ szintűnek megfelelő hatását élvezheti 20 körig, vagy kiválthatja egy ereklye _+8_ szintűnek megfelelő hatását.\n\n_+4:_ A szentháromság elmondásakor a térítő a gyűrű _+4_ szintűnek megfelelő hatását élvezheti 20 körig, vagy kiválthatja egy ereklye _+10_ szintűnek megfelelő hatását.\n\nA szentháromságba egyszerre csak egy lelki hatás oltható. Az ereklyéknek változatos a hatásuk és a páncéltöltésigényük, amikor a szentháromság váltja ki a hatásukat.

actors.hero.talent.beaming_ray.title=sugárnyaláb
actors.hero.talent.beaming_ray.desc=A térítő 1 töltés árán rá tudja mondani a _sugárnyaláb_  varázsigét egy felerősített szövetségesére. Ez a sugárnyaláb képes áthatolni a falakon, és teleportálja a szövetségest egy célzott helyre. Ha az adott helyen ellenség tartózkodik, a szövetséges megjelenik az ellenség mellett, és célba veszi azt. A sugárnyaláb még a normálisan mozdulatlan szövetségeseket is teleportálhatja, de ekkor a hatótávolsága a felére csökken.\n\n_+1:_ A sugárnyaláb maximális hatótávolsága _4 mező_, és 10 körön keresztül _+35%-os sebzésre_ növeli a közösség erejének bónuszát a legközelebbi ellenség ellen.\n\n_+2:_ A sugárnyaláb maximális hatótávolsága _8 mező_, és 10 körön keresztül _+40%-os sebzésre_ növeli a közösség erejének bónuszát a legközelebbi ellenség ellen.\n\n_+3:_ A sugárnyaláb maximális hatótávolsága _12 mező_, és 10 körön keresztül _+45%-os sebzésre_ növeli a közösség erejének bónuszát a legközelebbi ellenség ellen.\n\n_+4:_ A sugárnyaláb maximális hatótávolsága _16 mező_, és 10 körön keresztül _+50%-os sebzésre_ növeli a közösség erejének bónuszát a legközelebbi ellenség ellen.
actors.hero.talent.life_link.title=életerőkapocs
actors.hero.talent.life_link.desc=A térítő 2 töltés árán _életerőkapcsot_ varázsolhat saját maga és egy megerősített szövetségese közé. A varázslat hatására a sebzés megoszlik a térítő és a szövetségese között, és a 3-as követelményszintű vagy alacsonyabb szintű jótékony térítői varázslatok mindkettőjükre érvényesek, úgy, mintha csak az egyikükre alkalmazták volna.\n\n_+1:_ Az életerőkapocs _10 körön_ át tart, és a közösség erejének  bónusz _sebzéscsökkentését -35%-ra növeli_.\n\n_+2:_ Az életerőkapocs _13 körön_ át tart, és a közösség erejének bónusz _sebzéscsökkentését -40%-ra növeli_.\n\n_+3:_ Az életerőkapocs _17 körön_ át tart, és a közösség erejének bónusz _sebzéscsökkentését -45%-ra növeli_.\n\n_+4:_ Az életerőkapocs _20 körön_ át tart, és a közösség erejének bónusz _sebzéscsökkentését -50%-ra növeli_.
actors.hero.talent.stasis.title=Sztázis
actors.hero.talent.stasis.desc=A térítő 2 töltés árán _sztázist_ varázsolhat egy felerősített szövetségesre. A sztázis ideiglenesen eltávolítja a szövetségest a kazamatából, és megőrzi az összes hatás hátralévő idejét, beleértve a közösség erejét is. A szövetséges újra megjelenik, amikor a hatás véget ér. A sztázis azonnal és költség nélkül újra előhívható, hogy a hatás idő előtt véget érjen. A sztázis mozdulatlan szövetségeseken is működik, de nem tudja őket mozgatni a kazamata szintjei között.\n\n_+1:_ A sztázis legfeljebb _60 körön át tart.\n\n_+2:_ A sztázis legfeljebb _90 körön át tart.\n\n_+3:_ A sztázis maximum _120 körön át tart.\n\n_+4:_ A sztázis legfeljebb _150 körön át tart._\n\nA térítő el tudja mondani a sugárnyaláb varázsigét, ha egy szövetségese sztázisban van, hogy újra megidézze őt, vagy alkalmazhatja az életerőkapcsot előzetesen, hogy hatását már előre kifejtse. Azonban a szövetségesek nem részesülnek az életerőkapocs hatásából, amíg sztázisban vannak.


#universal
actors.hero.talent.heroic_energy.title=hősi energia
actors.hero.talent.heroic_energy.rat_title=hörcshősi energia
actors.hero.talent.heroic_energy.desc=_+1:_ A hősi páncél képességének _12%-kal csökken_ a töltési költsége.\n\n_+1:_ A hősi páncél képességének _23%-kal csökken_ a töltési költsége.\n\n_+1:_ A hősi páncél képességének _32%-kal csökken_ a töltési költsége.\n\n_+1:_ A hősi páncél képességének _40%-kal csökken_ a töltési költsége.

actors.hero.talent.ratsistance.title=rágcsállóság
actors.hero.talent.ratsistance.desc=_+1:_ Ellenséges patkányosított ellenfeleid _-10% sebzést_ okoznak.\n\n_+2:_ Ellenséges patkányosított ellenfeleid _-19% sebzést_ okoznak.\n\n_+3:_ Ellenséges patkányosított ellenfeleid _-27% sebzést_ okoznak.\n\n_+4:_ Ellenséges patkányosított ellenfeleid _-35% sebzést_ okoznak.
actors.hero.talent.ratlomacy.title=rágcsálomácia
actors.hero.talent.ratlomacy.desc=_+1:_ Továbbpatkányosíthatod a patkányosított ellenfeleket, miáltal barátságossá válnak, és végleg patkányok maradnak.\n\n_+2:_ Továbbpatkányosíthatod a patkányosított ellenfeleket, miáltal barátságossá válnak, végleg patkányok maradnak, és _2 kör_ adrenalint is kapnak.\n\n_+3:_ Továbbpatkányosíthatod a patkányosított ellenfeleket, miáltal barátságossá válnak, végleg patkányok maradnak, és _4 kör_ adrenalint is kapnak.\n\n_+4:_ Továbbpatkányosíthatod a patkányosított ellenfeleket, miáltal barátságossá válnak, végleg patkányok maradnak, és _6 kör_ adrenalint is kapnak.
actors.hero.talent.ratforcements.title=utánpótkánylás
actors.hero.talent.ratforcements.desc=_+1:_ A patkányosítást magadon használva _megidézel 1_ szövetséges erszényes patkányt magad mellé.\n\n_+2:_ A patkányosítást magadon használva _megidézel 2_ szövetséges erszényes patkányt magad mellé.\n\n_+3:_ A patkányosítást magadon használva _megidézel 3_ szövetséges erszényes patkányt magad mellé.\n\n_+4:_ A patkányosítást magadon használva _megidézel 4_ szövetséges erszényes patkányt magad mellé.



###npcs
actors.mobs.npcs.blacksmith.name=troll kovács
actors.mobs.npcs.blacksmith.intro_quest_warrior=Halihó, Ember! Kemény fickónak tűnsz.
actors.mobs.npcs.blacksmith.intro_quest_mage=Halihó, Ember! Okos fickónak tűnsz.
actors.mobs.npcs.blacksmith.intro_quest_rogue=Halihó, Ember! Ravasz fickónak tűnsz.
actors.mobs.npcs.blacksmith.intro_quest_huntress=Halihó, Ember! Elég gyorsnak tűnsz.
actors.mobs.npcs.blacksmith.intro_quest_duelist=Halihó, Ember! Elég bátornak tűnsz.
actors.mobs.npcs.blacksmith.intro_quest_cleric=Halihó, Ember! Elég befolyásosnak tűnsz.
actors.mobs.npcs.blacksmith.intro_quest_start=Csinálná' valami hasznosat, mi? Hát, tudok valamit, amit megtehetné'. Egy régi bánya tetejére építettem ezt a műhelyt, ahová le tudsz jutni azon a létrán ott. Fogd ezt a csákányt, és bányássz nekem _sötétaranyércet. 40 darab_ elég lesz mongyuk. A kőzet odalent jó puha, úgyhogy _némi erőfeszítéssel át tudsz majd bányászni a falakon._\n\nHogy érted, hogy hogy' fogok fizetni? Te haszonéhes...\n\nJó'van, jó'van, kovácsolhatok neked valamit. Azé' jobb, ha tudod, milyen szerencsés vagy, mer' én vagyok az egyetlen kovács a környéken.
actors.mobs.npcs.blacksmith.intro_quest_crystal=Azé' vigyázz, a bánya veszélyes egy ilyen kis emberkének, amilyen te vagy. Egy ideje már elhagyatott, és egy csomó kristály kezdett nőni benne. Fényesek, de túl törékenyek ahho', hogy bármit is érjenek, na és valami varázslatos dolog védi őket. Elég erősek, úgyhogy _vigyázz, hol bányászo'_, mer' könnyen felhívod magadra a figyelmüket.\n\nVan valahol egy _óriáskristály_ is. Az sokka' keményebb, szóva' készülj fel a harcra, ha elkezded törni. Le merném fogadni, hogy a szétzúzása lelassítja a kristályok növekedését, szóva' külön jutalmat adok érte, ha ezt sikerül megcsiná'ni.
actors.mobs.npcs.blacksmith.intro_quest_gnoll=Azé' vigyázz, a bánya veszélyes egy ilyen kis emberkének, amilyen te vagy. Néhány gnoll is akarja az aranyat, és most ész né'kü' furká'nak ott mindent. Ostoba jószágok, és a bányászásukka' mindenféle omlásokat és beomlásokat okoztak. Neked ezeken keresztü' kell majd bányászni, úgyhogy _keresd a nemrég megbolygatott sziklákat_.\n\nVan egy gnoll, én rá gyanakszok, hogy az okozza a legtöbb bajt, szerintem egy _földmágus sámán_ vagy valami ilyesmi. Külön jutalmat fizetek, ha megtalálod és megölöd, de biztos vagyok benne, hogy nem fogja hagyni magát.
actors.mobs.npcs.blacksmith.intro_quest_fungi=Azé' vigyázz, a bánya veszélyes egy ilyen kis emberkének, amilyen te vagy. Valami gombaszerű szörnyeteg burjánzik odalent. Gombaőrszemek vannak mindenfelé, amelyek roppant életveszélyesek, ha meglátnak, de legalább nem tudnak felkelni és üldözni téged. _Ne legyé' a látókörükben_, ha életbe' akarsz maradni.\n\nKülön jutalmat kapsz, ha sikerül legyőznöd a _legnagyobb gombát_, de ez komoly erőfeszítésbe fog kerülni. Több micéliumgócponthoz is kapcsolódik, amelyek a falakban rejtőznek. Ezek többségét el kell pusztítanod, mielőtt igazán kárt tehetné' benne.
actors.mobs.npcs.blacksmith.reminder=Nem látod, hogy nem érek rá? A bánya bejárata arra van.
actors.mobs.npcs.blacksmith.reminder_crystal=Hozzá' nekem annyi aranyat, amennyit csak tudsz, és próbá'd meg összetörni a nagy kristályt is.
actors.mobs.npcs.blacksmith.reminder_gnoll=Hozzá' nekem annyi aranyat, amennyit csak tudsz, és próbá'd meg megölni a gnoll földmágust is.
actors.mobs.npcs.blacksmith.reminder_fungi=Hozzá' nekem annyi aranyat, amennyit csak tudsz, és próbá'd meg megő'ni az óriásgombát is.
actors.mobs.npcs.blacksmith.lost_pick=Szórakozó' velem? Hol a csákányom?!
actors.mobs.npcs.blacksmith.quest_start_prompt=Készen á'sz, hogy lemennyé'? Addig csinájjá' helyet az aranynak, amíg még itt vagy.\n\n_Csak egysze' engedlek le oda!_
actors.mobs.npcs.blacksmith.enter_yes=Készen állok
actors.mobs.npcs.blacksmith.enter_no=Egyelőre nem
actors.mobs.npcs.blacksmith.exit_warn_none=Máris végezté'? Hisze' nincs is aranyad! _40 darabot_ kellett vó'na gyűjtened.\n\n_Ne feledd, hogy nem engedlek vissza, ha egyszer feljötté'._
actors.mobs.npcs.blacksmith.exit_warn_low=Máris végezté'? Nem úgy tűnik, mintha sok aranyad lenne. _40 darabot_ kellett vó'na gyűjtened.\n\n_Ne feledd, hogy nem engedlek vissza, ha egyszer feljötté'._
actors.mobs.npcs.blacksmith.exit_warn_med=Végezté'? Legalább talá'tá' egy kis aranyat, de azé' enné' van még több is a bányába'. _40 darabot_ kellett vó'na gyűjtened.\n\n_Ne feledd, hogy nem engedlek vissza, ha egyszer feljötté'._
actors.mobs.npcs.blacksmith.exit_warn_high=Végezté'? Látom, már van bőven aranyad, de nekem kéne' még egy kicsi. _40 darabot_ kellett vó'na gyűjtened.\n\n_Ne feledd, hogy nem engedlek vissza, ha egyszer feljötté'._
actors.mobs.npcs.blacksmith.exit_warn_full=Végezté'? Rengeteg aranyat szerezté' má', de nézd meg újra, hogy nem hagytá'-e lenn semmilyen cuccodat.\n\n_Ne feledd, hogy nem engedlek vissza, ha egyszer feljötté'._
actors.mobs.npcs.blacksmith.exit_warn_crystal=Az óriáskristály még odalent van. Külön jutalmat fizetek, ha elpusztítod.
actors.mobs.npcs.blacksmith.exit_warn_gnoll=Az a gnoll földmágus még odalenn van. Külön jutalmat fizetek, ha elpusztítod.
actors.mobs.npcs.blacksmith.exit_warn_fungi=Az az óriásgomba még odalenn van. Külön jutalmat adok, ha elpusztítod.
actors.mobs.npcs.blacksmith.exit_yes=Végeztem.
actors.mobs.npcs.blacksmith.exit_no=Egyelőre nem
actors.mobs.npcs.blacksmith.get_lost=Dó'gom van. Haggyá'!
actors.mobs.npcs.blacksmith.entrance_blocked=A lefelé vezető út el van zárva.
actors.mobs.npcs.blacksmith.cant_enter_old=Ez a terület ebben a futamban nem érhető el. Játssz egy új játékot, hogy kipróbáld az új küldetést!
actors.mobs.npcs.blacksmith.def_verb=védte
actors.mobs.npcs.blacksmith.desc=Ez a troll kovács úgy néz ki, ahogy minden troll kinéz: magas és sovány, bőre pedig mind színében, mind állagában a kőhöz hasonlít. A troll kovács aránytalanul kicsi szerszámokkal bütyköl.

actors.mobs.npcs.ghost.name=bánatos kísértet
actors.mobs.npcs.ghost.rat_1=Köszöntelek %s! Hajdan olyan voltam mint te: erős és magabiztos… amíg az egyik iszonytató szörny meg nem gyilkolt. Nem hagyhatom el ezt a helyet, amíg a bosszúm nem teljes. Öld meg a _poshadó patkányt,_ amely kioltotta az életemet!\n\nEzen az emeleten kutatja következő áldozatát, mindenfelé árasztva mocskát… _Óvakodj az áradó bűzfelhőjétől és a maró harapásától! A savat ártalmatlanítja a víz…_
actors.mobs.npcs.ghost.rat_2=Kérlek, segíts! Pusztítsd el a förtelmet…\n\n_A vízhez közel harcolj, és kerüld el a bűzt…_
actors.mobs.npcs.ghost.gnoll_1=Üdv, %s... Egykor olyan voltam mint te - erős és magabiztos... De egy körmönfont ellenfél legyőzött... Nem tudom elhagyni ezt a helyet... Amíg bosszút nem állok... Öld meg a _szélhámos gnollt,_ amely kioltotta az életemet...\n\nEz nem olyan mint a többi gnoll... Elrejtőzik és távolsági fegyvereket használ... _Vigyázz a mérgező és tüzes dárdáival, ne támadd messziről..._
actors.mobs.npcs.ghost.gnoll_2=Kérlek... Segíts... Öld meg a szélhámost...\n\n_Ne engedd, hogy eltaláljon téged... Menj közel hozzá..._
actors.mobs.npcs.ghost.crab_1=Üdv, %s... Egykor olyan voltam mint te - erős és magabiztos... Aztán egy ősi állat legyőzött... Nem tudom elhagyni ezt a helyet... Amíg bosszút nem állok... Öld meg az _óriásrákot,_ amely kioltotta az életemet...\n\nNem normális, hogy ilyen öreg... Egyetlen erős ollója van, és vastag páncélja... _Vigyázz az ollójával, ha nem leped meg őt, kivédi vele a támadásod..._
actors.mobs.npcs.ghost.crab_2=Kérlek... Segíts... Öld meg a páncélos bestiát...\n\n_Mindent kivéd... Ha észrevesz..._
actors.mobs.npcs.ghost.find_me=Köszönöm... gyere, keress meg...
actors.mobs.npcs.ghost.desc=A kísértet alig látszik. Úgy néz ki, mint egy alaktalan, szomorú arcú, halovány fényfolt.

actors.mobs.npcs.imp.name=nagyravágyó kobold
actors.mobs.npcs.imp.intro=Te ugye kalandor vagy? Imádom a kalandorokat! Mindig lehet rájuk számítani, ha meg kellene ölni valamit, nem igaz? Persze, vérdíjért cserébe ;)
actors.mobs.npcs.imp.golems_1=Nekem a _gólemek_ megölése lenne a kérésem. Tudod, egy kis üzletet szeretnék itt nyitni, de azok az ostoba gólemek nem tesznek jót az üzletnek! Nem lehet ezekkel a császkáló gránittömbökkel alkudozni, a fenébe is! Szóval kérlek, ölj meg... mondjuk _4 gólemet_, és a jutalom máris tiéd.
actors.mobs.npcs.imp.monks_1=Nekem a _szerzetesek_ megölése lenne a kérésem. Tudod, egy kis üzletet szeretnék itt nyitni, de ezek az őrültek nem vásárolnak semmit, és a többi vásárlót is elijesztik. Szóval kérlek, ölj meg... mondjuk _5 szerzetest_, és a jutalom máris a tiéd.
actors.mobs.npcs.imp.golems_2=Hogy állsz a gólemvadászattal? Ne felejtsd felvenni a fémlapokat!
actors.mobs.npcs.imp.monks_2=Nahát, még élsz! Tudtam, hogy jobban kung-fuzol, mint ők. ;) Ne felejtsd felvenni a fémlapokat!
actors.mobs.npcs.imp.cya=Minden jót, %s!
actors.mobs.npcs.imp.hey=Pszt, %s!
actors.mobs.npcs.imp.desc=A koboldok kisebb termetű démonok. Sem az erejük, sem a mágikus tehetségük nem figyelemre méltó, de eléggé okosak és barátkozók. Sok kobold szívesen él nem démoni lények között.

actors.mobs.npcs.impshopkeeper.name=nagyravágyó kobold
actors.mobs.npcs.impshopkeeper.greetings=Üdv, %s!
actors.mobs.npcs.impshopkeeper.greetings_ascent=Mit csináltál %s? Gyorsan vásárolj, ki kell jutnom innen!
actors.mobs.npcs.impshopkeeper.thief=Azt hittem, bízhatok benned!
actors.mobs.npcs.impshopkeeper.buyback=A kobold vidáman visszaadja az árut.
actors.mobs.npcs.impshopkeeper.desc=A kobold egy kis boltot állított fel a belső csarnokok határán. Jó látni egy barátságos arcot, mondjuk az árai egyáltalán nem tűnnek barátságosnak.

actors.mobs.npcs.mirrorimage.name=tükörkép
actors.mobs.npcs.mirrorimage.desc=Ez az illúzió nagyon hasonlít rád, olyan mintha még a jelenlegi fegyvered és páncélod is viselné.\n\nA tükörképek felkutatják és megtámadják az ellenségeket a leutánzott fegyverükkel, amely pont úgy viselkedik, mint a tiéd, csak kevesebb sebzést okoz. Kezdetben szinte láthatatlanok, de a támadáshoz jobban észrevehető formát kell ölteniük.\n\nMiközben a támadóerejük nagy lehet, a tükörképek nem tartósak, és amint sérülést szenvednek, elillannak.
actors.mobs.npcs.mirrorimage.discover_hint=Ezt a karaktert egy bizonyos tekercs segítségével találhatod meg.

actors.mobs.npcs.npc.discover_hint=Ezt a karaktert a kazamata egy bizonyos régiójában találhatod meg.

actors.mobs.npcs.prismaticimage.name=prizmakép
actors.mobs.npcs.prismaticimage.desc=Ez a csillámló délibáb nagyon hasonlít rád, még az éppen viselt fegyvered és páncélod is látszik rajta.\n\nA prizmaképek megpróbálják felkutatni és elvonni az ellenfelek figyelmét a fokozott védelmükkel és egészségükkel hogy téged védjenek. Bár nincs akkora támadóerejük, mint a tükörképeknek, viszont tartósabbak, és hasznosítják a páncélod előnyös tulajdonságait.\n\nHa az életerejük nullára esik le, a prizmaképek jópár kör alatt tűnnek csak el, és még így is gyógyíthatók eközben. Ha nincs ellenség, a prizmaképek elhalványodnak és visszatérnek mesterükhöz.
actors.mobs.npcs.prismaticimage.discover_hint=Ezt a karaktert egy bizonyos tekercs segítségével találhatod meg.

actors.mobs.npcs.ratking.name=patkánykirály
actors.mobs.npcs.ratking.not_sleeping=Nem alszom!
actors.mobs.npcs.ratking.what_is_it=Mi az? Nincs időm erre az ostobaságra. A királyságom ügyei nem oldódnak meg maguktól!
actors.mobs.npcs.ratking.confused=Mi a... Hol vagyok?! A királyságomnak szüksége van rám!
actors.mobs.npcs.ratking.crown_clothes=Vegyél fel valami ruhát! Így nem beszélhetsz őfelségével!
actors.mobs.npcs.ratking.crown_desc=Nahát, ezt a koronát nekem hoztad!? Sokkal fényesebbnek tűnik, mint az enyém, így kegyesen elfogadom!\n\nSőt, azt hiszem, felajánlhatok neked valamit jutalmul ezért a koronáért. Hatalmas erőt, amely egy olyan hőshöz illik, mint te vagy! Szeretnéd?
actors.mobs.npcs.ratking.crown_yes=Hát persze!
actors.mobs.npcs.ratking.crown_info=Először mondj róla többet!
actors.mobs.npcs.ratking.crown_no=Inkább nem...
actors.mobs.npcs.ratking.crown_thankyou=Hehehe, köszönöm! Most menj és tedd büszkévé a királyodat!
actors.mobs.npcs.ratking.crown_fine=Rendben! Egyébként sem akartam annyira...
actors.mobs.npcs.ratking.crown_after=Élvezed az új páncélodat? Nincs visszavétel!
actors.mobs.npcs.ratking.desc_crown=Ez a patkány egy kicsit nagyobb, mint egy átlagos erszényes patkány. Törpekirályi koronát visel a fején.
actors.mobs.npcs.ratking.desc_birthday=Ez a patkány egy kicsit nagyobb, mint egy átlagos erszényes patkány. A szokásos koronája helyett egy apró, zöld partisapkát visel. Boldog születésnapot Patkány Király!
actors.mobs.npcs.ratking.desc_winter=Ez a patkány valamivel nagyobb, mint a többi erszényes patkány, és a megszokott korona helyett egy apró ünnepi sapkát hord a fején. Kellemes Ünnepeket!
actors.mobs.npcs.ratking.desc=Ez a patkány egy kicsit nagyobb, mint egy átlagos erszényes patkány. Egy apró koronát visel a fején.
actors.mobs.npcs.ratking.discover_hint=Ezt a karaktert a kazamata egy bizonyos régiójának végén találod.

actors.mobs.npcs.sheep.name=birka
actors.mobs.npcs.sheep.baa!=Bee!
actors.mobs.npcs.sheep.baa?=Bee?
actors.mobs.npcs.sheep.baa.=Bee.
actors.mobs.npcs.sheep.baa...=Bee...
actors.mobs.npcs.sheep.def_verb=védte
actors.mobs.npcs.sheep.desc=Ez egy varázsbirka. Mi olyan varázslatos benne? Nem tudod megölni. Itt áll, üres tekintettel kérődzve, amíg varázslatos módon el nem tűnik.
actors.mobs.npcs.sheep.discover_hint=Ezt a karaktert egy bizonyos tárgy vagy csapda segítségével találhatod meg.

actors.mobs.npcs.shopkeeper.name=boltos
actors.mobs.npcs.shopkeeper.thief=Tolvaj, tolvaj!
actors.mobs.npcs.shopkeeper.warn=Vigyázz! Nem lesz több figyelmeztetés.
actors.mobs.npcs.shopkeeper.flee=A boltos elfut!
actors.mobs.npcs.shopkeeper.sell=Adj el valamit
actors.mobs.npcs.shopkeeper.talk=Beszélgetés
actors.mobs.npcs.shopkeeper.buyback=A boltos kelletlenül visszaadja az árut.
actors.mobs.npcs.shopkeeper.talk_prison_intro=Nálam minden megvan, ami egy sikeres kalandhoz szükséges!
actors.mobs.npcs.shopkeeper.talk_prison_warrior=Érdekes pecséted van, általában egyben vannak. Kegyvesztett hős vagy, vagy mi? Nos, bármit is tettél, nem az én dolgom, az érméid éppolyan jók, mint másé.
actors.mobs.npcs.shopkeeper.talk_prison_mage=Hehe, azt hiszem, láttam egy körözési plakátot a neveddel valahol a városban. Bujkálunk, bujkálunk? Ja, hogy ártatlan vagy? Persze, persze... Ne rezelj be, van jobb dolgom is, mint jelenteni téged, de ha biztosra akarsz menni, vegyél valamit!
actors.mobs.npcs.shopkeeper.talk_prison_rogue=A tolvajok céhéből jöttél, hogy megtisztítsd a területet? Ja, hogy csak vásárolni? Hát, ha már úgyis itt vagy, ölj meg néhány szörnyet. Kedvezményt pedig ne várj, jó sok védelmi pénzt fizetek nektek, mégis alig jöttök le ide, hogy megvédjetek.
actors.mobs.npcs.shopkeeper.talk_prison_huntress=Nem igen illesz ebbe a környezetbe, kisasszony. A kazamaták szűk járatai bizony nem olyanok, mint a tágas lovagtermek vagy a várost körülvevő erdők, ugye? Hehe, ó, ne is törődj a fecsegésemmel, miért nem veszel valamit?
actors.mobs.npcs.shopkeeper.talk_prison_duelist=Hát csak nem az utazó hős! Ha egy másik várost próbálsz megmenteni, akkor sok szerencsét, a veszélyek itt sokkal nagyobbak, mint a pitiáner bandák. Biztos vagyok benne, hogy jobban fogod csinálni, mint bárki más, csak próbálj meg nem meghalni a boltom előtt.
actors.mobs.npcs.shopkeeper.talk_prison_cleric=Nocsak, mi szél hozta, Őfelsége, vagy már inkább Őszentsége? Hehe, mindegy is, ez nem magának való hely, sok ember szörnyen elkeseredne, ha halálos sebet kapna. Csak hozott magával némi aranyat, miért nem vásárol valamit, ami segít megelőzni ezt?
actors.mobs.npcs.shopkeeper.talk_caves=Pénzt költeni, tovább élni.\n\nJa, és add át üdvözletemet annak a troll kovácsnak, ha látod. Emlékeztesd, hogy még mindig tartozik nekem a kalapácsért, amit múlt héten adtam el neki!
actors.mobs.npcs.shopkeeper.talk_city=Az árum biztonságban tarthat téged idelent.\n\n...És ne lézengj itt, ha kérhetem. Örökkévalóságba telt, mire a helyiek idelent békén hagytak, nem akarom, hogy bajba keverj!
actors.mobs.npcs.shopkeeper.talk_halls=Szia, különleges áraim vannak a démonvadászoknak!\n\nJa, és légy óvatos odalent! A démonokat odalent nem fogja érdekelni, hogy milyen bátor vagy. Ha meghalsz, nem tudsz visszajönni és még több pénzt költeni! ;)\n\nOlyanok-e a démonok, mint én? Hehe, egyáltalán nem. Én csak egy kis fickó vagyok, nem vagyok nagy harcos, és sikerült megőriznem az ép eszemet. A démonok odalent sokkal erősebb lények, és mindegyiküket rabszolgasorba taszította... nos... csak óvatosan odalent.
actors.mobs.npcs.shopkeeper.talk_ascent=Nem tudom, hogy mit tervezel azzal az amulettel, de én nem akarok részt venni benne. Vegyél valamit és menj tovább, mindkettőnknek el kell hagynunk ezt a helyet!
actors.mobs.npcs.shopkeeper.desc=Ez a vaskos fickó sokkal jobban illene egy nagyváros kereskedelmi negyedébe, mint egy kazamatába. Az árai megmagyarázzák, miért szeret inkább itt üzletelni.

actors.mobs.npcs.wandmaker.name=öreg pálcakészítő
actors.mobs.npcs.wandmaker.intro_warrior=Ó, helló! Milyen kellemes meglepetés, hogy egy északi harcossal találkozom egy ilyen lehangoló helyen! Elég messziről jöhettél, hogy ideérj. Ha kalandot keresel, talán van egy feladatom számodra.
actors.mobs.npcs.wandmaker.intro_rogue=Jóságos ég, megijesztettél! Nem találkoztam itt olyan banditával, aki még eszénél lett volna, te biztos a felszínről jössz! Lenne egy feladatom számodra, ha szívesen segítenél egy idegennek.
actors.mobs.npcs.wandmaker.intro_mage=Ó, üdv %s! Hallom, kis kalamajka volt közötted és a varázslóintézet között? De hagyjuk, sosem szerettem azokat a begyepesedetteket. Lenne egy feladatom számodra, ha benne vagy.
actors.mobs.npcs.wandmaker.intro_huntress=Ó, üdv, kisasszony! Kellemes meglepetés egy barátságos arcot látni idelenn, nem igaz? Valójában meg mernék rá esküdni, hogy láttam már az arcod ezelőtt, de nem tudnám megmondani, hogy hol... De hagyjuk, ha kalandért jöttél, lenne egy feladatom a számodra.
actors.mobs.npcs.wandmaker.intro_duelist=Ó, helló kisasszony! Milyen kellemes meglepetés, hogy egy ilyen lehangoló helyen egy hőssel találkozom! Ha van kedved segíteni egy öregembernek, talán van egy feladatom a számodra.
actors.mobs.npcs.wandmaker.intro_cleric=Nahát, üdvözlöm Őszentsége! Milyen kellemes meglepetés, hogy ezen a nyomasztó helyen találkoztunk! Nem szeretek tolakodónak lenni, de lenne egy feladatom a számára.
actors.mobs.npcs.wandmaker.intro_1=\n\nEgy varázspálcához szükséges ritka hozzávalóért jöttem ide, de eltévedtem, és a mágikus védőburkom gyengül. Hamarosan távoznom kell, de nem akarok elmenni úgy, hogy meg ne szerezzem, amiért idejöttem.
actors.mobs.npcs.wandmaker.intro_dust=Egy kis _hullaporra_ lenne szükségem. Ez egy különleges fajta elátkozott csontliszt, amely általában ilyen helyeken fordul elő, mint ez. Valahol kell itt lennie egy eltorlaszolt kamrának, ahol biztos van ilyen por. Légy óvatos azonban, mert a por átka meglehetősen erős: _siess vele hozzám, ahogy csak tudsz,_ és én megtisztítlak tőle.
actors.mobs.npcs.wandmaker.intro_ember=Némi _friss parázsra_ lenne szükségem egy újszülött tűzelementáltól. Az elementálok általában akkor jelennek meg, amikor valaki ellenőrizetlenül végez megidézési rituálét, szóval csak keress néhány gyertyát és egy rituáléhelyszínt, és biztos vagyok benne, hogy fel tudsz éleszteni egyet. Azért érdemes _elkerülni a bezárkózást_, miközben harcolsz ellene, vagy _tarthatsz kéznél valamilyen fagyasztó tárgyat._ Az újszülött elementálok elég erősek és kiszámíthatatlanok, de nem bírják a hideget.
actors.mobs.npcs.wandmaker.intro_berry=Ennek a börtönnek a régi vadőre gondozott egy _mállóbogyó növényt,_ és én ennek a magját keresem. Valószínűleg a növény azóta elvadult, úgyhogy a mag megszerzése nem olyan egyszerű. A kertje valahol a környéken lehet. Ha szeretnéd egy darabban megúszni, igyekezz _távol maradni az indás ostoraitól._ Csábító ötletnek tűnhet tüzet használni, de kérlek, ne tedd: megölöd vele a növényt és tönkre teszed a magjait is.
actors.mobs.npcs.wandmaker.intro_2=\n\nHa ezt megszerzed nekem, fizetségül örömmel neked adom egy szépen megmunkált varázspálcámat! Kettőt hoztam magammal, elviheted, amelyik jobban tetszik.
actors.mobs.npcs.wandmaker.reminder_dust=Mi a helyzet a hullaporral, %s? Keress torlaszokat.
actors.mobs.npcs.wandmaker.reminder_ember=Mi a helyzet azzal a parázzsal, %s? Keresned kell négy gyertyát és egy szertartási helyszínt.
actors.mobs.npcs.wandmaker.reminder_berry=Mi a helyzet a mállóbógyó magjával, %s? Keress egy növényekkel teli kamrát.
actors.mobs.npcs.wandmaker.def_verb=védte
actors.mobs.npcs.wandmaker.desc=Az idős, de még jó erőben lévő úriember arcán zavar tükröződik. Mágikus védőburok veszi körbe.



###mobs
actors.mobs.acidic.name=savas skorpió
actors.mobs.acidic.desc=Ezek az óriási pókszabású démoni teremtmények kerülik a közelharcot, inkább rokkantságot okozó recés tüskéket lőnek messziről. Ebből a példányból, úgy tűnik, maró váladék csöpög.

actors.mobs.albino.name=albínó patkány
actors.mobs.albino.desc=Ez a példány az erszényes patkányok egy ritka egyede, teljesen fehér a szőre, és recések a fogai.
actors.mobs.albino.discover_hint=Ezt az ellenséget ritkán találod meg a kazamata egy bizonyos régiójában.

actors.mobs.armoredstatue.name=páncélos szobor
actors.mobs.armoredstatue.desc=Azt hinnéd, hogy ez is csak egy a kazamata élettelen szobrai közül, de a pirosan izzó szeme árulkodó.\n\nA viselt páncélja láttán úgy tűnik, hogy kiváló kondícióban van. Lehet, hogy nehéz lesz elpusztítani.
actors.mobs.armoredstatue.desc_arm_wep=Bár maga a szobor kőből készült, de a nála lévő _%1$s_ és _%2$s_ valódinak tűnik.

actors.mobs.bandit.name=őrült bandita
actors.mobs.bandit.desc=Első osztályú tolvaj, akit az elegánsabb, lila köpenyéről lehet megismerni. Nagyobb szakértelmük ellenére ugyanúgy elvesztették az eszüket, mint a közönséges tolvajok.\n\nAmellett, hogy lopnak tőled, az őrült banditák rövid időre megvakítanak, lerokkantanak és megmérgeznek! A közönséges tolvajokhoz képest viszont sokkal nagyobb az esélye, hogy többletzsákmányt hordoznak.

actors.mobs.bat.name=vámpírdenevér
actors.mobs.bat.desc=A barlangi üregek fürge és szívós lakói sokkal veszélyesebbek, mint amilyennek látszanak. Náluk jóval nagyobb ellenfeleket is képesek legyőzni, mivel minden sikeres támadásukkal életerőt nyernek vissza.

actors.mobs.bee.name=aranyméh
actors.mobs.bee.desc_honey=Apró termetük ellenére az aranyméhek ádázul védik otthonukat. Ez az egyed megbékélt, és úgy látszik, követni szeretne téged.
actors.mobs.bee.desc=Apró termetük ellenére az aranyméhek ádázul védik otthonukat. Ez az egyed teljesen megvadult, inkább maradj távol tőle.
actors.mobs.bee.discover_hint=Ezt a karaktert egy bizonyos tárgy segítségével találhatod meg.

actors.mobs.brute.name=gnoll vadállat
actors.mobs.brute.enraged=feldühített
actors.mobs.brute.def_verb=védte
actors.mobs.brute.desc=A vadállatok a legnagyobb, legerősebb és legkeményebb gnollok. Ha halálosan megsebesülnek, vérengzésbe kezdenek, átmenetileg védőburok keletkezik körülöttük és sokkal nagyobb sebzést okoznak.
actors.mobs.brute$bruterage.name=vadállati düh
actors.mobs.brute$bruterage.desc=A gnoll vadállat haldoklik, de téged is magával akar vinni!\n\nA vadállat elpusztul, amint a védőburka elfogy, akár elmúlással, akár sérülés által. Eközben jóval erősebben támad, szóval légy óvatos!\n\nMaradék védőburok: %d.

actors.mobs.causticslime.name=maró nyálka
actors.mobs.causticslime.desc=Úgy tűnik, a lentről eredő sötét mágia beszennyezte ezt a nyálkát. Elveszítette természetes zöld színét, és maró váladék csöpög róla.
actors.mobs.causticslime.discover_hint=Ezt az ellenséget ritkán találod meg a kazamata egy bizonyos régiójában.

actors.mobs.crab.name=csatornarák
actors.mobs.crab.desc=Ezek a nagytestű rákok a csatornák táplálékláncának tetején állnak. Rendkívül gyorsak, és a vastag páncéljuk nagy erejű ütéseket is kibír.

actors.mobs.crystalguardian.name=kristály őrkatona
actors.mobs.crystalguardian.def_verb=védte
actors.mobs.crystalguardian.desc=Ezek a nagyméretű kristályos őrkatonák majdnem úgy néznének ki, mint a szobrok, ha nem lennének ragyogóan izzó szemeik. Az edzett kristály, amiből készültek, lomhává, de nagyon szívóssá teszi őket, ezért _a legjobb, ha a lehető leghosszabb ideig hagyod őket aludni a kristályfészkükben._.\n\nMéretükből adódóan a kristály őrkatonák sokkal lassabban mozognak zárt térben. Emellett olyan tartósak, hogy lehetetlen őket azonnal megölni. Le lehet őket verni és ideiglenesen mozgásképtelenné tenni, de egy kis idő múlva újra felállnak.
actors.mobs.crystalguardian.discover_hint=Ezt az ellenséget egy bizonyos küldetés során találhatod meg.

actors.mobs.crystalmimic.name=kristályláda-utánzó
actors.mobs.crystalmimic.ate=Volt nálad egy %s, amit elnyelt az utánzó!
actors.mobs.crystalmimic.escaped=A kristályláda-utánzó elmenekült!
actors.mobs.crystalmimic.desc=Az utánzók olyan mágikus teremtmények, melyek kívánságuk szerinti alakot ölthetnek. A kazamatákban szinte mindig valamilyen kincsesláda formáját választják, hogy a gyanútlan kalandorokat lépre csalják.\n\nA kristályláda-utánzók trükkösebbek, mint a közönséges rokonaik. Szeretik kerülni a harcot, miközben kirabolják az áldozataikat. Megpróbálnak eliszkolni, miután felfedezték őket, és képesek az ellenfeleiket odébtenni, ha támadnak.

actors.mobs.crystalspire.name=kristálytorony
actors.mobs.crystalspire.warning=A kristály rezeg, amikor megütöd. Ha ezt folytatod, akkor biztosan felhívod magadra a figyelmet...
actors.mobs.crystalspire.alert=A rezgés erősödik és végigdübörög az egész barlangon!
actors.mobs.crystalspire.desc=Valószínűleg ettől az óriási, különösen kemény kristályból álló toronytól származik a barlangban található összes furcsa kristályos lény. A hagyományos fegyvereid hatástalanok ellene, ezért a csákányt kell használnod, ha el akarod pusztítani.\n\n_Készülj fel alaposan, mielőtt elkezded törni!_ Egy ekkora kristályt valószínűleg sokáig tart majd kibányászni, és valószínűleg nem sikerül majd zavartalanul megtenni. Lehet, hogy maga a torony is rendelkezik valamilyen védekezőképességgel. _Talán a torony saját támadásai a csatlósai ellen fordíthatók._
actors.mobs.crystalspire.discover_hint=Ezt az ellenséget egy bizonyos küldetés során találhatod meg.

actors.mobs.crystalwisp.name=kristálytörmelék
actors.mobs.crystalwisp.beam_kill=A fénysugár megölt téged...
actors.mobs.crystalwisp.desc=Egy kis dühös, lebegő keményített kristálydarab, amely fényesen ragyog. Bár nem különösebben erősek, a kristálytörmelékek veszélyes fénysugarat lőnek rád, ha közvetlenül rád látnak.\n\nA törmelékek elég kicsik ahhoz, hogy könnyedén átjussanak a különböző kristálykitüremkedéseken, de nem képesek átlőni azokon.
actors.mobs.crystalwisp.discover_hint=Ezt az ellenséget egy bizonyos küldetés során találhatod meg.

actors.mobs.demonspawner.name=démonszaporító
actors.mobs.demonspawner.on_death=A szaporító elpusztulásával lecsökkent a démoni energia errefelé.
actors.mobs.demonspawner.desc=Ez a kavargó törpehúsból álló keverék teremti a szaggatódémonokat a területen elpusztult törpékből. A démonok nyilvánvalóan habozás nélkül bármit felhasználnak az ellenségeik ellen, amit csak találnak.\n\nRémisztő látványuk ellenére a démonszaporítók nem tudnak mozogni, és nem tudják közvetlenül megvédeni magukat. Nagy termetük miatt nehéz gyorsan elpusztítani őket sajnos, és jóval gyorsabban teremti a szaggatódémonokat is, amikor fenyegetve érzi magát. \n\n_A démonszaporítók a démoni erő valamilyen közös forrásához kapcsolódnak, amelyet talán gyengíthet az elpusztításuk._

actors.mobs.dm100.name=DM-100
actors.mobs.dm100.zap_kill=Agyoncsapott a villám...
actors.mobs.dm100.desc=A DM-100 a törpe "védelmi gép" egy korai modellje, amelyet arra terveztek, hogy megvédje a bányász törpéket a börtön alatti barlangokban. Mivel az általuk gerjesztett áramütések túl gyengének bizonyultak, ezért a fent lévő emberi városnak ajándékozták. Évekig használaton kívül maradtak, és végül utat találtak a börtönbe, ahol az igazgató kezdetben túl kegyetlennek ítélte őket a használathoz. Ahogy azonban a rabok egyre engedetlenebbek lettek, szükségessé váltak.

actors.mobs.dm200.name=DM-200
actors.mobs.dm200.vent=A DM-200 mérgező levegőt fúj!
actors.mobs.dm200.desc=A DM-200 a törpék második generációs 'védelmező gépe', amelyet az alsóbb barlangokban és a városban élő törpe bányászok védelmére fejlesztettek. Ezek jóval nagyobbak és zömökebbek, mint az elődeik, valamint pusztító hidraulikus öklökkel támadnak.\n\nA megnövelt méretük az első gyengeségük, mivel nem férnek be a keskenyebb alagutakba és ajtónyílásokba. A törpék viszont képesek voltak kompenzálni a DM-200 korlátozott mozgékonyságát azzal, hogy mérgező füstöt tud fújni a távoli vagy nem elérhető ellenfelekre.

actors.mobs.dm201.name=DM-201
actors.mobs.dm201.vent=A DM-201 elhajított egy marógránátot!
actors.mobs.dm201.desc=A törpék rövid ideig kísérleteztek azzal, hogy még inkább kiemelik a DM-200 lomhaságát, és készítettek néhány DM-modellt, amelyek teljesen helyhez kötöttek. A DM-201 egy átalakított DM-200, amely helyváltoztatásra képtelen lövegtoronyként működik. A mozgásképtelenségért cserébe a DM-201 sokkal tartósabb, és nagyobb támadóerővel rendelkezik.\n\nMivel a DM-201-nek nincs motorja, amelyből kipufogógázt eregethet, a törpék marógáz-gránátokkal szerelték fel! Mindenesetre a DM-201 körültekintően bánik ezekkel a gránátokkal, és csak akkor hajít el ilyet, amikor távolról támadják meg.

actors.mobs.dm300.name=DM-300
actors.mobs.dm300.notice=ILLETÉKTELEN BEHATOLÓ ÉSZLELVE!
actors.mobs.dm300.shield=A DM-300 energiát vesz fel a szigetelés nélküli vezetékekből, és védőburkot képez maga körül!
actors.mobs.dm300.charging=TARTÓS SÉRÜLÉS! ENERGIAOSZLOP BEKAPCSOLÁSA!
actors.mobs.dm300.charging_hint=A DM-300 sebezhetetlen, amikor energiaoszlopból töltődik!
actors.mobs.dm300.supercharged=MEGSEMMISÍTÉS! MEGSEMMISÍTÉS! MEGSEMMISÍTÉS!
actors.mobs.dm300.charge_lost=ENERGIAOSZLOP MEGSEMMISÍTVE! ÁTÁLLÁS BELSŐ ENERGIAFORRÁSRA!
actors.mobs.dm300.pylons_destroyed=RIASZTÁS! ZAVAR ÉSZLELVE AZ ELEKTROMOS HÁLÓZATBAN!
actors.mobs.dm300.rankings_desc=Összezúzta a DM-300
actors.mobs.dm300.def_verb=védte
actors.mobs.dm300.defeated=KRITIKUS SÉRÜLÉS! LEÁLLÍTÁSI KÍSÉRL-
actors.mobs.dm300.desc=A DM-300 a legnagyobb és legerősebb 'védelmező gép', amelyet a törpék valaha is építettek. Az efféle elképesztő gépezeteket bonyodalmas gyártani, ezért csak párat készítettek belőle a föld alatti metropoliszuk bejáratainak védelmezésére.\n\nFelszerelték fúvókákkal, amelyek mérgező gázt fújnak, és egy erős fúróval ami támadásra és a föld kivájására is alkalmas. A DM-300 képes továbbá az energiahálózathoz csatlakozni, hogy az erejét növelhesse.
actors.mobs.dm300.desc_supercharged=A DM-300 jelenleg teljesen feltöltött állapotban van. Most nem lehet sérülést okozni neki, és kétszer olyan gyorsan mozog! Ezen kívül a fúrója most elég gyorsan forog ahhoz, hogy _alagutat ásson a tömör kőzetbe,_ igaz, sokkal lassabban mozog, amikor ezt teszi.\n\nA DM-300-at túltöltött állapotban értelmetlen megtámadni, de _valaminek lennie kell itt, ami ellátja energiával,_ és azt megsemmisítve legyengíthető.

actors.mobs.dwarfking.name=Törpék királya
actors.mobs.dwarfking.notice=Nagyon vakmerő vagy! Fogalmad sincs, mibe avatkoztál bele!
actors.mobs.dwarfking.lifelink_1=Követelem az életerődet, szolga!
actors.mobs.dwarfking.lifelink_2=Add a véred, szolga!
actors.mobs.dwarfking.teleport_1=Intézd el, szolga!
actors.mobs.dwarfking.teleport_2=Ne hagyd nyugton, szolga!
actors.mobs.dwarfking.wave_1=Ebből elég! Támadjatok fel, szolgáim!
actors.mobs.dwarfking.wave_2=Tovább! A véretek a királyért!
actors.mobs.dwarfking.wave_3=Mihasznák! ÖLJÉTEK MEG AZONNAL!
actors.mobs.dwarfking.enraged=Nem tudsz megölni, %s. HALHATATLAN VAGYOK!
actors.mobs.dwarfking.losing=Ne! Ne tedd ezt... fogalmad sincs, mi van odalent...
actors.mobs.dwarfking.defeated=Te... mindnyájunkat kudarcra ítéltél...
actors.mobs.dwarfking.rankings_desc=Elesett a Törpék királya ellen
actors.mobs.dwarfking.desc=Sok-sok évvel ezelőtt a legnagyobb varázslók egyike a törpék udvarházában olyan titkokra lelt, amitől hihetetlen erőre tett szert élet és halál fölött is. Hamarosan kiteljesítette hatalmát, leigázta és lezüllesztette az udvar többi tagját, majd a királyát és végül minden városlakót. Mostanra már ő a király, ő uralkodik a leigázott élőhalott sokaság fölött.\n\nA törpék királya egy agresszív ellenfél, aki az élőhalott hordájával próbálja meg bekeríteni és legyőzni ellenségeit.
actors.mobs.dwarfking$dkghoul.rankings_desc=Elesett a Törpék királya ellen
actors.mobs.dwarfking$dkmonk.rankings_desc=Elesett a Törpék királya ellen
actors.mobs.dwarfking$dkwarlock.rankings_desc=Elesett a Törpék királya ellen
actors.mobs.dwarfking$dkgolem.rankings_desc=Elesett a Törpék királya ellen

actors.mobs.ebonymimic.name=ébenfekete utánzó
actors.mobs.ebonymimic.reveal=Egy utánzó volt ott!
actors.mobs.ebonymimic.hidden_name=gyanús körvonal
actors.mobs.ebonymimic.hidden_desc=Úgy tűnik, van itt valami, de szinte teljesen átlátszó.
actors.mobs.ebonymimic.desc=Az utánzók olyan mágikus teremtmények, melyek kívánságuk szerinti alakot ölthetnek. A kazamatákban szinte mindig valamilyen kincsesláda formáját választják, hogy a gyanútlan kalandorokat lépre csalják.\n\nAz ébenfekete utánzók jól rejtőzködő teremtmények, amelyek képesek szinte láthatatlanná válni. Olyan dolgoknál leselkednek, amelyeket a kalandorok nagy valószínűséggel érinteni fognak, de saját zsákmányt is tartalmaznak. Ha már felfedezték őket, nem szívósabbak a közönséges utánzóknál, de a meglepetésharapásuk pusztító erejű.
actors.mobs.ebonymimic.discover_hint=Ezt az ellenséget egy bizonyos kabalával találhatod meg.

actors.mobs.elemental$fireelemental.name=tűzelementál
actors.mobs.elemental$fireelemental.desc=Az elementálok kiszámíthatatlan teremtmények, amelyek gyakran egy félresikerült okkult varázslat eredményeként jönnek létre. Az elementálok értelmi képességei minimálisak, és általában egy meghatározott varázserő kapcsolódik hozzájuk.\n\nA tűzelementál közönséges elementálfajta, amely tüzes varázslattal sebzi ellenfeleit. Közelharcban lángba borítja a célpontját, de alkalomadtán tüzes lövedéket is képes kilőni.
actors.mobs.elemental$newbornfireelemental.name=újszülött tűzelementál
actors.mobs.elemental$newbornfireelemental.charging=Az elementál éppen feltöltődik!
actors.mobs.elemental$newbornfireelemental.desc=Az elementálok kiszámíthatatlan teremtmények, amelyek gyakran egy félresikerült okkult varázslat eredményeként jönnek létre. Az elementálok értelmi képességei minimálisak, és általában egy meghatározott varázserő kapcsolódik hozzájuk.\n\nEzt a tűzelementált csak nemrég idézték meg, de még így is nagyon veszélyes!
actors.mobs.elemental$newbornfireelemental.desc_boss=Megidézésének zavaros körülményei miatt ez az elementál csak rosszul célzott robbanásokkal képes lángot szórni, amihez egy körig tartó töltődésre van szüksége.
actors.mobs.elemental$newbornfireelemental.desc_ally=Mivel ezt az elementált varázslattal idézték meg, egy kicsit jobban tudja irányítani a lángját. Távolsági támadásokra ugyan képtelen, de közelharcban a megtámadott ellenfeleket lángra lobbantja.
actors.mobs.elemental$newbornfireelemental.discover_hint=Ezt az ellenséget egy bizonyos küldetés során találhatod meg.
actors.mobs.elemental$frostelemental.name=fagyelementál
actors.mobs.elemental$frostelemental.desc=Az elementálok kiszámíthatatlan teremtmények, amelyek gyakran egy félresikerült okkult varázslat eredményeként jönnek létre. Az elementálok értelmi képességei minimálisak, és általában egy meghatározott varázserő kapcsolódik hozzájuk.\n\nA fagyelementál közönséges elementálfajta, amely dermesztő varázslattal gyengíti az ellenfeleket. Közelharcban megdermeszti a célpontját, és alkalomadtán távolsági támadással is. Varázsereje a vízben sokkal hatásosabb.
actors.mobs.elemental$shockelemental.name=sokkoló elementál
actors.mobs.elemental$shockelemental.desc=Az elementálok kiszámíthatatlan teremtmények, amelyek gyakran egy félresikerült okkult varázslat eredményeként jönnek létre. Az elementálok értelmi képességei minimálisak, és általában egy meghatározott varázserő kapcsolódik hozzájuk.\n\nA sokkoló elementál ritkább elementálfajta, amely elektromossággal és fényvillanásokkal pusztítja ellenfeleit. Közelharcban elektromos kisülést irányít a közeli ellenfelek felé, és az elsődleges célpontnak bónuszsérülést okoz, ha vízben áll. Alkalmanként erős fényvillanást is fókuszálhat távoli célpontjaira, átmenetileg megvakítva őket.
actors.mobs.elemental$chaoselemental.name=káoszelementál
actors.mobs.elemental$chaoselemental.desc=Az elementálok kiszámíthatatlan teremtmények, amelyek gyakran egy félresikerült okkult varázslat eredményeként jönnek létre. Az elementálok értelmi képességei minimálisak, és általában egy meghatározott varázserő kapcsolódik hozzájuk.\n\nA káoszelementál ritka és veszélyes elementálfajta, amely nem kapcsolódott egyik elemhez sem. Támadáskor vad és kiszámíthatatlan varázslatot enged szabadjára.

actors.mobs.eye.name=gonosz szem
actors.mobs.eye.deathgaze_kill=A haláltekintet végzett veled...
actors.mobs.eye.desc=A gonosz szemek démoni energiából összeállt lebegő golyók. Képesek közelharcra is, de az igazi erősségük a mágiában rejlik.\n\nRövid energiagyűjtést követően a gonosz szem egy _haláltekintetnek_ nevezett pusztító energianyalábot lő ki. Minden, amire a gonosz szem rátekint, szörnyű sérülést szenved el, ezért a bölcs kalandorok ilyenkor fedezékbe sietnek.

actors.mobs.fetidrat.name=poshadó patkány
actors.mobs.fetidrat.desc=Valami nyilvánvalóan nincs rendben ezzel a patkánnyal. Zsíros, fekete szőre és foszladozó bőre nagyon más, mint az egészséges patkányoké, amelyekkel eddig találkoztál. Sápadt, zöld szeme pedig kifejezetten fenyegetővé teszi.\n\nA patkányt iszonyú bűzfelhő veszi körül, amely közelről kibírhatatlanul erős.\n\nSötét váladék csurog a patkány szájából, amely még a padlót is átmarja, viszont úgy tűnik, a víz ártalmatlanítja.
actors.mobs.fetidrat.discover_hint=Ezt az ellenséget egy bizonyos küldetés során találhatod meg.

actors.mobs.fungalcore.name=gombavelő
actors.mobs.fungalcore.desc=Ez az óriásgomba lehet a forrása a gombák összes ténykedésének a barlangban.

actors.mobs.fungalsentry.name=gombaőrszem
actors.mobs.fungalsentry.desc=Ez a különösen magas gomba védelmi pontként szolgál a barlangban élő nagyobb gombahálózat számára.\n\nMozdulatlan ugyan, de pontos méregtölteteket lő ki mindenre, ami a látóterébe kerül. Bár ezeknek a lövéseknek a közvetlen hatása meglehetősen gyenge, _halálos mennyiségű mérget tudnak felhalmozni elég hamar._ Bár meg lehet ölni, valószínűleg a legjobb elkerülni.

actors.mobs.fungalspinner.name=gombás pók
actors.mobs.fungalspinner.desc=Úgy tűnik, hogy ezt a barlangi pókot egy parazitagomba irányítja. A gomba a pók képességeit is megváltoztatta, a háló- és a méregmirigyeit a gomba szaporítására készteti.\n\nA gombás pók pókháló helyett gombaspórákat fröcsköl feléd, gombatenyészetet terjeszt, és lehet, hogy meg is gyökereztet téged. Bár mérgezni nem tud, a gombás pók sokkal jobban ellenáll a sérülésnek, amikor bármilyen gomba mellett áll.

actors.mobs.ghoul.name=törpe hullarabló
actors.mobs.ghoul.desc=Ahogyan a törpék társadalma lassan elkezdett széthullani, és a jelenlegi királyuk magához ragadta a teljes hatalmat, a gyengékkel és az ellenállókkal nem bántak kesztyűs kézzel. Ahogyan a király egyre ügyesebb lett az alattomos sötét varázslásban, ezeket a törpéket a saját akarata alá hajtotta, és mostanra már a hadseregének gyalogságához tartoznak.\n\nA hullarablók magányosan nem kifejezetten erősek, de mindig csoportokban mozognak, és ha sokan vannak, sokkal nehezebb elbánni velük. _Amikor egy hullarablót legyőztek, néhány kör után feltámad, ha egy másik hullarabló is van a közelben._

actors.mobs.gnoll.name=gnoll felderítő
actors.mobs.gnoll.desc=A gnollok hiénaszerű humanoidok. Csatornákban és földalatti börtönökben élnek, de időről időre felmerészkednek a felszínre fosztogatni. A csapataik gyakori tagjai a gnoll felderítők, akik nem olyan erősek, mint a vadállatok, és nem olyan intelligensek, mint a sámánok.

actors.mobs.gnollexile.name=száműzött gnoll
actors.mobs.gnollexile.desc=Ennek a szürke szőrű gnollnak egy nagy jel van a vállán, ami száműzöttségre utal. A gnollokat általában azért száműzik a társadalmukból, mert figyelmen kívül hagyják a parancsokat vagy megszegik a törvényeket. A száműzötteknek erőseknek és ravaszoknak kell lenniük a túléléshez, ez a gnoll úgy tűnik, tudja, hogyan kell használni a lándzsát, amit a kezében tart.
actors.mobs.gnollexile.desc_passive=_A száműzött gnoll nem készül támadásra._ Nem tűnik olyan agresszívnek, mint a többi gnoll itt, és valószínűleg nem gondolja úgy, hogy megéri veled harcolni. Hagyhatnád csak úgy a fenébe, de van egy hátizsákja, ami tele lehet hasznos tárgyakkal…
actors.mobs.gnollexile.desc_aggro=_A száműzött gnoll dühösen néz körül._ Úgy tűnik, valami mégis a harcra késztette. Vigyázz a lándzsájával!
actors.mobs.gnollexile.seen_passive=A lándzsát forgató gnoll gyanakvóan néz rád, de nem készül támadásra.
actors.mobs.gnollexile.seen_aggro=A lándzsás gnoll támadásba lendül!

actors.mobs.gnollgeomancer.name=gnoll földmágus
actors.mobs.gnollgeomancer.warning=A földmágus ébredezni kezd. Készülj fel alaposan, mielőtt folytatod!
actors.mobs.gnollgeomancer.alert=A földmágus felébredt! Az egész barlang megmozdulni látszik, ahogy elugrik, és őrült nevetést hallat!
actors.mobs.gnollgeomancer.rock_kill=A repülő szikladarab megölt téged...
actors.mobs.gnollgeomancer.rockfall_kill=A lezuhanó kövek megöltek téged...
actors.mobs.gnollgeomancer.desc=Ez a lenyűgözően magas, idősebb gnoll lehet a forrása a különböző földmágiáknak errefelé, és ő lehet a szervezője a gnollok összes tevékenységének. A környékbeli utász gnollokkal ellentétben a földmágus meglehetősen ügyesen bánik a mágiájával, és nem okozhatnak neki kárt az eldobott, vagy lezuhanó kövek. Közelharcban azonban nem tud harcolni.
actors.mobs.gnollgeomancer.desc_armor=A földmágus jelenleg egy réteg sziklapáncélba burkolózik. _Közel kell kerülnöd hozzá, és le kell róla azt verned a csákányoddal, különben addig nem tudsz kárt tenni a földmágusban._
actors.mobs.gnollgeomancer.desc_armor_sapper=_A közelben egy utász gnoll egy olyan eszközt tart a kezében, amely a földmágus sziklapáncélját erősíti. Most egyáltalán nem tudsz kárt tenni benne!_
actors.mobs.gnollgeomancer.desc_sleeping=Ezt a lenyűgözően magas gnoll földmágust egy sziklaréteg veszi körül, és majdnem úgy néz ki, mint egy szobor. Ha jobban megnézed, láthatod, hogy a szikla az idős gnoll lélegzetvételének ütemében mágikus mozgást végez. Nem lehet bántani, amíg ilyen sziklába van zárva, és úgy tűnik, hogy a szó szoros értelmében nyughelyre lelt a hantok között.\n\nA csákányoddal valószínűleg át tudod törni a sziklarétegeket, de _készülj fel alaposan a harcra, mielőtt ezt teszed._ A földmágus lehet a különböző földmozgató mágiák forrása errefelé, és az összes gnolltevékenység szervezője. _Lehet, hogy nem rossz ötlet, ha előbb legyőzöd a környéken szétszóródott gnollokat._
actors.mobs.gnollgeomancer.discover_hint=Ezt az ellenséget egy bizonyos küldetés során találhatod meg.

actors.mobs.gnollguard.name=gnoll őr
actors.mobs.gnollguard.def_verb=védte
actors.mobs.gnollguard.spear_warn=A gnoll kegyetlen ütést mér a lándzsája hegyével!
actors.mobs.gnollguard.desc=Egy nagy és kemény kinézetű gnoll, aki lándzsát és pajzsot visel, de sisak nélkül. Ezek az őrök valószínűleg kiképzés alatt álló vadállatok, akiket arra köteleztek, hogy segítsenek megvédeni a bányát a betolakodó lényektől.\n\nA gnoll őr elég erős ahhoz, hogy a lándzsát egy kézben tartsa, de nem tudja jól használni. _Meglehetősen nyílt térre van szüksége ahhoz, hogy távolról támadhasson, és észrevehetően kevesebb kárt okoz neked, ha közel kerülsz hozzá._
actors.mobs.gnollguard.desc_armor=_A közelben egy utász gnoll egy olyan eszközt tart a kezében, amely agyagpáncélt biztosít ennek az őrnek, ami erősen csökkenti a sérülést, amit elszenved._
actors.mobs.gnollguard.discover_hint=Ezt az ellenséget egy bizonyos küldetés során találhatod meg.

actors.mobs.gnollsapper.name=utász gnoll
actors.mobs.gnollsapper.desc=Egy kicsi és gyenge, de intelligens gnoll, fakó bundával és egy táskával, amely tele van különböző kütyükkel. Valószínűleg azért vannak itt, hogy segítsenek a sötét arany felkutatásában és bányászatában, de a közelben van egy őr a védelmükre. Képesek harcolni, de a támadásaik szánalmasan gyengék, nem erősebbek egy felderítő gnollénál.\n\nAhelyett, hogy közvetlenül harcolnának, az utászok inkább a környező sziklákat zúdítják ellenségeikre a különféle kütyükkel. Ők maguk azonban nem ismerik a földmozgató mágiát, így pedig valószínűleg elég nagy vakmerőség e kütyük használata. _Valószínűleg számtalan módon ellenük és az őreik ellen fordíthatók a támadásaik._
actors.mobs.gnollsapper.discover_hint=Ezt az ellenséget egy bizonyos küldetés során találhatod meg.

actors.mobs.gnolltrickster.name=szélhámos gnoll
actors.mobs.gnolltrickster.desc=Különös szerzet, még gnollmércével nézve is. Gonosz vigyorral a képén görnyed előre, szinte ringatva a vállán lévő táskát. Széles szemében félelem és izgatottság furcsa keveréke tükröződik.\n\nTáskájában eszkábált dárdák széles választéka lapul, mindegyiknek a végét különféle ártalmas anyagba mártották.
actors.mobs.gnolltrickster.discover_hint=Ezt az ellenséget egy bizonyos küldetés során találhatod meg.

actors.mobs.goldenmimic.name=aranyláda-utánzó
actors.mobs.goldenmimic.desc=Az utánzók olyan mágikus teremtmények, melyek kívánságuk szerinti alakot ölthetnek. A kazamatákban szinte mindig valamilyen kincsesláda formáját választják, hogy a gyanútlan kalandorokat lépre csalják.\n\nAz aranyláda-utánzók szívósabb utánzók, amelyek a legerősebb kalandorokat próbálják magukhoz vonzani. Értékesebb zsákmány van náluk, de sokkal erősebbek is a közönséges utánzóknál.

actors.mobs.golem.name=gólem
actors.mobs.golem.def_verb=védte
actors.mobs.golem.desc=A gólemek a törpék próbálkozásai voltak újonnan felfedezett varázslataik segítségével kiküszöbölni a törpe gépezetek korábbi hibáit. Sokkal kisebbek és hatékonyabbak, mint a DM-300, és közben továbbra is rettentő halálosak.\n\nMivel a gólemek továbbra is túl nagyok, hogy keresztül tudjanak menni a folyosókon, ezért ennek ellensúlyozására a törpék új varázslatos képességekkel vértezték fel őket. A gólemek képesek teleportálni a kamrák közt, továbbá az ellenségeket magukhoz tudják teleportálni, ha nem érik el azokat.

actors.mobs.goo.name=Ragacs
actors.mobs.goo.notice=TACCS-TACCS!
actors.mobs.goo.defeated=taccs... taccs...
actors.mobs.goo.!!!=!!!
actors.mobs.goo.pumpup=A Ragacs felpumpálja magát!
actors.mobs.goo.enraged=megvadult
actors.mobs.goo.gluuurp=TAAAAACCS!
actors.mobs.goo.rankings_desc=Elnyelte a Ragacs
actors.mobs.goo.desc=A Ragacsról keveset lehet tudni. Könnyen lehet, hogy nem is lény, hanem inkább a csatornák hitvány anyagainak összetömörülése, amely valahogyan egyszerű intelligenciát kaphatott. Akárhogy is, bizonyára a sötét mágia hívta létre a Ragacsot.\n\nKocsonyás anyaga miatt számottevő sötét energiát nyelhetett el. Már attól kiráz a hideg, hogy a közelében vagy. Ha a Ragacs meg tud támadni ezzel az energiával, nem sokáig maradsz életben.

actors.mobs.greatcrab.name=óriásrák
actors.mobs.greatcrab.noticed=A rák erős ollójával kivédi a támadást.
actors.mobs.greatcrab.def_verb=védte
actors.mobs.greatcrab.desc=Ez a rák óriási nagy, még a többi csatornarákhoz képest is. A kék páncélját repedések és kagylók borítják, ami arra utal, hogy szép kort megélt már. Lassan baktat körbe, masszív ollójával épphogy egyensúlyban tartja magát.\n\nBár a ráknak csak egy ollója van, a mérete ezért bőven kárpótolja. Ha veszélyt lát, az ollóját maga elé tartja, így áthatolhatatlan páncélfalba burkolja magát. Ennek ellenére a rák nem tud védekezni az ellen, amit nem vesz észre, vagy amikor több ellenfél támadja egyidejűleg.
actors.mobs.greatcrab.discover_hint=Ezt az ellenséget egy bizonyos küldetés során találhatod meg.

actors.mobs.guard.name=börtönőr
actors.mobs.guard.scorpion=Idejössz!
actors.mobs.guard.def_verb=védte
actors.mobs.guard.desc=Ezek az őrök, a börtön egykori felügyelői, már régóta nem különböznek a foglyoktól. Csoszognak, akár a zombik, üres tekintettel járva a termeket keresnek bármit, ami nincs a helyén - mint például te!\n\nLáncot hordanak a csípőjük körül, amit talán arra használnak, hogy közel húzzák magukhoz az ellenséget.

actors.mobs.hermitcrab.name=remeterák
actors.mobs.hermitcrab.def_verb=védte
actors.mobs.hermitcrab.desc=Valamiért ez a csatornarák úgy döntött, hogy egy hordó törött felső részét viseli a fején! A plusz súly ugyan visszalassította a normál sebességére, de jóval nagyobb védelmet is biztosított számára. De azt hiszed, hallani fogod, ahogy valami pattog a hordó belsejében…

actors.mobs.mimic.name=utánzó
actors.mobs.mimic.reveal=Ez a láda egy utánzó!
actors.mobs.mimic.hidden_hint=Szokatlan érzésed támad ezzel a ládával kapcsolatban... Valószínűleg rossz ötlet lenne odasétálni és próbálni kinyitni.
actors.mobs.mimic.desc=Az utánzók olyan mágikus teremtmények, melyek kívánságuk szerinti alakot ölthetnek. A kazamatákban szinte mindig valamilyen kincsesláda formáját választják, hogy a gyanútlan kalandorokat lépre csalják.\n\nAz utánzóknak veszedelmes a harapásuk, de általában több kincset rejtenek, mint a közönséges ládák.
actors.mobs.mimic.discover_hint=Ezt az ellenséget bárhol megtalálhatod a kazamatában.

actors.mobs.necromancer.name=halottidéző
actors.mobs.necromancer.desc=Ezek a sötétmágus-tanoncok a börtönben gyűltek össze, mivel ez egy tökéletes hely az ördögi erejük próbálgatására.\n\nA halottidézők csontvázaknak adnak erőt, hogy harcoljanak helyettük. A halottidéző megölésével a megidézett csontvázak is elpusztulnak.
actors.mobs.necromancer$necroskeleton.name=a halottidéző csontváza
actors.mobs.necromancer$necroskeleton.desc=Ezt a csontvázat egy halottidéző keltette életre. Pont úgy viselkedik, mint egy átlagos csontváz, és elpusztul, ha a megidézőjét megölik.

actors.mobs.mob.died=Úgy hallod, a távolban valami meghalt.
actors.mobs.mob.rage=#$%^
actors.mobs.mob.rankings_desc=Megölt egy %s
actors.mobs.mob.discover_hint=Ezt az ellenséget a várbörtön egy bizonyos régiójában találhatod meg.

actors.mobs.monk.name=szerzetes törpe
actors.mobs.monk.def_verb=védte
actors.mobs.monk.parried=hárított
actors.mobs.monk.desc=Ezek a szerzetesek olyan fanatikusok, akik elkötelezték magukat amellett, hogy a királyukat a testükön át is védelmezik. Annyira odaadóak, hogy az elméjüket teljesen a király szolgálatára bízták, és most a törpe városban kóborolnak, mint agyatlan zombik.\n\nA szerzetesek kizárólag pusztakézi közelharcot vívnak, és képesek a fegyvertelen öklükkel védekezni és támadni is egyaránt. Amikor a szerzetesek összpontosított állapotba kerülnek, elhárítják az őket érő következő fizikai támadást, még akkor is, ha az egyébként garantált sérülést okozna. A szerzetesek sokkal hamarabb kerülnek összpontosított állapotba, amikor mozoghatnak, és később, amikor közvetlen harcot folytatnak.
actors.mobs.monk$focus.name=összpontosított
actors.mobs.monk$focus.desc=Ez a szerzetes tökéletesen ráhangolódik a célpontra, és úgy tűnik, hogy előre látja a mozdulatokat, mielőtt azok megtörténnének.\n\nAmíg összpontosít, a következő fizikai támadás, amit ez ellen a karakter ellen intéznek, garantáltan nem talál, függetlenül a körülményektől. Ennek a támadásnak a kivédése a szerzetes összpontosítását elhasználja, és egy újabb támadás kivédéséhez újra fel kell töltenie azt. A szerzetesek gyorsabban töltik fel az összpontosítást mozgás közben.

actors.mobs.phantompiranha.name=fantompirája
actors.mobs.phantompiranha.teleport_away=A fantompirája elteleportál...
actors.mobs.phantompiranha.desc=A fantompirája egy ritka pirájafajta, amely mágikus képességekkel és hátborzongatóan áttetsző testtel rendelkezik. Képes teleportálni, amikor megtámadja valaki, akár azért, hogy elmeneküljön, akár azért, hogy gyorsan az ellenség közelébe kerüljön!\n\nUgyan idegtépő dolog harcolni vele, de a húsát nagy becsben tartják mágikus tulajdonságai miatt.

actors.mobs.piranha.name=óriáspirája
actors.mobs.piranha.desc=Ezeket a húsevő halakat kifejezetten az elárasztott területek védelmére tenyésztették ki. Harapásuk halálos, ezért jobb, ha elkerülöd a velük való a közvetlen konfrontációt.
actors.mobs.piranha.discover_hint=Ezt az ellenséget bárhol megtalálhatod a kazamatában.

actors.mobs.pylon.name=energiaoszlop
actors.mobs.pylon.desc_inactive=Egy energiaoszlop, amely irányítja a gépezetek működtetéséhez szükséges elektromosságot a területen.\n\nAz oszlop most nem működik, és nem sebezhető.
actors.mobs.pylon.desc_active=Egy energiaoszlop, amely irányítja a gépezetek működtetéséhez szükséges elektromosságot a területen. Az oszlopból jelenleg elektromosság áramlik ki. Ez lehet az, amelyik túltölti a DM-300-at!\n\nEbben az állapotában az oszlop sebezhető, de elektromos ívet húz a közeli cellákon át az óra járásának megfelelő irányban. Mivel kemény fémből készült, az oszlop erős rongálásnak is ellen tud állni.

actors.mobs.rat.name=erszényes patkány
actors.mobs.rat.desc=Az erszényes patkányok a csatornák agresszív, de nem túl erős lakói. Kellemetlen a harapásuk, de csak nagy létszámban életveszélyesek.

actors.mobs.ripperdemon.name=szaggatódémon
actors.mobs.ripperdemon.leap=A szaggatódémon ugrásra készül!
actors.mobs.ripperdemon.desc=Ezek az ijesztő lények a területen található számtalan törpeholttest démoni megszállásának eredményeként jöttek létre. A szaggatók girhes, kísérteties teremtmények, amelyek emlékeztetnek a törpékre, de testük tépett és hosszú, éles karmaik csontokból vannak.\n\nA szaggatódémonok nem túl ellenállók, viszont gyorsak és veszélyesek. Képesek nagyobb távolságra ugrani, hogy gyorsan célpontjuk közelébe kerüljenek, aztán beledöfjék a karmaikat.

actors.mobs.rotheart.name=mállószív
actors.mobs.rotheart.desc=A mállóbogyó gyümölcse nagyon különleges. Ahelyett, hogy lebomolva tápanyaggá válna, a gyümölcs növekszik, megkeményedik, és körülöleli a magot. Megvédi a gyümölcsben növekvő belső szerveket. Ezt a hatalmas gömböt nevezik a kifejlett mállóbogyónövény szívének.
actors.mobs.rotheart.discover_hint=Ezt az ellenséget egy bizonyos küldetés során találhatod meg.

actors.mobs.rotlasher.name=mállóostor
actors.mobs.rotlasher.desc=A mállóostor a kifejlett mállóbogyónövények gyökérzetének része, és egyben a fő védekezőszerve is. Az ostorok vakok, és a talajhoz vannak rögzülve, és kis idő kell, míg észlelik a fenyegetést a közelükben, de utána erőszakosan megtámadják azt. Ha nincs a közelben ellenség, mozdulatlanul állnak, és megpróbálnak elvegyülni a környező növényzetben.
actors.mobs.rotlasher.discover_hint=Ezt az ellenséget egy bizonyos küldetés során találhatod meg.

actors.mobs.scorpio.name=skorpió
actors.mobs.scorpio.desc=Ezek az óriási pókszabású démoni teremtmények óvakodnak a közelharctól, inkább rokkantságot okozó recés tüskéket lőnek messziről.

actors.mobs.senior.name=rangidős szerzetes
actors.mobs.senior.desc=Ezek a szerzetesek olyan fanatikusok, akik elkötelezték magukat amellett, hogy a királyukat a testükön át is védelmezik. Annyira odaadóak, hogy az elméjüket teljesen a király szolgálatára bízták, és most a törpe városban kóborolnak, mint agyatlan zombik.\n\nEz a szerzetes tökélyre fejlesztette a pusztakézi közelharcot, és sokkal gyorsabban képes összpontosított állapotba jutni, amikor mozog, mint a közönséges szerzetesek. Amikor a szerzetesek összpontosított állapotba kerülnek, elhárítják az őket érő következő fizikai támadást, még akkor is, ha az egyébként garantált sérülést okozna. A szerzetesek sokkal hamarabb kerülnek összpontosított állapotba, amikor mozoghatnak, és később, amikor közvetlen harcot folytatnak.

actors.mobs.shaman.name=gnoll sámán
actors.mobs.shaman.bolt_kill=A varázslövedék végzett veled...
actors.mobs.shaman.desc=A gnoll sámánok intelligens gnollok, akik harci varázslatokkal kompenzálják erejük hiányát. Gyengébb fizikumuk ellenére nagy tiszteletnek örvendenek a gnoll társadalmon belül.
actors.mobs.shaman$redshaman.spell_desc=Ez a sámán vörös maszkot visel, és varázslataival átmenetileg _gyengíti a támadásod erejét._
actors.mobs.shaman$blueshaman.spell_desc=Ez a sámán kék maszkot visel, és varázslataival átmenetileg _növeli az elszenvedett sérüléseid._
actors.mobs.shaman$purpleshaman.spell_desc=Ez a sámán lila maszkot visel, és varázslataival átmenetileg _lecsökkenti a pontosságod és a kijátszásod._

actors.mobs.armoredbrute.name=páncélos vadállat
actors.mobs.armoredbrute.desc=A legmagasabb rangú gnoll vadállatok gyakran viselnek erős páncélt, hogy státuszukat mutogassák. A páncél sokkal ellenállóbbá teszi őket a fizikai sérülésekkel szemben, és a magasabb fegyelmüknek köszönhetően sokkal tovább őrjöngenek, mielőtt megadnák magukat a halálnak.

actors.mobs.skeleton.name=csontváz
actors.mobs.skeleton.explo_kill=Megöltek a szétrobbanó csontok...
actors.mobs.skeleton.def_verb=védte
actors.mobs.skeleton.desc=A csontvázak a börtön szerencsétlenül járt lakóinak és kalandorainak csontjaiból állnak össze, amelyeket a mélyről felsugárzó gonosz mágia mozgat. Mikor a csontvázak már olyan sok sérülést elszenvedtek, a csontjaik szétrobbanása közepette szétesnek. A robbanásból származó repeszek ártalmasak mindenre, ami a közelben van, de a páncélzat nagyon jól mérsékli a hatásukat.

actors.mobs.slime.name=nyálka
actors.mobs.slime.def_verb=védte
actors.mobs.slime.desc=A nyálkák furcsa, enyhén varázslatos teremtmények, kívül ruganyosak, és belül folyósak. A városi csatornákban bőséges vizet és tápanyagot találnak maguknak.\n\nA ruganyos külső membránjuk miatt nehéz _6 sérülésnél_ többet okozni nekik egy-egy támadás során.

actors.mobs.snake.name=csatornakígyó
actors.mobs.snake.hint=Próbáld használni a vizsgálat gombot egy kígyón, hogy megtudd, hogyan védekezhetsz ellene.
actors.mobs.snake.desc=Ezek a túlméretezett kígyók képesek gyorsan félrekúszni az ütések elől, így elég nehéz eltalálni őket. A mágikus támadások vagy a meglepetésszerű támadások azonban képesek kijátszani a védelmüket.\n\nMeglepetésszerű támadást hajthatsz végre, ha a kígyó látóterén kívülről támadsz. Az egyik módszer, ha hagyod, hogy a kígyó átkergessen egy ajtón, majd _megütöd közvetlenül azután, hogy az ajtóba ér._

actors.mobs.spectralnecromancer.name=kísértetes holtidéző
actors.mobs.spectralnecromancer.desc=A holtidézők többsége csontvázakkal dolgozik, néhányan azonban más, kevésbé megfogható csatlósokban lelik örömüket. A kísértetes holtidézők a lidérceket választották csatlósuknak.\n\nEgy lidérc önmagában nem olyan erős, mint egy csontváz, de ezek a holtidézők nem átallanak sokat megidézni belőlük!

actors.mobs.spinner.name=barlangi pók
actors.mobs.spinner.desc=Ezek a zöldes, szőrös barlangi pókok igyekeznek elkerülni a közvetlen harcot. Helyette inkább a távolban várják ki pókhálójukba ragadt áldozatuk lassú halálát, melyet mérges csípésük okozott. Képesek a hálójukat nagy távolságba kilőni, hogy elzárják zsákmányuk előtt az utat.

actors.mobs.statue.name=élő szobor
actors.mobs.statue.def_verb=védte
actors.mobs.statue.desc=Azt hinnéd, hogy ez is csak egy a kazamata élettelen szobrai közül, de a pirosan izzó szeme elárulja.
actors.mobs.statue.desc_weapon=Bár maga a szobor kőből készült, de a nála lévő _%s_ valódinak tűnik.
actors.mobs.statue.discover_hint=Ezt az ellenséget bárhol megtalálhatod a kazamatában.

actors.mobs.succubus.name=parázna
actors.mobs.succubus.desc=A paráznák alakváltó démonok, akik a prédájuk elméjét manipulálják. Ez az egyed sápadt, gót stílusú emberi alakot öltött magára, talán hogy elcsábítsa a törpe boszorkánymestereket?\n\nAmikor támad, a parázna elbájolhatja a célpontját, képtelenné téve azt, hogy közvetlenül támadja őt. Amikor a parázna egy elbájoltat támad, elveszi az életesszenciája egy részét.

actors.mobs.swarm.name=légyraj
actors.mobs.swarm.desc=A halálos légyraj dühösen zümmög. Minden nem mágikus támadás két kisebb, de egyformán veszélyes rajjá osztja őket.

actors.mobs.tengu.name=Tengu
actors.mobs.tengu.notice_gotcha=Megvagy, %s!
actors.mobs.tengu.interesting=Tegyük ezt érdekesebbé...!
actors.mobs.tengu.notice_have=Most megvagy, %s!
actors.mobs.tengu.defeated=Végre szabad vagyok...
actors.mobs.tengu.rankings_desc=Meggyilkolta a Tengu
actors.mobs.tengu.desc=Egy híres és titokzatos orgyilkos, aki az arcára forrasztott maszkról kapta a nevét.\n\nTengut a csuklóján és térdén hatalmas pántok szorítják le, bár úgy tűnik, már rég leszakította láncait.\n\nCsapdákkal, álnok varázslatokkal és precíz támadásokkal próbálja elhárítani az egyetlen akadályt, amely a szökése útjában áll: téged.

actors.mobs.tengu$bombability$bombblob.desc=Forró füstfelhő gomolyog erre. Légy résen, robbani fog!
actors.mobs.tengu$bombability$bombitem.name=Füstbomba
actors.mobs.tengu$bombability$bombitem.cant_pickup=A padlóhoz rögzült, nem tudod mozdítani!
actors.mobs.tengu$bombability$bombitem.desc=Tengu egy furcsa külsejű füstbombát dobott, amelyből sűrű, forró füst gomolyog. Hangos ketyegés jön belőle, mintha robbanás előtti visszaszámlálás hangja lenne!\n\nA bomba a földhöz rögzítette magát, nem lehet felvenni.

actors.mobs.tengu$fireability$fireblob.desc=Tengu finom port dobott, amely elegyedik a levegővel, és gyulladni készül!

actors.mobs.tengu$shockerability$shockerblob.desc=Elektromos energia gyűlik itt, és a következő körben áramütést szenved, aki ezen a mezőn áll!
actors.mobs.tengu$shockerability$shockeritem.name=Sokkoló
actors.mobs.tengu$shockerability$shockeritem.cant_pickup=Túl sok elektromosságot bocsát ki, nem tudod megfogni!
actors.mobs.tengu$shockerability$shockeritem.desc=Tengu egy különös gépezetet dobott ide, amely úgy tűnik, hogy a DM-100 alkatrészeiből készült. A gépezet folyamatosan elektromos íveket húz maga körül, amelyek egy kiszámítható séma szerint haladnak.\n\nAz elektromos ívek miatt kizárt, hogy fel tudd venni.

actors.mobs.thief.name=őrült tolvaj
actors.mobs.thief.stole=Egy tőled lopott %s van a tolvajnál!
actors.mobs.thief.carries=\n\nA tolvajnál _%s_ van. Nyilván lopta.
actors.mobs.thief.escapes=A tolvaj megszökött, a tőled lopott %s már nem lesz meg!
actors.mobs.thief.desc=Bár ezek a foglyok szabadon kószálnak a cellájukon kívül, ez a hely mégis a börtönük. Az idők során ez a hely nemcsak a szabadságukat, hanem az ép eszüket is elvette. Ezek az őrült tolvajok és banditák már rég elfelejtették, hogy kik is ők, és miért lopnak.\n\nEzek az ellenségek valószínűbb, hogy lopnak és aztán elszaladnak, semmint harcba bocsátkoznának. Ne téveszd őket szem elől, különben lehet, hogy soha nem látod viszont az ellopott holmidat.

actors.mobs.tormentedspirit.name=meggyötört lélek
actors.mobs.tormentedspirit.desc=A meggyötört lelkek olyan egyébként jóindulatú szellemek, akiket átok sújt. Amíg átkozottak, addig támadnak, mint a lidércek, sőt erősebbek is!\n\nLehetséges, hogy a megfelelő tárgyat a szellem mellett használva megtörhető az átok. Ha megszabadul az átoktól, a szellem biztosan hálás lesz...
actors.mobs.tormentedspirit.thank_you=Köszönöm...

actors.mobs.vaultrat.desc=Ennek a patkánynak megváltozott a viselkedése, hogy tesztelhessük az új páncéltermi ellenség-MI-t:\n\n_-_ A mozgása a falakon keresztül is „hallható”.\n_-_ Egy előre meghatározott útvonalon járőrözik.\n_-_ Kószálás közben az érzékelési távolsága jelentősen lecsökken a háta mögött.\n_-_ Alvás közben az érzékelési távolsága szintén kisebb.\n_-_ Amikor észrevesz, először „vizsgálódni” kezd, mielőtt üldözőbe venne. A vizsgálódó ellenségek elindulnak feléd, de nem támadnak, és könnyebb lerázni őket az ajtók vagy sarkok mögött.

actors.mobs.npcs.vaultsentry.name=páncéltermi pásztázó őrszem
actors.mobs.npcs.vaultsentry.desc=Ez az őrszem rendszeresen pásztázza a területet. _Mivel ez csak egy tesztterület, az őrszem nem fog semmit tenni, ha észlel téged._

actors.mobs.npcs.vaultlaser.name=páncéltermi lézeres őrszem
actors.mobs.npcs.vaultlaser.desc=Ez az őrszem rendszeres időközönként lézereket lő ki. Mivel ez csak egy tesztterület, a lézerek nem ártanak neked.

actors.mobs.warlock.name=törpe boszorkánymester
actors.mobs.warlock.bolt_kill=Az árnylövedék megölt...
actors.mobs.warlock.desc=Amikor a törpék érdeklődése a gépészettől a misztikus művészetek felé fordult, a városban megnőtt a boszorkánymesterek befolyása. Elemi mágiával kezdték, de nem sokkal később már a démonológia és a szellemidézés felé fordultak. A legerősebb boszorkánymester magához ragadta a törpe város trónját, bajtársai pedig tovább gyakorolhatták a sötét mágiát, feltéve, hogy szabad akaratukat alárendelték neki.\n\nEzek a boszorkánymesterek erős bomlasztó varázslatot uralnak, és képesek átmenetileg semlegesíteni a felszereléseid fejlesztéseit. Minél fejlettebb egy eszköz, annál erősebben érintett.

actors.mobs.wraith.name=lidérc
actors.mobs.wraith.desc=A lidérc egy bosszúra szomjazó bűnös lelke, akinek a sírhelyét megzavarták. Mivel túlvilági lény, nagyon nehéz hagyományos fegyverrel eltalálni.
actors.mobs.wraith.discover_hint=Ezt az ellenséget bárhol megtalálhatod a kazamatában.

actors.mobs.yogdzewa.name=Yog-Dzewa
actors.mobs.yogdzewa.notice=LÁT-LAK TÉ-GED!
actors.mobs.yogdzewa.darkness=A sötétség közelebb húzódik...
actors.mobs.yogdzewa.hope=A. REMÉNYED. CSAK. ILLÚZIÓ!
actors.mobs.yogdzewa.defeated=...
actors.mobs.yogdzewa.rankings_desc=Yog-Dzewa elpusztított
actors.mobs.yogdzewa.desc=Yog-Dzewa egy ősi istenség; egy hatalmas szörnyűség, amely eléri a halandó világokat, és felzabálja őket, hogy táplálhassa a végtelen növekedését. A törpék kelthették fel ennek a kozmikus borzalomnak a figyelmét, miközben a sötét mágiával játszottak, és azóta próbálják kordában tartani.\n\nYog-Dzewa egy nyers mágikus káoszt rejtő dimenzióból származik, és nem képes a valódi alakját áthozni a mi világunkba. Helyette földi inkarnációkat csinált, és démoni csatlósokat idézett, akiknek parancsolhat.\n\nEz a hatalmas szem Yog-Dzewa energiájának az összpontosulása ebben a világban. A szem nem képes elmozdulni, de erős nyalábokat tud lőni a démoni mágia által, és különféle csatlósokat tud megidézni a védelmére.
actors.mobs.yogdzewa.desc_spawners=Érzed, ahogy a démoni energia lüktetve sugárzik a szem felé a felsőbb emeletekről. Valami, amit életben hagytál valahol fent, visszatölti az energiát Yog-Dzewába. _Yog ezzel az energiával sokkal erősebb csatlósokat fog megidézni!_
actors.mobs.yogdzewa$larva.name=istenség lárvája
actors.mobs.yogdzewa$larva.rankings_desc=Yog-Dzewa elpusztított
actors.mobs.yogdzewa$larva.desc=Ezek az apró ivadékok Yog-Dzewa könnyen teremthető, egyszerű csatlósai. Egyenként gyengék, viszont gyorsan megidézhetők, és nagy számban elsöprő erővel bírnak.
actors.mobs.yogdzewa$yogripper.rankings_desc=Yog-Dzewa elpusztított
actors.mobs.yogdzewa$yogeye.rankings_desc=Yog-Dzewa elpusztított
actors.mobs.yogdzewa$yogscorpio.rankings_desc=Yog-Dzewa elpusztított

actors.mobs.yogfist.invuln_warn=Az ököl sérthetetlen, amikor a szem közelében van!
actors.mobs.yogfist.rankings_desc=Yog-Dzewa elpusztított
actors.mobs.yogfist.desc=Az ököl Yog-Dzewa erejének kivetülése. Az öklök Yog-Dzewa erejéből táplálkonak, és a szem közelében védve vannak minden sérüléstől.
actors.mobs.yogfist$burningfist.name=égő ököl
actors.mobs.yogfist$burningfist.desc=Az öklöt zavaros tüzes mágiából formálták. Mozgása során folyamatosan lángra lobbantja maga körül a teret. Képes tüzes energianyalábokat lőni, amelyek lángra lobbantják a becsapódásuk környezetét.\n\nAz ököl gyújtogatóképessége víz közelében nem olyan hatásos, viszont olyan forróság van körülötte, hogy rövid idő alatt az összes közelében lévő vizet elpárologtatja!
actors.mobs.yogfist$soiledfist.name=földes ököl
actors.mobs.yogfist$soiledfist.desc=Az öklöt zavaros földmágiából formálták. Mozgása során folyamatosan növényzet serkent maga körül. Képes irányított földnyalábokat lőni, amivel a célpontot gyorsan növő gyökerek és indák közé csavarja!\n\nAz ököl ebből a növényzetből nyeri erejét, és annál jobban ellen tud állni a sérülésnek, minél több magas vagy ösvényekkel barázdált növényzet található a közelében!
actors.mobs.yogfist$rottingfist.name=rothadó ököl
actors.mobs.yogfist$rottingfist.desc=Az öklöt tenyésző enyészetből formálták. Tornyosuló rothadó hústömeg alkotja, amely közelharcban maró váladékot, távolról pedig mérgező gázt bocsát ki. Ennél is rosszabb, hogy az ököl a hatalmas tömege miatt csak nekiáll vérezni, ahelyett, hogy rögtön elszenvedné a sérülést.\n\nVízzel lemosható a váladék, de az ököl is felszívja a vizet, így gyógyítja magát! Továbbá, ha az ököl sérülést szerez, miközben vérzik, akkor csak kiújul a vérzés, de nem fokozódik!
actors.mobs.yogfist$rustedfist.name=rozsdás ököl
actors.mobs.yogfist$rustedfist.desc=Az öklöt élő fémből formálták. Hatalmas tömegű mozgó fém alkotja, erős a közelharcban, de képes ellenségeit távolról is lerokkantani. Az óriási tömege miatt a sérüléseket nem egyszerre, hanem időben elnyújtva szenvedi el.\n\nAz ököl viszont elég merev, és nem tud keresztülmenni szűk járatokon. Ezen kívül a sérüléseket ugyan lassacskán szenvedi el, viszont a késleltetett sérülése egyre nagyobb lesz, ha sok ütést kap az ököl.
actors.mobs.yogfist$brightfist.name=fénylő ököl
actors.mobs.yogfist$brightfist.teleport=Az ököl elteleportálja magát egy fényrobbanással, ami hosszan elvakít!
actors.mobs.yogfist$brightfist.desc=Az öklöt tiszta fényenergiából formálták. Minden körben képes erőteljes, perzselő fénysugarakat lőni! Ezek a nyalábok nem csak nagy sérülést okoznak neked, hanem átmenetileg meg is vakítanak. Az ököl a menekülése érdekében képes a teljes arénát is vakító fénnyel megtölteni!\n\nAz ökölnek azonban nincsenek különleges képességei a közelharcot illetően.
actors.mobs.yogfist$darkfist.name=sötét ököl
actors.mobs.yogfist$darkfist.teleport=Az ököl elteleportálja magát egy sötétségrobbanással, ami eloltja a fényforrásod!
actors.mobs.yogfist$darkfist.desc=Az öklöt tömény sötét energiából formálták. Minden körben képes erőteljes, sötét mágiával robbanó lövedéket lőni! A robbanások nem csak nagy sérülést okoznak neked, hanem gyengítik a fényforrásodat is. Az ököl a menekülése érdekében képes a teljes arénát is sötétségbe borítani!\n\nAz ökölnek azonban nincsenek különleges képességei a közelharcot illetően.


actors.char.kill=Egy %s végzett veled...
actors.char.defeat=elesett egy %s.
actors.char.def_verb=elhajolt
actors.char.invulnerable=sebezhetetlen
actors.char.immune=immunis

# Eternity PD Fallback Keys
actors.blobs.blizzard.desc=A blizzard is swirling here.
actors.blobs.confusiongas.desc=A cloud of confusion gas is swirling here.
actors.blobs.dancefloor.desc=Dance dance dance!\n%s dancing tile: %s\nNext color: %s
actors.blobs.dancefloor.color_1_name=Red
actors.blobs.dancefloor.color_1_desc=Characters standing on this tile take direct damage (massively increased vs hero)
actors.blobs.dancefloor.color_2_name=Green
actors.blobs.dancefloor.color_2_desc=Characters standing on this tile act at 2x speed
actors.blobs.dancefloor.color_3_name=Blue
actors.blobs.dancefloor.color_3_desc=Characters standing on this tile are stunned
actors.blobs.dancefloor.color_4_name=White
actors.blobs.dancefloor.color_4_desc=Characters standing on this tile take defered damage (massively increased vs hero)
actors.blobs.dancefloor.color_5_name=Yellow
actors.blobs.dancefloor.color_5_desc=Mobs killed on this tile give double EXP and more loot
actors.blobs.dancefloor.color_6_name=Purple
actors.blobs.dancefloor.color_6_desc=Characters standing on this tile take double damage
actors.blobs.dancefloor.rankings_desc=Danced into a grave
actors.blobs.dancefloor.ondeath=You danced into your own grave
actors.blobs.dancefloor$dancingdefereddamage.name=Dancing with Death
actors.blobs.dancefloor$dancingdefereddamage.desc=This is the most dangerous dance you've ever performed, and you are absolutely _ROCKING_ it, disregarding the pain!\n\nDeferred damage remaining: %d.
actors.blobs.dancefloor$dancingdefereddamage.ondeath=You danced into your own grave
actors.blobs.dancefloor$dancingdefereddamage.rankings_desc=Danced into a grave
actors.blobs.dancefloor$dancingdoom.name=Dancing in a grave
actors.blobs.dancefloor$dancingdoom.desc=Grave isn't the best place to dance in, but no one is stopping you!\n\nCharacters who are brave enough to dance in a grave will receive double damage from all sources.
actors.blobs.dancefloor$dancespeed.name=Dancing with Time
actors.blobs.dancefloor$dancespeed.desc=Your perfect dance synchronized with a rhythm of the universe, and not even time gonna stop you from dancing!\n\nWhile you dance is perfect, you will perform all actions at double speed.
actors.blobs.dancefloor$dancingstun.name=Stunned
actors.blobs.dancefloor$dancingstun.heromsg=You are stunned!
actors.blobs.dancefloor$dancingstun.desc=Nothing feels worse than being stunned in a middle of a dance\n\nStun completely halts all actions, forcing the target to wait until the effect wears off.
actors.blobs.electricity.desc=A field of electricity is sparking brightly here.
actors.blobs.electricity.rankings_desc=Electrocuted
actors.blobs.electricity.ondeath=You were shocked to death...
actors.blobs.fire.desc=A fire is raging here.
actors.blobs.foliage.desc=Shafts of light pierce the gloom of the underground garden.
actors.blobs.freezing.desc=The air is unnaturally frigid here.
actors.blobs.goowarn.desc=Specks of dark energy are swarming here!
actors.blobs.inferno.desc=An inferno is raging here.
actors.blobs.paralyticgas.desc=A cloud of paralytic gas is swirling here.
actors.blobs.sacrificialfire.desc=There is an altar here with a sacrificial fire burning atop it. Any creature that's killed here will be consumed as an offering to the spirits of the dungeon.\n\nPerhaps a reward will be given if enough sacrifices are made?
actors.blobs.sacrificialfire.worthy=The fire consumes your offering and grows stronger.
actors.blobs.sacrificialfire.unworthy=The fire consumes your offering, but doesn't change.
actors.blobs.sacrificialfire.reward=The fire flares and then dissipates, leaving a reward behind!
actors.blobs.smokescreen.desc=A cloud of thick black smoke is swirling here.
actors.blobs.stenchgas.desc=A cloud of fetid stench is swirling here.
actors.blobs.stormcloud.desc=A cloud of billowing water vapor is swirling here.
actors.blobs.toxicgas.desc=A greenish cloud of toxic gas is swirling here.
actors.blobs.toxicgas.rankings_desc=Suffocated
actors.blobs.toxicgas.ondeath=You died from the toxic gas...
actors.blobs.corrosivegas.desc=A cloud of deadly caustic gas is swirling here.
actors.blobs.waterofawareness.procced=As you take a sip, you feel knowledge pour into your mind.
actors.blobs.waterofawareness.desc=Power of knowledge radiates from the water of this well. Take a sip from it to reveal all secrets of equipped items and reveal all items on the current floor.
actors.blobs.waterofhealth.procced=As you take a sip, you feel your wounds heal completely.
actors.blobs.waterofhealth.desc=Power of health radiates from the water of this well. Take a sip from it to heal your wounds and satisfy hunger.
actors.blobs.wateroftransmutation.desc=Power of change radiates from the water of this well. Throw an item into the well to turn it into something else.
actors.blobs.web.desc=A thick web is covering everything here. Anything that touches or is thrown through the web will break it, but will also be stuck in place.
actors.buffs.adrenaline.name=adrenaline
actors.buffs.adrenaline.desc=A surge of physical power, adrenaline enhanced both attack and movement speed.\n\nAdrenaline allows its target to run at 2x speed, and attack at 1.5x speed.\n\nTurns remaining: %s.
actors.buffs.adrenalinesurge.name=strength boost
actors.buffs.adrenalinesurge.desc=A surge of great might, but sadly not permanent.\n\nStrength boost: +%d.\nTurns until boost weakens: %s.
actors.buffs.amok.name=amok
actors.buffs.amok.desc=Amok causes a state of great rage and confusion in its target.\n\nWhen a creature is amoked, they will attack whatever is near them, whether they be friend or foe.\n\nTurns of amok remaining: %s.
actors.buffs.arcanearmor.name=arcane armor
actors.buffs.arcanearmor.desc=A thin shield is surrounding you, blocking some of the damage from magical attacks.\n\nYour magical armor is currently boosted by: 0-%d.\n\nTurns until arcane armor weakens: %s.
actors.buffs.artifactrecharge.name=artifact recharging
actors.buffs.artifactrecharge.desc=Energy is coursing through you, increasing the rate your equipped artifacts charge.\n\nEach artifact is affected a little differently, but they will all gain charge much faster than normal.\n\nTurns remaining: %s.
actors.buffs.ascensionchallenge.name=amulet's curse
actors.buffs.ascensionchallenge.desc=Somehow Yog-Dzewa is maintaining influence on this world through the amulet, and is trying to stop your ascent!\n\nYog's power is making the dungeon much more dangerous, increasing the number of enemies and making them stronger! This power will keep building if left unchecked, it can be weakened by defeating enemies that have been enhanced by Yog's power.
actors.buffs.ascensionchallenge.desc_clear=The dark energy radiating from the amulet has been weakened as much as possible for now.
actors.buffs.ascensionchallenge.desc_beckon=The amulet is currently _calling out to distant enemies,_ alerting them to your position.
actors.buffs.ascensionchallenge.desc_haste=The amulet is currently _hastening distant enemies,_ letting them reach you faster!
actors.buffs.ascensionchallenge.desc_slow=The amulet is currently _slowing you down,_ and negating speed boosting effects!
actors.buffs.ascensionchallenge.desc_damage=The energy from the amulet has gotten so strong that it's _directly harming you!_
actors.buffs.ascensionchallenge.beckon=The amulet begins calling out to distant enemies.
actors.buffs.ascensionchallenge.haste=The amulet begins hastening distant enemies!
actors.buffs.ascensionchallenge.slow=The amulet starts to feel like a lead weight in your inventory!
actors.buffs.ascensionchallenge.damage=The amulet begins radiating dark energy. It burns!
actors.buffs.ascensionchallenge.weaken_info=You must defeat enemies to weaken the amulet's curse!
actors.buffs.ascensionchallenge.weaken=You can feel the amulet's curse weaken slightly.
actors.buffs.ascensionchallenge.break=You take a moment to catch your breath and feel your wounds begin to close!
actors.buffs.ascensionchallenge.almost=You feel Yog's grip on the amulet begin to weaken, you're almost there!
actors.buffs.ascensionchallenge.on_kill=The dark energy consumes you...
actors.buffs.barkskin.name=barkskin
actors.buffs.barkskin.desc=Your skin is hardened, it feels rough and solid like bark.\n\nThe hardened skin increases your effective armor, allowing you to better defend against physical attack.\n\nYour armor is currently increased by: 0-%d.\nTurns until barkskin weakens: %s.\n\nIf you receive barkskin from multiple sources, only the strongest one will apply.
actors.buffs.barrier.name=barrier
actors.buffs.barrier.desc=A durable bubble of force which blocks all damage.\n\nThe barrier will take damage for whatever it is protecting so long as there is shielding left. The shielding will also slowly decay over time.\n\nShielding remaining: %d.
actors.buffs.rageshield.name=Determination Shield
actors.buffs.rageshield.heromsg=You are protected by your rage!
actors.buffs.rageshield.desc=A durable bubble of your sheer rage saps away life force from nearby enemies, if you are wounded.\n\nThe barrier will drain health from enemies in your sight, angering them and taking damage. The shielding will have bigger effect if enemy is in adjacent to host.\n\nShielding remaining: %d.
actors.buffs.berserk.angered=angered
actors.buffs.berserk.berserk=berserking
actors.buffs.berserk.exhausted=exhausted
actors.buffs.berserk.recovering=recovering
actors.buffs.berserk.angered_desc=The severity of the Berserker's injuries strengthen his blows. As the berserker takes physical damage, his rage will build, granting him bonus damage. Damage which is blocked by armor still counts towards building rage.\n\nRage will fade over time. The lower the berserker's health, the longer it will last.\n\nAt 100%% rage, the Berserker can go berserk, granting him 2x his seal's max shielding, increasing to 6x if he has very low health. This shielding decays over time and once it runs out the berserker will have to rest before building rage again.\n\nCurrent Rage: _%.0f%%_\n_+%.0f%%_ damage
actors.buffs.berserk.berserk_desc=Fear and uncertainty bleed away, leaving only anger. In this state the Berserker is extremely powerful, _dealing +50% damage and gaining bonus shielding._\n\nThis bonus shielding is equal to 2x his seal's max shielding, increasing to 6x if he has very low health. When this shielding is reduced to 0, berserking will end.\n\nAfter raging, the Berserker will need to recover before being able to build rage again.
actors.buffs.berserk.recovering_desc=Inner strength has its limits. The Berserker must rest before using his rage again.\n\nWhile recovering the Berserker does not build any rage from taking damage.
actors.buffs.berserk.recovering_desc_turns=Turns until recovered: _%d_
actors.buffs.berserk.recovering_desc_levels=Levels until recovered: _%.2f_
actors.buffs.berserk.rankings_desc=Berserked to Death
actors.buffs.berserk.action_name=Berserk
actors.buffs.berserk.no_seal=You need your broken seal to berserk!
actors.buffs.bleeding.name=bleeding
actors.buffs.bleeding.ondeath=You bled to death...
actors.buffs.bleeding.heromsg=You are bleeding!
actors.buffs.bleeding.rankings_desc=Bled to Death
actors.buffs.bleeding.desc=That wound is leaking a worrisome amount of blood.\n\nBleeding causes damage every turn. Each turn the damage decreases by a random amount, until the bleeding eventually stops.\n\nCurrent bleed damage: %d.
actors.buffs.bless.name=blessed
actors.buffs.bless.desc=A great burst of focus, some say it is inspired by the gods.\n\nBlessing increases accuracy and evasion by 25%%, making the blessed much more effective in combat.\nIt also increased experience gain by 2x for heroes and allows them to get more items.\n\nTurns of bless remaining: %s.
actors.buffs.blindness.name=blinded
actors.buffs.blindness.heromsg=You are blinded!
actors.buffs.blindness.desc=Blinding turns the surrounding world into a dark haze.\n\nWhile blinded, a character's vision range is reduced to one tile, rendering ranged attacks useless and making it very easy to lose track of distant enemies. Additionally, a blinded hero is unable to read scrolls or books.\n\nTurns of blindness remaining: %s.
actors.buffs.buff.heromsg=
actors.buffs.burning.name=burning
actors.buffs.burning.heromsg=You catch fire!
actors.buffs.burning.burnsup=%s burns up!
actors.buffs.burning.ondeath=You burned to death...
actors.buffs.burning.rankings_desc=Burned to Ash
actors.buffs.burning.desc=Few things are more distressing than being engulfed in flames.\n\nFire will deal damage every turn until it is put out by water or it expires. Fire can be extinquished by stepping into water, or from the splash of a shattering potion.\n\nAdditionally, the fire may ignite flammable terrain or items that it comes into contact with.\n\nTurns of burning remaining: %s.
actors.buffs.championenemy.warn=You sense a deadly presence.
actors.buffs.championenemy$blazing.name=blazing champion
actors.buffs.championenemy$blazing.desc=Blazing champions deal 25% more melee damage, ignite enemies they attack, are immune to fire, and spread fire around them as they die. They can't spread fire onto water however.
actors.buffs.championenemy$projecting.name=projecting champion
actors.buffs.championenemy$projecting.desc=Projecting champions deal 25% more melee damage and have +3 attack range.
actors.buffs.championenemy$antimagic.name=antimagic champion
actors.buffs.championenemy$antimagic.desc=Antimagic champions take 50% less damage and are completely immune to magical effects.
actors.buffs.championenemy$giant.name=giant champion
actors.buffs.championenemy$giant.desc=Giant champions take 80% less damage and have +1 attack range, but cannot move through enclosed spaces.
actors.buffs.championenemy$blessed.name=blessed champion
actors.buffs.championenemy$blessed.desc=Blessed champions have 4x accuracy and evasion.
actors.buffs.championenemy$growing.name=growing champion
actors.buffs.championenemy$growing.desc=Growing champions gain a steadily increasing bonus to accuracy, evasion, physical damage, and a reduction to damage taken.\n\nCurrent acc/eva/dmg boost: %1$d%%\nCurrent damage reduction: %2$d%%
actors.buffs.championenemy$tanky.name=tanky champion
actors.buffs.championenemy$tanky.desc=Tanky champions receives only 5% of the damage, but reduces their damage and speed by 25%.
actors.buffs.championenemy$speedy.name=speedy champion
actors.buffs.championenemy$speedy.desc=Speedy Champions will gain x4 speed and x1.5 evasion and accuracy.
actors.buffs.championenemy$frozen.name=frozen champion
actors.buffs.championenemy$frozen.desc=Frozen champions deal 25% more melee damage but they have -20% speed, chills enemies they attack and sometimes freezes them, are immune to cold gases or effects, and spread blizzard around them as they die.
actors.buffs.championenemy$blunt.name=blunt champion
actors.buffs.championenemy$blunt.desc=Blunt champions are expert for using their hands or something they use as a blunt weapons, they deal 75% more damage as well as inflicts vertigo when they attack and paralyzes you in rare cases.
actors.buffs.charm.name=charmed
actors.buffs.charm.heromsg=You are charmed!
actors.buffs.charm.cant_attack=You are charmed by that enemy and can't attack them.
actors.buffs.charm.desc=A charm is manipulative magic that can make enemies temporarily adore each other.\n\nCharacters affected by charm are unable to directly attack the enemy they are charmed by. Attacking other targets is still possible however. The shock of pain will lessen the duration of charm.\n\nTurns of charm remaining: %s.
actors.buffs.chill.name=chilled
actors.buffs.chill.freezes=%s freezes!
actors.buffs.chill.desc=Not quite frozen, but still much too cold.\n\nChilled targets perform all actions more slowly, depending on how many turns are left in the effect. At its worst, this is equivalent to being slowed.\n\nTurns of chill remaining: %1$s.\nSpeed is reduced by: %2$s%%
actors.buffs.combo.name=combo
actors.buffs.combo.action_name=combo attack
actors.buffs.combo.combo=%d hit combo!
actors.buffs.combo.bad_target=You must target an enemy in attack range.
actors.buffs.combo.prompt=Select a target to attack.
actors.buffs.combo.desc=The gladiator builds momentum as they land successful blows. Each attack increases the combo counter by one, but taking too long between hits will reset the combo counter to 0.\n\nBuilding combo unlocks special combo attacks that cannot miss! A different attack is unlocked at 2, 4, 6, 8, and 10 combo count. Some moves reset combo and some do not, but each move can only be used once per combo session.\n\nCurrent combo: %1$d.\n\nTurns until Combo is lost: %2$s.
actors.buffs.combo$combomove.clobber.name=clobber
actors.buffs.combo$combomove.clobber.desc=Knocks an enemy back 2 tiles, but deals no damage and cannot knock into pits. Increments combo by 1.
actors.buffs.combo$combomove.clobber.empower_desc=Knocks an enemy back _3 tiles, inflicts vertigo, and can knock into pits,_ but deals no damage. Increments combo by 1.
actors.buffs.combo$combomove.slam.name=slam
actors.buffs.combo$combomove.slam.desc=Deals %d%% (combo*20%%) of your damage blocking power as bonus damage. Resets combo when used.
actors.buffs.combo$combomove.slam.empower_desc=_Leaps up to %1$d tile(s)_ and deals %2$d%% (combo*20%%) of your damage blocking power as bonus damage. Resets combo when used.
actors.buffs.combo$combomove.parry.name=parry
actors.buffs.combo$combomove.parry.desc=Blocks the next attack within 1 turn when activated, and instantly retaliates to it. Resets combo if nothing is parried.
actors.buffs.combo$combomove.parry.empower_desc=Blocks _all attacks_ within 1 turn when activated, and instantly retaliates to them. Resets combo if nothing is parried.
actors.buffs.combo$combomove.crush.name=crush
actors.buffs.combo$combomove.crush.desc=Deals %d%% (combo*25%%) damage to the primary target, and half that damage to all other enemies in a 7x7 AOE. Resets combo when used.
actors.buffs.combo$combomove.crush.empower_desc=_Leaps up to %1$d tile(s)_ and deals %2$d%% (combo*25%%) damage to the primary target, and half that damage to all other enemies in a 7x7 AOE. Resets combo when used.
actors.buffs.combo$combomove.fury.name=fury
actors.buffs.combo$combomove.fury.desc=Hits an enemy once for each combo you have, each hit deals 60% damage and can trigger enchantments. Resets combo when used.
actors.buffs.combo$combomove.fury.empower_desc=_Leaps up to %d tile(s)_ and hits an enemy once for each combo you have, each hit deals 60%% damage and can trigger enchantments. Resets combo when used.
actors.buffs.corruption.name=corrupted
actors.buffs.corruption.desc=Corruption seeps into the essence of a being, twisting them against their former nature.\n\nCorrupted creatures will attack their allies, and ignore their former enemies. Corruption is damaging as well, and will slowly cause its target to succumb.\n\nCorruption is permanent, its effects only end in death.
actors.buffs.cripple.name=crippled
actors.buffs.cripple.heromsg=You are crippled!
actors.buffs.cripple.desc=You're pretty sure legs aren't meant to bend that way.\n\nCrippled halves movement speed, making moving a tile usually take two turns instead of one.\n\nTurns of cripple remaining: %s.
actors.buffs.daze.name=dazed
actors.buffs.daze.heromsg=You are dazed!
actors.buffs.daze.desc=Ringing ears and blurred vision make it difficult to fight.\n\nWhile dazed, accuracy and evasion are reduced by 50%%, making both landing and evading blows much harder.\n\nTurns of daze remaining: %s.
actors.buffs.degrade.name=degraded
actors.buffs.degrade.heromsg=Your equipment feels weaker!
actors.buffs.degrade.desc=Powerful dark magic is sapping the strength that scrolls of upgrade have applied to your equipment!\n\nWhile degraded, upgraded gear will be treated as if it is a lower level than it actually is. _Every upgrade after +3 becomes exponentially weaker than the last one._ The descriptions of your items will change to reflect their reduced power level.\n\nDegradation does not affect strength requirements, wand charges, durability of thrown weapons, or artifacts.\n\nTurns of degradation remaining: %s. Using a scroll of upgrade or remove curse will end degradation immediately.
actors.buffs.doom.name=doomed
actors.buffs.doom.desc=It's hard to keep going when it seems like the universe wants you dead.\n\nDoomed characters will receive +67% damage from all sources.\n\nDoom is permanent, its effects only end in death.
actors.buffs.dread.name=dread
actors.buffs.dread.desc=A terror so great that it will cause its target to flee the dungeon entirely!\n\nCreatures affected by dread will run from their opponent at high speed, and will disappear from the dungeon entirely once they are out of sight. Enemies that are defeated this way award half experience and drop no items. The shock of pain will lessen the duration of dread.\n\nTurns of dread remaining: %d.
actors.buffs.drowsy.name=drowsy
actors.buffs.drowsy.desc=A magical force is making it difficult to stay awake, after a few turns, the target will fall into a deep magical sleep.\n\nThe hero can resist drowsiness by taking damage or by being at full health.\n\nTurns until sleep: %s.
actors.buffs.earthimbue.name=imbued with earth
actors.buffs.earthimbue.desc=You are imbued with the power of earth!\n\nAll physical attacks will shift the earth under the enemy, crippling them for a short time.\n\nTurns of earth imbue remaining: %s.
actors.buffs.enhancedrings.name=enhanced rings
actors.buffs.enhancedrings.desc=The Rogue's recently used artifact is empowering his rings, granting them +1 level.\n\nTurns remaining: %s.
actors.buffs.fireimbue.name=imbued with fire
actors.buffs.fireimbue.desc=You are imbued with the power of fire!\n\nAll physical attacks will have a chance to light enemies ablaze. Additionally, you are completely immune to the effects of fire.\n\nTurns of fire imbue remaining: %s.
actors.buffs.foresight.name=foresight
actors.buffs.foresight.desc=You are somehow able to see the layout of surrounding terrain with your mind.\n\nWhile under the effect of foresight all tiles in a wide radius are revealed to you, including any secret traps or doors.\n\nTurns of foresight remaining: %s.
actors.buffs.frost.name=frozen
actors.buffs.frost.freezes=%s freezes!
actors.buffs.frost.desc=Not to be confused with freezing solid, this more benign freezing simply encases the target in ice.\n\nFreezing acts similarly to paralysis, making it impossible for the target to act. Unlike paralysis, freezing is immediately cancelled if the target takes damage, as the ice will shatter.\n\nTurns of freeze remaining: %s.
actors.buffs.frostimbue.name=imbued with frost
actors.buffs.frostimbue.desc=You are imbued with icy power!\n\nAll physical attacks will steadily stack chill on enemies. Additionally, you are completely immune to the cold.\n\nTurns of frost imbue remaining: %s.
actors.buffs.fury.name=furious
actors.buffs.fury.heromsg=You become furious!
actors.buffs.fury.desc=You are angry, enemies won't like you when you're angry.\n\nA great rage burns within you, increasing the damage you deal with physical attacks by 50%%.\n\nThis rage will last as long as you are injured below 50%% health.
actors.buffs.blobimmunity.name=purification barrier
actors.buffs.blobimmunity.desc=Some strange force is encasing you in a thin protective barrier, blocking out all harmful airborne effects.\n\nYou are immune to all area-bound effects while this barrier lasts.\n\nTurns of immunity remaining: %s.
actors.buffs.greaterhaste.name=greater haste
actors.buffs.greaterhaste.desc=An incredible boost of speed, for a moment it feels as if everything else is standing still.\n\nWhile under the effects of greater haste moving actions take no time at all, but other actions are still performed at normal speed. Each step of movement consumes a turn of greater haste.\n\nTurns of greater haste remaining: %d.
actors.buffs.godspeed.name=Godspeed
actors.buffs.godspeed.desc=Godly energy courses through your whole essence, allowing you to perform actions at incredible speeds!\n\nWhile under the effects of godspeed you will perform all actions at double speed.\n\nTurns of godspeed remaining: %s.
actors.buffs.haste.name=haste
actors.buffs.haste.desc=Energy courses through your muscles, allowing you to run at incredible speeds!\n\nWhile under the effects of haste you will run at 3x speed, but will perform all other actions at normal speed.\n\nTurns of haste remaining: %s.
actors.buffs.healing.name=healing
actors.buffs.healing.desc=A magical remedy is causing wounds to close and flesh to knit.\n\nEvery turn health will steadily regenerate until the healing effect expires. The amount of healing may fade over time.\n\nNext heal: %d.\n\nHealing remaining: %d.
actors.buffs.herodisguise.name=disguise
actors.buffs.herodisguise.desc=Illusory magic has altered your physical appearance! The effect is purely cosmetic, but feels very strange regardless.\n\nTurns of disguise remaining: %s.
actors.buffs.hex.name=hexed
actors.buffs.hex.heromsg=You have been hexed!
actors.buffs.hex.desc=Dark magic which saps focus, making the target slightly disoriented.\n\nHexing reduces accuracy and evasion by 20%%, making the target less effective in combat.\n\nTurns of hex remaining: %s.
actors.buffs.holdfast.name=hold fast
actors.buffs.holdfast.desc=The %s is holding his position, increasing their armor by %d-%d. This will last until they move.
actors.buffs.hunger.hungry=hungry
actors.buffs.hunger.starving=starving
actors.buffs.hunger.onhungry=You are hungry.
actors.buffs.hunger.onstarving=You are starving!
actors.buffs.hunger.ondeath=You starved to death...
actors.buffs.hunger.cursedhorn=The cursed horn steals some of the food energy as you eat.
actors.buffs.hunger.rankings_desc=Starved to Death
actors.buffs.hunger.desc_intro_hungry=You can feel your stomach calling out for food, but it's not too urgent yet.
actors.buffs.hunger.desc_intro_starving=You're so hungry it hurts.
actors.buffs.hunger.desc=\n\nHunger slowly increases as you spend time in the dungeon, eventually you will begin to starve. While starving you will slowly lose health instead of regenerating it.\n\nRationing is important! If you have health to spare starving isn't a bad idea if it means there will be more food later. Effective rationing can make food last a lot longer!
actors.buffs.invisibility.name=invisible
actors.buffs.invisibility.desc=You are completely blended into the surrounding terrain, making you impossible to see.\n\nWhile you are invisible enemies are unable to attack or follow you. Physical attacks and magical effects (such as scrolls and wands) will immediately cancel invisibility.\n\nTurns of invisibility remaining: %s.
actors.buffs.invulnerability.name=invulnerable
actors.buffs.invulnerability.desc=You are suffused with great protective power, granting you a brief period of invulnerability!\n\nTurns remaining: %s.
actors.buffs.levitation.name=levitating
actors.buffs.levitation.desc=A magical force is levitating you over the ground, making you feel weightless.\n\nLevitating characters move silently and ignore all ground-based effects. Traps won't trigger, water won't put out fire, plants won't be trampled, roots will miss, and pits will be hovered over. Be careful, as all these things can come into effect the second the levitation ends!\n\nTurns of levitation remaining: %s.
actors.buffs.lifelink.name=life link
actors.buffs.lifelink.desc=This character's life force is linked to another character nearby. Any damage taken is shared between them.\n\nWhenever this character takes damage, half of it will be dealt to the life link target instead.\n\nTurns of life link remaining: %s, or until the linked character dies.
actors.buffs.light.name=illuminated
actors.buffs.light.desc=Even in the Darkest Dungeon, a steady light at your side is always comforting.\n\nLight helps keep darkness at bay, allowing you to see a reasonable distance despite the environment.\n\nTurns of illumination remaining: %s.
actors.buffs.lockedfloor.name=floor is locked
actors.buffs.lockedfloor.desc=The current floor is locked, and you are unable to leave it!\n\nWhile a floor is locked, you will not gain hunger or take damage from starving. In addition, if you do not work towards defeating this floor's boss, passive regeneration effects will also stop.\n\nAdditionally, if you are revived by an unblessed ankh while the floor is locked, then it will reset.\n\nKill this floor's boss to break the lock.
actors.buffs.lostinventory.name=lost inventory
actors.buffs.lostinventory.desc=Your inventory has been lost somewhere in the dungeon! You won't be able to pick up or use most items until you retrieve it.
actors.buffs.magicalsight.name=magical sight
actors.buffs.magicalsight.desc=Somehow you are able to see with your mind, rather than your eyes.\n\nWhile magical sight is active you will be able to see through all terrain in a 12 tile radius.\n\nTurns of magical sight remaining: %s.
actors.buffs.magicalsleep.name=magical sleep
actors.buffs.magicalsleep.toohealthy=You are too healthy, and resist the urge to sleep.
actors.buffs.magicalsleep.fallasleep=You fall into a deep magical sleep.
actors.buffs.magicalsleep.wakeup=You wake up feeling refreshed and healthy.
actors.buffs.magicalsleep.desc=This character has fallen into a deep magical sleep which they will not wake from naturally.\n\nMagical sleep is similar to regular sleep, except that only damage will cause the target to wake up.\n\nFor the hero and their allies, magical sleep has some restorative properties, allowing them to rapidly heal while resting.
actors.buffs.magicimmune.name=immune to magic
actors.buffs.magicimmune.desc=All magical effects have lost their hold on you, you are completely impervious to them.\n\nWhile magic immune all harmful and helpful magical effects will not apply to you, including curses, enchants, wands, scrolls, rings, artifacts, etc. Heroic armor abilities are strong enough to work regardless of this effect.\n\nTurns of magic immunity remaining: %s.
actors.buffs.overload.name=Overload
actors.buffs.overload.desc=The reality is overloaded. Prepare to cry, suffer, kill and slaughter.\n\nThe death of any hostile creature triggers the spawn of other creature.\n\nTurns of overload remaining: %s.
actors.buffs.mindvision.name=mind vision
actors.buffs.mindvision.desc=Somehow you are able to see all creatures on this floor through your mind. It's a weird feeling.\n\nAll characters on this floor are visible to you as long as you have mind vision. Seeing a creature through mind vision counts as it being seen or nearby for the purposes of many magical effects.\n\nTurns of mind vision remaining: %s.
actors.buffs.momentum.momentum=building momentum
actors.buffs.momentum.running=freerunning
actors.buffs.momentum.resting=recovering
actors.buffs.momentum.action_name=freerun
actors.buffs.momentum.momentum_desc=As he moves, the Freerunner builds momentum, which he can spend to start freerunning.\n\nEach charge of momentum grants two turns of freerunning, and the Freerunner can build up to 10 charges. Momentum is rapidly lost when the Freerunner stops moving.\n\nCurrent momentum charge: %d.
actors.buffs.momentum.running_desc=As he moves, the Freerunner builds momentum, which he can spend to start freerunning.\n\nWhile freerunning, the Freerunner moves at double speed and gains bonus evasion based on his level.\n\nTurns remaining: %d.
actors.buffs.momentum.resting_desc=As he moves, the Freerunner builds momentum, which he can spend to start freerunning.\n\nThe Freerunner needs time to regain his stamina before building momentum again.\n\nTurns remaining: %d.
actors.buffs.monkenergy.name=energy
actors.buffs.monkenergy.action=Monk Abilities
actors.buffs.monkenergy.desc=As she defeats enemies, the Monk gains energy that she can use on a variety of abilities. Most enemies grant 1 energy when defeated, and the Monk does not lose energy over time.\n\nCurrent energy: %1$d/%2$d.
actors.buffs.monkenergy.desc_cooldown=The Monk has recently used an ability, and must wait before using another.\n\nCurrent cooldown: %d turns.
actors.buffs.monkenergy$monkability$flurry.name=flurry of blows
actors.buffs.monkenergy$monkability$flurry.desc=Two instant strikes that deal %1$d-%2$d damage and ignore armor. This ability cannot be used repeatedly.
actors.buffs.monkenergy$monkability$flurry.empower_desc=Two instant strikes that deal %1$d-%2$d damage, ignore armor, _and use your weapon's enchantment._ This ability cannot be used repeatedly.
actors.buffs.monkenergy$monkability$focus.name=focus
actors.buffs.monkenergy$monkability$focus.desc=The Monk takes a turn to focus, letting her parry the next attack made against her.
actors.buffs.monkenergy$monkability$focus.empower_desc=The Monk _instantly focuses,_ letting her parry the next attack made against her.
actors.buffs.monkenergy$monkability$focus$focusbuff.name=focused
actors.buffs.monkenergy$monkability$focus$focusbuff.desc=The Monk is focused on her surroundings, anticipating the next attack made against her. While focused, she is guaranteed to parry the next incoming attack.
actors.buffs.monkenergy$monkability$dash.name=dash
actors.buffs.monkenergy$monkability$dash.prompt=Choose a Location
actors.buffs.monkenergy$monkability$dash.desc=An instant dash up to 4 tiles away. This ability can go over hazards, but not through enemies or solid terrain.
actors.buffs.monkenergy$monkability$dash.empower_desc=An instant dash up to _8 tiles_ away. This ability can go over hazards, but not through enemies or solid terrain.
actors.buffs.monkenergy$monkability$dragonkick.name=dragon kick
actors.buffs.monkenergy$monkability$dragonkick.desc=A devastating kick that deals %1$d-%2$d damage and ignores armor. The kick knocks the target away and paralyzes them for each tile they travel.
actors.buffs.monkenergy$monkability$dragonkick.empower_desc=A devastating kick that deals _%1$d-%2$d damage_ and ignores armor. The kick knocks _all adjacent targets_ away and paralyzes them for each tile they travel.
actors.buffs.monkenergy$monkability$meditate.name=meditate
actors.buffs.monkenergy$monkability$meditate.desc=The Monk focuses energy into her body for 5 turns. This clears most negative effects and grants her 8 turns of wand and artifact recharging.
actors.buffs.monkenergy$monkability$meditate.empower_desc=The Monk focuses energy into her body for 5 turns. This clears most negative effects and grants her 8 turns of wand and artifact recharging. _She also gains 80% damage resistance while meditating, and slowly heals for 20% of her missing HP._
actors.buffs.killevolution.name=kill counter
actors.buffs.killevolution.action=Kill Abilities
actors.buffs.killevolution.desc=As they defeat enemies, the hero gains energy that they can use on a variety of abilities. Most enemies grant 1 energy when defeated, and the hero does not lose energy over time.\n\n_However, unequipping a weapon associated with this buff associated with will lose all of this energy and you need to start killing enemies again_\n\nCurrent energy: %1$d/%2$d.
actors.buffs.killevolution.desc_cooldown=The hero has recently used an ability, and must wait before using another.\n\nCurrent cooldown: %d turns.
actors.buffs.killevolution$killevolutionability$invisibledash.name=invisible dash
actors.buffs.killevolution$killevolutionability$invisibledash.prompt=Choose a Location
actors.buffs.killevolution$killevolutionability$invisibledash.desc=An instant dash up to 4 tiles away with an additional turn of invisibility allowing the hero to surprise attack. This ability can go over hazards, but not through enemies or solid terrain.
actors.buffs.killevolution$killevolutionability$invisibledash.empower_desc=An instant dash up to _8 tiles_ away with an additional turn of invisibility allowing the hero to surprise attack. This ability can go over hazards, but not through enemies or solid terrain.
actors.buffs.killevolution$killevolutionability$physicallyempowered.name=physical empower
actors.buffs.killevolution$killevolutionability$physicallyempowered.desc=The hero grants itself +2 bonus damage for 10 hits.
actors.buffs.killevolution$killevolutionability$physicallyempowered.empower_desc=The hero grants itself _+4 bonus damage_ for 10 hits.
actors.buffs.killevolution$killevolutionability$weaponupgrade.name=weapon upgrade
actors.buffs.killevolution$killevolutionability$weaponupgrade.desc=The hero upgrades their weapon (and Duelist's second weapon if there's any) permanently.
actors.buffs.killevolution$killevolutionability$weaponupgrade.empower_desc=The hero upgrades their weapon (and Duelist's second weapon if there's any) _twice_ permanently.
actors.buffs.killevolution$killevolutionability$chain.name=chain enemy
actors.buffs.killevolution$killevolutionability$chain.desc=The hero chains an enemy to pull them in closer range.
actors.buffs.killevolution$killevolutionability$immortalize.name=immortalize
actors.buffs.killevolution$killevolutionability$immortalize.desc=The hero grants itself immortality against all sources of damage for 15 turns.
actors.buffs.killevolution$killevolutionability$immortalize.empower_desc=The hero grants itself immortality against all sources of damage for _~22 turns_.
actors.buffs.ooze.name=caustic ooze
actors.buffs.ooze.heromsg=Caustic ooze eats your flesh. Wash it away!
actors.buffs.ooze.ondeath=You melt away...
actors.buffs.ooze.rankings_desc=Dissolved
actors.buffs.ooze.desc=This sticky acid clings to flesh, slowly melting it away.\n\nOoze will deal consistent damage over time, but can be immediately washed off in water.\n\nTurns of ooze remaining: %s.
actors.buffs.paralysis.name=paralysed
actors.buffs.paralysis.heromsg=You are paralysed!
actors.buffs.paralysis.out=resisted paralysis
actors.buffs.paralysis.desc=Oftentimes the worst thing to do is nothing at all.\n\nParalysis completely halts all actions, forcing the target to wait until the effect wears off. The pain from taking damage can cause characters to resist paralysis, breaking them out of the effect.\n\nTurns of paralysis remaining: %s.
actors.buffs.physicalempower.name=physically empowered
actors.buffs.physicalempower.desc=Your blows have been empowered, increasing the amount of damage you can deal when you hit enemies with physical attacks.\n\nBonus damage: %1$d.\nHits remaining: %2$d.
actors.buffs.pincushion.name=pincushion
actors.buffs.pincushion.desc=The thrown weapons you have used against this character are currently stuck to them and will fall to the floor after they are defeated.\n\nThe following items are currently attached:
actors.buffs.poison.name=poisoned
actors.buffs.poison.heromsg=You are poisoned!
actors.buffs.poison.ondeath=You died from poison...
actors.buffs.poison.rankings_desc=Succumbed to Poison
actors.buffs.poison.desc=Poison works its way through the body, slowly impairing its internal functioning.\n\nPoison deals damage each turn proportional to how long until it expires.\n\nTurns of poison remaining: %s.
actors.buffs.preparation.name=preparation
actors.buffs.preparation.action_name=prepared strike
actors.buffs.preparation.desc=The Assassin is walking nervously, preparing to thurst knife into target.
actors.buffs.preparation.desc_dmg=His next attack will deal _%1$d%% bonus damage_, and will execute regular enemies below _%2$d%% health_, or bosses below _%3$d%% health_.
actors.buffs.preparation.desc_dmg_likely=The attack will also be more likely to deal a larger amount of damage.
actors.buffs.preparation.desc_blink=He is able to blink towards an enemy before striking them, with a max distance of _%d._
actors.buffs.preparation.desc_invis_time=The Assassin has been running for _%d turns._
actors.buffs.preparation.desc_invis_next=His attack will become stronger at _%d turns._
actors.buffs.preparation.prompt=Select a target to attack!\nMax blink distance: %d
actors.buffs.preparation.no_target=There's nothing to attack there.
actors.buffs.preparation.out_of_reach=That target is out of reach.
actors.buffs.preparation.assassinated=assassinated
actors.buffs.marked.name=Marked
actors.buffs.marked.desc=The Hunter is waiting patiently, preparing to strike while his bbat weakens enemies.
actors.buffs.marked.desc_dmg=The bbat deals %s%% more damage to this enemy. You will be able to jump to marked enemy at any moment, but more bonus damage means more debuffs.
actors.buffs.marked.prompt=Select a target to teleport!\nMax blink distance: your view distance
actors.buffs.marked.no_target=There's nothing to teleport there.
actors.buffs.marked.out_of_reach=That target is out of reach.
actors.buffs.marked.assassinated=assassinated
actors.buffs.marked.desc_poison=At this point, you will _poison_ a target, dealing damage over time.
actors.buffs.marked.desc_cripple=At this point, you will _cripple_ the legs of target, reducing its movement speed.
actors.buffs.marked.desc_blinding=At this point, you will also make target _blind_,reducing its field of view to 1 tile.
actors.buffs.marked.desc_bleeding=At this point, you will also make target _bleed_,dealing damage over time.
actors.buffs.marked.desc_vulnerable=At this point, you will also _increase physical damage_ to enemy.
actors.buffs.marked.desc_hexed=At this point, you will also stun target, _reducing its accuracy and dexterity_ for short time.
actors.buffs.marked.desc_slow=At this point, you will also disorientate target, _slowing_ its actions.
actors.buffs.marked.desc_ooze=At this point, you will also apply deadly _caustic ooze_ to target, dealing damage over time until target finds water.
actors.buffs.marked.desc_paralysis=At this point, you will completely _paralyse_ the enemy, rendering it unable to attack.
actors.buffs.marked.desc_doom=At this point, you will also curse the enemy, _significantly increasing any damage to it_.
actors.buffs.prismaticguard.name=prismatic Guard
actors.buffs.prismaticguard.desc=You are being guarded by a prismatic image which is currently inactive. When enemies are present the prismatic image will spring to action and protect you!\n\nWhile inactive, the prismatic image will steadily recover from any damage it has taken.\n\nCurrent HP: %d/%d.
actors.buffs.recharging.name=recharging
actors.buffs.recharging.desc=Energy is coursing through you, improving the rate that your wands and staffs charge.\n\nEach turn this buff will increase current charge by one quarter, in addition to regular recharge.\n\nTurns of recharging remaining: %s.
actors.buffs.revealedarea.name=revealed area
actors.buffs.revealedarea.desc=An area of the dungeon has been temporarily revealed to the hero, They will see it no matter where they are.\n\nTurns remaining: %s.
actors.buffs.revealedchar.name=revealed
actors.buffs.revealedchar.desc=This character is revealed to the hero, They will be visible no matter where they are.\n\nTurns remaining: %s.
actors.buffs.roots.name=rooted
actors.buffs.roots.heromsg=You can't move!
actors.buffs.roots.desc=Roots (magical or natural) grab at the feet, forcing them down to the ground.\n\nRoots lock a target in place, making movement and most movement abilities impossible. Other actions are not affected, including teleportation effects.\n\nTurns of root remaining: %s.
actors.buffs.scrollempower.name=scroll empower
actors.buffs.scrollempower.desc=The energy from the Mage's recently read scroll is empowering his wands!\n\nLevel Boost: +%1$d.\nZaps remaining: %2$d.
actors.buffs.shadows.name=shadowmelded
actors.buffs.shadows.desc=You are blended into the shadows around you, granting you invisibility and slowing your metabolism.\n\nWhile you are invisible enemies are unable to attack or follow you. Most physical attacks and magical effects (such as scrolls and wands) will immediately cancel invisibility. Additionally, while shadowmelded, your rate of hunger is slowed.\n\nYou will remain shadowmelded until you leave the shadows or an enemy comes into contact with you.
actors.buffs.slow.name=slowed
actors.buffs.slow.desc=Slowing magic affects the target's rate of time, to them everything is moving super-fast.\n\nA slowed character performs all actions in twice the amount of time they would normally take.\n\nTurns of slow remaining: %s.
actors.buffs.snipersmark.name=sniper's mark
actors.buffs.snipersmark.action_name_snapshot=snapshot
actors.buffs.snipersmark.action_name_volley=volley
actors.buffs.snipersmark.action_name_sniper=sniper shot
actors.buffs.snipersmark.desc=The Sniper is honed in on the target she most recently attacked. She is able to perform a special attack with her bow which will vary based on how the bow is augmented.\n\nAn unaugmented bow will fire a _snapshot,_ which deals reduced damage but does not take any time to fire.\n\nA bow augmented for speed will fire a _volley_ of three arrows. Each arrow will deal reduced damage, but can still activate enchantment. This volley takes 1 turn to shoot.\n\nA bow augmented for damage will fire a _sniper shot._ This shot is guaranteed to hit, deals bonus damage based on distance from the target, and takes 2 turns to fire.\n\nTurns remaining: %s.
actors.buffs.soulmark.name=soul marked
actors.buffs.soulmark.desc=The warlock has tapped into the soul of this creature, allowing him to heal as it takes physical damage.\n\nTurns of soul mark remaining: %s.
actors.buffs.stamina.name=stamina
actors.buffs.stamina.desc=You have unending stamina, allowing for faster movement!\n\nWhile under the effects of stamina you will run at +50%% speed, but will perform all other actions at normal speed.\n\nTurns of stamina remaining: %s.
actors.buffs.vulnerable.name=vulnerable
actors.buffs.vulnerable.heromsg=You feel fragile!
actors.buffs.vulnerable.desc=Vulnerability magic increases all physical damage that a character takes by 33%%, after that damage has been reduced by armor.\n\nTurns of vulnerable remaining: %s.
actors.buffs.terror.name=terrified
actors.buffs.terror.desc=Terror is manipulative magic which forces its target into an uncontrollable panic.\n\nTerrified characters are forced to run away from their opponent, trying to put as many doors and walls between them as possible. The shock of pain will lessen the duration of terror, however.\n\nTurns of terror remaining: %s.
actors.buffs.toxicimbue.name=imbued with toxicity
actors.buffs.toxicimbue.desc=You are imbued with poisonous energy!\n\nAs you move around toxic gas will constantly billow forth from you, damaging your enemies. You are immune to toxic gas and poison for the duration of the effect, as well as for a few turns afterward.\n\nTurns of toxic imbue remaining: %s.
actors.buffs.corrosion.name=corrosion
actors.buffs.corrosion.heromsg=You are melting!
actors.buffs.corrosion.ondeath=You melt away...
actors.buffs.corrosion.rankings_desc=Dissolved
actors.buffs.corrosion.desc=Powerful acid melts away flesh, metal, and bone at an alarming rate.\n\nCorrosion damage increases over time, as the target continues to melt away.\n\nTurns of corrosion remaining: %1$s.\nCurrent corrosion damage: %2$d.
actors.buffs.vertigo.name=vertigo
actors.buffs.vertigo.desc=Walking in a straight line can be difficult when the whole world is spinning.\n\nWhile under the effects of vertigo, characters who attempt to move will go in a random direction, instead of the one they intended to go in.\n\nTurns of vertigo remaining: %s.
actors.buffs.wandempower.name=wands empowered
actors.buffs.wandempower.desc=Your damage-dealing wands have been empowered, increasing the amount of damage they deal for a few hits.\n\nBonus damage: %1$d.\nHits remaining: %2$d.
actors.buffs.weakness.name=weakened
actors.buffs.weakness.heromsg=You feel weakened!
actors.buffs.weakness.desc=Everything suddenly seems much heavier.\n\nWeakening magic reduces a character's physical strength, causing them to deal 33%% reduced damage.\n\nTurns of weakness remaining: %s.
actors.buffs.wellfed.name=well fed
actors.buffs.wellfed.desc=You feel quite satisfied and full.\n\nWhile well fed, your hunger will not increase, and you will heal an additional amount of health over time.\n\nTurns remaining: %d.
actors.buffs.danceimmunebuff.name=immune to dance curse
actors.buffs.danceimmunebuff.desc=All dancing effects loses all its power for a short time, well extending the effect is not effective, you must wait for this effect to wear down before using the spell again.\n\nTurns of magic immunity remaining: %s.
actors.hero.abilities.armorability.self_target=You can't target yourself!
actors.hero.abilities.armorability.no_target=There's nothing to target there!
actors.hero.abilities.armorability.prompt=Choose a location to target
actors.hero.abilities.armorability.cost=Charge cost: _%d_
actors.hero.abilities.warrior.heroicleap.name=heroic leap
actors.hero.abilities.warrior.heroicleap.prompt=Choose direction to leap
actors.hero.abilities.warrior.heroicleap.short_desc=The Warrior performs a _Heroic Leap_ towards a targeted location, sailing above enemies and hazards.
actors.hero.abilities.warrior.heroicleap.desc=The Warrior leaps toward a targeted location, going over any enemies or hazards in the way. He cannot leap over walls or other solid terrain however.
actors.hero.abilities.warrior.shockwave.name=shockwave
actors.hero.abilities.warrior.shockwave.short_desc=The Warrior releases a _Shockwave_ in a conical AOE by slamming the ground. Enemies caught in the shockwave are damaged and crippled.
actors.hero.abilities.warrior.shockwave.desc=The Warrior slams the ground, producing a shockwave that travels up to 5 tiles in a 60 degree cone.\n\nEnemies caught in this shockwave are crippled for 5 turns. They also take 5-10 damage, plus an additional 1-2 damage for every point of strength the Warrior has above 10.
actors.hero.abilities.warrior.endure.name=endure
actors.hero.abilities.warrior.endure$enduretracker.name=endurance
actors.hero.abilities.warrior.endure$enduretracker.desc=The Warrior is now dealing bonus damage based on the damage he endured.\n\nBonus Damage: %1$d\nHits Left: %2$d
actors.hero.abilities.warrior.endure.short_desc=The Warrior _Endures_, skipping several turns but gaining high damage resistance. He then deals bonus damage based on what he endured.
actors.hero.abilities.warrior.endure.desc=The Warrior endures for 3 turns, taking half damage from all sources. This reduction is applied before damage resisting effects like armor.\n\nAfter enduring, the warrior's next hit within 10 turns gains bonus damage. This bonus damage is equal to half of all the damage inflicted on him while enduring, before any damage reduction effects!\n\nIf the Warrior has any combo, using this ability increases its remaining time by 3 turns.
actors.hero.abilities.mage.elementalblast.name=elemental blast
actors.hero.abilities.mage.elementalblast.no_staff=You can't use this ability without your staff.
actors.hero.abilities.mage.elementalblast.short_desc=The Mage emits an _Elemental Blast_ from his staff, covering a large area around him in an effect that varies based on the wand in his staff.
actors.hero.abilities.mage.elementalblast.desc=The Mage emits a blast of magic, which covers a circular region up to 4 tiles away and deals up to 15-25 damage. The specific effect of elemental blast will vary by the wand imbued in the Mage's staff.
actors.hero.abilities.mage.elementalblast.generic_desc=The effect of elemental blast will be similar to the effect of the wand when zapped at an enemy or ally.
actors.hero.abilities.mage.wildmagic.name=wild magic
actors.hero.abilities.mage.wildmagic.no_wands=You have no wands to zap with!
actors.hero.abilities.mage.wildmagic.short_desc=The Mage unleashes the _Wild Magic_ contained in his wands, randomly firing them multiple times at a chosen target over a single turn.
actors.hero.abilities.mage.wildmagic.desc=The Mage unleashes the power in his wands, randomly firing them up to 4 times in a single turn. The Mage's staff is not included in this effect.\n\nEach wand also has its level boosted by 2, up to +3. This ability uses half a wand charge for each zap, and no one wand can be fired more than 2 times.
actors.hero.abilities.mage.warpbeacon.name=warp beacon
actors.hero.abilities.mage.warpbeacon.depths=You can't warp between depths!
actors.hero.abilities.mage.warpbeacon.locked_floor=You cannot leave a locked floor!
actors.hero.abilities.mage.warpbeacon.too_far=That location is too far!
actors.hero.abilities.mage.warpbeacon.invalid_beacon=You can't place a beacon there!
actors.hero.abilities.mage.warpbeacon.window_desc=Your beacon is currently placed on floor %d.
actors.hero.abilities.mage.warpbeacon.window_tele=teleport to beacon
actors.hero.abilities.mage.warpbeacon.window_clear=clear beacon
actors.hero.abilities.mage.warpbeacon.window_cancel=cancel
actors.hero.abilities.mage.warpbeacon.short_desc=The Mage places a _Warping Beacon_ at his current location, which he can instantly teleport back to.
actors.hero.abilities.mage.warpbeacon.desc=The Mage places a beacon, which can then be warped to at will. Placing the beacon takes 1 turn, but warping to it is instantaneous.\n\nThe Mage cannot warp between floors by default, or use the beacon to reach inaccessible places such as locked rooms. The Mage can teleport into enemies, which will push them aside.
actors.hero.abilities.rogue.smokebomb.name=smoke bomb
actors.hero.abilities.rogue.smokebomb.fov=You can only jump to an empty location in your field of view
actors.hero.abilities.rogue.smokebomb.prompt=Choose a location to jump to
actors.hero.abilities.rogue.smokebomb$ninjalog.name=wooden decoy
actors.hero.abilities.rogue.smokebomb$ninjalog.desc=Somehow, enemies are easily convinced that this wooden decoy is the real Rogue!
actors.hero.abilities.rogue.smokebomb.short_desc=The Rogue throws down a _Smoke Bomb_ while blinking away. He blinds enemies near his old location.
actors.hero.abilities.rogue.smokebomb.desc=The Rogue throws down a smoke bomb and blinks up to 6 tiles away. He can blink through hazards and enemies, but not through solid terrain like walls.\n\nEnemies that are adjacent to the Rogue's old position will be blinded for 5 turns.
actors.hero.abilities.rogue.deathmark.name=death mark
actors.hero.abilities.rogue.deathmark.ally_target=You can only mark enemies
actors.hero.abilities.rogue.deathmark.short_desc=The Rogue places a _Death Mark_ on a chosen enemy. Marked enemies take bonus damage, but cannot die until the mark ends.
actors.hero.abilities.rogue.deathmark.desc=The Rogue places a mark on a chosen enemy, causing them to take 25% extra damage. The mark is applied instantly and lasts for 5 turns.\n\nMarked enemies take bonus damage but are unable to die until the mark expires. If an enemy has 0 HP when the mark ends, they will immediately die.
actors.hero.abilities.rogue.deathmark$deathmarktracker.name=marked for death
actors.hero.abilities.rogue.deathmark$deathmarktracker.desc=This enemy has been marked, causing them to take 25%% bonus damage, but also rendering them unable to die until the mark ends.\n\nTurns remaining: %s.
actors.hero.abilities.rogue.shadowclone.name=shadow clone
actors.hero.abilities.rogue.shadowclone.short_desc=The Rogue summons a _Shadow Clone_, which can be directed to aid him in combat.
actors.hero.abilities.rogue.shadowclone.desc=The Rogue summons a shadowy mimic of himself, which can be directed to aid him in combat. Directing the shadow clone does not cost any charge.\n\nThe clone has 80 HP, no armor, and deals 10-20 damage. All of these traits can be improved with talents, such that the clone benefits from weapons and armor the hero has.
actors.hero.abilities.rogue.shadowclone$shadowally.name=shadow rogue
actors.hero.abilities.rogue.shadowclone$shadowally.direct_defend=Your clone moves to that position.
actors.hero.abilities.rogue.shadowclone$shadowally.direct_follow=Your clone moves to follow you.
actors.hero.abilities.rogue.shadowclone$shadowally.direct_attack=Your clone moves to attack!
actors.hero.abilities.rogue.shadowclone$shadowally.desc=A copy of the Rogue, made from shadowy darkness. It stands stock still, with empty eyes and tiny wisps of darkness rising from it like steam.\n\nThe clone is not a perfect copy of the Rogue, but is still a decent fighter, and can benefit from the Rogue's equipment with the right talents.
actors.hero.abilities.huntress.spectralblades.name=spectral blades
actors.hero.abilities.huntress.spectralblades.short_desc=The Huntress throws _Spectral Blades_ at a target, inflicting damage depending on her currently equipped melee weapon.
actors.hero.abilities.huntress.spectralblades.desc=The Huntress throws out a spectral blade at an enemy, which acts like a ranged strike from her melee weapon. All of the normal effects of a melee weapon will activate, including enchantments.
actors.hero.abilities.huntress.naturespower.name=nature's power
actors.hero.abilities.huntress.naturespower.short_desc=The Huntress calls upon _Nature's Power_, increasing her movement speed and her bow's rate of fire for a short time.
actors.hero.abilities.huntress.naturespower.desc=The Huntress temporarily empowers herself and her bow with the power of nature! This lasts for 8 turns.\n\nDuring this time, the Huntress moves at 2x speed, and attacks 33% faster with her bow. The bonus bow effects do not trigger if the Sniper is using her special attacks.
actors.hero.abilities.huntress.naturespower$naturespowertracker.name=nature's power
actors.hero.abilities.huntress.naturespower$naturespowertracker.desc=The Huntress is briefly empowered, increasing her movement speed and attack speed with her bow.\n\nTurns remaining: %s.
actors.hero.abilities.huntress.spirithawk.name=spirit hawk
actors.hero.abilities.huntress.spirithawk.no_space=There is no free space near you.
actors.hero.abilities.huntress.spirithawk.short_desc=The Huntress summons a _Spirit Hawk_ familiar, which can help her scout locations and distract enemies.
actors.hero.abilities.huntress.spirithawk.desc=The Huntress summons a spirit hawk familiar, which can be directed by using the ability again while it is summoned. The hawk lasts for 100 turns, directing the hawk does not cost any charge.\n\nThe hawk has minimal health and attacking power, but is fast, evasive, and accurate. It shares its entire field of vision with the Huntress at all times. It is immune to all area-bound effects, such as fire and poison gas. It will not attack unless specifically directed to.
actors.hero.abilities.huntress.spirithawk$hawkally.name=spirit hawk
actors.hero.abilities.huntress.spirithawk$hawkally.direct_defend=Your hawk moves to that position.
actors.hero.abilities.huntress.spirithawk$hawkally.direct_follow=Your hawk moves to follow you.
actors.hero.abilities.huntress.spirithawk$hawkally.direct_attack=Your hawk moves to attack!
actors.hero.abilities.huntress.spirithawk$hawkally.desc=A magical hawk, summoned by the Huntress. It glows a bright ethereal blue, its head constantly shifts around as it surveys the area.\n\nWhile it isn't much of a fighter its speed and vision make it excellent for scouting and distracting enemies.
actors.hero.abilities.huntress.spirithawk$hawkally.desc_remaining=Turns remaining: %d.
actors.hero.abilities.huntress.spirithawk$hawkally.desc_dodges=Guaranteed dodges remaining: %d.
actors.hero.abilities.duelist.challenge.name=challenge
actors.hero.abilities.duelist.challenge.prompt=Choose an enemy to challenge
actors.hero.abilities.duelist.challenge.already_dueling=You can only be in one duel at a time.
actors.hero.abilities.duelist.challenge.ally_target=You can only challenge enemies.
actors.hero.abilities.duelist.challenge.unreachable_target=You must be able to reach your target.
actors.hero.abilities.duelist.challenge.distant_target=That enemy is too far away to challenge.
actors.hero.abilities.duelist.challenge.short_desc=The Duelist _Challenges_ a nearby enemy to a duel, temporarily freezing all other enemies.
actors.hero.abilities.duelist.challenge.desc=The Duelist challenges a nearby enemy to a duel. That enemy is compelled to fight her while all other enemies are temporarily frozen in time.\n\nThe target must be reachable and within 5 tiles of the Duelist. The duel lasts until 10 turns pass, the enemy dies, or the Duelist is more than 5 tiles away from the enemy.\n\nFrozen enemies are invulnerable. The Duelist's allies are not frozen by this ability, but if a boss is targeted its minions will not be frozen either.
actors.hero.abilities.duelist.challenge$duelparticipant.name=duel participant
actors.hero.abilities.duelist.challenge$duelparticipant.desc=This character is participating in a duel. They, and any of their allies or minions, are allowed to act normally while others are frozen.\n\nThe duel will last for a set amount of time, until one participant dies, or until the participants move more than 5 tiles away from eachother.\n\nTurns remaining: %d.
actors.hero.abilities.duelist.elementalstrike.name=elemental strike
actors.hero.abilities.duelist.elementalstrike.short_desc=The Duelist performs an _Elemental Strike_, spreading an effect in a conical AOE based on her weapon enchantment.
actors.hero.abilities.duelist.elementalstrike.desc=The Duelist strikes an enemy or location, performing a regular attack that's guaranteed to hit and spreading a magical effect that travels up to 4 tiles in a 65 degree cone. This magical effect varies based on the enchantment on the Duelist's primary weapon.
actors.hero.abilities.duelist.elementalstrike.generic_desc=An elemental strike with no enchantment will release a small burst of magic, dealing 6-12 damage to all enemies in range.
actors.hero.abilities.duelist.feint.name=feint
actors.hero.abilities.duelist.feint.prompt=Choose a location to dash to
actors.hero.abilities.duelist.feint.too_far=That location is not adjacent to you.
actors.hero.abilities.duelist.feint.bad_location=You can't move to that location.
actors.hero.abilities.duelist.feint.short_desc=The Duelist _Feints_, faking an attack while dashing to an adjacent tile. Enemies will attack her afterimage, leaving them open to a counterattack.
actors.hero.abilities.duelist.feint.desc=The Duelist fakes an attack while dashing to an adjacent tile, leaving behind a momentary afterimage of herself. Enemies that were attacking the Duelist will attack her afterimage instead.\n\nEnemies that attack the afterimage become confused, which cancels their next action and leaves them open to a surprise attack.
actors.hero.abilities.ratmogrify.name=ratmogrify
actors.hero.abilities.ratmogrify.cant_transform=You can't ratmogrify that!
actors.hero.abilities.ratmogrify.too_strong=That enemy is too strong to ratmogrify!
actors.hero.abilities.ratmogrify.short_desc=The hero _Ratmogrifies_ an enemy! This temporarily turns them into a rat with no abilities.
actors.hero.abilities.ratmogrify.desc=The hero transforms an enemy into a rat for 6 turns! Bosses, allies, and rats cannot be ratmogrified.\n\nRatmogrified enemies retain their original stats, but do not have any abilities.
actors.hero.abilities.ratmogrify$transmograt.name=ratmogrified %s
actors.hero.abilities.ratmogrify$transmograt.desc=This enemy has been transformed into a rat. A big improvement, if you ask me! - Rat King
actors.hero.abilities.ratmogrify$transmograt.rankings_desc=Slain by: ratmogrified enemy
actors.hero.abilities.ratking.legacywrath.name=divine fury
actors.hero.abilities.ratking.legacywrath.short_desc=I unleash my _Divine Fury_ upon my enemies. It leaves me exposed for a few turns and drains all my armor charge. Everything must come at price!
actors.hero.abilities.ratking.legacywrath.desc=I unlock the ability to channel overwhelming power. With it, I can blink to any nearby location no further than 6 tiles, blinding any enemies adjacent to my old location. Once there, I will cast a spell of magical earth on everyone I can see in 6 tiles area (the effect depends on talents) and create a fan of spectral blades targeting any mob within 6 tiles of me before turning invisible.\n\nThis ability takes 2 turns to leap, 1 turn to rooting earth, and one turn to spectral blades, though using this with no enemies in sight will skip the attacking.\n\nUnfortunately, _I have to use all of my armor charge or 33% of my current HP_ to get enough power for this ability.
actors.hero.hero.name=you
actors.hero.hero.leave=You can't leave yet, the rest of the dungeon awaits below!
actors.hero.hero.level_up=Level up!
actors.hero.hero.new_level=Level up! +Accuracy, +Evasion, +5 HP!
actors.hero.hero.new_talent=+1 Talent Point!
actors.hero.hero.unspent=You have unspent talent points!
actors.hero.hero.level_cap=You cannot grow stronger, but your experiences do give you a surge of power!
actors.hero.hero.you_now_have=you picked up: %s.
actors.hero.hero.you_cant_have=you can't carry: %s.
actors.hero.hero.locked_chest=This chest is locked and you don't have a matching key.
actors.hero.hero.locked_door=You don't have a matching key.
actors.hero.hero.noticed_smth=You noticed something.
actors.hero.hero.wait=...
actors.hero.hero.search=search
actors.hero.hero.search_distracted=It's hard to concentrate, searching is exhausting.
actors.hero.hero.pain_resist=The pain helps you resist the urge to sleep.
actors.hero.hero.revive=The ankh explodes with life-giving energy!
actors.hero.heroclass.warrior=warrior
actors.hero.heroclass.warrior_desc_short=The Warrior endures extra damage with shielding granted by his _broken seal._ The seal can be moved between armors and _transfers a single upgrade._
actors.hero.heroclass.warrior_desc=The Warrior starts with a _unique broken seal_ that generates shielding over his health. The seal can be moved between armors, and can _transfer a single upgrade_ with it.\n\nThe Warrior also starts with a _worn shortsword_, _three throwing stones_, cloth armor, a waterskin, and a velvet pouch.\n\nThe Warrior automatically identifies:\n_-_ Scrolls of Identify\n_-_ Potions of Healing\n_-_ Scrolls of Rage
actors.hero.heroclass.warrior_unlock=The Warrior is automatically unlocked.
actors.hero.heroclass.warrior_perk_desc=The Warrior gains _non-stackable 1 + (5% of current STR rounded down)_ temporary strength within _60 + (5 * current level) turns_ from eating and will be protected from taking any damage for duration of eating.\n\nThe Warrior can blind any enemy for _5 turns_ by throwing non-missiles at it. This ability has _40 turns_ cooldown.\n\nThe Warrior has _15%_ more strength, rounded down.\n\nThe Warrior can transfer any glyphs with his seal.\n\nThe Warrior regenerates his health and shielding _two times_ faster than usual.
actors.hero.heroclass.mage=mage
actors.hero.heroclass.mage_desc_short=The Mage is an arcane expert and carries a _magical staff_ that's stronger than a wand. The staff can be _imbued with any wand_ the Mage finds.
actors.hero.heroclass.mage_desc=The Mage starts with a _unique staff_, which recharges significantly faster than a wand and has 1 more charge. The staff _can be imbued with any wand_ the Mage finds in the dungeon.\n\nThe Mage also starts with a _wand of magic missile_ imbued in his staff, cloth armor, a waterskin, and a velvet pouch.\n\nThe Mage automatically identifies:\n_-_ Scrolls of Identify\n_-_ Potions of Liquid Flame\n_-_ Scrolls of Upgrade
actors.hero.heroclass.mage_unlock=To unlock the Mage _use a scroll of upgrade to make an item stronger._
actors.hero.heroclass.mage_perk_desc=The Mage gets _12 turns_ of recharging from eating.\n\nThe Mage instantly identifies any wands he picks up.\n\nThe Mage can self-target with a wand to convert all of its charges into shielding at a rate of _10.5% max HP per charge_.\n\nWhen the Mage zaps an enemy, he gains mind vision on them for _10 turns_.\n\nWhen the Mage reads a scroll, his next _3 wand zaps_ will get +(hero level/5) levels. He also has _33% chance_ to get scroll from the enemy.
actors.hero.heroclass.rogue=rogue
actors.hero.heroclass.rogue_desc_short=The Rogue can evade enemies and strike from invisibility using his _cloak of shadows._ He also _detects secrets and traps_ from a greater distance.
actors.hero.heroclass.rogue_desc=The Rogue starts with a _unique Cloak of Shadows_, which he can use to become invisible at will.\n\nThe Rogue can _detect secrets and traps_ from a greater distance.\n\nThe Rogue also starts with _a dagger_, _three throwing knives_, cloth armor, a waterskin, and a velvet pouch.\n\nThe Rogue automatically identifies:\n_-_ Scrolls of Identify\n_-_ Potions of Invisibility\n_-_ Scrolls of Magic Mapping
actors.hero.heroclass.rogue_unlock=To unlock the Rogue _perform 10 surprise attacks in one game._
actors.hero.heroclass.rogue_perk_desc=The Rogue will not wake sleeping enemies while he is _3 or more tiles away from them_.\n\nThe Rogue can search in _7x7_ area and will knock adjacent enemies away with chip damage while searching.\n\nThe Rogue can use Cloak of Shadows without equipping it but it will recharge at 66% speed.\n\nOn using Scroll of Upgrade, the Rogue will charge all his wands by _1_ charge and get _10 turns_ worth of artifact recharging.\n\nThe Rogue's bombs deal _150%_ more damage and drop from any enemy with 10% chance.
actors.hero.heroclass.huntress=huntress
actors.hero.heroclass.huntress_desc_short=The Huntress is a master of thrown weapons and has a _magical bow_ with infinite arrows. She also travels through tall grass _without trampling it._
actors.hero.heroclass.huntress_desc=The Huntress starts with a _unique spirit bow_, which can fire an infinite number of conjured arrows.\n\nThe Huntress can travel through tall grass _without trampling it_.\n\nThe Huntress also starts with _studded gloves_, cloth armor, a waterskin, and a velvet pouch.\n\nThe Huntress automatically identifies:\n_-_ Scrolls of Identify\n_-_ Potions of Mind Vision\n_-_ Scrolls of Lullaby
actors.hero.heroclass.huntress_unlock=To unlock the Huntress _hit enemies with thrown weapons 10 times in one game._
actors.hero.heroclass.huntress_perk_desc=The Huntress identifies equipment _3x_ faster.\n\nWhen the Huntress steps on short grass or embers, they spring up into tall grass which the Huntress immediately furrows. This has a _5 turn cooldown_. This talent will produce furrowed grass if passive regeneration effects are disabled or the hero has not gained exp in a long time.\n\nThe Huntress gains mind vision on any enemy within _3 tiles of her position_.\n\nThe Huntress gets _5 turns_ of adrenaline from eating.\n\nThe Huntress has 8% chance to get _1-3_ alchemical energy after killing the enemy.
actors.hero.heroclass.rat_king=rat king
actors.hero.heroclass.rat_king_desc_short=My short description is than I am awesome as king could possibly be!
actors.hero.heroclass.rat_king_desc=Why choose a class when I could just go as myself?\n\nAs myself, I take all the special class items I could find: an old seal, a staff made by some mage, a priceless cloak of shadows from my treasury, and a bow from my armory.\n\nI start with all my class items, obviously. Also I've already acquired all the bags, so I start with those too.\nI can also detect traps and secrets from a greater distance.\
actors.hero.heroclass.rat_king_perk_desc=What? I don't need any help! I am strong enough by myself!
actors.hero.heroclass.duelist=duelist
actors.hero.heroclass.duelist_desc_short=The Duelist is a weapons master who can use her weapon to trigger a _special weapon ability._ This special ability is _different for every weapon._
actors.hero.heroclass.duelist_desc=The Duelist starts with a _unique rapier_ with a special ability that recharges over time.\n\nEvery weapon in the game has a _different special ability_ that the Duelist can use.\n\nThe Duelist also starts with _two throwing spikes_, cloth armor, a waterskin, and a velvet pouch.\n\nThe Duelist automatically identifies:\n_-_ Scrolls of Identify\n_-_ Potions of Strength\n_-_ Scrolls of Mirror Image
actors.hero.heroclass.duelist_unlock=To unlock the Duelist _equip a tier 2 or higher weapon with no strength penalty._
actors.hero.heroclass.duelist_perk_desc=The Duelist gets _2 weapon charge_ and bonus melee damage equal to _level/2_ on eating.\n\nThe Duelist gains one weapon charge every _10 turns_ and deals _+8%_ melee damage when under the effect of wand or artifact recharging buffs.\n\nThe Duelist can switch her equipped weapon instantly _twice within 5 turns_, with a 20 turn cooldown.\nIf this ability is not on cooldown, quick-using an unequipped weapon will equip it.\n\nIf the Duelist's ability manages to kill any enemy, she will restore HP equal to _her level_.\n\nThe Duelist gets _+50%_ enchantment power for her attacks.
actors.hero.herosubclass.gladiator=gladiator
actors.hero.herosubclass.berserker=berserker
actors.hero.herosubclass.berserker_short_desc=The _Berserker_ builds rage as he takes damage. Rage increases his damage and can be activated at 100% for bonus shielding.
actors.hero.herosubclass.berserker_desc=The Berserker gains rage as he takes physical damage, including damage that gets blocked by his armor! Rage steadily fades away over time, but fades more slowly if he is at low HP.\n\nThe Berserker deals up to +50% damage at 100% rage. At 100% rage he can also go berserk, gaining 2-6x his seal's maximum shielding depending on his missing health and keeping his rage at 100% as long as he has shielding left. However, the Berserker needs time to recover after he goes berserk.\n\nHis rage will trigger enchantments and curses up to 60% more frequently and decay much slower.
actors.hero.herosubclass.gladiator_short_desc=The _Gladiator_ builds combo when he makes successful attacks. He can spend combo to use unique abilities.
actors.hero.herosubclass.gladiator_desc=The Gladiator builds one point of combo every time he makes a successful attack with a melee or thrown weapon. If the Gladiator does not make a successful attack within 5 turns, his combo is reset.\n\nAs combo builds it unlocks various abilities which he can spend his combo to use:\n2 Combo: knock enemy back, preserves combo; when combo is 7 or higher, knockback range increases to 3, it inflicts vertigo, and it can knock enemies into pits\n4 Combo: deal damage based on armor\n6 Combo: parry, preserves combo; when combo is 9 or higher, works on multiple attacks\n8 Combo: damage target and nearby enemies\n10 Combo: attack once for each combo\n\nWhen the Gladiator kills an enemy, the combo cooldown for his next hit is increased to _50 turns_.\n\nThe Gladiator can leap up to combo/3 tiles when using combo-spending attacks.
actors.hero.herosubclass.battlemage=battlemage
actors.hero.herosubclass.battlemage_short_desc=The _Battlemage_ conjures bonus effects when fighting in melee with his staff. These effects depend on the wand his staff is imbued with.
actors.hero.herosubclass.battlemage_desc=The Battlemage gains a bonus effect whenever he strikes in melee with his staff, as if his staff had an additional enchantment. These effects depend on the wand his staff is imbued with, every wand has its own effect. In addition to the wand effects, the Battlemage's staff will also gain 0.5 charges when he strikes with it.\n\nThe Battlemage's first melee strike with his staff after zapping with it deals double damage and staff's bonus effect gets +300% power.\n\nStriking with his staff grants the Battlemage _2 turns_ worth of artifact recharging.
actors.hero.herosubclass.warlock=warlock
actors.hero.herosubclass.warlock_short_desc=The _Warlock_ has a chance to soul mark enemies with his wands. He will heal whenever he deals physical damage to marked enemies.
actors.hero.herosubclass.warlock_desc=The Warlock has a chance to inflict a soul mark on characters when he uses wands on them. The chance to apply a soul mark and its duration increase with wand level.\n\nWhen an enemy is soul marked, the Warlock will heal 2 hp for every 5 damage he deals to them, but only with attacks from melee or thrown weapons, not from wands!\n\nWhen a soul marked enemy dies, the Warlock has a _50% chance_ to raise them as a corrupted wraith.\n\nSoul mark grants 1.5 turns of satiety for each physical damage dealt. Soul marked enemies have a 40% chance to trigger on-eat effects when they die.
actors.hero.herosubclass.assassin=hunter
actors.hero.herosubclass.assassin_short_desc=The _Hunter_ marks enemies with his bbat and inflicts debuffs with it.
actors.hero.herosubclass.assassin_desc=The _Hunter_ is trained to control darkness and use it to hunt targets with his bbat. His pet marks enemies and progressively does more damage. When any enemy is marked, the hunter can blink to it, inflicting debuffs and healing bbat depending on strength of mark.
actors.hero.herosubclass.freerunner=freerunner
actors.hero.herosubclass.freerunner_short_desc=The _Freerunner_ builds momentum as he runs, which can be used to start freerunning. This grants him bonus speed and evasion for a short while.
actors.hero.herosubclass.freerunner_desc=As the Freerunner moves he builds stacks of momentum. He can gain up to 10 momentum after running for 10 turns, but rapidly loses it if he stops moving. The freerunner can use up his momentum to start freerunning, for 2 turns per point of momentum.\n\nWhen freerunning the Freerunner moves at 2x speed, and gains bonus evasion in proportion to his level. Once freerunning ends there is a cooldown before momentum can be built again.\n\nWhile freerunning, the Freerunner gains 2x accuracy and +50% damage with thrown weapons.\n\nThe Freerunner moves at 2x speed while invisible, regardless of whether he is freerunning or not.
actors.hero.herosubclass.sniper=sniper
actors.hero.herosubclass.sniper_short_desc=The _Sniper_ can pierce armor with her ranged attacks. After striking with a thrown weapon she can follow up with a special attack from her bow.
actors.hero.herosubclass.sniper_desc=The Sniper is a master of ranged combat, whose ranged attacks pierce enemy armor. When she attacks an enemy with a thrown weapon, she places a sniper's mark on them, which lets her follow up with a special attack from her bow. This special attack varies based on how her bow is augmented.\n\nAn unaugmented bow will fire a snapshot which deals reduced damage but fires instantly. A speed bow will fire a volley of three arrows which deal reduced damage, can still activate enchantments, and take 1 turn to fire. A damage bow will fire a sniper shot which is guaranteed to hit, deals bonus damage based on distance, and takes 2 turns to fire.\n\nThrown weapons have a 100% chance to use the enchantment on the Sniper's bow.\nThis ability does not apply to darts shot from an enchanted crossbow, they already trigger the crossbow's enchantment.\n\nWhen the Sniper attacks with an upgraded thrown weapon, each level increases the duration of sniper's mark by 1 turn and the damage of her special attack by _33%_.
actors.hero.herosubclass.warden=warden
actors.hero.herosubclass.warden_short_desc=The _Warden_ can see through tall grass and gains bonus effects when she plants seeds and tramples plants.
actors.hero.herosubclass.warden_desc=The Warden has a strong connection to nature which grants her a variety of bonus effects relating to grass and plants. She is able to see through tall and furrowed grass as if it were empty space.\n\nThe Warden causes grass to sprout up around any seed she throws or plants, and gains special effects when trampling plants. These special effects replace the regular plant effects, meaning that no plant is harmful for her to step on.\n\nDewdrops can shield the Warden when her health is full, up to _100% of her max HP_.\n\nTipped darts have _5x durability_ when the Warden uses them.
actors.hero.herosubclass.king=rat king
actors.hero.herosubclass.king_short_desc=Choosing is so boring, I'd rather just pick _all the subclasses_...
actors.hero.herosubclass.king_desc=Rat King can use all subclasses at once!\n\nNot all perks are transferred to Rat King's subclass powers.
actors.hero.herosubclass.champion=champion
actors.hero.herosubclass.champion_short_desc=The _Champion_ can wield two weapons and gets more weapon charges. Her regular attacks use her primary weapon, but she can swap weapons and use either weapon's ability.
actors.hero.herosubclass.champion_desc=The Champion is a master of melee weapons who can equip a secondary weapon in addition to her primary one. Her regular attacks use her primary weapon, but she can swap her primary weapon instantly and use either weapon's ability.\n\nShe also gains 2 more max weapon ability charges and +50% weapon ability recharge speed.\n\nIf one of the Champion's two equipped weapons has a lower level and is _the same tier or lower_ than the other weapon, it will be boosted to the other weapon's level.\n\nIf the Champion uses two different weapon abilities successively, the second ability will execute any non-boss enemy left at _below 35% HP_.\n\nThe Champion instantly regains _1 weapon charge_ when she uses two different weapon abilities, with no time limit.
actors.hero.herosubclass.monk=monk
actors.hero.herosubclass.monk_short_desc=The _Monk_ builds energy while fighting. This energy can be spent on a variety of unique abilities.
actors.hero.herosubclass.monk_desc=The Monk is a master of physical technique. As she defeats enemies, she gains energy which can be used on a variety of defensive and utility-focused abilities. This energy does not fade over time, but has a cap based on the Monk's level.\n\n1 Energy: quickly strike with fists\n2 Energy: focus to dodge next attack\n3 Energy: instantly dash nearby\n4 Energy: kick an enemy away\n5 Energy: meditate to restore charges\n\nThe Monk gains _25% more energy_ for each piece of _natural tier 3_ equipment she is using.\nThe Monk gains _50% more energy_ for each piece of _natural tier 2_ equipment she is using.\nThe Monk gains _100%_ for each piece of _natural tier 1_ equipment she is using. She also gains _150% more energy_ if she has no weapon (or ring of force), and gains a free cloth armor and studded gloves.\n\nIf the Monk uses a weapon ability and a _2+ energy_ ability successively, she regains 50% of her spent energy and resets her ability cooldown.\n\nIf the Monk has _70% or more energy_, her abilities are empowered. When empowered:\n- Flurry applies enchantments at 75% power\n- Focus is instantaneous\n- Dash gains +2 range\n- Dragon Kick deals +33% damage and applies its knock back and stun effect to all adjacent enemies\n- Meditate slowly heals 20% of missing HP and grants 80% damage resistance.
actors.hero.talent$provokedangertracker.name=provoked anger
actors.hero.talent$provokedangertracker.desc=The Warrior has recently lost his shielding, his next physical attack will deal bonus damage.\n\nTurns remaining: %s.
actors.hero.talent$lingeringmagictracker.name=lingering magic
actors.hero.talent$lingeringmagictracker.desc=The Mage has recently used a staff or wand, his next physical attack will deal bonus damage.\n\nTurns remaining: %s.
actors.hero.talent$followupstriketracker.name=followup strike
actors.hero.talent$followupstriketracker.desc=The Huntress has recently attacked an enemy with a thrown weapon, her next melee attack against the same target will have boosted damage.\n\nTurns remaining: %s.
actors.hero.talent$patientstriketracker.name=patient strike
actors.hero.talent$patientstriketracker.desc=The Duelist has just spent a turn waiting, her next melee attack will deal bonus damage.
actors.hero.talent$improvisedprojectilecooldown.name=improvised projectiles cooldown
actors.hero.talent$improvisedprojectilecooldown.desc=You have recently used this talent, and must wait before using it again.\n\nTurns remaining: %s.
actors.hero.talent$rejuvenatingstepscooldown.name=rejuvenating steps cooldown
actors.hero.talent$rejuvenatingstepscooldown.desc=You have recently used this talent, and must wait before using it again.\n\nTurns remaining: %s.
