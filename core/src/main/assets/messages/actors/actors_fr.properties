actors.mobs.pets.dragonpet.name=Dragon Whelp
actors.mobs.pets.dragonpet.desc=A mythical dragon whelp with blazing scales. Spits embers and breathes destructive fire against enemies.
actors.mobs.pets.wolfpet.name=Loyal Wolf
actors.mobs.pets.wolfpet.desc=A faithful companion with sharp fangs and an acute sense of smell capable of detecting secret doors and traps.
actors.mobs.pets.fairypet.name=Light Fairy
actors.mobs.pets.fairypet.desc=A celestial sprite of pure radiance. Emits continuous light and periodically pulses soothing healing energy to its bonded hero.
actors.mobs.pets.spiderpet.name=Weaver Spider
actors.mobs.pets.spiderpet.desc=A cunning dungeon arachnid. Shoots sticky webs to ensnare foes and delivers debilitating venom.
actors.mobs.pets.manticorepet.name=Manticore
actors.mobs.pets.manticorepet.desc=A mythical chimera with the body of a lion, dragon wings, and a venomous scorpion tail. Inherits both dragon fire breath and paralyzing venom web stings.
actors.hero.talent.savage_meal.title=savage meal
actors.hero.talent.savage_meal.desc=_+1:_ Eating food restores _3 HP_ instantly if you are below 50% health.\n\n_+2:_ Eating food restores _6 HP_ instantly if you are below 50% health.
actors.hero.talent.primal_intuition.title=primal intuition
actors.hero.talent.primal_intuition.desc=_+1:_ Weapons are identified _15% faster_.\n\n_+2:_ Weapons are identified _30% faster_.
actors.hero.talent.reckless_anger.title=reckless anger
actors.hero.talent.reckless_anger.desc=_+1:_ Increases fury generation by _5%_.\n\n_+2:_ Increases fury generation by _10%_.
actors.hero.talent.thick_skin.title=thick skin
actors.hero.talent.thick_skin.desc=_+1:_ Incoming physical damage reduced by _1_ when at 100% fury.\n\n_+2:_ Incoming physical damage reduced by _2_ when at 100% fury.
actors.hero.talent.wild_stomach.title=wild stomach
actors.hero.talent.wild_stomach.desc=_+1:_ Eating grants _10% fury_.\n\n_+2:_ Eating grants _20% fury_.
actors.hero.talent.liquid_fury.title=liquid fury
actors.hero.talent.liquid_fury.desc=_+1:_ Drinking a potion grants _5% fury_.\n\n_+2:_ Drinking a potion grants _10% fury_.
actors.hero.talent.brutal_momentum.title=brutal momentum
actors.hero.talent.brutal_momentum.desc=_+1:_ Kills grant _1 turn_ of haste.\n\n_+2:_ Kills grant _2 turns_ of haste.
actors.hero.talent.fearless_haste.title=fearless haste
actors.hero.talent.fearless_haste.desc=_+1:_ Moving towards an enemy grants _5% dodge chance_.\n\n_+2:_ Moving towards an enemy grants _10% dodge chance_.
actors.hero.talent.primal_throw.title=primal throw
actors.hero.talent.primal_throw.desc=_+1:_ Thrown weapons deal _10% more damage_ at high fury.\n\n_+2:_ Thrown weapons deal _20% more damage_ at high fury.
actors.hero.talent.unstoppable.title=unstoppable
actors.hero.talent.unstoppable.desc=_+1:_ Immune to rooting when fury is over 50%.\n\n_+2:_ Immune to rooting and paralysis when fury is over 50%.
actors.hero.talent.overwhelming_strength.title=overwhelming strength
actors.hero.talent.overwhelming_strength.desc=_+1:_ Pushing enemies deals _2_ damage.\n\n_+2:_ Pushing enemies deals _4_ damage.
actors.hero.talent.savage_cleave.title=savage cleave
actors.hero.talent.savage_cleave.desc=_+1:_ Cleave hits an additional adjacent enemy.\n\n_+2:_ Cleave hits two additional adjacent enemies.
actors.hero.talent.relentless_rage.title=relentless rage
actors.hero.talent.relentless_rage.desc=_+1:_ Fury degrades _10%_ slower out of combat.\n\n_+2:_ Fury degrades _20%_ slower out of combat.
actors.hero.talent.fury_catalyst.title=fury catalyst
actors.hero.talent.fury_catalyst.desc=_+1:_ Crits generate _double_ fury.\n\n_+2:_ Crits generate _triple_ fury.
actors.hero.talent.animal_bond.title=animal bond
actors.hero.talent.animal_bond.desc=_+1:_ Pets take _10%_ less damage.\n\n_+2:_ Pets take _20%_ less damage.
actors.hero.talent.bestial_aid.title=bestial aid
actors.hero.talent.bestial_aid.desc=_+1:_ Pets heal _1 HP_ per turn.\n\n_+2:_ Pets heal _2 HP_ per turn.
actors.hero.talent.pack_leader.title=pack leader
actors.hero.talent.pack_leader.desc=_+1:_ Pets gain _+1_ attack speed.\n\n_+2:_ Pets gain _+2_ attack speed.
actors.buffs.primalfury.name=Primal Fury
actors.buffs.primalfury.desc=The Barbarian's fury rises in battle! Current fury: %d.\n\nFury grants up to +40%% bonus damage and reduces incoming physical damage by up to 25%%.
