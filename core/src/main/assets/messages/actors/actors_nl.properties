###blobs
actors.blobs.blizzard.name=sneeuwstorm
actors.blobs.blizzard.desc=Hier woedt een sneeuwstorm.

actors.blobs.confusiongas.name=verwarringsgas
actors.blobs.confusiongas.desc=Hier kolkt een wolk van verwarringsgas.

actors.blobs.electricity.name=elektriciteit
actors.blobs.electricity.desc=Hier knettert een veld van elektriciteit.
actors.blobs.electricity.rankings_desc=Geëlektrocuteerd
actors.blobs.electricity.ondeath=Je bent gedood door elektrocutie...

actors.blobs.fire.name=vuur
actors.blobs.fire.desc=Hier woedt een hevige brand.

actors.blobs.foliage.name=gebladerte
actors.blobs.foliage.desc=Lichtstralen doorboren de duisternis van de ondergrondse tuin.

actors.blobs.freezing.name=vrieslucht
actors.blobs.freezing.desc=De lucht is hier onnatuurlijk koud.

actors.blobs.goowarn.name=donkere energie
actors.blobs.goowarn.desc=Hier zwermen vlekjes donkere energie!

actors.blobs.inferno.name=vuurzee
actors.blobs.inferno.desc=Hier raast een vuurzee.

actors.blobs.paralyticgas.name=verlammend gas
actors.blobs.paralyticgas.desc=Hier kolkt een wolk verlammend gas.

actors.blobs.regrowth.name=hergroei

actors.blobs.sacrificialfire.name=offervuur
actors.blobs.sacrificialfire.desc=Er is een altaar waarop een offervuur brandt. Elk wezen dat hier wordt gedood, wordt verzwolgen als een offer aan de geesten van de kerker.\n\nMisschien wordt je beloond als er genoeg offers worden gebracht?
actors.blobs.sacrificialfire.worthy=Het vuur verteert jouw offer en wordt sterker.
actors.blobs.sacrificialfire.unworthy=Het vuur verteert jouw offer, maar verandert niet.
actors.blobs.sacrificialfire.reward=Het vuur laait op en dooft dan uit. Het laat een beloning na!

actors.blobs.smokescreen.name=rookgordijn
actors.blobs.smokescreen.desc=Hier kolkt een wolk van dikke, zwarte rook.

actors.blobs.stenchgas.name=stankgas
actors.blobs.stenchgas.desc=Hier kolkt een penetrante stankwolk.

actors.blobs.stormcloud.name=stormwolken
actors.blobs.stormcloud.desc=Hier kolkt een wolk van golvende waterdamp.

actors.blobs.toxicgas.name=giftig gas
actors.blobs.toxicgas.desc=Hier kolkt een groenige wolk giftig gas.
actors.blobs.toxicgas.rankings_desc=Verstikt
actors.blobs.toxicgas.ondeath=Je bent gestorven door het giftige gas...

actors.blobs.corrosivegas.name=bijtend gas
actors.blobs.corrosivegas.desc=Hier kolkt een wolk bijtend gas.

actors.blobs.waterofawareness.name=water van bewustzijn
actors.blobs.waterofawareness.procced=Terwijl je een slok neemt, voel je kennis in je geest stromen.
actors.blobs.waterofawareness.desc=De kracht van kennis straalt uit het water van deze put. Drinken uit de put zal alle uitgeruste items volledig identificeren, vloeken op alle items in je inventaris identificeren en alle items op de huidige verdieping onthullen.

actors.blobs.waterofhealth.name=water van gezondheid
actors.blobs.waterofhealth.procced=Terwijl je een slok neemt, voel je dat je wonden volledig genezen.
actors.blobs.waterofhealth.desc=Uit het water van deze put straalt de kracht van gezondheid. Neem een slok om je wonden te genezen, je honger te stillen, en je te verlossen van vloeken op gedragen voorwerpen.

actors.blobs.web.name=spinnenweb
actors.blobs.web.desc=Hier wordt alles bedekt door een dik web. Alles dat het web aanraakt of er doorheen wordt geworpen maakt het web kapot, maar blijft wel op zijn plek vastzitten.



###buffs
actors.buffs.adrenaline.name=Adrenaline
actors.buffs.adrenaline.desc=Adrenaline is een golf van fysieke kracht en verbetert zowel aanvals- als bewegingssnelheid.\n\nAdrenaline laat het doelwit met 2x snelheid rennen en met 1,5x snelheid aanvallen.\n\nResterende adrenaline:%s

actors.buffs.adrenalinesurge.name=Krachtversterking
actors.buffs.adrenalinesurge.desc=Een golf van overweldigende kracht, maar helaas niet permanent.\n\nKrachttoename: +%d\nBeurten tot de toename afzwakt: %s

actors.buffs.amok.name=Razend
actors.buffs.amok.desc=Razenij veroorzaakt een staat van grote woede en verwarring.\n\nWanneer een wezen razend wordt gemaakt, valt het alles wat in de buurt is aan, vriend of vijand.\n\nResterende beurten razenij: %s.

actors.buffs.arcanearmor.name=mysterieus harnas
actors.buffs.arcanearmor.desc=Een dun schild omringt je en blokkeert een deel van de schade van magische aanvallen.\n\nJe magische harnas is op het moment versterkt met: 0-%d.\n\nBeurten totdat het mysterieuze harnas verzwakt: %s.

actors.buffs.artifactrecharge.name=Artefact is aan het opladen
actors.buffs.artifactrecharge.desc=Energie stroomt door je heen, waardoor de oplaadsnelheid van je gehanteerde artefacten toeneemt.\n\nElk artefact wordt iets anders beïnvloed, maar ze worden allemaal veel sneller opgeladen dan normaal.\n\nResterende beurten: %s

actors.buffs.ascensionchallenge.name=Vloek van het amulet
actors.buffs.ascensionchallenge.desc=Op de een of andere manier behoudt Yog-Dzewa invloed op deze wereld door middel van het amulet, en probeert hij je terugkeer naar de oppervlakte te stoppen!\n\nDe kracht van Yog maakt de kerker veel gevaarlijker, hij vergroot het aantal vijanden en maakt ze sterker! Deze kracht blijft groeien als er niets aan wordt gedaan, het kan worden verzwakt door vijanden te verslaan die zijn versterkt door Yog's kracht.
actors.buffs.ascensionchallenge.desc_clear=De donkere energie die uit het amulet straalt is voorlopig zoveel mogelijk afgezwakt.
actors.buffs.ascensionchallenge.desc_beckon=Het amulet _roept momenteel naar verre vijanden,_ en stuurt ze naar jou toe.
actors.buffs.ascensionchallenge.desc_haste=Het amulet _versnelt momenteel verre vijanden,_ zodat ze je sneller bereiken!
actors.buffs.ascensionchallenge.desc_slow=Het amulet _vertraagt je momenteel_ en heft snelheidsverhogende effecten op!
actors.buffs.ascensionchallenge.desc_damage=De energie van het amulet is zo sterk geworden dat het je _direct schade toebrengt!_
actors.buffs.ascensionchallenge.beckon=Het amulet begint te roepen naar verre vijanden.
actors.buffs.ascensionchallenge.haste=Het amulet begint verre vijanden te versnellen!
actors.buffs.ascensionchallenge.slow=Het amulet begint als een loden gewicht in je inventaris te voelen!
actors.buffs.ascensionchallenge.damage=Het amulet begint donkere energie uit te stralen. Het brandt!
actors.buffs.ascensionchallenge.weaken_info=De vloek van het amulet kan worden verzwakt door meer vijanden te verslaan.
actors.buffs.ascensionchallenge.weaken_info_no_kills=Als je vijanden verslaat, wordt de vloek van het amulet zwakker!
actors.buffs.ascensionchallenge.weaken=Je voelt de vloek van het amulet iets verzwakken.
actors.buffs.ascensionchallenge.break=Je komt even op adem en voelt dat je wonden beginnen te sluiten!
actors.buffs.ascensionchallenge.almost=Je voelt dat de greep van Yog op het amulet begint te verzwakken, je bent er bijna!
actors.buffs.ascensionchallenge.on_kill=De donkere energie verteert je...

actors.buffs.barkskin.name=schorshuid
actors.buffs.barkskin.desc=Je huid is verhard en voelt ruw en hard als schors.\n\nDe verharde huid vergroot je bepantsering, waardoor je je beter kunt beschermen tegen fysieke aanvallen.\n\nJe harnassterkte is op het moment verhoogd met: %d\nBeurten totdat de schorshuid verzwakt: %s\n\n\nAls je schorshuid uit meerdere bronnen ontvangt, is alleen de sterkste van toepassing.

actors.buffs.barrier.name=Barrière
actors.buffs.barrier.desc=Een duurzaam krachtveld dat alle schade blokkeert.\n\nDe barrière neemt schade voor wat het aan het beschermen is op totdat er geen bescherming meer over is. De bescherming neemt ook af per beurt.\n\nResterende bescherming: %d.

actors.buffs.berserk.angered=Boos
actors.buffs.berserk.berserk=berserkend
actors.buffs.berserk.exhausted=Vermoeid
actors.buffs.berserk.recovering=Herstellend
actors.buffs.berserk.angered_desc=De ernst van de verwondingen van de Berserker versterken zijn aanvallen. Naarmate de Berserker fysieke schade oploopt neemt zijn razernij toe, waardoor hij bonusschade aanricht. Schade die wordt geblokkeerd door zijn harnas telt nog steeds mee voor het opbouwen van razernij.\n\nRazernij neemt af over tijd. Hoe lager de gezondheid van de Berserker, hoe langer het duurt.\n\nBij 100 %%woede kan de Berserker razend worden, wat hem een schild geeft op basis van het niveau van zijn harnas en zijn ontbrekende levenspunten. Tijdens zijn razernij, neemt zijn schild na verloop van tijd af en zodra het op is, moet hij rusten voordat hij weer woede kan opbouwen.\n\nHuidige woede: _%1$.0f%%_\n_+%2$.0f%%_ schade\n\nBerserkschild bij huidige harnas en gezondheid: _%3$d_
actors.buffs.berserk.berserk_desc=Angst en onzekerheid verdwijnen, waardoor alleen woede overblijft. In deze staat is de Berserker extreem krachtig, hij richt +50%% schade aan en krijgt bonusbescherming, maar verliest ook elke beurt schild.\n\nWanneer al zijn schild tot 0 is gereduceerd, stopt het berserken.\n\nNadat de Berserker woedend is geweest, moet hij eerst herstellen voordat hij weer woede kan opbouwen.\n\nResterend schild: %d
actors.buffs.berserk.recovering_desc=Innerlijke kracht heeft zijn limiet. De Berserker moet rusten voordat hij zijn razernij weer kan gebruiken.\n\nTerwijl hij herstelt bouwt de Berserker geen razernij op door schade op te lopen.
actors.buffs.berserk.recovering_desc_turns=Beurten tot hersteld: _%d_
actors.buffs.berserk.recovering_desc_levels=Niveaus tot hersteld: _%.2f_
actors.buffs.berserk.rankings_desc=Geberserkt tot de dood
actors.buffs.berserk.action_name=Berserk
actors.buffs.berserk.no_seal=Je hebt je gebroken zegel nodig om te razen!

actors.buffs.bleeding.name=bloedend
actors.buffs.bleeding.ondeath=Je bloedde dood...
actors.buffs.bleeding.heromsg=Je bloedt!
actors.buffs.bleeding.rankings_desc=Doodgebloed
actors.buffs.bleeding.desc=Uit die wond lekt een zorgwekkende hoeveelheid bloed.\n\nBloeden veroorzaakt elke beurt schade. De schade neemt elke beurt met een willekeurig hoeveelheid af, totdat het bloeden uiteindelijk stopt.\n\nHuidige schade: %d.

actors.buffs.bless.name=gezegend
actors.buffs.bless.desc=Een uitbarsting van focus, sommigen zeggen door de goden geïnspireerd.\n\nZegening verhoogt de nauwkeurigheid en ontwijking met 25%%, waardoor de gezegende veel effectiever is in gevecht.\n\nResterende beurten van zegening: %s.

actors.buffs.blindness.name=verblind
actors.buffs.blindness.heromsg=Je bent verblind!
actors.buffs.blindness.desc=Verblinding verandert de wereld om je heen in een donker waas.\n\nAls een personage verblind is, wordt het zichtbereik teruggebracht tot één tegel, waardoor aanvallen op afstand nutteloos worden en het heel gemakkelijk wordt om vijanden op afstand uit het oog te verliezen. Bovendien is een blinde held niet in staat om rollen of boeken te lezen.\n\nResterende beurten van blindheid: %s.

actors.buffs.buff.heromsg=

actors.buffs.burning.name=brandend
actors.buffs.burning.heromsg=Je vat vlam!
actors.buffs.burning.burnsup=%s verbrandt!
actors.buffs.burning.ondeath=Je bent doodgebrand...
actors.buffs.burning.rankings_desc=Tot As Verbrand
actors.buffs.burning.desc=Weinig dingen zijn meer verontrustend dan worden verzwolgen in vlammen.\n\nVuur veroorzaakt elke beurt schade totdat het door water wordt geblust of uitgaat. Brand kan geblust worden door in water te stappen, of door de spatten van een brekende fles toverdrank.\n\nBovendien kan het vuur brandbaar terrein of voorwerpen waar het mee in contact komt ontsteken.\n\nResterende brandende beurten: %s.

actors.buffs.championenemy.warn=Je voelt een dodelijke aanwezigheid.
actors.buffs.championenemy$blazing.name=vlammende kampioen
actors.buffs.championenemy$blazing.desc=Opvlammende kampioenen richten 25% meer slagschade aan, steken de vijanden die ze aanvallen aan, zijn immuun voor vuur en verspreiden vuur om hen heen als ze sterven. Ze kunnen het vuur echter niet over water verspreiden.
actors.buffs.championenemy$projecting.name=projecterende kampioen
actors.buffs.championenemy$projecting.desc=Projecterende kampioenen richten 25% meer slagschade aan en hebben een aanvalsbereik van +3.
actors.buffs.championenemy$antimagic.name=anti-magische kampioen
actors.buffs.championenemy$antimagic.desc=Antimagische kampioenen lopen 50% minder schade op en zijn volledig immuun voor magische effecten.
actors.buffs.championenemy$giant.name=gigantische kampioen
actors.buffs.championenemy$giant.desc=Gigantische kampioenen lopen 80% minder schade op en hebben een aanvalsbereik van +1, maar kunnen zich niet door afgesloten ruimtes bewegen.
actors.buffs.championenemy$blessed.name=gezegende kampioen
actors.buffs.championenemy$blessed.desc=Gezegende kampioenen hebben 4x meer nauwkeurigheid en ontwijking.
actors.buffs.championenemy$growing.name=groeiende kampioen
actors.buffs.championenemy$growing.desc=Groeiende kampioenen ontvangen een gestaag groeiende bonus op hun nauwkeurigheid, ontwijking, slagschade en een vermindering van de schade die ze oplopen.\n\nHuidige nauwkeurigheids-/ontwijkings-/schadeverhoging: %1$d%%\nHuidige schadevermindering: %2$d%%

actors.buffs.charm.name=bekoord
actors.buffs.charm.heromsg=Je bent bekoord!
actors.buffs.charm.cant_attack=Je bent bekoord door die vijand en kunt hem niet aanvallen.
actors.buffs.charm.desc=Bekoring is een manipulatieve magie die vijanden tijdelijk van elkaar kan laten houden.\n\nPersonages getroffen door bekoring kunnen niet direct de vijand aanvallen door wie ze zijn bekoord. Andere doelwitten aanvallen is nog wel mogelijk. De schok van pijn vermindert de duur van de bekoring.\n\nResterende beurten van bekoring: %s.

actors.buffs.chill.name=afgekoeld
actors.buffs.chill.freezes=%s bevriest!
actors.buffs.chill.desc=Niet helemaal bevroren, maar nog steeds veel te koud.\n\nAfgekoelde vijanden voeren acties trager uit, afhankelijk van hoeveel beurten er nog over zijn van het effect. In het slechtste geval is dit het equivalent van vertraagd zijn.\n\nBeurten van afkoeling over: %1$s.\nSnelheid is verminderd met: %2$s%%

actors.buffs.combo.name=combo
actors.buffs.combo.action_name=combo-aanval
actors.buffs.combo.combo=%d treffer combo!
actors.buffs.combo.bad_target=Je moet een vijand binnen aanvalsafstand kiezen
actors.buffs.combo.prompt=Kies een doelwit om aan te vallen
actors.buffs.combo.desc=De gladiator bouwt momentum op bij elke succesvolle aanval. Bij elke aanval wordt de combo-teller met één verhoogd, maar als je te lang de tijd neemt tussen aanvallen wordt de combo-teller teruggezet naar 0. Terwijl de gladiator combo heeft zal bescherming van het gebroken zegel zal niet afnemen.\n\nCombo opbouwen ontgrendelt speciale combo-aanvallen, die altijd raak zijn! Een verschillende aanval komt beschikbaar als de combo-teller 2, 4, 6, 8, en 10 bereikt. Sommige combo's zetten de combo-teller terug, andere weer niet, maar elke combo kan maar één keer uitgevoerd worden per combo-sessie.\n\nHuidige stand combo-teller: %1$d.\n\nResterende beurten tot Combo verloren is: %2$s.
actors.buffs.combo$combomove.clobber.name=knaller
actors.buffs.combo$combomove.clobber.desc=Slaat een vijand 2 tegels terug, maar richt geen schade aan en kan niet in kuilen slaan. Verhoogt de combo met 1.
actors.buffs.combo$combomove.clobber.empower_desc=Slaat een vijand _3 tegels terug, veroorzaakt duizeligheid, en kan in kuilen slaan_ maar richt geen schade aan. Verhoogt de combo met 1.
actors.buffs.combo$combomove.slam.name=klap
actors.buffs.combo$combomove.slam.desc=Deelt %d %% (combo*20 %%) van je schadeblokkerende kracht uit als bonusschade. Reset combo wanneer gebruikt.
actors.buffs.combo$combomove.slam.empower_desc=_Springt tot %1$d tegel(s)_ en deelt %2$d%%(combo*20 %%) van je schadeblokkerende kracht uit als bonusschade. Reset combo wanneer gebruikt.
actors.buffs.combo$combomove.parry.name=pareer
actors.buffs.combo$combomove.parry.desc=Blokkeert de volgende aanval binnen 1 beurt en deelt direct een tegenaanval uit. Combo-teller start opnieuw als niets wordt geblokkeerd.
actors.buffs.combo$combomove.parry.empower_desc=Blokkeert _alle aanvallen_ binnen 1 beurt indien geactiveerd, en slaat onmiddellijk terug. Reset combo als er niets wordt gepareerd.
actors.buffs.combo$combomove.crush.name=verplettering
actors.buffs.combo$combomove.crush.desc=Richt %d%%(combo*25 %%) schade toe aan het primaire doelwit, en verdeelt de andere helft van die schade over alle andere vijanden die binnen de 7x7 tegels van de inslag staan. Reset combo wanneer gebruikt
actors.buffs.combo$combomove.crush.empower_desc=_Springt tot %1$d tegel(s)_ en brengt%2$d%%(combo*25 %%) schade toe aan het primaire doelwit, en de helft van die schade aan alle andere vijanden die binnen 7x7 tegels van de inslag staan. Reset combo wanneer gebruikt.
actors.buffs.combo$combomove.fury.name=razernij
actors.buffs.combo$combomove.fury.desc=Raakt een vijand eens voor elke combo die je hebt. Elke slag doet 60% schade en kan een betovering in gang zetten. Combo-teller start opnieuw bij gebruik.
actors.buffs.combo$combomove.fury.empower_desc=_Springt tot %dtegel(s)_ en raakt een vijand één keer voor elke combo die je hebt. Elke treffer richt 60%% schade aan en kan betoveringen activeren. Reset combo wanneer gebruikt.

actors.buffs.corruption.name=gecorrumpeerd
actors.buffs.corruption.desc=Corruptie sijpelt in de essentie van een wezen en verdraait ze tegen hun voormalige aard.\n\nCorrupte wezens vallen hun bondgenoten aan, en negeren hun voormalige vijanden. Corruptie richt ook schade aan, en het doelwit bezwijkt dan ook langzaam.\n\nCorruptie is permanent, het effect eindigt pas bij de dood.

actors.buffs.cripple.name=kreupel
actors.buffs.cripple.heromsg=Je bent kreupel!
actors.buffs.cripple.desc=Je bent er vrij zeker van dat benen niet op die manier horen te buigen.\n\nKreupel zijn halveert je bewegingssnelheid, waardoor het verplaatsen van één tegel meestal twee beurten duurt in plaats van één.\n\nResterende kreupele beurten: %s.

actors.buffs.daze.name=versuft
actors.buffs.daze.heromsg=Je bent versuft!
actors.buffs.daze.desc=Oorsuizen en wazig zien maken het moeilijk om te vechten.\n\nTerwijl je versuft bent, worden de nauwkeurigheid en het ontwijken met 50 %%verminderd, waardoor zowel landende als ontwijkende slagen veel moeilijker worden.\n\nResterende versuffing: %s.

actors.buffs.degrade.name=gedegradeerd
actors.buffs.degrade.heromsg=Je uitrusting voelt zwakker!
actors.buffs.degrade.desc=Krachtige duistere magie ondermijnt de sterkte van rollen van opwaardering die zijn toegepast op je uitrusting!\n\nTijdens degradatie gedraagt opgewaardeerde uitrusting zich als op een lager niveau dan het eigenlijk is. _Elke opwaardering na +3 wordt exponentieel zwakker dan de vorige._ De beschrijving van je voorwerpen verandert om de degradatie in krachtniveau te laten zien.\n\nDegradatie beïnvloedt niet de krachtvoorwaarden, toverstoklading, duurzaamheid van werpwapens of artefacten.\n\nResterende beurten van degradatie: %s. Het gebruik van een rol van opwaardering of vloekverwijdering beëindigt de degradatie ogenblikkelijk.

actors.buffs.doom.name=verdoemd
actors.buffs.doom.desc=Het is lastig om door te gaan wanneer het lijkt alsof het universum je dood wil hebben.\n\nVerdoemde personages krijgen +67% schade van alle bronnen.\n\nVerdoemenis is permanent, het eindigt alleen bij de dood.

actors.buffs.dread.name=geschrokken
actors.buffs.dread.desc=Een verschrikking die zo groot is dat zijn doelwit de kerker volledig ontvlucht!\n\nWezens die door verschrikking worden getroffen, rennen met hoge snelheid weg van hun tegenstander en verdwijnen volledig uit de kerker zodra ze uit het zicht zijn. Van vijanden die op deze manier worden verslagen, krijg je de helft van ervaring toegekend en ze laten geen voorwerpen vallen. Een pijnstoot vermindert de duur van verschrikking.\n\nResterende beurten van verschrikking: %d.

actors.buffs.drowsy.name=slaperig
actors.buffs.drowsy.desc=Een magische kracht maakt het moeilijk om wakker te blijven, na een paar beurten zal het doelwit in een diepe magische slaap vallen.\n\nDe held kan slaperigheid weerstaan door schade op te lopen of door op volle gezondheid te zijn.\n\nBeurten tot slaap: %s.

actors.buffs.earthimbue.name=met aarde verrijkt
actors.buffs.earthimbue.desc=Je bent verrijkt met de kracht van aarde!\n\nBij alle fysieke aanvallen verschuift de aarde onder de vijand, waardoor ze kreupel zijn voor een korte tijd.\n\nResterende beurten van verrijking met aarde: %s.

actors.buffs.enhancedrings.name=betoverde ringen
actors.buffs.enhancedrings.desc=Het onlangs gebruikte artefact van de Schurk versterkt zijn ringen, waardoor ze een niveau van +1 krijgen.\n\nResterende beurten: %s.

actors.buffs.fireimbue.name=verrijkt met vuur
actors.buffs.fireimbue.desc=Je bent met de kracht van vuur verrijkt!\n\nBij alle fysieke aanvallen is er kans dat vijanden in lichterlaaie gezet worden. Daarnaast ben je compleet immuun tegen de effecten van vuur.\n\nResterende beurten met vuur verrijkt: %s.

actors.buffs.foresight.name=vooruitziend
actors.buffs.foresight.desc=Je kan op de een of andere manier de indeling van het omliggende terrein zien met je gedachten.\n\nTerwijl je onder het effect van vooruitziendheid bent worden alle tegels in een wijde radius onthuld voor jou, waaronder geheime vallen en deuren.\n\nResterende beurten vooruitziendheid: %s.

actors.buffs.frost.name=bevroren
actors.buffs.frost.freezes=%s bevriest!
actors.buffs.frost.desc=Niet te verwarren met compleet bevriezen, dit is iets onschuldiger en omsluit het doel in ijs.\n\nBevriezing heeft dezelfde effecten als verlamming, het  maakt het onmogelijk voor het doelwit om iets te doen. Maar in tegenstelling tot verlamming, is bevriezing meteen ongedaan gemaakt als het doel schade oploopt, omdat het ijs dan verbrijzelt.\n\nResterende beurten van bevriezing: %s.

actors.buffs.frostimbue.name=verrijkt met vorst
actors.buffs.frostimbue.desc=Je bent verrijkt met ijzige macht!\n\nAlle fysieke aanvallen koelen vijanden gestaag af. Bovendien ben je compleet immuun voor de kou.\n\nResterende beurten van verrijkt met vorst: %s.

actors.buffs.fury.name=woest
actors.buffs.fury.heromsg=Je wordt woest!
actors.buffs.fury.desc=Je bent boos, vijanden gaan het niet leuk vinden als je woest bent.\n\nEen hevige razernij brandt in je, de schade die je aanricht met fysieke aanvallen is verhoogd met 50%%.\n\nDeze razernij duurt zolang je op minder dan 50%% gezondheid bent.

actors.buffs.blobimmunity.name=zuiveringsbarrière
actors.buffs.blobimmunity.desc=Een vreemde kracht hult je in een dunne beschermende barrière, die alle schadelijke invloeden in de lucht tegenhoudt.\n\nJe bent immuun voor alle plaatsgebonden invloeden zolang de barrière stand houdt.\n\nBeurten van immuniteit over: %s.

actors.buffs.gravitychaostracker.name=zwaartekrachtchaos
actors.buffs.gravitychaostracker.desc_intro=Elke paar beurten worden alle personages op de huidige kerkervloer in een willekeurige richting gegooid.
actors.buffs.gravitychaostracker.desc_positive=Jij en je bondgenoten lijken er echter immuun voor te zijn.
actors.buffs.gravitychaostracker.desc_duration=Het is niet duidelijk hoe lang het effect zal aanhouden, maar het kan niet eeuwig duren.

actors.buffs.greaterhaste.name=grotere haast
actors.buffs.greaterhaste.desc=Een ongelooflijke snelheidsboost, even voelt het alsof alles stilstaat.\n\nTerwijl je onder invloed bent van grotere haast, nemen bewegende acties geen tijd in beslag, maar andere acties worden nog steeds uitgevoerd met normale snelheid. Elke stap van de beweging kost een beurt van grotere haast.\n\nResterende beurten van grotere haast: %d.

actors.buffs.haste.name=haastig
actors.buffs.haste.desc=Energie stroomt door je spieren waardoor je ongelofelijk hard kunt rennen.\n\nZolang je onder de invloed bent van haast ren je 3x zo snel, alle andere handelingen gaan echter met normale snelheid.\n\nBeurten haast over: %s.

actors.buffs.healing.name=genezend
actors.buffs.healing.desc=Door een magische remedie sluiten je wonden.\n\nElke beurt wordt gezondheid hersteld totdat het genezingseffect eindigt. De hoeveelheid genezing kan in de loop van de tijd afnemen.\n\nVolgende genezing: %d.\n\nGenezing over: %d.

actors.buffs.herodisguise.name=vermomming
actors.buffs.herodisguise.desc=Illusoire magie heeft je fysieke verschijning veranderd! Het effect is puur cosmetisch, maar voelt desondanks heel vreemd.\n\nResterende vermommingsbeurten: %s.

actors.buffs.hex.name=behekst
actors.buffs.hex.heromsg=Je bent behekst!
actors.buffs.hex.desc=Duistere magie ondermijnt focus waardoor het doelwit lichtelijk gedesoriënteerd is.\n\nHexen vermindert nauwkeurigheid en ontwijking met 20%%, wat het doelwit minder effectief maakt in een gevecht.\n\nResterende beurten van hex: %s.

actors.buffs.holdfast.name=stilstaand
actors.buffs.holdfast.desc=De Krijger behoudt zijn positie, verhoogt zijn pantser met %1$d-%2$d en vertraagt de vervalsnelheid van sommige versterkingen met %3$d%%. Dit houdt aan totdat hij weer beweegt.

actors.buffs.hunger.hungry=hongerig
actors.buffs.hunger.starving=verhongeren
actors.buffs.hunger.onhungry=Je hebt honger.
actors.buffs.hunger.onstarving=Je bent aan het verhongeren.
actors.buffs.hunger.ondeath=Je bent gestorven van de honger...
actors.buffs.hunger.cursedhorn=De vervloekte Hoorn steelt wat van de voedingsstoffen terwijl je eet.
actors.buffs.hunger.rankings_desc=Verhongerd tot de Dood
actors.buffs.hunger.desc_intro_hungry=Je voelt je maag om eten roepen, maar je kunt nog wel even door.
actors.buffs.hunger.desc_intro_starving=Je hebt zo'n honger dat het pijn doet.
actors.buffs.hunger.desc=\n\nHonger neemt langzaam toe naarmate de tijd verstrijkt, uiteindelijk begin je te verhongeren. Terwijl je verhongert verlies je langzaam gezondheid in plaats van het te herstellen.\n\nRantsoeneren is uiterst belangrijk! Als je gezondheid over hebt is verhongeren geen slecht idee omdat het betekent dat je later meer voedsel zult hebben. Effectieve rantsoenering kan zorgen dat je voedsel langer meegaat.

actors.buffs.invisibility.name=onzichtbaar
actors.buffs.invisibility.desc=Je bent helemaal in de omgeving opgenomen, waardoor je onmogelijk te zien bent.\n\nTerwijl je onzichtbaar bent kunnen vijanden je niet aanvallen of volgen. Fysieke aanvallen en magische effecten (zoals rollen en toverstaven) maken de onzichtbaarheid onmiddellijk ongedaan.\n\nResterende beurten van onzichtbaarheid: %s.

actors.buffs.invulnerability.name=onschendbaar
actors.buffs.invulnerability.desc=Dit personage is doordrenkt met een grote beschermende kracht, waardoor ze een korte periode onkwetsbaar zijn!\n\nResterende beurten: %s.

actors.buffs.levitation.name=zwevend
actors.buffs.levitation.desc=Een magische kracht laat je over de grond zweven, waardoor je je gewichtloos voelt.\n\nLeviterende personages bewegen geruisloos en negeren alle effecten op de grond. Vallen worden niet geactiveerd, water dooft geen vuur, planten worden niet vertrapt, wortels missen en en je zweeft zo over afgronden. Wees voorzichtig, want al deze dingen kunnen in werking treden zodra de levitatie eindigt!\n\nResterende beurten zwevend: %s.

actors.buffs.lifelink.name=levenslink
actors.buffs.lifelink.ondeath=De schade toegebracht door de levenslink heeft je gedood...
actors.buffs.lifelink.desc=De levenskracht van dit personage is gekoppeld aan een ander personage in de buurt. Alle geleden schade wordt onderling gedeeld.\n\nWanneer dit personage schade oploopt, wordt de helft met het gelinkte karakter gedeeld.\n\nResterende beurten van levenslink: %s.

actors.buffs.light.name=verlichting
actors.buffs.light.desc=Zelfs in de Donkerste Kerker is een constant licht aan je zijde altijd geruststellend.\n\nLicht helpt duisternis te onderdrukken, waardoor je een redelijke afstand kunt zien, ondanks de omgeving.\n\nResterende beurten van verlichting: %s.

actors.buffs.lockedfloor.name=vergrendelde verdieping
actors.buffs.lockedfloor.desc=De huidige verdieping is vergrendeld, en je kunt deze niet verlaten!\n\nTerwijl de verdieping is afgesloten krijg je geen honger of schade door verhongering. Ook stoppen passieve regeneratie-effecten, als je geen werk maakt van het verslaan van de baas.\n\nAls je opnieuw leven ingeblazen wordt door een ongezegende ankh terwijl de verdieping is vergrendeld, dan wordt alle voortgang teruggezet.\n\nVersla de baas van deze verdieping om de vergrendeling te verbreken.

actors.buffs.lostinventory.name=verloren voorraad
actors.buffs.lostinventory.desc=Jouw voorraad is ergens in de kerker verloren! Je kan geen voorwerpen oprapen en de meeste kan je niet gebruiken tot je het terugvindt.

actors.buffs.magicalsight.name=magisch zicht
actors.buffs.magicalsight.desc=Op de een of andere manier kun je met je geest zien, in plaats van met je ogen.\n\nTerwijl het magische zicht actief is, kun je door alle terreinen kijken binnen een straal van 12 tegels.\n\nResterende beurten van magisch zicht: %s.

actors.buffs.magicalsleep.name=magische slaap
actors.buffs.magicalsleep.toohealthy=Je bent te gezond en weerstaat de drang om te slapen.
actors.buffs.magicalsleep.fallasleep=Je valt in een diepe magische slaap.
actors.buffs.magicalsleep.wakeup=Je ontwaakt en voelt je fris en gezond.
actors.buffs.magicalsleep.desc=Dit personage is in een diepe magische slaap gevallen waar ze niet op natuurlijke wijze uit zullen ontwaken.\n\nMagische slaap is vergelijkbaar met gewone slaap, behalve dat alleen schade ervoor zorgt dat het doelwit wakker wordt.\n\nVoor de held en zijn bondgenoten heeft magische slaap een aantal herstellende eigenschappen, waardoor ze snel kunnen genezen terwijl ze rusten.

actors.buffs.magicimmune.name=immuun voor magie
actors.buffs.magicimmune.desc=Alle magische effecten hebben hun grip op je verloren, je bent er volledig ongevoelig voor.\n\nTerwijl je immuun voor magie bent, zijn alle schadelijke en nuttige magische effecten niet op jou van toepassing, inclusief vloeken, betoveringen, toverstokken, rollen, ringen, artefacten, enz. Heroïsche pantservaardigheden zijn sterk genoeg om ongeacht dit effect te werken.\n\nResterende beurten magische immuniteit: %s.

actors.buffs.mindvision.name=geestvisie
actors.buffs.mindvision.desc=Op de een of andere manier zie je alle wezens van deze verdieping met je geest. Het is een gek gevoel.\n\nAlle personages op deze verdieping zijn zichtbaar voor jou zolang je geestvisie actief is. Een wezen zien door geestvisie telt alsof het gezien wordt of dichtbij is voor de uitwerking van veel magische effecten.\n\nResterende beurten van geestvisie: %s.

actors.buffs.momentum.momentum=momentum opbouwend
actors.buffs.momentum.running=freerunnend
actors.buffs.momentum.resting=Herstellen
actors.buffs.momentum.action_name=freerun
actors.buffs.momentum.momentum_desc=Terwijl hij beweegt, bouwt de Freerunner momentum op, dat hij kan gebruiken om te freerunnen.\n\nElke opbouw van momentum geeft twee beurten om te freerunnen, de freerunner kan tot 10 momentum opbouwen. Momentum verdwijnt snel als de freerunner stopt met bewegen.\n\nHuidige momentum: %d.
actors.buffs.momentum.running_desc=Terwijl hij beweegt, bouwt de Freerunner momentum op, dat hij kan gebruiken om te freerunnen.\n\nTijdens het freerunnen beweegt de Freerunner met dubbele snelheid en krijgt hij bonus ontwijking gebaseerd op zijn niveau.\n\nResterende beurten: %d.
actors.buffs.momentum.resting_desc=Terwijl hij beweegt bouwt de Freerunner momentum op, dat hij kan gebruiken om te freerunnen.\n\nDe Freerunner heeft tijd nodig om zijn energie terug te krijgen om weer momentum op te bouwen.\n\nResterende beurten :%d.

actors.buffs.monkenergy.name=energie
actors.buffs.monkenergy.action=Monnik Vaardigheden
actors.buffs.monkenergy.desc=Door vijanden te verslaan, krijgt de Monnik energie die ze voor verschillende vaardigheden kan gebruiken. De meeste vijanden geven 1 energie wanneer ze worden verslagen, en de Monnik verliest na verloop van tijd geen energie.\n\nHuidige energie: %1$d/%2$d.
actors.buffs.monkenergy.desc_cooldown=De Monnik heeft onlangs een vaardigheid gebruikt en moet wachten voordat hij een andere gebruikt.\n\nHuidige afkoelperiode: %d beurten.
actors.buffs.monkenergy$monkability$flurry.name=wind van slagen
actors.buffs.monkenergy$monkability$flurry.desc=Twee directe aanvallen die %1$d-%2$d schade toebrengen en harnas negeren. Deze vaardigheid kan niet herhaaldelijk gebruikt worden.
actors.buffs.monkenergy$monkability$flurry.empower_desc=Twee directe aanvallen die %1$d-%2$d schade toebrengen, harnas negeren, _en de betovering van je wapen gebruiken._ Deze vaardigheid kan niet herhaaldelijk gebruikt worden.
actors.buffs.monkenergy$monkability$focus.name=focus
actors.buffs.monkenergy$monkability$focus.desc=De Monnik neemt een beurt om zich te concentreren en zorgt ervoor dat ze  de volgende aanval afweert.
actors.buffs.monkenergy$monkability$focus.empower_desc=De Monnik _concentreert zich onmiddellijk_ en dit laat haar de volgende aanval afweren.
actors.buffs.monkenergy$monkability$focus$focusbuff.name=gefocust
actors.buffs.monkenergy$monkability$focus$focusbuff.desc=De monnik is gefocust op haar omgeving en anticipeert de volgende fysieke aanval op haar. Terwijl ze gefocust is, weert ze gegarandeerd de volgende inkomende fysieke aanval af.
actors.buffs.monkenergy$monkability$dash.name=toerennen
actors.buffs.monkenergy$monkability$dash.prompt=Kies een plek
actors.buffs.monkenergy$monkability$dash.desc=Instant naar een tegel toe rennen tot 4 tegels ver weg. Het toerennen kan over gevaren gaan, maar niet door vijanden of vast terrein heen.
actors.buffs.monkenergy$monkability$dash.empower_desc=Instant naar een tegel toe rennen tot _8 tegels_ ver weg. Het toerennen kan over gevaren gaan, maar niet door vijanden of vast terrein heen.
actors.buffs.monkenergy$monkability$dragonkick.name=drakenschop
actors.buffs.monkenergy$monkability$dragonkick.desc=Een verwoestende schop die %1$d-%2$d schade aanricht en bepantsering negeert. De schop duwt het doelwit weg en verlamt ze voor elke tegel die ze afleggen.
actors.buffs.monkenergy$monkability$dragonkick.empower_desc=Een verwoestende trap die _%1$d-%2$d schade_ aanricht en harnas negeert. Door de trap worden alle aangrenzende doelen weggeslagen en worden ze verlamd voor elke tegel die ze verplaatsen.
actors.buffs.monkenergy$monkability$meditate.name=mediteren
actors.buffs.monkenergy$monkability$meditate.desc=De monnik concentreert energie gedurende 5 beurten in haar lichaam. Dit heft de meeste negatieve effecten op en geeft haar 8 beurten van toverstok en artefacten oplading.
actors.buffs.monkenergy$monkability$meditate.empower_desc=De monnik concentreert energie gedurende 5 beurten in haar lichaam. Dit heft de meeste negatieve effecten op en geeft haar 8 beurten van toverstok en artefacten oplading. _Ze krijgt ook 80% weerstand tegen schade tijdens het mediteren, en geneest langzaam voor 20% van haar ontbrekende gezondheid._

actors.buffs.ooze.name=bijtend slijm
actors.buffs.ooze.heromsg=Bijtend slijm vreet zich in je vlees. Spoel het van je af!
actors.buffs.ooze.ondeath=Je smelt weg...
actors.buffs.ooze.rankings_desc=Opgelost
actors.buffs.ooze.desc=Dit kleverige zuur blijft plakken aan vlees, en vreet het langzaam weg.\n\nSlijm blijft voortdurend schade toebrengen, maar kan meteen worden weggespoeld in water.\n\nResterende beurten beslijmd: %s.

actors.buffs.paralysis.name=verlamd
actors.buffs.paralysis.heromsg=Je bent verlamd!
actors.buffs.paralysis.out=verzet tegen verlamming
actors.buffs.paralysis.desc=Vaak is niets doen de slechtste optie.\n\nVerlamming stopt alle acties, en dwingt het doelwit te wachten totdat het effect eindigt. Door pijn van toegebrachte schade kunnen personages zich verzetten tegen de verlamming, wat het effect beëindigt.\n\nResterende beurten met verlamming: %s.

actors.buffs.physicalempower.name=fysiek versterkt
actors.buffs.physicalempower.desc=Je slagen zijn versterkt, waardoor je meer schade kunt aanrichten met fysieke aanvallen.\n\nBonusschade: %1$d.\nResterende treffers: %2$d.

actors.buffs.pincushion.name=speldenkussen
actors.buffs.pincushion.desc=De werpwapens die je naar dit personage heb gegooid zijn op het moment aan hen vastgeplakt en vallen op de grond nadat het karakter is verslagen.\n\nDe volgende voorwerpen zitten op het moment vast:

actors.buffs.poison.name=vergiftigd
actors.buffs.poison.heromsg=Je bent vergiftigd!
actors.buffs.poison.ondeath=Je stierf door vergif...
actors.buffs.poison.rankings_desc=Bezweken aan Gif
actors.buffs.poison.desc=Gif werkt zich door het lichaam, en verzwakt langzaam het interne functioneren.\n\nGif brengt elke beurt schade toe in verhouding tot de duur dat het uitgewerkt is.\n\nResterende beurten met vergiftiging: %s.

actors.buffs.preparation.name=voorbereidend
actors.buffs.preparation.action_name=Voorbereide slag
actors.buffs.preparation.desc=De Sluipmoordenaar wacht geduldig en bereidt zich voor om toe te slaan uit de schaduw.
actors.buffs.preparation.desc_dmg=Zijn volgende aanval brengt _%1$d%%bonusschade toe,_ en doodt gewone vijanden onder _%2$d%% gezondheid,_ of bazen onder _%3$d%% gezondheid._
actors.buffs.preparation.desc_dmg_likely=De aanval heeft ook een grotere kans om meer schade toe te brengen.
actors.buffs.preparation.desc_blink=Hij kan naar een vijand toesnellen voordat hij die aanvalt, met een maximum afstand van _%d._
actors.buffs.preparation.desc_invis_time=Beurten onzichtbaar: _%d._
actors.buffs.preparation.desc_invis_next=Beurten voor een sterkere aanval: _%d._
actors.buffs.preparation.prompt=Kies een doelwit om aan te vallen!\nMaximale toesnel afstand: %d
actors.buffs.preparation.no_target=Er is hier niets om aan te vallen.
actors.buffs.preparation.out_of_reach=Dat doelwit is buiten bereik.
actors.buffs.preparation.assassinated=vermoord

actors.buffs.prismaticguard.name=prismatische bewaker
actors.buffs.prismaticguard.desc=Je bent beschermd door een prismatisch beeld dat momenteel inactief is. Als vijanden aanwezig zijn komt het prismatische beeld in actie en beschermt je!\n\nTerwijl het inactief is, herstelt het prismatische beeld gestaag van toegebrachte schade.\n\nHuidige gezondheid: %d/%d.
actors.buffs.prismaticguard.desc_many=Dit prismatische beeld profiteert ook van Kracht van Velen. Resterende beurten: %d.

actors.buffs.recharging.name=aan het opladen
actors.buffs.recharging.desc=Energie stroomt door je heen en verbetert de snelheid waarmee je toverstokken en staven opladen.\n\nElke beurt verhoogt deze kracht de huidige lading met een kwart, naast de normale oplading.\n\nResterende beurten met oplading: %s

actors.buffs.revealedarea.name=onthuld gebied
actors.buffs.revealedarea.desc=Een deel van de kerker is tijdelijk onthuld aan de held. Zij zien het ongeacht waar ze zijn. \n\nResterende beurten: %s.

actors.buffs.revealedchar.name=onthuld persoon
actors.buffs.revealedchar.desc=Dit personage is onthuld aan de held. Zij zijn zichtbaar ongeacht waar ze zijn.\n\nResterende beurten: %s.

actors.buffs.roots.name=geworteld
actors.buffs.roots.heromsg=Je kunt niet bewegen!
actors.buffs.roots.desc=Wortels (magische of natuurlijke) grijpen de voeten, en dwingen ze vast op de grond.\n\nWortels houden een doelwit op zijn plaats, waardoor het onmogelijk is te bewegen, maar andere acties worden niet beïnvloed, inclusief teleportatie-effecten.\n\nResterende beurten geworteld: %s.

actors.buffs.scrollempower.name=rol bekrachtiging
actors.buffs.scrollempower.desc=De energie van de onlangs gelezen rol van de Magiër versterkt zijn toverstokken!\n\nNiveau versterking: +%1$d.\nResterende schoten: %2$d.

actors.buffs.shadows.name=versmolten met schaduw
actors.buffs.shadows.desc=Je bent versmolten in de schaduwen om je heen, waardoor je onzichtbaar bent en je metabolisme wordt vertraagd.\n\nTerwijl je onzichtbaar bent kunnen vijanden je niet aanvallen of volgen. De meeste fysieke aanvallen en magische effecten (zoals rollen en toverstokken) beëindigen meteen je onzichtbaarheid. Bovendien is, terwijl je in de schaduw versmolten bent, de snelheid waarmee je honger krijgt verminderd.\n\nJe blijft in de schaduwen versmolten totdat je de schaduw verlaat of als een vijand in contact met je komt.

actors.buffs.slow.name=vertraagd
actors.buffs.slow.desc=Vertragingsmagie beïnvloedt de tijdsnelheid van het doelwit, voor hen lijkt alles supersnel te gaan.\n\nEen vertraagd personage heeft twee keer zo veel tijd nodig voor acties dan normaal\n\nResterende beurten met vertraging: %s.

actors.buffs.snipersmark.name=gemerkt
actors.buffs.snipersmark.action_name_snapshot=snelschot
actors.buffs.snipersmark.action_name_volley=salvo
actors.buffs.snipersmark.action_name_sniper=sluipschutterschot
actors.buffs.snipersmark.desc=De Sluipschutter concentreert zich op het laatst aangevallen doelwit. Ze kan een speciale aanval uitvoeren met haar boog, die varieert afhankelijk van hoe de boog is versterkt.\n\nEen niet-versterkte boog vuurt een _snelschot_ af, die minder schade aanricht maar geen tijd kost om te vuren.\n\nEen boog die is versterkt voor snelheid vuurt een _salvo_ van drie pijlen af. Elke pijl richt minder schade aan, maar kan nog steeds betovering activeren. Het duurt 1 beurt om een salvo te schieten.\n\nEen boog die is versterkt voor schade vuurt een _sluipschutterschot_ af. Dit schot raakt gegarandeerd, richt bonusschade aan op basis van de afstand tot het doelwit en het duurt 2 beurten om te vuren.\n\nResterende beurten: %s.

actors.buffs.soulmark.name=gezielmerkt
actors.buffs.soulmark.desc=De duivelskunstenaar maakt gebruik van de ziel van dit wezen. Hij geneest en stilt zijn honger als het wezen schade oploopt.\n\nResterende beurten zielsmarkering: %s.

actors.buffs.stamina.name=uithoudingsvermogen
actors.buffs.stamina.desc=Je hebt oneindig uithoudingsvermogen, waardoor je sneller kunt bewegen!\n\nOnder het effect van uithoudingsvermogen ren je op +50%% snelheid, maar worden andere acties op normale snelheid uitgevoerd.\n\nResterende beurten met uithoudingsvermogen: %s.

actors.buffs.vulnerable.name=kwetsbaar
actors.buffs.vulnerable.heromsg=Je voelt je kwetsbaar!
actors.buffs.vulnerable.desc=Kwetsbaarheid verhoogt alle fysieke schade die een personage oploopt met 33%%, na aftrek van de schade die door je harnas is opgevangen. \n\nResterende beurten met kwetsbaarheid: %s.

actors.buffs.terror.name=doodsbang
actors.buffs.terror.desc=Doodsangst is een manipulatieve magie die een personage in staat van oncontroleerbare paniek dwingt.\n\nDoodsbange personages worden gedwongen om weg te rennen van hun vijand, door zoveel mogelijk deuren en muren tussen hen en hun vijand te krijgen. Een pijnstoot verkort de duur van doodsangst.\n\nResterende beurten met doodsangst: %s.

actors.buffs.toxicimbue.name=verrijkt met gif
actors.buffs.toxicimbue.desc=Je bent met gif verrijkt!\n\nTerwijl je rondloopt wordt er constant een wolk gifgas afgegeven die schade toebrengt aan je vijanden. Jij bent immuun voor gifgas en vergif zolang dit effect duurt en ook een paar beurten daarna.\n\nResterende beurten met gif verrijkt: %s

actors.buffs.corrosion.name=corrosief
actors.buffs.corrosion.heromsg=Je bent aan het smelten!
actors.buffs.corrosion.ondeath=Je smelt weg...
actors.buffs.corrosion.rankings_desc=Opgelost
actors.buffs.corrosion.desc=Krachtig zuur brandt vlees, metaal en bot op alarmerend tempo weg.\n\nCorrosieschade neemt in de loop van de tijd toe, omdat het doelwit blijft wegsmelten.\n\nResterende beurten van corrosie: %1$s.\nHuidige corrosieschade: %2$d.

actors.buffs.vertigo.name=duizelig
actors.buffs.vertigo.desc=In een rechte lijn lopen kan moeilijk zijn als de hele wereld aan het tollen is.\n\nDoor de effecten van duizeligheid bewegen personages zich in een willekeurige richting, in plaats van de richting die ze op willen gaan.\n\nResterende beurten van duizeligheid: %s.

actors.buffs.wandempower.name=toverstok bekrachtiging
actors.buffs.wandempower.desc=Jouw schade-toebrengende toverstokken zijn bekrachtigd, waardoor ze grotere schade doen, voor een paar treffers.\n\nBonusschade: %1$d\nSchoten over: %2$d.

actors.buffs.weakness.name=verzwakt
actors.buffs.weakness.heromsg=Je voelt je verzwakt!
actors.buffs.weakness.desc=Alles lijkt opeens veel zwaarder.\n\nVerzwakkingsmagie vermindert de fysieke kracht van een personage, waardoor ze 33%%minder schade aanbrengen.\n\nResterende beurten van verzwakking: %s.

actors.buffs.wellfed.name=goed gevoed
actors.buffs.wellfed.desc=Je voelt je best voldaan en vol.\n\nTerwijl je goed gevoed bent neemt je honger niet toe, en genees je een extra hoeveelheid gezondheid over tijd.\n\nResterende beurten: %d.



###hero

##abilities
actors.hero.abilities.armorability.self_target=Je kan niet op jezelf richten!
actors.hero.abilities.armorability.no_target=Daar is niets om op te richten!
actors.hero.abilities.armorability.prompt=Kies een plek om op te richten
actors.hero.abilities.armorability.cost=Oplaadkosten: _%d_

actors.hero.abilities.warrior.heroicleap.name=heldhaftige sprong
actors.hero.abilities.warrior.heroicleap.prompt=Kies richting om te springen
actors.hero.abilities.warrior.heroicleap.short_desc=De Krijger doet een _Heldhaftige Sprong_ naar een gerichte plek, vliegend over vijanden en eventuele gevaren.
actors.hero.abilities.warrior.heroicleap.desc=De Krijger spring naar de aangewezen plek, en vliegt daarmee over vijanden en eventuele gevaren heen. Hij kan echter niet over muren of andere hard terrein springen.
actors.hero.abilities.warrior.shockwave.name=schokgolf
actors.hero.abilities.warrior.shockwave.short_desc=De Krijger laat een _Schokgolf_ in een kegelvormig gebied los door in de grond te slaan. Vijanden gevangen in de schokgolf raken beschadigd en kreupel.
actors.hero.abilities.warrior.shockwave.desc=De Krijger slaat in de grond en produceert een schokgolf die tot 5 tegels ver gaat in een kegelvorm van 60 graden.\n\nVijanden gevangen in deze schokgolf zijn kreupel voor 5 beurten. Ze krijgen ook 5-10 schade, plus een extra 1-2 schade voor elk punt die de krijger heeft in kracht boven de 10.
actors.hero.abilities.warrior.endure.name=verdraagt
actors.hero.abilities.warrior.endure$enduretracker.name=uithoudingsvermogen
actors.hero.abilities.warrior.endure$enduretracker.desc=De Krijger richt nu bonusschade aan gebaseerd op de schade die hij heeft gekregen tijdens het verdragen.\n\nBonusschade: %1$d\nSlagen over: %2$d
actors.hero.abilities.warrior.endure.short_desc=De Krijger _Verdraagt_ , slaat verschillende beurten over maar krijgt hoge schadeweerstand. Hij deelt daarna bonusschade uit gebaseerd op wat hij heeft verdragen.
actors.hero.abilities.warrior.endure.desc=De Krijger verdraagt voor 3 beurten en loopt de helft van de schade op van alle bronnen. Deze vermindering wordt toegepast voor andere schadeverminderende effecten van bijvoorbeeld een harnas.\n\nNa het verdragen krijgt zijn volgende treffer binnen 10 beurten bonusschade. Deze bonusschade is gelijk aan de helft van alle schade toegebracht aan hem tijdens het verdragen, voor alle schadeverminderende effecten!\n\nAls de krijger een combo heeft opgebouwd wordt deze met 3 beurten verlengd.

actors.hero.abilities.mage.elementalblast.name=elementaire ontploffing
actors.hero.abilities.mage.elementalblast.no_staff=Je kunt deze vaardigheid niet gebruiken zonder je staf.
actors.hero.abilities.mage.elementalblast.short_desc=De Magiër vuurt een _Elementaire Ontploffing_ af uit zijn staf, deze bedekt een groot gebied rond hem met een effect dat afhankelijk is van de toverstok waarmee zijn staf is verrijkt.
actors.hero.abilities.mage.elementalblast.desc=De Magiër zendt een ontploffing van magie uit, die een cirkelvormig gebied tot 4 tegels ver omvat en 15-25 schade doet. Het specifieke effect van de elementaire ontploffing varieert afhankelijk van de toverstok waarmee de staf van de Magiër is verrijkt.
actors.hero.abilities.mage.elementalblast.generic_desc=Het effect van de elementaire ontploffing is gelijkwaardig aan het effect van de toverstok wanneer het een vijand of bondgenoot raakt.
actors.hero.abilities.mage.wildmagic.name=wilde magie
actors.hero.abilities.mage.wildmagic.no_wands=Je hebt geen toverstokken om mee te schieten!
actors.hero.abilities.mage.wildmagic.short_desc=De Magiër ontketent de _Wilde Magie_  die zijn toverstokken bevatten, deze schiet hij willekeurig verschillende keren op een gekozen doelwit in een enkele beurt.
actors.hero.abilities.mage.wildmagic.desc=De Magiër ontketent de kracht in zijn toverstokken en vuurt ze willekeurig tot 4 keer in een enkele beurt af. De staf van de magiër is niet inbegrepen in dit effect.\n\nHet niveau van elke toverstok wordt ook versterkt met 2, tot +3. Deze vaardigheid gebruikt een halve toverstoklading voor elk schot, en geen enkele toverstaf kan meer dan 2 keer worden afgevuurd.
actors.hero.abilities.mage.warpbeacon.name=teleportatiebaken
actors.hero.abilities.mage.warpbeacon.depths=Je kunt niet teleporteren tussen verdiepingen!
actors.hero.abilities.mage.warpbeacon.locked_floor=Je kan geen vergrendelde verdieping verlaten!
actors.hero.abilities.mage.warpbeacon.too_far=Die plek is te ver weg!
actors.hero.abilities.mage.warpbeacon.invalid_beacon=Je kunt daar geen baken plaatsen!
actors.hero.abilities.mage.warpbeacon.window_desc=Je baken is momenteel geplaatst op verdieping %d.
actors.hero.abilities.mage.warpbeacon.window_tele=teleporteer naar baken
actors.hero.abilities.mage.warpbeacon.window_clear=verwijder baken
actors.hero.abilities.mage.warpbeacon.window_cancel=annuleer
actors.hero.abilities.mage.warpbeacon.short_desc=De Magiër plaatst een _Teleportatiebaken_ op zijn huidige plek, waar hij ogenblikkelijk naar terug kan teleporteren.
actors.hero.abilities.mage.warpbeacon.desc=De Magiër plaatst een baken, waar op elk moment naar geteleporteerd kan worden. Het plaatsen van het baken duurt 1 beurt, maar er naartoe teleporteren gebeurt ogenblikkelijk.\n\nDe Magiër kan standaard niet teleporteren tussen verdiepingen, of het baken gebruiken om in ontoegankelijke plaatsen zoals afgesloten kamers binnen te komen. De Magiër kan teleporteren in vijanden, dit duwt ze opzij.

actors.hero.abilities.rogue.smokebomb.name=rookbom
actors.hero.abilities.rogue.smokebomb.fov=Je kan alleen naar een lege plek springen die je kan zien.
actors.hero.abilities.rogue.smokebomb.prompt=Kies een plek om naartoe te springen
actors.hero.abilities.rogue.smokebomb$ninjalog.name=houten lokaas
actors.hero.abilities.rogue.smokebomb$ninjalog.desc=Op de een of andere manier zijn vijanden makkelijk overtuigd dat dit houten lokaas de echte Schurk is!
actors.hero.abilities.rogue.smokebomb$ninjalog.discover_hint=Je kunt dit personage vinden met een specifieke heldenharnasvaardigheid.
actors.hero.abilities.rogue.smokebomb.short_desc=De Schurk gooit een _Rookbom_ terwijl hij weg teleporteert. Hij verblindt de vijanden in de buurt van zijn oude plek.
actors.hero.abilities.rogue.smokebomb.desc=De Schurk gooit een rookbom en teleporteert dan tot 6 tegels ver. Hij kan door gevaren en vijanden teleporteren maar niet door hard terrein zoals muren.\n\nVijanden die naast de Schurk zijn oude positie staan worden verblind voor 5 beurten.
actors.hero.abilities.rogue.deathmark.name=doodsmarkering
actors.hero.abilities.rogue.deathmark.ally_target=Je kan enkel vijanden markeren
actors.hero.abilities.rogue.deathmark.short_desc=De Schurk plaatst een _Doodsmarkering_ op een verkozen vijand. Gemarkeerde vijanden lopen bonusschade op, maar kunnen niet sterven tot de markering eindigt.
actors.hero.abilities.rogue.deathmark.desc=De Schurk plaatst een markering op een gekozen vijand, wat er voor zorgt dat ze 25% extra schade oplopen. De markering is onmiddellijk geplaatst en duurt voor 5 beurten.\n\nGemarkeerde vijanden krijgen bonusschade maar kunnen niet sterven tot de markering eindigt. Als een vijand 0 gezondheid heeft wanneer de markering eindigt, sterven ze onmiddellijk.
actors.hero.abilities.rogue.deathmark$deathmarktracker.name=gemarkeerd voor dood
actors.hero.abilities.rogue.deathmark$deathmarktracker.desc=Deze vijand is gemarkeerd, waardoor ze 25%% bonusschade oplopen, maar ze kunnen ook niet sterven totdat de markering eindigt.\n\nResterende beurten: %s.
actors.hero.abilities.rogue.shadowclone.name=schaduwkloon
actors.hero.abilities.rogue.shadowclone.short_desc=De Schurk roept een _Schaduwkloon_ op, die kan worden gericht om hem te helpen in de strijd.
actors.hero.abilities.rogue.shadowclone.desc=De Schurk roept een schaduwachtige nabootsing van zichzelf op, deze kan gericht worden om hem te helpen in gevechten. Het aansturen van de schaduwkloon kost niets.\n\nDe kloon heeft 80 gezondheid, geen harnas en richt 10-20 schade aan. Al deze eigenschappen kunnen verbeterd worden met talenten, zodat de kloon profiteert van de wapens en het harnas van de held.
actors.hero.abilities.rogue.shadowclone$shadowally.name=schaduwschurk
actors.hero.abilities.rogue.shadowclone$shadowally.direct_defend=Je kloon gaat naar die positie.
actors.hero.abilities.rogue.shadowclone$shadowally.direct_follow=Je kloon volgt jou.
actors.hero.abilities.rogue.shadowclone$shadowally.direct_attack=Je kloon beweegt om aan te vallen!
actors.hero.abilities.rogue.shadowclone$shadowally.desc=Een kopie van de Schurk, gemaakt van schaduwrijke duisternis. Hij staat doodstil, met lege ogen waaruit kleine slierten duisternis opstijgen als stoom.\n\nDe kloon is geen perfecte kopie van de Schurk, maar is nog steeds een behoorlijke vechter en kan profiteren van de uitrusting van de Schurk met de juiste talenten.
actors.hero.abilities.rogue.shadowclone$shadowally.discover_hint=Je kunt dit personage vinden met een specifieke heldenharnasvaardigheid.

actors.hero.abilities.huntress.spectralblades.name=spookachtige messen
actors.hero.abilities.huntress.spectralblades.short_desc=De Jaagster gooit _Spookachtige Messen_ naar een doelwit, die schade doen afhankelijk van het momenteel uitgeruste slagwapen.
actors.hero.abilities.huntress.spectralblades.desc=De Jaagster gooit een spookachtig mes naar een vijand, die werkt als een afstandsaanval van haar slagwapen. Alle normale effecten van een slagwapen worden geactiveerd, inclusief betoveringen.
actors.hero.abilities.huntress.naturespower.name=natuurkracht
actors.hero.abilities.huntress.naturespower.short_desc=De Jaagster doet beroep op _Natuurkracht_, dit verhoogt haar bewegingssnelheid en schietsnelheid van haar boog voor een korte periode.
actors.hero.abilities.huntress.naturespower.desc=De Jaagster maakt zichzelf en haar boog tijdelijk sterker met de kracht van de natuur! Dit houdt aan voor 8 beurten.\n\nGedurende deze tijd beweegt de Jaagster met 2x snelheid en valt ze 33% sneller aan met haar boog. De bonus boogeffecten worden niet geactiveerd als de Sluipschutter haar speciale aanvallen gebruikt.
actors.hero.abilities.huntress.naturespower$naturespowertracker.name=natuurkracht
actors.hero.abilities.huntress.naturespower$naturespowertracker.desc=De Jaagster is tijdelijk versterkt, dit verhoogt haar snelheid en aanvalssnelheid met haar boog.\n\nResterende beurten: %s.
actors.hero.abilities.huntress.spirithawk.name=havikgeest
actors.hero.abilities.huntress.spirithawk.no_space=Er is geen vrije plaats naast jou.
actors.hero.abilities.huntress.spirithawk.short_desc=De Jaagster roept een _Havikgeest_ op, die haar kan helpen plekken te verkennen en vijanden af te leiden.
actors.hero.abilities.huntress.spirithawk.desc=De Jaagster roept een bekende havikgeest op, die kan worden gericht door deze vaardigheid opnieuw te gebruiken terwijl de geest is opgeroepen. De havik blijft voor 100 beurten, het sturen van de havik kost niets.\n\nDe havik heeft minimale gezondheid en aanvalskracht, maar is snel, ontwijkend en nauwkeurig. Hij deelt zijn volledige gezichtsveld te allen tijde met de Jaagster. Het is immuun voor alle gebiedsgebonden effecten, zoals vuur en gifgas. Het valt niet aan tenzij het specifiek gericht wordt.
actors.hero.abilities.huntress.spirithawk$hawkally.name=havikgeest
actors.hero.abilities.huntress.spirithawk$hawkally.direct_defend=Je havik beweegt naar die positie.
actors.hero.abilities.huntress.spirithawk$hawkally.direct_follow=Je havik volgt jou.
actors.hero.abilities.huntress.spirithawk$hawkally.direct_attack=Je havik beweegt om aan te vallen.
actors.hero.abilities.huntress.spirithawk$hawkally.desc=Een magische havik, die is opgeroepen door de Jaagster. Hij gloeit helder etherisch blauw, zijn hoofd beweegt constant rond terwijl het zijn gebied overziet.\n\nHoewel het niet echt een vechter is, maken zijn snelheid en visie hem uitstekend geschikt voor het opspeuren en afleiden van vijanden.
actors.hero.abilities.huntress.spirithawk$hawkally.desc_remaining=Resterende beurten: %d.
actors.hero.abilities.huntress.spirithawk$hawkally.desc_dodges=Resterende gegarandeerde ontwijking: %d.
actors.hero.abilities.huntress.spirithawk$hawkally.discover_hint=Je kunt dit personage vinden met een specifieke heldenharnasvaardigheid.

actors.hero.abilities.duelist.challenge.name=uitdaging
actors.hero.abilities.duelist.challenge.prompt=Kies een vijand om uit te dagen
actors.hero.abilities.duelist.challenge.already_dueling=Je kunt maar in één duel tegelijk zijn.
actors.hero.abilities.duelist.challenge.ally_target=Je kunt alleen vijanden uitdagen.
actors.hero.abilities.duelist.challenge.unreachable_target=Je moet je doel kunnen bereiken.
actors.hero.abilities.duelist.challenge.distant_target=Die vijand is te ver weg om uit te dagen.
actors.hero.abilities.duelist.challenge.short_desc=De Duellist _daagt_ een nabije vijand _uit_ voor een duel, waarbij alle andere vijanden tijdelijk worden bevroren.
actors.hero.abilities.duelist.challenge.desc=De Duellist daagt een nabije vijand uit voor een duel. Die vijand is gedwongen haar te bevechten terwijl alle andere vijanden tijdelijk zijn bevroren in de tijd.\n\nHet doelwit moet bereikbaar zijn en zich binnen 5 tegels van de Duellist begeven. Het duel duurt tot er 10 beurten voorbij zijn, de vijand sterft of de duellist meer dan 5 tegels verwijderd is van de vijand.\n\nBevroren vijanden zijn onkwetsbaar. De bondgenoten van de Duellist worden niet bevroren door deze vaardigheid, maar als een baas het doelwit is, worden zijn volgelingen ook niet bevroren.
actors.hero.abilities.duelist.challenge$duelparticipant.name=duel deelnemer
actors.hero.abilities.duelist.challenge$duelparticipant.desc=Dit personage neemt deel aan een duel. Zij, en al hun bondgenoten of volgelingen, mogen zich normaal gedragen terwijl anderen bevroren zijn.\n\nHet duel duurt een bepaalde tijd, totdat een deelnemer sterft of totdat de deelnemers meer dan 5 tegels verwijderd zijn van elkaar.\n\nResterende beurten: %d.
actors.hero.abilities.duelist.elementalstrike.name=elementaire aanval
actors.hero.abilities.duelist.elementalstrike.short_desc=De Duellist voert een _elementaire aanval_ uit en verspreidt een effect in een kegelvormig gebied op basis van haar wapenbetovering.
actors.hero.abilities.duelist.elementalstrike.desc=De Duellist valt een vijand of plek aan, voert een reguliere aanval uit die gegarandeerd raakt en verspreidt een magisch effect dat zich over maximaal 4 tegels in een kegel van 65 graden verspreidt. Dit magische effect varieert afhankelijk van de betovering op het primaire wapen van de Duellist.
actors.hero.abilities.duelist.elementalstrike.generic_desc=Een elementaire aanval zonder betovering geeft een kleine uitbarsting van magie vrij, die 6-12 schade toebrengt aan alle vijanden in het bereik.
actors.hero.abilities.duelist.feint.name=schijnbeweging
actors.hero.abilities.duelist.feint.prompt=Kies een plek om naartoe te rennen
actors.hero.abilities.duelist.feint.too_far=Die plek grenst niet aan jou.
actors.hero.abilities.duelist.feint.bad_location=Je kunt niet naar die plek gaan.
actors.hero.abilities.duelist.feint.short_desc=De Duellist maakt een _schijnbeweging_, waarbij ze doet alsof ze aanvalt terwijl ze naar een aangrenzende tegel rent. Vijanden vallen haar achtergebleven inbeelding aan, waardoor een tegenaanval kan worden ingezet.
actors.hero.abilities.duelist.feint.desc=De Duellist doet alsof ze aanvalt terwijl ze naar een aangrenzende tegel rent, waarbij ze een kortstondig een inbeelding van zichzelf achterlaat. Vijanden die de Duellist aanvielen, vallen in plaats daarvan haar de inbeelding aan.\n\nVijanden die de inbeelding aanvallen raken in de war, wat hun volgende actie afbreekt en hen blootstelt aan een verrassingsaanval.

actors.hero.abilities.cleric.ascendedform.name=hogere vorm
actors.hero.abilities.cleric.ascendedform.short_desc=De Geestelijke neemt een _Hogere Vorm_ aan, waardoor hij nieuwe spreuken, een groter aanvalsbereik en meer bescherming krijgt.
actors.hero.abilities.cleric.ascendedform.desc=De Geestelijke projecteert heilige energie vanuit zichzelf, en neemt een uitgebreide stralende vorm aan voor 10 beurten. In deze vorm kan de Geestelijke nieuwe spreuken uitspreken, krijgt 2 extra aanvalsbereik, 30 afscherming en alle extra spreuken die hij uitspreekt, geven 10 afscherming per gebruikte lading van het heilig boek .\n\nDe afscherming van de hogere vorm en zijn spreuken vervalt niet normaal, maar zal onmiddellijk vervagen zodra de hogere vorm eindigt. De vaardigheid kan opnieuw worden gebruikt om de duur van de hogere vorm te vernieuwen.
actors.hero.abilities.cleric.ascendedform$ascendbuff.name=hogere vorm
actors.hero.abilities.cleric.ascendedform$ascendbuff.desc=Stralende energie straalt uit het lichaam van de Geestelijke. Terwijl hij in deze vorm is, krijgt de Geestelijke 2 extra aanvalsbereik (van de heilige energie die van hem uitstraalt) en 10 afscherming wanneer hij een heilig boek lading gebruikt. Hij kan ook de spreuken uitspreken die worden ontgrendeld via de talenten van de hogere vorm.\n\nHet schild dat wordt verleend door de hogere vorm en zijn spreuken zullen niet normaal vervallen, maar zullen onmiddellijk vervagen wanneer de hogere vorm eindigt.\n\nHuidige afscherming: %1$d.\nResterende beurten: %2$d.
actors.hero.abilities.cleric.trinity.name=drie-eenheid
actors.hero.abilities.cleric.trinity.no_imbue=Drie-eenheid heeft momenteel geen effect ingesteld voor een van zijn vormen, gebruik een van zijn spreuken!
actors.hero.abilities.cleric.trinity.no_duplicate=Drie-eenheid kan geen effect dupliceren dat je al hebt uitgerust!
actors.hero.abilities.cleric.trinity.ench_glyph_use=Drie-eenheid zal dit effect gedurende _ %1$d beurten_  toepassen tegen de kosten van _ %2$s ladingen._
actors.hero.abilities.cleric.trinity.rare_ench_glyph_use=Drie-eenheid zal dit _krachtige_ effect gedurende _ %1$d beurten_ toepassen tegen de kosten van _%2$s ladingen._
actors.hero.abilities.cleric.trinity.wand_use=Drie-eenheid zal met deze toverstok schieten met _+%1$d_ ten koste van _%2$s ladingen_.
actors.hero.abilities.cleric.trinity.wand_multi_use=Drie-eenheid zal met deze toverstok met _meerdere ladingen_ schieten met _+%1$d_ ten koste van _%2$s ladingen_.
actors.hero.abilities.cleric.trinity.thrown_use=Drie-eenheid zal dit wapen met level _+%1$d_ gooien ten koste van _ %2$sladingen._
actors.hero.abilities.cleric.trinity.ring_use=Drie-eenheid zal het effect van deze ring toepassen op _+%1$d_ gedurende 20 beurten, ten koste van _%2$s ladingen._
actors.hero.abilities.cleric.trinity.alchemiststoolkit_use=Drie-eenheid zal het externe alchemie-effect van dit artefact toepassen, ten koste van _%2$s ladingen._
actors.hero.abilities.cleric.trinity.chaliceofblood_use=Drie-eenheid zal het passieve gezondheidsregeneratie-effect van dit artefact toepassen met _+%1$d_ gedurende 20 beurten, ten koste van _%2$s ladingen._
actors.hero.abilities.cleric.trinity.driedrose_use=Drie-eenheid zal het effect van dit artefact gebruiken om een corrupte, vriendelijke schim op te roepen met de gezondheid van een _+%1$d_ spook, ten koste van _%2$s ladingen._
actors.hero.abilities.cleric.trinity.etherealchains_use=Drie-eenheid zal het kettingeffect van dit artefact toepassen met een bereik van _+%1$d_, ten koste van _%2$s ladingen._
actors.hero.abilities.cleric.trinity.hornofplenty_use=Drie-eenheid zal het snackeffect van dit artefact toepassen, ten koste van _%2$s ladingen._
actors.hero.abilities.cleric.trinity.masterthievesarmband_use=Drie-eenheid zal het diefstaleffect van dit artefact toepassen bij _+%1$d_, ten koste van _%2$s ladingen._
actors.hero.abilities.cleric.trinity.sandalsofnature_use=Drie-eenheid zal het worteleffect van dit artefact toepassen met een willekeurig schadelijk zaadje, ten koste van _%2$s ladingen._
actors.hero.abilities.cleric.trinity.skeletonkey_use=Drie-eenheid zal het invoeg-effect van dit artefact toepassen, ten koste van _%2$s ladingen._
actors.hero.abilities.cleric.trinity.talismanofforesight_use=Drie-eenheid zal het kristalkijk-effect van dit artefact toepassen op _+%1$d_, ten koste van _%2$s ladingen._
actors.hero.abilities.cleric.trinity.timekeepershourglass_use=Drie-eenheid zal het tijdbevriezingseffect van dit artefact toepassen met een _%1$d_ beurtduur, ten koste van _%2$s ladingen._
actors.hero.abilities.cleric.trinity.unstablespellbook_use=Trinity zal het willekeurige rol-effect van dit artefact toepassen met een kans van _%1$d/10_ om de exotische versie zonder extra kosten aan te bieden, ten koste van _%2$s ladingen._
actors.hero.abilities.cleric.trinity.cost=De lading kosten voor deze vaardigheid variëren, maar bedragen meestal _%d._
actors.hero.abilities.cleric.trinity.short_desc=De Geestelijke krijgt een _Drie-eenheid_ aan vaardigheden, die de uitrusting nabootsen die hij heeft gezien en die hij kan verwisselen door nieuwe spreuken te gebruiken.
actors.hero.abilities.cleric.trinity.desc=De Geestelijke krijgt een _Drie-eenheid_ van pantservaardigheden, die kunnen worden gewisseld door drie nieuwe spreuken te gebruiken. Elk van deze spreuken is gericht op het nabootsen van de effecten van uitrusting die de Geestelijke tijdens deze verkenning heeft geïdentificeerd: lichaam (wapens en bepantsering), geest (toverstokken en werpwapens) en geest (ringen en artefacten).\n\nElke Drie-eenheid-vorm kan met één effect tegelijk worden doordrenkt, en de Geestelijke kiest welke hij activeert bij het gebruik van Drie-eenheid. Drie-eenheid zal niet het effect dupliceren van iets dat je al hebt uitgerust.
actors.hero.abilities.cleric.trinity$wndusetrinity.text=Selecteer welke vorm van Drie-eenheid je wilt gebruiken. De effecten van verschillende vormen kunnen tegelijkertijd actief zijn.
actors.hero.abilities.cleric.trinity$wndusetrinity.body=_Lichaamsvorm: %s._
actors.hero.abilities.cleric.trinity$wndusetrinity.mind=_Verstandsvorm: %s._
actors.hero.abilities.cleric.trinity$wndusetrinity.spirit=_Geestvorm: %s._
actors.hero.abilities.cleric.trinity$wnditemtypeselect.text=Selecteer een effect dat in Drie-eenheid moet worden opgenomen. Er wordt aanvullende informatie weergegeven vóór bevestiging.
actors.hero.abilities.cleric.trinity$wnditemconfirm.body=Wijs toe aan lichaamsvorm
actors.hero.abilities.cleric.trinity$wnditemconfirm.mind=Wijs toe aan verstandsvorm
actors.hero.abilities.cleric.trinity$wnditemconfirm.spirit=Wijs toe aan geestvorm
actors.hero.abilities.cleric.powerofmany.name=kracht van velen
actors.hero.abilities.cleric.powerofmany.prompt_default=Kies een bondgenoot of een plek
actors.hero.abilities.cleric.powerofmany.prompt_ally=Leid je lichtbondgenoot
actors.hero.abilities.cleric.powerofmany.ally_exists=Je hebt al een versterkte bondgenoot.
actors.hero.abilities.cleric.powerofmany.no_vision=Je kunt geen plek kiezen die je niet kunt zien.
actors.hero.abilities.cleric.powerofmany.only_allies=Je kunt alleen bondgenoten sterker maken.
actors.hero.abilities.cleric.powerofmany.short_desc=De Geestelijke kanaliseert de _Kracht van Velen_, door een bestaande bondgenoot te versterken of een nieuwe te creëren.
actors.hero.abilities.cleric.powerofmany.desc=De Geestelijke kanaliseert de _Kracht van Velen_, die een bestaande bondgenoot versterkt of een nieuwe sterke bondgenoot creëert voor 100 beurten. Een lege plek kiezen creëert een nieuwe bondgenoot.\n\nTerwijl hij versterkt is door Kracht van Velen, veroorzaakt elke bondgenoot +25% schade, ontvangt -25% schade en deelt zijn visie met de Geestelijke. Hij krijgt ook 25 shielding wanneer de vaardigheid wordt gebruikt.\n\nDe Geestelijke krijgt ook drie nieuwe spreuken die alleen kunnen worden uitgesproken met een versterkte bondgenoot. Kracht van Velen eindigt niet zolang een van deze spreuken actief is.
actors.hero.abilities.cleric.powerofmany$powerbuff.name=kracht van velen
actors.hero.abilities.cleric.powerofmany$powerbuff.desc=Deze bondgenoot is bekrachtigd door Kracht van Velen, wat hem +25%% toegebrachte schade en -25%% ontvangen schade geeft. Hij deelt ook zijn zichtbereik met de Geestelijke en kan profiteren van Kracht van Velen spreuken.\n\nKracht van Velen blijft bestaan wanneer bondgenoten zoals prismatische beelden zich verstoppen, maar de duur ervan zal nog steeds aftellen.\n\nResterende beurten: %s.
actors.hero.abilities.cleric.powerofmany$lightally.name=lichtbondgenoot
actors.hero.abilities.cleric.powerofmany$lightally.direct_defend=Je bondgenoot gaat naar die positie.
actors.hero.abilities.cleric.powerofmany$lightally.direct_follow=Je bondgenoot volgt jou.
actors.hero.abilities.cleric.powerofmany$lightally.direct_attack=Je bondgenoot gaat in de aanval!
actors.hero.abilities.cleric.powerofmany$lightally.desc=Een kopie van een van de avontuurlijke metgezellen van de Geestelijke, gemaakt van massief licht. Hoewel het de vorm heeft van een andere held, heeft het geen van hun unieke vaardigheden. Deze bondgenoot zal blijven bestaan zolang Kracht van Velen op hen wordt toegepast.\n\nDeze bondgenoot kan zonder kosten worden aangestuurd door de Kracht van Velen pantservaardigheid opnieuw te gebruiken.
actors.hero.abilities.cleric.powerofmany$lightally.discover_hint=Je kunt dit personage vinden met een specifieke heldenharnasvaardigheid.


actors.hero.abilities.ratmogrify.name=ratformeren
actors.hero.abilities.ratmogrify.cant_transform=Je kunt dat niet ratformeren!
actors.hero.abilities.ratmogrify.too_strong=De vijand is te sterk om te ratformeren!
actors.hero.abilities.ratmogrify.short_desc=De held _Ratformeert_ een vijand! Dit verandert ze tijdelijk in een rat zonder vaardigheden.
actors.hero.abilities.ratmogrify.desc=De held verandert 6 beurten lang een vijand in een rat! Bazen, bondgenoten en ratten kunnen niet worden geratformeerd.\n\nGeratformeerde vijanden behouden hun originele eigenschappen, maar hebben geen vaardigheden.
actors.hero.abilities.ratmogrify$transmograt.name=geratmorfeerde %s
actors.hero.abilities.ratmogrify$transmograt.desc=Deze vijand is veranderd in een rat. Een grote vooruitgang, als je het mij vraagt! - De Rattenkoning
actors.hero.abilities.ratmogrify$transmograt.rankings_desc=Verslagen door: geratformeerde vijand

##Cleric Spells
actors.hero.spells.auraofprotection.name=aura van bescherming
actors.hero.spells.auraofprotection.short_desc=Verbetert de verdediging van de Paladijn en nabije bondgenoten.
actors.hero.spells.auraofprotection.desc=De Paladijn begint beschermende energie in een sprankelende aura om zichzelf heen te stralen gedurende 20 beurten. Elke bondgenoot binnen 2 tegels van de Paladijn (inclusief zichzelf) krijgt %1$d%% minder schade en krijgt het effect van het harnassymbool van de Paladijn bij +%2$d%% kracht.\n\nDeze schadevermindering vindt plaats vóór andere schadeverminderende effecten (bijv. harnas). De symbool-krachtverhoging zal altijd van toepassing zijn, maar deze spreuk kan de symbool van de Paladin niet meer dan één keer van toepassing laten zijn als een personage er al van profiteert (bijv. de Paladijn zelf of een prismatisch beeld).
actors.hero.spells.auraofprotection$aurabuff.name=aura van bescherming
actors.hero.spells.auraofprotection$aurabuff.desc=De Paladijn straalt beschermende energie om zich heen.\n\nElke bondgenoot in de buurt (inclusief de Paladijn zelf) loopt minder schade op en krijgt het effect van het harnassymbool van de Paladijn met verhoogde kracht.\n\nResterende beurten: %s.

actors.hero.spells.beamingray.name=stralende straal
actors.hero.spells.beamingray.no_space=Er is geen ruimte voor je bondgenoot om daar te verschijnen.
actors.hero.spells.beamingray.out_of_range=Die plek is buiten bereik.
actors.hero.spells.beamingray.short_desc=Teleporteert je bondgenoot en geeft extra schade.
actors.hero.spells.beamingray.desc=De Geestelijke kanaliseert de kracht van zijn bondgenoot in een lichtstraal die hem naar een locatie straalt. Als de straal botst met een vijand, plaatst hij de bondgenoot in de buurt en stuurt hem naar de vijand.\n\nDe straal heeft een maximaal bereik van %1$d tegels en verhoogt de bonusschade van Kracht van Velen tot +%2$d%% voor 10 beurten tegen de dichtstbijzijnde vijand binnen 4 tegels. De Stralende Straal kan zelfs normaal gesproken onbeweeglijke bondgenoten teleporteren, maar zijn bereik wordt in deze gevallen gehalveerd.
actors.hero.spells.beamingray$beamingrayboost.name=stralende straal
actors.hero.spells.beamingray$beamingrayboost.desc=Deze bondgenoot is onlangs geteleporteerd door Stralende Straal wat hem bonusschade geeft tegen de dichtstbijzijnde vijand na de teleport. De Kracht van Velen vervalt ook niet als deze verbetering actief is.\n\nResterende beurten: %s.

actors.hero.spells.blessspell.name=zegen
actors.hero.spells.blessspell.short_desc=Zegent en maakt een schild voor de Geestelijke, zegent en geneest anderen.
actors.hero.spells.blessspell.desc=De Geestelijke plaatst een heilige zegen op zichzelf of een ander personage dat hij kan zien.\n\nWanneer het op zichzelf wordt gericht, is het effect zwakker, waardoor er %1$d beurten van zegening en %2$d barrières ontstaan.\n\nWanneer de spreuk op andere personages wordt uitgeoefend, is deze krachtiger en geeft hij %3$d beurten van zegen en %4$d genezing. Overtollige genezing wordt omgezet in barrière.

actors.hero.spells.bodyform.name=lichaamsvorm
actors.hero.spells.bodyform.short_desc=Wijst Drie-eenheid toe aan een betovering of symbool.
actors.hero.spells.bodyform.desc=De Geestelijke kiest een betovering of symbool die hij deze verkenning heeft geïdentificeerd en geeft Drie-eenheid het effect ervan.\n\nWanneer Drie-eenheid wordt gebruikt, krijgt de Geestelijke het effect van de gekozen betovering of symbool voor %d beurten. Deze tijdelijke betovering of symbool werkt met elk effect dat een normale betovering of symbool zou doen.\n\nDeze spreuk vervangt elk ander effect waarmee Drie-eenheid op dat moment is doordrenkt.
actors.hero.spells.bodyform$bodyformbuff.name=lichaamsvorm
actors.hero.spells.bodyform$bodyformbuff.desc=Drie-eenheids lichaamsvorm geeft je momenteel de kracht van een betovering of symbool, alsof je het op je huidige wapen of harnas aanwezig is.\n\nLet op dat de lichaamsvorm geen andere kopie van een effect kan bieden waar je al van profiteert.\n\nHuidig effect: %1$s.\n\nResterende beurten: %2$s.

actors.hero.spells.cleanse.name=reinig
actors.hero.spells.cleanse.short_desc=Verwijdert negatieve effecten en biedt bescherming.
actors.hero.spells.cleanse.desc=De Geestelijke wist onmiddellijk alle schadelijke effecten op zichzelf en zichtbare bondgenoten. Nadat de betovering is geëindigd, krijgen alle getroffen personages ook %1$d beurten van verzwakkingsimmuniteit en %2$d barrière.

actors.hero.spells.clericspell.prompt=Kies een doel
actors.hero.spells.clericspell.no_target=Er is daar geen doel.
actors.hero.spells.clericspell.invalid_target=Je kunt niet op die plek richten.
actors.hero.spells.clericspell.invalid_enemy=Je kunt die vijand niet als doelwit kiezen.
actors.hero.spells.clericspell.charge_cost=Oplaadkosten: %d

actors.hero.spells.divinesense.name=goddelijk gevoel
actors.hero.spells.divinesense.short_desc=Krijg tijdelijk geestvisie in een breed bereik.
actors.hero.spells.divinesense.desc=De Geestelijke richt zijn zintuigen op zijn omgeving en krijgt geestvisie met een bereik van %d tegels voor 50 beurten. Het uitspreken van deze spreuk kost geen tijd.
actors.hero.spells.divinesense$divinesensetracker.name=goddelijk gevoel
actors.hero.spells.divinesense$divinesensetracker.desc=Dit personage kan tijdelijk andere wezens in de buurt zien met zijn geest!\n\nResterende beurten: %s.

actors.hero.spells.divineintervention.name=goddelijke interventie
actors.hero.spells.divineintervention.short_desc=Enorme schildversterking voor de Geestelijke en bondgenoten.
actors.hero.spells.divineintervention.desc=De Geestelijke giet een enorme hoeveelheid kracht uit hun boek in zichzelf en bondgenoten, waardoor iedereen wordt versterkt met %1$d afscherming en hogere vorm met %2$d beurten wordt verlengd. De ongelooflijke verdedigende kracht van deze spreuk wordt afgewogen tegen de zeer hoge kosten van de lading. \n\nNet als andere afschermingen die door de hogere vorm worden verleend, vervalt deze afscherming niet geleidelijk, maar vervalt onmiddellijk wanneer de hogere vorm eindigt.

actors.hero.spells.flash.name=flits
actors.hero.spells.flash.prompt=Kies een plek
actors.hero.spells.flash.short_desc=Teleporteer naar een dichtbije plek
actors.hero.spells.flash.desc=De Geestelijke kanaliseert zijn opgestegen vorm op een nabijgelegen plek en teleporteert daarheen. Flits kan de Geestelijke teleporteren naar elke ontdekte plek die binnen bereik is en onbezet. Elke keer dat deze spreuk in dezelfde hogere vorm wordt gebruikt, kost deze spreuk meer boekladingen.

actors.hero.spells.guidinglight.name=leidend licht
actors.hero.spells.guidinglight.short_desc=Brengt magische schade toe op afstand en garandeert een treffer.
actors.hero.spells.guidinglight.desc=De Geestelijke vuurt een straal magische energie af die een doelwit raakt, 2-8 schade aanricht en het doelwit verlicht. De volgende onbelaste fysieke aanval die tegen een verlichte vijand wordt uitgevoerd, zal hem gegarandeerd raken.
actors.hero.spells.guidinglight.desc_priest=_Deze spreuk is krachtiger wanneer deze door de Priester wordt uitgesproken._ De eerste keer dat de spreuk binnen 50 beurten wordt uitgesproken, kost geen boekladingen, en de verlichting kan worden geactiveerd door uitstraling, toverstokken, andere personages en artefacten die rechtstreeks invloed hebben op vijanden. Wanneer het op deze manier wordt geactiveerd, veroorzaakt Verlichting bonus magische schade die gelijk is aan het niveau van de Priester + 5.
actors.hero.spells.guidinglight$guidinglightpriestcooldown.name=Leidend Licht
actors.hero.spells.guidinglight$guidinglightpriestcooldown.desc=De Priester kan Leidend Licht weer gratis opnieuw uitspreken nadat 50 beurten zijn verstreken.\n\nResterende beurten: %s.
actors.hero.spells.guidinglight$illuminated.name=Verlicht
actors.hero.spells.guidinglight$illuminated.desc=Dit personage gloeit doordat het geraakt is door leidend licht. Hoewel de gloed niet sterk genoeg is om de omgeving te verlichten, zal het magische effect het voor de Geestelijke veel gemakkelijker maken om ze te raken.
actors.hero.spells.guidinglight$illuminated.desc_priest=De Priester kan bovendien verlichting consumeren met een toverstok, een aanval van een bondgenoot of effecten van sommige artefacten. Het op deze manier gebruiken van verlichting veroorzaakt bonus magische schade die gelijk is aan het niveau van de Priester + 5.
actors.hero.spells.guidinglight$illuminated.desc_generic=Andere helden kunnen nog steeds Verlichting gebruiken om te profiteren van het Schroeiend Licht talent, maar zullen niet nauwkeuriger worden.

actors.hero.spells.hallowedground.name=gewijde grond
actors.hero.spells.hallowedground.prompt=Kies een plek
actors.hero.spells.hallowedground.short_desc=Geneest bondgenoten, vertraagt vijanden en verspreidt gras in het effectgebied.
actors.hero.spells.hallowedground.desc=De Priester concentreert zijn goddelijke magie op de grond in de buurt, waardoor er een %1$dx%1$d-gebied van heilig terrein ontstaat voor 20 beurten.\n\nWanneer deze spreuk wordt uitgesproken, geneest deze alle bondgenoten voor 15 gezondheid (gezonde bondgenoten en de Priester krijgen een schild), wortelt vijanden kortstondig en verspreidt kort gras.\n\nHet gewijde terrein geneest bondgenoten voor 1 gezondheid per beurt (gezonde bondgenoten en de Priester krijgen een schild), verlamt vijanden en zorgt ervoor dat er willekeurig hoog gras groeit.\n\nGewijd terrein wordt vernietigd door vuur en produceert vertrapt gras als passieve herstel-effecten zijn uitgeschakeld of de Priester een tijdje geen ervaring heeft opgedaan.
actors.hero.spells.hallowedground$hallowedterrain.desc=De grond hier is gewijd. Gewijde grond vertraagt vijanden, geneest bondgenoten en zorgt ervoor dat gras zich verspreidt.

actors.hero.spells.holyintuition.name=heilige intuïtie
actors.hero.spells.holyintuition.prompt=kies een voorwerp
actors.hero.spells.holyintuition.cursed=Je voelt een kwaadaardige magie schuilen in dit item.
actors.hero.spells.holyintuition.uncursed=Dit voorwerp is vrij van kwaadaardige magie.
actors.hero.spells.holyintuition.short_desc=geeft aan of een voorwerp vervloekt is of niet.
actors.hero.spells.holyintuition.desc=De Geestelijke richt zijn zintuigen op een voorwerp en bepaalt of het vervloekt is of niet, zonder het voorwerp te hoeven gebruiken.

actors.hero.spells.holylance.name=heilig lans
actors.hero.spells.holylance.short_desc=Brengt zware magische afstandsschade aan.
actors.hero.spells.holylance.desc=De Priester concentreert een grote hoeveelheid energie in een verwoestend geworpen lans van licht. Deze lans richt %1$d-%2$d schade aan en richt altijd maximale schade aan ondode en demonische doelen aan.\n\nDeze spreuk is erg duur en heeft een afkoeltijd van 30 beurten.
actors.hero.spells.holylance$lancecooldown.name=heilig lans afkoelperiode
actors.hero.spells.holylance$lancecooldown.desc=De Priester heeft onlangs Heilig Lans gebruikt en moet wachten voordat hij het opnieuw kan gebruiken.\n\nResterende beurten: %s.

actors.hero.spells.holyward.name=heilige bescherming
actors.hero.spells.holyward.glyph_name=%s van licht
actors.hero.spells.holyward.glyph_desc=Dit symbool verhoogt enigszins de hoeveelheid schade die een harnas kan blokkeren.
actors.hero.spells.holyward.short_desc=Heft tijdelijk symbolen op om de harnas blokkering te versterken.
actors.hero.spells.holyward.desc=De Geestelijke vult zijn harnas dat hij momenteel draagt aan met symbolen van heilig licht, waardoor de schadeblokkering van het harnas met 1 toeneemt. Deze spreuk kost geen beurt om uit te spreken.\n\nDit symbool blijft 50 beurten actief en zal elk gunstig symbool van het harnas gedurende de duur overschrijven. De Geestelijke profiteert van dit effect, zelfs als hij geen harnas heeft.
actors.hero.spells.holyward.desc_paladin=_Deze spreuk is krachtiger wanneer hij door de Paladijn wordt uitgesproken._ De extra schadeblokkering is verhoogd naar 3, de spreuk overschrijft bestaande symbolen niet langer en wanneer je andere spreuken uitspreekt terwijl heilige bescherming actief is, wordt de duur ervan met 10 beurten per gebruikte lading verlengd.
actors.hero.spells.holyward$holyarmbuff.name=heilige bescherming
actors.hero.spells.holyward$holyarmbuff.desc=De Geestelijke heeft zijn versleten harnas doordrenkt met heilige energie, waardoor tijdelijk alle bestaande symbolen worden overschreven en het harnas 1 extra punt schade blokkeert.\n\nResterende beurten: %s.
actors.hero.spells.holyward$holyarmbuff.desc_paladin=De Paladijn heeft zijn gedragen harnas doordrenkt met heilige energie, waardoor het harnas 3 extra punten schade blokkeert.\n\nAls je andere spreuken uitspreekt terwijl de heilige bescherming actief is, wordt de duur ervan met 10 beurten per bestede lading verlengd.\n\nResterende beurten: %s.

actors.hero.spells.holyweapon.name=heilig wapen
actors.hero.spells.holyweapon.ench_name=heilig %s
actors.hero.spells.holyweapon.ench_desc=Vijanden die door een heilig wapen worden geraakt, lopen extra magische schade op.
actors.hero.spells.holyweapon.short_desc=Heft tijdelijk betoveringen op om schade te verhogen.
actors.hero.spells.holyweapon.desc=De Geestelijke betovert zijn gedragen wapen met heilige energie, waardoor het wapen 2 extra magische schade aanricht wanneer hij er een vijand mee raakt. Deze spreuk kost geen beurt om uit te spreken.\n\nDeze betovering duurt 50 beurten en zal elke gunstige betovering die het wapen heeft, overschrijven gedurende de duur. Onbewapende aanvallen kunnen ook profiteren van dit effect.
actors.hero.spells.holyweapon.desc_paladin=_Deze spreuk is krachtiger wanneer deze door de Paladijn wordt uitgesproken._ De extra magische schade is verhoogd naar 6, de spreuk overschrijft bestaande betoveringen niet langer en wanneer andere spreuken worden uitgesproken terwijl het heilige wapen actief is, wordt de duur ervan met 10 beurten per gebruikte lading verlengd.
actors.hero.spells.holyweapon$holywepbuff.name=heilig wapen
actors.hero.spells.holyweapon$holywepbuff.desc=De Geestelijke heeft zijn wapen dat hij momenteel gebruikt doordrenkt met heilige energie, waardoor tijdelijk alle bestaande betoveringen worden overschreven en het wapen bij elke aanval 2 extra magische schade aanricht.\n\nResterende beurten: %s.
actors.hero.spells.holyweapon$holywepbuff.desc_paladin=De Paladijn heeft zijn wapen dat hij momenteel draagt doordrenkt met heilige energie, waardoor zijn aanvallen 6 extra magische schade aanrichten.\n\nHet uitspreken van andere spreuken terwijl het heilige wapen actief is, verlengt de duur ervan met 10 beurten per verbruikte lading.\n\nResterende beurten: %s.

actors.hero.spells.judgement.name=oordeel
actors.hero.spells.judgement.short_desc=Beschadigd alle zichtbare vijanden.
actors.hero.spells.judgement.desc=De Geestelijke slaat zijn vuist op de grond, wat een lichtuitbarsting veroorzaakt die schade toebrengt aan alle vijanden die hij kan zien. Dit brengt initieel %1$d-%2$d schade toe, maar brengt ook 33%% schade toe voor elke spreuk die de Geestelijke heeft uitgesproken sinds hij de opgestegen vorm is binnengegaan (of sinds hij Oordeel voor het laatst heeft uitgesproken).\n\nOp dit moment zal Oordeel %3$d-%4$d schade toebrengen.

actors.hero.spells.layonhands.name=handoplegging
actors.hero.spells.layonhands.short_desc=Geneest onmiddellijk een aangrenzend personage of beschermt de Paladijn.
actors.hero.spells.layonhands.desc=De Paladijn kanaliseert heilige energie door zijn handen, en geneest of beschermt alles wat hij aanraakt.\n\nDe Paladijn kan deze spreuk op elk aangrenzend personage uitspreken om hem %1$d genezing te geven, of op zichzelf om %1$d bescherming te krijgen. Overtollige genezing van deze spreuk wordt omgezet in bescherming .\n\nDeze spreuk wordt onmiddellijk uitgesproken en kan herhaaldelijk worden uitgesproken, maar kan niet meer dan drie keer bescherming tegelijkertijd geven.

actors.hero.spells.lifelinkspell.name=levenslink
actors.hero.spells.lifelinkspell.short_desc=Deelt de schade met een bondgenoot en vermindert de opgelopen schade.
actors.hero.spells.lifelinkspell.desc=De Geestelijke versterkt de link tussen zichzelf en zijn versterkte bondgenoot. Met deze versterkte link wordt alle schade die wordt opgelopen gedeeld tussen zowel de held als zijn bondgenoot voor %1$dbeurten, en de defensieve boost van Kracht van Velen wordt verhoogd naar -%2$d%% schade die wordt opgelopen. Let op dat de schade wordt gedeeld na harnas, maar vóór de schadevermindering van Kracht van Velen.\n\nTerwijl dit effect actief is, worden gunstige Geestelijke spreuken van niveau 3 of lager toegepast op zowel de Geestelijke als zijn bondgenoot als ze alleen op een van hen zouden zijn toegepast.
actors.hero.spells.lifelinkspell$lifelinkspellbuff.name=levensverbinding bescherming
actors.hero.spells.lifelinkspell$lifelinkspellbuff.desc=De Geestelijke heeft onlangs Levenslink op deze bondgenoot uitgesproken.\n\nNaast de reguliere voordelen van Levenslink loopt dit personage ook minder schade op, worden alle positieve Geestelijke spreuken toegepast op zowel de Geestelijke als deze bondgenoot in plaats van slechts één, en Kracht van Velen vervalt niet zolang deze verbetering actief is.\n\nResterende beurten: %s.

actors.hero.spells.mindform.name=verstandsvorm
actors.hero.spells.mindform.short_desc=Wijst Drie-eenheid toe aan een toverstok of werpwapen.
actors.hero.spells.mindform.desc=De Geestelijke kiest een toverstaf of werpwapens die hij deze verkenning heeft geïdentificeerd en geeft Drie-eenheid het effect ervan.\n\nWanneer Drie-eenheid wordt gebruikt, kan de Geestelijke een enkele aanval uitvoeren alsof hij het gekozen item op +%d gebruikt. Dit zal alle effecten activeren die het gebruik van dat type item normaal gesproken zou activeren.\n\nDeze spreuk vervangt elk ander geesteseffect waar Drie-eenheid momenteel mee doordrenkt is.

actors.hero.spells.mnemonicprayer.name=mnemonisch gebed
actors.hero.spells.mnemonicprayer.short_desc=Verlengt versterkingen/verzwakkingen op een bondgenoot/vijand en past opnieuw verlichting toe.
actors.hero.spells.mnemonicprayer.desc=De Priester spreekt een gebed uit dat de duur van alle verbeteringen of verzwakkingen op een specifiek doelwit met %1$d beurten verlengt. Het uitspreken van deze spreuk kost geen tijd. Positieve effecten duren langer op bondgenoten (inclusief de Priester zelf), en schadelijke effecten duren langer op vijanden. \n\nMnemonisch gebed kan slechts één keer een specifieke instantie van een verbetering of verzwakking verlengen, en kan geen verbetering verlengen die zijn verleend door pantservaardigheden.

actors.hero.spells.radiance.name=uitstraling
actors.hero.spells.radiance.short_desc=Verlicht en beschadigd kort alle zichtbare vijanden.
actors.hero.spells.radiance.desc=De Priester barst los in heilig licht, verdooft alle zichtbare vijanden gedurende 3 beurten. Als een vijand al verlicht is, zal Uitstraling de bonusschade van verlichting activeren en de verlichte verzwakking opnieuw toepassen. Uitstraling zorgt er ook voor dat de Priester 100 beurten lang gloeit als de huidige verdieping donker is.

actors.hero.spells.recallinscription.name=inscriptie herinneren
actors.hero.spells.recallinscription.short_desc=Herhaalt een onlangs gebruikte runensteen of rol.
actors.hero.spells.recallinscription.desc=De Geestelijke gebruikt heilige magie om het effect van een magische rune, gevonden op een runensteen of rol die ze in de %s laatste beurten hebben gebruikt, opnieuw uit te voeren.\n\nInscriptie Herinneren kan niet worden gebruikt om rollen van opwaardering te repliceren. De kosten voor deze spreuk variëren afhankelijk van welk item recentelijk is gebruikt: 2 voor een runensteen, 3 voor een rol, 4 voor een exotische rol. Deze kosten wordt verdubbeld bij het lezen van een rol van transmutatie, of alchemie-items gebruikt die met transmutatie of opwaardering rollen moeten worden vervaardigd.
actors.hero.spells.recallinscription$useditemtracker.name=onlangs gebruikte rune
actors.hero.spells.recallinscription$useditemtracker.desc=De Geestelijke heeft onlangs een voorwerp gebruikt dat werkt met de ingeschreven herinneringsspreuk. De Geestelijke kan de spreuk uitspreken om het effect van het item te herhalen.\n\nGebruikt artikel: %1$s\n\nResterende beurten: %2$s.

actors.hero.spells.shieldoflight.name=schild van licht
actors.hero.spells.shieldoflight.short_desc=Geeft tijdelijke bepantsering tegen een doelwit.
actors.hero.spells.shieldoflight.desc=De Geestelijke creëert een dunne barrière van licht tussen zichzelf en een vijand, waardoor de blokkeringskracht van zijn harnas tegen die vijand met %1$d-%2$d wordt verhoogd gedurende 5 beurten.\n\nDeze spreuk kost geen tijd om uit te spreken, maar kan niet tegen meerdere doelen tegelijk worden gebruikt.
actors.hero.spells.shieldoflight$shieldoflighttracker.name=schild van licht
actors.hero.spells.shieldoflight$shieldoflighttracker.desc=Een dun schild van licht staat tussen dit personage en een vijand. Het is niet sterk genoeg om aanvallen volledig te blokkeren, maar het zal ze verzachten.\n\nResterende beurten: %s

actors.hero.spells.spiritform.name=geestvorm
actors.hero.spells.spiritform.short_desc=Wijst Drie-eenheid toe aan een ring of artefact.
actors.hero.spells.spiritform.desc=De Geestelijke kiest een ring of artefact die hij of zij deze verkenning heeft geïdentificeerd (behalve het heilige boek) en doordrenkt Drie-eenheid met het effect ervan.\n\nAls een ring wordt gekozen, verleent Drie-eenheidhet effect van die ring op +%1$d voor 20 beurten.\n\nAls een artefact wordt gekozen, repliceert Drie-eenheid het effect van dat artefact op +%2$d. Elk artefact heeft verschillende specifieke gedragingen en pantserkosten wanneer het wordt gebruikt met Drie-eenheid.\n\nDeze spreuk vervangt elk ander spiritueel effect waarmee Drie-eenheid op dat moment is doordrenkt.
actors.hero.spells.spiritform$spiritformbuff.name=geestvorm
actors.hero.spells.spiritform$spiritformbuff.desc=Drie-eenheids geestvorm geeft je momenteel de kracht van een item, alsof je het uitgerust hebt.\n\nLet op dat de geestvorm geen andere kopie kan leveren van een effect waar je al van profiteert.\n\nHuidig effect: %1$s.\n\nResterende beurten: %2$s.

actors.hero.spells.smite.name=neerslaan
actors.hero.spells.smite.short_desc=Garandeert een treffer met bonusschade en betoveringskracht.
actors.hero.spells.smite.desc=De Paladijn geeft een slagaanval een rechtvaardige vernietigende kracht.\n\nNaast het toebrengen van normale slagschade, voert Neerslaan niet-belaste aanvallen uit die gegarandeerd raken, heeft +300%% betoveringskracht en deelt %1$d-%2$d bonus magische schade uit.\n\nDe bonus magische schade van Neerslaan is afhankelijk van het niveau van de Paladijn en deelt altijd maximale bonus magische schade uit tegen ondode of demonische vijanden.

actors.hero.spells.stasis.name=stasis
actors.hero.spells.stasis.short_desc=Verwijdert een bondgenoot uit de kerker en bewaart deze.
actors.hero.spells.stasis.desc=De Geestelijke richt zijn verbinding met zijn bondgenoot op zichzelf, waardoor de bondgenoot tijdelijk in een soort energiestasis binnen de Geestelijke wordt gehouden. De bondgenoot blijft maximaal %d beurten bewaard, waarbij alle positieve effecten op hem niet worden beïnvloed door zijn tijd in stasis.\n\nDe bondgenoot verschijnt naast de Geestelijke wanneer stasis op natuurlijke wijze eindigt of hij kan de spreuk onmiddellijk opnieuw uitspreken zonder kosten, om het effect vroegtijdig te beëindigen. Stasis kan zelfs onbeweeglijke bondgenoten verplaatsen, maar kan ze niet tussen verdiepingen verplaatsen.
actors.hero.spells.stasis$stasisbuff.name=bondgenoot in stasis
actors.hero.spells.stasis$stasisbuff.left_behind=Je onbeweeglijke bondgenoot blijft achter.
actors.hero.spells.stasis$stasisbuff.desc=De Geestelijke heeft momenteel een bondgenoot opgeslagen in stasis. Alle positieve effecten op deze bondgenoot blijven bewaard, inclusief Kracht van Velen, en ze verschijnen weer naast de Geestelijke wanneer het effect eindigt. Het effect kan ook vroegtijdig worden beëindigd door Stasis opnieuw uit te spreken.\n\nBondgenoot in stasis: %1$s.\nResterende beurten: %2$s.

actors.hero.spells.sunray.name=zonnestraal
actors.hero.spells.sunray.short_desc=Brengt magische schade toe op afstand en verblindt een doelwit één keer.
actors.hero.spells.sunray.desc=De Geestelijke vuurt een straal verblindend licht af op een doelwit, wat %1$d-%2$d schade toebrengt en ze %3$d beurten lang verblindt. Zonnestraal brengt altijd maximale schade toe aan ondode en demonische doelen.\n\nNadat een vijand met deze spreuk is geraakt, zal zijn zicht worden aangepast, waardoor hij niet opnieuw verblind kan worden. Als hij echter opnieuw wordt geraakt terwijl hij verblind is door deze spreuk, is het licht overweldigend en verlamt het hem in plaats daarvan.

actors.hero.spells.walloflight.name=muur van licht
actors.hero.spells.walloflight.short_desc=Creëert een muur die vijanden blokkeert.
actors.hero.spells.walloflight.desc=De Paladijn creëert een muur van panelen van massief licht recht voor zichzelf, die 1 tegel dik is, %1$d tegels breed, en 20 beurten meegaat.\n\nDeze muur gedraagt zich net als een normale muur, behalve dat je er doorheen kunt kijken. Vijanden die in de muur vastzitten wanneer deze wordt gecreëerd, worden even verdoofd en indien mogelijk teruggeduwd. Alles wat in de muur vastzit, kan eruit bewegen.\n\nDe muur kan in een van de vier hoofdrichtingen of vier diagonale richtingen worden uitgesproken. Als een muur al actief is, kan de spreuk gratis opnieuw worden gebruikt om de muur direct te wissen.
actors.hero.spells.walloflight.early_end=Je verdrijft de muur van licht.
actors.hero.spells.walloflight$lightwall.desc=Glinsterende lichtpanelen blokkeren hier de doorgang.

##main hero
actors.hero.hero.name=jij
actors.hero.hero.leave=Je kan nog niet weggaan, de rest van de kerker wacht op je beneden!
actors.hero.hero.level_up=Niveau omhoog!
actors.hero.hero.new_level=Niveau omhoog! +Nauwkeurigheid, +Ontwijking, +5 Gezondheid!
actors.hero.hero.new_talent=+1 Talentpunt!
actors.hero.hero.unspent=Je hebt niet-uitgegeven talentpunten!
actors.hero.hero.level_cap=Je kan niet sterker worden, maar je ervaringen geven je wel een golf van kracht!
actors.hero.hero.you_now_have=je pakte: %s.
actors.hero.hero.you_cant_have=je kan niet dragen: %s.
actors.hero.hero.locked_chest=Deze kist zit op slot en je hebt geen passende sleutel.
actors.hero.hero.locked_door=Je hebt geen passende sleutel.
actors.hero.hero.noticed_smth=Je merkte iets op.
actors.hero.hero.wait=...
actors.hero.hero.search=zoeken
actors.hero.hero.search_distracted=Je kunt je lastig concentreren, zoeken is vermoeiend.
actors.hero.hero.key_distracted=Je krijgt het slot niet open, je zult het moeten blijven proberen.
actors.hero.hero.pain_resist=De pijn helpt je de drang om te slapen te weerstaan.
actors.hero.hero.revive=De ankh explodeert met leven-gevende energie!

##classes
actors.hero.heroclass.warrior=krijger
actors.hero.heroclass.warrior_desc_short=De Krijger kan extra schade verdragen met bescherming die wordt verleend door zijn _gebroken zegel._ Het zegel kan tussen harnassen worden verplaatst en _draagt een enkele opwaardering over._
actors.hero.heroclass.warrior_desc=De Krijger begint met een _uniek gebroken zegel_ dat hem een schild geeft wanneer zijn gezondheid minder dan de helft is. Het zegel kan tussen harnassen worden verplaatst en er kan een _enkele opwaardering_ mee overdragen worden.\n\nDe krijger begint ook met een _versleten kortzwaard_, _drie werpstenen_, kleren gemaakt van stof, een waterzak en een fluwelen buidel.\n\nDe Krijger herkent automatisch:\n_-_ Rol van Identificatie\n_-_ Toverdrank van Genezing\n_-_ Rol van Woede
actors.hero.heroclass.warrior_unlock=De Krijger is automatisch ontgrendeld.

actors.hero.heroclass.mage=magiër
actors.hero.heroclass.mage_desc_short=De Magiër is een geheimzinnige expert en draagt een _magische staf_ die sterker is dan een toverstok. De staf kan worden _verrijkt met elke toverstok_ die de Magiër vindt.
actors.hero.heroclass.mage_desc=De Magiër begint met een _unieke staf_, die aanzienlijk sneller oplaadt dan een toverstok en 1 extra lading heeft. De staf kan worden verrijkt met elke toverstok die de magiër in de kerker vindt.\n\nDe Magiër begint ook met een toverstok van magisch projectiel waarmee zijn staf is verrijkt, kleren gemaakt van stof, een waterzak en een fluwelen buidel.\n\nDe Magiër identificeert automatisch:\n_-_ Rol van Identificatie\n_-_ Toverdrank van Vloeibare Vlam\n_-_ Rol van Opwaardering
actors.hero.heroclass.mage_unlock=Om de Magiër te ontgrendelen _gebruik je een rol van opwaardering om een voorwerp sterker te maken._

actors.hero.heroclass.rogue=schurk
actors.hero.heroclass.rogue_desc_short=De Schurk kan vijanden ontwijken en vanuit onzichtbaarheid aanvallen met zijn _Schaduwmantel._ Hij _detecteert ook geheimen en vallen_ vanaf een grotere afstand.
actors.hero.heroclass.rogue_desc=De Schurk begint met een _unieke Schaduwmantel_, die hij kan gebruiken om naar believen onzichtbaar te worden.\n\nDe Schurk kan vanaf een grotere afstand _geheimen en vallen detecteren_.\n\nDe Schurk begint ook met _een dolk_, _drie werpmessen_, kleren gemaakt van stof, een waterzak en een fluwelen buidel.\n\nDe Schurk identificeert automatisch:\n_-_ Rol van Identificatie\n_-_ Toverdrank van Onzichtbaarheid\n_-_ Rol van Magische Kaartkennis
actors.hero.heroclass.rogue_unlock=Om de Schurk te ontgrendelen _voer je 10 verrassingsaanvallen uit in één spel._

actors.hero.heroclass.huntress=jaagster
actors.hero.heroclass.huntress_desc_short=De Jaagster is een meester in het gooien van wapens en heeft een _magische boog_ met oneindig veel pijlen. Ze loopt ook door hoog gras _zonder het te vertrappen._
actors.hero.heroclass.huntress_desc=De Jaagster begint met een _unieke geestboog_ die een oneindig aantal toverpijlen kan afvuren.\n\nDe Jaagster kan door hoog gras lopen _zonder het te vertrappen_.\n\nDe Jaagster begint ook met _gevoerde handschoenen_, kleren van stof, een waterzak en een fluwelen buidel.\n\nDe Jaagster identificeert automatisch:\n_-_ Rol van Identificatie\n_-_ Toverdrank van Geestvisie\n_-_ Rol van Slaaplied
actors.hero.heroclass.huntress_unlock=Om de Jaagster te ontgrendelen _raak je vijanden 10 keer met werpwapens in één spel._

actors.hero.heroclass.duelist=duellist
actors.hero.heroclass.duelist_desc_short=De Duellist is een wapenmeester die haar wapen kan gebruiken om een _speciale wapenvaardigheid_ te activeren. Deze speciale vaardigheid is _voor elk wapen verschillend._
actors.hero.heroclass.duelist_desc=De Duellist begint met een _unieke degen_ met een speciale vaardigheid die na verloop van tijd oplaadt.\n\nElk wapen in het spel heeft een _verschillende speciale vaardigheid_ die de Duellist kan gebruiken.\n\nDe Duellist begint ook met _twee werpspijkers_, kleren van stof, een waterzak en een fluwelen buidel.\n\nDe Duellist identificeert automatisch:\n_-_ Rol van Identificatie\n_-_ Toverdrank van Kracht\n_-_ Rol van Spiegelbeeld
actors.hero.heroclass.duelist_unlock=Om de Duellist te ontgrendelen, _rust je een klasse 2 of hoger wapen uit die geschikt is voor je krachtniveau._

actors.hero.heroclass.cleric=geestelijke
actors.hero.heroclass.cleric_desc_short=De Geestelijke is een goddelijke tovenaar die zijn unieke _heilige boek_ gebruikt om goddelijke magie te kanaliseren. Ze kunnen _spreuken leren en upgraden_ via talenten.
actors.hero.heroclass.cleric_desc=De Geestelijke begint met een _uniek heilig boek_, dat gebruikt kan worden om verschillende spreuken uit te spreken.\n\nDe meeste talenten van de Geestelijke zijn gericht op het leren of opwaarderen van spreuken.\n\nDe Geestelijke begint ook met _een knuppel_, stoffen kleding, een waterzak en een fluwelen buidel.\n\nDe Cleric identificeert automatisch:\n_-_ Rol van Identificatie\n_-_ Toverdrank van zuiverheid\n_-_ Rol van Vloekverwijdering
actors.hero.heroclass.cleric_unlock=Ontgrendel de Geestelijke door de vloek op een willekeurige vervloekte uitrusting volledig te zuiveren

actors.hero.herosubclass.berserker=berserker
actors.hero.herosubclass.berserker_short_desc=De _Berserker_ bouwt woede op terwijl hij schade oploopt. Woede verhoogt zijn aangerichte schade en kan worden geactiveerd bij 100% voor bonus bescherming.
actors.hero.herosubclass.berserker_desc=De Berserker wordt woedend als hij fysieke schade oploopt, inclusief schade die wordt geblokkeerd door zijn harnas! Woede vervaagt gestaag na verloop van tijd, maar vervaagt langzamer als hij een lage gezondheid heeft.\n\nWoede kan ervoor zorgen dat de Berserker tot +50% schade aanricht. Als hij maximaal woedend is, kan hij helemaal woest worden, waarbij hij een schild krijgt en zijn woestheid behoudt zolang er nog schild over is. Het schild is afhankelijk van het niveau van het harnas van de Berserker en kan enorm worden versterkt als hij weinig gezondheid heeft. De Berserker heeft tijd nodig om te herstellen nadat hij woest is geworden.
actors.hero.herosubclass.gladiator=gladiator
actors.hero.herosubclass.gladiator_short_desc=De _Gladiator_ bouwt combo op als hij succesvol aanvalt. Deze combo kan hij inzetten voor unieke aanvalsmogelijkheden.
actors.hero.herosubclass.gladiator_desc=De Gladiator bouwt één combopunt op elke keer dat hij een succesvolle aanval uitvoert met een slag- of geworpen wapen. Indien de Gladiator binnen 5 beurten (15 beurten na een eliminatie) geen succesvolle aanval uitvoert, wordt zijn combo gereset.\n\nTerwijl een combo wordt opgebouwd, ontgrendelt het verschillende vaardigheden, welke gegarandeerd raken:\n2 Combo: sla de vijand terug, de combo blijft behouden\n4 Combo: richt schade aan op basis van bepantsering\n6 Combo: pareren, de combo blijft behouden\n8 Combo: schade aan doelwit en vijanden in de buurt\n10 Combo: val één keer aan voor elke combo
actors.hero.herosubclass.battlemage=strijdmagiër
actors.hero.herosubclass.battlemage_short_desc=De _Strijdmagiër_ krijgt bonuseffecten wanneer hij slaat met zijn staf. Deze effecten zijn afhankelijk van de toverstok waarmee zijn staf is verrijkt.
actors.hero.herosubclass.battlemage_desc=De _Strijdmagiër_ krijgt een bonuseffect wanneer hij slagen uitdeelt met zijn staf, alsof zijn staf een extra betovering heeft. Deze effecten zijn afhankelijk van de toverstok waarmee zijn staf is verrijkt, elke toverstaf heeft zijn eigen effect. Naast de toverstafeffecten laadt de staf van de Strijdmagiër ook 0,5 schoten op als hij ermee slaat.
actors.hero.herosubclass.warlock=duivelskunstenaar
actors.hero.herosubclass.warlock_short_desc=De _Duivelskunstenaar_ heeft een kans om personages te zielmarkeren als hij een toverstok op ze gebruikt. Hij geneest wanneer hij fysieke schade toebrengt aan zielgemarkeerde vijanden.
actors.hero.herosubclass.warlock_desc=De Duivelskunstenaar heeft een kans om een zielsmarkering op personages toe te passen wanneer hij toverstokken op hen gebruikt. De kans om een zielmarkering toe te passen en de duur ervan nemen toe met het niveau van de toverstok.\n\nWanneer een vijand is zielgemarkeerd, geneest de Duivelskunstenaar 2 gezondheid voor elke 5 schade die hij aan hen toebrengt, maar alleen met slagaanvallen of met werpwapens, niet van toverstokken!
actors.hero.herosubclass.assassin=sluipmoordenaar
actors.hero.herosubclass.assassin_short_desc=De _Sluipmoordenaar_ kan een dodelijke aanval voorbereiden terwijl hij onzichtbaar is. Hoe langer hij wacht, hoe krachtiger de aanval is.
actors.hero.herosubclass.assassin_desc=De Sluipmoordenaar bereidt zijn volgende aanval voor wanneer hij onzichtbaar wordt. Hoe langer hij zich voorbereidt, hoe krachtiger zijn volgende aanval is. Voorbereiding bouwt op tot 9 beurten.\n\nNa zijn voorbereiding brengt de Moordenaar bonusschade toe bij zijn volgende aanval, kan hij naar zijn doelwit toesnellen en kan hij zelfs vijanden die zwak genoeg zijn onmiddellijk doden.
actors.hero.herosubclass.freerunner=freerunner
actors.hero.herosubclass.freerunner_short_desc=De _Freerunner_ bouwt momentum op terwijl hij rent, dat kan worden gebruikt om te beginnen met freerunnen. Dit geeft hem voor een korte tijd bonussnelheid en -ontwijking.
actors.hero.herosubclass.freerunner_desc=Terwijl de Freerunner beweegt, bouwt hij momentum op. Hij kan tot 10 momentum krijgen na 10 beurten te hebben gelopen, maar verliest het snel als hij stopt met bewegen. De freerunner kan zijn momentum gebruiken door te beginnen met freerunnen, voor 2 beurten per momentum.\n\nBij het freerunnen beweegt de Freerunner met 2x snelheid en krijgt hij bonusontwijking in verhouding tot zijn niveau. Zodra hij stopt met  freerunnen, is er een afkoelperiode voordat het momentum weer kan worden opgebouwd.
actors.hero.herosubclass.sniper=sluipschutter
actors.hero.herosubclass.sniper_short_desc=De _Sluipschutter_ kan harnassen doorboren met haar afstandsaanvallen. Na het raken met een werpwapen kan ze met een speciale aanval van haar boog volgen.
actors.hero.herosubclass.sniper_desc=De Sluipschutter is een meester in afstandsgevechten, wiens afstandsaanvallen harnassen van vijanden doorboren. Wanneer ze een vijand aanvalt met een werpwapen, plaatst ze een sluipschutterteken op hen, waarna ze een speciale aanval van haar boog kan uitvoeren. Deze speciale aanval varieert op basis van hoe haar boog is verbeterd.\n\nEen niet-verbeterde boog vuurt een snelschot af die minder schade aanricht maar onmiddellijk vuurt. Een snelheidsboog vuurt een salvo van drie pijlen af die minder schade aanrichten, nog steeds betoveringen kunnen activeren en 1 beurt nodig hebben om te vuren. Een schadeboog vuurt een sluipschutterschot af dat gegarandeerd raak is, bonusschade toebrengt op basis van afstand en 2 beurten nodig heeft om te vuren.
actors.hero.herosubclass.warden=bewaakster
actors.hero.herosubclass.warden_short_desc=De _Bewaakster_ kan door hoog gras kijken en krijgt bonuseffecten als ze zaden plant en planten vertrapt.
actors.hero.herosubclass.warden_desc=De Bewaakster heeft een sterke band met de natuur, wat haar een verscheidenheid aan bonuseffecten geeft met betrekking tot gras en planten. Ze kan door hoog of vertrapt gras kijken alsof het er niet is.\n\nDe Bewaakster zorgt ervoor dat gras opkomt rond elk zaad dat ze gooit of plant, en ze krijgt speciale effecten wanneer ze planten vertrapt. Deze speciale effecten vervangen de reguliere planteffecten, wat betekent dat geen enkele plant schadelijk is voor haar om op te stappen.
actors.hero.herosubclass.champion=kampioen
actors.hero.herosubclass.champion_short_desc=De _Kampioen_ kan twee wapens gebruiken en krijgt meer wapenladingen. Haar reguliere aanvallen gebruiken haar primaire wapen, maar ze kan wapens wisselen en de vaardigheid van beide wapens gebruiken.
actors.hero.herosubclass.champion_desc=De kampioen is een meester in contactwapens die naast haar primaire wapen een secundair wapen kan uitrusten. Bij haar reguliere aanvallen wordt haar primaire wapen gebruikt, maar ze kan haar primaire wapen onmiddellijk verwisselen en de vaardigheid van beide wapens gebruiken.\n\nZe krijgt ook nog 2 maximale wapenvaardigheidsladingen en +50% oplaadsnelheid van de wapenvaardigheid.
actors.hero.herosubclass.monk=monnik
actors.hero.herosubclass.monk_short_desc=De _Monnik_ bouwt energie op tijdens het vechten. Deze energie kan worden besteed aan verschillende unieke vaardigheden.
actors.hero.herosubclass.monk_desc=De Monnik is een meester in fysieke techniek. Terwijl ze vijanden verslaat, krijgt ze energie die kan worden gebruikt voor een verscheidenheid aan defensieve en nuttige vaardigheden. Deze energie vervaagt niet in de loop van de tijd, maar heeft een limiet gebaseerd op het niveau van de Monnik.\n\n1 Energie: snel slaan met vuisten\n2 Energie: focus om de volgende aanval te ontwijken\n3 Energie: spring onmiddellijk weg\n4 Energie: schop een vijand weg\n5 Energie: mediteer om statussen te wissen en de lading van toverstaf en artefact te herstellen
actors.hero.herosubclass.priest=priester
actors.hero.herosubclass.priest_short_desc=De _Priester_ krijgt nieuwe langeafstandsspreuken en een krachtigere versie van leidend licht.
actors.hero.herosubclass.priest_desc=De Priester krijgt een verscheidenheid aan nieuwe en verbeterde spreuken die de nadruk leggen op gevechten op afstand en synergie met magische items.\n\nDe Priester kan één keer per 50 beurten gratis _Leidend Licht_ uitspreken en kan het verlichtingseffect gebruiken met bondgenoten, toverstokken en enkele artefacten voor bonusschade die gelijk is aan hun niveau + 5. \n\nDe Priester verkrijgt ook de _Uitstraling_ spreuk, die de duisternis verdrijft en alle zichtbare vijanden beïnvloed, verlicht en kortstondig verdooft, ten koste van 2 ladingen.
actors.hero.herosubclass.paladin=paladijn
actors.hero.herosubclass.paladin_short_desc=De _Paladijn_ krijgt nieuwe korteafstandsspreuken en krachtigere versies van heilig wapen en bescherming.
actors.hero.herosubclass.paladin_desc=De Paladijn krijgt een verscheidenheid aan nieuwe en verbeterde spreuken die de nadruk leggen op slagaanvallen en synergie met wapens en bepantsering.\n\nDe _Heilig Wapen_ en _Heilige Bescherming_ spreuken van de Paladijn geven grotere bonussen, overschrijven niet langer al bestaande betoveringen en symbolen, en kunnen worden uitgebreid door andere spreuken uit te spreken.\n\nDe Paladijn krijgt ook de _Neerslaan_-spreuk, waarmee hij gegarandeerd een slagaanval kan uitvoeren met bonusschade en betoveringskracht.

##talents
actors.hero.talent$provokedangertracker.name=uitgelokte woede
actors.hero.talent$provokedangertracker.desc=De Krijger heeft onlangs zijn bescherming verloren, zijn volgende fysieke aanval zal bonusschade aanrichten.\n\nResterende beurten: %s.
actors.hero.talent$lingeringmagictracker.name=aanhoudende magie
actors.hero.talent$lingeringmagictracker.desc=De Magiër heeft onlangs een staf of toverstok gebruikt. Zijn volgende fysieke aanval zal bonusschade aanrichten.\n\nResterende beurten: %s.
actors.hero.talent$followupstriketracker.name=opvolgende treffer
actors.hero.talent$followupstriketracker.desc=De Jaagster heeft onlangs een vijand aangevallen met een gegooid wapen. Haar volgende slagaanval tegen hetzelfde doelwit zal meer schade aanrichten.\n\nResterende beurten: %s.
actors.hero.talent$patientstriketracker.name=geduldige slag
actors.hero.talent$patientstriketracker.desc=De Duellist heeft zojuist een beurt gewacht, haar volgende slag aanval zal bonusschade aanrichten.
actors.hero.talent$improvisedprojectilecooldown.name=geïmproviseerde projectielen afkoelperiode
actors.hero.talent$improvisedprojectilecooldown.desc=Je hebt dit talent onlangs gebruikt en moet wachten voordat je het opnieuw gebruikt. \n\nResterende beurten: %s.
actors.hero.talent$rejuvenatingstepscooldown.name=verjongende stappen afkoelperiode
actors.hero.talent$rejuvenatingstepscooldown.desc=Je hebt dit talent onlangs gebruikt en moet wachten voordat je het opnieuw gebruikt. \n\nResterende beurten: %s.
actors.hero.talent$seershotcooldown.name=ziener schot afkoelperiode
actors.hero.talent$seershotcooldown.desc=Je hebt dit talent onlangs gebruikt en moet wachten voordat je het opnieuw gebruikt. \n\nResterende beurten: %s.
actors.hero.talent$aggressivebarriercooldown.name=agressieve barrière afkoelperiode
actors.hero.talent$aggressivebarriercooldown.desc=Je hebt dit talent onlangs gebruikt en moet wachten voordat je het opnieuw gebruikt. \n\nResterende beurten: %s.
actors.hero.talent$liquidagilacctracker.name=vloeibare behendigheid
actors.hero.talent$liquidagilacctracker.desc=De volgende reguliere slagaanval van de Duellist zal bonusnauwkeurigheid opleveren.\n\nResterende beurten: %s.
actors.hero.talent$lethalhastecooldown.name=dodelijke snelheid afkoelperiode
actors.hero.talent$lethalhastecooldown.desc=Je hebt dit talent onlangs gebruikt en moet wachten voordat je het opnieuw gebruikt. \n\nResterende beurten: %s.
actors.hero.talent$swiftequipcooldown.name=snelle uitrusting afkoelperiode
actors.hero.talent$swiftequipcooldown.desc=Je hebt dit talent onlangs gebruikt en moet wachten voordat je het opnieuw gebruikt. \n\nResterende beurten: %s.
actors.hero.talent$preciseassaulttracker.name=nauwkeurige aanval
actors.hero.talent$preciseassaulttracker.desc=De volgende reguliere slagaanval van de Duellist zal bonusnauwkeurigheid opleveren.\n\nResterende beurten: %s.
actors.hero.talent$deadlyfollowuptracker.name=dodelijke opvolging
actors.hero.talent$deadlyfollowuptracker.desc=De  Duellist heeft onlangs een vijand aangevallen met een gegooid wapen. Haar volgende slagaanval tegen hetzelfde doelwit zal meer schade aanrichten.\n\nResterende beurten: %s
actors.hero.talent$combinedlethalityabilitytracker.executed=geëxecuteerd
actors.hero.talent$satiatedspellstracker.name=Afschermende spreuk
actors.hero.talent$satiatedspellstracker.desc=De volgende spreuk die de Geestelijke uitspreekt, zal hem een kleine hoeveelheid bescherming geven.
actors.hero.talent$searinglightcooldown.name=Schroeiend Licht
actors.hero.talent$searinglightcooldown.desc=Je hebt dit talent onlangs gebruikt en moet wachten voordat je het opnieuw gebruikt. \n\nResterende beurten: %s.

#warrior
actors.hero.talent.hearty_meal.title=hartige maaltijd
actors.hero.talent.hearty_meal.desc=_+1:_ Het eten van voedsel geneest de Krijger voor _4 gezondheid_ wanneer hij een gezondheid van 33% of minder heeft.\n\n_+2:_ Het eten van voedsel geneest de Krijger voor _6 gezondheid_ wanneer hij een gezondheid van 33% of minder heeft.
actors.hero.talent.veterans_intuition.title=intuïtie van de kenner
actors.hero.talent.veterans_intuition.desc=_+1:_ De Krijger identificeert wapens _1,75x sneller_ en harnassen _2,5x sneller_.\n\n_+2:_ De Krijger identificeert wapens _2,5x sneller_ en harnassen _wanneer hij deze uitrust_.
actors.hero.talent.provoked_anger.title=uitgelokte woede
actors.hero.talent.provoked_anger.desc=_+1:_ Wanneer een beschermingsverbetering toegepast op de Krijger door schade breekt, zal zijn volgende fysieke aanval _3 bonusschade_ aanrichten.\n\n_+2:_ Wanneer een beschermingsverbetering toegepast op de Krijger door schade breekt, zal zijn volgende fysieke aanval _5 bonusschade_ aanrichten.
actors.hero.talent.iron_will.title=ijzeren wil
actors.hero.talent.iron_will.desc=_+1:_ Het schild van het zegel van de Krijger _vermeerdert met 1_.\n\n_+2:_ Het schild van het zegel van de Krijger _vermeerdert met 2_.
actors.hero.talent.iron_will.meta_desc=_Als dit talent door een andere held wordt verkregen_ zal het passief een schildversie van maximaal 1 of 2 van het gebroken zegel-effect van de Krijger verlenen.

actors.hero.talent.iron_stomach.title=ijzeren maag
actors.hero.talent.iron_stomach.desc=_+1:_ Voedsel eten duurt 1 beurt en geeft de Krijger _75% schadeweerstand_ tijdens het eten.\n\n_+2:_ Voedsel eten duurt 1 beurt en geeft de Krijger _100% schadeweerstand_ tijdens het eten.
actors.hero.talent.liquid_willpower.title=vloeibare wilskracht
actors.hero.talent.liquid_willpower.desc=_+1:_ De Krijger krijgt  _6,5% van zijn maximale gezondheid als bescherming_ terug bij het drinken of gooien van een drankje, brouwsel of elixer..\n\n_+2:_ De Krijger krijgt _10% van zijn maximale gezondheid als bescherming_ terug bij het drinken of gooien van een drankje, brouwsel of elixer.\n\nHet hoeveelheid schild wordt verdubbeld bij het gebruik van drankjes van kracht, ervaring, meesterschap of goddelijke inspiratie.\n\nVoor alchemie-items met hogere outputhoeveelheden (bijvoorbeeld aqua brew) heeft dit talent een kans om te activeren op basis van hoeveel van dat item er wordt geproduceerd.
actors.hero.talent.runic_transference.title=runische overdracht
actors.hero.talent.runic_transference.desc=_+1:_ Het gebroken zegel van de Krijger kan _reguliere symbolen_ overbrengen op dezelfde manier als opwaarderingen.\n\n_2+:_ Het gebroken zegel van de Krijger kan _reguliere, krachtige, en vervloekende symbolen_ overbrengen op dezelfde manier als opwaarderingen.\n\nHet zegel kan alleen symbolen overbrengen als deze op het harnas werden aangebracht nadat het zegel bevestigd was.
actors.hero.talent.runic_transference.meta_desc=_Als dit talent door een andere held wordt verworven_ zal het in plaats daarvan helpen om harnassymbolen te helpen voorkomen dat ze worden verwijderd door rollen van opwaardering. Harnassymbolen gaan verloren bij het opwaarderen van 4 naar 6 (bij +1), of van 4 naar 7 (bij +2). Het niveau waarop harnassymbolen gegarandeerd verloren gaan, is ongewijzigd op +8.
actors.hero.talent.lethal_momentum.title=dodelijke momentum
actors.hero.talent.lethal_momentum.desc=_+1:_ Wanneer de Krijger een dodelijke slag uitdeelt op een vijand met een fysiek wapen, heeft hij een kans van _67%_ om 0 beurten te gebruiken.\n\n_+2:_ Wanneer de Krijger een dodelijke slag uitdeelt op een vijand met een fysiek wapen, heeft hij een kans van _100%_ om 0 beurten te gebruiken.
actors.hero.talent.improvised_projectiles.title=geïmproviseerde projectielen
actors.hero.talent.improvised_projectiles.desc=_+1:_ De Krijger kan een vijand gedurende _2 beurten_ verblinden door ieder voorwerp dat geen werpwapen is naar hem te gooien. Dit heeft een afkoelperiode van 50 beurten.\n\n_+2:_ De Krijger kan een vijand gedurende _3 beurten_ verblinden door ieder voorwerp dat geen werpwapen is naar hem te gooien. Dit heeft een afkoelperiode van 50 beurten.

actors.hero.talent.hold_fast.title=sta stil
actors.hero.talent.hold_fast.desc=_+1:_ Als de Krijger wacht, krijgt hij _1-2 pantser_ en vertraagt hij het verval van combo- en schildbuffs met _50%_ totdat hij beweegt.\n\n_+2:_ Als de Krijger wacht, krijgt hij _2-4 pantser_ en vertraagt hij het verval van combo- en schildbuffs met _75%_ totdat hij beweegt.\n\n_+3:_ Als de Krijger wacht, krijgt hij _3-6 pantser_ en vertraagt hij het verval van combo- en schildbuffs met _100%_ totdat hij beweegt.
actors.hero.talent.strongman.title=sterke man
actors.hero.talent.strongman.desc=_+1:_ De kracht van de Krijger _verhoogt met 8%_, naar beneden afgerond.\n\n_+2:_ De kracht van de Krijger _verhoogt met 13%_, naar beneden afgerond.\n\n_+3:_ De kracht van de Krijger _verhoogt met 18%_, naar beneden afgerond.

actors.hero.talent.endless_rage.title=ongetemde woede
actors.hero.talent.endless_rage.desc=_+1:_ De Berserker kan maximaal _116% woede_ bereiken.\n\n_+2:_ De Berserker kan maximaal _133% woede_ bereiken.\n\n_+3:_ De Berserker kan maximaal _150% woede_ bereiken.\n\nIeder procentpunt woede boven 100% verhoogt de berserk bescherming met 1% en vermindert de afkoelperiode met 1%, maar verhoogt de schadebonus niet boven de 50%.
actors.hero.talent.deathless_fury.title=onsterfelijke woede
actors.hero.talent.deathless_fury.desc=_+1:_ Berserken wordt automatisch geactiveerd als de Berserker op het punt staat te sterven en woede 100% of hoger is, maar het heeft een afkoelperiode van _3 heldenniveaus_ wanneer dit gebeurt.\n\n_+2:_ Berserken wordt automatisch geactiveerd als de Berserker op het punt staat te sterven en woede 100% of hoger is, maar het heeft een afkoeling van _2 heldenniveaus_ wanneer dit gebeurt.\n\n_+3:_ Berserk wordt automatisch geactiveerd als de Berserker op het punt staat te sterven en woede op of boven 100% is, maar het heeft een afkoelperiode van _1 heldenniveau_ wanneer dit gebeurt.\n\nMerk op dat de Berserker nog steeds sterft als hij 0 gezondheid heeft wanneer het berserken eindigt.
actors.hero.talent.enraged_catalyst.title=woedende katalysator
actors.hero.talent.enraged_catalyst.desc=_+1:_ Betoveringen en vloeken op het wapen van de Berserker worden vaker geactiveerd naarmate hij meer woede heeft, tot een maximum van _15% vaker_ bij 100% woede. \n\n_+2:_ Betoveringen en vloeken op het wapen van de Berserker worden vaker geactiveerd naarmate hij meer woede heeft, tot een maximum van _30% vaker_ bij 100% woede. \n\n_+3:_ Betoveringen en vloeken op het wapen van de Berserker worden vaker geactiveerd naarmate hij meer woede heeft, tot een maximum van _45% vaker_ bij 100% woede.

actors.hero.talent.cleave.title=klieven
actors.hero.talent.cleave.desc=_+1:_ De extra tijd die de Gladiator krijgt bij een eliminatie is verhoogd van 15 naar _30 beurten_.\n\n_+2:_ De extra tijd die de Gladiator krijgt bij een eliminatie is verhoogd van 15 naar _45 beurten_.\n\n_+3:_ De extra tijd die de Gladiator krijgt bij een eliminatie is verhoogd van 15 naar _60 beurten_.
actors.hero.talent.lethal_defense.title=dodelijke verdediging
actors.hero.talent.lethal_defense.desc=_+1:_ Wanneer de Gladiator een vijand doodt met een combo-aanval, wordt de afkoeltijd van zijn gebroken zegelschild _verminderd met 50 beurten_.\n\n_+2:_ Wanneer de Gladiator een vijand doodt met een combo-aanval, wordt de afkoeltijd van zijn gebroken zegelschild _verminderd met 100 beurten_.\n\n_+3:_ Wanneer de Gladiator een vijand doodt met een combo-aanval, wordt de afkoeltijd van zijn gebroken zegelschild _verminderd met 150 beurten_.\n\nDe afkoeltijd van het schild kan met dit talent worden verlaagd tot wel -150 beurten, wat betekent dat het direct weer beschikbaar is zodra het wordt geactiveerd.
actors.hero.talent.enhanced_combo.title=verbeterde combo
actors.hero.talent.enhanced_combo.desc=_+1:_ Wanneer de combo van de Gladiator 7 of hoger is, neemt het terugslagbereik van Afranseling toe tot 3, veroorzaakt het duizeligheid en kan het vijanden in de afgrond duwen. \n\n_+2:_ Naast de voordelen van +1, werkt Pareren bij meerdere aanvallen wanneer de combo van de Gladiator 9 of hoger is. \n\n_+3:_ Naast de voordelen van +1 en +2, kan de Gladiator toesnellen naar tegels van het comboniveau gedeeld door 3 ver bij gebruik van Harde Slag, Verplettering of Razenij.

actors.hero.talent.body_slam.title=lichaamsslag
actors.hero.talent.body_slam.desc=_+1:_ Wanneer de Krijger landt na het springen, krijgen alle aangrenzende vijanden _1-4 plus 25%_ van zijn blokkeringskracht aan schade. \n\n_+2:_ Wanneer de Krijger landt na het springen, krijgen alle aangrenzende vijanden _2-8 plus 50%_ van zijn blokkeringskracht aan schade. \n\n_+3:_ Wanneer de Krijger landt na het springen, krijgen alle aangrenzende vijanden _3-12 plus 75%_ van zijn blokkeringskracht aan schade. \n\n_+4:_ Wanneer de Krijger landt na het springen, krijgen alle aangrenzende vijanden _4-16 plus 100%_ van zijn blokkeringskracht aan schade.
actors.hero.talent.impact_wave.title=impactgolf
actors.hero.talent.impact_wave.desc=_+1:_ Wanneer de Krijger landt na het springen, worden alle aangrenzende vijanden _2 tegels_ weggeduwd en hebben ze een kans van _25%_ om 5 beurten kwetsbaar te worden. \n\n_+2:_ Wanneer de Krijger landt na het springen, worden alle aangrenzende vijanden _3 tegels_ weggeduwd en hebben ze een _50% kans_ om 5 beurten kwetsbaar te worden. \n\n_+3:_ Wanneer de Krijger landt na het springen, worden alle aangrenzende vijanden _4 tegels_ weggeduwd en hebben ze een kans van _75%_ om 5 beurten kwetsbaar te worden. \n\n_+4:_ Wanneer de Krijger landt na het springen, worden alle aangrenzende vijanden _5 tegels_ weggeduwd en hebben ze een _100% kans_ om 5 beurten kwetsbaar te worden.
actors.hero.talent.double_jump.title=dubbele sprong
actors.hero.talent.double_jump.desc=_+1:_ Als de Krijger een tweede sprong maakt binnen 3 beurten, heeft die sprong _20% lagere_ kosten. \n\n_+2:_ Als de Krijger een tweede sprong maakt binnen 3 beurten, heeft die sprong _36% lagere_ kosten. \n\n_+3:_ Als de Krijger een tweede sprong maakt binnen 3 beurten, heeft die sprong _50% lagere_ kosten. \n\n_+4:_ Als de Krijger een tweede sprong maakt binnen 3 beurten, heeft die sprong _60% lagere_ kosten.

actors.hero.talent.expanding_wave.title=uitdijende golf
actors.hero.talent.expanding_wave.desc=_+1:_ Het bereik van Schokgolf wordt vergroot van 5 naar _6 tegels_ en de breedte wordt vergroot van 60 naar _75 graden_. \n\n_+2:_ Het bereik van Schokgolf wordt vergroot van 5 naar _7 tegels_ en de breedte wordt vergroot van 60 naar _90 graden_. \n\n_+3:_ Het bereik van Schokgolf wordt vergroot van 5 naar _8 tegels_ en de breedte wordt vergroot van 60 naar _105 graden_. \n\n_+4:_ Het bereik van Schokgolf wordt vergroot van 5 naar _9 tegels_ en de breedte wordt vergroot van 60 naar _120 graden_.
actors.hero.talent.striking_wave.title=treffende golf
actors.hero.talent.striking_wave.desc=_+1:_ Schokgolf heeft een kans van _30%_ om ook slageffecten zoals betoveringen en combo's te gebruiken.\n\n_+2:_ Schokgolf heeft een _60% kans_ om ook slageffecten zoals betoveringen en combo's te gebruiken.\ n\n_+3:_ Schokgolf heeft een kans van _90%_ om ook slageffecten zoals betoveringen en combo's te gebruiken.\n\n_+4:_ Schokgolf heeft een kans van _100%_ om ook slageffecten zoals betoveringen en combo's te gebruiken, en het geeft betoveringen _+20% kracht_.
actors.hero.talent.shock_force.title=schokgolfkracht
actors.hero.talent.shock_force.desc=_+1:_ Schokgolf richt _20% meer schade aan_ en heeft  _25% kans_ om te verdoven in plaats van te verkreupelen. \n\n_+2:_ Schokgolf richt _40% meer schade aan_ en heeft _50% kans_ om te verdoven in plaats van te verkreupelen. \n\n_+3:_ Schokgolf richt _60% meer schade aan_ en heeft _75% kans_ om te verdoven in plaats van te verkreupelen. \n\n_+4:_ Schokgolf richt _80% meer schade aan_ en heeft _100% kans_ om te verdoven in plaats van te verkreupelen.

actors.hero.talent.sustained_retribution.title=aanhoudende vergelding
actors.hero.talent.sustained_retribution.desc=_+1:_ De Krijger richt _115% bonusschade_ aan verspreid over _2 treffers_, in plaats van 100% bonusschade in 1 treffer.\n\n_+2:_ De Krijger richt _130% bonusschade_ aan verspreid over _3 treffers_, in plaats van 100% bonusschade in 1 treffer.\n\n_+3:_ De Krijger richt _145% bonusschade_ aan verspreid over _4 treffers_, in plaats van 100% bonusschade in 1 treffer.\n\n_+4:_ De Krijger richt _160% bonusschade_ aan verspreid over _5 treffers_, in plaats van 100% bonusschade in 1 treffer.
actors.hero.talent.shrug_it_off.title=schouderophalend
actors.hero.talent.shrug_it_off.desc=_+1:_ De schadevermindering van de Krijger tijdens verdragen is van 50% _verhoogd naar 60%_.\n\n_+2:_ De schadevermindering van de Krijger tijdens verdragen is van 50% _verhoogd naar 68%_.\n\ n_+3:_ De schadevermindering van de Krijger tijdens verdragen is van 50% _verhoogd naar 74%_.\n\n_+4:_ De schadevermindering van de Krijger tijdens verdragen is van 50% _verhoogd naar 80%_.
actors.hero.talent.even_the_odds.title=gelijke kansen
actors.hero.talent.even_the_odds.desc=_+1:_ De Krijger richt een extra _5% bonusschade_ aan bij elke vijand binnen 2 tegels wanneer volharding eindigt.\n\n_+2:_ De Krijger richt een extra _10% bonusschade_ aan bij elke vijand binnen 2 tegels wanneer volharding eindigt.\n\n_+3:_ De Krijger richt een extra _15% bonusschade_ aan bij elke vijand binnen 2 tegels wanneer volharding eindigt.\n\n_+4:_ De Krijger richt een extra _20% bonusschade_ aan bij elke vijand binnen 2 tegels wanneer volharding eindigt.

#mage
actors.hero.talent.empowering_meal.title=bekrachtigde maaltijd
actors.hero.talent.empowering_meal.desc=_+1:_ Het eten van voedsel geeft de Mage _2 bonusschade_ op de volgende 3 keer dat hij schade toebrengt met een toverstaf.\n\n_+2:_ Het eten van voedsel geeft de Mage _3 bonusschade_ op de volgende 3 keer dat hij schade toebrengt met een toverstaf.
actors.hero.talent.scholars_intuition.title=intuïtie van de geleerde
actors.hero.talent.scholars_intuition.desc=_+1:_ De Magiër identificeert toverstokken _3x sneller_.\n\n_+2:_ De Magiër identificeert toverstokken _wanneer hij ze gebruikt_.
actors.hero.talent.lingering_magic.title=aanhoudende magie
actors.hero.talent.lingering_magic.desc=_+1:_ Wanneer de Magiër met een toverstok of staf schiet, richt zijn volgende fysieke aanval _1-2 bonusschade_ aan.\n\n_+2:_ Wanneer de Magiër met een toverstok of staf schiet, richt zijn volgende fysieke aanval _2 bonusschade_ aan.
actors.hero.talent.backup_barrier.title=reserve barrière
actors.hero.talent.backup_barrier.desc=_+1:_ De Magiër krijgt _3 bescherming_ wanneer hij de laatste lading in zijn staf uitgeeft.\n\n_+2:_ De Magiër krijgt _5 bescherming_ wanneer hij de laatste lading in zijn staf uitgeeft.
actors.hero.talent.backup_barrier.meta_desc=_Als dit talent wordt verkregen door een andere held_ wordt het in plaats daarvan geactiveerd vanaf de toverstaf van de held met het hoogste niveau.

actors.hero.talent.energizing_meal.title=energieke maaltijd
actors.hero.talent.energizing_meal.desc=_+1:_ Voedsel eten duurt 1 beurt en verleent de Magiër _5 beurten toverstok oplading_.\n\n_2+:_ Voedsel eten duurt 1 beurt en verleent de Magiër _8 beurten toverstok oplading_.
actors.hero.talent.inscribed_power.title=ingeschreven macht
actors.hero.talent.inscribed_power.desc=_+1:_ Wanneer de Magiër een rol leest, krijgen zijn _volgende 2 toverstokschoten_ +2 niveaus.\n\n_+2:_ Wanneer de Magiër een rol leest, krijgen zijn _volgende 3 toverstokschoten_ +2 niveaus.\n\nHet aantal verbeterde toverstokschoten wordt verdubbeld bij het lezen van een rol van opwaardering, transmutatie, of alchemie-items gebruikt die met die rollen moeten worden vervaardigd.\n\nVoor alchemie-items met hogere outputhoeveelheden (bijvoorbeeld de meeste spreuken) heeft dit talent een kans om te activeren op basis van hoeveel van dat item er wordt geproduceerd.
actors.hero.talent.wand_preservation.title=toverstok behoud
actors.hero.talent.wand_preservation.desc=_+1:_ Wanneer de Magiër zijn staf met een nieuwe toverstok verrijkt, wordt de oude toverstaf teruggegeven op +0, _maar dit kan slechts één keer gedaan worden.\n\n__+2:_ Wanneer de Magiër zijn staf met een nieuwe toverstok verrijkt, wordt de oude toverstaf teruggegeven op +0, _Dit kan herhaald worden met een afkoeltijd van één heldenniveau._
actors.hero.talent.wand_preservation.meta_desc=_Als dit talent wordt verkregen door een andere held_, verhoogt het in plaats daarvan de hoeveelheid mysterieuze hars die wordt verkregen wanneer een toverstok in een alchemiepot wordt gestopt met 1 bij +1, of met 2 bij +2.
actors.hero.talent.arcane_vision.title=mysterieuze visie
actors.hero.talent.arcane_vision.desc=_+1:_ Wanneer de Magiër een vijand schiet krijgt hij geestvisie op hen voor _10 beurten_.\n\n_+1:_ Wanneer de Magiër een vijand schiet krijgt hij geestvisie op hen voor _15 beurten_.
actors.hero.talent.shield_battery.title=schildbatterij
actors.hero.talent.shield_battery.desc=_+1:_ De Magiër kan op zichzelf richten met een toverstok om al zijn ladingen om te zetten in bescherming van _4% max gezondheid per lading_.\n\n_+2:_ De Magiër kan op zichzelf richten met een toverstok om al zijn ladingen om te zetten in bescherming van _6% max gezondheid per lading_.

actors.hero.talent.desperate_power.title=wanhopige macht
actors.hero.talent.desperate_power.desc=_+1:_ De toverstokken en staf van de Magiër winnen _+1 niveau_ tijdens hun laatste schot wanneer ze hun laatste lading hebben bereikt.\n\n_+2:_ De toverstokken en staf van de Magiër winnen _+2 niveaus_ tijdens hun laatste schot wanneer ze hun laatste lading hebben bereikt.\n\n_+3:_ De toverstokken en staf van de Magiër winnen _+3 niveaus_ tijdens hun laatste schot wanneer ze hun laatste lading hebben bereikt.
actors.hero.talent.ally_warp.title=bondgenoot teleporteren
actors.hero.talent.ally_warp.desc=_+1:_ De Magiër kan een bondgenoot aantikken om direct van plaats met hem te wisselen, met een _tegelbereik van 2_.\n\n_+2:_ De Magiër kan een bondgenoot aantikken om direct van plaats met hem te wisselen, met een _tegelbereik van 4_.\n\n_+3:_ De Magiër kan een bondgenoot aantikken om direct van plaats met hem te wisselen, met een _tegelbereik van 6_.\n\nDe Magiër kan niet van plaats wisselen met onbeweeglijke bondgenoten.

actors.hero.talent.empowered_strike.title=bekrachtigde treffer
actors.hero.talent.empowered_strike.desc=_+1:_ De eerste slagaanval met de staf van de Strijdmagiër nadat hij ermee heeft geschoten, brengt _+16% schade toe_ en het bonuseffect van de staf krijgt _+50% kracht_.\n\n_+2:_ De eerste slagaanval met de staf van de Strijdmagiër nadat hij ermee heeft geschoten, brengt _+33% schade toe_ en het bonuseffect van de staf krijgt _+100% kracht_.\n\n_+3:_ De eerste slagaanval met de staf van de Strijdmagiër nadat hij ermee heeft geschoten, brengt _+50% schade toe_ en het bonuseffect van de staf krijgt _+150% kracht_.
actors.hero.talent.mystical_charge.title=mystieke aanval
actors.hero.talent.mystical_charge.desc=_+1:_ Als hij met zijn staf slaat, laadt de Strijdmagiër voor _0,5 beurten_ artefacten op.\n\n_+2:_ Als hij met zijn staf slaat, laadt de Strijdmagiër voor _1 beurt_ artefacten op.\n\n_+3:_ Als hij met zijn staf slaat, laadt de Strijdmagiër _1,5 beurten_  artefact op.
actors.hero.talent.excess_charge.title=overdadige aanval
actors.hero.talent.excess_charge.desc=_+1:_ Wanneer de staf van de Strijdmagiër volledig is opgeladen, krijgt hij _0.67 bescherming_ per niveau van de staf als hij ermee schiet.\n\n_+2:_ Wanneer de staf van de Strijdmagiër volledig is opgeladen, krijgt hij _1.33 bescherming_ per niveau van de staf als hij ermee schiet.\n\n_+3:_ Wanneer de staf van de Strijdmagiër volledig is opgeladen, krijgt hij _2 bescherming_ per niveau van de staf als hij ermee schiet.

actors.hero.talent.soul_siphon.title=zielhevel
actors.hero.talent.soul_siphon.desc=_+1:_ Slagschade die door andere personages wordt toegebracht, activeert het zielenteken van de Duivelskunstenaar met een effectiviteit van _13%_.\n\n_+2:_ Slagschade die door andere personages wordt toegebracht, activeert het zielenteken van de Duivelskunstenaar met een effectiviteit van _27%_.\n\n_+3:_ Slagschade die door andere personages is toegebracht, activeert het zielenteken van de Duivelskunstenaar met _40% effectiviteit_.
actors.hero.talent.soul_eater.title=zieleneter
actors.hero.talent.soul_eater.desc=_+1:_ Zielmarkering geeft _0.33 beurten_ verzadiging voor elke fysieke schade die wordt toegebracht. Zielgemarkeerde vijanden hebben een kans van _10%_ om eet-effecten te activeren wanneer ze sterven.\n\n_+2:_ Zielmarkering geeft _0.67 beurten_ verzadiging voor elke fysieke schade die wordt toegebracht. Zielgemarkeerde vijanden hebben een kans van _20%_ om eet-effecten te activeren wanneer ze sterven.\n\n_+3:_ Zielmarkering geeft _1 beurt_ verzadiging voor elke fysieke schade die wordt toegebracht. Zielgemarkeerde vijanden hebben een kans van _30%_ om eet-effecten te activeren wanneer ze sterven.
actors.hero.talent.necromancers_minions.title=volgeling van de geestenbezweerder
actors.hero.talent.necromancers_minions.desc=_+1:_ Wanneer een zielgemarkeerde vijand sterft, heeft de Duivelskunstenaar een kans van _13%_ om een corrupte Schim op te roepen.\n\n_+2:_ Wanneer een zielgemarkeerde vijand sterft, heeft de Duivelskunstenaar een kans van _27%_ om een corrupte Schim op te roepen.\n\n_+3:_ Wanneer een zielgemarkeerde vijand sterft, heeft de Duivelskunstenaar een kans van _40%_ om een corrupte Schim op te roepen.

actors.hero.talent.blast_radius.title=ontploffingsstraal
actors.hero.talent.blast_radius.desc=_+1:_ De straal van de elementaire explosie vergroot van 4 naar _5 tegels_.\n\n_+2:_ De straal van de elementaire explosie vergroot van 4 naar _6 tegels_.\n\n_+3:_ De straal van de elementaire explosie vergroot van 4 naar _7 tegels_.\n\n_+4:_ De straal van de elementaire explosie vergroot van 4 naar _8 tegels_.
actors.hero.talent.elemental_power.title=elementaire kracht
actors.hero.talent.elemental_power.desc=_+1:_ De kracht van elementaire explosie wordt verhoogd met _25%_.\n\n_+2:_ De kracht van elementaire explosie wordt verhoogd met _50%_.\n\n_+3:_ De kracht van elementaire explosie wordt verhoogd met _75%_.\n\n_+4:_ De kracht van elementaire explosie wordt verhoogd met _100%_.
actors.hero.talent.reactive_barrier.title=reactieve barrière
actors.hero.talent.reactive_barrier.desc=_+1:_ De Magiër krijgt _2,5 bescherming_ voor elk personage dat wordt getroffen door een elementaire explosie, tot een maximum van 5 personen.\n\n_+2:_ De Magiër krijgt _5 bescherming_ voor elk personage dat wordt getroffen door een elementaire explosie, tot een maximum van 6 personen.\n\n_+3:_ De Magiër krijgt _7.5 bescherming_ voor elk personage dat wordt getroffen door een elementaire explosie, tot een maximum van 7 personen.\n\n_+4:_ De Magiër krijgt _10 bescherming_ voor elk personage dat wordt getroffen door een elementaire explosie, tot een maximum van 8 personen.

actors.hero.talent.wild_power.title=wilde kracht
actors.hero.talent.wild_power.desc=_+1:_ Bij gebruik van wilde magie worden toverstokken versterkt met _2 of 3, tot +4 niveaus_.\n\n_+2:_ Bij gebruik van wilde magie worden toverstokken versterkt met _3, tot +5 niveaus_.\n\n_+3:_ Bij gebruik van wilde magie worden toverstokken versterkt met _3 of 4, tot +6 niveaus_.\n\n_+4:_ Bij gebruik van wilde magie worden toverstokken versterkt met _4, tot +7 niveaus_.
actors.hero.talent.fire_everything.title=vuur alles af
actors.hero.talent.fire_everything.desc=_+1:_ Wilde magie vuurt nu _5 keer_ in plaats van 4, en elke toverstok heeft _25% kans_ om 3 keer te worden gebruikt.\n\n_+2:_ Wilde magie vuurt nu _6 keer_ in plaats van 4, en elke toverstok heeft _50% kans_ om 3 keer te worden gebruikt.\n\n_+3:_ Wilde magie vuurt nu _7 keer_ in plaats van 4, en elke toverstok heeft _75% kans_ om 3 keer te worden gebruikt.\n\n_+4:_ Wilde magie vuurt nu _8 keer_ in plaats van 4, en elke toverstok heeft _100% kans_ om 3 keer te worden gebruikt.
actors.hero.talent.conserved_magic.title=bewaarde magie
actors.hero.talent.conserved_magic.desc=_+1:_ Elk schot van wilde magie gebruikt nu _0,33 ladingen_ in plaats van 0,5, en wilde magie heeft een kans van _25%_ om geen beurt te kosten.\n\n_+2:_ Elk schot van wilde magie gebruikt nu _0 .225 lading_ in plaats van 0,5, en wilde magie heeft _50% kans_ om geen beurt te kosten.\n\n_+3:_ Elk schot van wilde magie gebruikt nu _0,15 lading_ in plaats van 0,5, en wilde magie heeft een _75% kans_ om geen beurt te kosten.\n\n_+4:_ Elk schot van wilde magie gebruikt nu _0,1 lading_ in plaats van 0,5, en wilde magie heeft een kans van _100%_ om geen beurt te kosten.

actors.hero.talent.telefrag.title=Dodelijke teleportatie
actors.hero.talent.telefrag.desc=_+1:_ Als de Magiër zich in een ander personage teleporteert, brengt hij er _10-15 schade_ aan toe, maar krijgt hij ook _5 schade_.\n\n_+2:_ Als de Magiër zich in een ander personage teleporteert, brengt hij _20-30 schade_ toe, maar krijgt ook _10 schade_.\n\n_+3:_ Als de Magiër zich in een ander personage teleporteert, brengt hij _30-45 schade_ toe, maar krijgt ook _15 schade_.\n\n_+4:_ Als de Magiër zich in een ander personage teleporteert, brengt hij er _40-60 schade_ aan toe, maar krijgt hij ook _20 schade_.\n\nDe held kan niet worden gedood door dit talent, de zelfbeschadiging kan worden verminderd door magische weerstandseffecten.
actors.hero.talent.remote_beacon.title=Baken op afstand
actors.hero.talent.remote_beacon.desc=_+1:_ De Magiër kan een baken plaatsen op elke plek binnen _4 tegels_.\n\n_+2:_ De Magiër kan een baken plaatsen op elke plek binnen _8 tegels_.\n\n_+3:_ De Magiër kan een baken plaatsen op elke plek binnen _12 tegels_.\n\n_+4:_ De Magiër kan een baken plaatsen op elke plek binnen _16 tegels_.\n\nDe Magiër kan geen bakens plaatsen op ontoegankelijke plekken.
actors.hero.talent.longrange_warp.title=Langeafstands teleportatie
actors.hero.talent.longrange_warp.desc=_+1:_ De Magiër kan nu teleporteren tussen verdiepingen, tegen _150% oplaadkosten_.\n\n_+2:_ De Magiër kan nu teleporteren tussen verdiepingen, tegen _117% oplaadkosten_.\n\n_+3:_ De Magiër kan nu teleporteren tussen verdiepingen, tegen _83% oplaadkosten_.\n\n_+4:_ De Magiër kan nu teleporteren tussen verdiepingen, tegen _50% oplaadkosten_.\n\nDe Magiër kan geen langeafstands teleportatie gebruiken om een afgesloten verdieping te verlaten.

#rogue
actors.hero.talent.cached_rations.title=opgeslagen rantsoenen
actors.hero.talent.cached_rations.desc=_+1:_ De Schurk kan _2 bevoorradingsrantsoenen_ in kisten vinden tijdens verkenning van de volgende stadia van de kerker.\n\n_+2:_ De Schurk kan _3 bevoorradingsrantsoenen_ in kisten vinden tijdens verkenning van de volgende stadia van de kerker.\n\nBevoorradingsrantsoenen worden snel gegeten, herstellen een gematigde hoeveelheid verzadiging, genezen 5 gezondheid en herstellen 1 lading aan de mantel van schaduwen.
actors.hero.talent.thiefs_intuition.title=intuïtie van de dief
actors.hero.talent.thiefs_intuition.desc=_+1:_ De Schurk identificeert ringen _2x sneller_, en identificeert het type ring _wanneer hij ze uitrust_.\n\n_+2:_ De Schurk identificeert ringen _wanneer hij ze uitrust_, en identificeert het type ring _wanneer hij ze oppakt_.
actors.hero.talent.sucker_punch.title=onverwachte mep
actors.hero.talent.sucker_punch.desc=_+1:_ De Schurk richt _1-2 bonusschade_ aan bij de eerste verrassingsaanval op een vijand.\n\n_+2:_ De Schurk richt _2 bonusschade_ aan bij de eerste verrassingsaanval op een vijand.
actors.hero.talent.protective_shadows.title=beschermende shaduwen
actors.hero.talent.protective_shadows.desc=_+1:_ De Schurk krijgt één bescherming _voor iedere andere beurt_ dat hij onzichtbaar is, _tot een maximum van 3_.\n\n_+2:_ De Schurk krijgt één bescherming _voor iedere beurt_ dat hij onzichtbaar is, _tot een maximum van 5_.

actors.hero.talent.mystical_meal.title=mystieke maaltijd
actors.hero.talent.mystical_meal.desc=_+1:_ Het eten van voedsel kost de Schurk 1 beurt (voorraadrantsoenen worden onmiddellijk opgegeten) en geeft hem _3 beurten van artefact oplading_.\n\n_+2:_ Het eten van voedsel kost de Schurk 1 beurt (voorraadrantsoenen worden onmiddellijk opgegeten) en geeft hem _5 beurten van artefact oplading_.\n\nDit talent kan niet worden gebruikt om de hoorn des overvloeds op te laden.
actors.hero.talent.inscribed_stealth.title=ingeschreven onzichtbaarheid
actors.hero.talent.inscribed_stealth.desc=_+1:_ De Schurk krijgt _3 beurten_ onzichtbaarheid na het lezen van een rol of het gebruiken van een spreukitem.\n\n_+2:_ De Schurk krijgt _5 beurten_ onzichtbaarheid na het lezen van een rol of het gebruiken van een spreukitem.\n\nDe onzichtbaarheidsduur wordt verdubbeld bij het lezen van een rol van opwaardering, transmutatie, of alchemie-items gebruikt die met die rollen moeten worden vervaardigd.\n\nVoor alchemie-items met hogere outputhoeveelheden (bijvoorbeeld de meeste spreuken) heeft dit talent een kans om te activeren op basis van hoeveel van dat item er wordt geproduceerd.
actors.hero.talent.wide_search.title=groot bereik
actors.hero.talent.wide_search.desc=_+1:_ De zoekradius van de Schurk vergroot van een 5x5 vierkant naar een _7x7 cirkel_.\n\n_+2:_ De zoekradius van de Schurk vergroot van een 5x5 vierkant naar een _7x7 vierkant_.
actors.hero.talent.wide_search.meta_desc=_Als dit talent wordt verkregen door een andere held_ vergroot het in plaats daarvan hun zoekradius van een 3x3 vierkant naar een 5x5 cirkel op +1, of een 5x5 vierkant op +2.
actors.hero.talent.silent_steps.title=stille stappen
actors.hero.talent.silent_steps.desc=_+1:_ De Schurk maakt geen slapende vijanden wakker als hij _3 of meer tegels van ze verwijderd is_.\n\n_+2:_ De Schurk maakt geen slapende vijanden wakker als hij _niet naast hen is_.
actors.hero.talent.rogues_foresight.title=vooruitziende blik van de schurk
actors.hero.talent.rogues_foresight.desc=_+1:_ Wanneer de Schurk zich op een verdieping bevindt met een geheime kamer, heeft hij _75% kans om op te merken_ dat de verdieping een geheim bevat.\n\n_+2:_ Wanneer de Schurk zich op een verdieping bevindt met een geheime kamer, heeft hij _100% kans om op te merken_ dat de verdieping een geheim bevat.

actors.hero.talent.light_cloak.title=lichte mantel
actors.hero.talent.light_cloak.desc=_+1:_ De Schurk kan zijn schaduwmantel gebruiken als hij niet is uitgerust, maar hij laadt op met _25% snelheid_ als hij niet is uitgerust.\n\n_+2:_ De Schurk kan zijn schaduwmantel gebruiken als hij niet is uitgerust, maar hij laadt op met _50% snelheid_ als hij niet is uitgerust.\n\n_+3:_ De Schurk kan zijn schaduwmantel gebruiken als hij niet is uitgerust, maar hij laadt op met _75% snelheid_ als hij niet is uitgerust.
actors.hero.talent.light_cloak.meta_desc=_Als dit talent wordt verkregen door een andere held_ verhoogt het in plaats daarvan de oplaadsnelheid van alle artefacten met 7/13/20% bij +1/+2/+3.
actors.hero.talent.enhanced_rings.title=betoverde ringen
actors.hero.talent.enhanced_rings.desc=_+1:_ Wanneer de Schurk een artefact gebruikt, krijgen zijn ringen +1 opwaardering voor _3 beurten_.\n\n_+2:_ Wanneer de Schurk een artefact gebruikt, krijgen zijn ringen +1 opwaardering voor _6 beurten_.\n\n_+3:_Wanneer de Schurk een artefact gebruikt, krijgen zijn ringen +1 opwaardering voor _9 beurten_.

actors.hero.talent.enhanced_lethality.title=betoverde dodelijkheid
actors.hero.talent.enhanced_lethality.desc=_+1:_ De Sluipmoordenaar kan overgebleven vijanden doden die minder dan _4/13/27/67% gezondheid_ hebben per voorbereidingsniveau, in plaats van 3/10/20/50%.\n\n_+2:_ De Sluipmoordenaar kan overgebleven vijanden doden die minder dan _5/17/33/83% gezondheid_ hebben per voorbereidingsniveau, in plaats van 3/10/20/50%\n\n._+3:_ De Sluipmoordenaar kan overgebleven vijanden doden die minder dan _6/20/40/100% gezondheid_ hebben per voorbereidingsniveau, in plaats van 3/10/20/50%.
actors.hero.talent.assassins_reach.title=bereik van de sluipmoordenaar
actors.hero.talent.assassins_reach.desc=_+1:_ Het toesnelbereik van de Sluipmoordenaar wordt per voorbereidingsniveau verhoogd van 1/2/3/4 naar _1/3/4/6 tegels_.\n\n_+2:_ Het toesnelbereik van de Sluipmoordenaar wordt per voorbereidingsniveau verhoogd van 1/2/3/4 naar _2/4/6/8 tegels_.\n\n_+3:_ Het toesnelbereik van de Sluipmoordenaar wordt per voorbereidingsniveau verhoogd van 1/2/3/4 naar _2/5/7/10 tegels_.\n\nDit toesnellen kan door gevaren en vijanden gaan, maar niet door stevig terrein zoals muren.
actors.hero.talent.bounty_hunter.title=premiejager
actors.hero.talent.bounty_hunter.desc=_+1:_ Als de Sluipmoordenaar een vijand doodt met een voorbereide aanval, wordt de kans op een voorwerpbonus vergroot met _2/4/8/16%_, per niveau van voorbereiding.\n\n_+2:_ Als de Sluipmoordenaar een vijand doodt met een voorbereide aanval, wordt de kans op een voorwerpbonus vergroot met _4/8/16/32%_, per niveau van voorbereiding.\n\n_+3:_ Als de Sluipmoordenaar een vijand doodt met een voorbereide aanval, wordt de kans op een voorwerpbonus vergroot met _6/12/24/48%_, per niveau van voorbereiding.

actors.hero.talent.evasive_armor.title=ontwijkend harnas
actors.hero.talent.evasive_armor.desc=_+1:_ Tijdens het freerunnen krijgt de Freerunner een extra _+1 ontwijking_ per overtollig krachtpunt van zijn harnas.\n\n_+2:_ Tijdens het freerunnen krijgt de Freerunner een extra _+2 ontwijking_ per overtollig krachtpunt van zijn harnas.\n\n_+3:_ Tijdens het freerunnen krijgt de Freerunner een extra _+3 ontwijking_ per overtollig krachtpunt van zijn harnas.
actors.hero.talent.projectile_momentum.title=projectiel momentum
actors.hero.talent.projectile_momentum.desc=_+1:_ Tijdens het freerunnen krijgt de Freerunner _+50% nauwkeurigheid en +15% schade_ met werpwapens.\n\n_+2:_ Tijdens het freerunnen krijgt de Freerunner _+100% nauwkeurigheid en +30% schade_ met werpwapens.\n\n_+3:_ Tijdens het freerunnen wint de Freerunner _+150% nauwkeurigheid en +45% schade_ met werpwapens.
actors.hero.talent.speedy_stealth.title=snelle onzichtbaarheid
actors.hero.talent.speedy_stealth.desc=_+1:_ De Freerunner krijgt 2 extra momentum per beurt terwijl hij onzichtbaar is.\n\n_+2:_ Naast de voordelen van +1 neemt freerunning momentum niet meer af terwijl de Freerunner onzichtbaar is.\n\n_+3:_ Naast de voordelen van +1 en +2, beweegt de Freerunner met 2x snelheid terwijl hij onzichtbaar is, ongeacht of hij aan het freerunnen is of niet.

actors.hero.talent.hasty_retreat.title=haastige terugtocht
actors.hero.talent.hasty_retreat.desc=_+1:_ Na toesnellen krijgt de Schurk _1 beurt_ aan haast en onzichtbaarheid.\n\n_+2:_ Na toesnellen krijgt de Schurk _2 beurten_ aan haast en onzichtbaarheid.\n\n_+3:_ Na toesnellen krijgt de Schurk _3 beurten_ aan haast en onzichtbaarheid.\n\n_+4:_ Na toesnellen krijgt de Schurk _4 beurten_ aan haast en onzichtbaarheid.
actors.hero.talent.body_replacement.title=lichaamsvervanging
actors.hero.talent.body_replacement.desc=_+1:_ Na te hebben toegesneld, laat de Schurk een houten lokaas achter met _20 gezondheid en 1-3 harnassterkte_.\n\n_+2:_ Na te hebben toegesneld, laat de Schurk een houten lokaas achter met _40 gezondheid en 2-6 harnassterkte_.\n\n_+3:_ Na te hebben toegesneld, laat de Schurk een houten lokaas achter met _60 gezondheid en 3-9 harnassterkte_.\n\n_+4:_ Na te hebben toegesneld, laat de Schurk een houten lokaas achter met _80 gezondheid en 4-12 harnassterkte_.\n\nEr kan slechts één lokaas tegelijk actief zijn.
actors.hero.talent.shadow_step.title=schaduw stap
actors.hero.talent.shadow_step.desc=_+1:_ Als de Schurk een rookbom gebruikt terwijl hij onzichtbaar is, gebeurt dit onmiddellijk en zijn de kosten _16% lager_, maar het verblindt vijanden ook niet en activeert geen andere talenten.\n\n_+2:_ Als de Schurk een rookbom gebruikt terwijl hij onzichtbaar is, gebeurt dit onmiddellijk en zijn de kosten _30% lager_ , maar het verblindt ook geen vijanden en activeert geen andere talenten.\n\n_+3:_ Als de Schurk een rookbom gebruikt terwijl hij onzichtbaar is, gebeurt dit onmiddellijk en zijn de kosten _41% lager_, maar het verblindt ook geen vijanden en activeert geen andere talenten.\n\n_+4:_ Als de Schurk een rookbom gebruikt terwijl hij onzichtbaar is, gebeurt dit onmiddellijk en zijn de kosten _50%_ lader, maar het verblindt ook geen vijanden en activeert geen andere talenten.

actors.hero.talent.fear_the_reaper.title=vrees Magere Hein
actors.hero.talent.fear_the_reaper.desc=_+1:_ Wanneer een met de dood gemarkeerde vijand 0 gezondheid bereikt, raakt hij _kreupel_.\n\n_+2:_ Wanneer een met de dood gemarkeerde vijand 0 gezondheid bereikt, raakt hij _bevreesd en kreupel_.\n\n_+3:_ Wanneer een met de dood gemarkeerde vijand 0 gezondheid bereikt, raakt hij _bevreesd en kreupel_ en worden vijanden binnen 3 tegels _kreupel_.\n\n_+4:_ Wanneer een met de dood gemarkeerde vijand 0 gezondheid bereikt, raakt hij _bevreesd en kreupel_ en worden vijanden binnen 3 tegels _bevreesd en kreupel_.
actors.hero.talent.deathly_durability.title=dodelijk duurzaam
actors.hero.talent.deathly_durability.desc=_+1:_ Gedode doodgemarkeerde vijanden geven de Schurk _13%_ van hun gezondheid bescherming toen ze werden gemarkeerd.\n\n_+2:_ Gedode doodgemarkeerde vijanden geven de Schurk _25%_ van hun gezondheid bescherming toen ze werden gemarkeerd.\n\n_+3:_ Gedode doodgemarkeerde vijanden geven de Schurk _38%_ van hun gezondheid bescherming toen ze werden gemarkeerd.\n\n_+4:_ Gedode doodgemarkeerde vijanden geven de Schurk _50%_ van hun gezondheid bescherming toen ze werden gemarkeerd.
actors.hero.talent.double_mark.title=dubbel teken
actors.hero.talent.double_mark.desc=_+1:_ Het markeren van een tweede doel op hetzelfde moment als het eerste heeft _30% gereduceerde_ kosten.\n\n_+2:_ Het markeren van een tweede doel op hetzelfde moment als het eerste heeft een _50% gereduceerde_ kosten.\n\n_+3:_ Het markeren van een tweede doel op hetzelfde moment als het eerste heeft een _65% gereduceerde_ kosten.\n\n_+4:_ Het markeren van een tweede doel op hetzelfde moment als het eerste heeft een _75% gereduceerde_ kosten.

actors.hero.talent.shadow_blade.title=schaduw lemmet
actors.hero.talent.shadow_blade.desc=_+1:_ De schaduwkloon krijgt _8%_ van de schade van de held per beurt en heeft een kans van _25%_ om de betovering van het wapen van de held te gebruiken.\n\n_+2:_ De schaduwkloon krijgt _16%_ van de schade van de held per beurt en heeft een kans van _50%_ om de betovering van het wapen van de held te gebruiken.\n\n_+3:_ De schaduwkloon krijgt _24%_ van de schade van de held per beurt en heeft een kans van _75%_ om de betovering van het wapen van de held te gebruiken\n\n._+4:_ De schaduwkloon krijgt _32%_ van de schade van de held per beurt en heeft een kans van _100%_ om de betovering van het wapen van de held te gebruiken.
actors.hero.talent.cloned_armor.title=gekloond harnas
actors.hero.talent.cloned_armor.desc=_+1:_ De schaduwkloon krijgt _12%_ van de harnassterkte van de held en heeft een kans van _25%_ om het symbool op het harnas van de held te gebruiken.\n\n_+2:_ De schaduwkloon krijgt _24%_ van de harnassterkte van de held en heeft een kans van _50%_ om het symbool op het harnas van de held te gebruiken.\n\n_+3:_ De schaduwkloon krijgt _36%_ van de harnassterkte van de held en heeft een kans van _75%_ om het symbool op het harnas van de held te gebruiken.\n\n_+4:_ De schaduwkloon krijgt _48%_ van de harnassterkte van de held en heeft een kans van _100%_ om het symbool op het harnas van de held te gebruiken.
actors.hero.talent.perfect_copy.title=perfecte kopie
actors.hero.talent.perfect_copy.desc=_+1:_ De schaduwkloon krijgt _10%_ van de maximale gezondheid van de held en kan onmiddellijk van plaats wisselen met de held tot _1 tegel_ weg.\n\n_+2:_ De schaduwkloon krijgt _20%_ van de maximale gezondheid van de held en kan onmiddellijk van plaats wisselen met de held tot _2 tegels_ verder.\n\n_+3:_ De schaduwkloon krijgt _30%_ van de maximale gezondheid van de held en kan onmiddellijk van plaats wisselen met de held tot _3 tegels_ verder.\n\n_+4:_ De schaduwkloon krijgt _40%_ van de maximale gezondheid van de held en kan onmiddellijk van plaats wisselen met de held tot _4 tegels_ verder.

#huntress
actors.hero.talent.natures_bounty.title=natuurpremie
actors.hero.talent.natures_bounty.desc=_+1:_ De Jaagster kan _4 bessen_ vinden die verborgen zijn in hoog gras terwijl ze de volgende stadia van de kerker verkent.\n\n_+2:_ De Jaagster kan _6 bessen_ vinden die verborgen zijn in hoog gras terwijl ze de volgende stadia van de kerker verkent.\n\nBessen worden snel gegeten, zorgen voor een kleine hoeveelheid verzadiging en kunnen een bruikbaar zaadje bevatten.
actors.hero.talent.survivalists_intuition.title=intuïtie van de overlever
actors.hero.talent.survivalists_intuition.desc=_+1:_ De Jaagster identificeert werpwapens _3x sneller_.\n\n_+2:_ De Jaagster identificeert werpwapens _wanneer ze een treffer scoort_.
actors.hero.talent.followup_strike.title=opvolgende treffer
actors.hero.talent.followup_strike.desc=_+1:_ Wanneer de Jaagster een vijand raakt met haar boog of een werpwapen, richt haar volgende slagaanval tegen die vijand _2 bonusschade_ op.\n\n_+2:_ Wanneer de Jaagster een vijand raakt met haar boog of een werpwapen, richt haar volgende slagaanval tegen die vijand _3 bonusschade_ op.
actors.hero.talent.natures_aid.title=hulp van de natuur
actors.hero.talent.natures_aid.desc=_+1:_ De Jaagster krijgt 0-2 pantser van schorshuid, dat elke _3 beurten_ verdwijnt wanneer het effect van een plant in haar zicht wordt geactiveerd.\n\n_+2:_ De Jaagster krijgt 0-2 pantser van schorshuid, dat elke _5 beurten_ verdwijnt wanneer het effect van een plant in haar zicht wordt geactiveerd.

actors.hero.talent.invigorating_meal.title=stimulerende maaltijd
actors.hero.talent.invigorating_meal.desc=_+1:_ Het eten van voedsel kost de Jaagster 1 beurt (bessen worden direct gegeten) en geeft haar _1 beurt van haast_.\n\n_+2:_ Het eten van voedsel kost de Jaagster 1 beurt (bessen worden onmiddellijk gegeten) en geeft haar _2 beurt van haast_.
actors.hero.talent.liquid_nature.title=vloeibare natuur
actors.hero.talent.liquid_nature.desc=_+1:_ Wanneer de Jaagster een drankje drinkt of gooit, ontkiemen er _maximaal 4 grastegels_ in de omgeving en worden aangrenzende vijanden _1 beurt_ geworteld.\n\n_+2:_ Wanneer de Jaagster een drankje drinkt of gooit, ontkiemen er _maximaal 6 grastegels_ in de omgeving en worden aangrenzende vijanden _2 beurten lang geworteld_.\n\nDe hoeveelheid gras- en wortelduur wordt verdubbeld bij het gebruik van drankjes van kracht, ervaring, meesterschap of goddelijke inspiratie.\n\nVoor alchemie items met hogere outputhoeveelheden (bijvoorbeeld aqua brew) heeft dit talent een kans om te activeren op basis van hoeveel van dat item er wordt geproduceerd.
actors.hero.talent.rejuvenating_steps.title=verjongende stappen
actors.hero.talent.rejuvenating_steps.desc=_+1:_ Wanneer de Jaagster op kort gras of sintels stapt, springt het op tot hoog gras dat de Jaagster onmiddellijk doorzoekt en vertrapt. Dit heeft een afkoelperiode van _10 beurten_.\n\n_+2:_ Wanneer de Jaagster op kort gras of sintels stapt, springt het op tot hoog gras dat de Jaagster onmiddellijk doorzoekt en vertrapt. Dit heeft een afkoelperiode van _5 beurten_.\n\nDit talent produceert vertrapt gras als passieve regeneratie-effecten zijn uitgeschakeld of als de held al lang geen ervaring heeft gekregen.
actors.hero.talent.heightened_senses.title=verhoogde zintuigen
actors.hero.talent.heightened_senses.desc=_+1:_ De Jaagster krijgt geestzicht op elke vijand binnen _2 tegels van haar positie_.\n\n_+2:_ De Jaagster krijgt geestzicht op elke vijand binnen _3 tegels van haar positie_.
actors.hero.talent.durable_projectiles.title=duurzame projectielen
actors.hero.talent.durable_projectiles.desc=_+1:_ Werpwapens hebben _+50% duurzaamheid_ wanneer ze door de Jaagster worden gebruikt.\n\n_+2:_ Werpwapens hebben _+75% duurzaamheid_ wanneer ze door de Jaagster worden gebruikt.

actors.hero.talent.point_blank.title=op de man af
actors.hero.talent.point_blank.desc=_+1:_ Wanneer de Jaagster haar boog of een werpwapen op slagbereik gebruikt, heeft het _-25% nauwkeurigheid,_ in plaats van -50%.\n\n_+2:_ Wanneer de Jaagster haar boog of een werpwapen op slagbereik gebruikt, heeft het _normale nauwkeurigheid,_ in plaats van -50%\n\n_+3:_ Wanneer de Jaagster haar boog of een werpwapen op slagbereik gebruikt, heeft het _+25% nauwkeurigheid,_ in plaats van -50%.\n\nMerk op dat werpwapens of de geestboog altijd +50% nauwkeurigheid hebben bij gebruik op afstand.
actors.hero.talent.seer_shot.title=ziener schot
actors.hero.talent.seer_shot.desc=_+1:_ Wanneer de Jaagster een pijl op de grond afvuurt, geeft het zicht in een gebied van 3x3 eromheen voor _5 beurten_. Dit heeft een afkoelperiode van 20 beurten.\n\n_+2:_ Wanneer de Jaagster een pijl op de grond afvuurt, geeft het zicht in een gebied van 3x3 eromheen voor _10 beurten_. Dit heeft een afkoelperiode van 20 beurten.\n\n_+3:_ Wanneer de Jaagster een pijl op de grond afvuurt, geeft het zicht in een gebied van 3x3 eromheen voor _15 beurten_. Dit heeft een afkoelperiode van 20 beurten.
actors.hero.talent.seer_shot.meta_desc=_Als dit talent wordt verkregen door een andere held_ wordt het geactiveerd vanaf elk werpwapen.

actors.hero.talent.farsight.title=verziendheid
actors.hero.talent.farsight.desc=_+1:_ Het zichtbereik van de Sluipschutter _verhoogt met 25%_.\n\n_+2:_ Het zichtbereik van de Sluipschutter _verhoogt met 50%_.\n\n_+3:_ Het zichtbereik van de Sluipschutter _verhoogt met 75%_.
actors.hero.talent.shared_enchantment.title=gedeelde betovering
actors.hero.talent.shared_enchantment.desc=_+1:_ Werpwapens hebben een kans van _33%_ om de betovering op de boog van de Sluipschutter te gebruiken.\n\n_+2:_ Werpwapens hebben een kans van _67%_ om de betovering op de boog van de Sluipschutter te gebruiken.\n\n_+3:_ Werpwapens hebben een kans van _100%_ om de betovering op de boog van de Sluipschutter te gebruiken.\n\nDe betovering van de boog kan worden geactiveerd in aanvulling op de betovering die het werpwapen al heeft.
actors.hero.talent.shared_upgrades.title=gedeelde upgrades
actors.hero.talent.shared_upgrades.desc=_+1:_ Wanneer de Sluipschutter aanvalt met een opgewaardeerd werpwapen, verhoogt elk niveau de duur van het sluipschutterteken met 1 beurt en de schade van haar speciale aanval met 16%, tot een maximum van _2 beurten en +33% schade bij +2_\n\n_+2:_ Wanneer de Sluipschutter aanvalt met een opgewaardeerd werpwapen, verhoogt elk niveau de duur van het sluipschutterteken met 1 beurt en de schade van haar speciale aanval met 16%, tot een maximum van _4 beurten en +67% schade bij +4_\n\n_+3:_ Wanneer de Sluipschutter aanvalt met een opgewaardeerd werpwapen, verhoogt elk niveau de duur van het sluipschutterteken met 1 beurt en de schade van haar speciale aanval met 16%, tot een maximum van _6 beurten en +100% schade bij +6_

actors.hero.talent.durable_tips.title=duurzame tips
actors.hero.talent.durable_tips.desc=_+1:_ Getipte pijltjes hebben _2x duurzaamheid_ wanneer de Bewaakster ze gebruikt.\n\n_+2:_ Getipte pijltjes hebben _3x duurzaamheid_ wanneer de Bewaakster ze gebruikt.\n\n_+3:_ Getipte pijltjes hebben _4x duurzaamheid_ wanneer de Bewaakster ze gebruikt.
actors.hero.talent.barkskin.title=schorshuid
actors.hero.talent.barkskin.desc=_+1:_ Als de Bewaakster in gras stapt, krijgt ze _0-50% van haar niveau_ in schorshuid pantser dat iedere beurt vervaagt.\n\n_+2:_ Als de Bewaakster in gras stapt, krijgt ze _0-100% van haar niveau_ in schorshuid pantser dat iedere beurt vervaagt.\n\n_+3:_ Als de Bewaakster in gras stapt, krijgt ze _0-150% van haar niveau_ in schorshuid pantser dat iedere beurt vervaagt.
actors.hero.talent.shielding_dew.title=afschermende dauw
actors.hero.talent.shielding_dew.desc=_+1:_ Dauwdruppels kunnen de Bewaakster beschermen wanneer haar gezondheid vol is, tot _20% van haar maximale gezondheid_.\n\n_+2:_ Dauwdruppels kunnen de Bewaakster beschermen wanneer haar gezondheid vol is, tot _40% van haar maximale gezondheid_.\n\n_+3:_ Dauwdruppels kunnen de Bewaakster beschermen wanneer haar gezondheid vol is, tot _60% van haar maximale gezondheid_.

actors.hero.talent.fan_of_blades.title=uitwaaierende messen
actors.hero.talent.fan_of_blades.desc=_+1:_ Spookachtige messen kunnen tot _1 extra doelwit_ raken met 50% schade. Het doel moet zichtbaar zijn en zich bevinden binnen een kegelvormig gebied van _30 graden_.\n\n_+2:_ Spookachtige messen kunnen tot _2 extra doelen_ raken met 50% schade. De doelen moeten zichtbaar zijn en zich bevinden binnen een kegelvormig gebied van _60 graden_.\n\n_+3:_ Spookachtige messen kunnen tot _3 extra doelen_ raken met 50% schade. De doelen moeten zichtbaar zijn en zich bevinden binnen een kegelvormig gebied van _90 graden_.\n\n_+4:_ Spookachtige messen kunnen tot _4 extra doelen_ raken met 50% schade. De doelen moeten zichtbaar zijn en zich bevinden binnen een kegelvormig gebied van _120 graden_.
actors.hero.talent.projecting_blades.title=projecterende messen
actors.hero.talent.projecting_blades.desc=_+1:_ Spookachtige messen hebben een nauwkeurigheid van _+25%_ en kunnen tot _2 harde tegels doordringen_.\n\n_+2:_ Spookachtige messen hebben een nauwkeurigheid van _+50%_ en kunnen tot _4 harde tegels doordringen_.\n\n_+3:_ Spookachtige messen hebben een nauwkeurigheid van _+75%_ en kunnen tot _6 harde tegels doordringen_.\n\n_+4:_ Spookachtige messen hebben _+100% nauwkeurigheid_ en kunnen tot _8 harde tegels doordringen_.
actors.hero.talent.spirit_blades.title=geestmessen
actors.hero.talent.spirit_blades.desc=_+1:_ Spookachtige messen hebben _30% kans_ om ook de betovering op de geestboog te gebruiken.\n\n_+2:_ Spookachtige messen hebben _60% kans_ om ook de betovering op de geestboog te gebruiken.\n\ n_+3:_ Spookachtige messen hebben _90% kans_ om ook de betovering op de geestboog te gebruiken.\n\n_+4:_ Spookachtige messen hebben _100% kans_ om ook de betovering op de geestboog te gebruiken, en het geeft elke betovering _+10% kracht_.

actors.hero.talent.growing_power.title=groeikracht
actors.hero.talent.growing_power.desc=_+1:_ De aanvals- en bewegingssnelheidsboosts van de kracht van de natuur worden verhoogd van 33% en 100% naar _38% en 125%_.\n\n_+2:_ De aanvals- en bewegingssnelheidsboosts van de kracht van de natuur worden verhoogd van 33% en 100% naar _42% en 150%_.\n\n_+3:_ De aanvals- en bewegingssnelheidsboosts van de kracht van de natuur worden verhoogd van 33% en 100% naar _46% en 175%_.\n\n_+4:_ De aanvals- en bewegingssnelheidsboosts van de kracht van de natuur worden verhoogd van 33% en 100% naar _50% en 200%_.
actors.hero.talent.natures_wrath.title=toorn van de natuur
actors.hero.talent.natures_wrath.desc=_+1:_ Terwijl de kracht van de natuur actief is, hebben schoten van de geestboog een kans van _8%_ om een willekeurig schadelijk planteffect te veroorzaken.\n\n_+2:_ Terwijl de kracht van de natuur actief is, hebben schoten van de geestboog een kans van _17%_ om een willekeurig schadelijk planteffect te veroorzaken.\n\n_+3:_ Terwijl de kracht van de natuur actief is, hebben schoten van de geestboog een kans van _25%_ om een willekeurig schadelijk planteffect te veroorzaken.\n\n_+4:_ Terwijl de kracht van de natuur actief is, hebben schoten van de geestboog een kans van _33%_ om een willekeurig schadelijk planteffect te veroorzaken.\n\nDe planten die kunnen worden getriggerd zijn: blindkruid, vuurbloem, ijsklokje, treurmos en stormrank.
actors.hero.talent.wild_momentum.title=wild momentum
actors.hero.talent.wild_momentum.desc=_+1:_ Het doden van een vijand met de geestboog verlengt de duur van de kracht van de natuur met _1 beurt_. De duur kan met maximaal _2 beurten_ worden verlengd.\n\n_+2:_ Het doden van een vijand met de geestboog verlengt de kracht van de natuur met _2 beurten_. De duur kan met maximaal _4 beurten_ worden verlengd.\n\n_+3:_ Het doden van een vijand met de geestboog verlengt de kracht van de natuur met _3 beurten_. De duur kan met maximaal _6 beurten_ worden verlengd.\n\n_+4:_ Het doden van een vijand met de geestboog verlengt de kracht van de natuur met _4 beurten_. De duur kan met maximaal _8 beurten_ worden verlengd.

actors.hero.talent.eagle_eye.title=arendsoog
actors.hero.talent.eagle_eye.desc=_+1:_ Het zichtbereik van de geesthavik vergroot van 6 naar _7 tegels_.\n\n_+2:_ Het zichtbereik van de geesthavik vergroot van 6 naar _8 tegels_.\n\n_+3:_ Het zichtbereik van de geesthavik vergroot van 6 naar _9 tegels_, en het krijgt _2 tegels_ geestzicht.\n\n_+4:_ Het zichtbereik van de geesthavik vergroot van 6 naar _10 tegels_, en het krijgt _3 tegels_ geestzicht.
actors.hero.talent.go_for_the_eyes.title=mik op de ogen
actors.hero.talent.go_for_the_eyes.desc=_+1:_ Aanvallen van de geesthavik verblinden vijanden voor _2 beurten_.\n\n_+2:_ Aanvallen van de geesthavik verblinden vijanden voor _5 beurten_.\n\n_+3:_ Aanvallen van de geesthavik verblinden vijanden voor _5 beurten_ en verlammen ze voor _2 beurten_.\n\n_+4:_ Aanvallen van de geesthavik verblinden vijanden voor _5 beurten_ en verlammen ze voor _5 beurten_.
actors.hero.talent.swift_spirit.title=vlotte geest
actors.hero.talent.swift_spirit.desc=_+1:_ De bewegingssnelheid van de geesthavik wordt verhoogd van 2 naar _2,5 tegels_, en hij ontwijkt gegarandeerd de eerste _2 aanvallen_ die op hem worden gedaan.\n\n_+2:_ De bewegingssnelheid van de geesthavik wordt verhoogd van 2 naar _3 tegels_, en hij ontwijkt gegarandeerd de eerste _4 aanvallen_ die op hem worden gedaan.\n\n_+3:_ De bewegingssnelheid van de geesthavik wordt verhoogd van 2 naar  _3,5 tegels_, en hij ontwijkt gegarandeerd de eerste _6 aanvallen_ die op hem worden gedaan.\n\n_+4:_De bewegingssnelheid van de geesthavik wordt verhoogd van 2 naar _4 tegels_, en hij ontwijkt gegarandeerd de eerste _8 aanvallen_ die op hem worden gedaan.

#duelist
actors.hero.talent.strengthening_meal.title=versterkende maaltijd
actors.hero.talent.strengthening_meal.desc=_+1:_ Het eten van voedsel geeft de Duellist 3 bonusschade de volgende _2 keer_ dat ze een vijand raakt met een fysieke aanval.\n\n_+2:_ Het eten van voedsel geeft de Duellist 3 bonusschade de volgende _3 keer_ dat ze een vijand raakt met een fysieke aanval.
actors.hero.talent.adventurers_intuition.title=intuïtie van de avonturier
actors.hero.talent.adventurers_intuition.desc=_+1:_ De Duellist identificeert wapens _2,5x sneller_ en harnassen _1,75x sneller_.\n\n_+2:_ De Duellist identificeert wapens _wanneer ze ze uitrust_ en harnassen _2,5x sneller_.
actors.hero.talent.patient_strike.title=geduldige slag
actors.hero.talent.patient_strike.desc=_+1:_ Als de Duellist wacht voordat ze een slagaanval uitvoert, brengt ze _1-2 bonusschade_ toe.\n\n_+2:_ Als de Duellist wacht voordat ze een slagaanval uitvoert, brengt ze _2 bonusschade_ toe.
actors.hero.talent.aggressive_barrier.title=agressieve barrière
actors.hero.talent.aggressive_barrier.desc=_+1:_ De Duellist krijgt _3 schilden_ wanneer ze een wapenvaardigheid gebruikt en minder dan 50% gezondheid heeft.\n\n_+2:_ De Duellist krijgt _5 schilden_ wanneer ze een wapenvaardigheid gebruikt en minder dan 50% gezondheid heeft.
actors.hero.talent.aggressive_barrier.meta_desc=_Als dit talent wordt verkregen door een andere held_, biedt het in plaats daarvan bescherming bij een slagaanval met een lage gezondheid, met een afkoelperiode van 50 beurten.

actors.hero.talent.focused_meal.title=gerichte maaltijd
actors.hero.talent.focused_meal.desc=_+1:_ Eten kost de Duellist 1 beurt en geeft haar _0,67 lading_ op haar wapens.\n\n_+2:_ Eten kost de Duellist 1 beurt en geeft haar _1 lading_ op haar wapens.
actors.hero.talent.focused_meal.meta_desc=_Als dit talent wordt verkregen door een andere held_, kent het in plaats daarvan bonusschade toe aan hun volgende treffer gelijk aan hun niveau gedeeld door 3 bij +1, of niveau gedeeld door 2 bij +2.
actors.hero.talent.liquid_agility.title=vloeibare behendigheid
actors.hero.talent.liquid_agility.desc=_+1:_ Wanneer de Duellist een drankje, brouwsel of elixer drinkt of gooit, heeft de Duellist _3x ontwijking_ en _3x nauwkeurigheid_ bij haar volgende melee-aanval binnen 5 beurten.\n\n_+2:_ Wanneer de Duellist een drankje, brouwsel of elixer drinkt of gooit, heeft de Duellist _oneindige ontwijking_ en _oneindige nauwkeurigheid_ bij haar volgende melee-aanval binnen 5 beurten.\n\nDeze ontwijkingsbonus duurt 1 extra beurt als je drankjes van kracht, ervaring, of alchemie-items gebruikt die met die drankjes gemaakt moeten worden..\n\nVoor alchemie items met hogere outputhoeveelheden (bijvoorbeeld aqua brew) heeft dit talent een kans om te activeren op basis van hoeveel van dat item er wordt geproduceerd.
actors.hero.talent.weapon_recharging.title=wapen opladen
actors.hero.talent.weapon_recharging.desc=_+1:_ De Duellist krijgt elke _15 beurten_ een wapenlading wanneer ze onder invloed is van toverstaf- of artefactoplaad verbeteringen.\n\n_+2:_ De Duellist krijgt elke _10 beurten_ een wapenlading wanneer ze onder invloed is van toverstaf- of artefactoplaad verbeteringen.
actors.hero.talent.weapon_recharging.meta_desc=_Als dit talent wordt verkregen door een andere held_, zal deze in plaats daarvan +5% slagschade aanrichten terwijl hij oplaadt met +1, of +7,5% slagschade aanrichten terwijl hij oplaadt met +2.
actors.hero.talent.lethal_haste.title=dodelijke haast
actors.hero.talent.lethal_haste.desc=_+1:_ Wanneer de Duellist een dodelijke slag toebrengt met een wapenvaardigheid, krijgt ze _3 beurten_ van directe beweging.\n\n_+2:_ Wanneer de Duellist een dodelijke slag toebrengt met een wapenvaardigheid, krijgt ze _5 beurten_ van directe beweging.
actors.hero.talent.lethal_haste.meta_desc=_Als dit talent wordt verkregen door een andere held_, wordt het in plaats daarvan geactiveerd met gewone wapenaanvallen, met een afkoelperiode van 100 beurten.
actors.hero.talent.swift_equip.title=snel uitrusten
actors.hero.talent.swift_equip.desc=_+1:_ De Duellist kan haar uitgeruste wapen direct _één keer_ per 20 beurten wisselen.\n\n_+2:_ De Duellist kan haar uitgeruste wapen direct _twee keer_ per 20 beurten wisselen.\n\nAls de Duellist dit talent heeft en het niet in de afkoelperiode staat, zal het snel gebruiken van een niet-uitgerust wapen het uitrusten.

actors.hero.talent.precise_assault.title=nauwkeurige aanval
actors.hero.talent.precise_assault.desc=_+1:_ Wanneer de duellist een wapenvaardigheid gebruikt, krijgt ze _2x nauwkeurigheid_ bij haar volgende slagaanval binnen 5 beurten.\n\n_+2:_ Wanneer de duellist een wapenvaardigheid gebruikt, krijgt ze _5x nauwkeurigheid_ bij haar volgende slagaanval binnen 5 beurten.\n\n_+3:_ Wanneer de duellist een wapenvaardigheid gebruikt, krijgt ze _oneindige nauwkeurigheid_ bij haar volgende slagaanval binnen 5 beurten.
actors.hero.talent.precise_assault.meta_desc=_Als dit talent door een andere held wordt verworven_ zal de algehele slag nauwkeurigheid met 10% bij +1, 20% bij +2 of 30% bij +3 toenemen.
actors.hero.talent.deadly_followup.title=dodelijke opvolging
actors.hero.talent.deadly_followup.desc=_+1:_ Wanneer de Duellist een vijand raakt met een werpwapen, brengt ze _10% meer slagschade_ aan hen toe gedurende 5 beurten.\n\n_+2:_ Wanneer de Duellist een vijand raakt met een werpwapen, brengt ze _20% meer slagschade_ aan hen toe gedurende 5 beurten.\n\n_+3:_ Wanneer de Duellist een vijand raakt met een werpwapen, brengt ze _30% meer slagschade_ aan hen toe gedurende 5 beurten.

actors.hero.talent.varied_charge.title=gevarieerde lading
actors.hero.talent.varied_charge.desc=_+1:_ De kampioen krijgt onmiddellijk _0,17 wapenladingen_ terug als ze twee verschillende wapenvaardigheden gebruikt, zonder tijdslimiet.\n\n_+2:_ De kampioen krijgt onmiddellijk _0,33 wapenladingen_ terug als ze twee verschillende wapenvaardigheden gebruikt, zonder tijdslimiet.\n\n_+3:_ De kampioen krijgt onmiddellijk _0,5 wapenladingen_ terug als ze twee verschillende wapenvaardigheden gebruikt, zonder tijdslimiet.
actors.hero.talent.twin_upgrades.title=dubbele opwaarderingen
actors.hero.talent.twin_upgrades.desc=_+1:_ Als een van de twee uitgeruste wapens van de Kampioen een lager niveau heeft en _2 of meer klassen lager_ is dan het andere wapen, wordt het verhoogd naar het niveau van het andere wapen.\n\n_+2:_ Als een van de twee uitgeruste wapens van de Kampioen een lager niveau heeft en _1 of meer klassen lager_ is dan het andere wapen, wordt het verhoogd naar het niveau van het andere wapen.\n\n_+3:_ Als een van de twee uitgeruste wapens van de Kampioen een lager niveau heeft en _dezelfde klasse of lager_ is dan het andere wapen, wordt het verhoogd naar het niveau van het andere wapen.
actors.hero.talent.combined_lethality.title=gecombineerde dodelijkheid
actors.hero.talent.combined_lethality.desc=_+1:_ Als de Kampioen aanvalt met een slagwapen onmiddellijk nadat ze de vaardigheid van een ander wapen heeft gebruikt, zal die aanval elke niet-baasvijand executeren die nog _minder dan 13% gezondheid_ heeft.\n\n_+2:_ Als de Kampioen aanvalt met een slagwapen onmiddellijk nadat ze de vaardigheid van een ander wapen heeft gebruikt, zal die aanval elke niet-baasvijand executeren die nog _minder dan 27% gezondheid_ heeft.\n\n_+3:_ Als de Kampioen aanvalt met een slagwapen onmiddellijk nadat ze de vaardigheid van een ander wapen heeft gebruikt, zal die aanval elke niet-baasvijand executeren die nog _minder dan 40% gezondheid_ heeft.\n\nDeze aanval kan een normale slagwapenaanval zijn, of onderdeel van een wapenvaardigheid.

actors.hero.talent.unencumbered_spirit.title=onbelaste geest
actors.hero.talent.unencumbered_spirit.desc=_+1:_ De Monnik krijgt _50% meer energie_ voor elk stuk uitrusting van _klasse 3 of lager_ dat ze gebruikt.\n\n_+2:_ De Monnik krijgt _75% meer energie_ voor elk stuk uitrusting van _klasse 2 of lager_ dat ze gebruikt. Het klasse 3-voordeel blijft onveranderd.\n\n_+3:_ De Monnik krijgt _100% meer energie_ voor elk stuk uitrusting van _klasse 1_ of lager dat ze gebruikt. De klasse 2 en 3-voordelen blijven onveranderd. Ook krijgt ze gratis stoffen kleren en handschoenen met spijkers.\n\nMerk op dat dit talent geen voordeel oplevert als je ongewapend bent of aanvalt met een Ring van Kracht.
actors.hero.talent.monastic_vigor.title=kloosterlijke daadkracht
actors.hero.talent.monastic_vigor.desc=_+1:_ Als de Monnik _100% energie_ heeft, zijn haar vaardigheden sterker.\n\n_+2:_ Als de Monnik _80% of meer energie_ heeft, zijn haar vaardigheden sterker.\n\n_+3:_ Als de Monnik heeft _60% of meer energie_ heeft, zijn haar vaardigheden sterker.\n\nAls ze sterker is:\n- Wind van slagen past betoveringen van je wapen toe.\n- Focus is onmiddellijk\n- Toerennen wint +4 bereik\n- Drakenschop brengt +50% schade toe en past het terugslag- en verdovingseffect toe op alle aangrenzende vijanden\n- Mediteren geneest langzaam 20% van ontbrekende gezondheid en verleent 80% schadeweerstand.
actors.hero.talent.combined_energy.title=gecombineerde energie
actors.hero.talent.combined_energy.desc=_+1:_ Als de Monnik een wapenvaardigheid en een _4+ energie_ vaardigheid binnen 5 beurten van elkaar gebruikt, krijgt ze 1 verbruikte energie terug.\n\n_+2:_ Als de Monnik een wapenvaardigheid en een _3+ energie_ vaardigheid binnen 5 beurten van elkaar gebruikt, krijgt ze 1 verbruikte energie terug.\n\n_+3:_ Als de Monnik een wapenvaardigheid en een _2+ energie_ vaardigheid binnen 5 beurten van elkaar gebruikt, krijgt ze 1 verbruikte energie terug.

actors.hero.talent.close_the_gap.title=sluit de kloof
actors.hero.talent.close_the_gap.desc=_+1:_ De Duellist snelt _maximaal twee tegels_ toe in de richting van haar doelwit wanneer ze een duel begint.\n\n_+2:_ De Duellist snelt _maximaal drie tegels_ toe in de richting van haar doelwit wanneer ze een duel begint.\n\n_+3: _ De Duellist snelt _maximaal vier tegels_ toe in de richting van haar doelwit bij het starten van een duel.\n\n_+4:_ De Duellist snelt _maximaal vijf tegels_ toe in de richting van haar doelwit bij het starten van een duel.\n\nDit toesnellen kan door gevaren en vijanden gaan, maar niet door vast terrein zoals muren. Met het toesnellen wordt rekening gehouden bij het bepalen of een vijand binnen bereik is om te worden uitgedaagd.
actors.hero.talent.invigorating_victory.title=verkwikkende overwinning
actors.hero.talent.invigorating_victory.desc=_+1:_ Als de Duellist haar doelwit verslaat voordat het duel eindigt, geneest ze voor _5 gezondheid plus 30% van de schade_ die ze opliep tijdens het duel.\n\n_+2:_ Als de Duellist haar doelwit verslaat voordat het duel eindigt, geneest ze voor _10 gezondheid plus 50% van de schade_ die ze opliep tijdens het duel.\n\n_+3:_ Als de Duellist haar doelwit verslaat voordat het duel eindigt, geneest ze voor _15 gezondheid plus 65% van de schade_ die ze opliep tijdens het duel.\n\n_+4:_ Als de Duellist haar doelwit verslaat voordat het duel eindigt, geneest ze voor _20 gezondheid plus 75% van de schade_ die ze opliep tijdens het duel.
actors.hero.talent.elimination_match.title=eliminatie wedstrijd
actors.hero.talent.elimination_match.desc=_+1:_ Als de Duellist opnieuw uitdaagt binnen 3 beurten na het einde van een duel, heeft die uitdaging _16% lagere_ kosten.\n\n_+2:_ Als de Duellist opnieuw uitdaagt binnen 3 beurten na het einde van een duel, heeft die uitdaging _30% lagere_ kosten.\n\n_+3:_ Als de Duellist opnieuw uitdaagt binnen 3 beurten na het einde van een duel, heeft die uitdaging _40% lagere_ kosten.\n\n_+4:_ Als de Duellist opnieuw uitdaagt binnen 3 beurten na het einde van een duel, heeft die uitdaging _50% lagere_ kosten.

actors.hero.talent.elemental_reach.title=elementair bereik
actors.hero.talent.elemental_reach.desc=_+1:_ Het bereik van de elementaire aanval is vergroot van 4 naar _5 tegels_, en de breedte is vergroot van 65 naar _75 graden_.\n\n_+2:_ Het bereik van de elementaire aanval is vergroot van 4 naar _6 tegels_, en de breedte is vergroot van 65 naar _85 graden_.\n\n_+3:_ Het bereik van de elementaire aanval is vergroot van 4 naar _7 tegels_, en de breedte is vergroot van 65 naar _95 graden_.\n\n_+4:_ Het bereik van de elementaire aanval is vergroot van 4 naar _8 tegels_, en de breedte is vergroot van 65 naar _105 graden_.
actors.hero.talent.striking_force.title=slagkracht
actors.hero.talent.striking_force.desc=_+1:_ De kracht van de elementaire aanval wordt verhoogd met _30%_.\n\n_+2:_ De kracht van de elementaire aanval wordt verhoogd met _60%_.\n\n_+3:_ De kracht van de elementaire aanval wordt verhoogd met _90%_.\n\n_+4:_ De kracht van de elementaire aanval wordt verhoogd met _120%_.
actors.hero.talent.directed_power.title=gerichte kracht
actors.hero.talent.directed_power.desc=_+1:_ De directe aanval van een elementaire aanval krijgt _+30% betoveringskracht_ voor elke vijand binnen het bereik van het elementaire aanvalseffect, inclusief het aanvalsdoel.\n\n_+2:_ De directe aanval van een elementaire aanval krijgt _+60% betoveringskracht_ voor elke vijand binnen het bereik van het effect van de elementaire aanval, inclusief het aanvalsdoel.\n\n_+3:_ De directe aanval van de elementaire aanval krijgt _+90% betoveringskracht_ voor elke vijand binnen het bereik van het effect van de elementaire aanval, inclusief het aanvalsdoel.\n\n_+4:_ De directe aanval van een elementaire aanval krijgt _+120% betoveringskracht_ voor elke vijand binnen het bereik van het elementaire aanvalseffect, inclusief het aanvalsdoel.

actors.hero.talent.feigned_retreat.title=geveinsde terugtocht
actors.hero.talent.feigned_retreat.desc=_+1:_ Als een vijand de inbeelding van de Duellist aanvalt, krijgt ze _2 beurten_ haast.\n\n_+2:_ Als een vijand de inbeelding van de Duellist aanvalt, krijgt ze _4 beurten_ haast.\n\n_+3: _ Als een vijand de inbeelding van de Duellist aanvalt, krijgt ze _6 beurten_ haast.\n\n_+4:_ Als een vijand de inbeelding van de Duellist aanvalt, krijgt ze _8 beurten_ haast.
actors.hero.talent.expose_weakness.title=zwakte blootleggen
actors.hero.talent.expose_weakness.desc=_+1:_ Vijanden die het nabeeld van de Duellist aanvallen, worden _2 beurten_ zwak en kwetsbaar.\n\n_+2:_ Vijanden die het nabeeld van de Duellist aanvallen, worden _4 beurten_ zwak en kwetsbaar.\n\n_+3:_ Vijanden die het nabeeld van de Duellist aanvallen, worden _6 beurten_ zwak en kwetsbaar.\n\n_+4:_ Vijanden die het nabeeld van de Duellist aanvallen, worden _8 beurten_ zwak en kwetsbaar.
actors.hero.talent.counter_ability.title=afweervermogen
actors.hero.talent.counter_ability.desc=_+1:_ Als de Duellist een wapenvaardigheid gebruikt binnen 3 beurten nadat haar inbeelding is aangevallen, verbruikt het _0,38 ladingen minder_.\n\n_+2:_ Als de Duellist een wapenvaardigheid gebruikt binnen 3 beurten na haar inbeelding is aangevallen, verbruikt het _0,77 lading minder_.\n\n_+3:_ Als de Duellist een wapenvaardigheid gebruikt binnen 3 beurten nadat haar inbeelding is aangevallen, verbruikt het _1,13 lading minder_.\n\n_+4 :_ Als de Duellist een wapenvaardigheid gebruikt binnen 3 beurten nadat haar inbeelding is aangevallen, verbruikt het _1,5 ladingen minder_.

#cleric
actors.hero.talent.satiated_spells.title=Verzadigde spreuken
actors.hero.talent.satiated_spells.desc=_+1:_ Het eten van voedsel zorgt ervoor dat de Geestelijke _3 bescherming_ krijgt de volgende keer dat hij een spreuk uitspreekt.\n\n_+2:_ Het eten van voedsel zorgt ervoor dat de Geestelijke _5 bescherming_ krijgt de volgende keer dat hij een spreuk uitspreekt.
actors.hero.talent.satiated_spells.meta_desc=_Als dit talent door een andere held wordt verkregen_ zal het in plaats daarvan onmiddellijk bescherming bieden, die normaal gesproken na 10 beurten begint te verslechteren.
actors.hero.talent.holy_intuition.title=heilige intuïtie
actors.hero.talent.holy_intuition.desc=_+1:_ De Geestelijke kan _Heilige Intuïtie_ uitspreken, een spreuk die onthult of een item vervloekt is tegen de kosten van _3 ladingen._\n\n_+2:_ De Geestelijke kan _Heilige Intuïtie_ uitspreken, een spreuk die onthult of een item vervloekt is tegen de kosten van _2 ladingen._
actors.hero.talent.holy_intuition.meta_desc=_Als dit talent door een andere held wordt verkregen_, kan de held de vloekstatus van een vervloekt voorwerp identificeren vlak voordat hij het uitrust. In 15% van de gevallen bij +1 en in 25% van de gevallen bij +2.
actors.hero.talent.searing_light.title=schroeiend licht
actors.hero.talent.searing_light.desc=_+1:_ De fysieke aanvallen van de Geestelijke op vijanden die verlicht worden door _Leidend Licht_ veroorzaken _+3 schade._ \n\n_+2:_ De fysieke aanvallen van de Geestelijke op vijanden die verlicht worden door _Leidend Licht_ veroorzaken _+5 schade._
actors.hero.talent.searing_light.meta_desc=_Als dit talent door een andere held is verkregen_, zal het in plaats daarvan bonusschade opleveren nadat een toverstaf of artefact op een vijand is gebruikt, met een afkoeltijd van 20 beurten.
actors.hero.talent.shield_of_light.title=schild van licht
actors.hero.talent.shield_of_light.desc=_+1:_ De Geestelijke kan _Schild van Licht_ uitspreken, een spreuk die onmiddellijk wordt uitgesproken en hem _2-4 bescherming_ verleent tegen een doelwit gedurende 5 beurten ten koste van 1 lading.\n\n_+2:_ De Geestelijke kan _Schild van Licht_ uitspreken, een spreuk die onmiddellijk wordt uitgesproken en hem _3-6 bescherming_ verleent tegen een doelwit gedurende 5 beurten ten koste van 1 lading.
actors.hero.talent.shield_of_light.meta_desc=_Als dit talent door een andere held wordt verkregen_, wordt de fysieke schade die je oploopt door je vijand met 1 verminderd, met 33% kans bij +1 en met 50% kans bij +2.

actors.hero.talent.enlightening_meal.title=Verzadigde maaltijd
actors.hero.talent.enlightening_meal.desc=_+1:_ Het eten van voedsel kost de Geestelijke 1 beurt en geeft hem _0,67 ladingen_ op zijn heilige boek.\n\n_+2:_ Het eten van voedsel kost de Geestelijke 1 beurt en geeft hem _1 lading_ op zijn heilige boek.
actors.hero.talent.enlightening_meal.meta_desc=_Als dit talent door een andere held wordt verkregen_, krijg je in plaats daarvan 2 beurten toverstaf en artefact oplading met +1, of 3 beurten met +2. Dit kan niet worden gebruikt om de hoorn van overvloed weer op te laden.
actors.hero.talent.recall_inscription.title=Inscriptie Herinneren
actors.hero.talent.recall_inscription.refunded=Je voorwerp is teruggegeven!
actors.hero.talent.recall_inscription.desc=_+1:_ De Geestelijke kan _Inscriptie Herinneren_ uitspreken, een spreuk waarmee ze het effect van de laatste runensteen of rol die ze gebruikten binnen _10 beurten_ kunnen herhalen.\n\n_+2:_ De Geestelijke kan _Inscriptie Herinneren_ uitspreken, een spreuk waarmee ze het effect van de laatste runensteen of rol die ze gebruikten binnen _300 beurten_ kunnen herhalen.\n\nInscriptie Herinneren kan niet worden gebruikt om rollen van opwaardering te repliceren. De kosten voor deze spreuk variëren afhankelijk van welk item recentelijk is gebruikt: 2 voor een runensteen, 3 voor een rol, 4 voor een exotische rol. Deze kosten wordt verdubbeld bij het lezen van een rol van transmutatie, of alchemie-items gebruikt die met transmutatie of opwaardering rollen moeten worden vervaardigd.
actors.hero.talent.recall_inscription.meta_desc=Als dit talent door een andere held wordt verkregen, wordt in plaats daarvan een rol of runensteen teruggegeven met 10% kans bij +1 of met 15% kans bij +2. Rollen van Opwaardering zijn vrijgesteld van dit effect.
actors.hero.talent.sunray.title=Zonnestraal
actors.hero.talent.sunray.desc=_+1:_ De Geestelijke kan _Zonnestraal_ uitspreken, een spreuk die _4-8 schade_ aanricht en het doelwit _4 beurten verblindt,_ ten koste van 1 lading.\n\n_+2:_ De Geestelijke kan _Zonnestraal_ uitspreken, een spreuk die _6-12 schade_ aanricht en het doelwit _6 beurten verblindt,_ ten koste van 1 lading.\n\nZonnestraal kan elk doelwit maar één keer verblinden, maar als het doelwit al verblind is door Zonnestraal, verlamt het in plaats daarvan. Zonnestraal brengt altijd maximale schade toe aan demonische en ondode vijanden.
actors.hero.talent.sunray.meta_desc=Als dit talent door een andere held wordt verkregen, zullen toverstokken en artefacten vijanden 4 beurten lang verblinden, met 15% kans bij +1 of 25% kans bij +2.
actors.hero.talent.divine_sense.title=Goddelijk Gevoel
actors.hero.talent.divine_sense.desc=_+1:_ De Geestelijke kan _Goddelijk Gevoel_ uitspreken, een spreuk die hem _8 tegels_ geestvisie geeft gedurende 50 beurten en geen beurt kost om uit te spreken, ten koste van 2 ladingen.\n\n_+2:_ De Geestelijke kan _Goddelijk Gevoel_ uitspreken, een spreuk die hem _12 tegels_ geestvisie geeft gedurende 50 beurten en geen beurt kost om uit te spreken, ten koste van 2 ladingen.
actors.hero.talent.divine_sense.meta_desc=Als dit talent door een andere held wordt verkregen, krijgt deze held voor een kort moment geestvisie nadat hij een toverstaf of artefact heeft gebruikt met een bereik van 3 tegels op +1 of 5 tegels op +2.
actors.hero.talent.bless.title=Zegen
actors.hero.talent.bless.desc=_+1:_ De Geestelijke kan _Zegen_ uitspreken, een spreuk die _6 beurten Zegen en 10 bescherming_ oplevert als hij op zichzelf wordt uitgeoefend, of _10 beurten Zegen en 10 bescherming_ als hij op een ander personage wordt uitgesproken, ten koste van 1 lading.\n\n_+2:_ De Geestelijke kan _Zegen_ uitspreken, een spreuk die _10 beurten Zegen en 15 bescherming_ oplevert als hij op zichzelf wordt uitgeoefend, of _15 beurten Zegen en 15 bescherming_ als hij op een ander personage wordt uitgesproken, ten koste van 1 lading.\n\nOvertollige genezing van deze spreuk wordt omgezet in bescherming.
actors.hero.talent.bless.meta_desc=_Als dit talent door een andere held wordt verkregen_ zal het de nauwkeurigheid en ontwijkingsmogelijkheden voor de held en alle bondgenoten verhogen met 3% bij +1 of 5% bij +2.

actors.hero.talent.cleanse.title=Reinig
actors.hero.talent.cleanse.desc=_+1:_ De Geestelijke kan _Reinig_ uitspreken, een spreuk die _negatieve statuseffecten verwijdert_ van de Geestelijke en eventuele bondgenoten in de buurt, en hen _10 bescherming verleent,_ ten koste van 2 ladingen.\n\n_+2:_ De Geestelijke kan _Reinig_ uitspreken, een spreuk die _3 beurten negatieve status immuniteit_ geeft aan de Geestelijke en eventuele bondgenoten in de buurt, en hen _20 bescherming verleent,_ ten koste van 2 ladingen.\n\n_+3:_ De Geestelijke kan _Reinig_ uitspreken, een spreuk die _5 beurten negatieve status immuniteit_ geeft aan de Geestelijke en eventuele bondgenoten in de buurt, en hen _30 bescherming verleent,_ ten koste van 2 ladingen
actors.hero.talent.cleanse.meta_desc=_Als dit talent door een andere held wordt verkregen_ zal het in plaats daarvan negatieve statuseffecten op de held zuiveren na het gebruik van een toverstaf of artefact, met 10/20/30% kans bij +1/+2/+3.
actors.hero.talent.light_reading.title=Licht Lezen
actors.hero.talent.light_reading.desc=_+1:_ De Geestelijke kan zijn heilig boek gebruiken als het niet is uitgerust, maar het laadt op met _25% snelheid_ als het niet is uitgerust.\n\n_+2:_ De Geestelijke kan zijn heilig boek gebruiken als het niet is uitgerust, maar het laadt op met _50% snelheid_ als het niet is uitgerust.\n\n_+3:_ De Geestelijke kan zijn heilig boek gebruiken als het niet is uitgerust, maar het laadt op met _75% snelheid_ als het niet is uitgerust.
actors.hero.talent.light_reading.meta_desc=Als dit talent door een andere held wordt verkregen, zal de oplaadsnelheid van alle toverstokken met 7/13/20% toenemen bij +1/+2/+3.

actors.hero.talent.holy_lance.title=Heilig Lans
actors.hero.talent.holy_lance.desc=_+1:_ De Priester kan _Heilig Lans_ uitspreken, een verwoestende spreuk die _30-55 schade_ toebrengt ten koste van 4 ladingen.\n\n_+2:_ De Priester kan _Heilig Lans_ uitspreken, een verwoestende spreuk die _45-83 schade_ toebrengt ten koste van 4 ladingen.\n\n_+3:_ De Priester kan _Heilig Lans_ uitspreken, een verwoestende spreuk die _60-110 schade_ toebrengt ten koste van 4 ladingen.\n\nHeilig Lans brengt altijd maximale schade toe aan demonische en ondode vijanden. Heilig Lans heeft een afkoeltijd van 30 beurten voordat hij opnieuw kan worden gebruikt.
actors.hero.talent.hallowed_ground.title=Gewijde Grond
actors.hero.talent.hallowed_ground.desc=_+1:_ De Priester kan _Gewijde Grond_ uitspreken, een spreuk die terrein in een _3x3 gebied_ wijdt voor 20 beurten, tegen de kosten van 2 ladingen.\n\n_+2:_ De Priester kan _Gewijde Grond_ uitspreken, een spreuk die terrein in een _5x5 gebied_ wijdt voor 20 beurten, tegen de kosten van 2 ladingen.\n\n_+3:_ De Priester kan _Gewijde Grond_ uitspreken, een spreuk die terrein in een _7x7 gebied_ wijdt voor 20 beurten, tegen de kosten van 2 ladingen.\n\nWanneer het wordt uitgesproken, geneest Gewijde Grond bondgenoten voor 15 gezondheid, wortelt vijanden kortstondig en verspreidt kort gras. Daarna geneest het bondgenoten langzaam, verlamt vijanden en zorgt het ervoor dat hoog gras willekeurig groeit. Gewijde Grond geeft de Priester bescherming in plaats van genezing en wordt vernietigd door vuur.
actors.hero.talent.mnemonic_prayer.title=Mnemonisch Gebed
actors.hero.talent.mnemonic_prayer.desc=_+1:_ De Priester kan _Mnemonisch Gebed_ uitspreken, een spreuk die verbeteringen/verzwakkingen voor een bondgenoot/vijand _3 beurten_ uitbreidt ten kosten van 1 lading.\n\n_+2:_ De Priester kan _Mnemonisch Gebed_ uitspreken, een spreuk die verbeteringen/verzwakkingen voor een bondgenoot/vijand _4 beurten_ uitbreidt ten kosten van 1 lading.\n\n_+3:_ De Priester kan _Mnemonisch Gebed_ uitspreken, een spreuk die verbeteringen/verzwakkingen voor een bondgenoot/vijand _5 beurten_ uitbreidt ten kosten van 1 lading.\n\nMnemonisch Gebed kost geen beurt om uit te spreken. Mnemonisch gebed kan slechts één keer een specifieke instantie van een verbetering of verzwakkingen verlengen, en kan geen verbetering verlengen die zijn verleend door pantservaardigheden.

actors.hero.talent.lay_on_hands.title=handoplegging
actors.hero.talent.lay_on_hands.desc=_+1:_ De Paladijn kan _Handoplegging_ uitspreken, een spreuk die onmiddellijk een personage in de buurt geneest voor _15 gezondheid,_ of de Paladijn _15 bescherming verleent,_ ten koste van 1 lading.\n\n_+2:_ De Paladijn kan _Handoplegging_ uitspreken, een spreuk die een personage in de buurt onmiddellijk geneest voor _20 gezondheid,_ of de Paladijn _20 bescherming verleent,_ ten koste van 1 lading.\n\n_+3:_ De Paladijn kan _Handoplegging_ uitspreken, een spreuk die onmiddellijk een personage in de buurt geneest voor _25 gezondheid,_ of de Paladijn _25 bescherming verleent,_ ten koste van 1 lading.\n\nOvermatige genezing door deze spreuk wordt omgezet in bescherming . Handoplegging kan herhaaldelijk worden uitgevoerd, maar kan niet meer dan drie keer bescherming tegelijkertijd toepassen.
actors.hero.talent.aura_of_protection.title=aura van bescherming
actors.hero.talent.aura_of_protection.desc=_+1:_ De Paladijn kan _Aura van Bescherming_ uitspreken, een spreuk die de Paladijn en alle bondgenoten binnen 2 tegels _20% schadeweerstand_ en het effect van het pantsersymbool van de Paladijn _+50% kracht_ geeft gedurende 20 beurten, ten koste van 2 ladingen.\n\n_+2:_ De Paladijn kan _Aura van Bescherming_ uitspreken, een spreuk die de Paladijn en alle bondgenoten binnen 2 tegels _30% schadeweerstand_ en het effect van het pantsersymbool van de Paladijn _+75% kracht_ geeft gedurende 20 beurten, ten koste van 2 ladingen.\n\n_+3:_ De Paladijn kan _Aura van Bescherming_ uitspreken, een spreuk die de Paladijn en alle bondgenoten binnen 2 tegels _40% schadeweerstand_ geeft en het effect van het pantsersymbool van de Paladijn _+100% kracht_ geeft gedurende 20 beurten, ten koste van 2 ladingen.
actors.hero.talent.wall_of_light.title=muur van licht
actors.hero.talent.wall_of_light.desc=_+1:_ De Paladijn kan _Muur van Licht_ uitspreken, een spreuk die een stevige muur van _3 tegels breed_ voor de Paladijn creëert die vijanden wegduwt en 20 beurten duurt, ten koste van 3 ladingen.\n\n_+2:_ De Paladijn kan _Muur van Licht_ uitspreken, een spreuk die een stevige muur van _5 tegels breed_ voor de Paladijn creëert die vijanden wegduwt en die 20 beurten meegaat, ten koste van 3 ladingen.\n\n_+3:_ De Paladijn kan _Muur van Licht_ uitspreken, een spreuk die een stevige muur van _7 tegels breed_ voor de Paladijn creëert die vijanden wegduwt en 20 beurten meegaat, ten koste van 3 ladingen.\n\nDe muur kan recht of diagonaal worden geplaatst, er kan maar één muur tegelijk bestaan.

actors.hero.talent.divine_intervention.title=goddelijke interventie
actors.hero.talent.divine_intervention.desc=_+1:_ Terwijl hij in Hogere Vorm is, kan de Geestelijke _Goddelijke Interventie_ uitspreken, wat de Geestelijke en alle bondgenoten tot _150 bescherming_ verhoogt en Hogere Vorm met _3 beurten_ verlengt.\n\n_+2:_ Terwijl hij in Hogere Vorm is, kan de Geestelijke _Goddelijke Interventie_ uitspreken, wat de Geestelijke en alle bondgenoten tot _200 bescherming_ verhoogt en Hogere Vorm met _4 beurten_ verlengt.\n\n_+3:_ Terwijl hij in Hogere Vorm is, kan de Geestelijke _Goddelijke Interventie_ uitspreken, wat de Geestelijke en alle bondgenoten tot _250 bescherming_ verhoogt en Hogere Vorm met _5 beurten_ verlengt.\n\n_+4:_ Terwijl hij in Hogere Vorm is, kan de Geestelijke _Goddelijke Interventie_ uitspreken, wat de Geestelijke en alle bondgenoten tot _300 bescherming_ verhoogt en Hogere Vorm met _6 beurten verlengt.\n\nGoddelijke Interventie kost maar liefst 5 boekladingen, en kan maar één keer in dezelfde hogere vorm worden uitgesproken.
actors.hero.talent.judgement.title=oordeel
actors.hero.talent.judgement.desc=_+1:_ Terwijl hij in Hogere Vorm is, kan de Geestelijke _Oordeel_ uitspreken, wat _10-20 schade_ toebrengt aan alle zichtbare vijanden.\n\n_+2:_ Terwijl hij in Hogere Vorm is, kan de Geestelijke _Oordeel_ uitspreken, wat _15-30 schade_ toebrengt aan alle zichtbare vijanden.\n\n_+3:_ Terwijl hij in Hogere Vorm is, kan de Geestelijke _Oordeel_ uitspreken, wat _20-40 schade_ toebrengt aan alle zichtbare vijanden.\n\n_+4:_ Terwijl hij in Hogere Vorm is, kan de Geestelijke _Oordeel_ uitspreken, wat _25-50 schade_ toebrengt aan alle zichtbare vijanden.\n\nOordeel kost 3 boekladingen. Oordeel richt +33% schade aan voor elke spreuk die de Geestelijke heeft uitgesproken sinds hij in de Hogere Vorm is gekomen of sinds de laatste uitspraak van Oordeel.
actors.hero.talent.flash.title=flits
actors.hero.talent.flash.desc=_+1:_ Terwijl hij in Hogere Vorm is, kan de Geestelijke _Flits_ uitspreken om tot _3 tegels_ weg te teleporteren.\n\n_+2:_ Terwijl hij in Hogere Vorm is, kan de Geestelijke _Flits_ uitspreken om tot _4 tegels_ weg te teleporteren.\n\n_+3:_ Terwijl hij in Hogere Vorm is, kan de Geestelijke _Flits_ uitspreken om tot _5 tegels_ weg te teleporteren.\n\n_+4:_ Terwijl hij in Hogere Vorm is, kan de Geestelijke _Flits_ uitspreken om tot _6 tegels_ weg te teleporteren.\n\nFlits kost in eerste instantie 2 boeklading en 1 extra lading voor elk gebruik in dezelfde hogere vorm.

actors.hero.talent.body_form.title=lichaamsvorm
actors.hero.talent.body_form.desc=De Geestelijke kan _Lichaamsvorm_ uitspreken, wat Drie-eenheid de kracht geeft van een betovering of symbool die de Geestelijke deze verkenning heeft geïdentificeerd, ten kosten van 2 ladingen.\n\n_+1:_ Wanneer Drie-eenheid wordt gebruikt, krijgt de Geestelijke het gekozen effect voor _20 beurten._\n\n_+2:_ Wanneer Drie-eenheid wordt gebruikt, krijgt de Geestelijke het gekozen effect voor _27 beurten._\n\n_+3:_ Wanneer Drie-eenheid wordt gebruikt, krijgt de Geestelijke het gekozen effect voor _33 beurten._\n\n_+4:_ Wanneer Drie-eenheid wordt gebruikt, krijgt de Geestelijke het gekozen effect voor _40 beurten._\n\nDrie-eenheid kan maar met één lichaam effect tegelijk worden doordrenkt. De kosten van de pantserlading van Drie-eenheid zijn hoger als het gekozen symbool zeldzaam en krachtig is.
actors.hero.talent.mind_form.title=verstandsvorm
actors.hero.talent.mind_form.desc=De Geestelijke kan _Verstandsvorm_ gebruiken, waardoor Drie-eenheid de kracht krijgt van een toverstok of werpwapen dat de Geestelijke tijdens deze verkenning heeft gebruikt, ten koste van 3 ladingen.\n\n_+1:_ Wanneer Drie-eenheid wordt gebruikt, gebruikt de Geestelijke het schiet- of werpeffect van het gekozen item, alsof het _+3._ was.\n\n_+2:_ Wanneer Drie-eenheid wordt gebruikt, gebruikt de Geestelijke het schiet- of werpeffect van het gekozen item, alsof het _+4._ was.\n\n_+3:_ Wanneer Drie-eenheid wordt gebruikt, gebruikt de Geestelijke het schiet- of werpeffect van het gekozen item, alsof het _+5._ was.\n\n_+4:_ Wanneer Drie-eenheid wordt gebruikt, gebruikt de Geestelijke het schiet- of werpeffect van het gekozen item, alsof het _+6._ was.\n\nDrie-eenheid kan maar met één verstandsvorm tegelijk worden doordrenkt.
actors.hero.talent.spirit_form.title=geestvorm
actors.hero.talent.spirit_form.desc=De Geestelijke kan _Geestvorm_ gebruiken, waardoor Drie-eenheid de kracht krijgt van een ring of artefact dat de Geestelijke deze verkenning heeft geïdentificeerd (behalve het heilig boek), ten koste van 4 ladingen.\n\n_+1:_ Wanneer Drie-eenheid wordt gebruikt, krijgt de Geestelijke een ringeffect op _+1_ voor 20 beurten, of activeert een artefacteffect op _+4._\n\n_+2:_ Wanneer Drie-eenheid wordt gebruikt, krijgt de Geestelijke een ringeffect op _+2_ voor 20 beurten, of activeert een artefacteffect op _+6._\n\n_+3:_ Wanneer Drie-eenheid wordt gebruikt, krijgt de Geestelijke een ringeffect op _+3_ voor 20 beurten, of activeert een artefacteffect op _+8._\n\n_+4:_ Wanneer Drie-eenheid wordt gebruikt, krijgt de Geestelijke een ringeffect op _+4_ voor 20 beurten, of activeert een artefacteffect op _+10._\n\nDrie-eenheid kan maar met één geestvorm tegelijk worden doordrenkt. Artefacten hebben verschillende effecten en kosten voor pantserladingen wanneer ze worden geactiveerd door Drie-eenheid.

actors.hero.talent.beaming_ray.title=stralende straal
actors.hero.talent.beaming_ray.desc=De Geestelijke kan _Stralende Straal_ uitspreken vanaf een gemachtigde bondgenoot ten koste van 1 lading. Deze straal kan door muren heen gaan en de bondgenoot teleporteren naar een gerichte locatie. Als er een vijand op die locatie is, verschijnt de bondgenoot naast de vijand en zal deze als doelwit kiezen. Stralende Straal kan zelfs normaal gesproken immobiele bondgenoten teleporteren, maar heeft dan een half bereik.\n\n_+1:_ Stralende Straal heeft een maximaal bereik van _4 tegels_ en verhoogt de bonus van Kracht van Velen tot _+35% schade_ tegen de dichtstbijzijnde vijand gedurende 10 beurten.\n\n_+2:_ Stralende Straal heeft een maximaal bereik van _8 tegels_ en verhoogt de bonus van Kracht van Velen tot _+40% schade_ tegen de dichtstbijzijnde vijand gedurende 10 beurten.\n\n_+3:_ Stralende Straal heeft een maximaal bereik van _12 tegels_ en verhoogt de bonus van Kracht van Velen tot _+45% schade_ tegen de dichtstbijzijnde vijand gedurende 10 beurten.\n\n_+4:_ Stralende Straal heeft een maximaal bereik van _16 tegels_ en verhoogt de bonus van Kracht van Velen tot _+50% schade_ tegen de dichtstbijzijnde vijand gedurende 10 beurten.
actors.hero.talent.life_link.title=levenslink
actors.hero.talent.life_link.desc=De Geestelijke kan _Levenslink_ tussen zichzelf en een versterkte bondgenoot uitspreken ten koste van 2 ladingen. Deze spreuk zorgt ervoor dat de schade wordt verdeeld tussen de Geestelijke en zijn bondgenoot, en zorgt ervoor dat gunstige Geestelijke spreuken van niveau 3 of lager op beide van toepassing zijn als een van beide wordt beïnvloed.\n\n_+1:_ Levenslink duurt _10 beurten_ en verhoogt de bonus van Kracht van Velen tot _-35% schade die is opgelopen._\n\n_+2:_ Levenslink duurt _13 beurten_ en verhoogt de bonus van Kracht van Velen tot _-40% schade die is opgelopen._\n\n_+3:_ Levenslink duurt _17 beurten_ en verhoogt de bonus van Kracht van Velen tot _-45% schade die is opgelopen._\n\n_+4:_ Levenslink duurt _20 beurten_ en verhoogt de bonus van Kracht van Velen tot _-50% schade die is opgelopen._
actors.hero.talent.stasis.title=Stasis
actors.hero.talent.stasis.desc=De Geestelijke kan _Stasis_ uitspreken op een versterkte bondgenoot voor de kosten van 2 ladingen. Stasis verwijdert tijdelijk de bondgenoot uit de kerker en behoudt de resterende tijd voor alle verbeteringen, inclusief Kracht van Velen De bondgenoot verschijnt weer naast je wanneer het effect eindigt. Stasis kan direct en zonder kosten opnieuw worden uitgesproken om het effect vroegtijdig te beëindigen. Stasis werkt op onbeweeglijke bondgenoten, maar kan ze niet verplaatsen tussen kerkerverdiepingen.\n\n_+1:_ Stasis duurt maximaal _60 beurten._\n\n_+2:_ Stasis duurt maximaal _90 beurten._\n\n_+3:_ Stasis duurt maximaal _120 beurten._\n\n_+4:_ Stasis duurt maximaal _150 beurten._\n\nDe Geestelijke kan ook Stralende Straal uitspreken wanneer een bondgenoot in stasis is om hem opnieuw op te roepen, of Levenslink uitspreken om het effect preventief toe te passen. Bondgenoten profiteren echter niet van Levenslink terwijl ze in stasis zijn.


#universal
actors.hero.talent.heroic_energy.title=heldhaftige energie
actors.hero.talent.heroic_energy.rat_title=rathaftige energie
actors.hero.talent.heroic_energy.desc=_+1:_ De harnas-eigenschap van de held heeft _12% lagere_ oplaadkosten.\n\n_+2:_ De harnas-eigenschap van de held heeft _23% lagere_ oplaadkosten.\n\n_+3:_ De harnas-eigenschap van de held heeft _32% lagere_ oplaadkosten.\n\n_+4:_ De harnas-eigenschap van de held heeft _40% lagere_ oplaadkosten

actors.hero.talent.ratsistance.title=ratsistentie
actors.hero.talent.ratsistance.desc=_+1:_ Vijandige, geratformeerde vijanden brengen _-10% schade_ aan.\n\n_+2:_ Vijandige, geratformeerde vijanden brengen _-19% schade aan_.\n\n_+3:_ Vijandige, geratformeerde vijanden richten _-27% schade aan_.\n\n_+4:_ Vijandige, geratformeerde vijanden brengen _-35% schade_ aan.
actors.hero.talent.ratlomacy.title=ratlomaat
actors.hero.talent.ratlomacy.desc=_+1:_ Ratformatie gebruiken op een geratformeerde vijand maakt ze vriendelijk en maakt de transformatie permanent.\n\n_+2:_ Ratformatie gebruiken op een geratformeerde vijand maakt ze vriendelijk, maakt de transformatie permanent en geeft ze _2 beurten_ adrenaline.\n\n_+3:_ Ratformatie gebruiken op een geratformeerde vijand maakt ze vriendelijk, maakt de transformatie permanent en geeft ze _4 beurten_ adrenaline.\n\n_+4:_ Ratformatie gebruiken op een geratformeerde vijand maakt ze vriendelijk, maakt de transformatie permanent en geeft ze _6 beurten_ adrenaline.
actors.hero.talent.ratforcements.title=ratsterkingen
actors.hero.talent.ratforcements.desc=_+1:_ Ratformatie op jezelf gebruiken _roept 1_ bondgenoot buidelrat naast je op.\n\n_+2:_ Ratformatie op jezelf gebruiken _roept 2_ bondgenoot buidelratten naast je op.\n\n_+3:_ Ratformatie op jezelf gebruiken _roept 3_ bondgenoot buidelratten naast je op.\n\n_+4:_ Ratformatie op jezelf gebruiken _roept 4_ bondgenoot buidelratten naast je op.



###npcs
actors.mobs.npcs.blacksmith.name=trollensmid
actors.mobs.npcs.blacksmith.intro_quest_warrior=Hé mens! Je ziet eruit als een stoere.
actors.mobs.npcs.blacksmith.intro_quest_mage=Hé mens! Je ziet eruit als een slimme.
actors.mobs.npcs.blacksmith.intro_quest_rogue=Hé mens! Je ziet eruit als een stiekeme.
actors.mobs.npcs.blacksmith.intro_quest_huntress=Hé mens! Je ziet eruit als een snelle.
actors.mobs.npcs.blacksmith.intro_quest_duelist=Hé mens! Je ziet eruit als een dappere.
actors.mobs.npcs.blacksmith.intro_quest_cleric=Hé mens! Je ziet eruit als een belangrijke.
actors.mobs.npcs.blacksmith.intro_quest_start=Je wilt nuttig zijn, hè? Ja, ik heb iets wat je kunt doen. Ik heb deze werkplaats bovenop een oude mijn gebouwd, net onder de ladder. Neem deze houweel en mijn erts van donker goud. 40 stuks zou voldoende moeten zijn. Het gesteente is lekker zacht, dus _je zult met enige moeite door de muren heen kunnen mijnen._\n\nHoe bedoel je, hoe moet ik betalen? Jij hebberige...\n\nOké, oké, ik kan wat smeedwerk voor je doen. Beschouw jezelf als een geluksvogel, ik ben de enige smid in de buurt.
actors.mobs.npcs.blacksmith.intro_quest_crystal=Maar pas op, de mijn is gevaarlijk voor een klein mens als jij. Het staat er al een tijdje verlaten bij en er beginnen een hoop kristallen te groeien. Ze zijn glanzend, maar te kwetsbaar om iets waard te zijn, en ze hebben een aantal magische dingen die ze beschermen. Ze zijn behoorlijk sterk, dus wees voorzichtig waar je mijnt, anders trek je hun aandacht.\n\nEr is ook ergens een gigantisch kristal. Het is een stuk moeilijker, dus wees voorbereid op een gevecht als je het begint te breken. Ik durf te wedden dat als je het verbrijzelt, de groei van de kristallen zal vertragen, dus ik betaal extra als je het kunt doen.
actors.mobs.npcs.blacksmith.intro_quest_gnoll=Maar pas op, de mijn is gevaarlijk voor een klein mens als jij. Sommige gnollen willen het goud ook en nu vernielen ze de boel. Het zijn domme wezens, dus hun mijnbouw heeft allerlei soorten instortingen veroorzaakt. Je zult er doorheen moeten mijnen, dus _zoek naar recentelijk verstoord gesteente._\n\nIk denk dat één van de gnollen de meeste problemen veroorzaakt, waarschijnlijk een waarzegger-sjamaan of zoiets. Ik betaal extra als je hem kunt vinden en doden, maar ik weet zeker dat hij terug zal vechten.
actors.mobs.npcs.blacksmith.intro_quest_fungi=Maar pas op, de mijn is gevaarlijk voor een klein mens als jij. Er groeit daar een soort schimmelmonster. Er zijn paddenstoelwachters die heel dodelijk zijn als ze je zien, maar ze kunnen tenminste niet opstaan en je achtervolgen. _Blijf uit het zicht_ als je in leven wilt blijven.\n\nIk betaal extra als het je lukt om de grootste paddenstoel neer te halen, maar het zal wel wat moeite kosten. Het is verbonden met een aantal myceliumknooppunten die verborgen zijn in de muren. Je zult de meeste ervan moeten breken voordat je het echt kunt beschadigen.
actors.mobs.npcs.blacksmith.reminder=Ben je klaar met het verspillen van mijn tijd? De ingang van de mijn is daar.
actors.mobs.npcs.blacksmith.reminder_crystal=Breng me zoveel mogelijk goud en probeer ook het grote kristal te breken.
actors.mobs.npcs.blacksmith.reminder_gnoll=Breng me zoveel mogelijk goud en probeer ook waarzeggergnol te doden.
actors.mobs.npcs.blacksmith.reminder_fungi=Breng me zoveel mogelijk goud en probeer ook de gigantische paddenstoel te doden.
actors.mobs.npcs.blacksmith.lost_pick=Houd je me voor de gek? Waar is mijn pikhouweel?!
actors.mobs.npcs.blacksmith.quest_start_prompt=Ben je klaar om naar beneden te gaan? Zorg ervoor dat je wat vrije ruimte hebt voor het goud.\n\n_Ik laat je maar één keer naar beneden gaan!_
actors.mobs.npcs.blacksmith.enter_yes=Ik ben klaar
actors.mobs.npcs.blacksmith.enter_no=Nog niet
actors.mobs.npcs.blacksmith.exit_warn_none=Ben je al klaar? Je hebt nauwelijks goud! Je zou _40 stuks._ moeten kunnen krijgen\n\n_Denk eraan, ik laat je niet meer binnen als je eenmaal boven bent._
actors.mobs.npcs.blacksmith.exit_warn_low=Ben je al klaar? Het lijkt er niet op dat je veel goud hebt. Je zou _40 stuks._ moeten kunnen krijgen\n\n_Denk eraan, ik laat je niet meer binnen als je eenmaal boven bent._
actors.mobs.npcs.blacksmith.exit_warn_med=Ben je klaar? Je hebt tenminste wat goud, maar er zit beslist meer in de mijn. Je zou _40 stuks._ moeten kunnen krijgen\n\n_Denk eraan, ik laat je niet meer binnen als je eenmaal boven bent._
actors.mobs.npcs.blacksmith.exit_warn_high=Ben je klaar? Het lijkt erop dat je een flinke hoeveelheid goud hebt, maar ik kan wel wat meer gebruiken. Je zou _40 stuks._ moeten kunnen krijgen\n\n_Denk eraan, ik laat je niet meer binnen als je eenmaal boven bent._
actors.mobs.npcs.blacksmith.exit_warn_full=Ben je klaar? Je hebt veel goud, maar zorg ervoor dat je niets van je uitrusting achterlaat.\n\n_Denk eraan, ik laat je niet meer binnen als je eenmaal boven bent._
actors.mobs.npcs.blacksmith.exit_warn_crystal=Dat gigantische kristal ligt daar ook nog steeds. Ik betaal extra als je het vernietigt.
actors.mobs.npcs.blacksmith.exit_warn_gnoll=Die waarzeggergnol is daar ook nog steeds. Ik betaal extra als je hem doodt.
actors.mobs.npcs.blacksmith.exit_warn_fungi=Die gigantische paddenstoel is daar ook nog steeds. Ik betaal extra als je hem doodt.
actors.mobs.npcs.blacksmith.exit_yes=Ik ben klaar
actors.mobs.npcs.blacksmith.exit_no=Nog niet
actors.mobs.npcs.blacksmith.get_lost=Ik ben druk. Verdwijn!
actors.mobs.npcs.blacksmith.entrance_blocked=De weg naar beneden is geblokkeerd.
actors.mobs.npcs.blacksmith.cant_enter_old=Dat gebied is nu niet toegankelijk. Speel een nieuw spel om de nieuwe missie te proberen!
actors.mobs.npcs.blacksmith.def_verb=geblokkeerd
actors.mobs.npcs.blacksmith.desc=Deze trollensmid lijkt op hoe alle trollen eruit zien: hij is lang en slank, en zijn huid lijkt op steen in kleur en textuur. De trollensmid is aan het sleutelen met onevenredig kleine gereedschappen.

actors.mobs.npcs.ghost.name=droevige geest
actors.mobs.npcs.ghost.rat_1=Hallo %s... Eens was ik net zoals jou - sterk en zelfverzekerd... Maar ik ben gedood door een vals beest... Ik kan deze plek niet verlaten... Niet totdat ik mijn wraak heb genomen... Dood de _stinkende rat,_ die mijn leven heeft genomen...\n\nHet sluipt rond op deze etage... Overal viezigheid aan het verspreiden... _Pas op voor zijn wolk van stank en bijtende beet, het zuur lost op in water..._
actors.mobs.npcs.ghost.rat_2=Alsjeblieft... Help me... Dood de gruwel...\n\n_Vecht met het in de buurt van water... Vermijd de stank..._
actors.mobs.npcs.ghost.gnoll_1=Hallo %s... Eens was ik net zoals jou - sterk en zelfverzekerd... Maar ik ben gedood door een sluwe vijand... Ik kan deze plek niet verlaten... Niet totdat ik mijn wraak heb genomen... Dood de _bedriegergnol,_ die mijn leven heeft genomen...\n\nHet is niet als andere gnollen... Het verstopt zich en gebruikt werpwapens... _Pas op voor zijn giftige en brandstichtende pijltjes, val niet aan van een afstand..._
actors.mobs.npcs.ghost.gnoll_2=Alsjeblieft... Help me.... Dood de bedrieger...\n\n_Laat het je niet raken... Kom er dichtbij..._
actors.mobs.npcs.ghost.crab_1=Hallo %s... Eens was ik net zoals jou - sterk en zelfverzekerd... Maar ik ben gedood door een oud beest... Ik kan deze plek niet verlaten... Niet totdat ik mijn wraak heb genomen... Dood de _grote krab,_ die mijn leven heeft genomen...\n\nHij is onnatuurlijk oud... Met een enorme enkele klauw en een dikke schaal... _Pas op voor zijn klauw, alleen met een verrassingsaanval kan je de krab raken, anders blokt hij de aanval..._
actors.mobs.npcs.ghost.crab_2=Alsjeblieft... Help me... Dood het Schaaldier...\n\n_Het blokkeert altijd... Als hij je aan ziet komen..._
actors.mobs.npcs.ghost.find_me=Dank je... vind me...
actors.mobs.npcs.ghost.desc=De geest is nauwelijks zichtbaar. Het lijkt op een vormloze vlek van zwak licht met een jammerlijk gezicht.

actors.mobs.npcs.imp.name=ambitieuze kobold
actors.mobs.npcs.imp.intro=Ben je een avonturier? Ik houd van avonturiers! Je kan altijd op ze rekenen als je iets gedood wil hebben. Niet waar? Voor een beloning, uiteraard ;)
actors.mobs.npcs.imp.golems_1=In mijn geval moeten _golems_ gedood worden. Zie je, ik ga hier een klein bedrijfje beginnen, en deze stomme golems zijn slecht voor de zaken! Het is erg lastig om te onderhandelen met deze hompen van graniet, vervloek ze! Dus alsjeblieft, dood... laten we zeggen _4 van hen_ en de beloning is van jou.
actors.mobs.npcs.imp.monks_1=In mijn geval moeten _monniken_ gedood worden. Zie je, ik ga hier een klein bedrijfje beginnen, en deze krankzinnigen kopen niks en jagen andere klanten weg. Dus alsjeblieft, dood... laten we zeggen _5 van hen_ en de beloning is van jou.
actors.mobs.npcs.imp.golems_2=Hoe gaat het met je golem safari? Vergeet niet die munten op te pakken.
actors.mobs.npcs.imp.monks_2=Oh, je leeft nog! Ik wist dat jouw kung-fu sterker was ;) Vergeet niet om die munten op te pakken.
actors.mobs.npcs.imp.cya=Tot ziens, %s!
actors.mobs.npcs.imp.hey=Psst, %s!
actors.mobs.npcs.imp.desc=Kobolds zijn mindere demonen. Ze zijn niet opmerkelijk voor hun kracht of magische talent, maar ze zijn aardig slim en sociaal. Veel imps leven liever tussen niet-demonen.

actors.mobs.npcs.impshopkeeper.name=ambitieuze kobold
actors.mobs.npcs.impshopkeeper.greetings=Hallo, %s!
actors.mobs.npcs.impshopkeeper.greetings_ascent=Wat heb je gedaan %s? Winkel snel, ik moet hier weg!
actors.mobs.npcs.impshopkeeper.thief=Ik wist dat ik je kon vertrouwen!
actors.mobs.npcs.impshopkeeper.buyback=De kobold geeft vrolijk je item terug.
actors.mobs.npcs.impshopkeeper.desc=De kobold heeft een winkeltje opgezet op de grens van de binnenhallen. Het is leuk om een vriendelijk gezicht te zien, maar zijn prijzen lijken zeker niet vriendelijk.

actors.mobs.npcs.mirrorimage.name=spiegelbeeld
actors.mobs.npcs.mirrorimage.desc=Deze illusie lijkt sterk op jou en lijkt zelfs je huidige wapen en harnas te hanteren.\n\nSpiegelbeelden zoeken en vallen vijanden aan met hun nagebootste wapen, dat zich hetzelfde gedraagt als dat van jou, maar minder schade aanricht. Ze beginnen bijna onzichtbaar, maar moeten een vorm aannemen die gemakkelijker te zien is om aan te vallen.\n\nHoewel hun offensieve kracht krachtig kan zijn, zijn spiegelbeelden niet duurzaam en beginnen te vervagen zodra ze schade oplopen.
actors.mobs.npcs.mirrorimage.discover_hint=Je kunt dit personage vinden met een specifieke rol.

actors.mobs.npcs.npc.discover_hint=Je kunt dit personage vinden in een specifieke regio van de kerker.

actors.mobs.npcs.prismaticimage.name=prismatisch beeld
actors.mobs.npcs.prismaticimage.desc=Deze schitterende illusie lijkt sterk op jou en lijkt zelfs uitgerust met je huidige wapen en harnas.\n\nPrismatische afbeeldingen proberen de aandacht van vijanden te zoeken en te trekken, waarbij ze hun verbeterde verdediging en gezondheid gebruiken om je te beschermen. Hoewel ze niet dezelfde aanvalskracht hebben als spiegelbeelden, hebben ze een verbeterde duurzaamheid, inclusief voordelen van je harnas.\n\nWanneer hun gezondheid is teruggelopen tot 0 gezondheid, vervagen prismatische beelden over meerdere beurten en kunnen gedurende deze tijd nog steeds worden genezen. Als er geen vijanden aanwezig zijn, vervagen prismatische beelden en voegen zich weer bij hun meester.
actors.mobs.npcs.prismaticimage.discover_hint=Je kunt dit personage vinden met een specifieke rol.

actors.mobs.npcs.ratking.name=rattenkoning
actors.mobs.npcs.ratking.not_sleeping=Ik ben niet aan het slapen!
actors.mobs.npcs.ratking.what_is_it=Wat is dit? Ik heb geen tijd voor deze onzin. Mijn koninkrijk regeert zich niet vanzelf!!
actors.mobs.npcs.ratking.confused=Wa.. Waar ben ik? Mijn koninkrijk heeft mij nodig!
actors.mobs.npcs.ratking.crown_clothes=Trek wat kleren aan! Zo kun je jezelf niet tonen aan een vorst!
actors.mobs.npcs.ratking.crown_desc=Ooeh, is die kroon voor mij!? Hij schitter veel mooier dan die van mij, dus ik neem hem genadig aan!\n\nSterker nog, ik denk dat ik je wel een mooie belonging kan geven voor deze kroon. Een enorme kracht die past bij een held als jij! Zou je dat willen?
actors.mobs.npcs.ratking.crown_yes=Maar natuurlijk!
actors.mobs.npcs.ratking.crown_info=Vertel me eerst meer.
actors.mobs.npcs.ratking.crown_no=Liever niet...
actors.mobs.npcs.ratking.crown_thankyou=Hehehe, bedankt! Ga nu maar en maak je koning trots!
actors.mobs.npcs.ratking.crown_fine=Prima! Ik wilde 'm toch al niet...
actors.mobs.npcs.ratking.crown_after=Aan het genieten van je nieuwe harnas? Hij is niet te in te ruilen!
actors.mobs.npcs.ratking.desc_crown=Deze rat is iets groter dan een gewone buidelvormige rat. Het draagt de kroon van de dwergen koning op diens hoofd.
actors.mobs.npcs.ratking.desc_birthday=Deze rat is iets groter dan een gewone buidelvormige rat. Het draagt een kleine groene feesthoed in plaats van z'n gewoonlijke kroon. Gelukkige verjaardag Rattenkoning
actors.mobs.npcs.ratking.desc_winter=Deze rat is iets groter dan een gewone buidelvormige rat. Het draagt een kleine feesthoed in plaats van diens gebruikelijke kroon. Fijne Feestdagen!
actors.mobs.npcs.ratking.desc=Deze rat is iets groter dan een gewone buidelvormige rat. Het draagt een kleine kroon op diens hoofd.
actors.mobs.npcs.ratking.discover_hint=Je kunt dit personage vinden aan het einde van een specifieke regio van de kerker.

actors.mobs.npcs.sheep.name=schaap
actors.mobs.npcs.sheep.baa!=Mèèh!
actors.mobs.npcs.sheep.baa?=Mèèh?
actors.mobs.npcs.sheep.baa.=Mèèh.
actors.mobs.npcs.sheep.baa...=Mèèh...
actors.mobs.npcs.sheep.def_verb=geblokkeerd
actors.mobs.npcs.sheep.desc=Dit is een magisch schaap. Waarom het magisch is? Je kan het niet doden. Het schaap staat daar totdat het op een magische wijze vervaagt, al die tijd herkauwend met een lege blik.
actors.mobs.npcs.sheep.discover_hint=Je kunt dit personage vinden met een specifieke val of item.

actors.mobs.npcs.shopkeeper.name=winkelier
actors.mobs.npcs.shopkeeper.thief=Dief, Dief!
actors.mobs.npcs.shopkeeper.warn=Kijk uit! Ik zal je niet nog een keer waarschuwen.
actors.mobs.npcs.shopkeeper.flee=De winkelier vlucht!
actors.mobs.npcs.shopkeeper.sell=Verkoop een voorwerp
actors.mobs.npcs.shopkeeper.talk=Praten
actors.mobs.npcs.shopkeeper.buyback=De winkelier geeft je artikel met tegenzin terug.
actors.mobs.npcs.shopkeeper.talk_prison_intro=Ik heb alles wat je nodig hebt voor een geslaagd avontuur!
actors.mobs.npcs.shopkeeper.talk_prison_warrior=Dat is een interessant zegel dat je daar hebt, ze zijn meestal heel. Ben jij een in ongenade gevallen held of zoiets? Wat je ook hebt gedaan, het zijn mijn zaken niet, je munten zijn nog steeds goed.
actors.mobs.npcs.shopkeeper.talk_prison_mage=Hehe, ik denk dat ik ergens in de stad een gezocht-poster heb gezien met jouw naam erop. Zijn we op de vlucht? Oh, je bent onschuldig, hè? Natuurlijk, natuurlijk... Maak je geen zorgen, ik heb betere dingen te doen dan over je te rapporteren, maar misschien moet je voor de zekerheid iets kopen?
actors.mobs.npcs.shopkeeper.talk_prison_rogue=Ben jij van het dievengilde gekomen om het gebied te ontruimen? Nee, gewoon shoppen? Dood hoe dan ook een paar monsters terwijl je hier bent. Verwacht ook geen korting, ik betaal jullie goed beschermingsgeld en jullie houden mij hier nauwelijks veilig.
actors.mobs.npcs.shopkeeper.talk_prison_huntress=Je lijkt uit je element te zijn, mevrouw. Strakke kerkergangen zijn niet zo ruim als grote hallen of de bossen rondom de stad, toch? Hehe, oh let niet op mijn gepraat, waarom koop je niet iets?
actors.mobs.npcs.shopkeeper.talk_prison_duelist=Als het niet de reizende held is! Als je een andere stad probeert te redden, veel succes, de gevaren zijn hier veel erger dan die van kleine bandietenbendes. Ik weet zeker dat je het beter zult doen dan wie dan ook, maar probeer niet vlak voor mijn winkel dood te gaan.
actors.mobs.npcs.shopkeeper.talk_prison_cleric=Nou hallo daar Uwe Hoogheid, of is het nu Uwe Heiligheid? Hehe, hoe dan ook, dit is geen plek voor u, veel mensen zouden behoorlijk overstuur zijn als u dood zou gaan. U hebt vast wel wat munten, waarom koopt u niet iets om dat te voorkomen?
actors.mobs.npcs.shopkeeper.talk_caves=Geef geld uit, leef langer.\n\nOh en doe de groeten aan die Trollensmid als je hem ziet. Herinner de lobbes eraan dat hij me nog steeds geld schuldig is voor de hamer die ik hem vorige week verkocht heb!
actors.mobs.npcs.shopkeeper.talk_city=Mijn spullen kunnen je hier beneden veilig houden. \n\n...En blijf niet rondhangen als je wilt. Het duurde een eeuwigheid voordat de lokale bevolking mij met rust liet. Ik wil niet dat je problemen aantrekt!
actors.mobs.npcs.shopkeeper.talk_halls=Hallo daar, ik heb speciale prijzen voor demonenjagers!\n\nOh en wees voorzichtig daar beneden! Het maakt de demonen hieronder niet uit hoe moedig je bent. Je kunt niet terugkomen en meer geld uitgeven als je dood bent! ;)\n\nZijn de demonen zoals ik? Hehe, helemaal niet. Ik ben maar een kleine kerel, niet echt een vechter, en ik ben erin geslaagd mijn geest intact te houden. De onderstaande demonen zijn veel sterkere wezens, en ze zijn allemaal tot slaaf gemaakt door... nou... wees voorzichtig daar beneden.
actors.mobs.npcs.shopkeeper.talk_ascent=Ik weet niet wat je van plan bent met dat amulet, maar ik wil er niets mee te maken hebben. Koop iets en ga verder, we moeten allebei deze plek verlaten!
actors.mobs.npcs.shopkeeper.desc=Deze stevige kerel lijkt meer te passen in een handelswijk in een of andere grote stad in plaats van een kerker. Zijn prijzen verklaren waarom hij hier het liefst zaken doet.

actors.mobs.npcs.wandmaker.name=oude toverstokmaker
actors.mobs.npcs.wandmaker.intro_warrior=Oh, hallo! Wat een aangename verrassing om een krijger uit het noorden te ontmoeten op zo'n deprimerende plek! Je moet nogal ver gereisd hebben om hier te komen. Als je op zoek bent naar avontuur, heb ik misschien een taak voor je.
actors.mobs.npcs.wandmaker.intro_rogue=Oh goedheid, je liet me schrikken! Ik ben nog geen bandiet tegengekomen in deze plek die nog steeds bij zijn verstand is, dus je moet wel van het oppervlakte komen! Als je een vreemdeling wil helpen, heb ik misschien een taak voor je.
actors.mobs.npcs.wandmaker.intro_mage=Oh, hallo %s! Ik hoorde dat dat er enige opschudding was tussen jou en het tovenaarsinstituut? Ach, laat maar, ik heb die treuzelaars nooit leuk gevonden. Als je wilt, heb ik wel een taak voor je.
actors.mobs.npcs.wandmaker.intro_huntress=Oh, hallo mevrouw! Een vriendelijk gezicht is een fijne verrassing hier beneden, niet? Sterker nog, ik zweer dat ik je gezicht eerder heb gezien, maar ik kan mijn vinger er niet op leggen... Laat maar, als je hier bent voor een avontuur heb ik misschien een taak voor je.
actors.mobs.npcs.wandmaker.intro_duelist=Oh, hallo juffrouw! Wat een aangename verrassing om een held te ontmoeten op zo'n deprimerende plek! Als je zin hebt om een oude man te helpen, heb ik misschien een taak voor je.
actors.mobs.npcs.wandmaker.intro_cleric=Oh, hallo Uwe Hoogheid! Wat een aangename verrassing om u te ontmoeten op zo'n deprimerende plek! Ik wil u niet lastig vallen, maar ik heb misschien een taak voor u.
actors.mobs.npcs.wandmaker.intro_1=\n\nIk ben hier gekomen om een zeldzaam ingrediënt voor een toverstok te vinden, maar ik ben verdwaald geraakt en mijn magische bescherming wordt zwakker. Ik moet binnenkort vertrekken, maar ik kan het niet uitstaan om te gaan zonder te krijgen waarvoor ik kwam.
actors.mobs.npcs.wandmaker.intro_dust=Ik zoek wat _lijkstof._ Het is een speciaal soort vervloekt beendermeel dat voorkomt op dit soort plekken. Er zou hier ergens een gebarricadeerde kamer moeten zijn, ik ben er zeker van dat het beendermeel daar aanwezig is. Wees echter voorzichtig, de vloek die het stof met zich meebrengt is behoorlijk krachtig, _kom zo snel mogelijk bij me terug_ en ik hef de vloek voor je op.
actors.mobs.npcs.wandmaker.intro_ember=Ik zoek naar wat _verse sintels_ van een pasgeboren elementair. Elementairs verschijnen bij een oproepingsritueel dat niet onder controle is, dus vind gewoon wat kaarsen en een ruimte voor een ritueel en je weet er vast wel eentje op te roepen. Je moet _voorkomen dat je jezelf insluit_ terwijl je het bevecht, of je wilt misschien wel een of ander _bevriezend voorwerp_ gebruiken. Pasgeboren elementairs zijn erg krachtig en chaotisch, maar ze kunnen slecht tegen kou.
actors.mobs.npcs.wandmaker.intro_berry=De oude directeur van de gevangenis hield een _rotbes-plant,_ en ik ben naar één van zijn zaden op zoek. De plant is nu waarschijnlijk verwilderd, dat maakt het lastig om er een zaadje uit te halen. De tuin moet ergens hier in de buurt zijn. Probeer _weg te blijven van zijn wingerd sjorders_ als je in één stuk wilt blijven. Het gebruik van vuur kan verleidelijk zijn maar doe dit alsjeblieft niet, dan dood je de plant en vernietig je zijn zaden.
actors.mobs.npcs.wandmaker.intro_2=\n\nAls je dat voor me kan vinden, betaal ik je met genoegen met een van mijn goed gemaakte toverstokken! Ik heb er twee meegenomen, dus je kan naar je eigen believen kiezen.
actors.mobs.npcs.wandmaker.reminder_dust=Enig succes met het lijkstof, %s? Zoek naar een gebarricadeerde kamer.
actors.mobs.npcs.wandmaker.reminder_ember=Lukt het met die sintels, %s? Je hebt 4 kaarsen en een ritueelruimte nodig.
actors.mobs.npcs.wandmaker.reminder_berry=Heb je al succes gehad met een zaadje van de Rotbes, %s? Zoek naar een kamer gevuld met begroeiing.
actors.mobs.npcs.wandmaker.def_verb=geblokkeerd
actors.mobs.npcs.wandmaker.desc=Deze oude maar toch gezonde heer heeft een enigszins verwarde uitdrukking. Hij wordt beschermd door een magisch schild.



###mobs
actors.mobs.acidic.name=giftige schorpioen
actors.mobs.acidic.desc=Deze gigantische spinachtige demonische wezens vermijden vechten van dichtbij, en hebben voorkeur om verlammende gekartelde stekels af te vuren van een lange afstand. Deze lijkt te druipen met corrosieve slijk.

actors.mobs.albino.name=albino rat
actors.mobs.albino.desc=Dit is een zeldzaam ras van de buidelvormige rat, met puur witte vacht en gekartelde tanden.
actors.mobs.albino.discover_hint=Je kunt deze vijand zelden vinden in een specifieke regio van de kerker.

actors.mobs.armoredstatue.name=bepantserd standbeeld
actors.mobs.armoredstatue.desc=Je zou denken dat dit weer een van de levenloze standbeelden in deze kerker is, maar de rood gloeiende ogen van deze verraden het.\n\nHet lijkt erop dat hij in een goede conditie verkeert door het harnas dat hij draagt, het kan heel moeilijk zijn om het te doden.
actors.mobs.armoredstatue.desc_arm_wep=Terwijl het standbeeld van steen is gemaakt lijkt de  _%1$s_ en _%2$s_ die het gebruikt echt.

actors.mobs.bandit.name=krankzinnige bandiet
actors.mobs.bandit.desc=Een elitedief, die zich onderscheidt door zijn weelderige paarse gewaad. Ondanks zijn grotere vaardigheid, zijn ze net zo hersenloos geworden als gewone dieven.\n\nNaast het van je stelen, zullen gestoorde bandieten je kortstondig verblinden, verlammen en vergiftigen! Het is echter veel waarschijnlijker dat ze extra buit bij zich hebben dan een gewone dief.

actors.mobs.bat.name=vampiervleermuis
actors.mobs.bat.desc=Deze levendige en vasthoudende inwoners van de grotten zijn veel gevaarlijker dan ze lijken. Ze herstellen hun gezondheid met elke succesvolle aanval, waardoor ze veel sterkere vijanden kunnen verslaan.

actors.mobs.bee.name=gouden bij
actors.mobs.bee.desc_honey=Ondanks hun kleine grootte hebben gouden bijen de neiging om hun thuis fel te verdedigen. Deze is gekalmeerd, en lijkt je te willen volgen.
actors.mobs.bee.desc=Ondanks hun kleine grootte hebben gouden bijen de neiging om hun thuis fel te verdedigen. Deze is erg kwaad, houd maar beter afstand.
actors.mobs.bee.discover_hint=Je kunt dit personage vinden met een specifiek item.

actors.mobs.brute.name=gnolbruut
actors.mobs.brute.enraged=woedend
actors.mobs.brute.def_verb=geblokkeerd
actors.mobs.brute.desc=Bruten zijn de grootste, sterkste en taaiste van alle gnollen. Wanneer ze dodelijk gewond zijn draaien ze door, waardoor ze een tijdelijk schild krijgen en een grote bonus in schade.
actors.mobs.brute$bruterage.name=brute woede
actors.mobs.brute$bruterage.desc=Deze gnol bruut is aan het sterven, maar wil je meenemen in zijn dood!\n\nDe bruut gaat dood gaan als zijn schild is afgenomen, door tijd of door schade. Ondertussen doet hij ontiegelijk veel schade, dus kijk uit!\n\nSchild over: %d.

actors.mobs.causticslime.name=bijtend slijm
actors.mobs.causticslime.desc=Dit slijm lijkt besmet te zijn door de duistere magie die van beneden komt. Het heeft zijn gebruikelijke groene kleur verloren en druipt van de bijtende slijk.
actors.mobs.causticslime.discover_hint=Je kunt deze vijand zelden vinden in een specifieke regio van de kerker.

actors.mobs.crab.name=rioolkrab
actors.mobs.crab.desc=Deze grote krabben staan aan de top van de voedselketen in het riool. Ze zijn extreem snel en hun dikke rugschild kan hevige klappen weerstaan.

actors.mobs.crystalguardian.name=kristallen bewaker
actors.mobs.crystalguardian.def_verb=geblokkeerd
actors.mobs.crystalguardian.desc=Deze grote kristallijne bewakers zien er bijna uit als standbeelden, ware het niet dat ze helder gloeiende ogen hebben. Het geharde kristal waaruit ze zijn gemaakt, zorgt ervoor dat ze traag maar erg sterk zijn, dus _het is het beste om ze zo lang mogelijk in hun kristallen nest te laten slapen._\n\nVanwege hun formaat zullen kristalbewakers veel langzamer bewegen in besloten ruimtes. Ze zijn ook zo duurzaam dat het onmogelijk is om ze te doden. Ze kunnen worden neergeslagen en tijdelijk uitgeschakeld, maar na een tijdje komen ze weer overeind.
actors.mobs.crystalguardian.discover_hint=Je kunt deze vijand vinden tijdens een specifieke missie.

actors.mobs.crystalmimic.name=kristallen nabootser
actors.mobs.crystalmimic.ate=De nabootser at je %s!
actors.mobs.crystalmimic.escaped=De kristallen nabootser is ontsnapt!
actors.mobs.crystalmimic.desc=Nabootsers zijn magische wezens die elke vorm aan kunnen nemen die ze willen. In kerkers kiezen ze bijna altijd de vorm van een schatkist, om nietsvermoedende avonturiers aan te trekken. \n\nKristallen nabootsers zijn lastiger dan hun normale neven, en proberen gevechten te vermijden terwijl ze buit stelen. Ze proberen weg te rennen wanneer ze zijn ontdekt, en hebben het vermogen om vijanden te verplaatsen wanneer zij aanvallen.

actors.mobs.crystalspire.name=Kristallen spits
actors.mobs.crystalspire.warning=Het kristal trilt als je erop slaat. Als je hiermee doorgaat, trek je ongetwijfeld de aandacht...
actors.mobs.crystalspire.alert=De trillingen groeien en rommelen door de hele grot!
actors.mobs.crystalspire.desc=Deze gigantische spits van ultrahard kristal is waarschijnlijk de bron van alle vreemde kristalwezens in deze grot. Je gewone wapens zijn er niet effectief tegen, dus je zult je houweel moeten gebruiken als je hem wilt vernietigen.\n\n_Zorg ervoor dat je voorbereid bent voordat je het gaat breken._ Het zal waarschijnlijk een tijdje duren voordat zo'n groot kristal is uitgegraven, en je zult dit waarschijnlijk niet ongestoord kunnen doen. De spits zelf kan zelfs een manier hebben om zichzelf te verdedigen. _Misschien kunnen de eigen aanvallen van de spits tegen zijn handlangers worden gebruikt._
actors.mobs.crystalspire.discover_hint=Je kunt deze vijand vinden tijdens een specifieke missie.

actors.mobs.crystalwisp.name=kristallen dwaallicht
actors.mobs.crystalwisp.beam_kill=De lichtstraal heeft je gedood...
actors.mobs.crystalwisp.desc=Een klein, boos, zwevend brok gehard kristal dat een heldere gloed produceert. Hoewel ze niet bijzonder sterk zijn, schieten kristallen dwaallichten een schadelijke lichtstraal naar je toe als ze een duidelijk schot hebben.\n\nDwaallichten zijn klein genoeg om gemakkelijk door de verschillende kristallen uitstulpingen te bewegen, maar ze kunnen er niet doorheen schieten.
actors.mobs.crystalwisp.discover_hint=Je kunt deze vijand vinden tijdens een specifieke missie.

actors.mobs.demonspawner.name=demonenoproeper
actors.mobs.demonspawner.on_death=De demonische energie lijkt te verminderen bij het doodgaan van de oproeper.
actors.mobs.demonspawner.desc=De bedriegende amalgamatie van dwergenvlees is verantwoordelijk voor het creëren van ripperdemonen van dwergen die zijn gestorven in deze regio. Het is duidelijk dat demonen geen probleem hebben met elke het gebruiken van alle middelen die ze tegen hun vijand kunnen toepassen.\n\nHoewel ze er verschrikkelijk uitzien, hebben demonenoproepers geen manier van bewegen of zichzelf verdedigen. Hun aanzienlijke gewicht zorgt dat ze lastig te doden zijn, en ze roepen ripperdemonen sneller op wanneer ze bedreigd worden.\n\n_Demonenoproepers lijken verbonden met een gecentreerde demonische bron van kracht. Ze doden kan die verzwakken._

actors.mobs.dm100.name=DM-100
actors.mobs.dm100.zap_kill=De bliksemschicht doodde je...
actors.mobs.dm100.desc=DM-100 is een vroeg model van de "defensieve machine" die dwergen ontwierpen om dwergmijnwerkers in de grotten onder deze gevangenis te beschermen. Hun electrische schokken bleken te zwak, dus ze werden geschonken aan de mensengevangenis erboven. Ze bleven jarenlang ongebruikt en vonden uiteindelijk hun weg naar de gevangenis, waar de directeur ze aanvankelijk te wreed vond om te gebruiken. Naarmate de gevangenen echter niet meer waren te beheersen, werden ze een noodzaak.

actors.mobs.dm200.name=DM-200
actors.mobs.dm200.vent=De DM-200 vuurt een straal van giftige uitlaatgassen af!
actors.mobs.dm200.desc=De DM-200 is de tweede generatie van de "defensieve machine" die dwergen ontwierpen om dwergmijnwerkers in de grotten en de stad eronder te beschermen. Ze zijn veel groter en omvangrijker dan hun voorgangers, en vallen aan met verwoestende hydraulische vuisten.\n\nHun toegenomen grootte is ook gelijk hun primaire zwakte, omdat ze daardoor niet door dunne passages en deuren kunnen gaan. De dwergen konden het gebrek aan bewegelijkheid van de DM-200 compenseren met het afvuren van giftige uitlaatgassen op verre vijanden, of op vijanden waar ze niet bij kunnen.

actors.mobs.dm201.name=DM-201
actors.mobs.dm201.vent=De DM-201 gooit een bijtende gasgranaat!
actors.mobs.dm201.desc=De dwergen hebben kort geëxperimenteerd en maakten een aantal DM modellen die volledig stationair zijn. De DM-201 is een omgebouwde DM-200 die werkt als een schildwachttoren en niet kan bewegen. In ruil voor het gebrek aan mobiliteit zijn de DM-201s vele malen duurzamer en hebben meer aanvalskracht.\n\nOmdat DM-201s geen motor hebben om gassen mee af te vuren hebben de dwergen ze in plaats daarvan uitgerust met bijtende gasgranaten! DM-201's zijn echter voorzichtig met deze granaten en gooien ze alleen als ze van een afstand worden aangevallen.

actors.mobs.dm300.name=DM-300
actors.mobs.dm300.notice=ONGEAUTORISEERD PERSONEEL GEDETECTEERD!
actors.mobs.dm300.shield=DM-300 haalt stroom uit de blootliggende draden en maakt een schild voor zichzelf!
actors.mobs.dm300.charging=SCHADE AAN HET ONTVANGEN! HOOGSPANNINGSMAST AAN HET ACTIVEREN!
actors.mobs.dm300.charging_hint=DM-300 is onkwetsbaar terwijl die wordt gevoed door een hoogspanningsmast!
actors.mobs.dm300.supercharged=VERNIETIG! VERNIETIG! VERNIETIG!
actors.mobs.dm300.charge_lost=MAST VERNIETIGD! TERUGKEER OP LOKALE KRACHT!
actors.mobs.dm300.pylons_destroyed=ALARM! ONSTABILITEIT GEDETECTEERD IN HET KRACHTVELD!
actors.mobs.dm300.rankings_desc=Verpletterd door de DM-300
actors.mobs.dm300.def_verb=geblokkeerd
actors.mobs.dm300.defeated=KRITISCHE SCHADE! PROBEREN AF TE SLUI-
actors.mobs.dm300.desc=De DM-300 is de grootste en meest krachtigste "defensieve machine" die de dwergen ooit hebben gebouwd. Zo'n geweldige machine is lastig te produceren, dus hebben de dwergen er maar een paar van gemaakt om de ingangen van hun ondergrondse metropolis te beschermen.\n\nDe DM-300 is uitgerust met ventilatieopeningen om giftige uitlaatgassen mee af te vuren en een zeer krachtige boor die gebruikt kan worden om zowel mee aan te vallen als om de aarde mee uiteen te rukken. DM-300 kan ook verbinden met een krachtveld, wat diens krachten verder versterkt.
actors.mobs.dm300.desc_supercharged=De DM-300 is momenteel volledig opgeladen met elektrische energie. In deze vorm kan de DM-300 niet beschadigd worden en beweegt met dubbele snelheid! Bovendien draait de boor nu snel genoeg om door _vast gesteente te tunnelen,_ hoewel hij veel langzamer beweegt wanneer hij dit doet.\n\nDe DM-300 rechtstreeks aanvallen is zinloos zolang hij is opgeladen, maar _iets in de omgeving moet hem van deze energie voorzien,_ als dit wordt vernietigd wordt hij mogelijk zwakker.

actors.mobs.dwarfking.name=Koning van Dwergen
actors.mobs.dwarfking.notice=Hoe durf je! Je hebt geen idee waar je je mee bemoeit!
actors.mobs.dwarfking.lifelink_1=Ik heb je levenskracht nodig, slaaf!
actors.mobs.dwarfking.lifelink_2=Bloed voor mij, slaaf!
actors.mobs.dwarfking.teleport_1=Reken met ze af, slaaf!
actors.mobs.dwarfking.teleport_2=Houd ze bezig, slaaf!
actors.mobs.dwarfking.wave_1=Genoeg! Sta op, mijn slaven!
actors.mobs.dwarfking.wave_2=Meer! Bloed voor je koning!
actors.mobs.dwarfking.wave_3=Nutteloos! VERMOORD ZE NU!
actors.mobs.dwarfking.enraged=Je kan me niet doden, %s. IK. BEN. ONSTERFELIJK!
actors.mobs.dwarfking.losing=Nee! Dit kan je niet doen... je hebt geen idee wat hier beneden is...
actors.mobs.dwarfking.defeated=Je hebt... Ons allen verdoemd...
actors.mobs.dwarfking.rankings_desc=Gestorven door de Koning van Dwergen
actors.mobs.dwarfking.desc=Vele jaren geleden ontdekte een van de hoogste tovenaars in het dwergenhof geheimen die hem enorme krachten gaven over leven en dood. Hij maakte al snel gebruik van deze krachten om zijn gelijken, zijn koning en uiteindelijk elke dwerginwoner te onderwerpen en te corrumperen. Nu is hij koning, heerser over een legioen ondode onderdanen.\n\nDe Koning van Dwergen is een agressieve vijand, die probeert zijn tegenstanders te omsingelen en te overweldigen met zijn horde van ondode volgelingen.
actors.mobs.dwarfking$dkghoul.rankings_desc=Gestorven door de Koning van Dwergen
actors.mobs.dwarfking$dkmonk.rankings_desc=Gestorven door de Koning van Dwergen
actors.mobs.dwarfking$dkwarlock.rankings_desc=Gestorven door de Koning van Dwergen
actors.mobs.dwarfking$dkgolem.rankings_desc=Gestorven door de Koning van de Dwergen

actors.mobs.ebonymimic.name=ebbenhouten nabootser
actors.mobs.ebonymimic.reveal=Daar was een nabootser!
actors.mobs.ebonymimic.hidden_name=verdachte contouren
actors.mobs.ebonymimic.hidden_desc=Er lijkt hier iets te zijn, maar het is bijna volledig transparant.
actors.mobs.ebonymimic.desc=Nabootsers zijn magische wezens die elke gewenste vorm kunnen aannemen. In kerkers kiezen ze bijna altijd voor de vorm van een schatkist, om nietsvermoedende avonturiers te lokken.\n\nEbbenhouten nabootsers zijn onopvallende nabootsers met het vermogen zichzelf bijna onzichtbaar te maken. Ze loeren op dingen waar avonturiers waarschijnlijk mee te maken zullen krijgen, maar bevatten ook hun eigen buit. Ze zijn niet sterker dan een gewone nabootsers als ze eenmaal ontdekt zijn, maar hun verrassende beet is verwoestend.
actors.mobs.ebonymimic.discover_hint=Je kunt deze vijand met een specifieke snuisterij vinden.

actors.mobs.elemental$fireelemental.name=vuur elementair
actors.mobs.elemental$fireelemental.desc=Elementairs zijn chaotische wezens die vaak gecreëerd worden wanneer krachtige geheime magie niet goed onder controle wordt gehouden. Elementairs hebben minimale intelligentie, en zijn meestal gekoppeld met een bepaald type magie.\n\nVuur elementairs zijn een alledaags type elementair die schade aanbrengen met vurige magie. Ze zetten hun tegenstanders in vlam bij slagaanvallen, en vuren ook af en toe schichten van vuur af.
actors.mobs.elemental$newbornfireelemental.name=pasgeboren vuur elementair
actors.mobs.elemental$newbornfireelemental.charging=Het elementair laadt zich op!
actors.mobs.elemental$newbornfireelemental.desc=Elementairs zijn chaotische wezens die vaak ontstaan wanneer krachtige occulte magie niet goed onder controle wordt gehouden. Elementairs hebben een minimale intelligentie en worden meestal geassocieerd met een bepaald soort magie.\n\nDit vuur elementair is pas opgeroepen, maar evenmin behoorlijk gevaarlijk!
actors.mobs.elemental$newbornfireelemental.desc_boss=Vanwege de chaotische aard van zijn oproeping kan dit elementair pas nadat het een beurt opgeladen heeft vuur verspreiden met onnauwkeurige schoten.
actors.mobs.elemental$newbornfireelemental.desc_ally=Omdat dit elementair door een spreuk is opgeroepen, heeft het iets meer controle over zijn vlam. Het is niet in staat om afstandsaanvallen uit te voeren, maar zal vijanden die het van dichtbij aanvalt in vuur en vlam zetten.
actors.mobs.elemental$newbornfireelemental.discover_hint=Je kunt deze vijand vinden tijdens een specifieke missie.
actors.mobs.elemental$frostelemental.name=vorst elementair
actors.mobs.elemental$frostelemental.desc=Elementairs zijn chaotische wezens die vaak gecreëerd worden wanneer krachtige geheime magie niet goed onder controle wordt gehouden. Elementairs hebben minimale intelligentie, en zijn meestal gekoppeld met een bepaald type magie.\n\nVorst elementairs zijn een alledaags type elementair die hun vijanden verzwakken met afkoelende magie. Ze koelen hun vijand af bij een slagaanval en soms met een aanval op afstand. Hun magie is veel effectiever in water.
actors.mobs.elemental$shockelemental.name=schok elementair
actors.mobs.elemental$shockelemental.desc=Elementairs zijn chaotische wezens die vaak gecreëerd worden wanneer krachtige geheime magie niet goed onder controle wordt gehouden. Elementairs hebben minimale intelligentie, en zijn meestal gekoppeld met een bepaald type magie.\n\nSchok elementairs zijn een minder alledaags type elementairs die vijanden te lijf gaan met elektriciteit en flitsen van licht. In een slagaanval richten ze hun elektriciteit op vijanden, en doen bonus schade als hun primaire doelwit in het water staat. Ze richten ook af en toe een lichtstraal op hun doel, waardoor deze tijdelijk wordt verblind.
actors.mobs.elemental$chaoselemental.name=chaos elementair
actors.mobs.elemental$chaoselemental.desc=Elementairs zijn chaotische wezens die vaak gecreëerd worden wanneer krachtige geheime magie niet goed onder controle wordt gehouden. Elementairs hebben minimale intelligentie, en zijn meestal gekoppeld met een bepaald type magie.\n\nChaos elementairs zijn zeldzame en gevaarlijke elementairs die zich niet hebben gestabiliseerd tot een bepaald element. Ze ontketenen wilde, onvoorspelbare magie wanneer ze aanvallen.

actors.mobs.eye.name=kwaadaardig oog
actors.mobs.eye.deathgaze_kill=De doodsstaar doodde je...
actors.mobs.eye.desc=Kwaadaardige ogen zijn zwevende ballen van opgekropte demonische energie. Hoewel ze in staat zijn tot slagaanvallen, komt hun ware kracht uit hun magie.\n\nEen Kwaadaardig oog ontketent, na een korte tijd energie te hebben opgebouwd, een verwoestende straal energie die de _doodsstaar wordt genoemd._ Alles in het vizier van het Boze Oog loopt enorme schade op, wijze avonturiers zoeken dekking.

actors.mobs.fetidrat.name=stinkende rat
actors.mobs.fetidrat.desc=Er is duidelijk iets mis met deze rat. Zijn vette zwarte vacht en rottende huid zijn heel anders dan de gezonde ratten die je eerder hebt gezien. Zijn bleke groene ogen maken het bijzonder dreigend.\n\nDe rat draagt een wolk van verschrikkelijke stank met zich mee, die overweldigend sterk is van dichtbij.\n\nDonker slijk druppelt van de bek van de rat, dat door de vloer heen brandt maar lijkt op te lossen in water.
actors.mobs.fetidrat.discover_hint=Je kunt deze vijand vinden tijdens een specifieke missie.

actors.mobs.fungalcore.name=schimmel kern
actors.mobs.fungalcore.desc=Deze gigantische paddenstoel moet de bron zijn van alle schimmelactiviteit in deze grot.

actors.mobs.fungalsentry.name=schimmel schildwacht
actors.mobs.fungalsentry.desc=Deze bijzonder hoge paddenstoel fungeert als verdedigingspunt voor het grotere schimmelnetwerk dat in deze grot leeft.\n\nHij is onbeweeglijk, maar schiet nauwkeurige gifstoten af op alles wat binnen zijn gezichtsveld komt. Hoewel de impact van deze ontploffingen tamelijk zwak is, _kunnen ze zich zeer snel dodelijke hoeveelheden gif ophopen._ Hoewel het kan worden gedood, is het waarschijnlijk het beste om het te vermijden.

actors.mobs.fungalspinner.name=schimmelspinner
actors.mobs.fungalspinner.desc=Deze grotspinner lijkt te worden bestuurd door een parasitaire schimmel. De schimmel heeft ook zijn eigenschappen veranderd en zijn web en gifzakken vervangen door schimmelgroei.\n\nDe schimmelspinner spuugt plantenleven naar je in plaats van webben, waardoor schimmelvegetatie wordt verspreid en je mogelijk wordt geworteld. Hoewel hij niet kan vergiftigen, zal de schimmelspinner aanzienlijke weerstand tegen schade verwerven als hij in de buurt van paddenstoelen staat.

actors.mobs.ghoul.name=dwerggriezel
actors.mobs.ghoul.desc=Toen de dwergenmaatschappij langzaam begon in te storten en de huidige koning van de dwergen de absolute macht greep, werden zij die zwak waren of zich tegen hem verzetten niet goed behandeld. Naarmate de koning beter werd in het hanteren van duistere magie, boog hij deze dwergen naar zijn wil, en nu vormen zij de voetsoldaten van zijn leger.\n\nGriezels zijn op zichzelf niet bijzonder sterk, maar reizen altijd in groepen en zijn veel moeilijker in grote aantallen te doden. _Wanneer een griezel is verslagen, komt deze na een paar beurten weer tot leven, zolang er een andere griezel in de buurt is._

actors.mobs.gnoll.name=verkennergnol
actors.mobs.gnoll.desc=Gnollen zijn hyena-mensachtigen. Ze wonen in het riool en in kerkers, en wagen zich af en toe naar het oppervlakte om overvallen te plegen. Verkennergnollen zijn vaste leden van hun roedel, ze niet zo sterk als bruten en niet zo intelligent als sjamanen.

actors.mobs.gnollexile.name=gnolbanneling
actors.mobs.gnollexile.desc=Deze grijsharige gnol heeft een groot merkteken op zijn schouder, wat aangeeft dat hij een balling is. Gnollen worden meestal uit hun gemeenschap verbannen omdat ze bevelen negeren of wetten overtreden. Ballingen moeten sterk en slim zijn om te overleven, en deze lijkt te weten hoe hij de speer die hij vasthoudt moet gebruiken.
actors.mobs.gnollexile.desc_passive=_De gnolbanneling maakt geen aanstalten om aan te vallen._ Hij lijkt niet zo agressief als de andere gnollen hier, en vindt het waarschijnlijk niet de moeite waard om tegen je te vechten. Je zou hem gewoon kunnen laten passeren, maar hij heeft een rugzak die misschien vol zit met nuttige voorwerpen...
actors.mobs.gnollexile.desc_aggro=_De gnolbanneling kijkt boos om zich heen._ Het lijkt erop dat iets hem toch heeft doen besluiten te vechten. Pas op voor die speer!
actors.mobs.gnollexile.seen_passive=De speerdragende gnol kijkt je wantrouwend aan, maar gaat niet in de aanval.
actors.mobs.gnollexile.seen_aggro=De speerdragende gnol gaat in de aanval!

actors.mobs.gnollgeomancer.name=waarzeggergnol
actors.mobs.gnollgeomancer.warning=De waarzegger begint te bewegen. Zorg ervoor dat je klaar bent voordat je verdergaat!
actors.mobs.gnollgeomancer.alert=De waarzegger ontwaakt! De hele grot lijkt te verschuiven als hij wegspringt terwijl hij lacht als een waanzinnige!
actors.mobs.gnollgeomancer.rock_kill=Het vliegende rotsblok heeft je gedood...
actors.mobs.gnollgeomancer.rockfall_kill=De vallende rotsen hebben je gedood...
actors.mobs.gnollgeomancer.desc=Deze indrukwekkend lange oudere gnol moet de bron zijn van de verschillende grondverplaatsende magie hier in de buurt, en de organisator van alle gnollen-activiteit. In tegenstelling tot de pioniergnollen in het gebied, is de waarzegger behoorlijk bedreven met zijn magie en kan hij niet worden beschadigd door geworpen of vallende stenen. Hij heeft echter geen manier om met zijn handen te vechten.
actors.mobs.gnollgeomancer.desc_armor=De waarzegger is momenteel ingekapseld in een laag rotsen. _Je moet dichtbij komen en hem met je houweel wegbreken voordat je de waarzegger kunt beschadigen._
actors.mobs.gnollgeomancer.desc_armor_sapper=_Een pioniergnol in de buurt houdt een apparaat vast dat het rotspantser van de waarzegger versterkt. Je kunt het nu helemaal niet beschadigen!_
actors.mobs.gnollgeomancer.desc_sleeping=Deze indrukwekkend lange sjamaangnol is omgeven door een laag rots en lijkt bijna op een standbeeld. Als je goed kijkt, zie je de rots op magische wijze bewegen in de tijd met de ademhaling van de oudere gnol. Het kan geen schade oplopen als het zo in een rots is ingesloten, en het lijkt erop dat het letterlijk een dutje doet.\n\nJe kunt waarschijnlijk met je houweel door de rotslagen breken, maar zorg ervoor dat je klaar bent voor een gevecht als je dat doet. De waarzegger moet de bron zijn van de verschillende grondverplaatsende magie hier in de buurt, en de organisator van alle gnollen-activiteit. _Het kan een goed idee zijn om de gnollen die hier verspreid zijn te verslaan voordat je ermee gaat vechten._
actors.mobs.gnollgeomancer.discover_hint=Je kunt deze vijand vinden tijdens een specifieke missie.

actors.mobs.gnollguard.name=bewakergnol
actors.mobs.gnollguard.def_verb=geblokkeerd
actors.mobs.gnollguard.spear_warn=De gnol geeft een venijnige klap met de punt van zijn speer!
actors.mobs.gnollguard.desc=Een grote en stoer uitziende gnol met een speer en een schild, maar geen helm. Deze bewakers zijn waarschijnlijk beesten in opleiding, gedwongen om de mijn te helpen beschermen tegen opdringerig wild.\n\nDe bewakergnol is sterk genoeg om de speer met één hand te hanteren, maar kan deze niet zo goed gebruiken. _Her heeft een redelijk open ruimte nodig om op afstand aan te vallen, en het zal je aanzienlijk minder schade toebrengen als je dichtbij komt._
actors.mobs.gnollguard.desc_armor=_Een pioniergnol in de buurt houdt een apparaat vast dat deze bewaker een aarden pantser geeft, waardoor de schade die het oploopt aanzienlijk wordt verminderd._
actors.mobs.gnollguard.discover_hint=Je kunt deze vijand vinden tijdens een specifieke missie.

actors.mobs.gnollsapper.name=pioniergnol
actors.mobs.gnollsapper.desc=Een kleine en zwakke maar intelligente gnol met een bleke vacht en een tas vol met verschillende gadgets. Ze zijn hier waarschijnlijk om te helpen bij het zoeken naar en winnen van donker goud, en hebben een bewaker in de buurt voor bescherming. Ze zijn in staat om te vechten, maar hun aanvallen zijn jammerlijk zwak, niet sterker dan een verkennergnol. \n\nIn plaats van rechtstreeks te vechten, hebben pioniers er de voorkeur aan de verschillende gadgets te gebruiken die ze hebben om de rotsachtige omgeving gebruiken in plaats van aan te vallen. Ze kennen echter zelf geen magie voor het verplaatsen van de aarde, en zullen hun gadgets dus waarschijnlijk roekeloos gebruiken. _Er zouden veel manieren moeten zijn om hun aanvallen tegen hen te gebruiken, of tegen hun bewakers._
actors.mobs.gnollsapper.discover_hint=Je kunt deze vijand vinden tijdens een specifieke missie.

actors.mobs.gnolltrickster.name=bedriegergnol
actors.mobs.gnolltrickster.desc=Een vreemd uitziend wezen, zelfs naar gnolmaatstaven. Hij buigt voorover met een gemene grijns en houdt de tas die over zijn schouder hangt beschermend vast. Zijn ogen zijn groot met een vreemde mix van angst en opwinding.\n\nEr zit een grote verzameling slecht gemaakte pijltjes in zijn tas, ze lijken allemaal getipt te zijn met verschillende schadelijke stoffen.
actors.mobs.gnolltrickster.discover_hint=Je kunt deze vijand vinden tijdens een specifieke missie.

actors.mobs.goldenmimic.name=gouden nabootser
actors.mobs.goldenmimic.desc=Nabootsers zijn magische wezens die elke vorm aan kunnen nemen die ze willen. In kerkers kiezen ze bijna altijd de vorm van een schatkist, om nietsvermoedende avonturiers aan te trekken. \n\nGouden nabootsers zijn sterkere nabootsers die proberen de sterkste avonturiers aan te trekken. Ze hebben betere buit, maar zijn ook veel sterker dan normale nabootsers.

actors.mobs.golem.name=golem
actors.mobs.golem.def_verb=geblokkeerd
actors.mobs.golem.desc=Golems zijn een poging om de eerdere fouten in de dwergmachines te verbeteren door middel van nieuwgevonden magie te verbeteren. Ze zijn veel compacter en efficiënter in vergelijking met de DM-300, terwijl ze nog steeds erg dodelijk zijn.\n\nHoewel golems nog steeds te groot zijn om in doorgangen te passen, hebben de dwergen hen nieuwe magische krachten gegeven om daarvoor te compenseren. Golems kunnen zichzelf tussen kamers teleporteren en vijanden naar zich toe te teleporteren wanneer ze te ver weg zijn.

actors.mobs.goo.name=Smurrie
actors.mobs.goo.notice=GLURP-GLURP!
actors.mobs.goo.defeated=glurp... glurp...
actors.mobs.goo.!!!=!!!
actors.mobs.goo.pumpup=Smurrie pompt zichzelf op!
actors.mobs.goo.enraged=woedend
actors.mobs.goo.gluuurp=GLUUUURP!
actors.mobs.goo.rankings_desc=Geabsorbeerd door de Smurrie
actors.mobs.goo.desc=Er is weinig bekend over de Smurrie. Het is heel goed mogelijk dat het niet eens een wezen is, maar eerder een mengsel van akelige stoffen uit de riolen dat op de een of andere manier basisintelligentie heeft gekregen. Hoe dan ook, duistere magie is zeker het bestaansrecht van Smurrie.\n\nDoor zijn gelatine-achtige aard heeft het veel donkere energie geabsorbeerd, je voelt een koude rilling alleen al van dichtbij zijn. Als Smurrie met deze energie kan aanvallen leeft je niet meer lang.

actors.mobs.greatcrab.name=grote krab
actors.mobs.greatcrab.noticed=De krab blokkeert met zijn enorme klauw.
actors.mobs.greatcrab.def_verb=geblokkeerd
actors.mobs.greatcrab.desc=Deze krab is gigantisch, zelfs vergeleken met andere rioolkrabben. Zijn blauwe schelp is bedekt met barsten en zeepokken, wat een een hoge leeftijd verraad. Hij sjokt langzaam rond, nauwelijks in evenwicht met zijn enorme klauw.\n\nHoewel de krab maar één klauw heeft, compenseert zijn grootte hier gemakkelijk voor. De krab houdt de klauw voor elke bedreiging vast en schermt zich af achter een ondoordringbare schildmuur. De krab kan echter geen aanvallen blokkeren die hij niet ziet aankomen, of aanvallen van meerdere vijanden tegelijk.
actors.mobs.greatcrab.discover_hint=Je kunt deze vijand vinden tijdens een specifieke missie.

actors.mobs.guard.name=cipier
actors.mobs.guard.scorpion=Kom hier!
actors.mobs.guard.def_verb=geblokkeerd
actors.mobs.guard.desc=Deze cipiers, die ooit gevangenisbewakers waren, zijn al lang niet anders dan de gevangenen geworden. Ze schuifelen als zombies, hersenloos dwalen ze door de gangen op zoek naar iets dat niet op hun plaats is, zoals jij!\n\nZe dragen kettingen om hun heup, die ze mogelijk gebruiken om vijanden naar zich toe te trekken.

actors.mobs.hermitcrab.name=heremietkreeft
actors.mobs.hermitcrab.def_verb=geblokkeerd
actors.mobs.hermitcrab.desc=Om de een of andere reden heeft deze rioolkrab besloten het gebroken bovenste deel van een vat op zijn kop te dragen! Het extra gewicht heeft hem afgeremd tot normale snelheid, maar heeft hem ook aanzienlijk meer bescherming gegeven. Je denkt dat je iets hoort stuiteren in het vat...

actors.mobs.mimic.name=nabootser
actors.mobs.mimic.reveal=Die kist is een nabootser!
actors.mobs.mimic.hidden_hint=Iets aan deze kist voelt niet goed... Erop af lopen en het proberen te openen kan een slecht idee zijn.
actors.mobs.mimic.desc=Nabootsers zijn magische wezens die elke vorm kunnen aannemen die ze willen. In kerkers kiezen ze bijna altijd de vorm van een schatkist, om nietsvermoedende avonturiers te lokken.\n\nNabootsers hebben een nare beet, maar bevatten vaak meer schatten dan een gewone kist.
actors.mobs.mimic.discover_hint=Je kunt deze vijand overal in de kerker vinden.

actors.mobs.necromancer.name=geestenbezweerder
actors.mobs.necromancer.desc=Deze leerling-duistere magiërs zijn samengestroomd naar de gevangenis, omdat het de perfecte plek is om hun kwade ambacht te oefenen.\n\nGeestenbezweerders roepen skeletten op en geven ze kracht om voor hen te vechten. Het doden van de geestenbezweerder doodt ook het skelet dat het oproept.
actors.mobs.necromancer$necroskeleton.name=skelet van de geestenbezweerder
actors.mobs.necromancer$necroskeleton.desc=Dit skelet is opgeroepen door een geestenbezweerder. Het gedraagt zich net als een gewoon skelet, en gaat dood wanneer de geestenbezweerder die het heeft opgeroepen sterft.

actors.mobs.mob.died=Je hoort iets in de verte dood gaan.
actors.mobs.mob.rage=#$%^
actors.mobs.mob.rankings_desc=Gedood door: %s
actors.mobs.mob.discover_hint=Je kunt deze vijand vinden in een specifieke regio van de kerker.

actors.mobs.monk.name=dwergen monnik
actors.mobs.monk.def_verb=geblokkeerd
actors.mobs.monk.parried=gepareerd
actors.mobs.monk.desc=Deze monniken zijn fanatiekelingen, die zich hebben toegewijd aan het beschermen van hun koning met fysieke kracht. Hun toewijding is zo groot dat ze zich volledig aan hun koning hebben overgegeven en nu als hersenloze zombies door de dwergenstad zwerven.\n\nMonniken vertrouwen uitsluitend op de kunst van het man-tegen-mangevecht en kunnen hun ongewapende vuisten zowel aanvallend als verdedigend gebruiken. Wanneer ze gefocust raken, pareren monniken de volgende fysieke aanval, zelfs als die anders gegarandeerd raak zou zijn. Monniken bouwen sneller focus op tijdens het bewegen, en langzamer in een direct gevecht.
actors.mobs.monk$focus.name=gefocust
actors.mobs.monk$focus.desc=Deze Monnik is perfect op zijn doelwit gericht en lijkt hun bewegingen te anticiperen voordat ze ze uitvoeren.\n\nAls je gefocust bent, mist de volgende fysieke aanval op dit personage gegarandeerd, ongeacht de omstandigheden. Het afweren van deze aanval laat de focus van de monnik verdwijnen, en deze moet weer worden opgebouwd om nog een aanval af te weren. Monniken bouwen sneller focus op terwijl ze bewegen.

actors.mobs.phantompiranha.name=spookpiranha
actors.mobs.phantompiranha.teleport_away=De spookpiranha teleporteert weg...
actors.mobs.phantompiranha.desc=Spookpiranha's zijn een zeldzaam soort piranha met magische vermogens en griezelige, doorschijnende lichamen. Ze zijn in staat te teleporteren terwijl ze worden aangevallen, om te ontsnappen of om snel dicht bij hun vijand te komen!\n\nHoewel ze lastig te bestrijden zijn, wordt hun vlees gewaardeerd om zijn magische eigenschappen.

actors.mobs.piranha.name=gigantische piranha
actors.mobs.piranha.desc=Deze vleesetende vissen worden speciaal gekweekt om overstroomde gebieden te beschermen. Hun beet is dodelijk, dus het is beter om ze niet rechtstreeks te confronteren.
actors.mobs.piranha.discover_hint=Je kunt deze vijand overal in de kerker vinden.

actors.mobs.pylon.name=hoogspanningsmast
actors.mobs.pylon.desc_inactive=Een hoogspanningsmast, bedoeld om te helpen bij het reguleren van de elektriciteit die de machines in dit gebied aandrijft.\n\nDe mast is momenteel inactief en immuun voor schade.
actors.mobs.pylon.desc_active=Een hoogspanningsmast, bedoeld om te helpen bij het reguleren van de elektriciteit die de machines in dit gebied aandrijft. De mast bruist momenteel van elektrische energie, dit moet de DM-300 super-opladen!\n\nIn deze toestand zijn masten kwetsbaar, maar ze overbruggen elektriciteit met de klok mee naar nabijgelegen cellen. Door hun zware metalen constructie zijn masten bestand tegen grote hoeveelheden schade.

actors.mobs.rat.name=buidelrat
actors.mobs.rat.desc=Buidelratten zijn agressieve maar nogal zwakke bewoners van de riolen. Ze hebben een vervelende beet, maar zijn alleen in grote aantallen levensbedreigend.

actors.mobs.ripperdemon.name=ripperdemoon
actors.mobs.ripperdemon.leap=De ripperdemoon bereidt zich voor om te springen!
actors.mobs.ripperdemon.desc=Deze gruwelijke wezens zijn het resultaat van de vele dwergenlijken in deze regio die door demonische krachten tot leven komen. Rippers zijn uitgemergelde, griezelige wezens die op dwergen lijken, maar met gebroken lichamen en lange scherpe klauwen van beenderen.\n\nRipperdemonen zijn niet bijzonder duurzaam, maar ze zijn behendig en gevaarlijk. Ze kunnen grote afstanden springen om snel hun doelwit te bereiken voordat ze hen verwonden met hun klauwen.

actors.mobs.rotheart.name=rot hart
actors.mobs.rotheart.desc=De vrucht van een Rotbes is zeer uniek. In plaats van weg te rotten en voedingsstoffen te leveren, groeit het fruit, verhardt het en omvat het zaad. Het biedt bescherming voor de interne organen die in de vrucht groeien. Deze gigantische bol wordt het hart van een volwassen rotbes-plant genoemd.
actors.mobs.rotheart.discover_hint=Je kunt deze vijand vinden tijdens een specifieke missie.

actors.mobs.rotlasher.name=rot sjorder
actors.mobs.rotlasher.desc=De rot sjorder maakt deel uit van de wortelstructuur van een volwassen rotbes-plant en is ook zijn primaire verdedigingsmiddel. Sjorders zitten vast in de grond, maar vallen elke dreiging die in de buurt komt met geweld aan nadat ze even de tijd hebt genomen om ze te detecteren.. Als er geen vijanden in de buurt zijn, staan ze roerloos en proberen ze op te gaan in de omringende vegetatie.
actors.mobs.rotlasher.discover_hint=Je kunt deze vijand vinden tijdens een specifieke missie.

actors.mobs.scorpio.name=schorpioen
actors.mobs.scorpio.desc=Deze enorme spinachtige demonische wezens vermijden slagaanvallen en geven er de voorkeur aan verlammende gekartelde stekels op lange afstand af te vuren.

actors.mobs.senior.name=senior monnik
actors.mobs.senior.desc=Deze monniken zijn fanatiekelingen, die zich hebben toegewijd aan het beschermen van hun koning door middel van fysieke macht. Hun toewijding is zo groot dat ze hun geest volledig aan hun koning hebben overgegeven en nu als hersenloze zombies door de dwergenstad zwerven.\n\nDeze monnik beheerst de kunst van man-tegen-man-gevechten en kan zich concentreren terwijl hij veel sneller beweegt dan gewone monniken. Wanneer ze gefocust raken, pareren monniken de volgende fysieke aanval die tegen hen wordt gebruikt, zelfs als het anders gegarandeerd zou raken. Monniken bouwen hun focus sneller op terwijl ze onderweg zijn, en langzamer in directe gevechten.

actors.mobs.shaman.name=sjamaangnol
actors.mobs.shaman.bolt_kill=De magische schok doodde je...
actors.mobs.shaman.desc=Sjamaangnollen zijn intelligente gnollen die gevechtsspreuken gebruiken om te compenseren voor hun gebrek aan fysieke kracht. Ze hebben een gerespecteerde positie in de gnollengemeenschap, ondanks hun zwakkere kracht.
actors.mobs.shaman$redshaman.spell_desc=De sjamaan draagt een rood masker, en gebruikt magie die tijdelijk _je aanvalskracht verzwakt._
actors.mobs.shaman$blueshaman.spell_desc=Deze sjamaan draagt een blauw masker, en gebruikt magie die tijdelijk _de schade die je toegebracht wordt vergroot._
actors.mobs.shaman$purpleshaman.spell_desc=Deze sjamaan draagt een paars masker, en gebruikt magie die tijdelijk _je nauwkeurigheid en ontwijking vermindert._

actors.mobs.armoredbrute.name=bepantserde bruut
actors.mobs.armoredbrute.desc=De oudste gnolbruten dragen vaak een krachtig harnas om hun status te tonen. Het harnas maakt deze beesten veel beter bestand tegen fysieke schade, en hun grotere discipline betekent dat ze veel langer woedend kunnen zijn voordat ze aan hun wonden bezwijken.

actors.mobs.skeleton.name=skelet
actors.mobs.skeleton.explo_kill=Je bent gedood door de explosie van botten...
actors.mobs.skeleton.def_verb=geblokkeerd
actors.mobs.skeleton.desc=Skeletten zijn samengesteld uit de botten van ongelukkige avonturiers en bewoners van de gevangenis, bezield door emanaties van kwade magie uit de diepten beneden. Nadat ze voldoende beschadigd zijn, zullen skeletten uiteenvallen in een explosie van botten. De scherven van deze explosie zijn schadelijk voor alles in de buurt, maar een harnas is zeer effectief in het verzachten ervan.

actors.mobs.slime.name=slijm
actors.mobs.slime.def_verb=geblokkeerd
actors.mobs.slime.desc=Slijms zijn vreemde, licht magische wezens met een rubberachtig buitenlichaam en een vloeibare kern. Het stadsriool voorziet hen van voldoende water en voedingsstoffen.\n\nDoor hun elastische buitenvlies is het moeilijk om meer dan _6 schade_ aan slijm aan te richten door een aanval.

actors.mobs.snake.name=rioolslang
actors.mobs.snake.hint=Probeer de onderzoeksknop op een slang te gebruiken om te leren hoe je ze het beste kan tegengaan.
actors.mobs.snake.desc=Deze extra grote slangen zijn in staat om snel om slagen heen te glijden, waardoor ze behoorlijk moeilijk te raken zijn. Magische aanvallen of verrassingsaanvallen kunnen ze echter overrompelen.\n\nJe kunt een verrassingsaanval uitvoeren door aan te vallen terwijl je buiten het zicht van de slang bent. Eén manier is om je door een deuropening door een slang te laten achtervolgen en dan _toe te slaan vlak nadat hij de deur binnen is gegaan._

actors.mobs.spectralnecromancer.name=spookachtige geestenbezweerder
actors.mobs.spectralnecromancer.desc=Hoewel skeletten het levensonderhoud van een geestenbezweerder zijn, gebruiken sommigen liever andere, minder lichamelijke handlangers. Spookachtige geestenbezweerders hebben schimmen gekozen als hun favoriete volgeling!\n\nIndividuele schimmen zijn niet zo sterk als skeletten, maar deze geestenbezweerders zijn niet bang om er een aantal op te roepen!

actors.mobs.spinner.name=grotspinner
actors.mobs.spinner.desc=Deze groenachtige harige grotspinnen proberen directe gevechten te vermijden. In plaats daarvan wachten ze liever in de verte terwijl hun slachtoffer worstelt in hun uitgescheiden spinnenweb en langzaam sterft aan hun giftige beet. Ze zijn in staat om hun webben over grote afstanden te schieten en proberen het pad dat hun prooi neemt te blokkeren.

actors.mobs.statue.name=levend standbeeld
actors.mobs.statue.def_verb=geblokkeerd
actors.mobs.statue.desc=Je zou denken dat het gewoon weer een van de levenloze standbeelden van deze kerker is, maar de rode gloeiende ogen verraden het.
actors.mobs.statue.desc_weapon=Hoewel het beeld zelf van steen is, lijkt het _%s_ dat het hanteert echt.
actors.mobs.statue.discover_hint=Je kunt deze vijand overal in de kerker vinden.

actors.mobs.succubus.name=succubus
actors.mobs.succubus.desc=Succubi zijn gedaanteverwisselende demonen die de geest van hun prooi manipuleren. Deze heeft de vorm aangenomen van een bleke gotische mensachtige, misschien om dwergentovenaars aan te trekken?\n\nSuccubi kunnen hun vijand tijdelijk charmeren wanneer ze aanvallen, waardoor hun vijand hen niet rechtstreeks kan aanvallen. Wanneer succubi een gecharmeerde vijand aanvallen, stelen ze wat van hun levensenergie.

actors.mobs.swarm.name=zwerm van vliegen
actors.mobs.swarm.desc=Deze dodelijke zwerm vliegen zoemt boos. Elke niet-magische aanval splitst het in twee kleinere maar even gevaarlijke zwermen.

actors.mobs.tengu.name=Tengu
actors.mobs.tengu.notice_gotcha=Ik heb je, %s!
actors.mobs.tengu.interesting=Laten we het interessant maken...
actors.mobs.tengu.notice_have=Nu heb ik je, %s!
actors.mobs.tengu.defeated=Eindelijk vrij...
actors.mobs.tengu.rankings_desc=Vermoord door de Tengu
actors.mobs.tengu.desc=Een beroemde en raadselachtige moordenaar, genoemd naar het masker op zijn gezicht.\n\nTengu wordt vastgehouden met grote gespen om zijn polsen en knieën, hoewel hij zijn kettingen al lang geleden kwijt lijkt te zijn geraakt.\n\nHij gebruikt vallen, bedrieglijke magie en nauwkeurige aanvallen om het enige te elimineren dat zijn ontsnapping tegenhoudt: jij.

actors.mobs.tengu$bombability$bombblob.desc=Een wolk van oververhitte rook stijgt hier op. Pas op, het gaat ontploffen!
actors.mobs.tengu$bombability$bombitem.name=Rookbom
actors.mobs.tengu$bombability$bombitem.cant_pickup=Het zit vast aan de grond, je kunt het niet verplaatsen!
actors.mobs.tengu$bombability$bombitem.desc=Tengu heeft hier een vreemd uitziende rookbom gegooid, waar een dikke hete rook uit opstijgt. Het maakt een luid tikkend geluid, alsof het aftelt tot een explosie!\n\nDe bom heeft zichzelf aan de grond verankerd, dus je kunt hem niet oppakken.

actors.mobs.tengu$fireability$fireblob.desc=Tengu heeft een fijn poeder gegooid dat hier in stoom lijkt te veranderen, het staat op het punt te ontbranden!

actors.mobs.tengu$shockerability$shockerblob.desc=Elektrische energie is hier aan het opbouwen, alles wat op deze tegel staat wordt de volgende beurt geschokt!
actors.mobs.tengu$shockerability$shockeritem.name=Schokker
actors.mobs.tengu$shockerability$shockeritem.cant_pickup=Het straalt te veel elektriciteit uit, je kan het niet vastpakken!
actors.mobs.tengu$shockerability$shockeritem.desc=Tengu heeft hier een merkwaardige machine gegooid, die lijkt te zijn gemaakt van DM-100-onderdelen. De machine schiet constant elektriciteit om zich heen, maar het lijkt in een voorspelbaar patroon te gaan.\n\nMet alle elektriciteit eromheen, kun je dit met geen mogelijkheid oppakken.

actors.mobs.thief.name=krankzinnige dief
actors.mobs.thief.stole=De dief stal %s van je!
actors.mobs.thief.carries=\n\nDe dief draagt een _%s._ Gestolen, natuurlijk.
actors.mobs.thief.escapes=De dief is weggekomen met je %s!
actors.mobs.thief.desc=Hoewel deze gevangenen vrij rondlopen uit hun cellen, is deze plek nog steeds hun gevangenis. In de loop van de tijd heeft deze plek zowel hun geest als hun vrijheid ingenomen. Lang geleden zijn deze gekke dieven en bandieten vergeten wie ze zijn en waarom ze stelen.\n\nDeze vijanden stelen en rennen eerder weg dan dat ze vechten. Zorg ervoor dat je ze in het zicht houdt, anders zie je je gestolen voorwerp misschien nooit meer terug.

actors.mobs.tormentedspirit.name=gekwelde geest
actors.mobs.tormentedspirit.desc=Gekwelde geesten zijn overigens goedaardige geesten die door een vloek zijn getroffen. Zolang ze vervloekt zijn, zullen ze aanvallen als een schim, en zijn ze ook nog krachtiger!\n\nHet kan mogelijk zijn om de vloek op te heffen door het juiste item naast de geest te gebruiken. Als de vloek wordt opgeheven, zal de geest zeker dankbaar zijn...
actors.mobs.tormentedspirit.thank_you=Bedankt...

actors.mobs.vaultrat.desc=Deze rat vertoont enkele gedragsveranderingen om de nieuwe AI van vijanden in de kluis te testen:\n_-_ Zijn bewegingen zijn door muren heen te 'horen'.\n_-_ Hij loopt langs een vooraf ingestelde patrouilleroute.\n_-_ Tijdens het rondlopen is zijn detectiebereik achter de richting waarin hij beweegt aanzienlijk kleiner.\n_-_ Tijdens het slapen is zijn detectiebereik ook kleiner.\n_-_ Wanneer hij je detecteert, zal hij eerst gaan 'onderzoeken' voordat hij overschakelt naar de jacht. Onderzoekende vijanden bewegen zich naar je toe, maar vallen niet aan en zijn gemakkelijker kwijt te raken achter deuren en hoeken.

actors.mobs.npcs.vaultsentry.name=kluis scannende bewaker
actors.mobs.npcs.vaultsentry.desc=Deze bewaker scant het gebied volgens een vast patroon. _Aangezien dit slechts een testgebied is, zal de bewaker niets doen als hij je opmerkt._

actors.mobs.npcs.vaultlaser.name=kluis laserbewaker
actors.mobs.npcs.vaultlaser.desc=Deze bewaker vuurt met regelmatige tussenpozen lasers af. _Aangezien dit slechts een testgebied is, zullen de lasers je geen daadwerkelijke schade toebrengen._

actors.mobs.warlock.name=dwergen duivelskunstenaar
actors.mobs.warlock.bolt_kill=De schaduwschicht doodde je...
actors.mobs.warlock.desc=Toen de interesses van de dwergen verschoven van techniek naar mysterieuze kunst, kwamen duivelskunstenaars aan de macht in de stad. Ze begonnen met elementaire magie, maar schakelden al snel over op demonologie en necromantie. De sterkste van deze duivelskunstenaars greep de troon van de dwergenstad, en zijn cohorten mochten hun duistere magie blijven uitoefenen, zolang ze hun vrije wil aan hem overgaven.\n\nDeze duivelskunstenaars beschikken over krachtige ontwrichtende magie en kunnen de magie van opwaardering die op je uitrusting is toegepast tijdelijk hinderen. Hoe meer een voorwerp is opgewaardeerd, hoe sterker het wordt beïnvloed.

actors.mobs.wraith.name=schim
actors.mobs.wraith.desc=Een schim is de wraakzuchtige geest van een zondaar, van wie het graf of de tombe was verstoord. Omdat het een etherisch wezen is, is het erg moeilijk om met een gewoon wapen te raken.
actors.mobs.wraith.discover_hint=Je kunt deze vijand overal in de kerker vinden.

actors.mobs.yogdzewa.name=Yog-Dzewa
actors.mobs.yogdzewa.notice=IK. ZIE. JE.
actors.mobs.yogdzewa.darkness=De duisternis trekt dichterbij...
actors.mobs.yogdzewa.hope=JOUW. HOOP. IS. EEN. ILLUSIE!
actors.mobs.yogdzewa.defeated=...
actors.mobs.yogdzewa.rankings_desc=Verslonden door Yog-Dzewa
actors.mobs.yogdzewa.desc=Yog-Dzewa is een Oude God; een groot wangedrocht dat reikt tot in sterfelijke werelden en ze verslindt om zijn eindeloze groei te voeden. De dwergen moeten de aandacht van deze kosmische gruwel hebben getrokken terwijl ze met duistere magie speelden, en hebben sindsdien geprobeerd het in bedwang te houden.\n\nYog-Dzewa komt voort uit een dimensie van ruwe magische chaos en kan zijn ware vorm niet in deze wereld voortbrengen. In plaats daarvan heeft het avatars gemaakt en demonische volgelingen opgeroepen om hier zijn bevelen uit te voeren.\n\nDit gigantische oog is het brandpunt van Yog-Dzewa's kracht in deze wereld. Hoewel het oog zelf onbeweeglijk is, is het in staat om krachtige stralen demonische magie af te schieten en een verscheidenheid aan volgelingen op te roepen om het te helpen.
actors.mobs.yogdzewa.desc_spawners=Je kunt vanaf de verdiepingen hierboven golven van demonische energie naar het oog voelen stralen. Iets wat je daarboven in leven hebt gelaten, leidt de kracht terug naar Yog-Dzewa. _Yog gebruikt deze energie om krachtigere volgelingen op te roepen!_
actors.mobs.yogdzewa$larva.name=larve van god
actors.mobs.yogdzewa$larva.rankings_desc=Verslonden door Yog-Dzewa
actors.mobs.yogdzewa$larva.desc=Deze kleine oproepingen van Yog-Dzewa zijn eenvoudige volgelingen die gemakkelijk te produceren zijn. Hoewel ze individueel zwak zijn, worden ze snel opgeroepen en kunnen ze in grote aantallen overweldigend worden.
actors.mobs.yogdzewa$yogripper.rankings_desc=Verslonden door Yog-Dzewa
actors.mobs.yogdzewa$yogeye.rankings_desc=Verslonden door Yog-Dzewa
actors.mobs.yogdzewa$yogscorpio.rankings_desc=Verslonden door Yog-Dzewa

actors.mobs.yogfist.invuln_warn=De vuist is onschendbaar dichtbij het oog!
actors.mobs.yogfist.rankings_desc=Verslonden door Yog-Dzewa
actors.mobs.yogfist.desc=Deze vuist is een aspect van Yog-Dzewa's kracht. Vuisten zijn verbonden aan de kracht van Yog-Dzewa en zijn immuun tegen alle schade wanneer ze dicht bij het oog zijn.
actors.mobs.yogfist$burningfist.name=brandende vuist
actors.mobs.yogfist$burningfist.desc=Deze vuist is gevormd uit chaotische vurige magie. Terwijl het beweegt, zet het constant terrein om zich heen in brand. Het kan ook vurige kracht afvuren, die vlammen verspreiden waar ze inslaan.\n\nHet vermogen van de vuist om vlammen te verspreiden wordt onderdrukt in de buurt van water, maar de hitte is zo groot dat al het water eromheen na korte tijd verdampt!
actors.mobs.yogfist$soiledfist.name=smerige vuist
actors.mobs.yogfist$soiledfist.desc=Deze vuist is gevormd uit chaotische aardachtige magie. Terwijl het beweegt, ontspruit het constant vegetatie om zich heen. Het kan ook geconcentreerde aardachtige stoten afschieten die zijn doelwit verstrikken in snelgroeiende planten en wortels!\n\nDe vuist ontleent kracht aan dit plantenleven en weerstaat schade op basis van de hoeveelheid hoge of vertrapte begroeiing in de buurt!
actors.mobs.yogfist$rottingfist.name=rottende vuist
actors.mobs.yogfist$rottingfist.desc=Deze vuist is gevormd uit levende corruptie. Het is een torenhoge massa rottend vlees dat bijtende slijk in slagaanvallen en giftig gas op afstand kan verspreiden. Erger nog, de grote massa van de vuist zorgt ervoor dat deze gaat bloeden in plaats van direct schade op te lopen.\n\nWater kan worden gebruikt om het slijk weg te wassen, maar de vuist kan ook water absorberen om zichzelf te genezen! Bovendien zorgt het beschadigen van de vuist tijdens het bloeden ervoor dat de bloeding opnieuw begint, niet dat de schade optelt!
actors.mobs.yogfist$rustedfist.name=roestende vuist
actors.mobs.yogfist$rustedfist.desc=Deze vuist is gevormd uit levend metaal. Het is een torenhoge massa verschuivend metaal dat krachtige slagaanvallen uitvoert en zijn doelen op afstand kan verlammen. Vanwege zijn enorme massa neemt de vuist alle schade die hem wordt toegebracht in de loop van de tijd op, in plaats van onmiddellijk.\n\nDe vuist is echter onbuigzaam en kan zich niet in nauwe doorgangen bewegen. Bovendien, hoewel het langzaam schade kan oplopen, blijft de uitgestelde schade toenemen als de vuist meerdere keren wordt geraakt.
actors.mobs.yogfist$brightfist.name=heldere vuist
actors.mobs.yogfist$brightfist.teleport=De vuist teleporteert weg in een lichtflits die je ernstig verblindt!
actors.mobs.yogfist$brightfist.desc=Deze vuist wordt gevormd uit pure lichtenergie. Het kan elke beurt krachtige stralen van verzengend licht schieten! Deze stralen verblinden je tijdelijk en brengen zware schade toe. De vuist is ook in staat om de arena even te overspoelen met verblindend licht om te ontsnappen!\n\nDe vuist heeft echter geen speciale vaardigheden die hij op slagbereik kan gebruiken.
actors.mobs.yogfist$darkfist.name=Duistere vuist
actors.mobs.yogfist$darkfist.teleport=De vuist teleporteert weg in een explosie van duisternis die je lichtbron dooft!
actors.mobs.yogfist$darkfist.desc=Deze vuist wordt gevormd uit pure donkere energie. Het is in staat om elke beurt krachtige stoten van duistere magie af te vuren! Deze stoten verzwakken je lichtbron en richten zware schade aan. De vuist is ook in staat om de arena even in duisternis te laten verzwelgen om te ontsnappen!\n\nDe vuist heeft echter geen speciale vaardigheden die hij op slagbereik kan gebruiken.


actors.char.kill=%s doodde je...
actors.char.defeat=je versloeg %s.
actors.char.def_verb=ontweken
actors.char.invulnerable=onschendbaar
actors.char.immune=immuun

# Eternity PD Fallback Keys
actors.blobs.blizzard.desc=A blizzard is swirling here.
actors.blobs.confusiongas.desc=A cloud of confusion gas is swirling here.
actors.blobs.dancefloor.desc=Dance dance dance!\n%s dancing tile: %s\nNext color: %s
actors.blobs.dancefloor.color_1_name=Red
actors.blobs.dancefloor.color_1_desc=Characters standing on this tile take direct damage (massively increased vs hero)
actors.blobs.dancefloor.color_2_name=Green
actors.blobs.dancefloor.color_2_desc=Characters standing on this tile act at 2x speed
actors.blobs.dancefloor.color_3_name=Blue
actors.blobs.dancefloor.color_3_desc=Characters standing on this tile are stunned
actors.blobs.dancefloor.color_4_name=White
actors.blobs.dancefloor.color_4_desc=Characters standing on this tile take defered damage (massively increased vs hero)
actors.blobs.dancefloor.color_5_name=Yellow
actors.blobs.dancefloor.color_5_desc=Mobs killed on this tile give double EXP and more loot
actors.blobs.dancefloor.color_6_name=Purple
actors.blobs.dancefloor.color_6_desc=Characters standing on this tile take double damage
actors.blobs.dancefloor.rankings_desc=Danced into a grave
actors.blobs.dancefloor.ondeath=You danced into your own grave
actors.blobs.dancefloor$dancingdefereddamage.name=Dancing with Death
actors.blobs.dancefloor$dancingdefereddamage.desc=This is the most dangerous dance you've ever performed, and you are absolutely _ROCKING_ it, disregarding the pain!\n\nDeferred damage remaining: %d.
actors.blobs.dancefloor$dancingdefereddamage.ondeath=You danced into your own grave
actors.blobs.dancefloor$dancingdefereddamage.rankings_desc=Danced into a grave
actors.blobs.dancefloor$dancingdoom.name=Dancing in a grave
actors.blobs.dancefloor$dancingdoom.desc=Grave isn't the best place to dance in, but no one is stopping you!\n\nCharacters who are brave enough to dance in a grave will receive double damage from all sources.
actors.blobs.dancefloor$dancespeed.name=Dancing with Time
actors.blobs.dancefloor$dancespeed.desc=Your perfect dance synchronized with a rhythm of the universe, and not even time gonna stop you from dancing!\n\nWhile you dance is perfect, you will perform all actions at double speed.
actors.blobs.dancefloor$dancingstun.name=Stunned
actors.blobs.dancefloor$dancingstun.heromsg=You are stunned!
actors.blobs.dancefloor$dancingstun.desc=Nothing feels worse than being stunned in a middle of a dance\n\nStun completely halts all actions, forcing the target to wait until the effect wears off.
actors.blobs.electricity.desc=A field of electricity is sparking brightly here.
actors.blobs.electricity.rankings_desc=Electrocuted
actors.blobs.electricity.ondeath=You were shocked to death...
actors.blobs.fire.desc=A fire is raging here.
actors.blobs.foliage.desc=Shafts of light pierce the gloom of the underground garden.
actors.blobs.freezing.desc=The air is unnaturally frigid here.
actors.blobs.goowarn.desc=Specks of dark energy are swarming here!
actors.blobs.inferno.desc=An inferno is raging here.
actors.blobs.paralyticgas.desc=A cloud of paralytic gas is swirling here.
actors.blobs.sacrificialfire.desc=There is an altar here with a sacrificial fire burning atop it. Any creature that's killed here will be consumed as an offering to the spirits of the dungeon.\n\nPerhaps a reward will be given if enough sacrifices are made?
actors.blobs.sacrificialfire.worthy=The fire consumes your offering and grows stronger.
actors.blobs.sacrificialfire.unworthy=The fire consumes your offering, but doesn't change.
actors.blobs.sacrificialfire.reward=The fire flares and then dissipates, leaving a reward behind!
actors.blobs.smokescreen.desc=A cloud of thick black smoke is swirling here.
actors.blobs.stenchgas.desc=A cloud of fetid stench is swirling here.
actors.blobs.stormcloud.desc=A cloud of billowing water vapor is swirling here.
actors.blobs.toxicgas.desc=A greenish cloud of toxic gas is swirling here.
actors.blobs.toxicgas.rankings_desc=Suffocated
actors.blobs.toxicgas.ondeath=You died from the toxic gas...
actors.blobs.corrosivegas.desc=A cloud of deadly caustic gas is swirling here.
actors.blobs.waterofawareness.procced=As you take a sip, you feel knowledge pour into your mind.
actors.blobs.waterofawareness.desc=Power of knowledge radiates from the water of this well. Take a sip from it to reveal all secrets of equipped items and reveal all items on the current floor.
actors.blobs.waterofhealth.procced=As you take a sip, you feel your wounds heal completely.
actors.blobs.waterofhealth.desc=Power of health radiates from the water of this well. Take a sip from it to heal your wounds and satisfy hunger.
actors.blobs.wateroftransmutation.desc=Power of change radiates from the water of this well. Throw an item into the well to turn it into something else.
actors.blobs.web.desc=A thick web is covering everything here. Anything that touches or is thrown through the web will break it, but will also be stuck in place.
actors.buffs.adrenaline.name=adrenaline
actors.buffs.adrenaline.desc=A surge of physical power, adrenaline enhanced both attack and movement speed.\n\nAdrenaline allows its target to run at 2x speed, and attack at 1.5x speed.\n\nTurns remaining: %s.
actors.buffs.adrenalinesurge.name=strength boost
actors.buffs.adrenalinesurge.desc=A surge of great might, but sadly not permanent.\n\nStrength boost: +%d.\nTurns until boost weakens: %s.
actors.buffs.amok.name=amok
actors.buffs.amok.desc=Amok causes a state of great rage and confusion in its target.\n\nWhen a creature is amoked, they will attack whatever is near them, whether they be friend or foe.\n\nTurns of amok remaining: %s.
actors.buffs.arcanearmor.name=arcane armor
actors.buffs.arcanearmor.desc=A thin shield is surrounding you, blocking some of the damage from magical attacks.\n\nYour magical armor is currently boosted by: 0-%d.\n\nTurns until arcane armor weakens: %s.
actors.buffs.artifactrecharge.name=artifact recharging
actors.buffs.artifactrecharge.desc=Energy is coursing through you, increasing the rate your equipped artifacts charge.\n\nEach artifact is affected a little differently, but they will all gain charge much faster than normal.\n\nTurns remaining: %s.
actors.buffs.ascensionchallenge.name=amulet's curse
actors.buffs.ascensionchallenge.desc=Somehow Yog-Dzewa is maintaining influence on this world through the amulet, and is trying to stop your ascent!\n\nYog's power is making the dungeon much more dangerous, increasing the number of enemies and making them stronger! This power will keep building if left unchecked, it can be weakened by defeating enemies that have been enhanced by Yog's power.
actors.buffs.ascensionchallenge.desc_clear=The dark energy radiating from the amulet has been weakened as much as possible for now.
actors.buffs.ascensionchallenge.desc_beckon=The amulet is currently _calling out to distant enemies,_ alerting them to your position.
actors.buffs.ascensionchallenge.desc_haste=The amulet is currently _hastening distant enemies,_ letting them reach you faster!
actors.buffs.ascensionchallenge.desc_slow=The amulet is currently _slowing you down,_ and negating speed boosting effects!
actors.buffs.ascensionchallenge.desc_damage=The energy from the amulet has gotten so strong that it's _directly harming you!_
actors.buffs.ascensionchallenge.beckon=The amulet begins calling out to distant enemies.
actors.buffs.ascensionchallenge.haste=The amulet begins hastening distant enemies!
actors.buffs.ascensionchallenge.slow=The amulet starts to feel like a lead weight in your inventory!
actors.buffs.ascensionchallenge.damage=The amulet begins radiating dark energy. It burns!
actors.buffs.ascensionchallenge.weaken_info=You must defeat enemies to weaken the amulet's curse!
actors.buffs.ascensionchallenge.weaken=You can feel the amulet's curse weaken slightly.
actors.buffs.ascensionchallenge.break=You take a moment to catch your breath and feel your wounds begin to close!
actors.buffs.ascensionchallenge.almost=You feel Yog's grip on the amulet begin to weaken, you're almost there!
actors.buffs.ascensionchallenge.on_kill=The dark energy consumes you...
actors.buffs.barkskin.name=barkskin
actors.buffs.barkskin.desc=Your skin is hardened, it feels rough and solid like bark.\n\nThe hardened skin increases your effective armor, allowing you to better defend against physical attack.\n\nYour armor is currently increased by: 0-%d.\nTurns until barkskin weakens: %s.\n\nIf you receive barkskin from multiple sources, only the strongest one will apply.
actors.buffs.barrier.name=barrier
actors.buffs.barrier.desc=A durable bubble of force which blocks all damage.\n\nThe barrier will take damage for whatever it is protecting so long as there is shielding left. The shielding will also slowly decay over time.\n\nShielding remaining: %d.
actors.buffs.rageshield.name=Determination Shield
actors.buffs.rageshield.heromsg=You are protected by your rage!
actors.buffs.rageshield.desc=A durable bubble of your sheer rage saps away life force from nearby enemies, if you are wounded.\n\nThe barrier will drain health from enemies in your sight, angering them and taking damage. The shielding will have bigger effect if enemy is in adjacent to host.\n\nShielding remaining: %d.
actors.buffs.berserk.angered=angered
actors.buffs.berserk.berserk=berserking
actors.buffs.berserk.exhausted=exhausted
actors.buffs.berserk.recovering=recovering
actors.buffs.berserk.angered_desc=The severity of the Berserker's injuries strengthen his blows. As the berserker takes physical damage, his rage will build, granting him bonus damage. Damage which is blocked by armor still counts towards building rage.\n\nRage will fade over time. The lower the berserker's health, the longer it will last.\n\nAt 100%% rage, the Berserker can go berserk, granting him 2x his seal's max shielding, increasing to 6x if he has very low health. This shielding decays over time and once it runs out the berserker will have to rest before building rage again.\n\nCurrent Rage: _%.0f%%_\n_+%.0f%%_ damage
actors.buffs.berserk.berserk_desc=Fear and uncertainty bleed away, leaving only anger. In this state the Berserker is extremely powerful, _dealing +50% damage and gaining bonus shielding._\n\nThis bonus shielding is equal to 2x his seal's max shielding, increasing to 6x if he has very low health. When this shielding is reduced to 0, berserking will end.\n\nAfter raging, the Berserker will need to recover before being able to build rage again.
actors.buffs.berserk.recovering_desc=Inner strength has its limits. The Berserker must rest before using his rage again.\n\nWhile recovering the Berserker does not build any rage from taking damage.
actors.buffs.berserk.recovering_desc_turns=Turns until recovered: _%d_
actors.buffs.berserk.recovering_desc_levels=Levels until recovered: _%.2f_
actors.buffs.berserk.rankings_desc=Berserked to Death
actors.buffs.berserk.action_name=Berserk
actors.buffs.berserk.no_seal=You need your broken seal to berserk!
actors.buffs.bleeding.name=bleeding
actors.buffs.bleeding.ondeath=You bled to death...
actors.buffs.bleeding.heromsg=You are bleeding!
actors.buffs.bleeding.rankings_desc=Bled to Death
actors.buffs.bleeding.desc=That wound is leaking a worrisome amount of blood.\n\nBleeding causes damage every turn. Each turn the damage decreases by a random amount, until the bleeding eventually stops.\n\nCurrent bleed damage: %d.
actors.buffs.bless.name=blessed
actors.buffs.bless.desc=A great burst of focus, some say it is inspired by the gods.\n\nBlessing increases accuracy and evasion by 25%%, making the blessed much more effective in combat.\nIt also increased experience gain by 2x for heroes and allows them to get more items.\n\nTurns of bless remaining: %s.
actors.buffs.blindness.name=blinded
actors.buffs.blindness.heromsg=You are blinded!
actors.buffs.blindness.desc=Blinding turns the surrounding world into a dark haze.\n\nWhile blinded, a character's vision range is reduced to one tile, rendering ranged attacks useless and making it very easy to lose track of distant enemies. Additionally, a blinded hero is unable to read scrolls or books.\n\nTurns of blindness remaining: %s.
actors.buffs.buff.heromsg=
actors.buffs.burning.name=burning
actors.buffs.burning.heromsg=You catch fire!
actors.buffs.burning.burnsup=%s burns up!
actors.buffs.burning.ondeath=You burned to death...
actors.buffs.burning.rankings_desc=Burned to Ash
actors.buffs.burning.desc=Few things are more distressing than being engulfed in flames.\n\nFire will deal damage every turn until it is put out by water or it expires. Fire can be extinquished by stepping into water, or from the splash of a shattering potion.\n\nAdditionally, the fire may ignite flammable terrain or items that it comes into contact with.\n\nTurns of burning remaining: %s.
actors.buffs.championenemy.warn=You sense a deadly presence.
actors.buffs.championenemy$blazing.name=blazing champion
actors.buffs.championenemy$blazing.desc=Blazing champions deal 25% more melee damage, ignite enemies they attack, are immune to fire, and spread fire around them as they die. They can't spread fire onto water however.
actors.buffs.championenemy$projecting.name=projecting champion
actors.buffs.championenemy$projecting.desc=Projecting champions deal 25% more melee damage and have +3 attack range.
actors.buffs.championenemy$antimagic.name=antimagic champion
actors.buffs.championenemy$antimagic.desc=Antimagic champions take 50% less damage and are completely immune to magical effects.
actors.buffs.championenemy$giant.name=giant champion
actors.buffs.championenemy$giant.desc=Giant champions take 80% less damage and have +1 attack range, but cannot move through enclosed spaces.
actors.buffs.championenemy$blessed.name=blessed champion
actors.buffs.championenemy$blessed.desc=Blessed champions have 4x accuracy and evasion.
actors.buffs.championenemy$growing.name=growing champion
actors.buffs.championenemy$growing.desc=Growing champions gain a steadily increasing bonus to accuracy, evasion, physical damage, and a reduction to damage taken.\n\nCurrent acc/eva/dmg boost: %1$d%%\nCurrent damage reduction: %2$d%%
actors.buffs.championenemy$tanky.name=tanky champion
actors.buffs.championenemy$tanky.desc=Tanky champions receives only 5% of the damage, but reduces their damage and speed by 25%.
actors.buffs.championenemy$speedy.name=speedy champion
actors.buffs.championenemy$speedy.desc=Speedy Champions will gain x4 speed and x1.5 evasion and accuracy.
actors.buffs.championenemy$frozen.name=frozen champion
actors.buffs.championenemy$frozen.desc=Frozen champions deal 25% more melee damage but they have -20% speed, chills enemies they attack and sometimes freezes them, are immune to cold gases or effects, and spread blizzard around them as they die.
actors.buffs.championenemy$blunt.name=blunt champion
actors.buffs.championenemy$blunt.desc=Blunt champions are expert for using their hands or something they use as a blunt weapons, they deal 75% more damage as well as inflicts vertigo when they attack and paralyzes you in rare cases.
actors.buffs.charm.name=charmed
actors.buffs.charm.heromsg=You are charmed!
actors.buffs.charm.cant_attack=You are charmed by that enemy and can't attack them.
actors.buffs.charm.desc=A charm is manipulative magic that can make enemies temporarily adore each other.\n\nCharacters affected by charm are unable to directly attack the enemy they are charmed by. Attacking other targets is still possible however. The shock of pain will lessen the duration of charm.\n\nTurns of charm remaining: %s.
actors.buffs.chill.name=chilled
actors.buffs.chill.freezes=%s freezes!
actors.buffs.chill.desc=Not quite frozen, but still much too cold.\n\nChilled targets perform all actions more slowly, depending on how many turns are left in the effect. At its worst, this is equivalent to being slowed.\n\nTurns of chill remaining: %1$s.\nSpeed is reduced by: %2$s%%
actors.buffs.combo.name=combo
actors.buffs.combo.action_name=combo attack
actors.buffs.combo.combo=%d hit combo!
actors.buffs.combo.bad_target=You must target an enemy in attack range.
actors.buffs.combo.prompt=Select a target to attack.
actors.buffs.combo.desc=The gladiator builds momentum as they land successful blows. Each attack increases the combo counter by one, but taking too long between hits will reset the combo counter to 0.\n\nBuilding combo unlocks special combo attacks that cannot miss! A different attack is unlocked at 2, 4, 6, 8, and 10 combo count. Some moves reset combo and some do not, but each move can only be used once per combo session.\n\nCurrent combo: %1$d.\n\nTurns until Combo is lost: %2$s.
actors.buffs.combo$combomove.clobber.name=clobber
actors.buffs.combo$combomove.clobber.desc=Knocks an enemy back 2 tiles, but deals no damage and cannot knock into pits. Increments combo by 1.
actors.buffs.combo$combomove.clobber.empower_desc=Knocks an enemy back _3 tiles, inflicts vertigo, and can knock into pits,_ but deals no damage. Increments combo by 1.
actors.buffs.combo$combomove.slam.name=slam
actors.buffs.combo$combomove.slam.desc=Deals %d%% (combo*20%%) of your damage blocking power as bonus damage. Resets combo when used.
actors.buffs.combo$combomove.slam.empower_desc=_Leaps up to %1$d tile(s)_ and deals %2$d%% (combo*20%%) of your damage blocking power as bonus damage. Resets combo when used.
actors.buffs.combo$combomove.parry.name=parry
actors.buffs.combo$combomove.parry.desc=Blocks the next attack within 1 turn when activated, and instantly retaliates to it. Resets combo if nothing is parried.
actors.buffs.combo$combomove.parry.empower_desc=Blocks _all attacks_ within 1 turn when activated, and instantly retaliates to them. Resets combo if nothing is parried.
actors.buffs.combo$combomove.crush.name=crush
actors.buffs.combo$combomove.crush.desc=Deals %d%% (combo*25%%) damage to the primary target, and half that damage to all other enemies in a 7x7 AOE. Resets combo when used.
actors.buffs.combo$combomove.crush.empower_desc=_Leaps up to %1$d tile(s)_ and deals %2$d%% (combo*25%%) damage to the primary target, and half that damage to all other enemies in a 7x7 AOE. Resets combo when used.
actors.buffs.combo$combomove.fury.name=fury
actors.buffs.combo$combomove.fury.desc=Hits an enemy once for each combo you have, each hit deals 60% damage and can trigger enchantments. Resets combo when used.
actors.buffs.combo$combomove.fury.empower_desc=_Leaps up to %d tile(s)_ and hits an enemy once for each combo you have, each hit deals 60%% damage and can trigger enchantments. Resets combo when used.
actors.buffs.corruption.name=corrupted
actors.buffs.corruption.desc=Corruption seeps into the essence of a being, twisting them against their former nature.\n\nCorrupted creatures will attack their allies, and ignore their former enemies. Corruption is damaging as well, and will slowly cause its target to succumb.\n\nCorruption is permanent, its effects only end in death.
actors.buffs.cripple.name=crippled
actors.buffs.cripple.heromsg=You are crippled!
actors.buffs.cripple.desc=You're pretty sure legs aren't meant to bend that way.\n\nCrippled halves movement speed, making moving a tile usually take two turns instead of one.\n\nTurns of cripple remaining: %s.
actors.buffs.daze.name=dazed
actors.buffs.daze.heromsg=You are dazed!
actors.buffs.daze.desc=Ringing ears and blurred vision make it difficult to fight.\n\nWhile dazed, accuracy and evasion are reduced by 50%%, making both landing and evading blows much harder.\n\nTurns of daze remaining: %s.
actors.buffs.degrade.name=degraded
actors.buffs.degrade.heromsg=Your equipment feels weaker!
actors.buffs.degrade.desc=Powerful dark magic is sapping the strength that scrolls of upgrade have applied to your equipment!\n\nWhile degraded, upgraded gear will be treated as if it is a lower level than it actually is. _Every upgrade after +3 becomes exponentially weaker than the last one._ The descriptions of your items will change to reflect their reduced power level.\n\nDegradation does not affect strength requirements, wand charges, durability of thrown weapons, or artifacts.\n\nTurns of degradation remaining: %s. Using a scroll of upgrade or remove curse will end degradation immediately.
actors.buffs.doom.name=doomed
actors.buffs.doom.desc=It's hard to keep going when it seems like the universe wants you dead.\n\nDoomed characters will receive +67% damage from all sources.\n\nDoom is permanent, its effects only end in death.
actors.buffs.dread.name=dread
actors.buffs.dread.desc=A terror so great that it will cause its target to flee the dungeon entirely!\n\nCreatures affected by dread will run from their opponent at high speed, and will disappear from the dungeon entirely once they are out of sight. Enemies that are defeated this way award half experience and drop no items. The shock of pain will lessen the duration of dread.\n\nTurns of dread remaining: %d.
actors.buffs.drowsy.name=drowsy
actors.buffs.drowsy.desc=A magical force is making it difficult to stay awake, after a few turns, the target will fall into a deep magical sleep.\n\nThe hero can resist drowsiness by taking damage or by being at full health.\n\nTurns until sleep: %s.
actors.buffs.earthimbue.name=imbued with earth
actors.buffs.earthimbue.desc=You are imbued with the power of earth!\n\nAll physical attacks will shift the earth under the enemy, crippling them for a short time.\n\nTurns of earth imbue remaining: %s.
actors.buffs.enhancedrings.name=enhanced rings
actors.buffs.enhancedrings.desc=The Rogue's recently used artifact is empowering his rings, granting them +1 level.\n\nTurns remaining: %s.
actors.buffs.fireimbue.name=imbued with fire
actors.buffs.fireimbue.desc=You are imbued with the power of fire!\n\nAll physical attacks will have a chance to light enemies ablaze. Additionally, you are completely immune to the effects of fire.\n\nTurns of fire imbue remaining: %s.
actors.buffs.foresight.name=foresight
actors.buffs.foresight.desc=You are somehow able to see the layout of surrounding terrain with your mind.\n\nWhile under the effect of foresight all tiles in a wide radius are revealed to you, including any secret traps or doors.\n\nTurns of foresight remaining: %s.
actors.buffs.frost.name=frozen
actors.buffs.frost.freezes=%s freezes!
actors.buffs.frost.desc=Not to be confused with freezing solid, this more benign freezing simply encases the target in ice.\n\nFreezing acts similarly to paralysis, making it impossible for the target to act. Unlike paralysis, freezing is immediately cancelled if the target takes damage, as the ice will shatter.\n\nTurns of freeze remaining: %s.
actors.buffs.frostimbue.name=imbued with frost
actors.buffs.frostimbue.desc=You are imbued with icy power!\n\nAll physical attacks will steadily stack chill on enemies. Additionally, you are completely immune to the cold.\n\nTurns of frost imbue remaining: %s.
actors.buffs.fury.name=furious
actors.buffs.fury.heromsg=You become furious!
actors.buffs.fury.desc=You are angry, enemies won't like you when you're angry.\n\nA great rage burns within you, increasing the damage you deal with physical attacks by 50%%.\n\nThis rage will last as long as you are injured below 50%% health.
actors.buffs.blobimmunity.name=purification barrier
actors.buffs.blobimmunity.desc=Some strange force is encasing you in a thin protective barrier, blocking out all harmful airborne effects.\n\nYou are immune to all area-bound effects while this barrier lasts.\n\nTurns of immunity remaining: %s.
actors.buffs.greaterhaste.name=greater haste
actors.buffs.greaterhaste.desc=An incredible boost of speed, for a moment it feels as if everything else is standing still.\n\nWhile under the effects of greater haste moving actions take no time at all, but other actions are still performed at normal speed. Each step of movement consumes a turn of greater haste.\n\nTurns of greater haste remaining: %d.
actors.buffs.godspeed.name=Godspeed
actors.buffs.godspeed.desc=Godly energy courses through your whole essence, allowing you to perform actions at incredible speeds!\n\nWhile under the effects of godspeed you will perform all actions at double speed.\n\nTurns of godspeed remaining: %s.
actors.buffs.haste.name=haste
actors.buffs.haste.desc=Energy courses through your muscles, allowing you to run at incredible speeds!\n\nWhile under the effects of haste you will run at 3x speed, but will perform all other actions at normal speed.\n\nTurns of haste remaining: %s.
actors.buffs.healing.name=healing
actors.buffs.healing.desc=A magical remedy is causing wounds to close and flesh to knit.\n\nEvery turn health will steadily regenerate until the healing effect expires. The amount of healing may fade over time.\n\nNext heal: %d.\n\nHealing remaining: %d.
actors.buffs.herodisguise.name=disguise
actors.buffs.herodisguise.desc=Illusory magic has altered your physical appearance! The effect is purely cosmetic, but feels very strange regardless.\n\nTurns of disguise remaining: %s.
actors.buffs.hex.name=hexed
actors.buffs.hex.heromsg=You have been hexed!
actors.buffs.hex.desc=Dark magic which saps focus, making the target slightly disoriented.\n\nHexing reduces accuracy and evasion by 20%%, making the target less effective in combat.\n\nTurns of hex remaining: %s.
actors.buffs.holdfast.name=hold fast
actors.buffs.holdfast.desc=The %s is holding his position, increasing their armor by %d-%d. This will last until they move.
actors.buffs.hunger.hungry=hungry
actors.buffs.hunger.starving=starving
actors.buffs.hunger.onhungry=You are hungry.
actors.buffs.hunger.onstarving=You are starving!
actors.buffs.hunger.ondeath=You starved to death...
actors.buffs.hunger.cursedhorn=The cursed horn steals some of the food energy as you eat.
actors.buffs.hunger.rankings_desc=Starved to Death
actors.buffs.hunger.desc_intro_hungry=You can feel your stomach calling out for food, but it's not too urgent yet.
actors.buffs.hunger.desc_intro_starving=You're so hungry it hurts.
actors.buffs.hunger.desc=\n\nHunger slowly increases as you spend time in the dungeon, eventually you will begin to starve. While starving you will slowly lose health instead of regenerating it.\n\nRationing is important! If you have health to spare starving isn't a bad idea if it means there will be more food later. Effective rationing can make food last a lot longer!
actors.buffs.invisibility.name=invisible
actors.buffs.invisibility.desc=You are completely blended into the surrounding terrain, making you impossible to see.\n\nWhile you are invisible enemies are unable to attack or follow you. Physical attacks and magical effects (such as scrolls and wands) will immediately cancel invisibility.\n\nTurns of invisibility remaining: %s.
actors.buffs.invulnerability.name=invulnerable
actors.buffs.invulnerability.desc=You are suffused with great protective power, granting you a brief period of invulnerability!\n\nTurns remaining: %s.
actors.buffs.levitation.name=levitating
actors.buffs.levitation.desc=A magical force is levitating you over the ground, making you feel weightless.\n\nLevitating characters move silently and ignore all ground-based effects. Traps won't trigger, water won't put out fire, plants won't be trampled, roots will miss, and pits will be hovered over. Be careful, as all these things can come into effect the second the levitation ends!\n\nTurns of levitation remaining: %s.
actors.buffs.lifelink.name=life link
actors.buffs.lifelink.desc=This character's life force is linked to another character nearby. Any damage taken is shared between them.\n\nWhenever this character takes damage, half of it will be dealt to the life link target instead.\n\nTurns of life link remaining: %s, or until the linked character dies.
actors.buffs.light.name=illuminated
actors.buffs.light.desc=Even in the Darkest Dungeon, a steady light at your side is always comforting.\n\nLight helps keep darkness at bay, allowing you to see a reasonable distance despite the environment.\n\nTurns of illumination remaining: %s.
actors.buffs.lockedfloor.name=floor is locked
actors.buffs.lockedfloor.desc=The current floor is locked, and you are unable to leave it!\n\nWhile a floor is locked, you will not gain hunger or take damage from starving. In addition, if you do not work towards defeating this floor's boss, passive regeneration effects will also stop.\n\nAdditionally, if you are revived by an unblessed ankh while the floor is locked, then it will reset.\n\nKill this floor's boss to break the lock.
actors.buffs.lostinventory.name=lost inventory
actors.buffs.lostinventory.desc=Your inventory has been lost somewhere in the dungeon! You won't be able to pick up or use most items until you retrieve it.
actors.buffs.magicalsight.name=magical sight
actors.buffs.magicalsight.desc=Somehow you are able to see with your mind, rather than your eyes.\n\nWhile magical sight is active you will be able to see through all terrain in a 12 tile radius.\n\nTurns of magical sight remaining: %s.
actors.buffs.magicalsleep.name=magical sleep
actors.buffs.magicalsleep.toohealthy=You are too healthy, and resist the urge to sleep.
actors.buffs.magicalsleep.fallasleep=You fall into a deep magical sleep.
actors.buffs.magicalsleep.wakeup=You wake up feeling refreshed and healthy.
actors.buffs.magicalsleep.desc=This character has fallen into a deep magical sleep which they will not wake from naturally.\n\nMagical sleep is similar to regular sleep, except that only damage will cause the target to wake up.\n\nFor the hero and their allies, magical sleep has some restorative properties, allowing them to rapidly heal while resting.
actors.buffs.magicimmune.name=immune to magic
actors.buffs.magicimmune.desc=All magical effects have lost their hold on you, you are completely impervious to them.\n\nWhile magic immune all harmful and helpful magical effects will not apply to you, including curses, enchants, wands, scrolls, rings, artifacts, etc. Heroic armor abilities are strong enough to work regardless of this effect.\n\nTurns of magic immunity remaining: %s.
actors.buffs.overload.name=Overload
actors.buffs.overload.desc=The reality is overloaded. Prepare to cry, suffer, kill and slaughter.\n\nThe death of any hostile creature triggers the spawn of other creature.\n\nTurns of overload remaining: %s.
actors.buffs.mindvision.name=mind vision
actors.buffs.mindvision.desc=Somehow you are able to see all creatures on this floor through your mind. It's a weird feeling.\n\nAll characters on this floor are visible to you as long as you have mind vision. Seeing a creature through mind vision counts as it being seen or nearby for the purposes of many magical effects.\n\nTurns of mind vision remaining: %s.
actors.buffs.momentum.momentum=building momentum
actors.buffs.momentum.running=freerunning
actors.buffs.momentum.resting=recovering
actors.buffs.momentum.action_name=freerun
actors.buffs.momentum.momentum_desc=As he moves, the Freerunner builds momentum, which he can spend to start freerunning.\n\nEach charge of momentum grants two turns of freerunning, and the Freerunner can build up to 10 charges. Momentum is rapidly lost when the Freerunner stops moving.\n\nCurrent momentum charge: %d.
actors.buffs.momentum.running_desc=As he moves, the Freerunner builds momentum, which he can spend to start freerunning.\n\nWhile freerunning, the Freerunner moves at double speed and gains bonus evasion based on his level.\n\nTurns remaining: %d.
actors.buffs.momentum.resting_desc=As he moves, the Freerunner builds momentum, which he can spend to start freerunning.\n\nThe Freerunner needs time to regain his stamina before building momentum again.\n\nTurns remaining: %d.
actors.buffs.monkenergy.name=energy
actors.buffs.monkenergy.action=Monk Abilities
actors.buffs.monkenergy.desc=As she defeats enemies, the Monk gains energy that she can use on a variety of abilities. Most enemies grant 1 energy when defeated, and the Monk does not lose energy over time.\n\nCurrent energy: %1$d/%2$d.
actors.buffs.monkenergy.desc_cooldown=The Monk has recently used an ability, and must wait before using another.\n\nCurrent cooldown: %d turns.
actors.buffs.monkenergy$monkability$flurry.name=flurry of blows
actors.buffs.monkenergy$monkability$flurry.desc=Two instant strikes that deal %1$d-%2$d damage and ignore armor. This ability cannot be used repeatedly.
actors.buffs.monkenergy$monkability$flurry.empower_desc=Two instant strikes that deal %1$d-%2$d damage, ignore armor, _and use your weapon's enchantment._ This ability cannot be used repeatedly.
actors.buffs.monkenergy$monkability$focus.name=focus
actors.buffs.monkenergy$monkability$focus.desc=The Monk takes a turn to focus, letting her parry the next attack made against her.
actors.buffs.monkenergy$monkability$focus.empower_desc=The Monk _instantly focuses,_ letting her parry the next attack made against her.
actors.buffs.monkenergy$monkability$focus$focusbuff.name=focused
actors.buffs.monkenergy$monkability$focus$focusbuff.desc=The Monk is focused on her surroundings, anticipating the next attack made against her. While focused, she is guaranteed to parry the next incoming attack.
actors.buffs.monkenergy$monkability$dash.name=dash
actors.buffs.monkenergy$monkability$dash.prompt=Choose a Location
actors.buffs.monkenergy$monkability$dash.desc=An instant dash up to 4 tiles away. This ability can go over hazards, but not through enemies or solid terrain.
actors.buffs.monkenergy$monkability$dash.empower_desc=An instant dash up to _8 tiles_ away. This ability can go over hazards, but not through enemies or solid terrain.
actors.buffs.monkenergy$monkability$dragonkick.name=dragon kick
actors.buffs.monkenergy$monkability$dragonkick.desc=A devastating kick that deals %1$d-%2$d damage and ignores armor. The kick knocks the target away and paralyzes them for each tile they travel.
actors.buffs.monkenergy$monkability$dragonkick.empower_desc=A devastating kick that deals _%1$d-%2$d damage_ and ignores armor. The kick knocks _all adjacent targets_ away and paralyzes them for each tile they travel.
actors.buffs.monkenergy$monkability$meditate.name=meditate
actors.buffs.monkenergy$monkability$meditate.desc=The Monk focuses energy into her body for 5 turns. This clears most negative effects and grants her 8 turns of wand and artifact recharging.
actors.buffs.monkenergy$monkability$meditate.empower_desc=The Monk focuses energy into her body for 5 turns. This clears most negative effects and grants her 8 turns of wand and artifact recharging. _She also gains 80% damage resistance while meditating, and slowly heals for 20% of her missing HP._
actors.buffs.killevolution.name=kill counter
actors.buffs.killevolution.action=Kill Abilities
actors.buffs.killevolution.desc=As they defeat enemies, the hero gains energy that they can use on a variety of abilities. Most enemies grant 1 energy when defeated, and the hero does not lose energy over time.\n\n_However, unequipping a weapon associated with this buff associated with will lose all of this energy and you need to start killing enemies again_\n\nCurrent energy: %1$d/%2$d.
actors.buffs.killevolution.desc_cooldown=The hero has recently used an ability, and must wait before using another.\n\nCurrent cooldown: %d turns.
actors.buffs.killevolution$killevolutionability$invisibledash.name=invisible dash
actors.buffs.killevolution$killevolutionability$invisibledash.prompt=Choose a Location
actors.buffs.killevolution$killevolutionability$invisibledash.desc=An instant dash up to 4 tiles away with an additional turn of invisibility allowing the hero to surprise attack. This ability can go over hazards, but not through enemies or solid terrain.
actors.buffs.killevolution$killevolutionability$invisibledash.empower_desc=An instant dash up to _8 tiles_ away with an additional turn of invisibility allowing the hero to surprise attack. This ability can go over hazards, but not through enemies or solid terrain.
actors.buffs.killevolution$killevolutionability$physicallyempowered.name=physical empower
actors.buffs.killevolution$killevolutionability$physicallyempowered.desc=The hero grants itself +2 bonus damage for 10 hits.
actors.buffs.killevolution$killevolutionability$physicallyempowered.empower_desc=The hero grants itself _+4 bonus damage_ for 10 hits.
actors.buffs.killevolution$killevolutionability$weaponupgrade.name=weapon upgrade
actors.buffs.killevolution$killevolutionability$weaponupgrade.desc=The hero upgrades their weapon (and Duelist's second weapon if there's any) permanently.
actors.buffs.killevolution$killevolutionability$weaponupgrade.empower_desc=The hero upgrades their weapon (and Duelist's second weapon if there's any) _twice_ permanently.
actors.buffs.killevolution$killevolutionability$chain.name=chain enemy
actors.buffs.killevolution$killevolutionability$chain.desc=The hero chains an enemy to pull them in closer range.
actors.buffs.killevolution$killevolutionability$immortalize.name=immortalize
actors.buffs.killevolution$killevolutionability$immortalize.desc=The hero grants itself immortality against all sources of damage for 15 turns.
actors.buffs.killevolution$killevolutionability$immortalize.empower_desc=The hero grants itself immortality against all sources of damage for _~22 turns_.
actors.buffs.ooze.name=caustic ooze
actors.buffs.ooze.heromsg=Caustic ooze eats your flesh. Wash it away!
actors.buffs.ooze.ondeath=You melt away...
actors.buffs.ooze.rankings_desc=Dissolved
actors.buffs.ooze.desc=This sticky acid clings to flesh, slowly melting it away.\n\nOoze will deal consistent damage over time, but can be immediately washed off in water.\n\nTurns of ooze remaining: %s.
actors.buffs.paralysis.name=paralysed
actors.buffs.paralysis.heromsg=You are paralysed!
actors.buffs.paralysis.out=resisted paralysis
actors.buffs.paralysis.desc=Oftentimes the worst thing to do is nothing at all.\n\nParalysis completely halts all actions, forcing the target to wait until the effect wears off. The pain from taking damage can cause characters to resist paralysis, breaking them out of the effect.\n\nTurns of paralysis remaining: %s.
actors.buffs.physicalempower.name=physically empowered
actors.buffs.physicalempower.desc=Your blows have been empowered, increasing the amount of damage you can deal when you hit enemies with physical attacks.\n\nBonus damage: %1$d.\nHits remaining: %2$d.
actors.buffs.pincushion.name=pincushion
actors.buffs.pincushion.desc=The thrown weapons you have used against this character are currently stuck to them and will fall to the floor after they are defeated.\n\nThe following items are currently attached:
actors.buffs.poison.name=poisoned
actors.buffs.poison.heromsg=You are poisoned!
actors.buffs.poison.ondeath=You died from poison...
actors.buffs.poison.rankings_desc=Succumbed to Poison
actors.buffs.poison.desc=Poison works its way through the body, slowly impairing its internal functioning.\n\nPoison deals damage each turn proportional to how long until it expires.\n\nTurns of poison remaining: %s.
actors.buffs.preparation.name=preparation
actors.buffs.preparation.action_name=prepared strike
actors.buffs.preparation.desc=The Assassin is walking nervously, preparing to thurst knife into target.
actors.buffs.preparation.desc_dmg=His next attack will deal _%1$d%% bonus damage_, and will execute regular enemies below _%2$d%% health_, or bosses below _%3$d%% health_.
actors.buffs.preparation.desc_dmg_likely=The attack will also be more likely to deal a larger amount of damage.
actors.buffs.preparation.desc_blink=He is able to blink towards an enemy before striking them, with a max distance of _%d._
actors.buffs.preparation.desc_invis_time=The Assassin has been running for _%d turns._
actors.buffs.preparation.desc_invis_next=His attack will become stronger at _%d turns._
actors.buffs.preparation.prompt=Select a target to attack!\nMax blink distance: %d
actors.buffs.preparation.no_target=There's nothing to attack there.
actors.buffs.preparation.out_of_reach=That target is out of reach.
actors.buffs.preparation.assassinated=assassinated
actors.buffs.marked.name=Marked
actors.buffs.marked.desc=The Hunter is waiting patiently, preparing to strike while his bbat weakens enemies.
actors.buffs.marked.desc_dmg=The bbat deals %s%% more damage to this enemy. You will be able to jump to marked enemy at any moment, but more bonus damage means more debuffs.
actors.buffs.marked.prompt=Select a target to teleport!\nMax blink distance: your view distance
actors.buffs.marked.no_target=There's nothing to teleport there.
actors.buffs.marked.out_of_reach=That target is out of reach.
actors.buffs.marked.assassinated=assassinated
actors.buffs.marked.desc_poison=At this point, you will _poison_ a target, dealing damage over time.
actors.buffs.marked.desc_cripple=At this point, you will _cripple_ the legs of target, reducing its movement speed.
actors.buffs.marked.desc_blinding=At this point, you will also make target _blind_,reducing its field of view to 1 tile.
actors.buffs.marked.desc_bleeding=At this point, you will also make target _bleed_,dealing damage over time.
actors.buffs.marked.desc_vulnerable=At this point, you will also _increase physical damage_ to enemy.
actors.buffs.marked.desc_hexed=At this point, you will also stun target, _reducing its accuracy and dexterity_ for short time.
actors.buffs.marked.desc_slow=At this point, you will also disorientate target, _slowing_ its actions.
actors.buffs.marked.desc_ooze=At this point, you will also apply deadly _caustic ooze_ to target, dealing damage over time until target finds water.
actors.buffs.marked.desc_paralysis=At this point, you will completely _paralyse_ the enemy, rendering it unable to attack.
actors.buffs.marked.desc_doom=At this point, you will also curse the enemy, _significantly increasing any damage to it_.
actors.buffs.prismaticguard.name=prismatic Guard
actors.buffs.prismaticguard.desc=You are being guarded by a prismatic image which is currently inactive. When enemies are present the prismatic image will spring to action and protect you!\n\nWhile inactive, the prismatic image will steadily recover from any damage it has taken.\n\nCurrent HP: %d/%d.
actors.buffs.recharging.name=recharging
actors.buffs.recharging.desc=Energy is coursing through you, improving the rate that your wands and staffs charge.\n\nEach turn this buff will increase current charge by one quarter, in addition to regular recharge.\n\nTurns of recharging remaining: %s.
actors.buffs.revealedarea.name=revealed area
actors.buffs.revealedarea.desc=An area of the dungeon has been temporarily revealed to the hero, They will see it no matter where they are.\n\nTurns remaining: %s.
actors.buffs.revealedchar.name=revealed
actors.buffs.revealedchar.desc=This character is revealed to the hero, They will be visible no matter where they are.\n\nTurns remaining: %s.
actors.buffs.roots.name=rooted
actors.buffs.roots.heromsg=You can't move!
actors.buffs.roots.desc=Roots (magical or natural) grab at the feet, forcing them down to the ground.\n\nRoots lock a target in place, making movement and most movement abilities impossible. Other actions are not affected, including teleportation effects.\n\nTurns of root remaining: %s.
actors.buffs.scrollempower.name=scroll empower
actors.buffs.scrollempower.desc=The energy from the Mage's recently read scroll is empowering his wands!\n\nLevel Boost: +%1$d.\nZaps remaining: %2$d.
actors.buffs.shadows.name=shadowmelded
actors.buffs.shadows.desc=You are blended into the shadows around you, granting you invisibility and slowing your metabolism.\n\nWhile you are invisible enemies are unable to attack or follow you. Most physical attacks and magical effects (such as scrolls and wands) will immediately cancel invisibility. Additionally, while shadowmelded, your rate of hunger is slowed.\n\nYou will remain shadowmelded until you leave the shadows or an enemy comes into contact with you.
actors.buffs.slow.name=slowed
actors.buffs.slow.desc=Slowing magic affects the target's rate of time, to them everything is moving super-fast.\n\nA slowed character performs all actions in twice the amount of time they would normally take.\n\nTurns of slow remaining: %s.
actors.buffs.snipersmark.name=sniper's mark
actors.buffs.snipersmark.action_name_snapshot=snapshot
actors.buffs.snipersmark.action_name_volley=volley
actors.buffs.snipersmark.action_name_sniper=sniper shot
actors.buffs.snipersmark.desc=The Sniper is honed in on the target she most recently attacked. She is able to perform a special attack with her bow which will vary based on how the bow is augmented.\n\nAn unaugmented bow will fire a _snapshot,_ which deals reduced damage but does not take any time to fire.\n\nA bow augmented for speed will fire a _volley_ of three arrows. Each arrow will deal reduced damage, but can still activate enchantment. This volley takes 1 turn to shoot.\n\nA bow augmented for damage will fire a _sniper shot._ This shot is guaranteed to hit, deals bonus damage based on distance from the target, and takes 2 turns to fire.\n\nTurns remaining: %s.
actors.buffs.soulmark.name=soul marked
actors.buffs.soulmark.desc=The warlock has tapped into the soul of this creature, allowing him to heal as it takes physical damage.\n\nTurns of soul mark remaining: %s.
actors.buffs.stamina.name=stamina
actors.buffs.stamina.desc=You have unending stamina, allowing for faster movement!\n\nWhile under the effects of stamina you will run at +50%% speed, but will perform all other actions at normal speed.\n\nTurns of stamina remaining: %s.
actors.buffs.vulnerable.name=vulnerable
actors.buffs.vulnerable.heromsg=You feel fragile!
actors.buffs.vulnerable.desc=Vulnerability magic increases all physical damage that a character takes by 33%%, after that damage has been reduced by armor.\n\nTurns of vulnerable remaining: %s.
actors.buffs.terror.name=terrified
actors.buffs.terror.desc=Terror is manipulative magic which forces its target into an uncontrollable panic.\n\nTerrified characters are forced to run away from their opponent, trying to put as many doors and walls between them as possible. The shock of pain will lessen the duration of terror, however.\n\nTurns of terror remaining: %s.
actors.buffs.toxicimbue.name=imbued with toxicity
actors.buffs.toxicimbue.desc=You are imbued with poisonous energy!\n\nAs you move around toxic gas will constantly billow forth from you, damaging your enemies. You are immune to toxic gas and poison for the duration of the effect, as well as for a few turns afterward.\n\nTurns of toxic imbue remaining: %s.
actors.buffs.corrosion.name=corrosion
actors.buffs.corrosion.heromsg=You are melting!
actors.buffs.corrosion.ondeath=You melt away...
actors.buffs.corrosion.rankings_desc=Dissolved
actors.buffs.corrosion.desc=Powerful acid melts away flesh, metal, and bone at an alarming rate.\n\nCorrosion damage increases over time, as the target continues to melt away.\n\nTurns of corrosion remaining: %1$s.\nCurrent corrosion damage: %2$d.
actors.buffs.vertigo.name=vertigo
actors.buffs.vertigo.desc=Walking in a straight line can be difficult when the whole world is spinning.\n\nWhile under the effects of vertigo, characters who attempt to move will go in a random direction, instead of the one they intended to go in.\n\nTurns of vertigo remaining: %s.
actors.buffs.wandempower.name=wands empowered
actors.buffs.wandempower.desc=Your damage-dealing wands have been empowered, increasing the amount of damage they deal for a few hits.\n\nBonus damage: %1$d.\nHits remaining: %2$d.
actors.buffs.weakness.name=weakened
actors.buffs.weakness.heromsg=You feel weakened!
actors.buffs.weakness.desc=Everything suddenly seems much heavier.\n\nWeakening magic reduces a character's physical strength, causing them to deal 33%% reduced damage.\n\nTurns of weakness remaining: %s.
actors.buffs.wellfed.name=well fed
actors.buffs.wellfed.desc=You feel quite satisfied and full.\n\nWhile well fed, your hunger will not increase, and you will heal an additional amount of health over time.\n\nTurns remaining: %d.
actors.buffs.danceimmunebuff.name=immune to dance curse
actors.buffs.danceimmunebuff.desc=All dancing effects loses all its power for a short time, well extending the effect is not effective, you must wait for this effect to wear down before using the spell again.\n\nTurns of magic immunity remaining: %s.
actors.hero.abilities.armorability.self_target=You can't target yourself!
actors.hero.abilities.armorability.no_target=There's nothing to target there!
actors.hero.abilities.armorability.prompt=Choose a location to target
actors.hero.abilities.armorability.cost=Charge cost: _%d_
actors.hero.abilities.warrior.heroicleap.name=heroic leap
actors.hero.abilities.warrior.heroicleap.prompt=Choose direction to leap
actors.hero.abilities.warrior.heroicleap.short_desc=The Warrior performs a _Heroic Leap_ towards a targeted location, sailing above enemies and hazards.
actors.hero.abilities.warrior.heroicleap.desc=The Warrior leaps toward a targeted location, going over any enemies or hazards in the way. He cannot leap over walls or other solid terrain however.
actors.hero.abilities.warrior.shockwave.name=shockwave
actors.hero.abilities.warrior.shockwave.short_desc=The Warrior releases a _Shockwave_ in a conical AOE by slamming the ground. Enemies caught in the shockwave are damaged and crippled.
actors.hero.abilities.warrior.shockwave.desc=The Warrior slams the ground, producing a shockwave that travels up to 5 tiles in a 60 degree cone.\n\nEnemies caught in this shockwave are crippled for 5 turns. They also take 5-10 damage, plus an additional 1-2 damage for every point of strength the Warrior has above 10.
actors.hero.abilities.warrior.endure.name=endure
actors.hero.abilities.warrior.endure$enduretracker.name=endurance
actors.hero.abilities.warrior.endure$enduretracker.desc=The Warrior is now dealing bonus damage based on the damage he endured.\n\nBonus Damage: %1$d\nHits Left: %2$d
actors.hero.abilities.warrior.endure.short_desc=The Warrior _Endures_, skipping several turns but gaining high damage resistance. He then deals bonus damage based on what he endured.
actors.hero.abilities.warrior.endure.desc=The Warrior endures for 3 turns, taking half damage from all sources. This reduction is applied before damage resisting effects like armor.\n\nAfter enduring, the warrior's next hit within 10 turns gains bonus damage. This bonus damage is equal to half of all the damage inflicted on him while enduring, before any damage reduction effects!\n\nIf the Warrior has any combo, using this ability increases its remaining time by 3 turns.
actors.hero.abilities.mage.elementalblast.name=elemental blast
actors.hero.abilities.mage.elementalblast.no_staff=You can't use this ability without your staff.
actors.hero.abilities.mage.elementalblast.short_desc=The Mage emits an _Elemental Blast_ from his staff, covering a large area around him in an effect that varies based on the wand in his staff.
actors.hero.abilities.mage.elementalblast.desc=The Mage emits a blast of magic, which covers a circular region up to 4 tiles away and deals up to 15-25 damage. The specific effect of elemental blast will vary by the wand imbued in the Mage's staff.
actors.hero.abilities.mage.elementalblast.generic_desc=The effect of elemental blast will be similar to the effect of the wand when zapped at an enemy or ally.
actors.hero.abilities.mage.wildmagic.name=wild magic
actors.hero.abilities.mage.wildmagic.no_wands=You have no wands to zap with!
actors.hero.abilities.mage.wildmagic.short_desc=The Mage unleashes the _Wild Magic_ contained in his wands, randomly firing them multiple times at a chosen target over a single turn.
actors.hero.abilities.mage.wildmagic.desc=The Mage unleashes the power in his wands, randomly firing them up to 4 times in a single turn. The Mage's staff is not included in this effect.\n\nEach wand also has its level boosted by 2, up to +3. This ability uses half a wand charge for each zap, and no one wand can be fired more than 2 times.
actors.hero.abilities.mage.warpbeacon.name=warp beacon
actors.hero.abilities.mage.warpbeacon.depths=You can't warp between depths!
actors.hero.abilities.mage.warpbeacon.locked_floor=You cannot leave a locked floor!
actors.hero.abilities.mage.warpbeacon.too_far=That location is too far!
actors.hero.abilities.mage.warpbeacon.invalid_beacon=You can't place a beacon there!
actors.hero.abilities.mage.warpbeacon.window_desc=Your beacon is currently placed on floor %d.
actors.hero.abilities.mage.warpbeacon.window_tele=teleport to beacon
actors.hero.abilities.mage.warpbeacon.window_clear=clear beacon
actors.hero.abilities.mage.warpbeacon.window_cancel=cancel
actors.hero.abilities.mage.warpbeacon.short_desc=The Mage places a _Warping Beacon_ at his current location, which he can instantly teleport back to.
actors.hero.abilities.mage.warpbeacon.desc=The Mage places a beacon, which can then be warped to at will. Placing the beacon takes 1 turn, but warping to it is instantaneous.\n\nThe Mage cannot warp between floors by default, or use the beacon to reach inaccessible places such as locked rooms. The Mage can teleport into enemies, which will push them aside.
actors.hero.abilities.rogue.smokebomb.name=smoke bomb
actors.hero.abilities.rogue.smokebomb.fov=You can only jump to an empty location in your field of view
actors.hero.abilities.rogue.smokebomb.prompt=Choose a location to jump to
actors.hero.abilities.rogue.smokebomb$ninjalog.name=wooden decoy
actors.hero.abilities.rogue.smokebomb$ninjalog.desc=Somehow, enemies are easily convinced that this wooden decoy is the real Rogue!
actors.hero.abilities.rogue.smokebomb.short_desc=The Rogue throws down a _Smoke Bomb_ while blinking away. He blinds enemies near his old location.
actors.hero.abilities.rogue.smokebomb.desc=The Rogue throws down a smoke bomb and blinks up to 6 tiles away. He can blink through hazards and enemies, but not through solid terrain like walls.\n\nEnemies that are adjacent to the Rogue's old position will be blinded for 5 turns.
actors.hero.abilities.rogue.deathmark.name=death mark
actors.hero.abilities.rogue.deathmark.ally_target=You can only mark enemies
actors.hero.abilities.rogue.deathmark.short_desc=The Rogue places a _Death Mark_ on a chosen enemy. Marked enemies take bonus damage, but cannot die until the mark ends.
actors.hero.abilities.rogue.deathmark.desc=The Rogue places a mark on a chosen enemy, causing them to take 25% extra damage. The mark is applied instantly and lasts for 5 turns.\n\nMarked enemies take bonus damage but are unable to die until the mark expires. If an enemy has 0 HP when the mark ends, they will immediately die.
actors.hero.abilities.rogue.deathmark$deathmarktracker.name=marked for death
actors.hero.abilities.rogue.deathmark$deathmarktracker.desc=This enemy has been marked, causing them to take 25%% bonus damage, but also rendering them unable to die until the mark ends.\n\nTurns remaining: %s.
actors.hero.abilities.rogue.shadowclone.name=shadow clone
actors.hero.abilities.rogue.shadowclone.short_desc=The Rogue summons a _Shadow Clone_, which can be directed to aid him in combat.
actors.hero.abilities.rogue.shadowclone.desc=The Rogue summons a shadowy mimic of himself, which can be directed to aid him in combat. Directing the shadow clone does not cost any charge.\n\nThe clone has 80 HP, no armor, and deals 10-20 damage. All of these traits can be improved with talents, such that the clone benefits from weapons and armor the hero has.
actors.hero.abilities.rogue.shadowclone$shadowally.name=shadow rogue
actors.hero.abilities.rogue.shadowclone$shadowally.direct_defend=Your clone moves to that position.
actors.hero.abilities.rogue.shadowclone$shadowally.direct_follow=Your clone moves to follow you.
actors.hero.abilities.rogue.shadowclone$shadowally.direct_attack=Your clone moves to attack!
actors.hero.abilities.rogue.shadowclone$shadowally.desc=A copy of the Rogue, made from shadowy darkness. It stands stock still, with empty eyes and tiny wisps of darkness rising from it like steam.\n\nThe clone is not a perfect copy of the Rogue, but is still a decent fighter, and can benefit from the Rogue's equipment with the right talents.
actors.hero.abilities.huntress.spectralblades.name=spectral blades
actors.hero.abilities.huntress.spectralblades.short_desc=The Huntress throws _Spectral Blades_ at a target, inflicting damage depending on her currently equipped melee weapon.
actors.hero.abilities.huntress.spectralblades.desc=The Huntress throws out a spectral blade at an enemy, which acts like a ranged strike from her melee weapon. All of the normal effects of a melee weapon will activate, including enchantments.
actors.hero.abilities.huntress.naturespower.name=nature's power
actors.hero.abilities.huntress.naturespower.short_desc=The Huntress calls upon _Nature's Power_, increasing her movement speed and her bow's rate of fire for a short time.
actors.hero.abilities.huntress.naturespower.desc=The Huntress temporarily empowers herself and her bow with the power of nature! This lasts for 8 turns.\n\nDuring this time, the Huntress moves at 2x speed, and attacks 33% faster with her bow. The bonus bow effects do not trigger if the Sniper is using her special attacks.
actors.hero.abilities.huntress.naturespower$naturespowertracker.name=nature's power
actors.hero.abilities.huntress.naturespower$naturespowertracker.desc=The Huntress is briefly empowered, increasing her movement speed and attack speed with her bow.\n\nTurns remaining: %s.
actors.hero.abilities.huntress.spirithawk.name=spirit hawk
actors.hero.abilities.huntress.spirithawk.no_space=There is no free space near you.
actors.hero.abilities.huntress.spirithawk.short_desc=The Huntress summons a _Spirit Hawk_ familiar, which can help her scout locations and distract enemies.
actors.hero.abilities.huntress.spirithawk.desc=The Huntress summons a spirit hawk familiar, which can be directed by using the ability again while it is summoned. The hawk lasts for 100 turns, directing the hawk does not cost any charge.\n\nThe hawk has minimal health and attacking power, but is fast, evasive, and accurate. It shares its entire field of vision with the Huntress at all times. It is immune to all area-bound effects, such as fire and poison gas. It will not attack unless specifically directed to.
actors.hero.abilities.huntress.spirithawk$hawkally.name=spirit hawk
actors.hero.abilities.huntress.spirithawk$hawkally.direct_defend=Your hawk moves to that position.
actors.hero.abilities.huntress.spirithawk$hawkally.direct_follow=Your hawk moves to follow you.
actors.hero.abilities.huntress.spirithawk$hawkally.direct_attack=Your hawk moves to attack!
actors.hero.abilities.huntress.spirithawk$hawkally.desc=A magical hawk, summoned by the Huntress. It glows a bright ethereal blue, its head constantly shifts around as it surveys the area.\n\nWhile it isn't much of a fighter its speed and vision make it excellent for scouting and distracting enemies.
actors.hero.abilities.huntress.spirithawk$hawkally.desc_remaining=Turns remaining: %d.
actors.hero.abilities.huntress.spirithawk$hawkally.desc_dodges=Guaranteed dodges remaining: %d.
actors.hero.abilities.duelist.challenge.name=challenge
actors.hero.abilities.duelist.challenge.prompt=Choose an enemy to challenge
actors.hero.abilities.duelist.challenge.already_dueling=You can only be in one duel at a time.
actors.hero.abilities.duelist.challenge.ally_target=You can only challenge enemies.
actors.hero.abilities.duelist.challenge.unreachable_target=You must be able to reach your target.
actors.hero.abilities.duelist.challenge.distant_target=That enemy is too far away to challenge.
actors.hero.abilities.duelist.challenge.short_desc=The Duelist _Challenges_ a nearby enemy to a duel, temporarily freezing all other enemies.
actors.hero.abilities.duelist.challenge.desc=The Duelist challenges a nearby enemy to a duel. That enemy is compelled to fight her while all other enemies are temporarily frozen in time.\n\nThe target must be reachable and within 5 tiles of the Duelist. The duel lasts until 10 turns pass, the enemy dies, or the Duelist is more than 5 tiles away from the enemy.\n\nFrozen enemies are invulnerable. The Duelist's allies are not frozen by this ability, but if a boss is targeted its minions will not be frozen either.
actors.hero.abilities.duelist.challenge$duelparticipant.name=duel participant
actors.hero.abilities.duelist.challenge$duelparticipant.desc=This character is participating in a duel. They, and any of their allies or minions, are allowed to act normally while others are frozen.\n\nThe duel will last for a set amount of time, until one participant dies, or until the participants move more than 5 tiles away from eachother.\n\nTurns remaining: %d.
actors.hero.abilities.duelist.elementalstrike.name=elemental strike
actors.hero.abilities.duelist.elementalstrike.short_desc=The Duelist performs an _Elemental Strike_, spreading an effect in a conical AOE based on her weapon enchantment.
actors.hero.abilities.duelist.elementalstrike.desc=The Duelist strikes an enemy or location, performing a regular attack that's guaranteed to hit and spreading a magical effect that travels up to 4 tiles in a 65 degree cone. This magical effect varies based on the enchantment on the Duelist's primary weapon.
actors.hero.abilities.duelist.elementalstrike.generic_desc=An elemental strike with no enchantment will release a small burst of magic, dealing 6-12 damage to all enemies in range.
actors.hero.abilities.duelist.feint.name=feint
actors.hero.abilities.duelist.feint.prompt=Choose a location to dash to
actors.hero.abilities.duelist.feint.too_far=That location is not adjacent to you.
actors.hero.abilities.duelist.feint.bad_location=You can't move to that location.
actors.hero.abilities.duelist.feint.short_desc=The Duelist _Feints_, faking an attack while dashing to an adjacent tile. Enemies will attack her afterimage, leaving them open to a counterattack.
actors.hero.abilities.duelist.feint.desc=The Duelist fakes an attack while dashing to an adjacent tile, leaving behind a momentary afterimage of herself. Enemies that were attacking the Duelist will attack her afterimage instead.\n\nEnemies that attack the afterimage become confused, which cancels their next action and leaves them open to a surprise attack.
actors.hero.abilities.ratmogrify.name=ratmogrify
actors.hero.abilities.ratmogrify.cant_transform=You can't ratmogrify that!
actors.hero.abilities.ratmogrify.too_strong=That enemy is too strong to ratmogrify!
actors.hero.abilities.ratmogrify.short_desc=The hero _Ratmogrifies_ an enemy! This temporarily turns them into a rat with no abilities.
actors.hero.abilities.ratmogrify.desc=The hero transforms an enemy into a rat for 6 turns! Bosses, allies, and rats cannot be ratmogrified.\n\nRatmogrified enemies retain their original stats, but do not have any abilities.
actors.hero.abilities.ratmogrify$transmograt.name=ratmogrified %s
actors.hero.abilities.ratmogrify$transmograt.desc=This enemy has been transformed into a rat. A big improvement, if you ask me! - Rat King
actors.hero.abilities.ratmogrify$transmograt.rankings_desc=Slain by: ratmogrified enemy
actors.hero.abilities.ratking.legacywrath.name=divine fury
actors.hero.abilities.ratking.legacywrath.short_desc=I unleash my _Divine Fury_ upon my enemies. It leaves me exposed for a few turns and drains all my armor charge. Everything must come at price!
actors.hero.abilities.ratking.legacywrath.desc=I unlock the ability to channel overwhelming power. With it, I can blink to any nearby location no further than 6 tiles, blinding any enemies adjacent to my old location. Once there, I will cast a spell of magical earth on everyone I can see in 6 tiles area (the effect depends on talents) and create a fan of spectral blades targeting any mob within 6 tiles of me before turning invisible.\n\nThis ability takes 2 turns to leap, 1 turn to rooting earth, and one turn to spectral blades, though using this with no enemies in sight will skip the attacking.\n\nUnfortunately, _I have to use all of my armor charge or 33% of my current HP_ to get enough power for this ability.
actors.hero.hero.name=you
actors.hero.hero.leave=You can't leave yet, the rest of the dungeon awaits below!
actors.hero.hero.level_up=Level up!
actors.hero.hero.new_level=Level up! +Accuracy, +Evasion, +5 HP!
actors.hero.hero.new_talent=+1 Talent Point!
actors.hero.hero.unspent=You have unspent talent points!
actors.hero.hero.level_cap=You cannot grow stronger, but your experiences do give you a surge of power!
actors.hero.hero.you_now_have=you picked up: %s.
actors.hero.hero.you_cant_have=you can't carry: %s.
actors.hero.hero.locked_chest=This chest is locked and you don't have a matching key.
actors.hero.hero.locked_door=You don't have a matching key.
actors.hero.hero.noticed_smth=You noticed something.
actors.hero.hero.wait=...
actors.hero.hero.search=search
actors.hero.hero.search_distracted=It's hard to concentrate, searching is exhausting.
actors.hero.hero.pain_resist=The pain helps you resist the urge to sleep.
actors.hero.hero.revive=The ankh explodes with life-giving energy!
actors.hero.heroclass.warrior=warrior
actors.hero.heroclass.warrior_desc_short=The Warrior endures extra damage with shielding granted by his _broken seal._ The seal can be moved between armors and _transfers a single upgrade._
actors.hero.heroclass.warrior_desc=The Warrior starts with a _unique broken seal_ that generates shielding over his health. The seal can be moved between armors, and can _transfer a single upgrade_ with it.\n\nThe Warrior also starts with a _worn shortsword_, _three throwing stones_, cloth armor, a waterskin, and a velvet pouch.\n\nThe Warrior automatically identifies:\n_-_ Scrolls of Identify\n_-_ Potions of Healing\n_-_ Scrolls of Rage
actors.hero.heroclass.warrior_unlock=The Warrior is automatically unlocked.
actors.hero.heroclass.warrior_perk_desc=The Warrior gains _non-stackable 1 + (5% of current STR rounded down)_ temporary strength within _60 + (5 * current level) turns_ from eating and will be protected from taking any damage for duration of eating.\n\nThe Warrior can blind any enemy for _5 turns_ by throwing non-missiles at it. This ability has _40 turns_ cooldown.\n\nThe Warrior has _15%_ more strength, rounded down.\n\nThe Warrior can transfer any glyphs with his seal.\n\nThe Warrior regenerates his health and shielding _two times_ faster than usual.
actors.hero.heroclass.mage=mage
actors.hero.heroclass.mage_desc_short=The Mage is an arcane expert and carries a _magical staff_ that's stronger than a wand. The staff can be _imbued with any wand_ the Mage finds.
actors.hero.heroclass.mage_desc=The Mage starts with a _unique staff_, which recharges significantly faster than a wand and has 1 more charge. The staff _can be imbued with any wand_ the Mage finds in the dungeon.\n\nThe Mage also starts with a _wand of magic missile_ imbued in his staff, cloth armor, a waterskin, and a velvet pouch.\n\nThe Mage automatically identifies:\n_-_ Scrolls of Identify\n_-_ Potions of Liquid Flame\n_-_ Scrolls of Upgrade
actors.hero.heroclass.mage_unlock=To unlock the Mage _use a scroll of upgrade to make an item stronger._
actors.hero.heroclass.mage_perk_desc=The Mage gets _12 turns_ of recharging from eating.\n\nThe Mage instantly identifies any wands he picks up.\n\nThe Mage can self-target with a wand to convert all of its charges into shielding at a rate of _10.5% max HP per charge_.\n\nWhen the Mage zaps an enemy, he gains mind vision on them for _10 turns_.\n\nWhen the Mage reads a scroll, his next _3 wand zaps_ will get +(hero level/5) levels. He also has _33% chance_ to get scroll from the enemy.
actors.hero.heroclass.rogue=rogue
actors.hero.heroclass.rogue_desc_short=The Rogue can evade enemies and strike from invisibility using his _cloak of shadows._ He also _detects secrets and traps_ from a greater distance.
actors.hero.heroclass.rogue_desc=The Rogue starts with a _unique Cloak of Shadows_, which he can use to become invisible at will.\n\nThe Rogue can _detect secrets and traps_ from a greater distance.\n\nThe Rogue also starts with _a dagger_, _three throwing knives_, cloth armor, a waterskin, and a velvet pouch.\n\nThe Rogue automatically identifies:\n_-_ Scrolls of Identify\n_-_ Potions of Invisibility\n_-_ Scrolls of Magic Mapping
actors.hero.heroclass.rogue_unlock=To unlock the Rogue _perform 10 surprise attacks in one game._
actors.hero.heroclass.rogue_perk_desc=The Rogue will not wake sleeping enemies while he is _3 or more tiles away from them_.\n\nThe Rogue can search in _7x7_ area and will knock adjacent enemies away with chip damage while searching.\n\nThe Rogue can use Cloak of Shadows without equipping it but it will recharge at 66% speed.\n\nOn using Scroll of Upgrade, the Rogue will charge all his wands by _1_ charge and get _10 turns_ worth of artifact recharging.\n\nThe Rogue's bombs deal _150%_ more damage and drop from any enemy with 10% chance.
actors.hero.heroclass.huntress=huntress
actors.hero.heroclass.huntress_desc_short=The Huntress is a master of thrown weapons and has a _magical bow_ with infinite arrows. She also travels through tall grass _without trampling it._
actors.hero.heroclass.huntress_desc=The Huntress starts with a _unique spirit bow_, which can fire an infinite number of conjured arrows.\n\nThe Huntress can travel through tall grass _without trampling it_.\n\nThe Huntress also starts with _studded gloves_, cloth armor, a waterskin, and a velvet pouch.\n\nThe Huntress automatically identifies:\n_-_ Scrolls of Identify\n_-_ Potions of Mind Vision\n_-_ Scrolls of Lullaby
actors.hero.heroclass.huntress_unlock=To unlock the Huntress _hit enemies with thrown weapons 10 times in one game._
actors.hero.heroclass.huntress_perk_desc=The Huntress identifies equipment _3x_ faster.\n\nWhen the Huntress steps on short grass or embers, they spring up into tall grass which the Huntress immediately furrows. This has a _5 turn cooldown_. This talent will produce furrowed grass if passive regeneration effects are disabled or the hero has not gained exp in a long time.\n\nThe Huntress gains mind vision on any enemy within _3 tiles of her position_.\n\nThe Huntress gets _5 turns_ of adrenaline from eating.\n\nThe Huntress has 8% chance to get _1-3_ alchemical energy after killing the enemy.
actors.hero.heroclass.rat_king=rat king
actors.hero.heroclass.rat_king_desc_short=My short description is than I am awesome as king could possibly be!
actors.hero.heroclass.rat_king_desc=Why choose a class when I could just go as myself?\n\nAs myself, I take all the special class items I could find: an old seal, a staff made by some mage, a priceless cloak of shadows from my treasury, and a bow from my armory.\n\nI start with all my class items, obviously. Also I've already acquired all the bags, so I start with those too.\nI can also detect traps and secrets from a greater distance.\
actors.hero.heroclass.rat_king_perk_desc=What? I don't need any help! I am strong enough by myself!
actors.hero.heroclass.duelist=duelist
actors.hero.heroclass.duelist_desc_short=The Duelist is a weapons master who can use her weapon to trigger a _special weapon ability._ This special ability is _different for every weapon._
actors.hero.heroclass.duelist_desc=The Duelist starts with a _unique rapier_ with a special ability that recharges over time.\n\nEvery weapon in the game has a _different special ability_ that the Duelist can use.\n\nThe Duelist also starts with _two throwing spikes_, cloth armor, a waterskin, and a velvet pouch.\n\nThe Duelist automatically identifies:\n_-_ Scrolls of Identify\n_-_ Potions of Strength\n_-_ Scrolls of Mirror Image
actors.hero.heroclass.duelist_unlock=To unlock the Duelist _equip a tier 2 or higher weapon with no strength penalty._
actors.hero.heroclass.duelist_perk_desc=The Duelist gets _2 weapon charge_ and bonus melee damage equal to _level/2_ on eating.\n\nThe Duelist gains one weapon charge every _10 turns_ and deals _+8%_ melee damage when under the effect of wand or artifact recharging buffs.\n\nThe Duelist can switch her equipped weapon instantly _twice within 5 turns_, with a 20 turn cooldown.\nIf this ability is not on cooldown, quick-using an unequipped weapon will equip it.\n\nIf the Duelist's ability manages to kill any enemy, she will restore HP equal to _her level_.\n\nThe Duelist gets _+50%_ enchantment power for her attacks.
actors.hero.herosubclass.gladiator=gladiator
actors.hero.herosubclass.berserker=berserker
actors.hero.herosubclass.berserker_short_desc=The _Berserker_ builds rage as he takes damage. Rage increases his damage and can be activated at 100% for bonus shielding.
actors.hero.herosubclass.berserker_desc=The Berserker gains rage as he takes physical damage, including damage that gets blocked by his armor! Rage steadily fades away over time, but fades more slowly if he is at low HP.\n\nThe Berserker deals up to +50% damage at 100% rage. At 100% rage he can also go berserk, gaining 2-6x his seal's maximum shielding depending on his missing health and keeping his rage at 100% as long as he has shielding left. However, the Berserker needs time to recover after he goes berserk.\n\nHis rage will trigger enchantments and curses up to 60% more frequently and decay much slower.
actors.hero.herosubclass.gladiator_short_desc=The _Gladiator_ builds combo when he makes successful attacks. He can spend combo to use unique abilities.
actors.hero.herosubclass.gladiator_desc=The Gladiator builds one point of combo every time he makes a successful attack with a melee or thrown weapon. If the Gladiator does not make a successful attack within 5 turns, his combo is reset.\n\nAs combo builds it unlocks various abilities which he can spend his combo to use:\n2 Combo: knock enemy back, preserves combo; when combo is 7 or higher, knockback range increases to 3, it inflicts vertigo, and it can knock enemies into pits\n4 Combo: deal damage based on armor\n6 Combo: parry, preserves combo; when combo is 9 or higher, works on multiple attacks\n8 Combo: damage target and nearby enemies\n10 Combo: attack once for each combo\n\nWhen the Gladiator kills an enemy, the combo cooldown for his next hit is increased to _50 turns_.\n\nThe Gladiator can leap up to combo/3 tiles when using combo-spending attacks.
actors.hero.herosubclass.battlemage=battlemage
actors.hero.herosubclass.battlemage_short_desc=The _Battlemage_ conjures bonus effects when fighting in melee with his staff. These effects depend on the wand his staff is imbued with.
actors.hero.herosubclass.battlemage_desc=The Battlemage gains a bonus effect whenever he strikes in melee with his staff, as if his staff had an additional enchantment. These effects depend on the wand his staff is imbued with, every wand has its own effect. In addition to the wand effects, the Battlemage's staff will also gain 0.5 charges when he strikes with it.\n\nThe Battlemage's first melee strike with his staff after zapping with it deals double damage and staff's bonus effect gets +300% power.\n\nStriking with his staff grants the Battlemage _2 turns_ worth of artifact recharging.
actors.hero.herosubclass.warlock=warlock
actors.hero.herosubclass.warlock_short_desc=The _Warlock_ has a chance to soul mark enemies with his wands. He will heal whenever he deals physical damage to marked enemies.
actors.hero.herosubclass.warlock_desc=The Warlock has a chance to inflict a soul mark on characters when he uses wands on them. The chance to apply a soul mark and its duration increase with wand level.\n\nWhen an enemy is soul marked, the Warlock will heal 2 hp for every 5 damage he deals to them, but only with attacks from melee or thrown weapons, not from wands!\n\nWhen a soul marked enemy dies, the Warlock has a _50% chance_ to raise them as a corrupted wraith.\n\nSoul mark grants 1.5 turns of satiety for each physical damage dealt. Soul marked enemies have a 40% chance to trigger on-eat effects when they die.
actors.hero.herosubclass.assassin=hunter
actors.hero.herosubclass.assassin_short_desc=The _Hunter_ marks enemies with his bbat and inflicts debuffs with it.
actors.hero.herosubclass.assassin_desc=The _Hunter_ is trained to control darkness and use it to hunt targets with his bbat. His pet marks enemies and progressively does more damage. When any enemy is marked, the hunter can blink to it, inflicting debuffs and healing bbat depending on strength of mark.
actors.hero.herosubclass.freerunner=freerunner
actors.hero.herosubclass.freerunner_short_desc=The _Freerunner_ builds momentum as he runs, which can be used to start freerunning. This grants him bonus speed and evasion for a short while.
actors.hero.herosubclass.freerunner_desc=As the Freerunner moves he builds stacks of momentum. He can gain up to 10 momentum after running for 10 turns, but rapidly loses it if he stops moving. The freerunner can use up his momentum to start freerunning, for 2 turns per point of momentum.\n\nWhen freerunning the Freerunner moves at 2x speed, and gains bonus evasion in proportion to his level. Once freerunning ends there is a cooldown before momentum can be built again.\n\nWhile freerunning, the Freerunner gains 2x accuracy and +50% damage with thrown weapons.\n\nThe Freerunner moves at 2x speed while invisible, regardless of whether he is freerunning or not.
actors.hero.herosubclass.sniper=sniper
actors.hero.herosubclass.sniper_short_desc=The _Sniper_ can pierce armor with her ranged attacks. After striking with a thrown weapon she can follow up with a special attack from her bow.
actors.hero.herosubclass.sniper_desc=The Sniper is a master of ranged combat, whose ranged attacks pierce enemy armor. When she attacks an enemy with a thrown weapon, she places a sniper's mark on them, which lets her follow up with a special attack from her bow. This special attack varies based on how her bow is augmented.\n\nAn unaugmented bow will fire a snapshot which deals reduced damage but fires instantly. A speed bow will fire a volley of three arrows which deal reduced damage, can still activate enchantments, and take 1 turn to fire. A damage bow will fire a sniper shot which is guaranteed to hit, deals bonus damage based on distance, and takes 2 turns to fire.\n\nThrown weapons have a 100% chance to use the enchantment on the Sniper's bow.\nThis ability does not apply to darts shot from an enchanted crossbow, they already trigger the crossbow's enchantment.\n\nWhen the Sniper attacks with an upgraded thrown weapon, each level increases the duration of sniper's mark by 1 turn and the damage of her special attack by _33%_.
actors.hero.herosubclass.warden=warden
actors.hero.herosubclass.warden_short_desc=The _Warden_ can see through tall grass and gains bonus effects when she plants seeds and tramples plants.
actors.hero.herosubclass.warden_desc=The Warden has a strong connection to nature which grants her a variety of bonus effects relating to grass and plants. She is able to see through tall and furrowed grass as if it were empty space.\n\nThe Warden causes grass to sprout up around any seed she throws or plants, and gains special effects when trampling plants. These special effects replace the regular plant effects, meaning that no plant is harmful for her to step on.\n\nDewdrops can shield the Warden when her health is full, up to _100% of her max HP_.\n\nTipped darts have _5x durability_ when the Warden uses them.
actors.hero.herosubclass.king=rat king
actors.hero.herosubclass.king_short_desc=Choosing is so boring, I'd rather just pick _all the subclasses_...
actors.hero.herosubclass.king_desc=Rat King can use all subclasses at once!\n\nNot all perks are transferred to Rat King's subclass powers.
actors.hero.herosubclass.champion=champion
actors.hero.herosubclass.champion_short_desc=The _Champion_ can wield two weapons and gets more weapon charges. Her regular attacks use her primary weapon, but she can swap weapons and use either weapon's ability.
actors.hero.herosubclass.champion_desc=The Champion is a master of melee weapons who can equip a secondary weapon in addition to her primary one. Her regular attacks use her primary weapon, but she can swap her primary weapon instantly and use either weapon's ability.\n\nShe also gains 2 more max weapon ability charges and +50% weapon ability recharge speed.\n\nIf one of the Champion's two equipped weapons has a lower level and is _the same tier or lower_ than the other weapon, it will be boosted to the other weapon's level.\n\nIf the Champion uses two different weapon abilities successively, the second ability will execute any non-boss enemy left at _below 35% HP_.\n\nThe Champion instantly regains _1 weapon charge_ when she uses two different weapon abilities, with no time limit.
actors.hero.herosubclass.monk=monk
actors.hero.herosubclass.monk_short_desc=The _Monk_ builds energy while fighting. This energy can be spent on a variety of unique abilities.
actors.hero.herosubclass.monk_desc=The Monk is a master of physical technique. As she defeats enemies, she gains energy which can be used on a variety of defensive and utility-focused abilities. This energy does not fade over time, but has a cap based on the Monk's level.\n\n1 Energy: quickly strike with fists\n2 Energy: focus to dodge next attack\n3 Energy: instantly dash nearby\n4 Energy: kick an enemy away\n5 Energy: meditate to restore charges\n\nThe Monk gains _25% more energy_ for each piece of _natural tier 3_ equipment she is using.\nThe Monk gains _50% more energy_ for each piece of _natural tier 2_ equipment she is using.\nThe Monk gains _100%_ for each piece of _natural tier 1_ equipment she is using. She also gains _150% more energy_ if she has no weapon (or ring of force), and gains a free cloth armor and studded gloves.\n\nIf the Monk uses a weapon ability and a _2+ energy_ ability successively, she regains 50% of her spent energy and resets her ability cooldown.\n\nIf the Monk has _70% or more energy_, her abilities are empowered. When empowered:\n- Flurry applies enchantments at 75% power\n- Focus is instantaneous\n- Dash gains +2 range\n- Dragon Kick deals +33% damage and applies its knock back and stun effect to all adjacent enemies\n- Meditate slowly heals 20% of missing HP and grants 80% damage resistance.
actors.hero.talent$provokedangertracker.name=provoked anger
actors.hero.talent$provokedangertracker.desc=The Warrior has recently lost his shielding, his next physical attack will deal bonus damage.\n\nTurns remaining: %s.
actors.hero.talent$lingeringmagictracker.name=lingering magic
actors.hero.talent$lingeringmagictracker.desc=The Mage has recently used a staff or wand, his next physical attack will deal bonus damage.\n\nTurns remaining: %s.
actors.hero.talent$followupstriketracker.name=followup strike
actors.hero.talent$followupstriketracker.desc=The Huntress has recently attacked an enemy with a thrown weapon, her next melee attack against the same target will have boosted damage.\n\nTurns remaining: %s.
actors.hero.talent$patientstriketracker.name=patient strike
actors.hero.talent$patientstriketracker.desc=The Duelist has just spent a turn waiting, her next melee attack will deal bonus damage.
actors.hero.talent$improvisedprojectilecooldown.name=improvised projectiles cooldown
actors.hero.talent$improvisedprojectilecooldown.desc=You have recently used this talent, and must wait before using it again.\n\nTurns remaining: %s.
actors.hero.talent$rejuvenatingstepscooldown.name=rejuvenating steps cooldown
actors.hero.talent$rejuvenatingstepscooldown.desc=You have recently used this talent, and must wait before using it again.\n\nTurns remaining: %s.
actors.hero.talent$seershotcooldown.name=seer shot cooldown
actors.hero.talent$seershotcooldown.desc=You have recently used this talent, and must wait before using it again.\n\nTurns remaining: %s.
