challenges.no_food=Je fasto
challenges.no_food_desc=Krom tio ke manĝaĵoj estas maloftaj, vi devos atenti viajn porciojn!\n\n– porcioj de manĝaĵo kaj korno de abundo satigas je triona efikeco\n– aliaj fontoj de sateco havas la saman efikecon
challenges.no_armor=Kredo defendu min!
challenges.no_armor_desc=Vi bezonos kredi je vi, ĉar via defendaĵo ne ŝirmos vin sufiĉe efike!\n\n– baza defendo de ĉiu defendaĵo reduktita escepte de ŝtofa defendaĵo\n– plibonigoj al defendaĵo estos tre malefikaj\n– defenda povo de la tera gardisto ankaŭ estos signife reduktita
challenges.no_healing=Sen drogoj
challenges.no_healing_desc=Eliksiroj de sanoj estas utilaj, bedaŭrinde vi havas alergion kontraŭ ili!\n\n– eliksiroj de sano, aĵoj havantaj eliksiron de sano en sia recepto kaj sunfruktoj venenas la heroon anstataŭ sanigi lin\n– nestabilaj infuzaĵoj ne povas hazarde veneni aŭ sanigi la heroon\n– la menciitaj aĵoj plue norme funkcias sur aliaj estaĵoj
challenges.no_herbalism=Senfrukta tero
challenges.no_herbalism_desc=Verŝajne estas neniom da pura akvo en tiu ĉi malbenita labirinto…\n\n- roseroj estas forigitaj\n- vegetaĵoj estas forigitaj\n- semoj plue aperas, sed ne planteblas
challenges.swarm_intelligence=Svarma intelekto
challenges.swarm_intelligence_desc=Estu singarda, labirintaj monstroj iĝas pli sagacaj!\n\n- kiam malamiko rigardas vin, proksimaj malamikoj venas al tiu loko
challenges.darkness=Mallumen
challenges.darkness_desc=Tio estas ja subtera labirinto!\n\n– norma vid-distanco estas malpliigita\n– torĉo aperas en ĉiu keletaĝo\n– aliaj lumfontoj havas 1/5 efikecon
challenges.no_scrolls=Malpermesataj runoj
challenges.no_scrolls_desc=Trovi kelkan runon estas pli malfacila. Domaĝe ĉiam temas pri la plej uzebla.\n\n- duono de skribrulaĵoj de plibonigo estas forigita
challenges.champion_enemies=Minacaj majstroj
challenges.champion_enemies_desc=Vi ne estas la ununura, kiu povas pliniveliĝi!\n\nKutimaj monstroj havas 1/8 ŝancon por aperi kun la speciala efiko ”majstro” en la 1-a keletaĝo, pliigante ŝancon al 1/6 en la keletaĝo 21-a.\n\n– majstroj ĉiam aperas kiel vekaj\n– la heroo scias, kiam majstro aperas en keletaĝo\n– majstroj estas nekonverteblaj al amikoj\n\nEstas ses specoj de majstroj:\n_majstroj de fajro (oranĝaj):_ +25% al senpera atako, bruligas je frapo, disvastigas fajron je morto, ne povas fajrigi akvajn kahelojn\n_majstroj de foraj atakoj (violkoloraj):_ +25% al senpera atako, +3 al atakatingo\n_majstroj de malmagio (verdaj):_ -50% ricevataj vundoj, rezistaj al magiaj efikoj\n_gigantaj majstroj (bluaj):_ -80% ricevataj vundoj,, +1 al atakatingo, ne povas moviĝi en mallarĝaj koridoroj\n_benaj majstroj (flavaj):_ 4-obligitaj precizo kaj evitpovo \n_kreskantaj majstroj (ruĝaj):_ +20% al precizo, evitpovo, vundpovo kaj sanpoentoj; pliiĝas je 1% dum ĉiuj 4 temperoj
challenges.stronger_bosses=Fortaj supermonstroj
challenges.stronger_bosses_desc=Supermonstroj estas pli fortaj kun tiu ĉi defio!\n\n_Ŝmiraĵego:_ +20% al sano\n_–_ saniĝas en akvo je 3 poentoj/tempero\n_–_ pumpas sin dum 1 tempero (anstataŭ 2)\n_Tenguo:_ +25% al sano\n_–_ fazo 1.: kaptiloj estas pli mortigaj\n_–_ fazo 2.: artifikoj estas pli oftaj\n_DM-300:_ +33% al sano\n_–_ elektrofostoj estas pli solidaj kaj 3 aktiviĝas\n_–_ specialaj atakoj estas pli fortaj kaj pli oftaj\n_–_ pli rapida dum esti superŝargita\n_–_ malkovritaj kabloj estas 2× pli oftaj\n_Reĝo de Gnomoj:_ +50% al sano\n_–_ pli fortaj servistoj dum ĉiuj fazoj\n_–_ fazo 1.: pli oftaj specialaj atakoj kaj alvokoj de servistoj\n_–_ fazo 2.: 2-foje pli da servistoj dum batalfazo\n_–_ fazo 3.: sano ×2, pli oftaj alvokoj\n_Jog-Dzeva:_\n_–_ alvokas du pugnojn samtempe\n_–_ +60% al vundpovo pro mortiga radio\n_–_ pli fortaj servistoj

