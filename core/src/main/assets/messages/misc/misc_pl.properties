challenges.no_food=On diet
challenges.no_food_desc=Food's already scarce, but you have to watch your portions as well!\n\n- Food and the horn of plenty are one seventh as effective at satisfying hunger\n- Other sources of satiety are unaffected
challenges.no_armor=Faith is my armor
challenges.no_armor_desc=You'll need faith in yourself, as your armor won't do much!\n\n- Base blocking power reduced for all armor except cloth\n- All armor now gains very little blocking when upgraded\n- Earthen guardian's defensive power is also significantly reduced\n\n- Each taken damage gets 1.005x higher
challenges.no_healing=Pharmacophobia
challenges.no_healing_desc=Healing potions sure are handy, unfortunately you're allergic!\n\n- Potions of healing, items that use potions of healing in their recipe, and sunfruit will poison the hero instead of healing them\n- Unstable brews cannot randomly poison or heal the hero\n- These items still work normally for other characters.
challenges.no_herbalism=Barren land
challenges.no_herbalism_desc=There seems to be no clean water left in this accursed dungeon...\n\n- Dew drops are removed\n- Plants are removed\n- Seeds still appear, but will not take root
challenges.swarm_intelligence=Swarm intelligence
challenges.swarm_intelligence_desc=Watch out, the dungeon monsters are getting smarter!\n\n- When an enemy notices you, all enemies are drawn to that location\n\n- No enemy is capable of sleeping anymore\n\n- Your allies will turn into enemies as soon as they see you
challenges.darkness=Into darkness
challenges.darkness_desc=It is a dungeon after all!\n\n- Regular visible distance dramatically reduced\n- Two torches appears on each floor\n- Light buff lasts for less time
challenges.no_scrolls=Forbidden runes
challenges.no_scrolls_desc=A certain rune is harder to find. Unfortunately, it's always the most useful one.\n\n- All of the dungeon's upgrade scrolls are removed\n\n- Grinding them with experience takes significantly more effort\n- Level requirements are now 20% less
challenges.champion_enemies=Hostile champions
challenges.champion_enemies_desc=You're not the only one who can level up!\n\n- Regular enemies have a 1/10 chance to spawn with a special champion buff\n- Champions wake up if they spawn asleep\n- The hero knows when a champion spawns\n- Champions are immune to corruption\n\nThere are ten types of champion enemy.
challenges.stronger_bosses=Badder bosses
challenges.stronger_bosses_desc=Bosses are much tougher with this challenge!\n\n_Goo:_ +20% health\n_-_ Healing in water ramps up, to 3/turn\n_-_ Pumps up in 1 turn instead of 2\n_Tengu:_ +25% health\n_-_ Phase 1: traps are much deadlier\n_-_ Phase 2: abilities are more frequent\n_DM-300:_ +33% health\n_-_ Pylons are tougher and 3 activate\n_-_ Abilities are more powerful and frequent\n_-_ DM-300 is faster when supercharged\n_-_ Exposed wires are twice as common\n_Dwarf King:_ +50% health\n_-_ Minions are stronger in all phases\n_-_ Phase 1: faster abilities and summons\n_-_ Phase 2: 2 more minions per round\n_-_ Phase 3: 2x health, faster summons\n_Yog-Dzewa:_\n_-_ Two fists are summoned at a time!\n_-_ +60% laser damage\n_-_ Stronger minions
challenges.for_the_worthy=For the worthy
challenges.for_the_worthy_desc=When you have the worst possible luck, and wanted to become a legend. This challenge is for you!\n\n_-_ Loots in the dungeon are halved\n_-_ Elixir of Might and Tube of Strengthened Luck has no effect\n_-_ Defense is useless in this dungeon\n_-_ Max EXP required is increased by 50%\n_-_ Scroll of Identification is removed, Shard of Oblivion is still here\n\nAre you worthy enough to finish this challenge?
challenges.conquest=Conquest
challenges.conquest_desc=They began to be a greedy ones, those titles are not just for their honor, but also their life.\n\n_-_ Enemies will gain additional champion titles within 25% chance three times.
challenges.dance_floor=Dance Dance
challenges.dance_floor_desc=Dance, dance, dance\nEverybody dance, dance, dance\n\n- Floor is divided into 3x3 regions.\n- Regions change their colour every couple of turns\n- Default rotation is Green > Blue > Yellow > Purple\n- Once you step in a region, rotation changes to Red > Green > Blue > Black > Yellow > Purple for one full cycle.\n- Different effects depending on the region:\nRed: Characters standing in these regions take direct damage (massively increased vs hero)\nGreen: Characters standing in these regions acts at 2x speed\nBlue: Characters standing in these regions are stunned\nBlack: Characters standing in these regions take defered damage (massively increased vs hero)\nYellow: Mobs killed in these regions give double EXP and more loot\nPurple: Characters standing in these regions take double damage
