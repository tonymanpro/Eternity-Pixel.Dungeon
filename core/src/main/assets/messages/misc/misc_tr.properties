challenges.no_food=Diyette
challenges.no_food_desc=Gıda zaten kıt ama artık porsiyonlarına da dikkat etmek zorundasın!\n\n- Yemek ve bolluk borusu, açlığı normaldekinin üçte biri kadar geçirecek\n- Başka tokluk kaynakları bundan etkilenmeyecek
challenges.no_armor=İnancım zırhımdır
challenges.no_armor_desc=Zırhın pek bir işe yaramayacağı için kendine inanman gerekecek!\n\n- Kumaş hariç tüm zırhlar için temel engelleme gücü azaltıldı\n- Tüm zırhlar artık yükseltildiğinde çok az engelleme kazanıyor\n- Toprak gardiyan'ın savunma gücü de önemli ölçüde azaltıldı
challenges.no_healing=Ecza korkusu
challenges.no_healing_desc=İyileştirme iksirleri kesinlike kullanışlıdır, ne yazık ki sen alerjiksin!\n\n- İyileştirme iksirleri, iyileştirme iksirleri kullanılarak yapılan eşyalar ve güneş meyvesi, kahramanı iyileştirmek yerine zehirleyecektir\n- Dengesiz karışımlar kahramanı rastgele zehirleyemez veya iyileştiremez\n- Bu eşyalar diğer karakterler için normal şekilde çalışır.
challenges.no_herbalism=Kurak arazi
challenges.no_herbalism_desc=Bu lanetli zindanda temiz su kalmamış gibi görünüyor...\n\n- Şebnem taneleri kaldırıldı\n- Bitkiler kaldırıldı\n- Ekinler hala bulunabilecek fakat kök salmayacaklar
challenges.swarm_intelligence=Sürü aklı
challenges.swarm_intelligence_desc=Dikkatli ol, zindan canavarları gittikçe akıllanıyor!\n\n- Bir düşman seni farkettiğinde yakındaki düşmanlar da o noktaya yöneleceklerdir.
challenges.darkness=Karanlığa doğru
challenges.darkness_desc=Sonuçta burası bir zindan!\n\n-Normal görüş uzaklığı azaltıldı\n-Her katta bir meşale belirir\n-Diger ışık kaynakları 1/5 kadar efektif
challenges.no_scrolls=Yasak rünler
challenges.no_scrolls_desc=Belirli bir rünün bulunması artık daha zor. Maalesef o rün, en işe yarayanı.\n\n- Zindandaki yükseltme parşömenlerinin yarısı kaldırıldı
challenges.champion_enemies=Düşman şampiyonlar
challenges.champion_enemies_desc=Seviye atlayabilen tek kişi sen değilsin!\n\nNormal düşmanlar, 1. katta 1/8, 21. katta ise 1/6 oranında özel şampiyon güçlendirmesi ile ortaya çıkabilir.\n\n- Şampiyonlar uyku halinde ortaya çıktıklarında uyanırlar.\n- Kahraman, bir şampiyonun ortaya çıktığını bilir.\n- Şampiyonlar müttefik haline getirilemez.\n\nSekiz tip şampiyon düşman vardır:\n_Yanan (turuncu)_ +25% yakın dövüş hasarı, vuruşları yakar, ölünce ateş saçar, sulak zeminleri yakamaz\n-Erişen (mor)_ +25% yakın dövüş hasarı, +3 yakın dövüş menzili\n-Büyükıran (yeşil)_ -50% hasar azaltımı, büyü etkenlerine karşı bağışıklı\n-_Dev (mavi)_ -80% hasar azaltımı, +1 yakın dövüş menzili, dar yerlerden geçemez.\n-_Kutsanmış (sarı)_ 4x isabet ve kaçınma\n-_Gelişen (kırmızı)_ +20% isabet, kaçınma, hasar ve efektif can her 4 turda 1% artar.
challenges.stronger_bosses=Daha kötü patronlar
challenges.stronger_bosses_desc=Patronlar bu mücadeleyle daha da çetin!\n\n_Goo:_ +%20 Sağlık\n_-_Sulu alanlarda iyileşme 3/sıra\n_-_Pompa saldırısı 2 sıra yerine 1 sıra\n_Tengu:_+%25 Can\n_-_1. Aşama: Tuzaklar daha ölümcül\n_-_2. Aşama: Yetenekler daha sık\n_DM-300:_ +%33 can\n_-_ Kuleler daha dayanıklı ve 3 tanesi aktif\n_-_ Yetenekleri daha güçlü ve daha sık\n_-_DM-300 şarjlıyken daha hızlı\n_-_ Açıktaki kablolar iki kata kadar daha fazla\n_Cüce Kral:_ +%50 Can\n_-_ Minyonlar tüm aşamalarda daha güçlü\n_-_ 1. Aşama: Daha sık yetenekler ve minyon çağırmaları\n_-_ 2. Aşama: Her rauntta 2 tane daha minyon\n_-_ 3. Aşama: 2x Can, daha hızlı çağırma\n_Yog-Dzewa:_ \n_-_ Bir seferde 2 yumruk çağırma!\n_-_ +%60 lazer hasarı\n_-_ Daha güçlü minyonlar

