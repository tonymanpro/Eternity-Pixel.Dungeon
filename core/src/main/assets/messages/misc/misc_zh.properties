challenges.for_the_worthy=天选勇者
challenges.for_the_worthy_desc=当你背负着最糟糕的运气，却依然渴望成为传奇时，这项挑战就是为你准备的！\n\n_-_ 地牢中的战利品减半\n_-_ 力量合剂与强化幸运软管无效\n_-_ 防御力在此地牢中毫无用处\n_-_ 升级所需的最大经验值增加50%\n_-_ 移除鉴定卷轴，但遗忘碎片依然保留\n\n你是否有足够的资格完成这项挑战？
challenges.conquest=全面征服
challenges.conquest_desc=它们变得贪得无厌，那些头衔不仅关乎荣耀，更关乎性命。\n\n_-_ 敌人将有三次25%的概率获得额外的精英头衔。
challenges.dance_floor=热舞地牢
challenges.dance_floor_desc=跳舞，跳舞，尽情跳舞\n大家一起来跳舞，跳舞，跳舞\n\n- 楼层被划分为3x3的区域。\n- 区域每隔几个回合就会改变颜色\n- 默认轮换顺序为：绿 > 蓝 > 黄 > 紫\n- 一旦你踏入某个区域，该区域的轮换将在一个完整周期内变为：红 > 绿 > 蓝 > 黑 > 黄 > 紫。\n- 不同颜色的区域具有不同效果：\n红：站在该区域的角色受到直接伤害（对英雄伤害大幅提升）\n绿：站在该区域的角色行动速度翻倍（2x）\n蓝：站在该区域的角色会被眩晕\n黑：站在该区域的角色受到延迟伤害（对英雄伤害大幅提升）\n黄：在该区域被击杀的怪物提供双倍经验与更多战利品\n紫：站在该区域的角色受到双倍伤害
